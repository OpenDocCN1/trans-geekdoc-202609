- raw: "The sets of rules that define what traffic looks like and how it flows are\
    \ called *protocols*. They constitute the rules of engagement for the nodes that\
    \ each pipe connects.\n\nSimilar rules of engagement exist when we speak to one\
    \ another. At the lowest level, speech is just a sequence of vibrations. At the\
    \ level above this, we categorize short time-slices of vibrations as phonemes.\
    \ At the level above this, we categorize groups of phonemes as words and at the\
    \ level above this, we can talk about the language we are speaking, and ideas\
    \ such as speeches or conversations. A telephone can carry speech but it is only\
    \ aware of speech as vibrations. A voice recognition system, such as many automated\
    \ attendants, must understand speech at the higher level of phonemes and words.\
    \ An intelligent agent or chatbot must understand speech as conversation.\n\n\
    In the same way, protocols are arranged in a hierarchy that models different levels\
    \ of abstraction. The communication substrate just moves bits from one end to\
    \ the other (and a stream of bits doesn't contain any structure to reveal what\
    \ it “means”) using optical fiber, wire, or radio signals. The level above this\
    \ understands what the collection of bits means as units of communication. Levels\
    \ above this manage communication in terms of more complex processes, akin to\
    \ conversations, including dealing with what happens when the ends become unsynchronized.\n\
    \n# [5.1IP](#contents.xhtml#sec5_1)\n\nAt the lowest level (other than just moving\
    \ bits) is a protocol that describes how data moves in units, but only simple\
    \ units. This is called the *Internet Protocol* (IP), or IP. It is responsible\
    \ for delivering a single chunk of information (in a unit called a *packet*) from\
    \ a source IP address (the sending computer) to a destination IP address (the\
    \ receiving computer).\n\nThese two computers won't usually be directly connected,\
    \ so the protocol is responsible not just for moving it from one end of a pipe\
    \ to the other, but also directing it through a sequence of pipes to get it to\
    \ the right place. It uses routing tables at each intermediate node to direct\
    \ each packet so that, at each step, it moves closer to its destination.\n\nThe\
    \ real world analogue is sending physical mail. The post office receives a letter\
    \ in one location and makes its best effort to deliver it at another. On the way,\
    \ it passes through sorting offices that each send it on the correct next stage\
    \ of its journey.\n\nJust like physical mail, IP delivery is best effort and the\
    \ sender is not informed that the packet has been received\n\nIn IP, every packet\
    \ is treated independently of all of the others, so even packets sent from the\
    \ same source to the same destination do not necessarily follow the same path,\
    \ and are not guaranteed to arrive at the destination in the order in which they\
    \ were sent. This also happens with physical mail.\n\nThe pipes that a particular\
    \ packet might traverse along the stages of its journey do not all necessarily\
    \ have the same capacities. In particular, a packet might encounter a pipe that\
    \ can only handle smaller packet sizes (rather like following a short cut while\
    \ driving and encountering a low bridge). IP has a mechanism for dividing up large\
    \ packets into small ones and the reassembling them at their destination. This\
    \ is rather like being able to take a parcel and slicing it into thin segments\
    \ so that it could be sent looking just like a collection of letters. Unfortunately,\
    \ IP's mechanism for taking packets apart and reassembling them is simplistic—it\
    \ relies on each piece recording only how far it was from the beginning of the\
    \ original packet—which creates opportunities for easy manipulation.\n\n# [5.2TCP](#contents.xhtml#sec5_2)\n\
    \nAlthough we managed to use a physical postal service for more than a century,\
    \ it has obvious drawbacks as a model for data transmission in cyberspace. Two\
    \ more-abstract protocols are built on top of IP. Traffic using these higher-level\
    \ protocols is divided into IP packets and transmitted using IP, but they don't\
    \ need to be aware of how this is done. Instead of seeing pipes as simple bit-moving\
    \ connectors, they see the pipes as IP traffic movers. These higher-level protocols\
    \ provide the features missing from IP such as guaranteed delivery and management\
    \ of the rate of flow.\n\nThe most important, and the standard protocol for the\
    \ Internet, is the *Transmission Control Protocol* (TCP) (TCP). It is so common\
    \ that you often see it linked with IP as TCP/IP. TCP provides these features\
    \ missing from IP:\n\n*   Stateful connections between endpoints, creating *sessions*\
    \ (rather than just one-way single-packet delivery). A session is the analogue\
    \ of a conversation: it has a beginning and an end, and both ends are responsible\
    \ for managing it while it is in existence.\n\n    Setting up a connection requires\
    \ one end to send a control *segment*\n\n*   Acknowledgements of packet arrival,\
    \ so that lost segments can be detected (by timeouts) and sent again by the sender\
    \ (at the other end of the session).\n\n    Because both ends know that they have\
    \ a session going, both are expecting traffic from the other end. Once a segment\
    \ has arrived, the receiver must acknowledge it within a given time (which both\
    \ ends can agree to adjust). If the sender does not receive the acknowledgement,\
    \ it assumes the segment has been lost and retransmits it\n\n*   Delivery of data\
    \ to the destination node in the order in which it was sent, using *sequence numbers*\
    \ carried by each segment. When a segment is delayed or lost, any subsequent segments\
    \ received by the destination are held until the missing piece arrives. As a result,\
    \ significant space must be reserved at the destination for reassembling.\n\n\
    *   Control of congestion by signalling when the sender should stop sending to\
    \ allow the receiver to catch up.\n\n*   A more sophisticated addressing scheme\
    \ using both a IP address and a *port number* for both sender and receiver. Each\
    \ piece of software running on a node and expecting to interact with the outside\
    \ world uses a particular port. For some common software, the port numbers they\
    \ use are decided beforehand and widely known—for example, web traffic uses port\
    \ 80, email uses port 25, and the Domain Name Service uses port 53. Other software\
    \ chooses a port number each time it is started. These combinations of IP address\
    \ and port number identify both the node and the particular software running on\
    \ it so that data comes from and is delivered to the right place.\n\nTCP provides\
    \ robust communication between two devices on the Internet, but it can be relatively\
    \ slow if some of the pipes en route are small, when there is congestion, or when\
    \ the time to travel from one end to the other is long.\n\n# [5.3UDP](#contents.xhtml#sec5_3)\n\
    \nFor settings where the rate of delivery is critical, a second higher-level protocol\
    \ is also available. It is called the *User Datagram Protocol* (UDP) (UDP) and\
    \ it provides the same kind of functionality as IP—best-effort delivery without\
    \ ordering or error control—but with IP address + port addressing. So UDP trades\
    \ reliable delivery against fast end-to-end delivery.\n\nUDP is used in applications\
    \ where delay is more important than the occasional loss of a packet. Applications\
    \ are typically those that require streaming data primarily in one direction.\
    \ Examples include Voice-over-IP (VOIP), and video transmission (Skype, Netflix).\
    \ It is also sometimes used with local networks where high reliability can be\
    \ assumed (for example, in the Remote Desktop Protocol) since it avoids the overheads\
    \ of TCP.\n\n# [5.4Attacks leveraging protocols](#contents.xhtml#sec5_4)\n\nAll\
    \ of these protocols were designed for an environment that was much more trusted,\
    \ and to deal with systems that had greater performance constraint than most of\
    \ our systems today. As a result they are conspicuously easy to attack.\n\nHere\
    \ are some of the common attacks that involve pipes:"
  fmt: "\n# 协议层级与网络通信\n\n定义流量外观及流动方式的规则集称为**协议**。它们构成了每根管道所连接节点的交战规则。\n\n人类交谈时也存在类似的交战规则。在最底层，语音只是一系列振动。在更高一层，我们将短时振动片段归类为音素。再往上，将音素组合归类为单词。最上层则涉及语言、演讲或对话等概念。电话能传输语音，但它仅将语音视为振动。语音识别系统（如许多自动话务员）必须在音素和单词的更高层级理解语音。智能代理或聊天机器人则必须将语音理解为对话。\n\
    \n同理，协议按层级排列，对应不同抽象层次。通信底层仅通过光纤、导线或无线电信号将比特从一端移动到另一端（比特流本身不包含任何揭示其“含义”的结构）。上一层理解比特集合作为通信单元的含义。更高层管理更复杂的通信过程（类似对话），包括处理两端不同步的情况。\n\
    \n## 5.1 IP 协议\n\n在最底层（仅移动比特之上）是一种描述数据如何以单元移动的协议，但仅限简单单元。这就是**互联网协议**，即 `IP`。它负责将单个信息块（以**数据包**为单位）从源\
    \ `IP` 地址（发送计算机）传递到目标 `IP` 地址（接收计算机）。\n\n这两台计算机通常不会直接相连，因此该协议不仅负责将数据从管道一端移至另一端，还负责通过一系列管道将其导向正确位置。它利用每个中间节点的路由表引导每个数据包，使其在每一步都更接近目的地。\n\
    \n现实类比是寄送实体邮件。邮局在一地收到信件，尽力投递到另一地。途中会经过分拣办公室，每个办公室将其发往旅程的正确下一阶段。\n\n正如实体邮件一样，`IP`\
    \ 传递是尽力而为的，发送方不会收到数据包已送达的通知。\n\n在 `IP` 中，每个数据包独立于其他所有数据包处理，因此即使从同一来源发往同一目的地的数据包，也不一定遵循相同路径，也不保证按发送顺序到达。实体邮件也存在这种情况。\n\
    \n某个数据包在旅程各阶段可能经过的管道，其容量不一定相同。特别是数据包可能遇到只能处理较小数据包尺寸的管道（类似开车走捷径却遇到限高桥）。`IP` 拥有将大数据包分割成小数据包并在目的地重组的机制。这类似于将包裹切成薄片，使其看起来像一堆信件即可发送。遗憾的是，`IP`\
    \ 拆分和重组数据包的机制过于简陋——它依赖每个片段仅记录其距原始数据包开头的距离——这给轻易篡改创造了机会。\n\n## 5.2 TCP 协议\n\n尽管我们使用实体邮政服务已超一个世纪，但它作为网络空间数据传输模型有明显缺陷。两个更抽象的协议构建在\
    \ `IP` 之上。使用这些高层协议的流量被分割成 `IP` 数据包并通过 `IP` 传输，但它们无需知晓具体实现方式。它们不再将管道视为简单的比特移动连接器，而是视为\
    \ `IP` 流量传输器。这些高层协议提供了 `IP` 缺失的功能，如保证交付和流速管理。\n\n最重要且作为互联网标准的协议是**传输控制协议**，即 `TCP`。它太常见了，以至于常与\
    \ `IP` 连用称为 `TCP/IP`。`TCP` 提供了 `IP` 缺失的以下功能：\n\n*   **端点间的有状态连接，创建会话**（而非单向单数据包投递）。会话类比对话：有始有终，存在期间双方均负责管理。\n\
    \    \n    建立连接要求一端发送控制**段**。\n*   **数据包到达确认**，以便通过超时检测丢失的段，并由会话另一端的发送方重发。\n \
    \   \n    因双方知晓会话存在，均预期来自对方的流量。段到达后，接收方必须在约定时间内确认（双方可协商调整）。若发送方未收到确认，则假定段丢失并重传。\n\
    *   **按发送顺序向目标节点交付数据**，利用每个段携带的**序列号**。当某段延迟或丢失时，目标节点接收到的后续段会被保留，直到缺失片段到达。因此，目标端必须预留大量空间用于重组。\n\
    *   **拥塞控制**，通过信号告知发送方何时停止发送以便接收方追赶进度。\n*   **更复杂的寻址方案**，发送方和接收方均使用 `IP` 地址和**端口号**的组合。节点上运行的每个预期与外界交互的软件使用特定端口。某些常用软件的端口号预先确定且广为人知——例如\
    \ Web 流量用端口 `80`，邮件用端口 `25`，域名服务用端口 `53`。其他软件每次启动时选择端口号。这些 `IP` 地址和端口号的组合标识了节点及其上运行的特定软件，确保数据来自并送达正确位置。\n\
    \n`TCP` 为互联网上两设备提供稳健通信，但若路径上某些管道较小、发生拥塞、或两端传输时间长，速度会相对较慢。\n\n## 5.3 UDP 协议\n\n\
    在交付速率至关重要的场景下，还有一种可用的高层协议。它称为**用户数据报协议**，即 `UDP`，提供与 `IP` 同类功能——尽力而为交付，无排序或错误控制——但具备\
    \ `IP` 地址 + 端口寻址。因此 `UDP` 以牺牲可靠交换换取快速端到端交付。\n\n`UDP` 用于延迟比偶尔丢包更重要的应用。此类应用通常主要单向流式传输数据。例如网络电话（`VOIP`）、视频传输（`Skype`、`Netflix`）。有时也用于可假设高可靠性的局域网（如远程桌面协议），因其避免了\
    \ `TCP` 的开销。\n\n## 5.4 利用协议的攻击\n\n所有这些协议设计之初环境更受信任，面对的系统性能约束比当今大多数系统更大。因此它们极易受到攻击。\n\
    \n以下是涉及管道的一些常见攻击：\n"
