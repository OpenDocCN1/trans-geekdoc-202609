    ## Active cyber operations


    Governments also increasingly use, or plan to use, malware as a weapon. Part of
    the attraction is that, should such malware be discovered, attributing it to the
    state that placed it there can be difficult (at least with enough certainty to
    respond). Malware like this can also be placed in position but not enabled until
    it is needed, so it acts like a trojan horse.


    There have been a number of uses of malware in support of strategic state aims,
    from causing oil pipelines to explode and catch fire to the Stuxnet malware which
    destroyed Iranian uranium centrifuges.


    ## Ways nodes affect associated humans


    There are also a number of ways in which nodes are used to affect the humans associated
    with them (rather than affecting the nodes themselves).


    ### Cyberbullying


    Software platforms often convey information that is intended to disturb recipients.
    This can be either directed to specific individuals, a common problem for youth
    but not limited only to them; or directed to another group at large where it is
    known as hate speech or abusive language. Motivations are often obscure but self-loathing
    or othering have been advanced as possible explanation.


    ### Scams mediated by messaging


    There are many crimes that use cyberspace as their means of reaching large numbers
    of vulnerable or gullible people. This can range from spam emails that promise
    various unlikely things such as enlarging body parts or inheriting fortunes, to
    scams where the sender pretends to be a government department and tries to collect
    money in the form of owed tax or fines. A variation on this theme is malware that
    causes malfunctions on the node, and then offers to sell the user a solution that
    will get rid of the malfunctions.


    ### Disinformation


    Software platforms are also used to convey information intended to affect a political
    outcome, either generally to sow doubt about the democratic process generally,
    or specifically in favor of or against particular political candidates.


    ## Secondary market for cyber tools


    There is also a secondary market for criminals in supplying cyber tools and exploits
    to other criminals, often via dark-web marketplaces.


    ## Malware against servers, clouds, and IoT


    So far, we have discussed malware in the context of individual computers, but
    malware can also be used against servers and clouds. These larger systems are
    harder to attack in the sense that they are managed by trained people who are
    less likely to introduce malware accidentally. On the other hand, clouds at least
    are usually shared among many separate users, and malware in the space of one
    user can, in certain circumstances, interact with the space of another.


    Ransomware is beginning to be used as an attack against these larger systems.
    Malware designed for intellectual property theft can also be installed on servers
    and clouds to look for interesting content to exfiltrate.


    Internet of Things devices have also been attacked. One major reason is to turn
    them into bots that can then be used to mount denial of service attacks against
    other systems. But IoT devices can also be used for extortion. For example, video
    baby monitors can be attacked so that they make horrifying or annoying sounds
    in a baby''s room, smart lightbulbs can be made to flash randomly or refuse to
    turn on. As more and more IoT devices are placed in settings where their behavior
    matters, such attacks will become more common. For example, house doors can be
    unlocked remotely and heating and cooling systems turned off (or on) by criminals
    remotely. Even being able to tell that a light or television is off could provide
    information to enable a physical-world burglary.


    Most malware will leave a hook in a system that it has infected so that subsequent
    intrusions are easier. This is even more typical for large systems because they
    are much juicier targets. These hooks can be hidden in such a way that, if the
    malware itself is discovered and removed, the hook may still lie undiscovered.


    # 4.4 Direct attacks


    The attacks we have considered so far have been either (a) on Internet-facing
    systems that can be attacked externally, for example, by denial of service, or
    (b) attacked because of actions by an authenticated user of the system who has
    opened a gate to let the attack in, for example, because of phishing. But what
    can an attacker do when the target system has limited access and/or doesn''t have
    normal users active on it?


    For example, a web server is Internet-facing, but there are not usually ordinary
    users logged into it. The server that manages a database of business-critical
    information is not Internet-facing, and also usually doesn''t have ordinary users
    logged into it—it is accessed remotely, but only from within the business.


    So how can systems that are deep within the subnetwork of an organization be attacked?
    They have to be attacked using vulnerabilities in the pipes that connect to them
    and vulnerabilities in the nodes themselves.


    Nodes are open to attack because they are extremely complex, and there are inevitable
    mistakes made in design and implementation that create vulnerabilities. Nodes
    are regularly updated to provide new functionality, but many of these updates
    are to address security vulnerabilities that have been discovered. If nodes are
    regularly updated then these vulnerabilities are removed, and an attacker can
    only use a *zero day attack*, one that relies on a vulnerability that has not
    yet been discovered and fixed by the system owner. For this reason, zero day vulnerabilities
    are valuable commodities for criminals and governments, all the more so as they
    reveal their existence when anyone uses them, and so tend to have a short shelf
    life.


    Pipes cannot be easily and regularly updated because they are a shared construct
    that many different nodes use. A pipe update is a bit like us all agreeing that
    we will speak Esperanto—it requires a lot of agreement and is very costly. So
    pipe vulnerabilities are important enablers of attacks on nodes.


    Attacking a node deep within an organization''s network is a complex problem because
    it may require attacking intermediate nodes in order to build a bridgehead to
    reach the target system. We will return to this after the discussion of pipes
    and configuration.


    # Chapter 5: Pipe security


    The pipes that convey data from one place to another look, at first glance, as
    if they should be simple—data in at one end, and data out at the other. The reality
    is more complex.


    Consider a train track between two towns. At its simplest, it''s just the continuous
    set of rails running from one to the other. But getting people and freight from
    one town to the other requires more than just the rails—there must be rolling
    stock to carry different kinds of content: passenger cars for people, container
    cars, liquid-holding cars specialized for chemicals or milk, bulk carrier cars,
    track inspection vehicles, and many more types. Some of these can move themselves
    (for example, railcars) but others must be pulled by locomotives. Trains are made
    by assembling these pieces into ensembles that travel down the tracks as a unit,
    and so there must be space to collect them at one end and redistribute them at
    the other. There must be a way to detect that a train did not arrive at its destination
    (because of a derailment or engine failure). Sometimes trains run over tracks
    that belong to different organizations, or even different countries, without necessarily
    knowing it.


    The situation is the same for pipes in cyberspace. Pipes carry a mixture of different
    kinds of traffic with different requirements and, because of packet switching,
    these different kinds are interleaved. The pipes have no intelligence, so all
    of the decisions about what happens in exceptional circumstances are the responsibility
    of both ends, which must therefore be able to agree.

    '
  trans: '


    ## 主动网络行动


    各国政府也越来越多地使用恶意软件作为武器，或计划将其用作武器。其吸引力之一在于，即便此类恶意软件被发现，将其归因于植入它的国家也很困难（至少难以达到足以采取反制措施的确定程度）。此类恶意软件还可以预先植入但不启用，直到需要时才激活，因此其作用类似于特洛伊木马。


    已有多起利用恶意软件支持国家战略目标的案例，从导致石油管道爆炸起火，到“震网”病毒摧毁伊朗铀浓缩离心机。


    ## 节点影响关联人类的方式


    节点被用来影响与其相关的人类（而非影响节点本身）的方式也有若干种。


    ### 网络霸凌


    软件平台经常传递旨在骚扰接收者的信息。这可能针对特定个人，这是青少年群体的常见问题，但不限于他们；也可能针对某个群体，此时被称为仇恨言论或辱骂性语言。动机往往晦涩难懂，但自我厌恶或“他者化”被认为是可能的解释。


    ### 由消息传递介导的诈骗


    有许多犯罪利用网络空间作为手段触达大量脆弱或轻信的人。这范围可以从承诺各种不切实际之事的垃圾邮件（如身体部位增大或继承巨额财产），到发件人冒充政府部门、试图以欠税或罚款名义骗取钱财的诈骗。此类手法的一个变种是：恶意软件导致节点故障，然后向用户推销可消除故障的“解决方案”。


    ### 虚假信息


    软件平台也被用来传播旨在影响政治结果的信息，要么是笼统地播撒对民主进程的怀疑，要么是专门支持或反对特定政治候选人。


    ## 网络工具的二级市场


    还存在一个面向犯罪分子的二级市场，向其他犯罪分子提供网络工具和漏洞利用代码，通常通过暗网市场进行交易。


    ## 针对服务器、云和物联网的恶意软件


    到目前为止，我们在个人计算机的背景下讨论了恶意软件，但恶意软件也可用于攻击服务器和云。这些大型系统更难攻击，因为它们由受过训练的人员管理，后者不太可能意外引入恶意软件。另一方面，云通常由许多独立用户共享，在特定情况下，某一用户空间内的恶意软件可能与另一用户的空间发生交互。


    勒索软件开始被用作针对这些大型系统的攻击手段。用于窃取知识产权的恶意软件也可安装在服务器和云中，以搜寻有趣的内容并将其窃取。


    物联网设备也遭到攻击。一个主要原因是将它们变成僵尸网络节点，进而用于对其他系统发起拒绝服务攻击。但物联网设备也可用于勒索。例如，视频婴儿监视器被攻击后会在婴儿房内发出恐怖或恼人的声音，智能灯泡会随机闪烁或拒绝亮起。随着越来越多的物联网设备被部署在其行为至关重要的场景中，此类攻击将变得更普遍。例如，房门可被远程解锁，供暖和制冷系统可被犯罪分子远程关闭（或开启）。甚至仅能判断灯或电视是否关闭，就可能提供信息以便实施现实世界的入室盗窃。


    大多数恶意软件会在受感染系统中留下一个“钩子”，以便后续入侵更容易。对于大型系统而言，这更为典型，因为它们是更诱人的目标。这些钩子可以隐藏得很好，以至于即使恶意软件本身被发现并清除，钩子仍可能未被察觉。


    # 4.4 直接攻击


    我们迄今考虑的攻击要么是 (a) 针对面向互联网的系统，可从外部发起攻击，例如拒绝服务攻击；要么是 (b) 因经过认证的系统用户的行为而遭受攻击，这些用户为攻击打开了大门，例如因网络钓鱼。但当目标系统访问受限且/或没有正常活跃用户时，攻击者能做什么？


    例如，Web 服务器面向互联网，但通常没有普通用户登录其中。管理业务关键信息数据库的服务器不面向互联网，通常也没有普通用户登录——它是远程访问的，但仅限于企业内部。


    那么，组织子网深处的系统如何被攻击？必须利用连接它们的“管道”中的漏洞以及节点本身的漏洞来攻击。


    节点之所以容易受攻击，是因为它们极其复杂，设计和实现中不可避免地存在错误从而产生漏洞。节点会定期更新以提供新功能，但许多更新是为了修复已发现的安全漏洞。如果节点定期更新，这些漏洞就会被消除，攻击者只能使用“零日攻击”，即依赖尚未被系统所有者发现和修复的漏洞。因此，零日漏洞是犯罪分子和政府的宝贵商品，尤其是因为一旦被使用就会暴露其存在，因此往往“保质期”很短。


    “管道”难以轻易且定期更新，因为它们是许多不同节点共用的构造。管道更新有点像让我们所有人都同意说世界语——需要大量共识且成本高昂。因此，管道漏洞是节点攻击的重要推手。


    攻击组织网络深处的节点是一个复杂问题，因为它可能需要先攻击中间节点，以建立桥头堡从而到达目标系统。我们将在讨论管道和配置后回到这个话题。


    # 第 5 章：管道安全


    传输数据从一处到另一处的“管道”，乍看之下似乎很简单——一端数据进，另一端数据出。现实则更复杂。


    设想两座城镇之间的铁轨。最简单形式下，它只是从一座城镇延伸到另一座城镇的连续钢轨。但要将人员和货物从一座城镇运到另一座，光有钢轨是不够的——必须有车厢承载不同种类的内容：供人乘坐的客车、集装箱车、专门装化学品或牛奶的液体罐车、散货车、轨道检查车等多种类型。其中一些可自行移动（如轨道车），但其他必须由机车牵引。列车通过将这些部件组装成编组，作为一个整体沿轨道行驶，因此一端必须有空间集结它们，另一端有空间解编重组。必须有办法检测列车是否未到达目的地（因脱轨或机车故障）。有时列车会在不属于同一组织甚至不同国家的轨道上运行，而不一定知情。


    网络空间中的“管道”情况相同。管道承载着混合的、具有不同需求的流量，且由于分组交换，这些不同种类的流量被交织在一起。管道本身没有智能，因此关于异常情况下发生什么的所有决定，都是双端的责任，双端因此必须能够达成一致。


