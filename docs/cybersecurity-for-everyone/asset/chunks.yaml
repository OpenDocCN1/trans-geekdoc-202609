- raw: '*   Attacks on the (distributed) governance structure that balances the power
    of software developers, the set of potential publisher nodes, and the users themselves.
    Each of these groups has some leverage over the others, and enough malicious members
    of any one of them can destroy or corrupt the blockchain. Poorly written software
    can also cause issues, even if it is only created by accident. For example, software
    errors in the code used to move value from the financial system to a cryptocurrency
    blockchain have led to value totally disappearing—it is, so to speak, in the blockchain
    but in a way that prevents it ever being transferred or extracted.


    *   Botnet-based attacks to gain the rewards of becoming a publisher node. Unscrupulous
    actors have used botnets to carry out the required calculations, even to the extent
    of using the browsers of unsuspecting users as computational engines. Since such
    a publisher node does not have to pay for electricity or equipment, the economic
    cost-benefit of proof or work is more attractive.


    *   Attacks that exfiltrate private keys, that is, steal digital wallets. Since
    private keys must be stored somewhere (they are too long to type in each time),
    they represent an attractive target. Malware can either search the computers of
    cryptocurrency users looking for strings of the right length to be a private key,
    or watch the cut-and-paste buffer when the user is transferring value to or from
    the blockchain; and then steal that string.


    *   Denial of Service attacks carried out against the nodes of the blockchain
    network preventing them from seeing new transactions, and so not competing to
    become the publisher node for them. This can disrupt the entire operation of the
    blockchain, or skew the competition by eliminating some potential publisher nodes
    from the competition in a round.


    Blockchains rely on the cryptographic protocols they use being, and remaining,
    strong enough. There have been several examples of holes in either the algorithms
    themselves, or in how they were implemented. They face a special problem because
    they are intended to be a permanent record. It is therefore hard to change the
    fundamentals of the way they work without creating a break from the previous state
    of the blockchain; and sharp changes like this often create mistakes and vulnerabilities.


    # [Chapter 8](#contents.xhtml#chapter8)


    # [Summary](#contents.xhtml#chapter8)


    Most of the challenges of cybersecurity can be traced back, ultimately, to the
    origins of the Internet in the research network called Arpanet. Arpanet connected
    small numbers of universities and U.S. government research labs so its users were
    trusted and accountable. Arpanet was also designed to survive a nuclear attack
    and so its operations and control were distributed by design.


    Arpanet was never intended to be the foundation for a global network that now
    connects half the world''s population, and many billions of devices. Today''s
    Internet reaches into every nation on earth, and has capabilities that could not
    have been imagined by the original designers of Arpanet, including the World Wide
    Web, ecommerce, online banking and financial services, social network platforms,
    distributed control of pipelines and electricity grids, and remotely controlled
    lightbulbs and thermostats. As well as being extremely large, the Internet is
    dynamic because devices come and go as they are turned on and off or fail, and
    because data flows over the momentarily best path between each source and destination.


    The distributed nature of Arpanet meant that, as it developed into the Internet,
    there was no central control of what would happen and how it would happen. There
    is still no central governance that can force all hardware and software developers
    to act in a certain way. As a result, global decisions are complex, and require
    negotiations between a variety of stakeholders; and so they are rare. Most changes
    to the Internet are driven by the desire for new functionality, and those who
    want to make them must get buy-in from those who must also change. The size, distributed
    governance, and inertia of the Internet community, and the need for backwards
    compatibility mean that changes that have obvious benefits either cannot be made,
    or can only be made slowly.


    Security is not the kind of property that can be added into a system that has
    already been designed. While the design of a bridge can be altered to make it
    bear a 30% greater load, a complex software/hardware system cannot really be altered
    to make it 30% more secure. The more-secure design must be started from the beginning,
    an impossibility when the system already exists. All the can be done is hardening,
    adding *ad hoc* features to make breaching security a little more difficult. There
    are perennial proposals to design and build Internet 2.0 but all have foundered
    on the sunk costs of the current Internet.


    Much of the security in the Internet is built around the metaphor of a castle—high,
    protective walls, with gates the constrain data movement, allowing it only with
    authentication. Authentication continues to be a complex problem, because of the
    large number of identities in play, and because the point of authentication is
    typically far from the system being authenticated. Many kinds of data flow freely
    because there isn''t a way to authenticate them robustly (email) or there are
    commercial reasons not to (the World Wide Web).


    There is also little demand from Internet users for greater security, at least
    when counter-balanced by the lure of new Internet-based services. It is a truism
    that convenience always trumps security in practice.


    The Internet began with an infrastructure that didn''t pay much attention to cybersecurity;
    its explosive growth in scale and functionality provided little incentive or opportunity
    to add in security features; and its distributed nature and governance meant that
    there was no leverage to force better security in the face of developers and users
    who preferred other features. The difficulties of cybersecurity almost all trace
    back to this history and these drivers.


    Cybersecurity that could (at least in theory) have been reduced to a tractable
    problem has become a war of attrition. The adversaries in this war are of three
    kinds: vandals, who are destructive for the fun of it; criminals, who use cyberspace
    as a platform and mechanism for making money from crime; and nations who use cyberspace
    as an intelligence-gathering platform and, increasingly, as a tool for national
    policy.


    They are able to achieve their gains because of the weaknesses in the design and
    operation of cyberspace, but also because ordinary users of cyberspace are not
    sufficiently aware of the dangers. Much of what happens in cyberspace is invisible
    to ordinary users. This is, from one perspective, a success story since it hides
    great complexity from ordinary people; but it also means that they don''t know
    which things they do in cyberspace are safe, which are risky, and which are dangerous.
    Education can help with this problem, but cyberspace is changing fast, so advice
    that was sensible a few years ago may not be today.


    The fight to make cyberspace more secure has two prongs. The first is to continue
    to harden the hardware and software that instantiates cyberspace as much as possible.
    The problem is that hardening cyberspace is a global good, but inevitably costs
    some organizations much more than others—so it is underresourced, and good ideas
    fail for lack of access to the points where they could make a difference.


    The second prong is to use law enforcement to penalize those who misuse cyberspace.
    There are many issues with this: the varying legal frameworks in different jurisdictions
    and the lag between the law and the exploits the criminals use; the skill sets
    of law enforcement personnel; and the ability of criminals to live in one country
    and commit crimes in another.'
