    # Preface


    Cyberspace is a critical part of all of our lives. Although we all use it, much
    of its infrastructure and operation is invisible to us.


    The origins of this pervasive system lies in a network developed by the U.S government''s
    Advanced Research Projects Agency (ARPA) which was originally designed to connect
    government and university research labs. Participants were trusted and accountable
    and, as a result, security received hardly any attention.


    The consequences are still with us. This small network grew like a weed until
    it connects many billions of computational devices across the world. At every
    stage, design decisions were made in a way that prioritized the next great thing,
    and security still received hardly any attention.


    So we find ourselves with an environment, cyberspace, that is, close to an essential
    service for many of us, but requires a significant effort to prevent the negative
    consequences of criminality, actions by governments for whom cyberspace acts as
    a cheap force multiplier, and the unthinking actions of the bored and careless.


    Making cyberspace more secure is one of the challenges of our times. This is not
    only (or perhaps even primarily) a technical challenge. It requires actions by
    governments and businesses to encourage security whenever possible, and to make
    sure that their own actions do not undermine it.


    Unfortunately, some of those in position to cause improvements in cybersecurity—lawyers,
    politicians—do not have the skills to understand the issues fully. This book is
    intended to help that situation by giving a description of the issues that is
    accessible to those from non-technical backgrounds.


    This isn''t a research monograph, so I haven''t included references to the research
    literature. For those who want to pursue any particular topic more deeply there
    are plenty of web sites that will provide further information. I hope that what
    you read here will be enough to understand these more technical presentations.


    Successful books today seem to either have titles with three verbs, on the model
    of "Eat, Pray, Love" or contain the word "girl". I couldn''t come up with a title
    of the second kind, and I didn''t think "Compute, Attack, Defend" really worked
    as a title of the first kind.


    # Chapter 1


    # Introduction


    Cyberspace, the combination of computer systems, devices, and the networks that
    connect them, is pervasive. The most obvious part of cyberspace, and the one that
    most people have encountered, is the Internet, but there are many other components
    to cyberspace: automated production lines, separate military networks, and dark
    corners that are technically part of the Internet, but difficult for ordinary
    users to access. We as individuals use cyberspace visibly for work, for shopping,
    and for entertainment; but it is used less visibly, but more importantly, for
    keeping our societies running, in manufacturing, services, financial markets,
    and government.


    Although cyberspace is pervasive, most of its structures are invisible to us even
    when we are using them. We interact with it via phones or computers, but the servers
    that power web sites and allow us to manage our bank accounts, to book travel
    and hotels, and communicate using email or social media are not easily appreciated.
    The "plumbing" that connects our interface devices and these services is also
    almost entirely hidden. Making this huge, complex system so unobtrusive and seamless
    from a user perspective is a major success.


    However, from a security perspective, the invisible nature of cyberspace creates
    an issue—people have no intuition about how it works, and so cannot easily judge
    which actions are potentially dangerous. It''s a bit like visiting a tourist-focused
    city and accidentally straying into a bad neighborhood simply by not realizing
    that such neighborhoods exist. It''s hard to assess the risk of any particular
    action in cyberspace, and many of the "rules" come without explanation, or at
    least without meaningful explanation, that would enable users to understand when
    rules have reasonable exceptions. For example, a common rule is "don''t open email
    attachments from people you don''t know" but this is often unworkable in practice.
    If you don''t know that `From:` email addresses can be spoofed then the apparent
    converse "it''s ok to open attachments from people that you do know" will sometimes
    lead to unfortunate actions.

