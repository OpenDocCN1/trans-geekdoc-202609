- raw: "*   *Eavesdropping*. The entire content of packets and segments is readable\
    \ unless the payload part is encrypted before it reaches the TCP protocol. Even\
    \ if the payload is encrypted, all of the details of where the data is flowing\
    \ and how much is flowing is completely visible within the network.\n\n    This\
    \ requires access to the network traffic as it is flowing. This can be done via\
    \ physically tapping traffic (in point-to-point pipes), listening in if the network\
    \ is wireless, or convincing the network interface hardware to copy all of the\
    \ traffic to nodes in its local region (a functionality originally useful for\
    \ detecting problems, but still all too commonly available).\n\n    Much of the\
    \ traffic in cyberspace is unencrypted, so this content can be easily captured\
    \ and read. For encrypted traffic, the protocol headers are still visible, since\
    \ the nodes must be able to tell where to send each segment and packet. Traffic\
    \ analysis reveals how much traffic is flowing between each pair of endpoints,\
    \ and at what times, The port numbers (in TCP and UDP) are often associated with\
    \ particular apps, so it is possible to tell what apps are communicating. Sometimes,\
    \ even when the activity involved multiple apps within a single stream, the packet\
    \ size profiles can reveal which apps are in use. This can enable the functions\
    \ of particular computers to be inferred. For example, a web server or print server\
    \ will have characteristic traffic patterns. Traffic analysis\n\n*   *Spoofing\
    \ addresses*. Fake traffic can be sent at will, and legitimate traffic redirected\
    \ because the IP (and port number) fields in packet and segment headers are not\
    \ protected. Changing the destination addresses sends traffic to the wrong place,\
    \ perhaps to a computer that pretends to be the real one. Changing the source\
    \ address makes it possible to generate malicious traffic but make it seem as\
    \ if it comes from somewhere else. (This is one of the reasons that attribution\
    \ of cyberattacks is difficult, since it's straightforward to conceal where traffic\
    \ originated.)\n\n*   *Altering content*. If the payload is not encrypted then\
    \ it can be altered or replaced without leaving a trace. So the content of some\
    \ traffic can be replaced undetectably if it is done with care.\n\n    Some parts\
    \ of the segment headers contain checksums, simple functions derived from the\
    \ content. These are far from digital hashes; they were designed to catch errors\
    \ in transmission, not deliberate alterations. If content is altered, the corresponding\
    \ checksum may have to be recomputed and changed to match, but this is straightforward.\n\
    \n    This flaw in all three protocols is perhaps the main reason why the use\
    \ of encryption for all traffic is becoming common.\n\n*   *Fragmentation attacks*\
    \ in IP. IP can break large packets into smaller fragments so that data can traverse\
    \ links that are too thin for typical packets. Each fragment contains a field\
    \ that describes how far from the beginning of the initial, larger payload it\
    \ came from. When all of the fragments arrive at the destination (and they may\
    \ not) IP reassembles them using these fields as offsets. However, these offsets\
    \ are not checked for plausibility. If an attacker alters these offsets enroute,\
    \ the reassembly process can cause some parts of the payload to be overwritten\
    \ by other parts. The resulting packet payload need have no resemblance to the\
    \ way it started out.\n\n    This is not used to corrupt a packet, which could\
    \ be done directly. Rather the packets carrying the fragments can be made to look\
    \ innocuous, to a firewall say, while being reassembled into a packet that the\
    \ firewall would have blocked.\n\n*   *Denial of service*. TCP (and, to a lesser\
    \ extent, UDP) have some state in the interactions between endpoints, and there\
    \ are attacks that leverage this. The simplest is called a SYN flood attack. Because\
    \ TCP sessions require a 3-step interaction to set up a session, an attacker can\
    \ carry out the first step—requesting a session—and ignore the resulting response\
    \ from the target. The target has to keep track of all of the sessions it is in\
    \ the process of setting up. When the space allocated for this is full, it can\
    \ accept no further connection requests, even legitimate ones; but the slots in\
    \ the table of ongoing connections filled by the attack are never resolved. This\
    \ is rather like phoning a restaurant, making many reservations under different\
    \ names for the same time slots, and then never turning up.\n\n    Other denial\
    \ of service attacks simply keep the target too busy to do anything useful. It\
    \ is hard for a single attacker's system to generate enough traffic to do this,\
    \ but an attacker can send traffic to a large number of other systems spoofed\
    \ to look like it is coming from the target system. These systems then respond\
    \ to the target all at once\n\n    The receipt of a UDP packets causes the receiving\
    \ computer to see if there is an app expecting traffic on the corresponding port.\
    \ If there is not, it sends the equivalent of a “Not known at this address” response.\
    \ A denial of service attack can send segments destined for unlikely port addresses\
    \ to many other systems, with their sender address spoofed to be that of the target\
    \ system to be attacked. The responses then go to the target and overwhelm it.\n\
    \n*   *Sequence number prediction and insertion*. An attacker can change the contents\
    \ of a TCP segment, called a *man in the middle* attack. However, it is harder\
    \ to insert extra traffic because the successive segments of a session in each\
    \ direction have increasing sequence numbers. These sequence numbers allow the\
    \ destination to keep track of which segments have been received and so acknowledge\
    \ them correctly, but also enable them to be reassembled in the correct order.\
    \ This makes it difficult to insert extra segments into the traffic (and so take\
    \ it over in a limited way). If an attacker can guess what the sequence numbers\
    \ will be (and perhaps stop the real source system from sending by, for example,\
    \ using a denial of service attack), the attacker can masquerade as the source.\
    \ Early version of TCP used very simple schemes to generate each initial sequence\
    \ number but modern implementations take care to make these random. The attack\
    \ is still possible but requires much more work.\n\n*   *Stack fingerprinting*.\
    \ The official agreements about protocols are underspecified, so that there are\
    \ places where each particular implementation is free to do whatever is most efficient\
    \ (or easy). As a result, implementations by different vendors (or for different\
    \ families of operating systems such as Windows, Linux or Mac) are slightly different.\
    \ Of course, they must work the same way when it actually matters, but this still\
    \ leaves room for traces in segment headers that give away which particular implementation\
    \ of the protocol generated it. This is rather like accents in human speech—we\
    \ can understand someone with a different accent when they speak (mostly) but\
    \ their accent reveals something about them unrelated to what they say.\n\n  \
    \  An attacker can observe traffic and see the traces or consequences of the different\
    \ implementation choices and so infer what software in running on particular nodes.\
    \ This may make planning attacks on nodes easier by revealing which make good\
    \ targets because of known weaknesses.\n\n# [5.5Countermeasures](#contents.xhtml#sec5_5)\n\
    \nBecause the machinery of moving data from place to place was conceived of as\
    \ a “behind the scenes” and highly technical activity, efficiency was the critical\
    \ design criterion. Security was hardly thought of. As a result, there are few\
    \ countermeasures to defend against these attacks.\n\nA big part of the problem\
    \ is that pipes have to “speak the same language” so that they can connect a heterogeneous\
    \ set of nodes and carry a broad mixture of traffic. Any changes to protocols\
    \ have to be backwards compatible, so that security weaknesses can linger for\
    \ years, even with determined efforts to improve them."
  fmt: '

    # 网络安全威胁与对策


    ## 窃听

    数据包和段的全部内容均可读，除非载荷部分在到达 TCP 协议前已被加密。即使载荷已加密，数据流向的所有细节及流量大小在网络中仍完全可见。


    这需要访问流动中的网络流量。可通过物理窃听流量（点对点管道）、监听无线网络，或诱导网络接口硬件将其本地区域内所有流量复制到节点（该功能原用于故障检测，但仍普遍存在）。


    网络空间中大量流量未加密，易被捕获读取。加密流量的协议头仍可见，因节点需知晓各段/包的发送去向。流量分析可揭示端点对间的流量大小及时间；TCP/UDP 端口号常关联特定应用，从而推断通信应用；即便单一流涉及多应用，包大小分布也可能泄露所用应用，进而推断计算机功能（如
    Web 服务器、打印服务器具有特征流量模式）。


    ## 地址欺骗

    因数据包和段头部的 IP（及端口号）字段无保护，伪造流量可随意发送，合法流量可被重定向。修改目的地址可将流量发送至错误位置（如冒充真实计算机的主机）；修改源地址可生成恶意流量并伪装来源（这也是网络攻击溯源困难的原因之一，因隐藏流量来源极其容易）。


    ## 篡改内容

    若载荷未加密，可在不留痕迹的情况下篡改或替换内容。若操作得当，部分流量内容可被不可检测地替换。


    段头部部分字段含校验和，源自内容的简单函数。这些远非数字哈希；设计初衷是捕获传输错误，而非刻意篡改。若内容被篡改，对应校验和只需重新计算修改即可匹配，过程简单。


    此三协议通用缺陷，或许是全流量加密普及的主因。


    ## IP 分片攻击

    IP 可将大包分片为小片段，以便穿越无法承载典型包的细链路。每片段含字段描述其距初始大载荷起始处的偏移。全部分片到达目的地（可能不到达）时，IP 利用这些字段作为偏移量重组。然而，这些偏移量未经过合理性检查。攻击者若在途篡改偏移量，重组过程可能导致载荷部分被其他部分覆盖，最终包载荷与原始形态毫无相似。


    此攻击非直接损坏包（可直接实施），而是使携带分片的包在防火墙等设备前显得无害，重组后却成防火墙本会拦截的包。


    ## 拒绝服务

    TCP（及 UDP 程度较轻）的端点交互含状态，存在利用此状态的攻击。最简单是 SYN 洪水攻击。因 TCP 会话建立需三步交互，攻击者可执行第一步——请求会话——并忽略目标响应。目标须跟踪所有建立中会话。分配空间满时，无法接受新连接请求（含合法请求），且攻击填满的进行中连接表槽位永不解决。这类似反复致电餐厅用不同名字预订同一时段却从不赴约。


    其他拒绝服务攻击令目标过忙而无法做有用工作。单一攻击者系统难产生足够流量，但攻击者可向大量其他系统发送伪装成来自目标系统的流量，这些系统随即同时响应目标。


    接收 UDP 包导致接收方检查对应端口是否有应用等待流量；若无，发回“地址无此用户”响应。拒绝服务攻击可向大量系统发送目标为罕见端口地址的段，伪造发送者地址为待攻击目标系统。响应随即涌向目标并将其淹没。


    ## 序列号预测与插入

    攻击者可篡改 TCP 段内容，即“中间人”攻击。但插入额外流量较难，因会话各方向连续段具有递增序列号。序列号使目的地跟踪已收段并正确确认，亦使其按正确顺序重组。这增加了插入额外段（从而有限接管流量）的难度。若攻击者能猜测序列号（并可能通过如拒绝服务攻击阻止真实源系统发送），可伪装成源。早期
    TCP 生成初始序列号方案极简，现代实现则致力于使其随机。攻击仍可能但需更多工作。


    ## 协议栈指纹识别

    协议官方协议规范不足，致使各实现可在最高效（或最简）处自由发挥。不同厂商（或 Windows、Linux、Mac 等操作系统家族）实现略有差异。虽在关键处必须一致，但段头部仍留有痕迹泄露生成该协议的特定实现。这类似人类言语口音——虽能听懂不同口音（大多），但口音透露与所言无关的信息。


    攻击者可观察流量，通过不同实现选择的痕迹或后果，推断特定节点运行何种软件。这可能因暴露已知弱点而使攻击规划更易，揭示哪些节点为良好目标。


    # 5.5 对策


    因数据移动机制被视为“幕后”且高技术活动，效率成关键设计标准，安全鲜被考量。故针对这些攻击的对策寥寥。


    核心问题在于管道须“说同一语言”以连接异构节点并承载混合流量。协议变更须向后兼容，致使安全弱点即使在坚定改进努力下仍存续多年。

    '
