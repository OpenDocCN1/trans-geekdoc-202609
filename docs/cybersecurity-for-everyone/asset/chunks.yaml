- raw: 'The reach of email and other forms of messaging also makes it possible to
    find the gullible with much less overhead than in the real-world. In fact, online
    criminal scams often make themselves seem even less credible than they are inherently
    because this ensures that only the truly gullible get taken in. Various kinds
    of confidence tricks (Nigerian princes) have flourished in cyberspace, and they
    continue to make money for their perpetrators.


    Cyberspace has also created new kinds of crimes that rely on its new capabilities.
    A good example is extortion based on ransomware. A ransomware attack encrypts
    the files on a system and demands payment from the system''s owner to decrypt
    the files again.


    The existence of cyberspace has also made a difference to criminals because of
    the communication with one another than it enables. Criminals can find other criminals
    with particular skills with whom to collaborate. Criminals can also learn new
    skills online. Products that are useful in committing crimes can be purchased
    online much more easily than in the physical world. Online shopping can provide
    tools such as lock picks that are illegal to possess and so hard to buy and sell
    in the real world. Criminals can also buy software tools (“cyberattacks in a box”)
    that they can use in cyberspace to carry out crimes.


    Cyberspace has also become an arena for national power. In a passive form, it
    is a platform for intelligence gathering, since almost all data is carried within
    cyberspace, rather than by radio. All governments use this to spy on other countries,
    and many also use it to spy on their own citizens when they are in other countries
    (and often at home as well). Cyberspace can also be weaponized, so that one country
    can attack another country by disabling the target''s online activities, which
    could have a huge impact given how dependent we are on online activities; or by
    using cyberspace to carry out attacks on physical systems (which are almost always
    controlled using computers).


    States also carry out low-level disruptions of other states via these other states''
    own citizens, using disinformation to destabilize them by attitude change or by
    trying to sway elections.


    There are two uses of cyberspace by businesses that are at least problematic.
    First, social media businesses that rely on grabbing attention (for example, to
    serve ads) have developed ways to make their interfaces more enticing so that
    users interact with them more often and for longer. This has had the unfortunate
    side-effect of causing psychological harm to people both from the negative content
    that is exposed to keep them interested, and because the time and attention that
    is grabbed take away from other aspects of life.


    Second, cyberspace makes it possible to collect large, detailed descriptions of
    everyone''s activities. These are widely distributed to businesses that use them
    to model individuals. Often, this modelling is ostensibly aimed at serving them
    better ads, but the data never goes away and so can, and inevitably will, be used
    for less savory purposes.


    Some of these negative activities in cyberspace are corruptions of normal processes,
    but some of them require misusing cyberspace. For criminal actions, legal remedies
    can be used but they suffer from the mismatch between the national nature of legal
    codes and the transnational nature of cyberspace. There is little need for criminals
    to operate in the country into whose jurisdiction they fall. This is compounded
    by the difficulty in keeping legal codes relevant in the fast-moving world of
    cyberspace. Law makers do not, generally speaking, understand cyberspace and so
    law making is too slow and too unfocused to help as much as it should.


    In the international arena, the same problems are writ large. International law
    does not apply to most of the problems of cyberspace, and states are free to do
    as they please, compounded by the difficulty of attribution when a state does
    act.


    # [Chapter 3](#contents.xhtml#chapter3)


    # [Encryption and hashing](#contents.xhtml#chapter3)


    In the early days of the telegraph, telegrams were charged by the word so businesses
    developed codebooks that could express something which would take many words to
    say (“the Captain is insane”) with a single code word (“enbet”, a real example).
    Of course, this had the added advantage that the meaning of communications was
    obscured but that was not their primary purpose. Nevertheless, because telegraph
    operators see the content of everything they transmit, there were circumstances
    where the use of a code was relevant. For reasons of security, the code phrase
    to indicate the death of Queen Elizabeth II is allegedly “London Bridge is down”.


    When telephone systems replaced the telegraph, there was less need to worry about
    the content of communications being intercepted (at least once telephone operators
    ceased to play a role). Interception was still possible, but it required physical
    actions and, in many countries, a legal process.


    In cyberspace, communications of all kinds flow across pipes and through nodes
    in an unpredictable way, and often the equipment through which it passes is in
    a jurisdiction that is not that of the endpoints. It quickly became pressing to
    be able to conceal the content of data transfers from interception and prying
    eyes. Enter encryption.


    Encryption maps data from the form in which it originally exists (called *plaintext*)
    into a new form (called *ciphertext*) using a mapping with these two properties:


    *   Without knowing the key, it is hard to reverse, in the sense that it would
    take many years of computation to recreate the original content; and


    *   There is no relationship between the structure of the original data and its
    encrypted form. For example, two almost identical plaintexts should be mapped
    to be very different encrypted forms.


    The essential property of encryption is that knowing the encrypted form (the ciphertext)
    provides, in a practical sense, no way to recreate the original data (the plaintext)
    unless you hold the key.


    Encryption makes it possible to move data around in a network, even if the network
    isn''t trusted, because being able to see the encrypted data doesn''t let anyone
    except the sender and receiver discover the content of what is being communicated.


    # [3.1Private key encryption](#contents.xhtml#sec3_1)


    There are two main approaches to encryption: *private key encryption* and *public
    key encryption*. In private key encryption, there are two keys, one which is used
    to encrypt the plaintext data, and the other which is used to decrypt to ciphertext,
    getting back the original plaintext. Usually these two keys are the same, or at
    least closely related to one another so that both ends can use the same key to
    transmit to one another. For example, the Caesar cipher uses an encoding in which
    each letter of the alphabet is replaced by the one, say, 5 to its right (so “a”
    becomes “f”) during encryption. During decryption, each character of the encrypted
    message is replaced by the one 5 to its left. As long as both ends agree that
    the offset is 5, they can communicate with one another using this simple encryption
    method.


    Encryption systems have been in use for millennia, but they often relied on the
    secret of the method, rather than the secret of the key. After all, breaking a
    Caesar cipher only requires trying every possible offset, which was practical
    right from its first use. Any substitution cipher that works by replacing each
    single character by another in a regular way is easy to attack by looking at character
    frequencies. For example, the most common letter in English is “e”, so whichever
    character is most common in the encrypted message is probably the encrypted version
    of “e”.'
