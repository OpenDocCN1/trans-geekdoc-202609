- raw: 'Encryption such as that used by the German Enigma system in World War II used
    character substitution but the substitution changed with every character of the
    message. This makes it much, much harder to decrypt but not, as it turned out,
    beyond the computational capacity of the new computing devices developed at Bletchley
    Park in the 1940s.


    The lesson learned from this was that it''s not enough for an encryption system
    to look as if decryption without the key is difficult; it must be provably difficult.


    Both ends of the communication must know their (identical or closely related)
    keys and must keep them a secret. If someone else learns either one they can get
    access to encrypted data (and can also generate data that will appear to have
    been encrypted by one of the ends and so look like it must have been sent by them).


    This introduces a thorny problem—how to get the common key(s) to both of the endpoints—called
    the *key distribution problem*. The keys can''t just be transmitted as data because
    the whole point of using encryption in the first place is that unencrypted data
    can be intercepted—and keys are an especially valuable kind of data. They could
    be sent encrypted in some other way, but this just pushes the problem back another
    step, since the keys for that encryption method must have been distributed somehow.
    Key distribution really requires some kind of trusted side-channel, but these
    are necessarily hard to construct in settings where there is already a need for
    encryption. Private-key systems have fallen out of use because of the key distribution
    problem, except for settings where there is time to distribute the keys physically.


    # [3.2Public key encryption](#contents.xhtml#sec3_2)


    The second main approach to encryption is more common because it has a number
    of attractive properties compared to private-key systems. It is called *public
    key encryption*. In this scenario, the key used for encryption and the key used
    for decryption are different, so different that one cannot be inferred (computationally)
    from the other. However, they work in the same way as before: if a plaintext message
    is encrypted with the encryption key then the ciphertext can be decrypted back
    to plaintext using the decryption key.


    A node (or person) *A* has a private key, which must be kept secret, and which
    is used for decryption. *A* also has a public key which does not need to be secret
    and which can be used by anyone to encrypt messages to *A*. Letting this key be
    widely known isn''t a problem because the only way to use it is to encrypt messages
    that only *A* can decrypt; and *A*''s private key can''t be worked out from knowing
    its public key.


    So anyone who wants to send a message to *A* can look up its public key, use it
    to encrypt the message, and send it to *A*, who is the only one who can decrypt
    it. The two nodes do not have to share any common keys. *A* can create both keys,
    keep the private key and make the public key public


    # [3.3Digital signing and digital hashing](#contents.xhtml#sec3_3)


    We already know that decryption is an inverse to encryption (starting with a message,
    encrypting it, and then decrypting it produces the original message). Often the
    structure of encryption systems means that encryption is also an inverse to decryption.
    In other words, if a message is first transformed by applying the decryption mechanism,
    then applying the encryption mechanism will once again produce the original message.


    When this is true, public key techniques can be used for *digital signing*. If
    *A* creates a legal document and then uses its (private) *decryption key* to encrypt
    it, then the resulting document is tied to *A* in a strong sense. Anyone can use
    *A*''s public key to *decrypt* it; if the result is a sensible document then it
    must have been encrypted by *A* (the only one who knows the right key). If the
    result is random garbage then the document was not encrypted by *A*. This acts
    like *A*''s signature: only *A* could have made it happen, it''s tied to *A* and
    *A* can''t repudiate it, and nobody can change it (say, to try and make it someone
    else''s signature) without breaking it.


    Digital signing can be used to deal with one of the problems of public key encryption
    systems—guaranteeing that *A*''s public key really does belong to *A*. If anyone
    can manage to distribute their own public key but make it seem as if it belongs
    to *A* then they can read all of the messages intended for *A*. The solution uses
    *certificate authorities*, organizations who collect fees for verifying and validating
    public keys.


    *A* sends its public key to a certificate authority, together with a claim of
    identity (“I really am *A*”). The certificate authority uses one of a number of
    mechanisms to check that *A* really is who it claims to be, and the issues a document
    contains *A*''s public key and *A*''s identity, digitally signed using the certificate
    authority''s private key. Anyone who wants to check *A*''s public key can use
    the certificate authority''s public key to unwrap this document and make sure
    the identity and public key match.


    Of course, this means trusting that the certificate authority''s public key really
    does belong to it; and this can be done by relying on a higher-level certificate
    authority (and so on). So this process is about increasing confidence—corrupting
    a certificate authority is harder than corrupting *A*—but the process comes with
    no ultimate guarantees.


    The cost of getting a certificate is one major reason why small organizations
    tend not to use public-key encryption when they could. But certificates are an
    ongoing mess, because they tend to expire at awkward moments, and most people,
    when they encounter a certificate problem, continue to do what they were going
    to do anyway.


    Another technique that uses ideas from encryption is *digital hashing*. Here the
    goal is to map some data into an encrypted form, but the encrypted data is forced
    to be of a restricted size. We are not interested in being able to decrypt the
    data so we only need a one-way mechanism, that is, we use an encryption key but
    there is no matching decryption key. The essence of the idea is that the encrypted
    form, of the data, the digital hash, is a compact representation of the entire
    data because of the property of encryption that any small change in the plaintext
    should produce a large change in the ciphertext.


    Because there can be arbitrarily many sets of initial data, but the number of
    encrypted forms is limited to a fixed size result, this mapping isn''t guaranteed
    to produce a unique hash for all initial sets but collisions are extremely unlikely
    if the fixed size is not too small. For example, if the fixed size is 32 bytes
    then there are 2^(256) possible digital hashes, which is far more than the number
    of documents that will ever exist.


    What we require is that the mapping mixes up the relationship between inputs and
    outputs in the same way encryption does. Two similar initial pieces of data must
    produce very different hashes, and it must not be possible, knowing some plaintext
    and its hash, to infer another plaintext that hashes to the same value.


    A digital hash is a kind of digest of the entire content of a set of data, but
    one that can''t be manipulated without knowledge of the key. It is used to create
    a compact representation of a document or the code of an app so that its integrity
    can be checked. An app developer can provide both the app and its digital hash;
    someone who downloads it can recalculate the hash from the app code, and check
    that the answer matches the original hash to verify that the app hasn''t been
    altered maliciously or corrupted in transit.


    # [3.4Encryption in use](#contents.xhtml#sec3_4)


    The basic purpose of encryption is to allow private communication between two
    parties, that it to eliminate the possibility of eavesdropping. It is needed in
    cyberspace because there is so little control of where and how data will travel
    on its path from source to destination.'
  fmt: '

    # 3.2 Public key encryption


    第二种主要的加密方法更为常见，因为与私钥系统相比，它具有许多吸引人的特性。这被称为**公钥加密**。在此场景中，用于加密的密钥和用于解密的密钥是不同的，不同到无法从其中一个（在计算上）推断出另一个。然而，它们的工作方式与之前相同：如果明文消息使用加密密钥进行加密，则密文可以使用解密密钥解密回明文。


    节点（或个人）*A* 拥有一个私钥，必须保密，用于解密。*A* 还拥有一个公钥，无需保密，任何人都可以用它来加密发送给 *A* 的消息。让该密钥广为人知并不是问题，因为使用它的唯一方式是加密只有
    *A* 能解密的消息；而且无法从 *A* 的公钥推导出其私钥。


    因此，任何想给 *A* 发送消息的人都可以查找其公钥，用它加密消息并发送给 *A*，而 *A* 是唯一能解密它的人。这两个节点不需要共享任何公共密钥。*A*
    可以创建两个密钥，保留私钥并公开公钥。


    # 3.3 Digital signing and digital hashing


    我们已经知道解密是加密的逆操作（从一条消息开始，加密它，然后解密它，会产生原始消息）。通常，加密系统的结构意味着加密也是解密的逆操作。换句话说，如果消息首先通过应用解密机制进行转换，然后应用加密机制将再次产生原始消息。


    当这成立时，公钥技术可用于**数字签名**。如果 *A* 创建一份法律文档，然后使用其（私有）**解密密钥**对其进行加密，那么生成的文档在很强的意义上与
    *A* 绑定。任何人都可以使用 *A* 的公钥来**解密**它；如果结果是一份合理的文档，那么它必定是由 *A* 加密的（唯一知道正确密钥的人）。如果结果是随机乱码，则该文档不是由
    *A* 加密的。这就像 *A* 的签名：只有 *A* 能使其生效，它与 *A* 绑定，*A* 无法抵赖，并且没有人能在不破坏它的情况下篡改它（例如，试图使其成为他人的签名）。


    数字签名可用于解决公钥加密系统的一个问题——保证 *A* 的公钥确实属于 *A*。如果有人设法分发他们自己的公钥但使其看起来像属于 *A*，他们就能读取所有发给
    *A* 的消息。解决方案使用**证书颁发机构**，即通过收取费用来验证和确认公钥的组织。


    *A* 将其公钥连同身份声明（“我真的是 *A*”）发送给证书颁发机构。证书颁发机构使用多种机制之一检查 *A* 是否真的是其声称的身份，并颁发一份包含 *A*
    的公钥和 *A* 身份的文档，该文档使用证书颁发机构的私钥进行数字签名。任何想要检查 *A* 的公钥的人都可以使用证书颁发机构的公钥来解封此文档，并确保身份和公钥匹配。


    当然，这意味着要信任证书颁发机构的公钥确实属于它；这可以通过依赖更高级别的证书颁发机构来实现（依此类推）。因此，这个过程是关于增加信心——腐败一个证书颁发机构比腐败
    *A* 更难——但该过程不提供最终保证。


    获取证书的成本是小型组织倾向于不使用公钥加密的一个主要原因（即使他们可以）。但证书一直是个烂摊子，因为它们往往在尴尬的时刻过期，而且大多数人遇到证书问题时，会继续做他们原本打算做的事。


    另一种使用加密思想的技术是**数字哈希**。这里的目标是将某些数据映射为加密形式，但加密后的数据被强制限制在受限的大小内。我们不关心能否解密数据，因此只需要单向机制，即我们使用加密密钥但没有匹配的解密密钥。该思想的本质是：数据的加密形式即数字哈希，由于加密的特性（明文的任何微小变化都应产生密文的巨大变化），它是整个数据的紧凑表示。


    由于初始数据集可以任意多，但加密形式的数量限制在固定大小的结果中，因此这种映射不能保证为所有初始集合产生唯一的哈希，但如果固定大小不太小，冲突极不可能发生。例如，如果固定大小为
    32 字节，则有 2^(256) 种可能的数字哈希，远超将来存在的文档数量。


    我们要求该映射以加密相同的方式混淆输入和输出之间的关系。两个相似的初始数据片段必须产生截然不同的哈希，并且在知道某些明文及其哈希的情况下，不得能推断出另一个哈希到相同值的明文。


    数字哈希是一组数据整个内容的一种摘要，但如果没有密钥知识就无法操纵它。它用于创建文档或应用程序代码的紧凑表示，以便检查其完整性。应用程序开发者可以提供应用程序及其数字哈希；下载者可以从应用程序代码重新计算哈希，并检查答案是否与原始哈希匹配，以验证应用程序未被恶意篡改或在传输中损坏。


    # 3.4 Encryption in use


    加密的基本目的是允许双方进行私密通信，即消除窃听的可能性。在网络空间中需要加密，因为数据从源到目的地的路径上，对其去向和方式几乎没有控制。

    '
