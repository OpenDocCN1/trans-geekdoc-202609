- raw: 'Recall that a digital hash is a function that maps strings of characters to
    a fixed-size representation (often 32 bytes in this context) in a way that cannot
    be practically reversed, and in which two similar input strings are mapped to
    completely different fixed-size representations. They represent summaries of the
    content of the input strings. Digital hash


    Recall also that a public-key cryptosystem uses a pair of a private and a public
    key to allow two parties to communicate using encryption without having to exchange
    keys. Such systems allow anyone to send content to the holder of the private key,
    and for the holder of the private key to digitally sign anything in a non-repudiable
    way. Public key encryption


    A blockchain is a distributed transaction-recording system that is intended to
    be a permanent record of the transaction history. It is made up of blocks, each
    of which contains a timestamp and the record of one or more transactions, connected
    in a chain. Each block contains a digital hash of its predecessor so that the
    previous block cannot, in practice, be altered


    A user who wants to add a transaction to the blockchain must own one or more private-public
    key pairs. Activity on the blockchain is associated to the identity that holds
    each pair of keys, but there is no necessary link from the identity to the particular
    individual who owns them. When a user wants to add a transaction to the blockchain,
    it is broadcast to participating computers (nodes), who then compete to be the
    one allowed to add the transaction to the chain. The node that wins is called
    the publisher node. Each blockchain system must have some way to reward publisher
    nodes so that they have an incentive to compete. This could be as simple as a
    transaction fee.


    There are a number of mechanisms for this competition that different designs for
    blockchains use. All are designed to prevent one node or a set of nodes from colluding
    to always win, and therefore be able to corrupt the process of inserting new blocks
    into the blockchain.


    The first mechanism is called *proof of work*. Here, potential publisher nodes
    must solve puzzles that are computationally expensive to solve, but for which
    the correctness of eventual solutions can be easily checked. A set of nodes that
    wanted to collude would have to devote huge resources to always being the first
    to solve puzzles, and so to gain control of the blockchain. The first node that
    solves the puzzle gets to add the next block to the chain, and propagate the extended
    chain to all of the nodes involved in the blockchain.


    It can happen that multiple nodes solve the puzzle simultaneously and each add
    a (potentially different) block to the blockchain


    There are two major problems with proof of work approaches to blockchains. First,
    they are an ecological disaster, since many nodes compete to become publishers
    by carrying out expensive calculations which consume a great deal of electricity


    Second, because the chains can be inconsistent for a while, it is safer to wait
    until multiple blocks have been added to the chain before concluding that your
    particular transaction has been permanently added to the chain—as a rule of thumb,
    wait for six further blocks. Since some blockchains add a block only once every
    10 minutes, this introduces substantial latency into successfully concluding transactions.


    A second mechanism is called *proof of stake*, in which the winning node, the
    one that gets to publish, is randomly chosen in proportion to a stake, typically
    monetary, that they have put into the system. The idea is that nodes that have
    a stake in correct operation of the blockchain are motivated to be hard to suborn.
    The process of randomly choosing the winning node is carefully designed to make
    it as difficult as possible to corrupt the process. Careful design of the process
    for becoming a publisher node can make it highly unlikely


    Although proof of stake approaches do not require the huge amounts of computation
    required for proof of work, they still have performance costs. For example, long-standing
    blockchains can have chain sizes as big as 200GB (and of course they have to grow),
    so storing and moving the chain is expensive.


    Blockchains can be permissionless, so that they are truly distributed and users
    and nodes need have only minimal trust in the other entities involved. Much of
    the expectation of large-scale systemic change because of the use of blockchains
    comes from the decentralization, in which transactions no longer require a trusted
    intermediary (who usually takes a small fee for the service). Permissionless blockchains,
    it is claimed, destroy many forms of intermediaries or gatekeepers.


    Blockchains can also be permissioned, for example, because they operate entirely
    within a large organization. This reduces the friction of some of the blockchain
    processes because there can be greater trust between the entities.


    One of the most visible applications of blockchains has been as ways to implement
    *cryptocurrencies*, of which Bitcoin is probably the best known. Here the blockchain
    is used to record all financial transactions, so that there is a complete record
    of who has owned each unit of value (e.g., Bitcoin). Value enters the blockchain
    from the wider financial system; once in the blockchain it can move from ownership
    by one identity to another; and eventually it can be moved back into the wider
    financial system. Because identities are known only from by encryption keys, users
    can transfer value anonymously. This, obviously, creates pathways for criminals
    and money launderers to move value around in ways that cannot be tied to them.
    Note that all transactions are visible; it''s just that the identities of the
    individuals who made them that are concealed. Cryptocurrencies therefore function
    like “Swiss bank accounts” because you can''t tell who owns the value.


    The ownership of units of value is associated with the private key that was used
    to acquire ownership of them. Most of the high-profile hacks that have “stolen”
    cryptocurrency have really been illicitly gained access to private keys, enabling
    units of value to be transferred to someone else. These private keys are sometimes
    called digital wallets, because ownership of a private key is equivalent to ownership
    of value units recorded in the blockchain.


    A blockchain used for cryptocurrency has a natural way to reward publisher nodes,
    by giving them cryptocurrency as a reward. It took nations many centuries to understand
    how to keep their currencies stable, and cryptocurrencies have not yet solved
    this problem. Their prices relative to real-world currencies have oscillated wildly,
    so that the incentives for nodes to become publisher nodes have also oscillated,
    making it hard for potential publisher nodes to plan their resourcing.


    There are many cybersecurity vulnerabilities associated with blockchains. These
    include:


    *   Attacks directed at the distributed mechanisms for choosing a publisher node,
    which are designed to be fair and random. These include collusion to allow a particular
    node to be selected as a publisher node, and so-called 51% attacks, where more
    than half of the potential publisher nodes are corrupted so that they can create
    their own, competing version of the blockchain, with its own transactions (adding
    extra, or deleting some of the true ones) that is longer than the true one and
    so gets adopted as the authoritative one.


    *   Attacks that exploit the fact that transactions that have not yet been added
    to the blockchain are just data, and can be discarded, changed, or misdirected.'
