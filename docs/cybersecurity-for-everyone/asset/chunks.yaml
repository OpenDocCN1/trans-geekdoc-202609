    The reach of email and other forms of messaging also makes it possible to find
    the gullible with much less overhead than in the real-world. In fact, online criminal
    scams often make themselves seem even less credible than they are inherently because
    this ensures that only the truly gullible get taken in. Various kinds of confidence
    tricks (Nigerian princes) have flourished in cyberspace, and they continue to
    make money for their perpetrators.


    Cyberspace has also created new kinds of crimes that rely on its new capabilities.
    A good example is extortion based on ransomware. A ransomware attack encrypts
    the files on a system and demands payment from the system''s owner to decrypt
    the files again.


