- raw: 'Biometric systems also fail because not everyone has fingers, hands, ears,
    eyes, a face, or a voice, and so there must always be a backup authentication
    mechanism. This increases costs because of the need to provide a second mechanism
    at every place where biometric authentication is used.


    The second drawback is that we typically have *one* of each of these biometrics.
    If the (usually encoded version) of a biometric is compromised, there is no way
    to issue a new one.


    When a biometric authentication has to be done remotely, to allow access to a
    web site say, then the encoding of the biometric has to be done at the point where
    it is collected, and then the encoded version transmitted to the web site for
    matching, This creates a vulnerability at the collection point, since the encoded
    version can be intercepted, and the replayed later or at a different access point.
    This can be worked around, as it is for passwords, but devices that collect biometrics
    are not always mature and so can be vulnerable to misuse.


    Something you know brings mild reassurance that it is the authorized person who
    is authenticating. Something you are brings much greater, but not complete reassurance.
    The weakness of something you have is that there''s no necessary link between
    its use and the person who is authorized to use it.


    These mechanisms can be combined (called *two-factor authentication*) to try and
    get the best of their properties and avoid the worst. However, the more authentication
    channels the more problematic it becomes for human users, and the more likely
    that they will become annoyed and find a workaround.


    # [4.2Malware](#contents.xhtml#sec4_2)


    If only properly authenticated users were able to use their computational devices
    and software, then many cyberattacks would be much more difficult. Unfortunately,
    people often do the cyberspace equivalent of opening gates to those with malicious
    intent, allowing them authenticated access to their environments.


    Allowing malicious software (*malware*) to be placed on a computer is, of course,
    not something that ordinary users do deliberately, but there are a number of pathways
    by which it can happen. Usually, it is the result of an unwitting action by a
    user. It is common to blame users when this happens, and there is no doubt that
    education can make a big difference; but the design of much of cyberspace makes
    it far too easy for attackers to nudge ordinary users into doing something unsafe.


    One of the common pathways is that the user downloads some software or an app
    that contains concealed malware, hidden inside its overt functionality. For apps
    downloaded onto phones, app stores try to make sure that the apps available do
    not contain malware, but their filtering process does not always work. For personal
    computers, it is easy to download software from any web site and so there is a
    correspondingly greater risk. Operating system developers are trying to move to
    a model that provides more vetting of downloaded software but this is not yet
    common, and manufacturers are using this extra security as an excuse to collect
    more data about users to resell to social media businesses.


    Another common way to introduce malware is to attach it to an email, say, masquerading
    as data. For example, an email attachment may appear to be a document of some
    kind but actually contains executable code that is, or installs, the malware.
    When such malware is attached to emails sent at random to large numbers of email
    addresses then it is known as *phishing*. Emails may also contain links to web
    sites that download malware as a consequence of clicking on them.


    Increasingly malware-bearing emails are targeted to particular recipients, when
    it is known as *spearphishing*. Considerable effort may be expended in making
    the emails seem plausible: faking the sender''s address to be one that the recipient
    might expect, and making sure that the apparent content of the attachment is real
    so that when it is opened the recipient might not even realize that it has installed
    malware. Spearphishing can also use social engineering, making it seem that the
    email comes from the recipient''s boss, or even the company CEO.


    The increasing prevalence of phishing emails is having a serious impact on communication
    since, at any level of sophistication, it is still possible to be fooled. We can
    see the beginnings of this with people reaching out using another modality, such
    as a text message, to ask if an email attachment is legitimate.


    Some forms of malware, called *worms*, can spread from system to system using
    the underlying mechanisms that control cyberspace traffic. When this happens a
    system can acquire malware without a user doing anything. As a result, worms can
    spread very quickly.


    There is also a sense in which malware can target people rather than nodes—cyberbullying,
    scams instigated using emails, and the spread of misinformation.


    # [4.3What does malware do?](#contents.xhtml#sec4_3)


    Most computer systems divide their operations into three different kinds: those
    that can be done by any user, those that can only be done by the operating system
    (and so which require administrator accounts with special permissions), and those
    that are done when the system is first turned on. The actions that can be done
    by any user are the most restricted; users can use the software on the computer
    but typically cannot install some kinds of new software, and cannot see or change
    critical files. The operating system can do anything in the whole running system.
    Because of this, operating system accounts (administrator accounts) are restricted
    to systems staff who are trained, including in security. In phone systems, the
    operating system capabilities are not available to users at all, remaining under
    the control of the operating system developer (unless the phone is rooted). Finally,
    the actions that are done when the system is turned on are especially powerful
    because they happen before any checking can be done.


    Malware can be targeted at any of these three layers. User space malware is the
    easiest to install, because actions of an ordinary user can create the opportunity
    to install it surreptitiously, but as a consequence it has the smallest opportunities.
    This is the reason why users are often encouraged to always carry out their ordinary
    work using an account like this, even when they have full control of their system
    and could use an administrator account for everything.


    Malware targeted at the operating system level is harder to install, because it
    requires a higher level of permission, but provides greater opportunities. Malware
    targeted at the code that executes when a device is turned on is the hardest to
    install but is, of course, the most powerful since it controls the way in which
    the device is configured.


    The ease with which malware can be removed also reflects how difficult it was
    to install in the first place. Malware detection software can usually find user
    space malware and often malware in the operating system, but finding and removing
    malware in the code that runs when the device is turned on is much more difficult.


    It is also possible that malware is installed in the hardware itself. This kind
    of malware requires installation as part of the manufacturing process, making
    it much more expensive, but also much, much harder to detect. This is typically
    the realm of governments.


    Malware can be used for a range of purposes, from vandalism all the way to non-kinetic
    military attacks. Some of the goals of those who distribute malware are:'
