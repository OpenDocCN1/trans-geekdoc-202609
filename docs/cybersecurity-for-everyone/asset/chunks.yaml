- raw: 'Browsers can transmit data to web servers. Sometimes this is simply the content
    of a form, often as the way to authenticate to the web server using a user name
    and password. But browsers also allow a user to transfer money between bank accounts,
    buy products, or borrow ebooks from a library. The same mechanism allows users
    to post content to a web site which is then visible to others on the same web
    site. For example, user can upload videos, status updates, blog posts, and share
    their activities such as what they have bought.


    As well as the explicit communication between browser and web server, there is
    a great deal of implicit communication aimed at tracking user behavior (for example,
    using *cookies*). Because many users are interacting with multiple web sites at
    once (perhaps using separate tabs) there is an opportunity for interactions with
    one web site to leak information about the interactions with another web site.


    A mechanism that was designed to handle simple requests (upward) and static data
    (downward) has become a channel for high-volume two-way transfer of many different
    kinds of data, as well as executable code.


    Web pages contain Hypertext Markup Language (HTML) which describes what each part
    of a web page is, rather than its exact formatting. For example, HTML tags label
    paragraphs, headings, lists and so on. The browser can use this information about
    what kind HTMLeach part is to decide how to display it, knowing the screen size
    and resolution of the device that will display it.


    The major vulnerabilities of web traffic are made possible because parts of a
    web page that are code or user-generated content are labelled with tags as well.
    Thus text, inside each of these parts, becomes executable code when it reaches
    either the browser or web server. Checking whether this executable code is reasonable
    and safe is difficult, and is often not even attempted.


    Three major attacks exploit this ability for data to become executed code. The
    first is called a *cross-site request forgery*. An attacker uses their own web
    site to make a malicious request to another web server via an unwitting user''s
    browser. For example, suppose that a user is logged into her bank account at a
    bank''s web site, and simultaneously has another tab open at the attacker''s site.
    The attacker can cause the user''s web browser to download a malicious request
    (say to transfer money) and then pass it up to the bank''s web site. The bank
    knows that the user is already authenticated, and doesn''t realize that the request
    does not come from the user''s actions, but indirectly from the other site. The
    user may not even realize that anything has happened.


    The second is called a *cross-site scripting* attack and works in an inverse way.
    An attacker inserts HTML-formatted content on a web site that allows users to
    upload content—for example, a social media site might allow a user to describe
    their interests. Inside this uploaded content is an HTML section that contains
    executable code. Whenever a user downloads the content, this code is executed
    on their computer and can do anything that executing code in the browser is allowed
    to do. The downloaded malicious code may do something bad directly, but can also
    cause other malicious code to be downloaded.


    Both of these attacks seem like they should be easy to prevent, but they interact
    with core mechanisms of HTML and browsers: how executable code is handled, how
    authentication and cookies work, and the ability to interact with more than one
    web site at a time. Several attempts have been made to prevent these attacks,
    and it is an evolving field, but a solution requires agreements between all browsers
    and all web sites about exactly what needs to be done. In practice, browsers have
    attempted different ways to try and solve the underlying problems without needing
    web sites to be changed (since that will never happen across the whole world).


    The third attack is called *SQL injection* and is perhaps the most popular single
    cyberattack mechanism. Web sites often create pages on the fly when they receive
    a request. For example, if you visit your bank, you must first complete a form
    that provides your account identification and password; but then the bank displays
    a page with your balances and other individual details. This page is, of course,
    different for everyone.


    The data that populates this page comes from a database which has records for
    each customer. Databases are specialized data stores which provide information
    in response to requests expressed as queries: “show me the balance of the individual
    with this account number”, “show me the account numbers of all the people at this
    branch”, and so on. These queries are expressed in a structured way using a query
    language, of which *SQL*, *Structured Query Language* (SQL), is one of the most
    popular.


    When you enter information into a form in your web browser (“what is the balance
    in account xxxx”) it becomes an SQL query which is passed to the web server, and
    the web server passes it on to the database. When the database responds to the
    web server, the server turns the response into HTML and sends it to the browser
    for display.


    The problem is that the web browser and/or web server do not (and in some cases,
    cannot) validate that the text entered into the form is a safe SQL query. Thus
    a knowledgeable user can enter information into the form that carries out malicious
    actions in the database, up to and including deleting the entire contents.


    Several countermeasures to SQL injection attacks are known, mostly based on working
    harder to validate inputs before they reach the database. However, these rely
    on correctly configuring both the web server and database. Many web servers (and
    databases) are built for small and medium size businesses who may not be aware
    of the issues, and so misconfigurations that allow these attacks are still common.


    These attacks can act synergistically. The cross-site request attack allows a
    malicious web site to create a request to another web site. This request can be
    an SQL injection attack on the database that lives behind that other web site.


    The code used to run web servers may also have vulnerabilities that are known
    to potential attackers. Even well-known web servers that have been in existence
    for a long time contain errors. For example, the Apache web server issues roughly
    10 security fixes each year. A sophisticated attacker may be able to attack such
    web sites directly, that is, without relying on a browser as an intermediary.


    Many of the attacks that allow malicious actors to get into individual''s social
    media accounts or bank accounts use phishing or spear phishing to insert malware
    on the individual''s computer or phone. Such malware can watch when the individual
    logs in to their account, capture their passwords, and then quietly log in behind
    the scenes; and then post content to social media, send email spam, or transfer
    funds out of their bank account. Users can protect against these attacks by using
    antivirus and antimalware software that detects malware like this before or after
    it gets onto the device.


    Attacks using web server mechanisms are harder to detect because they are mostly
    transient—the attack happens in a moment, creates no sign that anything is happening
    at the time, and leaves few traces.


    # [7.3Blockchains](#contents.xhtml#sec7_3)


    *Blockchains* are an application-level system that relies on many of the cryptographic
    ideas we discussed in [Chapter 3](#03chap_03.xhtml). Although the long-term usefulness
    of blockchains remains an open question, they create a complex security environment
    which is worth exploring.'
