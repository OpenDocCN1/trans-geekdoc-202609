    ## D. 轻量梯度提升 (LightGBM)


    LightGBM 是一种梯度提升算法，它通过叶节点最优（leaf-wise）策略分裂树 [20]。与传统的 GBM 不同，在信息增益搜索期间减少了每个特征的数据点。LightGBM
    的学习过程可以通过 [11] 解释。大梯度和小梯度均指代与其一起训练的实例数量。该技术用于训练数据，即保留具有大梯度的实例，并随机丢弃已经训练过的小样本 [19]：


    ```

    $V_p = \frac{1}{n} \sum_{i=1}^{n} (1 - \alpha_i)(\sigma_{i_t} + \beta_i)^2 + \frac{\alpha_i}{n}
    \sum_{i=1}^{n}(\sigma_{i_t} - \beta_i)^2 \quad (11)$

    ```


