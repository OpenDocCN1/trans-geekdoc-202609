    ## D. Light Gradient Boosting (LightGBM)


    LightGBM is a gradient boosting algorithm that splits trees by leaf-wise [20].
    Unlike traditional GBM, the number of data points for each feature is reduced
    during information gain search. The learning process of LightGBM can be explained
    by [11]. The Large and Small Gradient, any refer to the number of instances trained
    with it. This technique is adopted for training data where instances with large
    gradient are kept, and small samples which are already trained are discarded randomly
    [19]:


    ```

    $V_p = \frac{1}{n} \sum_{i=1}^{n} (1 - \alpha_i)(\sigma_{i_t} + \beta_i)^2 + \frac{\alpha_i}{n}
    \sum_{i=1}^{n}(\sigma_{i_t} - \beta_i)^2 \quad (11)$

