    # V. 结论


    本文提出了一种用于短期风电预测的四种算法集成，即 CNN、LSTM、LGBM 和 XGBoost。提出的方法通过加权平均模型来改进模型性能，并通过基于性能的方法调整每个模型的权重。在两种深度学习模型中，CNN
    与 LSTM 相当，但在所有模型中速度最快。由于 LSTM 模型的时间成本较高，LGBM 的学习对该方法的速度没有产生显著影响。集成正则化和调整超参数可以增强两者的性能和灵活性。两种深度学习算法之所以有效，是因为有足够的数据进行训练。CNN
    检测到集成模型与其他模型相比，其性能在全年表现良好。该方法足够稳健，能够以较低的 RMSE 和较高的 $R^2$ 对不同月份进行预测。


