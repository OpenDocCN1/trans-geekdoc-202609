    ## E. Proposed Model


    The accuracy of time-series prediction is highly sensitive, and there is no consensus
    determining which model is best. The most and simplest approaches are to use a
    linear combination of all available models. In this paper, we propose a convex
    combination method, which takes the weighted average of the prediction of four
    models discussed previously by combining the error-based approach and outperformance
    model [21] to calculate the corresponding weights. Error is measured for every
    month of the year and then ranked according to their performances. The performance
    is measured using Root Mean Square Error (RMSE) and R-squared score ($R^2$), given
    by (12)-(13).


