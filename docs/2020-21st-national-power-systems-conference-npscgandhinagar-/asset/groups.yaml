    # 基于深度学习和梯度提升算法的短期风电预测集成模型


    Dehesh Kumar, IEEE 学生员, Rishab Abhin, IEEE 学生员, 以及 Naran Pindoriya, IEEE 高级成员

    印度古吉拉特邦甘达纳加理工学院电气工程系

    邮箱: dehesh.kumar, rishabh.abhin, naran@itgn.ac


    摘要— 准确的风电功率预测对于能源管理至关重要，并在提高风电发电人在电力市场中的竞争力起着重要作用。深度学习和基于梯度提升的决策算法已证明在极端情况下取得良好的结果。由于风速具有高度波动性，并在时间和空间上存在差异，算法在受限数据集上表现良好，而在另一些数据集上表现差。例如，使用集成模型比依赖单一模型更好。我们通过结合四种机器学习算法（包括卷积神经网络
    (CNN)、长短期记忆 (LSTM)、梯度提升 (LightGBM) 和极端梯度提升 (XGB)）的优点，利用实际风场研究的数据证明了所提模型的有效性。所提模型优于单一模型，并以很高的精度预测不同月份的风电功率。


    另一方面，这些方法在没有显式编程的情况下学习过去与未来数据之间的关系。决策学习算法因其可解释性和简单性被用于预测 [7]。它使用了一种提升技术，利用弱学习器来减少偏差并改进在每个序列上的误差。梯度提升是一种强大的技术，它利用并行处理和正则化来克服偏差和过拟合
    [8]。梯度提升机 (LightGBM) 是一种极其高效的基于梯度的算法，它促进层级增长，导致损失显著减少 [9]。


    关键词—神经网络，深度学习，集成模型，极端梯度提升，短期记忆，风电功率预测。


    在机器学习算法中，人工神经网络 (ANN) 过去由于处理输入与输出之间非线性关系的复杂性而受到限制。研究人员已利用 ANN 的多种变体进行风电功率预测，例如自适应神经模糊推理系统
    [10]、基于波的神经网络 [11]。最近，深度学习已广泛应用于各个领域。深度学习利用 ANN 的分级结构，例如由深度神经网络组成的卷积神经网络 (CNN)，以及长短期记忆
    (LSTM)，后者具有顺序输入以处理序列中的长期依赖。这种方法通过循环神经网络解决了梯度消失问题。卷积神经网络 (CNN) 在性能方面具有更好的能力，并且远比
    LSTM 快。


    # I. 引言


    随着对风电需求的增加，风电预测变得越来越重要。所有发电厂都根据风电功率预测进行运行。预测与实际输出之间的偏差将产生经济负担。此外，这可能会影响电网的稳定性。因此，准确的风电功率预测对于电力市场策略的发展至关重要
    [1]。


    风电预测可以通过两种策略实现。第一种确定风速输出的方法取决于温度、湿度和空气密度等大气参数。这种预测通过数值天气预报 (NWP) 实现，基于数学模型和资源
    [2]。第二种方法直接涉及风场的风电预测，这些方法使用递归技术寻找过去与未来时间序列数据之间的关系。常用的风电统计方法有 ARIMA [3]、ARIMA [4]、季节性
    ARIMA 和带有外输入的 ARIMA (ARIMAX) [6]。


    观察到所有模型在不同数据集上表现良好。由于风电功率高度间歇且变化，要识别一个适用于所有情况的单一算法是困难的。因此，结合两个或多个模型具有更好的预测鲁棒性
    [15], [16]。本文提出了一种结合 CNN、LSTM 和 LightGBM 的新型集成模型。每个算法的精度通过超参数调优和正则化得到增强。所提模型预测实际风场的风电数据。


    本文其余部分的结构如下：第二部分解释个体算法和所提集成模型。第三部分描述数据处理和超参数调优。第四部分讨论方法的比较和结果，第五部分给出结论。


    # II. 方法论


    深度学习架构在学习数据集的复杂特征方面非常高效，但代价是训练需求和计算功率高。相比之下，树模型计算成本低，所需数据较少即可提供满意的预测。我们的研究考虑了两个神经网络（CNN
    和 LSTM）和两个梯度决策树 (GBDT) 算法（Xgboost 和 LightGBM）。


    # A. 长短期记忆 (LSTM)


    LSTM 背后的基本原理带有记忆细胞，它在整个网络中传输并通过特定的调节结构控制信息。标准的 LSTM 架构如图 1 所示，由公式 (1) 解释：


    ```

    $f_t = \sigma(W_f x_t + U_f h_{t-1} + b_f)$ (1)

    $i_t = \sigma(W_i x_t + U_i h_{t-1} + b_i)$ (2)

    $o_t = \sigma(W_o x_t + U_o h_{t-1} + b_o)$ (3)

    $$\tilde{c}_t = \tanh(W_c x_t + U_c h_{t-1} + b_c)$ (4)

    $c_t = f_t \odot c_{t-1} + i_t \odot \tilde{c}_t$ (5)

    $h_t = o_t \odot \tanh(c_t)$ (6)

    ```


    其中 $f_t, i_t$ 和 $o_t$ 分别是遗忘门、输入门和输出门。h$ 和 $c$ 分别表示隐藏层和记忆细胞状态。W 代表权重系数，$b 代表偏差向量。$\odot$
    是元素级乘法，sigma$ 是 sigmoid 函数，tanh 是正切函数。例如，带有 sigmoid 层的门决定对代表长期记忆的细胞状态信息的接受或拒绝。带有
    sigmoid 层的细胞决定将什么新信息添加到细胞状态中。由于 tanh 函数的连续导数接近 1，该函数有助于防止梯度消失问题。因此，在更新细胞状态后获得网络的输出。类似于存储过程，tanh
    层和 sigmoid 层的积决定了输出的接受或拒绝。所有这些构成了神经网络过程。


    ![](img/7b4181520465acaef9ad22655e5fdc35_1_1.png)


    图 2. 架构


    # B. 卷积神经网络 (CNN)


    CNN 的主要设计是创建一个网络层尺度，初始层执行特征提取并传播到下一层以生成高阶特征。标准的 CNN 架构如图 2 所示。在时间功率数据进入该层后，通过与输入宽度相同的卷积层。接下来，池化层减少维度并为进一步训练做准备。将池化层的输出数据展平后，馈全连接层（这是一个标准的神经网络）。输出中存在非线性激活函数，从中获得最终输出。


    # C. 极端梯度提升 (XGBoost)


    XGBoost 是一个可扩展的学习系统，实现了优化的梯度 GBDT 框架。通用算法由 (7)-(10) 所示，每个集成模型使用加法技术一次学习一树。


    ```

    $y^{(k)} = \sum_{i} f_k(x_i) = y^{(k-1)} + f_k(x_i), f_k \in \mathcal{F}$ (7)

    $\Omega(f) = \gamma T + \lambda ||f||^2$ (8)

    $L^{(k)} = \sum_{i} (l(y_i, y^{(k-1)} + f_k(x_i))) + \Omega(f_k)$ (9)

    $f_k = \arg\min_{f} \sum_{i} (l^{(k-1)}(y_i, f(x_i)) + \alpha \Omega(f)$ (10)

    ```


