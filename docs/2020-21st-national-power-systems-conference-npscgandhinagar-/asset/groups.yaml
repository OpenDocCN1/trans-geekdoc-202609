    - \frac{V_j^{(i)}}{\Sigma_i^{(i)}} \quad (14)$

    ```


    ```

    $\beta_i + \beta_j + \beta_k = 1 \quad (15)$

    ```


    其中 $N_j^{(i)}$ 和 $N_i^{(i)}$ 是第 $i$ 个模型表现最优/次优的实例数。总观测数、$R^2$ 和 $\mathcal{E}^{(i)}$
    分别是第 $i$ 个模型的平均 RMSE 和分数。分配给每个模型的权重为 $\beta_i$。$y_p^{(i)}$ 是第 $i$ 个模型的预测值，$y_p$
