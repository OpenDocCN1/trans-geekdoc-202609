    # An Ensemble Model for Short-Term Wind Forecasting using Deep Learning and Gradient
    Boosting Algorithms


    Dehesh Kumar, Student Member, IEEE, Rishab Abhin, Student Member, IEEE, and Naran
    Pindoriya, Senior Member, IEEE

    Electrical Engineering, Institute of Technology Gandnagar, Gujarat, India

    Email: dehesh.kumar, rishabh.abhin, naran@itgn.ac


    Abstract— Accurate wind power forecasting is crucial for energy management and
    plays a significant role in making wind power producers competitive in the electricity
    market. Deep learning and gradient boosting decision-based algorithms have been
    proven in extreme scenarios to achieve good results. Since wind speed is highly
    volatile and varies both temporally and geographically, algorithms perform well
    in constrained datasets and poorly in others. For instance, it is better to use
    an ensemble model rather than relying on a single model. By combining the benefits
    of four machine learning algorithms, including Convolutional Neural Network (CNN),
    Long Short-Term Memory (LSTM), Gradient Boosting (LightGBM), and Extreme Gradient
    Boosting (XGB), to demonstrate the effectiveness of the proposed model, we utilize
    data from an actual wind field study. The proposed model outperforms the individual
    models and predicts wind power for different months with significant accuracy.


    On the other hand, methods learn the relationship between past and future data
    without explicitly programmed. Decision learning algorithms have been used for
    prediction due to their interpretability and simplicity [7]. It uses a boosting
    technique where weak learners are used to reduce bias and improve their error
    over each sequence. Gradient boosting is a powerful technique which utilizes parallel
    processing and regularization to overcome bias and overfitting [8]. Gradient Boosting
    Machine (LightGBM) is a highly efficient gradient-based algorithm that fosters
    level-wise growth resulting in significant loss reduction [9].


    Keywords—Neural network, deep learning, ensemble model, extreme gradient boosting,
    short-term memory, wind power prediction.


    Among machine learning algorithms, Artificial Neural Network (ANN) has been prevented
    in the past because of its complexity in handling nonlinear relationship between
    the input and output. Researchers have utilized several variations of ANN for
    wind power predictions like Adaptive Neuro-Fuzzy Inference System [10], Wavelet-based
    Neural Network [11]. In recent times, deep learning has been used extensively
    for applications. Deep learning utilizes hierarchical levels of ANN, such as Convolutional
    Neural Networks (CNN), which consist of deep neural networks, and Long-Term Memory
    (LSTM), which has sequential input data to handle long-term dependencies in the
    sequences faced by factual neural networks. This approach addresses the vanishing
    gradient problem by using convolutional RNNs [13]. Convolutional Neural Network
    (CNN) has better capabilities in terms of performance, and are far much faster
    than the LSTM [14].


    # I. INTRODUCTION


    Wind power forecasting has become increasingly important with an increase in the
    demand for wind power. All energy generating plants are called based on the day-ahead
    forecast for wind power. The deviation from the forecast to actual output will
    be an economic burden to wind farmers. Additionally, this leads to load imbalance,
    which may affect the stability of the grid. Therefore, the need for an accurate
    wind power forecast is essential in the development of strategies to participate
    in electricity markets [1].


    Wind power prediction can be achieved by two strategies. The first one determines
    the output of a wind from the wind speed, which itself depends on several atmospheric
    parameters like temperature, humidity, and air density. This prediction is achieved
    by Numerical Weather Prediction (NWP), which are based on mathematical models
    and resources [2]. The second approach involves wind power forecasting directly
    from the same wind field. Furthermore, this approach can be classified into statistical
    methods and machine learning methods. Algorithms try to find the mathematical
    relationship between the past and future time-series data using a recursive technique.
    The most common statistical methods used for wind forecasting are ARIMA [3], ARIMA
    [4], seasonal-ARIMA, and ARIMA with exogenous input (ARIMAX) [6].


    It is observed that all models perform well with different datasets. Since wind
    power is highly intermittent and varies, it is difficult to identify a single
    algorithm that works well for all cases. Therefore, combining two or more models
    in better forecasting and robustness [15], [16]. This paper presents a novel ensemble
    model that extracts benefits of combining CNN, LSTM, and LightGBM. The accuracy
    of each algorithm is enhanced using hyperparameters tuning and regularization,
    which is reflected in the ensemble test. The proposed model predicts wind power
    data from an actual wind field.


    The rest of the paper is organized as follows. We explain the individual algorithms
    and the proposed ensemble in Section II. Section III describes data-processing
    and hyperparameters tuning. The comparison of methods and results are discussed
    in Section IV, while the concluding remarks are presented in Section V.


    # II. METHODOLOGY


    Deep learning architectures are efficient in learning complex features of a dataset
    but at cost of large training requirements and high computational power. In contrast,
    tree models are computationally inexpensive and require fewer data to provide
    satisfactory predictions. We have considered two deep neural networks (CNN and
    LSTM) and two Gradient Decision Tree (GBDT) algorithms (XGBoost and LightGBM)
    for our study. Each of the algorithms is briefly discussed.


    # A. Long-Term Memory (LSTM)


    The fundamental principle behind the LSTM is with a memory cell carries, which
    travels throughout the network with its unchanged and controlling the information
    using specific regulatory structures known as, controlling the process of memory.
    A standard LSTM architecture is shown in Fig. 1, which is explained by (1):


    ```

    $f_t = \sigma(W_f x_t + U_f h_{t-1} + b_f)$ (1)

    $i_t = \sigma(W_i x_t + U_i h_{t-1} + b_i)$ (2)

    $o_t = \sigma(W_o x_t + U_o h_{t-1} + b_o)$ (3)

    $$\tilde{c}_t = \tanh(W_c x_t + U_c h_{t-1} + b_c)$ (4)

    $c_t = f_t \odot c_{t-1} + i_t \odot \tilde{c}_t$ (5)

    $h_t = o_t \odot \tanh(c_t)$ (6)

    ```


    where $f_t, i_t,$ and $o_t$ are forget, input and output gates, respectively.
    $h$ and $c$ indicate the hidden layer and memory cell state, respectively. $W$
    represents the weight coefficient, and $b$ represents the bias vector. $\odot$
    is element-wise multiplication, $\sigma$ is the sigmoid function, and $tanh$ is
    the tangent function. For example the gate with a sigmoid layer decides the acceptance
    or rejection of information from the cell state representing long-term memory.
    The cell with a sigmoid layer decides what new information is to be added to the
    cell state. The tanh function helps in preventing the vanishing gradient problem
    as its successive derivative is close to unity. Therefore, the output of the network
    is obtained after updating the cell state. Similar to the store process, the product
    of the tanh layer and sigmoid layer decides the acceptance or rejection of output.
    All of these constitutes the neural network process.


    ![](img/7b4181520465acaef9ad22655e5fdc35_1_0.png)


    Fig. 2. Architecture


    # B. Convolutional Neural Networks (CNN)


    The primary design of CNN is to create a scale of network layers, where the initial
    layer performs feature extraction and propagate to the next layers for higher-order
    feature generation. Standard CNN architecture is shown in Fig. 2. In the time
    power data is to enter the layer, which travels through the convolutional layers
    of the same width as input. Next, a pooling layer reduces the dimension and is
    prepared for further training. Flatting the output data from the pooling layer,
    is fed to a fully connected layer, which is standard neural network. In the output
    nonlinear activation functions are present, from which final output is obtained.


    # C. Extreme Gradient Boosting (XGBoost)


    XGBoost is an extensible learning system that implements optimized gradient GBDT
    framework. Generic algorithm is shown by (7)-(10), where each ensemble model learns
    one tree at a time using an additive technique.


    ```

    $y^{(k)} = \sum_{i} f_k(x_i) = y^{(k-1)} + f_k(x_i), f_k \in \mathcal{F}$ (7)

    $\Omega(f) = \gamma T + \lambda ||f||^2$ (8)

    $L^{(k)} = \sum_{i} (l(y_i, y^{(k-1)} + f_k(x_i))) + \Omega(f_k)$ (9)

    $f_k = \arg\min_{f} \sum_{i} (l^{(k-1)}(y_i, f(x_i)) + \alpha \Omega(f)$ (10)

    ```


    ![](img/7b4181520465acaef9ad22655e5fdc35_1_1.png)


    Fig. 1. LSTM Architecture

