    ```

    $y_p = \sum_{i=1}^{n} \beta_i y_p^{(i)} \quad (16)$

    ```


    其中 $j$ 在点 $p$ 处分裂，$V_p$ 是分裂的方差，$(i_1, i_2, ..., i_n)$ 分别是左右数据的 $n$ 个独立同分布实例。每个实例的梯度损失由
    $(\sigma_{i_t}, \beta_i)$ 给出，其中 $\sigma$ 和 $\beta$ 分别是大梯度样本和小梯度样本。使用近似集和验证集来确定准确性和方差，其衡量方法类似于
    XGBoost。LightGBM 能够很好地处理高维数据中的稀疏性。通过对特征空间中的某些特征进行捆绑，将其合并在一起，减少了训练过程中的复杂度。


    ## E. 提出的模型


    时间序列预测的准确性非常敏感，对于哪种模型最好并没有共识。最常见且简单的方法是使用所有可用模型的线性组合。在本文中，我们提出了一种凸组合方法，通过结合基于误差的方法和表现最优的模型
    [21] 来计算相应的权重，对之前讨论的四个模型的预测进行加权平均。计算每年每月的误差，然后根据性能进行排名。性能使用均方根误差 (RMSE) 和 R 方评分
    ($R^2$) 进行衡量，由公式 (12)-(13) 给出。


    ![](img/7b4181520465acaef9ad22655e5fdc35_2_0.png)


    ```

    $RMSE = \sqrt{\frac{\sum_{i=1}^{n}(y_i - \hat{y}_i)^2}{n}} \quad (12)$

    ```


    ```

    $R^2 = 1 - \frac{\sum_{i=1}^{n}(y_i - \hat{y}_i)^2}{\sum_{i=1}^{n}(y_i - \bar{y})^2}
    \quad (13)$

    ```


    其中 $y_i$ 和 $\hat{y}_i$ 是第 $i$ 步的实际功率和预测功率，$\bar{y}$ 是样本量 $n$ 内实际功率的平均值。我们计算了每个月的
    RMSE 和 $R^2$，并对最优和次优性能进行了排名。


    图. 3. 风电数据


    ## A. 数据预处理


    ```

    $[x_{t-w_1}, x_{t-w_2}, ..., x_{t-w_t}, 0\}, \n[x_{t-1-w_1}, ..., x_{t-1}, \{0+t_p\}]
    \quad (17)$

    ```


    ![](img/7b4181520465acaef9ad22655e5fdc35_3_0.png)


    其中 $t$ 是训练输入，$o$ 是待预测的输出标签。窗口大小由 $w$ 决定，它是输入向量的长度。当有 $t_{wr} = 12$ 且 $t_p = 9$
    时，我们训练多步序列。得到的多步序列通过公式 (18) 归一化到 [0,1]。


    ```

    $x_i = \frac{x_i - x_{min}}{x_{max} - x_{min}} \quad (18)$

    ```


    使用单个模型和集成模型的预测过程如图4 所示。


    ## B. 超参数调优和正则化


    算法往往容易出现过拟合（高方差），可以通过正则化来防止。另一方面，欠拟合或高偏差可以通过调优超参数来减少。超参数调优和正则化有助于提高算法准确性。


    - LSTM：我们使用了双向层和 tan-sigmoid 激活函数。考虑到训练过程，我们在准确性和计算时间之间通过选择 batch size 和 epochs
    进行了权衡。

    - CNN：我们使用了一维模型。与 LSTM 模型类似，L2 正则化和丢弃（dropout）提高了模型性能。此外，添加池化层显著提高了指标和预测 [23]。

    - XGBoost：通过调优估计器数量、最小权重、gamma 和学习率提高了预测精度。

    - LightGBM：与 XGBoost 类似，最小权重学习率增强了模型性能。此外，通过调优最大深度和叶节点提高了算法的计算速度和准确性。如下所示：


    ### I. LSTM & CNN 的控制参数


    | 控制参数 | LSTM | CNN |

    | :--- | :--- | :--- |

    | 模型类型 | 双向 | 1D 卷积 |

    | Mini batch size | 256 | 256 |

    | Dropout | 0.2 | 100 |

    | 激活函数 | tan-sigmoid | rectified linear |

    | 优化器 | Adam | Adam |

    | L2 正则化 | 0.01 | 0.001 |

    | 层 | 6 | 6 |

    | 全连接层 | 2 | 2 |

    | 输出维度 | 每层 50 | 32, 16, 4 |

    | 学习率 | 0.2 | 0.01/epoch |

    | 卷积大小 | - | 2 |


    ### II. XGBOST & LIGHTGBM 的控制参数


    | 调优值 | XGBoost | LightGBM |

    | :--- | :--- | :--- |

    | 估计器数量 | 2500 | |

    | 最大深度 | 6 | 5 |

    | 最小子权重 | 1 | 7 |

    | 学习率 | 0.3 | 0.02 |

    | Gamma | 1 | |

    | 样本量 | - | GBDT |

    |  Boosting 类型 | - | |

    | 叶节点数量 | - | 64 |

    | 特征比例 | - | 0.9 |

    | Bagging 比例 | - | |

    | 最小分裂增益 | - | 0.037 |


    图 5 展示了不同模型通过超参数、dropout 和正则化带来的改进。在 CNN 和 LSTM 的情况下，学习率降低了 RMSE。同样，XGBoost 和
    LightGBM 的准确性通过增加最大深度和最小权重得到了提高。


    ![](img/7b4181520465acaef9ad22655e5fdc35_3_1.png)


    ![](img/7b4181520465acaef9ad22655e5fdc35_4_0.png)


    图 6. 所有模型的日前风电预测


    ## IV. 结果与讨论


    我们对2014年的每个月份运行了四个模型以确定每个模型的权重。然后，我们使用这些权重预测每个月的风电。八月的风电权重最高。在图 7 中，我们使用 $R^2$
    分数比较了所有模型和集成模型，如表 III 和表 IV 所示。从上述表中可以看出，CNN表现最好。此外，平均 RMSE 和 $R^2$ 分数分别为 CNN、LSTM、LightGBM
    和 XGBoost。对于集成模型，增强效果足以使深度学习模型优于基于 GBDT 的模型。然而，我们观察到 XGBoost 预测过度，而其他模型似乎存在欠拟合。


