    model. Then, we used weights to predict the wind power for each month. Wind power
    in the month of August showed the highest weight. In Fig. 7, we compared all the
    models and the ensemble model using the metric $R^2$, score, which is presented
    in Table III and Table IV. It can be noted from the above tables that CNN performed
    best among all. Also, the mean RMSE and $R^2$ score were for CNN, LSTM, LightGBM,
    and XGBoost. For, the ensemble was enhanced enough that deep learning models outperformed
    the GBDT based models. However, we observed that XGBoost overpredicted, whereas
    other models seemed to underfit.


