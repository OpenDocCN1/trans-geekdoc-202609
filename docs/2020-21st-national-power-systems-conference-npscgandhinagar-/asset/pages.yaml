    # V. CONCLUSION


    This paper proposes an ensemble of four learning algorithms, namely CNN, LSTM,
    LGBM, and XGBoost for short term wind power forecasting. The proposed method uses
    a weighted average of the models to improve the performance of the models by using
    the performance-based approach and adjust the weight of each model. Among the
    two deep learning, CNN is competitive with LSTM, but achieved the fastest among
    all models. However, due to the high time cost of the LSTM model, LGBM’s learning
    could not add any significant impact on the speed of the proposed method. Integrating
    regularization and tuning the hyperparameters can enhance the performance and
    flexibility of both. Both the deep learning algorithms work because of the sufficiently
    large data available for adequate training. The ensemble model is detected by
    CNN, which shows the performance of the ensemble is reasonably well throughout
    the year compared to the other models. The proposed method is robust enough to
    predict for different months with relatively low RMSE and high R$^2$.


