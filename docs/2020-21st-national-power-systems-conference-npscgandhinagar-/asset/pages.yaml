  md: "# II. METHODOLOGY\n\nDeep learning architectures are efficient in learning\
    \ complex features of a dataset but at cost of large training requirements and\
    \ high computational power. In contrast, tree models are computationally inexpensive\
    \ and require fewer data to provide satisfactory predictions. We have considered\
    \ two deep neural networks (CNN and LSTM) and two Gradient Decision Tree (GBDT)\
    \ algorithms (XGBoost and LightGBM) for our study. Each of the algorithms is briefly\
    \ discussed.\n\n# A. Long-Term Memory (LSTM)\n\nThe fundamental principle behind\
    \ the LSTM is with a memory cell carries, which travels throughout the network\
    \ with its unchanged and controlling the information using specific regulatory\
    \ structures known as, controlling the process of memory. A standard LSTM architecture\
    \ is shown in Fig. 1, which is explained by (1):\n\n```\n$f_t = \\sigma(W_f x_t\
    \ + U_f h_{t-1} + b_f)$ (1)\n$i_t = \\sigma(W_i x_t + U_i h_{t-1} + b_i)$ (2)\n\
    $o_t = \\sigma(W_o x_t + U_o h_{t-1} + b_o)$ (3)\n$$\\tilde{c}_t = \\tanh(W_c\
    \ x_t + U_c h_{t-1} + b_c)$ (4)\n$c_t = f_t \\odot c_{t-1} + i_t \\odot \\tilde{c}_t$\
    \ (5)\n$h_t = o_t \\odot \\tanh(c_t)$ (6)\n```\n\nwhere $f_t, i_t,$ and $o_t$\
    \ are forget, input and output gates, respectively. $h$ and $c$ indicate the hidden\
    \ layer and memory cell state, respectively. $W$ represents the weight coefficient,\
    \ and $b$ represents the bias vector. $\\odot$ is element-wise multiplication,\
    \ $\\sigma$ is the sigmoid function, and $\tanh$ is the tangent function. For\
    \ example the gate with a sigmoid layer decides the acceptance or rejection of\
    \ information from the cell state representing long-term memory. The cell with\
    \ a sigmoid layer decides what new information is to be added to the cell state.\
    \ The tanh function helps in preventing the vanishing gradient problem as its\
    \ successive derivative is close to unity. Therefore, the output of the network\
    \ is obtained after updating the cell state. Similar to the store process, the\
    \ product of the tanh layer and sigmoid layer decides the acceptance or rejection\
    \ of output. All of these constitutes the neural network learning process.\n\n\
