    # B. Hyperparameter tuning and regularization


    Machine algorithms often suffer from overfitting (high variance), which can be
    prevented using various regularization techniques. On the other hand, underfitting
    or high bias can be reduced by tuning hyperparameters. Hyperparameter tuning and
    regularization help in improving the accuracy of the algorithm


    a) LSTM: We used bidirectional LSTM layers with the tan-sigmoid activation function.
    Considering the training process we had to trade between the accuracy and the
    computational time by choosing appropriate batch size and epochs. We observed
    that L2 regularization and dropout significantly improved the prediction accuracy.


    b) CNN: We used a one-dimensional CNN model because of the univariate series data.
    Similar to the LSTM model, L2 regularization and dropout improved model performance.
    Additionally, adding the pooling layer significantly improved the metrics and
    predictions [23].


    c) XGBoost: The prediction accuracy improved by tuning the number of estimators,
    minimum child weight, gamma and learning rate.


    d) LightGBM: Similar to XGBoost, minimum child weight, learning rate enhanced
    the model performance. Furthermore, the computational speed and accuracy of the
    algorithm improved by tuning the maximum depth and the number of leaves. The tuned
    values for the discussed models are presented in Table I and II.


