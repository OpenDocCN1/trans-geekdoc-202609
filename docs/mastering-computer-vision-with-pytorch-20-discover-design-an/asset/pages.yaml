    # Underfitting


    Underfitting, on the other hand, occurs when a model is too simplistic and cannot
    capture the underlying patterns in the data. This happens when the model is not
    complex enough to learn the relationships between the input features and the output
    labels. As a result, it performs poorly on both the training and validation sets.


    Underfitting typically occurs when the model''s architecture is too simple, lacks
    sufficient parameters, or when trained for too few epochs. In these cases, the
    model fails to grasp the essential features of the dataset, leading to poor performance
    across the board. Unlike overfitting, underfitting is easier to detect since the
    model''s performance is subpar from the outset.


    # Indicators of Underfitting


    +   • **High Training Loss:** If the training loss is high and doesn''t decrease
    significantly during training, the model might be underfitting.

    +   • **Low Complexity:** Underfitting is often a result of a model being too
    simple for the task. For instance, using a small neural network for a complex
    computer vision task can lead to underfitting.

    +   • **Inadequate Training:** If a model isn''t trained for enough epochs or
    doesn''t have enough data to learn from, it may underfit.'
