  md: 'Under the hood, the MPS backend leverages the Metal Shading Language to compile
    PyTorch operations into GPU kernels, executing them on the GPU instead of the
    CPU. This shift in computation offloads a significant amount of work from the
    CPU, enabling faster model training and inference.


    For those acquainted with PyTorch 1.x, you might recall the absence of a dedicated
    GPU acceleration backend for Mac. The incorporation of the MPS backend in PyTorch
    2.0 fills this void, offering a streamlined path for exploiting the GPU resources
    on Mac platforms.


    ```

    # A simple example to demonstrate the speed-up

    # Assume model is a pre-defined PyTorch model

    import time


    # Time the training on CPU (default)

    start_time = time.time()

    model.train()

    cpu_time = time.time() - start_time


    # Enable MPS backend

    torch.backends.mps.set_enabled(True)


    # Time the training on GPU

    start_time = time.time()

    model.train()

    gpu_time = time.time() - start_time


    # Display the time difference

    print(f'' Training time on CPU: {cpu_time:.2f} seconds'')

    print(f'' Training time on GPU with MPS backend: {gpu_time:.2f} seconds'')

    ```


    In the preceding example, a simple timer is used to compare the training time
    on CPU and GPU. By enabling the MPS backend, you''ll notice a significant reduction
    in training time, showcasing the performance gains achievable with GPU acceleration
    on Mac.'
