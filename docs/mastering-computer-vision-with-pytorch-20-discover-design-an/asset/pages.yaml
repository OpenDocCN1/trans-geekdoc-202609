    \ of three layers. These blocks include an initial dimensionality reduction step\
    \ using 1x1 convolutions, followed by the main 3x3 convolution, and then another\
    \ 1x1 convolution to restore dimensionality. Here's an example Bottleneck block:\n\
    \n```\nclass Bottleneck(nn.Module):\n    expansion = 4\n\n    def __init__(self,\
    \ in_channels, out_channels, stride=1,\n                 downsample=None):\n \
    \       super(Bottleneck, self).__init__()\n\n        # First 1x1 convolution\n\
    \        self.conv1 = nn.Conv2d(in_channels, out_channels,\n                 \
    \              kernel_size=1, bias=False)\n        self.bn1 = nn.BatchNorm2d(out_channels)\n\
    \n        # Second 3x3 convolution\n        self.conv2 = nn.Conv2d(out_channels,\
    \ out_channels,\n                               kernel_size=3, stride=stride,\
    \ padding=1, bias=False)\n        self.bn2 = nn.BatchNorm2d(out_channels)\n\n\
    \        # Third 1x1 convolution with expansion\n        self.conv3 = nn.Conv2d(out_channels,\
    \ out_channels * \n                               self.expansion, kernel_size=1,\
    \ bias=False)\n        self.bn3 = nn.BatchNorm2d(out_channels * self.expansion)\n\
    \n        self.relu = nn.ReLU(inplace=True)\n        self.downsample = downsample\n\
    ```"
