    a granular understanding of images, learning to categorize and isolate particular
    sections —essentially moving from a global view to an array of localized interpretations.


    **Importance for Machine Perception:** Imbuing machines with the ability to detect
    objects mirrors the cognitive processes inherent to human visual perception. Our
