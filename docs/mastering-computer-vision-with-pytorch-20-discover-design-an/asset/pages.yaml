    # # Broadcasting in PyTorch


    Broadcasting allows PyTorch to perform operations on tensors of different shapes,
    making tensor manipulation more flexible. Rather than requiring identical dimensions,
    PyTorch uses broadcasting rules to “stretch” smaller dimensions to match larger
    ones, so that operations like addition, multiplication, or division can be executed.


