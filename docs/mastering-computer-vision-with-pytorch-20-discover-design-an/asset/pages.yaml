    # Adapting to MPS Backend on Mac for GPU Acceleration


    The advent of PyTorch 2.0 has brought about several enhancements, one of which
    is the inclusion of the Metal Performance Shaders (MPS) backend for GPU acceleration
    on Mac platforms. This new backend significantly boosts the performance of PyTorch
    models on Mac by utilizing the GPU''s processing power. Whether you''re a novice
    delving into the realms of machine learning or an expert aiming for optimized
    performance, adapting to the MPS backend can provide a remarkable acceleration
    to your PyTorch projects on a Mac. Here''s how you can make the shift:


    ```

    # Import the torch module

    import torch


    # Enable MPS backend for GPU acceleration

    torch.backends.mps.set_enabled(True)

    ```


