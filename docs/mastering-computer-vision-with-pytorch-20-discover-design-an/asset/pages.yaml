    # # Understanding Computational Graphs in PyTorch


    At the heart of deep learning frameworks lies the concept of a computational graph,
    a directed graph where nodes correspond to operations or variables. Computational
    graphs enable efficient computation of gradients, making them indispensable for
    training neural networks. In PyTorch, these graphs aren''t just static structures
    but are dynamic, evolving entities built on-the-fly. Let''s delve deeper to unravel
    the mysteries of these graphs.


    # # Computational Graph


    A computational graph is a visual representation of mathematical operations laid
    out in a sequence. Each node in this graph represents an operation, and the edges
    stand for tensors that flow between them. Think of this as a step-by-step guide,
    showing how data transforms and moves through your defined operations.


    Real-world analogy: Imagine baking a cake. You follow a recipe that dictates the
    sequence in which ingredients are mixed. The recipe can be thought of as a computational
    graph, where each step (or node) is an action, for example, “mix” or “bake,” and
    the ingredients (or edges) flow through these steps.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# # The Dynamic Nature of PyTorch’s Graphs


    PyTorch stands out because of its define-by-run philosophy. In traditional “define-and-run”
    frameworks, you first set the entire computation (define the full recipe) and
    then pass the data (ingredients). However, in define-by-run frameworks like PyTorch,
    you can change the computation on-the-go based on the input data, resulting in
    a dynamic computational graph.


    ```

    ```python

    # PyTorch

    import torch

    a = torch.tensor(2.0, requires_grad=True)

    b = torch.tensor(3.0, requires_grad=True)

    c = a + b

    c.backward() # Gradients are computed here

    print(a.grad) # Outputs: 1.0 (because dc/da = 1)

    ```

    ```


    In the preceding code, as soon as the addition operation is performed, a computational
    graph is constructed, linking tensors a and b to their resultant tensor c.


    # # Nodes and Edges in Computational Graphs


    **Nodes**: These usually represent operations. Simple operations such as addition
    or multiplication, or complex ones such as convolution or batch normalization,
    all find representation as nodes.


    **Edges**: Tensors flow through these edges. When an operation is performed on
    two tensors, the resulting tensor carries forward information from its ancestors.


    ```

    ```python

    # PyTorch

    import torch

    x = torch.tensor(2.0, requires_grad=True)

    y = x 2

    z = y * 3

    ```

    ```


