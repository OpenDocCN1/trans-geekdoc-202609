    # # Grid Search


    Grid search is one of the most straightforward techniques for hyperparameter tuning.
    It works by exhaustively searching through a specified set of hyperparameters,
    evaluating the model performance for each combination. While grid search is simple
    to implement, it can be computationally expensive, especially when working with
    large models and many hyperparameters. However, it is useful for small to medium-sized
    search spaces where every possible combination can be evaluated.


    # # Working of Grid Search


    In grid search, you define a set of possible values for each hyperparameter. The
    algorithm then trains the model on every possible combination of these values,
    using cross-validation to evaluate the performance of each configuration.


    For example, if you’re tuning the learning rate and batch size, you might specify
    a range of learning rates (for example, 0.001, 0.01, 0.1) and batch sizes (for
    example, 16, 32, 64). Grid search will train the model using each combination
    of these values and select the configuration that performs best on the validation
    set.'
