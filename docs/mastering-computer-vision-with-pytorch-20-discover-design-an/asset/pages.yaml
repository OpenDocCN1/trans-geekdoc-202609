    # Breaking Down the LightningModule


    In this PyTorch Lightning version, the model logic is separated from the training
    loop:


    +   • **forward()**: Defines the forward pass, just like in standard PyTorch.
    This remains unchanged.


    +   • **training_step()**: Handles a single training iteration. It takes a batch
    of inputs and targets, performs the forward pass, calculates the loss, and returns
    it. This removes the need to manually write the training loop in every experiment.


    +   • **validation_step()**: Optionally handles validation logic, keeping the
    training and validation steps consistent.


    +   • **configure_optimizers()**: Returns the optimizer, which is automatically
    used by the PyTorch Lightning Trainer.


    By using the Trainer class, PyTorch Lightning handles all the boilerplate code
    related to training loops, backpropagation, and optimization. As you can see,
    the Lightning version is more modular and easier to maintain. This approach also
    allows for easy scaling, as Lightning abstracts away the details of handling multiple
    devices (GPUs) and distributed training.


