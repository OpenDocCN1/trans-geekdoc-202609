    taken at different times of the day or year present variations in lighting and
    shadow. Initial models might confuse shadows with water bodies or misclassify
    urban areas obscured by clouds. By applying augmentations that mimic these conditions,
    such as random brightness and contrast adjustments or synthetic occlusions, the
    classification accuracy increases. For instance, after training with augmented
    data, a model will improve its classification accuracy of water bodies.


