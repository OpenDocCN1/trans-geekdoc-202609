    # View and Reshape


    Both `view` and `reshape` methods allow you to change the shape of a tensor without
    altering its data. However, there is a subtle difference between them in terms
    of memory usage:


    **view**: This method returns a reshaped tensor that shares the same memory as
    the original tensor, which makes it more memory-efficient. It requires the tensor
    to be contiguous in memory, meaning the elements are stored in an unbroken sequence.
    If the tensor isn’t contiguous, you may need to call `.contiguous()` before using
    `view`.


    **reshape**: This method can return either a `view` or a copy of the original
    tensor. If possible, it will return a `view` for efficiency.'
