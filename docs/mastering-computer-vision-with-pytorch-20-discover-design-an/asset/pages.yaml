  md: 'TorchScript is a way to serialize your PyTorch models, allowing them to be
    run in a non-Python environment. This is especially important when it comes to
    deploying PyTorch models in production, where Python may not be available or desirable
    due to its performance characteristics.


    TorchScript uses a static graph representation of a PyTorch model, which can be
    optimized for specific hardware. This static graph representation is also more
    amenable to deployment in low-latency, high-throughput production settings as
    it can be directly loaded into the PyTorch C++ API.


    TorchScript provides a seamless transition from eager mode to graph mode via a
    process known as **tracing** or **scripting**.


    # Tracing


    Tracing allows you to take an existing module and record all the tensor computations
    it performs during the forward pass into a **torch.jit.ScriptModule**.


    Here''s an example:


    ```

    import torch

    import torchvision.models as models


    # An instance of your model.

    model = models.resnet50()


    # An example input you would normally provide to your model''s forward() method.

    example = torch.rand(1, 3, 224, 224)


    # Use torch.jit.trace to generate a torch.jit.ScriptModule via tracing.

    traced_script_module = torch.jit.trace(model, example)

    ```


    In this example, we first create a ResNet model. Then, we generate an example
    input tensor, and pass both the model and the example input to **torch.jit.trace**,
    which records the computations performed by the model when run on the'
  merge: -1
