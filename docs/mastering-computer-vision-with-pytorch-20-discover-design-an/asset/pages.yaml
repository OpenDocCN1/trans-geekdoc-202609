    +   1. **Align dimensions from the right:** PyTorch compares each tensor''s dimensions
    starting from the rightmost side.

    +   2. **Match or Stretch:** For each dimension, two sizes are compatible if:

    +      a. They are equal, or

    +      b. One of them is one (the smaller tensor will be “stretched” to match
    the larger one).


