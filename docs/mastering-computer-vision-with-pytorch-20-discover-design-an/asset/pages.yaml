    # Brief Overview of PyTorch


    PyTorch, at its core, is a free machine-learning framework. It offers two high-level
    features: deep neural networks constructed using a tape-based autograd system
    and tensor calculations with excellent GPU acceleration support. To put it simply,
    PyTorch includes all the tools required to create and train deep learning models.


    However, PyTorch’s ‘Pythonic’ aspect sets it apart from other machine learning
    frameworks. PyTorch is not for binding Python into a rigid C++ framework. It is
    designed to be tightly linked with Python and uses Python’s strength to provide
    a fluid and adaptable user experience. Nearly the same procedures apply when using
    PyTorch as when using NumPy. And because PyTorch tensors and NumPy arrays are
    so similar, you can easily swap between the two.


    What makes PyTorch particularly attractive for computer vision is its extensive
    ecosystem of libraries and tools that'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'specifically cater to vision tasks. TorchVision, a package in PyTorch, has
    datasets, models (including pre-trained models), and transformation functions
    for images. This means that PyTorch provides us with ready-to-use tools and functionalities
    that can help us in a wide array of vision tasks, thereby letting us focus on
    the unique aspects of our specific problems.


    But PyTorch is not just about simplicity and ease of use. It’s also about power
    and control. PyTorch uses a method called “define-by-run” for building computational
    graphs, in contrast to the “define-and-run” method used in many other frameworks.
    This means that the computational graph, a series of operations that defines a
    mathematical model, is defined on the go as the operations occur. This provides
    a lot of flexibility and lets us do complex things with our models.


    And it goes beyond that. PyTorch has improved in both power and usability with
    version 2.0. The history of PyTorch will be covered in more detail on the next
    pages, along with instructions on how to install and set up PyTorch and an examination
    of the main changes and additions made in PyTorch 2.0. We’re about to blast off
    into the realm of PyTorch 2.0 and computer vision, so buckle up!


    # PyTorch and Computer Vision


    PyTorch has positioned itself as a go-to library for Computer Vision tasks. It
    offers a perfect blend of flexibility and power. The ease with which you can build,
    train, and tweak deep learning models makes PyTorch an attractive choice for researchers
    and developers in the field of computer vision. But the appeal doesn’t stop at
    flexibility. PyTorch also provides efficiency and performance allowing it to scale
    from prototyping stages to large-scale deployment.'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'One of the primary reasons why PyTorch is widely used in computer vision is
    its rich ecosystem of libraries and tools explicitly designed for vision tasks.
    Torchvision, a package in PyTorch, includes an array of pre-processed datasets
    and pre-trained models, such as ResNet and VGG, which have established benchmarks
    in various computer vision tasks. It also provides transformation functions to
    perform image manipulations, a crucial aspect in any computer vision pipeline.


    With PyTorch’s “define-by-run” paradigm, the dynamic computation graph becomes
    an excellent fit for the sequence of operations typically found in computer vision
    tasks. This approach provides researchers and developers with maximum flexibility
    in designing and experimenting with complex architectures, which is often necessary
    in the rapidly evolving field of computer vision.


    Furthermore, the enhancements brought about by PyTorch 2.0 have strengthened its
    position even more. Improvements in performance, new APIs, and features like mobile
    deployment make PyTorch 2.0 a compelling choice for any computer vision task -
    from image classification and object detection to semantic segmentation and beyond.


    In summary, the combination of PyTorch’s intuitive design, coupled with its strong
    performance characteristics, has made it a favorite among the computer vision
    community. As we move forward in this book, you will get a hands-on experience
    of using PyTorch for various exciting and impactful computer vision tasks and
    use cases.


    # Origin and Emergence of PyTorch


    PyTorch has its roots in the Torch library, a machine learning library based on
    the Lua programming language, and widely used in academia. Torch, however, suffered
    from the limitations of Lua and lacked the rich ecosystem of libraries'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'that other programming languages provided. To address these challenges, a group
    of AI researchers at Facebook, Soumith Chintala, the director of AI Research (FAIR),
    began constructing a brand new deep learning system. They wanted a tool that was
    just as responsive, adaptable, and user-friendly as Torch while also being tightly
    connected with a more powerful programming language.


    They introduced PyTorch, an open-source machine learning package created for Python,
    in January 2017. Python, a language that was already a leader in the field of
    scientific computing and had a strong ecosystem of libraries like NumPy, SciPy,
    and Matplotlib, was created with the intention of bringing the magic of the Torch
    library to Python. The machine learning community reacted positively to PyTorch’s
    release, which hastened the adoption of this tool.


    # PyTorch’s Philosophy and Early Days


    From the beginning, PyTorch was guided by a Python-first philosophy. It wasn’t
    a binding into a monolithic C++ framework, but a tool built to be deeply integrated
    with Python. It could leverage the power of Python to deliver a user experience
    that was smooth, flexible, and intuitive. This was in stark contrast to other
    machine learning frameworks of the time, which often felt like they were fighting
    against Python’s dynamics, rather than embracing them.


    The Python-first design of PyTorch had profound implications. It meant that users
    could leverage the full power of Python when working with PyTorch, and they could
    use native Python control flow statements in their models. It also meant that
    debugging PyTorch models was as straightforward as debugging Python scripts. This
    was a'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'breath of fresh air for developers who were accustomed to

    the opaqueness of other frameworks.


    Furthermore, PyTorch was designed to be imperative or

    define-by-run, which means the computational graph, a

    series of operations that define a mathematical model, is

    defined on the fly as the operations occur. This was unlike

    the static, define-and-run computational graphs found in

    many other frameworks. The dynamic nature of PyTorch

    provided a lot of flexibility and allowed users to use native

    Python debugging tools. This was another factor that

    contributed to PyTorch’s rapidly growing popularity.


    Despite coming late to a field already dominated by several

    well-known frameworks, PyTorch soon established itself.

    Many researchers identified with its design ethos, while

    developers favored it because it worked well with Python.

    PyTorch has already established itself as a major force in the

    deep learning industry by the conclusion of its first year. The

    PyTorch team, however, was not satisfied with that. They

    were eager to push the envelope even further, and as a

    result, PyTorch 2.0 was created. This new version of PyTorch

    is more potent, effective, and user-friendly than before.


    As we move forward, we will delve deeper into the features

    and enhancements brought by PyTorch 2.0 and explore how

    they can help us in our journey through the realm of

    computer vision and artificial intelligence.


    # # Evolution and Growth of PyTorch


    The early success of PyTorch was just the beginning. From

    its inception, PyTorch continually evolved and matured,

    guided by feedback and contributions from its growing user

    community.


    One of the significant developments in PyTorch’s evolution

    was the release of TorchScript in PyTorch 1.0. TorchScript is a

    way to separate your PyTorch model from Python, making it'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'portable and optimizable. TorchScript uses PyTorch''s JIT compiler to compile
    Python code into an intermediate representation that can then be run in a high-performance
    environment such as C++. This was a significant step forward because it made PyTorch
    models much more scalable and production-ready.


    In addition, PyTorch continued to enrich its ecosystem. Libraries such as TorchText
    for natural language processing tasks and TorchVision for computer vision tasks,
    provided users with a wealth of resources for their projects. Newer additions
    such as the Captum for model interpretability, and PyTorch Lightning, a lightweight
    wrapper for more organized PyTorch code, made PyTorch even more versatile and
    user-friendly.


    # # Adoption of PyTorch


    As PyTorch matured, it also saw significant adoption. The clear syntax, dynamic
    computation graphs, and strong support for GPUs made it a favorite among researchers
    and developers alike. Its deep integration with Python and its active, open-source
    community also contributed to its popularity.


    By the end of 2018, just a year after its launch, PyTorch was already one of the
    most popular deep learning frameworks, widely adopted in both academia and industry.
    Several notable companies and research institutions started to switch to PyTorch,
    including Uber’s Pyro, HuggingFace’s Transformers, and Catalyst, to name a few.


    However, what truly cemented PyTorch’s place in the pantheon of deep learning
    tools was its adoption by major AI research labs. For example, OpenAI switched
    to PyTorch as its primary research platform in 2020, citing PyTorch’s ease of
    use and efficiency as the primary reasons.'
