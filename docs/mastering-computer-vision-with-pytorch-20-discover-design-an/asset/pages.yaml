    +   - **transforms.ToTensor:** Converts the image to a PyTorch tensor.

    +   - **transforms.Normalize:** Normalizes the pixel values of the image.


    **DataLoader:**

    The **DataLoader** in PyTorch is an essential tool for loading and handling data
    in batches. It provides an efficient way to handle large datasets by automatically
