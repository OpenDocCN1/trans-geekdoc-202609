    # Dynamic Computation Graphs and the Define-by-Run Paradigm


    In the world of deep learning, there are two main paradigms for defining computation
    graphs - static (define-and-run) and dynamic (define-by-run).


    In a static graph (used by TensorFlow prior to version 2.0), the graph is defined
    and optimized before running the session. The same graph is then run repeatedly,
    allowing for certain performance optimizations, but at the cost of flexibility.
    Modifying the graph requires a complete rebuild, making debugging and dynamic
    modifications harder.


    On the other hand, PyTorch uses the dynamic or define-by-run graph paradigm. Each
    forward pass defines a new computation graph. Nodes in the graph are Python objects
    and edges are tensors flowing between them. As operations are carried out, the
    graph is built on the fly. This provides an immense degree of flexibility, making
    PyTorch well-suited for models that need to have their architecture changed dynamically
    during execution, such as recurrent neural'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'networks (RNNs) and models with loops or conditional statements.


    ```

    # PyTorch dynamic graph example

    import torch

    x = torch.ones(2, 2, requires_grad=True)

    print(x) # tensor([[1., 1.], [1., 1.]], requires_grad=True)

    y = x + 2

    print(y) # tensor([[3., 3.], [3., 3.]], grad_fn=

    <AddBackward0>)

    ```


    In the preceding code, we first define a 2x2 tensor x. Then we perform an operation
    y = x + 2, building the computation graph dynamically.


    # The Autograd System


    A critical component of PyTorch''s dynamic computation graph system is its automatic
    differentiation engine, autograd. It is responsible for calculating the derivatives,
    that is, the gradients of tensors involved in the computation, facilitating backpropagation.


    When you create a tensor with requires_grad=True, PyTorch starts to track all
