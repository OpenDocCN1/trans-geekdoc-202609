    # Autograd and Backpropagation


    The true magic of computational graphs in PyTorch is the autograd system. Autograd
    automatically calculates the gradients or derivatives of each operation, enabling
    the backpropagation algorithm, which is vital for training neural networks.


    When you call `.backward()` on a tensor, PyTorch traverses the computational graph
    from that tensor all the way back to tensors that have `requires_grad=True`, computing
    gradients along the way.


    ```

    # PyTorch

    z.backward()

    print(x.grad) # Outputs: 12.0 (because dz/dx = 2*x*3 for x=2)

    ```


    **Real-world analogy**: Consider the process of assembling a toy from a manual.
    If a part doesn''t fit or you made an error, you would trace back your steps (backpropagate)
    to understand where you went wrong and rectify it. The computational graph helps
    in retracing these steps.


