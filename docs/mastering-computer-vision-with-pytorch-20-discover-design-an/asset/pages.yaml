    relying too much on specific neurons or weights.


    +   - **Early Stopping:** Implementing early stopping allows the training process
    to halt when the validation performance starts to degrade, preventing overfitting
    (discussed in detail later in this chapter).


    +   - **Cross-Validation:** Using cross-validation during training can help detect
    overfitting early and ensure that the model generalizes well across different
    subsets of the data.


    # Addressing Underfitting:


    +   - **Increase Model Complexity:** One of the simplest ways to tackle underfitting
    is to increase the model complexity by adding more layers or neurons. For instance,
    moving from a shallow CNN to a deeper architecture such as ResNet can improve
    performance on complex tasks.


