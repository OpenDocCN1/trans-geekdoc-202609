    # Memory Implications


    While dynamic computational graphs provide flexibility, they are rebuilt from
    scratch after every `.backward()` call. It means the graph’s history is discarded
    after use, saving memory but requiring the graph to be rebuilt for every forward
    pass.


    # Detaching from the Graph


    Sometimes, you might want to perform operations on tensors without having them
    tracked by the computational graph. The `detach()` method comes to the rescue.
    It creates a tensor that shares the same data but doesn’t require gradient computation.


    ```

    # PyTorch

    detached_y = y.detach()

    w = detached_y * 3 # w won''t be part of the computation graph.

    ```


