- pgno: 53
  md: "example input and returns a ScriptModule that you can save and load in Python\
    \ or C++.\n\nWhile tracing is great for straightforward modules that don’t involve\
    \ control flow (like conditionals and loops), it can struggle with modules where\
    \ the flow of execution depends on the values in tensors. This is because it only\
    \ captures the operations performed during the single execution used for tracing,\
    \ not the control flow itself.\n\n# Scripting\n\nScripting, on the other hand,\
    \ captures the control flow in your model by directly analyzing the Python code\
    \ of your model. It does this via a decorator, @torch.jit.script.\n\nHere’s an\
    \ example of how you might script a module:\n\n```\nimport torch\n\nclass MyModule(torch.nn.Module):\n\
    \    def __init__(self, N, M):\n        super(MyModule, self).__init__()\n   \
    \     self.weight = torch.nn.Parameter(torch.rand(N, M))\n\ndef forward(self,\
    \ input):\n    if input.sum() > 0:\n        output = self.weight.mv(input)\n \
    \   else:\n        output = self.weight + input\n    return output\n\nmy_module\
    \ = MyModule(10,20)\nsm = torch.jit.script(my_module)\n```\n\nIn this example,\
    \ we define a simple module that uses control flow in its forward method. We then\
    \ create an instance of this module and pass it to torch.jit.script to generate\
    \ a ScriptModule. This module will behave exactly like the eager mode version\
    \ but also has its Python code serialized in TorchScript format."
