  \ (X_train.shape[0], X_train.shape[1], EMB_SIZE))\nX_test = np.reshape(X_test, (X_test.shape[0],\
  \ X_test.shape[1], EMB_SIZE))\n```\n\n与我们之前的模型类似，为了增加额外的交易信心，我们将编写一些技术指标并将其添加到神经网络中，作为我们我们更高概率交易信号的手段。我们将允许包含简单移动平均线、标准差、布林带、MACD、RSI\
  \ 和动量的可能性。代码实现如下：\n\n## 技术指标\n\n```python\ndata_original['Stdev'] = data_original['Adj\
  \ Close'].rolling(window=90).std() # 计算滚动标准差\ndata_original['SMA'] = data_original['Adj\
  \ Close'].rolling(100).mean() # 计算 n 刻度 SMA\n\n## 布林带\ndata_original['Upper Band']\
  \ = data_original['SMA'] + (data_original['Stdev'] * 1) # 上方 1 个标准差\ndata_original['Lower\
  \ Band'] = data_original['SMA'] - (data_original['Stdev'] * 1) # 下方 1 个标准差\n\n##\
  \ MACD 12,26,9\ndata_original['stock_df_12_ema'] = pd.ewma(data_original['Close'],\
  \ span=12)\ndata_original['stock_df_26_ema'] = pd.ewma(data_original['Close'], span=26)\n\
  data_original['stock_df_macd_12_26'] = data_original['stock_df_12_ema'] - data_original['stock_df_26_ema']\n\
  data_original['stock_df_signal_12_26'] = pd.ewma(data_original['stock_df_macd_12_26'],\
  \ span=9)\ndata_original['stock_df_crossover_12_26'] = data_original['stock_df_macd_12_26']\
  \ - data_original['stock_df_signal_12_26'] # 意味着如果此值 >0，或者 stock_df['Crossover']\
  \ = stock_df['Signal'] > 0，则存在买入信号\n## 注意：原文中 MACD 的逻辑存在格式问题，此处已清理。\n\n## RSI\n\
  def RSI(series, period):\n    delta = series.diff().dropna()\n    u = delta * 0\n\
  \    d = u.copy()\n    u[delta > 0] = delta[delta > 0]\n    d[delta < 0] = -delta[delta\
  \ < 0]\n    u[period-1] = np.mean(u[:period]) # 第一个值是平均收益之和\n    u = u.drop(u.index[:period-1])\n\
