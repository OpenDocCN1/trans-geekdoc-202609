- "# Python 机器学习：深度解析 Python 机器学习与深度学习，使用 TensorFlow 和 Keras：从初学者到高级\n\n\n\n\n\n\n\
  本页特意留白。\n\n\n\n\n\n\n\n\n\n\n\n\n## 引言\n\n在过去的几年里，人工智能和机器学习在通用性和全球适用性方面取得了巨大的进步。现在可以通过传统和新的编程语言应用这些算法，这使我们能够更优雅地解释和理解这些方法。虽然机器学习和深度学习算法已成为多个行业衡量性能的共同标准，但本书的重点将是更好地理解如何通过\
  \ Python 编程语言将其应用于金融市场。\n\n## 为什么要用机器学习？\n\n当涉及到人工智能及其金融市场的适用性时，许多人提出的问题是：为什么要信任它？回答这个问题从表面上看似乎非常复杂；也就是说，归结底，传统的基金经理真的可以信任一个在没有人干预的情况下自主做出决策的东西吗？尽管有这些疑虑，许多经理现在实际上正在实施一种混合系统，他们正在接受将机器学习应用于他们管理的投资组合的想法。然而，这样做是为了获得某种安全感，即在市场波动加剧时，他们允许进行短暂的人为干预。或者说，在算法似乎出现异常并忽视不断演变的市场动态的时刻。\n\
  \n\n\n\n这种方法虽然利用了人工智能，但可能会受到真正的华尔街量化师的批评，因为它并不是纯粹的量化交易。尽管如此，我们将从一个特定的视角来探讨书中的概念和算法，该视角完全旨在将纯人工智能的基础知识应用于不同类型的金融市场；且没有任何任何形式的人为或混合干预。其底层逻辑是，归根结底，如果我们能够创建出强大的机器学习模型在这一层面上预测市场表现，我们或许可以开始慢慢地从方程式中剔除情感和非理性投资决策的普遍观念。历史证明，这种决策在市场处于高压和动荡时期，对于零售投资者和经验丰富的基金经理来说，投资哲学都是失败的。简而言之，这种非理性的决策已被证明更有可能导致许多平庸的投资选择。总的来说，这导致了糟糕的投资结果。\n\
  \n这正是纯人工智能和机器学习试图解决的问题：通过完全剥离这种情感化的决策，让机器做出最终的、最理性的具有最高盈利概率的决策。现在，让我们开始吧！我们将具体概述几种在金融领域开始被散户交易者和大型对冲基金经理广泛使用的机器学习和深度学习算法。这些算法是逻辑回归和循环神经网络。正如你所注意到的，虽然这些算法背后的基础逻辑在推理上有些相似之处，但导致它们各自决策过程的数学机制可能存在显著差异。对于我们的第一个算法，我们将使用\
  \ Python 的模块 `scikit-learn` 进行机器学习预测和交易。有关该库的更多信息可以在此处获得：\n\n`scikit-learn.org/stable/\n\
  \n# 将逻辑回归应用于美国股票市场进行预测性交易 (AMZN)\n\n在我们的第一个算法示例中，我们将应用一种名为 `logistic regression`（逻辑回归）的方法，通过\
  \ Python 帮助我们预测美国股票市场传统股票的价格走势。`Logistic regression` 是一种存在很长时间的数学方法，其背后的基础理解是一种预测分析的形式，其中因变量（`y\
  \ variable`）是二元元的。总的来说，因变量在本质上应该是二分的，且没有离群值。我们还应该能够表现出没有多共线性，即预测变量（我们的 `x variables`，或我们的特征）之间不应存在高相关性。从数学角度来看，`logistic\
  \ regression` 估计定义如下的多元回归函数：\n\n![Capture.PNG`\n\n对于 `logistic regression` 以及大多数机器学习算法，需要非常警惕的一点是过拟合（overfitting）概念。背后的想法是，通过向\
  \ `logistic regression` 模型中添加独立变量，我们无疑会增加预测变量所解释的总方差。然而，向模型中添加过多的变量会导致 `overfitting`；这会削弱模型在我们用于拟合模型的数据之外的泛化基础。从本质上说，这为我们的模型对目标数据的拟合优劣提供了虚假的解释。如此，让我们通过\
  \ Python 将 `logistic regression` 的数学基础应用于美国股票市场。在我们的特定示例中，我们将使用 `logistic regression`\
  \ 来帮助我们预测亚马逊公司 (`AMZN`) 的价格走势。\n\n\n\n\n既然我们已经将分类函数分配给数据集的收盘收益率，现在就可以开始对逻辑回归机器学习模型进行组织工作了。这意味着我们需要决定使用数据集的百分之几来训练机器学习模型，以及使用多少百分之几来测试模型。这是机器学习中一个非常主观的方面，没有明确的对错之分。许多数据科学家喜欢等分配这些比例，而另一些人则倾向于更大幅的倾斜。对于我们的特定示例，我们将使用\
  \ 90% 的数据来训练机器学习模型，而在剩余 10% 的数据上对其结果进行前向测试。因此，采用了 90-10 的训练与测试比例。该过程通过以下代码行完成：\n\
  \n```python\n## 将上述定义的分类器应用到 'returns_final' 数据框，计算最后一列 (Y) -1 = 下跌(down), 1 = 上涨(up)\n\
  df.iloc[:, len(df.columns) - 1] = df.iloc[:, len(df.columns) - 1].apply(computeClassification)\
  \  \n\n# 现在我们有了一个具有预测值的完整数据集，最后一列“Return”为 -1 或 1，创建训练和测试数据集。  \n## 将 float 转换为\
  \ int 以便对数据框进行切片\ntestData = df[-int((len(df) * 0.10)):]  # 后半部分用于前向测试  \ntrainData\
  \ = df[:-int((len(df) * 0.90))]  # 前部分用于训练  \n\n## 将所有的 inf 替换为 nan  \ntestData_1\
  \ = testData.replace([np.inf, -np.inf], np.nan)  \ntrainData_1 = trainData.replace([np.inf,\
  \ -np.inf], np.nan)  \n\n## 将所有的 nan 替换为 0  \ntestData_2 = testData_1.fillna(0)\
  \  \ntrainData_2 = trainData_1.fillna(0)  \n\n## X 是特征列表   \ndata_X_train = trainData_2.iloc[:,\
  \ 0:len(trainData_2.columns) - 1]  \n\n## Y 是待预测的 1 或 -1 值（由于我们在上面使用 apply.(computeClassification)\
  \ 函数向最后一列添加了该值）\ndata_Y_train = trainData_2.iloc[:, len(trainData_2.columns) - 1]\
  \  \n\n## 测试数据集执行相同的操作  \ndata_X_test = testData_2.iloc[:, 0:len(testData_2.columns)\
  \ - 1]  \ndata_Y_test = testData_2.iloc[:, len(testData_2.columns) - 1]\n```\n\n\
  现在我们终于准备好将我们的逻辑回归 ML 模型应用到 AMZN 的数据集上。如前所述，我们将使用 Python 的 scikit-learn 库来实现这一点。第一步将从\
  \ scikit-learn 导入必要的库：\n\n```python\nfrom sklearn.linear_model import LogisticRegression\
  \  \n\n## 定义用于打印训练和测试准确率得分的方法\nfrom sklearn.model_selection import cross_val_score,\
  \ cross_val_predict\nfrom sklearn.metrics import accuracy_score, classification_report,\
  \ confusion_matrix\n```\n\n上面的导入允许我们设置模型参数，以及测试配置，使我们能够分析模型在 AMZN 价格预测方面的表现。此外，我们还可以创建一个名为\
  \ `print_score` 的函数，它允许我们评估模型在价格预测方面的准确率得分。该函数如下：\n\n```python\ndef print_score(clf,\
  \ data_X_train, data_y_train, data_X_test, data_y_test, train=True):  \n    \"\"\
  \"\n    打印分类器的准确率得分、分类报告和混淆矩阵\n    \"\"\"\n    if train:\n        \"\"\"\n     \
  \   训练性能\n        \"\"\"\n        print(\"Train Result:\\n\")\n        print(\"\
  accuracy score: {0:.4f}\\n\".format(accuracy_score(data_y_train, clf.predict(data_X_train))))\
  \  \n        print(\"Classification Report: {}\\n\".format(classification_report(data_y_train,\
  \ clf.predict(data_X_train))))  \n        print(\"Confusion Matrix: {}\\n\".format(confusion_matrix(data_y_train,\
  \ clf.predict(data_X_train))))  \n        res = cross_val_score(clf, data_X_train,\
  \ data_y_train, cv=10, scoring='accuracy')  \n        print(\"Average Accuracy:\
  \ \\t{0:.4f}\".format(np.mean(res)))  \n        print(\"Accuracy SD: \\t{0:.4f}\"\
  .format(np.std(res)))  \n    elif train == False:\n        \"\"\"\n        测试性能\n\
  \        \"\"\"\n        print(\"Test Result:\\n\")\n        print(\"accuracy score:\
  \ {0:.4f}\\n\".format(accuracy_score(data_y_test, clf.predict(data_X_test))))  \n\
  \        print(\"Classification Report: {}\\n\".format(classification_report(data_y_test,\
  \ clf.predict(data_X_test))))  \n        print(\"Confusion Matrix: {}\\n\".format(confusion_matrix(data_y_test,\
  \ clf.predict(data_X_test))))\n```\n\n现在我们准备好将 Python scikit-learn 库中内置的逻辑回归分类器应用到\
  \ AMZN 的数据集上。为了做到这一点，我们必须先将分类器分配一个变量名，并拟合训练数据。这通过以下代码行实现：\n\n```python\n## 逻辑回归\n\
  clf = LogisticRegression()  \nclf.fit(data_X_train, data_Y_train)  \n\n## y_predictions\
  \ 是包含预测值的数组（-1 或 1），基于 data_X_test。\nfrom sklearn.metrics import accuracy_score\
  \  \ny_predictions = clf.predict(data_X_test)  # 根据 x_test 预测 y\nprint(\"Accuracy\
  \ Score Employing Learning: \" + str(accuracy_score(data_Y_test, y_predictions)))\n\
  ```\n\n并且分析模型在预测 AMZN 收盘价方面的好坏。运行此代码段将显示如下结果：\n\nAccuracy Score Employing Learning:\
  \ 0.53153153153515\n\n这告诉我们，基本上在采用 90-10 训练与测试比例的情况下，逻辑回归模型能够预测 AMZN 的收盘价，准确率约为\
  \ 53%。虽然这可能没有达到理想的 50%以上阈值，但我们确实看到这种简单的模型在逻辑回归和数学预测方面的潜力。接下来，我们将算法向前推进，创建一个简单的回测函数，尝试监控并判断我们在特定测试时期（约占数据的\
  \ 10%）实际交易的表现会如何。这对于 AMZN 来说大约是 222 个交易日，最后一天是 2018 年 10 月 29 日。换句话说，从 2018 年 10\
  \ 月 29 日回溯 222 个交易日。\n\n\n建立逻辑回归模型后，下一步是将 Python 中常用的库 `ffn` 应用到我们的数据集，尝试回测如果我们根据机器学习信号进行交易将会如何。在此之前，我们将添加最后一步，即计算\
  \ AMZN 的 200 日移动平均线，作为我们信号的额外依据或过滤器。简单来说，现在我们的机器学习信号不仅必须返回 1，AMZN 的收盘价也必须高于其 200\
  \ 日移动平均线。反之亦然，为了发出卖出信号，机器学习模型必须返回 -1，且 AMZN 的收盘价必须低于 200 日移动平均线。设置此配置的代码如下：\n\n\
  ```python\ndf['SMA'] = df['Close'].rolling(200).mean() # 计算 n 日 SMA\ndf['Sell1']\
  \ = df['Close'] < df['SMA']  \ndf['SELL'] = df['Sell1']  \ndf['Buy1'] = df['Close']\
  \ > df['SMA']  \ndf['BUY'] = df['Buy1']  \n```\n\n\n\n```python\nprint(\"buy technical\
  \ signal length\", len(buy_technical_signal))\nprint(\"sell technical signal length\"\
  , len(sell_technical_signal))\nprint(\"buy technical signal\", buy_technical_signal)\n\
  print(\"sell technical signal\", sell_technical_signal)\n\nbuy_technical_signal\
  \ = pd.DataFrame(buy_technical_signal)\nsell_technical_signal = pd.DataFrame(sell_technical_signal)\n\
  pred = pd.DataFrame(predictions_dataframe)\nprint(\"prediction\", pred)\nprint(\"\
  PREDICTION LENGTH\", len(predictions_dataframe))\npred['Signal'] = 0\n```\n\n##\
  \ 重新索引数据以便后续合并到 1 DataFrame 中 - 所有数据都需要相同的索引才能正确合并\nbuy_technical_signal.set_index(pred.index,\
  \ inplace=True)\nsell_technical_signal.set_index(pred.index, inplace=True)\n\n##\
  \ 设置过滤器\nfilter1 = (predictions_dataframe[0] > 0)  # 第一个买入过滤器（深度学习）\nfilter2 = buy_technical_signal\
  \ > 0  # 第二个买入过滤器（技术面），> 0 表示参数为真 (1)\nfilter3 = (predictions_dataframe[0]) < 0\
  \  # 第一个卖出过滤器（深度学习）\nfilter4 = sell_technical_signal > 0  # 第二个卖出过滤器（技术面），> 0 表示参数为真\
  \ (1)\n\n## 将所有数据合并为 1 DataFrame 以于查看/确认\npred2 = pd.concat([pred, buy_technical_signal,\
  \ sell_technical_signal, filter1, filter2, filter3, filter4], axis=1)\npred2.columns\
  \ = ['Pred', 'Signal', 'Buy Tech Signal', 'Sell Tech Signal', 'Filter1', 'Filter2',\
  \ 'Filter3', 'Filter4']\n\n## 使用 np.where 函数根据是否满足上述过滤器设置 Signal\npred2['Signal']\
  \ = np.where(pred2['Filter1'] & pred2['Filter2'], 1, 0)\npred2['Signal'] = np.where(pred2['Filter3']\
  \ & pred2['Filter4'], -1, pred2['Signal'])\nbuys = pred2.loc[pred2['Signal'] ==\
  \ 1]\nsells = pred2.loc[pred2['Signal'] == -1]\n\n## 需要重新索引 buys 和 sells DataFrames\
  \ 以匹配 'df[Close]' 的索引\n```python\nif not buys.empty:\n    buy_index_new = buys.index[-1]\
  \ - buys.index\n    buy_index_2 = len(df.index) - buy_index_new\n    buys.set_index(buy_index_2,\
  \ inplace=True)\n\nif not sells.empty:\n    sell_index_new = sells.index[-1] - sells.index\n\
  \    sell_index_2 = len(df.index) - sell_index_new\n    sells.set_index(sell_index_2,\
  \ inplace=True)\n```\n\n```python\n## iloc[行切片, 列切片] 设置股票 n 天收盘价\nreal_stock_price\
  \ = df.iloc[-n:,3]  # 前 n：元素是预测值，第 3 列是收盘价\nreal_stock_price = real_stock_price.values\n\
  real_stock_price = pd.DataFrame(real_stock_price)  # 转换为 dataframe\nprint(real_stock_price)\n\
  print(\"REAL STOCK PRICE\", real_stock_price)\n\n## 使用图表可视化策略\n## buys 和 sells 具有整数范围（0,1,2...），而\
  \ df 具有 datetime 值。重新索引 df：\ndf.set_index(pd.RangeIndex(0, len(df)), inplace=True)\n\
  \n## 绘制价格\nplt.plot(df.index, df['Close'], label='Asset')\n## 在同一张图上绘制买入和卖出信号\n\
  plt.plot(sells.index, sells['Close'], 'v', markersize=10, color='r')\nplt.plot(buys.index,\
  \ buys['Close'], '^', markersize=10, color='g')\nplt.ylabel('Price')\nplt.xlabel('Date')\n\
  plt.legend(loc=0)\n## 显示所有内容\nplt.show()\n```\n\n最后一步是创建一个回测函数并使用 Python 的 `ffn`\
  \ 模块。关于该模块的更多信息可以在这里找到：https://pypi.org/project/ffn\n\n在利用 `ffn` 模块进行回测之前，我们必须创建一个用于数据的基础回测函数。我们将组合的初始资金设置为\
  \ $100,000。该函数如下：\n\n```python\n## 回测\n## 定义回测方法\ndef backtest(data):\n    cash\
  \ = 100000  # 设置初始资金为 $100,000\n    position = 0  # 设置持股数为 0\n    total = 0\n  \
  \  equity_curve_df = []\n    data['Total'] = 100000  # 策略从 100k 开始\n    # 为了计算买持有价值，我在回测的第一天将所有资金投入\
  \ X 资产\n    increment = 10  # 股数\n    for row in data.iterrows():\n        price\
  \ = float(row[1][0])  # 注意 \"iterrows\" 返回的是一个索引（例如 0,1,2,3,4...）和行向量中的 DataFrame，因此你还需要引用行中的列，即\
  \ [1][3] —— 1 是行而不是索引，是行内的列。\n        signal = pred2.iloc[row[0]][1]  # 策略的信号，dataframe\
  \ 中的第 2 列是 1 和 -1 的信号\n        if (signal > 0 and cash - increment * price > 0):\
  \  # 信号为 1（或 > 0），并且有足够的资金进行交易（100,000 - (1,000 * 资产价格） > 0）\n            # 买入\n\
  \            cash = cash - increment * price  # 扣除买股数并更新剩余现金\n            position\
  \ = position + increment  # 位置为 0 + 1,000 股（只要有资金买入且有信号，就会持续循环）\n            # print(row[0].strftime('%d\
  \ %b %Y') + \" Position = \" + str(position) + \" Cash = \" + str(cash) + \" //\
  \ Total = {:,}\".format(int(position * price + cash)))\n        elif (signal < 0\
  \ and abs(position * price) < cash):  # 信号为 -1（或 < 0），且股票绝对值小于现金\n            #\
  \ 卖出\n            cash = cash + increment * price  # 卖出股数的价值\n            position\
  \ = position - increment  # 位置为新持仓 - 股数\n            # print(row[0].strftime('%d\
  \ %b %Y') + \" Position = \" + str(position) + \" Cash = \" + str(cash) + \" //\
  \ Total = {:,}\".format(int(position * price + cash)))\n        data.loc[row[0],\
  \ 'Total'] = float(position * price + cash)\n        equity_curve_df.append(float(position\
  \ * price + cash))\n\n    equity_curve_df = pd.DataFrame(equity_curve_df)\n    index\
  \ = pd.date_range('11/01/2017', periods=len(equity_curve_df), freq='D')\n    equity_curve_df\
  \ = pd.DataFrame(equity_curve_df, index=index, columns=['Total'])\n    return equity_curve_df\n\
  ```\n\n最后，我们可以将 `ffn` 模块应用于我们定义的回测函数，如下所示策略结果：\n\n```python\n## 策略的回测，通过运行上述定义的回测函数创建权益曲线\
  \ df\nequity_curve_df = backtest(real_stock_price)  # 对于我们的策略，回测将等于我们定义的 backtest(data)\
  \ 方法，利用我们的 dataframe 作为数据\nprint(equity_curve_df)  # 打印以美元输出的回测结果现金价值\n```\n\n\n\
