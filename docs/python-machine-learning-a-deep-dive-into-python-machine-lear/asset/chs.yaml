  \ AMZN 模型的对比，看看我们是否能超越目前的结果。这将通过一种概率方法实现，使用 Python 的 `keras` 模块进行深度学习。\n\n## 用于\
  \ AMZN 深度学习预测的 KERAS CNN 模型\n\n现在，让我们将用于 AMZN 的逻辑回归机器学习模型的结果与深度学习神经网络方法进行比较，后者使用了\
  \ Python 流行的 `keras` CNN 神经网络。关于该模型的更多信息可以在此处找到：https://keras.io/layers/convolutional/\n\
  \n总的来说，深度学习指的是具有多个隐藏层的神经网络，这些层可以学习输入数据的抽象表示。对于这个特定示例，我们将再次选取 AMZN，时间跨度为 2010 年 1\
  \ 月 1 日至 2018 年 10 月 29 日，并应用通过模型模型预测预测价的 CNN 框架。这些概率阈值（即置信水平）将以主观的方式编码，用户可以对其进行修改以满足其特定需求。对于此类\
  \ CNN 模型，你通常拥有一系列输入（卷积）、特征图（采样）和全连接输出层。虽然 CNN 在过去通常用于图像识别，但最近它们已缓慢进入金融领域；绝对显示出广阔的迹象。对于这个采用\
  \ CNN 方法的特定示例，我们将使用 80-20 的训练测试划分比例，即我们在约 80% 的数据上进行训练，而在约 20% 上进行测试。这 20% 相当于从\
  \ 2018 年 10 月 29 日（数据集中的最后一天）回溯的约 439 个交易日。\n\n为了为 CNN 善组织训练和测试数据，我们将创建一个名为 `utils.py`\
  \ 的短脚本，它允许我们对数据集进行预处理，以便 Python 能够正确解释如何设计和利用 CNN 模型。最重要的是，这个 `utils.py` 文件对于我们算法的运行至关重要且必须。`utils.py`\
  \ 的脚本如下：\n\n```python\ndef shuffle_unison(a, b): #  http://stackoverflow.com/users/190280/josh-blecher-nyder\n\
  \    assert len(a) == len(b)\n    shuffled_a = np.empty(a.shape, dtype=a.dtype)\n\
  \    shuffled_b = np.empty(b.shape, dtype=b.dtype)\n    permutation = np.random.permutation(len(a))\n\
  \    for old_index, new_index in enumerate(permutation):\n        shuffled_a[new_index]\
  \ = a[old_index]\n        shuffled_b[new_index] = b[old_index]\n    return shuffled_a,\
  \ shuffled_b\n\ndef create_Xt_Yt(X, y, percentage=0.8): # 在...数据上\n    p = int(len(X)\
  \ * percentage)\n    X_train = X[0:p]\n    Y_train = y[0:p]\n    X_train, Y_train\
  \ = shuffle_unison(X_train, Y_train)\n    X_test = X[p:]\n    Y_test = y[p:]\n \
  \   return X_train, X_test, Y_train, Y_test\n\ndef remove_nan_examples(data):\n\
  \    newX = []\n    for i in range(len(data)):\n        if not np.isnan(data[i]).any():\n\
  \            newX.append(data[i])\n    return newX\n```\n\n与我们的第一个逻辑回归机器学习模型类似，我们的\
  \ `keras` 的 CNN 深度学习模型首先读取所有需要的库：\n\n```python\nfrom utils import *\nimport pandas\
