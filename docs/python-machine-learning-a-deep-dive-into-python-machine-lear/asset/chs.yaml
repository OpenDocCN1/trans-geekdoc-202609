  - PyCharm：它有自己的免费社区版，在你学习编程时非常有用。\n\n\n\n\n\n其他良好的选择还有：PyScripter, LeoEditor, Bluefish,\
  \ Ptk, Spyder 和 Geany。\n\n# 第十章章：各种类型的数据\n\n幸运的是，Python 拥有一组良好的内置函数，它们运行非常好，特别是对于初学者来说。\n\
  \n现在我们来学习主要的内置函数：\n\n### 1. type 函数\n它返回任意对象的数据类型。`type` 函数甚至可以接收一个变量并将其作为类型返回。你可以使用此函数来比较不同类型的对象。\n\
  \n让我们来看一个例子：\n\n```python\nn=1\ntype(n) \n<type ‘int’>\n\nS=start\n<type ‘str’>\n\
  \nimport smtplib\ntype (smtplib)\n<type ‘module’>\n```\n\n### 2. dir 命令\n以下是 `dir`\
  \ 的语法：`dir([object])`，`dir` 允许我们获取给定对象的有效属性列表。\n\n让我们来看一个 `dir` 如何工作的实际示例：\n\n```python\n\
  class Person:\n  def __dir__(self):\n    return ['age', 'gender', 'salary']\n\n\
  carpenter = Person()\nprint(dir(carpenter))\n```\n\n一旦运行此命令，它将显示如下：\n\n```python\n\
  ['age', 'gender', 'salary']\n```\n\n### 3. 列表 (List)\n（语法：`list([iterable])`）此命令用于创建一个列表，其项与\
  \ `iterable` 的项相同且顺序一致；`iterable` 可以是序列、支持迭代的容器或一个迭代器对象。\n\n现在我们来看一个简单的列表：\n\n```python\n\
  list = [2, 6 , 12]\nlist\n```\n\n让我们运行该命令，结果如下：\n\n```python\n2, 6, 12\n```\n\n\
  为了使用列表中的值，我们可以使用方括号。这里有一个示例：\n\n```python\nlist1 = ['math', 'history', 1993, 1994];\n\
  list2 = [1, 2, 3, 4, 5, 6, 7];\nprint \"list1[0]: \", list1[0]\nprint \"list2[1:5]:\
  \ \", list2[1:5]\n```\n\n一旦运行，我们将得到以下输出：\n\n```text\nlist1[0]: math\nlist2[1:5]:\
  \ [2, 3, 4, 5]\n```\n\n列表可以使用 `append()` 命令进行更新。\n\n我给你举一个例子：\n\n```python\nlist\
  \ = ['math', 'history', 1993, 1994];\nprint \"Value available at index 2 : \"\n\
  print list[2]\nlist[2] = 1995;\nprint \"New value available at index 2 : \"\nprint\
  \ list[2]\n```\n\n输出将是：\n\n```text\nValue available at index 2 :\n1993\nNew value\
  \ available at index 2 :\n1995\n```\n\n我们还可以删除元素：\n\n```python\nlist1 = ['math',\
  \ 'history', 1993, 1994];\nprint list1\ndel list1[2];\nprint \"After deleting value\
  \ at index 2 : \"\nprint list1\n```\n\n带有如下输出：\n\n```text\n['math', 'history', 1993,\
  \ 1994]\nAfter deleting value at index 2 :\n['math', 'history', 1994]\n```\n\n有一些可以与列表一起使用的表达式：\n\
  - 长度：`len([1, 2, 3])` → `3`\n- 合并：`[1, 2, 3] + [4, 5, 6]` → `[1, 2, 3, 4, 5, 6]`\n\
  - 重复：`['Let's start'] * 3` → `['Let's start', 'Let's start', 'Let's start']`\n-\
  \ 成员身份：`3 in [1, 2, 3]` → `True`\n\n关于列表的内置函数：\n- `cmp(list1, list2)` → 比较两个列表\n\
  - `len(list)` → 给出列表的总长度\n- `max(list)` → 返回列表中的最大值\n- `min(list)` → 返回列表中的最小值\n\
  - `list(seq)` → 将元组转换为列表\n\n关于列表的内置方法：\n- `list.append(obj)` → 将 `obj` 添加到列表\n-\
  \ `list.count(obj)` → 返回 `obj` 在列表中出现的次数\n- `list.extend(seq)` → 将 `seq` 的内容添加到列表\n\
  - `list.index(obj)` → 返回 `obj` 在列表中出现的索引\n- `list.insert(index, obj)` → 在 `index`\
  \ 处插入 `obj`\n- `list.pop(-1)` → 移除并返回列表最后一个对象\n- `list.remove(obj)` → 从列表中移除 `obj`\n\
  - `list.reverse()` → 原地反转列表\n- `list.sort()` → 排序列表对象\n\n### 4. 字符串 (Strings)\n\
  Python 中的字符串有很多有趣的特性。它们是不可变的（一旦创建字符串，你就无法修改它），如果你需要一个新的字符串，可以直接创建一个。\n\n所以，在表达式\
  \ `'let’s' + 'start'` 中，我们将得到由 'let’s' 和 'start' 组成的新字符串。让我们来看一个示例：\n\n```python\n\
  s = ‘let’s’\nprint s[1]\nprint len(s)\nprint s + ‘ start ‘\n```\n\n现在我们来看几个使用切片的字符串示例。\n\
  \n```python\ns = “0123456789”\ns[:5] → 选择前 5 个数：‘01234’\ns[-5:] → 选择后 5 个数：‘56789’\n\
  ```\n\n记住 Python 使用从 0 开始的索引；因此，如果 `str` 是 'hello'，`str[1]` 就是 'e'。\n\n为了换行，我们需要利用反斜杠加上\
  \ `\\n`。让我们来看一个示例：\n\n```python\ns = “8\\n9\\n10\\nHi”\nprint s\n```\n\n```text\n\
  8\n9\n10\nHi\n```\n\n`\\n` 字符是特殊的。特殊字符列表：\n1. `\\t` 是制表符\n2. `\\r` 是回车\n3. `\\\\\
  ` 是反斜杠字符\n4. `\\b` 是退格\n\n我们可以使用 `+` 符号连接两个字符串：\n\n```python\ns = ex\np = ample\n\
  s + p\n## result: example\n```\n\n或者可以使用 `*` 符号乘以字符串：\n\n```python\ns = example\n\
  s * 5\n# result: exampleexampleexampleexample\n```\n\n在 Python 中，我们可以找到很多字符串方法（方法类似于运行在对象上的函数）。我们现在来看常用的：\n\
  - `s.lower()`, `s.upper()` — 返回字符串的小写或大写版本\n- `s.strip()` — 返回去除了首尾空格的字符串\n- `s.isalpha()`,\
  \ `s.isdigit()`, `s.isspace()...` — 测试字符是否属于相应的字符类\n- `s.startswith('other')`, `s.endswith('other')`\
  \ — 测试字符串是否以 other 开头或结尾\n- `s.find('other')` — 返回 other 出现的索引，如果未找到返回 -1\n- `s.replace('old',\
  \ 'new')` — 返回所有 'old' 被替换为 'new' 的字符串\n- `s.split('delim')` — 返回由给定分隔符分割的子字符串列表。分隔符不是正则表达式\n\
  - `'---'.join(list)` — 连接列表中的元素\n\n### 5. 元组 (Tuples)\n当我们说元组，我们指的是一组不可变的对象序列。\n\
  \n如果元组是空的，它将显示如下：\n\n```python\ntup1 = ()\n```\n\n如果元组只包含一个值，我们必须包含逗号：\n\n```python\n\
  tup1 = (1,)\n```\n\n让我们来看更多元组（等等，文本说“元组可以像字符串一样进行切片、合并等，但为了做到这一点，我们必须使用方括号”）：\n\n\
  ```python\ntup1 = ('dog', 'cat', 'fish', 'seal')\ntup2 = (1, 2, 3, 4 )\nprint \"\
  tup1[0]: \", tup1[0]\nprint \"tup2[1:4]: \", tup2[2:3]\n```\n\n```text\ntup1[0]:\
  \ dog\ntup2[1:4]: (3)\n```\n\n如果你期望不同的输出，那是因为元组的索引从 0 开始。\n\n如前所述，元组是不可变的。如果你需要添加或删除，你需要创建一个新的元组。让我们来看一个示例：\n\
  \n首先，我们来看如何创建一个包含所需元素的元组：\n\n```python\ntup1 = (1, 2, 3)\ntup2 = ('dog', 'cat',\
  \ 'fish')\ntup3 = tup1 + tup2\nprint (tup3)\n```\n\n```text\n(1, 2, 3, 'dog', 'cat',\
  \ 'fish')\n```\n\n列表和元组是相似的。主要的区别在于，列表可以随时修改，而元组是不可变的。此外，元组使用括号，而列表使用方括号。\n\n\n\n\
  \n元组（Tuples）和列表一样，响应任何通用操作，就像我们在列表章节中看到的那些操作（长度、拼接、重复、成员和迭代）。\n\n我们也可以为元组找到内置函数：\n\
  \n- `cmp(tuple1, tuple2)` → 比较两个元组的元素。\n- `len(tuple)` → 给元组的总长度。\n- `max(tuple)`\
  \ → 返回元组中最大的项目。\n- `min(tuple)` → 返回元组中最小的项目。\n- `tuple(seq)` → 将列表转换为元组。\n\n###\
  \ 6.集合 (Sets)\n\n集合是一种允许我们处理元素组的数据类型。它创建了一个无序且唯一的元素集合。集合对象还支持数学运算，如并集、交集、差集和对称集。\n\
  \n让我们来看例子：\n\n```python\na = set ('example')\nb = set ('exile')\n```\n\n- `a`\n\
  `{'e', 'x', 'a', 'm', 'p', 'l'}`\n\n你可以看到，这个集合缺少了最后一个“e”，这是因为正如我们之前提到的，集合只包含唯一的元素。\n\
  \n让我们继续这个例子：\n\n- `a – b`（使用此函数，我们可以构建一个仅由 `a` 中的字母但不在 `b` 中的字母组成的集合）\n`{'a', 'm',\
  \ 'p'}`\n- `a | b`（取 `a` 和 `b` 中的字母）\n`{'e', 'x', 'a', 'm', 'p', 'l', 'i'}`\n- `a\
  \ & b`（取同时存在于 `a` 和 `b` 中的字母）\n`{'e', 'x', 'l'}`\n- `a ^ b`（取 `a` 或 `b` 中的字母，但不同时都存在）\n\
  `{'a', 'm', 'p', 'i'}`\n\n集合不支持索引和切片\n\n为了添加元素，我们必须使用 `add()` 命令添加单个元素，使用 `update()`\
  \ 命令添加多个元素。\n\n为了删除元素，我们必须使用 `discard()` 或 `remove()`，而如果我们需要删除集合中的所有元素，可以使用 `clear()`。\n\
  \n集合对于执行数学运算非常有用。让我们来看例子：\n\n```python\nA = {1, 2, 3, 4, 5}\nB = {4, 5, 6, 7, 8}\n\
  ```\n\n现在有 4 种可能的操作：并集、交集、差集和对称集。让我们来看看效果：\n\n1. **并集 (Union)**：对于此操作，我们可以使用 `|`\
  \ 运算符或 `union()` 方法\n```python\nA = {1, 2, 3, 4, 5}\nB = {4, 5, 6, 7, 8}\nprint(A\
  \ | B)\n## 输出: {1, 2, 3, 4, 5, 6, 7, 8}\n```\n\n2. **交集 (Intersection)**：此操作将包含两个集合共有的元素，我们将使用\
  \ `intersection()`\n```python\nA = {1, 2, 3, 4, 5}\nB = {4, 5, 6, 7, 8}\nprint(A\
  \ & B)\n## 输出: {4, 5}\n```\n\n3. **差集 (Difference)**：通过此操作，我们可以得到出现在 `A` 中不在 `B`\
  \ 中的元素，反之亦然它是通过 `difference()` 执行的\n```python\nA = {1, 2, 3, 4, 5}\nB = {4, 5, 6,\
  \ 7, 8}\nprint(A - B)\n## 输出: {1, 2, 3}\n```\n\n4. **对称差集 (Symmetric difference)**：此操作允许我们获取\
  \ `A` 和 `B` 中的元素，但排除两者都出现的元素。通过 `symmetric_difference()` 完成。\n```python\nA = {1,\
  \ 2, 3, 4, 5}\nB = {4, 5, 6, 7, 8}\nprint(A ^ B)\n## 输出: {1, 2, 3, 6}\n```\n\n在\
  \ Python 中，可以找到集合的内置方法列表。我列出最有用的：\n\n- `add()` → 向集合添加一个元素\n- `clear()` → 集合中的所有元素\n\
  - `copy()` → 返回集合的浅拷贝\n- `difference()` → 返回两个集合的差集\n- `difference_update()` → 从集合中移除另一个集合的元素\n\
  - `discard()` → 如果元素在集合中则移除元素（如果元素不存在则什么都不做）\n- `intersection()` → 返回两个集合的交集\n-\
  \ `intersection_update()` → 使用另一个集合的交集更新集合\n- `isdisjoint()` → 如果两个集合没有交集则返回 True\n\
  - `issubset()` → 如果是另一个集合的子集则返回 True\n- `issuperset()` → 如果包含另一个集合则返回 True\n- `pop()`\
  \ → 移除并返回一个任意元素。如果集合为空则抛出 `KeyError`\n- `remove()` → 从集合中移除一个元素。如果元素不是成员则抛出 `KeyError`\n\
  - `symmetric_difference()` → 返回两个集合的对称差\n- `symmetric_difference_update()` → 使用另一个集合的对称差更新集合\n\
  - `union()` → 返回集合的并集\n- `update()` → 使用与其他元素的并集更新集合\n\n在 Python 中，还可以找到内置函数列表：\n\
  \n- `all()` → 如果集合中的所有元素为真（或集合为空）则返回 True\n- `any()` → 如果集合中的任何一个元素为真。如果集合为空则返回\
  \ False。\n- `enumerate()` → 返回一个枚举对象。包含集合中所有元素的索引值对。\n- `len()` → 返回集合的长度（元素数量）。\n\
  - `max()` → 返回集合中最大的元素。\n- `min()` → 返回集合中最小的元素。\n- `sorted()` → 返回集合元素的排序后列表（不对集合本身排序）。\n\
  - `sum()` → 返回集合中所有元素的和。\n\n# 7.字典 (Dictionaries)\n\nPython 有一个内置函数叫做字典（dictionary），它极大简化了我们的工作。字典是键的集合，我们可以通过它提取值的集合。\n\
  \n为了构建字典，我们可以利用构造函数 `dict()`。让我们来看看效果：\n\n```python\nrooms = dict()\nrooms['guest1']\
  \ = '101'\nrooms['guest2'] = '102'\n```\n\n我们刚刚构建的字典会是：\n\n```python\nrooms\n{'guest1':\
  \ '101', 'guest2': '102'}\n```\n\n我们可以使用 `keys` 方法轻松提取并向字典添加新元素：\n\n```python\n\
  rooms.keys()\n['guest1', 'guest2']\n```\n\n其他有趣的函数有：`has_key`（用于判断元素是否在字典中）、`del`（用于删除元素）、`clear`、`copy`、`fromkey`、`get`、`items`\
  \ 等……\n\nPython 中的字典有很多内置方法。一样，我列出最有用的：\n\n- `clear()` → 移除字典中的所有项。\n- `copy()`\
  \ → 返回字典的浅拷贝。\n- `fromkeys(seq[, v])` → 返回一个新字典，键来自 `seq`，值为 `v`（默认为 `None`）。\n\
  - `get(key, d)` → 返回 `key` 的值。如果 `key` 不存在，返回 `d`。\n- `items()` → 返回字典项（键，值）的新视图。\n\
  - `keys()` → 返回字典键的新视图。\n- `pop(key, d)` → 移除具有 `key` 的项并返回其值；如果没有提供 `d` 且未找到 `key`，则返回\
  \ `d`。\n- `popitem()` → 移除并返回一个任意项（键，值）。\n- `setdefault(key, d)` → 如果 `key` 在字典中，返回其值。如果不在，插入值为\
  \ `d` 的 `key` 并返回 `d`。\n- `update(other)` → 使用 `other` 中的键/值对更新字典，覆盖现有的键。\n- `values()`\
  \ → 返回字典值的新视图。\n\n### 8.True, false and none\n\n`False` 和 `None` 是 Python 中的两个常量对象，称为布尔值（Boolean\
  \ values）。\n\nPython 有一个内置函数 `bool()`，可以将任何值转换为布尔值，并检查该值是否被解释为真或假。\n\n让我们来看例子：\n\
  \n```python\nodd_numbers = (1, 2, 3, 4, 5, 6)\nx = 2 in odd_numbers\nx\nfalse\n\n\
  y = 4 in even_numbers\ny\ntrue\n```\n\n# 9.转换 (Conversions)\n\nPython 有一些内置函数允许你转换元素。在这里你可以看到如何操作：\n\
  \n- `tuple(l)` → 将列表转换为元组\n- `list(t)` → 将元组转换为列表\n\n\n\n\n缩进是 Python 最具特征的语法元素之一。\n\
  \n来看一个经典的例子：\n\n```python\ndef perm(l):\n    # 计算 l 的所有排列列表\n    if len(l) <= 1:\n\
  \        return [l]\n    r = []\n    for i in range(len(l)):\n        s = l[:i]\
  \ + l[i+1:]\n        p = perm(s)\n        for x in p:\n            r.append(l[i:i+1]\
  \ + x)\n    return r\n```\n\n如你所见，很容易看出代码在何时结束以及下一行代码从哪里开始。\n\n缩进用于指示代码块。显然，你必须对每个块使用相同数量的空格进行缩进。在\
  \ Python 中，我们使用缩进来指示特定的代码字符串属于哪个块。\n\n另一个大特性是，通用的块结束规则是通用的，因此我们不需要指定 `end`、`endif`、`fi`、括号或方、`wend`、`endwhile`、`next`、`loop`、`end\
  \ procedure` 或 `end function`。\n\n我们只需要遵守缩进。\n\n## IF 语句\n\n什么是控制流语句？它是一种允许程序根据情况做出决策并按照特定顺序读取代码的功能。我们可以使用一些控制流工具来控制语句的执行。\n\
  \n`IF` 指令可能是所有编程语言中最常用的命令。\n\n我们可以使用 `IF` 来检查一个条件。\n\n这里是 `IF` 如何工作的示例：\n\n![](img/00008.gif)\n\
  \n只有当 `IF` 条件为真时，我们才执行语句块；否则，执行另一个语句。\n\n`IF` 语句语法示例：\n\n```python\nx = int(input(\"\
  Please enter an integer: \"))\nPlease enter an integer: 42\nif x < 0:\n    x = 0\n\
  \    print('Negative changed to zero')\nelif x == 0:\n    print('Zero')\nelif x\
  \ == 1:\n    print ('Single')\nelse:\n    print('more')\n```\n\n### 更多\n\n我们可以观察到\
  \ `:`，我们用它结束控制程序流的测试。\n\n你可以根据需要插入任意数量的 `Elif`；在上面的示例中，最后一个 `elif` 不是强制性的。\n\n##\
  \ FOR 语句\n\n`For` 指令允许我们定义迭代。为了决定需要多少次迭代以及在哪个元素上执行迭代，我们必须使用任何可以视为序列的对象。\n\n传统上用于精确地重复某段代码。\n\
  \n我们已经看到了许多序列示例：列表、元组、字符串。这些都是我们可以用 `For` 进行迭代的数据类型：\n\n```python\nfor c in \"abc\"\
  :\n    print c\n```\n>>>\n\n在没有相应序列的情况下，我们如何执行特定次数的简单迭代呢？我们可以使用 `range`：\n\n```python\n\
  for n in range (4):\n    print n\n```\n>>>\n\n通过 `range` 命令，我们还可以选择迭代的开始和结束。\n\n\
  `For` 还允许我们同时在更多变量上执行循环。这是因为由于字典中的 `items` 方法会给出一个由其键和值组成的元组列表。`For` 在此列表的每个元素上建立循环，并将每个元组中的值赋给键和值。\n\
  \n## WHILE 语句\n\n`While` 指令与 `For` 指令相似。唯一的区别是迭代不是基于固定序列，而是只要给定条件为真就一直执行操作。\n\n\
  这里是 `While` 如何工作的示例：\n\n![](img/00009.jpeg)\n\n```python\nx = 1\nwhile x < 7:\n\
  \    print x\n    x += 1\n```\n>>>\n\n在上面的示例中（递增语句），将执行直到计数保持在 7 以下。如果条件一直保持为真，我们就有了所谓的“死循环”。在这种情况下，你应该按下\
  \ `CTRL + C` 来关闭程序。\n\n### Break 和 Continue\n\n`Break` 和 `Continue` 用于停止迭代或跳转到下一个。\n\
  \n![](img/0010.jpeg)\n\n你经常会在 `for` 循环和 `while` 循环中使用 `Break`，就像这些经典示例：\n\n```python\n\
  for var in sequence:\n    if condition:\n        Break\n```\n\n```python\nwhile\
  \ test expression:\n    if condition:\n        Break\n```\n\n既然我们已经接触了 `break` 和\
  \ `continue`，让我们回到 `for` 和 `while`，因为它们还有另一个特性，指令：`Else`。它是一个 `If` 子句，但 `else` 在循环中也非常有用，因为我们在\
  \ `else` 中编写的所有指令将在循环结束时执行（前提是我们没有先用 `break` 结束循环）。\n\nif – else 示例：\n\n```python\n\
  Num = 8\nif num >= 5:\n    print(\"positive or zero\")\nelse:\n    print(\"negative\
  \ number\")\n```\n>>>\n\n通过这个程序，你可以检查数字是正数、负数还是零。\n\n## 第十二章：函数\n\n什么是函数？它是用于执行特定任务的代码块。通过函数，我们可以拆分程序。这允许我们获得更好的模块化，有利于组织和提高用性。我们通常在\
  \ Python 中遇到三种类型的函数：\n\n1. 用户定义函数；由用户创建的函数。\n2. 内置函数；下\n3. 匿名函数；也称为 Lambda 函数，使用\
  \ `lambda` 结构创建。\n\n以下是内置函数列表：\n\n| 函数 | 描述 |\n| :--- | :--- |\n| [`abs()](https://www.programiz.com/python-programming/methods/built-in/abs)\
  \ | 返回数字的绝对值 |\n| [`any()](https://www.programiz.com/python-programming/methods/built-in/any)\
  \ | 检查可迭代对象中是否有元素为真 |\n| [`all()](https://www.programiz.com/python-programming/methods/built-in/all)\
  \ | 当可迭代对象中所有元素都为真时返回真 |\n| [`ascii()](https://www.programiz.com/python-programming/methods/built-in/ascii)\
  \ | 返回可打印的表示 |\n| [`bin()](https://www.programiz.com/python-programming/methods/built-in/bin)\
  \ | 将整数转换为二进制字符串 |\n| [`bool()](https://www.programiz.com/python-programming/methods/built-in/bool)\
  \ | 将值转换为布尔值 |\n| [`bytearray()](https://www.programiz.com/python-programming/methods/built-in/bytearray)\
  \ | 返回指定大小字节数组 |\n| [`callable()](https://www.programiz.com/python-programming/methods/built-in/callable)\
  \ | 检查对象是否可调用 |\n| [`bytes()](https://www.programiz.com/python-programming/methods/built-in/bytes)\
  \ | 返回不可变的字节 |\n| [`chr()](https://www.programiz.com/python-programming/methods/built-in/chr)\
  \ | 从整数返回字符（字符串） |\n| [`compile()](https://www.programiz.com/python-programming/methods/built-in/compile)\
  \ | 返回代码对象 |\n| [`classmethod()](https://www.programiz.com/python-programming/methods/built-in/classmethod)\
  \ | 为给定函数返回类方法 |\n| [`complex()](https://www.programiz.com/python-programming/methods/built-in/complex)\
  \ | 创建复数 |\n| [`delattr()](https://www.programiz.com/python-programming/methods/built-in/delattr)\
  \ | 从对象中删除属性 |\n\n\n\n\n\n## Python 内置函数与方法\n\n- `staticmethod()`: 从函数创建静态方法\n-\
  \ `filter()`: 从结果为真的元素中构造迭代器\n- `eval()`: 在程序内运行 Python 代码\n- `float()`: 从数字或字符串返回浮点数\n\
  - `format()`: 返回值的格式化表示形式\n- `frozenset()`: 返回一个不可变的冻结集合（frozenset）对象\n- `getattr()`:\
  \ 返回对象命名属性的值\n- `globals()`: 返回当前全局符号表的的字典\n- `exec()`: 执行动态创建的程序\n- `hasattr()`:\
  \ 返回对象是否具有命名属性\n- `help()`: 调用内置帮助系统\n- `hex()`: 将整数转换为十六进制\n- `hash()`: 返回对象的哈希值\n\
  - `input()`: 读取并返回一行字符串\n- `id()`: 对象的标识符\n- `isinstance()`: 检查对象是否为类的实例\n- `int()`:\
  \ 从数字或字符串返回整数\n- `issubclass()`: 检查对象是否为类的子类\n- `iter()`: 返回对象的迭代器\n- `list()`:\
  \ 在 Python 中创建列表\n- `locals()`: 返回当前符号表的字典\n- `len()`: 返回对象的长度\n- `max()`: 返回最大的元素\n\
  - `min()`: 返回最小的元素\n- `map()`: 应用函数并返回列表\n- `next()`: 从迭代器中获取下一个元素\n- `memoryview()`:\
  \ 返回参数的内存视图\n- `object()`: 创建一个无特征的对象\n- `oct()`: 将整数转换为八进制\n- `ord()`: 返回 Unicode\
  \ 字符的 Unicode 码点\n- `open()`: 返回文件对象\n- `pow()`: 返回 x 的 y 次\n- `print()`: 打印给定对象\n\
  - `property()`: 返回一个属性属性\n- `range()`: start 到 stop 之间的整数序列\n- `repr()`: 返回对象的打印表示形式\n\
  - `reversed()`: 返回序列的迭代器\n- `round()`: 将浮点数四舍五入指定的位数\n- `set()`: 返回一个 集合\n- `setattr()`:\
  \ 设置对象属性的值\n- `slice()`: 创建由 `range()` 指定的切片对象\n- `sorted()`: 从给定的可迭代对象返回排序后的列表\n\
  - `str()`: 返回对象的非正式表示形式\n- `sum()`: 相加可迭代对象中的项\n- `tuple()`: 创建元组\n- `type()`: 返回对象的类型\n\
  - `vars()`: 返回类的 `__dict__` 属性\n- `zip()`: 返回元组的迭代器\n- `__import__()`: 被 import\
  \ 用的高级函数\n- `super()`: 允许通过 super 引用父类\n\n## 函数定义\n\n允许我们创建函数的指令是 `def`。\n\n示例：\n\
  \n```python\ndef fact(n):\n    if n < 2:\n        return 1\n    return n * fact(n\
  \ - 1)\n```\n\n\n\n\n\n`Fact` 函数只接受一个参数，命名为“n”。返回指令用于结束函数并返回正确的数字。\n\n正如你在上一个示例所示，我们可以发现：\n\
  * 关键字 `def` 后面跟着函数名\n* 一个参数 (`n`)\n* 使用冒号 (`:`) 来标记函数的结束\n* 在相同的缩进层级下，我们编写另一个有效语句来创建函数体\n\
  * 最后用一个 `return` 语句来退出函数。\n\n```python\nDef functionname( parameters ):\n    \"\
  function_docstring\"\n\n    Function_suite\n        Return [expression]\n```\n\n\
  ### Docstring（文档字符串）\n文档字符串（docstring）用于解释该函数的功能。它是可选的，但有时你可能需要记录你正在编写的内容。\n\n###\
  \ Return（返回）\n`return` 语句用于退出函数并将一个值返回给其调用者（`print` 命令只产生文本）。当函数在没有 `return` 语句的情况下结束时，它等同于\
  \ `return None`。\n\n## Python 中的函数是如何工作的？\n![](img/00011.jpeg)\n\n通过函数，你可以：\n* 定义函数\n\
  * 调用函数\n\n## 如何定义函数\n你可以像之前所示使用关键字 `def` 轻松地定义函数来声明函数。随后，程序员将向函数添加参数（括号内）以及向函数本身添加要执行的语句。最后，插入\
  \ `return` 语句以退出函数。\n\n## 调用函数\n“调用函数意味着什么”\n调用函数是执行你所定义的函数的过程。你可以从 Python 提示符调用函数，也可以通过其他函数调用函数。\n\
  \n### return 语句\n在上节中，你已经见过了 `return` 语句。基本上，它会返回某些内容或对函数调用者回复。\n\n以下所有函数 `[F1,\
  \ F2, F3]` 都将返回 `None`：\n\n```python\ndef f1():\n    pass\n\ndef f2():\n    return\n\
  \ndef f3():\n    return None\n```\n\n我们可以在 IDLE 中验证它：\n```python\n>>> print f1(),\
  \ f2(), f3()\nNone None None\n>>>\n```\n\n# 第十三章：类\n\n现在我们已经看了数据类型、语法和函数，我们将合并它们来学习在\
  \ Python 中创建新类。\n\n首先，我们应该定义什么是类，以及什么是对象：\n对象是将变量和函数封装成单个实体的实体。类是一个你可以用来创建对象的模板。类为对象提供了变量和函数。我们可以说类是创建对象的蓝图。\n\
  \n所以，让我们通过创建我们的第一个类来进入这一主题吧！首先，我们必须使用类运算符定义一个类：\n\n### 定义类\n```python\nclass class_name:\n\
  \    [statement 1]\n    [statement 2]\n    [statement 3]\n    [等等]\n```\n\n现在，我们创建了一个新的本地命名空间，我们可以在其中定义给定类的属性；属性是数据或函数。我们可以通过在创建类时自动创建类对象来访问数据和函数。为了访问属性并为类添加新对象，我们必须使用这个类对象。\n\
  \n最后，我们可以创建一个对象。过程像往常一样直观：\n```python\nob = MyClass()\n```\n我们刚刚创建了一个命名为 `ob` 的新实例对象。\n\
  \n可以使用 `del` 语句轻松地删除对象和属性。让我们来看一个例子：\n```python\nc1 = ComplexNumber(1,3)\ndel c1\n\
  c1\n```\n\n类包含方法。方法基本上是一个以类实例作为第一个参数的函数。让我们举个例：\n\n```python\nclass movies:\n  \
  \  \"电影子类型\"\n    def __init__(self, horror=0, thriller=0, drama=0):\n        self.horror\
  \ = horror\n        self.thriller = thriller\n        self.drama = drama\n```\n\n\
  # 第十四章：什么会导致致命错误以及如何修复\n\n如果你在使用 PC 时随时遇到致命异常错误（fatal exception errors），那么你可能在好奇为什么发生这种情况以及其原因是什么。基本上，致命异常是许多\
  \ PC 用户在使用电脑时遇到的一种错误消息。这种特定错误将指示你正在运行的程序以及导致错误的程序需要关闭。致命异常错误简单意味着无法处理异常以便程序继续运行。\n\
  \n你必须理解，软件程序需要通过层层代码与操作系统通信。当操作系统遇到无效代码或非法软件指令时，就会导致致命异常错误。通常，致命异常错误是由程序不稳定引起的。它可能由编写不当的程序以及硬件相关问题（如特定硬件的覆盖）引起。致命错误有很多原因。首先是禁用导致加载程序与正在运行程序之间产生冲突的程序。你可能还想删除临时文件，因为这是致命异常的常见原因。对硬盘进行碎片整理也可以防止损坏。\n\
  \n# 第五章：错误处理的最佳实践\n\n本章解释了为使用服务器端脚本的网站实现错误处理的过程。适当的错误处理对于确保网站用户在访问期间良好良好的是必要的。每个网站在部署到正式服务器之前都应该在测试服务器上进行测试。然而，并不总是能够预测每一个可能的错误和良好的错误。\n\
  \n谈论网站错误时，有两种我们需要讨论的不同类型：\n1. 致命错误（Fatal errors）会导致脚本执行停止并向用户报告页面错误（HTTP 状态 500）。\n\
  2. 异常（Exception）是服务器端脚本抛出的错误，可以通过脚本捕获并允许网页显示。这种异常的一个例子是数据库查询，它会导致异常但不会中止当前脚本的执行。\n\
  \n### 构建代码库\n为了整个网站提供一致的错误处理，应该创建一个共享代码模块，提供大部分错误处理细节。这里的目标不是重复代码，以便在一个集中位置进行处理。这样，对代码进行的任何更改或修改只需执行一次。良好的错误处理库将包含向访问者显示友好消息以及收集技术支持所需的所有调试信息的方法。\n\
  \n每种编程语言都是不同的，因此将由开发者决定如何实现错误处理。目标应该是使其灵活且符合直觉，以便在许多不同的场景中使用。它只需要极少的代码将部分脚本代码封装在错误处理中。\n\
  \n### 显示友好消息\n对于向用户显示友好错误消息有多种方案。其中一种方案是停止整个页面的处理，并显示一条信息：“抱歉，由于内部问题，目前无法显示此网页。我们的技术支持团队已收到通知并将尽快解决此问题。”这通常是处理我们能够通过服务器端脚本处理的任何意外错误的最佳方式。\n\
  \n\n\n\n另一种方案是尽可能显示页面内容，并在屏幕上放置一个非常显目的错误消息。该消息的内容为“由于内部错误，无法执行操作”。这种处理方式的意义在于为用户提供机会纠正问题并尝试重新操作。这种情况通常发生在表单提交时，即错误数据导致网页出错。\n\
  \n### 调试信息\n\n当服务器端代码能够处理错误时，将调试信息发送给网站管理员和技术支持团队非常重要，这样就可以快速解决问题。这种调试信息与显示给用户的友好错误消息不同。它包含了关于导致错误的代码详细信息以及任何其他相关信息。\n\
  \n最常见的错误之一是由于不使用存储过程的网站 SQL 语句格式错误导致的数据库错误。这种错误可以通过服务端代码轻松地捕捉并处理。在这种情况下，我们希望看到的调试信息是错误源（文件名和行号）、堆栈跟踪以及导致错误的错误\
  \ SQL 脚本。\n\n我们希望看到的其他信息还包括包含查询字符串的 URL。请求方法（GET 或 POST）以及所有表单变量都会传递给脚本。此外，在客户端机器上设置任何\
  \ Cookie 都有助于重现错误。这一点在于，我们需要获取尽可能的信息，以便快速识别并纠正问题。\n\n### 传输调试信息\n\n一旦获得了这些调试信息，我们需要将其传输给网站管理员和技术支持团队。最简单的方法是发送一封包含所有上述信息的电子邮件。另一种方法是将这些信息存储可以通过公司内网访问的数据库中。\n\
  \n您应该考虑两种方法都采用，以消除一种方法失败的可能性。当然，如果整个脚本失败并停止执行，将没有任何信息被发送出去。这是错误处理的风险之一。为了防止这种情况，网站所有者应该定期测试其错误处理机制以确保正常工作。\n\
  \n### 网站管理员报警\n\n如所述，错误通知可以通过电子邮件传递。有时，让收件箱充满大量邮件并没有意义。另一种方案是创建一个 RSS 馈。RSS 代表“真正简单聚合”（Really\
  \ Simple Syndication）或“站点摘要”（Rich Site Summary）。它就像一种新闻源，向用户递送标题和摘要。\n\n使用 RSS 阅读器应用程序，用户可以通过电脑或手机接收有关新获取报告的通知。有很多库可用于在网站上创建\
  \ RSS。创建自己的服务也不困难，因为 RSS 馈无非只是一个提供信息的 XML 文档。为了更快的速度，使用短信或手机短信息添加通知（或警报）也是轻而易举的。就像以前使用寻呼机一样，所有者将立即收到通知，因为警报中可以发送页面或错误等信息。第十六章：为什么\
  \ Python 会长久不衰\n\nPython 最初由 Van Rossum 在 1989 年 12 月作为一种爱好语言构想的。此外，这种通用编程语言的主要且向后兼容的版本于\
  \ 2008 年 12 月 3 日发布。但 Python 被许多开发者评为 2015 年最流行的语言。巨大的流行程度表明了 Python 作为现代编程语言的有效性。同时，Python\
  \ 3 目前被全球开发者用于创建各种桌面、Web 和移动端应用程序。还有许多原因使得 Python 的巨大人气将在未来长期保持不变。\n\n### Python\
  \ 巨大人气在未来保持不变的 8 个原因\n\n#### 1) 支持多种编程范式\n\n优秀的开发者经常利用不同的编程范式来减少开发大型复杂应用所需的时间精力。与其他现代语言一样，Python\
  \ 支持多种常用的编程风格，包括面向对象、函数式、过程化和命令式。它具有自动内存管理和动态类型系统。因此，程序员可以使用该语言来实现大型复杂软件应用的开发。\n\
  \n#### 2) 不需要程序员编写冗长的代码\n\nPython 的设计完全关注代码的可读性。因此，程序员可以创建可供分布式团队成员使用的可读代码库。同时，该编程语言简单的语法使他们能够在不编写长行代码的情况下表达概念。这一特性使得开发者更容易处理大型复杂应用，因为他们可以轻松跳过其他语言所需的某些任务。\n\
  \n#### 3) 提供了全面的标准\n\nPython 凭借其标准库在其他语言面前更胜一筹。程序员可以在不编写额外代码的情况下使用它们。此外，Python 的标准库是为各种任务设计的。因此，它有助于开发和\n\
  \n#### 4) 便于 Web 应用开发\n\nPython 被设计为一种通用语言，缺乏内置的 Web 功能。Web 开发者使用各种框架，包括 Django、Web2、Cubic\
  \ 和 Real。这些框架帮助程序员执行操作，如数据库操作、URL 路由、会话存储和输出模板。他们可以进一步利用这些框架保护 Web 免受跨站脚本攻击。\n\n\
  #### 5) 便于高质量 GUI、科学和数值应用的开发\n\nPython 目前可在主流操作系统上运行，如 Windows、Mac X、Linux 和 UNIX。因此，用语言编写的桌面\
  \ GUI 应用可以部署在多个平台上。程序员可以使用 Kivy、wxPython 和 PyGT 等框架进一步加速跨平台桌面 GUI 应用的开发。许多报告强调了\
  \ Python 被广泛用于数值和科学应用的开发。\n\n#### 6) 简化应用原型设计\n\n\n\n\n如今，每个机构都希望通过开发具有独特且创新功能的软件来赢得竞争。这就是为什么原型设计已成为现代软件开发周期中不可或缺的一部分。在编写代码之前，开发者必须创建一个应用程序的原型，向各种利益相关者展示其特性和功能。作为一种简单且快速的编程语言，Python\
  \ 让程序员能够在不花费任何额外时间和精力的情况下开发出最终系统。同时，开发者还可以选择直接通过重构代码，从原型开始开发系统。\n\n### 也能也用于移动应用开发吗？\n\
  \n像 `Kivy` 这样的框架使得 Python 适用于开发移动应用。作为一个库，`Kivy` 可以用于创建桌面应用程序和移动应用。但它允许开发者编写一次代码，并将相同的代码部署到多个平台上。除了与移动设备的硬件进行交互外，`Kivy`\
  \ 还内置了摄像头适配器、用于渲染和播放视频的模块，以及通过多点触和手势断言用户输入的模块。因此，程序员可以使用 `Kivy` 为 iOS、Android 和\
  \ Windows Phone 创建同一应用程序的不同版本。此外，该框架不需要开发者在创建 `Kivy` 程序时编写长长的代码。在创建完不同版本的移动应用后，他们可以为各个应用商店单独打包应用。这种选项让开发者更容易创建不同版本的移动应用，而无需部署专门的开发人员。\n\
  \n### 开源\n\n尽管 Python 被评为 2015 年最流行的编程语言，但它仍然作为开源和免费软件提供。大型 IT 公司、初创公司和自由职业软件开发者都可以使用这种编程语言，而无需支付任何费用或版税。因此，Python\
  \ 让企业能够更容易地降低开发成本。同时，程序员可以利用大型活跃活跃社区提供的帮助来添加开箱即用的功能。\n\n# 结论\n\nPython 是一种强大的语言，提供了易于编写的代码、良好的维护处理和方便的调试。由于\
  \ Google 将其作为官方编程语言之一，它在全球范围内变得日益重要。\n\n由于其简单的语法以及易于调试和修复，Python 是程序员中的一种热门选择。\n\
  \n与许多其他解释型语言类似，Python 比编译型语言更具灵活性，可以高效地用于集成不同的系统。无疑，Python 是一门多功能的编程语言，适用于多个领域。\n\
  \n现在你已经读到了这本书的末尾，你应该能够理解 Python 的基础知识并编写简单的代码。你还应该能够理解各种数据类型之间的区别、Python 中的语法以及最重要的函数和模块。\n\
  \n感谢你读完这本书，希望你喜欢它。\n"
