  \ period-1)\n    return 100 - 100 / (1 + rs)\n\ndata_original['RSI'] = RSI(data_original['Adj\
  \ Close'], 14) # RSI 作用于收盘价\n\n## 计算每日收益\ndata_original['returns'] = np.log(data_original['Adj\
  \ Close'] / data_original['Adj Close'].shift(1))\ndata_original['returns'].fillna(0,\
  \ inplace=True)\ndata_original['returns_1'] = data_original['returns']\ndata_original['returns_2']\
  \ = data_original['returns_1']\ndata_original['returns_final'] = # (省略部分)\n\n##\
  \ 5 天滚动均值参数动量设置\ndata_original['mom'] = np.sign(data_original['returns_final'].rolling(5).mean())\n\
  ```\n\n现在我们已经为 AMZN 预处理了数据，准备好创建并应用 CNN 深度学习神经网络了。我们特别选择了 CNN 模型是因为其灵性和可解释性。我们将\
  \ CNN 框架应用于模型，训练数据，并最终使用 keras 计算模型准确率和损失。方法如下：\n\nKeras 中的模型有两种形式：Sequential 和函数\
  \ API。对于你构建的大多数深度学习网络，可能会使用 Sequential 模型。\n\n这允许你按照输入到输出的顺序轻松堆叠层（甚至是递归层）。函数 API\
  \ 允许你构建更复杂的架构。\n\n```python\nmodel = Sequential() # 配置模型进行训练\n\n## 第一层 1D 卷积，即时间卷积。该层创建一个卷积核并与层输入卷积以产生输出张量。\n\
  # ，注意我们不需要像 TensorFlow 那样声明任何权重或偏置变量，因为 Keras 会处理。\nmodel.add(Convolution1D(input_shape=(WINDOW,\
  \ EMB_SIZE), # 3D 张量形状为:(样本, 步骤, 输入维度)。对于我们，窗口=30 是步骤，EMB_SIZE=5 是输入维度。\n      \
  \                     nb_filter=16, # nb_filter：使用的卷积核数量（输出维度）\n               \
  \            filter_length=4, # 每个滤波器的空间（时间）扩展\n                           border_mode='same'))\
  \ # 'valid', 'same' 或 'full'（'full' 需要 Theano 后端）。\n\nmodel.add(BatchNormalization())\
  \ # 在每个批次上归一化上一层的激活值，即应用一种保持激活值均值接近 0 且标准差接近 1 的变换。\n\nmodel.add(LeakyReLU()) #\
  \ 激活器是一种激活函数（根据给定输入或一组输入定义节点的输出）。整流线性单元的泄露版本。Leaky ReLUUs 在单元未激活时允许产生微小的非零梯度。Leaky\
  \ ReLUUs 是解决“死亡 ReLU”问题的一种尝试。当 x < 0 时，函数不再为 0，leaky ReLU 反而有一个小的负斜率（约为 0.01）。\n\
  ```\n\n\n\n计算 `f(x)\\=??(x<0)(αx)+??(x>=0)(x)`，其中 `α` 是一个小的常数。有些人报告这种形式的激活函数是有效的，但结果并不总是一致。\n\
  \n`model.add(Dropout(0.5))` # 丢弃神经元（输入）的比例。dropout 的目标是帮助神经网络不要过拟合数据。我们通过以 `keep_prob`\
  \ 的概率将输入向量中的某些维度设置为零，在每一层中随机去激活 50% 的特定单元（神经元）。\n\n因此，神经网络将继续学习不同的特征。因此训练速度将会更快。\n\
  \n## 第二层，未给出输入形状（仅需在上面的第一层中定义）\n\n```python\nmodel.add(Convolution1D(nb_filter=8,\
  \ filter_length=4, border_mode='same'))\nmodel.add(BatchNormalization())\nmodel.add(LeakyReLU())\n\
  model.add(Dropout(0.5))\nmodel.add(Flatten())\n```\n\n`Flatten()` 此操作将展平输入（或 3D\
  \ 矩阵的行）。它不影响批大小（batch size）。`Flatten()` 算符从最后一个维度开始展开值。\n\n\n```python\nmodel.add(Dense(64))\n\
  ```\n\n`Dense(64)` 是一个具有 64 个隐藏单元的全连接层。一个全连接层表示一个矩阵向量乘法（假设你的批大小为 1）。\n\n矩阵中的值是可训练参数，这些参数在反向传播过程中会更新。因此，全连接层用于更改向量的维度。从数学上来说，它对你的向量应用了旋转、缩放和平移变换。简单来说，全连接层只是神经网络中普通的神经元层。每个神经元接收来自上一层所有神经元的输入，因此是稠密连接的。该层有一个权重矩阵\
  \ `W`、偏置向量 `b` 以及上一层的激活值 `a`。\n\n```python\nmodel.add(BatchNormalization())\nmodel.add(LeakyReLU())\n\
  ```\n\n\n```python\nmodel.add(Dense(2))\n```\n\n`Dense(64)` 是一个具有 2 个隐藏单元的全连接层（注：原文此处为\
  \ 64, 但根据上下文应为 2）。\n\n`model.add(Activation('softmax'))` 我们应用 softmax 激活函数；通常用于具有概率方法的模型，如此类模型。\n\
  \n\n`opt = Nadam(lr=0.002)` # 定义优化器。我们将使用 Nadam 优化器。https://keras.io/optimizers/。就像\
  \ Adam 本质上是带动量的 RMSprop，，Nadam 是带 Nesterov 动量的 Adam RMSprop。\n\n为随机梯度下降优化过程调整学习率可以提高性能并缩短训练时间。因此，训练期间简单且可能常用的学习率适应方法是随时间减少学习率的技术。这些技术的用处是在训练过程初期使用较大的学习率值时进行大幅调整，并在训练后期减小学习率，从而对权重进行较小的训练更新。\n\
  \n这种训练过程具有在早期快速学习良好权重并在后期对其进行微调的效果。两种流行且易于使用的学习率策略如下：\n\nA. 根据 epoch（迭代）逐渐降低学习率。\n\
  B. 在特定的 epoch 使用断点式的大下降来降低学习率。\n\n以下是优化器的几个参数：\n\n1. `lr`: 学习率，浮点数 >= 0。\n2. `beta_1`,\
  \ `beta_2`: 浮点数，0 < beta < 1。通常接近 1。\n3. `epsilon`: 浮点数 >= 0。模糊因子。如果是 None，默认为 `K.epsilon()`。\n\
  \n`reduce_lr = ReduceLROnPlateau(monitor='val_acc', factor=0.9, patience=30, min_lr=0.000001,\
  \ verbose=1)` https://keras.io/callbacks/#reducelronplateau。\n\n当指标停止改进时，按预定义的因子减少学习率：模型通常能从学习停滞后将学习率降低\
  \ 2-10 倍中益。此回调函数监控一个数量，如果在 'patience'（耐心）指定的 epoch 内没有看到改进，则降低学习率。\n\n参数包括：\n\n\
  1. `monitor`: 要监控的指标。\n2. `factor`: 学习率减少的因子。`new_lr = lr * factor`\n3. `patience`:\
  \ 在降低学习率之前，连续无改进的 epoch 数。\n4. `verbose`: 整数。0: 静默，1: 更新消息。\n5. `min_lr`: 学习率的下限。\n\
  \n`checkpointer = ModelCheckpoint(filepath=\"lolkek.hdf5\", verbose=1, save_best_only=True)`\
  \ Checkpoint 允许我们在每个 epoch 后保存模型。它通过扩展基类 `keras.callbacks.Callback` 创建自定义回调。回调函数可以通过类属性\
  \ `self.model` 访问其关联模型。\n\n此方法的参数包括：\n\n1. `filepath`: 字符串，保存模型文件的路径。\n2. `monitor`:\
  \ 要监控的指标。\n3. `verbose`: 整数。0: 静默，1: 更新消息。\n4. `save_best_only`: 布尔值，如果为 True 则仅保存最佳模型。\n\
  \n`model.compile(optimizer=opt, loss='categorical_crossentropy', metrics=['accuracy'])`\
  \ https://keras.io/losses/ 决定应用何种损失函数。\n\n`history = model.fit(X_train, Y_train,\
  \ epochs=100, batch_size=128, verbose=1, validation_data=(X_test, Y_test), callbacks=[reduce_lr,\
  \ checkpointer])` https://keras.io/models/sequential/ 使用 X_train 训练模型。\n\n\n`model.load_weights(\"\
  lolkek.hdf5\")` 从 HDF5 文件加载权重。默认情况下，架构保持不变。\n\n`pred = model.predict(np.array(X_test))`\
  \ 为测试 Y_test 预测输出，将 X_test（我们的测试特征）设置为 numpy 数组。\n\n使用混淆矩阵帮助检查过拟合：\n\n```python\n\
  from sklearn.metrics import classification_report\nfrom sklearn.metrics import confusion_matrix\n\
  \nC = confusion_matrix([np.argmax(y) for y in Y_test], [np.argmax(y) for y in pred])\n\
  print(C / C.astype(np.float).sum(axis=1))\n```\n\n分类输出示例如下：\n\n```\n[[0.75510204\
  \ 0.24489796]\n [0.46938776 0.53061224]]\n```\n\n其中我们预测上涨的比例为 75%，预测下跌的比例为 53%，非对角线元素是分类器标记错误的样本。\n\
  \n最后，我们可以如下绘制训练和测试数据的模型损失和准确率：\n\n绘制模型损失与准确率\n\n```python\nplt.figure()\nplt.plot(history.history['loss'])\n\
  plt.plot(history.history['val_loss'])\nplt.title('model loss')\nplt.ylabel('loss')\n\
  plt.xlabel('epoch')\nplt.legend(['train', 'test'], loc='best')\nplt.show()\n\nplt.figure()\n\
  plt.plot(history.history['acc'])\n```\n\n\n\n\n\n```python\nplt.plot(history.history['val_acc'])\n\
  plt.title('model accuracy')\nplt.ylabel('accuracy')\nplt.xlabel('epoch')\nplt.legend(['train',\
  \ 'test'], loc='best')\nplt.show()\n```\n\n该代码根据我们上面定义的训练次数（epochs）和批量大小（batch sizes）进行多次迭代，随后为我们在约\
  \ 439 个交易日的测试期生成了模型损失和准确率的精美图表如下：\n\n![Capture.PNG](img/00004.jpeg)\n![Capture.PNG](img/00005.jpeg)\n\
  \n现在我们已经成功将 CNN 模型应用于数据集，可以继续将特定的技术指标（记得我们之前定义过的）编码到 CNN 框架中。可以通过以下方式实现：\n\n```python\n\
  df_close = data_original['Adj Close'][-439:].reset_index(drop=True)\ndf_SMA = data_original['SMA'][-439:].reset_index(drop=True)\n\
  df_mom = data_original['mom'][-439:].reset_index(drop=True)\ndf_MACD = data_original['stock_df_crossover_12_26'][-439:].reset_index(drop=True)\n\
  df_RSI = data_original['RSI'][-439:].reset_index(drop=True)\ndf_upper_band = data_original['Upper\
  \ Band'][-439:].reset_index(drop=True)\ndf_lower_band = data_original['Lower Band'][-439:].reset_index(drop=True)\n\
  df_buy1 = df_close > df_SMA\ndf_buy2 = df_mom > 0\ndf_buy3 = df_RSI < 55\ndf_buy4\
  \ = df_MACD > 0\ndf_BUY = df_buy1 + df_buy2 + df_buy3 + df_buy4\ndf_BUY_FINAL =\
  \ df_BUY.reset_index(drop=True)\ndf_sell1 = df_close < df_SMA\ndf_sell2 = df_mom\
  \ < 0\ndf_sell3 = df_RSI > 50\ndf_sell4 = df_MACD < 0\ndf_SELL = df_sell1 + df_sell2\
  \ + df_sell3 + df_sell4\ndf_SELL_FINAL = df_SELL.reset_index(drop=True)\n```\n\n\
  \n现在进入这个 CNN 框架中最关键的部分，即我们实际上设置一个概率阈值，以决定何时显示买入和卖出信号。对于 AMZN 的这个特定示例，我们将这些关键水平定义为\
  \ 0.57 和 0.41。这意味着，如果算法生成的买入概率达到 57% 或更高，我们就买入；反之，如果生成的买入信号概率仅为 41% 或更高，我们实际上执行卖出。\n\
  \n这里的通性理念是，只有当 AMZN 明日上涨的概率高于某个阈值（在本例中为 57%）时，我们才买入。同样，在调整算法和微调结果时，可以根据需要更改这些水平。此外，记得我们还编码了技术指标，作为我们交易信号的额外支持层。如上一个代码块所示，在本例中，这些指标包括简单移动平均线、动量、RSI\
  \ 和 MACD。为了让交易通过先决条件并实际发生，所有指标必须与 CNN 的信号一致地指向买入或卖出。\n\n\n与之相关的代码如下：\n\n```python\n\
  ## 设置过滤器\nfilter1 = (pred[0] > 0.57) # 买入过滤器，pred dataframe 的第 1 列 [0]（记得第 2 列 [1]\
  \ 仅仅是股票下跌的百分比）\nfilter2 = (pred[0] < 0.41) # 卖出过滤器，pred dataframe 的第 1 列 [0]（记得第\
  \ 2 列 [1] 仅仅是股票下跌的百分比）\nfilter3 = buy_technical_signal > 0  # 第二个买入过滤器（技术性），> 0\
  \ 意味着参数为真 (1)\nfilter4 = sell_technical_signal > 0  # 第二个卖出过滤器（技术性），> 0 意味着参数为真\
  \ (1)\n\n## 将所有数据合并为 1 个 DataFrame 以便查看\npred2 = pd.concat([pred,filter1,filter2,\
  \ filter3, filter4],axis=1)\nprint(pred2)\npred2.columns = ['Pred 1st Column','Pred\
  \ 2nd Column','Signal','Filter1','Filter2', 'Filter3', 'Filter4']\n\n## 使用 np.where\
  \ 函数根据是否满足上述过滤器设置 Signal\npred2['Signal'] = np.where(pred2['Filter1'] & pred2['Filter3'],1,0)\n\
  pred2['Signal'] = np.where(pred2['Filter2'] & pred2['Filter4'],-1,pred2['Signal'])\n\
  buys = pred2.loc[pred2['Signal'] == 1]\nsells = pred2.loc[pred2['Signal'] == -1]\n\
  \n## 需要重索引 buys 和 sells DataFrames 以匹配 data_original['Close'] 的索引\nif not buys.empty:\n\
  \    buy_index_new = buys.index[-1] - buys.index\n    buy_index_new_2 = len(data_original.index)\
  \ - buy_index_new\n    buys.set_index(buy_index_new_2,inplace=True)\nif not sells.empty:\n\
  \    sell_index_new = sells.index[-1] - sells.index\n    sell_index_new_2 = len(data_original.index)\
  \ - sell_index_new\n    sells.set_index(sell_index_new_2,inplace=True)\n\n## iloc[行切片，列切片]\
  \ 真实价格设置为最后 788 天的股票价格\nreal_stock_price = data_original.iloc[-439:,4] \nreal_stock_price\
  \ = real_stock_price.values\nreal_stock_price = pd.DataFrame(real_stock_price)\n\
  print(real_stock_price)\nprint(\"REAL STOCK PRICE\",real_stock_price)\n```\n\n我们的算法现在准备好开始回测。与之前一样，我们将初始组合价值设置为\
  \ $100,000，并实现一个与逻辑回归类似的回测函数，尝试通过在相同期间应用我们新的 CNN 来超越初始模型的性能。同样，我们将首先编写回测函数，然后像之前一样将\
  \ Python 模块应用于它。操作方法如下：\n\n```python\n## 定义回测方法\ndef backtest(data):\n    cash =\
  \ 100000 \n    position = 0 \n    total = 0\n    equity_curve_df = []\n    data['Total']\
  \ = 100000 \n    # 为了计算买持有价值，我在回测的第一天将所有资金投入 X 资产\n    increment = 50 \n    for\
  \ row in data.iterrows():\n        price = float(row[1][0])\n        signal = pred2.iloc[row[0]][2]\n\
  \        if (signal > 0 and cash - increment * price > 0):\n            # 买入\n \
  \           cash = cash - increment * price \n            position = position +\
  \ increment \n        elif (signal < 0 and abs(position * price) < cash): \n   \
  \         # 卖出\n            cash = cash + increment * price \n            position\
  \ = position - increment\n```\n\n\n\n\n\n```python\nprint(row[0].strftime('%d %b\
  \ %Y') + \" Position = \" + str(position) + \" Cash = \" + str(cash) + \" // Total\
  \ = {:,}\".format(int(position * price + cash)))\n\nequity_curve_df.append(float(position\
  \ * price + cash))\n\nequity_curve_df = pd.DataFrame(equity_curve_df,index=range(len(equity_curve_df)),columns=[\"\
  Total\"])\n\nindex = pd.date_range('03/01/2018', periods=len(equity_curve_df), freq='D')\n\
  \nequity_curve_df = pd.DataFrame(equity_curve_df, index=index, columns=['Total'])\n\
  \nreturn equity_curve_df # return number of shares multiplied by price of asset\
  \ + cash left in balance\n```\n\n## 现在，实现上面定义的回测方法：\n\n## 运行上面定义的回测函数，为我们的策略创建资金回率曲线\
  \ df\n\n```python\nequity_curve_df = backtest(real_stock_price) # 对于我们的策略，回测将等同于我们定义的\
  \ backtest(data) 方法，利用我们的 dataframe 作为数据\nprint(equity_curve_df) # 打印回测结果以美元计的现金值\n\
  ```\n\n## 使用 Python 金融函数 (FFN) 计算算法统计数据\n\n```python\nequity_curve_df['Equity']\
  \ = equity_curve_df\nperf = equity_curve_df['Equity'].calc_stats()\n\n## 绘制资金回率曲线\n\
  perf.plot()\nplt.show()\n\n## 显示整体指标\nperf.display()\n\n## 显示月收益率\nperf.display_monthly_returns()\n\
  \n## 绘制策略回撤序列的可视化表示：\n```python\nffn.to_drawdown_series(equity_curve_df['Equity']).plot(figsize=(15,7),grid=True)\n\
  #plt.show()\n\n## 绘制收益直方图\nperf.plot_histogram()\n#plt.show()\n\n## 提取回溯收益\nperf.display_lookback_returns()\n\
  ```\n\n## 打印策略的信号列\n\n```python\nprint(\"CURRENT SIGNAL FOR ALGORITHM: 1: BUY, 0:\
  \ HOLD, -1:SELL\")\nprint(pred2.iloc[:,2])\n```\n\n模型结果，包括我们的资金回率曲线和回测函数如下：\n\n\
