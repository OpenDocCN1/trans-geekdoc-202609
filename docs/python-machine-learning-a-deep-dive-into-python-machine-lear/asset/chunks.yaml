- raw: "Tuples, just like lists, respond to any general operation, like those we have\
    \ seen in the chapter regarding lists (length, concatenation, repetition, membership\
    \ and iteration).\n\nWe can find built-in functions also for tuples:\n\n*   cmp(tuple1,\
    \ tuple2) → Compares elements of both tuples.\n\n*   len(tuple) → Gives the total\
    \ length of the tuple.\n\n*   max(tuple) → Returns item from the tuple with max\
    \ value.\n\n*   min(tuple) → Returns item from the tuple with\n\n*   min value\
    \ tuple(seq) → Converts a list into tuple.\n\n6.Sets\n\nA set is a type of data\
    \ that allows us to handle groups of elements. It creates a collection of unordered\
    \ and unique elements. Set objects also support mathematical operations like union,\
    \ intersection, difference, and symmetric difference.\n\nLet’s see an example:\n\
    \na = set ('example')\n\nb = set ('exile')\n\n*                   a\n\n{ 'e',\
    \ 'x', 'a', 'm', 'p', 'l'}\n\nAs you can see, this set is missing the last “e”,\
    \ and that is because, as we said before, sets only contain unique elements.\n\
    \nBut let’s continue with our example:\n\n*                   a – b (with this\
    \ function, we can build a set formed only by the letters in a but not the letters\
    \ in b)\n\n{ 'a', 'm', 'p'}\n\n*                   a | b (it takes the letters\
    \ in a and in b)\n\n{ 'e', 'x', 'a', 'm', 'p', 'l', 'i'}\n\n*                  \
    \ a & b (it takes the letters contained in both a and b)\n\n { 'e', 'x', 'l'}\n\
    \n*                   a ^ b (it takes the letters in a or in b but not in both)\n\
    \n{ 'a', 'm', 'p', 'I'}\n\nSets don't support indexing and slicing\n\nIn order\
    \ to add elements, we will have to use the add() command for a single element\
    \ and the update() command for multiple elements.\n\nIn order to remove elements,\
    \ we will have to use discard() or remove(), whereas if we need to remove all\
    \ the elements in the set, we can use clear().\n\n Sets are useful to carry out\
    \ mathematical operations. Let's see an example:\n\nA = {1, 2, 3, 4, 5}\n\nB =\
    \ {4, 5, 6, 7, 8}\n\nNow, there are 4 possible operations: union, intersection,\
    \ difference, and symmetric difference. Let's see them in action:\n\n1.            \
    \ Union: For this operation, we can use | operator or the method union()\n\n\\\
    # initialize A and B  \n\nA = {1, 2, 3, 4, 5}  \n\nB = {4, 5, 6, 7, 8}  \n\n\\\
    # use | operator  \n\n\\# Output: {1, 2, 3, 4, 5, 6, 7, 8}  \n\nprint(A | B)\n\
    \n2.             Intersection: This operation will include the elements that are\
    \ common in both sets, and we will use the method intersection():\n\n\\# initialize\
    \ A and B  \n\nA = {1, 2, 3, 4, 5}  \n\nB = {4, 5, 6, 7, 8}  \n\n\\# use & operator\
    \  \n\n\\# Output: {4, 5}  \n\nprint(A & B)\n\n3.             Difference: With\
    \ this operation, we can have the elements that appear in A but not in B or vice\
    \ versa. It is performed using the method difference ():\n\n\\# initialize A and\
    \ B  \n\nA = {1, 2, 3, 4, 5}  \n\nB = {4, 5, 6, 7, 8}  \n\n\\# use - operator\
    \ on A  \n\n\\# Output: {1, 2, 3}  \n\nprint(A – B)\n\n4.              Symmetric\
    \ difference: This operation allows us to take the elements in both A and B, leaving\
    \ aside those that appear in both. It is done through the method symmetric\\_difference():\n\
    \n\\# initialize A and B  \n\nA = {1, 2, 3, 4, 5}  \n\nB = {4, 5, 6, 7, 8}  \n\
    \n\\# use ^ operator  \n\n\\# Output: {1, 2, 3, 6, 7, 8}  \n\nprint(A ^ B)\n\n\
    In Python, we can find a list of built-in methods for sets. I will list the most\
    \ useful:\n\n*   add() → Add an element to a set\n\n*   clear() → Remove all elements\
    \ from a set\n\n*   copy() → Return a shallow copy of a set\n\n*   difference()\
    \ → Return the difference of two or more sets as a new set\n\n*   difference\\\
    _update() → Remove all elements of another set from this set\n\n*   discard()\
    \ → Remove an element from set if it is a member. (Do nothing if the element is\
    \ not in set)\n\n*   intersection() → Return the intersection of two sets as a\
    \ new set\n\n*   intersection\\_update() → Update the set with the intersection\
    \ of itself and another\n\n*   isdisjoint() → Return True if two sets have a null\
    \ intersection\n\n*   issubset() → Return True if another set contains this set\n\
    \n*   issuperset() → Return True if this set contains another set\n\n*   pop()\
    \ → Remove and return an arbitary set element. Raise KeyError if the set is empty\n\
    \n*   remove() → Remove an element from a set. If the element is not a member,\
    \ raise a KeyError\n\n*    symmetric\\_difference() → Return the symmetric difference\
    \ of two sets as a new set\n\n*    symmetric\\_difference\\_update() → Update\
    \ a set with the symmetric difference of itself and another\n\n*   union() → Return\
    \ the union of sets in a new set\n\n*   update() → Update a set with the union\
    \ of itself and others\n\n*   In Python, we can also find a list of built-in functions:\n\
    \n*   all() Return True if all elements of the set are true (or if the set is\
    \ empty).\n\n*   any() Return True if any element of the set is true. If the set\
    \ is empty, return False.\n\n*   enumerate() Return an enumerate object. It contains\
    \ the index and value of all the items of set as a pair.\n\n*   len() Return the\
    \ length (the number of items) in the set. max() Return the largest item in the\
    \ set.\n\n*   min() Return the smallest item in the set.\n\n*   sorted() Return\
    \ a new sorted list from elements in the set(does not sort the set itself).\n\n\
    *   sum() Retrun the sum of all elements in the set.\n\n7.dictionaries\n\nPython\
    \ has a built-in function, called the dictionary, which massively simplifies our\
    \ work.\n\nThe dictionary is a set of keys, and we can extract the set of values\
    \ given by it.\n\nIn order to build a dictionary, we can utilize the constructor\
    \ dict(). Let’s see it in action:\n\nrooms = dict ()\n\nrooms\\[ 'guest1' \\]\
    \ = '101'\n\nrooms \\[ 'guest2' \\] = '102'\n\nThe dictionary we just built will\
