    \ 调用内置帮助系统\n- `hex()`: 将整数转换为十六进制\n- `hash()`: 返回对象的哈希值\n- `input()`: 读取并返回一行字符串\n\
    - `id()`: 对象的标识符\n- `isinstance()`: 检查对象是否为类的实例\n- `int()`: 从数字或字符串返回整数\n- `issubclass()`:\
    \ 检查对象是否为类的子类\n- `iter()`: 返回对象的迭代器\n- `list()`: 在 Python 中创建列表\n- `locals()`:\
    \ 返回当前符号表的字典\n- `len()`: 返回对象的长度\n- `max()`: 返回最大的元素\n- `min()`: 返回最小的元素\n- `map()`:\
    \ 应用函数并返回列表\n- `next()`: 从迭代器中获取下一个元素\n- `memoryview()`: 返回参数的内存视图\n- `object()`:\
    \ 创建一个无特征的对象\n- `oct()`: 将整数转换为八进制\n- `ord()`: 返回 Unicode 字符的 Unicode 码点\n- `open()`:\
    \ 返回文件对象\n- `pow()`: 返回 x 的 y 次\n- `print()`: 打印给定对象\n- `property()`: 返回一个属性属性\n\
