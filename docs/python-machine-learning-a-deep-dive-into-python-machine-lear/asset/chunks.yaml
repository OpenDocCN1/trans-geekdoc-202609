    \ class operator:\n\n### Defining a class\n```python\nclass class_name:\n    [statement\
    \ 1]\n    [statement 2]\n    [statement 3]\n    [etc.]\n```\n\nNow, we've created\
    \ a new local namespace where we can define the attributes of the given class;\
    \ attributes are data or functions. We can access data and functions through the\
    \ class objects that were automatically created when we created our class. In\
    \ order to access attributes and to add new objects of a class, we have to use\
    \ this class object.\n\nFinally, we can create an object. The procedure is straight\
    \ forward as usual:\n```python\nob = MyClass()\n```\nWe just created a new instance\
    \ object that we named `ob`.\n\nObjects and attributes can be easily deleted using\
    \ the `del` statement. Let's see an example:\n```python\nc1 = ComplexNumber(1,3)\n\
    del c1\nc1\n```\n\nClasses include methods. A method is basically a function that\
    \ takes a class instance as its first parameter. Let's make an example:\n\n```python\n\
    class movies:\n    \"sub categories of movies\"\n    def __init__(self, horror=0,\
    \ thriller=0, drama=0):\n        self.horror = horror\n        self.thriller =\
    \ thriller\n        self.drama = drama\n```\n\n# CHAPTER FOURTEEN: WHAT CAUSES\
    \ FATAL ERRORS AND HOW TO FIX IT\n\nIf you encounter fatal exception errors whenever\
    \ you use your PC, then you are probably wondering why it happens and what causes\
    \ them. Basically, the fatal exception is an error message that many PC users\
    \ encounter as they use their computers. This particular error will indicate that\
    \ the program you are running and the one that caused the error will need to be\
    \ closed. The fatal exception error simply means the exception cannot be handled\
    \ in order for the program to continue running.\n\nYou have to understand that\
    \ software programs need to communicate with the operating system through layers\
    \ of codes. When the operating system encounters an invalid code or an illegal\
    \ software instruction, it will result in the fatal exception error. Generally,\
    \ fatal exception errors are caused by instability of programs. It can also be\
    \ caused by improperly written programs, as well as hardware related issues such\
    \ as overwriting of specific hardware. There are lot of causes for fatal errors.\
    \ First is by disabling programs that cause conflict between programs that are\
    \ loaded and the programs you running. You might also want to delete temporary\
    \ files, as this is common cause for fatal exception. Defragmenting the hard drive\
    \ as well will prevent corruption.\n\n# CHAPTER FIFTEEN: BEST PRACTICES FOR HANDLING\
    \ ERRORS\n\nThis chapter explains the processes of implementing error handling\
    \ for a website that uses server-side scripting. Proper error handling is necessary\
    \ to ensure that users of website have a good experience during their visit. Every\
    \ website should be tested on a staging server before being deployed on the live\
    \ server. However, it is not always possible to anticipate every possible error\
    \ and good error.\n\nWhen talking about website errors, there are two different\
    \ types we need to talk about:\n1. Fatal errors cause the execution of the script\
    \ to halt and a page error (HTTP status 500) to be reported to the user.\n2. An\
    \ exception is an error thrown by a server-side script that may be captured through\
    \ scripting and allow the web page to be displayed. An example of this kind of\
    \ exception is a database query, which causes an exception but doesn't abort execution\
    \ of the current script.\n\n### Building a Code Library\nIn order to provide consistent\
    \ error handling throughout a website, a shared code module should be created\
    \ that provides the majority of error handling details. The goal here is not to\
    \ repeat code so that everything is handled in one central location. That way,\
    \ any changes or modifications that need to be made to the code only have to be\
    \ done once. A good error handling library will contain methods for displaying\
    \ a friendly message to the visitor and collecting all the debugging information\
    \ needed for technical support.\n\nEvery programming language is different, so\
    \ it will be up to the developer to decide how to implement the error handling.\
    \ The goal should be to make it flexible and intuitive, so it can be used in many\
    \ different scenarios. It should only require a minimal amount of code to wrap\
    \ a section of scripting code with error handling.\n\n### Displaying Friendly\
    \ Messages\nThere are various options for displaying friendly error messages to\
    \ the user. One option is to stop processing of the entire page and display an\
    \ error that reads \"Sorry, this web page cannot be displayed at this time due\
    \ to an internal issue. Our technical support team has been notified and will\
    \ work quickly to resolve this issue.\" This is often the best way to handle any\
    \ unexpected errors that we can handle through server-side scripting.\n"
  trans: "\n\n`Fact` 函数只接受一个参数，命名为“n”。返回指令用于结束函数并返回正确的数字。\n\n正如你在上一个示例所示，我们可以发现：\n\
    * 关键字 `def` 后面跟着函数名\n* 一个参数 (`n`)\n* 使用冒号 (`:`) 来标记函数的结束\n* 在相同的缩进层级下，我们编写另一个有效语句来创建函数体\n\
    * 最后用一个 `return` 语句来退出函数。\n\n```python\nDef functionname( parameters ):\n    \"\
    function_docstring\"\n\n    Function_suite\n        Return [expression]\n```\n\
    \n### Docstring（文档字符串）\n文档字符串（docstring）用于解释该函数的功能。它是可选的，但有时你可能需要记录你正在编写的内容。\n\
    \n### Return（返回）\n`return` 语句用于退出函数并将一个值返回给其调用者（`print` 命令只产生文本）。当函数在没有 `return`\
    \ 语句的情况下结束时，它等同于 `return None`。\n\n### Python 中的函数是如何工作的？\n![](img/00011.jpeg)\n\
    \n通过函数，你可以：\n* 定义函数\n* 调用函数\n\n### 如何定义函数\n你可以像之前所示使用关键字 `def` 轻松地定义函数来声明函数。随后，程序员将向函数添加参数（括号内）以及向函数本身添加要执行的语句。最后，插入\
    \ `return` 语句以退出函数。\n\n### 调用函数\n“调用函数意味着什么”\n调用函数是执行你所定义的函数的过程。你可以从 Python 提示符调用函数，也可以通过其他函数调用函数。\n\
    \n### return 语句\n在上节中，你已经见过了 `return` 语句。基本上，它会返回某些内容或对函数调用者回复。\n\n以下所有函数 `[F1,\
    \ F2, F3]` 都将返回 `None`：\n\n```python\ndef f1():\n    pass\n\ndef f2():\n    return\n\
    \ndef f3():\n    return None\n```\n\n我们可以在 IDLE 中验证它：\n```python\n>>> print f1(),\
    \ f2(), f3()\nNone None None\n>>>\n```\n\n# 第十三章：类\n\n现在我们已经看了数据类型、语法和函数，我们将合并它们来学习在\
    \ Python 中创建新类。\n\n首先，我们应该定义什么是类，以及什么是对象：\n对象是将变量和函数封装成单个实体的实体。类是一个你可以用来创建对象的模板。类为对象提供了变量和函数。我们可以说类是创建对象的蓝图。\n\
    \n所以，让我们通过创建我们的第一个类来进入这一主题吧！首先，我们必须使用类运算符定义一个类：\n\n### 定义类\n```python\nclass class_name:\n\
    \    [statement 1]\n    [statement 2]\n    [statement 3]\n    [等等]\n```\n\n现在，我们创建了一个新的本地命名空间，我们可以在其中定义给定类的属性；属性是数据或函数。我们可以通过在创建类时自动创建类对象来访问数据和函数。为了访问属性并为类添加新对象，我们必须使用这个类对象。\n\
    \n最后，我们可以创建一个对象。过程像往常一样直观：\n```python\nob = MyClass()\n```\n我们刚刚创建了一个命名为 `ob`\
    \ 的新实例对象。\n\n可以使用 `del` 语句轻松地删除对象和属性。让我们来看一个例子：\n```python\nc1 = ComplexNumber(1,3)\n\
    del c1\nc1\n```\n\n类包含方法。方法基本上是一个以类实例作为第一个参数的函数。让我们举个例：\n\n```python\nclass movies:\n\
    \    \"电影子类型\"\n    def __init__(self, horror=0, thriller=0, drama=0):\n     \
    \   self.horror = horror\n        self.thriller = thriller\n        self.drama\
    \ = drama\n```\n\n# 第十四章：什么会导致致命错误以及如何修复\n\n如果你在使用 PC 时随时遇到致命异常错误（fatal exception\
    \ errors），那么你可能在好奇为什么发生这种情况以及其原因是什么。基本上，致命异常是许多 PC 用户在使用电脑时遇到的一种错误消息。这种特定错误将指示你正在运行的程序以及导致错误的程序需要关闭。致命异常错误简单意味着无法处理异常以便程序继续运行。\n\
    \n你必须理解，软件程序需要通过层层代码与操作系统通信。当操作系统遇到无效代码或非法软件指令时，就会导致致命异常错误。通常，致命异常错误是由程序不稳定引起的。它可能由编写不当的程序以及硬件相关问题（如特定硬件的覆盖）引起。致命错误有很多原因。首先是禁用导致加载程序与正在运行程序之间产生冲突的程序。你可能还想删除临时文件，因为这是致命异常的常见原因。对硬盘进行碎片整理也可以防止损坏。\n\
    \n# 第五章：错误处理的最佳实践\n\n本章解释了为使用服务器端脚本的网站实现错误处理的过程。适当的错误处理对于确保网站用户在访问期间良好良好的是必要的。每个网站在部署到正式服务器之前都应该在测试服务器上进行测试。然而，并不总是能够预测每一个可能的错误和良好的错误。\n\
    \n谈论网站错误时，有两种我们需要讨论的不同类型：\n1. 致命错误（Fatal errors）会导致脚本执行停止并向用户报告页面错误（HTTP 状态 500）。\n\
    2. 异常（Exception）是服务器端脚本抛出的错误，可以通过脚本捕获并允许网页显示。这种异常的一个例子是数据库查询，它会导致异常但不会中止当前脚本的执行。\n\
    \n### 构建代码库\n为了整个网站提供一致的错误处理，应该创建一个共享代码模块，提供大部分错误处理细节。这里的目标不是重复代码，以便在一个集中位置进行处理。这样，对代码进行的任何更改或修改只需执行一次。良好的错误处理库将包含向访问者显示友好消息以及收集技术支持所需的所有调试信息的方法。\n\
    \n每种编程语言都是不同的，因此将由开发者决定如何实现错误处理。目标应该是使其灵活且符合直觉，以便在许多不同的场景中使用。它只需要极少的代码将部分脚本代码封装在错误处理中。\n\
    \n### 显示友好消息\n对于向用户显示友好错误消息有多种方案。其中一种方案是停止整个页面的处理，并显示一条信息：“抱歉，由于内部问题，目前无法显示此网页。我们的技术支持团队已收到通知并将尽快解决此问题。”这通常是处理我们能够通过服务器端脚本处理的任何意外错误的最佳方式。\n\
    \n"
