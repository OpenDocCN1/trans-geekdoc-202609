    ```python\nlist = [2, 6 , 12]\nlist\n```\n\n让我们运行该命令，结果如下：\n\n```python\n2, 6,\
    \ 12\n```\n\n为了使用列表中的值，我们可以使用方括号。这里有一个示例：\n\n```python\nlist1 = ['math', 'history',\
