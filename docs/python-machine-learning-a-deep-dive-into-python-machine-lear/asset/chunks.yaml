  fmt: "\nThe indentation is one of the most characterizing syntactic elements of\
    \ Python.\n\nLet’s see a classic example:\n\n```python\ndef perm(l):\n    # Compute\
    \ the list of all permutations of l\n    if len(l) <= 1:\n        return [l]\n\
    \    r = []\n    for i in range(len(l)):\n        s = l[:i] + l[i+1:]\n      \
    \  p = perm(s)\n        for x in p:\n            r.append(l[i:i+1] + x)\n    return\
    \ r\n```\n\nAs you can see, it is easy to see where the code ends and where the\
    \ following code line starts.\n\nThe indentation is used to indicate a block of\
    \ code. Obviously you must indent each block with the same amount of spaces. In\
    \ Python, we use indentations to indicate to what block a particular string of\
    \ code belongs.\n\nAnother great feature is that the universal block closing rules\
    \ are universal, so we do not need to specify `end`, `endif`, `fi`, parentheses\
    \ or brackets, `wend`, `endwhile`, `next`, `loop`, `end procedure` or `end function`.\n\
    \nWe only need to respect the indentation.\n\n## The IF statement\n\nWhat is a\
    \ Control Flow Statement? It’s a feature that allows the program to take decisions,\
    \ depending on the situation, reading the code in a particular order. We can control\
    \ the statement execution using some control flow tools.\n\nThe `IF` instruction\
    \ is probably the most used command among all programming languages.\n\nWe can\
    \ use `IF` to check a condition.\n\nHere is an example of how `IF` works:\n\n\
    ![](images/00008.gif)\n\nWe run a block of statement only if the condition `IF`\
    \ is true; otherwise, we operate another statement.\n\nExample of `IF` statement\
    \ syntax:\n\n```python\nx = int(input(\"Please enter an integer: \"))\nPlease\
    \ enter an integer: 42\nif x < 0:\n    x = 0\n    print('Negative changed to zero')\n\
    elif x == 0:\n    print('Zero')\nelif x == 1:\n    print ('Single')\nelse:\n \
    \   print('more')\n```\n\n### More\n\nWe can observe `:` that we used to end the\
    \ test that controls the program flow.\n\nYou can insert as many `Elif` as you\
    \ need; in the example above, the last `Elif` is not obligatory.\n\n## The FOR\
    \ statement\n\nThe `For` instruction allows us to define iterations. To decide\
    \ how many iterations we need and on which element we have to perform the iteration,\
    \ we must use any object we can consider sequence.\n\nTraditionally used to repeat\
    \ a string of code an exact number of times.\n\nWe have already seen many sequence\
    \ examples: lists, tuple, strings. These are all data we can use to iterate with\
    \ `For`:\n\n```python\nfor c in \"abc\":\n    print c\n```\n>>>\n\nHow can we\
    \ execute a simple iteration a certain number of times without having the right\
    \ sequence? We could use `range`:\n\n```python\nfor n in range (4):\n    print\
    \ n\n```\n>>>\n\nWith the command `range`, we can also choose the start and the\
    \ end of an iteration. \n\n`For` allows us also to execute a cycle on more variables\
    \ at the same time. This is possible due to the fact that the `items` method in\
    \ a dictionary gives a list of tuples composed by their key and value. `For` establishes\
    \ a cycle on every element in this list and gives to key and value the values\
    \ we have in each tuple.\n\n## The WHILE statement\n\nThe `While` instruction\
    \ is similar to the `For` instruction. The only difference is that the iteration\
    \ is not based on a fixed sequence but executes the operation as long as the given\
    \ condition is true.\n\nHere is an example of how `While` works:\n\n![](images/00009.jpeg)\n\
    \n```python\nx = 1\nwhile x < 7:\n    print x\n    x += 1\n```\n>>>\n\nIn the\
    \ example above (the increment statement), is executed until count remains below\
    \ 7. If a condition remains True, we have so \"Infinite Loop\". In that case,\
    \ you should press `CTRL + C` to close the program.\n\n### The Break and Continue\n\
    \n`Break` and `Continue` are used to stop an iteration or pass to the next.\n\n\
    ![](images/0010.jpeg)\n\nYou will often use `Break` in `for` loop and `while`\
    \ loop as these classic examples:\n\n```python\nfor var in sequence:\n    if condition:\n\
    \        Break\n```\n\n```python\nwhile test expression:\n    if condition:\n\
    \        Break\n```\n\nNow that we have gotten in touch with `break` and `continue`,\
    \ let’s step back to `for` and `while` because they have another peculiarity,\
    \ the instruction: `Else`. It was an `If` clause, but `else` is also very useful\
    \ with cycles due to the fact that all the instructions we write in `else` will\
    \ be executed at the cycle end (if we do not end the cycle first with a `break`).\n\
    \nExample of if – else:\n\n```python\nNum = 8\nif num >= 5:\n    print(\"positive\
    \ or zero\")\nelse:\n    print(\"negative number\")\n```\n>>>\n\nWith this program,\
    \ you can check if the number is positive, negative, or zero.\n\n## CHAPTER TWELVE:\
    \ FUNCTIONS\n\nWhat is a function? It is a block of code used to perform a specific\
    \ task. Through Functions, we can break our program. This allows us to have better\
    \ modularity in favor of organization and better usability. We usually come across\
    \ 3 different types of functions in Python:\n\n1. User-Defined Functions; functions\
    \ created by the user.\n2. Built-in Functions; (list below)\n3. Anonymous Functions;\
    \ also known as Lambda Functions, are created in Python using a construction called\
    \ `lambda`.\n\nHere is a list of: Built-in Functions\n\n| Function | Description\
    \ |\n| :--- | :--- |\n| [`abs()](https://www.programiz.com/python-programming/methods/built-in/abs)\
    \ | returns absolute value of a number |\n| [`any()](https://www.programiz.com/python-programming/methods/built-in/any)\
    \ | Checks if any Element of an Iterable is True |\n| `all()](https://www.programiz.com/python-programming/methods/built-in/all)\
    \ | returns true when all elements in iterable is true |\n| `ascii()](https://www.programiz.com/python-programming/methods/built-in/ascii)\
    \ | Returns String Containing Printable Representation |\n| `bin()](https://www.programiz.com/python-programming/methods/built-in/bin)\
    \ | converts integer to binary string |\n| `bool()](https://www.programiz.com/python-programming/methods/built-in/bool)\
    \ | Coverts a Value to Boolean |\n| [`bytearray()](https://www.programiz.com/python-programming/methods/built-in/bytearray)\
    \ | returns array of given byte size |\n| [`callable()](https://www.programiz.com/python-programming/methods/built-in/callable)\
    \ | Checks if the Object is Callable |\n| [`bytes()](https://www.programiz.com/python-programming/methods/built-in/bytes)\
    \ | returns immutable bytes |\n| `chr()](https://www.programiz.com/python-programming/methods/built-in/chr)\
    \ | Returns a Character (a string) from an Integer |\n| `compile()](https://www.programiz.com/python-programming/methods/built-in/compile)\
    \ | Returns a code object |\n| `classmethod()](https://www.programiz.com/python-programming/methods/built-in/classmethod)\
    \ | returns class method for given function |\n| `complex()](https://www.programiz.com/python-programming/methods/built-in/complex)\
    \ | Creates a Complex Number |\n| `delattr()](https://www.programiz.com/python-programming/methods/built-in/delattr)\
    \ | Deletes Attribute from the Object |\n| `dict()](https://www.programiz.com/python-programming/methods/built-in/dict)\
    \ | Creates a Dictionary |\n| `dir()](https://www.programiz.com/python-programming/methods/built-in/dir)\
    \ | Tries to Return Attributes of Object |\n| `divmod()](https://www.programiz.com/python-programming/methods/built-in/divmod)\
    \ | Returns a Tuple of Quotient and Remainder |\n| `enumerate()](https://www.programiz.com/python-programming/methods/built-in/enumerate)\
    \ | Returns an Enumerate Object |\n"
  trans: "\n\n缩进是 Python 最具特征的语法元素之一。\n\n来看一个经典的例子：\n\n```python\ndef perm(l):\n \
    \   # 计算 l 的所有排列列表\n    if len(l) <= 1:\n        return [l]\n    r = []\n    for\
    \ i in range(len(l)):\n        s = l[:i] + l[i+1:]\n        p = perm(s)\n    \
    \    for x in p:\n            r.append(l[i:i+1] + x)\n    return r\n```\n\n如你所见，很容易看出代码在何时结束以及下一行代码从哪里开始。\n\
    \n缩进用于指示代码块。显然，你必须对每个块使用相同数量的空格进行缩进。在 Python 中，我们使用缩进来指示特定的代码字符串属于哪个块。\n\n另一个大特性是，通用的块结束规则是通用的，因此我们不需要指定\
    \ `end`、`endif`、`fi`、括号或方、`wend`、`endwhile`、`next`、`loop`、`end procedure` 或 `end\
    \ function`。\n\n我们只需要遵守缩进。\n\n## IF 语句\n\n什么是控制流语句？它是一种允许程序根据情况做出决策并按照特定顺序读取代码的功能。我们可以使用一些控制流工具来控制语句的执行。\n\
    \n`IF` 指令可能是所有编程语言中最常用的命令。\n\n我们可以使用 `IF` 来检查一个条件。\n\n这里是 `IF` 如何工作的示例：\n\n![](img/00008.gif)\n\
    \n只有当 `IF` 条件为真时，我们才执行语句块；否则，执行另一个语句。\n\n`IF` 语句语法示例：\n\n```python\nx = int(input(\"\
    Please enter an integer: \"))\nPlease enter an integer: 42\nif x < 0:\n    x =\
    \ 0\n    print('Negative changed to zero')\nelif x == 0:\n    print('Zero')\n\
    elif x == 1:\n    print ('Single')\nelse:\n    print('more')\n```\n\n### 更多\n\n\
    我们可以观察到 `:`，我们用它结束控制程序流的测试。\n\n你可以根据需要插入任意数量的 `Elif`；在上面的示例中，最后一个 `elif` 不是强制性的。\n\
    \n## FOR 语句\n\n`For` 指令允许我们定义迭代。为了决定需要多少次迭代以及在哪个元素上执行迭代，我们必须使用任何可以视为序列的对象。\n\n\
    传统上用于精确地重复某段代码。\n\n我们已经看到了许多序列示例：列表、元组、字符串。这些都是我们可以用 `For` 进行迭代的数据类型：\n\n```python\n\
    for c in \"abc\":\n    print c\n```\n>>>\n\n在没有相应序列的情况下，我们如何执行特定次数的简单迭代呢？我们可以使用\
    \ `range`：\n\n```python\nfor n in range (4):\n    print n\n```\n>>>\n\n通过 `range`\
    \ 命令，我们还可以选择迭代的开始和结束。\n\n`For` 还允许我们同时在更多变量上执行循环。这是因为由于字典中的 `items` 方法会给出一个由其键和值组成的元组列表。`For`\
    \ 在此列表的每个元素上建立循环，并将每个元组中的值赋给键和值。\n\n## WHILE 语句\n\n`While` 指令与 `For` 指令相似。唯一的区别是迭代不是基于固定序列，而是只要给定条件为真就一直执行操作。\n\
    \n这里是 `While` 如何工作的示例：\n\n![](img/00009.jpeg)\n\n```python\nx = 1\nwhile x < 7:\n\
    \    print x\n    x += 1\n```\n>>>\n\n在上面的示例中（递增语句），将执行直到计数保持在 7 以下。如果条件一直保持为真，我们就有了所谓的“死循环”。在这种情况下，你应该按下\
    \ `CTRL + C` 来关闭程序。\n\n### Break 和 Continue\n\n`Break` 和 `Continue` 用于停止迭代或跳转到下一个。\n\
    \n![](img/0010.jpeg)\n\n你经常会在 `for` 循环和 `while` 循环中使用 `Break`，就像这些经典示例：\n\n```python\n\
    for var in sequence:\n    if condition:\n        Break\n```\n\n```python\nwhile\
    \ test expression:\n    if condition:\n        Break\n```\n\n既然我们已经接触了 `break`\
    \ 和 `continue`，让我们回到 `for` 和 `while`，因为它们还有另一个特性，指令：`Else`。它是一个 `If` 子句，但 `else`\
    \ 在循环中也非常有用，因为我们在 `else` 中编写的所有指令将在循环结束时执行（前提是我们没有先用 `break` 结束循环）。\n\nif – else\
    \ 示例：\n\n```python\nNum = 8\nif num >= 5:\n    print(\"positive or zero\")\nelse:\n\
    \    print(\"negative number\")\n```\n>>>\n\n通过这个程序，你可以检查数字是正数、负数还是零。\n\n## 第十二章：函数\n\
    \n什么是函数？它是用于执行特定任务的代码块。通过函数，我们可以拆分程序。这允许我们获得更好的模块化，有利于组织和提高用性。我们通常在 Python 中遇到三种类型的函数：\n\
    \n1. 用户定义函数；由用户创建的函数。\n2. 内置函数；下\n3. 匿名函数；也称为 Lambda 函数，使用 `lambda` 结构创建。\n\n\
    以下是内置函数列表：\n\n| 函数 | 描述 |\n| :--- | :--- |\n| [`abs()](https://www.programiz.com/python-programming/methods/built-in/abs)\
    \ | 返回数字的绝对值 |\n| [`any()](https://www.programiz.com/python-programming/methods/built-in/any)\
    \ | 检查可迭代对象中是否有元素为真 |\n| [`all()](https://www.programiz.com/python-programming/methods/built-in/all)\
    \ | 当可迭代对象中所有元素都为真时返回真 |\n| [`ascii()](https://www.programiz.com/python-programming/methods/built-in/ascii)\
    \ | 返回可打印的表示 |\n| [`bin()](https://www.programiz.com/python-programming/methods/built-in/bin)\
    \ | 将整数转换为二进制字符串 |\n| [`bool()](https://www.programiz.com/python-programming/methods/built-in/bool)\
    \ | 将值转换为布尔值 |\n| [`bytearray()](https://www.programiz.com/python-programming/methods/built-in/bytearray)\
    \ | 返回指定大小字节数组 |\n| [`callable()](https://www.programiz.com/python-programming/methods/built-in/callable)\
    \ | 检查对象是否可调用 |\n| [`bytes()](https://www.programiz.com/python-programming/methods/built-in/bytes)\
    \ | 返回不可变的字节 |\n| [`chr()](https://www.programiz.com/python-programming/methods/built-in/chr)\
    \ | 从整数返回字符（字符串） |\n| [`compile()](https://www.programiz.com/python-programming/methods/built-in/compile)\
    \ | 返回代码对象 |\n| [`classmethod()](https://www.programiz.com/python-programming/methods/built-in/classmethod)\
    \ | 为给定函数返回类方法 |\n| [`complex()](https://www.programiz.com/python-programming/methods/built-in/complex)\
    \ | 创建复数 |\n| [`delattr()](https://www.programiz.com/python-programming/methods/built-in/delattr)\
    \ | 从对象中删除属性 |\n\n"
