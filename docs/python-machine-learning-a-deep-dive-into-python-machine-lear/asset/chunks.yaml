    Tuples, just like lists, respond to any general operation, like those we have
    seen in the chapter regarding lists (length, concatenation, repetition, membership
    and iteration).


    We can find built-in functions also for tuples:


    - `cmp(tuple1, tuple2)` → Compares elements of both tuples.

    - `len(tuple)` → Gives the total length of the tuple.

    - `max(tuple)` → Returns item from the tuple with max value.

    - `min(tuple)` → Returns item from the tuple with min value.

    - `tuple(seq)` → Converts a list into tuple.


    # 6.Sets


    A set is a type of data that allows us to handle groups of elements. It creates
    a collection of unordered and unique elements. Set objects also support mathematical
    operations like union, intersection, difference, and symmetric difference.


    Let’s see an example:


    ```python

    a = set (''example'')

    b = set (''exile'')

    ```


    - `a`

    `{''e'', ''x'', ''a'', ''m'', ''p'', ''l''}`


    As you can see, this set is missing the last “e”, and that is because, as we said
    before, sets only contain unique elements.


    But let’s continue with our example:


    - `a – b` (with this function, we can build a set formed only by the letters in
    `a` but not the letters in `b`)

    `{''a'', ''m'', ''p''}`

    - `a | b` (it takes the letters in `a` and in `b`)

    `{''e'', ''x'', ''a'', ''m'', ''p'', ''l'', ''i''}`

    - `a & b` (it takes the letters contained in both `a` and `b`)

    `{''e'', ''x'', ''l''}`

    - `a ^ b` (it takes the letters in `a` or in `b` but not in both)

    `{''a'', ''m'', ''p'', ''i''}`


    Sets don''t support indexing and slicing


    In order to add elements, we will have to use the `add()` command for a single
    element and the `update()` command for multiple elements.


    In order to remove elements, we will have to use `discard()` or `remove()`, whereas
    if we need to remove all the elements in the set, we can use `clear()`.


    Sets are useful to carry out mathematical operations. Let''s see an example:


    ```python

    A = {1, 2, 3, 4, 5}

    B = {4, 5, 6, 7, 8}

    ```


    Now, there are 4 possible operations: union, intersection, difference, and symmetric
    difference. Let''s see them in action:


    1. **Union**: For this operation, we can use `|` operator or the method `union()`

    ```python

    A = {1, 2, 3, 4, 5}

    B = {4, 5, 6, 7, 8}

    print(A | B)

    # Output: {1, 2, 3, 4, 5, 6, 7, 8}

    ```


    2. **Intersection**: This operation will include the elements that are common
    in both sets, and we will use the `intersection()`

    ```python

    A = {1, 2, 3, 4, 5}

    B = {4, 5, 6, 7, 8}

    print(A & B)

    # Output: {4, 5}

    ```


    3. **Difference**: With this operation, we can have the elements that appear in
    `A` but not `B` or vice versa. It is performed using the `difference()`

    ```python

    A = {1, 2, 3, 4, 5}

    B = {4, 5, 6, 7, 8}

    print(A - B)

    # Output: {1, 2, 3}

    ```


    4. **Symmetric difference**: This operation allows us to take the elements in
    both `A` and `B`, leaving aside those that appear in both. It is done through
    the method `symmetric_difference()`

    ```python

    A = {1, 2, 3, 4, 5}

    B = {4, 5, 6, 7, 8}

    print(A ^ B)

    # Output: {1, 2, 3, 6, 7, 8}

    ```


    In Python, we can find a list of built-in methods for sets. I will list the most
    useful:


    - `add()` → Add an element to a set

    - `clear()` → Remove all elements from a set

    - `copy()` → Return a shallow copy of a set

    - `difference()` → Return the difference of two or more sets as a new set

    - `difference_update()` → Remove all elements of another set from this set

    - `discard()` → Remove an element from set if it is a member. (Do nothing if the
    element is not in set)

    - `intersection()` → Return the intersection of two sets as a new set

    - `intersection_update()` → Update the set with the intersection of itself and
    another

    - `isdisjoint()` → Return True if two sets have a null intersection

    - `issubset()` → Return True if another set contains this set

    - `issuperset()` → Return True if this set contains another set

    - `pop()` → Remove and return an arbitrary set element. Raise `KeyError` if the
    set is empty

    - `remove()` → Remove an element from a set. If the element is not a member, raise
    a `KeyError`

    - `symmetric_difference()` → Return the symmetric difference of two sets as a
    new set

    - `symmetric_difference_update()` → Update a set with the symmetric difference
    of itself and another

    - `union()` → Return the union of sets in a new set

    - `update()` → Update a set with the union of itself and others


    In Python, we can also find a list of built-in functions:


    - `all()` → Return True if all elements of the set are true (or if the set is
    empty).

    - `any()` → Return True if any element of the set is true. If the set is empty,
    return `False`.

    - `enumerate()` → Return an enumerate object. It contains the index and value
    of all the items of set as a pair.

    - `len()` → Return the length (number of items) in the set.

    - `max()` → Return the largest item in the set.

    - `min()` → Return the smallest item in the set.

    - `sorted()` → Return a new sorted list from elements in the set (does not sort
    the set itself).

    - `sum()` → Return the sum of all elements in the set.


    # 7.Dictionaries


    Python has a built-in function, called the dictionary, which massively simplifies
    our work. The dictionary is a set of keys, and we can extract the set of values
    given by it.


    In order to build a dictionary, we can utilize the constructor `dict()`. Let’s
    see it in action:


    ```python

    rooms = dict()

    rooms[''guest1''] = ''101''

    rooms[''guest2''] = ''102''

    ```


    The dictionary we just built will be like this:


    ```python

    rooms

    {''guest1'': ''101'', ''guest2'': ''102''}

    ```


    We can easily extract and add new elements to our dictionary using the `keys`
    method:


    ```python

    rooms.keys()

    [''guest1'', ''guest2'']

    ```


    Other interesting functions are: `has_key` (useful to determine if an element
    is in the dictionary), `del` (useful to delete an element), `clear`, `copy`, `fromkey`,
    `get`, `items`, and so on…


    Dictionaries in Python have many built-in methods. As usual, I''ll list the most
    useful:


    - `clear()` → Remove all items from the dictionary.

    - `copy()` → Return a shallow copy of the dictionary.

    - `fromkeys(seq[, v])` → Return a new dictionary with keys from `seq` and value
    equal to `v` (defaults to `None`).

    - `get(key, d)` → Return the value of `key`. If `key` does not exist, return `d`.

    - `items()` → Return a new view of the dictionary''s items (key, value).

    - `keys()` → Return a new view of the dictionary''s keys.

    - `pop(key, d)` → Remove the item with `key` and return its value or `d` if `d`
    is not provided and `key` is not found.

    - `popitem()` → Remove and return an arbitrary item (key, value).

    - `setdefault(key, d)` → If `key` is in the dictionary, return its value. If not,
    insert `key` with a value of `d` and return `d`.

    - `update(other)` → Update the dictionary with the key/value pairs from `other`,
    overwriting existing keys.

    - `values()` → Return a new view of the dictionary''s values.


    # 8.True, false and none


    `False` and `None` are two constant objects in Python, referred to as Boolean
    values.


    Python has a built-in function `bool()` that can be used to transform any value
    to a Boolean and check if the value can be interpreted as true or false.


    Let’s see an example:


    ```python

    odd_numbers = (1, 2, 3, 4, 5, 6)

    x = 2 in odd_numbers

    x

    false


    y = 4 in even_numbers

    y

    true

    ```


    # 9.Conversions


    Python has some built-in function that allow you to convert elements. Here you
    can see how:


    - `tuple(l)` → to convert a list to a tuple

    - `list(t)` → to convert a tuple to a list

