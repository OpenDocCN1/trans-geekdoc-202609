- raw: "Such an approach, while it does utilize artificial intelligence, may sure\
    \ be critiqued by true Wall Street quants, in that it is not purely quantitative\
    \ trading. Nonetheless, we will approach the concepts and algorithms for this\
    \ book from a perspective that is designed entirely towards applying the fundamentals\
    \ of pure artificial intelligence in different types of financial markets; one\
    \ with no pure form of human, or hybrid, intervention whatsoever. The underlying\
    \ reasoning being that at the end of the day, if we can seem to create powerful\
    \ machine learning models to predict market performance on such a level, we can\
    \ maybe begin to slowly strip the general notion of emotional and irrational investment\
    \ decision making from the equation. Such decision making that has historically\
    \ been proven to fail the investment philosophy for both retail and experienced\
    \ fund managers in that during times of high market stress and turmoil. In short,\
    \ such irrational decisions have been proven to have a higher probability of playing\
    \ into many lackluster investment choices. And generally speaking, result in poor\
    \ investment outcomes. \n\nThis is something pure artificial intelligence and\
    \ machine learning attempt to resolve by completely stripping such emotional decision\
    \ making, and letting the machine make the ultimate, most rational of decisions\
    \ with the highest probability of profitability potential. And with that, let’s\
    \ jump into it! We will outline specifically a couple types of machine and deep\
    \ learning algorithms that are beginning to be commonly used in the financial\
    \ world for both retail traders, and large hedge fund managers. These algorithms\
    \ being logistical regression, and recurrent neural networks. As you will notice,\
    \ while the fundamental logic behind these algorithms are somewhat paralleled\
    \ in reasoning, the mathematical mechanics that give way to their respective decision\
    \ making process can significantly differ. For our first algorithm, we will be\
    \ applying python’s module, scikit-learn, for machine learning prediction and\
    \ trading. Further information on this library can be obtained at:\n\n[http://scikit-learn.org/stable/](http://scikit-learn.org/stable/)\n\
    \n# APPLYING LOGISTIC REGRESSION TO U.S. EQUITY MARKETS FOR PREDICTIVE TRADING\
    \ (AMZN)\n\nIn our first algorithm example, we will be applying an approach called\
    \ logistic regression to help us predict price movements for traditional stocks\
    \ within the U.S. equity markets via python. Logistic regression is a mathematical\
    \ approach that has been around for quite some time now with the fundamental understanding\
    \ behind it serving as a form of predictive analysis, in which the dependent variable\
    \ (y variable) is binary.  Generally speaking, the dependent variable should be\
    \ dichotomous in nature, with the absence of outliers. We should also be able\
    \ to exhibit no multicollinearity, in which there should be no elevated correlations\
    \ among the predictors (our x variables, or our features). From a mathematical\
    \ perspective, logistic regression estimates a multiple learning regression function\
    \ defined as:\n\n![Capture.PNG](images/00001.jpeg)\n\nOne careful thing to be\
    \ very cognizant of for logistic regression, and for all machine learning algorithms\
    \ for the most part, is the notion of overfitting. The thought behind this is\
    \ that by adding independent variables to a logistic regression model, we will\
    \ undoubtedly tend to increase the total variance explained in the predictor variable.\
    \ Nonetheless, adding too many variables to our model can result in overfitting;\
    \ something that can reduce the general foundation of the model beyond the data\
    \ that we use to fit the model. In essence, providing us with false interpretations\
    \ on how well our model fits the data in question. With that said, let’s apply\
    \ our mathematical foundation for logistic regression to the U.S. equity markets\
    \ via python. For our specific example, we will use logistic regression to help\
    \ us predict price movements for Amazon, Inc. (ticker: AMZN) one of the most valued\
    \ and respected technology companies on Wall Street for many years now. For all\
    \ purposes and intentions on our algorithms throughout the book, we will be using\
    \ python version 3.6, and Pycharm, a very popular editor/compiler for python that\
    \ allows us to run our code and generate output results. Pycharm can be downloaded\
    \ at:\n\n[https://www.jetbrains.com/pycharm/](https://www.jetbrains.com/pycharm/)\n\
    \nPlease note that the full functioning code for all of our given examples will\
    \ be included as attachments to the book as well. Upon downloading Pycharm, one\
    \ can open up a new project, which will allow for a new .py, python file. We will\
    \ first need to install all of the required libraries, or modules, our algorithm\
    \ will need to run on. These are listed at the top of our code, and look like\
    \ the following:\n\nimport numpy as np  \n\nimport pandas as pd  \n\nimport matplotlib.pyplot\
    \ as plt  \n\nimport ffn  \n\nfrom pandas\\_datareader import data as pdr  \n\n\
    import fix\\_yahoo\\_finance as yf  \n\nimport datetime  \n\nyf.pdr\\_override()\n\
    \nBefore attempting to write any code, please make sure that these modules have\
    \ all been properly installed and linked to your project directory via Pycharm.\
    \ These can best be installed generally by using Pycharm’s very own internal capabilities\
    \ to do so within the editor. Further, specific details on the install can be\
    \ found at:\n\n[https://www.jetbrains.com/help/pycharm/installing-uninstalling-and-upgrading-packages.html](https://www.jetbrains.com/help/pycharm/installing-uninstalling-and-upgrading-packages.html)\n\
    \nUpon successfully installing the libraries shown above, we will need to define\
    \ a simple classification function; which will allow our algorithm to classify\
    \ between buy and sell signals. The following function will return a 1 if the\
    \ signal for the price movement on the stock is to be a buy and a -1 if the signal\
    \ on the price movement on the stock is to be a sell. The classification function\
    \ is displayed as the following: \n\ndef computeClassification(actual):  \n\n\
        if (actual \\> 0):  \n\n        return 1  \n\n    else:  \n\n        return\
    \ \\-1\n\nThe 1 and -1 values that output from out classification function will\
    \ be a result of Amazon’s experienced daily stock returns. With that, we are now\
    \ ready to import our data, which will be done via the yahoo\\_finance library\
    \ we have installed and imported in. We must first designate a start and end date\
    \ for our logistic regression, machine learning algorithm to run off. For our\
    \ examples, we will span our start and end dates from January 1, 2010 through\
    \ October 29, 2018, in the following manner:\n\nstart \\= datetime.datetime(2010,1,1)\
    \  \n\nend \\= datetime.datetime(2018,10,29)  \n\ndf \\= pdr.get\\_data\\_yahoo('AMZN',\
    \ start\\=start, end\\=end)\n\nSimply put, we are asking yahoo\\_finance to extract\
    \ data for the ticker, AMZN, for our desired period of time, and assign it to\
    \ the variable name ‘df.’ This will subsequently store the data in a newly created\
    \ data frame by employing python’s pandas module. From here, manipulating of the\
    \ data will become much easier. The next step will be to calculate daily returns\
    \ for AMZN. We will be using the daily close price from our pandas data frame\
    \ ‘df’ in order to do this. The method for this calculation is as follows:\n\n\
    \\# calculate daily returns  \n\ndf\\['returns'\\] \\= np.log(df\\['Close'\\]\
    \ / df\\['Close'\\].shift(1))  \n\ndf\\['returns'\\].fillna(0)  \n\ndf\\['returns\\\
    _1'\\] \\= df\\['returns'\\].fillna(0)  \n\ndf\\['returns\\_2'\\] \\= df\\['returns\\\
    _1'\\].replace(\\[np.inf, \\-np.inf\\], np.nan)  \n\ndf\\['returns\\_final'\\\
    ] \\= df\\['returns\\_2'\\].fillna(0)\n\nUpon calculation of daily returns, we\
