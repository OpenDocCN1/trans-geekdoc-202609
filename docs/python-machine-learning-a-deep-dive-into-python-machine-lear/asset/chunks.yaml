    If you can’t find Python on your device, you can easily download it from the site,
    using the `.dmg` format (disk image).


    ## Source code


    We need to choose our desired version of the program from the website before beginning
    to complete the source code.


    Once you find the paragraph “All others”, you will obtain the link that recalls
    the Source code for your version (example: Python - 3.0 . tgz.).


    After we download the file, we need to extract the files in it. The `.tgz` format
    should be well-known to Linux and Mac users.


    Searching on Google for the `.tgz` and windows strings, we can get the utility
