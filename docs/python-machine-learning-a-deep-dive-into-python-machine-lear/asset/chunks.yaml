    \ 1）。\n\n矩阵中的值是可训练参数，这些参数在反向传播过程中会更新。因此，全连接层用于更改向量的维度。从数学上来说，它对你的向量应用了旋转、缩放和平移变换。简单来说，全连接层只是神经网络中普通的神经元层。每个神经元接收来自上一层所有神经元的输入，因此是稠密连接的。该层有一个权重矩阵\
