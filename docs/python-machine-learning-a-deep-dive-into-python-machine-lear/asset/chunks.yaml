  trans: "\n既然我们已经将分类函数分配给数据集的收盘收益率，现在就可以开始对逻辑回归机器学习模型进行组织工作了。这意味着我们需要决定使用数据集的百分之几来训练机器学习模型，以及使用多少百分之几来测试模型。这是机器学习中一个非常主观的方面，没有明确的对错之分。许多数据科学家喜欢等分配这些比例，而另一些人则倾向于更大幅的倾斜。对于我们的特定示例，我们将使用\
    \ 90% 的数据来训练机器学习模型，而在剩余 10% 的数据上对其结果进行前向测试。因此，采用了 90-10 的训练与测试比例。该过程通过以下代码行完成：\n\
    \n```python\n# 将上述定义的分类器应用到 'returns_final' 数据框，计算最后一列 (Y) -1 = 下跌(down), 1 =\
