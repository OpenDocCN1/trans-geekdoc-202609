    \ patience=30, min_lr=0.000001, verbose=1)` https://keras.io/callbacks/#reducelronplateau。\n\
    \n当指标停止改进时，按预定义的因子减少学习率：模型通常能从学习停滞后将学习率降低 2-10 倍中益。此回调函数监控一个数量，如果在 'patience'（耐心）指定的\
