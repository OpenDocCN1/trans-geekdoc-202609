    \ module in Python (Python has a wide variety of build-in functions that allow\
    \ the user to start its journey in programming; if the user wants to experiment\
    \ with different functions, he/she may need to import a module). If the corresponding\
    \ module is not already built in, we need to import it.\n\nLet’s see a practical\
    \ example:\n\nLet’s say that I want to import a module called “example1”.\n\n\
    I’ll run the statement for that module:\n\nImport example1\n\nAnd it’s as easy\
    \ as that.\n\n# CHAPTER NINE: LET’S DIVE IN\n\nNow, we will dive into Python,\
    \ discovering the various commands, lists, strings, and so on…\n\nIDLE\n\nYou\
    \ will find “IDLE” (Integrated Development Environment) in the main menu, and\
    \ it will allow you to edit, run, and test the codes that you will create.\n\n\
    IDLE has the following features:\n\ncoded in Python, using the [tkinter](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX) GUI\
    \ toolkit\n\ncross-platform: It has the same features whether you’re using Windows,\
    \ Unix, Mac OS X, or Linux\n\nPython shell window (interactive interpreter) with\
    \ colorizing of code input, output, and error messages\n\nmulti-window text editor\
    \ with multiple undo, Python colorizing, smart indent, call tips, auto completion,\
    \ and other features\n\nsearch within any window, replace within editor windows,\
    \ and search through multiple files (grep)\n\ndebugger with persistent breakpoints,\
    \ stepping, and viewing of global and local namespaces\n\nconfiguration, browsers,\
    \ and other dialogs\n\nIDLE has two main window types: The first one is the Shell\
    \ window, and the second is the Editor window. You can easily run multiple editor\
    \ windows at the same time. Output windows are a subtype of edit window. They\
    \ currently have the same top menu as the Editor windows but a different default\
    \ title and context menu.\n\nIDLE’s menus change dynamically based on which window\
    \ is currently selected.\n\nEach menu documented below indicates which window\
    \ type it is associated with.\n\nNow, let’s run IDLE and digit the command we\
    \ already tried.\n\nprint(\"Let’s start\")\n\nWe can see how the program processes\
    \ our command.\n\nSince we don’t want to digit the codes every time, we will now\
    \ save the source code.\n\nEDITING\n\nLet’s run the command File/New window that\
    \ we will find in the IDLE menu, and we will open a new window without the command\
    \ prompt.\n\nIn this new window, we will write our beloved code once again:\n\n\
    print(\"Let’s start\")\n\nBut this time, we click on the “file/save”, and we save\
    \ our file, naming it start.py in a directory.\n\nNow, we can run our newly created\
    \ program from IDLE with the command “run”.\n\nThere are a lot of editors available\
    \ to write Python programs. Let’s see the most famous:\n\n*                  \
    \ Eclipse with PyDev: Eclipse has a massive community of developers, and it allows\
