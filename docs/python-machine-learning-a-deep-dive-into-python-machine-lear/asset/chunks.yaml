    reason, we will keep the process explanation as short as possible.


    ## Windows


    In order to install Python on Windows, you first have to check the official site
    and click the voice download that you will find on the main menu.


    At that point, you will see a page from which you can download your desired version
    of Python.


    The process to download and install the program is very well-explained and straightforward.


    From the moment the download is complete, we can start to write our first code:


