- raw: "*                   Other good options may be: PyScripter, LeoEditor, Bluefish,\
    \ Ptk, Spyder, and Geany.\n\n# CHAPTER TEN: VARIOUS TYPES OF DATA\n\nLuckily for\
    \ us, Python has a good set of built-in functions that perform very well especially\
    \ for beginners.\n\nWe will now learn the main built-in function:\n\n1.The type\
    \ function: It returns the  datatype of any arbitrary object. The type function\
    \ can even take a variable and return it as datatype. You can use this function\
    \ to compare different types of objects.\n\nLet’s see an example:\n\nn=1\n\ntype(n)\n\
    \n<type ‘int’>\n\nS=start\n\n<type ‘str’>\n\nimport smtplib\n\ntype (smtplib)\n\
    \n<type ‘module’>\n\n2.The dir Command: The syntax of dir in the following: dir(\\\
    [object\\]), dir allows us to obtain a list of valid attributes for a given object.\n\
    \nLet’s see a practical example of how dir works:\n\nclass Person:\n\n  def \\\
    _\\_dir\\_\\_(self):\n\n    return \\['age', 'gender', 'salary'\\]\n\ncarpenter\
    \ = Person()\n\nprint(dir(carpenter))\n\nThis command will appear like this once\
    \ you run it:\n\n \\['age', 'gender', 'salary'\\]\n\n3.List: (Syntax: list(\\\
    [iterable)\\]) this command has the purpose of creating a list whose items are\
    \ the same and in the same order as iterable’s items; iterable may be either a\
    \ sequence, a container that supports iteration, or an iterator object.\n\nLet’s\
    \ now see a simple list:\n\nlist = \\[2, 6 , 12\\]\n\nlist\n\nLet's run the command,\
    \ and the result will be the following:\n\n2, 6, 12\n\nIn order to use values\
    \ in lists, we can use the square brackets. Hhere's an example:\n\nlist1 = \\\
    ['math', 'history', 1993, 1994\\];\n\nlist2 = \\[1, 2, 3, 4, 5, 6, 7 \\];\n\n\
    print \"list1\\[0\\]: \", list1\\[0\\]\n\nprint \"list2\\[1:5\\]: \", list2\\\
    [1:5\\]\n\nOnce we run it, we will have the following output:\n\nlist1\\[0\\]: \
    \ math\n\nlist2\\[1:5\\]:  \\[2, 3, 4, 5\\]\n\nlists can be updated using the\
    \ command append()\n\nI'll give you an example:\n\nlist = \\['math', 'history',\
    \ 1993, 1994\\];\n\nprint \"Value available at index 2 : \"\n\nprint list\\[2\\\
    ]\n\nlist\\[2\\] = 1995;\n\nprint \"New value available at index 2 : \"\n\nprint\
    \ list\\[2\\]\n\nAnd the output will be the following:\n\nValue available at index\
    \ 2 :\n\n1993\n\nNew value available at index 2 :\n\n1995\n\nWe can also delete\
    \ elements:\n\nlist1 = \\['math', 'history', 1993, 1994\\];\n\nprint list1\n\n\
    del list1\\[2\\];\n\nprint \"After deleting value at index 2 : \"\n\nprint list1\n\
    \nWith the following output:\n\n\\['math', 'history', 1993, 1994\\]\n\nAfter deleting\
    \ value at index 2 :\n\n\\['math', 'history', 1994\\]\n\nThere are some expressions\
    \ that we can use with lists:\n\nLength: len(\\[1, 2, 3\\]) → 3\n\nConcatenation:\
    \ \\[1, 2, 3\\] + \\[4, 5, 6\\] → \\[1, 2, 3, 4, 5, 6\\]\n\nRepetition: \\['Let's\
    \ start'\\] \\* 3 → \\['Let's start', 'Let's start', 'Let's start' \\]\n\nMembership:\
    \ 3 in \\[1, 2, 3\\] → True\n\nIn regard to list's built-in functions, I'll list\
    \ the most important:\n\n*   cmp(list1, list2) → compares elements of both lists\n\
    \n*   len(list) → gives the total length of the list\n\n*   max(list) → returns\
    \ item from the list with max value\n\n*   min(list) → returns item from the list\
    \ with min valuw\n\n*   list(seq) → converts a tuple into list (we'll see what\
    \ a tuple is in a moment)\n\nIn regard to list's built-in methods, I'll list the\
    \ most important:\n\n*   list.append(obj) → Appends object obj to list\n\n*  \
    \ list.count(obj) → Returns count of how many times obj occurs in list\n\n*  \
    \ list.extend(seq) → Appends the contents of seq to list\n\n*   list.index(obj)\
    \ → Returns the lowest index in list that obj appears\n\n*   list.insert(index,\
    \ obj) → Inserts object obj into list at offset index\n\n*   list.pop(obj=list\\\
    [-1\\]) → Removes and returns last object or obj from list\n\n*   list.remove(obj)\
    \ → Removes object obj from list\n\n*   list.reverse() →  reverses objects of\
    \ list in place\n\n*   list.sort(\\[func\\]) → Sorts objects of list, use compare\
    \ func if given\n\n4.Strings: Strings in Python have a lot of interesting features.\
    \ They are immutable (after you create a string, you cannot modify it), and if\
    \ you need a new string, you can simply create it.\n\nSo, in the expression ('let’s'\
    \ + 'start'), we will have a new string composed of the two strings 'let’s' and\
    \ 'start'.\n\nLet’s see a practical example:\n\ns = ‘let’s’\n\n print s \\[1\\\
    ]\\## i\n\nprint len(s)##2\n\nprint s + ‘ start ‘\\## let’s start\n\nNow, let’s\
    \ see a couple of examples of strings using the slicing function.\n\ns = “0123456789”\n\
    \nWith the following function: \n\ns \\[:5\\]\n\nYou can select the first 5 numbers\n\
    \n ‘01234’\n\nWith the following function:\n\ns \\[-5:\\]\n\nyou can select the\
    \ last 5 numbers\n\n‘56789’\n\nKeep in mind that Python uses zero-based indexing;\
    \ therefore, if str is 'hello' str\\[1\\] is 'e'.\n\nIn order to wrap, we need\
    \ to utilize the backslash followed by “n”. Let’s see an example:\n\ns = “8\\\\\
    n9\\\\n10\\\\nHi”\n\nprint s\n\n8\n\n9\n\n10\n\nHI\n\nThe “\\\\n” character is\
    \ a special one. Here is a list of the most important special characters:\n\n\
    1.             \"\\\\t\" is a tab\n\n2.             \"\\\\r\" is a carriage return\n\
    \n3.               “\\\\\\\\” is the literal backslash character.\n\n4.            \
    \ “\\\\b” is the backspace\n\nWe can use the “+” symbol to join two strings:\n\
    \ns = ex\n\np = ample\n\ns + p\n\n‘example’\n\nOr we can multiply a string using\
    \ the “\\*” symbol:\n\ns =  example\n\ns \\* 5\n\n‘exampleexampleexampleexampleexample’\n\
    \nIn Python, we can find a lot of string methods (a method is similar to a function\
    \ that runs on an object). We will now take a look at the most commonly used:\n\
    \n*                    s.lower(), s.upper() -- returns the lowercase or uppercase\
    \ version of the string\n\n*                    s.strip() -- returns a string\
    \ with whitespace removed from the start and end\n\n*                    s.isalpha()/s.isdigit()/s.isspace()...\
    \ -- tests if all the string chars are in the various character classes\n\n* \
    \                   s.startswith('other'), s.endswith('other') -- tests if the\
    \ string starts or ends with the given other string\n\n*                    s.find('other')\
    \ -- searches for the given other string (not a regular expression) within s and\
    \ returns the first index where it begins or -1 if not found\n\n*                   \
    \ s.replace('old', 'new') -- returns a string where all occurrences of 'old' have\
    \ been replaced by 'new'\n\n*                    s.split('delim') -- returns a\
    \ list of substrings separated by the given delimiter. The delimiter is not a\
    \ regular expression. It's just text.\n\n*                    'aaa,bbb,ccc'.split(',')\
    \ -> \\['aaa', 'bbb', 'ccc'\\]. As a convenient special case s.split() (with no\
    \ arguments) splits on all whitespace chars.\n\n*                    s.join(list)\
    \ -- opposite of split(), joins the elements in the given list using the string\
    \ as the delimiter. e.g. '---'.join(\\['aaa', 'bbb', 'ccc'\\]) -> aaa---bbb---ccc\n\
    \n5.Tuples\n\n With the term “tuple”, we are referring to a sequence of objects\
    \ that are immutable in Python.\n\nIf a tuple is empty, it will appear as the\
    \ following:\n\ntup1 = ()\n\nIf a tuple includes even only one value, we have\
    \ to include a comma:\n\ntup1 = (1,)\n\nLet’s see some more tuples:\n\ntup1 =\
    \ ('dog', 'cat', 'fish', 'seal' )\n\ntup2 = (1, 2, 3, 4 )\n\nTuples can be sliced,\
    \ concatenated and more, just like strings, but in order to do that, we have to\
    \ use square brackets:\n\ntup1 = ('dog', 'cat', 'fish', 'seal')\n\ntup2 = (1,\
    \ 2, 3, 4 )\n\nprint “tup1\\[0\\]: “, tup1\\[0\\]\n\nprint “tup2\\[1:4\\]: “,\
    \ tup2\\[2:3\\]\n\nOnce we execute this code, we will have this result:\n\ntup1\\\
    [0\\]: dog\n\ntup2\\[1:4\\]: (3,)\n\nIf you were expecting a different output\
    \ that is because tuples indices begin at 0.\n\nAs already said, tuples are immutable.\
    \ If you need to add or delete elements, you have to create a new tuple. Let’s\
    \ see an example:\n\nAt first, we will look at how we can create a new tuple with\
    \ the desired elements:\n\ntup1 = (1, 2, 3)\n\ntup2 = ('dog', 'cat', 'fish')\n\
    \ntup3 = tup1 + tup2\n\nNow, we just have to run the print command, and this will\
    \ be the result:\n\nprint (tup3)\n\n(1, 2, 3, 'dog', 'cat', 'fish')\n\nLists and\
    \ tuples are similar. The main difference is that, while lists can be modified\
    \ at any time, tuples are immutable. Moreover, while tuples use parentheses, lists\
    \ use square brackets."
