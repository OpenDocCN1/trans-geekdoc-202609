    另一种方案是尽可能显示页面内容，并在屏幕上放置一个非常显目的错误消息。该消息的内容为“由于内部错误，无法执行操作”。这种处理方式的意义在于为用户提供机会纠正问题并尝试重新操作。这种情况通常发生在表单提交时，即错误数据导致网页出错。


    ### 调试信息


    当服务器端代码能够处理错误时，将调试信息发送给网站管理员和技术支持团队非常重要，这样就可以快速解决问题。这种调试信息与显示给用户的友好错误消息不同。它包含了关于导致错误的代码详细信息以及任何其他相关信息。


    最常见的错误之一是由于不使用存储过程的网站 SQL 语句格式错误导致的数据库错误。这种错误可以通过服务端代码轻松地捕捉并处理。在这种情况下，我们希望看到的调试信息是错误源（文件名和行号）、堆栈跟踪以及导致错误的错误
    SQL 脚本。


    我们希望看到的其他信息还包括包含查询字符串的 URL。请求方法（GET 或 POST）以及所有表单变量都会传递给脚本。此外，在客户端机器上设置任何 Cookie
    都有助于重现错误。这一点在于，我们需要获取尽可能的信息，以便快速识别并纠正问题。


    ### 传输调试信息


    一旦获得了这些调试信息，我们需要将其传输给网站管理员和技术支持团队。最简单的方法是发送一封包含所有上述信息的电子邮件。另一种方法是将这些信息存储可以通过公司内网访问的数据库中。


    您应该考虑两种方法都采用，以消除一种方法失败的可能性。当然，如果整个脚本失败并停止执行，将没有任何信息被发送出去。这是错误处理的风险之一。为了防止这种情况，网站所有者应该定期测试其错误处理机制以确保正常工作。


    ### 网站管理员报警


    如所述，错误通知可以通过电子邮件传递。有时，让收件箱充满大量邮件并没有意义。另一种方案是创建一个 RSS 馈。RSS 代表“真正简单聚合”（Really Simple
    Syndication）或“站点摘要”（Rich Site Summary）。它就像一种新闻源，向用户递送标题和摘要。


    使用 RSS 阅读器应用程序，用户可以通过电脑或手机接收有关新获取报告的通知。有很多库可用于在网站上创建 RSS。创建自己的服务也不困难，因为 RSS 馈无非只是一个提供信息的
    XML 文档。为了更快的速度，使用短信或手机短信息添加通知（或警报）也是轻而易举的。就像以前使用寻呼机一样，所有者将立即收到通知，因为警报中可以发送页面或错误等信息。第十六章：为什么
    Python 会长久不衰


    Python 最初由 Van Rossum 在 1989 年 12 月作为一种爱好语言构想的。此外，这种通用编程语言的主要且向后兼容的版本于 2008 年
    12 月 3 日发布。但 Python 被许多开发者评为 2015 年最流行的语言。巨大的流行程度表明了 Python 作为现代编程语言的有效性。同时，Python
    3 目前被全球开发者用于创建各种桌面、Web 和移动端应用程序。还有许多原因使得 Python 的巨大人气将在未来长期保持不变。


    ### Python 巨大人气在未来保持不变的 8 个原因


    #### 1) 支持多种编程范式


    优秀的开发者经常利用不同的编程范式来减少开发大型复杂应用所需的时间精力。与其他现代语言一样，Python 支持多种常用的编程风格，包括面向对象、函数式、过程化和命令式。它具有自动内存管理和动态类型系统。因此，程序员可以使用该语言来实现大型复杂软件应用的开发。


    #### 2) 不需要程序员编写冗长的代码


    Python 的设计完全关注代码的可读性。因此，程序员可以创建可供分布式团队成员使用的可读代码库。同时，该编程语言简单的语法使他们能够在不编写长行代码的情况下表达概念。这一特性使得开发者更容易处理大型复杂应用，因为他们可以轻松跳过其他语言所需的某些任务。


    #### 3) 提供了全面的标准


    Python 凭借其标准库在其他语言面前更胜一筹。程序员可以在不编写额外代码的情况下使用它们。此外，Python 的标准库是为各种任务设计的。因此，它有助于开发和


    #### 4) 便于 Web 应用开发


    Python 被设计为一种通用语言，缺乏内置的 Web 功能。Web 开发者使用各种框架，包括 Django、Web2、Cubic 和 Real。这些框架帮助程序员执行操作，如数据库操作、URL
    路由、会话存储和输出模板。他们可以进一步利用这些框架保护 Web 免受跨站脚本攻击。


    #### 5) 便于高质量 GUI、科学和数值应用的开发


    Python 目前可在主流操作系统上运行，如 Windows、Mac X、Linux 和 UNIX。因此，用语言编写的桌面 GUI 应用可以部署在多个平台上。程序员可以使用
    Kivy、wxPython 和 PyGT 等框架进一步加速跨平台桌面 GUI 应用的开发。许多报告强调了 Python 被广泛用于数值和科学应用的开发。


    #### 6) 简化应用原型设计


