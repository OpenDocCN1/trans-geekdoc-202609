    # 第十章章：各种类型的数据\n\n幸运的是，Python 拥有一组良好的内置函数，它们运行非常好，特别是对于初学者来说。\n\n现在我们来学习主要的内置函数：\n\
    \n### 1. type 函数\n它返回任意对象的数据类型。`type` 函数甚至可以接收一个变量并将其作为类型返回。你可以使用此函数来比较不同类型的对象。\n\
