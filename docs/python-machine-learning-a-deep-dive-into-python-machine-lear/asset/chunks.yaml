    # CHAPTER SIX: PYTHON or PERL


    Both Python and Perl are mature, open source, general purpose, high-level, and
    interpreted programming languages. But the usage statistics posted on various
    websites depict that Python is currently more popular than Perl. Hence, a software
    developer can enhance his career prospects by switching from Perl to Python.


    A beginner can further learn and use the Python programming language without putting
    extra time and effort. However, you must not switch to a new programming language
    just because of its popularity and usage. You must keep in mind the major differences
    between the two programming languages while deciding about migrating from Perl
    to Python.


    ### 12 Points You Must Keep in Mind while Switching from Perl to Python


    #### 1) Design Goal

    Perl was originally designed as a scripting language to report processing. It
    comes with built-in text processing. On the other hand, Python was designed initially
    as a hobby language. But it was designed with features to help programmers build
    applications with clean, readable, and reusable code. The two programming languages
    still differ in categories of features and performance.


    #### 2) Syntax Rules

    The syntax rules of both Python and Perl are influenced by other programming languages.
    For instance, Perl borrows features from a number programming languages including
    C, shell script, AWK, and Lisp. Likewise, Python implements functional programming
    in a manner similar to L. In addition to being easy to use, the Python syntax
    further enable programmers with simple concepts and readable code.


    #### 3) Family of Languages

    Perl belongs to a family of high-level programming languages that includes Perl
    5 and Perl 6. Versions 5 and 6 of Perl are compatible with each. A developer can
    easily migrate from Perl 5 to 6 without putting extra effort. The different versions
    of Python are not compatible with each. Hence, a programmer has to choose from
    distinct versions of programming.


    #### 4) Ways to Achieve Result

    Python enables programmers to express concepts without writing long lines of code.
    But it requires programmers to accomplish tasks or results in a specific way.
    On the other hand, Perl enables programmers to accomplish task results in number
    of ways. Hence, many programmers find Perl to be more flexible than Python, but
    the multiple ways to achieve the same result often make the code written in Perl
    the application difficult to maintain.


    #### 5) Web Scripting Language

    Perl was originally designed as a UNIX scripting language. Many developers use
    Perl as a scripting language to avail its built-in text processing. However, there
    are many web developers who complain that Perl is slower than other widely used
    scripting languages. Python is also used widely by programmers for web application
    development. But it lacks built-in web development. Hence, developers have to
    avail various frameworks and tools to write web applications in Python efficiently
    and rapidly.


    #### 6) Web Application Frameworks

    Most developers nowadays avail the tools and features provided by various frameworks
    to build web applications efficiently and rapidly. Perl web programmers have options
    to choose from an array of frameworks, including Catalyst, Dancer, Mojolicious,
    Poet, Interchange, Jifty, and Gantry. Likewise, the web developers have the option
    to use a number of Python web frameworks, including Django, Flask, Pyramid, Bottle,
    and Cherrypy. However, the number of Python web frameworks is much higher than
    the number of Perl web frameworks.


    #### 7) Usage

    As mentioned earlier, both Python and Perl are general-purpose programming languages.
    Hence, each programming language is used to develop a variety of software applications.
    Perl is used widely for graphic and network programming, system administration,
    and development of finance and biometric applications, whereas Python comes with
    a robust standard library that simplifies web application development, scientific
    computing, big data solution development, and artificial intelligence tasks. Hence,
    developers prefer using Python for development of advanced and mission-critical
    software applications.


    #### 8) Performance and Speed

    A number of studies have shown that Python is slower than other programming languages,
    like Java and C++. Developers frequently explore ways to enhance the execution
    speed of Python code. Someone even replaced default Python runtime with their
    own custom runtime to make the Python applications run faster. Many programmers
    find Perl to be faster than Python.


    #### 9) Structured Data Analysis

