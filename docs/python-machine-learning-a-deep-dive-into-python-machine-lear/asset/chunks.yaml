    这正是纯人工智能和机器学习试图解决的问题：通过完全剥离这种情感化的决策，让机器做出最终的、最理性的具有最高盈利概率的决策。现在，让我们开始吧！我们将具体概述几种在金融领域开始被散户交易者和大型对冲基金经理广泛使用的机器学习和深度学习算法。这些算法是逻辑回归和循环神经网络。正如你所注意到的，虽然这些算法背后的基础逻辑在推理上有些相似之处，但导致它们各自决策过程的数学机制可能存在显著差异。对于我们的第一个算法，我们将使用
    Python 的模块 `scikit-learn` 进行机器学习预测和交易。有关该库的更多信息可以在此处获得：


    `scikit-learn.org/stable/


    # 将逻辑回归应用于美国股票市场进行预测性交易 (AMZN)


    在我们的第一个算法示例中，我们将应用一种名为 `logistic regression`（逻辑回归）的方法，通过 Python 帮助我们预测美国股票市场传统股票的价格走势。`Logistic
    regression` 是一种存在很长时间的数学方法，其背后的基础理解是一种预测分析的形式，其中因变量（`y variable`）是二元元的。总的来说，因变量在本质上应该是二分的，且没有离群值。我们还应该能够表现出没有多共线性，即预测变量（我们的
    `x variables`，或我们的特征）之间不应存在高相关性。从数学角度来看，`logistic regression` 估计定义如下的多元回归函数：


    ![Capture.PNG`


    对于 `logistic regression` 以及大多数机器学习算法，需要非常警惕的一点是过拟合（overfitting）概念。背后的想法是，通过向 `logistic
    regression` 模型中添加独立变量，我们无疑会增加预测变量所解释的总方差。然而，向模型中添加过多的变量会导致 `overfitting`；这会削弱模型在我们用于拟合模型的数据之外的泛化基础。从本质上说，这为我们的模型对目标数据的拟合优劣提供了虚假的解释。如此，让我们通过
    Python 将 `logistic regression` 的数学基础应用于美国股票市场。在我们的特定示例中，我们将使用 `logistic regression`
    来帮助我们预测亚马逊公司 (`AMZN`) 的价格走势。


