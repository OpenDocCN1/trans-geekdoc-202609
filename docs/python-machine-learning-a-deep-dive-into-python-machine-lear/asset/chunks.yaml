    \ = lr * factor`\n3. `patience`: 在降低学习率之前，连续无改进的 epoch 数。\n4. `verbose`: 整数。0:\
    \ 静默，1: 更新消息。\n5. `min_lr`: 学习率的下限。\n\n`checkpointer = ModelCheckpoint(filepath=\"\
    lolkek.hdf5\", verbose=1, save_best_only=True)` Checkpoint 允许我们在每个 epoch 后保存模型。它通过扩展基类\
    \ `keras.callbacks.Callback` 创建自定义回调。回调函数可以通过类属性 `self.model` 访问其关联模型。\n\n此方法的参数包括：\n\
    \n1. `filepath`: 字符串，保存模型文件的路径。\n2. `monitor`: 要监控的指标。\n3. `verbose`: 整数。0: 静默，1:\
    \ 更新消息。\n4. `save_best_only`: 布尔值，如果为 True 则仅保存最佳模型。\n\n`model.compile(optimizer=opt,\
    \ loss='categorical_crossentropy', metrics=['accuracy'])` https://keras.io/losses/\
    \ 决定应用何种损失函数。\n\n`history = model.fit(X_train, Y_train, epochs=100, batch_size=128,\
    \ verbose=1, validation_data=(X_test, Y_test), callbacks=[reduce_lr, checkpointer])`\
    \ https://keras.io/models/sequential/ 使用 X_train 训练模型。\n\n### 3. 预测测试模型的输出\n\n\
    `model.load_weights(\"lolkek.hdf5\")` 从 HDF5 文件加载权重。默认情况下，架构保持不变。\n\n`pred = model.predict(np.array(X_test))`\
    \ 为测试 Y_test 预测输出，将 X_test（我们的测试特征）设置为 numpy 数组。\n\n使用混淆矩阵帮助检查过拟合：\n\n```python\n\
