    Once you do that, you should be able to run Python like any other program.


    # CHAPTER FIVE: INTERPRETER, INTERACTIVE


    For most programming languages, you need to write the source code, compiling,
    and sometimes link the libraries in order to run the program.


    With Python, everything is easier due to the fact that it allows you to run the
    source code directly (that is why it is defined as Interpreter) or even to write
    the instructions straight from its command prompt without creating or editing
    a source file (Interactive).


    Sure, this last feature could seem a little odd, but we will see that, starting
