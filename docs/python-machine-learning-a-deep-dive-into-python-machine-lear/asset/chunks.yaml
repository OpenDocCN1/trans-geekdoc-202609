    \ index 2 :\n1993\nNew value available at index 2 :\n1995\n```\n\n我们还可以删除元素：\n\
    \n```python\nlist1 = ['math', 'history', 1993, 1994];\nprint list1\ndel list1[2];\n\
    print \"After deleting value at index 2 : \"\nprint list1\n```\n\n带有如下输出：\n\n\
    ```text\n['math', 'history', 1993, 1994]\nAfter deleting value at index 2 :\n\
    ['math', 'history', 1994]\n```\n\n有一些可以与列表一起使用的表达式：\n- 长度：`len([1, 2, 3])` → `3`\n\
    - 合并：`[1, 2, 3] + [4, 5, 6]` → `[1, 2, 3, 4, 5, 6]`\n- 重复：`['Let's start'] * 3`\
    \ → `['Let's start', 'Let's start', 'Let's start']`\n- 成员身份：`3 in [1, 2, 3]` →\
    \ `True`\n\n关于列表的内置函数：\n- `cmp(list1, list2)` → 比较两个列表\n- `len(list)` → 给出列表的总长度\n\
    - `max(list)` → 返回列表中的最大值\n- `min(list)` → 返回列表中的最小值\n- `list(seq)` → 将元组转换为列表\n\
    \n关于列表的内置方法：\n- `list.append(obj)` → 将 `obj` 添加到列表\n- `list.count(obj)` → 返回 `obj`\
    \ 在列表中出现的次数\n- `list.extend(seq)` → 将 `seq` 的内容添加到列表\n- `list.index(obj)` → 返回\
    \ `obj` 在列表中出现的索引\n- `list.insert(index, obj)` → 在 `index` 处插入 `obj`\n- `list.pop(-1)`\
    \ → 移除并返回列表最后一个对象\n- `list.remove(obj)` → 从列表中移除 `obj`\n- `list.reverse()` → 原地反转列表\n\
    - `list.sort()` → 排序列表对象\n\n### 4. 字符串 (Strings)\nPython 中的字符串有很多有趣的特性。它们是不可变的（一旦创建字符串，你就无法修改它），如果你需要一个新的字符串，可以直接创建一个。\n\
    \n所以，在表达式 `'let’s' + 'start'` 中，我们将得到由 'let’s' 和 'start' 组成的新字符串。让我们来看一个示例：\n\n\
    ```python\ns = ‘let’s’\nprint s[1]\nprint len(s)\nprint s + ‘ start ‘\n```\n\n\
    现在我们来看几个使用切片的字符串示例。\n\n```python\ns = “0123456789”\ns[:5] → 选择前 5 个数：‘01234’\n\
    s[-5:] → 选择后 5 个数：‘56789’\n```\n\n记住 Python 使用从 0 开始的索引；因此，如果 `str` 是 'hello'，`str[1]`\
    \ 就是 'e'。\n\n为了换行，我们需要利用反斜杠加上 `\\n`。让我们来看一个示例：\n\n```python\ns = “8\\n9\\n10\\\
    nHi”\nprint s\n```\n\n```text\n8\n9\n10\nHi\n```\n\n`\\n` 字符是特殊的。特殊字符列表：\n1. `\\\
    t` 是制表符\n2. `\\r` 是回车\n3. `\\\\` 是反斜杠字符\n4. `\\b` 是退格\n\n我们可以使用 `+` 符号连接两个字符串：\n\
    \n```python\ns = ex\np = ample\ns + p\n# result: example\n```\n\n或者可以使用 `*` 符号乘以字符串：\n\
    \n```python\ns = example\ns * 5\n# result: exampleexampleexampleexample\n```\n\
    \n在 Python 中，我们可以找到很多字符串方法（方法类似于运行在对象上的函数）。我们现在来看常用的：\n- `s.lower()`, `s.upper()`\
    \ — 返回字符串的小写或大写版本\n- `s.strip()` — 返回去除了首尾空格的字符串\n- `s.isalpha()`, `s.isdigit()`,\
    \ `s.isspace()...` — 测试字符是否属于相应的字符类\n- `s.startswith('other')`, `s.endswith('other')`\
    \ — 测试字符串是否以 other 开头或结尾\n- `s.find('other')` — 返回 other 出现的索引，如果未找到返回 -1\n- `s.replace('old',\
    \ 'new')` — 返回所有 'old' 被替换为 'new' 的字符串\n- `s.split('delim')` — 返回由给定分隔符分割的子字符串列表。分隔符不是正则表达式\n\
    - `'---'.join(list)` — 连接列表中的元素\n\n### 5. 元组 (Tuples)\n当我们说元组，我们指的是一组不可变的对象序列。\n\
    \n如果元组是空的，它将显示如下：\n\n```python\ntup1 = ()\n```\n\n如果元组只包含一个值，我们必须包含逗号：\n\n```python\n\
    tup1 = (1,)\n```\n\n让我们来看更多元组（等等，文本说“元组可以像字符串一样进行切片、合并等，但为了做到这一点，我们必须使用方括号”）：\n\
    \n```python\ntup1 = ('dog', 'cat', 'fish', 'seal')\ntup2 = (1, 2, 3, 4 )\nprint\
    \ \"tup1[0]: \", tup1[0]\nprint \"tup2[1:4]: \", tup2[2:3]\n```\n\n```text\ntup1[0]:\
    \ dog\ntup2[1:4]: (3)\n```\n\n如果你期望不同的输出，那是因为元组的索引从 0 开始。\n\n如前所述，元组是不可变的。如果你需要添加或删除，你需要创建一个新的元组。让我们来看一个示例：\n\
    \n首先，我们来看如何创建一个包含所需元素的元组：\n\n```python\ntup1 = (1, 2, 3)\ntup2 = ('dog', 'cat',\
    \ 'fish')\ntup3 = tup1 + tup2\nprint (tup3)\n```\n\n```text\n(1, 2, 3, 'dog',\
    \ 'cat', 'fish')\n```\n\n列表和元组是相似的。主要的区别在于，列表可以随时修改，而元组是不可变的。此外，元组使用括号，而列表使用方括号。\n\
    \n"
