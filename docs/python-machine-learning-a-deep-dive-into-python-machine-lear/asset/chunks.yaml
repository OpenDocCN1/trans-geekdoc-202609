    \ objects and its respective attributes.\n\nPython programmers can write high\
    \ quality and modular code by using classes and objects.\n\nWith an object oriented\
    \ language, we can face the problem with a different approach. For instance, we\
    \ can define an object, give it a name, and from that moment, we can forget the\
    \ definition due to the fact that it has been already saved.\n\nFurthermore, we\
    \ can save the physical state inside the file in order to open it only once. By\
    \ doing so, our object will give us all the reading and writing functions we need.\n\
    \nLet’s take an example of Class\n\n```python\nclass fruit:\n    tipo = \"vegetable\"\
    \n\napple = fruit()\nprint apple.tipo\n```\n\n# CHAPTER EIGHT: MODULES\n\nIn order\
    \ to use a programming language, you often need to import several libraries that\
    \ you will need in order to find codes. Python users’ life is simplified due to\
    \ the fact that you can find a ton of tested and functioning libraries. Libraries\
    \ in Python are called \"modules\". \"Modules\" are pre-written Python codes that\
    \ you import in your Python program. Since there are many tasks that commonly\
    \ do, modules that have written do these tasks for you, and they allow you the\
    \ most efficient way. Sometimes, you will see refer to \"DRY.\" This stands for\
    \ Don't Repeat Yourself, which often translates into \"Don't Repeat Yourself Else.\"\
    \ Modules are placed, like a wrapper, Python code around C++ code, what allows\
    \ you to use various aspects of the language being wrapped. Thus, Python can be\
    \ used to make games, data analysis, control and hardware, create GUIs, or even\
    \ to create websites. \"GUI\" stands for Graphical User Interface and is used\
    \ to describe a program that imports graphics to make the program interactive\
    \ for the user.\n\nNow, let’s see how to import a library on Python. You can gain\
    \ access to a module by simply using the `import` statement. Doing this, will\
    \ execute the code of the module. In order to have access to a module, the user\
    \ must first look for a built-in module in Python (Python has a wide variety of\
    \ build-in functions that allow the user to start its journey in programming;\
    \ if the user wants to experiment with different functions, he/she may need to\
    \ import a module). If the corresponding module is not already built in, we need\
    \ to import it.\n\nLet’s see a practical example: Let’s say that I want to import\
    \ a module called `example1`. I’ll run the statement for that module:\n\n```python\n\
    import example1\n```\n\nAnd it’s as easy as that.\n\n# CHAPTER NINE: LET’S DIVE\
    \ IN\n\nNow we will dive into Python, discovering the various commands, lists,\
    \ strings, and so on…\n\n## IDLE\n\nYou will find \"IDLE\" (Integrated Development\
    \ Environment) in the main menu, and it will allow you to edit, run, and test\
    \ the codes that you will create. IDLE has the following features:\n\n- coded\
    \ in Python, using the `tkinter` GUI toolkit\n- cross-platform: It has the same\
    \ features whether you’re using Windows, Unix, Mac OS X, or Linux\n- Python shell\
    \ window (interactive interpreter) with colorizing of code input, output, and\
    \ error messages\n- multi-window text editor with multiple undo, Python colorizing,\
    \ smart indent, call tips, auto completion, and other features\n- search within\
    \ any window, replace within editor windows, and search through multiple files\
    \ (`grep`)\n- debugger with persistent breakpoints, stepping, and viewing of global\
    \ and local namespaces\n- configuration, browsers, and other dialogs\n\nIDLE has\
    \ two main window types: The first one is the Shell window, and the second is\
    \ the Editor window. You can easily run multiple editor windows at the same time.\
    \ Output windows are a subtype of edit window. They currently have the same top\
    \ menu as the Editor windows but a different default title and context menu.\n\
    \nIDLE’s menus change dynamically based on which window is currently selected.\
    \ Each menu documented below indicates which window type it is associated with.\n\
    \nNow, let’s run IDLE and digit the command we already tried.\n\n```python\nprint(\"\
    Let’s start\")\n```\n\nWe can see how the program processes our command. Since\
    \ we don’t want to digit the codes every time, we will now save the source code.\n\
    \n## EDITING\n\nLet’s run the command `File/New` window that we will find in the\
    \ IDLE menu, and we will open a new window without the command prompt. In this\
    \ new window, we will write our beloved code once again:\n\n```python\nprint(\"\
    Let’s start\")\n```\n\nBut this time, we click on `file/save`, and we save our\
    \ file, naming it `start.py` in a directory. Now, we can run our newly created\
    \ program from IDLE with the command `run`.\n\nThere are a lot of editors available\
    \ to write Python programs. Let’s see the most famous:\n\n- Eclipse with PyDev:\
    \ Eclipse has a massive community of developers, and it allows you a great level\
    \ of customization.\n- Eric: Eric writes in Python using qt framework, and it\
    \ utilizes Scintilla, which is a source code editing component.\n- PyCharm: It\
    \ has its own free community, which is definitely useful when you’re learning\
    \ to code.\n"
  trans: "\n\n目前，大数据是软件开发领域最热门的趋势之一。许多企业现在构建自定义应用程序，用于收集、存储和分析大量的结构化和非结构化数据。Perl 提供的\
    \ PDL 使开发者能够分析大数据。Perl 内置的文本处理能力进一步简化并加速了大量结构化数据的分析。但 Python 被程序员广泛地用于数据分析。开发者进一步利用了强大的\
    \ Python 库（如 Numpy），以更快速、更高效的方式处理和分析海量数据。\n\n## 10) JVM 互操作性\n\n目前，Java 是广泛用于桌面、Web\
    \ 和移动端应用程序开发的编程语言之一。与 Perl 相比，Python 与 Java 虚拟机（JVM）之间可以实现无缝且高效的互操作。因此，开发者可以选择编写运行在\
    \ JVM 上平稳执行的 Python 代码，同时利用强大的 Java API 和对象。这种互操作性帮助程序员在针对流行的 Java 平台构建应用程序时，直接使用\
    \ Python 而不是 Java 来编写代码。\n\n## 11) 高级面向对象编程\n\nPerl 和 Python 都是面向对象的编程语言。但 Python\
    \ 实现高级面向对象编程的方式优于 Perl。在 Perl 中编写代码时，程序员仍然需要使用包（packages）而不是类。许多开发者发现，在 Perl 中编写面向对象代码时，很难保持代码的简单易读性。但\
    \ Perl 让程序员通过在命令行使用单行命令就能更容易完成各种任务。\n\n## 12) 文本处理能力\n\n与 Python 不同，Perl 设计之初就内置了文本处理能力。因此，许多程序员倾向于使用\
    \ Perl 生成报告。Perl 进一步让程序员更容易执行正则表达式和字符串比较操作，如匹配、替换和替换。它不需要开发者编写额外的代码来执行异常处理和 I/O\
    \ 操作。因此，当需要构建应用程序处理文本数据或生成报告时，许多程序员倾向于使用 Perl 而不是 Python。\n\n# 第七章：对象\n\n我们不会详细讨论这个表达式（目前还没有一个通接受的定义）。关于这种范式，我们可以说它意味着在思考解决方案时，不要将其视为指令的序列，而是将其视为对象及其相应的属性。\n\
    \nPython 程序员可以通过类和对象来编写高质量且模块化的代码。\n\n使用面向对象的语言，我们可以用不同的方法面对问题。例如，我们可以定义一个对象，给它命名，并且从那一刻起，由于定义已经保存，我们就可以忘记定义了。\n\
    \n此外，我们可以将物理状态保存在文件中，以便只需打开一次。通过这样做，我们的对象将为我们提供所需读写函数。\n\n让我们来看一个类的示例\n\n```python\n\
    class fruit:\n    tipo = \"vegetable\"\n\napple = fruit()\nprint apple.tipo\n\
    ```\n\n# 第八章：模块\n\n为了使用一种编程语言，你通常需要导入几个需要的库来找到代码。Python 用户的的生活变得简单，因为你可以找到大量经过测试且功能良好的库。Python\
    \ 中的库被称为“模块”（modules）。“模块”是你导入到 Python 程序中的预先写的 Python 代码。由于有很多常见的任务，已经写好的模块会为你完成这些任务，并且它们为你提供了最有效的方法。有时，你会看到提到“DRY”。这代表“不要重复你自己”（Don't\
    \ Repeat Yourself），它通常翻译为“不要重复你自己，否则就错了”。模块像包装器一样放置在 C++ 代码周围的 Python 代码上，这允许你使用被包装语言的各种特性。因此，Python\
    \ 可用于制作游戏、数据分析、控制和硬件、创建 GUI，甚至用于创建网站。“GUI”代表图形用户界面（Graphical User Interface），用于描述一个导入图形以使程序与用户产生交互的程序。\n\
    \n现在，让我们如何在 Python 中导入库。你可以简单地使用 `import` 语句来访问模块。这样做将执行模块的代码。为了访问模块，用户必须首先在 Python\
    \ 中寻找内置模块（Python 拥有多种内置函数，允许用户开启编程之旅；如果用户想对不同的函数进行实验实验，他/她可能需要导入模块）。如果相应的模块尚未内置，我们需要导入它。\n\
    \n让我们来看一个实际示例：假设我想导入一个名为 `example1` 的模块。我将运行该模块的语句：\n\n```python\nimport example1\n\
    ```\n\n操作就如此简单。\n\n# 第九章：深入探索\n\n现在我们将深入 Python，发现各种命令、列表、字符串等……\n\n## IDLE\n\n\
    你会在主菜单中找到“IDLE”（集成开发环境），它允许你编辑、运行和测试你创建的代码。IDLE 具有以下特性：\n\n- 使用 Python 编写，使用 `tkinter`\
    \ GUI 工具包\n- 跨平台：无论你使用 Windows、Unix、Mac OS X 还是 Linux，它的功能都相同\n- Python 窗口（交互式解释器），带有代码输入、输出和错误的着色\n\
    - 多窗口文本编辑器，带有多次撤销、智能缩进、调用提示、自动补全等功能\n- 窗口内搜索、编辑器内替换以及跨文件搜索 (`grep`)\n- 调试器，带有持久断点、单步执行以及全局局部命名空间查看\n\
    - 配置、浏览器和其他对话框\n\nIDLE 有两种主窗口类型：第一个是 Shell 窗口，第二个是编辑器窗口。你可以同时运行多个编辑器窗口。输出窗口是编辑器窗口的一种。它们与编辑器窗口具有相同的顶部菜单，但默认标题和右键菜单不同。\n\
    \nIDLE 的菜单根据当前选中的窗口动态变化。下方列出的每个菜单指示与其相关的窗口类型。\n\n现在，让我们运行 IDLE 并输入测试过的命令。\n\n\
    ```python\nprint(\"Let’s start\")\n```\n\n我们可以看到程序如何处理我们的命令。由于我们不想每次都输入代码，现在我们将保存源代码。\n\
    \n## 编辑\n\n让我们运行 IDLE 菜单中的 `File/New` 窗口，打开一个没有命令提示符的新窗口。在新窗口中，我们将再次编写我们爱的代码：\n\
    \n```python\nprint(\"Let’s start\")\n```\n\n但这次我们点击 `file/save` 并保存文件，将其命名为 `start.py`\
    \ 存放在目录中。现在我们可以从 IDLE 运行我们新创建的程序。\n\n有很多编辑器可以编写 Python 程序。让我们来看看最著名的：\n\n- 带有\
    \ PyDev 的 Eclipse：Eclipse 拥有庞大的开发者社区，并允许进行极佳的自定义。\n- Eric：Eric 使用 qt 框架编写 Python，它利用了\
    \ Scintilla，这是一种源代码编辑器组件。\n- PyCharm：它有自己的免费社区版，在你学习编程时非常有用。\n\n"
