    Such an approach, while it does utilize artificial intelligence, may be critiqued
    by true Wall Street quants, in that it is not purely quantitative trading. Nonetheless,
    we will approach the concepts and algorithms for this book from a perspective
    that is designed entirely towards applying the fundamentals of pure artificial
    intelligence in different types of financial markets; one with no pure form of
    human, or hybrid, intervention whatsoever. The underlying reasoning being that
    at the end of the day, if we can seem to create powerful machine learning models
    to predict market performance on such a level, we can maybe begin to slowly strip
    the general notion of emotional and irrational investment decision making from
    the equation. Such decision making that has historically been proven to fail the
    investment philosophy for both retail and experienced fund managers in that during
    times of high market stress and turmoil. In short, such irrational decisions have
    been proven to have a higher probability of playing into many lackluster investment
    choices. And generally speaking, result in poor investment outcomes.


    This is something pure artificial intelligence and machine learning attempt to
    resolve by completely stripping such emotional decision making, and letting the
    machine make the ultimate, most rational of decisions with the highest probability
    of profitability potential. And with that, let’s jump into it! We will outline
    specifically a couple types of machine and deep learning algorithms that are beginning
    to be commonly used in the financial world for both retail traders, and large
    hedge fund managers. These algorithms being logistical regression, and recurrent
    neural networks. As you will notice, while the fundamental logic behind these
    algorithms are somewhat paralleled in reasoning, the mathematical mechanics that
    give way to their respective decision making process can significantly differ.
    For our first algorithm, we will be applying python’s module, `scikit-learn`,
    for machine learning prediction and trading. Further information on this library
    can be obtained at:


    [http://scikit-learn.org/stable/


    # APPLYING LOGISTIC REGRESSION TO U.S. EQUITY MARKETS FOR PREDICTIVE TRADING (AMZN)


    In our first algorithm example, we will be applying an approach called `logistic
    regression` to help us predict price movements for traditional stocks within the
    U.S. equity markets via python. `Logistic regression` is a mathematical approach
    that has been around for quite some time now with the fundamental understanding
    behind it serving as a form of predictive analysis, in which the dependent variable
    (`y variable`) is binary. Generally speaking, the dependent variable should be
    dichotomous in nature, with the absence of outliers. We should also be able to
    exhibit no multicollinearity, in which there should be no elevated correlations
    among the predictors (our `x variables`, or our features). From a mathematical
    perspective, `logistic regression` estimates a multiple learning regression function
    defined as:


    ![Capture.PNG](images/00001.jpeg)


    One careful thing to be very cognizant of for `logistic regression`, and for all
    machine learning algorithms for the most part, is the notion of overfitting. The
    thought behind this is that by adding independent variables to a `logistic regression`
    model, we will undoubtedly tend to increase the total variance explained in the
    predictor variable. Nonetheless, adding too many variables to our model can result
    in `overfitting`; something that can reduce the general foundation of the model
    beyond the data that we use to fit the model. In essence, providing us with false
    interpretations on how well our model fits the data in question. With that said,
    let’s apply our mathematical foundation for `logistic regression` to the U.S.
    equity markets via python. For our specific example, we will use `logistic regression`
    to help us predict price movements for Amazon, Inc. (`AMZN`).

