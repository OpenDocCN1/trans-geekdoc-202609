    # 第一章：我想开始编程


    Python 是一种由 Guido van Rossum 创建的强大的、高级的、面向对象的编程语言。


    它具有简单、易用的语法，使其成为那些尝试学习计算机编程的人的完美语言。


    这是一份关于如何开始 Python、为什么你应该学习它以及你如何学习它的全面指南。


    ## Python 是什么？—— 基础


    在开始之前，让我们熟悉一下这门语言。


    Python 是一种通用语言。它有广泛的应用范围，从 Web 开发（如：Django 和 Bottle）、科学和数学计算（Orange, SciPy, NumPy）到桌面图形用户（Pygame,
    Pandas）。


    Python 的语法简洁，代码长度相对较短。在 Python 中工作很有趣，因为它允许你思考。


    ### 选择 Python 的三个原因 —— 简单的语法


    在 Python 中编程很有趣。它让变得更容易。语法感觉很自然。看这段代码：


    ```python

    a = 2

    b = 3

    sum = a + b

    print(sum)

    ```

    即使你从未编程过，这个程序也能处理两个数字并打印结果。


    ### 不需要强制性类型


    在 Python 中你不需要定义变量类型。此外，不需要在行尾添加分号。Python 强制执行缩进。这些小细节让学习变得容易得多。


    ### 伟大的社区和支持


    Python 拥有庞大的社区。有很多有很多。


    # 第二章：为什么要学习 Python


    Python 是目前最稳健和动态的编程语言之一。它强调代码的可读性，由于其语法和实现，程序员编写的代码比 Java 和 C++ 少。Python 的内存管理是自动的，并且有许多标准库。完成
    Python 培训认证课程后，可以在顶级 IT 公司获得经验。


    Python 支持多种风格，例如函数式编程、命令式和对象风格。


    ## 五大理由


    以下是计算机程序员学习 Python 的五个理由：


    ### 易于学习


    Python 在设计时考虑了新手。与其他语言相比，完成基础任务所需的 Python 代码更少。代码通常比 Java 小 3-5 倍，比 C++ 小 5-10
    倍。Python 代码易读，即使是新手，通过查看代码也能学到很多。


    ### Web 开发的首选


    Python 包含了许多用于网站设计的框架。在这些框架中，Django 是 Python 最流行的。由于这些框架，使用 Python 进行网页设计具有极大的活性。如今在线网站数量接近
    10 亿，随着不断扩大，Python 编程将继续是一项重要的技能。


