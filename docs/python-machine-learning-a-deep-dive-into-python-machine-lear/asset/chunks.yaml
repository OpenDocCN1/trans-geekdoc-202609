    Another option is to display as much of the page as possible and place a highly
    visible error message on the screen. This message would read "Unable to perform
    the action due to an internal error." The point of this type of handling is that
    we give the user the opportunity to correct the issue and attempt the action again.
    This type of situation is typically a form submission where bad data causes an
    error on the web page.


    ### Debug Information


    When the server-side code can handle the error, it is important that debug information
    is sent to the webmaster and technical support team, so issues can be resolved
    quickly. This debug information is different from the friendly error message displayed
    to the user. It contains detailed information about the code that caused the error
    and any other pertinent information.


    One of the most common errors is a database error due to a malformed SQL statement
    for websites that do not use stored procedures. This type of error can easily
    be caught and handled through server-side code. In this case, the type of debug
    information we would like to see is the source of the error (file name and line
    number) with a stack trace and the offending SQL script that caused the error.


    Some other bits of information we would like to see is the URL including the query
    string. The request method (GET or POST) and all form variables are passed to
    the script. Additionally, any cookies set on the client''s machine would also
    be beneficial to reproduce the error. The point is, we need to get as much information
    as possible, so the issue can be identified and corrected quickly.


    ### Transmitting Debug Information


    Once we have this debug information, we need to transmit it to the webmaster and
    tech support team. The easiest way of doing this is to send an e-mail containing
    all the above information. Another method is to store this information in a database
    accessible through a company intranet.


    You should consider doing both to eliminate the possibility that one method fails.
    Of course, if the whole script fails and stops executing, then no information
    will be sent out. This is one of the dangers of error handling. As a precaution
    to avoid this, website owners should periodically test their error handling to
    make sure works.


    ### Webmaster Alerts


    As mentioned, notifications about errors can be delivered via email. Sometimes,
    it doesn''t make sense to have your inbox filled with lots of emails. An alternative
    is to create an RSS Feed. RSS stands for Really Simple Syndication or Rich Site
    Summary. It is like a news feed that delivers headlines along with a synopsis
    to users.


    Using an RSS reader application, users receive notifications through their computer
    or cell about new reports that get. There are lots of libraries available for
    creating RSS on website. It is also not difficult to create your own service since
    RSS feed is not much more than XML document that informs. For even faster times,
    it is fairly trivial to add notification (or alerts) using SMS or text messaging
    to cell. So just like a pager was used long ago, owners will be notified instantly
    since information such as page or error can be sent in the alert. CHAPTER Sixteen:
    Why Python Is Here to Stay


    Python was originally conceived by Van Rossum as a hobby language in December
    1989. Also, the major and backward-incompatible version of the general-purpose
    programming language was released on December 3, 2008. But Python has been rated
    by a number of developers as the most popular language of 2015. The massive popularity
    indicates Python''s effectiveness as a modern programming language. At the same
    time, Python 3 is currently used by developers across the world for creating a
    variety of desktop, web, and mobile applications. There are also a number of reasons
    the huge popularity of Python will remain intact over a longer period.


    ### 8 Reasons the Massive Popularity of Python Will Remain Intact in the Future


    #### 1) Supports Multiple Programming Paradigms


    Good developers often take advantage of different programming paradigms to reduce
    the amount of time and effort required for developing large and complex applications.
    Like other modern languages, Python supports a number of commonly used programming
    styles, including object-oriented, functional, procedural, and imperative. It
    features automatic memory management, along with a dynamic type system. So programmers
    can use the language to effectuate development of large and complex software applications.


    #### 2) Doesn''t Require Programmers to Write Lengthy Code


    Python is designed with a complete focus on code readability. So the programmers
    can create a readable code base that can be used by members of distributed teams.
    At the same time, the simple syntax of the programming language enables them to
    express concepts without writing long lines of code. The feature makes it easier
    for developers to work on large and complex applications. As they can easily skip
    certain tasks required by other languages


    #### 3) Provides a Comprehensive Standard


    Python further scores over other languages due to its standard library. Programmers
    can use these without writing additional code. Also, the standard library of Python
    is designed with a variety of tasks. Thus, it helps with development and and


    #### 4) Facilitates Web Application Development


    Python is designed as a general-purpose language and lacks built-in web features.
    Web developers use variety of frameworks, including Django, Web2, Cubic, and Real.
    These frameworks help programmers perform operations, like database manipulation,
    URL routing, session storage, and output templating. They can further use the
    frameworks to protect the web from cross-site scripting.


    #### 5) Facilitates Development of High-Quality GUI, Scientific, and Numeric Applications


    Python is currently available on major operating systems, like Windows, Mac X,
    Linux, and UNIX. So the desktop GUI applications written in the language can be
    deployed on multiple platforms. Programmers can further speed up cross-platform
    desktop GUI application development using frameworks like Kivy, wxPython, and
    PyGT. A number of reports have highlighted that Python is used widely for the
    development of numeric and scientific applications.


    #### 6) Simplifies Prototyping of Applications

