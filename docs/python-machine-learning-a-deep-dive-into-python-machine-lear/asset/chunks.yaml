    * Modular

    * Dynamic

    * Object-oriented

    * Portable

    * High level

    * Extensible in C++ & C


    ## Advantages or Benefits of Python


    The Python language has multiple applications in software development such as
    gaming, web frameworks and applications, language development, prototyping, graphic
    designs etc. This provides the language with a higher plethora of advantages than
    other programming languages used in the industry. Some its advantages are:


    * Extensive Support Libraries: It provides a large standard library that includes
    areas like string operations, internet, web tools, operating system interfaces,
    and protocols. Most of the highly used programming tasks are easily scripted into
    it which limits the length of codes you need to write in Python.

    * Integration Feature: Python integrates the Enterprise Application making it
    easy to develop Web services by invoking COM or COBRA components. It has powerful
    control as it calls directly through C, C++, or Java. Python also processes XML
    and other markup languages as it can run on all modern operating systems through
    the same but.

    * Improved Programmer’s: The language has extensive support libraries and clean
    object-oriented designs that increase programmers’ productivity by two to ten
    fold while using languages like Java, VB, Perl, C, C++ and C#.

    * Productivity: Its process integration features, unit testing framework, and
    enhanced control contribute to the increased speed for most applications and productivity.
    It is a great option to build a scalable multi-protocol network application.


    ## Limitations or Disadvantages of Python


    Python has varied advantageous features, and programmers prefer this language
    to other programming languages because it is easy to learn and code. However,
    this language has still not made its place in some computing areas, including
    Enterprise Development Shops. Therefore, this language may not solve some of the
    enterprise solutions, and some limitations are:


    * Difficulty Using Other Languages: Python lovers become so accustomed to its
    features and its extensive libraries that they face problems learning or working
    on other languages. Python experts find the declaring "values" or "types" requirements
    of adding curly braces or semicolons task.

    * Weak in Mobile Computing: Python has many platforms but it is a weak language
    for mobile. This is the reason few applications, Carbon, are built in it.

    * Slow Speed: Python runs with the help of interpreter instead of compiler, which
    causes it to slow down because of the the execution that helps it to work normally.
    On the other hand, it can be seen that it is fast for web applications.

    * Run-time Errors: The Python language is dynamic it has many designs reported
    by developers. It is even that it requires more testing, and the errors always
    show when applications are finally run.

    * Developed Database Layers: As compared to technologies like JDBC and ODBC, Python’s
    database layer is found to be bit undeveloped and primitive. However, it cannot
    be applied in enterprises that need interaction of complex data.


    ## PCAP: Essentials in Python


    Python is a general-purpose programming language used to build anything. Python
    is key for backend development, data analytics, artificial intelligence, and scientific
    computing, all of which are key for pursuing careers. With PCAP: Essentials in
    Python, you learn to design, write, debug, and run programs in the Python language.
    No prior programming knowledge is required. The course begins with the basics,
    guiding you by step until you become adept at solving complex problems. The course
    aligns to the PCAP – Python Certified Associate Programmer, validating your expertise
    to employers and expanding your IT and IoT opportunities.


    * Develop a working knowledge for how computers operate and how computer programs
    are executed.

    * Evolve critical thinking and problem-solving skills using an algorithmic approach.

    * Learn about the programmer’s role in the software development process.

    * Translate real-world issues into computer-solvable problems.

    * Connect with the global Cisco Networking Academy community.


