  trans: '

    初创企业的理想选择—— 时间和预算对于公司中的任何新产品或服务都是至关重要的限制，对于初创公司更是如此。人们可以使用任何语言创建出与众众化的产品。然而，为了快速开发、更少的代码和更低的成本，Python
    是理想的语言。Python 可以轻松扩展任何复杂应用程序，并由小团队处理。你不仅可以节省资源，还能通过 Python 向正确的方向开发应用程序。


    资源和测试框架的无限可用—— 如今有多种 Python 资源，且这些资源正在不断更新。因此，Python 开发者很少遇到瓶颈。庞大的标准库提供了内置功能。其内置测试框架能够实现快速的工作流并缩短调试时间。


    热门需求—— 如今，Google、Yahoo、IBM 和诺基亚等顶级 IT 公司都在使用 Python。在所有编程语言中，它在过去几年中经历了惊人的增长。


    # 第三章：学习 Python 的优缺点


    Python 是一种高级、解释型且通用的动态语言，侧于代码的可读性。与 Java 或 C++ 相比，Python 的语法帮助程序员用更少的步骤编写代码。


    Python 因具有多种编程范式，在大公司中被广泛使用。它们通常涉及命令式和面向对象的函数程序。它拥有全面且大型的标准库，具有自动内存管理和动态特性。


    ## 为什么公司偏好 Python？


    近年来，Python 在编程排行榜上超过了 C、C++ 和 Java 等其他编程语言，并被程序员广泛使用。自 25 年前发布以来，该语言发生了巨大的变化，引入了许多附加功能。Python
    1.0 拥有 Modular-3 的模块系统，并带有各种功能工具与 Amoeba 操作系统交互。2000 年引入的 Python 2.0 具有垃圾回收和 Unicode
    支持功能。2009 年引入的 Python 3.0 具有建设性设计，避免了重复的模块和结构。随着功能的增加，现在公司正在使用 Python 3.5。


    软件开发公司偏好 Python 语言是因为其多功能特性和更少的代码。接近 14% 的程序员在 UNIX、Linux、Windows 和 Mac OS 等操作系统使用它。大公司的程序员使用
    Python 是因为它在软件开发中通过以下特性确立了自己的地位：


    * 交互式

    * 解释型

    * 模块化

    * 动态

    * 面向对象

    * 可移植

    * 高级

    * 可在 C++ 和 C 中扩展


    ## Python 的优势或好处


    Python 语言在软件开发中有多种应用，如游戏、Web 框架和应用程序、语言开发、原型设计、图形设计等。这使得该语言比行业使用的其他语言具有更多优势。它的优势包括：


    * 广泛的支持库：它提供了一个大型标准库，包括字符串操作、互联网、Web 工具、操作系统接口和协议等领域。大多数高频编程任务都可以轻松地编写脚本，这限制了在
    Python 中需要编写的代码长度。

    * 集成功能：Python 集成企业级应用，通过调用 COM 或 COBRA 组件轻松开发 Web 服务。它直接通过 C、C++ 或 Java 进行调用，因此具有强大的控制能力。Python
    还可以处理 XML 和其他标记语言，因为可以通过相同的方法在所有现代操作系统上运行。

    * 程序员效率：该语言具有广泛的支持库和整洁的面向对象设计，在使用 Java、VB、Perl、C、C++ 和 C# 等语言时，将程序员的效率提高了两到十倍。

    * 生产力：它的过程集成功能、单元测试框架和增强的控制能力有助于提高大多数应用程序的速度和生产力。它是构建可扩展的多协议网络应用程序的极佳选择。


    ## Python 的局限性或缺点


    Python 具有各种优势特性，程序员偏于这种语言而非其他编程语言，因为它容易学习和编码。然而，这种语言在某些计算领域（包括企业开发领域）尚未立足。因此，这种语言可能无法解决某些企业解决方案，一些局限性如下：


    * 使用其他语言困难：Python 爱好者习惯了它的特性和丰富的库，因此在学习或使用其他语言时面临问题。

    * 移动计算薄弱：Python 有许多平台，但对于移动计算来说较弱。这就是为什么很少应用程序是用它构建的。

    * 速度慢：Python 通过解释器辅助运行而不是编译器，这导致它在正常工作时变慢。另一方面，可以看到它在 Web 方面非常快。

    * 运行时错误：Python 语言是动态的，有很多开发者报告。这意味着它需要更多的测试，而且错误总是在应用程序运行时显示。

    * 数据库层：与 JDBC 和 ODBC 等技术相比，Python 的数据库层被发现开发不足且原始。然而，它无法应用于需要复杂数据交互的实体。


