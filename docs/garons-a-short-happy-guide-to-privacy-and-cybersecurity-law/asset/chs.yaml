  \n\n\n\n\n\n\n\n\n\n\n## 3. 行为广告的监管\n\n\n\n\n\n\n\n\n\n\n\n\n\n## C. 遗传信息\n\n\n\n\
  \n\n\n\n1\n\n\n第 1 章\n\n引言\n\nA. 隐私的现代含义\n\n隐私是“不受打扰的权利”，但它的意义远不止于此。隐私是《联合国人权宣言》中列出的基本权利之一。它保护个人免受政府不当监视和搜查、免受对婚姻和避孕个人选择的干扰、免受个人信息未经授权公开，以及免受雇主、贷款人和保险公司对信息的滥用。尽管隐私是一项基本权利，但它也是一项有条件的权利，这意味着隐私权必须与其他基本权利之间取得平衡。例如，隐私权通常与言论自由并列。针对政府搜查和查押的保护与国家的警察权力及其建立正当理由获得搜查令的能力之间取得了平衡。\n\
  \n隐私法通过两种不同的方法运行。某些隐私法阻止一方获取受限信息。其他隐私法则阻止一方将信息用于未经授权的用途。同一项法律可能兼顾两者。\n\n例如，律师客户优惠防止刑事程序中的控诉方强制律师向检察官披露有关其客户的机密信息。通过这种方式，政策阻止了检察官获取信息。同时，律师客户优惠规则限制了律师使用从客户处获取信息的权利。即使律师想这样做，也不能向检察官披露这些特权信息，而且如果这些特权信息对客户不利，律师也不能在其他事务中使用这些信息。\n\
  \n\n\n\n相比之下，监管医疗隐私的法律禁止医院披露患者信息，除非获得患者批准，或属于医院治疗、计费或医疗保健义务的一部分。这些法律阻止了医疗保健机构使用其从患者处获得的信息。然而，健康隐私法并没有阻止报纸发布其可能通过各种采访获取的关于某明星运动员的健康信息。\n\
  \n隐私法的制定还针对特定的群体，例如政府、雇主、商业企业或普通公众。例如，宪法《**权利法案**》（`Bill of Rights`）以及许多州法律和联邦法案侧重于阻止政府侵犯美国公民的隐私。许多联邦和州法规侧重于商业企业（包括贷款机构和金融服务公司、保险公司、医疗机构和媒体公司）对信息的使用或滥用。\n\
  \n某些法律侧重于双方之间预先存在的秘密关系，例如神职人员与信徒之间的关系、律师与客户之间的关系，或医生与患者之间的关系。此外，还有普通法隐私规则，关注双方之间的私人行为。\n\
  \n许多法律关注商业企业如何收集、处理、利用和销售其访客、客户、委托人和患者的个人信息。这些法律在描述法律所涵盖的企业时有时会有不同。只要一家公司受隐私法的监管，该监管就会延伸到法律实体以及公司的员工和管理层。如果一家公司被限制披露其客户的个人信息，那么该公司的每个所有者、经理、高管和员工也都被限制出于法律禁止的任何目的披露个人信息。\n\
  \n健康隐私法倾向于分别规定医生、医护人员和平民。这是因为医院赋予医生特权，但并不一定聘用这些医生。医院提供的许多医疗服务是外包给不属于医院雇佣的医疗小组的。4\
  \ 为了确保每个能够接触医疗记录的人都受到隐私法的保护，隐私规定指出患者护理、计费、编码和保险过程中的每个人、每个实体都受到相似的数据隐私和安全义务的约束。\n\
  \n## B. 隐私及其起源\n\n### 1. 美国宪法隐私\n\n美国隐私保护最强有力的方面是为了应对英国对殖民地而产生的。在私人住所和其他场所驻扎军队以及导致革命战争爆发之前的其他王室侵入行为，凸显了保护公众免受政府无限权力的必要性。这些教训直接导致了宪法《**权利法案**》（`Bill\
  \ of Rights`）中体现的对此类政府侵入的宪法保护。\n\n`第四修正案**（`Fourth Amendment`）的制定目的是保护“免受任意搜查和查封”，要求只有在建立理由后才签发搜查令。在令状中，必须对搜查地点和查封的物品或人员具有具体性。\n\
  \n`第五修正案**（`Fifth Amendment`）有两个条款，每个条款都提供了形式的隐私保护。第一条保护刑事被告“在任何刑事案件中被强迫反对自己的证人”，另一条则确保任何人在“没有正当法律程序的情况下被剥夺生命、自由或财产”。\n\
  \n`第一修正案**（`First Amendment`）对言论、宗教和结社保护也是隐私的形式。任何可以要求拥有印刷机获得许可，或坚持在出版书籍、报纸或小册前获得批准的政府，都会非常直接地侵犯作者的隐私。同样，人与其神之间的关系\
  \ 5 可能是最亲密的关系之一。`第一修正案`保护免受对隐私区域的严重侵入。\n\n`第九修正案**（`Ninth Amendment`）将所有未明确授予联邦政府的权利保留给人民。`第九修正案`还明确了，宪法中缺乏保护特定权利的声明并不意味着该权利不再存在。\n\
  \n《**权利法案**的范围和影响随着内战后修正案的通过而大大扩大。`第十三修正案**（`Thirteenth Amendment`）废除了奴隶制，`第十五修正案**（`Fifteenth\
  \ Amendment`）赋予了黑人投票权。\n\n`第十四修正案**（`Fourteenth Amendment`）是重建时期修正案中影响最广泛的。它规定，“任何州不得制定或执行剥夺美国公民特权或豁免权的法律；亦不得在没有正当法律程序的情况下剥夺任何人的生命、自由或财产；或拒绝在其辖范围内的任何人获得法律的平等保护。”法院缓慢应用`第十四修正案`，将《权利法案》扩展到各州，并在某些情况下确立了隐私权的宪法。尽管`第十四修正案`于\
  \ 1868 年颁布，但其许多影响并未真正感受到。\n\n在`卡茨诉美国诉案 (Katz v. United States, 1967)` 中，最高法院推翻了\
  \ 1928 年关于窃听的判决，认定`第四修正案`创造了合理的隐私预期，且这种隐私预期不仅适用于物理搜查，也适用于电子搜索。由于合理的隐私预期，政府只有在满足获得搜查令的法律要求时才能克服这种预期。重要的是，法院还将隐私焦点从住所等场所转移到了人的\
  \ 6 隐私上。在协庭意见书中，马尔大法官总结并重新构述了`第四修正案`中体现的宪法隐私保护，他解释道：“从之前的判决中演变出来的规则是双重要求的：首先，个人必须表现出实际的（主观）隐私预期，其次，这种预期是社会准备好承认为‘合理的’。”马尔大法官对合理隐私预期的公式为理解《权利法案》的作用提供了现代框架。虽然某些宪法案件偏离了这一公式而关注被搜查的地点，但关注主观预期及其在公众中普遍接受的双重方法为适应现代技术和新的监控形式提供了最灵活的工具。\n\
  \n### 2. 决策隐私、自主性和个人选择\n\n关于政府利用窃听和其他形式监控的法学的一个分支，是政府将某些类型的行为犯罪化。这些案件代表了隐私法与更广泛的公民自由之间的交汇，但从历史上看，最高法院通常将其表述为对处于州权力范围之外的私人行为的判定。`第一修正案`下的言论自由案件是一个明确列出的宪法权利示例，即防止政府干涉个人的决策。然而，这些示例中的大多数并没有这样明确地体现在《**权利法案**》中。\n\
  \n7 \n\n\n\n\n\n第一个关于决策隐私的案件是 `Griswold v. Connecticut` (1965)，最高法院推翻了康涅狄格州一项将使用避孕措施定为犯罪的法律，其违反了“婚姻隐私”。法院解释道：“权利法案》中的特定保障具有阴影，这些阴影由这些保障的衍射形成，有助于赋予它们生命和实质内容。不同的保障创造了隐私区域。”法院发现，婚姻的亲密和神圣涉及一种“比《权利法案》更古老的隐私权”，尽管这项权利并未体现在宪法中。除了婚姻，最高法院还承认生殖、避孕、子女养养教育以及家庭关系都受到宪法隐私概念的保护，这种概念限制了政府的干预。\n\
  \n随之后的是 `Roe v. Wade` (1973)，这是一起关于堕胎权的里程碑式案件。该案的上诉人阐述了选择堕胎的权利，“存在于第十四修正案正当程序条款所体现的个人‘自由’概念中；或者正如\
  \ `Griswold v. Connecticut` 所述的，受《权利法案》或其阴影保护的个人婚姻、家庭和性隐私中”。罗诉法院关注女性在就维持或终止怀孕方面做出个人决定的隐私权。然而，法院也明确，隐私权“不是绝对的，并受到某些限制；而且在某些时刻，国家在保护健康、医疗标准和胎儿生命方面的利益将占据主导地位。”\n\
  \n在 `Lawrence v. Texas` (2003) 中，法院利用 `Griswold` 的先例和第十四修正案关于自由的语言，扩大了反对政府干预反同恋性交行为法律以及监管自愿性活动法律的保护。\n\
  \n包括丹尼尔·索洛夫和保罗·塞昆达教授在内的隐私学者将这一隐私领域总结为“决策隐私”，因为它关注政府对个人私事务的侵入。决策隐私代表了对个人自主的保护，可以被框架为第十四修正案所保护的自由的一部分，也可以属于第九修正案所保护的未说明权利的范围。各种法学方法通常界定得非常窄，但其实际意义很明确：关于婚姻、性和家庭的私人个人选择是宪法保护的。\n\
  \n最高法院在 `Obergefell v. Hodges` (2015) 中的裁决为同性婚姻提供了宪法保护，它强调了 `Lawrence` 的自由方面，而非其隐私保护。`Obergefell`\
  \ 中的反对意见部分表示反对，是因为国家对婚姻的承认是一种公共行为，这与受隐私保护的权利完全相反。`Obergefell` 裁决有助于根据基于第十四修正案体现的自由权以及与\
  \ `Griswold` 相关的私人决策权来区分基本权利。\n\n决策自主权可以理解为代表与 `Griswold` 和 `Lawrence` 关联最紧密的最高法院裁决路线，包括\
  \ `Griswold` 中依赖的裁决以及 `Lawrence` 之后的裁决。它代表了隐私中一小部分但重要的部分，核心是个人拥有免受政府对其在宗教、婚姻、性和育儿等个人生活选择中干预的权利。在大多数领域，决策隐私关注人际关系的非公开方面，以及该个人将政府排除在决策过程之外的权利。\n\
  \n## 3. 普通法隐私\n\n隐私法在 19 世纪通过普通法演变、州法律和国会行动继续发展。美国的发展见证了更大程度的城市化和工业革命的诞生，每一者都改变了国家的社会动态。这些变化使得隐私成为了一项更重要的法律权利。19\
  \ 世纪 30 年代，纽约和其他州开始承认医生-患者特权。1872 年，国会通过了一项法律，除非符合第四修正案，否则禁止邮政部门开启一等邮件。\n\n尽管有许多不同的州和联邦法律承认某些类型的信息不应被共享，但萨缪尔·沃伦（Samuel\
  \ Warren）和路易斯·布兰迪斯（Louis Brandeis）于 1890 年发表《隐私权》，将一套非常分散的州和联邦政策转变为一个现代法律领域，以应对即将到来的技术时代。\n\
  \n在他们的文章中，沃伦和布兰迪斯认为，有时有从普通法中定义新的法律保护。他们关注横扫内战后美国的工业革命，写道：“[最]近的发明和商业模式要求人们关注为了保护个人而必须采取的下一步，并为个人确保……‘不受打扰’的权利。”他们强调了对以下问题的担忧，“许多机械设备威胁着使一个预言变成现实，即‘衣柜里低语的话，将在屋顶上宣扬’。”\n\
  \n沃伦和布兰迪斯通过指出第五修正案对反对自罪的保护以及联邦和州的版权法，建立了他们关于预先存在的隐私法的论点。那些版权法赋予了作者和艺术家对其出版前表达的绝对控制权，外，对出版作品的利用拥有\
  \ 10 项重要的控制权。沃伦和布兰迪斯认为，出版前的法律保护比出版后的保护强得多一定是有原因的，他们提出了几种理论。他们认为，版权法证明了普通法对保护作者未发表思想隐私的兴趣，无论这些作品最终注定要作为文学作品出版，还是作为私人信函保密。他们进一步认为，普通法中关于违约的方法以及涉及商业秘密的贸易法规，展示了法律作为普通法下的一项主题在加强隐私保护的案例。\n\
  \n沃伦和布兰迪斯的文章既增强了作为论点基础的商业秘密、违约法和版权法的法律地位，又发展了对侵犯隐私的直接普通法或成文保护。通过法律和法院裁决，沃伦和布兰迪斯的论点最终创造了大量的法律支持。\n\
  \n尽管纽约上诉法院不愿意承认沃伦和布兰迪斯所述的隐私权，但乔治亚州最高法院在 `Pavesich v. New England Life Ins. Co.`\
  \ (1905) 中承认了这一点。原告的照片在未经其许可的情况下被用于人寿保险广告。乔治亚州最高法院采纳了沃伦和布兰迪斯的论点，发现普通法一直保护个人寻求从公共生活中隐避开的权利，并且一个人有权控制围绕其活动的公开性。\n\
  \n\n\n\n自由包括按照自己的意愿生活的权利，只要这种意愿不干扰他人的权利或公共利益。人们可能渴望过隐居的生活；另人可能渴望过公开的生活；还有人可能希望在某些事务上保持隐私，而在另一些事务上公开。有人可能希望过上辛碌的生活，其工作性质使其经常处于公众的目光之下；而另人则可能希望过研究和沉思的生活，仅在实际生存所必需的时间和情况下才出现在公众面前。每个人都有权对自己的生活方式享有选择的自由，无论是个人还是公众都没有权利任意剥夺这种自由。\n\
  \n公众认同佐治亚法院采取的方法，而不是纽约州法院的方法。在纽约州上诉法院做出裁决后的两年内，纽约州颁布了第一部成文公开权法，该法对违规行为同时规定了民事侵权和刑事轻罪的处罚。\n\
  \n这种全国性的趋势仍在持续。《侵权法重述》（Restatement of the Law of Torts § 867）规定，“任何人若不合理且严重地干扰他人不愿事务被他人知晓或肖像向公众展示的利益，则应对对方承担责任。”该侵权行为不同于侵入或诽谤，且不要求违反某种保密关系。\n\
  \n## 4. 二十世纪的隐私权\n\n在沃伦和布兰迪斯的文章发表 70 年后，另一篇关于该主题的里程碑式法律评论文章发表了。加州大学伯克利分校法学院院长、教授威廉·普罗塞尔重新审了普通法的演变，并试图为这一缺乏形式化初步（prima\
  \ facie）法律方法的学说引入秩序和结构。\n\n尽管普罗塞尔对沃伦和布兰迪斯持批评态度，但他指出，在他 1960 年的文章发表时，只有三个州拒绝了隐私权。随后，普罗塞尔将法律体系分为构成隐私权基础的四种不同的诉讼理由，试图阐明每种诉由的标准。到\
  \ 1977 年，普罗塞尔对隐私法的修订理解被采纳进《侵权法重述（第二版）》（Restatement (Second) of the Law of Torts\
  \ § 652A）：\n\n(1) 侵犯他人隐私权的人，对他人利益遭受的损害承担责任。\n\n(2) 隐私权受到以下行为侵犯：\n\n(a) 不合理地侵入他人的隐私；\n\
  \n(b) 挪用他人的姓名或肖像；\n\n(c) 对他人的私人生活进行不合理的公开；或\n\n(d) 使人在公众面前不合理地处于虚假光环（false light）的公开。\n\
  \n普罗塞尔四种诉讼理由中的前两种是经佐治亚州最高法院承认的，而对他人私人生活进行不合理公开的侵权行为和虚假光环侵权行为，都是普通法发展下对普通法权利的扩张。\n\
  \n这四种隐私侵权行为都在持续发展。此外，正如下文讨论的，第一修正案的发展对这些普通法规则增加了重大的限制，往往在言论自由与不不受扰的权利之间形成对比。\n\n\
  ## C. 二一世纪的隐私权\n\n正如工业革命预示了 1890 年沃伦和布兰迪斯“隐私法”的发展，信息时代增长引发的社会变化带来了一种不同形式的“不不受扰的权利”。这些需求基于技术能够通过日益复杂的数据库、分析和人工智能来识别、追踪和整理数据。\n\
  \n### 1. 联邦部门隐私权\n\n美国社会仍处于信息时代的相对早期。计算机行业、互联网、移动通信和数据网络的发展导致了社交媒体、智能机器、机器人以及许多其他变化，所有这些都依赖于大量的个人信息来运行。\n\
  \n这些技术通过州和联邦法律的发展以及普通法学说的建立引发了新的应对。从 20 世纪 70 年代开始，国会颁布了一系列法律，以促进特定行业或经济部门个人信息和数据的隐私：\n\
  \n*   《联邦隐私法》（Federal Privacy Act）防止联邦收集的公共数据被滥用；\n*   《家庭教育权利与隐私保护法》（Family Educational\
  \ Rights and Privacy Act）保护学生记录；\n*   《公平信用报告法》（Fair Credit Reporting Act）防止消费者信贷信息的滥用和剥削；\n\
  *   《视频隐私保护法》（Video Privacy Protection Act）和《电缆通信政策法》（Cable Communications Policy\
  \ Acts）阻止公开个人的媒体消费历史；\n*   《格雷姆-莱奇-布莱利法》（Gramm-Leach-Bliley Act），又称《1999 年金融现代化法》，要求就金融机构共享消费者数据进行通知；\n\
  *   14\n*   《健康保险流通性与责任法》（Health Insurance Portability and Accountability Act），包括《HIPAA\
  \ 隐私规则》和《HIPAA 安全规则》，旨在确立医疗行业保护个人和受保护健康信息的义务；以及\n*   《儿童在线隐私保护法》（COPPA）限制对 13 岁以下儿童个人信息的收集和使用。\n\
  \n这些联邦法律引发的担忧以及信息时代的数据消费类型，较少关乎通过报纸向公众侵入个人隐私，更多是关于对收集的个人活动和购买数据进行使用或滥用，这些数据被出售给数据经纪用于不当目的。\n\
  \n随着法律在州和联邦层面的演变，其重点首先是向消费者告知收集数据的用途，其次是建立标准，以确保所收集的数据不被盗窃或用于欺诈或非法目的。这些法律仍处于发展阶段。它们包含了强制性的隐私通知和强制性的数据泄露披露要求。\n\
  \n某些州（如加利福尼亚州）要求与加州居民开展业务的每家企业必须公布隐私政策。州和联邦法规都要求公司遵循其公布的隐私政策。州和联邦法规的结合使得大多数美国企业必须公布隐私政策。跨国公司还必须遵守基于欧洲客户或在欧洲国家存储数据的法规。\n\
  \n某些州（如伊利诺伊州）通过了专门法律，要求在收集生物识别数据时获得额外的消费者同意，包括指纹、DNA、面部特征、视网膜模式、语音以及类似的标识符。\n\n\
  二十世纪对侵入隐私的保护仍然适用于现代的数据滥用情况。不幸的是，二十世纪侵权行为的权利和救济措施并不总是适应二十一世纪的行为。州和联邦政府不再依赖普通法的缓慢演变，而是颁布了专注于隐私信息剥削最可能造成经济或个人损害的领域的法律。\n\
  \n\n\n这种方法被称为“行业部门隐私”，因为每个行业或经济部门都有其自身的法律。这些法律差异很大。例如，银行仅被要求告知消费者其数据隐私实践。客户在接受或拒绝所提供的隐私条款时，选择范围非常有限。相比之下，医疗保健机构在共享有关患者的某些健康信息方面受到严格限制，如果未能保护患者的健康信息，它们将面临巨额罚款。其他行业部门则处于这两个监管领域之间的中间。\n\
  \n根据各种州法律和联邦法律，部门信息信息隐私已扩展到机密性之外，还包含了维护信息完整性的义务，在某些情况下，还要求纠正不准确的数据。在某些部门中，收集个人身份信息的权利包含了保护该数据安全并确保其准确性的义务。\n\
  \n## 2. 数据隐私法下的个人信息\n\n隐私法涵盖的个人身份信息与隐私法规的类型一样，差异也巨大。个人信息没有统一的定义，因为该定义取决于具体的法律。美国劳工部提供了以下总结作为实用指南：\n\
  \n个人身份信息（`PII`）定义为……任何信息表示形式，能够通过直接或间接手段合理推断出适用信息的个人身份。此外，`PII` 定义为信息：(i) 直接识别个人的信息（例如姓名、地址、社会安全号码或其他识别码或代码、电话号码、电子邮件地址等）；或\
  \ (ii) 机构旨在与其他数据元素结合识别特定个人的信息，即间接识别。（这些数据元素可能包括性别、种族、出生日期、地理指标和其他描述符的组合）。\n\n这些单独的信息在许多部门隐私法中很常见。在将这些信息项视为隐私时，也存在显著的例外。例如，《家庭教育权利与隐私法》（`FERPA`）法规对“目录信息”有一个例外，指的是学校或学区可能会发布的信息。学校曾定期发布目录，以便家长和学生可以互相联系。该目录信息通常包括姓名、地址、电话名录、年龄、年级、参加官方认可的活动和体育运动以及入学日期。这允许学校在推广其运动队和宣传学生成就时，而无需在发布每份新闻稿和年鉴之前或在更新网站之前寻求许可。\n\
  \n对于非 17 所学校或不属于 `FERPA` 的机构所收集的 13 岁以下儿童信息，`COPPA` 的规则则非常不同。`COPPA` 下的个人信息包括以下内容：\n\
  \n* 姓和名；\n* 家庭地址或其他物理地址，包括街道名称和城市或城镇名称；\n* 在线联系信息；\n* 作为在线联系信息的屏幕名称或用户名；\n* 电话号码；\n\
  * 社会安全号码；\n* 可随时间推移并跨不同网站或在线服务识别用户的持久标识符；\n* 照片、视频或音频文件，其中文件包含儿童的图像或声音；\n* 足以识别街道名称和城市或城镇名称的定位信息；或\n\
  * 运营商在线从儿童处收集并与上述标识符结合的有关儿童或其父母的信息。\n\n在实践中，这意味着小学可以在其网站上发布由学生演出的戏剧照片（并在拍摄时标上学生姓名），因为这属于\
  \ `FERPA` 下的目录信息，但童子军（Cub Scouts）或女童军（Brownies）则需要每位家长的许可才能发布相同的照片和说明。尽管个人信息是相同的，但管辖法律以不同的方式定义了法律范围和例外。\n\
  \n要确定信息是否受隐私法的保护，寻求使用该信息的公司或组织（企业）通常必须回答四个问题：\n\n1. 哪些法规适用于该企业？\n2. 企业希望使用的信息是什么？\n\
  3. 企业是如何获取这些信息的？\n4. 企业将如何使用这些信息？\n\n通过遵循这四个问题提供的答案，企业将知道其在多大程度上可以使用已收集的信息。企业可以自由使用和销售任何未受部门隐私法保护、或未受机密法、合同法或商业秘密法保护的信息。如果企业受一项或多项数据隐私法的管辖，则必须获得出售或披露该信息的许可，除非该出售或披露属于法律规定的隐私规定的特定例外。在某些情况下，出售或披露信息的权利需要被信息识别的人员同意。\n\
  \n最后，由于企业有义务不出售或披露个人信息，企业还有责任保护信息免受意外泄露、盗窃和第三方发布。保护收集的个人信息不被泄露的义务需要足够的安全措施来防止信息丢失或被盗窃。因此，隐私法也延伸到了网络安全法。\n\
  \n## 3. 网络安全的现代含义\n\n由于商业实体被要求遵守其公布的隐私政策，且许多部门的政策受与收集、保护和使用个人身份信息相关的特定隐私法管辖，现代隐私法还包含了大量的网络安全。\n\
  \n保护个人身份信息意味着保护存储、传输和利用信息的系统。这适用于计算机、移动设备、网络、路由器、服务器和其他系统，无论是连接到互联网还是独立运行。它要求软件保持更新，以便及时纠正软件中所有已漏洞、缺陷或错误。它要求系统使用密码和其他手段防止未经授权的人进入企业系统，并预测潜在入侵者使用的技术。\n\
  \n网络安全可以被认为是企业必须承担的合理义务，以确保其收集的信息不会被企业内部人员或外部第三方滥用。网络安全要求概述了确保数据持续机密性、完整性和可用性的步骤。\n\
  \n根据 `HIPAA` 安全规则，网络安全通常组织分为三个独立的领域：物理保护、技术保护和管理保护。物理保护涉及设施及其信息网络的物理资产。如果小偷从汽车中偷走笔记本电脑，该盗窃可能导致数千或数百万受保护的医疗保健或财务记录潜在泄露。如果不满的员工从公司业务中心移除服务器，盗窃可能涉及数百万的财务账户。因此，对建筑和设备的物理保护是任何网络安全计划的必要第一步。\n\
  \n\n\n\n# 技术防护与网络安全\n\n技术防护通常是人们最常描述为网络安全的步骤。技术防护可能包括使用加密、防火墙、多因素身份验证、渗透测试、监控流量的网络日志以及其他技术解决方案，以增加未经授权个人访问存储在系统中的数据的难度。更新的技术对于防止黑客和其他入侵者引入可能损害、盗取或使企业系统面临被盗窃、破坏或勒索风险的软件至关重要。\n\
  \n管理性防护是有效网络安全计划的第三大特征。这些政策和实践确保企业能够以战略性和有效的方式执行其网络安全政策。管理性防护要求网络安全是企业内的首要任务，并获得足够的资金和人员配置来实现目标。管理性防护建立了相关政策，要求需要进行最新的软件升级以消除已知漏洞；对所有人员进行身份验证最佳实践的培训；将敏感信息的访问限制在需要使用该信息的最小员工群体内；要求人员离职程序以便及时关闭账户；以及采取其他措施确保严格遵守物理和技术防护，并最大限度地降低风险。\n\
  \n企业要建立成功的网络安全系统，必须了解自己收集了哪些信息、信息存储在何处以及如何使用。随后，企业必须建立政策和程序来物理保护其资产，使用适当的技术保护其系统，培训员工，并将不断更新和升级这些工作作为组织的核心竞争力。如果公司做到了这一点，就能应对面临的不可避免的挑战。\n\
  \n例如，由于笔记本电脑经常丢失或被盗，最好不要使用笔记本电脑存储某些数据，如医疗和财务记录。在允许使用笔记本电脑的情况下，人员应接受培训，不要将笔记本电脑留在公共可见的汽车座椅上。更重要的是，企业应对所有笔记本电脑进行加密，这样当电脑被盗时，数据无法被轻易访问。此外，企业应该对笔记本电脑和移动设备包含远程数据擦除功能，以便远程删除被盗数据。总之，这些技术和物理防护有助于减少和缓解风险。该示例强调，企业必须结合管理政策、培训、技术措施和物理措施来实现网络安全。\n\
  \n网络安全应根据企业规模和所涉及风险的性质进行适当调整。小企业通过简单避免收集不必要的个人身份信息来获得最好。通过减少保留的信息量，小企业也将减少其损失风险。相比之下，医院必须收集大量受\
  \ `HIPAA` 监管的信息，这包含了对数据隐私和安全最严格的联邦法规。每个企业必须根据自己的特定情况做出反应。\n\n## 理解隐私法律的实用方法\n\n\
  信息隐私、决策隐私、免受政府监控的保护以及普通法隐私都有共同的根源，并且它们在某些情况下可能都会发挥作用。在处理隐私冲突时，分析通常从识别冲突双方开始。如果是针对个人的州级或联邦刑事诉讼，那么我们必须首先查看哪些宪法或成法限制限制了政府收集有关被告信息的权力。即使事实相同，如果案件涉及针对被告的民事或行政诉讼，政府所面临的限制可能会更少。\n\
  \n如果冲突涉及商业或非营利企业公开个人身份信息，那么该冲突可能会受该特定行业通过的法律管辖。在此类冲突中，如果披露涉及医疗保健机构或贷款机构，则原告更有可能获得法律保护，因为这些法律比其他部门更具保护性。如果披露是通过数据泄露发生的，那么其他州级法律也可能对数据被不当披露的个人提供某些保护。如果信息是由报纸披露的，那么普通法隐私权可能适用。在每种情况下，隐私权都存在例外。\n\
  \n### 案例研究：索尼影业泄密事件\n\n例如在 2014 年，恶意软件被秘密植入 `Sony Pictures` 的软件中。该软件至少两个月内未被发现。在此期间，该软件允许黑客从索尼复制了大量数据。在黑客公开的当天，他们发布了未上映电影、邮件往来、财务记录和其他数据。黑客使用了“和平守护者”（Guardians\
  \ of Peace）的名称。黑客要求索尼停止上映即将推出的电影《会面》（The Interview），该电影对朝鲜领导人金正恩进行了讽刺和喜剧性的描绘。尽管朝鲜声称其对索尼数据泄露不负责，但它将该电影的发布为“战争行为”。伴随数据泄露黑客的恐怖威胁最初导致了电影取消上映，但对国际审查的担忧导致电影最终小规模上映。\n\
  \n泄露邮件中的往来导致索尼影业联合主席 `Amy Pascal` 因发布了与会见时任总统 `Barack Obama` 会议相关的内容而辞职。该制片厂的前员工起诉要求保护个人身份信息，包括社会安全号码和医疗保健信息。演员查尔斯·希恩（Charlie\
  \ Sheen）的艾滋病阳性健康状况被黑客获取，并可能导致了他公开自己诊断结果的决定。\n\n这些示例强调了普通法在侵犯隐私方面的持续相关性、防止披露受保护身份信息的成法保护保护，以及网络安全失败的后果。尽管\
  \ `FBI` 和其他机构进行了调查，但该事件从未提起刑事指控。尽管如此，这些刑事法规定了 `FBI` 如何运作以试图获取有关攻击的信息，以及哪些法律限制了其调查工作。\n\
  \n最终，据报道索尼以约 1500 万美元和解了诉讼。《会面》对收入的影响无法轻易计算。（公众关注度可能实际上增加了它的长期回报。）除了索尼公开披露导致的职位流失和关系受损外，公司最初的“调查和修复成本”也列为\
  \ 1500 万美元。\n\n虽然这些金额非常惊人，但该次泄露并不涉及客户数据。相比之下，索尼在 2011 年因 `PlayStation Network` 泄露遭受了估计\
  \ 1.71 亿美元的损失。\n\n虽然针对索尼的攻击非常不幸，但它说明了隐私法律的每个领域如何塑造单一事件的后果。下文的章节将探讨这些法律和实践领域是如何发展的，以及在这个快速变化的领域中如何最好地理解它们。\n\
  \n### 本章要点总结：\n\n- 隐私法在历史上一直作为法律的一部分存在，但随着隐私观念和侵犯隐私技术的改变，其范围已经扩大。\n\n\n\n\n\n宪法中并未明确提到“隐私”一词，但它存在许多宪法权利的阴影中，包括`第一修正案`、`第四修正案`、`第五修正案`、`第九修正案`和`第十四修正案`。\n\
  \n隐私是一个广泛的概念，与个人自由紧密相关，它在四个领域内限制了个人信息的使用：\n\n* 政府为了刑事起诉而收集其公民信息的能力\n* 政府对涉及婚姻、性、堕胎和生育的某些亲密个人选择进行刑事化的能力\n\
  * 媒体和公众披露某些类型个人信息的方式，以及\n* 企业如何销售和分发其收集的客户信息。\n\n尽管隐私是一项基本权利，但它并不是绝对权利。在隐私法保护的每一个领域，隐私利益都必须与其他政府利益取得平衡。\n\
  \n由于企业在他们的计算机系统和网络中收集并存储信息，因此有义务维护网络安全以保护这些信息不被组织内部人员滥用，或被黑客和窃盗者泄露。\n\n### 25\n\n\
  #### 知晓：\n隐私是一项非常老的法律保护，但在 21 世纪它发生了巨大变化，因为新技术需要更新的规则来防止私人信息被违规使用。\n\n隐私保护包括：防止政府对公民采取法律行动的法定和宪法保护；对企业使用收集的客户信息的限制，以及个人如何分享有关邻居的信息。\n\
  \n美国的隐私正在发生变化，曾经关注经济特定部门的法律正在被涵盖更多个人信息的州法律所补充。\n\n虽然隐私是一项基本权利，但还有许多其他基本权利（包括言论自由），这要求法官和立法者平衡这些利益。\n\
  \n#### 思考：\n隐私权从未在宪法中被描述，但《权利法案》中竟多达五项修正案提供了各种形式的隐私保护。为什么起宪者没有直接将隐私作为一项权利来阐述？\n\n\
  为什么`哈兰大法官`将隐私权建立在这样一种预期之上，即隐私利益应该是“社会准备承认其为‘合理’的利益”？如果合理的隐私利益仅限于法律确定的那些，将会会有什么区别？\n\
  \n决策隐私（包括婚姻隐私和性隐私）在多大程度上与防止政府搜查或行为广告的保护具有相同的基础？这些权利是在单一理论下被更好地理解，还是通过使用不同的术语将这些权利区分开来更好地理解？\n\
  \n### 26\n为什么个人信息有许多不同的定义？某些标识符是否应该从个人信息列表中排除？州和联邦法规如何使这一定义对执法至关重要？\n\n### 27\n\n\
  # 第 2 章\n\n## 第四修正案对隐私的宪法保护\n\n## A. 引言\n不受政府侵犯的宪法权利可以通过`第四修正案`的语言以及根据这些权利而发展的法律得到最清晰的理解。`第四修正案`规定了“人民的人身、房屋、文件和财产不受免受合理搜查和没收的权利”。类似的保护措施也被纳入了各州的宪法中。新美国人仍对英国王室政府的滥用行为心惊未定，因此他们不想在新的州或联邦政府中重演同样的滥用可能。\n\
  \n`第四修正案`要求政府必须根据“合理理由”获得搜查令，才能搜查个人的住所、汽车或类似的地点。搜查令的合理理由要求事实和情况提供能够使一个理性的人相信在被搜查的地方发生了犯罪行为，或者该地点存在犯罪证据。搜查令必须同时标明搜查的地点和要没收的物品。\n\
  \n违反`第四修正案`的后果是所获得的信息被排除在针对被告的审判之外。这项政策被称为“排除规则”，它阻碍了警察不法行为的发生，因为它挫败了其违反目标对象宪法权利的目的。\n\
  \n搜查令的要求有许多例外。如果警察获得其希望搜查的财产所有者的同意许可，如果要搜查的物品在视线范围内，或者存在紧急情况，则无证搜查将是合法的。如果个人面临紧迫危险、要没收的物品面临即将被毁的风险或嫌疑人有立即逃跑的威胁，则可能存在紧急情况。\n\
  \n搜查令的要求可能与普通法侵权（trespass）规则以及普通法禁止窃听的规定非常相似。在`银曼诉美国案（1961 年）`中，法院利用侵权类比发现，使用“针头麦克风”穿过墙壁将音频拾音器连接到建筑物的供暖管道上，违反了`第四修正案`。最高法院直到\
  \ 2012 年的`美国诉琼斯案`中仍回到了侵权的类比上。尽管如此，侵权规则仅仅是一种类比。允许无证搜查的例外可能与普通法侵权的例外几乎毫无关系，因此这种类比的使用可能被夸大了。而且即使是一些涉及侵权的案例也没有导致违反`第四修正案`的行为。\n\
  \n此外，侵权在其他情况下是不相关的。`奥因·凯尔`教授解释说，追溯到 19 世纪的案件援引`第四修正案`，要求在法院命令一方移交文件之前必须获得搜查令。在`博德诉美国案（1886\
  \ 年）`中，最高法院发现，移交文件的命令等同于搜查，并受搜查令要求的限制。\n\n### B. 第四修正案下的电子监控\n虽然每一次搜查和没收都是对隐私的侵犯，但搜查和没收法的一般应用属于刑法和刑事诉讼法的学科。然而，电子监控的影响远超刑事法律的具体执法，并代表了信息隐私政策的一个重要元素。\n\
  \n#### 1. 奥姆斯特诉美国案\n最高法院首次在`奥姆斯特诉美国案（1928 年）`中应对现代技术的后果。奥姆斯特案涉及在禁酒令盛行期间利用窃听设备观察并捣毁大规模的私酿酒活动。91\
  \ 名被告因涉嫌《国家禁酒法》被起诉。罗伊·奥姆斯特与其他八名被告一起对窃听证据的引入提出挑战。\n\n奥姆斯特辩称，使用窃听设备偷听其家中（以及律师办公室）内的电话通话违反了其`第四修正案`和`第五修正案`的权利。窃听设备被放置在电线杆和交换站的电话线上。在为期七个月的调查中，至少有五个家庭被安装了窃听设备。\n\
  \n\n\n\n最高法院认定，由于窃听器并未直接安装在房屋内，因此不构成侵入。法院还拒绝了将电话线类比为密封的一等邮件的观点。尽管法院承认“政府特工对密封信件的非法翻阅是对发件人文件或财物品的搜查和扣押”，但政府并不承担类似的“电报或电话消息的保管责任”。因此，法院拒绝将`第四修正案案`应用于在电话线路上听到的内容，尽管警察仅通过其侵入性行为才能听取电话通话的内容。\n\
  \n布兰迪斯法官在反对意见中写道，“与电话线建立物理连接点在何处是无关紧要的”。相反，他强调了侵犯隐私的危害性：\n\n> 侵犯电话隐私所带来的危害远大于干改邮件所带来的危害。每当电话线被窃听，线路两端人员的隐私就会受到侵犯，他们之间关于任何主题的对话——尽管这些对话是正当、机密且享有特权的——也可能被窃听。此外，窃听一个人的电话线意味着窃听他可能拨打或可能拨打他的每一个其他人的电话。作为间谍手段，与窃听相比，协助搜查令和通用许可证令不过是暴政和压迫的弱小工具。\n\
  \n布兰迪斯法官回到了他的法律评论文章《隐私权》中的主题，解释了在宪法保护的背景下“被不受扰的权利”的含义：\n\n> 我们国宪法的起制定者致力于确保有利于追求幸福的条件。他们承认人类精神本性、情感和智力的意义。他们知道，生活中的痛苦、快乐和满足感只有部分可以在物质财富中找到。他们试图保护美国人的信仰、思想、情感和感觉。他们赋予了人们对抗政府的“被不受扰的权利”——这是最全面的权利，也是文明人最看重的权利。为了保护这一项权利，政府对个人隐私的任何不当侵入，无论采用何种手段，都必须被视为对`第四修正案`的违反。并且在刑事诉讼程序中使用通过此类侵入获得的事实作为证据，必须被视为对`第五修正案`的违反。\n\
  \n尽管布兰迪斯法官的意见仅为反对意见，但它成为了美国`第四修正案`应对无线电和电话变化的基准。国会通过通过的《1934 年通信法》更新了《1927 年无线电法》，这是一项旨在监管电话和无线电的综合性新法律。新法的`第\
  \ 605 条`部分规定，“未经发送者授权，任何人不得拦截任何通信，并泄露或公布此类通信的存在、内容、实质、意图、影响或含义。”\n\n尽管布兰迪斯法官的意见仅为反对意见，但它通过立法制定和宪法解释，成为了美国`第四修正案`思维的基石。\n\
  \n\n\n\n在 Katz 案之后，`通讯法`中的第 605 条不再符合第四修正案，因此对法律进行法定修订是势在必行的。该法律作为《1968 年综合犯罪控制与安全街道法案》的第三部分通过，“**窃听法**”（`Wiretap\
  \ Act`）为使用电子监控设立了搜证令。根据这项法律（该法律至今仍有效，仅经过了少数修正），窃听法不仅禁止截获口头通信和有线通信，还提供了一种寻求法院命令签发窃听或电子监控的机制。\n\
  \n该法律将对拦截电话或电报通信的普遍禁止扩大为对任何形式的口头或有线通信监控的更广泛的禁令。通过这种方式，法律的范围扩大到涵盖 20 世纪 50 年代和 60\
  \ 年代激增的所有窃听设备。\n\n1986 年，该法律从有线和口头通信扩展到所有电子通信。1998 年，它进一步扩展到涵盖电子邮件和其他形式的存储型电子通信。随后，在\
  \ 9·11 美国遭受恐怖袭击之后，该法通过《美国爱国者法案》及后续法律的修订进行了修订。然而，这些变化相对较小，规范电子监控的现代法律是在 1968 年的《窃听法》中建立的。\n\
  \n《窃听法》在调和监控法律与第四修正案扩展的宪法保护之间取得了重要的一步。它为执法部门提供了打击犯罪的有效工具，并为民权倡导者提供了一个强大的机制，以限制州和联邦政府非法使用窃听。它禁止截获、披露、使用或招募他人截获或尝试截获通信，除非存在对法院命令要求的例外情况，或者已获准了法院命令。\n\
  \n对窃听的禁令存在例外。例如，该法律免除了电信和通信行业涉及的各种业务运营的禁令，前提是该监控对于提供通信服务是必要的。同样，执法人员可以在授权的窃听中获得的信息披露给其他执法人员或在证词期间披露，前提是该使用或披露“符合做出或接收披露的官员履行公职的适当要求”。\n\
  \n此外，法律允许通信的任何一方同意对对话进行监控或录音。相比之下，某些州法律仅在对话的所有方均同意录音的情况下才允许录音对话。\n\n然而，该法律最重要的部分是关于签发法院命令的规定。`第\
  \ 2518 条`为签发窃听命令建立了一套法定体系。为了有权申请窃听或其他形式的电子监控，政府必须向法官宣誓其正在调查一起刑事重罪案件，证明政府有理由相信该犯罪已经发生或将发生，并识别政府寻求获取的与该犯罪相关的特定通信内容。\n\
  \n该法规列出了可以进行窃听的特定前提罪名。对于不在清单上的犯罪，不允许进行窃听和电子监控访问。自《窃听法》最初通过以来，前提犯罪罪名名单已不断增加，使其对执法部门的限制不再像以前那样大。\n\
  \n36\n\n法院命令的文书要求是严苛的。\n\n每份申请应包含以下信息：\n\n(a)提交申请的调查人员或执法人员的身份，以及授权该申请的官员的身份；\n\n\
  (b)申请人所依据的事实和情况的完整且陈述，以证明其认为应当签发命令的理由，包括（i）有关已发生、正在发生或即将发生的特定犯罪行为的细节；（ii）除第 (11)\
  \ 款规定外，对截获通信的设施或截获场所的性质和位置的特定描述；（iii）对寻求截获的通信类型的特定描述；（iv）如果已知，实施犯罪且其通信将被截获的人员的身份；\n\
  \n(c)对于已尝试过但失败的调查程序，或合理认为尝试将太危险的程序，进行完整且完整的陈述；\n\n(d)拦截所需的持续时间。如果调查性质使得授权在获得描述的通信后不应自动终止，关于有理由相信之后还会发生此类类型通信的事实说明；\n\
  \n37\n\n(e)向法官申请拦截上述人员、设施或场所的有线、口头或电子通信的所有先前申请的事实完整且完整的陈述，以及法官对每一项申请采取的行动；以及\n\n\
  (f)如果申请是延长命令，说明目前为止通过拦截获得的结果，或对未能获得此类结果的合理解释。\n\n法院签发的命令有效期最长三十天。如果调查需要更多时间，则必须重新申请，并向法官通报在此期间监控的有效性。\n\
  \n\n\n\n\n《电子通信隐私法》和《存储线路电子通信法》是两项通常合称为的法律，即《1986 年电子通信隐私法》（`ECPA`）。这些法律的颁布旨在将法律保护范围扩大到所有电子通信，包括电子邮件和发布在计算机网络上的私人内容。`ECPA`\
  \ 将法律范围扩大到了不断演变的现代通信。该法律对故意、未经授权的截获私人电子通信的行为规定了民事和刑事惩罚。它将《窃听法》（Wiretap Act）下的搜令要求扩大到非口语性通信，例如电子邮件、短信和视觉通信。\n\
  \n除了扩大了受 `ECPA` 搜令要求保护的电子通信范围外，它还增加了两个章节（Title），每个章节的法律保护形式都较低。\n\n### 第二部分：存储通信法\n\
  `ECPA` 的第二部分——《存储通信法》，为拦截、复制或以其他方式访问存储的通信提供了民事和刑事保护，这些通信包括电子邮件、公告板消息或存储在云端系统上的私人通信。与《窃听法》保护的通信不同，存储在远程系统（如\
  \ `ISP` 服务器）上的电子邮件和其他通信，可以通过执法部门根据 `§ 2703(d)` 使用的法院命令获取，而该命令不需要“合理理由”。相反，调查人员必须提供“具体且可阐述的事实，证明有理由相信，线路或电子通信的内容，或所寻求的记录或其他信息，与正在进行的刑事调查具有相关性和实质性影响”。这些标准远低于窃听线路或监听邮件通信的搜令要求。\n\
  \n对于个人家用计算机上的电子邮件、传输中的电子邮件及类似通信，以及在远程计算机上存储 180 天或更短时间的未打开电子邮件，仍需要搜令。但如果电子邮件存储在远程计算机上并已打开，或者远程计算机上的电子邮件未打开的时间超过了\
  \ 180 天，那么 `§ 2703(d)` 法院命令就足以让法院发布其命令。\n\n### 第三部分：拨号寄存器与陷阱及追踪\n`ECPA` 的第三部分涉及“拨号寄存器和陷阱与追踪”调查。这些拨号号码记录设备提供有关通信来源和目的的信息，但不提供任何内容。这些信息与电话单的内容非常相似，电话单列出了上个月的通话记录和时长。\n\
  \n在 `Smith v. Maryland (1979)` 案中，最高法院判定陷阱与追踪信息可以被视为第三方商业记录。此类记录不是私人信息，不受《宪法》第四修正案的任何保护。只要政府证明`拨号寄存器`的使用与正在进行的刑事调查有关，调查人员即可获得法院命令。这是发布法院命令最低的标准。\n\
  \n### 《美国爱国法案》\n在 2001 年 9 月 11 日恐怖袭击后，《窃听法》也经过了大幅修订。《美国爱国法案》（`USA PATRIOT Act`，通过提供所需的工具来拦截和阻止恐怖主义以统一和加强美国法）及其在\
  \ 2005 年、2006 年和 2011 年的修正案大大扩大了政府进行监控和在没有公众监督的情况下运作的权力。\n\n《美国爱国法案》增加的大部分法律集中在美国境内的外国情报收集。这些法律允许进行与特定刑事调查无关的扩大监控。该法律还通过对银行和金融机构增加额外义务，显著扩大了反洗钱法规。\n\
  \n《美国爱国法案》扩大了为了获取窃听许可而调查的基础犯罪清单，将其包含了恐怖犯罪和计算机犯罪。该法律还扩大了存储通信规定，包含了语音信箱和视听记录，而不只是电子邮件信息。此外，它扩展了`拨号寄存器`的定义，使其通过电子跟踪设备涵盖非电话电子通信。\n\
  \n## C. 合理隐私预期\n\n### 1. 卡茨诉美国诉案 (1967)\n在判决后的几十年里，最高法院发现维持奥姆斯特判决（Olmstead decision）的立场变得越来越困难。法院和公众对“违宪地物理接入相邻房间的针刺式麦克风”与“可以合宪地从街对面监听房间的抛物麦克风”之间的法律区别并不满意。\n\
  \n20 世纪 60 年代的案件有时涉及使用法院搜令来批准电子监控。各法院在要求执法部门建立使用电子监控所需的“合理理由”和“特定性”方面要求不相同。这些案件在需要获得搜查搜令的情况下批准了录音设备，说明了国会正在辩论的方法。\n\
  \n到 1967 年，最高法院准备好重新评估监控法律。在 `Katz v. United States` 案中，申请人查尔斯·卡茨（Charles Katz）是一名职业博彩者或赌徒。FBI\
  \ 探员观察到他在投注。FBI 租了卡茨隔的一个房间，开始听他在公寓里打的电话。他们还观察他使用由三个电话亭组成的区域，每个电话亭都由玻璃和木头制成，用折叠门关闭。在没有搜令的情况下，FBI\
  \ 在卡茨经常使用的两个电话亭外面贴了麦克风，并将第三个电话亭标记为故障。正如第九巡回上诉法院在维持定决时提到的”，“麦克风是用胶带贴在电话亭外面的。亭内没有发生物理穿透。麦克风仅在上诉人接近并实际上进入亭内时才被激活。”\n\
  \nFBI 获得了一个搜查卡茨公寓的搜令。当卡茨在公寓被搜查后与 FBI 探员会面时，他询问“为什么他不能拿回自己的记录”。他表示，没有这些记录他就无法做生意了，他一生大部分时候都是赔率分析师和博彩者。他建议说，如果能拿回记录，他会继续赌博。\n\
  \n在最高法院的意见书中，法院从未提到卡茨的名字。相反，法院对申请人和被诉人对电话亭的定性表示反对。法院拒绝将物理电话亭视为在使用期间易受非法侵入的对象。法院还拒绝了存在私人场所和公共场所的概念。它解释说，“判断某个特定‘区域’在抽象上是否受‘宪法保护’的努力转移了问题的注意力。因为《宪法》第四修正案保护的是人，而不是地点。”法院从私人通信的地点转向了通信者的意图：\n\
  \n“[申请人]在进入电话亭时想要排除掉的不是侵入的眼睛——而是不请自来的耳朵。他并没有仅仅因为他在一个可能被看到的地方打电话，就放弃了这样做（隐私）的权利。正如在办公室内、朋友公寓或自动缴费亭里电话的人一样，电话亭里的人也可以依靠《宪法》第四修正案的保护。一个进入电话亭、关上后门并支付拨号费的人，完全有权假设他对着麦克风说出的话不会向全世界广播。以更狭义的方式解读宪法，是忽视了公共电话在私人通信中发挥的至关重要的作用。”\n\
  \n\n\n\n\n我们明确主张，第四修正案不仅适用于物物品的扣押，还延伸到对在没有任何“根据……当地财产法构成的技术性侵入”的情况下所听到的口头陈述的记录。一旦承认这一点，并且一旦承认第四修正案保护的是“人”而非仅仅是“区域”免受不合理的搜查和扣押，显而易见，该修正案的范围不能取决于对任何特定封闭空间是否有物理侵入。\n\
  \n卡茨案法院拒绝了政府的辩解，即政府主张该搜查是许可的，因为政府有充分的理由认为其可以获得搜令，或者存在其他例外允许在审判中使用这些录音。\n\n然而，多数意见并未为政府或下级法院的未来决策提供路线图。相反，哈兰法官的列席意见提供了对第四修正案未来格局至关重要的总结：\n\
  \n我对先前的判决中显出的规则的理解是，它包含双重要求：首先，个人必须表现出真实的（主观的）隐私预期；其次，这种预期必须是社会准备认可为“合理”的。因此，对于大多数目的而言，人的住所是他预期拥有隐私的地方，但他所暴露在外部人员“平视”范围内的物体、活动或陈述是不受“保护”的，因为没有表现出将它们留给自己的意图。另一方面，在开放场所的对话将免受窃听的保护，因为在这种情况下对隐私的预期是不合理的。\n\
  \n卡茨案中的大纲和示例作为明年修订和通过《窃听法》的蓝图。哈兰的列席意见在次年的`特里诉俄亥俄州案（1968）`中受到了关注。\n\n## 2. 史密诉马里兰州案（1979）\n\
  \n在随后的十年里，额外的案件帮助塑造了对卡茨案的理解以及第四修正案的范围。在`史密诉马里兰州案（1979）`中，法院总结了十年的判决。与卡茨案一致，法院统一认为第四修正案的适用取决于对任何特定封闭空间是否有物理侵入。正如哈兰法官在意见中所指出的，这种调查包含两个问题：首先是个人是否表现出了真实的（主观的）隐私预期，其次是这种预期是否是政府行为可以“正当的”、“合理的”或“合法的”隐私预期。第二个问题是个人的主观隐私预期是否是社会准备认可为“合理”的——正如卡茨案多数意见所言，从客观角度看，个人的隐私预期是否是“正当的”？\n\
  \n`史密诉马里兰州案`的总结为第四修正案提供了一个清晰的二分法分析，即个人的主观隐私预期是否符合社会规范。尽管隐私的社会规范在随后的几十年中发生了巨大变化，但这种公式为现代法院提供了框架。\n\
  \n## 第四修正案下的泛在化监视\n\n自卡茨案以来，最高法院裁决了更多关于第四修正案的宪法刑事程序法。然而，在过去的十年里，监视性质的变化使最高法院再次关注电子监视和不断变化的技术。今天，这些技术包括人脸识别、生物识别指纹、视网膜模式或\
  \ DNA、人工智能、车牌摄像头、手机密码、社交媒体账户以及通过设备获取的 GPS 跟踪信息。此外，政府还可以购买由行业销售的 DNA 数据库。\n\n在这种背景下，最高法院再次处理了卡茨案和电子监视的范围。\n\
  \n### 1. 约翰斯诉俄亥州案（2012）\n\n现代监视案件的第一个案例是`约翰斯诉俄亥州案（2012）`，尽管在许多方面它反映了早于卡茨案的法学。在`约翰斯案`中，联邦调查局（FBI）在嫌疑人的汽车上放置跟踪设备。不幸的是，当\
  \ FBI 放置跟踪设备时，它是在马里兰州而非哥伦比亚特。结果是，搜查没有有效的搜令。监视范围是巨大的。“在过去的 28 天内，设备在 50 到 100 英尺范围内传输了超过\
  \ 2000 页的数据。”最高法院发现放置 GPS 跟踪设备构成了搜查，由于没有搜令例外，该搜查是无效。\n\n46\n\n最高法院回避了涉及利用技术进行周毯式监视的最重大政治问题。相反，最高法院的意见集中在马里兰州停车场和嫌疑人车辆放置跟踪设备的物理侵入上。法院再次肯定了卡茨案，但强调当卡茨案认为宪法权利保护人而非地点时，它扩大了第四修正案的范围。\n\
  \n相反，法院认为，“政府在目标车辆上安装 GPS 设备并使用该设备监控车辆移动，构成了‘搜查’。”法院强调了侵入原则作为卡茨案补充的重要性。通过大量引用`基洛诉美国案（2001）`，`约翰斯案`的法院解释道，“我们必须确保保护在第四修正案被通过时存在的针对政府的这种程度隐私。”……在我们历史的大部分时间里，第四修正案被理解为对政府侵入其列举区域（人、房屋、文件和财物）”的特别关注。\n\
  \n在`基洛案`中，法院禁止了使用热感应技术读取私人住宅并测量能量使用和种植大麻的可能性。尽管这不是物理搜查，但法院发现利用该技术读取墙上的热能是一种搜查。对于第四修正案而言，房屋搜查并不发生，除非“个人对被搜查的对象表现出了主观的隐私预期，且社会愿意认可这种预期是合理的。”然而，在`基洛案`中，私人住宅仍受到保护，因为它持续符合卡茨的公式，即“当政府违反社会认可为合理的主观隐私预期时，就发生了第四修正案意义上的搜查”。\n\
  \n\n\n\n\n在 `Jones` 案中，法院进一步扩展了其论点。法院认为，`Katz` 隐私预期的测试之外，还有一系列强调对《宪法》中列出的人、房屋、文件和财产进行侵入行为的案例。\n\
  \n尽管这并非多数意见，但 `Jones` 案中的五位不同法官对监控技术范围的不断扩大表示了担忧。他们并不那么关注追踪设备安装在汽车上的方式。其中一位法官担心，对侵入行为的依赖回溯到了\
  \ `Olmstead` 案，以及在不同类型听音设备之间发生的任意界限划分。另一份协同意见书关注政府对其公民进行大规模监控的相对易性，这种监控越来越多地通过使用不受《第四修正案》保护的文件来实现的，因为这些文件是第三方记录，且像`笔迹记录器`一样，无需合理理由即可获得。协同意见书中所描述的事实是在六年后呈现在法庭的\n\
  \n## 2. `Riley v. California (2014)`\n\n在 `Jones` 案两年后，最高法院处理了警察搜查手机的权力，即使是与逮捕相关的搜查。最高法院拒绝了以下观点：手机是个人财产，可以在逮捕时对其进行搜查；或者手机上存在证据被销毁的高风险。法院解释说，移动设备“将海量的个人信息字面上放在了个人手中\
  \ . . . . 并且 48 主张，执法人员在进行此类搜查之前通常必须获得搜令。” 警察在逮捕时确实有权扣押手机以防止证据被毁坏，并扣留手机以留出时间获取搜令。正如法院指出的，“一旦执法人员获取了手机，就不存在被捕者本人能够从手机中删除犯罪数据的任何风险了。”\n\
  \n虽然法院在 `Riley` 案中将手机搜令要求视为对与逮捕相关的搜查案例的延伸，但它承认了手机可能包含的独特类型信息。回到 `Jones` 案中协同意见书中提出的担忧，`Riley`\
  \ 法院承认“[手机上的]数据也可以揭示一个人去过哪里。历史位置信息是许多智能手机的标准功能，可以精确到分钟重建某人的特定移动轨迹，不仅是在城镇范围内，而且在某特定建筑内。”除了移动之外，法院还对手机上暴露的私密内容表示了担忧。\n\
  \n手机的存储容量对隐私有几个相互相关的后果。首先，手机在同一个地方收集了许多不同类型的信息——地址、笔记、处方、银行对单、视频——这些信息结合在一起揭示的信息比任何孤立记录都要多得多。其次，手机的容量使得仅仅是一种类型的信息就能传递出比以前多多的信息。一个人的私人生活总体可以通过数千张标记有日期、地点和描述的照片来重建；而塞在钱包里的一或两张亲人的照片则无法如此。第三，手机上的数据可以追溯到购买手机时，甚至更早。\
  \ . . . .\n\n49\n\n例如，在支持互联网的手机上可以找到搜索和浏览历史，这可能揭示个人的私人兴趣或担忧——也许是对某些疾病症状的搜索，加上频繁访问\
  \ `WebMD`。 . . . 手机上的应用程序软件，或“apps”，提供了一系列工具来管理关于个人生活各个方面的详细信息。有民主党新闻和共和党新闻的 `apps`；有酒精、药物和赌博成瘾的\
  \ `apps`；有分享祈祷请求的 `apps`；跟踪孕期症状的 `apps`；规划预算的 `apps`；每种想象得到的爱好或消遣的 `apps`；改善浪漫生活的\
  \ `apps`。有用于买卖几乎任何东西的流行 `apps`，且此类交易记录可能在手机上无限访问。\n\n法院提醒双方，一旦被获取，只要签发了适当的搜令，手机和移动设备就会受到搜查。`Riley`\
  \ 案凸显了法院从 `Jones` 案中采取的历史方法，回到一种反映当前技术本质对传统《第四修正案》法学影响的方法。\n\n## 3. `Carpenter v.\
  \ U.S. (2018)`\n\n隐私保护者对 `Jones` 案感到失望，因为其对侵入行为的依赖回避了关于利用公共数据进行个人监控的重要问题。他们在 `Riley`\
  \ 案以及法院对手机可用内容的描述中 Find 了支持。在 `Carpenter v. U.S. (2018)` 案中，最高法院回到了对政府访问大型数据库并追踪个人移动的担忧。\n\
  \n50\n\n在 `Carpenter` 案中，政府从两家无线电话公司收集了嫌疑人的基站位置信息 (`CSLI`)。这两家公司“为上诉人 `Carpenter`\
  \ 的手机提供了 (CSLI)，政府在 127 天内获取了 12,898 个位置点——平均每天 101 个数据点。”政府是通过根据《存储通信法案》签发的法院命令获得这些记录的。政府可以强制披露电信记录，“当它能提供具体的且可阐述的事实，表明有理由相信所请求的记录与正在进行的刑事调查相关且具有实质性时。”这一标准明显低于获得搜查令所需的合理理由标准。\n\
  \n利用 `CSLI`，政府能够追踪嫌疑人在过去一个月内的精确移动。政府当然指出，它已正确遵循了《窃听法案》中关于存储通信的法定规定。此外，政府还依赖于第三方原则，该原则最初为\
  \ `U.S. v. Miller (1976)` 案中的银行记录开发，后在 `Smith v. Maryland (1979)` 案中扩展到`笔迹记录器`。第三方记录规则规定，个人对其由银行、电话公司或其他第三方保留的记录或文件不享有合理的隐私预期，因为这些记录是为了第三方的目的而制作的。\n\
  \n`CSLI` 显然是第三方记录。它们是无线运营商作为基站运行的一部分创建并维护的业务记录。`CSLI` 对于手机在进入和离开每个基站覆盖范围时的运行和功能至关重要。它们也是一种能够精确定任何时刻手机位置的非常有效的追踪设备。`Carpenter`\
  \ 法院意识到，“历史基站记录带来的隐私担忧比车辆的 GPS 监控更大。”\n\n\n\n\n\n尽管第三方原则和《存储通信法案》的法定程序具有相关性，但法院实际上裁定\
  \ `CSLI` 请求属于搜查，因此在证明存在合理理由的情况下需要获得搜令。结果，法院在 `Jones` 案的基础上进一步迈出了重要的一步，要求只有在获得搜查令后，可以对嫌疑人进行泛泛追踪。法院并未进一步具体规定。例如，它并未禁止对某个向政府提供特定地理位置数据的应用程序进行追踪并要求其获得搜令。尽管如此，`Jones`\
  \ 和 `Carpenter` 的结合强烈暗示，任何形式的用于长时间追踪个人的技术都需要搜令。\n\n与此同时，法院在 `Carpenter` 案中也努力限制其裁决的范围。\n\
  \n我们今天的裁决是狭窄的。我们对未涉及的问题不发表意见：例如实时 `CSLI` 或“基站数据投取”（tower dumps，即下载特定时间段内连接到特定手机基站的所有设备信息）。我们没有扰动\
  \ `Smith` 和 `Miller` 法的应用，也没有对监控摄像头等传统的监控技术和工具提出质疑。我们也没有处理可能无意中暴露位置信息的商业记录。此外，我们的意见未考虑其他涉及外国事务或国家安全的收集技术。\n\
  \n`Jones`、`Riley` 和 `Carpenter` 这三部曲遵循了 `Katz` 案建立的模式，即关注人而非场所，关注政府搜查的结果而非方法。这三个案件也可能为政府和\
  \ 52 个法院提供一个蓝图，指导如何在监控技术不断改进的情况下预测第四修正法案的发展。\n\n## 本章核心要点\n\n第四修正法案的宪法保护限制了州和联邦执法部门在没有建立合理理由搜令的情况下进行搜查和查押。在\
  \ `Olmstead v. U.S.` 案中，最高法院最初并不承认窃听和其他形式的电子监控属于受搜令要求的搜查。\n\n国会会对 `Olmstead` 案做出反应，通过通过《通信法案》第\
  \ `§ 605` 条规定窃听为非法。尽管该法律持续了三十年，但执法部门通过使用不需要物理侵入被监听场所的设备，或简单地忽略法律，日益规避该法律。\n\n1967\
  \ 年，最高法院在 `Katz v. U.S.` 案中推翻了 `Olmstead` 案，扩大了第四修正法案的范围。根据 `Katz` 案，第四修正法案保护的是人而非场所。根据\
  \ `Katz` 案，当个人对隐私有主观预期，且这种隐私预期是社会准备认可为合理的时，官员对该私人领域的侵入通常被视为搜查，并需要合理理由支持的搜令。\n\n\
  `Katz` 案之后，1968 年出台了《窃听法案》，该法对口头和有线通信的监控制定了非常具体的规定。随着技术的演进，法律对所有电子通信增加了额外的保护。不同类型的电子通信在获得请求的法院命令方面会接受不同程度的法院审查。\n\
  \n在最近的一系列案件中，最高法院遵循了 `Katz` 案，将第四修正法案的隐私保护扩展到手机，以及无论是否需要特定设备来追踪个人的技术。`Carpenter`\
  \ 案对手机位置信息施加了搜令要求，推翻了《窃听法案》中的法庭传唤条款。\n\n### 需要了解的\n\n- 第四修正法案的规则比此处描述的电子监控规则要广泛得多。\n\
  - 搜令要求有许多例外，包括同意和紧急情况。这些例外也适用于电子监控以及其他形式的警察搜查。\n- 并非所有政府对电子记录的请求都是搜查。《存储通信法案》仍然允许通过不那么严格的法院命令披露电子邮件和类似的记录。银行记录和电话记录的第三方原则也继续是有效的法律。\n\
  - 警察在逮捕时可以扣留手机，但在没有法院命令的情况下，他们不能搜查手机内容。\n\n### 需要思考的\n\n- 技术不断演进。手表、运动鞋、手提和其他设备可能配备手机或无线技术。《窃听法案》的规定以及\
  \ `Jones`、`Riley` 和 `Carpenter` 的裁决在多大种程度上适用于这些设备？\n- 除了电子监控外，政府和私营公司还收集大量的消费者信息和生物识别信息。收集监控信息的政策对于使用人脸识别技术追踪的个人\
  \ DNA 或物理身份在多大程度上适用？现有法律和法院判决是否提供了适当平衡，还是需要增加新的立法？\n\n55 \n\n\n\n## A. 不受干扰权\n\n\
  ### 1. 隐私权，《哈佛法学评论》(1890)\n\n美国隐私权的普通法方法可以直接追溯到萨缪尔·沃伦和路易斯·布兰迪斯在 1890 年在《Harvard\
  \ Law Review》发表的《隐私权》。两人中，萨缪尔·沃伦更有可能是这篇文章的发起者，因为他和家人是波士顿社会精英的一部分，他们经常反对亨利·詹姆斯所谓的社会“报化”以及《纽约时报》描述的媒体“柯达胶化（摄影化）”。《周六晚间公报》等报纸的社会专栏详细记录了沃伦及其家人及所属社会阶层的生活。相比之下，布兰迪斯受狗仔摄影师直接影响较小，但他敏锐地察觉到了建立隐私原则的核心宪法和结构性担忧。沃伦的\
  \ 56 经历代表了精英阶层对隐私的需求，而布兰迪斯的局外人身份代表了弱势群体对隐私保护的需求。\n\n在他们的法律评论文章中，沃伦和布兰迪斯竭力建立一种已通过财产法、版权法、宪法等领域的先例存在的隐私权。他们将分析建立在托马斯·库利法官撰写的侵权法论书中关于“不受干扰”权利的短语上。该论著提供了以下内容：\n\
  \n```\n人格豁免。对个人的权利可以被认为是一种完全豁免的权利：不受干扰。相应的义务是不施加伤害，并且在足以使其实施成功的距离范围内，不尝试施加伤害。\n\
  ```\n\n库利还解释说，侵权法认为干扰个人发展和维护良好声誉的行为是可起诉的。他写道：“心怀不轨或考虑不周的人，通过发明或暗示损害[某人的信誉]，阻止其获得良好名声，他们因此侵犯了他的权利，他应该获得适当的救济。”这种伤害正是沃伦及其家人当时通过社交专栏所遭受的类型。此外，发展良好声誉的权利不能仅仅免于诽谤，否则将没有一项独立的权利。\n\
  \n\n\n\n这一时期社会的变革也催生了许多法律规范发生变化的其他领域。例如，摄影已经发生了转型，技术的进步使得相机从拍摄极其缓慢且经过高度构思的照片转变为近乎瞬时的影像捕捉。电报实现了跨越大陆的即时通信。电影和无线通信正在开发中，并经常在媒体上报道。这些各种形式的大众传播让报纸、杂志和其他出版者的影响力比历史上任何时候都远大得多。\n\
  \n从人口统计学的角度来看，该国也处于动荡时期。美国仍然从一场毁灭性的内战中恢复过来，并经历着一场大规模的移民潮，这改变了人口结构。到 1890 年，整个大陆已基本完成定居，边疆社会已转向工业时代的开端。人口变化和技术转变为也改变了经济。大型商业制造商和零售商正在改变产品的制造、广告和销售方式。沃伦（Warren）和布兰迪斯（Brandeis）通过描述“近期的发明和商业方法”强调了这些关注，认为这需要重新表述和重构隐私权。\n\
  \n沃伦和布兰迪斯使用的一个例子涉及“未经许可传播私人肖像”。女演员玛丽·曼诺拉（Marion Manola）起诉她的戏剧制作人，因使用了未经授权的照片作为她的演出海报。在文章发表时，纽约一家初级法院已为曼诺拉下达了初步禁令。该照片并不具诽谤性，但未经授权将其用于商业目的是不允许的，因此法院禁止了其进一步出版。\n\
  \n文章描述的另一个例子是源自 1769 年英国的 `Millar v. Taylor` 案，被描述为“保留自己情感的权利”。尽管受到媒体的影响，人有权决定是让自己的意见“公开，还是仅供自己的朋友们看到”。\n\
  \n沃伦和布兰迪斯认为，这些以及许多其他案例最好被理解为构成单一的侵权行为，这种侵权可以描述为侵犯隐私。这些案件在财产法、合同法、版权法、诽谤法或人身法下往往难以处理且显得不从心，但在隐私权准则所描述的法学方法下可以调和。他们并不是发明了一种新的侵权行为，而是在解释隐藏在其他类型分析中的侵权行为形态。\n\
  \n## 2. 隐私权的采纳\n\n沃伦和布兰迪斯的文章产生了立即的影响。多萝丝·格兰西（Dorothy Glancy）教授通过《Atlantic Monthly》和《The\
  \ Spectator》等杂志的评论描述了这种影响。例如，《Spectator》指出：“受过教育的美国人开始如此强烈地恨恶过度公开的制度（这种制度主要是他们自己的推手），以至于他们正在讨论通过法律处罚限制它的方法。”\n\
  \n尽管有许多初级法院的裁决与文章描述的隐私侵权一致，但密歇根州法院在 1899 年拒绝了这篇文章。在该决定之后，在 `Roberson v. Rochester\
  \ Folding Box Company (1902)` 案中，纽约上诉法院发布了关于隐私最重要的早期意见。在 `Roberson` 案中，意见分歧的纽约上诉法院拒绝了沃伦和布兰迪斯提倡的方法。诉讼请求禁止将罗伯森（Roberson）这位非常年轻的女性的照片用于\
  \ `Franklin Mills Company` 的广告活动中以推销面粉。她的形象在未经同意的情况下被用在海报和简单上，并配有“家庭面粉”的口号。她声称因该活动感到羞辱，遭受了\
  \ 15,000 美元的损失。多数意见认为在侵权法中发现新的诉讼理由没有依据，并明确拒绝了沃伦和布兰迪斯文章的分析。由于照片肖像不具诽谤性，因此没有法律救济。\n\
  \n然而，异议意见引用了沃伦和布兰迪斯的话来接受这一体现隐私权的新命题：\n\n> 生命权已意味着享受生活的权利——不被打扰的权利；自由权确保了广泛民事权的行使；“财产”一词已增长为各种形式的占有，无论是无形还是有形的。即时摄影是一项现代发明，它提供了获取个人肖像的手段。虽然它仅仅是对于所有者的侵犯，我承认这是一种不可弥补的社会特征。但如果允许将肖像用于商业或其他用途，那么就成了对个人隐私的侵犯，其后果可能比实际的人身攻击更可怕、更痛苦。\n\
  \n与异议意见相反，多数意见认为没有必要在这方面演进普通法。相反，意见建议在其他地方考虑对法律进行修订。\n\n> 立法机构完全可以干预并规定，无人可以在未经同意的情况下为了自私目的使用他人的肖像或姓名。在这种情况下，对法律整体不会产生影响，因为该规则仅适用于成法规定的案件。\n\
  \n在 `Roberson` 案之后，公众对该裁决表达了强烈抗议。奥莱恩（O’Brien）法官实际上在 `1902 Columbia Law Review` 上写了名为《隐私权》的文章来为他的赞同辩护。然而，他的文章并没有改变公众情绪。相反，为了回应\
  \ `Roberson` 案，纽约立法会制定了《纽约民权法》第 `50` 条和第 `51` 条。这为该国的隐私权提供了首次法律保护。在其 1903 年的法律中，纽约对干扰个人肖像权提供了民事和刑事保护。\n\
  \n```text\n防止未经许可而出于商业目的使用任何人的姓名或肖像的法案（1903 年 4 月 6 日通过）。\n\n第一条：任何出于广告目的或商业目的，在未事先获得当事人（如果是未成年人则获得其父母或监护人）书面同意的情况下，使用活人姓名、肖像或照片的人、公司或实体，均属轻微罪。\n\
  \n第二条：任何人的姓名、肖像或照片在州内被用于广告目的或商业目的，但未事先获得上述书面同意，其可以在本州最高法院对使用其姓名、肖像或照片的人、公司或实体提起衡平诉讼，以防止并限制此类使用；并可就此类使用而遭受的任何损害。如果被告故意以本法案禁止或宣布为非法的方式使用该人的姓名、肖像或照片，陪审团可以根据裁量权判处惩罚性赔偿金。\n\
  ```\n\n尽管法律此后更新了多次，但它仍然是纽约隐私法的框架。\n\n\n\n\n\n纽约的经历让全美国了解到，公众期望从日益具有侵入性的现代规则中获得保护。当佐治亚成为首个将隐私权视为普通法事项的州时，这一背景变得清晰起来。在`Pavesich\
  \ v. New England Life Ins. Co. (1905)` 一案中，一份寿险广告出现了一个未经许可便复制照片的人。\n\n佐治亚最高法院从纽约的经验中吸了教训，既依靠沃伦和布兰迪斯的文章，也依靠公众对法律保护的需求。`Pavesich`\
  \ 法按照沃伦和布兰迪斯的方式开始了其意见：\n\n> 因此，要解决的问题是个人是否拥有一种可以执行且法院将保护其免受侵犯的隐私权。必须承认，在 1890 以前，无论在本国还是英国，每一个可以被认为涉及隐私权的判决案件，都不是基于这种权利的存在，而是基于假设的财产权权、违反信托或信任的行为或类似行为，因此，独立于财产权、合同权或类似性质权利的隐私权主张，在此之前从未在任何裁决中得到过承认。\n\
  \n`Pavesich` 描述了沃伦和布兰迪斯描述的许多先例，并增加了更多。它将隐私权根植于自然法，提出了更为强有力的论点，即隐私权是天赋的且不可侵犯的。该意见描述了马里昂·曼诺拉的案例以及公众对\
  \ `Roberson` 案决定的抗议。尽管该意见承认有必要平衡隐私权与其他普通法和宪法权利，但法院将对他人照片未经授权的商业开发视为侵犯隐私的一个相当直接的例子。\n\
  \n尽管案件结果如此，`Pavesich` 法院仍对其新承认的权利范围进行了苦斗。在主要的关注点中，该意见指出了与言论自由权利之间的紧张关系。\n\n许多人在承认隐私权存在性的道路上遇到的障碍是，承认这种权利将不可避免地倾向于限制言论和新闻自由。……\n\
  \n隐私权无疑受到言论和印刷权利的限制。可以说，赋予言论和新闻自由如此宽泛的范围将对隐私权造成非常严重的限制，但如果是这样，那是因为法律认为，维护言论和新闻自由比允许个人以这种方式主张隐私权而干扰他人情感的自由表达以及对公众可能合法感兴趣的每一件事的发布更能符合公共利益。\n\
  \n`Pavesich` 的裁决为全国范围内隐私权的发展奠定了基础。它并没有被普遍接受，一些评论者认为该法律是对普通法原则的侵入。尽管如此，`Pavesich`\
  \ 将沃伦和布兰迪斯的论点坚定地植入了整个美国的普通法中。\n\n## B. 四大隐私侵权行为\n\n1960 年，威廉·普塞尔（William Prosser）院长长发表了一篇名为《隐私》的法律评论文章，成功地重新构建了隐私法日益增长的发展。普塞尔对于隐私权的恰当性有非常坚定的见解，并通过他的表述影响了隐私法的发展。\n\
  \n普塞尔方法的核心在于他的断言：“隐私法包含了四种不同的侵犯行为，涉及原告的四种不同的利益，这些利益通过共同的联系在一起，但除此之外几乎没有共同点，仅由于每种行为都代表了对原告权利的干扰，用库利法官（Judge\
  \ Cooley）创造的短语来说，就是‘不受干扰权’。”\n\n普塞尔描述了共同构成隐私法的四种不同侵权行为。随后，普塞尔担任了《侵权法重述（第二版）》的报告人，将对三百多个隐私案件的分析引入了一个拟议的统一框架中。他的方法通过针对不同初步证据的四种不同诉讼理由，很大程度上被纳入《侵权法重述（第二版）第\
  \ 652A 条》中：\n\n* (a) 不合理地侵入他人的私人空间；\n* (b) 挪用他人的姓名或肖像；\n* (c) 对他人的私生活进行不合理的公开；或\n\
  * (d) 使他人不合理地处于公众面前虚假光环中的公开。\n\n《重述》的这一部分对法律产生了深远影响。即使在 1960 年普塞尔写文章时，已有三十多个司法管辖区通过普通法或法定通过承认了隐私。今天，绝大多数司法管辖区都承认隐私侵权行为，且它们几乎都使用了《重述》中的侵权行为版本或近似版本。\n\
  \n《侵权法重述（第二版）》中关于“侵入私人空间”（Intrusion Upon Seclusion）违反隐私的表述为：\n\n```\nIntrusion Upon\
  \ Seclusion: 故意通过物理或其他方式侵入他人的孤独或隐私或其私人事务或关注点，如果这种侵入对理性人来说是高度冒犯的，则须对侵犯其隐私承担责任。\n\
  ```\n\n这种侵权行为最接近“不受干扰权”。它让对个人空间的直接侵犯具有可起诉性，例如闯入某人的家或办公室翻阅其文件。它可以用于对跟踪者或利用访问计算机或移动设备监视他人的人提起侵权诉讼。\n\
  \n要建立侵入私人空间的初步案件，原告必须证明：(1) 被告实施了高度冒犯的侵入，(2) `mens rea`（故意、明知、鲁莽或过失），(3) 导致原告隐私被侵犯，以及(4)\
  \ 造成了可衡量的损害。`mens rea` 可能因司法管辖区而异。\n\n《侵权法重述（第二版）》中关于“公开私人事实”（Public Disclosure\
  \ of Private Facts）违反隐私的表述为：\n\n```\nPublic Disclosure of Private Facts: 公开有关他人私生活的事务，如果所公开的事务属于\
  \ (a) 对理性人来说是高度冒犯的，且 (b) 不是公众合法关注的事题，则须对侵犯其隐私承担责任。\n```\n\n这种侵权行为最能反映了塞缪尔·沃伦（Samuel\
  \ Warren）对社交版和纠缠公众人物的摄影师的法律诉求。公开的信息必须是公众未知的，并且是公众没有兴趣的类型的信息。\n\n要建立公开私人事实的初步案件，原告必须证明：(1)\
  \ 存在公开行为（如在报纸上），(2) 公众未知的私人事实，(3) 理性人会认为公开这些是高度冒犯的，(4) 不具有新闻价值，即公众对该信息没有合法利益，(5)\
  \ 由被告实施，(6) 具有最低的 `mens rea`（故意、明知、鲁莽或过失）。\n\n\n\n\n\n# 虚假形象的公开（False Light）\n\n\
  对他人有关的事务进行公开并将其置于公众虚假形象中的行为，须因侵犯其隐私对其承担责任，前提是：(a) 该他人所处的虚假形象对理性人来说是高度冒犯的，且 (b) 行为人对公开事项的虚假以及他人将所处的虚假形象知情，或采取了鲁莽的态度。\n\
  \n虚假形象是与诽谤最密切相关的隐私侵权行为。与诽谤一样，该侵权行为要求被告向一个或多个第三方发布虚假陈述，并对原告造成损害。该陈述必须是损害原告声誉的。诽性陈述被描述为使他人遭受仇恨、嘲笑或蔑视，或者降低其在同类中的评价。它还可能导致某人在贸易或业务中被排挤或损害。与诽谤一样，对言论自由的宪法保护要求“实际恶意”，即故意、明知或鲁莽行为的刑事意（mens\
  \ rea）。\n\n虚假形象代表了那些非诽谤性的虚假陈述，这些陈述同样会导致他人遭受嘲笑、蔑视或降低其在同类中的评价。领先案例 `Spahn v. Julian\
  \ Messner, Inc. (1967)` 提供了一个极佳的说明。沃伦·斯潘（Warren Spahn）是密尔沃基勇士队获得过赛扬奖的左手棒球投手。一本关于斯潘的童书作者几乎没有进行任何研究，而是虚构了关于书中主题的大部分事实，包括斯潘曾获得青铜勋章的虚假陈述。斯潘成功起诉禁止了该书出版，该书对其个人故事提供了一个虽补充但虚假且令人尴尬的描述。书中的事实并不构成诽谤，但其累积效应损害了斯潘的声誉。\n\
  \n最高法院认为，虚假形象受到的与诽谤相同的言论宪法保护，但当针对某人的故意虚假陈述并损害了该个人时，这些虚假陈述仍具有可诉性。\n\n虚假形象有时被视为一种利用伤害性较小的陈述来提出诽谤诉的手段。因此，至少有十个州质疑或拒绝了虚假形象诉求的合理性。在这些司法管辖区内，一个陈述要是虚假且有害的，必须符合诽谤诉讼的所有要素。\n\
  \n## 姓名或肖像挪用（Appropriation of Name or Likeness）\n\n《侵权法重述（第二版）》中关于姓名或肖像挪用隐私权的表述为：\n\
  \n`Appropriation of Name or Likeness`: 将他人的姓名或肖像挪用于自己使用或利益的人，须因侵犯其隐私对其承担责任。\n\n\
  要证明原告姓名或肖像挪用的初步证据（prima facie），原告必须证明：(1) 存在商业性的出版或开发；(2) 由被告实施；(3) 针对原告的姓名、肖像或其他身份属性；(4)\
  \ 具有刑事意（mens rea）（故意、明知或鲁莽）；(5) 未经授权。除了姓名和照片外，人的口号、声音和球员数据也被用于确立“肖像”。商业开发通常指用于销售商品或服务，或为商品或服务的广告。使用真实人物的新闻性出版物和虚构作品通常被排除在商业挪用的范围之外，尽管在某些州该侵权行为的应用得更为广泛。\n\
  \n与虚假形象一样，对言论自由的宪法保护要求“实际恶意”，即故意、明知或鲁莽行为的刑事意。\n\n\n\n\n防止他人物理侵入或利用技术侵入的财产权，并不受《第一修正案》侵入者主张的限制。违反产权的《第一修正案》权利非常有限，而“侵入隐私”（intrusion\
  \ into seclusion）这一隐私侵权不受《第一修正案》的限制。\n\n关于公开披露私人事实和侵犯虚假形象（false light invasion of\
  \ privacy）的隐私侵权均受到基于《第一修正案》的重大限制。处理隐私范围最重要的法学判例是《纽约时报报诉苏尔曼案》（`New York Times v.\
  \ Sullivan`, 1964）诽谤案以及随后的系列案件。\n\n在将《第一修正案》适用于诽谤出版物的州普通法侵权时，最高法院裁定，对于公共官员，如果没有证明存在“实际恶意”（actual\
  \ malice），就不存在责任，即通过“犯罪意图”（mens rea）证明对陈述虚假的明知，或对诽谤陈述的虚假采取蔑视。随后的案件也将此规则扩展到了公众人物。只有通过要求原告证明表面证据案件的每一个要素（例如陈述的虚假性以及被告的明知或轻率行为），才能将审查风险降至足够低，以抵御《第一修正案》的审查。即使在涉及私人的案件中，原告也必须证明被告在诽谤案件中至少过失。\n\
  \n最高法院在《考克斯广播公司诉科恩案》（`Cox Broadcasting Co. v. Cohn`, 1975）中进一步扩展了隐私的宪法限制。尽管个人信息如果向公众广播可能会让普通人感到非常反感，但如果真实的广播内容属于“公众合法关注的事项”，则受到《第一修正案》的保护。对于公众关注的事项，真实性是侵犯隐私诉赔的辩护。然而，并非所有广播内容都是公众关注的事项，个人生活的隐私方面不能自动被广播。不过，极少数案例提供了由于不受愿宣传而导致明确侵犯隐私的例子。\n\
  \n其中一个发现原告尽管在宪法限制下仍能建立诉讼理由的案例是《迪亚兹诉奥克兰论坛报公司案》（`Diaz v. Oakland Tribune, Inc.`, 1983）。在`Diaz`\
  \ 案中，被告报纸发表了一篇关于原告（学生会主席）的短文，指出她是一个跨性别者，出生时为男性。关于`Diaz` 性别身份的故事在有关可能滥用学校资金的报道结束后几个月出现在专栏中，且与原始故事无关。上诉法院发现，这种不受愿的披露与新闻报道之间没有新闻价值的联系。该案很好地说明了处于《第一修正案》保护之外的报纸项目类型。\n\
  \n在`Cox` 案中，最高法院还解释道，“州不得对公开供查阅的官方法院记录中所包含的真实信息实施制裁。”例如，保护强奸受害者不被在新闻中被点名的州法律已被推翻，尽管成为此类犯罪的受害者可能会导致不受愿的宣传。\n\
  \n最高法院还处理了虚假形象隐私侵权的宪法限制。在《时事杂志公司诉希尔案》（`Time, Inc. v. Hill`, 1967)） 案中，最高法院将《纽约时报报诉苏尔曼案》扩展到根据纽约隐私法可起诉的隐私侵权中，并表示“对言论和新闻的宪法保护阻止了在没有证明被告在明知报告虚假或蔑视真相的情况下发布报告的情况下，适用纽约法律来救济有关公共利益事项的虚假报告”。因此，所有的虚假形象诉都包含在《纽约时报报诉苏尔曼案》的范围内。\n\
  \n十年后，最高法院在《时事杂志公司诉希尔案》（`Time, Inc. v. Hill`, 1967) 案中提供了指导，最高法院将《纽约时报报诉苏尔曼案》扩展到根据纽约隐私法可起诉的隐私侵权中，并表示“对言论和新闻的宪法保护阻止了在没有证明被告在明知报告虚假或蔑视真相的情况下发布报告的情况下，适用纽约法律来救济有关公共利益事项的虚假报告”。因此，所有的虚假形象诉都包含在《纽约时报报诉苏尔曼案》的范围内。\n\
  \n\n\n\n1890 年，塞缪尔·沃伦（Samuel Warren）和路易斯·布兰迪斯（Louis Brandeis）写了《隐私权》，文中收集了古代法律和英国法律中在合同法、财产法、版权法和其他学说框架下的隐私关注关注案例，但所有这些案例都证明了法律界对“不受侵扰权”的普遍关注。他们的法律法律评论文章重新定义了法院和立法机构对隐私本质的理解。这篇文章以及公众对隐私侵权行为的需求，是由出版、摄影和大众通信技术的变化，以及国家工业化和城市化的发展所推动的。\n\
  \n直接基于沃伦和布兰迪斯的文章，隐私权首次于 1903 年在纽约州通过法律确立，并于 1905 年在佐治亚州通过判例法确立。从此以后被广泛采用。在《侵权法重述（第二版>>(Restatement\
  \ (Second) of Torts）中，“不受侵扰权”被重新定义为四种独立的侵权行为，每种行为都有自己的要求。\n\n普通法中的隐私侵权行为定义非常窄，仅在非常特定的情况下提供救济。由于这些限制非常严格，它们尚未扩展到\
  \ 21 世纪关于数据隐私和公司对消费者追踪的关注中。\n\n从“纽约时报诉苏利曼案”（New York Times v. Sullivan）开始，最高法院限制了关于公开披露私人事实和虚假光侵犯隐私的隐私侵权诉讼理由。第一宪法修正案的相关关注要求原告证明被告的`犯罪意`（mens\
  \ rea）并证明主张的每一个要素。\n\n关于商业化用他人姓名或肖像的隐私侵权行为很大程度上已转化为一种财产权利，即公开权。其属性很大程度上相同，但某些州法律允许其延伸到个人寿命之外并进行商业转让。\n\
  \n### 知识点\n\n隐私是一个相对年轻的法律学说，很大程度上受到 1890 年沃伦和布兰迪斯的文章以及 1960 年廉·普罗塞尔（William Prosser）的文章的影响。普罗塞尔对隐私的狭隘观点变成了《侵权法重述（第二版）》的官方观点，该重述定义并限制了普通法隐私的增长。\n\
  \n从“纽约时报诉苏利曼案”开始的第一宪法修正案保护的增长进一步限制了隐私保护的增长。尽管在决策隐私方面隐私被视为宪法权利，但在最高法院的法学中，它被要求从于言论自由。\n\
  \n## 思考题\n\n隐私权最大的成功是公开权的扩张。保护商业开发的权利导致了纽约州第一部相关法律的颁台以及佐治亚州州最高法院的首次承认。即使在美国最高法院，“扎契尼案”（Zacchini）也是极少数法院愿意允许第一宪法修正案利益以外的利益获得胜出的案例之一。\n\
  \n如果《侵权法重述（第二版）》没有将隐私权分为四个非常狭窄的子类别，隐私法会有何不同？沃伦和布兰迪斯对隐私的理解在处理数据追踪、行为广告和其他在线隐私侵犯关注方面，是否比《重述》的版本表现更好？\n\
  \n宪法并没有建立权利的等级制度。如果隐私和言论自由都被承认受《第十四修正案》保护的基本权利，那么法院在这些权利之间在多大程度上达到了平衡？\n\n如果隐私保护与其他宪法保护之间的平衡需要调整，进行这种调整的最有效方法是什么？\n\
  \n## 第 4 章：职场隐私\n\n普通法隐私仅对监视和观察提供狭窄保护。《重述》中的隐私侵权行为通常不适用于职场关系。相反，一系列州和联邦劳动法规已经发展，以保护个人员工免受认为不符合雇佣关系的行为。\n\
  \n职场隐私只是许多受专门监管的法律领域之一。这些包括消除歧视和骚扰、促进工人平等对待、确保公共安全以及处理工资和补偿的法律。本章将仅关注职场隐私问题。适用于其他形式数据隐私的消费者法、医疗法和财务法规通常作为其更广泛隐私义务的一部分涵盖员工。除了准入员工或现职员工外，大多数公司雇佣的工人也受到适用于这些业务的消费者法、财务披露法规和医疗法的保护。\n\
  \n### A. 劳动与就业法引论\n\n美国劳工部（U.S. Department of Labor）报告说，它管理和执行超过 180 部与就业关系相关的联邦法律。除了这些，还有许多补充性的州法律，以及州和联邦层许多解释这些法律并增加额外要求的法规。劳工部执行《公平劳动标准法》（Fair\
  \ Labor Standards Act），以确保遵守最低工资法、工资和小时分类、加班法、养老金或福利计划以及其他补偿要求。\n\n州法通过州级《工人赔偿法》（Worker\
  \ Compensation laws）管理工人受伤提供的保险，而医疗保险则通过《1985 年综合统一预算和解法案》（Comprehensive Omnibus\
  \ Budget Reconciliation Act of 1985，COBRA）监管。额外的医疗法受《家庭与医疗休假法》（Family and Medical\
  \ Leave Act，FMLA）以及《健康保险流通性与责任法》（Health Insurance Portability and Accountability\
  \ Act，HIPAA）团体计划医疗流通性要求的约束。\n\n职业安全与健康管理局（OSHA）管理《职业安全与健康法》（Occupational Safety\
  \ and Health Act），以确保健康和安全状况符合机构颁布的标准和条例。还有更具体的法律管理农业、卡车运输和许多其他行业。此外，雇主有一般义务为员工提供免于公认的、严重危害的工作和工作场所。\n\
  \n这些只是管理雇佣关系的许多法律中的少数。这些法律大部分与隐私法规没有直接关系，但某些法律具有特定的隐私义务。如`HIPAA`等法律包含了隐私和数据安全条款。其他隐私和数据安全法律，如《公平信用报告法》（Fair\
  \ Credit Reporting Act，FCRA），并非主要的就业法，但它们有适用于入职前环境和雇佣关系的条款。州法也是如此。\n\n尽管法律繁多，但员工与雇主之间的大多数关系是基于双方之间的合同协议。对于\
  \ 10%到 15%的劳动力，合同是通过集体谈判过程形成的，在此过程中员工由工会代表。对于非工会劳动力，协议是雇主和员工之间私下协商的。\n\n### B. 员工和申请人的背景审查\n\
  \n隐私保护在雇佣关系开始之前就开始了。雇主越来越倾向于使用社交媒体和在线工具来寻找职位空位的候选人。雇主可以自由使用公开信息，但这样做可能会带来风险，因为雇主处于收集在招聘过程中法律上无法使用的信息的境地。\n\
  \n\n\n\n\n除了公开信息外，雇主通常会将背景调查和刑事检查作为招聘流程的一部分。这些调查有时还包括对潜在员工的信用检查。此外，某些职位雇主还要求进行更具侵略性的测试，包括毒药物和酒精检测、指纹采集、医学检查，甚至是测谎仪和诚实测试。这些更具侵略性的要求受法律限制，且仅在特定情况下才允许。\n\
  \n雇主在入职前阶段和整个雇用关系期间都会使用这些筛选和测试。它们有时在招聘阶段作为雇佣条件使用，也可能作为员工留任或职业晋升流程的一部分，对现职员工进行。对于过度侵犯隐私的法律保护不会根据测试在雇用关系中所处的时间点不同而改变。\n\
  \n### 1. 入职前筛选中的歧视\n\n对于除最小组织之外的所有机构，企业的招聘流程都是从创建职位描述开始，然后向公众发布或推广该空缺职位。随着职位申请材料的提交，招聘方开始对申请人进行筛选。通过初筛的人将受邀参加职位的面试。根据职位性质和雇主的需求，可能会有额外的测试、要求候选人提交作品样本或审查候选人的作品集。入围者在获得录取通知（offer）之前可能还要接受背景检查以及额外的面试和筛选。这些每一个步骤都涉及候选人个人披露程度的增加。\n\
  \n虽然雇主寻求最适合其组织的人才，但他们禁止在招聘时基于年龄、种族、性别、宗教、退伍军人身份和健康状况等保护类别进行歧视。许多州还保护职位候选人免受婚姻状况、性取向和性别身份的歧视。\n\
  \n由于基于这些因素进行歧视是违法的，潜在雇主被禁止询问这些问题。例如，工作表格不能询问申请人的配偶姓名或配偶性别，否则会侵犯候选人的隐私。申请表不能询问有关参与宗教活动、怀孕或任何可能让雇主以歧视性方式利用这些信息的问题。\n\
  \n### 2. 入职前筛选中的社交媒体\n\n在招聘中使用社交媒体并非违法，但由于对歧视的担忧，滥用此类信息可能会引发诉讼责任。尽管如此，几乎所有雇主都会利用社交媒体筛选潜在候选人。公司担心，如果有关潜在雇员的负面信息在互联网上易于获取且被忽视，公司可能会面临公众尴尬和潜在的法律责任。为了避免此类风险，雇主会筛选掉发布不当照片、吸毒、歧视性言、虚假资、机密或对当前雇主发表贬低言的候选人。\n\
  \n同时，社交媒体上的信息可能会披露候选人的宗教信仰、年龄、性别、性取向、退伍军人身份、残疾或其他属性，这些属性在决定聘用人员、设定薪资或确定雇用条款和条件时法律上是不允许使用的。使用在线信息不得违反联邦平等就业机会法（包括`1964\
  \ 年民权法案第 VII 章`、`1963 年平等薪酬法案`、`1967 年就业年龄歧视法案`、`1990 年美国残疾人法案`、`1973 年康复法案`以及`1991\
  \ 年民权法案`）以及额外的州法律。\n\n为了避免滥用公开获取的在线信息，企业的人力资源部门可以通过将在线筛选过程与任何招聘决策隔离开来缓解问题。参与筛选的员工不应与参与面试的团队为同一小组，并应与任何招聘或薪酬决策保持独立。在线筛选人员与雇用流程其他部分的隔离应有完备的记录。除非某人因在线帖子被筛选出申请池，否则参与招聘的人不应对任何在线内容知情。\n\
  \n通常情况下，发布在社交媒体上的非公开信息不能用于雇佣环境。雇主不应接触候选人的私人账户。不应要求候选人提供其私人账户信息。至少有十个州制定了法律，禁止雇主或潜在雇主要求候选人或员工提供登录信息。在极少数特殊情况下，雇主绝不应询问员工的密码或其他登录信息。这些做法也可能违反《计算机欺诈和滥用法案》，该法将未经授权访问计算机系统视为联邦犯罪。\n\
  \n为了进一步了解潜在候选人的在线状况，一些雇主转而使用“窥视”（shoulder surfing）技术，从职位候选人和员工的肩膀后偷看屏幕。在窥视时，人员不会透露其密码，但会打开账户并提供对账户内容的完全访问权限。这种技术增加了雇主获取不许可在雇用环境中使用信息的概率。这种行为具有高度侵略性，且候选人更容易识别出可能导致非法、负面招聘决策的特定信息。因此，这是雇主应该避免的做法。\n\
  \n### 3. 毒药物检测\n\n对职位候选人和员工进行毒药物检测是大型组织、依赖重型机械的企业、从事运输业务以及类似机构的常见做法。联邦法允许毒药物检测，但毒药物检测必须以尊重员工隐私权的方式，并包括防止歧视的保护。法律承认收集尿液或血液样本是对隐私的侵犯，必须证明其合理性方可采取。使用取视器确保样本直接来自参与者进一步增加了对隐私的侵犯。\n\
  \n毒药物检测可能会发现机密的医疗状况，还可能暴露员工在非工作期间的行为。毒药物检测过程通常要求被筛选人员提供一份正在服用的药物清单。雇主不能要求其提供合法处方药清单，否则将违反《美国残疾人法案》中的隐私保护规定。个人人员无需向雇主披露其医疗状况，因此在毒药物检测中强迫披露此类信息是非合法的。\n\
  \n因过失导致的假阳性结果通常会对雇主和检测机构产生诉讼理由，特别是当这些信息被进一步传给组织内的主管或其他人员，或者当它影响了个人获得未来工作的能力时。为了尽量减少雇主的责任并遵守各种就业法，员工通常有权在采取任何不利就业行动之前对实验室结果进行重新检测。\n\
  \n\n\n\n\n对于公共部门的员工来说，药物检测构成了涉及《第四修正案》的搜查。非政府雇主的员工不受《第四修正案》的保护。即使对于公共部门员工，这种保护也是有限的。《第四修正案》仅要求对违规行为有某种**个人化的怀疑**才能被认为是合理的。一旦存在这种\
  \ `84suspicion`，就可以对员工进行搜查。不需要搜查令或传票。\n\n此外，最高法院已经承认，“安全敏感”职位即使在没有个人化怀疑的情况下也符合《第四修正案》的要求。例如，最高法院认为，铁路员工受影响与火车事故风险之间的联系，足以证明“卓越的安全利益”正当化了对涉及火车事故的铁路员工实施强制性、无需怀疑的检测计划。法院认为，铁路工人的处于使得“在任何受损迹象被主管察觉之前，就可能造成巨大的人员损失”。因此，实施通用的药物检测计划是合适的。\n\
  \n对于司法部律师、海关局工作人员、假释和缓刑官以及类似的敏感职位，允许进行入职前药物检测。对这些职位的药物检测只是此类职位所需的许多高度侵入性背景调查之一。这些工作的候选人理解其雇佣过程中将包含的侵入程度，因此，此类职位的候选人被认为对隐私的预期较低。\n\
  \n然而，政府对效率或公共服务安全有效交付的通用利益，不足以要求对所有工作申请者进行普遍药物检测。相反，政府雇主的关注点必须与构成工作职责或导致该公共部门工作建立低隐私预期的职位的安全敏感问题直接相关。\n\
  \n## 4. 医学与基因检测\n\n尽管这听起来像是一个未来主义者的说法，但确实存在某些雇主利用基因和医学检测来筛选 85 申请者或做出留用决定。将个人的健康状况作为未来就业或职位留用的依据直接违反了《美国残疾人法》。除非与就业条件直接相关，否则基因或医学检测是对工作候选人隐私的侵犯，并可能违反一项或多项反歧视法。\n\
  \n例如，在 `Norman-Bloodsaw v. Lawrence Berkeley Lab. (1998)` 一案中，第九巡上诉法院发现，原告通过指控非裔员工被针对性地镰刀细胞贫血检测，以及女性被进行怀孕检测（均作为就业条件）而建立了诉讼理由。这种检测违反了\
  \ 1990 年的《美国残疾人法》（`ADA`），以歧视性方式违反了 1964 年《民权法案》第七条，并侵犯了候选人的隐私权。还有一些追溯到 1960 年的公司进行医学和基因检测的案例，包括道尔化学公司（Dow\
  \ Chemical Company）和杜邦公司。这些化学公司筛掉了那些可能在处理公司销售的化学品时更容易患疾病的候选人。\n\n除了 `ADA` 和其他反歧视法的适用性外，2008\
  \ 年会颁布了《基因信息非歧视法》（`GINA`）以保护个人免受基因歧视。该法涵盖了就业和健康保险的歧视。（它不涵盖寿险歧视。）该法律保护的基因信息包括家族健康史、基因检测结果、基因咨询和其他基因服务的使用以及参与基因研究。\n\
  \n86\n\n`GINA` 禁止雇主和保险公司根据其获得的基因信息做出招聘、晋升或保险范围的决策。在大多数情况下，该法律还禁止雇主或健康保险公司要求进行任何基因检测。\n\
  \n`GINA` 和《健康保险流通与责任法案》（`HIPAA`）都要求将工作候选人和员工的医学记录维护为机密记录，并限于那些直接需要这些信息的人。公司中需要访问员工医学记录的人员比普通人事记录要少得多。因此，医学记录应单独保留，并受到高程度的保密和数据安全的保护。\n\
  \n## 5. 《公平信贷报告法》下的第三方调查\n\n当雇主缩小潜在员工的范围时，他们通常会进行背景调查。这些可能包括犯罪背景筛查和信用报告。《公平信贷报告法》（`FCRA`）对第三方消费者报告的定义非常广泛。\n\
  \n“消费者报告”一词是指消费者报告机构通过任何书面、口头或其他形式提供的任何关于消费者的信誉状况、信用状况、信用能力、性格、一般声誉、个人特征或生活方式的任何信息……\n\
  \n尽管对未封口的刑事记录没有隐私限制，但在就业环境中使用消费者报告和信用报告有重大的规定。如果第三方收集了犯罪记录或其他背景信息（如财务报告、就业历史、驾驶\
  \ 87 记录或其他涉及个人生活方式的报告），那么这些报告将受 `FCRA` 的通知和披露义务约束。\n\n根据 `FCRA`，工作申请者必须以书面形式告知潜在雇主正在使用信用报告作为背景调查的一部分。通知不能作为较大文档的一部分，而必须是独立的通知，且雇主必须获得工作申请者的签署许可。如果该人员未被录用，则雇主将被视为根据该法律采取了“不利行动”。即使工作候选人未被录用的原因与报告中提供的信息无关，，这一规定同样适用。\n\
  \n一旦发生不利行动，雇主必须对该不利行动进行通知。执行 `FCRA` 的联邦贸易委员会（`FTC`）总结了通知要求，这些要求必须包含：\n\n*   提供报告的消费者报告公司的名称、地址和电话；\n\
  *   一份声明，说明提供报告的公司并未做出采取不利行动的决定，且无法给出具体原因；\n*   个人有权对消费者报告公司提供的任何信息的准确性或完整性提出异议的通知，并在\
  \ 60 天内要求时可以从公司处获得一份额外的免费报告。\n\n此外，一些雇主使用基于对一个人的性格、一般声誉、个人特征和生活方式的个人访谈的调查报告。88`FCRA`\
  \ 在 `FCRA` 下增加了额外的义务。雇主随后必须通知工作候选人，其“有权要求额外的披露以及报告范围和内容的摘要”。\n\n`FCRA` 下的报告要求比仅仅为工作候选人提供其真实的信用报告要广泛得多。由于\
  \ `FCRA` 使用了广泛定义，在招聘、晋升或留用过程中收集的大多数第三方报告都在涵盖范围内。\n\n\n\n\n\n# 6. 员工测谎保护法\n\n很少有侵入行为对隐私的侵犯比测谎检查更深。尽管技术有所改进，受调查者身上仍会缠绕着监测血压、脉搏、呼吸和皮肤传导的导线。测谎仪的假设是，如果一个人对某个问题有负情，并且试图隐藏这些信息，其生物指标将会做出反应。尽管美国测谎协会声称准确率可高达\
  \ 90%，但其他批评者认为其准确率在 65–70% 之间。机器还存在报告假阳性的倾向，导致调查人员错误地认为嫌疑人有罪。\n\n测谎仪和其他谎检设备的结果在刑事法庭审判中不可采用。通常情况下，州法和联邦法律也禁止在工作场所使用这些设备，但存在例外。1988\
  \ 年的《员工测谎保护法》规范私营部门测谎测试的使用。类似的法律也适用于公共部门员工。\n\n《员工测谎保护法》将针对盗窃、间谍活动和其他不当行为的特定调查中的测谎使用，与入职筛选环境中的测谎区分开来。在入职筛选阶段，法律允许仅对“装甲运车、安防报警和安保人员雇主”、提供大坝、电力供应或货币生产等关键基础设施的公司，以及“获得授权制造、分发或发放受控物质的雇主”使用\
  \ `89` 测谎测试。\n\n调查环境仅适用于现有员工。正如《联邦法规》摘要所示：\n\n[该法律]为对经济损失或雇主业务损害进行持续调查的雇主，对私营就业环境中禁止使用谎检器的通用规定提供了有限的豁免。雇主可以要求员工\
  \ . . . 接受测谎测试，但仅在满足以下条件时——\n\n(1) 测试是与一项涉及经济损失或雇主业务损害的持续调查相关的进行的，例如盗窃、挪用公款、侵吞或非法工业间谍活动或破坏性行为；\n\
  (2) 员工接触过调查标标的财产；\n(3) 雇主有理由怀疑员工参与了正在调查的事件或活动；[且]\n(4) 雇主在测试前用受试者能理解的语言向受试者提供说明，详细地解释正在调查的特定事件或活动以及对特定员工进行测试的依据\
  \ . . .\n\n在工作场所进行测谎测试时，必须由获得许可的测试公司进行。测试产生的 `90 信息` 应被视为高度机密信息。公司任何未能防止测谎结果泄露的行为都可能导致对员工隐私权的进一步侵犯。\n\
  \n## C. 工作场所监控\n\n自现代雇佣关系开始以来，雇主经常监控员工的行为和生产力。雇主监控员工活动是为了提高员工效率；鼓励安全；确保工作场所不受骚扰和其他不当行为干扰；保护公司拥有的商业秘密和机密信息；改进流程；以及记录公司对各种法律法规的合规情况。这些都是合法的公司利益，其中许多也造福了员工和雇主。\n\
  \n变化的仅仅是工作分心的类型和监控手段。自从引入工作分心和监控手段以来……（此处重复省略）。对于员工来说，工作场所对生活的其他侵入也日益引起关注。布莱曼法官在\
  \ `1987` 年的 `O’Connor v. Ortega` 案中写反对书中，对隐私的丧失表示遗憾。\n\n[现代时代工作的现实，无论是在公共部门还是私营部门，都揭示了为什么公共员工对隐私的预期应该被仔细保护，而不是被轻易忽视。\n\
  \n遗憾的是，事实确实如此：工作场所已变成另一个家。许多员工一天大部分时间以及晚上大部分时间都在工作。\n\n工作已变成第二个家。今天，家变成了第二个工作场所。在线和互联网连接技术使得工作比以往任何时候都更容易跟随员工，模糊了工作时间与下班时间之间的界限。\n\
  \n员工在工作时并不会自动失去隐私；然而，大多数人作为雇佣条件的一部分放弃了这些权利。雇佣关系的条款通常整合在员工手册中。员工手册提供了关于员工在工作场所隐私预期的关键条款。它描述了雇主监控行为的权利范围，并描述了对员工维护公司及其客户机密性、隐私和数据安全的义务。\n\
  \n### 1. 监控的法律依据\n\n普通法中隐私的合理预期并不适用于工作场所的大多数区域。除了卫生间、更衣室和哺乳室外，没有普通法规定的避让权。相反，任何隐私保护必须源于州法或联邦法。\n\
  \n对于计算机、手机和其他技术，管辖的法律是《1986 年电子通信隐私法（ECPA）》中的《窃听法》和《存储通信法》，以及《计算机欺诈和滥用法（CFAA）》。《ECPA》\
  \ 包含了《窃听法》也包含了《存储通信法》。正如该章节所述，它 `92 主要` 用于防止政府对公民私人通信的侵入，除非政府持有搜查令或传票。\n\n`ECPA`\
  \ 涵盖了私营公司内部发生的电子通信。它并不是限制公司拦截和记录通信，而是包含了专门授权此类行为的规定。该法对反拦截法律包含了宽泛的豁免，使雇主能够监控和控制在工作场所发生的通信。法律适用中最重要的例外是同意。根据\
  \ `ECPA`，只要通信双方之一表示同意，该同意即有效。某些州法律要求双方均同意。为了履行这一额外义务，录制客户或其他业务电话的公司会在每次通话开始时添加声明，以确保通话的所有方均已知并同意录音。\n\
  \n\n\n\n除了《电子通信隐私法案》（ECPA）中的同意规定外，还有另一项在正常业务运营过程中监控电子通信的宽泛豁免。在同意在某种程度上显得不足的情况下，企业有权在“为了提供服务或保护该服务提供者的权利或财产”时，作为业务运营的一部分拦截并记录通信。这些对电话和电子通信的截获完全免于责任，检索雇主系统上存储的通信内容也是如此。这些豁免既适用于《93\
  \ 年窃听法》（93 Wiretap Act），也适用于《存储通信法法》（Stored Communications Act），尽管法律条文的内容在不同章节之间略有不同。\n\
  \n另一部直接授权雇主监控员工的法律是《计算机欺诈与滥用法》（CFAA）。CFAA 已成为一部非常广泛的法律，对任何“故意未经授权访问计算机或超出授权范围访问”计算机并随后获取信息或损害计算机、其软件或数据的行为都设定了民事和刑事责任。“超出授权范围”一词的意思是指“在授权的情况下访问计算机，并利用此类访问来获取或更改访问者无权获取或更改的计算机信息”。\n\
  \n在雇佣背景下，是雇主拥有公司计算机并建立使用计算机系统的授权。联邦政府授权雇主设定这些参数，并在员工违反这些参数时，通过提供相应的民事和刑事责任来强化雇主的裁定。除了对计算机黑客攻击（computer\
  \ hacking）行为设定刑事和民事责任外，该法律还涵盖了前员工使用已注销的凭据（或同事的凭据）窃取企业机密或客户信息的情况。法律非常明确规定，雇主有权制定计算机使用政策并精确管理这些计算机的使用。\n\
  \n这些法律为公司监控员工活动创造了强大的权威，但实际的此类权限通常也直接在员工手册中规定。ECPA 的同意规定比业务必要性豁免要宽得多，而 CFAA 虽然规定了建立计算机访问授权的权限，但它并未规定具体的计算机访问内容。为了实施法律赋予的权限，雇主应在员工手册中规定其监督政策，并获得对这些条款的具有法律约束力的同意。\n\
  \n典型员工手册的条款包括以下内容：\n\n*   **设备和账户的所有权**：规定将明确，雇主提供的所有设备仍为雇主的财产，员工访问的所有账户（包括电子邮件账户、社交媒体账户、云存储账户或其他系统）均为雇主的财产。账户的所有权包括与这些账户关联的任何用户名和密码的企业所有权。规定还将解释说，雇主可以随时访问其系统上存储的所有信息，并警告员工他们不能存储任何他们希望被视为机密的内容。\n\
  \n*   **公司账户仅供业务使用**：规定将明确，雇主提供的所有账户仅用于业务目的；员工不能将这些账户用于任何私人用途；且在这些账户上发布的所有内容将成为公司的专属财产。\n\
  \n*   **自带设备 (BYOD) 政策**：规定允许员工使用自己的移动设备、便携式存储设备设备，但赋予了雇主监控该设备使用情况、跟踪该设备位置、安装企业安全和监控软件以及授权远程删除所有内容的权利。\n\
  \n*   **知识产权和无形资产的所有权**：雇主通常拥有员工在工作范围内创作的任何版权保护作品，以及如果员工被聘佣发明某些物品，则拥有其发明的专利。在创意和教育行业外，员工创建的内容通常被认为是雇主的财产。此项规定将延伸到包括商标、商业秘密、数据和其他无形资产的任何权益。\n\
  \n*   **内部机密性**：此规定要求员工对所有内部信息视为机密，并要求只有公司的官方发言人才能分享任何信息。对于上市公司而言，这项规定尤为重要，因为任何公开披露都可能影响市场价格并涉及《证券法》（Securities\
  \ and Act）的披露。\n\n*   **遵守隐私政策、反骚扰政策和计算机使用政策的义务**：规定将建立相关预期，即使用公司信息系统只能为了公司的利益，员工不会违反其他员工的权利，不会使用针对其他员工的骚扰语言，将遵守任何账户的服务条款，不会安装任何未经授权的软件，不会下载或存储任何未经授权的内容，员工将遵守所有管理计算机和信息系统的法律、法规和政策。\n\
  \n*   **系统和工作场所监控**：规定解释了公司维持工作场所监控以促进安全和效率，并改进业务流程和履行监管义务，因此员工同意监控作为雇佣的条件。它们提供了对电话、无线和存储通信、视频监控以及在公司拥有设备上使用跟踪硬件和软件的概括说明。公司手册倾向于使用非常宽泛的语言起草，但这有时会削弱政策的目标。根据特定行业的需求，员工手册在某些这些条款上通常会变得非常详细。\n\
  \n在实践中，雇主可以使用击键记录和屏幕捕捉软件记录计算机活动，审查互联网流量，检查白名单和黑名单互联网地址，连接摄像头，监控进出员工账户的数据流大小，并采取许多额外步骤来监控每个员工的在线行为。雇主监控的范围通常与员工可获得数据的敏感性以及非公开信息的价值挂钩。\n\
  \n2. 监控能力的局限\n\n\n\n\n对于政府工作人员来说，受到宪法第四修正案的保护，尽管工作场所的隐私合理预期相当低。某些工会已成功通过集体谈判程序协商出侵入性较小的监控条款。更重要的是，尽管\
  \ `ECPA` 和 `CFAA` 的范围非常广泛，且企业试图起草非常广泛的员工手册，但对员工电子通信的监控能力仍受到限制。\n\n例如，雇主不能监控其明知是私密通信的电话通话或电子通信，因为此类通信超出了员工同意条款的范畴，并且超出了业务运营豁免的范围。员工与工会代表或法律顾问的电话通话不能被监控。一旦雇主意识到此类电话的性质，就有义务停止任何可能已自动开始的监控。\n\
  \n同样，使用公司电脑访问私人的基于 Web 的电子邮件系统或社交媒体系统，并不意味着访问该系统的权利已转移给雇主，尽管员工手册中可能有相反的陈述。即使员工被告知不要在工作时间或使用工作电脑时访问个人账户，法律也不会因为员工违反了这些工作规则就剥夺他们保留自己账户权益的权利。例如，当雇主访问了员工在个人电子邮件账户上与律师之间的往来邮件时，雇主被发现超过了其监控账户的权利并违反了员工的权利。相比之下，当员工使用其工作电子邮件账户与律师通信时，公司并不禁止阅读邮件。这两个案例的区别在于，在第二个例子中，电子邮件账户也归公司所有。\n\
  \n还有其他形式的监控。`GPS` 监控的使用日益普遍。例如，大多数手机都有“查找手机”技术，可以追踪设备的位置。公司拥有的卡车和车辆通过多种技术进行位置监控。确保设备正确使用以及保护车辆免于盗和损坏具有正当的业务目的。当\
  \ `GPS` 追踪员工的私车时，并没有这种业务目的。相反，可能仍然存在很强的隐私预期。\n\n一个较新的担忧涉及对员工进行更系统性的监控。例如，安装在公司手机上的移动应用程序可以让雇主对这些设备进行\
  \ 24/7 的追踪。然而，员工可能对于在离开工作时不被追踪或监控有隐私预期。最高法院发现，政府在刑事环境下在无证件的情况下进行此类追踪违反了宪法第四修正案。因此，员工对于免受无处不在的追踪也存在合理的隐私预期。公司在监控其车辆的范围内，可能能够追踪车辆，但如果追踪针对的是个人，这种形式的监控可能会违反员工的权利。\n\
  \n此外，在大多数就业环境中，此类追踪似乎几乎没有什么业务目的。如果雇主由于跟踪者、狗仔、民事动荡或其他外部威胁而对员工的人身安全有正当担忧，则可能存在例外。然而，在绝大多数极其特殊的情况下，公司不应为其员工安装或监控追踪软件。当此类技术嵌入手机或其他硬件中时，公司应制定政策和做法来禁用该技术，并将其使用限制在员工请求协助并同意使用的情况下。\n\
  \n### 3. 使用摄像头、录音设备和生物识别进行物理监视\n\n工作场所的视频监控也很常见。通常，视频监控是更广泛的物理安全计划的一部分，旨在减少盗窃并记录已采用适当的安全程序。相比之下，音频监控要少得多。部分原因在于，由于许多州要求音频录音的所有方都必须同意录音。在这些州，仅由雇主同意录音是不够的。此外，音频监控系统可能会无意中捕捉未收到录音通知的双方之间的扬声器通话。对于公司来说，无意音频录音的风险太高，因此无法实施全面的音频监控。\n\
  \n即使有视频监控，也有限制。在工作环境内，私人办公室的隐私预期略高于公共空间。拥有私人办公室的员工通常通常不会预计这些办公室受到视频监控。雇主可以通过合同改变这种预期，但此类监控将是令人惊讶的。\n\
  \n员工更换衣服的区域享有更高程度的隐私保护。储物室、更衣室、卫生间、哺乳室和类似地点被预期按其用途使用。裸露的个人性质引发了合理的隐私预期，使得使用视频监控是不恰当的。如果对健康、安全或行为问题有担忧，公司可以监控这些地点的入口，但绝不应在员工脱衣的地方使用摄影或视频监控设备。\n\
  \n许多公司使用带有追踪功能的设备，如带有 `RFID` 的胸牌或其他监控设备。有些使用生物识别数据，包括指纹、声纹、人脸识别工具或视网膜扫描。在设施和打印机、复印机等设备上使用这些追踪设备，可以为员工创建一个移动地图。收集此类行为数据并不违反任何通用数据收集法。然而，这种收集应限制在工作期间和在场所期间的活动信息。\n\
  \n考虑到对员工追踪的担忧，一些州已经通过了法律，禁止雇主要求员工在皮下嵌入追踪技术。在这些州，对员工“植芯片”是违法的。幸运的是，这种对员工的物理标记并没有成为一种必要的业务实践。\n\
  \n### 4. 劳动关系的相关问题\n\n员工监控的一个相关领域是，雇主针对员工在其个人社交媒体账户上的感知不当行为所能采取的行动。对许多人来说，因言论惩罚员工是重大的隐私侵犯。尽管如此，许多公司都有相关政策，规定了工作期间和下班时间的行为和规范预期。在某些情况下，这些规定被编写为《行为准则》，而不是整合到员工手册中。示例包括：\n\
  \n* 要求对客户保持礼貌的指南\n* 期望员工任何时候都是“品牌大使”\n* 要求员工在所有通信中以尊严和尊重的方式对待彼此\n* 对所有内部通信进行保密的义务\n\
  * 限制商标和服务标记仅用于与工作相关的活动的政策\n\n\n\n\n\n尽管此类政策对雇主来说是有益的，但它们可能会引发对员工言论权利的关注。例如，第三方是否应该能够向某人的雇主就该人在工作之外的行为进行投诉？已有许多案例显示个人因与其工作活动无关的在线帖子而被解雇。在私营部门，并没有通用的言论自由权。许多雇主不愿意留住发布过不当评论或公开了其不当行为的员工。\n\
  \n联邦劳动法通过《国家劳动关系法》（`NLRA`）为员工提供了有限的言论保护，该法律通过《国家劳动关系委员会》（`NLRB`）举办的听证会进行执行。`NLRA`\
  \ 的 `Section 7` 规定：“员工有权自自组织、成立、加入或协助工会，通过其自行选择的代表进行集体谈判，并为了集体谈判或其他共同救助或保护之目的从事其他集体活动……\
  \ . . .”\n\n102\n\n所有员工都受 `NLRA` 的保护。为了互助或保护而从事集体活动的权利并不局限于工会员工。因此，当员工之间讨论某些与工作相关的问题时，他们受到\
  \ `NLRA` 的保护，免受因言论受报复，即使这些言论是在网上公开发表的。例如，如果员工使用 `Facebook` 在工作场所就薪资或工作条件组织集会，那么员工从事集体活动的权利将高于任何关于在社交媒体上发布有关公司信息的行为准则政策。\n\
  \n`NLRA` `Section 7` 的保护要求“互助”，这意味着它保护员工之间的对话，但如果内容针对同事并涵盖了集体谈判或受保护的活动（如薪资或工作条件），它也可以触及到单条帖子。\n\
  \n虽然 `NLRA` 保护某些在线讨论，但它并没有消除行为准则。与互助无关的帖子，包括发布的对客户的投诉、对主管的人身攻击、种族主义或歧视性语言或其他通用的发泄，都不属于集体活动的保护范畴，`NLRB`\
  \ 将维持对因此类行为解雇员工的决定。\n\n除了员工寻求恢复工作而提起的特定诉讼外，`NLRB` 还对雇佣手册和行为准则的可执行性做出了裁决。\n\n在 2017\
  \ 年的`波音公司`（`Boeing Company`）裁决中，《国家劳动关系委员会》大幅修订了关于雇主制定可执行行为准则能力的规则。在这一裁决之前，公司发现要颁布可执行的行为准则非常困难，因为这些限制很容易干涉员工进行集体活动的权利。`NLRB`\
  \ 一致认为这些行为准则 103 过于宽泛，因为员工可以合理地将这些语言解释为禁止 `Section 7` 活动。\n\n在`波音`案中，`NLRB` 翻转了禁止所有“员工会合理解释……\
  \ . . 为禁止 `Section 7` 活动”的雇佣政策。取而代之的是，`NLRB` 采用了一项政策：“在评估一项表面中性的政策、规则或手册条款时，如果该条款在合理解释下可能会干扰\
  \ `NLRA` 权利的行使，委员会将评估两点：(i) 对 `NLRA` 权利的潜在影响的性质和程度，以及 (ii) 与该规则相关的合法理由。”\n\n在委员会政策转变中，强调了“委员会有责任根据本法及其政策，在……主张的业务理由与对员工权利的侵犯之间取得适当平衡，侧重于员工的角度……\
  \ . . .” 雇主与员工利益之间的这种平衡赋予了该政策业务目的远更大的权重。\n\n任何明确限制 `Section 7` 权利的政策仍然是非法的。但如果该政策是表面中性的，那么\
  \ `NLRB` 现在将平衡对 `Section 7` 权利的潜在负面影响与雇主对该规则的业务理由。在`波音`案中，涉及的规则是一项禁止摄像政策，禁止所有手机、笔记本电脑和其他带有摄像头的设备，以保护商业秘密并符合国防部对其飞机制造的要求。`NLRB`\
  \ 发现，保护机密性的需求超过了对员工组织能力的潜在影响。\n\n`NLRB` 还翻转了之前小组的裁决，裁定在新的 104 方法下，整个类别的行为政策现在对于雇主的合法业务目的来说都是合理的。此前被判定无效但现在将获得批准的政策包括这些：\n\
  \n- 一项要求员工“[k]保持客户和员工信息安全”的规则\n- 一项要求“护士和医生应该培养‘和谐的互动和关系’”的政策\n- 一项避免阻碍和谐互动和关系的行为的要求\n\
  - 规定员工必须[k]保持客户和员工信息安全的陈述\n- 一项警告，称如果员工参与有关公司的不当讨论，则使用社交媒体“可能违反法律并受到纪律处分”\n\n`波音`裁决使得公司能够更容易颁布将获得\
  \ `NLRB` 维持的雇佣手册和行为准则。然而，即使政策获得维持，如果它阻碍了实际的集体活动，该条款将不会被执行。\n\n雇主对其员工收集的信息范围是巨大的。由于补偿要求和员工身份义务，公司拥有每个员工的社会安全号码。雇主将拥有从每次背景检查中获得的所有信息。如果员工寻求\
  \ ADA 调整、病假或家庭假，那么这名 105 雇主还将拥有有关该员工的大量医疗数据。\n\n许多州和联邦法律规定了社会安全号码的使用。虽然这些法律差异很大，但一般规则要求社会安全号码保密，不能显示在记录或文件中。虽然过去一些公共和私营实体曾将人的社会安全号码作为账户号码或身份号码，但这些法律现在禁止了这种做法。如果公司需要显示社会安全号码的一部分，一种常见的许可版本是显示号码的最后四位。\n\
  \n\n\n\n\n`ADA`、`FCRA` 和 `HIPAA` 均包含法律规定，要求员工记录或文件的接收方必须采取合理且适当的措施来确保信息安全，使其不被公众获取，并保护信息免受盗窃，并将对信息的访问限制在具有正当业务目的的人员范围内。这些法律的数据安全义务将在第\
  \ 6 章进行更充分的探讨。\n\n除了联邦法律外，包括利福尼亚州和马萨诸塞州在内的州积极制定额外的州法律义务来保护企业数据，涵盖客户数据和员工数据。各州法律差异很大，但通常要求公司确保数据安全，并尽量减少企业内外部对信息的访问。在宾夕法尼亚州，州最高法院的一项裁决发现，雇主保护员工机密记录的义务是雇主“对他人的义务，即像理性人一样谨慎，保护他们免受由于该行为产生的不合理伤害风险”。法院进一步解释道：\n\
  \n作为雇佣条件，[匹兹堡大学医学中心 (UPMC)]要求[员工]提供某些个人和财务信息，UMC 在其互联网可访问的计算机系统中收集并存储了这些信息，但没有使用适当的安全措施，包括适当的加密、足够的防火墙和充分的身份验证协议。这些事实陈述显然构成了\
  \ UPMC 的主动行为…… 这种主动行为导致 UMC 对员工负有采取合理谨慎的义务，以保护他们免受由于该行为产生的不合理伤害风险。\n\n正如宾夕法尼亚州最高法院所解释的，雇主除了任何法律义务外，还负有普通法义务维护从员工处收集的记录的机密性和安全性。这些记录包含了敏感的个人和财务信息，如姓名、出生日期、社会安全号码、地址、税表和银行账户信息，这些信息是作为雇佣条件的一部分收集的。建立这种关系后，公司有义务采取合理措施来确保信息免受丢失风险。\n\
  \n为了履行保护员工记录机密性的普通法和法律义务，每家公司都应该遵循常识步骤。这些程序始于能够安全、可靠的方式收集和存储物理记录和电子记录。第 5 章提供了必须遵循的数据安全基础知识，以保护记录免受第三方盗窃，并有助于公司履行以合理方式保留记录的普通法义务。然而，仅仅将记录存储在安全的计算机系统中是不够的，还需要采取额外的步骤。\n\
  \n首先，公司应该制定明确的政策，强调工作场所隐私和机密性的重要性。这些政策应为客户信息、员工信息公司信息的隐私及数据安全建立优先顺序。政策应当明确规定，未经授权的访问、披露或使用机密信息均违反了公司政策和个人职责。\n\
  \n其次，主管培训也应加强这一警告，因为主管经常会无意中获得有关其下属的信息。对于员工提出的健康休假或便利性请求，应该有书面政策，因为这些请求通常涉及 `ADA`\
  \ 或 `HIPAA` 涵盖的医疗信息。\n\n第三，提供给主管的文件应转发到中心化且安全的存储处。主管和人力资源人员不应将 `FCRA`、`ADA` 和 `HIPAA`\
  \ 涵盖的记录与普通人事记录混合。文档的物理打印副本应存储在带锁的文件柜和锁闭的文件房间等安全位置。数字记录应使用加密进行存储，并仅供直接负责 `FCRA`、`ADA`\
  \ 或 `HIPAA` 所涵盖事项的公司人员使用。高级管理层和直接员工主管通常无权获得此类信息。\n\n第四，这些联邦法律和相关州法律下的记录可能需要至少保留几年。一旦过了记录保留期限，公司应安全地处弃这些信息，并严格遵守其记录销毁政策。记录销毁政策应包括物理文档的安全粉碎和数字文件的安全删除。\n\
  \n已经实施了充分的数据安全系统并制定了符合联邦标准政策的雇主，能够维护其员工记录的机密性。这些步骤虽然无法阻止所有的无意披露或复杂的的数据盗窃，但它们能在很大程度上确保公司员工信息的完整性，并降低公司的法律责任风险。\n\
  \n## 本章要点总结\n\n-   工作场所的隐私并不受法律直接保护。相反，员工的许多利益受到旨在保护财务记录、医疗记录和消费者信息的法律的保护。对于那些工会的工人（此处原文可能有误，应为加入工会的工人），集体谈判协议中包含一些隐私保护，但对于大多数员工来说，权利是由劳动合同定义的。出乎意料，大多数劳动合同都赋予了雇主广泛的权利来监控员工的行为，以维护工作场所、保护知识产权并执行客户隐私保护。\n\
  -   保护员工的法律也保护新职位的申请人以及寻求晋升或转岗的员工。当雇主将信用报告用于就业筛选或资质评估时，这些法律包括 `FCRA`；关于某些健康就业信息的\
  \ `HIPAA`；以及各州的各种法律。\n-   各州已保护了员工免受其私人社交媒体账号和个人邮箱密码的泄露。某些州还增加了对未经员工同意使用生物识别信息的保护。由于州法律变化非常快，在未来几年内，很可能是州法律将提供最大的保护。\n\
  \n## 需要了解的知识\n\n-   《国家劳动关系法》不提供直接的隐私保护，但它确实保护员工之间的某些通信。联邦法还允许药物检测和使用测谎仪测试，但这些侵入行为是受的，并且必须在联邦法律的限制范围内进行。相比之下，遗传信息不能作为就业过程的一部分。\n\
  \n-   在州法和联邦法下，工作场所监控都是允许的。监控范围通常在员工手册中说明。监控可能包括整个工作场所的摄像头（卫生间和储物室除外）、对所有公司计算机账户的访问、计算机监控、电话录音以及对通过公司计算机系统所有数据的追踪。受\
  \ `NLRA` 保护的活动外，遵循政策的公司可以自由地以这种方式监控其运营。\n\n-   `NLRA` 限制监控参与集体谈判或参与“为了共同援助或保护而进行的集体活动”的。这要求公司停止监控旨在工资、工作条件或类似的就业问题的电话和其他通信。\n\
  \n## 思考题\n\n\n\n\n\n雇佣关系受到非常严格的监管，那么为什么美国国会选择不将员工隐私加入`NLRA`或其他联邦法律的规定中呢？\n\n如果国会增加立法，可能会如何改变雇主和员工在隐私方面的行为？\n\
  \n110\n\n各州已经介入并通过了法律，禁止雇主和潜在雇主使用员工的社交媒体密码来筛选其内容。难道诸如 `CFAA` 这样的联邦计算机安全法还不够吗？为什么还需要额外的立法？\n\
  \n员工受到某些州法律关于个人信息隐私的保护。通用隐私法对员工隐私实践的影响程度在何种程度上？\n\n111\n\n![clocky\\_bw\\_CHAP.tif](img/Image_7.jpg)\n\
  \n# 第 5 章：消费者隐私\n\n在整个 20 世纪，商人与消费者之间的关系发生了快速变化。零售商从小型的小地机构发展为全国连锁店。客户开始依赖邮购公司和百货商店而不是当地商店进行交易。为了触及全国受众，广告从报纸转移到了广播和电视。在\
  \ 1890 年，当沃伦（Warren）和布兰迪斯（Brandeis）写下《隐私权》时，还没有对商业侵入或消费者追踪的担忧。当地商人可能很了解客户，因为他们是邻居。然而，全国连锁店开始依赖人口统计信息来对客户群体进行分类和目标定位。\n\
  \n广播和电视引入了一种新的经济关系。广播机构无法轻易向客户收取无线广播的费用，因此广播机构向零售商出售广告。消费者通过观看广告来换取免费内容。广告商努力了解消费者的兴趣和趋势，但这些信息很少能识别具体的消费者。\n\
  \n112\n\n尽管如此，到 1973 年，艺术家理查德·塞拉（Richard Serra）和卡洛塔·法伊·舒尔曼（Carlota Fay Schoolman）创作了一件艺术装置，警告电视和大众媒体的力量。他们写道“[i]在商业广播中，观众为了被推销的特权付费。被消费的是消费者。你是电视的产物。”2010\
  \ 年，蒂姆·奥雷（Tim O’Reilly）推特了这条信息的更新版本。“如果你没有为此付费，你就不是客户；你是被售卖的产品。”此地，太阳微系统公司首席执行官斯科特·麦克尼利（Scott\
  \ McNealy）在 1999 年宣布：“你反正零隐私。接受现实吧。”当时，他将消费者隐私的担忧描述为“红��鱼”。尽管如此，二十年后，普通消费者隐私仍然是一个备受关注的问题。\n\
  \n## A. 隐私的部门方法\n\n1973 年至 2010 年之间变化的是广告商能从客户那里获得的信息量，以及广告商能获得的关于个人信息的具体程度。如果没有客户调查，广播和电视机构无法对其客户了解太多信息。相反，尼尔森公司（Nielsen\
  \ Company）会雇佣家庭将收视习惯输入电子记录系统。这些家庭旨在从人口统计上对公众具有代表性。通过追踪他们的收视习惯，他们为广告商和广播机构提供了有关节目受欢迎程度的信息。\n\
  \n美国通用的假设是，除了合同之外，商业交易中不存在隐私预期。如果双方双方之间的合同规定了特定的隐私保护，那么该合同的条款将得到执行。否则，对隐私的预期仅限于普通法权利或传统关系所提供的保护。律师、医生和神职人员根据传统有义务将与客户、患者和忏悔者的互动视为\
  \ 113 机密（注：原文此处有页码干扰）。其他行业有商业准则，但这些与违反保密法和隐私法律的刑事或民事处罚不同。\n\n然而，由于现行上市公司法律要求的联邦监管扩大、与非美国客户开展业务的公司的国际法规，以及加州、纽约州许多其他司法管辖区州法律的扩大，这一通用假设正在迅速变化。2020\
  \ 年代的法律不再是没有美国隐私保护，而是正在变成竞争性的隐私和数据安全机制的法律。公司不再能够对其客户数据做任何事情，监管的快速增长现在可能要求公司不仅在美国境内外，在各州之间也要以不同的方式运营。\n\
  \n### 1. 联邦隐私法\n\n在某些领域，州和联邦政府已采取特定行动以增加隐私并限制可用于个人的信息。许多州通过了法律，以反映律师与客户以及医患关系的长期做法。某些州增加了法律以保护图书馆记录不被公开。州法有时会将隐私作为更广泛行业监管的一部分。\n\
  \n由于隐私法主要侧重于经济的某些部门，这种方法被称为部门隐私（sectoral privacy）。这些部门法通常关注医疗保健信息、财务信息、政府记录、媒体交易或有关十三岁以下儿童的个人信息。书中描述了大部分此类法律。这些是关键的联邦法及其所属行业：\n\
  \n114\n\n*   **医疗保健**\n    -   1996 年《健康保险可携带性与责任法》（`HIPAA`）\n    -   2008 年《遗传信息非歧视法》（`GINA`）\n\
  *   **银行与金融**\n    -   1970 年《公平信用报告法》（`FCRA`）\n    -   1978 年《金融隐私权法》（`RFPA`）\n\
  \    -   1999 年《格拉姆-莱里奇-布莱利法》（`GLBA`）\n    -   2003 年《公平准确信用交易法》（`FACTA`）\n    -\
  \   1933 年《证券法》和 1934 年《证券交易法》\n    -   2002 年《萨班斯-奥克斯利法》（`SOX`）\n*   **儿童隐私**\n\
  \    -   1998 年《儿童在线隐私保护法》（`COPPA`）\n*   **教育**\n    -   1974 年《家庭教育权利与隐私法》（`FERPA`）\n\
  *   **媒体与演讲**\n    -   1984 年《电缆通信政策法》\n    -   1988 年《视频隐私保护法》（`VPPA`）\n    - \
  \  1991 年《电话消费者保护法》（`TCPA）\n*   **提供给联邦政府的信息**\n    -   《行政程序法》（`APA`）\n\n115\n\n\
  -   1954 年人口普查保密法\n    -   1966 年《信息自由法》（`FOIA`）\n    -   1974 年隐私法\n    -   1997\
  \ 年《纳税人浏览保护法》\n*   **通用**\n    -   1914 年《联邦贸易委员会法》（`FTCA`）\n    -   《电子通信隐私法》和《存储电子通信法》，共同组成\
  \ 1986 年《电子通信隐私法》（`ECPA`）\n    -   1988 年《员工测谎保护法》（`EPPA`）\n    -   1994 年《驾驶员隐私保护法》（`DPPA`）\n\
  \    -   2003 年《反垃圾邮件法》（CAN-SPAM Act）\n\n这些类别仅为通用指南。如第 4 章所述，员工隐私包括员工的医疗保健、财务记录和其他信息。很少有法律是专门为提供员工隐私而编写的，但许多法律中的规定增加了员工所享有的隐私权。通过这种方式，针对特定类型隐私的法律通常为其他领域提供隐私权利。联邦和州法律通常涵盖不止一个狭窄的主题。\n\
  \n\n\n\n除了联邦法律外，越来越多的州法律也保护了消费者和普通公众。这些法律中的某些仅适用于在特定州注册的企业，但许多法律适用于任何居住在该州的客户。因此，在整个全美范围内经营业务的公司必须考虑所有的州法律。此外，还有外国法律规定了跨国公司如何处理美国以外的客户信息。为了满足这些外国司法管辖区的义务，一些美国公司还对其美国客户添加了额外的隐私保护。\n\
  \n## 2. 隐私政策的目标和保护程度各异\n\n即使在有监管的情况下，也不意味着公司不能使用消费者数据。这些法律中的某些仅要求公司在将数据用于营销或其他目的之前通知客户。某些法律仅要求告知消费者信息将如何被使用，而另一些法律则禁止将所收集的信息用于狭窄的特定目的以外的其他用途。\n\
  \n例如，`GLBA` 要求金融机构向客户提供年度隐私通知，并赋予客户拒绝将其消费者信息出售给第三方的权利。它并没有阻止对客户信息的常规出售，甚至不需要银行事先获得肯定的同意。因此，像\
  \ `GLBA` 这样的法律对于减缓将消费者信息用于销售和营销作用乎其微。相比之下，`HIPAA` 对公司施加了严格的义务以保护收集的数据，并对患者数据用于广告和其他非医疗保健相关目的销售和使用实施了明确限制。\n\
  \n以下是用于评估隐私法律强度的矩阵：\n\n*   `仅通知`（Notice Only）——要求收集信息的公司提供有关其已收集信息的简要通知。例如，某项法律要求发布隐私政策。\n\
  *   `退出通知`（Opt-Out Notice）——要求消费者接收通知，告知公司正在收集信息，或有权访问移动设备的组件（如摄像头或联系人应用）。`退出通知`\
  \ 允许消费者通过复选框或按钮拒绝服务。尽管退出通知为公众提供了显而易见的控制权，但对消费者行为的研究一致表明，这些措施并没产生太大影响。大多数退出条款未被公众阅读，也未被公众使用。\n\
  *   `加入通知`（Opt-In Notice）——要求消费者接收通知，告知公司正在收集信息或有权访问移动设备的组件，并通过复选框、按钮或其他形式的同意做出肯定的许可。例如，为了允许\
  \ 13 岁以下的儿童让公司收集该未成年人的个人身份信息，需要获得家长的同意。\n*   `强制用途规范`（Mandatory Usage Specification）——法律要求公司收集的信息只能用于其指定的目的，而不允许用于其他目的。例如，录像带租赁记录不能出售给第三方或用于营销目的。\n\
  *   `信息使用禁止`（Information Usage Prohibitions）——法律要求严禁以未经授权的方式获取和使用信息。使用禁止的例子包括《民权法案》的\
  \ `Title VII` 和 `GINA`。例如，`GINA` 限制雇主和保险公司在招聘和医疗决策中使用基因数据。`Title VII` 禁止歧视，当公司获取有关员工属性或状态的信息并使用该信息进行歧视时，可能会发生歧视。这些公司可以通过各种合法活动获取信息。法律规范的是信息的使用，而不是信息的收集或传播。\n\
  \n法律在利用这五类隐私管理方面各不相同。在任何要求消费者“加入”或“退出”的法律中，通知始终是一个组成部分，但当法律有用途限制时，通常不需要通知。在过去的十年里，隐私监管的方法已从强制通知转变为通过“加入”或“退出”条款提供某种形式的消费者控制。\n\
  \n## 3. FTC 的角色\n\n鉴于监管美国隐私的广泛联邦法律，没有任何单一机构具有执行隐私监管的全面管辖权。隐私是医疗、金融、教育、交通和许多其他受监管行业监管的一个组成部分。然而，对于普通公众而言，联邦贸易委员会（`FTC`）已成为主要的隐私联邦监管机构。\n\
  \n`FTC` 监管隐私违规行为的权限始于对其通用职责的解释。根据《联邦贸易委员会法案》（`Federal Trade Commission Act`）第 `5`\
  \ 条，“在贸易中或影响贸易的不公平或欺骗性行为或做法……被……宣布为非法。” 这是一个极其广泛的授权陈述。`FTC` 对这些术语的解释如下：\n\n“欺骗性”行为被定义为……涉及一项实质性的陈述、遗漏或做法，这些等极可能误导在特定情况下表现合理的消费者。如果某行为或做法导致了或可能导致消费者遭受重大损害，而这种损害是消费者无法合理避免的，且未被对消费者或竞争的利益所抵消，则该行为是“不公平”的……\n\
  \n某些元素构成了所有欺骗案件的基础。首先，必须存在可能误导消费者的陈述、遗漏或做法。在特定案件中发现具有误导性或欺骗性的做法包括虚假的口头或书面陈述、误导性的价格主张、在没有充分披露的情况下销售危险或系统性缺陷的产品或服务、未能披露有关金字塔销售的信息、使用诱导换技巧、未能履行承诺的服务以及未能履行保修义务。\n\
  \n其次，我们从特定情况下表现合理的消费者的角度来检查该做法。如果该陈述或做法影响或主要针对某一特定小组，委员会将从该小组的角度检查其合理性。\n\n第三，该陈述、遗漏或做法必须是“实质性”的。基本问题是该行为或做法是否可能影响消费者对产品或服务的行为或决策。如果是，则该做法具有实质性，且消费者很可能受到损害，因为由于如果没有这种欺骗，消费者很可能会做出不同的选择。\n\
  \n除了根据第 `5` 条授予的通用权限外，国会还专门授权 `FTC` 在《儿童在线隐私保护法》（`Children’s Online Privacy Protection\
  \ Act`）等领域拥有主要管辖权。`FTC` 可能会提起刑事诉讼，但在大多数行动中，`FTC` 采取行政听证，这可能导致民事处罚。违反第 `5` 条的行为并不产生民事诉讼理由，但州法律有时为被发现使用不公平或欺骗性做法的公司的受害者提供直接诉讼的依据。\n\
  \n\n\n\n\n联邦法律仅要求那些在联邦监管行业内运营的公司制定隐私政策。为了补充这一点，对于大多数企业而言，发布隐私政策的义务源于州法。这些法律中的第一个是\
  \ 2004 年的《加州在线隐私保护法案》（`CalOPPA`）。增加自身法律的州通常会遵循 `CalOPPA` 的要求。\n\n该法规规定，其适用于“一个商业网站或在线服务的运营商，该运营者通过互联网收集居住在加州、使用或访问其商业网站或在线服务的个人消费者的个人身份信息……\
  \ . .”。加州总检察长已将“在线服务”解释为涵盖移动设备上的应用和其他其他程序。大多数商业网站在创建不同的披露信息时不会区分用户的地理位置，因此 `CalOPPA`\
  \ 适用于美国全范围内大多数商业网站和 App 公司。\n\n### 121 种额外的监管法\n\n自 `CalOPPA` 生效以来，又颁布了两部涵盖大型企业的法律。欧盟的《通用数据保护条例》（`GDPR`）涵盖了在欧洲开展业务的某些美国企业。《加州消费者隐私法案》（`CCPA`）监管年总收入超过\
  \ 25,000,000 美元或符合其他最低要求的加州企业。这两部法律在书中各自的章节中进行了讨论。对于普通业务，适用以下规定：\n\n### 1. 发布隐私政策的组成部分\n\
  \n隐私政策的目的是解释收集哪些信息以及如何使用这些信息。五十州中的每一个州都有某种形式的《不公平和欺骗性行为法案》，其运作方式与 `FTC` 第 5 条类似。FTC\
  \ 和许多州已利用这些法律对未能遵守其已发布隐私政策的公司采取行动。一旦公司决定发布其隐私政策，州和联邦当局都可以对未能遵守其条款的公司处以罚款。\n\n根据\
  \ `CalOPPA`，通知必须包含以下内容：\n\n* 隐私政策的生效日期。\n* 它所收集的信息类别。\n* 可能与其共享信息的第三方类别。\n* 消费者可以查看并请求更改的过程。\n\
  * 运营商通知消费者隐私政策变更的描述。\n* 主页链接的位置。\n\n为了履行这一义务，运营商必须提供：\n\n* 对其收集的信息的描述。\n* 对如何使用这些信息的描述。\n\
  * 对与其共享的第三方的描述。\n* 对消费者可以查看并请求更改的过程的描述。\n* 对运营商通知消费者隐私政策变更的描述。\n* 主页链接的位置。\n\n链接必须是显眼的。根据\
  \ `CalOPPA`，显眼的链接必须满足：\n\n* 位于主页上。\n* 字体大小等于或大于周围文本。\n* 使用“privacy（隐私）”一词。\n* 与周围文本区分开来。\n\
  \n### 2. 发布隐私政策的执行\n\n在 `CalOPPA` 通过之后的头几年里，FTC 的行动往往集中于未能遵守其隐私政策的公司。随着业务实践的改进，公司现在通常倾向于遵循其关于使用消费者数据的规定政策。这些声明在收集信息的量、允许的跟踪工具以及为了广告和消费者画像而将信息出售给第三方方面往往更加坦诚。由于\
  \ FTC 只能采取行动执行这些政策，因此一份解释公司如何利用其所收集信息的诚实隐私政策不会引发任何责任。\n\nFTC 还会对做出虚假承诺的公司采取行动。例如，2014\
  \ 年，它对 125Snapchat 发起了诉讼，原因是其未能履行承诺，即用户的快照（snaps）在发送者指定的简短时间后会“永远消失”。相反，Snapchat\
  \ 明知有几种接收者可以无限保存快照的简单方法。\n\n\n\n\nFTC 的行动始于调查。这些调查通常是不公开的；然而，如果 FTC 认为调查符合公共利益，它将公开该调查。FTC\
  \ 依赖公众投诉、州政府部门的信息以及自身的努力来决定提交哪些案件。鉴于媒体对各种隐私侵权行为的大量报道，在 FTC 采取行动之前，通常会有大量的公开信息供其参考。FTC\
  \ 的规模和资源也相当有限，因此它只对极少数涉及可能违反 `Section 5` 的案件进行调查。\n\nFTC 提供了有关其处理流程的更多细节：\n\n在调查之后，如果委员会有“理由相信”法律正被或已经被违反，委员会可以通过行政程序或司法程序启动执法行动。\n\
  \n### 行政执法\n\n当委员会有“理由相信”发生了法律违行为时，委员会可以发布起诉状并列出其指控内容。如果被诉方选择和解指控，它可以签署一份同意协议（不承认责任），同意进入最终命令，并放弃所有司法审查的权利。如果委员会接受了拟议的同意协议，它将该命令置于记录中进行为期\
  \ 30 天的公众意见征（或委员会规定的其他期限），然后再决定是否使该命令最终生效。\n\n如果被诉方选择对指控提出异议，诉状将在委员会实践规则下进行的审判性程序中，由行政法官（`ALJ`）进行审理。案件的起诉由\
  \ FTC “诉讼律师”负责，他们是来自相关部门或地区办事处的工作人员。听证结束后，ALJ 将发布一份“初步裁决”，列出其事实发现和法律结论，并建议进入停止命令或驳回起诉。诉讼律师或被诉方或双方均可向全体委员会对初步裁决提出上诉。\n\
  \n在对初步裁决提出上诉后，委员会将收到诉状，举行口头辩论，随后发布自己的最终裁决和命令。委员会的最终裁决接受任何被发布命令的被诉方上诉。被诉方可以在其居住、开展业务或使用争议行为的管辖范围内的任何美国上诉法院提交审查请求。\n\
  \n### 司法执法\n\n即使委员会通过审判确定某项行为违反了消费者保护法或竞争法，委员会仍必须寻求法院的帮助，以就违反其停止命令或贸易监管的行为获得民事处罚或消费者救济。\n\
  \nFTC 法的 `Section 13(b)` 授权委员会寻求初步和永久禁令，以救济“由联邦贸易委员会执行的任何法律规定”。当委员会有“理由相信”任何一方“正在违反或即将违反”由委员会执行的法律规定时，委员会可以请求地区法院禁止涉嫌违法的行为，同时等待\
  \ FTC 行政程序完成以确定该行为是否违法。此外，“在恰当的情况下”，委员会可以寻求且法院可以授予永久禁令。\n\n委员会不仅可以寻求禁止不利或欺骗性行为的永久禁令，还可以寻求实施各种形式的金钱公平救济（例如赔偿和撤销合同）以弥补过去的违规行为。在某些情况下，委员会还可以通过获得临时限制令和初步禁令来冻结资产并任命临时接管人，以保留最终货币公平救济的可能性。\n\
  \n近年来，FTC 的行动更积极关注收集个人信息的公司适当保护这些信息的责任。包括 Twitter、Fandango、Credit Karma、VTech 和\
  \ Wyndham Hotels 在内的公司因未能保护其收集的消费者信息而成为行政行动或诉讼的对象。FTC 还关注在线消费者体验的其他方面，包括使用欺骗性广告、社交媒体影响者的作用以及关于隐私的虚假陈述。一个特别关注是针对使用在线和移动技术的消费者的广告。\n\
  \n### 加州消费者隐私法\n\n正如 `CalOPPA` 在 2004 年凭借其对隐私政策的要求领先美国一样，加州再次通过《加州消费者隐私法》（`CCPA`）设定了国家级标准，该法已\
  \ 2020 年 1 月 1 日生效。尽管它的范围没有 `CalOPPA` 那么广，但它对商业网站和移动应用程序的影响具有重塑既有隐私法规范的相同潜力。随着 `CCPA`\
  \ 的持续发展，它有可能成为美国隐私政策的标准。\n\n`CCPA`并不涵盖所有企业，但其范围远超 2020 年之前存在的部门隐私保护。该法适用于任何在加州经营业务并符合以下三项标准之一的营利性公司或其他业务组织：\n\
  \n*   年度总收入超过 2500 万美元；\n*   购买、接收或出售 50,000 名或更多消费者、家庭或设备的个人信息；\n*   年度收入的 50%\
  \ 或以上来自出售消费者的个人信息。\n\n`CCPA` 还涵盖任何控制或受符合上述任何标准的公司控制的企业。`CCPA` 不适用于慈善机构或政府实体（如市政当局或州立大学）。然而，由于企业之间的合同关系，许多本无义务遵守\
  \ `CCPA` 的公司可能被要求遵守其条款。`GDPR`（欧洲《通用数据保护条例》）也是如此，但对于公司来说，证明自己不在 `GDPR` 涵盖的业务范围内比在\
  \ `CCPA` 范围内要容易得多。\n\n`CCPA` 为加州居民赋予了此前在美国法律下未曾被承认的新权利。加州总检察长办公室对这些权利总结如下：\n\n*\
  \   获知所收集、使用、共享或出售的个人信息的权利，包括类别和具体的个人信息；\n*   删除企业所持（并扩展到企业服务提供商）的个人信息的权利；\n*  \
  \ 拒绝出售个人信息的权利。消费者可以指示出售个人信息的企业停止出售该信息。16 岁以下的儿童必须提供选择性同意，13 岁以下的儿童则需由父母或监护人同意；\n\
  *   当消费者行使 `CCPA` 项下的隐私权利时，在价格或服务上获得非歧视对待的权利。\n\n然而与 `CalOPPA` 不同，实施 `CCPA` 的企业可以明确其政策中的义务仅适用于加州居民。如果企业这样做，它们就可以避免对非加州消费者做出同样的反应。尽管如此，`CCPA`\
  \ 要求的业务流程变化可能会让全范围内的消费者受益。\n\n\n\n\n\n个人信息的定义极其宽泛，远超 `CalOPPA` 中的定义。这一定义涵盖了知情权、删除权、退出权以及免受歧视的保护。对于数据泄露通知的规定，使用了较窄的定义。对于消费者权利，个人信息的定义包含了几乎所有关于一个人的存在的非公开信息，包括以下内容：\n\
  \n(A) 标识符，如真实姓名、别名、邮政地址、唯一个人标识符、在线标识符、互联网协议地址、电子邮件地址、账户名称、社会安全号、驾执照号码、护照号码或其他类似的标识符。\n\
  \n(B) 识别、关联、描述或能够与特定个人关联的信息，包括但不限于其姓名、签名、社会安全号、身体特征或描述、地址、电话号码、护照号码、驾执照或州身份识别卡号、保险单单号、教育、就业、工作历史、银行账户号、信用卡号、借记卡号或任何其他财务信息、医疗信息或健康保险信息。\n\
  \n(C) 受法律保护的分类特征，例如年龄、种族、性别、宗教、退伍军人身份、残障状况、婚姻状况、性偏好和性认同。\n\n(D) 商业信息，包括个人财产、购买、获得或考虑过的产品或服务的记录，或其他购买或消费历史或倾向。\n\
  \n(E) 生物识别信息。\n\n(F) 互联网或其他电子网络活动信息，包括但不限于浏览历史、搜索历史，以及有关消费者与互联网网站、应用程序或广告交互产生的信息。\n\
  \n(G) 地理位置数据。\n\n(H) 音频、电子、视觉、热能、嗅觉或类似信息。\n\n(I) 专业或与就业相关的信息。\n\n(J) 非公开教育记录。\n\n\
  (K) 从本节所识别的任何信息中得出的推理，用于创建消费者的画像，反映消费者的偏好、特征、心理趋势、倾向、行为、态度、智力、能力和天赋。\n\n对个人信息这一宽泛定义的唯一局限性是，它排除了公开可用的信息。就本段而言，“公开可用”是指从联邦、州或地方政府记录中合法提供的信息。这与从消费者其他来源收集的公共信息相比，定义要窄得多。\n\
  \n消费者有权知道关于该个人收集了哪些信息。这本质上要求公司能够为其数据库中的每人提供一份报告。`CCPA` 要求此类报告仅涵盖过去十二个月的数据收集情况。报告必须以用户友好的格式提供。\n\
  \n除了获得知晓收集了哪些信息的权利外，加州消费者还有权知晓这些数据如何被使用、共享和出售。这意味着企业必须解释收集信息的业务目的，以及公司是否向第三方出售或共享这些信息。如果有第三方可以访问这些信息，公司必须提供接收这些信息的第三方类别以及对这些信息进行了哪些处理。这些信息必须在收集时或在此之前提供，并包含在公司的隐私政策中。\n\
  \n## 2. 控制收集数据的权利\n\n加州消费者拥有了新的权利来控制其数据的收集和保留。为加州消费者提供服务的企业必须提供一种简单的程序，允许消费者请求从公司存储的数据中删除已收集的消费者数据。`CCPA`\
  \ 要求企业为消费者提供一个免付费电话号码以提交请求。如果该企业拥有网站，则企业还必须提供在线处理流程。一旦请求删除的消费者通过身份验证，公司必须在 45 天内遵守。对于许多公司来说，现在意味着网站需要提供一个“不收集”按钮，就像\
  \ `CalOPPA` 要求的“不跟踪”按钮一样。\n\n虽然 `CCPA` 要求消费者有权获得已删除的信息，但法律并未明确包含任何纠正报告中错误的权利。当然，依赖这些数据的公司自身也有动力来保持信息的准确性。如果客户请求纠正信息而公司拒绝，客户可以采取要求删除其所有信息作为回应。此外，由于所收集信息的许多方面可能具有主观性，一个独立的纠正信息权利可能会产生比加州监管机构想要引入的得多的冲突。\n\
  \n`CCPA` 对消费者删除其个人信息的权利包含了一些限制。最重要的限制是出于业务目的而收集的信息。正如法中定义的那样，“业务目的”是指“将个人信息用于该业务或服务提供者的运营目的，或其他告知的目的，前提是该个人信息的使用对于收集或处理该个人信息时所实现的运营目的，或对于与收集该个人信息的背景相符的另一个运营目的而言，是合理必要且成比例的。”\n\
  \n业务目的必须在通知和披露中列出，以便后续在数据操作和数据保留中有所依据。法律提供了一份可接受的业务目的列表，可以总结如下：\n\n*   审计消费者交易，包括广告展示和相关措施。\n\
  *   防止安全风险，包括恶意的、欺骗性的、欺诈性的或非活动。\n*   识别并修复编程错误。\n*   短期、瞬时使用，包括上下文广告。\n*   代表业务或服务提供者提供客户服务、处理、订单履行、账单和支付、提供广告或营销服务、提供分析服务或提供类似服务。\n\
  *   开展技术开发和演示的内部研究。\n*   管理或改进由业务拥有、制造、为之或控制服务的质量或安全性。\n\n这些活动构成了业务的核心运营。这对 `CCPA`\
  \ 的范围是一个重大限制，并将减少消费者提出的删除信息请求的影响。\n\n此外，消费者可以允许个人信息留在企业处，同时要求企业不向第三方出售信息。`CCPA`\
  \ 法规规定，如果企业出售个人信息，则必须放置一个标题为“不出售我的个人信息”或“不出售我的信息”的链接。任何应用程序也必须提供该链接。该网址也必须在非互联网出版物可用。“不出售”规定不包含相同的业务豁免，因此这些规定的适用范围会更广。\n\
  \n\n\n\n\n对于收集未成年人的信息，公司在未获得明确同意的情况下不得出售个人信息。法律要求采取肯定的、加入（opt-in）的同意，而不是依赖退出（opt-out）条款。与\
  \ `COPPA` 不同，该法律涵盖了 16 岁以下的未成年人。法律允许 13 至 16 岁之间的未成年人自行选择加入。对于较小的儿童，必须由父母或监护人提供同意。由于担心在线社交媒体公司和视频共享服务忽视了其收集的关于客户年龄的信息，法律还规定“故意忽视消费者年龄的企业应视为对消费者的年龄具有实质性认知”。\n\
  \n### 3. 非歧视权\n\n`CCPA` 提供的最重要的权利之一是非歧视权。这意味着企业不能以客户同意不同意 `135data` 收集作为提供其服务的条件。企业不能再要求在网站上使用\
  \ cookie，或要求提供电子邮箱地址作为查看该网站上发布内容的条件。其他形式的数据歧视也是被禁止的，例如拒绝向消费者提供商品或服务、对同一商品或服务收取不同价格、使用价格折扣、施加惩罚，或向消费者提供不同水平或质量的商品或服务。\n\
  \n在企业在没有消费者信息的情况下无法合法向消费者提供服务的情况下，法律赋予了公司以接收消费者信息作为提供服务的条件。例如，公司必须收集收货和账单地址以运送产品并对其服务收费。\n\
  \n然而，非歧视要求受到一个重大例外的。“任何 . .� .� 禁止企业向消费者收取不同的价格或费率，或向消费者提供不同水平或质量的商品或服务，只要这种差异与消费者数据为企业提供的价值具有合理关联。”这允许对消费者信息进行直接付费，或提供价格激励以鼓励其加入数据收集。这与禁止数据歧视的规定有些自矛盾。\n\
  \n比较这两个不同的要求，法律似乎意在任何激励计划都必须经过清晰解释、是可选的、需要明确的加入模型（opt-in model）来获得同意、允许消费者随时退出，并且是公平的。公平性要求源于法律的最后一句，该法律规定“企业不应使用性质上不公正、不合理、强制或高利贷性质的财务激励措施。”\n\
  \n总而言之，`CCPA` 提供的新权利将要求为加州消费者服务的企业必须建立非常不同的程序来收集其个人 `136information`，能够向其消费者报告其收集了什么，并在收集时披露收集的性质。随着更多法规和法律说明的出台，它将对美国公司的经营方式产生重大影响。\n\
  \n### D. 来自欧盟的通用数据保护条例\n\n欧盟的《通用数据保护条例》（`GDPR`）于 2018 年 5 月生效，比 `CCPA` 早了近两年。当时，许多分析师认为它是自\
  \ `CalOPPA` 以来美国隐私实践中最重大的潜在变化。欧盟考虑到此并制定了该法律，宣布 `GDPR` “是 20 年来数据隐私监管领域最重要的变化。该条例将从根本上重塑从医疗保健到银行等每个行业处理数据的方式。”尽管有这些大胆的声明，但\
  \ `GDPR` 适用于的公司远比 `CalOPPA` 或 `CCPA` 少得多，因此在美国境内的影响范围更为有限。\n\n#### 1. GDPR 限制的跨国范围\n\
  \n尽管 2018 年在美国引起了巨大的关注，但 `GDPR` 的影响非常有限。要落入 `GDPR` 的监管范围，企业必须拥有欧盟“数据主体”的个人信息，即在欧盟或欧洲经济区内的公民或居民。在欧洲开展大量业务的跨国公司和组织无疑将满足这一要求。对于欧盟以外的公司，`GDPR`\
  \ 适用于非欧盟公司，前提是这些公司处理与“提供商品或服务相关的个人信息，无论是否需要支付数据 `137subject` 费用”，或“监控其行为，只要其[欧盟数据主体的]行为发生在联盟境内”。\n\
  \n欧洲数据保护委员会（`EDPB`）还对 `GDPR` 的范围提供了额外的指导。`EDPB` 明确表示，“维持一个在欧盟境内可访问的网站本身并不足以”以使一家公司受到\
  \ `GDPR` 的管辖。另一方面，`GDPR` 不包含规模阈值要求，因此即使是小型在线零售商，如果向欧洲居民发货或收集并跟踪欧洲居民的信息，也将受该法律约束。\n\
  \n另一个重要的考虑因素是欧盟监管机构的范围。`GDPR` 只提供了一个赋予欧盟成员国权力对违规公司处以罚款的系统。除非欧洲数据保护监管机构选择对在某国法律管辖下拥有资产和业务的公司采取行动，否则违规的后果就不会开始。\n\
  \n虽然 `GDPR` 具有域外效力，但监管机构没有。例如，如果一家公司一年内从美国境内向法国公民出售两次小部件，但在欧盟没有其他接触，那么该公司很可能受 `GDPR`\
  \ 约束。但法国监管机构几乎或没有能力调查或罚款这家美国公司。此外，与 `FTC` 类似，欧盟监管机构正试图对每一家在互联网上开展业务的公司进行监管审查。除非某公司从事重大业务，或其行为极其令人愤慨，否则该公司不太可能进入任何欧盟监管机构的范畴。\n\
  \n`GDPR` 远不止是一只纸老虎，但远非国内法律的域外修订。拥有大量国际客户的公司应谨慎地遵守 `GDPR`，但应将其理解为另一种针对国际贸易和跨国数据管理的行业隐私\
  \ `138law`。尽管欧盟付出了营销努力，但它并不是全球消费者隐私的新标准。`CCPA` 在美国更接近这一角色。\n\n#### 2. GDPR 的核心条款\n\
  \n`GDPR` 对个人信息使用了宽泛、通用的定义：\n\n```\n‘个人数据’是指任何与已识别或可识别的自然人（‘数据主体’）有关的信息；可识别的自然人是指直接或间接识别的人，特别是通过参考名称、标识码、位置数据、在线标识符或与自然人的身体、生理、遗传、精神、经济、文化或社会身份相关的一个或多个因素来识别。 . \
  \ . \n```\n\n\n\n\n\nIP 地址、Cookie、RFID 标签等技术的在线标识符在规章的其他部分有所提及。使用来自多个来源的信息来识别个人（例如，将某次交互中的电子邮件与另一次交易中使用的优惠券关联起来，或将电子邮件地址与从信用卡公司或数据经纪人处获得的数据进行匹配），将属于针对可识别数据主体的行为，并处于该规章的涵盖范围内。同样，“对自然人进行画像分析，特别是为了对其做出决策，或为了分析或预测其个人的偏好、行为和态度”，也属于个人数据的定义范畴。\n\
  \n`GDPR` 的结构设计使得，除非个人数据的处理属于六种列举类别之一，否则该处理行为都是非法的。在美国，言论自由是不可受限的，除非在特定情况下且出于迫性理由；而在欧盟指令下，隐私权享有最高待遇。\n\
  \n只有在符合以下至少一项的情况下，处理行为才是合法的：\n\n(a) 数据主体已同意为了一个或多个特定目的处理其个人数据；\n\n(b) 处理对于履行数据主体作为当方的合同是必要的，或者为了根据数据主体的请求在签订合同前采取措施是必要的；\n\
  \n(c) 处理对于遵守控制者必须承担的法律义务是必要的；\n\n(d) 处理为了保护数据主体或其他另一自然人的核心利益是必要的；\n\n(e) 处理为了履行出于公共利益而执行的任务，或为了行使授予控制者的公权力而执行的任务是必要的；\n\
  \n(f) 处理为了实现控制者或第三方所追求的合法利益是必要的，除非此类利益被需要保护个人数据的数据主体的利益或基本权利和自由所抵消，特别是当数据主体是儿童时。\n\
  \n第一段落的第 (f) 点不适用于公共机构在执行其任务时进行的处理。\n\n“处理”是指“对个人数据或个人数据集执行的任何操作或一组操作，无论是否通过自动化手段，例如收集、记录、组织、结构化、存储、适配或更改、检索、查询、使用、通过传输披露、传播或其他其他方式提供、对齐或组合、限制、删除或销毁。”\n\
  \n尽管监管体系非常严厉，但在实践中，大多数欧盟公司已选择依赖控制者的合法利益或合同义务来进行处理。只要个人数据的处理具有合法的业务目的或合同义务，企业就不需要获得数据主体的同意。\n\
  \n在公司确实依赖同意获得收集主体数据的权利时，`GDPR` 设定了显著限制。`GDPR` 对“同意”的定义比美国严格得多。在 `GDPR` 下，同意意味着“数据主体做出的任何自愿提供的、特定的、知情的且明确的意愿表示，其通过陈述或明确的确认行动，表示对处理与其相关的个人数据的同意。”知情同意要求数据主体至少要了解控制者的身份以及处理个人数据的预期目的。`GDPR`\
  \ 序言指出，“如果数据主体没有真实或自由的选择，或者无法在不遭受损害的情况下拒绝或撤回同意，则同意不应被视为自愿提供。”对于为了公司自身使用而收集数据的公司，这些目的可能适用于大多数数据收集。\n\
  \n然而，转售数据的公司需要获得有意义的同意。必须使用通俗易懂的语言针对特定目的征求同意，且是无条件的。数据主体必须能够像提供同意一样容易撤回同意。十六岁以下未成年人的同意必须来自父母或监护人，且必须对来源进行验证。\n\
  \n当公司依赖合同或业务运营的必要性时，不应先要求同意。例如，地图追踪软件在未开启 `GPS` 的情况下无法为用户提供其地图位置。对于此类服务，同意使用 `GPS`\
  \ 是一种虚假选择。虚假选择违反了 `GDPR`。如果要求同意，则必须承认不提供同意的选择，且不能削减服务。\n\n`GDPR` 的同意条款通过改变可以形成合同的条款，取代了“合同同意”的概念。这与美国大量的“点击注册（clickwrap）”裁决形成了鲜明对比，后者改变了特定类型商品和服务的两个合同双方之间的议价能力。\n\
  \n`GDPR` 还因其罚款金额而受到关注。最高罚款为全球年度收入的 4% 或 2000 万欧元中的较高者。对于较轻的违规行为，公司面临高达 1000 万欧元的行政罚款，或全球年度收入的\
  \ 2%，以较高者为准。最早收取的罚款之一是针对 `Google` 的 5000 万欧元罚。\n\n一些分析师指出，`FTC` 对 `Facebook` 处以\
  \ 50 亿美元罚款证明，欧盟的影响已迫使美国监管机构对松散的隐私实践实施更有意义的后果。罚款金额提供了一个重要的提醒：那些在 `GDPR` 框架下运营的公司必须认真对待其义务。\n\
  \n142\n\n### 3. GDPR 下的额外权利\n\n在 `GDPR` 采用之前，数据隐私政策的许多方面对美国公司并没有要求，医疗保健领域除外。`CCPA`\
  \ 纳入了其中几项，例如客户有权接收所收集信息的报告并请求删除这些信息。这些最早由 `GDPR` 引入，但已不再是该法律所独有的。`GDPR` 的这些额外义务对数据政策的设计和合规过程均具有重要影响。\n\
  \n#### 清晰性\n控制者被预期使用通俗、简单的语言进行交流：“控制者应采取适当措施，以简洁、透明、易懂且易于获取的形式，使用清晰、通俗的语言，向数据主体提供……任何沟通……特别是专门针对儿童的任何信息。”控制者必须提供有关其自身的信息、收集数据的依据、所收集数据的特定类型、数据的预期用途以及存储时间的清晰信息。\n\
  \n#### 访问、修订和删除权\n该规定要求数据主体拥有访问所收集的个人数据的权利，并获得有关该信息如何使用的信息。数据主体有权寻求纠正公司（即数据控制者）收集的信息，并删除删除数据。\n\
  \n\n\n\n\n此外，个人可能会请求“删除”信息。删除权是早期的“被遗忘权”的一个更温和的版本，且它取代了后者。根据删除权，个人可以提出删除其信息的请求。当个人认为数据不再被控制者（controller）不再需要这些数据、其已撤回对收集这些数据的同意、认为数据已被不法处理或在类似情况下时，数据主体可以请求删除数据。控制者必须在三十日内做出回应，但也有拒绝该请求的理由，包括对言论自由和信息权的考量。\n\
  \n在数据已更正或删除的情况下，控制者将通知所有接收者变更，除非这样做无法实现或存在不成比例的困难。如果数据主体提出请求，控制者将向数据主体告知这些通信情况。\n\
  \n### 控制者的义务\n受 `GDPR` 约束且在欧盟境外运营的控制者，必须在其中一个欧盟成员国指定一名代表。该代表使欧盟对该公司的代表人行使直接管辖权。\n\
  \n收集数据用于处理的控制者被要求建立足够的技术和管理程序，以确保数据免受意外泄露或故意窃取和盗窃。与大多数数据法规一样，该法律没有规定具体的步骤，因为加密和数据安全的技术措施正在快速演变。这些网络安全义务的性质将在下一章讨论。\n\
  \n然而，`GDPR` 确实将“数据最小化”和“假标识化”确定为公司在适当情况下采用的数据保护原则，以减少数据丢失和滥用的风险。\n\n`GDPR` 要求了严格的数据泄露通知规定，要求公司向监管机构通报任何数据泄露，并提供泄露的性质、规模和可能导致的后果。通知应在“不不拖延且在可行的情况下，于获悉泄露后\
  \ 72 小时内”完成。公司还被提供有关已采取的补救措施以及即将采取的措施的信息。如果“个人数据数据泄露不太可能对自然人的权利和自由造成风险”，则不需要进行通知。这一豁免为使用强加密提供了有力的动力，使得任何数据被窃或控制系统被破解都不会导致客户或数据主体记录的泄露。\n\
  \n## 4. GDPR 给美国公司带来的挑战\n美国公司面临的 `GDPR` 挑战往往分为三大类：(1) 不同司法管辖区之间数据法规的差异，(2) 数据泄露更严重的后果，以及\
  \ (3) 美国和欧盟宪法原则之间的冲突。由于这些冲突，一些美国公司正努力遵守 `GDPR` 在数据管理方面的要求，同时避免那些使美国公司直接与 `GDPR`\
  \ 监管机构接触的职责。\n\n首先，在欧盟法规下，数据的使用将比其在美国的对应品受到更多限制。尽管 `CCPA` 和 `GDPR` 在业务运营方法上相似，但\
  \ `CCPA` 并没有采用 `GDPR` 对“同意”的限制性观点。对 `CCPA` 的合规可以通过使用“退出制（opt-out）”通知条款来实现。这些条款并不满足\
  \ `GDPR` 的同意要求。然而，在欧盟内部，由于业务处理的基本要求允许在没有同意的情况下开展更广泛的活动，同意的重要性已经有所降低。但欧盟的通知并不允许“基于退出机制的同意（opt-out\
  \ consent）”，这意味着这两个系统在某种程度上仍是不兼容的。\n\n其次，在遵守 `GDPR` 时，由外部数据泄露和内部员工违规行为导致的数据窃取、勒索软件和干扰，对数据所有者可能会产生更严重的后果，且对每次数据泄露的响应成本更高。数据丢失和被盗数据的问题可能会引发欧盟监管机构更严格的报告要求。`GDPR`\
  \ 和 `CCPA` 都在这两项法律下引入了针对数据泄露的额外责任，但它们仅在方法上相似的。\n\n第三，也是概念上最具挑战性的是，`GDPR` 的限制可能与美国的法律言论自由权发生冲突。美国宪法规定的言论自由权与欧盟的基本隐私观念（如删除权）相冲突。尽管这种冲突可能在财务上不是最重要的，但它反映了欧盟和美国政策及政治历史之间的巨大分歧。幸运的是，删除权已变得比最初通过时有所收窄，这再次允许了欧盟和美国之间达成更多和谐。\n\
  \n当 `GDPR` 最初提出时，它是一项非凡的提议，其要求远超大多数美国公司准备应对的范围。然而，随着数据保护政策和隐私观念的演变，美国其他隐私法律的要求和通用预期已稳步接近\
  \ `GDPR` 的需求。尽管如此，它仍然作为跨国交易的行业隐私法发挥着其主要作用。\n\n## 5. 美国与欧盟公司之间的交易\n即使在 `GDPR` 采用之前，欧盟指令就限制了将欧盟居民的个人信息传输到欧盟境外（以及欧洲经济区\
  \ EEA），除非有适当的保证，确保这些信息仅以一种提供至少充分数据保护水平的方式使用。尽管如此，美国和欧盟总部企业之间的经济联系使得数据传输成为许多商业交易的必要条件。\n\
  \n2000 年，美国和欧盟建立了“安全港隐私原则”，这是在 `FTC` 监管下运行的一种自律性模型，允许美国公司自我证明其符合欧盟对数据隐私的要求。然而，在\
  \ 2015 年，欧盟司法法院裁定有关“安全港隐私原则”的协议无效。安全港隐私原则的自我监管未能达到欧盟指令要求的作为充分数据保护的“实质等同”保护。\n\n\
  ### 欧美隐私护盾（EU-U.S. Privacy Shield）\n美国和欧盟意识到，需要一种机制来允许许多业务活动中的数据交易。2016 年，双方同意建立名为“欧美隐私护盾（EU-U.S.\
  \ Privacy Shield）”的新系统。隐私护盾的设计旨在解决安全港原则的局限性。尽管如此，在本书编写时，司法法院仍在继续审查隐私护盾的有效性。它目前作为一种允许数据传输的接受机制在运行，但司法法院的否定裁决将要求美欧之间就美国的隐私保护问题再次达成协议。\n\
  \n隐私护盾允许欧盟消费者与美国公司开展业务。只要美国公司按照隐私护盾建立的规则存储、处理、传输或以其他方式使用这些信息，完成交易所需的信息就可以合法传输到美国。这些义务曾被认为是美国公司的巨大负担，但考虑到由\
  \ `CCPA` 和 `GDPR` 引起的变化，隐私护盾下的义务现在与这些其他法规中采用的隐私类型非常相似。这些包括：\n\n*   关于公司处理的个人数据类型以及使用这些数据目的的信息。\n\
  \n\n\n\n\n* 访问公司收集的个人信息。\n* 关于拟将信息传输给其他公司的说明，以及对进一步传输所收集数据的选择退出（opt-out）权利。\n* 对于敏感信息（如种族、性别、族裔），只有在获得加入（opt-in）同意的情况下才能传输此类数据。\n\
  \n希望在 `Privacy Shield` 协议下进行数据传输的公司必须申请并参与剩余的自认证流程。在某些情况下，公司可以通过 `Department of\
  \ Transportation` 而非 `FTC` 进行认证。仅受不同监管机构管辖的公司（例如受 `Consumer Financial Protection\
  \ Bureau` 监管的金融机构）则不符合资格。公司使用的隐私声明必须特别提及其 `Privacy Shield`，并提供 `Privacy Shield`\
  \ 谅解备描述的通知、退出和加入权利。公司还必须提供关于“救济机制”或投诉解决的清晰信息，包括在适当的情况下使用商业调解和仲裁。针对人员和人力资源数据，还适用额外的规则。申请自认证的的费用基于公司的年度收入。\n\
  \n`Privacy Shield` 还包含一个通过美国 `FTC` 运行的投诉程序和纠纷解决机制。它规定了 `FTC` 有义务为个人提供这种纠纷机制，并采取积极措施监管有关公司遵守\
  \ `Privacy Shield` 标准的虚假声明。\n\n在运营的第三年，`Privacy Shield` 现在已有超过 5000 家参与公司，这表明它已成为一种非常行的数据传输系统。在七个案例中，`FTC`\
  \ 对声称已通过 `Privacy Shield` 流程认证的公司采取了执法行动。由于 `Privacy Shield` 是一个自认证流程，只要公司正确填写表格，就不会有公司被拒绝。`FTC`\
  \ 有能力审查已认证的公司，但它通常只对每月发布的 30 家公司的数据进行随机抽查。与自认证参与者的数量相比，`FTC` 的作用相当微小。\n\n`U.S.`\
  \ 政府缺乏积极进的监管仍然是 `EU` 主要关注的问题之一。同时，随着公司同意接受 `GDPR` 的直接监管，`Privacy Shield` 的使用有可能成为更广泛努力的辅助部分。关于\
  \ `Privacy Shield` 的另一个担忧是，`U.S.` 执法和国家安全机构有太大的权限要求存储在 `United States` 的数据。由于这些是在\
  \ `United States` 运营公司的法律义务，在不更改 `U.S.` 刑法和国家安全法的情况下，公司对这些担忧的任何特殊说明都无法缓解。\n\n##\
  \ 约束性企业规则 (BCRs) 和标准合同条款 (SCCs)\n\n`GDPR` 的采用包含了作为 `Privacy Shield` 替代方案的机制。`BCRs`\
  \ 和 `SCCs` 无法解决 `U.S.` 监视问题，但它们为 `EU` 公司提供了比经常不受信任的 `Privacy Shield` 自律监管强得多的保护水平。`Standard\
  \ Contractual Clauses` 是由 `EU` 发布的一组数据合同条款。`SCCs` 一共有三组。\n\n`SCCs` 是目前允许数据从 `EU`\
  \ 传输到第三国最广泛使用的机制。尽管这些条款在 `EU` 内部也受到司法审查，但这些符合严苛 `GDPR` 标准的合同协议对于那些需要使用云系统和托管系统来保护数据（以保护数据免受\
  \ `EU` 内部自然灾害的影响）的公司，以及涉及 `EU` 居民在联盟境外进行业务的交易公司来说是至关重要的。\n\n`Binding Corporate Rules`\
  \ 与 `SCCs` 的相似之处在于，它们是在实体层面建立的协议，而非通过法律制定。`BCRs` 设计用于在集团内部建立一种法律制度，主要用于可能在不同司法管辖区拥有独立部门的企业运营，例如拥有一个\
  \ `U.S.` 分支和一个德国分支。由于两家公司归于共同所有，`BCR` 可以建立保护该企业内所有公司隐私和安全的规则。\n\n在 `GDPR` 下，`BCRs`\
  \ 和 `SCC` 条款都得到了扩展。基本上，只要企业的每个方面或合同关系的每个方面符合 `GDPR` 的要求，`BCRs` 和 `SCC` 条款就能保持所有\
  \ `EU` 居民数据的安全。这些机制并没有阻止政府机构对数据进行合法审查，但在所有其他方面，它们提供了一个处理数据传输的合理机制。\n\n## E. 行为广告\n\
  \n互联网改变了广告和消费者追踪。广告商现在可以收集有关特定用户的特定信息，而不是匿名的通用数据。这些信息用于决定向消费者展示哪种广告。随着广告公司收集更多的个人信息，数据变得更加精细，画像得到改进，使得关于每个消费者的信息对广告商来说更有价值。\n\
  \n### 1. 广告类型\n\n广义上，广告有三种类型。第一种是通用广告。通用广告与广告相关的内容没有直接关系。例如，出现在当地报纸第一板块的汽车经销商广告，在购买时广告商并并不知道在在广告周围的页面上将印登哪些报道。新闻伦理准则将广告信息和编辑信息分开，以确保广告商无法影响报纸的报道。\n\
  \n报纸上的广告商可能会对读者做出某些假设。通过假设男性更可能阅读商业和体育栏目，汽车经销商可能会选择在这些栏目购买广告。百货商店可能会选择本地栏目或娱乐栏目，认为这些栏目女性阅读得更频繁。但这些基于性别的假设仅仅是刻板印象，预测价值很低。\n\
  \n在网站上，向访问者展示的广告可以根据每个查看者而改变。这种允许从网站内容之外的独立数据库拉取广告的技术，使得广告代理能够提供更具个性化的广告。\n\n广告个性化的第一形式是情境广告。情境广告利用有关网站内容的信息来决定运行哪些广告。如果网站有关于时尚的内容，广告将以服装和配饰为主。如果网站有关于房地产的内容，广告可能以家具、草坪维护或其他与房地产相关的产品和服务为主。这些广告更有可能与消费者产生关联，因为它们与消费者主动寻求阅读的内容有关。情境广告不需要关于个人消费者的特定信息即可生效。\n\
  \n\n\n\n广告个性化的另一种形式是行为广告。在行为广告中，选择广告的软件会根据有关该个人消费者近期活动的可用信息进行选择。简单来说，例如如果一个消费者阅读了一篇关于房地产的文章，软件就会在多个网站上展示有关家具和草坪维护的广告，直到该消费者与另一类更具利润的广告进行互动为止。行为广告对信息进行三角测量。如果消费者首先访问了关于房地产的页面，然后访问了关于住房融资的页面，广告中可能包含搬家公司，因为程序被设定为预测：为住房贷款的人可能很快就会搬家。在理想情况下，行为广告为消费者提供其即将需要的产品和服务的广告。毕竟，这些广告最有可能吸引消费者的注意力。\n\
  \n## 2. 可用于追踪的数据类型\n\n行为广告之所以有效，是因为它尽可能多地了解个人消费者。通过使用各种跟踪技术，网站及其广告商现在可以跟踪用户在网站上浏览的页面；在网站上停留的时间；鼠标与图像和文本交互的移动；对链接的点击；离开网站后访问访问的站点；之前访问该网站及其他网站的情况；设备的地理位置（包括邮政编码——从而获得人口统计学信息）；交互发生的时间以及更多信息。如果设备是手机而非电脑，网站托管商和广告商可能能够追踪消费者的移动。\n\
  \n此外，通过数据经纪商提供的服务，每次网站交互的唯一可用信息可以与手机的地理位置信息，甚至是信用卡的购买信息相结合。免费电子邮件服务通常会扫描电子邮件信息中使用的词汇，将广告的相关性与私人电子邮件通信中的陈述联系起来。\n\
  \n综合来看，数据经纪商和广告商可以精确地了解每个消费者在何时、何地花费金钱、时间和个人兴趣。很少有通用法律监管此类信息的收集。某些行业有联邦限制，且越来越多的州法律要求在收集此类数据时提供某种程度的披露，但美国的消费者正受到严密监控。\n\
  \n## 3. 关于行为广告的规定\n\n2009 年，在广泛审查后，联邦贸易委员会（FTC）推动了广告自律方法的发展。结果是，对于利用收集到的信息进行定向广告，几乎或完全没有联邦监管。`CCPA`\
  \ 的关键方面之一是引入了`do-not-track`（请勿追踪）义务，以帮助防止监控消费者在不同网站间导航时活动的技术的使用。`do-not-track` 作为消费者计算机和移动浏览器中的一种设置运行，旨在标记网站、广告网络和分析公司不要包含来自该消费者的数据。\n\
  \n`CCPA` 经过修订，要求受 `CCPA` 约束的企业必须使加入 `do-not-track` 服务变得简单。这对于基于电脑和移动的网站及应用程序都是强制性的。随着对\
  \ `CCPA` 执行力的加强，加利福尼亚州总检察长将提供额外的法规和指导以实施这项技术。在 `FTC` 最初建议的自律方法下，`do-not-track` 技术在减少在线公司、数据聚合器、广告网络和其他信息挖掘企业的追踪方面没有产生实质性影响。`CCPA`\
  \ 以及其他州类似法律的实施可能会在未来几年改变这种平衡。\n\n### 本章要点总结：\n\n美国的消费者隐私范围仍然相当有限。通过加利福尼亚和欧洲更新的法律，受数据隐私和数据安全法约束的公司数量仍在持续增长。全范围内正在考虑额外的法律，以继续增加普通消费者隐私。\n\
  \n美国大多数隐私保护仍属于部门性，侧重于医疗保健记录、财务信息、为就业收集的信息、十三岁以下的儿童以及类似类别。在这些类别之外，主要的保护来源来自公司发布的隐私政策，这是\
  \ `CalOPPA` 要求的，并由加利福尼亚州总检察长在加州执行以及全国范围内的 `FTC` 执行。\n\n在监管较严格的领域之一之外，隐私政策仅要求公司解释其如何收集和共享个人身份信息，以及公司如何实施\
  \ `do-not-track` 技术。随着 2018 年 `GDPR` 和 2020 年 `CCPA` 的实施，许多美国公司现在必须走得更远，提供隐私政策，这些政策应包括：退出某些数据收集的能力、接收有关其收集的信息副本、删除部分信息的能力，并能够对所收集的数据获得合理的安全保障。尽管有了这些改进，大多数广告继续关注对消费者的行为追踪。\n\
  \n### 需知事项：\n\n- 美国大多数隐私监管仍然依赖于自愿性指南。这些指南对于阻止公司收集、汇总和共享有关个人的数据作用乎其微。\n- 最重要的隐私规则是发布在每个网站和应用程序上的政策。了解公司可以利用信息做些什么仍然是消费者隐私最重要的方面。\n\
  - `GDPR` 和 `CCPA` 的范围有限。公司经常声称符合合规，但它们仅满足了少数要求。\n- 个人身份信息的含义在不同法律之间差异很大，使得很难预测哪些信息受到保护。\n\
  \n### 思考题：\n\n- 在网页浏览和购物的背景下，广告商认为隐私并不是需要的。收集的信息在在使用时并未损害消费者。在多大程度上需要消费者隐私？\n- 法律是否应该更侧重于对收集信息的使用限制，而不是收集信息？这种重点是否能更好地保护公众的隐私利益？\n\
  - 隐私法不断演变。十年后消费者隐私法可能会要求什么，人们如何为这些变化做计划？\n\n\n\n\n为了满足这些要求，公司收集的数据必须以安全、可靠的方式进行保存和使用。本章将对信息隐私的安全方面进行基本概述。它将概述每家企业必须遵循的基本原则，以确保其收集和利用的信息安全可靠。\n\
  \n## A. 数据的诉求——准确性、有效性、可靠性、可验证性和安全性\n\n为了对信息安全有适当的理解，公司及其员工必须首先确定什么是良的数据。毕竟，数据仅仅是原始信息的片段。为了具有可用性，数据必须是准确、可靠且一致的。不同的来源经常互用这些术语。美国审计署对这些概念进行了简要总结：\n\
  \n- `Reliability`（可靠性）意味着数据相当完整且准确，符合你的预期目的，且不受不当篡改。\n- `Completeness`（完整性）指的是相关记录的存在程度以及每条记录中的字段是否填充恰当。\n\
  - `Accuracy`（准确性）是指记录的数据反映实际底层信息的程度。\n- `Consistency`（一致性）是准确性的一个子类，指的是获取并使用足够清晰且定义的数据，以便在相似分析中产生相似的结果。例如，如果数据在多个站点输入，对数据输入规则的不一致解释会导致数据在整体上是不可靠的。\n\
  - `Validity`（有效性）指的是数据是否真实代表了你认为正在测量的内容。例如，如果我们对分析工作绩效感兴趣，且数据库中的某个字段被标记为“年度评估分数”，我们需要知道该字段似乎是获取个人工作绩效信息的合理方式，还是它代表了另一种类型的评估分数。\n\
  \n这些单独的术语有助于理解公司对可信赖的数据的需求。首先，可靠的数据是完整且准确的。准确性始于收集。如果公司收集了关于其客户、员工、运营或供应商的错误或不完整信息，它将无法充分利用这些信息。对信息的分析可能导致决策错误。而且企业检查信息可靠性的能力也将受到损害。例如，公司应该在将信息输入系统时，与其客户、供应商、员工及其他人确认其收集的信息，以确保其准确性。如果收集的地址错误，发货努力将付诸失败，导致时间、费用和关系的损失。如果地理规划基于收集的区号或邮政编码，那么不准确或不完整的数据将降低规划的有效性。\n\
  \n信息也会随着时间变化。客户会搬家，员工会生孩子，供应商会合并，每个人都会变老。收集的数据必须定期更新，并从所有数据库中消除过时信息。\n\n其次，信息必须是有效的。这意味着必须严格遵守结构化数据的规则和定义，以便每条信息都代表公司所认为的内容。例如，邮政编码、社会安全号码和\
  \ 158bank 银行路由号码都可以由九位数组成。从客户处收集一个九位数数字，只有当该数字被正确标记和存储时才变得有用。在这个例子中，公司正确识别出客户提供的九位数数字是社会安全号码，并对其进行了恰当处理。例如，信用卡支付系统在在尝试完成支付处理之前，通常会作为一个独立步骤检查信用卡号、客户邮政编码和安全代码。\n\
  \n数据可靠性的另一个方面是一致性，这意味着对相同的问题每次都会得到相同的答案（除非情况发生了）。如果问一个人在五分制量表上受伤有多疼，此人希望每次根据出的响应都是相同的。相反，如果要求此人在百分制量表上给出评分，那么对于类似的伤害，人的答案更有可能变化。同样，虽然客观的数学测试可以准确反映学生在考试中获得了特定分数，但只有当该测试能预测学生在类似测试中的表现时，它才是一致的。如果测试对所测试的知识没有足够的代表性，它就无法可靠地预测下一次测试的结果。\n\
  \n第三，任何收集的数据都应该尽可能是可验证的。这意味着信息应该是可追溯的，并且应该创建有关交易创建的历史记录。例如，在收集客户销售的信用卡信息之外，信用卡公司还收集了位置信息并对交易进行了时间标记。信息以电子和打印形式记录。医院记录包含了患者、护士和医生的签名和确认，以验证收集时的患者数据。虽然可能无法独立验证收集的每条数据，但数据收集过程结构有助于验证背景并增加对信息准确性的信心。\n\
  \n最后，收集和处理的信息和数据必须是安全的。安全意味着如果没有公司设计的适当授权，无法使用、删除、操纵或复制所收集的数据，这些设计旨在最大化数据利用率并减少数据损坏或丢失的风险。没有安全的数据，恶意第三方可能会更改数据导致无法使用；他们可能会公开数据以造成尴尬和民事责任；他们可能会加密数据以便在不支付赎金的情况下无法使用；或者他们可能会复制数据用于与公司的竞争。对于维护准确、有效、可验证和可靠的数据，安全性至关重要。\n\
  \n对准确、有效、可靠和可验证数据的是公司需要安全数据的关键原因之一。如果数据由于意外或黑客、小偷的恶意行为被修改，那么公司永远无法信任其数据。只有拥有安全的数据，公司才能实现对其数据卫生至重要的其他要求。\n\
  \n## B. 数据安全风险的来源\n\n数据安全对于可靠性至关重要，因为任何在存储期间可以被更改的信息都是不可信的。金融机构必须不断反击小偷创建虚假交易和伪造银行数据的尝试。学区和大学不断阻止入侵计算机系统以更改学生成绩或添加权限的尝试。每个行业都有某种程度的欺诈或盗窃。在缺乏良好安全的情况下，这些努力将导致公司破产。\n\
  \n安全漏洞可能来自黑客、不准确索引数据的软件故障、人为错误、人为不当行为或其他改变、破坏、损坏或不当披露数据的外部力量。这些各种风险有时被称为“攻击向量”。这仅仅意味着对数据安全的威胁可能来自公司外部，也可能来自内部。\n\
  \n\n\n外部攻击有许多动机。它们可能由寻求刺激者、社会或政治活动分子、个人犯罪分子、有组织的犯罪企业，或以网络间谍、网络恐怖主义或网络战争为幌的国家发起。即使一家公司不是组织犯罪或网络间谍活动的目标，其计算机系统也可能被此类第三方攻击者利用，以此建立渗透与该小型企业业务的机会，或利用成千上万家类似的小企业的计算能力。由于每家公司都通过互联网与其他所有公司相连，攻击者总是在寻找脆弱的链接以渗透网络。\n\
  \n然而，安全漏洞同样可能来自企业内部，也可能来自外部。内部威胁源于员工的错误、不明智的捷径以及故意的不当行为。丢失或被盗存储有未加密客户、患者或员工数据的笔记本电脑或手机将导致国家和联邦的责任。现任员工滥用公司数据可能会重大的法律问题。离职或前员工滥用公司数据通常是数据不安全和机密信息被盗的来源。即使信息由授权的员工管理，如果组织缺乏完整的数据策略和有效的培训，也可能导致数据丢失、损坏或误用。\n\
  \n除了外部攻击者带来的风险、忠诚员工的错误以及不满满员工的不当行为外，还有更抽象的威胁。公司可能因为业务资源（如设备、供应商、供应链或其他运营中断）的失败而面临数据丢失或损坏。此外，公司日益面临环境因素带来的风险，如火灾、洪水、风暴、停电、暴乱和其他自然或人为灾害。\n\
  \n这些风险中的每一种都是可以预测的，因此公司可以采取措施减轻损害并提高对威胁的韧性。数据安全的最佳模型是基于 `HIPAA` 对医疗保健数据要求的法规。这些法规要求必须有物理保护、技术保护和管理保护来保护医疗保健记录。对于非医疗保健数据，步骤可能没有那么严谨，但通用的方法应该是相同的。\n\
  \n应该部署软件、硬件和其他防御措施来保护信息和数据的完整性免受外部威胁。任何敏感数据都应使用加密。良好的数据系统应将近期的数据的副本存储在无法被瘫痪主站的相同攻击加密的系统中。许多资源可以帮助公司减少外部攻击风险，并在违规必然发生时做出有效响应。\n\
  \n## C. 数据安全基础\n\n网络安全规划大致分为三类：技术保护、管理保护和物理保护。这种方法基于美国卫生和人类服务部开发的“安全规则”，但这种通用方法为任何机构的数据安全提供了一个极佳框架。安全规则模型的目标是确保所有业务——\n\
  \n- 确保其创建、接收、维护或传输的所有 `[受保护信息]` 的机密性、完整性和可用性；\n- 识别并防御对信息安全或完整性具有合理预见的威胁；\n- 防御合理预见的、未经许可的使用或披露；以及\n\
  - 确保员工的合规性。\n\n广泛的数据安全法随着 `HIPAA` 安全规则的开发而启动，但从 2018 年开始州法律和联邦法规的变更使得这种方法得到了更广泛的强制。`Gramm-Leach-Bliley\
  \ (GLBA)` 安全规则为所有金融机构提供了非常相似的要求。（这些在第 10 章中进行了解释）。《纽约 SHIELD 法案》、《加州隐私保护法案》以及马萨诸塞州、罗德岛州和其他州的类似法律都有相似的数据安全要求。虽然它们在描述方式上差异很大，但每部法律都为企业建立合理的安全措施提供了一个框架，这是基于公司可能面临的潜在风险、业务规模以及可能被盗、更改或破坏的数据敏感性。\n\
  \n即使对于最小的企业，这些步骤对于保护其免数据安全威胁和数据隐私泄露也是至关重要的。对于受 `HIPAA` 或 `GLBA`要求的公司，特定义务比本引言中描述的要得多。通常，保护哲学要求公司根据业务性质和信息的敏感性，努力实现合理的最大保护和最低访问量。\n\
  \n此外，保护计划必须包括与公司有业务往来的供应商和承包商。如果供应商访问了任何计算机系统或任何数据，则供应商必须包含在保护程序中，以确保物理资产安全、实施加密和数据最小化，并确保供应商拥有最低访问权限。许多数据泄露是因为供应商系统被第三方破坏，而供应商没有足够尽职来阻止入侵扩散。黑客知道服务和维修公司连接着成千上万家公司，因此它们是恶意软件和其他攻击常见的目标。\n\
  \n## 1. 物理保护\n\n物理保护范围从公司运营的物理设施到对每个移动设备的跟踪。所有的门、计算机、手机和数据存储设备都需要物理安全。公司应该从其所在地开始。门应该锁好，或者应该有人值守。例如，零售商全天对客户门开放，但他们有员工负责看守所有顾客进出。没有值守的办公区域应该锁好。\n\
  \n机房（无论是大型服务器房还是小型储物室）应该有门锁，仅允许授权人员进入该区域。对于小公司，简单的钥匙可能就足够了。对于存储更敏感或受监管的数据的公司，门锁应包含跟踪信息，以便在发生任何数据泄露时，公司拥有哪些员工进入退出计算机服务器区域的日志。\n\
  \n物理钥匙和访问卡也必须记录并仔细监控，以防止它们在未经授权的情况下复制和共享。当员工在公司内调动或离开时，必须收回钥匙。由于物理钥匙非常容易复制，大多数公司投资了电子锁定系统，该系统可以在员工入职、更换角色或离开时快速更新。\n\
  \n每台计算机、移动设备或其他网络机器也必须具有物理保护。这通常意味着设备受到密码保护，且安全密码没有写在机器旁边，并配有多因素个人身份验证程序。这还需要物理和技术政策减少使用电子邮件、云存储、USB\
  \ 驱动器和其他介质复制和移除受保护信息的能力。\n\n\n\n\n良好的物理安全还包括使用清单系统，以便每台设备都分配给一名保管人/用户，并由保管人负责跟踪设备。技术防护措施之一应该是强力加密，这样当设备丢失或被盗时，它具有密码保护和加密功能，以阻止小偷或其他未经授权用户的访问。同样，所有笔记本电脑和移动设备都应配备远程数据擦除技术，以便从任何丢失或被盗的设备中消除信息。如果个人设备上允许允许，这种远程擦除对于保护公司信息也是合适的。\n\
  \n## 2. 技术防护措施\n\n公众通常通过技术防护措施来考虑网络安全。这些是实现“以敌制胜”的必要步骤：用防火墙对抗黑客。这些步骤无疑是最重要的，但技术防护措施只有在适当的物理和管理措施到位的情况下生效。\n\
  \n在最广泛的范围内，技术防护措施旨在保护账户访问、限制数据输出、审计所有系统和设备的使用情况，并提供完整性检查，以便公司对数据未被篡改或破坏充满信心。此外，必须有技术措施确保数据在使用或传输过程中不被拦截，并在发生故障时有适当的备份和恢复策略。\n\
  \n访问控制始于系统基础。每个公司网络都应该利用防火墙保护、防病毒软件以及对所有软件进行定期更新。安装后，应对每个系统进行检查，确保将默认密码替换为唯一的安全短语。使用运行已知漏洞的过旧软件也会带来麻烦。这是数据泄露的常见原因，可以通过简单的程序保持所有软件更新来轻松避免。虽然成本确实是业务决定继续使用过旧软件的因素，但数据泄露或勒索软件攻击的成本远高于任何软件服务的维护成本。如果软件无法更新，则应从系统中删除。\n\
  \n在公司允许远程访问的地方，应提供虚拟专用网络（`VPNs`），以尽可能减少第三方监控和访问传输信息的能力。使用公共网络时，登录凭据始终存在暴露风险。`VPN`允许在更安全的环境中进行远程访问。\n\
  \n访问控制还包括系统分区。对于许多企业来说，大多数员工不需要访问存储客户、患者、员工或客户信息的系统。通过运行两个系统，不需要访问更安全数据的员工永远无法访问该网络，因此，一个系统的第三方入侵或员工违规行为无法渗透到另一个系统。访客网络同样可以确保客户和公众排除在网络之外，远离敏感信息。\n\
  \n对于拥有主系统访问权限的员工，访问控制应包括强身份验证保护和数据最小化。这意味着每个登录系统的人必须使用多因素身份验证来获得访问。系统本身的设计应该为每个人提供其完成其职责所需的最少数据和管理控制。\n\
  \n技术防护措施的审计方面应允许公司了解哪些员工在使用系统、正在使用哪些系统、数据流模式以及网络活动。这将使公司能够跟踪从未经授权的位置尝试登录网络的行为、尝试向未经批准的设备发送或外泄数据的行为、跟踪员工或其他人员尝试访问其无权限的信息以及其他尝试示例。管理系统为异常活动创建告警通常可以让公司在入侵发生前将其发现。审计方面还要求对员工进行软件培训，以阻止安装病毒和恶意软件的尝试。完整性控制旨在确保公司维护的数据准确且未被篡改。这对于健康数据和财务数据是要求的。这些有助于确保数据不会在存储和传输过程中因错误而损坏。\n\
  \n## 3. 管理防护措施\n\n公司往往低估管理措施，但这些数据安全方面与物理和技术防护措施同样重要。管理措施是驱动数据保护的政策、程序、培训活动、制度文化以及持续评估。\n\
  \n数据安全始于机构的企业文化。如果组织领导层不认真对待数据安全，那么员工就会忽视指令并低估隐私风险。相反，如果领导层倡导并投资数据安全，那么就能推广安全文化，并要求员工承担责任应对挑战。领导层塑造这种文化既需要资金也需要关注。如果没有资金提供适当的安全措施，`CEO`\
  \ 的演讲将将无济于事。如果高层领导忽视其建议，资金充足的 IT 部门也不会获得任何制度上的尊重。\n\n当高层领导与安全人员之间建立伙伴关系时，数据隐私和安全文化将会蓬勃发展。高层必须接受数据隐私和安全系统的各个方面，包括数据最小化、培训和问责制。即使是`CEO`也不应允许查看患者或客户文件，除非该`CEO`对这些信息有真正的业务目的。`CEO`和其他高层必须参加有关安全要求的适当培训，如果他们故意违反组织政策，必须追究责任。\n\
  \n其次，管理措施需要全面、编写良好的政策和程序并与所有员工共享。这些包括员工手册中的章节、培训手册和定期更新的用户信息。除非这些内容清晰且广泛获取，否则不能要求员工达到预期。\n\
  \n第三，管理措施要求对所有员工接受业务中使用的各种技术和系统的培训，并教他们如何避免数据入侵和盗窃的常见风险。\n\n\n\n\n\n员工培训不应仅限于小时工。高级高管也必须接受培训，确保他们不会以可能危害物理或技术安全措施的方式行事。首席执行官（CEO）绝不应该要求关闭防火墙，或允许从不安全的酒店或咖啡馆服务器登录，而不是通过公司\
  \ VPN 登录。对于高级业务高管来说，这种不便仍然远比公司数据可能变得脆弱的风险要小得多。这些保护措施是企业安全文化的一部分，也反映了黑客和其他第三方常见的攻击向量。\n\
  \n适当的行政保护措施包括对未能遵守业务隐私和安全政策及程序的行为产生后果。这些后果应适用于组织的所有层级，以便新员工、高层管理人员以及其间的每一个人都能参与公司的培训流程和问责流程。\n\
  \n最后，行政保护措施不是静态的。评估和响应成为健康数据安全过程中不可或缺的组成部分。监管数据隐私和安全的法律不断演变，与数据攻击相关的风险变得日益复杂，而且企业的人员也经常变动。由于这些原因，不断刷新政策、程序和培训以保持行政保护措施的实时性和动态至关重要。合规文化要求对物理、技术和行政保护措施的所有方面进行非常积极参与。\n\
  \n为了保持开发的活跃，公司必须持续评估其系统，以确保他们所付出的努力正在生效，了解公司系统可以改进之处，并从行业变化中汲取教训。评估随后有助于公司更新其工作并强化其隐私和安全文化。\n\
  \n## 4. 系统备份与灾难性风险管理\n\n任何数据安全系统的重要义务之一是确保数据免受破坏和盗窃。近年来，勒索软件的威胁日益增加。勒索软件是一种数据侵入形式，在未经授权的情况下对公司所有的信息进行加密。然后，黑客向公司索要解密代码以换取赎金。数据破坏的另一种威胁源于自然原因，包括火灾、洪水、飓风、暴雪、地震或其他灾难性故障。类似的风险也可能由于设备和软件故障发生，特别是对于单一工作电脑的小型企业。\n\
  \n数据表明，公司往往无法从灾难性的数据丢失中恢复，即使这种损失没有伴随物理破坏。对业务运营、收入和关系的成本对小企业来说可能是致命的。\n\n为了管理人为和自然灾害的风险，公司必须建立并测试数据备份和恢复计划。至少，这意味着要在公司办公场所以外的地方存储一组所有数据的最新重复副本。这可以通过使用存储磁带等备份介质来实现。在云计算时代，寻找在离线站点和多个地点存储备份文件的服务已不再是困难事情。\n\
  \n一个包含数据真实备份的系统对于保护业务至关重要。由于勒索软件攻击的威胁，最好拥有一个或多个不仅仅是活动数据同步副本的备份。数据的同步副本可以免受硬件崩溃和自然灾害的影响，但软件错误、故意删除和未经授权的加密可能会跨同步格式传输，并抹掉次级副本。同步只是部分解决方案，它不应是全部解决方案。\n\
  \n此外，在需要数据恢复的灾难情况发生之前，对备份系统进行测试至关重要。备份系统有很多设置，因此公司在首次配置系统时需要对其进行测试，以确保它收集了正确的数据，并且恢复功能运行正常。此外，由于系统会发生变化，应定期进行确保备份正常运行的步骤。根据数据量和系统的复杂性，评估过程的频率从每月一次到每年一次不等。\n\
  \n公司还可以一些较小的步骤来避免灾难恢复的必要性。安装不间断电源（UPS）系统和备用发电机可以保持机器运行，为计划停机提供额外时间。保证多地分布式服务的云服务也有帮助。\n\
  \n最后，尽管有了无纸化办公室，保留关键文件的纸质备份仍然是一种有效的策略。在勒索攻击的情况下，纸质文件不受影响。\n\n## D 信用卡、借记卡的特殊考虑\n\
  \n信用卡系统在互联网和万维网商业化之前就已经传输信息数十年。参与这些交易的大型公司一直采取措施确保系统免受欺诈和盗窃的影响。\n\n2006 年，美国运、Discover、JCB\
  \ International、MasterCard 和 Visa 联合成立支付行业委员会并发布了数据安全标准（PCI DSS）。`PCI DSS` 是针对使用\
  \ POS 机收集信用卡信息，或与银行合作接受信用卡、借记卡或其他支付卡的商户的规定。\n\nPCI 委员会强调持续更新安全性的重要性，以防止盗窃和欺诈。在许多方面，PCI\
  \ 系统与 `HIPAA` 系统非常相似，但专门关注与商户支付相关的设备和操作。每个成员银行都直接与商户合作，为商户提供 POS 设备，并确保供应商遵守数据安全义务。\n\
  \n\n\n\n\n## 8. 为每个拥有计算机访问权限员分配唯一 ID\n## 9. 限制对持卡人数据的物理访问\n*   定期监控和测试网络\n## 10.\
  \ 跟踪并监控对网络资源和持卡人数据的所有访问\n## 11. 定期测试安全系统和流程\n*   维护信息安全策略\n## 12. 维护一份针对员工和承包商的信息安全策略\n\
  \n`PCI DSS` 最重要的方面是成员银行在监督其商户方面所扮演的角色。建立防火墙、更新的密码系统、数据加密、防病毒软件、访问控制以及物理访问控制的义务，都是实现良好数据卫生的基本步骤。它还提醒商户，商户绝不应该收集和存储持卡人数据。商户已不再被允许保留支付信息。\n\
  \n`PCI DSS` 还要求供应商使用的设备必须经过批准，并要定期检查设备，以确保没有人员安装恶意软件或侧录设备来窃取信用卡信息。\n\n然而，尽管付出了这些努力，信用卡采集的风险仍在持续增长。2020\
  \ 年初，`FBI` 发布了一项警告，针对信用卡侧录器在网络环境中的扩大使用。这种行为被描述为 `e-skimming` 或“Magecart 攻击”，窃盗者开发了在主要零售商的虚拟购物车上安装软件的技术。\n\
  \n`FBI` 识别了一些受害者网站，包括 `Macy’s`、`Puma`、`Ticketmaster-United Kingdom` 和 `British Airways`。174\
  \ 这些公司仅代表许多可能安装此类未经授权犯罪软件的公司中的少数。当消费者输入信用卡和借记卡信息时，窃盗者收集这些信息进行转卖。买家随后使用这些信用卡和借记卡在线购物或打印出有效的伪卡。\n\
  \n`PCI Council` 强调，信用卡数据被窃最大的风险来自于未能充分维护每一项 `PCI DSS` 义务。它指出，新的漏洞不断被发现，过时的系统会导致犯罪分子轻易访问。`E-skimming`\
  \ 可能利用正是这种形式的漏洞。`PCI DSS` 提供了一个基于适当数据安全核心基础的合理解决方案。通过保持软件和硬件更新、使用强密码、以及仔细监控公司系统的入侵情况，公司可以大大降低数据泄露的风险。\n\
  \n## E. 需要关注的事——安全入侵的常见向量\n\n所需的安全协议旨在响应特定类型的威胁。以下总结了公司在与其信息和数据方面可能面临的最常见威胁。所有企业都面临着内部和外部数据安全风险。风险发生的频率取决于业务的性质。\n\
  \n### 1. 恶意行为者\n\n数据安全风险通常源于一群众知的威胁来源，即黑入计算机系统的攻击者。在互联网早期，这些威胁中的大部分来自年轻的计算机爱好者，他们破解系统仅仅是为了证明自己有能力这么做。黑客文化仍然存在，但它\
  \ 175 仅占数据泄露和恶意网络行为的一小部分。今天，这些风险更具主意图性。\n\n以下对创建数据安全威胁的个人和群体进行简要介绍：\n\n*   **投入工作的员工**——大多数公司面临的最大风险来自其员工，包括现任员工和离职员工。优秀的员工努力尽可能高效地工作。安全系统通常会减慢运行速度并使工作变得困难。员工写下密码是因为公司实施的系统更改密码过于频繁或密码过于难以记忆。员工创建后门访问以便能在家里工作以满足具有挑战性的截止日期。员工将敏感数据移动到不安全的设备上，因为他们更倾向于使用家中的机器。员工允许同事在授权的情况下登录系统，因为客户和顾客需要及时解决问题。这些每一步都是员工试图让工作做得更好、更快、更方便而采取的。遗憾的是，这些每一步都损害了数据安全和可靠性。\n\
  \n*   **不满的员工**——离职员工比犯下无意但有害错误的员工不常见，但威胁更大。离职员工通常希望将专利信息、商业秘密和业务知识带到下一份工作中去。一些离职员工认为，既然他们为前雇主创建了材料，他们就有权拥有工作的副本，尽管有\
  \ 176 法律和公司政策。其他离职员工则对感知到的不公正对待寻求报复或报仇，并希望伤害前雇主。前员工曾对破坏硬硬盘的恶意软件、重新格式化公司服务器以销毁公司持有的信息、为第三方攻击制造漏洞以及盗取公司信息负责任。\n\
  \n*   **青少年黑客**——每年都有一群孩子满十三岁。对于某些青少年来说，挑战安全系统并对社会机构嗤之以鼻具有吸引力。他们的目标是击败系统，而不是造成破坏或赚钱。这些黑客通常无意造成重大伤害，尽管他们数据入侵的有时会造成实质性损害。这些黑客中少数人持续到二十多岁，但大多数要么将青年的轻率行为转化为职业网络安全背景，要么转向其他活动。\n\
  \n*   **黑客主义者**——网络社区一直对其反文化精神深青睐，尽管它已演变成全球经济中最大的部分。这种数字反文化的内核理念是，社会动荡是政治变化的重要组成部分。如果没有那些为了挑战法律而甘愿坐牢的勇敢个人，隔离法无法被推翻。黑客主义者故意违反法律并攻击机构，以推进他们认为重要的社会议程。像\
  \ 177 民民权利抗议一样，黑客主义随着主流社会和政治环境而起起伏伏。\n\n*   **个人犯罪分子**——Willie Sutton 被被引用，是因为他在回答为什么抢劫银行时说“因为那里有钱。”。Sutton\
  \ 否认了这一引言的准确性，但他承认犯罪分子寻找的是容易获得的钱。今天，钱存在数字钱包、电子账户和数据价值中。犯罪分子被在线存在的财富所吸引。此外，网络犯罪行为比街头犯罪、毒品集团或复杂的商业抢劫要安全得多。犯罪计划更容易实施，被起诉的可能性较低，且通常被定罪者的刑事惩罚也轻得多。\n\
  \n*   **犯罪集团**——由于网络犯罪比前几代毒毒品集团和大规模腐败有效得多，大型犯罪集团已转向网络，要么作为其赌博、勒索、卖淫、贩毒和洗钱业务的延伸，要么作为替代。网络环境没有城镇的地理限制，因此，犯罪集团之间的地盘战对有组织犯罪企业的威胁要小得多。个人犯罪分子可能会发现自己成为更大组织的目标，但尚未没有报告显示集团之间的在线冲突引发了帮派斗。\n\
  \n178 \n\n\n\n\n\n## 国家资助的黑客\n在现代的任何时候，国家与恐怖主义组织和国家资助民兵等非国家行为体之间的战争都比激烈。在网络空间也是如此。政府资助的组织从事工业间谍活动、干预军事行动并威胁外国敌人的关键基础设施，同时为国家赞助者提供了否认政府直接参与的能力。此类攻击曾导致美国的大坝管理系统和发电厂软件、乌克兰的医院以及许多国家的机场运营遭到攻击。\n\
  \n## 军事和政府情报机构\n冷战、东南亚战争和中东冲突已转移到网络空间。所有主要军事强和国家情报机构在网上都有存在。二战后二十世纪的每场重大冲突都在通过在线代理人持续。2013\
  \ 年，剑桥大学出版社出版了《适用于网络战争的国际法手册》（又称《塔林手册》），该手册通过一个多国全球咨询过程编写而成，涉及了许多北约成员国和联合国安理会关于武装冲突的讨论。作者随后于\
  \ 2017 年出版了《塔林手册 2.0》，试图将国际原则扩展到其他国家侵略行为。然而，美国、俄罗斯和其他参与者并不愿意承认《塔林手册 2.0》提出的规范。扩展后的手册将限制一个国家在网络空间进行进攻操作的能力。联合国安理会成员国不愿受有关在线进攻活动的国际协议约束，这说明了军事和国家安全活动具有持续性和流动性，且这些活动持续涉及政府和私人机构。\n\
  \n## 2. 常见攻击\n由于内部和外部威胁，存在各种可能的网络攻击。以下是对最常见威胁的简要总结。\n\n### 社会工程\n这是一种攻击类别，攻击者伪装成他人以获取访问权限或影响。社会工程既发生在网络空间，也发生在现实世界。例如，盗取或使用伪造身份证明就是社会工程的形式。拨打客户服务热线说服公司更改访问信息是另一种社会工程。社会工程还包括一名员工对另一名员工施压，允许未经授权访问计算机系统。\n\
  \n- **钓鱼攻击 (Phishing)**：这种攻击是通过电子邮件或社交媒体进行的社会工程的一种形式。攻击者可能会发送一封要求更新账户的邮件。伪造的请求并非来自受害银行，而是将客户引导至一个看起来像受害者银行的过的网页。当人员输入登录信息时，攻击者就可以利用这些捕取的登录凭据打开受害者的实际银行账户并转走所有资金。\n\
  - **语音钓鱼 (Vishing)**：发生在电话中的行为变体。\n- **鱼叉式钓鱼攻击 (Spear phishing)**：反映了一种高度关注且有针对性的攻击。鱼叉式钓鱼攻击可能会随着时间的推移而发展，以获得受者的信任，通常是目标组织中具有重大权限的人员。高管和\
  \ IT 人员拥有较高级别的机构访问权限，通常是此类定向攻击的目标。\n\n### 凭据收集 (Credential Harvesting)\n网络攻击并非孤立发生。现代攻击建立在之前攻击中收集的信息之上。全球范围内有数十亿人成为凭据被窃取的受害者。结果是大多数人的用户名和密码都被盗窃。如果用户继续使用在受攻击网站或其他网站上被盗并出售的用户名密码组合，攻击者就可以利用这些发布的访问权限获取对受害者账户的控制。这就是为什么用户不要在不同位置之间重复使用用户名密码组合如此重要。\n\
  \n- **暴力破解 (Brute Force Attack)**：凭据收集的一种变体是运行软件，通过运行常用密码列表来尝试打开受者的账户。FBI 将这种技术称为“密码喷洒攻击”。如果受害者使用\
  \ `123456789`、`2001` 或 `password` 作为密码，账户将迅速打开。常见的宠物名和其他流行术语填充了暴力破解攻击的数据库。短语应该很长，使用全全小写字母，不要太明显，并且对用户来说应该容易记忆。虽然“tosleepperchancetodream”比“password”好得多，但它足够流行足以进入暴力破解攻击数据库。将每个\
  \ `e` 替换为 `3` 将降低被猜中的概率。\n\n### 计算机病毒\n计算机病毒是种可以被引入受害者计算机系统中的恶意软件形式。例如，没有防火墙和密码保护的计算机网络可以被任何人重新编码。没有这些基础保护的系统极易受到计算机病毒的影响。如果更新软件的能力受到防火墙和密码保护，那么计算机病毒也必须克服这些保护。计算机病毒通常是自执行的，这意味着当满足感染软件的条件出现时，它们将开始运行。\n\
  \n- **恶意软件 (Malware)**：描述计算机病毒的广泛范畴。\n- **勒索软件 (Ransomware)**：一种计算机病毒形式，设计用于留在系统中直到被触发。恶意软件会加密存储在系统中的所有数据，有时还包括网络上的备份和同步副本。此过程通常发生在深夜，因此无法通过关闭系统来停止。恶意软件随后将向用户发送勒索信，要求支付难以追踪的加密货币以换取加密密钥。一些勒索软件攻击者会履行他们恢复数据的承诺；另一些则不会。勒索软件的另一种变体是威胁要发布数据而非破坏数据。\n\
  - **间谍软件或特洛木攻击 (Spyware or Trojan Horse Attacks)**：另一种恶意软件形式，这种引入受害者计算机系统的软件会监控系统上的活动并与攻击者共享信息。间谍软件可以包括键盘记录器，以便收集密码和财务账户信息。间谍软件通常集成在免费软件产品和免费应用中，使受害者特意下载并安装。\n\
  \n### 针对旧系统的攻击\n黑客和安全分析人员不断寻找计算机网络以及在在系统上的软件和应用程序的漏洞。安全分析人员通常在公众意识到问题之前识别并修复这些漏洞，以防止攻击者利用漏洞。然而，一旦漏洞公开，安全服务与攻击者之间就会形成保护或利用漏洞的竞赛。不使用防火墙和防病毒软件等安全服务的公司将成为各种攻击的受害者。\n\
  \n- **路挂下载 (Drive-by-Downloads)**：如果系统由于缺乏更新的安全而存在漏洞，那么任何攻击者都可以更新并重写该系统以接管操作。\n\n\
  \n\n\n\n## 网络攻击策略与定义\n\n- **零日漏洞（Zero-Day Exploits）**——该术语指的是漏洞公开之前，公司修复其软件所需的时间。它不是一个技术术语，也不是某个特定的软件。相反，该术语指的是任何即将公开的漏洞。如果软件用户发现了漏洞并将其作为警告向公众而不是私下通知公司，这些漏洞就会变得尤为棘手。当这种情况发生时，公司和杀毒软件公司没有任何先期时间来创建修复漏洞的解决方案。\n\
  \n- **SQL 注入攻击（SQL Injection Attack）**——`SQL` 是微软创建的一种编程语言，专门用于处理关系型数据库管理系统中的大量数据。结构化查询注入攻击利用\
  \ `SQL` 服务器的漏洞来暴露数据库中的数据，特别是当软件允许来自未经验证来源的查询，或未限制允许查询的性质时。它还允许攻击者修改或破坏数据，并运行管理命令以造成额外伤害。\n\
  \n- **分布式拒绝服务攻击（DDoS） Attack）**——这种攻击旨在中断网站或网络的运行。在 `DDoS` 攻击中，目标网站会被大量的请求和输入淹没，使其超过了及时响应的能力。通过向受害者系统泛入请求和活动，它会导致系统崩溃，或者让系统的合法用户无法访问。`DDoS`\
  \ 攻击通常不会导致数据盗窃，但拒绝服务可能会造成重大的业务中断。随着网络规模的扩大，`DDoS` 攻击需要大量的计算能力。攻击者有时会黑入公共计算机和安全性较的\
  \ IoT 设备（智能插座、门铃、打印机和烤面包机等），以极大地扩大攻击规模并掩盖攻击源。\n\n- **中间人攻击（MITM Attack）**——攻击者接管如\
  \ `WiFi` 设备或基站之类的通信节点，成为信息和通信流量的中间人。交互中的双方都没有意识到攻击者正在监听通信，也不知道攻击者可能正在更改从一方流向另一方的信息。例如，中间人攻击可以用于更改流出金融机构的银行路由和账户信息，从而在攻击期间窃取所有电汇资金。这种攻击也可以隐蔽地运行，双方永远不会察觉到被窃听。\n\
  \n网络攻击通常涉及上述策略的组合。通过网络钓鱼获取个人的访问权限，对于递送渗透系统所需的恶意软件来说通常是至关重要的。网络攻击者通常非常老练，他们非常有耐心并通过广泛的工具和技术来构建对组织的攻击。\n\
  \n## 3. 恶意行为的目标\n\n在线恶意行为的目的通常与创建在线攻击的行动者性质相一致，尽管这些目标往往交织在一起。例如，犯罪分子和犯罪集团侧重于从其网络攻击中获利。他们可以通过访问财务账户，并通过不可追踪的交易将资金从这些账户转移到自己的账户来赚钱。犯罪分子可以使用\
  \ `ransomware` 向受害者索要赎款，并以解密其文件作为交换。他们还可以收集个人信息，用于勒索网络盗窃的受害者。\n\n对著名攻击的描述有助于说明网络攻击的范围及其后果。索尼攻击在第\
  \ 1 章中描述过。针对伊朗的 `Stuxnet` 病毒攻击展示了网络战争的力量，特别是在武装冲突不可避免的前奏阶段。`Yahoo` 和 `Target` 攻击说明了成功攻击带来的工业后果，而\
  \ `Ashley Madison` 攻击则展示了攻击如何从一个目标转化为另一个目标。\n\n### Stuxnet\n\n`Stuxnet` 病毒通常被描述为世界上第一件网络武器。该恶意软件是由五个西方国家的政府委托开发的，分别是美国、以色列、荷兰、德国以及一个通常被报道为英国或法国的第五国。伊朗自以色列建国以来一直与以色列处于敌对状态，并自\
  \ 1979 年美国大使馆员工被人质以来，一直受到美国的制裁。`Stuxnet` 病毒的目标是根据从荷兰偷取的设计的铀富缩离心机。西方政府声称伊朗正利用这些设备制造武器级铀，使其成为一个军事化的核大国，尽管伊朗声称其只是寻求增强其国内核能计划。\n\
  \n该病毒是由荷兰特工通过 `USB` 插入到 `Natanz` 的软件中的，那里是开发和维护离心机的公司之一。任何伊朗设备从未连接到互联网，也没有暴露在网络攻击之下。通过单个\
  \ `USB` 的引入，该软件传播到其他维护离心机的伊朗供应商处。对于反病毒毒软件而言，`Stuxnet` 看起来就像 `Microsoft` 操作系统的一部分。它只在具有管理必需的特定软件的机器上自我复制。在运行时，它既改变了离心机的操作，又创建了虚假报告向操作员显示设备运行正常。由于\
  \ `Stuxnet` 软件，伊朗的离心机以危险的高速度运行并基本上自我撕裂了，结束了伊朗制造武器级铀的努力。\n\n虽然它可能不是第一个用于物理破坏敌对国家基础设施的政府支持的恶意软件，但它是第一个被承认并赞誉为成功的案例。伊朗的富集计划在没有使用轰炸袭击的情况下停止了，并直接导致了\
  \ 2017 年短暂的伊朗核协议的达成。它证明了恶意软件如何被引入到受到最高安全措施保护的计算机系统中，如何使用软件让广泛的网络针对非常特定的设备，以及如何隐藏攻击操作，直到为时已太晚无法停止其影响。尽管\
  \ `Stuxnet` 病毒攻击从军事角度来看是一个毫无保留的成功，但它也向世界引入了新水平的网络战争和侵略。\n\n### Yahoo 和 Target\n\n\
  在 2013 年，`Target` 和 `Yahoo` 都是大规模网络攻击的受害者。`Yahoo` 的系统被一个俄罗斯组织攻破，该组织的领导者曾服务于俄罗斯联邦安全局（`FSB`），这是机构负责协助外国情报机构追踪网络分子的俄罗斯军事机构。在\
  \ `Verizon` 以 48 亿美元的价格收购 `Yahoo` 之时，低估了数据征收的规模。直到 2017 年，`Yahoo` 才承认所有 30 亿用户的信息都被窃盗，这成为历史上最大的数据泄露。`Verizon`\
  \ 重新谈判了合并价格，将收购价减少了 4 亿美元。分析人员从未确定过这次攻击是由俄罗斯授权的，还是由那些后来被起诉为了自身非法目的的特工非法实施的。姓名、电子邮件地址、密码、安全词和其他信息在攻击发生后的几年里都出现在出售市场上。\n\
  \n\n\n\nTarget 在同年也遭到了入侵。一家为 Target 商店提供供暖空调服务的公司被黑客入侵，攻击者利用这一切入点感染了 Target 的销售点（POS）信用卡机。超过\
  \ 1.1 亿名在 Target 购物的信用卡用户信息被盗取。这次攻击导致 Target 在 2013 年假日购物季期间遭受了超过 1.6 亿美元的损失，股价也下跌了十百分之以上。由于攻击针对的是信用卡，这对\
  \ Target 的购物者来说造成了特别大的困扰。从技术角度来看，这次攻击凸显了授权供应商为企业系统带来的风险和不安全性的威胁，以及恶意软件从一个系统传播到另一个无关系统的能力。销售点机器运行方式与供暖空调系统完全分离，但\
  \ Target 员工的共同访问以及共享的基础设施足以让恶意软件获得传播并并作威的机会。\n\n### 阿什莉·麦当伦 (Ashley Madison)\n\n\
  2015 年对 Ashley Madison 的攻击仍然是互联网时代最具争议的黑客事件之一。Ashley Madison 是作为一个针对寻求外情的男性的约会网站运营的，其口号是“人生短暂，何不偷情”。该公司被许多人视为道德上的侮辱，包括许多女权主义组织。它还经常被指控欺诈。有声称，该网站上高达\
  \ 90% 的女性账户实际上是软件机器人，旨在让男性留在线并付费。它不验证用户的电子邮件和地址，因此公众人物经常在这些伪造受害者不知情或未参与的情况下被添加为该公司的会员。\n\
  \n当 Ashley Madison 的系统在 2015 年被攻破解时，攻击者宣布他们将披露 3000 万用户的姓名和电子邮件。最终，Ashley Madison\
  \ 订阅者的整个数据库被公开，数百个信用卡账户也被泄露。\n\n在 Ashley Madison 数据泄露后，另一群犯罪分子立即利用了机会。他们开始向整个北美的人发送垃圾邮件，威胁如果不支付勒索金，就向受害者联系人录中的人透露他们在\
  \ Ashley Madison 平台的参与情况。在大多数情况下，这些垃圾邮件发送者并没有任何额外信息，也没有破解目标的联系信息。数百万封恐吓邮件被发送出去，尽管只有极少数受害者做出回应，但这也足以让攻击者获得丰厚的回。\n\
  \n第二种欺诈出现了。攻击者向男女发送垃圾邮件，承诺从公开公布的 Ashley Madison 数据转储中删除他们的名字。再次证明，这些承诺是欺诈性的。垃圾邮件发送者骗取了那些恐惧曝光的人的钱，使他们遭受了第二次伤害。\n\
  \n更严重的是，至少有三起自杀与配偶出轨信息的泄露有关，包括多伦的两例和新奥尔良的一名牧师。据报道，数据库的泄露在许多离婚诉讼中也是一个有用的信息来源。尽管泄露造成了社会损害并支付了\
  \ 1100 万美元的赔偿金，该公司在攻击后仍继续运营。\n\n这四次攻击反映了网络攻击的财务、政治、社会和军事动机。当然，大多数攻击是由贪婪驱动的。但还有许多攻击是受个人动机驱动，并为了传递政治信息或出于政治目的推进某议程。此外，网络攻击的成本远超修复计算机漏洞的成本。这些成本包括客户流失、对客户造成损害的诉讼以及对公众信任的破坏，以及应对数据泄露引发的危机所分散的精力。这些成本迅速放大，使数据泄露成为大多数企业非常关注的领域。\n\
  \n## 本章核心要点\n\n要求提供患者、客户或客户隐私的公司还必须保护收集的数据免受盗窃、破坏或腐改。为了维护有效的数据系统，必须以确保准确、可靠和安全的方式收集数据。一旦完成收集，公司所采用的系统必须维护所收集信息的准确性、可靠性和安全性。\n\
  \n为了保持数据安全，每家收集和处理数据的公司必须实施一系列物理、技术和管理步骤，以确保信息受到保护。这些可能是非常简单的步骤，如锁好门、使用防火墙、更新密码、维护防病毒软件，以及对员工进行保护数据所需步骤的培训。对于较大的企业，这些步骤可能涉及更复杂的网络系统管理、使用日志、`VPNs`\
  \ 以及其他高级工具，但类别和策略保持不变。接受信用卡的商户对发卡银行承担着额外的义务和承诺。\n\n数据漏洞的风险既来自企业内部，也来自外部。心存良好的员工可能会为了完成工作而在无意中或有意地绕过数据安全措施。不满的员工和离职员工有时受驱动而获取其前雇主的机密信息，或对他们认为对其过不公正对待的雇主造成破坏。黑客、活动分子、犯罪分子、犯罪集团和政府都拥有可能导致数据泄露和信息窃取的利益。公司必须认真对待所有这些威胁，因为每家公司都有责任以安全可靠的方式维护其数据。\n\
  \n## 需知事项\n\n数据必须经过管理以确保其准确、可靠、可验证和安全，这从信息的收集开始，贯穿于其处理和使用的每个阶段。如果信息在处理过程的任何阶段变得不准确，就会损害数据的价值和可靠性。\n\
  \n数据的威胁均来自组织的内部和外部。公司必须确保其系统认真对待这两类威胁。威胁还来自自然灾害和灾难性事件，这些事件可能会破坏用于收集数据的系统。\n\n保持数据安全所需的物理、技术和管理步骤可以根据公司规模进行扩展。但数据安全的三个方面都必须成为每个维护信息安全计划的一部分。数据安全计划的每个方面都必须定期更新，包括防病毒软件的更新以及保持操作系统处于最新状态的需求。\n\
  \n\n\n\n\n尽管在前章描述了许多旨在保护隐私数据免受盗窃和泄露的步骤，但数据泄露仍然常见。2013 年的雅虎数据泄露导致 30 亿用户的在线信息被盗并最终被出售。2019\
  \ 年，尽管对数据安全高度重视，第一美国金融公司（First American Financial Corp.）实施了薄弱的数据保护系统，导致 8.85 亿账户遭受黑客攻击。万豪国际酒店（Marriott\
  \ International）在 2018 年至 2020 年间发生了多次事件，这是因为其一家子公司未维持适当的安全措施。\n\n考虑到一些规模最大的数据泄露中暴露的账户数量，所有拥有在线账户的人可能在某个时候经历过账户暴露。此外，每年报告的盗窃和入侵事件可能比实际的要得多。\n\
  \n加利福尼亚州是第一个要求公司遭受的数据泄露必须公开的州，该法律于 2003 年生效。如今，美国 50 个州以及哥伦比亚特区、波多黎各、关姆和美国维尔京群岛的法律均要求向该管辖区的居民通知数据泄露。阿拉巴马州是最后一个，它于\
  \ 2018 年颁布了其法律。此外还有额外的联邦法规涵盖某些企业，且`GDPR`的规定适用于受欧盟国际管辖权约束的这些公司。这些法律彼此相似，但在某些要求上有所不同，这使得实际履行披露数据泄露的义务成本高昂且耗时。本总结并不尝试列出这\
  \ 54 个管辖区的规则，而是强调了所有数据泄露通知规则中的共同元素，并说明了在某些关键特征上所采用的政策范围。\n\n虽然某些州法侧重于对营利性公司的监管，或更广泛地针对任何公共信息的持有者，但其他州侧重于政府机构报告任何数据泄露的义务。这些可能包括学校系统、车辆管理局或税务和收入部门。每个州处理这些问题的方式都是独特的，因此披露法律没有通用的方法。\n\
  \n各州越来越希望数据泄露能够公开披露。正如译文所述，各州增加了触发数据通知义务的个人信息类型，减少了触发通知要求的受影响居民最低人数，并消除了泄露必须造成实质性损害的要求。\n\
  \n触发通知的数据泄露通常被定义为“未经授权获取计算机数据，从而损害了公司存储的个人信息的安全性、机密性或完整性”。建立数据泄露不需要证明数据被盗或数据被篡改。一旦公司获悉第三方能够访问其客户数据，根据法律，它就有义务通知那些客户。\n\
  \n法律通常将员工的未经授权访问排除在数据泄露的定义之外，除非员工的未经授权访问导致向第三方的额外泄露。这种区分是务实的。通常情况下，员工可能会无意中访问他们通常不需要客户信息。这可能发生在\
  \ IT 维护、员工培训演练、职位调整、人事调查以及许多其他时候。对客户造成损害的可能性极低，也没有证据表明发生了未经授权的泄露。获得额外访问信息的员工仍有义务不泄露这些信息。因此，发生真实损害的可能性非常低。各州不希望将这些情况与真实的数据盗窃混淆，因此在通知法律中，他们将这些内部事件排除在数据泄露的定义之外。\n\
  \n增加数据泄露通知义务的目的，推测是为了鼓励建立更好的数据安全系统，并利用泄露通知的成本和公众压力作为动力，促使公司安装更好的数据保护系统并采取更激进的措施培训员工。数据安全是昂贵的。但如果数据泄露修复的成本甚至更昂贵，这种想法是，公司将愿意支付成本以避免泄露，而不是与其客户信息进行冒险。\n\
  \n略多于三分之一的管辖区在数据泄露通知法下还提供了私法诉讼理由。这意味着因数据泄露受损害的人可以提起诉讼。然而，这些案件大多数要求起诉的人因数据泄露遭受了实际财务损失。尽管存在大量的数据泄露违规行为，但只有一小部分会导致消费者的直接财务损害。然而，在这些损害发生的情况下，法律通常会让存储数据的公司对发生的损失负责。由于公司意识到这一义务，它们通常会迅速反应以减少财务损失并避免昂贵的诉讼。\n\
  \n## B. 州数据泄露披露法律的结构\n\n每部数据泄露法律都规定，如果指定数量的客户、用户或患者的个人信息被未经授权访问或披露，企业必须提供数据泄露通知。在某些情况下，通知必须发送给州检察长。在大多数情况下，必须使用州法律提供的特定语言向数据泄露的受害者进行通知。\n\
  \n每部法律还将规定泄露的时间指南。美国的典型要求是在获知泄露后 30 天内，尽管州州差异很大。强制报告的最短期限已降至三天，这与`GDPR`允许的时间相同。如果泄露受害者正在与州或联邦执法部门合作，且执法机构需要保密性以进行其调查，则公开通知的时间可能会推迟。\n\
  \n法律还将规定未遵守数据泄露通知要求可能导致的处罚，以及该州公民关于泄露的权利。这些标准元素中的每一个在不同管辖区之间差异巨大。\n\n### 1. 个人信息\n\
  \n自数据泄露通知法于 2003 年首次生效以来，个人信息的定义已大大扩大。它们已经远远超过了姓名、账号和和密码。管辖区定期更新其法律，以扩大公司用于针对个人的潜在标识符的列表。\n\
  \n例如，加利福尼亚州的法律已扩大到包含以下项目作为触发通知检察长和受害者的义务的内容。此定义比`CCPA`对个人信息的通用定义要窄，但仍然是一个非常包罗的列表：\n\
  \n1. 用户名或电子邮件地址，结合密码或安全问题和答案，允许访问在线账户。\n\n2. 用户的姓，或名字首字母和姓，带有第二个元素：\n    * 社会安全号码。\n\
  \n\n\n\n- 驾照号码、加利福尼亚州身份卡号码、税务识别号、护照号码、军证号码，或其他政府文件中颁发的通常用于验证特定个人身份的唯一识别码。\n- 账户号码或信用卡或借记卡号，结合任何所需的安全代码、访问代码或密码，这些将允许访问个人的财务账户。\n\
  - 医疗信息。“医疗信息”是指任何关于个人病史、心理或身体状况，或由医疗保健人员进行的医疗治疗或诊断的任何信息。\n- 健康保险信息。“健康保险信息”是指个人的健康保险保单号或订阅者识别号、健康保险公司用于识别个人的任何唯一标识符，以及个人申请和索赔历史中的任何信息，包括任何申诉记录。\n\
  - 通过对人体特征进行测量或技术分析生成的唯一生物识别数据（例如指纹、视网膜或虹膜图像），用于验证特定身份。唯一生物识别数据不包括物理或数字照片，除非出于人脸识别目的的使用或存储。\n\
  - 通过使用或运行自动车牌识别系统收集的信息或数据。\n\n加利福尼亚州法律排除了公开的个人信息，但仅限于这些信息是“从联邦、州或地方政府记录中合法向公众提供的”。其他州将公开信息视为报告数据泄露义务的豁免范围，某些管辖区包含了所有公开信息，而不仅仅是政府自身发布的公开信息。\n\
  \n与加利福尼亚州一样，许多州越来越多地将生物识别信息加入到其通知法中，尽管这种变化尚未得到普遍采用。例如，亚利桑州增加了报告生物识别数据被盗的要求，其宽泛定义为：\n\
  \n通过对个人的生物特征进行自动测量生成的数据，包括但不限于：(a) 指纹；(b) 面部特征；(c) 视网膜或虹膜扫描；(d) 手部几何结构；(e) 声纹分析；(f)\
  \ 脱氧核糖酸 (DNA) 或 (g) 个个人的任何独特生物特征，前提是这些特征被所有者或被许可者在个人访问系统或账户时用于唯一验证该个人的身份。\n\n通常情况下，个人信息不包括计算机的唯一\
  \ `IP address` 或设备的数字配置文件。广告商和数据聚合器可以根据设备的 `IP address` 或已安装硬件和软件的配置，对计算机或移动设备进行画像分析和识别，而无需识别设备的所有者。对于许多广告目的而言，这种形式的近匿名数据追踪可能非常有用。特定手机的未识别所有者可以在特定地点跟踪网页浏览和购物，这使得行为数据足够精确以追踪设备，而无需知道消费者的姓名、性别、种族或经济状况。在许多管辖区，由于姓名或用户名或其他个人特征的缺失，足以排除任何披露数据泄露的义务。\n\
  \n## 2. 重要性、加密和其他安全港 de\n\n在数据泄露的早期，如果泄露结果可能给那些消费者造成实质性损害，通常会触发向公众和州告知的义务。除非泄露涉及信用卡信息或可用于访问银行账户或其他用于实施欺诈或身份盗窃的信息，否则监管机构在大多数数据泄露中很难证明可能会产生实质性损害。与阿史莉·麦迪森（Ashley\
  \ Madison）事件的情况不同，仅仅被公众知道是客户通常不太可能触发实质性损害要求。然而，在至少十个管辖区，重要性要求并未成为法律的一部分，或者已经通过修正案从法律中删除。\n\
  \n亚利桑州提供了一个州采取中立方案的示例。缺乏实质性损害将消除发送消费者通知的需求，但损害的判定必须由第三方而非公司做出。要信赖于此项豁免，公司必须允许执法机构或法医审计师进行调查。如果调查确认泄露不太可能导致受害者遭受经济损失，则不需要进行泄露通知。在某些管辖区，州允许公司做出此类判定，而其他州则没有将泄露通知限制在那些存在损害风险的情况下。\n\
  \n与亚利桑州相反，阿拉斯加州规定公司可以进行自己的调查。但如果公司认定泄露不会对消费者造成损害的合理可能性，则它必须记录这一判定并向总检察长提供该判定通知。通过这种方式，阿拉斯加州将证明无损害的义务置于公司身上。\n\
  \n在大多数州，如果被盗取的数据受加密保护，则存在一个安全港。如果信息是以加密形式被盗的，则不会触发数据泄露通知义务。当然，如果加密密钥也被盗了，那么这一安全港就不可用了。尽管如此，这是数据泄露通知义务的一个重要例外，也是公司建立加密系统的重要额外动力。\n\
  \n其他州将这一安全港扩展到经过脱敏的信息，使得这些信息无法重新识别到特定个人，或以其他方式变得不可读。加密、脱敏和更改都是为了让数据窃取者无法使用信息，因此如果这些措施有效，数据丢失将对那些信息被盗的人员产生负面影响。\n\
  \n在通常情况下，公司笔记本电脑可能会从员工或供应商处被盗。盗取电脑的窃偷对电脑数据没有特别兴趣。相反，盗偷计划擦除电脑并在 eBay 或 Craigslist\
  \ 上作为旧设备出售。如果笔记本电脑包含未加密的客户数据库副本，无论盗偷者意图利用这些信息，该盗窃行为都会触发数据泄露通知义务。\n\n相反，如果电脑有密码保护和加密，那么盗偷不太可能访问信息。加密极大地减少了设备上的信息被复制并在网上出售的风险。数不尽的数据泄露是由丢失或被盗的设备造成的。这些设备的窃者和捡到者并没有挖掘设备内部的数据。然而，如果没有加密，公司必须将这些事件视为触发通知要求的安全泄露。\n\
  \n俄亥俄州已在其法律中制定了安全港，以促进良好的数据安全实践。在获得俄亥俄州安全港保护的方法中，公司必须“创建、维护并遵守书面的网络安全计划，该计划应包含保护个人信息的行政、技术和物理保护措施，并合理符合行业公认的网络安全框架”。该法规还详细说明了此类网络安全计划的具体样子。\n\
  \n\n\n其他州不包括受联邦法下 `HIPAA` 或 `GLBA` 保护的数据。在这些情况下，遭受数据泄露的公司必须通知联邦官员，但他们没有义务作为额外义务遵守患者或客户所在州的规定。正如第\
  \ 8 章所述，健康与人类服务部（`HHS`）有一套严格得多的规定，包括对数据泄露的巨额罚款。让 `HHS` 负责健康数据泄露，仍然可以确保数据泄露在不消耗州资源的情况下得到解决。\n\
  \n## 3. 与数据泄露受者的互动\n\n数据泄露通知法要求每一位数据泄露受害者都必须被告知泄露情况。数值阈值被用于触发向州总检察长办公室、消费者保护办公室或其他指定机构的报告。在向数据泄露的受害者提供信息时，公司应该考虑由于信息的敏感性和信息被滥用的可能性而可能造成的潜在损害。\n\
  \n公司还应该考虑攻击的性质以及滥用公共信息的能力。披露 `IP addresses` 数据集对公众造成实际伤害的风险很小。相比之下，针对患者列表收集社会安全号码和家庭地址的复杂且有针对性的攻击，很可能用于复杂的身份盗窃。攻击的针对性越强，公司在通知客户时就越积极。\n\
  \n此外，某些州要求如果受影响的客户超过阈值，公司必须通知信用报告机构（如 `Equifax`、`Experian` 和 `TransUnion`）。大多数州将阈值设定为\
  \ `1,000`，尽管 `Texas`（德克州）仅对超过 `10,000` 名居民的泄露建立了此项要求。在实践中，当 `Social Security numbers`、`执照号码`或信用卡号等敏感信息被盗取时，公司应提供此类通知，而不考虑数据泄露规模。`FTC`\
  \ 建议，损害的性质与泄露规模同样重要。\n\n如今，大多数公司为数据泄露的受害者提供一年的免费信用监控。这可能是某些州的要求，特别是对于较大的泄露。例如，在\
  \ `California`（加州），如果公司是数据泄露的原因，则需要进行信用监控，但如果数据泄露是由第三方造成的，则不需要。此外，提供信用监控也有助于减少泄露可能导致的真实经济损害风险，并可能降低遭受数据泄露的公司的责任。\n\
  \n大多数州法律规定了必须向数据泄露受害者提供的信息。`California` 的法律提供了一个实用的例子。它包含了强制性披露和自愿性披露：\n\n*   报告人或企业的名称和联系信息。\n\
  *   已发生或被合理认为已受泄露影响的个人信息类型列表。\n*   通知日期。\n*   泄露日期或预计日期或日期范围。\n*   是否由于执法部门的调查而延迟了通知（如果在提供通知时可以确定该信息）。\n\
  *   对泄露事件的概括性描述（如果在提供通知时可以确定该信息）。\n*   如果泄露暴露了 `社会安全号码`、`驾驶执照号码`或`加州身份证卡号`，则提供主要信用报告机构的免费电话号码和地址。\n\
  *   如果提供通知的人或企业是泄露源，则应向受影响的人免费提供适当的身份盗窃预防和缓解服务（如有），且提供时间不少于 12 个月，并向任何信息已泄露或可能泄露的任何人提供利用该优惠所需的所有信息，前提是泄露暴露或可能暴露了第\
  \ (h) 段第 (1) 小节 (A) 和 (B) 项定义的个人信息。\n\n根据个人或企业的裁量，安全泄露通知还可以包含以下任何内容：\n\n*   关于个人或企业为保护信息泄露的人所采取措施的信息。\n\
  *   关于信息泄露的人可以采取的保护自己的步骤建议。\n*   在涉及生物数据的泄露中，关于如何通知使用相同类型生物数据作为验证工具的其他实体，使其不再依赖数据进行身份验证。\n\
  \n## 4. 通知政府官员\n\n通知数据泄露受害者以及通知相关州机构的义务差异很大，从获知数据泄露之日起最少三天到最多四十五天不等。`Idaho`（爱达荷州）不执行任何时间限制。遭受重大数据入侵的公司应在这种情况下让执法部门。在许多情况下，执法机构将开始调查，在调查尝试追踪数据盗窃时可能会触发机密性需求。这对于在线组织实施的盗窃以及员工和内部人员实施的盗窃尤为重要。\n\
  \n在刑事调查期间，通知义务将中止。这段时间对于公司先于履行报告和补救义务非常有用。\n\n数据泄露通知法最初针对的是严重泄露，因此法律要求在触发通知义务之前必须有大量的记录被泄露。各州通常将此数字设定为\
  \ `1000`。随着越来越多的州颁布法律且法律变得越来越严格，记录记录在某些州降至 `500`，在另一些州降至 `250`。\n\n大多数州都规定了必须向州总检察长或州监管机构提供的内容。例如，大多数州会要求将向数据泄露受害者提供的通知样本也提供给总检察长。总检察长办公室可能会要求有关公司安全努力性质以及公司为应对数据泄露所采取的努力的额外信息。\n\
  \n`Nebraska`（内布拉斯加州）给总检察长的在线通知表有一个复选框系统，允许公司通过从一组类别中选择来识别泄露的形式：\n\n*   计算机、设备或介质盗窃\n\
  *   内部违规\n*   网络钓鱼\n*   无意披露\n*   计算机、设备或介质丢失\n*   外部系统泄露（即黑客攻击）\n*   其他（指定）\n\n\
  该表格还要求公司识别其向客户提供数据泄露通知的方式（书面、电子/电子邮件、电话或替代方案），描述泄露周围的情况，列出获取的个人信息类型，并上传发送给受影响客户的通知副本。在许多方面，该表格既简化又集中了发送给总检察长的信息。\n\
  \n\n\n总检察长的主要职责是确保通知符合其管辖区法律法规规定的义务。然而，每个州都有其自身版本的《不公平和欺骗性贸易行为法案》（即 FTC 法案的州级版本），因此，披露内容中的信息可能会导致收到通知的总检察长采取额外行动。如果总检察长认为，未能保护客户信息是由于糟糕的数据安全实践或公司反复未能保护其数据而导致的不公平或欺骗性贸易行为，那么总检察长可以采取额外步骤要求补救或对公司进行罚款。\n\
  \n通常，总检察长办公室会先要求提供额外信息。然而，如果事件持续发生，总检察长办公室可以与公司建立非正式义务或正式的同意协议。在极端情况下，总检察长可以提起诉讼并寻求巨额罚款。这通常在反复出现数据安全管理不当的情况下才会发生。\n\
  \n## 5. 公众及其他第三方的通知\n\n尽管没有主动向媒体和公众通知的义务，但许多公司最终会公开共享其数据泄露信息。对于上市公司，可能有义务作为公司 SEC\
  \ 证券文件的一部分披露数据泄露情况。向客户和客户的披露并非机密，因此，收到数据泄露通知很容易引发记者的调查。在较大的数据泄露中，从统计上看，受影响的客户很可能包括媒体人员或政府官员。\n\
  \n除了作为报告的一部分与新闻媒体共享信息外，公司实际上可能选择将媒体作为其通知策略的一部分。对于大规模泄露，公司很难触及所有客户。通过一等邮件发送数据通知将变得非常昂贵。公司收集的信息可能不包括邮寄地址。而且随着客户搬迁、结婚和去世，客户邮寄地址的准确性会随着时间的推移而下降。\n\
  \n加利福尼亚州和马萨诸塞州的法律规定了三种情况下可以使用替代通知。当公司没有联系方式来通知居民数据泄露情况时，可以使用替代通知。如果公司能够证明通知居民的成本超过了\
  \ 250,000 美元的财务阈值，有时可以使用替代通知。此外，如果数据泄露影响了超过 500,000 名居民，则可以使用替代通知。每个州都针对其居民考虑这些阈值，而不是考虑泄露的总规模。\n\
  \n在适用替代通知的情况下，公司必须在其公司网站的首页上发布有关数据泄露的信息，并且公司必须提醒全州的主要媒体。这通常以国家性新闻稿的形式进行，涵盖的内容与本应放入个人通知信中的相同类型的信息。\n\
  \n通过媒体进行国家级泄露披露的真正益处是其允许降低成本。新闻媒体对数据泄露的额外关注增加了因泄露引发诉讼的可能性、增加了黑客进行额外第三方数据攻击的可能性，以及对于上市公司而言，增加了损害其公司股票价格的负面报道风险。在\
  \ Target 数据泄露的案例中，新闻报道导致了购物量的下降和销售收入的大量损失。\n\n负面媒体报道通常是有害的。尽管如此，公开披露是数据泄露通知的核心要素。在数据泄露方面若不坦诚，从长远来看可能会导致更负面的后果。\n\
  \n还可能存在通知第三方的义务。FTC 指出公司可能拥有账户的访问信息但不拥有账户内部的信息。例如，商户通常不应在文件中保留客户的信用卡信息，但商户可能在其数据中拥有访问信息。在这种情况下，商户应该通知其访问的每个金融机构。同样，如果社会安全码被盗，公司应向三家主要的信用局报告此情况。\n\
  \n## C. 纽约州 Shield 法与 WISP 要求\n\n纽约州的《停止黑客并改进电子数据安全法案》（`SHIELD Act`）为州数据隐私监管提供了一个实模型。纽约州是包括马萨诸塞州、加利福尼亚州和罗德岛州在内的少数州之一，要求建立“书面信息安全计划”（`WISP`）。该法律范围非常广泛，适用于所有收集纽约州居民隐私信息的人。\n\
  \n由于该法律侧重于根据书面安全政策提供合理安全措施的义务，因此是一部普通法律，而不是针对任何特定行业部门。这些法律中的每一个都适用于其居民，但例如 `SHIELD\
  \ Act` 的实施方式使得在纽约经营的公司遵守其针对所有消费者的标准。\n\n尽管 `WISP` 法可能因为包含这些条款而被归类为数据泄露通知法，但它作为州数据安全法的范脱颖而出，因为它创建了提供合理的行政、物理和技术措施的义务，以保护实体收集的信息。\n\
  \n`SHIELD Act` 将“个人信息”和“隐私信息”作为两类独立的受保护数据。个人信息是“任何关于自然人的信息，由于其姓名、号码、个人标记或其他标识符，可以识别该自然人”。相比之下，隐私信息是个人信息加上身份标识码，例如州\
  \ ID、社会安全码、信用卡和借记账户号码（即使没有这些账户的 PIN 码或访问代码）或其他账号。隐私信息还包括一个广泛的生物识别类别，不仅限于指纹、声纹、视网膜、面部以及以及生物识别数据的其他独特物理表示或数字表示。最后，隐私信息类还包括“与密码或安全问题及答案相结合的用户名或电子邮件地址，这将允许访问在线账户”。\n\
  \n`SHIELD Act` 既是一部像 `HIPAA` 条例那的数据保护法，也是是一部数据泄露通知法。保护条款要求对有关纽约州居民的数据提供合理的物理、行政和技术保护，并体现在书面计划中，定期审计和评估。`SHIELD\
  \ Act` 将符合类似制度的公司视为符合该法，因此受 `HIPAA` 或 `GLBA` 监管的公司不需要提供第二套数据安全制度。对于小型企业有一定的有限的灵活性，小型企业定义为员工少于\
  \ 50 人；年收入少于 300 万美元；年末总资产少于 500 万美元。\n\n第 9 章中 `HIPAA` 的讨论提供了物理、行政和技术保护的详细描述。`SHIELD\
  \ Act` 和类似的 `WISP` 法遵循 `HIPAA` 安全规则的基本模型，但义务描述较为简单。\n\n### 物理保护。\n\n公司必须规划其运营，以确保个人和隐私信息的物理存储免受盗窃、滥用、丢失和操纵。这些义务包括\n\
  \n*   存储数据的物理设施。\n*   保护数据的方式。\n\n\n\n\n* 限制组织内部人员访问数据的能力。\n* 对不再应再保留的数据进行销毁和处置的过程。\n\
  * 一个用于审计或确保这些物理系统未被破解的系统。\n\n## 行政防护措施\n\n行政防护措施是信息安全中最关键也最容易被忽视的方面。`WISP` 法律（如\
  \ `HIPAA Security Rule`）通常要求指定一名高级别别安全官作为负责实施所有数据安全工作的责任人。如果公司规模较小，指定的安全官也可以兼任公司的其他职责，但每家公司都必须有一位指定的人员。\n\
  \n被指定为数据安全负责人的人员通常是专注于数据安全的员工团队的成员。由于 `SHIELD Act` 和其他 `WISP` 法律现在除了信息的盗窃或破坏外，还关注对信息的访问，因此员工培训变得日益重要。对信息的未经授权访问可能成为安全事件的基础，而这通常是由拥有系统访问权限的现有引起的。合理的数据安全计划将同时涵盖内部和外部风险。\n\
  \n培训、审计、更新以及识别公司可能面临的问题类型都是行政防护措施义务的一部分。合理的行政防护措施还包括对选择服务提供商的方式进行评估，这些提供商可能存储数据、提供软件或通过其他访问企业的计算机网络。\n\
  \n## 技术防护措施\n\n技术防护措施包括计算机系统、数据最小化步骤、审计控制、网络隔离、防火墙、防病毒保护、软件补丁安装以及公司为跟上数据安全义务而采取的类似步骤。技术防护必须关注存储、传输和处理每个步骤中的数据。在每一个可行替代方案的阶段，加密都是至关重要的。\n\
  \n技术和物理防护措施共同为存储在丢失或被盗风险更高的移动设备上的数据提供了策略。加密是第一步。此外，公司应该拥有追踪设备、远程删除数据以及审计在此过程中数据披露情况的系统。\n\
  \n`SHIELD Act` 下的防护义务与 `HIPAA` 或 `GLBA` 相当，但根据数据的性质和组织规模进行了适当缩放。`SHIELD Act` 下的数据泄露通知义务与本章之前提供的示例十分典型。\n\
  \n`SHIELD Act` 具有一些有趣的新功能。例如，法律明确规定，如果数据泄露与电子邮件账户有关，则不能使用电子邮件进行通知。纽约州不希望泄露通知发送到受攻击的账户。该法律还要求\
  \ `HIPAA` 定义的受保护实体在向 `HHS` 通知任何安全事件后的五个工作日内通知纽约州总长。虽然 `SHIELD Act` 免除了 `HIPAA` 下的受保护实体遵循纽约州的防护规则，但该州仍希望参与通知并可能参与民事罚款程序。\n\
  \n此外，纽约州总长拥有执法权，但罚金比 `HIPAA` 没得多。民事罚款每次违规可能高达 5,000 美元，上限为 250,000 美元。法律没有规定的私法诉讼权，但未能达到合理的安全标准可能会触发普通法过失诉讼。\n\
  \n## D. 数据泄露事件的响应程序\n\n如果可能，应避免数据泄露。公司应认真对待预防措施并进行相应的投资，以避免严重数据泄露带来的成本和干扰。从数据泄露中恢复所需的大多数步骤应该在事件发生之前就已采取。`FTC`\
  \ 提供了这样的建议：“比数据泄露更糟糕的事情是多次数据泄露。采取措施防止其再次发生。”如果公司想在数据泄露后维持运营，它必须非常认真地对待其响应泄露的义务。\n\
  \n在发现数据泄露后，公司将需要与管理层合作以保持高级领导的知情，与外部法医专家合作评估泄露范围并协助修复，与执法部门、律师协助通知以及与监管机构的沟通，公司的人力资源部门协助培训并处理任何员工信息的被盗问题，以及其他部门或外部顾问。\n\
  \n### 1. 预计潜在成本\n\n当公司遭受数据泄露时，公司会面临一系列财务后果。取决于公司类型和泄露规模，某些泄露可以在不产生太大业务扰动的情况下处理，而另一些泄露可能会导致公司破产并关闭业务。这些是与泄露相关的主要成本：\n\
  \n*   **调查成本**。数据泄露的受害者必须识别泄露源并纠正任何安全问题。通常聘请法医专家和数据泄露专家来帮助评估当前安全系统的失效情况。利用一家未参与构建被成功破解的系统的公司通常是一个好主意。\n\
  *   **通知成本**。由于美国 54 个司法管辖区都有自己的法律，非美国客户可能也需要通知，因此管理复杂通知义务的成本非常高。这通常通过与律所和传播公司签订合同来实现，由他们共同努力满足每个司法管辖区的法律义务。\n\
  *   **业务中断**。取决于安全事件的性质，泄露可能会严重干扰公司的运营。例如，一种破坏公司客户、委托人或患者数据的勒索软件攻击可能会导致公司关闭几天、几周或更长时间。曾有医院和其他企业再也没有开业过，因为数据丢失导致公司无法运营，且恢复数据的成本太高而无法承受。\n\
  *   **客户流失**。对于某些零售商而言，重大数据泄露的影响可能导致客户拒绝与公司做生意。大型零售企业最容易因重大安全事件而失去市场份额。通常，这只会持续几个月，但收入的损失可能是巨大的。\n\
  *   **安全加固**。外部黑客和犯罪组织经常测试发生过安全事件的公司。数据泄露的新闻可能在公司充分实施纠正措施之前就公开，为进行第二次泄露提供了路线图。即使该漏洞得到修复，泄露也标记了该公司曾处于风险之中，并营造了鼓励攻击的氛围。遭受数据泄露的公司通常需要投资升级其大部分安全运营，而不仅仅是遭受泄露的某一个领域。\n\
  *   **对股价的影响**。对于上市公司而言，围绕重大数据泄露的负面新闻可能导致投资者出售股票。投资者担心潜在的客户流失、罚款以及公司领导层需要专注于安全事件所造成的干扰。\n\
  \n\n\n\n\n*   **信用监控。** 发生数据泄露的公司为泄露受害者提供信用监控已成为惯例。与数据泄露的受害者就泄露造成的潜在损害进行法律斗争，这种策略的成本要低得多。\n\
  *   **直接诉讼和实际损害的责任。** 发生数据泄露导致身份盗用并产生实际损害的公司，可能会被泄露的受害者起诉，以追回损害成本。这些诉讼将指控过失、违约、违反州法律或其他类似的指控。如果存在实际损害，遭受泄露的公司可能会选择和解诉讼。如果诉讼进入法庭，能够证明实际伤害的原告在赢得诉讼方面处于非常有利的。即使公司赢了诉讼，仍会有巨额的律师费和专家证人费用。\n\
  *   **监管罚款。** `FTC`、`HHS`、`CFPB`或其他联邦监管机构有权对安全违规行为进行罚款，且这些罚款正在大幅增加。此外，许多大型案件涉及联邦监管机构与一个或多个州总检察的合作，后者也有权征收罚款。\n\
  *   **受害者的集体诉讼。** 许多大型数据泄露会触发集体诉讼。一家律师事务所将领导由大多数数据泄露受害者组成的集体。集体诉讼的辩护成本非常昂贵。律师可以寻求禁令和其他形式的救济，这仍使他们能够赢得诉讼并寻求追回律师费。\n\
  *   **股东派生诉讼。** 在公共股票交易所交易的公司向其股东和公众提供有关股票的重大信息，包括有关公司数据隐私和数据安全的信息。数据泄露表明公司在安全方面的陈述不准确，这意味着其在证券文件中提供的信息也可能具有实质性的误导性。与集体诉讼一样，这些行动在诉讼和辩护成本上也非常昂贵，即使公司最终赢得了诉讼。\n\
  \n并不是每家公司都会遇到这些成本中的每一个。不同的事件具有不同的后果。笔记本电脑上 217 客户数据的丢失，与公司网络被入侵或开始勒索软件攻击的证据将触发不同的响应。每种类型的安全事件都需要适当的响应。事件造成的损害范围将决定公司是在调查进行期间可以继续运营，还是被迫在调查期间临时关闭。\n\
  \n当公司采取必要措施应对数据泄露时，高级管理层必须考虑泄露将如何影响公司。早期投资信用监控和增强安全可能有助于避免诉讼成本和客户流失。安全事件响应的目标是管理每种潜在成本并减轻泄露造成的损害，而不仅仅是向受影响的客户发送一份简单的通知。\n\
  \n## 2. 保护数据和证据\n\n许多数据泄露的发现始于一个揭示了更大问题的小信息。IT 工作人员注意到某个软件的问题或一个无法解释的日志条目。从那里开始，调查揭示了其他问题，直到内部团队开始理解问题已经严重到足以表明发生了泄露。\n\
  \n一旦这一过程开始，确保泄露证据免受篡改或删删除，并确保系统其他方面的安全是至关重要的。以物理、技术和管理框架为指导指南，公司必须确保其物理安全措施到位，并在需要时进行更新。公司可能需要额外制作一套备份以保留取证证据，并可能需要保留一组通常会被覆盖的较旧备份。\n\
  \n218 \n\n在某些情况下，公司可能需要要求其员工更新密码或临时减少系统访问。当外部取证团队开始与内部员工协商时，它可以为追踪泄露所需的证据以及维护当前系统提供一份安全路线图。这可能需要更换所有用户凭据并使用新设备，以防止入侵者重新建立存在感。\n\
  \n## 3. 联系法律专家和执法部门\n\n专门负责数据泄露通知的法律团队开发了高度专业化的实践，使他们能够应对 54 个司法管辖区法律的许多变化。遭受数据泄露受害的公司通常与具有数据泄露经验的团队合作，比依赖其公司法律顾问要好。\n\
  \n经验法律团队将帮助公司识别并咨询合适的执法机构。根据事件的性质，律师可能会联系`FBI`，也可能咨询州执法官员。当地警察局并未准备好应对大多数数据泄露事件，但州和较大的城市已经创建了专门处理此类情况的特队。涉及正确的执法部门对于推进解决数据泄露事件至关重要。在某些情况下，`美国秘密勤局`和`美国邮政检查局`也可能参与其中。\n\
  \n如果涉及健康信息，则根据`HIPAA`数据泄露通知规则将承担额外的义务，该规则要求公司通知健康与人类服务部。\n\n219 \n\n## 4. 执行沟通计划\n\
  \n除了法律专家的协助外，公司可能希望聘请专门从事灾难恢复的媒体和沟通顾问。至少，沟通必须涵盖每个权获得数据泄露通知的个人，以及任何法律或法规涵盖的监管机构。这意味着公司和法律团队必须评估泄露范围，以确定美国\
  \ 54 个司法管辖区以及国际客户中哪些人的信息已被泄露或可能被泄露。\n\n法律团队将为个人客户和监管机构准备沟通内容，但对于较大的泄露，这些信息也将成为公开信息。媒体顾问将帮助通过媒体管理新闻关系和公开披露。对于上市公司，可能还需要向证券监管机构和股东进行沟通。\n\
  \n对于规模更大或范围更广的泄露，沟通计划必须包括对公司员工的内部沟通。员工信息通常在大规模数据泄露中被捕，因此员工会想知道是否发生了这种情况，以及雇主正在采取哪些措施保护员工免受财务或其他损害。对于使用大量独立承包商劳动力的公司，沟通还必须涵盖这些兼职和半自主的员工。\n\
  \n根据泄露的性质和规模，公司可能还需要联系其供应商和供应源。如果泄露涉及由供应商或顾问引起的漏洞，则尤其如此。取证专家可能会建议由于事件对 220 公司与其供应商之间的运营进行临时或永久性的变更。供应商需要尽早获知这些变更，以尽可能地减少对公司运营的影响。\n\
  \n\n\n\n在所有沟通中，确保信息的真实准确且不具误导性至关重要。如果调查刚刚开始，公司应避免做出试图将损害降至最低的泛化承诺。联邦贸易委员会（FTC）还指出，公司不应“隐瞒可能帮助消费者保护自己及其信息的关键细节”。同时，FTC\
  \ 指出，响应事件的公司不应“公开共享可能让消费者面临进一步风险的信息”。换句话说，公开声明不应强调被抄袭的攻击者可能利用的特定攻击向量。\n\n沟通计划涉及双向沟通。该计划应该预判到客户、员工、监管机构、供应商和普通公众都会提问。公司应尽可能地预见到这些问题，并确保为这些类利益相关者中的每一类提供联系方式，以便有足够的信息来处理此类情况。早期沟通也非常有帮助，解释信息将随着了解情况的增加而不断更新是合理的。\n\
  \n虽然沟通计划应当坦诚，但它也必须尊重执法部门的需求。沟通顾问和公司应与执法部门紧密合作，以确保向公众提供信息是按照有利于执法工作的进度表进行的，并且不披露会损害警方调查的信息。\n\
  \n沟通计划应解释公司计划采取的后续步骤，以尽量减少遭受数据泄露的消费者遭受额外侵害的风险。对于 `221example`，公司可能没有致电受害者的计划。给受害者的信和公开披露应说明，所有沟通将通过邮件进行，这样诈骗者无法将数据泄露作为电话诈骗的基础。沟通还应提醒公众，公司绝不会询问社会安全号码或信用卡信息。\n\
  \n沟通计划还可以考虑向公众提供来自 FTC 和其他政府机构的信息。FTC 维护的 `identitytheft.gov` 是数据泄露受害者成员的极佳资源。它提供了一系列关于如何报告身份盗窃、如何与当地警察合作、如何从信用卡中移除未经授权的费用，甚至如何处理债务收集问题的步骤。\n\
  \n# 5. 建立强化的数据安全程序\n\n正如 FTC 所指出的，公司针对安全事件能做的最糟糕的事情就是让其再次发生。一旦漏洞变得众所周知，其他攻击者将尝试相同的利用方式。遭受过数据盗窃事件的公司更有可能成为黑客的目标，仅仅因为媒体的关注增加了犯罪分子的意识。其他黑客可能想给那些数据实践不安全的公司一个教训。而且黑客知道，许多公司并不擅长从错误中吸取教训。\n\
  \n遭受数据泄露的公司在披露泄露之前必须保护其系统免受该攻击向量的侵害。这是公司在公开披露之前获得行动时间的关键原因之一。此外，公司必须引入足够的短期修复，以保护系统免受原始攻击者和模仿者的侵害。\n\
  \n# 222\n\n取证调查在评估系统时，应该回答两个不同的问题。调查必须首先回答关于谁攻击了公司以及如何实现攻击的问题。其次，取证调查应为加强公司防御未来攻击提供路线图。取证专家应帮助公司识别其物理、技术和管理保护措施中的漏洞，并通过改进这些漏洞来减少后续攻击的风险。\n\
  \n已公开披露数据泄露的公司未来可能会受到更激进的针对。因此，这些公司需要计划与运营和规模相似但未曾作为公开披露数据泄露受害的公司投入更多资金。对于没有发生过任何事件的公司来说可能是合理的数据安全计划，对于遭受此类泄露的公司来说可能是不够的。\n\
  \n# E. SEC 披露要求\n\n随着对网络安全的关注增加，美国证券交易委员会（SEC）也日益活跃地处理金融机构以及“发行人”的网络安全问题，发行人是指在公开市场发行证券并在国家级证券交易所交易股票的上市公司。鉴于数据安全风险的重要性，SEC\
  \ 了一了一项指南，指出“上市公司采取所有必要行动，及时向投资者通报重大性网络安全风险和事件至关重要，包括那些面临重大性网络安全风险但可能尚未成为网络攻击目标的公司。”\n\
  \n根据 SEC 的规定，公司必须采取适当的安全程序，发布充分的隐私政策，并向公众告知其网络安全的重大风险。尽管 `223Congress` 未直接针对上市公司通过与网络安全直接相关的新法律，但\
  \ SEC 要求此类公司在履行《证券法》和《证券交易法》规定的披露要求时，“考虑其与网络安全相关的披露的充分性”。\n\nSEC 还警告说，对于已知重大性网络安全事件或风险、且在拥有这些重大非公开信息的情况下交易其证券的公司内部人员，存在交易风险。如果公司高管知道公司正配合执法部门处理近期发现的但非公开的网络安全事件，该高管不能交易其私有的股票，否则将面临违反内幕交易法的风险。\n\
  \n网络安全风险或事件的重大性取决于其性质、程度和潜在影响，特别是其与任何受损信息或公司业务及运营范围的关系。网络安全风险和事件的重大性还取决于此类事件可能造成的损害范围。这包括对公司声誉、财务表现以及客户和供应商关系的损害，以及发生诉讼或监管调查或行动的可能性，包括州和联邦政府当局以及非美国监管机构的监管行动。\
  \ . . .\n\n我们预计公司披露对投资者具有重大性的网络安全风险和事件，包括随之而来的财务、法律或声誉后果。当公司意识到可能对其投资者具有重大性的网络安全事件或风险时，我们预计其在证券发行和\
  \ `224sale` 之前及时且充分地进行适当披露，并采取措施防止董事和高级官（以及知晓这些事项的其他公司内部人员）在投资者获得有关事件或风险的充分告知之前交易其证券。\n\
  \n除了披露重大风险的义务，上市公司还有有纠正已披露信息的义务以确保其准确性。如果后来发现早期的披露不准确，则有更新披露的义务。例如，如果上市公司错误地陈述了数据泄露的规模，那么\
  \ SEC 的披露义务强制公司更新并更正其之前发布的信息。\n\n\n\n\n美国证券交易委员会（SEC）为上市公司提供了以下考虑事项，用于考虑网络安全披露的适当范围和时机。SEC\
  \ 还提醒公司，为了给这些风险因素提供背景，公司可能需要描述先前的事件，以便潜在投资者了解这些风险的背景。考虑因素包括：\n\n*   发生过的网络安全事件，包括其严重程度和频率；\n\
  * 网络安全事件发生的概率和潜在影响规模；\n* 为降低网络安全风险而采取的预防措施的充分性以及相关成本，包括在适当讨论公司防止或缓解某些网络安全风险的能力限制；\n\
  * 产生重大网络安全风险的公司业务和运营方面，以及此类风险的潜在成本和后果，包括行业特定风险以及第三方供应商和服务提供商风险；\n*   维护网络安全防护的成本，包括适用时与网络安全事件相关的保险覆盖或向服务提供者的付费；\n\
  *   声誉受损的可能性；\n* 现有或待决的法律法规可能影响公司须遵守的网络安全要求以及给公司带来的成本；以及\n*   与网络安全事件相关的诉讼、监管调查和修复成本。\n\
  \nSEC 识别的风险因素比安全事件受害者所需的披露类型更广泛、更通用。SEC 的关注点超出了特定泄露事件的信息，而是涵盖了由于网络安全计划不力可能危及上市公司稳定性和长存性的更一般的威胁。\n\
  \n与州披露法一样，SEC 的根本目标很可能是推动公司在事件发生之前投资网络安全，并提醒企业高管，网络安全泄露的后果可能包括内部交易审查以及对组织的其他严重后果。SEC\
  \ 对网络安全的关注有助于激励企业高管投资于对良好的网络安全卫生至关重要的物理和技术防护，并投入精力和精力进行管理防护，以使网络安全成为每家上市公司的首要任务。\n\
  \n尽管 SEC 没有使用“管理防护”这一术语，但它强调了其重要性。SEC 强调，“公司必须包含关于董事会如何管理其风险监督职能的描述。”随后它将网络安全监督纳入这一标准。“在网络安全风险对公司业务具有重大性的范围内，我们认为此类讨论应包括董事会在监督管理该风险方面的角色性质。”\
  \ SEC 特别提到包含公司网络安全风险管理计划披露的重要性，并指出“董事会在网络安全问题上与管理层的互动，使投资者能够评估董事会如何在这一日益重要的领域履行其风险监督责任。”\n\
  \n网络安全卫生的持续披露要求使上市公司必须聘请法律顾问、法医专家和沟通顾问，以进行持续的合合规，正如非上市公司公司在发生重大泄露时所做的那样。对于上市公司而言，其网络安全报告义务已成为季度事项，即使在没有发生特定事件的情况下也是如此。\n\
  \n### 本章要点\n\n每个州通过的数据泄露通知法都有许多共同组成，但每部法律都有自己的合规义务。目前没有一刀切的方案，因为每个州都有自己的格式和专业语言。\n\
  \n所有州都要求公司具备稳健的网络安全防护，并能够解释任何网络安全事件的性质。根据数据泄露的大小，遭受事件的公司需要能够迅速与执法部门、法医专家、传播专家和法律顾问咨询，以满足有关公司响应的法定义务。\n\
  \n如果丢失或被盗取的信息是加密形式，各州不要求进行数据泄露通知。某些州将不可读和不可用的数据与加密数据同等对待。许多州除非数据泄露可能导致损害，否则不需要通知，但至少有十个州没有设定重大损害阈值。一旦有关数据泄露的信息向部分消费者公开，公众就会获知事件。\n\
  \n如果泄露涉及社会安全号码等敏感信息，许多州将要求公司提供信用监控作为对事件的响应。公司通常即使在没有要求的州也会提供这项服务，以降低因数据外露导致消费者提起昂贵诉讼而产生实际经济损害的风险。\n\
  \n## 需知\n\n每家公司在事件发生之前都应该有一套网络安全数据泄露计划。公司在危机发生前应识别出其律师团队、法医专家和沟通顾问。\n\n数据泄露披露所需的信息为每家公司必须处理的网络安全义务提供了实用的提醒。大多数数据泄露通知法旨在鼓励公司在网络安全方面更加积极，以阻止数据泄露，而不是在事件发生后对其进行记录。\n\
  \n公司在减少泄露风险和减轻任何事件影响方面做得越多，报告就越容易，修复成本也越低。\n\n## 思考题\n\n美国没有通用的数据保护要求或隐私要求，但每个司法管辖区都能够颁布数据泄露通知法。通知法中的哪些特点使得它比实际的隐私或网络安全立法更容易制定？\n\
  \n如果有更强大的隐私和网络安全法，数据泄露通知法还会那么重要吗？\n\n单一的国家级数据泄露通知法是否比 5 部州法律的拼凑更好？国家级数据泄露通知法与各州法律有何不同？\n\
  \n![clocky\\_bw\\_CHAP.tif](img/Image_10.jpg)\n\n# 第 8 章\n## 部门隐私：儿童在线隐私\n\n美国没有涵盖所有业务的单一隐私或网络安全政策。即使是范围最大的州法通常也会区分营利性业务组织、非营利公司和政府机构。美国许多强大的数据隐私和数据安全法是联邦法律和法规，侧重于特定的行业部门或群体。虽然有针对学生记录、驾照和其他信息狭窄用途的法律，但这些法规的范围并不大。\n\
  \n隐私和网络安全监管获得两党政治支持最大的领域是儿童隐私领域。《儿童在线隐私保护法》（COPPA）已通过会通过，并通过会与联邦贸易委员会（FTC）的协作进行了更新。本章总结并探讨了\
  \ COPPA 及其在为儿童和其他消费者提供隐私保护的作用。\n\n### A. 引言与起源\n\n\n\n\n\n在 20 世纪 90 年代后期，刚刚商业化的互联网增长速度超过了几乎所有人的预测。当时几乎没有监管，互联网经常被描述为“法外之野”或一个没有法律的空间。1998\
  \ 年，一项 `FTC` 调查发现，85%的网站都在收集访问客的个人信息，而其中绝大多数网站的隐私政策并不完善。`FTC` 对在线隐私以及利用个人信息进行欺诈和滥用收集到的信息表示了担忧。`FTC`\
  \ 委员们指出：“委员会始终坚持这样一个主张，即行业自律……比详细的立法指令更佳。然而，正如所承诺的，这种自律却非常令人失望。”\n\n尽管 `FTC` 的立场发生了变化，但对于通用的数据隐私和数据安全监管，两党都缺乏足够的意愿。然而，对于隐私担忧以及针对\
  \ 12 岁及以下儿童的未经授权营销，双方有着更广泛的共识。特别是 `FTC` 注意到，即使在提供儿童内容、商品和服务的网站中，也极少数网站采取了针对儿童的隐私措施。在\
  \ `FTC` 听证会后不久，白宫通过了一项类似的指令，要求对医疗保健信息实施更严格的监管，并保护儿童的在线隐私。\n\n国会通过通过《1998 年儿童在线隐私保护法》（`COPPA`）来回应这些担忧。`COPPA`\
  \ 的立法历史概述了其核心目标：\n\n(1) 增强父母对儿童在线活动的参与度，以保护儿童的隐私；\n(2) 保护儿童在公共聊天室和留言板上访问和发布信息时的安全；\n\
  (3) 维护在线收集的儿童个人信息的安全性；以及\n(4) 限制在没有父母同意的情况下收集儿童个人信息。\n\n国会意识到在线隐私的运营方面正在迅速演变。国会并没有通过一项具有严苛要求且很快过时的法律，而是将创建和维护监管条例的职责交给了\
  \ `FTC`。这也是国会首次承认 `FTC` 已成为美国事实上的隐私监管机构的明确行为，该法律的通过为 `FTC` 提供了其在更广泛范围内执行隐私权利所需的法理权威。\n\
  \n`COPPA` 通过罚款和民事处罚，扩展了 `FTC` 禁止不公平和欺骗性行为或做法的广泛权限。通过使用不公平和欺骗性贸易行为框架，国会还能够授权授予州总检察长以执行\
  \ `COPPA`。总检察长选择采取执法行动，只需向 `FTC` 提供书面通知，`COPPA Rule` 就提供了根据法律继续推进的授权。总检察长也可以依靠其州的不公平和欺骗性贸易行为法采取州行动。\n\
  \n国会确实提供了具体要求，赋予父母或监护人控制其儿童在互联网上个人信息的权利。这包括一项通用要求：面向儿童的网站和在线服务在收集、使用或披露儿童个人信息之前，必须获得可验证的父母同意。\n\
  \n`COPPA Rule` 由 `FTC` 于次年颁布，于 2000 年 4 月 21 日生效。随着社交媒体、物联网（`IoT`）和移动设备的增长，`FTC`\
  \ 发现 `COPPA` 的某些方面已经过时，因此委员会在 2013 年更新了 `COPPA Rule`。在 2013 年 `COPPA Rule` 的扩展中，`FTC`\
  \ 扩大了儿童个人信息的定义，增加了在线 cookie、地理位置标签以及视听内容（包括视频和共享照片）中的信息。\n\n尽管 `COPPA` 的设定目标是让父母对从\
  \ 13 岁以下儿童收集的信息有更多控制，但 `COPPA Rule` 的结构旨在抑制从这些儿童那里收集个人信息。减少儿童收集的信息量是国会在立法历史中提出的四个目标之一。`COPPA`\
  \ 的第二个目标是要求收集儿童信息的公司改进隐私通知，包括大量的通用型网站，这些网站的运营者知道他们除了收集访问网站的青少年和成人的信息外还在收集儿童的信息。\n\
  \n## B. COPPA 要求\n\n`COPPA` 为收集儿童个人信息的运营商或在线网站规定了义务。这些条款中的每一项在 `COPPA Rule` 下都有特定的含义，共同定义了\
  \ `COPPA` 监管的范围。\n\n### 1. COPPA 覆盖范围——收集儿童个人信息的运营商\n\n**运营商。** `COPPA Rule` 适用于商业网站、移动应用程序和设备、互联网连接玩具以及面向\
  \ 13 岁以下儿童的在线服务的运营商，这些实体收集、使用或披露儿童的个人信息。它也适用于面向普通观众的网站、应用程序和设备，如果这些网站的运营者在实际知晓的情况下正在收集、使用或披露\
  \ 13 岁以下儿童的个人信息。运行广告网络或插件的公司如果其运营者实际知晓该网站或服务收集了针对 13 岁以下用户的个人信息，也受该规则的约束。\n\n除了针对面向儿童内容的网站运营商采取行动外，`FTC`\
  \ 还对更通用的网站运营商采取了行动，包括 `Google` 和 `YouTube`（因针对 13 岁以下儿童的广告和媒体渠道），以及针对玩具制造商 `VTech\
  \ Electronics`（因通过其互联网连接玩具系列收集儿童数据）。在一次网络安全漏洞泄露了 `VTech` 一直收集的大量个人信息后，`VTech` 的数据收集做法被公开。\n\
  \n`COPPA Rule` 的设计是不考虑特定技术而涵盖连接设备和平台。虽然最初关注在线商业网站，但 `COPPA Rule` 现在涵盖了网站、手机和平板电脑等移动设备以及运行在上面的各种软件、应用程序和小部件、通过物联网协议、网络协议服务连接的联网玩具和其他设备，以及任何允许机器或设备收集个人信息并将其共享给收集、销售或处理该信息的运营商或公司的其他玩具、工具或技术。然而，它并不延伸到笔和纸张。\n\
  \n**收集。** `COPPA Rule` 对信息的“收集”也使用了宽泛的定义。与消费者、客户或患者可以选择自行披露其个人信息的政策不同，`COPPA` 的编写假设消费者是\
  \ 13 岁以下的儿童，且必须由儿童的父母同意收集信息。因此，从网站用户那里“自愿”收集信息的网站并未履行其获得父母同意的义务。`COPPA Rule` 通过以下对“收集”的定义解决了这一担忧：\n\
  \n\n\n\n“收集”或“收集行为”是指通过任何手段从儿童处获取任何个人信息，包括但不限于：(1) 请求、提示或鼓励儿童在网上提交个人信息；(2) 允许儿童以可识别的形式将个人信息公开。如果运营者在儿童的帖子公开之前，采取了合理措施删除其帖子中的全部或几乎所有的个人信息，并从其记录中删除此类信息，则不被认为根据本条款收集了个人信息；或(3)\
  \ 在线对儿童进行被动追踪。\n\n根据此定义，即使所请求的信息完全是自愿提供的，且服务是以非歧视的方式运行的（即无论是否有儿童提供的信息，服务都能运行），收集信息的提示也会触发该规则。\n\
  \n根据 `collect` 定义中的第二个条款，社交媒体网站应有责任配备软件或人员，删除儿童在其社交媒体账户上发布的任何个人信息。某些儿童软件通过允许社交媒体软件从预写的词汇和句子菜单中选择，而不是允许儿童发布自己的文本和图像，从而解决了这一挑战。\n\
  \n### 个人信息\n随着 2013 年`COPPA Rule`的扩展，该法规现在对个人信息使用了非常广泛的定义：\n\n(1) 姓和名；\n(2) 家庭地址或其他物理地址，包括街道名称和城市或城镇名称；\n\
  (3) 在线联系信息，指电子邮件地址或任何实质上类似的、允许在线与人员建立直接联系的标识符，包括但不限于即时消息用户标识符、越网络协议 (`VOIP`) 标识符或视频聊天用户标识符；\n\
  (4) 具有与本节定义的在线联系信息相同功能的屏幕名称或用户名；\n(5) 电话号码；\n(6) 社会安全号码；\n(7) 一种可以跨时间、跨不同网站或在线服务识别用户的持续标识符。此类持续标识符包括但不限于存储在\
  \ `cookie` 中的客户编号、互联网协议 (`IP`) 地址、处理器或设备序列号，或唯一设备标识符；\n(8) 照片、视频或音频文件，其中此类文件包含儿童的图像或声音；\n\
  (9) 足以识别街道名称和城市或城镇名称的地理位置信息；或\n(10) 运营者在线从儿童处收集的关于该儿童或父母的信息，并与本定义中描述的标识符相结合的信息。\n\
  \n个人信息定义的语言旨在既具有广泛性又前瞻性，因此该定义无法被新技术规避。\n\n### 2. COPPA Rule 义务\n`COPPA Rule` 对网站和在线服务的商业运营者有特定的义务。未能履行其中任何一项义务都是违法的，运营者可能因未能履行这些义务而面临罚款或民事处罚。这些义务中的某些项（例如采取适当安全措施的义务）适用范围非常广泛，而关于父母批准的义务则专门针对受\
  \ COPPA 保护的儿童。\n\nFTC 用这一职责大纲总结了法律规定。根据 `COPPA Rule`，运营者必须：\n\n*   发布清晰且全面的在线隐私政策，说明他们对从儿童处在线收集的个人信息的处理做法；\n\
  *   在从儿童处在线收集个人信息之前，向父母提供直接通知并获得可验证的父母同意（有有限的例外情况）；\n*   让父母有权同意运营者收集和内部使用儿童的信息，但禁止运营者向第三方披露该信息（除非披露是网站或服务的不可或缺的一部分，在这种情况下，必须向父母明确说明）；\n\
  *   允许父母访问其儿童的个人信息，以便进行审查和/或删除信息；\n*   给予父母机会防止进一步使用或在线收集儿童的个人信息；\n*   维护从儿童处收集的信息的机密性、安全完整性，包括采取合理步骤仅将此类信息发布给能够维护其机密性和安全的方；以及\n\
  *   对于从儿童处在线收集的个人信息，其保留时间仅限于实现收集目的所需的时间，并使用合理措施删除这些信息，以防止其被未经授权的访问或使用。\n\n这些义务中的许多与其他数据隐私法规中的政策相似。这些包括：有义务就所收集的个人信息类型提供准确通知，并对个人信息如何使用提供准确的描述；审查所收集信息的能力；以及删除不准确信息的能力。这些做法已成为\
  \ `CCPA` 和 `GDPR` 法律的一部分。维护所收集信息的机密性、安全完整性的义务是许多隐私法的一部分，并被视为在州法律和联邦不公平和欺骗性交易行为法下，对任何收集个人信息的企业所施加义务的隐含部分。\n\
  \nCOPPA 的独特之处在于，在从儿童处在线收集个人信息之前，向父母提供直接通知并获得可验证的父母同意的义务。父母审查、停止进一步收集和删除收集信息的额外权利并非\
  \ COPPA 特有，但 COPPA 仍然代表了要求此类数据管理的最广泛的义务。\n\n### 3. 可验证的父母同意\n确保 13 岁以下儿童的父母收到网站隐私政策通知，并且是由父母同意儿童访问，这一义务是\
  \ `COPPA Rule` 的关键要素之一，也是其实施面临的巨大挑战之一。`COPPA Rule` 要求父母对未成年人个人信息的收集采取选择性加入（opt-in）同意。尽管使用了选择性加入模型，`COPPA\
  \ Rule` 的起草具有一定的灵活性，仅要求运营者“考虑到可用技术”以履行其义务。\n\n为了使父母同意变得更加困难，`COPPA Rule` 要求在为儿童收集任何信息之前必须获得同意。对于在从儿童处收集信息之前先收集信息的有有限例外，通常侧重于从儿童处收集足够的信息以便联系父母并请求同意。\n\
  \n可验证的父母同意的挑战使得这些条款在法律首次通过时很大程度上是愿景性的。在 2013 年对 `COPPA Rule` 的修订中，这些条款得到了显著更新，使其更具实用性和可执行性。\n\
  \nFTC 列出了若干种接受的父母验证方法：\n\n*   提供一份由父母签署的同意表，并通过美国邮政、传真或电子扫描传回（“打印并发送”方法）；\n*   要求父母在进行货币交易时，使用信用卡、借记卡或其他能向主账户持有人提供每笔离散交易通知的在线支付系统；\n\
  *   让父母拨打由经过培训的人员执勤免费电话，或让父母通过视频会议与经过培训的人员连接；或\n\n\n\n\n*   通过将政府颁发的身份证明与此类信息的数据库进行比对来验证父母的身份，前提是在完成验证后及时删除父母的身份证明。\n\
  \n按照最初的设计理念，信用卡要求通常被认为是最实用、最可靠的方法。人们认为十三岁以下的未成年人不会有自己的信用卡。当时的想法是，通过收取信用卡费用，可以确保成年人参与了交易。这种验证形式存在一些显而易见的局限性。首先，从未明确过信用卡持有者是父母而非年长的兄胞或其他人员。其次，存在许多儿童在未经父母同意的情况下使用父母信用卡的实例。第三，许多使用这种方法的商家希望避免产生实际的财务交易，或迅速撤销交易，从而降低了成年人对未经授权的财务交易表示反对的可能性。尽管如此，信用卡为十三岁以下的儿童注册网站提供了实用的障碍，因此它继续被用作虽有缺陷但合理的验证方法。\n\
  \n一种高科技方法在 2015 年获得了 FTC 的批准，这是基于 `Riyo Verified Ltd` 的申请。该公司开发了其所谓的“面部匹配已验证照片身份证明”（`FMVPI`），用于验证为孩子使用在线服务的许可提供者确实是孩子的父母。FTC\
  \ 解释说 `FMVPI` 是一个两步骤的过程。在第一步中，父母上传照片身份证明，例如护照或驾执照。公司使用外部工具验证照片身份证明。然后，父母上传一张通过网络摄像头拍摄的照片。摄像头具有足够的实时性，以证明第二张照片不是对预存照片的拍摄。然后，公司使用人脸识别软件确认摄像头图像与已验证的照片身份证明匹配。这一过程要求父母进行非常深入的身份验证，但它显著降低了伪造父母同意的能力。FTC\
  \ 批准了这种方法作为可接受的父母验证方式。\n\n这些方法都相当复杂，需要父母投入大量活跃的参与。FTC 意识到，对于那些收集但不披露任何信息的公司来说，这些努力可能会带来过重的负担。对于不与第三方共享信息或不允许未成年人在网上发布信息的公司来说，风险较低，一种不那么严格的同意形式也是可以接受的。对于此类用途，FTC\
  \ 允许公司使用“电子邮件加+”的同意方法。父母会收到一封请求同意的电子邮件，其中包含了隐私通知中的所有信息，并包含第二步——即“加”步的额外验证。第二步可以简单到仅是另一封由父母确认同意的电子邮件，或者在第一封邮件中要求父母通过提供电话号码进行确认。\n\
  \n## 4. 安全港的条款\n\n为了帮助相关行业确保自己不是 FTC 行动的目标，并帮助 FTC 扩展一种合规文化，`COPPA 规则` 包含了 FTC 批准安全港政策或执法执行系统的能力，公司可以使用这些系统来确保自己符合规定，并确保\
  \ FTC 不会采取不利行动。\n\n安全港的条款通常由实施自身管理的贸易协会和行业团体使用。例如，`娱乐软件分级委员会`（`ESRB`）是一个由主要视频游戏公司所有并管理的组织。它负责发布视频游戏的分级指南。`ESRB`\
  \ 是其成员的一个非常激进的监管机构，有权对不遵守该协会发布的年龄指南义务的公司处以巨额罚款。它于 2001 年首次加入安全港计划，此后获得了 FTC 的批准，每隔几年更新一次其政策。\n\
  \n公司或贸易协会要满足安全港的要求，必须向 FTC 申请，并提供其拟议指南的文本、一份显示拟议指南满足所有 FTC 要求的分析，以及描述其计划如何在其成员内部执行政策以及其执法系统在其他语境下如何运作的声明。以\
  \ `ESRB` 为例，它有一本详尽的成员行为手册、一个定期审计年龄报告义务的员工团队、测试零售商是否使用年龄验证要求的“秘密购物者”，以及一个征收和收缴罚款的机制。凭借这样一套广泛的执法系统，FTC\
  \ 迅速批准让 `ESRB` 获得安全港，并作为视频游戏行业 `COPPA` 的执法机构。\n\n鉴于在安全港下担任执法代理人的重大义务，目前只有七个组织获得了安全港扩展。它们是：\n\
  \n*   `Aristotle International Inc.`\n*   `Children’s Advertising Review Unit`（`CARU`）\n\
  *   `Entertainment Software Rating Board`（`ESRB`）\n*   `iKeepSafe`\n*   `kidSAFE`\n\
  *   `Privacy Vaults Online, Inc.`（以 `PRIVO` 为名经营）\n*   `TrustArc/TRUSTe`\n\n`TrustArc`\
  \ 最初以 `TRUSTe` 的名称运营，是第一个获得 FTC 项目安全港认证的组织。它还负责提供其他隐私保护认证。`TRUSTe` 在执行隐私义务方面的声誉并不好，由于其对隐私侵权的模式似乎过于宽松而受到持续审查。最后，在\
  \ 2014 年，FTC 终于对多年增加的投诉做出了回应。虽然对 `TRUSTe` 的投诉早在 2002 年就开始了，但 FTC 的投诉指出，“从 2006 年到\
  \ 2013 年 1 月，`TRUSTe` 在超过 1000 次的情况下未能对持有 `TRUSTe` 隐私封章的公司进行年度重新认证，尽管其网站上的信息显示持有\
  \ `TRUSTe` 认证隐私封章的公司每年接受重新认证。” FTC 还指控 `TRUSTe` 滥用其非营利地位。尽管如此，尽管 FTC 处了 20 万美元的罚款，但并未撤销该公司的安全港地位。\n\
  \n另一个持有安全港认证的公司是 `Aristotle`。它运营“诚信隐私合规计划”，并为 `COPPA` 合规以及酒精、烟草和成人网站销售年龄验证服务。它为\
  \ `COPPA` 的年龄验证提供了十三种不同的技术。可能难以建立自身 `COPPA`系统的公司可以从 `Aristotle` 购买这些服务并成为其安全港计划的成员。\n\
  \n`CARU` 和 `ESRB` 都是贸易协会，将 `COPPA` 安全港条款纳入其更广泛的成员义务中。这些努力是有效的，但取决于贸易协会对其成员行为义务的重视程度。\n\
  \n### C. COPPA 实验\n\n`COPPA` 是 FTC 为创造一种新的强制性在线隐私文化所做的最大努力。该项目的成功与否尚不明。与其他宣布某些行为违法的法律一样，法律本身对消除不受欢迎的行为往往有限。从像\
  \ `TRUSTe` 这样反复违规者的历史来看，FTC 的良好意图并不一定能通过实际执法得以。\n\n\n\n\n\n# COPPA 的成功与挑战\n\n`COPPA`\
  \ 既取得了成功，也有失败。对于希望实现 `COPPA` 目标的公司和行业来说，`FTC` 提供的指南以及 `COPPA` 建立的最佳实践创建了改进消费者隐私的模式。某些行业组织（如\
  \ `ESRB`）在其自愿性组织内部制定了非常全面的规定。`ESRB` 还为视频游戏提供年龄分级，并拥有大量的运营工作来确保其成员符合该组织的所有标准。如果其成员未能遵守\
  \ `ESRB 安全港港批准` 要求的政策，`ESRB` 比 `FTC` 更有能力采取行动。\n\n与此同时，与未能遵守 `COPPA` 的公司的实际诉讼数量相比，针对未成年人内容或在明知\
  \ 13 岁以下儿童利用平台的情况下运营的网站数量极少。`Facebook`、`MySpace`、`TikTok`、`WhatsApp` 等社交媒体和通信平台在各个年龄的儿童中都非常受欢迎。许多此类公司通过要求用户提供年龄或出生日期来声称符合\
  \ `COPPA`。如果年龄小于 13 岁，则拒绝向儿童提供服务。但并没有年龄验证，因此同一个孩子可以增加报告的年龄并获得服务。例如，某服务要求高中和大学年龄段的用户提供学校名称。如果订阅者列出小学或初中，`244program`\
  \ 就会拒绝提供服务。但此人可以简单地创建一个列有高中或大学的新账户来获得服务。\n\n尽管有人批评 `COPPA` 太容易被规避，但也有批评者表示担忧，认为那些被社交媒体平台剥夺权利的未成年人实际上拥有独立于父母的言论自由，这些儿童有权在不受联邦政府监管干预的情况下使用这些服务。言论问题尚未得到解决，可能是因为未成年人可以很容易地找到方法克服\
  \ `COPPA` 实施的限制。\n\n`COPPA` 取得的最大成功是建立了一个加强隐私和安全的国家级框架。它代表了在数据安全和隐私国家方法方面迈出的的一步。它的许多功能已纳入随后的立法中。但实施中的困难也提醒了隐私倡导者和政府监管机构，隐私和安全法律的执行是困难且昂贵的。像任何首次尝试一样，它为未来继续构建道路提供了实用的指南。\n\
  \n## 本章核心要点\n\n随着 1998 年的采用，`COPPA` 成为首部全面的消费者隐私法。尽管它针对的是收集 13 岁以下未成年人信息的公司，但隐私通知和数据安全的要求有助于提高所有在线业务的这些标准。随着\
  \ 2013 年 `COPPA 规则` 的修订，个人信息的范围在数据监管中是最广泛的之一。\n\n`COPPA` 为 13 岁以下儿童的父母和监护人提供了控制同意收集有关未成年人个人信息的权利。这是一个选择性（opt-in）隐私系统，还赋予了父母和监护人查看已收集信息的权利、请求删除已收集信息的权利以及停止进一步收集信息的权利。后来在\
  \ `GDPR` 和 `CCPA` 中颁布的许多消费者保护措施最初作为 `COPPA` 的法律引入的。\n\n## 相关知识\n\n`COPPA` 的范围仍然有限。尽管\
  \ `CCPA` 将年龄保护扩大到 16 岁，但 `COPPA` 仍保持在 13 岁。`FTC` 定期发起执法行动，但执法行动的数量无法真正监管未成年人信息的收集。`COPPA`\
  \ 仍然是一项强大的监管规定，绝大多数受 `GDPR` 或 `CCPA` 约束的公司都在尝试遵守。\n\n## 思考\n\n当国会颁布 `COPPA` 时，立法历史重申了对自律而非政府监管的偏好。那些被社交媒体平台剥夺权利的未成年人实际上拥有独立于父母的言论自由，这些儿童有权在不受联邦政府监管干预的情况下使用这些服务。\n\
  \n目前的部门隐私法体系是否已经过于完善，以无法被单一的联邦法律取代？\n\n`COPPA` 的选择性（opt-in）性质是否比其他数据机制提供的退出（opt-out）系统效果更好？\n\
  \n---\n\n# 第 9 章：部门隐私：医疗隐私\n\n### A. 医患隐私\n\n从罗马法时代，患者的健康信息一直受到保密保护。随着医学技术的进步和患者权利的增加，规定的性质也在演变。医疗机构是勒索软件攻击的热点，因为这些公司非常依赖其电子记录。\n\
  \n#### 1. 总述\n\n保密义务在罗马法和英国法中延续。保密的目的是鼓励患者信任他们的医生并愿意寻求治疗。保密还促进了患者与医生之间诚实、坦诚的讨论。\n\
  \n\n\n\n\n保密性由患者控制，这意味着患者不受保密条款的限制，可以出于任何理由分享医生提供的信息，包括寻求第二医疗意见或对医生提出医疗过失指控等目的。医生确实拥有有限的权限和义务来违反保密规定。例如，某些形式的儿童虐待或配偶虐待证据必须由主治医生报告，且不能受`249confidentiality`的保护。在针对拥有特权的患者提出的医疗过失指控进行辩护时，医生也可以分享必要的医疗治疗信息。\n\
  \n要建立保密关系，医生必须正在治疗患者或至少在对患者进行咨询。如果没有建立医患关系，则不存在相关义务。这意味着在社交聚会上或通过在线网站提供的建议可能未达到医患关系的水平，但必须根据每个情况的具体事实进行单独分析。此外，披露给医生的信息必须与医疗治疗相关。如果患者提到某人的犯罪不行为，这些犯罪活动不属于治疗范围，可以被披露。例如，如果一个患者向主治医生提到，他在抢劫酒店时被一名警察殴打导致脑震荡，那么关于他曾出现在酒店的信息可以报告给警方。\n\
  \n与流行侦探剧中的表现相反，医患保密在患者死亡后依然有效。医生不能仅仅因为患者去世就分享患者的保密信息。\n\n同时，医患保密不等同于医患特权（privilege）。特权是一项法律原则，它禁止法官在刑事或民事案件中（无论是在法庭上还是通过授权或传票）要求作证。保密性会防止医生向媒体、家庭成员披露保密信息或传播八卦，但只有法律特权才能阻止医生在法庭程序中被强制披露此类信息。\n\
  \n联邦法律并未专门承认医患特权，因此在联邦刑事和民事案件中，法院更有可能要求披露信息。但尽管没有`250is` 明确的联邦特权，但通常上倾向于不利于证词特权的《联邦证据规则》也承认了承认医患关系的普通法传统。结果是，该规则在联邦法院中的应用非常不一致，且高度取决于具体事实。\n\
  \n大多数州已通过法律规定了特权问题。州法律通常承认该特权，但如果需要建立医生证词的一方能够在法院面前证明其必要性，则该特权可以被克服的程度差异很大。例如，某些州可能规定民事案件中存在医患特权但在刑事案件中不规定。其他州将在所有案件中延伸该特权，但赋予法官某些裁量权，根据事实情况确定是否需要放弃该特权。\n\
  \n## 2. 保密性的例外——警告义务\n\n对于高度传染性疾病和流行病爆发，医患保密存在例外。在这些情况下，可能会有州或联邦的强制性报告要求，以降低公共健康风险并防止更大规模的爆发。报告义务必须由法律法规规定，在没有法律义务的情况下，医生必须尊重患者的保密性。\n\
  \n在`Tarasoff v. Regents of University of California (1976)` 一案中，加州最高法院认为，治疗危险患者的心理学家有义务警告预期的受害者其暴力行为。法院解释说，患者的保密权次于伤害风险。法院规定，一旦“患者对他人构成严重的暴力危险，`[医生]`就承担了采取合理谨慎`251to`\
  \ 保护预期受害者免受此类危险的义务”。这项加州的判决显著改变了人们对医患保密性的态度，并在许多州得到了遵循。\n\n随着基因检测和医疗治疗的不断进步，各州和医疗机构正在努力制定规则，关于告知遗传性医疗疾病检测呈阳性的患者家属情况的义务。在某些法律裁决中，法院认为医生通过告知患者检测结果并解释其他家庭成员患有相同遗传疾病的可能性已履行了义务。然而，在其他州，法院要求获知遗传性疾病的医生告知可能携带相同疾病的家庭成员。\n\
  \n基因检测警告在结构上与某些州或城市采用的 HIV 伴侣检测法律相似（这些地区也采纳了此类法律）。在这些司法管辖区，HIV 呈阳性的人有法律义务告知性伴侣传播风险。其中一些管辖区还规定医生有义务向伴侣提供此类信息。`Ryan\
  \ White HIV/AIDS Program`是一项为低收入人群提供基础医疗服务的联邦资助计划，它包含了对 HIV/AIDS 患者已婚配偶进行通知的强制性披露部分。\n\
  \n在性传播疾病、遗传性疾病和流行病等领域，保密的公共政策通常让位于公共披露的需求以及对可能受扩散影响的人的保护需求之后。\n\n`252`\n\n## B.\
  \ 1996 年医疗保险可携带性与责任法案 (HIPAA)\n\n1996 年，作为改革医疗保健实践和降低美国医疗费用快速增长的国家级努力的一部分，国会通过了《医疗保险可携带性与责任法案\
  \ (HIPAA)》。该法案的完整标题对其目标进行了介绍：\n\n旨在修订 1986 年《国内收益税法》，以提高团体和个人市场医疗保险覆盖的可携带性和连续性，打击医疗保险和医疗服务交付中的浪费、欺诈和滥用，促进医疗储蓄账户的使用，改善长期护理服务的获取和覆盖，简化医疗保险的管理，并出于其他目的。\n\
  \n二十多年后，HIPAA 中持续影响最大的方面是该法律对保险公司之间可携带性的保护。标题中未列出的是另一项影响更大的成果——整合到行政简化法条例中的、激进的隐私和信息安全标准。\n\
  \n该法律包含五个独立的章节（或标题），其中第一部分旨在保护员工在更换雇主时保留医疗保险覆盖的权利。第二部分名为“行政简化”，旨在为电子健康记录建立标准。第三部分修订了税前医疗支出账户的规则，第四部分侧重于团体健康计划的更新，最后部分更新了公司拥有人寿保险单的规定。\n\
  \n`253`\n\nHIPAA 的第二部分关注于控制欺诈和滥用、授权行政简化规则，并强制卫生与人类服务部（HHS）根据行政简化授权创建标准。\n\n\n\n\n\
  为了实施`Administrative Simplification`，HHS 在五个重点领域制定了规则。其中两项规则——`Transactions and Code\
  \ Sets Rule`和`Unique Identifiers Rule`——关注医疗保健提供者、保险公司以及相关供应商和业务实体的支付和账单流程。其余三项规则是`Privacy\
  \ Rule`、`Security Rule`和`Enforcement Rule`。这三个规则共同改变了医疗隐私和数据安全，为政府对数据的监管设定了新的国家级标准。HHS\
  \ 民权办公室负责管理和执行`Privacy`和`Security` 规则。\n\n尽管 `HIPAA` 旨在创建一个更精简的医疗保健系统，但它遭到了业界的极大反对，联邦监管机构也难以以其预想的方式实施\
  \ `HIPAA`。特别是 `HIPAA` 对电子健康记录的强制要求在很大程度上被医院和保险公司破坏了。他们提供的电子记录是图形图像（`jpg` 和不可扫描的\
  \ `PDFs`），而不是机器可读的数据集，这使得电子记录比纸质版毫无用。作为 2009 年经济刺激法的一部分，国会通过了《经济与临床健康信息技术法案》（`HITECH\
  \ Act`），以强制提高合规性，并停止干扰 `HIPAA` 的行为。\n\n`HITECH Act` 扩展了 `HIPAA`，并关注了转向可用的电子健康记录及其电子个人健康信息（`ePHI`）的需求，这些信息将在医生、医院、保险公司、药店和其他实体之间共享。随着电子健康记录的扩展，国会意识到对数据隐私和数据安全的监管也需要强力的执行。`HITECH\
  \ Act` 扩大了数据泄露通知义务，并增加了对未能保护这些记录中个人健康信息行为的罚金额。\n\n`HIPAA` 通过 HHS 建立的规则进行实施和执行。在规则制定过程中以及近年来的修订中，对\
  \ `Privacy Rule` 和 `Security Rule` 进行的各种更改，试图在极其严格的隐私保护与实际实施之间取得平衡，既能保护患者，又不至于让医疗行业和患者感到沮扰。\n\
  \n凭借 `HIPAA` 和 `HITECH Act` 的授权，`HIPAA` 法规提供了美国最强大的隐私和数据安全法规，为任何法律体系下的安全工作设定了最高要求。需要严格数据保护的公司寻求\
  \ `HIPAA` 认证提供商，因为该认证代表了数据保护中最严苛的物理、管理和技术标准。\n\n未能履行 `HIPAA` 下的义务将导致巨额罚款并可能导致刑事定罪。HHS\
  \ 民权办公室管理对安全事件和合规性的调查，与实体合作确保其符合标准，并对违规行为进行罚款。民权办公室还可以将案件移交司法部进行刑事起诉。罚款范围从每次违规或记录\
  \ 100 美元到每次违规 5 万美元不等，每年上限为 150 万美元。执法行动在 `Enforcement Rule`中有详细说明。\n\n## 2. HIPAA\
  \ 对患者意味着什么\n\n`HIPAA` 最初是为了确保参加保险的员工在换工作时能够继续获得医疗保障。对于有严重健康问题的员工来说，由于既往疾病失去保险的风险意味着职业可能会导致毁灭性的财务后果。\n\
  \n`Administrative Simplification` 条款和电子记录协议是在在线扩张初期颁布的。政府和公众都不希望医疗行业像互联网的“西部荒野一样被管理。作为回应，HHS\
  \ 成为促进患者个人信息保护和所有权的领先政府机构。\n\n根据 `Privacy Rule`，患者有权从每个受保护实体处以隐私通知的形式接收特定信息：\n\n\
  1. 规则下患者权利的说明以及如何行使这些权利；\n2. 受保护实体的法律职责；\n3. `PHI` 要求和允许的使用及披露的说明；\n4. 个人如何向受保护实体或\
  \ HHS 部长提出投诉；\n5. 如果受保护实体需要更改，将如何提供修订通知；以及\n6. 获取额外信息的联系人。\n\n`HIPAA` 创造了一种保密文化，改变了诊所的性质。尽管医患保密在整个现代医学中一直存在，但它有时被对待得很草率。随着\
  \ `HIPAA` 的实施，诊所和医疗提供者被迫更严谨地审视他们的日常做法。那些要求患者在其他患者可见的页面上写下病情并签名的诊所发现，他们需要建立更具尊重的程序。同样，药店停止在收银台提供医疗建议，而是让患者能够在远离其他排队顾客听力的情况下咨询药剂师。\n\
  \n起初，医生和药剂师担心 `HIPAA` 隐私将要求安装隔音咨询室并对设施进行昂贵的改建，但后来允许了更为适度的调整，其目的是将寻求医疗咨询的人与附近等待服务的观察者隔离开来。许多诊所更新了存储文件的方式，使打印版不再易于获取；加强了对人员的培训以优先考虑隐私；并更关注共享医疗信息的环境。大多数诊所只需要小小的改进即可满足\
  \ `Privacy Rule` 的要求，尽管这对其他诊所来说是一个觉醒警钟。\n\n`HIPAA` 也赋予了患者权利。`HIPAA` 包含了患者获取其医疗记录副本的权利。第一次，患者能够要求获取医疗记录，这使得患者控制和指导自己的医疗治疗变得容易得多。通过\
  \ `HIPAA` 的 `HITECH Amendments` de，个人有权接收作为电子记录的 `ePHI`。他们可以请求将记录电子化直接发送给另一个提供者，并接收已披露信息的明细。此外，受保护实体必须遵循患者的要求，不披露有关自费的特定医疗项目或服务的信息。这是一项重要的补充，因为它允许个人在分享部分医疗记录的同时，不会自动泄露他们认为更加私密或私人的医疗治疗。\n\
  \n\n\n与其他隐私法一样，隐私的控制权在患者手中。患者可以自由邀请家庭成员或朋友进入诊室，特别是当患者需要协助理解或处理医生给出的医疗建议时。《隐私规则》允许医生或其他医疗保健提供者“向个体的家庭成员、其他亲属或密近个人朋友披露”与患者护理相关的医疗信息。与朋友或家庭成员共享信息的同意可以通过口头同意或通过行为同意来获得。换句话说，如果患者邀请其成年儿子或女儿参加就诊并与医生咨询，那么带孩子参加约诊的行为就提供了所需的同意。诊室不需要患者签署免责声明或同意书。如果诊室坚持患者签署免责声明（有些诊室确实是这样要求的），但不应声称这是\
  \ `HIPAA` 隐私规则的要求。\n\n### 3. 隐私规则\n\n虽然《隐私规则》禁止受该法规约束的公司向未经授权的第三方披露受保护的健康信息，但它允许患者或受保护健康信息的人获取记录副本、对这些记录进行修正，并赋予患者在受保护健康信息被用于治疗、支付或医疗运营之外的其他目的时拒绝同意传输的权利。虽然在实践中操作简单，但\
  \ `HIPAA` 法规非常复杂且详细。\n\n在 2000 年出版的《隐私规则》中，`HHS` 总结了国会对行政简化的目标以及隐私对该目标的重要性：\n\n\
  258\n\n国会要求采取步骤，通过“为某些健康信息的电子传输建立标准和要求，鼓励健康信息系统的开发，从而提高医疗保健系统的效率和有效性”。. . . 国会意识到，如果我们不保护个人健康信息的隐私和机密性，行政简化就将无法成功。.\
  \ . .\n\n法规的前言提到，尽管有许多州法律监管隐私，但州法律和法规的碎片化并未涵盖患者隐私的所有方面，且它们未能“提供此类基本保护，例如确保患者有权查看其医疗记录副本的法律权利”。《隐私规则》在大多数方面优于现有的州法律，并为患者健康信息的隐私和安全建立了单一的国立标准。\n\
  \n医疗保健隐私一直涵盖医生，但随着《隐私规则》的演变，它扩展到了更广泛的公司。`HIPAA` 使用“受保护实体”一术来识别任何受法律约束的业务。该法律将受保护实体分为三类：医疗保健提供者、医疗计划和医疗保健结算中心。此外，还有第四类，业务伙伴，他们由于与上述三类受保护实体之一存在合同关系而被纳入保护范围。\n\
  \n### 医疗保健提供者\n医疗保健提供者是个人或公司（无论营利还是非营利），提供医疗服务，包括医疗护理和治疗、医疗设备、药品或医疗用品。这些是构成医疗体系核心的医生、护士、药剂师、助理、治疗师工作人员。医疗保健提供者的规模从个人医生到大型医院和医疗系统不等。另一个\
  \ 259 受法律保护的要求是提供者要电子传输健康信息，例如用于支付或行政运营。\n\n### 医疗计划\n医疗计划是支付或提供医疗护理费用的群体。（注：原文存在大量重复内容，已按要求处理）。\n\
  \n\n\n\n\n当出于治疗、支付和医疗保健运营以外的目的而披露信息时，通常有义务提供实现该披露目的所需的极少量的受保护健康信息。然而，“最小必要原则”有许多例外，因此它更多是作为一种对数据管理最佳实践的提醒，而不是对数据披露的严性限制。\n\
  \n### 必须采取的行动\n\n`HIPAA` 要求受保护实体允许患者或患者的个人代表访问收集的关于该个人的信息。除了心理学家和治疗师记录这一非常有限的 262\
  \ 例外外，患者有权获得自己的完整信息集。\n\n`HIPAA` 的第二项要求是在部门采取执法行动或进行合规性审查时，向 `HHS` 提供访问受保护信息的权限。在进行此类调查时，受保护实体必须向\
  \ `HHS` 提供请求的信息。\n\n尽管上述两个原因是 `HIPAA` 下强制性报告的唯一依据，但《隐私规则》允许受保护实体履行基于州法律或其他权威机构的强制性报告义务。此类示例通常包括儿童或老年人虐待、枪伤和刺伤、某些传染病和高度传染性疾病、新生儿用药以及类似的公共健康问题。`HIPAA`\
  \ 报告这些医疗状况的义务并非来源，但它的设计是为了允许预有的强制性报告进行。\n\n### 允许的行动\n\n受保护实体可以披露的最大信息类别是用于受保护实体的治疗、支付和医疗保健运营。这意味着医生或医院权与其他医疗人员、保险和账单运营部门沟通，以确保提供预期的治疗并确保服务提供者获得报。例如，患者不能同意治疗后拒绝受保护实体与账单公司共享必要医疗信息以开具账单的权利。\n\
  \n某些受保护实体倾向于在这种情况下获得同意，但法律并未要求这样做，这反映了对“知情同意”的误解。正如对 `GDPR` 的讨论中提到的，如果拒绝提供同意将被忽略，公司应避免寻求同意。相反，受保护实体应该\
  \ 263 寻求对其通知的确认。对同意的错误定性可能会导致冲突，并可能引发涉及在其他语境下同意有效性的法律问题。另一方面，提供治疗服务的受保护实体有义务尽力获得患者对收到隐私惯例通知的书面确认。\n\
  \n在患者丧失行为能力的情况下（例如发生事故时），受保护实体可以使用其专业判断与家人交谈，并根据医疗专业人员的最佳判断按照治疗需要进行披露。患者控制这种披露，因此如果患者此前已告知受保护实体不要向特定个人提供信息，则受保护实体需要尊重该指令。但通常情况下，与家人的咨询仍然是治疗过程的一部分，并仍处于受保护实体的裁量范围内。\n\
  \n正如在“强制披露”节中所提到的，`HIPAA` 强制向信息的主体个人报告受保护健康信息。《隐私规则》进一步规定，此类信息的披露既是强制的也是允许的，推测是为了鼓励受保护实体提供其在伦理上可以提供的最多的信息。\n\
  \n《隐私规则》还考虑了可能存在受保护健康信息的偶然披露，并允许此类偶然披露。只要受保护实体已采取必要且适当的步骤实施其数据安全，并努力减少整体数据泄露，偶然披露就不会自动触发对《隐私规则》的违背。\n\
  \n264\n\n除了治疗、支付、医疗保健运营以及向患者披露外，受保护健康信息还有许多许可用途，这些是患者无法阻止的。根据州法律报告公共健康风险的义务属于 `HIPAA`\
  \ 下受保护健康信息允许披露的类别。《隐私规则》确定了十二个区域，法规允许受保护实体在这些披露信息，是因为有其他法律或义务要求强制性报告。\n\n*   **法律要求**。该类别可能与其他某些类别重叠，但它提供了广泛的通用许可，防止受保护实体违反法律。在某些方面，《隐私规则》的这一例外反转了联邦法对州法的优先地位。州法规定强制披露。\n\
  *   **司法和行政程序**。受保护实体必须遵守合法进行的司法或行政程序，包括法院命令和传票。\n*   **执法目的**。除了遵守法律的义务和司法程序外，在某些管辖区，受保护实体可能需要识别嫌疑人、逃犯、关键证人或失踪人员；提供犯罪受害者的信息；如果怀疑犯罪活动导致了死亡，提供在受保护实体场所发生的犯罪证据；更广泛地报告犯罪。每个管辖区都有其自身的义务版本。265\n\
  *   **对健康或安全的严重威胁**。根据 `Tarasoff` 判决，受保护实体可以作为对个人或公众构成严重且紧迫威胁的报告义务的一部分披露受保护健康信息。向潜在受害者和执法部门披露严重威胁是允许的。\n\
  *   **基本政府功能**。受保护实体还可以为了某些基本政府功能披露受保护健康信息。根据 `HHS` 提供，“此类功能包括：确保军事任务的顺利执行、开展授权的情报和国家安全活动、为总统提供保护服务、对美国国务院员工进行医疗能力评估、保护监管场所人员或员工的健康安全，以及确定某些政府福利计划的资格或进行注册。”\n\
  *   **公共卫生活动**。`FDA` 和公共卫生当局有权收集与公共卫生爆发和药物分配相关的某些数据。这还延伸到职业安全健康管理局 (`OSHA`)、矿山安全与健康管理局\
  \ (`MSHA`) 以及类似的州机构涵盖的某些工作披露。\n*   **虐待、忽视或家庭暴力受害者**。除了对儿童和 266 老年虐待的强制报告外，某些法律要求报告疑似的配偶和伙伴虐待。\n\
  *   **工伤赔**。工伤赔法通常包含某些报告要求和工作风险缓解记录。为了履行这些法律和行政义务，受保护实体被允许披露这些系统所需的信息。\n\n\n\n\n\
  \n### 健康监管活动\n\n- **健康监管活动**：医疗保健是一个高度受监管的行业，受保护实体有时需要向健康监管机构披露保护的健康信息，以便对医疗保健系统和政府福利计划进行审计、调查和评估。\n\
  - **死者**：受保护实体可以向葬礼服务师、法医或医法检定员披露保护的健康信息，以识别死者身份、确定死因并执行法律授权的其他功能。\n- **遗体器官、眼睛或组织捐献**：受保护实体可以使用或披露保护的健康信息，以促进遗体器官、眼睛和组织捐献及移植。\n\
  - **研究**：绝大多数研究活动都需要所有研究参与者的知情同意。尽管如此，《隐私规则》中也存在例外情况，由于信息的使用范围有限，或者研究机构已直接获得知情同意，允许受保护实体向研究计划提供保护的健康信息。此外，对于不包含\
  \ `PHI` 的去标识和匿名数据的披露也有相关规定，因为数据集被认为已经过充分匿名化。\n\n### 需要同意的披露\n\n除非受保护信息的使用属于上述类别之一，否则受保护实体必须在披露信息前获得同意。尽管如此，某些同意要求比其他要求更为正式。通常情况下，允许受保护实体将患者的联系信息作为目录信息的一部分可用，以便致电询问患者情况的朋友和家人可以被恰当地引导至患者处。医院可以合理地依赖“退出机制（opt-out）”通知，因为这种做法广为人知。患者有权反对出现在医院患者目录中，但大多数医院不会预先征求同意。\n\
  \n同样，如上文所述，如果患者带带朋友、配偶或其他家庭成员进入诊室或治疗室，且患者在诊疗或治疗期间不反对该人员的存在，则向该人员披露信息的同意被视为通过患者的行为予以了。\n\
  \n当受保护实体希望出于治疗、支付和医疗运营以外的其他目的披露保护的健康信息时，受保护实体必须获得书面同意。此类用途最常见的是营销目的。即便在此情况下也存在例外。如果营销是为了额外的治疗服务、病例管理服务或与治疗、支付或医疗服务运营提供的类似服务，则营销不需要书面同意。\n\
  \n如果营销是为了更通用的目的，或者使用 `PHI` 是为了卖给数据经纪商以进行消费者画像，则需要获得明确的书面同意。同意的内容必须足够具体，以便消费者理解所请求同意的目的。这些同意要求比通用的隐私通知严苛得多。结果是，医疗机构倾向于不将其\
  \ `PHI` 作为消费产品市场的收入来源。\n\n## 4. 安全规则\n\n与《隐私规则》不同，《安全规则》仅适用于受保护实体（包括业务协作者）持有的电子健康记录。《隐私规则》涵盖\
  \ `PHI`，而《安全规则》保护 `ePHI`。它不涵盖保护物理文件免受盗窃或篡改的义务，此类法律义务留给州法律。《安全规则》规定了一项义务，每个受保护实体必须采取合理的行政、技术和物理保护措施，以保护\
  \ `ePHI` 免受未经授权的访问、使用或披露。受保护实体须任命一名隐私官，负责履行 HIPAA 义务。\n\n《安全规则》要求受保护实体保护 `ePHI`\
  \ 的机密性、完整性和可用性。这意味着保护信息的责任不仅防止其免受黑客攻击和盗窃。正如第 6 章更详细描述的那样，机密义务要求数据免受组织内外任何人的未经授权访问。维护数据完整性的义务意味着存在一个可验证的系统，以证明数据没有因存储材料而损坏、未经授权而被更改或以其他方式发生变化。最后，维护可用性的义务要求受保护实体以合理可检索的方式保存数据，包括正常业务期间的运行副本，以及一个在运行副本因恶意软件、自然灾害或其他事故被毁时，能够在实际时间范围内合理恢复数据的备份系统。\n\
  \n每个受保护实体必须确保，在受保护实体有义务删除记录的这段时间之前，`ePHI` 仍保持功能正常且可用。记录留存法将根据司法管辖区和记录类型提供不同的留存义务。《安全规则》是一项保护信息的积极义务。受保护实体甚至需要预测可能的犯罪威胁范围，并采取适当措施阻止此类攻击。\n\
  \n一般性要求非常直观，但技术要求变得非常详尽。有四个核心要求：\n\n1. 确保受保护实体或业务协作者创建、接收、维护或传输的所有电子受保护健康信息的机密性、完整性和可用性。\n\
  2. 防止对此类信息安全或完整性的任何合理预料的威胁或危害。\n3. 防止任何在本部分 E 子部分下未被许可或要求的此类信息的合理预期的使用或披露。\n4. 确保其员工遵守本子部分的规定。\n\
  \n《安全规则》的设计是技术中立的，以便随着技术的演进，安全措施的实施能够不断改进，而不会被过时的指令所锁定。法规允许受保护实体在开发和运行其安全基础设施时考虑公司的规模、复杂性和能力，以及成本、硬件和软件安全能力。受保护实体必须将这些因素与“电子受保护健康信息潜在风险的概率和关键性”进行平衡。尽管尽力仅提供基于受保护实体规模和性质建立合理要求的一般性指南，但《安全规则》实际上是一个复杂且详尽的监管框架，公司在应用时面临困难。\n\
  \n在个人信息面临持续在线威胁，以及业务风险和自然灾害带来额外威胁的时代，卫生健康服务部（HHS）期望即使是最小的受保护实体也要对 `ePHI`加强保护。尽管如此，HHS\
  \ 预计实际执行情况在小型医生集团和大型医院系统之间会有显著差异。\n\n\n\n\n\n为了符合《安全规则》，受保护实体必须满足 20 个被确定为“强制”的子类别中的每一项。此外，还有其他标记为“可行的”（addressable）的标准，受保护实体应将其视为强力建议。强制性标准和可行的标准共同涵盖了《安全规则》的所有行政、技术和物理要求。必须对可行的标准进行仔细分析，除非这些标准对于其已建立的安全系统确实不适用，否则受保护实体不应忽略它们。仅仅满足所有强制标准可能不足以符合《安全规则》，如果未能处理\
  \ 271 项可行的标准之一导致了泄露电子健康健康信息（ePHI）的安全事件，或导致导致企业关闭的恶意软件攻击，受保护实体将承担责任。\n\n## 行政保护措施\n\
  \n尽管是技术保护措施防止恶意软件攻击计算机系统，但行政保护措施建立了机构文化和安全投入的水平。行政保护措施驱动着整个安全框架的其他部分的运行。\n\n###\
  \ 风险分析与安全管理\n合规的第一步是风险分析。全面的风险分析构建了合规流程的框架，因为它有助于受保护实体确定其 ePHI 的范围以及任何潜在安全事件的风险。风险分析是一个持续的过程，应至少每年进行一次报告，以不断更新威胁评估和安全措施的有效性。\n\
  \n法规考虑了一个持续风险分析的四步流程：\n\n*   评估对 ePHI 潜在风险的发生可能性和影响。\n*   实施适当的安全措施以应对风险分析中识别出的风险。\n\
  *   记录所选的安全措施，并在要求的情况下说明采用这些措施的理由。\n*   维持持续、合理且适当的安全保护。\n\n### 领导层与管理\n受保护实体必须指定一名安全官或官员，由其承担开发和实施\
  \ HIPAA 实施方案的政策和程序的首要责任。该人员应直接向受保护实体的高层领导汇报，且高层领导应接受 272 相关培训并参与所有 HIPAA 合规的实施。严重的\
  \ HIPAA 安全事件可能会对高层领导产生直接后果。\n\n### 员工教育与培训\n正如高层领导必须在适当的行政计划中承担责任一样，受保护实体内的所有人员都必须接受培训以保护机密信息和\
  \ ePHI。人事政策必须对未能保护 ePHI 以及任何导致故意安全事件的违规行为规定明确的后果。适当的培训必须从新员工入职开始，并对所有员工定期进行。培训内容的开发应与员工的职位相适应。对于在受保护实体的治疗、支付或运营过程中经常使用\
  \ ePHI 的人员，比那些不接触任何 ePHI 的员工需要更专业的培训。然而，即使对于没有 ePHI 访问权限的员工，每个访问计算机网络的员工都是钓鱼攻击的目标，因此每个人都需要某种程度的培训。\n\
  \n### 员工与供应商访问管理\n减少安全事件发生概率有效的方法之一是限制对数据的访问。《隐私规则》和《安全规则》都通过以下哲学来实现这种方法：将对 PHI/ePHI\
  \ 的披露限制在履行受保护实体治疗、支付或运营所需的“最小必要”范围内。最小必要原则必须纳入人事和业务伙伴的执实践中，以减少可能被使用的 PHI 数量。这意味着员工和业务伙伴仅在他们的职责和操作角色需要访问时，才能访问特定的\
  \ PHI/ePHI。这些基于角色的访问规则必须频繁更新，员工角色的任何变化都应随着其角色的变化进行相应的访问变更。受保护实体还应 273 留心，避免产生高级官员需要访问受保护信息的错误假设。基于角色的访问应聚焦于分配给个人的任务，而不是在企业内的地位。\n\
  \n## 物理保护措施\n\n物理保护重点关注存储和使用 ePHI 的建筑、门和工作空间。这些包括物理访问控制、防止盗窃和自然灾害的物理安全。为了满足这一标准，受保护实体必须“实施政策和程序以限制对其电子信息系统及其存放的设施或设施的物理访问，同时允许经过适当授权的访问”。\n\
  \n物理保护措施包括限制对电子记录以及存储这些记录的机器或设备访问的步骤，利用最小必要框架使人员在没有特定需求需要被授予访问记录的权限之前与 ePHI 保持距离，并验证这些步骤是否已就到位。这种验证可能不仅需要坚固的门锁。它通常需要某种系统，使用刷卡器或类似技术来跟踪谁访问了设施。标准还建议受保护实体保留维护记录，因为设施的维护可能会触发数据丢失的风险。\n\
  \n物理保护应包括跟踪所有可能存放 ePHI 的移动设备的方法。笔记本电脑、手机、iPad 和类似设备构成了重大的安全挑战。至少，受保护实体应对为这些设备中的每一台提供可验证的审计轨迹。虽然数据加密是一个可行的标准而非强制要求，但丢失未加密数据的设备已成为存在的最容易被预测的安全事件。未对存储数据加密说明了未能采取合理\
  \ 274 步骤来保护数据的疏忽标准。换句话说，受保护实体必须对移动设备上的所有存储数据进行加密，或者准备好在设备丢失或被盗时支付巨额罚款。\n\n跟踪移动设备的能力有助于减少\
  \ ePHI 丢失。远程删除 ePHI 的能力将进一步降低损失风险，尽管这无法保证在报告设备丢失并采取远程擦除措施之前，受保护信息没有被复制。\n\n此外，为了履行\
  \ ePHI 保持可用的义务，物理保护措施提供了标准，要求受保护实体采取适当步骤为 ePHI 提供备份系统，以应对各种潜在风险，包括黑客入侵和通过钓鱼入侵、公司设施的物理事件（如火灾或水管破裂），以及更大的自然灾害，如山火、洪水、飓风、暴雪、地震和类似的自然灾害。\n\
  \n物理保护范围必须根据受保护实体的规模进行调整，以便在财务和技术上都是适当。物理保护范围还可以根据受保护记录的数量进行调整，因此小型医生小组不需要实施与全国连锁连锁相同水平的冗余。尽管如此，即使是小型医生小组，也必须在破坏办公室的毁灭性火灾发生时能够恢复其所有记录。\n\
  \n\n\n\n通过使用业务伙伴协议（business associate agreements），较小的受保护实体可以与符合 HIPAA 标准的服务签约，以提供必要的物理保护。这些第三方可以按照物理和技术要求的方式存储电子保护健康信息（ePHI），同时提供恢复服务，确保在发生国家级灾难或当地设施损坏时数据仍然可用。\n\
  \n### 技术保护措施\n\n技术保护措施在《安全规则》（Security Rule）中提供了一个框架，但将细节留给了外部标准。这些规则包括访问控制、审计控制、传输控制以及针对数据身份验证、完整性和可靠性的数据保护。访问控制需要唯一的用户标识符和应急访问程序。\n\
  \n对于唯一用户识别，受保护实体必须提供具有唯一标识符的登录系统，并能够在公司使用的许多不同软件工具和系统中跟踪这些信息。唯一用户识别是更广泛义务的一部分，旨在确保“寻求访问电子保护健康信息的人正是其声称的个人”。RFID\
  \ 技术、生物识别扫描、多身份验证技术和类似方法有助于确保识别出来的人确实是登录者。此外，单点登录软件为个体化和分段访问提供了一个实用的解决方案。建议使用在空闲一段时间后自动注销用户的系统。更复杂的系统还可以采用近距离传感器和\
  \ RFID 技术，以确保正确的人在使用系统，且在合法登录后系统未被第二个人使用。\n\n“系统”一词也可能带有误导性。《安全规则》要求受保护实体管理每一台接触\
  \ ePHI 的设备风险。这包括服务器、桌面电脑、云存储解决方案和非网络设备，以及任何手机手机、USB 驱动器、笔记本电脑、平板电脑、阅读器或其他可能存储、处理或传输\
  \ ePHI 的设备。例如，受保护实体曾因未能妥善处置数字复印机上创建的 ePHI 被罚款，该复印机存储了复印和扫描的文件副本。复印机中的硬盘并不属于受保护实体的网络。相反，租赁的复印机由未与受保护实体签订业务伙伴协议的供应商维护，数千份患者记录暴露在这些复印机的硬盘上。\n\
  \n受保护实体必须计划处置任何不必要的 ePHI 副本，包括在数据传输和使用过程中偶然创建的额外数字副本。同样，受保护实体使用的硬件必须进行擦除，以确保如果介质在任何其他背景下（无论是组织内部还是由于设备停役、租赁转让、出售或处置）被重复使用，ePHI\
  \ 都无法被恢复。\n\n另一项技术保护措施要求应急访问程序。为了实现这一点，建议的步骤包括数据的远程同地存放和异地备份设施。受保护实体通常还会使用不断电源（UPS）和备用发电机以避免访问中断。\n\
  \n技术安全要求进行行政风险评估，以降低各种风险。显示所有 ePHI 所在位置的数据地图是理解信息存储位置的有效工具。日志和传输报告则使受保护实体能够查看正常操作程序中的信息流运行情况。该数据流可以进行映射以识别潜在的漏洞。可以使用工具捕获并对任何异常活动创建警告。如果员工或入侵者尝试复制通常不复制的数据，数据映射工具可以同时观察复制行为并创建实时警报。权限控制可用于使此类复制不可行。\n\
  \n加密仍然是法规规定的建议标准，尽管未能对静态和传输中的数据进行加密正日益成为一种不合理的风险。虽然加密是“可选择的”（addressable）而非强制的（required），但受保护实体必须在“认为适当的情况下”加密\
  \ ePHI。这是一种非常委婉的说法，意味着除非加密对特定用例中的数据运营需求造成了不可接受的负担，否则加密是强制要求的。\n\n### 5. 执行规则\n\n\
  美国健康与服务部（HHS）民权办公室的执行受《执行规则》（Enforcement Rule）的授权和监管。执行规则规定了调查、责任依据以及罚款、豁免、听证和上诉的框架。\n\
  \n民权办公室授权通过其自身的调查进行合规审查并对投诉做出回应。通常，投诉必须在投诉人获知安全事件之日起 180 天内提交，但当办公室希望继续调查时，可以授予延期。在任何时候，办公室还可将案件移交司法部进行刑事调查。\n\
  \n作为民事事务的结果，办公室可能认定没有违规行为，或者通过与受保护实合作，制定自愿合规或纠正措施计划。自愿合规和纠正措施可能涉及罚款，但这些金额将低于需要正式裁定时的金额。然而，在某些情况下，受保护实体仍不愿或无法采取纠正措施，在这种情况下办公室将发布正式的违规裁定并处罚款。受保护实体可以就民事罚款申请听证。听证将在\
  \ HHS 行政法官面前举行，由法官决定罚款是否由民权办公室开发的证据所支持。州检察长也被授权在联邦地区法院对对违反 HIPAA 的个人提起民事诉讼。州级行动可以在民权办公室采取的行动之外进行，也可以与该办公室协作进行。\n\
  \n尽管罚款可能低至 100 美元，但金额可能高达 50,000 美元。每条披露的记录都是单独违规。法规规定年度罚款上限为 1,500,000 美元。如果一种情况持续超过一年，罚款也可以相应增加。罚款基于受保护实体所出的尽职程度。对于公司并不知道安全事件且行使合理尽职本不会发现该事件的情况，该问题可以在不罚款的情况下得到解决，或以最低标准的罚款解决。如果公司在获知安全事件后对民权办公室反应非常迅速并及时处理事件，罚款也会较低。\n\
  \n\n\n\n在本章的讨论中，受保护实体（covered entities）的义务包含了其 279 个业务伙伴（business associates）的相同义务，但业务伙伴属于一类略有不同的企业。美国健康服务部（HHS）对该概念解释如下：\n\
  \n“业务伙伴”是指代表受保护实体执行或向其提供服务，并涉及使用或披露受保护健康信息的特定功能或个人或实体。\n\n## 业务伙伴示例\n\n*   协助医疗计划进行理赔处理的第三方管理员。\n\
  *   为医疗保健提供者提供会计服务涉及对受保护健康信息的访问会计师事务所。\n*   为医疗计划提供法律服务涉及对受保护健康信息的访问律师。\n* 为医院执行利用率审查的顾问。\n\
  * 医疗保健结算中心，代表医疗保健提供者将非标准格式的理赔翻译成标准交易格式，并将处理后的交易转发给付款方。\n*   为医生提供转录服务的独立医疗转录员。\n\
  *   管理医疗计划药剂师网络的药剂福利经理。\n\n这些业务伙伴本身并不是受保护实体，但由于它们可以接触到 `PHI` 和 `ePHI`，因此必须承担合同义务，根据\
  \ `HIPAA` 规定处理受保护信息。其他常见的受保护实体是云计算公司和数据存储公司，它们为受保护实体存储、传输、处理或恢复数据。这些 280 个实体并不使用\
  \ `PHI` 或 `ePHI`，但其基础设施可能会让它们接触这些信息。即使所有数据都经过了加密，云计算和数据存储公司仍必须作为业务伙伴遵守法律和合同义务。\n\
  \n受保护实体和业务伙伴必须签署书面协议，其中包含满足《隐私规则》（Privacy Rule）的条款和规定。协议必须明确规定 `PHI` 的许可用途，并限制任何其他用途。受保护实体本身必须遵守《安全规则》（Security\
  \ Rule）规定的义务以保护 `ePHI`。\n\n尽管所采取的具体步骤可能与受保护实体不同，但安全措施必须足够满足 `HIPAA` 标准。例如，如果受保护实体使用生物识别来确保登录身份验证，业务伙伴可以使用多因素身份验证。两者都是同一身份验证义务的合理解决方案。受保护实体及其业务伙伴必须符合标准，但他们可以自由安排不同的策略来实现。在起草这些协议时，双方应理解“履行相同义务”与“采用相同技术”之间的区别。\n\
  \n与受保护实体一样，业务伙伴必须遵守违规通知规则，通常它还必须通知受保护实体。合同应赋予受保护实体在业务伙伴无法补救违规行为或履行其通知义务时终止协议的权利。在受保护实体的业务伙伴发生安全事件且无法补救、也无法终止合同的情况下，受保护实体必须向民事权利办公室（Office\
  \ for Civil Rights）报告该情况。\n\n并非每个受保护实体的承包商都是业务伙伴。HHS 提供的示例包括清洁服务人员、美国邮政局（U.S. Post\
  \ Office）、银行、信用卡公司和其他向受保护实体提供 281 通用服务的供应商，他们没有访问 `PHI` 的权利。尽管邮政局传输含有 `PHI` 的信件，但邮政局没有权利打开这些信件。信用卡公司拥有有关患者和受保护实体的信息，包括服务收费金额，但这些信息是为了其正常业务职能的。因此，法规并不要求信用卡公司成为业务伙伴。（然而，银行信息将在下一章介绍。）\n\
  \n## 预冲突\n\n`HIPAA` 围绕预冲突问题产生了一些有趣的问题。作为一项全面的联邦法规，它通常会阻止各州在同一领域进行立法和规管。相反，`HIPAA`\
  \ 提供了一套基本的最低要求，并允许各州实施更严格的规定。相比之下，如果州法律与 `HIPAA` “冲突”，则该法律将无法执行，并由 `HIPAA` 的法律法规进行规范。\n\
  \n当受保护实体无法同时遵守州法律和 `HIPAA` 隐私规则时，此类法律即为违反了 `HIPAA` 且无法执行。如果州法律提出了一个 `HIPAA` 未涵盖的义务，情况也是如此。正因如此，`HIPAA`\
  \ 包含了相关条款，允许向执法部门、法院、卫生部门以及州要求的其他机构进行许可披露。在没有 `HIPAA` 许可的情况下，这些州法律将被预冲突。\n\n加利福尼亚州提供了一个示例。《加州医疗信息保密法（CMIA）》对受保护信息的定义比\
  \ `HIPAA` 中的更宽，对医疗保健提供者的定义更宽，并且拥有私法诉讼权，允许个人因违反 `CMIA` 提起诉讼。例如，在 `CMIA` 下，应用开发人员和其他提供旨在维护医疗信息的软件或硬件的公司将被视为\
  \ 282 提供者。许多医疗健康应用并不提供实际的医疗治疗，这意味着在隐私法规方面，它们受 `CMIA` 保护但不受 `HIPAA` 保护。\n\n## 遗传信息\n\
  \n遗传信息首次用于 20 世纪 50 年代通过追踪染色体检测唐综合征。染色体含有基因，基因由脱氧核糖核酸（`DNA`）组成。某些基因产生蛋白质分子，为所有遗传性特征提供代码。通过这一过程，`DNA`\
  \ 分子产生包含动物、植物和其他类型生物遗传代码的蛋白质。其他 `DNA` 分子不编码蛋白质，但具有足够的独特性，可以为采集细胞样本的人提供高度准确的标识。\n\
  \n特定染色体上的基因与不同的疾病和突变有关。在简单的情况下，基因突变与特定疾病直接相关。通常，一种疾病或特征与几十个或更多基因有关。随着技术的提高，法医科学家和医学专家现在可以识别出许多指示疾病倾向的基因，并且工作正在进展到能够以治疗性方式修改人的基因代码，从而纠正基因突变。\n\
  \n从 1984 年开始，美国政府开始支持一项绘制人类基因组图的项目。该项目于 1990 年正式启动，并在 2003 年成功绘制了人类基因组图，耗资 30 亿美元。开发的技术和其揭示的信息为新产品、服务和医疗治疗开辟了大道路。今天，邮寄\
  \ `DNA` 测试的成本可以低于 100 美元，但为了获得更科学准确的结果，费用通常高达 500 美元。消费者可以使用它们来 283 确定亲关系、追溯家族史，或对疾病的遗传倾向或治疗方案倾向进行医学调查。\n\
  \n\n\n\n\n从 2020 年开始，基因检测公司将受加利福尼亚州`CCPA`的约束，收集的生物识别信息将受类似州生物识别法的管辖。然而，取决于 DNA 公司请求的同意范围，消费者可能会继续同意使其基因信息被用于去标识化研究以及供可识别的法律执法部门使用。\n\
  \n在许多备受关注的案件中，执法部门上传了从未决案件中恢复的 DNA，并利用亲属信息获取了导致刑事定罪的信息。由于这些商业数据库不受联邦法律的保护，这些机构在使用这些数据时几乎没有任何限制。\n\
  \n## 1. CODIS\n\n当 20 世纪 80 年代，当 DNA 链的部分在科学上变得可以复制时，法医专家能够利用犯罪现场发现的唾液、血液或毛囊 DNA\
  \ 样本，并利用匹配结果识别出出现在犯罪现场的个人。精子 DNA 为许多强奸案和性侵案提供了确凿证据。1987 年，英国和美国曾利用犯罪者留 ing 犯罪现场的精子对强奸案和谋杀案进行了定罪。七年后，1994\
  \ 年，国通过了《DNA 鉴定法》（`DNA Identification Act`），授权`FBI`创建并维护名为“联合 DNA 索引系统”（`CODIS`）的\
  \ DNA 数据库。`CODIS`由联邦、州和地方法医部门补充。与其在电视上的呈现不同，`CODIS`只包含 DNA 和参考信息。它本身并不持有数据库中人员的姓名、社会安全号码或其他个人标识符。相反，`CODIS`软件连接了\
  \ 284 个请求和供应部门，以提供具体的个人信息。\n\n`CODIS`的一部分是国家 DNA 索引系统（`NDIS`），它于 1998 年开始运行。根据法律，`NDIS`拥有一份来自定罪罪犯、被捕者、合法拘留人员、法医`[casework]`、无身份遗骸、失踪人员以及失踪人员亲属的\
  \ DNA 登记。\n\n基因在犯罪现场提供了极佳的识别形式，并在亲权争议案件中提供了确定性的父鉴定分析。人体内的几乎每个细胞都包含一个相同的 DNA 样本。执法部门已成功从攻击受害者的咬痕、精液、烟头和邮票戳上采集了\
  \ DNA。凭借现代技术，只需要少数细胞即可采集样本，包括一根已经没有根部的头发。\n\n理论上，上传到`NDIS`的实验室如果定罪罪犯的判决被推翻，或者被捕者的指控被撤销、无罪或在法定时间内未被起诉，则必须删除文件。然而，删除文件并没有意义的审计，因此这些非法数据可能仍然是`NDIS`的一部分。该数据库的文件超过了\
  \ 1400 万份。\n\n与商业服务不同，《DNA 法》并不允许进行亲属检索。从`CODIS`搜索中检索的许可信息只有精确匹配以及符合某些部分匹配标准的匹配。\n\
  \n## 2. 2008 年基因信息非歧视法 (GINA)\n\n鉴于执法部门对 DNA 使用范围的扩大，国会意识到必然会出现利用 DNA 进行不符合公共利益目的的机会。作为回应，国会制定了《2008\
  \ 年基因信息非歧视法》（`GINA`）。该法律并非寻求限制基因信息的收集或获取。相反，它保护个人免受健康保险和就业领域的基因歧视。`GINA`此前此前有一项\
  \ 2000 年的行政命令，该命令禁止在联邦就业中基于基因信息的歧视。\n\n该法律禁止雇主和健康保险公司根据基因检测披露的信息，利用基因检测结果进行歧视。在最常见的例子中，这意味着公司不能拒绝雇用一个具有癌症基因倾向的人，以降低其医疗保健成本。同样，健康保险公司不能将基因倾向列为既往病史，并排除对通过\
  \ DNA 识别出的疾病的医疗保健覆盖。\n\n`GINA`的范围非常有限。它不延伸至人寿保险、长期障碍护理或其他形式的保险。`GINA`也不适用于加利福尼亚州某学区因一名学生囊性纤维化相关基因呈阳性而对其进行隔离的情况。根据诉讼信息，该学生实际上并没有患该疾病，但学区出于担心他会发生这种状况而采取了行动。\n\
  \n个人向第三方而非请求样本本人向消费者测试机构提供 DNA 样本的能力，引发了重大的隐私担忧。雇主被禁止进行此类测试或将该信息用于不利决策，健康保险公司也是如此。相比之下，个人可以使用样本来探索熟人的医疗状况，或利用这些信息来进一步进行身份盗窃。\n\
  \n基因医疗信息是医疗信息中最敏感的方面，但与个人的医疗档案不同，获取基因信息的能力很容易获得。通过医生保密协议、`HIPAA`和州法律，医疗记录受到严格保护，免受泄露和误用。由于其易于获取，DNA\
  \ 尚未获得法律的完全保护，但围绕 DNA 使用和误用的法律将继续演变。\n\n### 本章要点\n\n- 医疗保健部门需要美国法律下最强大的隐私保护。医患保密继续受到州法律的保护，但大多数其他形式的医疗隐私均受`HIPAA`管辖。\n\
  - 尽管有强大的隐私保护，但每个州都有法律规定医生、心理学家等人有义务对个人受到的威胁、健康风险、某些疾病的传播以及与执法部门相关的其他信息发出警告。纳入州法律的警告义务是`HIPAA`对受覆盖实体及其业务伙伴不披露义务项下的一项被允许的例外。\n\
  - `HIPAA`建立了一个结构，增加了治疗、支付和护理操作流程中每个阶段的保密性。医院、医生诊所、药店和其他受覆盖实体已改进了其系统以减少无意的公开泄露。患者能够以对其他医疗保健提供者有用的形式接收医疗记录副本。此外，卫生和服务部民事权利办公室的执法使受覆盖实体对未能采取足够措施保护医疗记录承担责任。\n\
  \n## 287: 需要知道的事\n\n`HIPAA`数据安全依赖于物理、行政和技术保护措施的框架，必须遵循这些措施以满足《隐私规则》、《安全规则》和《执法规则》项下的义务。这些法规共同建立了标准，确保受覆盖实体能够收集、处理、存储和分发其医疗保健数据，同时保护其免受盗窃、破坏或未经授权的操纵。\n\
  \n\n\n\n\nHIPAA 并没有规定特定的技术义务。相反，这些法规是技术中立的，这样受保护实体就可以随着业务和技术的变化，继续审计并应对机构的需求。威胁和风险的性质不断演变，受保护实体和患者的需求也随之演变。这种定期评估的过程是维护隐私和安全的持续过程中不可或缺的环节。\n\
  \n### 值得思考的问题\n\n鉴于 HIPAA 持续为数据隐私和安全建立最严苛的模型，州或其他监管机构是否可以简单地规定其他类型的数据也遵循隐私规则和安全规则？这种方法的优缺点是什么？\n\
  \n纽约州的《SHIELD 法案》或 `CCPA` 在多大程度上已经接近于采用隐私规则和安全规则的版本了？\n\n即使各州不愿将隐私规则和安全规则作为法律模型，处理高度敏感非医疗数据的公司是否也应该将\
  \ HIPAA 认证作为其自愿安全评估的框架？这种方法的优缺点又是什么？\n\n289\n\n![clocky\\_bw\\_CHAP.tif](img/Image_12.jpg)\n\
  \n# 第 10 章：部门隐私：银行、金融机构和贷款活动\n\n从历史上看，银行、贷款和金融机构一直是美国受监管最严格的行业之一。这包括有关消费贷款和银行业务的法规。这些法律包括《公平信用报告法》、《《格拉姆-莱奇-布莱利法案》、《《萨班斯-奥克斯利法案》，以及根据《证券法》和《证券交易法》的法规。\n\
  \n此外，由于银行是存放资金的地方，它们也是重大犯罪活动的焦点。因此，银行和金融部门是隐私和安全领域受监管最广泛的部门，只有医疗保健业的监管更为严格。许多针对金融部门的法律和法规旨在确保金融系统免受犯罪活动的影响，包括盗取消费者资金以及利用金融系统进行洗钱以推进犯罪和恐怖活动。\n\
  \n290\n\n金融监管通过多个机构的结合来执行，主要是`消费者金融保护局 (CFPB)` 和 `联邦贸易委员会 (FTC)`。当 2010 年通过《多德-弗兰克法案》对金融报告法进行重组时，联合监管机制随之建立。`CFPB`\
  \ 是作为 2010 年银行改革努力的一部分创建的。《消费者金融保护法》要求建立 `CFPB`，以便集中收集、监控和响应有关消费者金融产品和服务的投诉，并由 `CFPB`\
  \ 与 `FTC` 协调，在适当的情况下将投诉转交给 `FTC`。\n\n这些法规赋予了 `CFPB` 对银行、储蓄银行或联邦信贷社的管辖，并赋予了 `FTC`\
  \ 对银行、储蓄银行和联邦信贷社以外的金融机构的管辖。例如，近年来，`FTC` 对提供汽车融资贷款、汽车所有权贷款、发薪贷款和消费电子产品融资的公司采取了行动。所有这些公司都是非银行贷款机构，但在向消费者提供信贷方面仍受监管。\n\
  \n金融行业将这些金融贷款机构称为消费者报告机构 (`CRAs`)。`CFPB` 开始对在其管辖范围内的所有 `CRAs` 进行全国性审查，以确保银行和金融机构已具备足够的物理、行政和技术网络安全程序，以维持对银行系统的信心。在过去的十年中，监管机构放宽了金融机构监管中关于隐私通知的内容，但增加了数据安全义务。\n\
  \n本章总结并探讨了银行、贷款和金融领域隐私与数据安全法律的共同方面。\n\n291\n\n## A. 《格拉姆-莱奇-布莱利法案》(GLBA)\n\n监管金融行业隐私和数据安全义务的主要法律是\
  \ 1999 年的《格拉姆-莱奇-布莱利法案》。与 HIPAA 类似，`GLBA` 为受保护的金融机构纳入了隐私规则和旨在确保足够的最小数据安全的“保障规则”。根据\
  \ `GLBA`，金融机构必须向其客户提供年度通知，解释其信息收集和数据共享惯例。对于某些类型的数据共享，客户有权退出信息共享，且年度通知必须提供执行此操作的机制。\n\
  \n### 1. 显著从事金融活动的业务\n\n隐私规则的涵盖范围广泛得多，而不仅限于银行。正如《银行控股公司法》法规规定的，任何“显著从事金融活动”的业务都受这些法规的约束。金融活动将包括：\n\
  \n*   贷款、交换、转移、为他人投资或保护资金或证券。\n*   在任何州提供保险、担保或对损失、伤害、损害、疾病、残疾或死亡提供损害赔偿，或提供和发行年金，并为了上述目的担任委托人、代理或经纪人。\n\
  *   提供财务、投资或经济咨询服务，包括向投资公司（根据《1940 年投资公司法》第 3 节定义）提供建议。\n\n292\n\n*   发行或出售代表允许银行直接持有的资产池权益的工具。\n\
  *   对证券进行承销、交易或事市场做市。\n*   参与任何与银行密切相关的活动，或管理或控制银行（如果在在美国运营的境内外国银行）。\n\n除了银行、储蓄银行和信贷社，受\
  \ `GLBA` 制定的业务还包括保险公司、财务顾问、抵押贷款人、金融公司、抵押贷款经纪、汽车经销商、支票兑现商、发薪贷款人、汇款人、催收机构、信用顾问和其他财务顾问、报税人员以及房地产结算服务提供商。\n\
  \n并不是所有的 IOOU 都受 `GLBA` 涵盖。其限制性在于提供金融活动的人或业务并未显著从事。`FTC` 帮助说明了这些区别：\n\n为客户“记账”的店主或调酒师不被视为显著从事金融活动，但一家通过发行自己的信用卡直接向消费者提供信贷的零售商则会被涵盖。其次，业务从事金融活动的频率有多高？允许某些消费者通过偶尔的预付计划进行付款的零售商并不“显著从事”金融活动。相比之下，经常与消费者之间往回电汇款的业务属于显著从事金融活动。\n\
  \n如果受隐私规则涵盖的金融机构收集或接收了非公开个人信息，则要求向其客户以及某些非客户消费者提供年度隐私通知。写于 1999 年的 293 非公开个人信息是一个更窄的个人信息类别，比目前\
  \ `CCPA`、`GDPR`、`HIPAA` 或《SHIELD 法案》所涵盖的信息范畴要窄得多。\n\n**非公开个人信息：** “非公开个人信息”通常是指任何非公开的信息，且符合以下条件：\n\
  \n*   消费者为了从金融机构获得金融产品或服务而提供的信息；\n*   消费者与机构之间涉及金融产品或服务的交易产生的信息；或\n*   金融机构在提供金融产品或服务的过程中其他获得的有关消费者的信息。\n\
  \n\n\n\n\nFDIC 合规手册解释道，非公开信息是一个狭窄的类别。\n\n如果一家机构有合理的理由认为信息已通过政府记录、广泛传播的媒体或法律要求向公众披露的方式合法地向公众公开，则该信息为公开可用信息。例如电话簿中的信息或公开记录的文档，如抵押贷款或证券权益备案。\n\
  \n与大多数州级隐私法不同，使用通用公共记录、传播媒体、抵押贷款备案和其他文件，免除了这些金融机构提供通知的义务。尽管如此，非公开个人信息确实涵盖了客户列表，因为某人与该金融机构关联这一信息属于非公开信息。非公开信息还包括社会安全号码、信用评分、计算机\
  \ Cookie 和其他数据跟踪，以及金融机构关于消费者所生成的任何信息。\n\n这些法规仅适用于个人交易，而非业务交易。消费者是指从金融机构获得或已获得金融产品或服务的个人，且该产品或服务主要用于个人、家庭或家务用途。相比之下，客户是指与金融机构保持持续关系的消费者，该机构向消费者提供了一种或多种金融产品或服务。真正的区别在于双方之间的持续关系。消费者在与金融机构互动时可能有权获得隐私通知，而客户则在首次与金融机构互动时以及此后的每年都有权获得隐私通知。\n\
  \n## 2. 年度隐私通知\n\n1999 年，`GLBA` 下的年度隐私通知要求改变了国家消费者隐私的监管格局。在引入后的几十年里，“退出机制（opt-out）”法规的持续相关性非常有限。隐私通知的内容在很大程度上取决于法规以及监管机构发布的、供金融机构使用的标准表格。目前的模型表格被格式化为一系列方框，大多数信息都是以非常浅层的方式提供的。顶部有三个框，解释了披露的“为什么”、“是什么”以及“如何做”。括号表示需要由每家金融机构填写的信息。\n\
  \n### 为什么？——金融公司选择如何共享您的个人信息。联邦法赋予消费者限制部分而非全部共享的权利。联邦法还要求我们告诉您我们如何收集、共享和保护您的个人信息。请仔细阅读此通知以了解我们的所工作。\n\
  \n### 是什么？——我们收集和共享的个人信息类型取决于您与我们建立的产品或服务。这些信息可能包括：\n\n* 社会安全号码和 `[收入]`\n* `[账户余额]`\
  \ 和 `[付款历史]`\n* `[信用历史]` 和 `[信用评分]`\n\n### 如何做？——所有的金融公司都需要共享客户的个人信息来经营日常业务。在下面的部分，我们列出了金融公司共享客户个人信息的原因；`[金融机构名称]`\
  \ 选择共享的原因；以及您是否可以限制这种共享。\n\n表格的第二部分包含一张表格，列出了数据共享的七种通用解释，以及显示金融机构是否与关联机构或其他第三方共享这些信息的列，以及一个指示客户是否可以退出共享的列。从\
  \ 2014 年开始，`CFPB` 修改了其规则，允许金融机构仅通过在其网站上发布年度通知来提供年度隐私通知披露。\n\n这些表格大大简化了报告工作，告知客户其对非公开个人信息的控制仅限于非关联机构和关联方的营销。对于直接营销或金融机构的运营需求，没有退出权利。\n\
  \n表格指出，州法律可能要严格得多。`GLBA` 与 `CCPA` 和 `GDPR` 义务之间的紧张关系，对于那些没有获得联邦预占权的金融机构来说将变得非常显著。虽然银行、储蓄银行和联邦信用合作社通常免于州隐私法的限制，但其他金融机构需要以一种认可州和联邦隐私方法的方式提供数据隐私保护。\n\
  \n## 3. 安全措施规则\n\n与 `GLBA` 隐私规则的作用日益削弱相反，`安全措施规则（Safeguards Rule）`在 2019 年经过了重大更新，以提高受监管限制的各类金融机构对信息安全的预期。与许多其他监管机制一样，`安全措施规则`要求金融机构“制定、实施并维护一个全面的信息安全计划，该计划由金融机构用于访问、收集、分配、处理、保护、存储、使用、传输、处置或以处理客户信息的行政、技术和物理安全措施组成”。\n\
  \n每家金融机构必须根据其规模和复杂性制定书面安全计划，并合理设计以确保客户信息的安全机密性。安全计划必须保护消费者信息免受未经授权的访问、不当使用、破坏或其他损坏，这些可能给任何客户造成实质性的损害或不便。`安全措施规则`关注于“对客户信息安全、机性和完整性的可预见的内部和外部风险，这些风险可能导致此类信息的未经授权披露、误用、篡改、破坏或其他损害”。为了防御这些风险，每家金融机构的书面计划必须包含以下三个领域的规定：\n\
  \n1. 员工培训和管理；\n2. 信息系统，包括网络和软件设计，以及信息处理、存储、传输和处置；\n3. 探测、预防和响应攻击、侵入或其他系统故障。\n\n\
  `安全措施规则`明确了创建适当安全计划的持续义务：\n\n金融机构随后必须设计并实施安全措施以控制通过风险评估识别出的风险，并必须定期测试或通过监控安全措施的关键控制、系统和程序的有效性。\n\
  \n金融机构还要求根据此类测试和监控的结果，以及其业务或业务安排的任何重大变化，或其已知或理由认为可能对其信息安全计划产生重大影响的其他情况，来评估并调整其信息安全计划。金融机构还指定一名或多名员工来协调信息安全计划。\n\
  \n最后，`安全措施规则`要求金融机构采取合理步骤选择并保留能够维护客户信息适当安全措施的服务提供商，并通过合同要求这些服务提供商实施并维护此类安全措施。\n\n\
  \n\n\n受监管的金融机构必须拥有一全面的书面安全计划，详细说明为提供合理安全措施所需的行政、技术和物理步骤。每家机构都要求指定一名合格的人员担任安全管理员或安全官，例如\
  \ `首席信息安全官 (CISO)`，以及一名负责监督 `CISO` 的更高级管理人员。\n\n然而，这些法规对消费者记录数量少于 5,000 条的机构提供了小范围豁免。虽然这些较小的公司仍属于规则范围，但它们免于强制性的书面风险评估；持续监控或年度渗透测试以及每半年一次的漏洞评估；书面事件响应计划；以及\
  \ `CISO` 的年度书面报告。\n\n满足行政、技术和物理义务的要求比 `HIPAA` 规定的要不详尽，考虑到联邦定义中的金融机构涵盖了广泛的业务类型，这种做法是合适的。监管机构还希望避免创建一种容易被采纳但无法被执行的“勾选式”安全系统。金融机构可以参考\
  \ `HIPAA`、`SHIELD Act` 以及其他国家颁布标准的实践来满足更新后的 `Safeguards Rule` 的要求。\n\n尽管更新后的 `Safeguards\
  \ Rule` 在技术上并不是一份清单，但它以非常有用的方式描述了实现全面安全所需的步骤。它可以被读作关于数据安全的入门指南，包括详细的响应计划。更新后的 `Safeguards\
  \ Rule` 要求更具体的合规性。\n\n各金融监管机构（包括 `CFPB` 和 `FTC`）正在审查金融机构在实施更新保护措施、采纳所需书面计划、任命所需人员以及根据计划制度化测试和评估协议方面所努力。鉴于可能被视为金融机构的公司范围广泛，`GLBA`\
  \ 的修订将大幅提高全范围内的数据安全水平。\n\n## B. 公平信贷报告法 (FCRA)\n\n`公平信贷报告法 (FCRA)` 作为第一部规范企业使用个人信息的联邦法律而通过的。尽管它于\
  \ 1970 年颁布，但经过了重大更新，以保持其在信贷报告消费者保护的前沿地位。`FCRA` 被引入第 4 章是因为它在保护潜在员工和现任员工免受就业决策背景下财务信息滥用方面发挥着重要作用，但\
  \ `FCRA` 的作用远超此范围。除了 `FCRA` 下的权利外，许多州还通过额外的州法保护补充了该法律，提供了额外的消费者保护。\n\n`FCRA` 的主要目的是保护消费者提供给\
  \ `Equifax`、`Experian` 和 `TransUnion`（三大主要的消费者信贷报告机构）的信息，以及这三家机构向企业提供的用于信贷、就业和其他用途的信息。除了这三家消费者信贷报告机构外，`FCRA`\
  \ 还监管由数据经纪人、就业筛选公司、住房筛选公司和其他报告机构所披露的某些信息。这些公司中的大多数也属于 `GLBA` 对金融机构的定义，要求它们遵循 `隐私规则\
  \ (Privacy Rule)` 和 `保护规则 (Safeguards Rule)`。\n\n`FCRA` 的作用远超单纯的隐私保护。它对个人信息如何报告为消费者提供了积极的保护。这些权利包括获取信贷机构收集的信息副本的权利、争议不完整和不准确信息的权利，以及删除无法证实的信息和过时的负面信息的权利。消费者还有权获得免费的信用评分，每年从三家报告机构中的每一家获得一份免费报告副本，并在公司根据消费者报告中的信息采取不利行动的每次情况下获得通知的权利。\n\
  \n`FCRA` 也是限制身份盗窃工作的核心。法律规定，任何人都有权在其账户上设置“安全冻结”。这禁止了信贷报告机构在没有账户持有人明确授权的情况下发布任何信息或信贷报告。安全冻结使得身份盗窃者更难利用他们收集的信息来开设新账户以获取信贷或进行未经授权的购买。消费者可以选择在账户上设置欺诈警报，这要求企业采取额外步骤来验证消费者的身份，但实际上不会冻结信贷局的报告。\n\
  \n`FCRA` 规定了信贷报告如何使用以及何时禁止使用。允许的用途包括：\n\n*   出于个人、家庭或家用目的的信贷、保险和租赁申请。\n*   与消费者有现有关系的公司对账户进行更新或更新。\n\
  *   在雇主获得申请人或员工同意的情况下进行的就业前及决策、招聘、晋升、调岗或留任。\n*   职业执业。\n*   法院命令，包括大陪团传票。\n*   在完成交易有合法业务需求时的消费者交易。\n\
  *   子女抚养费判定。\n*   有限情况下用于反恐和反情报调查的执法部门访问。\n\n此列表提供了信贷报告使用的唯一目的。尽管这些类别中的某些可能被认为相当广泛，但它在很大程度上限制了信息的使用。信贷报告机构不能将信息卖给公司以对其客户进行财务审查和预筛选。\n\
  \n`FCRA` 在数据共享限制中不包含某些基本信息，包括姓名、地址和联系信息。它还允许信用卡公司购买预先获得信用卡资格的列表。\n\n此外，虽然 `FCRA`\
  \ 赋予消费者查看和纠正其信贷报告的法律权利，但许多研究和调查表明，多达 75% 的信贷报告存在某些错误。如果信贷报告机构不接受报告存在错误的证据，它就可以继续使用被争议的信息。因此，`FCRA`\
  \ 对实际消费者体验的影响仍然是参不齐的。\n\n\n\n\n广义而言，国家证券监管体系分为联邦模式和州模式。联邦模式强调对上市公司所有实质性信息进行披露，而州模式则包括保护居民免受不公平证券发行的损害。在联邦层面注册的公司将豁免州层面的报备义务。\n\
  \n在联邦监管层面，政府要求发行公司为证券的潜在购买者提供关于所有实质信息的完整且准确的披露。这意味着，如果一种股票要进行公开交易，必须首先提交一份招股说明书，其中包含财务信息以及有关企业管理和运营的信息，这些信息必须足够详尽，以使理性投资者能够就是否投资该股票做出明智的决策。一旦公司公开上市，就必须提交某些季度报告和年度报告，并就其所有权或运营的某些变化进行报告。\n\
  \n对于由少数一小组投资者拥有的公司，通常不适用联邦注册体系。相反，这些证券可能会根据州法受到监管。州法通常要求出售证券的公司不能利用有关公司财务估值的州法规来剥削买家。\n\
  \n在实践中，由核心所有者持有的的小型公司与大型上市公司之间存在许多等级差异。各州也要求披露的平衡，并且某些发行类别允许公司在不成为完全注册的公司的情况下进行联邦备案。这些区别超出了本介绍的范畴。\n\
  \n### 303\n\n出于数据隐私和证券监管的考虑，监管重点一直放在上市公司的职责。证券交易委员会（`SEC` 或“委员会”）已表示，“网络安全风险对投资者、我们的资本市场以及我们的国家构成了严峻威胁……上市公司采取所有必要行动，及时向投资者通报实质性的网络安全风险和事件，是至关重要的，包括那些面临实质性网络安全风险但可能尚未成为网络攻击目标的公司。”\n\
  \n相关规定包括上市公司有义务在其正式报告文件中披露其数据安全概况，并建立“内部会计控制”以防止欺诈以及对财务和其他数据的滥用。最后，`SEC` 对内幕交易以及公司领导层在网络安全事件期间获得的机密内部信息可能发生的实际或感知到的滥用行为表示了担忧。\n\
  \n### 1. 企业级风险管理\n\n`SEC` 变得非常关注网络安全。在 2018 年的指导意见中，它明确表示，评估的是“董事会与管理层在网络安全问题上的互动如何让投资者能够评估董事会在这一日益重要的领域如何履行其风险监督责任”。由于这种直接监督，`SEC`\
  \ 已成为一个额外的声音，要求所有上市公司必须采取全面的行政、技术和物理安全措施。\n\n这种努力并不具有像 `HIPAA` 或 `GLBA` 那样的法律效力。提供金融服务的公司受\
  \ `GLBA` 以及其他特定法规的约束，这些法规要求特定的安全措施。对于这些法规之外的，`SEC` 仅仅是“鼓励采用”全面的 `304cybersecurity`\
  \ 政策。`SEC` 在披露控制的框架下确实拥有某些监管权限，可以坚持网络安全是披露控制流程的一部分。\n\n`SEC` 进一步指出，发行人被要求“制定并维护一套内部会计控制系统，以提供合理的保证，确保交易在管理层的通用或特定授权下执行，或仅在授权的情况下访问公司资产”。这些系统作为安全事件的一部分面临着破解风险，这为\
  \ `SEC` 强制要求安全措施提供了额外的权限。\n\n### 2. 披露网络安全风险的职责\n\n自 2011 以来，`SEC` 要求公司提供有关网络安全风险和安全事件的公开信息。`SEC`\
  \ 承认数据安全未列在立法条文中，但由于重大的网络安全风险和已知的安全事件对投资者考虑公司财务状况及其管理运营而言具有实质性，因此报告公司被要求提供有意义的信息。\n\
  \n上市公司通常抵制报告网络安全风险的义务，大多数公司仅提供最模糊的披露。一些公司认为网络安全的背景风险无处不在，因此它对任何特定公司来说都不是一个实质性因素。其他公司则声称，提供任何形式的详细信息只会协助犯罪分子实施对这些上市公司的攻击。\n\
  \n`SEC` 在 2018 年通过额外的指导意见做出回应，明确这一义务仍然是委员会的优先事项。`SEC` 指出了季度报告和年度报告，在这些报告中，公司必须“就其业务和运营、风险因素、法律诉讼、管理层对财务状况和经营结果的\
  \ 305 讨论与分析 (`MD&A`)、财务报表、披露控制和程序以及公司治理进行披露”。`SEC` 的指导已经确定了“触发披露义务的实质性网络安全风险和事件”。\n\
  \n`SEC` 继续提醒公司，法律要求“注册声明必须披露所有要求陈述或为使声明中的内容不具误导性所需的实质性事实”。未能包含已知的网络安全风险和安全事件将导致关于公司的其他陈述变得不准确，并可能引发法规下的对股东的责任。\n\
  \n如果存在实质可能性，即理性投资者会认为这些信息在做出投资决策时非常重要，或者披露遗漏的信息会被理性投资者认为已显著改变了可用信息的总混合，则委员会认为遗漏的信息具有实质性。\n\
  \n在确定有关网络安全风险和事件的披露义务时，公司通常会权衡任何已识别风险的潜在实质性，并且在事件的情况下，任何受泄露信息的重要性以及事件对公司运营的影响。网络安全风险或事件的实质性取决于其性质、程度和潜在规模，特别是当它们涉及任何受泄露的信息或公司业务和范围时。\n\
  \n`SEC` 注意到，安全事件的实质性并非仅仅通过数据泄露的大小来衡量。正如第 3066 章所示，与安全事件相关的成本除了法医调查、客户通知和增强安全的成本外，还有许多其他。导致客户大量流失的漏洞可能会击垮一家公司，这是股东或潜在股东有权知道的信息。`SEC`\
  \ 同意这一观点：\n\n\n\n\n\n网络安全风险和事件的实质性还取决于此类事件可能造成的损害范围。这包括对公司声誉、财务表现以及客户和供应商关系的损害，还包括可能发生的诉讼或监管调查或行动，包括由州、联邦政府机构以及非美国当局采取的监管行动。\n\
  \n上市公司公司必须披露的一类信息是“风险因素”，这些因素使得对公司证券的潜在投资具有投机性或风险性。`SEC` 建议，如果这对公司的描述是准确的，公司应将网络安全风险视为风险因素之一。`SEC`\
  \ 了一了一系列可能增加公司风险的因素：\n\n- 之前发生过的网络安全事件，包括其严重程度和频率；\n- 网络安全事件发生的概率及潜在影响；\n- 为降低网络安全风险而采取的预防措施的充分性以及相关成本，包括在适当情况下，讨论公司防止或缓解某些网络安全风险能力的局限性；\n\
  - 公司业务和运营中产生重大网络安全风险的方面，以及此类风险的潜在成本和后果，包括行业特定的特定风险以及第三方供应商和服务提供商风险；\n- 维护网络安全保护相关的成本，包括（如果适用）与网络安全事件相关的保险范围或向服务提供商的付款；\n\
  - 声誉损害的可能；\n- 现有的或待决的法律法规可能影响公司须遵守的网络安全相关要求以及公司相关的成本；以及\n- 与网络安全事件相关的诉讼、监管调查和修复成本。\n\
  \n在履行披露义务时，公司可能需要披露之前或正在发生的网络安全事件或其他过去的事件，以便为这些风险的讨论提供适当背景。\n\n网络安全风险还可能在管理层对财务状况和经营结果分析中发挥作用。披露法规要求，如果网络安全实质性地影响了公司的“产品、服务、与客户或供应商的关系或竞争状况”，则管理的讨论与分析必须涵盖网络安全。法规还要求披露“网络安全事件的成本和其他后果，以及潜在网络安全事件的风险”。此外，如果安全合规成本和安全事件成本对财务报表具有实质性影响，公司必须讨论与这些成本相关的财务负担。\n\
  \n308\n\n最后，`SEC` 注意，提供实质、准确信息的义务也包括纠正任何之前不准确信息的义务。`SEC` 表示，安全事件通常需要很长时间的调查，而且随着调查的进行，许多事件的范围被发现正在扩大。因此，如果公司实质性地误述了情况，则负有持续纠正早期陈述的义务，即使公司在当时披露信息时采取的行为是合理的。披露网络安全风险和安全事件的义务是一项持续性义务。\n\
  \n### 3. 内幕交易的挑战\n\n另一个重要的额外考虑因素是，人员、董事和其他内部人员禁止进行内幕交易，即利用重大非公开信息交易其公司的证券以获取利润或避免亏损。`SEC`\
  \ 已表示，对网络安全事件或其他安全事件重大风险的知情可能成为指控内幕交易的依据。`SEC` 解释道：\n\n上市公司应建立政策和程序，以(1) 防止董事、人员和其他公司内部人员利用公司发现网络安全事件到公开披露该事件之间的时间差，利用有关事件的重大非公开信息进行交易；(2)\
  \ 帮助公司及时披露任何相关的重大非公开信息。\n\n`SEC` 注意，公司在发生网络安全事件期间应有相关声明和程序来识别内幕交易的风险。它鼓励公司采取 309\
  \ 预防措施，以避免实际的内幕交易并避免产生内幕交易的表象。随着上市公司意识到这些步骤的必要性，网络安全事件期间不当交易的风险可以降低。\n\n当高管人员获知网络安全事件时，避免内幕交易可能非常挑战，因为某些安全事件需要很长时间的调查，而且随着取证证据帮助描绘更完整的入侵蓝图，信息往往会发生变化。公司通常会公开宣布发生了规模中等的泄露，但未披露最敏感的信息。在调查期间，证据变得更加清晰，表明事件范围更大，且访问信息的性质也要敏感得多。如果公司内部人员在首次公告之后、最终披露之前进行股票交易，那么确实存在内幕交易的表象。如果公司内部人员利用有关调查的信息进行交易，那么就构成了实际内幕交易，这根据州和联邦证券法是非是非法的。\n\
  \n### D. 2002 年萨班斯-奥克斯利法案\n\n`SEC` 对上市公司加强数据隐私和网络安全保护的补充可以在 2002 年的《萨班斯-奥克斯利法案》（`SOX`）中找到，该法是在涉及上市公司的大规模会计丑闻后通过的。`SOX`\
  \ 的原始目标是停止会计信息的滥用，特别是当应用于上市公司所提供的文件时。因此，`SOX` 既适用于上市公司，也适用于会计师。该法律的影响更大。由于其对会计师的强制要求，该法律影响了会计业的普遍做法，310\
  \ 这随后重塑了经济中其他所有领域的业务实践。\n\n尽管制定 `SOX` 是为了防止财务篡改，但该法律的编写基于这样理解：财务记录只是数据的另一种形式。所有数据都必须保护免受篡改、破坏或操纵。因此，尽管\
  \ `SOX` 没有明文的隐私部分，但它已成为一项重要的安全监管条例。因为它涵盖了所有上市公司，为 `SEC` 提供了有力的监管依据，要求所有报告和数据信息系统必须稳健，以保护所有信息免受安全事件的影响。\n\
  \n`SOX` 要求所有上市公司向 `SEC` 报告其内部会计控制的实施情况。这些内部会计控制包含了对公司收集的所有财务和其他信息的保护，以确保对公司使用的信息受到任何篡改、操纵、干扰或破坏的充分保护。尽管\
  \ 2002 年的法律没有使用《安全规则》或其他近期立法中相同的语言来描述未经授权的访问，但其要求的内部会计控制提供了针对内部和外部滥用或威胁的相同类型的安全义务。\n\
  \n\n\n\n# SOX 通过两个主要条款实施了其针对网络安全的审计控制要求。第一个是关于“管理层对内部控制的评估”的第 404 节。内部控制被描述为“金融机构为了降低风险并确保其达到运营、报告和合规目标而建立的政策和程序”，这些在本质上是\
  \ `HIPAA 隐私规则` 以及其他监管体制下要求的行政程序。\n\n联邦存款保险公司（`FDIC`）开发了一份全面的内部惯例与控制指南。正如 `FDIC`\
  \ 所解释的那样，“内部控制计划的设计应确保组织能够有效运行、保护资产、产生可靠的财务记录并遵守适用的法律法规。”`FDIC` 将内部控制分为五个要素：\n\n\
  - 控制环境\n- 风险评估\n- 控制活动\n- 信息与通信\n- 监控\n\n尽管这些程序最初的初衷是降低金融机构和上市公司的欺诈风险，但减少欺诈和盗窃的同样努力也适用于减少隐私侵入、黑客攻击、数据未经授权的使用以及其他网络安全事件。\n\
  \n311\n\n根据`第 404 节`，上市公司必须提供作为公司年度财务报告的一部分的`内部控制报告`。公司必须拥有“充分”的内部控制结构，以保护公司免受可预见的内部和外部风险。`充分`一词不应被视为低标准。与\
  \ `HIPAA` 和 `GLBA` 类似，`SOX` 要求建立了全面的义务，以提供足够的行政、技术和物理安全，以确保受保护的信息安全。此外，公司管理必须在年度报告中描述其运营情况，并报告公司采用保护措施和系统的任何问题或缺陷。\n\
  \n312\n\n此外，作为公司外部审计师的公共会计师必须对公司管理关于内部会计控制已建立、运行且有效的陈述提供认证或证明。尽管主要重点是财务系统，但所有相关的网络安全问题也涵盖在内。审计师将要求所有信息（包括网络安全风险和事件的披露），以提供其全面的审计和报告。\n\
  \n第二个 `SOX` 条款是`第 302 节`，关于“公司对财务报告的责任”。为了确保上市公司履行其具备适当安全的义务，法律要求公司的首席执行官（`CEO`）和首席财务官（`CFO`）证明公司提交给\
  \ `SEC` 的所有记录都是完整且准确的。\n\n未能履行公司义务将惩罚，包括罚款、失去在公共股票交易所上市的权利或董事和人员（`D&O`）保险单的失效。`CEO`\
  \ 或 `CFO` 未提交准确信息还可能导致直接的个人责任。故意违反该法的行为可能导致高达 500 万美元的罚款和最高 20 年的监禁。\n\n通过 `SOX`\
  \ 的义务，上市公司和公共会计师事务所为加强数据隐私和网络安全监管提供了另一个重要领域。通过 `SOX` 和证券法进行的 `SEC` 监管有助于扩大监管保护的伞，使得几乎任何重要规模的公司都有根据一项或多项法律义务提供某种程度的数据保护和网络安全。\n\
  \n## 本章核心要点\n\n金融行业是监管最严格的行业之一，也是最早实现广泛数据隐私 313 保护的行业之一。随着过去十年对网络安全的担忧增加，许多联邦机构扩大了监管义务，以提供稳健的网络安全，并增加公司在网络安全问题上的透明度。\n\
  \n`GLBA` 仅提供了有限的消费者保护，因为它是一项退出制（opt-out）隐私法规，对于出于非营销目的使用客户数据有许多豁免。对于银行、储蓄协会和信用合作社核心集团之外的金融机构，州隐私法将不会被抢占，这些法律通常会提供更稳健的消费者隐私保护。\n\
  \n除了 `GLBA` 之外，`FCRA` 就报告信息的使用以及消费者获取、监控和纠正其信用报告的能力提供了重要的消费者隐私保护。这些努力改进了对普通公众的保护。\n\
  \n`GLBA 安全措施规则（Safeguards Rule）` 与 `隐私规则` 形成了鲜明对比。`安全措施规则`强制金融机构承担重大的数据安全义务。联邦对金融机构数据安全的监管方法已强制这些公司进行非常重大的安全改进。\n\
  \n此外，联邦证券法下的法规还增加了改进数据安全的义务，以及坦诚及时地报告数据泄露等重大事件的义务。这些法规改进了金融服务业的整体数据安全状况，同时凸显了在维护数据完整性和保护方面面临的持续挑战。\n\
  \n## 知事项\n\n联邦金融监管的性质主要关注于稳定性和准确性，而不是消费者保护。`SOX` 的制定是为了确保内部人员或 314 第三方的欺诈活动被及早发现，防止其扩大到足以破坏公司的程度。改进审计和检测欺诈的保护措施也涵盖了检测数据泄露所需的步骤。`SOX`\
  \ 和 `GLBA` 是在数据泄露事件成为重大业务风险之前实施的，但这些法律授权的法规已使联邦监管机构能够在防止金融欺诈的更广泛努力中，帮助改进数据安全。\n\n\
  每种银行模式都采用与医疗模式类似的方法，要求公司拥有适当的行政、技术和物理保护措施，以保护存储和使用的数据。这些法规允许特定策略与企业的规模和复杂性相适应，同时要求创建并遵循适当数据安全策略的所有组件。\n\
  \n## 思考题\n\n如第 2 章所述，第三方原则允许政府使用传票而非搜查令审查银行记录。相比之下，银法要求金融机构和上市公司采取强有力的措施，保护其收集的客户信息免受滥用。考虑到国会对财务记录建立的合理预期，第三方原则是否仍然合理？\n\
  \n许多财务隐私法规是基于旨在提高银行体系诚信和加强问责制的法律。国会赋予监管机构多大的裁量权来根据相关目的演变法规？国会应对通过法规做出的变化承担更多责任吗？\n\
  \n315\n\n`GDPR`、`CCPA` 和 `SHIELD Act` 对美国业务大部分部分的采用，可能将消费者隐私监管从部门方法转向了更通用的方法，但由于这些法律彼此都不同，并影响不同的公司。消费者隐私监管的下一个阶段是什么？是扩大部门隐私隐私方法，还是扩大更通用的消费者保护方法？\n\
  \n317\n\n\n\n\n\n![clocky\\_bw\\_Chap.tif](img/Image_13.jpg)\n\n# 第 11 章：关于隐私的最后思考\n\
  \n尽管这本书是一本关于隐私和网络安全的简短且轻松的指南，但它引入了令人目花乱的概念、法律、法规、政策和实践。尽管如此，仍有一些重要的共性主题，可以帮助政府、企业和个人应对美国及全球隐私政策的快速变化。\n\
  \n## A. 回到大局\n\n隐私概念自古以来一直是西方法律和文化的一部分。萨缪埃尔·沃伦（Samuel Warren）和路易斯·布兰迪斯（Louis Brandeis）在他们\
  \ 1890 年的法律评论文章《隐私权》中勤勤工作，确立了隐私权并非新事物，只是在使用不同的标签进行执行而已。他们引用了托马斯·库里利（Thomas Cooley）法官编写的权威侵权法教程，指出：“个人的权利可以被视为一种完全豁免的权利：即不受打扰。”\n\
  \n在宪法层面，隐私权是第一修正案对言论、宗教和结社保护的重要组成部分；第四修正案对任意搜查和没收的保护；第五修正案关于反对自证其罪的权利；以及第九修正案对人民权利的保留。隐私是个人在对婚姻选择、性行为和崇拜方式方面所拥有的决策自主权的基础。\n\
  \n### 政府限制\n\n尽管隐私具有基本性质，但立法机构和法院对这项权利的态度参差不齐。例如，在政府方面，宪法对政府的保护往往面临民选和任命官员的挑战，因为这些官员不希望自己的权力受到限制。这并非出于恶意。这些民选官员和政府员工想要履行他们的职业职责。执法部门希望收集逮捕和定罪罪犯所需的信息。即使法律（laws）代表了良好的公共政策，宪法限制和成文法局限性也让执法人员的工作变得更加困难。搜令要求保护了社会免受权力滥用，但很少有个人官员认为，如果赋予他们行使自主判断的能力，他们会滥用权力。\n\
  \n在法院未承认宪法保护的情况下，国会和州立法机构介入，对使用侵入性技术监控刑事案件中的嫌疑人实施了限制。窃听法案和限制录制私人对话的法律相继通过，以限制政府窃听嫌疑人的能力。最高法院认定，现代智能手机在搜查目的上已成为\
  \ 21 世纪等同于家庭的场所，需要获得合理理由支持的搜查。\n\n### 普通法与部门化隐私\n\n最初对扩大隐私法的犹豫，也有助于解释美国在整个 20 世纪所采用的部门化隐私方法。最早的执行隐私权的案例是那些被归类为公开权（rights\
  \ of publicity）的案件。要求企业为利用个人的隐私权或公开权而付费，是要求公司为利用个人的劳动力或知识产权付费的简单延伸。在又过了一个世纪以后，公共政策才开始将有关个人、消费者的信息价值视为一种独立且有价值的商品。\n\
  \n今天，我们意识到公司通过利用客户的私有信息获得了巨大的经济利益。尽管如此，尚未有重大努力将这些经济利益从公司转移给个人。最近的法律开始赋予客户拒绝让其隐私信息商业化的权利，但法律尚未对这种利用（exploitation）提出财产权或补偿模型建议。\n\
  \n（注：原文此处存在多处重复段落，已按要求整合。）\n\n今天，我们意识到公司通过利用客户的私有信息获得了巨大的经济利益。尽管如此，尚未有重大努力将这些经济利益从公司转移给个人。最近的法律开始赋予客户拒绝让其隐私信息商业化的权利，但法律尚未对这种利用提出财产权或补偿模型建议。\n\
  \n今天，我们意识到公司通过利用客户的私有信息获得了巨大的经济利益。尽管如此，尚未有重大努力将这些经济利益从公司转移给个人。最近的法律开始赋予客户拒绝让其隐私信息商业化的权利，但法律尚未对这种利用提出财产权或补偿模型建议。\n\
  \n（此处重复段落已略，仅保留核心信息以确保完整性。）\n\n\n\n\n\n- 仅做出公司能够做到的承诺。某些信息共享是业务控制之外的，因此不要过度承诺公司限制私有信息披露的能力。\n\
  - 避免收集不使用的信息。公司应对其收集的所有个人信息的数据安全负责，包括来自第三人的信息，也包括业务内部的滥用。如果不收集信息，它们就不会被丢失、被盗或被滥用。\n\
  - 建立适当的行政、技术和物理数据安全系统。每项业务使用的数据安全措施必须与公司规模相适应，但所有公司都需要物理安全、适当的政策、培训、审计和评估。至少，这包括始终安装安全更新，并计划对关键软件工具进行更新和升级。\n\
  - 为员工提供作为消费者的权利以及作为员工的保护。为员工提供的法律保护是对所有消费者所享保护的补充。即使是最小的公司也需要一份清晰的书面员工手册，并遵循它。\n\
  - 与 PCI 安全标准紧密合作，关注所有安全更新。小企业经常是信用卡支付系统的攻击目标。保持支付终端和其他支付系统的最新状态，将显著降低被盗窃和损失的风险。\n\
  - 仔细管理供应商和承包商。小企业依靠与服务提供商的合同来维持竞争力。但这些合同带来了隐私和安全风险。公司在选择业务伙伴时必须尽职尽，并关注这些关系中的合同条款。\n\
  - 不要实施任何你不想看到出现在当地报纸头条上的政策。对小企业的最佳建议是将其业务模式和客户视为一个紧密相连的社区。如果某项做法一旦公开会让所有者感到羞愧，那么所有者应该选择其他方法。小企业是美国的财务和社会支柱，因此企业所有者在采纳和实施政策时应始终感到自豪。\n\
  \n这八条规则为公司保护业务客户的隐私、维护客户与公司之间的信任，以及最大限地减少数据泄露或其他法律责任提供了实用的策略。虽然没有无一失的，但这些规则建立了一种可以最大限度降低风险的方法。下面将对其中每一项进行讨论。\n\
  \n### 1. 隐私实践保持透明\n\n有些公司不从客户处收集个人信息。他们以纯现金方式运营，记录很少。其他公司则调查每个客户的画像，根据客户此前通过公司的购买记录以及从第三方向收集的信息来量定制特定的建议。大多数公司处于这两者之间。公司网站跟踪用于寻找落地页的广告，并使用追踪器了解每个客户对网站的使用情况。实体店使用摄像头观察店内移动。\n\
  \n在信息被收集并识别到个人消费者的范围内，公司应将其包含在公布的隐私政策中。大多数客户很少看这些披露，因此公司即使包含过多的信息也极少遇到麻烦。另一方面，如果发生问题，且公司没有披露其收集了随后被盗的数据，可能会导致许多负面后果。\n\
  \n这还需要公司了解其技术的工作原理。公司可能会聘请第三方服务提供商作为网站主机。网站主机可能会为了自身使用收集公司并未利用的数据，但由于这家小企业的存在，客户的个人信息仍在被收集和出售。\n\
  \n公司还必须实施“请追踪”（do-not-track）技术，并向客户画像，至少在法律要求这些额外步骤的地方。\n\n### 2. 仅做出公司能够做到的承诺\n\
  \n有些公司尝试发布非常简单的隐私声明：“我们从不披露您的个人信息。”但这种说法可能是假的，因为政府在某些刑事案件中拥有信息权，公司在民事诉讼中可能面临传票，并可能出现其他监管要求。公司还可能将客户信息共享给其服务提供商、云存储公司、在线购物车服务以及其他小企业能够在在线上有效运行的供应商。此外，公司通常会随着业务的发展而改变其营销策略。\n\
  \n公司必须确保其对信息使用所做出的任何承诺，与其公司的供应商和合作伙伴访问及使用信息的方式保持一致。收集的信息类型也可能根据合作性质的不同而显著变化。对于在\
  \ Facebook、Instagram、Twitter 或其他在线服务上活跃的公司，该在线服务公司将有其自己的隐私政策以及与客户的关系。隐私政策中的声明应当认识到，公司通过社交媒体收集的信息也将受到社交媒体网站政策的约束。\n\
  \n结果，大多数公司收集和共享的信息远比他们想象的要多。了解哪些正在被收集和共享非常重要。一旦公司知道自己拥有哪些信息，就可以对这些信息的使用做出合理的承诺。\n\
  \n### 3. 避免收集不使用的信息\n\n准确的数据对决策非常有帮助。消费者模式和偏好、口味和态度的变化、人口统计学变迁、定价信息以及许多其他信息，都可以通过对业务的某些数据点的管理中获得。当信息对业务决策重要时，公司应努力保持信息的实时和准确。\n\
  \n相比之下，公司有能力收集大量对决策没有帮助信息。这对于客户的个人身份信息来说尤为如此。\n\n小企业避免客户信息法律责任的最好方法是避免收集客户的个人信息。许多企业通过尽力减少收集的客户信息，并将所有追踪信息与个人身份信息分开，做得非常好。除非收集某些类型的信息有现有的业务目的，否则不要收集这些信息。\n\
  \n一旦收集了数据，就必须进行存储、维护和更新。收集信息需要人力成本和技术成本。当跟踪某种特定类型的信息出现业务案例时，那么这些数据就应该被跟踪。但仅仅抱着“某一天可能有业务用途”的想法来收集数据是非常不足的。\n\
  \n消费者数据很快就会老化。电子邮件和地址会变，客户会变老，产品线会演变，可以学习的信息变得不再准确。收集数据的公司经常发现，他们正在根据过时信息或由于数据老化而产生误导性的信息来做决策。\n\
  \n### 4. 建立适当的行政、技术和物理数据安全系统\n\n\n\n\n每家企业都必须开发并采用适当的安全措施来保护公司。对于许多小型企业来说，它们通过一台台式电脑或单一\
  \ `server` 运行所有业务。核心业务计算机的丢失意味着所有订单、库存跟踪、客户列表和人事记录的丢失。如果它在没有备份的情况下崩溃或被恶意软件感染，核心业务计算机的丢失将成为所有业务运营的故障点。无论公司是运行在单台电脑上运行在复杂的云基础设施中，公司都必须管理其基础设施，以消除单点故障导致业务中断的可能性。\n\
  \n## 物理安全措施\n物理安全措施必须包括锁定的打印文件和/或关键文档的加密存储；对敏感文件的控制和限制访问；对所有计算机记录进行定期备份并测试以确保能够正常恢复；以及对信息进行物理保护，以确保商业秘密、客户列表、供应商列表和其他关键信息不会被未经授权的员工或第三方复制。随着公司变得越来越大和复杂，必须对存储的信息采取额外的物理安全措施，但锁定的文件和稳健、有效的备份是所有企业的起点。\n\
  \n## 技术措施\n技术措施至少包括使用防火墙、加密和强密码来避免简单的攻击。不应向所有员工开放各种计算机系统的访问权限。相反，每位员工只能访问与其工作职责相关的计算机、程序和网络。管理权限应受到更仔细的限制。对于规模稍大的组织，网络应该进行隔离，使面向公众的系统永远无法用于破解公司、财务、运营、员工或客户数据。\n\
  \n随着公司业务范围的扩大，应该对技术措施进行定期审计和评估，以改进数据流的跟踪、信息的控制以及对定期软件更新和补丁的遵守情况。公司绝不能让软件过时。在面对投资新软件和硬件工具的财务挑战时，公司应始终选择保持最新状态或停止使用特定工具。保留过时软件和硬件的选择将引入黑客、恶意软件和业务中断。\n\
  \n## 行政安全措施\n行政安全措施同样关重要。如果一家公司有员工，就必须有用佣政策。如前面的章节所述，雇主可以建立公司对计算机系统的所有权，并披露其如何监控员工以确保遵守州法律和联邦法律、最大限度地减少盗窃并提高客户满意度。计算机使用政策和工作场所监控政策还包括病假、健康与安全、福利以及针对员工的其他重要政策。必须定期对员工进行每项物理和技术措施的培训和更新，以确保密码和验证步骤保持安全，并遵循良好的数据卫生。\n\
  \n行政安全措施还包括关于如何维护数据安全的政策。公司内部应指定专人主要负责所有隐私和数据安全问题，即使该人员还负责业务运营的许多其他方面。对于较大的公司，该职位将成为一份全职工作，但对于小型公司，它仍应强调为指定员工职责中的优先等事项。\n\
  \n行政政策应详细说明所有者或关键管理人员如何对隐私和数据安全负责。如果公司足够大，拥有定期开会的董事会，那么董事会应该定期接收隐私和数据安全措施的更新。行政程序应包括对所有员工的培训，让他们如何识别入侵计算机系统的尝试，包括来自钓鱼、恶意软件和弱密码的威胁。\n\
  \n技术措施的成本和规模根据业务运营和公司规模发生巨大变化。随着公司的增长和演变，它们必须定期更新安全措施，以满足业务当前的需求以及不断变化的威胁性质。\n\n\
  ## 5. 为员工提供其消费者权利和员工保护\n员工拥有客户的所有权利和作为员工的保护。小型雇主非常依赖他们的关键员工。客户根据与员工的最后互动来判断一家企业。如果员工忠于雇主，他们通常会为客户额外努力。对员工的强力业务支持结合培训和以客户为中心的业务模式，通常会转化为高质量的客户和服务高客户满意度。虽然这种良性循环似乎显而易见，但企业在员工工作条件方面做出错误选择的情况非常普遍。\n\
  \n即使是最小的公司也需要清晰的纸面员工手册并遵循它。除了员工在 `FCRA` 等法律下受保护外，雇主可以通过将保护员工记录作为优先事项并最大限度地减少向未经授权人员披露员工信息来提高员工满意度。至少，公司应将员工记录与其他业务记录分开。员工记录可能包含需要额外安全的保护健康信息。\n\
  \n员工手册和其他文档应明确政策适用于全职和兼职员工。如果某些规定对兼职员工和全职员工适用情况不同，则应清晰解释这些差异。\n\n员工手册不适用于独立承包商，因为他们不是员工。在招聘所有独立承包商时，应包含一份与数据隐私和使用公司计算机系统相关的合同附件。\n\
  \n## 6. 与 PCI 安全紧密合作，跟进所有安全更新\n大多数小型企业通过现场和信用卡和其他支付系统在线收取资金来运营。虽然还有少数仅接受支票的办公室，但这些办公室越来越稀少，且是客户忽视现金的证明。与此同时，支付系统是小偷的焦点，因为它们是从公司偷取金钱最直接的机会。\n\
  \n`PCI` 银行联盟开发了 `PCI DSS`，作为一种金融交易数据安全合规的业务友好工具。接受信用卡的公司必须遵守 `PCI DSS`。尽管如此，公司有时会购买旧设备或跳过强制更新。这些削减成本的可能会使整个业务面临风险。公司应勤于保持\
  \ `PCI DSS` 的最新状态。\n\n\n\n\n任何企业都不是孤立的岛。公司通常会租赁物业、外包清洁服务、利用服务提供商进行网站、云存储、计算机处理、通过银行进行金融交易，并聘佣独立承包商。产品供应链可能包括数十家负责制造、组装和运输的公司。这些供应商和承包商中的每一个都是业务伙伴，也是数据泄露风险的潜在来源。这些风险源于三种普遍的不安全因素：供应商软件卫生状况不佳、共享数据访问策略策略的不一致，以及对受保护的私有信息的滥用。\n\
  \n### 供应商卫生状况不佳\n\n黑客经常通过外部合同寻找进入网络受保护系统的后门。例如，2013 年 Target 公司的数据泄露事件是由一家暖空调供应商触发的，该供应商被黑客用作跳板，向\
  \ Target 系统中安装了恶意软件。计算机顾问经常需要调整防火墙以进行审计或其他活动，结果导致了系统被攻破。公司需要非常严谨，以确保在供应商完成工作后系统仍然保持安全。\n\
  \n与任何需要访问业务网络的供应商签订的合同时，应包含保证条款，规定该供应商已符合与其安全相关的当前州和联邦法规，其不知其系统存在任何正在进行的数据安全事件，并且其将对因访问公司系统而直接导致的任何数据损失向公司提供赔偿。\n\
  \n诚然，这些并不一定是所有供应商都愿意签署的合同条款，但它们凸显了让公司进入小型企业计算机系统的风险。此类安排应谨慎进行，并且仅与具有良好行业声誉的供应商合作。\n\
  \n### 隐私保护政策不一致\n\n当小型企业向在线服务提供商注册以托管其网站、提供购物车工具并管理其在线形象时，小型企业即同意了该协议的条款和条件，包括在线主机的隐私政策。在线主机的隐私政策在不同公司之间可能存在巨大差异。如果小型企业为其客户提供无追踪的客户体验，只有当在线主机也承诺在不进行任何客户跟踪的情况下运营时，才能履行这一承诺。\n\
  \n小型企业网站的每一位访问者也是在线托管服务网站的访问者。无论小型企业是否利用软件内置的数据跟踪，在线服务提供商都可能跟踪 IP 地址、在多个站点之间的移动、与广告服务提供商的互动以及许多其他交互。小型企业提供的隐私保护无法超过其与在线服务提供商约定的范围。\n\
  \n大多数银行不会通过销售点设备跟踪其业务客户。然而，其他金融交易中介不受法律限制。这些公司也可能收集有关交易的信息。与在线服务提供商一样，与金融中介的合同必须经过仔细审查，以了解交易期间使用了哪些数据。\n\
  \n### 受保护的私有信息的滥用\n\n除了与大型供应商签订标准化服务的小型企业面临的挑战外，许多小型企业还依赖独立承包商和所谓的“零工人员”来提供灵活的人力。独立承包商可能被聘佣负责特定项目，例如创建公司艺术作品和标志的平面艺术家，或者他们可能是更新网站、设计产品或以以固定价格与公司合作的临时工。由于他们不是正式员工，员工手册中的契约条款并不适用于独立承包商。\n\
  \n尽管应该有一份针对独立承包商的合同补充协议来限制他们对机密信息和私有信息的使用，但此类协议并不常见。此外，针对独立承包商执行限制性合同条款的能力非常困难。在可能范围内，公司应避免让独立承包商接触机密信息或受保护的客户信息。\n\
  \n滥用信息的风险也存在于员工和大型供应商，但公司有许多追索途径来处理员工滥用信息的情况，并有对大型供应商提起违约诉讼的能力。\n\n### 8. 不要实施任何你不想看到出现在当地报纸头条上的政策\n\
  \n最后这条规则是对所有业务实践的通用的明智建议。数据隐私和网络安全是非常复杂的法律和商业领域。精明的律师和老练的运营者可以通过言不一来利用公众。如果一种方法显得过于“聪明”，那么它很可能确实，并且应该被避免。企业主应该问自己是否对公司实施的每项政策感到自豪，如果某项政策会令人羞愧，那么公司应该采取不同的策略。\n\
  \n\n\n\n消费者对隐私的态度因人而异，也因情况而异。作为一名经常购物的消费者，人们可能会欣赏零售商了解他们偏好哪些产品和品牌，并感谢通过追踪和行为广告提供的客户服务。同一个人也可能觉得，一家很少访问的公司所使用的行为广告令人毛骨悚然，仿佛该公司正在通过在多个网站上投放广告来跟踪客户。这两种都属于行为广告的例子，即广告是由消费者的在线行为触发的，但在第一个例子中，将广告与客户行为挂钩的公司是受到赞赏的；而在第二个例子中，该公司的广告是不受欢迎的。\n\
  \n健康信息是另一个典型的例子。大多数人认可 `HIPAA` 建立的强力健康隐私保护。他们不希望医生分享有关其病史的任何信息，也不希望雇主或保险公司根据医疗档案做出不利决定。与此同时，数百万个人参与了社交媒体网站和针对各种疾病及状况的支持小组，通过与其他分享个人故事和医疗挑战来寻求支持。\n\
  \n这两个例子都说明隐私既是个人的，又具有情境性。在一种情境下适合分享的内容，在另一种情境下可能觉得并不合适。因此，任何关于个人隐私的指导在某些情况下可能是有效的，但在其他情况下可能并无处。尽管如此，有一些基本的考虑可能会被证明是有用的。\n\
  \n*   **优先考虑隐私最重要的地方。** 有些人最担心政府监控，而另一些人更担心雇主获取个人信息，或企业广告商对个人信息的使用。虽然良好的隐私实践可以减少受到多个领域监控的风险，但某些选择比其他选择更容易追踪。\n\
  *   **根据你自己的隐私顾虑程度选择供应商和技术。** 隐私保护是智能手机、网络浏览器、支付提供商和通信应用的功能。对于优先考虑隐私的消费者，他们应该在那些将在线匿名和隐私保护放在首位的供应商中进行选择。在许多情况下，公司会提供基于广告的版本和一个价格更贵、但没有广告和数据跟踪的版本。同样，消费者有权为额外的隐私付费。如果一个应用程序请求的智能手机访问权限超过了提供服务所需的范围，请卸载该应用。\n\
  *   **确保实施可用的隐私保护。** 许多产品、网站和应用程序都有可以增加用户隐私的隐私设置，但这些设置通常不是默认开启。每个用户必须花费额外的时间和精力来开启这些设置。\n\
  *   **阅读隐私政策或隐私政策的分析。** 大多数隐私政策都是冗长、复杂且模糊的。对于热门产品和服务，通常会有关于隐私政策和设置的发布评论，帮助快速理解政策中的用语。消费者应该阅读政策或阅读评论，以了解他们从每个产品和服务中获得了什么。\n\
  *   **隐私保护可能会被破解，因此只分享可以公开的内容。** 虽然在线医疗、教育和金融交易日益变得至关重要，但大多数在线发布的信息是作为社交媒体或其他参与形式的一部分。由于即使是最勤恳的公司也经历过数据泄露（而且很少有公司那样勤恳），公众应该假设任何电子形式发布或分享的内容都可能公开。亲密照片和详细的个人细节在未经授权广泛传播会造成巨大的伤害。保证照片不被分享的唯一方法就是不要拍这张照片。\n\
  *   **假设个人简介会被雇主筛选。** 大多数雇主会查看应聘候选人的公开社交媒体资料，且许多候选人与已经在潜在雇主处工作的人是在线好友。因此，公开信息以及通常的许多非公开信息都可能被雇主获取。候选人应该假设雇主正在检查潜在员工的行为是否符合理想的企业文化。饮酒或吸毒的照片，以及违反保密协议或诋低其他雇主的言论将使候选人获得新职位变得更加困难。越来越多的高中生和大学生同时维护一个真实的假名社交媒体身份和一个经过针对祖父母和雇主审核的整洁公开身份，以管理社交媒体上不受欢迎的窥视者。\n\
  *   **警惕钓鱼和其他攻击。** 无论是在家里还是工作场所，人们都充斥着欺诈内容。除非发送者已知，否则避免点击邮件中的链接。如果银行或其他公司发送了信息，请直接登录，而不是点击邮件中的链接。如果朋友或同事发送的邮件看起来很奇怪，人在点击链接或分享信息之前，应该始终验证邮件的真实性。\n\
  *   **留意家里和工作中的未经授权访问。** 对于大多数人来说，他们爱和信任的朋友家人是他们主要的支持和保护来源。然而，有太多的人成为欺诈、暴力和虐用的受害者。任何对家庭成员或亲近朋友的可信度产生哪怕一丝疑虑的人都应该小心保护密码，确保计算机和设备安全，并采取与企业类似的步骤，确保没有人能进入他们的账户。许多身份窃用、欺诈和虐性帖的案例是因为攻击者访问了受害者的计算机和手机。\n\
  *   **使用良好的数据卫生。** 个人数据卫生包括使用强密码；永不共享密码；加密数据；避免不可信的网站；在出售或处理任何设备前删除所有数据；不使用公共网络处理敏感信息；以及限制社会安全号码、驾照号码和账号的披露。良好的数据卫生包括物理和电子两，因此钱包或手提包里的信息也应该经过筛选，以避免携带社会安全卡。\n\
  \n对每个人来说，某些建议可能比其他建议更重要。这些建议的目标是赋予每个人权力，让他们控制自己想要在多大程度上保持隐私或公开。\n\n### D. 未来展望\n\
  \n隐私法律在过去五年里发生了巨大的变化，而且这种变化可能会持续。随着美国以外的政府要求更高水平的隐私和安全保护，各州也可能继续提出同样的要求。`GDPR` 的引入本应增加消费者隐私和消费者对其数据的控制。相反，它导致了一系列令人讨厌的弹出消息来披露\
  \ Cookie，但在公司行为或消费者控制方面没有提供什么实质性的改变。`GDPR` 无法对美国公众产生影响，使得法规在消费者隐私方面产生差异变得更加困难。\n\
  \n\n\n\n再向远处看一点，人工智能工具的扩张以及数据分析获取途径的扩大可能会显著加剧隐私挑战。政府监控和行为广告都依赖于监控对象与追踪行为的机会之间的互动。随着人工智能效率的不断提高，该技术在追踪个人使用在线服务和在离线世界运行方面的能力将不断扩大。今天，所有的在线媒体消费都可以被监控，并用于推断社会和经济特征、个人品味和行为。技术的微小改进将允许媒体在生产时就针对每位个人消费者进行个性化和编辑。行为广告将通过行为性产品植入得到增强。\n\
  \n正如哈尔兰法官（Justice Harlan）所言，第四修正案的基础是基于隐私的合理预期，那么技术的进步很可能会改变公众对“合理”认知。无线电和闪光摄影的发展导致了《隐私权》的法律出版。手机性能的提升导致了宪法保护，限制了警察在没有搜查令的情况下搜索手机的能力。利用人工智能完善人脸和其他生物识别识别，可能会推动法院和立法机构寻找新形式的法律保护。\n\
  \n340\n\n技术将继续让政府、公司和个人追踪和跟踪个人变得更容易。技术也将提供保护消费者免受追踪的工具。这需要更多的时间，但法律法规也将帮助平衡这些利益，因为立法者将从公众那里学习公众认为什么是合理的，并更新法律以反映新兴的共识。\n\
  \n## 本章核心要点\n\n对于企业和个人而言，都有可以遵循的简单步骤来提高隐私和数据安全。隐私并没有一个所谓的“正确”水平。相反，个人和企业都必须就隐私的优先程度做出有意识的决策，然后采取步骤实现该水平的隐私。\n\
  \n小型企业必须在隐私政策的透明度方面付出额外努力。企业需要采用客户能够理解并依赖的政策。公司必须利用适当的安全措施，以确保隐私政策能够抵御黑客攻击、钓鱼、恶意软件和其他攻击。\n\
  \n所有个人也必须对自己的隐私预期做出选择。隐私是消费者选择的产品、服务和体验的一种特性。尽管消费者对自己的信息没有完全控制权，但消费者在塑造他们所受的隐私保护方面发挥着重要作用。\n\
  \n# 需要了解的事\n\n隐私和数据安全紧密相随。正如公司或政府一样，每个人都必须使用良好的数据卫生来保护自己的信息以及他们使用的所有网络上的信息。\n\n\
  341\n\n技术在不断变化，这使得手机、电脑、浏览器和网络设备的选择比以往任何时候都重要。为了隐私最大化，消费者必须坚持要求稳健的隐私设置和强的数据安全。只有当公众将隐私和安全作为所有购买决策的要求时，这些功能才会成为优先事项。\n\
  \n随着态度的转变和新技术的普及，隐私的合理预期将继续演变。隐私的合理预期对商业关系与对政府第四修正案的限制同样重要，因为公众的预期有助于告知商业与客户的关系。\n\
  \n# 需要思考的问题\n\n* 是否有方法可以让隐私政策更简单，并且受技术变化和预期的驱动更小？\n* 一个全面的隐私体系是什么样的？随着规则的改变，哪些方从变化中受益，哪些方在现状下更好？\n\
  * 十年后美国的隐私政策将是什么样，哪些事件将塑造政策的改变？\n\n343\n\n![clocky_bw_CHAP.tif](img/Image_14.jpg)\n\
