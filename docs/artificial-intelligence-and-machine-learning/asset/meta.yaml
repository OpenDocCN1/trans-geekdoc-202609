  - 未来展望
- - '###'
  - 你无法轻易解释 AI 将如何发展，但许多专家在任务开始增加时已经看到了一些迹象，这使得计算机变得更容易处理。在未来的十年里，AI 将能够接管人类每天从事的困难工作和耗时任务。AI
    的影响将主要取决于半人人。机器人操作可能会增加。在普通世界中，你可以想象商店里的 AI 可以根据客户的需求选择播放的音乐。AI 还可以决定人群喜好的壁纸或艺术品。
