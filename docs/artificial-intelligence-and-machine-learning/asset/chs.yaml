- "# 人工智能与机器学习\n\n\n\n\n––––––––\n\n![image](img/scene_break.png)\n\n\n\n\n\n\n\n\n\
  \n\n\n| ![image](img/chapter_title_corner_decoration_left.png) ||  || ![image](img/chapter_title_corner_decoration_right.png)\
  \ |\n| --- | --- | --- |\n\n![image](img/chapter_title_above.png)\n\n# 引言\n\n![image](img/chapter_title_below.png)\n\
  \n随着大数据的世界的兴起，我们被迫制定有效的策略来帮助自己做出明智的。由于寻找从现有数据中提取价值的最有效方法的需求不断，所有专业领域都变得极其复杂。通过下载这本书，你已经迈向学习如何使用大数据以及人工智能如何使应对自然增长的大数据运动成为可能的第一步。你在后续章节中发现的信息非常，因为它将帮助你学习人工智能如何影响人类行为及其在未来可能产生的影响。\n\
  \n为此，本书对人工智能和机器学习进行了深度概述，强调了它们历史性的发展以及在金融、商业和医学等各个领域的应用。它涵盖了人工智能如何与人类智能交互，包括人机之间可能的伙伴关系，以及它们如何相互影响。人们可以充分利用人工智能和机器学习来改善生活并提高生产力。此书中涵盖的一个有趣概念是全球范围内的\
  \ AI 超能力，以及它们如何影响今天可能影响未来人工智能的发展。这些包括 `Uber` 的 `Amit Singhal`、百度的 `Andrew Ng`、`SpaceX`\
  \ 和 `Tesla` 的 `Elon Musk` 等。\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
  \ ||  || ![image](img/chapter_title_corner_decoration_right.png) |\n| --- | ---\
  \ | --- |\n\n# 第一章：理解人工智能\n\n![image](img/chapter_title_below.png)\n\n“目前为止，人工智能最大的危险在于人们过早地认为他们理解了它。”\n\
  \n![sense-2326348\\_640.jpg](img/image002.jpg)\n\n`Eliezer Yudkowsky`\n\n可能无法识别现代社会的哪些部分没有受到人工智能（`AI`）的影响或影响。智能机器正在影响我们生活的几乎每一个方面，包括业务运营和我们的日常活动，旨在提高效率。`AI`\
  \ 是第四次工业革命颠覆性变化的主要影响者；这些变化可能会挑战人类的思想。它正在以加速的方式改变我们互动和生活的方式，使我们的城市变得更加，并帮助我们管理生活。\n\
  \n## 定义人工智能和机器学习\n\n按照通常定义，人工智能是机器以类似于人类的方式做出决策和学习的能力。它通常被认为是计算机科学的一个分支，处理计算机智能的行为模拟。人工智能通常缩写为\
  \ `AI`，是指能够完成通常需要人类智能的任务的计算机系统，包括语音识别、视觉感知、决策制定和语言翻译。\n\n机器学习是人工智能的一个子分支，即所有机器学习都是\
  \ `AI` 的组成部分，但并非所有的 `AI` 都被视为后者。它指的是计算机科学的一个部分，其目标是构建和利用现有算法，以建立提供模式和准确预测的通用模型。此类算法通常基于数学和统计优化。假设你的目标是使用历史数据识别某种现象的模式；你可能使用机器学习算法对数据进行分组并分析聚类结果。通过一些分析，机器学习有助于随着时间的推移生成自动的聚类或类别。\n\
  \n\n\n\n\n尽管人工智能和机器学习已经存在了几个世纪，但它们直到 20 世纪 50 年代后期才得以实现。一系列哲学家、科学家和数学家试图探索 `AI`\
  \ 的概念，但直到第二次世界大战期间，英国博学学者 `Alan Turing` 才向人们展示了如何利用可用信息来做出决策和解决问题。阿兰 能够破解并理解了德国武装部队用于安全发送信息的“恩尼玛”（Enigma）密码。他与团队一起发明了\
  \ `Bombe` 机器，帮助破译了信息。图灵认为，能够与人类对话的机器可以被称为“智能”物体。\n\n20 世纪 50 年代初，美国顶尖计算机科学家 `John\
  \ McCarthy` 组织了一次会议，在会议上创造了“人工智能”（Artificial Intelligence）这一术语。美国各地的研究人员对理解 `AI`\
  \ 概念产生了兴趣，并开始探索该领域。`Herbert Simon` 和 `Allen Newell` 在推动后来改变世界的 `AI` 领域方面发挥了重要作用。\n\
  \n1951 年，一台独特的机器 `Ferranti Mark I` 成功使用算法分析并掌握了国际跳棋。作为，Simon 和 Newell 发明了一种通常被称为\
  \ `General Problem Solver`（通用问题求解器）的算法来解决数学问题。此外，20 世纪 50 年代，`John McCarthy` 开发了\
  \ `LISP` 编程语言，这被认为是 `AI` 和机器学习的重要部分。20 世纪 60 年代，几位研究人员强调开发算法来解决数学问题。在同一十年，计算机科学家发现了用于控制机器人的\
  \ `Machine Vision Learning`，1972 年第一台智能机器人 `WABOT-1` 在日本诞生。\n\n然而，在全球增强 `AI` 应用的努力中，计算机科学家意识到在机器中创造智能是非常挑战性的。为了让\
  \ `AI` 和机器学习取得成功，科学家需要海量的数据。然而，当时的计算机并不发达，无法处理如此规模的数据。企业和政府对 `AI` 失去了信心，在 20 世纪\
  \ 70 年代和 90 年代，科学家面临着 `AI` 研究资金的短缺。\n\n90 年代，几家巨头公司再次对开发 `AI` 产生兴趣。日本政府公布了开发第 `5^(th)`\
  \ 代计算机的计划，以推进机器学习。`AI` 的狂热者相信，计算机很快就能像人类一样进行对话、解释照片、翻译语言并推理。1997 年，IBM 的计算机 `Deep\
  \ Blue` 首次在持有和解释信息方面击败了计算机。\n\n随着时间的推移，计算机处理能力存储能力的指数级增长使得公司能够存储大量数据。在过去的 15 年里，`Google`、`Amazon`、`百度`\
  \ 等公司已利用 `AI` 和机器学习获得了巨大的商业优势。\n\n## 人工智能的目标\n\n`AI` 的主要目标包括：\n\n### 知识表示与推理\n这是\
  \ `AI` 的一个领域，专注于能够处理信息的计算机表示的设计和实现。`AI` 旨在通过对关系或规则进行编码，使其被计算机系统轻松理解，从而实现这类推理的自动化。知识表示与推理的一些常见用途包括：辅助人机之间通信的自然语言用户界面，以及协助医生以图像形式解释医疗记录的辅助诊断。\n\
  \n### 自动规划与调度\n这是 `AI` 的另一个子组件，处理与测量相对应的自动动作序列，这些序列可以使用 `AI` 系统执行。`AI` 规划的目标是根据一组动作以及预定的目标和任务，实现任何计划的机械化和自动化生成。`AI`\
  \ 规划的示例包括自计算机软件、自动信息收集、作为自主代理运行的机器人以及计算机建议。\n\n### 自然语言处理\n`AI` 的另一个重要目标是处理自然语言。这涉及分析和生成人类可以用于计算机交互的语言或数据。自然语言处理旨在实现特定的计算机系统，能够处理大量的语言数据。目前使用自然语言处理的一些最新技术包括苹果公司的\
  \ `Siri` 应用和 `Google Now`。\n\n### 计算机视觉\n该 `AI` 组件的主要目标是对人类视觉可以完成的任务进行自动化和计算机化评估，以便处理、利用或解释视觉数据。`Computer\
  \ vision` 利用了多种应用，包括人脸识别、物体识别、自动图像处理和视频跟踪。`Computer vision` 通常应用于人脸识别。其他应用还自动图像处理、虚拟现实集成、物体识别和视频跟踪。\n\
  \n### 机器人学\n`AI` 的另一个重要目标是机器人学，关于可以替代人类任务的机器人和机器的构造、设计和操作。机器人学是工程科学的一个分支，包括电子工程、信息工程、计算机科学和电子工程。目前正在进行机器人学研究，以促进军事、家用和商业应用。全球最大的零售商之一\
  \ `Amazon` 在其仓库中拥有自主机器人，其负责保持仓库整洁并提高运营效率。\n\n### 人工通用智能\n`AI` 的目标还包括实现人工通用智能，展示系统执行类人类智力任务的能力。`AI`\
  \ 通过集成系统实现其 `AGI` 目标，包括情感智力、认知智能和社交智能。\n\n![image](img/scene_break.png)\n\n## 机器学习的目标\n\
  \n机器学习主要用于以下输出类型：\n\n### 无监督聚类\n聚类是指用于发现特定数据集结构和成分的无监督技术。它涉及将数据聚集成不同的类中，以观察生成的分组结果。因此，每个类可以通过一组数据点进行分类。用于解决这一目标的常用算法包括分层聚类\
  \ `hierarchical clustering` 和 `K-means clustering`。\n\n### 监督分类（二分类和多分类）\n另一方面，分类涉及将数据点放入预定义的类别或类中。在某些情况下，分类问题为观测值分配类别，或估计特定观测值属于某个类别的概率。二分类的一个例子是给特定邮件分配\
  \ `Ham`（正常邮件）或 `Ham`（正常邮件）类别，其中“ham”仅意味着“不是垃圾邮件”。另一方面，多分类意味着多个类别。在垃圾邮件示例中，它可能意味着第三种类别，即“未知”。\n\
  \n### 回归分析：单变量与多元\n与离散类别不同，回归为观测数据分配连续的响应。一个例子是预测某一天`道琼斯工业平均指数`的价格。该值可以是数字，非常适合回归。用于实现这一目标的算法是`简单或多元线性回归`、`森林或决策树回归`、`人工神经网络`、`泊回归`、`序回归`和`最近邻方法`。\n\
  \n\n\n\n\n## 异常检测\n\n尽管我们可能假设数据总是合理且表现良好的，但事实并非总是如此。有时，由于测量误差或设备故障，我们会得到错误的数据点。通过机器学习，可以轻松检测出异常，这有助于提供质量控制衡量。用于实现这些目标的常用算法包括主成分分析（`PCA`）或支持向量机。\n\
  \n## 推荐系统/引擎\n\n推荐引擎是一种信息过滤系统，旨在不同的应用程序提供推荐，包括音乐、电影、餐厅、书籍、产品和文章。推荐系统中常用的方法是协同过滤和基于内容的过滤。\n\
  \n为了有效利用大数据，用于利用不同算法的机器学习工具包括：\n\n- 数据质量与管理\n- 用于构建模型的图形用户界面（GUI）\n- 模型寻找的可视化和交互式数据探索\n\
  - 模型对比以识别最佳模型\n- 自动集成模型的评估以确定最佳值\n\n## 人工智能与机器学习的关系\n\n很多时候，研究人员和学生在区分人工智能与机器学习以及识别它们之间可能的关系时感到困惑。然而，机器学习特别是指对计算机算法的研究，这些算法会随着经验而改进。机器学习算法属于计算机科学的一个分支，通常被称为计算学习理论。另一方面，人工智能是一个分为三类的计算机系统：计算哲学、计算心理学和计算机科学。\n\
  \n人工智能（`AI`）起源于计算机科学的一个领域，其目标聚焦于解决人类可以完成的任务。它通过不同的方法来实现，例如编写一个实现科学家所制定标准的程序。虽然人类也可以完成类似的任务，但手工制定标准可能是一项耗时且辛苦的活动。人工智能有多种工具可以用于解决计算机科学中的各种问题，包括逻辑、控制理论、搜索与优化、神经网络、概率方法以及分类器和统计学习策略。\n\
  \n机器学习与人工智能密切相关，因为它是人工智能的一个子领域。它关注算法的建立，计算机利用这些算法来自动学习模型。机器学习的应用能够阅读文本并分析内容。机器学习还可以听音乐、判断某人是难过还是快乐，或者找到适合个人心情的歌曲。作为人工智能的一部分，机器学习专注于数据的持续改进、数据挖掘和任务自动化。\n\
  \n# 第 2 章：人工智能 VS 人类智能\n\n“事实已变得显而易见，我们的技术已经超越了人性。”\n\n—— 阿尔伯特·爱因斯坦\n\n“人工智能”和“自动化”是经常互用的术语。它们与编程或机器人以及电子机器有关，这些机器使我们能够更高效、更成功地工作——无论是工业车辆组装还是发送跟进邮件。\n\
  \n在任何情况下，情况比这更为微妙。自动化从根本上是指能够自动执行任务的硬件或软件——不需要人工干预。“人工智能”这一术语是由约翰·麦卡提出的，作为一种制造智能机器的工程科学。基于计算机的智能与试图让机器或软件模仿并在从长远来看取代人类的行为和智能联系在一起。\n\
  \n人类目前正在迈向的理想情况是：机器收集数据——人工智能系统“理解”它。我们正在观察两个完全不同但完美互补的框架。\n\n## 自动化\n\n自动化系统是在几秒钟记录你分期付款的解释银行，组织向客户发送批量邮件的原因。它让你能够在订单后的几小时内完成货物的运输和交付。\n\
  \n自动化的唯一目的：让机器有机会执行单调、重复的活动，或者像某些个人所说的，“把机器人从人类中解放”。它为个人节省了时间，专注于需要人类触感和判断的日益重要的创新任务。最终产品是日益精进、实用的业务，以及具有不断提高生产力的劳动力。一个顺从的先进机器人，它从不请假或休假，并始终处理业务。组织如此轻易地采用自动化并不意外奇。\n\
  \n自动化机器由手动配置驱动，例如工作流程、编程边缘情况等——基本上，它是一台听从命令的士兵机器。\n\n自动化将在未来几年内逐渐影响工业革命。自动化的影响已经在某些业务中体现，某些国家受到的影响比其他国家更大。\n\
  \n自动化的特殊可能性在行业和活动之间存在显著差异。随着自动化创新（例如机器人技术和机器学习）在日常活动中承担着巨大的作用，它们对工作环境可能的影响已成为研究和公众关注的焦点。对话倾向于一种二元论的猜测游戏，即机器是否会取代工作。\n\
  \n虽然自动化技术在未来几年将消除少数职业，但它将影响几乎所有员工的部分，提高或降低水平，取决于他们从事的工作类型。自动化目前正越过标准制造，至少从技术可行性来看，有可能改变行业，例如医疗和金融领域，这些领域包含了大量的信息任务。\n\
  \n## 理解自动化潜力\n\n在谈论自动化技术时，我们指的是通过适应现有的测试技术使给定任务自动化的可能性。换句话说，无论任何设备或活动的自动化是否可行，每个职业都由不同类型的职责和任务组成，每个任务都有波动的可行性水平。例如，零售业的职业包括收集或处理信息、与客户互动和建立关系以及设置产品展示等活动。\n\
  \n\n\n\n技术可行性是自动化的必要前提；但它并非某项活动是否可以自动化的唯一指标。另一个需要评估的因素是创建和发送设备以及待自动化产品的成本。与供需关系和劳动力元素相关的成本涉及到另一个随之而来的因素：如果劳动力充足且在大多数情况下比自动化廉价，那么这种可能性可能成为反对自动化的决定性因素。另一个值得研究的因素是超越劳动力成本交换的优势；包括更高的产出、更好的质量以及更少的错误。同样，也应该衡量行政或社会问题，例如机器在特定环境中的价值。例如，机器人可能会选择取代医生的一些工作。但就目前而言，这种情况可能真实发生的前景对于某些习惯于期待与人接触的患者来说，可能证明是令人不悦的。\n\
  \n自动化在行业或职业中兴起的可能性，取决于这些活动内部以及活动之间存在着某种不被察觉的交换。\n\n即使机器最终接管了某个职业中的多项人类职责，这并不意味着该职业的终结。尽管人们可能预期如此，其他职业将会增长以填补这一空白。例如，在美国，20\
  \ 世纪 80 年代标准条形码扫描器及相关销售终端框架的大规模普及，使每个商店的劳动力成本降低了高达 4.8%，食品成本降低了 1.2%。它还推动了各种进步，包括促销机会的增加。无论如何，收银员也是必不可少的；事实上，他们的工作需求在\
  \ 1980 年至 2013 年间平均以 2%的速度增长。\n\n––––––––\n\n## 人机协作\n\n这一代最伟大的头脑，无论是特拉斯的埃隆·马斯克还是斯蒂芬·霍金，都反对人工智能。他们表达反对的方式完全符合反乌托邦式的格言：“机器人和人工智能将有机会比我们更进步，创造出我们作为人类面临的最大风险。”\n\
  \n此外，我们还有坚决的 AI 倡导者，他们认为 AI 将支持人类但不会控制或干预他们的生活。这是 AI 的总体目标：实现能够胜任人类言语、思考和行为的进步，而这些行为通常不会受到自然局限性的影响（人会衰老和死亡）。\n\
  \n同样，与大多数人一样，这意味着 AI 非常不擅长遵循指令。这并不是它的初衷；它的目的是不断寻找模式（像人类一样）、从经验中获益（像人类一样），并在特定情况下自主选择合适的反应（像人类一样）。\n\
  \n通过这种方式，AI 并不是我或你的复制品。它与构建一个比我们想象更强大的系统紧密相关。\n\n驱动自动化系统和 AI 的动力与驱动组织的动力非常相似：数据。实现自动化的企业表现更好，并获得了显著的收入增长。这显然可能是许多变量共同的结果，包括与自动化相关的标准跨领域优势。利润能力的扩大；更好的业务效率，以及最重要的一点——准备好专注于创新和/或关键任务的人员。\n\
  \n我们尚未准备好迎接 AI。我们正处于认知自动化的浪潮中。如果我们继续通过投入海量数据为智能自动化提供动力，我们可能会变得强大得多——无论是作为个人，还是作为组织。\n\
  \n如果我们恰好想象 2030 年的世界，人与机器之间的关联将重塑生活。机器将补充人类能力，帮助他们实现更卓越的效率。\n\n## 未来的伙伴关系\n\n个人与技术（或机器）紧密生活和工作已经很长时间——从打字机、个人电脑到手机在我们日常生活中的普及。得益于软件、大数据和处理能力的巨大进步，我们进入了一个拥有令人惊叹的新可能性的世界。我们将观察到与机器关系发生翻天覆地的变化——表现为比以前多多的生产力、统一性和可能性。\n\
  \n随着技术力量在五年内增长 10 倍，我们对技术的依赖也将之增加。\n\n\n\n\n人们应当承担三项至关重要的角色。我们应该训练机器来执行特定任务；解释已完成的结果，特别是当结果不符合逻辑或令人存疑时；并保持对机器的负责任使用（例如，防止机器人伤害人类）。\n\
  \n## 训练\n\n机器学习算法必须接受指导，以执行它们旨在完成的工作。因此，需要收集大量的训练数据集，以展示用于处理日常表达的机器解读应用、用于识别疾病的医疗应用，以及用于帮助金融决策的推荐引擎。此外，`AI`\
  \ 框架必须接受教导，学习如何更好地与人交流。这些例子已经存在，例如，人类教练被预期为亚马逊的 `Alexa` 构建性格，更不用说苹果的 `Siri` 了，以确保它们精确地反映其组织的品牌形象。例如，`Siri`\
  \ 只有些丝大胆，这正如客户可能从科技巨头 `Apple` 那里预到的一样。\n\n模拟智能助手目前正在接受训练，以展现出日益微妙和复杂的人类特征，例如同理心。\n\
  \n## 解释\n\n随着 `AI` 越来越多地通过不透明程序（也称为黑箱问题）得出结论，`AI` 需要相关领域的人类专家向非专家用户披露它们的行为模式。这些“解释者”在基于证据的业务中尤为重要，例如医学和法律，在这些领域，专业人员需要看到机器是如何衡量对贡献、判决甚至诊断的贡献的。\n\
  \n解释者在帮助保险提供者和律师理解为什么自动驾驶车辆采取了导致事故或避免事故的步骤方面也同样重要。此外，解释者正成为管理型企业的必要条件——在任何 `AI`\
  \ 的输出可能被测试为不公正、非法或偏见的客户面对型行业中如此。例如，欧盟最近的《通用数据保护条例》（`GDPR`）赋予了客户对任何基于设计的决策寻求澄清的权利，例如\
  \ `Mastercard` 或房屋贷款上收的服务费。这解释了一个 `AI` 将有助于扩大就业增长的领域。专家估计，机构应该创造大约 75,000 个独特的职位来满足\
  \ `GDPR` 的规定。\n\n––––––––\n\n![image](img/scene_break.png)\n\n## 维持\n\n尽管有那些可以通过解释来澄清\
  \ `AI` 结果的人，但组织还需要“维持者”——即那些持续工作以确保 `AI` 系统运行恰当、安全且可靠的代表。\n\n`AI` 可以帮助我们的逻辑和执行能力并提升创造力。例如，有一类被称为安全架构师的专家，他们专门专注于准备和防止\
  \ `AI` 造成的伤害。与个人合作的工业级 `AI` 设计者已经充分考虑了确保 `AI` 能够识别人类且不会对他们造成任何伤害。当 `AI` 发生不并造成伤害时（例如自动驾驶车辆涉及致命碰撞时），这些专家可能还会审核解释者的报告。\n\
  \n其他维持者确保机器框架维持道德标准。例如，如果观察到用于信贷审批的 `AI` 框架歧视特定个人，这些伦理经理负责调查并处理该问题。承担相关角色的数据合规官员试图确保驱动\
  \ `AI` 系统的集合数据符合 `GDPR` 和类似的消费者保护指南。\n\n一项相关的数据应用工作包括确保 `AI` 审慎地管理数据。同样，与其他科技公司一样，`Apple`\
  \ 使用 `AI` 在与组织的设备和操作系统交互时收集有关客户的见解。其要点是增强客户体验；然而，不受监管的数据收集可能会损害安全、激怒客户并触碰法律底线。该组织的“差异安全小组”试图确保在\
  \ `AI` 在统计学上尽可能获取更多信息的同时，能够保护个人客户。\n\n## 机器决策\n\n通过向工人提供定制信息和指导，`AI` 可以使他们做出更好的选择。更明智的决策对劳动者来说可能特别有利，因为做出更好的判断可以深远地影响底线。\n\
  \n考虑如何利用“数字孪生”（真实设备的虚拟副本）来升级硬件支持。一家名为 `General Electric`（通用电气）的公司构建了其涡轮机和不同机械部件的上述编程模型，并定期使用从设备收集的数据为其提供更新。通过收集来自现场许多机器的报告，`General\
  \ Electric` 汇编了大量关于典型和异常功能的数据。采用 `AI` 计算的 `GE Predix` 应用程序现在能够预测某台机器的特定部件何时可能故障。\n\
  \n`GE` 技术从总体上改变了管理工业设备的密集型决策过程。例如，他们的应用程序可以识别涡轮机中某些异常的转子里程，检查发动机的运行历史，报告损坏在最近几个月内是否扩大，并警告说如果不采取任何措施，预计转子平均将损失四之三的有效寿命。该框架随后能够根据设备的当前状况、工作环境以及关于类似退化和不同设备修复的积累信息，建议合适的措施。除了建议之外，`Predix`\
  \ 还可以产生有关费用和金钱收益的数据，并对其调查中应用的推理提供约 95% 的确定性水平。\n\n没有 `Predix`，员工很少能在标准维护检查中检测到转子的磨损。可以想象，在发动机故障之前，损坏可能不会被发现，导致过度的停机。有了\
  \ `Predix`，技术人员在问题发生很久之前就会被提醒可能的问题，并获得所需的数据以做出明智判断，这种判断偶尔可以为 `GE` 节省数千美元。\n\n##\
  \ 人类与人工智能的本质区别\n\n### 情感\n\n人类智能之所以强大，是因为它不受限于客观推理。我们认知中的不同部分使我们能够应对通常环境中典型的不可预测性和不确定性。它们使我们能够基于共同的品质和灵感做出选择，而无需理解其逻辑。人类智能使情感影响他们的决策和对他人的行为。\n\
  \n机器无法做到这一点，无论它是否需要。\n\n### 创造力\n\n撇开人类创造力是否有限以及创造力究竟是什么不谈，显而易见，今天的人工神经网络系统是在不断推导出规则，而不是被教导的。击败韩国围棋大师\
  \ `李世石` 的 `AlphaGo` 被喂了大量的比赛，但没有任何规则。它在没有其他人输入的情况下学会了下“围棋”。\n\n\n\n\n\n无论如何，机器真的能具有创造力吗？它们能被视为独立的艺术家吗？如果说创造力是人类的特征，那么一个由电线和晶体管组成的集合又如何被认为具有想象力呢？也许我们并没有想象中那么那么不同。我们的人类大脑受限太深，甚至无法想象机器的想象力可能变得多么不可思议。如今的机器已经在艺术领域展现出创造力的迹象。有些软件通过组合脸部结构算法，可以生成不存在的人类的可信图像。\n\
  \n## 针对人类问题的机器思维\n\n在没有数据数据的情况下，就没有 AI。在这方面，AI 无法解决数据上未被收集的问题。因此，AI 的知识是有极限的。\n\n\
  除非向 AI 系统输入诸如情绪检测、心率、面部表情、动作、日常习惯等数据，否则系统将无法理解人类行为。它无法适应人类天生的不同动机组合。\n\n人类知识中那种不容置疑的固定性，将被视为一种能够整合知情且热情的推测，以做出适应独特情况的道德选择。目前尚不确定动物是否能协调地利用客观推理和情感推演来做出道德选择。无论是否有少数动物能做到这一点，这里的怀疑在于，这种伦理品质的对于每个物种和文化来说都是非凡且合理的。\n\
  \n## 意识\n\n在四岁时，孩子们通常开始掌握社会的本质标准之一：他们的思维与他人的思维不同。他们可能有不同的信念、愿望、感受和目标。\n\n机器意识是另一个令人惊叹且跨学科的研究领域。它与\
  \ AI 紧密交织，尽管试图忽视这一点会更简单，但对于每一个需要从基础观点接触 AI 的人来说，这是一个基础性问题。\n\n尽管对人工智能有着巨大的兴趣，但对集体意识的兴趣要少得多。这就是我们额外很少看到治理系统——民主制度、政府事务、商业和经济——运行智能程度提升较小的动力之一。我们被挤满人类智能的组织所包围，综合考虑，这些组织经常表现出集体意识。\n\
  \n尽管机器感知领域没有进展，或者证明机器认知不存在，它也将丰富人类意识的学习和系统建设。这将理想地促进健康、行政和政治领域取得宝贵的进展。\n\n所有研究机器意识的分析师在某个时刻都会面临法律和道德问题及建议。这可能发生在不同的情况下，类似于动物保护运动，后者由于对动物意识的承认而反对研究和实践。\n\
  \n## 独特性\n\n相似性和差异并不意味着 AI 比人类智能更好，或者反之亦然。要点在于，它们是完全不同的事物。\n\n人工智能擅长处理具有明确界限、可以通过数据交流的冗余任务，但不擅长需要直觉和基于不完整信息做出决策的扩展性任务。有趣的是，人类知识在需要保持警觉和进行概念选择的环境中非常有用，但在需要大量计算和实时数据处理的任务中表现糟糕。人类智能和\
  \ AI 相互互补，弥补彼此的短板。它们共同可以完成任何一方都无法独立完成的任务。\n\n随着 AI 越来越擅长执行不断增多的任务，我们作为人类将发现更多机会将智能付诸真正的用途，即在创造、社交、文学、诗歌、体育以及每一项重要的事情上，因为这些事情融入了人类的要素和性格。此外，我们将利用扩展的洞察力设备来改进这些创作。未来将是人工智能与人类智能共同构建，而非孤立。\n\
  \n![image](img/chapter_title_corner_decoration_left.png) ||  || ![image](img/chapter_title_corner_decoration_right.png)\
  \ |\n| --- | --- | --- |\n\n![image](img/chapter_title_above.png)\n\n# 第 3 章：技术\n\
  \n## 人机背后\n\n### 接口\n\n![image](img/chapter_title_below.png)\n\n![network-3139201\\\
  _640.jpg](img/image003.jpg)\n\n“技术正在改变我们作为人类互动的方式。” —— 丹·布朗\n\n在本章中，我们将涵盖以下：\n\n\
  * 人机界面 (HMI) 的定义及其用途。\n* HMI 的样式。\n* 类人机器界面。\n* 智能自动化对生活方式和关系的影响。\n* 硬件和软件。\n* 配置类型。\n\
  * 市场动态。\n\n## 人机界面 (HMI) 的定义\n\n人机界面 (HMI) 是精于控制人机关系的精确手段组成部分。机器边界由硬件和软件组成，允许操作员的输入转换为机器的指示，机器再次向操作员提供必须的结果。HMI\
  \ 知识已应用于微电子、娱乐业、医疗和军事等无数产品中。HMI 帮助将人类集成到多功能系统中。人机界面也可称为机器界面 (MMI)、人机界面或计算机人界面。\n\
  \nHMI 有两种交互类型，即人到机和机到人。由于 HMI 无处不在，相关的边界可以包括波雷达、控制和边缘设备、对话识别、使用光、声音、高温度进行信息交换，这些都可以被视为\
  \ HMI 的一部分。尽管 HMI 被视为一个独立的技术领域，但它也可以作为其他技术的适配器。它们基于人类生理、行为和心理学能力构建，这意味着人体工程学将为 HMI\
  \ 制定理论。它们为提交、知识和修复提供独特的机会。此外，HMI 可以与外部设备提供良好的交互。下面的图展示了 HMI。\n\n![77D81C3D-3FF2-4EBE-8104-87F2A2D55ECE.jpg](img/image006.jpg)\n\
  \n图 1：一个 HIM 界面\n\n整合 HMI 带来的优势包括：减少错误率、改进设计、提高效率、增强一致性、可维护性、提高用户接受度和安全性、减少培训和技能需求、减轻用户负担、增加工业效益和效率，等等。触摸屏和外壳修改可以被视为\
  \ HMI 的示例。其知识主要应用于关键和平面性能、阵列响应、互联网接入、微电子参与和信息合成。GEIA 和 ISO 等认证机构为人机界面技术提供了标准和指南。\n\
  \n## 人机界面的用途\n\nHMI 系统：\n\n* HMI 是一种用于与机器之间界面的软件。\n* HMI 是一种充当 PLC 和操作员之间边界的设备。\n\
  \n\n\n\n\n# HMI 概述\n\nHMI 用于工业领域以增强机械与生产工厂之间的通信。\n\nHMI 将提供工业控制的图形化可视化，并监控其系统，提供实时数据采集。\n\
  \n## HMI 元素\n\n这些元素包括：\n\n* 静态屏幕开发。\n* 动态链接连接。\n* 趋势图。\n* 报警和安全设置。\n* `PLC` 与 `HMI`\
  \ 之间的交互。\n\n## HMI 的优势\n\n* 对非技术人员来说，易于使用。\n* 用户友好型。\n* 数据记录。\n* 提高生产率。\n* 增强通信。\n\
  * 降低成本。\n* 易于工厂管理。\n\n人机界面设备具有核心电子元件，用于工业环境中调节和信号化不同类型的自动化设备。HMI 产品范围从带有标准 `LED`\
  \ 指示屏的简单设计，到带有触摸屏和许多不同功能的多功能 HMI 系统。HMI 系统必须足够坚固，并能够承受恶劣环境。HMI 应具有防尘、防水和耐极端温度的能力，在某些情况下甚至耐腐蚀化学品。\n\
  \n如下文所述，在您的工厂或设施中安装 HMI 有许多用途：\n\n### 报警\n\n工厂操作人员可以看到人机界面提供的信号，以识别设备的任何故障并迅速做出反应。报警有助于在紧急情况发生前预防并提醒操作人员。报警还可以帮助跟踪其他问题，并有助于优化生产过程以提高生产率。\n\
  \n### 可靠的消息传递\n\n作为操作人员，当发生特定事件时，您可以依靠 HMI 消息进行 Facebook 页面、传真等操作。在其他情况下，当机器燃料水位低且需要加注时，操作人员会自动收到报警。\n\
  \n### 更容易的工厂通用管理\n\nHMI 技术将高效地管理和执行配方。它具有高质量的图形，提供工厂运行的真实视图，让操作人员从中央监视器轻松进行控制。\n\
  \n### 通过模拟进行准确测试\n\n工厂经理可以使用带有模拟功能的灵活 HMI 快速检查设备和装置。您可以在办公室的舒适环境中无需任何设备即可完成测试。这将有助于缩短启动时间并增强整体生产。\n\
  \n### 降低成本\n\nHMI 通过取代数百个选择器、指示灯和按钮降低了运营成本，这意味着它将减少面板、电缆和控制台的增加。\n\n### 增强通信\n\n\
  HMI 通过远程、`Ethernet`、`data highway plus`、`serial port`、`dynamic data exchange` 等多种方法增强设施内各种类型设备之间的通信。您可以注意到，拥有\
  \ HMI 可以让您的设施在运行、安全和生产方面受益。像 `Red Lion` 这样的行业为严苛的工业应用提供了多种 HMI 产品。\n\n## 人机界面类型\n\
  \n如下所示，HMI 有不同类型：\n\n### 自动替换器\n\n它通过将每个开关的所有功能整合到一个位置，使制造过程合理化。它取代了 `LEDs`、开关/旋钮和按钮。这些电动设备可能会被淘汰，因为\
  \ HMI 可以提供 `LCD` 显示器上实现的所有设备的视觉设计，同时处理所有其他任务。\n\n### 数据处理\n\n这种类型的 HMI 通常适用于需要系统提供持续响应的应用。它们大多数配备了强大的能力内存。您必须确保\
  \ HMI 屏幕足够大，以便显示图表、制造分解和光学图。它可以包含指南、数据排序和报警管理等功能。\n\n---\n\n![image](img/scene_break.png)\n\
  \n### 管理员\n\n在任何涉及 `SCADA` 的演示中，主 HMI 都将至关重要。HMI 将主要运行 `windows` 并参与许多 `Ethernet`\
  \ 端口。\n\n## 程序选择\n\n### 标记软件\n\n这是构建者提供的软件，具有益处，是被许可使用的。\n\n### 自治软件\n\n这是已约定使用的第三方软件。\n\
  \n### 脆弱性软件\n\n这种软件具有感知性，使其拥有广泛的知识，并且交付允许用户进行仔细选择。\n\n––––––––\n\n![image](img/scene_break.png)\n\
  \n## 人机界面应用\n\nHMI 有多种用途：\n\n* 便利性贸易可以监测水传输。\n* 它们被用于生产线，协助控制速度、故障更改等所有功能。\n* HMI\
  \ 可以控制金属切割，提高其执行速度。\n\n## 人机界面优势\n\n* HMI 降低了生产成本。\n* 它提高了效率和生产力。\n* 它节省了数据，方便以后故障时使用。\n\
  * HMI 扩展具有比以往任何时候都强大的创新能力和开发功能的能力，不再需要鼠标和硬件到软件的需求。\n\n## 人机通信\n\n如果你想变得有用、鼓舞且令人兴奋，你就必须创建一个真正的认知体验。认知是一个心理过程，你通过思考、经验和感官获取知识和理解。认知定义了人类如何处理思想以相互作用。在计算机的情况下，感知是指一个通过使用旨在人类认知技能的算法模型来激发人类过程的系统。\n\
  \n\n\n\n根据应用的自主程度，存在许多不同层级的认知功能。低级认知应用需要程序员大量的支持，而高级级应用则具有更强的自主性。新应用可能从低级认知功能开始，因为用户必须训练知识和行为，直到应用能够可靠地回答。随着时间的推移，它将发展出更具创新性的认知功能。每种认知能力根据用户干预的程度，都可以拥有不同水平的任务。\n\
  \n用户与认知应用之间的交互可能并不需要所有这些能力，但应用本身需要具备完成整个认知体验的能力；而这与程序员是紧密相关的。人机交互模型将认知系统所需的各种组件整合起来，形成了一种创建认知技能的方案论。其核心目标是引导并启发有意识的创新，并基于人类的需求、期望和价值观，为做出负责的设计决策提供结构支持。\n\
  \n# 第一部分。输入：理解世界\n\n## 知识\n人类与技术交流的冲动——无论是锤子、微波炉还是量子计算机——都与该技术增强人类生活、延长力量或扩展范围的能力保持一致。在认知计算领域，这指的是增强并引导你与处理海量能力进行交互，这种能力随着时间的推移会增强你的表达、偏好和沟通。随着程序员交流历史的增长，对用户需求和行为系统的理解也随之增长，并在每一次通信中不断完善知识。\n\
  \n\n\n设想一种情况，感知和动机是让程序员感到被理解的重要组成部分。系统预计能够反映出程序员对过去交互的熟悉程度以及能够记忆的内容，并在没有任何指令的情况下预判需求。它应该能够减少摩擦，并缩短完成任务所需的步骤数量。如果操作得当，认知系统将产生一种它了解你并理解你需求的感觉。\n\
  \n动机，众为人知的应用程序理解程序员意图、优先级、价值观和目标的能力，其水平分为：\n\n- 良好 – 应用程序非常熟悉程序员的人口统计学特征和业务重点，并据此呈现表面信息。\n\
  - 优秀 – 应用程序能够识别个人及其个性化特征。它能够熟悉用户的感受，并以最合适的情绪进行反馈。\n- 最佳 – 应用程序会根据你的反馈方式主动与程序员进行沟通，即一个\
  \ `assistant`（助手）非常熟悉所协助的对象，并计划如何满足他们的需求。\n\n## 第 2 部分：输出：自然响应\n\n### 推理\n\n应用程序主要通过轻松提供存储在其知识库中的事实信息（ground\
  \ truth）与程序员进行智能通信。通过利用对用户上下文的经验，认知应用将超越准确的翻译，给出更具价值、更宏观的回答。推理可以被视为应用程序通过考虑感知、知识和动机获取的所有可用信息来进行认知通信的能力。如果一个坚实的知识库产生了智能响应，但如果应用程序没有为个人服务并以某种方式考虑你的上下文，那么这种响应就缺乏认知感。\n\
  \n通过根据详细的发现和之前的交互对潜在答案进行评分，系统可以思考如何给出一个经过且具有预测性的回复。单次通信可能同时具备更多功能，但认知应用将根据其迄今学习的内容编写响应，并旨在根据程序员对特定响应的反应在未来改进答案。推理是指应用程序能够基于程序员的上下文和历史知识进行智能通信的能力：\n\
  \n- 良好 – 应用程序可以生成针对特定领域或定向问题空间的预设响应。它在创建响应时并不一定使用感知或动机能力，而是依赖预训练的知识。\n- 优秀 – 它在创建响应时创建丰富的响应，并依赖感知、动机和知识能力。\n\
  - 最佳 – 它将预判用户的需求并直接对其做出响应，创建出对你的需求和上下文非常有益的建议，且远超任何明确表述的内容。\n\n### 学习\n\n只要有交互，认知应用就会根据程序员的响应更新其关于程序员、当前数据和世界的知识。在某些情况下，用户在没有检查内容的情况下立即点击了建议的链接。认知系统通常根据个人和集体历史经验的发现来更新其与人的交互方式。它们记住过去的交互，并根据这些研究，通过增强矩阵中对上下文置信评分的调整来调整响应。学习被认为是应用程序解释用户响应并将这些知识应用于随时间推移改进通信的能力：\n\
  \n- 良好 – 它将允许程序员在界面中训练预先封装的信息。它不会教授感知或动机能力，其目的是创建更多经过训练的知识。\n- 优秀 – 应用程序通过程序员的沟通、行为和显式反馈进行学习。它训练感知和动机能力。\n\
  - 最佳 – 应用程序在没有任何用户干预的情况下更新或训练其信息。\n\n## 智能自动化对生活方式和关系的影响\n\n在过去的几年里，商业模式发生了重大中断。过去的弊端现在已成为未来的大趋势，而新兴技术和数字化正在引导其中许多趋势。许多买家已经从购买商品转向消费服务和体验，交易者别无从根本上改变他们的运营模式。你可以通过供应链自动化来实现这一点。在未来五年内，有不同的方式可以预见这一点的实施：\n\
  \n### 1. 机器人组装工业部门\n\n在成熟企业中，机器人和人工智能（`AI`）将在未来五年内得到认可。这似乎已经在发生，例如，Zara 不再将外外包给亚洲，而是在西班牙制造了\
  \ 14 个高度自动化的工厂，让机器人负责剪裁和染织织品，从而允许商业拥抱节省时间的目录策略。\n\n经历快速增长的客户市场将希望增加生产能力。从 2013 年起，中国被评为全球机器人技术的主要市场。机器人和\
  \ `AI` 使用的增长可以为中国这样的国家带来第一手希望，在工厂成本快速上升和获取生产劳动力挑战日益增加的情况下，他们在效率方面正落后。\n\n### 2.\
  \ 大数据和分析将横跨资源链\n\n传感器和微处理器的成本持续下降，使生产变得智能化，这推动了工程自动化的广泛应用。某些行业无法证明预测系统、边缘计算和软件即服务（SaaS）的价值，在这些领域，软件是集中安置的，按付费获取使得数据组织和分析变得易于管理。将大数据、分析与雷达、机器人和\
  \ `AI` 技术相结合，将共同产生智能终端产品。\n\n### 3. 最后一公里配送将 Uber 化\n\n在分销方面，公司已经在研究如何解决“最后一公里”问题，即允许人们在线订购当地杂货，并派遣一名私人买家去挑选货物并提供给他们。其他公司正在研究如\
  \ `Uber rush` 之类的解决方案，以便在准确的时间到达客户那里。其他人正在提高设施的水平并扩大结构分析。在近的五年内，将有很多类似的想法来满足任何人的需求。\n\
  \n### 4. 高街的终结\n\n如果买家现在在在线购物，那么在未来五年内这可能会结束。为了向想要更快货的客户交付，像 `Amazon` 这样的行业将创建更多的区域配送中心。中国正是这样做的，投资建设其供应网络。它在中国\
  \ 34 个市级拥有 82 个总面积超过 130 万平方米的仓库，在 460 个不同城市拥有 1453 个本地配送站。\n\n然而，在接下来的几年里，不仅是贸易行业感受到波动，资金链的革新也带来以无数实质性的方式影响人们：\n\
  \n\n\n\n\n# 工业者的兴起\n在过去的两个时代中，`eBay` 等公司的增长传递出了一种全新的微型企业家形式。大多数科学进步将为人们维持生计提供更多方法，例如\
  \ `Etsy`——一个销售手工艺品的在线集市，它允许爱好者在全球范围内销售他们的商品。这表明，尽管供应链自动化改变了劳作世界，但它将创造出无数当下的职业模式。\n\
  \n# 善用智能\n无论技术进步多么程度，商业活动仍然需要面对面的交流、互动和建立关系。职业中系统性的交易方面可以是机器人化和数字化的；许多业务的扩张都关乎建立初步联系，然后进行线下管理。因此，新技能将经过深思熟虑，以将其提升到如今的水平。\n\
  \n# 硬件与软件\n\n### 软件\n软件是一个通用术语，用于定义在 `CPU` 系统上执行某些任务的 `CPU` 程序、进程和凭据的集合。`CPU` 系统将软件组织分为三大类：系统软件、软件包和应用程序。它可以通过用户友好的界面进行标准化自动化处理，该界面允许人类更高效地与\
  \ `CPU` 系统连接。\n\n### 硬件\n它可以被称为像硬盘之类的与 `PC` 明显或物理关联的设备。硬盘的示例包括 `CD-ROM`、`PC` 监控器、复印机和胶片卡。没有硬件，计算机无法运行，这使得软件难以生存，因为无物可操作。软件和硬件相互通信，软件告诉硬件它需要执行什么任务。\n\
  \n# 硬件与软件的内容\n* 软件\n* 防火\n* 功能\n* 更改\n* 相互依赖\n* 引用\n\n![image](img/scene_break.png)\n\
  \n## 类型\n硬件是你可以触摸和看到的物理设备，如计算机显示器，而软件程序可以指示设备执行特定任务。比较两者，软件没有物理形态。它们都与计算机相关，并且在某些情况下软件运行硬件，如手机、`GPS`、医疗设备和空中交通控制系统。没有软件程序，机器将被视为无用，即：当计算机没有软件操作系统时，你无法与它通信。\n\
  \n## 功能\n软件通过向硬件分发一组有序的程序指令来执行特定任务。硬件将作为软件说明的交付系统。\n\n## 相互依赖\n在软件加载并安装到硬件以使程序运行之前，硬件无法运行。\n\
  \n## 防火墙\n它们适用于硬件和软件。一种流行的防火墙选择是安装在计算机上的软件防火墙，它可以进行自定义以适应个人用户的安全需求。它们通常位于宽带路由器中。\n\
  \n## 更改\n切换到新软件或同时使用多种软件已很常见；硬件的变化较少。软件创建快、修改、删除容易，但硬件需要大量技能，且是一项昂贵的尝试。\n\n## 配置类型\n\
  除了导出单个配置对象，其他方法也能满足需求。\n\n## 扩展配置类型\n要扩展现有的配置类型，你需要在模块中创建一个配置文件，例如，添加你创建的事件查看器 `app/code/{vendorname}/etc/events.xml`\
  \ 并声明一个新的查看器。你可以在 Magento 中找到现有的配置类型、加载器以及目前存在并验证架构的函数。\n\n## 配置类型的创建\n为了创建新的配置类型，你至少需要添加以下内容：\n\
  * XML \n* XSD 验证架构\n* 加载器\n\n为了为新的搜索服务引入适配器以允许扩展配置其实体，你必须创建：\n* 加载器\n* XSD 架构\n\
  * 为你的新类型工作创建的类\n* 命名合理的配置文件\n\n## 导出函数\n在开发和生产构建之间，你可以在 `webpack.config.js` 中发现区分差异的需求。你可以从\
  \ webpack 配置中导出一个函数作为导出对象的替代。该函数涉及两个参数：\n* 第一个参数环境。\n* 第二个参数选项映射。\n\n## 导出 Promise\n\
  Webpack 可以运行配置文件导出的函数并等待承诺返回。当你需要异步加载配置变量时，这非常有用。作为导出单个配置函数的替代方案，你可以导出各种配置。所有配置都会被构建。\n\
  \n# 市场动态\n它指的是影响市场产品供需的因素，对于经济学和实际业务应用至关重要。许多经济学家建立了市场动态的概念。它们被认为是波特五力竞争模型中最发达的部分。\n\
  \n市场动态也可以指影响因素的元素。从经济学研究来看，它们是供给、需求、价格、数量和其他精确术语。从贸易角度来看，市场动态是影响涉及方业务模式的因素。相比之下，对于石油公司而言，动态可能是每桶原油的价格、国家储备等。\n\
  \n对于明智的贸易，市场动态被纳入业务计划的市场分析中。这些因素对贸易的影响如此巨大，以至于如果不排除它们就会被忽视。市场动态在企业的营销计划中起着至关重要的作用。它们可以在销售成本、配送、物流等许多领域发挥关键作用。\n\
  \n## 市场动态示例\nBeryl 正在为她的新业务编写市场计划。她看到时尚公司对手包和项链等高质量配件有真实需求。她在零售方面拥有丰富的经验，这为她提供了坚实的参考基础。为了完成营销计划，她必须完成竞争和行业分析。她将需要汇总针对时尚饰配件行业的市场动态分析。\n\
  \nBeryl 还需要理解这些动态以填补未被服务的买者的空白。\n\n她将从公司分析开始。查看各种统计数据：买家支出率、零售增长、时尚行业增长、实体店增长和销售额，以及零售商的能力。Beryl\
  \ 正在收集市场动态，以了解市场是否能维持业务。她确定无论所做什么都是她策略的基石。\n\n市场动态是集体市场资源和偏产生的结果。由于这个原因，市场动态不受任何个人或行业行动的影响。个人是对市场动态做出反应，而不是产生它们。市场动态活跃于健康、有机、天然和环保公司的\
  \ LOHAS 部门。Mambo Sprouts Marketing 的创始人是一位致力于通过在线、批发和电子邮件接触健康消费者的推广服务领导。\n\n\n\n\
  \n\n* 业务营销研究与洞察\n* 社区伙伴关系与当地贸易可见性\n* 移动端商标、广告与推广\n\n在金融市场中，并非所有的金融服务专家都了解市场的运作方式。这些专家会根据所有可用信息，做出符合客户最大利益的理性决策。精明的专家则基于对扩展知识的广泛分析以及经过证明的方法。他们致力于充分理解客户的、、目标、时间跨度以及承受投资风险的能力。\n\
  \n# 第 4 章：人工智能领域的关键领军者与极具前景的初创公司\n\n“如今作为一家初创公司，开发硬件设备要困难得多。” —— 马克·安德森森\n\n人工智能正在飞速发展。它现在在从农业到通信的各行业的技术世界中都起着至关重要的作用。从谷歌到苹果和微软，每一家大型科技公司都在投入大量资源寻求人工智能的突破。现在每家公司都清楚，为了保持竞争力，你的故事中必须拥有机器学习。几家私营公司在美国和全球的人工智能领域拥有着巨大的权力和影响力。这些公司正在以意义的方式使用这项技术，并成功地展示了此带来的真实业务潜力。以下是拥有力量和资源利用人工智能技术塑造你未来的大巨头列表：\n\
  \n## Twitter\nTwitter 投入了大量资源进入人工智能学习领域。该公司已经连续收购了四家人工智能公司。其中最著名的是 Magic Pony。该公司耗资\
  \ 1.5 亿美元的高价收购了 Magic Pony。这家人工智能公司开发了用于网页和移动设备视觉处理的机器学习方法，Twitter 将在不久后利用此改进其系统，在你的时间线中推荐特定的推文。\n\
  \n## 商汤 (SenseTime)\n商汤人工智能公司已经拥有了大型客户，名单中包括中国政府。该公司正向中国政府提供面部识别技术以追踪其公民。该技术在面部识别方面被誉为最佳，优于谷歌和脸书的产品。目前，商汤正集中资源开发自动驾驶技术。\n\
  \n## 高通 (Qualcomm)\n高通是一家致力于人工智能的芯片制造公司。人工智能在其开发的 855 移动平台上起着不可性的作用。该芯片使用信号处理器处理\
  \ AI 语音、音频和图像功能。高通骁龙驱动了当今市场上最受欢迎的一些智能手机。如果你是智能手机技术的爱好者，请密切关注高通，获得令人兴奋的新型 AI 智能手机功能。\n\
  \n## 英伟达 (Nvidia)\n英伟达可能是成立最久的 AI 公司之一，且今天仍起着关键作用。英伟达的显卡是机器学习和人工智能的核心。该公司活跃于医疗保健、高等教育、零售和机器人领域。该公司公司正在开发将集成到汽车制造和自动驾驶每个层面的\
  \ AI 技术。\n\n## 微软 (Microsoft)\n微软在消费者和业务端都参与了人工智能。微软的 AI 数字助理 Cortana 直接与亚马逊的 Alexa、苹果的\
  \ Siri 以及谷歌的数字助理竞争。其人工智能功能使用公司的 `Azure Cloud` 服务为业务界的一些顶级品牌提供聊天机器人和机器学习。微软仅在 2018\
  \ 年就购买了数家 AI 公司。\n\n## 英特尔 (Intel)\n英特尔一直在对多家人工智能公司进行收购。近期，英特尔收购了 Nervana 和 Movidius\
  \ 以及几家较小的 AI 初创公司。Nervana 使公司能够开发特定的深度学习软件，而 Movidius 的创立是为了为性能不足的设备带来 AI 应用。英特尔与微软合作，为\
  \ `Bing` 搜索引擎提供 AI 加速。\n\n## IBM\n该公司自 20 世纪 50 年代以来一直活跃在 AI 领域。它是人工智能先驱公司之一，至今仍然活跃。通过\
  \ Watson，IBM 开发出了一个机器学习平台，可以将人工智能集成到业务流程中，例如为客户支持构建聊天机器人。IBM 的客户包括毕马威（KPMG）、四大以及巴西的\
  \ Bradesco 银行等大公司。\n\n## 海思 (HiSilicon)\n海思是华为 `Kirin 980` 芯片的制造商，该芯片于 2018 年在柏林\
  \ IFA 上发布。麒麟 980 显著增强了全球第一代人工智能智能手机芯片。该芯片能极快速度处理面部识别、智能翻译和图像分割等功能。该芯片促使竞争对手开发了许多其他智能手机芯片。\n\
  \n## 谷歌 (Google)\n这是最大且最重要的 AI 公司之一。多年来，谷歌以疯狂的速度收购了数家 AI 初创公司。近期，它还创建了 12 多家全新的人工智能公司。谷歌以\
  \ 4 亿美元收购了 DeepMind。DeepMind 是棋类游戏领域的冠军。该公司还在资助正在进行的 `Tensor AI` 芯片项目，用于设备端的机器学习。该公司希望在计算机行业从“移动优先”演变为“AI\
  \ 优先”。\n\n## 脸书 (Facebook)\nFacebook 在人工智能领域投入了巨大资源，可能是意识到 AI 技术在未来业务世界中将发挥关键作用。Facebook\
  \ 的 AI 研究小组被称为 `FAIR`，一直致力于机器智能领域的发展，并开发新技术为人们提供更好的沟通方式。该公司还与两个名为 `Alice` 和 `Bob`\
  \ 的 AI 合作，但该项目由于技术故障过早终止，该故障使它们能够用秘密语言进行交流。\n\n## 大疆 (DJI)\n这可能是最著名的中国人工智能公司之一。该公司目前估值为\
  \ 150 亿美元，在全球无人机市场占据 70% 的份额。该公司正日益进入 AI 市场，最新的无人机使用 AI 和图像识别技术来避免飞行时碰撞物体。该公司还在考虑进入利润丰厚的自动驾驶汽车和机器人技术市场。大疆最近还与微软合作开发了一种用于计算机流媒体项目的无人机。\n\
  \n## Banjo\n该公司成立于 2013 年波士顿马拉松爆炸案发生后不久。该公司利用 AI 搜索社交媒体，以识别实时事件和情况，这些情况对于应急服务和其他组织运行得更快、更智能至关重要。该公司吸引了巨大的投资伙伴，包括日本电信巨头\
  \ `SoftBank`（软银行）。\n\n## 苹果 (Apple)\n苹果认为人工智能是未来的未来。因此，该公司近年来一直忙于收购 AI 初创公司。该公司开发了如\
  \ `Siri` 等产品，以及公司新的 `Create ML Tool`，`macOS` 和 `iOS` 开发者利用它为自己的应用创建高效简单的训练课程。\n\n\
  ## Viz.ai\n\n\n\n\n该公司旨在减少未能及时获得正确治疗的中风患者人数。其软件将患者大脑的 CT 图像与其扫描数据库进行交叉比对，可以在几分钟内向专家发出大血管阻塞性中风早期迹象的警告，而这在其他情况下可能会被忽略或需要太长时间才能发现。该公司的\
  \ AI 产品已在多个国家的主要医院使用，例如纽约的西奈奈山医院（Mount Sinai）和丹佛的瑞典医疗系统。\n\n## Deep 6\n\n该公司开发出了一种\
  \ AI 产品，帮助药物研究团队在新的技术试验中寻找合适的患者群体。该公司的软件可以从电子医疗记录中提取数据，创建患者图谱，允许研究人员根据特定条件和特征进行过滤，从而在短时间内完成匹配。系统的语言理解引擎经过训练，即使注释中没有提到，也能推断出某些情况。目前，该公司在全美及全球范围内拥有\
  \ 20 多家医疗系统和制药客户。\n\n## Armorblox\n\nArmorblox 在两年前进入网络安全市场。其目的是保护客户免受社会工程攻击的影响，例如利用你的失误的钓鱼邮件。它使用自然语言处理技术，让机器能够学习和理解语言。其软件分析客户的沟通风格以感知语境，然后自动标记可能的钓鱼尝试、内部威胁或意外的数据泄露。\n\
  \n## DefinedCrowd\n\nDefinedCrowd 利用人类贡献者为客户构建定制的数据集。该公司通过一个名为 `Neevo` 的平台招募自由职业者，并为他们分配如标记图像或录制音频等任务，尽可能通过\
  \ `Machine Learning` 的自动化来加速他们的工作。所有由人类创建或检查的数据都会被汇成客户可用于训练算法的格式。\n\n## May Mobility\n\
  \nMay Mobility 正在以一种比汽车更具预测性的形式应对自动驾驶挑战。他们开发了自动驾驶穿梭车。该公司的软件已在罗德岛州普罗维登斯和俄亥俄州哥伦布支持穿梭车服务，你可以作为乘客乘坐自动驾驶穿梭车进行城市观光。\n\
  \n# 打造你更智能明天的人工智能初创公司\n\n不仅是大公司在向其产品和服务中注入人工智能。其他较小的公司也在努力开发它们的智能技术和服务。而且，他们表现得非常出色！这里有一份你今天可能不知道的智能初创公司列表，但它们将来将在很大程度上定义你的明天：\n\
  \n![image](img/scene_break.png)\n\n## Tempus\n\n总部位于伊利诺伊州芝加哥，主要关注健康科技、生物技术和大数据。Tempus\
  \ 使用 `A.I.` 大规模收集和分析海量的医疗和临床数据。该公司使用 `AI` 提供精准医疗，根据每个人的特定健康需求实现个性化和优化治疗。它依赖患者的可用数据（如基因组成和病史）进行诊断和治疗。Tempus\
  \ 目前正在使用 `AI` 在癌症研究领域取得突破。\n\n## DataRobot\n\n该公司总部位于马萨诸塞州波士顿。该公司为数据科学家提供了一个构建和部署\
  \ `Machine Learning` 模型的平台。该软件通过为数据寻找最佳预测模型来帮助公司解决挑战。该公司的软件用于医疗保健、制造业、保险、`FinTech`\
  \ 和体育分析。\n\n## Narrative Science\n\n总部位于伊利诺伊州芝加哥。Narrative Science 创建了 `Natural\
  \ Language Generation (NLG)` 技术，可以将数据翻译成故事。通过突出显示最相关和最令人兴奋的信息，无论员工对数据或分析的经验如何，都能更快做出决策。\n\
  \n## Cognitive Scale\n\n这家来自德克萨斯州奥汀的公司专注于软件和 `Cloud`。Cognitive Scale 为医疗、保险、金融服务和数字商务行业构建增强智能。其技术帮助企业增加客户获取和互动，同时改进账单和理赔等流程。Cognitive\
  \ Scale 的产品被 `JP Morgan`、`NBC`、`Chase` 和 `Macy's` 等大公司使用。\n\n## AlphaSense\n\nAlphaSense\
  \ 将模型集中在 `FinTech` 。它是一个 AI 驱动的搜索引擎，旨在帮助投资公司、银行和财富 500 强企业在大量的报告、新闻和研究中寻找信息。该技术利用人工智能扩展关键词搜索。\n\
  \n## Clarifai\n\n这家位于纽约的软件公司是一个图像识别平台，帮助用户组织、策划、过滤和搜索他们的媒体。该平台允许对图像和视频进行标记，教会人工智能显示哪些对象。\n\
  \n## Neurala\n\nNeurala 正在开发 `Neurala Brain`，这是一种深度神经网络软件，可以让摄像头、手机和无人机变得更智能、更容易使用。该公司的产品已在全球数百万设备上使用。`NASA`、`Motorola`、`华为`\
  \ 等大公司和机构也在使用这项技术。\n\n## NuTonomy\n\n该公司专注于为汽车和运输行业开发应用。凭借提供安全高效无人驾驶车辆的愿景，该公司正在开发用于全球城市的软件。该公司使用\
  \ `AI` 将制图、感知、运动、规划、控制和决策整合到消除驾驶错误的软件中。\n\n## Sift Science\n\nSift Science 提供全平台的欺诈管理服务。Sift\
  \ 利用来自网络的数千个数据点来检测欺诈模式。该技术帮助支付处理商、市场、电子商务商店甚至社交网络检测并防止欺诈。该公司的产品被 `Twitter`、`Airbnb`\
  \ 和 `Zillow` 等领先公司使用。\n\n## Zebra medical vision\n\n该公司开发了用于放射和医学成像的软件，增强了放射科医的诊断能力，同时让他们专注于患者护理。Zebra\
  \ 利用数百万临床记录和图像创建疾病检测算法。这些算法最终将帮助医疗人员尽早发现高风险患者，并以更准确的结果管理日益增长的工作。\n\n## Sherpa\n\n\
  Sherpa 是由预测性人工智能驱动的虚拟个人助手。`VPA` 连接用户的整个设备网络，推断并预测他们的需求。Sherpa 每天学习和分析超过 10 万个参数，以保持信息更新和用户井然。\n\
  \n## OpenAI\n\n它是一家非营利研究公司，其使命是创建安全的人工智能 (`AGI`)。`AGI` 的目标是创建与人类智能相似的通用机器。通过对长期研究和透明度的关注，该公司希望安全、负责任地推进\
  \ `AGI`。该公司已获得 `Microsoft` 和 `Amazon` 等大公司的赞助。\n\n## Tamr\n\n\n\n这家数据管理公司诞生于麻省理工学院的一个研究项目，旨在应用机器学习来清理和组织不完整或不一致的脏数据。Tamr\
  \ 的系统能够自动识别公司内部可以共同使用的数据源，并指定一名员工指导软件如何整合这些数据。该公司拥有如丰田（Toyota）、葛兰史（GSK）和通用电气（GE）等大客户。\n\
  \n## Bossa Nova Robotics\n\n这家初创公司已在 350 家门店（包括沃尔玛）推出了了大型、移动缓慢的机器人。这些机器人有助于保持货架充足。它的系统会读取价格标签以发现差异，并寻找货架上的空隙，从而向管理层报告这些问题。机器人可以轻松地在商店内穿梭，并以准确、及时且可靠的方式解读数十亿张图像。\n\
  \n## Pymetrics\n\n这个在线招聘平台通过超越简历中经验和技能的局限视角，帮助公司找到合适的员工。它拥有超过 80 家企业客户，包括 LinkedIn、埃森、万事达和联合利华。这些公司使用软件让其表现最佳的员工在评估过程中完成一系列测试。\n\
  \n当求职者申请在其中一家公司工作并亲自完成挑战时，Pymetrics 会提取出不同岗位的关键情感和认知特征。随后，他们会将这些人才与其能力最契合的工作进行匹配。\n\
  \n公司还利用该平台进行内部职业发展。它使流程更加高效，产出更好，并极大地增加了多样性。该公司目前正将其算法审计工具开源，总体目标是防止其系统强化性别或偏见。\n\
  \n## K health\n\nK health 开发了一项软件，让你无需进入任何医院即可获得医疗服务。该公司的消费者应用程序利用了超过 20 亿份匿名医疗记录的数据集，通过发送数据中的细微模式为用户提供个性化的健康建议。该公司还与保险公司\
  \ Anthem 合作，让成员免费查看医疗从业人员如何诊断和治疗具有相似症状的人。该软件还允许你与医生进行实时聊天，但需要支付费用。\n\n## 投资人工智能的方法\n\
  \n人工智能正在严肃地进入投资领域。从基金、股票到资金经理，AI 正以人们无法想象的方式渗透到投资领域。让 AI 对潜在投资者更具吸引力的事实是，AI 正在触几乎所有的现代行业，包括金融、国家安全、医疗保健、刑事司法、农业、交通等。如果你想参与投资领域的\
  \ AI 行动，以下是一些被高度推荐的良好投资建议：\n\n### 投资底层 AI 基金\n\n有广泛的人工智能交易所基金（ETF）供你选择。你可以根据管理费用来帮助自己选择合适的基金。选择费用较低的基金，因为这意味着更多的资金将用于投资而不是管理。通常，成立一年的\
  \ iShares Evolved U.S. Technology 收取 0.18% 的费用率，并使用专利算法选择技术股。你可以在一年内从投资中获得 23% 的回报，这是该类别平均水平\
  \ 10.77% 的倍倍。关于更多 AI 选项，iShares 提供了这些低费用基金：Evolved U.S. Consumer Staples ETF、iShares\
  \ evolved discretionary spending ETF、iShares Evolved U.S. Financial ETF 和 iShares\
  \ Evolved U.S. Media and Entertainment ETF。\n\n### 投资 AI 顶级股票\n\n如果你更倾向于投资股票并希望扩大你的\
  \ AI 股票投资组合，那么可以考虑投资这些公司：\n\n- `Micron Technology`（美光科技）—— 内存芯片制造商，可能从计算能力增长的需求中受益。\n\
  - `Nvidia corp`（英伟达）—— 这是另一家前景光阔的芯片制造商。该公司最近呈上升趋势，预计在未来几年内将发布积极成果。\n- `Baidu`（百度）——\
  \ 这是一家巨大的中国公司，正大力投入 AI。拥有约 14 亿中国人口的百度可以获取海量的机器学习数据进行使用和出售。随着中国政府在全国范围内部署 AI，该公司承诺将带来丰厚的回报。\n\
  \n### 投资专注于机器人的基金\n\n选股并非容易。你可能在挑选失败者和获胜者时面临挑战。如果你想避免这种与选股相关的风险，请投资基金。投资基金可以分散风险。机器人是一个经过训练以像人类一样执行工作的机器人领域。它是人工智能实践中的一个明确例子。你可以投资的两个热门机器人基金有：iShares\
  \ Robotic and Artificial Intelligence ETF(IRBO) 和 ROBO Global Robotics and Automated\
  \ Index ETF(ROBO)。`ROBO` 迄为止已获得 16.7% 的回报，而 `IRBO` 今年的回报为 19%。\n\n### 投资 AI 定制解决方案\n\
  \n大公司现在正使用 AI 来更好地理解和满足客户需求。此类公司使用大数据和 AI 来理解和分析购物、浏览和人口统计数据。这允许公司进行直接营销，并投放反映客户购物和浏览模式的产品和。。你可以投资此类\
  \ AI 定制解决方案来帮助改进你的业务运营，例如，麦当劳通过点餐机和外送服务接受了 AI 解决方案和技术。\n\n### 投资 AI 初创公司\n\n最近有数百家专注于\
  \ AI 研究的新初创公司出现。虽然这些公司的股票尚未上市，但你仍然可以通过 `Wefunder`、`SeedInvest` 和 `1000 Angels` 等初创投资基金对它们进行投资。\n\
  \n### 投资人工智能 ETF\n\n更多基于 AI 的 ETF 正在开发，但目前有两个 ETF 可以帮助你获得多元化的：\n\n- `Global X Robotics\
  \ and Artificial Intelligence ETF`（股票代码 `BOTZ`）\n- `Nasdaq Artificial Intelligence\
  \ and Robotics ETF`（股票代码 `ROBT`）\n\n## 投资的人工智能股票\n\n有几家公司领先让人工智能更多地参与你的生活。如果你更倾向于投资股票，那么这些公司预计长期来看将提供丰厚的回。这些公司包括：\n\
  \n### Google 股票\n\n该公司在许多 AI 项目上投入了巨大的资源。`Google AI` 是该公司的研究分支，公司已将其核心使命从移动技术完全转向\
  \ AI 研究。到目前为止，公司已开发了创新的 AI 产品，如 `Google Duplex`，这是一种复杂的 AI，能够通过完美模仿人类语音进行电话预约。`Google`\
  \ 是 AI 开发的领导者之一，也是寻求 AI 风险敞口的投资者的青睐。\n\n### Nvidia 股票\n\n`Nvidia` 股票一直处于每位投资者选择列表的前列。来自圣克拉拉（Santa\
  \ Clara）的芯片制造商 `Nvidia` 生产世界上最强大的计算机处理器。它利用了其在 AI 研究方面的独特技术。该公司最近通过与梅奥诊医学中心的合作，在大脑成像方面取得了了基于\
  \ AI 的突破。`Nvidia` 股票预计在未来几天内将上扬。\n\n### Microsoft 股票\n\n`Microsoft Azure` 是最强大的\
  \ AI 平台，它整合了广泛的工具以便更好地收集和分析数据。新首席执行官重振了公司，市场对这些变化做出了良好反应，投资者在过去几年中获得了丰厚的回。\n\n###\
  \ Salesforce 股票\n\n\n\n\n\nSalesforce 以对追求增长和扩张机会的痴迷闻名。这家客户关系管理软件巨头经常收购热门科技初创公司以完善其软件产品。2019\
  \ 年，该公司收购了 `Bonobo AI`，这是一家通过对客户电话、短信和聊天进行自动化分析来提供可操作洞察的公司。这些技术进步使 Salesforce 成为最值得投资的\
  \ A.I. 公司名单上的新成员。\n\n## Amazon.com 股票\n\n该公司的估值为 `$1trillion`，并且正在大力投入人工智能。Amazon\
  \ 使用 `AI` 来驱动关键能力，如预测产品需求、优化物流和仓储以及改进语音驱动的虚拟助手 `Amazon Alexa`。在全国范围内发布了约 360 个 `AI`\
  \ 职位，该公司正处于 `A.I.` 世界的最前沿。投资这家公司的股票将确保你获得丰厚的回报。\n\n## 如何创立 AI 初创公司\n\n人工智能是当下的热点。如果你在想如何如何建立自己的\
  \ `AI` 初创公司，那么这里有一些如何入门的简要步骤：\n\n### 选择你感兴趣的主题\n\n你需要选择一个你感兴趣的主题，以保持动力并投入到学习过程中。专注于一个现有问题并寻找解决方案。如果你不能成功解决客户愿意付费的问题，那么你的初创公司将无事可做。在走得太远之前，测试一下人们是否愿意为你计划要构建的内容付费。\n\
  \n### 玩转一场“数据收集/AI 构建”的游戏\n\n一旦你确定你的产品有现成的客户，就可以构建第一代 `AI`。你需要尽可能多收集涉及你个人项目的数据，然后对其进行筛选以确保其有用性，然后设计模型并对其进行训练。你需要注意的是，数据收集、筛选和训练的过程是你项目中最具挑战性的部分。训练模型是非常耗费精力且耗时的。你将把大部分解决问题的精力花在收集和理解数据上。\n\
  \n### 构建你的产品\n\n到此阶段，你应该拥有一个可以运行的 `AI`。你需要提高你的 `A.I.` 能力使其易于使用。这意味着你必须将你的 `AI` 打包成市场可以做出积极响应的产品。你的产品应该有一个具有一系列功能的用户界面。你的产品还能够在短时间内以负担得起的方式高效地解决它创建时要解决的问题。\n\
  \n### 开发改进你 AI 的方法\n\n一旦你启动了新的初创公司，你需要继续收集更多在训练 `AI` 时无法获得的数据。然后你使用这些数据来改进你的 `A.I.`\
  \ 以提高其准确性。确定你在规定期间内训练你的 `AI` 的次数。\n\n最后，如果你在建立初创公司时遇到任何困难，考虑参加以下在线课程：\n\n- `Learn\
  \ with Google` - 这是由 `Google` 启动的项目，旨在帮助你理解什么是 `A.I.` 以及它是如何工作的。它有一门针对初者的机器学习课程，如\
  \ `GOOGLE's TensorFlow`。\n- `Stanford University Machine Learning` - 该课程在 `Courser`\
  \ 上提供。课程可以免费提供，或者如果你想要证书则需要付费。该课程将让你熟悉 `A.I.` 驱动技术的示例。你还将学习软件工程的基础知识。\n- `Nvidia-Fundamentals\
  \ of Deep Learning for Computer Vision` - 计算机视觉是一门专注于创建能够像人类大脑一样分析视觉信息的计算机的学科。课程涵盖了必要的技术基础，以及目标分类和目标识别的实际应用。你还将学习如何构建你的神经网络应用程序。\n\
  \n## 全球人机交互 (HMI)\n\n### 什么是 HMI？\n\n人机界面是一种中央控制系统，用于通信操作员输入并接收来自 `PLC` 逻辑控制器的实时数据和反馈。`HMI`\
  \ 为控制系统内部发生的情况提供了必要的视觉化。它记录了关键生产信息，包括循环次数和不同工艺的配方。`HMI` 已成为新工厂设备和升级工厂设备以及过程控制系统中操作员控制的标准接口。\n\
  \n### HMI 与全球市场\n\n全球 `HMI` 市场预计到 2023 年收入将超过 `$8billion`。对安全、能源、更高生产力和可持续性的日益增长的重视，将导致全球人机界面市场的快速扩张。此外，工厂自动化系统中监控控制和数据采集\
  \ (`SCADA`) 以及可编程逻辑控制器 (`PLC`) 的实施，将在未来几年内改变市场格局。全球 `HMI` 市场是由半导体制造厂对控制中心和无净室日益增长的需求驱动的。\n\
  \n### HMI 市场 – 地理区域\n\n全球 `HMI` 市场分为`北美`、`亚太`、`欧洲`和`世界其他地区`。目前，该市场由`北美`地区主导。GDP\
  \ 的增长和经济放缓后的复苏是驱动北美 `HMI` 市场的主要因素。其他使北美主导市场的因素包括离散行业的发展增长、先进制造实践的高采用率以及对先进软件解决方案的需求不断增加。\n\
  \n然而，由于`印度`、`韩国`、`印度尼西亚`和`中国`等经济体快速增长以及这些地区自动化的增长，预计`亚太` `HMI` 市场将看到最高的增长率。\n\n\
  全球 `HMI` 市场的公司有：`ABB Ltd.`、`Advantech Company, Ltd`、`Beijer Electronics, Inc.`、`Honey\
  \ Wall International`、`Mitsubishi Electric Corporation`、`Siemens AG`、`General Electric\
  \ Co.`、`Kontron AG, Ltd`、`Rockwell Automation`、`Yokogawa Electric Corporation`。\n\
  \n### HMI 市场估计\n\n据估计，随着工业效率成为焦点，全球 20199 市场市场将扩大到 `$5579 million`。市场预计在 2013 年至\
  \ 2019 年之间的复合年增长率 (`CAGR`) 为 `10.4%`。全球 `HMI` 市场预计到 2026 年进一步增长到 `$8.96 billion`，复合年增长率\
  \ (`CAGR`) 为 `9.8%`。制造工厂对效率和监控日益增长的需求、工业物联网 (`IIOT`) 的演变以及对智能自动化解决方案的需求是推动市场增长的关键因素。\n\
  \n## 你可以关注的未来技术进展\n\n技术格局正在见许多进步趋于成熟。在十年内，许多进步将被接受为日常生活的一部分。它们将影响你如何生活、工作和娱乐。大多数将首先由商界推动，然后被更广泛的社会接受。以下是未来十年技术和创新可能改变方式的未来展望。\n\
  \n### 飞行出租车\n\n出行预计将随着飞行出租车的引入而改变。飞行出租车领域的实验正由共享出行供应商 `Uber Technologies` 作为其 `Uber\
  \ Elevate` 计划的一部分进行。该公司计划部署 `Uber Air` - 能够垂直起降的电动飞行器。\n\n\n\n\n\n十年后，手机将拥有你通常电影中看到的功能。这些功能包括全息投影。在未来几年内，全息显示将成为智能手机的常态。\n\
  \n你的手机还将演变为日益成为互联网和物联网（`IoT`）的一部分。未来的移动和通信设备无论你是在购物还是乘坐胶囊前往最近的 `Hyperloop` 站，都能唯一地识别你的手机。\n\
  \n## 无人机\n\n一个拥有无人机的未来可能比你想象的更近。全球范围内有数百万关于无人机使用的实验。`Amazon`目前正在开发用于送货的`drones`。还有公司正致力于开发无人机，为世界偏远的山区运送药品。\n\
  \n## 学校中的创造性学习\n\n从基础设施的角度来看，技术的进步将带来许多教学学习工具。一个很好的例子是虚拟现实，它让各种概念栩如生，在教室中营造沉浸式的环境。随着`Cloud`计算和存储的可用性，学生可以在任何地方访问他们的课程和工作单。\n\
  \n教师将不得不重新定义自己的角色。他们将成为解决问题的催化剂，并在学习过程中连接学生与行业，学习将变得高度互动性。\n\n––––––––\n\n![image](img/scene_break.png)\n\
  \n## 医疗服务\n\n你不再需要去医院寻求医疗服务。你可以在家里获取这些基本服务。例如，初创公司和医疗技术公司正在制造大型扫描设备的便携版本。这些新一代设备使居家成为成为。此外，能够全天候监测患者并将数据安全上传到`Cloud`中患者健康记录的可穿戴设备已成为现实。它们允许医生对患者状况的变化引起，并帮助他们确定疾病的严重程度。\n\
