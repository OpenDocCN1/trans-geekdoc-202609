  \ Ozlo。行业正在通过与每个程序员的每一次交互，将 Ozlo 培养成一个优秀且高效的助手，并成为你日常生活中有用的一部分。\n\nMatt Zeiler,\
  \ Clarifai\n\n为了让 AI 与现实世界产生交互，它们首先需要看到这个世界。这正是 Matt 的公司 Clarifai 发挥作用的地方。该公司帮助运营图像和视频识别平台，许多\
  \ AI 产品在在未来几年内将使用这些平台。\n\nNikhil Budama, Remedy Medical\n\n毕业后，Nikhil 和他的团队一直努力让医疗健康对每个人都更加易获得和管理，并提高医生的专注力和专业水平。Remedy\
  \ Medical 能够帮助医生处理行政任务，并让患者获得更好的照顾。\n\nRand Hindi, Snips\n\n人们认为他处于创造在背景中消失并运行的智能技术的行列。他与\
  \ Snips 的整个明星团队一起，正在制造一种不加修饰、即插即用的人工助手。\n\nRiva Tez, Permutation Ventures\n\nRiva\
  \ 以作为 AI 投资者和传教者而闻名，将影响医疗和 AI 的问题带入讨论的焦点。在克服了个人逆境后，Riva 现在正致力于改变 AI 和风险投资行业。\n\n\
  Shivon Zilis, Bloomberg Beta\n\n作为市场生态体系的策展人，Shivon 将机器智能带入了地图。你可以寻找 Shivon 来影响\
  \ AI 公司的方向，尤其是在他们未来几年内获得他们所需要的支持以进行改进之后。\n\nSinan Ozdemir, Kylie\n\nSinan 曾是约翰霍普金斯大学的数据教授，目前是\
  \ Kylie 的创始人，这是一个通过克隆员工特征来自动化行业与买家之间交互的 AI。他是《数据科学原理》的编辑。\n\nCom Labs 团队\n\n在 10\
  \ 强名单中将会是 11 位，你不能错过来自 Comet Labs 的这个团队。他们专注于将 AI 和机器人行业引入市场，汇聚了第一阶段基金支持的实验室，并与全球大公司建立了合作伙伴关系。\n\
  \n 贡献\n\n以下是对客户体验的某些影响\n\n### 智能普及 (The Smart Spread)\n\n你必须考虑你在口袋里想要什么。不要考虑硬币。这是因为你处于一个特定的门户，人类的每一份知识都在那里形成。不要再对此惊叹了，而是认为你的智能手机是神奇的。它是一个数字助手，可以回答问题、规划你的生活，并立即连接到全球的资源。不要认为这只是你的手机，你周围的每项技术都在变得方便。在某些情况下，你的冰箱可以提醒你牛奶水位低；热水壶在你醒来时自动加热；汽车拨打紧急服务；通过与智能音箱对话获取食物。你可以拥有\
  \ AI 牙刷，它可以绘制你的口腔地图并给你一份报告。现在一切都有连接，我们生活的生活和正在使用的技术正是科幻梦。试着回想对比十五年前，这一切成长有多快、多完美。\n\
  \n### 回顾过去\n\n你能回想起互联网易于访问的时代吗？那些是你依靠 `CD-ROMS` 获取数据的日子，或者你可以去图书馆。当手机还没有地图时，人们只能拿着一张\
  \ `A-Z map` 来导航。你可能还没有老到可以考虑这些，但你仍然可以想起慢速网络的艰难时刻、手动设备上令人厌的规则以及缺乏 `Wi-Fi` 连接的手机。你必须等待并保持耐心。互联网是可选的，访问它需要通过安装一系列各种技术的压力过程。自从实时革命发生以来。这正如其名所言，它是我们周围大多数事物在实际时间内发生的现象。\n\
  \n### 实时革命\n\n它让我们的个人生活变得简单，并改变了我们与世界各地交流的方式。随着这种改进，你对立即获得信息或数据有了期望。这是 AI 对客户体验的第一大影响；对技术有很高的预期。你应该预期与技术的通信是毫不费力的，任何不快速且易用性差的东西都会像刺出的手指一样显眼。当你仍在关注时，实时革命悄悄渗透到你的周围并改变了你的生活。\n\
  \n### 企业是如何应对的？\n\n待填补的巨大鸿沟\n\n我们的个人生活变得越来越舒适。这让企业很难让你感到兴奋。你可以在家里拥有流畅的、AI 驱动的突破，你也会在与公司的交流中期待流畅的、AI\
  \ 驱动的进展。这并不意味着企业正在交付并提供他们的最佳水平。你们都会感到沮丧，比如当网站在手机上无法正确加载时，他们没有收到电子邮件且访问客户服务非常缓慢。说变化没有发生可能是错误的。贸易可能似乎无法像\
  \ Siri 那样快速地服务你，但由于技术正在变得聪明。品牌正在使用哪些技术来跟上？\n\n#### 聊天机器人 (Chatbots)\n\n有聊天机器人，在家里，你也有\
  \ `Google assistant`，再次当你在线时，就有机器人。许多企业正在将聊天机器人引入他们的网站，从而为客户运营提供 24/7 全天候的服务。你可以回想起过去拿起手机与一家公司通话的日子。直到现在，你仍然发现自己处于需要花费大量扫描的\
  \ `FAQ` 部分。可能会有某一次你想要退款或更新电子邮件地址。聊天机器人的加入改进了结束这些缓慢活动的效率。它们在几分钟内提供你查询的答案，并在它们应该提供的任何帮助方面变得越来越聪明。\n\
  \n聊天机器人在回答你的 `FAQ` 和完成创建新密码等简单任务方面表现最好。当 AI 驱动的聊天机器人引入市场时，你将从中受益。新的机器人使用机器学习和自然语言处理来真诚地理解你的意思和情绪。它们可以维持人性化的双向交互，让你获得与真实客服人员相同的体验。快速高效的全天候交互是\
  \ AI 对客户体验的一个重要方面。\n\n#### 电子商务个性化 (E-commerce Personalization)\n\n\n\n\n这并不是在线获取的最明智的内容。你可以看到诸如\
  \ `WebVR` 之类的应用，例如在决定购买眼镜之前，你可以看到它们戴在自己脸上的样子。你可以看到 360 度网站，它们让你沉浸在艺术设定中，并允许你与视频游戏等板块进行互动。生物识别技术也在兴起，你的\
  \ `iPhone` 可以通过面部解锁。商标品牌已经将这项技术应用于现代化的结账。这增强了使用指纹完成 `PayPal` 交易的功能。很快，你将进行通过面部或语音识别验证的交易。AI\
  \ 比人类更了解人类，从而改进并带来了在线领域的变革。\n\n# 让你的入职流程更顺畅\n\n不仅仅是浏览变得更加毫无阻碍。你还记得上一次在线下载应用、数字商品甚至免费软件试用版是什么时候吗？下载需要多久？我猜你下载了各种组件来让它运行，你是否经历过查阅说明书？所有费劲的入职体验都已成为过去。据业内所知，尽管具有权威性，客户在家里正在使用不需要大脑就能激活的技术。这带来了服务的精简化化，可以帮助你在几分钟内开始运行。只要你运行起来，只需点击一下即可升级，或通过安全的自助服务区域轻松管理你的账户。我们忘记了那些需要收集多种不同信息或软件来设置数字商品的日子。一切都在回到实时革命，人们已经完全没有耐心了。人们正习惯于更好的体验，并对企业有更高的期待。\n\
  \n![image](img/scene_break.png)\n\n# AI 对消费者的影响\n\n## 客户服务成本\n\nAI 对客户体验的影响并非完美。`Wepoons`\
  \ 允许客户通过应用程序订购购买食物，从而让你坐下耐心地等待付费的餐点。这既简单又高效；但体验可能会被一个送餐时粗粗心的服务员所破坏。技术确实可以增加任务的速度和交易量，这毫无疑问。但再次，某种程度的技术可以保护你的行业免受糟糕客户服务的困扰。AI\
  \ 可以承担这种风险，并可能摧毁或成就你的体验。技术被认为是巨大的，但许多企业无法负担员工机器人化的成本。你可能爱上了精湛的技术，但客户仍然想要亲切的人情味。\n\
  \n## 竞争对手还是兄弟？\n\n你必须理解为什么人们热爱人类的感觉或触碰。机器是聪明的，但它们并不像人类那样遵循我们。这存在某种障碍。你和机器人之间可以分享笑话，但你无法分享微笑。AI\
  \ 无法识别你讽刺的语气或冷幽的幽默感。机器人接待员不会理解你皱眉毛意味着什么，聊天机器人也不会意识到“哇”代表什么。依赖 AI 的企业面临疏远买家的风险，并可能增强糟糕的机器人体验。想象一种情况：当你感到沮丧并想找人说话时，你会选择有同理心的人类还是机器？\n\
  \n## 并非全都是惨淡\n\n当 AI 被微妙地用于协助服务而非主宰服务时，它拥有一席之地。用好它将影响 AI 对客户体验的影响，从而变得轻松且高效。AI 迫使我们提供\
  \ 24 小时服务。你可以在深夜任何时候访问公司网站，通过他们的机器人提问并立即获得答案。你会意识到你不是在和人类对话，但这并不重要。你不能指望在午夜联系人工操作员，在那个时间能得到帮助你就已经很高兴了。AI\
  \ 是网购的巨大助力。`North Face` 是一家利用 AI 改进运营的公司示例。`North Face` 帮助在线买家获得他们的完美商品。语音输入技术的使用询问买家以及他们何时行使权利。这创造了极佳的体验。\n\
  \n## 离线 AI\n\n并不是一切都关在线，因为 AI 将帮助你在实体店获得更好的服务。你必须考虑 `geolocation`。你必须知道在哪里以及谁允许交易实时发送给你。如果你是咖啡爱好者，而周围恰好没有，那么有一个吸引你喝最爱卡布奇的优惠就是一个优势。AI\
  \ 对人类的外表感兴趣。技术会根据时间和日期调整广告。这为每个人带了极大的定制化广告体验。面部识别现在已被捕捉。你可以开始根据店内的停留时间在电脑屏幕上看到优惠。\n\
  \n## 精细的平衡\n\n这是 AI 作为简化客户旅程的新颖补充的一个例子。当你习惯了这一点，AI 对客户体验的影响将令人印象深刻且智能。\n\n# AI 对公司的影响\n\
  \n## 自动化焦虑\n\n你已经看到 AI 如何影响客户；你也可以询问它对行业测试及其实施产生的影响。如果你声称 AI 将立即为行业带来便利和快乐，那就太天真了。在\
  \ AI 为办公室带来普遍快乐之前，有一系列障碍需要克服。你必须考虑到世界正陷入自动化焦虑，这导致了恐惧。AI 已经推出了日益复杂且负担得起的发展，人类可以被取代。每个人都担心机器人和自动化流程将夺走人们的工作。这并不意外，因为\
  \ AI 现在甚至在接管营销等白领工作。机器人可以执行的任务正在不断扩大。在办公室里，许多复杂的技巧正在被启用，从而创建了可以自动执行困难任务的软件。随着 AI\
  \ 的快速发展，大多数人类倾向于发现自己的工作面临风险。\n\n## 士气低落\n\n对于想要引入 AI 的行业来说，这将带来士气挑战。老板们需要考虑在团队中引入\
  \ AI 时可能产生的影响。员工可能会开始恐慌并担心失去工作。他们可能会与他人互动并在整个办公室传播传言。这可能导致许多员工开始寻找其他工作地点。AI 的实施意味着交易商看到员工士气断崖式下跌，并对生产力产生负面影响。这是大多数老板没有考虑的。`C-suite`\
  \ 最终关注指标，他们的奖金与资金的增长挂钩。\n\n## 改变\n\n在工作场所引入 AI 带来了工作场所领导力运作的重大转变。人类和 AI 如何在集成办公室中合作？对工作场所领导力培训的需求增加集中在\
  \ AI 上。老板们应该有效地管理由机器人和人类组成的环境；因此，领导这样的地方并非易事。必须升级技能来带来这种变化。许多改进正在自动化，从而导致了工作的演变。交易商正忙于为\
  \ AI 准备工作场所。**\n\n## 信任至关重要\n\n\n\n\nAI 对客户体验的影响可能给品牌带来风险。如何才能让 AI 在不被怀疑的情况下像人类一样工作？当你拥有一个自动化功能时，将缺乏共情、情感、谈判和危机处理等人性化技能。这会给用于客户情境的\
  \ AI 带来问题。你必须有一项要求，即保持与人工代理而非机器人交流的能力。某些查询可能需要代理进行深度思考并对买家产生同理心。考虑到这一点，你无法完全信任 AI。公司运营可能尚未准备好\
  \ AI，而 AI 可能也没有准备好整合到公司运营中。当你以错误的方式处理 AI 实现时，对公司运营可能会产生比之前糟糕的负面影响。这可能会让买家感到不满并降低员工士气。\n\
  \n## 反面观点\n\n这可能是硬币的一面，风险随着 AI 而来，与此同时，也将获得或整合一些奖励。通过引入 AI 节省资金，你将迈出巨大的一步。这是因为它提高了效率，并帮助行业管理时间、资源和能量。AI\
  \ 系统可以支持大量工人，帮助你工作得更快，做出更明智的决策。AI 还具有某些智能，可以纠正人类错误并具有预测性思维，即可以讨论并告知业务智能的数量。这有助于增强你的体验，并为你留出改进与客户互动的空间。这表明\
  \ AI 可以帮助买家开心并优化你未来的机会。你还应该考虑它的竞争性。AI 还没有那么发达，当你开始部署它时，就有成为未来领导者的机会。你应该足够明智地利用技术趋势，成为发展领域的专家。不要将其对人类工作的负面影响。从另一方面来看，AI\
  \ 可以带来更好的工作水平，并消除生产过程中烦人的行政工作。\n\n## 未来展望\n\n### 你无法轻易解释 AI 将如何发展，但许多专家在任务开始增加时已经看到了一些迹象，这使得计算机变得更容易处理。在未来的十年里，AI\
  \ 将能够接管人类每天从事的困难工作和耗时任务。AI 的影响将主要取决于半人人。机器人操作可能会增加。在普通世界中，你可以想象商店里的 AI 可以根据客户的需求选择播放的音乐。AI\
  \ 还可以决定人群喜好的壁纸或艺术品。\n\n### 数字世界\n\n不仅物理空间将是智能的。像 `Siri` 和 `Google Assistant` 这样的服务将继续活跃，并很快就能在任何时候针对任何话题提供真实的协助。对于复杂的思维博客预测，许多人将不同意\
  \ AI 将脱离 2D 屏幕的限制来征服数字技术。你的主程序界面可以变成你周围的物理环境。回顾历史，你可以依靠 2D 显示器玩游戏或与网站通信，即你可以看到 AI\
  \ 和互联网的进步；因此，这可以被环境取代。你也可以在教室里使用 `VR-kits` 进行全规模的学校远足，在会议室里展示可以感知的三维体验的表演。没有人能告诉虚拟世界最终会比现实世界更好。\n\
  \n### 思考的力量\n\n当你向远看时，你会发现我们正处于一个 AI 完全不需要任何接口的节点。今年早些时候，你看到马克·扎克伯格宣布 `Facebook`\
  \ 正在开发一种直接的心脑接口，让你只需通过思想就能导航技术。他不是唯一致力于心脑接口的人。埃隆·马斯克正在创造一种脑机接口，可以在没有任何输入机制障碍的情况下将人类连接到计算机。输入一直被认为是一个重大阻碍，人们认为界面将打破许多前所未有的瓶颈。办公室里的员工将不得不通过向\
  \ AI 系统发送思想来用大脑控制机器。AI 将无处不在，隐形但从我们的思想中获取。\n\n# 第 6 章：AI 应用：\n\n# AI 在金融、医学和商业领域的影响\n\
  \n“挖掘小行星最终将以多种方式造福地球内外的人类。”\n\n彼得·迪亚曼迪斯（Peter Diamandis）\n\n人工智能或增强智能具有重要意义，因为它可以帮助解决不同领域的主要棘手问题，例如制造、零售、医学、娱乐、运输和公用事业。人工智能的应用可以归纳为以下几类：\n\
  \n*   **数据**：展示有关世界信息的能力。例如，财务管理、资产交易预测、法律评估、游戏和自主武器系统。\n*   **推理**：通过逻辑推演解决问题的能力。例如，广告、营销和预测分析。\n\
  *   **管理**：设定并实现目标的能力。例如，库存管理、需求预测、预测支持、物理和高级系统增强、导航、预订、物流。\n*   **通信**：理解书面和口语的能力。例如，对口语和写作语言的持续解释、持续翻译、AI\
  \ 虚拟助手、语音控制。\n*   **观察**：利用声音、图片和其他实体信息解释有关世界事物的能力。这种功能的例子是医学诊断和治疗、自动驾驶汽车、监控。\n\n\
  ## 商业中的 AI\n\n人工智能基本上是计算机代码的复兴。它是可以自主决策的计算机代码，即使在发生意外事件时也能行动。与传统软件相比，AI 具有更广泛的决策权限。这些特性使人工智能成为各个行业的宝贵资产；无论是帮助客户和员工更快速地开发公司方案，还是执行监控隧道以预测下次维护的复杂任务。\n\
  \n机器学习通常用于处理大量数据的系统。例如，智能能源管理系统从安装在不同资产上的传感器收集数据。机器学习算法会对这些数据库进行上下文处理并交给人类决策者，以更好地感知能源和维护需求。\n\
  \n许多企业采用人工智能技术来降低运营成本、提高效率、增加收入并改善客户体验。\n\n AI 对业务的影响\n\n通过部署正确的 AI 技术，你的业务可以：\n\
  \n1.  通过自动化和优化常规流程和任务来节省金钱\n2.  提高生产力和功能效率\n\n\n\n\nAI 为当今业务活动和功能提供的自动化潜力已经远远超过了历史上的流水线。在许多业务职能中，如推广和分发，AI\
  \ 已经准备好加速流程，并为决策者提供可靠的洞察。以广告为例，市场细分和活动管理的自动化使得许多结构良好的决策和快速行动成为可能。你将获得关于客户的有价值的洞察，这可能帮助你增强与他们的互动。营销自动化是适当的客户关系管理应用中最实用的功能之一。\n\
  \n### 3. 利用认知功能技术支持的输出做出更快的业务决策\n\n每一项营销决策都涉及多个复杂性。你必须观察并理解客户的欲望和需求，并将商品与这些欲望和需求对齐。同样，深入理解修复客户行为对于在短期和长期创造最有效的销售选择至关重要。`AI`\
  \ 建模和模拟技术为你的买家画像（personas）提供了可靠的洞察。\n\n### 4. 只要 AI 系统创建得当，就可以避免错误和“人为错误”\n\n人为错误的范围仍然远大于\
  \ AI 错误的范围。而且，AI 错误的供应来源主要是人为错误。需要投入投资来改进对每种错误的检测，以减轻其影响。随着人类和机器的共同演进，新错误出现的概率将增加（而传统错误将减少），这需要足够的风险管理工作。\n\
  \n### 5. 利用洞察预测客户偏好并为他们提供更精彩的个性化体验\n\n组织正在利用 `AI`，因为它允许他们向客户提供个性化的促销，这将不断增加参与度，有助于提高客户忠诚度并提升销售额。`AI`\
  \ 的另一个优势是它准备好识别客户浏览习惯和购物行为中的模式，从而使企业能够为单个客户制定极具针对性的报价。\n\n### 6. 挖掘海量数据产生高质量线索并扩大客户群\n\
  \n基于云的 `AI` 应用非常先进，它们在处理大数据时能够迅速发现关键信息和相关发现。这一功能为企业提供了此前未被发现的数据的洞察，使它们在市场中拥有更高的优势。\n\
  \n### 7. 通过关注和增加销售机会来增加收入\n\n先驱者看重产生收入的应用而非节约成本的应用。成为 `AI` 先驱是产生可能不可逾越的竞争优势的最佳优势。\n\
  \n### 8. 通过实现预测和风险分析并提供智能建议与支持来积累经验\n\n最后，`AI` 的卓越之处在于它能够根据数据分析预测结果。例如，它能检测到客户信息中的模式，以显示正在出售的商品是否可能售出，以及售出的规模。它甚至可以预测此类商品需求减少的时间表。这些信息对于企业以正确的数量购买正确的库存至关重要。\n\
  \n在业务中采纳 `AI` 的最大动力是竞争优势。此后，动力来自：\n\n*   高管领导的决策\n*   特定公司的运营或技术劣势\n*   内部实验\n*\
  \   客户需求\n*   对问题的即时回答\n*   另一个项目的影响\n\n## 业务的 AI 机遇\n\n你考虑 `AI` 的原因并不重要；它的潜力足以改变你业务的运作模式。开始所需的仅仅是开明的视角以及在可行任何时候和任何地拥抱新机会的性格。\n\
  \n然而，请记住 `AI` 是一项新兴技术。因此，它是动态且快速节奏的，应该带来一些挑战。\n\n## 业务中 AI 的风险与局限性\n\n虽然市场上存在多种\
  \ `AI` 业务机会，但也有某些需要注意的障碍和缺点。\n\n实施 `AI` 的主要障碍之一是数据可访问性。数据经常被归档或质量低下，这些都为试图从中创造价值的企业带来了挑战。为了克服这一点，你必须对你所依赖的数据源有一个透明的规划。\n\
  \n`AI` 的另一个关键障碍是技能短缺，因此部署和运行所需的人员匮乏。研究表明，经验丰富的数据科学家非常稀缺。\n\n成本是 `AI` 的另一个主要考虑因素。缺乏内部技能或对\
  \ `AI` 缺乏经验的企业通常需要外包，由于其先进性，这些技术价格高昂，你还将产生维护和改进的成本。训练数据的处理可能也是一项额外支出。\n\n\n\n\n\
  美国金融体系依赖于对经济贡献的报酬，这通常使用每小时工资进行评估。大多数企业仍沉迷于涉及产品和服务的时薪工作。然而，通过使用 `AI`，组织机构可以大幅减少对人类的依赖，这意味着收入可以重新分配给更少的人。因此，拥有\
  \ `AI` 驱动型企业的人可以积累所有的财富。\n\n### 3. 机器交互对人类行为的影响以及机器交互的结果\n\n虽然人类在某种程度上受到他们对他投入的注意力和善意的限制，但人工智能机器人会将近乎无限的资源投入到与人类建立的关系中。这仅仅是一个时代的开始，在这个时代里，我们将更频繁地与机器互动，就像它们是人类一样。\n\
  \n### 4. 需要处理信息中源于人类偏见的算法偏见\n\n尽管计算机科学在速度和处理能力上已远超人类极限，但并不能永远地信任它是诚实且公正的。`Google`\
  \ 及其母公司 `Alphabet` 是计算机科学和`人工智能` 领域的领导者。正如 `Google` 的照片服务所示，`AI` 被用于识别人物、物体和场景，但它有时也会出错。例如，相机曾失去对种族敏感性的识别，或者一个习惯于预测未来犯罪犯的软件系统对非洲裔人士表现出偏见。我们不应忘记，`AI`\
  \ 系统是由具有偏见和判断力的人类创建的。再次，如果使用得当，或者由那些追求社会进步的人们使用，`AI` 将成为积极改进的催化剂。\n\n### 5. 可能造成伤害的\
  \ AI 系统（例如自主武器）的安全性\n\n技术变得日益强大，它被用于犯罪或善意目的也越多。安全忧虑不仅适用于替代人类士兵的机器人或自主武器，还适用于可能在被恶意使用时造成伤害的\
  \ `AI` 系统。由于这些战斗将不仅在战场上进行，网络安全已变得更加必要。毕竟，我们正在对付一个比我们快好几个数量级且能力更强的系统。\n\n### 6. 需要减轻非计划后果，因为智能机器被可靠地认为是可以独立学习和发展的\n\
  \n当我们倾向于构建技术时，我们想要了解用于人类和动物的奖励与规避机制。对于机器人来说，这些系统部分是表面的。然而，它们正在变成更优雅的系统。在这种情况下，一旦机器获得负面输入，它是否会遭受痛苦？某些`遗传算法`会快速产生系统的多个实例；然而，只有最成功的能生存下来，其余的会被删除。\n\
  \n虽然你无法忽视这些风险，但有必要记住，`AI` 的进步在很大程度上将为每个人带来更好的业务和更高质量的生活。如果被负责任地执行，`AI` 具有强大且实用的潜力。\n\
  \n# 金融领域的 AI\n\n在 `AI` 在零售和制造业等领域取得巨大成功后，它目前已准备好转型银行业和金融服务。以下是银行将立即利用的几个用例。\n\n\
  金融公司信任计算机和数据科学家来确定市场的未来模式。商业化主要取决于准确预测长期趋势的能力，而没有比极短时间内处理海量数据的机器更胜任这项的任务了。机器可能会观察历史数据中的模式，并预测这些模式在未来可能如何重复。激进的数字化驱动因素包括：\n\
  \n- 传统银行与敏捷的 `金融科技` 及纯数字银行之间无休止的竞争，这对进步服务的客户具有吸引力。\n- 经济中多个部门采用的新型目标自动化、大数据、分析及相关创新，加上金融需要一种敏捷的设计来支持数字系统。\n\
  - 客户变得日益数字化和精通技术，尤其是新一代，特别是三十五岁以下的人群，他们需要在线并利用所有数字优势。\n\n在高频交易时代，金融公司正在开发 `AI` 解决方案以增强股票表现并增加利润。银行和组织的数字化转型对于利用最新技术和优化效率至关重要。\n\
  \n## App 内银行服务\n\n如今，几乎所有银行都有至少一个执行日常银行业务的应用程序，如查询余额、进行交易以及订购支票和卡。然而，少数银行在其应用中使用\
  \ `AI` 来提供卓越的客户体验。基于自然语言处理的 `AI` 聊天机器人可以快速高效地为银行客户处理诸如开户、转账、支付账单等任务。\n\n## 销售流程\n\
  \n聊天机器人更擅长客户的基础查询。它们将作为虚拟员工。聊天机器人拥有独特的算法，协助公司以最少的人工干预与客户无缝协作。\n\n销售人员有工作时间和信息的限制。智能系统没有这些限制。只要系统提供数据，它们就可以回答客户的任何查询。\n\
  \n––––––––\n\n![image](img/scene_break.png)\n\n## 交易\n\n如今，投资公司正寻求数据科学家而非市场专家来观察股票的长期趋势。数据科学家产生复杂的机器学习算法，通过观察历史数据中的趋势来发现未来的模式。这些算法可以在几秒内消耗数比特的数据，并可能被训练用于识别市场异常异常。此外，个人交易者可能会利用\
  \ `AI` 来做出决策，例如何时买入、持有或出售股票。\n\n## 合规控制\n\n每个金融机构都面临着高标准的审查。银行每分钟产生海量信息。识别洗钱、市场操纵、外国监管合规、隐瞒等等行为需要几个月的时间。\n\
  \n## 风险分析\n\n由于能够处理不确定性、不完整和不准确的规范、模糊性和定性数据，人工智能技术被风险分析。一旦需要处理和评估非结构化数据，人工智能与风险管理就会契合。可以预见，金融机构的风险经理正通过\
  \ AI 发现，以非常主动的方式专注于分析和阻止损失，而不是在管理运营过程中的固有风险上花费时间。\n\n\n\n\n\nAI 解决方案已准备就绪，为金融机构提供可靠且及时的信息，以帮助其构建客户智能方面的能力，并确保其方法的落地实施。\n\
  \n## 预测分析\n\n正如其名所示，预测分析能够“预测”客户的未来状态。AI 规则可以预测，如果客户继续像现在这样支付和投入现金，他们的状态将会如何。机器算法还可以充当客户的私人财务顾问，为其提供如何改进其状态的建议。\n\
  \n## 数据富化\n\n对于某些每天多次花费和接收现金的人来说（例如商户）来说，交易数据通常是详尽的。交易数据通过将交易进行分类，将难以理解的交易信息转化为易于理解的信息。它帮助客户监控信用评级、预算、消费习惯、分析，并预测未来的收入和支出。\n\
  \n## 欺诈识别\n\n全球交易的数量以及单笔全球交易的金额正像病毒一样倍数增长；在线欺诈的威胁也是如此。标准的在线欺诈检测算法仅考虑了几个数据点，而基于 AI\
  \ 的算法考虑了多多的数据点以发现欺诈。欺诈检测是 AI 在金融服务中的一项显著应用。例如，万事达（MasterCard）使用 `Decision Intelligence`\
  \ 创新来检查识别伪交易的不同数据焦点，提高持续背书的精度，并减少不必要的交易延迟。机器学习算法帮助这家支付和科技巨头万事达减少了百分之五十的欺诈活动。\n\n\
  存储了过去多年的银行记录，银行可能已经对所有交易信息进行了标记。参与机器学习模型的客户银行的欺诈顾问在系统训练期间必须标记出欺诈交易和非欺诈交易。由于软件系统接触了大量标记的交易，它在区分欺诈和真实银行业操作方面的能力正在逐步提高。\n\
  \n## 智能贷款\n\n银行在信用评分系统的支持下向客户提供贷款。它考虑了他们的银行历史、收入、税收等因素。但是，对于那些所有财务信息都记录良好的客户，他们占据了优势。然而，大多数银行服务不足的贷款申请人在银行记录中并没有他们的财务信息。\n\
  \n新的基于 AI 的信用分类系统可以从银行服务不足客户的手机中收集财富知识，以识别他们的信誉。这些不同的数据点可以为这些客户从贷款银行获得贷款提供新途径。\n\
  \n## 财富管理\n\nPlay Store 和 App Store 提供了各种财富管理应用程序，方便客户管理自己的财富。这些应用利用客户的支票账户详情。银行具有远见，通过引入应用内个性化的财富管理系统来抢夺客户。这些由\
  \ AI 驱动的顾问不断从我们的资金活动中学习，并向客户提供最直接的建议，就像客户经理所做的那样。\n\n随着 AI 的出现，银行金融领域正在回归数字革命。在银行金融领域引入\
  \ AI 的目的是提供愉悦的客户体验。它帮助客户将注意力从理解大量的银行术语和流程中转移出来，转而关注那些对他们最重要的事情。专家预测，未来基于 AI 的银行移动应用开发服务的前景比大多数人认为的要光明。\n\
  \n金融服务机构使用基于 AI 的自然语言处理工具分析网络兴趣中的品牌观点，并给出重要的建议。\n\n## 医学 AI\n\n医疗行业是 AI 技术采用率最高的领域之一。这归结于\
  \ AI 快速计算数字和从历史信息中学习的能力，这在业务中至关重要。\n\nAI 可以为医生和急诊室工作人员提供数据驱动的临床决策支持（`CDS`），以准备挖掘更大的收入潜力。AI\
  \ 的子集 `ML` 旨在识别模式，利用计算和信息为医疗保健提供者提供自动化的数据片段。\n\n例如，Cambio Health Care 开发了一套用于中风检测的临床决策支持系统，可以在患者有中风风险时向医疗人员发出警告。另一个采用\
  \ AI 方法的公司示例是 Koala Life，他们开发了一种 AI 驱动的设备，能够识别内部器官疾病，如心脏骤停。\n\n人工智能和 `ML` 创新对医疗行业特别帮助，因为它产生了海量数据待准备，并执行计算以比人类专家更快地发现设计。例如，Medecision\
  \ 如何构建一种算法来识别糖尿病患者的八个因素，以决定是否需要住院。\n\n### 临床应用\n\nAI 的最佳用例是增强智能，它通过为医生和护士提供及时的、数据驱动的建议，允许他们发挥最佳水平，他们将根据个人经验和对当时情境的判断来接受、拒绝或修改这些建议。\n\
  \n### 保持健康\n\nAI 最突出的潜在优势之一是帮助个人保持健康，这样他们就不需要看医生，或者至少不需要那么频繁。公共健康应用中 AI 以及医疗物联网（`IoMT`）的使用已经在为个人服务。\n\
  \n技术应用和程序通过主动管理健康的生活方式，鼓励人们和机构采取更健康的行为。它将个人置于健康和福祉的顶端。\n\n此外，AI 将增强医疗专业人员更好地感知他们所照顾的个人的常规模式和愿望的能力，在理解这些之后，他们准备好为保持健康提供更好的反馈、指导和支持。\n\
  \n### 检测\n\nAI 已被应用于更准确、更早地观察疾病（如癌症）。与美国癌症协会的一致，很大比例的乳腺 X 线检查会产生假性结果，这意味着每两个健康女性中就有一人被告知患有癌症。AI\
  \ 以百分之九十九的准确率对乳腺 X 线进行审查和解释速度快三十倍，减少了对过度活检的需求。\n\n### 诊断\n\nIBM 的 `Watson for health`\
  \ 帮助医疗机构应用认知技术特性来解锁大量的健康信息并加强诊断。Watson 将比任何人类都要快地审查和存储更多的医疗数据——全球范围内每一份医学期刊、症状以及治疗和反应的案例研究。\n\
  \nGoogle 的 `DeepMind Health` 正与医生、研究人员和患者合作，以解决现实世界的健康问题。该技术结合了机器学习和系统神经生物学，将强大的通用学习算法创建到模拟人类大脑的神经网络中。\n\
  \n## 治疗\n\n\n\n\n\n人工智能不仅可以扫描健康记录以协助医生识别可能面临病情发作风险的慢性病患者，还将通过更好地协调护理计划，并帮助患者建立、管理和调整其长期治疗方案，助力临床医生采取一种全新的疾病管理综合方法。\n\
  \n机器人在医学领域已应用了三十多年。它们种类多样，从简单的实验室机器人到极其先进的手术机器人不等，后者既可以辅助医生的医疗工作，也可以独立执行手术。它们不仅用于手术，还被用于医院和实验室的重复性任务，例如康复治疗、物理医学以及对长期疾病患者的辅助。\n\
  \n## 功能应用\n\n医院运营是一个复杂、迥然不同且深度互联的系统——这可能就是为什么在操作上，要同时实现资产的高利用率、短的患者等待时间以及为寻求预约的患者提供极其多样化的时段是极具挑战性的原因。日常运营需要医院管理人员层定期做出许多选择。遗憾的是，很少有一天能完全按照安排进行，结果导致前线不得不依靠静态的仪表板、半成品的预测或直觉来做出这些选择。\n\
  \n![image](img/scene_break.png)\n\n## 决策制定\n\n改善公共医疗需要将海量健康数据与恰当及时的决策相结合，预测性分析在支持行政任务优先级排序之外，还将支持临床决策和行动。\n\
  \n利用模式识别来发现有患病风险的患者——或者由于生活方式、环境、基因组或不同因素导致病情恶化的患者——是人工智能开始在医学领域应用的另一个空间。许多数据分析系统集中在“描述性分析”上，回答诸如“发生了什么”的问题。而人工智能允许分析更多地向“规范性分析”演进，即就“应该发生什么”给出建议。其意图是利用信息和持续机器学习，系统地帮助前线在各种情况下做出最明智的选择。\n\
  \n患者护理和医疗运营是两个完全不同的日常范例，展示了人工智能将如何颠覆医疗业务。虽然还有无数的额外例子，但尽管如此，希望这些例子能证明这样一个事实：人工智能正在利用无法想象的海量数据，从宏观和微层面提升专业水平。\n\
  \n![image](img/scene_break.png)\n\n## 研究\n\n从实验室到患者的路径可能是漫长且昂贵的。根据一家金州医学专科分析协会的数据，药物从研究实验室到患者大约需要十二年。在开始症状前测试的药物中，只有五千分之五的药物真正进入了人体实验，而这五种药物中只有一种获批准供人类使用。此外，平均而言，一个机构从实验室到患者开发一种全新的药物将耗资\
  \ 3.59 亿美元。\n\n药物研究是人工智能在医疗保健领域较新的应用之一。通过引领人工智能的最新进展来塑造药物发现和药物重新利用过程，有望大幅削减成本和上市时间。\n\
  \n## 培训\n\n人工智能允许受训人员经历简单的计算机驱动算法无法实现的实实模拟。自然语言的出现，使得 AI 计算机能够从海量的事件数据库中提取提取信息，这意味着对受训者的查询、决策或建议的响应将比受训者本身面临更大的挑战。\n\
  \n接下来你可能想做的是由于存在巨大的机会而决定投资这一领域。凭借人工智能和机器学习开发领域的“超能力”知识，你可以进一步了解此类技术中存在的更多机会。\n\n\
  ## 结论\n\n我希望这些信息对你有帮助，并能够为你提供理解这些概念所需的基础知识。通过完成这本书，你将能够掌握在理解人工智能影响人类行为的角色方面所寻求的精通。\n\
  \n"
