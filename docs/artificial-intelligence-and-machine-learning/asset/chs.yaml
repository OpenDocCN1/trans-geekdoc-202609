  \n一旦某事运作良好，就不再需要称之为`AI`了。`John McCarthy`在 1995 年发明了`Artificial Intelligence`这个词，从以后`AI`公司经历了各种艰难和顺利。这些时刻伴随着进步，以及充满失望和幻灭的承诺。随着海量信息的产生、快速处理以及来自`美国黑手`合理改善的发热，`AI`致力于创造一个可以超过互联网本身的刻度的注意力。当世界正准备见证`AI`公司的转型时，每个与现代化密切相关的个人都必须意识到`AI`将如何或不会对他们公司的日常生活产生影响。\n\
  \n### 第一部分：公司巨头（超级力量）\n\n以下人物帮助了塑造和增强了`AI`行业：\n\n*   **Amit Singhal**: 以下人物帮助了塑造和增强了`AI`行业。\n\
