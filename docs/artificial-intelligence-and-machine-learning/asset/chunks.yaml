  trans: '

    这并不是在线获取的最明智的内容。你可以看到诸如 `WebVR` 之类的应用，例如在决定购买眼镜之前，你可以看到它们戴在自己脸上的样子。你可以看到 360 度网站，它们让你沉浸在艺术设定中，并允许你与视频游戏等板块进行互动。生物识别技术也在兴起，你的
    `iPhone` 可以通过面部解锁。商标品牌已经将这项技术应用于现代化的结账。这增强了使用指纹完成 `PayPal` 交易的功能。很快，你将进行通过面部或语音识别验证的交易。AI
    比人类更了解人类，从而改进并带来了在线领域的变革。


    # 让你的入职流程更顺畅


    不仅仅是浏览变得更加毫无阻碍。你还记得上一次在线下载应用、数字商品甚至免费软件试用版是什么时候吗？下载需要多久？我猜你下载了各种组件来让它运行，你是否经历过查阅说明书？所有费劲的入职体验都已成为过去。据业内所知，尽管具有权威性，客户在家里正在使用不需要大脑就能激活的技术。这带来了服务的精简化化，可以帮助你在几分钟内开始运行。只要你运行起来，只需点击一下即可升级，或通过安全的自助服务区域轻松管理你的账户。我们忘记了那些需要收集多种不同信息或软件来设置数字商品的日子。一切都在回到实时革命，人们已经完全没有耐心了。人们正习惯于更好的体验，并对企业有更高的期待。


    ![image](img/scene_break.png)


    # AI 对消费者的影响


    ## 客户服务成本


    AI 对客户体验的影响并非完美。`Wepoons` 允许客户通过应用程序订购购买食物，从而让你坐下耐心地等待付费的餐点。这既简单又高效；但体验可能会被一个送餐时粗粗心的服务员所破坏。技术确实可以增加任务的速度和交易量，这毫无疑问。但再次，某种程度的技术可以保护你的行业免受糟糕客户服务的困扰。AI
    可以承担这种风险，并可能摧毁或成就你的体验。技术被认为是巨大的，但许多企业无法负担员工机器人化的成本。你可能爱上了精湛的技术，但客户仍然想要亲切的人情味。


    ## 竞争对手还是兄弟？


    你必须理解为什么人们热爱人类的感觉或触碰。机器是聪明的，但它们并不像人类那样遵循我们。这存在某种障碍。你和机器人之间可以分享笑话，但你无法分享微笑。AI 无法识别你讽刺的语气或冷幽的幽默感。机器人接待员不会理解你皱眉毛意味着什么，聊天机器人也不会意识到“哇”代表什么。依赖
    AI 的企业面临疏远买家的风险，并可能增强糟糕的机器人体验。想象一种情况：当你感到沮丧并想找人说话时，你会选择有同理心的人类还是机器？


    ## 并非全都是惨淡


    当 AI 被微妙地用于协助服务而非主宰服务时，它拥有一席之地。用好它将影响 AI 对客户体验的影响，从而变得轻松且高效。AI 迫使我们提供 24 小时服务。你可以在深夜任何时候访问公司网站，通过他们的机器人提问并立即获得答案。你会意识到你不是在和人类对话，但这并不重要。你不能指望在午夜联系人工操作员，在那个时间能得到帮助你就已经很高兴了。AI
    是网购的巨大助力。`North Face` 是一家利用 AI 改进运营的公司示例。`North Face` 帮助在线买家获得他们的完美商品。语音输入技术的使用询问买家以及他们何时行使权利。这创造了极佳的体验。


    ## 离线 AI


    并不是一切都关在线，因为 AI 将帮助你在实体店获得更好的服务。你必须考虑 `geolocation`。你必须知道在哪里以及谁允许交易实时发送给你。如果你是咖啡爱好者，而周围恰好没有，那么有一个吸引你喝最爱卡布奇的优惠就是一个优势。AI
    对人类的外表感兴趣。技术会根据时间和日期调整广告。这为每个人带了极大的定制化广告体验。面部识别现在已被捕捉。你可以开始根据店内的停留时间在电脑屏幕上看到优惠。


    ## 精细的平衡


    这是 AI 作为简化客户旅程的新颖补充的一个例子。当你习惯了这一点，AI 对客户体验的影响将令人印象深刻且智能。


    # AI 对公司的影响


    ## 自动化焦虑


    你已经看到 AI 如何影响客户；你也可以询问它对行业测试及其实施产生的影响。如果你声称 AI 将立即为行业带来便利和快乐，那就太天真了。在 AI 为办公室带来普遍快乐之前，有一系列障碍需要克服。你必须考虑到世界正陷入自动化焦虑，这导致了恐惧。AI
    已经推出了日益复杂且负担得起的发展，人类可以被取代。每个人都担心机器人和自动化流程将夺走人们的工作。这并不意外，因为 AI 现在甚至在接管营销等白领工作。机器人可以执行的任务正在不断扩大。在办公室里，许多复杂的技巧正在被启用，从而创建了可以自动执行困难任务的软件。随着
    AI 的快速发展，大多数人类倾向于发现自己的工作面临风险。


    ## 士气低落


    对于想要引入 AI 的行业来说，这将带来士气挑战。老板们需要考虑在团队中引入 AI 时可能产生的影响。员工可能会开始恐慌并担心失去工作。他们可能会与他人互动并在整个办公室传播传言。这可能导致许多员工开始寻找其他工作地点。AI
    的实施意味着交易商看到员工士气断崖式下跌，并对生产力产生负面影响。这是大多数老板没有考虑的。`C-suite` 最终关注指标，他们的奖金与资金的增长挂钩。


    ## 改变


    在工作场所引入 AI 带来了工作场所领导力运作的重大转变。人类和 AI 如何在集成办公室中合作？对工作场所领导力培训的需求增加集中在 AI 上。老板们应该有效地管理由机器人和人类组成的环境；因此，领导这样的地方并非易事。必须升级技能来带来这种变化。许多改进正在自动化，从而导致了工作的演变。交易商正忙于为
    AI 准备工作场所。**


    ## 信任至关重要

