- raw: 'The data management company was born out of an MIT research project to apply
    machine learning to clean and organize dirty data that is incomplete or inconsistent.
    Tamr''s system automatically identifies sources of data across a company that
    can be useful together and tags in an employee to instruct the software on how
    to integrate it. The company has big clients using their software like Toyota,
    GSK, and GE.


    Bossa Nova Robotics


    The startup has rolled out big, slow-moving robots to 350 stores, including Walmart.
    The robots help keep the shelves well-stocked. Its systems read price labels for
    discrepancies and find gaps on shelves so it can alert management about the problems.
    The robots easily maneuver around the stores and interpret billions of images
    in a way that is accurate, timely, and reliable.


    Pymetrics


    This online recruiting platform helps companies find their


    right employees by looking beyond experiences and skills on their resume. It has
    over 80 enterprise customers, including LinkedIn, Accenture, MasterCard, and Unilever.
    The companies use the software to have its top-performing employees complete a
    set of assessments as part of their evaluation.


    Pymetrics gleans critical, emotional and cognitive traits for different roles
    when job seekers apply to work at one of the companies and complete the challenges
    themselves. They are then paired with jobs that best fit their abilities.


    Companies also use the platform for internal career development. It makes the
    process more efficient with better outcomes and increases diversity in a big way.
    The company is currently open-sourcing its algorithm auditing tool with the overall
    aim of preventing its systems from reinforcing gender or bias.


    K health


    K health has developed a software that enables you to access medical services
    without having to step into any hospital. The company''s consumer app draws on
    a data set of more than 2 billion anonymized medical records sending subtle patterns
    in data to give users personalized health advice. The company has also partnered
    with an insurance company, Anthem to let members see how medical practitioners
    diagnose and treat people with similar symptoms for free. The software also enables
    you to have a live chat with the doctor, but for a fee.


