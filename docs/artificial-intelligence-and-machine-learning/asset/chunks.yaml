  trans: '

    设想一种情况，感知和动机是让程序员感到被理解的重要组成部分。系统预计能够反映出程序员对过去交互的熟悉程度以及能够记忆的内容，并在没有任何指令的情况下预判需求。它应该能够减少摩擦，并缩短完成任务所需的步骤数量。如果操作得当，认知系统将产生一种它了解你并理解你需求的感觉。


    动机，众为人知的应用程序理解程序员意图、优先级、价值观和目标的能力，其水平分为：


    - 良好 – 应用程序非常熟悉程序员的人口统计学特征和业务重点，并据此呈现表面信息。

    - 优秀 – 应用程序能够识别个人及其个性化特征。它能够熟悉用户的感受，并以最合适的情绪进行反馈。

    - 最佳 – 应用程序会根据你的反馈方式主动与程序员进行沟通，即一个 `assistant`（助手）非常熟悉所协助的对象，并计划如何满足他们的需求。


    ## 第 2 部分：输出：自然响应


    ### 推理


    应用程序主要通过轻松提供存储在其知识库中的事实信息（ground truth）与程序员进行智能通信。通过利用对用户上下文的经验，认知应用将超越准确的翻译，给出更具价值、更宏观的回答。推理可以被视为应用程序通过考虑感知、知识和动机获取的所有可用信息来进行认知通信的能力。如果一个坚实的知识库产生了智能响应，但如果应用程序没有为个人服务并以某种方式考虑你的上下文，那么这种响应就缺乏认知感。


    通过根据详细的发现和之前的交互对潜在答案进行评分，系统可以思考如何给出一个经过且具有预测性的回复。单次通信可能同时具备更多功能，但认知应用将根据其迄今学习的内容编写响应，并旨在根据程序员对特定响应的反应在未来改进答案。推理是指应用程序能够基于程序员的上下文和历史知识进行智能通信的能力：


    - 良好 – 应用程序可以生成针对特定领域或定向问题空间的预设响应。它在创建响应时并不一定使用感知或动机能力，而是依赖预训练的知识。

    - 优秀 – 它在创建响应时创建丰富的响应，并依赖感知、动机和知识能力。

    - 最佳 – 它将预判用户的需求并直接对其做出响应，创建出对你的需求和上下文非常有益的建议，且远超任何明确表述的内容。


    ### 学习


    只要有交互，认知应用就会根据程序员的响应更新其关于程序员、当前数据和世界的知识。在某些情况下，用户在没有检查内容的情况下立即点击了建议的链接。认知系统通常根据个人和集体历史经验的发现来更新其与人的交互方式。它们记住过去的交互，并根据这些研究，通过增强矩阵中对上下文置信评分的调整来调整响应。学习被认为是应用程序解释用户响应并将这些知识应用于随时间推移改进通信的能力：


    - 良好 – 它将允许程序员在界面中训练预先封装的信息。它不会教授感知或动机能力，其目的是创建更多经过训练的知识。

    - 优秀 – 应用程序通过程序员的沟通、行为和显式反馈进行学习。它训练感知和动机能力。

    - 最佳 – 应用程序在没有任何用户干预的情况下更新或训练其信息。


    ## 智能自动化对生活方式和关系的影响


    在过去的几年里，商业模式发生了重大中断。过去的弊端现在已成为未来的大趋势，而新兴技术和数字化正在引导其中许多趋势。许多买家已经从购买商品转向消费服务和体验，交易者别无从根本上改变他们的运营模式。你可以通过供应链自动化来实现这一点。在未来五年内，有不同的方式可以预见这一点的实施：


    ### 1. 机器人组装工业部门


    在成熟企业中，机器人和人工智能（`AI`）将在未来五年内得到认可。这似乎已经在发生，例如，Zara 不再将外外包给亚洲，而是在西班牙制造了 14 个高度自动化的工厂，让机器人负责剪裁和染织织品，从而允许商业拥抱节省时间的目录策略。


    经历快速增长的客户市场将希望增加生产能力。从 2013 年起，中国被评为全球机器人技术的主要市场。机器人和 `AI` 使用的增长可以为中国这样的国家带来第一手希望，在工厂成本快速上升和获取生产劳动力挑战日益增加的情况下，他们在效率方面正落后。


    ### 2. 大数据和分析将横跨资源链


    传感器和微处理器的成本持续下降，使生产变得智能化，这推动了工程自动化的广泛应用。某些行业无法证明预测系统、边缘计算和软件即服务（SaaS）的价值，在这些领域，软件是集中安置的，按付费获取使得数据组织和分析变得易于管理。将大数据、分析与雷达、机器人和
    `AI` 技术相结合，将共同产生智能终端产品。


    ### 3. 最后一公里配送将 Uber 化


    在分销方面，公司已经在研究如何解决“最后一公里”问题，即允许人们在线订购当地杂货，并派遣一名私人买家去挑选货物并提供给他们。其他公司正在研究如 `Uber
    rush` 之类的解决方案，以便在准确的时间到达客户那里。其他人正在提高设施的水平并扩大结构分析。在近的五年内，将有很多类似的想法来满足任何人的需求。


    ### 4. 高街的终结


    如果买家现在在在线购物，那么在未来五年内这可能会结束。为了向想要更快货的客户交付，像 `Amazon` 这样的行业将创建更多的区域配送中心。中国正是这样做的，投资建设其供应网络。它在中国
    34 个市级拥有 82 个总面积超过 130 万平方米的仓库，在 460 个不同城市拥有 1453 个本地配送站。


    然而，在接下来的几年里，不仅是贸易行业感受到波动，资金链的革新也带来以无数实质性的方式影响人们：


    '
