    在金融市场中，并非所有的金融服务专家都了解市场的运作方式。这些专家会根据所有可用信息，做出符合客户最大利益的理性决策。精明的专家则基于对扩展知识的广泛分析以及经过证明的方法。他们致力于充分理解客户的、、目标、时间跨度以及承受投资风险的能力。


    # 第 4 章：人工智能领域的关键领军者与极具前景的初创公司


    “如今作为一家初创公司，开发硬件设备要困难得多。” —— 马克·安德森森


    人工智能正在飞速发展。它现在在从农业到通信的各行业的技术世界中都起着至关重要的作用。从谷歌到苹果和微软，每一家大型科技公司都在投入大量资源寻求人工智能的突破。现在每家公司都清楚，为了保持竞争力，你的故事中必须拥有机器学习。几家私营公司在美国和全球的人工智能领域拥有着巨大的权力和影响力。这些公司正在以意义的方式使用这项技术，并成功地展示了此带来的真实业务潜力。以下是拥有力量和资源利用人工智能技术塑造你未来的大巨头列表：


    ## Twitter

    Twitter 投入了大量资源进入人工智能学习领域。该公司已经连续收购了四家人工智能公司。其中最著名的是 Magic Pony。该公司耗资 1.5 亿美元的高价收购了
    Magic Pony。这家人工智能公司开发了用于网页和移动设备视觉处理的机器学习方法，Twitter 将在不久后利用此改进其系统，在你的时间线中推荐特定的推文。


    ## 商汤 (SenseTime)

    商汤人工智能公司已经拥有了大型客户，名单中包括中国政府。该公司正向中国政府提供面部识别技术以追踪其公民。该技术在面部识别方面被誉为最佳，优于谷歌和脸书的产品。目前，商汤正集中资源开发自动驾驶技术。


    ## 高通 (Qualcomm)

    高通是一家致力于人工智能的芯片制造公司。人工智能在其开发的 855 移动平台上起着不可性的作用。该芯片使用信号处理器处理 AI 语音、音频和图像功能。高通骁龙驱动了当今市场上最受欢迎的一些智能手机。如果你是智能手机技术的爱好者，请密切关注高通，获得令人兴奋的新型
    AI 智能手机功能。


    ## 英伟达 (Nvidia)

    英伟达可能是成立最久的 AI 公司之一，且今天仍起着关键作用。英伟达的显卡是机器学习和人工智能的核心。该公司活跃于医疗保健、高等教育、零售和机器人领域。该公司公司正在开发将集成到汽车制造和自动驾驶每个层面的
    AI 技术。


    ## 微软 (Microsoft)

    微软在消费者和业务端都参与了人工智能。微软的 AI 数字助理 Cortana 直接与亚马逊的 Alexa、苹果的 Siri 以及谷歌的数字助理竞争。其人工智能功能使用公司的
    `Azure Cloud` 服务为业务界的一些顶级品牌提供聊天机器人和机器学习。微软仅在 2018 年就购买了数家 AI 公司。


    ## 英特尔 (Intel)

    英特尔一直在对多家人工智能公司进行收购。近期，英特尔收购了 Nervana 和 Movidius 以及几家较小的 AI 初创公司。Nervana 使公司能够开发特定的深度学习软件，而
    Movidius 的创立是为了为性能不足的设备带来 AI 应用。英特尔与微软合作，为 `Bing` 搜索引擎提供 AI 加速。


    ## IBM

    该公司自 20 世纪 50 年代以来一直活跃在 AI 领域。它是人工智能先驱公司之一，至今仍然活跃。通过 Watson，IBM 开发出了一个机器学习平台，可以将人工智能集成到业务流程中，例如为客户支持构建聊天机器人。IBM
    的客户包括毕马威（KPMG）、四大以及巴西的 Bradesco 银行等大公司。


    ## 海思 (HiSilicon)

    海思是华为 `Kirin 980` 芯片的制造商，该芯片于 2018 年在柏林 IFA 上发布。麒麟 980 显著增强了全球第一代人工智能智能手机芯片。该芯片能极快速度处理面部识别、智能翻译和图像分割等功能。该芯片促使竞争对手开发了许多其他智能手机芯片。


    ## 谷歌 (Google)

    这是最大且最重要的 AI 公司之一。多年来，谷歌以疯狂的速度收购了数家 AI 初创公司。近期，它还创建了 12 多家全新的人工智能公司。谷歌以 4 亿美元收购了
    DeepMind。DeepMind 是棋类游戏领域的冠军。该公司还在资助正在进行的 `Tensor AI` 芯片项目，用于设备端的机器学习。该公司希望在计算机行业从“移动优先”演变为“AI
    优先”。


    ## 脸书 (Facebook)

    Facebook 在人工智能领域投入了巨大资源，可能是意识到 AI 技术在未来业务世界中将发挥关键作用。Facebook 的 AI 研究小组被称为 `FAIR`，一直致力于机器智能领域的发展，并开发新技术为人们提供更好的沟通方式。该公司还与两个名为
    `Alice` 和 `Bob` 的 AI 合作，但该项目由于技术故障过早终止，该故障使它们能够用秘密语言进行交流。


    ## 大疆 (DJI)

