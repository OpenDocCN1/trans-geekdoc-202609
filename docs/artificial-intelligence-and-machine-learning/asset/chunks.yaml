    AI`，这是一家通过对客户电话、短信和聊天进行自动化分析来提供可操作洞察的公司。这些技术进步使 Salesforce 成为最值得投资的 A.I. 公司名单上的新成员。


    ## Amazon.com 股票


    该公司的估值为 `$1trillion`，并且正在大力投入人工智能。Amazon 使用 `AI` 来驱动关键能力，如预测产品需求、优化物流和仓储以及改进语音驱动的虚拟助手
    `Amazon Alexa`。在全国范围内发布了约 360 个 `AI` 职位，该公司正处于 `A.I.` 世界的最前沿。投资这家公司的股票将确保你获得丰厚的回报。


    ## 如何创立 AI 初创公司


    人工智能是当下的热点。如果你在想如何如何建立自己的 `AI` 初创公司，那么这里有一些如何入门的简要步骤：


    ### 选择你感兴趣的主题


    你需要选择一个你感兴趣的主题，以保持动力并投入到学习过程中。专注于一个现有问题并寻找解决方案。如果你不能成功解决客户愿意付费的问题，那么你的初创公司将无事可做。在走得太远之前，测试一下人们是否愿意为你计划要构建的内容付费。


    ### 玩转一场“数据收集/AI 构建”的游戏


    一旦你确定你的产品有现成的客户，就可以构建第一代 `AI`。你需要尽可能多收集涉及你个人项目的数据，然后对其进行筛选以确保其有用性，然后设计模型并对其进行训练。你需要注意的是，数据收集、筛选和训练的过程是你项目中最具挑战性的部分。训练模型是非常耗费精力且耗时的。你将把大部分解决问题的精力花在收集和理解数据上。


    ### 构建你的产品


    到此阶段，你应该拥有一个可以运行的 `AI`。你需要提高你的 `A.I.` 能力使其易于使用。这意味着你必须将你的 `AI` 打包成市场可以做出积极响应的产品。你的产品应该有一个具有一系列功能的用户界面。你的产品还能够在短时间内以负担得起的方式高效地解决它创建时要解决的问题。


    ### 开发改进你 AI 的方法


    一旦你启动了新的初创公司，你需要继续收集更多在训练 `AI` 时无法获得的数据。然后你使用这些数据来改进你的 `A.I.` 以提高其准确性。确定你在规定期间内训练你的
    `AI` 的次数。


    最后，如果你在建立初创公司时遇到任何困难，考虑参加以下在线课程：


    - `Learn with Google` - 这是由 `Google` 启动的项目，旨在帮助你理解什么是 `A.I.` 以及它是如何工作的。它有一门针对初者的机器学习课程，如
    `GOOGLE''s TensorFlow`。

    - `Stanford University Machine Learning` - 该课程在 `Courser` 上提供。课程可以免费提供，或者如果你想要证书则需要付费。该课程将让你熟悉
    `A.I.` 驱动技术的示例。你还将学习软件工程的基础知识。

    - `Nvidia-Fundamentals of Deep Learning for Computer Vision` - 计算机视觉是一门专注于创建能够像人类大脑一样分析视觉信息的计算机的学科。课程涵盖了必要的技术基础，以及目标分类和目标识别的实际应用。你还将学习如何构建你的神经网络应用程序。


    ## 全球人机交互 (HMI)


    ### 什么是 HMI？


    人机界面是一种中央控制系统，用于通信操作员输入并接收来自 `PLC` 逻辑控制器的实时数据和反馈。`HMI` 为控制系统内部发生的情况提供了必要的视觉化。它记录了关键生产信息，包括循环次数和不同工艺的配方。`HMI`
    已成为新工厂设备和升级工厂设备以及过程控制系统中操作员控制的标准接口。


    ### HMI 与全球市场


    全球 `HMI` 市场预计到 2023 年收入将超过 `$8billion`。对安全、能源、更高生产力和可持续性的日益增长的重视，将导致全球人机界面市场的快速扩张。此外，工厂自动化系统中监控控制和数据采集
    (`SCADA`) 以及可编程逻辑控制器 (`PLC`) 的实施，将在未来几年内改变市场格局。全球 `HMI` 市场是由半导体制造厂对控制中心和无净室日益增长的需求驱动的。


    ### HMI 市场 – 地理区域


    全球 `HMI` 市场分为`北美`、`亚太`、`欧洲`和`世界其他地区`。目前，该市场由`北美`地区主导。GDP 的增长和经济放缓后的复苏是驱动北美 `HMI`
    市场的主要因素。其他使北美主导市场的因素包括离散行业的发展增长、先进制造实践的高采用率以及对先进软件解决方案的需求不断增加。


    然而，由于`印度`、`韩国`、`印度尼西亚`和`中国`等经济体快速增长以及这些地区自动化的增长，预计`亚太` `HMI` 市场将看到最高的增长率。


    全球 `HMI` 市场的公司有：`ABB Ltd.`、`Advantech Company, Ltd`、`Beijer Electronics, Inc.`、`Honey
    Wall International`、`Mitsubishi Electric Corporation`、`Siemens AG`、`General Electric
    Co.`、`Kontron AG, Ltd`、`Rockwell Automation`、`Yokogawa Electric Corporation`。


    ### HMI 市场估计


    据估计，随着工业效率成为焦点，全球 20199 市场市场将扩大到 `$5579 million`。市场预计在 2013 年至 2019 年之间的复合年增长率
    (`CAGR`) 为 `10.4%`。全球 `HMI` 市场预计到 2026 年进一步增长到 `$8.96 billion`，复合年增长率 (`CAGR`)
    为 `9.8%`。制造工厂对效率和监控日益增长的需求、工业物联网 (`IIOT`) 的演变以及对智能自动化解决方案的需求是推动市场增长的关键因素。


    ## 你可以关注的未来技术进展


    技术格局正在见许多进步趋于成熟。在十年内，许多进步将被接受为日常生活的一部分。它们将影响你如何生活、工作和娱乐。大多数将首先由商界推动，然后被更广泛的社会接受。以下是未来十年技术和创新可能改变方式的未来展望。


    ### 飞行出租车


    出行预计将随着飞行出租车的引入而改变。飞行出租车领域的实验正由共享出行供应商 `Uber Technologies` 作为其 `Uber Elevate`
    计划的一部分进行。该公司计划部署 `Uber Air` - 能够垂直起降的电动飞行器。


