    # Chapter 2: Artificial Intelligence


    # Vs.


    # Human Intelligence


    ![image](d2d_images/chapter_title_below.png)


    "It has become appallingly obvious that our technology has exceeded our humanity."


    ![hand-1571849\_640.jpg](d2d_images/image000.jpg)


    — Albert Einstein


    Artificial Intelligence and Automation are terms that are frequently used interchangeably.
    They are related to programming, or robots, and electronic machines that enable
    us to work more productively and successfully - regardless of whether it is an
    industrial vehicle assembly or sending a follow-up email.


    In any case, it is more nuanced than that. Automation is fundamentally making
    hardware or software that can do things automatically - without human mediation.
    The term artificial intelligence was coined by John McCarthy as an engineering
    science of making smart machines. Computer-based intelligence is tied in with
    attempting to make machines or software mimic, and in the long run, supersede
    human behavior and intelligence.


    The ideal situation, which humankind is moving in the direction of currently,
    is this: Automated machines gather data — AI systems “understand” it. We are looking
    at two altogether different frameworks that impeccably complement one another.


    Automation


    Automated systems are the explanation banks that record your installments in a
    matter of seconds, and are the reason why organizations send mass emails to their
    clients. It is what enables you to get your consignment shipped and delivered
    on the same day within hours of ordering.


    Automation has a singular purpose: To give machines a chance to perform monotonous,
    repetitive activities or as specific individuals like to say, “to take the robot
    out of a human.” It saves time for individuals to concentrate on increasingly
    significant, innovative tasks that require human touch and judgment. The final
    product is an increasingly proficient, practical business, and a progressively
    productive workforce. A submissive advanced robot that never calls in sick or
    takes days off, and consistently takes care of business. It is no big surprise
    that organizations so readily adopt automation.


    Automated machines are driven by the manual configuration such as work processes,
    programming edge case situations, - basically, a soldier machine that follows
    orders.


    Automation will progressively affect the industrial revolution during the following
    couple of years. The effect of automation is already felt in particular businesses,
    and some nations are encountering the impacts more so than others.


    The specialized possibilities for automation differ significantly across industries
    and activities. As automation innovations, for example, robotics and machine learning
    assume a tremendously incredible job in regular daily activities, their likely
    impact on the working environment has become a focal point of research and open
    concern. The conversation inclines toward a Manichean speculating game, which
    asks whether machines will succeed jobs or not.


    While automation technology will dispose of few occupations in the following years,
    it will also influence parts of practically all employees to a higher or lower
    level, depending upon the sort of work they involve. Automation, presently progressing
    past standard manufacturing, has the likelihood, at least as to its technical
    feasibility, to change sectors, for example, medical and financial, which include
    a significant portion of information duties.


    Understanding Automation Potential


    In talking about automated technology, we allude to the possibility that a given
    task could be automated by adapting current tested innovations. In other words,
    regardless of whether the automation of any device or activity is feasible, every
    occupation is comprised of different sorts of duties and tasks, each with fluctuating
    feasibility levels. Occupations in retailing, for instance, include activities
    like gathering or handling information, interacting, and relating with clients
    and setting up product display.'
