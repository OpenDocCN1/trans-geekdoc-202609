    ## 异常检测


    尽管我们可能假设数据总是合理且表现良好的，但事实并非总是如此。有时，由于测量误差或设备故障，我们会得到错误的数据点。通过机器学习，可以轻松检测出异常，这有助于提供质量控制衡量。用于实现这些目标的常用算法包括主成分分析（`PCA`）或支持向量机。


    ## 推荐系统/引擎


    推荐引擎是一种信息过滤系统，旨在不同的应用程序提供推荐，包括音乐、电影、餐厅、书籍、产品和文章。推荐系统中常用的方法是协同过滤和基于内容的过滤。


    为了有效利用大数据，用于利用不同算法的机器学习工具包括：


    - 数据质量与管理

    - 用于构建模型的图形用户界面（GUI）

    - 模型寻找的可视化和交互式数据探索

    - 模型对比以识别最佳模型

    - 自动集成模型的评估以确定最佳值


    ## 人工智能与机器学习的关系


    很多时候，研究人员和学生在区分人工智能与机器学习以及识别它们之间可能的关系时感到困惑。然而，机器学习特别是指对计算机算法的研究，这些算法会随着经验而改进。机器学习算法属于计算机科学的一个分支，通常被称为计算学习理论。另一方面，人工智能是一个分为三类的计算机系统：计算哲学、计算心理学和计算机科学。


    人工智能（`AI`）起源于计算机科学的一个领域，其目标聚焦于解决人类可以完成的任务。它通过不同的方法来实现，例如编写一个实现科学家所制定标准的程序。虽然人类也可以完成类似的任务，但手工制定标准可能是一项耗时且辛苦的活动。人工智能有多种工具可以用于解决计算机科学中的各种问题，包括逻辑、控制理论、搜索与优化、神经网络、概率方法以及分类器和统计学习策略。


    机器学习与人工智能密切相关，因为它是人工智能的一个子领域。它关注算法的建立，计算机利用这些算法来自动学习模型。机器学习的应用能够阅读文本并分析内容。机器学习还可以听音乐、判断某人是难过还是快乐，或者找到适合个人心情的歌曲。作为人工智能的一部分，机器学习专注于数据的持续改进、数据挖掘和任务自动化。


    # 第 2 章：人工智能 VS 人类智能


    “事实已变得显而易见，我们的技术已经超越了人性。”


    —— 阿尔伯特·爱因斯坦


    “人工智能”和“自动化”是经常互用的术语。它们与编程或机器人以及电子机器有关，这些机器使我们能够更高效、更成功地工作——无论是工业车辆组装还是发送跟进邮件。


    在任何情况下，情况比这更为微妙。自动化从根本上是指能够自动执行任务的硬件或软件——不需要人工干预。“人工智能”这一术语是由约翰·麦卡提出的，作为一种制造智能机器的工程科学。基于计算机的智能与试图让机器或软件模仿并在从长远来看取代人类的行为和智能联系在一起。


    人类目前正在迈向的理想情况是：机器收集数据——人工智能系统“理解”它。我们正在观察两个完全不同但完美互补的框架。


    ## 自动化


    自动化系统是在几秒钟记录你分期付款的解释银行，组织向客户发送批量邮件的原因。它让你能够在订单后的几小时内完成货物的运输和交付。


    自动化的唯一目的：让机器有机会执行单调、重复的活动，或者像某些个人所说的，“把机器人从人类中解放”。它为个人节省了时间，专注于需要人类触感和判断的日益重要的创新任务。最终产品是日益精进、实用的业务，以及具有不断提高生产力的劳动力。一个顺从的先进机器人，它从不请假或休假，并始终处理业务。组织如此轻易地采用自动化并不意外奇。


    自动化机器由手动配置驱动，例如工作流程、编程边缘情况等——基本上，它是一台听从命令的士兵机器。


    自动化将在未来几年内逐渐影响工业革命。自动化的影响已经在某些业务中体现，某些国家受到的影响比其他国家更大。


    自动化的特殊可能性在行业和活动之间存在显著差异。随着自动化创新（例如机器人技术和机器学习）在日常活动中承担着巨大的作用，它们对工作环境可能的影响已成为研究和公众关注的焦点。对话倾向于一种二元论的猜测游戏，即机器是否会取代工作。


    虽然自动化技术在未来几年将消除少数职业，但它将影响几乎所有员工的部分，提高或降低水平，取决于他们从事的工作类型。自动化目前正越过标准制造，至少从技术可行性来看，有可能改变行业，例如医疗和金融领域，这些领域包含了大量的信息任务。


    ## 理解自动化潜力


    在谈论自动化技术时，我们指的是通过适应现有的测试技术使给定任务自动化的可能性。换句话说，无论任何设备或活动的自动化是否可行，每个职业都由不同类型的职责和任务组成，每个任务都有波动的可行性水平。例如，零售业的职业包括收集或处理信息、与客户互动和建立关系以及设置产品展示等活动。


