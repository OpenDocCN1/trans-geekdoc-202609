  trans: "\n\n# 工业者的兴起\n在过去的两个时代中，`eBay` 等公司的增长传递出了一种全新的微型企业家形式。大多数科学进步将为人们维持生计提供更多方法，例如\
    \ `Etsy`——一个销售手工艺品的在线集市，它允许爱好者在全球范围内销售他们的商品。这表明，尽管供应链自动化改变了劳作世界，但它将创造出无数当下的职业模式。\n\
    \n# 善用智能\n无论技术进步多么程度，商业活动仍然需要面对面的交流、互动和建立关系。职业中系统性的交易方面可以是机器人化和数字化的；许多业务的扩张都关乎建立初步联系，然后进行线下管理。因此，新技能将经过深思熟虑，以将其提升到如今的水平。\n\
    \n# 硬件与软件\n\n### 软件\n软件是一个通用术语，用于定义在 `CPU` 系统上执行某些任务的 `CPU` 程序、进程和凭据的集合。`CPU`\
    \ 系统将软件组织分为三大类：系统软件、软件包和应用程序。它可以通过用户友好的界面进行标准化自动化处理，该界面允许人类更高效地与 `CPU` 系统连接。\n\
    \n### 硬件\n它可以被称为像硬盘之类的与 `PC` 明显或物理关联的设备。硬盘的示例包括 `CD-ROM`、`PC` 监控器、复印机和胶片卡。没有硬件，计算机无法运行，这使得软件难以生存，因为无物可操作。软件和硬件相互通信，软件告诉硬件它需要执行什么任务。\n\
    \n# 硬件与软件的内容\n* 软件\n* 防火\n* 功能\n* 更改\n* 相互依赖\n* 引用\n\n![image](img/scene_break.png)\n\
    \n## 类型\n硬件是你可以触摸和看到的物理设备，如计算机显示器，而软件程序可以指示设备执行特定任务。比较两者，软件没有物理形态。它们都与计算机相关，并且在某些情况下软件运行硬件，如手机、`GPS`、医疗设备和空中交通控制系统。没有软件程序，机器将被视为无用，即：当计算机没有软件操作系统时，你无法与它通信。\n\
    \n## 功能\n软件通过向硬件分发一组有序的程序指令来执行特定任务。硬件将作为软件说明的交付系统。\n\n## 相互依赖\n在软件加载并安装到硬件以使程序运行之前，硬件无法运行。\n\
    \n## 防火墙\n它们适用于硬件和软件。一种流行的防火墙选择是安装在计算机上的软件防火墙，它可以进行自定义以适应个人用户的安全需求。它们通常位于宽带路由器中。\n\
    \n## 更改\n切换到新软件或同时使用多种软件已很常见；硬件的变化较少。软件创建快、修改、删除容易，但硬件需要大量技能，且是一项昂贵的尝试。\n\n##\
    \ 配置类型\n除了导出单个配置对象，其他方法也能满足需求。\n\n## 扩展配置类型\n要扩展现有的配置类型，你需要在模块中创建一个配置文件，例如，添加你创建的事件查看器\
    \ `app/code/{vendorname}/etc/events.xml` 并声明一个新的查看器。你可以在 Magento 中找到现有的配置类型、加载器以及目前存在并验证架构的函数。\n\
    \n## 配置类型的创建\n为了创建新的配置类型，你至少需要添加以下内容：\n* XML \n* XSD 验证架构\n* 加载器\n\n为了为新的搜索服务引入适配器以允许扩展配置其实体，你必须创建：\n\
    * 加载器\n* XSD 架构\n* 为你的新类型工作创建的类\n* 命名合理的配置文件\n\n## 导出函数\n在开发和生产构建之间，你可以在 `webpack.config.js`\
    \ 中发现区分差异的需求。你可以从 webpack 配置中导出一个函数作为导出对象的替代。该函数涉及两个参数：\n* 第一个参数环境。\n* 第二个参数选项映射。\n\
    \n## 导出 Promise\nWebpack 可以运行配置文件导出的函数并等待承诺返回。当你需要异步加载配置变量时，这非常有用。作为导出单个配置函数的替代方案，你可以导出各种配置。所有配置都会被构建。\n\
    \n# 市场动态\n它指的是影响市场产品供需的因素，对于经济学和实际业务应用至关重要。许多经济学家建立了市场动态的概念。它们被认为是波特五力竞争模型中最发达的部分。\n\
    \n市场动态也可以指影响因素的元素。从经济学研究来看，它们是供给、需求、价格、数量和其他精确术语。从贸易角度来看，市场动态是影响涉及方业务模式的因素。相比之下，对于石油公司而言，动态可能是每桶原油的价格、国家储备等。\n\
    \n对于明智的贸易，市场动态被纳入业务计划的市场分析中。这些因素对贸易的影响如此巨大，以至于如果不排除它们就会被忽视。市场动态在企业的营销计划中起着至关重要的作用。它们可以在销售成本、配送、物流等许多领域发挥关键作用。\n\
    \n## 市场动态示例\nBeryl 正在为她的新业务编写市场计划。她看到时尚公司对手包和项链等高质量配件有真实需求。她在零售方面拥有丰富的经验，这为她提供了坚实的参考基础。为了完成营销计划，她必须完成竞争和行业分析。她将需要汇总针对时尚饰配件行业的市场动态分析。\n\
    \nBeryl 还需要理解这些动态以填补未被服务的买者的空白。\n\n她将从公司分析开始。查看各种统计数据：买家支出率、零售增长、时尚行业增长、实体店增长和销售额，以及零售商的能力。Beryl\
    \ 正在收集市场动态，以了解市场是否能维持业务。她确定无论所做什么都是她策略的基石。\n\n市场动态是集体市场资源和偏产生的结果。由于这个原因，市场动态不受任何个人或行业行动的影响。个人是对市场动态做出反应，而不是产生它们。市场动态活跃于健康、有机、天然和环保公司的\
    \ LOHAS 部门。Mambo Sprouts Marketing 的创始人是一位致力于通过在线、批发和电子邮件接触健康消费者的推广服务领导。\n\n"
