    尽管人工智能和机器学习已经存在了几个世纪，但它们直到 20 世纪 50 年代后期才得以实现。一系列哲学家、科学家和数学家试图探索 `AI` 的概念，但直到第二次世界大战期间，英国博学学者
    `Alan Turing` 才向人们展示了如何利用可用信息来做出决策和解决问题。阿兰 能够破解并理解了德国武装部队用于安全发送信息的“恩尼玛”（Enigma）密码。他与团队一起发明了
    `Bombe` 机器，帮助破译了信息。图灵认为，能够与人类对话的机器可以被称为“智能”物体。


    20 世纪 50 年代初，美国顶尖计算机科学家 `John McCarthy` 组织了一次会议，在会议上创造了“人工智能”（Artificial Intelligence）这一术语。美国各地的研究人员对理解
    `AI` 概念产生了兴趣，并开始探索该领域。`Herbert Simon` 和 `Allen Newell` 在推动后来改变世界的 `AI` 领域方面发挥了重要作用。


    1951 年，一台独特的机器 `Ferranti Mark I` 成功使用算法分析并掌握了国际跳棋。作为，Simon 和 Newell 发明了一种通常被称为
    `General Problem Solver`（通用问题求解器）的算法来解决数学问题。此外，20 世纪 50 年代，`John McCarthy` 开发了
    `LISP` 编程语言，这被认为是 `AI` 和机器学习的重要部分。20 世纪 60 年代，几位研究人员强调开发算法来解决数学问题。在同一十年，计算机科学家发现了用于控制机器人的
    `Machine Vision Learning`，1972 年第一台智能机器人 `WABOT-1` 在日本诞生。


    然而，在全球增强 `AI` 应用的努力中，计算机科学家意识到在机器中创造智能是非常挑战性的。为了让 `AI` 和机器学习取得成功，科学家需要海量的数据。然而，当时的计算机并不发达，无法处理如此规模的数据。企业和政府对
    `AI` 失去了信心，在 20 世纪 70 年代和 90 年代，科学家面临着 `AI` 研究资金的短缺。


    90 年代，几家巨头公司再次对开发 `AI` 产生兴趣。日本政府公布了开发第 `5^(th)` 代计算机的计划，以推进机器学习。`AI` 的狂热者相信，计算机很快就能像人类一样进行对话、解释照片、翻译语言并推理。1997
    年，IBM 的计算机 `Deep Blue` 首次在持有和解释信息方面击败了计算机。


    随着时间的推移，计算机处理能力存储能力的指数级增长使得公司能够存储大量数据。在过去的 15 年里，`Google`、`Amazon`、`百度` 等公司已利用
    `AI` 和机器学习获得了巨大的商业优势。


    # 人工智能的目标


    `AI` 的主要目标包括：


    ### 知识表示与推理

    这是 `AI` 的一个领域，专注于能够处理信息的计算机表示的设计和实现。`AI` 旨在通过对关系或规则进行编码，使其被计算机系统轻松理解，从而实现这类推理的自动化。知识表示与推理的一些常见用途包括：辅助人机之间通信的自然语言用户界面，以及协助医生以图像形式解释医疗记录的辅助诊断。


    ### 自动规划与调度

    这是 `AI` 的另一个子组件，处理与测量相对应的自动动作序列，这些序列可以使用 `AI` 系统执行。`AI` 规划的目标是根据一组动作以及预定的目标和任务，实现任何计划的机械化和自动化生成。`AI`
    规划的示例包括自计算机软件、自动信息收集、作为自主代理运行的机器人以及计算机建议。


    ### 自然语言处理

    `AI` 的另一个重要目标是处理自然语言。这涉及分析和生成人类可以用于计算机交互的语言或数据。自然语言处理旨在实现特定的计算机系统，能够处理大量的语言数据。目前使用自然语言处理的一些最新技术包括苹果公司的
    `Siri` 应用和 `Google Now`。


    ### 计算机视觉

    该 `AI` 组件的主要目标是对人类视觉可以完成的任务进行自动化和计算机化评估，以便处理、利用或解释视觉数据。`Computer vision` 利用了多种应用，包括人脸识别、物体识别、自动图像处理和视频跟踪。`Computer
    vision` 通常应用于人脸识别。其他应用还自动图像处理、虚拟现实集成、物体识别和视频跟踪。


    ### 机器人学

    `AI` 的另一个重要目标是机器人学，关于可以替代人类任务的机器人和机器的构造、设计和操作。机器人学是工程科学的一个分支，包括电子工程、信息工程、计算机科学和电子工程。目前正在进行机器人学研究，以促进军事、家用和商业应用。全球最大的零售商之一
    `Amazon` 在其仓库中拥有自主机器人，其负责保持仓库整洁并提高运营效率。


    ### 人工通用智能

    `AI` 的目标还包括实现人工通用智能，展示系统执行类人类智力任务的能力。`AI` 通过集成系统实现其 `AGI` 目标，包括情感智力、认知智能和社交智能。


    ![image](img/scene_break.png)


    # 机器学习的目标


    机器学习主要用于以下输出类型：


    ### 无监督聚类

    聚类是指用于发现特定数据集结构和成分的无监督技术。它涉及将数据聚集成不同的类中，以观察生成的分组结果。因此，每个类可以通过一组数据点进行分类。用于解决这一目标的常用算法包括分层聚类
    `hierarchical clustering` 和 `K-means clustering`。


    ### 监督分类（二分类和多分类）

    另一方面，分类涉及将数据点放入预定义的类别或类中。在某些情况下，分类问题为观测值分配类别，或估计特定观测值属于某个类别的概率。二分类的一个例子是给特定邮件分配
    `Ham`（正常邮件）或 `Ham`（正常邮件）类别，其中“ham”仅意味着“不是垃圾邮件”。另一方面，多分类意味着多个类别。在垃圾邮件示例中，它可能意味着第三种类别，即“未知”。


    ### 回归分析：单变量与多元

    与离散类别不同，回归为观测数据分配连续的响应。一个例子是预测某一天`道琼斯工业平均指数`的价格。该值可以是数字，非常适合回归。用于实现这一目标的算法是`简单或多元线性回归`、`森林或决策树回归`、`人工神经网络`、`泊回归`、`序回归`和`最近邻方法`。


