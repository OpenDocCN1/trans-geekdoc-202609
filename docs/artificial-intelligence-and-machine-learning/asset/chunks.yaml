    scientists with a platform for building and deploying Machine Learning models.
    The software helps companies to solve challenges by finding the best predictive
    model for their data. The company''s software is used in healthcare, manufacturing,
    insurance, FinTech, and sports analytics.


    Narrative Science


    The company is headquartered in Chicago, Illinois. Natural science creates Natural
    Language Generation (NLG) technology that can translate data into stories. By
    highlighting only the most relevant and exciting information, businesses can make
    quicker decisions regardless of staff experience with data or analytics.


    Cognitive Scale


    The company from Austin, Texas focuses on software and Cloud. Cognitive Scale
    builds augmented intelligence for the healthcare, insurance, financial services,
    and digital commerce industries. Its technology helps businesses increase customer
    acquisition and engagement while improving processes like billing and claims.
    Cognitive Scale''s products are used by big companies like JP Morgan, NBC, Chase,
    Macy''s.


