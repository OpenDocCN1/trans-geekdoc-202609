  trans: '

    技术可行性是自动化的必要前提；但它并非某项活动是否可以自动化的唯一指标。另一个需要评估的因素是创建和发送设备以及待自动化产品的成本。与供需关系和劳动力元素相关的成本涉及到另一个随之而来的因素：如果劳动力充足且在大多数情况下比自动化廉价，那么这种可能性可能成为反对自动化的决定性因素。另一个值得研究的因素是超越劳动力成本交换的优势；包括更高的产出、更好的质量以及更少的错误。同样，也应该衡量行政或社会问题，例如机器在特定环境中的价值。例如，机器人可能会选择取代医生的一些工作。但就目前而言，这种情况可能真实发生的前景对于某些习惯于期待与人接触的患者来说，可能证明是令人不悦的。


    自动化在行业或职业中兴起的可能性，取决于这些活动内部以及活动之间存在着某种不被察觉的交换。


    即使机器最终接管了某个职业中的多项人类职责，这并不意味着该职业的终结。尽管人们可能预期如此，其他职业将会增长以填补这一空白。例如，在美国，20 世纪 80
    年代标准条形码扫描器及相关销售终端框架的大规模普及，使每个商店的劳动力成本降低了高达 4.8%，食品成本降低了 1.2%。它还推动了各种进步，包括促销机会的增加。无论如何，收银员也是必不可少的；事实上，他们的工作需求在
    1980 年至 2013 年间平均以 2%的速度增长。


    ––––––––


    ## 人机协作


    这一代最伟大的头脑，无论是特拉斯的埃隆·马斯克还是斯蒂芬·霍金，都反对人工智能。他们表达反对的方式完全符合反乌托邦式的格言：“机器人和人工智能将有机会比我们更进步，创造出我们作为人类面临的最大风险。”


    此外，我们还有坚决的 AI 倡导者，他们认为 AI 将支持人类但不会控制或干预他们的生活。这是 AI 的总体目标：实现能够胜任人类言语、思考和行为的进步，而这些行为通常不会受到自然局限性的影响（人会衰老和死亡）。


    同样，与大多数人一样，这意味着 AI 非常不擅长遵循指令。这并不是它的初衷；它的目的是不断寻找模式（像人类一样）、从经验中获益（像人类一样），并在特定情况下自主选择合适的反应（像人类一样）。


    通过这种方式，AI 并不是我或你的复制品。它与构建一个比我们想象更强大的系统紧密相关。


    驱动自动化系统和 AI 的动力与驱动组织的动力非常相似：数据。实现自动化的企业表现更好，并获得了显著的收入增长。这显然可能是许多变量共同的结果，包括与自动化相关的标准跨领域优势。利润能力的扩大；更好的业务效率，以及最重要的一点——准备好专注于创新和/或关键任务的人员。


    我们尚未准备好迎接 AI。我们正处于认知自动化的浪潮中。如果我们继续通过投入海量数据为智能自动化提供动力，我们可能会变得强大得多——无论是作为个人，还是作为组织。


    如果我们恰好想象 2030 年的世界，人与机器之间的关联将重塑生活。机器将补充人类能力，帮助他们实现更卓越的效率。


    ## 未来的伙伴关系


    个人与技术（或机器）紧密生活和工作已经很长时间——从打字机、个人电脑到手机在我们日常生活中的普及。得益于软件、大数据和处理能力的巨大进步，我们进入了一个拥有令人惊叹的新可能性的世界。我们将观察到与机器关系发生翻天覆地的变化——表现为比以前多多的生产力、统一性和可能性。


    随着技术力量在五年内增长 10 倍，我们对技术的依赖也将之增加。

