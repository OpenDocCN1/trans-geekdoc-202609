  trans: '


    十年后，手机将拥有你通常电影中看到的功能。这些功能包括全息投影。在未来几年内，全息显示将成为智能手机的常态。


    你的手机还将演变为日益成为互联网和物联网（`IoT`）的一部分。未来的移动和通信设备无论你是在购物还是乘坐胶囊前往最近的 `Hyperloop` 站，都能唯一地识别你的手机。


    ## 无人机


    一个拥有无人机的未来可能比你想象的更近。全球范围内有数百万关于无人机使用的实验。`Amazon`目前正在开发用于送货的`drones`。还有公司正致力于开发无人机，为世界偏远的山区运送药品。


    ## 学校中的创造性学习


    从基础设施的角度来看，技术的进步将带来许多教学学习工具。一个很好的例子是虚拟现实，它让各种概念栩如生，在教室中营造沉浸式的环境。随着`Cloud`计算和存储的可用性，学生可以在任何地方访问他们的课程和工作单。


    教师将不得不重新定义自己的角色。他们将成为解决问题的催化剂，并在学习过程中连接学生与行业，学习将变得高度互动性。


    ––––––––


    ![image](img/scene_break.png)


    ## 医疗服务


    你不再需要去医院寻求医疗服务。你可以在家里获取这些基本服务。例如，初创公司和医疗技术公司正在制造大型扫描设备的便携版本。这些新一代设备使居家成为成为。此外，能够全天候监测患者并将数据安全上传到`Cloud`中患者健康记录的可穿戴设备已成为现实。它们允许医生对患者状况的变化引起，并帮助他们确定疾病的严重程度。


    | ![image](img/chapter_title_corner_decoration_left.png) ||  || ![image](img/chapter_title_corner_decoration_right.png)
    |


    | --- | --- | --- |


    ![image](img/chapter_title_above.png)


    # 第 5 章：10 位最具影响力的人物


    ![image](img/chapter_title_below.png)


    ## 人物及其对 AI 发展的贡献


    “技术正在开启我们对![social-media-3846597\_640.png](img/image005.png)同类的与生同情。” —— 比尔·盖斯


    ––––––––


    ![image](img/scene_break.png)


    一旦某事运作良好，就不再需要称之为`AI`了。`John McCarthy`在 1995 年发明了`Artificial Intelligence`这个词，从以后`AI`公司经历了各种艰难和顺利。这些时刻伴随着进步，以及充满失望和幻灭的承诺。随着海量信息的产生、快速处理以及来自`美国黑手`合理改善的发热，`AI`致力于创造一个可以超过互联网本身的刻度的注意力。当世界正准备见证`AI`公司的转型时，每个与现代化密切相关的个人都必须意识到`AI`将如何或不会对他们公司的日常生活产生影响。


    ### 第一部分：公司巨头（超级力量）


    以下人物帮助了塑造和增强了`AI`行业：


    *   **Amit Singhal**: 以下人物帮助了塑造和增强了`AI`行业。

    *   **Andrew Ng**: 以下人物帮助了塑造和增强了`AI`行业。他是`Coursera`的共同创始人。

    *   **Elon Musk**: 以下人物帮助了塑造和增强了`AI`行业。他是`SpaceX`、`Tesla`以及后来`Neuralink`的创始人。

    *   **Jeff Dean**: 以下人物帮助了塑造和增强了`AI`行业。他是`MapReduce`和`TensorFlow`的创造者。

    *   **Ginni Rometty**: 以下人物帮助了塑造和增强了`AI`行业。她是`IBM`的领。

    *   **Martin Ford**: 以下人物帮助了塑造和增强了`AI`行业。他是多本关于`AI`的畅销书的作者。

    *   **Ray Kurzweil**: 以下人物帮助了塑造和增强了`AI`行业。他提出了奇点理论。

    *   **Sebastian Thrun**: 以下人物帮助了了塑造和增强了`AI`行业。他是`Udacity`的创始人。

    *   **Yann LeCun**: 以下人物帮助了塑造和增强了`AI`行业。他是`Facebook`小组的领。


    ### 第二部分：新星


    这些人的兴起将发挥重要作用。他们大多数现在并不那么受欢迎，但在未来十年将贡献正能量。


    *   **Boris Sofman**: `ANKI`的创造者。

    *   **Bryan Johnson**: 致力于`Kernel`。

    *   **Carol Reiley**: `Drive.ai`的领。

    *   **Charles Jolley**: `Ozlo`的创始人。


