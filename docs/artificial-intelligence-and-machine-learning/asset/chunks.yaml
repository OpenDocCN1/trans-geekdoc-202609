- raw: 'There are a lot of various levels of cognitive functions depending on the
    autonomy of the app. The low-level cognitive app requires a lot of support from
    the programmer, while the high-level app will behave more on its own. New applications
    might begin with low cognitive function because a user must train knowledge and
    behavior until the app answers reliably. With time it will develop more innovative
    cognitive functions. Every cognitive capability can have diverse levels of tasks
