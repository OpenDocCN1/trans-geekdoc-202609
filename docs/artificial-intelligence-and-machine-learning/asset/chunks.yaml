    # 第一章：理解人工智能


    ![image](img/chapter_title_below.png)


    “目前为止，人工智能最大的危险在于人们过早地认为他们理解了它。”


    ![sense-2326348\_640.jpg](img/image002.jpg)


    `Eliezer Yudkowsky`


    可能无法识别现代社会的哪些部分没有受到人工智能（`AI`）的影响或影响。智能机器正在影响我们生活的几乎每一个方面，包括业务运营和我们的日常活动，旨在提高效率。`AI`
    是第四次工业革命颠覆性变化的主要影响者；这些变化可能会挑战人类的思想。它正在以加速的方式改变我们互动和生活的方式，使我们的城市变得更加，并帮助我们管理生活。


    ## 定义人工智能和机器学习


    按照通常定义，人工智能是机器以类似于人类的方式做出决策和学习的能力。它通常被认为是计算机科学的一个分支，处理计算机智能的行为模拟。人工智能通常缩写为 `AI`，是指能够完成通常需要人类智能的任务的计算机系统，包括语音识别、视觉感知、决策制定和语言翻译。


    机器学习是人工智能的一个子分支，即所有机器学习都是 `AI` 的组成部分，但并非所有的 `AI` 都被视为后者。它指的是计算机科学的一个部分，其目标是构建和利用现有算法，以建立提供模式和准确预测的通用模型。此类算法通常基于数学和统计优化。假设你的目标是使用历史数据识别某种现象的模式；你可能使用机器学习算法对数据进行分组并分析聚类结果。通过一些分析，机器学习有助于随着时间的推移生成自动的聚类或类别。


    '
