    the development of our lives, technology giants like IBM, Amazon, or Microsoft,
    as well as the bright minds like Hawking, believe that now could be the time to
    speak on matters concerning the future of technology and the way it is impacting
    the planet. These issues are moral problems but also a lens into the long-run
    risks. So, what square measures are these individuals thus disquieted about?


