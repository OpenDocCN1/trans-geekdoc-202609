    # Chapter 1: Understanding Artificial Intelligence


    ![image](d2d_images/chapter_title_below.png)


    “By far, the greatest danger of Artificial Intelligence is that people conclude
    too early that they understand it.”


    ![sense-2326348\_640.jpg](d2d_images/image002.jpg)


    – Eliezer Yudkowsky


    It might not be possible to identify what part of modern society has not been
    affected or influenced by artificial intelligence (AI). Intelligence machines
    are influencing almost every facet of our lives, including business operations
    and our daily activities, with the aim of improving efficiencies. AI is so intertwined
    into everything we do that it is hard to imagine living without it.


    AI is the major influencer of the 4th Industrial Revolution disruptive changes;
    the changes that will probably challenge human ideas. It is transforming the way
    we interact and live in an accelerating manner, making our cities become smarter
    and helping us to manage our lives.


    Despite the popularity of AI and machine learning, the purpose, and details of
    the two concepts are not well understood. In this chapter, we are going to discuss
    the key concepts of artificial intelligence and machine learning.


    Defining Artificial Intelligence and Machine Learning


    As commonly defined, artificial intelligence is the ability of machines to make
    decisions and learn in a similar manner as humans. It is commonly known as a branch
    of computer science that deals with the simulation of behaviors of computer intelligence.
    Commonly abbreviated as AI, artificial intelligence refers to a computer system
    that can complete tasks that normally require the intelligence of humans, including
    recognition of speech, visual perception, decision-making, and language translations.
    This technology has influenced several consumer products and has promoted breakthroughs
    in physics and healthcare.


    Machine learning is a sub-branch of artificial intelligence, i.e., all machine
    learning are components of AI, but not all AI count as the latter. It refers to
    the component of computer science whose aim is to build and leverage existing
    algorithms in order to establish generalized models that offer patterns and accurate
    predictions. Such algorithms are usually based on mathematical and statistical
    optimization. Suppose that your goal is to identify the patterns of a phenomenon
    using historical data; you may use machine learning algorithms to group the data
    and analyze the cluster results. With a bit of analysis, machine learning helps
    in the generation of automatic clusters or categories over time.


    History of AI and Machine Learning'
