- raw: '• Detection of an Anomaly


    Although we may assume that data is always sensible and well-behaved, this is
    never the case. Sometimes we get erroneous data points because of measurement
    errors or malfunctions. With machine learning, one can easily detect anomalies,
    which help in providing a measure of quality control. Common algorithms used to
    achieve these goals are principal component analysis (PCA) or support vector machine.


    • Recommendation Systems/Engine


    Recommendation engine refers to an information filtering system that is meant
    to make recommendations in different applications, including music, movies, restaurants,
    books, products, and articles. The common approaches used in the recommendation
    are collaborative and content-based filtering.


    In order to effectively use big data, machine learning tools that are used to
    leverage different algorithms include:


    ● Data quality and management


    ● GUIs used to build models


    ● Model finding visualization and exploration of interactive data


    ● Comparisons of models to identify the best one


    ● Evaluation of automated ensemble model in order to identify the best values


    The Relationship Between AI and Machine Learning


    Many times, researchers and students get confused in distinguishing between AI
    and machine learning and identifying the possible relationship. However, machine
    learning is particularly the study of computer algorithms, which improve with
    experience. The machine learning algorithms belong to a branch in computer science,
    commonly referred to as computational learning theory. AI, on the other hand,
    is a computer system divided into 3 categories: computational philosophy, computation
    psychology, and computer science.


    Artificial intelligence (AI) began as a field in computer science, focusing its
    objective on solving tasks that people can do. It is approached using different
    ways, for instance, writing a program that implements standards devised for scientists.
    Although humans can do a similar task, hand-crafting standards can be a time consuming
    and laborious activity. AI has several tools that can be used to solve the diverse
    problems in computer science, including logic, control theory, search and optimization,
    neural networks, probabilistic methods, and classifiers and statistical learning
    strategies.


    Machine learning is related to AI in that it is a subfield of AI. It is concerned
    with the establishment of algorithms, which are used by computers to automatically
    learn models using data. Applications of machine learning are able to read texts
    and able to analyze the content. Machine learning can also listen to music, make
    a decision on whether someone is sad or happy, or find pieces of music that suit
    the mood of a person. Being part of AI, machine learning focuses on continuous
    data improvement, data mining, and task automation.


