    *   **Boris Sofman**: The creator of `ANKI`.

    *   **Bryan Johnson**: Working on `Kernel`.

    *   **Carol Reiley**: The leader of `Drive.ai`.

    *   **Charles Jolley**: The founder of `Ozlo`.

