    # Introduction


    ![image](d2d_images/chapter_title_below.png)


    With the rising world of big data, we are forced to develop effective strategies
    to help us make informed decisions. All professional fields have become extremely
    complex due to the growing demand to find the most efficient ways to extract value
    from the existing data. By downloading this book, you have taken the first step
    towards learning how to use big data, and how artificial intelligence has made
    it possible to cope with the naturally outgrowing big data movement. The information
    that you find in the following chapters is important, as it will help you to learn
    how artificial intelligence is influencing human behavior and its possible impact
    in the future.


    To that end, this book provides an in-depth overview of artificial intelligence
    and machine learning, highlighting their historical development and application
    in various fields including, finance, business, and medicine. It covers how artificial
    intelligence interacts with human intelligence, including the possible partnerships
    between humans and machines and how each influences the other. People can utilize
    so much from artificial intelligence and machine learning to improve their lives
    and enhance their productivity. An interesting concept covered in this book is
    the AI superpowers across the world, and how they impact the development of AI
    today and possibly in the future. These include Amit Singhal of Uber, Andrew Ng
    of Baidu, Elon Musk of SpaceX, and Tesla, among others.


