    * 易于工厂管理。


    人机界面设备具有核心电子元件，用于工业环境中调节和信号化不同类型的自动化设备。HMI 产品范围从带有标准 `LED` 指示屏的简单设计，到带有触摸屏和许多不同功能的多功能
    HMI 系统。HMI 系统必须足够坚固，并能够承受恶劣环境。HMI 应具有防尘、防水和耐极端温度的能力，在某些情况下甚至耐腐蚀化学品。


    如下文所述，在您的工厂或设施中安装 HMI 有许多用途：


    ### 报警


    工厂操作人员可以看到人机界面提供的信号，以识别设备的任何故障并迅速做出反应。报警有助于在紧急情况发生前预防并提醒操作人员。报警还可以帮助跟踪其他问题，并有助于优化生产过程以提高生产率。


    ### 可靠的消息传递


    作为操作人员，当发生特定事件时，您可以依靠 HMI 消息进行 Facebook 页面、传真等操作。在其他情况下，当机器燃料水位低且需要加注时，操作人员会自动收到报警。


    ### 更容易的工厂通用管理


    HMI 技术将高效地管理和执行配方。它具有高质量的图形，提供工厂运行的真实视图，让操作人员从中央监视器轻松进行控制。


    ### 通过模拟进行准确测试


    工厂经理可以使用带有模拟功能的灵活 HMI 快速检查设备和装置。您可以在办公室的舒适环境中无需任何设备即可完成测试。这将有助于缩短启动时间并增强整体生产。


    ### 降低成本


    HMI 通过取代数百个选择器、指示灯和按钮降低了运营成本，这意味着它将减少面板、电缆和控制台的增加。


    ### 增强通信


    HMI 通过远程、`Ethernet`、`data highway plus`、`serial port`、`dynamic data exchange`
    等多种方法增强设施内各种类型设备之间的通信。您可以注意到，拥有 HMI 可以让您的设施在运行、安全和生产方面受益。像 `Red Lion` 这样的行业为严苛的工业应用提供了多种
    HMI 产品。


    ## 人机界面类型


    如下所示，HMI 有不同类型：


    ### 自动替换器


    它通过将每个开关的所有功能整合到一个位置，使制造过程合理化。它取代了 `LEDs`、开关/旋钮和按钮。这些电动设备可能会被淘汰，因为 HMI 可以提供 `LCD`
    显示器上实现的所有设备的视觉设计，同时处理所有其他任务。


    ### 数据处理


    这种类型的 HMI 通常适用于需要系统提供持续响应的应用。它们大多数配备了强大的能力内存。您必须确保 HMI 屏幕足够大，以便显示图表、制造分解和光学图。它可以包含指南、数据排序和报警管理等功能。


    ---


    ![image](img/scene_break.png)


    ### 管理员


    在任何涉及 `SCADA` 的演示中，主 HMI 都将至关重要。HMI 将主要运行 `windows` 并参与许多 `Ethernet` 端口。


    ## 程序选择


    ### 标记软件


    这是构建者提供的软件，具有益处，是被许可使用的。


    ### 自治软件


    这是已约定使用的第三方软件。


    ### 脆弱性软件


    这种软件具有感知性，使其拥有广泛的知识，并且交付允许用户进行仔细选择。


    ––––––––


    ![image](img/scene_break.png)


    ## 人机界面应用


    HMI 有多种用途：


    * 便利性贸易可以监测水传输。

    * 它们被用于生产线，协助控制速度、故障更改等所有功能。

    * HMI 可以控制金属切割，提高其执行速度。


    ## 人机界面优势


    * HMI 降低了生产成本。

    * 它提高了效率和生产力。

    * 它节省了数据，方便以后故障时使用。

    * HMI 扩展具有比以往任何时候都强大的创新能力和开发功能的能力，不再需要鼠标和硬件到软件的需求。


    ## 人机通信


    如果你想变得有用、鼓舞且令人兴奋，你就必须创建一个真正的认知体验。认知是一个心理过程，你通过思考、经验和感官获取知识和理解。认知定义了人类如何处理思想以相互作用。在计算机的情况下，感知是指一个通过使用旨在人类认知技能的算法模型来激发人类过程的系统。


    '
