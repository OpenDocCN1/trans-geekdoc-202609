    1960s, the development of algorithms was emphasized by several researchers to
    address mathematical problems. In the same decade, computer scientists discovered
    `Machine Vision Learning` which could be used in controlling robots, and in 1972
    the first intelligent robot, `WABOT-1`, was established in Japan.


    However, amidst the global effort to enhance `AI` applications, computer scientists
    realized that it was challenging to create intelligence in machines. In order
    for `AI` and machine learning to become successful, scientists needed an enormous
    amount of data. However, the computers that were available at the time were not
    well-developed to handle such magnitude of data. Corporations and governments
    lost faith in `AI`, and in the 1970s and 1990s, scientists experienced a shortage
    in the funding of `AI` research.


    In the 90s, several giant companies once again developed an interest in developing
    `AI`. The government of Japan unveiled the plans to come up with the `5^(th)`
    generation computers in order to advance machine learning. The enthusiasts of
    `AI` believed that computers would soon carry conversations, interpret photos,
    translate languages and reason like humans. In 1997, the `Deep Blue`, IBM’s computer,
    became the first to beat all computers in holding and interpreting information.


    Over time, the exponential gains in the processing powers and storage ability
    of computers enabled companies to store vast quantities of data. And in the past
    15 years, superpowers such as `Google`, `Amazon`, `Baid`, and other companies
    have exploited `AI` and machine learning to a great commercial advantage.


    # The Goals of AI


    The key goals of `AI` include:


    ### Knowledge Representation and Reasoning

    This is a field within `AI` that focuses on the implementation and design of computer
    representations, which are able to process information. `AI` aims to automate
    these types of reasoning through the codification of relationships or rules in
    a way that can be interpreted easily by the computer system. Some of the common
    uses of knowledge representation and reasoning include a natural-language user
    interface that aids communication between computers and humans and computer-aided
    diagnosis that assists physicians to interpret medical records in the form of
    images.


    ### Automated Planning and Scheduling

    This is another subcomponent of `AI` that deals with the production of automated
    action sequences that correspond to the measurements, which can be executed using
    `AI` systems. The goal of `AI` planning is to mechanize and automate the generation
    of any plan based on a set of actions as well as predetermined objectives and
    goals. One of the examples of `AI` planning is the self-correcting computer software,
    automated information gathering, robots that act as autonomous agents, and computerized
    suggestions.


    ### Natural Language Processing

    Another significant goal of `AI` is the processing of natural language. This involves
    analysis and generation of language or data that humans can use for computer interfacing.
    The national language process aims to implement specific computer systems, which
    can process language data in large quantities. Some of the latest technologies
    that currently use natural language processing include the `Siri` app from Apple
    Company and `Google Now`.


    ### Computer Vision

    The main aim of this `AI` component is to assess the automation and computerization
    of tasks that can be performed by human vision and system development in order
    to process, utilize, or interpret visual data. `Computer vision` utilizes several
    applications, including facial recognition, object recognition, automated image
    manipulation, and video tracking. `Computer vision` is commonly applied in facial
    recognition. Other applications are automated image manipulation, integration
    with virtual reality, object recognition, and video tracking.


    ### Robotics

    Another significant goal of `AI` is robotics, which is about the construction,
    design, and operation of robots and machines that can replace human tasks. Robotics
    is a branch of engineering and science that includes electronic engineering, information
    engineering, computer science, and electronic engineering. Research on robotics
    is currently conducted to promote military, domestic, and commercial applications.
    `Amazon`, one of the largest global retailers in the world, has autonomous robots
    in their warehouse with the role of keeping the warehouse organized and the operations
    more efficient.


    ### Artificial General Intelligence

    The goal of `AI` is also to achieve artificial general intelligence, which demonstrates
    the system’s ability to perform intellectual tasks, similar to human beings. `AI`
    achieves its `AGI` goal through integrated systems, including emotional intelligence,
    cognitive intelligence, and social intelligence.


    ![image](d2d_images/scene_break.png)


    # The Goals of Machine Learning


    Machine learning is primarily used for the following output types:


    ### Unsupervised Clustering

    Clustering refers to the unsupervised technique used to discover the structure
    and composition of a particular data set. It involves clumping data into clusters
    in order to observe the resulting grouping. Each of the clusters can, thus, be
    categorized by a set of data points. The common algorithms used to address this
    goal include `hierarchical clustering` and `K-means clustering`.


    ### Supervised Classification (Two-Class and Multi-Class)

    Classification, on the other hand, involves placing data points into a pre-defined
    category or class. In some cases, classification problems assign a class to an
    observation or estimate the probability that specific observation falls under
    a particular class. An example of a two-class classification is giving a class
    of `Ham` or `Ham` to a particular email, in which ‘ham’ simply means ‘not spam.’
    On the other hand, the multi-class classification simply means multiple classes.
    In the spam example, it could mean a third class, which is ‘unknown.’


    ### Regression Analysis: Univariate and Multivariate

    As opposed to a discrete class, regression assigns a continuous response to an
    observed data. An example is predicting the price of `Dow Jones Industrial Average`
    on a particular day. The value could be a number, which would be perfect for regression.
    The algorithms used to achieve this goal are `simple or multiple linear regression`,
    `forest or decision tree regression`, `artificial neural network`, `Poisson regression`,
    `ordinal regression`, and `nearest neighbor methods`.

