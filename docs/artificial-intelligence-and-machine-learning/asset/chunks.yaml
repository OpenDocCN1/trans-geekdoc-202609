    the world. The company uses AI to combine mapping, perception, motion, planning,
    control, and decision making into software designed to eliminate drive-error accidents.


    Sift Science


    Sift Science provides multi fraud management services all in one platform. Sift
    uses thousands of data points from around the web to train in detecting fraud
    patterns. The technology helps payment processors, marketplaces, e-commerce stores,
