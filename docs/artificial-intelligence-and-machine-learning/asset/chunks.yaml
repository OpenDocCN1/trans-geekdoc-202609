    该公司旨在减少未能及时获得正确治疗的中风患者人数。其软件将患者大脑的 CT 图像与其扫描数据库进行交叉比对，可以在几分钟内向专家发出大血管阻塞性中风早期迹象的警告，而这在其他情况下可能会被忽略或需要太长时间才能发现。该公司的
    AI 产品已在多个国家的主要医院使用，例如纽约的西奈奈山医院（Mount Sinai）和丹佛的瑞典医疗系统。


    ## Deep 6


    该公司开发出了一种 AI 产品，帮助药物研究团队在新的技术试验中寻找合适的患者群体。该公司的软件可以从电子医疗记录中提取数据，创建患者图谱，允许研究人员根据特定条件和特征进行过滤，从而在短时间内完成匹配。系统的语言理解引擎经过训练，即使注释中没有提到，也能推断出某些情况。目前，该公司在全美及全球范围内拥有
    20 多家医疗系统和制药客户。


    ## Armorblox


    Armorblox 在两年前进入网络安全市场。其目的是保护客户免受社会工程攻击的影响，例如利用你的失误的钓鱼邮件。它使用自然语言处理技术，让机器能够学习和理解语言。其软件分析客户的沟通风格以感知语境，然后自动标记可能的钓鱼尝试、内部威胁或意外的数据泄露。


    ## DefinedCrowd


    DefinedCrowd 利用人类贡献者为客户构建定制的数据集。该公司通过一个名为 `Neevo` 的平台招募自由职业者，并为他们分配如标记图像或录制音频等任务，尽可能通过
    `Machine Learning` 的自动化来加速他们的工作。所有由人类创建或检查的数据都会被汇成客户可用于训练算法的格式。


    ## May Mobility


    May Mobility 正在以一种比汽车更具预测性的形式应对自动驾驶挑战。他们开发了自动驾驶穿梭车。该公司的软件已在罗德岛州普罗维登斯和俄亥俄州哥伦布支持穿梭车服务，你可以作为乘客乘坐自动驾驶穿梭车进行城市观光。


    # 打造你更智能明天的人工智能初创公司


    不仅是大公司在向其产品和服务中注入人工智能。其他较小的公司也在努力开发它们的智能技术和服务。而且，他们表现得非常出色！这里有一份你今天可能不知道的智能初创公司列表，但它们将来将在很大程度上定义你的明天：


    ![image](img/scene_break.png)


    ## Tempus


    总部位于伊利诺伊州芝加哥，主要关注健康科技、生物技术和大数据。Tempus 使用 `A.I.` 大规模收集和分析海量的医疗和临床数据。该公司使用 `AI`
    提供精准医疗，根据每个人的特定健康需求实现个性化和优化治疗。它依赖患者的可用数据（如基因组成和病史）进行诊断和治疗。Tempus 目前正在使用 `AI` 在癌症研究领域取得突破。


    ## DataRobot


    该公司总部位于马萨诸塞州波士顿。该公司为数据科学家提供了一个构建和部署 `Machine Learning` 模型的平台。该软件通过为数据寻找最佳预测模型来帮助公司解决挑战。该公司的软件用于医疗保健、制造业、保险、`FinTech`
    和体育分析。


    ## Narrative Science


    总部位于伊利诺伊州芝加哥。Narrative Science 创建了 `Natural Language Generation (NLG)` 技术，可以将数据翻译成故事。通过突出显示最相关和最令人兴奋的信息，无论员工对数据或分析的经验如何，都能更快做出决策。


    ## Cognitive Scale


    这家来自德克萨斯州奥汀的公司专注于软件和 `Cloud`。Cognitive Scale 为医疗、保险、金融服务和数字商务行业构建增强智能。其技术帮助企业增加客户获取和互动，同时改进账单和理赔等流程。Cognitive
    Scale 的产品被 `JP Morgan`、`NBC`、`Chase` 和 `Macy''s` 等大公司使用。


    ## AlphaSense


    AlphaSense 将模型集中在 `FinTech` 。它是一个 AI 驱动的搜索引擎，旨在帮助投资公司、银行和财富 500 强企业在大量的报告、新闻和研究中寻找信息。该技术利用人工智能扩展关键词搜索。


    ## Clarifai


    这家位于纽约的软件公司是一个图像识别平台，帮助用户组织、策划、过滤和搜索他们的媒体。该平台允许对图像和视频进行标记，教会人工智能显示哪些对象。


    ## Neurala


    Neurala 正在开发 `Neurala Brain`，这是一种深度神经网络软件，可以让摄像头、手机和无人机变得更智能、更容易使用。该公司的产品已在全球数百万设备上使用。`NASA`、`Motorola`、`华为`
    等大公司和机构也在使用这项技术。


    ## NuTonomy


    该公司专注于为汽车和运输行业开发应用。凭借提供安全高效无人驾驶车辆的愿景，该公司正在开发用于全球城市的软件。该公司使用 `AI` 将制图、感知、运动、规划、控制和决策整合到消除驾驶错误的软件中。


    ## Sift Science


    Sift Science 提供全平台的欺诈管理服务。Sift 利用来自网络的数千个数据点来检测欺诈模式。该技术帮助支付处理商、市场、电子商务商店甚至社交网络检测并防止欺诈。该公司的产品被
    `Twitter`、`Airbnb` 和 `Zillow` 等领先公司使用。


    ## Zebra medical vision


    该公司开发了用于放射和医学成像的软件，增强了放射科医的诊断能力，同时让他们专注于患者护理。Zebra 利用数百万临床记录和图像创建疾病检测算法。这些算法最终将帮助医疗人员尽早发现高风险患者，并以更准确的结果管理日益增长的工作。


    ## Sherpa


    Sherpa 是由预测性人工智能驱动的虚拟个人助手。`VPA` 连接用户的整个设备网络，推断并预测他们的需求。Sherpa 每天学习和分析超过 10 万个参数，以保持信息更新和用户井然。


    ## OpenAI


    它是一家非营利研究公司，其使命是创建安全的人工智能 (`AGI`)。`AGI` 的目标是创建与人类智能相似的通用机器。通过对长期研究和透明度的关注，该公司希望安全、负责任地推进
    `AGI`。该公司已获得 `Microsoft` 和 `Amazon` 等大公司的赞助。


