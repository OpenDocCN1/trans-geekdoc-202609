    无论如何，机器真的能具有创造力吗？它们能被视为独立的艺术家吗？如果说创造力是人类的特征，那么一个由电线和晶体管组成的集合又如何被认为具有想象力呢？也许我们并没有想象中那么那么不同。我们的人类大脑受限太深，甚至无法想象机器的想象力可能变得多么不可思议。如今的机器已经在艺术领域展现出创造力的迹象。有些软件通过组合脸部结构算法，可以生成不存在的人类的可信图像。


    ## 针对人类问题的机器思维


    在没有数据数据的情况下，就没有 AI。在这方面，AI 无法解决数据上未被收集的问题。因此，AI 的知识是有极限的。


    除非向 AI 系统输入诸如情绪检测、心率、面部表情、动作、日常习惯等数据，否则系统将无法理解人类行为。它无法适应人类天生的不同动机组合。


    人类知识中那种不容置疑的固定性，将被视为一种能够整合知情且热情的推测，以做出适应独特情况的道德选择。目前尚不确定动物是否能协调地利用客观推理和情感推演来做出道德选择。无论是否有少数动物能做到这一点，这里的怀疑在于，这种伦理品质的对于每个物种和文化来说都是非凡且合理的。


    ## 意识


    在四岁时，孩子们通常开始掌握社会的本质标准之一：他们的思维与他人的思维不同。他们可能有不同的信念、愿望、感受和目标。


    机器意识是另一个令人惊叹且跨学科的研究领域。它与 AI 紧密交织，尽管试图忽视这一点会更简单，但对于每一个需要从基础观点接触 AI 的人来说，这是一个基础性问题。


    尽管对人工智能有着巨大的兴趣，但对集体意识的兴趣要少得多。这就是我们额外很少看到治理系统——民主制度、政府事务、商业和经济——运行智能程度提升较小的动力之一。我们被挤满人类智能的组织所包围，综合考虑，这些组织经常表现出集体意识。


    尽管机器感知领域没有进展，或者证明机器认知不存在，它也将丰富人类意识的学习和系统建设。这将理想地促进健康、行政和政治领域取得宝贵的进展。


    所有研究机器意识的分析师在某个时刻都会面临法律和道德问题及建议。这可能发生在不同的情况下，类似于动物保护运动，后者由于对动物意识的承认而反对研究和实践。


    ## 独特性


    相似性和差异并不意味着 AI 比人类智能更好，或者反之亦然。要点在于，它们是完全不同的事物。


    人工智能擅长处理具有明确界限、可以通过数据交流的冗余任务，但不擅长需要直觉和基于不完整信息做出决策的扩展性任务。有趣的是，人类知识在需要保持警觉和进行概念选择的环境中非常有用，但在需要大量计算和实时数据处理的任务中表现糟糕。人类智能和
    AI 相互互补，弥补彼此的短板。它们共同可以完成任何一方都无法独立完成的任务。


    随着 AI 越来越擅长执行不断增多的任务，我们作为人类将发现更多机会将智能付诸真正的用途，即在创造、社交、文学、诗歌、体育以及每一项重要的事情上，因为这些事情融入了人类的要素和性格。此外，我们将利用扩展的洞察力设备来改进这些创作。未来将是人工智能与人类智能共同构建，而非孤立。


