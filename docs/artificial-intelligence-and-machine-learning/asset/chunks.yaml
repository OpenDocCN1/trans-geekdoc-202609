    are coping with a system that is quicker and more highly capable than we are by
    orders of magnitude.


    6\. The need to mitigate against unplanned consequences, as smart machines are
    reliably considered to be taught and develop independently


    As we tend to build technology, we want to know the mechanism of reward and aversion,
