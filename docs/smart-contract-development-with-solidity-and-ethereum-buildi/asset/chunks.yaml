    ## 6. 步骤 `4` 是 `Ethereum Settings`（以太坊设置），非常重要


    将 `Consortium Member Id`（联盟成员 ID）设为 `0`，并保持 `Network ID`（网络 ID）为已选默认值。网络 ID 作为我们将要设置的以太坊网络的名称。这意味着只有具有相同网络
    ID 的节点才能相互配对。您可以在此提供自定义创世区块，如果您想使用现有账户进行设置，这会很有用，但目前我们坚持使用默认设置，继续提供 `Ethereum
    account password`（以太坊账户密码）。输入密码，确认密码，并将其保存在某处以便记忆。您需要提供通行短语来生成私钥。输入您选择的通行短语并确认，就像设置密码时一样：


    ![](img/Figure_2.2.11.jpg)


    **图 2.2.11**


    ## 7. 在步骤 `5` 中，根据您最近的位置选择 `OMS Workspace Location`（OMS 工作区位置）


    我在此选择 `Central India`（印度中部）：


    ![](img/Figure_2.2.12.jpg)


    **图 2.2.12**


    ## 8. 在步骤 `6` 中，您将看到我们所选择内容的摘要


    检查所有内容，然后点击 `OK` 进入 `Buy`（购买）部分。


    ![](img/Figure_2.2.13.jpg)


    **图 2.2.13**


    ## 9. 步骤 `7` 是 `Buy`（购买）选项部分


    在进行购买前请阅读所有条款和条件，然后点击 `Create`（创建）：


    ![](img/Figure_2.2.14.jpg)


    **图 2.2.14**


    ## 10. 点击 `Create` 后，设置和创建资源需要一些时间


    会显示类似 `Submitting deployment for Ethereum Proof-of-Work…`（正在提交以太坊工作量证明部署……）的信息，请稍等片刻，一切都会好起来的。


    ![](img/Figure_2.2.15.jpg)


    **图 2.2.15**


    ## 11. 部署完成后，您可以导航到 `Resource groups`（资源组）


    如下面的屏幕截图所示，选择您使用提供的资源组名称新创建的资源：


    ![](img/Figure_2.2.16.jpg)


    **图 2.2.16**


    ## 12. 点击 `Resource groups` 将带您查看为联盟创建的所有资源


    如下面的屏幕截图所示。现在点击左侧边栏中的 `Deployments`（部署）以查看所有已进行的部署：


    ![](img/Figure_2.2.17.jpg)


    **图 2.2.17**


    ## 13. 您将被重定向到可查看所有部署的部分


    ![](img/Figure_2.2.18.jpg)


    **图 2.2.18**


    ## 14. 选择第一个链接 `Microsoft-azure-blockchain` 以查找有关新创建区块链的所有信息


    ![](img/Figure_2.2.19.jpg)


    **图 2.2.19**


    ## 15. 您将看到 `Overview`（概览）、`Outputs`（输出）、`Inputs`（输入）和 `Template`（模板）等部分的页面


    如下面的屏幕截图所示：


    ![](img/Figure_2.2.20.jpg)


    **图 2.2.20**


    ## 16. 选择 `Outputs`，您将获得连接到链所需的所有信息


    复制 `ADMIN-SITE` 的地址并在浏览器中打开，如下面的屏幕截图所示：


    ![](img/Figure_2.2.21.jpg)


    **图 2.2.21**


    ## 17. 管理员站点将在浏览器中打开，外观如下所示


    在此页面上，您可以看到有关区块链的信息。Azure 已为我们创建了一个创世区块，页面上显示默认账户为 `My Account Address`（我的账户地址）。我们看到我们的账户中也有一些以太币余额，可以开始使用我们的区块链了。


    ![](img/Figure_2.2.22.jpg)


    **图 2.2.22**


    工作已完成一半，我们已成功在 Azure 上为以太坊区块链设置了账户。


    ![](img/Figure_2.2.23.jpg)


    **图 2.2.23**


    # 使用 MetaMask 设置第二个账户


    以下是使用 MetaMask 设置第二个账户的步骤：


    ## 1. 要设置第二个账户以转入一些以太币，请复制 `ETHEREUM-RPC-ENDPOINT` 地址


    如下面的屏幕截图所示，从我们复制 `ADMIN-SITE` 地址的同一位置（Azure 门户）获取。


    ![](img/Figure_2.2.24.jpg)


    **图 2.2.24**


    ## 2. 现在转到 Chrome 扩展程序，在 Chrome 网上应用店中搜索 `MetaMask`


    它是一个 Chrome 扩展程序，因此可以通过点击 `ADD TO CHROME`（添加至 Chrome）按钮轻松添加到 Chrome。MetaMask 是一个用于开发和测试的实用钱包应用程序：


    ![](img/Figure_2.2.25.jpg)


    **图 2.2.25**


    ## 3. 添加到 Chrome 后，您将在 Chrome 浏览器右上角看到 MetaMask 图标


    这表明 MetaMask 已添加到 Chrome。点击该图标，阅读条款和条件后点击 `Accept`（接受）按钮。


    ![](img/Figure_2.2.26.jpg)


    **图 2.2.26**


    ## 4. 点击 `Accept` 后，您将被重定向到使用 MetaMask 创建账户


    如下面的屏幕截图所示提供密码，然后点击 `CREATE`（创建）：


    ![](img/Figure_2.2.27.jpg)


    **图 2.2.27**


    ## 5. 创建密码后，您将看到一个唯一的账户图像，每次您进行交易时都会看到它


    点击 `NEXT`（下一步）：


    ![](img/Figure_2.2.28.jpg)


    **图 2.2.28**


    ## 6. 在下一页，您将看到条款和条件


    仔细阅读，如果您希望继续，请点击 `ACCEPT`（接受），如下面的屏幕截图所示：


    ![](img/Figure_2.2.29.jpg)


    **图 2.2.29**


    ## 7. 接受条款和条件后，您将看到 `Secret Backup Phrase`（秘密备份短语）


    如下面的屏幕截图所示，用于恢复和备份您的账户。最好将这些代码保存在只有您能访问的安全地方。点击 `CLICK HERE TO REVEAL SECRET WORDS`（点击此处显示秘密单词）以获取短语：


    ![](img/Figure_2.2.30.jpg)


    **图 2.2.30**


    ## 8. 在下一页，您需要验证您的短语


    因此，按照短语最初在该页面上的顺序选择单词：


    ![](img/Figure_2.2.31.jpg)


    **图 2.2.31**


    ## 9. 选择您喜欢的测试网络


    如下面的屏幕截图所示：


    ![](img/Figure_2.2.32.jpg)


    **图 2.2.32**


    ## 10. 现在，在 `Settings`（设置）选项卡下，将我们从 Azure 门户复制的 URL 粘贴到 `New RPC URL`（新 RPC URL）文本框中


    ![](img/Figure_2.2.33.jpg)


    **图 2.2.33**


    ## 11. 返回 Chrome MetaMask 扩展程序，我们现在可以看到新创建的账户


    如下所示。复制账户地址，如下面的屏幕截图所示：


    ![](img/Figure_2.2.34.jpg)


    **图 2.2.34**


    ## 12. 转到我们在另一个标签页中打开的管理员页面，将复制的 MetaMask `Account 1`（账户 1）地址粘贴到 `Address of Recipient`（收件人地址）框中


    如下面的屏幕截图所示：


    ![](img/Figure_2.2.35.jpg)


    **图 2.2.35**


    ## 13. 添加要发送给收件人的以太币 `Amount`（数量），例如 `1000`，然后点击 `SUBMIT`（提交）


    ![](img/Figure_2.2.36.jpg)


    **图 2.2.36**


    ## 14. 提交后，您将看到消息 `Ether sent!`（以太币已发送！）


    ![](img/Figure_2.2.37.jpg)


    **图 2.2.37**


    ## 15. 但真的发送了吗？我们可以通过再次返回 Chrome 扩展程序并点击狐狸图标快速检查


    `Congratulations`（恭喜）！！我们看到 `1000 ETH` 现已转入该账户：


    ![](img/Figure_2.2.38.jpg)


    **图 2.2.38**


    因此，我们成功地使用 Azure 区块链联盟将以太币从一个账户转移到了另一个账户。我们现在可以为我们的区块链开发智能合约。我将在后续章节中介绍智能合约和其他相关主题。


    # 结论


    在本章中，我们学习了如何在 Azure 上设置以太坊区块链，并使用 MetaMask 通过向另一个账户转移一些以太币来测试我们的区块链。下一节将重点介绍智能合约以及如何设置编写智能合约的开发环境。


    ![](img/Figure_2.2.39.jpg)


    **图 2.2.39**


    # 问题


    1. 什么是 Azure？

    2. 什么是以太坊工作量证明联盟？

    3. Azure 上的资源组是什么？

    4. 什么是 MetaMask？

    5. MetaMask 使用什么节点？

    6. 用简单的方式解释工作量证明。


    # 第三部分


