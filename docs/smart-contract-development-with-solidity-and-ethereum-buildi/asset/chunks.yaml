  fmt: "\n# Truffle 简介\n\nTruffle 是一个用于以太坊开发的工具集框架，涵盖开发、测试和资产管道。Truffle 包含编译和构建解决方案的工具。它为自动化测试提供了框架，并通过对可配置部署位置的支持，使合约部署变得非常简单。Truffle\
    \ 的另一个优点是我们可以在控制台模式下使用它，直接与已部署的合约进行交互。这非常酷，稍后我将展示其工作原理。\n\n使用智能合约时，我们必须在将其发布到世界之前确保合约按预期工作，因为我们没有可行的“重来一次”的选项。上传到网络上的区块链测试环境需要一些时间。因此，使用本地测试区块链可以节省大量时间。Test\
    \ RPC 是一个易于使用的内存区块链，非常适合在开发过程中测试合约。无需等待外部区块链将加快早期开发阶段的速度。Test RPC 实现了 EthereumJS，这是真实以太坊区块链中相同的指令集。Test\
    \ RPC 的另一个优点是它会自动为你创建 10 个附带连接私钥的一次性测试账户。\n\n# 开发智能合约\n\n让我们开始开发第一个 `hello world`\
    \ 智能合约。我们将从执行 Test RPC 开始，在 Truffle 的帮助下创建一个项目，然后创建我们的 `hello world` 合约。\n\n1.\
    \  在 Windows 中创建一个名为 `helloworld` 的新文件夹：\n\n    ![](images/Figure_3.2.3.jpg)\n\
    \n    **Figure 3.2.3**\n\n2.  完成文件夹创建后，以管理员模式打开一个新的 PowerShell 实例，如下截图所示：\n\n\
    \    ![](images/Figure_3.2.4.jpg)\n\n    **Figure 3.2.4**\n\n3.  现在，使用 `cd` 命令进入刚才创建的\
    \ `helloworld` 文件夹，如下截图所示：\n\n    ![](images/Figure_3.2.5.jpg)\n\n    **Figure\
    \ 3.2.5**\n\n4.  现在，我们将使用 Truffle 启动我们的解决方案。这将在 `helloworld` 目录中为我们获取框架并创建简单项目，帮助我们快速开始。因此，在\
    \ PowerShell 窗口中输入命令 `truffle init` 并按 `Enter` 键：\n\n    ![](images/Figure_3.2.6.jpg)\n\
    \n    **Figure 3.2.6**\n\n5.  正如前面的截图所示，命令运行、下载必要的包并设置开发环境。你可以返回 `helloworld`\
    \ 文件夹检查为开发环境创建的文件夹和文件：\n\n    ![](images/Figure_3.2.7.jpg)\n\n    **Figure 3.2.7**\n\
    \n6.  现在你可以启动 VS Code 并打开源 `code` 文件夹，或者遵循一种更直接的方法，只需在 PowerShell 控制台窗口中输入 `code\
    \ .`。这将在我们的 IDE（即 Visual Studio Code）中为我们打开该文件夹。\n\n    ![](images/Figure_3.2.8.jpg)\n\
    \n    **Figure 3.2.8**\n\n7.  VS Code 启动后，你可以看到解决方案中加载的文件和文件夹。我们看到它自动为我们创建了一些测试合约。让我们暂时保持原样，继续下一步。\n\
    \n    ![](images/Figure_3.2.9.jpg)\n\n    **Figure 3.2.9**\n\n8.  是时候创建一个新合约了。右键单击\
    \ `contracts` 并添加 `New File`。\n\n    ![](images/Figure_3.2.10.jpg)\n\n    **Figure\
    \ 3.2.10**\n\n9.  添加一个你选择名称的新文件。在我的例子中，我将其命名为 `helloworld.sol`，如下截图所示：\n\n   \
    \ ![](images/Figure_3.2.11.jpg)\n\n    **Figure 3.2.11**\n\n10.  让我们编写一些代码。在继续编写方法之前，我们将按如下截图所示设置\
    \ pragma（代码的第一行）为 `0.4.22`，这意味着它适用于 `0.4.22` 及以上版本的 Solidity。这样，我们就可以确信我们的代码完全按照设定的版本工作。\n\
    \n11.  接下来，定义一个名为 `helloworld` 的合约，后跟花括号，就像定义类一样，在这些括号内将是我们的方法、属性和变量。定义一个名为 `PrintHelloWorld()`\
    \ 的函数，按如下图所示返回一个字符串，并返回一个硬编码字符串 `Hello World!`。\n\n     ![](images/Figure_3.2.12.jpg)\n\
    \n     **Figure 3.2.12**\n\n我们的代码如下所示：\n\n```\npragma solidity ^0.4.22;\n\ncontract\
    \ helloWorld {\n    function PrintHelloWorld() public pure returns (string) {\n\
    \        return \"Hello World!\";\n    }\n}\n```\n\n现在，使用 `Ctrl + S` 保存文件。下一步是部署合约。\n\
    \n# 部署智能合约\n\n1.  在 `migrations` 文件夹下，我们找到告诉 Truffle 哪些文件需要部署到区块链的文件。在该文件中，通过创建一个名为\
    \ `HelloWorld` 的变量来引用 `helloworld.sol` 文件，并在 `module.exports` 中编写 `deployer.deploy(HelloWorld)`，从而为\
    \ `helloworld` 创建一个部署器，如下截图所示：\n\n    ![](images/Figure_3.2.13.jpg)\n\n    **Figure\
    \ 3.2.13**\n\n2.  代码如下所示：\n\n```\nvar Migrations = artifacts.require(\"./Migrations.sol\"\
    );\nvar HelloWorld = artifacts.require(\"./helloworld.sol\");\nmodule.exports\
    \ = function(deployer) {\n    deployer.deploy(Migrations);\n    deployer.deploy(HelloWorld);\n\
    };\n```\n\n3.  现在我们需要运行 Test RPC 服务器。为此，打开一个全新的 Windows PowerShell 实例，保持已打开的实例原样。输入命令\
    \ `testrpc` 以启动服务器，如下截图所示。正如我之前所述，它一启动就会为我们创建测试账户和私钥，第一个账户被用作默认账户。某些功能可能需要管理员访问权限才能开始。因此，如果弹出请求访问的窗口，请允许：\n\
    \n    ![](images/Figure_3.2.14.jpg)\n\n    **Figure 3.2.14**\n\n4.  我们可以看到，默认情况下服务器运行在端口\
    \ `8545` 上。现在服务器已启动并运行，保持此窗口打开，返回我们之前正在使用的 PowerShell 窗口。\n\n    ![](images/Figure_3.2.15.jpg)\n\
    \n    **Figure 3.2.15**\n\n5.  现在编译我们的解决方案。使用命令 `truffle compile` 编译解决方案。编译完成后，如下截图所示，它将构建工件写入\
    \ `build\\contracts` 文件夹。\n\n    ![](images/Figure_3.2.16.jpg)\n\n    **Figure\
    \ 3.2.16**\n\n6.  现在我们可以部署合约了，因为它已成功编译。我们可以通过 `truffle migrate` 命令进行部署，如下截图所示。输入命令并按\
    \ `Enter` 键。\n\n    ![](images/Figure_3.2.17.jpg)\n\n    **Figure 3.2.17**\n\n\
    \    是的，我们得到了一个错误：\n\n    ![](images/Figure_3.2.18.jpg)\n\n    **Image credit:**\
    \ [https://pixabay.com](https://pixabay.com)\n\n    **Figure 3.2.18**\n\n7.  错误提示无法确定当前网络。因此，我们需要做一些准备工作来解决这个问题。如果你没有收到错误，可以跳过*步骤\
    \ 5 到 7*，因为这可能已在你的版本中配置好。但对于遇到此错误的人，请遵循下面描述的*步骤 5 到 7*。\n\n8.  返回打开解决方案的 VS Code，我们在那里看到一个名为\
    \ `truffle.js` 的文件，它应包含服务器配置：\n\n    ![](images/Figure_3.2.19.jpg)\n\n    **Figure\
    \ 3.2.19**\n\n9.  默认情况下，该文件中的所有内容都被注释掉了，我们可以定义自定义配置。因此，用以下代码替换该文件中的全部文本：\n\n```\n\
    module.exports = {\n    networks: {\n        development: {\n            host:\
    \ \"localhost\",\n            port: 8545,\n            network_id: \"*\" // Match\
    \ any network id\n        }\n    }\n};\n```\n\n    ![](images/Figure_3.2.20.jpg)\n\
    \n    **Figure 3.2.20**\n"
