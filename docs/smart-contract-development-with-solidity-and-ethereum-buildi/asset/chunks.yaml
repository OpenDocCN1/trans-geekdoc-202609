    \    **Figure 2.2.6**\n\n3.  Once clicked on `Ethereum Proof-of-Work Consortium`,\
    \ leave the deployment model as it is and click on the `Create` button, as shown\
    \ in the following screenshot:\n\n    ![](images/Figure_2.2.7.jpg)\n    **Figure\
    \ 2.2.7**\n\nOnce you click on create, you'll see a page where you need to fill\
    \ specific details. Following are the step-by-step creation guidelines.\n\n1.\
    \  For step `1` (`Basics`), provide the `Resource prefix` to keep the consortium\
    \ items segregated from other existing resources on your Azure portal. Example:\
    \ I have given it a name `eth`; you can have your own or else can use this as\
    \ well:\n\n    ![](images/Figure_2.2.8.jpg)\n    **Figure 2.2.8**\n\n2.  Provide\
    \ the `VM user name` of your choice, as shown in the preceding screenshot. I have\
    \ used `athadmin`, though I wanted to use `ethadmin`; it was a typo from me to\
    \ use `athadmin`, which hardly matters as we are developing to learn.\n\n3.  You\
    \ can choose to have an `Authentication type` as `Password` or `SSH public key`.\
    \ For now, I am using `Password`; make sure you remember the password that you\
    \ provide here. You can choose to have `Free Trial` as a `Subscription` or your\
    \ paid account if you have one. Create a resource group by providing a name so\
    \ that all your resources in the context of this consortium lie in this resource\
    \ group. All the items in the resource group share the same permissions, policies,\
    \ and life cycle. I have provided the name `ethrium-blockchain` as a `Resource\
    \ group`. Last, choose a `Location` close to where your application will run.\
    \ I have chosen `Central India`. Click `OK`.\n\n4.  Choose `Deployment regions`\
    \ in the second step; I have chosen `1` in the number of regions and `Central\
    \ India` as `First region` for it:\n\n    ![](images/Figure_2.2.9.jpg)\n    **Figure\
    \ 2.2.9**\n\n5.  The third step is to choose `Network size and performance` factors.\
    \ Leave the `Number of mining nodes` to the default value, that is, `2`. I chose\
    \ `Mining node virtual machine size as 2x Standard D1 v2`, that is, the minimum\
    \ one and may vary while working on large applications. The choice of virtual\
    \ machine size and transaction node virtual machine size is directly proportional\
    \ to size and performance. `Transaction Nodes` could be left to `1`, as shown\
    \ in the following screenshot. I choose the `Transaction node virtual machine\
    \ size` as the default one, that is, `1x Standard D1 v2`.\n\n    ![](images/Figure_2.2.10.jpg)\n\
    \    **Figure 2.2.10**\n"
  trans: "\n\n# 在 Microsoft Azure 上实施以太坊\n\n现在让我们进入正题，开始着手实施以太坊。设置和使用以太坊的方法有很多，在本节中，我们将重点介绍如何在\
    \ Microsoft Azure 平台上使用以太坊。Azure 是微软的云平台，通过使用它，我们也可以非常轻松地利用该平台的其他方面。这包括应用程序托管、存储、身份管理和安全性等，仅举几例。\n\
    \n在以太坊的语境下，联盟是指区块链支持成员与底层基础设施之间的协作。例如，这可以是一组希望共同合作并形成自己私有共享区块链的组织。一切始于联盟领导者。这是区块链的控制部分，您可在其中设置链的配置。这包括创世区块的创建以及向默认账户分配初始以太币。\n\
    \n有一点需要特别注意：当我们设置联盟时，这将是一个与公共以太坊区块链隔离的私有区块链。私有区块链上的以太币无法直接与公共区块链上的以太币进行兑换。领导者设置完成后，其他成员可以带着他们的基础设施加入。我们可以控制谁可以加入我们的联盟，也可以决定如何分配可用的以太币。设置基础设施的方法也有很多，但使用默认的\
    \ Azure 模板，您将获得一个在大多数情况下都能良好运行的基线基础设施。\n\n让我们详细了解一下，并看看它在运行场景中是如何工作的。用户将连接到一台公开可用的应用程序服务器，管理页面也运行在其上。这必须设置为一个单独的实例。您还应考虑您的客户端是否可以设置为完全分布式应用程序，即客户端运行在用户设备上。应用程序服务器的设置使其能够调用\
    \ `虚拟专用网络 (VPN)`，在那里它将遇到一个负载均衡器，后者将调用众多交易节点中的一个。使用默认模板时，处理交易的节点与挖矿节点是隔离的，且挖矿节点无法从虚拟专用网络外部访问。创建和运行区块链只需要这些，而且由于所有这些都在\
    \ Azure 中进行了模板化，您无需花费时间进行设置。它将自动为您完成。如果您决定添加联盟成员，他们将形成自己的 VPN 并在 VPN 之间建立隧道。这也意味着如果您愿意，也可以在成员网络上托管应用程序。\n\
    \n## 结构\n\n在本章中，我们将讨论以下主题：\n\n*   设置 Azure 账户\n*   在 Azure 账户上设置以太坊\n*   设置 Metamask\
    \ 并执行交易\n\n## 目标\n\n学习完本单元后，您应该能够：\n\n*   在 Azure 上设置以太坊区块链\n*   使用 Metamask 通过向另一个账户转账以太币来测试区块链\n\
    \n## Azure 账户设置\n\n让我们首先设置 Azure 账户。如果没有付费 Azure 账户，可以利用 Azure 新账户赠送 200 美元额度的福利。这意味着如果您是\
    \ Azure 新手并想体验其免费试用，您将获得 200 美元额度来探索 Azure。如果您是 Azure 新手且没有账户，请遵循以下流程；否则，直接登录您的门户。\n\
    \n1.  打开 Azure 网站：`azure.microsoft.com`。\n\n    ![](img/Figure_2.2.1.jpg)\n  \
    \  **图 2.2.1**\n\n2.  点击 `Start free` 创建您的免费 Azure 账户并获得 200 美元额度：\n\n    ![](img/Figure_2.2.2.jpg)\n\
    \    **图 2.2.2**\n\n3.  创建账户并领取 200 美元需要您的信用卡/借记卡仅用于验证，不会从您的卡中扣除任何金额。您可以使用此额度和账户试用\
    \ 30 天。您将看到注册页面，在其中填写所有信息并逐步注册。成功注册后，您将看到通往门户的链接，如下所示。\n\n    ![](img/Figure_2.2.3.jpg)\n\
    \    **图 2.2.3**\n\n4.  点击门户，您将进入仪表板，准备好使用/体验 Azure。\n\n    ![](img/Figure_2.2.4.jpg)\n\
    \    **图 2.2.4**\n\n## 在 Azure 上设置以太坊账户\n\n1.  进入仪表板后，点击大的 **+** 按钮（即 `Create\
    \ a resource`）以创建新资源。在搜索框中输入并回车 **Ethereum** 以获取我们所需的所有以太坊相关模板。请注意，您可能看到也可能看不到不同的名称或\
    \ Azure 门户上设置以太坊的布局，因为门户会不时变化：\n\n    ![](img/Figure_2.2.5.jpg)\n    **图 2.2.5**\n\
    \n2.  从模板列表中，选择 `Ethereum Proof-of-Work Consortium`。不能保证您看到的模板与此处所示完全相同。由于 Azure\
    \ 始终在持续开发中，当您遵循此实施时，可能会看到不同名称的模板或完全不同的模板。\n\n    ![](img/Figure_2.2.6.jpg)\n \
    \   **图 2.2.6**\n\n3.  点击 `Ethereum Proof-of-Work Consortium` 后，保持部署模型不变，然后点击\
    \ `Create` 按钮，如下截图所示：\n\n    ![](img/Figure_2.2.7.jpg)\n    **图 2.2.7**\n\n点击创建后，您将看到一个需要填写特定详细信息的页面。以下是分步创建指南。\n\
    \n1.  对于步骤 `1` (`Basics`)，提供 `Resource prefix` 以将联盟项目与 Azure 门户上其他现有资源隔离开。示例：我将其命名为\
    \ `eth`；您可以使用自己的名称，也可以使用此名称。\n\n    ![](img/Figure_2.2.8.jpg)\n    **图 2.2.8**\n\
    \n2.  按照前面的截图所示，提供您选择的 `VM user name`。我使用了 `athadmin`，虽然我想用 `ethadmin`；这是我的笔误，用了\
    \ `athadmin`，但这无关紧要，因为我们是在为学习而开发。\n\n3.  您可以选择将 `Authentication type` 设为 `Password`\
    \ 或 `SSH public key`。目前我使用 `Password`；请务必记住您在此处提供的密码。您可以选择将 `Free Trial` 作为 `Subscription`，或者如果您有付费账户则使用付费账户。通过提供名称创建资源组，以便该联盟背景下的所有资源都位于此资源组中。资源组中的所有项目共享相同的权限、策略和生命周期。我将\
    \ `Resource group` 命名为 `ethrium-blockchain`。最后，选择一个靠近您的应用程序运行位置的 `Location`。我选择了\
    \ `Central India`。点击 `OK`。\n\n4.  在第二步中选择 `Deployment regions`；我选择了 `1` 个区域数量，并将\
    \ `Central India` 作为 `First region`：\n\n    ![](img/Figure_2.2.9.jpg)\n    **图\
    \ 2.2.9**\n\n5.  第三步是选择 `Network size and performance` 因素。将 `Number of mining\
    \ nodes` 保留为默认值，即 `2`。我选择 `Mining node virtual machine size as 2x Standard D1\
    \ v2`，即最低配置，在大型应用程序中可能会有所不同。虚拟机大小和交易节点虚拟机大小的选择与规模和性能成正比。`Transaction Nodes` 可保留为\
    \ `1`，如下截图所示。我选择 `Transaction node virtual machine size` 为默认值，即 `1x Standard D1\
    \ v2`。\n\n    ![](img/Figure_2.2.10.jpg)\n    **图 2.2.10**\n\n"
