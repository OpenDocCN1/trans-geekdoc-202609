- raw: 'Bitcoin is a form of digital currency that is created and held entirely electronically
    instead of being printed currency. Unlike banks and traditional fare currencies,
    no one controls or runs Bitcoin. The Bitcoin algorithms control the rate at which
    new Bitcoins are introduced, and people are incentivized to help maintain and
    mine new coins by being paid themselves in Bitcoin. It is a first in a new category
    of currencies called cryptocurrencies. It can be spent electronically for both
    digital and physical goods. There are even vending machines that will let you
    purchase goods by using your mobile phone to pay for products with the Bitcoin
    that you own. But the essential feature of Bitcoin is that it is entirely decentralized.
    No one company or government owns or has any control over Bitcoin.


    After the gold standard was eliminated in the *U. S.* in *1971*, this is true
    for the *U. S.* dollar as well. You have a balance at your bank account, and you
    trust them to make sure that they keep a secure ledger over incoming and outgoing
    values. Banks are part of a vast global network where transactions can be done
    between banks, and currency can be exchanged. With Bitcoins, there is no central
    system. There is no bank, and there is no way to revert transactions once they
    are done. All transactions are transparent and can be entirely anonymous. Bitcoins
    could not have existed without the blockchain, and Bitcoins is its first broad
    use.


    # [Blockchain](#toc.xhtml#s6a)


    So, we have just introduced the term blockchain while discussing Bitcoin. Blockchain
    has often been talked about as the next revolution in computing, and it''s redefining
    how we interact and transact on the Internet. This may sound very theatrical,
    but as we discuss what a blockchain is and where it can be used, you''ll start
    to see why these claims make sense.


    The notion of a cryptographically secured chain of blocks was described by *Stuart
    Haber* and *Scott Stornetta* already in 1991. The first recognized work on the
    decentralized digital currency on using similar technology was done by *Nick Szabo*
    in *1998*. But it took almost 10 years until the blockchain concept was getting
    mature and published by *Satoshi Nakamoto* in *2008\. Satoshi* is by most considered
    to be the founder of Bitcoin in 2009. However, it is worth mentioning that, as
    of now, no one knows who *Satoshi Nakamoto* is. It is highly likely that *Satoshi*
    is not a real person and that it is a pseudonym used by someone else. There are
    many interesting theories around who it is, and this adds to the mystic and enchantment
    of Bitcoin and the underlying technology. Race forward to *2014* and the blockchain
    is hitting a mainstream term used by financial and technical media. Large companies
    are picking up speed on blockchain development. There''s massive investment being
    done by traditional legacy software companies like IBM and Microsoft. Still, there
    is also a large and rapidly growing mass of start-up companies getting their blockchain
    implementations out to the market.


    # [Characteristics of blockchain](#toc.xhtml#s7a)


    Let''s look at the characteristics of blockchain. First, it is a global singleton.
    If you know how singletons work for a program, you can think of the blockchain
    objects as global singleton instances. The blockchain is natively object-oriented,
    where code and data reside together. However, objects are securely separated from
    each other. It''s unstoppable. There is no one in control over a blockchain. It
    cannot be stopped, and it cannot have a central failure. No government or corporation
    can censor it, and it''s very resistant to being hacked. There is no power cord
    to pull nor a single point of attack. Blockchain, by its nature, is accessible.
    Everywhere there''s the Internet, and you can access the blockchain by using a
    large number of clients and technologies. And most of all, it''s verifiable. Everyone
    that has access to the blockchain can verify every single transaction from the
    beginning of time. This enables everyone to audit everything, and as we will learn
    in the next couple of sections, it is quite easy to do so.


    In short, blockchain is a kind of data structure that is tamper-proof and can
    track the digital assets as they pass from owner to owner. The digital asset could
    be a digital coin like Bitcoin, any document, or the transaction could be a monetary
    transaction between strangers on the Internet. It can, for example, give you an
    ability to store your medical information where only you have secure access or
    someone you allow would have that access. Not only this, but an asset with a digital
    fingerprint can also be tracked on a blockchain.


    Blockchain makes sure that the ownership of digital assets should be transferred
    rather than being shared or copied and so it solves the problem related to `double-spending`.
    Blockchain accomplishes this outstanding coup rapidly and internationally with
    no central authority to govern. This makes commerce more advanced for businesses,
    thereby eliminating the middleman and transactional fees.


    # [Hashing](#toc.xhtml#s8a)


    The core of any blockchain resides in the concept of hashing. Hashing is basically
    to execute a mathematical algorithm that creates a result with a given length
    regardless of the input given. The result of a hashing function is called a `hash`,
    and you can think of them as digital fingerprints. Hashing is a one-way function,
    meaning the function will always return the same result given the same input,
    but you can never regenerate the input based on the result of the hashing algorithm.
    As a simple example. Let''s say that we have a straightforward hashing algorithm
    that takes any number between `0` and `45` as input. The algorithm then doubles
    the number and rounds to the nearest `10`. This means that if input `5`, you will
    get a hashing result of `10`. The same will be true if you input `3` or `4`, but
    if you input `9`, the hash will `20` instead. The length of the result will always
    be two digits, even if you give a single digit input. If you run the algorithm
    several times using the same input, you''ll always get the same result, but you
    would not be able to figure out what the input was.


    When hashing in real life, a much more advanced hashing algorithm is, of course,
    used. The most used hashing algorithms are generally well known and available
    to the public. Hashing algorithms are generally created to execute fast. The more
    advanced you want your algorithms to be, the more power it takes to execute. A
    ubiquitous hashing algorithm used with blockchain is the `SHA 256`. It is one
    of several checksum hashing algorithms, and it will produce a long text string
    as a result. It''s designed by the *American National Security Agency,* and it''s
    made available to the public. The SHA is a family of hashing algorithms. The number
    following the names lets you know the complexity of the implementation.'
