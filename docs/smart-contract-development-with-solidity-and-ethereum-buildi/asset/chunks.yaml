  trans: "\n\n## 10.  现在在 migrations 节点下添加一个新的迁移文件，如以下截图所示，并将其命名为 `2_deploy_contracts.js`，然后将\
    \ `1_initial_migration.js` 中的部署代码移动到这个新创建的文件中：\n\n     ![](img/Figure_3.2.21.jpg)\n\
    \n     **图 3.2.21**\n\n## 11.  因此，该文件包含如下代码。\n\n```\nvar HelloWorld = artifacts.require(\"\
    ./helloworld.sol\");\n\nmodule.exports = function(deployer) {\n    deployer.deploy(HelloWorld);\n\
    };\n```\n\n## 12.  现在，再次回到之前报错的 PowerShell 窗口，再次通过输入命令 `truffle compile` 并按 *Enter*\
    \ 键来编译代码。按下 *Enter* 后，代码将针对我们在 VS Code 中所做的最新更改再次编译。现在，再次运行命令 `truffle migrate`\
    \ 进行部署。\n\n     ![](img/Figure_3.2.22.jpg)\n\n     **图 3.2.22**\n\n     这一次我们的迁移顺利运行，因为它们找到了当前正在运行的服务器。请看上图，它成功部署了我们的合约。我们还可以看到它在上传时获得的地址。\n\
    \n## 13.  现在，你可以继续创建用户界面来测试我们刚刚部署的合约；或者，Truffle 也提供了一种与合约交互的机制。我们可以通过 truffle\
    \ console 来实现。要在控制台模式下启动 truffle，请运行命令 `truffle console`，如以下截图所示：\n\n     ![](img/Figure_3.2.23.jpg)\n\
    \n     **图 3.2.23**\n\n     这将为 Truffle 打开一个控制台监听器。在此模式下，我们可以直接为我们的合约编写 *JavaScript*\
    \ 代码。让我们一步步来操作。\n\n# 测试智能合约\n\n在 truffle 控制台模式下，使用 `var` 关键字定义一个名为 `helloW` 的变量（或任何你喜欢的名称）。然后按\
    \ *Enter*。我们将尝试用这个变量访问我们的合约。按下 *Enter* 后，我们得到 `undefined`，这很显而易见，因为该变量尚未赋予任何内容。由于与合约的通信应该是异步的，我们现在编写异步代码来访问合约。由于在我们的代码中，合约是通过\
    \ `deployed` 关键字引用的，所以我们也将通过 `helloWorld.deployed();` 来访问它；之后，使用 `then` 关键字创建一个异步方法，将我们部署的合约映射到我们之前创建的变量，即\
    \ `helloW`。命令为 `helloworld.deployed().then(function(deployed){helloW=deployed});`\
    \ 请参阅以下包含所有命令的截图以了解详情。\n\n![](img/Figure_3.2.24.jpg)\n\n**图 3.2.24**\n\n现在，使用我们在上一步中映射的变量来访问和测试合约。对\
    \ `helloworld` 合约方法使用 `call()` 方法来调用合约，如 `helloW.PrintHelloWorld.call()`，如以下截图所示：\n\
    \n![](img/Figure_3.2.25.jpg)\n\n**图 3.2.25**\n\n这里我们得到了从该方法返回的字符串，因此我们的方法和合约已在内部私有区块链上测试运行成功。\n\
    \n实现和测试我们的智能合约是不是很有趣？\n\n# 结论\n\n在本章中，我们了解了智能合约，以及在以太坊上开发智能合约所使用的语言、Truffle 和\
    \ Test RPC。本节为区块链开发初学者以及刚接触以太坊和智能合约的人员提供了入门指引。本节奠定了如何开始并推进智能合约开发的基础。希望你享受创建、部署和测试智能合约的过程。\n\
    \n*编码愉快！*\n\n![](img/Figure_3.2.26.jpg)\n\n**图 3.2.26**\n\n# 问题\n\n1.  什么是智能合约？开发智能合约使用哪种语言？\n\
    \n2.  什么是字节码？\n\n3.  如何编译智能合约？\n\n4.  在 Solidity 文件中必须指定的第一件事是什么？\n\n5.  什么是智能合约挖矿？\n\
    \n6.  Test RPC 在智能合约开发中的作用是什么？\n\n7.  智能合约可信吗？\n\n8.  智能合约有标准吗？\n\n9.  智能合约的执行是免费的吗？\n\
    \n10.  如果智能合约的执行成本超过指定的 gas 会发生什么？\n\n# 第四部分\n\n# 区块链在现实世界中的应用\n\n让我们多谈谈区块链的必要性，以及区块链还能提供哪些更多功能。\n\
    \n# 第 1 章\n\n# 区块链的产品与用例\n\n# 结构\n\n在本章中，我们将讨论以下主题\n\n*   区块链的必要性、用例和产品。\n\n*\
    \   区块链技术在教育领域的影响。\n\n# 目标\n\n学习完本单元后，你应该能够\n\n*   理解区块链的实时应用\n\n*   理解区块链如何影响/改变日常生活。\n\
    \n*   理解区块链技术可以在哪些地方发挥作用或正在发挥作用？\n\n# 必要性、用例和产品\n\n贵公司应该问的关键问题是：我们需要区块链吗？有一份简单的问题清单可以帮助你确定这一点。首先，你是否需要多方之间的共享公共数据库？如果我们使用公有链，你是否需要此区块链上的数据可被任何人访问？如果你使用私有链，你是否需要在多个已知方或公司之间共享此数据？如果答案是否定的，那么区块链可能不是最适合你的技术。接下来要问的问题是，如果多方需要共享数据，这些方中是否存在利益冲突，或者它们之间是否不受信任？区块链的主要目的之一是实现多方之间的信任。因此，如果其他方之间存在一定程度的不信任且利益冲突，那么区块链是一个值得考虑的绝佳解决方案。\n\
    \n否则，可能不需要区块链，你可以改用数据库。接下来你应该问的是，其他方能否遵守相同的规则？这里的意思是，你能否让它们使用相同的规则来管理添加到区块链上的交易，并使用相同的规则来验证交易？如果答案是否定的，且你认为无法让所有方遵守相同的规则（这说起来容易做起来难），那么区块链将不是一个好的解决方案。\n\
    \n下一个问题是，你是否需要记录所有操作的不可变日志？区块链最适合处理交易性数据，例如金融交易或保险理赔结算。对于此类交易，将它们记录在一长串相关数据项中是合理的。如果这不是你打算做的，那么区块链就是错误的解决方案。如果你对上述所有问题的回答都是肯定的，那么你可能已经确定区块链对你的组织有用。此时，你需要确定是愿意使用公有链（网络中的每个人都可以参与、访问和验证你的数据），还是想使用私有链（仅限于一个公司联盟）。\n\
    \n目前有许多新兴的区块链实现，但如果看当前主要的实现，当然有最大的比特币区块链。来自 Consensus 和微软的以太坊在非金融应用的开发者中获得了相当大的关注。这也是我们在本课程后续将使用的实现。IBM\
    \ Bluemix 上的区块链也是那些想要创建自己区块链的人的替代选择。\n\n# 区块链的用例\n\n"
