    store


    It is an extension to chrome so that it could be easily added to chrome by clicking
    on `ADD TO CHROME` button. MetaMask is a useful wallet application for development
    and testing purposes:


    ![](images/Figure_2.2.25.jpg)


    **Figure 2.2.25**


    ## 3. Once added to chrome, you’ll see the MetaMask icon in the upper right corner
    of the chrome browser


    This indicates that MetaMask is added to chrome. Click on that icon and click
    on the `Accept` button after reading the terms and conditions.


    ![](images/Figure_2.2.26.jpg)


    **Figure 2.2.26**


    ## 4. After you click on `Accept`, you’ll be redirected to create an account with
    MetaMask


    Provide the password as shown in the following screenshot and click on `CREATE`:


    ![](images/Figure_2.2.27.jpg)


    **Figure 2.2.27**


    ## 5. After creating the password, you’ll be shown a unique account image that
    you’ll see each time you make a transaction


    Click `NEXT`:


    ![](images/Figure_2.2.28.jpg)


    **Figure 2.2.28**


    ## 6. On the next page, you’ll see the terms and conditions


    Read those carefully and click `ACCEPT` if you wish to proceed, as shown in the
    following screenshot:


    ![](images/Figure_2.2.29.jpg)


    **Figure 2.2.29**


    ## 7. After you accept the terms and conditions, you’ll be shown the `Secret Backup
    Phrase`


    As shown in the following screenshot used for restoring and backing up your account.
    Better to save these codes somewhere safe where only you can access. Click on
    `CLICK HERE TO REVEAL SECRET WORDS` to get the phrase:


    ![](images/Figure_2.2.30.jpg)


    **Figure 2.2.30**


    ## 8. On the next page, you need to verify your phrase


    So, select the words in the same order as the phrase was initially on that page:


    ![](images/Figure_2.2.31.jpg)


    **Figure 2.2.31**


    ## 9. Choose a test network of your choice


    As shown in the following screenshot:


    ![](images/Figure_2.2.32.jpg)


    **Figure 2.2.32**


    ## 10. Now, under the `Settings` tab, paste the URL that we copied from the Azure
    portal in the `New RPC URL` text box


    ![](images/Figure_2.2.33.jpg)


    **Figure 2.2.33**


    ## 11. Return to chrome MetaMask extension, and we see our newly created account
    here now


    As shown below. Copy the account address, as shown in the following screenshot:


    ![](images/Figure_2.2.34.jpg)


    **Figure 2.2.34**


    ## 12. Go to the admin page we opened in another tab and paste the copied address
    of MetaMask `Account 1` in the `Address of Recipient` box


    As shown in the following screenshot:


    ![](images/Figure_2.2.35.jpg)


    **Figure 2.2.35**


    ## 13. Add some Ether `Amount` to be sent to the recipient, example, `1000` and
    click on `SUBMIT`


    ![](images/Figure_2.2.36.jpg)


    **Figure 2.2.36**


    ## 14. Once submitted, you’ll see the message `Ether sent!`


    ![](images/Figure_2.2.37.jpg)


    **Figure 2.2.37**


    ## 15. But were they sent? We can quickly check this by again going back to our
    chrome extension and click on Fox icon


    `Congratulations`!! we see the `1000 ETH` transferred to this account now:


    ![](images/Figure_2.2.38.jpg)


    **Figure 2.2.38**


    Hence, we successfully transferred Ethers from one account to another using our
    Azure blockchain consortium. We can now develop smart contracts for our blockchain.
    I’ll cover smart contracts and other related topics in the upcoming sections.


    # Conclusion


    In this chapter, we learned how to set up an Ethereum blockchain on Azure and
    use MetaMask to test our blockchain by transferring some Ethers to another account.
    The next section will focus on smart contracts and how to set up a development
    environment for writing smart contracts.


    ![](images/Figure_2.2.39.jpg)


    **Figure 2.2.39**


    # Questions


    1. What is Azure?

    2. What is the Ethereum proof-of-work consortium?

    3. What is a Resource group on Azure?

    4. What is MetaMask?

    5. What node does MetaMask use?

    6. Explain proof-of-work in a simple way.


