    ## Building blocks - Smart contracts


    Smart contracts are the software programs that run automatically as soon as any
    amount specified in the contract has been transferred to Ether. Therefore, no
    (manual) verification of a payment receipt is required because the transfer starts
    directly as specified in the program consideration.


    The entire blockchain stores each transaction - on all devices connected to the
    network. The decentralized concept of blockchain permanently checks the integrity
    of the entire database.


    ## Byte code


    The smart contracts are usually written in the solidity, a high-level programming
    language specially developed for Ethereum. Those are then translated in bytecode
    and run on the `Ethereum Virtual Machine (EVM).` A virtual machine encapsulates
    a client environment away from the host environment, that is, the other applications
    on a computer.


    This is very similar to a programming language like `Java`, where the code gets
    converted to JVM byte code. The Ethereum runtime environment only understands
    and can execute the bytecode.


    This design gives developers the liberty to make use of other programming languages
    to create smart contracts. One of it is Vyper, which is very much like Python
    and compiles down to EVM bytecode.


    ## EVM


    The EVM is a simple but powerful, turing complete 256 bit VM that allows anyone
    to execute arbitrary EVM byte code. EVM plays a significant role in the consensus
    engine of Ethereum and is part of the Ethereum protocol as well. It allows anyone
