    experience in working on cutting edge technologies that include Microsoft Stack,
    AI, Machine Learning, Blockchain and Cloud computing. Akhil is an MCP (Microsoft
    Certified Professional) in Web Applications and Dot Net Framework.


    Akhil has written few eBooks books on C#, Entity Framework, Web API development
    and OOP concepts which are published at Amazon Kindle and Leanpub. He has also
    written a book on Getting started with Chatbots, which is published with BPB publication.


