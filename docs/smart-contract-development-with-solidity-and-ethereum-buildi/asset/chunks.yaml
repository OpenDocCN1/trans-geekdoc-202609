    # 第一章


    # 分布式应用


    那么，什么是以太坊？


    `Ethereum` 是最大且最成熟的区块链之一，它基于 `Vitalik Buterin` 在 `2013` 年提出的建议。它于 `2015` 年公开可用。由于它是开源的，因此很容易将其用于私有区块链。它不仅是一个平台，还是一个运行在区块链上的编程语言，因此我们可以构建和发布称为
    `分布式应用 (DApps)` 的分布式应用程序。以太坊拥有自己的加密货币，称为 `Ether`，在许多方面它类似于比特币。以太坊的一个优势是它拥有快速的交易时间，区块时间设置为几秒钟，而比特币则需要几分钟。这使其更适合需要快速响应的应用程序，例如结账支付和快速工作流。

