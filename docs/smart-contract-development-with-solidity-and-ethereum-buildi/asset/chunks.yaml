- raw: 'Another big thing about Ethereum is that it has a method for funding transactions
    depending on their computational complexity, bandwidth use, and storage needs.
    This is the difference from the Bitcoin blockchain where transactions compete
    equally with each other. This means that you can pay to get faster transactions.
    The proof of work that other blockchains are using has had some negative impact
    where large computing compasses are solving hard problems just to prove that they
    put work into it. This is a big waste of resources, and Ethereum is moving more
    towards proof of stake where they use direct economic stake instead of proof of
    work. It comes down a few reasons to explore Ethereum that you should also consider
    when you select the blockchain implementation, you would like to use for your
    applications. First of all, the Ethereum development community is growing, and
    it''s very easy to find resources and tools for rapid development. With emerging
    technologies like blockchain, it''s essential to consider how well the community
    is adapting the different implementations, and to be honest, the Ethereum community
    is awe-inspiring, and it''s easy to get help from them. Ethereum has learned quite
    a bit from the Bitcoin development as well, and it''s by many considered to be
    an evolution of this. It targets application development well with an easy-to-use
    contract language. Later in this course, we''ll be spending two modules working
    with this. It''s also rather easy to set up your private blockchains and test
    implementations. Ethereum also has a broad commercial adoption, especially at
    the enterprise level, and it fits well into enterprise solutions and existing
    architectures.


    Ether is the currency that is used with Ethereum. You can use it like any other
    cryptocurrency, and it''s the base for paying for transactions in Ethereum. It''s
    traded under the `eth` symbol, and there are many ways to trade Ether. If you
    consider investing in Ether, you should understand that this is a very volatile
    currency, at least for now. Ether has seen some massive ups and downs, and it''s
    not uncommon that it fluctuates more than *20%* weekly. You should be very careful
    about investing, but if you have money to spare, investing in Ether can be an
    excellent investment over time, or as with any cryptocurrency or new investment
    possibilities, you could end up losing everything you have invested. Like all
    currencies, Ether also has denominations to make it easier in daily use.


    # [Structure](#toc.xhtml#s25a)


    In this chapter, we will discuss the following topics


    *   Denominations


    *   DAO


    *   Payment model-gas


    *   Transactions


    # [Objectives](#toc.xhtml#s26a)


    After studying this unit, you should be able to


    *   Understand about distributed apps.


    *   Start gas and gas prices


    *   Transactions.


    # [Denominations](#toc.xhtml#s27a)


    Currently, there are 12 denominations, and they are generally given names inspired
    by those who have been a significant influence on Ethereum. The currently smallest
    use denomination is `Wei`, and `1 ETH is 1 quintillion, Wei.`


    `Finney` is also quite often used, and `1` `ETH` `is` `1000 Finney`. Szabo has,
    of course, also gotten its denomination, and` 1` `ETH is 1 million` Szabo. When
    denominations get more substantial than `1 ETH,` we use Kether, where the `K`
    stands for `kilo`, meaning that that `1K ETH is 1000 ETH`. The same with Mether
    where the **M** stands for `mega`, Gether meaning `Giga ETH`, and so on.


    ![](images/Figure_2.1.2.jpg)


    **Figure 2.1.2**


    When talking about Ether, you should also be aware that there exists something
    called `Ethereum Classic` that is traded under the symbol `ETC`. The reason it
    exists is because of something called a `DAO Hack`.


    # [DAO](#toc.xhtml#s28a)


    The DAO is a decentralized autonomous organization that is funded on the blockchain.
    They have a crowdfunding contract on the Ethereum blockchain and were able to
    raise a large sum of money, and fortunately, there was a weakness to the contract
    that made it possible to create a sub-DAO and drain funds from it. After a while,
    there was a vote in the community to make a hard fork at the blockchain, essentially
    putting all the funds back as they were at the time of the hack. This is an excellent
    example of the community coming together to solve a problem, but this also leads
    to a fundamental question. Is it okay to do changes as long as the code did exactly
    what it was supposed to do, there is a subgroup in the cryptology community that
    can be called `crypto-anarchists`. They believe that as long as code does exactly
    what it was supposed to, it''s tough luck if you make any mistakes or subject
    yourself to being hackable. The vote to create a hard fork showed that most of
    the community disagreed with this. Still, it will be exciting to see what will
    happen the next time something similar happens to the public Ethereum blockchain
    or other blockchains for that sake.


    # From Wikipedia,


    *A well-known example, intended for venture capital funding, was The DAO, which
    launched with $150 million in crowdfunding in June 2016, and was immediately hacked
    and drained of US$50 million in cryptocurrency. This hack was reversed in the
    following weeks, and the money restored, via a hard fork of the Ethereum blockchain.
    This bailout was made possible by the Ethereum miners and clients switching to
    the new fork.*


    # [Decentralized Applications](#toc.xhtml#s29a)


    In a traditional application architecture, we could have a service setup that
    would provide the application in storage, data logic, and user credentials. A
    client would run an interface of some kind, and these would have a set communication
    channel. With distributed applications on the blockchain, this can be constructed
    a bit differently. Shared data is available on the distributed blockchain and
    exists in many locations, so it doesn''t matter if one of the servers goes down.
    The same applies to the data logic, where the logic is shared on the blockchain.
    So as soon as you upload a contract to the chain, it will spread and execute the
    same regardless of where you run it from. The client in a distributed setup also
    looks a bit different, since it will be responsible for storing its user credentials
    and typically store more of the application data. Building applications this way
    will make your solution very resistant to system failure, and it means that they
    can fully operate without a centralized system. You can still have functionality
    in the client for updates towards a centralized system, but you should ensure
    that your client does not rely on anything centralized. In further sections, while
    deploying code to Ethereum, we will create smart contracts built in a language
    called `solidity`. Smart contracts are pieces of code that live on the blockchain
    and execute commands exactly how they were told to by a shared logic. The contracts
    make up what will be the data logic for our distributed applications. They can
    read other contracts, make decisions, send Ether, and they can execute other contracts
    as well. Contracts will exist and run as long as the network. They will only stop
    to run if they run out of transactional funding or if they were programmed to
    self-destruct.


    # [Payment model – Gas](#toc.xhtml#s30a)'
