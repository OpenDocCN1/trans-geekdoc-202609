    any other object-oriented language. Example `bool` is the keyword to support Boolean
    data types that can hold either true or false as a value. Strings, as usual, are
    used with double quotes but have minimal string manipulation capability that we
    find in other languages like `C#`, `JavaScript`, or `Java`. Solidity has both
    signed, and unsigned integers are having a range of 8 bit to 256 bits. One of
    the essential types that Solidity uses is the address type. It is used to store
    addresses used in Ethereum for an account or a smart contract. Solidity has support
    for access modifiers like `public`, `private`, `internal`, or `external`. Access
    modifiers help to provide an abstraction to the code and more control on who can
    access the code from where. If it needs to be accessed from everywhere, the `Public`
