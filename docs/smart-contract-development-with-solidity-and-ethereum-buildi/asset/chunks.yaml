    # 区块链实现


    既然我们已经将区块链作为一个通用术语进行了探讨，现在让我们开始考虑它的具体实现。首先，区块链可以是公有的，也可以是私有的。在公有区块链中，拥有互联网连接的每个人都可以连接到该链。公有链的资金模式通常是：你需要向已加入该链的实体支付存储、交易和执行成本。这可能相当昂贵。试想一下，比特币从最初仅值几美分，在短短几年后飙升至
    1000 美元以上。你可能会后悔在 2013 年为你的交易支付了 `1%` 的比特币；然而，一旦所使用的不同货币趋于稳定，这将不再是一个大问题。由于公有区块链通常广泛分布，因此黑客也没有特定的攻击点。他们无法通过攻击单个数据中心或公司来瘫痪该链。但这取决于社区对该链的支持程度。一旦社区支持消失，该链也就随之消亡。这引发了许多我们目前尚无标准答案的问题和担忧，但我确信在未来几年里，我们将获得更多研究，并更好地理解这些社区是如何运作的。在商业语境下，公有区块链最显著的优势同时也是一个挑战，在于它是民主的。社区必须决定如何处理分叉等问题，通常你在链中的权益决定了你拥有多少投票权。当审视私有区块链时，许多人认为这些并非真正的区块链，因为它们并非真正分布式和民主化的。


    对于私有区块链，你更接近于传统数据库。有人称私有区块链为共享分布式数据库。既然你将拥有基础设施，也就能控制链的成本和融资。这可能既是优势也是挑战，取决于你的公司目标。你打交道的也是已知实体，并且你控制谁可以访问你的链。对于许多处理敏感数据的公司来说，许多国家的法律要求数据必须存储在特定区域。由于我们对私有区块链拥有更多控制权，在立法和使用模式不断演进的过程中，这可以成为公司过渡到该技术的绝佳方式。然而，你也在某些关键领域有所损失，且攻击点更少，因此你的私有区块链可能比公有且高度分布式的实现更容易被攻破。


    # 区块链——幕后原理


    `那么这一切究竟是如何运作的呢？` 一切始于某人发起一笔单独的交易或一组交易。交易通常以合约的形式发送数据。根据你使用的区块链实现，它也可能涉及加密货币从一个账户发送到另一个账户。交易被发送到一个庞大的计算机点对点网络。这些计算机通常分布在世界各地。每台计算机称为一个节点，并且它们都拥有现有数据的副本。然后，基于预先共享的合约和脚本执行并验证交易。这确保了所有节点使用同一套规则进行执行。当交易执行完毕，结果会被添加到区块链中。由于这是在每个节点上完成的，你必须攻破链中的每一个节点才能篡改交易。


    在进行区块链交易时，某些方面是必不可少的，以使其具备前文提到的特性。首先，所有交易都是原子性的。这意味着完整的操作要么全部运行，要么完全不运行。假设你有一笔货币交易。你需要确保给一个账户记账的功能和给另一个账户记借的功能都成功执行。如果其中一个失败，整笔交易就应失败。否则，你可能最终会销毁或凭空创造货币。然而遗憾的是，即使有了区块链，也没有什么能阻止你编写有害代码，因此你仍需确保按正确顺序执行交易。其次，交易彼此独立运行。因此，没有两个操作可以交互或相互干扰。它必须可被审查。每一个发送到区块链的方法调用都附带调用者的实际地址。


    想想看。这为在极大范围内保护和审计解决方案提供了独特的可能性。这是区块链独有的。至少据我所知，别处无法做到这一点。区块链对象是永生的。这意味着对象的所有数据都是永久的。对象的代码永远无法更改，你也无法从外部删除对象。将对象从区块链中移除的唯一方法是它被编程为自我移除。所以，仔细想一想。在为区块链编写代码时，你真的、真的需要确定这就是你想做的。因为你永远无法更改或删除它。


    # 交易与区块


    区块链的核心是一份交易记录，很像传统的会计账本。这些交易可以是人与人、公司与公司之间的资金流动，也可以是任何具有交易性质的信息片段，比如财产契据的转让，或不同公司之间库存流转的追踪。存储在区块链中的数据旨在以一种方式保存，使得一旦数据进入区块链，若不被其他用户察觉，几乎不可能对其进行更改。正如我们之前讨论的，传统银行交易由中央银行或权威机构验证。区块链应用可以用参与区块链的多用户共识验证来取代这些更中心化的系统。


    区块链必须做两件主要的事。它需要收集数据或交易并将它们放入区块。然后这些区块需要使用密码学安全地链接在一起。当交易被放入区块时，我们使用加密哈希或数字指纹将交易链接在一起。这意味着如果交易的任何部分发生变化，整个区块将无法通过验证，从而向其他用户发出警示。在区块的顶部，我们有一个代表该区块中所有交易的哈希值。我们称之为区块地址。正是这些区块地址被用来将区块链接在一起，因为每个区块都知道其前一个区块的地址，这就是我们形成链的方式。


    '
