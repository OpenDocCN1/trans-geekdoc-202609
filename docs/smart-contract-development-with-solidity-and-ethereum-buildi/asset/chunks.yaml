- raw: 'In this chapter, we learned how to set up the development environment to start
    development. We came across various packages like NPM and Chocolatey that helped
    us to install more tools. We installed the VS Code, MetaMask, which will help
    us to provide a coding environment. In the next chapter, we’ll focus on smart
    contracts and development. *Cheers!*


    # [Questions](#toc.xhtml#s53a)


    1.  What is Chocolatey?


    2.  What are the build tools used to compile smart contracts?


    3.  How do test RPC and truffle work?


    4.  What is MetaMask?


    5.  What node does MetaMask use?


    6.  What are the limitations of MetaMask?


    # [CHAPTER 2](#toc.xhtml#p03c02)


    # [Programming Smart Contracts](#toc.xhtml#p03c02)


    Making a smart contract is, in many ways, quite like what you might be used to
    already. You start by writing the code in a supported language. That will be different
    depending on the blockchain implementation you are working towards. In this chapter,
    we will be using a language called `Solidity`, which is supported by Ethereum,
    and it''s currently gaining support in the Bitcoin blockchain as well. Another
    current option would be writing Serpent code, which also has some community support
    for Ethereum. After writing the code, it must be compiled to byte code. There
    are several compilers available. There are even online compilers that will get
    you started quickly. In this section, we will use a framework for working with
    smart contracts that are called `Truffle`. Truffle has a built-in compiler that
    is very easy to get started with. When a compile is done successfully, we upload
    our contract and wait for it to be mined. After a contract is successfully mined,
    we can start interacting with it. In most cases, you would create a user interface
    towards the contract, but you can interact directly with it through HTTP POST
    operations.


    In the last chapter on smart contracts development, we learned about setting up
    the development environment before we start coding or developing our first smart
    contract. We installed the necessary packages and tools that would be needed for
    development. In the section, we’ll explore Solidity and develop our first smart
    contract of `Hello World.`


    ![](images/Figure_3.2.1.jpg)


    **Image credit:** [https://pixabay.com](https://pixabay.com)


    **Figure 3.2.1**


    # [Structure](#toc.xhtml#s54a)


    In this chapter we will discuss the following topics


    *   Smart contracts


    *   Byte code


    *   EVM


    *   Smart contracts and solidity


    *   Truffle and test RPC


    *   Smart contract development


    *   Smart contract deployment


    *   Test smart contract.


    # [Objectives](#toc.xhtml#s55a)


    After studying this unit, you should be able to


    *   Develop your basic smart contract.


    *   Learn the basics of solidity.


    *   Test smart contract.


    *   Deploy smart contracts.


    # [Building blocks - Smart contracts](#toc.xhtml#s56a)


    Smart contracts are the software programs that run automatically as soon as any
    amount specified in the contract has been transferred to Ether. Therefore, no
    (manual) verification of a payment receipt is required because the transfer starts
    directly as specified in the program consideration.


    The entire blockchain stores each transaction - on all devices connected to the
    network. The decentralized concept of blockchain permanently checks the integrity
    of the entire database.


    # [Byte code](#toc.xhtml#s57a)


    The smart contracts are usually written in the solidity, a high-level programming
    language specially developed for Ethereum. Those are then translated in bytecode
    and run on the `Ethereum Virtual Machine (EVM).` A virtual machine encapsulates
    a client environment away from the host environment, that is, the other applications
    on a computer.


    This is very similar to a programming language like *Java*, where the code gets
    converted to JVM byte code. The Ethereum runtime environment only understands
    and can execute the bytecode.


    This design gives developers the liberty to make use of other programming languages
    to create smart contracts. One of it is Vyper, which is very much like Python
    and compiles down to EVM bytecode.


    # [EVM](#toc.xhtml#s58a)


    The EVM is a simple but powerful, turing complete 256 bit VM that allows anyone
    to execute arbitrary EVM byte code. EVM plays a significant role in the consensus
    engine of Ethereum and is part of the Ethereum protocol as well. It allows anyone
    to execute arbitrary code in a trust-less environment in which the outcome of
    execution can be guaranteed and is entirely deterministic.


