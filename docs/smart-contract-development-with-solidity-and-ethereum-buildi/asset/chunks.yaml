    为了让区块被添加到链中，创建区块的人在计算区块地址时必须解决一个复杂的数学难题。这被称为通过工作量证明来挖掘区块。该难题被设计为计算成本高昂，且必须在链中的每个区块之前发生。假设这个问题需要
    10 分钟来计算。现在想象我们的链中有 1000 个区块。因此，计算所有区块地址总共花费的时间是 166 小时。现在想象有人想要覆盖第一个区块中的数据。他们必须重新计算该区块的挖掘难题，这需要
    10 分钟。但由于所有其他区块都通过加密方式链接在一起，如果你更改一个区块，则需要重新计算下一个区块的哈希值和地址，以此类推。因此，更改第 1 个区块中的数据意味着你需要花费
    166 小时（或近 7 天）来重新计算整条链。试想一下，如果链更长且难题耗时超过 10 分钟，我们要花费多长时间。链越长，它就越安全。当这些区块被添加到链中时，一份副本会发送给参与网络的每个人。这就是我们建立信任的方式，因为有这么多人持有一份副本。假设有
    100 个人拥有整条链的副本，而有人试图更改其中一个区块。他们可能会将其添加到自己的链中，但会有另外 99 个人不同意他们的更改。如果你现在还不能完全理解这一切，也不必太担心。我们将在后续章节中更详细地探讨这些内容。


    # 保护您的数据


    存储在区块链中的数据通常可供所有有权访问该链的人查看。这带来了一些挑战，但也会促使您优先考虑安全性。在某些应用中，所有人都能访问所有内容并没有问题，但在大多数情况下，您希望确保由您控制谁可以拥有您的数据。有两种方法可以处理这个问题。第一种是
    `obfuscation`（混淆）。这意味着使数据仅对知道其含义的人有意义。一个例子是比特币。有了任何账户的地址，它就是一长串字母和数字。链中没有人知道该地址在物理上连接到谁，他们也不需要知道，但每个人都知道在不同账户地址之间发生的每一笔交易。由您决定是否想要匿名。如果您不共享与您账户地址的关联，就没有任何人能知道您是该账户的所有者。


    混淆的另一个例子是让数据包含 ID 和状态代码。除非您知道不同的 ID 关联到什么，否则这些数据对您实际上毫无用处。仅依赖混淆的问题在于，您始终面临着有人因控制密钥的系统发生泄露而建立关联并关联数据的风险。为了解决这个问题，您可以利用加密。当您加密消息或交易载荷时，您会对消息应用一种双向算法，只有知道密码或口令才能解码。这意味着数据可以对所有人公开，但只有拥有解密密钥的人才能理解其含义。有许多不同的加密算法，与哈希一样，它们也在不断演进。本书的下一节将重点介绍这些算法。


    # 结论


    在本章中，我们学习了区块链的基础知识及其定义。本节重点围绕哈希及其对于理解区块链工作原理的重要性展开。之后，我们开始了解区块是如何构建的，以及它是如何连接成链的。安全性是一个特别重要的考量方面，因此解释了混淆和加密的基础知识，以让您对这些概念有个大致了解。本节还解释了公有链和私有链实现之间的区别。


    现在基础已经清晰，我们将把标准稍微提高一点，深入探讨安全性。在下一章中，我们将学习区块链中使用的哈希技术，并了解数字签名。


