- raw: 'Universities and other educational institutions that offer a project-based
    education or training can leverage the blockchain technology to generate a tamper-proof
    certificate for their students. An encrypted certification with two-factor authentications
    could be kept in the blockchain database generating a unique decentralized number
    that could be used by the authorities for authenticity. This will prevent anyone
    from producing a fake or non-authentic certificate. A few international education
    institutions have already adopted this methodology to ensure certificate authenticity
    and security.


    # [A global database for qualifications](#toc.xhtml#s73a)


    Not limited to just storing a certificate securely but using blockchain technology,
    a global (international) database could be created where an individual does not
    have to store their paper degrees and qualification certificates, which are very
    prone to lose or tampering. A blockchain-based platform could be established to
    store all the qualification information which could be used by authorities like
    Visa officers to check the authenticity of an individual if he is traveling cross-border
    or migrating, a company’s management to check the authenticity of their employee
    or if they are hiring a new employee, and education institutions to check the
    background and authenticity of produced qualifications by an individual.


    # [Learning platforms](#toc.xhtml#s74a)


    Individuals in corporate offices or students in educational institutions can have
    a platform where they can seek online training or sessions with their peers/bosses
    or teachers, respectively. An independent learning platform could be established
    between a trainer and a trainee and the terms and conditions for training like
    projects, tasks, fees, duration of training could be readily agreed upon between
    both the parties and could be stored as smart contracts for a transparent and
    secure execution thereby eliminating the concept middleman. He can make money
    in this way.


    # [Corporate learning](#toc.xhtml#s75a)


    There is a need for a more secure and transparent system for the employees and
    the companies in which they work for corporate training. Tracking the achievement
    of an employee or on the overall company’s capabilities of providing extensive
    training is a challenge and hard to measure. The legacy learning management systems
    and technologies are outdated now. Blockchain technology in this space can play
    a crucial role in keeping track of all the training done and employees'' achievements
    more securely and transparently where an employee can also leverage this record
    to showcase to his new employer.


    # [Secure payments](#toc.xhtml#s76a)


    Students can use this platform for paying their tuition/course fees to educational
    institutions via cryptocurrency. The *Cumbria Institute for Leadership and Sustainability*
    had already announced an option in *2014* where students can pay their fees in
    Bitcoins. Accepting payments via Bitcoins does not have to depend upon a significant
    infrastructure but is the more secure mode of payment. Moreover, international
    students, or students located globally, can find this an effortless way to pay
    their fees and do not have to depend upon third parties who can make money via
    charging fees or conversion rates to students or educational institutions.


    # [Conclusion](#toc.xhtml#s77a)


    This was a detailed theoretical chapter focussing on blockchain’s needs, usages,
    and impact. We saw that the impact of blockchain is broad, and the usages vary
    from education to security to medical usages as well. It is all about understanding
    it, adopting it, and implementing it.


    # [Questions](#toc.xhtml#s78a)


    1.  Why is blockchain a trusted approach?


    2.  What are a few popular platforms developing blockchain applications?


    3.  How can blockchain impact education technology?'
