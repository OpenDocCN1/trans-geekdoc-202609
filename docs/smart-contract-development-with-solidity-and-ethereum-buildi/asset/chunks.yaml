    \ system could be created within seconds with just a few clicks. You can access\
    \ the machine remotely from anywhere with your secure credentials and do whatever\
    \ you want, for example, hosting your website, developing applications, creating\
    \ production or test environment for your software, and many more. Let’s see step\
    \ by step how we can achieve that.\n\n## Structure\n\nIn this chapter we will\
    \ discuss the following topics\n\n*   Virtual machine setup on Azure\n*   Getting\
    \ the environment ready for smart contract development\n\n## Objectives\n\nAfter\
    \ studying this unit, you should be able to\n\n*   Setup a development environment\
    \ for programming smart contracts.\n\n## Azure account setup\n\nFollow the steps\
    \ in the last section to set-up an Azure account if it is not already done.\n\n\
    ## Virtual machine setup on Azure\n\n1.  Once on the dashboard, click on the `Virtual\
    \ machines` link on the dashboard, and a right panel would open where you see\
    \ all your VM’s. Since we are creating new and we do not have existing ones, so\
    \ it would be blank. Click on `Create virtual machine`:\n\n    ![](images/Figure_3.1.2.jpg)\n\
    \n    **Figure 3.1.2**\n\n2.  Once you click on `Create virtual machine`, you’ll\
    \ get to see all the operating systems and solution templates that Azure provides\
    \ to create a machine. You can choose to have Windows or Linux operating system\
    \ based on requirements, but be careful about costs involved:\n\n    ![](images/Figure_3.1.3.jpg)\n\
    \n    **Figure 3.1.3**\n\n3.  Since this section is for learning how to create\
    \ a virtual machine, I’ll choose the `Windows Client` machine with minimal machine\
    \ configurations, and one can choose based on requirements and need. So, choose\
    \ `Windows Client` as shown in the following screenshot:\n\n    ![](images/Figure_3.1.4.jpg)\n\
    \n    **Figure 3.1.4**\n\n4.  You’ll get the window of the license agreement and\
    \ legal terms. Read that carefully and press the `Create` button:\n\n    ![](images/Figure_3.1.5.jpg)\n\
    \n    **Figure 3.1.5**\n\n5.  After clicking on `Create`, you’ll be asked to fill\
    \ some basic requirements, as shown in the following screenshot. Give the name\
    \ as per your choice; for example., I gave it `AKHILPC`, leave `VM disk type as\
    \ SSD,` or choose as per your need. Provide a username and password you would\
    \ need when you connect remotely with the machine. Keep the username and password\
    \ safe and secure. Choose the subscription, if you have a paid one, choose that\
    \ else choose the trial subscription that you got. You must provide a `Resource\
    \ group`. You can create a new or use an existing one. The resource group gives\
    \ you a logical separation for all your Azure resources. Since I have an existing\
    \ resource group created, I am using that. Choose `Location`, click on confirmation\
    \ checkbox and click `OK`:\n\n    ![](images/Figure_3.1.6.jpg)\n\n    **Figure\
    \ 3.1.6**\n\n6.  Once you click `OK`, you get to see the second section to choose\
    \ the size of the machine where you see the list of RAMs, Hard disk size, SKU,\
    \ and zones. Each configuration has a cost associated with it, so choose as per\
    \ your need and budget. For training/tutorial purposes, I am choosing the first\
    \ one that has the minimum cost as shown in the following screenshot:\n\n    ![](images/Figure_3.1.7.jpg)\n\
    \n    **Figure 3.1.7**\n\n7.  In the third step, you are needed to choose specific\
    \ settings related to availability, storage, and network. Choose/Provide the settings\
    \ as per your discretion:\n\n    ![](images/Figure_3.1.8.jpg)\n\n    **Figure\
    \ 3.1.8**\n\n8.  Once you click `OK`, you’ll be shown a summary page for all the\
    \ configuration you choose, cost per hour, and OS. Confirm if everything looks\
    \ good by clicking on the confirmation checkbox as shown in the following screenshot,\
    \ and click on the `Create` button.\n\n    ![](images/Figure_3.1.9.jpg)\n\n  \
    \  **Figure 3.1.9**\n\n9.  Once you click `Create`, it may take a while to create\
    \ your VM. It will say `Submitting deployment for`…. Wait till the deployment\
    \ is complete. For me, it took `5~9` minutes:\n\n    ![](images/Figure_3.1.10.jpg)\n\
    \n    **Figure 3.1.10**\n\n10.  Once the deployment is done, you’ll see the section\
    \ for your deployed VM, where you can choose to `Start, Stop, Restart, Move`,\
    \ or `Delete` your created VM. Clicking on `Connect` will show you two options\
    \ in the right panel, that is, `RDP` and SSH. We’ll choose to connect via `RDP`,\
    \ so download the RDP file shown at the right panel. Click on the `Download RDP\
    \ File` button to get the file. Alternatively, you can directly open RDP connect\
    \ via an `mstsc` command on your local machine. You get the IP address, as shown\
    \ in the following screenshot, in the RDP section:\n\n     ![](images/Figure_3.1.11.jpg)\n\
    \n     **Figure 3.1.11**\n\n11.  The downloaded RDP file will be located at your\
    \ local download location. Click on that to configure the RDP connection.\n\n\
    \     ![](images/Figure_3.1.12.jpg)\n\n     **Figure 3.1.12**\n\n12.  The IP would\
    \ automatically be filled, just fill the username and password to connect.\n\n\
    \     ![](images/Figure_3.1.13.jpg)\n\n     **Figure 3.1.13**\n\n13.  Once the\
    \ connection is successful, you’ll see the Welcome message while window loads\
    \ and configures for the first-time use. Please wait for a while.\n\n     ![](images/Figure_3.1.14.jpg)\n\
    \n     **Figure 3.1.14**\n\n14.  Once Windows loaded, you’ll see the desktop as\
    \ shown below. Now you can choose to do whatever you want with this machine:\n\
    \n     ![](images/Figure_3.1.15.jpg)\n\n     **Figure 3.1.15**\n\n     `Note that\
    \ for the time you use the machine, you’ll be charged hourly.`\n\n15.  In case\
    \ you do not want to use the machine for some time or stop the machine daily at\
    \ a defined time, you can do that manually by clicking on the `Virtual machines`\
    \ option at your Azure dashboard. You’ll see your VM. Select your VM and click\
    \ on `Stop`. You can start whenever you want. Thus, you can save a lot of costs.\n\
    \n     ![](images/Figure_3.1.16.jpg)\n\n     **Figure 3.1.16**\n"
  trans: "\n# 智能合约开发\n\n在上一节中，我们学习了如何使用联盟领导者在 Microsoft Azure 上设置以太坊区块链。现在是进行一些开发工作的时候了。在继续介绍智能合约及其开发之前，作为先决条件，必须设置开发环境。本节将专门介绍如何为智能合约开发设置开发环境。在下一节中，我们将了解什么是智能合约以及如何开发它们。\n\
    \n![](img/Figure_3.0.1.jpg)\n\n**图片来源：** [`pixabay.com`](https://pixabay.com)\n\
    \n**图 3.0.1**\n\n# 工具与开发环境\n\n在进行实际开发之前，我们将使用一系列工具来设置开发环境。我将在 Microsoft Azure\
    \ 上使用全新的 Windows 安装。在开始之前，您可以按照上一节中的步骤在 Azure 上设置虚拟机。我们将在新机器上安装 Chrome 浏览器，随后安装\
    \ `MetaMask`（Chrome 插件），它将帮助我们进行身份验证。Microsoft 提供免费的 `Visual Studio Code`，我们可以将其作为智能合约开发的\
    \ IDE。我们将安装 `NuGet 包管理器 (NPM)` 和 `Chocolatey`（也是一个包管理器），以获取开发所需的其他工具和包。我们将结合 `Git`、`NPM`\
    \ 和 Windows 构建工具来构建/编译代码。我们将使用一个名为 `Test RPC` 的内存测试服务器来测试应用程序，最后使用 `Truffle`。当我们开始开发时，将更深入地探讨\
    \ `Truffle`。\n\n# 设置智能合约开发环境\n\n![](img/Figure_3.1.1.jpg)\n\n**图 3.1.1**\n\n##\
    \ Azure\n\nAzure 是 Microsoft 的云平台，在云计算领域提供大量资源。其中一项资源是 `虚拟机 (VM)`，即只需点击几下，几秒钟内即可创建一个功能齐全、配置和操作系统均由您选择的机器。您可以使用安全凭据从任何地方远程访问该机器，并进行任何您想要的操作，例如托管网站、开发应用程序、为软件创建生产或测试环境等。让我们逐步了解如何实现这一点。\n\
    \n## 结构\n\n在本章中，我们将讨论以下主题\n\n*   Azure 上的虚拟机设置\n*   为智能合约开发准备环境\n\n## 目标\n\n学习完本单元后，您应该能够\n\
    \n*   为编程智能合约设置开发环境。\n\n## Azure 账户设置\n\n如果尚未完成，请按照上一节中的步骤设置 Azure 账户。\n\n## Azure\
    \ 上的虚拟机设置\n\n1.  进入仪表板后，单击仪表板上的 `Virtual machines`（虚拟机）链接，右侧面板将打开，显示您所有的虚拟机。由于我们要创建新的，且没有现有的，因此面板将为空。单击\
    \ `Create virtual machine`（创建虚拟机）：\n\n    ![](img/Figure_3.1.2.jpg)\n\n    **图\
    \ 3.1.2**\n\n2.  单击 `Create virtual machine` 后，您将看到 Azure 提供的用于创建机器的所有操作系统和解决方案模板。您可以根据需求选择\
    \ Windows 或 Linux 操作系统，但请注意涉及的成本：\n\n    ![](img/Figure_3.1.3.jpg)\n\n    **图\
    \ 3.1.3**\n\n3.  由于本节旨在学习如何创建虚拟机，我将选择配置最低的 `Windows Client`（Windows 客户端）机器，您可以根据需求和需要进行选择。因此，选择\
    \ `Windows Client`，如下截图所示：\n\n    ![](img/Figure_3.1.4.jpg)\n\n    **图 3.1.4**\n\
    \n4.  您将看到许可协议和法律条款窗口。请仔细阅读并按下 `Create`（创建）按钮：\n\n    ![](img/Figure_3.1.5.jpg)\n\
    \n    **图 3.1.5**\n\n5.  单击 `Create` 后，系统将要求您填写一些基本要求，如下截图所示。按您的选择命名；例如，我将其命名为\
    \ `AKHILPC`，将 `VM disk type`（虚拟机磁盘类型）保留为 `SSD`，或根据需要选择。提供您远程连接机器时所需的用户名和密码。请妥善保管用户名和密码。选择订阅，如果您有付费订阅，请选择该订阅，否则选择您获得的试用订阅。您必须提供\
    \ `Resource group`（资源组）。您可以创建一个新的或使用现有的。资源组为您的所有 Azure 资源提供逻辑分离。由于我已有一个现有的资源组，因此我将使用它。选择\
    \ `Location`（位置），勾选确认复选框，然后单击 `OK`：\n\n    ![](img/Figure_3.1.6.jpg)\n\n    **图\
    \ 3.1.6**\n\n6.  单击 `OK` 后，您将看到第二部分，用于选择机器大小，其中列出了内存、硬盘大小、SKU 和区域。每种配置都有相关成本，因此请根据您的需求和预算进行选择。出于培训/教程目的，我选择了成本最低的第一个，如下截图所示：\n\
    \n    ![](img/Figure_3.1.7.jpg)\n\n    **图 3.1.7**\n\n7.  在第三步中，您需要选择与可用性、存储和网络相关的特定设置。根据您的判断选择/提供设置：\n\
    \n    ![](img/Figure_3.1.8.jpg)\n\n    **图 3.1.8**\n\n8.  单击 `OK` 后，将显示一个摘要页面，列出您选择的所有配置、每小时成本和操作系统。通过勾选确认复选框确认一切正常（如下截图所示），然后单击\
    \ `Create`（创建）按钮。\n\n    ![](img/Figure_3.1.9.jpg)\n\n    **图 3.1.9**\n\n9.  单击\
    \ `Create` 后，创建虚拟机可能需要一段时间。它将显示 `Submitting deployment for`…… 等待部署完成。对我来说，花费了\
    \ `5~9` 分钟：\n\n    ![](img/Figure_3.1.10.jpg)\n\n    **图 3.1.10**\n\n10. 部署完成后，您将看到已部署虚拟机的部分，您可以选择\
    \ `Start`（启动）、`Stop`（停止）、`Restart`（重启）、`Move`（移动）或 `Delete`（删除）您创建的虚拟机。单击 `Connect`（连接）将在右侧面板显示两个选项，即\
    \ `RDP` 和 SSH。我们将选择通过 `RDP` 连接，因此下载右侧面板显示的 RDP 文件。单击 `Download RDP File`（下载 RDP\
    \ 文件）按钮获取文件。或者，您可以直接在本地计算机上通过 `mstsc` 命令打开 RDP 连接。您可以在 RDP 部分看到 IP 地址，如下截图所示：\n\
    \n     ![](img/Figure_3.1.11.jpg)\n\n     **图 3.1.11**\n\n11. 下载的 RDP 文件将位于您本地的下载位置。单击它以配置\
    \ RDP 连接。\n\n     ![](img/Figure_3.1.12.jpg)\n\n     **图 3.1.12**\n\n12. IP 地址会自动填入，只需填写用户名和密码即可连接。\n\
    \n     ![](img/Figure_3.1.13.jpg)\n\n     **图 3.1.13**\n\n13. 连接成功后，您将看到欢迎消息，同时\
    \ Windows 正在加载并进行首次使用配置。请稍等片刻。\n\n     ![](img/Figure_3.1.14.jpg)\n\n     **图\
    \ 3.1.14**\n\n14. Windows 加载完成后，您将看到如下所示的桌面。现在您可以随心所欲地使用这台机器：\n\n     ![](img/Figure_3.1.15.jpg)\n\
    \n     **图 3.1.15**\n\n     `请注意，您使用机器的时间将按小时收费。`\n\n15. 如果您一段时间不想使用该机器，或希望每天在指定时间停止机器，可以通过单击\
    \ Azure 仪表板上的 `Virtual machines` 选项手动操作。您将看到您的虚拟机。选择您的虚拟机并单击 `Stop`（停止）。您可以随时启动。这样可以节省大量成本。\n\
    \n     ![](img/Figure_3.1.16.jpg)\n\n     **图 3.1.16**\n"
