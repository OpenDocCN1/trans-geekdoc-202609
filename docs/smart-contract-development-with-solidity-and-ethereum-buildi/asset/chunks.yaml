- raw: 'In every distributed system design, it is crucial to have a well-functioning
    model for protecting the system from unwanted attacks. A general principle should
    be to make it harder to attack than to defend it. It''s hard to do in the physical
    world. Just consider protecting a building. It''s very expensive to put up protection
    and `24/7` security; however, it''s quite inexpensive to build a bomb that will
    destroy the building. In the digital world, this can be done differently. Just
    consider using hashing algorithms. They are inexpensive to use, but they''re costly
    to crack. When protecting the blockchain against unwanted behavior, we want to
    use a payment model that will be fair priced if you use the system as intended,
    but very expensive if you try to do malicious things to it. This is where the
    concept of gas comes in.


    Gas is the internal pricing for running transactions or contracts in Ethereum.
    The reason for this is to have a unit that is separated from the current value
    of Ether. Just think about it like you would for a car. The amount of gas it uses
    is related to how fast you want it to go, and the price of gas goes up and down,
    and it''s not statically linked to the value of the currency. The amount of gas
    that a contract or a transaction uses depends on the operations needed to run
    it. Their price is based on computation, memory, bandwidth, and storage needs,
    to mention a few. These factors are added together and will make up the gas needed
    to run the contract or transaction. If you do not have the Ether to cover all
    the gas requirements to complete running your code, the processing aborts and
    all intermediate state changes roll back to the pre-transaction snapshot. The
    gas used up to the point where execution stopped were used after all. So, the
    Ether balance of your account will be reduced with the price for the gas already
    spent.


    # [Transactions](#toc.xhtml#s31a)


    The term transaction, when used in Ethereum, needs to refer to the data package
    that stores a message to be sent from an externally owned account to another account
    on the blockchain. A transaction contains the receipt of the message, a signature
    identifying the sender, a value field, which is the amount of `WEI` to transfer
    from the sender to the recipient, and a gas price value representing the fee the
    sender is willing to pay for gas. The higher the price you are willing to pay,
    the higher the miners will rank your work. There''s also a start gas value representing
    the maximum number of computational steps the transaction executed is allowed
    to take. Think of this as a measurement of the gas tank of a car when filled.
    This would be the maximum cost, and it will make sure that you are not able to
    start infinite loops in your code. It is also vital to the miner to get an estimate
    of how much they can earn by doing the transaction. Since the only way for them
    to know for sure is after the execution. Since an `out-of-gas` exception is practically
    a waste of money for a sender, it is always better to overestimate the start gas
    a little bit than to underestimate. Still, you should be careful of setting a
    too-high value as well because miners might penalize transactions where there
    is a big difference between the start gas and the consumed gas. You also have
    an optional data field that can contain the message sent to a contract. We will
    look more into this when we start to develop our smart contracts.


    # [Low start gas and gas price](#toc.xhtml#s32a)


    Okay, now let''s have a look at the effect of setting the different levels for
    start gas and gas price. If you set the start gas too low, the transaction will
    probably not be sent to miners, and you will get an intrinsic gas too low. The
    same is true if you set a too-low gas price. Miners will ignore the transaction
    and instead select transactions they can make money on. Setting gas price too
    low is a bad idea since you will be getting an out-of-gas error, and the transaction
    is rolled back, but as mentioned, you''ll still be charged for what you have used
    so far. If you set a low gas price, the transaction might be mined slower and
    put in a later block, depending on the current load of the miner.


    # [High start gas and gas price](#toc.xhtml#s33a)


    If you set a start gas too high, it might result in a delay of getting mined since
    the miners will think that it will need a lot of resources and must wait for availability.
    Setting a high gas price will, in most cases, result in your transaction being
    prioritized and put in a block sooner than other transactions. Each block has
    a gas limit set to it. If you exceed that with your start gas, the transaction
    will not be broadcasted to the miners, and you will get an exceeds block gas limit
    error. If you set a too-high gas price and the sender does not have enough funds
    available, the transaction is not broadcasted to the miners either.


    # [Medium start gas and gas price](#toc.xhtml#s34a)


    Medium start gas and gas price is generally the ideal level and where you should
    try to aim.


    # [Conclusion](#toc.xhtml#s35a)


    In this chapter, we started by discussing what and why of Ethereum. We looked
    at the execution and funding model of Ethereum before we went into distributed
    applications.


    Just remember the core ideas, and you will be fine for developing with Ethereum.
    Proof of work is the mechanism that works with Bitcoin, the current version of
    Ethereum, and many other blockchains. Some mining operations also use environmentally
    unfriendly energy sources. Just to put some aspect to this, the Bitcoin proof
    of work mining is set to consume the same amount of electricity per year that
    is consumed by a while midsize `European` country. In proof of work, a person
    might take `$10,000`, use it to buy a mining computer with specialized hardware,
    and start participating in the network. The mining will then be producing blocks
    and getting rewarded for the work in the form of cryptocurrency that can be spent.
    Proof of state attempts to resolve these issues by removing the concept of mining
    entirely and replacing it with a different mechanism. In proof of stake, one could
    take the same amount of money and convert it into cryptocurrency straight away.
    As with proof of work, the more you put in, the more you can expect to get out.


    In the next chapter, we will learn about Ethereum with Azure, setting up an Ethereum
    account with Azure, and setting up a MetaMask account.


    # [Questions](#toc.xhtml#s36a)


    1.  What is Ethereum, and what are its denominations?


    2.  What is the difference between Wei and Ether?


    3.  What is the value token for Ethereum?


    4.  What is the average block size in Ethereum?


    5.  What is a dApp, and why is it different than a regular app?


    6.  What do you understand by gas and payment model?


    7.  What happens to the garprice if startgat is set to high?


    8.  Does gas price determine when a transaction is processed?


    9.  How is the transaction fee calculated?


    10.  Where are transactions recorded?


    # [CHAPTER 2](#toc.xhtml#p02c02)


    # [Setting up Ethereum Blockchain on Azure](#toc.xhtml#p02c02)


    This chapter will focus on setting up a custom Ethereum blockchain on Azure. The
    chapter will be less of theory and will focus more on the practical implementation
    of step by step setting up the Ethereum blockchain on Azure and transferring some
    Ethers between accounts using MetaMask. The chapter is for the readers who are
    more into development and have the background of blockchain, Ethereum, and Ether.
    We have already covered theory in the previous sections of understanding Ethereum
    and blockchain.


    # [Ethereum on Microsoft Azure](#toc.xhtml#s37a)'
