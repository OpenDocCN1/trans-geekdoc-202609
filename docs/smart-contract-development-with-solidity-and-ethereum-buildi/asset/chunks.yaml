- raw: 'Now that you know the most critical technical aspects of blockchain, let''s
    discuss some of the current usages for it and why it can be such a real `game-changer.`
    As mentioned, many times in this book, the current most broad use of the blockchain
    is with digital currencies like Bitcoin. Because anonymous transactions can be
    trusted just as much as they can with any bank, this opens up a wide range of
    new ways to deal with global transactions. Let me give you a real-life example.
    A good friend of mine is a refugee from one of the most horrific wars in modern
    history. He managed to escape, but his wife is still left in the country. Making
    sure that she has the financial means to survive is crucial.


    Before blockchain, the only option to provide her with money from the other side
    of the world was by using money-transferring agency. These are very costly, and
    they take a rather large cut of my friend''s limited funds when transferring.
    Furthermore, transactions can take many days to complete. And lastly, they require
    that she shows up personally to collect the money, which is not very safe. With
    blockchain, however, there is no need for a large transferring agency, and there
    are apps where you can transfer money almost instantly with transfer costs that
    are only a small fraction. Believe it or not, but even in war-torn countries,
    you will be able to find the Internet and transfer the money directly to a mobile
    device. We only see the very beginning of how these kinds of solutions will change
    the world in ways; we cannot even grasp yet. A small revolution that has been
    going on for sometimes is called the `Internet of things (IoT)`. This is where
    small smart devices use the Internet without human intervention. Right now, there
    are many more devices using the Internet than humans. With using blockchain, these
    devices can suddenly do trustworthy transactions securely.


    An example of this is that your washing machine could order detergent for you
    when it notices that it''s getting empty. The product lifecycle is another where
    you store all the information on workflow or product in the blockchain. It could,
    for example, follow the lifespan of a car from the factory through the seller
    to the customer into the workshop and, lastly, to the recycling plant.


    Certifications are also a significant area of use. Certification bodies could
    issue certifications to products or organizations in a tamper-free and fully transparent
    way. The secure sharing of data is another example. Given the nature of blockchain,
    you could insert encrypted information into it and make sure that only those you
    allow can access your information. This could be used, for example, with medical
    information or medical devices in a secure manner. Suddenly, all hospitals in
    the world could have instant access to your medical folder when needed, and you
    would be able to track everyone that has tried to access your information. There
    are now devices that will measure the sound of your veins when blood rushes through
    them. This sound is unique for everyone, and it does not change during your lifespan.
    Just imagine using these sounds are your private key to the data on the blockchain.
    The making and selling of virtual and digital products have been snowballing for
    a long time now. With blockchain, you can market, sell, and even control your
    digital products like books, courses like these, and music, to mention a few.
    A musician can upload her music to a blockchain and try different models of buying
    the product. She could, for example, have one price for listening, one for making
    a ringtone, and another one with a commercial license for using it in an app.
    All can be done without a significant organization taking the threat of the royalties.
    Just try to imagine all the possibilities that lay in front of us now.


    # [More usages](#toc.xhtml#s70a)


    Blockchains have many different use cases when it comes to storing data. Let''s
    take a look at a few of them. The first one and most public use for a blockchain,
    as we''ve already discussed, is digital currencies like Bitcoin. We''ve already
    touched on this, but this is the most common use at the moment for blockchain
    technology. Another new use for a blockchain is electronic voting. At the moment,
    when you vote for a president or prime minister, you have to go to a polling station,
    put a piece of paper into a box, and then trust a team of people to count the
    votes correctly. Even in this day and age, this system can be easily rigged. Using
    a blockchain, votes for candidates can be registered anonymously from your mobile
    and personal device. Then many nodes on a network will all begin verifying and
    validating the vote so that nobody can tamper with the process. Another exciting
    use is that of protecting intellectual property. Digital information can be copied
    and redistributed with ease on the Internet. This makes retaining and proving
    copyright hard. A blockchain can be used to store digital signatures of people''s
    work, along with a timestamp and a blockchain, which means there is immutable
    proof of ownership for that work. Of course, if we have the timestamp baked into
    the digital signature, we can prove when that piece of work, whether written or
    an image, was placed onto the blockchain. Next, we have a use case around `anti-money
    laundering (AML)` and know your customer compliance practices for financial services
    companies. Currently, financial companies must perform a labor-intensive and expensive
    process for each new customer. Know your customer costs can be slashed dramatically
    though with cross-company client verification where once a person has been identified,
    the results and all the scans of identifying documents, like passports, can be
    placed onto the blockchain and digitally signed. This makes it easier for that
    person to be verified in the future, as their details are already baked onto the
    blockchain. By having this data on the blockchain, it can be utilized by many
    financial companies because they each are contributing to the identity data, as
    well as verifying its integrity. Another use of blockchain is tracking items through
    a supply chain. As an example, you could have a journey of food from farmer to
    shop being tracked so that as you purchase food items, you can see where it was
    originated from and that it has not been tampered with in its journey. Finally,
    the recording of land registry deeds or any other type of public or official documents.
    Using accessible public ledgers like a blockchain can be useful for any kind of
    record-keeping. These types of documents can be victims of fraud, as well as expensive
    to administer. As properties are bought and sold, the details of their sale and
    transfer of ownership can be permanently written onto a blockchain. This is by
    no means an exhaustive list of potential applications for blockchains, but it
    should give you an idea of some potential use cases.


    # [Impact of blockchain technology in education](#toc.xhtml#s71a)


    Blockchain’s capabilities are not limited to Bitcoin and financial transactions;
    instead, it has a broad scope that could be leveraged in our education industry
    as well. Blockchain can have its implementation in educational institutions like
    universities, in the publishing industry, or a group of educational institutions
    as well. It could be used to gather education data, qualifications, and credits
    more securely and transparently. The following are five areas where blockchain
    technology would be an excellent choice.


    # [Education institutions](#toc.xhtml#s72a)'
  fmt: '

    Now that you know the most critical technical aspects of blockchain, let''s discuss
    some of the current usages for it and why it can be such a real `game-changer`.
    As mentioned many times in this book, the current most broad use of the blockchain
    is with digital currencies like Bitcoin. Because anonymous transactions can be
    trusted just as much as they can with any bank, this opens up a wide range of
    new ways to deal with global transactions. Let me give you a real-life example.
    A good friend of mine is a refugee from one of the most horrific wars in modern
    history. He managed to escape, but his wife is still left in the country. Making
    sure that she has the financial means to survive is crucial.


    Before blockchain, the only option to provide her with money from the other side
    of the world was by using a money-transferring agency. These are very costly,
    and they take a rather large cut of my friend''s limited funds when transferring.
    Furthermore, transactions can take many days to complete. And lastly, they require
    that she shows up personally to collect the money, which is not very safe. With
    blockchain, however, there is no need for a large transferring agency, and there
    are apps where you can transfer money almost instantly with transfer costs that
    are only a small fraction. Believe it or not, but even in war-torn countries,
    you will be able to find the Internet and transfer the money directly to a mobile
    device. We only see the very beginning of how these kinds of solutions will change
    the world in ways we cannot even grasp yet. A small revolution that has been going
    on for some time is called the `Internet of Things (IoT)`. This is where small
    smart devices use the Internet without human intervention. Right now, there are
    many more devices using the Internet than humans. By using blockchain, these devices
    can suddenly do trustworthy transactions securely.


    An example of this is that your washing machine could order detergent for you
    when it notices that it''s getting empty. The product lifecycle is another area
    where you store all the information on workflow or product in the blockchain.
    It could, for example, follow the lifespan of a car from the factory through the
    seller to the customer into the workshop and, lastly, to the recycling plant.


    Certifications are also a significant area of use. Certification bodies could
    issue certifications to products or organizations in a tamper-free and fully transparent
    way. The secure sharing of data is another example. Given the nature of blockchain,
    you could insert encrypted information into it and make sure that only those you
    allow can access your information. This could be used, for example, with medical
    information or medical devices in a secure manner. Suddenly, all hospitals in
    the world could have instant access to your medical folder when needed, and you
    would be able to track everyone that has tried to access your information. There
    are now devices that will measure the sound of your veins when blood rushes through
    them. This sound is unique for everyone, and it does not change during your lifespan.
    Just imagine using these sounds as your private key to the data on the blockchain.
    The making and selling of virtual and digital products have been snowballing for
    a long time now. With blockchain, you can market, sell, and even control your
    digital products like books, courses like these, and music, to mention a few.
    A musician can upload her music to a blockchain and try different models of buying
    the product. She could, for example, have one price for listening, one for making
    a ringtone, and another one with a commercial license for using it in an app.
    All can be done without a significant organization taking the threat of the royalties.
    Just try to imagine all the possibilities that lay in front of us now.


    ## More Usages


    Blockchains have many different use cases when it comes to storing data. Let''s
    take a look at a few of them. The first one and most public use for a blockchain,
    as we''ve already discussed, is digital currencies like Bitcoin. We''ve already
    touched on this, but this is the most common use at the moment for blockchain
    technology. Another new use for a blockchain is electronic voting. At the moment,
    when you vote for a president or prime minister, you have to go to a polling station,
    put a piece of paper into a box, and then trust a team of people to count the
    votes correctly. Even in this day and age, this system can be easily rigged. Using
    a blockchain, votes for candidates can be registered anonymously from your mobile
    and personal device. Then many nodes on a network will all begin verifying and
    validating the vote so that nobody can tamper with the process. Another exciting
    use is that of protecting intellectual property. Digital information can be copied
    and redistributed with ease on the Internet. This makes retaining and proving
    copyright hard. A blockchain can be used to store digital signatures of people''s
    work, along with a timestamp and a blockchain, which means there is immutable
    proof of ownership for that work. Of course, if we have the timestamp baked into
    the digital signature, we can prove when that piece of work, whether written or
    an image, was placed onto the blockchain. Next, we have a use case around `anti-money
    laundering (AML)` and know your customer compliance practices for financial services
    companies. Currently, financial companies must perform a labor-intensive and expensive
    process for each new customer. Know your customer costs can be slashed dramatically
    though with cross-company client verification where once a person has been identified,
    the results and all the scans of identifying documents, like passports, can be
    placed onto the blockchain and digitally signed. This makes it easier for that
    person to be verified in the future, as their details are already baked onto the
    blockchain. By having this data on the blockchain, it can be utilized by many
    financial companies because they each are contributing to the identity data, as
    well as verifying its integrity. Another use of blockchain is tracking items through
    a supply chain. As an example, you could have a journey of food from farmer to
    shop being tracked so that as you purchase food items, you can see where it was
    originated from and that it has not been tampered with in its journey. Finally,
    the recording of land registry deeds or any other type of public or official documents.
    Using accessible public ledgers like a blockchain can be useful for any kind of
    record-keeping. These types of documents can be victims of fraud, as well as expensive
    to administer. As properties are bought and sold, the details of their sale and
    transfer of ownership can be permanently written onto a blockchain. This is by
    no means an exhaustive list of potential applications for blockchains, but it
    should give you an idea of some potential use cases.


    ## Impact of Blockchain Technology in Education


    Blockchain’s capabilities are not limited to Bitcoin and financial transactions;
    instead, it has a broad scope that could be leveraged in our education industry
    as well. Blockchain can have its implementation in educational institutions like
    universities, in the publishing industry, or a group of educational institutions
    as well. It could be used to gather education data, qualifications, and credits
    more securely and transparently. The following are five areas where blockchain
    technology would be an excellent choice.


    ## Education Institutions

    '
  trans: '

    既然你已经了解了区块链最关键的技术层面，让我们来讨论一下它目前的一些用途，以及为什么它能成为真正的 `game-changer`（颠覆性创新/改变游戏规则者）。正如本书多次提到的，目前区块链最广泛的用途是用于比特币等数字货币。因为匿名交易可以像银行交易一样受到信任，这为处理全球交易开辟了广泛的新途径。让我举个现实生活中的例子。我的一位好朋友是现代史上最惨烈战争之一的难民。他设法逃了出来，但他的妻子仍留在国内。确保她有生存的经济来源至关重要。


    在区块链出现之前，从世界另一端给她汇款的唯一选择是使用汇款机构。这些机构费用高昂，且在转账时会从我朋友有限的资金中抽取相当大的一笔。此外，交易可能需要许多天才能完成。最后，它们要求她亲自到场领取现金，这并不安全。然而，有了区块链，就不需要大型汇款机构了，而且有应用程序可以让你几乎即时转账，转账成本仅为一小部分。信不信由你，即使在战火纷飞的国家，你也能找到互联网，并将钱直接转到移动设备上。我们看到的仅仅是此类解决方案将如何以我们目前甚至无法完全掌握的方式改变世界的开端。一场已经持续一段时间的小型革命被称为
    `Internet of Things (IoT)`（物联网）。这是指小型智能设备在无人干预的情况下使用互联网。目前，使用互联网的设备数量远超人类。通过使用区块链，这些设备突然可以安全地进行可信交易。


    一个例子是，当你的洗衣机检测到洗涤剂快用完时，它可以为你自动订购。产品生命周期是另一个应用领域，你可以在区块链上存储工作流或产品的所有信息。例如，它可以追踪一辆汽车从工厂、经销商、客户、维修车间，直到回收厂的全生命周期。


    认证也是一个重要的应用领域。认证机构可以以防篡改且完全透明的方式向产品或组织颁发认证。数据的安全共享是另一个例子。鉴于区块链的特性，你可以将加密信息存入其中，并确保只有你授权的人才能访问你的信息。这可以用于例如医疗信息或医疗设备，以安全的方式进行管理。突然之间，世界上所有医院在需要时都能即时访问你的病历，而你也能追踪所有试图访问你信息的人。现在已有设备能测量血液冲过血管时的声音。这种声音对每个人都是独一无二的，且在一生中不会改变。想象一下，将这些声音作为你访问区块链上数据的私钥。虚拟和数字产品的制作与销售已经滚雪球般增长了很长一段时间。有了区块链，你可以营销、销售，甚至控制你的数字产品，如书籍、此类课程、音乐等。一位音乐家可以将她的音乐上传到区块链，并尝试不同的产品购买模式。例如，她可以设定一个收听价格、一个制作铃声的价格，以及另一个用于在应用中商业使用的商业许可价格。所有这些都无需大型组织抽取大量版税。试着想象一下，现在摆在我们面前有多少种可能性。


    ## 更多用例


    区块链在数据存储方面有许多不同的用例。让我们看看其中的一些。第一个也是最公开的用例，正如我们已经讨论的，是比特币等数字货币。我们已经涉及过这一点，但这是目前区块链技术最常见的用途。区块链的另一个新用途是电子投票。目前，当你投票选总理或总统时，你必须去投票站，把一张纸投进箱子，然后信任一群人正确计票。即使在今天，这个系统也很容易被操纵。使用区块链，可以从你的移动设备和个人设备上匿名登记对候选人的投票。然后，网络上的许多节点将开始验证和确认投票，使得没有人能篡改该过程。另一个令人兴奋的用途是保护知识产权。数字信息在互联网上可以轻松复制和重新分发。这使得保留和证明版权变得困难。区块链可用于存储人们作品的数字签名，连同时间戳和区块链记录，这意味着对该作品的所有权有不可篡改的证明。当然，如果我们将时间戳嵌入数字签名中，我们就能证明那件作品——无论是文字还是图像——何时被放置到区块链上。接下来，我们有一个关于
    `anti-money laundering (AML)`（反洗钱）和金融服务公司了解你的客户（KYC）合规实践的用例。目前，金融公司必须为每位新客户执行劳动密集型且昂贵的流程。然而，通过跨公司客户验证，一旦某人被识别，结果及所有身份证明文件（如护照）的扫描件就可以放到区块链上并进行数字签名，从而大幅削减
    KYC 成本。这使得该人未来更容易被验证，因为他们的详细信息已经“烘焙”在区块链上。通过将这些数据放在区块链上，许多金融公司都可以利用它，因为它们每家都在为身份数据做贡献，同时也在验证其完整性。区块链的另一个用途是追踪供应链中的物品。例如，你可以追踪食品从农场到商店的全过程，这样当你购买食品时，可以看到它的产地，并确认它在运输过程中未被篡改。最后，是土地注册契据或任何其他类型的公共或官方文件的记录。使用像区块链这样可访问的公共账本，可用于任何类型的记录保存。这些类型的文件可能成为欺诈的受害者，且管理成本高昂。随着房产的买卖，其销售详情和所有权转移可以永久写入区块链。这绝不是区块链潜在应用的详尽列表，但它应该能让你对一些潜在用例有个概念。


    ## 区块链技术在教育领域的影响


    区块链的能力不仅限于比特币和金融交易；相反，它具有广泛的范围，也可以在我们的教育行业中加以利用。区块链可以在大学等教育机构、出版行业或一组教育机构中实施。它可以用于更安全、透明地收集教育数据、资格和学分。以下是区块链技术将成为绝佳选择的五个领域。


    ## 教育机构

    '
