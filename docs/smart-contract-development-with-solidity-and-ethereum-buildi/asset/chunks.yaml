    # [Section - I](#toc.xhtml#p01)


    # [What is Blockchain and How does it Work?](#toc.xhtml#p01)


    The following is the description from MSDN blogs:


    *At the most basic level of understanding, blockchains are a simple approach to
    a distributed database. It is a peer-to-peer system with no central authority
    managing data flow. One of the key ways of removing central control while maintaining
    data integrity is to have a large distributed network of independent users. You
    can think of blockchains as distributed databases that a group of individuals
    controls and that store and share information. The most popular form of a blockchain
    implementation out there is* `Bitcoin`*, which is a cryptocurrency.*


    *A blockchain is a data structure that makes it possible to create a digital ledger
