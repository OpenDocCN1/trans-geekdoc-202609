- raw: "# [Smart Contracts Development](#toc.xhtml#p03)\n\nIn the last section, we\
    \ learned about setting up Ethereum blockchain on Microsoft Azure using a consortium\
    \ leader. Time for some development now. Before we move on to smart contracts\
    \ and their development, it’s essential to set up a development environment as\
    \ a pre-requisite. This section will solely focus on setting up the development\
    \ environment for smart contract development. In the next section, we’ll see what\
    \ smart contracts are and how we can develop those.\n\n![](images/Figure_3.0.1.jpg)\n\
    \n**Image credit:** [https://pixabay.com](https://pixabay.com)\n\n**Figure 3.0.1**\n\
    \n# [Tools and development environment](#toc.xhtml#s45a)\n\nWe’ll use a list of\
    \ tools to set up our development environment before we proceed with actual development.\
    \ I’ll use a fresh window installation on Microsoft Azure. You can follow the\
    \ steps to set up a VM on Azure in the last section before we start. We’ll install\
    \ the Chrome browser on the new machine, followed by MetaMask that is the chrome\
    \ plugin, which will help us in the authentication. Microsoft provides Visual\
    \ Studio code, that is free, and we can use that as a development IDE for our\
    \ smart contract’s development. We’ll install the `NuGet Package Manager (NPM)`\
    \ and Chocolatey that is also a package manager, to get other tools and packages\
    \ needed for development. We’ll use Git along with NPM and Windows build tools\
    \ for building/compiling the code. We’ll use an in-memory test server known as\
    \ `Test RPC` to test the application and lastly Truffle. We’ll explore more about\
    \ Truffle when we start development.\n\n# [CHAPTER 1](#toc.xhtml#p03c01)\n\n#\
    \ [Setting up an Environment for Smart Contracts Development](#toc.xhtml#p03c01)\n\
    \n![](images/Figure_3.1.1.jpg)\n\n**Figure 3.1.1**\n\n# [Azure](#toc.xhtml#s46a)\n\
    \nAzure is a cloud platform from Microsoft and provides numerous resources in\
    \ context on cloud computing. One of the resources is a `virtual machine (VM)`,\
    \ i.e., a fully functional machine of your choice with the choice of your configurations\
    \ and operating system could be created within seconds with just a few clicks.\
    \ You can access the machine remotely from anywhere with your secure credentials\
    \ and do whatever you want, for example, hosting your website, developing applications,\
    \ creating production or test environment for your software, and many more. Let’s\
    \ see step by step how we can achieve that.\n\n# [Structure](#toc.xhtml#s47a)\n\
    \nIn this chapter we will discuss the following topics\n\n*   Virtual machine\
    \ setup on Azure\n\n*   Getting the environment ready for smart contract development\n\
    \n# [Objectives](#toc.xhtml#s48a)\n\nAfter studying this unit, you should be able\
    \ to\n\n*   Setup a development environment for programming smart contracts.\n\
    \n# [Azure account setup](#toc.xhtml#s49a)\n\nFollow the steps in the last section\
    \ to set-up an Azure account if it is not already done.\n\n# [Virtual machine\
    \ setup on Azure](#toc.xhtml#s50a)\n\n1.  Once on the dashboard, click on the\
    \ `Virtual machines` link on the dashboard, and a right panel would open where\
    \ you see all your VM’s. Since we are creating new and we do not have existing\
    \ ones, so it would be blank. Click on `Create virtual machine`: \n\n    ![](images/Figure_3.1.2.jpg)\n\
    \n    **Figure 3.1.2**\n\n2.  Once you click on `Create virtual machine`, you’ll\
    \ get to see all the operating systems and solution templates that Azure provides\
    \ to create a machine. You can choose to have Windows or Linux operating system\
    \ based on requirements, but be careful about costs involved: \n\n    ![](images/Figure_3.1.3.jpg)\n\
    \n    **Figure 3.1.3**\n\n3.  Since this section is for learning how to create\
    \ a virtual machine, I’ll choose the `Windows Client` machine with minimal machine\
    \ configurations, and one can choose based on requirements and need. So, choose\
    \ `Windows Client` as shown in the following screenshot: \n\n    ![](images/Figure_3.1.4.jpg)\n\
    \n    **Figure 3.1.4**\n\n4.  You’ll get the window of the license agreement and\
    \ legal terms. Read that carefully and press the `Create` button: \n\n    ![](images/Figure_3.1.5.jpg)\n\
    \n    **Figure 3.1.5**\n\n5.  After clicking on `Create`, you’ll be asked to fill\
    \ some basic requirements, as shown in the following screenshot. Give the name\
    \ as per your choice; for example., I gave it AKHILPC, leave `VM disk type as\
    \ SSD,` or choose as per your need. Provide a username and password you would\
    \ need when you connect remotely with the machine. Keep the username and password\
    \ safe and secure. Choose the subscription, if you have a paid one, choose that\
    \ else choose the trial subscription that you got. You must provide a `Resource\
    \ group`. You can create a new or use an existing one. The resource group gives\
    \ you a logical separation for all your Azure resources. Since I have an existing\
    \ resource group created, I am using that. Choose `Location`, click on confirmation\
    \ checkbox and click `OK`: \n\n    ![](images/Figure_3.1.6.jpg)\n\n    **Figure\
    \ 3.1.6**\n\n6.  Once you click `OK`, you get to see the second section to choose\
    \ the size of the machine where you see the list of RAMs, Hard disk size, SKU,\
    \ and zones. Each configuration has a cost associated with it, so choose as per\
    \ your need and budget. For training/tutorial purposes, I am choosing the first\
    \ one that has the minimum cost as shown in the following screenshot: \n\n   \
    \ ![](images/Figure_3.1.7.jpg)\n\n    **Figure 3.1.7**\n\n7.  In the third step,\
    \ you are needed to choose specific settings related to availability, storage,\
    \ and network. Choose/Provide the settings as per your discretion: \n\n    ![](images/Figure_3.1.8.jpg)\n\
    \n    **Figure 3.1.8**\n\n8.  Once you click `OK`, you’ll be shown a summary page\
    \ for all the configuration you choose, cost per hour, and OS. Confirm if everything\
    \ looks good by clicking on the confirmation checkbox as shown in the following\
    \ screenshot, and click on the `Create` button. \n\n    ![](images/Figure_3.1.9.jpg)\n\
    \n    **Figure 3.1.9**\n\n9.  Once you click `Create`, it may take a while to\
    \ create your VM. It will say `Submitting deployment for`…. Wait till the deployment\
    \ is complete. For me, it took `5~9` minutes: \n\n    ![](images/Figure_3.1.10.jpg)\n\
    \n    **Figure 3.1.10**\n\n10.  Once the deployment is done, you’ll see the section\
    \ for your deployed VM, where you can choose to `Start, Stop, Restart, Move`,\
    \ or `Delete` your created VM. Clicking on `Connect` will show you two options\
    \ in the right panel, that is, `RDP` and SSH. We’ll choose to connect via `RDP`,\
    \ so download the RDP file shown at the right panel. Click on the `Download RDP\
    \ File` button to get the file. Alternatively, you can directly open RDP connect\
    \ via an `mstsc` command on your local machine. You get the IP address, as shown\
    \ in the following screenshot, in the RDP section: \n\n     ![](images/Figure_3.1.11.jpg)\n\
    \n     **Figure 3.1.11**\n\n11.  The downloaded RDP file will be located at your\
    \ local download location. Click on that to configure the RDP connection. \n\n\
    \     ![](images/Figure_3.1.12.jpg)\n\n     **Figure 3.1.12**\n\n12.  The IP would\
    \ automatically be filled, just fill the username and password to connect. \n\n\
    \     ![](images/Figure_3.1.13.jpg)\n\n     **Figure 3.1.13**\n\n13.  Once the\
    \ connection is successful, you’ll see the Welcome message while window loads\
    \ and configures for the first-time use. Please wait for a while. \n\n     ![](images/Figure_3.1.14.jpg)\n\
    \n     **Figure 3.1.14**\n\n14.  Once Windows loaded, you’ll see the desktop as\
    \ shown below. Now you can choose to do whatever you want with this machine: \n\
    \n     ![](images/Figure_3.1.15.jpg)\n\n     **Figure 3.1.15**\n\n     `Note that\
    \ for the time you use the machine, you’ll be charged hourly.`\n\n15.  In case\
    \ you do not want to use the machine for some time or stop the machine daily at\
    \ a defined time, you can do that manually by clicking on the `Virtual machines`\
    \ option at your Azure dashboard. You’ll see your VM. Select your VM and click\
    \ on `Stop`. You can start whenever you want. Thus, you can save a lot of costs.\
    \ \n\n     ![](images/Figure_3.1.16.jpg)\n\n     **Figure 3.1.16**"
