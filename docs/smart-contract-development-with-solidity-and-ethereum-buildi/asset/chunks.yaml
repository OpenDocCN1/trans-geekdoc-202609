    # Preface


    Most people have a bank account, and a bank is a centralized institution that
    you trust to handle your money and transactions. You may be thinking, what''s
    the big deal? I''ve been with my bank for years and not had any problems. But
    that''s not really the issue. The thing we''re talking about here is that as an
    individual we are putting a lot of trust into one organization to manage our money.
    This is also a huge burden for the bank in question. They must keep your data
    safe and secure to help maintain that trust. Because you are putting your trust
    into one organization, what is stopping them from accidentally losing some of
    your money due to systems errors or fraud? These are all threats that the banking
    system must deal with, and as consumers, we trust them to get it right. But they
    don''t always get it right and things can go wrong. If we take this concept to
    a higher level than just banks and look at traditional fiat currencies, like the
    U. S. dollar, Euro, or British pound, these again are very centralized concepts,
    as they are controlled and regulated by governments. Plus, we are used to centralized
    control from governments. There is another option, and that is to be decentralized.


    One of the benefits of blockchain technology is to get trust on the internet by
    using decentralization. What do we mean by this?


    If you have heard about Bitcoins, you would not have missed gearing about Blockchain
    as well. The technology behind Bitcoins is Blockchain, but what exactly Blockchain
    provides?


    Imagine if there were an infrastructure where everyone could securely process
    transactional code and access the data that can never be tampered with. All the
    transactions are stored in the form of a block which is very hard to manipulate
    or tamper with, once they are stored on a blockchain. This is the behavior of
    blockchain where you can store the data in the most trustworthy way in scenarios
    where there is no trust. Blockchain obviously is not a place where you can store
    a large amount of data for every transaction. For example, you cannot store a
    lot of images or documents in bulk, but you can for sure store information that
    can validate whether your documents or images are tampered with or not.


    Most data stored on a blockchain is focused on transactions and states of objects,
    rather than the actual objects themselves.


    This book teaches the concept of Blockchain in detail and gives hands-on experience
    in developing and deploying Ethereum Blockchain on Azure and Developing Smart
    Contracts.


    This book promises to be a very good starting point for complete novice learners
    and is quite an asset to advanced readers too. The author has written the book
    so that the beginners will learn the concepts related to blockchain and smart
    contract development.


    We have developed **4 sections** where you can find the following topics:


    **[Section 1](#p01.xhtml)** An introduction to Blockchain and how does it work.
    The section is divided into 2 chapters to cover the topics.


    You will know the concept of Blockchain, the terminology, how blockchain works
    internally and the cryptographic principles on which blockchain works.


    **[Section 2](#p02.xhtml)** This section is named as "Ethereum and DApps". In
    this section, we''ll discuss what Ethereum is and what is its need? We''ll look
    at the execution and funding model of Ethereum. The section will also focus on
    distributed apps. The section is divided into 2 chapters where chapter one focuses
    on denominations, Dao, Payment model and transactions and chapter two is more
    of a hands-on exercise to set-up Ethereum Blockchain on Azure.

