- raw: 'Widespread use for hashing is when storing passwords in a database. If you
    store the password in clear text in your database, your usage might be at risk
    if your database is hacked and the hacker gets access to the database table with
    usernames and passwords; however, if the password is hashed, the hacker will have
    a tough time figuring out the passwords. They will then need to compare the passwords
    with known hashed results where the input is known less well. This can be done
    by generating a large number of hashes based on random text strings or even by
    pre-existing lists of common hashes. The longer a password is, the less likely
    it is that the hacker can find the input that created a particular hash and still
    if they were able to figure it out, they wouldn''t be 100% sure so they would
    have to test every combination that led to the same hash. Because hash algorithms
    always give the same result given the same input and always give a fixed length
    of the result, they are also ideal for verifying the consistency of more massive
    amounts of data. If you put the entire *Wikipedia* website through a hashing algorithm
    and save the resulting hash, you could quickly figure out if someone has changed
    anything on the website. Even a single comma would result in a different hash
    result. So, when comparing two hashes, it is rapid to determine if they match
    or not. If they match, nothing has changed. If they do not match, someone has
    altered the original. This is a very sure and quick way to figure out if the data
    has been compromised. And another benefit is that you do not need to store the
    original data to see if anything has changed. All you need to store is the initial
    hash. Hashing algorithms are also used in many areas of modern security, where
    the need for consistency is high. For example, in secure communication where timestamps
    are exchanged. While we are discussing hashing, let''s quickly talk about a related
    topic called a `Merkle tree`.


    ![](images/Figure_1.1.1.jpg)


    **Image source:** [https://commons.wikimedia.org/wiki/File:Hash\_Tree.svg](https://commons.wikimedia.org/wiki/File:Hash_Tree.svg)


    **Figure 1.1.1**


    A Merkle tree is a hash of hashes, which makes it quick and somewhat easy to confirm
    large amounts of data and transactions. Let''s say we have four sets of data.
    To simplify, I''m using one word here for each data block, but this could easily
    be, for example, transactions in real life. These words produce four different
    hashes. In the Merkle tree, groups of these hashes are hashed together to create
    a hash of hashes. These hashes are then hashed together as well, creating what
    we call a root or top hash. To figure out if something has changed anywhere in
    the Merkle tree, we only need to see if the root hash has changed, and you can
    then follow the tree down to see where the change is done.


    # [Block](#toc.xhtml#s9a)


    Now that we have some basic terminology covered, let''s begin to look at the actual
    block in the blockchain. A block consists of data and its resulting hash. If we
    go ahead and change any data in the block, the hash will change, and the block
    will be invalid. It also includes the nonce, which is input to the hashing algorithm
    that would result in the first part of the hash to be something predefined like
    a set of zeros. It''s not possible to predict the nonce so that it can be considered
    as proof of work by the machine creating the hash. Let''s say that we require
    our hash to have a leading number of four zeros. Whenever we change anything,
    we will need to rerun the hashing algorithm until we figure out which nouns to
    set. This is called `mining the block.`


    Let''s see what happens when we have a chain of blocks. When we are looking at
    the chain, the block also contains a block number, meaning which order it has
    in the blockchain. A block also must contain a timestamp, but most importantly,
    the block in a blockchain will include the hash of the previous block. This means
    that if you alter any of the value in one of the blocks, you will break all the
    blocks following in the chain. This is also where the Merkle tree, mentioned earlier,
    is used. The only way to fix the blockchain will then be to mine all the blocks
    after the changed block and make the nonce hashes all over. In the blockchain,
    we distribute a chain of blocks to a vast number of computers. This means that
    the chain exists in multiple locations. Depending on the implementation of blockchain
    you are using, it could be millions of replications of the chain. This means that
    we could quickly figure out if something has changed, even if one of the chains
    has been re-mined. The resulting hashes would be different from one chain and
    blockchain works in a way where the chain that has the most work put into it wins,
    so to say. The altered chain would then be rejected by the distributed blockchain
    and be removed. To better understand why it''s so hard to fake anything in a blockchain,
    let''s talk a little bit about the concept of forks.


    # [Forks](#toc.xhtml#s10a)


    First, we have our user, *Kent*. He has a balance of 100 Bitcoins, and he wants
    to buy a new *Tesla car.* He got the Bitcoins from his very rich, but still, down-to-earth
    mother called *Sharon*. He finds a vendor that is selling cars using Bitcoins.
    He adds the transaction to the blockchain and drives away, smiling in his electric
    wonder machine, but when he comes back, he sees a *Mercedes* that he likes on
    the Internet. The vendor also accepts Bitcoins. Unfortunately, he is now breaking,
    but he kept information about his previously owned Bitcoins. He, therefore, tries
    to add a block to the blockchain where he spends the same money once more. This
    creates a fork in the blockchain, and for him to fix it, he must have a lot of
    computing power at his hands. Since the blockchain consists of having to prove
    that you put work into the calculations, he would have to have almost the same
    computing resources as the rest of the blockchain for his new chain to be accepted.
    This is quite unlikely, but we have seen some people trying to do this, but this
    fork has always been downloaded and removed. Since it requires so much computing
    power to do this, it''s an excellent incentive to stay honest. The same computing
    power could have been used to mine blocks legally instead.


    # [Public versus private](#toc.xhtml#s11a)'
  fmt: '

    哈希算法的一个广泛用途是用于在数据库中存储密码。如果你在数据库中以明文形式存储密码，一旦数据库被黑客攻破并获取了包含用户名和密码的数据表，你的用户就会面临风险；然而，如果密码经过哈希处理，黑客将很难破解出原始密码。他们随后需要将密码与已知输入的哈希结果进行比对。这可以通过基于随机文本字符串生成大量哈希值，或利用预先存在的常见哈希列表来完成。密码越长，黑客找到生成特定哈希值的输入的可能性就越小；即使他们设法破解出来，也无法
    100% 确定，因此他们必须测试所有导致相同哈希值的组合。


    由于哈希算法对于相同的输入总是产生相同的结果，且输出长度固定，因此它们也非常适合验证大量数据的一致性。如果你将整个 `Wikipedia` 网站的内容通过哈希算法处理并保存结果哈希值，就能快速判断网站内容是否被篡改。哪怕仅改动一个逗号，也会导致完全不同的哈希结果。因此，比较两个哈希值可以极快地确定它们是否匹配。如果匹配，说明数据未变；如果不匹配，说明原始数据已被篡改。这是一种非常可靠且快速的数据完整性校验方法。另一个好处是无需存储原始数据即可检测变更，只需保存初始哈希值即可。哈希算法还广泛应用于现代安全领域的许多方面，这些领域对一致性要求极高。例如，在交换时间戳的安全通信中。


    在讨论哈希算法时，让我们简要了解一下一个相关概念——`Merkle tree`（默克尔树）。


    ```

    ![](images/Figure_1.1.1.jpg)

    ```


    **图片来源：** [https://commons.wikimedia.org/wiki/File:Hash_Tree.svg](https://commons.wikimedia.org/wiki/File:Hash_Tree.svg)


    **图 1.1.1**


    默克尔树是哈希的哈希，这使得快速且相对容易地确认大量数据和交易成为可能。假设我们有四组数据。为简化起见，此处每个数据块用一个单词表示，但在现实中这可以是交易等。这些单词会生成四个不同的哈希值。在默克尔树中，这些哈希值分组再次哈希，生成哈希的哈希。这些哈希值再进一步哈希，形成我们所谓的根哈希或顶部哈希。要判断默克尔树中任何位置是否发生变更，只需检查根哈希是否改变，然后沿树向下追踪即可定位变更位置。


    # 区块


    在了解了一些基本术语后，让我们开始探讨区块链中的实际区块。一个区块由数据及其生成的哈希值组成。如果我们修改区块中的任何数据，哈希值就会改变，导致该区块失效。区块还包含一个
    `nonce`（随机数），它是哈希算法的输入，使得哈希结果的前缀满足特定条件（如前导零）。无法预测 `nonce`，因此它可被视为创建哈希的机器完成工作量的证明。假设我们要求哈希值具有四个前导零。每当我们修改任何内容，都需要重新运行哈希算法，直到找到合适的
    `nonce`。这个过程称为 `mining the block`（挖掘区块）。


    让我们看看当存在区块链时会发生什么。在区块链中，区块还包含区块编号，表示其在区块链中的顺序。区块必须包含时间戳，但最重要的是，区块链中的区块将包含前一个区块的哈希值。这意味着如果你篡改任一区块中的任何值，该区块之后的所有区块都将失效。这也是前面提到的默克尔树发挥作用的地方。修复区块链的唯一方法是重新挖掘被篡改区块之后的所有区块，并重新计算所有
    `nonce` 哈希值。


    在区块链中，我们将区块链分发给大量计算机。这意味着链存在于多个位置。取决于你使用的区块链实现，可能有数百万个链的副本。这意味着我们能迅速发现篡改，即使其中一条链已被重新挖掘。生成的哈希值将与其他链不同，区块链的工作方式是“累积工作量最多的链获胜”。因此，被篡改的链会被分布式区块链拒绝并移除。为了更好地理解为何在区块链中伪造数据极其困难，让我们稍微谈谈分叉的概念。


    # 分叉


    首先，我们有一位用户 `Kent`。他拥有 100 个比特币，想买一辆新的 `Tesla` 汽车。这些比特币来自他非常富有但依然朴实的母亲 `Sharon`。他找到一家接受比特币支付的汽车供应商。他将交易添加到区块链中，开着他的电动座驾扬长而去。但当他回来时，他在网上看中了一辆
    `Mercedes`，供应商也接受比特币。不幸的是，他现在身无分文，但他保留了之前拥有比特币的信息。因此，他试图向区块链添加一个区块，再次花费这笔相同的钱。这在区块链中制造了一个分叉。要解决这个分叉，他必须掌握巨大的算力。由于区块链要求证明你投入了计算工作量，他的新链要被接受，几乎需要拥有与整个区块链网络其余部分相当的计算资源。这极不可能发生，虽然我们见过有人尝试，但这种分叉总是被拒绝并移除。由于这需要如此巨大的算力，这成为保持诚实的强大激励。同样的算力本可用于合法挖掘区块。


    # 公有链与私有链

