- raw: "Truffle is a toolset framework for development, testing, and asset pipeline\
    \ for Ethereum development. Truffle includes tooling to compile and build your\
    \ solution. It enables a framework for automated testing, and it makes deployment\
    \ of our contract very simple with the support of configurable deployment locations.\
    \ Another great thing about Truffle is that we can use it in console mode as well\
    \ to interact directly with our deployed contracts. This is quite cool, and I'll\
    \ show you how it works shortly. When working with smart contracts, we must know\
    \ that our contracts work as expected before we unleash them to the world because\
    \ we don't have a feasible option for doing a take two. Uploading to a blockchain\
    \ test environment on the net will take some time. It is, therefore, very time-saving\
    \ to use a local test blockchain instead. Test RPC is an easy-to-use, in-memory\
    \ blockchain that is great for testing your contracts while developing. Not having\
    \ to wait for an external blockchain will speed up your development in the early\
    \ phases. Test RPC implements EthereumJS, which is the same set of instructions\
    \ that you'll find in the real Ethereum blockchain. Another great thing about\
    \ Test RPC is that it will automatically create 10 throwaway test accounts for\
    \ you with the connected private keys.\n\n# [Developing a smart contract](#toc.xhtml#s61a)\n\
    \nLet’s start developing our first smart contract of `hello world.` We’ll start\
