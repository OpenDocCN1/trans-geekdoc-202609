    # 数字签名


    密码学的一项基本功能是确保发送消息的**不可抵赖性**。这意味着消息的接收者无法否认该消息的真实性。数字签名是一种用于帮助证明消息真实性的技术。有效的数字签名给接收者一个理由，相信该消息是由已知发送者创建的，从而使发送者无法否认曾发送过该消息。数字签名同时提供了**认证**和**不可抵赖性**。认证是因为签名必须由持有有效私钥的用户创建；不可抵赖性是因为接收者可以信任消息是由已知发送者签名的，因为只有他们知道私钥。那么数字签名是如何实现这一切的呢？对于消息的接收者，数字签名允许接收者相信消息是由正确的发送者发送的。这可以被视为信件上手写签名的数字等价物，只不过数字签名更难伪造。数字签名由以下三种算法组成：使用
    `RSA` 进行公钥和私钥生成、使用私钥创建签名的签名算法、以及使用公钥测试消息是否真实的签名验证算法。私钥和公钥是两个数学上相关联的密钥。公钥顾名思义，可以为任何人所知；私钥应仅为你——消息的发送者——所知。因此，必须保守这个私钥的秘密。


    现在让我们看一个数字签名如何工作的示例。在这个例子中，Alice 向 Bob 发送了一条消息，该消息将使用数字签名进行签名。


    ![](img/Figure_1.2.7.jpg)


    **图片来源：** [`upload.wikimedia.org/wikipedia/commons/9/93/Ss_digitalsignature.png`](https://upload.wikimedia.org/wikipedia/commons/9/93/Ss_digitalsignature.png)


    **图 1.2.7**


    首先，Alice 加密她想发送给 Bob 的某些数据。对于这个例子，数据是使用对称还是非对称加密算法加密并不重要。一旦数据被加密，Alice 对该数据进行哈希。接下来，Alice
    使用她的私有签名密钥对数据进行签名。这创建了一个数字签名。然后，Alice 将加密的数据、其哈希值和签名发送给 Bob。首先，Bob 重新计算加密数据的哈希值。然后
    Bob 使用计算出的哈希值和公共签名密钥验证数字签名。这将告诉 Bob 签名是否有效。如果有效，Bob 可以确信并确定是 Alice 最初发送了该消息，因为该消息只能使用她的私有签名密钥进行签名，而只有
    Alice 知道该密钥。如果签名无效，则 Bob 不应信任该消息的来源和真实性。正如我们刚才提到的，数字签名签名基于 `RSA`。但使用 `RSA` 时，我们需要加密一些数据。你使用接收者的公钥加密数据，然后接收者使用他们的私钥解密。对于数字签名，签名和验证的过程则相反。当发送者签名消息时，他们使用自己的私钥，然后接收者使用发送者的公钥验证签名。正是因为我们用发送者的私钥进行了签名，接收者才能信任消息是由该发送者发送的，因为只有他们知道那个私钥。


    # 结论


    在本章中，我们了解了安全方面和密码学原理。目的是对密码学是什么、它如何在开发区块链时保障交易和区块数据安全有一个概念性的理解。具体技术在这里并不重要，重要的是概念。例如，本章使用
    `Microsoft DotNet` 和 `C#` 作为技术栈，展示了简单的方法如何利用现有库来生成哈希或保护数据。


