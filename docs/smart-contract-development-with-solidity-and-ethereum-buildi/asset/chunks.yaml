- raw: "16.  Moreover, by clicking on your select VM, you can monitor its hourly/daily\
    \ usage statistics, as shown in the following screenshot: \n\n     ![](images/Figure_3.1.17.jpg)\n\
    \n     **Figure 3.1.17**\n\nSee how easy it was to set up a VM on Azure with just\
    \ a few simple clicks. Now you do not have to depend upon any physical machine\
    \ to do your job.\n\n# [Step by step installation of tools and packages](#toc.xhtml#s51a)\n\
    \nAs described by me in the earlier section, let’s start with step by step installation\
    \ of other tools and packages:\n\n1.  Install Chrome browser - The very first\
    \ step is to install the Chrome browser. In case you already have Chrome browser,\
    \ open the browser and refer step 3, else download the Chrome browser: \n\n  \
    \  ![](images/Figure_3.1.18.jpg)\n\n    **Figure 3.1.18**\n\n2.  Read *Google*\
    \ terms and services and install them on the new machine that is just created.\
    \ \n\n    ![](images/Figure_3.1.19.jpg)\n\n    **Figure 3.1.19**\n\n3.  Now we\
    \ must install MetaMask, that is, a Chrome plugin that will help us in authentication\
    \ and testing. MetaMask is a tool that helps you to interact with the Ethereum\
    \ networks in your browser quickly. It uses infura.io. note that Metamask does\
    \ not support mining and contract deployments. \n\n     Download MetaMask from\
    \ GitHub from the following URL: *[https://github.com/MetaMask](https://github.com/MetaMask)*.\
    \ As shown in the following screenshot, choose the `metamask`\\-extension link\
    \ shown in `Pinned repositories` and click it:\n\n    ![](images/Figure_3.1.20.jpg)\n\
    \n    **Figure 3.1.20**\n\n4.  I have chosen the version `4.7.4;` you may see\
    \ the newest stable version when you try to download that. Download the Chrome\
    \ plugin by clicking on the link `metamask-chrome-4.7.4.zip`, as shown in the\
    \ following screenshot: \n\n    ![](images/Figure_3.1.21.jpg)\n\n    **Figure\
    \ 3.1.21**\n\n5.  Unzip the downloaded zip file to any location on the Windows:\
    \ \n\n    ![](images/Figure_3.1.22.jpg)\n\n    **Figure 3.1.22**\n\n6.  Now open\
    \ Chrome extension settings by typing following URL in Chrome: *chrome://extensions.*\
    \ Switch on the `Developer mode`, as shown in the following screenshot, and click\
    \ on `LOAD UNPACKED`, that is, to load the unzipped downloaded extensions: \n\n\
    \    ![](images/Figure_3.1.23.jpg)\n\n    **Figure 3.1.23**\n\n7.  Now navigate\
    \ to the folder where the MetaMask chrome extension was unzipped and choose that\
    \ root folder, as shown in the following screenshot: \n\n    ![](images/Figure_3.1.24.jpg)\n\
    \n    **Figure 3.1.24**\n\n8.  As soon as you click on `OK`, the extension would\
    \ be loaded in Chrome, and you’ll see the MetaMask home page that confirms the\
    \ extension is now part of the Chrome browser. You’ll see a fox icon at the top\
    \ right of chrome as an extension. Now you can go back to the Chrome extensions\
    \ page that we opened earlier and disable the `Developer mode` that we enabled\
    \ while loading the unpacked extension: \n\n    ![](images/Figure_3.1.25.jpg)\n\
    \n    **Figure 3.1.25**\n\n9.  Time to download *Visual Studio Code*, that is,\
    \ the IDE that helps us in development. VS Code is widely accepted, and a lightweight\
    \ free IDE provided by Microsoft for development. Navigate to the URL: **[https://code.visualstudio.com/](https://code.visualstudio.com/)**.\
    \ Download the latest stable build, as shown in the following screenshot: \n\n\
    \    ![](images/Figure_3.1.26.jpg)\n\n    **Figure 3.1.26**\n\n10.  Once the executable\
    \ is downloaded, click on the same to install that. Read the license agreement\
    \ and accept it and follow the instructions of the installation setup to get the\
    \ VS Code to install on your machine: \n\n     ![](images/Figure_3.1.27.jpg)\n\
    \n     **Figure 3.1.27**\n\n11.  Now its turn to download NPM. Navigate to the\
    \ URL - **[https://nodejs.org/en](https://nodejs.org/en)** and download the latest\
    \ released stable version that you see on the window. I am downloading an `8.11.2\
    \ LTS` version of NPM, as shown in the following screenshot: \n\n     ![](images/Figure_3.1.28.jpg)\n\
    \n     **Figure 3.1.28**\n\n12.  Click on the setup once it gets downloaded and\
    \ follows the steps. \n\n     ![](images/Figure_3.1.29.jpg)\n\n     **Figure 3.1.29**\n\
    \n13.  Keep all the settings as default and click on `Next` buttons till the setup\
    \ is installed successfully: \n\n     ![](images/Figure_3.1.30.jpg)\n\n     **Figure\
    \ 3.1.30**\n\n14.  Click on the `Finish` button once the setup is installed: \n\
    \n     ![](images/Figure_3.1.31.jpg)\n\n     **Figure 3.1.31**\n\n15.  Now, as\
    \ discussed earlier in this section that we need one more package manager. Let’s\
    \ install that as well, that is, `Chocolatey`. It could be installed using `PowerShell`\
    \ commands, and we get the commands/scripts on the URL: **[https://chocolatey.org/](https://chocolatey.org/)**.\
    \ Go to the website and click on the `Install Chocolatey Now` button, as shown\
    \ in the following screenshot: \n\n     ![](images/Figure_3.1.32.jpg)\n\n    \
    \ **Figure 3.1.32**\n\n16.  On the page where you land up, scroll down to the\
    \ section where you see subheading as `Install with PowerShell.exe`. Copy the\
    \ script, as shown in the red box in the following screenshot. The script would\
    \ be: \n\n     `Set-ExecutionPolicy Bypass -Scope Process -Force; iex ((New-Object\
    \ System.Net.WebClient).DownloadString('https://chocolatey.org/install.ps1'))”`\n\
    \n     ![](images/Figure_3.1.33.jpg)\n\n     **Figure 3.1.33**\n\n17.  Now open\
    \ the PowerShell window from your windows start menu as shown below and click\
    \ on `Run as administrator` to launch the PowerShell command prompt: \n\n    \
    \ ![](images/Figure_3.1.34.jpg)\n\n     **Figure 3.1.34**\n\n18.  The command\
    \ prompt would look like, as shown in the following screenshot: \n\n     ![](images/Figure_3.1.35.jpg)\n\
    \n     **Figure 3.1.35**\n\n19.  Now paste the copied script to the command prompt\
    \ and press *Enter*. \n\n     ![](images/Figure_3.1.36.jpg)\n\n     **Figure 3.1.36**\n\
    \n20.  Once Chocolatey commands and NuGet packages are in place, we’ll install\
    \ GitHub client using the install command of Chocolatey; this installs other useful\
    \ tools that would be used during development. \n\n     So, type command: `choco`\
    \ install git -params `“/GitAndUnixToolsOnPath”` in the command prompt as shown\
    \ in the following screenshot and press *Enter*.\n\n     ![](images/Figure_3.1.37.jpg)\n\
    \n     **Figure 3.1.37**\n\n21.  The installer on command prompt will ask to run\
    \ the script for allowing Global Configuration. You can type *Y* for yes and press\
    \ *Enter* to allow it. \n\n     ![](images/Figure_3.1.38.jpg)\n\n     **Figure\
    \ 3.1.38**\n\n22.  Now close and re-open the power shell window to ensure everything\
    \ is installed correctly. \n\n     ![](images/Figure_3.1.39.jpg)\n\n     **Figure\
    \ 3.1.39**\n\n23.  Let’s now execute some commands as follows,  \n\n     *   Turn\
    \ of all calls secure feature in Git: git `config –system http.sslverify false`\n\
    \n         ![](images/Figure_3.1.40.jpg)\n\n         **Figure 3.1.40**\n\n   \
    \  *   Install node addon build tool via NPM: `npm install -g node-gyp`\n\n  \
    \       ![](images/Figure_3.1.41.jpg)\n\n         **Figure 3.1.41**\n\n     *\
    \   Install windows build tools: `npm install --global --production windows-build-tools`\n\
    \n         ![](images/Figure_3.1.42.jpg)\n\n         **Figure 3.1.42**\n\n   \
    \  *   Installing windows build tools will take some time, so be patient and,\
    \ in the meanwhile, have something to eat if you like \U0001F60A. \n\n       \
    \  ![](images/Figure_3.1.43.jpg)\n\n         **Figure 3.1.43**\n\n24.  Install\
    \ Test RPC that is the local Ethereum server for testing our solution: `npm install\
    \ -g ethereumjs-testrpc`\n\n     ![](images/Figure_3.1.44.jpg)\n\n     **Figure\
    \ 3.1.44**\n\n25.  Lastly, we install the Truffle toolset: `npm install -g truffle`\n\
    \n     ![](images/Figure_3.1.45.jpg)\n\n     **Figure 3.1.45**\n\nNow we are good\
    \ to start our development as our tools and software are well in place, and our\
    \ development machine on Azure is up and running. Yes, it was a lot of work to\
