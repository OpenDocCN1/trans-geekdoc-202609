    # 在本章中，我们学习了如何设置开发环境以开始开发。我们接触了各种包，如 NPM 和 Chocolatey，它们帮助我们安装了更多工具。我们安装了 VS Code、MetaMask，它们将为我们提供编码环境。在下一章中，我们将专注于智能合约和开发。*干杯！*


    # 问题


    1.  什么是 Chocolatey？


    2.  用于编译智能合约的构建工具有哪些？


    3.  Test RPC 和 Truffle 是如何工作的？


    4.  什么是 MetaMask？


    5.  MetaMask 使用什么节点？


    6.  MetaMask 有哪些局限性？


    # 第 2 章：智能合约编程


    从许多方面来看，制作智能合约与您可能已经习惯的做法非常相似。您首先用一种支持的语言编写代码。这将根据您正在为之工作的区块链实现而有所不同。在本章中，我们将使用一种名为
    `Solidity` 的语言，它受以太坊支持，并且目前在比特币区块链上也正获得支持。另一个当前的选择是编写 Serpent 代码，它也获得了一些以太坊社区的支持。编写代码后，必须将其编译为字节码。有几种编译器可用。甚至还有在线编译器可以让您快速上手。在本节中，我们将使用一个用于处理智能合约的框架，称为
    `Truffle`。Truffle 拥有一个内置编译器，非常容易上手。编译成功完成后，我们上传合约并等待其被挖掘。合约成功被挖掘后，我们就可以开始与其交互。在大多数情况下，您会为合约创建一个用户界面，但您也可以通过
    `HTTP POST` 操作直接与其交互。


    在上一章智能合约开发中，我们在开始编码或开发第一个智能合约之前，学习了设置开发环境。我们安装了开发所需的必要包和工具。在本节中，我们将探索 Solidity
    并开发我们的第一个 `Hello World` 智能合约。


    ![](img/Figure_3.2.1.jpg)


    **图片来源：** [`pixabay.com`](https://pixabay.com)


    **图 3.2.1**


    ## 结构


    在本章中，我们将讨论以下主题：


    *   智能合约

    *   字节码

    *   EVM

    *   智能合约与 Solidity

    *   Truffle 与 Test RPC

    *   智能合约开发

    *   智能合约部署

    *   测试智能合约


    ## 目标


    学习完本单元后，您应该能够：


    *   开发您的基本智能合约。

    *   学习 Solidity 的基础知识。

    *   测试智能合约。

    *   部署智能合约。


    ## 基础构建块 - 智能合约


    智能合约是软件程序，一旦合约中指定的任何金额已转账至以太币，它们就会自动运行。因此，不需要（手动）验证付款收据，因为转账会按照程序规定直接启动。


    整个区块链存储每一笔交易——在所有连接到网络的设备上。区块链的去中心化概念会永久检查整个数据库的完整性。


    ## 字节码


    智能合约通常用 Solidity 编写，这是一种专门为以太坊开发的高级编程语言。然后将它们翻译成字节码并在 `以太坊虚拟机 (EVM)` 上运行。虚拟机将客户端环境与主机环境（即计算机上的其他应用程序）隔离开来。


    这非常类似于 `Java` 等编程语言，其中代码被转换为 JVM 字节码。以太坊运行时环境只能理解并执行字节码。


    这种设计赋予了开发者自由，可以利用其他编程语言来创建智能合约。其中之一是 Vyper，它非常类似于 Python，并编译为 EVM 字节码。


    ## EVM


    EVM 是一个简单但强大的、图灵完备的 256 位虚拟机，允许任何人执行任意 EVM 字节码。EVM 在以太坊的共识引擎中发挥着重要作用，也是以太坊协议的一部分。它允许任何人在一个无需信任的环境中执行任意代码，在该环境中执行结果可以得到保证，且完全是确定性的。


    ## 智能合约与 Solidity


    开发智能合约无非就是用区块链实现所支持的语言编写代码，我们需要为其开发智能合约。例如，以太坊支持名为 `Solidity` 的语言。代码编写完成后需要编译为字节码。有许多编译器可用，也有少数在线编译器。在本节中，我们将使用
    Solidity 编写代码，并使用上一节安装的名为 `Truffle` 的框架。Truffle 为我们提供了一个内置编译器来编译智能合约。编译成功后，智能合约需要被上传/部署并挖掘。一旦成功挖掘，就可以开始与其交互。交互可以通过合约的用户界面完成，也可以直接通过
    `HTTP POST` 方法操作完成。Solidity 为我们提供了遵循面向对象原则编写代码的灵活性。它是一种非常类似于 `JavaScript` 风格的语言。


    ![](img/Figure_3.2.2.jpg)


    **图 3.2.2**


    来自面向对象编程语言背景的开发者可以快速掌握 Solidity 及其语法。Solidity 支持标准继承和多重继承，其数据类型和编码结构与任何其他面向对象语言非常相似。例如
    `bool` 是支持布尔数据类型的关键字，可以保存 true 或 false 作为值。字符串像往常一样使用双引号，但只有最少的字符串操作能力，这与我们在 `C#`、`JavaScript`
    或 `Java` 等其他语言中发现的不同。Solidity 拥有有符号和无符号整数，范围从 8 位到 256 位。Solidity 使用的基本类型之一是地址类型。它用于存储以太坊中用于账户或智能合约的地址。Solidity
    支持访问修饰符，如 `public`、`private`、`internal` 或 `external`。访问修饰符有助于为代码提供抽象，并更好地控制谁可以从何处访问代码。如果需要从任何地方访问，则使用
    `Public`。如果代码需要在合约内部访问，则使用 `Private`。`Internal` 意味着合约及其派生合约，即子类型，可以使用该代码，即方法和属性。使用
    `external` 只允许从外部使用合约方法和属性，且子类型无法访问这些，这与 internal 不同。


    Solidity 中的合约由 contract 关键字和我们选择的合约名称定义。这非常类似于在任何编程语言中编写类。合约定义后，可以拥有方法和变量。要记住的重要事情之一是，我们可以在
    Solidity 的方法中拥有多个返回类型。


    ## Truffle 与 Test RPC


