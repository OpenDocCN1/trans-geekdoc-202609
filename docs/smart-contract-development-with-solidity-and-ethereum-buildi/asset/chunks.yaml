    以下是来自 MSDN 博客的描述：


    > 从最基本的层面来理解，区块链是一种分布式数据库的简单方法。它是一个无中央机构管理数据流的点对点系统。在维护数据完整性的同时移除中央控制的关键方法之一，是拥有一个由独立用户组成的大规模分布式网络。您可以将区块链视为由一群人控制的分布式数据库，用于存储和共享信息。目前最流行的区块链实现形式是
    `Bitcoin`，它是一种加密货币。

    >

    > 区块链是一种数据结构，它使得创建数字账本并将其在独立参与方的网络中共享成为可能。区块链主要分为三大类：公有链、私有链（许可链）和联盟链。每种类型都利用密码学，允许给定网络上的每个参与者在无需中央权威强制执行规则的情况下安全地管理账本。从数据库结构中移除中央权威，是区块链最重要且最具影响力的特性之一。


    将其想象为一台大型的全球计算机，每个人都可以安全地访问数据并执行交易代码。所有交易都存储在数据区块中。这些区块的生成方式使得它们一旦存储在区块链中，就极难被篡改或伪造。基于区块链的本质，您可以认为它提供了一种在无信任场景下可靠存储数据的方式。这可能是互联网上陌生人之间的货币交易，也可能是以只有您授权的人才能访问的方式安全地存储您的医疗信息。还值得一提的是，区块链通常不是存储每笔交易大量数据的地方。例如，您通常不会在区块链上存储图片，但可能会存储用于验证图片是否被篡改的信息。区块链上存储的大多数数据侧重于交易和对象的状态，而非对象本身。


