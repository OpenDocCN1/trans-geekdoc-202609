- raw: "6.  Step `4` is `Ethereum Settings` and is very important. Provide the `Consortium\
    \ Member Id` as 0 and leave `Network ID` as it is to what is already selected.\
    \ The network id serves as the name of the Ethereum network that we will set up.\
    \ It means only the nodes that have the same network id can pair with each other.\
    \ You can provide the custom genesis block here, it would be useful if you want\
    \ to use an existing account for the settings, but for now, we stick to default\
    \ and proceed to provide `Ethereum account password.` Provide the password, confirm\
    \ it, and save it somewhere so that you remember. You need to provide the passphrase\
    \ to generate the private key. Provide the passphrase of your choice and confirm\
    \ that as well, like done for passwords: \n\n    ![](images/Figure_2.2.11.jpg)\n\
    \n    **Figure 2.2.11**\n\n7.  In step `5`, choose the `OMS Workspace Location`\
    \ as per your nearest location. I choose `Central India` here: \n\n    ![](images/Figure_2.2.12.jpg)\n\
    \n    **Figure 2.2.12**\n\n8.  In step `6`, you’ll see the summary of what we\
    \ chose and selected. Review everything, and Click `OK` to go to the `Buy` section.\
    \ \n\n    ![](images/Figure_2.2.13.jpg)\n\n    **Figure 2.2.13**\n\n9.  Step `7`\
    \ is the `Buy` option section, where you read all the terms and conditions before\
    \ you make a purchase and then click on `Create`: \n\n    ![](images/Figure_2.2.14.jpg)\n\
    \n    **Figure 2.2.14**\n\n10.  After you click on `Create`, it will take some\
    \ time to set up and create the resources. It says something like `Submitting\
    \ deployment for Ethereum Proof-of-Work…`wait for a while, and it would be fine.\
    \ \n\n     ![](images/Figure_2.2.15.jpg)\n\n     **Figure 2.2.15**\n\n11.  Once\
    \ the deployment is done, you can navigate to `Resource groups`, as shown in the\
    \ below screenshot, and choose your newly created resource with the resource group\
    \ name you provided: \n\n     ![](images/Figure_2.2.16.jpg)\n\n     **Figure 2.2.16**\n\
    \n12.  Clicking on the `Resource groups` will land you to all the resources created\
    \ for the consortium, as shown in the below screenshot. Now click on `Deployments`\
    \ in the left sidebar to see all the deployments made: \n\n     ![](images/Figure_2.2.17.jpg)\n\
    \n     **Figure 2.2.17**\n\n13.  You’ll be redirected to the section where you’ll\
    \ see all the deployments made. \n\n     ![](images/Figure_2.2.18.jpg)\n\n   \
    \  **Figure 2.2.18**\n\n14.  Select the first link that is Microsoft-azure-blockchain\
    \ to find all the information about the newly created blockchain. \n\n     ![](images/Figure_2.2.19.jpg)\n\
    \n     **Figure 2.2.19**\n\n15.  You’ll get to see the page for sections like\
    \ `Overview, Outputs, Inputs,` and Template, as shown in the following screenshot:\
    \ \n\n     ![](images/Figure_2.2.20.jpg)\n\n     **Figure 2.2.20**\n\n16.  Choose\
    \ `Outputs`, and you’ll get all the information you need to connect to the chain.\
    \ Copy the address of `ADMIN-SITE` and open the same in the browser, as shown\
    \ in the following screenshot: \n\n     ![](images/Figure_2.2.21.jpg)\n\n    \
    \ **Figure 2.2.21**\n\n17.  The admin site would be opened in the browser and\
    \ would look like below. On this page, you see the information about blockchain.\
    \ Azure has created a genesis block for us with the default account showing as\
    \ `My Account Address` on the page. We see that we also have some Ether balance\
    \ in our account to get started with our blockchain. \n\n     ![](images/Figure_2.2.22.jpg)\n\
    \n     **Figure 2.2.22**\n\nHalf of the job is done, and we have successfully\
    \ set up an account on Azure for Ethereum blockchain.\n\n![](images/Figure_2.2.23.jpg)\n\
    \n**Figure 2.2.23**\n\n# [Set up a second account with MetaMask](#toc.xhtml#s42a)\n\
    \nFollowing are the steps to set up the second account with MetaMask:\n\n1.  To\
    \ set up the second account to transfer some Ether to it, copy the `ETHEREUM-RPC-ENDPOINT`\
    \ address, as shown in the following screenshot, from the same location where\
    \ we copied the `ADMIN-SITE` address on Azure. \n\n    ![](images/Figure_2.2.24.jpg)\n\
    \n    **Figure 2.2.24**\n\n2.  Now go to chrome extensions and search for `MetaMask`\
    \ in the chrome web store. It is an extension to chrome so that it could be easily\
    \ added to chrome by clicking on `ADD TO CHROME` button. MetaMask is a useful\
    \ wallet application for development and testing purposes: \n\n    ![](images/Figure_2.2.25.jpg)\n\
    \n    **Figure 2.2.25**\n\n3.  Once added to chrome, you’ll see the MetaMask icon\
    \ in the upper right corner of the chrome browser. This indicates that MetaMask\
    \ is added to chrome. Click on that icon and click on the `Accept` button after\
    \ reading the terms and conditions. \n\n    ![](images/Figure_2.2.26.jpg)\n\n\
    \    **Figure 2.2.26**\n\n4.  After you click on `Accept`, you’ll be redirected\
    \ to create an account with MetaMask. Provide the password as shown in the following\
    \ screenshot and click on `CREATE`: \n\n    ![](images/Figure_2.2.27.jpg)\n\n\
    \    **Figure 2.2.27**\n\n5.  After creating the password, you’ll be shown a unique\
    \ account image that you’ll see each time you make a transaction. Click `NEXT`:\
    \ \n\n    ![](images/Figure_2.2.28.jpg)\n\n    **Figure 2.2.28**\n\n6.  On the\
    \ next page, you’ll see the terms and conditions. Read those carefully and click\
    \ `ACCEPT` if you wish to proceed, as shown in the following screenshot: \n\n\
    \    ![](images/Figure_2.2.29.jpg)\n\n    **Figure 2.2.29**\n\n7.  After you accept\
    \ the terms and conditions, you’ll be shown the `Secret Backup Phrase`, as shown\
    \ in the following screenshot used for restoring and backing up your account.\
    \ Better to save these codes somewhere safe where only you can access. Click on\
    \ `CLICK HERE TO REVEAL SECRET WORDS` to get the phrase: \n\n    ![](images/Figure_2.2.30.jpg)\n\
    \n    **Figure 2.2.30**\n\n8.  On the next page, you need to verify your phrase.\
    \ So, select the words in the same order as the phrase was initially on that page:\
    \ \n\n    ![](images/Figure_2.2.31.jpg)\n\n    **Figure 2.2.31**\n\n9.  Choose\
    \ a test network of your choice, as shown in the following screenshot: \n\n  \
    \  ![](images/Figure_2.2.32.jpg)\n\n    **Figure 2.2.32**\n\n10.  Now, under the\
    \ `Settings` tab, paste the URL that we copied from the Azure portal in the `New\
    \ RPC URL` text box: \n\n     ![](images/Figure_2.2.33.jpg)\n\n     **Figure 2.2.33**\n\
    \n11.  Return to chrome MetaMask extension, and we see our newly created account\
    \ here now, as shown below. Copy the account address, as shown in the following\
    \ screenshot: \n\n     ![](images/Figure_2.2.34.jpg)\n\n     **Figure 2.2.34**\n\
    \n12.  Go to the admin page we opened in another tab and paste the copied address\
    \ of MetaMask *Account 1* in the `Address of Recipient` box, as shown in the following\
    \ screenshot: \n\n     ![](images/Figure_2.2.35.jpg)\n\n     **Figure 2.2.35**\n\
    \n13.  Add some Ether `Amount` to be sent to the recipient, example, 1000 and\
    \ click on `SUBMIT`: \n\n     ![](images/Figure_2.2.36.jpg)\n\n     **Figure 2.2.36**\n\
    \n14.  Once submitted, you’ll see the message `Ether sent!`\n\n     ![](images/Figure_2.2.37.jpg)\n\
    \n     **Figure 2.2.37**\n\n15.  But were they sent? We can quickly check this\
    \ by again going back to our chrome extension and click on Fox icon. `Congratulations`!!\
    \ we see the `1000 ETH` transferred to this account now: \n\n     ![](images/Figure_2.2.38.jpg)\n\
    \n     **Figure 2.2.38**\n\nHence, we successfully transferred Ethers from one\
    \ account to another using our Azure blockchain consortium. We can now develop\
    \ smart contracts for our blockchain. I’ll cover smart contracts and other related\
    \ topics in the upcoming sections.\n\n# [Conclusion](#toc.xhtml#s43a)\n\nIn this\
    \ chapter, we learned how to set up an Ethereum blockchain on Azure and use MetaMask\
    \ to test our blockchain by transferring some Ethers to another account. The next\
    \ section will focus on smart contracts and how to set up a development environment\
    \ for writing smart contracts.\n\n![](images/Figure_2.2.39.jpg)\n\n**Figure 2.2.39**\n\
    \n# [Questions](#toc.xhtml#s44a)\n\n1.  What is Azure?\n\n2.  What is the Ethereum\
    \ proof-of-work consortium?\n\n3.  What is a Resource group on Azure?\n\n4.  What\
    \ is MetaMask?\n\n5.  What node does MetaMask use?\n\n6.  Explain proof-of-work\
    \ in a simple way.\n\n# [Section - III](#toc.xhtml#p03)"
