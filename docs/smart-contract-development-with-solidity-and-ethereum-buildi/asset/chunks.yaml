- raw: 'Another way of thinking of a hash function is that of creating a unique fingerprint
    of a piece of data. Generating a hash digest of a block of data is very easy to
    do in *C#*. There are various algorithms you can use, such as *MD5, SHA-1, SHA-256,*
    and *SHA-512*. A hash function is a one-way function. That means that once you''ve
    hashed in data, you cannot reverse it back to the original data. On the flip side
    to this, encryption is designed to be a two-way operation. Once you''ve encrypted
    some data using a key, you can then reverse your operation and decrypt the data
    by using the same key.


    ![](images/Figure_1.2.3.jpg)


    **Figure 1.2.3**


    When you''re hashing data, the hash will be the same every time you operate, unless
    the original data changes in some way. Even if the data only changes by one bit,
    the resulting hash code will be completely different. This makes hashing the perfect
    mechanism for checking the integrity of data. This is useful when you want to
    send data across a network to another recipient. Before sending the data, you
    calculate the hash of the original data to get its unique fingerprints. You then
    send the data and the hash to the recipient. They then recalculate the hash of
    the original data they have just received and then compare it to the hash that
    you sent. If the hash codes are the same, then the data has been successfully
    received without any data loss or corruption. If the hash codes do not match,
    then the data received is not the same as the data initially sent, and you shouldn''t
    trust that data. The two most common hashing methods used are *MD5* and the *SHA*
    family of hashes, *SHA-1, SHA-256,* and *SHA-512*. *MD5* is generally not used
    much these days for new software, but it is still relevant if you are integrating
    with older systems that still use MD5 hashes. For this chapter, we''ll focus just
    on *SHA*.


    # [SHA](#toc.xhtml#s20a)


    The SHA family is a family of cryptographic hash functions published by the *National
    Institute of Standards and Technologies (NIST).* The SHA family covers some different
    variants, including SHA-1, which is a 160-bit hash function that resembles the
    early *MD5* algorithm. This was designed by the *National Security Agency* to
    be part of the digital signature algorithm. Cryptographic weaknesses were discovered
    in *SHA-1*, and this standard was no longer approved for most cryptographic uses
    after *2010*. Next, we have *SHA-2*, which is a family of 2 similar hash functions
    with different block sizes known as *SHA-256* and *SHA-512.* They differ in word
    sizes. *SHA-256* uses 32-bit words, whereas SHA-512 uses 64-bit words. These versions
    of the SHA algorithm were also designed by the National Security Agency. Finally,
    we have *SHA-3*, which is a hash function formally called `Keccak`, chosen in
    2012 after a public competition amongst Non-National Security Agency designers.
    It supports the same hash lengths as *SHA-2*, and its internal structure differs
    significantly from the rest of the *SHA* family. Implementing secure hashes into
    your applications is a very straightforward process.


    The *.NET* framework provides cryptography-related functionality encapsulated
    in `System.Security.Cryptography` namespace and its classes. The `HashAlgorithm`
    class is the base class for hash algorithms, including *MD5, RIPEMD-160, SHA-1,
    SHA-256, SHA-384*, and *SHA512.*


    The `ComputeHash` method of `HashAlgorithm` computes a hash. It takes a byte array
    or stream as an input and returns a hash in the form of a byte array of 256 bits.


    Following is the code of simple console application in C# showing how to compute
    SHA hash.


    `using System;`


    `using System.Text;`


    `using System.Security.Cryptography;`


    `namespace Cryptography`


    `{`


    `class Program`


    `{`


    `static void Main(string[] args)`


    `{`


    `string input = "Blockchain";`


    `Console.WriteLine("Raw data: {0}", input);`


    `string hashedData = ComputeSha256Hash(input);`


    `Console.WriteLine("Hash {0}", hashedData);`


    `Console.WriteLine(ComputeSha256Hash("Blockchain"));`


    `Console.ReadLine();`


    `}`


    `static string ComputeSha256Hash(string rawData)`


    `{`


    `// Create a SHA256`


    `using (SHA256 sha256Hash = SHA256.Create())`


    `{`


    `// ComputeHash - returns byte array`


    `byte[] bytes = sha256Hash.ComputeHash(Encoding.UTF8.GetBytes(rawData));`


    `// Convert byte array to a string`


    `StringBuilder builder = new StringBuilder();`


    `for (int i = 0; i < bytes.Length; i++)`


    `{`


