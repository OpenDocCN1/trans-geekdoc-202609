- raw: 'Now that we have investigated blockchain as a general term let''s start to
    consider the implementations of it. First, blockchains can be either public or
    private. In a public blockchain, everyone with an Internet connection can connect
    to the chain. The way the public chains are funded is that you generally need
    to pay for storage, transaction, and execution costs to the entities that have
    joined the chain. This can be quite expensive. Just imagine the Bitcoin going
    from only being worth a couple of cents to over $1000 only a few years later.
    You might regret paying *1%* of a Bitcoin for your transactions back in 2013;
    however, as soon as the different currencies that are being used stabilize, this
    will be less of a problem. Since the public blockchains are generally widely distributed,
    there''s also no given point for attack for a hacker. They cannot target a single
    datacentre or company to bring down the chain. But this depends on how well the
    chain is supported by the community. As soon as the community support is gone,
    the chain is also gone. This raises a lot of questions and concerns that we don''t
    have any right answers to yet, but I''m sure that over the next couple of years,
    we''ll get more research and a better understanding of how these communities work.
    One of the most significant benefits and a challenge of a public blockchain in
    a business context is that it is democratic. The community must decide how, for
    example, forks are being handled, and generally, your stake in the chain controls
    how many volts you have. When looking at private blockchain, many consider these
    not to be real blockchains as they are not truly distributed and democratic.


    With a private blockchain, you are closer to a traditional database. Some people
    call private blockchains for shared distributed databases. Since you will own
    the infrastructure, you can also control the cost and financing of the chain.
    This might be both a benefit and a challenge depending on the company goals you
    have. You''re also dealing with known entities, and you are in control of who
    can access your chain. For a lot of companies dealing with sensitive data, it''s
    required by law in many countries that the data is stored in a specific area.
    Since we have much more control with a private blockchain, it can be an excellent
    way for companies to transition to the technology, while legislation and usage
    patterns evolve. You are, however, losing out on a few critical areas, and there
    are also fewer points of attack, so your private blockchain might be easier to
    take down than a public and highly distributed implementation.


    # [Blockchain - Behind the scenes](#toc.xhtml#s12a)


    `So how does it all work?` It begins with someone doing a single or a group of
    transactions. A transaction is typically sending data in the form of a contract.
    Depending on the blockchain implementation you are using, it can also involve
    cryptocurrency being sent from one account to another. The transactions are sent
    to an extensive peer-to-peer network of computers. These are generally distributed
    all over the world. Each computer is called a node, and they all have a copy of
    the existing data. Then the transaction is executed and validated based on pre-shared
    contracts and scripts. This ensures that all nodes execute using the same set
    of rules. When the transaction has executed, the result is added to the blockchain.
    Since this is done at each node, you would have to compromise every node in the
    chain to compromise the transaction.


    When doing transactions in the blockchain, some aspects are necessary for it to
    have the characteristics previously mentioned. First, all transactions are atomic.
    This means that the full operation run or nothing at all. Let''s say you have
    a monetary transaction. You would want to ensure that both the function that credits
    one account and a function that debits another are executed successfully. If one
    of them fails, the entire transaction should fail. If not, you might end up either
    destroying or creating money. However, unfortunately, even with blockchain, there''s
    nothing that prevents you from writing harmful code, so you still need to ensure
    that you execute transactions in the right order. Secondly, transactions run independently
    of each other. So, no two operations can interact or interfere with each other.
    It must be inspectable. Every single method call that comes to blockchain comes
    with the actual address to the caller.


    Just think about it. This gives a unique possibility for securing and auditing
    solutions on a very, very wide scale. This is unique to blockchain. At least I''m
    not aware of anywhere else you can do this. Blockchain objects are immortal. That
    means that all data from an object are permanent. The code for an object can never
    be changed, and you can never delete an object externally. The only way to remove
    an object from the blockchain is that if it is programmed to remove itself. So,
    think about it. When writing code for the blockchain, you, really, really need
    to make sure that this is what you want to do. Because you never alter or remove
    it.


    # [Transactions and blocks](#toc.xhtml#s13a)


    At the center of the blockchain, we have a record of transactions, much like a
    traditional accounting ledger. These transactions could be a movement of money
    between people or companies, or it could be any piece of information that is transactional,
    like the transferring of property deeds or the tracking of movement of inventory
    between different companies. Data stored in a blockchain is designed to be kept
    in a way that makes it virtually impossible to change the data once it is in the
    blockchain without being detected by other users. As we discussed earlier, traditional
    banking transactions are verified by a central bank or authority. Blockchain applications
    could replace these more centralized systems with these centralized ones where
    verification comes from the consensus of multiple users participating in the blockchain.


    A blockchain must do two main things. It needs to gather data or transactions
    together and put them in blocks. Then those block needs to be chained together
    securely using cryptography. When the transactions are put onto the block, we
    use cryptographic hashing or digital fingerprinting to link the transactions together.
    This means that if any part of the transaction changes, the entire block will
    fail verification, which will flag it to the other users. At the top of the block,
    we have a hash that represents all the transactions in that block. Let’s call
    this the block address. It''s these block addresses that we use to chain the blocks
    together because each block knows who his previous block address is, which is
    how we form the chain.'
