- raw: 'For a block to be entered in the chain, the person creating the block must
    solve a complex mathematical puzzle when calculating the block address. This is
    called mining the block with proof-of-work. The puzzle was designed to be computationally
    expensive and must happen before each block in the chain. Let''s say this problem
    takes 10 minutes to calculate. Now imagine we have 1000 blocks in our chain. So,
    the total time spent calculating all the block addresses is 166 hours. Now imagine
    someone wants to overwrite the data in the first block. They must recalculate
    that block''s mining puzzle, which takes 10 minutes. But because all the other
    blocks are cryptographically linked, if you change a block, then you need to recalculate
    the hashes and addresses for the next block and so on and so on. So, to change
    data in block 1 means that you need to spend 166 hours or nearly 7 days recalculating
    the whole chain. Just imagine how long we are talking if the chain is long and
    the puzzle takes longer than 10 minutes. The longer the chain, the more secure
    it is. When these blocks are added to the chain, a copy is sent to everyone participating
    in the network. This is how we establish trust because so many people have a copy.
    Let''s say 100 people have copies of the whole chain, and someone tries to change
    one of the blocks. They might add this into their chain, but there will 99 other
    people who do not agree with their change. Now don''t worry too much if you don''t
    completely understand all this now. We are going to explore this in much more
    detail in upcoming chapters.


    # [Securing your data](#toc.xhtml#s14a)


    Data stored in the blockchain is generally available to everyone that has access
    to the chain. This gives some challenges, but it will also lead you to think about
    security first. In some applications, it''s no problem that everyone has access
    to everything, but in most cases, you want to assure that you control who has
    your data. There are two ways to handle this. The first is `obfuscation`. This
    means to make the data relevant only to those who know its meaning. One example
    of this is with Bitcoins. With the address of any account, it''s a long string
    of letters and numbers. No one in the chain knows who the address is physically
    connected to, and they don''t need to know, but everyone knows every transaction
    going between the different account addresses. It''s up to you if you want to
    be anonymous or not. If you don''t share a connection to your account address,
    there''s no way for anyone to know that you are the owner of the account.


    Another example of obfuscation is to have the data contain IDs and status codes.
    Unless you know what the different IDs are connected to, the data is really of
    no use to you. The problem with relying only on obfuscation is that you always
    run the risk of someone making the connections due to a breach in the system controlling
    the keys and connect the data. To deal with this, you can make use of encryption.
    When you encrypt a message or the transaction payload, you apply a two-way algorithm
    to the message in a way that can only be decoded if you know a password or a passphrase.
    This means that the data can be available to everyone, but only those who have
    the keys to decrypt the message can make sense of it. There are many different
    encryption algorithms, and as with hashing, they are continuously evolving. The
    next section of the book will focus on those.


    # [Conclusion](#toc.xhtml#s15a)


    In this chapter, we studied the basics of blockchain and what it is. The section
    focussed around hashing and why it''s essential for understanding how a blockchain
    works. After that, we started to understand how a block is built and how it is
    connected to a chain. Security is an especially important aspect to consider,
    so the basics of obfuscation and encryption were explained to give an idea of
    what it is all about. The section explained the difference between public and
    private blockchain implementations.


    Now that the basics are clear, we’ll raise a bar a bit high and deep dive into
    security. In the next chapter, we will study about hashing techniques used in
    blockchain and learn about digital signatures.


