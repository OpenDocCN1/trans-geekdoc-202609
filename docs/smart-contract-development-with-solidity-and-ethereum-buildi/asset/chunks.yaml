    # [Hashing](#toc.xhtml#s19a)


    The process of hashing data is a fundamental technique using cryptography, and
    it forms a backbone of what we''re going to look at regarding building up our
    blockchain implementation. A cryptographic hash function is an algorithm that
    takes an arbitrary block of data and returns a fixed-size string, the cryptographic
    hash value, such that any accidents or intentional change to that data will change
    the hash value. The data to be encoded is often called the `message`, and the
    hash value is also sometimes called the `message digest`, or only the digest.


    The ideal cryptographic hash function has four main properties. First, it must
    be easy to compute the hash value for any given message. This means that with
    any block of data, it should be easy to run a hashing function to calculate the
    hash. Next, it should be infeasible to generate a message that has a given hash.
    This means it should be infeasible to generate some original data that will result
    in a predetermined hash code or digest. Next, it should be infeasible to modify
    a message without changing the hash. This means if you change just a single bit
    in the data that you want to hash, then the resulting hash code is entirely different.
    And finally, it should be infeasible to find two different messages with the same
    hash. This means you''ve got two different blocks of data that you want to create
    a hash code for. They should not both end up with the same final hash code. This
    is referred to as a `hash collision.`


    ![](images/Figure_1.2.2.jpg)


    **Image source:** [https://commons.wikimedia.org/wiki/File:Hash\_function.svg](https://commons.wikimedia.org/wiki/File:Hash_function.svg)


