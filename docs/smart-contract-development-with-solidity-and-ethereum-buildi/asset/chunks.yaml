    # 第 1 章


    # 区块链——概念与起源


    ## 遗留问题与弊端


    利用 `Napster`（1999 年的一个文件共享网络）传输/共享音频文件变得非常容易。由于它使用中心化目录网络，因此被称为混合点对点网络。使用该基础设施的用户可以灵活地保留共享文件的副本。因此，单一数字资产的保留导致无限数量的副本存储在全球网络上。


    2008 年初，由于知名支付系统发生数据泄露，数百万信用卡号码被曝光，导致欺诈性交易。这些事件描述了生活在依赖中介的数字世界中的直接危险：中介从交易中获利，却让人们面临数字剥削、欺诈和贪婪。


    迫切需要创建一个无中介、可自由可靠地传输数字资产的数字基础设施。该基础设施要求安全，传输应为点对点而非共享或复制，以便建立信任，且不应有任何中央管理机构。


    ## 结构


    在本章中，我们将讨论以下主题：


    *   区块链的起源。

    *   基本区块链概念与术语。

    *   区块链的特征。

    *   数据安全层面。

    *   区块链如何工作。


    ## 目标


    学习完本单元后，您应该能够：


    *   理解区块链和比特币的基础知识

    *   安全性在区块链中的作用。

    *   交易概念及区块链内部工作原理


    ## 比特币区块链——起源


    `2009 年 1 月 3 日`，约 50 枚数字硬币通过一种新型基础设施被挖出，该设施不仅挖掘硬币，还将其记录在一个无法篡改且在互联网去中心化点对点网络上复制的公共账本上。这
    50 枚数字硬币被命名为比特币，并被登记为创世区块，即被称为 `Bitcoin blockchain` 的第一个确立实例。使该基础设施独一无二的关键一点是：由区块链驱动的加密货币没有像银行和其他金融机构那样的中心化治理和信任机构来验证交易。区块链不依赖中介；这使得在互联网上全球传输数字资产成为可能，且无需中间人参与。


    术语 `blockchain` 不仅限于比特币，而是普遍适用于所有加密货币。区块链中的数据采用现代加密技术进行加密，这使其更加可靠且防篡改。由于它在组成点对点网络的每个节点上都有复制，因此不存在单点故障，这使得该技术更加值得信赖且高可用。


    自推出以来，比特币技术迅速成熟，因此其实现细节存在巨大差异，使得区块链的研究变得广泛、复杂且动态。自创世以来，区块链变得更加成熟，能够更智能、更快速地工作。随着其扩展，它不断被完善和优化。一些区块链（如
    `Ethereum`）还支持智能合约，即允许在区块链上编写脚本。因此，您可以在区块链节点上应用自定义约束。因此，超越局限性，区块链技术已被证明是一种新型的防黑客、可编程存储技术。


    ## 概念——比特币


    在深入细节之前，我们必须花些时间了解该技术的起源。您可能已经听说过一种名为比特币的新兴货币。比特币是第一种被广泛使用的加密货币。加密货币仅作为数字货币存在。它不持有任何底层价值。您无法从银行取出并握在手中。它只是附加在一个
    ulnar 上的唯一字母和数字字符串。


