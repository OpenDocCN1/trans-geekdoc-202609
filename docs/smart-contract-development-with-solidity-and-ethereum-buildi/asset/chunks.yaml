- raw: "10.  Now add a new migrations file under migrations node as shown in the following\
    \ screenshot and call it `2_deploy_contracts.js` and move the deploy code from\
    \ `1_initial_migration.js` to this newly created file: \n\n     ![](images/Figure_3.2.21.jpg)\n\
    \n     **Figure 3.2.21**\n\n11.  So, the file contains the code as below. \n\n\
    \     `var HelloWorld = artifacts.require(\"./helloworld.sol\");`\n\n     `module.exports\
    \ = function(deployer) {`\n\n     `deployer.deploy(HelloWorld);`\n\n     `};`\n\
    \n12.  Now again, go to the PowerShell window where we got an error and again\
    \ compile the code by typing the command `truffle compile` and press *Enter*.\
    \ Once you press *Enter*, the code will again be compiled for the latest changes\
    \ we made in VS Code. Now again, run the command `truffle migrate` for deployment.\
    \ \n\n     ![](images/Figure_3.2.22.jpg)\n\n     **Figure 3.2.22**\n\n     This\
    \ time our migrations run fine as they find the current running server. See the\
    \ above image as it successfully deploys our contract. We can also see the address\
    \ it got while uploading.\n\n13.  Now, you can go ahead to create a user interface\
    \ to test the contract we just deployed; alternatively, Truffle also provides\
    \ a mechanism to interact with the contracts. We can do this via truffle console.\
    \ To start the truffle in console mode, run the command `truffle console,` as\
    \ shown in the following screenshot: \n\n     ![](images/Figure_3.2.23.jpg)\n\n\
    \     **Figure 3.2.23**\n\nThis opens a console listener for Truffle. In this\
    \ mode, we can directly write *JavaScript* code for our contract. Let’s do it\
    \ step by step.\n\n# [Test smart contract](#toc.xhtml#s63a)\n\nIn the truffle\
    \ console mode, define a variable named `helloW` or any of your choices with the\
    \ var keyword. And press *Enter*. We’ll try to access our contract with this variable.\
    \ After pressing *Enter*, we get undefined, and that is obvious because the variable\
    \ is still not defined with any content. Since the communication with contracts\
    \ should be async, we write an asyn code to access the contract now. Since in\
    \ our code, the contract was referenced using the deployed keyword, so we’ll also\
    \ access it via `helloWorld.deployed();` after that, a then keyword is used to\
    \ create an async method that maps our deployed contract with the variable that\
    \ we created earlier, i.e., `helloW`. The command would be `helloworld.deployed().then(function(deployed){helloW=deployed});`\
    \ See the following screenshot with all the commands to understand in detail.\n\
    \n![](images/Figure_3.2.24.jpg)\n\n**Figure 3.2.24**\n\nNow, access and test the\
    \ contract with the variable we mapped it to in our last step. Use the method\
    \ `call`() to the `helloworld` contract method to invoke the contract as `helloW.PrintHelloWorld.call(`)\
    \ as shown in following screenshot:\n\n![](images/Figure_3.2.25.jpg)\n\n**Figure\
    \ 3.2.25**\n\nHere we get the string that we were returning from that method and\
    \ so our method and contract are tested running on internal private Blockchain.\n\
    \nWas it fun to implement and test our smart contract?\n\n# [Conclusion](#toc.xhtml#s64a)\n\
    \nIn this chapter, we learned about smart contracts, and the language used to\
    \ develop smart contracts on Ethereum, Truffle, and Test RPC. This section serves\
    \ as a primer to those who are beginners in blockchain development and new to\
    \ Ethereum and smart contracts. This section gives a foundation on how to start\
    \ and proceed with smart contract development. I hope you enjoyed creating your\
    \ smart contract, deploying, and testing it.\n\n*Happy Coding!*\n\n![](images/Figure_3.2.26.jpg)\n\
    \n**Figure 3.2.26**\n\n# [Questions](#toc.xhtml#s65a)\n\n1.  What is a smart contract?\
    \ Which language is used to develop a smart contract?\n\n2.  What is byte code?\n\
    \n3.  How do you compile the smart contract?\n\n4.  What is the very first thing\
    \ you must specify in a solidity file?\n\n5.  What is a smart contract mining?\n\
    \n6.  What is the use of Test RPC in smart contract development?\n\n7.  Can smart\
    \ contracts be trusted?\n\n8.  Are there standards for smart contracts?\n\n9.\
    \  Is the execution of smart contracts free?\n\n10.  What happens if the execution\
    \ of a smart contract costs more than the specified gas?\n\n# [Section - IV](#toc.xhtml#p04)\n\
    \n# [Blockchain in Real World](#toc.xhtml#p04)\n\nLet’s talk a bit more about\
    \ what is the need of blockchain, and what more offerings can blockchain provide.\n\
    \n# [CHAPTER 1](#toc.xhtml#p04c01)\n\n# [Blockchain-Offerings and Usages](#toc.xhtml#p04c01)\n\
    \n# [Structure](#toc.xhtml#s66a)\n\nIn this chapter we will discuss the following\
    \ topics\n\n*   Need, usages, and offerings of blockchain.\n\n*   Impact of blockchain\
    \ technology in education.\n\n# [Objectives](#toc.xhtml#s67a)\n\nAfter studying\
    \ this unit, you should be able to\n\n*   Understand the real-time applications\
    \ of blockchain\n\n*   Understand how blockchain is impacting/influencing day\
    \ to day life.\n\n*   Understand what all places blockchain technology can contribute\
    \ or is contributing to?\n\n# [Need, usages, and offerings](#toc.xhtml#s68a)\n\
    \nThe vital question your company should ask is, do we need a blockchain? There's\
    \ a simple list of questions that you can ask to help determine this. First, do\
    \ you need a shared public database between multiple parties? If we're using a\
    \ public blockchain, do you need the data on this blockchain to be accessible\
    \ by anyone? If you're using a private blockchain, do you need for this data to\
    \ be shared between several known parties or companies? If the answer is no, then\
    \ a blockchain might not be the best technology for you to use. The next question\
    \ to ask is if multiple parties need to share the data, do any of these parties\
    \ have conflicting incentives, or are they not trusted? One of the primary purposes\
    \ of a blockchain is to enable trust between multiple parties. So, if there is\
    \ a level of distrust between the other parties and they have conflicting incentives,\
    \ then a blockchain is an excellent solution to look at.\n\nOtherwise, a blockchain\
    \ may not be needed, and you can use a database instead. The next question you\
    \ should ask is, are the other parties able to play by the same rules? By this,\
    \ we mean, will you be able to get them to use the same rules to govern the transactions\
    \ added onto the blockchain and the same rules to verify the transactions? If\
    \ the answer is no and you don't think you can get all the parties to play by\
    \ the same rules, which is easier said than done, then a blockchain isn't going\
    \ to be an excellent solution to use.\n\nThe next question is, do you need an\
    \ immutable log of all actions to be recorded? Blockchains work best with transactional\
    \ data like financial transactions or insurance claim settlements, for example.\
    \ For transactions like this, it makes sense to log them in a long chain of related\
    \ data items. If this isn't something you intend to do, then a blockchain is the\
    \ wrong solution. If you answered yes to all of those questions, then you've probably\
    \ determined that a blockchain will be useful to your organization. At this point,\
    \ you need to determine whether you are happy to use a public blockchain where\
    \ everyone is participating in the network and can access and verify your data,\
    \ or whether you want to use a private blockchain, which is more limited to a\
    \ consortium of companies.\n\nThere are many emerging blockchain implementations,\
    \ but if you look at the current major ones, we have, of course, the Bitcoin blockchain\
    \ as the biggest one. Ethereum from Consensus and Microsoft is getting quite a\
    \ bit of traction from the makers of non-financial applications. It is also the\
    \ implementation that we will be using later in this course. IMB blockchain on\
    \ Bluemix is also an alternative for those who want to create their blockchain.\n\
    \n# [Usages for blockchain](#toc.xhtml#s69a)"
