    在每一个分布式系统设计中，拥有一个运行良好的模型来保护系统免受恶意攻击至关重要。一个通用的原则应该是让攻击比防御更困难。在物理世界中这很难做到。试想保护一栋建筑。建立防护和
    `24/7` 安保非常昂贵；然而，制造一颗摧毁大楼的炸弹却相当便宜。在数字世界中，这可以通过不同的方式实现。试想使用哈希算法。它们使用成本低廉，但破解成本高昂。当保护区块链免受恶意行为侵害时，我们希望使用一种支付模型：如果你按预期使用系统，价格公平；但如果你试图对其进行恶意操作，代价将非常高昂。这就是
    `gas` 概念的由来。


    Gas 是在 Ethereum 中运行交易或合约的内部定价单位。这样做的目的是拥有一个与 Ether 当前价值分离的单位。你可以把它想象成汽油。汽车消耗的汽油量与你想开多快有关，汽油价格会上下波动，且不与货币价值静态挂钩。合约或交易使用的
    gas 量取决于运行它所需的操作。其价格基于计算、内存、带宽和存储需求等因素。这些因素加在一起构成了运行合约或交易所需的 gas。如果你没有足够的 Ether
    来支付完成代码运行所需的所有 gas，处理将中止，所有中间状态变更将回滚到交易前的快照。执行停止点之前消耗的 gas 依然会被消耗。因此，你账户的 Ether
    余额将减少已花费 gas 的相应价格。


    # 交易


    在 Ethereum 中使用的术语“交易”，指的是存储一条消息的数据包，该消息将从一个外部拥有的账户发送到区块链上的另一个账户。交易包含消息的接收凭证、标识发送者的签名、一个值字段（即从发送者转移给接收者的
    `WEI` 数量），以及一个 gas 价格值，代表发送者愿意为 gas 支付的费用。你愿意支付的价格越高，矿工对你的工作排序就越靠前。还有一个起始 gas
    值，代表交易执行允许采取的最大计算步骤数。可以把它想象成汽车加满油时的油箱容量测量。这将是最大成本，并确保你无法在代码中启动无限循环。这对矿工估算通过交易能赚多少也至关重要。因为他们唯一能确定的方式是在执行之后。由于
    `out-of-gas` 异常实际上是发送者的金钱浪费，最好稍微高估起始 gas，而不是低估。不过，你也应小心不要设置过高的值，因为如果起始 gas 与消耗的
    gas 差距过大，矿工可能会惩罚此类交易。你还有一个可选的数据字段，可以包含发送给合约的消息。当我们开始开发智能合约时，我们将更深入地探讨这一点。


    # 起始 Gas 和 Gas 价格过低


