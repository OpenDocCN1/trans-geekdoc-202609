    # [Authenticated hashing (HMAC)](#toc.xhtml#s21a)


    There is one step further than we can go with SHA-256 hashing, and that is to
    create what is called a `hashed message authentication` code. Fundamentally, this
    is the same as hashing but is taken a step further. If you combine a one-way function
    such as SHA-256 with a secret cryptographic key, then you get what is called a
    hash message authentication code, or an `HMAC` for short. Like a hash code, an
    HMAC is used when you want to verify the integrity of a message. An HMAC also
    allows you to verify the authentication of that message because only a person
    who knows the key can calculate the same hash of that message. An HMAC can be
    used with different hashing functions like *MD5* or the SHA family of algorithms.
    The cryptographic strength of an HMAC depends on the size of the key that is used.
    In our case, in this course, we are going to be using an HMAC with a 256-bit or
    32-byte key. Hash message authentication codes are used when you need to check
    both the integrity and the authenticity of a message.


    ![](images/Figure_1.2.5.jpg)


    **Figure 1.2.5**


    For example, consider a scenario in which you are sent a piece of data along with
    its hash. You can verify the integrity of the message by recomputing the hash
    of that message and comparing it with the original hash that you have received;
    however, you don''t know for sure that the message and the hash were not sent
    by someone you know or trust. If you used a hashed message authentication code,
    you could recompute the HMAC by using a secret key that only you and the trusted
    third party know and compare it with the HMAC you just received. This serves the
    purpose of authentication.


    In the following example, I''ll show you how to use an *HMAC* that uses a 32-byte
    or 256-bit key and the HMAC based on the *SHA-256* hashing algorithm. In addition
    to the hashed MAC *SHA-256*, you can use *SHA-1, SHA-512,* and *SHA* of *MD5.*
    The interface is all the same, but for this course, we''ll just be using the *SHA-256*
    variant.


