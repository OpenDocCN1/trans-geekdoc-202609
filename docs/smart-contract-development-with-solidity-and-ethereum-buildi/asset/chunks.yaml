    # 目标


    学习完本单元后，你应该能够：


    *   理解分布式应用。

    *   掌握 Gas 起始值和 Gas 价格。

    *   理解交易。


    # 面额单位


    目前共有 12 种面额单位，它们的命名通常源自对以太坊有重大影响的人物。目前使用的最小面额单位是 `Wei`，`1 ETH = 1,000,000,000,000,000,000
    Wei`（即 10^18 Wei）。


    `Finney` 也经常被使用，`1 ETH = 1000 Finney`。`Szabo` 当然也有其面额单位，`1 ETH = 1,000,000 Szabo`。当面额大于
    `1 ETH` 时，我们使用 `Kether`（`K` 代表 `kilo`，即 `1K ETH = 1000 ETH`）。同理，`Mether`（`M` 代表
    `mega`）、`Gether`（`Giga ETH`）等。


    ![](images/Figure_2.1.2.jpg)


    **Figure 2.1.2**


    谈到 `Ether` 时，你还应该知道存在一种称为 `Ethereum Classic` 的代币，交易符号为 `ETC`。其存在的原因是所谓的 `DAO Hack`。


    # DAO


    `DAO` 是一个运行在区块链上的去中心化自治组织。它们在以太坊区块链上拥有一个众筹合约，筹集了大量资金。不幸的是，该合约存在漏洞，使得攻击者能够创建子 DAO
    并转移资金。经过一段时间后，社区进行投票决定在区块链上实施硬分叉，基本上将所有资金恢复到被黑客攻击时的状态。这是社区共同解决问题的一个绝佳案例，但这也引出了一个根本性问题：只要代码完全按照预期执行，进行更改是否合适？密码学社区中有一个亚群体被称为
    `crypto-anarchists`（加密无政府主义者）。他们认为，只要代码完全按预期运行，如果你犯了错误或使自己容易受到攻击，那纯属倒霉。社区投票决定硬分叉表明，大多数成员不同观这一观点。尽管如此，下次类似事件发生在公共以太坊区块链或其他区块链上时会如何发展，仍将令人期待。


    > **引用自 Wikipedia：**

    >

    > *一个著名的例子是为了风险投资融资而设立的 The DAO，它于 2016 年 6 月启动，众筹募集了 1.5 亿美元，但随即被黑客攻击并窃取了 5000
    万美元的加密货币。在随后的几周内，这次黑客攻击被逆转，资金通过以太坊区块链的硬分叉得以恢复。这次救助之所以成为可能，是因为以太坊矿工和客户端切换到了新的分叉链。*


    # 去中心化应用


    在传统应用架构中，我们可能会有一个服务设置，提供应用存储、数据逻辑和用户凭证。客户端运行某种界面，二者通过固定通信通道交互。而在区块链上的分布式应用，构建方式略有不同。共享数据存在于分布式区块链上，分布在多个位置，因此单个服务器宕机无关紧要。数据逻辑同理，逻辑共享于区块链上。一旦你将合约上传到链上，无论从何处运行，它都会以相同方式传播和执行。分布式架构中的客户端也有所不同，因为它负责存储用户凭证，通常也存储更多应用数据。以这种方式构建应用，将使你的解决方案对系统故障具有极强的抵抗力，并意味着它们可以在没有中心化系统的情况下完全运行。你仍然可以在客户端保留面向中心化系统的更新功能，但应确保客户端不依赖任何中心化组件。在后续部署代码到以太坊的章节中，我们将使用一种名为
    `solidity` 的语言创建智能合约。智能合约是驻留在区块链上的代码片段，严格按照共享逻辑的指令执行命令。合约构成了我们分布式应用的数据逻辑。它们可以读取其他合约、做出决策、发送
    `Ether`，也可以执行其他合约。合约将随着网络持续存在并运行。它们仅在交易资金耗尽或被编程为自毁时停止运行。


