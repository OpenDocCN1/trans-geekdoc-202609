    # 区块链——密码学原理


    在本节中，我们将更仔细地研究构建区块链数据结构所需的一些密码学原语。我们将探讨哈希、认证哈希和数字签名。本书的范围仅限于学习和理解区块链，因此本节不会详细讲解密码学，而是让您了解密码学技术是如何工作的。密码学是一个迷人的学科，您可以在互联网上或其他专门的书籍中找到大量相关资料。


    ![](img/Figure_1.2.1.jpg)


    **图片来源：** Pixabay.com


    **图 1.2.1**


    # 结构


    在本章中，我们将讨论以下主题


    *   哈希技术

    *   HMAC

    *   数字签名


    # 目标


    学习完本单元后，您应该能够


    *   理解什么是哈希？

    *   了解哈希的类型

    *   学习数字签名及其重要性。


    # 哈希


    对数据进行哈希处理是一种利用密码学的基本技术，它构成了我们即将探讨的区块链实现构建的骨干。加密哈希函数是一种算法，它接收任意数据块并返回一个固定大小的字符串——即加密哈希值——使得对该数据的任何意外或故意更改都会改变哈希值。待编码的数据通常称为
    `message`（消息），哈希值有时也称为 `message digest`（消息摘要），或简称为 `digest`（摘要）。


    理想的加密哈希函数具有四个主要属性。首先，对于任何给定的消息，计算其哈希值必须容易。这意味着对于任意数据块，运行哈希函数计算哈希值应该很容易。其次，生成一个具有给定哈希值的消息必须是不可行的。这意味着生成会导致预定哈希码或摘要的原始数据必须是不可行的。再次，在不改变哈希值的情况下修改消息必须是不可行的。这意味着如果您更改想要哈希的数据中的仅一个比特，则生成的哈希码将完全不同。最后，找到两个具有相同哈希值的不同消息必须是不可行的。这意味着您有两个不同的数据块想要创建哈希码。它们不应都最终得到相同的最终哈希码。这被称为
    `hash collision`（哈希碰撞）。


    ![](img/Figure_1.2.2.jpg)


    **图片来源：** [`commons.wikimedia.org/wiki/File:Hash_function.svg`](https://commons.wikimedia.org/wiki/File:Hash_function.svg)


    **图 1.2.2**

