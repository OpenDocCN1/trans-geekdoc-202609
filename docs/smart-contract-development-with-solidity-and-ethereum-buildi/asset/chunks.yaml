    在每一个分布式系统设计中，拥有一个运行良好的模型来保护系统免受恶意攻击至关重要。一个通用的原则应该是让攻击比防御更困难。在物理世界中这很难做到。试想保护一栋建筑。建立防护和
    `24/7` 安保非常昂贵；然而，制造一颗摧毁大楼的炸弹却相当便宜。在数字世界中，这可以通过不同的方式实现。试想使用哈希算法。它们使用成本低廉，但破解成本高昂。当保护区块链免受恶意行为侵害时，我们希望使用一种支付模型：如果你按预期使用系统，价格公平；但如果你试图对其进行恶意操作，代价将非常高昂。这就是
    `gas` 概念的由来。


    Gas 是在 Ethereum 中运行交易或合约的内部定价单位。这样做的目的是拥有一个与 Ether 当前价值分离的单位。你可以把它想象成汽油。汽车消耗的汽油量与你想开多快有关，汽油价格会上下波动，且不与货币价值静态挂钩。合约或交易使用的
    gas 量取决于运行它所需的操作。其价格基于计算、内存、带宽和存储需求等因素。这些因素加在一起构成了运行合约或交易所需的 gas。如果你没有足够的 Ether
    来支付完成代码运行所需的所有 gas，处理将中止，所有中间状态变更将回滚到交易前的快照。执行停止点之前消耗的 gas 依然会被消耗。因此，你账户的 Ether
    余额将减少已花费 gas 的相应价格。


    # 交易


    在 Ethereum 中使用的术语“交易”，指的是存储一条消息的数据包，该消息将从一个外部拥有的账户发送到区块链上的另一个账户。交易包含消息的接收凭证、标识发送者的签名、一个值字段（即从发送者转移给接收者的
    `WEI` 数量），以及一个 gas 价格值，代表发送者愿意为 gas 支付的费用。你愿意支付的价格越高，矿工对你的工作排序就越靠前。还有一个起始 gas
    值，代表交易执行允许采取的最大计算步骤数。可以把它想象成汽车加满油时的油箱容量测量。这将是最大成本，并确保你无法在代码中启动无限循环。这对矿工估算通过交易能赚多少也至关重要。因为他们唯一能确定的方式是在执行之后。由于
    `out-of-gas` 异常实际上是发送者的金钱浪费，最好稍微高估起始 gas，而不是低估。不过，你也应小心不要设置过高的值，因为如果起始 gas 与消耗的
    gas 差距过大，矿工可能会惩罚此类交易。你还有一个可选的数据字段，可以包含发送给合约的消息。当我们开始开发智能合约时，我们将更深入地探讨这一点。


    # 起始 Gas 和 Gas 价格过低


    好的，现在让我们看看设置不同级别的起始 gas 和 gas 价格的效果。如果起始 gas 设置得太低，交易可能不会发送给矿工，你会收到“intrinsic
    gas too low”错误。如果 gas 价格设置得太低，情况也是如此。矿工会忽略该交易，转而选择能赚钱的交易。设置过低的 gas 价格是个坏主意，因为你会遇到
    out-of-gas 错误，交易会回滚，但如前所述，你仍需为已使用的部分付费。如果 gas 价格设置得低，交易可能会被较慢地打包，放入后续的区块，具体取决于矿工当前的负载。


    # 起始 Gas 和 Gas 价格过高


    如果起始 gas 设置得太高，可能会导致挖矿延迟，因为矿工会认为它需要大量资源，必须等待可用性。设置较高的 gas 价格在大多数情况下会导致你的交易被优先处理，比其他交易更早打包进区块。每个区块都有一个
    gas 限制。如果你的起始 gas 超过了该限制，交易不会广播给矿工，你会收到“exceeds block gas limit”错误。如果 gas 价格设置过高且发送者没有足够的可用资金，交易也不会广播给矿工。


    # 适中的起始 Gas 和 Gas 价格


    适中的起始 gas 和 gas 价格通常是理想水平，也是你应该努力的目标。


    # 结论


    在本章中，我们首先讨论了 Ethereum 的定义和原因。在深入分布式应用之前，我们研究了 Ethereum 的执行和资金模型。


    只要记住核心理念，你就能顺利地使用 Ethereum 进行开发。工作量证明是 Bitcoin、当前版本的 Ethereum 以及许多其他区块链所采用的机制。一些挖矿操作也使用对环境不友好的能源。为了更直观地理解这一点，Bitcoin
    的工作量证明挖矿每年消耗的电量相当于一个中等规模 `European` 国家的年耗电量。在工作量证明中，一个人可能投入 `$10,000` 购买专用挖矿硬件并开始参与网络。挖矿随后会生成区块，并以可花费的加密货币形式获得工作奖励。权益证明试图通过完全移除挖矿概念并用不同机制取而代之来解决这些问题。在权益证明中，可以直接将同等金额转换为加密货币。与工作量证明一样，投入越多，预期产出越多。


    在下一章中，我们将学习 Ethereum 与 Azure 的结合，设置 Azure 上的 Ethereum 账户，以及设置 MetaMask 账户。


    # 问题


    1.  什么是 Ethereum，它的面额有哪些？

    2.  Wei 和 Ether 有什么区别？

    3.  Ethereum 的价值代币是什么？

    4.  Ethereum 的平均区块大小是多少？

    5.  什么是 dApp，它与普通应用有何不同？

    6.  你如何理解 gas 和支付模型？

    7.  如果起始 gas 设置过高，gas price 会发生什么？

    8.  Gas price 是否决定交易何时被处理？

    9.  交易费是如何计算的？

    10. 交易记录在哪里？


    # 第 2 章


    # 在 Azure 上设置 Ethereum 区块链


    本章将重点介绍在 Azure 上设置自定义 Ethereum 区块链。本章理论较少，更侧重于在 Azure 上逐步设置 Ethereum 区块链并使用 MetaMask
    在账户间转账的实践实现。本章面向更偏向开发且具备区块链、Ethereum 和 Ether 背景的读者。我们已在前面理解 Ethereum 和区块链的章节中涵盖了理论知识。


