    In the preceding code, you can see a snippet of code that calculates an SHA-256-based
    hashed message authentication code. Like the standard *SHA-256* hash, the hashing
    class deals with byte arrays, but in this example, I''ve put in the necessary
    string to byte array conversions to show you what these look like. First, this
    method takes a string of our data to be hashed and the string representing the
    key. The key can be anything that you''d like, but it shouldn''t be longer than
    256 bits or 32 bytes in this case. Next, we use the Encoding. *UTF8*. GetBytes
    method to convert the data to be hashed and the key strings into byte arrays.
    Then we create an instance to the hash HMACSHA256 class and pass the byte array
    of our key into it. Next on the HMAC object, we call `ComputeHash` and pass in
    the byte array of the message that we want to create the authenticated hash for.
    The result of this is also a byte array, which we convert back into a `Base64`
    encoded string using the `Convert`. ToBase64 string method. Now that we have covered
    hashing and authenticated hashing. Following is the output of the console application
    when executed.


    ![](images/Figure_1.2.6.jpg)


    **Figure 1.2.6**


    # [Digital signatures](#toc.xhtml#s22a)


    An essential function of cryptography is to ensure non-repudiation of a sent message.
    This is where the receiver of that message cannot deny that the message is authentic.
    Additional signatures are a technique used to help demonstrate that the message
    is authentic. A valid digital signature gives the recipient a reason to believe
    that the message was created by a known sender, such that the sender cannot deny
    having sent that message. Digital signatures give you both authentication and
    non-repudiation. Authentication because the signatures had to be created by a
    user with a valid, private key, and non-repository so that a receiver can trust
    that the message was signed by a known sender, as only they know the private key.
    `So how do digital signatures do all this?` For the receiver of the message, a
    digital signature allows the receiver to believe that the message was sent by
    the correct sender. This can be thought of as the digital equivalent to a signature
    on a letter, except a digital signature is much harder to forge. A digital signature
    consists of the following three algorithms: the public and private key generation
    using RSA, a signing algorithm that uses the private key to create the signature,
    and a signature verification algorithm that uses the public key to test if the
    message is authentic. The private and public keys are two keys that are mathematically
    linked. The public key, as the name suggests, can be known by anyone, and the
    private key should only be known by you, the sender of the message. So, therefore,
    it''s this private key that must be kept secret.


    Let''s now look at an example of how a digital signature works. In this example,
    Alice has sent in a message to Bob, and that message will be signed with a digital
    signature.


    ![](images/Figure_1.2.7.jpg)


    **Image credit:** [https://upload.wikimedia.org/wikipedia/commons/9/93/Ss\_digitalsignature.png](https://upload.wikimedia.org/wikipedia/commons/9/93/Ss_digitalsignature.png)


    **Figure 1.2.7**


    First, Alice encrypts some data that she wants to send to *Bob*. For this example,
    it doesn''t matter whether the data was encrypted with a symmetric or asymmetric
    encryption algorithm. Once this data has been encrypted, Alice takes a hash of
    that data. Next, *Alice* signs the data with her private signing key. This creates
    a digital signature. Then, *Alice* sends the encrypted data, its hash, and the
    signature to *Bob*. First, *Bob* recalculates the hash of the encrypted data.
    *Bob* then verifies the digital signature using the calculated hash and the public
    signing key. This will tell *Bob* whether the signature is valid or not. If it
    is valid, *Bob* can be confident and see it was *Alice* that sent him the message
    in the first place, as it could only have been signed using her private signing
    key, which only *Alice* knows. If this signature was not valid, then *Bob* should
    not trust the origin and authenticity of the message. As we just mentioned, the
    digital signature signing is based on *RSA*. But with *RSA*, we need to encrypt
    some data. You encrypt the data with the recipient''s public key, and then the
    recipient decrypts it with their private key. With a digital signature, signing
    and verifying is the other way around. When the sender signs a message, they use
    their private key, and then the recipient verifies the signature using the sender''s
    public key. It is since we''ve signed the sender''s private key that a recipient
    can trust that a message was sent by that sender, as it will only be them that
    knows that private key.


