    # D. Binarized Neural Network Model


    Considering these factors, small-factor FPGAAs are now commercially available
    and such FPGA is found in the Lattice E40 Ultra-Plus Breakout [23]. The FPGA supports
    implementation of Convolutional Neural Network to perform analysis, simulation
    and as a result, it is possible to detect an event as no fall in real time. The
    model was implemented on a local computer, which consists of eight NVIDIA V100
    (16GB) GeForce SuperSystem was executed on a Supercomputer Super-402-GRTR [24].
    A Deep Learning framework created by Berkeley AI (BAIR) is similar to other popular
    deep learning frameworks. Because of properties like speed and extensible code
    for active development, caffe is suited for research deployment purposes [25].


    The fourth model in this is a Binarized Neural Network model with binary weights
    and activations during run-time. These are designed to evaluate the parameters
    gradients [21]. During forward process, memory size and speed are reduced abruptly
    by the Convolutional Neural Network (CNN) model, where the gradients are not binarizing
    during way. The weights and activations are constrained to +1 or -1 during run-time
    [22].


    BNN uses Multiply-Accumulate (MAC) operations that are low-level linear operations
    in deep learning where weights are constrained to +1,-1; 32-bit floating point
    MACs are made by one XNOR-point operation. Each operation is output as the word
    of a 32-bit integer where the output is the number of set bits. A standard vector
    dot product is computed by a binarized variant executed by an XNOR-point function
    causes the BNN method to provide higher power efficiency during a forward pass.
    It also demands 32 times smaller memory capacity than a 32-bit Deep Neural Network
    (DNNs). The BNN model is trained using Keras framework running over TensorFlow..


