    # A. Long Short Term Memory-Recurrent Neural Network (LSTM-RNN) Model


    The Recurrent Neural Networks have the ability to characterize temporal behavior
    of a signal as they leave in their architecture. These networks experience gradient
    problems. LSTM-RNNs, compose of a cell to overcome this issue and Gating functions
    in their state [14]. A segment of time predicting fail was trained with RNN Keras
    framework on top of Tensorflow. TensorFlow is created for deep learning and Keras
    is a higher level API used for RNN networks with faster computations.


    The LSTM-RNN model is made of two layers followed by a Dense layer. While the
    LSTM layers have dimensions of 13x25 and 25x20, the Dense layer has a dimension
    of 20x1. The Dense layer does the following operation on the data: output = activation(dot(input,kernel)
    + bias), where kernel represents the weight and data represents the product of
    all data and its corresponding weights [16]. Sigmoid is used as the Activation
    function in this model.


    As stated before, the model was trained on a non-uniform time segment data when
    the time segments comprise leading up to, and including. The variable time data
    fed into the model for training goals, where one iteration consists of one forward
    pass and one backward pass of each batch size. LSTM RNN model training and testing
    is plotted as a Receiver Operating Characteristic (ROC) curve for each of the
    means.


    # B. Gradient Boosting Tree (GBT) Model


    Gradient Boosting Tree algorithm consists of multiple iterative decision trees
    and is an additive algorithm [17]. The results of all the trees are added and
    the final outcome is obtained as the final classification. A collection of GBTs
    trained with the recorded fail data using xgboost software, scalable tree framework
    [18]. For example, the final prediction for a given example is the sum of predictions
    from each tree as represented in the Tree Example shown in 6.


    The common notion behind GBT is to split branches, which yields y[i] a group of
    predictions, and then compute error y[i]-y''[i]; GBT as a binary classifier is
    considered the cutting edge for classification of non-binary data like scenario
    means. A logistic function L(x) is used to map the prediction y''[i] to [0,1],
    for a binary classifier that classifies an input as fail or no fail. A Mean Squared
    Error (MSE) function J = (y[i]-y''[i])^2 and


