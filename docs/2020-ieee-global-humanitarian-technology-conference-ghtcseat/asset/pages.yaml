    # C. Random Forest Model


    Random Forest Decision, consists of many individual decision trees that operate
    as a whole (ensemble learning). The individual classification prediction from
    each of these trees in a forest is collectively collected and based on the maximum
    number of votes for a class, the final prediction of the model is made as the
    result of model''s classification [19]. This is an example of how a forest of
    individual trees outputs a class with the majority value is generalised as the
    model''s output. In this case, there are 3 i''s and the output is 1.


    In this approach, Scikit-Learn''s ensemble.RandomForest was used [15]. The Gradient
    Boosting Tree model minimizes Mean Squared function J (during each iteration)
    training the input data in parallel. We apply a method of 10 independent trees
    (n_estimators=10) where each tree is trained in parallel and a unified classification
    result is obtained as an outcome of aggregated solution from the ensemble of trees.'
