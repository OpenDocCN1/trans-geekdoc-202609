    **Abstract—** In the general population, physical injuries sustained by an unintentional
    fall on a hard surface are the leading cause of avoidable injury mobility and
    mortality. As much as 65% to 30% of adults aged over 65 fall once a year, and
    2.9 million falls are reported, resulting in 33,000 deaths. All elderly individuals
    have bone fractures at some point during their life. The situation leading to
    bone fracture, concussion, intracranial or traumatic brain injury when medical
    attention is not offered immediately. Some falls lead to death as well. Recently,
    many studies have come up with wearable devices. These devices are not commercially
    available in the market as compact, wireless, and power efficient. This paper
    discusses the findings that a Fall Detection Sensor on the human body is in front
    of the Shi bone. This is based on a dataset collected from falls using IMU sensors
    placed on 16 human bodies and trained-tested using Convolutional Neural Networks
    (CNN) for recognition. The goal is to develop a wearable, medical device that
    uses a small Lattice Field Programmable Gate Array (FPGA) integrated with gyro
    and accelerometer sensors which detects whether the person has fallen or not.
    This FPGA is capable of running the Neural network locally. This makes it capable
    of providing real-time classifications without any Transmitter or Receiving capabilities.
    **Index**—Fall detection, edge inference, machine learning, neural networks, FPGA


