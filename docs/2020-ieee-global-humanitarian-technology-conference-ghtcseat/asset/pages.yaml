    # ## Data and Features


    The 183 kinematic features determined by the Noraxon IMU are displayed on NoraxonRESEARCH
    Software (MR3) which include the orientation, anatomical angles and linear acceleration
    measured at a rate of 200 Hz. The course, pitch and roll (in degrees) are recorded
    by the sensors placed on the head, upper thoracic, pelvic, and left arms, hands,
    thighs, shins, and feet. Also, the acceleration (or 1 cm/s²) and rotation along
    X-, Y- and Z-axes are recorded. These sensor measures are merged together to calculate
    flexion, abduction and rotation of the left and right shoulders. While the flexion
    is calculated for the left and right knees and elbows, the flexion, lateral readings
    are captured for cervical, lumbar and thoracic regions. The wrist gives measures
    of extension, radial and proximal forces. These constitute 183 feature set that
    was collected and read at once. The Noraxon MR3 desktop software shows each feature
    set for one participant who participated in our "fall-experiment".


    These values were stored as Comma-Separated Value (CSV) files which were accessed
    using the Noraxon MR3 software or exported to the computer which has Microsoft
    Excel or similar CSV readers. The Noraxon MR3 records and displays the changes
    in orientation and acceleration. With the replay feature, each subject''s visual
    records are played back and label that particular recording as a fall or no fall.
    In each case, the fall is considered a complete topping of individual on the floor/mattress
    and the event was labeled with a binary value 1. While, merging or using balance
    by a quick recovery was considered as "non-fall" events and were labeled with
    0. These CSV files of different human subjects


