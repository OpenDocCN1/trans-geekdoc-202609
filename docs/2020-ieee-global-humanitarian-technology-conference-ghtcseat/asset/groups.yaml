    图. 6. 梯度提升树 - 树示例模型 [18]


    需要一个函数 $f[i] = J$ 来最小化 $y''[i] = y[i] - \alpha$（对于某些 $\alpha$）。然后重复该算法以提高精度。GBT
    模型中，“损失”是其重复周期（epoch cycles）的函数 [15]。Epoch 定义为整个数据通过模型的次数。


    树森林的平均值产生分类（失败或非失败）。ROC 下的面积 (AUC) 是分类的评估指标。最佳截断点是假阳性率 (FPR)，此时灵敏度 = Sensitivity
    - J，其中 $I$ 是 Youden 统计量：


    ## C. 随机森林模型


    随机森林决策由许多作为一个整体运行的个体决策树（集成学习）组成。森林中每棵树的个体分类预测被集体收集，并根据每个类别的最高票数得出模型的最终预测结果，作为模型分类的结果
    [19]。这是一个个体树森林通过多数投票值输出类别并泛化为模型输出的示例。在这种情况下，有 3 个 $i$，输出结果为 1。


    在这种方法中，使用了 Scikit-Learn 的 `RandomForest` [15]。梯度提升树模型在每次迭代中最小化均方函数 $J$。我们应用 10
    棵独立树（`n_estimators=10`）的方法，每棵树并行训练，并通过树的集成获得统一的分类结果。


    ## IV. CAFFE 模型与实现


    ![](img/5528ef19a07f2ebdb3c21143cb3dc707_4_0.png)


    从上述机器学习模型结果观察到，传感器提供了最佳曲线 (AUC)，这意味着如果传感器放置在人体骨骼上，其预测精度远高于其他位置。BNN：梯度提升随机森林在考虑时间段时表现更好，尽管在硬件实现中，RNN
    优于其他模型并显示出更高的精度。卷积神经网络 (CNN) 是 BNN 的一种计算高效的结构，可以在 Lattice FPGA 上实现 [22]。


