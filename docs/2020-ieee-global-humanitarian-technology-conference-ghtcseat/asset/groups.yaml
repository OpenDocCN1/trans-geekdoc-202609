    # 基于 FPGA 的跌倒检测边缘推理


    Kishore Bharathkumar

    电气与计算机工程系

    圣州立大学

    圣地亚哥，美国

    kishorebharath14@gmail.com


    Christopher Paolini

    电气与计算机工程系

    圣州立大学

    圣地亚哥，美国

    paolini@engineering.dsdu


    Mahasetha Sarkar

    电气与计算机工程系

    圣州立大学

    圣地亚哥，美国

    msarkar2@sdsu.edu


    **摘要—** 在人群中，在硬表面上意外跌倒造成的身体伤害是可避免的运动能力障碍和死亡的主要原因。65 岁以上成年人中 30% 至 65% 每年跌倒一次，报告显示有
    290 万次跌倒，导致 33,000 人死亡。所有老年人在一生中的某个一点都会发生骨折。在没有立即提供医疗护理的情况下的情况下，会导致骨折、脑震、颅内或外伤性脑损伤的情况。某些跌倒会导致死亡。最近，许多研究提出了可穿戴设备。这些设备在市场上尚未作为紧凑、无线和低功耗的设备上市。本文讨论的发现是人体上的跌倒检测传感器位于脊骨前方。这是基于放置在
    16 个人体上的 IMU 传感器收集的跌倒数据集，并使用卷积神经网络 (CNN) 进行识别训练和测试。目标是开发一种可穿戴医疗设备，该设备使用小型 Lattice
    现场可门阵列 (FPGA) 集成陀螺仪和加速度计，用于检测人是否跌倒。该 FPGA 能够在本地运行神经网络。这使其能够在在不需要任何发射器或接收器的情况下提供实时分类。**索引**—跌倒检测、边缘推理、机器学习、神经网络、FPGA


    在像泰国、越南、印度尼西亚、柬埔寨、马来西亚和其他东南亚国家等低收入或中等收入国家，只有有限的研究报告了跌倒。因此，事实百分比范围在 14-34% 之间，导致与跌倒预防相关的研究质量有限
    [6]。在撒哈拉以南非洲国家，跌倒未被视为一种风险。


    ![](img/5528ef19a07f2ebdb3c21143cb3dc707_0_0.png)


    图 1. 美国跌倒导致的死亡人数 [33]


    # I. 引言


    跌倒的主要原因始终与人的年龄和身体状况成正比。其后果是严重的创伤、残疾和头晕被认为是 [1]。在经济成本方面，跌倒仅次于汽车或摩托车事故 [2]。如图 1
    所示，在美国 65 岁以上年龄的人口中，平均每年 10 万人中有 36.8 人仅死于跌倒 [3]。研究显示，近 40% 的老年人需要医疗护理或活动受限或健康状况恶化。与居住在养老院的人员相比，年长者的跌倒频率更高
    [4]。根据这些报告，需要提供即时援助以防止跌倒。在这种情况下，需要跌倒检测传感器 (FDS) 或等效设备来警示护理人员或...


    这些跌倒检测传感器 (FDS) 通常很小，作为吊坠挂在脖子上，或戴在手表上，或作为配备加速度计的手机，以检测和识别跌倒。市场建议附带免责声明，称“它们可能无法感知
    100% 的跌倒。当他/她陷入无意识状态导致致命性跌倒时，设备很难或无法工作 [5]”。市上有多种类型和变种的跌倒检测器，尚不清楚哪种是用于人体并检测跌倒的最佳或最优方案。


    在这项研究中，16 个惯性测量单元 (IMU) 传感器被放置在人体的不同位置，捕捉了多 183 个特征。记录的值使用不同的机器学习模型进行训练和测试，将事件分类为跌倒或非跌倒。根据这些结果，显然小腿骨（膝盖）是放置传感器的下一个位置，以获得最大的跌倒检测准确性。适用于
    Caffe 框架在 Lattice 板上实现。该板的 FPGA 提供了灵活的知识产权 (IP) 核心，实现卷积神经网络 (CNN)，实时计算跌倒分类数据。脊柱、盆骨、上臂和手如图
    3 所示。下半身包括大腿、小腿和脚，如图 4 所示。


    ![](img/5528ef19a07f2ebdb3c21143cb3dc707_1_0.png)


    # II. 方法与数据集


    在不同的研究任务中对人体进行了实验以检测跌倒。尽管所有实验都提供了关于跌倒数据实现的细节，但记录跌倒或非跌倒的方法并未明确说明 [5]。虽然在少数研究工作中未公开受者的细节，但跌倒的原因或恢复跌倒的采取的措施仍然是一个谜
    [9]。有些研究使用摄像头记录跌倒视频，并将其作为输入数据训练神经网络。在这种情况下，受者的隐私受到了影响。


    图 3. 上肢 IMU 放置 [11]


    在我们的研究中，实验是在圣地亚哥大学运动营养科学系 (ENS) 的神经力学和神经塑性实验室进行的。实验室配备了无线 3D 运动捕捉摄像头记录人体运动，如图
    2 所示，即 Noraxon 测量单元 (IMU)。


    ![](img/5528ef19a07f2ebdb3c21143cb3dc707_1_0.png)


    # 2020 IEEE 人道主义技术会议 (GHTC)


    脊柱、盆骨、上臂和手如图 3 所示。下半身包括大腿、小腿和脚，如图 4 所示。


    ![](img/5528ef19a07f2ebdb3c21143cb3dc707_1_0.png)


