    “树”通过 Gini 纯度进行评估。树的每个节点的 Gini 纯度提供了从选定数据集进行错误分类的概率，该数据集被标记为失败或非失败 [20]。


    ## D. 二值神经网络模型


    考虑到这些因素，小因子 FPGA 现在已市售，且此类 FPGA 位于 Lattice E40-Plus Breakout [23]。FPGA 支持实现卷积神经网络以进行分析和仿真，结果是可以实时检测非失败事件。该模型在本地计算机上实现，该系统由
    8 张 NVIDIA V100 (16GB) GeForce 组成，并在 Supercomputer-402-GRTR 上执行 [24]。由 Berkeley
    AI (BAIR) 创建的深度学习框架与其他流行的深度学习框架相似。由于速度和便于开发的代码等特性，caffe 适用于研究部署 [25]。


    该模型中的第四个模型是在运行时具有二值权重和激活值的二值神经网络模型。这些被设计用于评估参数梯度。在前向过程中，卷积神经网络 (CNN) 模型大幅减少了内存大小和速度，其中梯度在过程中不进行二值化。权重和激活值被限制在
    +1 或 -1。

