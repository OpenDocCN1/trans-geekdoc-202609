    # 2020 IEEE 全球人道技术会议 (GHTC)


    ![](img/5528ef19a07f2ebdb3c21143cb3dc707_6_0.png)


    图 11: 卷积神经网络中腿部传感器随迭代次数变化的损失曲线


    由易发生跌倒的老年人收集。


    许多欧洲大学已发布了关于日常生活活动（ADL）及所有事件的数据集，受试者在胸部和大腿部等不同部位佩戴传感器或跌倒检测系统（FDS），例如将手机放入口袋作为追踪器、佩戴在腕部或沿腰部，但在每种情况下的准确率都相对较低。这些设备只能记录线性加速度，但在现实中，身体还有其他位置和取向，是这些基础设施无法记录的。此外，边缘计算资源紧张，并使用外部内存进行计算。从结果显而易见，本研究中的所有机器学习模型对于所放置传感器的分类准确率均超过
    80%。最终结果显示，卷积神经网络在 Caffe 实现的模型中达到了 80% 的准确率，在 TensorFlow 实现的模型中平均准确率为 85%。TensorFlow
    框架在处理时间序列输入数据时提供更高的准确率；然而，Caffe 框架更具易用性和简洁 [30]。我们研究最有影响的启示是：任何跌倒检测传感器都应该设计为放置在胫骨上。此外，这些传感器应设计具有边缘接口能力，以便可以在板上（如
    Lattice FPGA）进行计算，且对数据和功耗的需求降至最低。


    图中 1-特异性（假阳性率 = 1 - 真阴性率）对第 III 节中讨论的所有四个机器学习模型进行了绘图。我们使用了 Caffe 和 TensorFlow
    框架。对于 LSTM-RNN 模型，放置在胫骨上的腿部传感器实现了最高的 AUC（AUC=0.92），而左右手腕的 AUC 值分别为 0.91 和 0.86
    [15]。梯度提升树模型在假阳性率上表现出 0.90 的 AUC。尽管如此，左胫骨上的模型在随机森林模型中显示出 0.85 的最高 AUC，而由二进制神经网络（BN）模型构建的随机森林模型在左腿部传感器上也显示出
    0.82 的 AUC。


    为左腿部传感器设计的卷积神经网络使用 63 两个数据输入进行训练。图 10 显示了 Caffe 模型生成的接收者工作特征（ROC）曲线，其曲线下面积（AUC）值为0.79。此外，图
    11 显示了左传感器损失随迭代次数变化的 0.18 损失（训练和测试）。


    # V. 结论


    技术进步现在使我们能够利用机器学习方法在实时医疗设备中进行预测和分类。当跌倒发生时，获得护理人员的关注需要时间，这会加剧伤性脑损伤、骨折、脑震和出血的情况
    [21]。老年人的死亡原因之一是不幸的受伤，其中两种是跌倒导致的。大多数跌倒发生在生活中，而非居住社区，因此，跌倒检测系统（FDS）应该是……


    本文提出的机器学习模型能够在短时间内（分钟级）对大量跌倒数据执行预测和分类。用于实施的 FDS 功耗极低，可在 1 mW 左右执行分类算法。FDS 的因子足够小，可以嵌入可穿戴设备中。边缘接口元件限制了维护云基础设施的成本，同时减少了数据传输到云端的延迟。我们在本文提出的解决方案是……


    未来，FDS 设备应配备陀螺仪和加速度计以记录数据并预测跌倒发生的情况。除了功能外，FDS 还具有 GPS（或惯性导航系统），以告知护理人员所有设施中跌倒发生的精确物理位置。由于
    RNN 在所有其他模型中具有最高的 AUC，观察到单个实例实施在实时中的时间段，因此需要评估在低功耗需求的小设备上支持 RNN 的需求。随后，我们继续使用配备加速度计和陀螺仪的
    FPGA 在带有室内跟踪（GPS 跟踪）的单一设备上构建该项目，并对 100 多名不同的受试者进行实验。


    # 致谢


    这项工作得到了 HealthLink Center 的 1 个试点项目和“边缘全检测”的支持，并受到国家卫生部、国立卫生研究院以及州立大学集团（UGC）的支持。实验在工程与营养科学学院（ENS）Bawe
    博士的“神经力学与塑性”实验室进行。我们感谢 Bawe 博士及其学生的支持。


