    ## A. 长短期记忆循环神经网络 (LSTM-RNN) 模型


    循环神经网络由于其架构中的特性，能够表征信号随时间变化的行为。这些网络会遇到梯度问题。LSTM-RNN 由用于克服该问题的单元组成，并在其状态中使用门控函数
    [14]。在该中，在 TensorFlow 之上使用 RNN Keras 框架训练了一个预测失败的时间段模型。TensorFlow 是为了深度学习而创建的，而
    Keras 是一种更高层次的 API，用于计算更快的 RNN 网络。


    LSTM-RNN 模型由两层 LSTM 后跟一个全连接层（Dense layer）组成。LSTM 层的维度为 13x25 和 25x20，而 Dense 层维度为
    20x1。Dense 层对数据执行以下操作：`output = activation(dot(input,kernel) + bias)`，其中 `kernel`
    代表权重，`data` 代表所有数据及其对应权重的乘积 [16]。该模型中使用 Sigmoid 作为激活函数。


    如前所述，该模型在非均匀时间段数据上进行训练，这些时间段包括前导和包含的内容。用于训练目标的可变时间数据输入模型，每次迭代包含每个批次的一次前向传播和一次反向传播。LSTM
    RNN 模型的训练和测试被绘制为每个平均值的接收者工作特征 (ROC) 曲线。


    ## B. 梯度提升树 (GBT) 模型


    梯度提升树算法由多个迭代决策树组成，是一种加法算法 [17]。所有树的结果相加，获得最终输出作为最终分类结果。这是一组使用 `xgboost` 软件在记录的失败数据上训练的
    GBT，这是一种可扩展树形框架 [18]。例如，给定示例的最终预测是图 6 所示“树示例”中每棵树预测值之和。


    GBT 背后的共同概念是划分分支，从而产生一组预测值 $y[i]$，然后计算误差 $y[i]-y''[i]$；作为二分类分类器，GBT 被认为是此类场景均值等非二分类数据分类的前沿技术。使用逻辑函数
    $L(x)$ 将预测值 $y''[i]$ 映射到 $[0,1]$，用于将输入分类为失败或非失败的二分类分类器。均方误差 (MSE) 函数 $J = (y[i]-y''[i])^2$
    以及


