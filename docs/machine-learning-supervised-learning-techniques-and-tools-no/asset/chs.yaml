  ### 2.4 GENERALISED LINEAR MODELS WITH SAS


  ![image](img/chapter_title_below.png)


  `GENMOD` 过程估计广义线性模型。其概要语法如下：


  ![image](img/image426.png)


  `BAYES` 语句使用 Gibbs 采样默认执行贝叶斯估计（`DIAGNOSTICS=ALL` 选项执行完整诊断，`PLOTS=TRACE|AUTOCORR|DENSITY|ALL`
  选项执行诊断图，`SAMPLING=ARMS|GIBSS|GAMERMAN|GAM|IN` 选项使用不同采样类型且 `STATISTICS=ALL` 生成所有输出统计量），`CLASS`
  定义模型的分类变量，`EFFECTPLOT` 生成估计模型的图形（可指定 `BOX`、`CONTOUR`、`FIT`、`INTERACTION` 和 `SLICEFIT`
  选项），`EXACT` 对指定参数运行精确检验，`EXACTOPTIONS` 收集应用于 `EXACT` 的选项（最重要的选项是 `METHOD = DIRECT
  |NETWORK| NETWORKMC` 以指定 `EXACT` 使用的算法），`FWDLINK` 指定 `MODEL` 中未指定的链接函数，`INVLINK`
  指定 `FWDLINK` 中定义的链接函数的逆，`LSMEANS` 计算并计算固定效应均值（`CL` 选项计算均值和效应均值差的置信区间，`PLOTS=ALL`
  执行均值和均值比较的图，`MEANS` 计算效应均值且 `ALPHA=α` 设置置信水平`α`），`MODEL` 定义要估计的模型，`OUTPUT` 指定要发送到文件的输出以及
  `BY`、`FREQ` 和 `WEIGHT` 选项具有与所有 SAS 过程中相同的熟悉功能。


