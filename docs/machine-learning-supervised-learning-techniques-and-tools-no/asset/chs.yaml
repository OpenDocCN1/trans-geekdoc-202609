  ### 6.10.2 径向基函数（RBF）


  ![image](img/chapter_title_below.png)


  IBM SPSS 径向基函数（RBF）过程基于预测变量的值为一个或多个因变量（目标变量）生成预测模型。下面描述了使用 MLP 过程的两种情况：


  我们考虑一个银行决策者的例子，他必须确定可以向哪些客户发放贷款并有足够的还款保证。他有一个客户历史数据库，其中他知道客户是否已偿还贷款（`CREDIT_V`）、客户的职业类别（`CAT_PROF`）、其月薪（`PAY_MONTH`）、其年龄（`AGE`）以及是否拥有信用卡（`AMEX`）。利用这些信息，必须建立一个预测模型，预测因变量的类别（在变量
  `CREDIT_V` 中是否偿还信用），以便对申请信用的任何新客户进行分类，已知其自变量的值（`CAT_PROF`、`PAY_MONTH`、`AGE` 和 `AMEX`）。


  我们将使用径向基函数类型的神经网络。为此，在将包含上述变量信息的 `credits.sav` 文件加载到内存后，我们从 SPSS 菜单中选择 分析 → 神经网络
  → 径向基函数（图 6-22）。






  径向基函数屏幕被打开，在其 `Variables` 选项卡（图 6-23）中我们定义模型的因变量、分类自变量（`Factors`）和度量自变量（`Covariates`）。在
  `Partitions` 选项卡（图 6-24）中我们定义文件中将用于网络训练、测试和保留的案例百分比。在 `Architecture` 选项卡（图 6-25）中我们通过允许自动选择架构（推荐选项）或通过自定义网络的隐藏层数、单元数、激活函数、输出层的激活函数以及尺度相关变量的缩放来定义神经网络的架构。`Results`
  选项卡（图 6-26）定义了在神经网络模型拟合中要获得的结果，既包括网络的结构，也包括其性能以及案例处理摘要和自变量的重要性。在 `Save` 选项卡（图 6-27）中我们定义要在数据文件中保存的变量（因变量的预测类别及其概率）。在
  `Export` 选项卡（图 6-28）中我们可以决定将突触权重导出到 XML 文件。在 `Options` 选项卡（图 6-29）中我们可以定义缺失值的处理方式、停止规则、网络的训练时间、用于计算预测误差的数据、要存储在内存中的案例数量以及其他用于调整网络的值。


  点击 `OK` 会生成输出。图 6-30 显示了案例摘要和有关网络的信息。图 6-31 显示了网络结构。图 6-32 显示了拟合到混淆矩阵的网络模型摘要，表明预测已知数据的准确率超过
  90%。图 6-33 显示的 ROC 曲线足够接近上三角，表明拟合良好，并得到曲线下面积为 94.5% 的证实。图 6-34 和 6-35 显示的增益和提升曲线非常接近理论值。图
  6-36 显示了预测变量在排名中的重要性，注意到最具影响力的变量是年龄、薪资和职业类别。


