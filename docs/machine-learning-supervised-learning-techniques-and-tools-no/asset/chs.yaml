  ![image](img/chapter_title_below.png)


  面板数据模型也可以具有滞后变量，并且滞后可能出现在因变量和自变量中，尽管最常见的是滞后出现在因变量中。具有因变量时间滞后的动态面板数据模型将具有以下表达式：


  ![image](img/image360.png)


  为了估计这种类型的模型，通常使用工具变量将滞后的内生变量 `yi,t-1` 替换为与 `yi,t-1` 高度相关且与误差不相关的工具 `y*i,t-1`。需要估计的新模型将为：


  ![image](img/image609.png)


  在这种情况下，可以使用普通最小二乘法进行估计，但很难找到合适的工具变量。关于在实践中应用面板模型中最常用的经济及其他变量的工具可用性，存在大量文献。在使用工具变量估计这种类型的面板时，应特别注意多重共线性和自相关问题。我们也不应忘记异方差性问题，尤其是在样本非常大的情况下。还有用于估计某些动态结构面板的特殊替代方法。Arellano
  和 Bond 的方法为动态面板数据模型的估计提供了解决方案。


