  ![Texto, Carta Descripción generada automáticamente](img/image296.png)


  我们现在处理的是线性概率模型，其中例如 `β1` 衡量在其他条件不变时，`X1` 单位变化导致“成功”概率（`Y = 1`）的变化。


  由于 `Y` 是一个伯努利随机变量：


