  ### 1.6 SAS 与非线性估计。PROC NLIN


  ![image](img/chapter_title_below.png)


  `NLIN` 过程使用最小二乘法或加权最小二乘法拟合非线性模型。估计方法是迭代的，使用 Newton、梯度、Gass-Newton、Marquardt 或假位（DUD）算法。语法如下：


  ![image](img/image581.png)


  `BOUNDS` 语句将估计参数限制为指定条件。`BY` 语句指定变量以执行子组。`DER` 语句指定一阶或二阶偏导数。`ID` 语句指定要添加到输出数据集的附加变量。`MODEL`
  语句定义因变量与自变量之间拟合的关系。`OUTPUT` 语句创建输出数据集。`PARMS` 语句标识要估计的参数及其初始值。`CONTROL` 语句声明控制变量并指定其值。






  `PROC NLIN` 选项有：`DATA=` 输入数据集，`OUTEST=` 迭代中估计值的输出数据集，`SAVE` 指定当迭代超出时保存结果 `BEST=n`
  以便显示残差平方和，`METHOD=GAUSS | MARQUARDT | NEWTON | GRADIENT | DUD` 选择拟合的迭代方法，`MAXSUBIT=n`、`RHO=n`、`SMETHOD=n`
  和 `TAU=n` 控制步长，`G4` 和 `SIGSQ=n` 指定迭代细节，`CONVERGE=c`、`CONVERGEOBJ=c`、`CONVERGEPARM=c`、`SINGULAR=c`
  和 `MAXITER=c` 调整最小化，`HOUGAARD`、`NOITPRINT` 和 `NOPRINT` 修改输出量，`LIST`、`LISTALL`、`LISTCODE`、`LISTDEP`、`LISTDER`
  和 `XREF` 列出模型结构，`FLOW`、`PRINT` 和 `TRACE` 提供模型执行的跟踪。


