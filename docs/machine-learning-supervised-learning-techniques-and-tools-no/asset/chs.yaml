  用于给定的组相关结构，`forcé` 用于在观测值在时间上不等间距时获得估计值，`mnp` 用于作为 N-P 均值的除数，`rgf` 将估计的稳健方差乘以 (N-1)/(N-P)，`scale(x2)`
  使用 Pearson 卡方统计量作为尺度参数，`scale(dev)` 使用自由度之间的方差作为尺度参数，`scale(phi)` 不重新缩放方差，`scale(n)`
  使用 n 作为尺度参数。


