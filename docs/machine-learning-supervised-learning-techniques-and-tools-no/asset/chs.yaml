  #### 1.5.2 使用 SPSS 进行一般和分段非线性估计


  ![image](img/chapter_title_below.png)


  当变量之间的非线性模型更为一般，即除多项式项外还包含其他项时，SPSS 使用非线性回归过程进行估计，该过程使用迭代算法执行非线性最小二乘调整以找到解。作为示例，从文件
  `cars.sav` 中，我们拟合一个将油耗与加速度的平方 (`acel`)、功率的立方 (`hp`) 和排量的对数 (`engine`) 关联的模型。


  要执行非线性回归，请从 `Analyse` 菜单中选择→ `Regression`→ `Non-linear`（图 1-5），并从工作数据文件中的变量列表中选择数值因变量
  `consumption`（图 1-6）。要为模型构造表达式，可以在模型表达式字段中输入表达式，或将组件（变量、参数、函数）粘贴到该字段中。通过点击 Parameters
  并点击 Add 来定义参数，标识模型表达式中每个参数的名称和初始值（图 1-7）。在 Loss 按钮中选择非线性回归中的损失函数（图 1-8），即算法所最小化的函数。选择
  `Sum of squared residuals` 以最小化残差平方和，或选择 `User-defined loss function` 以最小化不同的函数。


  Constraints 按钮允许您输入模型变量的约束条件（图 1-9）。约束是对迭代求解过程中参数允许值的限制。


  Options 按钮对话框（图 1-10）允许您选择自助法估计的标准误差（需要使用序列二次规划算法），估计方法（`Sequential quadratic programming`
  或 `Levenberg-Marquardt`）。序列二次规划方法允许您指定新的最大迭代次数和步长限制值，并且可以更改下拉列表中关于最优性容差、函数精度和无限步长大小的选项。Levenberg-Marquardt
  方法允许您指定最大迭代次数，并且可以更改下拉列表中关于平方和收敛和参数收敛的选项。您可以使用 Save 按钮（图 1-11）将多个新变量保存到活动数据文件中。可用的选项有：预测值、残差、导数和损失函数值。这些变量可在后续分析中使用，以检验模型拟合度或识别问题案例。


