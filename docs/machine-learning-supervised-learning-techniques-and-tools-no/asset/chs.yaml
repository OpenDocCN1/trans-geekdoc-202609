  ## 6.10 SPSS AND neural networks


  ![image](img/chapter_title_below.png)


  Neural networks are the tool of choice for many predictive data mining applications
  because of their power, flexibility and ease of use. Predictive neural networks
  are especially useful in applications where the underlying process is complex; for
  example:


  * Anticipate consumer demand to rationalise production and delivery costs.

  * Predict the probability of response to direct mail marketing to determine to which
  households on a mailing list an offer should be sent.

  * To score an applicant in order to determine the risk involved in granting credit.

  * Detect fraudulent transactions in an insurance claims database.


  Neural networks used in predictive applications, such as multilayer perceptron (`MLP`)
  and radial basis function (`RBF`) networks, are monitored in the sense that the
  results predicted by the model can be compared with the known values of the target
  variables. The neural networks option allows you to fit the `MLP` and `RBF` networks
  and save the resulting models for scoring.


