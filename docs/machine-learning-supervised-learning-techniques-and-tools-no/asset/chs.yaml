  在下面，鉴于线性概率模型的可能缺陷，我们使用 Probit 模型和 Logit 模型解决上述问题。此外，解释变量对女性参与劳动力市场概率的影响以适当的方式进行量化并解释。


  #### Probit 模型


  我们首先考虑 Probit 模型：


  ![image](img/image001.png)


  其中 `Ф` 是正态（0,1）的分布函数。


  我们将首先使用 Probit 模型进行估计。为此，选择 `Quick→ Estimate Equation`，在 Specification 选项卡的 Equation
  Specification 字段中输入拟合模型的方程，在 Method 字段中选择 `BINARY-Binary choice (logit, probit,
  extreme value)`，在 Binary estimation method 字段中选择 `Probit` 以拟合 Probit 模型（图 4-11），然后单击
  OK。


  图 4-12 的结果显示估计参数具有良好的个体显著性（常数和 `kidsge6` 除外）。联合显著性非常高，因为似然比统计量的 p 值非常小。McFadden
  的伪 `R²` 不太接近 1（0.22）。信息准则（Akaike、Schwarz 和 Hannan-Quinn）的值是合适的，因为它们很低且非常接近。


