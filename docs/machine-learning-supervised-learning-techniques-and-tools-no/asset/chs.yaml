  ## 6.9 使用神经网络进行聚类


  ![image](img/chapter_title_below.png)


  聚类技术关注将给定的数据集划分为若干组或类别。它们在医学、生物学、动物学以及尤其是信息技术等许多领域都有应用。已开发的大多数技术可分为三大类：层次、代价或失真最小化和图论。然而，在处理大型数据集时，出于计算复杂度的原因，只有代价最小化技术才适用。


  给定一组数据![image](img/image543.png)对应于随机向量 `X` 的 `n` 个取值，其分布函数 `Fx` 未知，但已知是 `m` 个分布函数的混合，问题是根据某个距离函数或失真度量将数据形成
  `m` 个组或类别，在我们这里将是平方欧几里得距离（平方欧几里得距离）。


  每个组将由其质心，即其均值向量表示。因此，目标是确定 `m` 个质心，![image](img/image101.png)，使得每个数据与其质心之间的失真最小，即最小化：


  ![image](img/image576.png)


  该问题的解导致数据集被划分为 `m` 个类、类别或区域，`Ci`，`i = 1, 2,...,m`，定义如下：


  ![image](img/image587.png)


  注意，对于给定的划分，使失真最小的表示向量 `ωi`，`i = 1, 2,...,m`，也称为原型或参考向量，是组的质心，即：


  ![Imagen que contiene objeto, reloj Descripción generada automáticamente](img/image106.png)


  其中 `ni` 是组 `Ci` 的元素个数。


  将 `N` 个元素划分为 `K` 个组的划分数是：


  ![image](img/image643.png)


  为解决此问题提出了许多算法，例如 Moqueen 于 1967 年提出的 K-means 算法。然而，这些算法导致部分解，即局部最小值，未必是全局最小值（最优解）。因此，该问题的困难在于目标函数有许多局部最小值，它们不一定是全局最小值（最优解）。


  为了进行这种类型的分组，我们将使用具有无监督学习的竞争神经网络，它允许我们将输入数据形成组或类别。每个输入将被分配给被激活的输出单元指定的类。在这种类型的学习中，神经元相互竞争以查看哪个被激活；只有一个被激活，因此通常称为胜者通吃学习。在这里，网络自行（无监督）将数据分组为类别，并为我们提供每个类别的原型。


  这种新的学习范式由 Rumelhart 和 Zipser 于 1985 年提出，名称为竞争学习。网络由 `m` 个神经元或处理单元的一层组成，它们连接到输入信号或模式，这些连接具有相关的突触权重，将代表原型模式。每个神经元只有两种可能的输出值：0（未激活）或
  1（激活），并且对于每个输入模式只有一个神经元被激活，即接收到更高突触电位的那个（获胜神经元）。


  如果神经元 `i` 接收到输入信号 ![image](img/image528.png)并且具有突触权重 `ωi = (ωi1 , ωi2 ,..., ωin)''`，其突触电位由表达式给出：


  ![Texto Descripción generada automáticamente](img/image168.png)


  注意，由于我们定义了突触电位，因此有：


  ![image](img/image195.png)


  其中 `d` 是欧几里得距离。因此，被激活的神经元是其突触权重向量最接近输入模式 `x` 的神经元，即最相似的。


  目标是确保每个神经元的突触权重向量成为其所代表的数据集的质心（原型），即该神经元为获胜者的那些数据。这是通过竞争学习规则实现的。


  为了推导竞争学习规则，我们将考虑一组 `p` 个输入模式，我们用 `xi = (xi1 , xi2 ,..., xin)''`，`i=1, 2,..., p`
  表示，并称之为网络的训练集，因为从中我们将获得网络中每个神经元的突触权重值。如果对于输入 `x` 神经元是获胜者，则是因为其权重向量最相似，因此该输入被分配到类
  `r`。


  这意味着突触权重向量 `ωr` 是代表输入模式 `x` 的那个，并且由于我们希望该表示尽可能好，`ωr` 必须尽可能接近其所代表的组的全部模式。为此，我们必须更新（修改）获胜神经元
  `r` 的突触权重向量 `ωr`，使其更接近输入模式 `s`。也就是说，如果在阶段 `k+1` 我们引入了输入模式 `x` 且神经元 `r` 为获胜者，则我们根据表达式修改其突触权重：


  ![image](img/image461.png)


  其中 `ηr` 是神经元 `r` 的学习率。






  The other neurons do not change their synaptic weights. This is the standard rule
  of competitive learning. Note that it is a linear combination between the input
  vector and the vector of synaptic weights, and the smaller the value of the learning
  rate, the smaller the modification of the synaptic weights. The learning rate of
  each neuron must be a decreasing function with respect to the stage number, so that
  after a suitable number of stages the network stabilises and stops learning. During
  the learning process, an input pattern is introduced at each iteration and the synaptic
  weights are updated, so that the learning process ends after the data set has been
  introduced several times.


  With this network, neurons learn individually to specialise on sets of patterns
  and are thus feature detectors. Each vector of synaptic weights represents the prototype
  of the class or group that defines the corresponding neuron.


  This algorithm is similar to MacQueen''s K-means algorithm, which consists of assigning
  each pattern to the nearest centroid and redetermining the centroids of the new
  groups formed. Ahalt et al. (1990) have shown the convenience of using competitive
  learning to solve our problem as it leads to optimal or near-optimal solutions.


  Ueda and Nakano (1994) have proposed a new competitive learning with a selection
  mechanism based on the equidistortion principle that allows the network to escape
  local minima and Uchiyama and Arbib (1994) have shown the relationship between our
  clustering problem and vector quantization, and present a competitive learning algorithm
  that generates units where the input data density is high, applying it to colour
  image segmentation.


