  ### 6.1.2 Output function and transfer or activation functions


  ![image](img/chapter_title_below.png)


  ––––––––


  ![image](img/scene_break.png)


  The fully interconnected neural network is one in which the nodes in each layer
  are connected to all nodes in the next layer. The input layer has the sole task
  of distributing the information presented to the neural network for processing in
  the next layer. The nodes of the hidden layers and the output layer process the
  signals by applying processing factors, called `weights`. Each layer has an additional
  node called `bias`, which adds an additional term to the output of all nodes in
  the layer. All inputs at a node are weighted, combined and processed through a function,
  called a transfer function or activation function that controls the flow of output
  from that node to connect to all nodes in the next layer. This transfer function
  serves to normalise the output.


  An artificial neural network is nothing more than the connection of several neurons.
  Thus, artificial neurons, also called units, nodes or processing elements, constitute
  the basic unit of a neural network analogous to the biological neuron. These artificial
  neurons operate like simple microprocessors, whose function is to respond to a given
  input pattern. Each processing element, as in a biological neuron, receives inputs
  from other neighbouring nodes, or from the outside, in the case of the input layer,
  and its function is to transform, by means of simple internal calculations, these
  inputs into a single output value which it sends to the other nodes constituting
  their input or, if the neuron in question belongs to the output layer, to the outside.
  The connections between processing elements have a weight or connection strength
  `W` associated with them, which quantitatively determines the effect produced by
  some elements on others. In other words, the network information is stored in the
  weights, just as in biological neuron networks.


  Whether an input has an excitatory or inhibitory effect depends on whether the sign
  of the corresponding weight is positive or negative, respectively. The effectiveness
  of the inputs is determined by the strength of the connection, represented by the
  absolute value of the weights. Thus, each of the elements `Wij` of the weight matrix
  `W`, known as the pattern of connections, represents the strength and direction
  of the relationship of process element `j`, with respect to process element `i`.


