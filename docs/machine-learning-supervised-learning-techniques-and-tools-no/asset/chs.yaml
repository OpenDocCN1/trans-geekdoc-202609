  #### 3.4.3 嵌套 Logit 模型


  ![image](img/chapter_title_below.png)






  嵌套 Logit 模型是条件 Logit 模型的一种特例，其中 `IAI` 假设通过将 `J` 个备选方案分组为 `L` 个相似备选方案的子组而得到放松。它被广泛用于建模消费决策。`IAI`
  在每个组内仍然保持，但在组间不保持。选择过程被视为首先选择 `L` 个组之一 `P(Y G∈L |X)`，然后在该组内选择备选方案 `j` `P(Y = j|Y
  G∈L ,X)`。感兴趣的对象 `P(Y = j| X)` 通过将前两个相乘得到。


  嵌套 Logit 模型可以通过最大似然法进行估计，采用完全信息（两个决策）或 2 阶段法（每个组内每个 `j` 的选择的条件 Logit，然后是选择组 `L`
  的概率）。


