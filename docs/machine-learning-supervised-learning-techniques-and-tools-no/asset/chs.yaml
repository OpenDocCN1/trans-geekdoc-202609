  ### 5.1 面板数据的介绍：数据结构


  ![image](img/chapter_title_below.png)


  面板数据是一种特殊的样本，其中在一段时间内跟踪了若干经济主体的行为。这样，研究人员就可以利用在某一瞬间考虑所有经济主体时获得的横截面（或截面）数据来执行经济分析并设定模型。这样就可以评估所有研究对象在不同时间点上共同表现出的不同行为模式。或者，可以考虑每个经济主体在样本所有时间段内的演变所给出的时间序列来进行同样的分析。在后一种情况下，可以在样本的整个时间间隔内检查个体行为的个体差异模式。


  因此，面板数据结构的一个基本特征是其二维性。一个维度是个体列表，另一个维度是时间点。以西班牙财政研究所编制的个人所得税面板（`IRPF panel`）为例，其目的是建立一个数据库，其中包含同一纳税人逐年的所得税申报表。不同的个体是共同税收领土（不包括巴斯克地区和纳瓦拉自治区）的个人所得税纳税人，目前时间间隔从
  1999 年到 2008 年。


  在下面的段落中，我们更深入地探讨嵌入面板数据集两个维度的数据结构。一方面是横截面或截面数据，另一方面是时间序列数据。


  | ![image](img/chapter_title_corner_decoration_left.png) ||  || ![image](img/chapter_title_corner_decoration_right.png)
  |

  | --- | --- | --- |

  ![image](img/chapter_title_above.png)


  #### 5.1.1 横截面数据


  ![image](img/chapter_title_below.png)


  在应用经济学工作中最重要的数据结构中，我们有横截面数据或截面数据。横截面数据集是由在给定时间点收集的个体、家庭、企业、城市、州、国家或其他各种单位组成的样本。一般来说，我们可以假设横截面数据是通过从总体中随机抽样获得的。例如，如果我们通过从在职人口中随机选择
  500 人来获得工资、教育、经验和其他特征的信息，我们可以说我们拥有整个在职人口的随机样本。


  在我们考虑的个人所得税面板中，我们考虑纳税申报模型中包含的所有变量，并将它们针对某一年度进行分析。考虑到不同的年份，我们将逐年拥有所有横截面。


  横截面数据在经济学和其他社会科学中被广泛使用。在经济学中，横截面数据分析与应用微观经济学的不同分支密切相关，例如税收分析、劳动经济学、州和地方公共财政、产业组织、城市经济学、人口统计学和健康经济学。在某一时间点对个人、家庭、企业和城市的数据对于检验微观经济假设和评估经济政策和财政政策非常重要。


  | ![image](img/chapter_title_corner_decoration_left.png) ||  || ![image](img/chapter_title_corner_decoration_right.png)
  |

  | --- | --- | --- |

  ![image](img/chapter_title_above.png)


  #### 5.1.2 时间序列数据


  ![image](img/chapter_title_below.png)


  时间序列数据集由随时间对一个或多个变量的观测值组成。时间序列数据的典型例子是国内生产总值、货币供应量、消费者价格指数、年度凶杀率或汽车销售数据。由于过去的事件可能对未来的事件产生影响，并且滞后效应在社会科学中对个体的行为很常见，因此时间是时间序列集合中的一个重要参数。与横截面数据的顺序相反，时间序列中观测值的
  chronological 排列确实传达了潜在的重要信息。






  时间序列数据倾向于更多地用于宏观经济分析，而截面数据则主要用于宏观经济分析。时间序列通常比截面数据更难分析，因为我们几乎永远不能假设经济观测在时间上是独立的。


  大多数时间序列，无论是经济的还是非经济的，都与其近期历史相关（通常是强相关）。例如，我们对上季度国民生产总值的了解可以告诉我们很多关于本季度我们可以期望的 GDP
  水平，因为 GDP 倾向于从一个季度到下一个季度保持稳定。时间序列数据的另一个重要特征是其收集的周期性（每周、每月、每季度等），并且许多每周、每月或每季度的序列显示出明显的季节性特征，这可能是时间序列分析方法中的一个重要因素。


  对于个人所得税样本的情况，我们可以考虑衡量 1999-2008 年期间每个税项变量演变的时序。


  | ![image](img/chapter_title_corner_decoration_left.png) ||  || ![image](img/chapter_title_corner_decoration_right.png)
  |


  | --- | --- | --- |


  ![image](img/chapter_title_above.png)


  #### 5.1.3 数据结构。截面组合


  ![image](img/chapter_title_below.png)


  截面或合并数据的组合是一种具有截面数据和时间序列数据两者特征的数据结构。数据池是不同时间点在同一总体中收集的多个截面数据的汇编（但不是针对同一个人）。例如，假设在一个国家进行两次截面家庭调查，一次在
  1985 年，一次在 1990 年。1985 年，进行一次随机抽样调查以获得收入水平、储蓄、家庭规模等变量。在 1990 年，对家庭进行新的随机抽样，并使用与
  1985 年相同的问卷进行调查。为了增加样本量，我们可以通过合并两年数据来形成合并的截面数据集。合并不同年份的截面数据通常对于分析新政府政策的影响很有用。其思想是在关键政策变化之前和之后收集数据。


  总体而言，合并截面数据以与常规截面数据大致相同的方式进行分析，只是我们通常需要考虑变量随时间的变化。事实上，除了增加样本量之外，合并截面数据的目标通常也是观察关键关系如何随时间变化。然而，通过在不同时间点从同一总体中通过随机抽样获得的截面组合，我们将得到独立但不完全相同的分布的观测样本。


  在个人所得税的情况下，可以通过汇集所有每年选定的样本来形成数据池。显然，每年随机选择的个人所得税样本不会对应于同一批个人。


  | ![image](img/chapter_title_corner_decoration_left.png) ||  || ![image](img/chapter_title_corner_decoration_right.png)
  |


  | --- | --- | --- |


  ![image](img/chapter_title_above.png)


  #### 5.1.4 数据结构。面板或纵向数据


  ![image](img/chapter_title_below.png)


  面板数据集，或纵向数据，由截面（或截面数据集）的每个单位的时间序列组成。面板数据是在不同时间点（或不同地理单位或不同企业等）在同一总体中针对同一个人收集的多个截面数据的汇编。


  举例来说，假设我们有一组个人在十年期间的薪资、教育和就业历史记录。我们也可以收集同一组企业在五年期间的财务或投资数据（因此个人不一定是人）。面板数据也可以在地理单位上收集。例如，我们可以收集同一组欧盟国家在
  1990 年、1995 年和 2000 年的移民流动、税收水平、工资、政府支出等数据。面板数据的关键特征，使其与合并截面数据不同，是信息是在不同时间点从同一截面单位（个人、企业、国家等）收集的这一事实。


  由于面板数据收集需要随时间重复相同的调查单位，因此面板数据比合并截面数据更难获得，尤其是在处理个人、家庭或企业数据时。然而，面板数据的优势在于它们通常使我们能够研究行为滞后或决策滞后（动态面板）的重要性。鉴于许多经济措施在实施后一段时间才可能产生影响，这一信息可能非常显著。在个人所得税的情况下，面板是通过随时间跟踪同一个人的申报表形成的。然而，这一概念，即纯面板，可以通过扩展面板技术来完善，这些技术已被用于形成
  IEF 的个人所得税面板，我们将在后面深入讨论。


  但我们不应忘记，面板的基本特征是其时间维度，因为它由在不同时间点，通常是年份，收集的各种个体的观测值组成。然而，面板的显著特征是观测值通常来自不同时间点的同一批个人。此外，当为面板提供信息的来源是行政记录时，几乎没有无应答，这使得可以形成紧凑的面板，非常适合进行免于缺失值和异常值的分析，而无需对缺失信息应用插补方法。探索性数据分析阶段，即在任何面板数据应用之前且对结果至关重要的阶段，因此得到了极大的促进。


  包含个人所得税面板信息的数据库的发展，其数据在收集单位数量及其特征方面日益丰富，再加上用于处理它们的计算机资源能力的提高，最近导致了微观模拟模型的使用激增，目的是估计公共政策的影响。


