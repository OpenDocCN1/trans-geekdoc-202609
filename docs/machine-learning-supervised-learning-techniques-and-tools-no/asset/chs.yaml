  ### 3.8 SAMPLE SELECTION: TRUNCATED MODELS


  ![image](img/chapter_title_below.png)


  A truncated regression model is similar to a censored regression model, but has
  some important differences: in a truncated regression model, we do not have the
  data about some important segment of the population. This is usually the case when
  a sample targets a particular subset of the population and, perhaps because it is
  costly, ignores the rest of the population. This is a particular case of the general
  problem of sample selection, where we observe a non-random sample of the underlying
  population.


  Suppose we have an underlying population model that satisfies the assumptions of
  the classical regression model:


  ![image](img/image476.png)


  If we had a random sample of the population, the most efficient estimation procedure
  would be OLS. However, in the case of the truncated model the problem is that we
  do not have a random sample, because our observed sample has a bound of the type
  `Yi ≤ ci` or `Yi > ci` (Truncated Tobit Model). If we want to estimate `β` and `σ`
  we need to know the distribution of `Yi` given `X` and that `Yi ≤ ci` or `Yi > ci`.
  That is:


  ![Texto, Carta Descripción generada automáticamente](img/image051.png)


  where `f(Y|X ,iβσ² )` is the density of a normal with mean `Xiβ` and variance `σ²`
  and `F(ci |X ,iβσ² )` is the distribution function of a normal with mean `Xiβ` and
  variance `σ` evaluated at `ci`.


  If we divide the density of `Y` given `X` by the probability that `Yi ≤ ci` or `Yi
  > ci` (given `X`), we take logarithms and sum for all `n` maximising the result
  we obtain the MV estimators of `β` and `σ²`, which will be consistent and asymptotically
  normal. But if the assumptions of homoscedasticity and normality are not met, the
  MV estimators will be inconsistent.


