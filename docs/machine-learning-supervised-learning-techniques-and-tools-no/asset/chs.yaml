  As we can see, the network that we describe by means of the expression of ![image](img/image577.png),
  enjoys such a degree of flexibility that it allows all types of functions to be
  adjusted, which is why artificial neural networks are characterised as "universal
  approximators". In other words, a neural network is capable of learning any function.
  The artificial neural network model should be considered as one of a set of non-parametric
  models to which the results of statistical inference can be applied. Thus, the range
  of opportunities is not limited to artificial neural networks, but, on the contrary,
  multiple alternatives such as classification and regression trees (CART) and multivariate
  adaptive regression splines (Friedman, 1991).


