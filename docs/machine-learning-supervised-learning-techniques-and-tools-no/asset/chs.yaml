  ## 6.7 使用神经网络进行时间序列分析


  ![image](img/chapter_title_below.png)


  时间序列由多个变量的值序列组成，这些值随时间演变（变化）。目标是基于历史数据集合，预测产生这些值的现象或动态系统的未来行为。例如，预测电力消耗或预测某一地区将需求的流感疫苗数量。解决这些问题的最佳方法是找到产生这些过程的潜在规律。该规律可以通过解析方法获得，例如一组微分方程。然而，我们对过程的了解通常是部分或不完整的，因此，预测无法通过已知的解析模型进行。我们将尝试在时间序列观测中发现一些强经验规律。在许多现实世界问题中，一些规律，如周期性，被噪声掩盖，甚至一些动态过程由混沌时间序列描述，其中数据看起来随机，没有明显的周期性。


  尽管混沌阻止了任何长期预测，然而，使用人工神经网络进行短期预测取得了令人鼓舞的结果，人工神经网络由非线性多元函数描述：


  ![image](img/image713.png)


  其中![image](img/image665.png)，`t = m, m-1,....,k`，是时间序列的给定样本，`F` 是未知的非线性函数且 `k<m`。


  大多数可用技术假设变量之间或时间滞后的变量之间存在线性关系。但这些技术通常不足以分析现实世界的时序数据，因为它们无法解释振幅大且时间间隔不规则的突然变化。合理非线性模型的构建是一项非常困难的任务。因此，由于目标是做出良好的预测，神经网络是计算预测的良好替代方案。Lapides
  和 Fraber（1987）是应用神经网络对简单（无噪声）系统建模及其预测的先驱。至少目前为止，主要问题是难以为每种情况找到合适的网络；没有固定规则可以确定每种研究案例的适当神经网络架构。La
  Fuente 和 Pino（1995）的工作对 Box-Jenkins 方法论与神经网络之间的预测计算进行了比较分析，并提出将 Box-Jenkins 方法论用作神经网络结构设计的前置步骤。


