  #### 3.4.2 条件 Logit 模型


  ![image](img/chapter_title_below.png)


  条件 Logit 模型用于个体（或企业）的选择至少部分基于每个备选方案的可观测属性的问题。在多项 Logit 中，解释变量在备选方案之间不发生变化，即对每个 i，`Xi`
  包含特定于个体的变量，而非特定于备选方案的变量，适用于备选方案特征不重要（或我们未观察到它们）的情况。在条件 Logit 模型中，对每个 i，`Xi` 包含个体特定和备选方案特定的变量，适用于备选方案特征可被观察到的情况。


  假设我们从基础总体中抽取了大小为 n 的随机样本（i = 1,..., n）。选择备选方案 j 的效用为：


  ![image](img/image290.png)


  其中 `aij` 是影响偏好的不可观测因素，而 `Xij` 在备选方案之间（也许也在个体之间）变化，但不能包含仅在个体之间变化的元素（不包含常数项）。


  例如，我们可以考虑个体 i 使用交通方式 j 通勤所需的时间或交通方式 j 的成本（可能在个体之间变化也可能不变）。


  如果扰动项 `atij` 独立服从 Weibull 分布且：


  ![Texto, Carta Descripción generada automáticamente](img/image284.png)


  其中 `βk` 是 `β` 的第 k 个元素。


  条件 Logit 模型的估计通过最大似然法进行。


  在条件 Logit 模型中，无关替代品独立性 IAI 假设也得到满足，因为选择 2 个备选方案的概率之比（`Y= j` 而非 `Y=h`）与剩余备选方案无关。
  有


  ![image](img/image571.png)


  无关替代品独立性 IAI 假设源于扰动项独立性假设，对估计很方便，但在某些具有相似备选方案的应用中可能是不现实的限制。无关替代品独立性 IAI 假设认为，两个现有备选方案的相对可能性不受引入第三个备选方案的影响。可以使用
  Hausman 和 McFadden 提出的检验来检验 IAI 假设。


