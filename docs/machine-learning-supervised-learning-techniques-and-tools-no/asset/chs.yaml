  and a constant ( ![image](img/image474.png) ).


  This first part, as is logical, captures the linear dependencies between the input
  patterns and the outputs of the network. The second part, which is the third term
  of the previous formulation, captures, if they exist, the non-linear dependencies
  between the input variables and the output of the network, given that the function
  used is non-linear. Concretely, this third term is a composition, weighted with
  the synaptic weights of the intermediate neurons to the output neurons ![image](img/image282.png)
  of sigmoidal functions of the network inputs, the latter weighted by the connection
  strength of the input units to the intermediate ones. This model can be considered
  an extension of the well-known and frequently used linear models, since it is composed
