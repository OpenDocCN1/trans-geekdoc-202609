  ### 3.1 limited dependent variable models


  ![image](img/chapter_title_below.png)


  The functional expression of the multiple regression analysis model is ![image](img/image451.png).
  Multiple regression admits the possibility of working with dependent variables whose
  range of values is restricted (binary variables with values 0 and 1, variables with
  positive integer values, etc.). In general, models that admit dependent variables
  with restricted range are called limited dependent variable models.


  Most of the economic variables under analysis have values that are constrained in
  some way, often because they must be positive. For example, hourly wages, house
  prices, and nominal interest rates must be greater than zero. But not all of these
  variables require special treatment. No special econometric model is usually needed
  to deal with variables that are strictly positive but take many different values.
  When the dependent variable is discrete (discrete choice models) and takes a small
  number of values, it does not make sense to treat it as if it were an approximately
  continuous variable. The fact that the dependent variable is discrete does not necessarily
  imply that linear models are not appropriate. However, for binary responses (binary
  choice models), Logit and Probit models and in certain cases the linear probability
  model are often used. Also for multiple responses (multiple choice models), logit
  and probit models are used.


  Another important example of a limited dependent variable is the count variable,
  which takes non-negative integer values. A count data model is one that has as its
  dependent variable a discrete count variable that takes non-negative integer values.
  Poisson regression models are appropriate for analysing count variables.


  In econometric analysis, other types of limited dependent variables appear, especially
  when we analyse the behaviour of individuals, households, or firms. For example,
  suppose that during a given year a large number of households in a region do not
  make any charitable donations. Therefore, the population distribution of donations
  made by households is highly dispersed over positive values, but with a high concentration
  at zero. This is an example of a corner solution. The Tobit model is explicitly
  designed for dependent variables that have corner solutions. These variables are
  zero for a considerable proportion of the population but are approximately continuously
  distributed for positive values.






  另一种受限因变量是由数据删失引起的。删失回归模型是指其因变量在某个值以上（上删失）或以下（下删失）被删失的模型，即对于总体的一部分，因变量未被观测到。在删失回归模型中，潜在的因变量近似连续，但由于数据收集方式或制度性约束而被下删失或上删失。截断回归模型与删失回归模型相似，但有一个重要区别：在截断回归模型中，我们没有关于总体中某个重要部分的<|message|>数据。这通常发生在样本针对总体中的特定子集时，并且可能由于成本原因而忽略其余总体。这是样本选择这一更一般问题的特例，在该问题中，我们观测到的是总体中一个非随机的样本。


