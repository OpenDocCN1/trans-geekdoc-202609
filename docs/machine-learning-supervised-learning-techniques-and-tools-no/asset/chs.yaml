  ![image](img/chapter_title_below.png)


  考虑以下一般面板数据模型：


  ![image](img/image361.png)


  其中 i= 1,...,N 为样本观测值，t=1,...,T 为时间点。


  假设该模型的残差可以分解为与样本观测值或个体无关时间的分量`αi`、与时间点无关个体的分量`ϕt`，以及与个体和时间点变化相关的分量`εit`。我们就可以将面板模型写为如下形式：


  ![image](img/image482.png)


  当样本观测值（个体）很多而时间点（地理区域、公司等）较少时，样本中由于时间点引起的变化可通过引入 T-1 个与每个时间点相关联的二元变量 `dt` 来捕捉（减去一个作为参考以避免多重共线性）。变量
  `d1` 在观测值指时间点 1 时取值为 1，对其余时间单位取值为 0。类似地，当样本观测值较少而时间点很多时，样本中不同个体间的差异可通过包含 N-1 个与每个样本个体相关联的二元变量
  `and i` 来捕捉（减去一个作为参考以避免多重共线性）。这些变量对给定个体取值为 1，对其余个体取值为 0。


