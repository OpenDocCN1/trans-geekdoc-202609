  ### 5.11 stata 与面板数据模型


  ![image](img/chapter_title_below.png)


  `STATA` 具有 `xtreg` 命令，允许估计具有固定效应和随机效应面板数据的模型。其语法如下：


  随机效应模型


  ```

  xtreg dependent_independent variable independent variables, re options

  ```


  最重要的选项是 `i(variable)` 用于指示面板 ID 变量，`sa` 用于使用 Swamy-Arora 方差复合估计量，`vce(type)` 用于指示稳健、Bootstrap
  或 Jackknife 估计的类型，`cluster` 用于调整组内相关性的标准误，以及 `level(n)` 用于置信水平 n。


  使用回归估计器之间估计的模型


  ```

  xtreg dependent_independent variable independent variables, be options

  ```


  最重要的选项是 `i(variable)` 用于指示面板 ID 变量，`wls` 用于使用加权最小二乘估计量，`vce(type)` 用于指示 Bootstrap
  或 Jackknife 估计类型以及 `level(n)` 用于置信水平 n。


  ![image](img/scene_break.png)


  固定效应模型


  ```

  xtreg independent_dependent variable independent variables, fe options

  ```


  最重要的选项是 `i(variable)` 用于指示面板 ID 变量，`vce(type)` 用于指示稳健、Bootstrap 或 Jackknife 估计的类型，`cluster`
  用于调整组内相关性的标准误，以及 `level(n)` 用于置信水平 n。


  最大似然随机效应模型


  ```

  xtreg dependent_independent variable independent variables, mle options

  ```


  最重要的选项是 `i(variable)` 用于指示面板 ID 变量，`noconstant` 用于从模型中移除常数项，`vce(type)` 用于指示 Bootstrap
  或 Jackknife 估计的类型以及 `level(n)` 用于置信水平 n。


  总体平均模型


  ```

  xtreg dependent_independent variable independent variables, pa options

  ```






  最重要选项是 `i(variable)` 用于指示面板 ID 变量，`noconstant` 用于从模型中移除常数项，`offset(variable)` 用于将变量以系数限制为
