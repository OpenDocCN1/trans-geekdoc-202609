  ### 5.7 随机效应面板模型


  ![image](img/chapter_title_below.png)


  在随机效应模型中，`αi` 和/或 `ϕt` 在个体间和随时间随机变化。模型不再具有确定性分量。其方程保持为：


  ![image](img/image469.png)


  但现在，误差或`it` 具有个体随机分量`αi`，该分量在时间点上不变并表征每个个体。该分量称为“组间”分量。


  反过来，误差或`it` 具有随机时间分量`ϕt`，该分量在个体间不变并表征每个时间点。该分量称为“组内”分量。


  最后，误差或`it` 还具有分量`εit`，该分量在个体间和随时间随机变化。


  在随机效应模型中，误差的所有分量 `αi` 、 `ϕt` 、 `εit` 均为随机且服从均值为零的正态分布。此外，它们彼此不相关 ![image](img/image155.png)
  对每个个体 ![image](img/image484.png) ，且对每个时间点 t≠ s)，它们具有恒定方差（同方差性）并满足外生性假设 ![image](img/image433.png)
  对每个个体 ![image](img/image484.png)，且对每个时间点 ![image](img/image542.png)


  同时也满足 ![image](img/image048.png)![image](img/image523.png)![image](img/image566.png)


  总误差方差应为


  ![image](img/image197.png)






