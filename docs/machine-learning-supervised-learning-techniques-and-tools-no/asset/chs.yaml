  此外，该模型允许因变量具有非正态分布。广义线性模型涵盖了最常用的统计模型，例如正态分布响应变量的线性回归、二元数据的逻辑模型、计数数据的对数线性模型、区间删失生存数据的互补对数-对数模型，以及通过模型本身的一般公式化而来的许多其他统计模型。


  相对于一般线性模型而言，广义线性模型的主要改进在于可以指定因变量的分布为除正态分布以外的特定分布，并且可以指定除恒等以外的链接函数。如果因变量的分布为正态且链接函数为恒等，则为一般线性模型。


