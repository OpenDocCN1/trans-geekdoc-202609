  我们于是面临一个具有异方差性的模型，因为误差方差不是常数，对于 `X1 ,...,Xk` 的每个取值，误差方差都有不同的值（`V(u)` 不是常数）。此外，`Y`
  是一个伯努利变量，因此正态性假设也得不到满足。这使得有必要通过普通最小二乘法的替代方法来估计这些模型，例如使用最大似然估计量或广义最小二乘法。


