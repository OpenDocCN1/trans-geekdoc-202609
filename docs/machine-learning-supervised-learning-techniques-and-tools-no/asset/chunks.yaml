    where i= 1,...,N sample observations and t=1,...,T time instants.


    Let us assume that the residuals of this model can be decomposed into a componentαi 
     relating to the sample observations or individuals independent of time, a componentϕt
    relating to the time instants of the panel independent of individuals, and a componentεit 
     relating to the variation across individuals and across time instants. We can
    then write the panel model as follows:


    ![image](d2d_images/image482.png)


    When there are many sample observations (individuals) and few time instants (geographical
    regions, companies, etc.) the variation in the sample due to time instants is
    captured by introducing T-1 dichotomous variables dt  associated with each of
    the time instants (minus one which is taken as a reference to avoid multicollinearity).
    The variable d1  takes the value of 1 in the case that the observation refers
    to time instant 1 and takes the value 0 for the rest of the time units. Similarly,
    when there are few sample observations and many time instants, differences across
    the different individuals in the sample are captured by including N-1 dichotomous
    variables andi associated with each of the sample individuals (minus one which
    is taken as a reference to avoid multicollinearity). These variables take the
    value of 1 for a given individual and 0 for the rest.


