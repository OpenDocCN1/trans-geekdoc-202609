    # 6.12  ​​R AND TIME SERIES USING NEURAL NETWORKS


    ![image](d2d_images/chapter_title_below.png)


    R has the nnetar command in the forecast library that allows predicting time series
    through neural networks.


    Let us consider the monthly series X of the seasonal.sav file starting in January
    1968 and ending in October 1981. The aim is to calculate a year of predictions
    using neural networks.


    We start by reading the series and giving it the structure of a time series.


    ![image](d2d_images/image027.png)


    The appropriate neural network model to obtain the pedictions is then estimated.


    ![Texto, Carta Descripción generada automáticamente](d2d_images/image579.png)


    Next we perform the model diagnosis by performing the residual analysis and calculating
