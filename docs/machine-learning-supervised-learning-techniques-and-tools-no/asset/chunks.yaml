    文件 `4-3.wf1` 包含 1445 名囚犯的数据，关于囚犯获释后被重新逮捕前的月数（`durat`）。认为 `log(durat)` 取决于囚犯是否参与了监狱就业项目（`workprg`）、之前的定罪次数（`priors`）、在监狱中服刑的月数（`tserved`）、囚犯是否使用酒精（`alcohol`）、囚犯是否使用毒品（`drugs`）、所犯的罪行是否严重（`felon`）、囚犯是否为黑人（`black`）、囚犯是否已婚（`married`）、囚犯的教育水平（`educ`）和囚犯的年龄（`age`）。还已知在
    1445 名囚犯中，有 893 人在被跟踪期间未被逮捕。我们还拥有一个指示每个观测值是否被删失的虚拟变量（`cens`）。


    基于上述信息，使用 Tobit 模型，估计并解释 `log(durat)` 变量与剩余解释变量之间的关系，并解释结果。


    由于有囚犯在最后一次获释后未被重新逮捕，我们处理的是右删失的 Tobit 模型，删失由充当删失指示变量的删失变量定义。


