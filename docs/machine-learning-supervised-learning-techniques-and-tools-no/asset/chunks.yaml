    ## 面板数据的广义线性模型。非线性面板模型


    ![image](img/chapter_title_below.png)


    | ![image](img/chapter_title_corner_decoration_left.png) ||  || ![image](img/chapter_title_corner_decoration_right.png)
    |

    | --- | --- | --- |

    ![image](img/chapter_title_above.png)


    ### 5.1 面板数据的介绍：数据结构


    ![image](img/chapter_title_below.png)


    面板数据是一种特殊的样本，其中在一段时间内跟踪了若干经济主体的行为。这样，研究人员就可以利用在某一瞬间考虑所有经济主体时获得的横截面（或截面）数据来执行经济分析并设定模型。这样就可以评估所有研究对象在不同时间点上共同表现出的不同行为模式。或者，可以考虑每个经济主体在样本所有时间段内的演变所给出的时间序列来进行同样的分析。在后一种情况下，可以在样本的整个时间间隔内检查个体行为的个体差异模式。


    因此，面板数据结构的一个基本特征是其二维性。一个维度是个体列表，另一个维度是时间点。以西班牙财政研究所编制的个人所得税面板（`IRPF panel`）为例，其目的是建立一个数据库，其中包含同一纳税人逐年的所得税申报表。不同的个体是共同税收领土（不包括巴斯克地区和纳瓦拉自治区）的个人所得税纳税人，目前时间间隔从
    1999 年到 2008 年。


    在下面的段落中，我们更深入地探讨嵌入面板数据集两个维度的数据结构。一方面是横截面或截面数据，另一方面是时间序列数据。


    | ![image](img/chapter_title_corner_decoration_left.png) ||  || ![image](img/chapter_title_corner_decoration_right.png)
    |

    | --- | --- | --- |

    ![image](img/chapter_title_above.png)


    #### 5.1.1 横截面数据


    ![image](img/chapter_title_below.png)


    在应用经济学工作中最重要的数据结构中，我们有横截面数据或截面数据。横截面数据集是由在给定时间点收集的个体、家庭、企业、城市、州、国家或其他各种单位组成的样本。一般来说，我们可以假设横截面数据是通过从总体中随机抽样获得的。例如，如果我们通过从在职人口中随机选择
    500 人来获得工资、教育、经验和其他特征的信息，我们可以说我们拥有整个在职人口的随机样本。


    在我们考虑的个人所得税面板中，我们考虑纳税申报模型中包含的所有变量，并将它们针对某一年度进行分析。考虑到不同的年份，我们将逐年拥有所有横截面。


    横截面数据在经济学和其他社会科学中被广泛使用。在经济学中，横截面数据分析与应用微观经济学的不同分支密切相关，例如税收分析、劳动经济学、州和地方公共财政、产业组织、城市经济学、人口统计学和健康经济学。在某一时间点对个人、家庭、企业和城市的数据对于检验微观经济假设和评估经济政策和财政政策非常重要。


    | ![image](img/chapter_title_corner_decoration_left.png) ||  || ![image](img/chapter_title_corner_decoration_right.png)
    |

    | --- | --- | --- |

    ![image](img/chapter_title_above.png)


    #### 5.1.2 时间序列数据


    ![image](img/chapter_title_below.png)


    时间序列数据集由随时间对一个或多个变量的观测值组成。时间序列数据的典型例子是国内生产总值、货币供应量、消费者价格指数、年度凶杀率或汽车销售数据。由于过去的事件可能对未来的事件产生影响，并且滞后效应在社会科学中对个体的行为很常见，因此时间是时间序列集合中的一个重要参数。与横截面数据的顺序相反，时间序列中观测值的
    chronological 排列确实传达了潜在的重要信息。


    '
  toc: []
- raw: 'Time series data tend to be used more in macroeconomic analysis, as opposed
    to cross-sectional data, which are mostly used in macroeconomic analysis. Time
    series are often more difficult to analyse than cross-sectional data because we
    can almost never assume that economic observations are temporally independent.


    Most time series, whether economic or not, are related (often strongly related)
    to their recent history. For example, our knowledge of last quarter''s gross national
    product tells us quite a lot about the level of GDP we can expect for the current
    quarter since GDP tends to remain stable from one quarter to the next. Another
    important characteristic of time series data is the periodicity with which they
    are collected (weekly, monthly, quarterly, etc.) with the additional fact that
    many weekly, monthly or quarterly time series show a marked seasonal characteristic
    which can be an important factor in the methodology of time series analysis.


    For the case of the personal income tax samples we can consider the time series
    measuring the evolution of each tax variable over the period 1999-2008.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    | --- | --- | --- |


    ![image](d2d_images/chapter_title_above.png)


    # 5.1.3  Data structures. Combinations of cross-sections


    ![image](d2d_images/chapter_title_below.png)


    A combination of cross\-sectional or pooled data is a data structure that has
    characteristics of both cross-sectional and time-series data. A data pool is an
    amalgamation of several cross-sections of data collected at different points in
    time in the same population (but not for the same individuals). For example, suppose
    two cross-sectional household surveys are conducted in a country, one in 1985
    and one in 1990. In 1985, a survey is conducted with a random sample to obtain
    variables such as the level of income, savings, household size, etc. In 1990,
    a new random sample of households is taken and the same questions as in 1985 are
    used to conduct the survey. In order to increase the sample size, we can form
    a merged cross-sectional data set by combining the data from two years. Merging
    cross-sectional data from different years is often useful for analysing the effects
    of new government policies. The idea is to collect data from the years before
    and after a key policy change.


    Generally, merged cross-sectional data are analysed in much the same way as conventional
    cross-sectional data, except that we often need to account for differences in
    variables over time. In fact, in addition to increasing the sample size, the goal
    of merging cross-sectional data is often also to look at how a key relationship
    has changed over time. However, by combining cross-sections obtained by random
    sampling from the same population at different points in time, we will have a
    sample of independently but not identically distributed observations.


    In the case of personal income tax, a data pool could be formed by pooling all
    annually selected samples. Obviously the personal income tax samples randomly
    selected each year will not correspond to the same individuals.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    | --- | --- | --- |


    ![image](d2d_images/chapter_title_above.png)


    # 5.1.4  Data structures. Panel or longitudinal data


    ![image](d2d_images/chapter_title_below.png)


    A panel data set, or longitudinal data, consists of a time series for each unit
    of a cross-section (or cross-sectional data set). A panel data is an amalgamation
    of several cross-sections of data collected at different points in time (or in
    different geographical units or for different enterprises, etc.) in the same population
    for the same individuals.


    As an example, suppose we have a record of data on the salary, education, and
    employment history of a set of individuals followed over a ten-year period.  We
    could also collect information on the financial or investment data of the same
    set of firms over a five-year period (so the individuals need not be persons).
    Panel data can also be collected on geographical units. For example, we can collect
    data on immigration flows, level of taxation, wages, government expenditures,
    etc., in the same set of EU countries for the years 1990, 1995 and 2000. The key
    feature of panel data, which differentiates it from merged cross-section data,
    is the fact that information is collected from the same cross-section units (individuals,
    firms, countries, etc.) at different points in time.


    Because panel data collection requires repeating the same survey units over time,
    panel data are more difficult to obtain than merged cross-sectional data, especially
    when dealing with data on individuals, households or firms. However, an advantage
    of panel data is that they often allow us to study the importance of lags in behaviour
    or lags in decision-making (dynamic panels). This information can be very significant
    given that many economic measures can be expected to have no impact until some
    time after their implementation. In the case of personal income tax, a panel is
    formed by following the returns of the same individuals over time. However, this
    concept, known as a pure panel, can be completed by means of expanded panel techniques,
    which have been used to form the personal income tax panel of the IEF and to which
    we will refer in depth later on.


    But we should not forget that the essential characteristic of a panel is its temporal
    dimension, since it is made up of observations on a wide variety of individuals
    taken at different points in time, usually years. However, the distinguishing
    feature of a panel is that the observations usually come from the same individuals
    at different points in time. Moreover, when the source of information that feeds
    the panel is administrative records, there is practically no non-response, which
    makes it possible to form compact panels that are ideal for analysis free of missing
    values and outliers without the need to apply imputation methods for missing information.
    The stage of exploratory data analysis, which precedes any application with panel
    data and is decisive for the results, is thus strongly favoured.


    The development of a database such as the one containing the information from
    the personal income tax panel with increasingly richer data in terms of the number
    of units collected and their characteristics, together with the increase in the
    power of computer resources for their processing, has recently led to a proliferation
    in the use of microsimulation models with a view to estimating the effects of
    public policies.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    | --- | --- | --- |


    ![image](d2d_images/chapter_title_above.png)


    # 5.2  PURE PANELS AND EXPANDED PANELS


    ![image](d2d_images/chapter_title_below.png)


    A pure panel follows the same individuals over the entire time period. This causes
    problems of loss of representativeness of the sample as time progresses, since
    there are individuals who may drop out of the sample for different reasons. In
    this way, the panel wears out over time (attrition) and can become invalid.'
