    ![image](d2d_images/chapter_title_below.png)


    We will initially fit a linear probability model to data on 753 married women
    in 1975 (file `married.wf1`), of whom 428 participated in the labour market at
    some point during the year (`inlf`=1) and 325 did not participate (`inlf`=0).


    The probability of participating in the labour market (`inlf`) is considered to
    depend on other sources of income (`nwifeinc`), years of education (`educ`), years
    of work experience (`exper` and `exper²`), age, number of children under 6 (`kidslt6`)
    and number of children between 6 and 18 (`kidsg6`).


    Using a linear probability model we will analyse the dependence of the probability
    of female labour market participation on the explanatory variables defined above.


    ### Linear Probability Model


    We will consider the following linear probability model (LPM):


    ![image](d2d_images/image158.png)


    We will start by estimating the MLP using OLS. To do so, choose `Quick→ Estimate
    Equation`, write the equation of the model to be fitted in the Equation Specification
    field of the Specification tab, choose `LS-Least Squares (NLS and ARMA)` in the
    Method field to fit by ordinary least squares (Figure 4-1) and click OK. The results
    in Figure 4-2 are obtained with good individual and joint significances for the
    estimated parameters (except maybe `kidsge6`). The `R²` and the Durbin Watson
    statistic are not very good, but we have to think that we are estimating a linear
    probability model.


    ![image](d2d_images/image068.png)![image](d2d_images/image207.png)


    Figure 4-1      Figure 4-2


    But the relevant problem in a MLP is heteroscedasticity. `View→ Residual Tests→
    White Heteroskedasticity` (Figure 4-3) yields p-values of F and Chi less than
    0.05 (Figure 4-4), so there is heteroscedasticity. We will then use a method that
    is robust to heteroscedasticity, for example White''s method, for estimation.
    The estimation using White''s method is now done by filling in the Options tab
    of the Equation Estimation screen as shown in Figure 4-5. Clicking OK produces
    the non-heteroscedastic estimate in Figure 4-6.


    ![image](d2d_images/image334.png)![image](d2d_images/image550.png)


    Figure 4-3      Figure 4-4


    ![image](d2d_images/image638.png)![image](d2d_images/image598.png)


    Figure 4-5      Figure 4-6


    Except for `kidsge6` all variables are statistically significant and have the
    expected signs. There is also a strong joint significance. Interpreting the coefficients
    shows that if education increases by one year (and all other variables remain
    constant), women''s probability of participating in the labour market increases
    by 0.038. The effect of other sources of income (`nwifeinc`) is significant, but
    very small, since if other income increases by one unit, women''s probability
    of participating in the labour market decreases by 0.0034 (with all other factors
    held constant).


    By varying experience by one year, with all other factors fixed, the estimated
    variation in women''s probability of labour market participation is given by `0.039-2(0.0006)exper`.
    The point at which experience does not affect the probability of participation
    (and from which the slope changes sign) is `0.039/0.0012=32.5` (there are only
    13 women with `exper>32`). As age increases by one year (all other things being
    equal), women''s probability of participating in the labour market decreases by
    0.016. Having one more child under the age of 6 reduces women''s probability of
    participating in the labour market by 0.262, for given levels of the other variables.
    Having a child between 6 and 18 increases the probability of female labour market
    participation by 0.013, for fixed levels of the other variables.


    One of the major problems with MLP is that for certain combinations of values
    of the explanatory variables, the estimated probabilities may be less than 0 or
    greater than 1:


    ![image](d2d_images/image102.png)


    To do so, click on Forecast and fill in the forecast screen as shown in Figure
    4-7 (the variable `inlff` contains the values of ![image](d2d_images/image125.png)
    for the 753 women in the sample). When we click OK we obtain Figure 4-8 representing
    ![image](d2d_images/image125.png), noting that there are values greater than unity
    and less than 0). In fact, if we double-click on the variable `inlff` in the Workfile
    screen, we see its values. Figure 4-9 shows some values greater than unity, Figure
    4-10 shows values less than zero. In total there are 17 values of ![image](d2d_images/image125.png)
    greater than one and 16 less than zero.


    Another inconsistency of the MLP is that the effect on the likelihood is the same
    for all values of the explanatory variables.


    ![image](d2d_images/image442.png)![image](d2d_images/image263.png)


    Figure 4-7      Figure 4-8


    ![image](d2d_images/image450.png)![image](d2d_images/image378.png)


    Figure 4-9      Figure 4-10


    In the following, given the possible shortcomings of the linear probability model,
    we solve the above problem using a Probit model and a Logit model. In addition,
    the effects of the explanatory variables on women''s probability of participating
    in the labour market are quantified and interpreted in the appropriate way.


    ### Probit Model


    We will first consider the Probit model:


    ![image](d2d_images/image001.png)


    where `Ф` is the distribution function of a normal (0,1).


    We will start by estimating using the probit model. To do this, choose `Quick→
    Estimate Equation`, type the equation of the model to be fitted in the Equation
    Specification field of the Specification tab, choose `BINARY-Binary choice (logit,
    probit, extreme value)` in the Method field, choose `Probit` in the Binary estimation
    method field to fit the Probit model (Figure 4-11) and click OK.


    The results in Figure 4-12 are obtained with good individual significances for
    the estimated parameters (except for the constant and `kidsge6`). The joint significance
    is very high because the p-value of the likelihood ratio statistic is very small.
    McFadden''s Pseudo `R²` is not very close to unity (0.22). The values of the information
    criteria (Akaike, Schwarz and Hannan-Quinn) are adequate because they are low
    and very close.


    ![image](d2d_images/image624.png)![image](d2d_images/image223.png)


    Figure 4-11      Figure 4-12


    Another criterion to measure the goodness of fit of the Probit model is the criterion
    of the percentage of correct predictions which consists of observing the percentage
    of times the observed Y valuei matches its prediction. This task is carried out
    with Eviews through `View → Expectation-Prediction Table` (Figure 4-13).


    Clicking OK produces the output in Figure 4-14, which shows that the model adequately
    predicts 73.44% of the observations. The ones (female labour market participation)
    are better predicted with 81.31% correct compared to 63.08% for non-participation.


    ![image](d2d_images/image640.png)![image](d2d_images/image706.png)


    Figure 4-13      Figure 4-14


    To quantify and interpret the effects of the explanatory variables on women''s
    probability of participating in the labour market, we will bear in mind that the
    partial effect of a continuous explanatory variable `Xj` on the response probability
    `P(Y \= 1|X)` is:


    ![image](d2d_images/image018.png)


    Since we have one effect for each observation, we will avoid calculating 753 effects
    by calculating the effects for the mean observations. To do so, we calculate the
    means of the variables in the model by selecting them in the Workfile screen and
    opening them as a group with the right mouse button using `Open → as Group` (Figure
    4-15). Then choose `View → Descriptive Statistics→ Individual samples` (Figure
    4-16) and obtain the descriptive statistics for all variables in the model, including
    the mean (Figure 4-17).


    ![image](d2d_images/image395.png)![image](d2d_images/image700.png)


    Figure 4-15      Figure 4-16


    ![image](d2d_images/image359.png)


    Figure 4-17


    ––––––––


    ![image](d2d_images/scene_break.png)


    We have:


    ![image](d2d_images/image503.png)


    with what:


    ![image](d2d_images/image240.png)


    `ϕ` = Density function of the normal (0,1)

