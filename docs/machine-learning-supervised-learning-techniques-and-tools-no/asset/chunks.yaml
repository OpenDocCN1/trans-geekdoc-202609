    # 6.7  ​​​​​​​TIME SERIES ANALYSIS USING NEURAL NETWORKS


    ![image](d2d_images/chapter_title_below.png)


    A time series consists of a sequence of values of several variables that evolve
    (change) over time. The aim is to predict the future behaviour of the phenomenon
    or dynamic system that generates these values based on a collection of historical
    data. For example, predicting electricity consumption or predicting the number
    of flu vaccines that will be demanded in a given region. The best way to solve
    these problems is to find the underlying law that generates these processes. This
    law can be obtained by analytical methods, such as a set of differential equations.
    However, the information we will have about the process will generally be partial
    or incomplete and, therefore, the prediction cannot be made by means of a known
    analytical model. An attempt will be made to discover some strong empirical regularity
    in the time series observations. In many real-world problems some regularities,
    such as periodicity, are masked by noise, and even some dynamic processes are
    described by chaotic time series, where the data appear random with no apparent
    periodicities.


    Although chaos prevents any long-term prediction, however, promising results for
    short-term predictions are achieved using artificial neural networks that are
    described by a non-linear multivariate function:


    ![image](d2d_images/image713.png)


    where![image](d2d_images/image665.png), t = m, m-1,....,k, are the given samples
    of the time series, F is an unknown non-linear function and k<m.


    Most of the available techniques assume linear relationships between variables
    or between variables lagged in time. But these techniques are often inadequate
    for analysing real-world temporal data because of their inability to account for
    sudden changes of large amplitude and at irregular time intervals. The formulation
    of reasonable non-linear models is a very difficult task. Therefore, since the
    goal is to make good forecasts, neural networks are a good alternative for the
    calculation of predictions. Lapides and Fraber (1987) were the pioneers in applying
    neural networks for modelling simple (noise-free) systems and their prediction.
    The main problem, at least for the time being, is the difficulty of finding the
    appropriate network for each case; there are no fixed rules that determine the
    appropriate neural network architecture for each case of study. The work of La
    Fuente and Pino (1995) presents a comparative analysis for the calculation of
    forecasts between Box-Jenkins methodologies and neural networks and proposes the
    use of the Box-Jenkins methodology as a prior step to the design of the neural
    network structure.


    The multilayer perceptron is the most widely used model of artificial neural networks
    for predicting future values. The output unit gives a linear combination of the
    outputs of all hidden units:


    ![image](d2d_images/image061.png)


    whereψj is the activation function. The synaptic weightsωji andωj are adjusted
    during the learning process and can be positive, negative or zero.


    To design the neural network we have to see how many hidden neurons we should
    use. Generally the number of hidden neurons is proportional to the sample size
    used for training the network.  The behaviour of the network is evaluated according
    to the error function:


    ![image](d2d_images/image059.png)


    where p is the number of samples used in training.


    It has recently been shown that, for p training samples, a perceptron with a single
    hidden layer of p-1 neurons can implement such a training set. That is, p-1 neurons
    are sufficient, but generally we will need fewer.


    An alternative model to the perceptron is the neural network that uses radial
    basis functions, i.e. its output is of the form:


    ![image](d2d_images/image219.png)


    where![image](d2d_images/image632.png)are the centres of the radial basis functions.
    A widely used radial basis function is the Gaussian function:


    ![image](d2d_images/image303.png)


    It has been shown experimentally that neural networks with radial basis functions
    approximate a wide class of multidimensional functions. In addition, they have
    the advantage over the perceptron in that their training times are much shorter.


