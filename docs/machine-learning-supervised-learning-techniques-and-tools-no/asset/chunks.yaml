- raw: 'The other neurons do not change their synaptic weights. This is the standard
    rule of competitive learning. Note that it is a linear combination between the
    input vector and the vector of synaptic weights, and the smaller the value of
    the learning rate, the smaller the modification of the synaptic weights. The learning
    rate of each neuron must be a decreasing function with respect to the stage number,
    so that after a suitable number of stages the network stabilises and stops learning.
    During the learning process, an input pattern is introduced at each iteration
    and the synaptic weights are updated, so that the learning process ends after
    the data set has been introduced several times.


    With this network, neurons learn individually to specialise on sets of patterns
    and are thus feature detectors. Each vector of synaptic weights represents the
    prototype of the class or group that defines the corresponding neuron.


    This algorithm is similar to MacQueen''s K-means algorithm, which consists of
    assigning each pattern to the nearest centroid and redetermining the centroids
    of the new groups formed.  Ahalt et al. (1990) have shown the convenience of using
    competitive learning to solve our problem as it leads to optimal or near-optimal
    solutions.


    Ueda and Nakano (1994) have proposed a new competitive learning with a selection
    mechanism based on the equidistortion principle that allows the network to escape
    local minima and Uchiyama and Arbib (1994) have shown the relationship between
    our clustering problem and vector quantization, and present a competitive learning
    algorithm that generates units where the input data density is high, applying
    it to colour image segmentation.


