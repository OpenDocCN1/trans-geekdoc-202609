    The GENMOD procedure estimates generalised linear models. Its summary syntax is
    as follows:


    ![image](d2d_images/image426.png)


    The BAYES statement performs Bayesian estimation using Gibbs sampling by default
    (the DIAGNOSTICS=ALL option performs full diagnosis, the PLOTS=TRACE|AUTOCORR|DENSITY|ALL
    option performs diagnostic plots, the SAMPLING=ARMS|GIBSS|GAMERMAN|GAM|IN option
    uses different sampling types and STATISTICS=ALL produces all output statistics),
    CLASS defines categorical variables of the model, EFFECTPLOT produces graphs of
    the estimated model (BOX, CONTOUR, FIT, INTERACTION and SLICEFIT options can be
    specified), EXACT runs exact tests for the specified parameters, EXACTOPTIONS
    collects the options to be applied to EXACT (the most important option is METHOD
    = DIRECT |NETWORK| NETWORKMC to specify the algorithm EXACT uses), FWDLINK specifies
    the link function if not done in MODEL, INVLINK specifies the inverse of the link
    function defined in FWLINK, LSMEANS computes and computes fixed effects means
    (the CL option computes confidence intervals for means and differences of effects
    means, PLOTS=ALL performs plots of means and comparisons of means, MEANS computes
    effect means and ALPHA=α sets the levelα for confidence), MODEL defines the model
    to estimate, OUTPUT specifies the output to send to file and the BY, FREQ and
    WEIGHT options have the same familiar functionality as in all SAS procedures.


