    # 4.2 COUNTING MODELS WITH EVIEWS: POISSON, NEGATIVE BINOMIAL AND EXPONENTIAL
    MODELS


    ![image](d2d_images/chapter_title_below.png)


    As an example we consider the file `arrests.wf1` which contains information on
    the variable `narr86` which represents the number of times a man is arrested during
    1986 and which we wish to explain by the variables `pcnv` (proportion of previous
    arrests in which he was convicted), `avgsen` (average length of sentences in months),
    `totttime` (time in prison in months), `ptime86` (time in prison in 1986 in months),
    `qemp86` (quarters employed in 1986 in hundreds of dollars), `black` (fic86) (legal
    income in 1986 in hundreds of dollars), `black` (fic86) (fic86) (fic86) (fic86),
    `ptime86` (time in prison in 1986 in months), `qemp86` (quarters employed in 1986),
    `inc86` (legal income in 1986 in hundreds of dollars), `black` (dummy worth 1
    for black arrestee), `hispan` (dummy worth 1 for hispanic arrestee) and `born60`
    (dummy worth 1 if the arrestee was born in 1960). As the explained variable takes
    the value 0 in a large number of cases and only takes a value greater than 5 in
    8 cases, a count data model could be used. We will study the effect of the explanatory
    variables on the explained variable using Poissson, exponential and negative binomial
    count data models.


    We first estimate the model using a Poisson count model. To do so, choose `Quick→
    Estimate Equation`, type the equation of the model to be fitted in the `Equation
    Specification` field of the `Specification` tab, choose `COUNT-Integer count data`
    in the `Method` field, mark `Poisson (ML and QML)` in the `Count estimation method`
    field to fit by a Poisson count data model (Figure 4-20) and click `OK`. The results
    in Figure 4-21 are obtained with good individual and joint significances for the
    estimated parameters (except for `avgsen`, `totttime`, `ptime86` and `born60`).
    The Pseudo R² is quite small and the values of the information criteria are quite
    acceptable. Similar fitting parameters to the previous case are observed. Using
    `View → Representations` (Figure 4-22) the fitted model equations are obtained
    (Figure 4-23).


