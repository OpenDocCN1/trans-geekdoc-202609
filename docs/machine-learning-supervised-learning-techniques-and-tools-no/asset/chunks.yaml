    # 6.1.2 Output function and transfer or activation functions


    ![image](img/chapter_title_below.png)


    ––––––––


    ![image](img/scene_break.png)


    The fully interconnected neural network is one in which the nodes in each layer
    are connected to all nodes in the next layer. The input layer has the sole task
    of distributing the information presented to the neural network for processing
    in the next layer. The nodes of the hidden layers and the output layer process
    the signals by applying processing factors, called `weights`. Each layer has an
    additional node called `bias`, which adds an additional term to the output of
    all nodes in the layer. All inputs at a node are weighted, combined and processed
    through a function, called a transfer function or activation function that controls
    the flow of output from that node to connect to all nodes in the next layer. This
    transfer function serves to normalise the output.


    An artificial neural network is nothing more than the connection of several neurons.
    Thus, artificial neurons, also called units, nodes or processing elements, constitute
    the basic unit of a neural network analogous to the biological neuron. These artificial
    neurons operate like simple microprocessors, whose function is to respond to a
    given input pattern. Each processing element, as in a biological neuron, receives
    inputs from other neighbouring nodes, or from the outside, in the case of the
    input layer, and its function is to transform, by means of simple internal calculations,
    these inputs into a single output value which it sends to the other nodes constituting
    their input or, if the neuron in question belongs to the output layer, to the
    outside. The connections between processing elements have a weight or connection
    strength `W` associated with them, which quantitatively determines the effect
    produced by some elements on others. In other words, the network information is
    stored in the weights, just as in biological neuron networks.


    Whether an input has an excitatory or inhibitory effect depends on whether the
    sign of the corresponding weight is positive or negative, respectively. The effectiveness
    of the inputs is determined by the strength of the connection, represented by
    the absolute value of the weights. Thus, each of the elements `Wij` of the weight
    matrix `W`, known as the pattern of connections, represents the strength and direction
    of the relationship of process element `j`, with respect to process element `i`.


    The process of transforming inputs into outputs in a forward-fed artificial neural
    network with `r` inputs, a single hidden layer composed of `q` processing elements,
    and an output unit can be summarised in the following formulation of the network
    output function:


    ![image](img/image333.png)where, ![image](img/image524.png)is the output of the
    network, the vector![image](img/image005.png)represents the inputs of the network
    the 1 corresponds to the bias of a traditional model, ![image](img/image119.png)are
    the weights of the neurons of the input layer to those of the intermediate or
    hidden layer, ![image](img/image388.png), represents the connection strength of
    the hidden units to the output units `j=0` indexes the bias unit, `q` is the number
    of intermediate units, i.e. the number of nodes in the hidden layer, ![image](img/image475.png)is
    the activation function of the output unit and ![image](img/image447.png)corresponds
    to the activation function of the intermediate neurons. `W` is a vector that includes
    all the weights of the network, i.e. ![image](img/image492.png). Figure 6-3 represents
    the function![image](img/image215.png).


