    Equation Specification 字段中写出拟合模型的方程，在 Method 字段中选择 `CENSORED-Censored or truncated
    data (Tobit)`，将删失变量放在 Right 字段中并标记 Zero/One indicator of censoring，因为 Tobit 模型在右侧删失且删失指示变量为删失变量，选择
    Normal 因为我们考虑正态分布模型（图 4-56）并点击 Accept。图 4-57 中的结果显示估计参数具有良好的个体显著性（`workprg` 和
