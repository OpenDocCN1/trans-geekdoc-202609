    # 6.10.2 径向基函数（RBF）


    ![image](img/chapter_title_below.png)


    IBM SPSS 径向基函数（RBF）过程基于预测变量的值为一个或多个因变量（目标变量）生成预测模型。下面描述了使用 MLP 过程的两种情况：


    我们考虑一个银行决策者的例子，他必须确定可以向哪些客户发放贷款并有足够的还款保证。他有一个客户历史数据库，其中他知道客户是否已偿还贷款（`CREDIT_V`）、客户的职业类别（`CAT_PROF`）、其月薪（`PAY_MONTH`）、其年龄（`AGE`）以及是否拥有信用卡（`AMEX`）。利用这些信息，必须建立一个预测模型，预测因变量的类别（在变量
    `CREDIT_V` 中是否偿还信用），以便对申请信用的任何新客户进行分类，已知其自变量的值（`CAT_PROF`、`PAY_MONTH`、`AGE` 和
    `AMEX`）。


    我们将使用径向基函数类型的神经网络。为此，在将包含上述变量信息的 `credits.sav` 文件加载到内存后，我们从 SPSS 菜单中选择 分析 → 神经网络
    → 径向基函数（图 6-22）。


    '
