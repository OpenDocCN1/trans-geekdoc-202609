    # 1.10 stata AND NON-LINEAR ECUATION MODELS


    ![image](d2d_images/chapter_title_below.png)


    `STATA` has the `nl` statement that allows estimating models with non-linear equations.
    Its basic syntax is as follows:


    ```

    nl model equation, options

    ```


    Among the more interesting options are `variables(variables_list)` to specify
    the variables in the model, `initial(initial_values)` to give initial values to
    the parameters of the model, `parameters(parameters_list)` to specify the parameters
    in the model, `nparameters(n)` to specify that there are `n` parameters in the
    model, `noconstant` to fit the model without constant, `hasconstant(name)` to
    identify the constant term in the model, `robust` to estimate in the presence
    of heteroscedasticity, `level(n)` sets the confidence level at `n`, `eps(n)` to
    specify the convergence criterion and `delta(n)` which specifies `n` for computing
    derivatives.


