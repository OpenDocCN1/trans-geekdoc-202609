    We considered data from a company report on 753 households (file `families.wf1`)
    in which a model was estimated relating expenditure on car purchase ![image](d2d_images/image647.png)
    to household income in the last year ![image](d2d_images/image203.png), the number
    of children under 18 ![image](d2d_images/image019.png) and the age of the head
    of household ![image](d2d_images/image707.png). The following behavioural equation
    was specified:


    ![image](d2d_images/image266.png)


    This involves estimating the above model bearing in mind that there may be individuals
    surveyed who have not purchased a vehicle in that period, in which case they have
    been assigned a zero expenditure. The task is to find the marginal effects of
    the explanatory variables on the explained variable and compare them with the
    OLS estimates of the model coefficients and calculate the income elasticity of
    demand at the midpoint.


    This is the particular case of data censoring that occurs when the dependent variable
    is zero for a part of the population and is continuous for the positive values.
    We are then faced with a limited variable model with a corner solution. Specifically,
    we are dealing with a censored Tobit model with corner solution.


    We start by estimating using the maximum likelihood censored Tobit model. To do
    this, choose `Quick→ Estimate Equation`, write the equation of the model to be
    fitted in the Equation Specification field of the Specification tab, choose `CENSORED-Censored
    or truncated data (Tobit)` in the Method field, set it to zero in the Left field
    and mark Actual censoring value because the Tobit model with corner solution is
    censored on the left by the value zero, choose Normal because we consider the
    model with normal distribution (Figure 4-36) and click OK. The results in Figure
    4-37 are obtained with good individual significances for the estimated parameters.
    The R² is far away from unity, but this is usual for this type of models. It can
    be seen that out of a total of 753 observations there are 336 null values (uncensored
    observations, i.e. respondents who had not bought a car in that year) and 417
    left-censored observations (because they are positive values with the censored
    value to their left). The values of the information criteria are not too high
    and are fairly consistent with each other.


