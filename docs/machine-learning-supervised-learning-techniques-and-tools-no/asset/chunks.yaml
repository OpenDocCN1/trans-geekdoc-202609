    # 5.3  COMPARISON BETWEEN ANNUAL SAMPLES, COMBINATIONS OF CROSS-SECTIONS (POOLED
    DATA) AND PANELS


    ![image](d2d_images/chapter_title_below.png)


    Whenever there are no selection difficulties, as in the case of administrative
    registers, annual samples are usually used. An isolated annual (or cross-sectional)
    sample provides very rich information for a given point in time. However, it lacks
    a time dimension, which limits its usefulness considerably. However, when several
    samples obtained independently in different years (called independent cross-sectional
    combinations or data pools) are available, the richness of the applicable analyses
    increases exponentially.


    Like the panel, a combination of independent cross-sections (data pool) has a
    temporal dimension, since it is formed from observations on a large variety of
    individuals taken at different points in time, usually years. However, the distinguishing
    feature of a data pool is that the observations do not come from the same individuals
    at different points in time, but the sample in each pool year faithfully represents
    the population of that year.


    However, many studies on individuals, households, firms, etc. are repeated at
    regular intervals, often annually. If a random sample is drawn at each period,
    combining the results from them gives us a pool of data. By combining random samples
    drawn from the same population, but at different points in time, we obtain more
    precise estimators and more powerful test statistics, mainly due to the larger
    sample sizes involved. However, it must be borne in mind that the relationships
    between the dependent variable and some of the independent variables in the models
    applied must be maintained over time. Statistically, problems with a data pool
    may arise from the fact that the population may have different distributions in
    different periods, which is often solved by introducing dummy variables. Problems
    of non-constant variability over time or heteroscedasticity may also arise (many
    individuals and several periods make it almost impossible to maintain constant
    variabilities, usually required in economic modelling), but these problems are
    also solvable statistically (econometric treatment of the heteroscedasticity problem).


    Combinations of cross-sections are also very useful for assessing the impact of
    certain events or policies. They are generally used when two or more cross-sectional
    data sets, collected before and after the occurrence of an event, are available
    to determine the effect of the economic outcomes of that event. For example, to
    assess the impact of a tobacco tax change on tobacco consumption, two random samples
    can be drawn at different points in time, so that at one point in time the tax
    change did not occur and at the other point in time it did. Most of the estimates
    of change and the sometimes successive estimates used in these cases are reasonably
    feasible from a pool of data.


    However, the panel format is, as far as the simulation of tax reforms is concerned,
    far superior to a pool of annual samples. There are two strong arguments to justify
    this assertion:


    1.  The panel allows the evaluation of tax reforms from a dynamic perspective.
    Specifically, it allows the impact of any tax change on the same individual (or
    household or fiscal unit) to be analysed over time. In other words, it allows
    for a structural analysis of reforms. This is a fundamental issue in the evaluation
    of tax reforms because individuals alter their behaviour in response to tax changes.
    And many of these changes do not occur in the instant after the reform but one
    or several periods later, so the time dimension of the panel to introduce the
    dynamics is essential.


    1.  The effects of a reform can be measured more reliably when we compare homogeneous
    units (individuals or household or fiscal units). For example, when we analyse
    the impact of a reform on the net income of the poorest individuals (those in
    the first income decile), we compare the same group of individuals. Hence, it
    is essential to work with observations of the same individuals at different points
    in time.'
