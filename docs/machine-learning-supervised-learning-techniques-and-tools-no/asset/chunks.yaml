    # 6.5  ​​​​​​​THE BACK-PROPAGATION LEARNING ALGORITHM (BACK-PROPAGATION)


    ![image](d2d_images/chapter_title_below.png)


    The learning or training process of the network consists of presenting the network
    with the set of patterns in a certain number of pre-set stages, in order to minimise
    the learning error, understood as the quadratic difference between the expected
    output and the output provided by the network. In the first stage, the network
    has some randomly chosen interconnection weights, the network is presented with
    an input vector in the first stage, constituted by the first pattern, this is
    propagated through all the layers until it provides an output, the output signal
    is compared with the desired output in all the nodes of the output layer. This
    process is performed for all the patterns in the learning set, and the sum of
    the squared errors of all the patterns will be the error made by the network in
    that first stage.


    The objective is to change or update the interconnection weights for the second
    stage in order to reduce the total error. The idea of the back-propagation algorithm
    is to update the interconnection weights so that the error signal is transmitted
    backwards from the output layer; however, these intermediate units only receive
    a fraction of the error proportional to their relative contribution to the output.
    This process is repeated layer by layer until all nodes have received an error
    signal describing their contribution to the error. Once the weights have been
    updated, the process of re-presenting the learning patterns and error calculation
    is repeated, either because the total error is less than a preset one, or because
    the preset number of stages has been completed.


    The importance of this process is that as the network is trained, nodes in the
    hidden layers learn to recognise different features of the problem.


