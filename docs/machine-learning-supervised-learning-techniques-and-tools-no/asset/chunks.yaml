    # 6.3  ​​​​​​​LEARNING IN NEURAL NETWORKS


    ![image](d2d_images/chapter_title_below.png)


    After designing an artificial neural network, what we want to achieve with it
    is that, for certain inputs, or example patterns that we supply to the network,
    it is capable of generating a desired output. To achieve this, in addition to
    the topology of the network (understood as the structure of the network) being
    appropriate, it is required that the network learns to provide correct solutions,
    i.e., it is necessary to subject the network to a learning or training process.
    Learning can be understood as a trial and error procedure that allows the statistical
    estimation of the parameters of the neural network model used.


    Three basic types of learning are generally considered to give rise to different
    types of neural networks. When the trainer provides the network with the desired
    output, the learning is said to be supervised. Otherwise, it is unsupervised learning.
    Finally, an intermediate type of learning is reinforcement or hybrid learning,
    in which the trainer only provides the network with an indication of whether the
    response to a given input is good or bad.'
