    # 3.9 SAMPLE SELECTION CORRECTION: TWO-STAGE HECKMAN OR HECKIT ESTIMATION


    ![image](d2d_images/chapter_title_below.png)


    Truncated regression is a special case of a general problem known as non-random
    sample selection that occurs when the sample available for estimation is not random.


    Heckman devised a two-stage procedure for estimating models in the presence of
    incidental truncation that overcomes the problem of selection bias:

    Stage 1. Using the n observations we estimate a Probit model of s over Z from
    which we obtain ![image](d2d_images/image104.png). From these estimates we calculate
    for each i ![image](d2d_images/image651.png).

    Stage 2. Using the selected sample (s=1) we estimate by OLS the regression of
    Y on X and ![image](d2d_images/image246.png).


    This procedure yields consistent and asymptotically normal estimators.


    A test for the existence of sample selection bias consists of testing in the second
    stage the hypothesis of `ρ = 0` using the t-statistic of ![image](d2d_images/image619.png).
    When `ρ ≠ 0` the standard errors of the 2nd stage are not valid and must be corrected.


    We have assumed that X is a subset of Z because if we inappropriately exclude
    any element of X we may have inconsistent estimators. It is important that Z contains
    at least one element that does not belong to X. This is not essential for the
    identification of `β` as the non-linearity of ![image](d2d_images/image619.png)
    is sufficient for this purpose.


    But if we have additional elements, the correlation of ![image](d2d_images/image619.png)
    with X decreases and we will obtain more precise estimators of the `β`. Moreover,
    if in the first stage we do not include additional items, the significance of
    ![image](d2d_images/image619.png) in the second stage may be due to sample selection
    or misspecification.


    In addition to using the 2-stage procedure, this type of models can be estimated
    by MV, although it is more complicated because we need the joint distribution
    of Y and s.


