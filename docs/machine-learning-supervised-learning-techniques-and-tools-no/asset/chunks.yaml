- raw: 'In the field of Machine Learning, there are different types of models that
    are used to analyse and predict data. Two of the most common types are linear
    models and non-linear models.


    Machine Learning uses two types of techniques: supervised learning, which trains
    models on known input and output data in order to predict future results, and
    unsupervised learning, which finds hidden patterns or intrinsic structures in
    the input data.


    The goal of supervised machine learning is to build a model that makes evidence-based
    predictions in the presence of uncertainty. A supervised learning algorithm takes
    a known set of input data and known responses to the data (output) and trains
    a model to generate reasonable predictions for the response to new data. Supervised
    learning uses classification and regression techniques to develop predictive models.


    Predictive classification models predict categorical responses, for example, whether
    a taxpayer defrauds or does not defraud, or whether a tumour is cancerous or benign.
    Classification models classify the input data into categories that are the dependent
    variable of the model, and the independent variables can be continuous, categorical
    or mixture.


    Predictive regression models predict continuous responses and the independent
    variables are also usually continuous.


    Linear models are those that assume a linear relationship between the input variables
    and the output variable. In other words, the data are assumed to follow a linear
    trend and fit a straight line in a multidimensional space. This type of model
    is based on the idea that changes in the input variables translate into proportional
    changes in the output variable.


    On the other hand, non-linear models do not assume a linear relationship between
    the input variables and the output variable. Instead, they can fit different shapes
    and more complex patterns, such as curves, polynomials or even more irregular
    structures. These models are able to capture more complex and flexible relationships
    between variables, allowing them to better fit the data.


    Linear and non-linear models have different assumptions and characteristics. Linear
    models assume a linear relationship and are simpler and more interpretable, while
    non-linear models are more flexible and can better fit non-linear data. The choice
    between one or the other will depend on the characteristics of the data and the
    objectives of the Machine Learning problem.


    It is advisable to use a linear model when you want to understand how an input
    variable affects an output variable in a proportional way and when the data follow
    a linear trend. Non-linear models offer the advantage of being able to capture
    more complex relationships between variables and better fit non-linear data.


    In this book we will develop supervised learning Machine Learning techniques related
    to non-linear regression. More specifically, we will go deeper into non-linear
    multiple regression models with all their identification, estimation and diagnosis
    problems. Special emphasis is placed on generalised linear models and all types
    of derived non-linear models: Logit Models, Probit Models, Poisson Models and
    Negative Binomial Models. This is followed by models of limited dependent variable,
    discrete choice, count, censored, truncated and sample selection. Non-linear models
    with panel data are also discussed in depth. An important section is devoted to
    predictive models of neuroanalytic networks. All chapters are illustrated with
    examples and representative exercises solved with the latest software such as
    R, SAS, SPSS, EVIEWS and STATGRAPHICS.


