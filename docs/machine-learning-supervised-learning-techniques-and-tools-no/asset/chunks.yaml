    我们将首先对 1975 年 753 名已婚女性的数据（文件 `married.wf1`）拟合一个线性概率模型，其中 428 人在当年某个时间参与了劳动力市场（`inlf`=1），325
    人未参与（`inlf`=0）。


    参与劳动力市场（`inlf`）的概率被认为取决于其他收入来源（`nwifeinc`）、受教育年限（`educ`）、工作经验年限（`exper` 和 `exper²`）、年龄、6
    岁以下子女数量（`kidslt6`）以及 6 至 18 岁子女数量（`kidsg6`）。


    使用线性概率模型，我们将分析女性劳动力市场参与概率对上述解释变量的依赖关系。


    ### 线性概率模型


    我们将考虑以下线性概率模型（LPM）：


    ![image](img/image158.png)


    我们将首先使用 OLS 估计 MLP。为此，选择 `Quick→ Estimate Equation`，在 Specification 选项卡的 Equation
    Specification 字段中写入拟合模型的方程，在 Method 字段中选择 `LS-Least Squares (NLS and ARMA)` 以进行普通最小二乘拟合（图
    4-1），然后单击 OK。图 4-2 的结果显示估计参数具有良好的个体和联合显著性（也许除了 `kidsge6`）。`R²` 和 Durbin Watson
    统计量不是很好，但我们必须考虑到我们正在估计一个线性概率模型。


    ![image](img/image068.png)![image](img/image207.png)


    图 4-1      图 4-2


    但 MLP 中的相关问题是异方差性。`View→ Residual Tests→ White Heteroskedasticity`（图 4-3）得到的 F
    和 Chi 的 p 值均小于 0.05（图 4-4），因此存在异方差性。然后我们将使用对异方差性具有稳健性的方法，例如 White 方法，进行估计。现在使用
    White 方法进行估计是通过如图所示填写方程估计屏幕的 Options 选项卡（图 4-5）。单击 OK 后得到图 4-6 中的非异方差估计。


    ![image](img/image334.png)![image](img/image550.png)


    图 4-3      图 4-4


    ![image](img/image638.png)![image](img/image598.png)


    图 4-5      图 4-6


    除 `kidsge6` 外，所有变量在统计上均显著且符号符合预期。联合显著性也很强。对系数的解释表明，如果教育增加一年（其他变量保持不变），女性参与劳动力市场的概率将增加
    0.038。其他收入来源（`nwifeinc`）的影响显著，但非常小，因为如果其他收入增加一个单位，在其他因素保持不变的情况下，女性参与劳动力市场的概率将下降
    0.0034。


    在其他因素固定的情况下，工作经验变化一年时，女性劳动力市场参与概率的估计变化为 `0.039-2(0.0006)exper`。经验不影响参与概率的点（斜率改变符号的点）为
    `0.039/0.0012=32.5`（只有 13 名女性的 `exper>32`）。随着年龄增加一年（其他条件不变），女性参与劳动力市场的概率下降 0.016。在其他变量水平给定的情况下，多一个
    6 岁以下的孩子会使女性参与劳动力市场的概率降低 0.262。在其他变量水平固定的情况下，有一个 6 至 18 岁的孩子会使女性劳动力市场参与概率增加 0.013。


    MLP 的主要问题之一是，对于解释变量的某些取值组合，估计的概率可能小于 0 或大于 1：


    ![image](img/image102.png)


    为此，单击 Forecast 并如图所示填写预测屏幕（变量 `inlff` 包含样本中 753 名女性的 ![image](img/image125.png)
    值）。当我们单击 OK 时，我们得到图 4-8 表示 ![image](img/image125.png)，注意到存在大于 1 和小于 0 的值）。事实上，如果我们在
    Workfile 屏幕中双击变量 `inlff`，我们可以看到其值。图 4-9 显示了一些大于 1 的值，图 4-10 显示了小于零的值。总共有 17 个
    ![image](img/image125.png) 值大于 1，16 个小于零。


    MLP 的另一个不一致之处是，对似然的影响对于所有解释变量的值都是相同的。


    ![image](img/image442.png)![image](img/image263.png)


    图 4-7      图 4-8


    ![image](img/image450.png)![image](img/image378.png)


    图 4-9      图 4-10


    在下面，鉴于线性概率模型的可能缺陷，我们使用 Probit 模型和 Logit 模型解决上述问题。此外，解释变量对女性参与劳动力市场概率的影响以适当的方式进行量化并解释。


    ### Probit 模型


    我们首先考虑 Probit 模型：


    ![image](img/image001.png)


    其中 `Ф` 是正态（0,1）的分布函数。


    我们将首先使用 Probit 模型进行估计。为此，选择 `Quick→ Estimate Equation`，在 Specification 选项卡的 Equation
    Specification 字段中输入拟合模型的方程，在 Method 字段中选择 `BINARY-Binary choice (logit, probit,
    extreme value)`，在 Binary estimation method 字段中选择 `Probit` 以拟合 Probit 模型（图 4-11），然后单击
    OK。


    图 4-12 的结果显示估计参数具有良好的个体显著性（常数和 `kidsge6` 除外）。联合显著性非常高，因为似然比统计量的 p 值非常小。McFadden
    的伪 `R²` 不太接近 1（0.22）。信息准则（Akaike、Schwarz 和 Hannan-Quinn）的值是合适的，因为它们很低且非常接近。


    ![image](img/image624.png)![image](img/image223.png)


    图 4-11      图 4-12


    衡量 Probit 模型拟合优度的另一个标准是正确预测百分比的标准，它包括观察观察到的 Y 值 i 与其预测值相匹配的百分比。该任务是通过 Eviews 通过
    `View → Expectation-Prediction Table`（图 4-13）完成的。


    单击 OK 后得到图 4-14 的输出，显示模型充分预测了 73.44%的观测值。参与者（女性劳动力市场参与）的预测更好，正确率为 81.31%，而非参与者的正确率为
    63.08%。


    ![image](img/image640.png)![image](img/image706.png)


    图 4-13      图 4-14


    为了量化并解释解释变量对女性参与劳动力市场概率的影响，我们将记住连续解释变量 `Xj` 对响应概率 `P(Y \= 1|X)` 的偏效应为：


