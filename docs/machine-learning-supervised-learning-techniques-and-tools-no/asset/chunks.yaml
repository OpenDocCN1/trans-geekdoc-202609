    In order to compare the marginal effects for the midpoint with the estimated coefficients
    of the linear model using OLS, we will perform the latter estimation. To do so,
    choose Quick→ Estimate Equation, type the equation of the model to be fitted in
    the Equation Specification field of the Specification tab, choose LS-Two stage
    Least Squares (NLS and ARMA) in the Method field to fit by least squares (Figure
    4-38) and click OK. The results are shown in Figure 4-39.


    ![image](d2d_images/image251.png)![image](d2d_images/image137.png)


    Figure 4-38    Figure 4-39


    It is observed that the marginal effects of the Tobit model are close to but do
    not coincide with the estimated values of the OLS model, being always a little
    bit lower. The difference between these OLS estimates and the Tobit marginal effects
    would be the errors that would be made in the model parameter estimates if OLS
    were used instead of a Tobit model.


    It is now a matter of estimating a wage equation by specifying an econometric
    model in which the logarithm of wages received by employees Y is related to work
    experience (X2 ), its square (X3 ), the educational level (X4 ), the worker''s
    marital status (X5 ) and the worker''s university degree or not (X6 ) through
    the following behavioural equation:


    ![image](d2d_images/image427.png)


    We will estimate this wage behaviour equation using a truncated Tobit model and
    calculate the marginal effects of the variables X2 , X3 and X4 on the wage. The
    data are collected in the file wages.wf1.


    Since we only observe wage supply for individuals who are working (and not for
    those who are not working) we are dealing with a case of non-random sample selection
    in which we observe Y or not depending on another variable (employment). We are
    clearly facing a case of truncation in which the wage supply is observed depending
    on another variable which is the labour supply.


    As we are in a truncated Tobit model we will use the smallest value of the dependent
    variable Y as the truncation value. This minimum value is the one that lies furthest
    to the left of the remaining Y values. To calculate the minimum value of Y we
    double-click on Y in the Workfile screen and choose View → Descriptive Statistics
    → Stats Table (Figure 4-40). In Figure 4-41 we see that the minimum value of Y
    is 1.8718.


