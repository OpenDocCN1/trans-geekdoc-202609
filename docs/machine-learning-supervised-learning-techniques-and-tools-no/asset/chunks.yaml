    ## Distributions


    - **Inverse Gaussian**. This distribution is suitable for variables with positive
    scale values that skew towards larger positive values. If a data value is less
    than or equal to 0 or is a missing value, the corresponding case shall not be
    used in the analysis.


    - **Negative binomial**. This distribution considers the number of attempts needed
    to achieve k successes and is suitable for variables that have integer values
    that are not negative. If a data value is not integer, is less than 0 or is a
    missing value, the corresponding case shall not be used in the analysis. The value
    of the auxiliary parameter of the negative binomial distribution can be any number
    greater than or equal to 0; it can be set to a fixed value or left to be estimated
    by the procedure; when the auxiliary parameter is set to 0, using this distribution
    is equivalent to using the Poisson distribution.


    - **Normal**. It is suitable for scaled variables whose values adopt a symmetrical
    bell-shaped distribution around a central value (the mean). The dependent variable
    must be numerical.


    - **Poisson**. This distribution considers the number of occurrences of an event
    of interest in a fixed period of time and is appropriate for variables that have
    non-negative integer values. If a data value is not integer, is less than 0 or
    is a missing value, the corresponding case shall not be used in the analysis.


    - **Tweedie**. This distribution is suitable for variables that can be represented
    by Poisson mixtures of gamma distributions; the distribution is a "mixture" in
    the sense that it combines the properties of continuous (takes non-negative real
    values) and discrete (positive probability mass at a single value, 0) distributions.
    The dependent variable must be numeric and the data values must be equal to or
    greater than zero. If a data value is less than 0 or is a missing value, the corresponding
    case shall not be used in the analysis. The fixed value of the Tweedie distribution
    parameter can be any number greater than one and less than two.


    - **Multinomial**. This distribution is suitable for variables representing an
    ordinal response. The dependent variable can be numeric or string, and must have
    at least two different valid values of the data.


