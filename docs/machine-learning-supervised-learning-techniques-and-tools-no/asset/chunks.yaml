    # 6.10.2  ​​Radial Basis Function (RBF)


    ![image](d2d_images/chapter_title_below.png)


    The IBM SPSS Radial Basis Function (RBF) procedure generates a predictive model
    for one or more dependent (target) variables based on the values of the predictor
    variables. Two situations in which the MLP procedure is used are described below:


    We consider an example of a bank decision-maker who has to identify to which customers
    he can grant a loan with sufficient guarantee of repayment. He has a database
    with a history of customers in which he knows whether or not the customers have
    repaid the loan (CREDIT\_V), the professional category of the customers (CAT\_PROF),
    their monthly salary (PAY\_MONTH), their age (AGE) and whether or not they have
    credit cards (AMEX). With this information, it must build a predictive model that
    predicts the category of the dependent variable (does or does not repay the credit
    in the variable CREDIT\_V) in which it must classify any new customer who applies
    for credit, knowing the values of its independent variables (CAT\_PROF, PAY\_MONTH,
    AGE and AMEX).


    We will use a neural network of the Radial basis function type. To do this, after
    loading the credits.sav file containing the information on the variables mentioned
    above into memory, we choose from the SPSS menus Analyse → Neural Networks → Radial
    Basis Function (Figure 6-22).'
