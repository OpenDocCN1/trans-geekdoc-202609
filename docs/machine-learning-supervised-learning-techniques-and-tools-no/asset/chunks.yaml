    ### Scale response

    The following options are commonly used:


    - Linear. Specifies the normal distribution and the identity link function.

    - Gamma with log link. Specifies the gamma distribution and the log link function.


    ### Ordinal response

    The following options are commonly used:


    - Ordinal logit. Specifies the multinomial `ordinal` distribution and the cumulative
    logit link function.

    - Ordinal probit. Specifies the multinomial `ordinal` distribution and the cumulative
    probit link function.


    ### Counts

    The following options are commonly used:


    - Poisson log-linear. Specifies the Poisson distribution and the log link function.

    - Negative binomial with log link. Specifies the negative binomial distribution
    with the value 1 for the auxiliary parameter and the log link function. To have
    the procedure calculate the value of the auxiliary parameter, specify a custom
    model with negative binomial distribution and select Estimate value in the parameter
    group.


    ### Binary response or Event/trial data

    The following options are typically used:


    - Binary logit. Specifies the binomial distribution and the logit link function.

    - Binary probit. Specifies the binomial distribution and the probit link function.

    - Interval censored survival. Specifies the binomial distribution and the complementary
    log-log link function.


    ### Combination

    The following options are commonly used:


    - Tweedie with log link. Specifies the Tweedie distribution and the log link function.

    - Tweedie with identity linking. Specifies the Tweedie distribution and the identity
    link function.


    ### Customised

    Sometimes a combination of distribution and customised link function is used.


    The possibility of specifying a specific distribution for the dependent variable
    other than the normal distribution and the possibility of specifying a link function
    other than the identity is the main improvement of the generalised linear model
    over the general linear model. There are many possible combinations of distribution
    and link function, several of which may be appropriate for a given data set, so
    their choice may be guided by a priori theoretical considerations and by which
    combinations seem to work best.


    - Binomial. This distribution is suitable only for variables that represent a
    binary response or a number of events.

    - Gamma. This distribution is suitable for variables with positive scale values
    that deviate towards larger positive values. If a data value is less than or equal
    to 0 or is a missing value, the corresponding case shall not be used in the analysis.

