    Individual samples`（图 4-16）并获得模型中所有变量的描述性统计，包括均值（图 4-17）。


    ![image](img/image395.png)![image](img/image700.png)


    图 4-15      图 4-16


    ![image](img/image359.png)


    图 4-17


