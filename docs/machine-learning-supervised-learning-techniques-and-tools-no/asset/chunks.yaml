    ![image](d2d_images/image643.png)


    Many algorithms have been proposed to solve this problem, such as the K-means
    algorithm of Moqueen (1967). However, these algorithms lead to partial solutions,
    i.e., local minima, which need not be global minima (optimal solution). Thus,
    the difficulty of this problem lies in the fact that the objective function has
    many local minima, which are not necessarily global minima (optimal solution).


    To carry out this type of grouping we will use competitive neural networks with
    unsupervised learning, which allow us to form groups or categories with the input
    data. Each input will be assigned to the class specified by the activated output
    unit. In this type of learning, the neurons compete with each other to see which
    one is activated; only one of them is activated, so it is often called winner-take-all
    learning. Here the network, on its own (unsupervised), groups the data into categories
    and gives us the prototypes for each category.


