    R 在 `forecast` 库中有 `nnetar` 命令，可以通过神经网络预测时间序列。


    让我们考虑 seasonal.sav 文件中从 1968 年 1 月开始到 1981 年 10 月结束的月度序列 `X`。目标是使用神经网络计算一年的预测。


