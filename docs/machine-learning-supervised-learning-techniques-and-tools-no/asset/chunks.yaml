    # 5.8  DYNAMIC MODELS WITH PANEL DATA


    ![image](d2d_images/chapter_title_below.png)


    Models with panel data can also have lagged variables and lags can appear in both
    the dependent and independent variables, although most commonly the lags appear
    in the dependent variable. A dynamic panel data model with a time lag in the dependent
    variable would have the following expression:


    ![image](d2d_images/image360.png)


    To estimate this type of model, instrumental variables are usually used to replace
    the lagged endogenous variable yi,t-1 with an instrument y\*i,t-1 that is highly
    correlated with yi,t-1 and uncorrelated with the error. The new model to be estimated
    will be:


    ![image](d2d_images/image609.png)


    In this case Ordinary Least Squares can be used for estimation, but it is difficult
    to find a suitable instrument. There is a large literature on the availability
    of instruments for the economic and other variables most commonly used in practice
    in applied panel models. Special attention should be paid to multicollinearity
    and autocorrelation problems when estimating this type of panel with instrumental
    variables (a variable and its respondent are logically correlated and may be linearly
    dependent). We should also not forget the problems of heteroscedasticity, especially
    when the samples are very large (this problem usually occurs in micro data).  
    There are also special alternative methods for estimating certain dynamically
    structured panels. The methodology of Arellano and Bond provides solutions for
    the estimation of dynamic panel data models.


