    # 1.5.2 General and segmented non-linear estimation with SPSS


    ![image](d2d_images/chapter_title_below.png)


    When the non-linear model that relates the variables is more general, i.e. it
    has other terms in addition to the polynomial ones, SPSS uses the non-linear regression
    procedure for its estimation, which performs the non-linear least squares adjustment
    using iterative algorithms to find the solution. As an example, from the file
    `cars.sav`, we fit a model that relates consumption to the square of the acceleration
    (`acel`), the cube of the power (`hp`) and the logarithm of the displacement (`engine`).


    To perform the non-linear regression, choose from the `Analyse` menus→ `Regression`→
    `Non-linear` (Figure 1-5) and select the numerical dependent variable `consumption`
    from the list of variables in the working data file (Figure 1-6). To construct
    an expression for the model, either enter the expression in the Model Expression
    field or paste the components (variables, parameters, functions) into the field.
    Identify Name and Initial value of each parameter of the model expression by clicking
    on Parameters and click on Add to define the parameters (Figure 1-7). In the Loss
    button choose the loss function in non-linear regression (Figure 1-8), i.e. the
    function that is minimised by the algorithm. Select either `Sum of squared residuals`
    to minimise the sum of squared residuals or `User-defined loss function` to minimise
    a different function.


    The Constraints button allows you to enter constraints on model variables (Figure
    1-9). A constraint is a limitation on the allowed values for a parameter during
    the iterative search for a solution.


    The Options button dialog box (Figure 1-10) allows you to choose Bootstrap estimates
    of the standard error (requires use of the sequential quadratic programming algorithm),
    the Estimation method (`Sequential quadratic programming` or `Levenberg-Marquardt`).
    The Sequential Quadratic Programming method allows you to specify new values for
    Maximum number of iterations and Limit for steps and you can change the selection
    found in the drop-down lists for Optimality tolerance, Function accuracy and Size
    for infinite steps. The Levenberg-Marquardt method allows you to specify Maximum
    number of iterations and you can change the selection in the drop-down lists for
    Convergence of sum of squares and Convergence in parameters. You can save a number
    of new variables to the active data file using the Save button (Figure 1-11).
    The available options are: Predicted values, Residuals, Derivatives and Loss function
    values. These variables can be used in subsequent analyses to test the model fit
    or to identify problem cases.


    ![image](d2d_images/image070.png)![image](d2d_images/image339.png)


    Figure 1-5 Figure 1-6


    ![image](d2d_images/image526.png)![image](d2d_images/image672.png)


    Figure 1-7 Figure 1-8


    ![image](d2d_images/image238.png)![image](d2d_images/image414.png)


    Figure 1-9 Figure 1-10


    ![image](d2d_images/image692.png)


    Figure 1-11


    In the Model Expression field, segmented models (models that take different forms
    in different parts of their domain) can be introduced using conditional logic
    expressions within the single model statement. To use conditional logic within
    the model expression or loss function, the sum of a series of terms, one for each
    condition, must be constructed. Each term consists of a logical expression (in
    parentheses) multiplied by the expression that will result when that logical expression
    is true. For example, consider a segmented model that equals 0 for X < = 0, X
    for 0 < X < 1 and 1 for X > = 1. The expression for this example is:![image](d2d_images/image511.png)All
    logical expressions in parentheses must be evaluable to 1 (true) or 0 (false).
    Thus: if X < = 0, the above reduces to 1*0 + 0*X + 0*1 = 0. If 0 < X < 1, it reduces
    to 0*0 + 1*X + 0*1 = X. If X > = 1, it reduces to 0*0 + 0*X + 1*1 = 1. More complicated
    examples can be easily constructed by replacing different logical expressions
    and result expressions. Remember that double inequalities, such as 0 < X < 1,
    must be written as compound expressions, of the form ![image](d2d_images/image040.png)


    It is possible to use string variables within logical expressions: (`city=''Madrid''`)*`costliv`
    + (`city=''Guadalajara''`)*0.59*`costliv`. This results in one expression (the
    value of the variable `costliv`) for the inhabitants of Madrid and another (59%
    of that value) for the inhabitants of Guadalajara. String constants must be enclosed
    in inverted commas or apostrophes, as shown in the syntax of this example.


    If you select `User-defined loss function`, you must define the loss function
    whose sum (in all cases) must be minimised by your choice of parameter values.
    Most loss functions include the special variable `resid_`, which represents the
    residual. The default loss function `Sum of squared residuals` could be entered
    explicitly as `resid_**2`. If you have to use the predicted value in the loss
    function, it is equal to the dependent variable minus the residual. A conditional
    loss function can be specified using conditional logic. You can either type an
    expression in the User Defined Loss Function field, or paste the components of
    the expression into the field. String constants must be enclosed in inverted commas
    or apostrophes, and numeric constants must be written in American format, with
    the full stop separating the decimal part.


    In terms of statistics, parameter estimates and residual sum of squares are obtained
    for each iteration, and sum of squares for regression, residual, corrected and
    uncorrected total, parameter estimates, asymptotic standard errors and asymptotic
    correlation matrix of parameter estimates are obtained for each model.


