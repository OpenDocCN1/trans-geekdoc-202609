- raw: 'Another type of limited dependent variables are those caused by data censoring.
    A censored regression model is one whose dependent variable is censored above
    (upper censoring) or below (lower censoring) some value, i.e. the dependent variable
    is not observed for a part of the population. In censored regression models the
    underlying dependent variable is approximately continuous, but is lower or upper
    censored, due to the way we collect the data or to institutional constraints.
    A truncated regression model is similar to a censored regression model, but has
    one important difference: in a truncated regression model, we do not have the
    data about some important segment of the population. This is usually the case
    when a sample targets a particular subset of the population and, perhaps because
    it is costly, ignores the rest of the population. This is a particular case of
    the general problem of sample selection, where we observe a non-random sample
    of the underlying population.


