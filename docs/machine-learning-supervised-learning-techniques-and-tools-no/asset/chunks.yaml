    # 5.1  INTRODUCTION TO PANEL DATA: DATA STRUCTURES


    ![image](d2d_images/chapter_title_below.png)


    Panel data is a special type of sample in which the behaviour of a number of economic
    agents is followed over time. In this way, the researcher can perform economic
    analysis and specify models with the cross-sectional (or cross-sectional) data
    that are obtained when all economic agents are considered at an instant in time.
    In this way, different patterns of behaviour of all the agents studied together
    at different points in time can be evaluated. Alternatively, the same analyses
    can be performed considering the time series given by the evolution of each economic
    agent over all time periods of the sample. In the latter case, different patterns
    of individual-by-individual behaviour could be examined over the entire time interval
    of the sample.


    Therefore, an essential characteristic of the panel data structure is its two-dimensionality.
    One dimension is the list of individuals and another dimension is the time instants.
    Consider as an example the case of the personal income tax panel (IRPF panel)
    produced by the Spanish Institute of Fiscal Studies, which aims to have a database
    with the income tax returns of the same individuals from year to year. The different
    individuals are the personal income taxpayers in the common tax territory (excluding
    the autonomous communities of the Basque Country and Navarre) and the time interval
    varies at the present time from 1999 to 2008.


    In the following paragraphs we delve a little deeper into the data structures
    embedded in the two dimensions of a panel data set. On the one hand cross-sectional
    or cross-sectional data and on the other hand time series data.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    | --- | --- | --- |


    ![image](d2d_images/chapter_title_above.png)


    # 5.1.1  Cross-sectional data 


    ![image](d2d_images/chapter_title_below.png)


    Among the most important data structures, typical in applied economics work, we
    have cross-sectional data or cross-sectional data. A cross-sectional data set
    is a sample composed of individuals, families, firms, cities, states, countries
    or other types of widely varying units collected at a given point in time. In
    general, we can assume that cross-sectional data have been obtained by random
    sampling from the underlying population. For example, if we obtain information
    on wages, education, experience and other characteristics by randomly choosing
    500 persons from the employed population, we can say that we have a random sample
    of the entire employed population.


    In the case of the personal income tax panel we consider all the variables included
    in the tax return model and they will be analysed for a given year. Considering
    the different years we will have all the cross-sections year by year.


    Cross-sectional data are very frequently used in economics and other social sciences.
    In economics, cross-sectional data analysis is closely related to different branches
    of applied microeconomics, such as tax analysis, labour economics, state and local
    public finance, industrial organisation, urban economics, demography and health
    economics. Data on individuals, households, firms and cities at a given point
    in time are important for testing microeconomic hypotheses and evaluating economic
    policies and fiscal policies.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    | --- | --- | --- |


    ![image](d2d_images/chapter_title_above.png)


    # 5.1.2  Time series data


    ![image](d2d_images/chapter_title_below.png)


    A time series data set consists of observations on a variable or variables over
    time. Typical examples of time series data are gross domestic product, money supply,
    consumer price indices, annual homicide rates or car sales figures. Since past
    events can have an influence on future events, and lagged effects on the behaviour
    of individuals are common in social science, time is an important parameter in
    time series sets. As opposed to the order of cross-sectional data, the chronological
    arrangement of observations in a time series does convey potentially important
    information.'
