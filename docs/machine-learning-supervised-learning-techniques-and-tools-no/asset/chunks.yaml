    in isolation may not have much power, but when a pool of successive annual samples
    is built up, the richness of the analysis increases exponentially and even allows
    the results obtained by means of panel analysis to be contrasted. Let us not forget
    that panel econometric techniques are not easy to implement, while there are not
    so many difficulties with pooled data. What is evident is that, in the case of
    personal income tax, as administrative records are available, stratified sampling
    with geographical criteria and some other additional type of criterion (income
    brackets or sources of income) is easy to carry out. This means that it is very
    appropriate to have both successive annual samples and a panel.


