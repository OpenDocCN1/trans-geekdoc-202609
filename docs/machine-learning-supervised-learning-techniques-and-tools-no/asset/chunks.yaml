    ![image](d2d_images/chapter_title_below.png)


    Clustering techniques are concerned with partitioning a given set of data into
    several groups or categories. They have applications in many fields such as medicine,
    biology, zoology and, above all, information technology. Most of the techniques
    that have been developed can be divided into three main groups: hierarchical,
    cost or distortion minimisation and graph theory. However, when dealing with large
    datasets, only cost minimisation techniques are suitable, for reasons of computational
    complexity.


    Given a set of data![image](d2d_images/image543.png)corresponding to n values
    of a random vector X whose distribution function Fx is unknown, but is known to
    be a mixture of m distribution functions, the problem is to form m groups or categories
    with the data according to a certain distance function or distortion measure,
    which in our case is going to be the squared Euclidean distance (the squared Euclidean
    distance).


    Each group will be represented by its centroid, i.e. its mean vector. Therefore,
    the aim is to determine m centroids, ![image](d2d_images/image101.png), in such
    a way that the distortion between each data and its centroid is minimal, i.e.
    minimised:


    ![image](d2d_images/image576.png)


    The solution of this problem leads to a partition of the data set into m classes,
    categories or regions, Ci , i \= 1, 2,...,m, defined as follows:


    ![image](d2d_images/image587.png)


    Note that, for a given partition, the representation vectors ωi , i \= 1, 2,...,m,
    also called prototypes or reference vectors, which make the distortion minimal
    are the centroids of the group, i.e:


