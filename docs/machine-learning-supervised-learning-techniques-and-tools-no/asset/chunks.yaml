    # 5.10  UNIT ROOTS AND COINTEGRATION WITH PANEL DATA


    ![image](d2d_images/chapter_title_below.png)


    Unit root tests with panel data are similar to unit root tests performed on an
    individual series. The following equation is used as a starting point:


    ![image](d2d_images/image133.png)


    Two assumptions can be made about![image](d2d_images/image574.png)The first is
    =![image](d2d_images/image677.png)an assumption used in the unit root tests of
    Levin, Lin and Chu (LLC tests), Breitung and Hadri. The second assumption allows![image](d2d_images/image009.png)to
    vary freely in the cross sections, hypothesis used in the Im, Pesaran and Sim
    (IPS) tests, in the Fisher-ADF and Fisher-PP tests proposed by Maddala and Wu
    and the Choi test.


    The Fisher-ADF and Fisher-PP tests proposed by Maddala and Wu to test for the
    existence of unit roots in panel data combine the p-values of the individual unit
    root tests. If we defineπi as the p-value of the i-th cross-section unit root
    test, then, under the null hypothesis that there is a unit root in all N cross-sections,
    it is verified:


    ![image](d2d_images/image170.png)


    Additionally Choi demonstrates that:


    ![image](d2d_images/image375.png)


    The simplest panel cointegration test is to check, by means of a panel unit root
    test, that the residuals of the panel model are free of unit roots. There are
    other formal panel cointegration tests such as the Engel and Granger   test, the
    Kao and Pedroni test and the McKoskey and Kao test.


