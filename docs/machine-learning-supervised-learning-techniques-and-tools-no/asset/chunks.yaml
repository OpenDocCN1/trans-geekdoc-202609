    ![Texto, Carta Descripción generada automáticamente](img/image579.png)


    接下来我们通过进行残差分析和计算估计误差来执行模型诊断（图 6-43）。关于残差分析，残差随机性方面观察到一些缺陷，因为残差自相关函数的某些项超出了置信带。残差正态性得到很好满足，因为残差直方图很好地拟合了高斯钟形。


    ![image](img/image033.png)


    ![Gráfico Descripción generada automáticamente](img/image186.png)


