- raw: 'We can define a neural network as a set of highly interconnected information
    processing elements, which are able to learn from the information fed to them.
    The main feature of this new neural network technology is that it can be applied
    to a large number of problems ranging from real complex problems to sophisticated
    theoretical models such as image recognition, speech recognition, signal analysis
    and filtering, classification, discrimination, financial analysis, dynamic prediction,
    etc.


    Neural Networks attempt to emulate the nervous system, so that they are able to
    reproduce some of the main tasks performed by the human brain by mirroring the
    fundamental behavioural characteristics of the human brain. What neural networks
    actually attempt to model is one of the physiological support structures of the
    brain, the neuron, and the structured and interconnected groups of several of
    them, known as networks of neurons. In this way, they build systems that exhibit
    a certain degree of intelligence. However, we must insist on the fact that Artificial
    Neural Systems, like any other man-made tool, have limitations and only bear a
    superficial resemblance to their biological counterparts. Neural networks, in
    relation to information processing, inherit three basic characteristics of biological
    neural networks: massive parallelism, non-linear response of neurons to incoming
    inputs, and information processing through multiple layers of neurons.


    One of the main properties of these models is their ability to learn and generalise
    from real examples. In other words, the network learns to recognise the relationship
    (which is equivalent to estimating a functional dependency) that exists between
    the set of inputs provided as examples and their corresponding outputs, so that,
    once learning is complete, when the network is presented with a new input (even
    if it is incomplete or contains an error), based on the functional relationship
    established therein, it is capable of generalising it by offering an output. Consequently,
    we can define an artificial neural network as an intelligent system capable not
    only of learning, but also of generalising.


    A neural network is made up of processing units called neurons or nodes. These
    nodes are organised into groups called "layers". There are generally three types
    of layers: an input layer, one or more hidden layers and an output layer. Connections
    are established between adjacent nodes of each layer. The input layer, through
    which data is presented to the network, consists of input nodes that receive information
    directly from the outside. The output layer represents the response of the network
    to a given input and this information is transferred to the outside. The hidden
    or intermediate layers are responsible for processing the information and are
    interposed between the input and output layers and are the only ones that have
    no connection with the outside.


    The most common network structure is the so-called feedforward network, as the
    connections between neurons are established in one direction only, in the following
    order: input layer, hidden layer(s) and output layer. For example, Figure 6-1
    shows a network with two hidden layers. However, there are also feedback networks,
    which can have backward connections, i.e. from nodes in one layer to processing
    elements in previous layers, as well as recurrent networks, which can have connections
    both between neurons in the same layer and from a node to itself. Figure 6-2 illustrates
    a network model in which the different types of connections we have discussed,
    i.e. forward, backward and recurrent, coexist, showing full interconnection.


