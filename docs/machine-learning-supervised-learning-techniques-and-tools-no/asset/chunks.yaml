    ## 分布


    - **逆高斯分布**。该分布适用于正尺度值且偏向较大正值的变量。如果数据值小于或等于 0 或为缺失值，则对应的案例不得用于分析。


    - **负二项分布**。该分布考虑实现 k 次成功所需的尝试次数，适用于具有非负整数值的变量。如果数据值不是整数、小于 0 或为缺失值，则对应的案例不得用于分析。负二项分布的辅助参数值可以是大于或等于
    0 的任意数；可以将其设为固定值或留给过程进行估计；当辅助参数设为 0 时，使用该分布等同于使用泊松分布。


    - **正态分布**。适用于取值围绕中心值（均值）呈对称钟形分布的尺度变量。因变量必须是数值型。


    - **泊松分布**。该分布考虑固定时间段内感兴趣事件的发生次数，适用于具有非负整数值的变量。如果数据值不是整数、小于 0 或为缺失值，则对应的案例不得用于分析。


    - **Tweedie 分布**。该分布适用于可由伽马分布的泊松混合表示的变量；该分布在“混合”意义上结合了连续（取非负实数值）和离散（在单个值 0 处具有正概率质量）分布的特性。因变量必须是数值型，且数据值必须大于或等于零。如果数据值小于
    0 或为缺失值，则对应的案例不得用于分析。Tweedie 分布参数的固定值可以是大于 1 且小于 2 的任意数。


    - **多项分布**。该分布适用于表示有序响应的变量。因变量可以是数值型或字符串型，且必须具有至少两个不同的有效数据值。


