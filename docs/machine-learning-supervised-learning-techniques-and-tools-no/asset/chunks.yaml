    Figure 1-9 Figure 1-10


    ![image](img/image692.png)


    Figure 1-11


    在模型表达式字段中，可以使用条件逻辑表达式在单个模型语句内引入分段模型（在定义域的不同部分采用不同形式的模型）。要在模型表达式或损失函数中使用条件逻辑，必须构造一系列项的和，每个条件对应一项。每项由逻辑表达式（在括号中）乘以该逻辑表达式为真时得到的结果表达式组成。例如，考虑一个分段模型，当
    X < = 0 时等于 0，当 0 < X < 1 时等于 X，当 X > = 1 时等于 1。该示例的表达式为：![image](img/image511.png)所有括号中的逻辑表达式必须可求值为
    1（真）或 0（假）。因此：如果 X < = 0，上式简化为 1*0 + 0*X + 0*1 = 0。如果 0 < X < 1，它简化为 0*0 + 1*X
    + 0*1 = X。如果 X > = 1，它简化为 0*0 + 0*X + 1*1 = 1。更复杂的示例可以通过替换不同的逻辑表达式和结果表达式轻松构造。请记住，双重不等式，如
    0 < X < 1，必须写成复合表达式的形式 ![image](img/image040.png)


    可以在逻辑表达式中使用字符串变量：(`city=''Madrid''`)*`costliv` + (`city=''Guadalajara''`)*0.59*`costliv`。这对于马德里居民得到一个表达式（变量
    `costliv` 的值），对于瓜达拉哈拉居民得到另一个表达式（该值的 59%）。字符串常量必须用引号或撇号括起来，如此示例语法所示。


    如果选择 `User-defined loss function`，则必须定义损失函数，其总和（在所有情况下）必须通过您选择的參数值最小化。大多数损失函数都包含特殊变量
    `resid_`，它表示残差。默认损失函数 `Sum of squared residuals` 可显式输入为 `resid_**2`。如果您需要在损失函数中使用预测值，它等于因变量减去残差。可以使用条件逻辑指定条件损失函数。您可以在用户定义损失函数字段中输入表达式，或将表达式的组件粘贴到该字段中。字符串常量必须用引号或撇号括起来，数值常量必须以美国格式书写，以句点分隔小数部分。


    在统计学方面，每次迭代都会获得参数估计值和残差平方和，并且对于每个模型都会获得回归平方和、残差、校正和未校正总和、参数估计值、渐近标准误差以及参数估计值的渐近相关矩阵。


