    In the following, the specification of the different sections of the network output
    is expanded.


    Network structure. Displays summary information about the neural network.


    \- Description. Displays information about the neural network, including the dependent
    variables, the number of input and output units, the number of hidden units and
    layers, and the activation functions.


    \- Diagram. Displays the network diagram as an editable graph. Note that as the
    number of covariates and factor levels increases, the diagram becomes more difficult
    to interpret.


    \- Synaptic weights. Samples the coefficient estimates that show the relationship
    between the units of a given layer with the units of the next layer. Synaptic
    weights are based on the training sample even if the active data set is split
    into training, test and reserved data. Note that the number of synaptic weights
    can be quite high, and these weights are generally not used to interpret network
    results.


    Network performance. Shows the results used to determine if the model is "good".
    Note: The graphs in this group are based on the training and test samples combined,
    or only the training sample if there is no test sample.


    \- Model summary. Displays a summary of the neural network results by partition
    and overall, including the error, the relative error or percentage of incorrect
    predictions, the stopping rule used to stop training and the training time.


    The error is the error of quadratic sums when the hyperbolic tangent, identity
    or sigmoid activation function is applied to the output layer. This is the cross-entropy
    error when the softmax activation function is applied to the output layer.


    The percentages or relative errors of incorrect forecasts are shown depending
    on the measurement levels of the dependent variable. If any dependent variable
    has a scale level of measurement, the overall average relative error (relative
    to the model mean) is shown. If all dependent variables are categorical, the average
    percentage of incorrect forecasts is shown. Relative errors or percentage of incorrect
    forecasts are also shown for individual dependent variables.


    \- Ranking results. Displays a classification table for each categorical dependent
    variable by partition and overall. Each table provides the number of correctly
    and incorrectly classified cases for each dependent variable category. The percentage
    of total cases that were correctly classified is also reported.


    \- COR curve. Displays a Receiver Operating Characteristic (COR) curve for each
    categorical dependent variable. It also shows a table providing the area under
    each curve. For a given dependent variable, the COR chart shows a curve for each
    category. If the dependent variable has two categories, each curve treats the
    category in question as the positive state vis-à-vis the other category. If the
    dependent variable has more than two categories, each curve treats the category
    in question as the positive state against the aggregation of the other categories.


    \- Cumulative earnings graph. Displays a cumulative earnings graph for each categorical
    dependent variable. The presentation of a curve for each category of dependent
    variable is the same as for the COR curves.


    \- Elevation plot. Displays an elevation graph for each categorical dependent
    variable. The presentation of a curve for each category of dependent variable
    is the same as for the COR curves.


    \- Graph of predicted by observed. Displays a plot of predicted values per observed
    for each dependent variable. For categorical dependent variables, clustered box
    plots of predicted pseudoprobabilities are shown for each response category, with
    the observed response category as the cluster variable. For scale dependent variables,
    a scatter plot is shown.


    \- Graph of residuals by predicted. Displays a plot of residuals by predicted
    values for each scale dependent variable. There should be no visible patterns
    between residuals and predicted values. This graph is only generated for scale
    dependent variables.


    Case processing summary. Displays the case processing summary table, which summarises
    the number of cases included and excluded in the analysis, in total and by training,
    test and reserved samples.


    Analysis of the importance of the independent variable. Performs a susceptibility
    analysis, which calculates the importance of each predictor in determining the
    neural network. The analysis is based on the combined training and test samples,
    or only the training sample if there is no test sample. This creates a table and
    graph showing the importance and normalised importance of each predictor. Note
    that the susceptibility analysis involves a very extensive calculation process
    that can take a long time if the number of predictors or cases is large.


