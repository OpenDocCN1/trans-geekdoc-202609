    ### 网络输出规范


    下面将扩展网络输出各部分的规范。


    #### 网络结构

    显示有关神经网络的汇总信息。


    - **描述**。显示有关神经网络的信息，包括因变量、输入和输出单元的数量、隐藏单元和层的数量以及激活函数。

    - **图表**。以可编辑图形的形式显示网络图。请注意，随着协变量和因子水平数量的增加，图表变得更难解释。

    - **突触权重**。抽样系数估计值，显示给定层单元与下一层单元之间的关系。突触权重基于训练样本，即使活动数据集被划分为训练、测试和保留数据。注意，突触权重数量可能相当高，并且这些权重通常不用于解释网络结果。


    #### 网络性能

    显示用于确定模型是否“良好”的结果。注意：本组中的图表基于训练和测试样本合并，或如果没有测试样本则仅基于训练样本。


    - **模型汇总**。按分区和总体显示神经网络结果的汇总，包括误差、相对误差或预测错误百分比、用于停止训练的停止规则以及训练时间。


    误差是当对输出层应用双曲正切、恒等或 sigmoid 激活函数时平方和的误差。当对输出层应用 softmax 激活函数时，这是交叉熵误差。


    根据因变量的测量水平显示百分比或预测错误的相对误差。如果任何因变量的测量水平为比例尺，则显示总体平均相对误差（相对于模型均值）。如果所有因变量均为分类变量，则显示平均预测错误百分比。相对误差或预测错误百分比也显示在各个因变量中。


    - **排名结果**。按分区和总体为每个分类因变量显示分类表。每个表提供每个因变量类别的正确和错误分类案例数。还报告了正确分类的总案例百分比。


    - **COR 曲线**。为每个分类因变量显示接收器操作特征（COR）曲线。它还显示提供每条曲线下面积的表格。对于给定的因变量，COR 图表为每个类别显示一条曲线。如果因变量有两个类别，则每条曲线将所讨论的类别视为相对于其他类别的正态。如果因变量有两个以上类别，则每条曲线将所讨论的类别视为相对于其他类别的聚合的正态。


    - **累积收益图**。为每个分类因变量显示累积收益图。每个因变量类别曲线的呈现方式与 COR 曲线相同。


    - **提升图**。为每个分类因变量显示提升图。每个因变量类别曲线的呈现方式与 COR 曲线相同。


    - **预测值与观测值图**。为每个因变量显示预测值与观测值的图。对于分类因变量，按响应类别显示预测伪概率的聚类箱线图，以观测响应类别作为聚类变量。对于比例尺因变量，显示散点图。


    - **残差与预测值图**。为每个比例尺因变量显示残差与预测值的图。残差与预测值之间不应有可见模式。该图仅针对比例尺因变量生成。


    #### 案例处理汇总

    显示案例处理汇总表，该表汇总了分析中包含和排除的案例数量，按总数以及训练、测试和保留样本划分。


    #### 自变量重要性分析

    执行敏感性分析，计算每个预测变量在确定神经网络中的重要性。分析基于合并的训练和测试样本，或如果没有测试样本则仅基于训练样本。这会创建显示每个预测变量的重要性及其标准化重要性的表格和图表。请注意，敏感性分析涉及非常广泛的计算过程，如果预测变量或案例数量很大，可能需要很长时间。


