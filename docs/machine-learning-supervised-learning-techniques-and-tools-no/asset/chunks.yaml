    # 5.11 stata AND THE PANEL DATA MODELS


    ![image](d2d_images/chapter_title_below.png)


    `STATA` has the `xtreg` command that allows estimating models with fixed and random
    effects panel data. Its syntax is as follows:


    Random effects model


    ```

    xtreg dependent_independent variable independent variables, re options

    ```


    The most important options are `i(variable)` to indicate the panel ID variable,
    `sa` to use the Swamy-Arora variance composites estimator, `vce(type)` to indicate
    the type of robust, bootstrap or jackknife estimation, `cluster` to adjust standard
    errors for within-group correlations, and `level(n)` for the confidence level
    n.


    Model estimated using the regression estimator between


    ```

    xtreg dependent_independent variable independent variables, be options

    ```


    The most important options are `i(variable)` to indicate the panel ID variable,
    `wls` to use the weighted least squares estimator, `vce(type)` to indicate the
    bootstrap or jackknife estimation type and `level(n)` for the confidence level
    n.


    ![image](d2d_images/scene_break.png)


    Fixed effects model


    ```

    xtreg independent_dependent variable independent variables, fe options

    ```


    The most important options are `i(variable)` to indicate the panel ID variable,
    `vce(type)` to indicate the type of robust, bootstrap or jackknife estimation,
    `cluster` to adjust standard errors for within-group correlations, and `level(n)`
    for the confidence level n.


    Maximum likelihood random effects model


    ```

    xtreg dependent_independent variable independent variables, mle options

    ```


    The most important options are `i(variable)` to indicate the panel ID variable,
    `noconstant` to remove the constant term from the model, `vce(type)` to indicate
    the type of bootstrap or jackknife estimation and `level(n)` for the confidence
    level n.


    Population average model


    ```

    xtreg dependent_independent variable independent variables, pa options

    ```

