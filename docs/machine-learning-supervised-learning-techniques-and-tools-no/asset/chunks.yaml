    # 2.8  ​Generalised linear models THROUGH STATGRAPHICS CENTURION


    ![image](d2d_images/chapter_title_below.png)


    STATGRAPHICS incorporates the Logit, Probit, Poisson and Negative Binomial models
    in the Relate → Attribute Data option (Figure 2-18).


    ![image](d2d_images/image678.png)


    Figure 2-18


    As an example we consider file 7-10.xls contains information on the variable narr86
    which represents the number of times a man is arrested during 1986 and which we
    wish to explain by the variables pcnv (proportion of previous arrests in which
    he was convicted), avgsen (average length of sentences in months), tottime (time
    in prison in months), ptime86 (time in prison in 1986 in months), qemp86 (quarters
    employed in 1986), inc86 (legal income in 1986 in hundreds of dollars), black
    (dummy worth 1 for black arrestee), hispan (dummy worth 1 for hispanic arrestee)
    and born60 (dummy worth 1 if arrestee was born in 1960).


    As the explained variable takes the value 0 in a large number of cases and only
    takes a value greater than 5 in 8 cases, a count data model could be used. The
    aim is to study the effect of the explanatory variables on the explained variable
    using Poissson count data, exponential and negative binomial. Compare the models.


    To  fit our problem to a Negative Binomial model we use Relate → Attribute Data
    → Negative Binomial Regression (Figure 2-19) and fill in the input screen of the
    procedure as indicated in Figure 2-20.


    ![image](d2d_images/image017.png)


    Figure 2-19


    ![image](d2d_images/image621.png)


    Figure 2-20


    OK is pressed and the Negative Binomial Regression Options screen is filled in
    as shown in Figure 2-21. The Tables and graphs screen is populated as shown in
    Figure 2-22.


    ![image](d2d_images/image368.png)


    Figure 2-21


    ![image](d2d_images/image092.png)


    Figure 2-22


    The Analysis Summary  output shows a very good model fit with very good joint
    significance and acceptable coarse individual significance of the estimated parameters
    (except perhaps AVGSEN and BORN60 which are significant at approximately 50%).


    ![image](d2d_images/image398.png)


    ![image](d2d_images/image699.png)


    ![image](d2d_images/image230.png)


    It is observed that the predictive equation of the estimated Negative Binomial
    model is as follows:


    ![image](d2d_images/image399.png)


    The 95% confidence intervals for the estimated parameters are presented in the
    table below:


    95.0% confidence intervals for coefficient estimates


    |  ||  || Error ||  ||  |


    | --- | --- | --- | --- | --- |


    | Parameter || Dear || Standard || Lower Limit || Upper Limit |


    | CONSTANT || 0,510418 || 0,0891951 || 0,335599 || 0,685238 |


    | PCNV || \-0,401615 || 0,0717093 || \-0,542163 || \-0,261067 |


    | AVGSEN || \-0,0238654 || 0,0156566 || \-0,0545519 || 0,00682115 |


    | TOTTIME || 0,0245856 || 0,0113967 || 0,00224842 || 0,0469228 |


    | PTIME86 || \-0,0985997 || 0,0182358 || \-0,134341 || \-0,0628582 |


    | QEMP86 || \-0,0380555 || 0,0241328 || \-0,0853549 || 0,00924395 |


    | INC86 || \-0,00808062 || 0,000930773 || \-0,00990491 || \-0,00625634 |


    | BLACK=0 || \-0,661117 || 0,0593497 || \-0,77744 || \-0,544793 |


    | HISPAN=0 || \-0,499853 || 0,0612882 || \-0,619976 || \-0,37973 |


    | BORN60=0 || 0,0510633 || 0,0525824 || \-0,0519964 || 0,154123 |


