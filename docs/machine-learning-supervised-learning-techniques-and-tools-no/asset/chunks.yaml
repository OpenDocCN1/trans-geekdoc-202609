    # 3.2  ​DISCRETE CHOICE MODELS


    ![image](d2d_images/chapter_title_below.png)


    The functional expression of the multiple regression analysis model is![image](d2d_images/image686.png).
    Multiple regression admits the possibility of working with discrete rather than
    continuous dependent variables to allow the modelling of discrete phenomena. When
    the dependent variable is a discrete variable reflecting individual decisions
    in which the choice set consists of separate and mutually exclusive alternatives,
    we are dealing with discrete choice models. When the dependent variable is discrete
    and takes only a small number of values, it does not make sense to treat it as
    if it were a continuous variable and it is usually of interest to characterise
    the probability that an agent takes a certain discrete decision, conditional on
    the values of certain explanatory variables. These distribution functions that
    characterise probabilities for each value of the explanatory variables are usually
    non-linear and do not usually have an analytical solution, so it is usually necessary
    to resort to numerical methods. Discrete choice models in which the choice set
    has only two possible alternatives are called binary choice models. When the choice
    set has several discrete values, these are called multiple choice models or multinomial
    models.


    Discrete choice models are called count data models when the values of the discrete
    dependent variable are numbers that do not reflect categories. In case the numerical
    values of the discrete dependent variable reflect categories, the models are called
    categorical discrete choice models, and are usually classified into ordered categorical
    discrete choice models (the numerical values have no quantitative meaning and
    reflect an ordering of categories) and unordered categorical discrete choice models
    (the numerical values reflect only categories).


