    data censoring. A censored regression model is one whose dependent variable is
    censored above (upper censoring) or below (lower censoring) some value, i.e. the
    dependent variable is not observed for a part of the population. In censored regression
    models the underlying dependent variable is approximately continuous, but is either
    under-censored or over-censored, due to the way we collect the data or to institutional
    constraints.


    A particular case of data censoring occurs when the dependent variable is zero
    for a large part of the population and is continuous for positive values. We are
    then dealing with a bounded variable model with a corner solution. The Tobit model
    is explicitly designed for dependent variables that have corner solutions. These
    variables are zero for a considerable proportion of the population but are approximately
    continuously distributed for positive values.


