    ![image](img/chapter_title_below.png)


    `NLIN` 过程使用最小二乘法或加权最小二乘法拟合非线性模型。估计方法是迭代的，使用 Newton、梯度、Gass-Newton、Marquardt 或假位（DUD）算法。语法如下：


    ![image](img/image581.png)


    `BOUNDS` 语句将估计参数限制为指定条件。`BY` 语句指定变量以执行子组。`DER` 语句指定一阶或二阶偏导数。`ID` 语句指定要添加到输出数据集的附加变量。`MODEL`
    语句定义因变量与自变量之间拟合的关系。`OUTPUT` 语句创建输出数据集。`PARMS` 语句标识要估计的参数及其初始值。`CONTROL` 语句声明控制变量并指定其值。


