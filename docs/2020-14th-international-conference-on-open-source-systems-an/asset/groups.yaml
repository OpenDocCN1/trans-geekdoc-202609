    # 2020 14th International Conference on Open Source Systems and Technologies (ICOSST)


    # AI Detect: A Machine Learning Based Approach for Fault Identification in Gear
    Bearing System using Low-Frequency Data


    Muhammad Usman*, Shahzad Anwar, Muhammad Akmal and Abdul Hafez


    Department of Mechanical Engineering, University of Engineering and Technology
    Peshawar, Khyber Pakhtunkhwa, Pakistan


    *Corresponding author: uetpmwct@upeteshawar.edu


    **Abstract—** Rotary machines are essential components of any industrial operation.
    A fault in these machines can result in some of damage causing a fatal failure
    of the system. This work develops a low-frequency technique for effectively detecting
    various faults in a gear bearing system using a monitoring rig that observes the
    vibration profile of gears and bearings in a system using low-frequency data extracted
    from the side using MATLAB. A machine learning model based on bagged tree is trained
    on these features and validated. The highest accuracy of 96.65% with a proportion
    of 80% and 20% split of 80% and 20% shows the effectiveness of the developed algorithm,
    comparison with SVC and KNN method is demonstrated.


    Ensemble classifiers combine individual classifiers that aggregate results either
    weighted or unweighted classification. The ensemble classification accuracy is
    generally much higher than the individual classifier [6]. There are many ensemble
    classifiers like bagging (as bootstrap aggregation) [7], boosting and Random Forest
    are commonly introduced. Many random algorithms can increase predictive maintenance.
    In this study, six universal and Random forest (RF) have achieved an average accuracy
    of 95.56% when compared with the algorithm average accuracy of 95.33%.


    In supervised learning, decision trees are popular to design variant and robust
    algorithms. They mimic the human brain for decision making, which makes them suitable
    for industrial applications like fault detection [10]. Item et al. [11] investigate
    tree selection for industrial applications. Lee et al. [12] detect fault from
    a faulty bearing, where bearing status using principal component analysis (PCA)
    is also used with the C.5 detection tree models and results are compared with
    a normal tree to show the effects. There are many types of decision trees that
    have unique characteristics and are suitable for fault classification. In some
    cases [13] diagnosed gearbox faults using back propagation (BP) neural network
    and the AdaBoost-based algorithm. Vernek et al. [14] presented tree selection
    to select the most features from the set of extracted features.


    **Keywords—** Fault diagnosis, ensemble, tree, frequency data, statistical features.


    # INTRODUCTION


    Gears and bearings are the main components of machines. A defect in these components
    sometimes triggers a fault that could lead to catastrophic failure. According
    to Ni et al. [1], 40.55% of faults occur due to bearing failure. Gearboxes (as
    an important component in a machine) are likely to cause a failure due to high
    speed and complex operation [2]. Machine learning strategies are emerging moving
    from preventive to condition-monitoring techniques due to an increasing need for
    low cost, higher quality, and safety protection.


    Researchers have focused on machine fault prediction and detection to shut down
    hence, reducing production loss. Consequently, many developed methods have adopted
    fault identification for industrial machines. They have implemented vibration-based
    methods for fault detection due to the increased demand and machine reliability
    [4], Time-domain features for fault detection and in some cases, frequency domain
    features are extracted for fault identification. Other common techniques include
    signature analysis, temperature monitoring, noise signature analysis, acoustic,
    and envelope analysis.


    Fault extraction is challenging from raw signals due to laboriously time-consuming
    and most of the time error-prone. Therefore, machine learning methods could automate
    the fault detection process based on features that are indispensable [5].


    Support vector machine (SVM) classification algorithms classifies faults efficiently
    in comparison with classifiers [15]. Solamani et al. [16] identified four different
    types of gears using fault signal processing and SVM. The developed method based
    on their research on gearbox gears connected with a motor of motorcycle resulted
    in fault classification having 22.5% error in salient features and 25% using randomly
    selected features.


    Gunerkar et al. [18] propose ANN and KNN methods for fault classification in bearings.
    The signals from the accelerometer were processed and denoised using wavelet transform,
    features are extracted from the denoised signal. These features are featured in
    a train-test split with 80% and 20%. These features along with different speed
    and loading conditions are used as input to ANN and KNN. There are many classifier
    than KNN. In literature, there are many learning algorithms, and choosing the
    right for a specific task is classification accuracy. Carana et al. [19] used
    various machine learning algorithms including decision trees, random forest, SVM,
    neural networks, logistic regression and boosted stumps. Their study concluded
    that the best performing algorithm is boosted trees, random forest, uncalibrated
    trees and uncalibrated neural networks. In this research decision tree is used
    for classification of gears and bearings.


    The frequency at which data is collected is critical in many experimental setups.
    Using data for high-frequency data is expensive, however, in most research high
    sampling frequency is rare for fault identification. Soleimani et al. [16] have
    used 16384 Hz and 1420 rpm for extraction. Zhang et al. [13] used 5120 Hz and
    880 rpm. Chen et al. [15] have used 44.1 Hz and 1900 rpm respectively.


    This paper contributes to the development of a rig for testing gears and bearings
    with a marked speed of 400-600 rpm. The data was collected using accelerometer
    with frequency of 500 Hz which is much lower than the frequency used for target
    feature.


    # II. MATERIALS AND METHODOLOGY


    The apparatus consists of a motor, bearings, gears, a sensor and other components.
    The sensor signal is complicated and extraction of fault information requires
    expertise. The following section presents the methodology.


    # A. Statistical Features


    Feature extraction is an important part of this research. Kurtosis, skewness,
    mean and some other features are selected in TABLE 1. Kurtosis and skewness are
    advanced functions. The kurtosis shows the peak value of the probability density
    function (PDF) and skewness shows whether the signal is positively or negatively
    skewed. For healthy components kurtosis is approximately 3 with 0 skewness when
    the fault develops the signal generates negatively or positively skewed [20][21].


    In TABLE 1, $x_i$ is the value of the input, $\bar{x}$ is the mean of the input
    vector, $n$ is the number of elements in the input vector and $\sigma$ is the
    standard deviation. The quality of model training depends on the features of the
    data. These features are extracted after acquiring data through an accelerometer
    as shown in Fig. 1.


    ### PARAMETERS

    | Name | Description |

    | :--- | :--- |

    | Skewness | $g = \sum(x_i-\bar{x})^3/\sigma^3$ |

    | Kurtosis | $k = \sum(x_i-\bar{x})^4/\sigma^4 - 3$ |

    | Variance | $v = \sum(x_i-\bar{x})^2/n$ |

    | Mean | $m = x_1 + ... + x_n/n$ |

    | Median | $M = (n+1)/2$ |

    | Standard Deviation | $\sigma = \sqrt{\sum(x_i-\bar{x})^2/n}$ |

    | RMS | $RMS = \sqrt{\sum x_i^2/n}$ |


    ### B. Decision Tree Algorithm


    Decision tree are built as a top-down flow chart in which each block represents
    a tree node. In each node tree has two or several branches. The decision tree
    divides the number of classes based on the conditions in each node. The best splitting
    is chosen to split the data into branched nodes starting from the root and a tree
    structure is formed. Finally, a stopping criterion is applied in the terminal
    nodes of the decision tree.


    ### C. Bagged Tree Algorithm


    Bagging (Bootstrap Aggregation) is a general algorithm that is used to reduce
    variance. The decision tree used classification and regression models normally
    have high variance. These algorithms work perfectly with specific data that creates
    variance. In such cases, the decision tree from many different differs. Therefore,
    bagging is used to reduce the variance in the decision tree. The voting classifiers
    are created using bootstrap sampling techniques. In Bauer et al. [8], bootstrap
    samples are created by taking a uniform sample of size B from an initial dataset
    of S by randomly sampling


