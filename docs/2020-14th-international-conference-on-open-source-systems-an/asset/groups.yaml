    # 2020 14th International Conference on Open Source Systems and Technologies (ICOOST)


    elements from the initial dataset. T bootstrap samples created of size B. Each
    B creates a classifier $C_t$, T number of individuals are created. A final classifier
    $C''$ is built from $C_t$ whose output is predicted by its sub-classifier, with
    ties broken randomly.


    Let T be the number of bootstrap samples, S the number of samples and I the number
    then the bagging algorithm can be formulated [8]:

    1. $i = 1$ to $I$

    2. $S'' = \text{bootstrap samples from } S$

    3. $C_i = C(S'')$

    4. $C'' = \text{argmax}_{y} \sigma_{C_i}(x)$ (the most often predicted value).


    The focus of this paper is on the single-stage gear apparatus with a constant
    load of 500 rpm. Numerical features are extracted from an array of 5000 samples
    are collected in a duration of 10 seconds. These features are extracted from different
    configurations states that are given in TABLE II. The procedure adopted for this
    research is shown in Fig. 1. The features with least variance are filtered. The
    remaining features are used as input vectors for the subsets. The proposed algorithm
    based on a bagged tree is trained using 80% of the filtered features, the remaining
    20% is used for testing and validation. The learning algorithm is tested with
    a different number of learners and iterations.


