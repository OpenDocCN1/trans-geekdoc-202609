    | | H | FG | FB | PFG |

    |---|---|---|---|---|

    | H | 14 | 0 | 0 | 0 |

    | FG | 14 | 0 | 0 | 0 |

    | FB | 0 | 1 | 0 | 0 |

    | FGB | 0 | 0 | 13 | 0 |

    | PFG | 0 | 0 | 14 | |


    ![](img/6b21703010358de8762b84cb51ef2cfb_4_0.png)


    图. 6. 提议方法的混淆矩阵（留出测试）


    该方法在留出测试比例下的准确率高于 SVM 和 KNN，部分是因为轴承故障以及未能产生显著振动导致的；它们改变了振动特征，使其难以检测。


    V. 结论与未来工作


    在该研究中，通过 Bag 方法提议方法的准确率高于 SVM 和 KNN。未来将增加特征数量的研究。


