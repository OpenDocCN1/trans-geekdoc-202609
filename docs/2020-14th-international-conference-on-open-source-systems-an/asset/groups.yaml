    # 2020 年第14届开源系统与技术国际会议 (ICOSST)


    # AI 检测：一种基于机器学习的低频数据齿轮轴承系统故障识别方法


    Muhammad Usman*, Shahzad Anwar, Muhammad Akmal 和 Abdul Hafez


    巴基斯坦，开译尔-帕什图图瓦省，白塞培尔工程技术大学，机械工程系


    *通讯作者：uetpmwct@upeteshawar.edu


    **摘要—** 旋转机械是任何工业运行中必不可的组件。这些机器的故障会导致某些损坏，从而引发系统的致命性故障。本工作开发了一种低频技术，通过使用 MATLAB
    从侧面提取低频数据，利用监测台观察系统系统中齿轮和轴承的振动特性，从而有效检测齿轮轴承系统中的各种故障。基于袋装树（bagged tree）的机器学习模型对这些特征进行了训练和验证。在
    80% 和 20% 的划分比例下，达到了 96.65% 的最高准确率，显示了所开发算法的有效性，并与 SVC 和 KNN 方法进行了对比演示。


    集成分类器通过加权或未加权的分类来聚合单个分类器的结果。集成分类的准确率通常高于单个分类器 [6]。通常介绍了许多集成分类器，如装袋（作为自助聚合）[7]、提升（boosting）和随机森林。许多随机算法可以增加预测性维护。在本研究中，六种通用算法和随机森林（RF）在与算法比较时，达到了平均准确率
    95.56%，而另一种算法的平均准确率为 95.33%。


    在监督学习中，决策树在设计稳健变体算法方面非常流行，它们模拟人类的决策过程，适用于工业应用。Item 等人 [10] 研究了用于工业应用的决策树选择。对于轴承状态，Lee
    等人 [12] 使用主成分分析（PCA）结合 C 检测了故障轴承。在决策树故障检测中，结果显示，许多类型的决策树具有独特特征并适用于故障分类。在某些情况下，[13]
    使用 AdaBoost 和反向传播（BP）神经网络诊断了齿箱故障。Vernek 等人 [14] 展示了从特征集中提取的决策树选择。


    **关键词—** 故障诊断，集成，树，频率数据，统计特征。


    # 引言


    齿轮和轴承是机器的主要组件。这些组件的缺陷有时会触发灾难性故障。根据 Ni 等人 [1]，40.55% 的故障由于轴承发生。齿轮箱（机器中的重要组件）由于高速度和复杂运行可能导致故障。机器学习策略专注于机器故障预测和检测，从而减少生产损失。因此，许多开发方法采用了基于振动的故障检测。其他常用技术包括特征分析、温度监控、声学特征分析和包络分析。


    从原始信号提取故障是耗时且容易出错的。因此，基于特征的机器学习方法对于故障检测是必不可少的 [5]。支持向量机（SVM）分类算法在分类器比较中高效地分类故障。Solamani
    等人 [16] 使用 SVM 处理信号并识别了四种类型的齿轮，其研究结果在齿轮故障分类中的准确率为 22.5% 和 25%。


    Gunerkar 等人 [18] 提出了 ANN 和 KNN 方法用于轴承故障分类。来自加速度计的信号经过处理并使用小波变换去噪，从去噪信号中提取特征。这些特征在不同的速度和负载条件下通过
    80% 和 20% 的训练测试划分作为 ANN 和 KNN 的输入。在文献中，有许多学习算法用于特定任务的分类。Carana 等人 [19] 使用了包括决策树、随机森林、SVM、神经网络、逻辑回归和增强分类桩（boosted
    stumps）在内的多种机器学习算法。他们的研究得出，最好的算法是增强树、随机森林、未校准树和未校准神经网络。在本研究中，决策树用于齿轮和轴承的分类。


    在许多实验设置中，采集数据的频率至关重要。然而，在大多数研究中，高采样频率很少见。Soleimani 等人 [16] 使用了 16384 Hz 和 1420
    rpm。Zhang 等人 [13] 使用 5120 Hz 和 880 rpm。Chen 等人 [15] 分别使用了 44.1 Hz 和 1900 rpm。


    本文贡献了一个用于测试 400-600 rpm 标记速度齿轮和轴承的台架。数据使用频率为 500 Hz 的加速度计采集，该频率远低于目标特征频率。


    # II. 材料与方法


    该设备由电机、轴承、齿轮、传感器和其他组件组成。传感器信号是复杂的，提取故障信息需要专业知识。下节介绍方法论。


    # A. 统计特征


    特征提取是本研究的重要部分。表 1 中选择了峭度、偏度、平均值和一些其他特征。峭度和偏度是高级函数。峭度显示概率密度函数（PDF）的峰值，偏度显示信号是正偏还是负偏。对于健康组件，当峭度约为
    3，偏度为 0；当故障发生时，信号产生负偏或正偏 [20][21]。


    在表 1 中，$x_i$ 是输入值，$\bar{x}$ 是输入向量的平均值，$n$ 是输入向量中的元素个数，$\sigma$ 是标准差。模型训练的质量取决于数据的特征。这些特征是通过加速度计获取数据后提取的，如图
    1 所示。


    ### 参数

    | 名称 | 描述 |

    | :--- | :--- |

    | 偏度 | $g = \sum(x_i-\bar{x})^3/\sigma^3$ |

    | 峭度 | $k = \sum(x_i-\bar{x})^4/\sigma^4 - 3$ |

    | 方差 | $v = \sum(x_i-\bar{x})^2/n$ |

    | 平均值 | $m = x_1 + ... + x_n/n$ |

    | 中位数 | $M = (n+1)/2$ |

    | 标准差 | $\sigma = \sqrt{\sum(x_i-\bar{x})^2/n}$ |

    | 均方根 (RMS) | $RMS = \sqrt{\sum x_i^2/n}$ |


    ### B. 决策树算法


    决策树构建为自上而下的流程图，其中每个块代表一个树节点。每个节点有两个或多个分支。决策树根据节点中的条件划分类别。选择最佳划分方式从根节点将数据划分为分支节点，形成树结构。最后，在决策树的终端节点应用停止准则。


    ### C. 袋装树算法


    装袋（作为自助聚合）是一种减少方差的通用算法。决策树用于分类和回归的模型通常具有高方差。这些算法在产生方差特定数据上效果完美。在这种情况下，许多不同的决策树存在差异。因此，装袋用于减少决策树的方差。投票分类器使用自助采样技术创建。在
    Bauer 等人 [8] 中，通过从初始数据集 S 中随机采样一个大小为 B 的均匀样本来创建自助样本。


    ![](img/6b21703010358de8762b84cb51ef2cfb_1_0.png)


    图 1. 数据提取流程图


