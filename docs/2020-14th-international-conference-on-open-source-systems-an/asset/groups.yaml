    # 2020 第14 届开源系统与技术国际会议 (ICOSST)


    ## 表 V 集成分类器准确率


    ## 表 VI 与不同算法的对比


    | 序号 | 集成方法 | 学习器数量 | 划分次数 | 特征数量 | 准确率 |

    |---|---|---|---|---|---|

    | 1 | 提议方法 | 40 | 40 | 8 | 98.6% |

    | 2 | Bag [6] | 40 | 40 | 9 | 96.2% |

    | 3 | Bag [6] | 40 | 40 | 7 | 97.1% |


    | 留出测试比例 | SVM [15] | KNN [16] | 提议方法 |

    |---|---|---|---|

    | 0.45 | 91.1% | 89.2% | 98.4% |

    | 0.35 | 91.8% | 88.6% | 97.0% |

    | 0.23 | 92.9% | 89.4% | 97.1% |

    | 0.15 | 93.1% | 86.2% | 94.3% |

    | 0.1 | 93.7% | 88.8% | 96.8% |

    | 0.05 | 94.0% | 88.5% | 92.3% |


    提议方法实现的准确率达到 98.6%。在开发的方法中，输入矩阵包含总计 8 个特征。当使用特征用于算法时，准确率仅为 96.2%，当排除更多具有显著性证据的特征时，准确率下降到
    71%。


    图 6 中的混淆矩阵显示，一个示例 FB 被错误分类为 FG。这部分是因为轴承故障以及未能产生显著振动导致的；它们改变了振动特征，使其难以检测。该方法成功地以
    100% 的准确率识别了机器状态；FG 和 G 的严重故障也以 100% 的准确率被完美识别。


    为了评估提议算法的有效性，与 KNN [16] 和 SVM [15] 进行了对比。结果如表 VI 所示。开发的方法显示，在 0.2 的留出测试比例下，提议方法的准确率为
    96.6%，而 SVM 为 91.4%，KNN 为 90%。提议方法的准确率达到了 97.1% 和 87%。卷积神经网络 [15] 算法也对数据进行了测试，在
    22 个 epoch（轮次）下的平均准确率为 96%。


    所有故障类型的 ROC 曲线如图 7 所示。留出测试比例和曲线下面积给出表 VII 中。提议方法的 AUC 非常高，达到 99.7%。SVM 紧随开发方法之后，而
    KNN 紧随其后。提议方法的真正例率为：


    | 方法 | 准确率 |

    |---|---|

    | 提议方法 | 99.7% |

    | SVM | 97.7% |

    | KNN | 93% |


    ![](img/6b21703010358de8762b84cb51ef2cfb_4_0.png)


    图. 7. 提议方法、SVM 和 KNN 的 ROC 曲线


