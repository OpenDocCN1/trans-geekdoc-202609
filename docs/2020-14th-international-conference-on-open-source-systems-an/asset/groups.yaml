    This paper contributes to the development of a rig for testing gears and bearings
    with a marked speed of 400-600 rpm. The data was collected using accelerometer
    with frequency of 500 Hz which is much lower than the frequency used for target
    feature. The extraction and features selection based on the variance make it less
    challenging for fault diagnosis in gears and bearings using tree classifiers.
    The results from the proposed method are compared with other machine learning
    algorithms.


