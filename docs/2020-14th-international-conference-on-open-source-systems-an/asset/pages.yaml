    \n*Corresponding author: uetpmwct@upeteshawar.edu\n\n**Abstract—** Rotary machines\
    \ are essential components of any industrial operation. A fault in these machines\
    \ can result in some of damage causing a fatal failure of the system. This work\
    \ develops a low-frequency technique for effectively detecting various faults\
    \ in a gear bearing system using a monitoring rig that observes the vibration\
    \ profile of gears and bearings in a system using low-frequency data extracted\
    \ from the side using MATLAB. A machine learning model based I-a bagged tree is\
    \ trained on these features and validated. The highest accuracy of 96.65% with\
    \ a proportion of 80% and 20% split of 80% and 20% shows the effectiveness of\
    \ the developed algorithm, comparison with SVC and KNV method is demonstrated.\n\
    \nEnsemble classifiers combine individual classifiers that aggregate results either\
    \ weighted or unweighted classification. The ensemble classification accuracy\
    \ is generally much higher than the individual classifier [6]. There are many\
    \ ensemble classifiers like bagging (as bootstrap aggregation) [7], boosting and\
    \ Random Forest are commonly introduced. Many random algorithms can increase predictive\
    \ maintenance. In this study, six universal and Random forest (RF) have achieved\
    \ an average accuracy of 95.56% when compared with the algorithm average accuracy\
    \ of 95.33%.\n\nIn supervised learning, decision trees are popular to design variant\
    \ and robust algorithms. They mimic the human brain for decision making, which\
    \ makes them suitable for industrial applications like fault detection [10]. Item\
    \ et al. [11] investigate tree selection for industrial applications. Lee et al.\
    \ [12] detect fault from a faulty bearing, where bearing status using principal\
    \ component analysis (PCA) is also used with the C.5 detection tree models and\
    \ results are compared with a normal tree to show the effects. There are many\
    \ types of decision trees that have unique characteristics and are suitable for\
    \ fault classification. In some cases [13] diagnosed gearbox faults using back\
    \ propagation (BP) neural network and the AdaBoost-based algorithm. Vernek et\
    \ al. [14] presented tree selection to select the most features from the set of\
    \ extracted features.\n\n**Keywords—** Fault diagnosis, ensemble, tree, frequency\
    \ data, statistical features.\n\n# INTRODUCTION\n\nGears and bearings are the\
    \ main components of machines. A defect in these components sometimes triggers\
    \ a fault that could lead to catastrophic failure. According to Ni et al. [1],\
    \ 40.55% of faults occur due to bearing failure. Gearboxes (as an important component\
    \ in a machine) are likely to cause a failure due to high speed and complex operation\
    \ [2]. Machine learning strategies are emerging moving from preventive to condition-monitoring\
    \ techniques due to an increasing need for low cost, higher quality, and safety\
    \ protection.\n\nResearchers have focused on machine fault prediction and detection\
    \ to shut down hence, reducing production loss. Consequently, many developed methods\
    \ have adopted fault identification for industrial machines. They have implemented\
    \ vibration-based methods for fault detection due to the increased demand and\
    \ machine reliability [4], Time-domain features for fault detection and in some\
    \ cases, frequency domain features are extracted for fault identification. Other\
    \ common techniques include signature analysis, temperature monitoring, noise\
    \ signature analysis, acoustic, and envelope analysis.\n\nFault extraction is\
    \ challenging from raw signals due to laboriously time-consuming and most of the\
    \ time error-prone. Therefore, machine learning methods could automate the fault\
    \ detection process based on features that are indispensable [5].\n\nSupport vector\
    \ machine (SVM) classification algorithms classifies faults efficiently in comparison\
    \ with classifiers [15]. Solamani et al. [16] identified four different types\
    \ of gears using fault signal processing and SVM. The developed method based on\
