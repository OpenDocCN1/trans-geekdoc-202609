    # B. Bagged algorithm for fault detection


    The bagged algorithm is implemented with a different number of learners and students.
    The learners represent the individual weak classifier that consolidates the ensemble
    classifier. The simplest represents the number of branches or nodes for the classifier.
    The training is performed with a total of 350 samples. Each sample contains features
    (unlabeled) with a total of 3150 features. Each feature vector is an attribute
    that belongs to a specific fault. The bagged tree algorithm is also compared with
    the results of SVM and KNN algorithms on the acquired data that are implemented
    respectively. The performance of the algorithm is shown in Fig. 6 and ROC curve
    as shown in Fig. 7.


    # IV. RESULTS


    The results of the developed method and ensemble algorithms are shown in TABLE
    V. The learning model is trained with 80% of data and the 20% is used for validation.


    It is found that the developed method performs significantly better than the bagged
    tree in fault classification, due to the removal of low variance fault features.
