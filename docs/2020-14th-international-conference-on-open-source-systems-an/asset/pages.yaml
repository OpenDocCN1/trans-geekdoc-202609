    and 44 mm of teeth. The module of the gear is equal to 1.4. The spur gear is driven
    by voltage regulator connected with the motor. A motor is installed at the end
    of the driven gear shaft. The gears have a 1:1 ratio. The motor operates at a
    constant speed of 50 Hz without any load during the experiments.


