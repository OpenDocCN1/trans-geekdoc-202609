    The developed method has potential applications, such as Predictive maintenance
    that helps avoiding catastrophic industrial failures thus avoiding production.


    # V. CONCLUSION AND FUTURE WORK


    In this study, bearing and gears are classified using the Bagged tree. Data is
    extracted from a single-stage gear with a 500 Hz sampling rate. Five different
    machine conditions are diagnosed using this method. The proposed method has achieved
    98.6% classification accuracy. The algorithm for SVM and KNN algorithms based
    on different holdout ratios obtained an average accuracy of 91.7% and 87% respectively.
    The developed method has achieved an accuracy of 90% for different holdout ratio.


    In future, increasing the number of faults, which requires collection of additional
    data that will ultimately result in increased accuracy of the algorithm is in
    progress.


