  md: "```\n// session, or zero if the request is from an unauthenticated user.\n\
    func (app *application) authenticatedUser(r *http.Request) int {\n    return app.session.GetInt(r,\
    \ \"userID\")\n}\n```\n\n**Important:** In this code we're using the GetInt()\
