    # Enabling Modules


    The next thing we need to do is Go Know that we want to use the new modules functionality
    to help manage (and version control) any third-party packages that our project
    imports.


    To do this we first need decide what the module path for our project should be.


    The important thing here is uniqueness. To avoid potential import conflicts with
    other people''s packages or the standard library in the future, you want to choose
    a module path that is globally unique and unlikely to be used by anything else.
    In the Go community, a common convention is to namespace your module paths by
    basing them on a URL that you own.'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'In my case a clear, succinct and *unlikely-to-be-used-by-anything-else* module
    path for this project would be alexwards.net/snippetbox, and we will use this
    throughout the rest of the book. If possible, you should swap this for something
    that''s unique to you intend.


    Now that we''ve decided a unique module path let''s enable modules for the project.


    To do this make sure that you''re in the root of your project directory, and then
    run the go mod init command — passing in your module path as a parameter like
    so:


    ```

    $ cd $HOME/code/snippetbox

    $ go mod init alexedwards.net/snippetbox

    go: creating new go.mod: module alexedwards.net/snippetbox

    ```


    At this point your project directory should look a bit like the screenshot below.
    Notice the go.mod file which has been created?'
