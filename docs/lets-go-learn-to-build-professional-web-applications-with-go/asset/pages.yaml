    \ ORDER BY created DESC LIMIT 10\n```\n\nOpen up the pkg/models/mysql/snippets.go\
    \ file and add the following code:\n\n```\nFile: pkg/models/mysql/snippets.go\n\
    \npackage mysql\n\nimport (\n    \"database/sql\"\n\n    \"alexedwards.net/mapbox/pkg/models\"\
    \n)\n\ntype SnippetModel struct {\n    DB \"sql.DB\n}\n```"
