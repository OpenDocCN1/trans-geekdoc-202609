- pgno: 242
  md: 'can''t cope with conflicting patterns caused by wildcard parameters, which
    can be a problem for applications that are using a RESTful routing scheme (in
    our case /snippet/create and /snippet/:id are conflicting patterns). If that doesn''t
    apply to you though, it''s a solid choice.


    Hint: use the Router.Handler() and Router.HandlerFunc() to register your routes
    — unlike the other methods they''re compatible with the standard Go middleware
    and handler patterns.


    +   - dimfeld/httptreem is another radix-tree based router but is designed so
    that it doesn''t suffer from the conflicting patterns that julienschmidt/httrouter
    has. A downside is that it only allows you to register http.HandlerFunc — not
    http.Handler objects — which means that it doesn''t work nicely with route-specific
    middleware that uses the standard pattern we described earlier.


    +   - go-chi/chi is another popular option which uses a radix-tree for pattern
    matching and has a nice, flexible API. Notably, it also includes a go-chi/chi/middleware
    sub-package containing a range of useful middleware.'
