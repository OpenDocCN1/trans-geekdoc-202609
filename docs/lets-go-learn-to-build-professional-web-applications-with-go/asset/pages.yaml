- pgno: 154
  md: "```\n...\nfunc (m *SnippetModel) Latest ([][]*models.Snippet, error) {\n\t\
    // Write the SQL statement we want to execute.\n\tstmt := `SELECT id, title, content,\
    \ created, expires FROM snippets\nWHERE expires = UTC_TIMESTAMP() ORDER BY created\
    \ DESC LIMIT 10` \n\n\t// Use the Query() on the connection pool to execute our\n\
    \t// SQL statement. This returns a sql.Rows resultset containing the result o\n\
    \t// our query.\n\trows, err := m.DB.Query(stmt)\n\tif err != nil {\n\t\treturn\
    \ nil, err\n\t}\n\n\t// We defer rows.Close() to ensure the sql.Rows resultset\
    \ is\n\t// always properly closed before the Latest() method returns. This defer\n\
    \t// statement should come *after* you check for an error from the Query\n\t//\
    \ method. Otherwise, if Query() returns an error, you'll get a panic\n\t// trying\
    \ to close a nil resultset.\n\tdefer rows.Close()\n\n\t// Initialize an empty\
    \ slice to hold the models.Snippet objects.\n\tsnippets := []*models.Snippet{}\n\
    \n\t// Use rows to iterate through the rows in the resultset. This\n\t// prepares\
    \ the first (and each subsequent) row to be acted on by the\n\t// rows.Scan()\
    \ method. If iteration over all the rows completes the\n\t// resultset automatically\
    \ closes itself and frees-up the underlying\n\t// database connection.\n\tfor\
    \ rows.Next() {\n\t\t// Create a pointer to a new zered Snippet struct.\n\t\t\
    s := &models.Snippet{}\n\t\t// Use rows.Scan() to copy the values from each field\
    \ in the row to the\n\t\t// new Snippet object that we created. Again, the arguments\
    \ to row.Scan\n\t\t// are pointers to the place you want to copy the data into,\
    \ and the\n\t\t// number of arguments must be exactly the same as the number of\n\
    \t\t// columns returned by your statement.\n\t\terr := rows.Scan(&s.ID, &s.Title,\
    \ &s.Created, &s.Expires)\n```"
