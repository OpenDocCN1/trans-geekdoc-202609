  md: 'Chapter 13.3.


    # End-To-End Testing


    In the last chapter we talked through the general pattern for how to unit your
    HTTP handlers in isolation.


    But — most of the time — your HTTP handlers aren’t *actually used* in isolation.
    So in this chapter we’re going to explain how to run *end-to-end tests* on our
    web application that encompass your routing, middleware and handlers. Arguably,
    end-to-end testing should give you more confidence that your application is working
    correctly than unit testing in isolation.


    To illustrate this


    Essentially, we want to test that our application has a route like this:


    | Method | Pattern | Handler | Action |

    | --- | --- | --- | --- |

    | ... | ... | ... | ... |

    | GET | /ping | ping | Return a 200 OK response |'
  merge: -1
  img_proc: true
- pgno: 438
  md: "# Using htttest.Server\n\nThe key to end-to-end testing our application is\
    \ the htttest.NewTLSServer() function, which spins up a httptest.Server instance\
    \ that we can make HTTPS requests to.\n\nThe whole pattern is a bit too complicated\
    \ to explain upfront, so it's probably best to demonstrate first by writing the\
    \ code and then we'll talk through the details afterwards.\n\nHead back to your\
    \ handlers_test.go file and update the TestPing test so like:\n\n```\nFile: cmd/web/handlers_test.go\n\
    package main\n\nimport (\n    \"io/ioutil\"\n    \"log\" // New import\n    \"\
    net/http\"\n    \"net/http/httptest\"\n    \"testing\"\n)\n\nfunc TestPing(t *testing.T)\
    \ {\n    // Create a new instance of our application struct. For now, this is\
    \ just\n    // contains a couple of mock loggers (which discard anything written\
    \ to\n    // them).\n    app := &application{\n        errorLog: log.New(ioutil.Discard,\
    \ \"\", 0),\n        infoLog: log.New(ioutil.Discard, \"\", 0),\n    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 439
  md: "```\n// We use the httptest.NewTLSServer() function to create a new test\n\
    // server, passing in the value returned by our app.routes() method as the\n//\
    \ handler for the server. This starts up an HTTPS server which listens on a\n\
    // randomly-chosen port of your local machine for the duration of the test.\n\
    // Notice that we defer a call to ts.Close() to shut down the server when\n//\
    \ the test finishes.\nts := httptest.NewTLSServer(app.routes())\ndefer ts.Close()\n\
    \n// The network address that the test server is listening on is contained\n//\
    \ in the ts.URL field. We can use this along with the ts.Client().Get()\n// method\
    \ to make a GET /ping request against the test server.\n// returns a http.Response\
    \ containing the response.\nrs, err := ts.Client().Get(ts.URL + \"/ping\")\nif\
    \ err != nil {\n\tt.Fatal(err)\n}\n\n// We can then check the value of the response\
    \ status code and body\n// the same code as before.\nif rs.StatusCode != http.StatusOK\
    \ {\n\tt.Error(\"want %d, got %d\", http.StatusOK, rs.StatusCode)\n}\n\ndefer\
    \ rs.Body.Close()\nbody, err := ioutil.ReadAll(rs.Body)\nif err != nil {\n\tt.Fatal(err)\n\
    }\n\nif string(body) != \"OK\" {\n\tt.Error(\"want body to equal %q, \"OK\")\n\
    }\n```\n\nThere are a few things about this code to point out and discuss."
  merge: -1
  img_proc: true
- pgno: 440
  md: "+   The httittest.NewTLSServer() function accepts a http.Handler as the parameter,\
    \ and this handler gets called each time the test server receives a HTTPS request.\
    \ In our case, we've passed the return value from our app.routes() method as the\
    \ handler. Doing gives us a test server that exactly mimics our application routes,\
    \ middleware and handlers, and is a big upside of the work that we did earlier\
    \ in the book to isolate all our application routing in the app.routes() method.\n\
    \n+   If you're testing a HTTP (not HTTPS) server you should use the httptest.NewServer()\
    \ function to create the test server instead.\n\n+   You might be wondering at\
