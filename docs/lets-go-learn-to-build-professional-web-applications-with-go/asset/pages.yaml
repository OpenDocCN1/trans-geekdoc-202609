- pgno: 325
  md: '```

    err = srv.ListenAndServeTLS("/tls/cert.pem", "./tls/key.pem")

    errLog.Fatal(err)


    ...

    ```


    All three of these timeouts — IdleTimeout, ReadTimeout and WriteTimeout — server-side
    settings which act on the underlying connection and apply to all requests irrespective
    of their handler or URL.


    # # IdleTimeout


    By default, Go enables keep-alives on all accepted connections. This helps reduce
    latency (especially for HTTPS connections) because a client can reuse the same
    connection for multiple requests without having to repeat the handshake.


    Also by default, Go will automatically close keep-alive connections after 3 minutes
    of inactivity. This helps to clear-up connections where the user has unexpectedly
    disappeared (e.g. due to a power cut client-side).


    There is no to increase this cut-off above 3 minutes (unless you roll your own
    net.Listener), but you can reduce it via the IdleTimeout setting. In our case,
    we''ve set it to 1 minute, which means that all keep-alive connections will be
    automatically closed after 1 minute of inactivity.


    # # ReadTimeout'
  merge: -1
  img_proc: true
- pgno: 326
  md: 'In our code we''ve also set the ReadTimeout setting to 5 seconds. This means
    that if the request headers or body are still being read 5 seconds after the request
    is first accepted, Go will close the underlying connection. Because this is a
    ‘hard’ closure on the connection, the user won’t receive any HTTP(S) response.


    Setting a short Timeout period helps mitigate the risk from slow-client attacks
    — such as Slowloris — which could otherwise keep a connection open indefinitely
    by sending partial, incomplete, HTTP(S) requests.


    One important thing. If you set ReadTimeout but don’t set IdleTimeout, then IdleTimeout
    will default to using the same setting as ReadTimeout. For instance, if you set
    ReadTimeout to 3 seconds, then there is the sideeffect that all keep-alive connections
    will also be closed after 3 seconds of inactivity. Generally, my recommendation
    is to avoid any ambiguity and always set an explicit IdleTimeout value for your
    server.


    # WriteTimeout


    The Timeout setting will close the underlying connection if our server attempts
    to write to the connection after a given period (in our code, 10 seconds). But
    this behaves slightly differently depending on the protocol being used.


    +   For HTTP connections, if some data is written to the connection more than
    10 seconds after the read of the request header finished, Go will close the underlying
    connection instead of writing the data.'
  merge: -1
  img_proc: true
- pgno: 327
  md: '+   - For HTTPS connections, if some data is written to the connection more
    than 10 seconds after the request is first accepted, Go will close the underlying
    connection instead of writing the data. This means that if you''re using HTTPS
    (like we are) it''s sensible to set WriteTimeout to a value greater than ReadTimeout.


    It''s important to bear in mind that writes made by a handler are buffered and
    written to the connection as one when the handler returns. Therefore, the idea
    of WriteTimeout is generally not to prevent long-running handlers, but to prevent
    the data that the handler returns from taking too long to write.


    # Additional Information


    # ReadHeaderTimeout


    The http.Server object also provides a ReadHeaderTimeout setting, which we haven''t
    used in our application. This works in a similar way to ReadTimeout, except that
    it applies to the read of the HTTP(S) headers only. So, if you set ReadHeaderTimeout
    to 3 seconds a connection will be closed if the headers are still being read 3
    seconds after the request is accepted. However, reading of the request body can
    still take place after 3 seconds has passed, without the connection being closed.


    This can be useful if you want to apply a server-wide limit to reading request
    headers, but want to implement different timeouts on different routes when it
    comes to reading the request body (possibly using the http.Timeout() middleware).'
  merge: -1
  img_proc: true
- pgno: 328
  md: "For our Snippetbox web application we don't have any actions that warrant per-route\
    \ read timeouts — reading the request headers and bodies for all our routes should\
    \ be comfortably completed in 5 seconds, so we'll stick to using ReadTimeout.\n\
    \n**Warning:** The ReadHeaderTimeout setting also affects the IdleTimeout behavior.\
    \ Specifically, if you set ReadHeaderTimeout and don't set ReadTimeout and don't\
    \ IdleTimeout, then IdleTimeout will default to using the same setting as ReadHeaderTimeout.\
    \ Again, it's safest (and clearest) to simply get into the habit of setting an\
    \ explicit IdleTimeout.\n\n# MaxHeaderBytes\n\nThe http.Server object also provides\
    \ a MaxHeaderBytes field, which you can use to control the maximum number of bytes\
    \ the server will read when parsing request headers. By default, Go allows a maximum\
    \ header length of 1MB.\n\nIf you want to limit the maximum header length to 0.5MB,\
    \ for example, you would write:\n\n```\nsrv := &http.Server{\n    Addr: *addr,\n\
    \    MaxHeaderBytes: 524288,\n    ...\n}\n```\n\nIf MaxHeaderBytes is exceeded\
    \ then the user will automatically be sent a 431 Request Header Fields Too Large\
    \ response."
  merge: -1
