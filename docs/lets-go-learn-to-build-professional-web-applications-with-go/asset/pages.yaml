  md: "that, after retrieving them from the context, you'll need to assert them to\
    \ their original type before you use them.\n\nTo retrieve a value we use the r.Context().Value()\
    \ method, like so:\n\n```\nuser, ok := r.Context(\"user\").(*models.User)\nif\
    \ !ok {\n    return fmt.Errorf(\"could not convert %T to *models.User\", user)\n\
    }\nfmt.Println(user.Name)\n```\n\n# Avoiding Key Collisions\n\nIn the code samples\
    \ above, I've used the string \"user\" as the key for storing and retrieving the\
    \ data from a request context. But this isn't recommended, because there's a risk\
    \ that other third-party packages used by your application will also want to store\
    \ data using the key \"user\". And that would cause a naming collision and buginess.\n\
    \nTo avoid this, it's good practice to create your own custom type which you can\
    \ use for your context keys. Extending our sample code so far, it's much better\
    \ to do something like this:\n\n```\ntype contextKey string\n\nvar contextKeyUser\
    \ = contextKey(\"user\")\n...\nctx := r.Context()\n```"
