  md: "# Working with Session Data\n\nIn this chapter let's put the session functionality\
    \ to work and use it to persist the confirmation flash message between HTTP requests\
    \ that we discussed earlier.\n\nTo add the confirmation message to the session\
    \ data for a user we should use the *Session.Put()* method. The second parameter\
    \ to this is the *key* for the data, which we'll also use to subsequently retrieve\
    \ the data from the session. It'll look like this:\n\n```\napp.session.Put(r,\
    \ \"flash\", \"Snippet successfully created!\")\n```\n\nTo retrieve the data from\
    \ the session we have two choices. We could use the *Session.Get()* method (which\
    \ returns an *interface{}* type) and type assert the value to a string, a bit\
    \ like this:\n\n```\nflash, ok := app.session.Get(r, \"flash\").(string)\nif !ok\
    \ {\n\tapp.serverError(w, errors.New(\"type assertion to string failed\"))\n}\n\
    ```\n\nOr alternatively, we can use the *Session.GetString()* method which takes\
    \ care of the type conversion for us. If there's no matching key in the"
  merge: -1
