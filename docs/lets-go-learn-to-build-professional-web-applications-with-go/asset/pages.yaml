- pgno: 324
  md: "# Connection Timeouts\n\nLet's take a moment to improve the resiliency of our\
    \ server by adding some timeout settings, like so:\n\n```\nFile: cmd/web/main.go\n\
    ```go\npackage main\n\n...\nfunc main() {\n...\ntlsConfig := &tls.Config{\n  \
    \      PreferServerCipherSuites: true,\n        CurvePreferences: []tls.CurveID{tls.CurveX25519,\
    \ tls.CurveP256},\n    }\n\n    srv := &http.Server{\n        Addr: *addr,\n \
    \       ErrorLog: errorLog,\n        Handler: app.routes(),\n        TLSConfig:\
    \ tlsConfig,\n        // Idle, Read and Write timeouts to the server.\n      \
    \  IdleTimeout: time.Minute,\n        ReadTimeout: 5 * time.Second,\n        WriteTimeout:\
    \ 10 * time.Second,\n    }\n\ninfolog.Printf(\"Starting server on %s\", addr)\n\
    ```\n```"
