  md: '# Stateful HTTP


    A nice touch to improve our user experience would be to display a one-time confirmation
    message which the user sees *after* they''ve added a new snippet. Like so:


    ![](img/fbb9e40b020fe1d7cb903215faaef07e_284_0.png)


    A confirmation message like this should only show up for the user once (immediately
    after creating the snippet) and no other users should ever see the message. If
    you''re coming from a background of Rails, Django, Laravel or similar frameworks
    you might know this type of functionality as a *flash* message.'
