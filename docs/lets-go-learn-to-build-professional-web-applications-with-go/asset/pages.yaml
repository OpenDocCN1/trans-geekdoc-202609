    The tls.Config struct we''ve used two settings:


    +   - The tls.Config.PreferServerCipherSuites field controls whether the HTTPS
    connection should use Go''s favored cipher suites or the user''s favored cipher
    suites. By setting this to true — like we have above — Go''s favored cipher suites
    are given preference and we help increase the likelihood that a strong cipher
    suite which also supports forward secrecy is used.


    +   - The tls.Config.CurvePreferences field lets us specify which elliptic curves
    should be given preference during the TLS handshake. Go supports a few elliptic
    curves, but as of Go 1.11 tls.CurveP256 and tls.X25519 have assembly implementations.
    The others are CPU intensive, so omitting them helps ensure that our server will
    remain performant under heavy loads.


