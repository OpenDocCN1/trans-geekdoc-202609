- pgno: 137
  md: '+   - There’s a clean separation of concerns. Our database logic isn’t tied
    to our handlers which means that handler responsibilities are limited to HTTP
    stuff (i.e. validating requests and writing responses). This will make it easier
    to write tight, focused, unit tests in the future.


    +   - By creating a custom SnippetModel type and implementing methods on it we''ve
    been able to make our model, neatly encapsulated object, which we can easily initialize
    and pass to our handlers as a dependency. Again, this makes for easier to maintain,
    testable code.


    +   - Because the model actions are defined as methods on an object — in our case
    SnippetModel — there’s the opportunity to create an interface and mock it for
    unit testing purposes.


    +   - We have total control over which database is used at runtime, just by using
    the command-line flag.


    +   - And finally, the directory structure scales nicely if your project has multiple
    back ends. For example, if some of your data is held in Redis you could put all
    the models for it in a pkg/models/redis package.'
