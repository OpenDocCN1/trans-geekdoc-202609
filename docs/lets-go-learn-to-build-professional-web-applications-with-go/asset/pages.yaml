  md: '# Integration Testing


    Running end-to-end tests with mocked dependencies is a good thing to do, but we
    could improve confidence in our application even more if we also verify that our
    production MySQL database models are working as expected.


    To do this we can run integration tests against a test version of our MySQL database,
    which mimics our production database but exists for testing purposes only.


    As a demonstration, in this chapter we''ll setup an integration test to ensure
    that our `mysql.UserModel.Get()` method is working correctly.


    # Test Database Setup and Teardown


    The first step is to create the test version of our MySQL database.


    If you''re following along, connect to MySQL from your terminal window as the
    `root` user and execute the following SQL statements to create a new `test_snippet`
    database and `test_web` user:


    ```

    CREATE DATABASE test_snippet CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_c

    ```'
  merge: -1
  img_proc: true
- pgno: 471
  md: '```

    CREATE USER ''test_web''@''localhost'';

    GRANT CREATE, DROP, ALTER, INDEX, SELECT, INSERT, UPDATE, DELETE ON test_snippet

    ALTER USER ''test_web''@''localhost'' IDENTIFIED BY ''pass'';

    ```


    Once that''s done, let''s make two SQL scripts:


    +   1. A setup script to create the database tables (so that they mimic our production
    database) and insert a known set of test data than we can work with in our tests.


    +   2. A teardown script which drops the database tables and any data.


    The idea is that we''ll call these scripts at the start and end of each integration
    test, so that the test database is fully reset each time. This helps ensure that
    any changes we make during one test are not ''leaking'' and affecting the results
    of another test.


    Let''s go ahead and create these scripts in a new pkg/models/mysql/testdata directory
    like so:


    ```

    $ mkdir pkg/models/mysql/testdata

    $ touch pkg/models/mysql/testdata/setup.sql

    $ touch pkg/models/mysql/testdata/teardown.sql

    ```


    ```

