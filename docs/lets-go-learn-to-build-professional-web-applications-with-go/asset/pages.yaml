    The html/template package is also smart enough to make escaping context-dependent.
    It will use the appropriate escape sequences depending on whether the data is
    rendered in a part of the page that contains HTML, CSS, Javascript or a URI.


    # Nested Templates


    It''s really important to note that when you''re invoking one template from another
    template, dot needs to be explicitly passed or pipelined to the template being
    invoked. You do this by including it at the end of each {{template}} or {{block}}
    action, like so:


    ```

    {{template "base" }}

    {{template "body" }}

    {{template "footer" }}

    {{block "sidebar" }}{{end}}

    ```'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'As a rule, my advice is to get into the habit of always pipelining dot whenever
    you invoke a template with the {{template}} or {{block}} actions, unless you have
    a good reason not to.


    # Calling Methods


    If the object that you''re yielding methods defined against it, you can call them
    (so long as they are exported and return only a single value — or single value
    and an error).


    For example, .Snippet.Created has the underlying type time.Time (which it does)
    you could render the name of the weekday by calling its Weekday() method like
    so:


    ```

    <span>{{.Snippet.Created.Weekday}}</span>

    ```


    You can also pass parameters to methods. For example, you could use the AddDate()
    method to add six months to a time like so:


    ```

    <span>{{.Snippet.Created.AddDate 0 6 0}}</span>

    ```


    Notice that this is different syntax for calling functions in Go — the parameters
    are not surrounded by parentheses and are separated by a single space character,
    not a comma.


    # HTML Comments'
