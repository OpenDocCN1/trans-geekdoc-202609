    # Table-Driven Tests


    Let''s now expand our TestHumanDate function to cover some additional test cases.
    Specifically, we''re going to update it to also check that:


    +   1. If the input to humanDate() is the zero time, then it returns the empty
    string "".


    +   2. The output from humanDate() function always uses the UTC zone.


    In Go, an idiomatic way to run multiple test cases is to use table-driven tests.


    Essentially, the idea behind table-driven tests is to create a table of test cases
    containing the inputs and expected outputs, and to loop over these, running each
    test case in a sub-test. There are a few ways you set this up, but a common approach
    is to define your test cases in an slice of anonymous structs.


    I''ll demonstrate:


    ```

    File: cmd/web/templates_test.go

    ```'
