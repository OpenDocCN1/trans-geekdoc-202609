  md: '![](img/fbb9e40b020fe1d7cb903215faaef07e_27_0.png)


    # # Fixed Path and Subtree Patterns


    Now that the two new routes are up and running let''s talk a bit of theory.


    Go''s servemux supports two different types of URL patterns: *fixed paths* and
    *subtree paths*. Fixed paths *don''t* end with a trailing slash, whereas subtree
    paths *do* end with a trailing slash.


    Our two new patterns — "/snippet" and "/snippet/create" — are both examples of
    fixed paths. In Go''s servemux, fixed path patterns like these are only matched
    (and the corresponding handler called) when the request URL path *exactly* matches
    the fixed path.'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'In contrast, our pattern "/" is an example of a subtree path (because it ends
    in a trailing slash). Another example would be something like "/static/. Subtree
    paths are matched (and the corresponding handler called) whenever the start of
    a request URL path matches the subtree path. If it helps your understanding, you
    can think of subtree paths as acting a bit like they have a wildcard at the end,
    like "/*" or "/static**".


    This helps explain why the "/" pattern is acting like a catch-all. The pattern
    essentially means match a single slash, followed by anything (or nothing at all).


    # Restricting the Root URL Pattern


    So what if you don''t want the "/" pattern to act like a catch-all?


    For instance, in the application we''re building we want the home page to be displayed
    if — and only if — the request URL path exactly matches "/". Otherwise, we want
    the user to receive a 404 page not found response.


    It''s not possible to change the behavior of Go''s servemux to do this, you can
    include a simple check in the home handler which ultimately has the same effect:


    ```

    File: main.go

    package main

    ...

    ```'
  merge: -1
  img_proc: true
