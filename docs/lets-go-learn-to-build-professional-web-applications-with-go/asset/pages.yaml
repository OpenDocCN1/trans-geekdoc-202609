  md: '# Scaling Data Validation


    OK, so we''re now in the position where our application is validating the form
    data according to our business rules and gracefully handling any validation errors.
    That''s great, but it''s taken quite a bit of work to get there.


    And while the approach we''ve taken is fine as a one-off, if your application
    has many forms then you can end up with a lot of repetition in your code and validation
    rules. Not to mention, writing code for validating forms isn’t exactly the most
    exciting way to spend your time.


    Let''s address this by creating a forms package to abstract some of this behavior
    and reduce the boilerplate code in our handler. We won’t actually change how the
    application works for the user at all; it’s just a refactoring of our codebase.


    We''ll begin by making a new pkg/forms folder in the project directory and adding
    two files — forms.go and errors.go — like so:


    ```

    $ cd $HOME/code/snippetbox

    $ mkdir pkg/forms

    $ touch pkg/forms/errors.go

    $ touch pkg/forms/form.go

    ```'
