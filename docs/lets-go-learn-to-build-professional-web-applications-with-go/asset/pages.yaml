- pgno: 166
  md: 'There are a few things to be wary of though.


    Prepared statements exist on database connections. So, because Go uses a pool
    of many database connections, what actually happens is that the first time a prepared
    statement (i.e. the sql.Stmt object) is used it gets created on a particular database
    connection. The sql.Stmt object then remembers which connection in the pool was
    used. The next time, sql.Stmt object will attempt to use the same database connection
    again. If that connection is closed or in use (i.e. not idle) the statement will
    be re-prepared on another connection.


    Under heavy load, it''s possible that a large amount of prepared statements will
    be created on multiple connections. This can lead to statements being prepared
    and re-prepared more often than you would expect — or even running into server-side
    limits on the number of statements (in MySQL the default maximum is 16,382 prepared
    statements).


    The code too is more complicated than not using prepared statements.


    So, there is a trade-off to be made between performance and complexity. As with
    anything, you should measure the actual performance benefit of implementing your
    own prepared statements to determine if it''s worth doing. For most cases, I would
    suggest that using the regular Query(), QueryRow() and Exec() methods — without
    preparing statements yourself — is a reasonable starting point.'
  merge: -1
  img_proc: true
