- pgno: 353
  md: 'passwords.


    It''s good practice — well, essential, really — to store a one-way hash of the
    password, derived with a computationally expensive key-derivation function such
    as Argon2, scrypt or bcrypt. Go has good implementations of all 3 algorithms,
    but a plus-point of the bcrypt implementation is that it includes some helper
    functions specifically designed for hashing and checking passwords.


    **Note:** If you''ve been following along, the bcrypt package should have already
    been downloaded to your computer because it''s part of the wider golang.org/x/crypto
    package that was installed as a dependency along with the golcollege/sessions
    package earlier in the book.


    There are two functions in the bcrypt package that we''ll use in this book. The
    first is bcrypt.GenerateFromPassword() function which lets us create a hash of
    a given plain-text password like so:


    ```

    hash, err := bcrypt.GenerateFromPassword([]byte("my plain text password"), 12

    ```


    The second parameter that we pass in here indicates the *cost*, which is represented
    by an integer between 4 and 31. The code above uses 4096 (2^12) bcrypt iterations
    will be used to hash the password. I wouldn''t recommend using less than that.
    This function will return a 60-character long hash which looks like this: $2a$12$NuTJWxM3KKntReFwyBVHyuf/to.HEWy.eS206TNfkGr6HzGJSWG.


    It''s worth pointing out that bcrypt.GenerateFromPassword() function also adds
    a random salt to the password to avoid rainbow-'
  merge: -1
  img_proc: true
- pgno: 354
  md: 'table attacks.


    On the flip side, we can check that a plain-text password matches a particular
    hash using the `bcrypt.CompareHashAndPassword()` function like so:


    ```

    hash := []byte("$2a$12$NuTjXm3KKntRefFwyBVHyuf/to.HWTy.eS206TNfkffr6GzGJSWG")

    err := bcrypt.CompareHashAndPassword(hash, []byte("my plain text password"))

    ```


    The `bcrypt.CompareHashAndPassword()` function will return `nil` if the plain-text
    password matches a particular hash, or an error if they don''t match.


    # Storing the User Details


    The next stage of our build is to update the `UserModel.Insert()` method so that
    it creates a new record in our `users` table containing the validated name, email
    and hashed password.


    This will be interesting for two reasons: first we want to store the bcrypt hash
    of the password (not the password itself) and second, we need to manage the potential
    error caused by a duplicate email violating the `UNIQUE` constraint that we added
    to the table.


    All errors returned by MySQL have a particular code, which we can use to triage
    what has caused the error (a full list of the MySQL error codes and descriptions
    can be `found here`). In the case of a duplicate email, the error code used will
    be `1062 (ER_DUP_ENTRY)`.'
