    So, all in all, this is starting to look really good. We''ve introduced an idiomatic
    way of managing configuration settings for our application at runtime, and have
    also got an explicit and documented interface between our application and its
    operating configuration.


    # Additional Information


    # Environment Variables


    If you''ve built and deployed web applications before, then you''re probably thinking
    what about environment variables? Surely it''s good-practice to store configuration
    settings there?


    If you want, you can store your configuration settings in environment variables
    and access them directly from your application by using os.Getenv() function like
    so:


    ```

    addr := os.Getenv("SNIPPETBOX_ADDR")

    ```'
