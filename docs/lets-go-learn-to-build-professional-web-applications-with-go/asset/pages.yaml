  md: 'So, in summary, a quick and easy way to unit test your HTTP handlers and middleware
    is to simply call them using `httptest.ResponseRecorder` type. You can then examine
    the status code, headers and response body of the recorded response to make sure
    that they are working as expected.


    # Running Specific Tests


    It''s possible to only run specific tests by using the -run flag. This allows
    you to pass in a regular expression — and only tests with a name that matches
    the regular expression will be run.


    In our case, we could opt to run only the TestPing test like so:


    ```

    $ go test -v -run="TestPing$\$ /cmd/web/

    === RUN TestPing

    -- PASS: TestPing (0.01s)

    PASS

    ok alexedewards.net/snippetbox/cmd/web 0.012s

    ```


    And you can even use the -run flag to limit testing to some specific sub-tests.
    For example:


    ```

    $ go test -v -run="TestHumanDate$/UTC|CET$\$ /cmd/web

    === RUN TestHumanDate

    === RUN TestHumanDate/UTC

    === RUN TestHumanDate/CET

    -- PASS: TestHumanDate (0.00s)

    -- PASS: TestHumanDate/UTC (0.00s)

    -- PASS: TestHumanDate/CET (0.00s)

    ```'
  merge: -1
  img_proc: true
