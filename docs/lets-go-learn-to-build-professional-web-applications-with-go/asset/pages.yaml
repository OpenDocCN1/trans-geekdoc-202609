  md: "# Additional Information\n\n# Panic Recovery in Other Background Goroutines\n\
    \nIt's important to realise that our middleware will only recover panics that\
    \ happen in the *same goroutine* that executed the `recoverPanic()` middleware.\n\
    \nIf, for example, you have a handler which spins up another goroutine (e.g. to\
    \ do some background processing), then any panics that happen in the second goroutine\
    \ will not be recovered — not by the `recoverPanic` middleware... and not by the\
    \ panic recovery built into the Go HTTP server. They will cause your application\
    \ to exit and bring down the server.\n\nSo, if you are spinning up additional\
    \ goroutines from within your web application and there is any chance of a panic,\
    \ you must make sure that you recover any panics from within those too.\n\nFor\
    \ example:\n\n```\nfunc myHandler(w http.ResponseWriter, r *http.Request) {\n\
    \  ...\n\n  // Spin up a new goroutine to do some background processing.\n  go\
    \ func() {\n    defer func() {\n      if err := recover(); err != nil {\n    \
    \    log.Println(fmt.Error(\"%s\\n%s\", err, debug.Stack()))\n      }\n    }()\n\
    \  }\n```"
