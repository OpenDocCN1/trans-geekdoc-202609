  md: '# Certificate Permissions


    It''s important to note that the user that you''re using to run Go application
    must have read permissions for the cert.pem and key.pem files, otherwise ListenAndServeTLS()
    will return a permission denied error.


    By default, the generate_cert.go tool grants read permission to all users for
    the cert.pem file but read permission only to the owner of the key.pem file. In
    my case the permissions look like this:


    ```

    $ cd $HOME/code/snippetbox/tls

    $ ls -l

    total 8

    ```'
