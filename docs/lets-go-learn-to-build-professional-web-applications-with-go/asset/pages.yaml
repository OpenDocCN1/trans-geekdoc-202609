- pgno: 371
  md: '# Additional Information


    # Session Fixation Attacks


    Because we are using an encrypted cookie to store the session data (and because
    the encrypted cookie value changes unpredictably every time the underlying session
    data changes) we don''t need to worry about session fixation attacks.


    However, if you were using a server-side data store for sessions (with a session
    ID stored in a cookie) then to mitigate the risk of session fixation attacks it''s
    important to change the value of the session ID before making any changes to privilege
    levels (e.g. login and logout operations).


    If you''re using the SCS package to manage server-side sessions you can use the
    Session.RenewToken() method to do this.


    If you''re using Gorilla Sessions to manage server-side sessions there''s unfortunately
    no way to refresh the session ID while retaining the session data, so you''ll
    need to either accept the risk of a session fixation attack or create a new session
    and copy the data across manually.'
