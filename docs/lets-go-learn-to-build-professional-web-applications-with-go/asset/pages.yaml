- pgno: 322
  md: "# Restricting Cipher Suites\n\nThe full range of cipher suites that Go supports\
    \ are defined in the crypto/tls package constants.\n\nFor some applications, it\
    \ may be desirable to limit your HTTPS server to only support some of these cipher\
    \ suites. For example, you might want to only support cipher suites which use\
    \ ECDHE (forward secrecy) and not support weak cipher suites which use RC4, 3DES\
    \ or CBC. You can do this via the tls.Config.CipherSuites field like so:\n\n```\n\
    tlsConfig := &tls.Config{\n    PreferServerSuites: true,\n    CipherSuites: []uint16{\n\
    \        tls_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,\n        tls_ECDHE_RSA_WITH_AES_256_GCM_SHA384,\n\
    \        tls_ECDHE_ECDSA_WITH_CHACH20_POLY1305,\n        tls_ECDHE_RSA_WITH_CHACH20_POLY1305,\n\
    \        tls_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,\n        tls_ECDHE_RSA_WITH_AES_128_GCM_SHA256,\n\
    \    }\n}\n```\n\nNote: Restricting the supported cipher suites to only include\
    \ strong, modern, ciphers can mean that with certain older browsers won't be able\
    \ to use your website. There's a balance to be struck between security and backwards-compatibility\
    \ and the right decision for you will depend on the technology typically used\
    \ by your user base. Mozilla’s recommended configurations for modern, intermediate\
    \ and old browsers may assist you in making a decision here."
  merge: -1
  img_proc: true
- pgno: 323
  md: "Also note: If you have PreferServerCipherSuites set to true then the order\
    \ of elements in the CipherSuites field is important — the cipher suites which\
    \ come first in the slice will be preferred.\n\n# TLS Versions\n\nTLS versions\
    \ are also defined as constants in the crypto/tls package. By default, Go’s HTTPS\
    \ server supports TLS versions 1.0, 1.1 and 1.2.\n\nBut you can configure the\
    \ minimum and maximum TLS versions via the tls.Config.MinVersion and MaxVersion\
    \ fields. For instance, if you know that all computers in your user base support\
    \ TLS 1.2 then you may wish to change your server to only support TLS 1.2. For\
    \ example:\n\n```\ntlsConfig := &tls.Config{\n    MinVersion: tls.VersionTLS12,\n\
    \    MaxVersion: tls.VersionTLS12,\n}\n```"
  merge: -1
