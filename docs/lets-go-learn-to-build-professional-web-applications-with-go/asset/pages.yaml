    **Hint:** If you want to include the full file path in your log output, instead
    of just the name, you can use the log.Longfile flag instead of log.Lshortfile
    when creating your custom logger. You can also force your logger to use UTC datetimes,
    instead of local ones, with the log.LUTC flag.


    A big benefit of logging your messages to the standard streams (stdout and stderr)
    like we are is that your application and logging are decoupled. Your application
    itself isn''t concerned with the routing or storage of the logs, and that can
    make it easier to manage the logs differently depending on the environment.


    During development, it''s easy to view the log output because the standard streams
    are displayed in the terminal.


    In staging or production environments, you can redirect the streams to a final
    destination for viewing and archival. This destination could be on-disk files,
    or a logging service such as Splunk. Either way, the final destination of the
    logs can be managed by your execution environment independently of the application.


    For example, we could redirect the stdout and stderr streams to on-disk files
    when starting the application like so:


    ```

