- pgno: 162
  md: "tx.Rollback() method in the event of any errors, the transaction ensures that\
    \ either:\n\n+   * All statements are executed successfully;\n* No statements\
    \ are executed and the database remains unchanged.\n\n# Managing Connections\n\
    \nThe sql.DB connection pool is made up of connections which are either idle or\
    \ open (in use). By default, there is no limit on the maximum number of open connections\
    \ at one time, but the default maximum number of idle connections in the pool\
    \ is 2. You can change these defaults with the SetMaxOpenConnns() and SetMaxIdleConnns()\
    \ methods. For example:\n\n```\ndb, err := sql.Open(\"mysql\", *dsn)\nif err !=\
    \ nil {\n    log.Fatal(err)\n}\n\n// Set the maximum number of concurrently open\
    \ connections. Setting this to\n// less than or equal to 0 will mean there is\
    \ no maximum limit. If the maximum\n// number of open connections is reached and\
    \ a new connection is needed, Go will\n// wait until one of the connections is\
    \ freed and becomes idle. From a\n// user perspective, this means their HTTP request\
    \ will hang until a connection\n// is freed.\ndb.SetMaxOpenConnns(95)\n\n// Set\
    \ the maximum number of idle connections in the pool. Setting this\n// less than\
    \ or equal to 0 will mean that no idle connections are retained.\ndb.SetMaxIdleConnns(5)\n\
    ```"
