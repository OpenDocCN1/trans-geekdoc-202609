    \ which captures the CSRF token value from the\n// HTML for our user sign up page.\n\
    var csrfTokenRX = regexp.MustCompile(`<input type='hidden' name='csrf_token' value=`)\n\
    \nfunc extractCSRFToken(t *testing.T, body []byte) string {\n    // Use the FindSubmatch\
    \ method to extract the token from the HTML body.\n    // Note that this returns\
    \ an array with the entire matched pattern in the\n    // first position, and\
    \ the values of any captured data in the subsequent\n    // positions.\n    matches\
    \ := csrfTokenRX.FindSubmatch(body)\n    if len(matches) < 2 {\n        t.Fatal(\"\
    no csrf token found in body\")\n    }\n\n    return html.UnescapeString(string(matches[1]))\n\
    }\n\n```"
