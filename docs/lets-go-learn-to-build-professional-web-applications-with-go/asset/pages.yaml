  md: 'Chapter 7.1.


    # Installing a Router


    There a literally hundreds of third-party routers for Go to pick from. And (fortunately
    or unfortunately, depending on your perspective) they all work a bit differently.
    They have different APIs, different logic for matching routes, and different behavioral
    quirks.


    Out of all the third-party routers I''ve tried there are probably two that I''d
    recommend as a starting point: Pat and Gorilla Mux. Both have good documentation,
    decent test coverage, and work very well with the standard patterns for handlers
    and middleware that we''ve used throughout this book so far.


    +   - bmizerany/pat is the more focused and lightweight of the two packages. It
    provides method-based routing and support for semantic URLs... and not much else.
    It''s solid at what it does, has an elegant API, and the code itself is very clear
    and well-written. A possible drawback is that the package isn''t really maintained
    anymore.


    +   - gorilla/mux is much more full-featured. In addition to method-based routing
    and support for semantic URLs, you can use it to route based on scheme, host and
    headers. Regular expression patterns in URLs are also supported. The downside
    of the package is that it''s comparatively slow and memory hungry — but for a
    database-driven web application'
  merge: -1
  img_proc: true
- pgno: 241
  md: 'like ours the impact over the lifetime of a whole HTTP request is likely to
    be small.


    For the web application we''re building our needs are simple, and the more advanced
    features that Gorilla Mux offers simply aren''t required. So, out of the two packages,
    we''ll opt for Pat.


    At the time of writing, the bmizerany/pat package doesn''t have any semantically-versioned
    releases available. So, if you''re following along, go ahead and install the latest
    version so:


    ```

    $ go get github.com/bmizerany/pat

    go: finding github.com/bmizerany/pat latest

    go: downloading github.com/bmizerany/pat v0.0.0-20170815010413-626ea591a40

    ```


    # Alternative Routers


    I''ve suggested the two routers above as a starting point but if you want to explore
    some more alternatives I''d suggest looking at the following options — all of
    which are good in their own right — to see if they feel appropriate for you and
    your specific project.


    +   - go-zoo/bone provides similar functionality to Pat, but with extra convenience
    functions for registering handlers and support for regular-expression based routes.
    A downside is that — at the time of writing — the test coverage for the package
    is still complete.


    +   - julienschmidt/httprorouter is a famously fast radix-tree based router which
    supports method-based routing and semantic URLs. However it'
  merge: -1
