- pgno: 31
  md: 'Behind the scenes, these functions register their routes with something called
    the DefaultServeM. There''s nothing special about this — it''s just regular servemux
    we''ve already been using, which is initialized by default and stored in a net/http
    global variable. Here''s the relevant line from the Go source code:


    ```

    var DefaultServeM = NewServeM()

    ```


    Although this approach can make your code slightly shorter, I don''t recommend
    it for production applications.


    Because DefaultServeM is a global variable, any package can access it and register
    a route — including any third-party packages that your application imports. If
    one of those third-party packages is compromised, they could use DefaultServeM
    to expose a malicious handler to the web.


    So, for the sake of security, it''s generally a good idea to avoid DefaultServeM
    and the corresponding helper functions. Use your locally-scoped servemux instead,
    like we have been doing in this project so far.


    # Additional Information


    # Servemux Features and Quirks


    +   - In Go''s servemux, longer URL patterns always take precedence over shorter
    ones. So, if a servemux contains multiple patterns which'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'match a request, it will always dispatch the request to the handler corresponding
    to the longest pattern. This has nice side-effect that you can register patterns
    in any order and it won''t change how the servemux behaves.


    +   Request URLs are automatically sanitized. If the request path contains any
    . or .. elements or repeated slashes, it will automatically redirect the user
    to an equivalent clean URL. For example, if a user makes a request to `/foo/bar/../baz`
    will automatically be sent a 301 Permanent Redirect to `/foo/baz` instead.


    +   If a subtree path has been registered and a request is received for that subtree
    path without a trailing slash, then the user will automatically be sent a 301
    Permanent Redirect to the subtree path with the slash added. For example, if you
    have registered the path `/foo/`, then your request to `/foo` will be redirected
    to `/foo/.


    # Host Name Matching


    It''s possible to include host names in your URL patterns. This can be useful
    when you want to redirect all HTTP requests to a canonical URL, or if your application
    is acting as the back end for multiple sites or services. For example:


    ```

    mux := http.NewServeMux()

    mux.HandleFunc("foo.example.org/", fooHandler)

    mux.HandleFunc("bar.example.org/", barHandler)

    mux.HandleFunc("/baz", bazHandler)

    ```'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'When it comes to pattern matching, any host-specific patterns will be checked
    first and if there is a match the request will be dispatched to the corresponding
    handler. Only when there isn''t a host-specific match found will the non-host
    specific patterns also be checked.


    # What About RESTful Routing?


    It’s important to acknowledge that the routing functionality provided by Go’s
    servemux is pretty lightweight. It doesn’t support routing based on the request
    method, it doesn’t support semantic URLs with variables in them, and it doesn’t
    support regexp-based patterns. If you have a background in using frameworks like
    Rails, Django or Laravel you might find this a bit restrictive… and surprising!


    Don’t let that put you off. The reality is that Go’s servemux can still get you
    quite far, and for many applications is perfectly sufficient. For the times that
    you need more, there’s a huge choice of third-party routers that you can use instead
    of Go’s servemux. We’ll look at some of the popular options later in the book.'
  merge: -1
  img_proc: true
