  md: '# Additional Information


    # The r.Form Map


    In our code above, we accessed the form values via the r.PostForm map. But an
    alternative approach is to use the (subtly different) r.Form map.


    The r.PostForm map is populated only for POST, PATCH and PUT requests, and contains
    the form data from the request body.


    In contrast, the r.Form map is populated for all requests (irrespective of their
    HTTP method), and contains the form data from any request body and any query string
    parameters. So, if our form was submitted to /snippet/create?foo=bar, we could
    also get the value of the foo


    ![](img/fbb9e40b020fe1d7cb903215faaef07e_259_0.png)'
