- pgno: 400
  md: '# # How Request Context Works


    In essence every http.Request that our handlers process has a context.Context
    object embedded in it, which we can use to store information during the lifetime
    of the request.


    As I''ve already hinted at, in a web application a common use-case for this is
    to pass information between your pieces of middleware and other handlers.


    In our case, we want to use it to authenticate the user once in some middleware,
    and then make the information about the user available to all our other middleware
    and handlers.


    Let''s start with some theory and explain the syntax for working with request
    context. Then, in the next chapter, we''ll get a bit more concrete again and demonstrate
    how to use it in our application.


    # # The Request Context Syntax


    The basic code for adding information to a request''s context looks like this:


    ```

    ctx := r.Context()

    ctx := context.WithValue(ctx, "user", &models.User{Name: "Bob Jones"}}

    ```'
  merge: -1
  img_proc: true
- pgno: 401
  md: '```

    i = r.WithContext(r.Context())

    ```


    Let''s step through this line-by-line.


    +   - First, we use the r.Context() method to retrieve the existing context from
    a request and assign it to the ctx variable.

    - Then we use the context.WithValue() method to create a new copy of the existing
    context, with a *models.User struct added to it. In this case, we''ve used the
    string "user" as the key for this data in the context.

    - Then finally we use the r.WithContext() method to create a copy of the request
    containing our new context.


    It''s important to be clear that we don''t actually update the context for a request
    directly. What we''re do is create a new copy of the http.Request object with
    our new context in it.


    I should also point out that, for clarity, I made that code a bit more verbose
    than it needs to be. It''s typical to shorten it a little bit like so:


    ```

    ctx = context.WithValue(r.Context(), "user", &models.User{Name: "Bob Jones"})\nr
    = r.WithContext(ctx)

    ```


    So, that''s how you add data to request context. But what about retrieving it
    again?


    The important thing to explain here is that, behind the scenes, request context
    values are stored with the type interface{}. And that means'
  merge: -1
