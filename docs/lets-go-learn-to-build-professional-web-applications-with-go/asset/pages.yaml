- pgno: 319
  md: '# Configuring HTTPS Settings


    Go has pretty good default settings for its HTTPS server, but there are a couple
    of improvements and optimizations that we can make.


    If you’re new to HTTPS and TLS then I recommend taking some time to understand
    the principles behind TLS before you start changing the default settings. To help,
    I’ve included a high-level summary of how TLS works in the appendix.


    But, that caveat aside, there are a couple of tweaks that it’s almost always a
    good idea to make.


    To change the default TLS settings we need to do two things:


    +   First, we need to create a tls.Config struct which contains the non-default
    TLS settings that we want to use.


    +   Second, we need to add this to our http.Server struct before we start the
    server.


    I’ll demonstrate:


    ```

    File: cmd/web/main.go

    package main

    ```'
