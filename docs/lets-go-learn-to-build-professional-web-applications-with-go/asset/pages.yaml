- pgno: 330
  md: '# User Authentication


    In this section of the book we''re going to add some user authentication functionality
    to our application, so that only registered, logged-in users can create new snippets.
    Non-logged-in users will still be able to view the snippets, and will also be
    able to sign up for an account.


    This begs the question: *how will we know if a user has logged in or not?*


    For our application, the process will work like this:


    +   2. A user will log in by visiting a form at /user/login and entering their
    email address and password.


    +   3. We then check the database to see if the credentials they entered match
    one of the users in the users table. If there''s a match, we add the relevant
    id value for the user to their session data, using the "userID".


    +   4. When we receive any subsequent requests, we can check the user''s session
    data for a "userID" value. If it exists, we know that the user has successfully
    logged in. We can keep checking this until the session'
  merge: -1
  img_proc: true
- pgno: 331
  md: 'expires, when the user will need to log in again. If there''s "user ID" in
    the session, we know that the user is not logged in.


    In many ways, a lot of the content in this section is just putting together the
    things that we''ve already learned in a different way. It''s a good litmus test
    of your understanding and a reminder of some key concepts.


    You’ll learn:


    +   - How to implement basic signup, login and logout functionality for users.


    +   - A secure approach to encrypting and storing user passwords securely in your
    database using Bcrypt.


    +   - A solid and straightforward approach to verifying that a user is logged
    in using middleware and sessions.


    +   - How to prevent Cross-Site Request Forgery (CSRF) attacks.'
