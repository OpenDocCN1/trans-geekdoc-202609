- pgno: 12
  md: '# Installing Go


    If you''d like to code along with this book, you''ll need Go version 1.11 installed
    on your computer.


    As well as generally being the latest and greatest version of Go, the 1.11 release
    ships with support for modules — which are Go''s new way to manage and version
    control any external packages used by your project.


    If you''ve already got Go installed, you can check which version from your terminal
    by using the go version command. The output should look similar to this:


    ```

    $ go version

    go version go1.11 linux/amd64

    ```


    If you need to upgrade your version of Go — or install Go from scratch — then
    go ahead and do that now. Detailed instructions for different operating systems
    can be found here:


    +   - Removing an old version of Go

    - Installing Go on Mac OS X

    - Installing Go on Windows

    - Installing Go on Linux'
  merge: -1
  img_proc: true
