- pgno: 463
  md: "Note: You might be wondering why we are using the html.UnescapeString() function\
    \ before returning the CSRF token. The reason for this is because Go's html/template\
    \ package automatically escapes all dynamically rendered data... including our\
    \ CSRF token. Because the CSRF token is a base64 encoded string it potentially\
    \ includes the + character, and this will be escaped to &#43;. So after extracting\
    \ the token from the HTML we need to run it through html.UnescapeString() to get\
    \ the original token value.\n\nOnce that's done, let's go back to our cmd/web/handlers_test.go\
    \ file and create a new TestSignupUser function.\n\nTo start with, we'll make\
    \ this perform a GET /user/signup request and then extract and print the CSRF\
    \ token from the HTML response body, like so:\n\n```\nFile: cmd/web/handlers_test.go\n\
    package main\n\n...\nnfunc TestSignupUser(t *testing.T) {\n\t// Create the application\
    \ struct containing our mocked dependencies and set\n\t// up the test server for\
