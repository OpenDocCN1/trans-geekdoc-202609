  md: "# Cookies and Redirections\n\nIn this chapter we've been using the `ts.Client().Get()`\
    \ method to make requests against our test server. The `ts.Client()` part of this\
    \ code returns a configurable `http.Client`, which we can change to make these\
    \ requests work slightly differently.\n\nThere's a couple of changes I'd like\
    \ to make to the default `http.Client` so that it's better suited to testing our\
    \ web application. Specifically:\n\n+   We don't want the client to automatically\
    \ follow redirects. Instead we want it to return the first HTTPS response by our\
    \ server so that we can test the response *for that specific request.*\n\n+  \
    \ We want the client to automatically store any cookies sent in an HTTPS response,\
    \ so that we can include them (if appropriate) in any subsequent requests back\
    \ to the test server. This will come in handy later in the book when we need cookies\
    \ to be supported across multiple requests in order to test our anti-CSRF measures.\n\
    \nTo make these changes, let's go back to the `testutils_test.go` file we just\
    \ created and update the `newTestServer()` function like so:\n\n```\nFile: cmd/web/testutils_test.go\n\
    ```go\npackage main\n\nimport (\n    \"io/ioutil\"\n    \"log\"\n    \"net/http\"\
    \n```\n```"
  merge: -1
  img_proc: true
- pgno: 447
  md: "```\n\"net/http/cookiejar\" // New import\n\"net/http/httptest\"\n\"testing\"\
    \n)\n...\nfunc newTestServer(t *testing.T, h http.Handler) *testServer {\n\ts\
    \ := httptest.NewTLSServer(h)\n\n// Initialize a new cookie jar.\njar, err :=\
    \ cookiejar.New(nil)\nif err != nil {\n\tt.Fatal(err)\n}\n// Add the cookie jar\
    \ to the client, so that response cookies are stored\n// and then sent with subsequent\
    \ requests.\nts.Client().Jar = jar\n\n// Disable redirect-following for the client.\
    \ Essentially this function\n// is called after a 3xx response is received by\
    \ the client, and returning\n// the http.ErrUseLastResponse error forces it to\
    \ to immediately return the\n// received response.\n\ts.Client().CheckRedirect\
    \ = func(req *http.Request, via []*http.Request) error\n\t\treturn http.ErrUseLastResponse\n\
    }\n\nreturn &testServer{ts}\n}\n```"
