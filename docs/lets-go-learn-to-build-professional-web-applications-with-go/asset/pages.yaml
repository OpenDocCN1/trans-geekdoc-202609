  md: '# Panic Recovery


    In a simple Go application, when your code panics it will result in the application
    being terminated straight away.


    But our web application is a bit more sophisticated. Go''s HTTP server assumes
    that the effect of any panic is isolated to the goroutine serving the active HTTP
    request (remember), every request is handled in its own goroutine.


    Specifically, following a panic our server will log a stack trace to the server
    error log, unwind the stack for the affected goroutine (calling any deferred functions
    along the way) and close the underlying HTTP connection. But it won''t terminate
    the application, so importantly, any panic in your handlers won''t bring down
    your server.


    If a panic does happen in one of our handlers, what will the user see?


    Let''s take a look and introduce a deliberate panic into our home handler.


    ```

    File: cmd/web/handlers.go


    package main


    ...


