  md: "# Using Request Context\n\nAt the moment our logic for authenticating a user\
    \ consists of simply checking whether a \"userID\" value exists in their session\
    \ data, like so:\n\n```\nfunc (app *application) authenticatedUser(r *http.Request)\
    \ int {\n    return app.session.GetInt(r, \"userID\")\n}\n```\n\nWe could make\
    \ this authentication more robust by also checking that this \"userID\" value\
    \ relates to a real, active record in our users table — and ensure that we haven't\
    \ decided to delete the user (for some reason or another) since they last logged\
    \ in.\n\nBut there is a slight problem with doing this additional check.\n\nOur\
    \ authenticatedUser() helper is called sometimes multiple times in each request\
    \ cycle. Currently we use twice — once in the requireAuthenticatedUser() middleware\
    \ and again in the addDefaultData() helper. So, if we check the database from\
    \ the authenticatedUser() helper directly, we would end up making duplicated round-trips\
    \ to the database during every request. Not very efficient."
  merge: -1
  img_proc: true
- pgno: 399
  md: 'A better approach would be to carry out this check in some middleware to determine
    whether the current request is from an authenticated-and-valid user or not, and
    then pass this information down to all subsequent handlers in the chain.


    So how do we do this? Enter request context.


    In this section you''ll learn:


    +   - What request context is, how to use it, and when it is appropriate to use
    it.

    - How to use request context in practice to pass information about the current
    user between your handlers.'
  merge: -1
