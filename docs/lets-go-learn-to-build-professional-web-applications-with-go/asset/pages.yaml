- pgno: 415
  md: '# Misusing Request Context


    It’s important to emphasize that request context should only be used to store
    information relevant to the lifetime of a specific request. The Go documentation
    for context.Context warns:


    Use context Values only for request-scoped data that transits processes and APIs.


    That means you should not use it to pass dependencies that exist outside of the
    lifetime of a request — like loggers, template caches and your database connection
    pool — to your middleware and handlers.


    For reasons of type-safety and clarity of code, it’s almost always better to make
    these dependencies available to your handlers explicitly, by either making your
    handlers methods an application struct (like we have in this book) or passing
    them in a closure (like in this Gist).'
  merge: -1
