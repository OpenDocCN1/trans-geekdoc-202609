- pgno: 385
  md: '# CSRF Protection


    In this chapter we''ll look at how to protect our application from Cross-Site
    Request Forgery (CSRF) attacks.


    If you’re not familiar with the principles of CSRF, it’s a form of cross-domain
    attack where a malicious third-party website sends state-changing HTTP requests
    to your website. A great explanation of the basic CSRF attack can be found here.


    In our application, the main risk is:


    +   A user logs into our application. Our session cookie is set to persist for
    12 hours, so they will remain logged in even if they navigate away from the application.


    +   The user then goes to a malicious website which contains some code sends a
    request to POST /snippets/create to add a new snippet to our database.


    +   Since the user is still logged in to our application, the request is processed
    with their privileges. Completely unknown to them, a new snippet will be added
    to our database.


    As well as ‘traditional’ CSRF attacks like the above (which focus on processing
    a request with a logged-in user’s privileges) your application'
  merge: -1
  img_proc: true
- pgno: 386
  md: 'may also be at risk from login and logout CSRF attacks.


    # SameSite Cookies


    One mitigation that we can prevent CSRF attacks is to make sure that the SameSite
    attribute is set on our session cookie.


    By default the golangcookie/sessions package that we''re using always sets SameSite=Lax
    on the session cookie, which means that session won''t be sent by the user''s
    browser for cross-site usage, apart from the usage it is deemed to be safe request
    which doesn''t change the state of the target application.


    If you want to change this setting to SameSite=Strict instead you can, by configuring
    the sessions like this in your main.go file:


    ```

    session := sessions.New([]byte(*secret))

    session.Lifetime = 12 * time.Hour

    session.Secure = true

    session.SameSite = http.SameSiteStrictMode

    ```


    Note: Using SameSite=Strict will block the session cookie being sent by Browser
    for all cross-site usage. This includes when a user clicks on an external link
    to your application, meaning that after clicking the link they will initially
    be treated as ''not logged in'' even if they have an active session containing
    their "userID" value.'
  merge: -1
  img_proc: true
- pgno: 387
  md: 'Unfortunately, at the time of writing, the SameSite attribute is only supported
    by 71% of browsers worldwide. So, although it''s something than we can (and should)
    use as a defensive measure, we can''t rely on it for all users.


    # Token-based Mitigation


    To mitigate the risk of CSRF for all users we''ll also need to implement some
    form of token check_Prevention_Cheat_Sheet. Like session management and password
    hashing, when it comes to this there''s a lot that you can get wrong so it''s
    probably safer to use a tried-tested third-party package instead of rolling your
    own implementation.


    The two most popular packages for stopping CSRF attacks in Go applications are
    gorilla/csrf and justinas/nosurf. They both do roughly the same thing, using the
    Double Submit Cookie pattern_Prevention_Cheat_Sheet#Double_Submit_Cookie to prevent
    attacks. In this random CSRF token is generated and sent to the user in a CSRF
    cookie. This CSRF token is then added to a hidden field in each form that''s vulnerable
    to CSRF. When the form is submitted, both packages use some middleware to check
    that the hidden field value and cookie value match.


    Out of the two packages, we''ll opt to use justinas/nosurf in this book. I prefer
    it primarily because it''s self-contained and doesn''t have any additional dependencies.
    If you''re following along you can install the latest version like so:


    ```

    $ go get github.com/justinas/nosurf

    ```'
  merge: -1
  img_proc: true
