  md: '# Project Setup and Enabling Modules


    Before we write any code, you’ll need to first set up a project directory (also
    known as a *repository*) on your computer which follows the Go conventions.


    This directory will act as the top-level ‘home’ for our Snippetbox project throughout
    this book — all the Go code we write will live in there, along with other project-specific
    assets like HTML templates and CSS files.


    So where should this project directory live, and what should we call it?


    Open a terminal window and run the `go env` command to get the information about
    your current Go installation and environment. The output should look something
    like this:


    ```

    $ go env

    GOARCH="amd64"

    GOIN=""

    GOCACHE="/home/alex/.cache/go-build"

    GOEXE=""

    GOFLAGS=""

    GOHOSTARCH="amd64"

    GOHOSTOS="Linux"

    GOUS="linux"

    GOPATH="/home/alex/go"

    ```'
