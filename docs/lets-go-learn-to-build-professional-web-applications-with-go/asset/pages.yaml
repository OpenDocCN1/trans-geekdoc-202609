- pgno: 40
  md: '# Manipulating the Header Map


    In the code above we used w.Header().Set() to add a new header to the response
    header map. But there''s also Add(), Del() and Get() methods that you can use
    to read and manipulate the header map too.


    ```

    // Set a new cache-control header. If an existing "Cache-Control" header exists

    // it will be overwritten.

    w.Header().Set("Cache-Control", "public", max-age=31536000")


    // In contrast, the Add() method appends a new "Cache-Control" header and can

    // be multiple times.

    w.Header().Add("Cache-Control", "public")

    w.Header().Add("Cache-Control", "max-age=31536000")


    // Delete all values for the "Cache-Control" header.

    w.Header().Del("Cache-Control")


    // Retrieve the first value for the "Cache-Control" header.

    w.Header().Get("Cache-Control")

    ```


    # System-Generated Headers and Content Sniffing


    When sending a response Go will automatically set three *system-generated* headers
    for you: *Date* and *Content-Length* and *Content-Type*.


    The *Content-Type* header is particularly interesting. Go will attempt to set
    the correct one for you by *content sniffing* the response body with the http.DetectContentType()
    function. If this function can''t guess the content type, Go will fall back to
    setting the header `Content-Type: application/octet-stream` instead.'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'The http.DetectContentType() function generally works quite well, but a common
    gotcha for web developers in Go is that it can''t distinguish JSON from plain
    text. And, by default, JSON responses will be sent with a Content-Type: text/plain;
    charset=utf-8 header. You can prevent this from happening by setting the correct
    header manually like so:


    ```

    w.Header().Set("Content-Type", "application/json")

    w.Write([]byte("{"name":"Alex"}"))

    ```


    # # Header Canonicalization


    When you''re using the Add(), Get(), Set() and Del() methods on the header map,
    the header name will always be canonicalized using the textproto.CanonicalMIMEHeaderKey()
    function. This converts the first letter and any letter following a hyphen to
    upper case, and the rest of the letters to lowercase. This has the practical implication
    that calling these methods the header name is case-insensitive.


    If you need to avoid this canonicalization behavior you can edit the underlying
    header map directly (it has the type map[string][]string). For example:


    ```

    w.Header()["X-XSS-Protection"] = []string("1; mode=block")

    ```


    **Note:** When headers are written to a HTTP/2 connection the header names and
    values will always be converted to lowercase, as per the specifications.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# Suppressing System-Generated Headers


    The Del() method doesn''t remove system-generated headers. To suppress these,
    you need to access the underlying header map directly and set the value to nil.
    If you want to suppress the Date header, for example, you need to write:


    ```

    w.Header()["Date"] = nil

    ```'
