- pgno: 361
  md: 'to insert a new record, and add a validation error message to the form as appropriate.


    However, this would introduce a race condition to our application. If two users
    try to sign up with the same email address at exactly the same time, both submissions
    will pass the validation check but ultimately only one INSERT into the MySQL database
    will succeed. The other will violate our UNIQUE constraint and the user would
    end up receiving a 500 Internal Server Error response.


    The outcome of this particular race condition is fairly benign, and some people
    would advise you to simply not worry about it. But my view is that thinking critically
    about your application logic and writing code which avoids race conditions is
    a good habit to get into, and where there’s a viable alternative — like there
    is in this case — it’s better to avoid shipping with known race conditions in
    your codebase.'
