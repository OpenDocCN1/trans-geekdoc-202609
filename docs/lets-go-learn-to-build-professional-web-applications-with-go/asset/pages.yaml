- pgno: 211
  md: 'A nice feature of pipelining is that you can make an arbitrarily long chain
    of template functions which use the output from one as the input for the next.
    For example, we could pipeline the output from our humanDate function to the inbuilt
    printf function like so:


    ```

    <time>{{.Created | humanDate | printf "Created: %s"}}</time>

    ```'
