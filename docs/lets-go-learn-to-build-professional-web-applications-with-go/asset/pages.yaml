    , *addr)\nerr = srv.ListenAndServe()\nerrorLog.Fatal(err)\n}\n...\n```\n\nSo,\
    \ at this point, we've got an in-memory cache of the relevant template set for\
    \ each of our pages, and our handlers have access to this cache via the application\
    \ struct.\n\nLet's tackle the second issue of duplicated code, and create a helper\
