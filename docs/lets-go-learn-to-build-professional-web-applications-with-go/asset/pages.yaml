  md: '# Leveled Logging


    At the moment in our main.go file we''re logging messages using the log.Printf()
    and log.Fatal() functions like so:


    ```

    log.Printf("Starting server on %s", *addr) // Information message

    err := http.ListenAndServe(*addr, mux)

    log.Fatal(err) // Error message

    ```


    We can break these log messages into two distinct types, or levels. The first
    type is informational messages (like "Starting server on :4000") and the second
    type is error messages.


    Currently both types of message are outputted using Go''s standard logger, which
    prefixes the message with the local date and time and then outputs it to your
    standard error (stderr) stream.


    Let''s improve our application by adding some leveled logging capability, so that
    information and error messages are managed slightly differently. Specifically:


    +   - We will prefix informational messages with "INFO" and output the message
    to standard out (stdout).'
  merge: -1
  img_proc: true
- pgno: 89
  md: "+   - We will prefix error messages with \"ERROR\" and output them to standard\
    \ error (sterr), along with the relevant file name and line number called the\
    \ logger (to help with debugging).\n\nThere are a couple of different ways to\
    \ do this, but a simple and clean approach is to use log.New() function to create\
    \ two new custom loggers.\n\nOpen up your main.go file and update it as follows:\n\
    \n```\nFile: cmd/web/main.go\n\npackage main\n\nimport (\n    \"flag\"\n    \"\
    log\"\n    \"net/http\"\n    \"os\" // New Import\n)\n\nfunc main() {\n    addr\
    \ := flag.String(\"addr\", \":4000\", \"HTTP network address\")\n    flag.Parse()\n\
    \n    // Use log.New to create a logger for writing information messages. This\n\
    \    // three parameters: the destination to write the logs to (os.Stdout), a\
    \ st\n    // prefix for message (INFO followed by a tab), and flags to indicate\
    \ what\n    // additional information to include (local date and time). Note that\
    \ the f\n    // are joined using the bitwise OR operator |\n    InfoLog := log.New(os.Stdout,\
    \ \"INFO\\t\", log.Ldate|log.Ltime)\n\n    // Create a logger for writing error\
    \ messages in the same way, but use std\n    // the destination and use the log.Lshortfile\
    \ flag to include the relevant\n    // file name and line number.\n```"
