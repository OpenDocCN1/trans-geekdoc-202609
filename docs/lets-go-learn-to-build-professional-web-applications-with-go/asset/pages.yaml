  md: "# Creating a Database Connection Pool\n\nNow that the MySQL database is all\
    \ set up and we've got a driver installed, the natural next step is to connect\
    \ to the database from our web application.\n\nTo do this we need Go’s sql.Open()\
    \ function, which you use a bit like this:\n\n```\n// The sql.Open() function\
    \ initializes a new sql.DB object, which is essential\n// pool of database connections.\n\
    db, err := sql.Open(\"mysql\", \"web:pass@snippetbox?parseTime=true\")\nif err\
    \ != nil {\n  ...\n```\n\nThere are a few things about this code to explain and\
    \ emphasize:\n\n+   - The first parameter to sql.Open() is the driver name and\
    \ the second parameter is the data source name (sometimes also called a connection\
    \ string or DSN) which describes how to connect to your database."
  merge: -1
  img_proc: true
- pgno: 126
  md: '+   - The format of the data source name will depend on which database and
    driver you''re using. Typically, you can find information and examples in the
    documentation for your specific driver. For the driver we''re using you can find
    that documentation here.


    +   - parseTime=true part of the DSN above is a driver-specific parameter which
    instructs our driver to convert SQL TIME DATE fields to Go time.Time objects.


    +   - sql.Open() function returns a sql.DB object. This isn''t a database connection
    — it''s a pool of many connections. This is an important difference to understand.
    Go manages this automatically opening and closing connections to the database
    via the driver.


    +   - The connection pool is safe for concurrent access, so you can use it from
    web application handlers safely.


    +   - The connection pool is intended to be long-lived. In a web application it''s
    normal to initialize the connection pool in your main() function and then pass
    the pool to your handlers. You shouldn''t call sql.Open() in a short-lived handler
    itself — it would be a waste of memory and network resources.


    # Usage in our Web Application


    Let''s look at how to use sql.Open() in practice. Open up your main.go file and
    add the following code:'
