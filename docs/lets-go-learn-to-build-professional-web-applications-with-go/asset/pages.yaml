- pgno: 179
  md: '# Template Actions and Functions


    In this section we''re going to look at the template actions and functions that
    Go provides.


    We''ve already talked about some of the actions — {{define}}, {{template}} and
    {{block}} — but there are three more which you can use to control the display
    of dynamic data — {{if}}, {{with}} and {{range}}.


    | Action | Description |

    | --- | --- |

    | {{if .Foo}} C1 {{else}} C2 {{end}} | If .Foo is not empty then render the content
    C1, otherwise render the content C2. |

    | {{with .Foo}} C1 {{else}} C2 {{end}} | If .Foo is not empty, then set dot to
    the value of .Foo and render the content C1, otherwise render the content C2.
    |

    | {{range .Foo}} C1 {{else}} C2 {{end}} | If the length of .Foo is greater than
    zero then loop over each element, setting dot to the value of each element and
    rendering the content C1. If the length of .Foo is zero then render the content
    C2. The underlying type of .Foo must be an array, slice, map, or channel.'
  merge: -1
  img_proc: true
- pgno: 180
  md: 'There are a few things about these actions to point out:


    +   For all three actions the {{else}} clause is optional. For instance, you can
    write {{if .Foo}} C1 {{end}} if there''s no C2 content that you want to render.


    +   The empty values are false, 0, any nil pointer or interface value, and any
    array, slice, map, or string of length zero.


    +   It''s important to grasp that the with and range actions change the value
    of dot. Once you using them, what dot represents can be different depending on
    where you are in the template and what you''re doing.


    The html/template package also provides some template functions which you can
    use to add extra logic to your templates and control what is rendered at runtime.
    You can find a complete listing of functions here, but the most important ones
    are:


    | Function | Description |

    | --- | --- |

    | {{eq .Foo .Bar}} | yields true if .Foo is equal to .Bar |

    | {{ne .Foo .Bar}} | yields true if .Foo is not equal to .Bar |

    | {{not .Foo}} | yields the boolean negation of .Foo |

    | {{or .Foo .Bar}} | yields .Foo if .Foo is not empty; otherwise yields .Bar |

    | {{index .Foo i}} | yields the value of .Foo at index i. The underlying type
    of .Foo must be a map, slice or array. |'
  merge: -1
  img_proc: true
- pgno: 181
  md: "| Function | Description |\n|---|---|\n| {{printf \"%s-%s\" .Foo .Bar}} | Yields\
    \ a formatted string containing the .Foo and .Bar values. Works in the same way\
    \ as fmt.Sprintf(). |\n| {{len .Foo}} | Yields the length of .Foo as an integer.\
    \ |\n| {$bar := len .Foo}} | Assign the length of .Foo to the template variable\
    \ $bar |\n\nThe final row is an example of declaring a template variable. Template\
    \ variables are particularly useful if you want to store the result from a function\
    \ and use it in multiple places in your template. Variable names must be prefixed\
    \ by a dollar sign and can contain alphanumeric characters only.\n\n# Using the\
