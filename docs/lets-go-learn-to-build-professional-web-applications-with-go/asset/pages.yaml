  md: "# Creating a Users Model\n\nNow that the routes are set up, we need to create\
    \ a new users database table and a database model to access it.\n\nStart by connecting\
    \ to MySQL from your terminal window as the root user and execute the following\
    \ SQL statement to setup the users table:\n\n```\nUSE snippetbox;\n\nCREATE TABLE\
    \ users (\n    id INTEGER NOT NULL PRIMARY KEY AUTO_INCREMENT,\n    name VARCHAR(255)\
    \ NOT NULL,\n    email VARCHAR(255) NOT NULL,\n    hashed_password CHAR(60) NOT\
    \ NULL,\n    created DATETIME NOT NULL\n);\n\nALTER TABLE users ADD CONSTRAINT\
    \ users_uc_email UNIQUE (email);\n```\n\nThere's a couple of things worth pointing\
    \ out about this table:\n\n+   - id field is an autoincrement integer field and\
    \ the primary key for the table. This means that the user ID values are guaranteed\
    \ to be unique positive integers (1, 2, 3... etc)."
  merge: -1
  img_proc: true
- pgno: 339
  md: "+   I've set the type of the hashed_password field to CHAR(60). This is because\
    \ we'll be storing hashes of the user passwords in the database — and the hashed\
    \ versions will always be exactly 60 characters long.\n\n+   I've also added a\
    \ UNIQUE constraint on the email column and named it users_uc_email. This constraint\
    \ ensures we won't end up with two users who have the same email address. If we\
    \ try to insert a record in this table with a duplicate email, MySQL will throw\
    \ an ERROR 1062: Duplicate entry error.\n\n# Building the Model in Go\n\nNext\
    \ let's set up a model so that we can easily work with the new users table. We'll\
    \ follow the same pattern that we used earlier in the book for modeling access\
    \ to the snippets table, hopefully this should feel familiar and straightforward.\n\
    \nFirst, open up the pkg/models/model.go file that you created earlier and add\
