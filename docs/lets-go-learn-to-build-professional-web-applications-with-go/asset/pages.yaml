  md: '# Setting Security Headers


    Let''s put the pattern we learned in the previous chapter to use, and make our
    own middleware which automatically adds the following two HTTP headers to every
    response:


    ```

    X-Frame-Options: deny

    X-XSS-Protection: 1; mode=block

    ```


    If you''re not familiar with these headers, they essentially instruct the user''s
    web browser to implement some additional security measures to prevent XSS and
    Clickjacking attacks. It''s good practice to include them unless you have a specific
    reason for not doing so.


    Let''s begin by creating a new `middleware.go` file, which we''ll use to hold
    all the custom middleware that we write throughout this book.


    ```

    $ touch cmd/web/middleware.go

    ```


    Then open it up and add a `secureHeaders()` function using the pattern that we
    introduced in the previous chapter:


    ```

    File: cmd/web/middleware.go

    ```'
  merge: -1
  img_proc: true
