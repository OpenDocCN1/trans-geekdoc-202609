- pgno: 86
  md: 'But this has some drawbacks compared to using command-line flags. You can''t
    specify a default setting (the return value from os.Getenv() is the empty string
    if the environment variable doesn''t exist), you don''t get the -help functionality
    that you do with command-line flags, and the return value from os.Getenv() is
    always a string. You don''t get automatic type conversions like you do with flag.Int()
    and the other command line flag functions.


    Instead, you can get the best of both worlds by passing the environment variable
    as a command-line flag when starting the application. For example:


    ```

    $ export SNIPPETBOX_ADDR="9999"

    $ go run cmd/web/* -addr=$SNIPPETBOX_ADDR

    2018/08/08 19:45:29 Starting server on :9999

    ```


    # Boolean Flags


    For flags defined with flag.Bool() omitting a value is the same as writing -flag=true.
    The following two commands are equivalent:


    ```

    $ go run example.go -flag=true

    $ go run example.go -flag

    ```


    You must explicitly use -flag=false if you want to set a boolean flag value to
    false.


    # Pre-Existing Variables'
