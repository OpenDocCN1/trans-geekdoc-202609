  md: "Let’s jump straight in and create a unit test for this function.\n\nIn Go,\
    \ its standard practice to create your tests in *test.go files which live directly\
    \ alongside code that you’re testing. So, in this case, the first thing that we’re\
    \ going to do is create a new cmd/web/templates_test.go file to hold the test:\n\
    \n```\n$ touch cmd/web/templates_test.go\n```\n\nAnd then we can create a new\
    \ unit test for the humanDate function like so:\n\n```\nFile: cmd/web/templates_test.go\n\
    package main\nimport (\n    \"testing\"\n    \"time\"\n)\nnfunc TestHumanDate(t\
    \ *testing.T) {\n    // Initialize a new time.Time object and pass it to the humanDate\
    \ function.\n    tm := time.Date(2020, 12, 17, 10, 0, 0, 0, time.UTC)\n    hd\
    \ := humanDate(tm)\n\n    // Check that the output from the humanDate function\
    \ is in the format we\n    // expect. If it isn't what we expect, use the t.Error()\
    \ function to\n    // indicate that the test has failed and log the expected and\
    \ actual\n    // values.\n    if hd != \"17 Dec 2020 at 10:00\" {\n        t.Errorf(\"\
    want %q; got %q\", \"17 Dec 2020 at 10:00\", hd)\n    }\n}\n```"
