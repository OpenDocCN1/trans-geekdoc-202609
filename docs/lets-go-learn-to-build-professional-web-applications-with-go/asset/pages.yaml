  md: '# Additional Information


    # Features and Functions


    Go''s file server has a few really nice features that are worth mentioning:


    +   - It sanitizes all request paths by running them through the path.Clean()
    function before searching for a file. This removes any and .. elements from the
    URL path, which helps to stop directory traversal attacks. This feature is particularly
    useful if you''re using the fileserver in conjunction with a router that doesn''t
    automatically sanitize URL paths.


    ![](img/fbb9e40b020fe1d7cb903215faaef07e_72_0.png)'
