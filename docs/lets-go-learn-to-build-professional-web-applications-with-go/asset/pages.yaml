- pgno: 212
  md: '# Middleware


    When you''re building a web application there''s probably some shared functionality
    that you want to use for many (or even all) HTTP requests. For example, you might
    want to log every request, compress every response, or check a cache before passing
    the request to your handlers.


    A common way of organizing this shared functionality is to set it up as *middleware*.
    This is essentially some self-contained code which independently acts on a request
    before or after your normal application handlers.


    In this section of the book you''ll learn:


    +   An idiomatic pattern for building and using custom middleware which is compatible
    with net/http and many third-party packages.


    +   How to create middleware which sets useful security headers on every HTTP
    response.


    +   How to create middleware which logs the requests received by your application.


    +   How to create middleware which recovers panics so that they are gracefully
    handled by your application.


    +   How to create and use composable middleware chains to help manage and organize
    your middleware.'
  merge: -1
  img_proc: true
- pgno: 213
  md: '# How Middleware Works


    Earlier on the book I said something that I''d like to expand on in this chapter:


    “You can think of a Go web application as a chain of ServeHTTP() methods being
    called one after another.”


    Currently, in our application, when our server receives a new HTTP request it
    calls the servemux''s ServeHTTP() method. This looks up the relevant handler based
    on the request URL path, and in turn calls that handler''s ServeHTTP() method.


    The basic idea of middleware is to insert another handler into this chain. The
    middleware handler executes some logic, like logging the request, and then calls
    the ServeHTTP() method of the next handler in the chain.


    In fact, we''re actually already using some middleware in our application — the
    http.StripPrefix() function from serving static files, which removes a specific
    prefix from the request’s URL path before passing the request on the file server.


    # The Pattern


    The standard pattern for creating your own middleware looks like this:'
  merge: -1
  img_proc: true
- pgno: 214
  md: "```\nfunc myMiddleware(next http.Handler) http.Handler {\n    fn := func(w\
    \ http.ResponseWriter, r *http.Request) {\n        // TODO: Execute our middleware\
    \ logic here...\n        next.ServeHTTP(w, r)\n    }\n\n    return http.HandlerFunc(fn)\n\
    }\n```\n\nThe code itself is pretty succinct, but there's quite a lot in it to\
    \ get your head around.\n\n+   - The myMiddleware() function is essentially a\
    \ wrapper around the next handler.\n- It establishes a function fn which closes\
    \ over the next handler to form a closure. When fn is run it executes our middleware\
    \ logic and then transfers control to the next handler by calling it's ServeHTTP()\
    \ method.\n- Regardless of what you do with a closure it will always be able to\
    \ access the variables that are local to the scope it was created in — which in\
    \ this case means that fn will always have access to the next variable.\n\n+ \
    \  - We convert this closure to a http.Handler and return it using the http.HandlerFunc()\
    \ adapter.\n\nIf this feels confusing, you can think of it more simply: myMiddleware\
    \ is a function that accepts the next handler in a chain as a parameter. It"
  merge: -1
  img_proc: true
- pgno: 215
  md: "returns a handler that executes some logic, and then calls the next handler.\n\
    \n# Simplifying the Middleware\n\nA tweak to this pattern is to use an anonymous\
    \ function to rewrite the myMiddleware middleware like so:\n\n```\nfunc myMiddleware(next\
    \ http.Handler) http.Handler {\n    return http.HandlerFunc(w http.ResponseWriter,\
    \ r *http.Request) {\n        // TODO: Execute our middleware logic here...\n\
    \        next.ServeHTTP(w, r)\n    }\n}\n```\n\nThis middleware pattern is very\
    \ common in the wild, and the one that you'll probably see most often if you're\
    \ reading the source code of other applications or third-party packages.\n\n#\
    \ Positioning the Middleware\n\nIt's important to explain that where you position\
    \ the middleware in the chain of handlers will affect the behavior of your application.\n\
    \nIf you position your middleware before the servemux in the chain it will act\
    \ on every request that your application receives.\n\n```\nmyMiddleware -> servemux\
    \ -> application handler\n```"
