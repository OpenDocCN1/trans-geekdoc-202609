- pgno: 489
  md: "# How HTTPS Works\n\nYou can think of a TLS connection happening in two stages.\
    \ The first stage is the *handshake*, in which the client verifies that the server\
    \ is trusted and generates some *TLS session keys*. The second stage is the actual\
    \ transmission of the data, in which the data is encrypted and signed using the\
    \ TLS session keys generated during the handshake.\n\nIn summary, it works like\
    \ this:\n\n+   1. A TCP connection is established and the TLS handshake begins.\
    \ The client sends the web server a list of the TLS versions and *cipher suites*\
    \ that it supports (a cipher suite is essentially an identifier that describes\
    \ the different cryptographic algorithms that the connection should use).\n\n\
    +   2. The web server sends the client confirmation of the TLS version and cipher\
    \ suite it has chosen. From here on, the precise process depends on which cipher\
    \ suite is chosen. But for the sake of this explanation I'll assume that the cipher\
    \ suite TLS_RSA_WITH_AES_128_GCM_SHA256 is being used. \n\n+   3. The first part\
    \ of the cipher suite indicates the *key exchange algorithm* to be used (in this\
    \ example RSA). The web server sends its TLS certificate (which contains its RSA\
    \ public key). The client then verifies that the TLS certificate is not expired\
    \ and is *trusted*. Web browsers"
  merge: -1
  img_proc: true
- pgno: 490
  md: 'come installed with the public keys of all the major certificate authorities,
    which they can use to verify that the web server’s certificate was indeed signed
    by the trusted certificate authority. The client also confirms that the host named
    in the TLS certificate is the one to which it has an open connection.


    +   4. The client generates the secret session keys. It encrypts these using the
    server’s RSA public key (from the TLS certificate) and sends them to the web server
    which decrypts them using their RSA private key. This is known as the key exchange.
    Both the client and web server have access to the same session keys, and no other
    parties should know them. This is the end of the TLS handshake.


    +   5. The transfer of the actual data is now ready to begin. The data is broken
    up into records (generally up to 16KB in size). The client calculates a HMAC of
    each record using one of the session keys and the message authentication code
    algorithm indicated by the cipher suite (in our example SHA256) and appends it
    to the record. The client then encrypts the record using another of the session
    keys and the encryptionalgorithm indicated by the cipher suite (in our example
    AES_128_GCM — which is AES-128 in Galois/Counter mode).


    +   6. The encrypted, signed record is sent to the server. Then, using the session
    keys, the server can unencrypt the record and verify that the signature is correct.


    In this process two different types of encryption are used. The TLS handshake
    portion of the process uses asymmetric encryption (RSA) to securely share the
    session keys, whereas the actual transfer of the data uses symmetric encryption/decryption
    (AES) which is much faster.'
  merge: -1
  img_proc: true
- pgno: 491
  md: 'You might also like to watch this excellent video by Johannes Bickel which
    illustrates the TLS handshake process visually and may help clarify how it works.


    # Forward Secrecy / ECDHE


    A notable exception to the process above is where the chosen cipher suite uses
    Ephemeral Elliptic Curve Diffie-Hellman (ECDHE) key exchange during the handshake.


    For instance, if the cipher suite TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256 is chosen
    then ECDHE will be used. Notice the ECDHE_RSA at the start?


    Using ECDHE in key exchange algorithm slightly changes steps 3 and 4 in the above
    summary. As well as sending the TLS certificate during the handshake, the server
    also dynamically generates an ECDHE pair and sends the ECDHE pubic key to the
    client. It signs what it sends with its own RSA private key.


    In step 4, the client then encrypts the session keys using the ECDHE public key,
    instead of the RSA public key contained in the web server’s TLS certificate.


    The advantage of using an ECDHE variant for the key exchange is that the secret
    session keys are encrypted using a different public key in every handshake, instead
    using the same one from the TLS certificate each time. It helps future-proof privacy
    in case someone is recording the traffic (e.g. government mass surveillance).
    Without it, anyone gains access'
  merge: -1
  img_proc: true
- pgno: 492
  md: 'to the web server’s RSA private key in the future (e.g. by obtaining a warrant)
    would be able to decrypt the traffic.


    By using dynamically generated ECDHE keys, breaking session keys can no longer
    be done by just obtaining the web server’s private key. It means that the session
    keys belonging to each individual connection must be compromised separately.


    Generally, it’s good practice to prefer ECDHE cipher suite variants unless you
    have an explicit need for another device to read your traffic (e.g. a network
    monitor).'
  merge: -1
  img_proc: true
