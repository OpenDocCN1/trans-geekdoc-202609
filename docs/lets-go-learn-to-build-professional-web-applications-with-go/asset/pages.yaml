  md: '# Transactions and Other Details


    # The database/sql package


    As you''re probably starting to realize, the database/sql package essentially
    provides a standard interface between your Go application and the world of SQL
    databases.


    So long as you use the database/sql package, the Go code you will write generally
    be portable and will work with any kind of SQL database — whether it is MySQL,
    PostgreSQL, SQLite or something else. This means that your application isn''t
    so tightly coupled to the database that you''re currently using, and the theory
    is that you can swap databases in the future without re-writing all of your code
    (driver-specific quirks and SQL implementations aside).


    It''s important to note that while database/sql generally does a good job of providing
    a standard interface for working with SQL databases, there are some idiosyncrasies
    in the way that different drivers and databases operate. It''s always a good idea
    to read over the documentation for a new driver to understand any quirks and edge
    cases before begin using it.


    # Verbosity'
  merge: -1
  img_proc: true
- pgno: 159
  md: 'If you''re coming from Ruby, Python or PHP, the code for querying SQL databases
    may feel a bit verbose, especially if you''re used to dealing with an abstraction
    layer or ORM.


    But the upside of the verbosity is that our code is non-magical; we can understand
    and control exactly what is going on. With a bit of time, you''ll find that the
    patterns for making SQL queries become familiar and you can copy-and-paste from
    previous work.


    If the verbosity is really starting to grate on you, you might want to consider
    trying the jmoiron/sqlx package. It''s well designed and provides some good extensions
    that make working with SQL queries quicker and easier.


    # Managing NULL values


    One thing that Go doesn''t do well is managing NULL values in database records.


    Let''s pretend that the title column in our snippets table contains a NULL value
    in a particular row. If we queried that row, then rows.Scan() would return an
    error because it can''t convert NULL into a string:


    ```

    sql: Scan error on column index 1: unsupported Scan, storing driver.Value type
    &lt;nil&gt; into type *string

    ```


    Very roughly, the fix for this is to change the field that you''re scanning into
    a string to a sql.NullString type. See this gist for a working'
  merge: -1
  img_proc: true
- pgno: 160
  md: "example.\n\nBut, as a rule, the easiest thing to do is simply avoid NULL values\
    \ altogether. Set NOT NULL constraints on all your database columns, like we have\
    \ done in this book, along with sensible DEFAULT values as necessary.\n\n# Working\
    \ with Transactions\n\nIt's important to realize that calls to Exec(), Query()\
    \ and QueryRow() can use any connection from the sql.DB pool. Even if you have\
    \ two calls to Exec() immediately next to each other in your code, there is no\
    \ guarantee that they will use the same database connection.\n\nSometimes this\
    \ isn't acceptable. For instance, if you lock a table with MySQL's LOCK TABLES\
    \ command you must call UNLOCK TABLES on exactly the same connection to avoid\
    \ a deadlock.\n\nTo guarantee that the same connection is used you can wrap statements\
    \ in a transaction. Here's the basic pattern:\n\n```\ntype ExampleModel struct\
    \ {\n  DB *sql.DB\n}\n\nfunc (m *ExampleModel) ExampleTransaction() error {\n\
    \  // Calling the Begin() method on the connection pool creates a new sql.Tx\n\
    \  // object, which represents the in-progress database transaction.\n  tx, err\
    \ := m.DB.Begin()\n  if err != nil {\n    return err\n  }\n```"
  merge: -1
  img_proc: true
- pgno: 161
  md: "```\n}\n\n// Call Exec() on the transaction, passing in your statement and\
    \ any\n// parameters. It's important to notice that tx.Exec() is called on the\n\
    // transaction object just created, NOT the connection pool. Although we're\n\
    // using tx.Exec() here you can also use tx.Query() and tx.QueryRow() in\n// exactly\
    \ the same way.\n_, err = tx.Exec(\"INSERT INTO ...\")\nif err != nil {\n    //\
    \ If there is any error, we call the tx.Rollback() method on the\n    // transaction.\
    \ This will abort the transaction and no changes will be\n    // made to the database.\n\
    \    tx.Rollback()\n    return err\n}\n\n// Carry out another transaction in exactly\
    \ the same way.\n_, err = tx.Exec(\"UPDATE ...\")\nif err != nil {\n    tx.Rollback()\n\
    \    return err\n}\n\n// If there are no errors, the statements in the transaction\
    \ can be commit\n// to the database with the tx.Commit() method. It's really important\
    \ to ALI\n// call either Rollback() or Commit() before your function returns.\
    \ If you\n// don't the connection will stay open and not be returned to the connection\n\
    // pool. This can lead to hitting your maximum connection limit/running out\n\
    // resources.\nerr = tx.Commit()\nreturn err\n```\n\nTransactions are also super-useful\
    \ if you want to execute multiple SQL\nstatements as a single atomic action. So\
    \ long as you use the"
