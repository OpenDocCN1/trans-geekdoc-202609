  md: "# RESTful Routing\n\nIn the next section of this book we're going to add a\
    \ HTML form to our web application so that users can create new snippets.\n\n\
    To make this work smoothly, we're going to update our application routes so that\
    \ requests to /snippet/create are handled differently based on the request method.\
    \ Specifically:\n\n+   For GET /snippet/create requests we want to show the user\
    \ HTML form for adding a new snippet.\n\n+   For POST /snippet/create requests\
    \ we want to process this form data and then insert a new snippet record into\
    \ our database.\n\nWhile we're at it, it makes sense to restrict our other routes\
    \ — which simply return information — (and HEAD) requests.\n\nEssentially, we\
    \ want our application routes to end up looking like this:\n\n| Method | Pattern\
    \ | Handler | Action |\n|---|---|---|---|\n GET | / | home | Display the home\
    \ page |\n GET | /snippet?id=1 | showSnippet | Display a specific snippet |\n\
    \ GET | /snippet/create | createSnippetForm | Display the new snippet form |"
  merge: -1
  img_proc: true
- pgno: 238
  md: '| Method | Pattern | Handler | Action |

    | :--- | :--- | :--- | :--- |

    | POST | /snippet/create | createSnippet | Create a new snippet |

    | GET | /static/ | http.FileServer | Serve a specific static file |


    Another routing-related improvement would be to use semantic URLs so that any
    variables are included in the URL path and not appended as a query string, like
    so:


    | Method | Pattern | Handler | Action |

    | :--- | :--- | :--- | :--- |

    | GET | / | home | Display the home page |

    | GET | /snippet/id | showSnippet | Display a specific snippet |

    | GET | /snippet/create | createSnippetForm | Display the new snippet form |

    | POST | /snippet/create | createSnippet | Create a new snippet |

    | GET | /static/ | http.FileServer | Serve a specific static file |


    Making these changes would give us an application structure that follows the fundamental
    principles of REST, and which should feel familiar and logical to anyone who works
    on modern web applications.


    But as I mentioned earlier in the book, Go’s servemux doesn’t support method based
    routing or semantic URLs with variables in them. There are some tricks you can
    use to get around this, but most people tend to decide that it’s easier to reach
    for a third-party package to help with routing.'
  merge: -1
