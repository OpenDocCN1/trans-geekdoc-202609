    To fix this we need to make the template render a two-stage process. First, we
    should make a ‘trial’ render by writing the template into a buffer. If this fails,
    we can respond to the user with an error message. But if it works, we can write
    the contents of the buffer to our `http.ResponseWriter`.


    Let''s update the `render` helper to use this approach instead:


    ```

