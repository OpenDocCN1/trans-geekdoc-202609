  md: "```\nif err != nil {\n    return nil, err\n}\n// Append it to the slice of\
    \ snippets\nsnippets = append(snippets, s)\n}\n```\n\n```\n// When the rows.Next()\
    \ loop has finished call rows.Err() to retrieve\n// error that was encountered\
    \ during the iteration. It's important to\n// call this - don't assume a successful\
