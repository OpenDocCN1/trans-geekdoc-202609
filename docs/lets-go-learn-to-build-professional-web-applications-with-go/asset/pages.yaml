  md: 'A good example of where this would be useful middleware to log requests — as
    that’s typically something you would want to do for all requests.


    Alternatively, you can position the middleware after the serveux in the chain
    — by wrapping a specific application handler. This would cause your middleware
    to only be executed for specific routes.


    ```

    serveux -> myMiddleware -> application handler

    ```


    An example of this would be something like authorization middleware, which you
    may only want to run on specific routes.


    We’ll demonstrate how to do both of these things in practice as we progress through
    the book.'
