    \ to running specific sub-tests, the value of the run flag contains multiple regular\
    \ expressions separated by a / character? The first part needs to match the name\
    \ of the test, and the second part needs to match the name of the sub-test.\n\n\
    # # Additional Information\n\n# ## Parallel Testing\n\nBy default, the go test\
    \ command executes all tests in a serial manner, one after another. When you have\
    \ a small number of tests (like we do) and the runtime is very fast, this is absolutely\
    \ fine.\n\nBut if you have hundreds or thousands of tests the total run time can\
    \ start adding up to something more meaningful. And in that scenario, you may\
    \ save yourself some time by running your tests in parallel.\n\nYou can indicate\
    \ that it's OK for a test to be run in concurrently alongside other tests by calling\
    \ the t.Parallel() function at the start of the test. For example:\n\n```\nfunc\
    \ TestPing(t *testing.T) {\n\tt.Parallel()\n\t...\n}\n```"
  merge: -1
  img_proc: true
- pgno: 436
  md: 'It’s important to note here that:


    +   * Tests marked using t.Parallel() will be run in parallel with — and only
    with — other parallel tests.


    +   * By default, the maximum number of tests that will be run simultaneously
    is the current value of GOMAXPROCS. You can override this by setting a specific
    value via the -parallel flag. For example:


    ```

    $ go test -parallel 4 ../...

    ```'
