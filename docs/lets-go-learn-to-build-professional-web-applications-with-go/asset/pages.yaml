  md: '# Customizing HTTP Headers


    Let''s update our application so that the /snippet/create route only responds
    to HTTP requests which use the POST method, like so:


    | Method | Pattern | Handler | Action |

    |---|---|---|--|

    | ANY | / | home | Display the home page |

    | ANY | /snippet | showSnippet | Display a specific snippet |

    | POST | /snippet/create | createSnippet | Create a new snippet |


    Making this change is important because — later in our application build requests
    to the /snippet/create route will result in a new snippet being created in a database.
    Creating a new snippet in a database is a non-idempotent action that changes the
    state of our server, so we should follow HTTP good practice and restrict this
    route to act on POST requests only.


    The main reason I want to cover this now is because it''s a good excuse to talk
    about HTTP response headers and explain how to customize them.


