  md: "# Concurrent Logging\n\nCustom loggers created by log.New() are concurrency-safe.\
    \ You can share a single logger and use it across multiple goroutines and in your\
    \ handlers without needing to worry about race conditions.\n\nThat said, if you\
    \ have multiple loggers writing to the same destination then you need to be careful\
    \ and ensure that the destination’s underlying Write() method is also safe for\
    \ concurrent use.\n\n# Logging to a File\n\nAs I said, my general recommendation\
    \ is to log your output to standard streams and redirect the output to a file\
    \ at runtime. But if you don’t want to do this, you can always open a file in\
    \ Go and use it as your log destination destination. As a rough example:\n\n```\n\
    f, err := os.OpenFile(\"/tmp/info.log\", os.O_RDWR|os.O_CREATE, 6666)\nif err\
    \ != nil {\n    log.Fatal(err)\n}\ndefer f.Close()\n\ninfoLog := log.New(f, \"\
    INFO\\t\", log.Ldate|log.Ltime)\n```"
