  md: '# Removing Unused Packages


    Sometimes you might go get a package only to realize later in your build that
    you don''t need it anymore. When this happens you''ve got two choices.


    You could either run go get and postfix the package path with @none, like so:


    ```

    $ go get github.com/foo/bar@none

    ```


    Or if you''ve removed all references to the package in your code, you could run
    go mod tidy, which will automatically remove any unused packages from your go.mod
    and go.sum files.


    ```

    $ go mod tidy -v

    ```'
