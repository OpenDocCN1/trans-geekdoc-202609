- pgno: 47
  md: '# Project Structure and Organization


    Before we add any more code to our `main.go` file it''s a good time to think how
    to organize and structure this project.


    It''s important to explain upfront there’s no single right — or even recommended
    — way to structure web applications in Go. And that''s both good and bad. It means
    that you have freedom and flexibility over how you organize your code, but it''s
    also easy to get stuck down a rabbit-hole of uncertainty when trying to decide
    what the best structure should be.


    As you gain experience with Go, you''ll get a feel for what patterns work well
    for you in different situations. But as a starting point, the best advice I can
    give you is *don''t over-complicate things*. Try hard to add structure and complexity
    only when it''s demonstrably needed.


    For this project we will implement an outline structure which follows a `popular`
    and `tried-and-tested` approach. It''s a solid starting point, and you should
    be able to reuse the general structure in a wide variety of projects.


    If you''re following along, make sure that you''re in the root of your project
    repository and run the following commands:'
  merge: -1
  img_proc: true
- pgno: 48
  md: '```

    $ cd $HOME/code/snippetbox

    $ rm main.go

    $ mkdir -p cmd/web pkg ui/html ui/static

    $ touch cmd/web/main.go

    $ touch cmd/web/handlers.go

    ```


    The structure of your project repository should now look like this:


    ![](img/fbb9e40b020fe1d7cb903215faaef07e_48_0.png)


    Let''s take a moment to discuss what each of these directories will be used for.


    +   - The cmd directory will contain the application-specific code for the executable
