- pgno: 260
  md: 'parameter by calling r.Form.Get("foo"). Note that in the event of a conflict,
    the request body value will take precedence over the query string parameter.


    Using the r.Form map can be useful if your application sends data in a HTML form
    and in the URL, or you have an application that is agnostic about how parameters
    are passed. But in our case things aren''t applicable. We expect our form data
    to be sent in the request body only, so it''s sensible for us to access it via
    r.PostForm.


    # The FormValue and PostFormValue Methods


    The net/http package also provides the methods r.FormValue() and r.PostFormValue().
    These are essentially shortcut functions that call r.ParseForm() for you, and
    then fetch the appropriate field value from r.Form or r.PostForm respectively.


    I recommend avoiding these shortcuts because they silently ignore any errors returned
    by r.ParseForm(). That''s not ideal — it means our application could be encountering
    errors and failing for users, but there''s no feedback mechanism to let them know.


    # Multiple-Value Fields


    Strictly speaking, the r.PostForm.Get() method that we''ve used above only returns
    the first value for a specific form field. This means you can''t use it with form
    fields which potentially send multiple values, such as a group of checkboxes.'
