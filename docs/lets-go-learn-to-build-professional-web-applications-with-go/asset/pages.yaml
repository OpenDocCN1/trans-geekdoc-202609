  md: '# Designing a Database Model


    In this chapter we''re going to sketch out a database model for our project.


    If you don''t like the term *model*, you might want to think of it as a *service
    layer or data access layer inside*. Whatever you prefer to call it, the idea is
    that we will encapsulate the code for working with MySQL in a separate package
    to the rest of our application.


    For now, we''ll create a skeleton database model and have it return a bit of dummy
    data. It won''t do much, but I''d like to explain the pattern before we get into
    the nitty-gritty of SQL queries.


    Sound OK? Then let''s go ahead and create a couple of new folders under the the
    pkg directory:


    ```

    $ cd $HOME/code/snippetbox

    $ mkdir -p pkg/models/mysql

    $ touch pkg/models/models.go

    $ touch pkg/models/mysql/snippets.go

    ```'
  merge: -1
  img_proc: true
