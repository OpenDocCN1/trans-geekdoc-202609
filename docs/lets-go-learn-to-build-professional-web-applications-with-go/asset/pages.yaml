  md: '+   - Checks that the response status code written by the ping handler is 200.


    +   - Checks that the response body written by the ping handler is "OK".


    # # Recording Responses


    To assist in testing your HTTP handlers Go provides the net/http/httptest package,
    which contains a suite of useful tools.


    One of these tools is the httptest.ResponseRecorder type. This is essentially
    an implementation of http.ResponseWriter which records the response status code,
    headers and body instead of actually writing them to a HTTP connection.


    So an easy way to unit your handlers is to create a new httptest.ResponseRecorder
    object, pass it to the handler function, and then examine it again after the handler
    returns.


    Let''s try doing exactly that to test the ping handler function.


    First, follow the Go conventions and create a new handlers_test.go file to hold
    the test...


    ```

    ```$ touch cmd/web/handlers_test.go ```

    ```


    And then add the following code:


    ```

    File: cmd/web/handlers_test.go

    ```'
  merge: -1
  img_proc: true
