- pgno: 316
  md: 'It’s important to note that our HTTPS server *only supports HTTPS*. If you
    try making a regular HTTP request to it, it won’t work. Our server will write
    the bytes `15 03 01 00 02 02 0A` to the underlying TCP connection, which essentially
    is TLS-speak for “I don’t understand”.


    You should also see a corresponding log message in your terminal relating to this.


    ```

    ERROR  2018/10/16 12:36:53 server.go:2977: http: TLS handshake error from [::

    ```


    # HTTP/2 Connections


    A big plus of using HTTPS is that — if a client supports HTTP/2 connections —
    Go’s HTTPS server will automatically upgrade the connection to use HTTP/2.


    This is good because it means that, ultimately, our pages will load faster for
    users. If you’re not familiar with HTTP/2 you can get a run-down of the basics
    and a flavor of how has been implemented behind the scenes in this GoSF meetup
    talk by Brad Fitzpatrick.


    If you’re using an up-to-date version of Firefox you should be able to see this
    in action. Press `Ctrl+Shift+E` to open the Developer Tools, and if you look at
    the headers of the homepage you should see that the protocol being used is HTTP/2.'
