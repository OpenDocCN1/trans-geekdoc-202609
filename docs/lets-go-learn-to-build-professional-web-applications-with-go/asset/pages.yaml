- pgno: 486
  md: '# Conclusion


    Over the course of this book we''ve explicitly covered a lot of topics, including
    routing, templating, working with a database, authentication/authorization, using
    HTTPS, using Go''s testing package and more.


    But there have been some other, more tacit, lessons too. The patterns that we''ve
    used to implement features — the general way that our project is organized and
    links together — something that you should be able to convey and apply in your
    future work. Importantly, I also wanted the book to convey that you don''t need
    a framework to build web applications in Go. Go''s standard library contains almost
    all the tools that you need... even for a moderately complex application. For
    the times that you do need help with a specific task — like session management,
    routing or password hashing — there are lightweight and focused third-party packages
    that you can reach for.


    At this point, if you''ve coded along with the book, I recommend taking a bit
    of time to review the code that you''ve written so far. As you go through it,
    make sure that you''re clear about what each part of the codebase does, and how
    it fits in the project as a whole.


    I also recommend circling back to any parts of the book that you might have found
    difficult to understand first-time around. For example, now'
  merge: -1
  img_proc: true
- pgno: 487
  md: 'that you''re more familiar with Go, the http.Handler interface chapter might
    be easier to digest. Or, now that you''ve seen how testing is handled in our application,
    the decisions we made in the designing a database model chapter might click into
    place.


    Also, feel free to carry on playing around with the project and trying to extend
    it further. You might like to try:


    +   - Adding a new ''About'' page to the website.

    - Increasing code coverage by adding more unit and integration tests.

    - Creating an API endpoint which returns a JSON representation of a snippet.

    - Adding functionality to confirm a user''s email address on signup.

    - Adding functionality for a user to reset their password.

    - Creating a command line application under cmd/cli to carry out database admin
    tasks.


    And finally, a small request. Sales and marketing really isn''t my suit, so if
    you enjoyed this book and would recommend it to other people, I''d appreciate
    your help in spreading the word!


    +   - Mention this book on Twitter

    - Mention this book on Facebook'
