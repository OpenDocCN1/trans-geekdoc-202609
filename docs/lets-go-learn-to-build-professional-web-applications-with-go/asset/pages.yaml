  md: '# Running the Web Application


    One problem with the convention of putting your tests in a *test.go file is that
    is makes it harder to use the go run command to start our web application.


    If you try to run our web application using the same go run cmd/web/* command
    that we''ve used for most of this book, you''ll now get an error message like
    this:


    ```

    $ go run cmd/web/*

    go run: cannot run *test.go files (cmd/web/templates_test.go)

    ```


    To get around this, you can use the following bash command to exclude the *test.go
    files when executing the go run command:


    ```

    $ go run cmd/web/!(*test).go

    INFO 2018/12/17 13:37:32 Starting server on :4000

    ```


    Note: If you get an event not found error when running this command, you probably
    need to enable extended globbing in your bash terminal'
