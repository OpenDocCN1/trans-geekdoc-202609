- pgno: 73
  md: 'Range requests are fully supported. This is great if your application is serving
    large files and you want to support resumable downloads. You can see this functionality
    in action if you use curl to request bytes 100-199 of the logo.png file, like
    so:


    ```

    curl -i -H "Range: bytes=100-199" --output http://localhost:4000/static/

    HTTP/1.1 206 Partial Content

    Accept-Ranges: bytes

    Content-Length: 100

    Content-Range: bytes 100-199/1075

    Content-Type: image/png

    Last-Modified: Thu, 04 May 2017 13:07:52 GMT

    Date: Wed, 08 Aug 2018 16:21:16 GMT

    [binary data]

    ```


    The Last-Modified and If-Modified-Since headers are transparently supported. If
    a file hasn''t changed since the user last requested it, then http.FileSystem
    will send a 304 Not Modified status code of the file itself. This reduces latency
    and processing overhead for both the client and the server.


    The Content-Type is automatically set from the file extension using the mime.TypeByExtension()
    function. You can add your own custom extensions and content types using the mime.AddExtensionType()
    function if necessary.


