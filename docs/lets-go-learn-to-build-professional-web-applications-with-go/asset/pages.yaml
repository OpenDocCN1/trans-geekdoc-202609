  md: "# Common Dynamic Data\n\nIn some web applications there may be common dynamic\
    \ data that you want to include on more than one — or even every — webpage. For\
    \ example, you might want to include the name and profile picture of the current\
    \ user, or a CSRF token in all pages with forms.\n\nIn our case let's begin with\
    \ something simple, and say that we want to include the current year in the footer\
    \ on every page.\n\nTo do this we'll begin by adding a new CurrentYear field to\
    \ the templateData struct, like so:\n\n```\nFile: cmd/web/templates.go\n```go\n\
    package main\n// Add a CurrentYear field to the templateData struct.\ntype templateData\
    \ struct {\n  CurrentYear int\n  Snippet *models.Snippet\n  Snippets []*models.Snippet\n\
    }\n```\n```"
  merge: -1
  img_proc: true
- pgno: 202
  md: "Then the next step is to create a new addDefaultData() helper method to our\
    \ application, which will inject the current year into an instance of templateData\
    \ struct.\n\nWe can then call this our render() helper to add the default data\
    \ automatically for each page.\n\nI'll demonstrate:\n\n```\nFile: cmd/web/helpers.go\n\
    package main\nimport (\n    \"bytes\"\n    \"fmt\"\n    \"net/http\"\n    \"runtime/debug\"\
    \n    \"time\" // New import\n)\n...\n// Create an addDefaultData helper. This\
    \ takes a pointer to a templateData\n// struct, adds the current year to the CurrentYear\
    \ field, and then returns\n// the pointer. Again, we're not using the *http.Request\
    \ parameter at the\n// moment, but we will do later in the book.\nfunc (app *application)\
    \ addDefaultData(td *templateData, r *http.Request) *temp\n    if td == nil {\n\
    \        td = &templateData{}\n    }\n    td.CurrentYear = time.Now().Year()\n\
    \    return td\n}\nfunc func (app *application) render(w http.ResponseWriter,\
    \ r *http.Request, name str\n```"
