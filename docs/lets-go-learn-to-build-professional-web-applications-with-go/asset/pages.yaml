  md: '# The http.FileServer Handler


    Go’s net/http package ships with a built-in http.FileServer handler which you
    can use to serve files over HTTP from a specific directory. Let’s add a new route
    to our application so that all requests which begin with /static/ are handled
    using this, like so:


    | Method | Pattern | Handler | Action |

    |---|---|---|---|

    | ANY | / | home | Display the home page |

    | ANY | /snippet?id=1 | showSnippet | Display a specific snippet |

    | POST | /snippet/create | createSnippet | Create a new snippet |

    | ANY | /static/ | http.FileServer | Serve a specific static file |'
  merge: -1
