  md: "# # Caching Templates\n\nBefore we add any more functionality to our HTML templates,\
    \ it's good time to make some optimizations to our codebase. There're two main\
    \ issues at the moment:\n\n+   1. Each and every time we render a web page, our\
    \ application must read the template files from disk. This could be sped up by\
    \ *caching* the templates in memory.\n\n+   2. There's duplicated code in the\
    \ home and showSnippet handlers, which we could reduce by creating a helper function.\n\
    \nLet's tackle the first point first, and create an in-memory map with the type\
    \ `map[string]*template.Template` to cache the templates. Open your `cmd/web/templates.go`\
    \ file and add the following code:\n\n```\n```go\npackage main\n\nimport (\n \
    \   \"html/template\" // New import\n    \"path/filepath\" // New import\n   \
    \ \"alexedwards.net/snippetbox/pkg/models\"\n)\n```\n```"
  merge: -1
  img_proc: true
- pgno: 189
  md: "```\nfunc newTemplateCache(dir string) (map[string]*template.Template, error)\
    \ {\n  // Initialize a new map to act as the cache.\n  cache := map[string]*template.Template{\n\
    ```\n\n// Use the filepath.Glob function to get a slice of all filepaths with\n\
    // the extension '.page.tmpl'. This essentially gives us a slice of all the\n\
    // 'page' templates for the application.\n\n```\npages\n```\n\n```\n// Loop through\
    \ the pages one-by-one.\nfor _ := range pages {\n  // Extract the file name (like\
    \ 'home.page.tmpl') from the full file path\n// and assign it to the name variable.\n\
    \  name := filepath.Base(page)\n```\n\n```\n// Parse the template file in to a\
    \ template set.\nts, err := template.ParseFiles(page)\nif err != nil {\n  return\
    \ nil, err\n}\n```\n\n// Use the ParseGlob method to add any 'layout' templates\
    \ to the\n// template set (in our case, it's just the 'base' layout at the\n//\
    \ moment.\n\n```\nts\n```\n\n// Use the ParseGlob method to add any 'partial'\
    \ templates to the\n// template set (in our case, it's just the 'footer' partial\
    \ at the\n// moment.\n\n```\nts\n```"
  merge: -1
  img_proc: true
- pgno: 190
  md: "```\nreturn nil, err\n}\n// Add the template set to the cache, using the name\
    \ of the page\n// (like 'home.page.tmpl') as the key.\ncache[name] = ts\n}\n//\
    \ Return the map.\nreturn cache, nil\n}\n```\n\nThe next step is to initialize\
    \ cache in the main() function and make it available to our handlers as a dependency\
    \ via the application struct, like this:\n\n```\nFile: cmd/web/main.go\n\npackage\
    \ main\n\nimport (\nt\"database/sql\"\nt\"flag\"\nt\"html/template\" // New import\n\
    t\"log\"\nt\"net/http\"\nt\"os\"\n\n\t\"alexedwards.net/snippetbox/pkg/models/mysql\"\
    \n\n\t\"github.com/go-sql-driver/mysql\"\n)\n...\n```"
  merge: -1
  img_proc: true
- pgno: 191
