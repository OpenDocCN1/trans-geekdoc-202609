- pgno: 138
  md: '# Executing SQL Statements


    Now let''s update the SnippetModel.Insert() method — which we''ve just made —
    so that it creates a new record in our snippets table and then returns the integer
    id for the new record.


    To do this we''ll want to execute the following SQL query on our database:


    ```

    INSERT INTO snippets (title, content, created, expires)

    VALUES(?, ?, UTC_TIMESTAMP(), DATE_ADD(UTC_TIMESTAMP(), INTERVAL ? DAY))

    ```


    Notice in this query we''re using the ? character to indicate placeholder parameters
    for the data that we want to insert in the database. Because the data we''ll be
    using will ultimately be untrusted user input from a form, it''s good practice
    to use placeholder parameters instead of interpolating data in the SQL query.


    # Executing the Query


    Go provides three different methods for executing database queries:


    +   - DB.Query() is used for SELECT queries which return multiple rows.

    - DB.QueryRow() is used for SELECT queries which return a single row.'
  merge: -1
  img_proc: true
- pgno: 139
  md: "+   * DB.Exec() is used for statements which don't return rows (like INSERT\
    \ and DELETE).\n\nSo, in our case, the most appropriate tool for the job is DB.Exec().\
    \ Let’s jump in the deep end and demonstrate how to use this in our SnippetModel.Insert()\
    \ method. We’ll discuss the details afterwards.\n\nOpen your pkg/models/mysql/snippets.go\
    \ file and update it like so:\n\n```\nFile: pkg/models/mysql/snippets.go\npackage\
    \ mysql\n...\ntype SnippetModel struct {\n    DB *sql.DB\n}\nfunc (m *SnippetModel)\
    \ Insert(title, content, expires string) (int, error) {\n    // Write the SQL\
    \ statement we want to execute. I've split it over two lines\n    // for readability\
    \ (which is why it's surrounded with backquotes instead\n    // of normal double\
    \ quotes).\n    stmt := `INSERT INTO snippets (title, content, created, expires)\n\
    VALUES(?, ?, UTC_TIMESTAMP(), DATE_ADD(UTC_TIMESTAMP(), INTERVAL ? DAY))`\n\n\
    // Use the Exec method on the embedded connection pool to execute the\n    //\
    \ statement. The first parameter is the SQL statement, followed by the\n    //\
    \ title, content and expiry values for the placeholder parameters. This\n    //\
    \ method returns a sql.Result object, which contains some basic\n    // information\
    \ about what happened when the statement was executed.\n    result, err := m.DB.Exec(stmt,\
    \ title, content, expires)\n    if err != nil {\n        return 0, err\n    }\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 140
  md: "```\n// Use the LastInsertId() method on the result object to get the ID of\
    \ our\n// newly inserted record in the snippets table.\nid, err := result.LastInsertId()\n\
    if err != nil {\n    return 0, err\n}\n\n// The ID returned has the type int64,\
    \ so we convert it to an int type\n// before returning.\nreturn int(id), nil\n\
    \n```\n\nLet's quickly discuss the sql.Result interface returned by DB.Exec().\n\
    This provides two methods:\n\n+   - LastInsertId() — returns the integer (an int64)\
    \ generated by the database in response to a command. Typically this will be from\
    \ an “auto increment” column when inserting a new row, which is exactly what’s\
    \ happening in our case.\n- RowsAffected() — returns the number of rows (as an\
    \ int64) affected by the statement.\n\nIt's important to note that not all drivers\
    \ and databases support these two methods. For example, LastInsertId() is not\
    \ supported by PostgreSQL. So if you're planning on using these methods it's important\
    \ to check the documentation for your particular driver.\n\nAlso, it is perfectly\
    \ acceptable (and common) to ignore the sql.Result return value if you don't need\
    \ it. Like so:"
  merge: -1
  img_proc: true
