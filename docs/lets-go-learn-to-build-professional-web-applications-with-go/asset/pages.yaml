- pgno: 23
  md: 'The TCP network address that you pass to http.ListenAndServe() should be in
    the format "host:port". If you omit the host (like we did with ":4000") then the
    server will listen on all your computer''s available network interfaces. Generally,
    you only need to specify a host in the address if your computer has multiple network
    interfaces and you want to listen on just one of them.


    In other Go projects or documentation you might sometimes see network addresses
    using named ports like ":http" and ":http-alt" instead of a number. If you used
    a named port then Go will look up the relevant port number from your /etc/services
    when starting the server, or will return an error if a match can''t be found.


    # Logging


    In the code above we''re using Go''s log.Println() and log.Fatal() functions to
    output log messages. Both these functions output messages via Go''s ''standard''
    logger, — by default — prefixes messages with the local data and time and write
    them to the standard error stream (which should display in your terminal window).


    The log.Fatal() function will also call os.Exit(1) after writing the message,
    causing the application to immediately exit.'
