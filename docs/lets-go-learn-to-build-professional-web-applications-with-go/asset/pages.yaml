  md: '# User Authorization


    Having the ability to log users in and out of our application is all well good,
    but now we need to do something useful with that information. In this chapter
    we''ll introduce some authorization checks so that:


    +   1. Only authenticated (i.e. logged in) users can create a new snippet; and

    2. The contents of the navigation bar changes depending on whether a user is authenticated
    (logged in) or not. Authenticated users should see links to ''Home'', ''Create
    snippet'' and ''Logout''. Unauthenticated users should see links to ''Home'',
    ''Signup'' and ''Login''.


    As I mentioned briefly in the previous chapter, we can check whether a request
    is made by an authenticated user or not by checking for the existence of a "userID"
    value in your session.


    Let''s first open the `cmd/web/helpers.go` file and add an `authenticatedUser()`
    helper function to retrieve and return the "userID" value from the session:


    ```

    package main

    ...

