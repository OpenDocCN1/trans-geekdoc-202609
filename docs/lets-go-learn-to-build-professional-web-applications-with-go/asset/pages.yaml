  md: '# Introduction


    In this book we''ll be building a web application — Snippetbox, which lets people
    paste and share snippets of text — a bit like Pastebin or GitHub’s Gists. Towards
    the end of the build it will look a bit like this:


    ![](img/fbb9e40b020fe1d7cb903215faaef07e_6_0.png)


    Our application will start off super simple, with just one web page. With each
    chapter we''ll build it up step-by-step until a user is able save and view snippets
    via the app. This will take us through topics like to'
  merge: -1
  img_proc: true
- pgno: 7
  md: 'structure a project, routing requests, working with a database, processing
    forms and displaying dynamic data safely.


    Then later in the book we''ll add user accounts, and restrict the application
    so that only registered users can create snippets. This will take us through more
    advanced topics like configuring a HTTPS server, session management, user authentication
    and middleware.


    # # Prerequisites


    This book is designed for people who are new to Go, but you''ll probably find
    it more enjoyable if you have a general understanding of Go''s syntax first. If
    you find yourself struggling with the syntax, the Little Book of Go by Karl Seguin
    is a fantastic tutorial, or if you want something more interactive running through
    the Tour of Go.


    I''ve also assumed that you''ve got a (very) basic understanding of HTML/CSS and
    SQL, and some familiarity with using your terminal (or command line line for Windows
    users). If you''ve built a web application in any other language before — whether
    it''s Ruby, Python, PHP or C# — then this book should be a good fit for you.


    In terms of software, you''ll need a working installation of Go (version 1.11
    or newer).


    We''ll also use Curl in a few places throughout the book to inspect the responses
    that our application sends. This should be pre-installed on most Macs, and Linux/Unix
    users should find in their package repositories as curl. Windows users can download
    it from here.'
  merge: -1
