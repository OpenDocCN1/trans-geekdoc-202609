- pgno: 81
  md: '# Managing Configuration Settings


    Our web application’s main.go file currently contains a couple of hardcoded configuration
    settings:


    +   - The network address for the server to listen on (currently ":4000")

    - The file path for the static files directory (currently "./ui/static")


    Having these hard-coded settings isn''t ideal. There’s no separation between configuration
    settings and code, and we can''t change the settings at runtime (which is important
    if you need different settings for development, testing and production environments).


    In this chapter we''ll start to improve that, and make the network address for
    our server configurable at runtime.


    # Command-line Flags


    In Go, a common and idiomatic way to manage configuration settings is to use command-line
    flags when starting an application. For example:


    ```

    $ go run cmd/web/* -addr=":80"

    ```'
  merge: -1
  img_proc: true
- pgno: 82
  md: "The easiest way to accept and parse a command-line flag from your application\
    \ is with a line of code like this:\n\n```\naddr := flag.String(\"addr\", \":4000\"\
    , \"HTTP network address\")\n```\n\nThis essentially defines a new command-line\
    \ flag with the name addr, a default value of `:4000` and some short help text\
    \ explaining what the flag controls. The value of the flag will be stored in the\
    \ addr variable at runtime.\n\nLet's use this in our application and swap out\
    \ the hard-coded network address in favor of a command-line flag instead:\n\n\
    ```\nFile: cmd/web/main.go\npackage main\n\nimport (\n    \"flag\" // New import\n\
    \    \"log\"\n    \"net/http\"\n)\n\nfunc main() {\n    // Define a new command-line\
    \ flag with the name 'addr', a default value of\n    // and some short help text\
    \ explaining what the flag controls. The value of\n    // flag will be stored\
    \ in the addr variable at runtime.\n    addr := flag.String(\"addr\", \":4000\"\
    , \"HTTP network address\")\n\n    // Importantly, we use the flag.Parse() function\
    \ to parse the command-line\n    // This reads in the command-line flag value\
    \ and assigns it to the addr\n    // variable. You need to call this *before*\
    \ you use the addr variable\n    // otherwise it will always contain the default\
    \ value of \":4000\". If any\n```"
  merge: -1
  img_proc: true
