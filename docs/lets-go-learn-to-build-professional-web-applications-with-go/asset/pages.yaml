- pgno: 67
  md: "**Remember:** The pattern \"/static/\" is a subtree path pattern, so it acts\
    \ a bit like there is a wildcard at the end.\n\nTo create a new `http.FileServer`\
    \ handler, we need to use the `http.FileServer()` function like this:\n\n```\n\
    fileServer := http.FileServer(http.Dir(\".ui/static\"))\n```\n\nWhen this handler\
    \ receives a request, it will remove the leading slash from the URL path and search\
    \ the .ui/static directory for the corresponding file to send to the user.\n\n\
    So, for this to work correctly, we must strip the leading \"/static\" from the\
    \ URL path before passing it to `http.FileServer`. Otherwise it will be looking\
    \ for a file which doesn't exist and the user will receive a `404 page not found`\
    \ response. Fortunately Go includes a `http.StripPrefix()` helper specifically\
    \ for this task.\n\nOpen your `main.go` file and add the following code, so that\
    \ the file ends up looking like this:\n\n```\nFile: cmd/web/main.go\npackage main\n\
    \nimport (\n    \"log\"\n    \"net/http\"\n)\n\nfunc main() {\n```"
  merge: -1
  img_proc: true
- pgno: 68
  md: '```

    mux := http.NewServeMux()

    mux.HandleFunc("/", home)

    mux.HandleFunc("/snippet", showSnippet)

    mux.HandleFunc("/snippet/create", createSnippet)


    // Create a file server which serves file slices out of the ".ui/static/" directo

    // Note that the path given to the http.Dir is relative to the pro

    // directory root.

    fileServer := http.FileServer(http.Dir("./ui/static/"))


    // Use the mux.Handle() function to register the file server as the handler

    // all URL paths that start with "/static/". For matching paths, we strip t

    // "/static/" prefix before the request reaches the file server.

    mux.Handle("/static/", http.StripPrefix("/static",", fileServer))


