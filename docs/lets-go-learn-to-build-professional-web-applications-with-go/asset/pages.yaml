  md: '# # Additional Information


    # ## Pipelining


    In the code above, we called our custom template function like this:


    ```

    <time>Created: {{humanDate .Created}}</time>

    ```


    An alternative approach is to use the | character to pipeline values to a function.
    This works a bit like pipelining outputs from one command to another in Unix terminals.
    We could re-write the above as:


    ```

    <time>Created: {{.Created | humanDate}}</time>

    ```'
