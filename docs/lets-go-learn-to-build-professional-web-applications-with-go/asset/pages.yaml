- pgno: 163
  md: 'Using these methods comes with a caveat: your database itself probably has
    a hard limit on the maximum number of connections.


    For example, the default limit for MySQL is 151. So leaving SetMaxOpenConns()
    totally unlimited or setting the total maximum of open and idle connections to
    greater than 151 may result in your database returning a "too many connections"
    error under high load. To prevent this from happening, you''d need to set the
    total maximum of open and idle connections to comfortably below 151.


    But in turn that creates another problem. When the SetMaxOpenConns() limit is
    reached, any new database tasks that your application needs to execute will be
    forced to wait until a connection becomes free.


    For some applications that behavior might be fine, but in a web application it''s
    arguably better to immediately log the "too many connections" error message and
    send a 500 Internal Server Error to the user, rather than having their HTTP request
    hand and potentially timeout while waiting for a free connection.


    That''s why I haven''t used the SetMaxOpenConns() and SetMaxIdleConns() methods
    in our application, and left the behavior of sql.DB as the default settings.


    # Prepared statements


    As I mentioned earlier, the Exec(), Query() and QueryRow() methods use prepared
    statements behind the scenes to help prevent SQL injection attacks. They set up
    a prepared statement on the database connection,'
