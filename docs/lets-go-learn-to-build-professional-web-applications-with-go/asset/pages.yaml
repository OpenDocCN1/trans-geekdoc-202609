  md: "# Validating the User Input\n\nWhen this form is submitted the data will end\
    \ up being posted to the signupUser handler that we made earlier.\n\nThe first\
    \ task of this handler will be to validate the data and make sure that it is sane\
    \ and sensible before we insert it into the database. Specifically, we want to\
    \ do four things:\n\n+   1. Check that the user's name, email address and password\
    \ are not blank.\n2. Sanity check the format of the email address.\n3. Ensure\
    \ that the password is at least 10 characters long.\n4. Make sure that the email\
    \ address isn't already in use.\n\nWe can cover the first three checks by heading\
    \ back to our pkg/forms/form.go file and creating two helper new methods — MinLength()\
    \ and MatchesPattern() — along with a regular expression for sanity checking an\
    \ email address.\n\n```\nFile: pkg/forms/form.go\n\npackage forms\n\nimport (\n\
    \    \"fmt\"\n    \"net/url\"\n    \"regexp\" // New import\n    \"strings\"\n\
    \    \"unicode/utf8\"\n)\n```"
  merge: -1
  img_proc: true
- pgno: 348
  md: "```\n// Use regexp.MustCompile() function to parse a pattern and compile\n\
    // regular expression for sanity checking the format of an email address.\n//\
    \ This returns a *regexp.Regex object, or panics in the event of an error.\n//\
    \ Doing this once at runtime, and storing the compiled regular expression\n//\
    \ object in a variable, is more performant than re-compiling the pattern with\n\
    // every request.\nvar EmailRX = regexp.MustCompile(\"^[a-zA-Z0-9.!#\\$%&'*+\\\
    +\\/=?\\^_`{|}~-]+@[a-zA-Z0-9-\")\n```\n\n```\ntype Form struct {\n\turl.Values\n\
    \tErrors errors\n}\n...\n```\n\n```\n// Implement a MinLength method to check\
    \ that a specific field in the form\n// contains a minimum number of characters.\
    \ If the check fails then add the\n// appropriate message to the form errors.\n\
    func (f *Form) MinLength(field string, d int) {\n\tvalue := f.Get(field)\n\tif\
    \ value == \"\" {\n\t\treturn\n\t}\n\tif utf8.RuneCountString(value) < d {\n\t\
    \tf.Errors.Add(field, fmt.Sprintf(\"This field is too short (minimum is %d\",\
    \ d))\\n\t}\n}\n```\n\n```\n// Implement a MatchesPattern method to check that\
    \ a specific field in the form\n// matches a regular expression. If the check\
    \ fails then add the\n// appropriate message to the form errors.\nfunc (f *Form)\
    \ MatchesPattern(field string, pattern *regexp.Regex) {\n\tvalue := f.Get(field)\n\
    \tif value == \"\" {\n\t\treturn\n\t}\n\tif !pattern.MatchString(value) {\n\t\t\
    f.Errors.Add(field, \"This field is invalid\")\n\t}\n```"
  merge: -1
  img_proc: true
