  md: '# Testing HTML Forms


    In this chapter we''re going to add an end-to-end test for the \POST /user/signup
    route, which is handled by our signupUser handler.


    Testing this route is made a bit more complicated by the anti-CSRF check that
    our application does. Any request that POST /user/signup will always receive a
    400 Bad Request response unless the request contains a valid CSRF token and cookie.
    To get around this we need to emulate the workflow of a real-life user as part
    of our test, like so:


    +   1. Make a GET /user/signup request. This will return a response which contains
    a CSRF cookie in the response headers and a CSRF token in the HTML response body.


    +   2. Extract the CSRF token from the HTML response body.


    +   3. Make a POST /user/signup request, using the same http.Client that we used
    in step 1 (so it automatically passes the CSRF cookie) and including the POST
    request alongside the other CSRF data that we want to test.


    Let''s begin by adding a new helper function to our cmd/web/testutils_test.go
    file for extracting the CSRF token (if one exists) from a HTML response body:'
