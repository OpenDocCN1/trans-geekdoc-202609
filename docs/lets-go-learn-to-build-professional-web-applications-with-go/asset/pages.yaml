  md: '# Catching Runtime Errors


    As soon as we begin adding dynamic behavior to our HTML templates there''s a risk
    of encountering runtime errors.


    Let''s add a deliberate error to the show.page.tmpl template and see what happens:


    ```

    File: ui/html/show.page.tmpl


    {{template "base" }}


    {{define "title"}}Snippet #{{.Snippet.ID}}{{/end}}


    {{define "body"}}

    {{with .Snippet}}

    <div class=''snippet''>

    <div class=''metadata''>

    <strong>{{.Title}}</strong>

    <span>#{{.ID}}</span>

    </div>

    {{if len nil}}!-- Deliberate error --

    <pre><code>{{.Content}}</code></pre>

    <div class=''metadata''>

    <time>Created: {{.Created}}</time>

    <time>Expires: {{.Expires}}</time>

    </div>

    {{/if}}

    </div>

    {{/with}}

    </div>

    {{/end}}

    ```'
