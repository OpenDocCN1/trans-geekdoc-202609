  md: 'Command-line flags are completely optional. For instance, if you run the application
    with no -addr flag the server will fall back to listening on address :4000 (which
    is the default value we specified).


    ```

    $ go run cmd/web/*

    2018/08/08 19:28:11 Starting server on :4000

    ```


    There are no rules about what to use as the default values for your command-line
    flags. I like to use defaults which make sense for my development environment,
    because it saves my time and typing when I''m building an application. But YMMV.
    You might prefer the safer approach of setting defaults for your production environment
    instead.


    # Type Conversions


    In the code above we''ve used the flag.String() function to define the command-line
    flag. This has the benefit of converting whatever value the user provides at runtime
    to a string type. If the value can''t be converted to a string the application
    will log an error and exiting.


    Go also has a range of functions including flag.Int(), flag.Bool() and flag.Float64().
    These work in exactly the same way as flag.String(), except they automatically
    convert the command-line flag value to the appropriate type. We''ll use some of
    these different functions later in the book.


    # Automated Help'
