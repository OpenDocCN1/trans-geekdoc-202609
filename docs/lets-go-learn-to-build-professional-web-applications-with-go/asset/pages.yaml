    \    app := &application{\n        errorLog:      errorLog,\n        infoLog:\
    \       infoLog,\n        snippets:      &mysql.SnippetModel{DB: db},\n      \
    \  templateCache: templateCache,\n    }\n\n    srv := &http.Server{\n        Addr:\
    \     *addr,\n        ErrorLog: errorLog,\n```"
  merge: -1
