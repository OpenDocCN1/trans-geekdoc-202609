- pgno: 419
  md: 'This is the basic one that you''ll use for nearly all tests that you write
    in Go. The important things to take away are:


    +   The test is just regular Go code, which calls the humanDate function and checks
    that the result matches what we expect.


    +   Your unit tests are contained in a normal Go function with the signature func(*testing.T).


    +   To be a valid unit test the name of this function must begin with the word
    Test. Typically this is followed by the name of the function, method or type that
    you''re testing to help make it obvious at a glance what is being tested.


    +   You can use the t.Error() function to mark a test as failed and log a descriptive
    message about the failure.


    Let''s try this out. Save the file, then use the go test command to run all the
    tests in our cmd/web package like so:


    ```

    $ go test ./cmd/web

    alexedwards.net/snippetbox/cmd/web 0.005s

    ok

    ```


    So, this is good stuff. The ok in this output indicates that all tests in the
    package (for now, only our TestHumanDate test) passed without any problems.


    If you want more detail, you can see exactly which tests are being run by using
    the -v flag to get the verbose output:'
