  md: '# Parsing Form Data


    Thanks to the work we did previously in the RESTful routing section, and POST
    /snippets/create requests are already being dispatched to our createSnippet handler.
    We''ll now update this handler to process and use the form data when it''s submitted.


    At a high-level we can break this down into two distinct steps.


    +   1. First, we need to use the r.ParseForm() method to parse the request body.
    This checks that the request is well-formed, and then stores the form data in
    the request''s r.PostForm map. If there are any errors encountered when parsing
    the body (like there is no body, or it''s too large to process) then it will return
    an error. The r.ParseForm() method is also idempotent; it can safely called multiple
    times on the same request without any side-effects.


    +   2. We can then get to the form data contained in r.PostForm by using the r.PostForm.Get()
    method. For example, we can retrieve the value of the title field with r.PostForm.Get("title").
    If there is no matching field name in the form this will return the empty string
    "", similar to how we query string parameters worked earlier in the book.


    Open your cmd/web/handlers.go file and update it to include the following code:'
  merge: -1
  img_proc: true
