- pgno: 285
  md: 'To make this work, we need to start sharing data (or state) between HTTP requests
    for the same user. The most common way to do that is to implement a *session*
    for the user.


    In this section you''ll learn:


    +   - What session managers are available to help us implement sessions in Go.

    - How you can customize session behavior (including timeouts and cookie settings)
    based on your application''s needs.

    - How to use sessions to safely and securely share data between requests for a
    particular user.'
  merge: -1
  img_proc: true
- pgno: 286
  md: '# Installing a Session Manager


    There''s a lot of security considerations when it comes to working with sessions,
    proper implementation is non-trivial. Unless you really need to roll you your
    own implementation it''s a good idea to use an existing, well-tested, third-party
    package.


