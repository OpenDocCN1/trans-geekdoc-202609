    # Skipping Long-Running Tests


    When your tests take a long time, you might decide that you want to skip specific
    long-running tests under certain circumstances. For example, you might decide
    to only run your integration tests before committing a change, instead of more
    frequently during development.


    A common and idiomatic way to skip long-running tests is to use the testing.Short()
    function to check for the presence of a -short flag, like we have in the code
    above.


    When we run our tests with the -short flag, then our TestUserModelGet test will
    be skipped.'
