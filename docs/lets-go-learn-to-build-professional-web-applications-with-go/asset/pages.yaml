  md: '# Implementing RESTful Routes


    The basic syntax for creating a router and registering a route with the bmizernay/pat
    package looks like this:


    ```

    mux := pat.New()

    mux.Get("/snippet/:id", http.HandlerFunc(app.showSnippet))

    ```


    In this code:


    +   "/snippet/:id" pattern includes a named capture :id. The named capture acts
    like a wildcard, whereas the rest of the pattern matches literally. Pat will add
    the contents of the named capture to the URL query string at runtime behind the
    scenes.


    +   mux.Get() method is used to register a URL pattern and handler which will
    be called only if the request has a GET HTTP method. Corresponding Post(), Put(),
    Delete() and other methods are also provided.


    +   Pat doesn''t allow you to register handler functions directly, so you need
    to convert them using the http.HandlerFunc() adapter.


    With all that in mind, let''s head over to the routes.go file and update it to
    use Pat:'
  merge: -1
  img_proc: true
