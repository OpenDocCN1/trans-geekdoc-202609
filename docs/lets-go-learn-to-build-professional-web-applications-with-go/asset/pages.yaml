  md: "# Mocking Dependencies\n\nNow that we've explained some general patterns for\
    \ testing your web application, in this chapter we're going to get a bit more\
    \ serious and write some tests for our showSnippet handler and GET /snippet/:id\
    \ route.\n\nBut first, let's talk about dependencies.\n\nThroughout this project\
    \ we've injected dependencies into our handlers via the application struct, which\
    \ currently looks like:\n\n```\ntype application struct {\n    errorLog      *log.Logger\n\
    \    infoLog       *log.Logger\n    session       *sessions.Session\n    snippets\
    \      *mysql.SnippetModel\n    templateCache map[string]*template.Template\n\
    \    users         *mysql.UserModel\n}\n```\n\nWhen testing, it sometimes makes\
    \ sense to mock these dependencies instead of using exactly the same ones that\
    \ you do in your production application.\n\nFor example, in the previous chapter\
    \ we mocked the errorLog and infoLog dependencies with loggers that write messages\
    \ to"
  merge: -1
  img_proc: true
- pgno: 449
  md: "ioutil.Discard, instead of the os.Stdout and os.Stderr streams like\nwe do\
    \ in our production application:\n\n```\nfunc newTestApplication(t *testing.T)\
    \ *application {\n\treturn &application{\n\terrorror: log.New(ioutil.Discard,\
    \ \"\", 0),\n\tinfoLog: log.New(ioutil.Discard, \"\", 0),\n\t}\n}\n```\n\nThe\
    \ reason for mocking these and writing to iutil.Discard is to avoid\nclogging\
    \ up our test output with unnecessary log messages when we run\ngo test -v.\n\n\
    **Note:** Depending on your background and programming experiences,\nyou might\
    \ not consider these loggers to be mocks. You might call them\nfakes, stubs or\
    \ something else entirely. But the name doesn't really\nmatter — and different\
    \ people call them different things. What's\nimportant is that we're using something\
    \ that exposes the same interface\nas a production object for the purpose of testing.\n\
    \nThe other two dependencies that it makes sense for us to mock are the\nmysql.SnippetModel\
    \ and mysql.UserModel database models. By\ncreating mocks of it's possible for\
    \ us to test the behavior of our\nhandlers without needing to set up an entire\
    \ instance of the MySQL\ndatabase.\n\n# Mocking the Database Models"
  merge: -1
  img_proc: true
