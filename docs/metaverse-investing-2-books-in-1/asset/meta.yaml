  - 2. 花些时间了解市场历史。加密货币市场每天 24 小时、7 天候开放。在交易量较低时，重大价格波动通常发生在清晨。加密货币有时会飙升 400%，有时会下跌
    80%，有时某些硬币几个月内毫无波动……你将很难预测这些情况中哪一个会发生。如果你在行情良好的时期进入市场，可能会认为情况总是是这样，但事实从未如此。有时
    `BTC` 上涨，而山寨币下跌，有时山寨币似乎占据了主导地位，有时一切都在涨又跌，以此类推。当然，一切不会一直如此。
