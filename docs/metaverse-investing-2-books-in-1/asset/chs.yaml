  \n# 引言\n\n在 Facebook 改名为 Meta 之前，元宇宙的概念已经存在并正在快速发展，首席执行官马克·扎克伯格也详细讨论过“元宇宙”。这是不可避免的：元宇宙已经在这里，而且很可能将长期存在。\n\
  \n那么，元宇宙究竟是什么？它像某些公司声称的那样重要，还是仅仅是一个几个月内就会消失的转瞬即逝的时尚？你是否需要关于元宇宙的所有知识，你是否应该在它进一步爆发之前投入？本书将深入探讨元宇宙概念，讨论它的过去、现在，以及最重要的未来。\n\
  \n# 第 1 章：元宇宙的概念\n\n尽管是一个新概念，但元宇宙似乎已经无处不在。\n\nFacebook（呃，Meta）最近的品牌重塑和投资引发了新波对元宇宙的关注潮。它充斥在新闻、表情包、游戏平台和社交媒体中。这个词日益增长的普及产生了一种紧迫的危机感，仿佛我们的物理生活随时会被包裹，被像素和付费墙交易所所吞噬。然而，像\
  \ `Fortnite` 和 `Roblox` 这样的游戏已经宣传元宇宙多年，而这个短语本身已经有几十年的历史了。\n\n那么，元宇宙究竟是什么？\n\n马克·扎克伯格的阐述勾勒出一个虚拟现实的愿景：你使用\
  \ `Quest VR` 头显以化身身份参加商务会议，并用手上的设备偷偷地给哥们发短信。当你出门时，会戴上智能眼镜，捕捉你看到和听到的内容，并提供增强现实。元宇宙可以通过手机、笔记本电脑、可穿戴设备和头设备（或它们的组合）访问。它将是你工作、锻炼、购物、社交、看电影和玩视频游戏的地方。\n\
  \n然而，这个词早于许多可能使其成为现实的科技。前缀 `meta-` 可以表示“在……之后或之外”、“更广泛的”，甚至是“变革性的”（例如 metamorphosis\
  \ 变形）。后缀 `-verse` 来自“universe”（宇宙），指的是特定的领域或区域（例如 `Twitterverse`）或虚构世界（例如 `omegaverse`（抱歉！），一种推测性的替代现实文学类型，其中角色被分为\
  \ alpha、beta 和 omega）。存在于现实世界之外、之上或作为其补充的虚拟环境被称为“元宇宙”。\n\n该术语首次出现在尼尔·斯蒂芬森于 1992\
  \ 年出版的反乌托邦科幻小说《雪崩》（`Snow Crash`）中。根据小说，元宇宙是一个虚拟和增强现实的集合，中心是一条超长的“街道”，个人可以以化身的身份在上面漫步，并通过眼镜和电脑访问。公共终端的用户被描绘为模糊的黑白化身，而私有终端被描绘为彩色且细节丰富。从那时，“元宇宙”一词已指代构建更持久的虚拟世界的各种活动，这种世界渗透进了我们的日常生活。\n\
  \n自 `1960` 年代以来，人们一直在构建沉浸式虚拟世界，这种渴望受到了电影和视频游戏行业努力的推动。`Second Life` 是一款替代现实电脑游戏，你在其中控制化身并做任何你想做的事，如买房或结婚，它于\
  \ `2003` 年发布，是元宇宙最著名的例子之一。它是一个如此真实的环境，那里甚至有繁荣的恋癖文化——没有比这更真实的了。尽管如此，到 `2006` 年，已经有足够的元宇宙专家举行了一峰会议。\n\
  \n《元宇宙路线图》（`Metaverse Roadmap`）是一个规划完成元宇宙路径的项目，它诞生于该会议。根据《元宇宙路线图”，“虚拟增强的物理现实与[一个]物理持久的虚拟领域的融合”。换句话说，它可能像通过增强现实技术叠加在我们世界之上的第二个世界，以及一个我们可以进入和退出的虚拟区域，类似于《间谍宝贝\
  \ 3》（Spy Kids 3）中的游戏。例如，考虑 `Snapchat` 滤镜或 `Google` 查看等比例 `3D` 动物模型的功能。根据《元宇宙路线图”，“元宇宙不是互联网的全部——但像\
  \ Web 一样，它被许多人视为最重要的元素。”\n\n今天的许多传教者会声称，我们已经拥有技术、协议和基础设施来踩油门首次实现它。它被认为是移动互联网之后的下一个逻辑步骤。虚拟现实、`Zoom`\
  \ 会议、增强现实、社交网络、加密货币、`NFTs`、在线零售、可穿戴技术、人工智能、`5G` 等等在元宇宙中得到了探索。它被认为是未来！因为未来是不可避免的，所以它一定是积极的，对吧？\n\
  \n许多赞美元宇宙优点并认为它是自然下一步的人是硅谷的声音、未来主义者（《元宇宙路线图》的 John Smart）以及对元宇宙实现拥有利益关系的其他玩家。其中之一无疑是马克·扎克伯格。\n\
  \n……一个实时渲染的 3D 环境的大网络。”\n\n根据 Ball 的说法，元宇宙是“一个持久的、实时生成的 3D 环境和模拟的大网络。”Ball 的元宇宙应该保留身份、物体、历史和支付连续性。它应该让无限的人同时体验，每个人都有自己的临场感。元宇宙是一个让人们能够临场的持久虚拟世界，它是一个可能利用区块链技术来支付我们可以在各种体验中携带物品的地方：想象一下能将你的\
  \ `Animal Crossing Sandy Liang` 毛衣用在你的 `Twitter` 和 `Instagram` 个人资料中。Ball 的元宇宙正在不断增长和变化。\n\
  \n\n\n\nBall 的元宇宙对扎克伯格产生了很大影响。在他的 Facebook Connect 发布会上，扎克伯格的化身在不同平台之间移动，穿着同一件黑色\
  \ T 恤，展示“身份和事物的连续性”。扎克伯格的元宇宙正朝着容纳无限数量的人的发展，目前有 30 亿 Facebook 用户。在整个演讲中，扎克伯格强调了元宇宙的每一个方面将如何创造“存在感”。\n\
  \nRoblox 和 Epic Games 的《堡垒之夜》在元宇宙讨论中经常被提到，有些人认为它们比扎克伯格的 Meta 更接近实现元宇宙。这是因为这两款游戏都符合持久虚拟世界的标准：它们都有数百万人来游戏和社交，物品（服装和皮肤）具有一定的持久性，并且接受支付（`Robux`\
  \ 和 `V-Bucks`）。此外，数百万人观看了《堡垒之夜》亚莉娜·格兰德的表演，这些活动加上可自定义的化身和表情，正在产生一种“存在感”。\n\n最需要理解的概念是元宇宙并不存在。扎克伯格已经明确表示，对于他来说，元宇宙就像许多其他投资者、工程师、科学家和未来主义者一样，是一个长期目标。当然，人们鄙视扎克伯格的提议，对\
  \ Meta 元宇宙除了造成不可估量的伤害之外还能完成任何事情毫无信心，甚至将其称为反乌托邦式的灾难。尽管如此，元宇宙是一个想法——对某些人来说是兴奋的，对另一些人则是恐怖的。《欢迎来到元宇宙是由\
  \ Rhizome 主办的一个会议，这是一个致力于存档数字艺术和文化的非营利艺术组织。艺术家大卫·鲁尼克（David Rudnick）表示，“元宇宙的概念是终极的中心化”，这与我们曾经对互联网民主化的许多希望背道而驰。“当人们谈论新兴的元宇宙梦想时，”鲁尼克解释道，“他们谈论的是一个可以在[虚拟世界中]做任何事情的空间，”一个商业公共空间，“可以从平台上发生的所有互动中提取价值或某种所有权。”\n\
  \n对元宇宙的恐惧和担忧核心在于对规模的担忧。虚拟世界负面因素的任何增加都可能加剧这些担忧。如果由少数营利公司调解如此关键的互动，会意味着什么？如果 Meta\
  \ 目前在社交媒体上的主导地位是任何指标，那么就没有理由乐观了。\n\n政府在理解更说监管技术突破方面一直很迟缓。一个连 `finsta` 是什么都不知道的政府被委托维护元宇宙的安全、伦理和可持续性，值得信任吗？如果追求这一点，对人类和环境的成本和收益将是什么？\n\
  \n目前，元宇宙主要是虚构的、假设的和幻想，留下了许多空间让未知的寒风吹过。\n\n## 什么是元宇宙，它是如何运作的？深度解析“互联网的未来”。\n\n###\
  \ 元宇宙是一个虚拟现实\n\n原剧系列特色图片\n\n尽管元宇宙是一个虚拟世界，但它与你在科幻电影中看到的不同。\n\n考虑像《黑客帝国》这样的剧，其中世界是一个每个人都连接的数字模拟，而且制作精良，以至于几乎没有人意识到它不是真实的。元宇宙还没有达到那种程度，但它具有成为极具沉浸体验的潜力。\n\
  \n元宇宙的概念出现的时间比 Meta 早得多。\n\n\n\n虽然微软的声明与 Meta 相比可能显得微不足道，但它是迈向元宇宙的重要一步，展示了公司的承诺。此外，与\
  \ Meta 一样，微软可能意图将元宇宙整合到未来的远程办公中，`Teams` 的这些更新就证明了这一点。\n\n`Nvidia Omniverse` 是英伟达进入元宇宙竞赛的另一位重量级选手。该公司将其描述为“一个将\
  \ 3D 环境集成到共享虚拟宇宙的平台”。英伟达的 `Omniverse` 是云原生的，这意味着是一个共享、持久的平台，在会话之间不会发生变化。此外，它可以远程流传输到任何设备，并运行在基于\
  \ `RTX` 的平台上。\n\n## Omniverse Replicator 的应用\n\n到目前为止，这家显卡巨头似乎在元宇宙上采取了略有不同的方法。Meta\
  \ 和微软强调元宇宙的社交属性，而英伟达侧重于协作和新技术的探索。设计师、机器人工程师和其他专家利用 `Omniverse` 在虚拟现实中模仿现实世界。例如，爱立信工程师使用\
  \ `Omniverse` 模拟城市背景下的 `5G` 波段。\n\n从未来来看，另一个大玩家已出现在视线上。苹果正在开发全功能虚拟现实头戴设备和增强现实眼镜，所有指标都指向公司正向元宇宙迈进。这两款产品几乎都需要连接到元宇宙才能工作；因此，在元宇宙开发方面，苹果可能不会落后于\
  \ Meta。\n\n## 元宇宙仅仅是视频游戏的幌子吗？\n\n简单来说：不是，我不这么认为。\n\n长回答：取决于你的观点，也许有一点点。\n\n所有在线游戏，包括\
  \ `Fortnite`、`World of Warcraft` 和 `Minecraft`，本身就是元宇宙。它们构建了一个永久的环境，玩家可以随心所欲地进入。此外，玩家的进度存储在外部服务器上并与其他用户共享，这意味着你在这些游戏中做的任何事情稍后都可以被回顾。\n\
  \n每部游戏在技术上都可以被视为一个元宇宙，而各种科技巨头正在开发的元宇宙都可能包含游戏特性。另一方面，元宇宙的概念比视频游戏要广泛得多。元宇宙旨在在虚拟环境中取代或增强现实世界的功能。用户每天要做的事情，如上课或上班，都可以在元宇宙中完成。\n\
  \n视频游戏元宇宙和宏大元宇宙的概念之间有一些相似之处。例如，你可以与人交流，就各种活动进行协作，甚至在某种程度上改变周围的世界。然而，这一切都受到游戏规则的限制。\n\
  \n例如，在 `Minecraft` 中，你可以创建一个巨大的堡垒；然而在 `World of Warcraft` 中，你没有同样的自由。相反，玩家可以拥有一个驻卫营，这本质上是一块土地，尽管他们对外观或放置位置几乎完全没有控制权。更重要的是，所有玩家共享同一块土地，他们只有在受邀请的情况下才能互相访问。\n\
  \n这个 `Minecraft` 项目以建筑和地形为特色。\n\n尽管上述头的作品目前很流行，但元宇宙的概念可以在许多视频游戏中找到，并且已经存在很长时间了。`Second\
  \ Life` 是一款始于 2003 年且至今仍然活跃的游戏，它是一个不像许多其他游戏那样没有最终目标的元宇宙：它只是允许你环游世界与其他交流。顺便说一下，你还可以飞行。\n\
  \n在理想的元宇宙中，许多传统的视频游戏限制被消除了，你构建自己的命运。然而，无论是在与游戏相关的元宇宙中，初始阶段总是相同的：你必须创建自己的角色。\n\n\
  ## 演变为化身\n\n元宇宙中的用户被赋予一个化身，代表他们自己，并且根据自己的喜好进行定制。平台决定化身的外观。它可能非常基础，但也可以非常高质量，具有许多自定义选项。例如，用户可以保持忠实，但也可能变成完全不同的人。\n\
  \n一旦构建完成，化身就是进入元宇宙的入场券，只要你有想象力，那里一切皆有可能。化身可以在其中漫步、交流并探索环境。但当然，这一切都受限于平台的限制。\n\n\
  `Meta Horizon Worlds` 元宇宙拥有四个化身。\n\n某些元宇宙实例类似于视频游戏，允许用户使用键盘和鼠标行走。在更高级的版本中，使用了虚拟现实头戴设备和控制器通过模拟用户在元宇宙中的运动来实现沉浸感。\n\
  \n创建化化的程序取决于公司。2022 年，`Microsoft Mesh` 将整合到 `Teams` 中，为元宇宙带来新变化。用户将使用该应用程序构建完全个性化的化身。得益于混合现实技术，化身将是用户的真实呈现。这未来包括丰富的面表情、肢体语言和背景。\n\
  \n在下一个元宇宙 `Horizon Worlds` 中，Meta 对化身创建有很棒的想法。虚拟现实将支持这些化身，它们实时反映用户的活动。虽然这一切听起来很棒，但这些化身目前还没有腿，可能是为了让移动和旅行更容易管理。Meta\
  \ 还在开发逼真的 `Codec Avatars`，这是与其环境实时渲染的震撼、超真实的化身。\n\n理想的元宇宙无论平台如何，都允许用户选择他们想要的外，同时在\
  \ `VR` 支持下保持表情和动作的真实性。\n\n## 元宇宙长什么样？\n\n要回答这个问题，我们首先必须区分“元宇宙”和“一个元宇宙”。没有单一的元宇宙将所有宇宙连接成一个统一的整体，尽管它们都使用互联网连接其用户。因此，每个元宇宙可能有独特外观。\n\
  \n元宇宙的外观由其创建者决定。某些元宇宙是沙盒式的，有大量的开发机会，对用户构建的内容限制很少。想象一下 `Minecraft`，但要大得多：大家都住在同一个宇宙里，而不是和朋友共享一个服务器。\n\
  \n\n\n\n在理想情况下，元宇宙将把每一个人连接在一起。当你加入一个公共服务器时，你应该能够与此时在线的所有其他人进行交流。然而，现实情况往往大然不同。\n\
  \n随着元宇宙变得越来越流行，托管它们的服务器变得无法处理增长的流量。一些程序员设计了不同的层级来划分用户，从而缩减了宇宙的规模。\n\n这种情况在未来可能会被避免，但目前，元宇宙通常是碎片化的——更不用说人们会使用多个平台，实际上是选择了他们喜爱的领域。\n\
  \n如前所说，每家公司对元宇宙都有自己的观点。例如，Facebook 正在开发 `horizon Worlds`，`Nvidia` 正在开发 `omniverse`，而在这片大池子中更小的鱼也在参与其中。此外，`Bitcoin`\
  \ 行业也有自己的元宇宙。\n\n现在，一个单一且巨大的元宇宙构的想法是不可行的，因为各种元宇宙彼此孤立，运行在不同的平台上，并且没有共同的用途或目标。\n\n\
  如果元宇宙是一个大型的共享虚拟环境，那么所有发布其元宇宙的企业都将不得不齐协努力。这些企业不仅必须合作，服务器技术也必须快速提高。\n\n为了在一个平台上托管所有这些元宇宙的多个版本，托管主机和终端用户必须处理无法想象的服务器负载。\n\
  \n在实现这一目标之前，元宇宙可能保持碎片化，这要求用户在连接到共同世界之前先选择他们偏好的宇宙。\n\n## 元宇宙的目的是什么？\n\n元宇宙作为一个概念是很难定义的，仅仅是因为它看起来是无尽的。然而，这意味着创建它的组织或个人群体以及每个用户都可以根据具体情况来定义它的通用用途。\n\
  \n元宇宙的总目标是通过一个虚拟的共享宇宙将人们团结在一起。元宇宙存在的意义是为了弥合现实与距离之间的差距，团结来自世界各地的人，无论是为了就业、自我提升还是仅仅为了娱乐。\n\
  \n允许用户通过他们的 `avatars` 与大世界进行互动，而不赋予他们任何特定目的，这提供了很大的选择灵活性。这也是 `Meta` 大揭晓理念的基础：即你在元宇宙中实际上可以做任何你想做的事。\n\
  \n## 让我们来看看元宇宙中一些更热门的活动。\n\n### 拥有房产\n\n允许人们购买地块是元宇宙中反复出现的主题。当用户购买房产时，该房产会被分配给该用户，只要该\
  \ `avatar` 拥有它，其他玩家就无法使用。就像现实世界一样，地块可以被购买或租赁。\n\n当你拥有房产时，你通常可以自由地按意愿使用它。例如，有些人倾向于创建一个画廊来展示他们的收藏，而另一些人则开设商店或创建共享公共区域。\n\
  \n允许用户在环境中构建他们想要的任何东西的想法并不新鲜，这也是为什么像 `Minecraft` 和 `Roblox` 这样的游戏如此流行的原因之一。元宇宙开发者通过允许用户创建自己的建筑，节省了大量工作，否则这将花费大量时间。\n\
  \n当然，这是互联网，过度的自由可能会导致各种恶作剧。大多数元宇宙继续监控用户生成的内容，取决于托管者的规定，这些内容可能会被删除。即使是表面上无限的宇宙也有其界限。\n\
  \n### 交易房产\n\n一旦你在元宇宙中获得了某些东西，你就可以与其他用户进行出售或交易。这为这个冷冷的世界增添了财富感和声望。某些地块比其他地块更有价值，某些是稀有的，而另一些是常见的——这一切都有助于建立一种特定于元宇宙的经济体系。\n\
  \n元宇宙中的地块在大小和位置上通常各异。鉴于这是现实生活的虚拟呈现，元宇宙中的房地产市场活跃且运作良好也并不奇怪。有争议的地块（由于更靠近繁忙场所或仅仅由于某些其他奢侈因素而更具吸引力）其价格可以远高于市郊的一小块普通草地。\n\
  \n`Decentraland` 是一个基于区块链的元宇宙。\n\n有些元宇宙不仅对普通用户受欢迎，对企业来说也如此。因为有这么多的人共享这个宇宙，它提供了一个广告机会。购买土地并展示公司的\
  \ Logo 可能是激发或刷新兴趣的好方法。\n\n公司可以从多种方式从元宇宙中获益。例如，在一个看似无限的宇宙中，组织活动、开发物业之间的跨界合作以及与用户社区进行交流变得更加容易。\n\
  \n### 生活与互动\n\n之前提到的在元宇宙中可以实现的例子，与理想的元宇宙相比，仅仅是技术性问题——一个实际上完全能够取代现实的领域。我们还没有到达那里（可能多年后才能到达），但像\
  \ `Meta` 和 `VRChat` 这样的公司正将我们推向比任何时候都接近的地方。\n\n在理想的元宇宙中，你将与附近的每个人进行互动。这比我们在 `Second\
  \ Life` 或 `Habbo` 等游戏中看到的基于文本的对话要先进得多。然而，使用语音通信、VR 头显和 AR 眼镜可以将互动推向新的水平。\n\n无论是与朋友聚会、跳伞，还是在虚拟图书馆组织学习小组，元宇宙的核心假设将始终是互动——尽管不是面对面的。\n\
  \n## 工作与学习\n\n从 `Meta` 到 `Microsoft`，许多公司对在元宇宙中协作、学习的能力赋予了高度价值。\n\n`Microsoft` 打算利用\
  \ `Mesh` 为无趣的视频增加真实感。此外，`meta` 渴望构建虚拟工作空间，让远程工作者在白天共同度过。\n\n工作可以通过多种方式在元宇宙中完成，包括在虚拟现实中模拟现实任务。例如，工程师、程序员、设计师和其他各种专业人士可以使用\
  \ `Nvidia` 的 `Omniverse` 等元宇宙来实现。\n\n## 元宇宙、加密货币和 NFT 以某种方式相互关联\n\n讨论元宇宙时如果不提到 `Bitcoin`\
  \ 是困难的。毕竟，加密货币运行的去中心化基础区块链已用于许多著名的案例。\n\n例如，`Decentraland` 是一个沙盒风格元宇宙，用户可以在其中拥有地块、探索其他地块并交流。仅用于\
  \ `Decentraland` 的加密货币 `MANA` 支撑了整个经济。\n\n这些元宇宙与商业拥有的宇宙不同，它们依赖于去中心化网络，在该网络中你的资产属于你自己，而不是由元宇宙所有控制。\n\
  \n加密货币几乎总是去中心化的，围绕它们构建的世界也是如此。这意味着没有单一实体控制货币、虚拟土地或整个元宇宙，因此它不会被随时关闭、出售或销毁。合同分发给网络用户，去中心化需要多数投票。除非大多数网络决定关闭它，否则元宇宙理论上应该对所有人开放。\n\
  \n在 `World of Warcraft` 等游戏元宇宙中并非如此，你的账户仍然是游戏创建者的财产。遗憾的是，这意味着你对角色或装备等资产没有完全控制权。`NFTs`（非同质代币）是解决这个问题的方案。\n\
  \n\n\n\n\nNFT 的范围从 8 像素头像到令人惊叹的艺术品（在我看来，相当丑）。从核心上说，`NFTs` 是一种为虚拟对象授予所有权的去中心化系统。`NFTs`\
  \ 使用 `bitcoin` 和合约将所有权授予给特定用户，而任何人都可以下载快照并声称其为自己。\n\n这为元宇宙带来了全新的经济高度，将这一奇幻概念变成了人们赚取（或失去）现实世界资金的方式。用户可以使用加密货币购买虚拟土地、化身，甚至为他们的元宇宙化身买一顶帽子。\n\
  \n非同质化代币概念、加密艺术、电路板上的 NFT 霓虹灯牌图片\n\n非同质化代币并不依赖于元宇宙，但它们在某些宇宙的经济中确实发挥着作用，例如仍在建设中的\
  \ `Decentraland` 和 `The Sandbox`。\n\n`The Sandbox` 销售 `NFTs`，赋予客户对某块土地完全的所有权。用户可以导航到该可视化界面并与那里的数据进行交互。简单查看\
  \ `The Sandbox` 的地图发现，这种形式的 `NFT` 吸引了数十家对探索新广告领域感兴趣的公司关注，而不仅仅是 `bitcoin` 粉丝。\n\n\
  几家知名公司和连锁品牌已经在正式开放之前在 `The Sandbox` 中购买了土地。在 `Atari`、`行尸走`、`过山车大王`、`小羊肖肖` 甚至《南华早报》中都能找到大片土地。\n\
  \n尽管没有人会指责这群公司对 `NFTs` 或元宇宙特别感兴趣，但这个概念是有价值的。一些公司正在努力利用它。\n\n很难不在这 `bitcoin` 市场与某些最流行的元宇宙的互动方式以及现实世界经济的运作之间找到联系。最终结果可能是巨大的，也可能是可怕的，取决于你站在围栏的哪一边。\n\
  \n# 元宇宙的未来\n\n没有人能否认元宇宙的概念已开始延伸到此前未发现的领域。从`第二世界`、`Habbo Hotel` 甚至早已消失、被遗忘的`企鹅俱乐部`等游戏的卑微起源，我们已经走了很远的路。\n\
  \n根据 `Zuckerberg` 的说法，`meta` 旨在通过 `Horizon Worlds` 一步就顺，尽管他也意识到我们还没有到达那里。元宇宙渗透到我们的现实中，并像\
  \ `Meta` 所希望的那样广为人知且易于获取，还需要多年时间。\n\n元宇宙共享现实的想法——即来自不同大陆的个人可以一起玩、学习、交流甚至共同工作——是未来感且乌托邦的。在元宇宙中，拥有商店、公园和人的繁华街道都可以被复制，但实现这些点的技术对于普通个人来说仍然遥不可及。\n\
  \n元宇宙体验的现实是向广泛接受的又一步。在元宇宙中加入虚拟现实和增强现实，无疑会让体验感觉比使用键盘和鼠标时真实得多。\n\n```\n一张在 Fortnite\
  \ 中 Travis Scott 演唱会的截图。\n```\n\n我们已经看到了一些推向元宇宙边界的有趣跨界合作。`Travis Scott` 在 `Fortnite`\
  \ 中举办了一场虚拟演唱会，吸引了超过 1200 万名玩家。`Justin Bieber` 刚刚表示他也打算这样做。`NFTs` 的活跃支持者 `Snoop Dogg`\
  \ 在 `The Sandbox` 中拥有土地，并允许游客购买 VIP 许可在未来查看他的家，即使它现在还没有开放。\n\n`Zuckerberg` 认为元宇宙是互联网的未来，甚至将其称为移动互联网的“继任者”。这是否正确还有待观察。\n\
  \n有一点是可以肯定的：元宇宙不再是一个奇幻的概念。`Facebook/Meta` 仅仅是火上浇油，在几年后，我们可能会以以前从未想象过的方式看到元宇宙。\n\n\
  # 还有谁有能力创建元宇宙？\n\n尽管元宇宙可以取代 `Internet` 作为计算平台，但它可能遵循从 `PC` 到 `mobile` 的相同路径。非同质化代币并不依赖于元宇宙，但它们在某些宇宙的经济中确实发挥着作用，例如仍在建设中的\
  \ `Decentraland` 和 `The Sandbox`。\n\n`The Sandbox` 销售 `NFTs`，赋予客户对某块土地完全的所有权。用户可以导航到该可视化界面并与那里的数据进行交互。简单查看\
  \ `The Sandbox` 的地图发现，这种形式的 `NFT` 吸引了数十家对探索新广告领域感兴趣的公司关注，而不仅仅是 `bitcoin` 粉丝。\n\n\
  几家知名公司和连锁品牌已经在正式开放之前在 `The Sandbox` 中购买了土地。在 `Atari`、`行尸走`、`过山车大王`、`小羊肖肖` 甚至《南华早报》中都能找到大片土地。\n\
  \n尽管没有人会指责这群公司对 `NFTs` 或元宇宙特别感兴趣，但这个概念是有价值的。一些公司正在努力利用它。\n\n微软是这一点的绝说明。该公司通过 `Office\
  \ 365` 和 `LinkedIn` 拥有数亿联邦用户身份，是全球第二大云供应商，拥有跨越所有系统/平台的广泛工作软件和服务，并通过 `Minecraft`、`Xbox`\
  \ 和 `HoloLens` 拥有一套网关体验。为此，元宇宙给了微软一个机会，去夺回在 `PC` 到 `mobile` 过程中丢失的 OS/硬件领先地位。但重要的是，微软\
  \ CEO `Satya Nadella` 理解在工作所在之处出现的重要性。微软成功地从`业务`转型到`消费者`，从`线下`转型到`在线`，同时在“工作”经济中保持着强大的角色。因此，很难想象微软不会成为劳动和信息处理虚拟未来的重要动力。\n\
  \n尽管 `Facebook` CEO `Mark Zuckerberg` 没有明确宣布他想创建并控制元宇宙，但他对它的兴趣显而易见。相比于任何其他公司，`Facebook`\
  \ 从元宇宙中损失最多，因为它将开发出一个全新的计算和交互平台以及一个更大更强大的社交网络。同时，元宇宙允许 `Facebook` 在堆栈的向上和向下扩大其影响力。\n\
  \n`Facebook` 的元宇宙收益是巨大的。它拥有世界上任何平台最高的日用户数、日使用量和用户生成内容，次高的数字广告支出比例、数十亿资金、数千名世界级工程师，以及一个拥有多数表决权的创始人。它的元宇宙资产也在快速演变，半导体专利和脑机接口现在也包含其中。遗憾的是，另一方面，`Facebook`\
  \ 作为允许第三方开发者/公司构建长期企业的平台记录、作为财团的领袖（例如 `Libra`）以及在管理用户数据/信任方面的记录却是糟糕的。\n\n\n\n\n\
  亚马逊在许多方面都令人着迷。它，它渴望成为我们购买“东西”的首选场所。无论通过游戏引擎、虚拟环境还是网页浏览器购买，都没有区别（它已经在 Twitch 内部销售产品）。此外，该公司已拥有数亿信用卡用户，拥有全球（除中国外）最大的电子商务市场份额，是全球最大的云服务供应商，运营着多种消费媒体体验（视频、音乐、电子书、有声书、游戏直播等）以及第三方商业平台（例如\
  \ `Fulfilled by Amazon`、`Amazon Channels`），并致力于开发他们希望的首个专为云构建的大型游戏/渲染引擎。\n\n更重要的是，公司的创始人兼首席执行官杰夫·贝索斯（Jeff\
  \ Bezos）是基础设施建设的坚定信者。例如，`AWS` 驱动着互联网（`Amazon Web Services`）。亚马逊并不直接买卖库存，而是销售、包装和分发其他公司提供的产品，其中“亚马逊配送”占据了亚马逊收入的\
  \ 80%（大多数零售商也是如此）。尽管埃隆·马斯克的私人火箭公司 `SpaceX` 目标是殖民火星，但贝索斯表示，他`蓝色起源`（Blue Origin）的目标是“在轨道上建立巨型芯片工厂，并将小碎片送回”，这类似于早期的网络协议和他的\
  \ `AWS`。因此，亚马逊比任何其他 FAAMG 公司更有可能拥抱完全“开放”的元宇宙——因为它不需要控制用户体验（UX）或身份识别（ID），因为它从后端基础设施使用和数字交易的巨大增长中受益。\n\
  \n互联网是数据的金矿，而元宇宙将比现有网络拥有更多的数据和潜在更高的收益。在全球范围内利用这些数据方面，没有人比谷歌做得更好了。此外，该公司不仅是数字和物理世界索引的行业领导者（近\
  \ 10,000 名员工参与制图工作），还是中国以外最成功的数字软件和服务公司。它还运行着全球最流行的操作系统（`Android`）以及主流消费计算平台中最开放的平台（`Windows`）。尽管遭遇了失败，谷歌也是第一个通过\
  \ `Google Glass` 全力投入可穿戴计算的公司。现在，它正通过 `Google Assistant`、其 `Nest` 产品系列以及 `FitBit`\
  \ 大力推动家居数字化。因此，元宇宙可能是唯一能够将谷歌迄今为止的所有投资整合在一起的项目，包括 `Stadia` 边缘计算、`Project Fi`、谷歌街景、海量暗光纤购买、可穿戴设备、虚拟助手等。\n\
  \n# 我们齐集广益\n\n它不太可能控制或驱动底层的元宇宙。诚然，它拥有世界第二大计算机平台（到目前为止价值最高），以及全球最大的视频游戏零售商（这意味着它支付给开发者的费用比地球上任何其他地方都多）。此外，该公司正在大力投资增强现实设备和将辅助元宇宙的“连接组织”（例如：信标、Apple\
  \ Watch、Apple AirPods）。苹果的商业模式与构建一个开放的创新平台是不兼容的，在那种平台中，任何人都都可以访问全范围的用户数据和设备 API。与其作为运营者/驱动者，苹果更有可能成为西方世界与元宇宙之间的主要通信模式。这就像互联网一样，几乎肯定会让所有人受益。\n\
  \n如果元宇宙需要资产、体验和共享 API 的广泛相互作用，`Unity` 将至关重要。该引擎被用于一半以上的移动游戏。在现实世界的渲染/模拟用例中（建筑、设计和工程），它甚至比\
  \ `Unreal` 更受欢迎。例如，当电影人在 `Unity` 中制作和拍摄写实风格的《狮子王》时，电影人乔·法布罗（Jon Favreau）也在 `Unreal`\
  \ 中制作和拍摄迪士尼的《曼达洛人》。它还控制全球最大的数字广告网络之一（这是驱动每日 100 亿分钟移动娱乐的良好副作用）。\n\n另一方面，`unity`\
  \ 在推动元宇宙发展方面的作用尚不可知。它没有商店，没有登录系统，也没有真正的直接面向消费者体验。它的大多数辅助服务（非引擎或广告）很少被使用。此外，与其元宇宙网关，大多数（但不是所有）`Unity`\
  \ 驱动的游戏仅仅是移动游戏。考虑到它对规范、游戏时间和内容生产不可不可避免的影响，很难想象它不会被收购并合并到一个拥有更多资产和福利的大型科技业务中。\n\n\
  过去证明购买 `Unity` 的理由非常困难。尽管这家公司价值很高，但任何潜在的收购者都必须保持 `Unity` 完全的平台中立，以维护市场主地位、开发者支持和影响力（例如，谷歌不能让\
  \ `Unity` 成为 `Android/Chrome`专用或在其平台上最佳，否则会疏远大量开发者）。这意味着将 `Unity` 变为专有引擎并不是一个明智的商业决策。由于这种决策而损失的价值以及购买\
  \ `Unity` 的额外成本可能会使这种行动变得无法负担。另一方面，收购 `Unity` 的目标是在新互联网上获得关键位置，买方将有动力保持引擎的跨平台开放和可用，价格很快就会变得无关紧要。\n\
  \n如果 `Epic` 这样做，`Valve` 必须有通往元宇宙的可行途径。`Valve` 的 Steam 在用户、金钱和游戏时间上主于 `Epic Games\
  \ Store`。此外，它拥有市场上最受欢迎和运行时间最长的几款多人游戏（《反恐精英》、《要垒保卫战》、《Dota 争霸》）。此外，该公司在内容和变现创新方面拥有良好的记录（它是第一个大规模尝试\
  \ `AAA` 免费游玩游戏和玩家对玩家市场的公司）。`Valve` 还花费了多年创建和部署虚拟现实技术，它由一群热衷于开源技术并厌恶闭源设置的充满激情的程序员私有，并且每年产生数十亿美元的收益。另一方面，`Valve`\
  \ 的 `Source` 引擎很少被采用。与 `Epic` 不同，它似乎并没有致力于整合其能力和资产来开发元宇宙。\n\n# 为什么全息在元宇宙中起着作用？\n\
  \n当互联网首次引入时，它伴随着一系列技术成就，包括跨距离连接计算机的能力以及将一个网页链接到另一个网页的能力。这些技术特征为我们现在与互联网联系的抽象结构提供了基础，例如网页、应用、社交网络以及其他依赖于它们的一切内容。这还没有考虑到非互联网界面创新的融合，如显示器、键盘、鼠标和触摸屏，这些仍然是互联网运行所必不可的。\n\
  \n随着元宇宙的出现，有一些新的构建模块，例如在单个服务器实例中托管数百人的能力（元宇宙未来的版本应该能够处理成千上万甚至百万），以及能够区分手位置的动作追踪工具。这些新技术具有极具引入胜和未来感的潜力。\n\
  \n\n\n然而，存在一些可能被证明无法实现的局限性。微软和 Meta 等公司展示了未来概念的虚构视频，他们经常忽略了人们将如何与元宇宙交互。VR 头戴设备仍然很笨重，而且长时间佩戴它们会导致大多数人产生晕动症或身体疼痛。除了解决如何在公共场合佩戴增强现实眼镜而不让自己看起来像个“大白痴”这一不容忽视的障碍外，增强现实眼镜还有另一个问题。\n\
  \n那么，IT 公司如何在不展示笨重设备和奇特眼镜的情况下，演示他们技术的概念呢？到目前为止，看来他们主要的选择是从零开始开发技术。那是出现在 Meta 演讲中的那个全息女性吗？我很抱歉要告诉你一个坏消息，即使使用现有技术最先进的版本，这简单是不可能的。\n\
  \n与动作捕捉的数字化身不同（后者目前看起来还有些生涩，但明天可能会变得更好），在没有精确控制环境的情况下，并没有什么“生涩”的方法可以让三维图像出现在半空中。无论《钢铁侠》中的言论是怎样的描述的。也许这些图像应该被视为通过眼镜投影的影像——毕竟，演示视频中的两个女性都戴着眼镜——但这种假设对小型眼镜的物理能力要求很高，而\
  \ `Snap` 已经证实这是一个难以解决的挑战。\n\n这种对现实的欺骗在关于元宇宙如何运作的电影演示中非常普遍。这个人是戴着虚拟现实眼镜还是仅仅坐在桌子前？这个人是固定在沉浸式空中支架上还是仅仅坐在桌子前？Meta\
  \ 的另一个演示展示了个人在空间中悬浮——这些人是被固定在沉浸式空中支架上还是只是坐在桌子前？全息主体戴着头戴设备吗？如果是，他们的脸是如何被扫描的？一个人可能在拿虚拟物品，但在其他时候将它们握在看起来是真实的手中。\n\
  \n这次演示引发的问题比它回答的问题多得多。\n\n在某些方面，这是可以接受的。微软、Meta 以及其他进行此类奇特演示的公司都在试图传达一种对未来可能样子的艺术感，而不是解决每一个技术挑战。这是一项长期传统，可以追溯到\
  \ AT&T 展示语音控制的折叠手机，这种手机可以魔术般删除照片中的人物并创建 3D 模型，所有这些在当时看来都是不可能的。\n\n另一方面，这种“愿望式技术演示”的形式让我们处于这样一种境地：很难预测多样化的元宇宙想法中哪些方面有一天会变成现实。例如，一个你的朋友是机器人和悬浮在空间中的全息虚拟扑克游戏，如果虚拟现实和增强现实头戴设备变得足够舒适且足以让人们每天佩戴——这是一个巨大的“如果”——那么它就可能变成现实。如果没有，你始终可以通过\
  \ `Discord` 视频会议玩 `Tabletop Simulator`。\n\nVR 和 AR 的华丽和光鲜也掩盖了元宇宙更平庸的方面，而这些方面更有可能实现。例如，软件公司创建一个开放的数字化身标准将轻而易举，一种包含你在角色创建器中输入的特征的文件——如眼睛颜色、发型或衣橱选择——并允许你随身去任何地方都带着它。为了这一点，不需要制造更舒适的\
  \ VR 头戴设备。\n\n# 第二章：理解增强现实及其工作原理。\n\n今天是计算机中介、技术增强生活的时代。人们不仅想生活在物理世界；他们想要技术进步允许他们拥有的更深层次的体验。这些突破之一是增强现实（AR），这项技术允许个人与名人共舞、旅行到遥远的地方、访问其他行星，甚至回到过去——这一切都可以在舒适的家中完成。如果你想拥抱技术变化并了解更多关于增强现实的知识，请继续阅读了解它以及如何运作。\n\
  \n## 什么是增强现实，它是如何工作的？\n\n那么，增强现实到底是什么？因为人类体验从根本上不同于它的技术概念，因此很难定义增强现实。但在最广泛的定义中，AR\
  \ 技术被定义为由计算机生成的视觉或音频增强的物理环境。\n\n## 增强现实的简史\n\n在 1901 年，当鲍姆的小说《魔法钥匙》出版时，出现了虚拟现实的概念。在\
  \ 1974 年，Caudell 和 Mizell 创立了第一个增强现实实验室。1990 年，Martin 记录了增强现实的眼镜。1994 年，Julie Martin\
  \ 引入了第一个工作的 AR 设备，它被称为《在赛博空间跳舞》。\n\nAR 在 21 世纪进展迅速。例如，2000 年，藤浩启动了 `ARToolKit`，一个开源\
  \ AR 库。九年后，`ARToolKit` 无缝集成到网络浏览器中。2013 年，谷歌发布了“谷歌眼镜”项目，2016 年，增强现实游戏《宝可梦》统治了世界。2017\
  \ 年是以眼球追踪增强现实技术的引入为标志的。自 2018 年以来，已有千多个具有增强现实能力的应用程序发布在 Google 和 Apple 应用商店。\n\n\
  ## 增强现实与虚拟现实有什么区别？\n\n虚拟现实（VR）是一种让用户沉浸在合成环境中并脱离现实世界的技术，通常与增强现实混淆。AR 和 VR 的区别在于前者增强现实，而后者取代现实。AR\
  \ 将计算机生成的数字信息（例如视频、声音或动画）叠加在实时环境中以此进行补充。\n\n考虑许多 VR 和 AR 设备示例以更好地理解增强现实技术。\n\n###\
  \ AR 应用包括：\n\n-   可以使用宜家的增强现实应用为他们的空间寻找合适的产品。他们可以使用手机摄像头环顾房间。他们可以通过滑动和点击立即查看宜家家具是否与他们的公寓匹配。\n\
  -   Gap 最近推出了 AR 增强型试衣间，让客户可以试穿各种商品，而无需带着行李穿过整个商店。\n-   慕尼黑黑发布了一款增强现实应用，让粉丝可以与他们的英雄合影，而无需前往慕尼黑接触球星。\n\
  -   得益于路虎的增强现实软件，驾驶员可以通过透明引擎盖看到汽车。\n\n### 虚拟现实示例包括：\n\n-   万豪酒店的虚拟现实“传输者”软件允许住客游览全球范围内的酒店。该软件非常真实，可能会提供真实的旅行体验。\n\
  -   SportX 的虚拟现实模拟器允许客户在各种模拟活动（如跑步、游泳或网球）中试穿他们出售的运动装。\n-   在手术期间，`HoloTeach VR`\
  \ 应用允许外科医生进行实时交流和咨询，即使他们相隔数千万里。\n\n\n\nAR 是一种交互式现实，它将视频、声音或图形/动画等计算机生成的组件整合到真实世界中，为用户提供更具沉浸感的体验。\n\
  \n![](img/image00721.jpeg)\n\n# 增强现实的类型\n\n由于近期 IT 领域的突破，现代增强技术以多种形式出现。以下是目前企业和消费者使用的最常见的增强现实类型的简要介绍。\n\
  \n### 带标记的 AR (AR with markers)\n\n在 AR 开发初期，标记（一个粗黑正方形边框）被用作参考物，以测量计算机与物体之间的距离。换句话说，基于标记的\
  \ AR 应用依赖于读取器（通常是摄像头）来解释图像并在虚拟环境中生成 3D 对象。\n\n### 无标记 AR (Markerless AR)\n\n尽管基于标记的\
  \ AR 具有明显的优势，但粗黑色标记的视觉外观并不美观，限制了市场对此类解决方案的采用。无标记 AR 的创建主要为了商业用途，以解决上一代方案的缺点。这种 AR\
  \ 类型使用普通图像作为标记，通过 `SIFT`、`SURF` 和 `FAST-SURF` 等图像提取技术提供。大多数无无标记 AR 系统使用鲁棒点匹配方法来处理由离群值、大量遮挡和其他因素引起的鲁棒性问题。你可以用它检测并映射现实周围环境，并在其中放置虚拟物品。从桌子上跳舞的动画生物到放置在家中的\
  \ IKEA 沙发，任何东西都是无标记 AR 的例子。\n\n### 基于投影的 AR (Projection-based AR)\n\n正如其名所示，基于投影的\
  \ AR 版本（即投射式 AR）使用视频投影机在屏幕或各种物理表面上显示图像。利用现实物体投影虚拟图像是这类 AR 品的核心。它通常用于产品可视化和工业组装。然而，由于反射、颜色和几何形状差异，便携式投影\
  \ AR 在不同奇形形状表面上的投影质量受到限制。\n\n### 基于叠加的 AR (Superimposition-based AR)\n\n这种增强现实假设对实物的图形修改直接叠加在实体（或其完全复制的图像）上，从而产生真实对象的增强视图。在基于叠加的\
  \ AR 执行中，技术识别物体的能力至关重要，因为无法识别物体将导致图像无法被增强视图。患者的实时医疗评估是这种增强现实的一个良好示例。例如，某些医疗机构提供\
  \ X 射设备的实时反馈，以便 X 射结果可以叠加在患者身体的实际图像上。\n\n## 什么是增强现实？它是如何工作的？\n\nAR 应用不再仅仅是为了娱乐。这项技术在广泛的商业、科学和研究领域都有应用。以下是关于构建沉浸式增强现实体验所使用的流程和工具的细节。\n\
  \n## 摄像头和传感器\n\n任何 AR 元素的构建都需要精确捕捉现实世界物体，以便在显示器上对它们进行真实的增强。AR 程序使用多种传感器来实现这些目标，包括机械、生物学、声学、光学和环境传感器。\n\
  \n机械传感器记录物体的位置、形状、加速度、质量和位移。最常见的应用之一是确定物体的位置、重量和移动。\n\n生物传感器测量物体的心率、温度、神经活动和呼吸频率。它们可以识别情绪并评估人的心理和生理状态。\n\
  \n声学传感器提供精确的声音响度、音调、频率、相位和调制，这对于声音检测和语音识别非常有用。\n\n光学传感器报告物体的发射率、折射率、光波频率、亮度和光，用于计算机视觉检测、存在检测和红外（IR）运动分析。\n\
  \n环境传感器收集周围区域的温度和湿度信息。\n\n深度感知摄像头——可以收集 3D 图像的摄像头——是创建引人注 AR 体验的重要工具之一。传统上，AR 设备至少配备一个摄像头，有些带有两个用于深度感知。在设备中包含红外摄像头也是常见的，以实现先进的深度感知和热映射。\n\
  \n## 投影 (Projection)\n\n投影是一种增强现实技术，允许用户在不佩戴或携带设备的情况下增强现实世界物体。这意味着使用可编程的投影摄像头系统，利用空间\
  \ AR 工具直接在物体上显示增强现实功能。投影 AR 系统是尖端增强现实技术，因为提供了完全不受限的 AR 体验，允许用户通过在环境中显示增强现实功能随时享受投影。\n\
  \n## 处理 (Processing)\n\n处理 AR 的能力主要归于先进的图像和音频处理技术。任何 AR 产品依赖图像处理来准确理解环境、估计光照并确定关键特征点和平面。\n\
  \n## 反射 (Reflection)\n\nAR 技术的主要目的是通过将虚拟物品整合到现实环境中创建写实的视觉效果。当开发者采用高级建模时，就可以实现真实的视觉效果。例如，虚拟反射是一种在虚拟物体上模拟现实世界物体的\
  \ AR 技术。\n\n# 增强现实支持哪些类型的设备？\n\n在学习了现实运作的基本原理后，你可能想了解更多关于创建它的设备。\n\n### 手机\n\n尽管几十年前\
  \ AR 只能在配备了许多专业设备的房间里体验，但如今的手机应用提供了真实的 AR 体验。AR 现在已适用于 iOS 和 Android 设备。世界著名的游戏\
  \ `Pokemon Go` 以及 `BBC Civilizations AR`、`Froggipedia` 应用和 `SketchAR` 都是热门程序。即时通讯和社交媒体平台也允许我们尝试\
  \ AR 的潜力（例如 `Hololens`、Snapchat 过滤器等）。\n\n### AR 设备\n\n虽然移动技术正在快速发展为世界带来新发现，但更真实、更先进、更专业的\
  \ AR 仍然通过使用专用 AR 设备（如可穿戴智能眼镜、头戴设备、数字指南针、陀螺仪、CPU、GPS 和显示器）来实现。抬头显示（HUD）是获得完全沉浸式 AR\
  \ 体验是最常见的特殊设备。\n\n### AR 眼镜\n\n智能眼镜也日益流行，`Google Glasses` 和 `Laster SeeThru` 等制造商受到了广泛关注。增强镜片也被组合到轻量级\
  \ AR 眼镜中，例如 `AV Walker`。\n\n### AR 隐形眼镜\n\n将增强现实技术结合眼镜眼镜是科技领域的一个新趋势。\n\n华盛顿大学启动了一项名为\
  \ `Twinkle in the Eye` 的突破性项目，旨在开发可以显示文本、将语音转换为字幕并实时提供导航系统视觉指示的 AR 镜片。\n\n\n\n\n\
  \n人机交互实验室（Human Interface Technology Laboratory）创建了第一个（HIT Lab）。VRD 的图像合成过程依赖于低功率激光扫描和直接在人类视网膜上的图像复制。因此，VRD\
  \ 能够创建高分辨率、高对比度的视觉效果，并将其叠加在用户看到的任何内容之上。\n\n## 增强现实的控制方式是什么？\n\n目前，开发者已经构建了可以管理 AR\
  \ 应用功能的特性。例如，用户决定如何操作、遵循何种场景以及游戏何时结束。另一方面，新的 AR 应用预计将由人类大脑进行控制。虽然现在可能很难想象，但这种控制在未来几年内无疑是可实现的。像\
  \ Neurable 这样的初创公司正在迈出初步步骤，允许用户使用“脑鼠”来导航 VR 和 AR 应用。\n\n## 增强现实在未来的重要性\n\n随着技术以前所未有的速度进步，我们应该期待\
  \ AR 将迅速发展，为全球用户带来全新的体验。那么，对于那些使用增强现实的人来说，未来将如何？\n\n- 增强现实眼镜。虽然 AR 镜片原型目前已在使用，但主流市场的普及仍有很一段路。然而，预计很快就会带有数百个\
  \ LED 在人眼前形成图像的无线镜片。这些视觉效果中可能包含文字、图表、照片、活动指令以及有趣的 AR 组件。\n- 仿生眼。这是一组仿生眼。随着仿生学和生物工程学的快速发展，人类可以期待在该领域引入\
  \ AR 技术。例如，仿生眼可以帮助盲人或视力虚弱者恢复视觉。\n\n如你所见，增强现实是一个极具前景的技术领域，它在提供改进视觉体验的同时，还在改变人们学习、导航、接受治疗和交流的方式。AR\
  \ 设备正变得越来越复杂、对用户友好且轻量化，将 AR 体验带给普通消费者，让他们能够在一个房间里享受乐趣、学习新知识、旅行到远方并遇到来自世界各地的人。\n\n\
  # 第 3 章：NFT 在元宇宙中的作用\n\nNFT 正在通过其快速扩展的用例，开启数字世界的新纪元——元宇宙。Facebook 推出 Meta 标志着向元宇宙时代的转变，其中基于\
  \ NFT 的增强体验可能会成为下一代社交网络的支柱，这最能典型地说明了元宇宙在世界舞台上的到来。\n\nNFT 和元宇宙已经交织在一起，特别是在区块链游戏和其他可互操作的游戏中，它们作为大规模数字社交媒体的价值载体。尽管\
  \ NFT 游戏是一个相对较新的概念，但它非常受欢迎，`Binance NFT` 的初始游戏发行（IGO）就证明了这一点。这个新的游戏部门赢得了玩家和加密消费者的积极反馈，使其在短短两周内交易额就超过了\
  \ 1600 万美元，所有的 IGO NFT 集合均已售罄。\n\n## 什么是元宇宙？它是如何工作的？\n\n元宇宙是一个基于区块链技术的数字生态系统。视觉组件由\
  \ VR 和 AR 等技术提供，而去中心化的媒体则允许无尽的社交互动和商业前景。这些环境具有扩展性、可互操作性和适应性，它们在个人和组织层面为成员结合了新的技术和交互模式。\n\
  \n通信、货币、游戏世界、个人资料、NFT 以及其他过程和元素都是元宇宙的一部分，元宇宙是数字 3D 宇宙。元宇宙的承诺归功于它提供的自由；元宇宙中的任何人都可以构建、购买和查看\
  \ NFT 以积聚虚拟土地、加入社交社区、构建虚拟身份以及玩游戏等。这种多样化的用例为现实世界和数字资产的变现开启了许多可能性，企业和个人都能整合到元宇宙框架中。\n\
  \n未来的元宇宙将把不同的在线世界汇聚，NFT 则允许跨链交互。\n\n## NFT 将对元宇宙产生什么影响？\n\nNFT 可以打破元宇宙中用户接触、社交和交易的传统社交网络范式。了解\
  \ NFT 如何在数字世界引发动荡。\n\n### 一个开放公平的经济体系\n\n用户和企业现在可以将现实世界的资产和服务转移到元宇宙（一个去中心化的虚拟环境）。使用具有可互操作区块链游戏的新型游戏模型是将更多现实资产引入元宇宙的方法之一。\n\
  \n其中一种选择是边玩边赚（play-to-earn）游戏概念，它参与并赋能区块链游戏玩家。玩家可以参与元宇宙中的游戏内经济，并根据 NFT 为他们提供的价值获得激励，基本上是边玩边赚钱。在元宇宙中，边玩边赚游戏也是公平的，因为参与者保留了资产的所有权，而不是像大多数传统游戏那样属于单一游戏实体。\n\
  \n假设你对参与这些游戏内金融经济感兴趣。如果是，`Binance NFT` 的 IGO 提供了来自游戏项目的游戏内资产选择，玩家可以收集并将其整合到各种游戏环境中。此类游戏内\
  \ NFT 需求量，正如 IGO 首次秀所示，所有 NFT 在第一天就售罄了。`My Neighbor Alice (Alice)`、`Axie Infinite\
  \ (AXS)` 以及许多其他都是成功的边玩边赚游戏的例子。\n\n边玩边赚公会也将促进边玩边赚游戏普及的增长。公会作为中介运营，购买游戏内 NFT 资源（如土地和资产），然后将其租给想要使用它们在虚拟世界中获得回报的玩家。收益随后分配给边玩边赚公会。\n\
  \n这促进了开放公平的经济，允许没有足够资金参加公会的玩家获得领先机会。此外，公会降低了所有玩家进入边玩边赚游戏的门槛，确保每个人都有公平参与元宇宙经济的机会。总之，公会通过让所有人都能获得\
  \ NFT 资源，帮助在元宇宙中开启虚拟经济。\n\n`Yield Guild Games (YGG)` 就是这样一个例子。他们创建了一个全球元宇宙参与者社区，这些成员通过贡献虚拟世界来换取内奖励，并通过租赁或出售\
  \ YGG 拥有的资产来产生现金。\n\n由于用户可以在 `Binance NFT` 等 NFT 平台上交换他们的 NFT 资产（如游戏内资产和数字房地产），世界内资产可以拥有现实价值。游戏内提供的\
  \ NFT 的经济价值取决于它们在各种元宇宙模块中的应用。这允许用户创建他们想要的任何形式的内容，例如吸引广泛观众的热门资产、原创数字艺术品，或在游戏中赋予某些技能和外貌的特殊\
  \ NFT。\n\n元宇宙在区块链不可篡改性和透明度的支持下，实现了开放公平的经济。此外，价格由供需需规律决定，这种规律基于稀缺性和 NFT 根据其适用性的链上价值，消除了操纵和人为价值通胀的可能性。\n\
  \n\n\n币安作为元宇宙经济运行的辅助方式，以 `NFT` 游戏空投为典型。每周举办的 `IGO` 发布提供来自游戏项目的关键游戏内资产，让玩家在 `NFT`\
  \ 游戏行业中占据先机。此外，独一无二的 `Mystery Boxes` 也会掉落各种用于边玩边赚（play-to-win）游戏的价值物品。\n\n`Binance\
  \ NFT` 二级市场允许用户发现并交易游戏内 `NFT` 。此外，为了帮助 `NFT` 新手，`Binance NFT` 在首页和排行榜上为 `NFT` 集合和创作者策划每日建议，以推广顶部的\
  \ `NFT` 销售额、收藏和生产者。\n\n## 身份、社区与社交体验的扩展\n\n`NFTs` 在元宇宙的身份、社区和社交互动中也将发挥关键作用。例如，用户可以通过持有特定的\
  \ `NFT` 资产来表达对某个项目的支持或对虚拟与现实世界的想法。这让拥有相似 `NFT` 的人们形成社区，分享经验并共同创作素材。热门 `NFT` 头像就是此类\
  \ `NFT` 的一个例子。\n\n玩家的真实或想象自我由其 `NFT` 头像代表。`NFT` 头像可以作为访问令牌，进入并在元宇宙的不同部分之间跳转。在这种情况下，`NFT`\
  \ 头像充了我们现实身份的延伸，允许我们以完全控制和独立的方式在元宇宙中策划和创建虚拟身份。\n\n头像 `NFTs` 为各种独特的元宇宙和物理世界活动提供虚拟会员，促进了社区和社交互动。通过内容创作和公司发布，`NFT`\
  \ 头像已经在定义元宇宙的体验和环境。\n\n例如，`Bored Ape Yacht Club` 和 `CryptoPunks` 集合分别为其持有者提供了专属权利以及进入富裕人封闭小组的机会，这些小组包含受保护的内容甚至是线下独家活动。此外，通过需要\
  \ `NFT` 相关入场费的专属派对，凸显了 `NFT` 作为连接数字与物理世界价值载的功能。\n\n寻找并获取 `NFT` 头像，请访问 `Binance NFT\
  \ Marketplace`，那里有广泛廉价的 `NFT` 头像选择。\n\n## 虚拟房地产：物业所有权\n\n用户可以通过 `NFT` 对其在元宇宙中的虚拟土地和空间拥有完全控制权。得益于底层区块链，用户还可以证明物品的所有权，并根据自己的意愿建造虚拟房地产。\n\
  \n元宇宙中虚拟房地产的一些用途包括：出售物业获利、租赁土地获得被动收入、在现有土地上创建在线商店等各种结构，以及举办社交聚会。\n\n`Decentraland`\
  \ 最近与 `Adidas` 合作举办了一场虚拟时尚展，其中作品作为 `NFTs` 进行了拍卖，这就是元宇宙数字房地产场景的一个例子。音乐家对虚拟房地产特别感兴趣，因为他们可以在网上播放并销售\
  \ `NFT` 票和产品。\n\n## 未来的元宇宙\n\n元宇宙虽然仍处于婴儿阶段，但通过使用 `NFTs`，提供了大量的潜在社交和金融前景，也为人们提供了游戏、参与、聚集、赚取和交易的新方式。\n\
  \n元宇宙和 `NFT` 区块链游戏将成为 `3.0` 的重要组成部分，因为我们认为 `NFT` 所有权对元宇宙至关重要。对 `NFT` 感兴趣的用户可以使用\
  \ `Binance NFT` 来探索元宇宙。\n\n# 第 4 章\n\n# WEB 3.0\n\n如果你最近在阅读加密货币或视频游戏新闻——或者看到“价值数百美元的\
  \ `NFT`”——你可能遇到过 `Web3` 这个术语。这个名字指的是互联网的第三代。然而，它仅仅是交易 `NFT` 的人之间的术语吗？\n\n## Web3\
  \ 到底是什么？\n\n`Web3` 是基于公共区块链的可能未来的互联网版本，区块链是一种以加密货币最广为人知的记录系统。`Web3` 的吸引力在于它是去中心化的，这意味着消费者不再通过\
  \ `Google`、`Apple` 或 `Facebook` 等公司中介的服务访问互联网，而是由个人拥有并治理互联网的某些部分。此外，`web3` 不需要 `permission`（许可），这意味着中央机构不决定谁可以访问什么；不需要\
  \ `trust`（信任），即不需要中间介来允许两个或多个双方之间的虚拟交易。最后，由于这些机构和中间介执行了大部分数据收集，`Web3` 在技术上保护了用户隐私。\n\
  \n当然，虽然这是区块链工程师和支持者为未来设的 `Web3` 乌托邦愿景，但在实践中可能并不那么公平。例如，去中心化金融（通常被称为 `DeFi`）是 `Web3`\
  \ 中一个正在兴起的组件。它涉及在没有银行或政府帮助的情况下，在区块链上执行真实的财务交易。\n\n同时，许多大型公司和风险投资公司正向 `Web3` 投入资金，很难想象他们的参与不会导致某种形式的中心化权力。\n\
  \n## Web3 的前身是什么？\n\n`Web1` 和 `Web2`（有时被称为 `Web 2.0`）是早期互联网时代的术语。`Web1` 跨越了 20 90\
  \ 年代和 21 世纪初，当时互联网更具去中心化，开源协议更流行。静态页面（即你无法交互且不定期更新的网站）更为常见。`Web2` 指从 21 世纪初到现在的时期，科技巨头控制着最显著的在线枢纽。在银河规模的平台上出现用户生成内容（如\
  \ `YouTube` 视频或 `Facebook` 帖子）是这一时代的另一个标志。这些是驱动社交媒体的内容。互联网从被动消费变成了一个积极参与的地方。\n\n\
  但是，等等，`Web3` 不是加密货币相关的东西吗？\n\n\n\n\n\nNFT、数字货币和其他区块链实体将在 Web3 中被广泛使用。例如，Reddit 旨在通过创建一种使用加密货币令牌的方法，让用户对他们在网站参与的社区部分拥有控制权，从而进军\
  \ Web3 领域。根据这一设想，用户在特定的子版（subreddit）上发布帖子可以获得“社区积分”。然后，用户根据对特定帖子投赞成或反对的人数来获得积分。（这简单来说区块链版的\
  \ Reddit Karma 声值）。）这些积分本质上可以用作投票份额，让做出重大贡献的用户在影响社区的选择中拥有更大的话语权。此外，由于这些积分存储在区块链上，其所有者对其有更多的控制权；它们不会被轻易夺走，而且是可以被追踪的。公平地说，这只是一种应用，是对\
  \ Web3 概念——去中心化自治组织（或 `DAOs`）的一种企业解读，这些组织使用代币来划分所有权和决策权。例如，一个去中心化自治组织（`DAO`）是 Augur，一个去中心化的投注平台。NFT\
  \ 也是 Web3 的重要部分。它们本质上是独一无二的加密货币令牌，通常用作虚拟物品（如艺术品或篮球视频）的所有权证明。（这与比特币形成了对比，比特币可以与其他任何比特币交换。）根据\
  \ Web3 支持者的说法，NFT 代表的数字稀缺性将使这种新互联网的用户能够交换从游戏皮肤到医疗记录的一切东西。\n\n## 为什么 Web3 突然变得如此热度？\n\
  \n大部分热度似乎来自比特币社区，该社区将从一个更依赖其技术的互联网中获益。然而，一些热度也源于几家知名公司（如 Reddit），它们正采取措施，领先建立 Web3\
  \ 服务和平台。例如，根据 CoinDesk 的报道，GameStop 正在寻找一名“Web3 游戏负责人”以及用于某个未公开 NFT 平台的软件工程师。此外，还有很多讨论关于\
  \ Web3 如何通过让玩家更轻松地购买和交易游戏内物品，或获得赋予其对游戏治理更大控制权的代币，来改进视频游戏。然而，$The Verge$ 杂志推测，GameStop\
  \ 可能只是在招聘广告中使用了“Web3”和“区块链”等术语，以吸引其在 1 月份收到的类似的替代投资者支持。10 月初，一项最近的进展是风险投资公司 Andreessen\
  \ Horowitz 在华盛顿特区的 Web3 游说推动。根据该公司说法，对比特币和其他区块链技术投入大量资金的 Web3 已派遣高管前往国会山和白宫，将 Web3\
  \ 作为一个解决硅谷整合的解决方案，并为不断扩张的虚拟世界提出规则。\n\n## 围绕 Web3 的兴奋不是完全合理且克制的吗？\n\n10 月晚些，一位 28\
  \ 岁的艺术家分享了一个名为“Web3 时代的爱情”的迷包，描绘了一对卡通夫妇躺床上盯着比特币和以太坊的价格。这位艺术家将这个迷包变成一个 NFT，并在亿富翁埃隆·马斯克在\
  \ Twitter 上转发它并获得数十万点赞后，以近 2 万美元的价格售出。在其他进展中，一个目标是成为“Web3 街头乐队”的小组推出了附有卡通猴的 NFT。其中一只卡通猴最近在拍卖会上拍出了\
  \ 340 万美元。所以，回答这个问题，答案是否定的的。\n\n## Web3 在元宇宙中扮演什么角色？\n\n### 在技术领域，它非常流行\n\n我提到了我们的主持人没有接种疫苗的事实。结果是，我的\
  \ Airbnb 评价被删除了。\n\n### 为什么天文学家对即将发射的望远镜感到“大哭流涕”\n\n### 导致每个婴儿潮一代人眼睛发亮的过时物品\n\n\
  ### 从大气中抽真空碳的争议计划\n\n首先，元宇宙是一个未来的互联网，由三维虚拟现实区域组成，用户可以在那里相互互动。这就是为什么 Facebook 最近将自己更名为“Meta”的原因。根据一些技术人员的，Web3\
  \ 预计将刺激基于区块链技术和开放标准的元宇宙的创建，由全球计算机网络而不是少数巨头公司管理。如果使用 NFT 来允许虚拟现实交易，传统的守门人将无法控制什么可以和不能进入元宇宙。在\
  \ 10 月发布的一份公开声明中，Facebook 执行官马克·扎克伯格富有诗意地描述元宇宙将不会“由一家公司生产”，并将建立一个“比今天平台和政策所限制的范围得多的创意经济”。这一切听起来很美好，但考虑到\
  \ Facebook 为维持其在社交媒体领域的主导地位所付出的艰斗，它很可能在 Web3 的未来继续尝试保持其显赫地位。\n\n## Web 3.0 将释放哪些新业务模式？\n\
  \nWeb 3.0 将产生深远的影响，远超加密货币的最初用例。得益于现在可能的丰富交互和可用交易方的全球范围，Web 3.0 将通过加密技术将公司、人和机器的数据与高效的机器学习技术连接起来，导致根本性新市场和相关业务模式的出现。\n\
  \nWeb 3.0 未来的影响显而易见，但问题在于哪些商业模式可以打破代码并在当今经济中创造持久的价值。\n\n### 回顾 Web 1.0、2.0 和 3.0\
  \ 时代的商业模式\n\n我们将深入探讨 Web 3.0 已经以及将实现的原生商业模式，并简要回顾那些通往 Web 2.0 意想不到的成功模式的经常被遗忘的艰辛历程。\n\
  \n不要忘记 Google 从 1998 年到 2002 年在 2004 年上市之前的历程，这为 Web 2.0 意想不到的成功模式铺平了道路：\n\n* 尽管流量很高，他们在\
  \ 1999 年的业务计划上显得非常挣。“。“我们真的无法确定商业策略；当时情况看起来很糟糕，”迈克··莫里茨（Sequoia Capital）说道。\n* 2001\
  \ 年，Google 的收入为 8500 万，而 Overture 的收入为 2.8 亿，因为基于 CPM 的网络广告在泡沫破灭后衰落了。\n* 2002 年，Google\
  \ 推出了 `AdWords Select`，其自己的基于点击付费的拍卖搜索广告产品，基于 Overture 的广告策略。\n* 两年后的 2004 年，Google\
  \ 占了所有互联网搜索的 84.7%，并上市，估值 232 亿美元，年收入达 27 亿美元。\n\n在四年的挣扎之后，其业务计划的一个微小改变让 Google\
  \ 飞入了轨道，使其成为全球最有价值的机构之一。\n\n## 回顾 Web 2.0 商业模式内容\n\n早的在线内容形式仅由现有报纸和电话簿的数字化……尽管如此，《罗马》（由阿尔方索·库亚隆导演）这部通过\
  \ `Netflix` 订阅制流媒体服务发布的电影已获得了十项奥斯卡奖提名。\n\n### 市场平台\n\nAmazon 起于一家没人指望能盈利的在线书店……尽管如此，它已成为一个销售从园艺工具到健康食品以及云基础设施的巨型市场。\n\
  \n### 免费开源软件\n\n\n\n\n\n兴趣爱好者以及将软件视为公共利益资产的乌托邦式理念开启了开源软件的开发……尽管如此，现在整个互联网都运行在开源软件之上，每年产生\
  \ 4,000 亿美元的经济价值，且 `Github` 被 `Microsoft` 以 75 亿美元的价格收购。相比之下，`Red Hat` 通过 `Linux`\
  \ 服务每年产生 34 亿美元的收入。\n\n# SaaS\n在 Web 2.0 的早期阶段，商业软件能够通过浏览器交付并在经济上实现盈利这似乎是不可思议的……尽管如此，SaaS\
  \ 模型现在已为大多数 B2B 组织采用。\n\n# 共享经济\n很难想象有人会自愿进入别人的车里或将沙发借给陌生人……然而，尽管没有拥有任何汽车或房屋，`Uber`\
  \ 和 `AirBnB` 已经成为全球最大的出租和住宿公司。\n\n## 广告\n虽然 `Google` 和 `Facebook` 在早期发展迅速，但在其存在的上半部分，它们缺乏清晰的收入策略……尽管如此，广告模型似乎几乎完美契合它们。结果，它们现在占了全球数字广告收入的\
  \ 58%（2018 年为 1,110 亿美元），使其成为主性的 Web 2.0 经济模型。\n\n# 兴起的 Web 3.0 模式\n如果你回顾过去十年的 Web\
  \ 3.0，你会发现早期的业务模式并不总是可重复或扩展的，它们往往试图重建 Web 2.0 的概念。虽然对其可行性存在一些怀疑，但我们有信心，一些最聪明的构建者的持续实验将在未来几年创造出极具价值的模型。\n\
  \n我们希望通过研究现有的和实验性的 Web 3.0 模式，了解一些更成熟和具有实验性的 Web 3.0 模式在未来几年如何积累价值。\n\n* 原生资产的创建\n\
  * 维护原生资产并扩展网络：\n* 与投机相关的税（交易所）\n* 用于支付的代币\n* 代币应当被销毁\n* 用于工作的代币\n* 其他模型\n\n## 发行原生资产\n\
  发行原生资产涉及以下步骤：\n\n`Bitcoin` 是第一个加密货币。第一个拜占庭容错且完全开放的点对点网络是使用 `Proof of Work` 和 `Nakamoto\
  \ Consensus` 建立的。它的核心业务概念基于 `BTC`，这是一种可证明的稀缺数字代币，作为区块奖励发放给矿工。其他代币如 `Ethereum`、`Monero`\
  \ 和 `ZCash` 也效仿了此，分别发行了 `ETH`、`XMR` 和 `ZEC`。\n\n这些原生资产的价值来自于它们提供的安全性：通过为诚实的矿工提供足够的激励来提供算力，恶意者实施攻击的成本会随着原生资产的价格同步上涨，而增加的安全性又驱动了对该货币的需求，从而推高了其价格和价值。这些原生资产的价值已经过彻底的检查和衡量。\n\
  \n## 在扩展网络的同时维护原生资产：\n一些早期加密网络公司有一个单一目标：让他们的网络更有利、更丰厚。由此产生的业务模式可以总结为“增长他们的原生资产储备；构建生态系统”。例如，`Blockstream`\
  \ 作为最大的 `Bitcoin Core` 维护者之一，依靠其 `BTC` 资产负债表产生价值。同样，`ConsenSys` 已经发展到千名员工，通过为 `Ethereum`\
  \ 生态系统构建关键基础设施来提升其持有的 `ETH` 价值。\n\n虽然这种方法有效地将公司与网络联系起来，但在前几家公司之后，这种方法很难复制：过一段时间后，积累足够多的本地资产余额变得不再现实……如果没有能够产生指数级回报的大额投资，创立和维护一家公司的血、辛劳、泪水和汗水是无法证明合理的。例如，对于中央银行以外的任何公司（如美国汇款服务商），仅仅通过持有巨额美元来建立业务是不合逻辑的。\n\
  \n\n\n\n- 治理代币使得人们有机会影响影响费用和开发优先级等标准，并可以被视为一种分叉保险的形式。\n- 代币化证券是现有资产（股票、大宗商品、票据或房地产）的数字表示，并因其可拆分性和无国流动性而可能溢价。\n\
  - 为什么诸如 `BloXroute` 和 `Aztec Protocol` 模型等功能的交易费用正在尝试一种金库，通过接受微小的交易成本来换取其改进（分别是扩展性和隐私性）。\n\
  - `Starkware` 团队提出的“Tech 4 Tokens”希望将其技术作为一种投资来换取代币，从而为他们工作的所有项目创建一个金库。\n- 为协议提供\
  \ UX/UI，例如为 `Augur` 提供 `Veil` 和 `Guesser`，为 `MakerDAO` 生态系统提供 `Balance`，以换取少量费用或推荐费和佣金。\n\
  - 特定网络的服务，例如质押（如 `Staked.us`）、CDP 管理器（例如在 `MakerDAO` 的 `CDPs` 变得抵押不足之前进行注资）或市场平台管理服务（如\
  \ `OpenBazaar` 上的 `OB1`），这些可以收取传统费用（订阅费或按收入比例）。\n- 在非收益性应用中具有盈利业务模型的流动性提供者。例如，`Uniswap`\
  \ 是一个自动做市商，唯一的收入来源是提供流动性对。\n\n随着这么多新业务模型的出现和探索，显而易见，虽然传统的风险投资有一席，但投资者和资本本身的角色正在发生变化。资本正在转化为网络内的原生资产，履行特定的功能。投资者需要为这种新的组织模式重新定位，这种模式是由信任最小化的去中心化网络驱动的，从被动参与网络转变为在承诺资金（例如计算工作或提供流动性）后引导网络，再变为直接向网络中注入定性工作（例如治理或\
  \ `CDP` 风险评估）。\n\n回首过去，我们可以看到 `Web 1.0` 和 `Web 2.0` 需要大量的尝试才能开发出正确的商业模式，并催成了如今的科技巨头。当然，我们没有忽略\
  \ `Web 3.0` 也必须经历类似的迭代过程这一事实，但一旦我们找到了正确的商业模式，它们将是极其强大的。在无信任的环境中，个人和企业将能够在全新的水平上互动，而不依赖寻租的中间人。\n\
  \n成千上万才华的团队已经在执行这些某些的概念或发现完全全新的可行商业模型。当然，由于这些模型可能不符合传统框架，投资者可能需要通过承担新角色并提供工作和资本来适应（我们已经在\
  \ `Fabric Ventures` 开启了这段旅程），但只要我们能看到可预测且理性的价值积累，加倍投入就是有意义的，因为执行风险每天都在减少。\n\n# 第\
  \ 5 章\n\n# 你应该考虑购买的元宇宙股票\n\n元宇宙被描述为沉浸式和交互式的虚拟在线环境，它在最近几个月里引起了投资和商业界的关注。结果，各种类型的公司正投入数十亿美元，试图从互联网的下一个大趋势中获利。这包括\
  \ `Facebook`、`Oculus`、`Instagram` 以及 `WhatsApp` 的母公司 `Meta Platforms` (`NASDAQ:\
  \ FB`)。这家 IT 巨头打算每年在元宇宙投资上花费超过 100 亿美元。\n\n然而，Meta 并不是唯一致力于元宇宙的公司。为了顺应这一长期趋势，这里有三只现在值得投资的元宇宙股票。\n\
  \n## 1. Match Group\n\n在线约会业务由 `Match Group` (`NASDAQ: MTCH`) 主导。它拥有多个应用程序和服务；其中最著名的是\
  \ `Tinder`，它是全球使用最广泛的移动约会应用。订阅或单点销售目前占公司收入的大部分。他们让用户可以使用更多服务，并将他们的约会个人资料推给更多潜在的匹配对象。在最近的一个季度中，`Match\
  \ Group` 的付费用户同比增长了 16%，达到 1630 万人，这表明有 1630 万人在公司的各种服务上花费了钱。\n\n这种方法到目前为止证明是成功的，并且在未来几年中也应该继续保持。另一方面，`Match\
  \ Group` 在其最近的股东信中表示，打算在未来十年内让其服务变得更具沉浸感。这将从视频功能开始，`Match Group` 已经将其包含在它的许多产品中。例如，`tinder`\
  \ 刚刚发布了一个“探索”区域，用户可以根据相同的兴趣或活动建立联系。此外，它还打算在全球范围内引入虚拟货币，以便在平台上购买虚拟商品和服务更加方便。\n\n\
  `Match Group` 在 `Tinder` 之外最有勃的项目是韩国的 `Single Town`，由其最新收购的 `Hyperconnect` 管理。`Single\
  \ Town` 是一个实验性的虚拟世界，单身人士可以在虚拟设置中使用化身进行见面和聊天/闲逛。尽管这个概念很新颖且不太流行，但它反映了 `Match Group`\
  \ 对增强其所拥有服务的投入。\n\n## 2. Take-Two Interactive\n\n`Take-Two Interactive` (`NASDAQ:\
  \ TTWO`) 是一家视频游戏开发者和发行商，以（GTA）《侠盗盗猎手》、《荒野大镖救赎》和《NBA 2K》等作品闻名。`GTA` 是其最像元宇宙的系列作品，也是其主要的收入来源。为了直观地说明，Take-Two\
  \ 最近的高溢价 `GTA` 游戏是 2013 年发布的 `GTA V`。它是过去最受欢迎的游戏之一，并且仍然是该公司主要的收入来源。\n\n是什么让这成为可能？`Take-Two`\
  \ 在发布 `GTA V` 的同时发布了 `GTA Online`。`GTA Online` 是一个设定在虚构南方加利福尼亚大都市“圣安德烈斯”的虚拟环境。自发布以来，`Take-Two`\
  \ 一直为 `GTA Online` 社区发布升级和扩展，这推动了虚拟商品和服务的消费。`GTA Online` 可能是目前运行中的元宇宙的最佳案例，虽然还没有虚拟现实头戴设备那么沉浸（至少目前还没有）。\n\
  \n`GTA Online` 将于 2022 年 3 月作为独立游戏发布，以增加可以在虚拟世界中互动的人数。`GTA VI` 的最终发布（无论何时）几乎肯定会导致\
  \ `GTA Online` 宇宙产生更多经常性的互动。随着虚拟世界在未来十年变得更加沉浸，`GTA Online` 将会变得更加沉浸，从而使 `Take-Two\
  \ Interactive` 的股东受益。\n\n## 3. Roblox\n\n另一只元宇宙股票是 `Roblox` (`NYSE: RBLX`)；然而，与\
  \ `Match Group` 和 `Take-Two Interactive` 相比，它“颠倒了剧本”。它并不是自己创建像元宇宙的体验，而是为其他开发者为用户创建虚拟世界提供工具。可以将其想象为游戏和虚拟世界创建领域的\
  \ YouTube。\n\n`Roblox` 的大部分用户在 18 岁以下；因此该平台的体验主要面向儿童。然而，该业务认为随着时间的推移，他们将改进其图形制作工具，使其游戏更接近由\
  \ `Take-Two` 等专业工作室发布的游戏。在第三季度拥有 4730 万日活跃用户 (DAU)，`Roblox` 已经是一个庞大的在线社区。这些客户在 `Robux`\
  \ 上花费，这是平台的内置货币，开发者可以利用它提供游戏内体验或物品。（`Roblox` 通过从每笔交易中抽取抽成来获利。）\n\n\n\nRoblox 的净订单额（他们的销售衡量标准）在第三季度达到了\
  \ 6.378 亿美元，产生了 1.706 亿美元的自由现金流。正如之前提到的，该平台现在面向儿童群体，而 Roblox 正在致力于构建世界上最纯粹的元宇宙系统之一。因此，如果你认为向日益沉浸和虚拟世界的趋势在未来几十年内将持续，那么\
  \ Roblox 可能会成为你投资组合中极佳的长期复合增长股。\n\n# 我们比 Match Group 更喜欢的 10 支股票\n\n当我们这屡获殊名的专家团队给出股票建议时，关注它是值得的。毕竟，他们了近十年的《Motley\
  \ Fool Stock Advisor》股票简报已经跑赢了市场三倍。\n\n他们宣布了目前投资者应该购买的前 10 只股票……而 Match Group 并不在列！是的，他们认为这十只股票更具划算性。\n\
  \n## 虚拟房地产投资\n\n虚拟房地产投资通常被认为是更有经验的房地产投资者的领域。但这并非完全正确。由于新冠病毒对美国房地产市场的影响，虚拟房地产投资已成为常态。你不需要去其他州进行房产研究。此外，得益于房地产投资工具和房地产投资者网站，购买投资房产不再受地理位置限制。任何地方任何人都可以做出有利的投资选择。\n\
  \n### 什么是虚拟房地产投资？\n\n虚拟房地产投资是在购买投资房产之前，利用房地产投资软件进行房产研究和投资房产分析。它本质上是远程房地产投资，而不是实地看房的传统方法。这是进行跨州房地产投资的一种成本效益选择，因为它消除了旅行需求以及相关的费用和时间。此外，它还简化了寻找非挂牌房产的过程，而这通常需要开车实遍社区。虚拟房地产投资者可以在家中舒适远程房地产投资。\n\
  \n### 如何开始虚拟房地产投资\n\n成为房地产投资者并不困难。如果你有必要的房地产资源，甚至可以作为一项被动收入的副业。然而，由于你不再受限于所在的城市，虚拟房地产投资为任何预算和投资目标提供了许多替代方案。在州外购买租赁物业可能对你更有利。所以，如果你准备好利用这种方法为你服务，以下是入门步骤：\n\
  \n#### 如何选择房地产市场\n\n跨州房地产投资起初可能会令人困，因为有许多选项需要考虑。如果你不知道从何开始，选一个你感兴趣的州。它可能是一个 Airbnb\
  \ 规定友好的州，或者适合作为度假房产。如果你正尝试进入典型的租赁市场，它也可能是一个没有租金控制且人口众多的地区。然后决定该州内的城市或城镇是否会对长期租客或游客感兴趣。你是如何发现这一点的？如果附近有旅游景点、遗址或自然景观，就会有游客。要查看对长期租赁住房的需求，你可以查看在线市场统计数据，例如租客数量、租售比以及就业市场和经济状况。\n\
  \n这一阶段即使只做一点研究也可能具有挑战性。这就是为什么虚拟房地产投资需要房地产投资工具。你无法知道每个城镇住房市场发生的情况，但像 `Mashvisor`\
  \ 这样的房地产投资软件可以。它从各种挂牌网站收集信息，几乎使你的房地产市场研究自动化。`Mashvisor` 的房地产热力图允许你探索美国任何城市的社区。可以使用不同类型的社区数据进行分析：\n\
  \n*   传统和 Airbnb 租金收入\n*   挂牌价格\n*   Airbnb 入住率\n*   租赁房产的平均回报率（以传统和 Airbnb 现金回报的形式呈现）\n\
  \n通过这种方式，你可以快速了解你所选区域的住房市场，并确定那里是否是投资房地产的好地方。此外，它还提供了房地产市场研究的图形化表示。热力图允许你根据基本参数（如现金回报率）搜索项目。地图经过过滤，相应的社区会以高值绿色高亮显示。你不需要访问过该地即可使用这些数据——虚拟房地产投资意味着你比当地人更了解投资潜力。\n\
  \n### 做出业务决策\n\n在州外购买租赁物业和在住所附近投资有一个共同点：在两种情况下，在选择待售房产之前，都必须进行投资房产研究。这需要深入研究房产的财务状况，并确定它是否是一项利润丰丰的投资。`Mashvisor`\
  \ 可以帮助传统和虚拟房地产投资者做到这一点。该平台为你完成这项分析，允许你比较不同的替代方案。以下是自动分析包含内容的简要介绍：\n\n**支出和可能的资金来源**\
  \ 为了计算支出和投资回报，请在投资房产计算器中输入你的抵押或现金数据。公用事业、保险、物业管理费和 HOA 费用都是根据当地的历史房产数据估算的。因此，你可以立即看到某处待售的投资房产是否符合你的房地产投资计划。\n\
  \n这是一个租赁方案。租金收入、现金流、收益率、现金回报、每月费用和入住率均由 `Mashvisor` 报告。此外，你还将获得一份实用的 Airbnb 与传统租赁的并排对比，帮助你决定哪种租赁计划最有利。\n\
  \n#### Mashvisor 上的租赁房产计算器\n\n调查竞争对手。`Mashvisor` 列出了社区内类似的租赁房屋，使跨州房地产投资变得更加简单。此外，标准和\
  \ Airbnb 租赁对比数据均可用。面积、入住率，以及对于 Airbnb 来说的 Airbnb 晚间租率、Airbnb 评分和评论都是可用的。因此，你能够设定一个合理的租金。\n\
  \n#### Mashvisor 的租赁对比\n\n一旦你发现了理想的投资房产，可以在一些帮助下远程完成交易。在大多数地区，你可以聘请房屋检查服务去访问房产而无需你到场，让你放心。然后，为了进行谈判和报价，联系当地代理机构将很有益。这可以通过电话或电子邮件快速完成（`Mashvisor`\
  \ 上的挂牌提供了所有代理人的联系方式）。最后，需要数字签名。在交易完成之前必须签署许多文件，更不用说在你获得所有权后的租赁合同了。大多数县现在都接受数字签名文件，这将节省大量的文书工作。\n\
  \n## 元宇宙虚拟房地产正在蓬勃发展。\n\nSandbox 是其中一个虚拟世界，它现在在交易者和销售额方面处于领先。上周，Sandbox 拥有最大的交易量，土地块\
  \ NFT 交易额超过 8600 万美元，而 Decentraland 位居第二，土地块 NFT 交易额超过 1500 万美元。\n\n\n\n\n\n根据加密社交交易平台\
  \ `Alpha Impact` 首席执行官 Hayden Hughes 的说法，NFT 和越南工作室 `Sky Mavis` 开发的 `Axie Infinity`\
  \ 等边玩边赚的游戏已经让整整人进入了共享在线社区。Hughes 表示，当这些社区增长时，成员们具有创作动力，通过拥有元宇宙中的资产（如土地）来表达自己。\n\n\
  “真心想要表达自我的创作者，以及寻求利润的投机者，正推动着抢购元宇宙土地的热潮。与 2017 年的 ICO [代币发行]泡沫不同，元宇宙拥有广泛的应用和充满活力（尽管处于早期）的生态系统。`Facebook\
  \ / Meta` 并不是该领域的市场领导，重品牌引起了人们对该生态系统的关注，”Hughes 解释道。\n\n根据 `DappRadar`的数据，对元宇宙体验的需求在增长，元宇宙土地的价格也在上涨。上周，各种虚拟世界的土地块\
  \ NFT 占据了十笔最贵 NFT 交易中的五个。\n\n根据数据，收入最高的是 `Decentraland` 中的 `Fashion Street Estate`，其成交价为\
  \ `618.000 MANA`，约 `242 万美元`。然而，上个月一块 `Axie Genesis` 土地——这是另一款独立元宇宙游戏中价值最高的领土——以\
  \ `550 以太坊` (`ETH`) 出售。根据创者的推文显示，这次购买是“单一数字财产空以来最大的交易”，截至 12 月 3 日，`550 ETH` 价值\
  \ `248 万美元`。\n\n`Axie Infinity`、`Decentraland` 和 `Metaverse Gaming` 只是可用游戏中的几个。\n\
  \n根据 `Axie Infinity` 白皮书，“Axie 的母星 Lunacia 被分为代币化的土地块，作为其 Axie 的住所和行动基地。随着时间的推移，可以使用在游戏中收集的各种资源和制作材料对地块进行改进。”\n\
  \n根据开发者白皮书，`Lunacia` 由 `90,601` 块土地组成，以 `NFTs` 形式呈现，用户可以自由出售。然而，上述 `Genesis` 属性由于其稀缺性而极具价值：该游戏的\
  \ `90,601` 块土地仅包含 `220` 块 `Genesis` 地块。\n\n根据 `Grayscale Investments` 的最新研究，这种“创意经济”（被称为“边玩边赚”）的扩张允许用户以\
  \ `NFTs` 的形式拥有数字资产，在游戏中与其他交换，并偶尔将其传输到其他数字体验中。因此，`Decentraland` 等项目正在构建一个开放世界元宇宙，用户可以在其中玩游戏并赚\
  \ `MANA`（`Decentraland` 的原生货币），这些货币可用于购买 `LAND` 或收藏品之类的 `NFTs`、对经济治理进行投票或构建 `NFTs`。此外，这种架构为用户提供了系统之间显著的互操作性，作为其投入游戏时间的价值主张。\n\
  \n根据 `Grayscale Investments` 研究分析师兼报告合作者 Matt Maximo 的说法，元宇宙中的土地是一个迷迷人的概念，因为传统房地产的估值很大程度上取决于与商店、服务和其他人的远近——你受限于从家到那里所需的时间。\n\
  \n在 `Decentraland` 等多个元宇宙中的玩家可以传送到世界各地，使旅行变得快速且与估值无关。鉴于市场处于发展阶段，许多高价交易来自优越位置的 `LAND`\
  \ 土地，例如靠近著名的元宇宙景点的地点。\n\n“投资 `LAND` 是令人兴奋的，但它带有任何其他新兴市场相同的风险。”`LAND` 和 `MANA` 所有者有动力保持\
  \ `Decentraland` 地图较小并维持低地块数量，但他解释道，“总有一天有一天，扩大地图并生产更多 `LAND` 进行销售对他们的收益将大于稀释其财产的影响。”\n\
  \n他继续说道，由于 `LAND` 地块是非同质化代币，其流动性远低于 `MANA` 等底层代币。\n\n“如果你急于出售，可能会被迫以低于市场价值的价格卖给最高出价者，而如果我有\
  \ `MANA`，我可以去 `Uniswap` 或 `Coinbase` 等交易所立即交易，”他补充道。\n\n## 元宇宙中真的有无限的土地吗？\n\n虽然元宇宙日益增加的选择极大激励了购买物业作为玩家在虚拟环境中确立主权的方式，但一个潜在的困难是土地可能是无限供应的。\n\
  \n“因此，很难预测未来的土地值多少，今天购买可能被视为一种危险的投资。”例如，如果数字土地变得供应过剩，供需经济就会发挥作用，价格随之下降。然而，对于希望首批拥有数字世界土地的投资者来说，元宇宙可能提供的无限可能性可能超过这种危险。”`BLOCKv\
  \ & SmartMedia Technologies` 联合创始人 Reeve Collins 告诉 GOBankingRates。\n\n根据区块链加密即时通讯软件\
  \ `Status` 的营销经理 Eduardo Erlo 的说法，购买数字房地产的狂热可能会导致暂时的低迷。Erlo 继续说，由于元宇宙中的土地是永恒充足的，现在为之支付大量资金可能是浪费钱。\n\
  \n他说，解决数字土地无限供应的一种方法是让某些元宇宙对土地块具有内置稀缺性——例如之前讨论的 `Genesis` 虚拟土地——类似于 `Bitcoin` 提供的内置货币投资稀缺性。“现在要了解这一切还还太早了，”他说，“但观察这一过程很有趣。”\n\
  \n根据 `Grayscale` 的数据，赋予任何数量元宇宙生命的商业机会可能每年价值超过 1 万亿美元。此外，虚拟游戏世界的收入可能在 2025 年增长到 4000\
  \ 亿美元，高于 2020 年的 1800 亿美元。\n\n## 第六章\n\n## 加密货币在元宇宙中的作用\n\n加密元宇宙的创造者经常试图通过三个关键方式将他们的世界与之前的元宇宙版本区分开来：\n\
  \n\n\n\n\n# 去中心化\n与早期由企业拥有并控制的虚拟世界不同，加密货币元宇宙通常是去中心化的，由区块链技术为部分或全部元宇宙游戏组件提供动力。因此，区块链元宇宙迥异于当今游戏行业所使用的标准公司结构和价值榨取策略。区块链游戏的独特结构可以为参与者提供更公平的参与选择。这也意味着元宇宙中的个人共同拥有元宇宙的所有权。即使元宇宙区块链的原始设计者放弃了该项目，游戏也可能无限存在下去。\n\
  \n## 用户治理\nDecentraland 等加密货币元宇宙使用去中心化自治组织（`DAOs`）和治理代币来帮助其用户掌控游戏的未来，使他们能够对修改和升级进行投票。通过这种方式，元宇宙可以发展为拥有经济和民主政府的完整社区，其范围已扩展加密加密游戏。\n\
  \n## 加密代币与 NFT\n加密代币（如非同质化代币）被用于加密货币元宇宙，以代表现实世界的物体（`NFTs`）。在游戏语境下，成就和购买对玩家来说非常有用。`NFTs`\
  \ 为游戏物品标准带来了亟需的透明度和资产市场访问能力。由于每个 `NFT` 都是独特的，元宇宙代币和物品的设计可以轻松帮助验证游戏内用户生成内容以及 `NFT`\
  \ 游戏资产的溯源。\n\n由于加密货币元宇宙使用加密货币和区块链基础设施，它们的经济与更大的加密经济密不可分。元宇宙货币、虚拟形象皮肤和数字房地产的持有者现在可以在\
  \ `DEXs` 和 `NFT` 市场上交易这些资产，以换取现实世界的价值。\n\n## 元宇宙游戏可以兼具财务收益与社交属性\n虽然加密货币元宇宙（以及泛指\
  \ `NFT` 游戏）仍处于早期，但这些新世界具有巨大的社交经济潜力。用户可以从加密货币元宇宙中受益，获得玩耍、投资、收集和社交的新方式，以及从中一切获利的新途径。虽然对各种元宇宙平台的工作值得关注，但许多元宇宙游戏可以相互通信和互操作，可能将这一初生的区块链游戏生态系统变成全球经济支柱。元宇宙游戏结合了虚拟现实的沉浸式环境、社交媒体和视频游戏的成瘾性玩性以及加密货币的价值主张，有望成为互联网下一阶段的核心特征。\n\
  \n# NFT：元宇宙的经济\n## 非同质化代币如何辅助虚拟世界文明的发展\n元宇宙中的典型一天——一个共享的沉浸式虚拟现实——很快可能像我们熟悉并喜爱的世界。得益于虚拟现实和\
  \ 5G 通信的进展，我们将访问购物中心、跨越城市、在咖啡馆会朋友，并以一种感觉诡异真实的方式交换联系。\n\n元宇宙已经以多人在线游戏的形式存在了几十年。然而，我们可能很快进入一个与现实几乎无法区分的深度沉浸式体验时代，为玩家和非玩家产生新的互动类型。\n\
  \n在 `Decentraland` 和 `Somnium Space` 等原型级的下一代元宇宙中，定居土地、进行社交、传输货物和主张所有权的个人已清晰可见。然而，任何社会（物理的还是虚拟的）都需要一个功能健全的经济。这种经济基于数字属性，例如一个人的元宇宙房屋、汽车、农场、书籍、服装和家具，这些在元宇宙中经过了认证。它还需要在具有不同法律和规则的领域之间自由旅行和交易的能力以繁荣发展。\n\
  \n`non-fungible tokens`——基于区块链的数字所有权记录——将形成元宇宙经济的骨干，允许对财物、财产甚至身份进行认证。此外，由于每个 `NFT`\
  \ 都受到无法删除、复制或销毁的加密密钥保护，它允许以可靠的、去中心化的方式验证个人的虚拟身份和数字财产，而这是元宇宙社区取得成功和相互通信所必需的。\n\n\
  除了数百万数字艺术销售的热闹外，`NFTs` 的意义可能在于其能够促进元宇宙中基于自由市场（针对产品、服务和思想）、自主所有权和社会契约，催生某种类似于真实人类社会的出现。\n\
  \n“最初，`NFTs` 专注于数字艺术方面。但它将变得强大得多，”Crypto.com 首席运营官 Eric Anziani 补充道，“未来，它将描绘虚拟环境中任何种数字资产的工具。”因此，可能性是无限的。”\n\
  \n## 奇新世界中的房地产开发\n在喷泉旁交谈的人、时尚精品店里的购物者、海滩漫步道上的慢跑者，以及引导客人玩高额扑克的赌场荷官，都可以在 `Decentraland`\
  \ 中漫步。\n\n这些邂逅是那些购买土地并创造了吸引其他 `Decentraland` 居民兴趣的人所进行的虚拟房地产开发的结果。\n\n这种体验远非超现实（`Decentraland`\
  \ 的创造者称该世界仍处于铁器时代）。然而，即使在这些早期形态中，也是显而易见的。人们涌向元宇宙中有趣的区域，就像在现实社会一样。而且，就像在巴黎或比弗利山一样，名声会自动提高虚拟地产的价值。\n\
  \n土地的相邻性是 `Decentraland` 和其他元宇宙中的基本经济概念。在有限的地理范围内，所有元宇宙地块在固定点相邻。由于物业的可用性限制，这导致了稀缺性。而稀缺性允许物业价值根据通用供需规律升降。\n\
  \n根据 `Decentraland` 宣言，因此为“由现有的土地所有权层和内容分配驱动的经济体验”构建了基础。\n\n驱动元宇宙的物业交易通过 `NFTs`\
  \ 实现。这些代币提供了不可否认的所有权证明，比任何土地契都更安全。\n\n“由于智能合约的定义方式和 `NFTs` 的程序设计，你根本无法伪造元宇宙产权，”Anziani\
  \ 解释道，“你意识到自己拥有某项资产并建立完整的所有权。然后你可以根据该虚拟环境的规则和条件主张所有权。”\n\n# 伦敦、纽约或东京的待产房\n房地产革命的影响已经能强烈感受到。例如，数字地产投资基金\
  \ `Republic Realm` 在 6 月为 `Decentraland` 的某块土地支付了近 90 万美元。该场地正由 `Republic` 控制的 `Republic\
  \ Realm` 变成一个名为 `Metajuku` 的虚拟购物中心，原型是东京的原宿。\n\n房地产投资信托（`REITs`）很快就会根据这些行为在元宇宙中嗅到机会。在\
  \ `Decentraland` 中，物业价值随经济同步波动并扩张。\n\n\n\n\n\n时尚界是最早意识到 NFT 和元宇宙财务潜力的行业之一。博柏瑞为 `Blankos\
  \ Block Party` 视频游戏设计了 NFT 配饰，而路易威登则发布了自己充满 NFT 的视频游戏 `LOUIS THE GAME`。\n\n与此同时，`RTFKT`\
  \ —— 元宇宙的定制制鞋师——创造了限量版 NFT 运动鞋，这些鞋可以在虚拟世界中穿着，并且已经售出了数百万美元。\n\n随着元宇宙铁器时代的巨大势头，基于\
  \ NFT 技术的虚拟世界经济模型预示着巨大的规模效应。\n\n“五个月前，我们全球范围内有 1 亿加密用户。“我们现在有超过 2 亿用户，”`Anziani`\
  \ 说道，“我们坚信，元宇宙——虚拟世界与区块链技术的结合，特别是 NFT——将成为下一波迈向十亿或二十十亿用户的浪潮。”\n\n# 2022 年值得投资的 11\
  \ 大元宇宙加密货币\n\n想象一个不受你生活中客观事实限制的宇宙。在这个平行现实中，你可以工作、游戏、放松并与来自世界各地的人士交流。你可以参加派对、创作惊人的艺术作品并积累财富。你可以实现你设定的任何目标。这不是科幻小说：这就是元宇宙，而加密货币是进入它的钥匙。\n\
  \n尽管元宇宙区块链技术仍在开发中，但数字宇宙的概念已经非常成熟，拥有数十年的历史。元宇宙是由远见卓者和科幻小说作家提出的概念，他们梦想着一种方法，能够超越我们世界的物理限制，去探索新的边疆并创造新的可能性。元宇宙允许你在数字成功上达到新的高度，旅行到新的世界，并以新颖的方式与亲家人互动。\n\
  \n`Mark Zuckerberg`（马克·扎克伯格）是最近一位涉足元宇宙的人，并且对此大做文章。然而，尽管 Facebook（现已名为 `Meta`）是一个庞大且强大的组织，但它既不是第一个迷上元宇宙概念的，也不是最后一个。归结底，元宇宙是互联网的下一次演进，单一公司既无法控制互联网也无法控制元宇宙。然而，参与的每一家公司将不仅影响元宇宙的架构，还将影响它未来的面貌。\n\
  \n## 什么是元宇宙，它是如何工作的？\n\n元宇宙最早出现在尼尔·斯蒂芬森（Neal Stephenson）1992 年的赛博朋克小说《雪崩》（Snow Crash）中，当时他创造了一个“元宇宙”。`Stephenson`\
  \ 使用虚拟现实眼镜和公共光纤网络定义了一个共享的数字宇宙。他的元宇宙以日常普通场景的虚拟副本为特征，从公园、建筑到奇异且极其有趣的的领域，在这些领域中，只有个人想象的规则和限制适用。\n\
  \n自从 `Zuckerberg` 将其称为“互联网的下一个章节”以来，公众对元宇宙的兴趣爆发式增长。这个元宇宙扩展了你的视野，提供了做任何你所选择的事情的自由，无论是社交、工作、游戏、购买、生产还是学习新的地点和思想。元宇宙不仅将整个物理宇宙置于你的指尖，还将你心灵的力量交到你的手中。\n\
  \n你将在元宇宙中拥有自己的虚拟家，并通过在线头像与人交流，这些头像让你自由地移动、说话和行动。你将对自己的生活拥有完全控制权，包括像实际房地产一样拥有虚拟财产的机会。你甚至可以开发财产（如艺术或建筑），并将其出售给其他元宇宙用户以获得非同质化代币（`NFTs`）或其他支付方式。\n\
  \n`NFTs` 是一种游戏货币和收藏品。用户参与“边玩边赚”模式，用虚拟商品或财产交换代币，这些数字资产是他们虚拟经济的基础。他们也可以将自己的元宇宙加密货币卖给其他用户或将其投资以赚取息或其他收藏品。许多著名的元宇宙游戏网站都有自己的代币，这些代币可用于各种用途，或以加密货币或法币兑换现金。自从\
  \ `Zuckerberg` 以来，许多 NFT 和代币价值上涨，现在采用元宇宙加密货币可以帮助你尽早进入交易所（`ETFs`）并顺着浪潮取得元宇宙的成功。\n\
  \n## 元宇宙顶级加密货币\n\n在另一个世界生活、工作和游戏需要钱，你可以通过 `bitcoin` 赚取这些。有许多加密货币可以选择，就像有许多元宇宙可以探索一样。了解这些众多选择、区别以及每种的优缺点，将帮助你根据自己的情况做出最佳投资决策。\n\
