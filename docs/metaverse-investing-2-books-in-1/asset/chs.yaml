  \n艺术家的名字“What is Beauty”（什么是美）鼓励观众思考他们对问题性机构的批判。\"Exhibit\" 是他收入最高的作品，以 $250,000.00\
  \ 出售。这段 30 秒的视频展示了一个软糖熊的骨架，它仍然拿着监狱照片牌，被围围在一个看起来奇特地像自然历史博物馆展品的地方。\n\n## SSX3LAU\n\
  作品总价值：$8,191,686.80\n\n`SSX3LAU` 是一个 DJ 和艺术总监组合，作为独立创作者在畅销 NFT 榜上亮相。`3LAU` 与 `SlimeSunday`\
  \ 的长期合作产生了 5,740 件作品，平均每件价值 $1,428.48。\"Gunky's Uprising\" 是这对组合收入最高的作品，是他们新的 \"\
  Iridescent\" 系列的一部分。它以 $1,333,333.33 出售。\n\n这部三分钟的电影开始于看起来像山地景观的黑白图像。随着节奏淡出，霓虹色彩出现在屏幕上的彩虹各颜色，与黑色背景形成对比。镜面景观变为几何形状，将山脉转化为三角形、正方形和圆形，最后一只霓虹手接管了页面。\n\
  \n## JOSE DELBO\n作品总价值：$8,042,605.61\n\n阿根廷艺术家 `José Delbo` 以其在《神奇女侠》、《小露露》和《霹雳队长》中的工作闻名，于\
  \ 2020 年 7 月发布了他的首个 NFT。\"Death\" 是一本 43 页的原创漫画书，以 $642.14 出售。从那时起，他售出了 2,781 件作品，平均每件\
  \ $2,884.53。\n\n`Delbo` 与 `TrevorJones` 合作了 \"Genesis\"，这是他收入最高的 NFT，为 $553,169.65。`Delbo`\
  \ 设计了蝙蝠侠，`Jones` 对画面进行了动画处理。随着艺术从铅笔素描变为画布上的油画，蝙蝠侠出现，并直视观察者。\n\n## RTFKT STUDIOS\n\
  作品总价值：$5,689,100.45\n\n`RTFKT Studios` 起于一个定义的集合，现在已成为领先的运动鞋和数字制品品制造商。运动鞋是元宇宙中的数字角色可能穿的数字\
  \ `Skins`，也是工作室的核心关注。\n\n工作室最畅销的 NFT \"Fewo Charm\" 与 `Fewocious` 合作，为穿着者提供“世外的幸运和深层的创造力”。它以\
  \ $88,888.88 出售。`RTFKT'` 的作品涵盖从机夹克、赛博鞋到牛仔甚至一个“超级马桶”，售出了 916 个 NFT，平均价格为每件 $6,215.79。\n\
  \n## BOSSLOGIC\n作品总价值：$5,022,817.04\n\n`Kode Adobo`，为人知的 `Bosslogic`，是一位澳大利亚平面设计师和数字概念艺术家。`Bosslogic`\
  \ 以其创新的同人艺术混合和剪辑闻名，总共售出了 1,148 个 NFT，平均每件 $4,087.08。\"The Arrival\" 是艺术家最受欢迎的作品，解锁了一个超稀有的\
  \ `Mesut zil Next Chapter Golden Kit 连体衣`，这是给买家个人精灵的的穿戴品。用户可以为他们的精灵购买在元宇宙中穿戴的作品。\n\
  \n他最近发布的作品是与喀麦隆籍法国混合格斗家 `Francis Ngannou` 的合作，该作品在 `UFC 260` 比赛同一天发布。该作品旨在缩小武术与\
  \ NFT 之间的差距。\n\n\n\n\n\nSteve Aoki 是一位美国 DJ/制作人，他与 Antoni Tudisco 共同创作的曲目《Dream\
  \ Catcher》开启了他的 NFT 冒险之旅。Aoki 已售出 1,216 份 NFT，平均单价为 3,695.52 美元，他的合作作品充满了鲜艳的色彩和电子节拍。\n\
  \nAoki 最畅销的 NFT \"hairy\" 是一段 36 秒的视频，展示了一张紫色、粉色和蓝色的毛脸随着电子音乐律动。该作品还配有一个带有屏幕的烯酸材质用于物理展示，并以\
  \ 888,888.88 美元卖给了前 T-Mobile 执行官 John Legere。\n\n## DEADMAU5\n\n艺术品总价值：$4,314,653.48\n\
  \nDeadmau5 是一位著名的加拿大 DJ 和制作人，他已售出 752 件作品，平均价格为 5,605.18 美元。他标志性的 `mau5head` 是每个\
  \ NFT 的核心，并配有他的曲目。Sutu 与 `deadmau5` 合作的视听作品《In Titan's Light》是他记录最高的销售额，为 138,647.34\
  \ 美元。该作品设定在土卫卫星的一个空间站，灵感源自 `deadmau5` 的歌曲《SATRN》。\n\n## GREG MIKE\n\n艺术品总价值：$4,301,198.68\n\
  \nGreg Mike 是一位超现实主义流行艺术家和壁画画家，他于 2021 年 2 月开始销售区块链铸造的从未过的内容副本。这位位于亚特兰大的艺术家总共售出\
  \ 2,221 件作品，其标志性的“复古漫画”旨在装饰你的虚拟和物理墙面。他记录最高的销量“Mad Cans Master Set (50 Cans)”拍得 80,000.00\
  \ 美元，较其每份 NFT 1,976.68 美元的平均大幅增长。\n\n## MICAH JOHNSON\n\n艺术品总价值：$3,645,017.98\n\n\
  这位棒球球员转行艺术家凭借《Aku: The Moon God》进入 NFT 领域，这是一个包含一个戴着宇航员帽的小黑男孩的雕塑和数字艺术系列。凭借 1,534\
  \ 次总销量，Johnson 立即成为该领域最著名的名字之一。虽然他的作品平均价格为 2,376.15 美元，但最高价为 400,762.50 美元。\n\n\
  与大多数 NFT 同行者不同，Johnson 的 NFT 都附带一个实体雕塑。他记录最高的销售作品《The Vault》包含一个 `Aku` 的雕塑。NFT 拥有者可以获得位于迈阿密\
  \ Art Angels 画廊内恒温金库的专属权限，并可以转售访问权。\n\n# 第 13 章：## 最佳 NFT 市场\n\n简而言之，NFT（非同质化代币）是与艺术品等数字内容绑定的独特加密货币。\n\
  \n涌现出了几个新的 NFT 市场，允许用户买卖 NFT。\n\nNFT 已经存在了一段时间，但 2021 年是它们在公众意识中引起巨大影响的一年。\n\n这些加密令牌代表了艺术、电影或音乐等数字资产的所有权——但是数字艺术领域开启了\
  \ NFT 市场，例如 Beeple 在佳士得拍卖以 6900 万美元成交，夺了全球头条新闻。\n\n粉丝们疯狂涌入新的 NFT，花费了数百万美元。\n\n###\
  \ 1. OpenSea\n\n第一个也是最大的 NFT 市场，大部分购买发生在这里。\n\n## 2. Axie Infinity\n\n第二大的 NFT 市场，交易额达数十亿美元。\n\
  \n## 3. CryptoPunks/Larva Labs\n\nNFT 的早期示例之一，一组 10,000 个随机生成的形象。\n\n## 4. NBA Top\
  \ Shot\n\n一个以 NBA 视频集锦为核心的数字交易卡收藏。\n\n## 5. Rarible\n\n一个社区运营的网站，销售各种数字艺术和收藏品。\n\
  \n\n\n\n\n就像在 OpenSea 上一样，你可以购买和销售任何媒体。卖家还可以为单张图片创建多个 NFT，以便进行多次出售。\n\n对于那些接触过像\
  \ OpenSea 类似的 NFT 市场的人来说，Rarible 的用户界面让他们感到亲切，对于相对加密货币新手来说操作非常简单。\n\n你可以使用 `MyEtherWallet`、`MetaMask`、`Coinbase\
  \ Wallet` 或任何支持 `WalletConnect` 的移动钱包登录。你可以使用钱包中的资金进行购买，也可以在注册后通过银行转账或借记卡用法币为钱包充值。\n\
  \n## 6. SuperRare\n\n如果说 Rarible 的设计用琳琅满目的闪烁 GIF 和现场拍卖让你眼花缭乱，那么 SuperRare 的 UI 则要精简简单得多。\n\
  \n它也经过了更多的精选，因为它将自己描述为一个专门用于加密艺术创作和获取的社交网络。它与艺术家紧密合作，要求在作品上架之前经过提交和审核；换句话说，质量重于数量。\n\
  \n注册 SuperRare 需要使用支持的钱包，如 `Formatic` 或 `MetaMask`。你需要创建一个与你的钱包地址关联的用户名和密码作为第二步，但这只需要几秒钟，你很快就能浏览平台上独特的\
  \ NFT 了。\n\n## 7. KnownOrigin\n\n对于眼光挑剔的 NFT 爱好者来说，KnownOrigin 与 SuperRare 一样，提供更具精选感、类似画廊的体验。它的总交易额低于\
  \ 690 万美元。所有的艺术品文件都存储在 `IPFS` 上，这为底层资产提供了一定的安全性。该平台非常强调数字艺术，是一个忽略了 NFT 宇宙中奇怪层面的市场；因此，这里不会有古怪的头像或可爱的生物。\n\
  \nKnownOrigin 非常容易使用，尽管听起来像是在老调调。只需连接你的钱包（如 `Formatic` 或 `MetaMask`），你很快就能对你想要的\
  \ NFT 资产竞价。\n\n## 8. Foundation\n\nFoundation 的总交易额略高于 7900 万美元，它自称为艺术家的的“创意乐场”。这里有热门网络迷因\
  \ `Nyan Cat` 的 NFT、爱德华·斯诺登第一个 NFT，以及由制作人 Richard D. James（以 `Aphex Twin` 之名闻名）创作的一个视听数字收藏品。\n\
  \n一旦你通过 `WalletConnect` 连接了 `MetaMask` 或或其他软件钱包，Foundation 的市场就非常好用。你可以像在普通拍卖网站一样对限时拍卖进行竞标。\n\
  \n## 9. MakersPlace\n\nMakersPlace 是另一个 NFT 市场，拥有许多独特的数字艺术品系列。尽管规模较小（撰本文时为 2350\
  \ 万美元），但它具有许多独特的器物，增加了其独特性。2021 年 2 月份，当传奇加密艺术家 Beeple 以每件 1 美元的价格出售一组 NFT 时，该网站崩溃了。该平台曾举办过几位歌手的\
  \ NFT 发布。如 Shakira、`T-Pain` 以及来自“反抗机器乐队”的 `Tom Morello` 等人都已注册。\n\n在 MakersPlace\
  \ 上创建账户非常简单，你可以通过 `Google` 或 `Facebook` 账户登录来节省时间。\n\n在注册过程中，你需要选择五位艺术家进行关注，你可以使用你的\
  \ `MetaMask` `ETH` 余额或（更方便地）使用信用卡来购买他们的作品。如果你是创作者，必须填写一份在线表格以寻求加入平台的邀请。这将由策展人进行审核。\n\
  \n## 10. Nifty Gateway\n\nNifty Gateway 是首批大规模 NFT 市场之一，其关键支持者是加密货币交易所 `Gemini`，后者于\
  \ 2019 年收购了该网站。在 NFT 飙升期间，Nifty Gateway 在 2021 年 2 月促成了 Beeple 的 `CROSSROAD` 以 660\
  \ 万美元的价格出售，这是首批数百万美元 NFT 交易之一。到 5 月底，该平台的总收入已超过 3 亿美元。\n\n该平台拥有 `Grimes`、`The Weeknd`\
  \ 和 `Eminem` 等艺术家，以及每三周发布一次经过精选的 NFT 系列。还有一个市场，你可以在那里浏览验证过的艺术家、精选系列以及更多未确认艺术家的作品。\n\
  \n得益于 Nifty Gateway 与 `Gemini` 的直接连接，入门程序相对简单。要开始，你需要在网站上注册账户（如果你想出售 NFT，可以使用 `Stripe`\
  \ 验证你的身份）。你需要通过向存款地址发送 `ETH` 或使用信用卡为账户注资。之后，你就可以去市场购买 NFT 了。\n\n此外，你可以将你的 `Gemini`\
  \ 交易所账户连接到 Nifty Gateway 账户，使你能够利用 `Gemini` 交易所余额进行提现和购买。\n\n## 11. BakerySwap\n\
  \nBakerySwap 是一个比 OpenSea 小的 NFT 市场，这是可以理解的，因为大多数 NFT 市场基于 `Ethereum`，而 BakerySwap\
  \ 是最早在 `Binance Smart Chain` (`BSC`) 上推出的平台之一。NFT 市场是平台的一个方面，允许用户之间公开交易和交换流动性资产。\n\
  \nNFT 市场非常易用，只需连接 `MetaMask`。由于该平台基于 `Binance Smart Chain`，NFT 资产只能用 `BNB` 购买，而不是更常用的\
  \ `ETH`。 \n\n## 12. Binance NFT 市场\n\nBinance NFT 市场是由 `Binance` 托管的 NFT 平台，为了吸引全球加密交易所的海量用户进入该平台，它计划开发独家供应和合作项目。如果你已经有了\
  \ `Binance` 账户，你会惊喜地发现它支持 NFT。一旦进入，购买你感兴趣的产品非常简单。你可以使用 `BNB`、`ETH`，取决于开发者的安排。\n\n\
  \n\n\n自 2018 年进入“加密艺术”领域以来，琼斯已成为目前铸造 NFT 最重要的艺术家之一。当时，他利用增强现实技术，将苏格兰国家肖像馆的画作转变为加密界的大人物。他的名字在业内声名户赫。他曾与\
  \ `Pak` 合作，后者的作品近期在苏士比以 1680 万美元拍成交。当曾在 2021 年 3 月在佳士得拍卖行以 6930 万美元拍出一枚 NFT 的 `Beeple`，在去年夏天首次向琼斯寻求关于如何在\
  \ `Nifty Gateway` 上发布项目的建议时，琼斯忙得无暇顾（他们后来讨论了合作关系）。他的下一次合作对象将是歌手兼电影人 `Ice Cube`。\n\
  \n## 艺术演变与哲学\n\n随着 NFT 热度的升升，琼斯作为一名受过古典教育的艺术家，在数字时代继续脱颖而出。尽管他的许多作品包含技术元素（如增强现实、动画和，当然还有\
  \ NFT），但油画仍然是他最喜欢的媒介。同时，他一直在关注加密艺术世界的飞速发展。在某些方面，这反映了他在成长过程中那种传统的艺术氛围。\n\n“回以前……只有少数几个[加密/crypto]艺术家，”他回忆道，“我们每天都互相交流，并对谁在做什么深痴如醉。这在过去的六个月里真的大爆发了。它反映了整个艺术行业：存在自尊心、金钱和个性，每个人都在争夺分的一羹。”\n\
  \n## 早期年年与职业开端\n\n琼斯在加拿大西部一个“小型伐木场社区”长大的，童年在艺术课上表现优异，但他渴望成为一名摇滚明星。当事情变得“极其糟糕”时，他开始环游世界，在三十多出头时，他发现自己正处于“一个十字路口”。\n\
  \n“这都是很老套的，”他在 4 月通过 Zoom 在家中空旷的区域补充道，“我决定为了拯救自己并获得救赎，我必须成为艺术家。”\n\n琼斯毕业于爱丁堡大学，几年后在\
  \ 38 岁时毕业于爱丁堡艺术学院。他最初被聘为非营利机构 `Art in Healthcare` 的主管。根据招募他的 Margaret Hurcombe 的说法，琼斯是因为其“实用技能组合”在\
  \ 2008 年被录用的。在举办个人展期间，琼斯通过教艺术课和出租家中空闲房间来补贴收入。\n\n他很快意识到，个人演出无法支付他的开销。由于画廊佣金和装框等运营成本，筹备了一年的展览结束后，他仅剩下约\
  \ 9000 英镑利润。\n\n## 转向技术\n\n琼斯的作品对收藏家来说很有价值。“我开始客观理智地看待它，”琼斯解释道。他需要在四十岁为自己开辟一个生态位，以便与其他艺术家区分开来。结果，他转向了技术，2012\
  \ 年绘制 QR 码，并在 2013 年尝试增强现实。\n\n根据艺术展创始人兼当代艺术商人 Andy McDougall 的说法，琼斯在 2013 年爱丁堡艺术展上带了一些“看起来传统的”动物和风景画。“这种风格的突然转变困扰了我们，”McDougall\
  \ 说，直到琼斯拿出 `iPad` 扫描了他的画作，画作开始动起来、播放音乐并提供信息。\n\n## NFT 的成功与影响\n\n![](img/image0720.jpg)\n\
  \n`EthBoy`, 2019，140 x 110 厘米，油画与蜡颜料画布\n\n（注：原文剩余文本包含一些重复或碎片化的句子，已进行整合以保持上述叙事流的连贯。）\n\
  \n\n\n毕竟，区块链技术的组成部分，例如元宇宙（艺术家可以在虚拟环境中展示他们的 `NFT` 作品），从美学角度上令他感到兴奋，并认为这将会“彻底改变艺术的消费方式”。\n\
  \n尽管琼斯在过去一年中取得了巨大的成就，但他那惊人的财富仍然只是“屏幕上的一个数字”（实际上是多个数字——他拥有 `bitcoin`、`ether` 和法币）。他仍然在最便宜的超市购买杂货，而且没有自己的车，但他希望能和妻子搬到德国南部。尽管他非常喜欢爱丁堡，但他对“天气”表示了不满。在德国，他极有可能会买一辆\
  \ `Tesla`。\n\n与此同时，他正专注于一个机密的人工智能项目，并为他最近的合作伙伴——与 `Ice Cube` 的合作——进行研究。“这将是一个非常有吸引力的作品，带有强有力的信息，而不是‘明星割韭菜’，”琼斯说道。他也不认为\
  \ `NFT` 市场被高估了。相反，它是“艺术与电子商务未来”的完美舞台。\n\n# 第 15 章：NFT 技巧\n\n你可以按 24 小时、7 天和 30 天来筛选\
  \ `Ranking`（排名）。这是发现当前热门事物的绝佳方法。\n\n`Floor Price`（地板价）是确定集合中 `NFT` 价格的起点。许多 `Top\
  \ NFTs` 都非常贵，价格在 1 到 8 `ETH` 之间。\n\n在查看集合时，蓝色勾选表示其已由 `OpenSea` 确认。\n\n你需要连接一个钱包，例如\
  \ `Coinbase` 或 `MetaMask`。我尝试过两者，发现它们非常相似。\n\n手里至少保留 `$150` 以支付 `Ethereum Gas Fee`（以太坊\
  \ Gas 费）。千万不要向任何人透露你的钱包密钥！警惕任何在 `Discord` 上提议提供帮助的人，因为他们可能是骗子。\n\n对于 `NFTs`，无法保证你一定赚钱——你可能会失去一切！\n\
  \n## 如何选择 NFT\n\n在我刚开始时，我使用了 `OpenSea` 的排名系统。我觉得购买一个已经获得高评分的东西会让我更安心。`Parallel Alpha`\
  \ 是我第一批 `NFTs` 的来源，它们当时排在 `Top 3`。\n\n新项目通常比较便宜，但它们可能缺乏大量的粉丝，且无法被确认。这里是一些帮助你入门的更多建议：\n\
  \n### 检查 Twitter\nTwitter 是关注 `NFT` 项目最新动态的绝佳方法。你可以查看他们有多少粉丝，有多少人点赞他们的帖子，有多少人评论，等等。这是判断一个\
  \ `NFT` 集合互动程度的极佳方法。\n\n### 加入我们的 Discord 服务器\n你可以加入大多数 `NFTs` 的 `Discord` 频道。这是了解项目、其创作者以及如何参与的极佳方法。你可以查看\
  \ `Discord` 中有多少人，有多少人在在线，并阅读帖子内容。该 `Discord` 服务器是否运行正常？\n\n### 网站/项目路线图\n在项目网站上，大多数\
  \ `NFT` 项目都会为它们的未来愿景提供一份路线图。你可以查看他们的营销、增长和新产品计划。为了吸引新参与者，几项倡议在他们的路线图中包含了奖品。他们可能还有即将举行的在线活动、新发布或游戏开发计划。这将让你对该项目在未来\
  \ 6-12 个月内可能向何处发展有一个大致了解。\n\n### 社交媒体网红\n在当今的社交媒体领域，网红无处不在，其中许多人正在进军 `NFTs`。这也可以用来判断对某个\
  \ `NFT` 项目的兴趣程度。如果一个拥有数百万粉丝的网红开始推销某个特定倡议，这可能是一个很好的指标。对于 `NFTs`，病毒式营销和 `Twitter`\
  \ 的力量尤为关键，因为他们的粉丝可能会开始购买那些 `NFTs`。\n\n### 以太坊 Gas 费\n在 `OpenSea` 上使用 `Ethereum`\
  \ 购买 `NFT` 时必须支付 `Gas Fee`。Gas 费用是为了处理和验证 `Ethereum` 区块链交易所需的计算费用。Gas 费用根据时间和日期而异，范围从\
  \ `$30` 到 `$150` 或更高。我听过油价通常在东部标准时间凌晨 2 点到 7 点之间较低。当我开始购买 `NFTs` 时，它们的价格通常在 `$30`\
  \ 左右，但现在贵得多了。\n\n### 铸造 NFT\n当一个 `NFT` 项目全新并发布时，你可以铸造一个 `NFT`。这意味着你从集合中随机获得一个 `NFT`。铸造在特定的一天的特定小时进行。热门集合有时会在几分钟内售罄，因此你可能根本无法买到一个。当我尝试铸造一个\
  \ `NFT` 时，与 `8 Bit Universe` 的交易挂起了一 15 分钟。由于我无法完成铸造过程，我取消了交易以避免产生费用。最终，我在 `OpenSea`\
  \ 上从 `8 Bit Universe` 项目购买了两个 `NFTs`，价格只有铸造价格的一部分。\n\n### 初创风险\n谈起 `NFT` 项目时，我会想到小型科技初创公司。他们有一个首席开发人员、一个运营负责人和一个市场营销负责人。许多\
  \ `NFT` 项目由二到三人领导，使它们感觉像一家小企业。其他项目随着他们的扩张并招聘更多开发者、运营人员和营销人员，会有更多人。投资不不良贷款类似于投资一家业务！投资此类的小型“业务”是有风险的。\n\
  \n\n\n任何被认为有价值、独特性或独一无二的东西都可能成为明智长期投资。\n\n## 解锁内容 (Unlockables)\n\n存储在去中心化存储网络上的资产被称为\
  \ `NFT Unlockables`。有人购买带有这些解锁内容的非同质化代币时，他们将获得各种福利，包括：\n\n* 现场演出的 VIP 入场权限\n* 购物优惠\n\
  * 实物商品\n* 每月举办的会议\n* 来自独家来源的电话访电\n* 社交媒体粉丝\n\n涉及到 `NFT unlockables` 时，选择是无限的。如果你有机会，我建议购买具有高价值解锁内容的\
  \ NFT。即使你不打算转售它，也可以享受所有福利！\n\n## 投资于你深信的东西\n\n购买一个你热爱的 `NFT` 是至关重要的。通常情况下，如果你对某个主题感兴趣，你将对该主题有更深入的理解。这意味着由于你更了解，你更有机会买到有利可的东西。\n\
  \n你可以选择追随大流，开始购买你一无所知的潮流物品，也可以做出更明智的决定，支持那些制作你真正喜欢的事物的人。这完全取决于你，但我只购买我喜欢的物品。\n\n\
  总而言之，如果你的首要目标是从 NFT 中获利，你必须进行研究，以确保你购买的 NFT 将带来投资回报。\n\n## 具有潜在利润的 NFT 类别\n\n有很多不同类型的非同质化代币供选择，而且列表只会越来越长。以下是一些可以购买并从中获利的热门\
  \ NFT 类别：\n\n* 艺术\n* 音乐\n* 游戏\n* 摄影\n\n### 艺术\n\n有数千万个数字艺术 NFT 可供购买。寻找具有未来价值潜力的。此外，任何你认为会成为完美纪念品的东西。\n\
  \n数字艺术非常奇妙，因为你可以制作它并立即发送给其他人。现在可以购买数字艺术的一部分。这正是 Beeple 作品那些花费 6900 万美元的买家所做的。他向几个人出售了该艺术品的股份。天才！\n\
  \n好消息是，如果你是一个创作者，你不仅可以出售你的作品，还可以设置 NFT，让你自动获得所有二次销售的百分比，这被称为版税（royalties）。以前，作为艺术家，你无法从艺术世界的二次销售中获得任何收益，但现在情况已不再如此。\n\
  \nNFT 也可以用于制作编程艺术。编程艺术是指根据代码在区块链上的实现方式被编程为显示动态特性的艺术品。一个名为 `ASYNC art` 的数字市场是你制作编程艺术的地方之一。你不仅可以在那里制作主副本，还可以添加单个层并更改它们的属性。\n\
  \n个人可以作为一个小组为艺术做出贡献，不同的小组成员可以控制他们的活动。因此，NFT 允许集体艺术。你的艺术可以展示在 `OpenSea` 和 `SuperRare`\
  \ 等在线市场上，一旦它被创建，就可以在那里进行买卖。\n\n### 音乐\n\nNFT 在音乐行业中拥有巨大的潜力！你可能会获得活动、会议、电话会议等活动的终身\
  \ VIP 入场权限，但这只是开始。\n\n考虑一下：音乐艺术家可以突然使用非同质化代币来资助他们的职业生涯。这意味着对于音乐家来说，唱约交易可能不再是，艺术家可以为自己保留更大部分的利润。\n\
  \n此外，NFT 让艺术家和观众能够以比以前深得多的层次建立联系。在铸造代币时，音乐家有非常多的自定义可能，可以包含他们想要的任何东西。\n\n看看我与 Famous\
  \ Dyl（铂金热门单歌手）进行的独家 YouTube 访谈，了解非同质化代币如何影响我们所知的音乐行业：`Dyl Discusses Crypto Rich\
  \ NFT and How CyberScrilla.com Is Changing The Music Industry`\n\n### 游戏\n\n通过购买和出售游戏内物品，可以在热门视频游戏平台上获利。例如，`Steam`\
  \ 市场上的 `Team Fortress 2` 和 `Dota 2` 等游戏非常受欢迎且销售速度快。\n\n`Crypto Kitties` 是另一个 NFT\
  \ 现象。`Crypto Kitties` 正在被购买和繁殖以出售。另一个吸引人的获利特领域是游戏内物品。\n\n此外，因为它是去中心化的，出售的游戏物品类型或销售数量没有限制。最受欢迎的游戏之一\
  \ `Axie Infinity` 已经看到高额交易。在其他游戏中，如 `Gods of Change`、`Skyview` 等，卡片可以交换或出售以其他卡片。\n\
  \n### 摄影\n\nKate Woodman 最近为一张 NFT 拍摄获得了 20,000 美元。照片非常适合 NFT，因为它们现在是数字化的。\n\n照片捕捉瞬间，而这些瞬间中的一些对人们具有重要意义。你可以购买图片或制作自己的\
  \ NFT 并在各种市场上出售它们。\n\n最好的部分是，作为摄影师，你不需要放弃你的版权或复制权。你只是向买家出售 NFT 组件的所有权。你可以保留 NFT\
  \ 组件的所有权。\n\n## 出售 NFT 获利的最佳提示\n\n确定你想要在出售的市场\n\n如果你有购买的并想要出售的 NFT，你可以直接在市场上出售。然而，你应该咨询将将收取的费用。\n\
  \n一旦你决定了要购买还是制作 NFT，你就需要决定使用哪种类型。下一阶段是将它们放在市场上。\n\n你对想要出售的版本数量具有完全的控制权。没有必要只有一个版本。你可以拥有同一个数字资产的多个版本，每个版本都是独特的，并且有自己的令牌\
  \ ID。但请注意，这可能会降低你资产的价值。\n\n\n\n\n互联网极度需要写得良好且信息丰富的 NFT 信息。任何涵盖 NFT 及其相关新闻的博客都具有巨大的观众潜力。在建立起忠诚的读者群后，你可以通过广告或分销链接实现网站的货币变现。\n\
  \n### 3. 创建一个 NFT 论坛\n互联网上需要更多供 NFT 生产者、销售者和爱好者讨论其项目的论坛。创建一个与 `Bitcointalk` 竞争的纯\
  \ NFT 论坛可能极具利润可图，特别是当你运行横幅广告时。\n\n### 4. 成为 NFT 经纪人\nNFT 的买卖数量处于历史新高。自然地，允许买家和卖家查看、佣金和交易\
  \ NFT 的安全、加密市场和经纪公司有着巨大的需求。\n\n### 5. 为 NFT 创建时事报\n目前还没有多少深入探讨该主题的 NFT 相关时事报。如果你能将所有最新的\
  \ NFT 新闻、新闻稿、大型拍卖销售和市场发展浓缩成一份简短的每月或每周时事报，你可能会拥有一非常获利的公司。\n\n### 6. 编写 NFT 电子书\n\
  一本畅销的加密货币电子书带来六位数甚至七位数的版税并非未未闻。如果你是一个才华横溢的作家，能够从方方面涵盖主题，并为想要开始 NFT 投资的个人提供具体的指导，可以考虑自出版一本关于\
  \ NFT 的电子书。\n\n### 7. 创建白标 NFT 服务\nNFT 领域需要一种像 Shopify 那样、只需少量或无需额外开发即可让项目运行的服务。如果你能建立一种即用的\
  \ NFT 解决方案来帮助开发 NFT 创业项目，你可能会成为区块链业务中最受欢迎的白标平台之一。\n\n### 8. 担任 NFT 艺术家\n没有什么能阻止你创作数字艺术，即使它是抽象的，即使你不是世界上最有才华的实体艺术家。然后你可以将作品转换成\
  \ NFT 并在 `Reddit`、`DeviantArt` 和 `Wetcanvas` 等网站上出售。\n\n### 9. 创建 NFT 收藏品\nNFT 作为一种数字媒介，是保护和验证收藏品的理想选择。。例如，你可以用运动交易卡片或签名照片等真实的收藏品制作\
  \ NFT。\n\n### 10. 创建 NFT App\n允许用户买卖、交易甚至铸造 NFT 的 App 将具有极大的需求。如果你在每笔交易中抽取佣金，那么一个类似于\
  \ `Bid Beacon` 或 `BiddingOwl` 但完全专注于 NFT 市场的 App 可能是一个极具利润价值的项目。\n\n## NFT 市场正在扩张\n\
  \n在 NFT 交易所上交易的非同质化代币与完全相同的同质化实体是不同的。大多数 NFT 现在是数字化的，创作者可能会发现新的资金流，让他们能够为粉丝提供独特且稀有的东西。\n\
  \n除了 Beeple 价值 6900 万美元的 NFT 外，NFT 的著名例子还包括 Jack Dorsey 的第一条推文和动画“Nyan Cat”。根据知名技术追踪机构\
  \ `L'Atelier BNP Paribas` 和 `nonfungible.com` 的报告，2020 年 NFT 市场的价值估计为 2.5 亿美元。\n\
  \n此外，研究预测到 2020 年，NFT 市场的增长率将达到 299%。此外，`CryptoSlam` 声称 NFT 市场的销售额已超过了 10 亿美元。因此，你可以明白为什么考虑\
  \ NFT 和 NFT 经济的重要性如此重要。\n\n## NFT 市场的目的是什么？\n\n不可否认，区块链技术和 NFT 可以为艺术家和内容创作者提供补偿其劳动的理想平台。艺术家不再需要依赖拍卖行或画廊来出售他们的作品。另一方面，艺术家可以直接以\
  \ NFT 的形式将作品卖给客户。这也有助于艺术家获得更大部分的收入。\n\n有趣的是，NFT 包含了版税的可能性，这使得原始艺术家有权获得后期作品销售的百分比收益。许多对学习最佳\
  \ NFT 市场感兴趣的人也对创建自己的 NFT 收藏感兴趣。对 NFT 兴趣的买家可能正在寻找获得它们的方法。所以，让我们看看 NFT 可供交易所需的要素。\n\
  \n* 为了在所选择的区块链平台上支付交易费用，你需要一个数字钱包来存储 NFT 和 `bitcoin`。\n* 购买加密货币，例如 `Ether` 或你所选\
  \ NFT 服务支持的货币。\n* 各种网站如 `PayPal`、`Coinbase Wallet`、`eToro` 和 `Kraken` 接受信用卡购买加密货币。\n\
  * 用户可以将加密货币从交易所转移到选择的钱包。\n\n## 什么是 NFT 市场，它是如何工作的？\n\n在完成上述流程后，你可以搜索 NFT 市场来出售或购买\
  \ NFT。NFT 市场在桥接买家和卖家之间的差距方面至关重要。在某些情况下，NFT 市场可能还会提供用于快速创建 NFT 的额外工具。\n\n艺术家可以在专业平台上出售\
  \ NFT 艺术。买家可以在市场上寻找 NFT，然后对他们想要的东西进行竞价。因此，每个 NFT 开发者或粉丝都应该查看 NFT 市场列表，以确保他们在艺术品、收藏品和其他数字商品上获得优质的交易。\n\
  \n## 顶级 NFT 市场列表\n\n如你所见，NFT 市场是 NFT 这一令人兴奋的新趋势的重要元素。NFT 市场使得获取 NFT 变得更加简单和灵活，同时解决了创作者传统的收入困难。然而，对\
  \ NFT 交易所的所有辩论最终都归结为一个问题。为了获得最佳价值，NFT 发明者和购买者自然会寻找“什么是最佳 NFT 市场？”这一问题的解决方案。\n\n\
  特别是几个 NFT 市场的快速兴起是关注的焦点之一。在这种情况下，对一些最著名的 NFT 市场进行清晰的概述和完整描述将非常有益。这里是一些最著名的 NFT 市场的简介介绍，它们可能帮助你在\
  \ NFT 世界中开辟新局面。\n\n### 1. OpenSea\n根据行业标准，OpenSea 是最好的 NFT 市场，也是 NFT 市场中最大的。艺术、体育、虚拟世界、抗审查域名、收藏品和交易卡都是可用的非同质化代币类型。OpenSea\
  \ 包含了 `ERC1155` 和 `ERC721` 资产这是一个有趣的特性。\n\n它允许你购买、出售并了解如 `Decentraland`、`Axies`、`CryptoKitties`\
  \ 和 `ENS` 等独特的数字资产。\n\nOpenSea 作为 NFT 市场的主要功能之一是它的物品挖掘工具。创作者可以使用该铸造工具进一步增强他们的物品并建立自己的\
  \ NFT 收藏。\n\n### 2. Nifty Gateway\n对“什么是最佳 NFT 市场？”这个问题的第二个回答是 Nifty Gateway。无疑，它是最有声誉的高端\
  \ NFT 加密艺术交易市场之一。Nifty Gateway 与顶级制作、公司、运动员和艺术家的合作使公司受益。这种合作为加密艺术收藏家带来了独一无二的作品。\n\
  \n然而，在加密艺术市场中，在 Nifty Gateway 上获得认可相当困难。因此，该平台向顶级艺术家、公司和名人创作者开放。\n\n\n\n\n\nNifty\
  \ Gateway 还允许版税，因为艺术家可以选择他们希望从二次销售中获得的百分比。作为最顶级的 NFT 市场 (ETH)，它接受信用卡、借记卡和 Ether\
  \ 支付。\n\n### 3. SuperRare\n\n在最优秀的替代方案中，另一个有趣的 NFT 市场是 SuperRare。该网站主要旨在作为一个用户交易独一无二、限量数字艺术品的市场。SuperRare\
  \ 网络艺术家创建原创艺术品。\n\n随后，艺术品被代币化为加密资产或收藏品，并在平台上进行所有和交易。许多行业内部人士赞扬 SuperRare 为互联网上与艺术、文化和收藏的互动提供了新方式。在市场之上建立社交网络是\
  \ SuperRare 的一个亮点。\n\n数字收藏品可能适合社交背景，因为它们与透明的所有权记录相结合。\n\nSuperRare 是为初入该领域的艺术家设计的，但它具有发明和创造的风格。它支持以太坊网络的原生加密货币\
  \ `Ether`。\n\n### 4. Rarible\n\n如果没有 Rarible 这个名字，任何关于顶级 NFT 市场的讨论都是不完整的。它是一个简单且易于使用的\
  \ NFT 平台，对艺术家来说入门门槛很低。因此，刚进入 NFT 领域的人可以受益于 Rarible。\n\n然而，受复杂布局的影响，它在用户体验方面遇到了小挫折。Rarible\
  \ 的独特之处在于它有自己的代币 `RARI`。`RARI` 用于奖励活跃的平台用户。\n\n它运行在以太坊区块链上，收取 2.5% 的交易费用，除了 `RARI`\
  \ 和 `ETH` 之外，支持 `WETH`、`ATRI` 和 `DAI`。Rarible 也是一个可靠的版税 NFT 市场，因为艺术家可以选择保留二次销售收益的多少。\n\
  \n### 5. Foundation\n\nFoundation 是近期登上头条的知名 NFT 市场之一。对于许多加密艺术创作者来说，它已成为首选的 NFT\
  \ 市场。Foundation 的独特特征是提供社区策展的收藏。创作者和收藏家通过协作的方式邀请新艺术家加入 Foundation。\n\n因此，在售出第一个\
  \ NFT 后，创作者可以快速利用 `\"Creator Invites\"` 功能。Foundation 对任何想要留下足迹并作为独特创作者脱颖而出的艺术家都开放。它接受\
  \ `Ether` 支付，并承诺引入一项全新的功能，确保二次购买获得 10% 的版税。\n\n### 6. Cargo\n\n在那些可能被认为是 NFT 市场最佳选择的强大玩家中，许多优秀的竞争对手并没有被认可。Cargo\
  \ 是此列表中的成员，是任何 NFT 新手的绝佳选择。它接受 `Ether` 支付并接受所有人的申请。\n\nCargo 最显著的特点是它没有任何 NFT 拍卖。定价决定完全取决于艺术家。它还允许使用\
  \ `'Split Royalties'` 选项，允许你输入多达 15 个不同的以太坊钱包地址。\n\n“最好的 NFT 市场是什么？”问题的答案可能会根据其易用性引导你选择\
  \ Cargo。它可以为设计师提供可靠且具有成本效益的方式开始 NFT 挖矿和交易。Cargo 的 `'Magic Minting'` 功能也有助于避免燃料费用（gas\
  \ expenses），展示了它的成本效益。\n\n### 7. Myth Market\n\n虽然关于 Myth Market 的不多，但它并不是单一的 NFT\
  \ 市场。Myth Market 是多种通用且易于使用的在线市场的集合，为各种数字交易卡公司服务。`GPK.Market`、`Heroes.Market`、`Shatner.Market`、`GoPepe.Market`\
  \ 和 `KOGS.Market` 是目前 Myth Market 上的亮点。\n\n每个入选市场对于每个收藏品品牌来说都是独特的。例如，你可以在 `GPK.Market`\
  \ 上交换 Garbage Pail Kids 卡片。因此，Myth Market 为 NFT 市场的未来潜力提供了有力的证明。\n\n### 8. Mintable\n\
  \n对于 2021 年来说，Mintable 不会缺 NFT 市场列表。它是一个功能全 NFT 市场，你可以在那里交易几乎任何东西，从艺术、音乐到视频游戏道具收藏品。Mintable\
  \ 最迷人的功能之一是它的免 Gas 铸造（gasless minting）选项。\n\n它构建在以太坊区块链上，只接受 `Ether` 作为支付形式。共有三种主要的拍卖类型。拍卖类型包括定时拍卖、立即购买拍卖（Buy\
  \ It Now auctions）和经典拍卖。创作者可以使用版税在所有二次销售中获得 5% 的版税。如果你对 NFT 感兴趣，特别是作为一个新手，Mintable\
  \ 是值得使用的平台。\n\n### 9. Enjin Marketplace\n\nEnjin Marketplace 作为顶级 NFT 市场的声誉在许多领域都是众所周知的。它潜力允许探索和交换区块链资产。特别是\
  \ Enjin Marketplace，是基于 Enjin 的 NFT 的最佳选择。到目前为止，它记录的数字资产的 Enjin 代币支出已超过 4380 万美元。\n\
  \n根据报告，大约有 21 亿个 NFT 了如此巨大的支出。\n\n`Enjin Wallet` 使得列出和购买收藏品变得简单。一个展示 Enjin 项目的 `'Projects'`\
  \ 页面供创作者使用。游戏项目可能属于其中。因此，如果 Enjin Marketplace 是你选择的 NFT 市场，你将发现良好的机会。\n\n### 10.\
  \ KnownOrigin\n\nKnownOrigin 是列表中的最后一个 NFT 市场，是一个专业的加密艺术平台。由于媒介的严肃性，创作者进入那里是困难的。相比之下，KnownOrigin\
  \ 不需要要求创作者拥有大量粉丝或被认为是知名艺术家即可通过。\n\nKnownOrigin 的 `'Trending'` 功能是推广创作者的一种技术。在 KnownOrigin\
  \ 的图中，该功能有助于突出创作者的身份和作品。KnownOrigin 无疑是新手的顶级 NFT 市场，尽管它青睐拥有独特作品集的艺术家。它允许艺术家在二次销售中获得\
  \ 12.5% 的版税。\n\n\n\n他们根据基于声誉的游戏进展获得了独特的 `NFT(s)` 或加密货币，稍后他们可以将这些资产转换为真实货币。\n\n由于每个\
  \ `NFT` 都是独一无二的，区块链技术引入了数字资产所有权的概念。数字艺术品（如图像）可以被轻易复制供成千上万的人使用，而无需承认原作者。如果将艺术品以非同质化代币（`NFT`）的形式存储在区块链上，所有者就可以主张保留或将其出售给他们想要的任何人的权利。值得注意的是，这种方法对游戏比对艺术更有效。\n\
  \n玩家对他们通过参与区块链游戏而赚或接收的数字资产拥有完全的控制权。即使传统游戏中的玩家为数字资产支付了真实资金，一旦服务器宕机，他们也将失去对这些资产的访问权限。游戏资产和资金都将是开发者或发行者的财产。\n\
  \n另一方面，区块链游戏的玩家保留了对数字资产的完全控制权，允许他们与其他玩家自由交易、将其出售换取真实货币，并可能将其应用于多个游戏宇宙。\n\n# 什么是区块链游戏？香虫大战\
  \ (Axie Infinity)\n\n区块链游戏是使用区块链技术开发的或发布在区块链上的，因此游戏并不完全由一个实体所有，而是由运行它的整个计算机集群所有。要做到这一点，你需要一个\
  \ `Smart Contract`（智能合约），这是一种管理区块链上操作的数字合约。\n\n意乎不用的是，游戏是利润最高且应用最广泛的区块链应用之一。尽管与\
  \ `Bitcoin` 和 `Ethereum` 有关，但区块链目前是 `NFT` 交易的骨干。数字资产的创建以及它们易于收集和交易是其最核心的应用之一。\n\n\
  # 区块链游戏玩边赚 (Play-to-Earn) 中需要了解的重要术语\n\n玩边赚范式被用于大多数区块链游戏，奖励玩家玩游戏和参与游戏内经济，这允许用户购买和交易与游戏相关的商品。\n\
  \n与带有游戏内购买的免费玩模式或付费玩模式等传统游戏模式不同，基于区块链的游戏让玩家对其数字资产拥有最终控制权。\n\n由于系统的良性循环，玩家获得了皮肤、游戏物品和武器等收益。\n\
  \n## 付费即赚 (Pay-To-Earn)\n\n在与玩边赚相关的付费即赚方法下，用户必须初始预购游戏内资产（通常是 `NFT`）。\n\n物品可以随时间推移产生价值，类似于玩边学技术，盈利前景作为粘性的激励措施。\n\
  \n## 游戏金融化 (GameFi)\n\nGameFi 是一个强调游戏盈利能力的概念，指代玩边赚和付费即赚模型。\n\n成功的区块链游戏需要一个具有快速交易率和低费用的强有力区块链基础。消费者在购买或出售物品时不会（也不应该）支付高昂的交易费用，因为没有这些费用，物品将是无法使用的。\n\
  \n## 游戏内资产所有权\n\n玩家对于不可移植且由开发者控制的游戏内资产不乐于付费。更糟糕的是，如果游戏网站宕机，玩家将失去他们投入的一切。\n\n游戏内资产代币化（涉及创建\
  \ `NFTs`）允许创作者完全拥有他们的资产。\n\n# NFT 的角色\n\n路透社估计，全球 `NFT` 市场在 2021 年上半年的价值将达到 25 亿美元，高于\
  \ 2020 年两个季度的 1370 万美元。随着 `NFTs` 进入市场，越来越多的组织热于构建构建的区块链游戏业务。\n\n## NFT 的价格\n\n如果目前的趋势持续，基于区块链的游戏可能会成为一个引竞争力的加密货币用例，颠覆巨大的全球游戏行业。\n\
  \n根据一个热门网站显示，2020 年 8 月，超过 883,000 个每日唯一钱包与游戏相关的智能合约交互，高于 7 月的 804,000 个。自今年 1 月以来，这些数字一直在增长。预计到\
  \ 2026 年，全球游戏市场将达到 3140 亿美元，目前为 1730 亿美元。区块链游戏有望成为一种常见的组件，区块链游戏具有巨大的潜力。\n\n\n\n\n\
  \n基于区块链的游戏 `ZED RUN` 使用 `NFTs` 来代表马匹。因为每匹马都有自己的一组属性，你可能会获得一匹冠军公马或一匹种马马。\n\n以下是四个对区块链游戏未来产生重大影响的区块链游戏。\n\
  \n游戏行业已经取得了长足的发展，随着新技术的趋势的结合，游戏的未来正处于价值上升的蓄势阶段。另一方面，区块链在价值转移和数字资产方面的应用众所周知。商业和技术都需要符合信任生态系统精神的数字资产。\n\
  \n区块链技术具有帮助解决游戏行业问题的潜力。区块链游戏受益于 `dapp` 特性，如非同质化代币和透明度。区块链游戏为该行业的许多问题提供了解决方案，而这项技术开启了不可逆数据的未来，这可能有助于游戏故事的创作。\n\
  \n## 为什么基于区块链的游戏经济是未来\n\n`Axie Infinity` 只展现了区块链游戏能力的冰一角，该行业在不久的将来将迎来大爆发。\n\n###\
  \ 市场分析\n\n每个不是住在山洞里的人都知道，游戏行业近期如火如荼。它是从 COVID-19 疫情中受益匪浅的行业之一。\n\n全球游戏行业现在的价值为 1800\
  \ 亿美元，成为地球上增长最快的娱乐形式。就年度收入而言，全球电影业务价值超过 1000 亿美元，而整个北美体育运动的总和约为 730 亿美元。\n\n在 2018\
  \ 年，美国收视率最多的四个顶级体育赛事中有三个并非传统体育。它们是电竞比赛。例如，`英雄联盟`决赛赛的观众人数比 `AFC 总决赛` 多出 3000 万，比\
  \ `NCAA 足球锦标赛` 多出 4500 万。特拉维·斯科特去年四月在著名的在线游戏 `Fortnite` 上举办了一场演唱会。根据 `TechCrunch`\
  \ 和 `GamesIndustry.biz` 的数据，观看人数超过了 1230 万，并为斯科特赚了近 2000 万美元。\n\n那么，这里到底发生了什么？这些增长源于哪里？\n\
  \n这很大程度上归归于技术的改进和指数级增长。我们互动、合作、生成和消费信息、转移价值以及建立在线社区的方式正由于技术的进步而发生变化。\n\n星巴克前首席执行官霍华德·舒尔茨（Howard\
  \ Shultz）通过他的咖啡馆概念普及了“第三空间”的概念。他认为人类需要一个办公室和家之外聚集的“第三空间”。星巴克就是解决方案。\n\n同样的理念目前出现在当今年轻人身上；然而，新的常态是数字化的，被称为\
  \ `Metaverse`（元宇宙）。这些是如今年轻人日益聚集的地方。他们去那里和朋友聊天、听音乐或玩视频游戏。这可以被视为 `Facebook`、`AOL`\
  \ 聊天室、`Myspace` 和 `Metaverse` 之后的下一代在线社区。\n\n## 游戏的起源\n\n20 世纪 50 年代后期，第一个视频游戏——一种与\
  \ `Pong` 相关的基础网球游戏被发明。标志性的 `Atari 2600`家用视频游戏机于 1977 年上市。20 世纪 80 年代初，`Nintendo`\
  \ 开始开发如《大金刚》、《马里奥兄弟》等热门街机游戏，随后的《塞尔达传说》等游戏则专门发布在任天堂的家用平台——红白游戏机（Nintendo Entertainment\
  \ System）上。\n\n需要注意的是，商业模式随着推移发生了显著变化。我们以前在 `GameStop` 这样的零售店购买 60 美元的游戏。这是一次性费用，让你无限制访问游戏。游戏的推广和发布方式就像好莱坞电影一样。90%\
  \ 的收入将在前两周内产生。\n\n`Freemium`（免费增值）模式现在是行业标准。这基本上是一种商业模式，提供免费的基础服务，而更高级的功能必须付费。用户被诱导进行内购。\n\
  \n这现在可以在 `Roblox`、`Fortnite` 等游戏中看到。\n\n对于游戏制作人来说，这是一种更有效的技术，因为它能让客户保持兴趣并不断更新以与朋友竞争。我们正越来越接近一个世界：更年轻一代在\
  \ `Metaverse` 中使用他们的游戏内 `avatar`、`weapon` 和 `skins` 来相互交流。欢迎来到未来。\n\n## 为什么游戏将转向区块链\n\
  \n今天大多数的游戏通过私有数据网络进行。因此，用户将不再拥有他们的游戏内资产（`avatars`、`skins`、能力）。\n\n区块链技术允许玩家声称游戏内资产的所有权。这在今天技术是不可能的。区块链允许游戏经济有机地演变。用户可以因为他们的参与获得报酬。这种方法正在被\
  \ `Axie Infinity` 颠覆，考虑到 COVID-19 带来的经济困难，这是不可思议的。\n\n27 亿美元。`Axie Infinity` 再次领先。用户必须先购买\
  \ `NFTs` 和 `AXS` 原生代币才能开始游戏。他们可以获得光滑爱水（SLP`）代币，它可以兑换成法币或其他加密资产。菲律宾的许多人通过玩 `Axie\
  \ Infinity` 赚到了数倍的收入。\n\n\n\n\n对于新手来说，弄清楚什么是 NFT 足够简单，但我如何成为一名加密艺术家（CryptoArtist）呢？这是最常被问的问题之一，但答案往往模糊不清。换句话说，我应该从哪里开始？如何销售和推广我的作品？我如何与加密艺术社区建立联系（可能更重要的是，加密艺术社区聚集何何）？在本节中，我们将介绍成为加密艺术家的基础知识。\n\
  \n## 1. 技术部分\n\n当然，第一步是开设一个加密钱包，并将法币（如 `USD` 或 `GBP`）转换为 `Ethereum`。要在 NFT 商店上铸造你的艺术品，你需要\
  \ `ETH`。\n\n## 2. 了解不同的 NFT 商店\n\nNFT 商店主要分为两种：任何人都可以出售艺术作品的通用 NFT 商店，以及艺术家必须先通过审核的精选商店。`OpenSea`\
  \ 和 `Rarible` 是两个最流行的通用 NFT 零售商；不过，还有 `Cargo` 和 `Mintable`。诸如 `SuperRare`、`MakersPlace`、`KnownOrigin`、`Nifty\
  \ Gateway` 和 `BlockParty` 等平台会先对艺术家进行审核并要求申请。对于社交媒体经验极少的新手来说，加入这些平台可能很难。\n\n## 3.\
  \ 加入“CryptoTwitter”社区与你的同类建立联系\n\n这是开启加密艺术家职业生涯最有效的方法。在 NFT 环境中与其他收藏家和艺术家建立联系，是营销和销售艺术品的重要组成部分。大部分活动发生在\
  \ `Twitter`、`Discord` 群组以及少数几个 Facebook 社区中。通过 `Twitter` 开始并与人们互动非常容易，你可以利用 `Twitter`\
  \ 寻找要加入的 `Discord` 群组。`ClubHouse` 最近来一直是 NFT 成员喜爱的聚会场所。\n\n浏览 `KnownOrigin` 或 `MakersPlace`\
  \ 等市场上的艺术家，并在 `Twitter` 上关注那些引起你共鸣的艺术家；从那里开始，你可以很容易通过他人的推文和标签深入进入这个“兔子洞”。此外，不要忘记与人们聊天！与艺术家、粉丝和收藏家建立真诚的关系。在自己喜爱的艺术家作品下发表评论，表达你的想法并寻求反馈。\n\
  \n## 4. 了解你的风格\n\n作为一名艺术家，意识到自己的独特风格以脱颖而出至关重要。只有少数艺术家仅仅通过作品就能与他人区分开来。理解你的品牌、信息和个人风格。\n\
  \n## 5. 为收藏家创造价值\n\n目前，加密艺术领域正充斥着缺乏未来价值的短期、快倒机交易。对于收藏家和投资者想要什么，没有简单的答案，但可以假设他们希望向那些能够自我推销并在领域内发展的艺术家购买，同时也向那些长期坚持的人购买。通过一些卓越的事情（如特别发售）为长期持有者提供价值和兴趣通常是一个好主意。收藏家也喜欢稀缺性和独特性，因为他们知道拥有一个独特的版本或仅有\
  \ 10 份的限量作品。\n\n## 6. 向世界推销你的艺术\n\n不要害怕推销（炫耀/推广）你的作品！就像传统艺术一样，营销是销售数字艺术的巨大重要元素。随着使用该空间的艺术家数量增加，营销变得越来越至关重要。如果你在\
  \ `OpenSea` 或 `Rarible` 上销售，你将完全依靠自己的营销技巧，因为这些是向任何人开放的通用市场；因此，你需要确保你的艺术品被注意到。\n\n\
  查看哪些社交媒体平台最适合你的工作，不要害怕加入群组或在 `Twitter` 上自我推销，但不要过头。如果你在社交媒体上活跃，人们就会找到你的加密艺术简介。\n\
  \n如果你想为你的作品增加信誉和“品牌形象”，你需要一个网站和一个作品集。许多加密艺术网站会要求你提交作品集，因此准备好作品集总是一个明智之举。拥有网站让潜在的收藏家了解更多关于你和你的独特故事。收藏家不仅对艺术品感兴趣，他们对作品背后的故事和人感兴趣。\n\
  \n不营销自己的一种方法是在私信中大量发送你的加密艺术链接。这是懒惰的，而且几乎肯定会适得其反。如果你要传达关于你艺术的信息，请与你的受众互动。\n\n让你的信息独一无二。在公开帖子中不进行个性化就直接复制粘贴相同的信息，以及标出主要的收藏家或公司，都不是明智的主意。\n\
  \n## 7. 保持坚持\n\n请记住，加密艺术领域以及整个 NFT 都是非常新的。这只是开始，所以如果你没有立即成功，或者没有按照你预期的那样迅速，请不要沮丧。这个群体温暖且包容，每个人都愿意帮助彼此繁荣。与世界分享你的作品，根据需要进行修改，不要犹豫寻求帮助。\n\
  \n## 8. 为你的艺术品定价\n\n记住，在为艺术品定价时，你需要考虑 Gas 费和铸造费用（除非使用 `Cargo` 的魔法铸造功能或 `OpenSea`\
  \ 的免 Gas 铸造功能），作品的价格在 50 到 80 美元之间。要获得合理的利润，你的画必须贵得多。\n\n同样，如果你几乎没有为建立品牌做任何事情，你可能运气好卖几次，但你的职业很可能是短暂的。建立品牌需要时间和努力。\n\
  \n## 9. 从系列开始\n\n从出售包含 3 到 8 件艺术品的系列开始是一个好主意。系列应该有一个故事和主题。这会鼓励收藏家购买你的多个作品，因为拥有整个系列总是理想的。\n\
  \n## 10. 在虚拟宇宙展览\n\n当你对加密艺术领域有了更好的理解后，可以开始探索虚拟宇宙；`Decentraland`、`CryptoVoxels` 和\
  \ `Somnium Space`。这些虚拟宇宙每周都会举办艺术展。这是你推广自己作品、结识新朋友甚至进行采访的绝佳方法。你可以通过关注他们的 `Twitter`\
  \ 账户与运营画廊的人士互动。他们经常转发有关最新构建和展览的内容，因此你可以与他们建立联系并举办展览。\n\n祝所有通往加密艺术家的道路一切顺利。这个领域充满前景，每天都有许多新鲜且惊人的倡议。记住建立联系，表达你的个性，并继续创作！\n\
  \n# 结论\n\n非同质化代币（NFT）的流行正在迅速增长。它是人们在线上销售数字资产同时保持其真实性的新方法。尽管它是区块链生态系统中一个全新的领域，但根据其巨大的成功，我们可以相信它将长期存在。许多公司现在正使用这种新型代币来实现区块链技术。\n\
  \nNFT 是为客户创造难忘体验的良好方法。它们也是联系和接触你目标受众的极佳方式。\n\n\n\n\n© 版权 2022 Brendon Stock，区块链\
