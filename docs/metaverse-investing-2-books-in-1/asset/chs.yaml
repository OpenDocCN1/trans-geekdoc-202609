  \n# 第 8 章：山寨币\n\n## 什么是替代加密货币（Altcoins）？\n\n比特币的替代加密货币被称为山寨币（`BTCUSD`）。它们与比特币有某些相似之处，但在重要方面有所不同。例如，某些山寨币使用不同的共识技术来构建区块或验证交易。此外，它们可能通过提供智能合约或降低价格波动等新功能或改进功能，与比特币区分开来。\n\
  \n截至 2021 年 11 月，大约有 14,000 种加密货币。根据 `CoinMarketCap` 的数据，2021 年 11 月仅比特币和以太坊就占了加密货币总市场的约\
  \ 60%。剩下的由所谓的山寨币。山寨币的价格走势倾向于遵循比特币的路径，因为它们通常是衍生出来的。然而，分析师认为，随着加密货币投资生态系统的成熟以及这些代币新市场的出现，山寨币的价格波动将变得独立于比特币的交易信号。\n\
  \n## 理解替代加密货币\n\n“山寨币”一词指的是所有比特币的替代方案。它是“alternative”（替代）和“coin”（币）的结合。比特币和山寨币的核心设计非常相似。因此，它们共享代码，其功能类似于点对点系统，或像一台能够同时处理大量数据和交易的大型计算机。山寨币试图在某些情况下通过成为低成本的数字交易媒介来成为“下一个比特币”。\n\
  \n然而，比特币和山寨币之间存在重大差异。比特币是最早的加密货币之一，它的哲学和设计为后续货币的发展提供了模型。然而，它在执行上存在着重大缺陷。例如，工作量证明（`PoW`）是一种高耗能且耗时的共识技术，用于构建区块。比特币的智能合约能力同样也有限。\n\
  \n比特币在 2009 年发布后成为第一个被广泛应用的工作量证明应用（`PoW`）。\n\n许多其他加密货币基于 2 `PoW`，这允许安全的、去中心化的共识。\n\
  \n为了获得竞争优势，山寨币在比特币的感知缺陷的基础上进行构建。为了减少能量消耗以及构建区块和处理新交易所需，若干山寨币使用了权益证明（`PoS`）共识技术。\n\
  \n以太坊是世界市值第二大的加密货币，在 `Ethereum` 智能合约中被用作 `gas`（或交易费用支付）。山寨币经常解决以前对比特币的批评，例如可扩展性和可持续性，正如备受期待的\
  \ `Ethereum 2.0` 的引入所证明的那样。\n\n山寨币通过这种方式与比特币区分，为自己建立了一个市场。因此，它们吸引了将其视为可行比特币替代方案的投资者。随着山寨币变得流行、用户增加以及价格上涨，投资者期望获利。\n\
  \n## 山寨币的类型\n\n山寨币根据其功能和共识程序存在不同的形式和类别。以下是一些最重要类型的简要介绍：\n\n### 基于挖矿的\n\n基于挖矿的山寨币通过挖矿过程创建。`PoW`\
  \ 是一种系统通过解决挑战性问题来生成新货币以构建区块的机制，大多数基于挖矿的山寨币使用这种机制。基于挖矿的山寨币包括 `Litecoin`、`Monero`\
  \ 和 `ZCash`。2020 年初，大部分领先加密货币是基于挖矿的。预挖山寨币是基于挖矿山寨币的流行替代方案，通常包含在 `ICO`（`ICO`）中。这些代币在进入加密货币交易所之前，是通过算法分发而非制造的。来自\
  \ `Ripple` 的 `XRP` 令牌就是一个预挖币的例子。\n\n### 稳定币\n\n自诞生以来，加密货币的交易和使用以波动为特征。稳定币通过将其价值锚定到一篮商品（如法币、贵金属或其他加密货币）上，试图减少整体波动。这篮商品旨在当代币失败或出现问题时作为持有者的后盾。稳定币的价格波动不应超过特定范围。\n\
  \n来自 `Tether` 的 `USDT`、来自 `MakerDAO` 的 `DAI` 和 `USD Coin` 是著名的稳定币（`USDC`）。2021 年\
  \ 3 月，`Visa Inc.`（`V`）表示将开始在其网络上通过 `Ethereum` 区块链使用 `USDC` 结算选交易，计划在同年晚些时候扩展稳定币结算能力。\n\
  \n### 证券令牌\n\n证券令牌与股票证券相似，但它们具有数字起源。证券令牌与传统股票相似之处在于，它们通常以所有权或股息分配的形式向持有者提供股权。此类令牌增值的潜力是投资者投资它们的巨大动力。\n\
  \n`Exodus` 一家比特币钱包公司在 2021 年执行了符合证券交易委员会标准的 `Reg A+` 代币出售，出售了价值 7500 万美元的转换为 Algorand\
  \ 的股票。由于这是第一个提供美国发行公司股权的数字资产证券，这是一个历史性事件。\n\n### 梗因币\n\n正如其名，梗因币基于笑话或对知名加密货币的幽默模仿。它们经常在短时间内获得流行，著名的加密货币影响力和普通投资者为了寻求快速利润在网上推广它们。例如，`Tesla\
  \ Inc.`（`TSLA`）的 CEO 兼加密货币爱好者 `Elon Musk` 经常对 `Dogecoin`（`DOGUSD`）和 Shiba Inu Inu\
  \ 等著名的梗因币发布加密推文，这对它们的定价产生巨大影响。例如，2021 年 10 月，当马斯克分享了他的柴犬幼犬 `Floki` 坐在 `Tesla` 里的照片时，Shiba\
  \ 在 24 小时内飙升了 91%。在 2021 年 4 月和 5 月这些特定山寨币暴涨期间（被许多人称为“梗因币季节”），数百种加密货币仅凭投机就获得了巨大的收益。\n\
  \n首次代币发行（`ICO`）是加密货币行业相当于首次公开募股（`IPO`）（`IPO`）。首次代币发行（`ICO`）是公司为开发新币、应用程序或服务筹资金的一种方式。\n\
  \n### 实用令牌\n\n实用令牌用于提供网络内的服务。例如，它们可以用于购买服务、支付网络费用或兑换奖品。与证券令牌不同，实用令牌不支付股息也不需要所有权。相反，实用令牌（如\
  \ `Filecoin`）用于购买网络存储空间。\n\n## 山寨币值得投资吗？\n\n\n\n\n\n山币行业仍处于早期阶段。这是一场实力悬殊的较量。在过去的十年里，加密货币交易所列出的山币数量呈爆炸式增长，吸引了大量试图通过价格波动获利的普通投资者。另一方面，这些投资者缺乏产生实质性市场流动性所需的资金。此外，由于缺乏监管且市场薄弱，山币价格极易受到瞬息万波动的影响。\n\
  \n以太坊的`ether`为例，它在 2018 年 1 月 12 日达到了 1,299.95 美元的峰值。几周后跌至 597.36 美元，到年底已暴跌至 89.52\
  \ 美元。然而，这种山币在两年后的 2021 年 11 月达到了近 4,750 美元的新高。使用定时交易的交易者可以赚取大量资金。\n\n然而，存在一个问题。加密货币市场仍处于婴儿阶段。尽管多次尝试，但加密货币仍然没有正式的投资标准或指标。山币市场的主要驱动力是投机。许多“僵尸”加密货币的案例在收集了投资者资金后，未能获得普及或直接消失。\n\
  \n因此，愿意在不受监管且波动的市场中承担巨大风险的投资者可以考虑山币。他们还应该应对随价格大幅调整带来的焦虑。对于这类投资者来说，加密货币市场可以产生丰丰的利润。\n\
  \n### 优点\n\n-   山币是比特币的“改进版本”，旨在解决加密货币的缺陷。\n-   稳定币像山币一样，可以履行比特币作为日常交易媒介的最初承诺。\n\
  -   像以太坊的`ether`和卡尔达的`ADA`一样，某些加密货币已经获得了广泛的认可，从而导致了高价格。\n-   投资者有大量的山币可供选择，每种山币在加密经济中都有特定的用途。\n\
  \n### 缺点\n\n-   与比特币相比，山币的投资市场要小得多。截至 2021 年 11 月，比特币在全球加密货币市场的份额为 42%。\n-   由于缺乏监管和既定的投资标准，山币市场的特点是投资者较少且流动性有限。因此，与比特币相比，它们的价格波动更大。\n\
  -   并不总是容易辨别山币及其许多应用之间的区别，这使得投资选择变得更加复杂和困惑。\n-   几种“僵尸”加密货币吞噬了投资者的资金。\n\n### 山币的未来\n\
  \n19 世纪导致国家印刷美元被采用的情况，为关于山币未来实际上是加密货币未来的论证提供了模型。在那期间，各种类型的地方货币在全美流通。每种货币都有独特的个性的，并配有独特的金融工具。例如，黄金证书由财政部的黄金储备支撑。用于资助内战的美国联邦钞则由政府支撑。\n\
  \n地方银行也印制自己的货币，有时由虚假的储备支撑。货币和金融工具的多样性反映了当前山币市场的现状。如今市场上有数千种加密货币，每种都声称满足不同的用途和市场。\n\
  \n根据当前山币市场的状况，单一加密货币似乎不太出现。另一方面，加密货币交易所列出的 1800 多种山币中，大多数不太可能生存。相反，一组具有极佳可用性和应用场景加密货币将占据主地位。\n\
  \n山币是投资者实现资产多元化的极佳选择。然而，在投资之前，投资者应该做好功课。投资山币的风险与比特币相似，甚至更大。\n\n\n\n\n\n## 2. 花些时间了解市场历史。加密货币市场每天\
  \ 24 小时、7 天候开放。在交易量较低时，重大价格波动通常发生在清晨。加密货币有时会飙升 400%，有时会下跌 80%，有时某些硬币几个月内毫无波动……你将很难预测这些情况中哪一个会发生发生。如果你在行情良好的时期进入市场，可能会认为情况总是是这样，但事实从未如此。有时\
  \ `BTC` 上涨，而山寨币下跌，有时山寨币似乎占据了主导地位，有时一切都在涨又跌，以此类推。当然，一切不会一直上涨的，但当上涨时，那个阶段也不会持续太久（而且在你睡觉或周六晚上在外面时，情绪很可能发生变化）。只有研究和/或经验才能让你应对各种可能的比特币世界。\n\
  \n## 3. 认识到市场具有波动性，并且虽然投资加密货币是合法的，但你所承担的许多风险是巨大的……有些甚至看起来像是在赌博（类似于垃圾股投资；这确实是投资，但如果你\
  \ `HODL`，你必须准备好损失投资金额的 80% 到 100%）。\n\n## 4. 谨慎且保守。通过保持投资负担在范围内并随着时间的推移逐渐进入市场，你可以减轻许多日常生活压力。一种合理的技术是将加密货币投资限制在可投资资金的\
  \ 1%–4%，且单次入场不要不超过该金额的 10%。如果你能使用止损来降低风险，并使用技术分析来指导你的市场择机，会更好。\n\n## 5. 对市场要有长期观点。除非你的方法需要如此，否则尽量不要过度陷入当下。相反，选择一种策略和一种投资对象，坚持下去，并对市场保持长期观点。随着知识的增加，在过程中调整策略是可以的，只需确保你心中有一个计划和目标即可。你要么投资、交易，或者两者兼顾。如果你在投资，尽量将交易减少到最低，并避免过度关注当天的美元价值。如果你在交易，请关注你的美元价值，并避免在峰值\
  \ `HODLing`。\n\n## 6. 注意你的情绪。大多数时候，你的情绪会让你亏钱。你只有在运气好时在底部 FOMO 买入或在顶部恐慌抛售，那纯属运气。始终依靠数据，永远不要依靠你的直觉、心或其他任何仅基于数据的判断。`FOMO`（错失恐惧症）是一个大忌。\n\
  \n## 7. 从小开始。从少量资金开始，一旦你确定一切运作良好，再逐渐增加金额。此指南适用于交易所之间的转账、测试机器人或 TA 分析方法、交易以及个人之间的资金转账等。\n\
  \n## 8. 理解税收影响和规则。这里有一些法规以及复杂的税收规则。如果你提前计划，没有什么是不可能的，但同样不能忽视。作为一个一般原则，如果某事在正常生活中具有争议性（在线赌博、在暗网购买物品、不交税等），那么在加密货币领域至少是可疑的。\n\
  \n## 9. 识别当前趋势。如果你能区分牛市和熊市，你的处境会好得多。\n\n## 投资加密货币：基础\n\n如果你记住以上所有点，并计划策略性地投资或交易你喜欢的加密货币，对市场的波动历史有良好的认知，并且知道该使用哪些交易所……那么是时候选择一或两种投资/交易策略来实施了（这比在没有明确离场计划的情况下一次性投入所有资金要好得多）。\n\
  \n以下是一些你可能感兴趣的通用投资方法。\n\n### 今天全仓投入并“仅仅 HODL”（尽量避免这一种）：\n最简单的方法是今天全仓投入并“仅仅 HODL”。这种方法的问题等同于走到轮盘桌旁把所有筹码都押在黑色上。虽然事实确实如此，但这种策略缺乏复杂性。如果你未能抓准市场的绝对底部，你可能会发现自己眼睁睁看着账面财富消失，除了削减亏损或等待外没有其他选择。\n\
  \n**底线：** 长期买持有可能是星球上最聪明的策略……直到它不再明智为止。你应该始终为投资准备好退出策略。当牛市结束时，获利或卖出通常是一个好主意。然而，如果你在寻找长期投资，买入持有是一个可行的方案，而且任何价格通常都是足够的。尽管如此，这种方法面临着在峰值全仓投入并一路\
  \ `HODLing` 直到底部的风险。这可能会非常痛苦，所以看看其他替代方案。\n\n### 在 HODLing 之前建立平均仓位：这是一种简单且保守的方法，可以减轻你应对每日价格波动的负担。你可以无视价格定期购买，或者随着价格随时间推移而时增量买入。通过几个月甚至几年建立长期仓位来避免市场择机失误是避免这种情况的好方法。同时，当收益随处出现时，你可以获取部分或全部收益（如果以后看到更具吸引力的价格，再将这些重新投资）。人们也可能希望逐渐退出。通过随着时间推移逐渐加入和退出仓位，你可以在投资的同时降低风险。对于像\
  \ `Bitcoin` 这样波动、高风险、高回报的资产，这可以是一个极佳的策略。此外，你可能支付长期资本利得税而非短期资本利得税（后者约为一半），并且你会避开交易者在申报复杂的加密货币税务时面临的问题。\n\
  \n**底线：** 对于新投资者来说，分批买入并 `HODLing` 是最佳选择。毫无疑问，没有竞争。它类似于“全仓投入并 HODL”，但它在市场反向波动时为你提供了更多的喘息和操作选择。当然，在一个壮观的上涨之前开始这种方法并不有趣，但在那种情况下，只需为你在上涨前的买入感到高兴即可。你很可能在短期内获得低买的机会，而且你已经做好了准备！在某些情况下，保守意味着牺牲短期利益以换取审慎。十次其九，这是一个划算的权衡。\n\
  \n\n\n\n\n为了低买高卖，你不需要了解比买卖加密货币以外太多的知识。在在你认为是低位时买入（例如在价格下跌几天后的任何价格），然后在价格较高时卖出。如果你犯了错，可以设置止损，也可以选择“被套”（基本上，如果你犯了错，就退回到“建立平均仓位并持有”的方法）。如果你想在这一领域成为专业人士，你需要学习技术分析（`TA`）。你可以利用\
  \ `TA` 根据支撑位、移动平均线和其他指标来做出买卖决策。如果你判断正确，`TA` 可以帮助你提高交易的获利能力；但如果你判断错误，它可能会让你产生心理压力。如果你决定进行交易，请留意费用和投资组合的消耗。在震盘市场中，经验丰富的交易者表现可能优于\
  \ HODLer（长期持有者），在负面环境下，他们也可能优于后者（因为交易者更擅长卖出并持有现金）。交易者（尤其是新手交易者）可能会错过一些短线且剧烈的行情，因为他们往往在追逐最后一种表现良好的币种时跌入深底，同时错过了下一个。如果你没有时间或精力每天\
  \ 24 小时全天关注不可预测的加密市场，请考虑只用总可投资资金的一部分进行交易。成为一名合格的加密货币交易者需要时间和纪律（尽管这非常有趣）。\n\n**总结：**\
  \ 交易是有趣的，如果你技术精湛、遵守纪律并且精通技术分析，它可以成为最获利的方法。由于各种复杂原因，“新手”在交易中很可能会被“爆脸”（rekt）。没有人指望通过交易来战胜\
  \ HODLer，但根据我的研究，大多数人确实在这样做。在通变得更优秀的道路上受一点挫折是可以的，但不要欺骗自己认为你已经成功了，而实际上你还没有。因为你可能还没准备好，所以请从小额买入开始，不要频繁交易。\n\
  \n**提示：** 你可以进行币币交易来帮助增加你对特定币种的持仓。然而，这比看起来要困难，并可能导致你错过行情……请记住这一点。\n\n## 投资交易机器人\n\
  \n交易机器人是为你处理交易的计算机程序。它的主要优势是它可以在你睡觉时执行你的指令。它消除了所有与睡眠相关的焦虑。如果你打算交易，花时间和精力和资金设置并管理机器人可能是值得的。你不需要对它做任何事情；只需让它为你设置止损，或者如果你了解基础的\
  \ `TA`，就让它在 2 小时以上的 K 线上交易“死叉”和“金叉”（这种策略非常常见，因此你在任何时间框架上都应该意识到它；如果所有人在没有额外参数的情况下都将其自动化……每一次交叉都会比现在更加波诡云谲）。\n\
  \n**总结：** 对于一个既不是业余程序员、又缺乏交易和 `TA` 基本知识的新手交易者来说，交易机器人可能要求过高（这门槛并不高，但有一些障碍和学习曲线）。一旦你掌握了这项技术，它将带走你一天大部分压力。如果市场暴跌，你可能无法在凌晨\
  \ 4 点卖出。你可能没有坐在电脑旁准备买入你在工作时出现的金叉……但你的机器人可以……而且它只根据事实做出决策。通过消除你的情绪，让你的加密机器人为你做出合理的决策。\n\
  \n![](img/image00722.jpeg)\n\n**注意：** 我在上面提到 `MACD` 交叉是一种 `TA` 技巧，是因为价格上涨时，短期平均线必须跨越长期平均线，价格下跌时反之亦然。其他技术指标更具预测性，并有助于定义概率。相比之下，`MACD`\
  \ 交叉只是一个必然现象（这使得它们适合专注于投资而非日内交易的长周期框架机器人）。\n\n通过关注比特币的 `MACD`，你可以对市场趋势有一个大致的了解。\n\
  \n## 使用交易机器人投资\n\n“交易机器人”是一个误导性的。当你使用交易机器人时，你不需要活跃地交易。它可以用于收集币种或控制风险（设置止损和止买，或者你也可以只在图表极度看空时退出仓位，并在它们反转的瞬间重新入场）。你可以通过选择保守的低风险/低回报技术来保护或增加你的资金。你可能知道你想投资比特币，但这并不意味着你想在\
  \ 80% 的跌幅中死守。你的情绪可能会干扰你，但你的机器人不会，所以告诉它你想要什么，然后离开即可。\n\n**结论：** 如果你打算利用机器人，请从这种策略开始。对于想要进入加密市场但不想成为殉道者、无论市场如何都\
  \ HODL 所拥有的所有币种的中级投资者来说，这是一个极佳的选择。\n\n## 套利\n\n你知道你可以在一个交易所以较低价格获取某种币，并在另一个交易所以更高的价格卖出吗？在交易所之间进行操作（或简单的“套利”）就是这种行为的名称。套利可能非常丰厚，但你必须迅速行动。你可以使用机器人，但你必须授予机器人提现权限，这可能会让你感到不太舒服。\n\
  \n**总结：** 由于加密货币在交易所之间传输需要时间，这是一种具有欺骗性的风险且充满陷阱的操作。然而，如果一切运行正常，它非常简单且有利。这不适合新用户，但它是你工具箱中值得努力的目标。\n\
  \n\n\n\n加密货币市场比传统股票市场更有波动，受如印度 `SEBI` 等监管机构的监管，交易的是挂钩金融资产，且全天 24 小时运行。因此，你应该意识到加密货币市场容易发生快速的情绪波动。跟踪市场历史或特定加密货币的表现、投资者情绪、加密生态系统的当前发展、熊市或牛市市场模式以及其他因素，将帮助你理解现状。\n\
  \n你不需要在价格上涨或下跌时都清空你的代币钱包。相反，为了增加信心，你应该选择你相信的货币，研究它们的`whitepaper`，检查它们的团队和路线图，并查看它们使用的技术。\n\
  \n接下来，拥有一个目标明确且定义良好的投资策略将帮助你度过最艰难的时期。最后，考虑你打算持有该货币的时间：几分钟、几小时、几天、几个月甚至几年。或者，你也可以决定是进行日内交易还是长期“拿住（bag\
  \ hold）”代币。\n\n要交易或处理代币，请使用声誉良好的加密货币交易所。例如，印度著名的加密货币交易所 `WazirX` 允许你以想象中最安全、最快速且最方便的方式进行交易。\n\
  \n## 2 不要把所有鸡蛋放在一个篮子里\n\n加密领域是一个波动巨大的环境，诸如 `Tezos` 技术团队内部的微小纠纷，或马斯克在 Twitter 上大喊“DOGE,\
  \ DOGE, BABY DOGE”之类的事件可能会摧毁或建立市场。因此，投资单一货币是不明智的。相反，应该投资多种代币以实现投资组合多元化。对于新手来说，除\
  \ `Bitcoin` 之外的市值前 10 位的加密货币（如 `Dash`、`ETH`、`XRP`、`Litecoin`、`Cardano` 等）是最安全的选择。\n\
  \n**代币投资额外贴士：** 投资尚未达到其全部增长潜力的加密货币，随着代币受欢迎程度的，你的投资将随时间增加数倍。\n\n## mc 订阅表单\n\n```css\n\
  {background:#fff; clear:left; font:14px Helvetica,Arial,sans-serif; }\n```\n\n在你网站的\
  \ CSS 或此样式表块中，添加你自己的 Mailchimp 表单样式覆盖。此代码块和之前的 CSS 链接应移动到 HTML 文件的 HEAD 部分。\n\n\
  ### 优先获取 WazirX 新闻\n\n```javascript\n(function($) {window.fnames = new Array();\
  \ window.ftypes = new Array();fnames[0]='EMAIL';ftypes[0]='email';}(jQuery));\n\
  var $mcj = jQuery.noConflict(true);\n```\n\n## 3 信仰基础\n\n与标准股票不同，代币远比可交易的金融工具要得多。它们有自己具体的目标。有些有助于调节货币价格，另一些有助于加速支付流程，还有一些有助于增强平台的透明度和问责制，例如像\
  \ `Ethereum` 或 `NEO` 等智能合约平台，或去中心化存储网络 `Filecoin` 或 `Storj`。与其依赖舆论，不如使用这种双管齐下的方法来评估币的基本面：\n\
  \n- 为了估计代币的寿命，请评估概念的可行性、实用性和范围。\n- 检查公司未来的合作伙伴关系和发布对公司市场表现的影响。\n\n**代币投资额外贴士：**\
  \ 与其投资不同“类别”的币，不如在类别内部实现投资组合多元化以降低风险。\n\n## 4 避开情绪，关注技术\n\n数字化的证据不支持 FOMO（恐慌错过）或任何直觉、肝胆或心脏情绪。然而，通过学习技术分析的一些复杂之处，你可以增加加密投资回报。你可以简单地判断价格是上涨还是下跌、波动还是保持不变，并此调整你的投资计划。例如，如果你知道某个代币的\
  \ 50 日 `SMA`（简单移动平均线），一旦该代币的价格开始移动到其 `SMA` 之上，你就可以发现正向的价格波动。\n\n另一个重要的技术指标是代币的 `ATH`（历史最高点）价格。你可以算出当前价格占该代币\
  \ `ATH` 值的百分之几。如果你在交易前定期研究这些信号，你将能够做出更明智的交易选择。\n\n## 5 我应该质押（Stake）、挖矿还是持有（HODL）？\n\
  \n根据你投资的代币，有许多方法可以增长你的加密投资：\n\n- 从资产中获得被动收入安全、简单且快速的方法是持有加密货币。你只需要一个安全的加密钱包和一个可靠的交易所来投资代币。此外，你可以小额多次地获取加密货币，并随着时间的积累持仓。\n\
  - 质押（Staking）是一种通过在网络上冻结或质押加密货币并赚利来获取被动收入的方法。\n- 你还可以通过挖掘代币获得每月分红。想要通过挖矿赚奖励的人应该考虑云挖或加入矿池，因为单机挖矿既贵又费力，特别是对于\
  \ `Bitcoin` 。\n\n## 6 保护你的加密货币投资\n\n你必须在多元化游戏中保持聪明以对冲你的加密资产。那么实现这一点的最佳方法是什么？为了开发跨市场的投资组合，请跳出思维，将资产分散到加密货币之外的股票、黄金和其他传统工具。一个包含股票和加密货币的投资组合可以帮助你克服加密市场的高相关性。简单来说，占据加密市场\
  \ 45% 的 `Bitcoin` 上涨趋势总是会导致更广泛的加密市场的类似趋势，反之亦然。因此，在市场崩溃时，没有可以依赖的加密加密资产。所以，如今巨额投资基金试图将两者结合起来并不奇怪。\n\
  \n## 7 从小开始，目标流动性。\n\n在全投入加密货币市场之前，先进行尝试。从小投资开始，随着时间的推移逐渐建立你的投资组合。一旦你明白处于正确的道路上，就无法回头了。另一种让资金流动并倍增的简单方法是定期交易。\n\
  \n为了确保安全并保持加密投资的流动性，流动性是至关重要的。投资者经常选择交易量适中的代币。这个决定可能会导致劣势。虽然代币价格可能会多次上涨，但你无法出售它们来获利。即使你可以卖出大量币，价格也因为缺乏流动性而暴跌。那么，你如何保持安全？不惜一切避免低交易量的加密货币！\n\
  \n# 第 10 章\n# 元宇宙中的十大商业模型\n\n元宇宙的什么让它如此吸引人？从技术角度来看，`blockchain` 为所有数字资产提供了可执行的产权。从互联网发展的角度来看，3D\
  \ 和多媒体长期一直是主流趋势。互联网向着更生动的方向进化，从文本通信演变为照片、视频和直播。元宇宙结合了两个观点：它基于区块链技术，并遵循内容丰富的的趋势。那么，未来的元宇宙会有什么样的商业模型？\n\
  \n### NFT 销售\n\n画廊是现在元宇宙最流行的商业模型，这可能源于 `NFT` 与艺术之间的内在关系。许多元宇宙最初成员是画家或在艺术领域工作。在韩国社区，`CryptoVoxels`\
  \ 的作品包括刘家兴的“纯金画廊”、宋廷的“熊猫画廊”、BCA 画廊和 Doge Sound Club。这是元宇宙第一个且最流行的商业模型。\n\nVox 销售\n\
  \n\n\n元宇宙与现实世界不同，它由不同的材料组成。例如，`CryptoVoxels` 中的所有结构和可穿戴设备完全由 `voxels` 组成，即三维网格上的数字值。因此，`CryptoVoxels`\
  \ 需要使用 `vox`，它充当建筑装饰或个人展示。为了满足这一需求，许多 `vox` 商店应运而生，其中 `voxWalk` 是这一商业概念最显著的例子。\n\
  \n## 元宇宙中的十种商业模式\n\n贵公司未来可能需要购买虚拟广告牌，在 `Discord` 等平台与粉丝互动，并与 `Jadu` 或 `The Fabricant`\
  \ 等公司合作生产虚拟资产。它们将成为实体业务与增强现实及虚拟现实之间的桥梁。元宇宙将创造出复杂且创新的广告活动，模糊物理世界与虚拟世界之间的界限。\n\n###\
  \ 建筑\n\n一些土地主拥有许多地块，但缺乏时间和精力来进行建造。其他土地主则聘请专家团队建造其地块以开发自己的品牌。由于这种需求，元宇宙出现了诸如 `MetaEstate`\
  \ 和 `Voxel Architects` 等第三方建筑服务的增长。在 `CryptoVoxels` 的主岛 `Origin City` 上，累计访问人数最多的四个结构——`SpaceAge`、`StoneAge`、`GlassAge`\
  \ 和 `Welcome` 都是由 `Voxel Architects` 创建的。`MetaEstate` 还建造了知名且美丽的结构，例如 `MetaChi`\
  \ 总部和 `Creation Fashion Hub`。\n\n### 数字地块租赁\n\n数字包就像现实世界中的房地产一样，可以被租赁和收购。根据 `CV\
  \ Analytics'` 的发现，许多土地主拥有大量地块。大多数土地主并不打算建造其地块，而是选择长期投资。因此，形成了一个自然的土地租赁市场，允许土地主将其闲置的物业租赁给其他因开发或运营而需要这些物业的人。\n\
  \n### 沉浸式体验\n\n那些过度专注于设计氛围而忘记现实的人是处于沉浸状态的。当哈利·波特升起移动椅、与《变形金刚》跳上塔楼，以及小黄 `Fiddle`\
  \ 在北京环球影城一起嬉闹时，这种表面上可感的体验实际上是一种精神上的沉浸。因此，元宇宙是一个基于专业建筑设计和沉浸式 3D 体验的自然环境。\n\n### 游戏\n\
  \n由于其虚拟性质，游戏很容易集成到元宇宙中。`The Sandbox` 是一个社区驱动的区块链游戏平台，允许设计师将体素资产和游戏小道具转换为 `NFTs`。当然，游戏也可以整合到其他元宇宙平台中。玩家可以在参与链上游戏投资\
  \ `NFT` 的同时享受乐趣。\n\n### 服装销售\n\n在某些方面，元宇宙永远无法取代现实世界。例如，衣服、食物、住房和交通都是基础物质需求。特别是在线服装销售已从过去引入\
  \ 2D 进展到直播试穿，现在正向未来的 3D 迈进。事实上，看别人穿衣服和自己试穿的效果不同。例如，你可以使用 3D 扫描仪将你的 3D 虚拟衣服穿在你的 3D\
  \ 虚拟形象身上。\n\n### 在线 KTV\n\nKTV 是喜欢它的人的一种社交形式。对于居住得远的人来说，在现实世界的 KTV 见面是很的。然而，这些愿望在元宇宙中可能会实现。\n\
  \n### 数据服务\n\n数据无处不在，元宇宙也不例外。例如，平台需要访问数据。在元宇宙中，有十种不同的商业模式。\n\n\n\n\nPalmer 透露，沃达丰商务正在为移动设备开发虚拟身份钱包。此外，在题为《元宇宙、Web\
  \ 3.0 虚拟云经济》的最新研究中，Greyscale Research 讨论了多宇宙中的**主权身份**概念。该研究将**主权身份**描述为一种“互联网原生社交声誉币（创作者币）”，并提到来自其他平台的数据可以导入元宇宙，并被用于身份识别或信用评分。\n\
  \n在讨论期间，西班牙电信（Telefonica）全球供应链战略与转型负责人 Angel Garcia 描述了元宇宙的数字供应链如何帮助电信运营商提高效率。根据\
  \ Garcia 的说法，西班牙电信已经创建了一个将用于元宇宙生态系统的区块链网络。他接着表示，该机构正在积极收集数据以优化端到端的运营。他说：“下一个阶段将是这些业务运营的自动化，并为所有人进行集中化管理。”\n\
  \n新兴 X 的创始人 Rowan Fenn 认为，X 是一家为寻求构建自主数字组织的公司提供企业解决方案，企业可以拥有其自治组织的**数字孪生**，以管理、运营和控制模拟过程：“这些组织能够在多宇宙中进行实时互动和交易。”这将允许自主数字群体进行协作。\n\
  \n根据 Fenn 的说法，在元宇宙生态系统中拥有数字孪生的公司将能够用更少的资源产生更多的商品和服务。因此，他认为通过使用这种业务模式，世界将从有限经济转向无限经济。\n\
  \n企业已经在元宇宙中使用区块链技术。\n\n虽然企业正在研究在元宇宙中实施业务模式的早期用例，但某些行业已经在付诸实践。根据 Herkelrath 的说法，例如，保险业对区块链网络的使用证明了元宇宙业务模式。\n\
  \n根据 Herkelrath 的说法，通过虚拟生态系统，全球范围内的农民出售了数十万份保险合同。他接着表示，构建在区块链网络之上的智能合约以及如 `Chainlink`\
  \ 这样的去中心化预言机，使得克服保险行业的透明度问题成为可能。此外，整个保险流程已经过精简，使其能够面向全球偏远客户提供服务。\n\n尽管看起来似乎是区块链本身实现了这一点，但\
  \ Herkelrath 指出，保险公司创建的智能合约需要如果没有元宇宙无法获得的数据：\n\n“你拥有一个由公司组成的元宇宙，其中流入的数据经过更广泛网络的确认，这使得这种方案具有可行性。”\
  \ 这种情况可以在元宇宙中发生，表明点对点的交易可以变得任何任何地的任何人都能负担得起并获得。\n\n## 企业有多大可能采纳元宇宙？\n\n虽然一些企业开始设计和使用元宇宙业务模型，但对技术的缺乏理解可能会减缓采用速度。在小组讨论期间，德国化学品和消费品公司汉高（Henkel）的区块链负责人\
  \ Rodolfo Quijano 博士表示，目前驱动采纳的主要问题是意识到元宇宙能带给企业的价值：\n\n“技术本身不是问题；尽管如此，人们需要更多时间来理解区块链是什么，以及它与传统的企业资源计划工具相比如何。”\
  \ 在元宇宙中寻找采纳区块链的推动者可能是困难的。\n\nPalmer 说：“对于电信运营商来说要解决的最大问题是如何连接元宇宙中的个人，”并补充说，元宇宙企业环境内的可扩展性也是关注点，如何让组织掌握如何转型并参与这项新技术亦是如此。\n\
  \n## 元宇宙中的营销\n\n数字营销人员必须跟上元宇宙的潮流。这包括理解其全部潜力。数字营销人员必须记住，元宇宙不仅仅是一个转瞬即逝的时尚；它似乎将成为未来的趋势。\n\
  \n### 随着元宇宙的扩张，营销人员可能会采用哪些技术？\n\n数字营销人员必须首先记住千禧一代和 Z 世代作为目标受众的相关性。这些代也对元宇宙感兴趣，例如\
  \ `Roblox` 和虚拟现实。基于这一想法，让我们来看看如何在元宇宙中进行营销。\n\n### 在现实生活中进行营销\n\n创建与现实相关或与你目前的业务类似的营销体验。例如，今年六月，百时（InBev's\
  \ Stella Artois）与 `Zed Run` 合作创作了电子宠物主题的肯基赛。他们这样做是因为该公司以支持体育活动闻名。\n\n## 沉浸式体验是关键\n\
  \n你可以在元宇宙中销售虚拟广告。例如，视频游戏广告公司 Bidstack 已经从户外广告转向虚拟广告牌。\n\n然而，虚拟广告牌并非唯一选择。由于元宇宙天然具有吸引力和沉浸感，利用这一点为你的广告和营销活动提供类似的体验是明智的。例如，提供用户可以互动的品牌设施和活动，而不仅仅是展示广告。\n\
  \n先驱者已经为消费者提供了沉浸式体验，例如 `Roblox` 中的 Lil Nas X 演出、`Gucci Garden` 访问，以及华纳兄弟对《高地》（In\
  \ the Heights）进行的虚拟华盛顿地区营销。\n\n### 收藏品应该是可用的\n\n人们喜欢收集物品，元宇宙为他们提供了另一个渠道。通过提供只有在元宇宙中获得的资产或限量物品，你可以在元宇宙中复制这种体验。\n\
  \n例如，在 `Gucci Garden` `Roblox` 体验可以找到“收藏室”。它允许用户在元宇宙中收集限量版 Gucci 产品。该游戏的初始收藏品销售为\
  \ Gucci 总共赚了 2860 万 Robux。\n\n### 参与现有社区\n\n大众普遍非常反感广告。因此，对于尝试进入元宇宙的企业来说，避免得罪那里的人的人至关重要。因为你正在向这些用户进行营销，所以你还需要他们的积极反馈。\n\
  \n必须记住，在不考虑新格式的情况下无法简单地进入新平台。例如，企业通过与 `Roblox` 开发者社区的成员合作构建商品和体验来获得影响力。同样，当 O2 在\
  \ Fortnite 上举办活动时，他们寻求了已经熟悉该游戏的代码人员的帮助。\n\n\n\n\n这是一个影响者营销的示例。因为用户生成的内容如此重要，社区成员对于您的营销活动的成功至关重要。\n\
  \n## 持续实验\n\n营销人员正处于一个令人兴奋的时期。虽然某些指南可以帮助营销人员确定应该采用哪些方法和手段，但元宇宙仍然是一个相对新的平台，有很大的实验空间。最佳实践仍在建立中，整个运作范式也仍在发展中。因此，营销人员有很大的自由去尝试新事物，并在战术上发挥创意。\n\
  \n## 其他值得关注的元宇宙案例\n\n- Dimension Studio 为时尚公司进行的元宇宙实验赚取了 650 万美元的收入。他们设计了一个虚拟制片场景，允许消费者走上一个平台，通过\
  \ 106 台摄像对其身体进行扫描，然后放置在虚拟世界中试穿服装和其他物品。他们因参与巴黎罗登堡（Balenciaga）2021 年秋冬“Afterworld”游戏的工作而广闻名。\n\
  - 开放世界沙盒游戏《侠盗猎手 V》（Grand Theft Auto V）提供了与香港示威者使用的类似的服装选项。许多艺术家已利用虚拟世界表达自己的政治观点，而香港的示威者可以将他们的斗争从现实世界转向元宇宙。\n\
  - 用户可以在家居装饰网站 Houzz 上创建他们的家具和其他家居物品的数字照片集。每当有人使用 Houzz 购买物品时，他们就能赚钱。在 2017 年，他们创建了一个\
  \ 3D 查看器，允许客户直接通过摄像头查看 3D 产品，并在视觉上将其整合到他们的实际环境中。\n- 为了步行导航，Google Maps 展示了一个增强现实应用。用户可以利用此功能获取精确的视觉方向和箭头，帮助他们到达目的地。只需将用户的摄像头指向需要去的方向，AR\
  \ 功能就会引导他们走向正确的方向。\n\n# 第 11 章\n\n# 从元宇宙获利\n\n长期以来，虚拟场所和世界一直流行。人们通过《模拟城市》和 GTA 系列等游戏沉浸在虚拟环境中。虚拟世界被称为“元宇宙”（MetaVerse），由于这些游戏风靡全球，它们成为了未来技术的成功补充。\n\
  \n随着时间的推移，元宇宙已经进步到人们开始认为这项技术对地球具有经济优势的地步。遗憾的是，在融入这种世界观之前，元宇宙只是没有现实依据的虚拟工具。\n\n另一个显著影响市场总体状况的领域是加密货币和区块链。由于区块链的广泛采用，市场已经出现了基于实际和工业的解决方案。因此，基于数字的技术有望接管其为世界其他地区提供基于货币的解决方案的角色。\n\
  \n事实上，元宇宙建立在科幻的基础上。它由两个前缀组成：“meta”意为“超越”，“verse”意为“宇宙”。元宇宙是所有已构建的连接互联网的虚拟世界的最终结果。通过增强现实和虚拟现实技术，已经产生了可以进行虚拟通信并拥有端到端区块链加密数字资产的化身。这是一个虚拟现实环境，人们在自动生成的设置中进行相互互动。\n\
  \n元宇宙已经存在了一段时间了，但底层技术尚未为大众市场带来无许可的身份、金融服务或高速交易。相反，加密货币和区块链开发了一套共享和存储数十亿数据的系统，以在虚拟世界和现实世界之间建立基于现实的连接。\n\
  \n随着元宇宙越来越关注将区块链技术作为这些平台的“引擎”，元宇宙的整个运作理念发生了剧烈变化。因为元宇宙是虚拟世界，它们一直有一套金融系统。在区块链成为虚拟世界的一部分之前，这些游戏货币没有价值，因为它们缺乏物理形式。在区块链整合到元宇宙现象后不久，“去中心化”的概念影响了这些平台。基于区块链技术的平台拥有自己的\
  \ NFT 和加密货币，这些被用于创建、拥有和货币化虚拟资产。该技术的突破之一是，允许通过元宇宙专用的 NFT 市场将 NFT 兑换为现金，从而确立真实价值。Axie\
  \ Infinity、Decentraland 和 SecondLive 都是成为商业现象的虚拟世界示例，允许用户通过成为其中的一部分来发财。\n\n## 投资元宇宙的最佳方式是什么？\n\
  \n随着元宇宙作为一种运行在区块链上的系统变得常态化，人们接触到了各种类型的进入方式。因此，投资者可以根据其运行方式，以主动和被动的两种方式在虚拟世界中投资。\n\
  \n用户积极参与游戏并参与虚拟环境之中。作为一个完整的世界，元宇宙有许多种类别，每种类别都有自己的一套应用程序。参与游戏并成为元宇宙一部分的参与者可以赚取 NFT\
  \ 代币（元宇宙运行的代币）。这些获得的代币在金融世界是有价值的，并且可以在任何元宇宙的市场上交易。此外，用户可以选择将代币换成主要的加密货币。\n\n用户可以在专注于主动投资风格的同时，对元宇宙进行被动投资。在整个元宇宙（或\
  \ NFT 元宇宙）中使用的 NFT 代币在加密货币世界具有货币价值。随着项目的增长，它可以在各种交易所和平台上市。此外，投资者可以在交易所或平台汇汇总资金以获得利润，因为它是几个\
  \ IDO（首次代币发行）和启动板的一部分。这带我们来到了投资者在元宇宙中被动参与的终点。\n\n另一种可能被认可的元宇宙投资策略是投资者购买元宇宙 ETF 进行风险敞口。交易所交易基金（ETF）是证券和安全资产的集合，在股票市场上像股票一样进行交易。投资者可以通过元宇宙股票\
  \ ETF 投资于已经在加密生态系统中拥有强大地位的公司。\n\n## 元宇宙如何能帮助你赚钱？\n\n随着元宇宙作为一种运行在区块链上的系统变得常态化，人们接触到了各种类型的进入方式。因此，投资者可以根据其运行方式，以主动和被动的两种方式在虚拟世界中投资。\n\
  \n用户积极参与游戏并参与虚拟环境之中。作为一个完整的世界，元宇宙有许多种类别，每种类别都有自己的一套应用程序。参与游戏并成为元宇宙一部分的参与者可以赚取钱和\
  \ NFT 代币（元宇宙运行的代币）。这些获得的代币在金融世界是有价值的，并且可以在任何元宇宙的市场上交易。此外，用户可以选择将代币换成主要的加密货币。\n\n\
  用户可以在专注于主动投资风格的同时，对元宇宙进行被动投资。在整个元宇宙（或 NFT 元宇宙）中使用的 NFT 代币在加密货币世界具有货币价值。随着项目的增长，它可以在各种交易所和平台上市。此外，投资者可以在交易所或平台汇总资金以获得利润，因为它是几个\
  \ IDO（首次代币发行）和启动板的一部分。这带我们来到了投资者在元宇宙中被动参与的终点。\n\n另一种可能被认可的元宇宙投资策略是投资者购买元宇宙 ETF 进行风险敞口。交易所交易基金（ETF）是证券和安全资产的集合，在股票市场上像股票一样进行交易。投资者可以通过元宇宙股票\
  \ ETF 投资于已经在加密生态系统中拥有强大地位的公司。\n\n## 元宇宙如何能帮助你赚钱？\n\n参与游戏是用户提供的在元宇宙中赚钱的最易理解的解释之一。因为这些元宇宙使用了“边玩边赚”（Play-to-Earn）模式，你只需玩游戏就能赚大量的钱。\n\
  \n从元宇宙获利的另一种方法是通过被动投资。人们被敦促在投资前对项目完成功课。发现项目卓越的用例和路线图，无疑可以在短时间内给你带来巨大的利益。\n\n作为一项技术，元宇宙正在进步十倍。有很多东西可以展示，因为这些系统是无限的，能够在虚拟世界中执行广泛的功能。由于我们都认为元宇宙的范围是无限的，许多用例可以得以实施。\n\
  \n\n\n\n\n虚拟世界和元宇宙（Metaverse）为连接数字世界与物理世界提供了一种逻辑策略。区块链是其中一个出现并彻底性分分这种联系的最显著因素之一。此外，元宇宙为用户提供了大量的替代方案，并从中获得了巨大的益处。\n\
  \n# 第 12 章：在元宇宙中购买房地产的分步指南\n\n通过增强现实（AR）、虚拟现实（VR）和视频的结合，元宇宙是向现实世界数字化迈出的一步。用户可以在虚拟宇宙中使用他们的数字分身在虚拟世界中工作、娱乐并与朋友交流。元宇宙中有很多可以做的事情，从组织会议到进行虚拟环球之旅无有许多。\n\
  \n另一方面，房地产似乎正吸引投资者的注意力。据报道，每周都有前所未有的数百万美元购买订单，元宇宙中的物业交易量已成为新闻头条。\n\n要购买虚拟物业，你必须首先在\
  \ `Decentraland`、`The Sandbox` 或 `Axie Infinity` 等元宇宙平台注册。然后，要在元宇宙中进行交易，你只需要一个资金充裕的数字钱包。接着，你可以通过将美元转换为如\
  \ `ether` 等加密货币，或你所交易元宇宙的原生货币（如 `MANA` 或 `Sandbox`）将资金存储在数字钱包中。\n\n在元宇宙几乎完整的生态系统支持下，你可以在数字世界购买、租赁、翻新甚至出售房屋，且所有权基于非同质化代币（`NFTs`）。以下是在元宇宙中购买房地产的分步指南：\n\
  \n1. 访问元宇宙的多个物业市场之一（如 `Decentraland`、`Axie Infinity` 或 `Sandbox`）并登录。\n2. 比较可用地块的价格。\n\
  3. 选择你想要购买的地块后，点击它以获取更多信息。重要的是，特定的平台将允许你购买，例如 `Decentraland` 使用 `MANA`。\n4. 下一步是将你的数字钱包连接到账户。为此，你需要一个合适的钱包，`Metamask`\
  \ 是目前最流行的钱包。\n5. 至关重要的是，使用加密货币为你的数字钱包充值。在获得大多数平台的支持下，你只需点击 `购买` 按钮即可完成你所选择的土地。\n\
  6. 完成交易后，你购买的土地将以 `NFTs` 的形式存储在数字钱包中。因此，在你的数字钱包中进入该页面查看你新购买的土地。\n\n## 购买房地产前应了解的事\n\
  \n与房地产不同，在元宇宙中，如果平台崩溃，你拥有的土地将会消失。需要注意的是，加密货币具有巨大的波动性。此外，由于元宇宙房地产是一个较新的资产类别，许多方面尚待探索。因此，在做出决定之前，充分研究元宇宙的优缺点是必要的。\n\
  \n# 第 13 章：元宇宙与网络\n\n三个主要的网络方面——带宽、延迟和可靠性——对于大多数读者来说是最关键的。但另一方面，这些限制影响了我们如何构建元宇宙产品和服务。\n\
  \n### 带宽\n\n带宽经常与速度混淆，尽管它指的是在给定时间内可以发送的数据量。元宇宙比大多数互联网应用和游戏的要求高得多。`Flight Simulator`\
  \ 是理解这一点的最佳方法。\n\n历史上最真实、规模最大的模拟是 `Flight Simulator`。它包含了地球上几乎道路、山脉、城市和机场，以及 2 万亿棵独立渲染的树和\
  \ 15 亿栋建筑。然而，`Flight Simulator` 需要 2.5 PB（即 250 万 GB）的数据来实现这一点。消费者设备（或大多数企业设备）无法存储这么多数据。\n\
  \n即使它们可以，`Flight Simulator` 也是一种实时服务，会根据现实天气和空中流量（包括精确的风速和风向、温度、湿度、雨水和照明）发生变化。因此，你可以沿着商业飞机的相同航线进入真实的风暴。\n\
  \n`Flight Simulator` 通过在你的计算机上保存少量数据来工作（就像任何主机游戏一样，而不是云游戏服务如 `Stadia`）。然而，当用户在线时，`Microsoft`\
  \ 会根据需要向本地设备传输大量数据。想象现实世界中的飞行员，当他们飞过山脉或转弯时，新的光线信息涌入他们的视网膜，展示并确认那里有什么。在那之前，他们只知道那里有东西。\n\
  \n\n\n\n# 虚拟孪生系统\n\n虚拟孪生系统（也称为镜像世界，如 `Microsoft Flight Simulator`）必须模拟现实世界中几乎无限（且可证明的）变异性。这意味着需要发送多得多（即更重）的数据，而不是“这里有一朵乌云”或“有一朵与乌云\
  \ `C-95` 相似 95% 的乌云”。相反，它是一朵看起来完全模一样的乌云。最重要的是，这些数据是实时更新的。\n\n最后一点的重要性无论如何强调都不为过。如果我们在一个巨大的、实时、共享且持久的虚拟世界中进行交互，我们需要大量的云流数据。\n\
  \n## 对比：现实世界 vs. 堡垒之夜\n\n将“现实世界”与 `Fortnite` 中的地图进行对比。地球上的每个人同时且在同一地点沉浸在同一个模拟环境中。如果我砍了一棵树，这棵树对所有人来说都是不可逆转地消失了。在玩\
  \ `Fortnite` 时，只有固定的、特定时间版本的地图。而且你在地图上做的任何事情都只与少数几人共享，并且在重置前持续有限的时间。砍树合法吗？它会在 1-25\
  \ 分钟内重置，而且最多只对其他 99 名用户消失过。地图只有在 `Epic Games` 发布新版本时才会更新。如果 `Epic Games` 决定将你的宇宙广播给世界其他地方，他们会选择你的宇宙，忽略他们自己的，并在指定期间内设定你的宇宙。这对于许多虚拟体验是可以接受的。它也足以各种元宇宙特定的体验。然而，某些（尽管并非所有）体验要求所有用户在任何时候都保持一致。\n\
  \n## 云数据流传输需求\n\n如果我们希望流畅地在不同的虚拟世界之间导航，也需要云数据流传输。例如，`Fortnite` 中的 `Travis Scott`\
  \ 演唱会将玩家从游戏主区域送到一个从未见过的深海，然后到一个从未见过的行星，最后进入深层太空。`Epic` 通过在活动开始几天或几小时通过典型的 `Fortnite`\
  \ 补丁将所有这些游戏世界发送给玩家实现了这一点（当然，这意味着任何在活动前没有下载并安装更新的人无法参加）。然后，在每个场景期间，在每个玩家的设备上后台加载相应的场景。这种方法非常有效，但它要求发行商预知用户将访问哪些世界以及提前多久访问。你必须下载所有可用方案（这是不可行的），或者如果你想从大量位置中选择，则对其进行云传输。\n\
  \n## 玩家与环境数据\n\n除了额外的环境数据，还有更多的玩家数据。当你现在在 `Fortnite` 中看到朋友时，`Fortnite` 服务器只需要为你提供有关他们所在地和正在尝试完成的信息；动画（如装弹突击枪或坠落）已经加载到你的设备上，只需要运行即可。然而，当实时动作捕捉映射到朋友的头像时，这些详细信息也必须随我们其他人一起提供。如果你想在游戏中观看视频文件（如\
  \ `Fortnite` 有时会这样做），你需要通过虚拟世界来实现。听到观众群的空间音频？也是。你是否曾有路人擦过你触感背服的肩膀？也是。\n\n## 带宽与网络拥塞\n\
  \n许多玩家在线时已经面临带宽和网络拥塞。\n\n## 延迟的挑战\n\n延迟是最困难的问题：数据从一个城市传输到另一个城市并返回的时间。这就是为什么现代游戏会出现问题的原因。人类的延迟感知极低，特别是在游戏中。\n\
  \n\n\n\n\n例如，大多数高保真多人游戏都是基于服务器区域的。游戏发行商可以通过将玩家名单限制在位于美国东北部、西欧或东南亚的玩家，来减少地理延迟。这种聚类方式非常有效，因为游戏是一项休闲活动，通常是一到三个朋友一起享受的。毕竟，你不太可能和住在不同时区的人一起玩游戏。而且，无论如何，你并不在乎那些你不认识的对手（你通常甚至无法与他们交流）住在哪里。尽管如此，根据\
  \ `Subspace` 的数据，中东约四分之三的互联网连接不在动态多人游戏的可玩延迟范围内，而只有四分之一位于美国和欧洲。这主要是由于宽带基础设施的限制，而不是服务器放置的位置。\n\
  \n### 网络代码解决方案 (Netcode Solutions)\n\n网络代码解决方案也用于多人在线游戏，以确保同步和一致性，并保持玩家的参与度。基于延迟的网络代码指令玩家设备（如\
  \ `PlayStation 5`）延迟渲染所有者的输入，直到延迟更高的玩家（即其对手）的输入到达。这会让拥有低延迟肌肉记忆的玩家感到不悦，但它确实有效。回滚网络代码（Rollback\
  \ netcode）更为先进。如果对手的输入被延迟，玩家设备将按照其预期操作。如果发现对手执行了不同的操作，设备将尝试撤销进行中的动画，然后“正确”地重新播放。\n\
  \n对于 1v1 游戏（例如 `2D 战斗游戏`）、微小的延迟问题（例如 `40ms`）以及具有狭窄高预测行为范围的作品，这些解决方案非常有效（例如驾驶游戏）。遗憾的是，对于\
  \ `2D 战斗游戏`，随着我们扩展到具有更多玩家、更多延迟变化和更多动态场景的元宇宙宇宙体验，这些解决方案的性能会下降。要预测十几个玩家如何协作且准确地行动，然后以一种非破坏的方式将其“回滚”是非常困难的。更好的做法是直接断开缓慢玩家的连接。虽然视频会议可能有多个参与者，但在任何时刻只有一个是相关的，这导致了“核心”延迟。在游戏中，从所有参与者处获取适当的信息至关重要，而延迟会加剧这个问题。\n\
  \n对于大多数游戏来说，低延迟并不是问题。《炉石传记》和《朋友间的对对单词》都是回合制和异步游戏，但《王者荣耀》和《糖果大亨》不需要像素级完美或毫秒级的输入。低延迟仅适用于如《堡垒之夜》、《使命召唤》和《极限竞速》等快节奏游戏。这些游戏是有盈利能力的，但从创建的作品数量来看，它们仅占总游戏市场的一小部分——在总游戏时间方面更是如此少。\n\
  \n### 元宇宙与社交互动\n\n虽然元宇宙并不是快速节奏的 AAA 游戏，但由于其社交属性和预期的重要性，它确实需要极延迟。微妙的面部动作在人类对话中至关重要，我们对细微的错误和同步困难非常敏感（这就是\
  \ CGI 计算机生成图像中的“恐怖谷”问题）。社交产品的普及也依赖于此。想象一下，如果 `FaceTime` 或 `Facebook` 只有在你的朋友或家人距离你\
  \ 500 英里以内才能工作，会是怎样。或者，你可能只在家里时使用它们。在虚拟世界中，如果我们想利用国际或远距离劳动力，需要的不仅仅是额外的带宽。\n\n###\
  \ 基础设施挑战\n\n遗憾的是，延迟是所有网络特征中最难解决且最耗时的一项。部分问题源于如前所述，只有少数服务和应用程序需要极低延迟的交付。这限制了任何网络运营商或专注于延迟的内容分发网络\
  \ (`CDN`) 的经济可行性——而且基础物理法则已经在挑战着其商业可行性。\n\n从纽约到东京或孟买，距离为 11,000–12,500 公里需要 40–45\
  \ 分钟。这满足了所有低延迟要求。然而，尽管光纤构成了互联网骨干的大部分，但由于很少处于真空中，其速度比光速慢了 30%（损失通常为 `3.5 dB/km`）。铜缆和同轴电缆的距离延迟衰减和带宽限制更为糟糕，导致拥堵增加和交付延迟。尽管如此，这些电缆仍然是住宅和商业建筑内部以及社区内发现的大多数。\n\
  \n此外，这些电线都没有按照直线飞行路径铺设。我们通常所说的“互联网骨干”是私有网络的松散联盟，其中任何一个网络都无法正确交付数据包（或者没有动力将某些路段交换给具有更快路段的竞争对手）。因此，两个服务器之间或服务器与客户端之间的网络距离可能大于它们之间的地理距离。此外，网络拥塞会导致数据路由更加不直接，以确保持续和持续交付，而不是降低延迟。这就是为什么纽约和东京之间的平均延迟是光在两地之间旅行时间的四倍以上，纽约和孟买之间是光在两地之间旅行时间的四到六倍。\n\
  \n任何基于电缆的基础设施更新或中继都是昂贵且复杂的，特别是当目的是减少地理距离时。它还需要广泛的监管/政府批准，通常涉及多个层级。但当然，无线网络更容易修复。`5G`\
  \ 无疑有所帮助，因为它平均将 `4G` 延迟降低了 `20–40ms`（并承诺延迟低至 `1ms`）。然而，这只协助了最后几百米的数据传输。之后，在数据到达基站后，你就回到了标准的骨干网络。\n\
  \n### 卫星与未来技术\n\n`Starlink` 是 SpaceX 的卫星星座公司，承诺为美国以及世界其他地区提供高带宽、低延迟的互联网。然而，这并没有考虑到极延迟，特别是长距离。虽然\
  \ `Starlink` 从家里到卫星的往返时间为 `18–35 毫秒`，但数据必须从纽约旅行到洛杉矶再返回。毕竟，需要通过许多卫星进行中继。在某些情况下，Starlink\
  \ 会让旅行长度变长。例如，当旅行到低轨道卫星并返回时，纽约到费城的直线距离约为 100 英里，电缆传输可能是 125 英里，但旅行到低轨道卫星再返回则超过 700\
  \ 英里。\n\n此外，光纤的损耗率低于通过环境传输的光线，特别是在阴天时。人口稠集的城市区也很嘈杂，容易受到干扰。埃隆·马斯克在 2020 年表示，`Starlink`\
  \ 专注于“电信公司难以触及的棘手客户”。通过这种方式，它欢迎了更多人进入元宇宙，而不是增强那里已有人的体验。\n\n\n另一方面，Fastly 提供的是一个优先考虑低延迟应用而非交付可靠性和带宽的\
  \ CDN。该公司通过一种“基础设施即代码”的方法，允许客户端自定义其边缘计算集群的几乎每一个方面。该公司声称，软件应用程序可以在 `150ms` 内清除并替换全球所有此类集群中的所有缓存内容，并且可以实时缓存和加速单个区块链交易。\n\
  \n## 可靠性\n\n可靠性的概念是不言而喻的。我们转向虚拟工作和教育的能力依赖于稳定的服务质量。这包括整体开机时间以及下载/上传带宽和延迟恒定性等因素。对于如今许多“生活在网上”的人来说，下文提到的大部分内容可能让他们感到心惊——在大多数时候，Netflix\
  \ 以 `1080p` 甚至 `4K` 分辨率流媒体传输。但另一方面，Netflix 使用的可靠性解决方案并不适用于游戏或特定针对元宇宙的应用程序。\n\n像\
  \ Netflix 这样的非直播视频提供者在视频发布给观众之前，几个月就已经获取了所有的视频文件。这使得他们能够进行深度分析，通过研究帧数据来减少（或压缩）文件大小，以确定哪些信息可以被删除。例如，Netflix\
  \ 的算法会“观看”一个蓝天场景，并判断如果观众的连接带宽下降，`500` 种不同的蓝色调是否可以简化为 `200`、`50` 或 `25`。流媒体商的算法会逐场景地考虑这一点，理解有对话的时刻可以比快节奏动作的场景承受更大的压缩。这被称为多路编码。正如前文所述，Netflix\
  \ 使用额外的带宽在用户需要之前将内容传输到其设备，因此如果连接出现瞬时波动或延迟增加，终端用户也不会受到影响。\n\n此外，Netflix 会本地节点预加载内容，因此当你请求《奇奇物语》（Stranger\
  \ Things）的最新剧集时，距离你只有几个区块之遥。这对于直播视频或数据是不可行的，正如之前提到的，这些内容必须更快地到达。这就是为什么云流传输 `1GB`\
  \ 的 Stadia 比云流传输 `1GB` 的 Netflix 要困难得多。\n\n因此，虽然元宇宙的目标本质上并不具有竞争性，但我们应该将其视为将网络各个方面——延迟、可靠性/韧性和带宽——的标准提高到\
  \ AAA 多人游戏的水平。如果你的设备无法及时获取所需的所有数据，那么无论设备有多强大都没有区别。\n\n# 结论\n\n毫无疑问，元宇宙将对我们的社会产生深远的影响。它将改变我们交流、自我营销和品牌化的方式。此外，这项尖端技术将带来新的机遇，带来挑战。元宇宙能够释放巨大的创造力，同时拓宽我们的经济、娱乐和文化视野。\n"
