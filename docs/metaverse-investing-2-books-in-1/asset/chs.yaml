- "# 元宇宙投资：2本合1\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n### 在元宇宙中购买房地产的逐步指南\n\
  \n### 元宇宙与社交网络\n\n\n# 引言\n\nNFT 正在席卷游戏和艺术世界——但它们究竟是什么呢？\n\n你最近可能在新闻标题中看到过 `NFT`\
  \ 这个词，特别是当涉及到巨额资金时（6930 万美元这个数字听起来眼熟吗）？然而，你可能在想这到底在闹闹什么。如果你不确定 `NFT` 是什么，或者它们究竟是如何运作的，我们在这里为你提供帮助。\n\
  \n本指南将讨论你了解 `NFTs` 所需的所有知识，包括它们的运行机制、它们为何会引起争议以及你可以如何参与其中。如果你决定创建自己的 NFT，可以使用这款出色的数字艺术软件。\n\
  \n### 什么是 NFT？\n\n`NFT` 本质上是一种数字收藏品资产，作为加密货币的形式持有价值。正如艺术品被视为一种保值的投资一样，`NFTs` 也是如此。但它是如何做到的呢？\n\
  \n让我们先拆分这个词。`NFT` 代表 `Non-Fungible Token`（非同质代币）——一种数字令牌，类似于加密货币 `bitcoin` 或 `ethereum`。然而，与普通的\
  \ `Bitcoin` 币不同，`NFT` 是特殊的，不能等物交换（因此是非同质的）。\n\n那么是什么让非同质代币比普通的加密货币更特殊呢？文件存储了额外的信息，这使其超越了纯货币并进入了特定领域。`NFTs`\
  \ 的类型非常多样，但它们可以以数字音乐和艺术文件的形式存在——任何可以被数字化存储并被认为具有价值的独特物品。它们本质上就像任何其他物理收藏品，只不过你得到的是一个\
  \ `JPG` 文件（例如），而不是收到一幅可以挂在墙上的画布油画。\n\n### NFT 是如何运作的？\n\n`NFTs` 属于 `Ethereum`（以太坊）区块链，因此它们是内部存储了额外信息的个人令牌。这些额外信息是关键元素，它让艺术、音乐、视频（等等）能够以\
  \ `JPG`、`MP3`、`video`、`GIF` 等形式成型。因为它们具有价值，所以可以像其他类型的艺术品一样被购买和出售——其价值由市场和需求决定，就像物理艺术一样。\n\
  \n然而，市场上并不是一种 `NFT` 艺术品只有一个数字版本。正如原作的艺术复制品被制作、购买、使用和出售一样，`NFT` 的副本仍然是 `Blockchain`（区块链）的有效部分——但它们的价值与原作不同。\n\
  \n而且不要认为你通过右键点击并保存 `NFT` 图像就破解了系统。这并不会让你成为百万翁，因为你下载的信息不包含 `Ethereum` 区块链信息。\n\n\
  ### 我可以在哪里购买 NFT 令牌？\n\n`NFTs` 可以在各种平台上购买，这取决于你选择购买什么（例如，如果你想购买棒球卡，最好的选择是 `digitaltradingcards`\
  \ 这样的网站；然而，更通用的作品在其他市场上出售）。你需要为你购买的平台准备一个特定的钱包，并且需要向钱包充入加密货币。正如 `Beeple's Everyday`——在佳士比拍卖的前\
  \ 5000 天（上所示）的销售证明，这些作品也开始进入更多主流的拍卖行。那件 `Beeple` 作品以 6930 万美元的价格成交。\n\n由于对许多类型 `NFT`\
  \ 的需求量大，它们经常以“发售”（drops）的形式发布（就像活动在不同时间发布批次机票一样）。这意味着你需要在发售开始时注册，并提前为钱包充值。\n\n`NFTs`\
  \ 还作为不同视频游戏中的道具购买引起了波澜（这让各地的父母感到非常高兴）。这些资产可以由玩家购买和出售，包括独特的剑、头像或皮肤等可玩资产。\n\n### 谁在使用\
  \ NFT？\n\n`NFTs` 正处于风口，`NFT` 艺术的创作者包括艺术家、游戏玩家以及文化领域的品牌。事实上，似乎每天都有新的玩家加入 `NFT` 市场。\n\
  \n对于艺术家来说，进入 `NFT` 空间增加了创作和分享艺术的另一种格式和空间，并为他们的支持者提供了不同的支持作品的方式。从小型易制作的 `GIFs` 到更宏心的作品，艺术家可以为公众提供多种购买艺术并在过程中获利的方式。\n\
  \n我们简要讨论了在视频游戏中制作 `NFTs` 的人，这正在动摇视频游戏中购买资产的想法。直到现在，从游戏中购买的任何数字资产仍然属于游戏公司——玩家只是在玩游戏时临时使用它们。但\
  \ `NFTs` 意味着资产所有权转移给了实际买家。\n\n\n\n\nNFT 在创作过程中消耗了大量的能量。抗议者对这种狂热可能带来的真实环境影响表示担忧。`CryptoArt.wtf`\
  \ 是一个为了计算 `NFTs` 碳足迹而创建的平台，数据显示名为“新冠”的作品自创建以来已消耗了 192 kWh 的电。这相当于一个欧盟居民两周的总能量摄入。但你可能会问，这一定是一件巨大的吧？不，一个“简单”的\
  \ GIF 可能就等同于这种消耗。\n\n在一次采访中，@beeple 表示：“我可以向你保证，我所有的作品不仅是碳中性的，而且是碳负负的，”他说道。我确定许多人会要求他履行这一承诺。\n\
  \n艺术家可以创作碳中性艺术品（Beeple 已经承诺以后将这样做）。然而，由于加密货币系统的构建方式，问题变得更加深层次。\n\n`Bitcoin`、`Ethereum`\
  \ 等货币是基于“工作量证明机制”（例如一系列复杂的谜题）构建的，以保护用户的财务记录。`Ethereum` 使用的能量大约相当于整个利比亚国家。\n\n`ArtStation`\
  \ 正因其对气候的影响如此关注，以至于在遭到巨大的反弹后做出了出售 NFT 的决定。然而，由于机构正在努力改变，这种情况可能并不总是那样具有争议。\n\n##\
  \ 任何人都可以制作 NFT 吗？\n\n既然你已经看到这里了，你可能在想：任何人都可以参与吗？嗯，人们会推测是这样的，考虑到 Trevor Andrew 画画了一个\
  \ `Gucci Ghost` 并成功以 3,600 美元的高价卖掉了。\n\n从技术上讲，任何人都可以出售 `NFT`。任何人都可以创作作品，将其转换为 `Blockchain`\
  \ 上的 `NFT`，并在选定的市场上出售。你可以为文件添加佣金，每当有人购买该作品时，你都会获得报酬；任何时候购买此物品——即使是转售——他们都要付钱。就像你购买\
  \ NFT 一样，你需要一个钱包，里面必须充满加密货币，而预付资金的要求正是复杂性所在。\n\n隐藏费用可能高得望而却步，因为每笔交易都会收取“燃料”费用（完成交易所需的能量量），以及销售和购买费用。转换费用以及根据一天中时间的价格波动也应考虑在内。这意味着费用总和将远高于你出售\
  \ `NFT` 所获得的价格。然而，不同的网站附带的费用不同，有些比其他的要好。\n\n无论 NFT 是否会长久存在，它们都是超级富豪的新玩具，而且确实有真钱可赚。NFT\
  \ 为数字艺术提供了新的意义，拍卖中看到的价格显示它是艺术及大众收藏品未来的一部分。\n\n# 第 1 章# 为什么 2021 年和 2022 年将是非同质化代币（NFTs）之年\n\
  \n`ICOs` 2017 年，`Smart Contracts` 2018 年，`Stablecoins` 2019 年以及 `Defi` 2020 年。现在是时候交接炬了：2021\
  \ 年的 NFT。\n\n人们喜欢收集东西这并不是秘密。你收集的物品种类取决于你的兴趣和热情，或者取决于这些收藏品是否在情感上引起你的共鸣。\n\n想想你小时候可能收集过邮票、宝可梦卡牌、视频游戏、海报、书籍，甚至是玻璃弹。成年后，你的收藏看起来可能完全不同。也许现在你收集时尚鞋子和包、科技产品、古董或艺术品。或者你可能仍在收集小时候收集过的那些东西。\n\
  \n但如果数字和虚拟世界可以扩展你的实体收藏呢？如果 UFC 粉丝可以收集并拥有他们喜爱的康纳·麦格戈（Conor McGregor）时刻呢？Nike 粉丝穿着你最爱的鞋穿梭于虚拟游戏世界又如何？如果你可以拥有一直偷偷渴望的宠物龙呢？想象一下拥有一个可以放入口袋并带到任何地方向家人朋友展示的虚拟数字艺术画廊。拥有你最喜欢的明星纪念品和幕后稀有物如何？嗯，你可能不需要想象太久了，因为随着非同质化代币（NFTs）的出现，你最疯狂的梦想和幻想可以在加密世界中变成数字现实。这里向所有星际迷粉丝预告一下，他们很快将以交易卡的形式拥有威廉·夏特纳（William\
  \ Shatner）的记忆，其中一张将是夏特纳拥抱老友利昂德·尼莫（Leonard Nimoy）的照片。\n\n在过去的几个月里，NFT 已成为世界私语的来源，并是\
  \ 2021 年加密世界焦点的有力竞争者。趋势的浪潮定义了加密世界相对短暂的历史：2017 年的 ICO 热潮、2017-18 年智能合约平台时代、2018-19\
  \ 年稳定币时代以及 2020 年的 DeFi 热潮。\n\n2020 年的 DeFi 热潮。`DappRadar` 项目经理 Ilya Abugov 最近告诉\
  \ Cointelegraph：“NFT 现在有更大的热度。在某种程度上，它是 DeFi 刺激的延伸。”\n\n## 什么构成了非同质化代币？\n\nNFT 是代币化的资产，如艺术品、收藏品或房地产。非同质化资产拥有个体特征和属性，使其具有价值和独特性。\n\
  \n看看 `bitcoin` 的出现，加密世界在过去十年中一直被主导环境的同质货币所占据。“同质性”是一个具有简单前提的复杂概念。它说的是资产的可交换性，如果交换两个物品没有意义，那么这两个物品就是同质的。例如，如果两个人个人互相交换美元钞，在价值或意义上没有区别。只有当人们在意美元钞的序列号及其产地时，这种交换才会变成非同质化的。\n\
  \n换句话说，NFT 是世界上一切稀有且独特的东西。你记得你最喜爱的康纳·麦格戈时刻的例子吗？那个时刻可能永远不会有完全相同的复制或重复，这使其价值且独特。粉丝可以通过将那个精彩的时刻代币化来拥有或交易他们喜爱的时刻，将其独特特性写入智能合约。NFT\
  \ 可用于各种资产，包括虚拟收藏品、游戏物品、数字艺术、房地产等。但由于每个代币都是唯一的，它们无法像同质资产那样容易交换。例如，一辆非常稀有、旧且昂贵的汽车不能与普通汽车交换。`Decrypt`\
  \ 解释说：\n\nNFT 与同质加密货币的另一个原因是它们是不可分割的，你无法像交易 `Bitcoin` 那样交易碎片。例如，你不能把一张音乐会票切出一部分给朋友。\n\
  \n你们没有人能通过门票碎片绕过安全检查。\n\n![](img/image0709.jpeg)## 为什么 NFT 现在受到关注？\n\n2017–2020\
  \ 年 NFT 总市值演变。（来源：Cointelegraph）\n\nNFT 不是一个新概念，第一个类 NFT 的代币是 2012 年引入的 `Bitcoin\
  \ 2.X`（又称彩色币）。NFT 领域在 2019 年增长了 17%，并预计到 2020 年底按市值计算将增长 50%。这令人着迷，因为它反映了在短短两年内总值超过了\
  \ 2 亿美元。NFT 数据资源 `NonFungible.com` 报告称，自 2020 年 9 月以来，NFT 销售活动大幅增加，并一直高于之前的月份。2020\
  \ 年 9 月第一周的 NFT 销售额接近 100 万美元，Sorare（一种基于区块链的幻想足球牌游戏）突破了 22.1 万美元。这种势头没有放缓迹象，2020\
  \ 年 12 月第一周交易了价值 200 万美元的 NFT。根据 `CoinGecko`，NFT 的市值已超过其 2020 年的预测，并突破了 5.5 亿美元。\n\
  \n\n\n\n\n## 2019 年 12 月 8 日至 2020 年 12 月 8 日期间通过 NFT 项目历史传输的总美元金额概览。可视化了近期以美元计的\
  \ NFT 传输数量的增长，特别是对比一年的前三个月和后三个月。（来源：NonFungible.com）\n\n## CryptoKitties 热潮\n2017\
  \ 年 11 月的 CryptoKitties 热潮是首批爆发并吸引大量关注的 NFT 创业项目之一。\n\n`CryptoKitties` 是一款开发在`Ethereum`区块链上的游戏，允许用户收集、繁育和交换虚拟猫咪。该游戏在\
  \ 2017 年被认为减慢了`Ethereum`网络的速度，因为其高活跃度证明并说明了区块链在娱乐和休闲而非货币方面的案例。这些虚拟猫似乎吸引了数百万美元，而稀有的猫每只价值数百美元。\n\
  \n![](img/image00711.jpeg)\n\n`Dragon` 是迄今最昂贵的`CryptoKitty`，以`600 ETH` 售出（当时约合 17\
  \ 万美元）。\n\n`CryptoKitties`背后的公司 `Dapper Labs` 他们的简单目标是将`Blockchain`带给十亿人。根据联合创始人\
  \ `Mik Naayem` 的说法，他们选择娱乐和游戏作为目标市场是因为这是“让人们接触去中心化的更容易的方式”，而且“游戏玩家是理想的目标市场，因为他们已经理解了虚拟货币和虚拟世界”。他继续说道：“我们在构建`CryptoKitties`时试图做的是看我们是否能让从未用过区块链的人来使用它……并理解它为什么不同且有价值。”\n\
  \n他们取得了巨大的成功。`CryptoKitties`让新用户了解了`Blockchain`，并向数十万人介绍了`NFTs`的概念。\n\n## 2018-2019\
  \ 年的市场演变\n在 2017 年底的`CryptoKitties`热潮之后，`NFT`市场在 2018 和 2019 年保持相对停滞。根据`NonFungible`的年度报告，2019\
  \ 年是`NFT`生态系统稳定的一年，因为它在`ICO`狂热之后进入了“重组和稳定时期”。\n\n![](img/image00712.jpeg)根据报告，大多数`NFT`项目在过去两年的留存率较低，绝大多数在\
  \ 2019 年的使用时间三个月或以下。报告接着提到，当年只有约 10%的新生成`NFT`资产进行了流通，比例与 2018 年相似。\n\n`NFTs`传输的美元价值在\
  \ 2018 年增长了三倍，达到 1.59 亿美元的峰，随后在 2019 年下降到 1.52 亿美元。\n\n尽管在 2017 年的最初兴奋之后下降，`NFT`领域的新进展不断出现，许多活动和倡议在近几个月内势头良好。最近受比特币代码启发的艺术品以超过\
  \ 13 万美元出售，而巴黎圣日曼球员`Kylian Mbappé`的区块链交易卡以 66,850 美元售出，创造了新的销售记录。虽然`CryptoKitty\
  \ Dragon`仍然是售出的最贵非同质化代币，但独一无二的数字赛车`F1 Delta Time Apex Race Car \"1–1–1\"`（415.9\
  \ ETH，113,124 美元）以及虚拟现实网络`Decentraland`中名为`The Secret of Satoshi's Tea Garden`的土地（1.3M\
  \ MANA，80,663 美元）是 2019 年售出的两个最贵的`NFTs`。名人开始使用`NFTs`，例如`Paris Hilton`在 8 月拍卖了她的宠物猫`Munchkin`的加密绘画作品，价格为`40\
  \ ETH`（当时价值 1.7 万美元），以为慈善事业筹集资金。\n\n随着围绕`NFTs`的热度，大型企业和知名品牌已表现出参与该行业的兴趣。世界上许多知名品牌现在正在开发基于区块链的收藏品、游戏和虚拟世界。这包括国家橄榄联盟（`NFL`）、终极格斗冠军（`UFC`）、美国篮球协会（`NBA`）、一级方程式、路易威登（Louis\
  \ Vuitton）、耐克和三星等。这些大品牌的参与是向`NFTs`主流化接受的重要的一步。新用户通过他们热衷且熟悉的平台开始接触`NFTs`的概念。\n\n\
  `NFT`的唯一信息存储在其智能合约中，并注册在代币的`Blockchain`上。`NFTs`是`ERC-721`令牌，使用`Ethereum`区块链和协议。`ERC-721`令牌的主要特征是，当它被生成时只有一个。用户可以通过在智能合约中编写遵循简单模板的代码来创建他们的`ERC-721`令牌，然后添加关于代币的特殊细节。这些特殊细节可以包括所有者的姓名、安全文件链接或丰富的元数据。\n\
  \n`Enjin`的联合创始人兼首席技术官`Witek Radomski`创建了`ERC-1155`。`ERC-1155`标准是一种新标准，允许单个智能合约控制无限数量的代币。与只产生\
  \ NFT 并要求开发者为每个新代币部署新智能合约的`ERC-721`代币标准不同，`ERC-1155`标准允许开发者部署单个智能合约并在秒内无限地铸造新代币（同质化和非同质化）。`ERC-1155`合约现在支持\
  \ 40 多个游戏，因为为游戏创建的合约可以包含广泛的物品，从护甲、武器到治疗药和超级能力。而`ERC-1155`并不局限于游戏，可以应用于各种行业。\n\n\
  ![](img/image00713.jpeg)\n\n其他支持`NFTs`的区块链包括`TRON Foundation`、`NEO`、Dapper Labs\
  \ 的 Flow 区块链以及`eosio`。`NFTs`在连接买家和卖家的开放市场上进行买卖，例如`Decentraland's LAND`市场或`OpenSea`。\n\
  \n证明真实性、提供所有权和可传输性是`NFTs`的三个理想特征。\n\n### 真实性\n由于其标准化和智能合约的全面属性，`NFTs`具有独特的识别备和认证功能。用户知道每个\
  \ NFT 在世界上都是唯一的，因此它们不能被复制或重复，也没有收到伪造品的风险。因为区块链技术是透明的，因此也可以验证并证明其真实性。\n\n伪造和欺诈是许多领域（包括艺术和奢侈品）的主要问题，但根据`Coinlegraph`的，“运行\
  \ NFT 的区块链正在严打伪造——并为消费者提供了希望，让他们买到所付。”根据`Coinesk`的，知名品牌`Louis Vuitton`的母公司`LVMH`正顺应\
  \ NFT 浪潮，并计划启动一个区块链来证明其奢侈品的真实性。目标是为产品赋予 NFT，以便测试其真实性。还可以追踪单个手提包的生命周期历程，从鳄鱼农场到销售它的商店，以及之前买过和卖过它的各种所有者。\n\
  \n### 所有权\n得益于区块链技术，人们将开始真正拥有他们属于自己的东西。值得注意的是，由于智能合约和相关权利，NFT 只能由资产的所有者进行交易和交换。这意味着即使是\
  \ NFT 的发行者，未经所有者许可也无法复制或移动 NFT。\n\n\n\n\n\n多年来，游戏玩家一直在交易虚拟货币和资产，从《魔兽世界》中的黄金到《堡垒之夜》中的装饰性角色皮肤。然而，在传统游戏中，你并不真正拥有虚拟世界中的任何东西，因为该经济体系完全基于封闭市场。你可能为程序许可支付了\
  \ 60 美元，玩了一个月，完成了游戏，然后将其收起，却一无所获。换言之，由于你并不真正拥有游戏内货币或物品，你就无法将其兑换为法币，也无法将其带到另一款游戏中。然而，在区块链游戏世界，你拥有钱包中所有的代币化游戏内资产（以\
  \ `NFTs` 的形式），并可以在多个游戏中对它们进行交易、战斗、对决或竞速。无论是魔法剑、货币还是皮肤，一切都由你拥有并控制。在 2020 年“未来会议”关于“游戏的未来与非同质化代币”的小组会议上，Jesse\
  \ Reich 博士（`Splinterlands` CEO）详细阐述了拥有自己的财产如何成为一个单向阀：“一旦你开始拥有自己的剑和盔甲，以及你的角色和他们身上独特的特征，那种在另一款游戏中花费数百或数千美元却无法拥有其中任何物品的想法就会变得毫无吸引力。”Dapper\
  \ Lab 的 Naayem 表示同意，一旦玩家在虚拟空间中体验过独特性、所有权和稀缺性，在常规游戏中交付现金就完全失去了吸引力。\n\n\n由于 `NFTs`\
  \ 是去中心化的，它们不需要中央发行机构，且更容易传输。这使得用户能够参与无需许可的对点交易、交互和专业性市场，而无需处理那些可能减慢或复杂这种方法的侵入性第三方。\n\
  \n\n`NFTs` 正为所有创作者（视觉艺术家、游戏设计师、音乐家等）开辟新的收入来源。它们所代表的资产种类多样，包括虚拟收藏品、活动门票、房地产、身份文件、游戏物品、数字艺术、证书等，是让它们如此具有吸引力的原因之一。`WAX`\
  \ 的创始人 William E. Quigley 出了大胆的声明：\n\n“作为一种独特的娱乐媒介，`NFTs` 将与电影、音乐和视频游戏共存。每种非食用消费品都可以变成\
  \ NFT。” —— William E. Quiqley (WAX)\n\n得益于所有权证明和传输的便利，`NFTs` 确实开启了广泛的虚拟资产和现实可能性。\n\
  \n比特币和加密货币的交易与挖矿是当前加密市场的核心。然而，为了促进广泛采用，它离开这个时代。`NFTs` 正在推动这一进程，因为它们可以捕捉人们的心灵，并以一种同质化货币无法实现的方式让他们引入区块链世界。在\
  \ `CryptoKitties` 的案例中，Dapper Labs 的 Naayem 透露，“我们略超过 40% 的观众以前从未拥有过加密货币。”通过休闲和娱乐渠道将新用户引入加密世界，初学者更容易接触并理解去中心化和区块链技术所能提供的价值。Dapp\
  \ Radar 项目经理 Ilya Abugov 告诉 Cointelegraph：\n\n“零售用户最容易理解的用例是艺术和收藏品，因此这可能是一段时间内炒作的焦点。如果我们看到一款有趣的游戏和更多艺术家加入生态系统，这一趋势就可以在主流中获得动力。然而，`NFTs`\
  \ 开启了从资产代币化到文档化的一系列新可能性。” —— Ilya Abugov (Dapp Radar)\n\n\n目前的 NFT 用例集中在艺术、游戏、收藏品和虚拟世界等主要类别上。然而，其他类别如时尚、运动和现实资产也在稳定增长。虚拟土地投资者\
  \ @Dclblogger 列出了 `NFT` 生态系统正在颠覆的二十行业。\n\n### 收藏品 (Collectibles)\n\n从销售额来看，收藏品目前是\
  \ `NFTs` 最受欢迎的应用之一，占上个月总销售额的约 23.6%。`CryptoPunks` 出于 2017 年 6 月，此后售价高达数千美元，是 `Ethereum`\
  \ 上最早的收藏类 `NFTs` 之一。它们在 `ERC-721` 引入之前创建，必须为它们创建一个包装器（wrapper）才能在 `OpenSea` 等交易所进行交易。`CryptoKitties`\
  \ 自 2017 年 11 月推出以来已成为最著名的收藏品之一，销售总额超过 3800 万美元。\n\n随着 `NFT` 技术为名人和球星运动员构建代币化版本供粉丝收藏，这一类别继续发展和进化。一种幻想足球游戏是如此罕见，玩家可以从\
  \ 100 个不同的足球俱乐部收集他们喜爱球员的“限量版数字收藏品”。\n\n在 2020 年 2 月的 `NFT NYC` 上，`NFL` 和 `NBA` 的成员分享了与\
  \ `NFT` 技术合作的兴趣。从那时起，`CryptoKitties` 开发者 Dapper Labs 与 `NBA` 合作推出了代币驱动的 `NBA TopShot`。Dapper\
  \ Labs 合作伙伴与营销负责人 Caty Tedman 告诉 Cointelegraph，“该产品旨在让粉丝对场上发生的动作有一定的控制权。”`NFT` 收藏品通过挖掘热情的粉丝基础，展示了它们将这些社区引入区块链的能力和力量。`NFTs`\
  \ 还将更多传统的收藏品带入区块链技术，如硬币、邮票、交易卡（例如加密邮票）。\n\n数字收藏品生态系统 `Terra Virtua` 处于 `NFT` 收藏品趋势的最前沿。通过将数字收藏品引入多平台\
  \ VR 和 AR 世界，该平台旨在为用户提供“深度感官体验”。\n\n`Terra Virtua` 发布了‘vFlects’，这是一个基于角色的 3D 动画生物系列，以及来自《壮志凌云》、《落日金》、《教父》和《迷失太空》的授权\
  \ 2D 和 3D 收藏品。他们不仅有一个用于沉浸式收集独家数字收藏品的市场。尽管如此，他们还通过其画廊 App 和 `Terra Virtua Fancave`\
  \ 创建了一个跨平台的旅程。画廊所有者可以使用该 App 存储、查看、交流和展示他们的独特数字艺术品收藏。用户可以在 `Terra Virtua Fancave`（一个可自定义的虚拟现实环境）中展示他们的收藏品。“`Terra\
  \ Virtua` 的主要目标是将 NFT 带入大众市场，”`Terra Virtua` CEO Gary Bracey 说，“核心团队的游戏经验让我们对 `UI`\
  \ 和 `UX` 有了强有关注，我们希望通过让这一过程既引人胜又无缝，将互动数字收藏品的世界带入主流。” `Terra Virtua` 提供的跨平台能力和感官元素使\
  \ `NFTs` 超越了目前作为产品的标签，成为真正引人的互动体验。\n\n\n游戏玩家是 `NFTs` 的理想目标市场，因为他们已经熟悉虚拟世界和货币。得益于\
  \ `NFTs`，游戏行业正蓬勃发展，它使得游戏物品能够被代币化，并通过对点交易和市场进行轻松传输或交易。\n\n传统游戏禁止出售或传输稀有武器和皮肤等游戏内物品，由于玩家完全控制自己的数字资产，`NFTs`\
  \ 让游戏体验变得更加真实且有回报。它们还创造了一种新的经济模式，因为玩家现在可以通过构建和开发他们的游戏资产来获益。\n\n“区块链在这里潜力的背后的想法是，玩家忠诚度将会增加，因为他们的数字资产可以在平台或游戏之间交换，或者在开放市场上交易，他们会投入更多辛苦赚来的钱。”\
  \ ——Cointelegraph\n\n\n\n\n\nA Galaxy Interactive 的一份手册解释道，随着虚拟产品获得与其实体对应品同等的地位，“我们在虚拟世界中构建的价值将与我们过去在外部创造的价值变得无二致。”`NFT`\
  \ 与游戏世界的整合也促进了引人入胜且互动性社区的形成，因为玩家开始通过点对点交易创建内在的社区元素。\n\n![](img/image00714.jpeg)\n\
  \n根据 `NonFungible.com` 的数据，上周十大区块链游戏排名。\n\n`Axie Infinity`、`Gods Unchained` 和 `My\
  \ Crypto Heroes` 是三款人气暴增的流行区块链游戏。`Axie Infinity` 是一个数字宠物社区，玩家可以在其中收集、训练、养养战斗名为 `Axie`\
  \ 的幻想生物。该游戏基于 `Ethereum` 区块链，是第一个拥有动画角色和丰富沉浸式游戏体验的区块链游戏。`Gods Unchained` 是一种数字收藏卡牌游戏，玩家可以拥有并交易以\
  \ `NFTs` 形式发行的卡牌，其所有权与实体卡牌相同。`My Crypto Heroes` 是一款日本多人战斗游戏，使用 `Ethereum` 区块链发行英雄和游戏物品，允许玩家通过锦赛和任务提升历史英雄的等级。\n\
  \n游戏应当有趣且好才能成功，但 `Play2Earn` 是另一个在 `NFT` 游戏广泛普及中起重要作用的关键方面。许多人被通过玩游戏换钱的可能性所吸引，尤其是发展中国家的的人，在那里，玩\
  \ `Axie Infinity` 的收入可能等同于薪水。`Cryptopick` 是另一个用户因参与而获得奖励的游戏。玩家可以以有趣的方式学习 `crypto`，而无需冒金钱风险，更重要的是，可以赚取第一笔加密货币（`ETH`）和\
  \ `NFTs`。获得首个 `Crypto` 和 `NFTs` 意味着他们将学习如何使用钱包、进行购买等知识，使得游戏成为许多人进入 `Crypto` 世界的一种吸引人的方式。\n\
  \n![](img/image00715.jpeg)\n\n`Rarible` 是一个用于虚拟艺术品的社区驱动型 `NFT` 市场。\n\n\n数字艺术家面临的最困难的问题之一是版权侵权，但\
  \ `NFTs` 提供了一种解决方案，因为它们提供了所有权证明、真实性证明，并消除了伪造和欺诈问题。`Coindesk` 的一篇文章指出，由于 `COVID-19`\
  \ 迫使画馆关闭，许多艺术家转向在线展厅和 `NFTs` 作为画廊和博物馆，“正如 `Bitcoin` 通过建立事件公共账本为无信任点对点交易铺平道路一样，加密艺术\
  \ [...] 内置了溯机制。”7 月，“毕加索的牛”创下了 `NFT` 艺术拍卖销售的新纪录，价格超过 55,000 美元。其他记录包括《Portraits\
  \ of a Mind》（超过 130,000 美元出售）和《Right Place and Right Time》（超过 100,000 美元出售）。根据 `Cointelegraph`，“这些活动可以通过交换解决方案和基于区块链的支付将艺术家直接连接客户，从而增加并简化艺术家的收入。”\n\
  \n数字艺术市场和平台示例包括 `Makersplace`、`Rarible` 和 `SuperRare`。这些市场和平台的功能相似，允许用户快速创建原创数字艺术并在其网站上销售。`Rarible`\
  \ 是一个特别引人注目的例子，因为它将数字收藏品与收益挖矿和流动性挖矿相结合，创造了 2020 年最有趣的 DeFi 趋势之一。他们通过发行 `$RARI` 治理代币实现了这一点。2020\
  \ 年最后几个月对 `NFTs` 兴趣回升的原因之一就是这种采用策略。当用户在平台上出售和交易他们的 `NFTs` 时，他们会获得 `Rarible` 治理代币（`$RARI`）的补偿和激励。因此，`Rarible`\
  \ 是一个社区运营的市场，旨在成为一个完全的去中心化自治组织（`DAO`），`RARI` 代币是第一步。除了 `Rarible`，许多其他 `NFT` 市场平台也开始发行和分配治理代币，包括\
  \ `The Somnium Space`（`$CUBES`）、`Decentraland`（`$MANA`）、`Sandbox`（`$SAND`）等。\n\n\
  \n虚拟世界是 `NFTs` 的另一个用例。用户可以在 `The Sandbox`、`Cryptovoxels` 和 `Decentraland` 等去中心化虚拟现实平台上创建、拥有并变现虚拟土地和其他游戏内\
  \ `NFT` 产品。`Decentraland` 的 `LAND` 由社区永久拥有，赋予玩家对其虚拟财产和创作完全的所有权。鉴于 Z 世代对虚拟世界的经验以及他们对价值资产的理解与前人的不同，虚拟世界资产为他们提供了所重视的灵活性和选择：“也许我们孩子这一代不会拥有他们居住的房子，但他们将拥有一笔数字资产。”\n\
  \n![](img/image00716.jpeg)\n\n`The Sandbox` 是另一个基于 `Blockchain` 和 `NFTs` 的虚拟世界。\n\
  \n\n将现实世界资产如股票、房地产，以及医疗史、学历、出生和死亡证明等文档代币化是可能的。然而，这一类别仍处于开发的早期阶段，其用例相对稀少。但随着加密世界和\
  \ `NFTs` 的增长和扩大，谁能说你有一天（也许很快）将无法拥有数千英里之外另一个国家的葡萄园呢？你的数字钱包很快就能包含你所拥有的每份许可、证书和资产的证明。\n\
  \n## NFT 的未来如何？\n\n`NFTs` 的可能性和潜力是无限的，最近的销售记录有助于该技术的进步。缺乏关于区块链技术和加密世界的广泛知识是目前其广泛采用的障碍之一。“如果你教育人们，让他们尝试尝鲜，让他们感受它，他们就不会被它淹倒，”Grow\
  \ Your Base 创始人 `John G. Fields` 说道。\n\n安全是教育的一部分。进入区块链空间的新用户必须知道如何保护他们的钱包和私钥，以免他们宝贵的数字资产暴露于黑客面前。许多数字收藏品、资产和投资由于其稀有性和缺乏性而极具价值，失去它们无疑将是毁灭性的。为了保护数字财产的价值，开发者和创作者必须确保将稳固的许可和版权写入智能合约。目前可用的大多数钱包对于新用户和主流新手来说非常复杂且难以使用。然而，为了改进这些钱包，如\
  \ `Coinbase wallet`、`Enjin wallet`、`Pillar wallet` 或 `WAX Cloud Wallet`（`WCW`）等正在不断开发和发布。\n\
  \n`NGRAVE ZERO` 是另一个值得关注的，因为它被设计为最“冷”、最安全的加密钱包，同时也极其易于使用且无缝衔接，让你在处理 `NFTs` 时完全放心。`ZERO`\
  \ 的高质量触摸屏不仅为用户存储和交易其虚拟财产提供了安全可靠的环境，还具有一种迷人的潜力，允许所有者从小型便携设备设备向他人展示他们的虚拟资产和收藏品。\n\n\
  \n\n\n\n大众教育的另一个方面是理解 NFT 和区块链技术为何仍然保持着极客、极客和技术化的色彩。对于那些不熟悉区块链的人来说，还需要进一步的简化，使其易于使用和易于理解。在“游戏与非同质化代币的未来”小组会议中，Jesse\
  \ Reich 博士（`Splinterlands` 的 CEO）讨论了难度“在于如何让区块链对新手用户不可见，同时对经验丰富的用户开放”。尽管像 `CryptoKitties`\
  \ 这样的项目成功地向新用户介绍了区块链，以及近几个月 NFT 用场景的增长和兴起，但还有很长的路要走。对 NFT 的热情很大程度上集中在游戏、艺术和收藏品等小众领域，但新项目正在稳将\
  \ NFT 扩展到我们物理生活的其他方面。随着更多主流品牌加入战（例如耐克，它将鞋子授权为名为 `CryptoKicks` 的 NFT，使用户可以“繁育”不同的鞋来制作定制运动鞋），我们将看到\
  \ NFT 如何演变为可以在不同世界（无论是物理还是虚拟）之间进行传输。正如于植锡（`Animoca Brands` 的 CEO）所贴切说说：“世界上有多少游戏公司会说，让我们在我们的虚拟游戏中使用那些耐克的鞋吧？”——\
  \ `Animoca Brands` CEO 于植锡道。随着越来越多的人意识到 NFT 能提供的机会和价值，越来越多的大型品牌、风险投资公司和主要投资者开始关注并参与。`Morgan\
  \ Creek Digital` 的联合创始人 Anthony Pompliano 和 Jason Williams 已对数字艺术 NFT 超越实体艺术品市场下了一场“巨大的赌注”。\n\
  \n独立区块链游戏开发者已开始吸引风险投资的关注，因为他们的产品周期极长，并且愿意交付各种变现模式，使他们成为理想的投资对象。NFT 领域的新治理代币引起了兴趣，就像它们在\
  \ DeFi 领域一样，无法预知 NFT 和 DeFi 能结合出哪些令人兴奋的新形式。然而，NFT 的未来道路并非没有障碍，因为它们未来可能会面临监管障碍。无论如何，加密领域仍然非常年轻，需要通过产生大量新项目来持续发展，尽管这些项目会到来、失败并消失。\n\
  \n\nNFT，或非同质化代币，迅速成为有以来最获丰的区块链实验之一。\n\n影响力人物，例如 Twitter CEO Jack Dorsey，最近通过拍卖 NFT\
  \ 登上了头条新闻。虽然 NFT 背后的密码学是复杂的，但弄清楚它们是什么以及如何从中获利并不难。\n\n本章将介绍 NFT 是什么、如何出售 NFT 获利、在哪里交易它们，以及\
  \ NFT 销售的最新案例。\n\n“非同质化代币”意味着一种无法复制或更改的加密资产。这些代币可以被认为是私人收藏品中艺术品的数字等物。收藏品中的每件艺术品都是独一无二的，且价值不异。\n\
  \nNFT 就像艺术品一样，可以交换现金或加密货币。然而，就像加密货币一样，代币的资产转移记录在区块链上。这确定了由谁拥有它。\n\n每个 NFT 都与原始所有者的数字（或在某些情况下是物理）资产相关联。从技术上讲，任何数字形式都可以转换为\
  \ NFT。Facebook 贴文、Instagram 照片、著名的推文等都可以转换为 NFT 并由任何人出售。\n\n\n消费者的兴趣驱动着 NFT 的价值，就像驱动我们假设艺术收藏品中的物品一样。稀缺性和感兴趣买家的基数影响着它们的价值，就像交易卡一样。虽然图片可以转换为\
  \ NFT，但这并不排除它可以被自由分享。另一方面，区块链清晰地显示了谁拥有该资产。\n\n## 我如何可以购买 NFT？\n\n\n\n\n\nChris Torres\
  \ 是热门表情 Nyan Cat 的创作者，他创建了一个 NFT 来出售该动画的所有权。尽管 Nyan Cat 在十年前就首次发布在互联网上，但由于近期对 NFT\
  \ 的兴趣激增，Torres 决定将其拍卖。他成功通过加密货币太坊赚了约 59 万美元的利润。\n\nTwitter 首席执行官 Jack Dorsey 将他的第一条推文作为\
  \ NFT 出售，使其成为首批登上头条的 NFT 交易之一。它最终以 250 万美元售出，收益捐给了慈善机构。\n\n佳士得拍卖行举行了最昂贵的 NFT 拍卖。这是这家著名拍卖行首次尝试区块链拍卖。该图像是一个巨大的\
  \ JPEG 文件，包含了由平面设计师拍摄的 5,000 张独立照片。\n\n尽管创作者并不出名，但该作品成交价略低于 7,000 万美元。这也是 NFT 的首次公开出售，这一因素促成了它的成功。另一方面，NFT\
  \ 仍然具有足够的新颖性，因此像这样的“独兽级”销售仍会发生。\n\n\n这项区块链实验的未来与大多数其他实验一样，尚不可知。然而，知名出版物表明，NFT 似乎短期内不会消失。现在富裕投资者向其中投入资金，它们可能会变得更加流行。\n\
  \n这可能是音乐销售领域的下一个大趋势，因为它可以在不放弃所有权的情况下出售属性的使用权。要以最小的风险进入市场，你拥有的任何创意内容都可能具有价值。游戏精灵、你拍摄的照片、你录制的音乐、在各种论坛和网站上的知名账号，以及你能想象到的几乎所有东西都可以是\
  \ NFT。\n\n\n\n由于 NFT 和区块链在短期内不会消失，考虑出售或购买 NFT 资产可能是值得的。然而，在这样做之前，你应该考虑以下五件事。\n\n\
  \n当我第一次了解到单件加密艺术品可能导致数百吨温室气体排放时，我觉得这不合常理。在我看来，考虑到必要的材料和运输，数字艺术品产生的排放可能比一幅精细画更少。\n\
  \n（注：原文中存在大量重复的“Global Warming”段落及损坏内容，根据“不要漏掉任何一行”的原则，此处应对应原文的重复结构。但由于后续文本存在大量严重的句子断裂和重复，译文将基于核心逻辑进行翻译，并保持其结构特征。）\n\
  \n[此处省略原文中大量重复的 Global Warming 段落的翻译，以保持核心逻辑一致]\n\n\n\n接下来的讨论将关注 NFT 的意义，并概述如何购买和出售它们。\n\
  \n非同质化代币（NFTs））近期席卷了收藏品和数字艺术世界。突然之间，每位数字艺术家都发现了展示其作品的新方法，并以此过上良好的生活。不仅是数字艺术家，名人和跨国公司也在争夺数字资产的一羹。非同质化代币（`NFTs`）热度的突然上升是因为一件以\
  \ 6900 万太坊售出的非同质化代币或 NFT 艺术创了纪录。\n\n`NFTs` 现在被 Beeple 等数字艺术家用于发布他们的作品，而区块链将验证价格是否真实。然而，`NFTs`\
  \ 不仅限于数字艺术。\n\n`NFTs` 可以有多种用途，例如稀有独特物品的所有权，或者作为其他类型的资产。它也可以以实体的形式存在，因此 `NFTs` 不仅仅是数字的。投资非同质化代币与加密货币投资不同。每个\
  \ NFT 都是独特的，每个 NFT 都有自己的估值和定价。要买卖 NFT，必须在它们上附加某种媒体以增加其价值。由于人们对 `NFTs` 的关注，许多人现在对买卖它们感到困惑。因此，本章的重点将放在将\
  \ `NFTs` 作为一种投资形式的过程上，以及如何买卖 NFT 以利用这一新机会。\n\n\n如果你想学习如何购买 NFT，有几个步骤你必须采取。在购买任何\
  \ NFT 之前，你必须首先确定它们在哪里出售。由于 NFT 是基于区块链的代币，因此有一些市场可以让你买卖 NFT。所以，在我们继续下去之前，让我们来看看一些最著名的市场。\n\
  \n\n你可以在几个不同的在线市场上买卖 NFT。然而，并非所有的市场都出售相同的收藏品或艺术品。因此，你可以根据你所选择的市场购买特定类型的收藏品。这些市场中的大多数都有大量的\
  \ NFT 供选择，但每个平台的运作方式各不相同。\n\n如果你对在哪里购买 NFT 感到困惑，这里是一些你可以买卖它们的市场：\n\n\n`OpenSea`\
  \ 是一个极好的基于以太坊的 NFT 市场。用户还可以使用加密货币购买非同质化代币。它涵盖了广泛的收藏品，从艺术品到视频游戏都有。然而，你需要一个如 `Metamask`\
  \ 这样的区块链钱包来使用该平台。`OpenSea` 支持许多区块链钱包，如 `Trust`、`Coinbase`、`Metamask`、`Argent` 等。这是购买\
  \ NFT 最流行的平台之一。\n\n\n购买 NFT 的另一个不错地方是 `SuperRare`。所有物品都是独特的，人们可以通过他们的平台买卖代币。此外，由于该平台基于以太坊网络，你需要购买\
  \ `Ether` 才能在该网站上购买。\n\n\n`CryptoPunks` 目前是该行业的冉之星之一。它与其他 NFT 市场有几点不同。这些主要是 24×24\
  \ 像素图像。所有图像都是使用算法生成的。大部分图片是装成朋克的女孩和男孩，但也有少数例外，例如外星朋克和僵尸朋克。无论哪种，每个朋克都有自己的作品集，你可以在那里查看他们的所有状态、特征以及是否出售。\n\
  \n这与 `CryptoKitties` 类似，每个物品都是独特的。同样，每个朋克也是独特的。你可以在这个市场上购买朋克、对它们竞标，然后以更高的价格卖出。\n\
  \n\n`Rarible` 是一个基于代币的区块链数字转型平台，类似于 `OpenSea`。你也可以在这个市场上制作、购买、出售和竞标艺术品。你所做的只是将你的数字内容上传到这个网站，创建一个\
  \ NFT 并将其进行拍卖。想要购买这些数字图像的人可以对其进行出价，图像将归出价最高者。你还可以为一张图片创建多个 NFT 用于出售，并多次出售它。\n\n\
  此外，你还可能在转售中获得佣金。\n\n\n`Sorare` 专为足球卡设计。该网站允许你买卖限量版数字足球卡。目前，市场上有 125 个俱乐部列出，每周都会增加更多。如果你是一个足球迷，`Sorare`\
  \ 就是为你准备的 NFT 市场，你可以购买你喜欢的球员的足球卡。\n\n\n你可以在任何 NFT 市场创建账户。然而，在买卖任何东西之前，你必须先链接到你的区块链钱包。由于大多数\
  \ NFT 是基于以太坊的，大多数市场都认可 `Ether` 为一种支付形式。你需要一个加密货币交易所来购买 `Ether`，然后你需要将加密货币上传到你的区块链钱包中。\n\
  \n一旦你有足够的资金，就可以将钱包连接到你的 NFT 市场账户。在那里，你就大搞定了！你现在可以随所欲购买 NFT！\n\n\n为了买卖 NFT，你需要支持\
  \ `ERC-721` 和 `ERC-1155` 等 ERC 标准的区块链钱包，你可能已经知道了。两者都是专门为 NFT 设计的。然而，由于 `ERC-1155`\
  \ 较新，一些流行的钱包可能尚未支持它。\n\n为了帮助你，我们整理了一个你可以用于存储 NFT 和其他购买 NFT 加密货币的区块链钱包列表。大多数 NFT\
  \ 市场支持这些钱包。\n\n\n`MetaMask` 是最常见的以太坊中心化金融应用之一。你可以将此钱包作为 Firefox、Chrome 和其他浏览器的扩展程序。`Metamask`\
  \ 允许你访问资金以及其他基于以太坊的代币。\n\n如果你是一个区块链开发者，`MetaMask` 还通过为用户提供抽象降低感兴趣者的入门槛。这也是你存放 NFT\
  \ 的地方。此外，设备存储并加密了你所有的私钥。你可以随时访问这些密钥并接受或拒绝 NFT 销售。\n\n\n`Coinbase wallet` 是 NFT 平台中的另一个热门选择。它支持多种硬币以及其他类型的数字收藏品，并提供安全存储。这里有一个显著的区别。你不需要只使用地址，还可以使用你的\
  \ `Coinbase` 钱包名称进行交易。它作为独立应用程序提供，使其使用更加方便，因为你可以将其安装在移动设备上。\n\n\n这是你购买 NFT 需要采取的最后一步。一旦你为账户和钱包注入，购买过程非常简单。大多数\
  \ NFT 市场都有拍卖模式，在那种模式下你可以出价并等待一段时间看你是否获得了该作品。\n\n\n\n创建 NFT 是一个非常简单且直接的过程。你需要在一个允许你创建\
  \ NFT 的平台上进行注册。用户可以在 Rarible 或 OpenSea 这样的市场上购买、出售甚至构建 NFT。最棒的一点是，在无需任何区块链或加密哈希预知识的情况下即可生成\
  \ `ERC-721` 令牌。\n\n该平台可以转换你的视频、图像、3D 模型或任何其他资产。这与资产代币化不同。嗯，为了让 NFT 具有价值，媒体必须以某种方式连接起来。艺术家的声誉赋予了\
  \ NFT 应有的价值。\n\n\n某些平台通常会收取少量的创建 NFT 费用。然而，在 OpenSea 中，创建 NFT 是免费用的。在创建第一个 NFT 时只需支付一次性的\
  \ gas 费用（燃料费），其他都是免费的。如果市场使用以太坊 NFT，你需要“gas”来创建令牌。\n\n以太坊的 gas 费用因网络而异。gas 价格越高，网络上的用户就越多。我们建议在周末尝试，因为那时网络上的用户较少。\n\
  \n\n对于谁可以制作 NFT 或访问市场，没有任何限制。它是对所有人开放的。买卖 NFT 只需要一个账户。买比比卖容易得多，因为你已经知道令牌的价值是多少。但是，当你制作自己的\
  \ NFT 时，估值情况是不一样的。\n\n并不是每个人都能出去创建 NFT 并期望获得丰厚的投资回报。这有点有点像现实生活中艺术家的工作方式。如果你不受欢迎，出售就会变得困难。\n\
  \n然而，各种网站中的隐藏费用可能会变得非常复杂。即使你能够卖掉，隐藏费用总和往往比你收到的代币还要多。结果，在这种情况下，你不得不亏损卖出令牌。我们建议在开始铸造\
  \ NFT 之前，对平台进行广泛的研究并建立粉丝群。\n\n\n是时候了解如何让你的 NFT 收藏变现了。要出售 NFT，请登录你的账户并在收藏中找到该项目。一旦找到它们，只需点击它们即可显示“出售”按钮。找到此选项后，点击它进入另一个页面，你可以在那里设置拍卖的定价和条件。\n\
  \n所有市场的流程都略有不同。如果你出售 NFT，你获得的最流行的令牌之一是以太坊，它也称为 `ERC-20`。像 OpenSea 这样的平台提供版税费用，以换每次原作作品出售时的佣金。\n\
  \n现在你已经知道如何创建和出售 NFT，你可以随时随地开始你的尝试了。\n\n\n以下内容将澄清同质性令牌与非同质性令牌之间的争议，并帮助你理解两者之间的区别。\n\
  \n加密货币一直与区块链技术相关。如果你是区块链世界的新手，你可能认为它只是非常适合开发加密资产。然而，区块链技术的真实潜力远超加密货币。\n\n政府、企业和个人现在可以将房地产数据、身份证明、证书和其他关于真实世界资产的关键信息放在区块链上。学生可以轻松地将他们的证书以数字文档的形式发布在区块链上，全球都会接受这些证书。那么，是什么帮助人们实现了如此惊人的成就呢？\n\
  \n这就是近年来关于同质性令牌和非同质性令牌的争议获得关注的地方。非同质性令牌被誉为区块链经济的未来。然而，同质性令牌（或当前的加密货币）经常与它们相对。让我们通过检查同质性令牌与非同质性令牌的区别来消除任何困惑。\n\
  \n\n在确定同质性令牌与非同质性令牌之间的区别时，令牌的定义是你应该考虑的第一件事。令牌是现实世界中事实、感受或性质的实体或可见表示形式。人们在现实生活中遇到各种令牌。\n\
  \n例如，酒店房卡是向酒店支付房费的证明。办公室 ID 卡是你在某公司工作的证明。另一方面，驾照证明了某人已经接受了在其国家境内驾驶的必要培训。因此，令牌在加密世界中也代表一个特定的实体。\n\
  \n令牌可以持有价值、权益、投票权或任何东西。令人惊讶的是，令牌并不限于单一角色，并可以用于处理其原生生态系统中的各种角色。令牌可能用于反映公司的实用性或资产。公司可以在公开发中将令牌发给投资者。\n\
  \n\n那么，令牌的作用是什么？对这个问题的回答对于充分理解同质化 vs 非同质化令牌的辩论至关重要。令牌并不限于特定角色，可以用于其原生生态系统中的各种事物。以下是可能的功能示例：\n\
  \n1. 令牌可以作为进入区块链应用程序的入口，用户必须拥有令牌才能使用去中心化应用程序（dApp）。\n2. 令牌还可以代表个人保留特殊投票权的资格。例如，`EOS`\
  \ 区块链令牌可用于投票选择创建者。\n3. 令牌也可以是改进持有者用户体验的有用实体。用户体验增强令牌可以帮助提升体验。例如，在 `BAT` 的情况下，Brave\
  \ 浏览器或其他 Brave 相关的令牌可以通过使用其令牌添加广告或其他基于注意的服务来增强其消费体验。\n4. 最重要的一点是，将令牌作为货币使用有助于识别同质化令牌和非同质化令牌。令牌可以作为给定生态系统内内部和外部交易的价值载体，它们具有包含数字资产的独特货币结构。\n\
  5. 令牌的另一个重要应用是指价值交换。事实上，在区块链生态系统中，令牌在历史上一直被用于价值交换。因此，令牌在开发应用程序的内部经济系统方面是非常有用的。\n\
  6. 考虑令牌作为识别谁拥有特定实体的手段也是重要的。令牌可能代表某人独有的独特物品的所有权，这种应用为关于同质化 vs 非同质化令牌的辩论奠定了基础。\n\n\
  \n区块链是管理不同形式数字资产的最佳技术。它的安全性和不可篡性特征使其适合处理数字资产。在区块链中最广泛使用的同质化令牌上，写入任何独特信息都是困难的。\n\n\
  相反，加密令牌是独特的且可以持有数据而非价值，可能是最好的选择。非同质化令牌是那些在以太坊平台上使用如 `ERC-721` 标准等 ERC 标准定义的令牌。同质化令牌与非同质化令牌的区别源于对数据存储的依赖。\n\
  \n\n\n\n在经济术语中，任何同质化实体（fungible entity）指的是资产或商品与其他等价值的资产或商品进行交换的能力。货币和资金是同质化资产最常见的例子。例如，一个人拥有的\
  \ 5 美元钞与另一个人拥有的 5 美元钞价值相同。同样，一个人拥有的两张 5 美元等同于另一个人的一张 10 美元。\n\n黄金是另一种同质化资产，因为一个国家的盎司黄金与另一个国家的盎司黄金价值相同。关于同质化与非同质代币的争论源于同质性被写入了\
  \ `Bitcoin` 以及其他加密货币的代码中。同质化商品最重要的特征是它是标准化的，其单位不是唯一的。\n\n另一方面，NFT 是一种特殊的代币变体，与其他代币没有互换性，正如在同质化与非同质代币的讨论中所讨论的那样。`NFT`\
  \ 具有独特的特征，表明它不能被替换或交换相同类型的代币。\n\n非同质代币与加密货币的区别在于它们没有内在价值。非同质代币的价值源于它们所代表的商品或资产。`NFTs`\
  \ 使用多种代币标准并部署了多种类型的智能合约。非同质代币被视为开发基于区块链的虚拟经济生态的新工具。\n\n\n现在我们已经充分了解了同质代币和非同质代币是什么，是时候关注比较这两者了。让我们考虑区分同质代币和非同质代币的特性。\n\
  \n\n正如你所理解的，同质代币之间是完全可以互换的。法币是同质化资产最为人知的例子。你可以将同质化资产从一个所有者转移给另一个所有者以支付此类物品。另一方面，交换同质化资产没有意义，因为它们的价值相同。同质代币通常用于跟踪余额和进行支付。\n\
  \n同质代币实际区块链用例中最受欢迎的例子之一，是将同质代币绑定到特定支付账户中的组织余额中。结果，支付可以通过代币转账完成。用户还可以查询生成的代币余额以进行定期的对冲和结算。\n\
  \n\n另一个重要方面是同质代币与非同质代币之间的区别，这涉及到每个账户根据其所拥有的代币维护余额。使用 `swap` 技术或直接交易很容易将代币转移到其他 `Ethereum`\
  \ 账户。当使用代币转账时，源账户会扣除转账金额，就像使用银行转账一样。同时，受益账户将收到相同金额的入账。\n\n同质与非同质代币的比较意味着非同质代币或 `NFTs`\
  \ 具有独特的价值主张。`NFTs` 是独特的代币，每个代币都有唯一的 ID 以与同一 `smart contract` 中的其他代币区分开。非同质代币始终有一个唯一的所有者。因此，由于每个代币的处理方式不同，它们的价值可能会有所不同。\n\
  \n某些 `NFTs` 代表具有证明稀缺性的独特贡品。因此，`NFTs` 需求量巨大，买家更多，价值也高于代表普通属性的 NFT。此外，`NFTs` 可用于促进所有权转移和交易。例如，约翰可能会用代表一批苏格兰威士忌的代币交换代表一批波尔多葡萄酒的代币。\n\
  \n最显著的用例之一是将非同质代币分配给房地产。在还清抵押贷款后，用户可以将 `NFTs` 从银行的 `Ethereum` 账户转移到房主的 `Ethereum`\
  \ 账户。因此，它为区块链在房地产领域引入了新的用例形式。\n\n\n在选择同质代币和非同质代币时，下一个需要考虑的重要因素是代币标准。如果你想构建一个健康的生态系统，你可以在\
  \ `Ethereum` 之上构建去中心化应用，这些应用可以无缝交互。然而，如果你有两个不同的代币，例如 `Token Alpha` 和 `Token Beta`，你能在它们中找到不同的\
  \ `smart contract` 结构吗？开发者必须研究这两个合约以实现两种代币之间的交互。\n\n此外，开发者必须描绘代币之间相互作用的精确方法。然而，这一因素对扩展没有帮助。如果有\
  \ 100 种不同的代币对应 100 种不同的 `smart contracts`，将很难缩小以确保转账通过所有代币的各种资格和条件。\n\n结果，你可能会在代币交易中遇到大量的复杂计算。因此，代币标准演变为一种区分同质与非同质代币的可行方案。所以，决定对管理代币底层架构的规则进行标准化，无疑是区分同质与非同质代币的衡量尺。\n\
  \n\n`ERC-20` 是特定的规则集，`ERC` 代表“以太坊请求评论”（Ethereum Request for Comment）。`ERC-20` 的基础取决于\
  \ `approval`、`allowance`、`totalSupply`、`transfer`、`transferFrom` 和 `balanceOf` 等元素。这些元素是\
  \ `ERC-20` 代币的强制函数和规则。\n\n另一方面，代币可能具有下面提到的三个可选特征。特征包括代币名称、符号和最多 18 小数。这些特征定义了 `ERC-20`\
  \ 为一种同质标准。由于这些标准，同质代币必须具有以下属性，这些属性决定了它们在同质与非同质代币争论中的地位：\n\n1. 同类型的同质代币可以替换一个代币。\n\
  2. 相似的底层规则用于同质代币的管理。\n3. 同质代币易于分割，人们可以使用较小的分数来支付较大的金额。\n\n\n然而，`ERC-20` 的局限性导致了显著的不一致，促成了\
  \ `ERC-721` 代币标准的创建。`ERC-721` 代币标准对于创建非同质代币可能有用。惊讶的是，`ERC-721` 代币标准在功能上与 `ERC-20`\
  \ 代币标准非常相似。`ERC-20` 和 `ERC-721` 相似之处主要由于以下因素：\n\n1. 开发者可以快速过渡而无需学习新的技能。\n2. 用户在通用钱包中存储代币并在交易所交易它们时可能有更好的体验。\n\
  \n`ERC-721` 接口有两个不同的方法，例如 `ownerOf` 和 `transferFrom`，它们具有不同的功能。`ownerOf` 功能用于查找谁拥有代币。`transferFrom`\
  \ 函数可用于转移代币所有权。\n\n\n\n我们必须保持好奇心并追求新项目以帮助空间演进，并理解它的所有功能，以便为用户开发更好的产品。\n## 关于 NFT\n\
  \n这些是 NFT 最常见的属性，记住它们非常重要，这样我们就能理解可以用它们做什么，以及它们是如何工作的：\n- **唯一性 (Unique)**：每个 NFT\
  \ 都有自己的属性集，通常存储在代币的元数据中。\n- **稀缺性 (Scarce)**：NFT 的数量可能，最极端的例子只有一个副本，且代币的数量可以在 `Blockchain`\
  \ 上进行验证，因此具有可证明性。\n- **不可分割性 (Indivisible)**：大多数 NFT 不能被分成更小的单位，因此你无法购买或传输 NFT 的部分。\n\
  \n与同质化代币类似，NFT 确保了资产所有权，易于传输且具有防欺诈性。\n\n近期 DeFi 的流行促进了围绕 NFT 话题的增长。\n\n\nNFT 被视为去中心化金融宇宙中的下一个大趋势。它们可以用作抵押品；也可以代表其他金融资产，如债券、保险或期权。\n\
  \n一个 DeFi 借贷平台需要抵押品。这正是 NFT 发挥作用解决问题的地方。\n\nYinsure 在保险领域使用 NFT；每份合同都表示为一个 NFT，然后可以在另一个平台（例如\
  \ `Rarible`）上进行交易。\n\n我们看到的另一个使用 NFT 的 DeFi 趋势是治理代币的发行。许多网站和 NFT 市场已经开始发行发行治理代币。\n\
  \n\n技术在近年来取得了了进展。`Blockchain` 是进展最快速的领域之一。这并不意味着像 `Ethereum`、`Bitcoin` 以及大量其他加密货币独占了加密货币市场。\n\
  \n让我们来看看非同质化代币（NFT）以及品牌如何使用它们。\n\nNFT 与加密货币的区别在于，它们有特定的识别代码和元数据，用此区分某一个 NFT 和另一个\
  \ NFT。加密货币是同质化代币，因为它们都是完全相同的。\n\n由于每个 NFT 都是独特的，因此它不能与等价的 NFT 进行交换或交易。结果是每个 NFT\
  \ 都是一个数字收藏品，一种独特的、不可复制的资产。\n\n这就是 NFT 狂热的起源。`CryptoKitties` 结合了电子宠物和交易卡，在 2017 年横空而出。每只猫都是独特的，可以被饲养、复制并出售高达\
  \ 140,000 美元。\n\nNFT 狂热诞生了，对 NFT 的兴趣正在增加。\n\n\n代表艺术、音频和视频等数字文件的能力是 NFT 对品牌价值的关键原因之一。它们的适应性极强，可以用来代表其他形式的创意作品，如虚拟世界、虚拟房地产、时尚等。\n\
  \n### 这与你的品牌和营销策略有什么关系？\n\n由于它们引发了全球关注，NFT 开启了品牌故事和消费者互动的新形式，这是成功营销活动的两个关键支柱。\n\n\
  通过 NFT，你可以：\n- 提高品牌知名度\n- 创建独特的品牌体验\n- 鼓励互动\n- 提高对你产品和品牌的兴趣\n\n最后， NFT 将帮助你提高转化率并产生收入。以下是公司在营销活动中使用\
  \ NFT 的示例。\n\n\n营销中的 NFT 概念可能很难理解。解释最复杂概念简单的方法是看例子。以下是品牌利用 NFT 的一些创意方式。希望你能从中获得一些灵感。\n\
  \n### 1. Taco Bell 的 GIF\n\n![](img/image00717.jpeg)根据研究，83% 的千禧一代选择与与其价值观相似的公司做生意。因此，品牌必须公开（且真诚地）背书他们相信的事业。\n\
  \nTaco Bell 基金多年来一直这样做，但他们通过出售以塔可为主题的 NFT GIF 来为 `Live Más Scholarship` 学金筹资金，将此推向全新的高度。\n\
  \n在 `Rarible` 上架出 25 个 `NFTs`（被命名为 `NFTacoBells`）后的 30 分钟内，所有 GIF 都售罄了。每个 GIF 的起拍价为\
  \ 1 美元。然而，它们最终都以数千美元的价格售出，其中一个以 3,646 美元的价格成交。\n\n创建和销售 NFT 是 Taco Bell 的一个明智举措，因为它在主流媒体和社交媒体上引起了大量兴趣，这对业务总是有好处的。\n\
  \n像 Taco Bell 一样，你可以使用 NFT：\n1. 提高品牌知名度\n2. 支持一项良性事业\n\n这两者都是有助于你业务增长的强大因素。\n\n\n\
  寻找一种让自己成名并扰乱市场的方法？NFT 可以帮助你做到。\n\n这就是当 `RTFKT`（一家相对不名的中国虚拟运动鞋公司）为春节制作了 NFT 运动鞋并进行拍卖时发生的情况。这双鞋以惊人的\
  \ 28,000 美元成交。\n\n![](img/image00718.jpeg)\n\n对于一个仅存在两年的品牌来说，这非常令人印象深刻，特别是他们卖的是一双无法触摸、更不用说穿的鞋。尽管这令人印象深刻，但仍低于他们与\
  \ 18 岁艺术家 `FEWOCiOUS` 设计的另一双 NFT 运动鞋所赚取的 300 万美元。\n\n虽然 NFT 仍处于婴儿阶段，但现在是营销人员加入的最佳时机。这是吸引人们注意并建立粉丝群极佳方法。如果你是一个寻找使用\
  \ NFT 技术新方法的营销人员，可以向 `RTFKT` 借鉴。创建限量版纪念品来纪念特殊的场合和节日，并将它们用于你的节日营销活动中。你可以将它们送给前 `X`\
  \ 名客户，或者在拍卖会上单独出售。\n\n\n二十分钟内赚了六百万美元。Grimes 在 `Nifty Gateway` 上拍卖的十个 NFT 集合中赚了这么多钱。\n\
  \n人们对 NFT 感兴趣，品牌可以利用这种兴趣获利。例如，你可以：\n- 与艺术家或拍卖网站合作，让品牌出现在拍卖中。\n- 举办比赛（以获取线索），并将 NFT\
  \ 作为奖品。\n- 创建 NFT 并进行慈善拍卖。\n\n营销的核心在于追随趋势，并利用想象力利用这些热度来吸引对品牌的关注。\n\n\n由于大量的音乐人，音乐行业竞争变得异常激烈。建立和维护忠诚的粉丝群不再像以前那样简单。\n\
  \nKings of Leon 制定了一种策略来解决这个问题。他们以 NFT 的形式发行了他们的专辑《When See Leon》。\n\nKings of Leon\
  \ 通过成为首个发行 NFT 版本的乐队而创造了历史。更重要的是，通过让粉丝拥有数字收藏品，他们赢得了粉丝的心。这是增加品牌忠诚度的极佳方法。\n\nKings\
  \ of Leon 在这次首创的专辑发布未使用三种不同类型的代币。一种提供现场表演福利，第二种包含独家视听艺术，第三种包含特殊的专辑包。专辑在所有音乐平台可用，但\
  \ NFT 版本仅在 `YellowHeart` 以 50 美元的价格出售。\n\nNFT 的销售仅开放了两周，之后就不再生产专辑代币了。结果是这些代币变成了可交易的收藏品。\n\
  \n\n在主流艺术界几乎不为人知的 Mike Winkelmann 已经成了一个传奇。他将一个 `JPG` 文件以 6930 万美元的价格售出，使他成为当时最贵的第三位在艺术家。该文件是作为非同质化代币出售的艺术品。\n\
  \n\n\n\n\n在拍卖结束之际，涌入了大量竞价，导致这场为期两周的限时拍卖延长了 90 秒。\n\n\n迅速采纳新概念和创新。随着竞争日益激烈化，你必须愿意冒险并进行颠覆性创新才能脱颖而出。\n\
  \n## 6. 奶牛猫 GIF\n\nNyan Cat GIF 在十年前对数字领域产生了色彩斑斓的影响。创作者 Chris Torres 创建了该 GIF 的\
  \ NFT 版本，并在加密拍卖网站 `foundation` 上以超过 500,000 美元的价格售出。\n\n![](img/image00719.jpeg)\n\
  \n没错！一个复古动画 GIF 卖了超过五十万美元。\n\n然而，Chris 并没有停于此。他组织了一场拍卖，将经典迷因作为 NFT 出售。其中一个迷因“倒霉布恩”（Bad\
  \ Luck Brian）在 `foundation` 上卖了超过 34,000 美元。\n\n\n这里的教训是，消费者愿意为卓越的服务付费。利用这一点，将你一些最成功的广告转换为\
  \ NFT。举办一次活动来拍卖它们，并确保其得到了广泛宣传。\n\n这不仅会提高品牌知名度，还将帮助你接触新的技术市场。\n\n\nNFT 仍然很新颖，其实际应用仍然有限。然而，人们比非常喜爱它们，并愿意在它们身上花钱。这些都是它们将长久存在的确切指标。\n\
  \nNFT（包括支持它们的区块链技术）在未来的数字世界中可能发挥主导作用。非同质化代币开启了与观众互动的新方式，并为他们创造了难忘的体验，对于营销人员来说尤为如此。\n\
  \n记住，我们今天使用的大多数工具（如社交媒体）曾被认为是一时的时尚。\n\n在当今世界中，我们依赖它们来完成许多事情。NFT 现在看起来可能像是一种时尚，但它们提供的若干优势（如透明和安全性）克服了现有技术的局限性。\n\
  \n\n## NFT 销售对数字房地产意味着什么\n\n如果 NFT 艺术品价值数百万，那么什么能阻止虚拟世界房地产价值的增长呢？\n\n在纽约市，中央公园南端有一排高大纤细的公寓楼，被称为“富豪走廊”（Billionaire’s\
  \ Row）。那里的平均公寓售价超过 3,700 万美元，有些价格超过 1 亿美元，甚至有一处卖出了惊人的 2.4 亿美元。\n\n虽然这些建筑拥有超豪华的装修和叹为观止的景观，但当地人经常讨论这些价格看起来有多荒唐。也许更显著的是，几乎没有人住在这些公寓里；它们是空的。这些空公寓以如此高昂的价格售出令人们震惊。\n\
  \nJanine Yorio 是 Republic 的房地产部门和 Republic Realm NFT 基金负责人，该基金投资数字房地产。\n\n事实证明，人类在评估资产价值方面表现极其糟糕，尤其是当它们的价值指数级高于其实际效用时。这解释了为什么人们对“富豪走廊”的价格感到困惑，或者当艺术品以巨额交易时不断感到惊讶。\n\
  \n当佳士得以 6,900 万美元出售 Beeple 的数字艺术品时，人们理所当然地感到震惊。（Beeple 是一位从未卖过超过 100 美元艺术作品的艺术家）\n\
  \n尽管许多人假设资产价格是由其效用决定的，但实际上，资产价值由两个因素决定：集体信念和可传输性。\n\n例如，钱之所以有价值，是因为人们假设未来能够更容易地将其兑换成商品和服务。像货币一样，它的价值取决于社会对其价值的共同共识——别无他物。创作艺术品所用材料的成本对其价值没有影响，因此大多数人无法对其准确定价。\n\
  \n另一个虚拟资产是网站域名，它仅仅是一系列仅存在于网上的字母。几个域名的成交价都超过了 1,000 万美元（`Carinsurance.com` 以 4,970\
  \ 万美元售出，是曾卖过的最贵域名）。然而，我们已经接受了一个事实，此类域名由于其感知稀缺性而以高价交易。\n\n所以，当一个朋友问：“我为什么要为虚假的土地付真钱？”时，我解释说数字房地产类似于\
  \ NFT 艺术品和域名。由于创建数字地块的边际成本非常低，它的价值取决于其感知稀缺性，而非其实际效用。\n\n最近，数字房地产的价格增长速度比房地产快（问问艺术家\
  \ Krista Kim 即可，她以 500,000 美元卖出了一栋房子的 NFT）。一些人可能也会认为价格过谱。与此同时，世界上最繁忙的一些街道，如纽约的麦迪逊大街和百老汇，以及伦敦的牛津街，满了空置的店面，预示着所谓的“零售末日”。房东无法提供这些空间，即使是免费的也不行。\n\
  \n### 对虚拟房地产价值的集体信念已经在增长。\n\n即使商店空空如也，人们总是在购买物品。现实世界中的公司一直在在线上寻找客户。他们的下一站是元宇宙，人们可以在那里社交、逛街甚至购买现实世界的物品。\n\
  \n虽然目前元宇宙的用户数只有几万，但当用户开始大量进入元宇宙时，向这些虚拟世界销售物品将成为一种非常有成本效益的营销策略。现实世界支出与虚拟环境的融合并不新鲜。多年来，玩家一直在视频游戏中购买“皮肤”和额外生命。（亚马逊是电子商务与实体购物融合的研究案例。）\n\
  \n大公司在虚拟世界开设商店是一个逻辑步骤，他们已经在这样做。\n\n例如，乐事通已让人们从元宇宙 `Decentraland` 的商店订购披萨，并送到他们的现实世界地址。\n\
  \n此外，阿迪斯和凯莉·辛斯在 `Decentraland` 内部合作，参与者获得了一双免费的（虚拟）阿迪达鞋供其头像穿着。来自世界各地的人参加了这个企业赞助的虚拟聚会。公司意识到，这些虚拟活动比现实活动更具成本效益。\n\
  \n想象一下，如果耐克不是在美国每条主街上开店，而是在元宇宙中创造一个令人震惊的虚拟购物体验，可以向任何地方的任何人销售。任何公司最终都会意识到在 `Decentraland`\
  \ 这样的元宇宙中开设商店的价值，就像他们已经意识到互联网上拥有网站的价值一样。\n\n这种结果是自我实现的。随着内容变得更有吸引力，会有更多的用户访问元宇宙，从而吸引更多的企业赞助。\n\
  \n\n\n\n此外，Beeple 的拍卖表明，像 `Christie's` 这样一个具有合法性的力量可以吸引大量的现实财富。随着现实世界的企业在虚拟世界中立足，它们可以推高物业价格并鼓励对新的社区建设项目的投资，从而创建一个由信誉良好的玩家和高昂价格组成的全新且价值巨大的数字房地产生态系统。\n\
  \n艺术界对 `NFTs` 的快速采纳表明这些变化发生得有多快。虽然花费 10,000 美元购买一个像素“土地”似乎是非理性的，但请注意，11 月份每包 9 美元出售的某些数字\
  \ NBA TopShot 卡片此后已以每张 20 万美元的价格出售。\n\n所以我们知道为什么数字房地产可能有价值，但我们为什么认为它会继续保持价值或升值呢？这与人们为数字艺术和数字篮球卡支付比现实世界同等物品更高价格的原因相同：可转移性。\n\
  \n你一定听过难民将宝石缝在衣服下摆以隐藏财富，并在移民时随身携带。加密资产可以很容易地移动。数字房地产不仅变得越来越昂贵，其可转移性还可以推动其价值远超任何感知的用途或稀缺价值。\n\
  \n与现实房地产不同，数字房地产可以在几分钟内出售，不需要律师，因为其所有权历史记录在自有的去中心化区块链账本上。此外，数字地下室和建筑永远不会淹水，也永远不需要新屋顶。\n\
  \n目前 `NFTs` 和数字房地产不断上涨的价格，与一旦世界其他地区跟上它们可能具有的价值相比是非常不足道的。因此，我认为最好的虚拟房地产土地升值速度可能比现实房地产更快。\n\
  \n## 虚拟房地产热潮即将来临\n\n随着 `NFTs` 的兴起和房地产市场受到 COVID-19 的冲击，像 `Decentraland` 这样的虚拟世界可能处于资本化的良机位置。\n\
  \n我的整个职业生涯都在寻找投资房地产的新方法，最近我花了大量时间在 `Decentraland` 中。我的一个同事多年一直敦促我研究基于区块链的数字房地产，但直到最近，我才完全开窍。\n\
  \n数字房地产已经确立自己为一种值得投资者考虑的合法资产类别，我相信它在不久的将来将呈指数级升值。\n\n由于它与日益增长的加密投资宇宙相一致，数字房地产不仅具有提供巨大收益的潜力，而且似乎具有成为一种可行财富存储方式的潜力，类似于现实房地产和现实艺术。数字房地产存在于虚拟世界中，每个世界都有自己的“数字国家”和一套定义明确、不可撤销的物产权体系。今天在虚拟世界中购买土地感觉就像在\
  \ 1750 年的曼哈顿购买土地。它还免受现实房地产行业受 COVID 引起的不确定性的影响。\n\nJanine Yorio 是 `Republic` 的房地产负责人，`Republic`\
  \ 是一个面向个人投资者的在线投资平台，他们最近推出了 `Republic Realm`，一个数字房地产基金组合。她此前曾担任 `NorthStar Capital`\
  \ 的投资组合经理，以及 `Standard Hotels` 的房地产制作负责人。\n\n在虚拟世界中，玩家居住在化身体内并与世界（或“元宇宙”）交流。他们可以与其他用户交流，通过玩游戏和赌博赚取加密货币，在画廊购买艺术，参加活动和演唱会以及各种其他活动。`Cryptovoxels`、`Axie\
  \ Infinity`、`Somnium Space` 和 `The Sandbox`（尚未推出）是其他基于加密的虚拟世界。尽管如此，`Decentraland`\
  \ 是其中增长最快、最先进的一个。\n\n\n`Decentraland` 是由两位阿根廷软件工程师 Ari Meilich 和 Estaban Ordano\
  \ 开发的多人角色扮演游戏。该世界围绕一个名为 `Genesis City` 的广场展开。与大多数视频游戏不同，它除了演变成一个由用户创建并控制的虚拟世界外，没有预设目标。它与早期的虚拟游戏如\
  \ `Second Life` 和 `SimCity` 以及最近的多人游戏如 `Fortnite` 和 `Minecraft` 具有相似之处。\n\n`Decentraland`\
  \ 的经济建立在区块链之上，这是它的独特之处。除了广场和道路外，所有土地（在游戏中被称为 \"LAND\"）都可以由游戏用户使用 `Decentraland`\
  \ 的加密货币 \"MANA\" 进行购买、出售和建造。（`MANA` 的市值约为 2.25 亿美元，自 2017 年成立以来增长了五倍以上。）\n\n截至 2021\
  \ 年 2 月，`MANA` 的价格在过去一年中上涨了 321%。\n\n`LAND` 所有权是在 `Ethereum` 区块链上使用 `ERC-721` 标准注册的非质化代币\
  \ (`NFT`)，使其易于转移且不易受到欺诈。游戏开发者已将将铸造的 `LAND` 土地总数设置为 90,061 块。`LAND` 土地是非质化的，因为每块土地都有一组独特的\
  \ (x,y) 坐标。\n\n还有一个买卖 `LAND` 的二级市场，以及支持一个承包商经济，他们愿意以非常现实的价格在这些虚拟土地上进行设计和建造。人们愿意在虚拟房地产上投入大量资金，因为他们认为它是稀缺且有价值的。因此，在早期采用者中，拥有一块已成为某种身份象征。\n\
  \n除了身份之外，所有权意味着更有意义的东西——对 `Decentraland` 社区构的贡献。`Decentraland` 的玩家如何与你的 `LAND` 互动很大程度上取决于你如何开发它。它们成为人们互动、探索、建筑和社交的场所，同时也增加了\
  \ `LAND` 的价值。\n\n结果，`Decentraland` 房地产经历了多年的升值期。在 2017 年（`Decentraland` 推出的那年），土地的价格大约每块\
  \ 100 美元。2019 年，作为“创世纪广场”部分的 Estate 331 以 80,000 美元出售，成为该年度第二昂贵的非质化代币 (`NFT`)。几个月前，一块未开发的土地的价格已达到\
  \ 8,000 个 `MANA`（约 1,400 美元），在三年内增长了 14 倍。自游戏推出以来，已有超过 50,000 次 `LAND` 交易，总额超过 3000\
  \ 万美元，平均价格为 560 美元，因此这些数据并非异常值。目前所有 `LAND` 的总价值约为 1 亿美元——正在增长。\n\n\n\n\n\n虚拟房地产的投资是通过交换和购买非同质化代币（NFTs），这是一种代表独特事物的特殊加密代币；因此，非同质化代币不可相互替代。这与包括\
  \ `bitcoin` 在内的加密货币的同质性形成了对比。每个 `NFT` 都是独特的、不可分割的且不可替代的。\n\n数字房地产 `NFTs` 可以在 `NFT`\
  \ 市场平台上进行交易，其交易过程比现实世界的房地产交易要透明和高效得多。尽管如此，它们的流动性仍不如在大型交易所交易的其他加密货币。\n\n虚拟房地产的所有权是通过\
  \ `NFT` 注册在去中心化账本上的，而不是通过传统的契据或所有权证书——后者是很难转让的。持有者无限期保留其数字资产的所有权，即使 `Decentraland`\
  \ 关闭或被开发者遗弃。\n\n`NFTs` 作为所有权代币的接受和采用证据，可以通过市场的深度和一些近期交易的规模得到最好的证明，其中包括在元宇宙 `Axie\
  \ Infinity` 中以 150 万美元出售的房产。\n\n在当前低利率和高通胀的环境下，对韧性资产的追求将继续，使得加密资产看起来比其他现实世界资产类型波动更小。\n\
  \n我担心现实世界的房地产市场。零售、办公和酒店业的租金和入住率已经暴跌，其未来前景依然黯淡。单户公寓和房屋似乎对疫情具有免疫力，但在薪资停滞的情况下，它们的价格还能上涨到什么种程度才会变得负担不起呢？\n\
  \n房地产仍然是世界上最有价值的资本存储地和通胀对冲工具之一，但即使是最坚定的支持者也在讨论如何为现在的房地产定价。\n\n`Decentraland` 的早期版本很笨拙，但该游戏自发布以来有了巨大的改进，玩家也注意到了这一点。游戏土地主花费了大量的时间和金钱创建复杂的建筑结构、可穿戴设备和游戏。游戏开发者不断添加新功能。他们以无与伦比的透明度工作，通过一个公开访问的\
  \ `Trello` 面板，为社区提供了 `Decentraland` 未来预期的发布、功能和改进的完整图景。\n\n游戏内的讨论板，以及 `Discord`\
  \ 和 `Reddit` 上的论坛非常活跃。土地和可穿戴设备等游戏内购买的二级市场流动量似乎正在增长。每当我再次访问 `Decentraland` 时，我注意到更多的用户和互动。与此同时，游戏内资产价格正在上涨。\n\
  \n尽管如此，`Decentraland` 的人口仍然稀疏，大多数 `LAND` 尚未开发。部分稀疏的原因是由于该游戏的设计是为了满足一个尚未实现的庞大用户群，因此它是通过多个服务器运行的。这个系统的灵感来自\
  \ `Minecraft` 和 `Fortnite` 等游戏，这些游戏在任何时候都有数十万名玩家，因此需要许多“服务器”来避免产生拥挤的感觉。结果，玩家在典型的访问\
  \ `Decentraland` 时，只能遇到少数其他玩家。\n\n这种现实对某些人来说可能令人不安。（人都去哪里了？）对我来说，这似乎是一个早期进入的绝佳机会，是一个自诩异类者的新世界乌托邦的起点。\n\
  \n## 虚拟社交是不可避免的\n\n虚拟世界并不新鲜。`Eve Online` 和 `Second Life` 都是为成人设计的，于 2003 年推出，并在巅峰时期吸引了数百万用户。玩家在这些游戏中建立了复杂的经济体系。然而，这两款游戏在现实世界仍然严重依赖线下互动时就达到了人气巅峰，随后便逐渐让位于现代基于加密的新兴力量之后。那些游戏只是早了一点。\n\
  \n从那时起，人类的互动和社交在很大程度上已变得虚拟化，大多数人将他们的社交和业务互动转移到了手机或笔记本电脑上。如果说人们曾选择在屏幕上而不是面对面社交，那就是现在，因为一场全球大疫情迫使我们所有人在线。这些新习惯将变成持久的行为和文化转变，从长远来看将改变我们对什么是正常和接受的认知。\n\
  \n这种向减少现实生活互动的转变有许多例子，例如 `Clubhouse` 的出现，它是播客与 1980 年代派对电话的结合，是 2020 年增长最快的初创公司之一。它是一个完全虚拟的——音频的——一种正在爆发式流行的社交体验。\n\
  \n当我们投资时，特别是投资房地产时，我们必须尝试预测未来——十年或更久远的未来。现在的孩子在十年后将是成年人，他们的品味将决定什么成为主流和规范。\n\n我的孩子完全沉迷于虚拟世界视频游戏，尤其是\
  \ `Minecraft`，这是史上最畅销的视频游戏。（例如，如果我问孩子们更想和朋友一起玩还是玩 `Minecraft`，他们总是选择后者。）他们对 `Minecraft`\
  \ 的成瘾以及数百万其他学龄儿童的成瘾受到了近一年在线教育的推动，这导致了过度的屏幕时间和对视频游戏的接触。\n\n`Minecraft` 和其他相关游戏影响着孩子们与技术以及彼此交流的方式。`Decentraland`\
  \ 和其他面向成人的加密类虚拟世界针对的是那些已经玩腻了儿童游戏的玩家，他们正在寻找基于社交和交易的深度人际互动，而不是寻宝和杀戮敌人。成人游戏的用户界面 (`UX`)\
  \ 遵循着与儿童游戏相同的习惯。\n\n\nAilin Graef（更广为人知的 Anshe Chung）于 2004 年开始在 `Second Life` 中收集虚拟房地产。她起步时的资金不足\
  \ 10 美元，但随后成为第一个通过完全在虚拟世界内进行的业务交易积累了超过 100 万美元净值的虚拟形象。围绕 Anshe Chung 的神话导致了今天对虚拟房地产和\
  \ `NFT` 投机的狂热。\n\n学习最新的规则是在虚拟世界中投机土地的秘诀。过去有利于富人的旧规则已不再有效。房地产的老格言“地段、地段、地段”意味着价值由其可见性和接近性决定。然而，在虚拟世界中，玩家可以使用笛卡尔坐标传送到到新位置，因此人流量和可见性不再那么重要。\n\
  \n在虚拟世界中，重要的是为像素化和平扁平的东西赋予生命和人性，吸引玩家去某处，并鼓励他们返回并互动。（这些定居点也被称为“内容簇”）在虚拟世界中，设计和独创比预算和位置重要得多。\n\
  \n`Decentraland` 的开发者采取了非常谨慎且轻量的方法来构建游戏的基础层。新的项目和合作已经在进行中，旨在将这个虚拟世界变成一个复杂且交互的替代现实——它可能会变得像现在的\
  \ `Instagram` 和 `Facebook` 一样受欢迎和上瘾。\n\n`Decentraland` 不会有单一的赢家。这正是它将成功的原因。通过公平竞争的环境。`Decentraland`\
  \ 将自己打造成了创造理想虚拟世界——一个乌托邦的追求者的赢家。\n\n出于所有这些原因，我相信数字房地产是一个可行的投资选择。虽然这种资产类别仍然具有极高风险，且本金全损是一个可能的结果，但对于风险承受能力强的投资者来说，考虑在另类投资组合中分配一小部分给这一资产类别可能是明智的。\n\
  \n\n\n此外，参与这一虚拟经济的人将发现，现在是其中的一个令人兴奋的时刻。\n\n也许我们中最愤世嫉俗的人也会被进入新世界并重塑自我的前景所吸引。上上色彩丰富的画面、音乐、艺术以及来自世界各地的新朋友，不难理解\
  \ `Decentraland` 为什么会变得越来越流行。\n\n虚拟房地产的早期采用者将以与现实世界市场相比仍可负担起的价格入手。那些早期投资并长期持有的人将从中受益，就像现实世界中快速增长领域的先驱者一样。\n\
  \n\n`Pascal Boyart` 是一位巴黎街头艺术家。2019 年 1 月，他在一个工人阶级社区描绘了一幅受 `Eugène Delacroix` 杰作《自由引导人民》启发的壁画。他赋予了它现代化的诠释。`Boyart`\
  \ 将 19 世纪的法国反抗者（那些推翻`查理十世国王`的人）替换为“黄背心”抗议者，取决于你问谁，他们要么在为正义而战，要么在煽动暴乱并焚毁城市。法国政府对此并不高兴。他们很快用中性灰色覆盖了\
  \ `Boyart` 的作品，将其信息从世界上抹去了。\n\n“今天，这幅物理壁画已经不存在了，”`Boyart` 在巴黎告诉我。“这带给我很多快乐。”\n\n\
  `Boyart` 创建了这幅画的非同质化代币（`NFT`）版本，分为 `100` 部分，每份售价 `0.5 ETH`。他本可以卖出更多的 `NFTs`。过去 `Boyart`\
  \ 很难让他的街头艺术变现——涂鸦很难卖，很少有街头艺术家能赚到 `Banksy` 的钱——但 `NFTs` 为他提供了直接向粉丝出售作品的方法。而且突然变得非常有利可。2\
  \ 月 26 日，他的 `NFT`《红小丑的沉思》以 `75 ETH`（当时价值 112,000 美元）售出，了他迄今为止最大的一笔交易。\n\n`Boyart`\
  \ 并不孤单。`NFT` 销量正在飙升，其间点着由 `Beeple` 创建的一段价值 `660 万美元` 的 10 秒视频。`Beeple` 的加密作品目前正在佳士拍卖拍卖。\n\
  \n\n跟上最新的 `NFT` 进展几乎是不可能的。这里有几个例子：`Grimes` 以 600 万美元卖出了一个 `NFT` 组合；`Mark Cuban`\
  \ 的一条 `NFT` 推文（竟然是推文！）以 952 美元卖出；卡通蛙 `HomerPepe` 以出了 320,000 美元；`Lindsay Lohan`\
  \ 现在铸造 `NFTs`；`Shawn Mendes` 在销售 `NFT` 吉他；人们正在出售创世级推文；可能在你读完这段话时，我们就会收到`拜登总统`通过\
  \ `NFTs` 发放纾困金的消息。\n\n这不再是一个小众市场了。根据 `NonFungible` 的研究，2020 年 `NFT` 的交易额超过了 `2.5\
  \ 亿美元`，这还不包括最近的激增。这也不包括花费在 `NBA Top Shot` 上的 `2.3 亿美元`，这是一个数字“瞬间”（基本上是短视频集锦），它如此受欢迎以至于其开发者被\
  \ `200,000` 人的队列压垮了。\n\n想买 `LeBron` 扣篮的 `NFT` 吗？其中一个最近以 208,000 美元卖出。`Mark Cuban`\
  \ 深度参与其中，而且这一切发生在瞬息之间。不到两个月前，他告诉 `CoinDesk` 他正在探索 `NFTs`（这在当时还是新闻），而现在根据《今日美国》的报道，他认为\
  \ `NFTs` “在未来十年内可能成为 `NBA` 的三大收入来源之一。”\n\n\n\n她为 2004 年的惠特尼双年创作了一段名为《阿尔卡萨尔的 89 秒》的\
  \ 12 分钟视频，重新构思了迪埃哥·委拉斯克斯 1656 年经典作品《宫侍女》中的一个瞬间。评论家们为之倾倒。《纽约》杂志甚至将其誉为“杰出之作”，这部作品如此启发性，以至于“你会感受到艺术中构图的内涵”。\n\
  \n苏斯曼（Sussman）的视频通过 NFT 获得了第二次生命。`Snark Art`是她合作的机构。Art 是一家精通区块链的机构，与艺术家合作创造创新的格式，将视频切割成一个\
  \ 2,304 个份的网格。作为一种 `NFT`，收藏家可以购买其中一个微小的碎片。这些“原子”中的每一个只有 20 x 20 像素，并且可以被当作一部微型电影来观看。他们将这种新形式称为“89\
  \ 秒原子化”。\n\n到为止，这似乎与 Boyart 将他的街头艺术（那个黄色背心壁画）划分为 100 份的方法相似。他们并未止于碎片所有权，还增加了一个迷人的转折。如果你购买了苏斯曼\
  \ 2,304 个原子之一，你只能看到他作品的一小部分，这在脱离了语境的情况下毫无意义。\n\n然后是区块链。得益于智能合约的魔法（`NFTs`中定义所有权的代码），你可以向“89\
  \ 秒原子化”的所有其他`NFT`所有者“请求贷款”，当他们将所有像素都借给你时，你就可以以其原有的全貌重建这件作品。参与了合作的`Snark Art`联合创始人米莎·利布曼（Misha\
  \ Libman）说：“我们在想，在数字意义上，所有权会是什么样子的？”\n\n“你拥有一件大多数人负担不起的高价艺术品。但如果你将其拆分并以每件 100 美元的价格出售，你就为收藏家提供了一个成为这个社区成员并拥有名画碎片的机会，同时也成为一个活跃的参与者。”\n\
  \n`NFTs`有各种形状和大小。它们可以只是实体的复制品，也可以是改进。它们可以解锁新的创作可能性。这可能通过艺术得到了最好的证明，例如 Boyart 的街头壁画。大多数绘画是静态的。这是每个幼儿园小孩都能理解的道理。颜料是不动的。另一方面，Boyart\
  \ 利用他的`NFTs`为图像添加了动作、音频和增强现实。\n\nBoyart 让《美杜莎号的沉船》中的`NFT`动了起来，使木筏在水面上起伏摇曳。在《红小丑的沉思》中，当小丑落寞地瘫坐在椅子上时，美元钞票（或欧元）正毫无预兆地飘向地板。\n\
  \n这种技巧在数字艺术中长期以来一直是可能实现的；然而，以前那些早期的形式中任何一种都没有解决数字稀缺性问题。`NFTs`解决了这个难题。智能合约还可以允许艺术家在未来对雕塑进行编程更改。例如，Boyart\
  \ 目前正在开发一个层级会随时间改变的`NFT`。`NFT`艺术可能会被程序化为根据现实世界的事件（如天气、圣诞节早晨或选举结果）触发来显示各种图片——所有这些现在都是可能的。\n\
  \n`NFTs`正在吸引来自区块链世界之外的艺术家。以居住在纽约布鲁克林的油画家伊丽莎白·梅格斯（Elizabeth Meggs）为例。梅格斯是我的朋友，当她毫无其来给我发邮件询问`NFTs`时，我大了一惊。她每周都会与工作室的其他艺术家进行`Zoom`聊天，他们不断地讨论`NFTs`。\n\
  \n“在 Clubhouse 上谈论艺术的第一个不成文规定是，所有对话不可避免地会导致对`NFTs`的痴迷，”玛丽·马内克（Marion Maneker）在《艺术新闻》上说道。理解的是，艺术家会是早期采用。根据梅格斯的说法，“艺术家往往比普通大众先发现美事物，”比如“在社区变得热门之前在当地租工作室。”\n\
  \n美国主要博物馆的藏品中 87%来自男性——其中 85%来自白人男性。在理论上，`NFTs`具有平公平竞争的潜力。\n\n梅格斯对制作自己的`NFTs`充满热情，探索它们提供的创作可能性，并观察它们可能如何帮助艺术世界变得更具包容性——特别是对于女性和有色种族。它们在作者和收藏家之间建立了直接接触，绕过了长期以来表现出偏见的中间人。\n\
  \n“我想创作艺术品，”梅格斯说，“我不想花光一生和精力去与一个深有偏见的系统作斗，在那个系统中，我必须依靠关键持有者——在非常有偏见的艺术机构——来为信誉和成功打开许多大门。与其关上门，`NFTs`感觉像是一个充满可能的奇新宇宙，”她解释道。\n\
  \n梅格斯并不天真。她很清楚`crypto`和艺术界一样由男性主导。尽管如此，她仍然很乐观。“我正在敦促我认识的所有女性艺术家立即开始做`NFTs`，”她说，“这是一个机会！”（梅格斯在随随后的邮件中也提到，许多艺术家担心`NFTs`对环境的影响，这在书中已经讨论过。）\n\
  \n`NFTs`的另一个吸引破坏性艺术家的特征是征收版税的能力。这是当今世界的一个空白。假设你是一个年轻艺术家，卖出了一幅 1000 美元的油画。你觉得它值更多，但你必须付房租。然后你火了。三十年后，你的艺术品以\
  \ 3000 万美元卖出。在现世中，你的版税是多少？什么都没有。（海外情况不同。梅格斯说：“追索权，即艺术家转售权，为艺术家或其继承人提供转售费用……在世界上许多国家很流行。但遗憾的是，在美国我们只有销售政策。”）\n\
  \n通过`NFTs`，版税可以通过合约编码到作品中，确保每当你的作品被出售时你都能获得部分收益。\n\n当 Boyart 的《红小丑的沉思》出售时，他获得了 5%的抽成——从另一个收藏家手中。\n\
  \n同样的概念也适用于音乐。问问“Vandal”，一位加拿大嘻哈歌手兼制作人。他在 2017 年发布了一首名为《Rap Crypto》的歌曲，那是上次牛市运行的时间胶囊，歌词如：“Rap\
  \ Crypto Yall Know Bitcoin …… See I’m Vandal, the Token Wrapper …… Follow me as\
  \ I go, Rambo, to the moon in my brand new Lambo …… Could it be that I’m Satoshi\
  \ Nakamoto?”\n\nVandal 最初对 CryptoKies 不屑，“这是什么鬼，收集猫？”但他随后看到了大局。他开始研究音频`NFTs`，被`DAOs`（去中心化自治组织）迷住，并最终创立了`DAO\
  \ Records`，该机构已寻求 100 位音乐人的帮助并发布了约 50 个音频`NFTs`。（Vandal 很快指出他不是第一个发布基于音乐的`NFTs`的艺术家，他将\
  \ Connie Digital 称为“音频 NFT 的鼻祖”。）\n\n对于 Vandal 来说，音频`NFTs`不仅仅是一个绝妙的噱头、一种时尚或一种聪明的赚钱方式。“目前的音乐产业模式已经坏了，”这个问题可以追溯到\
  \ Napster 时代。“然后苹果出现了，并认为 99 美元的 MP3 是值得的。谁赋予了他们决定音乐价值的权威？结果是音乐损失了大量价值。”在 YouTube\
  \ 或 Spotify 上流媒体也不如何，因为“他们给艺术家的钱太少，却拿走了太多。”没有分享。没有与粉丝的互动，”他说。\n\n\n\n\n根据 Vandal\
  \ 的说法，NFT 解决了所有这些问题。艺术家可以根据自己的意愿自由为音乐定价。“NFT 提供了与粉丝之间的直接链接……你可以自由地向他们提供任何你想要的东西。”这是一个培养忠诚度、加强社区并摆脱对你无法控制的平台（以及唱片公司）依赖的方法。这解释了为什么像\
  \ `Kings of Leon` 这样的艺术家对 NFT 如此感兴趣，他们最近宣布了发行 `NFT` 专辑计划。你可以将 NFT 与现实世界的福利相结合。根据\
  \ `Rolling Stone` 的报道，最独家的 NFT 将包含一张“金票”，让代币用户在“每场巡演期间获得任何 Kings of Leon 演出的终身四个前排座位”。\n\
  \n这太令人兴奋了；它解放了人们。\n\n`Kings of Leon` 并不是唯一考虑 `NFT` 票务的乐队。“这是一个很棒用例，”位于利斯本的 `NFT`\
  \ 平台 `Mintbase` 联合创始人 Carolin Wend 说。她指出，基于票务的 NFT (`TNFTs?`) 让像音乐节这样的活动组织者能够简单地在合作伙伴之间分配收入。\n\
  \n假设你是一个音乐节推广者。你可以告诉 DJ，“你将获得每张售出票的 5%”，然后雷鬼乐队将获得 5%。房东获得 10%，以此此类推。支付将是即时、透明且可验证的，并在区块链上确认。“它确保了在创意经济中工作的员工获得公平的回报。”\n\
  \n`Coachella` 和 `Ultra` 不可能在短期内接受 `NFT` 票的想法，就像 NFT 在短期内也不可能完全“颠覆”传统艺术世界一样。`Snark\
  \ Art` 的 Misha Libman 估计艺术市场本身的年销售额约为 600 亿美元。“目前，数字艺术还不到数字的一半，”他说，“它在传统市场中几乎不存在。”\n\
  \n我采访了一位代表传统的男士。Nicholas Lowry 是纽约 `Sw Auction Galleries` 的首席拍卖师，那里是纽约最古老的本土拍卖行。他以其华丽的格子纹西装和八字胡须而闻名。\n\
  \n“有趣的是，NFT 同时从六个不同的地方进入了我的视野，”Lowry 说。每个人突然开始告诉他关于 NFT 的事情。他们不断给他发文章。“如果这是一场营销活动，或者针对汽车或服装品牌的广告活动，他们已经以某种方式中了大奖，”他说，显然露出了困惑的神情，“天妈的，全世界都在谈论这个。”\n\
  \n那么，他准备好跟上这个趋势了吗？Lowry 停顿了一下。“我们不是一家尖端科技公司。”我不想做第一个做这件事的人，但也不想最后一个。”\n\n他处于一种“观观其变”的状态。也许这是未来，但也可能是一个转瞬即逝的趋势。“当买这些东西不再是埃隆·马斯克时，我们将看看它是否还有活力。”\n\
  \n\n市场发展的原因之一是现在很容易制作你自己的 NFT。“今天，任何人都可以想象他们的植物，将其铸造（mint），然后在交易所挂牌并尝试售出，”Libman\
  \ 解释道。\n\n于是我决定尝试一下。\n\n我最近搬到了 `Denver` 的一个新地方；因为我是单身汉，墙上没什么什么可以挂的东西。所以我挑选了我最棒的一些度假照片进行放大装框，并选择了一张\
  \ 30 英寸 50 英寸的 `Iceland` 冰川照片作为我最大的墙面的焦点。\n\n我可以把这张照片作为 `NFT` 卖掉吗？如果我认为它有足够的现实价值可以挂在巨大的墙上作为一件艺术品，也许其他人也会有同样的感受吧？我也想亲眼看看它是如何运作的。\n\
  \n我立即创建了一个 `OpenSea` 账户。入驻流程简单快速。当被要求输入拍卖起拍价时，网站允许我填写的最低金额是 540 美元，或当时的 `0.4 ETH`，这是一个荒谬的高价，我觉得很有趣。（你可以选择以较低的固定价格列出，，或者开始拍卖，而这是拍卖的最低起拍点。也完全可能是我做错了。）但是，嘿，这张\
  \ `NFT` 图片要 540 美元，为什么不呢？加密货币的很大程度上是基于这样一个理念：如果人们相信某物有价值，它就有价值。即使 `Dogecoin` 现在也有价值。也许有人会认为我的照片值\
  \ `0.4 ETH`，所以他们会买，然后哇，它就值了？\n\n飙升的 Gas 费是该领域的一个普遍问题。\n\n在我发布广告之前遇到了一个小插曲，我必须支付\
  \ `OpenSea` 一笔一次性的 Gas 费，以便为我以后所有的销售设置 `Ethereum` 智能合约。那时的费用是 91 美元。飙升的 Gas 费是该领域的一个普遍问题，这也是某些\
  \ `NFT` 平台转向各种区块链的原因之一（例如 `NBA Top Shot` 使用 `Flow`）。\n\n据 Wend 说，`Mintbase` 正在迁移到一个名为\
  \ `NEAR` 的区块链平台，因为“普通人永远不会花 50 美元去铸造一个 `NFT`。“我认为 `Ethereum` 对很多人来说是一个极佳的试验场，但它不是未来，”她说，“它太贵、太臃肿了。”当然，`Ethereum`\
  \ 爱好者正期待着 `Ethereum 2.0`。）\n\n我的照片发布突然变成了一次昂贵的事实检查，但我还是完成了交易。\n\n当我的新 `NFT` 铸造成功后，我密切关注\
  \ `OpenSea` 的新列表源流，看它何时出现。它们每秒出现一个，像是一条像素小商品的流水线，就像 `Satoshi` 的小精灵制造的加密玩具。它让你实时洞察这个领域扩张得有多快。\n\
  \nNFT 市场至少在一个点上是正确的，那就是我那张糟糕照片的价值，它远没有达到 `0.4 ETH`。它在拍卖中没有卖出去。所以我将其重新列出为 `0.01 ETH`（16\
  \ 美元）。截至出版时，它还没有售出。\n\n## 身份象征\n\n让我们转向买家。为什么人们愿意花数千美元购买没有像 `Pac-Man` 那么先进的低分辨率艺术？我想可能有两个原因：人们要么是因为审美愉悦而喜欢数字艺术，要么是因为他们认为自己能从中赚钱。\n\
  \n然后我发现了第三种可能性。我与 `Outlier Ventures` 的 CEO `Jamie Burke` 聊了，这是一家总部位于 `London` 的区块链投资公司，提供风险投资、加速器计划和其他服务。Burke\
  \ 也是 `NFT` 的狂热收藏者，对该领域非常熟悉。他创建了“100XARt”Discord 频道，那是顶级 `NFT` 收藏者的聚集地，他们合作在 `Decentraland`\
  \ 中建立了一个艺术区。Burke 关于人们为何购买 NFT 的理论是？社区归感。\n\n根据 Burke 的说法，`NFT` 可以被视为一种社交货币。在某些加密圈子里，它们是你的归属证明。当\
  \ Burke 第一次看到早期极像素 `NFT` 艺术，如 `CryptoPunks` 时，他并不喜欢那种审美。他认为它过度自指涉了。“这并不是我想挂在墙上的东西，”他对自己说。在与社区的几位收藏者交流后，他意识到\
  \ NFT 与内容与其无关。重要的是所有权这一事实。“拥有一个 `CryptoPunk` 意味着你声称在 NFT 的初始形式时期就感兴趣，并且在全世界之前理解了它。”它是字面意义上的数字荣誉勋。\n\
  \n这让 Burke 想起以前人们为什么购买 `LP` 专辑。当然，声音那种温暖且带有杂音的浪漫可能吸引你购买专辑，但你也是将其作为一件珍贵的器品购买的。而这件器品让你在唱片爱好者社区中获得了地位。\n\
  \n“考虑一下互联网做了什么。“这一切都被数字音乐摧毁了，”他解释道，“音乐变成了可以流媒体和消费的商品。拥有音乐的想法已经消失了。”尽管 NFT 是一项革命性的新技术，但它们也触及了某种原始而古老的东西，即\
  \ Burke 所说的“一种真实的人类渴望”。\n\n\n\n\n另一方面，在 NFT 上花钱是展示你加密财富的一种方式。问问 Twitter 上那个名为“GMoney.ETH”的家伙（这很可能是一个真人）就知道了。这个人花费\
  \ 140 ETH（当时约 15 万美元）购买了一个 24 X 24 像素化的 CryptoPunk，这是加密艺术最早且最广为人知的形式之一。它的外观看起来像\
  \ 1983 年的雅达（Atari）图形。（对于那些对 CryptoPunks 的起源感兴趣的人，你会发现 BreakerMag 和 Jessica Klein\
  \ 写的写的非常迷人的深度解析。）\n\nGMoney 在在线加密货币社区度过更多时间后，在 Twitter 上解释道，他了解到“成为 CryptoPunk 的所有者就像是某个精英俱乐部的成员”。接着他直奔主题：“当有人在现实世界买一块劳力士时，他们花费数千美元并不是因为手表的实用价值。”一块\
  \ 5 美元的手表也能实现相同的功能。这是为了“炫耀”他们的身份地位。\n\nGMoney 购买了他的版本的劳力士，但与那些可能是廉价仿品的闪亮手表不同——他的\
  \ CryptoPunk 的真实性是可以在区块链上进行验证的。另一方面，几乎可以肯定，劳力士在十年后仍将保持价值。\n\n即使投机泡沫破灭，声称 NFT 提供了某种价值似乎也是合理的——即使这种价值完全是情感上的——对于像\
  \ Burke 这样的收藏家和像 Boyart 这样的艺术家来说都是。它们可以被用于创造、游戏、组织、交流和欣赏美。Burke 说：“当你回顾 2017 年的牛市时，驱动它的关于人们发富的媒体新闻报道。那是单维的。它最终熄灭了。”当人们停止赚钱时，他们离开了。“有了\
  \ NFT，这不仅仅关乎钱。它要可持续得多，”他说道。\n\n当然，其他人可能会对此嗤之以鼻，并声称这些 NFT——那些像素化的青蛙、表情包和加密讽刺——简单来说“不是艺术”。这可能是的。然而，正如\
  \ NFT 护者们喜欢指出的那样，安迪·沃霍尔番茄汤罐也曾有过类似的评价。\n\n# 第 11 章：\n\n# NFT、房地产与惊人的虚拟世界（DECENTRALAND、THE\
  \ SANDBOX、SUPERWORLD……）\n\n## NFT 销售对数字房地产意味着什么\n\n如果 NFT 艺术品价值数百万，那么什么能阻止虚拟世界房地产价值的增加呢？\n\
  \n在纽约市，中央公园南端有一排高大纤细的公寓楼，这已被称为“富翁豪街”（Billionaire’s Row）。那里的公寓平均售价超过 3,700 万美元，有些甚至超过了\
  \ 1 亿美元，其中一栋甚至拍高达 2.4 亿美元。\n\n虽然这些建筑拥有超豪华的装修和令人叹为观止的景观，但当地人经常讨论这些价格看起来有多荒谬。也许更奇的是，几乎没有人住在这些公寓里；它们是空着的。这些空公寓以如此高价格售出的事实令人们感到震惊。\n\
  \nJanine Yorio 是 Republic 的房地产部门和 Republic Realm NFT 基金负责人，该基金投资数字房地产。\n\n事实证明，人类在资产定价方面表现得极其糟糕，尤其是当它们的价值指数级高于其其实际用途时。这解释了为什么人们对富翁豪街的价格感到困惑，或者当艺术品去值化时不断感到惊讶……\n\
  \n## 对虚拟房地产价值的集体信仰已经在扩张\n\n结果是自我实现的。随着内容变得越来越吸引人，会有更多的用户访问元宇宙，从而吸引更多的企业赞助。\n\n\n\
  \n此外，Beeple 的拍卖已经表明，像 `Christie's` 这样的合法化力量可以吸引大量的现实世界财富。随着现实业务在虚拟世界中立足，它们可以推高物业价格并鼓励对新的社区建设项目的投资，从而创建一个具有信誉参与者和高昂价格的新型高价值数字房地产生态系统。\n\
  \n艺术界对 `NFTs` 的快速采用展示了这些变化发生得有多快。虽然花费 10,000 美元购买一块像素化的“土地”似乎是不理性的，但请注意， 11 月份每包\
  \ 9 美元出售的某些数字 `NBA TopShot` 卡片此后已以每张 20 万美元的价格售出。\n\n所以我们知道为什么数字房地产可能有价值，但我们为什么认为它会继续保持价值或升值呢？这与人们为数字艺术和数字篮球卡牌支付比现实世界等物更高价格的原因相同：可转让性。\n\
  \n你一定听说过难民将宝石缝在衣服下摆以隐藏财富，并在移民时随身携带。加密资产可以很容易地移动。数字房地产不仅变得越来越贵，而且其可转让性可以将其价值推向远超任何感知用途或稀缺价值。\n\
  \n与现实房地产不同，数字房地产可以在几分钟内出售，不需要律师，因为其所有权历史记录在自包含的去中心化区块链账上。此外，数字地下室和建筑永远不会淹水，也不需要更换新屋顶。\n\
  \n目前不断上涨的 `NFTs` 和数字房地产价格与一旦世界其他地区跟上后的价值相比是微不足道的。因此，我相信最好的虚拟房地产土地升值速度可能比现实房地产更快。\n\
  \n## 虚拟房地产热来袭\n\n随着 `NFTs` 的兴起以及 `COVID-19` 对房地产市场的冲击，像 `Decentraland` 这样的虚拟世界可能处于极佳的资本化位置。\n\
  \n我的整个职业生涯都在寻找投资房地产的新方法，最近最近我在 `Decentraland` 上花费了大量时间。我的一个同事多年一直催促我研究基于区块链的数字房地产，但直到最近，这一切才让我豁然开朗。\n\
  \n数字房地产已经确立了自己作为值得投资者考虑的合法资产类别，我相信它在不久的将来将呈指数级增长。\n\n由于数字房地产与日益增长的加密投资宇宙保持一致，它不仅具有产生超额回报的潜力，而且似乎具有成为可行财富存储的潜力，类似于现实房地产和现实艺术。数字房地产存在于虚拟世界中，每个世界都有自己的“数字国家”和一套定义明确、不可撤销的产权体系。今天在虚拟世界中购买土地非常像\
  \ 1750 年在曼哈顿购买土地。它还免受现实房地产行业受新冠肺炎引起的不确定性的影响。\n\n`Janine Yorio` 是 `Republic` 的房地产负责人，`Republic`\
  \ 是一个面向个人投资者的在线投资平台，最近推出了 `Republic Realm`，这是一个数字房地产基金组合。她此前曾担任 `NorthStar Capital`\
  \ 的投资组合经理，以及 `Standard Hotels` 的房地产制作负责人。\n\n在虚拟世界中，玩家居住在化身体内并与世界（或“元宇宙”）交流。他们可以与其他用户交流，通过玩游戏和赌博赚取加密货币，在画廊购买艺术品，参加活动和演唱会以及各种其他活动。`Cryptovoxels`、`Axie\
  \ Infinity`、`Somnium Space` 和 `The Sandbox`（尚未上线）是其他基于加密的虚拟世界。尽管如此，`Decentraland`\
  \ 仍然是增长最快、最发达的一个。\n\n## 元宇宙\n\n随着元宇宙的到来，我们今天所知的世界将发生巨大变化。元宇宙将提供一个替代性的数字现实，人类可以在其中不仅生活、工作和娱乐。\n\
  \n### 概述\n作为投资者，你为什么要投资它？根据 `Bloomberg` 的数据，元宇宙的市场规模预计到 2024 年将达到 8000 亿美元。这显示了元宇宙在未来几年内可能有多盈利。\n\
  \n你可以进行哪些元宇宙投资？开始投资元宇宙的最佳方式是什么？哪些是最好的代币？\n\n### Decentraland (MANA)\n\n`MANA` 是\
  \ `Decentraland` 的代币，另一个你应该关注的元宇宙代币。\n\n`Decentraland` 是一个建立在区块链上的虚拟现实平台，允许用户在购买、交易和建造土地的同时，玩游戏、生成内容并相互建立联系。\n\
  \n`Decentraland` 是 `NFT` 领域最大的虚拟宇宙，由 `LAND` 代币代表，这是一种非同质化 `ERC-71` 代币。`Decentraland`\
  \ 上的每一块 `LAND` 都是独特的，其所有者对其如何使用它拥有完全控制权。\n\n`MANA` 可在平台上购买 `LAND`。`MANA` 是 `Decentraland`\
  \ 的主要代币，也用于购买 `LAND`。它还作为原生实用型代币用于支付产品和服务。它同样基于 `Ethereum`，并可以与其他加密货币或法币交换进行购买和交易。\n\
  \n`MANA` 的总供应量固定为 26 亿 `MANA`。这意味着在任何时刻，`MANA` 的数量永远不会超过 26 亿。\n\n### The Sandbox\
  \ (SAND)\n\n`SAND` 是元宇宙中另一个值得关注的代币，最大供应量为 30 亿。`The Sandbox` 是一个建立在 `Ethereum` 上的虚拟世界，就像书中其他平台一样。\n\
  \n玩家可以在平台上创建、市场化并拥有他们的游戏体验。`SAND` 代币是一种 `ERC-20` 实用代币，用于治理、质押和交易。\n\n### SuperWorld\n\
  \n`SuperWorld` 是一个增强现实环境，允许用户使用 `NFTs`（互联网的流行语）购买和交易虚拟房地产。\n\n公司宣布 `props` 将用作公司的忠诚代币。`SuperWorld`\
  \ 的用户将能够获得进入 `SuperWorld` 虚拟世界的福利。由于 `NFTs` 可以唯一标识数字土地及其所有者，他们希望从虚拟房地产投资中获利。\n\n\
  它类似于 `Upland` 和其他现实虚拟房地产游戏。CEO Hrish Lotlikar 和 Max Woon 在 2017 年创立了 `SuperWorld`。随着\
  \ `NFTs` 气气的飙升，该平台日益受到大众的接受。\n\n`SuperWorld` 虚拟房地产允许你对映射到地球上的约 648 亿块虚拟地块提出主权。在\
  \ `SuperWorld` 中，每块土地都是一个 100x100 米的多边形，对应于现实空间。\n\n该平台遵循可交易资产的 `ERC-721` 标准，这意味着每个区块都被归类为收藏品和独特的资产，可以买卖、交易或持有。当用户在\
  \ `SuperWorld` 中购买物业时，他们将获得 `Ethereum` 区块链的一个部分，并从其物业上的 `NFTs`、游戏、电子商务和广告活动中获得收益机会。\n\
  \n在声明中，`Lotlikar` 表示，所有 `SuperWorld` 用户都应该从他们在平台上任何活动创造的价值中受益。他声称，通过将 `Props` 作为忠诚代币，公司正在为活跃的社区成员提供福利，让他们在他们构建的网络中拥有财务权益。\n\
  \n在声明中，`Props Public Benefit Corp.` 的联合创始人 `Adi Sideman` 表示，他相信 `SuperWorld` 的元宇宙愿景，并且\
  \ `Props` 整合到 `NFT` 环境和市场是 `Props` 生态系统的惊人的一步。\n\n\n\n\n# 第 12 章：现在最收藏的畅销 NFT 艺术家\n\
  \n女士们、先生们，请坐稳了，因为 NFT 是目前最火热的艺术商品。\n\n非同质化代币是在区块链上创建的艺术品，具有独特的加密代码，允许所有权并验证真实性。NFT\
  \ 可以是任何东西，从一件数字艺术品到整首歌或专辑。NFT 趋势也引起了时尚设计师的关注。\n\n来自全球不同年龄的艺术家正在接管加密艺术世界，从 18 岁的\
  \ `Fewocious` 到 87 岁的 `José Delbo`。2021 年 3 月售出了超过 50.9 万件 NFT 作品，销售总额超过 8500 万美元。这是一件大事。\n\
  \n你想买一些 NFT 艺术但不知道从何开始吗？`Cryptoart.io` 维护着按总销售价值排名的艺术家列表。数据提取自各种数字画廊，包括 `SuperRare`、`Foundation`、`Nifty\
  \ Gateway`、`MakersPlace`、`Async Art` 和 `KnownOrigin`。虽然数据不断变化，以下是目前的顶级 NFT 列表。\n\
  \n## BEEPLE\n\n总艺术品价值：$113,100,017.88\n\n在与 `Christie's` 拍卖行进行了一场历史性的拍卖后，艺名为 `Beeple`\
  \ 的 `Mike Winkelmann` 成为最畅销的 NFT 艺术家作品 `\"Everydays: The First 5000 Days\"` 以 69,346,250.00\
  \ 美元售出，这是主流媒体关注 NFT 销售的部分原因。这也是知名拍卖行首次出售加密艺术并接受 `bitcoin` 作为支付方式。\n\n`Beeple` 的作品平均每件售价为\
  \ 133,849.86 美元。他继续在 `Instagram` 上创作他的 `\"Everydays\"` 系列，在那里每天发布数字杰作。他的作品极具写实，描绘了从数字形状、风景到怪诞的政治插画的内容。\n\
  \n## TREVOR JONES\n\n总艺术品价值：$18,083,354.42\n\n出生于加拿大的英国艺术家 `Trevor Jones` 对艺术与技术的结合“完全着迷”。这位视觉艺术家在转向\
  \ `QR codes` 和 `augmented reality` 之前一直在画布上创作。在购买了他的第一枚 `Bitcoin` 后，`Jones` 被加密技术的力量及其与艺术的交汇所吸引。`Jones`\
  \ 与 NFT 领域一些最知名的人物合作，总共售出 5,284 件作品，平均每件售价 3,409.65 美元。\n\n他最畅销的作品 `\"Genesis\"\
  ` 是与阿根廷漫画书设计师 `José Delbo` 的合作之作，他绘制并动画化了 `Delbo 的蝙蝠侠图片`。他的独立作品 `\"The Bitcoin Angel\"\
  ` 是最畅销的。这幅油画描绘了金色 `Bitcoin` 前的两个大理石雕塑，以 188,888.00 美元售出。\n\n`Jones` 现在正致力于一个为期六个月的大型项目，将于\
  \ 8 月和 9 月发布 NFT。因此他目前没有创作新作品。他早期的收藏 `\"Bitcoin Angel\"` 可在市场上购买。\n\n## FEWOCIOUS\n\
  \n总艺术品价值：$18,037,594.08\n\n青少年艺术家 `Fewocious` 正在引领一场 NFT 复兴运动。这位 18 岁的数字艺术家是一位流行超现实主义者，席卷了\
  \ NFT 和加密世界。拥有 50,000 多名 `Instagram` 和 `Twitter` 粉丝，这位青少年艺术家总共售出了 3,103 件 NFT 作品，平均每件价值\
  \ 5,812.16 美元。\n\n一件名为 `\"The Everlasting Beautiful\"` 的作品以手托脸部的女性脸为特色是他的记录最高售价。每个特征都是独一无二的，既有单色部分也有色彩点缀。背景充满了与美和爱相关的陈述，复制了一个\
  \ 20 秒的视频，视频在某一刻对观众说：“只要告诉我我很漂亮就好。”随着女性嘴巴移动，她的眼睛闪闪发光。这件作品附带了 30x30 的画布、光油漆和油画料。`Fewocious`\
  \ 目前正在准备服装发布以及其他几个项目。\n\n## PAK\n\n总艺术品价值：$16,023,212.5\n\n匿名的 `Pak` 是 NFT 宇宙中最神秘的角色之一。`Pak`\
  \ 创作数字作品已二十年，无论是个人还是集体。凭借售出的 1,691 件作品，平均每件售价 9,354.99 美元，这位艺术家被世界上一些顶尖科技人物（包括 `Elon\
  \ Musk`）所知。\n\n`Pak` 的作品主要以单色为主，带有几何形状。售价为 900,072.96 美元的，`Pak` 的 `\"Metarift\"\
  ` 描绘了一个被似乎是四条纹带环绕的六球结构。在 12 秒的视频中，这两个结构反向旋转，金属色泽凸显了材料不同的底调。`Pak` 将与领先的拍卖行 `Sotheby's`\
  \ 合作，在 4 月举行全球 NFT 拍卖。\n\n## MAD DOG JONES\n\n总艺术品价值：$14,344,607.33\n\n`Mad Dog\
  \ Jones` 是一位出生在加拿大的动态、适应性强且超实的艺术家。`Mad Dog Jones` 结合音乐与艺术，售出了 1,567 件 NFT 作品，平均每件\
  \ 9,063.52 美元。\n\n`\"Boardwalk\"` 是 `Jones` 最畅销的作品，是一段 43 秒的视频，描绘了城市场景。小雨滴落在场景中，一辆出租车停在大巷上方。\n\
  \n## SLIMESUNDAY\n\n总艺术品价值：$11,624,226.24\n\n`Mike Parisella` 又名 `SlimeSunday` 是住在波士顿的数字艺术家。`SlimeSunday`\
  \ 对色时间和奇异主题的探索为他赢得了 500,000 名 `Instagram` 粉丝。“`Gunky's Uprising\"` 是他的最高售价。\n\n\
  ## HACKATAO\n\n总艺术品价值：$11,113,676.85\n\n作品总计 1,504 件，平均每件 7,310.61 美元。名字 `\"hack\"\
  ` 源于进入皮肤并发现内部事物的乐趣，而 `\"Tao\"` 则源于“阴阳”；`Hackatao` 探讨了人性、环境、社会和加密问题。\n\n`\"Kim Jong\
  \ Un - 'Dead and Alive' Edition\"` 是这对组合最畅销的作品，是一个关于朝鲜著名领导人在肉体与骨骼之间转换的动画。\n\n##\
  \ XCOPY\n\n总艺术品价值：$10,133,787.62\n\n`Xcopy` 是一位位于伦敦的数字艺术家和加密货币爱好者，售出了 1,907 件 NFT\
  \ 作品。`XCopy` 的作品探索了死亡、乌托邦和冷漠的主题，包括扭曲的视觉循环和闪烁的图像警告。\n\n## 3LAU\n\n总艺术品价值：$9,161,894.41\n\
  \n`Justin Blau` 是一位 DJ 和金融科技爱好者，自 2011 年以来一直发布电子音乐，并在 `EDC Vegas`、`Lollapalooza`、`Electric\
  \ Zoo` 等活动中演出。`3lAU` 是加密货币和区块链的早期使用者，目前是 NFT 运动中最知名的人物之一。`3LAU` 几乎完全以 NFT 形式发行音乐，售出了\
  \ 6,090 件作品，平均每件售价 1,505.54 美元。\n\n\n\n\n\n\"Gunky's Uprising\" 是与艺术总监 `SlimeSunday`\
  \ 合作的作品，是他最贵的作品，以 $1,333,333.33 出售。这首三分钟的歌曲配有 `SlimeSunday` 的视觉效果，并以他们的共同名 `SSX3LAU`\
  \ 出售。2018 年，`3LAU` 还举办了首场区块链驱动音乐节。\n\n## GRIMES\n作品总价值：$8,923,250.78\n\n在加入 NFT\
  \ 领域很久，加拿大歌手 `Grimes` 就是一位备受赞誉的另类流行艺术家。随着 1,122 件作品的售，平均单件价格达到 $7,983.33，`Grimes'`\
  \ 的粉丝立即迁移到了 NFT 空间。\n\n\"Death of the Old\" 是她收入最高的 NFT，以 $388,938.00 出售。粉色和白色的丘比特飞在一个看起来像废弃城堡的地方上方。在背景中，一把插在山中的剑在画面画面旋转时占据了屏幕中心。随着\
  \ `Grimes'` 的丘比特飞向观察者，合成器流行演示曲 \"Anhedonia\" 在整个视频中播放。\n\n## WHISBE\n作品总价值：$8,433,625.45\n\
  \n`WhIsBe` 是一位匿名街头和精细艺术家，根据他受欢迎的 `Vandal Gummy Bear` 系列创作了 NFT。这些深受爱的糖果与监狱入照背景并列在一起。`WhIsBe'`\
