  md: '# # Preliminary Study on Machine Learning Application for Parkinson’s Disease
    Diagnosis


    Ahmad Habbie Thies, Isca Amanda, Jessica, Nikita Akhsan Fitri, Rai Rona Althof,
    Sukmandhari Harimuti, Widyaawardana Adiprawita, Ita Ansari*


    Department of Biomedical Engineering, School of Electrical Engineering and Informatics

    Institut Teknologi Bandung, Bandung, Indonesia

    is_ansari@stei.itb.ac.id


    Abstract—Early detection for Parkinson’s Disease (PD) can be verified by investigating
    speech features of the patient. Using machine learning, PD can be well detected
    by investigating the speech Parkinson’s Disease (PD) dataset containing pieces
    of PD features and speech method used in this study. The investigated features
    were tested using Support Vector Machine, K-Nearest, Logistic Regression, Gradient
    Boost, Multi-layer Perceptron, and Decision Tree. The performance of all these
    methods was evaluated on accuracy, precision, and F1 score. Based on the results,
    the most suitable algorithm for PD is Machine Learning with an accuracy of 95.92%
    without data scaling.


    in Colorado, who recorded the speech signals. This study published the feature
    extraction methods for general voice disorders.


    Keywords—parkinson’s disease, speech analysis, machine learning


    The dataset composed of a range of voiced measurements taken from 31 people, with
    22 people having Parkinson’s disease (PD). The dataset collected in this study
    contains multiple voice samples per subject, such as vowels, numbers, words, and
    short sentences. Each line in the table has a particular measure and each row
    corresponds to one of 15 voices recorded from each subject. The method was used
    to discriminate people with PD. According to literature


    The dataset used in this study has many advantages such as various types of sounds
    for each subject, and many features that were collected in the dataset. The amount
    of data is lacking with a number of subjects that are only 31 people. All 23 features
    used in this study may not necessarily have a significant contribution to the
    diagnosis of Parkinson’s disease. However, the dataset is not fully fulfilled.
    With the subjects, only 8 people were not Parkinson’s sufferers. Dataset weaknesses
    may affect the accuracy of the resulting model, regardless of what algorithm is
    used.


    # I. INTRODUCTION


    Parkinson’s disease is a neurodegenerative disorder characterized by dopamine-producing
    neurons in the central nervous system; Dysfunction in the basal ganglia causes
    symptoms such as impaired speech fluency; Parkinson’s patient may have different
    voice levels in intensity as well as expected speech voice degradation or inability
    to produce sustained phonations,


    Currently, there is no specific test to diagnose Parkinson’s disease. Currently,
    research on the development of decision support tools, using algorithms to differentiate
    healthy individuals from Parkinson’s patients, has been conducted [1]. In this
    study, machine learning approach is investigated to diagnose Parkinson’s Disease
    using a dataset of speech features (a non-invasive method) from the University
    of Oxford. Some machine learning algorithms used in this work are Support Vector
    Machine, Linear Discriminant, K-Nearest Neighbors, Decision Tree, Naive Bayes,
    Gradient Boost, and Multilayer Perceptron. This work aims to gain knowledge of
    which learning model with given features or a patient’s case can give at least
    90% accuracy and a Mathews Correlation Coefficient of at least 0.9 to predict
    Parkinson’s Disease.


    # II. METHOD


    A. Dataset


    The speech dataset used in this study is from Oxford Parkinson’s Disease (OPD)
    Dataset. The dataset was created by Max Little from Oxford, in collaboration with
    the National Center for Voice and Speech


