    search (n). In this, n neighbors variation is


    # C. Linear Discriminant Analysis (LDA)


    LDA has classes in sklearn-learn package, i.components, priors, shrinkage, solver,
    covariance, and tol. For this case of classification, solver ''svd'' is ''False''
    and the threshold in parameter ''tol'' is set to a default value of 0.001. Using
    value ''svd'' in solver means the covariance matrix is not computed because the
    data has a large number of features available. The LDA is step-by-step as flow
    diagram in Fig. 2.


    # D. Gradient Boosting


    Gradient boost is implemented using Scikit-learn library. Gradient boost improves
    performance by combining multiple weak learner. An additive model was built in
    a forward stage-wise fashion which shows the optimization of arbitrary differentiable
    loss functions. In each case, n classes, regression trees minimize the negative
    gradient of the binomial or multinomial loss function. Binary classification is
    an example case where only a single regression tree is used.


    # E. Multi-Layer Perceptron (MLP)


    MLP is implemented by using the Python Scikit-learn package as described in Fig.
    3. It begins with Parkinson speech data uploaded to the system. Then, data is
    preprocessed to improve quality data. In data preprocessing stage there are several
    stages: scaling data, feature extraction and labels, separating training and testing
    data, data was separated from test and training set. MLP workflow as follow:


    +   1. Signal start from input layer, signal propagate to generate an output.

    2. On output network, calculate error.

    3. Backpropagate error, find derivative of each weight, minimize error.


