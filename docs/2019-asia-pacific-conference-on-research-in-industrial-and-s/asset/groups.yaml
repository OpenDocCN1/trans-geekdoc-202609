    # 2019 Asia Pacific Conference on Research in Industrial and Systems Engineering
    (APCRISE)


    From Table IX, it can be concluded that data scaling can improve performance of
    classifier system. Before scaling, dataset variant in range. It is harder for
    the classifier to model the data. Table XII shows the classification model implemented
    with decision tree algorithm. It is shown that the highest accuracy achieved with
    this method is when the ratio between test set and data is 25.


    Table XI shows the high accuracy achieved when the data is divided into 25-75
    between the test set and the train set. The selection of the test and train data
    is important for evaluating the performance of a machine learning process. On
    the contrary, the data training process may result in less accuracy which is not
    good enough.


    In addition to the size of parameter, other factors that are the parameters of
    the Multi-Layer Perceptron show the effects of the hidden layers and the elements
    of each layer. Table XI shows the effects and the elements of hidden layer.


    | Layer | Element 1 | Element 2 | Accuracy(%) |

    |---|---|---||}{

    | 1 | 10 | | 89.79 |

    | 1 | 50 | | 93.87 |

    | 1 | 100 | | 95.90 |

    | 2 | 10 | | 91.83 |

    | 2 | 50 | | 95.92 |

    | 2 | 100 | | 97.95 |


    TABLE XI OF NUMBER AND ELEMENTS OF HIDDEN LAYER ON ACCURACY


    Low performance of decision trees may be caused by reason, one prominent reason
    is that this method does not consider the inter-dependency of variables or target
    value on other variables.


    Adding flexibility in Decision Tree''s growth. Each decision in the first level
    may shape the tree as a single data point leads to get a totally different tree,
    if the sample is small or if the data is noisy. Pruning, and bootstrapping are
    methods to overcome this problem. Scaling does not improve its performance in
    trees.


    # B. Results Comparison


    From the classification results on previous part, it can be concluded that Multi-Layer
    Perceptron is the most suitable for this algorithm. MLP model have the highest
    accuracy with 95.92% result without processing data.


    Model performance of some other classifiers show the lack of accuracy because
    those of them come from the data classifier. If KNN and LDA perform better in
    small size of data but have a weakness in high features so they may not get enough
    accuracy to classify the PD using the dataset.


    # V. CONCLUSION


    The whole content of this paper is the development of machine learning technology
    implementation. Parkinson Disease diagnosis can be conducted through patient with
    the voice of the supportive learning algorithm for PD classification.


    After comparing 6 algorithms, it found that Multi-Layer Perceptron had the best
    performance with 95.92% result without processing data.


    The results from this paper can be used as a reference to develop Parkinson Disease
    analysis. Classification algorithm can be further explored and parameters other
    than validation size be taken into account, varied, and analyzed to improve the
    performance. This can also be implemented as a method to solve another problem
    that can be done through voice analysis with corresponding datasets.


    From Table IX, it can be seen that the number of elements from each layer increase
    the accuracy of the system. More elements from each layer cause the system accuracy
    to increase, the same effect also increases the number of hidden layers. However,
    adding more layers and elements of each layer will increase the complexity of
    the system, the training process becomes longer. Therefore, it is necessary to
    find the optimal parameters where all values provide the best value.


