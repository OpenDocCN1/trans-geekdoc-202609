    value ''svd'' in solver means the covariance matrix is not computed because the
    data has a large number of features available. The LDA is step-by-step as flow
    diagram in Fig. 2.


    # D. Gradient Boosting


    Gradient boost is implemented using Scikit-learn library. Gradient boost improves
