    在线性可分的情况下最好，由于我们使用的数据线性度较小，它无法进行数据缩放。


    ### 4) 梯度提升 (Gradient Boosting)


    通过改变数据划分组合（验证大小）比较分类模型的性能，结果如表 VIII 所示。表 VIII 显示，在测试和训练结果为 25:77 的情况下获得了最佳结果，准确率为
