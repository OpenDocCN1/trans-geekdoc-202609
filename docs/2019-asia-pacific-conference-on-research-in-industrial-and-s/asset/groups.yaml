    # F. Decision Tree


    In this work, decision tree algorithm is the core for building Scikit-Learn library.
    ID3 is the core algorithm for building decision trees. It employs a top-down,
    greedy search through the space of possible branches with no backtracking. This
    method partitions data into subsets with various homogeneous characteristic. The
    entropy of a sample was calculated using the entropy before. If the sample is
    equal, the entropy becomes zero. The information gain is measured by the decrease
    in entropy after a dataset is split on. Constructing a decision tree typically
    find that returns the highest information gain, such as the most homogeneous instances.


