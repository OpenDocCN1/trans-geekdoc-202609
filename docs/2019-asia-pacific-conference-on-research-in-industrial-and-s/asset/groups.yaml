    ## 帕金森病诊断中机器学习应用的初步研究


    Ahmad Habbie Thies, Isca Amanda, Jessica, Nikita Akhsan Fitri, Rai Rona Althof,
    Sukmandhari Harimuti, Widyaawardana Adiprawita, Ita Ansari*


    生物医学工程系，电气与信息技术学院

    万隆理工大学，万隆，印度尼西亚

    is_ansari@stei.itb.ac.id


    摘要——通过研究患者的语音特征可以验证帕金森病（PD）的早期检测。利用机器学习，通过研究包含 PD 特片段和本研究使用的语音方法的帕金森病数据集，可以很好地检测帕金森病。研究使用支持向量机、K最近邻、逻辑回归、梯度提升、多层感知器和决策树对所研究特征进行了测试。对所有这些方法的性能在准确率、精确率和
    F1 分上进行了评估。根据结果，最适用于帕金森病的算法是机器学习，其在不进行数据缩放的情况下准确率达到 95.92%。


    关键词——帕金森病，语音分析，机器学习


    数据集由来自 31 个人的发声测量组成，其中 22 人患有帕金森病（PD）。本研究收集的数据集包含每个受试者的多个样本，如元音、数字、单词和短句。表格中的每行都有一个特定的测量值，每行对应从每个受试者录制的
    15 种声音之一。该方法被用于区分帕金森病患者。根据文献，本研究使用的数据集具有许多优势，例如每个受试者都有多种声音，且数据集中收集了许多特征。数据量不足，受试者仅有
    31 人。本研究使用的所有 23 个特征并不一定对帕金森病的诊断有显著贡献。然而，数据集尚未完全满足。在受试者中，只有 8 人不是帕金森病患者。数据集的缺陷可能会影响最终模型的准确性，无论使用什么算法。


    # I. 引言


    帕金森病是一种神经退行性疾病，其特征是中枢神经系统中产生多巴胺的神经元受损；基底节功能障碍会导致语言流利障碍等症状；帕金森患者可能会有不同的语音强度，以及预期的语音退化或无法产生持续的发声。


    目前还没有用于诊断帕金森病的特定检测。目前，已经在进行开发使用算法区分健康个体与帕金森患者的决策支持工具的研究 [1]。在本研究中，调查了使用机器学习方法，利用牛津大学的语音特征数据集（一种非侵入性方法）诊断帕金森病。本工作使用的一些机器学习算法包括支持向量机、线性判别、K最近邻、决策树、朴素贝叶斯、梯度提升和多层感知器。本工作旨在了解在给定特征或病例的情况下，哪种学习模型可以提供至少
    90% 的准确率和至少 0.9 的马修斯相关系数，以预测帕金森病。


    # II. 方法


    ### A. 数据集


    本研究使用的语音数据集来自牛津帕金森病（OPD）数据集。该数据集是由来自牛津的 Max Little 与科罗拉州国家语音与语音中心创建，录制了语音信号。本研究发布了针对普通语音疾病的特征提取方法。


    ![](img/54663eb0214ef1b4c1cf3884333343a7_0_0.png)


    图 1. SVM 流程图


    ### B. 特征提取


    机器学习中的重要过程之一是从数据中提取特征。这些特征将作为算法的输入，以产生特定的分类模型。在其他情况下，新的测试（数据）将根据预训练的数据分类到某些类别中。在这种情况下，语音样本被提取为
    22 个特征。语音特征提取使用多维语音程序（MDVP）。该程序提供了多个菜单，可以提取出特征。


    ### A. 支持向量机 (SVM)


    使用 sklearn-learn 实现 SVM 时，必须调整几个参数。为了执行分类，需要调整 ''kernel''（内核）。测试的内核参数包括 RBF、poly
    和 sigmoid。SVM 图如图1 所示。


    ### D. K最近邻 (KNN)


    使用 Python scikit-learn 包，可以调整一些参数，例如用于预测的 n_neighbors、weight（权重）、计算最近邻居的 leaf_size（叶大小）、BallTree
    或 KDTree、用于树的 metric（指标）、metric_params 以及并行任务的 n_jobs。在这里，n_neighbors 有变化。


    ### C. 线性判别分析 (LDA)


    LDA 在 sklearn-learn 包中有类别、components、priors、shrinkage（收缩）和 tol。对于这种分类情况，''svd''
    为 ''False''，且 ''tol'' 阈值设置为默认值 0.001。使用 ''svd'' 表示不计算方差矩阵，因为数据有大量特征。LDA 流程图如图2
    所示。


    ### D. 梯度提升 (Gradient Boosting)


    使用 Scikit-learn 库实现梯度提升。通过结合多个弱学习器提高性能。在前向构建的模型显示了任意的可微函数。在每种情况下，回归树最小化二项或多项损失。二分类是一个使用回归树的示例。


    ### E. 多层感知器 (MLP)


    MLP 使用 Python Scikit-learn 实现，如图3 所示。从上传帕金森数据到系统开始。然后对数据进行预处理以提高质量。数据预处理阶段有几个步骤：数据缩放、特征提取以及分离训练和测试数据。MLP
    工作流如下：


    1. 信号从输入层传播到输出层。

