    PCA（主成分分析）来解决。因此，KNN算法的实现需要对应的方法。


    ### 3) 判别分析 (LDA)


    LDA 在验证大小下的性能如表 VI 所示。该分类器在将数据分为 25 的验证中具有最佳准确率 (87.76%)。


    # 表 VII. 验证大小变化的 LDA 结果


