- "# 初学者土壤学指南：温室土壤、再生免耕栽培、容器与高架床土壤及堆肥指南（被遗忘雨水韧性系列）\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
  \n\n健康的土壤可以做到这些甚至更多，从而保持我们的环境清洁，维持我们的生态系统，并确保食物充足且营养。问题是，我们对这些恩惠的回报是什么？遗憾的是，相关的统计数据并不令人乐观。根据联合国的数据，全球约\
  \ 40%的土壤处于中度或严重退化的状态。此外，如果这种情况持续，这一数字可能会上升到 90%（Ong, 2023）。\n\n有办法控制这种情况吗？绝对有！答案在于土壤管理实践，这些实践确保土壤资源以与其被消耗相同的速度得到补充。这些方法通常被称为可持续农业实践法。我们需要理解这些实践的力量。它们可以实现我们、环境、生物多样性和土壤的共赢，因为它们确保了土壤质量随着时间的推移得到维持和改善，并防止了土壤养分的流失。这反过来确保了土壤保持力，并能够提供我们上面讨论的所有好处。\n\
  \n结合可持续性原则的流行农业实践包括温室种植、再生免耕栽培、容器和高床园艺以及堆肥。我们将在本指南中探讨其中的每一种。\n\n*   温室种植实践采用封闭式结构为植物提供最佳生长条件。\n\
  *   再生免耕栽培是一种确保最少土壤扰扰的实践，允许自然力量重建并维持土壤健康。\n*   容器园艺涉及使用容器和花盆盛放土壤，为植物提供有利的条件。与之类似类似的概念是高床园艺，其中“土壤床”被抬高地面几米。\n\
  *   堆肥是可持续农业领域另一个常用的方法。它涉及将有机废弃物转化为营养丰富的堆肥，可以施入土壤以保持其营养和肥沃。\n\n本指南的创建旨在向您介绍与所有这些耕作方法相关的土壤管理实践基础知识。最终目标是让您以可持续的方式从您的种植空间获得最大的收益。每种耕作实践都将单独讨论，并详细说明了基本的生长原理、土壤管理实践以及增强土壤肥力的技巧。\n\
  \n一旦你读完本指南，你就会理解土壤不仅仅是泥土。通过将其视为一种宝贵的资源，你可以显著提高你的园艺成果。我作为一名成功园艺者的多年经验告诉我，土壤是一个具有韧性的实体，即使在不理想的情况下也能茁壮成长。然而，当你开始智能地管理它并为它提供恰恰需要的东西时，你的产量可能会呈指数级增长。\n\
  \n这本书是我系列丛中的第二部，在书中分享了我如何在花园的不同区域维持健康、肥沃和蓬勃发展的土壤，包括我的温室、高床、容器园艺和免耕区。通过我的土壤管理实践，在过去的几年里，我一直为我的家庭提供新鲜产品，我想帮助你取得同样的成功。\n\
  \n是时候深入学习了——让我们湿手并沾满泥土吧。\n\n# 第一章：了解土壤基础\n\n当你踏在土壤上时，你正踏在地球上最不可思议的力量之一。这个动力源维持着地球上的生命。虽然它不像头顶高耸的树木那样雄伟，也不像构成地球大部分区域的水体那样强大，但土壤是伏在我们脚下的谦卑的物质。它经常被忽视，但它确实是我们生态系统的基础、食物的提供者以及我们气候的调节者。\n\
  \n这个星球的无名英雄扮演的角色与阳光雨水同样关键。它是一个复杂的生态系统，充斥着数以亿计的微微生物，它们不断地工作以支持植物生命。它们分解有机物，循环养分，并保持我们的土壤肥沃。没有了所有这些微观工人，我们的地球看起来更像是一片荒芜的荒野。但你为什么需要了解这些呢？因为如果你要与土壤打交道，你就必须理解土壤。\n\
  \n在这一章中，我们将揭许多关于土壤世界的信息。你将探索它的组成、属性和功能。你将破解土壤形成的秘密，理解养分如何让这种古老的舞蹈持续下去，并识别使我们的土壤成为不可思资源的微生物平衡。当你学习了土壤的基础知识时，你就能真正体会它的重要性，并采取必要的步骤保护你所拥有的东西。\n\
  \n## 什么是土壤？\n\n字典通常将土壤定义为坚硬的土地或可以挖掘或耕种的、植物在其中生长的地球上层（Merriam-Webster 字典, n.d.）。美国农业部（n.d.）将其定义为一种由固体（矿物质和有机物）、液体和气体组成的自然体，它发生在陆地表面，占据空间，并具有以下一两种或两种特征：由于能量和物质的增加、损失、转移和转化而与原始材料可区分的层位或层，或者能够在自然环境中支持有根植物的能力。\n\
  \n通常，人们将地球上松散、深色的基质称为土壤。然而，科学家根据三个标准来定义土壤：它必须包含有机物，位于表面上方的几十厘米内，并且能够支持植物生长。\n\n\
  ### 组成\n\n这种看似简单且匀质的物质比看起来要复杂。土壤的多样性以及不同土壤之间变化的属性需要进行彻底的评估。那么，让我们开始吧。\n\n如果我要用一个简单的公式来表达土壤的组成——尽管并没有那么简单——它将表示如下：\n\
  \n```\n风化岩石 + 有机物 + 水 + 空气 = 土壤\n```\n\n让我们看看这些成分是如何进入土壤形成过程的，是如何被锁定的，以及实际上需要多长时间将这些成分的活性混合物转化为肥沃土壤。\n\
  \n### 风化岩石\n\n风化是指自然力量（水、空气和生物体）对岩石和矿物质的分解。这是一个自地球表面形成以来一直持续的过程。风化结果产生的岩石和矿物质碎片会被运输到最终开始土壤的地方。由于岩石是土壤的第一种成分，它们通常被称为母质。土壤样本中岩石和矿物质的数量有所不同，平均土壤样本中占\
  \ 45%（Panchuk, 2019）。\n\n### 有机物\n\n土壤有机成分的通用术语是腐殖质。我们通常认为有机物是腐烂物质，但那并不是有机物的真面。我喜欢将有机物定义为活的、死的和极死的实体的混合。土壤中的活生物是最活跃的部分，其次是新死的生物，然后是长期死亡的生物。土壤中的活生物包括细菌、病毒、真菌、藻类和原生动物。死亡生物包括最近死亡的蚯蚓、昆虫、微生物、旧植物根、作物残留物和最近添加的肥料。土壤中的极死有机物是指在土壤中存在了很久但微生物未能完全分解的成分。这种形式的有机物在土壤中存在数百年，并逐渐向土壤释放基本养分。\n\
  \n\n\n\n\n尽管土壤中只有 1–6% 是有机质（Panchuk, 2019），但这部分物质对土壤肥力起着至关重要的作用。\n\n## 空气\n\n土壤中的空隙占据了其体积的达\
  \ 51%（Panchuk, 2019）。这些空隙不同程度地充满了`air`和水，其中的空气通常被称为`土壤大气`。土壤良好的透气性至关重要，因为它有助于植物根与土壤颗粒之间的交换。此外，土壤微生物的化学活动也依赖于充足的空气。\n\
  \n## 水\n\n水是土壤的另一个重要组成部分，它在决定土壤质地、含、支持微生物活动以及植物生长方面起着作用。如前所述，水存在于土壤中的气隙中。因此，这些气隙越大，土壤保留的水就越多，植物和微生物越容易获取水分。\n\
  \n## 土壤剖面与土壤层\n\n为了理解土壤的基础，下一个要探讨的概念是土壤剖面。土壤剖面是从表面延伸到下方基岩的土壤垂直剖面。你可以把它想象成切开蛋糕并观察它的分层，看看有多少层，哪一层最厚，以及每一层有多明显。土壤剖面揭示了几个并行的土壤层，我们称之为`土壤层`。你可能甚至在学校里进行过土壤剖面实验。该实验涉及从单一地点的不同深度采集土壤样本。然后检查样本的颜色和粒径变化。学生还会通过将每个样本逐层叠放在透明瓶中来创建土壤剖面模型。\n\
  \n土壤科学家通常提到三个层或层：`A`、`B` 和 `C`。在这些土壤层之上是`O 层`，它有时也会埋没。在`A`层和`B`层之间可能还有一层称为`E 层`的额外层。\n\
  \n让我们仔细观察不同的土壤层。\n\n*   `O 层`：这通常位于所有层的最顶部。它的成分包括干燥的草类、枯叶、掉落的树木部分、表面生物和其他有机体。所有成分的存在使得该层呈现深棕色。\n\
  *   `A 层`：这是表层土或顶层土。它包含了蚯蚓、细菌和真菌等生物，以及矿物质、水、空气和其他有机成分的混合物。这一层的土壤特别松软且多孔。所有这些条件为种子发芽提供了完美的环境。\n\
  *   `E 层`：“E”代表淋溶（eluviation）。淋溶是水从一层土壤移动到另一层的过程，带有溶解的养分和矿物质。这解释了这一层的形成。你猜得没错！水和养分从`O`层和`A`层向下渗透，形成了`E`层。\n\
  *   `B 层`：这也被称为底层土或下层，因为它位于顶层土之下。这一层中腐殖质和其他有机化合物的含量比顶层土少，因此它比`A 层`稍微硬一些。然而，这里存在矿盐和金属化合物。\n\
  *   `C 层`：这一层被称为母质（风化岩石），不含有机质。这是基岩所在的地方。正是由于较大的颗粒支撑了植物的生长。\n\n## 土壤属性\n\n我们的下一个关注点是土壤属性。这些属性对于农业用途至关重要，因为它们决定了养分的可用性和结构。\n\
  \n### 质地\n\n当我们谈论土壤质地时，我们实际上是指颗粒的大小。共有三种：`sand`（砂土）、`silt`（粉土）和`clay`（粘土）。\n\n*\
  \   `Sand`：其粒径为 `2.0–0.05 mm`，表面积较小。如果你进行条形（ribbon test），你会发现砂颗粒粘性不佳且易碎。手感粗糙。\n\
  *   `Silt`：其粒径为 `0.05–0.002 mm`，表面积比`sand`大但比`clay`小。在粉土的情况下，形成的条较短且脆弱，手感像粉末。\n\
  *   `Clay`：其粒径为 `0.002 mm`或更小，这意味着它与`sand`和`silt`相比具有最高的表面积。由于其胶性和粘性，它是三者中最容易区分的。在条形中表现最好，可以形成很长的细条。放在牙齿间，粘土感觉很滑滑。\n\
  \n这三种颗粒的不同组合为我们提供了 12 类土壤质地（USDA, n.d.-b）。由于这些类别中颗粒含量的不同，我们观察到了不同的持水能力、保肥能力和土壤孔隙率。例如，`clay`和`silt`比例较高的土壤具有较高的持水性。相反，砂质土由于孔隙率高，能够有效吸收表面水分。养分管理是另一个受土壤质地影响的因素。这指的是土壤保持养分并高效提供给最需要这些养分的植物的能力。通常，较小的土壤颗粒（`silt`和`clay`）执行此功能更好，因为这些颗粒提供了更多的养分附着表面。\n\
  \n根据这些标准，土壤被归分为以下类别之一：\n\n*   `Uniform`（均匀型）：整个土壤剖面的质地均匀。\n*   `Texture contrast`（质地对比型）：顶层土和底层土之间存在剧烈的质地变化。\n\
  *   `Gradational`（渐进型）：质地沿剖面向下逐渐变化。\n\n## 结构\n\n我们下一个要探讨的概念是土壤结构。这是另一个重要的土壤属性，可以帮助你理解你正在处理的土壤的特性。\n\
  \n\n\n\n土壤结构是指土壤颗粒（砂、粉土和粘土）结合形成团聚体的方式。在土壤科学中，这些团聚体被称为土团（peds）。根据这些颗粒（以及有机物）的结合程度，形成的土团可能非常坚固、硕大且结构不良，也可能非常疏散、微小且结构良好。但这只是两个极端；我们不能期望具有这些团聚体的土壤表现良好。良好的土壤始终处于这两个极端之间的范围内。它形成中等大的土团（通常为\
  \ 1–60 mm），具有清晰形状（昆士兰政府，2013a）。\n\n读完关于土壤质地的章节后，你可以轻松地理解土壤颗粒在决定结构方面起着什么作用。想象一个富含砂和粉土的土壤样本。即使这种土壤含有良好的有机质，我们也无法期望它具有良好的土壤结构。同样，如果土壤的粘土含量很高，形成的团聚体将太硬且难以处理。\n\
  \n除了土团的大小和结构外，土团的形状可以评估土壤结构最有区分性的标准。土壤技术人员通常利用四种形状来实现此目的（FAO，n.d.）：\n\n* **粒状 (Granular)**：这些是由单个矿物颗粒和有机物组成的疏松团聚体。此类团聚体常见于\
  \ A 层。\n* **柱状 (Columnar)**：这些团聚体排列成垂直柱，被细小的垂直裂缝隔开。柱状结构常见于粘土比例较高的 B 层。\n* **块状 (Blocky)**：当土壤颗粒排列成方形或略有棱角的几何形状时，就会形成这种结构。它们在土壤的\
  \ B 层中丰富。\n* **片状 (Platy)**：当土壤颗粒聚集成平坦的板或片时，就会形成片状结构。这些板通常平行堆叠。片状结构常见于土壤的 A 层。\n\
  \n### 土壤结构与孔隙之间的联系\n\n现在，你可能在想土团的特征与植物生长有什么关系。这很重要，因为仅这一个因素就决定了植物将获得多少水和空气以及获取有多容易。在土壤科学领域，所有这些讨论都包含在土壤孔隙这一标题下。\n\
  \n你可能对孔隙率一词有了基本的了解，但在土壤的背景下，它特指土壤内部填充了空气或水的空间。这些空间既存在于土壤团聚体内部，也存在于之间。孔隙率与土壤结构密切相关，因为团聚体的排列决定了它们之间空间的大小以及空气和水渗透土壤的有效性。因此，你可以观察团聚体的结构来确定土壤的孔隙率。\n\
  \n* 粒状结构的土壤孔隙率高，因此允许在各个方向高效移动。\n* 柱状结构的土壤孔隙率低，不利于水或空气的运动。这是因为团聚体很长、包装紧密，且之间有细小的裂缝。\n\
  * 与柱状结构类似，块状结构的孔隙率也低，渗透和水运动有限，特别是当土块尺寸很大且之间裂缝较少时。\n* 片状结构使土壤孔隙率最低。这是因为当板层层叠在一起时，它们之间几乎没有留下空间供空气和水运动。\n\
  \n### pH 及其重要性\n\npH 是我们在处理溶液时会讨论的话题，但在确定最适合植物植物土壤时，它也是一个相关的课题。\n\n土壤 pH 是土壤酸性或碱性的度。每种土壤都有自然的\
  \ pH 值，这受到形成过程中涉及的母质的影响。此外，气候、植被和区域物理特征等因素会随着推推改变 pH。因此，在开始之前测量 pH 可以提供关于土壤是否适合植物生长的价值信息。土壤\
  \ pH 还能告诉你关于你正在处理的土壤的什么？它可以\n\n* 告诉你土壤的养分可用性。这是因为 pH 决定了哪些养分溶解在土壤水中，以及有多少被植物根吸收。某些养分需要微酸性\
  \ pH 才能被植物利用，而另一些则需要微碱性 pH。然而，绝大多数养分在 pH 接近中性（5.5–7.5）时表现出良好的可用性。强酸性或强碱性的 pH 水平对植物可能是致命的，因为在这些水平下，土壤可能会产生营养中毒或缺乏。\n\
  * 帮助你确定需要添加哪些土壤改良剂使土壤适合你的植物。如果你计划处理问题性土壤（金属或盐比例高的土壤），这尤为重要。\n* 帮助你理解农业实践对土壤健康的长期影响。大多数农业活动都有随时间推改变土壤\
  \ pH 的潜力。此外，种植的作物和为了促进植物生长施用的土壤改良剂也会改变土壤 pH。\n\n### pH 的测定与改良\n\n确定土壤 pH 并不困难。有很多方法可以确定土壤的\
  \ pH；然而，最简单方便的方法是使用现场测试盒。pH 现场测试盒带有所需的材料和一本带有易于遵循的操作说明的用户手册。\n\n检查 pH 的一种方法是使用指示剂溶液。这种方法只需要收集土壤样本并向其中加入指示剂溶液制成浓稠糊。然后在糊状表面覆盖硫酸钡粉末。硫酸钡在接触土壤糊时会改变颜色。然后将颜色与指示色条进行匹配以确定\
  \ pH 值。另一种测量 pH 的方法是使用 pH 计。你只需要收集湿润的土壤样本，并将计的电极浸入其中。一段时间后，计会显示稳定的 pH 读数。这两种方法都不像实验室的读数那样准确，但它们可以作为土壤状况的良好指标。\n\
  \n一旦你确定了土壤 pH 并发现它不在理想范围内，你就可以使用改良剂进行调整。对于修改 pH，有几种方法可用：\n\n* 调整土壤 pH 最直接的方法之一是使用肥料。含硫和含铵肥料是许多处理高\
  \ pH 值并希望将其降低的人的首选方案。相反，石灰基肥料用于改良低 pH 值的土壤。\n* 除了肥料，直接应用矿物和矿物化合物也可以产生显著效果。例如，石灰或白镁石可提高土壤\
  \ pH 到理想水平。小苏钠也可以用于此目的。要降低土壤 pH，你可以直接应用元素硫或建筑石灰。\n* 还有有机选择可用。木灰、碎蛋壳和碎牡壳（钙含量高达 39%）可用于提高土壤\
  \ pH。要降低土壤 pH，你可以考虑使用松针或泥炭。虽然这些有机方法可能不会产生立即结果，但它们的天然成分使其成为比合成替代品更理想。\n\n\n\n\n高粘土含量或含有大量有机质的土壤往往对\
  \ `pH` 的变化具有抵抗力。因此，这些土壤需要更多、更频繁地使用改良剂。此外，土壤的含水量会影响 pH 调节剂吸收的速度。因此，除非你自己是经验丰富的园艺师或农业专家，否则建议获得专业的评估，以确定土壤所需的正确改良剂用。\n\
  \n## 土壤功能\n\n我们已经提到了土壤在维持整个生态系统方面发挥的基本功能。接下来，让我们讨论一些与植物生长相关的土壤功能。既然你已经掌握了土壤科学的基础知识，包括土壤质地、结构和孔隙，你将能够理解土壤属性如何支持这些功能。\n\
  \n### 保水与排水\n\n在关于土壤质地和结构的讨论中，我们研究了土壤颗粒是如何决定土壤孔隙率的关键因素。这些颗粒的大小和聚集模式决定了颗粒之间以及相邻土壤团体内部孔隙的数量。这些孔隙在影响土壤的保水和排水能力方面起着至关重要的作用。无论你想种植什么植物，健康土壤的一个通用指标是它应该是排水良好的，同时又能保持足够长时间的水。这使得植物根系能够吸收生长所需的水分。\n\
  \n从对土壤孔隙的讨论中，你可以轻松推导出粘土和砂土的保水和排水能力。粘土具有很高的保水能力但排水能力差。此类土壤可能仅适用于水稻等耗水作物。相反，砂土的保水能力低但排水性极佳。这些土壤非常适合生长具有强根系以及在干旱条件下生存的植物（例如萝卜、胡萝卜和甜菜）。除了这些类型的土壤外，还有壤土，它含有等比例的沙子、粉土和粘土。壤土被认为是大多数植物的最理想土壤，因为它提供了中等量的保水和排水能力。\n\
  \n需要注意的是，这些土壤属性也会影响我们的灌溉实践。如果土壤具有高保水性，你可能不需要经常浇水；然而，保水性差（排水性高）的土壤将需要更频繁地浇水。这是你在规划建立可持续花园时需要考虑的关键概念之一。\n\
  \n### 养分供应与储存\n\n之前简要讨论了土壤 `pH` 和土壤水为植物根部提供养分的作用。现在，让我们详细讨论这一概念。这里需要考虑的重要问题是：土壤如何以及从何处获得这些养分，这些养分如何保留在土壤中，以及从土壤到植物根部的转化过程是什么。\n\
  \n所有植物都需要多样化的养分才能发挥其全部潜力。根据植物所需的量，这些养分被大致分为两类：大量元素和微量元素。土壤肥力与这些养分密切相关。它指的是土壤中养分、水和空气的丰富程度，以及通过生物、物理和化学过程的结合转移到植物根部。\n\
  \n土壤中养分储存和供应的过程是复杂的，涉及细菌、真菌和原生动物等各种生物，它们发挥着至关重要的作用。这一过程包括长期的矿物质和有机质分解循环，直到产生这些养分中最简单且最活跃的形式，即\
  \ `离子`。随着植物根系向土壤深处生长，它们可以获取这些 `离子`。土壤水溶解 `离子` 并促进它们从土壤空气移动到植物的根毛。\n\n简而言之，决定土壤肥力水平的因素包括：\n\
  \n- 母质材料——决定了土壤的天然养分含量。\n- 有机质——留住养分，直到植物可以吸收它们。\n- 土壤生物——帮助从有机质中提取养分。\n- `pH`——决定了哪些养分是植物可用的。\n\
  - 土壤水——溶解养分以供根系吸收。\n- 肥料——补充土壤养分并提高肥力。\n\n养分的提取和供应不是一个单向过程；它是一个循环过程，养分在土壤、生物体和大气之间不断移动。回想一下我们在学校学过的碳和氮元素循环。这些循环一直在发生，从而维持了地球生物与非生物成分之间的养分平衡。对于这些养分存在土地中的部分，土壤在养分分解、简化和传输到生物及大气的过程中起着最重要的作用，从而维持了养分循环的连续性。\n\
  \n### 植物根系的支持\n\n想象一棵拥有巨大根系但周围没有任何土壤的大树——只有空隙。你认为它在这种情况下能直立着吗？显然不能。土壤将根系牢牢固定在地面上，为树木屹立多年甚至几十年提供了必要的支撑。在这种情况下，土壤质地和肥力起着重要作用。良好的土壤质地为树根提供了足够的可进入空间来固定自身。一旦进入这些孔隙，根系就可以施加更大的力渗透土壤团体，允许它们向各个方向生长。\n\
  \n然而，物理支撑并不是土壤为根系提供的全部。土壤与根的相互比这要动态得多。这种相互发生在植物根与其周围土壤之间。这种特殊相互作用区域被称为 `根际`。如上所述，土壤有助于根系的生长和延伸，而根系则通过释放特殊的化学物质（分泌物）来改变土壤，溶解养分并创造获取水分的通道。微生物在该区域最活跃。\n\
  \n\n\n\n\n在本章中，我们将详细讨论这些元素。我们将探索温室土壤的独特特性、选择温室基质时需要考虑的因素，以及为了保持土壤肥力以获得最高产量而采取的必要步骤。理解这些方面将帮助你为温室制定有效的土壤管理实践，确保其短期生产力和长期生态平衡。\n\
  \n在深入研究温室土壤管理的细节之前，对你来说，理解温室耕作与传统农业耕作方式之间的区别至关重要。\n\n主要的区别因素是温室提供的**受控环境**。它允许你管理温度、光照和湿度等环境条件。与传统农业不同，生长条件很大程度上取决于自然天气，而温室耕作对这些因素提供了更多控制。这最终意味着，如果你能高效地管理温室内的大气，就可以全年获得产品。以下是温室耕作的几个其他特征：\n\
  \n● 对生长基质的成分以及你想要添加的以优化产量的养分进行控制。\n● 调节通气和灌溉的能力，允许你根据植物的需求创建具有所需通气量和保水量的基质。\n● 通过调整基质配方和温室内的大气条件，保护你的植物免受当地害虫的侵害。\n\
  \n与传统设施相比，使用先进设备和装置建立温室的初始成本可能很高。然而，温室技术提供了一种可持续的方案，可以有效减轻全球变暖对农业的影响，并确保所有季节和天气条件下的粮食安全。最终，它证明是既具有成本效益又具有气候适应性的。\n\
  \n## 温室基质的特性\n\n选择合适的生长基质（或生长底物）是建立温室时最重要的任务。问一个简单的问题：为什么我们不能直接为温室植物使用普通土壤？在有限空间内种植植物与在无限的土地上种植不同，在后者，根部可以接触到所有土壤层以获取养分和水。此外，表层土通常容易压实，所以如果你在温室盆中使用这种土壤，长远来看会让你的植物窒息。因此，即使你想为了此目的利用当地土壤，也需要对其进行准备和改良，使其适应温室。\n\
  \n我们需要在合适的温室基质中寻找的特性是：高保水性、保持养分并与植物根系积极交换的能力、良好的排水能力以及良好的抗病虫能力。在选择生长介质时，还需要考虑的因素是成本、可用性以及想要种植的植物的需求。\n\
  \n### 土壤混合物对比无土基质\n\n温室的生长基质分为两大类：土壤混合物和无土基质。\n\n如果你选择使用土壤混合物，你可以简单地从当地采购土壤并进行处理以适应你的温室条件。对土壤质量进行实验室测试将告诉你其\
  \ `pH` 和养分含量。你还可以检查土壤的排水能力。完成后，你可以进行一些简单的修改，例如：\n\n● 添加蛭石或珍珠岩等土壤添加剂以改善排水和通气。\n●\
  \ 添加 `pH` 调节剂以获得理想的 `pH`。\n● 添加养分负载以提高养分交换能力。\n● 添加有机肥以提高有机含量。\n● 调整沙、粘土或粉土的比例，以获得理想的保水排水。\n\
  \n#### 土壤混合物的优点\n\n以下是土壤混合物的优点列表：\n\n● 成本低\n● 可获得植物正常生长发育所需的 Basic 养分\n● 含有有益微生物\n\
  ● 能够适应不同作物的需求\n\n#### 土壤混合物的缺点\n\n以下是基于土壤的介质的缺点列表：\n\n● 它们需要消毒以消除病原体和杂草种子。\n● 可能含有有害的土壤病原体，破坏你的植物和整个设备。\n\
  ● 排水和通气可能难以调整。\n● 与无土基质相比，这种介质很难从一个位置移动到另一个位置。\n● 保持一致的介质质量可能很困难。\n\n\n\n\n\n- 某些基质（如水培和水凝胶）可能成本较高，并且需要经过培训的人员进行安装。\n\
  - 存活在无土基质中的病虫很容易在整个系统中传播。\n\n为了克服这些问题，将无土基质的几种组件结合起来，创造出一种具有尽可能理想特质、且具有成本效益、耐用且稳定以支持各种植物生长的混合物。\n\
  \n## 通气与排水的重要性\n\n在讨论温室的特性时，如果不提到通气和排水的重要性，讨论就是完整的。这两者可能是决定温室成功的最重要的因素。\n\n通气允许植物根部交换气体，这对于植物细胞的能量产生和植物的整体健康至关重要。通气还能防止基质颗粒随时间推移而压缩，从而为根部生长提供充足的空间。益微生物在良好的土壤中也能生长。如果没有足够的通气，植物可能会枯萎，根部开始腐烂，导致生长受阻。\n\
  \n排水可以防止积水和盐分积累问题。此外，良好的排水有利于温室内部的温度调节。如果没有足够的排水，基质颗粒可能会紧实并留住更多热量，从而给植物带来压力并影响其生长。\n\
  \n显然，这些问题不是陆地种植的首要考虑，因为土壤本身就能够独立执行这些功能；耕作和作物覆盖等因素也可以协助这些功能。在温室设置中，种植者必须注意这些方面。那么，我们如何在温室基质中实现并保持良好的通气和排水能力呢？嗯，你可以做几件事。例如，你可以\n\
  \n- 使用含有等量沙、粘土、土壤和有机物的混合土来改善通气。\n- 使用底部带有排水孔的容器。\n- 使用碎石和粗砂垫高架床——这两种材料都可以帮助你创建具有合适通气和排水能力的架床。\n\
  - 避免过度浇水，确保水不在植物周围积聚。\n- 使用节水灌溉方法，如滴灌或喷淋头，防止过度浇水和积水的概率。\n- 添加有机物，如腐熟的有机肥。\n- 在温室地面上制造小坡以辅助排水。\n\
  - 在容器/床底部加入碎石以确保高效排水。\n- 使用珍珠岩或蛭石等材料增强基质的通气性。\n- 定期用园艺叉耕作以增强通气，特别是当使用使用土壤基质时。\n\n\
  ## 选择合适的基质\n\n为温室选择合适的生长基质对于确保成功和产量最大化至关重要。为了让这个选择过程变得更容易，了解不同的选项及其优缺点以及可能的组合是非常重要的。让我们探索各种基质选项。但是，如果你发现选择过程很有，可以考虑使用许多商业种植者提供的预混合基质。或者，你可以尝试两种或更多组件来创建自己的自定义生长基质。别担心；我们还将讨论一个你可以遵循的理想生长基质的简单配方。\n\
  \n### 组件及其特性\n\n正如我之前提到的，这些组件大分为两类：无机和有机。让我们先讨论一些无机选项。\n\n### 蛭石\n\n蛭石是一种富含铁、镁和铝的矿物。它的纹理类似于云母。它以细小的蠕虫状结构存在。使蛭石成为温室基质理想选择的特性是它\n\
  \n- 质轻，便于搬运和运输。\n- 具有高离子交换能力，使其成为逐渐向植物释放养分的优良基质。\n- 具有化学稳定性，这意味着它不会与其他基质成分发生反应。\n\
  - 对 pH 变化具有高度抵抗力。\n- 高吸水性（每立方英尺 3–4 加仑）。\n\n蛭石唯一的缺点是湿润后性能差。一旦变湿，颗粒很容易在很小的压力下压缩和塌陷。此外，这种损坏是永久性的，颗粒在完全干燥后也不会恢复。\n\
  \n### 珍珠岩\n\n珍珠岩是一种硅基矿物，从火山岩中提取，然后经过高温处理，变成适合生长基质的碎粉末状。它的理想品质是\n\n- 质轻\n- 质地均匀\n\
  - 高孔隙率，确保了排水和通气\n- 高保水性\n- 化学稳定\n- pH 值呈中性\n\n由于其粉末性质，珍珠岩在灌溉期间往往会浮在水面上。此外，显示它含有毒性水平的氟，这不是一种理想的成分。\n\
  \n### 煅粘土\n\n这种基质组件通过高温加热粘土矿物制成。此程序获得的颗粒是坚硬且不可破坏的。这使得煅粘土\n\n- 多孔隙率\n- 排水良好\n- 通气良好\n\
  \n这些特性使煅粘土成为理想的改良剂和盆栽基质。它也是珍珠岩的理想替代品。煅粘土唯一的缺点是对水需求量。\n\n### 沙\n\n沙子是最常见且最便宜的基质组件。正如上一章过的，沙子具有粗糙的纹理和高孔隙率。这些特性使沙子\n\
  \n- 排水良好\n- 通气良好\n- 能够为植物根提供机械支持\n\n记住，我们在这里指的是中粗砂。细砂不提供这些特性，甚至会降低基质的排水和通气。沙子的一个问题（特别是来自石灰岩的形式）是其高\
  \ pH 值。然而，如果你种植的是适应当地土壤并能忍受高 pH 值的植物，这不是问题。沙子的低成本也使其成为最常见的改良剂。\n\n### 聚苯烯颗粒\n\n\
  这些颗粒是聚苯烯加工的副产品。它\n\n- 廉价\n- 质轻\n- 排水良好\n- 通气良好\n-耐分解\n\n它可以作为沙子的替代品。使用聚苯烯的缺点是保水能力极低且离子交换能力有限。聚苯烯颗粒无法忍受高温和消毒剂中存在的化学物质。\n\
  \n### 岩棉\n\n岩棉是一种独特的基质组件，是水培系统的理想基质。它是通过将熔融岩石纺成细纤维获得的。所得材料具有\n\n- 高保水性\n- 卓越的通气性\n\
  - 均匀的纹理\n- 化学稳定性\n\n岩棉还能抵抗害虫和病原体。此外，在彻底清洁后是可以重复使用的。主要缺点是阳离子交换能力低且对 pH 稳定有要求。\n\n\
  ### 有机组件\n\n提到有机基质时，我们有以下选项：\n\n#### 泥炭苔\n\n\n\n\n\n泥炭是指植物碎片在潮湿且无氧的条件下分解形成泥炭藓的物质。并非所有泥炭沉积物都适合作为基质，它实际上取决于导致泥炭沉积的植物类型以及其经历的分解程度。泥炭有几种类型，其中不同的是\
  \ `Sedge`、`Hypnaceae`、`Sphagnum` 和 `Muck`。在所有选项中，`Sphagnum`（水苔）是最受欢迎的选项。根据 `Aggie\
  \ Horticulture` (n.d.)，它具有：\n\n* 自重 10–20 倍的吸收能力\n* 良好的空气性\n* 抗腐烂性\n* 中等的阳离子交换能力\n\
  * 不含盐分\n\n`Sphagnum` 水苔纤维长度可以根据不同的植物和各种生长阶段进行调整。\n\n### 木质残留\n\n与泥炭类似，木质残留是一个大类，有多种可用选择。它的可用性和价格不是问题，因为它是木材行业的副产品。让我们来看看这里主要的选项。\n\
  \n* `Sawdust`（锯屑）：价格和特性取决于其来源的树木。它的体积密度较低，持水能力与 `Sphagnum` 泥炭相似。高含纤维素和木质素是用 `sawdust`\
  \ 作为基质的缺点，因为这些成分会导致基质容易养分耗尽。\n* `Leaf Mold`（腐叶土）：`Leaf mold` 是通过含有橡树、枫树或梧桐树叶的土壤进行堆肥\
  \ 12–18 个月制成的（`Aggie Horticulture`, n.d.）。所得具有卓越的持水能力、透气排水性。\n* `Barks`（树皮）：通常从木材和纸业获得的\
  \ `barks` 纹理和大小各，但简单的锤磨和筛选即可提供适合生长基质的碎片。这种基质的物理特性与 `Sphagnum` 泥炭相似。\n\n木质残留最大的问题是微生物导致的氮流失。这一过程会夺走植物所需的氮。然而，通过频繁施用补充氮，可以避免这个问题。\n\
  \n### 椰纤维\n\n`Coconut coir`（椰纤维）源自椰子壳，有多种形式，包括压缩粉、纤维和块状。浸湿后，它的体积可以膨到原来的五倍 (`Buechel`,\
  \ 2014)。`椰纤维` 的总孔隙率约为 80%，具有中低等的阳离子交换能力 (`Buechel`, 2014)。`椰纤维` 的主要优势之一是其耐用性；如果经过适当灭菌，只要不开始分解，它可以重复使用几个生长周期。\n\
  \n然而，`椰纤维` 也有一些缺点。它天然含盐量高，因此在使用在前使用快速淋洗程序去除过量的钾和氯化物。此外，`椰纤维` 的 pH 值通常呈微酸性，这意味着它应该混合一些石灰以获得最佳效果。\n\
  \n### 稻壳\n\n`Rice hulls`（稻壳）是主要的副产品。`稻壳` 的主要特性是\n\n* 尺寸大\n* 多孔性\n* 排水性\n* 抗分解性\n\
  \n`稻壳` 是促进生长的极佳选择。它可以改善排水和容量。然而，如果你使用 `稻壳`，可能会经历氮流失。\n\n### 脲醛\n\n`urea formaldehyde`（脲醛）的特性与聚苯乙烯相似。`脲醛`\
  \ 的另一个特点是它的重量。`脲醛` 的唯一问题是它的释放。\n\n### 动物粪肥堆肥\n\n如果你长期使用 `animal manure compost`（动物粪肥堆肥），它不是最佳选择。但如果你需要避免异味，可以添加。但\
  \ `动物粪肥堆肥` 需要灭菌杀虫。\n\n### 基质混合贴士\n\n由于成分种类繁，对于初学者来说，选择和组合它们可能具有挑战性。然而，如果你研究它们的特性，就会变得容易得多。\n\
  \n* 从有机和无机两个类别中选择成分，因为它们可以互为补充。\n* 如果你怀疑某种成分是酸性的，确保添加一些石灰。\n* 确保你的最终基质具有良好的特性。\n\
  * 在使用前测试 pH 和润湿性。\n* 充分混合成分以实现均匀生长。混合不均会导致生长不。\n* 你的基质应该是轻的、易于运输且易于操作的。\n* 不要含有大量泥炭藓的基质干透。\n\
  * 将完全配好的基质储存在密封袋中以避免污染。\n\n### 自定义配方 vs 预混基质\n\n好的！我同意所有关于基质成分和成为调配大师的信息可能会让你怀疑：“难道没有办法获得一种预制的基质，我只需将其加入花盆即可开始吗？”简短的回答是：是的，有预混基质。但是，你可能仍会有问题：它们和定制基质一样好吗？性价比高吗？最重要的是，它们适合生长所有类型的植物吗？为了回答这些问题，我们需要比较自定义配方和预混的优缺点。\n\
  \n#### 自定义配方\n\n使用自定义配方的几个优点如下：\n\n* 你可以选择生长基质的特性，例如 pH 值以及排水和保养能力。\n* 你可以定制基质以适应你想要生长的特定类植物，例如根根蔬菜或十字科植物。\n\
  * 自定义配方可以是成本效益的，特别是当当地土壤非常肥沃且你想用它制作土基基质时。如果你能廉价或免费获得无土成分（如珍珠岩、堆肥、泥炭藓和聚苯乙烯颗粒），这也是高性价比的选择。\n\
  * 你可以在混合前确保每个成分都经过彻底清洁，从而对最终基质的灭菌有完全的控制。\n* 你可以选择当地来源的环境可持续基质成分，而不是购买带有塑料垃圾的商业选项。\n\
  \n\n\n\n\n- 通过定制配方，你随时可以制作新的一批。。你不再依赖商用基质产品，因为这些产品的供应情况可能会受到供应链问题、运输延迟和价格波动的影响。\n\
  \n至于定制基质的缺点，我们面临着以下几个主要问题：\n\n- 成分的收集、精确用量的测量，以及混合过程可能是一个耗时的过程。\n- 在基质的制备和储存过程中，确保每种成分的灭菌可能是困难的。\n\
  - 获得完美的生长基质需要对土壤科学和植物化学有深入的知识，并具备实践经验。在这些领域缺乏知识可能导致基质受污染、生长不均和养分失衡。\n- 基质的收集、储存、处理和混合需要空间和合适的设备。\n\
  \n## 预混合基质\n\n多年年来，出现了几家基质公司，提供针对特定作物和通用温室栽培的预混合基质。这些基质有预包装和散装两种形式可供选择。使用预混合基质的优点包括：\n\
  \n- 购买预混合基质可以减少你温室的大部分劳动力，因为它是即取即用的，且成分一致并具有最佳的促进生长特性。\n- 你可以通过要求供应商在基质中添加你所需的改良剂，来获得定制的预混合基质。\n\
  - 使用预混合基质，配方出错的概率很小，因为基质是在标准化条件下制备的。\n- 高质量的预混合基质经过了几个质量保证步骤，确保最终产品不含有害病原体和害虫。\n\
  - 这些基质通常附带有额外的成分，如 pH 缓冲剂和肥料，以确保生长阶段不会发生 pH 变化或养分缺乏。\n- 大多数供应商提供全球或至少是全国范围内的运输，并在多个城市设有园艺中心，这使得获取这些基质非常方便。我在本书末尾列出了一些顶级的基质和改良剂供应商；一定要去查看一下！\n\
  \n使用预混合基质的缺点包括：\n\n- 预混合基质的高成本是其最大的缺点。如果你计划进行大规模布局并需要几袋产品，情况尤为如此。\n- 虽然某些供应商提供根据你的需求在预混合基质中添加一或两种额外成分的选项，但找到完全符合你需求的基质非常罕见。\n\
  - 预混合基质的制造、包装和运输可能会对环境产生负面影响。\n\n基于这两种基质的优缺点，显而易见，在它们之间做出选择是每个种植者都必须做出的，需要考虑成本、时间、可用资源以及基质的理想质量等因素。\n\
  \n## 根据植物需求选择基质\n\n到目前为止，我们讨论了如何获得符合“适宜温室基质”通用定义的生长基质。然而，在选择或制备生长基质时，还必须考虑另一个因素：你计划在其中生长的植物的需求。现在，你从网上获得的\
  \ DIY 基质配方或购买的预混合基质在成分及其相对百分比上可能不同；但在你寻找不同植物生长阶段和植物科的基质时，可以参考一些通用的成分。Sela (2024)\
  \ 推荐的一些成分如下：\n\n### 育苗土混合物\n\n可以使用椰糠和珍珠土按 1:1 的比例制成。在这种混合物中，椰糠提供了高持水性并维持中性的 `pH`\
  \ 水平，这两者对于发芽和早期根系发育都至关重要。珍珠土保持了透性和排水，从而防止种子腐烂。\n\n### 容器园艺盆土\n\n可以用 60% 的泥炭苔和 40%\
  \ 的珍珠土混合制成。在这种混合物中，泥炭苔提供了高持水性和水分。珍珠土保持了透性和排水。这种混合物适用于种植花卉、蔬菜和草本。\n\n### 多肉植物生长基质\n\
  \n这种基质适用于生长多肉植物（如芦荟、天竹和龙果）或其他需要良好排水的植物。它可以通过混合 30% 的珍珠土和 70% 的赤石来制备。赤石是一种源自火山岩的矿物成分。这些成分共同作用提供了良好的空气性和排水。\n\
  \n### 水培混合物\n\n这种混合物适用于生长叶菜和草本。可以使用 70% 的岩棉和 30% 的珍珠土制成。这些成分对水分和排水水平提供了完美的控制，这正是水培系统所需要的。\n\
  \n### 通用改良剂混合物\n\n这种基质是改善排水、减少压实和支持根系的完美改良剂。它可以使用泥炭苔和赤石按 1:1 的比例混合制成。\n\n## 温室土壤健康管理\n\
  \n一旦温室系统运行起来，你必须管理两个因素以确保土壤保持健康并获得最大产量：养分管理以及病虫害控制。这两个因素本身决定了你温室的成功。\n\n### 养分管理\n\
  \n在陆地植物中，根系深而广，可以很容易获取土壤中的养分。但在温室中，根系限于基质，只能获取添加其中的养分。由于养分是以与灌溉水混合溶液的形式提供的，必须考虑一些注意事项，以确保提供植物的养分和水分平衡并与需求匹配。\n\
  \n#### 监测生长和土壤健康\n\n在使用涉及实验室测试和复杂设备的方法之前，你可以从基础观察开始评估基质的健康状况。观察灌溉后其物理特性是否保持。此外，观察植物的健康状况；叶片发黄、生长缓慢和变色等症状是你使用的营养液可能存在问题的信号。\n\
  \n#### 基质采样\n\n如果你发现生长基质有异常并想进行测试，你需要获取基质样本。一旦出现异常迹象，进行测试至关重要，因为检测和解决问题可能需要 2-4\
  \ 周 (Zhang 等人，2021)。此外，建议每次都使用同一实验室进行测试，以确保结果的一致性。在获取基质样本之前，你可以咨询实验室关于采样的说明。采样方案可能因实验室而异：\n\
  \n- 避免在灌溉或施肥后立即采样；建议等待至少一周。\n- 分别从生长正常和生长异常的植物处采集样本，因为这种比较有助于诊断问题。\n- 如果存在缓释肥料，应尽可能移除，以防止高估肥力。\n\
  - 样本应从根部层或基质底部采集，因为盐分和养分在较高层通常较高。\n\n\n\n\n-   向实验室提供所有相关细节，包括根系的状况、植物的生长阶段以及肥料信息。这有助于他们更好地检测你介质中是否存在任何毒毒性或营养缺乏的问题。\n\
  \n即使一切看起来都进展顺利，也建议在生产周期中期进行一次实验室测试。\n\n## 介质测试\n\n尽管有 `pH` 计和电导率（`EC`）计等可以让你独立地测量这些参数，但从信誉良好的实验室获取土壤测试将为你提供\
  \ `pH`、`EC`、可溶性盐、宏量元素和微量元素的最可靠值。大多数实验室会对从提交的样本中提取的营养液进行这些测试。\n\n## 结果解读\n\n某些实验室提供专家咨询，以帮助你制定养分管理策略，但大多数情况下，结果会附带一份结果解读事实表，旨在帮助种植者解读他们的介质报告。这些结果的解读可能看起来不是一项重要任务，但它实际上是养分管理中最关键的一步。请记住，一个实验室的解读事实表针对其自身的测试结果，你不能使用该事实表来解读另一个实验室的结果。\n\
  \n典型的报告会列出每个参数的正常范围以及你的样本值。你可以将你的值与正常范围进行比较以确定问题所在。`pH` 值的失真是养分失衡的第一个迹象。`EC` 和单个营养值高于正常水平表示养分毒性和过度肥料。如果值低于正常水平，则表明存在养分缺乏。\n\
  \n## 调整养分水平\n\n在管理养分缺乏和毒性方面，有许多策略可以采用。让我们来看看其中的几项策略：\n\n-   如果缺乏养分（例如氮、磷、钾或硫），可以通过施用植物后肥料来轻松解决。这些养分以液体肥料的形式施用。\n\
  -   养分毒性也可以通过冲洗多余养分，然后施用含有所需养分的营养液来解决。\n-   有时，养分毒性可能是由你使用的水引起的。在这种情况下，通过反渗透等程序过滤水会有帮助。\n\
  -   如果微量元素存在毒性或缺乏，将生长介质的 `pH` 值调整到理想范围（`5.5–6.5`）可以解决此问题。这些养分的失衡是因为剧烈的 `pH` 水平变化会导致微量元素变得不可溶或过度可溶；因此，这些问题可以通过将\
  \ `pH` 水平稳定在正常范围内来解决。\n-   最后，肥料是解决养分缺乏的重要工具。如果你已经有一套施肥计划，可以考虑通过加入土壤缺乏的养分来调整。你也可以使用养分混合物，例如可溶性微量元素混合物或\
  \ `STEM` 来纠正轻微的养分缺乏。\n\n## 病害与害虫控制\n\n在闭式环境中，从介质选择到结构设计的每一步都经过仔细实施，以避免土壤传播疾病和害虫等问题，但此类问题仍然可能发生。然而，它们并不常见，程度不如其他栽培实践那样严重。\n\
  \n环境、生长床的放置，甚至是基质的化学性质对于防止土壤传播疾病和害虫的传播起着至关重要的作用。此外，种植者在种植后阶段可以采取一些关键步骤，以确保植物免受疾病和害虫的侵害。以下是可以采取的一些步骤示例：\n\
  \n-   确保温室内的湿度可以调节，以防止有利于病原体生长的条件的出现。\n-   确保温室内使用的工具可以定期消毒，以防止在发生任何疾病时传播。\n-  \
  \ 确保灌溉模式是可调节的，以便叶片在夜间保持干燥。\n-   确保地地土壤床可以用蒸汽处理以杀死致病生物。\n\n有许多种此类类似的预防性措施可以减少你温室中发生疾病的概率；然而，在对栽培温室土壤进行主动管理时，识别早期迹象的能力是最关重要的。\n\
  \n为了这一点，你对温室害虫和疾病的了解应该是足够的。常见的疾病有 `Fusarium`、`Rhizoctonia`、`Phytophthora` 和 `Thielaviopsis`，它们会导致根腐、枯萎和茎褐等问题。\n\
  \n温室常见的害虫有粉虱、叶螨、蚜虫和蓟。你应该能够及时识别这些害虫和疾病，并施用合适的杀菌剂、杀细菌剂和农药。\n\n土壤科学中经常讨论的害虫管理计划是综合害虫防治（IPM）。这是一种考虑了环境因素和人类健康的整体害虫管理方法。旨在通过自然方法预防、消除和减少害虫。`IPM`\
  \ 的四级体系包括：\n\n1. 害虫的识别与监测\n2. 采取阈值的设定\n3. 预防\n4. 治理\n\n鼓励害虫天敌、种植多样化的植物、使用植物提取物驱除或杀死害虫，以及使用物理陷阱或屏障防止害虫进入，都是\
  \ `IPM` 的组成部分。\n\n# 第 3 章：再生免耕栽培\n\n如果我让你想象一幅准备好播种的田，你会想象到什么？最可能，你脑海中浮现的是一片翻耕过的、表面不平且有些粗糙并可见耕沟的土地。嗯，这是因为我们长期以来一直这样做，而完全没有考虑过这种看似无害的行为可能产生的结果。\n\
  \n\n在农业领域，再生性免耕法作为一种领先的可持续实践脱颖而出。这种方法不仅能产生高产量，还能培育土壤健康。尽管它看起来可能是劳动密集型的，但它通过利用自然系统并最大限度地减少人类对土壤的影响，简化了流程。本章旨在讨论免耕农业的奇之处。在这里，我们将深入探讨免耕农业的原理和实践，揭示其对可持续农业的转型潜力。\n\
  \n## 再生农业的原理\n\n再生性农业是一个多维度的概念，但通过理解免耕农业的实践可以理解其基本定义。免耕农业是一种避免翻动或扰动土壤的方法，让自然来处理大部分耕作过程。本质上，这意味着要避开任何破坏或干扰表层土壤的活动。\n\
  \n在没有耕作习业的情况下，有机质是保持土壤肥沃的关键。当作物收获时，其废弃物和残余会被留留在地面上，最终会分解，形成一层厚厚的有机成分层。这些有机质逐渐成为土壤的一部分，改善了土壤质地和持水能力，增强了自然的土壤生态系统。最终，这一过程为下一次耕作季节创造了极其肥沃的土壤。这只是再生农业的一个方面。这一惊人的概念还有许多内容，使种植户的土壤管理变得更简单、更具成本效益且产量更高；我们将在章节的后续部分探索这些方面。以下是再生农业与传统耕作实践区别的主要原理。\n\
  \n### 最少土壤扰动\n\n再生农业最显著的特征是确保土壤扰动最小化。这一概念源于古代耕作实践，农民使用木棍在土壤上打洞，放入种子，并用同一根木棍覆盖种子。然而在过去，这是标准做法，因为他们不知道其他辅助作物生产的方法。近期免耕理念的普及是由于研究的推动，这些研究揭示了耕作的影响，以及像“尘盆运动”（Dust\
  \ Bowl）这样侵蚀了美国和加拿大大部分表层土壤的事件。\n\n再生农业的核心理念在于相信，最小化土壤扰动将允许自然土壤化学蓬勃，从而促进多年来我们农业活动所损害土壤的再生。最小化土壤扰动不仅意味着限制扰动土壤的物理因素，还包括对化学和生物药剂的最少化使用。本质上，这一概念是限制各种做法，例如：\n\
  \n* 使用整地机和犁等机械\n* 过度放牧\n* 施用化肥以及其他可能改变土壤化学性质和其中生物特征的土壤施用\n* 连续种植同一种作物，这会夺土壤中的必需营养\n\
  \n### 覆盖作物的使用\n\n你可以将这一原理视为再生农业的一个补充方面。主要原理（前面提到的）关注保护本土土壤化学性质，而这一原理旨在补充土壤养分并保护其免受不良物理、化学和生物因素的侵害。其理念是永远不要让农田没有任何活植物。为了实施这一原理，采用了主作物与覆盖作物的轮作。当一种作物被另一种取代时，前一种作物的残余被留在地上。这些残余覆盖土壤并作为土壤表面的盾牌。这个盾牌保护土壤免受风化和侵蚀。随着时间的推移，这些残余会分解，为土壤增加大量的有机质，从而减少了对额外有机质的需求。土壤中活根的持续存在也为益微生物和蠕虫的生长提供了理想环境。维持活根是另一个值得单独提及的关键原理，我们将在稍后讨论。\n\
  \n从长远来看，作物覆盖通过以下方式改善土壤结构：\n\n* 调节孔隙结构。\n* 增强团聚形成。\n* 促进水分在土壤内的运动。\n\n### 维持活根\n\n\
  在深入研究这一原理的基础之前，理解所谓的“碳封存”概念是非常重要的。这是一个将大气碳以各种形式捕获并储存在活生物和土壤中的过程。几种自然过程持续封存大气碳，生物封存只是其中之一。活植物在光合作用过程中利用碳来产生食物。然而，当这些植物消失时，土壤会分解有机质并将碳释放回大气。\n\
  \n再生农业利用这种封存形式来对抗全球变暖。其理念是，植物和活跃根越多，它们就能在土壤中封存和储存的二氧化碳。此外，土壤活根意味着存在一个活跃的微生物群，有助于碳封存和营养循环。这一原理通过使用覆盖作物以及确保土地在一年中的任何时候都不被闲置来实现的。由于再生农业的这一特性，它通常被称为“碳农业”。根部还有助于将土壤颗粒结合，从而防止土壤侵蚀。\n\
  \n此外，活根支持植物、土壤和微生物之间形成通信网络。这个网络正向影响土壤的固氮、养分留存与供应以及农业土壤的抗逆性。我们将在本章后面进一步探讨这一通信网络。总而言，在土壤中维持活根具有几个重要功能，包括：\n\
  \n* 最小化侵蚀\n* 封存碳\n* 积累有机质\n* 混合土壤中的养分\n* 防御病原体、害虫和其他压力\n\n### 牲畜的使用\n\n在此时，你可能在想再生农业中是否还有其他（当然除了耕作之外）方法可以帮助养分循环和有机质扩散。是的，有的。这可以通过智能利用牲畜来实现。\n\
  \n虽然限制过度放牧是再生农业的关键目标之一，但这种方法仍然可以实施经过计划的放牧系统。这可以通过使用短期、高强度的放牧，结束后是长时间恢复期来实现。这一原理的成功应用取决于对这些会次的时间、强度、频率和持续时间的仔细选择。显然，这一系统并不适用于所有的耕模式，因为牲畜无法随处使用。然而，以粪液形式使用动物粪便仍然是有益的，因为它可以被视为牲畜对再生农业的贡献。\n\
  \n计划良好的群牧会带来的显著益处包括：\n\n* 促进植物生长\n* 增加土壤肥力\n* 增加昆虫和微生物的活动\n* 改善土壤碳封存\n\n### 依赖有益微生物\n\
  \n\n\n\n\n再生农业依赖于益生土壤微生物（如细菌、真菌、病毒和原生动物）来支持土壤健康。这些微生物通过多种方式做出贡献。首先，它们通过快速分解有机物并将其彻底与土壤混合来增强养分循环。其次，它们改善了土壤质地并增加了其保水能力。此外，植物释放到土壤中的有毒废物也会被这些微生物分解。最后，这些微生物创造的竞争环境使得病原物种几乎无法生存，从而消除了疾病发展的威胁。你能够看出这是多么精妙吗？当益生土壤微生物为确保土壤健康承担了如此大量的工作时，就不需要翻耕或施用化肥和农药了。\n\
  \n再生农业可以通过多种策略支持这些益生微生物物种的生长，例如：\n\n- 覆盖作物\n- 混合种植\n- 免耕耕作\n- 使用堆肥\n- 使用本土来源的微生物友好解决方案\n\
  \n### 作物多样性的最大化\n\n这一原则侧重于最大化社区多样性，以促进土壤内益生微生物的多样性，管理虫害，并防止因长期种植单一作物而可能导致的营养缺乏。这种多样性还减少了病虫害的发生。为了实施这一原则，可以利用覆盖作物、轮作和伴生作物等各种再生实践。也可以采用多物放牧来促进多样性。\n\
  \n作物多样性对再生农业有什么作用？\n\n- 它增强了生态系统功能，因为不同的植物种类在其中发挥不同的功能。\n- 它减少了因干旱和洪水导致作物损失的概率。\n\
  - 它提高了土壤肥力。\n- 它增强了土壤的养分循环和保水功能。研究表明，与单作相比，作物多样性使疾病风险降低了 73%（`Singh et al.`, 2023）。\n\
  \n所有这些再生农业原则都是为了创建一个生态系统，在该系统中：\n\n- 土壤健康得到维持。\n- 养分的补充速率几乎与其利用速率相等。\n- 土壤的化学性质得到保护和维持。\n\
  - 栖息土壤土壤微生物群得到保护并被积极用于维持土壤健康。\n- 生长的作物不受化肥的影响。\n- 作物生产对种植者来说变成了一个简单且成本效益高的过程\n\n\
  然而，再生农业最大的优势在于它有助于气候修复。其目标是降低大气中的碳负担并提高土地利用效率，从而以最小的投入获得更高的产量。持续使用这些实践所产生的土壤更肥沃、更有韧性。它能够抵抗洪水、干旱和热浪等极端气候事件，从而为所有人带来更好的产出质量和更高的粮食安全。\n\
  \n现在你已经了解了再生农业的基础知识，是时候让我们深入研究免耕耕作的科学了。\n\n## 免耕耕作的益处\n\n让我们了解免耕耕作是如何工作的，以及为什么它比传统的耕作实践是更好的方法。\n\
  \n### 保护土壤结构\n\n当我们使用免耕耕作时，我们不使用任何干扰土壤自然成分的程序。正如我们在书开头讨论的那样，土壤形成是一个复杂且缓慢的过程，需要大量时间才能达到最佳状态。在科学术语中，我们称为土壤演替。当土壤达到其最高演替水平时，它具有合适的细菌和真菌比例。此外，从质地上来说，它是最好的。无疑，我们不希望破坏这种演替水平，但这恰是翻耕会发生的情况。免耕耕作通过保持土壤的固有属性解决了这个问题。\n\
  \n### 降低土壤侵蚀风险\n\n这是免耕耕作提供的最大益处。如果我们把所有的农业实践都转化为免耕耕作，我们就可以恢复因快速工业化、城市化和气候变化而失去的表层土。一项研究发现，如果美国中西部完全采用低耕或免耕耕作实践，表层土侵蚀可以在未来一个世纪内减少\
  \ 95%（`Advancing Earth and Space Sciences`, 2023）。\n\n### 增强生物多样性\n\n免耕耕作与作物覆盖和覆盖等其他可持续实践结合时，为土壤提供了一个稳定的环境，益生细菌、真菌种类以及蚂蚁、蜘蛛、甲虫和蚯蚓等虫可以在那里繁衍。研究和证明，结合免耕耕作与栖息地及作物多样化的良好土壤管理实践对土壤生物多样性的保护有显著影响（`Mamabolo\
  \ et al.`, 2024）。\n\n### 更好的保水能力\n\n水分通过蒸发和径流在农田中很常见。免耕耕作为这两个问题提供了一个简单的解决方案。不翻耕保持土壤团体的完整，防止了通常会发生的水流失。此外，当土壤表面结构保持完整并被上季作物的植物残留覆盖时，通过蒸发产生的水流失降至最低。最近的一项研究显示，直播的免耕水稻与传统的水播方法相比节省了高达\
  \ 15% 的水（`California Rice News`, 2024）。\n\n### 节省投资\n\n种植者还可以通过免耕耕作获得显著的节省。考虑一下在耕作设备、化石燃料投入和人工成本上可以节省多少钱。可以使用复杂的机械代替在未耕土壤上播种。根据\
  \ `Tadjiev et al.`, 2023 的估计，免耕耕作可以减少家庭约 15% 的生产成本。\n\n### 气候修复\n\n没有任何土壤能像用于免耕的土壤那样固碳。由于这种土壤总是充满了养分循环微生物和活根，它始终在固定和储存碳。这种解决方案具有降低大气碳比例和缓解我们气候问题的潜力。根据\
  \ `Lal et al.`, `n.d.` 的数据，仅在美国采用免耕和覆盖作物等土壤管理实践，每年就可以固存约 8300 万至 27 亿吨碳。这意味着每年可以从大气中移除\
  \ 65 亿吨二氧化碳。\n\n免耕耕作方法还使土壤能够补充养分含量（通过覆盖作物和绿肥），从而减少了施用化肥的需求。免耕耕作的这一方面具有减少水污染的潜力。\n\
  \n## 免耕技术\n\n在了解免耕耕作的益处后，你一定想尝试它。然而，你可能好奇从传统的翻耕转变为免耕方法有多容易。你可能对完全实施这种方法需要多长时间、是否需要特殊设备以及开始的步骤等有所疑问。在本节中，我们将回答所有这些问题。\n\
  \n\n\n\n首先，免耕法的实施可以从你的下一个种植季节开始。在此期间，你可以对土壤进行准备并管理现有的植被，使其适应免耕耕作。我建议通过一次引入一个元素来逐步过渡。这种方法将帮助你获得最佳结果，并逐一应对潜在的挑战。在设备和机械方面，你需要购买一些专门为此目的设计的物品。我建议购买二手设备；不过，如果你倾向于购买全新的，那也可以。这可能感觉像是一项巨大的投资，但你将在未来通过提高产量以及燃料和劳动力成本的节省来收回这笔成本。此外，如果你正完全转向免耕农业，可以出售你的耕作设备，并用这些资金购买免耕设备。无论你做什么，请放心，你将从这次初始投资中获得巨大收益，你的土壤也会感谢你的转变。\n\
  \n## 第 1 步：获取土壤化学和质地\n\n与任何其他耕作方法一样，你将从土壤健康检查开始。这将包括检查其 `pH` 值和营养分状况。这项评估将指导你未来维护土壤健康的步骤。更重要的是，你需要评估土壤的压实程度。如果你的土壤非常紧实，你需要先对其进行透气。虽然这看起来可能不是开始免耕耕作的最佳方式，但如果有立即透气的需要，你可以使用低影响的耕作工具或机器来实现该目的。记住，只有当你认为土壤过度压实时，这一步才是必要的。\n\
  \n## 第 2 步：添加有机成分\n\n这是免耕农业真正开始的地方。此时，你将专注于利用任何能找到的有机且可降解的物质向土壤中添加有机物。这个过程可以从切断土地上生长的植被开始。这就是绿肥概念发挥的地方。绿肥是指利用活作物向土壤中添加有机物。此外，添加多层富氮成分、纸板箱、报纸、干燥植被和堆肥可以帮助在耕作区域建立厚厚的有机物层。我们将在以后详细讨论这一步。\n\
  \n## 第 3 步：苗床准备和播种\n\n这一步涉及为播种准备土地，确保温度和水分达到理想水平，然后以最小化土壤扰动的方式进行种植。\n\n## 第 4 步：播种后覆盖\n\
  \n覆盖物基本上是指铺在土壤表面的材料。播种后添加覆盖物的目的是为下方区域提供保护层，增加更多营养，并为发芽种子提供一个稳定的环境。\n\n## 第 5 步：维持肥力和土壤健康\n\
  \n在这个阶段，你只需要监测植物生长，并确保不出现任何土壤疾病、害虫攻击或营养缺乏。为了在这一阶段促进土壤健康，使用堆肥茶、叶面喷和其他综合病虫管理策略可以产生极的结果。这些方法允许你向土壤供应营养，减少疾病并威慑害虫。\n\
  \n## 第 6 步：覆盖作物\n\n这是作物收获后的一个步骤。正如名称所示，覆盖作物覆盖土地，保护并滋养它，直到下一个种植季节准备就绪。有各种不同功能的作物供你根据土壤的需求进行选择。\n\
  \n## 第 7 步：作物轮作\n\n免耕农业的最后一个关键步骤是使用轮作。轮作是 `IPM`（综合害虫管理）的核心组成部分。轮作简单意味着不在同一区域反复种植相同的植物，并轮这些生长模式以确保不发生害虫攻击，并保持土壤肥沃透气。\n\
  \n让我们详细讨论一下基本步骤。在开始之前，重要的是，免耕农业没有单一的成功公式。可以根据土壤类型和环境条件应用不同的方法。唯一需要记住的恒定原则是抵抗耕作土地的冲动。\n\
  \n### 土壤准备和种植方法\n\n过程从土壤准备开始。这里的目标是准备土壤使其能够在整个季节中支持植物生长，长时间保持水分并抑制杂草和害虫等不需要的元素。土壤准备的方法因土壤状况和季节而异。\n\
  \n最好从春季作物收获时开始土壤准备。这让你有充足的时间向土壤中添加有机成分。如果你在这个时候开始并注意到土壤被压实，那么最后一次低影响的耕作将是有益的。或者，你可以种植整地萝卜或大根萝卜作为覆盖作物。这些覆盖作物将为你的土壤提供极佳的耕作。你甚至不需要拔掉它们；只需让它们留在那里即可。将它们的绿色部分切碎并掉在土壤表面将进一步增加有机成分。然后你可以添加堆肥和厚层覆盖物，为下个季节完全准备苗床。\n\
  \n如果你在春季开始时产生灵感要进行免耕，并想准备免耕园床，你可以进行快速的土壤健康检查。如果土壤被压实，翻动上层几英寸。如果有杂草，不要把它们拔出来；只需将其切碎并掉在原地。它们将作为你土壤的覆盖物。之后，添加一层厚厚的熟化堆肥；理想情况下是\
  \ 6 英寸（≈15 厘米）厚，然后用覆盖物覆盖（`Dziak`, 2023）。这种快速准备的免耕土壤可以耕种；但不如从上个季节就开始准备的土壤有效。你需要添加肥料和有机投入，并进行除草以支持此类土壤中的植物生长。随着土地完全转变为免耕土壤，情况会改善。\n\
  \n如果你是从零开始准备免耕土壤，并想在冬天逐渐为其添加有机成分，可以这样做：\n\n1. 在微湿的土壤上，切碎并掉落在已存在的植被。使用草叉透气，并轻轻地将这层绿色植物与土壤混合。\n\
  2. 添加一层富氮成分。这些成分可能包括粪肥、叶子、松针、咖啡渣、碎蛋壳和水果或蔬菜皮。\n3. 添加第三层潮湿报纸和纸板箱。这一层将消除杂草并促进分解过程。\n\
  4. 在这一层上方添加更多富氮的弃物，并用干叶子、秸草和草覆盖。这两层最终将与纸板下方的层混合，从而为你的园床添加大量有机物。\n5. 一旦所有这些层都分解并与下方土壤混合良好，你可以在播种前添加一层堆肥并用覆盖物覆盖。\n\
  \n当你准备好播种种子时，需要检查两点：地面是否具有高水分含量，以及是否有草或杂草从覆盖物中伸出来。如果水分含量低，浇一次水就能解决问题。杂草和草出现的可能性很小；但如果有，你可以手动清除它们或使用设置为最低挡位的割草机。如果在此过程中任何覆盖物被移位，请添加更多覆盖物。\n\
  \n在种植过程中，确保土壤不受扰动应该是你的首要任务。以下是一些技巧，以确保在免耕区域进行顺利且有效的种植：\n\n● 使用经过杀虫剂和杀菌剂预处理的种子。\n\
  \n\n\n\n\n- 使用特殊的钻孔设备在土壤中钻出孔来放置种子。或者，你也可以手动播种。你可以推开覆盖物，挖出长浅的沟。一旦将种子放入土壤，请对它们进行适当覆盖。\n\
  - 播种时应确保所有播种种子的深度一致，这样所有植物就能在同一时间出土。\n- 不要使用沉重的覆盖物材料或铺设过厚的覆盖层来覆盖种子，因为这会阻碍种子萌发和幼苗出。\n\
  \n随着季节的推移，确保定期对地面进行覆盖。可以添加包括堆肥、枯叶和剪下的草在内的任何物质，以确保养分的补充和水分的保持。这不仅有助于现有植物，还能为下一个耕作季节改良土壤。\n\
  \n## 覆盖作物与绿肥\n\n如果不对覆盖作物和绿肥的奇妙之处赞赏，我们对免耕耕法的讨论就无法完整。这两个部分通常与其他耕作方法结合使用；但在免耕耕法中，它们的作用是使免耕取得成功的支柱。\n\
  \n如上所述，覆盖作物和绿肥是用于准备免耕耕土地的两种主要成分。从上面的讨论中，你可以轻松推断出覆盖作物的主要益处：防止土壤侵蚀、耕松压实的土壤以及提供有机质。然而，覆盖作物提供的远不止于此。例如，它们可以：\n\
  \n- 阻止快速生杂草获得阳光，从根本上将它们排除在土壤之外。\n- 遮土壤，从而防止有机物的快速氧化和表层土壤水的蒸发，保持其含水量。\n- 在非耕作期间喂养并保护土壤微生物群。\n\
  - 如果在前一个耕作季节中过量施肥，它们可以平衡养分毒性和化肥的影响。\n\n绿肥是可持续农业的关键组成部分，因为它们的功能与化学肥料相同，但对环境的影响可以忽略不计。任何在仍保持绿色时施入土壤以提高土壤肥力的作物类型都被标记为绿肥。因此，从技术上讲，切碎并丢在地面上以增加免耕土壤有机含量的覆盖作物也是绿肥的一种。玉米秸和新修剪的草坪也可以作为绿肥撒在田间。\n\
  \n覆盖作物和绿肥覆盖物有趣的地方在于它们具有消除杂草的能力。在任何免耕耕法方案中，通常建议在播种前使用除草剂作为预防措施，因为你永远不知道几棵杂草何时从施在地面上的多层有机物和覆盖物中钻出来。然而，近期对绿肥和覆盖作物效果的研究表明，这两个组分具有完全清除免耕土壤中杂草的潜力。通过使用这两种方法，可以完全省去在免耕土地上使用除草剂（北弗吉尼亚州土壤和水土保护区，n.d.）。\n\
  \n### 选择合适的覆盖作物\n\n如上所述，有多种覆盖作物选择，每种除了为土壤添加有机质和保护其免受环境变化外，还提供独特的益处。某些覆盖作物增加氮，某些吸收过量的磷，某些耕松土壤，某些提供牲畜饲料。因此，覆盖作物的选择应该根据你的具体需求。\n\
  \n看看流行的覆盖作物及其独特特性：\n\n- 草本类（荞荞、燕麦、大麦和黑麦）——长于积累氮和提供牲畜饲料。\n- 十字科品种（叶菜蔬菜、西兰花和抱市甘蓝）——长于修复磷毒性。\n\
  - 豆类品种（鹰豆、苜蓿和扁豆）——高效的固氮植物和最好的绿肥。\n- 耕作品种（萝卜、芜菁、萝卜和向日葵）——具有深根系，可以在不扰动土壤生物的情况下透气。\n\
  \n覆盖作物的种植时机也很重要。最佳种植时间是初秋，紧接在夏季作物收获之后。这让它们有充足的时间在冬季生长，然后你可以将其割下作为绿肥加入你的土壤中。然而，对于想要种植冬季作物的人来说，在夏季作物收获之前种植是最佳选择。这允许种子在你们收获主作物时萌发，幼苗出苗。这些植物可以在冬季耕作前恰好移除。\n\
  \n## 维护土壤健康与肥力\n\n在免耕地区，土壤健康的维护和肥力维持与基于耕地的耕作实践相比是一个完全不同的故事。原因显而易见：当你发现农场出现问题时，你会取一种化学品加入土壤，混合均匀，并等待它解决问题。这一切在免耕耕法中是无法实现的。所以，你可能会问，我们可以做什么来确保免耕地区的土壤肥力呢？\n\
  \n答案很简单：从顶部添加任何你能获得的东西，而不扰动土壤，让土壤微生物保持快乐，并信任它们为你完成剩余的工作。\n\n### 建立有机质\n\n到现在，你已经理解了有机质对免耕设置的重要性，你可能在想我们为什么再次讨论这个。重点在于，添加有机质不仅仅是在初始阶段需要做的；它是一个持续的过程，是免耕耕法不可或的一部分。所以，如果你想维持免耕农场并使其生产力最大化，你就必须继续向其中添加有机质。\n\
  \n这看起来可能是一项艰巨的任务，但实际上并非如此。一旦你将耕作实践完全转变为免耕，或者通过仔细铺设绿色、棕色物质和堆肥来准备一个特殊的免耕花园，你就不必在每个耕作季节前从头开始。然而，你必须继续添加更多的有机成分作为覆盖物。这可以是完成的堆肥、草和稻草的形式。在你的产品收获后，你还必须种植覆盖作物，让土壤恢复并为下一种作物做好准备。这些做法将继续丰富你的土壤，同时抑制杂草的生长。\n\
  \n为了满足你的堆肥需求，我建议在开始准备免耕土壤就开始建立堆肥堆，这样在耕作季节需要时它就完全就绪了。别担心，我们关于堆肥的所有内容将在第五章讨论。对于获取覆盖物和堆肥的成分，有几种选择，包括：\n\
  \n- 你农场其他耕作实践的废物\n- 厨房垃圾\n- 社区的园林垃圾\n- 附近马厩的动物粪\n- 商业堆肥和覆盖物产品\n\n### 使用堆肥茶和叶面喷\n\
  \n这两者对于维持土壤健康以及支持植物生长都很重要。堆肥茶是通过向完成的堆肥加水制成的液体提取物。由于它们的化学特性与固体堆肥几乎相同，对于希望在不扰动土壤的情况下添加养分的免耕土壤来说，它们是理想的投入。它们可以轻松渗透土壤，帮助提高土壤肥力数倍。\n\
  \n\n\n\n叶面喷剂顾其实名，可以直接施用在植物叶片（叶被）上的混合物。它们可用于促进植物生长、驱除害虫和控制疾病。某些肥料也可以作为叶面喷剂来促进果实产量并帮助处于压力下的植物。杂草茶和草本茶是叶面施用的其他例子。堆肥茶也可以作为叶面喷剂。当进行此类应用时，微生物（堆肥茶中）释放的养分通过植物叶片上的孔隙吸收。需要记住，叶面喷剂旨在支持植物生长；然而，其效果并不等同于添加到土壤中的有机质。\n\
  \n## 土壤微生物生命及其作用\n\n正如我之前提到的，保持地下微生物群落的健康是你在免耕耕作中取得成功的其次要任务。现在，显然，你无法采取任何特殊措施来为它们提供一个舒适、温馨的家；记住，这是免耕耕作。事实上，在保护益益土壤群落方面，关键于你应该做什么来帮助它们，而在于你不**应该**做什么。土壤微生物在免耕耕作中的作用至关重要，理解这一点需要深入研究它们的关系和运作机制。所以，让我们开始吧。\n\
  \n土壤包含几类微生物（以及其他生物），它们分为不同的类别，包括细菌、真菌、原生动物和线虫。这些类生物在养分循环和维持土壤肥力方面发挥着至关重要的作用。线虫和某些节肢动物通过将有机成分碎成小碎片来启动分解。这些碎片随后受到真菌和细菌细胞的攻击，从而开始分解过程。线虫和原生动物以真菌和细菌为食，将养分释放到土壤中。还有一种特殊的生物被称为食草者，它们有助于有机物与土壤颗粒混合。还有一类特定的细菌固定大气氮并将其转化为植物吸收的形式。植物通过释放根系分泌物来获取这些养分。根据这些分泌物的化学组成，特定的细菌和真菌会被吸引到植物根。根部吸收这些细菌和真菌，提取它们体内的养分，并将养分输送到植物的上部。请注意，这一过程并非免耕土壤所专属——同样的植物-微生物相互作用发生在土壤的任何地方；然而，这种互动对于免耕耕作更为重要，因为免耕耕作中表土耕作和土壤替代品的添加是有限的。\n\
  \n这一过程比我之前提到的复杂得多，但这不是重点。要理解的重点方面是，这种养分的和谐流动之所以发生，是因为正确的微生物可以以适当的数量聚集，并执行确保土壤肥力的功能，为你提供你渴望的生产力。这些土壤群落在土壤中建立自身需要很长时间，而保持它们的繁盛生长是我们的目标。问题是，我们可以做什么（以及不做什么）来确保这些微生物群落能够繁盛生长？\n\
  \n以下是我的五大建议：\n\n-   不要扰动！（尽可能减少土壤扰动）\n-   添加堆肥和堆肥茶\n-   覆盖物\n-   使用覆盖作物\n-   种植多种作物（提示：实施轮作）\n\
  \n免耕耕作要求你的耕作技术发生彻底转变。它涉及最大限度地减少土壤扰动并采用“播种后任其生长”策略。起初，这种方法看起来可能非常异常，你可能会怀疑它的有效性。然而，只要稍加坚持并持续向土壤中添加有机质，你获得的结果将令你惊讶。毕竟，这对你和你的土壤来说都是双赢局面。\n\
  \n# 第 4 章：容器土与高床土\n\n我们在温室土壤章节中简要提到了维持容器和高床土壤的动态平衡，但容器和高床栽培并不不仅限于温室。它们是不同的栽培模式，需要单独讨论。这两种方法之所以流行，是因为它们在世界上各种生长条件下的适应性和可持续性。然而，在具有这些优势的同时，这些方法也有一些缺点。为了解决这些缺点并使利益最大化，我们需要对容器土和高床土有彻底的了解。\n\
  \n## 容器土基础\n\n容器园艺，或盆栽园艺是一种追溯到公元前 5000 年的古代方法；然而，由于快速工业化和城市化，这种方法的流行程度呈指数级增长（Catalano,\
  \ 2023）。受这些事件的影响，世界各地的土壤肥力水平面临着急剧下降。此外，人们越来越发现难以找到地种植区域，因此，助于容器园艺已成为他们最有吸引力的解决方案。今天，你可以在最小的露台和最窄的巷弄里看到生长在容器中的植物。\n\
  \n### 容器土的优点\n\n容器耕作与任何其他耕作方法一样，都有自己的优缺点。彻底了解这些因素可以帮助你决定如何将容器耕作纳入你的设置中以实现收益最大化。\n\
  \n#### 可移动性\n\n通过容器园艺，最大的优点是植物可以根据其对光和阴影的需求从一个地方移动到另一个地方。此外，在极端天气条件下，植物可以被覆盖或移到室内。\n\
  \n#### 灵活性\n\n它们可以根据可用空间放在任何地方。堆叠花园和垂直花园是将这种灵活性推向极致两个概念。它们需要有限的空间，但允许将多种植物种在一起。\n\
  \n#### 预防疾病和害虫\n\n由于一个盆的土壤很少与其他盆的土壤混合，传播土壤疾病的概率微乎其微。这同样适用于害虫。在发生害虫攻击或疾病时，采取补救措施并将受影响的盆与其他分离可以有效阻止并控制问题。\n\
  \n#### 土壤维护的便利性\n\n盆内土壤的维护相对于地耕维护较简单。土壤质地、排水和透气在容器中很容易调整。\n\n### 在容器中生长的挑战\n\n容器园艺有限的生长空间既是优点也是缺点。对于深根植物，你需要在容器中种植时进行特殊调整；否则它们会长破盆，导致生长矮小。土壤体积有限意味着需要频繁浇水，因为土壤无法长期保持水分。\n\
  \n容器土对温度变化也敏感，意味着它们降温或升温比地土更快。最后，由于尺寸较小，盆中土壤的维护直观；然而，容器土不是一个自维持系统，这意味着它需要频繁的维护和添加土壤改良剂。\n\
  \n### 推荐土壤配方\n\n由于容器土是完全隔离的生长介，它们必须具备理想土壤的所有属性以支持植物生长。营养植基必须具备的主要属性包括\n\n-   保持水分和养分直到根部吸收。\n\
  -   提供足够的透气性。\n-   为根部提供足够的固持力。\n\n\n\n因此，盆栽基质的选择需要经过适当的考虑。主要有两种基质选择：营养土和无土基质。\n\
  \n#### 营养土\n\n你不能简单地从后院挖土并用于盆栽园艺。那种土壤通常非常紧实且沉重。我们需要透气良好、轻质且富含营养的土壤。因此，营养土需要通过与其他成分混合专门配制，以获得生长基质所需的质地。你可以从当地的园艺商店购买营养土，或使用土壤以及无机和有机成分配制定制配方。\n\
  \n一些农民喜欢在配土中使用土壤，因为这可以帮助植物更容易地适应和扎根，同时还能获取易得的养分。这种方法让种植者不必过于担心基质的营养状况。然而，使用土壤也面临着挑战。一个显著的问题是压实，可以通过添加其他成分来管理。另一个主要关注点是土壤病原体的存在，可以通过对土壤进行热处理来解决。即使在移除土壤病原体并提高其孔隙率后，土壤颗粒可能会再次紧实并在未来导致问题，因此专家建议在这些混合物中保持很低的土壤比例（`Container\
  \ Soils and Soilless Media`, `n.d.`）。\n\n请查看下方的营养土配方。注意，这只是一个包含了大多数为植物提供正常排水、透气和营养成分的配方。如果你认为你的基质需要更多或更少的某种成分，显然可以调整这些成分的用量。\n\
  \n对于这种配方，你需要各 37 杯（2 加仑）的园土、泥炭苔、堆肥和珍珠岩。你还需要各半杯的海藻粉、磷酸钙岩粉、绿砂、白云石石灰岩和大豆粕（`Reich`,\
  \ `2014`）。你必须对土壤进行熏蒸和杀菌以去除真菌和细菌细胞。你可以从筛分并混合土壤、泥炭苔和堆肥开始。最后，如果你认为混合物看起来太干，可以加入所有其他成分以及一些水。这种基质适用于种植各种盆栽植物。\n\
  \n你还可以使用具有特定属性的成分来改良这种基质或其他任何营养土。这些成分包括：\n\n*   粗砂——颗粒尺寸大，可用于增强孔隙率。\n*   锯末和木屑覆盖物——碳含量高，最适合蔬菜生长。\n\
  *   椰壳纤维——高保水性，适合种植多肉植物。\n*   腐叶土——营养含量高，可用于增强配土的肥力。\n\n#### 无土基质\n\n我们在第 2 章中讨论了无土基质的几种无机和有机成分的特性。同样的成分可以用于为盆栽植物制造无土基质。通常，一种有机成分和一种无机成分的混合就能提供良好的盆栽基质。为了进一步增强其组成，可以添加肥料。以下是无土基质最常见的成分：\n\
  \n*   泥炭苔——提供水分和养分保持。\n*   松树皮——提供营养、固定、保水和空气。\n*   椰壳纤维——高保水性，适合种植多肉植物。\n*   腐叶土——营养含量高，可用于增强配土的肥力。\n\
  *   粗砂——颗粒尺寸大，可用于增强孔隙率。\n*   锯末和木屑覆盖物——碳含量高，最适合蔬菜生长。\n*   椰壳纤维——高保水性，适合种植多肉植物。\n\
  *   腐叶土——营养含量高，可用于增强配土的肥力。\n\n\n\n\n与其他任何园艺方法一样，高架床栽培中基质的质量也至关重要。这里的首要考虑因素是排水、养分含量和质地。排水水平需要进行调整，使水分保持的时间足够让根系吸收，但雨水应能从底部迅速渗出。养分含量应富含宏量元素、微量元素和有机质，因为高架床中同时种植的植物数量较高，土壤必须能够同时支撑它们的生长。在质地方面，基质应该是松软且易于碎裂的。\n\
  \n与其他生长介质成分中使用的各种成分相比，高架床基质只有两个主要成分：表层土和堆肥。有时，也可以添加其他有机改良剂，如腐叶土、蚯蚓粪和木屑。\n\n现在，你可能在奇怪为什么高架床栽培只使用这些成分而不是其他成分。此外，无土基质又是怎样的？答案很简单：这些成分之所以成为唯一选择，是因为研究和种植者的经验证明，这种组合是高架床唯一可持续的基质。至于无土基质，新手购买袋装的无土基质很常见；但缺点是，这些基质在短短一两个季节后质量和生产力就会急剧下降（Schalau,\
  \ 2018）。因此，使用无土基质并不是高架床土壤的推荐做法。\n\n### 表层土\n表层土被认为是高架床最好的起始材料。它提供了良好的质地、排水性和微生物群落来支持植物生长。理想情况下，表层土应具有壤土质地，包含所有的基础土壤成分，包括粘土、沙子和粉土。\n\
  \n如果你家土地的质地符合标准，可以从那里获取表层土。当地土壤还拥有稳定的植物友好细菌和真菌群，这又是一个理想的特征。建议在将土壤填入高架床之前去除碎石和大块岩石。如果你家土地的表层土质地不符合要求，可以从供应商处采购。从供应商处购买表层土时，寻找未改良的表层土总是好的，因为这让你能够根据植物的需求灵活地使用你喜欢的成分进行改良。\n\
  \n根据马里兰大学扩展部（n.d.）的说法，高架床土壤中的有机质含量按体积计算应占 25%–50%，按重量计算应占 5%–15%。总体而言，混合物中表层土的比例应该是\
  \ 50%（Pearce, 2022）。一旦你将土壤加入高架床，就可以通过获取实验室检测来测量有机质的数量。实验室结果将指导你还需要额外添加多少堆肥和改良剂。\n\
  \n### 堆肥\n你加入混合物中的表层土可能无法提供植物所需的一切，因此我们需要添加堆肥。由于堆肥是由分解的有机成分制成的，它极富含氮、磷、钾等宏量元素。以下是堆肥的其他一些作用：\n\
  \n*   提供表层土可能缺乏的微量元素\n*   维持排水性\n*   提高土壤持水能力\n*   维持土壤温度（堆肥有助于保持土壤温暖）\n*   向土壤添加益益的细菌、真菌和蚯蚓\n\
  \n在理想的高架床土壤中，堆肥应占体积的 30% 左右（Pearce, 2022）。和表层土一样，最好从自己的农场获取堆肥。但这并不容易，因为用量很大。因此，你可以从当地供应商处获得堆肥。不过，你可以建立自己的堆肥堆，为你提供定期维护基质质量所需的少量堆肥。\n\
  \n### 有机质\n这是高架床土壤的最后一种成分。推荐用量为 20%，这并不高，因为另外两种成分对混合物也同样重要。表层土和堆肥已经包含了大量的有机质，但添加更多的原因是我们想增强土壤的养分状况和结构。有机质（如木屑、树皮、腐熟的粪肥和割草）会在土壤中形成微小的空间，使其更容易持水。\n\
  \n### 千层饼园艺法\n这种方法几乎不使用表层土。相反，它完全依赖于分解的成分。它在希望在自己的设置中融入可持续和资源保护实践的种植者中流行。千层法使用了所有原本会进入填埋场的原料。\n\
  \n以下是使用这种方法准备土壤的快速指南：\n\n1.  找一个理想的位置放置高架床框架。对于这种方法，我建议将它们放在离房屋远的地方，因为分解材料可能有味道。\n\
  2.  收集高碳源和高氮源。你需要创建一个碳氮比例 4:1 的组合。对于碳源，你可以使用干叶、锯末和秸草等“棕色材料”。对于氮，可以使用蔬菜残渣、割草和反刍动物粪便等“绿色材料”。\n\
  3.  用报纸或纸板覆盖床底，并充分浸湿这一层。这一层将消除杂草。\n4.  在记住 4:1 比例的情况下添加碳层。\n5.  添加富富氮层。\n6.  记住，你必须通过添加多层碳源和富氮成分来填充床，所以你的初始层应该足够厚，以填充整个高架床。\n\
  7.  继续堆叠直到达到理想的高度。\n8.  让这层“千层饼”熟化，使其完全分解并将所有层充分混合。不过，你也可以立即耕作。\n\n### 堆丘园艺（Hügelultur）\n\
  Hügelultur 是一个德语词，意为“堆丘文化”。这种技术涉及创建一个由生长友好成分组成的丘，可以调节持水、排水和温度管理等因素。这种方法的三个主要成分是表层土、堆肥和木质成分。随着土丘缓慢分解，它为植物提供持续的养分。土丘的形状还能最大限度地利用雨水，从而消除了频繁浇水的需求。\n\
  \n以下是使用这种方法设计高架床基质的快速指南：\n\n1.  首先在高架床上添加一层初始表层土。\n\n\n\n\n2. 使用木棍或尖锐工具勾勒出你想要创建土丘的位置和宽度。我建议制作几个相互并行的长波浪形土丘。这是基础形状，因为它能让你高效地利用高床。\n\
  \n3. 在每个土丘的底部和边缘铺上树枝和断枝。\n\n4. 增加一层木屑。\n\n5. 添加一层粪肥。\n\n6. 增加一层小树枝。\n\n7. 添加一层剪草屑和粪肥。\n\
  \n8. 顶部铺上表层土和有机肥。\n\n9. 让土丘在冬季进行分解，但如果你想立即种植，也可以。\n\n注意：堆肥栽培法（Hügelkultur）基本上采用了与“千层饼法”（Lasagna\
  \ method）相同的铺层方法。唯一的区别在于原料成分以及土丘的位置/形状。此外，你可以制作许多种形状的土丘，包括有边缘、无边缘、木质边缘和石质边缘的土丘。我上面提到的那种是用于木质边缘设计的。\n\
  \n### 土壤深度与排水管理\n\n在向高床中填充土壤时，产生的一个重要问题是应该添加多少基质。特定植物家族理想的深度是多少？我们应该将高床填到顶部，还是应该留出一些空间？\n\
  \n在农业领域，建议的最小深度是 8–12 英寸，或≈20–30 厘米（Burke, 2023）。然而，你需要考虑的主要方面是你想在高床上种植的植物类型。对于不同的植物有不同的推荐深度。以下是一些示例：\n\
  \n* 浅根植物包括叶类蔬菜和草药需要大约 6 英寸（≈15 厘米）的深度。\n* 根茎蔬菜和辣椒需要大约 12 英寸（≈30 厘米）的深度。\n* 深根植物如羽衣蓝、南瓜和西葫芦需要\
  \ 18 英寸（≈45 厘米）的深度。\n\n是否将高床填到顶部的问题也很简单。如果你将床填到顶部，就会让你宝贵的基质暴露在导致侵蚀的力量面前。每当你浇水或下雨时，你都会失去基质的顶层。因此，在高床上至少留出\
  \ 1–2 英寸（≈2.5–5 厘米）的空隙总是更好的（Lamp'l, 2018）。\n\n维护土壤纹理以改善排水并防止积水，是种植者在制作高床土壤并填充床时需要记住的另一个重要考虑因素。如果在高床搭建初始阶段忽略排水因素，在雨季节可能会发生严重的排水和积水问题。防止这些问题你可以做的最重要的事情是在土壤混合物中加入大量的有机成分。在这方面，“绿色”物质和“棕色”物质都同样重要，因为它们有助于维持执行分解的细菌和真菌之间的完美平衡。通过最佳分解速率，基质中释放出植物生长所需的充足水分（和营养）。有机质和有机肥的存在还为土壤提供了必要的松散、多孔纹理，使排水保持在所需的水平。你可以做这些来防止这些问题：\n\
  \n* 向土壤中添加有机质。\n* 在床底部使用卵石以保持排水。\n* 在顶部使用覆盖物。\n* 使用木屑防止水分流失。\n\n### 维护与护理\n\n维护土壤纹理以改善排水并防止积水，是种植者在制作高床土壤并填充床时需要记住的另一个重要考虑因素。如果在高床搭建初始阶段忽略排水因素，在雨季节可能会发生严重的排水和积水问题。防止这些问题你可以做的最重要的事情是在土壤混合物中加入大量的有机成分。在这方面，“绿色”物质和“棕色”物质都同样重要，因为它们有助于维持执行分解的细菌和真菌之间的完美平衡。通过最佳分解速率，基质中释放出植物生长所需的充足水分（和营养）。有机质和有机肥的存在还为土壤提供了必要的松散、多孔纹理，使排水保持在所需的水平。\n\
  \n### 浇水与施肥\n\n是否将高床填到顶部的问题也很简单。如果你将床填到顶部，就会让你宝贵的基质暴露在导致侵蚀的力量面前。每当你浇水或下雨时，你都会失去基质的顶层。因此，在高床上至少留出\
  \ 1–2 英寸（≈2.5–5 厘米）的空隙总是更好的（Lamp'l, 2018）。\n\n容器植物需要频繁的关注，浇水环节是必要的。\n\n\n\n\n\n\
  对于高架床土壤，堆肥和有机质就足以保持土壤肥力。在准备高架床土壤时添加的成分足以维持至少一个种植季。然而，我们不能忽视高架床土壤分解率高这一的事实，这会导致土壤水位随着时间的推移而下降。为了维持水位并保持土壤生长茂盛，每年秋季都应添加\
  \ 2–3 英寸（约 5–7.5 厘米）的堆肥作为表肥（《在高架床中施肥的技巧？》，2022 年）。额外的肥料需求严格取决于你种植的植物种类。花期肥可以在花期或果期前施用，但对大多数植物来说，并没有这种要求。\n\
  \n## 处理土壤压实和侵蚀\n\n土壤压实和侵蚀是与容器和高架床土壤相关的两个重要问题。这些问题的主要原因是过度浇水和耕作。高架床土壤有机质的快速流失是导致土壤压实的另一个重要因素。为了有效防止这些问题，可以做些什么？为了防止土壤压实，需要减少在苗床上的活动。在相邻的苗床之间铺设覆盖木屑的小径可以避免这样做。宠物和其他动物不应允许踩在土壤上。裸露土壤容易受到压实侵蚀的影响；因此种植覆盖作物和使用覆盖物是防止这些问题的最佳方法。潮湿土壤也容易压实；因此在潮湿时不应扰动土壤。应避免使用重型机械，而是使用手工工具。如果土壤已经压实，覆盖一层堆肥并用叉子松松可以很大程度上减轻压实。如果土壤压实严重，种植覆盖作物应该解决这一问题。\n\
  \n对于土壤侵蚀，并没有新方法，只需在灌溉期间避免溅水并使用覆盖作物和覆盖物保持土壤覆盖。另一种方法是在容器或高架床的边界放置木屑或石头以防止侵蚀。\n\n#\
  \ 第 5 章：堆肥\n\n我和家人尝试过各种耕作实践来照顾不同类型的土地，但我觉得堆肥是我参与过的最有成就感的活动。让我解释一下原因。在耕作中，你处理土壤、播种、照顾植物并最终收获果实。然而，堆肥是非常不同的。你将通常被视为垃圾的物质转化为极具价值的东西——富含营养的堆肥。对于像我这样热爱可持续土地利用和资源保护的人来说，堆肥是一项深有意义的努力。它是将养分循环回土壤的完美方式，同时也改善环境。\n\
  \n你可能在堆肥是否是一项需要大量经验和技巧的困难任务。事实如此。任何理解堆肥基本原理并了解基础成分的人都可以这样做。事实上，家庭堆肥可以任何人完成。在本章中，我们将涵盖与堆肥相关的一切，包括它的益处、制作方法和应用技术。这将帮助你建立自己的堆肥并满足你的农场需求。\n\
  \n## 什么是堆肥？\n\n韦氏字典（n.d.）将堆肥定义为用于施肥和改良土地的腐有机质混合物，而美国农业部（n.d.-a）将堆肥定义为有机材料转化为改良剂的过程，可以喂土壤和植物以保持健康和生产力。注意，堆肥不仅是指人为辅助的有机成分转化，它是地球上不断发生的自然过程。然而，我们在这里讨论的是人为辅助堆肥，旨在为堆肥微生物提供良好的环境使其以指数级速率生长。\n\
  \n## 堆肥的益处\n\n在深入研究堆肥的操作方法之前，我们首先讨论它的用途和益处。这将帮助你理解堆肥在创建零浪费耕作系统和社区中可以发挥的作用。\n\n###\
  \ 为土壤添加养分\n\n这可能是堆肥最重要的用途。当堆肥加入土壤中时，它会立即提高土壤的阳离子交换能力（`CEC`）。记得我们在第二章中讨论过的 `CEC`；它是媒介保持和交换电荷离子的能力。随着\
  \ `CEC` 的提高，土壤能够更好地保持养分。熟肥为土壤增加了大量的养分。虽然这种含量不如化肥，但堆肥作为土壤的缓释肥，随时间逐渐释放养分。因此，施一次堆肥的效果在\
  \ 6–12 个月后依然可见（美国堆肥委员会，2024）。\n\n### 促进土壤微生物多样性\n\n堆肥通过向土壤中添加富含营养的有机质来实现这一点，土壤微生物以此为食进行生长和繁殖。堆肥中还存在益益土壤微生物和蚯蚓，当加入土壤时，它们会进一步增强微生物多样性。\n\
  \n### 改善土壤密度\n\n合适的土壤密度对于植物生长非常重要。堆肥通过调节土壤质地来实现这一点。如果土壤太紧，堆肥会使其变松；如果土壤太松，堆肥会使土壤结块，从而为根部创造完美的生长环境。\n\
  \n### 防止土壤侵蚀并锁水\n\n堆肥通过结合土壤颗粒来增强土壤抗侵蚀能力。它是通过在土壤中产生一种名为`腐质`的物质实现的。`腐质`是由微生物分解植物动物残体形成的黑色物质。在土壤中，腐质像胶水一样提供结构刚性，使土壤能够抵抗侵蚀。即使作为土壤覆盖，堆肥也能保护表土不被冲走或吹走。\n\
  \n### 抑制害虫、疾病和杂草\n\n经常用堆肥处理的土壤对害虫攻击、土壤疾病和杂草表现出更好的反应。原因很简单：经常受害虫影响的植物是那些经历营养不平衡的植物。由于堆肥有助于解决营养缺乏，这些植物能够更好地抵抗害虫攻击。土壤原土壤土壤土壤消除。对于消除杂草，上述两个因素再次发挥了作用。堆肥纠正了土壤中的营养不平衡，这种不平衡通常有利于杂草生长。此外，经过堆肥处理的土壤温度足以有效抑制杂草生长。\n\
  \n### 减少垃圾\n\n堆肥无疑是将垃圾转化为土壤富含营养的食物的主要技术；更重要的是，它是一种减少垃圾的方法。\n\n\n\n\n当融入农耕系统时，堆肥提供的价值比我们上面讨论的要得多。这可以节省从商业渠道购买堆肥的成本，让你获得无限量的堆肥来供应高架床、盆栽植物和地栽，并有一个高效的系统来处理你在农场或家里产生的所有垃圾。诚实地说，这是一种减少土壤维护成本同时实践可持续性和环境效率的极佳方式。\n\
  \n## 堆肥类型：有氧 vs. 厌氧\n\n在基本的堆肥类型方面，根据产生方法的不同，分为两个不同的类别：有氧堆肥和厌氧堆肥。了解每种类型性质的主要区别以及生产过程中涉及的方法至关重要，因为这可以帮助你决定哪种方法最适合你的农耕系统，且对你最方便。\n\
  \n### 有氧堆肥\n\n“有氧”一词意味着“含氧”，因此有氧堆肥是在氧气存在的情况下制造的。具体来说，参与此堆肥过程的微生物需要氧气来生长和繁殖。因此，在有氧堆中，需要定期翻动和混合堆肥以辅助通气过程。这个过程的好处是不会产生甲烷气。水、二氧化碳和热是该过程的主要副产物。水可以很容易地从系统中排出。至于热量和二氧化碳，关于这两个成分是否环保通常存在争议；但从客观来看，这两个成分都有其用途，特别是当它们放置在农田或附近时。热量消除了可能对未来土壤产生问题的杂草种子和病原体。二氧化碳会被周围的植物迅速吸收用于产生能量的活动。因此，除了需要持续或定期翻动外，有氧堆肥可以被认为是一个没有问题的过程。\n\
  \n以下是有氧堆肥所需的条件：\n\n* 温度在 54 °C 到 65 °C 之间（129.2 °F 到 149 °F）\n* 湿度在 50%–80% 之间\n\
  * 空气填充体积（孔隙率）在 25–35% 之间\n* 富碳材料和富氮材料的适当平衡\n\n### 厌氧堆肥\n\n厌氧（无氧）堆肥是指在没有新鲜空气的情况下，由在这种条件下生存的微生物制的堆肥。与需要定期翻动的有氧堆肥不同，厌氧堆肥即使在低维护条件下也能表现良好。不需要调节温度和水分。你只需要把有机垃圾倒进去，将剩下的工作交给微生物即可。厌氧堆肥的唯一缺点是除了堆肥的其他副产物外还会产生甲烷气。由于由于，厌氧堆不能放置在房屋或其他居住物业附近。\n\
  \n厌氧堆肥需要以下条件：\n\n* 平衡的碳氮比。\n* 密实的盖子或密封容器。\n* 充足的水分以促进分解过程。\n\n让我们对这两种堆肥方法进行快速比较。\n\
  \n| 有氧堆肥 | 厌氧堆肥 |\n| --- | --- |\n| 时间较短，通常需要二到四个月（Hu, 2020）。 | 这是一个缓慢的过程，可能需要几个月到一年才能完成（Vinje,\
  \ n.d.）。 |\n| 更适合家庭堆肥。 | 更适合大规模作业，如农场和食品加工单位。 |\n| 这种堆肥在腐殖质产量方面不太理想，但在环境效率方面更好（不产生甲烷气）。\
  \ | 在腐殖质形成方面更好，但有产生甲烷的缺点。 |\n| 需要定期通气以保持分解者高效工作。 | 可以存放在封闭区域且没有通气要求，最适合没有时间管理堆肥的人。\
  \ |\n\n## 开始堆肥堆\n\n开始建立堆肥堆不需要很多东西，但它确实需要你理解并决定堆肥的三个主要因素。这些因素包括你希望你的堆肥系统是在室内还是室外、它是热的还是凉的，以及你倾向于使用批处理系统还是连续系统。\n\
  \n第一个因素在你选择有氧堆肥还是厌氧堆肥时就了。显然，维持一个进行厌氧分解的室内堆是不可能的。因此，如果你是从厨余垃圾开始，你就必须选择以有氧方式维护的户外堆。\n\
  \n接下来，是热堆肥和冷堆肥之间的选择。热堆肥在水分、温度和通气方面需要更多工作，但它们分解很快。冷堆肥，嗯，它就是冷。你不需要做什么来维持它；它分解也很慢，需要很长时间。\n\
  \n最后，你必须在批处理系统或连续系统之间做出选择。批处理系统是将堆肥材料一次性加入堆中，只有在完成后才取出成品堆肥。完成的堆肥看起来和闻起来非常像深色土壤。它含有高比例的分解者，这些分解者已经彻底消耗了有机并在堆肥堆中完成了它们的寿命。与批处理系统相比，连续系统是持续运行的，你从顶部不断添加新的碎片，并从底部取出成品堆肥。这两个系统之间的选择完全取决于你需要堆肥的频率。如果你需要少量但持续的供应，你可以选择连续堆肥。对于你每隔几个月或每年一次的大批，你可以选择批处理堆肥。\n\
  \n### 使用的材料\n\n一旦你决定了将要使用的堆肥方法，下一个主要问题就是你可以把什么放入堆肥堆中。至关重要的是，虽然任何有机物都是可以分解的，但并非所有的有机材料都是可以堆肥的。以肉类和乳制品为例：它们在堆肥箱内分解得相当快，但你认为它们不会引入病原微生物进入堆中吗？显然会。此外，小型后院堆肥系统的持续时间不够，或者温度不足以充分分解这些材料。患病植物和化学处理过的木材等物品也是如此。这些物品会分解，但会将土壤病原体和剧毒化学品引入堆肥中。因此，任何有机物都可以加入堆肥堆的想法是错误的。有三种可以使用的主要元素：棕色材料、绿色和水。\n\
  \n#### 绿色\n\n绿色指的是植物、草本和灌木的绿色部分，包括割草、鲜叶、植物修剪部分、水果蔬菜垃圾、水果蔬菜皮、茶包和咖啡渣。这些来源为混合物提供氮。\n\
  \n#### 棕色\n\n\n\n\n\n“棕物”（browns）指的是植物的棕色部分，即干燥后变棕色的部分，以及木制品。这些包括树枝、树皮、树干、枯叶、稻草、玉米芯、锯末、纸板和纸。棉花、吸尘器垃圾物和蛋壳也被视为棕物。棕物对堆肥至关重要，因为它们为混合物增加了碳。根据这一标准，动物粪便（如牛、羊、山羊、马、兔子和鸡）也可以被视为棕物。注意，只有这些动物的粪便是可堆肥的。其他动物或人类的粪便不应加入堆肥中。\n\
  \n棕物和“绿物”（greens）对堆肥混合物都同样重要，因为它们共同为执行分解的微生物提供了理想的养分。堆肥的理想棕物与绿物比例为 3:1（Weikel, 2020）。这意味着你添加的棕物量应该是绿物的三倍。这并不是说棕物完全不含氮，它们的碳百分比较高，但仍然含有一些氮，合在一起，混合物中的氮百分比可能会过高。为了平衡这一点，我们添加较多的富碳棕物，以保持混合中适当的碳氮水平。\n\
  \n## 水\n\n水是堆肥堆的关键组成部分，因为它有助于为微生物维持潮湿的环境，使分解在这一环境中快速进行。堆肥堆的内容应该是湿润的，但应该足够湿润以保持堆体湿润。高效堆肥的理想湿度范围是\
  \ 40–60%（Cornell Composting, n.d.）。\n\n## 构建与维护堆肥\n\n根据上述因素，堆肥系统的构建和管理可能会有细微差异；但基本步骤是相同的。让我们来看看这些步骤。\n\
  \n### 绿物和棕物的收集与储存\n\n这一步涉及在物品加入堆肥堆之前，在指定区域收集和储存适合堆肥的物品。其目的是确保所有这些物品保持质量；我们不希望它们在进入堆肥堆之前就开始腐烂。对于绿物，你可以使用封闭容器，将其放在厨房橱柜之一或后院里。如果冰箱有足够的空间，也可以存放在那里。对于棕物，你可以在后院选择一个避风干燥的区域、车库，或温室的指定地点。绿物可以全年收集，但棕物仅在秋季充足。因此，在此期间收集大部分棕物并储存起来以备后用是一个极好的主意。\n\
  \n### 选择堆肥场地\n\n这取决于你决定将堆肥放在哪里。如果是室内堆肥装置，你显然必须选择一个既能保持水分和热量，底部又有排水孔以排出多余液体的堆肥桶。你可以从当地供应商购买堆肥桶，也可以使用木材、铁丝、空心砖或塑料材料自己制作。\n\
  \n对于户外堆肥，你可以选择露天场地或挖掘一个地下堆肥沟。地下堆肥主要适用于农业地区以厌氧堆为首选的大规模堆肥。对于露天堆肥和堆肥桶的户外放置，请确保场地易于到达且排水良好。场地还应远离水源；你不希望堆肥堆流出的流体与你的水源混合。\n\
  \n### 准备堆肥原料\n\n在将原料加入堆体之前，你必须将较大的组件切碎或弄成小块。这一步将确保你加入堆肥堆的所有原料尺寸上大致相等。较小的原料具有更大的表面积，这意味着更多的微生物可以附着在上面并将其分解。这一步对于坚硬的厨房残余和大型棕物（如树枝和细条）非常重要。\n\
  \n### 组件层叠\n\n这是启动堆肥堆最关键的步骤。在开始层叠之前，确保你的绿物和棕物比例为 3:1。正确地层叠这些组件可以确保微生物获得生长和活动所需的所有正确原料——碳、氮和水。\n\
  \n你首先在堆底部放置一层 4–6 英寸（≈10.2–15.2 厘米）厚的棕物。这一层将为堆提供高度，吸收并排出多余液体，并允许空气在堆肥的底层循环。棕物包括树枝、木头。之后，你使用“千层饼法”层叠绿物和棕物，用\
  \ 4–8 英寸（≈10–20 厘米）的锯末、叶子（美国环境保护署，2018）覆盖一切。\n\n## 维护温度和湿度\n\n温度和湿度的维护决定最终产品的两个主要部分。通风对于好氧堆同样重要。对于好氧堆肥的温度调节，你必须依靠频繁的翻堆。你可以使用园叉翻动堆。要测量堆的湿度，你可以使用挤压测试法。在维护良好的堆中，内容物感觉像一块拧干的水的海绵。对于厌氧堆，你不需要混合它们，但你确实需要监测温度和湿度。\n\
  \n### 调整措施\n\n维护堆肥理想条件的一部分部分是及时发现问题迹象并进行调整，以确保堆中的微生物保持活跃和健康。\n\n如果湿度水平较低，请润湿堆体，翻动它，并添加一些含水量高的厨房残余。\n\
  - 如果堆开始产生异味（表明通风不良或水分过量），添加一些棕物（如叶子）并混合堆。\n- 如果堆的温度低于要求，添加一些富氮的组件（绿物），并翻动堆。\n\n\
  对于调整厌氧堆的条件，你可以尝试以下技巧：\n- 如果温度不在理想范围内，添加一些富氮的残余。厌氧堆温度偏低表示压实程度不够，因此添加更多可以消除堆中空气的残余将有助于提高温度。\n\
  - 如果堆闻味变得太难闻，说明水分含量高；添加一些高碳棕物会有帮助。注意，厌氧堆难免会有气味，但如果气味极其刺鼻，那就是出问题的迹象。\n- 如果堆的内容变得粘稠，这是另一个水分过多的迹象；添加干燥的富碳残余可以帮助。\n\
  \n## 收割成品堆肥\n\n你可以通过观察物理特征来判断堆肥何时已完全腐熟并可以使用。完成的堆肥具有\n\n- 温度与周围环境接近。\n- 体积变为原始堆的三分之一。\n\
  - 呈深褐色。\n- 疏松的质地。\n- 类似于森林土壤的泥土味。\n\n\n\n\n然而，如果你注意到堆肥仍然很热，里面含有肉眼可见的碎片，并且闻起来有氨味，那么你必须给它更多时间来发酵。维护良好并经常翻堆的堆肥通常在三到五个月后就能准备就绪（美国环境保护署，2018\
  \ 年）。厌氧堆肥比这需要更长的时间可以使用。\n\n一旦你的堆肥准备好了，你所做的就是把它挖到推车里，并用在任何你需要的地方。然而，我不建议一次性全部取出来，而是建议从顶部和侧面取出一些放在单独的容器中。这是因为上层土壤可能还没有达到足以杀死杂草种子和土壤病原体的温度。如果你将其应用到土壤中，杂草可能会在土壤受到轻微扰动时喷发而出。因此，我建议从堆肥顶部取出薄的一层，并从堆侧面也取少量，加入下一批堆肥中。\n\
  \n你可以对剩余的堆肥进行筛分，以去除那些未能分解或仅部分分解的成分。这包括果核、树枝、蛋壳和塑料（不小心混入其他成分中的）。你可以将可堆肥的物品放回堆肥堆中供下一批使用。\n\
  \n# 在园艺中使用堆肥\n\n在土壤上明智地使用堆肥是另一种重要的土壤管理实践。这个技巧的在于确定可以将多少堆肥用于花园或农场的哪个部分。让我们考虑其中的一些用途。\n\
  \n### 作为改良剂\n\n每当你感到土壤失去活力时，堆肥都可以成为你首选的土壤改良剂。它可以用于改良温室、高畦床、容器花园和地栽土壤。美国环境保护署（2018\
  \ 年）建议在土壤表层 6–9 英（约 15–22 厘米）内施用 2–4 英寸（约 5–10 厘米）的堆肥。\n\n### 作为覆盖物\n\n大多数耕作实践都需要覆盖物，而堆肥可以随处用覆盖物。在需要保持覆盖的土壤中（如高畦床和容器土壤），堆肥是极佳的覆盖物。堆肥还可以添加在高畦床、盆栽植物和大树的边缘，以防止土壤侵蚀并保持水分。即使堆肥尚未完全腐熟并包含一些未分解的碎片，你也可以将其加入土壤，让碎片在原地分解。它们最终会分解，为土壤增加有机质。将堆肥融入土壤的最佳方法是松松表层\
  \ 2–3 英寸（约 5-7 厘米）的土壤，并在其上方铺一层 3 英寸厚（约 7 厘米）的层。\n\n在土壤经常处于荒芜状态的冬季，堆肥可以作为理想的土壤覆盖物。将其加入土壤并让蚯蚓充分混合，将为你在冬末种植下一季作物提供完美的介质。\n\
  \n### 作为生长基质\n\n只要堆肥完全腐熟且不含任何类型的有害介质，它也可以单独作为理想的生长基质。例如，它可以替代泥炭基的盆栽基质，也可用于种植某些室内盆栽植物。\n\
  \n### 堆肥副产物的用途\n\n堆肥并不是你在长达数月的堆肥过程中获得的唯一产品。你还可以从中获得几种其他副产物以及针对它们的许多额外用途。还记得我们在第\
  \ 3 章中讨论过的堆肥茶吗？它们是免耕土壤和容器植物惊人的营养来源。还有一种略有不同的堆肥产品被称为堆肥提取物（compost extract）。它是堆肥茶的快速版本，含有的营养和微生物比堆肥茶少。堆肥提取物还可以用作叶面喷剂和直接施肥，以提高土壤和植物健康。此外，我们还有生物炭（biochar），它是一种在低氧环境下热处理作物残留物而成的煤。生物炭可以应用于土壤以提高肥力、含水量和结构。\n\
  \n堆肥及其所有的副产物都易于制作和应用，但最重要的是，它们是环保的，为农民处理农场经常产生的有机废物提供了一种可持续的方法。然而，学习堆肥技术并在农场中正确实施它们，是确保你充分利用有机废物的关键。\n\
  \n# 第 6 章：常见问题排排除\n\n即使我们以最好的方式处理土壤并照顾它的所有特性，它仍然可能遇到某些问题。原因并不是我们的做法有缺陷，而是因为土壤是一种脆弱的实体，并非存在于真空之中；它被数十种生物和非生物因素所包围。无论我们在土壤管理实践中是多么谨慎，土壤有时也会遇到问题。因此，土壤管理的一部分包括能够识别这些问题并采取措施进行修复。\n\
  \n## 盐碱化\n\n通常来说，土壤盐碱化是指溶解形式存在土壤中的盐含量。通常，这些盐的含量仅对植物生长有益；然而，当这些盐开始在根部积累时，问题就出现了。当水与盐接触时，盐会溶解并在根部积累或被带到土壤表面。这影响了土壤中水分和养分的运动，因此，土壤健康和植物生长受到了影响。\n\
  \n土壤盐分积累的原因有很多，但我们可以将这些原因分为两大大类：自然性盐碱化和人为引起的盐碱化。自然性盐碱化是由以下情况引起的：\n\n- 水渍。\n- 被海水淹没。\n\
  - 被风吹盐覆盖。\n- 受干旱影响。\n\n人为引起的盐碱化原因包括\n\n- 使用盐水灌溉\n- 在缺乏良好排水条件下灌溉\n- 对渗透性土壤过度灌溉\n\
  - 土壤压实\n\n### 症状\n\n土壤可能受盐碱化影响迹象包括\n\n- 土壤压实后结壳\n- 土壤表面出现白壳\n- 雨后仍无法排水的土壤\n- 种子发芽受抑制\n\
  - 水分胁迫的植物\n\n### 你可以采取什么措施？\n\n嗯，保护土壤免受盐碱化广泛影响的最佳方法是专注于促进其结构和质地。质地良好的土壤通常能抵抗盐分的积累。及早发现盐碱化的迹也至关重要。越早处理土壤，完全恢复的可能性就越大。以下是处理受盐碱化影响土壤的措施：\n\
  \n- 向土壤中添加堆肥茶和其他富含有机物的成分，以促进耐盐促生细菌和其他微生物的生长。耐盐微生物是解决盐胁迫和促进植物生最佳解决方案。\n- 使用地表和地下灌溉方法冲洗土壤。这有助于溶解并移除积累在表面的盐分。\n\
  - 免耕实践也有帮助，因为这些做法保护并促进了有益耐盐土壤微生物的生长，并可以改善排水。\n- 在极端情况下，深耕可以帮助。耕作可以增强排水并帮助雨水去除多盐。\n\
  - 将堆肥作为覆盖物可以改善土壤质地的微生物多样性，从而使土壤对盐胁迫更具抵抗力。\n\n## 侵蚀\n\n\n\n\n正如我们之前讨论过的，侵蚀是一种自然过程，由于风和水等力量的作用，表层土不断流失。然而，当这种现象发生在农业地上且达到以前未有的速率时，就会变成一个问题，导致土壤资源的损失。我们在第三章中讨论了我们的农业实践如何导致表层土流失。在这里，让我们关注它最常见的症状和补救。\n\
  \n### 症状\n\n土壤侵蚀可能很难识别，特别是在小块土地和生长区域，但以下迹象有助于早期诊断该问题：\n\n* 原本平整的土壤表面出现沉积物形成\n* 景观变化，包括此前未见的岩石出现\n\
  * 在通常被植被覆盖的区域出现秃斑\n* 溪流和灌溉渠中水变得浑浊\n* 溪流和灌溉渠岸出现裂缝和细细流\n* 土壤表面根系暴露\n\n## 你能做什么？\n\n\
  表层土是任何种植者最宝贵的资源，为了保护它免受侵蚀，以下步骤可以发挥巨大的作用：\n\n* 在非生长季节种植覆盖作物\n* 在易侵蚀的土壤中添加覆盖物\n* 使用绿肥\n\
  * 在斜坡区域和田埂使用椰壳纤维柱和土排。它们由填充有紧实椰壳纤维的管子组成\n* 使用不产生水花飞溅的方法灌溉土壤\n* 经常向土壤中添加堆肥，它可以作为保护垫层\n\
  * 使用免耕法耕作土地\n* 种植成排的植物灌木作为防风林，可以降低风速，从而降低侵蚀概率\n\n## 压实\n\n回想我们关于土壤结构的讨论，在那里我们学习了理想土壤类型的特征。理想的土壤质地是多孔、疏松的，且土壤颗粒比例平衡。压实破坏了这一切，将完全健康的土壤变成坚硬、贫瘠的介质。在健康的土壤样本中，孔隙率约为\
  \ 50–60%；但在压实的土壤中，它减少到大约 30–40%（`Testbook`，2018）。这导致大孔和微孔数量显著减少，而这些孔隙负责空气和水的运动、根部的生长以及为植物和微生物储存水分。\n\
  \n在商业农业中，使用重型机械被认为是土壤压实的主要原因。在小型农业和花园中，重型机械的作用较小，但它仍然是这些问题的主要成因之一。此外，人员活动、过度耕作和不及时的田间作业对导致土壤压实也起着重要作用。\n\
  \n### 症状\n\n土壤压实很容易检测。以下是压实土壤的主要迹象：\n\n* 肿胀和营养不良的根尖\n* 吸水和排水不良（雨后明显明显）\n* 植物生长受阻\n\
  * 叶片发黄\n* 土地上的秃斑（草类在这些区域生长困难）\n* 能够抵抗土壤压实的杂草增加（那些像鱼腥草、马齿草和蓝草之类的杂草）\n\n## 你能做什么？\n\
  \n由于大多数压实源于对重型机械的使用，减少对此类机械的依赖并选择更轻量化的版本是预防和消除这一问题的最佳方法。\n\n减少花床上的人员活动是避免压实的次佳策略。我建议使用石头或碎石创建指定的步行径，并用覆盖物覆盖花园的其他部分，以防止人们踩踏土壤。当不可避免地踩到土壤时，可以使用木板作为临时步行道。你还可以使用带有额外长柄的工具从远处处理土壤。这些工具包括长柄耕锄和除草器。\n\
  \n应始终避免在湿润土壤上作业，并在非生长季节种植覆盖作物，以让土壤恢复其结构并从压实中愈合。以其耕作特性闻名的覆盖作物应种在这种土壤中。最后，经常添加有机质和其他能促进和保护土壤微生物的有机改良剂是避免和处理压实问题的极方法。\n\
  \n\n\n\n| 基础营养元素缺乏（元素氮、磷、钾） | 苜草粉和蚯蚓粪 |\n| :--- | :--- |\n| 氮缺乏 | 尿素、硫酸铵和血蛋白肥 |\n\
  | 钙和微量元素缺乏 | 骨粉 |\n| 铁缺乏 | 螯合铁 |\n| 镁和硫缺乏 | 硫酸镁 |\n| 通用微量元素缺乏 | 鱼粉或鱼粉乳液 |\n\n按计算出的用量施用这些肥料和改良剂可以对处理土壤产生重要作用。在施用之前，需要考虑养分吸收时间和养分流失率等因素，因为我们希望所有这些产品都能被植物根吸收，而不是通过地表径流流失。更重要的是，计算肥料的用量也是必要的，因为我们不希望产生营养毒性，如果施用过量的改良剂就可能发生这种情况。\n\
  \n处理营养毒性并不像处理营养缺乏那样挑战性，因为大多数情况下，过剩的营养会积聚在土壤中，由于土壤自身的化学性质而无法被植物根吸收。然而，有时毒性会通过阻碍植物对特定养分的利用性来产生问题。例如，钾毒性会破坏根部对镁和钙的供应。\n\
  \n长期过量施肥还会改变土壤的 pH 值，从而产生许多土壤问题。为了从根本上避免此类营养毒性，需要仔细决定肥料的施用量和时长。如果由于某种原因产生了毒性，应该用清水冲洗土壤以淋掉过剩的养分。检查灌溉水中是否存在导致问题的养分也同样重要，如果这确实是问题所在，更换水源或在使用前进行过滤可能会有所帮助。此外，在非生长季节种植覆盖作物并实行作物轮作，可以通过多样化养分吸收模式来帮助土壤从营养毒性中恢复。。\n\
  \n## 测试与改善土壤健康\n\n土壤是一个不断变化的实体。表层土始终受到风化力量的影响。它的内部化学性质随着微生物群落的变化而波动，但最重要的是，我们的耕作实践不断改变着它的化学性质和生物学。作为种植者，我们必须承认这些变化，并学习在这些波动的条件下保持土壤肥沃。我深信，解决土壤问题应该是一种主动策略，而非反应性策略；因此，无论规模如何，检查土壤特征都应该是所有农业系统的常规做法。\n\
  \n### 土壤测试方法\n\n查看一些流行的土壤测试方法以及它们在让种植者了解土壤状况方面发挥的作用。记住，土壤 pH 测试（在第 1 章讨论）和矿物质分析（在本章前面已讨论）是确定和维持土壤健康时最重要的两个测试。与这两项测试相比，以下测试非常容易，任何人都可以进行测试并解释其结果。\n\
  \n#### 土壤玻璃瓶法\n\n这可能是最简单的土壤测试了。还记得我们在第 1 章中讨论过的土壤质地吗？这项测试有助于确定这一点。它只需要一个透明的梅森罐、一点洗洁精、一个土壤样本和一些水。通过在罐中混合所有成分并并让其静置\
  \ 24 到 48 小时，土壤颗粒将分离成不同的层。然后，你可以根据每一层的厚度和水的浑浊度来确定土壤的组成成分和质地。\n\n* 如果罐中的水几乎清澈，底部（由沙组成）最厚，那么显然你的土壤是沙质土。\n\
  * 如果罐中的水非常浑浊，且罐底部聚集了两三层薄薄的颗粒，那么你的土壤是粘土。\n* 如果罐中的水清澈，且底部形成了沙、粉土和粘土三个独立的层，那么你的土壤具有壤质质地。\n\
  \n### 土壤显微镜\n\n土壤生物是土壤的英雄，它们将土壤从单纯的泥变成肥沃的活体，这并不是秘密。这些生物、土壤团聚和植物根之间复杂的相互作用最终决定了土壤的生产力。因此，密切关注这些生物对于维持土壤肥力至关重要。\n\
  \n为了分析微生物，需要使用至少 400 倍放大率的显微镜（你可以购买或咨询实验室进行）。从你的花园或农场 2 英寸（≈5 厘米）深处的土壤样本将提供全面的分析。你将观察到四种类型的微生物：细菌、真菌和原生动物。细菌是圆形的实体；真菌是丝状体；原生动物包括缓虫、轮虫和线虫。在健康的土壤中，细菌数量最多（显微片上可以容数百个），真菌和原生动物则偶尔出现。\n\
  \n根据《土壤显微镜简指南 2》 (n.d.)，你可以从显微镜下推断出：\n* 如果细菌数量很高，但它们之间缺乏多样性，说明土壤已耕作多年，需要彻底改良。\n\
  * 如果原生动物数量很高，说明土壤板结且缺氧。\n* 如果缺乏真菌菌丝，说明土壤缺乏有机质。\n* 如果存在所有微生物的混合，则你的土壤非常健康。\n\n###\
  \ 水分可用性测试\n\n这是一个简单的测试，用于确定你的土壤在保持水分和向根部水分方面的表现。这可以帮助你确定植物需水量以及土壤灌溉需求随时间变化的情况。这项测试只需要一场好雨。然后你可以观察土壤保持潮湿多久，以及植物在真正需要浇水之前保持水分多久。你也可以用冰淇淋棍检查土壤水分水平。如果棍看起来很干净，说明土壤失去了大部分水分；如果是脏的，说明含有足够的水。\n\
  \n为了解释这项测试的结果，你需要收集有关你地区正常灌溉需求的知识。如果你觉得你的土壤需要频繁浇水是不正常的，那么你的土壤可能存在问题。土壤孔隙率或质地可能存在某些问题。\n\
  \n\n\n\n\n为了提高土壤微生物多样性，像腐质和堆肥茶这样的土壤改良剂和添加剂是非常有效的，因为它们两者都含有大量的微生物。菌根真菌的应用可以帮助增加土壤中有益真菌。市售的固氮细菌菌剂也可用于解决这个问题。对于水分持水能力较差的土壤，可以混合泥炭苔和混合表层土来增强土壤结构和保水性。堆肥和腐质也是极佳的选择。\n\
  \n在处理这些问题时，你必须记住的是改良剂或肥料的本质。有机和无机解决方案均可提供，但作为负责任的种植者，我们的倾向应该始终偏向有机解决方案。无机改良剂可能廉价且易于获得，但有机方案往往对环境的影响最小，并为土壤带来最大的益处。\n\
  \n# 结论\n\n在照顾各种植物和使用不同形式生长介质的多年经验中，我学到：决定有意义的生产力的并不是照顾土壤的人，而是他们管理土壤的技巧。将土壤视为“泥土”还是将其转化为“黄金”，真正取决于我们的土壤管理实践。\n\
  \n这一切始于理解土壤科学的基础知识，并确定哪种土壤适用于哪种耕作方法。随着每种耕作方法的不同，土壤的需求也会发生，当我们学会理解这些需求时，就能倍提高土壤生产力。我尝试将所有这些教训汇编成这本书，我确认这些知识对于任何新探索耕作和园艺热情的人来说都是充足的。本指南将帮助你理解土壤科学的基础知识，并开启你的第一个栽培项目。我相信，有了这份指南，你将能够保持土壤肥沃，让花朵盛开，并实施可持续实践。\n\
  \n温室土壤虽然受到保护，但仍对某些生物和非生物因素敏感；因此，它们有特殊的维护要求。免耕土壤需要的维护最少，但其初始准备或向免耕系统的转换需要周密的规划和管理。容器和高床土壤的体积有限，使其管理方式与地地栽培实践有所不同。尽管存在这些差异，但有一些耕前和耕后方法，如覆盖、覆盖作物、轮作和\
  \ `IPM`，在所有这些耕作类型中都是通用的。\n\n堆肥是另一种巧妙的方法，可以补充因持续耕作而流失的养分。所有技术在深思熟虑地实施时，都能从长期角度维持土壤健康、肥力及其居民群落的多样性。\n\
  \n我们的耕作实践正在快速进化，为了与最新且更可持续的实践保持同步，我们的学习永远不停止。因此，我鼓励你通过咨询最新的基于研究的资源来继续你的土壤科学学习工作。以下是我为你提高土壤科学和耕作知识提供的五个首要建议：\n\
  \n- 英国土壤科学学会：[`soils.org.uk/education/educational-materials/`](https://soils.org.uk/education/educational-materials/)\n\
  - 密苏根州大学土壤肥力扩展计划：[`landresources.montana.edu/soilfertility/index.html`](https://landresources.montana.edu/soilfertility/index.html)\n\
  - Rodale 学院：[`rodaleinstitute.org/why-organic/farming-practices/composting/`](https://rodaleinstitute.org/why-organic/farming-practices/composting/)\n\
  - SoilNet：[`www.soil-net.com/`](https://www.soil-net.com/)\n- Elaine 博士土壤食物网：[`www.soilfood.com/`](https://www.soilfood.com/)\n\
  \n获取更多资源，你可以查看书末的专业协会和支持小组列表。此外，如果你想探索提供社区互动和认证的教育资源，可以咨询以下机构：\n\n- 美国土壤科学学会 (`SSSA`)\n\
  - Rodale 学院\n- 土壤健康协会 (The Soil Health Institute)\n- 有机耕作基金会 (`OFRF`)\n- 再生有机认证\
  \ (`ROC`)\n\n请注意，我提到这些来源是因为你可能感兴趣了解更多关于土壤科学主题或特定耕作实践，并想了解价值的土壤资源。我不认可其中任何一个，也不期望你从这些链接中进行任何购买。我乐于学习新的和先进的土壤维护实践，并鼓励你分享你对这本书的观点、想法和评论。任何对我改进内容的建议都欢迎。土壤充满了奇迹，为了开启这些奇迹，我们继续学习和升级土壤管理实践至关重要。让我们一起继续这段旅程，保持我们的土壤充满活力。\n\
