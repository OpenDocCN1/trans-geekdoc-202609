  trans: "\n\n关联数组访问：在关联数组中，你使用键来访问和修改元素。例如，`$student[\"age\"]` 检索 John's 年龄，而 `$student[\"\
    age\"] = 21` 将其更新为 21。你还可以向 `$student` 数组添加新元素，如 `$student[\"school\"]`。\n\n访问和修改数组元素使你能够动态地处理数据，从而能够有效地响应用户输入、数据库结果和外部数据源。这些操作对于构建能够高效处理和操作数据的健壮\
    \ PHP 应用至关重要。\n\n## 数组函数：`array_push`、`array_pop` 等\n\nPHP 提供了丰富的内置数组函数，可简化数组操作任务。这些函数使你能够在无需为每个操作编写自定义代码的情况下，向数组中添加、删除、搜索和修改元素。在本节中，我们将探讨一些常用的数组函数，包括\
    \ `array_push`、`array_pop` 等。\n\n```php\n// Creating an array\n\n$fruits = [\"\
    apple\", \"banana\", \"cherry\"];\n\n// Adding elements to the end of an array\n\
    \narray_push($fruits, \"date\", \"fig\");\n\n// Removing and returning the last\
    \ element\n\n$lastFruit = array_pop($fruits);\n\n// Adding elements to the beginning\
    \ of an array\n\narray_unshift($fruits, \"avocado\", \"blueberry\");\n\n// Removing\
    \ and returning the first element\n\n$firstFruit = array_shift($fruits);\n\n//\
    \ Checking if an element exists in an array\n\n$containsBanana = in_array(\"banana\"\
    , $fruits);\n\n// Finding the position of an element in an array\n\n$positionOfCherry\
    \ = array_search(\"cherry\", $fruits);\n```\n\n添加元素：`array_push` 将一个或多个元素添加到数组的末尾，而\
    \ `array_unshift` 将元素添加到开头。\n\n删除元素：`array_pop` 删除并返回数组的最后一个元素，而 `array_shift`\
    \ 删除并返回第一个元素。\n\n搜索元素：`in_array` 检查特定元素是否存在于数组中，而 `array_search` 查找元素的位置（索引）。\n\
    \n这些数组函数简化了数组操作任务，使你的代码更简洁、更易读。它们在处理来自用户输入、数据库或 API 等来源的动态数据时特别有用。熟悉这些函数使你能够高效地处理数组，并在\
    \ PHP 应用中处理各种数据操作场景。\n\n## 多维数组和数组操作\n\n在 PHP 中，多维数组是数组中的数组，允许你表示表格、矩阵和嵌套信息等复杂数据结构。本节探讨多维数组以及用于高效操作和提取数据的各种数组操作。\n\
    \n```php\n// Creating a multidimensional array\n\n$studentScores = [\n\n[\"John\"\
    , 85, 90],\n\n[\"Alice\", 92, 88],\n\n[\"Bob\", 78, 95]\n\n];\n\n// Accessing\
    \ elements in a multidimensional array\n\n$aliceMathScore = $studentScores[1][1];\
    \ // 92\n\n$bobEnglishScore = $studentScores[2][2]; // 95\n\n// Modifying elements\
    \ in a multidimensional array\n\n$studentScores[0][2] = 88; // John's third score\
    \ is updated\n\n// Adding a new student's scores\n\n$newStudent = [\"Eva\", 89,\
    \ 93];\n\narray_push($studentScores, $newStudent);\n\n// Calculating the average\
    \ score for each student\n\n$averages = [];\n\nforeach ($studentScores as $student)\
    \ {\n\n$average = array_sum(array_slice($student, 1)) / (count($student) - 1);\n\
    \n$averages[] = [$student[0], $average];\n\n}\n```\n\n创建多维数组：多维数组是通过在彼此内部嵌套数组创建的。在示例中，`$studentScores`\
    \ 存储学生姓名及其考试成绩。\n\n访问元素：你通过提供外部和内部索引来访问多维数组中的元素。例如，`$studentScores[1][1]` 检索 Alice\
    \ 的数学成绩。\n\n修改元素：多维数组中的元素可以像一维数组一样进行修改。\n\n添加数据：可以使用 `array_push` 等函数向多维数组添加新数据。在此例中，我们将\
    \ Eva 的成绩添加到数组中。\n\n执行数组操作：数组操作也可以应用于多维数组。在示例中，我们计算每个学生的平均成绩并将其存储在 `$averages`\
    \ 数组中。\n\n理解多维数组和数组操作在处理结构化数据时至关重要，尤其是在数据需要分层组织或处理数据库中的表格数据时。这些技能使你能够在 PHP 应用中有效地处理复杂数据结构。\n\
    \nModule 8:\n\n| \nIntroduction to Object-Oriented Programming in PHP\n |\n\n\
    | --- |\nElevating Your Code to New Heights With OOP\n\n在课程“PHP 编程”中，模块“PHP 面向对象编程（OOP）入门”代表了你成为多面手\
    \ PHP 开发者之旅中的重大飞跃。本模块向你介绍 OOP 这一强大的范式，它是现代软件工程的基石，并为你提供创建健壮、可维护和可扩展 PHP 应用的工具。\n\
    \n编程范式的演变\n\n面向对象编程（OOP）是一种强调模块化、可重用性和代码结构化组织的软件开发革命性方法。在本模块中，你将进入 OOP 的世界并理解核心原则，如类、对象、封装、继承和多态。这些概念对于构建复杂但可维护的应用至关重要。\n\
    \n构建类和对象\n\nOOP 的核心在于创建类和对象。你将探索如何设计类以封装数据和行为，以及如何从这些蓝图创建对象。这使你能够模拟现实世界实体、抽象复杂功能，并为更易于管理和扩展的代码奠定基础。\n\
    \n实现代码可重用性\n\nOOP 最大的优势之一是代码可重用性。你将学习如何通过开发可重用和可扩展的组件来利用这种能力。通过继承和接口，你将能够创建促进代码共享和适应性的类层次结构。\n\
    \n提升你的开发技能\n\n当你开始本模块时，你将深入了解 PHP 中 OOP 的范式转变世界。“PHP 面向对象编程入门”作为你开发不仅功能齐全而且优雅且可扩展的代码的门户。加入我们这次变革性的旅程，提升你的\
    \ PHP 开发技能，创建在可维护性、可扩展性和适应性方面表现出色的应用。\n\n## 理解面向对象概念\n\n面向对象编程（OOP）是一种为软件开发带来结构化和模块化方法的编程范式。在\
    \ PHP 中，OOP 是构建可扩展、可维护和有组织的代码的强大工具。本节介绍 PHP 中的基本 OOP 概念并解释其应用方式。\n\n```php\n//\
    \ Creating a class definition in PHP\n\nclass Car {\n\n// Properties (attributes)\n\
    \npublic $brand;\n\npublic $model;\n\npublic $year;\n\n// Methods (functions)\n\
    \npublic function start() {\n\necho \"The car is starting.\";\n\n}\n\npublic function\
    \ drive() {\n\necho \"The car is in motion.\";\n\n}\n\n}\n\n// Creating objects\
    \ (instances) of the class\n\n$car1 = new Car();\n\n$car2 = new Car();\n\n// Accessing\
    \ object properties and calling methods\n\n$car1->brand = \"Toyota\";\n\n$car1->model\
    \ = \"Camry\";\n\n$car1->year = 2022;\n\n$car2->brand = \"Honda\";\n\n$car2->model\
    \ = \"Civic\";\n\n$car2->year = 2023;\n\n$car1->start();\n\n$car2->drive();\n\
    ```\n\n1. 类定义：在 PHP 中，`class` 是创建对象的蓝图。它定义了属性（属性）和方法（函数），封装了对象的行为。在示例中，`Car` 类表示具有\
    \ `brand`、`model` 和 `year` 等属性以及 `start` 和 `drive` 等方法的汽车。\n\n"
