- raw: "Associative Array Access: In associative arrays, you use keys to access and\
    \ modify elements. For instance, $student\\[\"age\"\\] retrieves John's age, and\
    \ $student\\[\"age\"\\] = 21 updates it to 21. You can also add new elements like\
    \ $student\\[\"school\"\\] to the $student array.\n\nAccessing and modifying array\
    \ elements enable you to work with data dynamically, making it possible to respond\
    \ to user inputs, database results, and external data sources effectively. These\
    \ operations are fundamental for building robust PHP applications that handle\
    \ and manipulate data efficiently.\n\n## Array Functions: array\\_push, array\\\
    _pop, etc.\n\nPHP provides a wealth of built-in array functions that simplify\
    \ array manipulation tasks. These functions enable you to add, remove, search,\
    \ and modify elements within arrays without having to write custom code for each\
    \ operation. In this section, we'll explore some commonly used array functions,\
    \ including array\\_push, array\\_pop, and others.\n\n<?php\n\n// Creating an\
    \ array\n\n$fruits = \\[\"apple\", \"banana\", \"cherry\"\\];\n\n// Adding elements\
    \ to the end of an array\n\narray\\_push($fruits, \"date\", \"fig\");\n\n// Removing\
    \ and returning the last element\n\n$lastFruit = array\\_pop($fruits);\n\n// Adding\
    \ elements to the beginning of an array\n\narray\\_unshift($fruits, \"avocado\"\
    , \"blueberry\");\n\n// Removing and returning the first element\n\n$firstFruit\
    \ = array\\_shift($fruits);\n\n// Checking if an element exists in an array\n\n\
    $containsBanana = in\\_array(\"banana\", $fruits);\n\n// Finding the position\
    \ of an element in an array\n\n$positionOfCherry = array\\_search(\"cherry\",\
    \ $fruits);\n\n?>\n\nAdding Elements: array\\_push adds one or more elements to\
    \ the end of an array, while array\\_unshift adds elements to the beginning.\n\
    \nRemoving Elements: array\\_pop removes and returns the last element of an array,\
    \ and array\\_shift removes and returns the first element.\n\nSearching Elements:\
    \ in\\_array checks if a specific element exists in an array, and array\\_search\
    \ finds the position (index) of an element.\n\nThese array functions streamline\
    \ array manipulation tasks, making your code more concise and readable. They are\
    \ particularly useful when dealing with dynamic data from sources like user inputs,\
    \ databases, or APIs. Familiarizing yourself with these functions empowers you\
    \ to work efficiently with arrays and handle various data manipulation scenarios\
    \ in PHP applications.\n\n## Multidimensional Arrays and Array Operations\n\n\
    In PHP, multidimensional arrays are arrays within arrays, allowing you to represent\
    \ complex data structures such as tables, matrices, and nested information. This\
    \ section explores multidimensional arrays and various array operations to manipulate\
    \ and extract data efficiently.\n\n<?php\n\n// Creating a multidimensional array\n\
    \n$studentScores = \\[\n\n\\[\"John\", 85, 90\\],\n\n\\[\"Alice\", 92, 88\\],\n\
    \n\\[\"Bob\", 78, 95\\]\n\n\\];\n\n// Accessing elements in a multidimensional\
    \ array\n\n$aliceMathScore = $studentScores\\[1\\]\\[1\\]; // 92\n\n$bobEnglishScore\
    \ = $studentScores\\[2\\]\\[2\\]; // 95\n\n// Modifying elements in a multidimensional\
    \ array\n\n$studentScores\\[0\\]\\[2\\] = 88; // John's third score is updated\n\
    \n// Adding a new student's scores\n\n$newStudent = \\[\"Eva\", 89, 93\\];\n\n\
    array\\_push($studentScores, $newStudent);\n\n// Calculating the average score\
    \ for each student\n\n$averages = \\[\\];\n\nforeach ($studentScores as $student)\
    \ {\n\n$average = array\\_sum(array\\_slice($student, 1)) / (count($student) -\
    \ 1);\n\n$averages\\[\\] = \\[$student\\[0\\], $average\\];\n\n}\n\n?>\n\nCreating\
    \ Multidimensional Arrays: Multidimensional arrays are created by nesting arrays\
    \ within each other. In the example, $studentScores stores student names and their\
    \ test scores.\n\nAccessing Elements: You access elements in a multidimensional\
    \ array by providing both the outer and inner indices. For instance, $studentScores\\\
    [1\\]\\[1\\] retrieves Alice's math score.\n\nModifying Elements: Elements within\
    \ a multidimensional array can be modified just like in one-dimensional arrays.\n\
    \nAdding Data: New data can be added to a multidimensional array using functions\
    \ like array\\_push. In this case, we added Eva's scores to the array.\n\nPerforming\
    \ Array Operations: Array operations can be applied to multidimensional arrays\
    \ as well. In the example, we calculate the average score for each student and\
    \ store it in the $averages array.\n\nUnderstanding multidimensional arrays and\
    \ array operations is crucial when working with structured data, especially in\
    \ scenarios where data needs to be organized hierarchically or when dealing with\
    \ tabular data in databases. These skills empower you to handle complex data structures\
    \ effectively in PHP applications.\n\n.\n\nModule 8:\n\n| \n\nIntroduction to\
    \ Object-Oriented Programming in PHP\n\n |\n\n| --- |\n\nElevating Your Code to\
    \ New Heights With OOP\n\nIn the course \"Programming with PHP,\" the module \"\
    Introduction to Object-Oriented Programming (OOP) in PHP\" represents a significant\
    \ leap forward in your journey towards becoming a versatile PHP developer. This\
    \ module introduces you to the powerful paradigm of OOP, a cornerstone of modern\
    \ software engineering, and equips you with the tools to create robust, maintainable,\
    \ and scalable PHP applications.\n\nThe Evolution of Programming Paradigms\n\n\
    Object-Oriented Programming (OOP) is a revolutionary approach to software development\
    \ that emphasizes modularity, reusability, and a structured organization of code.\
    \ In this module, you'll step into the world of OOP and understand the core principles,\
    \ such as classes, objects, encapsulation, inheritance, and polymorphism. These\
    \ concepts are pivotal for building complex, yet maintainable, applications.\n\
    \nBuilding Classes and Objects\n\nThe heart of OOP lies in the creation of classes\
    \ and objects. You'll explore how to design classes to encapsulate data and behavior,\
    \ and how to create objects from these blueprints. This enables you to model real-world\
    \ entities, abstract complex functionalities, and create a foundation for code\
    \ that is easier to manage and extend.\n\nAchieving Code Reusability\n\nOne of\
    \ OOP's greatest strengths is code reusability. You'll learn how to harness this\
    \ power by developing reusable and extendable components. With inheritance and\
    \ interfaces, you'll be able to create hierarchies of classes that promote code\
    \ sharing and adaptability.\n\nElevating Your Development Skills\n\nAs you embark\
    \ on this module, you'll gain insights into the paradigm-shifting world of OOP\
    \ in PHP. \"Introduction to Object-Oriented Programming in PHP\" serves as your\
    \ gateway to developing code that is not only functional but also elegant and\
    \ scalable. Join us on this transformative journey to elevate your PHP development\
    \ skills and create applications that excel in maintainability, scalability, and\
    \ adaptability.\n\n## Understanding Object-Oriented Concepts\n\nObject-oriented\
    \ programming (OOP) is a programming paradigm that brings a structured and modular\
    \ approach to software development. In PHP, OOP is a powerful tool for building\
    \ scalable, maintainable, and organized code. This section introduces fundamental\
    \ OOP concepts in PHP and explains how they are applied.\n\n// Creating a class\
    \ definition in PHP\n\nclass Car {\n\n// Properties (attributes)\n\npublic $brand;\n\
    \npublic $model;\n\npublic $year;\n\n// Methods (functions)\n\npublic function\
    \ start() {\n\necho \"The car is starting.\";\n\n}\n\npublic function drive()\
    \ {\n\necho \"The car is in motion.\";\n\n}\n\n}\n\n// Creating objects (instances)\
    \ of the class\n\n$car1 = new Car();\n\n$car2 = new Car();\n\n// Accessing object\
    \ properties and calling methods\n\n$car1->brand = \"Toyota\";\n\n$car1->model\
    \ = \"Camry\";\n\n$car1->year = 2022;\n\n$car2->brand = \"Honda\";\n\n$car2->model\
    \ = \"Civic\";\n\n$car2->year = 2023;\n\n$car1->start();\n\n$car2->drive();\n\n\
    1.  Class Definition: In PHP, a class is a blueprint for creating objects. It\
    \ defines properties (attributes) and methods (functions) that encapsulate the\
    \ behavior of objects. In the example, the Car class represents cars with properties\
    \ like brand, model, and year, as well as methods like start and drive."
