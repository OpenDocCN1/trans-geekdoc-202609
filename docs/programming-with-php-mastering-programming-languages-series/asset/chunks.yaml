    ## Iterating Over Arrays and Collections


    Arrays and collections are fundamental data structures in PHP used to store and
    manage sets of data. To work effectively with these data structures, you need
    to understand how to iterate over them using loops. This section explores techniques
    for looping through arrays and collections, enabling you to access and manipulate
    their elements.


    ```php

    <?php


    // Iterating over a numeric array


    $numbers = [1, 2, 3, 4, 5];


    foreach ($numbers as $number) {


    echo $number . " ";


    }


    // Output: 1 2 3 4 5


    // Iterating over an associative array


    $student = [


    "name" => "John",


    "age" => 20,


    "grade" => "A"


    ];


    foreach ($student as $key => $value) {


    echo "$key: $value ";


    }


    // Output: name: John age: 20 grade: A


    ?>

    ```


    Numeric Arrays: You can iterate over numeric arrays using a `foreach` loop. In
    each iteration, the loop assigns the current array element to a variable (in this
    case, `$number`), allowing you to process or display it.


    Associative Arrays: Associative arrays use key-value pairs. When iterating over
    them, you can access both keys and values. In the example, the `$key` variable
    represents the array key (e.g., `"name"`), and the `$value` variable represents
    the corresponding value (e.g., `"John"`).


    Collections: Collections, often used in frameworks like Laravel, provide advanced
    iteration methods like `map`, `filter`, and `reduce` for complex data manipulation.
    These methods offer powerful ways to iterate and transform data efficiently.


    Understanding how to iterate over arrays and collections is essential for working
    with dynamic data, such as user inputs, database results, and API responses. It
    enables you to extract, process, and present data effectively in your PHP applications,
    making them more versatile and responsive to user needs.


