    *Encapsulation*: Constructors can encapsulate complex initialization processes,
    making it easier to modify or extend the class''s behavior without affecting the
    way objects are created.


    Constructors are an integral part of object creation in PHP. They ensure that
    objects are properly initialized, consistent, and maintainable. By following best
    practices for constructors, you can enhance the usability and reliability of your
    PHP classes and applications.


    # Module 11


    ## Class Relationships and Inheritance in PHP


    ### Expanding Your Object-Oriented Toolbox With Class Relationships and Inheritance


    In the course "Programming with PHP," the module "Class Relationships and Inheritance
    in PHP" represents a significant leap forward in your journey to becoming a proficient
    PHP developer. This module immerses you in the world of class relationships and
    inheritance, two of the fundamental concepts in object-oriented programming (OOP).
    It equips you with the skills to create complex, yet maintainable, PHP applications.


    ### The Dynamics of Class Relationships


    Class relationships form the backbone of OOP, allowing you to model how objects
    interact and collaborate. In this module, you''ll explore various types of class
    relationships, such as associations, aggregations, and compositions. Understanding
    these relationships is pivotal for designing classes that work together seamlessly
    and reflect real-world connections.


    ### Unlocking the Power of Inheritance


    Inheritance is a powerful concept in OOP, enabling you to create new classes based
    on existing ones. You''ll delve into the art of class inheritance, learning how
    to derive new classes from parent classes, inherit properties and methods, and
    override or extend functionality. Inheritance empowers you to build class hierarchies
    that promote code reuse and organization.


    ### Crafting Complex and Maintainable Applications


    Class relationships and inheritance are your tools for designing elegant, maintainable,
    and adaptable code. By mastering these concepts, you''ll be able to create PHP
    applications that efficiently model real-world scenarios, promote code reuse,
    and foster a structured approach to development.


    ### Elevating Your Object-Oriented Expertise


    As you embark on this module, you''ll gain a profound understanding of class relationships
    and inheritance in PHP, essential elements for mastering OOP. "Class Relationships
    and Inheritance in PHP" serves as your gateway to designing flexible, scalable,
    and maintainable code. Join us on this transformative journey to enhance your
    PHP development skills and create applications that excel in object-oriented design
    and organization.


    ## Understanding Inheritance in PHP


    Inheritance is a fundamental concept in object-oriented programming (OOP) that
    allows one class to inherit the properties and methods of another class. PHP supports
    inheritance, making it easier to create hierarchies of related classes and reuse
    code effectively. This section explores the concept of inheritance in PHP and
    its significance.


    ```

    class Animal {

    public $species;

    public function speak() {

    echo "Animal speaks.";

    }

    }

    class Dog extends Animal {

    public function speak() {

    echo "Woof!";

    }

    }

    ```


    Base and Derived Classes: In PHP, a class that inherits from another class is
    called a derived class, while the class being inherited from is the base class.
    In the example, `Animal` is the base class, and `Dog` is the derived class.


    Method Overriding: Derived classes can override methods inherited from the base
    class. In this case, the `speak` method in the `Dog` class overrides the `speak`
    method from the `Animal` class, allowing the `Dog` class to provide its own implementation.


    Access to Properties: Derived classes can also access public and protected properties
    and methods of the base class.


    Inheritance is a powerful mechanism for creating class hierarchies and organizing
    code in a structured manner. It promotes code reuse, reduces redundancy, and allows
    you to model real-world relationships effectively. By understanding inheritance
    in PHP, you can build more efficient and maintainable applications.


    ## Creating Subclasses and Superclasses


    In object-oriented programming (OOP), creating subclasses and superclasses is
    a powerful technique that enables code reuse, abstraction, and the modeling of
    hierarchical relationships. In PHP, you can establish these relationships to build
    more organized and maintainable applications.


    ```

    class Shape {

    public $name;

    public function __construct($name) {

    $this->name = $name;

    }

    public function describe() {

    echo "I am a {$this->name}.";

    }

    }

    class Circle extends Shape {

    public $radius;

    public function __construct($name, $radius) {

    parent::__construct($name);

    $this->radius = $radius;

    }

    public function area() {

    return 3.14 * $this->radius * $this->radius;

    }

    }

    ```


    Superclass and Subclass: In this example, `Shape` is the superclass (or base class),
    and `Circle` is the subclass (or derived class). The `Circle` class inherits the
    properties and methods of the `Shape` class.


    Constructor Chaining: To ensure that both the subclass and superclass constructors
    are executed, the `Circle` constructor uses `parent::__construct($name)` to call
    the constructor of the `Shape` class.


    Method Overriding: The `describe` method is overridden in the `Circle` class to
    provide a specific description for circles. This is an example of method overriding.


    By creating subclasses and superclasses, you can model relationships between objects
    and efficiently reuse code. Subclasses inherit common properties and behaviors
    from their superclasses while adding specialized functionality. This hierarchical
    approach to OOP in PHP enhances code organization and maintainability, making
    it easier to develop and maintain complex applications.


    ## Method Overriding and Polymorphism


    Method overriding and polymorphism are advanced object-oriented programming concepts
    that allow you to create flexible and extensible code by redefining methods in
    subclasses and enabling objects of different classes to be treated uniformly.
    These concepts are key to harnessing the full power of inheritance in PHP.


    ```

    class Animal {

    public function speak() {

    echo "Animal speaks.";

    }

    }

    class Dog extends Animal {

    public function speak() {

    echo "Woof!";

    }

    }

    class Cat extends Animal {

    public function speak() {

    echo "Meow!";

    }

    }

    // Polymorphism in action

    $animals = [new Dog(), new Cat()];

    foreach ($animals as $animal) {

    $animal->speak(); // Calls the appropriate speak method for each object

    }

    ```


    Method Overriding: In the example, both the `Dog` and `Cat` classes inherit the
    `speak` method from the `Animal` class, but they override it with their own implementations.
    This allows each subclass to define how they speak while maintaining a common
    method name.


    Polymorphism: Polymorphism enables objects of different classes to be treated
    as instances of a common base class. In the loop, `$animals` is an array containing
    both `Dog` and `Cat` objects. Despite their different types, the loop can call
    the `speak` method on each object, and the appropriate method is executed based
    on the object''s actual class.


    Polymorphism and method overriding enhance code flexibility, extensibility, and
    maintainability in PHP. By designing classes to leverage these concepts, you can
    build more dynamic and adaptable software that accommodates changes and additions
    in a graceful and efficient manner.


    ## Using parent Keyword and Constructors in Inheritance


    Inheritance in PHP allows you to create hierarchies of classes, where a subclass
    inherits properties and methods from a superclass. When working with constructors
    in an inheritance hierarchy, it''s essential to understand how to use the `parent`
    keyword effectively to ensure that both the superclass and subclass constructors
    are executed correctly.


    ```

    class Animal {

    public $species;

    public function __construct($species) {

    $this->species = $species;

    echo "A new {$this->species} is created.";

    }

    }

    ```

