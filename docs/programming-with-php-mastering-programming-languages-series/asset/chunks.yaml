    ## Creating Objects


    Objects (instances) of a class are created using the `new` keyword. In the example,
    `$car1` and `$car2` are instances of the `Car` class.


    ## Accessing Properties and Methods


    Properties are accessed using the arrow operator `->`, and methods are called
    in a similar manner. This allows you to work with object-specific data and behaviors.


    Understanding OOP concepts like classes, objects, encapsulation, and inheritance
    is pivotal in PHP development. OOP promotes code reusability, maintainability,
    and separation of concerns, making it an indispensable technique for building
    complex and scalable PHP applications.


    ## Creating Classes and Objects in PHP


    In PHP, classes are the building blocks of object-oriented programming (OOP).
    They provide a blueprint for creating objects, which encapsulate data and behavior.
    Understanding how to create classes and instantiate objects is fundamental to
    harnessing the power of OOP in PHP.


    ```php

    // Creating a class definition in PHP


    class Student {


    // Properties (attributes)


    public $name;


    public $age;


    // Constructor method


    public function __construct($name, $age) {


    $this->name = $name;


    $this->age = $age;


    }


    // Method (function)


    public function introduce() {


    echo "My name is {$this->name} and I am {$this->age} years old.";


    }


    }

    ```


    ```php

    // Creating objects (instances) of the class


    $student1 = new Student("Alice", 20);


    $student2 = new Student("Bob", 22);


    // Accessing object properties and calling methods


    echo $student1->name; // Output: Alice


    $student2->introduce(); // Output: My name is Bob and I am 22 years old.

    ```


    ### Class Definition

    A class in PHP defines the structure and behavior of objects. In this example,
    the `Student` class has properties (`name` and `age`), a constructor method (`__construct`),
    and a custom method (`introduce`).


    ### Constructor Method

    The constructor method is a special method that gets executed when an object is
    created. It initializes object properties. In this case, it sets the `name` and
    `age` properties when a `Student` object is instantiated.


    ### Creating Objects

    Objects are instances of classes. Using the `new` keyword, you can create multiple
    objects based on the same class.


    ### Accessing Properties and Methods

    Object properties and methods are accessed using the arrow operator (`->`). This
    allows you to manipulate object-specific data and behavior.


    Creating classes and objects is the foundation of object-oriented programming
    in PHP. It enables you to model real-world entities and build modular, maintainable,
    and organized code. Understanding these concepts is essential for developing scalable
    and robust PHP applications.


    ## Defining Methods and Properties in Classes


    In object-oriented programming (OOP), classes serve as blueprints for creating
    objects. Within these classes, you define properties (attributes) and methods
    (functions) that encapsulate an object''s data and behavior. Understanding how
    to define methods and properties in PHP classes is pivotal for building modular
    and organized code.


    ```php

    // Creating a class definition in PHP


    class Product {


    // Properties (attributes)


    public $name;


    public $price;


    // Constructor method


    public function __construct($name, $price) {


    $this->name = $name;


    $this->price = $price;


    }


    // Method (function)


    public function displayInfo() {


    echo "Product: {$this->name}, Price: {$this->price} USD";


    }


    }

    ```


    ```php

    // Creating an object of the class


    $product1 = new Product("Laptop", 899);


    $product2 = new Product("Smartphone", 499);


    // Accessing object properties and calling methods


    echo $product1->name; // Output: Laptop


    $product2->displayInfo(); // Output: Product: Smartphone, Price: 499 USD

    ```


    ### Properties (Attributes)

    Properties are variables declared within a class and represent an object''s data.
    In this example, the `Product` class has properties like `name` and `price` to
    store product information.


    ### Constructor Method

    The constructor method (`__construct`) is a special method that gets called when
    an object is created. It initializes object properties with values passed as arguments
    during object instantiation.


    ### Methods (Functions)

    Methods define an object''s behavior or actions. The `displayInfo` method in this
    class displays product information.


    ### Creating Objects

    Objects of the class are created using the `new` keyword. Each object has its
    own set of properties and can execute class methods.


    Defining methods and properties in classes allows you to create reusable, organized,
    and structured code. OOP principles like encapsulation and abstraction become
    more apparent when you define methods to manipulate properties, making your code
    more modular and maintainable.


    ## Encapsulation and Information Hiding


    Encapsulation is one of the fundamental principles of object-oriented programming
    (OOP) that promotes the concept of information hiding. It involves bundling data
    (properties) and methods (functions) that operate on that data within a class.
    This encapsulated unit is often referred to as a "class."


    ```php

    // Creating a class definition with encapsulation


    class Student {


    // Properties (attributes)


    private $name;


    private $age;


    // Constructor method


    public function __construct($name, $age) {


    $this->name = $name;


    $this->age = $age;


    }


    // Getter method for name


    public function getName() {


    return $this->name;


    }


    // Setter method for age


    public function setAge($newAge) {


    if ($newAge >= 0) {


    $this->age = $newAge;


    }


    }


    }

    ```


    ```php

    // Creating an object of the class


    $student1 = new Student("Alice", 20);


    // Accessing properties using getter method


    echo $student1->getName(); // Output: Alice


    // Modifying properties using setter method


    $student1->setAge(21);

    ```


    ### Encapsulation

    In this example, encapsulation is achieved by declaring properties (`$name` and
    `$age`) as `private`. Private properties can only be accessed and modified within
    the class itself. This hides the internal implementation details from external
    code.


    ### Getter and Setter Methods

    Getter methods like `getName` allow controlled access to private properties, providing
    read-only access to the `name` property. Setter methods like `setAge` enable controlled
    modification of properties, allowing validation and logic before updating the
    `age` property.


    Encapsulation and information hiding enhance code security, maintainability, and
    flexibility. By encapsulating data and providing controlled access through methods,
    you can ensure that the internal state of an object remains consistent and valid,
    reducing the risk of unintended modifications and errors in your PHP applications.


    ## Module 9


    | Methods and Function Definitions in PHP |

    | --- |

    | Unlocking the Power of Reusable Code |


    In the course "Programming with PHP," the module "Methods and Function Definitions
    in PHP" represents a critical milestone in your journey to becoming a proficient
    PHP developer. This module delves deep into the world of methods and functions,
    empowering you to create efficient, modular, and reusable code in your PHP applications.


    ### The Role of Functions


    Functions are the building blocks of structured and organized code in PHP. This
    module guides you through the essential concepts of defining, declaring, and utilizing
    functions to encapsulate logic. Functions allow you to compartmentalize your code,
    making it more readable, maintainable, and easily reusable across your projects.


    ### Understanding Methodology


    In addition to functions, you''ll explore methods within the context of object-oriented
    programming (OOP). Methods are functions that are associated with objects, allowing
    you to define behaviors and actions that are specific to particular classes. This
    module introduces you to both static and instance methods, enabling you to manipulate
    data and objects efficiently.


    ### Enhancing Code Reusability

