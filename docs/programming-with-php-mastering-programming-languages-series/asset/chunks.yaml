    ease of use in web service design. It relies on stateless communication, meaning
    each request from a client to a server must contain all the information necessary
    to understand and process the request.


    ```

    // Stateless Request Example

    GET /api/users/123 HTTP/1.1

    Host: api.example.com

    ```


    ### Resource-Centric Design


    In REST, resources are central entities that represent the data or objects you
    want to manipulate. Resources are identified by URIs (Uniform Resource Identifiers)
    and manipulated using standard HTTP methods like `GET` (for retrieval), `POST`
    (for creation), `PUT` (for update), and `DELETE` (for removal).


    ```

    // Resource Manipulation Example

    GET /api/users/123

    POST /api/users

    PUT /api/users/123

    DELETE /api/users/123

    ```


    ### Statelessness


    RESTful services are stateless, meaning each request is independent and doesn''t
    rely on previous requests. This makes them highly scalable and reduces server-side
    complexity.


