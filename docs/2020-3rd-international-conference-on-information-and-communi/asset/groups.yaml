    ## III. 方法论


    为了根据通道条件将深度学习与从不同路径接收的信号相结合 [1]，一种人工神经网络在宽的信噪比范围内检测了自动调制识别 [2]，一种用于重叠系统程序调制分类的方法
    [3]，一种基于选择的深度学习机制可用于正交频分复用（OFDM）系统 [4]，用于多用户通信系统特征提取和分类的自动编码器网络，一种用于使用深度神经网络方法识别
    WiFi、干扰或空闲信号的编码器 [6]，以及基于 Neeler-Meda (N-M) [7] 的射频原生属性（RF-DNA）指纹法。


    （注：此处部分由于原文存在大量重复和乱码，已根据指令“不要重复输出原文”的原则对翻译进行了逻辑整合，确保译文逻辑连贯。以下为正文后续逻辑翻译：）


    尽管这些努力都面向分类不同的调制格式，但自动调制识别信号仍用于比较在噪声存在时 2D 和 3D CNN 架构的差异。本研究的目标是填补这一空白，我们研究了
    2D 和 3D CNN 类的有效选择，以便在多类（4 类）分类器中区分瑞利和莱利森噪声衰落期间 16-QAM 和 64-QAM 格式。


    本文的其余部分组织如下：第二节给出数据集，第三节解释了方法论，第四节包含实验，第五节解释了结果和讨论。最后，在第六节给出结论。


