    # 基于深度学习方法在瑞利和莱利森噪声下的调制格式多类分类


    Rahim Khan¹, Yang Qiang¹, Afgan Bin Tufail², and Alam Noor


    ^¹中国哈尔滨工业学院 Hardin 电子与信息工程学院，哈尔滨 15001

    ²巴基斯坦伊斯斯兰巴 COMATS 大学萨瓦尔校区，电气与计算机工程系，萨瓦尔

    rahim@hit.edu.com, rahimkhan9901@gmail.com, yg@hit.edu.com, pinkheartgold@90.com


    **摘要—**多类分类彻底改变了通信场景。在过去的几十年里，从 1G 到 5G 通信系统的转变开启了许多机会。它是现代通信系统中波形识别的重要步骤，对于接收端的信号检测具有重大的实际意义。深度学习已广泛应用于语音识别、图像检测和强化学习领域，并利用了
    2D 和 3D 架构。在本研究中，设计了卷积神经网络（CNN）用于调制格式的多类分类。


    为了根据通道条件将深度学习与从不同路径接收的信号相结合 [1]，一种人工神经网络在宽的信噪比范围内检测了自动调制识别 [2]，一种用于重叠系统程序调制分类的方法
    [3]，一种基于选择的深度学习机制可用于正交频分复用（OFDM）系统 [4]，用于用于多用户通信系统特征提取和分类的自动编码器网络，一种用于使用深度神经网络方法识别
    WiFi、干扰或空闲信号的编码器 [6]，以及基于 Neeler-Meda (N-M) [7] 的射频原生属性（RF-DNA）指纹法。


    **索引词—** 分类、分类卷积神经网络、正交幅度调制、瑞利衰落、莱利森衰落


    ## I. 引言


    自 20 世纪 80 年代初引入第一代系统以来，多类通信技术在过去的几十年里经历了快速的研发。诸如模拟调制（第一代）、时分或码分多路接入（第二代）、宽码分多址（第三代）到正交频分多址（第四代）以及第五代蜂窝系统的技术的快速演进，塑造了通信标准和需求。


    在存在代表不同调制格式的噪声的情况下进行信号检测是一项重要任务，在现代通信系统中应用广泛 [1]，例如去帧 [2]、规避攻击 [3] 以及干扰无人机通信。


    许多文献研究已经在 SigmaBoss 和 Knaadabase 自适应增强无线信号分类中提出，基于频谱强度的分类 [14] 用于区分使用 8PSK、高斯频频键控
    (GFSK)、BPSK、16-QAM、正交相移键控 (CPSK)、64-QAM、4 相幅度调制 (4-QAM) 的不同调制方案，一种机器学习范式下 MIMO
    空间系统的低成本自适应工作负载，以及基于字典学习的用于配调制分类系统 [17]。


    深度学习方法已广泛部署于自然语言处理、强化学习和计算机视觉领域，并取得了显著成功 [1]。这些方法也应用于自动调制分类 [2] [6] [9] [10] [12]
    [13] [15]。


    尽管这些努力都面向分类不同的调制格式，但自动调制识别信号仍用于比较在噪声存在时 2D 和 3D CNN 架构的差异。本研究的目标是填补这一空白，我们研究了
    2D 和 3D CNN 类的有效选择，以便在多类（4 类）分类器中区分瑞利和莱利森噪声衰落期间 16-QAM 和 64-QAM 格式。


    本文的其余部分组织如下：第二节给出数据集，第三节解释了方法论，第四节包含实验，第五节解释了结果和讨论。最后，在第六节给出结论。


    ![](img/875bc626cb057300490ab6abb33d9f57_1_0.png)


    图 2. 添加了瑞利噪声的 QAM-16 调制猫图像。


    ## II. 数据集


    分类系统模型如图 1 所示。我们使用了从互联网下载的猫猫，使用 16 和 64 QAM 格式进行调制，添加了瑞利和莱利森噪声，并将其调整为 CNN 所需尺寸。生成的图像多类（4
    类）分类放在 2D 和 3D CNN 类中。图 2、图 3、图 4 和图 5 显示了某些类别的示例。


    ![](img/875bc626cb057300490ab6abb33d9f57_1_1.png)


    图 3. 添加了莱利森噪声的 QAM-64 调制猫图像。


