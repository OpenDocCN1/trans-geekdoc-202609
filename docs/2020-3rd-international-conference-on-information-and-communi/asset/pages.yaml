    # I. INTRODUCTION


    Multiclass communication technologies have undergone rapid research and development
    in the last decades since the introduction of first generation systems in the
    early 1980s. Rapid evolution of technologies such as analog modulation (first
    generation), time or code division multiple access (second generation), wide code
    division access (third generation) to orthogonal frequency multiple access (fourth
    generation) and as fifth generation cellular systems have shaped the communication
    standards and demands.


    Signal detection in the presence of noise representing different modulation formats
    is an important task with wide applications in modern communication systems [1]
    such as dephreaming [2], evasion of attacks [3], and jammed aerial vehicle communications.


