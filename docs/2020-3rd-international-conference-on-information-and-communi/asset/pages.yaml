    # II. DATASETS


    The system model for classification is shown in Fig. 1. We used random images
    of cats downloaded from the internet, modulated using 16 and 64 QAM modulation
    formats, added Rayleigh and Rician noise and resized them to the dimensions required
    by the CNN. The multiclass (4-classes) classifying the resulting images are placed
    into 2D and 3D CNN classes. Fig. 2, Fig. 3, Fig. 4, and Fig. show some examples
    of the four classes.


