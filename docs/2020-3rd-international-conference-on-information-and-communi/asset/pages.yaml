    using 5-fold cross-validation is better than the 2-DN architecture.


    Furthermore, 3D-CNN outperformed its counterparts which can be attributed to their
    superior learning capabilities in terms of invariance, and equivalence properties.


    # VI. CONCLUSION


    In this study, we examine the difference between 2D and 3D CNN architectures for
    multiclass classification of waveforms corrupted by Rayleigh and Rician channels.
    We observed that a 3D-CNN architecture trained using 5-fold cross validation procedure
    was the best whereas 2D-CNN architecture trained using 10-fold cross validation
    was the worst. Overall, we found that 3D architectures perform better than 2D.
    This study may be furthered with other modulation formats'
