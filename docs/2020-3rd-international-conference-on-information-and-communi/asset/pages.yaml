    Deep learning methods are widely deployed in the fields of natural language processing,
    reinforcement learning and computer vision with considerable success [1]. These
    methods have also found applications in automatic modulation classification [2]
    [6] [9] [10] [12] [13] [15].


    Despite these efforts which are all oriented to classify different modulation
    formats, automatic modulation recognition signals are required for the purpose
    of comparing differences in 2D and 3D CNN architectures in the presence of noise.
    The goal of this research is to fill this gap, which we examined the effective
    choices of 2D and 3D CNN classes to differentiate between 16-QAM and 64-QAM formats
    in the Rayleigh and Rician noise fading during a multiclass (4-classes) classifier.


    Rest of this work is organized as follows. Datasets are given in section II, III
    explains the methodology, section IV includes experiments, and results and discussion
    is explained in section V. Finally, a conclusion is presented in section VI.


