    # V. RESULTS AND DISCUSSION


    performance was evaluated for a single task, which is multiclass classification
    between 16 and 64 QAM modulated signals are caused by Rayleigh and Rician noise
    channels. We assessed the performance of 2D and 3D-CNN architectures using the
    following metrics, which are Relative Information Coefficient (RCI), Confusion
    Entropy (CEN), Index of Balanced Accuracy, Geometric Mean (GM), and Matthew''s
    Correlation Coefficient (MCC).


    CEN is an information theoret measure based on the index of entropy for multiclass
    classifiers. It evaluates the confusion level of the class of misclassified samples.
    Small values of CEN represent information loss and better classification.


    IBA provides information on the dominance of a class with the highest degree of
    individual accuracy. Higher values'
