  \ `for`。它是最强大的循环，因为它允许你在循环内部设置变量、在迭代时测试条件并修改变量。`for` 循环的第一部分是初始化。在 `for` 循环第一次迭代开始时，初始化表达式被执行。计数从\
  \ 0 开始。每次测试条件时，如果发现条件为真，循环就会继续。最后，当循环结束时，它开始重复。你可以对计数器进行操作。参见以下代码。\n\n```html\n\
  <html>\n<head>\n  <title>这是我的 PHP 脚本</title>\n</head>\n<body>\n  <?php\n  for ($a\
  \ = 1; $a <= 25; $a++) {\n    echo \"The requisite value of the variable a should\
  \ be: \" . $a . \"\\n\";\n    echo \"The do...while loop will go on.\\n\";\n  }\n\
  \  ?>\n</body>\n</html>\n```\n\n```bash\nphp main.php\n```\n\n```html\n<html>\n\
