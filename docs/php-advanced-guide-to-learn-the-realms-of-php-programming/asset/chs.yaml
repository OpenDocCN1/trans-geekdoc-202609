  \   array(\"City EXI\",30,45), \n    array(\"Civic\",45,15)\n);\necho $middleclasscars[0][0].\"\
  : The cars that are in stock: \".$middleclasscars[0][1].\", The cars that have been\
  \ sold: \".$middleclasscars[0][2].\\n\";\necho $middleclasscars[1][0].\": The cars\
  \ that are in stock: \".$middleclasscars[1][1].\", The cars that have been sold:\
  \ \".$middleclasscars[1][2].\\n\";\necho $middleclasscars[2][0].\": The cars that\
  \ are in stock: \".$middleclasscars[2][1].\", The cars that have been sold: \".$middleclasscars[2][2].\\\
  n\";\necho $middleclasscars[3][0].\": The cars that are in stock: \".$middleclasscars[3][1].\"\
  , The cars that have been sold: \".$middleclasscars[3][2].\\n\";\necho $middleclasscars[4][0].\"\
  : The cars that are in stock: \".$middleclasscars[4][1].\", The cars that have been\
  \ sold: \".$middleclasscars[4][2].\\n\";\necho $middleclasscars[5][0].\": The cars\
  \ that are in stock: \".$middleclasscars[5][1].\", The cars that have been sold:\
  \ \".$middleclasscars[5][2].\\n\";\n```\n\n现在我将在另一个 `for` 循环内部添加一个 `for` 循环。\n\n\
  ```php\n$middleclasscars = array (\n    array(\"Swift\",40,22),\n    array(\"Vitz\"\
  ,15,15), \n    array(\"Passo\",50,25), \n    array(\"Cultus\",25,15), \n    array(\"\
  City EXI\",30,45), \n    array(\"Civic\",45,15) \n);\nfor ($rows = 0; $rows < 6;\
