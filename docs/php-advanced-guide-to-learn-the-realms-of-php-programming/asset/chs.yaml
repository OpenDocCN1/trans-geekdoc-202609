  \ `print` 和 `PRINT` 是两个不同的函数。函数语句可能包含多个 `return` 语句，这会强制你的函数停止执行并将其返回给调用代码。如果你向\
  \ `return` 语句附加一个值，调用代码可能会获取到它。\n\n```html\n<html>\n<head>\n<title>This is my PHP\
  \ Script</title>\n</head>\n<body>\n<?php \nfunction greetings() { \n    echo \"\
  I wish you a good morning on this beautiful shiny day!\"; \n}\ngreetings(); \n//\
  \ I am calling the function \n?>\n</body>\n</html>\n```\n\n```php\nmain.php\n```\n\
  \n```html\n<html>\n<head>\n<title>This is my PHP Script</title>\n</head>\n<body>\
  \ I wish you a good morning on this beautiful shiny day!</body>\n</html>\n```\n\n\
  ## PHP 函数参数\n\n你可以通过参数向函数传递信息。函数中的参数就像变量。你可以在括号内指定参数，并根据需要添加尽可能多的参数。你应该用逗号将它们分开。我将创建一个带有一个参数的函数。我将从那里开始，通过同一个参数向函数传递信息。\n\
  \n```html\n<html>\n<head>\n<title>This is my PHP Script</title>\n</head>\n<body>\n\
  <?php \nfunction greetings($name) { \n    echo \"$name, I wish you a good morning\
  \ on this beautiful shiny day!\\\\n\"; \n}\ngreetings('James'); \n// I am calling\
  \ the function \ngreetings('Jasmine'); \ngreetings('Martha'); \ngreetings('Tim');\
  \ \ngreetings('David'); \ngreetings('Chelsea'); \n?>\n</body>\n</html>\n```\n\n\
  ```php\nmain.php\n```\n\n```html\n<html>\n<head>\n<title>This is my PHP Script</title>\n\
  </head>\n<body> James, I wish you a good morning on this beautiful shiny day! Jasmine,\
  \ I wish you a good morning on this beautiful shiny day! Martha, I wish you a good\
  \ morning on this beautiful shiny day! Tim, I wish you a good morning on this beautiful\
  \ shiny day! David, I wish you a good morning on this beautiful shiny day! Chelsea,\
  \ I wish you a good morning on this beautiful shiny day!</body>\n</html>\n```\n\n\
  ## 多参数\n\n在下面的示例中，我将提供一个多个参数的示例。\n\n```html\n<html>\n<head>\n<title>This is my PHP\
  \ Script</title>\n</head>\n<body>\n<?php \nfunction greetings($name, $day) { \n\
  \    echo \"$name, I wish you a good morning on this beautiful shiny day!\\\\n\"\
  ; \n    echo \"Anyway, we shall start working on $day.\\\\n\"; \n}\ngreetings('James',\
  \ 'Monday'); \n// I am calling the function \ngreetings('Jasmine', 'Tuesday'); \n\
  greetings('Martha', 'Wednesday'); \ngreetings('Tim', 'Thursday'); \ngreetings('David',\
  \ 'Friday'); \ngreetings('Chelsea', 'Saturday'); \n?>\n</body>\n</html>\n```\n\n\
  ```php\nmain.php\n```\n\n```html\n<html>\n<head>\n<title>This is my PHP Script</title>\n\
  </head>\n<body> James, I wish you a good morning on this beautiful shiny day! Anyway,\
  \ we shall start working on Monday. Jasmine, I wish you a good morning on this beautiful\
  \ shiny day! Anyway, we shall start working on Tuesday. Martha, I wish you a good\
  \ morning on this beautiful shiny day! Anyway, we shall start working on Wednesday.\
  \ Tim, I wish you a good morning on this beautiful shiny day! Anyway, we shall start\
  \ working on Thursday. David, I wish you a good morning on this beautiful shiny\
  \ day! Anyway, we shall start working on Friday. Chelsea, I wish you a good morning\
  \ on this beautiful shiny day! Anyway, we shall start working on Saturday.</body>\n\
  </html>\n```\n\nPHP 是弱类型的，你不需要告诉 PHP 类型。你可以向字符串传递整数，PHP 以这种方式处理它们。\n\n```html\n\
  <html>\n<head>\n<title>This is my PHP Script</title>\n</head>\n<body>\n<?php \n\
  function addingNumbers($x, $y) { \n    return $x + $y; \n}\necho \"5 + 10 = \" .\
  \ addingNumbers(5, 10); \n?>\n</body>\n</html>\n```\n\n## 默认值\n\n就像其他语言一样，你可以为参数设置默认值。如果不提供参数，PHP\
  \ 将提取默认值。\n\n```html\n<html>\n<head>\n<title>This is my PHP Script</title>\n</head>\n\
  <body>\n<?php \nfunction greetings($name, $day = \"Monday\") { \n    echo \"$name,\
  \ I wish you a good morning on this beautiful shiny day!\\\\n\"; \n    echo \"Anyway,\
  \ we shall start working on $day.\\\\n\"; \n}\ngreetings('James'); \n// I am calling\
  \ the function \ngreetings('Jasmine'); \ngreetings('Martha'); \ngreetings('Tim');\
  \ \ngreetings('David'); \ngreetings('Chelsea'); \n?>\n</body>\n</html>\n```\n\n\
  ## 返回值\n\n你可以通过 `return` 语句让 PHP 返回值。\n\n```html\n<html>\n<head>\n<title>This is\
  \ my PHP Script</title>\n</head>\n<body>\n<?php \ndeclare(strict_types=1);\nfunction\
  \ summing(int $a, int $b) { \n    $c = $a + $b; \n    return $c; \n}\necho \"5 +\
  \ 10 = \" . summing(5, 10); \necho \"7 + 33 = \" . summing(7, 13); \necho \"2 +\
  \ 9 = \" . summing(2, 4); \necho \"2 + 10 = \" . summing(2, 4); \necho \"29 + 14\
  \ = \" . summing(2, 4); \necho \"82 + 94 = \" . summing(2, 4); \n?>\n</body>\n</html>\n\
  ```\n\nPHP 支持返回语句的类型声明。与不同函数参数的类型声明一样，当数据类型不匹配时它将显示致命错误。当你想要函数的返回声明类型时，必须在大括号之前添加冒号（`:`）和数据类型。\n\
  \n```php\n<?php \ndeclare(strict_types=1);\nfunction summing(float $a, float $b)\
  \ : float { \n    return $a + $b; \n}\necho \"152 + 105 = \" . summing(152, 105);\
  \ \necho \"77 + 331 = \" . summing(77, 331); \necho \"22 + 95 = \" . summing(22,\
  \ 95); \necho \"25 + 49 = \" . summing(25, 49); \necho \"2 + 4 = \" . summing(2,\
  \ 4); \necho \"26 + 42 = \" . summing(26, 42); \n?>\n```\n\n\n\n\n\n# 第五章：PHP 数组\n\
  \n数组被定义为一组相关的值的集合。它们可以是特定形式提交的数据，例如班级学生的姓名或城市人口列表。本章将引导你如何使用数组。你将学习如何使用 `for` 和\
  \ `foreach` 循环来遍历数组。修改数组可能会引入 `explode()` 和 `implode()` 函数，它们可以将不同的数组转换为字符串，并将将字符串转换为数组。你还可以对数组进行排序。\n\
  \n数组包含键和值形式的元素。一个包含蔬菜和水果信息的数组将水果和蔬菜的名称作为键，将类型作为值。如果你有特定的键，可以封装一个包含单个元素的数组。\n\n```php\n\
  $vegetables = array(\"pumpkin\", \"tomato\", \"potato\", \"cabbage\", \"cauliflower\"\
  , \"ginger\", \"turmeric\", \"peas\");\necho \"Today I plan to cook \" . $vegetables[0]\
  \ . \"\\n\";\necho \"Today I plan to cook \" . $vegetables[1] . \"\\n\";\necho \"\
  Today I plan to cook \" . $vegetables[2] . \"\\n\";\necho \"Today I plan to cook\
  \ \" . $vegetables[3] . \"\\n\";\necho \"Today I plan to cook \" . $vegetables[4]\
  \ . \"\\n\";\necho \"Today I plan to cook \" . $vegetables[5] . \"\\n\";\necho \"\
  Today I plan to cook \" . $vegetables[6] . \"\\n\";\necho \"Today I plan to cook\
  \ \" . $vegetables[7] . \"\\n\";\n```\n\n数组是一种特殊的变量，可以在特定时期内保存多个值。\n\n## 数组的长度\n\
  PHP 允许你通过 `count()` 函数计算数组的长度。\n\n```php\n$vegetables = array(\"pumpkin\", \"tomato\"\
  , \"potato\", \"cabbage\", \"cauliflower\", \"ginger\", \"turmeric\", \"peas\");\n\
  echo count($vegetables);\n```\n\n## PHP 索引数组\n你可以通过两种方式创建索引数组。你可以通过从 0 开始自动分配索引。你已经在上面的示例中看到了一种方法。我将在接下来的示例中解释另一种方法。\n\
  \n```php\n$vegetables[0] = \"pumpkin\";\n$vegetables[1] = \"tomato\";\n$vegetables[2]\
  \ = \"potato\";\n$vegetables[3] = \"cabbage\";\n$vegetables[4] = \"cauliflower\"\
  ;\n$vegetables[5] = \"ginger\";\n$vegetables[6] = \"turmeric\";\n$vegetables[7]\
  \ = \"peas\";\necho \"Today I plan to cook \" . $vegetables[0] . \"\\n\";\necho\
  \ \"Today I plan to cook \" . $vegetables[1] . \"\\n\";\necho \"Today I plan to\
  \ cook \" . $vegetables[2] . \"\\n\";\necho \"Today I plan to cook \" . $vegetables[3]\
  \ . \"\\n\";\necho \"Today I plan to cook \" . $vegetables[4] . \"\\n\";\necho \"\
  Today I plan to cook \" . $vegetables[5] . \"\\n\";\necho \"Today I plan to cook\
  \ \" . $vegetables[6] . \"\\n\";\necho \"Today I plan to cook \" . $vegetables[7]\
  \ . \"\\n\";\n```\n\n### 遍历索引数组\n你可以遍历索引数组并逐个打印值。我将索引数组与 `for` 循环配合使用以产生我需要的结果。\n\
  \n```php\n$vegetables = array(\"pumpkin\", \"tomato\", \"potato\", \"cabbage\",\
  \ \"cauliflower\", \"ginger\", \"turmeric\", \"peas\");\n$arrlength = count($vegetables);\n\
  for($a = 0; $a < $arrlength; $a++) { \n    echo $vegetables[$a];\n    echo \"\\\
  nToday I plan to cook \" . $vegetables[0] . \"\\n\";\n    echo \"Today I plan to\
  \ cook \" . $vegetables[1] . \"\\n\";\n    echo \"Today I plan to cook \" . $vegetables[2]\
  \ . \"\\n\";\n    echo \"Today I plan to cook \" . $vegetables[3] . \"\\n\";\n \
  \   echo \"Today I plan to cook \" . $vegetables[4] . \"\\n\";\n    echo \"Today\
  \ I plan to cook \" . $vegetables[5] . \"\\n\";\n    echo \"Today I plan to cook\
  \ \" . $vegetables[6] . \"\\n\";\n    echo \"Today I plan to cook \" . $vegetables[7]\
  \ . \"\\n\";\n}\n```\n\n## PHP 关联数组\n关联数组使用命名的键。你可以为它们分配任何名称。你可能通过两种方式创建关联数组。\n\n\
  ```php\n$vegetables = array(\n    \"pumpkin\" => \"vegetable\", \n    \"tomato\"\
  \ => \"fruit\", \n    \"potato\" => \"vegetable\", \n    \"cabbage\" => \"vegetable\"\
  , \n    \"cauliflower\" => \"vegetable\", \n    \"orange\" => \"fruit\", \n    \"\
  ginger\" => \"vegetable\", \n    \"turmeric\" => \"spice\", \n    \"peas\" => \"\
  vegetable\"\n);\necho \"\\nToday I plan to cook \" . $vegetables['pumpkin'] . \"\
  \\n\";\necho \"Today I plan to cook \" . $vegetables['tomato'] . \"\\n\";\necho\
  \ \"Today I plan to cook \" . $vegetables['potato'] . \"\\n\";\necho \"Today I plan\
  \ to cook \" . $vegetables['cabbage'] . \"\\n\";\necho \"Today I plan to cook \"\
  \ . $vegetables['cauliflower'] . \"\\n\";\necho \"Today I plan to cook \" . $vegetables['orange']\
  \ . \"\\n\";\necho \"Today I plan to cook \" . $vegetables['ginger'] . \"\\n\";\n\
  echo \"Today I plan to cook \" . $vegetables['turmeric'] . \"\\n\";\necho \"Today\
  \ I plan to cook \" . $vegetables['peas'] . \"\\n\";\n```\n\n### 遍历关联数组\n在下面的示例中，我将遍历上面创建的关联数组。我将使用\
  \ `foreach` 循环来实现。\n\n```php\n$vegetablesfruits = array(\n    \"pumpkin\" => \"\
  vegetable\", \n    \"tomato\" => \"fruit\", \n    \"potato\" => \"vegetable\", \n\
  \    \"cabbage\" => \"vegetable\", \n    \"cauliflower\" => \"vegetable\", \n  \
  \  \"orange\" => \"fruit\", \n    \"ginger\" => \"vegetable\", \n    \"turmeric\"\
  \ => \"spice\", \n    \"peas\" => \"vegetable\"\n);\nforeach($vegetablesfruits as\
  \ $x => $x_value) { \n    echo \"\\nToday I plan to cook \" . $x . \", which technically\
  \ is a $x_value . \"\\n\";\n}\n```\n\n## 多维数组\n多维数组是包含多个数组的数组。PHP 支持深度为四或六层的数组。当你处理二维数组时，你可能需要两个索引来选择特定元素。当你处理三维数组时，你可能需要三个索引。我将创建一个三列的数组；第一列表示汽车名称，第二列表示库存，第三列表示售出的数量。\n\
  \n```php\n$middleclasscars = array(\n    array(\"Swift\",40,22), \n    array(\"\
