  .$middleclasscars[$rows][$cols].\"</li>\\n\" \n    } \n    echo \"</ul>\\n\"; \n\
  } \n```\n\n## 数组排序\n```php\n$vegetables = array(\"pumpkin\", \"tomato\", \"potato\"\
  , \"cabbage\", \"cauliflower\", \"ginger\", \"turmeric\", \"peas\");\nsort($vegetables);\n\
  $length = count($vegetables);\nfor($x = 0; $x < $length; $x++) { \n    echo \"I\
  \ am buying \" . $vegetables[$x] . \" from the vegetable market.\";\n    echo \"\
  \\n\"; \n}\n```\n\n### 下面的示例将数组降序排序。\n```php\n$vegetables = array(\"pumpkin\", \"\
  tomato\", \"potato\", \"cabbage\", \"cauliflower\", \"ginger\", \"turmeric\", \"\
  peas\");\nrsort($vegetables);\n$length = count($vegetables);\nfor($x = 0; $x < $length;\
  \ $x++) { \n    echo \"I am buying \" . $vegetables[$x] . \" from the vegetable\
  \ market.\";\n}\n```\n\n### 下面使用 `asort` 关键字将数组升序排序。\n```php\n$vegetables = array(\"\
  pumpkin\", \"tomato\", \"potato\", \"cabbage\", \"cauliflower\", \"ginger\", \"\
  turmeric\", \"peas\");\nasort($vegetables);\n$length = count($vegetables);\nfor($x\
  \ = 0; $x < $length; $x++) { \n    echo \"I am buying \" . $vegetables[$x] . \"\
  \ from the vegetable market.\";\n    echo \"\\n\"; \n}\n```\n\n### 下面的示例将根据键对数组进行排序。\n\
  ```php\n$vegetablesfruits = array(\n    \"pumpkin\" => \"vegetable\", \n    \"tomato\"\
