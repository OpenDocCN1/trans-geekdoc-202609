  ```html\n<!DOCTYPE html>\n<html>\n<body>\nMy dear visitor, the time at the moment\
  \ is 10:13:16am\n</body>\n</html>\n```\n\n# 第七章：面向对象编程\n\n普通的过程化编程围绕着编写简单的过程或函数来执行简单的数据操作。与之相比，面向对象编程围绕着包含数据和函数的对象。在转向高级\
  \ PHP 编程时，你必须考虑面向对象编程的几个优点。\n\n- 面向对象编程提高了编码和执行速度。\n- 面向对象编程为程序提供了良好的结构。\n- 面向对象编程有助于保持代码整洁，同时也让代码维护变得容易。\n\
  - 面向对象编程使代码调试变得更容易。\n- 面向对象编程帮助你创建可以重复使用的应用程序。因此它缩短了代码量和开发时间。\n\n\n\n\n\n## PHP\
  \ 类\n\n## 类定义\n我将创建一个名为 `Guns` 的类。它将拥有不同的属性，如 `name`、`capacity`、`color` 和 `weight`。我会定义不同的变量如\
  \ `$gname`、 `$gcapacity`、 `$gcolor` 和 `$gweight` 来存储属性的特定值。当我创建单个对象时，它们都将继承类的属性和行为。在创建类的第一步中，你必须定义它。你可以使用\
  \ `class` 关键字来定义类，后面可以跟类名和花括号。以下是定义的 `Guns` 类：\n\n```php\n<?php\nclass Guns {\n\
  \    // 类属性\n    public $gname;\n    public $gcolor;\n    public $gcapacity;\n \
  \   public $gweight;\n\n    // 类方法\n    function setting_the_name($gname) {\n  \
  \      $this->gname = $gname;\n    }\n    function getting_the_name() {\n      \
  \  return $this->gname;\n    }\n    function setting_the_color($gcolor) {\n    \
  \    $this->gcolor = $gcolor;\n    }\n    function getting_the_color() {\n     \
  \   return $this->gcolor;\n    }\n    function setting_the_capacity($gcapacity)\
  \ {\n        $this->gcapacity = $gcapacity;\n    }\n    function getting_the_capacity()\
  \ {\n        return $this->gcapacity;\n    }\n    function setting_the_weight($gweight)\
  \ {\n        $this->gweight = $gweight;\n    }\n    function getting_the_weight()\
  \ {\n        return $this->gweight;\n    }\n}\n?>\n```\n\n## 对象\n现在我已经定义了类，可以继续构建对象了。我可以根据程序需求创建一个或多个对象。每个对象都拥有类中定义的所有方法和属性，但它们的属性值会有不同。你可以使用\
  \ `new` 关键字来创建类的实例。看以下示例：\n\n```php\n$bazooka = new Guns();\n$revolver = new Guns();\n\
  $bazooka->setting_the_name('This is a hard-hitting bazooka ready for waging war.');\n\
  $revolver->setting_the_name('This is a revolver to kill the guards at the gates.');\n\
  echo $bazooka->getting_the_name();\necho \"\\n\";\necho $revolver->getting_the_name();\n\
  ```\n\n##为 Guns 类添加方法\n在下面的示例中，我将通过添加更多方法来扩展该类。\n\n```php\n<?php\nclass Guns {\n\
  \    // ... 属性和方法 ...\n}\n$bazooka = new Guns();\n$revolver = new Guns();\n$bazooka->setting_the_name('This\
  \ is a hard-hitting bazooka ready for waging war.');\n$bazooka->setting_the_color('The\
  \ color of my bazooka is black.');\n$bazooka->setting_the_capacity('I can load up\
  \ to six rockets to my bazooka. This is a beast for the enemy.');\necho \"Name of\
  \ the bazooka : \" . $bazooka->getting_the_name();\necho \"\\n\";\necho \"Color\
  \ of the bazooka : \" . $bazooka->getting_the_color();\necho \"\\n\";\necho \"Capacity\
  \ of the bazooka : \" . $bazooka->getting_the_capacity();\necho \"\\n\";\n?>\n```\n\
  \n## 添加多个实例\n在下面的代码段中，我将为同一个类添加两个以上的以上的实例。\n\n```php\n$bazooka = new Guns();\n$revolver\
  \ = new Guns();\n$Ak47 = new Guns();\n$shotgun = new Guns();\n$bazooka->setting_the_name('This\
  \ is a hard-hitting bazooka ready for waging war.');\n$revolver->setting_the_name('This\
  \ is a revolver to kill the guards at the gates.');\n// ... 其他实例 ...\n```\n\n##\
  \ PHP __construct 函数\nPHP 构造函数允许你在创建对象时初始化对象的属性。如果你创建了一个 `__construct()` 函数，PHP\
  \ 将会在你构建对象时调用该函数。构造函数以两个下划线（`__`）开头。\n\n```php\n<?php\nclass Guns {\n    public\
  \ $gname;\n    public $gcolor;\n    public $gcapacity;\n\n    public function __construct($gname,\
  \ $gcolor, $gcapacity) {\n        $this->gname = $gname;\n        $this->gcolor\
  \ = $gcolor;\n        $this->gcapacity = $gcapacity;\n    }\n    // ... 方法 ...\n\
  }\n?>\n```\n\n## PHP __destruct 函数\n析构函数通常在你需要销毁之前创建的对象时调用。如果你必须停止或退出脚本，也可以调用它。如果你创建了\
  \ `__destruct()` 函数，PHP 将会在脚本结束时调用它。\n\n```php\n<?php\nclass Guns {\n    public\
  \ $gname;\n    public $gcolor;\n    public $gcapacity;\n\n    public function __construct($gname,\
  \ $gcolor, $gcapacity) {\n        $this->gname = $gname;\n        $this->gcolor\
  \ = $gcolor;\n        $this->gcapacity = $gcapacity;\n    }\n    public function\
  \ __destruct() {\n        echo \"$this->gname\\n\";\n        echo \"$this->gcolor\\\
  n\";\n        echo \"$this->gcapacity\\n\";\n    }\n}\n?>\n```\n\n## 继承\n继承允许子类使用父类的属性和方法。使用\
  \ `extends` 关键字可以定义子类。PHP 子类可以继承父类的方法。子类可以重写父类的方法。你可以使用 `parent` 关键字来访问父类的方法。\n\n\
  ```php\n<?php\nclass Animal {\n    public $name;\n    public function speak() {\n\
  \        echo \"{$this->name makes a sound\";\n    }\n}\n\nclass Dog extends Animal\
  \ {\n    public function speak() {\n        echo \"{$this->name barks\";\n    }\n\
  }\n\n$dog = new Dog();\n$dog->name = \"John\";\n$dog->speak();\n?>\n```\n\n## 访问修饰符\n\
  访问修饰符用于控制属性和属性的可见性。PHP 有三种主要的修饰符：`public`（任何地方可见）、`protected`（在类及其子类中可见）和 `private`（仅在类内部可见）。\n\
  \n```php\n<?php\nclass BaseClass {\n    public $public;\n    protected $protected;\n\
  \    private $private;\n\n    public function __construct($p, $pr, $s) {\n     \
  \   $this->public = $p;\n        $this->protected = $pr;\n        $this->private\
  \ = $s;\n    }\n}\n\nclass DerivedClass extends BaseClass {\n    public function\
  \ display() {\n        // 可以访问 public 和 protected 属性\n        echo $this->public;\n\
  \        echo $this->protected;\n        // 访问 private 属性会导致错误\n        // echo\
  \ $this->private;\n    }\n}\n\n$obj = new DerivedClass(\"public\", \"protected\"\
  , \"private\");\n$obj->display();\n?>\n```\n\n\n\n\n\n# 第八章：在 PHP 中创建数据库\n\nMySQL\
  \ 是你可以在网站上使用的数据库。你必须将其连接到服务器才能成功运行。你可以以表格的形式在 MySQL 或 SQL 数据库中存储数据。表格是相互相关数据的集合，由行和列组成。你可以使用数据库对信息进行分类。公司可以建立如客户、员工、产品和订单等表格的数据库。你需要下载带有\
  \ MySQL 数据库的 PHP 服务器，你可以从互联网免费下载。MySQL 用于存储海量数据。\n\n## 建立连接\n\n第一步是在 PHP 和数据库之间建立连接。\n\
  \n```php\n<!DOCTYPE html>\n<html>\n<body>\n<?php\n$theservername = \"this is a localhost\"\
  ;\n$theusername = \"this is the username box\";\n$thepassword = \"this is the password\
  \ box\";\n// 创建连接\n$myconnection = new mysqli($theservername, $theusername, $thepassword);\n\
  // 检查连接\nif ($myconnection->connect_error) {\n    die(\"Connection has fully failed:\
  \ \" . $myconnection->connect_error);\n}\necho \"You have been connected successfully\
  \ to the database\";\n?>\n</body>\n</html>\n```\n\n`$php main.php`\n\n```\nConnection\
  \ has fully failed: php_network_getaddresses: getaddrinfo failed: Name or service\
  \ not known\nPHP Warning: mysqli::__construct(): php_network_getaddresses: getaddrinfo\
  \ failed: Name or service not known in /home/cg/root/4530372/main.php on line 11\
  \ \nPHP Warning: mysqli::__construct(): (HY000/2002): php_network_getaddresses:\
  \ getaddrinfo failed: Name or service not known in /home/cg/root/4530372/main.php\
  \ on line 11\n```\n\n如果连接失败，你将得到上述结果。\n\n## MySQLi 过程化\n\n这是 PHP 连接到 MySQLi 数据库的另一个示例。\n\
  \n```php\n<!DOCTYPE html>\n<html>\n<body>\n<?php\n$theservername = \"this is a localhost\"\
  ;\n$theusername = \"this is the username box\";\n$thepassword = \"this is the password\
