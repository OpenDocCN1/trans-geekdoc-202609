- "# PHP 高级指南：学习 PHP 编程领域\n\n\n\n![](img/image_rsrcCGT.jpg)\n\n\n\n\n\n\n# 第一章：学习\
  \ PHP 的第一步\n\n有很多理由可以使用 PHP 创建你的程序。你可能对学习 PHP 感兴趣，因为你想构建一个包含一些交互元素的网站。\n\n## Web\
  \ 世界中的 PHP\n\nPHP 用于构建网站。PHP 程序与运行在桌面电脑上供单个人使用的程序不同，它通常运行在 Web 服务器上，并由许多使用电脑上网络浏览器的用户访问。本节将解释\
  \ PHP 如何调整到 Web 服务器和网络浏览器之间的交互中。\n\n当你坐在电脑前，并借助 `Firefox` 或 `Safari` 等浏览器打开一个页面时，你可能会导致你的电脑和其他任何电脑之间通过互联网发生一个小小的对话。Web\
  \ 服务器读取你用 PHP 编写的程序。这些程序就像是你通过 PHP 传给 Web 服务器的简单指令。Web 服务器会决定做什么。\n\nPHP 既指解释器，也指编程语言。PHP\
  \ 被称为服务端语言，因为它倾向于运行在特定的 Web 服务器上。像 `Flash` 和 `JavaScript` 等技术和语言被称为客户端，因为它们运行在桌面\
  \ PC 或网络客户端上。PHP 程序中提供的指令会导致解释器输出一个网页。指令触发网络浏览器执行诸如弹出新窗口等的操作。一旦网络浏览器将生成的网页发送给客户端，PHP\
  \ 似乎就离场了。如果页面内容包含 `JavaScript`，`JavaScript` 会运行，但与生成该页面的 PHP 程序保持断开状态。\n\n由 PHP\
  \ 生成的动态页面就像写给世界另一端朋友的一封信。你可以将脑海中的任何内容添加到页面中，并发送给世界另一边的朋友。信的内容是为发送给的特定人员定制的。一旦信件放入邮箱，你就无法更改它了。它会立即飞向目的地。你无法在朋友阅读时对其修改。\n\
  \n## 为什么选择 PHP？\n\nPHP 是免费的。无论你是在旧 PC 还是价值百万美元的超级计算机上运行解释器，你都不需要支付任何许可费、维护费、升级费和支持费。大多数\
  \ `Linux` 发行版都预装了 PHP。如果你的系统没有安装，你可能正在使用其他操作系统，如 `Windows`。作为开源项目之一，PHP 允许任何人检查它。即使你缺乏\
  \ PHP 的技术知识，你也可以派人为你进行调查。\n\n## 安装 PHP\n\n在接下来的章节中，我将解释在你的电脑操作系统上安装 PHP 的不同步骤。\n\
  \n### 安装 Web 服务器\n\n你不能像运行 `HTML` 那样直接在浏览器中运行 PHP。如果你想运行 PHP，你需要在电脑系统上安装一个服务器，以便浏览器可以解析\
  \ PHP 脚本，然后对数据库运行若干条 `MySQL` 查询以返回结果。你也可以使用支持 `MySQL` 和 `PHP` 的主机，让他们将将其上传到服务器并允许你测试你的网站。你可以在你的电脑系统上安装不同的服务器，如\
  \ `WAMP`、`XAMP` 和 `MAMP`。\n\n我将解释适用于 `Windows` 操作系统的 `XAMP` 安装过程。它是一个适用于 `Windows`、`Linux`\
  \ 和 `Mac` 的完全免费开源平台 Web 服务器包。该过程的第一步是下载最新版本的 `XAMP`。一旦下载完成，你需要在电脑上找到该文件。\n\n###\
  \ 文本编辑器\n\n在接下来的章节中，我将解释在你的操作系统上安装 PHP 的不同步骤。你不能像运行 `HTML` 那样直接在浏览器中运行 PHP。如果你想运行\
