  \ $thepassword);\n// 检查连接\nif (!$myconnection) {\n    die(\"Connection has fully\
  \ failed: \" . $myconnection->connect_error);\n}\necho \"You have been connected\
  \ successfully to the database\";\n?>\n</body>\n</html>\n```\n\n## 数据库创建\n\n在这个示例中，我将编写代码帮助你创建一个加载到你网站上的数据库。\n\
  \n```php\n<!DOCTYPE html>\n<html>\n<body>\n<?php\n$theservername = \"this is a localhost\"\
  ;\n$theusername = \"this is the username box\";\n$thepassword = \"this is the password\
  \ box\";\n// 创建连接\n$myconnection = new mysqli_connect($theservername, $theusername,\
  \ $thepassword);\n// 检查连接\nif (!$myconnection) {\n    die(\"Connection has fully\
  \ failed: \" . $myconnection->connect_error);\n}\necho \"You have been connected\
  \ successfully to the database\";\n// 这将帮助你创建一个数据库\n$sql = \"I am trying to create\
  \ a database\";\nif ($myconnection->query($sql) === TRUE) {\n    echo \"Thank you,\
  \ you have got your database. You are now free to use it.\";\n} else {\n    echo\
  \ \"There is an error in the creation of database: \" . $myconnection->error;\n\
  }\n$myconnection->close();\n?>\n</body>\n</html>\n```\n\n## 过程化 MySQLi 中的数据库创建\n\
  \n```php\n<!DOCTYPE html>\n<html>\n<body>\n<?php\n$theservername = \"this is a localhost\"\
  ;\n$theusername = \"this is the username box\";\n$thepassword = \"this is the password\
