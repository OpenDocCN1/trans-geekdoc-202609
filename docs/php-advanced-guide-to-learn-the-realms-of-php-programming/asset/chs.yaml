  \ echo \"Thank you, you have got your table. You can use it as per need.\";\n} else\
  \ {\n    echo \"There is an error in the creation of database: \" . $myconnection->error;\n\
  }\n$myconnection->close();\n?>\n</body>\n</html>\n```\n\n# 第九章：PHP 和 SQL 命令\n\n\
