  , \n    \"turmeric\" => \"spice\", \n    \"peas\" => \"vegetable\"\n);\narsort($vegetablesfruits);\n\
  foreach($vegetablesfruits as $x => $x_value) { \n    echo \"\\nToday I plan to cook\
  \ \" . $x . \", which technically is a $x_value . \"\\n\";\n}\n```\n\n### 这将按键降序排序。我将使用\
  \ `krsort` 关键字作为目的。\n```php\n$vegetablesfruits = array(\n    \"pumpkin\" => \"vegetable\"\
  , \n    \"tomato\" => \"fruit\", \n    \"potato\" => \"vegetable\", \n    \"cabbage\"\
  \ => \"vegetable\", \n    \"cauliflower\" => \"vegetable\", \n    \"orange\" =>\
  \ \"fruit\", \n    \"ginger\" => \"vegetable\", \n    \"turmeric\" => \"spice\"\
  , \n    \"peas\" => \"vegetable\"\n);\nkrsort($vegetablesfruits);\nforeach($vegetablesfruits\
  \ as $x => $x_value) { \n    echo \"\\nToday I plan to cook \" . $x . \", which\
  \ technically is a $x_value . \"\\n\";\n}\n```\n\n\n\n\n\n# 第六章：PHP 超全局变量\n\n超全局变量基本上是内置变量，它们在不同的作用范围内都是可用的。我将在后面的代码示例中讨论每一个变量，并看看它们能做什么。\n\
  \n## PHP $GLOBALS\n\n`$GLOBALS` 是 PHP 中的一个超变量，你可以用它从 PHP 脚本的任何位置（如方法和函数）访问不同的全局变量。PHP\
  \ 倾向将变量存储在名为 `$GLOBALS[$index]` 的数组中。索引即变量的名称。\n\n```php\n<!DOCTYPE html>\n<html>\n\
  <body>\n<?php\n$a = 55;\n$b = 15;\nfunction additionofnumbers() {\n    $GLOBALS['c']\
  \ = $GLOBALS['a'] + $GLOBALS['b'];\n}\nadditionofnumbers();\necho $c;\n?>\n</body>\n\
  </html>\n```\n\n```php\nmain.php\n```\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n\
  70\n</body>\n</html>\n```\n\n## PHP 超全局变量 = $_SERVER\n\n超全局变量是某种内置变量，它们在不同的作用范围内都是可用的。`$_SERVER`\
  \ 包含了关于路径、标头和脚本位置的信息。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<form method=\"\
  post your information\" action=\"<?php echo $_SERVER['PHP_SELF'];?>\">\n    Name:\
  \ <input type=\"text\" name=\"firstname\">\n    <input type=\"Please submit here\"\
  >\n</form>\n<?php\nif ($_SERVER[\"REQUEST\"] == \"POST\") {\n    $uname = $_REQUEST['firstname'];\n\
  \    if (empty($uname)) {\n        echo \"Name is currently empty. Please fill in\
  \ the requisite information.\";\n    } else {\n        echo $uname ;\n    }\n}\n\
  ?>\n</body>\n</html>\n```\n\n```php\nmain.php\n```\n\n```html\n<DOCTYPE html>\n\
  <html>\n<body>\n<form method=\"post your information\" action=\"main.php\">\n  \
  \  Name: <input type=\"text\" name=\"firstname\">\n    <input type=\"Please submit\
  \ here\">\n</form>\n</body>\n</html>\n```\n\n## PHP $_POST 变量\n\n`$_POST` 是超全局变量，你可以用它在提交\
  \ HTML 表单后收集数据。你可以用它传递不同的变量。下面的示例显示了一个带有输入框和提交按钮的表单。当用户点击按钮提交数据时，表单数据将处理到你在 HTML\
  \ 表单的 action 属性中指定的文件中。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<form method=\"\
  post your information\" action=\"<?php echo $_SERVER['PHP_SELF'];?>\">\n    Name:\
  \ <input type=\"text\" name=\"firstname\">\n    <input type=\"Please submit here\"\
  >\n</form>\n<?php\nif ($_SERVER[\"REQUEST\"] == \"POST\") {\n    $uname = $_POST['firstname'];\n\
  \    if (empty($uname)) {\n        echo \"Name is currently empty. Please fill in\
  \ the requisite information.\";\n    } else {\n        echo $uname;\n    }\n}\n\
  ?>\n</body>\n</html>\n```\n\n```php\nmain.php\n```\n\n```html\n<DOCTYPE html>\n\
  <html>\n<body>\n<form method=\"post your information\" action=\"main.php\">\n  \
  \  Name: <input type=\"text\" name=\"firstname\">\n    <input type=\"Please submit\
  \ here\">\n</form>\n</body>\n</html>\n```\n\n# 交互式 PHP 编程\n\n在本节中，我将逐一讨论各种功能，以便你轻松掌握这些概念。\n\
  \n## PHP 日期与时间\n\n```php\n<!DOCTYPE html>\n<html>\n<body>\n<?php\necho \"The date\
  \ as of today is \" . date(\"Y/m/d\") . \"\\n\";\necho \"The date as of today is\
  \ \" . date(\"Y.m.d\") . \"\\n\";\necho \"The date as of today is \" . date(\"Y-m-d\"\
  ) . \"\\n\";\necho \"The date as of today is \" . date(\"l\");\n?>\n</body>\n</html>\n\
  ```\n\n```php\nmain.php\n```\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\nThe date\
  \ as of today is 2020/12/31\nThe date as of today is 2020.1231\nThe date as of today\
  \ is 2020-12-31\nThe date as of today is Thursday\n</body>\n</html>\n```\n\n通过使用代码，你可以为网站添加不同格式的日期。这将赋予网站风格。你还可以通过简单的代码为网站添加版权符号。\n\
  \n```php\n<!DOCTYPE html>\n<html>\n<body>\n© 2004-<?php echo date(\"Y\");?>\n</body>\n\
  </html>\n```\n\n```php\nmain.php\n```\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n\
  © 2004-2020\n</body>\n</html>\n```\n\n你可以编写并将以下代码添加到网站中，向用户显示时间。\n\n```php\n<!DOCTYPE\
