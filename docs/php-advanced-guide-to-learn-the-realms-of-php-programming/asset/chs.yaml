  \ `SELECT TOP` 来指定返回的条目总数。在处理具有数千条记录的大表时，`SELECT TOP` 子句非常有用。如果你选择返回整个表格，将会降低数据库性能。但是，如果你只返回你想要处理的条目，除非这些数据过大，否则几乎不会影响性能。以下是我将使用\
  \ `TOP` 子句的表格。\n\n| Serial# | BuyerName | PostalAddress | Age | Nameofcountry |\
