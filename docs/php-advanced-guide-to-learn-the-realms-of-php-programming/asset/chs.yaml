  \n## for each 循环\n\n一种遍历数组中找到的每个元素的循环被称为 `foreach` 循环。\n\n```html\n<html>\n<head>\n\
  \  <title>这是我的 PHP 脚本</title>\n</head>\n<body>\n  <?php\n  $states = array(\"New\
  \ York\", \"Los Angles\", \"Florida\", \"California\", \"Texas\", \"Virginia\",\
  \ \"South Dakota\", \"North Dakota\");\n  foreach ($states as $states) {\n    echo\
  \ \"I have visited \" . $states . \"\\n\";\n  }\n  ?>\n</body>\n</html>\n```\n\n\
  ## break 语句\n\n如果你已经开始编程，你可能听说过 `break` 语句。我在之前的 `switch` 语句中用过它。`break` 语句是跳出循环的最佳方法。\n\
  \n```html\n<html>\n<head>\n  <title>这是我的 PHP 脚本</title>\n</head>\n<body>\n  <?php\n\
  \  for ($a = 1; $a <= 25; $a++) {\n    if ($a == 20) {\n      break;\n    }\n  \
  \  echo \"The requisite value of the variable a should be: \" . $a . \"\\n\";\n\
  \    echo \"The do...while loop will go on.\\n\";\n  }\n  ?>\n</body>\n</html>\n\
  ```\n\n\n\n\n\n### continue 语句\n\n`continue` 语句的作用与 `break` 语句类似，它们都会中断迭代。如果条件为真，它会中断当前循环，但继续执行剩余的代码，而不是直接跳出循环。这就像是在旅途中途暂停片刻，然后继续出发。\n\
  \n```html\n<html>\n<head>\n    <title>This is my PHP Script</title>\n</head>\n<body>\n\
  <?php \nfor ($a = 1; $a <= 15; $a++) { \n    if ($a == 10) { \n        continue;\
  \ \n    } \n    echo \"The requisite value of the variable a should be: \" . $a\
  \ . \"\\n\";\n    echo \"The do...while loop will go on.\\n\"; \n} \n?>\n</body>\n\
  </html>\n```\n\n`php main.php`\n\n```html\n<html>\n<head>\n    <title>This is my\
