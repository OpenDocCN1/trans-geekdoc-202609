  \ `HTML` 那样直接在浏览器中运行 PHP。如果你想运行 PHP，你需要在电脑系统上安装一个服务器，以便浏览器可以解析 PHP 脚本，然后对数据库运行若干条\
  \ `MySQL` 查询以返回结果。你也可以使用支持 `MySQL` 和 `PHP` 的主机，让他们将其上传到服务器并允许你测试你的网站。你可以在你的电脑系统上安装不同的服务器，如\
  \ `WAMP`、`XAMP` 和 `MAMP`。\n\n### 常量\n\n在接下来的章节中，我将解释在你的电脑操作系统上安装 PHP 的不同步骤。你不能像运行\
  \ `HTML` 那样直接在浏览器中运行 PHP。如果你想运行 PHP，你需要在电脑系统上安装一个服务器，以便浏览器可以解析 PHP 脚本，然后对数据库运行若干条\
  \ `MySQL` 查询以返回结果。你也可以使用支持 `MySQL` 和 `PHP` 的主机，让他们将其上传到服务器并允许你测试你的网站。你可以在你的电脑系统上安装不同的服务器，如\
  \ `WAMP`、`XAMP` 和 `MAMP`。\n\n### 运算符\n\nPHP 使用不同的运算符来对值和变量执行各种操作。我们现在将以分组的形式查看 PHP\
  \ 使用的不同运算符。某些运算符会对值执行特定的数学运算并返回计算结果。\n\n\n\n\n\n* `$a + $b` 用于计算两个变量之和。\n* `$a -\
  \ $b` 用于计算两个变量之差。\n* `$a * $b` 用于计算两个变量之积。\n* `$a / $b` 用于计算两个变量之商。\n* `$a / $b`\
  \ 用于计算两个变量的余数。\n* `$a ** $b` 用于计算两个变量的幂。\n* `$a = $b` 用于获取 `$b` 的值并将其赋值给 `$a`。\n\
  \n# 第二章：表达式与控制\n\n上一章节向你介绍了 PHP 的基础知识，如安装框架和 PHP 变量。本章将带你了解 PHP 编程是如何工作的，以及你如何控制程序的执行流。\n\
  \n## 表达式\n\n现在我将从 PHP 的基础部分开始。表达式是值、运算符、变量和函数的组合，并产生一个值。你可以通过组合如 `OR`、`AND` 和 `XOR`\
  \ 等布尔运算符来编写表达式。在接下来的示例中，我将在以下代码块中解释简单的表达式。\n\n```html\n<html>\n<head>\n<title>This\
  \ is a PHP web page</title>\n</head>\n<body>\n<?php\necho \"e: \\[\" . (80 > 9)\
  \ . \"\\]\\\\n\";\necho \"f: \\[\" . (10 == 6) . \"\\]\\\\n\";\necho \"g: \\[\"\
  \ . (5 == 0) . \"\\]\\\\n\";\necho \"i: \\[\" . (2 == 2) . \"\\]\\\\n\";\n?>\n</body>\n\
  </html>\n```\n\n```bash\nphp main.php\n```\n\n```html\n<html>\n<head>\n<title>This\
  \ is a PHP web page</title>\n</head>\n<body>\ne: [1]\nf: []\ng: []\ni: [1]\n</body>\n\
  </html>\n```\n\n你也可以通过以下代码获取 `true` 和 `false` 的输出。\n\n```html\n<html>\n<head>\n\
  <title>This is a PHP web page</title>\n</head>\n<body>\n<?php\necho \"e: \\[\" .\
  \ TRUE . \"\\]\\\\n\";\necho \"f: \\[\" . FALSE . \"\\]\\\\n\";\n?>\n</body>\n</html>\n\
  ```\n\n```bash\nphp main.php\n```\n\n```html\n<html>\n<head>\n<title>This is a PHP\
  \ web page</title>\n</head>\n<body>\ne: [1]\nf: []\n</body>\n</html>\n```\n\n在某些语言中，`FALSE`\
  \ 可能被定义为 `-1` 或零，因此在其他语言中，你应该验证此布尔表达式的定义。\n\n## 关系运算符\n\n关系运算符接收两个操作数。它测试这些操作数并返回\
  \ `FALSE` 或 `TRUE` 的布尔结果。三类关系运算符 `逻辑`、`相等` 和 `比较` 如下：\n\n### 等于\n\n相等运算符是 `==`。至关重要的是不要将其与单等号赋值运算符混淆。第一个语句分配一个特定值，第二个语句在表达式中对其测试以检查相等性。\n\
  \n```html\n<html>\n<head>\n<title>This is a PHP web page</title>\n</head>\n<body>\n\
  <?php\n$month = \"June\";\nif ($month == \"June\") echo \"The summer season has\
  \ arrived. It is time to go to the beach.\";\n?>\n</body>\n</html>\n```\n\n```bash\n\
  php main.php\n```\n\n```html\n<html>\n<head>\n<title>This is a PHP web page</title>\n\
  </head>\n<body>\nThe summer season has arrived. It is time to go to the beach.\n\
  </body>\n</html>\n```\n\n通过返回 `TRUE` 或 `FALSE`，相等运算符允许你在 `if` 语句的帮助下测试条件。然而，PHP\
  \ 被视为弱类型语言。如果相等表达式的两个操作数属于不同类型，PHP 将它们转换为合理的形式。任何由数字组成的字符串在与数字比较时都会转换为数字。\n\n###\
  \ 比较运算符\n\n通过使用比较运算符，你可以测试不仅是相等还有不等。PHP 在你构建网站时提供了大于、小于等选项供使用。\n\n```html\n<html>\n\
  <head>\n<title>This is a PHP web page</title>\n</head>\n<body>\n<?php\n$x = 20;\n\
  $y = 35;\nif ($x > $y) echo \"$x is greater than $y\\\\n\";\nif ($x < $y) echo \"\
  $x is less than $y\\\\n\";\nif ($x >= $y) echo \"$x is greater than or equal to\
  \ $y\\\\n\";\nif ($x <= $y) echo \"$x is less than or equal to $y\\\\n\";\n?>\n\
  </body>\n</html>\n```\n\n```bash\nphp main.php\n```\n\n```html\n<html>\n<head>\n\
  <title>This is a PHP web page</title>\n</head>\n<body>\n20 is less than 35\n20 is\
  \ less than or equal to 35\n</body>\n</html>\n```\n\n### 逻辑运算符\n\n逻辑运算符产生假或真的的结果，因此它们也被称为布尔运算符。共有四种这样的运算符。\n\
  \n* `AND`\n* `OR`\n* `XOR`\n* `NOT`\n\n\n\n\n\n```html\n<html>\n<head>\n<title>这是一个\
  \ PHP 网页页面</title>\n</head>\n<body>\n<?php\n$x = 1;\n$y = 0 ;\necho ($x AND $y)\
  \ . \"\\n\";\necho ($x or $y) . \"<\\n\";\necho ($x XOR $y) . \"\\n\";\necho !$x\
  \ . \"\\n\";\n?>\n</body>\n</html>\n```\n`php main.php`\n\n```html\n<html>\n<head>\n\
  <title>这是一个 PHP 脚本</title>\n</head>\n<body> 1< 1 </body>\n</html>\n```\n\n# PHP\
  \ 条件语句\n\nPHP Conditionals conditionals\n\nPHP 条件语句（原文此处重复了 conditionals）会改变程序的执行流。它们允许你对不同的事物提出某些问题，然后以多种方式对答案做出响应。条件语句在动态网站页面中占据着核心位置，因为它们让观众每次访问你的网页时都能轻松获得不同的输出。条件语句有三种类型：`if`\
  \ 语句、`?` 运算符和 `switch` 语句。\n\n## if 语句\n\n控制程序流的一种方法是使用 `if` 语句。`if` 语句的内容可以是一个有效的\
  \ PHP 表达式，包括比较、等值以及函数的返回值。当你希望让 PHP 在 `if` 条件为真（TRUE）时执行的操作，需要放在大括号 `{}` 中。如果你只需要执行一条语句，可以忽略大括号。然而，如果你始终使用大括号，你就可以避免寻找那些难以排查的\
  \ bug。\n\n```html\n<html>\n<head>\n<title>这是一个 PHP 脚本</title>\n</head>\n<body>\n\
  <?php\nif ($my_account_balance < 1000) {\n    $my_money = 10000;\n    $my_account_balance\
  \ += $my_money;\n}\n?>\n</body>\n</html>\n```\n\n## else 语句\n\n当条件语句不为真（TRUE）时，你可能需要继续执行主代码，但你可能也想做其他事情。这就是\
  \ `else` 语句大显身场的地方。在 `if-else` 语句的帮助，如果条件为真，则执行第一个条件语句；如果为假（FALSE），则执行第二个。两个选择中必须有一个被执行。在当前情况下，两个都会执行。下面的示例展示了\
  \ `if-else` 结构。\n\n```html\n<html>\n<head>\n<title>这是一个 PHP 脚本</title>\n</head>\n\
  <body>\n<?php\n$greetings_time = date(\"H\");\nif ($greetings_time < \"12\") {\n\
  \    echo \"祝你有美好的一天!\";\n} else {\n    echo \"祝你有一个完美的夜晚!\";\n}\n?>\n</body>\n\
  </html>\n```\n`php main.php`\n\n```html\n<html>\n<head>\n<title>这是一个 PHP 脚本</title>\n\
  </head>\n<body> 祝你有美好的一天! </body>\n</html>\n```\n\n## if….elseif….else 语句\n\n这种结构比前两个要长，并且为两个以上的条件执行多段代码。它非常适合测试多种可能性。查看下面的示例中代码是如何工作的。\n\
  \n```html\n<html>\n<head>\n<title>这是一个 PHP 脚本</title>\n</head>\n<body>\n<?php\n\
  $greetings_time = date(\"H\");\nif ($greetings_time < \"12\") {\n    echo \"祝你有一个美好的早晨!\"\
  ;\n} elseif($greetings_time < \"20\") {\n    echo \"祝你有一个良好的午后!\";\n} else {\n \
  \   echo \"祝你有一个完美的夜晚!\";\n}\n?>\n</body>\n</html>\n```\n`php main.php`\n\n```html\n\
  <html>\n<head>\n<title>这是一个 PHP 脚本</title>\n</head>\n<body> 祝你有一个美好的早晨! </body>\n\
  </html>\n```\n\n我将修改时间来测试其他条件。我会用 `10` 填充代码。\n\n```html\n<html>\n<head>\n<title>这是一个\
  \ PHP 脚本</title>\n</head>\n<body>\n<?php\n$greetings_time = date(\"H\");\nif ($greetings_time\
  \ < \"12\") {\n    echo \"祝你有美好的一天!\";\n} elseif($greetings_time < \"20\") {\n \
  \   echo \"祝你有一个良好的午后!\";\n} else {\n    echo \"祝你有一个完美的夜晚!\";\n}\n?>\n</body>\n\
  </html>\n```\n`php main.php`\n\n```html\n<html>\n<head>\n<title>这是一个 PHP 脚本</title>\n\
  </head>\n<body> 祝你有美好的一天! </body>\n</html>\n```\n\n我将用 `15` 填充代码。\n\n```html\n<html>\n\
  <head>\n<title>这是一个 PHP 脚本</title>\n</head>\n<body>\n<?php\n$greetings_time = date(\"\
  H\");\nif ($greetings_time < \"12\") {\n    echo \"祝你有美好的一天!\";\n} elseif($greetings_time\
  \ < \"20\") {\n    echo \"祝你有一个良好的午后!\";\n} else {\n    echo \"祝你有一个完美的夜晚!\";\n\
  }\n?>\n</body>\n</html>\n```\n\n我将用 `23` 填充代码。\n\n```html\n<html>\n<head>\n<title>这是一个\
  \ PHP 脚本</title>\n</head>\n<body>\n<?php\n$greetings_time = date(\"H\");\nif ($greetings_time\
  \ < \"12\") {\n    echo \"祝你有美好的一天!\";\n} elseif($greetings_time < \"20\") {\n \
  \   echo \"祝你有一个良好的午后!\";\n} else {\n    echo \"祝你有一个完美的夜晚!\";\n}\n?>\n</body>\n\
  </html>\n```\n\n## switch 语句\n\n当你在处理多个情况时，`switch` 语句非常有用。通过 `switch` 语句，你可以从许多情况中选择一个执行块。查看以下示例：\n\
  \n```html\n<html>\n<head>\n<title>这是一个 PHP 脚本</title>\n</head>\n<body>\n<?php\n\
  $states = \"Texas\";\nswitch ($states) {\n    case \"Texas\":\n        echo \"我访问过德克萨斯州\"\
  ;\n        break;\n    case \"California\":\n        echo \"我访问过加利福尼亚州\";\n    \
  \    break;\n    case \"Los Angeles\":\n        echo \"我访问过洛杉矶\";\n        break;\n\
  \    case \"Florida\":\n        echo \"我访问过佛罗里达州\";\n        break;\n    case \"\
  New York\":\n        echo \"我访问过纽约州\";\n        break;\n    case \"Las Vegas\":\n\
  \        echo \"我访问过拉斯维加斯\";\n        break;\n    case \"Virginia\":\n        echo\
  \ \"我访问过弗吉尼亚州\";\n        break;\n    default:\n        echo \"我没有访问过任何州\";\n}\n\
  ?>\n</body>\n</html>\n```\n\n替代语法\n\n有一种你可以使用的替代语法来获得相同的结果。你可以将大括号替换为单冒号和 `endswitch`\
  \ 命令。它的工作方式和之前一样。\n\n```html\n<html>\n<head>\n<title>这是一个 PHP 脚本</title>\n</head>\n\
  <body>\n<?php\n$states = \"New York\";\nswitch ($states):\n    case \"Texas\":\n\
  \        echo \"我访问过美国的德克萨斯州\";\n        break;\n    case \"California\":\n    \
  \    echo \"我访问过美国的加利福尼亚州\";\n        break;\n    case \"Los Angeles\":\n      \
  \  echo \"我访问过美国的洛杉矶\";\n        break;\n    case \"Florida\":\n        echo \"\
  我访问过美国的佛罗里达州\";\n        break;\n    case \"New York\":\n        echo \"我访问过美国的纽约州\"\
  ;\n        break;\n    case \"Las Vegas\":\n        echo \"我访问过美国的拉斯维加斯\";\n   \
  \     break;\n    case \"Virginia\":\n        echo \"我访问过美国的弗吉尼亚州\";\n        break;\n\
  \    default:\n        echo \"我没有访问过美国的任何州，这意味着我还没有访问过美国\";\nendswitch;\n?>\n</body>\n\
  </html>\n```\n\n\n\n\n# 第三章：PHP 循环\n\n计算机最优秀的特性之一就是它们倾向于不知疲倦且快速地重复某些计算任务。你可能希望软件重复某些代码，直到你从中推导出某些结果。PHP\
  \ 有不同类型的循环结构，为实现这种操作提供了完美的方法。一旦进入代码块，只有在条件正确的情况下你才能退出。\n\n## while 循环\n\n`while`\
  \ 循环在特定条件保持为真时会多次执行代码块。以下代码执行同样的操作。只要我设置的条件保持为真，它就会一直运行。\n\n```html\n<html>\n<head>\n\
  \  <title>这是我的 PHP 脚本</title>\n</head>\n<body>\n  <?php\n  $a = 1;\n  while ($a\
  \ <= 25) {\n    echo \"The requisite value of the variable a should be: \" . $a\
  \ . \"\\n\";\n    $a++;\n  }\n  ?>\n</body>\n</html>\n```\n\n```bash\nphp main.php\n\
  ```\n\n```html\n<html>\n<head>\n  <title>这是我的 PHP 脚本</title>\n</head>\n<body>\n\
