    # Bus Bandwidth


    When a device requests more interrupt or isochronous bandwidth than is available,
    the host refuses to configure the device. Low- and full-speed interrupt transfers
    use little bandwidth, so the host isn’t likely to deny a configuration due to
    their requirements. High-speed interrupt transfers are a different story. A high-speed
    endpoint can request up to three 1024-byte data packets in each microframe, using
    as much as 40 percent of the bus bandwidth. To help ensure that devices can enumerate
    without problems, the interrupt endpoints in a device’s default interface must
    specify a maximum packet size no larger than 64 bytes. The device driver is then
    free to try to increase the endpoint’s reserved bandwidth by requesting alternate
    interface settings or configurations.


    Isochronous endpoints can also cause bandwidth problems. A frequent problem with
    isochronous endpoints on 1.x devices is that devices request more bandwidth than
    is available. The host properly refuses to configure the device and the user is
    left with a device that doesn’t work without knowing why.


    To help ensure that devices will enumerate without problems, the default interface
    setting of a 2.0-compliant device must request no isochronous bandwidth. In other
    words, the default interface can transfer no isochronous data at all. An obvious
    way to comply is to include no isochronous endpoints in the default interface.
    After enumeration, the device driver is free to attempt to request isochronous
    bandwidth by requesting an alternate interface or configuration with an isochronous
    endpoint. Note that even full-speed endpoints must meet this requirement to comply
    with USB 2.0.


    # Device Capabilities


    If the host has promised that the requested USB bandwidth will be available, there’s
    still no guarantee that the device will be ready to send or receive data when
    needed.'
