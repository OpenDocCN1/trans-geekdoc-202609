    # Finding Your Device


    The Windows API provides a series of SetupDi_ API functions that enable applications
    to find all devices in a device interface class and to obtain a device path name
    for each device. The CreateFile function can use the device path name to obtain
    a handle for accessing the device.


    Obtaining a device path name requires these steps:


    +   1. Obtain the device interface GUID.

    +   2. Request a pointer to a device information set with information about all
    installed and present devices in the device interface class.

    +   3. Request a pointer to a structure that contains information about a device
    interface in the device information set.

    +   4. Request a structure containing a device interface’s device path name.

    +   5. Extract the device path name from the structure.


    The application can then use the device path name to open a handle for communicating
    with the device.


    Table 10-1 lists the API functions that applications can use to perform these
    actions. The functions can be useful for finding devices that use some vendor-specific
    drivers and HID-class devices that perform vendor-specific functions. For many
    devices that perform standard functions, applications have other ways to find
    and gain access to devices. For example, to access a drive, the .NET Framework’s
    Directory class includes a GetLogicalDrives method that enables applications to
    find all of the logical drives on a system (whether or not they use USB). You
    can then use methods of the Directory and File classes to access files on the
    drives.'
