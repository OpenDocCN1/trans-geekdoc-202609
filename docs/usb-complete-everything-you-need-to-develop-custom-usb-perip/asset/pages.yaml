  md: '# Enumeration:

    How the Host Learns

    about Devices


    Before applications can communicate with a device, the host needs to learn about
    the device and assign a device driver. Enumeration is the exchange of information
    that accomplishes these tasks. The process includes assigning an address to the
    device, reading descriptors from the device, assigning and loading a device driver,
    and selecting a configuration that specifies the device''s power requirements,
    endpoints, and other features. The device is then ready to transfer data using
    any of the endpoints in its configuration.


    This chapter describes the enumeration process, including the structure of the
    descriptors that the host reads from the device during enumeration. You don''t
    need to know every detail about enumeration in order to design a USB peripheral,
    but understanding how enumeration works in general is essential


    # 4'
