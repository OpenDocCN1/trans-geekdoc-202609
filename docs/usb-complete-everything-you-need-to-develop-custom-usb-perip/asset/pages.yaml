- pgno: 470
  md: '# Hub Description


    **bNbrPorts.** The number of downstream ports the hub supports.


    # wHubCharacteristics:


    Bits 1 and 0 specify the power-switching mode. 00=Ganged; all ports are powered
    together. 01=Ports are powered individually. 1X: used only on 1.0 hubs with no
    power switching.


    Bit 2 indicates whether the hub is part of a compound device (1) or not (0).


    Bits 4 and 3 are the Overcurrent Protection mode. 00 = Global protection and reporting.
    01=Protection and reporting for each port. 1X = No protection and reporting (for
    bus-powered hubs only).


    Bits 6 and 5 are the Transaction Translator Think Time. These bits indicate the
    maximum number of full-speed bit times required between transactions on a low-
    or full-speed downstream bus. 00 = 8; 01 = 16; 10 = 24; 11 = 32. Applies to 2.0
    hubs only.


    Bit 7 indicates whether the hub supports Port Indicators (1) or not (0). Applies
    to 2.0 hubs only.


    Bits 8 through 15 are reserved.


    **bPwrOn2PwrGood.** The maximum delay between beginning the power-on sequence
    on a port and when power is available on the port. The value is in units of 2
    milliseconds. (Set to 100 for a 200-millisecond delay.)


    **bHubContrCurrent.** The maximum current required by the hub controller''s electronics
    only, in milliamperes.


    **DeviceRemovable.** Indicates whether the device(s) attached to the hub''s ports
    are removable (0) or not (1). The number of bits in this value equals the number
    of ports on the hub + 1. Bit 0 is reserved. Bit 1 is for Port 1, bit 2 is for
    Port 2, and so on up.


    **PortPowerCtrlMask.** All bits should be 1. This field is only for compatibility
    with 1.0 software. Each port has one bit, and the field should be padded with
    additional 1s so that the field''s size in bits is a multiple of 8.'
  merge: -1
  img_proc: true
