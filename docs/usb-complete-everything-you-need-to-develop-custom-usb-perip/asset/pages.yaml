    # Device Firmware Upgrade


    The Device Firmware Upgrade (DFU) class defines a protocol to enable a host to
    send firmware enhancements and patches to a device. After receiving the firmware
    upgrade, the device re-enumerates using its new firmware.


    # Documentation


    The Device Firmware Upgrade specification defines the class. At this writing,
    the current version is 1.0.


    # Overview


    To perform a firmware upgrade as described in the specification, a device must
    have two complete sets of descriptors: run-time and DFU-mode. The run-time descriptors
    are for normal operation and also include descriptors that inform the host that
    the device is capable of firmware upgrades. The DFU-mode descriptors are a separate
    set of descriptors for use when the'
  merge: -1
  img_proc: true
- pgno: 220
  md: 'device is upgrading its firmware. For example, a keyboard using its run-time
    descriptors enumerates as a HID-class device and sends keypress data to the host.
    During a firmware upgrade, the device suspends normal operations as a keyboard
    and uses the DFU-mode descriptors to communicate with the DFU driver on the host.


    The upgrade process has four phases. In the first phase, device enumeration, the
    device sends its run-time descriptors to the host and operates normally. In the
    reconfiguration phase, the host sends a DFU_Upgrade request and then resets and
    re-enumerates the device, which returns its DFU-mode descriptors. In the transfer
    phase, the host transfers the firmware upgrade to the device. The manifestation
    phase begins when the device informs the host that the upgrade has been received.
    The host resets the bus, and the device enumerates using its upgraded firmware
    and resumes normal operation. During the upgrade process, the device transitions
    through defined states such as dfuIdle (waiting for DFU requests) or dfuError
    (an error has occurred).


    An upgrade file stored on the host contains the firmware for the upgrade, followed
    by a DFU suffix that the host can use to help ensure that the firmware is valid
    and appropriate for a particular device. The suffix contains an error-checking
    value, a signature consisting of the ASCII codes for the text “DFU”, and optional
    values for the Vendor ID, Product ID, and product release number the firmware
    is appropriate for. The suffix is for the host’s use only; the host doesn’t send
    the suffix to the device.


    To ensure that the host will load a new driver for the firmware-upgrade process,
    the device should use different Product IDs in its run-time and DFU-mode device
    descriptors.


    DFU communications use only the control endpoint.


    # Descriptors


    The DFU function is defined at the interface subclass level. In a device that
    supports DFU, both the run-time and DFU-mode descriptors include a standard interface
    descriptor with bInterfaceClass = FEh to indicate an Application Specific class
    and bInterfaceSubClass = 01h to indicate the'
  merge: -1
  img_proc: true
- pgno: 221
  md: 'Device Firmware Upgrade class. In DFU mode, the DFU interface must be the only
    active interface in the device.


    Both descriptor sets include a Run-time DFU Functional descriptor that specifies
    whether the device can communicate on the bus immediately after the manifestation
    phase, how long to wait for a reset after receiving a DFU_Upgrade request, and
    the maximum number of bytes the device can accept in a control Write transfer
    during a firmware upgrade.


    # Class-specific Requests


    There are seven class-specific requests:


    | Request | Description |

    |---|---|

    | DFU_Detach | If a bus reset occurs within the time period specified in the DFU
    Functional descriptor, enumerate using the DFU-mode descriptors. |

    | DFU_Dnload | Accept new firmware in the request’s Data stage. A request with
    wLength = 0 means that all of the firmware has been transferred. |

    | DFU_Upload | Send firmware to the host in the request’s Data stage. |

    | DFU_GetStatus | Return status and error information. On error, enter the dfuError
    state. |

    | DFU_ClrStatus | Clear the dfuError state reported in response to a DFU_GetStatus
    request and enter the dfuIdle state. |

    | DFU_GetState | Same as DFU_GetStatus but with no change in state on error. |

    | DFU_Abort | Return to the dfuIdle state. |


    # Chips


    The choice of USB controller depends mainly on the requirements of the device
    in run-time mode. The device must have enough memory and other resources to store
    and implement the upgraded firmware.


    # Windows Support


    Windows doesn’t provide a driver for this class. STMicroelectronics has a Windows
    driver and firmware examples for use with its ST7 microcontrollers with Flash
    memory.'
  merge: -1
  img_proc: true
- pgno: 222
  md: '# Human Interface


    The Human Interface Device (HID) class includes keyboards, pointing devices, and
    game controllers. With these devices, the host reads and acts on human input such
    as keypresses and mouse movements. Hosts must respond quickly enough so users
    don''t notice a delay between an action and the expected response. Some devices
    that perform vendor-specific functions can also use the HID class.


    All HID data travels in reports, which are structures with defined formats. Usage
    tags in a report tell the host or device how to use received data. For example,
    a Usage Page value of 09h indicates a button, and a Usage ID value tells which
    button, if any, was pressed.


    Windows and other operating systems have included HID drivers beginning with the
    earliest editions with USB support. The availability of class drivers has helped
    to make the HID class popular for devices besides obvious human-interface applications.
    A HID can exchange any type of data, but can use only control and interrupt transfers.
    Chapter 11, Chapter 12, and Chapter 13 have more about using HIDs in custom devices.


    # Documentation


    The HID specification is in several documents. At this writing, the current version
    of the HID specification is 1.11. The main change from version 1.0 is enabling
    the host to send reports in interrupt OUT transfers. In a HID 1.0 interface, the
    host must send all reports in control transfers.


    Several documents define Usage-tag values for different device types. *HID Usage
    Tables* has values for keyboards, pointing devices, various game controllers,
    displays, telephone controls, and more. Four other device types have their own
    documents:


    *Class Definition for Physical Interface Devices (PID)* defines values for force-feedback
    joysticks and other devices that require physical feedback in response to inputs.'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'The *Monitor Control* class specification defines values for user controls
    and power management for display monitors. (The HID interface controls the display’s
    settings only. The image data uses a different hardware interface.)


    *Usage Tables for HID Power Devices* defines values for Uninterruptible Power
    Supply (UPS) devices and other devices where the host monitors and controls batteries
    or other power components.


    *Point of Sale (POS) Usage Tables* defines values for bar-code readers, weighing
    devices, and magnetic-stripe readers.


    # Overview


    HIDs communicate by exchanging reports using control and interrupt transfers.
    Input and Output reports may use control or interrupt transfers. Feature reports
    use control transfers. A report descriptor defines the size of each report and
    Usage values for the report data.


    # Descriptors


    A HID function is defined at the interface level. In the interface descriptor,
    bInterfaceClass = 03h to indicate the HID class. The bInterfaceSubClass field
    indicates whether the HID supports a boot protocol, which is a protocol that a
    host can use instead of the report protocol defined in the device’s report descriptor.
    Mice and keyboards may support a boot protocol to enable using the devices before
    the full HID drivers are loaded.


    Following the interface descriptor is a class-specific HID descriptor, which contains
    the size of the report descriptor. The report descriptor contains information
    about the data in the HID reports. An optional Physical Descriptor can describe
    the part(s) of the human body that activate a control.


    # Class-specific Requests


    HIDs have six class-specific control requests to enable sending and receiving
    reports, setting and reading the Idle rate (how often the device sends a report
    if the data is unchanged), and setting or reading the currently active protocol
    (boot or report). To obtain a report descriptor or physical descriptor, the'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'host sends a Get_Descriptor request to the interface with the high byte of
    wValue set to 01h to indicate a class-specific descriptor and the low byte of
    wValue set to 22h to request a report descriptor or 23h to request a physical
    descriptor.


    # Chips


    For devices with a human interface, low speed is fast enough to enable acting
    on received user input with no detectable delay. Many HIDs use low speed because
    the device needs a more flexible and/or cheaper cable. A HID may use any speed,
    however.


    A variety of controllers include additional support for keyboards, mice, and game
    controllers. Atmel Corporation’s AT43USB325 contains an AVR microcontroller and
    a 5-port hub. One of the hub’s ports connects to an embedded function with support
    for a 20 x 8 keyboard matrix. The controller supports low and full speeds. The
    AT43USB325 is similar but supports an 18 x 8 keyboard matrix. Other vendors with
    controllers designed for use in keyboards include Alcor Micro and Winbond Electronics
    Corporation. Some general-purpose controllers, such as Cypress’ CY7C63743, support
    both USB and PS/2 interfaces to make it easy to design a dual-interface device.


    Code Mercenaries offers programmed chips for use in pointing devices, keyboards,
    and joysticks. The MouseWarrior series has interfaces for sensors and buttons
    and supports four interfaces: USB, PS/2, asynchronous serial, and Apple Desktop
    Bus (ADB). The KeyWarrior series supports USB, PS/2, and ADB and has interfaces
    to keyboard matrices and optional support for keyboard macros. The JoyWarrior
    series supports a variety of game-controller inputs.


    # Windows Support


    Applications can communicate with HIDs using API functions. The API functions
    for exchanging reports include ReadFile and WriteFile as well as HID-specific
    APIs such as HidD_SetFeature and HidD_GetFeature. Applications that access game
    controllers can use DirectX’s DirectInput component for fast, more direct access.'
  merge: -1
  img_proc: true
- pgno: 225
  md: 'Windows requests exclusive access to Input reports from system keyboards and
    pointing devices, so applications can’t directly read the reports that describe
    keypresses, mouse movements, and mouse-button clicks. Instead, the operating system
    handles this data at a lower level. For example, a Visual-Basic application doesn’t
    have to read mouse clicks to find out if a user has clicked on an option button
    because the button’s click event executes automatically on a button click.


    If a system has multiple keyboards or pointing devices, Windows treats them all
    as a single “virtual” keyboard or pointing device. If you want to limit the applications
    that can access a keyboard or pointing device, or if you want to determine which
    keyboard or pointing device is the source of input, you need to either provide
    a digitally signed filter driver or design a vendor-specific device that the host
    doesn’t identify as a system mouse or keyboard.


    # IrDA Bridge


    The IrDA (Infrared Data Association) interface defines hardware requirements and
    protocols for exchanging data over short distances via infrared energy. A USB
    IrDA bridge converts between USB and IrDA data and enables a host to use USB to
    monitor, control, and exchange data over an IrDA interface.


    # Documentation


    The specification for USB IrDA bridges is *IrDA Bridge Device Definition*. The
    current version at this writing is 1.0. The IrDA specifications are available
    from *www.irda.org*.


    # Overview


    The data in an IrDA link uses the Infrared Link Access Protocol (IrLAP), which
    defines the format of the IrDA frames that carry data, addresses, and status and
    control information. The IrLAP payload consists of the address, control, and optional
    information (data) fields in an IrLAP frame. In addition to the IrLAP payload,
    each frame contains an error-checking value and markers for the beginning and
    end of the frame.'
  merge: -1
  img_proc: true
- pgno: 226
  md: 'A USB IrDA bridge uses bulk pipes to exchange data with the host. The host
    and bridge place status and control information in headers whose format is defined
    in the IrDA bridge specification On receiving data from the IrDA link, the IrDA
    bridge extracts the IrLAP Payload, adds a header, and passes the data and header
    to the host. The header can contain values for the IrDA link''s Media_Busy and
    Link_Speed parameters. On receiving IrDA data from the host, the IrDA bridge removes
    the header added by the host. The header can specify new values for Link_Speed
    and the number of beginning-of-frame markers. The bridge then places the IrDA
    Payload in an IrDA frame for transmitting.


    # Descriptors


    An IrDA-bridge function is defined at the interface subclass level. In the interface
    descriptor, bInterfaceClass = FEh to indicate an application-specific interface
    and bInterfaceSubclass 02h to indicate an IrDA Bridge Device. A class-specific
    descriptor contains IrDA-specific information such as the maximum number of bytes
    in an IrDA frame and supported Baud rates.


    # Class-specific Requests


    There are five class-specific control requests:


    | Request | bRequest | Description |

    |---|---|---|

    | Receiving | 1 | Is the device currently receiving an IrLAP frame? |

    | Check_Media_Busy | 3 | Is infrared traffic present? |

    | Set_IrDA_Rate_Sniff | 4 | Accept frames at any speed or at a single speed. |

    | Set_IrDA_Unicast_List | 5 | Accept frames from the named addresses only. |

    | Get_Class_Specific_Descriptors | 6 | Return the class-specific descriptor. |


    # Chips


    SigmaTel, Inc.’s STIR4000 is an IrDA USB bridge chip that contains a full-speed
    USB transceiver and an interface to an IrDA transceiver. The host communicates
    with the chip by accessing a series of registers that enable configuring, obtaining
    status information, and exchanging data. The chip'
  merge: -1
  img_proc: true
- pgno: 227
  md: 'supports vendor-specific control requests for reading and writing to the registers.
    The STIR4200 is a high-speed version of the chip.


    Another approach to adding IrDA to a USB host is to use a USB/asynchronous-serial
    converter with an IrDA interface. Texas Instruments’ TUSB3410 is a USB/asynchronous-serial
    converter for use in wired and IrDA serial interfaces. For a wired link, the chip’s
    internal UART interfaces to serial-data pins. For an IrDA link, the UART interfaces
    to an internal IrDA encoder/decoder, which in turn connects to an external IrDA
    transceiver.


    # Windows Support


    Windows XP supports IrDA communications via two software profiles. The dial-up
    networking profile enables using IrDA to connect a PC and a mobile phone. The
    LAN access profile enables using the Point-to-Point Protocol (PPP), a direct peer-to-peer
    network connection, or a direct connection to a network access point. Windows
    XP doesn’t include a generic driver for the USB-IrDA-bridge function, but SigmaTel
    provides a driver for use with their chips.


    # Mass Storage


    The mass-storage class is for devices that transfer files in one or both directions.
    Typical devices are floppy, hard, CD, DVD, and Flash-memory drives. Cameras can
    use the mass-storage class to enable accessing picture files in a camera’s memory.
    In Windows computers, devices that use the mass-storage driver appear as drives
    in My Computer and the file system enables users to copy, move, and delete files
    in the devices.


    # Documentation


    The USB specification for mass storage devices is in four documents: an overview
    (version 1.2), specifications for the bulk-only transport protocol (version 1.0)
    and the control/bulk/interrupt (CBI) transport protocol (version 1.1) and commands
    for the Universal Floppy Interface (UFI) (version 1.0).'
  merge: -1
  img_proc: true
- pgno: 228
  md: 'Each media type has an industry-standard command-block set to enable controlling
    devices and reading status information. These are specifications that define command-block
    sets for device types supported by the mass-storage class:


    ATAPI CD/DVD devices use the *ATA/ATAPI* specification from *www.t13.org* and
    the *MultiMedia Command (MMC) Set* from *www.t10.org*. (An earlier version of
    the ATA/ATAPI specification was called *SFF 8020i*.)


    ATAPI removable media uses *SFF-8070i: ATAPI Removable Rewritable Media Devices*,
    available from *www.sffcommittee.com*. This document is a supplement to the ATA/ATAPI
    specification. Floppy drives often belong to this subclass.


    Generic SCSI media uses the mandatory commands from the *SCSI Primary Command
    (SPC) Set* and *SCSI Block Command (SBC) Set* from *www.t10.org*.


    QIC-157 tape drives use the *Common SCSI/ATAPI Command Set for Streaming Tape*,
    available from *www.qic.org*.


    UFI uses the *UFI Command Specification* from *www.usb.org*. The commands are
    based on the SCSI-2 and SFF-8070i command sets.


    # Overview


    Mass-storage devices use bulk transfers to exchange data. Control transfers send
    class-specific requests and can clear Stall conditions on bulk endpoints. For
    exchanging other information, a device may use either of two transport protocols:
    bulk only or control/bulk/interrupt (CBI). CBI is approved for use only with full-speed
    floppy drives. Bulk-only is recommended for new devices of all types.


    In the bulk-only protocol, a successful data transfer has three stages: command
    transport, data transport, and status transport. In the command-transport stage,
    the host sends a command in a structure called a Command Block Wrapper (CBW).
    In the data-transport stage, the host or device sends the requested data. In the
    status-transport stage, the device'
