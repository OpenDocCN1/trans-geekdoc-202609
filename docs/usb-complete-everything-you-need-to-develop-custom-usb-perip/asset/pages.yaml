- pgno: 181
  md: 'DISCON# pin, the firmware causes the device to electrically emulate removal
    from, then reattachment to the bus. The pin either pulls up or floats one end
    of a resistor whose opposite end connects to D+. The pin indicates device attachment
    when pulled up and device removal when floating. The firmware also sets ReNum
    to 1 to cause the 8051 core, instead of the EZ-USB core, to respond to requests
    at Endpoint 0.


    On detecting the emulated re-attachment, the host enumerates the device again,
    this time retrieving the newly stored descriptors and using the information in
    them to select a device driver to load.


    The obvious advantage to storing the firmware on the host is easy updates. To
    update the firmware, you just store the new version on the host and the driver
    sends the firmware to the device on the next power up or attachment. There’s no
    need to replace the chip or use special programming hardware or software. The
    disadvantages are increased complexity of the device driver, the need to have
    the firmware available on the host, and longer enumeration time.


    **Load Firmware from EEPROM.** A third mode of operation provides a way for the
    chip to store its firmware in an external serial EEPROM. If the first byte read
    from the EEPROM is B2h, the core loads the EEPROM’s entire contents into RAM on
    power-up. The EEPROM must contain the Vendor ID, Product ID, and release number
    as well as all descriptors required for enumeration and whatever other firmware
    and data the device requires. On exiting the reset state, the device has everything
    it needs for USB communications. The core sets the ReNum bit to 1 on completing
    the loading of the code. When enumerating the device, the host reads the stored
    descriptors and loads the appropriate driver. There is no re-enumeration.


    **Run Code from External Parallel Memory.** If no EEPROM is detected, or if the
    first byte isn’t B0h or B2h, and if EA is a logic high, the chip boots from code
    memory on the external parallel data bus. This memory can be EPROM, EEPROM, Flash
    memory, or battery-backed RAM. The memory contains the descriptors and other firmware.
    ReNum is set to 1. The host enumerates the device and loads a driver, and there
    is no re-enumeration.'
  merge: -1
  img_proc: true
- pgno: 182
  md: '# Cypress enCoRe II


    The chips in Cypress Semiconductor’s enCoRe II series (yes, that odd capitalization
    is how Cypress has trademarked the name) are inexpensive, low-speed controllers
    with an instruction set optimized for USB communications.


    # CPU Architecture


    The enCoRe II series is the latest in Cypress’ offerings of low-speed controllers.
    The chips are similar to the original enCoRe controllers except that the program
    memory is Flash memory instead of OTP EPROM. The architecture is unique to Cypress,
    so to program in assembly code, you’ll need to learn a new instruction set. However,
    the instruction set is small and learning the syntax should be fairly painless
    if you have experience with assembly-code programming. A C compiler is also available.


    The series includes chips with varying amounts of program memory, number of I/O
    pins, and packaging. The options include up to 256 bytes of RAM, 8 kilobytes of
    Flash memory, and 36 I/O pins, with two of the pins serving as the USB interface.


    The chips contain internal oscillators that eliminate the need to add external
    crystals or resonators. The USB port can be configured for PS/2 (synchronous serial)
    communications to enable a pointing device to support both interfaces. When USB
    mode is disabled, the two USB pins can serve as a serial-programming-mode interface
    for Flash programming.


    # USB Controller


    The enCoRe II controllers have three endpoints, the required Endpoint 0 plus endpoints
    1 and 2 for interrupt transfers. The chip can support one interrupt IN endpoint
    and one interrupt OUT endpoint, or two interrupt endpoints in the same direction.
    Each endpoint has an 8-byte buffer in RAM. USB communications require a fair amount
    of firmware support, so example code is helpful.'
  merge: -1
  img_proc: true
- pgno: 183
  md: '# Freescale MC68HC908JB16


    Freescale Semiconductor’s MC68HC08 family of 8-bit microcontrollers includes chips
    with Flash memory and support for low-speed USB. The MC68HC908JB16 is an example.
    Freescale Semiconductor was created in 2004 when Motorola, Inc., spun off its
    Semiconductor Products sector.


    # Architecture


    The MC68HC08 family is an upgrade to Freescale’s popular MC68HC05 family. The
    ’HC08 chips are faster and more efficient, and the object code is upward compatible
    with ’HC05 code.


    The ’HC908JB16 contains 16 kilobytes of Flash memory and 21 I/O pins. Two of the
    I/O pins are the USB interface. Some of the other I/O pins have hardware support
    for synchronous serial communications and a keyboard interface. A monitor ROM
    enables Flash-memory programming and debugging over an asynchronous serial interface
    using a single pin on the chip.


    # USB Controller


    The USB controller is low speed and supports Endpoint 0, one interrupt IN endpoint,
    and one endpoint that can be configured as interrupt IN or interrupt OUT.


    # Freescale MCF5482 ColdFire


    An example of a high-end controller with USB capability is Freescale Semiconductor’s
    MCF5482 ColdFire microprocessor. The chip contains a 32-bit CPU and a full/high-speed
    USB device controller plus an Ethernet controller and plenty of other I/O. A request
    processor automatically processes many standard USB requests. For example, on
    receiving a Get_Descriptor request, the request processor retrieves the requested
    descriptor from RAM and returns the descriptor to the host. The chip supports
    Endpoint 0 and seven additional endpoint addresses.'
  merge: -1
  img_proc: true
- pgno: 184
  md: '# Controllers that Interface to External CPUs


    A controller that interfaces to an external CPU enables you to add USB to just
    about any microcontroller circuit. A disadvantage is the need to use two chips,
    while other controllers combine the CPU and USB controller on one chip. Also,
    example circuits and code for USB communications using your CPU may not be available.


    Controllers that interface to an external CPU may support a command set for USB-related
    communications, or the controller may just use a series of registers to store
    USB data and configuration, status, and control information.


    Most interface chips have a local data bus that uses a parallel interface to communicate
    with the CPU. For fast transfers with external memory, many chips support direct
    memory access (DMA). In a device with a DMA controller, the CPU can set up a transfer
    that reads or writes a block of data into or from data memory without CPU intervention.
    For CPUs that don’t have external parallel buses, a few controllers can use a
    synchronous or asynchronous serial interface. An interrupt pin can signal the
    CPU when the controller has received USB data or needs new data to send.


    Table 6-4 compares a selection of interface chips. The following descriptions
    will give an idea of the range of chips available. New chips are being released
    all the time, so any new project warrants checking the latest offerings.


    # National Semiconductor USBN9603


    National Semiconductor’s USBN9603 can interface to any CPU with a parallel data
    bus, a Microwire interface, or even just four spare I/O pins controlled entirely
    in firmware to support Microwire communications.


    # Architecture


    The ’9603 has a serial interface engine for handling USB communications, USB endpoint
    buffers, and status and control registers. A CPU can access'
