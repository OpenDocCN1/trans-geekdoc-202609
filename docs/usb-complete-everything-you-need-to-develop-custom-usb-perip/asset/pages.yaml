  md: '# Details


    PreparsedData is the pointer returned by HidD_GetPreparsedData. When the function
    returns, the application can examine and use whatever values are of interest in
    the Capabilities structure. For example, if you’re looking for a joystick, you
    can look for a Usage Page of 01h and a Usage of 04h.


    The report lengths are useful for setting buffer sizes for sending and receiving
    reports.


    # Getting the Capabilities of the Buttons and Values


    The device capabilities aren’t the only thing that an application can retrieve
    from a HID. The application can also get the capabilities of each button and value
    in a report.


    HidP_GetValueCaps returns a pointer to an array of structures containing information
    about the values in a report. The NumberInputValueCaps property of the HIDP_CAPS
    structure is the number of structures returned by HidP_GetValueCaps.


    The items in the structures include many values obtained from the HID’s report
    descriptor, as described in Chapter 12. The items include the Report ID, whether
    a value is absolute or relative, whether a value has a null state, and logical
    and physical minimums and maximums. A LinkCollection identifier distinguishes
    between controls with the same Usage and Usage Page in the same collection.


    In a similar way, the HidP_GetButtonCaps function can retrieve information about
    a report’s buttons. The information is stored in a HidP_ButtonCaps structure.


    An application that has no use for this information doesn’t have to retrieve it.


