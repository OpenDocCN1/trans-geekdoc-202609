- pgno: 193
  md: '''245BM, the data-bus pins function as an 8-bit I/O port. On the ’232BM, the
    data and handshaking pins are the I/O port. You can use FTDI Chip’s driver to
    configure the pins as inputs or outputs in any combination. The outputs can control
    LEDs, relays, or other circuits. The inputs can interface to switches and logic-gate
    outputs. Host applications can read and write to the I/O pins over the USB connection.


    # USB Controller


    Unlike other device controllers, the ’232BM and ’245BM aren’t designed as general-purpose
    devices that can be programmed to use any host driver. Instead, FTDI Chip offers
    two driver options, a Virtual COM Port Driver and a D2XX Direct Driver.


    With the Virtual COM Port driver, the device appears to the host as if the device
    were connected to a COM (RS-232) port. In most cases, an RS-232 device converted
    to USB with a ’232BM requires no changes to application software that accesses
    the device. Under Windows, applications can access a device with a ’232BM using
    standard API functions (ReadFile, WriteFile) or other classes, libraries, or toolkits
    for COM-port communications. The ’245BM can use the Virtual COM Port driver as
    well.


    If you don’t want to use COM-port programming, need faster performance, or want
    to use Bit Bang mode, FTDI Chip provides the D2XX Direct Driver, which provides
    a series of vendor-specific functions that applications can use to communicate
    with the device.


    The chips support a Microwire interface to an EEPROM that can store vendor-specific
    values for items such as a Vendor ID, Product ID, strings that contain a serial
    number, manufacturer, and product description, and specifying whether the device
    is bus- or self-powered. If there is no EEPROM data for an item, the controller
    uses a default value. FTDI Chip provides a utility that programs the information
    into an EEPROM connected to a ’232BM or ’245BM.


