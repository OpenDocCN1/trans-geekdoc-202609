  md: '# 7


    # Device Classes


    This chapter is an introduction to the defined USB classes including how to decide
    whether a new design will fit a defined class or will require a custom driver.


    # About Classes


    Most USB devices have much in common with other devices that perform similar functions.
    All mice send information about mouse movements and button clicks. All drives
    transfer files. All printers receive data to print and send status information
    back to the host.


    When a group of devices or interfaces share many attributes or provide or request
    similar services, it makes sense to define the attributes and services in a class
    specification. The specification can serve as a guide for developers who design
    and program devices in the class and for programmers who write device drivers
    for host systems that communicate with the devices. Operating systems can provide
    drivers for common classes, eliminating the need for device vendors to provide
    drivers for devices in those classes.'
  merge: -1
  img_proc: true
- pgno: 197
  md: 'When a device in a supported class has unique features or abilities not included
    in a class''s driver, a device vendor sometimes can provide a filter driver to
    support the added features and abilities, rather than writing a complete device
    driver. In other cases, a filter driver isn''t feasible and the device requires
    a custom driver.


    Even if a device''s class isn''t supported by the operating system, a class may
    be supported in a future edition of the operating system. Firmware that complies
    with a class specification is likely to be compatible with any driver added in
    future editions of the operating system.


    # Device Working Groups


    The USB-IF releases class specifications developed by Device Working Groups, whose
    members have expertise and interest in a particular area. A special case is the
    hub class, which is defined in the main USB 2.0 specification rather than in a
    separate document. Every operating system must support the hub class because the
    host requires a root hub to do any communications.


    The defined classes cover most common device functions. A specification with a
    version number of 1.0 or higher is an approved specification and is suitable for
    use as a reference in developing devices and drivers for commercial release. Table
    7-1 lists the classes with approved specifications.


    Windows includes drivers to support many of these classes. As Windows and the
    class specifications have evolved, the number of supported classes and the level
    of support for the classes have improved. For some of the more obscure classes,
    such as Device Firmware Upgrade, Windows doesn''t provide a driver even though
    the specification was approved years ago. Chapter 4 listed the defined class codes
    devices may have in their device and interface descriptors. Table 7-2 shows the
    class drivers added in each edition of Windows.


    # Elements of a Class Specification


    All USB class specifications are based on the Common Class specification, which
    describes what information a class specification should contain and'
  merge: -1
