- pgno: 355
  md: '# Set_Report


    **Purpose:** The host sends an Output or Feature report to a HID using a control
    transfer.


    **Request Number (bRequest):** 09h


    **Source of Data:** host


    **Data Length (wLength):** length of the report


    **Contents of wValue field:** The high byte contains the report type (2=Output,
    3=Feature), and the low byte contains the report ID. The default report ID is
    zero.


    **Contents of wIndex field:** the number of the interface the request is directed
    to.


    **Contents of data packet in the Data stage:** the report


    **Comments:** If a HID interface doesn’t have an Interrupt OUT endpoint or if
    the host complies only with version 1.0 of the HID specification, this request
    is the only way the host can send data to the HID. HIDs aren’t required to support
    this request. See also Get_Report.'
  merge: -1
  img_proc: true
- pgno: 356
  md: '# Set_Idle


    **Purpose:** Saves bandwidth by limiting the reporting frequency of an interrupt
    IN endpoint when the data hasn’t changed since the last report.


    **Request Number (bRequest):** 0Ah


    **Source of Data:** no Data stage


    **Data Length (wLength):** no Data stage


    **Contents of wValue field:** The high byte sets the duration, or the maximum
    amount of time between reports. A value of zero means that the HID will send a
    report only when the report data has changed. The low byte indicates the report
    ID that the request applies to. If the low byte is zero, the request applies to
    all of the HID’s Input reports.


    **Contents of wIndex field:** the number of the interface that supports this request.


    **Contents of data packet in the Data stage:** no Data stage.


    **Comments:** The duration is in units of 4 milliseconds, which gives a range
    of 4 to 1,020 milliseconds. No matter what the duration value is, if the report
    data has changed since the last Input report sent, on receiving an interrupt IN
    token packet, the HID sends a report. If the data hasn’t changed and the duration
    time hasn’t elapsed since the last report, the HID returns NAK. If the data hasn’t
    changed and the duration time has elapsed since the last report, the HID sends
    a report. A duration value of zero indicates an infinite duration: the HID sends
    a report only if the report data has changed and responds to all other interrupt
    IN requests with NAK.


    If the HID returns a STALL in response to this request, the HID can send reports
    whether or not the data has changed. On enumerating a HID, the Windows HID driver
    attempts to set the idle rate to zero. The HID should Stall this request if an
    infinite Idle duration isn’t wanted! HIDs aren’t required to support this request
    except for keyboards using the boot protocol.


    See also Get_Idle.'
  merge: -1
  img_proc: true
- pgno: 357
  md: '# # Set_Protocol


    **Purpose:** The host specifies whether the HID should use the boot or report
    protocol.


    **Request Number (bRequest):** 0Bh


    **Source of Data:** no Data stage


    **Data Length (wLength):** no Data stage


    **Contents of wValue field:** the protocol (0 = boot protocol, 1 = report protocol).


    **Contents of wIndex field:** the number of the interface that supports this request.


    **Contents of data packet in the Data stage:** no Data stage


    **Comments:** Boot devices must support this request. See also Get_Protocol'
  merge: -1
