  img_proc: true
- pgno: 139
  md: 'bytes the host wants to transfer. For a device-to-host transfer, wLength is
    a maximum, and the device may return this number of bytes or fewer. If the wLength
    field is zero, there is no Data stage.


    # Handshake Packet


    Purpose: transmits the device’s acknowledgement.


    Sent by: the device.


    PID: ACK.


    Additional Contents: none. The handshake packet consists of the PID alone.


    Comments: If the device detects an error in the received Setup or Data packet,
    the device returns no handshake. The device’s hardware typically handles the error
    checking and sending of the ACK, with no programming required.


    # Data Stage


    When a control transfer contains a Data stage, the stage consists of one or more
    IN or OUT transactions. The device descriptor specifies the maximum number of
    data bytes in a transaction at Endpoint 0.


    When the Data stage uses IN transactions, the device sends data to the host. An
    example is the Get_Descriptor request, where the device sends a requested descriptor
    to the host. When the Data stage uses OUT transactions, the host sends data to
    the device. An example is HID-class request Set_Report, where the host sends a
    report to a device. If the wLength field in the Setup transaction is zero, there
    is no Data stage. For example, in the Set_Configuration request, the host passes
    a configuration value to the peripheral in the wValue field of the Setup stage’s
    data packet, so there’s no need for a Data stage.


    If all of the data can’t fit in one packet, the stage uses multiple transactions.
    The number of transactions required to send all of the data for a transfer equals
    the value in the Setup transaction’s wLength field divided by the wMaxPacketSize
    value in the endpoint’s descriptor, rounded up. For exam-'
  merge: -1
  img_proc: true
- pgno: 140
  md: '# Control Transfers: Structured Requests for Critical Data


    ple, in a Get_Descriptor request, if wLength is 18 and wMaxPacketSize is 8, the
    transfer requires 3 Data transactions. The transactions in the Data stage must
    all be in the same direction. When the Data stage is present but there is no data
    to transfer, the data phase consists of a zero-length data packet (the PID only).


    The host uses split transactions in the Data stage when the device is low or full
    speed and an upstream hub connects to a high-speed bus. The host may use the PING
    protocol when the device is high speed, the Data stage uses OUT transactions,
    and there is more than one data transaction.


    Each IN or OUT transaction in the Data stage contains token, data, and handshake
    packets. Here are more details about each of the packets in the Data stage''s
    transaction(s):


    # Token Packet


    **Purpose:** identifies the receiver and identifies the transaction as an IN or
    OUT transaction.


    **Sent by:** the host.


    **PID:** if the request requires the device to send data to the host, the PID
    is IN. If the request requires the host to send data to the device, the PID is
    OUT.


    **Additional Contents:** the device and endpoint addresses.


    # Data Packet


    **Purpose:** transfers all or a portion of the data specified in the wLength field
    of the Setup transaction''s data packet.


    **Sent by:** if the token packet''s PID is IN, the device sends the data packet;
    if the token packet''s PID is OUT, the host sends the data packet.


    **PID:** The first packet is DATA1. Any additional packets in the Data stage alternate
    DATA0/DATA1.


    **Additional Contents:** the data or a zero-length data packet.'
  merge: -1
  img_proc: true
- pgno: 141
  md: '# Handshake Packet


    **Purpose:** the data packet’s receiver returns status information.


    **Sent by:** the receiver of the Data stage’s data packet. If the token packet’s
    PID is IN, the host sends the handshake packet. If the token packet’s PID is OUT,
    the device sends the handshake packet.


    **PID:** Any device may return ACK (valid data was received), NAK (the endpoint
    is busy), or STALL (the request isn’t supported or the endpoint is halted). A
    high-speed device that is receiving multiple data packets may return NYET (the
    current transaction’s data was accepted but the endpoint isn’t yet ready for another
    data packet). The host can return only ACK.


    **Additional Contents:** None. The handshake packet consists of the PID alone.


    **Comments:** If the receiver detected an error in the token or data packet, the
    receiver returns no handshake packet.


    # Status Stage


    The Status stage is where the device reports the success or failure of the entire
    transfer. The purpose of the Status stage is similar to the purpose of a transaction’s
    handshake packet, and in fact the status information sometimes travels in the
    handshake packet of the Status stage. But the Status stage reports the success
    or failure of the entire transfer, rather than of a single transaction.


    In some cases (such as after receiving the first packet of a device descriptor
    during enumeration), the host may begin the Status stage before the Data stage
    has completed, and the device must detect the token packet of the Status stage,
    abandon the Data stage, and complete the Status stage.


    Here are more details about each of the packets in the Status stage’s transaction:


    # Token Packet


    **Purpose:** identifies the receiver and indicates the direction of the Status
    stage’s data packet.'
  merge: -1
  img_proc: true
- pgno: 142
  md: '# Control Transfers: Structured Requests for Critical Data


    **Sent by:** the host.


    **PID:** the opposite of the direction of the previous transaction’s data packet.
    If the Data stage’s PID was OUT or if there was no Data stage, the Status stage’s
    PID is IN. If the Data stage’s PID was IN, the Status stage’s PID is OUT.


    **Additional Contents:** the device and endpoint addresses.


    # Data Packet


    **Purpose:** enables the receiver of the Data stage’s data to indicate the status
    of the transfer.


    **Sent by:** if the Status stage’s token packet’s PID is IN, the device sends
    the data packet; if the Status stage’s token packet’s PID is OUT, the host sends
    the data packet.


    **PID type:** DATA1


    **Additional Contents:** The host sends a zero-length data packet. A device may
    send a zero-length data packet (success), NAK (busy), or STALL (endpoint halted).


    **Comments:** For most requests, a zero-length data packet sent by the device
    indicates that the requested action (if any) has been taken. An exception is Set_Address,
    which the device implements after the Status stage has completed.


    # Handshake Packet


    **Purpose:** the sender of the Data stage’s data indicates the status of the transfer.


    **Sent by:** the receiver of the Status stage’s data packet. If the Status stage’s
    token packet’s PID is IN, the host sends the handshake packet; if the token packet’s
    PID is OUT, the device sends the data packet.


    **PID type:** the device’s response may be ACK (success), NAK (busy), or STALL
    (the request isn’t supported or the endpoint is halted). The host’s response to
    a data packet received without error must be ACK.'
  merge: -1
