- pgno: 296
  md: '# Do You Need to Provide an INF File?


    Not every device requires its own INF file. Many devices that use only the system’s
    class drivers can use the INF file that Windows provides for the class. These
    are some INF files for USB classes in Windows XP:


    | Class | INF File |

    |---|---|

    | Audio | wdmaudio.inf |

    | Human Interface Device (HID) | input.inf (hiddev.inf in Windows 98) |

    | Hub | usb.inf |

    | Mass Storage | usbstor.inf |

    | Printer | usbprint.inf |

    | Smart Card | smartcrd.inf |

    | Still Image | sti.inf |


    Because Windows XP and later prefer trusted drivers, if you provide an untrusted
    driver for a device in a supported class, Windows XP and later won’t use your
    driver and instead will select a compatible ID from the class’s INF file. An INF
    file is considered part of the driver package, so if you attempt to provide an
    untrusted INF file that assigns a trusted driver to your device, Windows XP and
    later will prefer a system-provided INF file over your INF file. Any change to
    the contents of a trusted INF file causes an INF file to become untrusted, so
    you can’t add your device to an existing INF file without causing the INF file
    to become untrusted.


    When the best match is an unsigned driver, operating-system settings control whether
    Windows blocks installation, installs the driver with a warning, or installs with
    no warning. To change the setting, in Windows Control Panel, click System > Hardware
    > Driver Signing.


    A device that uses a class driver can have a custom INF file with vendor-specific
    strings that display in the Device Manager. For example, the entry for a HID can
    be a vendor-specific string such as “My Marvelous HID” instead of the default
    “USB Human Interface Device.” But using a custom INF file under Windows XP and
    later requires the device and INF file to pass WHQL tests.'
  merge: -1
  img_proc: true
- pgno: 297
  md: 'The INF files provided with Windows typically contain sections with manufacturer-specific
    information. When a device passes the WHQL tests, Microsoft often adds the device’s
    sections to an existing INF file or adds a manufacturer-specific INF file to the
    files distributed with Windows.


    Some devices, such as modems, must provide their own INF files. The Windows DDK
    has examples. A device with a vendor-specific driver must also have its own INF
    file.


    # Tools and Diagnostic Aids


    Microsoft provides several tools to help in creating and testing INF files: GenInf
    for creating files, ChkInf for testing a file’s structure and syntax, and a log
    file of events that occur during device installation.


    GenInf is a wizard that asks questions about your device and uses the information
    to create an INF file. The documentation warns that the created file is a skeleton
    that may not be fully valid and is likely to need additions or revisions. In particular,
    the generated INF files do not support older Windows editions or create multi-platform
    INF files.


    ChkINF is a Perl script that requires a Perl interpreter, which you can download
    free from www.activeware.com and other sources. The script runs from a command
    prompt and creates an HTML page that annotates an INF file with errors and warnings.


    When a device is detected, Windows uses Setup and device-installation functions
    to select a matching INF file and install the device’s drivers. The functions
    also log events and errors in a text file stored in %SystemRoot%\setupapi.log.
    The log can be useful when debugging problems with device installations. The Windows
    DDK documentation has more about how to use the logging capability.


