- pgno: 113
  md: '# Types of Descriptors


    As described earlier in this chapter, during enumeration the host uses control
    transfers to request descriptors from the device. As enumeration progresses, the
    requested descriptors concern increasingly small elements of the device: first
    the entire device, then each configuration, each configuration’s interface(s),
    and finally each interface’s endpoint(s). Table 4-1 lists the descriptor types.


    The higher-level descriptors inform the host of any additional, lower-level descriptors.
    Except for compound devices, each device has one and only one device descriptor
    that contains information about the device as a whole and specifies the number
    of configurations the device supports. Each device also has one or more configuration
    descriptors that contain information about the device’s use of power and the number
    of interfaces supported by the configuration. Each interface descriptor specifies
    zero or more endpoint descriptors that contain the information needed to communicate
    with an endpoint. Each endpoint descriptor has information about how the endpoint
    transfers data. An interface with no endpoint descriptors must use the control
    endpoint for communications.


    On receiving a request for a configuration descriptor, a device should return
    the configuration descriptor and all of the configuration’s interface, endpoint,
    and other subordinate descriptors, up to the requested number of bytes. There
    is no request to retrieve, for example, only an endpoint descriptor. Devices that
    support both full and high speeds support two additional descriptor types: device_qualifier
    and other_speed_configuration. These and their subordinate descriptors contain
    information about the device’s behavior when using the speed not currently selected.


    A string descriptor can store text such as the vendor’s or device’s name. Other
    descriptors can contain index values that point to these string descriptors, and
    the host can read the string descriptors using Get_Descriptor requests.


    In addition to the standard descriptors, a device may contain class- or vendor-specific
    descriptors. These descriptors offer a structured way for a device to provide
    more detailed information about itself. For example, an interface'
