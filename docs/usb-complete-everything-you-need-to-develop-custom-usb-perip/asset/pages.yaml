- pgno: 331
  md: "When finished using DevBroadcastDeviceInterfaceBuffer, the application should\
    \ free the memory allocated for it by AllocHGlobal:\n\n```\nMarshal.FreeHGlobal\
    \ _\n(DevBroadcastDeviceInterfaceBuffer)\n```\n\n# Capturing Device Change Messages\n\
    \nThe WindowProc function processes messages received by a form, dialog box, or\
    \ other window.\n\n# Visual C++\n\nTo receive WM_DEVICECHANGE messages, a dialog\
    \ box's message map must contain the line ON_WM_DEVICECHANGE():\n\n```\nBEGIN_MESSAGE_MAP(MyApplicationDlg,\
    \ CDialog)\n//{{AFX_MSG_MAP(MyApplicationDlg)\n.\n.\n.\n//}}AFX_MSG_MAP\nON_WM_DEVICECHANGE()\n\
    END_MESSAGE_MAP()\n```\n\n# Visual Basic\n\nThis is the code for a WndProc routine\
    \ that overrides the base form's default WndProc routine:\n\n```\nProtected Overrides\
    \ Sub WndProc(ByRef m As Message)\n\n    If m.Msg = WM_DEVICECHANGE Then\n   \
    \     OnDeviceChange(m)\n    End If\n\n    MyBase.WndProc(m)\n\nEnd Sub\n```\n\
    \nOn receiving a WM_DEVICECHANGE message, the method calls the OnDeviceChange\
    \ method and then passes the message to the WndProc method in the form's base\
    \ class."
  merge: -1
  img_proc: true
- pgno: 332
  md: "# Reading Device Change Messages\n\nOn receiving a WM_DEVICECHANGE message,\
    \ a window's OnDeviceChange method executes. The method can examine the message's\
    \ contents and take any needed action. The message contains two pointers: lParam\
    \ and wParam.\n\nThe wParam property is a code that indicates device arrival,\
    \ removal, or another event.\n\nThe lParam property is a device management structure.\
    \ There are several types of device-management structures, but all begin with\
    \ the same header, which has three members. The header is a DEV_BROADCAST_HDR\
    \ structure whose dbch_devicetype member indicates the type of device-management\
    \ structure that lParam points to.\n\nIf dbch_devicetype = DBT_DEVTYP_DEVICEINTERFACE,\
    \ the structure is a DEV_BROADCAST_INTERFACE and the application can retrieve\
    \ the complete structure, read the device path name in the dbcc_name member, and\
    \ compare the name to the device path name of the device of interest.\n\n# Visual\
    \ C++\n\nThis is the declaration for the DEV_BROADCAST_HDR structure:\n\n```\n\
    typedef struct _DEV_BROADCAST_HDR {\n    DWORD dbch_size;\n    DWORD dbch_devicetype;\n\
    \    DWORD dbch_reserved;\n} DEV_BROADCAST_HDR, *PDEV_BROADCAST_HDR;\n```"
  merge: -1
  img_proc: true
- pgno: 333
  md: "This is the code for the OnDeviceChange function:\n\n```\n```cpp\nBOOL CUSbhidiocDlg::OnDeviceChange\n\
    \    (WPARAM wParam,\n     LPARAM lParam)\n{\n    switch(wParam)\n    {\n    \
    \    case DBT_DEVICEARRIVAL:\n            // Find out if the device path name\
    \ matches\n            // wParam.\n            // If yes, perform any tasks required\n\
    \            // on device attachment.\n\n            return TRUE;\n\n        case\
    \ DBT_DEVICEREMOVECOMPLETE:\n\n            // Find out if the device path name\
    \ matches\n            // wParam.\n            // If yes, perform any tasks required\n\
    \            // on device removal.\n\n            return TRUE;\n\n        default:\n\
    \            return TRUE;\n    }\n}\n```\n```\n\n# Visual Basic\n\nThese constants\
    \ are from dbt.h:\n\n```\n```vb\nPublic Const DBT_DEVICEARRIVAL As Integer = &H8000\n\
    Public Const DBT_DEVICEREMOVECOMPLETE As Integer _\n    = &H8004\n```\n```"
  merge: -1
  img_proc: true
- pgno: 334
  md: "This is the declaration for the DEV_BROADCAST_HDR structure:\n\n```\n<StructLayout(LayoutKind.Sequential)>\
    \ _\nPublic Class DEV_BROADCAST_HDR\n    Public dbch_size As Integer\n    Public\
    \ dbch_devicetype As Integer\n    Public dbch_reserved As Integer\nEnd Class\n\
    ```\n\nThis is code to check for device arrival and removal messages:\n\n```\n\
    Friend Sub OnDeviceChange(ByVal m as Message)\n\n    If (m.WParam.ToInt32 = DBT_DEVICEARRIVAL)\
    \ Then\n\n        ' Find out if the device path name matches\n        ' wParam.\n\
    \        ' If yes, perform any tasks required\n        ' on device removal.\n\n\
    \    ElseIf (m.WParam.ToInt32 = _\n        DBT_DEVICEREMOVECOMPLETE) Then\n\n\
    \        ' Find out if the device path name matches\n        ' wParam.\n     \
    \   ' If yes, perform any tasks required\n        ' on device removal.\n\n   \
    \ End If\n\nEnd Sub\n```\n\n# Retrieving the Device Path Name in the Message\n\
    \nIf the message indicates a device arrival or removal (or another event of interest),\
    \ the application can investigate further.\n\nIn the structure that lParam points\
    \ to, if dbch_devicetype contains DBT_DEVTYP_DEVICEINTERFACE, the event relates\
    \ to a device interface. The structure in lParam is a DEV_BROADCAST_INTERFACE\
    \ structure, which begins with a DEV_BROADCAST_HDR structure. The dbcc_name member\
    \ contains the device path name of the device the message applies to."
  merge: -1
