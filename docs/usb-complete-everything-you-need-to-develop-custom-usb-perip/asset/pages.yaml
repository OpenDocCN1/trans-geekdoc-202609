- pgno: 85
  md: '# Data Size


    The maximum size of the data packet in the Data stage varies with the device’s
    speed. For low-speed devices, the maximum is 8 bytes. For full speed, the maximum
    may be 8, 16, 32, or 64 bytes. For high speed, the maximum must be 64 bytes. These
    bytes include only the information transferred in the data packet, excluding the
    PID and CRC bits.


    In the Data stage, all data packets except the last must be the maximum packet
    size for the endpoint. The maximum packet size for the Default Control Pipe is
    in the device descriptor that the host retrieves during enumeration. If there
    are other control endpoints (this is rare), the size is in the endpoint descriptor.
    If a transfer has more data than will fit in one data transaction, the host sends
    or receives the data in multiple transactions.


    In some control Read transfers, the amount of data returned by the device can
    vary. If the amount is less than the requested number of bytes and is an even
    multiple of the endpoint’s maximum packet size, the device should indicate when
    it has no more data to send by returning a zero-length data packet in response
    to the next IN token packet that arrives after all of the data has been sent.


    # Speed


    The host must make its best effort to ensure that all control transfers get through
    as quickly as possible. The host controller reserves a portion of the bus bandwidth
    for control transfers: 10 percent for low- and full-speed buses and 20 percent
    for high-speed buses. If the control transfers don’t need this much time, bulk
    transfers may use what remains. If the bus has other unused bandwidth, control
    transfers may use more than the reserved amount.


    The host attempts to parcel out the available time as fairly as possible to all
    devices. For each transfer, a single frame or microframe may contain multiple
    transactions, or the transactions may be in different (micro)frames.


    There are two opinions on whether control transfers are appropriate for transferring
    data other than enumeration and configuration data. Some say'
