  md: '# 9


    # Matching a Driver to a Device


    On detecting a newly attached USB device, the operating system needs to decide
    what driver to assign to the device. This chapter shows how Windows uses INF files
    to select a driver. I also show how the Windows Device Manager and the system
    registry store information about devices and their drivers.


    # Using the Device Manager


    Windows’ Device Manager displays information about all installed devices and presents
    a user interface for enabling, disabling, and uninstalling devices and updating
    or changing a device’s assigned driver. For developers, the Device Manager is
    useful for showing whether the correct driver is assigned and successfully installed
    and for providing a way to force Windows to forget what it knows about a device
    and start fresh.'
