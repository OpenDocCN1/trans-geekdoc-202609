  md: '# # Synch_Frame


    **Purpose:** The device sets and reports an endpoint’s synchronization frame.


    **Request Number (bRequest):** 0Ch


    **Source of Data:** host


    **Data Length (wLength):** 2


    **Contents of wValue field:** 0


    **Contents of wIndex field:** endpoint number


    **Contents of data packet in the Data stage:** frame number


    **Supported states:** Default: undefined. Address: The device returns STALL. Configured:
    OK.


    **Behavior on error:** If the endpoint doesn’t support the request, the endpoint
    should return STALL.


    **Comments:** In isochronous transfers, a device endpoint may request data packets
    that vary in size, following a sequence. For example, an endpoint may send a repeating
    sequence of 8, 8, 8, 64 bytes. The Synch_Frame request enables the host and endpoint
    to agree on which frame will begin the sequence.


    On receiving a Synch_Frame request, an endpoint returns the number of the frame
    that will precede the beginning of a new sequence.


    This request is rarely used because there is rarely a need for the information
    it provides.'
