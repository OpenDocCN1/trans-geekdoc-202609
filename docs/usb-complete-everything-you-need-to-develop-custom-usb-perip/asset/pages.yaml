    use the COM-port parameters to communicate with the ''232BM, but the driver passes
    the parameters to the ''232BM in vendor-specific requests. The ''232BM uses the
    parameters when communicating over its asynchronous serial interface.


    The Host Programming section in this chapter has more about FTDIChip''s VCP driver
    and the alternative D2XX Direct driver.


