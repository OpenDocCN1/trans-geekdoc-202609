    ready for the next IN transaction.


    # Pipes: Connecting Endpoints to the Host


    Before a transfer can occur, the host and device must establish a pipe. A USB
    pipe is an association between a device''s endpoint and the host controller''s
    software.


    The host establishes pipes during enumeration. If the device is removed from the
    bus, the host removes the no-longer-needed pipes. The host may also request new
    pipes or remove unneeded pipes at other times by requesting an alternate configuration
    or interface for a device. Every device has a Default Control Pipe that uses Endpoint
    0.


    The configuration information received by the host includes an endpoint descriptor
    for each endpoint that the device wants to use. Each endpoint descriptor is a
    block of information that tells the host what it needs to know about the endpoint
    in order to communicate with it. The information includes the endpoint address,
    the type of transfer to use, the maximum size of data packets, and, when appropriate,
    the desired interval for transfers.


    # Types of Transfers


    USB is designed to handle many types of peripherals with varying requirements
    for transfer rate, response time, and error correcting. The four types of data
    transfers each handle different needs, and a device can support the transfer types
    that are best suited for its purpose. Table 2-1 summarizes the features and uses
    of each transfer type.


    Control transfers are the only type that have functions defined by the USB specification.
    Control transfers enable the host to read information about a device, set a device''s
    address, and select configurations and other settings. Control transfers may also
    send vendor-specific requests that send and receive data for any purpose. All
    USB devices must support control transfers.'
