    # Availability


    Every device must support control transfers over the default pipe at Endpoint
    0. A device may also have additional pipes for control transfers, but in reality
    there’s no need for more than one. Even if a device needs to send a lot of control
    requests, hosts allocate bandwidth for control transfers according to the number
    and size of requests, not by the number of control endpoints, so additional control
    endpoints offer no advantage.


    # Structure


    Chapter 2 introduced control transfers and their stages: Setup, Data (optional),
    and Status. Each stage consists of one or more transactions.


    Every control transfer must have a Setup stage and a Status stage. The Data stage
    is optional, though a particular request may require a Data stage. Because every
    control transfer requires transferring information in both directions, the control
    transfer’s message pipe uses both the IN and OUT endpoint addresses.


    In a control Write transfer, the data in the Data stage travels from the host
    to the device. Control transfers that have no Data stage are also considered to
    be control Write transfers. In a control Read transfer, the data in the Data stage
    travels from the device to the host. Figure 3-1 and Figure 3-2 show the stages
    of control Read and control Write transfers at low and full speeds on a low/full-speed
    bus. There are differences, described later in this chapter, for'
