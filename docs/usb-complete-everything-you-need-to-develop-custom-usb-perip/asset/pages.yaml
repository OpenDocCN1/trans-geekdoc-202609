- pgno: 457
  md: '# Hubs: the Link between Devices and the Host


    A 1.x hub repeats all low- and full-speed packets received from the host (including
    data that has passed through one or more additional hubs) to all enabled, full-speed,
    downstream ports. Enabled ports include all ports with attached devices that are
    ready to receive communications from the hub. Devices with ports that aren’t enabled
    include devices that the host controller has stopped communicating with due to
    errors or other problems, devices in the Suspend state, and devices that aren’t
    yet ready to communicate because they have just been attached or are in the process
    of exiting the Suspend state.


    The hub repeater doesn’t translate, examine the contents of, or process the traffic
    to or from full-speed ports in any way. The hub repeater just regenerates the
    edges of the signal transitions and passes them on.


    Low-speed devices never see full-speed traffic. A 1.x hub repeats only low-speed
    packets to low-speed devices. The hub identifies a low-speed packet by the PRE
    packet identifier that precedes the packet. The hub repeats the low-speed packets,
    and only these packets, to any enabled low-speed ports. The hub also repeats low-speed
    packets to its full-speed downstream ports, because a full-speed port may connect
    to a hub that in turn connects to a low-speed device. To give the hubs time to
    make their low-speed ports ready to receive data, the host adds a delay of at
    least four full-speed bit widths between the PRE packet and the low-speed packet.


    Compared to full speed, traffic in a low-speed cable segment varies not only in
    speed, but also in edge rate and polarity. The hub nearest to a low-speed device
    uses low speed’s edge rate and polarity when communicating with the device. When
    communicating upstream, the hub uses full-speed’s faster edge rate and an inverted
    polarity compared to low speed. The hub repeater converts between the edge rates
    and polarities as needed. Chapter 18 has more on the signal polarities, and Chapter
    19 has more about edge rates.


    # The High-speed Repeater


    A 2.0 hub uses a high-speed repeater when the hub’s upstream port connects to
    a high-speed bus segment. When this is the case, the hub sends and receives all
    upstream traffic at high speed, even if the traffic is to or from a'
  merge: -1
  img_proc: true
- pgno: 458
  md: 'low- or full-speed device. The path that traffic takes through a hub with a
    high-speed repeater depends on the speeds of the attached devices. Routing logic
    in the hub determines whether traffic to or from a downstream port passes through
    a transaction translator.


    Unlike a low- and full-speed repeater, a high-speed repeater re-clocks received
    data to minimize accumulated jitter. In other words, instead of just repeating
    received transitions, a high-speed repeater extracts the data and uses its own
    local clock to time the transitions when retransmitting. The edge rate and polarity
    are unchanged. An elasticity buffer allows for small differences between the two
    clock frequencies. When the buffer is half full, the received data begins to be
    clocked out.


    High-speed devices don’t use the transaction translator. Traffic is routed from
    the receiving port on the hub, through the high-speed repeater, to the hub’s transmitting
    port.


    For traffic to and from low- and full-speed devices, the high-speed repeater communicates
    with the transaction translator that manages the transactions with the devices.
    Traffic received from upstream is routed to the high-speed repeater, then passes
    through the transaction translator, which communicates at the appropriate speed
    with the downstream ports. In the other direction, traffic from low- and full-speed
    devices is routed to the transaction translator, which processes the received
    data and takes appropriate action as described in the next section.


    # The Transaction Translator


    Every 2.0 hub must have a transaction translator to manage communications with
    low- and full-speed devices. The transaction translator communicates upstream
    at high speed but enables 1.x devices to communicate at low and full speeds in
    exactly the same way as they do with 1.x hosts. The transaction translator stores
    received data and then forwards the data on toward its destination at a different
    speed.


    The transaction translator frees bus time by enabling other bus communications
    to occur while a device is completing a low- or full-speed transaction.'
  merge: -1
  img_proc: true
- pgno: 459
  md: '# Hubs: the Link between Devices and the Host


    ![](img/3955d77b6be34048e3bc722d0b15c2a9_459_0.png)


    Figure 15-3: A transaction translator contains a high-speed handler for upstream
    traffic, buffers for storing information in split transactions, and a low- and
    full-speed handler for downstream traffic to low- and full-speed devices.


    Transaction translators can also enable low- and full-speed devices to use more
    bandwidth than they would have on a shared 1.x bus.


    # Sections


    The transaction translator contains three sections (Figure 15-3). The high-speed
    handler communicates with the host at high speed. The low/full-speed handler communicates
    with devices at low and full speeds. Buffers store data used in transactions with
    low- and full-speed devices. Each transaction translator has to have at least
    four buffers: one for interrupt and isochronous start-split transactions, one
    for interrupt and isochronous complete-split transactions, and two or more for
    control and bulk transfers.


    # Managing Split Transactions


    When a 2.0 host on a high-speed bus wants to communicate with a low- or full-speed
    device, the host initiates a start-split transaction with the 2.0 hub that is
    nearest the device and communicating upstream at high speed. One or more start-split
    transactions contain the information the hub needs to'
  merge: -1
  img_proc: true
- pgno: 460
  md: 'complete the transaction with the device. The transaction translator stores
    the information received from the host and completes the start-split transaction
    with the host.


    On completing a start-split transaction, the hub performs the function of a host
    controller in carrying out the transaction with the device. The transaction translator
    initiates the transaction in the token phase, sends data or stores returned data
    or status information as needed in the data phase, and sends or receives a status
    code as needed in the handshake phase. The hub uses low or full speed, as appropriate,
    in its communications with the device.


    After the hub has had time to exchange data with the device, in all transactions
    except isochronous OUTs, the host initiates one or more complete-split transactions
    to retrieve the information returned by the device and stored in the transaction
    translator''s buffer. The hub performs these transactions at high speed.


    Figure 15-4 shows the transactions that make up a split transaction. Table 15-1
    compares the structure and contents of transactions with low- and full-speed devices
    at different bus speeds.


    In explaining how split transactions work, I''ll start with bulk and control transfers,
    which don''t have the timing constraints of interrupt and isochronous transfers.
    In the start-split transaction, the 2.0 host sends the start-split token packet
    (SSPLIT), followed by the usual low- or full-speed token packet, and any data
    packet destined for the device. The 2.0 hub that is nearest the device and communicating
    upstream at high speed returns ACK or NAK. The host is then free to use the bus
    for other transactions. The device knows nothing about the transaction yet.


    On returning ACK in a start-split transaction, the hub has two responsibilities.
    The hub must complete the transaction with the device. And the hub must continue
    to handle any other bus traffic received from the host or other attached devices.


    To complete the transaction, the hub converts the packet or packets received from
    the host to the appropriate speed, sends them to the device and stores the data
    or handshake returned by the device. Depending on the transac-'
