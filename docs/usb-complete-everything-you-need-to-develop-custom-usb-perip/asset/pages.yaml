- pgno: 453
  md: '# 15


    # Hubs:

    the Link between

    Devices and the Host


    Every USB peripheral must connect to a hub. As Chapter 1 explained, a hub is an
    intelligent device that provides attachment points for devices and manages each
    device’s connection to the bus. Devices that plug directly into a PC connect to
    the root hub. Other devices connect to external hubs downstream from the root
    hub.


    A hub’s main jobs are managing its devices’ connections and power and passing
    traffic to and from the host. Managing the connections includes helping to get
    newly attached devices up and communicating and blocking communications from misbehaving
    devices so they don’t interfere with other communications on the bus. Managing
    power includes providing the requested bus current to attached devices. The hub’s
    role in passing traffic to and from the host depends on the speed of the host,
    the device, and the'
  merge: -1
  img_proc: true
- pgno: 454
  md: '![](img/3955d77b6be34048e3bc722d0b15c2a9_454_0.png)


    Figure 15-1: A hub has one upstream port and one or more downstream ports.


    hubs between them. A hub may just repeat what it receives or it may convert the
    traffic to a different speed and manage transactions with the device.


    This chapter presents essentials about hub communications. You don''t need to
    know every detail about hubs in order to design a USB peripheral. Host applications
    and device drivers and device firmware don''t have to know or care how many hubs
    are between the host and a device. But some understanding of what the hub does
    can help in understanding how devices are detected and communicate on the bus.


    # Hub Basics


    Each external hub has one port, or attachment point, that connects in the upstream
    direction (toward the host) (Figure 15-1). This upstream port may connect directly
    to the host''s root hub, or the port may connect to a downstream port on another
    external hub. Each hub also has one or more ports downstream from the host. Most
    downstream ports have a connector for attaching a cable. An exception is a hub
    that is part of a compound device whose ports connect to functions embedded in
    the device. Hubs with one, two, four, and seven downstream ports are common. A
    hub may be self-powered or bus-powered. As Chapter 16 explains, bus-powered hubs
    are limited because you can''t attach high-power devices to them.'
  merge: -1
