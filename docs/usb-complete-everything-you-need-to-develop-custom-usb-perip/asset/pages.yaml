  md: '# Defined Classes


    The following sections introduce the defined classes. I don’t attempt to repeat
    every detail in the specification documents. Instead, my goal is to give enough
    information to help you decide what class a new design might fit into, what resources
    a device requires to support a class’s communications, examples of device controllers
    to use for devices in the class, and what level of support, if any, to expect
    for the class under Windows.


    # Audio


    The audio class is for devices that send or receive audio data, which may contain
    encoded voice, music, or other sounds. Audio functions are often part of a device
    that also supports video, storage, or other functions. Audio devices can use isochronous
    transfers for audio streams or bulk transfers for data encoded using the MIDI
    (Musical Instrument Digital Interface) protocol.


    This section describes version 1.0 of the audio specification. At this writing,
    version 2.0 is under development. Version 2.0 will not be backwards compatible
    with version 1.0. In other words, a 2.0 device won’t work with a 1.0 host driver.
    The proposed changes in version 2.0 include complete support for high-speed operation,
    use of the interface association descriptor, and support for many new capabilities
    and controls.


    # Documentation


    The audio specification has separate Device Class Definition documents for Audio
    Devices, Audio Data Formats, Terminal Types, and MIDI Devices. At this writing,
    the latest version of each of these is 1.0. The MIDI standard is available from
    the MIDI Manufacturers Association at www.midi.org.


    # Overview


    Each audio function in a device has an Audio Interface Collection that consists
    of one or more interfaces. The interfaces include one AudioControl (AC) interface,
    zero or more AudioStreaming (AS) interfaces and zero or more MIDIS streaming (MS)
    interfaces (Figure 7-1). In other words, every'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'Audio Interface Collection has an AudioControl interface, while AudioStreaming
    and MIDIS streaming interfaces are optional.


    An AudioControl interface can enable accessing controls such as volume, mute,
    bass, and treble. An AudioStreaming interface transfers audio data in isochronous
    transfers. A MIDIS streaming interface transfers MIDI data. MIDI is a standard
    for controlling synthesizers, sound cards, and other electronic devices that generate
    music and other sounds. A MIDI representation of a sound includes values for pitch,
    length, volume, and other characteristics. A pure MIDI hardware interface carries
    asynchronous data at 31.25 kilobits/sec. A USB interface that carries MIDI data
    uses the MIDI data format but doesn’t use MIDI’s asynchronous interface. Instead,
    the MIDI data travels on the bus in bulk transfers.


    A device can have multiple Audio Interface Collections that are active at the
    same time, with each collection controlling an independent audio function.


    # Descriptors


    Each audio interface type uses standard and class-specific descriptors to enable
    the host to learn about the interface, its endpoints, and what kinds of data the
    endpoints expect to transfer.


    ![](img/3955d77b6be34048e3bc722d0b15c2a9_201_0.png)


    Figure 7-1: Each audio function has an Audio Interface Collection that contains
    one or more interfaces.'
