    # Load Firmware from the Host.


    The core can also read identifying bytes from the EEPROM on power up and provide
    this information to the host during enumeration. If the first value read from
    the EEPROM is B0h, the core reads EEPROM bytes containing the chip''s Vendor ID,
    Product ID, and release number. On device attachment or system boot up, the host
    uses these bytes to find a matching INF file that identifies a driver for the
    device. The driver contains firmware to download to the device before re-enumerating.
    Cypress provides instructions for building a driver with this ability.


    The driver uses the vendor-specific Firmware Load request to download the firmware
    to the device. The firmware contains a new set of descriptors and the code the
    device will run. For example, a HID-class device will have report descriptors
    and code for transferring HID report data.


    On completing the download, the driver causes the chip to exit the reset state
    and run the firmware. By writing to a register that controls the chip''s'
