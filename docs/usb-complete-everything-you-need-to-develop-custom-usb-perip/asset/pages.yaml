    # Emulating a Device with a PC.


    Another option that can be useful in the early stages of developing is using a
    PC to emulate a device. You can use the compilers, debuggers, and other software
    tools you’re familiar with on your PC and compile, run, and debug the device code
    on the PC.


    PLX Technology’s NET2272 PCI-RDK is a development kit that enables using a PC
    as a device when developing code using PLX Technology’s NET2272 USB interface
    chip. The kit includes a PCI card with a header that attaches to a daughter card
    that contains a NET2272. You can install the PCI card in a PC and write applications
    that perform the role of device firmware that communicates with the interface
    chip. The application can run as a console application on the PC.'
