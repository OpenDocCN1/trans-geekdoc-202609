- pgno: 163
  md: 'NET2272, the CPU accesses the buffers by reading and writing to registers,
    while others, such as Cypress Semiconductor’s EZ-USB, reserve a portion of data
    memory for the buffers.


    Buffers that hold transmitted or received data are often structured as FIFO (first
    in, first out) buffers. Each read of a receive FIFO returns the byte that has
    been in the buffer the longest. Each write to a transmit FIFO stores a byte that
    will transmit after all of the bytes already in the buffer have transmitted. An
    internal pointer to the next location to be read or written to increments automatically
    as the firmware reads or writes to the FIFO.


    In some chips, such as Cypress’ enCoRe series, the USB buffers are in ordinary
    data memory and the firmware explicitly selects each location to read and write
    to. There is no pointer that increments automatically when the firmware reads
    or writes to the buffers. The bytes in the USB transmit buffer go out in order
    from the lowest address to the highest, and the bytes in a USB receive buffer
    are stored in the order they arrive, from lowest address to highest. These buffers
    technically aren’t FIFOs, but are sometimes called that anyway.


    To enable faster transfers, some chips have double buffers that can store two
    full sets of data in each direction. While one block is transmitting, the firmware
    can write the next block of data into the other buffer so the data will be ready
    to go as soon as the first block finishes transmitting. In the receive direction,
    the extra buffer enables a new transaction’s data to arrive before the firmware
    has finished processing data from the previous transaction. The hardware automatically
    switches, or ping-pongs, between the two buffers. Some high-speed controllers,
    such as Cypress’ EZ-USB FX2 series, support quadruple buffers.


    # Configuration, Status, and Control Information


    USB controller chips typically have registers that hold information about what
    endpoints are enabled, the number of bytes received, the number of bytes ready
    to transmit, Suspend-state status, error-checking information, and other information
    about how the interface will be used and the current status of transmitted or
    received data. For example, setting a bit in a config-'
  merge: -1
  img_proc: true
- pgno: 164
  md: 'uration register may enable an endpoint. The number of registers, their contents,
    and how to access them vary with the chip family. Because these details vary with
    the chip or chip family, the low-level device firmware for USB communications
    is specific to each chip or chip family.


    # Clock


    USB communications require a timing source, typically provided by a crystal oscillator.
    Low-speed devices can sometimes use a less expensive ceramic resonator. Some controllers
    have on-chip clock circuits and don’t require an external timing source.


    # Other Device Components


    In addition to a USB interface, the circuits in a typical USB device include a
    CPU, program and data memory, other I/O interfaces, and additional features such
    as timers and counters. These circuits may be in the controller chip or in separate
    components.


    # CPU


    A USB device’s CPU controls the chip’s actions by executing instructions in the
    firmware stored in the chip. If the USB controller has a CPU on-chip, the CPU
    may be based on a general-purpose microcontroller such as the 8051 or PICMicro,
    or the CPU may be an architecture developed specifically for USB applications.
    An interface-only USB controller can interface to any CPU with a compatible interface.


    # Program Memory


    The program memory holds the code that the CPU executes. The program code assists
    in USB communications and carries out whatever other tasks the chip is responsible
    for. This memory may be in the microcontroller or in a separate chip.


    The program storage may use any of a number of memory types: ROM, EPROM, EEPROM,
    Flash memory, or RAM. All except RAM (unless it’s battery-backed) are nonvolatile;
    the memory retains its data after powering down. The amount of program memory
    may range from a couple of kilo-'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'bytes on up. Chips that can access memory off-chip may support a Megabyte or
    more of program memory.


    Another name for the code stored in program memory is firmware, which indicates
    that the memory is non-volatile and not as easily changed as program code that
    can be loaded into RAM, edited, and re-saved on disk. In this book, I use the
    term firmware to refer to a controller’s program code, with the understanding
    that the code may be stored in a variety of memory types, some more volatile than
    others.


    ROM (read-only memory) must be mask-programmed at the factory and can’t be erased.
    It’s practical only for product runs in the thousands.


    EPROM (erasable programmable ROM) is user-programmable. Many chips have inexpensive
    programming hardware and software available. To erase an EPROM, you insert the
    chip into an EPROM eraser, which exposes the circuits beneath the chip’s quartz
    window to ultraviolet light. Data sheets rarely specify the number of erase/reprogram
    cycles that the chip can withstand, but it’s typically at least 100.


    OTP (one-time programmable) PROMs are a cheaper, non-erasable alternative to erasable
    EPROMs. Internally, they’re identical to EPROMs, and you program them exactly
    like EPROMs. The difference is that the chips lack the window for erasing. The
    erasable varieties are useful for product development. Then to save cost, you
    can switch to OTP PROMs for the final product run. Many microcontrollers have
    both EPROM and OTP PROM variants.


    Flash memory is another electrically-erasable memory technology that is popular
    because it doesn’t need a quartz window and often doesn’t need the special programming
    voltage required by other EPROMs. Current Flash-memory technology enables around
    100,000 erase/reprogram cycles. Because Flash memory is easily reprogrammable,
    it’s handy for making changes during project development and for programming the
    final firmware in low-volume projects


    EEPROM (electrically erasable PROM) also doesn’t need a window, nor does it need
    the special programming voltage required by other EPROMs. EEPROMs tend to have
    longer access times than Flash memory. EEPROMs'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'are available both with the parallel interface used by EPROMs and Flash memory,
    and with a variety of synchronous serial interfaces: Microwire, I²C, and SPI.
    Serial EEPROMs are useful for storing small amounts of data that changes only
    occasionally, such as configuration data, including the Vendor ID and Product
    ID. Cypress’ EZ-USB controllers can store their firmware in a serial EEPROM and
    load the firmware into RAM on powering up. Current EEPROM technology enables around
    10 million erase/reprogram cycles.


    RAM (random-access memory) can be erased and rewritten endlessly, but the stored
    data disappears when the chip powers down. It’s possible to use RAM for program
    storage by using battery backup or by loading the code from a PC on each power-up.
    Any CPU with external program memory can use battery-backed RAM for program storage.
    Cypress Semiconductor’s EZ-USB chips can use RAM for program storage, along with
    special hardware and driver code that loads code into the chip on power up or
    attachment. Host-loadable RAM has no limit on the number of erase/rewrite cycles.
    For battery-backed RAM, the limit is the battery life. Access times for RAM are
    fast.


    # Data Memory


    Data memory provides temporary storage during program execution. The contents
    of data memory may include data received from the USB port, data to be sent to
    the USB port, values to be used in calculations, or anything else the chip needs
    to remember or keep track of. Data memory is usually RAM. Typical amounts of internal
    data memory are 128 to 1024 bytes.


    # Other I/O


    Every USB controller has an interface to the world outside of itself in addition
    to the USB port. An interface-only chip must have a local bus or other interface
    to the device’s CPU. (An exception is FTDI Chip’s controllers used in Bit Bang
    mode to implement basic inputs and outputs.) Most chips also have a series of
    general-purpose input and output (I/O) pins that can connect to other circuits.
    A chip may have built-in support for other serial interfaces, such as an asynchronous
    interface for RS-232, or synchronous'
  merge: -1
  img_proc: true
- pgno: 167
  md: 'interfaces such as I²C, Microwire, and SPI. Some chips have special-purpose
    interfaces. For example, the Philips UDA1325 is a stereo USB codec for audio applications
    and contains an I²S (Inter-IC Sound) digital stereo playback input and output.


    # Other Features


    A device controller chip may have additional features such as hardware timers,
    counters, analog-to-digital and digital-to-analog converters, and pulse-width-modulation
    (PWM) outputs. Just about anything that you might find in a general-purpose microcontroller
    is likely to be available in a USB device controller.


    # Simplifying Device Development


    In selecting a chip for a project, an obvious consideration is finding a controller
    that meets the hardware requirements of the product being designed. In addition,
    project development will be easier and quicker if you select a controller chip
    with all of the following:


    +   - A chip architecture and programming language that you’re familiar with.

    +   - Detailed and well-organized hardware documentation.

    +   - Well-documented, bug-free example firmware for an application similar to
    yours.

    +   - A development system that enables easy downloading and debugging of firmware.


    In addition, your project will progress more quickly if the host system can use
    a class driver included with the operating system or a well-documented and bug-free
    driver provided by the chip vendor or another source and usable as-is or with
    minimal modifications.


    These are not trivial considerations! The right choices will save you many hours
    and much aggravation.'
  merge: -1
  img_proc: true
