    # The Circuits


    Figure 19-4 shows upstream-facing transceiver circuits in a high-speed-capable
    device, and Figure 19-5 shows downstream-facing transceiver circuits in a 2.0
    hub.


    High speed requires its own drivers, so a high-speed device must contain two sets
