- pgno: 378
  md: 'The bit functions are the same for Input, Output, and Feature items, except
    that Input items don''t support the volatile/non-volatile bit. These are the uses
    for each bit:


    **Data | Constant.** Data means that the contents of the item are modifiable (read/write).
    Constant means the contents are not modifiable (read-only).


    **Array | Variable.** This bit specifies whether the data reports the state of
    every control (Variable) or just reports the states of controls that are asserted,
    or active (Array). Reporting only the asserted controls results in a more compact
    report for devices such as keyboards, where there are many controls (keys) but
    only one or a few are asserted at the same time.


    For example, if a keypad has eight keys, setting this bit to Variable would mean
    that the keypad''s report would contain a bit for each key. In the report descriptor,
    the report size would be one bit, the report count would be eight, and the total
    amount of data sent would be eight bits. Setting the bit to Array would mean that
    each key has an assigned index, and the keypad''s report would contain only the
    indexes of keys that are pressed. With eight keys, the report size would be three
    bits, which can report a key number from 0 through 7. The report count would equal
    the maximum number of simultaneous keypresses that could be reported. If the user
    can press only one key at a time, the report count would be 1 and the total amount
    of data sent would be just 3 bits. If the user can press all of the keys at once,
    the report count would be 8 and the total amount of data sent would be 24 bits.


    An out-of-range value reported for an Array item indicates that no controls are
    asserted.


    **Absolute | Relative.** Absolute means that the value is based on a fixed origin.
    Relative means that the data indicates the change from the last reading. A joystick
    normally reports absolute data (the joystick''s current position), while a mouse
    reports relative data (how far the mouse has moved since the last report).


    **No Wrap | Wrap.** Wrap indicates that the value rolls over to the minimum if
    the value continues to increment after reaching its maximum and that the value
    rolls over to the maximum if the value continues to decrement after reaching its
    minimum. An item specified as No Wrap that exceeds the spec-'
  merge: -1
  img_proc: true
- pgno: 379
  md: 'ified limits may report a value outside the limits. This bit doesn’t apply
    to Array data.


    # Linear | Non-linear.


    Linear indicates that the measured data and the reported value have a linear relationship.
    In other words, a graph of the reported data and the property being measured forms
    a straight line. In non-linear data, a graph of the reported data and the property
    being measured forms a curve. This bit doesn’t apply to Array data.


    # Preferred State | No Preferred State.


    Preferred state indicates that the control will return to a particular state when
    the user isn’t interacting with it. A momentary pushbutton has a preferred state
    (out) when no one is pressing the button. A toggle switch has no preferred state
    and remains in the last state selected by a user. This bit doesn’t apply to Array
    data.


    # No Null Position | Null State.


    Null state indicates that the control supports a state where the control isn’t
    sending meaningful data. A control indicates that it’s in the null state by sending
    a value outside the range defined by its Logical Minimum and Logical Maximum.
    No Null Position indicates that any data sent by the control is meaningful data.
    A hat switch on a joystick is in a null position when it isn’t being pressed.
    This bit doesn’t apply to Array data.


    # Non-volatile | Volatile.


    The Volatile bit applies only to Output and Feature report data. Volatile means
    that the device can change the value on its own, without host interaction, as
    well as when the host sends a report requesting the device to change the value.
    For example, a control panel may have a control that users can set in two ways.
    A user may use a mouse to click a button on the screen to cause the host to send
    a report to the device, or a user may press a physical button on the device. Non-volatile
    means that the device changes the value only when the host requests a new value
    in a report.


    When the host is sending a report and doesn’t want to change a volatile item,
    the value to assign to the item depends on whether the data is defined as relative
    or absolute. If a volatile item is defined as relative, a report that assigns
    a value of 0 should result in no change. If a volatile item is defined as absolute,
    a report that assigns an out-of-range value should result in no change.'
  merge: -1
  img_proc: true
- pgno: 380
  md: 'This bit doesn’t apply to Array data.


    **Bit Field | Buffered Bytes.** Bit Field means that each bit or a group of bits
    in a byte can represent a separate piece of data and the byte doesn’t represent
    a single quantity. The application interprets the contents of the field. Buffered
    Bytes means that the data consists of one or more bytes. The report size for Buffered
    Byte items must be eight. This bit doesn’t apply to Array data. Note that this
    bit is bit 8 in the item’s data so using this bit requires two data bytes in the
    item.


    # Collection and End Collection Items


    All of the report types can use Collection and End Collection items to group related
    items.


    The three defined types of collections are application, physical, and logical.
    Vendors can also define collection types. Collections can be nested. Table 12-2
    shows the values of the Collection and End Collection tags and the defined values
    for the different collection types.


    An application collection contains items that have a common purpose or that together
    carry out a single function. For example, the boot descriptor for a keyboard groups
    the keypress and LED data in an application collection. All report items must
    be in an application collection.


    A physical collection contains items that represent data at a single geometric
    point. A device that collects a variety of sensor readings from multiple locations
    might group the data for each location in a physical collection. The boot descriptor
    for a mouse groups the button and position indicators in a physical collection.


    A logical collection forms a data structure consisting of items of different types
    that are linked by the collection. An example is the contents of a data buffer
    and a count of the number of bytes in the buffer.


    Each collection begins with a Collection item and ends with an End Collection
    item. All Main items between the Collection and End Collection items are part
    of the collection. Each collection must have a Usage tag (described below).'
  merge: -1
  img_proc: true
- pgno: 381
  md: 'Table 12-2: Data values for the Collection and End Collection Main Item Tags.


    | Main Item Type | Value | Description |

    |---|---|---|

    | Collection (A1h) | 00h | Physical |

    |  | 01h | Application |

    |  | 02h | Logical |

    |  | 03h-7Fh | Reserved |

    |  | 80h-FFh | Vendor-defined |

    | End Collection (C0h) | None | Closes a collection |


    A top-level collection is a collection that isn''t nested within another collection.
    A HID interface can have more than one top-level collection, with each top-level
    collection representing a different HID. For example, a keyboard with an embedded
    pointing device can have a HID interface with two top-level collections, one for
    the pointing-device''s reports and one for the keyboard''s reports. Unlike HIDs
    in separate interfaces, these HIDs share interrupt endpoints.


    If a report contains an unknown vendor-defined collection type, the host should
    ignore all Main items in the collection. If a known collection type has an unknown
    Usage, the host should ignore all items in the collection.


    # The Global Item Type


    Global items identify reports and describe the data in them, including characteristics
    such as the data''s function, maximum and minimum allowed values, and the size
    and number of report items. A Global item tag applies to every item that follows
    until the next Global tag. To save storage space in the device, the report descriptor
    doesn''t have to repeat values that don''t change from one item to the next. There
    are 12 defined Global items, shown in Table 12-3. The following sections describe
    the items in more detail.


    # Identifying the Report


    **Report ID.** This value can identify a specific report. A HID can support multiple
    reports of the same type, with each report having its own report'
  merge: -1
  img_proc: true
- pgno: 382
  md: 'Table 12-3: There are twelve defined Global items.


    | Global Item Type | Value (nn indicates the number of bytes that follow) | Description
    |

    |---|---|---|

    | Usage Page | 000001nn | Specifies the data''s usage or function. |

    | Logical Minimum | 000101nn | Smallest value that an item will report. |

    | Logical Maximum | 001001nn | Largest value that an item will report. |

    | Physical Minimum | 001101nn | The logical minimum expressed in physical units.
    |

    | Physical Maximum | 010001nn | The logical maximum expressed in physical units.
    |

    | Unit exponent | 010101nn | Base 10 exponent of units. |

    | Unit | 011001nn | Unit values. |

    | Report Size | 011101nn | Size of an item''s fields in bits. |

    | Report ID | 100001nn | Prefix that identifies a report. |

    | Report Count | 100101nn | The number of data fields for an item. |

    | Push | 101001nn | Places a copy of the global item state table on the stack.
    |

    | Pop | 101101nn | Replaces the item state table with the last structure pushed
    onto the stack. |

    | Reserved | 110001nn to 111101nn | For future use. |


    ID, contents, and format. This way, a transfer doesn''t have to include every
    piece of data every time. Often, however, the simplicity of having a single report
    is more important than the need to reduce the bandwidth used by longer reports.


    In a report descriptor, a Report ID item applies to all items that follow until
    the next Report ID. If there is no Report ID item, the default ID of zero is assumed.
    A descriptor should not declare a Report ID of zero. The Report IDs are specific
    to each report type, so a HID can have one report of each type with the default
    ID. However, if at least one report type uses multiple report IDs, every report
    in the HID must have a declared ID. For example, if an interface supports Report
    ID 1 and Report ID 2 for Feature reports, any Input or Output reports must also
    have a Report ID greater than zero.


    In a transfer that uses a Set_Report or Get_Report request, the host specifies
    a report ID in the Setup transaction, in the low byte of the wValue field. In'
  merge: -1
  img_proc: true
- pgno: 383
  md: 'an interrupt transfer, if the interface supports more than one report ID, the
    report ID precedes the report data on the bus. If the interface supports only
    the default report ID of zero, the report ID isn’t sent with the report when using
    interrupt transfers.


    Under Windows, the report buffer provided to an API call must be large enough
    to hold the report plus one byte for the report ID. When a HID supports multiple
    report IDs for Input reports of different sizes, the Windows HID driver requires
    applications to use a buffer large enough to hold the longest report. When the
    HID supports multiple reports of the same type and different sizes and the HID
    is sending a report whose data is a multiple of the endpoint’s maximum packet
    size, the HID indicates the end of the report data by sending a zero-length data
    packet


    For Input reports when there are multiple Input Report IDs, the host’s driver
    has no way to request a specific report from the HID. On receiving the IN token
    packet, the device returns whatever report is in its buffer. In other words, the
    device firmware decides which report to send. At the host, the HID driver stores
    the received report and its report ID in a buffer.


    # Describing the Data’s Use


    The Global items that describe the data and how it will be used are Usage Page,
    Logical and Physical Maximums and Minimums, Unit, and Unit Exponent. Each of these
    items helps the receiver of the report interpret the report’s data. All but the
    Usage Page are involved with converting raw report data to values with units attached.
    The items make it possible for a report to contain data in a compact form, with
    the receiver of the data responsible for converting the data to meaningful values.
    However, the sender of the report data may instead choose to do some or all of
    the converting.


    **Usage Page.** An item’s Usage is a 32-bit value that identifies a function that
    a device performs. A Usage contains two values: the upper 16 bits are a Global
    Usage Page item and the lower 16 bits are a Local Usage item. The value in the
    Local Usage item is a Usage ID. The term *Usage* can refer to either the 32-bit
    value or the 16-bit Local value. To prevent confusion, some sources use the term
    Extended Usage to refer to the 32-bit value. In Microsoft’s doc-'
  merge: -1
  img_proc: true
- pgno: 384
  md: 'umentation, the USAGE type is a 16-bit value that can contain a Usage Page
    or a Usage ID.


    Multiple items can share a Usage Page while having different Usage IDs. After
    a Usage Page appears in a report, all Usage IDs that follow use that Usage Page
    until a new Usage Page is declared.


    The HID Usage Tables document lists the defined Usage Pages and their values and
    also names the section or other document that describes each page and its indexes.
    There are Usage Pages for many common device types, including generic desktop
    controls (mouse, keyboard, joystick), digitizer, bar-code scanner, camera control,
    and various game controls. In specialized devices that don’t have a defined Usage
    Page, a vendor can define the Usage Page using values from FF00h to FFFFh.


    # Logical Minimum and Logical Maximum.


    The Logical Minimum and Logical Maximum define the limits for reported values.
    The limits are expressed in “logical units,” which means that they use the same
    units as the values they describe. For example, if a device reports readings of
    up to 500 milliamperes in units of 2 milliamperes, the Logical Maximum is 250.


    If the most significant bit of the highest byte is 1, the value is negative, expressed
    as a two’s complement. (To find the negative value represented by a two’s complement,
    complement each bit and add 1 to the result.) Using 1-byte values, 00h to 7Fh
    are the positive decimal values 0 through 127, and FFh to 80h are the negative
    decimal values -1 through -128.


    The HID specification says that if both the Logical Minimum and Logical Maximum
    are considered positive, there’s no need for a sign bit. But the report-descriptor
    test in the USB-IF Compliance Tool assumes that if the most-significant bit is
    1, the value is negative. These values will fail the compliance test because the
    Logical Minimum (0) is greater than the Logical Maximum (-1):


    ```

    0x15 0x00    // Logical Minimum

    0x25 0xFF    // Logical Maximum WRONG!

    ```


    If the desired result is a minimum of zero and a maximum of 255, the solution
    is to use a 2-byte value for the maximum:'
  merge: -1
  img_proc: true
- pgno: 385
  md: '```

    0x15 0x00   // Logical Minimum

    0x26 0x00FF   // Logical Maximum

    ```


    Note that the Logical Maximum item tag is now 26h to indicate that the data that
    follows the tag is two bytes. Because the most-significant bit of the Logical
    Maximum is zero, the value is assumed to be positive and the compliance test accepts
    the values as valid.


    # Converting Units


    The Physical Minimum, Physical Maximum, Unit Exponent, and Unit items define how
    to convert reported values into more meaningful units.


    **Physical Minimum and Physical Maximum.** The Physical Minimum and Physical Maximum
    define the limits for a value when expressed in the units defined by the Units
    tag. In the earlier example of values of 0 through 250 in units of 2 milliamperes,
    the Physical Minimum is 0 and the Physical Maximum is 500. The receiving device
    uses the logical and physical limit values to obtain the value in the desired
    units. In the example, reporting the data in units of 2 milliamperes means that
    the value can transfer in a single byte, with the receiver of the data using the
    Physical Minimum and Maximum values to translate to milliamperes. The price is
    a loss in resolution, compared to reporting 1 bit per milliampere. If the report
    doesn’t specify the values, they default to the same as the Logical Minimum and
    Logical Maximum.


    **Unit Exponent.** The Unit Exponent specifies what power of 10 to apply to the
    value obtained after using the logical and physical limits to convert the value
    into the desired units. The exponent can range from -8 to +7. A value of 0 causes
    the value to be multiplied by 10⁰, or 1, which is the same as applying no exponent.
    These are the codes:


    | Exponent | 0 | 1 | 2 | 3 | 4 | 5 | 6 | 7 | -8 | -7 | -6 | -5 | -4 | -3 | -2
    | -1 |

    | Code | 00h | 01h | 02h | 03h | 04h | 05h | 06h | 07h | 08h | 09h | 0Ah | 0Bh
    | 0Ch | 0Dh | 0Eh | 0Fh |


    For example, if the value obtained is 1234 and the Unit Exponent is 0Eh, the final
    value is 12.34.'
  merge: -1
  img_proc: true
- pgno: 386
  md: 'Unit. The Unit tag specifies what units to apply to the report data after the
    value is converted using the Physical and Unit Exponent items. The HID specification
    defines codes for the basic units of length, mass, time, temperature, current,
    and luminous intensity. Most other units can be derived from these.


    Specifying a Unit value can be more complicated than you might expect. Table 12-4
    shows values you can work from. The value can be as long as four bytes, with each
    nibble having a defined function. Nibble 0 (the least significant nibble) specifies
    the measurement system, either English or SI (International System of Units) and
    whether the measurement is in linear or angular units. Each of the nibbles that
    follow represents a quality to be measured, with the value of the nibble representing
    the exponent to apply to the value. For example, a nibble with a value of 2 means
    that the corresponding value is in units squared. A nibble with a value of Dh,
    which represents -3, means that the units are expressed as 1/units³. These exponents
    are separate from the Unit Exponent value, which is a power of ten applied to
    the data, rather than an exponent applied to the units.


    # Converting Raw Data


    To convert raw data to values with units attached, three things must occur. The
    firmware’s report descriptor must contain the information needed for the conversion.
    The sender of the data must send data that matches the specification in the descriptor.
    And the receiver of the data must apply the conversions specified in the descriptor.


    Below are examples of descriptors and raw and converted data. Remember that just
    because a tag exists in the HID specification doesn’t mean you have to use it.
    If the application knows what format and units to use for the values it’s going
    to send or receive, the firmware doesn’t have to specify these items.


    To specify time in seconds, up to a minute, the report descriptor might include
    this information:


    +   - Logical Minimum: 0

    +   - Logical Maximum: 60'
