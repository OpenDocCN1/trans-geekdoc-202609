    number retrieved from the device. If there is no match, Windows looks for a match
    with any class, subclass, and protocol values retrieved from the device. If the
    device has been enumerated previously, Windows can use information in the system
    registry instead of searching the INF files. After the operating system assigns
    and loads the driver, the driver may request the device to resend descriptors
    or send other class-specific descriptors.


