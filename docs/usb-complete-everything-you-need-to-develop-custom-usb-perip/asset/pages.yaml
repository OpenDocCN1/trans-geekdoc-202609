- pgno: 346
  md: '# The HID Interface


    In the interface descriptor, bInterfaceclass = 3 to identify the interface as
    a HID. Other fields that contain HID-specific information in the interface descriptor
    are the subclass and protocol fields, which can specify a boot interface.


    If bInterfaceSubclass = 1, the device supports a boot interface. A HID with a
    boot interface is usable when the host’s HID drivers aren’t loaded. This situation
    might occur when the computer boots directly to DOS, or when viewing the system
    setup screens that you can access on bootup, or when using Windows’ Safe mode
    for system troubleshooting. A keyboard or mouse with a boot interface can use
    a simplified protocol supported by the BIOS of many hosts. The BIOS loads from
    ROM or other non-volatile memory on bootup and is available in any operating-system
    mode. The HID specification defines boot-interface protocols for keyboards and
    mice. If a device has a boot interface, the bInterfaceProtocol field indicates
    if the device supports the keyboard (1) or mouse (2) interface.


    The HID Usage Tables document defines the report format for keyboards and mice
    that use the boot protocol. The BIOS knows what the boot protocol is and assumes
    that a boot device will support this protocol, so there’s no need to read a report
    descriptor from the device. Before sending or requesting reports, the BIOS sends
    the HID-specific Set_Report request to request to use the boot protocol. When
    the full HID drivers have been loaded, the driver can use Set_Protocol to cause
    the device to switch from the boot protocol to the report protocol, which uses
    the report formats defined in the report descriptor


    The bInterfaceSubclass field should equal zero if the HID doesn’t support a boot
    protocol.


    # HID Class Descriptor


    The HID class descriptor identifies additional descriptors for HID communications.
    The class descriptor has seven or more fields depending on the number of additional
    descriptors. Table 11-2 shows the fields. Note that the'
