- pgno: 558
  md: 'must have a mini-AB receptacle. The only approved use for the mini-A receptacle
    is in an adapter that converts a mini-A plug to a Series-A plug.


    On every approved USB cable, one end has a Series A or mini-A plug and the other
    end has a Series-B plug, a mini-B plug, a vendor-specific connector, or a permanent
    attachment to a device.


    Every On-The-Go connection is between an A-device and a B-device. The A-device
    is defined by the type of plug inserted in the device’s USB receptacle. The device
    with a Series A or mini-A plug is the A-device, and the device at the other end
    of the cable is the B-device. The A-device initially functions as the host, and
    the B-device initially functions as the peripheral. Two connected OTG devices
    can use a protocol to swap functions when needed, as described below. The A-device
    always provides the VBUS voltage and current, even when functioning as a peripheral.


    # Requirements for an OTG Device


    An OTG device must provide all of the following:


    +   - The ability to function as a full-speed peripheral. Support for high speed
    is optional. The peripheral must not use low speed.

    +   - The ability to function as a host that can communicate with one or more
    full-speed devices. Support for low- and high-speed communications is optional.
    Support for hubs is optional.

    +   - Support for the Host Negotiation Protocol, which enables two OTG devices
    to swap roles. (The host becomes the peripheral and the peripheral becomes the
    host.)

    +   - The ability to initiate and respond to the Session Request Protocol, which
    enables a device to request communications with the host even if VBUS isn’t present.

    +   - Support for remote wakeup.

    +   - One and only one Mini-AB receptacle, which can accept either a Mini-A plug
    or a Mini-B plug.

    +   - The ability to provide at least 8 milliamperes of bus current when functioning
    as the A-device.'
  merge: -1
  img_proc: true
- pgno: 559
