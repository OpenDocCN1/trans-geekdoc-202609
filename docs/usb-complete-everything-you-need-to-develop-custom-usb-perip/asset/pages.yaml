    The Usage Page item is identified by the value 06h and specifies the general function
    of the device, such as generic desktop control, game control, or alphanumeric
    display. In the example descriptor, the Usage Page is the vendor-defined value
    FFA0h. The HID specification lists values for different Usage Pages and values
    reserved for vendor-defined Usage Pages.


    The Usage item is identified by the value 09h and specifies the function of an
    individual report in a Usage Page. For example, Usages available for'
  merge: -1
