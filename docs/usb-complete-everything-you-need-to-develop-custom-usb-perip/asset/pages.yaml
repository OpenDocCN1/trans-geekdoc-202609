- pgno: 253
  md: '# 8


    # How the Host Communicates


    Under Windows, an application that wants to access a USB peripheral must communicate
    with a device driver that knows how to manage communications with the system''s
    USB drivers. This chapter explains how Windows manages USB communications and
    explores the options for device drivers.


    # Device Driver Basics


    A device driver is a software component that enables applications to access a
    hardware device. The hardware device may be a printer, modem, keyboard, video
    display, data-acquisition unit, or just about anything controlled by circuits
    that the CPU can access. Some devices, such as internal disk drives, are inside
    the box with the CPU. Others, including just about all USB devices, are external
    devices that connect to the system via cables (or wireless links). As Chapter
    7 explained, some device drivers are class drivers that handle communications
    with a variety of devices that perform similar functions.'
  merge: -1
  img_proc: true
- pgno: 254
  md: '# Insulating Applications from the Details


    Applications are the programs that users run, including everything from word processors
    and databases to special-purpose applications that access custom hardware. A device
    driver insulates applications from having to know details about the physical connections,
    signals, and protocols required to communicate with a device.


    A device driver can enable application code to access a peripheral when the application
    knows only the peripheral’s name (such as HP LaserJet 2300) or the device’s function
    (joystick, drive, scanner). The application doesn’t have to know the physical
    address of the port the peripheral attaches to or monitor and control handshaking
    signals. Applications don’t even have to know whether a device uses USB or another
    interface. The application code can be the same for devices that perform similar
    functions but have different interfaces, with the hardware-specific details handled
    at a lower level.


    The device driver translates between application-level and hardware-specific code.
    Applications communicate with device drivers using functions supported by the
    operating system. The hardware-specific code handles the protocols needed to access
    the peripheral’s circuits, including detecting the states of status signals and
    toggling control signals at appropriate times.


    The Windows drivers for USB devices use a layered driver model where each driver
    in a series performs a portion of the communication. The top layer contains a
    client device driver (or client driver for short) that manages communications
    between applications and lower-level bus drivers. Another term for client driver
    is function driver. The bottom layer contains bus drivers that manage communications
    between the client driver and the hardware. One or more filter drivers may supplement
    the client and bus drivers.


    The layered driver model simplifies the job of writing drivers. Devices can share
    code for tasks they have in common. The drivers that handle communications with
    the system’s USB hardware are included with Windows, so writers of client drivers
    don’t have to handle these details. Note also that the layered driver model means
    that applications can’t access USB ports directly. Windows doesn’t allow it. All
    application communications must be with a driver assigned to a device.'
