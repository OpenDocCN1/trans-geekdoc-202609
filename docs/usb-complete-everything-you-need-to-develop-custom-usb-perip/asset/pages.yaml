- pgno: 413
  md: 'Input report, the application can use ReadFile to read an Input report from
    a device.


    To read a report, the application declares a buffer to hold the data and calls
    ReadFile. The buffer size should equal at least the size reported in the InputReportByteLength
    property of the HIDP_CAPS structure returned by HidP_GetCaps.


    When called with non-overlapped I/O, ReadFile is a blocking call. If an application
    calls ReadFile when the HID’s read buffer is empty, the application’s thread waits
    until either a report is available, the user closes the application from the Task
    Manager, or the user removes the device from the bus. There are several approaches
    to keeping an application from hanging as it waits for a report. The device can
    continuously send reports. The application can attempt to read a report only after
    requesting one using an Output or Feature report. The application can use ReadFile
    with overlapped I/O and a timeout. The ReadFiles can also take place in a separate
    thread.


    To ensure that the device always has data to send, you can write the firmware
    so that the IN endpoint is always enabled and ready to respond to a request for
    data. If there is no new data to send, the device can send the same data as last
    time, or the device can return a vendor-defined code that indicates there is nothing
    new to report. Or before each ReadFile, the application can send a report that
    prompts the firmware to provide a report to send to the host.


    In an overlapped read, ReadFile returns immediately even if there is no report
    available, and the application can call WaitForSingleObject to retrieve the report.
    The advantage of WaitForSingleObject is the ability to set a timeout. If the data
    hasn’t arrived when the timeout period has elapsed, the function returns a code
    that indicates a timeout and the application can try again or use the CancelIo
    function to cancel the read operation. This approach works well if reports are
    normally available without delay, but the application needs to regain control
    if for some reason there is no report.


    To prevent long delays waiting for WaitForSingleObject to return, an application
    can set the timeout to zero and call the function repeatedly in a loop or periodically,
    triggered by a timer. The function returns immediately if no'
