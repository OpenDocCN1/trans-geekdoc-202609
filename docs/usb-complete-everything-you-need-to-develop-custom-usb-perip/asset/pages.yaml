- pgno: 94
  md: '# A Transfer Type for Every Purpose


    An otherwise idle bus can carry up to six low-speed, 8-byte transactions per frame.
    Note, however, that the maximum bandwidth that a single low-speed interrupt endpoint
    can request is 8 bytes every 10 milliseconds, and a low-speed device can have
    no more than two interrupt endpoints. Devices that need to transfer more than
    800 bytes/sec. in each direction should be full or high speed. The reason for
    the limitation on low-speed endpoints is that low-speed traffic uses much more
    bandwidth compared to sending the same amount of data at full or high speed. Limiting
    the amount of bus time available to low-speed endpoints helps keep the bus available
    for other devices.


    At full speed, nineteen 64-byte transactions can fit in a frame. Since the minimum
    time between transfers is one millisecond or more, each transaction in the frame
    would have to be for a different endpoint address. In reality, a host may not
    be able to schedule nineteen full-speed interrupt transactions in a single frame,
    so the practical maximum number of interrupt transactions per frame is likely
    to be less.


    At high speed, the limit is two transfers per microframe, with each transfer consisting
    of three 1024-byte transactions.


    The protocol overhead per transfer with one data packet is 19 bytes at low speed,
    13 bytes at full speed, and 55 bytes at high speed. High-speed interrupt and isochronous
    transfers combined can use no more than 80 percent of a microframe. Full-speed
    isochronous transfers and low- and full-speed interrupt transfers combined can
    use no more than 90 percent of a frame. The section More about Time-critical Transfers
    later in this chapter has more about the capabilities and limits of interrupt
    transfers.


    # Detecting and Handling Errors


    If a device doesn’t return an expected handshake packet, host controllers in PCs
    will retry up to twice more. The host typically retries without limit on receiving
    NAKs. For example, a keyboard might sit idle for days before someone presses a
    key.'
