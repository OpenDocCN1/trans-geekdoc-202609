    # Sending an Output Report to the Device


    On obtaining a handle and learning the number of bytes in the report, an application
    can send an Output report to the HID. The application copies the data to send
    to a buffer and calls WriteFile. As Chapter 11 explained, the type of transfer
    the HID driver uses to send the Output report depends on the Windows edition and
    whether the HID interface has an interrupt OUT endpoint. The application doesn’t
    have to know or care which transfer type the driver uses.'
