- pgno: 186
  md: 'ware. Some microcontrollers, such as National Semiconductor’s COP888, have
    support for Microwire built in.


    # USB Controller


    The ’9603 supports seven endpoint addresses: Endpoint 0 for control transfers,
    three IN endpoints, and three OUT endpoints. Endpoint 0’s buffer is 8 bytes; the
    others are 64 bytes. An endpoint can receive a packet larger than the buffer size
    if the firmware reads incoming data fast enough to prevent the buffer from overflowing.
    In a similar way, an endpoint can send a packet larger than the buffer size if
    the firmware writes to the buffer fast enough to prevent the buffer from emptying.
    The USBN9604 is an identical chip except that its chip reset also resets the chip’s
    clock-generation circuit. The ’9604 is recommended for use in bus-powered devices.


    # Philips Semiconductors ISP1181B


    The ISP1181B from Philips Semiconductors is a full-speed chip that interfaces
    to an external CPU over a parallel interface.


    # Architecture


    The chip has a serial interface engine for handling USB traffic, a configurable
    8- or 16-bit data bus, and a 2-bit address bus. The controller communicates with
    a CPU via a command set. When address bit A0 = 1, the controller interprets the
    lower byte on the data bus as a command. For commands that are followed by data,
    the CPU sets address bit A0 = 0 and transfers data to or from a register or endpoint
    buffer.


    The chip supports multiplexed and non-multiplexed address buses and DMA transfers.


    The ISP1183 is a low-power version with an 8-bit data bus and 32 pins, compared
    to 48 pins on the ’1181. An earlier Philips chip, the PDIUSBD12, has a similar
    architecture but is less capable, with a slower data bus and fewer USB endpoints.'
