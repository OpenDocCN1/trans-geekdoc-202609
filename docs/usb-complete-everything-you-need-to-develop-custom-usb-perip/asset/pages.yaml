    in the INF file. In selecting a driver, all else being equal, Windows will select
    the more recent driver. A DriverVer directive can also appear in a DDInstall section
    to provide information that applies only to the driver(s) in that section. Windows
    2000 and Windows XP must have a DriverVer directive in the Version section and
    may have DriverVer directives in DDInstall sections. Windows 98 and Windows Me
    don’t recognize DriverVer directives in the Version section, so any DriverVer
    directives for these Windows editions must be in the DDInstall sections.


    The Provider directive names the creator of the INF file. In the example, %Provider%
    is a string defined later in the file.


    The Class directive specifies the class for devices installed with the INF file.
    The example specifies the vendor-specific class EllisysProtocolAnalyzers.


    The ClassGUID directive is the device setup GUID to store in the device’s Class
    key in the registry. A vendor-specific driver can use the GUID for USB devices
    or a vendor-specific GUID. The example uses a vendor-specific GUID.


