- pgno: 430
  md: '''232BM transmits only when the ''877 has brought RTS# low, and the ''877 should
    transmit only when the ''232BM has brought CTS# low. If the corresponding handshaking
    signal is high, the sender should wait. Most microcontrollers (including the ''877)
    don''t have dedicated pins for serial-port handshaking but can use any spare port
    pins monitored and controlled by firmware.


    As shown, the circuits use their own +5V power supply. To use bus power for the
    DLP-USB232M, connect VCC-IO, EXTVCC, and RESET# to PORTVCC. Circuits that use
    bus power must draw no more than 100 milliamperes until the host configures the
    USB device and must limit their current in the Suspend state, as described in
    Chapter 16. FTDI Chip provides information on how to ensure that a bus-powered
    device meets USB''s power specifications.


    # Program Code


    Programming a CPU for asynchronous serial communications with a ''232BM requires
    no knowledge of USB protocols. The link between the ''232BM and the device''s
    CPU is an asynchronous serial link. The device''s CPU doesn''t have to know anything
    about the communications between the ''232BM and the USB host. The program code
    will vary depending on whether the device contains a hardware UART/USART and on
    the programming language. The ''877 has a hardware USART that transmits on the
    TX pin and receives on the RX pin. An interrupt can cause a routine to execute
    when a byte has arrived at the serial port and when a byte has transmitted.


    Listing 14-1 demonstrates communications between an ''877 and ''232BM in PicBasic
    Pro. The ''877 reads a byte received from the host, increments the byte, and sends
    the byte back to the host. For handshaking, the code defines one port bit (PORTB.4)
    as the CTS output and one port bit (PORTB.5) as the RTS input.


    The program brings CTS low to indicate that the ''877 is ready to receive a byte.
    CTS connects to the ''232BM''s RTS# input. On receiving a byte from the PC and
    determining that RTS# is low, the ''232BM writes the byte to'
