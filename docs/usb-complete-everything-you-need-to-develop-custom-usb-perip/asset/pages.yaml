    # # The Process


    One of the duties of a hub is to detect the attachment and removal of devices.
    Each hub has an interrupt IN endpoint for reporting these events to the host.
    On system boot-up, the host polls its root hub to learn if any devices are attached,
    including additional hubs and devices attached to those hubs. After boot-up, the
    host continues to poll periodically to learn of any newly attached or removed
    devices.


    On learning of a new device, the host sends a series of requests to the device’s
    hub, causing the hub to establish a communications path between the host and the
    device. The host then attempts to enumerate the device by sending control transfers
    containing standard USB requests to the device’s Endpoint 0. All USB devices must
    support control transfers, the standard requests, and Endpoint 0. For a successful
    enumeration, the device must respond to each request by returning requested information
    and taking other requested actions.


    From the user’s perspective, enumeration is invisible and automatic except for
    possibly a message that announces the detection of a new device and whether the
    attempt to configure it succeeded. Sometimes on first use, the user needs to assist
    in selecting a driver or specifying where the host should look for driver files.


    When enumeration is complete, Windows adds the new device to the Device Manager’s
    display in the Control Panel. When a user removes a device from the bus, Windows
    removes the device from the Device Manager.


    In a typical device, firmware contains the information the host will request,
    and a combination of hardware and firmware decodes and responds to requests for
    the information. Some controllers can manage the enumeration entirely in hardware,
    with no firmware support. On the host side, under'
