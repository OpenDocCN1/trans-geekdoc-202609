    The microcontroller’s CPU and the USB SIE share access to the buffers and buffer
    descriptors. A UOWN bit in the buffer descriptor’s status register determines
    whether the CPU or SIE owns a buffer and its buffer descriptor. The SIE has ownership
    when data is ready to transmit or when waiting to receive data on the bus. When
    the SIE has ownership, the CPU should not attempt to access the buffer or buffer
    descriptor, except to read the UOWN bit. When readying an endpoint to perform
    a transfer, the last operation the firmware should perform is updating the status
    register to set UOWN to pass ownership to the SIE. When a transaction completes,
    the SIE clears the UOWN bit, passing ownership back to the CPU.


    Each endpoint number also has a control register that can enable either a control
    endpoint, an IN endpoint, an OUT endpoint, or a pair of IN and OUT endpoints with
    the same endpoint number. Other bits in the register can stall the endpoint and
    disable handshaking (for isochronous transactions).


    Additional registers store the device’s address on the bus and contain status
    and control information for USB communications and interrupts.


    Microchip provides USB Firmware Framework code and example applications for USB
    communications. The firmware is written for Microchip’s C18 C compiler. The Framework
