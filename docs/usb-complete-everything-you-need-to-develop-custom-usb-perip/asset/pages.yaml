- pgno: 36
  md: 'common peripherals such as keyboards, printers, and scanners, as well as low-
    to moderate-speed and cost-sensitive applications. For many devices, such as drives,
    either interface works well, and in fact some devices include both interfaces.


    # USB versus Ethernet


    For some applications, the choice is between USB and Ethernet. Ethernet’s advantages
    include the ability to use very long cables, broadcasting ability, and support
    for Internet protocols in PCs and Ethernet-capable development systems. Like IEEE-1394,
    however, the hardware required to support Ethernet is more complex and expensive
    than typical USB peripheral hardware. USB is also more versatile with four transfer
    types and a variety of defined classes for different purposes.


    # Bus Components


    The physical components of the Universal Serial Bus consist of the circuits, connectors,
    and cables between a host and one or more devices.


    The host is a PC or other computer that contains a USB host controller and a root
    hub. These components work together to enable the operating system to communicate
    with the devices on the bus. The host controller formats data for transmitting
    on the bus and translates received data to a format that operating-system components
    can understand. The host controller also performs other functions related to managing
    communications on the bus. The root hub has one or more connectors for attaching
    devices. The root hub, in combination with the host controller, detects attached
    and removed devices, carries out requests from the host controller, and passes
    data between devices and the host controller.


    The devices are the peripherals and additional hubs that connect to the bus. A
    hub has one or more ports for connecting devices. Each device must contain circuits
    and code that know how to communicate with the host. The USB specification defines
    the cables and connectors that connect devices to hubs.'
  merge: -1
  img_proc: true
- pgno: 37
  md: '![](img/3955d77b6be34048e3bc722d0b15c2a9_37_0.png)


