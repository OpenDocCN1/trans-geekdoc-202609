- pgno: 111
  md: '# Device Removal


    When a user removes a device from the bus, the hub disables the device''s port.
    The host learns that the removal occurred after polling the hub, learning that
    an event has occurred, and sending a Get_Port_Status request to find out what
    the event was. Windows removes the device from the Device Manager''s display and
    the device''s address becomes available to another newly attached device.


    # Tips for Successful Enumeration


    Successful enumeration is essential. Without it, the device and host can''t perform
    any additional communications. Most chip vendors provide example code to get you
    started. Even if your device uses a different class or has other differences,
    the example code can serve as a model. If your controller interfaces to an external
    CPU, you may have to adapt code written for another chip.


    In general, a device should assume nothing about what requests or events the host
    will initiate and should just concentrate on responding to requests and events
    as they occur. The following tips have specific advice about how to avoid common
    problems.


    **Don''t assume requests or events will occur in a specific order.** The USB 2.0
    specification says nothing about what order a host might choose in sending control
    requests during enumeration. A host might also choose to reset the bus at any
    time, and the device must detect the reset and respond appropriately.


    **Be ready to abandon a control transfer or end it early.** On receiving a new
    Setup packet, a device must abandon any transfer in progress and begin the new
    one. On receiving an OUT token packet, the device must assume that the host is
    beginning the Status stage of the transfer even if the device hasn''t sent all
    of the requested data in the Data stage.


    **Don''t attempt to send more data than the host asks for.** In the Data stage
    of a Control Read transfer, a device should send no more than the amount'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'of data the host has asked for. If the host requests nine bytes, the device
    should send no more than nine bytes.


    **Send a zero-length data packet when required.** If the device has less than
    the requested amount of data to return and if the amount of data is an exact multiple
    of the endpoint’s maximum packet size, the device should indicate that there is
    no more data by returning a zero-length data packet in response to the next IN
    token packet.


    **Stall unsupported requests.** A device shouldn’t assume it knows every request
    the host might send. The device should return a STALL in response to any request
    the device doesn’t recognize or support.


    **Don’t set the address too soon.** In a Set_Address request, the device should
    set its new address only after the Status stage of the request is complete.


    **Be ready to enter the Suspend state.** A host can suspend the bus when the device
    is in any powered state, including before the device has been configured. When
    the bus is suspended, the device must reduce its use of bus power.


    **Test under different host-controller types.** Some host controllers schedule
    multiple stages of a control transfer in a single frame, while others don’t. Devices
    should be able to handle either way. Chapter 8 has more about host controllers.


    # Descriptors


    USB descriptors are the data structures, or formatted blocks of information, that
    enable the host to learn about a device. Each descriptor contains information
    about the device as a whole or an element of the device.


    All USB devices must respond to requests for the standard USB descriptors. The
    device must store the information in the descriptors and respond to requests for
    the descriptors.'
