- pgno: 203
  md: 'nal, while an OUT endpoint has an associated Input Terminal. Other Terminals
    in a function can represent interfaces to audio components such as microphones
    and speakers.


    An audio function might receive a microphone’s output at an Input Terminal and
    transmit the received audio data to the host at an Output Terminal that represents
    a USB IN endpoint. Or an audio function might receive audio data from the host
    at an Input Terminal that represents an OUT endpoint and send the received data
    to a speaker at an Output Terminal.


    A Unit descriptor contains information about an addressable logical object that
    represents a subfunction within an audio function. Table 7-3 shows the Unit types
    defined in the specification.


    If the AudioControl Interface has an interrupt endpoint, the interface includes
    an endpoint descriptor for the endpoint.


    # The AudioStreaming Interface.


    Following the AudioControl interface descriptor, an Audio Interface Collection
    may have one or more AudioStreaming interface descriptors with bInterfaceClass
    field = 01h to identify the interface as audio class and bInterfaceSubclass =
    02h to identify the subclass as AudioStreaming. Figure 7-3 shows the descriptors.


    Following each AudioStreaming interface descriptor is a class-specific AudioStreaming
    interface descriptor, which identifies the Terminal associated with the interface
    and contains information about the data format and any delay the function requires
    for internal processing. The Audio Data Formats specification lists the supported
    formats, which include Pulse Code Modulation (PCM), Digital Audio Compression
    (AC-3), and MPEG. A class-specific AS Format Type descriptor contains more information
    about the format. Some formats require an additional AS Format-specific Type descriptor.


    Each AudioStreaming interface can have one isochronous endpoint. The endpoint
    has a standard endpoint descriptor and a class-specific AS Isochronous Audio Data
    endpoint descriptor. The class-specific descriptor indicates which audio controls
    the endpoint supports, specifies whether the endpoint requires all except zero-length
    data packets to contain wMaxPacketSize'
