- pgno: 371
  md: '# 12


    # Human Interface

    Devices: Reports


    Chapter 11 introduced the reports that HIDs use to exchange data. A report can
    be a basic buffer of bytes or a complex assortment of items, each with assigned
    functions and units. This chapter shows how to design a report to fit a specific
    application.


    # Report Structure


    A report descriptor may contain any of dozens of items arranged in various combinations.
    The advantage of a more complex descriptor is that the device can provide detailed
    information about the data it sends and expects to receive. The descriptor can
    specify the values’ uses and what units to apply to the raw data. From a report
    descriptor, an application can learn whether a device supports a particular feature,
    such as force feedback on a joystick.'
  merge: -1
  img_proc: true
- pgno: 372
  md: 'But just because the specification defines an item that could apply to a device’s
    data doesn’t mean that the report descriptor has to use that item. For vendor-specific
    devices that are intended for use with a single application, the application often
    knows in advance the type, size, and order of the data in a report, so there’s
    no need to obtain this information from the device. For example, when the vendor
    of a data-acquisition unit creates an application for use with the unit, the vendor
    already knows the data format the device uses in its reports. At most, the application
    might check the product ID and release number from the device descriptor to learn
    whether the application can request a particular setting or action.


    Some of the details about report structures can get tedious, and it’s rarely necessary
    to understand every nuance about every item type. So feel free to skim through
    the details in this chapter and come back to them later if you need to.


    A report descriptor contains one or more controls and data items that describe
    values to be transferred in one or more reports. A control is a button, switch,
    or other physical entity that operates or regulates an aspect of a device. Data
    items describe any other data the report transfers. Each control or data item
    has a defined scope. Some items can apply to multiple values, eliminating the
    need for repetition.


    # Using the HID Descriptor Tool


    The HID Descriptor Tool (Figure 12-1) is a free utility available from the USB-IF.
    The tool helps in creating report descriptors, and will also check your descriptor’s
    structure and report errors. Instead of having to look up the values that correspond
    to each item in your report, you can select the item from a list and enter the
    value you want to assign to it, and the tool adds the item to the descriptor.
    You can also add items manually. The Parse Descriptor function displays the raw
    and interpreted values in your descriptor and comments on any errors found. When
    you have a descriptor with no errors, you can convert it to the syntax required
    by your firmware. The tool has limited support for vendor-specific items, however,
    and may flag these as errors.'
  merge: -1
  img_proc: true
- pgno: 373
