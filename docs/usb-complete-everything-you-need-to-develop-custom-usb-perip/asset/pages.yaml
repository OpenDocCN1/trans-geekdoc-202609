    Each transfer consists of one or more transactions, and each transaction in turn
    consists of one, two, or three packets.


    The three transaction types are defined by their purpose and direction of data
    flow. Setup transactions send control-transfer requests to a device. OUT transactions
    send other data or status information to the device. IN transactions send data
    or status information to the host.


    The USB specification defines a transaction as the delivery of service to an endpoint.
    Service in this case can mean either the host’s sending information to the device,
    or the host’s requesting and receiving information from the device.


    Each transaction includes identifying, error-checking, status, and control information
    as well as any data to be exchanged. A complete transfer may take place over multiple
    frames or microframes, but a transaction must complete uninterrupted. No other
    communication on the bus can break into the middle of a transaction. Devices thus
    must be able to respond quickly with requested data or status information in a
    transaction. Device firmware typically configures, or arms, an endpoint to respond
    to received packets, and the hardware responds to the packets when they arrive.


    A transfer with a small amount of data may require just one transaction. Other
    transfers require multiple transactions with a portion of the data in each.


    # Transaction Phases


