- pgno: 481
  md: '# Hub Power


    Powering options for hubs are similar to the options for other devices, but hubs
    have some special considerations. A hub must also control power to its devices
    and monitor power consumption, taking action when the devices are using too much
    current and presenting a safety hazard.


    # Power Sources


    Like other devices, all hubs except the root hub are self-powered or bus-powered.
    The root hub gets its power from the host.


    If the host uses AC power from a wall socket or another external source, the root
    hub must be high power and capable of supplying 500 milliamperes to each port
    on the hub. If the host is battery-powered, the hub may supply either 500 or 100
    milliamperes to each port on the hub. A hub that supplies 100 milliamperes is
    a low-power hub.


    All of a bus-powered hub''s downstream devices must be low power. The hub can
    draw no more than 500 milliamperes and the hub itself will use some of this, leaving
    less than 500 milliamperes for all attached devices combined.


    Don''t connect two bus-powered hubs in series. The upstream hub can guarantee
    no more that 100 milliamperes to each downstream port, and that doesn''t leave
    enough current to power a second hub that also has one or more downstream ports,
    each requiring 100 milliamperes. An exception is a bus-powered compound device,
    which consists of a hub and one or more downstream, non-removable devices. In
    this case, the hub''s configuration descriptor can report the maximum power required
    by the hub''s electronics plus its non-removable device(s). The configuration
    descriptors for the non-removable device(s) report that the devices are self-powered
    with bMaxPower = 0. The hub descriptor indicates whether a hub''s ports are removable.


    Like other high-power, bus-powered devices, a bus-powered hub can draw up to 100
    milliamperes until it''s configured and up to 500 milliamperes after being configured.
    During configuration, the hub must manage the'
  merge: -1
  img_proc: true
- pgno: 482
  md: 'available current so its devices and the hub combined don’t exceed the allowed
    current.


    Like other self-powered devices, a self-powered hub may also draw up to 100 milliamperes
    from the bus so the hub interface can continue to function when the hub’s power
    supply is off. If the hub’s power is from an external source, such as AC power
    from a wall socket, the hub is high power and must be capable of supplying 500
    milliamperes to each port on the hub. If the hub uses battery power, the hub may
    supply 100 or 500 milliamperes to each port on the hub.


    # Over-current Protection


    As a safety precaution, hubs must be able to detect an over-current condition,
    which occurs when the current used by the total of all devices attached to the
    hub exceeds a preset value. When the port circuits on a hub detect an over-current
    condition, they limit the current at the port and the hub informs the host of
    the problem. Windows warns the user when a device exceeds the current limit of
    its hub port (Figure 16-3).


    The USB 2.0 specification says only that the current that triggers the over-current
    actions must be less than 5 amperes. To allow for transient currents, the over-current
    value should be greater than the total of the maximum allowed currents for the
    devices. In the worst case, seven high-power, bus-powered downstream devices can
    legally draw up to 3.5 amperes. So a supply for a self-powered hub with up to
    seven downstream ports would provide much less than 5 amperes at all times unless
    something goes very wrong.


    The USB specification allows a device to draw larger inrush currents when it attaches
    to the bus. This current is typically provided by the stored energy in a capacitor
    that is downstream from the over-current protection circuits so the protection
    circuits don’t see the inrush current. If the inrush current is too large, the
    device will fail the USB-IF’s compliance tests.'
  merge: -1
  img_proc: true
- pgno: 483
  md: '![](img/3955d77b6be34048e3bc722d0b15c2a9_483_0.png)


    Figure 16-3: When a device exceeds the current limit of its hub''s port, Windows
    warns the user and offers assistance.


    # Power Switching


    A bus-powered hub must support power switching that can provide and cut off power
    to downstream ports in response to control requests. A single switch may control
    all ports, or the ports may switch individually. A self-powered hub must support
    switching to the Powered Off state and may also support power switching via control
    transfers.'
  merge: -1
  img_proc: true
