  md: '# Control Transfers: Structured Requests for Critical Data


    **Additional Contents:** eight bytes in five fields: bmRequestType, bRequest,
    wValue, wIndex, and wLength.


    **bmRequestType** is a byte that specifies the direction of data flow, the type
    of request, and the recipient.


    Bit 7 is a Direction bit that names the direction of data flow for data in the
    Data stage. Host to device (OUT) or no Data stage is 0; device to host (IN) is
    1.


    Bits 6 and 5 are Request Type bits that specify whether the request is one of
    USB’s standard requests (00), a request defined for a specific USB class (01),
    or a request defined by a vendor-specific driver for use with a particular product
    or products (10).


    Bits 4 through 0 are Recipient bits that define whether the request is directed
    to the device (00000) or to a specific interface (00001), endpoint (00010), or
    other element (00011) in the device.


    **bRequest** is a byte that specifies the request. Every defined request has a
    unique bRequest value. When the Request Type bits in bmRequestType = 00, bRequest
    specifies one of the standard USB requests. When the Request Type bits = 01, bRequest
    specifies a request defined for the device’s class. When the Request Type bits
    = 10, bRequest specifies a request defined by a vendor.


    **wValue** is two bytes that the host may use to pass information to the device.
    Each request may define the meaning of these bytes in its own way. For example,
    in a Set_Address request, wValue contains the device address.


    **wIndex** is two bytes that the host may use to pass information to the device.
    A typical use is to pass an index or offset such as an interface or endpoint number,
    but each request may define the meaning of these bytes in any way. When passing
    an endpoint index, bits 0-3 indicate the endpoint number, and bit 7 = 0 for a
    Control or OUT endpoint or 1 for an IN endpoint. When passing an interface index,
    bits 0–7 are the interface number. All unused bits are zero.


    **wLength** is two bytes containing the number of data bytes in the Data stage
    that follows. For a host-to-device transfer, wLength is the exact number of'
