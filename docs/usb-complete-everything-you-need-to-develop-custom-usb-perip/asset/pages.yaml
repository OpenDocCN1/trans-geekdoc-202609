  md: "# Visual Basic\n\nThis is the function's declaration:\n\n```\n<DllImport(\"\
    hid.dll\")> _\nFunction HidD_SetFeature _\n    (ByVal HidDeviceObject As Integer,\
    \ _\n    ByRef lpReportBuffer As Byte, _\n    ByVal ReportBufferLength As Integer)\
    \ _\n    As Boolean\nEnd Function\n```\n\nThis is the code to call the function:\n\
    \n```\nDim OutFeatureReportBuffer _\n    (Capabilities.FeatureReportByteLength\
    \ - 1) as Byte\nDim Success As Boolean\n\n'The first byte in the report buffer\
    \ is the report ID:\n\nOutFeatureReportBuffer(0) = 0\n\n' Example report data\
    \ following the report ID:\n\nOutFeatureReportBuffer(1) = 55\nOutFeatureReportBuffer(2)\
    \ = 41\n\nSuccess = HidD_SetFeature _\n    (DeviceHandle, _\n    OutFeatureReportBuffer(0),\
    \ _\n    Capabilities.FeatureReportByteLength)\n```\n\n# Details\n\nA byte array\
    \ holds the report to send. The first byte in the array is the report ID. The\
    \ length of the Feature report plus one byte for the report ID is in the HIDP_CAPS\
    \ structure retrieved by HidP_GetCaps. HidD_SetFeature requires a handle to the\
    \ HID, the address of the first element in the byte array, and length of the byte\
    \ array.\n\nThe function returns True on success. If the device continues to NAK\
    \ the report data, the function times out and returns."
