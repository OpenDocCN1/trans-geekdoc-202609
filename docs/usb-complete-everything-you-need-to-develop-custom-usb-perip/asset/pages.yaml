- pgno: 525
  md: '# 19


    # The Electrical Interface


    All of the protocols and program code in the world are no use if the signals don’t
    make it down the cable in good shape. The electrical interface plays an important
    part in making USB a reliable way to transfer information.


    From a practical point of view, if you’re using compliant cables and components,
    you don’t need to know much about the electrical interface. But if you’re designing
    USB transceivers or cables, printed-circuit boards with USB interfaces, or a protocol
    analyzer that must unobtrusively monitor the bus, you do need to understand the
    electrical interface and how it affects the components in your project.


    This chapter presents the essentials about the electrical interface of the USB’s
    drivers and receivers and details about the cables that carry the signals.'
  merge: -1
  img_proc: true
- pgno: 526
  md: '# Transceivers and Signals


    The electrical properties of the signals on a USB cable vary depending on the
    speed of the cable segment. Low-, full-, and high-speed signaling each have a
    different edge rate, which is a measure of the rise and fall times of the voltages
    on the lines and thus the amount of time required for an output to switch. The
    transceivers and supporting circuits that produce and detect the bus signals also
    vary depending on speed.


    At any speed, the components that connect to a USB cable must be able to withstand
    the shorting of any line to any other line or the cable shield without component
    damage.


    # Cable Segments


    A cable segment is a single physical cable that connects a device (which may be
    a hub) to an upstream hub (which may be the root hub at the host). The speed,
    edge rate, and polarity of the data in a segment depend on whether the segment
    is low, full, or high speed. Figure 19-1 illustrates.


    Low-speed segments exist only between low-speed devices and their hubs. A low-speed
    segment carries only low-speed data, using low-speed''s edge rate and inverted
    polarity compared to full speed.


    A full-speed segment exists when the segment''s downstream device is operating
    at full speed. The upstream device may be a 1.x or 2.0 hub (including the root
    hub). When the downstream device is a hub, the segment may also carry data to
    and from low-speed devices that are downstream from that hub. In this situation,
    the low-speed data on the full-speed segment uses low-speed''s bit rate but full
    speed''s polarity and edge rate. The hub that connects to the low-speed device
    converts between low and full speed''s polarity and edge rates. Full-speed segments
    never carry data at high speed. If a high-speed-capable device connects to a 1.x
    hub, communications are at full speed. High-speed devices must at least respond
    to enumeration requests at full speed.


    High-speed segments exist only where the host is USB 2.0, all upstream device(s)
    are 2.0 hubs, and the downstream device is high speed. When the'
  merge: -1
  img_proc: true
