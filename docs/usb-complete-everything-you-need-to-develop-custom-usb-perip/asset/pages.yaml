    | 50h | bulk only |


    Every bulk-only mass-storage device must have a serial number of at least 12 characters
    using only the characters in the range 0–9 and A–F. The serial number enables
    the operating system to retain properties such as the drive letter and access
    policies after a user moves a device to another port or attaches multiple devices
    with the same Vendor ID and Product ID. The device descriptor’s iSerialNumber
    field contains an index to the serial number, which is stored in a string descriptor.
    The value must be different from any serial number used by other devices with
    the same values in the idVendor, idProduct, and bcdDevice fields in the device
    descriptor.


    A mass-storage device must have a bulk endpoint for each direction.


    # Class-specific Requests


    The bulk-only protocol has two defined control requests: Bulk Only Mass Storage
    Reset (reset the device) and Get Max Lun (get the number of logical units, or
    partitions, that the device supports). All other commands and status information
    travel in bulk transfers.


    The control/bulk/interrupt (CBI) protocol has one defined control request: Accept
    Device-Specific Command (ADSC). The Data stage of the request carries the command.
    A device can use an interrupt transfer to indicate that the device has completed
    a command’s requested action.


    # Chips


    A mass-storage device can use just about any full- or high-speed controller chip,
    but several manufacturers have controllers designed specifically for use in mass-storage
    devices. Prolific Technology and Standard Microsystems Corporation (SMSC) each
    have a variety of chips with interfaces to a variety of mass-storage device types.
    Controllers with direct interfaces to'
  merge: -1
  img_proc: true
- pgno: 232
  md: 'ATA/ATAPI devices include Philips Semiconductor’s ISP1183, Texas Instruments’
    TUSB6250, and Cypress Semiconductor’s EZUSB AT2.


    # Windows Support


    Windows 2000 and later include a driver that supports bulk-only and CBI devices.
    When a device’s descriptors identify the device as mass-storage class, the operating
    system loads the USB storage port driver (usbstor.sys). This driver manages communications
    between the lower-level USB drivers and Windows’ storage-class drivers. When the
    device is formatted using a supported file system, the operating system assigns
    a drive letter to the device and the device appears in My Computer.


    The mass-storage driver in Windows XP supports bInterfaceSubClass codes 02h, 05h,
    and 06h. Support for drives with multiple Logical Unit Numbers (LUNs) was added
    in Windows 2000 SP3.


    One point of confusion relating to the mass-storage support under Windows is the
    difference between removable devices and removable media. All USB drives are removable
    devices because they’re easily attached and detached from the PC. A removable
    device may have removable or non-removable media. CD, DVD, and floppy drives have
    removable media. A hard disk is a non-removable medium because you can’t easily
    remove the disk from the drive. Windows’ Autorun capability (also called AutoPlay)
    applies to devices with removable media. Autorun enables the operating system
    to run a program, play a movie, or perform other actions when a disk or other
    removable media is inserted.


    # Printers


    The printer class is for devices that convert received data into text and/or images
    on paper or other media. The most basic printers print lines of text in a single
    font. Most laser and inkjet printers understand one or more page description languages
    (PDLs) and can print text in any font and complex images.'
  merge: -1
  img_proc: true
- pgno: 233
  md: '# Documentation


    The USB Printing Devices specification is for printers of all types. At this writing,
    the current version of the specification is 1.1. The IEEE-1284 standard from www.ieee.org
    describes the interface used by parallel-port printers and includes information,
    such as the format for Device IDs, used by USB printers.


    # Overview


    Printer data uses a bulk OUT pipe. The host obtains status information in control
    requests or an optional bulk IN pipe.


    # Descriptors


    The printer function is defined at the interface level. In the interface descriptor,
    bInterfaceClass = 07h to specify the printer class.


    The interface descriptor’s bInterfaceProtocol field contains a value that names
    a type of printer interface:


    | bInterfaceProtocol | Type |

    |---|---|

    | 01h | Unidirectional |

    | 02h | Bidirectional |

    | 03h | IEEE-1284.4-compatible Bidirectional |


    With all three interface protocols, the host uses the bulk OUT endpoint to send
    data to the printer. With the unidirectional protocol, the host retrieves status
    information by sending a class-specific Get_Port_Status request. With the bidirectional
    protocol, the host can retrieve status information using Get_Port_Status or the
    bulk IN pipe, which can provide more detailed information. The IEEE-1284.4-compatible
    bidirectional protocol is like the bidirectional protocol but with added support
    to enable communications with individual functions in a multifunction peripheral.'
  merge: -1
  img_proc: true
- pgno: 234
  md: '# Class-specific Requests


    The printer class has three class-specific requests:


    | Request | bRequest |

    |---|---|

    | Get_Device_ID | 0 |

    | Get_Port_Status | 1 |

    | Soft_Reset | 2 |


    In response to a GET_DEVICE_ID request, the device returns a Device ID in the
    format specified by the IEEE-1284 standard. The first two bytes of the Device
    ID are the length in bytes, most significant byte first. Following the length
    is a string containing a series of keys and their values in this format:


    ```

    key: value {,value};

    ```


    All Device IDs must contain the keys MANUFACTURER, COMMAND SET, and MODEL, or
    their abbreviated forms (MFG, CMD, and MDL). The COMMAND SET key names any PDLs
    the printer supports, such as Hewlett Packard''s Printer Control Language (PCL)
    or Adobe Postscript. Additional keys, which may be vendor-defined, are optional.


    Here is an example Device ID:


    ```

    MFG:My Printer Company;

    MDL:Model 5T;

    CMD:MLC,PCL,PML;

    DESCRIPTION:My Printer Company Laser Printer 5T;

    CLASS:PRINTER;

    REV:1.3.2;

    ```


    In response to the GET_PORT_STATUS request, the device returns a byte that emulates
    the Status-port byte on a parallel printer port. Three bits in the byte contain
    status information:


    | Bit | Name | meaning when = 1 | meaning when = 0 |

    |---|---|---|---|

    | 3 | Not Error | no error | error |

    | 4 | Select | printer selected | printer not selected |

    | 5 | Paper Empty | out of paper | not out of paper |'
  merge: -1
  img_proc: true
- pgno: 235
  md: 'A printer that can''t obtain the status information should respond with 18h
    to signify *no error, printer selected, and not out of paper*. Parallel-port printers
    have two additional status bits, Busy and Ack, which are used in handshaking and
    don''t apply to USB printers.


    On receiving a Soft_Reset request, a device should flush all buffers, reset the
    interface''s bulk pipes to their default states, and clear all Stall conditions.


    In a Soft_Reset request, the bmRequestType value in the Setup transaction should
    be 21h to signify a class-specific request that is directed to an interface and
    has no Data stage. However, version 1.0 of the printer-class specification incorrectly
    listed the bmRequestType for Soft_Reset as 23h. So to be on the safe side, devices
    should respond to hosts that use a bmRequestType of 23h with this request, and
    hosts should try the incorrect value on receiving a STALL in response to this
    request using the correct value.


    # Chips


    Just about any full- or high-speed controller will have the one or two bulk endpoints
    for a printer function. For converting parallel-port printers to USB, Prolific
    Technology has the PL-2305 USB-to-IEEE-1284 Bridge Controller. The chip supports
    three endpoints: one bulk IN, one bulk OUT, and one interrupt IN. The chip''s
    IEEE-1284 parallel port can interface to an existing parallel port on a printer
    or other peripheral.


    # Windows Support


    Windows includes drivers that handle tasks common to both non-Postscript and Postscript
    printers. A printer manufacturer can customize a driver for a specific printer
    by providing a minidriver that consists of one or more text files with the customization
    information. The Windows DDK has information on how to create printer minidrivers.


    When an application requests to print a file, the printer driver sends the printer
    data to the print spooler''s print processor. If the printer has a USB interface,
    the print processor sends the data either directly to the *Usbmon* port driver
    or to a language monitor that modifies the data stream and'
  merge: -1
  img_proc: true
- pgno: 236
  md: 'passes it on to *Usbmon*. *Usbmon* in turn communicates with lower-level USB
    drivers that access the port.


    *Usbmon* and the *Usbprint* driver provide a software interface that is similar
    to the interface for accessing parallel-port printers. In many cases, a printer
    can use the same printer driver and language monitor for both parallel-port and
    USB interfaces. If needed, a language monitor or other upper-level software can
    support USB-specific, vendor-specific requests.


    # Still Image Capture: Cameras and Scanners


    The still-image class encompasses cameras that capture still images (in other
    words, not video) and scanners. The main job of a still-image device’s USB interface
    is to transfer image data from the device to the host. Some devices can receive
    image data from the host as well. If all you need is a way to transfer image files
    from a camera, another option is to use the mass-storage driver.


    # Documentation


    The USB class specification, *Still Image Capture Device Definition*, includes
    features and commands from *PIMA 15740: 2000 Picture Transfer Protocol*, which
    describes requirements for transferring files and controlling digital still cameras.
    At this writing, the current version of the still-image specification is 1.0.
    The PIMA document is available from the International Imaging Industry Association
    (I3A) at *www.i3a.org*.


    # Overview


    A still-image device has one bulk IN endpoint and one bulk OUT endpoint for transferring
    both image data and non-image data. The specification also requires an interrupt
    IN endpoint for event data.


    In the bulk and interrupt pipes, information travels in structures called containers.
    The four container types are the Command Block, Data Block, Response Block, and
    Event Block. The bulk OUT pipe carries Command and Data Blocks. The bulk IN pipe
    carries Data and Response Blocks. The interrupt IN pipe carries Event Blocks.'
  merge: -1
  img_proc: true
- pgno: 237
  md: 'On the bulk pipes, the host communicates by using a protocol with three phases:
    Command, Data, and Response. A short packet indicates the end of a phase. In the
    Command phase, the host sends a Command Block that names an operation defined
    in PIMA 15740. The Command Block contains an operation code that determines if
    the operation requires a data transfer and if so, the direction of data transfer.
    If there is a data transfer, the data travels in a Data Block in the Data phase.
    The first four bytes of the Data Block are the length in bytes of the data being
    transferred. Some operations have no Data phase. The final phase is the Response
    phase, where the device sends a Response Block containing completion information.


    On the interrupt pipe, an Event Block can contain up to three Event Codes with
    status information such as a low-battery warning or a notification that a memory
    card has been removed. The Check Device Condition Event Code requests the host
    to send a class-specific Get_Extended_Event_Data request for more information
    about an event.


    A device using the bulk-only protocol cancels a transfer by stalling the bulk
    endpoints. The host then sends a class-specific Get_Device_Status request and
    uses the Clear_Feature request to clear the stalled endpoints. The host cancels
    a transfer by sending a class-specific Cancel_Request request. A device is ready
    to resume data transfers when it returns OK (PIMA 15740 Response Code 2001h) in
    response to a Get_Device_Status request.


    # Descriptors


    A still-image function is defined at the interface level. In the interface descriptor,
    bInterfaceClass = 06h to indicate a still-image device, bInterfaceSubclass = 01h
    to indicate an image interface, and bInterfaceProtocol = 01h to indicate a still-image
    capture function. The interface must have descriptors for the bulk IN, bulk OUT,
    and interrupt IN endpoints.'
  merge: -1
  img_proc: true
- pgno: 238
  md: '# Class-specific Requests


    There are four class-specific control requests:


    | Request | bRequest | Required? |

    |---|---|---|

    | Cancel_Request | 64h | yes |

    | Get_Extended_Event_Data | 65h | no |

    | Device_Reset_Request | 66h | yes |

    | Get_Device_Status | 67h | no |


    With Cancel_Request, the host requests to cancel the PIMA 15740 transaction named
    in the request. With Get_Extended_Event_Data, the host requests extended information
    regarding an event or vendor condition. With Device_Reset_Request, the host requests
    the device to return to the Idle state. The host can use this request after a
    bulk endpoint has returned a STALL or to clear a vendor-specific condition. With
    Get_Device_Status, the host requests information needed to clear halted endpoints.
    The host uses this request after a device has canceled a data transfer.


    # Chips


    Just about any full- or high-speed USB controller will have the three endpoints
    required by the still-image class.


    # Windows Support


    Recent Windows editions support the Windows Image Acquisition (WIA) API for communicating
    with devices in the still-image class. Applications communicate with devices by
    using ReadFile, WriteFile, and DeviceIoControl commands. The drivers that add
    USB support to WIA are usbscan.sys in Windows XP and later and usbscan9x.sys in
    Windows Me.


    Under Windows XP, cameras that use the Picture Transfer Protocol (PTP) described
    in the PIMA 15740 standard require no vendor-provided driver components, though
    vendors can provide a minidriver to enhance the driver and support vendor-specific
    features and capabilities. For scanners, the vendor must provide a microdriver,
    which is a “helper DLL” that translates between the driver’s communications and
    a language the scanner under-'
  merge: -1
  img_proc: true
- pgno: 239
  md: 'stands, or a minidriver to work with the provided drivers to enable communications
    with the device.


    Windows 98 and Windows 2000 use an earlier Still Image architecture (STI). Product
    vendors must provide a user-mode driver to work with the provided STI driver.


    # Test and Measurement


    The test-and-measurement class (USBTMC) is suited for instrumentation devices
    where the data doesn’t need guaranteed timing. These devices typically contain
    components such as ADCs, DACs, sensors, and transducers. A device may be a stand-alone
    unit or a card in a larger computer.


    Before USB, many test-and-measurement devices used the IEEE-488 parallel interface,
    also known as the General Purpose Interface Bus (GPIB). The USB488 subclass of
    the test-and-measurement class defines protocols for communicating using IEEE-488’s
    data format and commands.


    # Documentation


    The class’s specifications include the main *Test and Measurement Class* specification
    and a separate document for the USB488 subclass. At this writing, the current
    version of both documents is 1.0. The IEEE-488 standards are available from *www.ieee.org*.


    # Overview


    A test-and-measurement device requires a bulk OUT endpoint and a bulk IN endpoint.
    An interrupt IN endpoint is required for devices in the USB488 subclass and otherwise
    is optional for returning event and status information.


    The bulk pipes exchange messages, with each message consisting of a header followed
    by data. The bulk OUT endpoint receives command messages, and the bulk IN endpoint
    sends response messages. The header for a command message contains a message ID,
    a bTag value that identifies the transfer, and message-specific information. The
    header for a response message contains the message ID and bTag values of the command
    that prompted'
  merge: -1
  img_proc: true
- pgno: 240
  md: 'the response, followed by message-specific information. The message ID specifies
    whether a command is device-dependent or vendor-specific and whether the host
    expects a response.


    # Descriptors


    A test-and-measurement function is specified at the interface subclass level.
    In the interface descriptor, bInterfaceClass = FEh to indicate an application-specific
    interface and bInterfaceSubClass = 03h to indicate the test-and-measurement class.
    There are no class-specific descriptors.


    # Class-specific Requests


    The class defines eight control requests for controlling and requesting the status
    of an interface or transfer and requesting information about the interface''s
    attributes and capabilities.


    # Chips


    Just about any full- or high-speed device will have the two or three endpoints
    this class requires.


    # Windows Support


    Windows doesn''t include a driver for this class. National Instruments provides
    a driver for use with its hardware. Other options for test-and-measurement devices
    that use bulk transfers include the mass-storage class or a vendor-specific driver.
    A HID-class device can also perform test and measurement functions. For an existing
    device with an IEEE-488 interface, the quick solution is to use a commercial IEEE-488/USB
    converter.


    # Video


    The video class supports digital camcorders, webcams, and other devices that send,
    receive, or manipulate transient or moving images. The class also supports transferring
    still images from video devices. Because transmitting high-quality video requires
    a lot of bandwidth, using USB for video has become a more attractive option since
    high-speed hosts and devices have become available.'
  merge: -1
  img_proc: true
- pgno: 241
  md: '![](img/3955d77b6be34048e3bc722d0b15c2a9_241_0.png)


    Figure 7-6: A video interface consists of a VideoControl interface and zero or
    more VideoStreaming interfaces.


    # Documentation


    A variety of documents make up the video specification. The *Video Class Definition*
    defines standard and class-specific descriptors and class-specific control requests
    for video devices. The *Media Transport Terminal* specification defines descriptors
    and requests for devices such as video cameras and digital VCRs, which stream
    data stored in sequential media and may require functions such as play, record,
    rewind, and eject. Separate payload specifications contain format-specific information
    for a variety of video formats such as MJPEG, MPEG2-TS, DV, and uncompressed video.
    Version 1.1 of the video class specification (under development at this writing)
    will retire some additional 1.0 formats and add generic frame-based and generic
    stream-based formats. Other specification documents include a video camera example,
    an FAQ, and an Identifiers document that gathers together identifier values defined
    in the other video-class specifications. At this writing, the current version
    of all of these specifications is 1.0.


    # Overview


    Figure 7-6 shows the elements that make up a video function in a USB device. Every
    function must have a VideoControl interface, which provides'
  merge: -1
  img_proc: true
- pgno: 242
  md: 'information about inputs, outputs, and other components of the function. Most
    functions also have one or more VideoStreaming interfaces that enable transferring
    video data. A Video Interface Collection consists of a Video-Control interface
    and its associated VideoStreaming interfaces. (A function with only a VideoControl
    interface isn''t part of a Video Interface Collection.) A device can have multiple,
    independent VideoControl interfaces and Video Interface Collections.


    The VideoControl interface uses the control endpoint and may use an interrupt
    IN endpoint. Each VideoStreaming interface has one isochronous or bulk endpoint
    for video data and an optional bulk endpoint for still-image data.


    # Descriptors


    The video class defines an extensive set of descriptors that enable devices to
    provide detailed information about the device''s abilities. Each Video Interface
    Collection must have an interface association descriptor that specifies the interface
    number of the first VideoControl interface and the number of VideoStreaming interfaces
    associated with the function.


    # The VideoControl Interface.


    The VideoControl interface (Figure 7-7) has a standard interface descriptor with
    bInterfaceClass = 0Eh to indicate the video class, plus a class-specific VideoControl
    interface descriptor, which consists of a VideoControl interface header descriptor
    followed by one or more Terminal and/or Unit descriptors. A Terminal is the starting
    or ending point for information that flows into or out of a function. A Terminal
    may represent a USB endpoint or another component such as a CCD sensor, display
    module, or composite-video input or output. A Terminal descriptor can describe
    an Input Terminal or Output Terminal. The descriptor''s wTerminalType field names
    the function of the terminal the descriptor is associated with, such as camera,
    media transport input, or media transport output. A Unit transforms data flowing
    through a function. There are three types of Unit descriptors: Selector Unit for
    routing a data stream to an output, Processing Unit for controlling video attributes,
    and Extension Unit for vendor-defined functions.'
  merge: -1
  img_proc: true
- pgno: 243
  md: '![](img/3955d77b6be34048e3bc722d0b15c2a9_243_0.png)


    Figure 7-7: The VideoControl interface provides information about inputs, outputs,
    and other components of a video function.


    If the interface has an interrupt endpoint, the endpoint has a standard endpoint
    descriptor followed by a class-specific endpoint descriptor.


    **The VideoStreaming Interface.** Each VideoStreaming interface (Figure 7-8) has
    a standard interface descriptor. Following the standard interface descriptor,
    an interface with an IN endpoint has a class-specific VideoStreaming Input Header
    descriptor, and an interface with an OUT endpoint has a class-specific VideoStreaming
    Output Header descriptor.


    Following the Header descriptor is a Payload Format descriptor for each supported
    video format. For frame-based formats, the Payload Format descriptor is followed
    by one or more Frame descriptors that describe the'
