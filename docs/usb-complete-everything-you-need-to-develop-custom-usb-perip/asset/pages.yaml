- pgno: 352
  md: '# Get_Report


    **Purpose:** The host requests an Input or Feature report from a HID using a control
    transfer.


    **Request Number (bRequest):** 01h


    **Source of Data:** device


    **Data Length (wLength):** length of the report


    **Contents of wValue field:** The high byte contains the report type (1=Input,
    3=Feature), and the low byte contains the report ID. The default report ID is
    zero.


    **Contents of wIndex field:** the number of the interface the request is directed
    to.


    **Contents of data packet in the Data stage:** the report


    **Comments:** All HIDs must support this request. See also Set_Report'
  merge: -1
  img_proc: true
- pgno: 353
  md: '# Get_Idle


    **Purpose:** The host reads the current Idle rate from a HID.


    **Request Number (bRequest):** 02h


    **Source of Data:** device


    **Data Length (wLength):** 1


    **Contents of wValue field:** The high byte is zero. The low byte indicates the
    report ID that the request applies to. If the low byte is zero, the request applies
    to all of the HID’s Input reports.


    **Contents of wIndex field:** the number of the interface that supports this request.


    **Contents of data packet in the Data stage:** the Idle rate, expressed in units
    of 4 milliseconds.


    **Comments:** See Set_Idle for more details. HIDs aren’t required to support this
    request.'
  merge: -1
  img_proc: true
- pgno: 354
  md: '# Get_Protocol


    **Purpose:** The host learns whether the boot or report protocol is currently
    active in the HID.


    **Request Number (bRequest):** 03h


    **Source of Data:** device


    **Data Length (wLength):** 1


    **Contents of wValue field:** 0


    **Contents of wIndex field:** the number of the interface that supports this request.


    **Contents of data packet in the Data stage:** The protocol (0 = boot protocol,
    1 = report protocol).


    **Comments:** Boot devices must support this request. See also Set_Protocol.'
  merge: -1
