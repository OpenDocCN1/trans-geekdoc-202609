- pgno: 531
  md: 'alternative means of termination, including connecting directly to VBUS. In
    selecting an alternatatative means of termination, the designer is responsible
    for ensuring that all of the bus’s signal levels meet the USB specification’s
    requirements.


    An Engineering Change Notice titled Pull-up/pull-down resistors revises the USB
    2.0 specification by loosening the tolerances for pull-up and pull-down resistors
    that connect to a voltage source of 3.0–3.6V. The original values were 1.5 kilohms
    ±5% for the pull ups and 15 kilohms ±5% for the pull downs. The tolerances were
    loosened to make it easier to include the resistors on chip without requiring
    laser trimming of the values. Using the looser tolerances increases complexity
    slightly at upstream-facing ports because the device must switch between two pull-up
    values depending on whether the bus is idle or active. But overall, the result
    can be reduced cost to device manufacturers.


    Table 19-1 shows the new values. Devices that use the old tolerances remain compliant,
    and devices that use the old tolerances can communicate with devices that use
    the new tolerances. To use the wider tolerances, a device must use one pull-up
    value when the bus is idle and switch to a higher value when the upstream device
    begins to transmit. The upper limit on the pull up for the idle bus ensures that
    the idle voltage is at least the required minimum of 2.7V. For the active bus,
    the lower limit is the same as the original lower limit and the upper limit ensures
    that the data line remains in a high state if the receiver interprets noise as
    a Start-of-Packet signal.


    Using the new limits, the resistors can have tolerances as high as 27%. Examples
    of compliant values are 19 kilohms ±25% for the pull downs and 1200 and 2400 ohms
    ± 25% for the pull ups. A device can implement its pull up using two resistors
    in series, switching the second resistor into the circuit when the upstream device
    begins to transmit. A device must switch to the higher resistance within 0.5 bit
    time of detecting a J-to-K transition on the bus. To determine when to switch
    to the lower resistance, a device may use either or both of the following methods:
    on detecting a Single-ended Zero for more than 0.5 bit time or on detecting that
    the bus has been in the J state for more than 7 bit times. The ECN details a few
    hardware implications for designers of chips that use the wider tolerances.'
  merge: -1
  img_proc: true
