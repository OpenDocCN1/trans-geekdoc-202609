- pgno: 315
  md: "ment contains a handle to a device’s devnode (a structure that represents the\
    \ device) and a linked list of device interfaces associated with the device.\n\
    \nWhen finished using the device information set, the application should free\
    \ the resources used by calling SetupDiDestroyDeviceInfoList, as described later\
    \ in this chapter.\n\n# Identifying a Device Interface\n\nA call to SetupDiEnumDeviceInterfaces\
    \ retrieves a pointer to a structure that identifies a specific device interface\
    \ in the previously retrieved Device-InfoSet array. The call specifies a device\
    \ interface by passing an array index. To retrieve information about all of the\
    \ device interfaces, an application can loop through the array, incrementing the\
    \ array index until the function returns zero, indicating that there are no more\
    \ interfaces. The GetLastError API function then returns No more data is available.\n\
    \nHow do you know if a device interface is the one you’re looking for? The application\
    \ may need to request more information before deciding to use a device interface.\
    \ On detecting multiple interfaces, the application can investigate each in turn\
    \ until finding the desired device or determining that the device isn’t present.\n\
    \n# Visual C++\n\nThis is the declaration for DeviceInterfaceData’s type:\n\n\
    ```\ntypedef struct _SP_DEVICE_INTERFACE_DATA {\n    DWORD cbSize;\n    GUID InterfaceClassGuid;\n\
    \    DWORD Flags;\n    ULONG_PTR Reserved;\n} SP_DEVICE_INTERFACE_DATA,\n*PSP_DEVICE_INTERFACE_DATA;\n\
    ```"
