  md: '# Chapter 6


    # USB Controller


    The ‘1181B’s USB controller supports Endpoint 0 plus up to 14 additional endpoint
    addresses. All enabled endpoints share 2462 bytes of buffer memory. The control
    endpoint has 64-byte buffers. The amount of memory allocated to each of the other
    endpoint addresses is configurable. Isochronous and bulk endpoints are double
    buffered.


    Firmware controls when the chip attaches to the bus. The chip appears detached
