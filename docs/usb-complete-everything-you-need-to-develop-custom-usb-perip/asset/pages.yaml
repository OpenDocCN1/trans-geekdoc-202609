- pgno: 294
  md: '# Obtaining Identification Strings from an INF File


    In an INF file, each entry in a Models section has one hardware ID and zero or
    more compatible IDs. The hardware ID is listed first, followed by any compatible
    IDs, with commas separating the IDs.


    A hardware ID can have any of several forms. It can have one of the forms described
    above for a device ID for a device, interface, or HID collection. INF files provided
    with Windows may contain hardware IDs that use the compatible-ID formats described
    above to identify a device by class or descriptive name.


    # Finding a Match


    In looking for the best match between the information retrieved from a device
    and the information in INF files, Windows assigns a rank to every match found,
    with a lower rank indicating a better match (Table 9-3). NT-based operating systems,
    which include Windows 2000 and Windows XP, give a much lower rank to “trusted”
    drivers. These are drivers whose catalog (.cat) file has a digital signature that
    indicates that the driver has passed Windows Hardware Quality Labs (WHQL) testing.
    Chapter 17 has more about WHQL testing. A trusted driver is also called a signed
    driver. Windows 98 doesn’t check for trusted drivers.


    In an NT-based operating system, the best match is a device ID that matches a
    hardware ID in a trusted INF file. The second-best match is a device ID that matches
    a compatible ID in a trusted INF file. Next is a match between a compatible ID
    from the device and a hardware ID in a trusted INF file, followed by a match of
    compatible IDs from the device and a trusted INF file. Only if there are no matches
    at all with a trusted INF file will an NT-based operating system consider an ID
    from an untrusted INF file.


    If Windows can’t find a match, it starts the Found New Hardware wizard and gives
    the user a chance to specify a location (such as a CD drive) to look for the INF
    file.


    Composite devices, which have multiple interfaces, are a special case. Because
    each interface may require a different driver, selecting a driver using'
  merge: -1
  img_proc: true
