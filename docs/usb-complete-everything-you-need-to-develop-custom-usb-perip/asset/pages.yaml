    as well. The examples in this chapter are written for Visual Basic .NET and Visual
    C++. NET.


    Because calling API functions can be an obscure art at times, this section includes
    an introduction to some things that are useful to know when using the Windows
    API.


    # Managed and Unmanaged Code


    Understanding how to call API functions in Visual Basic .NET applications requires
    understanding the difference between managed and unmanaged code. Windows API functions
    use unmanaged code. Their DLLs contain compiled machine code that executes directly
    on the target CPU. In Visual Basic .NET and Visual C# .NET, all program code is
    managed code that compiles to the Microsoft Intermediate Language (MSIL). The
    .NET platform''s common language runtime (CLR) environment executes the MSIL code.


    Managed code has advantages. Because all .NET languages use the same CLR, components
    written in different .NET languages can easily interoperate. For example, a Visual
    Basic .NET application can call a function written in Visual C# .NET without worrying
    about differences in calling conventions. The CLR also simplifies programming
    by using garbage collection to manage memory.


    A .NET application can call functions that use unmanaged code, including Windows
    API functions. But Visual Basic .NET and Visual C# .NET applications must take
    special care to ensure that any data being passed survives the trip from managed
    to unmanaged code, and back if necessary.'
