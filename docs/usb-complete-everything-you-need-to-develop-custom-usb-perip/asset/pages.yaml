    | Resistor | Bus State | Minimum (ohms) | Maximum (ohms) | Acceptable Value with
    25% Tolerance |

    |---|---|---|---|---|

    | pull down | All | 14,250 | 24,800 | 19k |

    | pull up | Idle | 900 | 1575 | 1.2k |

    |  | Active | 1425 | 3090 | 2.4k |

    |  | Single-Ended Zero | 900 | <3090 | 2.4k |


    # High-speed Transceivers


    A high-speed device must support control requests at full speed, so the device
    must contain transceivers to support both full and high speeds and the logic to
    switch between them. A high-speed-capable device’s upstream transceivers aren’t
    allowed to support low speed. In an external 2.0 hub, the downstream transceivers
    at ports with user-accessible connectors must support all three speeds.


    # Why 480 Megabits per Second?


    High speed’s rate of 480 Megabits/sec. was chosen for several reasons. The frequency
    is slow enough to allow using the same cables and connectors as full speed. Components
    can use CMOS processes and don’t require the advanced compensation used in high-speed
    digital signal processors. Tests of high-speed drivers showed 20 to 30 percent
    jitter at 480 Megabits/sec. Because receivers can be designed to tolerate 40 percent
    jitter, this bit rate allows a good margin of error. And 480 is an even multiple
    of 12, so a single crystal can support both full and high speed.


    The use of separate drivers for high speed makes it easy to add high speed to
    the existing interface. Current-mode drivers were chosen because they’re fast.'
  merge: -1
  img_proc: true
- pgno: 533
  md: '![](img/3955d77b6be34048e3bc722d0b15c2a9_533_0.png)


    FULL/HIGH-SPEED TRANSCEIVER

    AT THE DEVICE''S UPSTREAM-FACING PORT


