- pgno: 269
  md: 'For faster performance, you can move portions of your code from the user-mode
    driver to a kernel-mode driver called a Kernel PlugIn, which you compile with
    Visual C++. For debugging, the included Debug Monitor application enables you
    to monitor communications handled by the driver. Different editions of WinDriver
    USB support Windows, Windows CE .NET, and Linux.


    # Toolkits that Provide Libraries for Creating Custom Drivers


    The completely automated toolkits aren''t suitable for every device. They can''t
    create filter drivers, and you may want a completely custom driver for the best
    possible performance. Two products for creating custom drivers are CompuWare''s
    DriverWorks in the DriverStudio suite and Jungo''s Kernel-Driver USB.


    Each of these products has Wizards and code libraries that do much of the work
    for you. You need to fill in the provided skeleton code and compile the driver.
    The driver''s performance can be as fast as if you had written the driver from
    scratch. DriverWorks is capable of generating driver code for devices that use
    other buses besides USB. Jungo has a separate KernelDriver product for non-USB
    devices.


    # Using GUIDs


    A Globally Unique Identifier (GUID) is a 128-bit value that uniquely identifies
    a class or other entity. Windows uses GUIDs in identifying two types of device
    classes: device setup classes and device interface classes. A device setup GUID
    identifies a device setup class, which encompasses devices that Windows installs
    in the same way. A device interface GUID identifies a device interface class.
    The device interface GUID provides a mechanism for applications to communicate
    with a driver assigned to devices in the class. In many cases, devices that belong
    to a particular device setup class also belong to the same device interface class.
    Some SetupDi_ API functions accept either type of GUID. But each type of GUIDs
    provides access to different types of information used for different purposes.'
