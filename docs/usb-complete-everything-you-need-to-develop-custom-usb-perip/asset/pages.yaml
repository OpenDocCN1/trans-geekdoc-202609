- pgno: 491
  md: '# 17


    # Testing and Debugging


    In addition to the chip-specific development boards and debugging software described
    in Chapter 6, a variety of other hardware and software tools can help in testing
    and debugging USB devices and their host software. This chapter introduces tools
    available from the USB-IF and other sources. I also explain what’s involved in
    passing the tests that required for devices and drivers to earn the Certified
    USB logo and the Windows logo.


    # Tools


    Without a doubt the most useful tool for USB device developers is a protocol analyzer,
    which enables you to monitor USB traffic and other bus events. The analyzer collects
    data on the bus and decodes and displays the data you request in user-friendly
    formats. You can watch what happened during enumeration, detect and examine protocol
    and signaling errors, view data transferred during control, interrupt, bulk, and
    isochronous transfers, and focus on any aspect of a communication you specify.'
  merge: -1
  img_proc: true
- pgno: 492
  md: '![](img/3955d77b6be34048e3bc722d0b15c2a9_492_0.png)


    Figure 17-1: A hardware protocol analyzer monitors traffic between a device under
    test and the device''s host. An interface to a PC (or logic analyzer) enables
    viewing the captured data.


    A hardware analyzer is a combination of hardware and software, while a software
    analyzer consists only of software that runs on the device’s host computer. The
    capabilities of the two types have much overlap, but each can also record and
    display information that isn’t available to the other type.


    Another useful tool is a traffic generator, which emulates a host or device and
    offers precise control over what the emulated host or device places on the bus.


    # Hardware Protocol Analyzers


    A hardware protocol analyzer includes a piece of equipment that captures the signals
    in a cable segment without affecting the traffic in the segment. The analyzer
    connects in a cable segment upstream from the device under test (Figure 17-1).
    To enable viewing the captured traffic, the analyzer has another connection to
    a PC or logic analyzer. A connection to a PC can be'
  merge: -1
  img_proc: true
- pgno: 493
  md: 'via USB or another port type such as Ethernet. A few analyzers instead connect
    to logic analyzers from Agilent or Tektronix.


    With a hardware analyzer, you can see the data in the cable down to the individual
    bytes that make up each packet. There''s no question about what the host or device
    did or didn''t send. For example, if the host sends an IN token packet, you can
    quickly see whether the device returned data or a NAK. You can view the packets
    in every stage of a control request. Time stamps enable you to see how often the
    host polls an endpoint.


    Analyzers are available from a variety of vendors and with a range of prices.
    Ellisys'' USB Explorer 200 is a relatively inexpensive yet very serviceable analyzer
    that supports all three bus speeds. In this chapter, I use the Explorer to illustrate
    the kinds of things you can do with an analyzer. Vendors are always updating and
    improving their products, so check for the latest information when you''re ready
    to buy.


    # The Hardware


    To use the Explorer, you must have two USB host controllers available. One communicates
    with the Explorer, and the other controls the bus being monitored. Both host controllers
    can be in the same PC, but for best performance, Ellisys recommends using two
    PCs.


    The Explorer''s back panel has a USB receptacle that connects to the PC that is
    running the Explorer''s software. The PC detects the Explorer as a USB device
    that uses a vendor-specific driver provided by Ellisys.


    Two USB receptacles on the front panel connect the analyzer in a cable segment
    upstream from the device being tested. One cable connects to the device being
    tested or a hub upstream from the device. The other cable connects to the host''s
    root hub or another hub upstream from the analyzer.


    The analyzer''s circuits must capture the traffic as unobtrusively as possible.
    The host and device should detect no difference in the bus traffic when the analyzer
    is present. The two cables on the front panel and the analyzer''s electronics
    must emulate an ordinary cable segment of 5 meters or less (3 meters or less for
    a low-speed segment). For these cables, Ellisys recommends using cables whose
    lengths together total 3 meters or less.'
  merge: -1
  img_proc: true
- pgno: 494
  md: '![](img/3955d77b6be34048e3bc722d0b15c2a9_494_0.png)


    Figure 17-2: Ellisys’ USB Explorer 200 protocol analyzer includes Visual USB application
    software for viewing captured data. This example shows transactions and other
    events that occured when a device was attached downstream from the analyzer


    # The Software


    Ellisys’ Visual USB Analysis Software enables you to start and stop data logging
    and to save, view, and print the results. Figure 17-2 shows data captured by an
    analyzer. You can specify the amount, type, and format of data the displayed.
    For less detail, you can elect to hide the individual packets, repeated NAKs,
    and other information. Filters enable you to select the precise data to display.
    You can specify criteria such as a device or devices, endpoints, speeds, status
    codes, and control requests. The software displays only the traffic that meets
    the criteria you specify.


    A Details pane provides more information about a request, transaction, packet,
    or other item in a row in the application’s main window (Figure 17-3). A Data
    pane displays the individual bytes in hexadecimal and ASCII.'
  merge: -1
  img_proc: true
- pgno: 495
  md: '![](img/3955d77b6be34048e3bc722d0b15c2a9_495_0.png)


    Figure 17-3: The Details pane in Ellisys’ Visual USB software has more information
    about a request, transaction, packet, or other event.


    You can also search for specific items, including events, token-packet types,
    traffic to and from a specific device or endpoint, and data.


    Additional software modules add support for triggering on events, decoding class-specific
    information, and exporting captured data in text, XML, and other formats.


    # Software Protocol Analyzers


    A software-only protocol analyzer runs on the host computer of the device being
    tested. You can view traffic to and from any device that connects to any of the
    computer’s host controllers.


    A software analyzer can display driver information that a hardware analyzer can’t
    access. As Chapter 8 explained, Windows drivers communicate with USB devices using
    I/O Request Packets (IRPs) that contain USB Request Blocks (URBs). A software
    analyzer can show the IRPs and URBs that a driver has submitted and the responses
    received from a device.'
  merge: -1
  img_proc: true
- pgno: 496
  md: '# Chapter 17


    ![](img/3955d77b6be34048e3bc722d0b15c2a9_496_0.png)


    Figure 17-4: SourceUSB''s application shows USB I/O requests at a host computer.
    These requests are for mouse communications.


    But a software analyzer can''t show anything that the host-controller or hub hardware
    handles on its own. For example, the analyzer won''t show how many times an endpoint
    NAKed a transaction before returning an ACK or the precise time a transaction
    occurred on the bus.


    Some software analyzers use a filter driver that loads when the operating system
    loads the driver for the device being monitored. Because the filter driver isn''t
    loaded until the host has enumerated the device, the analyzer can''t show the
    enumeration requests and other events that occur at device attachment.


    Sourcequest, Inc.''s SourceUSB is a software analyzer that records USB I/O requests
    and other events, including enumeration requests. You can view the'
  merge: -1
  img_proc: true
- pgno: 497
  md: 'requests along with additional information about the system’s host controllers,
    the devices on the host controllers’ buses, and the drivers assigned to each host
    controller and device. Figure 17-4 shows logged requests and additional information
    about the request in the selected row.


    The SourceUSB application can also display a tree of all of the system’s host
    controllers and their attached devices and provide information about the drivers
    assigned to each host controller and device. As with a hardware analyzer, you
    have great flexibility in selecting what information you want to log and view.


    Another software-only analyzer is the SnoopyPro project, free with source code
    from www.sourceforge.net.


    # Traffic Generators


    Sometimes it’s useful to be able to control bus traffic and signaling beyond what
    you can do from host software and device firmware. Some higher-end protocol analyzers
    can also function as traffic generators that emulate a host or device and give
    you precise control over the traffic that the emulated host or device places on
    the bus. In addition to generating valid traffic, a traffic generator can introduce
    errors such as bit-stuff and CRC errors. Two protocol analyzers with these abilities
    are Catalyst Enterprises, Inc.’s SBAE-30 Analyzer/Exerciser and LeCroy Corporation’s
    CATC USBTracer/Trainer. Another option is RPM Systems’ Root 2 USB Test Host, which
    emulates a USB host and enables you to specify traffic to generate on the bus,
    control the bus voltage, and measure bus current.


    # Testing


    The USB-IF and Microsoft offer testing opportunities for developers of USB devices
    and host software. Passing the tests can earn a product the right to display the
    Certified USB logo and/or the Microsoft Windows logo. A logo can give users confidence
    that a device is thoroughly tested and reliable. A driver that passes Microsoft’s
    tests can be digitally signed, which gives users confidence that the driver will
    work without problems.'
  merge: -1
  img_proc: true
- pgno: 498
  md: '# Chapter 17


    # Compliance Testing


    One advantage USB has over other interfaces is that the developers of the specification
    didn’t stop with the release of the specification. The USB-IF remains involved
    in helping developers design and test USB products. The USB-IF’s Web site has
    many useful documents and tools.


    The USB-IF has also developed a compliance program that specifies and sponsors
    tests for peripherals, hubs, host systems, On-The-Go devices, silicon building
    blocks, cable assemblies, and connectors. When a product passes the tests, The
    USB-IF deems it to have “reasonable measures of acceptability” and adds the product
    to its Integrators List of compliant devices. On receiving a signed license agreement
    and payment, the USB-IF authorizes the product to display the Certified USB logo.
    Even if you don’t plan to submit your device to formal compliance testing, you
