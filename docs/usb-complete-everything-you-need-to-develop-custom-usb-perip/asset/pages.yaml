- pgno: 20
  md: '# USB Basics


    What if you had the chance to design a peripheral interface from scratch? Your
    wish list would likely include these qualities:


    +   - Easy to use, so there’s no need to fiddle with configuration and setup details.

    +   - Fast, so the interface doesn’t become a communications bottleneck.

    +   - Reliable, so that errors are rare, with automatic retries when errors occur.

    +   - Versatile, so many kinds of peripherals can use the interface.

    +   - Inexpensive, so manufacturers and users don’t balk at the price.

    +   - Power-conserving, to save energy and extend battery life in portable computers
    and devices.

    +   - Supported by the Windows and other operating systems, so developers don’t
    have to write low-level drivers to communicate with the peripherals.'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'The Universal Serial Bus (USB) has all of these qualities. USB was designed
    from the ground up to be an interface for communicating with many types of peripherals
    without the limits and frustrations of older interfaces.


    Every recent PC and Macintosh computer includes USB ports that can connect to
    standard peripherals such as keyboards, mice, scanners, cameras, printers, and
    drives as well as custom hardware for just about any purpose.


    This chapter introduces USB, including its advantages and limits, some history
    about the interface and recent enhancements to it, and a look at what''s involved
    in designing and programming a device with a USB interface.


    # What USB Can Do


    USB is a likely solution any time you want to use a computer to communicate with
    a device outside of the computer. The interface is suitable for mass-produced,
    standard peripheral types as well as small-volume designs, including one-of-a-kind
    projects.


    To be successful, an interface has to please two audiences: the users who want
    to use the peripherals and the developers who design the hardware and write the
    code that communicates with the device. USB has features to please both.


    # Benefits for Users


    From the user''s perspective, the benefits of USB are ease of use, fast and reliable
    data transfers, flexibility, low cost, and power conservation. Table 1-1 compares
    USB with other popular interfaces.


    # Ease of Use


    Ease of use was a major design goal for USB, and the result is an interface that''s
    a pleasure to use for many reasons:


    **One interface for many devices.** USB is versatile enough to be usable with
    a variety of peripheral types. Instead of having a different connector type and
    supporting hardware for each peripheral, one interface serves many.'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'Table 1-1: Comparison of popular computer interfaces. Where a standard doesn''t
    specify a maximum, the table shows a typical maximum.


    | Interface | Format | Number of Devices (maximum) | Distance (maximum, feet)
    | Speed (maximum, bits/sec.) | Typical Use |

    |---|---|---|---|---|---|

    | USB | asynchronous serial | 127 | 16 (up to 96 ft. with 5 hubs) | 1.5M, 12M,
    480M | Mouse, keyboard, drive, audio, printer, other standard and custom peripherals
    |

    | Ethernet | serial | 1024 | 1600 | 10G | General network communications |

    | IEEE-1394b (FireWire 800) | serial | 64 | 300 | 3.2G | Video, mass storage |

    | IEEE-488 (GPIB) | parallel | 15 | 60 | 8M | Instrumentation |

    | IrDA | asynchronous serial infrared | 2 | 6 | 16M | Printers, handheld computers
    |

    | I²C | synchronous serial | 40 | 18 | 3.4M | Microcontroller communications |

    | Microwire | synchronous serial | 8 | 10 | 2M | Microcontroller communications
    |

    | MIDI | serial current loop | 2 (more with flow-through mode) | 50 | 31.5k |
    Music, show control |

    | Parallel Printer Port | parallel | 2 (8 with daisy-chain support) | 10–30 |
    8M | Printers, scanners, disk drives |

    | RS-232 (EIA/TIA-232) | asynchronous serial | 2 | 50-100 | 20k (115k with some
    hardware) | Modem, mouse, instrumentation |

    | RS-485 (TIA/EIA-485) | asynchronous serial | 32 unit loads (up to 256 devices
    with some hardware) | 4000 | 10M | Data acquisition and control systems |

    | SPI | synchronous serial | 8 | 10 | 2.1M | Microcontroller communications |'
  merge: -1
  img_proc: true
- pgno: 23
  md: '**Automatic configuration.** When a user connects a USB peripheral to a PC,
    Windows detects the peripheral and loads the appropriate software driver. The
    first time the peripheral connects, Windows may prompt the user to insert a disk
    with driver software, but other than that, installation is automatic. There''s
    no need to restart the system before using the peripheral.


    **Easy to connect.** With USB, there''s no need to open the computer''s enclosure
    to add an expansion card for each peripheral. A typical PC has four or more USB
    ports. You can expand the number of ports by adding hubs with additional ports.


    **Easy cables.** USB cable connectors are keyed so you can''t plug them in wrong.
    A cable segment can be as long as 5 meters. With hubs, a peripheral can be as
    far as 30 meters from its host PC. USB connectors are small and compact in contrast
    to typical RS-232 and parallel connectors. To ensure reliable operation, the USB
    specification includes detailed requirements that all cables and connectors must
    meet.


    **Hot pluggable.** You can connect and disconnect a USB peripheral whenever you
    want, whether or not the system and peripheral are powered, without damaging the
    PC or device. The operating system detects when a peripheral is attached and readies
    it for use.


    **No user settings.** USB peripherals don''t have user-selectable settings such
    as port addresses and interrupt-request (IRQ) lines so there are no jumpers to
    set or configuration utilities to run.


    **Frees hardware resources for other devices.** Using USB for as many peripherals
    as possible frees up IRQ lines for the peripherals that require them. The PC dedicates
    a series of port addresses and one IRQ line to the USB host controller, but individual
    peripherals don''t require additional resources or any PC programming that involves
    specifying port addresses or detecting hardware interrupts. In contrast, peripherals
    with other interfaces may require dedicated port addresses, an IRQ line, and an
    expansion slot.


    **No power supply required (sometimes).** The USB interface includes power-supply
    and ground lines that provide a nominal +5V from the computer''s or hub''s power
    supply. A peripheral that requires up to 500 milliamperes can draw all of its
    power from the bus instead of having to provide a'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'power supply. In contrast, peripherals that use other interfaces may have to
    choose between including a power supply inside the device or using a bulky and
    inconvenient external supply.


    # Speed


    USB supports three bus speeds: high speed at 480 Megabits/sec., full speed at
    12 Megabits/sec., and low speed at 1.5 Megabits/sec. The USB host controllers
    in recent PCs support all three speeds.


    The bus speeds describe the rate that information travels on the bus. In addition
    to data, the bus must carry status, control, and error-checking signals. Plus,
    all peripherals must share the bus. So the rate of data transfer that an individual
    peripheral can expect will be less than the bus speed. The theoretical maximum
    rate for a single data transfer is about 53 Megabytes/sec. at high speed, 1.2
    Megabytes/sec. at full speed, and 800 bytes/sec. at low speed.


    The USB 1.0 specification defined low and full speeds. Low speed was included
    for two reasons. Mice require flexible cables to make the devices easy to move
    around. Low-speed cables don’t require twisted pairs or as much shielding and
    thus can be more flexible than full/high-speed cables. Also, low-speed devices
    can often be manufactured more cheaply. Full speed was intended to replace most
    other peripherals that used RS-232 (serial) and parallel ports. The data-transfer
    rates attainable at full speed are comparable to or better than the speeds attainable
    with earlier interfaces. High speed became an option with the release of version
    2.0 of the USB specification.


    # Reliability


    The reliability of USB is due to both the hardware and the protocols for data
    transfer. The hardware specifications for USB drivers, receivers, and cables ensure
    a quiet interface that eliminates most noise that could cause data errors. The
    USB protocol enables the detecting of errors in received data and notifying the
    sender so it can retransmit. The detecting, notifying, and retransmitting are
    done in hardware and don’t require any programming or user intervention.'
