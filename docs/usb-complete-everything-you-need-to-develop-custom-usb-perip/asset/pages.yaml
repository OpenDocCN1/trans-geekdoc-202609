- pgno: 155
  md: '# Set_Configuration


    **Purpose:** The host requests the device to use the specified configuration.


    **Request Number (bRequest):** 09h


    **Source of Data:** no Data stage


    **Data Length (wLength):** none


    **Contents of wValue field:** The lower byte specifies a configuration. If the
    value matches a configuration supported by the device, the device implements the
    requested configuration. A value of zero indicates not configured. If the value
    is zero, the device enters the Address state and requires a new Set_Configuration
    request to be configured.


    **Contents of wIndex field:** 0


    **Contents of data packet in the Data stage:** none


    **Supported states:** Address, Configured.


