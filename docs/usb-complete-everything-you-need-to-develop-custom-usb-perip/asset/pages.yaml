- pgno: 159
  md: '# # Other Control Requests


    In addition to the requests defined in the USB 2.0 specification, a device may
    respond to class-specific and vendor-specific control requests.


    # ## Class-specific Requests


    A class may define requests for devices in its class. A class-specific request
    may be required or optional for devices in the class. Some requests are unrelated
    to the standard requests, while others build on the standard requests by defining
    class-specific fields in a request. An example of a request that’s unrelated to
    the standard requests is the Get_Max_LUN request supported by some mass-storage
    devices. The host uses this request to find out the number of logical units the
    interface supports. An example of a request that builds on an existing request
    is the Get_Port_Status request that hubs must support. This request is structured
    like the standard Get_Status request. But Get_Port_Status has different values
    in two fields. In bmRequestType, bits 6 and 5 are 01 to indicate that the request
    is defined by a standard USB class, and bits 4 through 0 are 00011 to indicate
    that the request applies to a unit other than the device or an interface or endpoint.
    (The request applies to a port on a hub.) The wIndex field holds the port number.


    # ## Vendor-specific Requests


    A vendor may define custom requests for control transfers with specific devices.
    Implementing a custom request in a control transfer requires all of the following:


    +   - Vendor-defined fields as needed in the Setup and optional Data stages of
    the request. Bits 6 and 5 in the Setup stage’s data packet are set to 10 to indicate
    a vendor-defined request.

    +   - In the device, code that detects the request number in the Setup packet
    and knows how to respond.

    +   - In the host, a vendor-specific device driver to initiate the request. Applications
    can’t initiate vendor-specific requests on their own. The application must call
    a function exposed by a driver that defines the request.'
  merge: -1
  img_proc: true
- pgno: 160
  md: '# 6


    # Chip Choices


    When you need to select a USB controller for a project, the good news is that
    there are plenty of chips to choose from. The down side is that deciding what
    controller to use in a project can be overwhelming at first.


    As with any project involving embedded systems, the decision depends on what functions
    the chip has to perform, cost, availability, and ease of development. Ease of
    development depends on the availability and quality of development tools, device-driver
    software for the host, and sample code, plus your experience with and preferences
    for device architecture and language compilers.


    This chapter is a guide to selecting a USB controller, including a tutorial about
    what you need to consider and descriptions of a sampling of chips with a range
    of abilities. The chips covered include inexpensive ones with simple architectures
    and basic USB support as well as more full-featured, high-end chips. Chapter 20
    discusses controllers for use in USB On-The-Go devices.'
  merge: -1
  img_proc: true
- pgno: 161
  md: '# Components of a USB Device


    Every USB device must have the intelligence to implement the USB protocol. The
    device must detect and respond to requests and other events at its USB port. The
    device must be able to provide data to be sent on the bus and retrieve and use
    data received on the bus. A microcontroller or application-specific integrated
    circuit (ASIC) typically performs these functions in the device.


    Controller chips vary in how much firmware support they require for USB communications.
    Some controllers require little more than accessing a series of registers to provide
    and retrieve USB data. Others require the device firmware to handle more of the
    protocol, including managing the sending of descriptors to the host, setting data-toggle
    values, and ensuring that the appropriate handshake packets are sent.


    Some controllers have a general-purpose CPU on chip. Others must interface to
    an external CPU that handles the non-USB tasks and communicates with the USB controller
    as needed. These chips are sometimes called USB interface chips to distinguish
    them from microcontrollers with USB capabilities. All USB controllers have a USB
    port along with whatever buffers, registers, and other I/O capabilities the controller
    requires to accomplish its tasks. A controller chip with a general-purpose CPU
    has either program and data memory on-chip or an interface to these in external
    memory.


    For high-volume applications that require fast performance, another option is
    to design and manufacture an ASIC. Several sources offer synthesizable VHDL and
    Verilog Source code for use in custom ASICs.


    Not all controller chips support all four transfer types, and a controller may
    support one or more bus speeds. Many controllers support fewer than the maximum
    number of endpoint addresses (1 control endpoint and 30 other endpoint addresses)
    because few devices need the maximum number.'
  merge: -1
  img_proc: true
