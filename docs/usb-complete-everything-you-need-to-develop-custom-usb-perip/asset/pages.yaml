  md: 'To use interrupt and isochronous transfers effectively, both the sender and
    receiver have to be capable of sending and receiving at the desired rate. A device
    that is sending data must write the data to send into the endpoint’s transmit
    buffer in time to enable the controller to place the data on the bus on receiving
    an IN token packet. A device that is receiving data must read the previous data
    from the endpoint’s buffer before the new data arrives. Otherwise either the old
    data will be overwritten or the device will NAK or drop the new data.


    One way to help ensure that the device is always ready for a transfer is to use
    double (or quadruple) buffering, as described in Chapter 6. Multiple buffers give
    the firmware extra time to load the next data to transfer or to retrieve just-received
    data.


    # Host Capabilities


    The capabilities of the device driver and application software on the host can
    also can affect whether all available transfers take place.


    A device driver requests a transfer by submitting an I/O request packet (IRP)
    to a lower-level driver. For interrupt and isochronous transfers, if there is
    no outstanding IRP for an endpoint when its scheduled time comes up, the host
    controller skips the transaction attempt. To ensure that no transfer opportunities
    are missed, drivers typically submit a new IRP immediately on completing the previous
    one.


    The application software that uses the data also has to be able to keep up with
    the transfers. For example, the driver for HID-class devices places report data
    received in interrupt transfers in a buffer, and applications use ReadFile to
    retrieve reports from the buffer. If the buffer is full when a new report arrives,
    the driver discards the oldest report and replaces it with the newest one. If
    the application can’t keep up, some reports are lost. A solution is to increase
    the size of the buffer the driver uses to store received data or to read multiple
    reports at once.


