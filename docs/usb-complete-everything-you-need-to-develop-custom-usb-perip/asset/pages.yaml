    hardware (BCD). |

    | 5 | bNumDescriptors | 1 | Number of subordinate report and physical descriptors.
    |

    | 6 | bDescriptorType | 1 | The type of a class-specific descriptor that follows.
    (A report descriptor (required) is type 22h.) |

    | 7 | wDescriptorLength | 2 | Total length of the descriptor identified above.
    |

    | 9 | bDescriptorType | 1 | Optional. The type of a class-specific descriptor
    that follows. A physical descriptor is type 23h. |

    | 10 | wDescriptorLength | 2 | Total length of the descriptor identified above.
    Present only if bDescriptorType is present immediately above. May be followed
    by additional wDescriptorType and wDescriptorLength fields to identify additional
    physical descriptors. |


    descriptor has two or more bDescriptorType fields. One identifies the HID descriptor
    and the other(s) identify the type of a subordinate descriptor.


    # The Descriptor


    **bLength.** The length in bytes of the descriptor.


    **bDescriptorType.** The value 21h indicates a HID descriptor.


    # The Class


    **bcdHID.** The HID specification number that the interface complies with. In
    BCD format. Version 1.0 is 0100h; Version 1.1 is 0110h.


    **bCountryCode.** If the hardware is localized for a specific country, this field
    is a code identifying the country. The HID specification lists the codes. If the
    hardware isn’t localized, this field is 00h.'
