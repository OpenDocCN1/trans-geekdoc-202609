- pgno: 208
  md: '# Windows Support


    Under Windows, the *usbaudio.sys* minidriver supports USB audio devices, including
    MIDI devices. In Windows editions up to and including Windows XP, the driver supports
    a subset of the features in the USB audio specification. Microsoft’s Universal
    Audio Architecture (UAA) initiative promises an improved driver architecture for
    future Windows editions. *USB Audio Devices and Windows* is a white paper from
    Microsoft that details the abilities and limits of Windows XP’s audio driver.


    Applications can access USB audio devices using the DirectMusic and DirectSound
    components of Windows’ DirectX technology or using Windows Multimedia audio functions.


    # Chip/Smart Card Interface


    Smart cards are the familiar plastic cards used for phone calls, gift cards, keyless
    entry, access to toll roads and mass transit, storing medical and insurance data,
    enabling of satellite TV receivers, and other applications that require storing
    small-to-moderate quantities of information with easy and portable access.


    Each card contains a module with memory and often a CPU. Many cards allow updating
    of their contents, to change a monetary value or an entry code, for example. Some
    cards have exposed electrical contacts, while others communicate via embedded
    antennas. Another term for smart card is chip card.


    To access a smart card, you connect it to a Chip Card Interface Device (CCID),
    typically by inserting the card into a slot or waving a contactless card by a
    reader. A popular term for CCID is smart-card reader, though many CCIDs can also
    write to cards. USB enters the picture because some CCIDs have USB interfaces
    for communicating with USB hosts.


    # Documentation


    The specification *USB Chip/Smart Card Interface Devices* defines a protocol for
    CCIDs with USB interfaces. The current version at this writing is 1.0. The ISO/IEC
    7816 standard (available from *www.iso.ch*) defines the physi-'
  merge: -1
