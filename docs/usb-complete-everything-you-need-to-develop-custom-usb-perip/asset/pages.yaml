- pgno: 463
  md: '# Hubs: the Link between Devices and the Host


    In an interrupt transaction, the hub schedules the start split in the microframe
    just before the earliest time that the hub is expected to begin the transaction
    with the device. For example, assume that the microframes in a frame are numbered
    in sequence, Y0 through Y7. If the start split is in Y0, the transaction with
    the device may occur as early as Y1. The device may have data or a handshake response
    to return to the host as early as Y2. The results of previous transactions and
    bit stuffing can affect when the transaction with the device actually occurs,
    so the host schedules time for three complete-split transactions, in Y2, Y3, and
    Y4. If the hub doesn’t yet have the information to return in a complete split,
    the hub returns a NYET status code and the host retries.


    Full-speed isochronous transactions can transfer up to 1023 bytes. To ensure that
    the data transfers just in time, or as soon as the device has data to send or
    is ready to receive data, transactions with large packets use multiple start splits
    or complete splits, with up to 188 bytes of data in each. This is the maximum
    amount of full-speed data that fits in a microframe. A single transaction’s data
    can require up to eight start-split or complete-split transactions.


    In an isochronous IN transaction, the host schedules complete-split transactions
    in every microframe where the host expects that the device will have at least
    a portion of the data to return. Requesting the data in smaller chunks ensures
    that the host receives the data as quickly as possible. The host doesn’t have
    to wait for all of the data to transfer from the device at full speed before beginning
    to retrieve the data.


    In an isochronous OUT transaction, the host sends the data in one or more start-split
    transactions. The host schedules the transactions so the hub’s buffer will never
    be empty but will contain as few bytes as possible. Each SPLIT packet contains
    bits to indicate the data’s position in the low- or full-speed data packet (beginning,
    middle, end, or all). There is no complete-split transaction.'
  merge: -1
  img_proc: true
- pgno: 464
  md: '# Bandwidth Use of Low- and Full-speed Devices


    Because a 2.0 hub acts as a host controller in managing transactions, low- and
    full-speed devices share 1.x bandwidth only with devices that use the same transaction
    translator. So if two full-speed devices connect to their own 2.0 hubs on a high-speed
    bus, each device can use all of the full-speed bandwidth it wants. When the hub
    converts to high speed, the 1.x communications will use little of the high-speed
    bandwidth.


    However, for bulk transactions, the extra transaction with the host in each split
    transaction can slow the rate of data transfer with a full-speed device on a busy
    bus that is also carrying high-speed bulk traffic.


    Many hubs provide one transaction translator for all ports, but a single hub can
    also have a transaction translator for each port that connects to a low- or full-speed
    device.


    # The Hub Controller


    The hub controller manages communications between the host and the hub. The communications
    include enumeration along with other communications and actions due to events
    at downstream ports.


    As it does for all devices, the host enumerates a newly detected hub to find out
    its abilities. The hub descriptor retrieved during enumeration tells the host
    how many ports the hub has. After enumerating the hub, the host requests the hub
    to report whether there are any devices attached. If so, the host enumerates these
    as well.


    The host finds out if a device is attached to a port by sending the hub-class
    request Get_Port_Status. This is similar to a Get_Status request, but sent to
    a hub with a port number in the Index field. The hub returns two 16-bit values
    that indicate whether a device is attached as well as other information, such
    as whether the device is low power or in the Suspend state.


    The hub controller is also responsible for disabling any port that was responsible
    for loss of bus activity or babble. Loss of bus activity occurs when a packet
    doesn’t end with the expected End-of-Packet signal. Babble occurs when a device
    continues to transmit beyond the End-of-Packet signal.'
  merge: -1
  img_proc: true
- pgno: 465
  md: '# Hubs: the Link between Devices and the Host


    In addition to Endpoint 0, which all devices must have for control transfers,
    each hub must have a Status Change endpoint configured for interrupt IN transfers.
    The host polls this endpoint to find out if there have been any changes at the
    hub. On each poll, the hub controller returns either a NAK if there have been
    no changes, or data that indicates a specific port or the hub itself as the source
    of the change. If there is a change, the host sends requests to find out more
    about the change and to take whatever action is needed. For example, if the hub
    reports the attachment of a new device, the host attempts to enumerate it.


    # Speed


    An external 2.0 hub''s downstream ports must support all three speeds. In the
    upstream direction, if a 2.0 hub''s upstream segment is high speed, the hub communicates
    at high speed. Otherwise, the hub communicates upstream at low and full speeds.


    A 1.x hub''s upstream port must support low- and full-speed communications. All
    downstream ports with connectors must support both low- and full-speed communications.
    1.x hubs never support high speed.


    # Filtering Traffic according to Speed


    Low-speed devices aren''t capable of receiving full-speed data, so hubs don''t
    repeat full-speed traffic to low-speed devices. This behavior is necessary because
    a low-speed device would try to interpret the full-speed traffic as low-speed
    data and might even mistakenly see what looks like valid data. Full- or high-speed
    data on a low-speed cable could also cause problems due to radiated electromagnetic
    interference (EMI). In the other direction, hubs receive and repeat any low-speed
    data upstream.


    Low- and full-speed devices aren''t capable of receiving high-speed data, so 2.0
    hubs don''t repeat high-speed traffic to these devices, including 1.x hubs.


    # Detecting Device Speed


    On attachment, every device must support either low or full speed. A hub detects
    whether an attached device is low or full speed by detecting which'
  merge: -1
  img_proc: true
- pgno: 466
  md: '![](img/3955d77b6be34048e3bc722d0b15c2a9_466_0.png)


    ![](img/3955d77b6be34048e3bc722d0b15c2a9_466_1.png)


    Figure 15-5: The device’s port has a stronger pull-up than the hub’s. The location
    of the pull-up tells the hub whether the device is low or full speed. High-speed
    devices are full speed at attachment.


    signal line is more positive on an idle line. Figure 15-5 illustrates. As Chapter
    4 explained, the hub has a pull-down resistor of 14.25 to 24.8 kilohms on each
    of the port’s two signal lines, D+ and D-. A newly attached device has a pull-up
    resistor of 900 to 1575 ohms on either D+ for a full-speed device or D- for a
    low-speed device. When a device is attached to a port, the line with the pull-up
    is more positive than the hub’s logic-high input threshold. The hub detects the
    voltage, assumes a device is attached, and detects the speed by which line is
    pulled up.


    After detecting a full-speed device, a 2.0 hub determines whether the device supports
    high speed by using the high-speed detection handshake. The handshake occurs during
    the Reset state that the hub initiates during enu-'
  merge: -1
