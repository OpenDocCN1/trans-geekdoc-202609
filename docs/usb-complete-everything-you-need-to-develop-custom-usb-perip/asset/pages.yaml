- pgno: 339
  md: '# 11


    # Human Interface

    Devices:

    Using Control and

    Interrupt Transfers


    The human interface device (HID) class was one of the first USB classes supported
    under Windows. On PCs running Windows 98 or later, applications can communicate
    with HIDs using the drivers built into the operating system. For this reason,
    many vendor-specific USB devices use the HID class.


    Chapter 7 introduced the class. This chapter shows how to determine whether a
    specific device can fit into the human-interface class, details the firmware requirements
    that define a device as a HID and enable it to exchange data with its host, introduces
    the six HID-specific control requests, and presents an example of HID firmware.
    Chapter 12 describes'
  merge: -1
  img_proc: true
- pgno: 340
  md: 'the reports that HIDs use to exchange information and Chapter 13 shows how
    to access HIDs from applications.


    # What is a HID?


    The *human interface* in the name suggests that HIDs interact directly with people,
    and many HIDs do. A mouse may detect when someone presses a key or moves the mouse,
    or the host may send a message that translates to a joystick effect that the user
    experiences. Besides keyboards, mice, and joysticks, the HID class encompasses
    front panels with knobs, switches, buttons, and sliders; remote controls; telephone
    keypads; and game controls such as data gloves and steering wheels.


    But a HID doesn’t have to have a human interface. The device just needs to be
    able to function within the limits of the HID class specification. These are the
    major abilities and limitations of HID-class devices:


    +   - All data exchanged resides in structures called reports. The host sends
    and receives data by sending and requesting reports in control or interrupt transfers.
    The report format is flexible and can handle just about any type of data, but
    each defined report has a fixed size.

    +   - A HID interface must have an interrupt IN endpoint for sending Input reports.

    +   - A HID interface can have at most one interrupt IN endpoint and one interrupt
    OUT endpoint. If you need more interrupt endpoints, you can create a composite
    device that contains multiple HIDs. An application must obtain a separate handle
    for each HID in the composite device.

    +   - The interrupt IN endpoint enables the HID to send information to the host
    at unpredictable times. For example, there’s no way for the computer to know when
    a user will press a key on the keyboard, so the host’s driver uses interrupt transactions
    to poll the device periodically to obtain new data.

    +   - The rate of data exchange is limited, especially at low and full speeds.
    As Chapter 3 explained, a host can guarantee a low-speed interrupt endpoint no
    more than 800 bytes/sec. For full-speed endpoints, the maxi-'
  merge: -1
  img_proc: true
- pgno: 341
  md: '# Human Interface Devices: Using Control and Interrupt Transfers


    mum is 64 kilobytes/sec., and for high-speed endpoints, the maximum is about 24
    Megabytes/sec. if the host supports high-bandwidth endpoints and about 8 Megabytes/sec.
    if not. Control transfers have no guaranteed bandwidth except for the bandwidth
    reserved for all control transfers on the bus.


    +   - Windows 98 Gold (original edition) supports USB 1.0, so interrupt OUT transfers
    aren’t supported and all host-to-device reports must use control transfers.


    Any device that can live within the class’s limits is a candidate to be a HID.
    The HID specification mentions bar-code readers, thermometers, and voltmeters
    as examples of HIDs that might not have a conventional human interface. Each of
    these sends data to the computer and may also receive requests that configure
    the device. Examples of devices that mostly receive data are remote displays,
    control panels for remote devices, robots, and devices of any kind that receive
    occasional or periodic commands from the host.


    A HID interface may be just one of multiple USB interfaces supported by a device.
    For example, a USB speaker that uses isochronous transfers for audio may also
    have a HID interface for controlling volume, balance, treble, and bass. A HID
    interface is often cheaper than traditional physical controls on a device.


    # Hardware Requirements


    To comply with the HID specification, the interface’s endpoints and descriptors
    must meet several requirements.


    # Endpoints


    All HID transfers use either the control endpoint or an interrupt endpoint. Every
    HID must have an interrupt IN endpoint for sending data to the host. An interrupt
    OUT endpoint is optional. Table 11-1 shows the transfer types and their typical
    uses in HIDs.'
  merge: -1
  img_proc: true
- pgno: 342
  md: 'Table 11-1: The transfer type used in a HID transfer depends on the chip’s
    abilities and the requirements of the data being sent.


    | Transfer Type | Source of Data | Typical Data | Required Pipe? | Windows Support
    |

    |---|---|---|---|---|

    | Control | Device (IN transfer) | Data that doesn’t have critical timing requirements.
    | yes | Windows 98 and later |

    | Control | Host (OUT transfer) | Data that doesn’t have critical timing requirements,
    or any data if there is no OUT interrupt pipe. | yes |  |

    | Interrupt | Device (IN transfer) | Periodic or low-latency data. | yes |  |

    | Interrupt | Host (OUT transfer) | Periodic or low-latency data. | no | Windows
    98 SE and later |


    # Reports


    The requirement for an interrupt IN endpoint suggests that every HID must have
    at least one Input report defined in the HID’s report descriptor. Output and Feature
    reports are optional.


    # Control Transfers


    The HID specification defines six class-specific requests. Two requests, Set_Report
    and Get_Report, provide a way for the host and device to transfer reports to and
    from the device using control transfers. The host uses Set_Report to send reports
    and Get_Report to receive reports. The other four requests relate to configuring
    the device. The Set_Idle and Get_Idle requests set and read the Idle rate, which
    determines whether or not a device resends data that hasn’t changed since the
    last poll. The Set_Protocol and Get_Protocol requests set and read a protocol
    value, which can enable a device to function with a simplified protocol when the
    full HID drivers aren’t loaded on the host, such as during boot up.


    # Interrupt Transfers


    Interrupt endpoints provide an alternate way of exchanging data, especially when
    the receiver must get the data quickly or periodically. Control transfers'
  merge: -1
  img_proc: true
- pgno: 343
  md: '# Human Interface Devices: Using Control and Interrupt Transfers


    can be delayed if the bus is very busy, while the bandwidth for interrupt transfers
    is guaranteed to be available when the device is configured.


    The ability to do Interrupt OUT transfers was added in version 1.1 of the USB
    specification, and the option to use an interrupt OUT pipe was added to version
    1.1 of the HID specification. Windows 98 SE was the first Windows edition to support
    USB 1.1 and HID 1.1.


    # Firmware Requirements


    The device’s firmware must also meet class requirements. The device’s descriptors
    must include an interface descriptor that specifies the HID class, a HID descriptor,
    and an interrupt IN endpoint descriptor. An interrupt OUT endpoint descriptor
    is optional. The firmware must also contain a report descriptor that contains
    information about the contents of a HID’s reports.


    A HID can support one or more reports. The report descriptor specifies the size
    and contents of the data in a device’s reports and may also include information
    about how the receiver of the data should use the data. Values in the descriptor
    define each report as an Input, Output, or Feature report. The host receives data
    in Input reports and sends data in Output reports. A Feature report can travel
    in either direction.


    Every device should support at least one Input report that the host can retrieve
    using interrupt transfers or control requests. Output reports are optional. To
    be compatible with Windows 98 Gold, devices that use Output reports should support
    sending the reports using control transfers. Using interrupt transfers for Output
    reports is optional. Feature reports always use control transfers and are optional.


    # Identifying a Device as a HID


    As with any USB device, a HID’s descriptors tell the host what it needs to know
    to communicate with the device. Listing 11-1 shows example device, configuration,
    interface, class, and endpoint descriptors for a vendor-specific HID. The host
    learns about the HID interface during enumeration by send-'
