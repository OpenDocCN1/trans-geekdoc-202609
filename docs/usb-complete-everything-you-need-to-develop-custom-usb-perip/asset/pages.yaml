- pgno: 169
  md: 'new chip or remove, erase, re-program, and replace the chip. Cypress’ EZ-USB
    has an easier way, with the ability to load firmware from the host into RAM on
    each power up or attachment. Another option is to store the program code in electrically
    reprogrammable Flash memory or EEPROM. This memory can be in the device controller
    or in an external chip. The *Device Firmware Upgrade* class specification describes
    a mechanism for loading firmware from a host to a device. Chapter 7 has more about
    this class.


    **Does the device require a flexible cable?** One reason why mice are almost certain
    to be low-speed devices is that the less stringent requirements for low-speed
    cables mean that the cable can be thinner and more flexible. However, USB 2.0-compliant
    low-speed cables have the same requirements as full and high speed except that
    the braided outer shield and twisted pair are recommended, but not required.


    **Does the device require a long cable?** A cable that attaches to a low-speed
    device can be no longer than three meters, while full-speed cables can be five
    meters.


    **What other hardware features and abilities are needed?** Other things to consider
    are the amount of general-purpose or specialized I/O, the size of program and
    data memory, on-chip timers, and other special features that a particular device
    might require.


    # Chip Documentation


    Most vendors supplement their chips’ data sheets with technical manuals, application
    notes, example code, and other documentation. The best way to get a head start
    on writing firmware is to begin with example code that’s similar to your application.
    Working from an example is much easier than trying to put something together from
    scratch. Chip and tool vendors vary widely in the amount and quality of documentation
    and example code provided, so it’s worth checking the manufacturers’ Web sites
    to find out what’s available before you commit to a chip. In some cases you can
    find code examples from other sources, especially via the Internet, from other
    users who are willing to share what they’ve written.'
