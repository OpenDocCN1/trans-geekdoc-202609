    # The Service Key


    A service key has information about a driver’s files, including where they are
    stored and how to load them. Service keys are in this branch:


    ```

    HKEY_LOCAL_MACHINE\System\CurrentControlSet\Services

    ```


    There are service keys for each host controller type, hubs, and classes such as
    storage (USBSTOR), printers (USBPRINT), and HIDs (HidBatt, HidServ, HidUsb). Figure
    9-7 shows the Service key for HidUsb.


    # Inside INF Files


    A device setup information file, or INF file, is a text file that contains information
    about one or more devices in a device setup class. The devices may be from one
    or more manufacturers. The file tells Windows what driver or drivers to use and
    contains information to store in the registry. Windows includes INF files for
    the drivers provided with the operating system. The files are in the %SystemRoot%\inf
    folder. Any new INF files for added devices are copied to this folder as well.
    By default, the folder is hidden. If you don’t see it in Windows Explorer, select
    Tools > Folder Options > View,'
  merge: -1
  img_proc: true
