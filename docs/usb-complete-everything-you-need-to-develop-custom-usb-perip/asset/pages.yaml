- pgno: 374
  md: '# Control and Data Item Values


    Several documents define values that reports may contain. The first place to look
    is the *HID Usage Tables* document, which defines values for generic desktop controls,
    simulation controls, game controls, LEDs, buttons, telephone devices, and more.
    The document also tells you where to find values defined elsewhere. Some are in
    the HID specification, while others are in the class specifications for specific
    device functions such as monitor, power, and point-of-sale devices.


    # Item Types


    The HID specification defines two report item types: short items and long items.
    As of HID 1.1, there are no defined Long items, and the type is just reserved
    for future use.


    # Short Items


    A Short item’s 1-byte prefix specifies the item type, item tag, and item size.
    These are the elements that make up the prefix byte:


    | Bit Number | Contents | Description |

    |---|---|---|

    | 0 | Item Size | Number of bytes in the item |

    | 1 |  |  |

    | 2 | Item Type | Item scope: Main, Global, or Local |

    | 3 |  |  |

    | 4 | Item Tag | Numeric value that indicates the item’s function |

    | 5 |  |  |

    | 6 |  |  |

    | 7 |  |  |'
  merge: -1
  img_proc: true
- pgno: 375
  md: 'The item size (bits 1 and 0) indicates how many data bytes the item contains.
    Note that an item size of 3 (11 in binary) corresponds to 4 data bytes:


    | Item Size (binary) | Number of Data Bytes |

    |---|---|

    | 00 | 0 |

    | 01 | 1 |

    | 10 | 2 |

    | 11 | 4 |


    The item type (bits 3 and 2) describes the scope of the item: Main (00), Global
    (01), or Local (10). Main items define or group data fields in the descriptor.
    Global items describe data. Local items define characteristics of individual controls
    or data. (This chapter has more information about these item types.)


    The item tag (bits 4-7) indicates the item''s function.


    # Long Items


    A Long item uses multiple bytes to store the same information as the Short item''s
    1-byte prefix stores. A Long item''s 1-byte prefix (FEh) identifies the item as
    a Long item. In addition, the item has a byte that specifies the number of data
    bytes, a byte containing the item tag, and up to 255 bytes of data.


    # The Main Item Type


    A Main item defines or groups data items within a report descriptor. There are
    five Main item types. Input, Output, and Feature items each define fields in a
    type of report. Collection and End Collection items group related items within
    a report. The default value for all Main items is zero.'
  merge: -1
  img_proc: true
- pgno: 376
  md: '# Input, Output, and Feature Items


    Table 12-1 shows supported values for the Input, Output, and Feature items, including
    the item prefix and the meanings of the bits in the data that follows the prefix.


    An Input item applies to data a device sends to the host. An Input report contains
    one or more Input items. The host uses interrupt IN transfers or Get_Report requests
    to request Input reports.


    An Output item applies to information that the host sends to the device. An Output
    report contains one or more Output items. Output reports contain data that reports
    the states of controls, such as whether to open or close a switch or the intensity
    to apply to an effect. As explained earlier, if the HID has an interrupt OUT endpoint,
    a HID 1.1-compliant host can use interrupt OUT transfers to send Output reports.
    All hosts can also use Set_Report requests to send Output reports.


    A Feature item typically applies to information that the host sends to the device.
    However, it’s also possible for the host to read Feature items from a device.
    A Feature report contains one or more Feature items. Feature reports often contain
    configuration settings that affect the overall behavior of the device or one of
    its components. The reports often control settings that you might otherwise adjust
    in a physical control panel. For example, the host may have a virtual (on-screen)
    control panel to enable users to select and control a device’s capabilities and
    settings. The host uses control transfers with Set_Report and Get_Report requests
    to send and receive Feature reports.


    Following each Input, Output, or Feature item prefix are up to 9 bits that describe
    the item’s data. (An additional 23 bits are reserved.) For example, an Input item
    prefix followed by 9 bits of data has the value 82h. The prefix’s high four bits
    equal 08h to indicate an Input item, and the low four bits equal 02h to indicate
    that the data’s 9 bits require 2 bytes. An Input item prefix followed by 8 bits
    of data has the value 81h. The prefix’s high four bits equal 08h to indicate an
    Input item, and the low four bits equal 01h because the data’s 8 bits fit in 1
    byte. The device firmware and host software may use or ignore the information
    in these items.'
  merge: -1
  img_proc: true
- pgno: 377
  md: 'Table 12-1: The bits that follow Input, Output, and Feature Item prefixes describe
    the data in report items.


    | Main Item Prefix | Bit Number | Meaning if bit = 0 | Meaning if bit = 1 |

    |---|---|---|---|

    | Input (100000nn, where nn=the number of bytes in the data following the prefix)
    Use 81h for 1 byte of item data or use 82h for 2 bytes of item data. | 0 | Data
    | Constant |

    |  | 1 | Array | Variable |

    |  | 2 | Absolute | Relative |

    |  | 3 | No wrap | Wrap |

    |  | 4 | Linear | Non-linear |

    |  | 5 | Preferred state | No preferred state |

    |  | 6 | No null position | Null state |

    |  | 7 | Reserved | Reserved |

    |  | 8 | Bit field | Buffered bytes |

    |  | 9-31 | Reserved | Reserved |

    | Output (100100nn, where nn=the number of bytes in the data following the prefix)
    Use 91h for 1 byte of item data or use 92h for 2 bytes of item data. | 0 | Data
    | Constant |

    |  | 1 | Array | Variable |

    |  | 2 | Absolute | Relative |

    |  | 3 | No wrap | Wrap |

    |  | 4 | Linear | Non-linear |

    |  | 5 | Preferred state | No preferred state |

    |  | 6 | No null position | Null state |

    |  | 7 | Non-volatile | Volatile |

    |  | 8 | Bit field | Buffered bytes |

    |  | 9-31 | Reserved | Reserved |

    | Feature (101100nn, where nn=the number of bytes in the data following the prefix)
    Use B1h for 1 byte of item data or use B2h for 2 bytes of item data. | 0 | Data
    | Constant |

    |  | 1 | Array | Variable |

    |  | 2 | Absolute | Relative |

    |  | 3 | No wrap | Wrap |

    |  | 4 | Linear | Non-linear |

    |  | 5 | Preferred state | No preferred state |

    |  | 6 | No null position | Null state |

    |  | 7 | Non-volatile | Volatile |

    |  | 8 | Bit field | Buffered bytes |

    |  | 9-31 | Reserved | Reserved |'
