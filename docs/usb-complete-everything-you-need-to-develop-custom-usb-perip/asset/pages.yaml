  md: '# Use a Valid Vendor ID


    Firmware that you make available outside of a controlled environment must use
    a Vendor ID assigned by the USB-IF. My example code uses the Vendor ID of 0925h,
    which is assigned to my company, Lakeview Research. The owner of the Vendor ID
    is responsible for ensuring that each product and version has a unique Vendor
    ID/Product ID pair. Borrowing someone else’s Vendor ID can lead to conflicts if
    the owner of the ID uses the same values for a different device.


    # Finding INF Files


    On installing a device with a new INF file, Windows copies the INF file to %SystemRoot%\inf
    and may rename the file oem*.inf and create a .PNF file named oem*pnf, where *
    is a number. To find INF files that contain a specific Vendor ID and Product ID,
    search from Windows’ Start menu > Search > For Files or Folders. Browse to the
    %SystemRoot%\inf folder and search for the text VID_xxxx&PID_yyyy, where xxxx
    is the device’s vendor ID and yyyy is the product ID.


    # Removing Device Information


    When experimenting with different settings in an INF file, you may find that at
    times Windows is using information stored in the system registry from a previous
    version of the INF file. If you want Windows to use a different or changed INF
    file for a device (because you want to change the driver or device description,
    for example), you may need to tell Windows to forget what it knows about the device.
    With the device installed, right-click its listing in the Device Manager, and
    select Uninstall. Delete any unwanted INF and PNF files that contain your device’s
    Vendor ID and Product ID. You can then remove the device and reattach it, and
    Windows will start fresh in searching for a driver. (If this approach fails, you
    may need to delete the unwanted INF and PNF files and registry keys manually.)


    To cause Windows 98 to forget what it knows about a device, you may need to rebuild
    the driver information database. In the %SystemRoot%\inf folder, rename drvdata.bin
    to drvdata.xxx and rename drvid x.bin to drvid x.xxx. By'
