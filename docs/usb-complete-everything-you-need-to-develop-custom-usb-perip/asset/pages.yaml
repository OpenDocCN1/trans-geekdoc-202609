- pgno: 135
  md: '# Detecting the Speed of a Dual-Speed Device


    A high-speed device must respond to enumeration requests at full speed, and the
    device may also be completely functional at full speed. As Chapter 1 explained,
    a high-speed-capable device must use full speed if it has a 1.x host or if there
    is a 1.x hub between the host and device. Applications and device drivers normally
    don’t need to know which speed a dual-speed device is using because all of the
    speed-related details are handled at a lower level. Windows provides no straightforward
    way to learn a device’s speed. But if a host application wants to know, there
    are a few techniques that can detect the bus speed for many devices.


    If a device has a bulk endpoint, you can learn the current speed by examining
    the endpoint descriptor in the active configuration. The wMaxPacketSize field
    must be 512 in a high-speed device and can’t be 512 in a full-speed device. If
    there is no bulk endpoint, the wMaxPacketSize of an interrupt or isochronous endpoint
    provides speed information if the endpoint uses a maximum packet size available
    only at high speed. For an interrupt endpoint, a wMaxPacketSize greater than 64
    indicates high speed. If the wMaxPacketSize is 64 or less, the device may be using
    full or high speed. For isochronous endpoints, a wMaxPacketSize of 1024 indicates
    high speed. If wMaxPacketSize is 1023 or less, the device may be using full or
    high speed.


    If you’re writing the device firmware, you can provide speed information in the
    optional strings indexed by the configuration and other_speed_configuration descriptors.
    For example, the string indexed by the configuration descriptor might contain
    the text “high speed,” and the string indexed by the other_speed_configuration
    descriptor might contain the text “full speed.” Applications can then read the
    configuration string to learn the current speed.


    The USBView application in the Windows DDK shows how applications can read descriptors.'
  merge: -1
  img_proc: true
