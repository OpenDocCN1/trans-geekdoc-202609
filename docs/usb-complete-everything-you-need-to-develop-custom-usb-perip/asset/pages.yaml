  md: '# ByRef and ByVal


    In calling a function, you can pass the arguments, or parameters, by reference
    (ByRef) or by value (ByVal). Often either will work. But the concept is important
    to understand when calling API functions, because many of the functions have variables
    that must be passed a specific way.


    ByRef and ByVal determine what information the call passes to enable the function
    to access the variable. Every variable has an address in memory where the variable''s
    value is stored. When passing a variable to a function, an application can pass
    the variable''s address or the value itself. The information is passed by placing
    it on the stack (a temporary storage location).


    Passing a variable ByRef means that the function call places the address of the
    variable on the stack. If the function changes the value by writing a new value
    to the address, the new value will be available to the calling application because
    the value will be stored at the address where the application expects to find
    the variable. The address passed is called a pointer, because it points to, or
    indicates, the address where the value is stored.


    Passing a variable ByVal means that the function call places the value of the
    variable on the stack. The value at the variable''s original address in memory
    is unchanged. If the function changes the value, the calling application won''t
    know about the change because the function has no way to pass the new value back
    to the application.


    Passing ByVal is the default under Visual Basic .NET. If you want to pass a parameter
    ByRef, you must specify it in the declaration. (Passing ByRef is the default in
    Visual Basic 6.)


    Except for strings, you must pass a variable ByRef if the called function changes
    the value and the calling application needs to use the new value. Passing ByRef
    enables the calling application to access the new value.


    Strings are a special case and should be passed ByVal to API functions. If you
    pass a string ByVal to an API function, Visual Basic actually passes a pointer
    to the string, as if the string had been declared ByRef. If the function will
    change the contents of the string, the application should initialize the string
    to be at least as long as the longest expected returned string.'
