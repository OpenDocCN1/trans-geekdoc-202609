- pgno: 390
  md: 'Pop is the complement to Push. It restores the saved states of the previously
    pushed Global item states.


    # The Local Item Type


    Local items specify qualities of the controls and data items in a report. A Local
    item''s value applies to all items that follow within a Main item until a new
    value is assigned. Local items don''t carry over to the next Main item; each Main
    item begins fresh, with no Local items defined.


    Local items relate to general usages, body-part designators, and strings. A Delimiter
    item enables grouping sets of Local items. Table 12-5 shows the values and meaning
    of each of the items.


    **Usage.** The Local Usage item is the Usage ID that works together with the Global
    Usage Page to describe the function of a control, data, or collection.


    As with the Usage Page item, the HID Usage Tables document lists many Usage IDs.
    For example, the Buttons Usage Page uses Local Usage IDs from 1 to FFFFh to identify
    which buttons in a set is pressed, with a value of 0 meaning no button pressed.


    A report may assign one Usage to multiple items. If a report item is preceded
    by a single Usage, that Usage applies to all of the item''s data. If a report
    item is preceded by more than one Usage and the number of controls or data items
    equals the number of Usages, each Usage applies to one control or data item, with
    the Usages and controls/data items pairing up in sequence. In the following example,
    the report contains two bytes. The first byte''s Usage is X, and the second byte''s
    Usage is Y.


    ```

    Usage (X),

    Usage (Y),

    Report Count (2),

    Report Size (8),

    Input (Data, Variable, Absolute),

    ```


    If a report item is preceded by more than one Usage and the number of controls
    or data items is greater than the number of Usages, each Usage pairs up with one
    control or data item in sequence, and the final Usage applies to all'
