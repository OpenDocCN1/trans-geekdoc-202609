    ```\n```vb\nDevBroadcastDeviceInterfaceBuffer = _\n    Marshal.AllocHGlobal(Size)\n\
    \nMarshal.StructureToPtr _\n    (DevBroadcastDeviceInterface, _\n    DevBroadcastDeviceInterfaceBuffer,\
