- pgno: 143
  md: '**Additional Contents:** none. The handshake packet consists of the PID alone.


    **Comments:** The Status stage''s handshake packet is the final transmission in
    the transfer. If the receiver detected an error in the token or data packet, the
    receiver returns no handshake packet.


    For any request that''s expected to take many milliseconds to carry out, the protocol
    should define an alternate way to determine when the request has completed. Doing
    so ensures that the host doesn''t waste a lot of time asking for an acknowledgement
    that will take a long time to appear. An example is the Set_Port_Feature(PORT_RESET)
    request sent to a hub. The reset signal lasts at least 10 milliseconds. Rather
    than forcing the host to wait this long for the device to complete the reset,
    the hub acknowledges receiving the request when the hub first places the port
    in the reset state. When the reset is complete, the hub sets a bit that the host
    can retrieve at its leisure, using a Get_Port_Status request.


    # Handling Errors


    Devices don''t always carry out every control-transfer request they receive. The
    device''s firmware might not support a request. Or the device may be unable to
    respond because its firmware has crashed, or the endpoint is in the Halt condition,
    or the device is no longer attached to the bus. The host may also decide for any
    reason to end a transfer early, before all of the data has been sent.


    An example of an unsupported request is one that uses a request code that the
    device''s firmware doesn''t know how to respond to. Or a device may support the
    request but other information in the Setup stage doesn''t match what the device
    expects or supports. On these occasions, a Request Error condition exists and
    the device notifies the host by sending a STALL code in a handshake packet. Devices
    must respond to the Setup transaction with an ACK, so the STALL must transmit
    in a handshake packet in the Data or Status stage.


    On failing to get an expected response or on detecting an error in received data
    or a Halt condition at the endpoint, the host abandons the transfer.'
  merge: -1
  img_proc: true
- pgno: 144
  md: '# Control Transfers: Structured Requests for Critical Data


    The host then tries to re-establish communications by sending the token packet
    for a new Setup transaction. If a device receives a token packet for a Setup transaction
    before completing a previous control transfer, the device must abandon the previous
    transfer and begin the new one. If the transfer is using the Default Control Pipe
    and a new token packet doesn''t cause the device to recover, the host takes more
    drastic action, requesting the device''s hub to reset the device''s port.


    The host may also end a transfer early by beginning the Status stage before completing
    all of the Data stage''s transactions. In this case, the device must abandon the
    rest of the data and respond to the Status stage the same as if all of the data
    had transferred.


    # Device Firmware


    The following descriptions are an overview of what typical device firmware must
    do to support control transfers.


    # Control Write Requests with a Data Stage


    To complete a Control Write request where the host sends data to the device, the
    device must detect the request in the Setup stage, receive data in the Data stage,
    and return a handshake in the Status stage:


    +   1. The hardware detects a Setup packet, stores the contents of the transaction''s
    data packet, returns ACK, and triggers an interrupt.

    +   2. The interrupt-service routine decodes the request and configures Endpoint
    0 to accept data that arrives following an OUT token packet. The endpoint should
    also be able to handle the arrival of a new Setup packet, in case the host decides
    to abandon the transfer early.

    +   3. The device returns to normal operation. The arrival of an OUT token packet
    at Endpoint 0 indicates that the host is sending data in the Data stage. The endpoint
    returns ACK in the handshake packet and the hardware triggers an interrupt.

    +   4. The interrupt-service routine stores or uses the received data.'
  merge: -1
  img_proc: true
- pgno: 145
  md: '5. If more data packets are expected in the Data stage, steps 3 and 4 repeat
    for additional OUT transactions, up to the wLength value in the Setup transaction.


    6. When all of the data has been received, the firmware configures Endpoint 0
    to send a zero-length data packet in response to an IN token packet. The host
    returns ACK to complete the transfer.


    # Control Write Requests with No Data Stage


    To complete a Control Write request when there is no Data stage, the device must
    detect the request in the Setup stage and send a handshake in the Status stage:


    +   1. The hardware detects a Setup packet, stores the contents of the transaction''s
    data packet, returns ACK, and triggers an interrupt.

    +   2. The interrupt-service routine decodes the request, does what is needed
    to perform the requested action, and configures Endpoint 0 to respond to an IN
    token packet. The endpoint should also be able to handle the arrival of a new
    Setup packet in case the host decides to abandon the transfer early.

    +   3. A received IN token packet begins the Status stage. The endpoint sends
    a zero-length data packet and the host returns ACK to complete the transfer.


    # Control Read Requests


    To complete a Control Read request, where the host requests data from the device,
    the device must detect the request in the Setup stage, send data in the Data stage,
    and acknowledge a received handshake in the Status stage:


    +   1. The hardware detects a Setup packet, stores the contents of the transaction''s
    data packet, returns ACK, and triggers an interrupt.

    +   2. The interrupt-service routine decodes the request and configures Endpoint
    0 to send data on receiving an IN token packet. The endpoint should also be able
    to handle the arrival of a new Setup or OUT packet in case the host decides to
    abandon the transfer or begin the Status stage early.

    +   3. The device returns to normal operation. The arrival of an IN token packet
    at Endpoint 0 indicates that the host is requesting data in the Data'
