- pgno: 25
  md: '# Low Cost


    Even though USB is more complex than earlier interfaces, the components and cables
    are inexpensive. A device with a USB interface is likely to cost the same or less
    than an equivalent device with an older interface or a more recent interface such
    as IEEE-1394.


    # Low Power Consumption


    Power-saving circuits and code can automatically power down USB peripherals when
    not in use yet keep them ready to respond when needed. The reduced power consumption
    saves money, is environmentally friendly, and for battery-powered devices, allows
    a longer time between recharges.


    # Wireless Communications


    USB originated as a wired interface, but options now exist for wireless devices
    that use USB to communicate with PCs.


    # Benefits for Developers


    Many of the user advantages described above also make things easier for developers.
    For example, USB’s defined cable standards and automatic error checking mean that
    developers don’t have to worry about specifying cable characteristics or providing
    error checking in software.


    USB has other advantages that benefit developers. The developers include the hardware
    designers who select components and design the circuits in devices, the programmers
    who write the software embedded in the devices, and the programmers who write
    the PC software that communicates with the devices.


    The benefits to developers result from the flexibility built into the USB protocol,
    the support in the controller chips and operating system, and the support available
    from the USB Implementers Forum.


    # Versatility


    USB’s four transfer types and three speeds make the interface feasible for many
    types of peripherals. There are transfer types suited for exchanging'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'large and small blocks of data, with and without time constraints. For data
    that can''t tolerate delays, USB can guarantee bandwidth or a maximum time between
    transfers. These abilities are especially welcome under Windows, where accessing
    peripherals in real time is often a challenge. Although the operating system,
    device drivers, and application software can introduce unavoidable delays, USB
    makes it as easy as possible to achieve transfers that are close to real time.


    Unlike other interfaces, USB doesn''t assign specific functions to signal lines
    or make other assumptions about how the interface will be used. For example, the
    status and control lines on the PC''s parallel port were defined with the intention
    of communicating with line printers. There are five input lines with assigned
    functions such as indicating a busy or paper-out condition. When developers began
    using the port for scanners and other peripherals that send large amounts of data
    to the PC, having just five inputs was a limitation. (Eventually the interface
    was enhanced to allow eight bits of input.) USB makes no such assumptions and
    is suitable for just about any peripheral type.


    For communicating with common peripheral types such as printers, keyboards, and
    drives, USB has defined classes that specify device requirements and protocols.
    Developers can use the classes as a guide instead of having to reinvent everything
    from the ground up.


    # Operating System Support


    Windows 98 was the first Windows operating system with reliable support for USB,
    and the editions that have followed, including Windows 2000, Windows Me, Windows
    XP, and Windows Server 2003, support USB as well. This book focuses on Windows
    programming for PCs, but other computers and operating systems also have USB support,
    including Apple Computer''s Macintosh and the Linux operating system for PCs.
    Some real-time kernels also support USB.


    A claim of operating-system support for USB can mean many things. At the most
    basic level, an operating system that supports USB must do three things:'
