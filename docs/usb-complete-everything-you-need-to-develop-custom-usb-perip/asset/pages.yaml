  md: "Sending values as large as 600 will require 3 bytes, which the firmware specifies\
    \ in the Report Size tag.\n\nTo send a temperature value using one byte to represent\
    \ temperatures from -20 to 110 degrees Fahrenheit, the report descriptor might\
    \ contain the following:\n\n+   - Logical Minimum: -128 (80h when expressed in\
    \ hexadecimal as a two's complement)\n+   - Logical Maximum: 127 (7Fh)\n+   -\
    \ Physical Minimum: -20 (ECh when expressed in hexadecimal as a two's complement)\n\
    +   - Physical Maximum: 110 (6Eh)\n+   - Unit: 10003h. Nibble 0 is 3 to select\
    \ the English Linear measuring system, though in this case, any value from 1 to\
    \ 4 is OK. Nibble 4 is 3 to select degrees Fahrenheit.\n+   - Unit Exponent: 0\n\
    \nThese values ensure the highest possible resolution for a single-byte report\
    \ item, because the transmitted values can span the full range from 0 to 255.\n\
    \nIn this case the logical and physical limits differ, so converting is required.\
    \ This Visual-Basic code finds the resolution, or number of bits per unit:\n\n\
    ```\nResolution = _\n    (Logical_Maximum - Logical_Minimum) / _\n    ((Physical_Maximum\
    \ - Physical_Minimum) * _\n    (10 ^ Unit_Exponent))\n```\n\nWith the example\
    \ values, the resolution is 1.96 bits per degree, or 0.51 degree per bit.\n\n\
    This Visual-Basic code converts a value to the specified units:\n\n```\nValue\
    \ = _\n    Value_In_Logical_Units * _\n    ((Physical_Maximum - Physical_Minimum)\
    \ * _\n    (10 ^ Unit_Exponent )) / _\n    (Logical_Maximum - Logical_Minimum)\n\
    ```\n\nIf the value in logical units (the raw data) is 63, the converted value\
    \ in the specified units is 32 degrees Fahrenheit."
  merge: -1
