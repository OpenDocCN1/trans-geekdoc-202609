  md: 'Each endpoint of either type has a standard endpoint descriptor. Each Standard
    Bulk Data endpoint also has an MS Bulk Data endpoint descriptor that names the
    Embedded MIDI Jacks associated with the endpoint.


    # Class-specific Requests


    The audio class defines optional class-specific requests for setting and getting
    the state of audio controls, accessing memory, and requesting status information.


    # Chips


    USB-capable chips are available with built-in support for audio functions. The
    support includes codec (compressor/decompressor) functions, analog-to-digital
    converters (ADCs), digital-to-analog converters (DACs), and support for Sony/Philips
    Digital Interface (S/PDIF) encoding for transmitting audio data in digital format.


    Texas Instruments’ PCM2900 is a stereo audio codec with a full-speed USB port
    and 16-bit ADC and DAC. The chip has an AudioControl interface, an AudioStreaming
    interface for each direction, and a HID interface that reports the status of three
    pins on the chip. The chip requires no user programming but has the option to
    use a vendor-specific Vendor ID, Product ID, and strings. The PCM2902 adds support
    for S/PDIF encoding. Another option for a USB codec is Philips Semiconductors
    UDA1325.


    Texas Instruments’ PCM2702 is a 16-bit stereo DAC with a full-speed USB interface.
    The chip can accept data sampled at 48, 44.1, and 32 kilohertz using either 16-bit
    stereo or monaural audio data. The chip supports digital attenuation and soft-mute
    features.


    Texas Instruments’ TUSB3200A USB Streaming Controller contains an 8052-compatible
    microcontroller that supports up to seven IN endpoints and seven OUT endpoints.
    The audio support includes a codec port interface, a DMA controller with four
    channels for streaming isochronous data packets to and from the codec port, and
    a phase lock loop (PLL) and adaptive clock generator (ACG) to support synchronization
    modes.'
