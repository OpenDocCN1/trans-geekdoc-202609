    # Speed


    The host controller guarantees that bulk transfers will complete eventually but
    doesn’t reserve any bandwidth for the transfers. Control transfers are guaranteed
    to have 10 percent of the bandwidth at low and full speeds, and 20 percent at
    high speed. Interrupt and isochronous transfers may use the rest. So if a bus
    is very busy, a bulk transfer may take very long.


    However, when the bus is otherwise idle, bulk transfers can use the most bandwidth
    of any type, and they have a low overhead, so they’re the fastest of all. When
    an endpoint’s maximum packet size is less than the maximum size allowed for the
    speed, some host controllers schedule no more than one packet per frame, even
    if more bandwidth is available. So it’s best to specify the maximum allowed packet
    size for bulk endpoints if possible.


    At full speed on an otherwise idle bus, up to nineteen 64-byte bulk transfers
    can transfer up to 1216 data bytes per frame, for a data rate of 1.216 Megabytes/sec.
    This leaves 18% of the bus bandwidth free for other uses. The protocol overhead
    for a bulk transfer with one data packet is 13 bytes at full speed and 55 bytes
    at high speed.


    At high speed on an otherwise idle bus, up to thirteen 512-byte bulk transfers
    can transfer up to 6656 data bytes per microframe, for a data rate of 53.248 Megabytes/sec.,
    using all but 2% of the bus bandwidth. The protocol overhead for a bulk transfer
    with one data packet is 55 bytes. Real-world performance varies with the host-controller
    hardware and driver and the host architecture, including latencies when accessing
    system memory. At this writing, some high-speed hosts can perform a single transfer
    at up to around 35 Megabytes/sec.


    # Detecting and Handling Errors


    Bulk transfers use error detecting. If a device doesn’t return an expected handshake
    packet, the host tries up to twice more. The host also retries on receiving NAK
    handshakes. The host’s driver determines whether the host'
