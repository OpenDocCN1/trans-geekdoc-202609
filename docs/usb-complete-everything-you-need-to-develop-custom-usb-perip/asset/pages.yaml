- pgno: 286
  md: "can be in any order, but the order of the items within a section can be critical.\n\
    \n+   - A semicolon (`;`) indicates a comment.\n+   - A backslash (`\\`) at the\
    \ end of a line acts as a line continuator, unless it's enclosed in quotes (`\"\
    `).\n+   - Text enclosed in percent symbols (`%sampletext%`) refers to a string.\
    \ For example, you might have the following item:\n+   \n+     `Provider=%Provider%`\n\
    +   \n+     with an item in the Strings section that defines the provider string:\n\
    +   \n+     `Provider=\"Ellisys\"`\n+   - Some items set the value of an entry.\
    \ For example, this item specifies a device's class:\n+   \n+     `Class=EllisysProtocolAnalyzers`\n\
    +   - Some items provide information to store in the system registry. This item\
    \ stores the name of a device's driver:\n+   \n+     `HKR,,NTMPDriver,,ellex200.sys`\n\
    \n# Sections\n\nEach section of an INF file has a role in helping Windows find\
