- pgno: 462
  md: 'Table 15-1: When a low- or full-speed device has a transaction on a high-speed
    bus, the host uses start-split (SSPLIT) and complete-split (CSPLIT) transactions
    with the 2.0 hub nearest the device. The hub is responsible for completing the
    transaction at low or full speed and reporting back to the host.


    | Bus Speed | Transaction Type | Token | Data | Handshake |

    |---|---|---|---|---|

    | Low/Full-speed communications with the device | Setup, OUT | PRE if low speed,
    LS/FS token | PRE if low speed, data | status (except for isochronous) |

    | Low/Full-speed communications with the device | IN | PRE if low speed, LS/FS
    token | data or status | PRE if low speed, status (except for isochronous) |

    | High-speed communications between the 2.0 hub and host in transactions with
    a low- or full-speed device | Setup, OUT (isochronous OUT has no CSPLIT transaction)
    | SSPLIT, LS/FS token | data | status (bulk and control only) |

    | High-speed communications between the 2.0 hub and host in transactions with
    a low- or full-speed device | Setup, OUT (isochronous OUT has no CSPLIT transaction)
    | CSPLIT, LS/FS token | – | status |

    | High-speed communications between the 2.0 hub and host in transactions with
    a low- or full-speed device | IN | SSPLIT, LS/FS token | – | status (bulk and
    control only) |

    | High-speed communications between the 2.0 hub and host in transactions with
    a low- or full-speed device | IN | CSPLIT, LS/FS token) | data or status | – |


    or status information the hub has received from the device. The hub returns the
    information. The transfer is now complete at the host. The host doesn’t return
    an ACK to the hub. If the hub doesn’t have the packet ready to send, the hub returns
    a NYET status code, and the host retries later. The device has no knowledge of
    the complete-split transaction.


    In split transactions in interrupt and isochronous transfers, the process is similar,
    but with more strictly defined timing. The goal is to transfer data to the host
    as soon as possible after the device has data available to send, and to transfer
    data to the device just before the device is ready to receive new data. To achieve
    this timing, isochronous transactions with large packets use multiple start splits
    or complete splits, transferring a portion of the data in each.


    Unlike with bulk and control transfers, the start-split transactions in interrupt
    and isochronous transfers have no handshake phase, just the start-split token
    followed by an IN, OUT, or Setup token and data for OUT or Setup transactions.'
