  md: "# Enumeration: How the Host Learns about Devices\n\nWindows there’s no need\
    \ to write code for enumerating because the operating system handles the process.\n\
    \n# Enumeration Steps\n\nThe USB specification defines six device states. During\
    \ enumeration, a device moves through four of the states: Powered, Default, Address,\
    \ and Configured. (The other states are Attached and Suspend.) In each state,\
    \ the device has defined capabilities and behavior.\n\nThe steps below are a *typical*\
    \ sequence of events that occurs during enumeration under Windows. But device\
    \ firmware *must not assume* that the enumeration requests and events will occur\
    \ in a particular order. To function successfully, a device must detect and respond\
    \ to any control request or other bus event at any time.\n\n+   1. **The user\
    \ attaches a device to a USB port.** Or the system powers up with a device already\
    \ attached. The port may be on the root hub at the host or a hub that connects\
    \ downstream from the host. The hub provides power to the port, and the device\
    \ is in the Powered state.\n+   \n+   2. **The hub detects the device.** The hub\
    \ monitors the voltages on the signal lines of each of its ports. The hub has\
    \ a pull-down resistor of 14.25 to 24.8 kilohms on each of the port’s two signal\
    \ lines (D+ and D-). A device has a pull-up resistor of 900 to 1575 ohms on either\
