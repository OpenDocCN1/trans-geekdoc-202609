    # Controllers with Embedded CPUs


    The following descriptions of USB controllers with embedded CPUs will give an
    idea of the range of chips available. The chips described are a sampling, and
    new chips are being released all the time, so any new project warrants checking
    the latest offerings.


    If you have a favorite CPU family, the chances are good that a USB-capable variant
    is available. Controllers that are compatible with existing chip families have
    two advantages. Many developers are already familiar with the architecture and
    instruction set. And selecting a popular family means that programming and debugging
    tools are available, and example code and other advice is likely to be available
    from other users.


    The family with the most sources for device controllers is the venerable 8051.
    Intel originated the 8051 family and was the first to release 8051-compatible
    USB controllers (the 8x930 and 8x931). Intel no longer offers USB-capable 8051s,
    but other manufacturers do. Controllers compatible with other families are available
    as well, including Atmel’s AVR, Microchip’s PICmicro, and Freescale Semiconductor’s
    68HC05 and 68HC08. Table 6-1 lists a variety of chips that are compatible with
    popular microcontroller families.


    Some device controllers contain CPUs designed specifically for USB applications.
