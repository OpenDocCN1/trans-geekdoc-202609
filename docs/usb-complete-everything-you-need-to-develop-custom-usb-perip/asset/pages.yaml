  md: '# Enumeration: How the Host Learns about Devices


    device is still in the reset state. If necessary, the host repeats the request
    until the device has exited the reset state.


    When the hub removes the reset, the device is in the Default state. The device’s
    USB registers are in their reset states and the device is ready to respond to
    control transfers at Endpoint 0. The device communicates with the host using the
    default address of 00h. The device can draw up to 100 milliamperes from the bus.


    8. **The host sends a Get_Descriptor request to learn the maximum packet size
    of the default pipe.** The host sends the request to device address 0, Endpoint
    0. Because the host enumerates only one device at a time, only one device will
    respond to communications addressed to device address 0, even if several devices
    attach at once.


    The eighth byte of the device descriptor contains the maximum packet size supported
    by Endpoint 0. A Windows host requests 64 bytes, but after receiving just one
    packet (whether or not it has 64 bytes), the host begins the Status stage of the
    transfer. On completion of the Status stage, a Windows host requests the hub to
    reset the device, as in Step 5 above. The USB specification doesn’t require a
    reset here. Resetting is a precaution that ensures that the device will be in
    a known state when the reset ends.


    9. **The host assigns an address.** The host controller assigns a unique address
    to the device by sending a Set_Address request. The device completes the Status
    stage of the request using the default address and then implements the new address.
    The device is now in the Address state. All communications from this point on
    use the new address. The address is valid until the device is detached, the port
    is reset, or the system reboots. On the next enumeration, the host may assign
    a different address to the device.


    10. **The host learns about the device’s abilities.** The host sends a Get_Descriptor
    request to the new address to read the device descriptor. This time the host retrieves
    the entire descriptor. The descriptor is a data structure containing the maximum
    packet size for Endpoint 0, the number of configurations the device supports,
    and other basic information about the device. The host uses this information in
    the communications that follow.'
