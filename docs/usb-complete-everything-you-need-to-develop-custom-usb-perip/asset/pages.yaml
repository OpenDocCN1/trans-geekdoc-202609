- pgno: 317
  md: "This is the function's declaration:\n\n```\n<DllImport(\"setupapi.dll\")> _\n\
    Function SetupDiEnumDeviceInterfaces _\n    (ByVal DeviceInfoSet As IntPtr, _\n\
    \    ByVal DeviceInfoData As Integer, _\n    ByRef InterfaceClassGuid As System.Guid,\
    \ _\n    ByVal MemberIndex As Integer, _\n    ByRef DeviceInterfaceData As _\n\
    \        SP_DEVICE_INTERFACE_DATA) _\n    As Boolean\nEnd Function\n```\n\nThis\
    \ is the code to call the function:\n\n```\nDim MemberIndex As Integer\nDim MyDeviceInterfaceData\
    \ As SP_DEVICE_INTERFACE_DATA\nDim Result As Boolean\n\nmyDeviceInterfaceData.cbSize\
    \ = _\n    Marshal.SizeOf(myDeviceInterfaceData)\nMemberIndex = 0\n\nResult =\
    \ SetupDiEnumDeviceInterfaces _\n    (DeviceInfoSet, _\n    0, _\n    HidGuid,\
    \ _\n    MemberIndex, _\n    MyDeviceInterfaceData)\n```\n\n# Details\n\nIn the\
    \ SP_DEVICE_INTERFACE_DATA structure, the parameter cbSize is the size of the\
    \ structure in bytes. Before calling SetupDiEnumDeviceInterfaces, the size must\
    \ be stored in the structure that the function will pass. The sizeof operator\
    \ in Visual C++ or the Marshal.SizeOf method in Visual Basic retrieves the size.\
    \ The other values in the structure should be zero.\n\nThe HidGuid and DeviceInfoSet\
    \ parameters are values retrieved previously. DeviceInfoData is an optional pointer\
    \ to an SP_DEVINFO_DATA structure that limits the search to a particular device\
    \ instance. MemberIndex is an index to a structure in the DeviceInfoSet array.\
    \ MyDeviceInterfaceData is"
  merge: -1
  img_proc: true
- pgno: 318
  md: "the returned SP_DEVICE_INTERFACE_DATA structure that identifies a device interface\
    \ of the requested type.\n\n# Requesting a Structure Containing the Device Path\
    \ Name\n\nThe SetupDiGetDeviceInterfaceDetail function returns a structure that\
    \ contains a device path name for a device interface identified in an SP_DEVICE_INTERFACE_DATA\
    \ structure.\n\nBefore calling this function for the first time, there’s no way\
    \ to know the value of the DeviceInterfaceDetailDataSize parameter, which must\
    \ contain the size in bytes of the DeviceInterfaceDetailData structure. Yet the\
    \ function won’t return the structure unless the function call contains this information.\
    \ The solution is to call the function twice. The first time, GetLastError returns\
    \ the error The data area passed to a system call is too small, but the RequiredSize\
    \ parameter contains the correct value for DeviceInterfaceDetailDataSize. The\
    \ second time, you pass the returned size value and the function returns the structure.\n\
    \n# Visual C++\n\nThis is the declaration for DeviceInterfaceDetailData’s structure:\n\
    \n```\ntypedef struct _SP_DEVICE_INTERFACE_DETAIL_DATA {\n    DWORD cbSize;\n\
    \    TCHAR DevicePath[ANYSIZE_ARRAY];\n} SP_DEVICE_INTERFACE_DETAIL_DATA,\n*PSP_DEVICE_INTERFACE_DETAIL_DATA;\n\
    ```\n\nThis is the function’s declaration:\n\n```\nBOOLEAN\nSetupDiGetDeviceInterfaceDetail(\n\
    \    IN HDEVINFO DeviceInfoSet,\n    IN PSP_DEVICE_INTERFACE_DATA DeviceInterfaceData,\n\
    \    OUT PSP_DEVICE_INTERFACE_DETAIL_DATA\n        DeviceInterfaceDetailData,\
    \ OPTIONAL\n    IN DWORD DeviceInterfaceDetailDataSize,\n    OUT PDWORD RequiredSize,\
    \ OPTIONAL\n    OUT PSP_DEVINFO_DATA DeviceInfoData OPTIONAL\n);\n```"
  merge: -1
  img_proc: true
- pgno: 319
  md: "This is the code to call the function the first time:\n\n```\n```c\nBOOLEAN\
    \ Result;\nPSP_DEVICE_INTERFACE_DETAIL_DATA DetailData;\nULONG Length;\n\nResult\
    \ = SetupDiGetDeviceInterfaceDetail\n    (DeviceInfoSet,\n    &MyDeviceInterfaceData,\n\
    \    NULL,\n    0,\n    &Length,\n    NULL);\n```\n```\n\nThe code then allocates\
    \ memory for the DetailData structure, sets the cbSize property of DetailData,\
    \ and calls the function again, passing the returned buffer size in Length:\n\n\
    ```\n```c\nDetailData =\n    (PSP_DEVICE_INTERFACE_DETAIL_DATA)malloc(Length);\n\
    \nDetailData -> cbSize =\n    sizeof(SP_DEVICE_INTERFACE_DETAIL_DATA);\n\nResult\
    \ = SetupDiGetDeviceInterfaceDetail\n    (DeviceInfoSet,\n    &MyDeviceInterfaceData,\n\
    \    DetailData,\n    Length,\n    &Length,\n    NULL);\n```\n```"
