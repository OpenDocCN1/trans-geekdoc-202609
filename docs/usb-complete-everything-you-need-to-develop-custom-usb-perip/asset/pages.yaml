- pgno: 442
  md: '# Using the D2XX Direct Driver


    Applications can communicate with the D2XX driver using either FTDI Chip’s original
    Classic functions or an alternate set of functions that emulate Windows API functions.


    Table 14-1 lists the Classic interface functions. The basic functions for exchanging
    data are FT_Open, FT_Read, FT_Write, and FT_Close. Additional functions enable
    configuring the controller and accessing the EEPROM. A few functions apply only
    to the ’232BM’s handshaking signals and serial-communication parameters.


    An alternative to the Classic functions is the FT-Win32 API function set (Table
    14-2). These functions emulate standard Win32 API functions such as CreateFile,
    ReadFile, and WriteFile. The functions are convenient if you have existing code
    that uses Win32 functions but want to use the D2XX driver. The FT-Win32 functions
    don’t support setting the latency timer, EEPROM access, or Bit Bang mode.


    An application should use either the Classic interface or the FT-Win32 interface,
    not both.


    # Selecting a Driver


    Chapter 9 explained how Windows selects a driver for communicating with a device.
    The FTDI Chip controllers are a special case because they have two driver options
    and because the controllers can function using the default Vendor ID and Product
    ID. The defaults are your only option if your controller doesn’t interface to
    an EEPROM. To avoid confusion about which driver the host should assign to the
    device, it’s best to use an EEPROM with a unique Vendor ID/Product ID pair.


    Although the ’232BM and ’245BM have different interfaces to their device CPUs,
    the two chips appear identical to the host computer. The host computer doesn’t
    care what the device controller does with the data beyond the USB port. Devices
    that use both chips can use the same drivers and INF files. The ’245BM can use
    the VCP driver even though it doesn’t have the asynchronous serial interface found
    on conventional COM ports, and the'
  merge: -1
  img_proc: true
