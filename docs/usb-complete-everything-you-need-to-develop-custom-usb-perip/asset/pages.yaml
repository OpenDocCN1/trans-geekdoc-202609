- pgno: 467
  md: 'meration. If the handshake succeeds, the device removes its pull-up and communications
    are at high speed. A 1.x hub ignores the attempt to hand-shake, and the failure
    of the handshake informs the device that it must use full speed. Chapter 18 has
    more details about the handshake.


    # Maintaing an Idle Bus


    Start-of-Frame packets keep full- and high-speed devices from entering the Suspend
    state on an otherwise idle bus. When there is no data on a full-speed bus, the
    host continues to send a Start-of-Frame packet once per frame, and all hubs pass
    these packets on to their full-speed devices. When there is no data on a high-speed
    bus, the host continues to send a Start-of-Frame packet once per microframe, and
    all hubs pass these packets on to their high-speed devices. A full-speed device
    that connects to a 2.0 hub that communicates upstream at high speed will also
    receive a Start-of-Frame once per frame.


    Low-speed devices don’t see the Start-of-Frame packets. Instead, at least once
    per frame, hubs must send their low-speed devices a low-speed End-of-Packet (EOP)
    signal (defined in Chapter 18). This signal functions as a keep-alive signal that
    keeps a device from entering the Suspend state on a bus with no low-speed activity.
    A host can also request a hub to suspend the bus at a single port. Chapter 16
    has more on how hubs manage the Suspend state.


    # How Many Hubs in Series?


    USB was designed for connecting to peripherals over short to moderate distances.
    But that hasn’t stopped users from wondering just how far a USB peripheral can
    be from its host.


    The USB 2.0 specification doesn’t give a maximum length for cable segments, but
    the maximum allowed propagation delay limits the length to about 5 meters for
    full and high speed and 3 meters for low speed. You can increase the distance
    between a device and its host by using a series of hubs, each with a 5-meter cable.'
  merge: -1
  img_proc: true
