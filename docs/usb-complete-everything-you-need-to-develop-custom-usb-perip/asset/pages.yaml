    # PLX Technology NET2272


    PLX Technology, Inc.’s NET2272 is a full/high-speed chip that interfaces to an
    external CPU over a parallel interface. PLX Technology acquired Netchip Technology,
    Inc. and its USB controllers in 2004.


    # Architecture


    A series of registers hold configuration data and other information. Packet buffers
    hold USB data that has been received and data that is ready to transmit. The parallel
    interface has 5 address bits and 16 data bits. Transfers to and from the packet
    buffers can be 8 or 16 bits.


    The registers store status and control information and the data received in the
    last Setup transaction. The CPU also uses registers to read and write endpoint
    data from and to the packet buffers.


    The ’2272 supports three modes for accessing its registers. In direct address
    mode, the five address bits specify a register to read or write to. In multiplexed
    address mode, the CPU places the register address on the data bits and the ’2272
    reads the address on the falling edge of the ALE control signal. In indirect address
    mode, the CPU uses the lowest address bit to distinguish between a register address
    pointer (0) and data (1). The CPU writes a register address pointer to specify
    a configuration register and then reads or writes data at the address pointed
    to. Direct and multiplexed address modes can access only the registers from 00h
    to 1Fh, which typically contain the information accessed most frequently. Indirect
    address mode can access all registers. The controller also supports DMA transfers.
    A CPU can write to the ’2272 at up to 60 Megabytes/sec. and can read from the
    ’2272 at up to 57 Megabytes/sec (in DMA mode).


    To access endpoint data in the packet buffers, the CPU selects an endpoint by
    writing to the Endpoint Page Select register or the DMA Endpoint Select'
