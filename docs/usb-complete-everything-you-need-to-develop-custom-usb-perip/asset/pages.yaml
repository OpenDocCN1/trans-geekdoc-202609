    described below. The values in the first EEPROM locations vary depending on whether
    the chip is an EZ-USB, EZ-USB-FX or EZ-USB-FX2. The description below uses the
    values for the basic EZ-USB. Table 6-3 has the values for the other series.


    **Default Mode.** The default mode is the most basic mode of operation and doesn’t
    use the serial EEPROM or other external memory. The EZ-USB core uses this mode
    if EA is logic low and either the core detects no EEPROM or the first byte read
    from EEPROM is not B0h or B2h.


    When the host enumerates the device, the EZ-USB core responds to requests. During
    this time, the 8051 core is in the reset state. This reset state is controlled
    by a register bit in the chip. The host can request to write this bit to place
    the chip in and out of reset. This reset affects the 8051 core only and is unrelated
    to USB’s Reset signaling.


    The descriptors retrieved by the host identify the device as a Default USB Device.
    The host matches the retrieved Vendor ID and Product ID with values in a Cypress-provided
    INF file that instructs the host to load one of Cypress’ general purpose drivers
    (either the CyUsb driver or the older General Purpose Driver) to communicate with
    the chip. The ReNum bit remains at zero.'
