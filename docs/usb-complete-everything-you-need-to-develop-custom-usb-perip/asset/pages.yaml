- pgno: 148
  md: '# # Get_Status


    **Purpose:** The host requests the status of the features of a device, interface,
    or endpoint.


    **Request Number (bRequest):** 00h


    **Source of Data:** device


    **Data Length (wLength):** 2


    **Contents of wValue field:** 0


    **Contents of wIndex field:** For a device, 0. For an interface, the interface
    number. For an endpoint, the endpoint number.


    **Contents of data packet in the Data stage:** the device, interface, or endpoint
    status.


    **Supported states:** Default: undefined. Address: OK for address 0, Endpoint
    0. Otherwise the device returns a STALL. Configured: OK.


    **Behavior on error:** The device returns a STALL if the interface or endpoint
    doesn’t exist.


    **Comments:** For requests directed to the device, two status bits are defined.
    Bit 0 is the Self-Powered field: 0=bus-powered, 1=self-powered. (The host can’t
    change this value.) Bit 1 is the Remote Wakeup field. The default on reset is
    0 (disabled). All other bits are reserved. For requests directed to an interface,
    all bits are reserved. For requests directed to an endpoint, only bit 0 is defined.
    Bit 0=1 indicates a Halt condition. See Set_Feature and Clear_Feature for more
    details on Remote Wakeup and Halt.'
  merge: -1
  img_proc: true
- pgno: 149
  md: '# Clear_Feature


    **Purpose:** The host requests to disable a feature on a device, interface, or
    endpoint.


    **Request Number (bRequest):** 01h.


    **Source of Data:** no Data stage


    **Data Length (wLength):** none


    **Contents of wValue field:** the feature to disable


    **Contents of wIndex field:** For a device feature, 0. For an interface feature,
    the interface number. For an endpoint feature, the endpoint number.


    **Contents of data packet in the Data stage:** none.


    **Supported states:** Default: undefined. Address: OK for address 0, Endpoint
    0. Otherwise the device returns a STALL. Configured: OK.


    **Behavior on error:** If the feature, device, or endpoint specified doesn’t exist,
    or if the feature can’t be cleared, the device responds with a STALL. Behavior
    is undefined when wLength is greater than 0.


    **Comments:** This request can clear the DEVICE_REMOTE_WAKEUP feature and the
    ENDPOINT_HALT feature, but not the TEST_MODE feature. Clear_Feature(ENDPOINT_HALT)
    resets the endpoint’s data toggle to DATA0. See also Set_Feature and Get_Status.'
  merge: -1
  img_proc: true
- pgno: 150
  md: '# # Set_Feature


    **Purpose:** The host requests to enable a feature on a device, interface, or
    endpoint.


    **Request Number (bRequest):** 03h


    **Source of Data:** no Data stage


    **Data Length (wLength):** none


    **Contents of wValue field:** the feature to enable


    **Contents of wIndex field:** For a device, 0. For an interface, the interface
    number. For an endpoint, the endpoint number.


    **Contents of data packet in the Data stage:** none.


    **Supported states:** For features other than TEST_MODE: Default: undefined. Address:
    OK for address 0, Endpoint 0. Otherwise the device returns a STALL. Configured:
    OK. The TEST_MODE feature must be supported when using high speed in the Default,
    Address, and Configured states.


    **Behavior on error:** If the endpoint or interface specified doesn’t exist, the
    device responds with a STALL.


    **Comments:** The USB 2.0 specification defines three features. ENDPOINT_HALT,
    with a value of 0, applies to endpoints. Bulk and interrupt endpoints must support
    the Halt condition. Two types of events may cause a Halt condition: a communications
    problem such as the device’s not receiving a handshake packet or receiving more
    data than expected, or the device’s receiving a Set_Feature request to halt the
    endpoint. DEVICE_REMOTE_WAKEUP, with a value of 1, applies to devices. When the
    host sets the DEVICE_REMOTE_WAKEUP feature, a device in the Suspend state can
    request the host to resume communications. TEST_MODE, with a value of 2, applies
    to devices. Setting this feature causes an the upstream-facing port to enter a
    test mode. Chapter 18 has more about test mode.


    The Get_Status request tells the host what features, if any, are enabled. Also
    see Clear_Feature.'
  merge: -1
  img_proc: true
- pgno: 151
  md: '# Set_Address


    **Purpose:** The host specifies an address to use in future communications with
    the device.


    **Request Number (bRequest):** 05h


    **Source of Data:** no Data stage


    **Data Length (wLength):** none


    **Contents of wValue field:** new device address. Allowed values are 1 through
    127. Each device on the bus, including the root hub, has a unique address.


    **Contents of wIndex field:** 0


    **Contents of data packet in the Data stage:** none


    **Supported States:** Default, Address.


    **Behavior on error:** not specified.


    **Comments:** When a hub enables a port after power-up or attachment, the port
    uses the default address of 0 until completing a Set_Address request from the
    host.


    This request is unlike most other requests because the device doesn''t carry out
    the request until the device has completed the Status stage of the request by
    sending a zero-length data packet. The host sends the Status stage''s token packet
    to the default address, so the device must detect and respond to this packet before
    changing its address.


    After completing this request, all communications use the new address.


    A device using the default address of zero is in the Default state. After completing
    a Set_Address request to set an address other than zero, the device enters the
    Address state.


    A device must send the handshake packet within 50 milliseconds after receiving
    the request and must implement the request within 2 milliseconds after completing
    the Status stage.'
  merge: -1
  img_proc: true
- pgno: 152
  md: '# Get_Descriptor


    **Purpose:** The host requests a specific descriptor.


    **Request Number (bRequest):** 06h


    **Source of Data:** device


    **Data Length (wLength):** the number of bytes to return. If the descriptor is
    longer than wLength, the device returns up to wLength bytes. If the descriptor
    is shorter than wLength, the device returns the descriptor. If the descriptor
    is shorter than wLength and an even multiple of the endpoint’s maximum packet
    size, the device follows the descriptor with a zero-length data packet. The host
    detects the end of the data on receipt of either the requested amount of data
    or a data packet containing less than the maximum packet size (including zero
    bytes).


    **Contents of wValue field:** High byte: descriptor type. Low byte: descriptor
    index, to specify which descriptor to return when there are multiple descriptors
    of the same type.


    **Contents of wIndex field:** for String descriptors, Language ID. Otherwise zero.


    **Contents of data packet in the Data stage:** the requested descriptor.


    **Supported states:** Default, Address, Configured.


    **Behavior on error:** When a device receives a request that the device doesn’t
    support, the device should return a STALL.


    **Comments:** A host can request the following descriptor types: device, device_qualifier,
    configuration, other_speed configuration, and string. On receiving a request for
    a configuration or other_speed configuration descriptor, the device should return
    the requested descriptor followed by all of the configuration’s subordinate descriptors
    up to the number of bytes requested. A class or vendor can also define descriptors
    that the host can request, such as the HID-class report descriptor. See also Set_Descriptor.'
  merge: -1
  img_proc: true
- pgno: 153
  md: '# Set_Descriptor


    **Purpose:** The host adds a descriptor or updates an existing descriptor.


    **Request Number (bRequest):** 07h


    **Source of Data:** host


    **Data Length (wLength):** The number of bytes the host will transfer to the device.


    **Contents of wValue field:** high byte: descriptor type. (See Get_Descriptor)
    Low byte: descriptor index to specify which descriptor is being sent when there
    are multiple descriptors of the same type.


    **Contents of wIndex field:** For string descriptors, Language ID. Otherwise zero.


    **Contents of data packet in the Data stage:** descriptor length.


    **Supported states:** Address and Configured.


    **Behavior on error:** When a device receives a request that the device doesn’t
    support, the device should return a STALL.


    **Comments:** This request makes it possible for the host to add new descriptors
    or change an existing descriptor. Many devices don’t support this request because
    it allows errant software to place incorrect information in a descriptor. See
    also Get_Descriptor.'
  merge: -1
