- pgno: 335
  md: "The application can compare this device path name with the device path name\
    \ of the device of interest. On a match, the application can take any desired\
    \ actions.\n\n# Visual C++\n\nThis is the code to retrieve the device path name\
    \ and look for a match:\n\n```\nPDEV_BROADCAST_HDR lpdb = (PDEV_BROADCAST_HDR)lParam;\n\
    \nif (lpdb->dbch_devicetype ==\n    DBT_DEVTYP_DEVICEINTERFACE)\n{\n    PDEV_BROADCAST_DEVICEINTERFACE\
    \ lpdbi =\n        (PDEV_BROADCAST_DEVICEINTERFACE)lParam;\n\n    CString DeviceNameString;\n\
    \n    DeviceNameString = lpdbi->dbcc_name;\n\n    if\n        ((DeviceNameString.CompareNoCase\n\
    \          (DetailData>DevicePath)) == 0)\n    {\n        // The names match.\n\
    \    }\n    else\n    {\n        // It's a different device.\n    }\n}\n```"
