    # Receiving Reports via Control Transfers


    To receive an Output or Feature report in a control transfer, the firmware must
    detect the Set_Report request in the bRequest field of a request directed to the
    HID interface. The device must also receive the report data in the Data stage
    and return a handshake in the Status stage. Microchip’s Framework HID example
    includes code that detects the request and calls the HIDSetReportHandler function
    in Listing 11-7.


    The function examines the high byte of the wValue field of the Setup stage’s data
    packet (MSB(SetupPkt.W_Value)) to determine if the host is sending an Output or
    Feature report. The low byte of the wValue field (LSB(SetupPkt.W_Value)) is the
    report ID that names the specific report being sent.


    If the code supports the requested report, the ctrl_trf_session_owner variable
    is set to MUID_HID so the firmware that handles other stages of the transfer can
    detect who is handling the request.


    The Framework firmware prepares Endpoint 0 to receive the report data on receiving
    an OUT token packet.'
