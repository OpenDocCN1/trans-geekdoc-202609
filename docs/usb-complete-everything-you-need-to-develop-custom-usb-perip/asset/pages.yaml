    the endpoint buffers and status and control registers at addresses 00h through
    3Fh via an external, local bus.


    The chip offers three options for accessing the local data bus: non-multiplexed
    parallel, multiplexed parallel, and Microwire synchronous serial.


    Most CPUs with external data buses can use one of the parallel interfaces with
    little or no additional logic. For faster transfers of blocks of data, the chip
    supports a burst mode where the CPU writes a starting address to the controller
    chip, then transmits or receives multiple bytes at consecutive addresses. The
    external CPU must also support this mode. The parallel interfaces also support
    DMA transfers.


    For microcontrollers that don’t have an external parallel data bus, the ’9603
    offers a solution in its Microwire interface. Microwire requires just four lines
    and can interface to just about any microcontroller with four spare I/O pins.
    The interface uses data lines serial in (SIN) and serial out (SOUT), a chip select
    (CS), and a clock line (SYNC). Command/address and data bytes shift in and out,
    bit by bit, using transitions on the SYNC line as a timing reference. The external
    CPU controls SYNC. There is no minimum SYNC frequency, and the signal doesn’t
    have to have a constant frequency; the CPU can toggle the line as needed. The
    interface just has to be fast enough to keep up with the USB traffic. If the USB
    port transfers only small, occasional blocks of data, you can program Microwire
    communications in firm-'
