- pgno: 446
  md: 'Windows uses the physical port to identify the device, and the port can change
    as users remove and reattach devices. You could still run into problems, however,
    because you can’t control the serial numbers of devices from other sources. So
    two devices that use the default Vendor ID and Product ID could end up with the
    same serial number.


    # Avoiding COM-port Proliferation


    Windows by default creates a new COM port for every device that uses the VCP driver
    and has a serial number. If you’re testing a batch of devices, you can quickly
    reach the maximum of 256 COM ports. To free up some port numbers, use Windows’
    Device Manager to uninstall devices you no longer need. Another solution (for
    in-house testing environments only!) is to edit *ftdibus.inf* to cause Windows
    to assign the VCP driver only to devices attached to a specified physical port
    or ports, and to cause Windows to create a single COM port for all of these devices,
    even if they have different serial numbers. FTDI Chip provides an application
    note with details about how to edit the INF file to accomplish this.


    # Performance Tips


    When using FTDI Chip’s controllers, there are several things you can do to get
    the best possible performance. The tips that follow show how to help data transfer
    as quickly as possible and how to prevent lost data.


    # Speed Considerations


    In considering the rate of data transfer when using FTDI Chip’s controllers, you
    need to consider both the transfer rate between the host computer and the device
    controller and the transfer rate between the device controller and the device’s
    CPU.


    Because the device controllers use bulk transfers, the amount of time required
    to transfer a specific amount of data between the host PC and the device controller
    can vary depending on how busy the bus is. The asynchronous serial and parallel
    interfaces can also slow things down if the transmitting end has to wait for the
    receiving end to indicate that it’s ready to receive'
  merge: -1
  img_proc: true
- pgno: 447
  md: 'a byte. And of course the asynchronous serial interface can be no faster than
    the selected baud rate.


    Using either the VCP or D2XX driver, an endpoint on a ’232BM can transfer up to
    3 Megabits/sec. This works out to 300 kilobytes/sec. assuming one Stop bit and
    one Start bit. To achieve this rate, the controller’s asynchronous serial port
    must use a baud rate of 3 Megabits/sec.


    A ’245BM endpoint can transfer up to 300 kilobytes/sec. using the VCP driver and
    1 Megabyte/sec. using the D2XX driver. For the fastest transfers, use the D2XX
    driver.


    # Minimizing Latency


    For IN transfers of less than 62 data bytes, there are several ways to cause data
    to transfer more quickly. By default, the controller’s bulk IN endpoint NAKs IN
    packets unless one of the following is true:


    +   - The transmit buffer contains at least 62 bytes.

    +   - At least 16 milliseconds has elapsed since the last IN packet was ACKed.

    +   - An event character is enabled and was received by the device.

    +   - For the ’232BM only, CTS, DSR, DCD, or RI has changed state.


    If any of the above is true, the controller returns two status bytes followed
    by the entire contents of the transmit buffer or 62 bytes, whichever is less.


    For devices that must send less than 62 bytes to the host without delay, the D2XX
    driver has a function that can change the latency timer from its default value
    of 16 milliseconds. The allowed range is from 1 to 255 milliseconds. For the shortest
    latency, set the timer to 1, and the device will send status bytes and any data
    if at least 1 millisecond has elapsed since the last bulk IN packet was ACKed.


    Event characters enable the host to request a device to send data immediately.
    The D2XX driver has a function that can define a character as a special event
    character. After receiving the event character, the controller sends status bytes
    and up to 62 data bytes in response to the next IN packet. The received event
    character is embedded in the data and the device firmware is'
  merge: -1
  img_proc: true
- pgno: 448
  md: 'responsible for recognizing and discarding the character if it’s not part of
    the meaningful data.


    A ’232BM can also be prompted to send data by changing the state of one of its
    handshaking inputs. And of course any of the controllers can force the data to
    transmit by padding the transmit buffer so it contains 62 bytes.


    # Preventing Lost Data


    The example programs in this chapter use handshaking to enable each end of the
    asynchronous serial or parallel link to indicate when it’s OK to send data. Handshaking
    isn’t needed if both ends of the link have buffers large enough to store received
    data until the CPU can read it. Devices like Parallax Inc.’s Basic Stamp, which
    can accept serial data only when executing a SerialIn statement, will almost certainly
    need handshaking to prevent missed data.


    When a CPU writes asynchronous serial data to a ’232BM, the chip stores the received
    data in a 384-byte transmit buffer and sends the data to the host in response
    to IN packets as described above. Because the interface uses bulk transfers, there’s
    no guarantee of when the host will request the data. If the bus is busy or the
    host is occupied with other tasks, USB communications with the device may have
    to wait. If the transmit buffer is full and the CPU continues to send data to
    the ’232BM, data will be lost. Handshaking provides a way for the ’232BM to let
    the device’s CPU know when it’s OK to send data. At the host, an application can
    usually reserve a generous buffer to hold data until the application can use it.


    In the other direction, application software on the host writes data to a buffer.
    The host’s driver sends the data in the buffer to the ’232BM in OUT bulk transfers.
    The ’232BM can store up to 128 bytes received from the host. If the buffer is
    full, the ’232BM returns NAKs in response to attempts to send more data. The ’232BM
    sends the data received from the host to the device’s CPU via the asynchronous
    serial link. The CPU and related circuits that receive the data from the ’232BM
    may have a very small buffer or no buffer at all. If there is a chance that the
    ’232BM will write data faster than the CPU can deal with it, handshaking can prevent
    lost data.'
  merge: -1
  img_proc: true
- pgno: 449
  md: 'The ’232BM supports three handshaking methods. The example programs use the
    RTS# and CTS# pins. The DTR# and DSR# pins can be used in the same way. A circuit
    can also use both pairs as defined in the TIA/EIA-232 standard. A third option
    is Xon/Xoff software handshaking, which uses dedicated codes embedded in the data
    to request stopping and starting transmissions.


    The ’245BM has the same buffers as the ’232BM. The chip supports handshaking via
    the RXF# and TXE# pins, which enable each end to indicate when it’s ready to receive
    data, and by the RD# and WR signals, which indicate when a read or write operation
    is complete.


    # EEPROM Programming


    The D2XX Direct Driver enables application software to read and write to an EEPROM
    that connects to a ’232BM or ’245BM over a Microwire synchronous serial interface.


    # EEPROM Data


    An EEPROM is required if you want to customize any of a variety of device characteristics,
    including the Vendor ID, Product ID, or support for remote wakeup. Listing 14-3
    shows a C structure that contains the values an application can write to an EEPROM
    using the D2XX driver and FT_EE_Program function.


    An EEPROM can also store data in a user area. Host applications can read and write
    to this area, but the device’s CPU can access the user area only when the USB
    controller is in the Reset state.


    # Editing the Data


    FTDI Chip provides an MPROG utility that enables storing a new Vendor ID, Product
    ID, serial number, and other information in an EEPROM that interfaces to a ’232BM
    or ’245BM. A complication is that the utility requires the D2XX driver to be assigned
    to the controller, yet Windows may balk at assigning the D2XX driver to a device
    that uses the default IDs. To'
  merge: -1
  img_proc: true
