- pgno: 539
  md: 'GND is the ground reference for VBUS as well as for D+ and D-.

    D+ and D- are the differential signal pair.


    Chapter 16 described the voltage and current limits for VBUS.


    Cables to be used in full- or high-speed segments have different requirements
    compared to cables for low-speed segments. Table 19-3 compares the two cable types.
    A low-speed segment is a cable segment between a low-speed device and its hub.
    Any additional upstream segments between hubs are considered to be full- or high-speed
    segments.


    The USB 2.0 specification tightened the requirements for low-speed cables. A 1.1-compliant
    low-speed cable required no shielding at all. A 2.0-compliant low-speed cable
    must have the same inner shield and drain wire required for full speed. The USB
    specification also recommends, but doesn''t require, a braided outer shield and
    a twisted pair for data, as on full- and high-speed cables.


    Full- and high-speed segments can use the same cables. When the USB 2.0 specification
    was under development, an Engineering Change Notice to the 1.x specification added
    new requirements to ensure that full-speed cables would also work at high speed.
    The 2.0 specification also includes these requirements. The requirements describe
    what was typically found in compliant full-speed cables, so most providers with
    compliant cables had no changes to make to their products.


    In a full/high-speed cable, the signal wires must have a differential characteristic
    impedance of 90 ohms. This value is a measure of the input impedance of an infinite,
    open line and determines the initial current on the lines when the outputs switch.
    The characteristic impedance for a low-speed cable isn''t defined because the
    slower edge rates mean that the initial current doesn''t affect the logic states
    seen by the receiver.


    The USB specification lists requirements for the cable''s conductors, shielding,
    and insulation. These are the major requirements for full/high-speed cables:


    +   - Data wires: twisted pair, #28 AWG.

    +   - Power and ground: non-twisted, #20 to #28 AWG.'
