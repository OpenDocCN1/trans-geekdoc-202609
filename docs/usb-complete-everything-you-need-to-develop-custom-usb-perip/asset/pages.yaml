  md: '![](img/3955d77b6be34048e3bc722d0b15c2a9_530_0.png)


    Figure 19-3: The downstream-facing ports on a 1.x hub must support both low and
    full speeds (except for ports with embedded or permanently attached devices).
    A device’s upstream-facing port typically supports just one speed.'
  merge: -1
