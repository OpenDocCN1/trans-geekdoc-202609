  md: 'cate, notify the user, and wait for reattachment. Windows provides device-notification
    functions for this purpose.


    # About Device Notifications


    To request to be informed when a device is attached or removed, an application’s
    form can register to receive notification messages for devices in a device interface
    class. The messages are WM_DEVICECHANGE messages that the operating system passes
    to the form’s WindowProc (WndProc in Visual Basic) method. An application can
    override the WindowProc method in a form’s base class with a method that processes
    the messages and then passes them to the base class’s WindowProc method. Each
    notification contains a device path name that the application can use to identify
    the device the notification applies to. Table 10-3 lists the API functions used
    in registering for device notifications. The example that follows shows how to
    use the functions.


    # Registering for Device Notifications


    Applications use the RegisterDeviceNotification function to request to receive
    notification messages. The function requires a pointer to a handle for the window
    or service that will receive the notifications, a pointer to a DEV_BROADCAST_DEVICEINTERFACE
    structure that holds information about the request, and flags to indicate whether
    the handle is for a window or service status.


    In the DEV_BROADCAST_DEVICEINTERFACE structure passed to RegisterDeviceNotification,
    the dbcc_devicetype member is set to DBT_DEVTYP_DEVICEINTERFACE to specify that
    the application wants to receive notifications about a device interface class,
    and classguid is the GUID of the device interface class (HidGuid in the examples).


    When the WM_DEVICECHANGE messages are no longer of interest, the application should
    call UnregisterDeviceNotification, as described later in this chapter.'
  merge: -1
  img_proc: true
- pgno: 328
  md: "Table 10-3: These functions enable an application to request to receive or\
    \ stop receiving notifications about device attachment and removal.\n\n| API Function\
    \ | DLL | Purpose |\n|---|---|---|\n| RegisterDeviceNotification | user32 | Request\
    \ to receive device notifications |\n| UnregisterDeviceNotification | user32 |\
    \ Request to stop receiving device notifications |\n\n# Visual C++\n\nThe declaration\
    \ for the DEV_BROADCAST_DEVICEINTERFACE structure is this:\n\n```\ntypedef struct\
    \ _DEV_BROADCAST_DEVICEINTERFACE {\n    DWORD dbcc_size;\n    DWORD dbcc_devicetype;\n\
    \    DWORD dbcc_reserved;\n    GUID dbcc_classguid;\n    TCHAR dbcc_name[1];\n\
    } DEV_BROADCAST_DEVICEINTERFACE\n*PDEV_BROADCAST_DEVICEINTERFACE;\n```\n\nThis\
    \ is the function's declaration:\n\n```\nHDEVNOTIFY RegisterDeviceNotification(\n\
    \    HANDLE hRecipient,\n    LPVOID NotificationFilter,\n    DWORD Flags\n);\n\
    ```\n\nThis is the code to call the function:\n\n```\nHDEVNOTIFY DeviceNotificationHandle;\n\
    \nDEV_BROADCAST_DEVICEINTERFACE\n    DevBroadcastDeviceInterface;\n\nDevBroadcastDeviceInterface.dbcc_size\
    \ =\n    sizeof(DevBroadcastDeviceInterface);\n\nDevBroadcastDeviceInterface.dbcc_devicetype\
    \ =\n    DBT_DEVTYP_DEVICEINTERFACE;\n\nDevBroadcastDeviceInterface.dbcc_classguid\
    \ = HidGuid;\n```"
