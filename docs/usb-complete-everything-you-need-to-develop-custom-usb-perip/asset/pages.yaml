    # Error Checking


    The USB specification spells out hardware requirements that ensure that errors
    due to line noise will be rare. Still, there is a chance that a noise glitch or
    unexpectedly disconnected cable could corrupt a transmission. For this reason,
    USB packets include error-checking bits that enable a receiver to identify just
    about any received data that doesn’t match what was sent. In addition, for transfers
    that require multiple transactions, a data-toggle value keeps the transmitter
    and receiver synchronized to ensure that no transactions are missed entirely.


    # Error-checking Bits


    All token, data, and Start-of-Frame packets include bits for use in error-checking.
    The bit values are calculated using a mathematical algorithm called the cyclic
    redundancy check (CRC). The USB specification explains'
  merge: -1
  img_proc: true
- pgno: 76
  md: 'how the CRC is calculated. The hardware handles the calculations, which must
    be done quickly to enable the device to respond appropriately.


    The CRC is applied to the data to be checked. The transmitting device performs
    the calculation and sends the result along with the data. The receiving device
    performs the identical calculation on the received data. If the results match,
    the data has arrived without error and the receiving device returns an ACK. If
    the results don''t match, the receiving device sends no handshake. The absence
    of the expected handshake tells the sender to retry.


    Typically, the host tries a total of three times, but the USB specification gives
    the host some flexibility in determining the number of retries. On giving up,
    the host informs the driver of the problem.


    The PID field in token packets uses a simpler form of error checking. The lower
    four bits in the field are the PID, and the upper four bits are its complement.
    The receiver can check the integrity of the PID by complementing the upper four
    bits and ensuring that they match the PID. If not, the packet is corrupted and
    is ignored.


    # The Data Toggle


    In transfers that require multiple transactions, the data-toggle value can ensure
    that no transactions are missed by keeping the transmitting and receiving devices
    synchronized. The data-toggle value is included in the PID field of the token
    packets for IN and OUT transactions. DATA0 is a code of 0011, and DATA1 is 1011.
    In controller chips, a register bit often indicates the data-toggle state, so
    the data-toggle value is often referred to as the data-toggle bit. Each endpoint
    maintains its own data toggle.


    Both the sender and receiver keep track of the data toggle. A Windows host handles
    the data toggles without requiring any user programming. Some device controller
    chips also handle the data toggles completely automatically, while others require
    some firmware control. If you''re debugging a device where it appears that the
    proper data is transmitting on the bus but the receiver is discarding the data,
    chances are good that the device isn''t sending or expecting the correct data
    toggle.'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'When the host configures a device on power up or attachment, the host and device
    each set their data toggles to DATA0 for all except some high-speed isochronous
    endpoints. On detecting an incoming data packet, the host or device compares the
    state of its data toggle with the received data toggle. If the values match, the
    receiver toggles its value and returns an ACK handshake packet to the sender.
    The ACK causes the sender to toggle its value for the next transaction.


    The next received packet in the transfer should contain a data toggle of DATA1,
    and again the receiver toggles its bit and returns an ACK. The data toggle continues
    to alternate until the transfer completes. (An exception is control transfers,
    where the Status stage always uses DATA1.)


    If the receiver is busy and returns a NAK, or if the receiver detects corrupted
    data and returns no response, the sender doesn’t toggle its bit and instead tries
    again with the same data and data toggle.


    If a receiver returns an ACK but for some reason the sender doesn’t see the ACK,
    the sender will think that the receiver didn’t get the data and will try again
    using the same data and data-toggle bit. In this case, the receiver of the repeated
    data doesn’t toggle the data toggle and ignores the data but returns an ACK. The
    ACK re-synchronizes the data toggles. The same thing happens if the sender mistakenly
    sends the same data toggle twice in a row.


    Control transfers always use DATA0 in the Setup stage, use DATA1 in the first
    transaction of the Data stage, toggle the bit in any additional Data-stage transactions,
    and use DATA1 in the Status stage. Bulk endpoints toggle the bit in every transaction,
    resetting the data toggle only after completing a Set_Configuration, Set_Interface,
    or Clear_Feature(ENDPOINT HALT) request. Interrupt endpoints can behave the same
    as bulk endpoints. Or an interrupt IN endpoint can toggle its data toggle in each
    transaction without checking for the host’s ACKs, at the risk of losing some data.
    Full-speed isochronous transfers always use DATA0. Isochronous transfers can’t
    use the data toggle to correct errors because there is no handshake packet for
    returning an ACK or NAK and no time to resend missed data.


    Some high-speed isochronous transfers use DATA0, DATA1, and additional PIDs of
    DATA2 and MDATA. High-speed isochronous IN transfers that'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'have two or three transactions per microframe use DATA0, DATA1, and DATA2 encoding
    to indicate a transaction''s position in the microframe:


    | Number of IN Transactions in the Microframe | Data PID |  |  |

    |---|---|---|---|

    |  | First Transaction | Second Transaction | Third Transaction |

    | 1 | DATA0 | – | – |

    | 2 | DATA1 | DATA0 | – |

    | 3 | DATA2 | DATA1 | DATA0 |


    High-speed isochronous OUT transfers that have two or three transactions per microframe
    use DATA0, DATA1, and MDATA encoding to indicate whether more data will follow
    in the microframe:


    | Number of OUT Transactions in the Microframe | Data PID: |  |  |

    |---|---|---|---|

    |  | First Transaction | Second Transaction | Third Transaction |

    | 1 | DATA0 | – | – |

    | 2 | MDATA | DATA1 | – |

    | 3 | MDATA | MDATA | DATA2 |


    This use of the data toggle and other PIDs is called data PID sequencing.'
  merge: -1
