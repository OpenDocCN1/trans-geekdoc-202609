- pgno: 392
  md: '# Usage Minimum and Maximum.


    The Usage Minimum and Usage Maximum can assign a series of Usage IDs to the elements
    in an array or bitmap. The following example describes a report that contains
    the state (0 or 1) of each of three buttons. The Usage Minimum and Usage Maximum
    specify that the first button has a Usage ID of 1, the second button has a Usage
    ID of 2, and the third button has a Usage ID of 3:


    ```

    Usage Page (Button Page)

    Logical Minimum (0)

    Logical Maximum (1)

    Usage Minimum (1)

    Usage Maximum (3)

    Report Count (3)

    Report Size (1)

    Input (Data, Variable, Absolute)

    ```


    # Designator Index.


    For items with a physical descriptor, the Designator Index specifies a Designator
    value in a physical descriptor. The Designator specifies what body part the control
    uses.


    # Designator Minimum and Designator Maximum.


    When a report contains multiple Designator Indexes that apply to the elements
    in a bitmap or array, a Designator Minimum and Designator Maximum can assign a
    sequential Designator Index to each bit or array item.


    # String Index.


    An item or control can include a String Index to associate a string with the item
    or control. The strings are stored in the same format described in Chapter 4 for
    product, manufacturer, and serial-number strings.


    # String Minimum and Maximum.


    When a report contains multiple string indexes that apply to the elements in a
    bitmap or array, a String Minimum and String Maximum can assign a sequential String
    Index to each bit or array item.


    # Delimiter.


    A Delimiter defines the beginning (1) or end (0) of a local item. A delimited
    local item may contain alternate usages for a control. Different applications
    can thus define a device''s controls in different ways. For example, a button
    may have a generic use (Button1) and a specific use (Send, Quit, etc.).'
  merge: -1
  img_proc: true
- pgno: 393
  md: '# Physical Descriptors


    A physical descriptor specifies the part or parts of the body intended to activate
    a control. For example, each finger might have its own assigned control. Similar
    physical descriptors are grouped into a physical descriptor set. A set consists
    of a header, followed by the physical descriptors.


    A physical descriptor is a HID-specific descriptor. The host can retrieve a physical
    descriptor set by sending a Get_Descriptor request with 23h in the high byte of
    the wValue field and the number of the descriptor set in the low byte of the wValue
    field.


    Physical descriptors are optional. For most devices, these descriptors either
    don''t apply at all or the information they could provide has no practical use.
    The HID specification has more information on how to use physical descriptors,
    for those devices that need them.


    # Padding


    To pad a descriptor so it contains a multiple of eight bits, a descriptor can
    include a Main item with no assigned Usage. The following excerpt from a keyboard''s
    report descriptor specifies an Output report that transfers five bits of data
    and three bits of padding:


    ```

    Usage Page (LEDs)

    Usage Minimum (1)

    Usage Maximum (5)

    Output (Data, Variable, Absolute) (5 1-bit LEDs)


    Report Count (1)

    Report Size (3)

    Output (Constant) (3 bits of padding)

    ```'
  merge: -1
  img_proc: true
