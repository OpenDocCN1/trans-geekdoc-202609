- pgno: 420
  md: 'InputReportBuffer is a byte array that must be large enough to hold the report
    ID and the largest Input report defined in the HID’s report descriptor.


    The call to ReadFile passes the handle returned by CreateFile, the address of
    the first element in the InputReportBuffer array, the report’s length from the
    Capabilities structure returned by HidP_GetCaps, an Integer to hold the number
    of bytes read, and an overlapped structure whose hEvent parameter is a handle
    to the event object. A call to ReadFile returns immediately. The application then
    calls WaitForSingleObject, which returns when a report has been read or on a timeout.
    The parameters passed to WaitForSingleObject are the event object and a timeout
    value in milliseconds.


    If WaitForSingleObject returns success (WAIT_OBJECT_0), the first byte in InputReportBuffer
    is the report ID, and the following bytes are the report data read from the device.
    If the interface supports only the default report ID of zero, the report ID doesn’t
    transmit on the bus but is always present in the buffer returned by ReadFile.


    A call to ReadFile doesn’t initiate traffic on the bus. The call just retrieves
    a report that the host previously requested in one of its periodic interrupt IN
    transfers. If there are no unread reports, ReadFile waits for a report to arrive.
    The host begins requesting reports when the HID driver is loaded during enumeration.
    The driver stores the reports in a ring buffer. When the buffer is full and a
    new report arrives, the oldest report is overwritten. A call to ReadFile reads
    the oldest report in the buffer. Under Windows 98 SE and later, an application
    can set the buffer size with the HidD_SetNumInputBuffers function. Different Windows
    editions have different default buffer sizes, ranging from 2 under Windows 98
    Gold to 32 under Windows XP.


    Each handle with READ access to the HID has its own Input buffer, so multiple
    applications can read the same reports.


    If the application doesn’t request reports as frequently as they’re sent, some
    will be lost. One way to keep from losing reports is to increase the size of the
    report buffer passed to ReadFile. If multiple reports are available, ReadFile
    returns as many as will fit in the buffer. If you need to be absolutely sure not'
  merge: -1
  img_proc: true
- pgno: 421
  md: 'to lose a report, use Feature reports instead. Also see the tips in Chapter
    3 about performing time-critical transfers.


    The Idle rate introduced in Chapter 11 determines whether or not a device sends
    a report if the data hasn’t changed since the last transfer. During enumeration,
    Windows’ HID driver attempts to set the Idle rate to 0, which means that the HID
    won’t send a report unless the report data has changed. There is no API call that
    enables applications to change the Idle rate. To prevent setting an Idle rate
    of zero, the HID can return a STALL to the Set_Idle request to inform the host
    the request isn’t supported. Not all device controllers have hardware support
    for the Idle rate, though support can be implemented with a timer in firmware.


    Whether or not Set_Idle is supported, the firmware can be programmed to send each
    report only once. After sending a report, the firmware can configure the endpoint
    to return NAK in response to IN token packets. When the device has new data to
    send, the firmware can configure the endpoint to send a report. Otherwise, the
    device will continue to send the same data every time the host polls the endpoint,
    and the application is likely to read the same report multiple times.


    If ReadFile isn’t returning, these are possible reasons:


    +   - The HID’s interrupt IN endpoint is NAKing the IN token packets because the
    endpoint hasn’t been configured to send the report data. Remember that the endpoint’s
    hardware interrupt typically triggers after data has been sent, so the device
    must prepare to send the initial report before the first interrupt.

    +   - The number of bytes the endpoint is sending doesn’t equal the number of
    bytes in the report (for the default report ID) or the number of bytes in the
    report + 1 (for other report IDs).

    +   - The endpoint is sending report ID zero with the report, or the endpoint
    isn’t sending a report ID greater than zero with the report.'
  merge: -1
