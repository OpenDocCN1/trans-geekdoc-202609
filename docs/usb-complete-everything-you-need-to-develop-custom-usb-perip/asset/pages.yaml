- pgno: 93
  md: 'than 1024 bytes per microframe is called a high-bandwidth endpoint. Windows
    XP/Windows Server and earlier don’t support high-bandwidth interrupt endpoints,
    however, so the achievable maximum for these operating systems is 8.192 Megabytes/sec.
    If the host’s driver doesn’t support alternate interfaces, the maximum is 64 kilobytes/sec.
    A full-speed endpoint can request up to 64 bytes in each 1-millisecond frame,
    or 64 kilobytes/sec. A low-speed endpoint can request up to 8 bytes every 10 milliseconds,
    or 800 bytes/sec.


    The endpoint descriptor stored in the device specifies the maximum latency period.
    For low-speed devices, the maximum latency can be any value from 10 to 255 milliseconds.
    For full speed, the value can range from 1 to 255 milliseconds. For high speed,
    the range is 125 microseconds to 4 seconds, in increments of 125 microseconds.
    In addition, a high-speed interrupt endpoint with a maximum latency of 125 microseconds
    can request 1, 2, or 3 transactions per interval. The host controller ensures
    that transaction attempts occur within the specified period.


    The host may begin each transaction at any time up to the specified maximum latency
    since the previous transaction began. So, for example, with a 10-millisecond maximum
    at full speed, five transfers could take as long as 50 milliseconds or as little
    as 5 milliseconds. OHCI host controllers use values that correspond to powers
    of 2, with a maximum of 32 milliseconds. So for a full-speed device that requests
    a maximum anywhere from 8 to 15 milliseconds, an OHCI host will begin a transaction
    every 8 milliseconds, and a maximum latency anywhere from 32 to 255 will cause
    a transaction attempt every 32 milliseconds. However, devices shouldn’t rely on
    behavior that is specific to a type of host controller and should assume only
    that the host complies with the specification. (Chapter 8 has more about host-controller
    types.)


    Because the host is free to transfer data more quickly than the requested rate,
    interrupt transfers don’t guarantee a precise rate of delivery. The only exceptions
    are when the maximum latency equals the fastest possible rate. For example, with
    a 1.x host, a full-speed interrupt pipe configured for 1 transaction per millisecond
    will have bandwidth reserved for one transaction in each frame.'
