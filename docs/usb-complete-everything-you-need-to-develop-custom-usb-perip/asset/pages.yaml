  md: 'As another example, specifying velocity in centimeters per second requires
    a Unit value that contains units of both centimeters and seconds. From Table 12-4,
    the Unit value to use is 1011h. Nibble 0 = 1 to select the SI measuring system,
    nibble 1 = 1 to select length in centimeters, and nibble 3 = 1 to select time
