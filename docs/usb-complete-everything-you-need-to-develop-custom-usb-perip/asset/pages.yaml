- pgno: 61
  md: 'full- and high-speed devices can do bulk transfers. Devices aren’t required
    to support bulk transfers, but a specific device class might require them.


    Interrupt transfers are for devices that must receive the host’s or device’s attention
    periodically. Other than control transfers, interrupt transfers are the only way
    that low-speed devices can transfer data. Keyboards and mice use interrupt transfers
    to send keypress and mouse-movement data. Interrupt transfers can use any speed.
    Devices aren’t required to support interrupt transfers, but a specific device
    class might require them.


    Isochronous transfers have guaranteed delivery time but no error correcting. Data
    that might use isochronous transfers incudes audio or video to be played in real
    time. Isochronous is the only transfer type that doesn’t support automatic re-transmitting
    of data received with errors, so occasional errors must be acceptable. Only full-
    and high-speed devices can do isochronous transfers. Devices aren’t required to
    support isochronous transfers, but a specific device class might require them.


    # Stream and Message Pipes


    In addition to classifying a pipe by the type of transfer it carries, the USB
    specification defines pipes as either stream or message, according to whether
    or not information travels in one or both directions. Control transfers use bidirectional
    message pipes; all other transfer types use unidirectional stream pipes.


    # Control Transfers Use Message Pipes


    In a message pipe, each transfer begins with a Setup transaction containing a
    request. To complete the transfer, the host and device may exchange data and status
    information, or the device may just send status information. Each control transfer
    has at least one transaction that sends information in each direction.


    If a device supports a received request, the device takes the requested action.
    If a device doesn’t support the request, the device responds with a code to indicate
    that the request isn’t supported.'
