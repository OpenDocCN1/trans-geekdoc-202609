- pgno: 57
  md: '# Device Endpoints: the Source and Sink of Data


    All bus traffic travels to or from a device endpoint. The endpoint is a buffer
    that stores multiple bytes. Typically the endpoint is a block of data memory or
    a register in the controller chip. The data stored at an endpoint may be received
    data or data waiting to transmit. The host also has buffers that hold received
    data and data waiting to transmit, but the host doesn’t have endpoints. Instead,
    the host serves as the start and finish for communications with device endpoints.


    The USB specification defines a device endpoint as “a uniquely addressable portion
    of a USB device that is the source or sink of information in a communication flow
    between the host and device.” This definition suggests that an endpoint carries
    data in one direction only. However, as I’ll explain, a control endpoint is a
    special case that is bidirectional.


    An endpoint’s address consists of an endpoint number and direction. The number
    is a value from 0 to 15. The direction is defined from the host’s perspective:
    an IN endpoint provides data to send to the host and an OUT endpoint stores data
    received from the host. An endpoint configured for control transfers must transfer
    data in both directions, so a control endpoint actually consists of a pair of
    IN and OUT endpoint addresses that share an endpoint number.


    Every device must have Endpoint 0 configured as a control endpoint. There’s rarely
    a need for additional control endpoints. Some controller chips support them, however.


    Other types of transfers send data in one direction only, though status and control
    information may flow in the opposite direction. A single endpoint number can support
    both IN and OUT endpoint addresses. For example, a device might have an Endpoint
    1 IN endpoint address for sending data to the host and an Endpoint 1 OUT endpoint
    address for receiving data from the host.


    In addition to Endpoint 0, a full- or high-speed device can have up to 30 additional
    endpoint addresses (1 through 15, with each supporting both IN and OUT transfers).
    A low-speed device is limited to two additional end-'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'point addresses in any combination of directions (for example, Endpoint 1 IN
    and Endpoint 1 OUT or Endpoint 1 IN and Endpoint 2 IN).


    Every transaction on the bus begins with a packet that contains an endpoint number
    and a code that indicates the direction of data flow and whether or not the transaction
    is initiating a control transfer. The codes are IN, OUT, and Setup:


    | Transaction Type | Source of Data | Types of Transfers that Use this Transaction
    Type | Contents |

    |---|---|---|---|

    | IN | device | all | data or status information |

    | OUT | host | all | data or status information |

    | Setup | host | control | a request |


    As with the endpoint directions, the naming convention for IN and OUT transactions
    is from the perspective of the host. In an IN transaction, data travels from the
    device to the host. In an OUT transaction, data travels from the host to the device.


    A Setup transaction is like an OUT transaction because data travels from the host
    to the device, but a Setup transaction is a special case because it initiates
    a control transfer. Devices need to identify Setup transactions because these
    are the only type of transactions that devices must always accept and because
    the device needs to identify and respond to the request contained in the received
    data. Any transfer type may use IN or OUT transactions.


    Each transaction contains a device address and an endpoint address. When a device
    receives an OUT or Setup packet containing the device’s address, the endpoint
    stores the data that follows the OUT or Setup packet and the hardware typically
    triggers an interrupt. An interrupt-service routine in the device can then process
    the received data and take any other required action. When a device receives an
    IN packet containing its device address, if the device has data ready to send
    to the host, the hardware sends the data from the specified endpoint onto the
    bus and typically triggers an interrupt. An'
