    for the next transfer. Most devices also require additional firmware support for
    handling errors and other events. Each data transfer uses one of the four transfer
    types: control, interrupt, bulk, or isochronous. Each has a format and protocol
    to suit different needs.


    # Managing Data on the Bus


    USB’s two signal lines carry data to and from all of the devices on the bus. The
    wires form a single transmission path that all of the devices must share. (As
    explained later in this chapter, an exception is a cable segment between a 1.x
    device and a 2.0 hub on a high-speed bus, but even here, all data shares a path
    between the hub and host.) Unlike RS-232, which has a TX line to carry data in
    one direction and an RX line for the other direction, USB’s pair of wires carries
    a single differential signal, with the directions taking turns.


    The host is in charge of seeing that all transfers occur as quickly as possible.
    The host manages the traffic by dividing time into chunks called frames (at low
    and full speeds) or microframes (at high speed). The host allocates a portion
    of each frame or microframe to each transfer (Figure 2-1). A frame has a period
    of one millisecond. For high speed traffic, the host divides each frame into eight
    125-microsecond microframes. Each frame or microframe begins with a Start-of-Frame
    timing reference.'
