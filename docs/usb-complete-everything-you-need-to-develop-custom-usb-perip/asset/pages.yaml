  md: 'host with no 1.x hubs between. Traffic between a 2.0 hub and a 1.x hub or another
    low- or full-speed device travels at low or full speed. A bus with only a 1.x
    host controller supports only low and full speeds, even if the bus has 2.0 hubs
    and high-speed-capable devices.


    # Elements of a Transfer


    Every USB transfer consists of one or more transactions, and each transaction
    in turn contains packets that contain information. To understand transactions,
    packets, and their contents, you also need to know about endpoints and pipes.
    So that’s where we’ll begin.


    ![](img/3955d77b6be34048e3bc722d0b15c2a9_56_0.png)


    Figure 2-2: A USB 2.0 hub uses high speed whenever possible, switching to low
    and full speeds when necessary.'
