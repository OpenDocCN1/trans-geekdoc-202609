    Full-speed isochronous endpoints have a few new, optional abilities. The endpoint
    descriptor can specify synchronization and usage types (bmAttributes field), and
    the interval can be greater than 1 millisecond (bInterval field). In 1.x descriptors,
    these bits default to 0 (no synchronization) and 1 (one millisecond).


    When selecting bInterval values for interrupt and isochronous endpoints, don''t
    forget that the relation between bInterval and the interval time will vary depending
    on the transfer type and speed. For low- and full-speed interrupt endpoints, the
    interval equals bInterval in milliseconds. For full-speed isochronous endpoints,
    the interval equals 2^{bInterval-1} in milliseconds. For high-speed interrupt
    and isochronous endpoints, the interval equals 2^{bInterval-1} in units of 125
    microseconds. Note that if bInterval = 1, the full-speed interval is 1 millisecond
    in both USB 1.x and USB 2.0. So a 1.x isochronous endpoint, which must have bInterval
    = 1, requires no changes to comply with USB 2.0.


    If you upgrade a full-speed device to support high speed as well, the device needs
    a device_qualifier descriptor, an other_speed_configuration descriptor, and a
    set of descriptors for the high-speed configuration. Any interrupt endpoints in
    the default interface must have a maximum packet size of 64 or less. A USB 2.0
    device that supports only low speed or only full speed must return STALL in response
    to requests for the device_qualifier and other_speed_configuration descriptors.'
