  md: 'the class’s requirements, and the device must transfer data using only interrupt
    or control transfers as defined in the HID specification.


    The mass-storage class is another option for devices that exchange data in files
    and support a file system the host understands.


    Some devices need to provide their own drivers. Using a driver provided by a chip
    manufacturer is one option. This approach saves you from having to develop a driver
    but leaves you dependent on the chip vendor to fix bugs and keep up with new operating-system
    editions. Chapter 8 has more about creating custom drivers.


    # Converting from RS-232


    The RS-232 serial port has been with the PC since its beginning. The port has
    been used in thousands of peripherals. Just about any device that uses RS-232
    can be implemented with USB. There are several approaches to making the switch.


    First determine if the device fits into a defined class. Modems should use the
    communication-device class. Pointing devices, uninterruptible power supplies,
    and point-of-sale devices should be designed as HIDs.


    For many other devices, FTDI Chip’s FT232BM USB UART introduced in Chapter 6 provides
    a quick way to upgrade a design to USB. The chip can convert an existing RS-232
    device to USB with minimal design changes and in most cases no changes to host
    software.


    Figure 7-9 shows an example. A typical device with an RS-232 interface contains
    a UART that converts between the serial data used in RS-232 communications and
    the parallel data the CPU uses. The signals on the line side of the UART connect
    to converters that translate between RS-232 voltages and the 5V logic used by
    the UART. The line side of the converter connects to a cable to the remote computer
    with an RS-232 interface. To convert from RS-232 to USB, you replace the RS-232
    converter with a ’232BM. On the host computer, FTDI Chip’s Virtual COM port driver
    enables applications to access the device using the same functions used for RS-232
    communications.'
  merge: -1
  img_proc: true
- pgno: 248
  md: '![](img/3955d77b6be34048e3bc722d0b15c2a9_248_0.png)


    Figure 7-9: FTDI’s USB UART can convert devices with RS-232 interfaces to USB.
    A driver provided by FTDI causes the device to appear like a conventional COM-port
    device to host applications.


    An even easier solution is to use an RS-232/USB converter module. These typically
    contain little more than an FT232BM or similar chip, an RS-232 interface chip,
    an RS-232 connector, and a USB connector. Users then have a choice of using the
    original interface or adding the converter and using USB.'
  merge: -1
  img_proc: true
- pgno: 249
  md: 'When using a USB/RS-232 converter, devices that use the status and control
    signals in unconventional ways and with critical timing requirements may require
    modifications to device hardware or firmware or application software.


    # Converting from the Parallel Port


    Another port that all PCs had from the beginning was the parallel port. The port
    was originally intended for connecting printers, but many other device types took
    advantage of the port as well. The parallel interface is faster than RS-232 and
    thus became a favored connection for scanners and external drives. Scanners, drives,
    and printers can now use USB and the standard classes for these device types.


    For other devices, there are several options for converting to USB. A peripheral-side
    parallel-port interface has 8 bidirectional data pins, 5 status outputs, and 4
    control inputs. A USB controller with 17 or more I/O bits can emulate a parallel
    port. Prolific Technology’s PL-2305 has a USB interface and a complete PC-side
    IEEE-1284 parallel port that can interface directly to existing parallel-port
    devices.


    For the firmware and driver, devices that can function using only control and
    interrupt transfers may be able to use the HID class. The device will need new
    application software to communicate with the HID drivers in place of the driver
    that accessed the parallel port. If you want to make minimal changes to the application
    software, you can provide a custom driver that provides functions that emulate
    the functions called by the original application.


    # PC-to-PC Communications


    Every USB communication must be between a host and a device. USB doesn’t allow
    hosts to exchange data with each other directly. Yet because every PC has a USB
    port, it’s natural to want to use the interface to connect PCs to each other,
    especially when the PCs don’t have Ethernet ports.


    USB On-The-Go enables a device to also function as a host. Most PCs don’t contain
    On-The-Go host controllers, however. Another solution is to use a'
  merge: -1
  img_proc: true
- pgno: 250
  md: '![](img/3955d77b6be34048e3bc722d0b15c2a9_250_0.png)


    Figure 7-10: To enable two USB hosts to communicate with each other, two USB serial
    interface engines can share a buffer. Each SIE copies received USB data into the
    shared buffer, and the other device retrieves the data from the buffer and sends
    the data to the other host.


    host-to-host bridge cable that contains two serial interface engines. Each PC
    has a USB connection to one of the SIEs, and the two devices communicate with
    each other via a shared buffer (Figure 7-10). Data sent by a PC travels to one
    of the SIEs, through the shared buffer, and out the other SIE to the remote PC.


    Prolific Technology’s PL-2501 Hi-Speed USB Host to Host Bridge Controller is a
    single chip designed for this type of host-to-host application. The chip contains
    an 8032 microcontroller and two USB SIEs that can access a common buffer. The
    PL-2301 is a full-speed version. Many commercial “data-link file-transfer cables”
    contain one of these chips. Typically, the drivers enable each PC to see the other
    as a network-connected computer.


    An alternate approach is to use two FTDI Chip USB UARTs and cross-connect the
    asynchronous interfaces in a “null modem” configuration. The PCs then see each
    other as COM-port devices. Yet another option is to establish a network connection
    by attaching a USB/Ethernet converter to each PC and connecting each converter
    to a local network.'
  merge: -1
  img_proc: true
- pgno: 251
  md: '# Using a Generic Driver


    For devices that don’t fit into a standard class, a generic driver can be a solution.
    Generic drivers typically enable applications to request control, interrupt, bulk,
    and isochronous transfers using a driver-specific API. Two such options are the
    DriverX USB toolkit from Tetradyne Software, Inc. and the USBIO Development Kit
    from Thesycon Systemsoftware & Consulting GmbH. (Yes, that spelling is correct.)


    The DriverX USB toolkit includes a generic driver, header and library files for
    use with Visual C++ and Borland C++ Builder, and additional support for Delphi
    and Visual Basic.


    To communicate with the driver included with the USBIO Development Kit, applications
    can use standard Windows API functions (ReadFile, WriteFile, DeviceIoControl),
    a C++ class library, native Delphi and Java interfaces, or a USBIO COM interface
    based on Microsoft’s Component Object Model (COM) technology.'
  merge: -1
  img_proc: true
