  img_proc: true
- pgno: 255
  md: '# Options for USB Devices


    There are several approaches to obtaining a driver for a USB device that you’re
    developing. Many devices can use a driver that’s included with Windows or provided
    by a chip vendor or other source. Other devices may require custom drivers. When
    a custom driver is necessary, toolkits are available to simplify and speed up
    the task of driver writing. Sometimes more than one way will work, and the choice
    depends on what’s easier, cheaper, or offers better performance.


    As Chapter 7 showed, many peripherals fit into standard classes such as disk drives,
    printers, modems, keyboards, and mice. Each of these devices is available with
    a choice of interfaces, including USB. For example, a disk drive may use ATA/ATAPI,
    SCSI, IEEE-1394, or USB. When the devices in a class may have any of multiple
    hardware interfaces, supplemental drivers can support different interfaces. If
    a device has features or capabilities beyond what a class driver supports, a device-specific
    filter driver may be able to support these as needed.


    # User and Kernel Modes


    To understand what the device driver has to do, you need to understand where the
    driver fits in the communications path of a data transfer. Even if you don’t need
    to write a driver for your device, understanding the driver’s role will help in
    understanding the application-level code that you do write.


    In the most general sense, a device driver is any code that handles communication
    details for a hardware device that interfaces to a CPU. Even a short subroutine
    in an application can be considered a device driver. Under Windows, the code for
    most drivers, including USB drivers, differs from application code because the
    operating system allows the driver code a greater level of privilege than applications
    are allowed.


    Program code in a Windows system runs in one of two modes: user or kernel. Each
    allows a different level of privilege in accessing memory and other system resources.
    Applications must run in user mode. Most drivers, including all USB drivers, run
    in kernel mode, though a driver for a USB device'
  merge: -1
  img_proc: true
- pgno: 256
  md: '![](img/3955d77b6be34048e3bc722d0b15c2a9_256_0.png)


    Figure 8-1: USB uses a layered driver model under Windows, with separate drivers
    for devices and the buses they connect to.


    may have a supplementary user-mode driver. Figure 8-1 shows the major components
    of user and kernel modes in a USB communication.


    In user mode, Windows limits access to memory and other system resources. Windows
    doesn’t allow an application to access memory that the operating system has designated
    as protected. Managing memory in this way enables a PC to run multiple applications
    at the same time. If an application crashes, other applications shouldn’t be affected.
    On x86 processors, user mode corresponds to the CPU’s Ring 3 mode.'
