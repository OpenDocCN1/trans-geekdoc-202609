  md: work-arounds under Windows 98 Gold, Windows 98 SE, and Windows Me. With these
    operating systems, a device may wake up properly, but the device’s driver isn’t
    made aware of the wakeup so communications can’t resume. A white paper from Intel
    titled *Understanding WDM Power Management* by Kosta Koeman (available from the
    USB-IF’s Web site) details the problem and solutions. In short, a device using
    these operating systems shouldn’t place itself in the Suspend state unless the
    host requests it, and the device driver requires extra code to ensure that the
    wake-up completes successfully. Windows 2000 and later don’t have this problem.
