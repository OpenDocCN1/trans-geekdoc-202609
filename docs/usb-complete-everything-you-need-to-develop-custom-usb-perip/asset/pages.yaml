- pgno: 535
  md: 'handle all supported speeds or separate receivers for low/full speed and high
    speed.


    When a high-speed driver sends data, a current source drives one line with the
    other line at ground. The current source may be active all the time or only when
    transmitting. A current source that is active all the time is easier to design
    but consumes more power. The USB specification requires devices to meet the signal-amplitude
    and timing requirements beginning with the first symbol in a packet. This requirement
    complicates the design of a current source that is active only when transmitting.
    If the driver instead keeps its current source active all the time, the driver
    can direct the current to ground when not transmitting on the bus.


    In a high-speed-capable transceiver, the output impedance of the full-speed drivers
    has tighter tolerance compared to full-speed-only drivers (45 ohms ±10%, compared
    to 36 ohms ±22%). The change is required because the high-speed bus uses the full-speed
    drivers as electrical terminations on the cable. Full-speed drivers that aren’t
    part of a high-speed transceiver don’t require a change in output impedance.


    When the high-speed drivers are active, the full-speed drivers bring both data
    lines low (the Single-ended-Zero state). Each driver and its series resistor then
    function as a 45-ohm termination to ground. Because there is a driver at each
    end of the cable segment, there is a termination at both the source and the load.
    This double termination quiets the line more effectively than the source-only
    series terminations in full-speed segments. Using the full-speed drivers as terminations
    means no extra components are required.


    The USB specification provides eye-pattern templates that show the required high-speed
    transmitter outputs and receiver sensitivity. High-speed receivers must also meet
    new specifications that require the use of a differential time-domain reflectometer
    (TDR) to measure impedance characteristics.


    All high-speed receivers must include a differential envelope detector to detect
    the Squelch (invalid signal) state, indicated by a differential bus voltage of
    100 millivolts or less. The downstream ports on all 2.0 hubs must also'
  merge: -1
  img_proc: true
- pgno: 536
  md: 'include a high-speed-disconnect detector that detects when a device has been
    removed from the bus.


    Other new responsibilities for high-speed-capable devices include managing the
    switch from full to high speed and handling new protocols for entering and exiting
    the Suspend and Reset states.


    # Switching Speeds


    In a low- or full-speed device, a pull-up resistor on one of the signal lines
    indicates device speed. When a low- or full-speed device is attached or removed
    from the bus, the voltage change due to the pull up informs the hub of the change.
    High-speed-capable devices always attach at full speed, so hubs detect attachment
    of high-speed-capable devices in the same way.


    As Chapter 18 explained, the switch to high speed occurs after the device has
    been detected, during the Reset sent by the hub. A high-speed-capable device must
    support the high-speed handshake that informs the hub that the device is capable
    of high speed. When switching to high speed, the device removes its pull up from
    the bus.


    # Detecting Removal of a High-speed Device


    A 2.0 hub must also detect the removal of a high-speed device. Because the device
    has no pull up at high speed, the hub has to use a different method to detect
    the removal. When a device is removed from the bus, the differential terminations
    are removed, and the removal causes the differential voltage at the hub’s port
    to double. On detecting the doubled voltage, the hub knows the device has been
    removed.


    The hub detects the voltage by measuring the differential bus voltage during the
    extended End of High-speed Packet (HSEOP) in each high-speed Start-of-Frame Packet
    (HSSOP). A differential voltage of at least 625 milli-volts indicates a disconnect.


    # Suspending and Resuming at High Speed


    As Chapter 16 explained, devices must enter the low-power Suspend state when the
    bus has been in the Idle state for at least 3 milliseconds and no'
  merge: -1
  img_proc: true
- pgno: 537
  md: 'more than 10 milliseconds. When the bus has been idle for 3 milliseconds, a
    high-speed device switches to full speed. The device then checks the state of
    the full-speed bus to determine whether the host is requesting a Suspend or Reset.
    If the bus state is Single-Ended Zero, the host is requesting a Reset, so the
    device prepares for the high-speed-detect handshake. If the bus state is Idle,
    the device enters the Suspend state. The device must return to high speed on exiting
    the Suspend state.


    # Signal Voltages


    Chapter 18 introduced USB''s bus states. The voltages that define the states vary
    depending on the speed of the cable segment. The differences in the specified
    voltages at the transmitter and receiver mean that a signal can have some noise
    or attenuation and the receiver will still see the correct logic level.


    # Low and Full Speeds


    Table 19-2 shows the driver output voltages for low/full and high speeds. At low
    and full speeds, a Differential 1 exists at the driver when the D+ output is at
    least 2.8V and the D- output is no greater than 0.3V referenced to the driver''s
    signal ground. A differential 0 exists at the driver when D- is at least 2.8V
    and D+ is no greater than 0.3V referenced to the driver''s signal ground.


    At a low- or full-speed receiver, a differential 1 exists when D+ is at least
    2V referenced to the receiver''s signal ground, and the difference between D+
    and D- is greater than 200 millivolts. A differential 0 exists when D- is at least
    2V referenced to the receiver''s signal ground, and the difference between D-
    and D+ is greater than 200 millivolts. However, a receiver may optionally have
    less stringent definitions that require only a differential voltage greater than
    200 millivolts, ignoring the requirement for one line to be at least 2V.'
  merge: -1
  img_proc: true
