  img_proc: true
- pgno: 62
  md: '# All Other Transfers Use Stream Pipes


    In a stream pipe, the data has no structure defined by the USB specification.
    The receiving host or device just accepts whatever arrives. The device firmware
    or host software can then process the data in whatever way is appropriate for
    the application.


    Of course, even with stream data, the sending and receiving devices will need
    to agree on a format of some type. For example, a host application may define
    a code that requests a device to send a series of bytes indicating a temperature
    reading and the time of the reading. Although the host could use control transfers
    with a vendor-defined Get_Temperature request, interrupt transfers may be preferable
    because of their guaranteed bandwidth.


    # Initiating a Transfer


    When a device driver in the host wants to communicate with a device, the driver
    initiates a transfer. The USB specification defines a transfer as the process
    of making and carrying out a communication request. A transfer may be very short,
    sending as little as a byte of application data, or very long, sending the contents
    of a large file.


    A Windows application can open communications with a device using a handle retrieved
    using standard API functions. To begin a transfer, an application may use the
