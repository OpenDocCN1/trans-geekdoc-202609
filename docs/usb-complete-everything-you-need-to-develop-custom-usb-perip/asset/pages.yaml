- pgno: 528
  md: '![](img/3955d77b6be34048e3bc722d0b15c2a9_528_0.png)


    Figure 19-2: A 1.x hub converts between low- and full-speed''s polarities and
    edge rates. (Not drawn to scale)


    On attachment, all devices must communicate at low or full speed. When possible,
    a high-speed-capable device transitions from full to high speed shortly after
    the device is attached, during the high-speed handshake.


    # Low- and Full-speed Transceivers


    The transceiver for low and full speeds has a simpler design compared to the transceiver
    for high speed.


    # Low- and Full-speed Differences


    Low-speed data differs electrically from full speed in three ways. The bit rate
    is slower, at 1.5 Megabits/sec. compared to 12 Megabits/sec. for full speed. Low
    speed traffic''s polarity is inverted compared to full speed. And low speed has
    a slower edge rate compared to full speed. Figure 19-2 illustrates. The slower
    edge rate reduces reflected voltages on the line and makes it possible to use
    cables that have less shielding and are thus cheaper to make and physically more
    flexible.


    The transceiver''s hardware doesn''t care about the signal polarity. The transceiver
    just retransmits whatever logic levels are at its inputs. A driver that supports
    both speeds, such as a driver for a hub''s downstream port, must be able to switch
    between the two edge rates.'
  merge: -1
  img_proc: true
- pgno: 529
  md: '# The Circuits


    Figure 19-3 shows port circuits and cable segments for low- and full-speed communications.
    Each transceiver contains a differential driver and receiver for sending and receiving
    data on the bus’s twisted pair.


    When transmitting data, the driver has two outputs that are 180 degrees out of
    phase: when one output is high, the other is low. A single driver can support
    both low and full speeds with a control input to select the full-speed or low-speed
    edge rate.


    The differential receiver detects the voltage difference between the lines. A
    differential receiver has two inputs and defines logic levels in terms of the
    voltage difference between the inputs. Some differential interfaces, such as RS-485,
    define logic levels strictly as the difference between voltages on the two signal
    lines, with no reference to ground (though the interface requires a common ground
    connection). USB differs because it specifies absolute voltages in addition to
    a required voltage difference at the receivers. The differential receiver’s output
    is a logic-high or logic-low voltage referenced to ground.


    Each port also has two single-ended receivers that detect the voltages on D+ and
    D- with reference to signal ground. The logic states of the receivers’ outputs
    indicate whether the bus is low or full speed or whether the bus is in the Single-Ended-Zero
    state.


    The drivers’ output impedances plus a 36-ohm series resistor at each driver’s
    output act as source terminations that reduce reflected voltages when the outputs
    switch. The series resistors may be on-chip or external to the chip.


    # Pull-up and Pull-down Values


    The pull-up resistor on D+ or D- at a device’s upstream-facing port enables the
    hub to detect the device’s speed. The hub’s downstream-facing port has pull-down
    resistors on D+ and D-.


    On devices with detachable cables, the pull-up resistors must connect to a voltage
    source of 3.0–3.6V. Devices with captive cables can instead use an'
