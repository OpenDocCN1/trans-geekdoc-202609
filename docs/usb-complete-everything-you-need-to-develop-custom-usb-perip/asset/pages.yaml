    # Architecture


    The EZ-USB’s architecture is similar to Maxim Integrated Products/Dallas Semiconductor’s
    DS80C320, which is an 8051 whose core has been redesigned for enhanced performance.
    The chip uses four clock cycles per instruction cycle, compared to the original
    8051’s twelve. Each instruction takes between one and five instruction cycles.
    On average, an EZ-USB is 2.5 times as fast as an 8051 with the same clock speed.


    The instruction set is compatible with the 8051’s. All of the combined code and
    data memory is RAM. There is no non-volatile memory on-chip. However, the chips
    support non-volatile storage in I²C serial EEPROM and in external parallel memory.


    The EZ-USB family includes three series: the basic EZ-USB (AN21XX), the FX (CY7C646XX),
    and the FX2 (CY7C68013). Within each series are chips that vary in features such
    as the number of I/O pins or availability of an external data bus. Table 6-2 summarizes
    the features of each series. The FX series adds faster I/O and a general programmable
    interface that supports configurable, automated handshaking. The FX2 series adds
    support for high speed.


    Keil Software has a C compiler for the EZ-USB family, or you can use assembly
    code. The compiler has a limited but free evaluation version. Cypress provides
    Frameworks firmware in C to handle much of the work of USB communications.


