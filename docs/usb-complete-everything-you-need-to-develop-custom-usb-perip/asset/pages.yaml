- pgno: 336
  md: "# Visual Basic\n\nThe application uses two declarations for the DEV_BROADCAST_DEVICEINTERFACE\
    \ structure. The first declaration, presented earlier, is used when calling RegisterDeviceNotification.\
    \ The second declaration, DEV_BROADCAST_DEVICEINTERFACE_1, enables marshaling\
    \ the data in dbcc_name and classguid:\n\n```\n<StructLayout _\n    (LayoutKind.Sequential,\
    \ _\n        CharSet:=CharSet.Unicode)> _\nPublic Class DEV_BROADCAST_DEVICEINTERFACE_1\n\
    \    Public dbcc_size As Integer\n    Public dbcc_devicetype As Integer\n    Public\
    \ dbcc_reserved As Integer\n    <MarshalAs _\n        (UnmanagedType.ByValArray,\
    \ _\n        ArraySubType:=UnmanagedType.U1, _\n        SizeConst:=16)> _\n  \
    \      Public dbcc_classguid() As Byte\n    <MarshalAs _\n        (UnmanagedType.ByValArray,\
    \ sizeconst:=255)> _\n        Public dbcc_name() As Char\nEnd Class\n```\n\nThis\
    \ is the code to retrieve the device path name and look for a match:\n\n```\n\
    Dim DevBroadcastDeviceInterface As _\n    New DEV_BROADCAST_DEVICEINTERFACE_1()\n\
    Dim DevBroadcastHeader As New DEV_BROADCAST_HDR()\n\nMarshal.PtrToStructure(m.LParam,\
    \ DevBroadcastHeader)\n\nIf (DevBroadcastHeader.dbch_devicetype = _\n    DBT_DEVTYP_DEVICEINTERFACE)\
    \ Then\n    Dim StringSize As Integer = _\n        CInt((DevBroadcastHeader.dbch_size\
    \ - 32) / 2)\n    ReDim DevBroadcastDeviceInterface.dbcc_name _\n        (StringSize)\n\
    \n    Marshal.PtrToStructure _\n        (m.LParam, DevBroadcastDeviceInterface)\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 337
  md: "```\nDim DeviceNameString As New String _\n    (DevBroadcastDeviceInterface.dbcc_name,\
    \ _\n    0, _\n    StringSize)\n\nIf (String.Compare _\n    (DeviceNameString,\
    \ _\n    DevicePathName, _\n    True) = 0) Then\n    'The name matches.\nElse\n\
    \    'It's a different device.\nEnd If\nEnd If\n```\n\nMarshalPtrToStructure copies\
    \ the message's lParam property into a DEV_BROADCAST_HDR structure. If lParam\
    \ indicates that the message relates to a device interface, the application retrieves\
    \ the device path name.\n\nThe name is in a Char array in unmanaged memory. The\
    \ application needs to retrieve the Char array and convert it to a String.\n\n\
    The dbch_size member of DEV_BROADCAST_HDR contains the number of bytes in the\
    \ complete DEV_BROADCAST_INTERFACE structure. To obtain the number of characters\
    \ in the device path name stored in dbch_name, subtract the 32 bytes in the structure\
    \ that are not part of the name and divide by 2 because there are 2 bytes per\
    \ character.\n\nDevBroadcastDeviceInterface is a DEV_BROADCAST_INTERFACE_1 structure\
    \ that marshals the data in the classguid and dbcc_name members. A ReDim statement\
    \ trims dbcc_name to match the size of the device path name. Marshal.PtrToStructure\
    \ copies the data from the unmanaged block in lParam to the DevBroadcastDeviceInterface\
    \ structure. The Char array containing the device path name is then stored as\
    \ a String in DeviceNameString, and the String.Compare method looks for a match.\n\
    \n# Stopping Device Notifications\n\nTo stop receiving device notifications, an\
    \ application calls UnregisterDeviceNotification. The application should call\
    \ the function before closing."
  merge: -1
