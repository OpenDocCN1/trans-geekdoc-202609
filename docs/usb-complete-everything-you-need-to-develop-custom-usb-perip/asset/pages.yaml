- pgno: 277
  md: 'Device Manager, click View and check the option to Show Hidden Devices. You
    may need to reboot after setting the environment variable.


    # Property Pages


    Each listing in the Device Manager has Property Pages that provide additional
    information about a device and the ability to control the device and its driver.
    To view the Property Pages, double-click the device’s listing. You can request
    to enable or disable the device or view, update, roll back, or uninstall the device’s
    driver. A Details page provides additional information, including various system
    IDs, any filter drivers or coinstallers the device uses, and power capabilities.


    # Device Information in the Registry


    The system registry is a database that Windows maintains for storing critical
    information about the hardware and software installed on a system. The registry
    stores information about all devices that have been installed, whether or not
    they’re currently attached. When a new device is enumerated, Windows stores information
    about the device in the registry.


    Some of the information about USB devices in the registry comes from the bus drivers,
    which obtain the information from the devices. Other information is from the INF
    file that the operating system selects when assigning a driver to a device.


    You can view the registry’s contents using Windows’ regedit utility. (From the
    Start menu, select Run and enter regedit.) You can also use regedit to edit the
    registry’s contents, but making registry changes this way isn’t recommended and
    is seldom necessary. The Windows Platform SDK documents API functions that enable
    applications to read and write to the registry. Typically, device installation
    is the only time it’s necessary to change device information in the registry.
    A request to uninstall a device via the Device Manager or another application
    also results in changes to the registry.


    The system registry is a vital and essential component of Windows. It’s so important
    that Windows maintains multiple backup copies in case the cur-'
  merge: -1
  img_proc: true
- pgno: 278
  md: '# Chapter 9


    ![](img/3955d77b6be34048e3bc722d0b15c2a9_278_0.png)


    Figure 9-4: A hardware key contains information about an instance of a device
    with a specific Vendor ID and Product ID.


    rent copy becomes unusable. Be extremely careful about making changes to the registry.
    Windows’ System Restore utility can restore the registry to an earlier state.
    Just viewing the registry is safe, however.


    The registry’s data has a tree structure. Each node on the tree is a registry
    key. Each key can have entries with assigned values and subkeys that in turn may
    have entries and subkeys. Information about the system’s hardware and installed
    software is under the HKEY_LOCAL_MACHINE key, with information about USB devices
    under several subkeys: the hardware key, the class key, the driver key, and the
    service key.


    # The Hardware Key


    The hardware key, also called the instance key or device key, stores information
    about an instance of a specific device. Hardware keys are under the enumerator
    (Enum) key:


    ```

    HKEY_LOCAL_MACHINE\System\CurrentControlSet\Enum

    ```


    Under the Enum key is a USB key. Each subkey of the USB key contains the Vendor
    ID and Product ID of a USB device. Figure 9-4 shows the entry for'
  merge: -1
  img_proc: true
- pgno: 279
  md: 'a device with a Vendor ID of 0925h and Product ID or 1234h. Under each of these
    keys may be one or more hardware keys, with each hardware key identifying an instance
    of the device. Table 9-1 lists some of the entries under the hardware key.


    A device without a USB serial number gets a new hardware key every time the device
    attaches to a port the device hasn’t been attached to previously. If you physically
    remove the device and attach a different device with identical descriptors to
    the same port, the operating system doesn’t know the difference so there is no
    new hardware key. Devices with USB serial numbers have one hardware key per physical
    device, without regard to what port the device is attached to.


    A USB device may also have one or more keys for additional enumerators such as
    HID, USBPRINT, and USBSTOR. For example, a UPS back-up device with a HID interface
    can have a key in the Enum\USB branch to name the HidUsb service and a key in
    the Enum\HID branch to name the HidBatt service.


    # The Class Key


    The class key stores information about device setup class and the devices that
    belong to it. The class keys are under this registry key:


    ```

    HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\

    Class

    ```


    The name of a class key is the device setup GUID for the class. This is the same
    as the value stored in the hardware key for devices in the class, under ClassGUID.
    Figure 9-5 shows the class key for the HID class. The class key contains a friendly
    name for the setup class, the class name from the header file that defines the
    GUID, and an index value that specifies the icon to use in Device Manager and
    other windows that display setup information. Applications can retrieve the index
    of the mini-icon for a class by calling SetupDiGetClassBitmapIndex. A vendor-specific
    class installer or co-installer can provide a vendor-specific icon.'
  merge: -1
  img_proc: true
- pgno: 280
  md: '![](img/3955d77b6be34048e3bc722d0b15c2a9_280_0.png)


    Figure 9-5: The class key for the HID class includes a friendly name for the class
    and an index to an icon.


    Optional entries in the class key can affect what users see on device installation.
    If NoInstallClass is present and not equal to zero, users will never need to manually
    install devices in the class. If SilentInstall is present and not equal to zero,
    the Plug and Play manager will install devices in the class without displaying
    dialog boxes or requiring user interaction. If NoDisplayClass is present and not
    equal to zero, the Device Manager doesn''t display devices of the class.


    UpperFilters and LowerFilters entries can specify upper filter and lower filter
    drivers that apply to all devices in the class.


    # The Driver Key


    Under the class key, each device in a class has a driver key, also called a software
    key. In the hardware key for a device instance, the Driver entry names a device
    setup GUID that matches a class key and a device instance number that matches
    a driver subkey under the class key. Figure 9-6 shows the key for a generic HID-class
    device. Table 9-2 lists some of the entries for a driver key.


    The driver key contains the name of the INF file that in turn names the driver
    files for the device.'
  merge: -1
  img_proc: true
