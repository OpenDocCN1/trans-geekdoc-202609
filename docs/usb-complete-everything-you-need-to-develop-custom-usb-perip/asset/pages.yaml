    # Interface Association Descriptor


    An interface association descriptor (IAD) identifies multiple interfaces that
    are associated with a function. In relation to a device and its descriptors, the
    term interface refers to a feature or function a device implements.


    Most device classes specify their functions at the interface level rather than
