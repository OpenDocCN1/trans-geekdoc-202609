- pgno: 68
  md: 'full-speed devices, the low-speed keep-alive keeps low-speed devices from entering
    the Suspend state.


    Of the four special PIDs, one is used only with low-speed devices, one is used
    only with high-speed devices, and two are used when a low- or full-speed device’s
    2.0 hub communicates at high speed with the host.


    The special low-speed PID is PRE, which contains a preamble code that tells hubs
    that the next packet is low speed. On receiving a PRE PID, the hub enables communications
    with any attached low-speed devices. On a low- and full-speed bus, the PRE PID
    precedes all token, data, and handshake packets directed to low-speed devices.
    High-speed buses encode the PRE in the SPLIT packet, rather than sending the PRE
    separately. Low-speed packets sent by a device don’t require a PRE PID.


    The PID used only with high-speed devices is PING. In a bulk or control transfer
    with multiple data packets, before sending the second and any subsequent data
    packets, the host may send a PING to find out if the endpoint is ready to receive
    more data. The device responds with a status code.


    The SPLIT PID identifies a token packet as part of a split transaction, as explained
    later in this chapter. The ERR PID is used only in split transactions. A 2.0 hub
    uses this PID to report an error to the host in a low- or full-speed transaction.
    The ERR and PRE PIDs have the same value but won’t be confused because a hub never
    sends a PRE to the host or an ERR to a device. Also, ERR is used only on high-speed
    segments and PRE is never used on high-speed segments.


    # Packet Sequences


    Every transaction has a token packet. The host is always the source of this packet,
    which sets up the transaction by identifying the packet type, the receiving device
    and endpoint, and the direction of any data the transaction will transfer. For
    low-speed transactions on a full-speed bus, a PRE packet precedes the token packet.
    For split transactions, a SPLIT packet precedes the token packet.


    Depending on the transfer type and whether the host or device has information
    to send, a data packet may follow the token packet. The direction spec-'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'ified in the token packet determines whether the host or device sends the data
    packet.


    In all transfer types except isochronous, the receiver of the data packet (or
    the device if there is no data packet) returns a handshake packet containing a
    code that indicates the success or failure of the transaction. The absence of
    an expected handshake packet indicates a more serious error.


    # Timing Constraints and Guarantees


    The allowed delays between the token, data, and handshake packets of a transaction
    are very short, intended to allow only for cable delays and switching times plus
    a brief time to allow the hardware to prepare a response, such as a status code,
    in response to a received packet.


    A common mistake in writing firmware is to assume that the firmware should wait
    for an interrupt before providing data to send to the host. Instead, before the
    host requests the data, the firmware must copy the data to send into the endpoint’s
    buffer and configure the endpoint to send the data on receiving an IN token packet.
    The interrupt occurs after the transaction completes, to tell the firmware that
    the endpoint’s buffer can store data for the next transaction. If the firmware
    waits for an interrupt before providing the initial data, the interrupt never
    happens and no data is transferred.


    A single transaction can carry an amount of data up to the maximum packet size
    specified for the endpoint. A data packet that is less than the maximum packet
    size is a short packet. A transfer with multiple transactions may take place over
    multiple frames or microframes, which don’t have to be contiguous. For example,
    in a full-speed bulk transfer of 512 bytes, the maximum number of bytes in a single
    transaction is 64, so transferring all of the data requires at least 8 transactions,
    which may occur in one or more (micro)frames.


    # Split Transactions


    A 2.0 hub communicates with a 2.0 host at high speed unless a 1.x hub lies between
    them. When a low- or full-speed device is attached to a 2.0 hub, the hub converts
    between speeds as needed. But speed conversion isn’t the'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'only thing a hub does to manage multiple speeds. High speed is 40 times faster
    than full speed and 320 times faster than low speed. It doesn’t make sense for
    the entire bus to wait while a hub exchanges low- or full-speed data with a device.


    The solution is split transactions. A 2.0 host uses split transactions when communicating
    with a low- or full-speed device on a high-speed bus. What would be a single transaction
    at low or full speed usually requires two types of split transactions: one or
    more start-split transactions to send information to the device and one or more
    complete-split transactions to receive information from the device. The exception
    is isochronous OUT transactions, which don’t use complete-split transactions because
    the device has nothing to send.


    Even though they require more transactions, split transactions make better use
    of bus time because they minimize the amount of time spent waiting for a low-
    or full-speed device to transfer data. The USB 2.0 host controller and the closest
    2.0 hub upstream from the low- or full-speed device are entirely responsible for
    performing split transactions. The device and its firmware don’t have to know
    or care whether the host is using split transactions. The transactions at the
    device are identical whether the host is using split transactions or not. At the
    host, device drivers and application software don’t have to know or care whether
    the host is using split transactions because the protocol is handled at a lower
    level. Chapter 15 has more about how split transactions work.


    # Ensuring that Transfers Are Successful


    USB transfers use handshaking and error-checking to help ensure that data gets
    to its destination as quickly as possible and without errors.


    # Handshaking


    Like other interfaces, USB uses status and control, or handshaking, information
    to help to manage the flow of data. In hardware handshaking, dedicated lines carry
    the handshaking information. An example is the RTS and'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'CTS lines in the RS-232 interface. In software handshaking, the same lines
    that carry the data also carry handshaking codes. An example is the XON and XOFF
    codes transmitted on the data lines in RS-232 links.


    USB uses software handshaking. A code indicates the success or failure of all
    transactions except in isochronous transfers. In addition, in control transfers,
    the Status stage enables a device to report the success or failure of an entire
    transfer.


    Handshaking signals transmit in the handshake or data packet. The defined status
    codes are ACK, NAK, STALL, NYET, and ERR. The absence of an expected handshake
    code indicates a more serious error. In all cases, the expected receiver of the
    handshake uses the information to help decide what to do next. Table 2-4 shows
    the status indicators and where they transmit in each transaction type.


    # ACK


    ACK (acknowledge) indicates that a host or device has received data without error.
    Devices must return ACK in the handshake packets of Setup transactions when the
    token and data packets were received without error. Devices may also return ACK
    in the handshake packets of OUT transactions. The host returns ACK in the handshake
    packets of IN transactions.


    # NAK


    NAK (negative acknowledge) means the device is busy or has no data to return.
    If the host sends data at a time when the device is too busy to accept the data,
    the device returns a NAK in the handshake packet. If the host requests data from
    the device when the device has nothing to send, the device returns a NAK in the
    data packet. In either case, NAK indicates a temporary condition, and the host
    retries later.


    Hosts never send NAK. Isochronous transactions don’t use NAK because they have
    no handshake packet for returning a NAK. If a device or the host doesn’t receive
    transmitted isochronous data, it’s gone.'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'Table 2-4: The location, source, and contents of the handshake signal depend
    on the type of transaction.


    | Transaction type or PING query | Data packet source | Data packet contents |
    Handshake packet source | Handshake packet contents |

    |---|---|---|---|---|

    | Setup | host | data | device | ACK |

    | OUT | host | data | device | ACK, NAK, STALL, NYET (high speed only), ERR (from
    hub in complete split) |

    | IN | device | data, NAK, STALL, ERR (from hub in complete split) | host | ACK
    |

    | PING (high speed only) | none | none | device | ACK, NAK, STALL |


    # STALL


    The STALL handshake can have any of three meanings: unsupported control request,
    control request failed, or endpoint failed.


    When a device receives a control-transfer request that the device doesn’t support,
    the device returns a STALL to the host. The device also returns a STALL if the
    device supports the request but for some reason can’t take the requested action.
    For example, if the host sends a Set_Configuration request that requests the device
    to set its configuration to 2, and the device supports only configuration 1, the
    device returns a STALL. To clear this type of stall, the host just needs to send
    another Setup packet to begin a new control transfer. The USB specification calls
    this type of stall a protocol stall.


    Another use of STALL is to respond when the endpoint’s Halt feature is set, which
    means that the endpoint is unable to send or receive data at all. The USB specification
    calls this type of stall a functional stall.'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'Bulk and interrupt endpoints must support the functional stall. Although control
    endpoints may also support this use of STALL, it''s not recommended. A control
    endpoint in a functional stall must continue to respond normally to other requests
    related to controlling and monitoring the stall condition. And an endpoint that
    is capable of responding to these requests is clearly capable of communicating
    and shouldn''t be stalled. Isochronous transactions don''t use STALL because they
    have no handshake packet for returning the STALL.


    On receiving a functional STALL, the host drops all pending requests to the device
    and doesn''t resume communications until the host has sent a successful request
    to clear the Halt feature on the device. Hosts never send STALL.


    # NYET


    Only high-speed devices use NYET, which stands for *not yet*. High-speed bulk
    and control transfers have a protocol that enables the host to find out before
    sending data if a device is ready to receive the data. At full and low speeds,
    when the host wants to send data in a control, bulk, or interrupt transfer, the
    host sends the token and data packets and receives a reply from the device in
    the handshake packet of the transaction. If the device isn''t ready for the data,
    the device returns a NAK and the host tries again later. This can waste a lot
    of bus time if the data packets are large and the device is often not ready.


    High-speed bulk and control transactions with multiple data packets have a better
    way. After receiving a data packet, a device endpoint can return a NYET handshake,
    which says that the endpoint accepted the data but is not yet ready to receive
    another data packet. When the host thinks the device might be ready, the host
    can send a PING token packet, and the endpoint returns either an ACK to indicate
    the device is ready for the next data packet or NAK or STALL if the device isn''t
    ready. Sending a PING is more efficient than sending the entire data packet only
    to find out the device wasn''t ready and having to resend later. Even after responding
    to a PING or OUT with ACK, an endpoint is allowed to return NAK on receiving the
    data packet that follows but should do so rarely. The host then tries again with
    another PING. The use of PING by the host is optional.'
  merge: -1
  img_proc: true
- pgno: 74
  md: 'A 2.0 hub may also use NYET in complete-split transactions. Hosts and low-
    and full-speed devices never send NYET.


    # ERR


    The ERR handshake is used only by high-speed hubs in complete-split transactions.
    ERR indicates the device didn’t return an expected handshake in the transaction
    the hub is completing with the host.


    # No Response


    Another type of status indication occurs when the host or a device expects to
    receive a handshake but receives nothing. This lack of response can occur if the
    receiver’s error-checking calculation detected an error. On receiving no response,
    the sender knows that it should try again. If if multiple tries fail, the sender
    can take other action. (If the receiver ACKs the data but doesn’t use it, the
    problem is probably in the data-toggle value.)


    # Reporting the Status of Control Transfers


    In addition to reporting the status of transactions, the same ACK, NAK, and STALL
    codes report the success or failure of complete control transfers. An additional
    status code is a zero-length data packet (ZLP), which reports successful completion
    of a control transfer. A transaction with a zero-length data packet is a transaction
    whose Data phase consists of a Data PID and error-checking bits but no data. Table
    2-5 shows the status indicators for control transfers.


    For control Write transfers, where the device receives data in the Data stage,
    the device returns the transfer’s status in the data packet of the Status stage.
    A zero-length data packet means the transfer was successful, a STALL indicates
    that the device can’t complete the transfer, and a NAK indicates that the device
    isn’t ready to complete the transfer. The host returns an ACK in the handshake
    packet of the Status stage to indicate that the host received the response.


    For control Read transfers, where the host receives data in the Data stage, the
    device returns the status of the transfer in the handshake packet of the'
  merge: -1
  img_proc: true
- pgno: 75
  md: 'Table 2-5: Depending on the direction of the Data stage, the status information
    for a control transfer may be in the data or handshake packet of the Status stage.


    | Transfer Type and Direction | Status Stage Direction | Status stage''s data
    packet | Status stage''s handshake packet |

    |---|---|---|---|

    | Control Write (Host sends data to device or no Data stage) | IN | Device sends
    status: zero-length data packet (success), NAK (busy), or STALL (failed) | Host
    returns ACK |

    | Control Read (Device sends data to host) | OUT | Host sends zero-length data
    packet | Device sends status: ACK (success), NAK (busy), or STALL (failed) |


    Status stage. The host normally waits to receive all of the packets in the Data
    stage, then returns a zero-length data packet in the Status stage. The device
