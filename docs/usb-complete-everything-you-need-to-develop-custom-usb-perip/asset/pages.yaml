    value usage, or value, can have any of a range of values. Any report item that
    isn’t a button is a value.


    Windows 98 Gold was the first to include the HID API. Windows 98 SE, Windows 2000,
    and Windows Me support additional HID functions. The API was expanded again for
    Windows XP. The tables in this chapter note the functions that aren’t available
    in all Windows editions.


    # Requesting Information about the HID


    Table 13-1 lists API functions that request information about a HID and its reports.
    HidD_GetPreparsedData retrieves a pointer to a buffer that contains information
    about the HID’s reports. HidP_GetCaps uses the pointer to retrieve a HIDP_CAPS
    structure that specifies what report types a device supports and provides information
    about the type of information in the reports. For example, the structure includes
    the number of HIDP_BUTTON_CAPS structures that have information about a button
    or set of buttons. The application can then use the HidP_GetButtonCaps function
    to retrieve these structures


    The API also includes several functions for retrieving strings. Table 13-2 lists
    these.


    # Sending and Receiving Reports


    Table 13-3 lists functions that applications can use to send and receive reports.


    Windows’ HID driver causes the host controller to request Input reports periodically.
    The driver stores received reports in a buffer. ReadFile retrieves one or more
    reports from the buffer. If the buffer is empty, ReadFile waits for a report to
    arrive. ReadFile thus does not cause the device to send a report but just reads
    reports that the driver has requested.


    WriteFile sends an Output report to the HID. WriteFile uses an interrupt transfer
    if the HID has an interrupt OUT endpoint and the operating system is later than
    Windows 98 Gold. Otherwise, WriteFile uses a control'
