- pgno: 312
  md: "Table 10-1: Applications use these functions to find devices and obtain device\
    \ path names to enable accessing devices.\n\n| API Function | DLL | Purpose |\n\
    |---|---|---|\n| HidD_GetHidGuid | hid | Retrieve the device interface GUID for\
    \ the HID class |\n| SetupDiDestroyDeviceInfoList | setupapi | Free resources\
    \ used by SetupDiGetClassDevs. |\n| SetupDiGetClassDevs | setupapi | Retrieve\
    \ a device information set for the devices in a specified class. |\n| SetupDiGetDeviceInterfaceDetail\
    \ | setupapi | Retrieve a device path name. |\n| SetupDiEnumDeviceInterfaces |\
    \ setupapi | Retrieve information about a device in a device information set.\
    \ |\n\nThe following code shows how to use API functions to find a device and\
    \ obtain its device path name. For complete Visual C++ .NET and Visual Basic .NET\
    \ applications that demonstrate how to use these functions, go to www.Lvr.com.\n\
    \n# Obtaining the Device Interface GUID\n\nAs Chapter 8 explained, for many drivers,\
    \ applications can obtain a device interface GUID from a C header file or Visual-Basic\
    \ declaration provided with the driver. For the HID class, Windows provides an\
    \ API function to obtain the GUID, which is also defined in hidclass.h.\n\n# Visual\
    \ C++\n\nThis is the function's declaration:\n\n```\nVOID\n    HidD_GetHidGuid(\n\
    \        OUT LPGUID HidGuid\n    );\n```\n\nThis is the code to call the function:\n\
    \n```\nHidD_GetHidGuid(&HidGuid);\n```"
  merge: -1
  img_proc: true
- pgno: 313
  md: "# Visual Basic\n\nThe function has no return value, so it’s declared as a Sub:\n\
    \n```\n<DllImport(\"hid.dll\")>\nSub HidD_GetHidGuid _\n    (ByRef HidGuid As\
    \ System.Guid)\nEnd Sub\n```\n\nThis is the code to call the function:\n\n```\n\
    Dim HidGuid As System.Guid\nHidD_GetHidGuid(HidGuid)\n```\n\n# Requesting a Pointer\
    \ to a Device Information Set\n\nThe SetupDiGetClassDevs function can return a\
    \ pointer to an array of structures containing information about all devices in\
    \ the device interface class specified by a GUID.\n\n# Visual C++\n\nThis is the\
    \ function’s declaration:\n\n```\nHDEVINFO\n    SetupDiGetClassDevs(\n       \
    \ IN LPGUID  ClassGuid,  OPTIONAL\n        IN PCTSTR  Enumerator,  OPTIONAL\n\
    \        IN HWND    hwndParent,  OPTIONAL\n        IN DWORD   Flags\n    );\n\
    ```\n\nThis is the code to call the function:\n\n```\nHANDLE DeviceInfoSet;\n\n\
    DeviceInfoSet = SetupDiGetClassDevs\n    (&HidGuid,\n    NULL,\n    NULL,\n  \
    \  DIGCF_PRESENT|DIGCF_INTERFACEDEVICE);\n```"
  merge: -1
  img_proc: true
