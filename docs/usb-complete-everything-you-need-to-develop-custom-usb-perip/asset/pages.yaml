  md: 'The debugging software provided with a development board is typically a monitor
    program that runs on a PC and enables you to control program execution and watch
    the results. Standard features include the ability to step through a program line
    by line, set breakpoints, and view the contents of the chip''s registers and memory.
    You can run the monitor program and a test application at the same time. You can
    see exactly what happens inside the chip when it communicates with your application.


    If you have a development system for your favorite microcontroller family, you
    may be able to use the system for USB developing as well.


    # Boards from Other Sources


    If you''re on a strict budget, inexpensive printed-circuit boards from a variety
    of vendors can serve as an alternative to the development kits offered by chip
    manufacturers. You can also use these boards as the base for one-of-a-kind or
    small-scale projects, saving the time and expense of designing and making a board
    for the controller chip.


    # I/O Boards.


    A typical board contains a USB controller and connector along with a variety of
    I/O pins that you can connect to external circuits of your own design. The EZ-USB
    family is a natural choice for this type of board because its firmware is downloadable
    from the host, so you don''t have to worry about programming hardware. Several
    sources offer boards with EZ-USB chips.


    The USB I2C/IO board from DeVaSys Embedded Systems (Figure 6-1) contains an AN2131
    EZ-USB chip, a connector with 20 bits of I/O, an I²C interface for synchronous
    serial communications, and an asynchronous serial interface. The on-board 24LC128
    is an I²C EEPROM that can store 16 kilobytes of data, including a Vendor ID, Product
    ID, and firmware. The board can load its firmware from EEPROM or from the host
    on attachment or power-up.


    DeVaSys provides the board''s schematic and a free custom device driver and firmware
    that enable applications to open communications and read and write to ports, including
    the I²C port. If you prefer, you can load your own'
