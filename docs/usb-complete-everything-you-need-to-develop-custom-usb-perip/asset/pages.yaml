- pgno: 444
  md: '# Table 14-1: Applications can use these Classic interface functions to communicate
    with devices that use FTDI Chip’s D2XX direct driver. (Sheet 2 of 2)


    | Function | Purpose |

    |---|---|

    | FT_SetRTS* | Set RTS. |

    | FT_SetTimeouts | Set timeouts for reading and writing to the device. |

    | FT_SetUSBParameters | Set the USB maximum transfer size (default = 4096). |

    | FT_Write | Write the specified bytes to the device. |

    | *Not supported or needed by FT245BM (except SetBaudRate in Bit Bang mode). |
    |


    ’232BM can use the D2XX driver even though it has an asynchronous serial interface
    that you might expect would use a COM-port driver.


    # Using Unique IDs


    The most reliable way to be sure Windows assigns the driver you want is to assign
    your own Vendor ID and Product ID or use FTDI Chip’s Vendor ID with a unique Product
    ID that you request from FTDI Chip. Store the IDs in an EEPROM that interfaces
    to the controller and place the IDs in an INF file for the driver you want to
    use. Then Windows will always know what driver to assign. (When assigning the
    driver, Windows will copy the INF file and rename it **oemxx.inf**, where *xx*
    is a unique number, so it won’t matter if other vendors have also edited the INF
    file provided by FTDI Chip.)


    # Cautions When Using the Default IDs


    If the device uses the default Vendor ID and Product ID, Windows may insist on
    selecting the driver for you, and you may not get the result you want, especially
    if your INF file isn’t signed. (See Chapter 9 for more about signed drivers and
    INF files.) To avoid this problem when using the default IDs, during device installation,
    delete, move, or rename any signed INF files that specify the unwanted driver
    for the default IDs and disconnect from the Internet to prevent Windows from downloading
    a driver. You don’t want to require end users to go to this much trouble when
    installing your device, however.'
  merge: -1
  img_proc: true
