    **The AudioControl Interface.** Figure 7-2 shows the descriptors in an AudioControl
    interface. In the AudioControl interface descriptor, bInterfaceClass = 01h to
    identify the interface as audio class and bInterfaceSubclass = 01h to identify
    the subclass as AudioControl.


    Following the AudioControl interface descriptor is a Class-specific AC interface
    descriptor, which consists of a series of descriptors for the AudioControl interface.
    The Class-specific AC Interface Header descriptor contains the total length of
    itself and all of the Terminal and/or Unit descriptors in the interface.


    A Terminal descriptor contains information about an addressable logical object
    that represents a USB endpoint or other interface to the outside world. Every
    IN or OUT isochronous endpoint in an audio interface must have an associated Output
    or Input Terminal with a Terminal descriptor. The audio function receives audio
    information from the host at an Input Terminal and transmits audio information
    to the host at an Output Terminal. Note that the terms Input Terminal and Output
    Terminal are from the perspective of the audio function, while USB endpoints are
    named from the perspective of the host. So an IN endpoint has an associated Output
    Termi-'
