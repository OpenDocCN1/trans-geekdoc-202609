    # Topology


    The topology, or arrangement of connections, on the bus is a tiered star (Figure
    1-1). At the center of each star is a hub. Each point on a star is a device that
    connects to a port on a hub. The number of points on each star can vary, with
    a typical hub having two, four, or seven ports. When there are'
