  md: '# 3


    # A Transfer Type for

    Every Purpose


    This chapter takes a closer look at USB’s four transfer types: control, bulk,
    interrupt, and isochronous. Each transfer type has abilities and limits that make
    the transfers suitable for different purposes. Table 3-1 compares the amount of
    data that each transfer type can move at each of the three speeds.


    # Control Transfers


    Control transfers have two uses. Control transfers carry the requests that are
    defined by the USB specification and used by the host to learn about and configure
    devices. Control transfers can also carry requests defined by a class or vendor
    for any purpose.'
