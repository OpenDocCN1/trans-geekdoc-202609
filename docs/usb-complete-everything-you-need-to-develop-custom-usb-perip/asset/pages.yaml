- pgno: 320
  md: "# Visual Basic\n\nThe Visual-Basic code doesn’t explicitly declare an SP_DEVICE_INTERFACE_DETAIL_DATA\
    \ structure for the Device-InterfaceDetailData parameter. Instead, the code reserves\
    \ a generic buffer, passes a pointer to the buffer, and extracts the device path\
    \ name directly from the buffer. So the application doesn’t use the following\
    \ declaration, but I’ve included it to show what the returned buffer will contain:\n\
    \n```\n<StructLayout(LayoutKind.Sequential)> _\nPublic Structure SP_DEVICE_INTERFACE_DETAIL_DATA\n\
    \    Dim cbSize As Integer\n    Dim DevicePath As String\nEnd Structure\n```\n\
    \nThis is the function’s declaration:\n\n```\n<DllImport(\"setupapi.dll\", CharSet:=CharSet.Auto)>\
    \ _\nFunction SetupDiGetDeviceInterfaceDetail _\n    (ByVal DeviceInfoSet As IntPtr,\
    \ _\n     ByRef DeviceInterfaceData _\n         As SP_DEVICE_INTERFACE_DATA, _\n\
    \     ByVal DeviceInterfaceDetailData As IntPtr, _\n     ByVal DeviceInterfaceDetailDataSize\
    \ As Integer, _\n     ByRef RequiredSize As Integer, _\n     ByVal DeviceInfoData\
    \ As IntPtr) _\n     As Boolean\nEnd Function\n```\n\nThis is the code for the\
    \ first call:\n\n```\nDim BufferSize As Integer\nDim Success As Boolean\n\nSuccess\
    \ = SetupDiGetDeviceInterfaceDetail _\n    (DeviceInfoSet, _\n     MyDeviceInterfaceData,\
    \ _\n     IntPtr.Zero, _\n     0, _\n     BufferSize, _\n     IntPtr.Zero)\n```\n\
    \nAfter calling SetupDiGetDeviceInterfaceDetail, BufferSize contains the value\
    \ to pass in the DeviceInterfaceDetailDataSizebuffer parameter in the"
  merge: -1
  img_proc: true
- pgno: 321
  md: "next call. But before calling the function again, we need to take care of a\
    \ few things.\n\nThe function will return a pointer (DetailDataBuffer) to an SP_DEVICE_INTERFACE_DETAIL_DATA\
    \ structure in unmanaged memory. The Marshal.AllocGlocal method uses the returned\
    \ BufferSize value to reserve memory for the structure:\n\n```\nDim DetailDataBuffer\
    \ As IntPtr\nDetailDataBuffer = Marshal.AllocHGlobal(BufferSize)\n```\n\nThe cbSize\
    \ member of the structure passed in DetailDataBuffer equals four bytes for the\
    \ cbSize integer plus the length of one character for the device path name (which\
    \ is empty when passed to the function). The Marshal.WriteInt32 method copies\
    \ the cbSize value into the first member of DetailDataBuffer:\n\n```\nMarshal.WriteInt32\
    \ _\n    (DetailDataBuffer, _\n    4 + Marshal.SystemDefaultCharSize)\n```\n\n\
    The second call to SetupDiGetDeviceInterfaceDetail passes the DetailDataBuffer\
    \ pointer and sets the DeviceInterfaceDetailDataSize parameter equal to the BufferSize\
    \ value returned previously in RequiredSize:\n\n```\nSuccess = SetupDiGetDeviceInterfaceDetail\
    \ _\n    (deviceInfoSet, _\n    MyDeviceInterfaceData, _\n    DetailDataBuffer,\
    \ _\n    BufferSize, _\n    BufferSize, _\n    IntPtr.Zero)\n```\n\nWhen the function\
    \ returns, DetailDataBuffer points to a structure containing a device path name.\n\
    \n# Extracting the Device Path Name\n\nThe device path name is in the DevicePath\
    \ member of the SP_DEVICE_INTERFACE_DETAIL_DATA structure returned by SetupDiGetDeviceInterfaceDetail."
  merge: -1
  img_proc: true
- pgno: 322
  md: "# Visual C++\n\nThe device path name is in DetailData -> DevicePath.\n\n# Visual\
    \ Basic\n\nThe string containing the device path name is stored beginning at byte\
    \ 5 in DetailDataBuffer. (The first four bytes are the cbSize member.) The pDevicePathName\
    \ variable points to this location:\n\n```\nDim DevicePathName(127) As String\n\
    ```\n\n```\nDim pDevicePathName As IntPtr = _\n    New IntPtr(DetailDataBuffer.ToInt32\
    \ + 4)\n```\n\nThe Marshal.PtrToString method retrieves the string from the buffer:\n\
    \n```\nDevicePathName = _\n    Marshal.PtrToStringAuto(pDevicePathName)\n```\n\
    \nWe’re finished with DetailDataBuffer, so we should free the memory previously\
    \ allocated for it:\n\n```\nMarshal.FreeHGlobal(DetailDataBuffer)\n```\n\n# Closing\
    \ Communications\n\nWhen finished using the DeviceInfoSet returned by SetupDiGetClassDevs,\
    \ the application should call SetupDiDestroyDeviceInfoList.\n\n# Visual C++\n\n\
    This is the function’s declaration:\n\n```\nBOOL SetupDiDestroyDeviceInfoList(\n\
    \    HDEVINFO DeviceInfoSet);\n```\n\nThis is the code to call the function:\n\
    \n```\nSetupDiDestroyDeviceInfoList(DeviceInfoSet);\n```"
  merge: -1
  img_proc: true
