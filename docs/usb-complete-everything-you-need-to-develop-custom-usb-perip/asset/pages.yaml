    | Rank (Hex) | ID from Descriptors | ID from INF file | Trusted Driver? | “Decorated”
    INF section? |

    |---|---|---|---|---|

    | 0000–0FFF | Device | Hardware | yes | Yes. (All trusted drivers have decorated
    INF sections for NT-based OS’s.) |

    | 1000–1FFF | Device | Compatible | yes |  |

    | 2000–2FFF | Compatible | Hardware | yes |  |

    | 3000–3FFF | Compatible | Compatible | yes |  |

    | 8000–8FFF | Device | Hardware | no | yes* |

    | 9000–BFFF | Compatible | Compatible | no | yes* |

    | C000–CFFF | Device | Hardware | no | no |

    | D000–FFFE | Compatible | Compatible | no | no |

    | FFFF | Worst-case match. Used by components such as co-installers |  |  |  |


    \*Considered only by NT-based operating systems (Windows 2000, Windows XP).


    only the Vendor ID and Product ID isn’t always sufficient. If there is no better
    match, Windows XP uses the compatible ID USB\\COMPOSITE, which results in loading
    the USB common class generic parent driver. This driver creates a set of device
    and compatible IDs for each interface, and Windows can then assign a driver to
    each interface. In earlier Windows editions, the bus or hub driver handles this
    task.


    Windows comes with hundreds of INF files, and a new device may come with its own
    INF file. To speed up searching, during device installation, Windows creates a
    PNF (precompiled INF) file and stores it in the same folder as the device’s INF
    file. The PNF file contains much of the same information as the INF file but in
    a format that enables quicker searching.'
