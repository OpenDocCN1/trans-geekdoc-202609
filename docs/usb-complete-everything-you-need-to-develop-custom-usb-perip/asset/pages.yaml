- pgno: 29
  md: '# Beyond the Hype


    All of USB’s advantages mean that it’s a good candidate for use on many peripherals.
    But a single interface can’t handle every task.


    # Interface Limits


    Every interface has limits that make the interface impractical for some applications.
    For USB, limits to be aware of include speed and distance, lack of support for
    peer-to-peer communications, no ability to broadcast, and lack of support in older
    hardware and operating systems.


    # Speed.


    USB is versatile, but it’s not designed to do everything. USB’s high speed makes
    it competitive with the IEEE-1394a (Firewire) interface’s 400 Megabits/sec., but
    IEEE-1394b is faster still, at 3.2 Gigabits/sec.


    # Distance.


    USB was designed as a desktop-expansion bus with the expectation that peripherals
    would be relatively close at hand. A cable segment can be as long as 5 meters.
    Other interfaces, including RS-232, RS-485, IEEE-1394b, and Ethernet, allow much
    longer cables. You can increase the length of a USB link to as much as 30 meters
    by using cables that link five hubs and a device.


    To extend the range beyond 30 meters, an option is to use a USB interface on the
    PC, then convert to RS-485 or another interface for the long-distance cabling
    and peripheral interface.


    # Peer-to-Peer Communications.


    Every USB communication is between a host computer and a peripheral. The host
    is a PC or other computer with host-controller hardware. The peripheral contains
    device-controller hardware. Hosts can’t talk to each other directly, and peripherals
    can’t talk to each other directly. Other interfaces, such as IEEE-1394, allow
    direct peripheral-to-peripheral communications.


    USB provides a partial solution with USB On-The-Go. An On-The-Go device can function
    both as a peripheral and as a limited-capability host that can communicate with
    other devices. Two hosts can communicate with each other via a PC-to-PC network
    bridge cable, which contains two devices that each connect to a different PC and
    pass data between the PCs.'
  merge: -1
  img_proc: true
