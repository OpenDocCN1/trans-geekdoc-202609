- pgno: 436
  md: 'PICMicro 16F877 microcontroller. You can use just about any FT245BM circuit
    based on FTDI Chip’s example schematic and any CPU with a parallel I/O port and
    four additional spare port pins. If you use the LAB-X2 board, switches S1 and
    S2 on the board won’t be available.


    Figure 14-3 shows timing diagrams for reading and writing to the ’245BM. When
    the PC has written a byte to the ’245BM, the chip brings its RXF# output low to
    indicate that a byte is available. To read the byte, the external CPU brings the
    ’245BM’s RD# input low. The ’245BM then places the byte on data pins D0–D7, and
    the external CPU can read the byte, bringing RD# high when the read operation
    is complete. When another byte is available for the external CPU to read, the
    ’245BM brings RXF# low again.


    To write a byte to the PC, the external CPU brings WR high and waits if necessary
    for the ’245BM to bring its TXE# output low to indicate the chip is ready to receive
    a byte. The external CPU then places the byte on data pins D0–D7 and brings WR
    low, causing the ’245BM to copy the byte into its transmit buffer and bring TXE#
    high. The chip sends the byte to the host over the USB port. The external CPU
    brings WR high to prepare for the next transfer. When ready to read another byte,
    the ’245BM brings TXE# low again and the external CPU can write another byte to
    the data lines.


    In Figure 14-2, the data port is Port D on the 16F877. The handshaking signals
    use bits on Port B and Port E. You can use any spare port pins to interface to
    the ’245BM’s data pins and status and control signals. The power connections are
    the same as for the ’232BM.


    # Program Code


    Listing 14-2 is PICBasic Pro code that waits to receive a byte from the host via
    the ’245BM, increments the byte, and sends it back to the host. The firmware checks
    the state of RXF# before attempting to read a byte. Another option would be to
    use a hardware interrupt to cause the CPU to take action when RXF# goes low, indicating
    there is a byte available to be read. The firmware checks the state of TXE# before
    attempting to write a byte.'
  merge: -1
  img_proc: true
- pgno: 437
  md: '# READ A BYTE FROM THE USB HOST:


    RXF# IS LOW WHEN THE FT245BM HAS RECEIVED A BYTE FROM THE HOST.


    THE DEVICE CPU BRINGS RD# LOW TO CAUSE THE FT245BM TO PLACE THE BYTE ON THE DATA
    LINES.


    THE DEVICE CPU READS THE BYTE ON THE DATA LINES AND BRINGS RXE# HIGH AGAIN.


    # WRITE A BYTE TO THE USB HOST:


    TXE# IS LOW WHEN THE FT245BM IS READY TO RECEIVE A BYTE FROM THE DEVICE CPU.


    THE DEVICE CPU WRITES A BYTE TO THE DATA LINES.


    THE DEVICE CPU TOGGLES WR TO CAUSE THE FT245BM TO READ THE BYTE. THE FT245BM THEN
    SENDS THE BYTE TO THE USB HOST.


    Figure 14-3: In a read operation, the device CPU reads a byte from the FT245BM.
    In a write operation, the device CPU writes a byte to the FT245BM.'
  merge: -1
