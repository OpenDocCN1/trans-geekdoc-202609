- pgno: 358
  md: '# Transferring Data


    When enumeration is complete, the host has identified the device interface as
    a HID and has established pipes with the interface''s endpoints and learned what
    report formats to use to send and receive data.


    The host can then request reports using either interrupt IN transfers and/or control
    transfers with Get_Report requests. The device also has the option to support
    receiving reports using interrupt OUT transfers and/or control transfers with
    Set_Report requests.


    If you don’t have example firmware for Get_Report and Set_Report, enumeration
    code can serve as a model. Get_Report is a control Read transfer that behaves
    in a similar way to Get_Descriptor except that the device returns a report instead
    of a descriptor. Set_Report is a control Write transfer. Unfortunately, the only
    standard USB request with a host-to-device Data stage is the rarely supported
    Set_Descriptor, so example code for control Write transfers is harder to find.


    # About the Example Code


    The example code in this chapter is written for the Microchip PIC18F4550 introduced
    in Chapter 6. The code is based on Microchip’s USB Firmware Framework. The Framework
    code is for the PIC18 family of microcontrollers but can give an idea of how to
    structure code for other CPUs. My code is adapted from Microchip’s mouse code
    and implements a generic HID device that exchanges reports in both directions.


    Portions of the code can be useful even if your device isn’t a HID. The control-transfer
    examples can serve as models for responding to other class-specific and vendor-specific
    requests. From the firmware’s point of view, bulk and interrupt transfers are
    identical, so the interrupt-transfer code can serve as a model for any firmware
    that uses bulk or interrupt transfers.


    In the Framework code, a group of system files handles general USB tasks and class-specific
    tasks. These files typically require no changes or only minor changes and additions
    for specific applications. The system files include these:'
  merge: -1
  img_proc: true
- pgno: 359
  md: '# Human Interface Devices: Using Control and Interrupt Transfers


    *usbmmap.c* allocates memory for variables, endpoints, and other buffers used
    in USB communications.


    *usbdru.c* contains functions to detect device attachment and removal, check and
    respond to USB hardware interrupts, enter and exit the Suspend state, and respond
    to bus resets.


    *usbctrltrf.c* contains functions for handling transactions in control transfers.
    The functions decode received Setup packets, manage the sending and receiving
    of data in the Data stage, and manage the sending and receiving of status information
    in the Status stage.


    *usb9.c* contains functions that manage responding to the requests defined in
    Chapter 9 of the USB specification. The functions decode received requests, provide
    pointers to descriptors and other requested data to return, and take requested
    actions such as selecting a configuration or setting an address.


    *hid.c* contains functions that manage tasks that are specific to the HID class.
    The functions decode received Setup data directed to the HID interface, define
    pointers to data to be sent and locations to store received data in control and
    interrupt transfers, and respond to other HID-specific requests such as Get_Idle
    and Set_Idle.


    Additional files handle other tasks:


    *usbdesc.c* contains structures that hold the device''s descriptors, including
    the device descriptor, configuration and subordinate descriptors, string descriptors,
    and report descriptor. This information will of course differ for every device.


    *user_generic_hid.c* contains most of the code that is specific to the generic
    HID application. The functions obtain the data that the device will send in reports
    and use the data received in reports.


    *main.c* initializes the system and executes a loop that checks the bus status
    and calls functions in the *user_generic_hid* file to carry out the device''s
    purpose.


    The sections that follow contain excerpts from this code. The excerpts concentrate
    on the application-specific code used to send and receive reports.'
  merge: -1
  img_proc: true
- pgno: 360
  md: "The complete device firmware and host applications to communicate with the\
    \ device are available from www.Lvr.com.\nSee Chapter 6 for an introduction to\
    \ the ’18F4550’s architecture.\n\n# Sending Reports via Interrupt Transfers\n\n\
    When the HID driver is loaded on the host, the host controller begins sending\
    \ periodic IN token packets to the HID’s interrupt IN endpoint. The endpoint should\
    \ NAK these packets until the HID has an Input report to send. To send data in\
    \ an interrupt transfer, device firmware typically places the data in the endpoint’s\
    \ buffer and configures the endpoint to send the data to the host on receiving\
    \ an IN token packet.\n\nThe code below executes after the host has configured\
    \ the HID. The usbm-map.c file declares hid_report_in as a char array whose length\
    \ equals the endpoint’s wMaxPacketSize:\n\n```\nextern volatile far unsigned char\n\
    \    hid_report_in[HID_INT_IN_EP_SIZE];\n```\n\nThe code initializes the interrupt\
    \ IN endpoint by setting values in the endpoint’s buffer descriptor (HID_BD_IN):\n\
    \n```\n// Set the endpoint’s address register to the address\n// of the hid_report_in\
    \ buffer.\n\nHID_BD_IN.ADR = (byte*)&hid_report_in;\n\n// Set the status register\
    \ bits:\n// _UCPU = the CPU owns the buffer.\n// _DAT1 = a DATA1 data toggle is\
    \ expected next.\n// (Before sending data, call the mUSBBufferReady\n// macro\
    \ to toggle the data toggle.)\n\nHID_BD_IN.Stat._byte = _UCPU|_DAT1;\n```\n\n\
    Listing 11-3 is a function that accepts a pointer to a buffer containing report\
    \ data (*buffer) and the number of bytes to send (len) and makes the data available\
    \ in the endpoint’s buffer."
  merge: -1
  img_proc: true
- pgno: 361
  md: "# Human Interface Devices: Using Control and Interrupt Transfers\n\n```\nvoid\
    \ HIDTxReport(char *buffer, byte len)\n{\n    byte i;\n\n    // len can be no\
    \ larger than the endpoint’s wMaxPacketSize\n    // (HID_INT_IN_EP_SIZE). Trim\
    \ len if necessary\n\n    if(len > HID_INT_IN_EP_SIZE)\n        len = HID_INT_IN_EP_SIZE;\n\
    \n    // Copy data from the passed buffer to the endpoint’s buffer.\n\n    for\
    \ (i = 0; i < len; i++)\n        hid_report_in[i] = buffer[i];\n\n    // To send\
    \ len bytes, set the buffer descriptor’s count\n    // register to len.\n\n  \
    \  HID_BD_IN.Cnt = len;\n\n    // Toggle the data toggle and transfer ownership\
    \ of the\n    // buffer to the SIE, which will send the data on receiving\n  \
    \  // an interrupt IN token packet.\n\n    mUSBBufferReady(HID_BD_IN);\n\n}//end\
    \ HIDTxReport\n```\n\nListing 11-3: The HIDTxReport function provides data to\
