    While the hub is completing the transaction with the device, the host may initiate
    other bus traffic that the device’s hub must handle as well. The two functions
    are handled by separate hardware modules within the hub. When the host thinks
    the hub has had enough time to complete the transaction with the device, the host
    begins a complete-split transaction with the hub.


