  img_proc: true
- pgno: 39
  md: '![](img/3955d77b6be34048e3bc722d0b15c2a9_39_0.png)


    Figure 1-2: There are many possible configurations for connecting USB devices
    to a host PC. These are a few of the options for a host with two ports.'
