- pgno: 292
  md: '# # Using Device Identification Strings


    To identify possible drivers for a device, Windows searches the system’s INF files
    for a device identification string that matches a string created from information
    in the device’s descriptors. There are three categories of device identification
    strings: device IDs, hardware IDs, and compatible IDs.


    # ## Identification Strings Obtained from a Device


    Every USB device has at least one device ID, which the hub driver creates from
    the Vendor ID, Product ID, and revision number in the device descriptor. A device
    ID for a USB device has one of these forms:


    ```

    ```text

    USB\\VID_xxxx&PID_yyyy&REV_zzzz

    USB\\VID_xxxx&PID_yyyy

    ```

    ```


    The values in xxxx, yyyy, and zzzz are four characters each: xxxx is the idVendor
    value, yyyy is the idProduct value, and zzzz is the bcdDevice value. The idVendor
    and idProduct values are hexadecimal values, except for Windows Me, which uses
    decimal, and bcdDevice is in BCD format.


    For example, a device with VID = 0925h, PID = 1234h, and bcdDevice = 0310 has
    this device ID:


    ```

    ```text

    USB\\VID_0925&PID_1234&REV_0310

    ```

    ```


    Devices with multiple interfaces can specify a driver for each interface. In this
    case, the device has multiple device IDs, one for each interface. A device ID
    for an interface has one of these forms:


    ```

    ```text

    USB\\VID_xxxx&PID_yyyy&REV_zzzz&MI_ww

    USB\\VID_xxxx&PID_yyyy&MI_ww

    ```

    ```


    The values in xxxx, yyyy, and zzzz are the same as in the previous device IDs.


    The 2-character value in ww equals bInterfaceNumber in the interface descriptor
    for one of the device’s interfaces. For example, a composite device that functions
    as a mouse and keyboard might have entries in two Models sections, one for the
    keyboard (interface 00) and one for the mouse (interface 01):


    ```

    ```text

    [LAKEVIEW_KEYBOARD]

    %USB\\VID_0925&PID_0801&MI_00.DeviceDesc%=

    HID_Inst,, USB\\VID_0925&PID_0801&MI_00

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 293
  md: '# Matching a Driver to a Device


    ```

    [LAKEVIEW_MOUSE]

    %USB\VID_0925&PID_0801&MI_01.DeviceDesc%=

    HID_Inst,, USB\VID_0925&PID_0801&MI_01

    ```


    A HID-class device whose report descriptor contains more than one top-level collection
    can have a device ID for each collection. A device ID for a collection can have
    any of these forms, where bb indicates the collection number:


    ```

    USB\VID_xxxx&PID_yyyy&REV_zzzz&Colbb

    USB\VID_xxxx&PID_yyyy&Colbb

    USB\VID_xxxx&PID_yyyy&REV_zzz&MI_ww&Colbb

    USB\VID_xxxx&PID_yyyy&MI_ww&Colbb

    ```


    In addition to a device ID, some drivers create one or more compatible ID strings
    for a device. A compatible ID can identify a device by its class code and any
    subclass and protocol codes in the device descriptor. A compatible ID uses one
    of the following forms:


    ```

    USB\CLASS_aa&SUBCLASS_bb&PROT_cc

    USB\CLASS_aa&SUBCLASS_bb

    USB\CLASS_aa

    ```


    The values aa, bb, and cc match values in the device descriptor and are two characters
    each: aa is the bDeviceClass value, bb is the bDeviceSubclass value, and cc is
    the bDeviceProtocol value. The values are expressed in hexadecimal, except for
    Windows Me, which uses decimal.


    For example, the class code for HIDs is 03h, so HID-class devices have the following
    compatible ID:


    ```

    USB\Class_03

