- pgno: 427
  md: '# 14


    # Bulk Transfers

    for Any CPU


    Chapter 6 introduced FTDI Chip''s FT245BM and FT245BM device controllers, which
    enable just about any CPU with a parallel or asynchronous serial interface to
    communicate with a USB host. The chips handle enumeration and other tasks with
    no USB-specific programming required. This chapter presents two example applications
    plus some tips on designing with these controllers.


    # Two Projects


    Both example applications interface to Microchip PICMicro 16F877 microcontrollers.
    The first example uses an FT232BM, which has an asynchronous serial interface.
    The second example uses an FT245BM, which has a parallel interface. The firmware
    is written for microEngineering Labs’ PicBasic Pro Basic compiler, but can be
    adapted to other languages.'
  merge: -1
  img_proc: true
- pgno: 428
  md: 'As you’ll see, writing device firmware and host applications for these chips
    requires very little knowledge of USB. An understanding of USB can help you understand
    the devices’ abilities and limits, however.


    # Asynchronous Serial Interface


    The FT232BM has a USB port and an asynchronous serial interface that can connect
    to an external CPU.


    # The Circuit


    Figure 14-1 shows an example circuit. A DLP Design’s DLP-232M module contains
    the FT232BM chip, an EEPROM for storing configuration data, and a USB connector.
    I built the circuit using microEngineering Labs, Inc.’s LAB-X2 board, which has
    a 40-pin DIP socket for the PICMicro 16F877 microcontroller, a power-supply regulator,
    and a 40-pin header that provides access to the ’877’s port pins. You can use
    just about any FT232BM circuit based on FTDI Chip’s example schematic and any
    CPU with an asynchronous serial port. If you use the LAB-X2 board, remove the
    MAX232 chip from its socket (because the ’877’s serial-port pins connect to the
    ’232BM instead), and switches S1 and S2 on the board won’t be available if you
    use hardware handshaking.


    To send data to the host computer, the ’877’s firmware writes serial data to its
    TX output, which connects to the DLP-232M’s RXD input. This pin in turn connects
    to RXD on the ’232BM. On receiving data at RXD, the ’232BM sends the data out
    its USB port to the host computer.


    On receiving USB data from the host, the ’232BM writes the data to its TXD output,
    which connects to RX on the DLP-232M and to the RX input on the ’877. The microcontroller’s
    firmware reads the data received at RX.


    The circuit has two optional LEDs that flash when the ’232BM is sending data to
    the PC or receiving data from the PC.


    The example circuit includes connections for hardware handshaking. With the ’232BM
    and the ’877 configured to use hardware handshaking, the'
