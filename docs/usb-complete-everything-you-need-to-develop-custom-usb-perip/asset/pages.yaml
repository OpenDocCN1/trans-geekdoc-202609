    (SOF) marker, which is a timing reference that the host sends at 1-millisecond
    intervals at full speed and at 125-microsecond intervals at high speed. This packet
    also contains a frame number that increments and rolls over on reaching the maximum.
    The number indicates the frame count, so the eight microframes within a frame
    all have the same number. An endpoint may synchronize to the Start-of-Frame packet
    or use the frame count as a timing reference. The Start-of-Frame marker also keeps
    devices from entering the low-power Suspend state when there is no other USB traffic.


    Low-speed devices don’t see the SOF packet. Instead, the hub that the device attaches
    to uses a simpler End-of-Packet (EOP) signal called the low-speed keep-alive signal,
