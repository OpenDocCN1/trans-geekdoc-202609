- pgno: 190
  md: '# Architecture


    Both chips are full speed. The FT245BM has a parallel interface and the FT232BM
    has an asynchronous serial interface.


    Table 6-5 shows the functions of the pins on the ’245BM. The parallel interface
    has 8 data lines and four handshaking signals. The names of the handshaking signals
    are from the perspective of the external CPU that interfaces to the chip. The
    RXF# output is low when the CPU can read a byte received from the host. The CPU
    strobes RD# to read the byte. In the other direction, the TXE# output goes low
    when the CPU can write a byte to send to the USB host, and the CPU strobes WR
    to write the byte into the ’245BM’s buffer. The external CPU can use a data bus
    or any spare port pins to access the ’245BM.


    The ’232BM converts between USB and an asynchronous serial interface. Table 6-6
    shows the functions of the pins. The serial interface includes a TXD data output,
    an RXD data input, and pins for standard RS-232 handshaking signals (RTS, CTS,
    DTR, DSR, DCD, and RI). A TXDEN output is high when data is transmitting on TXD.
    This output can interface directly to the transmit-enable input of an RS-485 transceiver,
    eliminating the need to enable the transmitter using firmware and additional hardware.
    The ’232BM functions as a DTE as defined by the EIA/TIA-232 standard. (The RS-232
    ports on PCs are also DTEs.) On a DTE, the TXD, RTS#, and DTR signals are outputs,
    and the RXD, CTS#, and DSR signals are inputs. A device that functions as a DCE
    has complimentary signals. (For example, TXD is an input and RXD is an output.)
    To connect two DTEs to each other, use a null-modem cable that swaps the signal
    pairs so each output connects to its corresponding input.


    To create a USB/RS-232 converter, use a Maxim MAX3245 or similar chip to convert
    between the ’232BM’s 5V logic signals and RS-232 voltages. In a similar way, you
    can interface the ’232BM to an RS-485 transceiver. Chapter 7 has more about using
    the ’232BM to convert devices to USB from these legacy interfaces.


    Both chips also support a Bit Bang mode, where the chip operates as a very basic
    controller without requiring a connection to an external CPU. On the'
