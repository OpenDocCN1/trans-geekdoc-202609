  md: '# The Microsoft OS Descriptor


    Microsoft has defined its own Microsoft OS descriptor for use with devices in
    vendor-defined classes. The descriptor is intended to assist in providing Windows-specific
    data such as icons and registry settings.


    The descriptor consists of a special String descriptor and one or more Microsoft
    OS feature descriptors. The String descriptor must have an index of EEh and contains
    an embedded signature. Windows XP SP1 and later request this string descriptor
    on first attachment. A device that doesn’t support this descriptor should return
    a STALL.


    If a device contains a Microsoft OS String descriptor, Windows requests additional
    Microsoft-specific descriptors. Future editions of the Windows DDK will have more
    documentation about these descriptors.


    # Descriptors in 2.0-compliant Devices


    If you’re upgrading a 1.x-complaint device to 2.0, what changes are required in
    the descriptors? In a dual-speed device, can you detect whether a device is using
    full or high speed by reading its descriptors? This section answers these questions.


    # Making 1.x Descriptors 2.0-compliant


    Table 4-12 lists the descriptor fields whose contents may require changes to enable
    a 1.x device to comply with the USB 2.0 specification. For all except some devices
    that have isochronous endpoints, the one and only required change is this: in
    the device descriptor, the bcdUSB field must be 0200h.


    As Chapter 3 explained, a USB 2.0 device’s default interface(s) must request no
    isochronous bandwidth. And because the default interface is of no use for transferring
    isochronous data, a device that wants to do isochronous transfers must support
    at least one alternate interface setting, and the alternate interface descriptor
    will have at least one subordinate endpoint descriptor. Some 1.x devices meet
    this requirement already.'
