    Before selecting a device configuration that consumes isochronous bandwidth, the
    host controller determines whether the requested bandwidth is available by comparing
    the available unreserved bus bandwidth with the maximum packet size and transfer
    rate of the configuration’s isochronous endpoint(s). A full-speed transfer with
    the maximum 1023 bytes per frame uses 69 percent of the bus’s bandwidth. If two
    full-speed devices want to transfer 1023 bytes per frame, a 1.x host will refuse
    to configure the second device because the data won’t fit in the remaining bandwidth.


    Every USB 2.0 device with isochronous endpoints must have an interface that requests
    no isochronous bandwidth so the host can configure the device even if there is
    no reservable bandwidth available. In addition to this interface and an interface
    that requests the optimum bandwidth for a device, a device can have alternate
    interfaces that have smaller isochronous data packets or use fewer isochronous
    packets per microframe. The device driver can then request to use an interface
    that transfers data at a lower rate when needed. Or the driver can try again later
    in the hope that the bandwidth will be available. After the host configures the
    device, the transfers are guaranteed to have the time they need.


    Although isochronous transfers may send a fixed number of bytes per frame, the
    data doesn’t transfer at a constant number of bits per second. Each transaction
    has overhead and must share the bus with other devices. So the data is actually
    a burst at 12 Megabits/sec. or 480 Megabits/sec. and may occur any time within
    the frame or microframe. To use the data at a constant rate, such as sending the
    data to a speaker, the receiver must convert the received bits to signals that
    span the interval.


