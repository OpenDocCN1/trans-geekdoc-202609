- pgno: 350
  md: 'generic desktop controls include mouse, joystick, and keyboard. Because the
    example’s Usage Page is vendor-defined, all of the Usages in the Usage Page are
    vendor-defined also. In the example, the Usage is 01h.


    The **Collection (Application)** item begins a group of items that together perform
    a single function, such as keyboard or mouse. Each report descriptor must have
    an application collection.


    The Collection contains three reports. Each report has these items:


    +   - A vendor-defined Usage applies to the data in the report.

    +   - A Logical Minimum and Logical Maximum specify the range of values that the
    report can contain.

    +   - The Report Count item indicates how many data items the report contains.
    In the example, each report contains two data items.

    +   - The Report Size item indicates how many bits are in each reported data item.
    In the example, each data item is eight bits.

    +   - The final item specifies whether the report is an Input report (81h), Output
    report (91h), or Feature report (B1h). The bits provided with the item contain
    additional information about the report data.


    The End Collection item closes the Application Collection.


    Chapter 12 has more about report formats.


    # HID-specific Requests


    The HID specification defines six HID-specific requests. Table 11-3 lists the
    requests, and the following pages describe each request in more detail. All HIDs
    must support Get_Report, and boot devices must support Get_Protocol and Set_Protocol.
    The other requests (Set_Report, Get_Idle, and Set_Idle) are optional except that
    a keyboard using the boot protocol must support Set_Idle. If a HID doesn’t have
    an Interrupt OUT endpoint or if the HID is communicating with a 1.0 host such
    as Windows 98 Gold, a HID that wants to receive reports from the host must support
    Set_Report.'
  merge: -1
  img_proc: true
- pgno: 351
  md: '# Human Interface Devices: Using Control and Interrupt Transfers


    Table 11-3: The HID class defines six HID-specific requests.


    | Request Number | Request | Data Source (Data stage) | wValue (high byte, low
    byte) | wIndex | Data Length (bytes) (wLength) | Data Stage Contents | Required?
    |

    |---|---|---|---|---|---|---|---|

    | 01h | Get_ Report | device | report type, report ID | interface | report length
    | report | yes |

    | 02h | Get_ Idle | device | 0, report ID | interface | 1 | idle duration | no
    |

    | 03h | Get_ Protocol | device | 0 | interface | 1 | protocol | required for HIDs
    that support a boot protocol |

    | 09h | Set_ Report | host | report type, report ID | interface | report length
    | report | no |

    | 0Ah | Set_ Idle | no Data stage | idle duration, report ID | interface | – |
    – | no, except for keyboards using the boot protocol |

    | 0Bh | Set_ Protocol | no Data stage | 0, protocol | interface | – | – | required
    for HIDs that support a boot protocol |'
