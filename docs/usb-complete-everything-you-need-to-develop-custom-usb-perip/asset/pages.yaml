- pgno: 475
  md: '# # Managing Power


    A convenient feature of USB is the ability for devices to draw power from the
    bus. Many devices can be entirely bus powered. But drawing power from the bus
    carries the responsibility to live within the limits of available power, including
    entering the low-power Suspend state when required.


    This chapter will help you decide whether or not your design can use bus power.
    And whether your design is bus-powered or self-powered, you’ll find out how to
    ensure that your design follows the USB specification’s requirements for managing
    power.


    # ## Powering Options


    Inside a typical PC is a power supply with amperes to spare. Many hubs have their
    own power supplies as well. Many USB peripherals can take advantage of these existing
    supplies rather than having to provide their own power sources.'
  merge: -1
  img_proc: true
- pgno: 476
  md: 'The ability to draw power from the same cable that carries data to and from
    the PC has several advantages. Users no longer need an electrical outlet near
    the peripheral, and a peripheral can be physically smaller and lighter in weight
    without an internal power supply. A peripheral without a power supply costs less
    to manufacture and thus can sell for less. A bus-powered device can save energy
    because power supplies in PCs use efficient switching regulators rather than the
    cheap linear regulators in the “wall bugs” that many peripherals provide instead
    of an internal supply. (Most self-powered hubs use wall bugs, however.)


    Before USB, most peripherals used the PC’s RS-232 serial and printer ports. Neither
    of these includes a power-supply line. The ability to use bus power was so compelling
    that the designers of some peripherals that connect to these ports used schemes
    that borrow the small amount of current available from unused data or control
    outputs in the interface. With a super-efficient regulator, you can get a few
    milliamperes from a serial or parallel port to power a device. Another approach
    used by some peripherals was to kludge onto the keyboard connector, which has
    access to the PC’s power supply. With USB, you don’t have to resort to these tricks.


    # Voltages


    The nominal voltage between the VBUS and GND wires in a USB cable is 5V, but the
    actual value can be a little more or quite a bit less. A device that uses bus
    power must be able to handle the variations.


    These are the minimum and maximum voltages allowed at a hub’s downstream ports:


    | Hub Type | Minimum Voltage | Maximum Voltage |

    |---|---|---|

    | High Power | 4.75 | 5.25 |

    | Low Power | 4.4 | 5.25 |


    To allow for cable and other losses, devices should be able to function with supply
    voltages a few tenths of a volt less than the minimum available at the'
  merge: -1
  img_proc: true
- pgno: 477
  md: 'hub’s connector. In addition, transient conditions can cause the voltage at
    a low-power hub’s port to drop briefly to as low as 4.07V.


    If components in a device need a higher voltage, the device can contain a step-up
    switching regulator. Most USB controller chips require a +5V or +3.3V supply.
    Components that use 3.3V are handy because the device can use an inexpensive low-dropout
    linear regulator to obtain 3.3V from VBUS.


    # Which Peripherals Can Use Bus Power?


    Not every peripheral can take advantage of bus power. Although the bus can provide
    generous amounts of current in comparison to other interfaces, the current available
    from a PC’s power supply or an external hub is limited. Figure 16-1’s chart will
    help you decide whether a device can use bus power.


    Advances in semiconductor technology have reduced the power required by many electronic
    devices. This is good news for designers of bus-powered devices. Thanks to CMOS
    processes used in chip manufacturing, lower supply voltages for components, and
    power-conserving modes in CPUs, you can do a lot with 100 milliamperes.


    A device that requires up to 100 milliamperes can be bus powered from any host
    or hub. A device that requires up to 500 milliamperes can use bus power when attached
    to a self-powered hub or any host except some battery-powered hosts. No device
    should draw more than 100 milliamperes until the host has configured the device.
    And all devices must limit their power consumption when the bus is suspended.


    Of course, some devices need to function when they’re not attached to a host.
    A digital camera is an example. These devices need their own supplies. Self power
    can use batteries or power from a wall socket. To save battery power without requiring
    users to plug in a supply, a device can be designed to be bus-powered when connected
    to the bus and self-powered otherwise. Some battery-powered devices can recharge
    when attached to the bus.


    A device in the Suspend state can draw very little current from the bus, so some
    devices will need their own supplies to enable operating when the bus is suspended.'
  merge: -1
  img_proc: true
- pgno: 478
  md: '![](img/3955d77b6be34048e3bc722d0b15c2a9_478_0.png)


    Figure 16-1: Not every device can use bus power alone. A device that uses bus
    power must also meet the USB specification’s limits for Suspend current.


    # Power Needs


    The USB specification defines a low-power device as one that draws up to 100 milliamperes
    from the bus, and a high-power device as one that draws up to 500 milliamperes
    from the bus. A self-powered device can draw up to 100 milliamperes from the bus
    and as much power as is available from the device’s supply.'
  merge: -1
  img_proc: true
- pgno: 479
  md: 'A high-power device must be able to enumerate at low power. On power-up, any
    device can draw up to 100 milliamperes from the bus until the device is configured
    during enumeration. After retrieving a configuration descriptor, the host examines
    the amount of current requested in bMaxPower, and if the current is available,
    the host sends a Set_Configuration request specifying the configuration. The device
    can then draw up to bMaxPower from the bus. In reality, hosts and hubs are likely
    to allocate either 100 or 500 milliamperes to a device rather than the precise
    amount requested in bMaxPower.


    A self-powered device may also draw up to 100 milliamperes from the bus at any
    time that the bus isn''t suspended. This capability enables the device''s USB
    interface to function when the device''s power supply is off so the host can detect
    and enumerate the device. Otherwise, if a device''s pull-up is bus-powered but
    the rest of the interface is self-powered, the host will detect the device but
    won''t be able to communicate with it.


    These limits are absolute maximums, not averages. And remember that the bus''s
    power-supply voltage can be as high as 5.25V, which may result in greater current
    consumption.


    A device must never provide upstream power. Even the pull-up resistor must remain
    unpowered until VBUS is present. So self-powered devices must have a connection
    to VBUS to detect its presence even if the device never uses bus power.


    # Informing the Host


    During enumeration, the host learns whether the device is self powered or bus
    powered and the maximum current the device will draw from the bus. As Chapter
    4 explained, each device''s configuration descriptor holds a bMaxPower value that
    specifies the maximum bus current the device requires. All hubs have over-current
    protection that prevents excessive current from flowing to a device.


    If you connect a high-power device to a low-power hub, Windows displays a message
    informing you that the hub doesn''t have enough power available and offering assistance.
    If the bus has a low-power device connected to a'
  merge: -1
  img_proc: true
- pgno: 480
  md: '![](img/3955d77b6be34048e3bc722d0b15c2a9_480_0.png)


    Figure 16-2: Windows warns users when they connect a high-power device to a low-power
    hub, and helps them find an alternate connection.


    high-power port, Windows will recommend swapping the device with the high-power
    device (Figure 16-2).


    A device can support both bus-powered and self-powered options, using self power
    when available and bus power (possibly with limited abilities) otherwise. When
    the power source changes, the host must re-enumerate the device. To enable forcing
    a re-enumeration, power to the device''s bus pull-up resistor may be switched
    off briefly, then back on, to simulate a disconnect and re-connect. If the device
    doesn''t have this ability, users will need to remove the device from the bus
    before attaching or removing the power supply. The device reports its use of bus
    or self power in response to a Get_Status (Device) request from the host.'
  merge: -1
