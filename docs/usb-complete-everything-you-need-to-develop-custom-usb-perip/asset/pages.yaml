    # Syntax


    The contents of an INF file must follow a few syntax rules.


    +   - The information is arranged in sections, with each section containing one
    or more items. The section name is in square brackets [ ]. Some of the sections
    (Version, Manufacturer) are standard sections that every INF file has. Other sections
    match values specified in other sections. For example, if the Manufacturer section
    designates the manufacturer as Lakeview, the INF file will also have a [Lakeview]
    section. The sections'
  merge: -1
