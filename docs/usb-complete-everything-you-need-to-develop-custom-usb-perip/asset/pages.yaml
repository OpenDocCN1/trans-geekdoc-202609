- pgno: 156
  md: '# Get_Interface


    **Purpose:** For devices with interfaces that have multiple, mutually exclusive
    settings for an interface, the host requests the currently active interface setting.


    **Request Number (bRequest):** 0Ah


    **Source of Data:** device


    **Data Length (wLength):** 1


    **Contents of wValue field:** 0


    **Contents of wIndex field:** interface number


    **Contents of data packet in the Data stage:** the current setting


    **Supported states:** Configured


    **Behavior on error:** If the interface doesn’t exist, the device returns a STALL.


    **Comments:** The interface number in the wIndex field of this request refers
    to the bInterface field in an interface descriptor. This value distinguishes an
    interface from other interfaces that are active at the same time. The setting
    in the Data field in this request refers to the value in the bAlternateInterface
    field in the interface descriptor. This value identifies which of two or more
    alternate (mutually exclusive) settings an interface is currently using. Each
    setting has an interface descriptor and optional endpoint descriptors. Many devices
    support only one interface setting. See also Set_Interface.'
