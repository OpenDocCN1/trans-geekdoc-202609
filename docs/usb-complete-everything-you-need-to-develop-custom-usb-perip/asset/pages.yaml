    A ReNum register bit determines whether the EZ-USB or 8051 core responds to requests
    at Endpoint 0. On power-up, ReNum is zero and the EZ-USB core controls Endpoint
    0. When ReNum is set to one, the 8051 core controls Endpoint 0.


