- pgno: 38
  md: 'multiple hubs in series, you can think of them as connecting in a tier, or
    series, one above the next.


    The tiered star describes only the physical connections. In programming, all that
    matters is the logical connection. To communicate, the host and device don’t need
    to know or care how many hubs the communication passes through.


    Only one device at a time can communicate with a host controller. To increase
    the available bandwidth for USB devices, a PC can have multiple host controllers.


    Figure 1-2 shows a few possible configurations for a PC with two USB connectors.
    Some devices are compound devices that contain both a peripheral and a hub. You
    can cascade up to five external hubs in series, up to a total of 127 peripherals
    and hubs including the root hub. However, it may be impractical to have this many
    devices communicating with a single host controller.


    In some cases, especially with compound devices where the hubs are hidden inside
    the peripherals, the peripherals may appear to be using a daisy-chain type of
    connection, where each new peripheral hooks to the last one in a chain. But the
    USB’s topology is more flexible and complicated than a daisy chain. Each peripheral
    connects to a hub that manages communications with the host, and the peripherals
    and hubs aren’t limited to connecting in a single chain.


    # Defining Terms


    In the universe of USB, several everyday words have specific meanings. Along with
    *host*, defined earlier as the computer that controls the interface, three other
    such terms are *function*, *hub*, and *device*. It’s also important to understand
    the concept of a USB port and how it differs from other ports such as RS-232.


    # Function


    The USB specification defines a function as a device that provides a capability
    to the host. Examples of functions are a mouse, a set of speakers, or a'
