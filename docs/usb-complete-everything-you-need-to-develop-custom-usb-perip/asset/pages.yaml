- pgno: 412
  md: 'should equal the OutputReportByteLength property of the HIDP_CAPS structure
    retrieved with HidP_GetCaps. This value equals the report size in bytes plus one
    byte for the Report ID, which is the first byte in the buffer. The buffer must
    be large enough to hold the Report ID and report data.


    The lpOverlapped parameter is unused in this example, but WriteFile can use overlapped
    I/O as described in the following section on ReadFile. Overlapped I/O can prevent
    the application’s thread from hanging if the HID’s interrupt OUT endpoint NAKs
    endlessly. In normal operation, the endpoint should accept received data with
    little delay.


    On success, the function returns True with NumberOfBytesWritten containing the
    number of bytes the function successfully wrote to the HID.


    If the interface supports only the default Report ID of 0, the Report ID doesn’t
    transmit on the bus, but the Report ID must always be present in the buffer the
    application passes to WriteFile.


    When sending a report to an interrupt endpoint, WriteFile returns on success or
    an error. If the device NAKs the report data, WriteFile waits until the endpoint
    ACKs the data. When sending a report via the control endpoint, WriteFile returns
    on success, an error, or a timeout (if the endpoint continues to NAK the report
    data).


    Probably the most common error returned by WriteFile in HID communications is
    CRC Error. This error indicates that the host controller attempted to send the
    report, but the device didn’t respond as expected. In spite of the error message,
    the problem isn’t likely to be due to an error detected in a CRC calculation.
    The error is more likely to be due to a firmware problem that is keeping the endpoint
    from accepting the report data. If WriteFile doesn’t return at all, the interrupt
    OUT endpoint probably has not been configured to accept the report data.


