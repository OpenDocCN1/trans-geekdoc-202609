- pgno: 40
  md: 'data-acquisition unit. A single physical device can contain more than one function.


    # Hub


    A hub has one upstream connector for communicating with the host and one or more
    downstream connectors or internal connections to embedded devices. Each downstream
    connector or internal connection represents a USB port.


    A 1.x hub repeats received USB traffic in both directions, manages power, and
    sends and responds to status and control messages. A 2.0 hub does all of this
    and also supports high speed, converting as needed between speeds.


    # Device


    The USB specification’s definition of a device is a function or a hub, except
    for the special case of the compound device, which contains a hub and one or more
    functions. The host treats a compound device in much the same way as if the hub
    and its functions were separate physical devices. Every device on the bus has
    a unique address, except again for a compound device, whose hub and functions
    each have unique addresses.


    A composite device is a multi-function device with multiple, independent interfaces.
    The interfaces are defined by interface descriptors stored in the device. A composite
    device has one address on the bus but each interface has a different function
    and specifies its own device driver on the host. For example, a composite device
    could have one interface for an audio device and another interface for a control
    panel. Some Microsoft documentation uses the term composite device to refer to
    any device whose function is defined by its interface descriptor, rather than
    its device descriptor, whether or not there is more than one active interface.


    # Port


    In a general sense, a computer port is an addressable location that is available
    for attaching additional circuits. Usually the circuits terminate at a connector
    that enables attaching a cable to a peripheral. Some peripheral circuits are hard-wired
    to a port. Software can monitor and control the port circuits'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'by reading and writing to the port’s address. Computer memory also consists
    of addressable locations, but the CPU typically accesses memory with different
    machine instructions than are used for accessing ports.


    USB ports differ from many other ports because all of the ports on a bus share
    a single path to the host and aren’t directly addressable. With the RS-232 interface,
    each port is on the PC and independent from the others. If you have two RS-232
    ports, each has its own data path, and each cable carries its own data and no
    one else’s. The two ports can send and receive data at the same time.


    With USB, each host controller manages a single bus, or data path. Each connector
    on a bus represents a USB port, but unlike RS-232, all devices share the bus’s
    bandwidth. So even though a USB host controller can communicate with multiple
    ports, each with its own connector and cable, one data path serves all. Only one
    device or the host may transmit at a time. A single computer can have multiple
    USB host controllers, however, each with its own bus. Other interfaces where multiple
    devices can share a data path include IEEE-1394, SCSI, and Ethernet.


    Another difference with USB is that a bus can have ports on hubs that are external
    to the host controller’s PC.


    # Division of Labor


    The host and its devices each have defined responsibilities. The host bears most
    of the burden of managing communications, but a device must have the intelligence
    to respond to communications and other bus events from the host and the hub the
    device attaches to.


    # The Host’s Duties


    To communicate with USB devices, a computer needs hardware and software support
    that enable the computer to function as a USB host. The hardware consists of a
    USB host controller and a root hub with one or more USB ports. The software support
    is an operating system that provides a mechanism for drivers to communicate with
    the USB hardware.'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'Just about any recent PC will have a USB host controller and two or more USB-port
    connectors. Many PCs have multiple host controllers. If a computer doesn’t have
    USB support built into its motherboard, you can add a host controller on an expansion
    card that plugs into a slot on the PCI bus. For portable computers, USB controllers
    on PC cards are available.


    The host is in charge of the bus. The host has to know what devices are on the
    bus and the capabilities of each device. The host must also do its best to ensure
    that all devices on the bus can send and receive data as needed. A bus may have
    many devices, each with different requirements, and all wanting to transfer data
    at the same time. The host’s job is not trivial.


    Fortunately, the host-controller hardware and the host-controller drivers in Windows
    do much of the work of managing the bus. Each device attached to the host must
    also have a device driver that enables applications to communicate with the device.
    Some peripherals can use device drivers included with Windows. Other devices use
    drivers provided by the device manufacturer. Various system-level software components
    manage communications between the device driver and the host-controller and root-hub
    hardware.


    Applications don’t have to worry about the USB-specific details of communicating
    with devices. All the application has to do is send and receive data using standard
    operating-system functions that are accessible from just about all programming
    languages. Often the application doesn’t have to know or care whether the device
    uses USB or another interface.


    The host performs the tasks below. The descriptions are in general terms. Later
    chapters have more specifics.


    # Detect Devices


    On power-up, the hubs make the host aware of all attached USB devices. In a process
    called enumeration, the host assigns an address and requests additional information
    from each device. After power-up, whenever a device is removed or attached, the
    host learns of the event and enumerates any newly attached device and removes
    any detached device from its list of devices available to applications.'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# Manage Data Flow


    The host manages the flow of data on the bus. Multiple peripherals may want to
    transfer data at the same time. The host controller divides the available time
    into segments called frames and microframes and gives each transmission a portion
    of a frame or microframe.


    Transfers that must occur at specific rate are guaranteed to have the amount of
    time they need in each frame. During enumeration, a device’s driver requests the
    bandwidth it will need for any transfers that must have guaranteed timing. If
    the bandwidth isn’t available, the host doesn’t allow communications to begin.
    The driver must then request a smaller portion of the bandwidth or wait until
    the requested bandwidth is available. Transfers that have no guaranteed timing
    use the remaining portion of the frames and must wait if the bus is busy.


    # Error Checking


    When transferring data, the host adds error-checking bits. On receiving data,
    the device performs calculations on the data and compares the results with the
    received error-checking bits. If the results don’t match, the device doesn’t acknowledge
    receiving the data and the host knows that it should retransmit. USB also supports
    one transfer type that doesn’t allow re-transmitting, in the interest of maintaining
    a constant transfer rate. In a similar way, the host error-checks the data received
    from devices.


    The host may receive other indications that a device can’t send or receive data.
    The host can then inform the device’s driver of the problem, and the driver can
    notify the application so it can take appropriate action.


    # Provide Power


    In addition to its two signal wires, a USB cable has +5V and ground wires. Some
    devices draw all of their power from these wires. The host provides power to all
    devices on power-up or attachment, and works with the devices to conserve power
    when possible. A high-power, bus-powered device can draw up to 500 milliamperes.
    The ports on a battery-powered host or hub'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'may support only low-power devices, which are limited to 100 milliamperes.
    A device may also have its own power supply.


    # Exchange Data with Peripherals


    All of the above tasks support the host’s main job, which is to exchange data
    with peripherals. In some cases, a device driver requests the host to attempt
    to send or receive data at defined intervals, while in others the host communicates
    only when an application or other software component requests a transfer. The
    device driver reports any problems to the appropriate application.


    # The Peripheral’s Duties


    In many ways, the peripheral’s duties are a mirror image of the host’s. When the
    host initiates communications, the peripheral must respond. But peripherals also
    have duties that are unique. A peripheral can’t begin USB communications on its
    own. Instead, the peripheral must wait and respond to a communication from the
    host. (An exception is the remote wakeup feature, which enables a peripheral to
    request communications from the host.)


    The USB controller in the peripheral handles many of the device’s responsibilities
    in hardware. The amount of support required by device firmware varies with the
    chip.


    The peripheral must perform all of the tasks described below. The descriptions
    are in general terms. Later chapters have more specifics.


    # Detect Communications Directed to the Chip


    Each device monitors the device address contained in each communication on the
    bus. If the address doesn’t match the device’s stored address, the device ignores
    the communication. If the address matches, the device stores the data in its receive
    buffer and triggers an interrupt to indicate that data has arrived. In almost
    all chips, these functions are built into the hardware and require no support
    in code. The firmware doesn’t have to take action or make decisions until the
    chip has detected a communication containing the device’s address.'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# Respond to Standard Requests


    On power-up, or when the device attaches to a powered system, a device must respond
    to standard requests sent by the host during enumeration. The host may also send
    requests any time after enumeration completes.


    All devices must respond to these requests, which query the capabilities and status
    of the device or request the device to take other action. On receiving a request,
    the device places data or status information in a transmit buffer to send to the
    host. For some requests, such as selecting a configuration, the device takes other
    action in addition to responding with information.


    The USB specification defines eleven requests, and a class or vendor may define
    additional requests. A device doesn’t have to carry out every request, however;
    the device just has to respond to the request in an understandable way. For example,
    when the host requests a configuration that the device doesn’t support, the device
    responds with a code that indicates that the configuration isn’t supported.


    # Error Check


    Like the host, a device adds error-checking bits to the data it sends. On receiving
    data that includes error-checking bits, the device does the error-checking calculations.
    The device’s response or lack of response tells the host whether to re-transmit.
    These functions are typically built into the controller’s hardware and don’t need
    to be programmed. When appropriate, the device also detects the acknowledgement
    the host returns on receiving data from the device.


    # Manage Power


    A device may be bus-powered or have its own power supply. For devices that use
    bus power, when there is no bus activity, the device must limit its use of bus
    current. When the host enters a low-power state, all communications on the bus
    cease, including the periodic timing markers the host normally sends. On detecting
    the absence of bus activity for three milliseconds, a device must enter the Suspend
    state and limit the current drawn from the'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'bus. While in the Suspend state, the device must continue to monitor the bus
    and exit the Suspend state when bus activity resumes.


    Devices that don’t support the remote-wakeup feature should consume no more than
    500 microamperes from the bus in the Suspend state. If a device supports the remote-wakeup
    feature and the host has enabled the feature, the limit is 2.5 milliamperes. These
    are average values over 1 second; the peak current can be greater.


    # Exchange Data with the Host


    All of the above tasks support the main job of the device’s USB port, which is
    to exchange data with the host. After being configured, the device must respond
    to communications that may contain data and may require the device to return data
    or status information. The device’s capabilities, the host’s device driver, and
    the applications that use the device together determine the type of communications
    and when they occur.


    For most transfers where the host sends data to the device, the device must respond
    to each transfer attempt by sending a code that indicates whether the device accepted
    the data or was too busy to handle it. For most transfers where the device sends
    data to the host, the device must respond to each attempt by returning data or
    a code indicating there was no data to send or the device was busy. Typically,
    the hardware responds automatically according to settings made previously in firmware.
    Some transfers don’t use acknowledgements and the sender assumes the receiver
    has received all transmitted data.


    The controller chip’s hardware handles the details of formatting the data for
    the bus. The formatting includes adding error-checking bits to data to transmit,
    checking for errors in received data, and sending and receiving the individual
    bits on the bus.


    Of course, the device must also do anything else it’s responsible for. For example,
    a mouse must be ready to detect movement and button clicks, a data-acquisition
    unit has to read the data from its sensors, and a printer must translate received
    data into images on paper.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# ## What about Speed?


    A device controller may support one or more bus speeds. Virtually all hubs support
    low- and full-speed devices. The exception is a hub in a compound device whose
    functions use a single speed. A low- or full-speed peripheral can connect to any
    USB hub. Users don’t have to know whether a device is low or full speed because
    there are no user settings or configurations for different speeds.


    High-speed peripherals are likely to be dual-speed devices that also function
    at full speed. A 1.x host or hub doesn’t support high speed because high speed
    didn’t exist when the 1.x specifications were written. To ensure that high-speed
    devices don’t confuse 1.x hosts and hubs, all high-speed devices must at least
    respond to standard enumeration requests at full speed. Any host can thus identify
    any attached device.


    Other than responding to bus reset and standard requests at full speed, a high-speed
    device doesn’t have to function at full speed. But because adding support for
    full speed is easy to do and is required to pass the USB IF’s compliance tests,
    most high-speed devices also function at full speed.


    The actual rate of data transfer between a peripheral and host is less than the
    bus speed and isn’t always predictable. Some of the transmitted bits are used
    for identifying, synchronizing, and error-checking, and the data rate also depends
    on the type of transfer and how busy the bus is.


    For time-sensitive data, USB supports transfer types that have a guaranteed rate
    or guaranteed maximum latency. Isochronous transfers have a guaranteed rate, where
    the host can request a specific number of bytes to transfer to or from a peripheral
    at defined intervals. The intervals can be as often as every millisecond at full
    speed or every 125 microseconds at high speed. Isochronous transfers have no error
    correcting, however. Interrupt transfers have error correcting and guaranteed
    maximum latency, which means that a precise rate isn’t guaranteed, but the time
    between transfer attempts will be no greater than a specified period. At low speed,
    the requested maximum interval can range from 10 to 255 milliseconds. At full
    speed, the range is 1 to 255 milliseconds. At high speed, the range is 125 microseconds
    to 4.096 seconds.'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'Because the bus is shared, there’s no guarantee that a particular rate or maximum
    latency will be available to a device. If the bus is too busy to allow a requested
    rate or maximum latency, the host refuses to complete the configuration process
    that enables the host to attempt the transfers. To take full advantage of reserved
    bandwidth, the device driver and application software or device firmware must
    ensure that data is available to send when the host controller is ready to initiate
    the transfer. The receiver of the data must also be ready to accept the data when
    it arrives.


    At full and high speeds, the fastest transfers on an otherwise idle bus are bulk
    transfers, with a theoretical maximum of 1.216 Megabytes/sec. at full speed and
    53.248 Megabytes/sec. at high speed. The host controller may limit a single bulk
    transfer to a slower rate, however. The transfers with the most guaranteed bandwidth
    are high-speed interrupt and isochronous transfers at 24.576 Megabytes/second.


    Although the low-speed bus speed is 1.5 Megabits/sec., the fastest guaranteed
    delivery for the data in a single transfer is 8 bytes every 10 milliseconds, or
    just 800 bytes/sec.


    # Developing a Device


    Designing a USB product for PCs involves both getting the peripheral up and running
    and developing or obtaining PC software needed to communicate with the peripheral.


    # Elements in the Link


    A USB peripheral needs all of the following:


    +   - A controller chip with a USB interface.

    +   - Code in the peripheral to carry out the USB communications.

    +   - Whatever hardware and code the peripheral needs to carry out its other functions
    (processing data, reading inputs, writing to outputs).

    +   - A host that supports USB.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '+   - Device-driver software on the host to enable applications to communicate
    with the peripheral.

    +   - If the peripheral isn’t a standard type supported by the operating system,
    the host must have application software to enable users to access the peripheral.
    For standard peripheral types such as a mouse, keyboard, or disk drive, you don’t
    need custom application software, though you may want to write a test application.


    # Tools for Developing


    To develop a USB peripheral, you need the following tools:


    +   - An assembler or compiler to create the device firmware (the code that runs
    inside the device’s controller chip).

    +   - A device programmer or development kit that enables you to store the assembled
    or compiled code in the controller’s program memory.

    +   - A programming language and development environment on the host for writing
    and debugging the host software. The host software may include a device driver
    or filter driver and/or application code. To write a device driver, you’ll need
    Microsoft’s Windows Driver Development Kit (DDK).

    +   - Also recommended are a monitor program for debugging the device firmware
    and a protocol analyzer to enable viewing USB traffic.


    # Steps in Developing a Project


    For a project of any size, you’ll want to create the project in modules and get
    each piece working before moving on to the next. In writing the firmware, you
    can begin by writing just enough code to enable Windows to detect and enumerate
    the device. When that code is working, you can move on to exchanging small blocks
    of data with applications. From there you can add specific code for your application.
    The steps in project development include initial decisions, enumerating, and exchanging
    data.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# Initial Decisions


    Before you begin the developing, you need to gather data and make some decisions:


    +   1. Specify the requirements of your device. For the USB interface, how much
    data does it need to transfer, and how fast? Do you need error correcting? How
    much power will the device draw? What else does the device need to do?

    +   2. From your requirements, decide whether the PC will communicate with the
    peripheral using Windows'' built-in drivers, a generic device driver from another
    source, or a custom driver.

    +   3. Select a controller chip that matches your requirements.


    # Enumerating


    Here''s what you need to do to get Windows to enumerate your device:


    +   1. Write the code the controller chip needs to be enumerated by its host.
    The details vary with the chip, but every chip must be able send a series of descriptors
    to the host. The descriptors are data structures that describe the device''s USB
    capabilities and how they''ll be used. The chip must have program code or hardware
    that decodes and responds to the requests that the host sends and other events
    that occur when the host enumerates the device. Chip vendors generally provide
    example code that you can modify. A few controllers can enumerate with no user
    code required.

    +   2. Identify or create a device driver and INF (information) file so that Windows
    can identify the device and assign a driver. The INF file is a text file that
    names the driver the device will use on the host computer. If your device fits
    a class supported by Windows, you may be able to use an INF file included with
    Windows.

    +   3. If necessary, design and build a circuit to enable testing the chip and
    your firmware. In many cases, you can use a development board available from the
    chip''s manufacturer.'
  merge: -1
  img_proc: true
- pgno: 51
  md: '+   4. Load the code into the device and plug the device into the host’s bus.
    Windows should enumerate the device, adding it to the Control Panel and identifying
    it correctly.

    +   5. Debug and repeat as needed!


    # Exchanging Data


    When the device enumerates successfully, you can add components and code to enable
    the device to carry out its intended function. If needed, write application code
    to communicate with and test the device. When the code is debugged, you’re ready
    to program the code into the chip and test on your final hardware.


    But before you begin, it’s useful to know a little more about how the host enumerates
    and transfers data with devices, so you can make the right choices about controller
    chips and drivers. This is the purpose of the following chapters.'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# Inside USB Transfers


    This and the next three chapters are a tutorial on USB transfers. This chapter
    has essentials that apply to all transfers. The following chapters cover the four
    transfer types supported by USB, the enumeration process, and the standard requests
    used in control transfers.


    You don’t need to know every bit of this information to get a project up and running,
    but understanding something about how transfers work can help in deciding which
    transfer types to use, writing device firmware, and debugging.


    The information in these chapters is dense. If you don’t have a background in
    USB, you won’t absorb it all in one reading. You should, however, get a feel for
    how USB works, and will know where to look later when you need to check the details.


    The ultimate authority on the USB interface is the specification document, *Universal
    Serial Bus Specification*, available on the USB-IF’s Web site. By design, the
    specification omits information and tips that are unique to any operating system
    or controller chip. This type of information is essential'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'when you’re designing a product for the real world, so I include this information
    where relevant.


    # Transfer Basics


    You can divide USB communications into two categories: communications used in
    enumerating the device and communications used by the applications that carry
    out the device’s purpose. During enumeration, the host learns about the device
    and prepares it for exchanging data. Application communications occur when the
    host exchanges data that performs the functions the device is designed for. For
    example, for a keyboard, the application communications are the sending of keypress
    data to the host to tell an application to display a character or perform another
    action.


    # Enumeration Communications


    During enumeration, the device’s firmware responds to a series of standard requests
    from the host. The device must identify each request, return requested information,
    and take other actions specified by the requests.


    On PCs, Windows performs the enumeration, so there’s no user programming involved.
    However, to complete the enumeration, on first attachment, Windows must locate
    an INF file that identifies the file name and location of the device’s driver.
    If the required files are available and the firmware functions correctly, the
    enumeration process is generally invisible to users. Chapter 9 has more details
    about device drivers and INF files.


    # Application Communications


    After the host has exchanged enumeration information with the device and a device
    driver has been assigned and loaded, the application communications can begin.
    At the host, applications can use standard Windows API functions or other software
    components to read and write to the device. At the device, transferring data typically
    requires either placing data to send in the USB controller’s transmit buffer or
    retrieving received data from the receive buffer, and on completing a transfer,
    ensuring that the device is ready'
