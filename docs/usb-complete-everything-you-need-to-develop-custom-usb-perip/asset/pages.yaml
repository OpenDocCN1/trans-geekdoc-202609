    and before enumeration, the EZ-USB core attempts to read bytes from a serial EEPROM
    on the chip’s I²C interface. The result, along with the state of the chip’s EA
    input, tell the core what to do next: use the default mode, load firmware from
    the host, load firmware from EEPROM, or boot from code memory on the external
