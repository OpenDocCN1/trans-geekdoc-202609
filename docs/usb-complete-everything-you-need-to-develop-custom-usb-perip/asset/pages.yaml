- pgno: 330
  md: "This is the code to call the function:\n\n```\n```vb\nDim DevBroadcastDeviceInterface\
    \ _\n    As DEV_BROADCAST_DEVICEINTERFACE = _\n        New DEV_BROADCAST_DEVICEINTERFACE()\n\
    Dim DevBroadcastDeviceInterfaceBuffer As IntPtr\nDim DeviceNotificationHandle\
    \ As IntPtr\nDim Size As Integer\nFriend frmMy As frmMain\n```\n```\n\nThe Marshal.SizeOf\
    \ method retrieves the size of the DEV_BROADCAST_DEVICEINTERFACE structure, which\
    \ is then stored in the structure’s dbcc_size member:\n\n```\n```vb\nSize = Marshal.SizeOf(DevBroadcastDeviceInterface)\n\
    \nDevBroadcastDeviceInterface.dbcc_size = Size\nDevBroadcastDeviceInterface.dbcc_devicetype\
