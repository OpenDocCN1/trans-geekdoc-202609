- pgno: 257
  md: 'In kernel mode, the code has unrestricted access to system resources, including
    the ability to execute memory-management instructions and control access to I/O
    ports. A kernel-mode driver can permit or deny an application access to a device.
    For example, a joystick driver can allow any application to use a device, or the
    driver can allow an application to reserve the device for exclusive use. Other
    abilities that Windows reserves for kernel-mode drivers include DMA transfers
    and responding to hardware interrupts. On x86 processors, kernel mode corresponds
    to the CPU’s Ring 0 mode.


    Applications communicate with client drivers using Windows API functions or other
    components that call API functions internally but shield application programmers
    from the details. The Windows WIN32 subsystem manages communications between applications
    and client drivers. To communicate with a USB device, an application typically
    doesn’t have to know anything about the USB protocol, or even if a device uses
    USB at all.


    Drivers communicate with each other using structures called I/O request packets
    (IRPs). Windows defines a set of IRPs that drivers can use. Each IRP requests
    a single input or output action. A client driver for a USB device uses IRPs to
    communicate with the bus drivers that handle USB communications. The bus drivers
    are included with Windows and require no programming by applications programmers
    or device-driver writers.


    # # WDM Drivers


    USB device drivers for Windows are kernel-mode drivers that must conform to the
    Windows Driver Model defined by Microsoft for use under Windows 98 and later.
    These drivers are known as WDM drivers and have the extension .sys. (Other driver
    types may also use the .sys extension.)


    Application programmers have a choice of programming languages, including Visual
    Basic, Delphi, and C and its derivatives. But to write a driver for a USB device,
    you need a tool that is capable of compiling a WDM driver. The Windows DDK includes
    a C compiler for this purpose. An exception is driver toolkits that provide a
    generic driver and either require no program-'
  merge: -1
  img_proc: true
- pgno: 258
  md: 'ming at all or permit you to use other compilers to customize a generic driver
    with a user-mode component.


    # Layered Drivers


    In the layered driver model used in USB communications, each layer handles a piece
    of the communication process. Dividing communications into layers is efficient
    because devices that have tasks in common can use the same driver for those tasks.
    For example, all kinds of devices may use USB, so it makes sense to have one set
    of drivers to handle the USB-specific tasks that are common to all. Including
    these drivers with Windows means that device vendors don’t have to provide drivers.
    The alternative would be to have each device driver handle communicating directly
    with the USB hardware, with much duplication of effort.


    Figure 8-2 shows the layers involved with USB communications under Windows XP.


    # Client Drivers


    A client driver can consist of one or more files. The main client driver can be
    a class driver provided with Windows or a vendor-provided driver. The client driver
    manages communications that are specific to a device or a class of devices. A
    class driver may also communicate with a miniclass driver that manages communications
    with a subset of devices in a class. For example, the HID USB miniclass driver
    manages USB-specific communications with HID-class devices that have USB interfaces.
    Other HID miniclass drivers could manage bus-specific communications with HIDs
    that have other hardware interfaces.


    A client driver or miniclass driver may also have one or more upper and lower
    filter drivers (Figure 8-3). An upper-level filter driver can monitor and modify
    communications between applications and a client driver. A lower-level filter
    driver can monitor and modify communications between a client driver and the bus
    drivers.'
  merge: -1
  img_proc: true
- pgno: 259
  md: '# How the Host Communicates


    ![](img/3955d77b6be34048e3bc722d0b15c2a9_259_0.png)


    Figure 8-2: USB communications under Windows XP involve the USB bus driver stack
    and one or more client drivers.


    For some composite devices, Windows XP loads a USB common-class generic parent
    driver between the bus drivers and the client drivers for the device’s interfaces.
    The generic parent driver handles synchronization, Plug-and-Play, and power-management
    functions for the device as a whole and manages communications between the bus
    drivers and the client drivers for the composite device’s interfaces.'
  merge: -1
  img_proc: true
- pgno: 260
  md: '![](img/3955d77b6be34048e3bc722d0b15c2a9_260_0.png)


    Figure 8-3: A client driver can have one or more filter drivers that monitor or
    modify communications with devices.


    # USB Drivers


    Under Windows XP, the USB bus drivers consist of the host-controller driver, one
    or more miniport drivers, and the hub driver. The host-controller driver, sometimes
    called the port driver, manages tasks that are common to all host controllers.
    The host controller driver consists of a port driver (usbport.sys) and one or
    more miniport drivers that each manage communications with one of the three host-controller
    types. The hub driver manages communications with the system’s hubs. In Windows
    XP, the hub driver is usbh hub.sys.


    The bus drivers are included with Windows, and application and device-driver writers
    don’t have to know the details about how they work.'
  merge: -1
  img_proc: true
- pgno: 261
  md: 'Perhaps because of this, Microsoft provides little documentation for these
    drivers. If you want to know more about how low-level communications work, one
    source of information is the source code and other documentation from the Linux
    USB Project.


    # Host Controller Types


    There are three types of host controllers. Two support low- and full-speed communications
    and one supports high-speed communications. The low- and full-speed controller
    types are the Open Host Controller Interface (OHCI) and the Universal Host Controller
    Interface (UHCI). High-speed host controllers implement the Enhanced Host Controller
    Interface (EHCI). The USB-IF’s Web site has links to the specifications.


    Windows’ Device Manager enables you to view information about the host controllers
    in a PC. To view the driver type, right-click the host controller name, select
    Properties, then Driver and Driver Details. One of the drivers should have *ohci*,
    *uhci*, or *ehci* in the name. Chapter 9 has more about using the Device Manager.


    # OHCI and UHCI Differences


    In Windows XP, controllers that conform to the OHCI standard use the driver *usbohci.sys*,
    and controllers that conform to the UHCI standard use the driver *usbehci.sys*.
    In other Windows editions, the driver names can vary but will contain *ohci* or
    *uhci*. Both drivers provide a way for the USB hardware to communicate with the
    bus-class driver. The two drivers take different approaches to implementing the
    host-controller’s functions. UHCI places more of the communications burden on
    software and allows using of simpler, cheaper hardware. OHCI places more of the
    burden on the hardware and allows simpler software control. UHCI was developed
    by Intel and OHCI was developed by Compaq, Microsoft, and National Semiconductor.


    The differences should be transparent to driver developers and application programmers.
    Both controllers comply fully with the USB specification. Their performance can
    differ, however. Developers shouldn’t assume their device works fine based on
    tests with one host-controller type.'
  merge: -1
  img_proc: true
- pgno: 262
  md: 'An OHCI controller is capable of scheduling more than one stage of a control
    transfer in a single frame, while a UHCI controller always schedules each stage
    in a different frame. For bulk endpoints with a maximum packet size less than
    64 bytes, a UHCI driver attempts no more than one transaction per frame, while
    an OHCI driver may schedule additional transactions in a frame. An OHCI controller
    will poll an interrupt endpoint at least once every 32 milliseconds, even if the
    endpoint descriptor requests a maximum latency of 255 milliseconds, while UHCI
    controllers can, but don’t have to, support less-frequent polling.


    Developers who use UHCI hosts are sometimes surprised when their devices fail
    when connected to an OHCI host, usually because the device isn’t expecting to
    see multiple transaction attempts per frame for a single transfer. Every device
    should work with both controller types. Test your device on both!


    # Supporting All Speeds


    An EHCI controller handles high-speed communications only. The EHCI specification
    says that a host that supports EHCI must also support low and full speeds except
    for the unusual situation where every port has a permanently attached high-speed
    device. To support low and full speeds, the host must have a companion OHCI or
    UHCI host controller or a USB 2.0-compliant hub, which performs the function of
    a host controller for low- and full-speed devices. Just about every PC with an
    EHCI controller has a companion OHCI or UHCI controller. An EHCI controller and
    a companion OHCI or UHCI controller can share a bus.


    Users and application programmers don’t have to know or care which host controller
    is communicating with a device, though Windows will warn if the system has high-speed-capable
    ports and a user attaches a high-speed-capable device to a 1.x hub. The driver
    for EHCI controllers is *usbehci.sys*.'
  merge: -1
  img_proc: true
- pgno: 263
  md: '# Communication Flow


    One way to better understand what happens during a USB transfer is to look at
    an example. The following are the steps in a USB transfer with a data-acquisition
    device that uses a vendor-specific client device driver.


    # Preliminary Requirements


    Before an application can communicate with the device, several things must happen.
    When a device is attached, Windows manages enumeration, as described in Chapter
    4. To identify which driver to use on first enumeration, Windows compares the
    retrieved descriptors with the information in the system''s INF files. Chapter
    9 has more about INF files. When a device supports multiple configurations, the
    driver selects a configuration. The application that will access the device can
    then obtain a handle that identifies the device and enables communications with
    it.


    # Initiating Data Transfers


    To read data from a data-acquisition device, a user might click a button in a
    data-acquisition application. Or a user might select an option that causes the
    application to request a reading once per minute. Or periodic data acquisitions
    might start automatically when the device''s driver is loaded or when the user
    runs the application.


    # The Application’s Role


    Windows includes API functions that enable applications to communicate with client
    drivers. Applications written in Visual Basic, C/C++/C#, Delphi, and other languages
    can call API functions. The available functions vary with the driver, but applications
    typically can open communications with CreateFile, exchange data using a combination
    of ReadFile/ReadFileEx, WriteFile/WriteFileEx, and DeviceIoControl, and close
    communications with CloseHandle.


    To make programming simpler and safer, many languages support alternate ways to
    access devices of various types. Microsoft''s .NET platform includes classes and
    methods that eliminate the need to call many API functions directly. Instead,
    applications communicate via intermediate layers with a'
  merge: -1
  img_proc: true
- pgno: 264
  md: 'Common Language Runtime (CLR) component that in turn calls the API functions.
    For example, in Visual Basic .NET, the PrintDocument class includes methods that
    enable applications to send text and images to a printer.


    Communications with any device may require calling API functions at times, however.
    For example, .NET doesn’t provide methods for detecting device attachment and
    removal via WM_DEVICECHANGE messages.


    Each call to an API function includes the request, other required information
    such as the data to write or amount of data to read, and a handle for accessing
    the device. Microsoft’s Platform Software Development Kit (SDK) documents the
    functions.


    Although the names suggest that the functions are used only with files, ReadFile
    and WriteFile (as well as ReadFileEx and WriteFileEx) can transfer data to and
    from any driver that supports handle-based operations. The data being read or
    data to be written is stored in a buffer specified by the function call. A call
    to ReadFile doesn’t always cause the driver to retrieve data from a device. The
    function may instead return data that a driver has already requested and stored
    in a buffer. The details vary with the driver.


    DeviceIoControl is another way to transfer data to and from buffers. Included
    in each DeviceIoControl request is a control code that identifies a specific request.
    Unlike ReadFile and WriteFile, a single DeviceIoControl call can transfer data
    in both directions. The driver specifies what data, if any, to pass in each direction
    for each control code. Some control codes are commands that don’t need to pass
    additional data.


    Windows drivers define control codes used by drives and other common devices.
    For example, IOCTL_STORAGE_CHECK_VERIFY determines if media is present and readable
    on removable media and IOCTL_STORAGE_GET_MEDIA_TYPES returns the types of media
    supported by a drive.


    A vendor-specific driver can also define control codes. Because the codes are
    sent only to a specific driver, it doesn’t matter if other drivers use the same
    codes. For example, Cypress Semiconductor’s general-purpose driver'
  merge: -1
  img_proc: true
- pgno: 265
  md: 'CyUsb.sys defines a series of DeviceIoControl codes for transferring data,
    configuring a device, and requesting status and configuration information.


    A driver may also define additional functions that applications can use. For example,
    the HID driver defines the functions Hid_GetFeature and HidD_SetFeature for retrieving
    and sending Feature reports. These functions use DeviceIoControl internally, but
    expose driver-specific functions for application programmers.


    # The Client Driver’s Role


    When an application calls an API function that reads or writes to a USB device,
    Windows passes the call to the appropriate client driver. The driver passes the
    request on in a format the USB bus-class driver can understand.


    As mentioned earlier, drivers communicate with each other using IRPs. For USB
    communications, the IRPs contain structures called USB Request Blocks (URBs),
    which enable a driver to configure devices and transfer data. For example, a driver
    requests a descriptor by submitting an IRP that contains this URB:


    ```

    URB_FUNCTION_GET_DESCRIPTOR_FROM_DEVICE

    ```


    The Windows DDK documents the URBs.


    A client driver requests a transfer by creating an URB and submitting it in an
    IRP to a lower-level driver. The bus and host-controller drivers handle the details
    of scheduling transactions on the bus. For interrupt and isochronous transfers,
    if there is no outstanding IRP for an endpoint when its scheduled time comes up,
    the host controller skips the transaction.


    For transfers that require multiple transactions, the client driver submits a
    single IRP for the entire transfer. All of the transfer’s transactions are then
    scheduled without requiring further communications with the client driver.


    If you’re using an existing client driver (rather than writing your own), you
    need to understand how to access the driver’s application-level interface, but
    you don’t have to concern yourself with IRPs and URBs. If you’re writing a client
    driver, you need to provide the IRPs that communicate with the system’s USB drivers.'
  merge: -1
  img_proc: true
- pgno: 266
  md: '# The Hub Driver’s Role


    The USB hub driver, also called the bus driver, is the device driver for the hubs
    on the bus. The bus driver requires no programming by device developers.


    # The Host-controller Driver’s Role


    The host-controller driver passes data provided by the client driver to the host-controller
    hardware, which in turn connects to the bus. The host-controller driver requires
    no programming by device developers.


    # The Device’s Role


    Data that leaves the host’s port may pass through additional hubs. Eventually
    the data reaches the hub that connects to the device, and the hub passes the data
    on to the device. The device recognizes its address, reads the incoming data,
    and takes appropriate action.


    # The Response


    Most communications require a response, which may include data sent in response
    to the request or a packet with a status code. This information travels back to
    the host in reverse order: through the device’s hub, onto the bus, and to the
    PC’s hardware and software. A client driver may pass a response on to an application,
    which may display the result or take other action.


    # Ending Communications


    When communications are complete, an application can use the API function CloseHandle
    to free system resources.


    # More Examples


    Communications with other USB devices follow a similar path, but there can be
    differences in how the transfer initiates and in how the client driver handles
    communications.


    Other examples of a user initiating a transfer are clicking on a USB drive’s icon
    to view a disk’s folders or clicking Print in an application to send a file'
  merge: -1
  img_proc: true
- pgno: 267
  md: 'to a USB printer. In each of these cases, no data transfers until the application
    requests a communication and the device driver fills a buffer with data to send
    or makes a buffer available for received data.


    A driver can also cause the host to continuously request data from a device whether
    or not an application has requested it. For example, a keyboard driver causes
    the host to request keypress data at frequent intervals because there is no way
    to predict when a user will press a key.


    The host also sends requests to enumerate devices on system power-up or device
    attachment. The device’s hub causes the host to initiate these requests when the
    hub notifies the host of the presence of a device. A suspended device can use
    USB’s remote-wakeup feature to initiate a transfer by signaling its hub, and in
    turn the host, to request resuming communications.


    # # Creating a Custom Driver


    Creating a WDM driver is not a trivial task. Writing a driver requires expertise
    in C programming and a fair amount of knowledge about how Windows communicates
    with hardware and applications. However, several products can help to simplify
    and speed up the process.


    # ## Writing a Driver from Scratch


    The minimum requirement for writing a device driver from scratch is the Windows
    Driver Development Kit (DDK), which includes what you need to create a driver:
    a C compiler, a linker, build utilities, and documentation. Also included is example
    source code for filter drivers and drivers that request bulk and isochronous transfers.
    The example drivers are a useful starting point for developing a custom driver.


    How to write a USB driver from the ground up is a much bigger topic than this
    book has room for. An excellent book in this topic is *Programming the Microsoft
    Windows Driver Model* by Walter Oney.'
  merge: -1
  img_proc: true
