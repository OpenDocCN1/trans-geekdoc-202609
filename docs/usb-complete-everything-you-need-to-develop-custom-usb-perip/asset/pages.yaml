    The other two device states are Attached and Suspend.


    **Attached state.** If the hub isn’t providing power to a device’s VBUS line,
    the device is in the Attached state. The absence of power may occur if the hub
    has detected an over-current condition or if the host requests the hub to remove
    power from the port. With no power on VBUS, the host and device can’t communicate,
    so from their perspective, the situation is the same as when the device isn’t
    attached at all.


    **Suspend State.** A device enters the Suspend state after detecting no bus activity,
    including Start-of-Frame markers, for at least 3 milliseconds. In the Suspend
    state, the device should limit its use of bus power. Both configured and unconfigured
    devices must support this state. Chapter 16 has more about the Suspend state.


    # Enumerating a Hub


    Hubs are also USB devices, and the host enumerates a newly attached hub in exactly
    the same way as other devices. If the hub has devices attached, the host enumerates
    each of these after the hub informs the host of their presence.'
