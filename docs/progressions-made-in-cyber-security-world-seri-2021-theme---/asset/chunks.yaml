    both proactive and reactive routing methodologies were applied in `PDORP`.


    **Jianhua Huang, Danwei Ruan and Weiqiang Meng [[[[4](#08_ch3.xhtml#r3_4)]\]**
    explain `ASGRP` is a low-energy multi-hop routing protocol for WSNs based on annulus
    sector grid clustering. In a wireless sensor network, the suggested protocol enhances
    the way clusters are formed. The main concept is to divide the network area into
    annulus sector grids, with the `BS` as the circular region’s centre point. Each
    annular sector grid’s nodes are clustered into a cluster. The angle between the
    boundary where the `BS` is located and the line from the nodes to the `BS` is
    used to create an annulus sector grid. We also designed an inter-level multi-hop
    routing strategy to boost data transmission efficiency between the `BS` and cluster
    head nodes. The suggested routing method uniformizes energy use and minimises
    transmission energy consumption. Multi-hop `EEBCDA`, `EEMRP`, and `CAMP`, as well
    as `ASGRP`, achieve more consistent energy usage, greatly extend network lifetime,
    and have superior scalability in networks with varying numbers of nodes and sizes.

    '
  trans: '

    WSNs（无线传感器网络）是物联网（IoT）的核心组件，它利用 `IoT` 设备监控环境并向用户提供有用的数据。家居自动化、森林监测、医疗系统、精准农业和智慧城市发展都是今天
    `IoT` 应用的示例。在监测区域，`IoT` 设备或传感器感应如压力、湿度、温度等各种物理因素，并通过单跳或多跳通信将这些有用信息传输到基站（BS）。在用于
    `IoT` 的 WSN 中，传感器节点受到能量限制。


    聚类过程中的若干问题（例如能量洞和网络分段）严重缩短了网络寿命，并随后导致了遭受网络威胁的可能性。在这种情况下，产生了保护传感器网络免受各种网络威胁的需要。这些威胁可能会损害网络上的单个节点，也可能损害整个传感器网络。聚类头（CH）附近的传感器节点中继的数据包比远处的传感器节点多，导致聚类机制中靠近
    `CH` 的传感器节点过早死亡。在这种情况下，远处的传感器节点有足够的能量进行数据传输，但由于缺乏网络结构，它们无法将数据包传输到 `CH` 和 `BS`，这往往会导致能量洞问题。由于能量洞问题，网络被划分为许多不同的部分。将网络划分为分区因此导致了网络安全威胁，从而网络风险的复杂性日益增加。由于缺乏适当的通信链路，某些部分无法与基站通信。


    加密和解密是加密系统定义的两种数据转换。为了生成密文，需要对明文（即要传输的数据）进行加密。即使用加密密钥进行加密的数据。解密密钥用于将密文转换为明文（即原始数据）。对称加密被定义为加密和解密密钥相同，或者可以相互推导出的加密。


    其中一个密钥（称为私钥）保持私密，而另一个密钥（称为公钥）则向公众公开。公钥对通信进行加密，只能用私钥进行解密。因此，任何拥有公钥的人都无法解密加密消息，从而确保了通信的安全。本文采用了最著名的公钥算法
    `RSA`（以其创建者 Rivest、Shamir 和 Adleman 命名）[[[8]\]。


    部署的节点通常是固定的，且传统数据收集算法中的汇点位置通常也是固定的。由于中继消息的高开销，靠近静态汇点的传感器节点比远离汇点的节点消耗更多能量。由于这个问题，靠近静态汇点的传感器节点死亡速度远快于其他节点，缩短了网络寿命
    [[[1]\]]。而且，这种担忧最终增加了遭受网络威胁的可能性。


    异构节点的通信和数据处理能力远高于普通节点。然而，异构节点价格昂贵，因此研究如何平衡能量消耗并延长网络寿命至关重要 [[[2]\]]。


    数据冗余跟踪网络中的每次传输，并有助于防止拒绝服务攻击。认证、风险评估和数据安全是保护数字内容的应用层安全需求，这对于确保环境安全非常重要。访问数据和信息需要进行外部认证。


    本文的其余部分结构如下：Section II 综述了支持物联网的无线传感器网络相关工作、网络安全以及网络威胁的演变。Section III 解释了问题陈述。Section
    IV 推导了建议的工作和算法细节。Section V 解释了仿真环境和性能指标细节。结果与讨论在 Section VI 中描述。Section VII 给出了论文的结论。


    ![图 1 WSN 中的物联网](img/page24_1.jpg)


    **图 1 WSN 中的物联网**


    ## II. 相关工作


    **Chuan Zhu, Kangning Quan, Guangjie Han 和 Joel J.P. Rodrigues [[[1]\]** 解释了基于移动汇点提供了一种高可性的预测数据收集策略。传感器节点根据时间同步确定移动汇点的位置，从而减少了能量消耗。当网络使用高可用技术时，即使部分汇点失效也能继续收集数据。此外，通过改变汇点的轨迹，可以平衡区域节点的能量消耗。然而，当区域点出现问题时，上传到汇点的数据受阻。


    **Chunlin Li, Jingpan Bai, Jinguang Gu, Xin Yan 和 Youlong Luo [[[2]\]** 解释了为了平衡能量并延长网络寿命，引入了一种无线传感器网络聚类路由方法。该方法考虑了异构节点和聚类头。首先，建立了一个异构节点的优化布局模型。其次，提出了一种无线传感器网络聚类路由方法，该方法结合了异构路由算法与
    LEACH-C 聚类头技术。最后，通过大量测试评估了所提路由方法的性能。该路由算法可以显著延长网络的寿命和稳定性。


    **Gurbinder Singh Brar, Shalli Ra, Vinay Chopra, Rahul Malhotra, Houbing Song
    和 Syed Hassan Ahmed [[[3]\]** 解释了一种基于混合优化的 PEGASIS-DSR 优化路由协议，它结合了主动和响应式路由协议的缓存和定向传输概念。我们建议算法的仿真结果表明，在不牺牲能量效率的情况下，降低了端到端传输延迟和比特率。为了获得快速且无损的路径，在
    PDORP 中应用了主动和响应式路由方法。


    **Jianhua Huang, Danwei Ruan 和 Weiqiang Meng [[[4]\]** 解释了 ASGRP 是一种基于扇形网格聚类的低能耗多跳路由协议。在无线传感器网络中，建议的方法改进了类的形成方式。其核心概念是将网络区域划分为扇形网格，以
    BS 为圆形区域的中心。每个扇形网格的节点被聚类成簇。利用 BS 所在边界与节点到 BS 连线之间的角度创建一个扇形网格。我们还设计了一种跨级多跳路由策略，以提高
    BS 与聚类头之间的数据传输效率。

    '
