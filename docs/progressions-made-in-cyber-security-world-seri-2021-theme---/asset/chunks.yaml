    When the mobile sink receives a reply message from the CH, it allots a separate
    time slot to each responded CH. Every CH that communicates with the mobile sink
    is given their own time window. The CH can send its reply only in the assigned
    time slot. A proper scheduling is been performed among the CHs in the queue. Mobile
    sinks broadcast a schedule message in communication range 2R. The scheduling message
    contains the individual CH data uploading schedule.


