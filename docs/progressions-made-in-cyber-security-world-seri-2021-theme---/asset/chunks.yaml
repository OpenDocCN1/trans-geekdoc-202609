- raw: 'For IoT-enabled wireless sensor networks, a memetic algorithm with mobile
    sink-based data gathering strategy is used to improve network performance. The
    proposed method contains a novel clustering strategy in which the memetic algorithm
    with Powell’s conjugate gradient mechanism is used to perform CH selection and
    cluster building. It significantly minimises cluster creation message overhead.
    The memetic algorithm with the Powells conjugate gradient mechanism, on the other
    hand, finds the appropriate number of CHs to minimise data transmission energy
    loss. In the proposed approach, the mobile sink chooses the best data gathering
    channel to collect data from several CHs, resulting in a significant reduction
    in end-to-end delay. The RSA algorithm uses encrypted bits with a public key that
    has a major impact on decryption time and cryptosystem strength. This eventually
    reduces the possibility of cyber threats or risks in the network. We have shown
    a variety of simulation results to assess the suggested scheme’s performance.
    It has been shown that the proposed algorithm outperforms in terms of throughput,
    network lifetime, energy consumption, packet delivery ratio, packet lost and throughput.
    As cyber risks continue to grow in sophistication, the proposed method outperforms
    well than the existing methods in terms of network performance and network security.


