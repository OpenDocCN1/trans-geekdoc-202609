    # 前言


    SERI-2021 取得了成功，这离不开我们宝贵的客座嘉宾的支持，他们在各个会议中引导讨论朝着正确的方向，向观众分享了他们在该领域受崇的价值知识和见解。我们举办的各种会议，例如“Quad：网络安全能力”、“安全教育的国家干预与计划”、“Cyber
    First：这一代和下一代”、“Crypto：释放可能性”等，不仅关注了现状，还定义了网络安全领域的未来前景。会议期间还举办了一场有趣的竞赛，由网络安全领域的顶尖学者评判论文展示，吸引了大量参赛，并最终有少数作品脱颖而出。本书收了排名前三的论文。希望你会喜欢浏览该领域的新干措施。


    # 基于行为的云环境中恶意内部人员检测


    ## 摘要


    内部威胁是组织泄露敏感信息的最刺激性威胁之一。恶意内部人员的主要目标是通过向竞争组织泄露敏感数据来造成经济和声誉损失。因此，检测组织内部的内部人员具有重要意义。检测恶意内部人员的方法之一是分析行为。本文提出了使用行为分析检测恶意活动的方法。


    **关键词：** 内部威胁检测、行为分析、恶意内部人员。


    ## I. 引言


    在快速发展的的世界中，所有业务组织和企业部门都建议并通过互联网来增强业务。云计算是一个为其互联网提供按需自服务资源的框架。组织面临的最具挑战性的安全威胁是恶意内部人员或试图获取机密信息的授权员工。最近的报告显示，每年有
    53% 的组织和 42% 的美国联邦机构遭受内部威胁的影响。与内部威胁相关的活动可能是故意的，例如信息系统破坏、知识产权盗窃和机密信息泄露；也可能是无意的，例如粗率地使用计算资源。


    本文旨在通过组织内部员工的日志行为来探索 US-CERT 数据。全文分为四个部分。第二节列出了关于恶意内部人员检测方法的文献综述。第三节解释了所提方案的概述。第四节讨论了所获得的结果。第五节对未来的可能范围进行了总结。


    ## II. 文献综述


    主要关注是通过行为分析分析 CERT 数据来检测恶意内部人员。表 I 描述了各种内部威胁框架领域所做的工作。


    ### 表 1: 文献综述


    | 序号 | 作者 | 采用的内部威胁检测框架 | 采用的算法 | 观察 |

    | :--- | :--- | :--- | :--- | :--- |

    | 1 | Jiang 等人 (2018) | 用户行为分析 | XGBoost, SVM, 随机森林 (RF) | 使用 XGBoost 进行的用户行为分析在
    F 指数上优于其他算法，最高达到 99.96%，用于使用 CERT 数据检测恶意活动 |

    | 2 | Eberle and Holder (2009) | 基于图的异常检测 | GBAD-MDL, GBAD-P (概率) 和 GBAD-MPS (最大部分子结构)
    | 使用 MDL 算法的基于图的异常检测能够识别电子邮件、电话流量和业务流程等基于图的异常，比概率和 MPS 算法更能检测内部威胁 |

    | 3 | Liu 等 (2018) | 基于异常的内部人员检测 | 深度自动编码器 (AE) | 深度 A.E. 使用 US-CERT 数据以合理的误率检测出所有恶意内部人员活动
    |


