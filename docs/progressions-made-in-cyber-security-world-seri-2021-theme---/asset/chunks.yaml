    ## II. RELATED WORK


    **Chuan Zhu, Kangning Quan, Guangjie Han and Joel J.P.C. Rodrigues \[[1](#08_ch3.xhtml#r3_1)\]**
    explain with mobile sinks, we offer a high-availability and location-predictive
    data collection strategy. Sensor nodes can determine the locations of mobile sinks
    based on time synchronisation, which minimises sensor node energy usage for sink
    location updates. When the network uses the high-available data gathering technique,
    it can continue to gather data even if part of the mobile sinks are inaccessible.
    Furthermore, by altering the moving trajectory of a mobile sink, the energy consumption
    of nodes near resident sites can be balanced. When there is a problem at the resident
    point, however, data uploading to the mobile sink is severely hampered.


    **Chunlin Li, Jingpan Bai, Jinguang Gu, Xin Yan and Youlong Luo \[[2](#08_ch3.xhtml#r3_2)\]**
    explain to balance energy and extend network lifetime, the clustering routing
    method for wireless sensor networks (CHRA) is introduced. The combination of heterogeneous
    nodes and cluster heads is taken into account. To begin, a model of optimal node
    placement for heterogeneous nodes is created. Second, a clustering routing method
    for wireless sensor networks (CHRA) is proposed, which combines the heterogeneous
    routing algorithm for wireless sensor networks (HRA) with the LEACH-C cluster
    heads choosing technique. Finally, extensive tests are used to evaluate the performance
    of our proposed routing method and several earlier conventional routings. The
    routing algorithm can significantly extend the lifetime and stability of a network.
    It can also drastically reduce energy consumption.


    **Gurbinder Singh Brar, Shalli Ra,i, Vinay Chopra, Rahul Malhotra, Houbing Song
    and Syed Hassan Ahmed \[[3](#08_ch3.xhtml#r3_3)\]** explain a PEGASIS-DSR optimised
    routing protocol (PDORP) based on hybrid optimization, which combined the cache
    and directional transmission concepts of proactive and reactive routing protocols.
    Our suggested protocol’s simulation findings show a reduction in end-to-end transmission
    delay and bit error rate without sacrificing energy efficiency. In order to obtain
    a quick and non-damaged path with decreased transmission latency, both proactive
    and reactive routing methodologies were applied in PDORP.


    **Jianhua Huang, Danwei Ruan and Weiqiang Meng \[[4](#08_ch3.xhtml#r3_4)\]** explain
    ASGRP is a low-energy multi-hop routing protocol for WSNs based on annulus sector
    grid clustering. In a wireless sensor network, the suggested protocol enhances
    the way clusters are formed. The main concept is to divide the network area into
    annulus sector grids, with the BS as the circular region’s centre point. Each
    annular sector grid’s nodes are clustered into a cluster. An annular sector grid,
    as opposed to a rectangular grid, can ensure that the distance between the grid
    nodes and the BS is approximately the same. The angle between the boundary where
    the BS is located and the line from the nodes to the BS is used to create an annular
    sector grid. We also designed an inter-level multi-hop routing strategy to boost
    data transmission efficiency between the BS and cluster head nodes. The suggested
    routing method uniformizes energy use and minimises transmission energy consumption.
    Multi-hop EEBCDA, EEMRP, and CAMP, as well as ASGRP, achieve more consistent energy
    usage, greatly extend network lifetime, and have superior scalability in networks
    with varying numbers of nodes and sizes.'
