    ### Performance Metrics


    This section emphasis the simulation performance of Enhanced Memetic Algorithm
    for IoT enabled WSN. The simulations have performed using network simulator (`NS-2`).
    The network simulator `NS2` is discrete event simulation software for performing
    network simulations. It performs the simulation events such as sending, receiving,
    forwarding and dropping packets in the network. Some of the performance metrics
    of the protocol were discussed. Performance metrics used for comparison are,


    * End to End Delay

    * Packet Delivery Ratio

    * Network Lifetime

    * Energy Consumption

    * Throughput

    * Packet Lost


    #### i. End to End Delay


    Time taken by the packet to travel from source node to the destination node is
    said End to End Delay time. It includes all the delay taken by the router to seek
    the path in network consumption, propagation delay, processing delay and End to
    end delay for packet pac which was sent by the node `k`, as a source node and
    received successfully at destination node is calculated by the formula


    `EndtoEndDelay[kpac] = starttime[kpac] - endtime[kpac]`


    Where start-time `kpac` is the time when sending of packet pack at node `k` starts,
    end-time `kpac`, is the time when packet pac is send by node `k` is received successfully
    at destination area.


    #### ii. Packet Delivery Ratio


    Packet delivery ratio (`PDR`) signifies the total number of packets delivered
    from the source node to the destination node. It is used for calculating the packet
    loss rate during the data transmission.


    While transmitting from the source node to destination node some packets may lost
    or erroneously routed to other node, in order to find this loss `PDR` is calculated
    and measures up both the correctness and efficiency of ad-hoc routing protocols
    in terms of the loss rate. A higher packet delivery ratio is hoped in any network
    is said as best transmission.


    `Packet Delay Ratio = Σ Number of packet receive / Σ Number of packet send`


    #### iii. Energy Consumption


    At the beginning of the simulation, the node has certain initial value that is
    the energy level of the node at the initial level of energy. This is termed as
    Initial Energy in the equation. In the simulation environment, the term “energy”
    represents the energy level in a node at a particular time supplied by the battery
    power or by other source. If any node in the simulation environment attains zero
    energy level, it cannot transmit or receive anymore packets it becomes idle.


    `Nodes energy = Current[—]Energy - Initial[—]Energy`


    #### iv. Network Lifetime


    The capability of monitoring the phenomena of interest among the nodes is the
    maximum duration of time during the deployed sensors in the simulation. Higherr
    range of Network Lifetime incurs the efficient performance.


    `Lifetime = 100 - ΣAi - Average of energy`


    #### v. Throughput


    Total number of packets transmitted within the transmission time or successful
    data transmission in the preferred time is termed as throughput value. The value
    of transmission is calculated as the average rate of successfully packets delivered
    from the source to destination node. It is represented in bits/bytes per second.


    `Average throughput = Sum of packets successfully delivered - Total number of
    packets/Transmission time`


    #### vi. Packet Lost


    Packet lost is difference between the total number of transmitted packets and
    Total number of received packets.


    `Packet Lost = Number of Transmitted Packets – Number of received Packets`


