    # Evaluation of Supervised Machine Learning Classifiers to Detect Mobile Malware


    **Dr. G. Padmavathi**


    *Department of Computer Science Avinashilingam Institute for Home Science and
    Higher Education for Women Coimbatore, India [padmavathi\_cs@avinuty.ac.in](mailto:padmavathi_cs@avinuty.ac.in)*


    **Dr. D. Shanmugapriya**


    *Department of Information Technology Avinashilingam Institute for Home Science
    and Higher Education for Women Coimbatore, India [shanmugapriya\_it@avinuty.ac.in](mailto:shanmugapriya_it@avinuty.ac.in)*


    **A. Roshni**


    *Center for Cyber Intelligence Avinashilingam Institute for Home Science and Higher
    Education for Women Coimbatore, India [roshini\_cci@avinuty.ac.in](mailto:roshini_cci@avinuty.ac.in)*


    Abstract: *Due to the rapid growth of android applications and mobile users in
    this technological era, there is a large increasing cyber attacks through mobile
    phones. During Pandemic period, mobile malware attacks are one of the top most
    cyber attacks observed in android mobile users to steal the user personal credentials
    by intrusion of adware, spyware, banking malware, SMS malware, riskware, viruses
    and so on. Machine learning methods are very useful and amicable to detect mobile
    malwares. Automation of the mobile malware detection is the need of the hour and
    it is imperative to identify the most suitable machine learning techniques. This
    paper investigates the evaluation of supervised machine learning algorithms that
    are applied to detect and classify the mobile malwares. A systematic method of
    evaluation of supervised machine learning model to detect the malware data points
    and to classify them into binary classification as malware or benign is essential.
    The purpose of evaluating the supervised machine learning algorithms is to identify
    the best supervised machine learning model for mobile malware detection with high
    efficacy rate. All important performance measures are applied and the entire experiments
    are conducted using benchmark dataset. Nine Supervised Machine Learning methods
    are experimented and the results are discussed.*


    Keywords: Machine Learning, Malware Classification, Mobile Malware, Supervised
    Learning, Python


    ## I. INTRODUCTION


    A Malware or Malicious Software is one of the most common types of cyber attack
    which was highly pre-dominant during the pandemic by the means of intruding as
    a malicious code to take over the system control by monitoring all the user activities
    and steal the user personal credentials without the knowledge of the user \[[2](#07_ch2.xhtml#r2_2)\]
    \[[3](#07_ch2.xhtml#r2_3)\] \[[4](#07_ch2.xhtml#r2_4)\].


    Mobile malware are the important threats and android based mobile malware are
    very significant today and they compromise user’s credentials through unauthorized
    access \[[2](#07_ch2.xhtml#r2_2)\] \[[3](#07_ch2.xhtml#r2_3)\] \[[4](#07_ch2.xhtml#r2_4)\].
    The aim of the paper is to identify efficient supervised machine learning algorithms
    to detect mobile malwares. The applied algorithms classify the dataset into malware
    data and benign data using a systematic approach which is vital towards automation
    of mobile malware detection.


    Automation is the way of handling the problems without human intervention by incorporating
    AI methods to provide solution to reduce the processing time \[[9](#07_ch2.xhtml#r2_9)\].
    The proposed approach experiments nine different supervised machine learning models,
    evaluate the models and recommends the most efficient supervised ML model for
    accurate malware detection. The evaluation of the supervised machine learning
    models is done in terms of performance metrics such as accuracy, precision, recall,
    F1 score, R2 score, TPR, FPR and ROC \[[5](#07_ch2.xhtml#r2_5)\] \[[7](#07_ch2.xhtml#r2_7)\]
    \[[8](#07_ch2.xhtml#r2_8)\].'
