- raw: 'The major contribution of this paper is to devise a systematic methodology
    to test the supervised machine learning model suitable for android based mobile
    malware detection. This paper is divided into different phases of Machine Learning
    work flow. The first step is to acquire the dataset and analyze the data to fit
    for the further development process. The malware dataset taken for study contains
    1,00,000 records with 35 feature attributes. In the second step, data pre-processing
    methods are applied to check whether the data contains any null values or irrelevant
    values, which helps to remove the unwanted data values then split the data into
    training and test data set as in the ratio of 70:30. Third step, applies the feature
    selection methods to find out the important features of the dataset. Selecting
    the significant features from the dataset will help to improve the data processing
    time and provides better accuracy of the ML algorithms. The methodology uses three
    different feature selection algorithms namely, (i) Univariate Selection (ii) Feature
    Importance and (iii) Recursive Feature Elimination. By applying the above mentioned
    feature selection methods, out of 35 features top 10 important features are selected
    for effective malware classification. Fourth step, applies supervised machine
    learning algorithms to identify and classify the data into malware/benign \[[1](#07_ch2.xhtml#r2_1)\]
    \[[2](#07_ch2.xhtml#r2_2)\] \[[6](#07_ch2.xhtml#r2_6)\] \[[9](#07_ch2.xhtml#r2_9)\]
    \[[10](#07_ch2.xhtml#r2_10)\]. Following supervised machine learning algorithms
    are evaluated in this study.


    1.  Decision tree


    2.  Random forest


    3.  K – Nearest Neighbors (KNN)


    4.  Support Vector Machine (SVM)


    5.  Naïve Bayes


    6.  AdaBoost


    7.  Neural Network (MLP)


    8.  Logistic Regression


    9.  Linear Discriminant Analysis


    Fifth step, evaluate the performance of the supervised machine learning models
    using various evaluative metrics to provide the best model for mobile malware
    detection \[[1](#07_ch2.xhtml#r2_1)\] \[[4](#07_ch2.xhtml#r2_4)\].


    ## II. PROBLEM DEFINITION


    For automation of mobile malware detection, it is necessary to develop a systematic
    framework. This study applies supervised machine learning algorithms to detect
    and classify the mobile malware. Nine different supervised machine learning algorithms
    are implemented and evaluated for performance and the most suitable supervised
    machine learning models are identified based on their performance.


