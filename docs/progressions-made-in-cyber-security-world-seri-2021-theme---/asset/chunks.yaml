    **摘要：** 在过去的十年中，物联网（IoT）作为完全连接传感设备的骨干，用于虚拟和现实世界的集成通信平台。在物联网（IoT）中，传感器网络（WSNs）被认为是关键元素。IoT
    感知环境、收集数据并发送到基站（BS）。物联网路由协议是为 WSN 设计的，但由于节点的异构性，WSNs 无法正常工作。由于物联网是一种去中心化的网络，网络感知信息并将其传递到基站。传感器节点的小尺寸在这种网络中消耗更多能量，这似乎是一个主要问题。由于使用了无线通道并可能部署在恶劣环境或无监督区域，它们很容易受到各种攻击。此外，安装的安全系统具有固有缺陷。因此，这些系统容易受到网络安全威胁。为了提高网络性能并克服网络安全风险，本研究提出了一种名为遗传算法的新算法。遗传算法在安全漏洞方面是最好的算法之一。


    **关键词：** 传感器网络 (WSNs)、物联网、网络安全、安全漏洞、遗传算法。


