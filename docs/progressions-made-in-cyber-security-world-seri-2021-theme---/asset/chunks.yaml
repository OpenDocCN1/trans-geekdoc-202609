    ML Algorithms in ROC Curve


    ## V. CONCLUSION


    Android based mobile malware are of serious threats to the user community due
    to challenges with user data compromise. Therefore, automatic detection and dynamic
    analysis of mobile malware are very crucial to develop. The implementation of
    various Supervised Machine Learning Models using Mobile Malware Dataset, it is
    observed that, out of nine Supervised Machine Learning algorithms, the Naïve Bayes
    Classifier Model performs little low when compared with other different eight
    given Supervised Machine Learning algorithms for the given dataset.


    This paper clearly describes the step-by-step implementation procedure to develop
    an effective Machine Learning Model using a Mobile Malware Dataset in an elaborative
    way. Moreover, all Supervised Machine Learning algorithms support Malware classification
    with higher efficacy rate. Thus, this study will be helpful for the learners to
    understand and implement Supervised Machine Learning algorithms in a systematic
    way by incorporating mobile malware datasets to arrive at the best results.


