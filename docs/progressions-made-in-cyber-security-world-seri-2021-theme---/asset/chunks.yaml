    \ and et. (2017) || Graph and anomaly detection Framework || Isolation Forest\
    \ || The combined graph-based anomaly detection framework identifies 79% of individuals\
    \ as Genuine users and 31% as malicious insiders with suspicious activity \\[13\\\
    ]. |\n\n| 10. || Liu et al. (2020) || Behaviour analysis || Behaviour analysis\
    \ || The new behaviour analysis framework named Doc2vec simplifies insider threat\
    \ detection based on spatial and temporal metrics \\[14\\]. |\n\n| 11. || Le and\
    \ Heywood (2021) || Anomaly Detection for Insider Threats Using Unsupervised Ensembles\
    \ || AutoEncoder, Isolation Forest, Lightweight on-line detector of anomalies\
    \ (LODA), Local Outlier Factor (LOF) || Unsupervised ensemble-based anomaly detection\
    \ using Autoencoder outperforms the other algorithm based on voting metrics to\
    \ detect the malicious insider threat \\[15\\]. |\n\n| 12. || Legg (2015) || Behavior\
    \ based malicious insider threat detection || Visual Analytics || Visual analytics\
    \ is recommended to detect malicious insider threat activity based on profiling\
    \ behaviour and selected features as a mitigation strategy \\[16\\]. |\n\nThe\
    \ above table shows that the various types of insider threat framework utilize\
    \ different user behavior modelling technique to detect the malicious insider.\
    \ Hence, the behavior analysis is implemented to improve the precise detection\
    \ of a malicious insider in an organization.\n\n## III. METHODOLOGY\n\nThe following\
    \ [Fig. 1](#06_ch1.xhtml#f1_1) shows the proposed malicious insider threat framework\
    \ methodology using behavior analysis to detect a malicious insider threat in\
    \ an organization.\n\n### A. Dataset\n\nData can be obtained from the monitoring\
    \ process of the organization, where different log files, such as email and weblogs,\
    \ firewall logs, network traffic captures, and different types of user records\
    \ are common \\[[2](#06_ch1.xhtml#r1_2)\\]. The publicly available dataset gathered\
    \ from U.S. based Computer Emergency Response Team (US-CERT) is used. It consists\
    \ of information regarding both malicious insider and genuine user activity. This\
    \ dataset has been collected from [https://kilthub.cmu.edu/articles/dataset/](https://www.kilthub.cmu.edu)\
    \ Insider Threat Test Dataset/12841247/1\\[2\\]. The above dataset contains the\
    \ activity information of individual employees in an organization. It comprises\
    \ the following data input: (i) user activity log data such as web URL, email,\
    \ file, access log, and removable device connectivity records. It is dynamic and\
    \ used for the behavior analysis of users. (ii) Structure and information of user\
    \ and organization. It is considered as meta information for data analysis. For\
    \ example, Lightweight Directory Access Protocol (LDAP) is considered as metadata\
    \ in CERT data.\n\n![Fig. 1 Methodology Overview](images/page4_1_B.jpg)\n\n[**Fig.\
    \ 1**](#06_ch1.xhtml#f1_1b) Methodology Overview\n\nIn CERT data, the log information\
    \ of malicious and non-malicious activity is given based on the threat scenario\
    \ mentioned below.\n\n*   Scenario 1: An individual in an organization works after\
    \ working hours, carries a removable drive and uploads sensitive information to\
    \ the unauthorized website such as wikileaks.org. Tries to resign from the organization.\n\
    \n*   Scenario 2: An individual in an organization visits a job portal website\
    \ and explores the employment opportunities of a business competitor. An individual’s\
    \ anomalous activity increases the use of a removable device. Resigns the organization\
    \ in future.\n\n*   Scenario 3: Unauthenticated administrator attempts to use\
    \ unauthorized software to collect sensitive credentials, utilizes the removable\
    \ device to get sensitive information and tries to access the secure system. Later\
    \ email the critical information and resigns from the organization.\n\n*   Scenario\
    \ 4: Over three months, an individual often logs in, searches, and forwards sensitive\
    \ information from other users’ computers to personal email addresses.\n\n*  \
    \ Scenario 5: Uploads sensitive information such as documents to Dropbox for personal\
    \ gain.\n\nBased on the dataset version, the particular scenario is used. The\
    \ proposed methodology uses the dataset version r3.1. It satisfies the scenario\
    \ 1 and scenario 2 from the above-mentioned scenarios for further processing.\n\
    \n### B. Data pre-processing\n\nThe primary CERT data contains log details of\
    \ 516 days, where 4000 users generate 135,117,169 log events. The events are activity\
    \ including email-based, login-based, device storage-based, HTTP operations, psychometric\
    \ details, file information and daily log details \\[[3](#06_ch1.xhtml#r1_3)\\\
    ]. The above mentioned five scenarios apply scenario-1 and scenario-2 related\
    \ malicious insider threat data in this research. Other information is ignored.\
