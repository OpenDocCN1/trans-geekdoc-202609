    \ multiple methods detect the malicious insider threat using computer log activity\
    \ in an actual corporate database \\[11\\]. |\n\n| 8. || Lv et al. || Method based\
    \ on user and role behavior (MURB) and Anomaly Detection (ADAD) || Isolation Forest\
    \ || MURB outperforms the ADAD with 80% precision and accuracy for detection of\
