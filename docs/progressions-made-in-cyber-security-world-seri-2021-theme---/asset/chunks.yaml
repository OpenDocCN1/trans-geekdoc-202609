    # Preface


    SERI-2021 was a success with the presence of our valuable Guest Speakers who lead
    the discussion in various session in just the right direction showering the audiences
    with their esteemed valuable knowledge and insights in the field. The various
    sessions we had such as “Quad: Cyber security capabilities”, “National Interventions
    and Programs for Security Education”, “Cyber First: This and next generation”,
    “Crypto: Releasing possibilities” etc. not only focussed on the present scenario
    but also defined the futuristic scope of in the filed of cyber-security. The Conference
    had an interesting competition judged by the top scholarly of cyber-security field
    as Paper-Presentation which saw number of entries and few finally making it to
    the top. This book has the top 3 papers presented. Hope you will enjoy surfing
    through new interventions in the field.


    # Detection of Malicious Insider in Cloud Environment based on behavior


    ## Abstract


    Insider threat is one of the most stimulating threats in an organization leaking
    sensitive information. The primary goal of malicious insiders is to cause economic
    and reputation loss by leaking sensitive data to competitive organization. So,
    it is significant to detect the malicious insider within an organization. One
    of the way for detecting the malicious insider is by analysing the behavior. This
    paper proposes the detection of malicious activity using behavior analysis.


    **Keywords:** Insider threat detection, behavior analysis, Malicious Insider.


    ## I. Introduction


    In the rapidly developing world, all business organizations and corporate sector
    recommend and enhance the business by the Internet. Cloud computing is a framework
    that accomplishes on-demand self-service resources to its Internet. The most challenging
    security threats faced by an organization is Malicious insider or an authorized
    employee who attempts to gain confidential information. Recent reports show that
    53% of organizations and 42% of U.S. federal agencies suffer from insider threats
    every year. Insider threat-related activities can be carried out intentionally,
    such as information system sabotage, intellectual property theft, and disclosure
    of classified information, as well as unintentionally, such as careless use of
    computing resources.


    This paper aims to explore the US-CERT data using the logging behavior of employees
    within the organization. The entire paper is organized into four sections. Section
    II tabulates the literature study on malicious insider method. Section III explains
    the overview of proposed methodology. Section IV discusses the obtained result.
    Section V concludes with possible scope for future.


    ## II. Literature Review


    The primary concern is to analyze the CERT data to detect the malicious insiders
    using behavior analysis. Table I describes the work done in the field of various
    Insider Threat frameworks.


    ### Table 1: Literature Review


    | S.no | Author | Insider Threat Detection Framework applied | Algorithms applied
    | Observations |

    | :--- | :--- | :--- | :--- | :--- |

    | 1 | Jiang et al. (2018) | User Behavior Analysis | XGBoost, SVM, Random Forest
    (RF) | User behaviour analysis using XGBoost outperforms other algorithms based
    on F-measure up to 99.96% to detect the malicious activity using CERT dataset
    |

    | 2 | Eberle and Holder (2009) | Graph based anomaly detection | GBAD-MDL, GBAD-P
    (probability) and GBAD-MPS (maximum partial substructure) | Graph-based anomaly
    detection using MDL algorithm identifies the graph-based anomalies such as email,
    phone traffic and business process to detect the insider threat than Probability
    and MPS algorithm |

    | 3 | Liu and et. (2018) | Anomaly- based Insider detection | Deep Autoencoder
    (AE) | Deep A.E. detects all malicious insider activity with a reasonable false
    positive rate using US-CERT data |

