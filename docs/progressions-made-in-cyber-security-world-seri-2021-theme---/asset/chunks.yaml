    # Secure Data Aggregation Process Using Memetic Algorithm in IoT Enabled Wireless
    Sensor Networks


    Dr. D. Nethra Pingala Suthishni


    Assistant Professor, Department of Information Technology Avinashilingam Institute
    for Home Science and Higher Education for Women Coimbatore, India


    [nethra\_it@avinuty.ac.in](mailto:nethra_it@avinuty.ac.in)


    Mr. K.S. Senthil Kumar


    Assistant Professor, PG & Research Department of Computer Science Hindusthan College
    of Arts & Science, Coimbatore, India


    [senth4u4m@gmail.com](mailto:senth4u4m@gmail.com)


    **Abstract:** *In the last decade, the Internet of Things (IoT) serves as a backbone
    for entirely connected sensor devices to achieve integrated communication settings
    and platforms, both virtual and real-world, in terms of distributed systems. In
    Internet of Things (IoT), Wireless Sensor Networks (WSNs) is considered as the
    key element. IoT is sensing the environment, collecting data and sending to the
    base station (BS). IoT environment routing protocols are designed for WSNs. But,
    WSNs doesn’t work properly due to heterogeneity of nodes. As IoT network is a
    decentralized type of network, the network senses the information and passes it
    on to the base station. Small size of sensor nodes consumes more energy in this
    type of network and this seems to be a major issue. They are vulnerable to a variety
    of attacks due to the usage of wireless communication channels and the possibility
    of deployment in harsh settings or unsupervised areas. In addition, the installed
    security systems in these contexts have inherent drawbacks. As a result, such
    systems are susceptible to cyber security threats. To enhance the performance
    of the network and to overcome the cyber security risks, a new algorithm called
    Memetic algorithm is proposed in this research. Memetic algorithm is one of the
    best algorithms in terms of security breaches. The algorithm is based on routing
    mechanism and uses mobile sink for data gathering mechanism to prevent network
    partitioning problem. The simulation of the proposed technique is done using NS2
    Simulator. The experimental results are compared with the prevailing algorithms
    to demonstrate the efficiency of the proposed scheme against some common security
    risks such as traffic interception, and ransomware. The proposed work also achieves
    better performance in terms of throughput, network lifetime, packet lost, end
    to end delay and energy consumption. Node authentication, data integrity, anti-compromise,
    and traffic analysis resistance are all features of the proposed system.*


    **Keywords:** Wireless Sensor Networks (WSNs), IoT, Cyber Security, Security Breaches,
    Memetic Algorithm.


