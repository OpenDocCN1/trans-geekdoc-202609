    \n# Detection of Malicious Insider in Cloud Environment based on behavior Analysis\n\
    \n**Padmavathi G**\n\nDepartment of Computer Science Avinashilingam Institute\
    \ for Home Science and Higher Education for Women Coimbatore, Tamilnadu, India\
    \ [padmavathi\\_cs@avinuty.ac.in](mailto:padmavathi_cs@avinuty.ac.in)\n\n**Shanmugapriya\
    \ D**\n\nDepartment of Information Technology Avinashilingam Institute for Home\
    \ Science and Higher Education for Women Coimbatore, Tamilnadu, India [shanmugapriya\\\
    _it@avinuty.ac.in](mailto:shanmugapriya_it@avinuty.ac.in)\n\n**Asha S**\n\nDepartment\
    \ of Computer Science Avinashilingam Institute for Home Science and Higher Education\
    \ for Women Coimbatore, Tamilnadu, India [20phcsf005@avinuty.ac.in](mailto:20phcsf005@avinuty.ac.in)\n\
    \n**Abstract:** *Insider threat is one of the most stimulating security threats\
    \ in an organization that possesses sensitive information. In an organization,\
    \ detecting malicious insider threats is more challenging due to the behavioral\
    \ changes of malicious insider. To avoid the sensitive information leakage that\
    \ causes enormous loss, detecting the malicious insider within an organization\
    \ is necessary. The principal focus of this paper is to find the user’s unauthorized\
    \ activity by analyzing their behavior on website i.e., websearch analysis. To\
    \ find the user’s unauthorized activity by analyzing each user’s behaviour, such\
    \ as the website activity of each individual. The user is classified as a genuine\
    \ user or malicious userbased on user’s websearch behavior. This paper proposes\
    \ an insider threat detection framework to analyze and detect the malicious insider\
    \ threat within an organization using user’s statistical behavior analysis.*\n\
    \n**Keywords:** Insider threat detection, behavior analysis, Malicious Insider.\n\
    \n## I. INTRODUCTION\n\nIn the rapidly developing world, all business organizations\
    \ and the corporate sector recommend and enhance the business by possessing the\
    \ Internet-as-a-solution. Cloud computing is a framework that accomplishes rapid\
    \ provisioning on-demand charge restricted self-service resources to its user\
    \ over the Internet. The migration of an organization to the cloud faces some\
    \ severe threats due to its changing environment. One of the most challenging\
    \ security threats faced by an organization is Malicious insider or an authorized\
    \ individual employee who attempts to gain access to confidential information.\
    \ Recent reports show that 53% of organizations and 42% of U.S. federal agencies\
    \ suffer from insider threats every year \\[[1](#06_ch1.xhtml#r1_1)\\]. Insider\
    \ threat-related activities can be carried out intentionally, such as information\
    \ system sabotage, intellectual property theft, and disclosure of classified information,\
    \ as well as unintentionally, such as careless use of computing resources \\[1\\\
    ]. The primary goal of malicious insiders is to cause economic and reputation\
    \ loss by leaking sensitive data to the competitive organization. So, it is significant\
    \ to detect the malicious insiderthreat in an organization. one of the way for\
    \ detecting the malicious insider is by analysing the behavior of the user. This\
    \ paper proposes the detection of malicious insider activity using behavior analysis.\
    \ This paper aims to explore the insider data using the logging behavior of employees\
    \ within the organization. The entire paper is organized into four sections. Section\
    \ II tabulates the literature study on malicious insider detection method. Section\
    \ III explains the overview of proposed methodology. Section IV discusses the\
    \ obtained result. Section V concludes with possible scope for future enhancement.\n\
    \n## II. Literature Review\n\nThe primary concern is to analyze the CERT data\
    \ to detect the malicious insiders using logging behavior analysis. [Table I](#06_ch1.xhtml#t1_1)\
    \ describes the work done in the field of various Insider Threat detection frameworks.\n\
    \n[**Table 1**](#06_ch1.xhtml#t1_1b) Literature Review\n\n| S.no || Author ||\
    \ Insider Threat Detection Framework applied || Algorithms applied || Observations\
    \ |\n\n| --- | --- | --- | --- | --- |\n\n| 1. || Jiang et al. (2018) || User\
    \ Behavior Analysis || XGBoost, SVM, Random Forest (RF) || User behaviour analysis\
    \ using XGBoost outperforms other algorithms based on F-measure up to 99.96% to\
    \ detect the malicious activity using CERT dataset \\[5\\] |\n\n| --- | --- |\
    \ --- | --- | --- |\n\n| 2. || Eberle and Holder (2009) || Graph based anomaly\
    \ detection || GBAD-MDL, GBAD-P (probability) and GBAD-MPS (maximum partial substructure)\
    \ || Graph-based anomaly detection using MDL algorithm identifies the graph-based\
    \ anomalies such as email, phone traffic and business process to detect the insider\
    \ threat than Probability and MPS algorithm \\[6\\] |\n\n| 3. || Liu and et. (2018)\
    \ || Anomaly- based Insider detection || Deep Autoencoder (AE) || Deep A.E. detects\
    \ all malicious insider activity with a reasonable false positive rate using US-CERT\
    \ data \\[7\\] |"
