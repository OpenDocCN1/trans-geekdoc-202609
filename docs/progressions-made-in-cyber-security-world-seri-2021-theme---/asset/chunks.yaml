    The above table shows that the various types of insider threat framework utilize
    different user behavior modelling technique to detect the malicious insider. Hence,
    the behavior analysis is implemented to improve the precise detection of a malicious
    insider in an organization.


    ## III. METHODOLOGY


    The following [Fig. 1](#06_ch1.xhtml#f1_1) shows the proposed malicious insider
    threat framework methodology using behavior analysis to detect a malicious insider
    threat in an organization.


    ### A. Dataset


    Data can be obtained from the monitoring process of the organization, where different
    log files, such as email and weblogs, firewall logs, network traffic captures,
    and different types of user records are common [[2](#06_ch1.xhtml#r1_2)]. The
    publicly available dataset gathered from U.S. based Computer Emergency Response
    Team (`US-CERT`) is used. It consists of information regarding both malicious
    insider and genuine user activity. This dataset has been collected from [https://kilthub.cmu.edu/articles/dataset/](https://www.kilthub.cmu.edu)
    Insider Threat Test Dataset/12841247/1[2]. The above dataset contains the activity
    information of individual employees in an organization. It comprises the following
    data input: (i) user activity log data such as web URL, email, file, access log,
    and removable device connectivity records. It is dynamic and used for the behavior
    analysis of users. (ii) Structure and information of user and organization. It
    is dynamic. `LDAP` is considered as metadata.


    ![Fig. 1](images/page4_1.jpg)


    [Fig. 1](#06_ch1.xhtml#f1_1) Methodology Overview


    In `CERT` data, the malicious and non-malicious activity is given below:


    * Scenario 1: An individual in an organization works after working hours, carries
    a removable drive and uploads sensitive information to `wikileaks.org`. Resigns
    from the organization.

    * Scenario 2: An individual visits a job portal and explores employment opportunities
    of business competitor. Resigns the organization.

    * Scenario 3: Unauthenticated administrator attempts to use unauthorized software
    to collect sensitive credentials. Later email the system.

    * Scenario 4: Over three months, an individual often logs in, searches, and forwards
    sensitive information to personal addresses.

    * Scenario 5: Uploads sensitive information to `Dropbox`.


    Based on the dataset version, the particular scenario is used. The proposed methodology
    uses the dataset version `r3.1`.


    ### B. Data pre-processing


    The primary `CERT` data contains log details of 516 days, where 4000 users generate
    135,117,169 events. The events include email-based, login-based, device-based,
    HTTP operations, psychometric details, and file information [[3](#06_ch1.xhtml#r1_3)].
    The selected data undertakes three pre-processing steps to make the data suitable
    for insider detection. It includes data integration, data transformation and data
    level sampling.


    #### 1. Data Integration


    The malicious and non-malicious activity information that satisfies the selected
    scenario are gathered from device connectivity, login status and website operation
    for detection of malicious insider threat. A simple feature concatenation technique
    is used to integrate the selected records. [Table II](#06_ch1.xhtml#t1_2) demonstrates
    the details of integrated data.


    | S.no | Feature name | Explanation |

    | --- | --- | --- |

    | 1. | `InsiderThreat` | Malicious activity or not |

    | 2. | `Vector` | origin of data (HTTP/logon/device) |

    | 3. | `date` | Date |

    | 4. | `User` | The user id of an employee |

    | 5. | `Pc` | Unique identification for each computer |

    | 6. | `Activity` | Actual activity of an employee in the pc |


    #### 2. Data Transformation


    The integrated data requires data transformation to encode the absolute value
    for further processing. The features, namely `vector`, `pc`, `user` and `activity`
    from integrated data is converted into a numerical value. The value of `date`
    is converted into a number of epochs. [Table III](#06_ch1.xhtml#t1_3) shows the
    encoded data.

