    ## IV. 结果与讨论


    从上述对九种不同的监督学习机器学习算法进行的比较分析（表 III 和表 IV）可以看出，决策树、随机森林、加增强提升、基于神经网络的多层感知器 (MLP)、逻辑回归在移动恶意软件二分类中能够以
    100% 的准确率和 0% 的误差率准确检测检测分类恶意软件数据点。此外，KNN 算法的分类率为 99.7%，SVM 算法的分类率为 99.9%，朴素贝叶算法的分类率为
    90.9%，LDA 算法的分类率为 99.7%。与决策树、随机森林、KNN、SVM、加增强提升、MLP、逻辑回归和 LDA 监督模型分类器相比；朴素贝叶斯分类器模型在给定数据集上的准确率略低。


