    ## B. Data Acquisition and Data Importing


    The first and foremost step in developing a Supervised Machine Learning Model
    is to acquire the appropriate dataset and import them into the working environment.
    `Python` is a platform excellence to support enormous Machine Learning algorithms
    and it is the suitable environment experiments methodology of machine learning
    model. In this step, the acquired malware dataset is converted into the `CSV`
    file format and imported into the `Python Jupyter notebook` environment.


    ## C. Data Pre-processing


    After importing the dataset, the second consequent step to be performed is data
    pre-processing. Data pre-processing is the significant step to derive the best
    results from the classifier models. The data pre-processing is carried out by
    verifying that the taken dataset contains any null values, un-defined values or
    irrelevant values which may deviate the results and degrade the performance of
    the models. The null values are replaced into “zero (0)” or “unknown” data values
    to overcome the processing issue. `Label encoding` method is applied to convert
    the attributes into the integer data type format to develop suitable machine learning
    model. For developing ML models the entire dataset is divided into training set
    and testing set in the ratio of 70% for training and 30% for testing. After this
    step, the dataset is now available in a well defined format for further processing.


    ## D. Feature Selection


    Feature selection is an important step of Feature Engineering in Machine Learning
    process. Feature Engineering is the third step, in the Machine Learning process
    which extracts the features from the raw dataset to provide labels for appropriate
    classification. Following feature selection methods are used to choose the top
    10 important features precisely out of 35 attributes of given dataset.


    ### i. Univariate Feature Selection


    The univariate feature selection approach is a statistical technique for identifying
    relevant features having a strong association to the target variable. The `scikit-learn`
    library in `Python` includes a function called `SelectKBest`. The `SelectKBest`
    class is used in this study to choose the top 10 features out of 35 features in
    a mobile malware dataset using the chi-square statistical test. It calculates
    the Chi-square coefficient for each non-negative feature in the target class and
    chooses the desired top 10 features with the highest Chi-square scores.


    **Chi – Square Formula:**


    $X^{2} = {\\sum\\frac{\\left( {Observed\text{?}value - Expected\text{?}value}
    \\right)^{2}}{Expected\text{?}Value}}$


    ### ii. Feature Importance Based Feature Selection


    The feature importance property of the ensemble model is used by the `python`
    tool `feature importance` to pick important features of the dataset. Every property
    of the dataset is given a score. Greater the score, higher the significance or
    relevance feature towards target variable. Using the `python sklearn ensemble
    model` with the `Extra tree classifier` method, the system calculates the top
    10 features and displays the scores of all the calculated features.


    ### iii. Recursive Feature Elimination (RFE)


    Recursively deleting characteristics and then developing a classifier model with
    the remaining attributes is how the recursive feature elimination is done. The
    model selects the top 10 features of the data by recursively eliminating the smallest
    features using the `python sklearn feature selection library`, `RFE` method, and
    the `logistic regression classifier` algorithm, and the selected features are
    discernible as True in the `support array`, and the features are ranked using
    the choice “1” in the `ranking array`.


    After incorporating three different feature selection methods, the top 10 features
    are selected based on the highest occurring nature of attributes from the three
    different feature selection methods. This selection helps in malware data point
    selection in optimum time. Figure 2 indicates the top 10 selected features out
    of the 35 features shown in Table I. The Top 10 Selected Features are listed below.


    *   `hash`

    *   `state`

    *   `static_prio`

    *   `vm_truncate_count`

    *   `map_count`

    *   `total_vm`

    *   `reserved_vm`

    *   `nvcsw`

    *   `nivcsw`

    *   `utime`


