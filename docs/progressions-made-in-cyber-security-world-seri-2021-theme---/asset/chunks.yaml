    phase involves data pre-processing to investigate the quality of the data by removing
    the duplicate records, noisy data and conversion of null values into well defined
    format. The third phase is to apply Feature Selection methods to find out the
    best features of the dataset that strives to detect or classify the malware data
    points with high efficacy rate with less processing time. The fourth phase is
    building a nine different Supervised Machine Learning Models which automatically
