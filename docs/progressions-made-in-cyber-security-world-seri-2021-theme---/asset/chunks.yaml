    *   Mean Absolute Error (MAE)

    *   Mean Squared Error (MSE)

    *   Root Mean Squared Error (RMSE)


    The results are also visualized in Receiver Operating Characteristic (ROC) curve
    form.


    **Accuracy:** It is defined as the percentage of accurate predictions of the test
    data.


    $Accuracy = \frac{TP + TN}{TP + TN + FP + FN}$


    **True Positives (TP)** – These are the accurately predicted positive values,
    indicating that the actual and predicted class values are both True.


    **True Negatives (TN)** – These are the precisely predicted negative values, indicating
    that the actual and predicted class values are both False.


    **False Positives (FP)** – When the predicted class is True, but the actual class
    is False.


    **False Negatives (FN)** – When the predicted class is False, but the actual class
    is True.


    **Precision:** It is the ratio of successfully predicted positive observations
    to total expected positive observations. It refers to the classifier’s ability
    to avoid mislabeling a negative sample as positive.


    > **Precision = TP/TP + FP**


    **Recall:** It is the proportion of accurately predicted positive observations
    to all observations in the actual class of observations. It refers to the capacity
    of classifier on its ability to locate all positive samples.


    > **Recall = TP/TP + FN**


    **F1 Score:** It is the weighted average, or Harmonic Mean, of Precision and Recall.
    As a result, this score takes into account both false positives and false negatives.


    > **F1 Score = 2*(Recall * Precision) / (Recall + Precision)**


    > **Or**


    > **F1 = 2TP / 2TP + FP + FN**


    **R2 Score:** The coefficient of determination (sometimes referred to as R-Squared)
    is a statistical metric used in regression models to determine how much variance
    in the dependent variable can be explained by the independent variable.


    $R^{2} = 1 - \frac{\sum\left( {y_{i} - \hat{y}} \right)^{2}}{\sum\left( {y_{i}
    - \overline{y}} \right)^{2}}$


    Where, `ŷ` is the predicted value of `y` and `ȳ` is the mean value of `y`.


    **Confusion Matrix:** It is a matrix that is used to evaluate classification model’s
    performance for a certain set of test data. Only if the true values for test data
    are known, it can be determined. Since it displays the errors in the model’s performance
    as a matrix, it is also known as an error matrix. [Figure 3](#07_ch2.xhtml#f2_3)
    shows the confusion matrix.


    [Fig. 3](#07_ch2.xhtml#f2_3b) Confusion Matrix


    | N = Total Predictions | Actual Positive (1) | Actual Negative (0) |

    | --- | --- | --- |

    | Predicted Positive (1) | TP | FP |

    | Predicted Negative (0) | FN | TN |


    **Mean Absolute Error (MAE) (L1 Loss):** It is the average of the absolute difference
    in the dataset’s actual and forecasted values. It computes the average of the
    residuals in the dataset.


    $MAE = \frac{1}{N}{\sum\limits_{i = 1}^{N}\left| y_{i} - \hat{y} \right|}$


    **Mean Squared Error (MSE) (Quadratic Loss or L2 Loss):** It is the average of
    the squared difference between the original and forecasted values. It calculates
    the residuals’ variance.


    $MSE = \frac{1}{N}{\sum\limits_{i = 1}^{N}\left( {y_{i} - \hat{y}} \right)^{2}}$


    **Root Mean Squared Error (RMSE):** It is the standard deviation of the errors
    that occur when making a prediction on a dataset. This is the same as MSE (Mean
    Squared Error). Only the root of the number is taken into account when determining
    the model’s accuracy. The square root of Mean Squared Error is termed as RMSE.
    It calculates the residuals’ standard deviation.


    $RMSE = \sqrt{MSE} = \sqrt{\frac{1}{N}{\sum\limits_{i = 1}^{N}\left( {y_{i} -
    \hat{y}} \right)^{2}}}$


    Where, `ŷ` is the predicted value of `y` and `ȳ` is the mean value of `y`.


    **Receiver Operating Characteristic (ROC) Curve:** It is a graph that shows how
    effectively a classification algorithm works across all the conceivable thresholds.
    The graph shows both the true positive rate (Y-axis) and the false positive rate
    (X-axis). As a function of the model’s positive classification threshold, it plots
    the true positive rate (TPR) against the false positive rate (FPR).


    **AUC (Area under the Curve):** It is a statistic used for calculating the classification
    model’s overall performance based on the area under the ROC curve.


    ### G. Comparative Analysis


    Based on the above given evaluation measures, a comparative analysis is made between
    the nine different supervised machine learning models to discover the best classifier
    model with high efficacy rate. [Figure 4](#07_ch2.xhtml#f2_4) shows the overall
    accuracy comparison of all supervised machine learning model. Table III and Table
    IV describes the comparative analysis of nine supervised machine learning algorithms
    based on the evaluation metrics such as accuracy, precision, recall, F1 score,
    R2 score and the error rate evaluation based on Mean Absolute Error (MAE), Mean
    Squared Error (MSE) and Root Mean Squared Error (RMSE).


