- raw: '**Jianhua Huang, Yadong Hong, Ziming Zhao and Yubo Yuan \[[5](#08_ch3.xhtml#r3_5)\]**
    explain to extend the network lifetime, we presented an energy-efficient multi-hop
    routing protocol based on grid clustering. The suggested protocol divides the
    network region across unequal grids to produce clusters of varying levels. Because
    grids located further away from the sink are larger, cluster distribution is more
    acceptable, and energy consumption among functional nodes is efficiently balanced.
    Sensor nodes in the grids nearest to the sink send data directly to the sink,
    whereas sensor nodes in subsequent grids send data via multi-hop transmission.
    To reduce the complexity of the election, a management technique based on CM nodes
    is provided, which may eliminate the randomness of electing CH nodes, optimise
    the position of CH nodes, and lower the communication cost of member nodes within
    clusters. It is concluded that the suggested protocol outperforms the other protocols
    in terms of energy efficiency, network lifetime, and scalability.


    **Mbanaso, U. M. and Chukwudebe, G. A. \[[6](#08_ch3.xhtml#r3_6)\]** explain the
    dangers and vulnerabilities of IoT systems are investigated, and a novel adjustable
    policy-based specification is presented for resolving trust, confidentiality,
    and privacy challenges in dispersed situations. Smart entities should become more
    trusted, reliable, and secure in an era where gadgets must collaborate and interact
    seamlessly to solve problems across many domains, assuring end-to-end dynamic
    security and safety. It has developed a system that allows IoT entities to define
    their Capabilities and Requirements in a fine-grained policy construct for mutual
    and immediate negotiation of proven attributes and resources. It also provides
    means for auditable and dispute resolution, which are essential success elements
    in IoT environments, in addition to resolving trust, privacy, and secrecy in a
    unified manner.


    **Moosa Ayati, Mohammad Hossein Ghayyoumi and Atiyeh Keshavarz-Mohammadiyan \[[7](#08_ch3.xhtml#r3_7)\]**
    explain reducing energy usage in WSNs is critical since it extends the network’s
    lifetime. Clustering is an effective way to extend the life of a network. LEACH
    is the most widely used clustering method currently available. Data overhead in
    the BS is decreased in a WSN with low energy usage. One of the most critical factors
    that reduces network lifetime and raises the risk of data loss is data overhead.
    Data packets collide with each other when data overhead develops, and some of
    them may be lost. As a result, the missing packets must be retransmitted. The
    nodes lose energy as a result of these retransmissions. To control data overhead,
    a reliable method for WSNs is necessary. Only the super cluster head is responsible
    for transmitting data to the BS in the proposed SCHFTL. The proposed solution
    reduces data overhead, loss, and retransmission, resulting in a longer network
    lifetime.


    **Preetha, M. and Nithya, M. \[[8](#08_ch3.xhtml#r3_8)\]** explain the encryption
    is a small modification of the well-known and practical RSA-OAEP. Even in the
    multi-query context, the security of the RSA problem remains significantly tied
    to the complexity of the RSA problem, according to this scheme. The RSA gives
    the business application the highest level of security. Furthermore, without using
    hybrid or symmetric encryption, this approach can be utilised to encrypt large
    messages.


    **Ranida Hamidouche, Zibouda Aliouat and Abdelhak Gueroui \[[9](#08_ch3.xhtml#r3_9)\]**
    explain Wireless sensor networks, which are used in a variety of important applications
    such as health care and battlefield monitoring, face the problem of limited energy
    capacity. A distributed protocol based on genetic algorithms, called LECR-GA,
    is presented to achieve efficient energy use. Longer system operability and maximum
    data rate with minimal complexity were achieved by using the correct chromosomal
    representation, fitness function, and GA operations. The proposed algorithms outperform
    GABEEC and GAEEP in terms of energy usage and throughput, according to the findings
    of the experiments.


    **Se-Ra Oh and Young-Gab Kim \[[10](#08_ch3.xhtml#r3_10)\]** explain the oneM2M
    (i.e., Mobius) OAuth 2.0-based security component is designed to offer authentication
    and authorization, which are critical security goals for IoT security and secure
    interworking between IoT platforms. The examples include a section of security
    component code, a token request, and a security component response. A resource
    request from an unauthorized user will be blocked by the oneM2M security component,
    whereas a resource request from an authorized user will be passed through.


    **Yiqun Zhang, Li Xu, Qing Dong, Jingcheng Wang, David Blaauw, and Dennis Sylvester
    \[[11](#08_ch3.xhtml#r3_11)\]** explain the limited computing resources and required
    flexibility, IoT security presents numerous issues. ASICs and coprocessors on
    the market today have a number of drawbacks. In this study, we offer Recryptor,
    a new architecture that leverages in-memory and near-memory computation to support
    massive vector calculations for crypto algorithms effectively. When compared to
    baseline CPU architecture, it preserves programmability and saves approximately
    80% of runtime and energy. In terms of balancing area, energy, throughput, and
    programmability, Recryptor is a reasonable intermediate option.


    ## III. PROBLEM STATEMENT


    The clustering process causes a number of issues, including energy hole problem
    and network segmentation, which drastically increases the possibilities of threats
    in the sensor networks and reduces the network lifetime. The sensor nodes relay
    more data packets with nearby Cluster Head (CH) than far away sensor nodes, resulting
    in the early mortality of the CH. The energy hole problem in the network is divided
    into numerous distinct pieces. Due to a lack of sufficient communication links,
    the segments are unable to communicate with the Base Station (BS). Sensor nodes
    have sufficient energy for data transmission, but they are unable to relay data
    packets to the CH and BS due to a lack of network topology. The clustering mechanism
    consumes lot of extra energy to overcome energy hole problem and network partitioning
    issue. Rather, they use hardware resources to overwhelm the same.


    ## IV. PROPOSED WORK AND ALGORITHM PROPOSED WORK


    There are three types of the phases explained in IoT-enabled wireless sensor networks.
    The first phase is Memetic algorithm based cluster creation. The second phase
    is data collection phase based mobile sink based data collecting and third phase
    is RSA algorithm based cryptography process.


    Memetic Algorithm is used to elect CHs during the cluster building phase using
    a strict memetic approach. Data collecting describes a cluster creation method
    based on a memetic algorithm, followed by a data collection scheme based on a
    mobile sink. RSA based cryptography process algorithm uses key-based encryption
    and decryption mechanism to improve cryptography.


    ### ALGORITHM


    #### RSA Algorithm


    The algorithm is used for encrypting and decrypting a single integer. Converting
    larger (or different) pieces of information into (possibly big) numbers is the
    first step towards encoding them. Because RSA is a slow method, it is generally
    used to encrypt the key of a quicker algorithm. This supplemental technique uses
    the key decrypted by RSA to decode the rest of the message.


    To decipher the algorithm mathematically, one must first solve the factoring issue
    (find the two prime numbers that, when multiplied, produce the given result).
    When the chosen numbers are large enough, the problem is difficult to solve by
    brute force, and there is currently no easier analytic solution.


    #### Memetic Algorithm'
