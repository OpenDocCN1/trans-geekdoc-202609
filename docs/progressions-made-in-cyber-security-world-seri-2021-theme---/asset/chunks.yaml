    [16]。 |


    上表显示，各种类型的内部威胁框架利用不同的用户行为建模技术来检测恶意内部人员。因此，实施行为分析是为了提高对组织内恶意内部人员的精确检测。


    ## III. 方法论


    下面的 图. 1 显示了所提出的恶意内部威胁框架方法论，该框架使用行为分析检测组织中的恶意内部人员威胁。


    ### A. 数据集


    数据可以从组织的监控过程中获得，其中不同的日志文件，如电子邮件和网络日志、防火墙日志、网络流量捕获和不同类型的用户记录是常见的 [2]。从美国计算机应急响应小组
    (`US-CERT`) 收集的可用数据集包含了恶意内部人员和可疑活动的信息。该 2 数据集识别了恶意内部人员。该数据集数据包括：[`www.cmu.edu/tools/insider-threat-center/dataset-and-analysis-report.pdf`](https://www.cmu.edu/tools/insider-threat-center/dataset-and-analysis-report.pdf)
    包含了员工的活动数据。(ii) 组织信息。(i) 电子邮件、文件、访问日志、可移动设备等数据。


    ![图 1](img/page4.jpg)


    图. 1 方法论概述


    在 `CERT` 数据中，恶意和非恶性的活动如下：


    * 场景 1：个人在工作时间后，携带可移动驱动器并向 `wikileaks.org` 上传敏感信息。离职。

    * 场景 2：访问招聘门户网站并寻找竞争对手的机会。

    * 场景 3：尝试使用未经授权的软件收集凭据。

    * 场景 4：三个月来，个人频繁登录、搜索并转发敏感信息。

    * 场景 5：将敏感信息上传到 `Dropbox`。


    根据数据集版本，使用了特定的版本 `3.1`。


    ### B. 数据预处理


    主要的 `CERT` 数据包含 516 天的日志，其中 4000 个用户生成了 135,117,169 个事件。事件包括电子邮件、登录、设备、HTTP 操作、心理测量细节
    [3]。所选数据通过三个预处理步骤来适应检测。它包括数据集成、数据转换和数据级采样。


    #### 1. 数据集成


    恶意和非恶性的活动信息通过设备连接、登录状态和网站操作进行收集，用于检测恶意内部威胁。使用简单的特征拼接技术来整合所选记录。表 II 展示了集成数据的细节。


    | 序号 | 特征名称 | 解释 |

    | --- | --- | --- |

    | 1. | `InsiderThreat` | 恶意或否 |

    | 2. | `Vector` | 数据来源 (HTTP/登录/设备) |

    | 3. | `date` | 日期 |

    | 4. | `User` | 员工 ID |

    | 5. | `Pc` | 计算机的唯一标识 |

    | 6. | `Activity` | 员工在计算机上的实际活动 |


    #### 2. 数据转换


    集成数据需要数据转换以编码绝对值以便进一步处理。集成数据中的 `vector`、`pc`、`user` 和 `activity` 特征转换为数值。`date`
    的值被转换为周期数。


    表 III 显示了编码后的数据。


