    ### C. Logging Behavioral Analysis


    The behavior of each individual in an organization needs to be analyzed to detect
    the malicious insider threat. Logging behavior analysis using pre-processed data
    is used to get more insight into the activity of each individual in an organization.
    Based on the selected scenario, the visited website of each individual is analyzed
    to identify the malicious user behavior. It is accomplished by analyzing website
    activity to detect malicious activity. Website activity behavior is an efficient
