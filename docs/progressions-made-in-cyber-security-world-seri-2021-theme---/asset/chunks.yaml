    ## IV. RESULTS AND DISCUSSION


    From the above comparative analysis (Table III and Table IV) made between nine
    different supervised machine learning algorithms it is evident that the Decision
    Tree, Random Forest, AdaBoost, Neural Network based Multi Layer Perceptron (MLP),
    Logistic Regression accurately detect and classify the malware data points with
    100% accuracy at 0% error rate for Mobile Malware binary classification. Moreover,
    KNN algorithm classifies with 99.7%, SVM algorithm classifies with 99.9%, Naïve
    Bayes algorithm classifies with 90.9%, LDA algorithm classifies with 99.7% accuracy.
    When compared with Decision tree, Random forest, KNN, SVM, AdaBoost, MLP, Logistic
    Regression and LDA supervised model classifiers; the Naïve Bayes classifier model
    performs little low in accuracy for the given dataset.

