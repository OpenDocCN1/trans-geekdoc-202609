    ### Abstract

    Due to the rapid growth of android applications and mobile users in this technological
    era, there is large increasing cyber attacks on mobile phones through adware,
    spyware, banking malware, riskware and so on. Machine learning methods are very
    useful and amicable to detect mobilewares. Automation of mobile malware detection
    is the need of the hour and it is imperative to identify suitable machine learning
    techniques. This paper investigates the supervised machine learning algorithms
    to detect and classify into malware or benign. The purpose of evaluating supervised
    machine learning is to identify the best model with high efficacy. All important
    performance measures are applied and the entire experiments are conducted.


    **Keywords:** Machine Learning, Malware Classification, Mobile Malware, Supervised
    Learning, Python


