    Science and Mobile Computing, Vol. 2, Issue. 6, June 2013.


    9. Ranida Hamidouche, Zibouda Aliouat and Abdelhak Gueroui. “无线传感器网络基于遗传算法的低能高效聚类与路由”,
    Springer, Mobile, Secure, and Programmable Networking, January 2019.


