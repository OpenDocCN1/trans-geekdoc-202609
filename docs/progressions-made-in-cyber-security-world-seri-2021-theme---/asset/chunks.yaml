    ## B. 数据获取与导入


    开发监督机器学习模型的首要步骤是获取适当的数据集并将其导入到工作环境中。`Python` 是一个支持大量机器学习算法的卓越平台，它是实验机器学习模型方法的合合适环境。在这一步中，获取的恶意软件数据集被转换为
    `CSV` 文件格式并导入到 `Python Jupyter notebook` 环境中。


    ## C. 数据预处理


    导入数据集后，要执行的后续步骤是数据预处理。数据预处理是从分类器模型中获得最佳结果的重要步骤。数据预处理通过验证所选数据集是否包含空值、未定义值或无关值来进行，这些值可能会偏离结果并降低模型性能。空值被替换为“零
    (0)”或“未知”数据值以解决处理问题。应用 `Label encoding` 方法将属性转换为整数数据类型格式，以开发合适的机器学习模型。为了开发 ML
    模型，整个数据集被划分为训练集和测试集，比例为 70% 训练和 30% 测试。完成此步骤后，数据集现在已以良好定义的格式可用，供进一步处理。


    ## D. 特征选择


    特征选择是机器学习过程中特征工程的一个重要步骤。特征工程是机器学习过程中的第三步，它从原始数据集中提取特征，为适当的分类提供标签。使用以下特征选择方法从给定数据集的
    35 个属性中精确选出最重要的前 10 个特征。


    ### i. 单变量特征选择


    单变量特征选择是一种统计技术，用于识别与目标变量具有强相关性的相关特征。`Python` 中的 `scikit-learn` 库包含一个名为 `SelectKBest`
    的函数。本研究使用 `SelectKBest` 类，通过卡方统计检验从移动端恶意软件数据集的 35 个特征中选出前 10 个特征。它计算目标类中每个非负特征的卡方系数，并选择具有最高卡方分的目标前
    10 个特征。


    **卡方公式：**


    $X^{2} = {\\sum\\frac{\\left( {Observed\text{?}value - Expected\text{?}value}
    \\right)^{2}}{Expected\text{?}Value}}$


    ### ii. 基于特征重要性的特征选择


    使用 `python` 工具 `feature importance` 利用集成模型的特征重要性属性来选取数据集的重要特征。数据集的每个属性都被赋予一个分数。分数越高，该特征对目标变量的显著性或相关性越高。使用带有
    `Extra tree classifier` 方法的 `python sklearn ensemble model`，系统计算出前 10 个特征并显示所有计算特征的得分。


    ### iii. 递归特征消除 (RFE)


    递归特征消除是通过递归删除特征，然后使用剩余属性开发分类器模型来实现的。模型通过使用 `python sklearn feature selection library`、`RFE`
    方法和 `logistic regression classifier` 算法递归地消除最小特征，从而选择数据的前 10 个特征；选定的特征在 `support
    array` 中显示为 True，并使用 `ranking array` 中的选项“1”对特征进行排序。


    在结合了三种不同的特征选择方法后，根据三种不同特征选择方法中属性出现频率最高的特性选出前 10 个特征。这种选择有助于在最佳时间内选择恶意软件数据点。图 2
    显示了表 I 所示 35 个特征中选出的前 10 个特征。选出的前 10 个特征列如下：


    *   `hash`

    *   `state`

    *   `static_prio`

    *   `vm_truncate_count`

    *   `map_count`

    *   `total_vm`

    *   `reserved_vm`

    *   `nvcsw`

    *   `nivcsw`

    *   `utime`


    ![基于三种特征选择方法的选定特征](img/page15_1.jpg)


    ## E. 监督机器学习模型


    第四阶段是模型构建。从 35 个属性中选出前 10 个特征后，现在数据已准备好开发模型。以下是九种用于恶意软件或良性分类的监督算法：


    1.  决策树

    2.  随机森林

    3.  `KNN`

    4.  `SVM`

    5.  朴叶贝斯

    6.  AdaBoost

    7.  神经网络 (`MLP`)

    8.  逻辑回归

    9.  线性判别分析


    上述监督学习算法使用 `python Scikit learn` 库开发。开发上述用于移动恶意软件分类的监督机器学习模型的通用步骤如下：


    *   **步骤 1:** 导入必要的 `Scikit learn` 监督机器学习库。

    *   **步骤 2:** 将监督机器学习模型拟合到给定的训练集。

    *   **步骤 3:** 根据训练数据预测测试结果。

    *   **步骤 4:** 然后，执行测试数据预测并计算准确率。

    *   **步骤 5:** 最后，监督机器学习分类器模型准备就绪。


    每个监督机器学习算法根据其自身的计算属性阈值的机制来检测和分类数据点。模型参数的权重用于最终分类。表 II 描述了检测和分类移动数据点的标准。


