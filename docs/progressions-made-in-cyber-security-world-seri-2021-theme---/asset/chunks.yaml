    本文的主要贡献是设计了一套系统方法，用于测试适用于安卓移动恶意软件检测的监督式机器学习模型。本文分为机器学习工作流的不同阶段。第一步是获取数据集并分析数据，以适应后续的开发过程。研究采用的恶意软件数据集包含
    100,000 条记录，具有 35 个特征属性。第二步中，应用数据预处理方法检查数据是否包含任何空值或无关值，这有助于移除不需要的数据值，然后按照 70:30
    的比例将数据划分为训练集和测试集。第三步，应用特征选择方法寻找数据集中的重要特征。从数据集中显著特征将有助于减少数据处理时间，并为机器学习算法提供更高的准确性。该方法使用了三种不同的特征选择算法，即：（i)
    `Univariate Selection`（单变量选择）、(ii) `Feature Importance`（特征重要）、(iii) `Recursive
    Feature Elimination`（递归特征消除）。通过应用上述特征选择方法，从 35 个特征中选择了前 10 个重要特征用于有效的恶意软件分类。第四步，应用监督学习算法将数据识别并分类为
    `malware/benign`（恶意软件/良性）。评估了以下机器学习算法：


    1. `Decision tree`（决策树）

    2. `Random forest`（随机森林）

    3. `Nearest Neighbors (KNN)`（最近邻）

    4. `Support Vector Machine (SVM)`（支持向量机）

    5. `Naïve Bayes`（朴素贝叶斯）

    6. `AdaBoost`

    7. `Neural Network (MLP)`（神经网络）

    8. `Logistic Regression`（逻辑回归）


    第五步，使用各种评估指标评估机器学习模型的性能，为移动恶意软件检测提供最佳模型。


    ## II 问题定义


    为了实现移动恶意软件检测的自动化，有必要开发一个系统的框架。本研究应用机器学习算法来检测和分类移动恶意软件。实现并评估了九种不同的机器学习算法，并根据性能确定了最合适的机器学习模型。


    ## III 方法论


    本文开展了基于监督学习技术的动态行为移动恶意软件分类研究。整个方法分为五个阶段。工作的第一阶段是获取合适的数据集。第二阶段涉及数据预处理，通过删除重复记录、噪声数据以及将空值转换为定义良好的格式来研究数据质量。第三阶段应用
    `Feature Selection`（特征选择）方法寻找数据集中的最佳特征，力求以更短的处理时间高效地检测或分类恶意软件数据。第四阶段是构建九种不同的监督学习模型，这些模型根据训练数据自动检测和分类恶意软件数据。第五阶段是对上一阶段开发的九种不同监督学习模型进行对比分析，通过使用性能指标进行评估，以建议能够准确检测和分类恶意软件点的最佳分类器。图
    1 展示了本文遵循的方法步骤。


