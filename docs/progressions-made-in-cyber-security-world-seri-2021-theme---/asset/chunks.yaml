- raw: 'WSNs are a key component of the Internet of Things (IoT), which uses IoT devices
    to monitor and provide useful data from the environment to users. Home automation,
    forest monitoring, healthcare systems, precision agriculture, and smart city development
    are all examples of IoT applications today. In the monitoring region, IoT devices
    or sensors sense various physical factors like as pressure, humidity, and temperature,
    and communicate this useful information to the Base Station (BS) via single-hop
    or multi-hop communication. Sensor nodes have energy restrictions in WSNs for
    IoT.


    Several issues with the clustering process, such as energy hole and network segmentation,
    severely reduces network longevity and subsequently leads to possibilities of
    cyber threats. In this scenario, the need for securing the sensor network from
    various cyber threats arises. These threats may either harm the individual nodes
    on the network or the entire sensor network. Cluster Head (CH) nearby sensor nodes
    relay more data packets than far away sensor nodes, resulting in the early mortality
    of the CH nearest sensor nodes in the clustering mechanism. Faraway sensor nodes
    have enough energy for data transmission in this situation, but they are unable
    to transmit data packets to the CH and BS due to a lack of network structure and
    this tends to be an energy hole problem. Due to the energy hole issues, the network
    has been divided into numerous distinct portions. Dividing the network into partitions
    thus leads to cyber security threats and hence the cyber risks grow in complexity.
    Due to the lack of appropriate communication links, certain portions are unable
    to communicate to the Base Station.


    Encryption and decryption are two data transformations defined by a cryptosystem.
    To generate cipher text, encryption is applied to plain text, i.e. the data to
    be transferred. i.e. data that has been encrypted using an encryption key. The
    decryption key is used to transform cypher text to plain text, which is the original
    data. Symmetric cryptography is defined as encryption and decryption keys that
    are the same or can be deduced from one another.


    One key, known as the private key, is kept private, while the other, known as
    the public key, is made public. The public key encrypts the communication, which
    can only be decrypted with the private key. As a result, anyone with the public
    key cannot decrypt the encrypted message, allowing for safe communication. The
    most prominent public key algorithm called RSA (named after its creators Rivest,
    Shamir, and Adleman) \[[8](#08_ch3.xhtml#r3_8)\] is adapted.


    The deployed nodes are usually immobile, and the sink position in traditional
    data collection algorithms is usually fixed. Due to the high overhead of relaying
    messages, sensor nodes close to the static sink use more energy than those further
    away. Because of the issue, sensor nodes near the static sink perish significantly
    faster than other nodes, reducing network longevity \[[1](#08_ch3.xhtml#r3_1)\].
    And, this concern eventually increases the possibility of cyber threats.


    Heterogeneous nodes have significantly greater communications and data processing
    capabilities than common nodes. However, heterogeneous nodes are expensive, and
    it is vital to investigate how to balance energy consumption and to extend network
    lifetime \[[2](#08_ch3.xhtml#r3_2)\].


    Data redundancy keeps track of every transfer in the network and helps to prevent
    Denial-of-Service attacks. Authentication, risk assessment, and data security
    are application layer security requirements for the protection of digital content,
    which is very important in order to secure the environment. External authentications
    are required in order to grant access to data and information.


    The remaining part of the paper is organized as follows: [Section II](#08_ch3.xhtml#c3_2)
    surveys the related work process of IoT enabled Wireless Sensor Networks, Network
    Security and the evolution of Cyber Threats. [Section III](#08_ch3.xhtml#c3_3)
    explains the Problem Statement. [Section IV](#08_ch3.xhtml#c3_4) derives the Proposed
    Work and algorithm details. [Section V](#08_ch3.xhtml#c3_5) explains the Simulation
    Environment and Performance Metrics details. Results and Discussion are described
    in [Section VI](#08_ch3.xhtml#c3_6). [Section VII](#08_ch3.xhtml#c3_7) explains
    the conclusion the paper.


