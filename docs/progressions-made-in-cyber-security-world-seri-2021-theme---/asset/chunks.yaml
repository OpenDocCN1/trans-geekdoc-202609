  trans: '


    对于支持物联网的无线传感器网络，采用了一种基于移动基站的数据收集策略的遗传算法来提高网络性能。所提方法包含一种新的聚类策略，其中使用带有 Powell 共轭梯度机制的遗传算法来执行簇类节点（CH）选择和聚类构建。该方法显著地减少了聚类创建的消息开销。另一方面，带有
    Powell 共轭梯度机制的遗传算法负责寻找合适的 `CHs` 数量，以最小化数据传输的能量损失。在所提方法中，移动基站选择最佳的数据收集通道从多个 `CHs`
    收集数据，从而显著降低了端端延迟。`RSA` 算法使用公密钥加密位，这对解密时间和加密系统强度有很大影响。这最终降低了网络遭受网络威胁或风险的可能性。我们展示了多种仿真结果来评估建议方案的性能。结果表明，该算法在吞吐量、网络寿命、能量消耗、数据包交付率、丢包和吞吐量方面优于现有方法。


    ## 参考文献


    1. Chuan Zhu, Kangning Quan, Guangjie Han and Joel J.P.C. Rodrigues. “一种用于无线传感器网络的移动基站高可用位置预测数据收集方案”,
    Computer Networks, Vol. 145, November 2018.


    2. Chunlin Li, Jingpan Bai, Jinguang Gu, Xin Yan and Youlong Luo. “基于混合整数规划的异构无线传感器网络聚类路由”,
    Ad Hoc Networks, Vol. 172, April 2018.


    3. Gurbinder Singh Brar, Shalli Rai, Vinay Chopra, Rahul Malhotra, Houbing Song
    and Syed Hassan Ahmed. “用于无线传感器网络的基于方向的低能高效型 PDORP 路由协议”, IEEE Access, Vol. 4,
    June 2016.


    4. Jianhua Huang, Danwei Ruan and Weiqiang Meng. “一种基于环形扇区辅助的无线传感器网络能量高效多跳路由协议”,
    Computer Networks, Vol. 147, December 2018.


    5. Jianhua Huang, Yadong Hong, Ziming Zhao and Yubo Yuan. “一种基于网格聚类的无线传感器网络能量高效多跳路由协议”,
    Cluster Computing, Vol. 20, June 2017.


    6. Mbanaso, U. M. and Chukwudebe, G.A “分布式系统中物联网安全的需求分析”, 2017 IEEE 第三届国家发展电子技术国际会议
    (NIGERCON), Ieee, Vol. 5, Issue 7, February 2018.


