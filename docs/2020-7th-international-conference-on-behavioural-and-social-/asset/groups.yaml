    # V. DISCUSSION AND FUTURE WORKS


    In this study, we built a supervised learning model to detect fake news on social
    media. Our model used expressed features, users'' credibility and user networks.
    We used LSTM and GRU vector to extract users'' emotions. credibility was evaluated
    using RandomAlgorithm. We used real world data to test our model: News Precision
    and Accuracy. When using data from the beginning of the news our model reaches
