    # V. DISCUSSION AND FUTURE WORKS


    In this study, we built a supervised learning model to detect fake news on social
    media. Our model used expressed features, users'' credibility and user networks.
    We used LSTM and GRU vector to extract users'' emotions. credibility was evaluated
    using RandomAlgorithm. We used real world data to test our model: News Precision
    and Accuracy. When using data from the beginning of the news our model reaches
    accuracy of 71.10 on Politfact and 68.07 on Gosossip. That is better than the
    baseline. Compared to supervised learning your model reached competitive scores.
    As future work, the scores of the proposed models will be improved. Some of the
    tasks will consist in building a bigger network and using users'' activity on
    social media for evaluation of credibility. During our study, we noticed that
    the available datasets are all about one language. Therefore, we will build a
    large language dataset and analyze the impact of languages on news classification.

