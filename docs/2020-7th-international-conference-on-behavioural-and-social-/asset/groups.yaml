    # III. METHODS


    The proposed model is composed of 4 major blocks: opinion extraction block, users''
    credibility assessment block, users'' construction block and the classifier. Given
    a news $n$ we get $t$ tweets as output. For each tweet $t_i$, we extract the replies
    $r_{i1},\dots,r_{it}$ and the characteristics of the users $u_{i1},\dots,u_{it}$
    where $u_i$ is the characteristics of the author of $t$. $[r_{i1},\dots,r_{it}]$
    is used as input of the opinion extraction block and credibility block. The number
    of users who replied to $t$ is the output of the opinion block $o_{i1},\dots,o_{it}$
    and the output of the credibility assessment block $c_{i1},\dots,c_{it}$ are concatenated.
    We assume that the result of concatenation of the author of $t$ is 1. $(L, G_0),
    (o_{i1},\dots,o_{it}, c_{i1},\dots,c_{it})$ and the network $N$ are used as input
    of our classifier SSLNES.


