    $\sigma(C(u_i)),\sigma(C(u_j)) = 1$ 意味着两个用户的特征相似，$\sigma(C(u_i)),\sigma(C(u_j))
    = 0$ 意味着它们的特征不相似。当相似性超过阈值 $tau$ 时，我们用此对用户进行聚类。该值随不同的领域。我们使用以下公式对用户权重进行聚类。


    $\omega C_i = \frac{\sqrt{|C_i}|}{\sum \sqrt{|C_j|}}$


