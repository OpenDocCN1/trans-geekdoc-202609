    ### C. User''s network


    To build the users'' network, we consider all the followers of the users who posted
    a tweet about a news article. The algorithm 1 represents the algorithm of the
    construction of the Network. Up represent the vectors of users who posted the
    news $n$. Ur represents the vectors of users who replied to the news $n$. The
    complexity of the algorithm is $O(x^2)$.


    # Algorithm 1 Network Builder


    ```

    **Input:** $U_p, U_r$

    **Output:** $N : a$ matrix

    $y \leftarrow [U_p]$

    $z \leftarrow [U_r]$

