    a supervised CNN and an unsupervised CNN. Samples $x_i$ as inputs is the concatenation
    of the outputs of the two previous networks for the test $y_i$ ($0$ if it is not
    labeled and $1$ otherwise). The cross-entropy loss $l^s$ is calculated only for
    these samples. $l^u$ represents the output of the unsupervised. The weights of
