    **摘要—** 虚假新闻已成为一个重要的研究课题。这是由于虚假新闻对互联网和社交媒体的影响。许多研究中提出的模型是基于监督学习的。因此，这些模型无法处理海量的未检测的虚假新闻数据。很少有研究关注早期检测。我们提出了一种在早期检测社交媒体上虚假新闻的方法。通过使用半监督学习，我们使模型能够处理大量的未标记数据。我们使用了一种方法提取内容中表达的查询，并使用
    CredRank 评估用户的可信度并构建分类器。SSL 由三个网络组成：一个共享 CNN、一个无监督 CNN 和一个监督 CNN。我们在 25% 的标记数据上评估了
    SSL，结果显示 SSL 在政治类（Politic）上的准确率达到 72.57%，在八卦类（Gossip）上的准确率为 70.35%。当使用新闻开始前 10
    分钟内的数据时，SSL 在政治类上的准确率达到 71.10%，在八卦类上的准确率为 68.07%。


    社交媒体上的故事质量远低于传统新闻机构。社交媒体用户接触到大量的误导性信息和虚假信息，从而产生了虚假新闻 [1]。虚假新闻的影响对各种个人和社会产生了负面影响
    [2]。社交媒体上的虚假新闻比传统媒体上的更复杂。检测过程的任务更加复杂且具有挑战性。


    检测社交媒体上的虚假新闻已成为一个具有挑战性的研究领域。研究人员通过以下方式进行研究：一些研究关注新闻的内容 [3]，这种方法包括从文本和视觉内容中提取特征以分类新闻文章。然而，这种方法具有局限性，因为新闻传播者可以设计新闻使其难以被检测为虚假。另一些研究关注用户的特征。还有一些人认为新闻
    [5], [6]。基于用户特征进行分类，存在结果偏见的高风险，导致了在不考虑新闻性质的情况下独立地考虑真假新闻。一些研究人员侧重于分析新闻的传播，另一些则关注用户对新闻的反应。这些方法都有局限性。检测和新闻中的路径可能会在传播之初被作者操纵。正如我们所注意到的，所有提出的方法都有局限性，为了更好地分类新闻而进行的检测
    [7], [8]。少数研究关注早期阶段的虚假检测，其中大多数研究为虚假新闻检测提出了监督学习模型。（注：由于页面断开，部分文本似乎是碎片化的）。


    **索引术**—虚假检测，半监督学习，可信度评估


