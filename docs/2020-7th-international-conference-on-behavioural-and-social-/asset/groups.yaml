    tanh 作为激活函数。网络的输出代表了内容中表达的意见：1 表示作者同意该用户，0 表示他/她不同意。我们将 sentiment140 数据送去测试。


    其中 $\omega C_i$ 代表分配给带有成员簇的权重。该值代表了与成员相关的可信度。


