    $t$ 作者的特征。$[r_{i1},\dots,r_{it}]$ 被用意见提取模块和可信度模块的输入。回复 $t$ 的用户数量是意见模块的输出 $o_{i1},\dots,o_{it}$
    以及可信度评估模块的输出 $c_{i1},\dots,c_{it}$ 拼接在一起。我们假设 $t$ 作者的拼接结果为1。$(L, G_0), (o_{i1},\dots,o_{it},
    c_{i1},\dots,c_{it})$ 以及网络 $N$ 被用我们分类器 SSLNES 的输入。


    ![](img/3ee17d1bf468a266874217a050d4d552_2_0.png)


    - 用户的粉丝数量；

