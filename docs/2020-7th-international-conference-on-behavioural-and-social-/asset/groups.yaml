    - We find users with similar characteristics. We use hierarchical clustering method
    to cluster users into clusters. The similarity is determined using


    $\sin(u_i, u_j) = \sigma(C(u_i), C(u_j))$


    Where $C(u_i)$ represents the characteristics of the user and $\sigma(C(u_i),
    C(u_j))$ represents the similarity between the characteristics of $u_i$ and $u_j$.
    In our model, we use jaccard similarity to evaluate the similarity between users.
    We have:


    $$\sin(u_i, u_j) = \frac{C(u_i) \cap C(u_j)}{C(u_i) \cup C(u_j)}$$


    ![](img/3ee17d1bf468a266874217a050d4d552_2_1.png)


    Fig. 1: Flowchart of the method


    $\sigma(C(u_i)),\sigma(C(u_j)) = 1$ means that two users'' characteristics are
    similar and $\sigma(C(u_i)),\sigma(C(u_j)) = 0$ means that their characteristics
    are not. We use this to cluster users if their similarity exceeds the threshold
    $tau$. The value of that varies for different domains. We use the following formula
    to cluster users'' weights.


    $\omega C_i = \frac{\sqrt{|C_i}|}{\sum \sqrt{|C_j|}}$


    The flowchart of our opinion extraction model is shown in figure 2. We use GloVe
    as an embedding layer of the network [16]. The text extracted from the replies
    to a tweet is input of the embedding layer. The output of that layer is input
    to the LSTM units. We use tanh as activation function. The output of the network
    represents the opinion expressed in the content: 1 means that the author agrees
    with the user and 0 means he/she does not agree. We sent sentiment140 to the test.


    where $\omega C_i$ represents the weight assigned to the cluster with the members.
    This value represents the credibility associated with the members.


