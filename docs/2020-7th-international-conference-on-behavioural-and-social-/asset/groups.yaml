    # V. 讨论与未来工作


    在本研究中，我们构建了一个用于检测社交媒体虚假新闻的监督学习模型。该模型使用了表达特征、用户信誉和用户网络。我们使用 LSTM 和 GRU 提取用户情感。信誉通过随机算法进行评估。我们使用了真实世界的数据来测试模型：新闻精确率和准确率。当使用从新闻开始的数据时，我们的模型在
    Politfact 上的准确率达到了 71.10%，在 Gosossip 上达到了 68.07%。与基准方法相比，该模型监督学习模型取得了具有竞争力的得分。未来的工作将包括构建更大的网络，并利用用户在社交媒体上的活动来评估信誉。


