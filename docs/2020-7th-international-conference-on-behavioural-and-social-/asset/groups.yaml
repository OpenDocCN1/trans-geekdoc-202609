    **摘要—** 虚假新闻已成为一个重要的研究课题。这是由于虚假新闻对互联网和社交媒体的影响。许多研究中提出的模型是基于监督学习的。因此，这些模型无法处理海量的未检测的虚假新闻数据。很少有研究关注早期检测。我们提出了一种在早期检测社交媒体上虚假新闻的方法。通过使用半监督学习，我们使模型能够处理大量的未标记数据。我们使用了一种方法提取内容中表达的查询，并使用
    CredRank 评估用户的可信度并构建分类器。SSL 由三个网络组成：一个共享 CNN、一个无监督 CNN 和一个监督 CNN。我们在 25% 的标记数据上评估了
    SSL，结果显示 SSL 在政治类（Politic）上的准确率达到 72.57%，在八卦类（Gossip）上的准确率为 70.35%。当使用新闻开始前 10
    分钟内的数据时，SSL 在政治类上的准确率达到 71.10%，在八卦类上的准确率为 68.07%。


    社交媒体上的故事质量远低于传统新闻机构。社交媒体用户接触到大量的误导性信息和虚假信息，从而产生了虚假新闻 [1]。虚假新闻的影响对各种个人和社会产生了负面影响
    [2]。社交媒体上的虚假新闻比传统媒体上的更复杂。检测过程的任务更加复杂且具有挑战性。


    检测社交媒体上的虚假新闻已成为一个具有挑战性的研究领域。研究人员通过以下方式进行研究：一些研究关注新闻的内容 [3]，这种方法包括从文本和视觉内容中提取特征以分类新闻文章。然而，这种方法具有局限性，因为新闻传播者可以设计新闻使其难以被检测为虚假。另一些研究关注用户的特征。还有一些人认为新闻
    [5], [6]。基于用户特征进行分类，存在结果偏见的高风险，导致了在不考虑新闻性质的情况下独立地考虑真假新闻。一些研究人员侧重于分析新闻的传播，另一些则关注用户对新闻的反应。这些方法都有局限性。检测和新闻中的路径可能会在传播之初被作者操纵。正如我们所注意到的，所有提出的方法都有局限性，为了更好地分类新闻而进行的检测
    [7], [8]。少数研究关注早期阶段的虚假检测，其中大多数研究为虚假新闻检测提出了监督学习模型。


    **索引术**—虚假检测，半监督学习，可信度评估


    # I. 引言


    如今，人们在互联网上花费大量时间。最常用的应用程序一些是社交媒体网站。一些知名的包括我们每天使用的 Twitter、微博、Facebook、WhatsApp
    和微信。这些社交媒体被用户用来分享新闻。从社交媒体获取新闻比从传统媒体更具优势。社交媒体上的新闻质量远。社交媒体用户接触到大量的误导性信息和虚假信息，产生了虚假新闻
    [1]。虚假新闻的影响对各种个人和社会产生了负面影响 [2]。社交媒体上的虚假新闻比传统媒体上的更复杂。检测过程的任务更加复杂且具有挑战性。


    检测社交媒体上的虚假新闻已成为一个具有挑战性的研究领域。研究人员通过以下方式进行研究：……（此处省略重复段落，直接进入核心问题）在该研究中，我们的目标是构建一个在早期阶段检测虚假新闻的简单模型。我们从社交媒体的回复中提取意见来判断新闻的真假。


    （注：原文中存在大量重复内容，译文已整合核心引言逻辑内容。）


    据我们所知，目前尚未对社交媒体上的虚假新闻进行基于用户意见和可信度评估的分类研究。这种方法基于以下研究问题：

    - Q1: 如何从评论中提取用户意见？

    - Q2: 如何评估社交媒体上的可信度？

    - Q3: 如何结合用户意见和网络来检测虚假新闻？

    - Q5: 这些元素对虚假新闻的影响如何？


    本文组织结构如下：首先我们介绍相关工作。在第三节中描述我们的方法。之后，我们介绍数据和实验结果。最后在第五节中总结工作。


    # II. 相关工作


    以往的工作主要区别在于它们的使用方式。在此，我们将描述一些使用内容、社交上下文以及使用特征组合的研究。


    ### A. 基于内容


    基于内容的模型从新闻中提取特征以预测欺骗。它们集中在语言线索和基于视觉的方法。引入了文本分析和基于知识的方法来检测虚假新闻，它们包含一些煽动或负面的特征。Castillo
    等提取了标签、特殊字符、情感、正面/负面词汇来分类新闻 [9]。他们分析了趋势话题并预测是否可信。他们的模型性能为 0.754。Guo 等提出了一种学习内容和情感来检测
    Twitter 上虚假新闻的模型 [10]。他们的模型从两个组件学习情感：第一个组件学习发布者的情绪，第二个组件学习其他用户的绪。这种方法基于社交媒体互动分析。这些技术使用用户和网络作为代表消费的特征。社交上下文可以分为基于传播的基于立场的。


    ### B. 基于传播


    基于立场的模型使用观点对文章分类。文章的立场可以是显性的或隐性的。隐性立场从社交媒体帖子和对 Facebook 的直接意见表达（仇恨和关于）中提取。立场检测是自动判断文本是否支持、反对或对某个目标保持中立的任务
    [12]。Tacch 构建了用户和 Facebook 的二部网络，将“赞”立场作为信息 [13]；基于此，使用监督学习模型预测 Facebook 帖子的可能性。


    ### C. 混合方法


    混合模型结合基于内容和基于社交的方法，代表了以往方法的替代方案。


