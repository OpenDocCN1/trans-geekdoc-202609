  md: '# B. Experiments setup


    We set the dropout to 0.5; the number of epochs was set to 50; minibatch size
    and the maximum learning were respectively set to 100 and 0.001. We used Adam
    optimizer optimization algorithm [20]. Our baseline algorithms were used to compare
    the performance of our model: Naive Bayes, Decision Tree, SVM and PCC_RNN+CNN
    [21]. To evaluate the performance of our model, we used the metrics accuracy,
    F1-Score and recall. Our problem is a classification problem. We predict whether
    a news is true or not:


    +   - True Positive (TP): correctly predicted true news;

    - True Negative (TN): correctly predicted fake news;

    - False Negative (FN): true news predicted as fake news;

    - False Positive (FP): fake news predicted as true news,


    Then we can define our metrics as follows:


    ```

    $Precision = \frac{TP}{TP+FP}$$

    ```


    ```

    $Recall = \frac{TN}{TN+FN}$$

    ```


    ```

    $F1 = 2 \times \frac{Precision \times Recall}{Precision + Recall}$

    ```


    ```

    $Accuracy = \frac{|TP| + |TN|}{|TP| + |TN| + |FN| + |FN|}$

    ```


