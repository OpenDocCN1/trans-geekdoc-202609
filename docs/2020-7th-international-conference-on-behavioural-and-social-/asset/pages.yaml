    In this study, our objective is to build a simple supervised learning model to
    classify news at the early stage of its spread. We extracted the expressed opinion
    in the replies to the given news, evaluated the credibility of the users who posted
    a tweet or replied the news and determine whether the news is fake or real. By
    making the concern towards the sub-sections. These sections are based on following
    the research questions.


    +   - Q1: How to extract users'' opinion from comments?

    - Q2: How to evaluate users'' credibility on social media?

    - Q3: How to combine users'' user opinion, users'' credibility and network to
    detect fake news?

    - Q5: What is the influence of these elements on fake news?


    To the best of our knowledge, none of the former research about news classification
    on social media has taken consideration users'' credibility. This study is one
    of the first to combine opinion, users'' credibility and use network for news
    classification. The paper we present is organized as follows. First we present
    related works. In section III we describe our approach. After that, we present
    our data and the experimental results. And finally in section V, we conclude some
    works.


    # II. RELATED WORKS


    Previous works mainly differ on how they are used. In this, we will describe some
    previous studies using content news, social context and those using a combination
    of features.


    # A. Content-based


    Content-based models extract features from news to predict the deception cues.
    They are centralized on linguistic cues and visual-based approaches. Approaches
    constructed in text analysis, and knowledge-based approaches to detect fake news
    are introduced, they can contain some features that are inflammatory or negative.
    Castillo et al. extracted linguistic features like hashtags, special characters,
    emotion sentiment, positive/negative words to classify news stories [9]. They
    analyzed related to "trending" topics and predicted whether they are credible
    or not. The performance of their model was 0.754. Guo et al. proposed a model
    that learns content and emotion to detect fake news on twitter [10]. Their model
    learns emotions from two components. The first component learns emotions expressed
    by the publisher, the second learns emotions expressed by other users. The purpose
    of these two components are


    This approach is based on social media engagement analysis. These techniques use
    users and networks as, social context features representing the users of consumption
    on social media. Social contexts can be categorized into propagation-based and
    stance-based.


    Stance-based models classify articles using users'' view. The stance of articles
    can be explicit or implicit. Implicit stances are extracted from social media
    posts and direct expressions of opinion ("hates and about") on Facebook. Stance
    detection is the task of automatically determining whether the text is in favor
    of, or neutral towards a proposal or target [12]. Tacch constructed a bipartite
    network of user and Facebook using the "like" stance as information [13]; based
    on this, the likelihood of Facebook posts was predicted using a supervised learning
    model. Propagation models use elements of related social media posts to classify
    news. These approaches assume that there is a correlation between the credibility
    of a news and the credibility of the social media post. J. Ma et al. evaluated
    the similarities between the page structures of the rumors to capture their high-order
    pattern differing types [14]. The result of their work demonstrates that the kernel-based
    approach is effective for accurate rumor detection.


    # C. Hybrid-based


    Hybrid-based models combine content-based and social-based approaches represent
    an alternative to the previous approaches. Content-based and social context-based
    approaches are mostly tailored of specific characteristics, they restrict the
    power of the techniques. Combining content-based and social-based techniques increases
    the accuracy of the detection models. Castillo et al. combined content-based,
    user- and propagation-based features to evaluate credibility on Twitter [9]. Kwon
    et al. explored set of users linguistic and temporal features by combining user
    and linguistic features much [15]. They found consistently over short and long-time
    windows.'
