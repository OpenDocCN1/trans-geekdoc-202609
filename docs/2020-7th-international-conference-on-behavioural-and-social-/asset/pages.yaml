    background: Feminist and GossipCop [19]. Both are extracted from Twitter. The
    statistics of the two datasets are described in table V. Since our model is based
    on users'' characteristics, reply and contents users, we treated these two datasets
    to get final datasets. We used, python api to retrieve the missing values of users.
    We then built a web crawler to get the replies to the tweets. In fact, Twitter
    API can only fetch the replies not after that day. As our datasets were built
    in 2018, we could get the replies that were web. Then, we used to get the characteristics
    of all the users and all of the followers who posted a tweet about a given news.
    The final features of our datasets are presented in table I. In GossipCop contains
    a lot of data. For simplicity, we only consider the first 1000 tweets and 400
    real news. The statistics of the datasets are described in tables II and III.
    For each category we used the set of $U_p$ or $\sum_{j \in N} ||U_r|| = 2b$, where
