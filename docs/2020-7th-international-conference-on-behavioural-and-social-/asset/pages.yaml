    # B. User''s credibility assessment


    In our study, we use the model described in [18] to evaluate users'' credibility.
    That model, called CredRank algorithm, uses users'' behavior based on users''
    characteristics:


    +   - Whether the user''s account is a verified account or not;

    - The number of statuses posted by the user;

    - The geo-localization of the user is enabled or not;


    # C. User''s network


    To build the users'' network, we consider all the followers of the users who posted
    a tweet about a news article. The algorithm 1 represents the algorithm of the
    construction of the Network. Up represent the vectors of users who posted the
    news $n$. Ur represents the vectors of users who replied to the news $n$. The
    complexity of the algorithm is $O(x^2)$.'
