    **Abstract—** Fake news has become an important topic of research. This is due
    to the impact of fake news on the internet es on social media. Many of the models
    proposed in various studies are based on supervised learning. Therefore, these
    models are unable to handle the huge amount of undetected fake news data. Few
    studies focus on early detection. We propose a method to detect fake news on social
    media at an early stage. By using semi-supervised learning, we make model able
    to deal with the huge amount of unlabeled data. We use a method to extract queries
    expressed in content, which we used CredRank to evaluate users'' credibility and
    build a classifier. SSL is composed of three networks: a shared CNN, an unsupervised
    CNN and a supervised CNN. We evaluated SSL on 25% of labeled data, SSL reaches
    an accuracy of 72.57% on Politic and 70.35% on Gosip. When using data before in
    the first 10 minutes of the beginning of the news, SSL reaches an accuracy of
    71.10% on Politic and 68.07% on Gosip.


