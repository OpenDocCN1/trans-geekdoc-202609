    Our classification model is represented in figure 3. It is a semisupervised model.
    We built it with through Shared CNN. The output of that network is in two networks:
    a supervised CNN and an unsupervised CNN. Samples $x_i$ as inputs is the concatenation
    of the outputs of the two previous networks for the test $y_i$ ($0$ if it is not
    labeled and $1$ otherwise). The cross-entropy loss $l^s$ is calculated only for
    these samples. $l^u$ is the output of the output of the unsupervised. $l^u$ represents
    the mean squared error. The weights of the optimization of $l^s$ and $l^u$ are
    with. The weights of the layers of the shared CNN contain 128 ($3 \times 3$) filters.
    The other layers contain 256 ($3 \times 3$) and 128 ($3 \times 3$) filters. A
    ($2 \times 2$) pooling is used for all layers. So z and pooling is used to get
    the final loss as:


    ```

    $Loss = -\frac{1}{|B|} \sum_{i \in B} \log(softmax(y_i)) + w(t) * \frac{1}{|C|}
    \sum_{i \in C} ||z_i - z_i''||^2$$

