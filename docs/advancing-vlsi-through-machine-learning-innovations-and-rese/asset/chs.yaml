  \ |\n| ME | 0.000144 | 4.1941 | 6.57E-06 | 2.95E-07 |\n\n### 8.3.2 增强型 TCAD-ML 设计\n\
  \n在传统的 ML 模型中，训练数据集在算法测试和输出预测期间，不允许使用训练数据集以外的输入参数。上一节使用的数据集被设计为包含两个输入变量 `L` 和 `t[c]`\
  \ 的数组，以及三个输出 `V[TH]`、SS、`I[ON]` 和 `I[OFF]`。之前的数据集不允许在预测输出时使用 `L` 和 `t[c]` 以外的输入变量。此外，ML\
  \ 模型相关的外推限制意味着如果给定的输入值（`L` 和 `t[c]`）超出训练数据集的范围，输出预测将失败。由于这些算法无法进行外推（训练外范围），因此算法训练需要大型数据集来覆盖整个范围以及所有考虑的输入组合。提取具有多种输入组合的此类海量数据会导致\
  \ TCAD 仿真时间和训练数据集规模的剧增。上述涉及 ML 模型设计和数据集设计的挑战反过来削弱了 TCAD 辅助 ML 的可行性和进展。为了规避上述挑战并增强\
  \ TCAD 辅助 ML 的实用性，本节针对算法训练和测试提出了一种之前数据集的替代设计。TCAD 仿真中使用的参数 `L` 和 `t[c]` 的范围和步长保持不变。\n\
  \n根据考虑范围内的 `L` 和 `t[c]` 的值定义了一个新参数 `((L * t[c]) / (L + t[c])) + log(L)`。选择该新参数是为了克服给定范围内\
  \ `L` 和 `t[c]` 值各种组合所引起的冗余。此外，将 `((L * t[c]) / (L + t[c])) + log(L)` 乘以因子 10⁹（所得参数表示为\
  \ `M`），以放大其相邻值之间的差异，从而实现算法的更好的训练。这是因为 `((L * t[c]) / (L + t[c])) + log(L)` 的值非常小，处于\
  \ 10⁻⁹ 量级。之前数据集中的两个输入参数（即 `L` 和 `t[c]`）被新定义的输入参数（即 `M`）替换。在提议的新数据集中包含 `M` 允许任何范围内选择\
  \ `L` 和 `t[c]` 值，只要 `M` 位于提议训练数据集的范围内即可。因此，在预测期间可以超越用于数据集生成的 `L` 和 `t[c]` 边界。这反过来规避了\
  \ ML 模型中的外推限制。此外，两个提取的器件特性 `I[OFF]` 和 `I[ON]/I[OFF]` 也作为输入参数包含在提议的新数据集中。在提议的新集中将\
  \ `I[OFF]` 和 `I[ON]/I[OFF]` 作为输入参数，允许在测试/预测期间使用任何器件参数（以及 `L` 和 `t[c]`）作为变量。可以将测试范围扩展到训练范围之外，并规避上述与传统训练数据集相关的输入限制。因此，用于算法训练的提议新训练数据集具有三个输入变量，即\
  \ `M`、`I[OFF]` 和 `I[ON]/I[OFF]`，以及输出 `V[TH]`。新训练数据集的三个输入参数均经过归一化。对于所考虑的可变参数 `L`\
  \ 和 `t[c]`，训练数据集中 `M`、`I[OFF]` 和 `I[ON]/I[OFF]` 的范围分别为 1E+09 到 854205674、3.8E-14\
  \ 到 1.69E-05 以及 7.95833 到 754122000。\n\nFigure 8.11 描述了实际 `V[TH]` 与训练 `V[TH]` 的比较，仅通过两个输入（即\
  \ `M` 和 `I[ON]/I[OFF]`）对趋势的三维可视化进行展示。Figure 8.11 中实际输出与训练输出的重叠是算法训练成功的证据。在实际和训练\
  \ `V[TH]` 之间计算性能指标 MSE 和 ME，以估计 GB 回器的训练精度。训练下获得的 MSE 和 ME 分别为 4.18E-15 和 8.65E-7。如所述，新训练数据集允许在测试/预测期间将任何器件参数以及\
  \ `L` 和 `t[c]` 作为输入变量。此外，新训练数据集还允许在测试/预测期间使用训练范围外的 `L` 和 `t[c]` 值。为了证明这些优点，本研究将沟道厚度\
  \ `t[si]`、栅极氧化层厚度 `t[ox]` 和沟道掺杂浓度 `N[A]` 作为与 `L` 和 `t[c]` 相同的可变器件参数，用于生成测试/预测的数据集。这些参数的考虑值所示在[Table\
