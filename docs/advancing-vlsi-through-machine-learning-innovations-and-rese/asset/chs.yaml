  \ 技术进展与应用的深度分析\n\nDebashish Dash 和 Manwendra Chauhan\n\nDOI: [10.1201/9781003483038-14](https://doi.org/10.1201/9781003483038-14)\n\
  \n## 14.1 引言\n\n晶体管作为现代电子设备的核心组件，其的发展得益于导体行业向小型化的不懈迈进。从简单的双极性结晶体管（`BJT`）到广泛使用的金属氧化物半导体场效应晶管（`MOSFET`），每一代晶体管都提升了性能和效率，加速了各个领域的科技进步。然而，随着传统\
  \ `MOSFET` 缩放接近极限，寻找能够维持摩尔定律的新晶体管架构变得愈发激烈。`hyper-FET` 是一种尖端竞争者，具有彻底改变晶体管市场的潜力。与\
  \ `MOSFET` 的平面结构不同，`hyper-FET` 采用全环绕栅极（`GAA`）架构，通道完全被栅极电极包裹 [1, 2, 3, 4]。这种创新设计提供了多项显著优势。\n\
  \n**降低栅极穿隧**：栅极与通道之间的紧密接触减少了电流，从而降低了功耗并提高了能量效率。\n\n**提高迁移率**：`GAA` 结构对通道具有更强的静电控制能力，使得更高的载流子迁移率更快的器件运行成为可能。\n\
  \n**更好的扩展性**：通过在不牺牲栅极控制的情况下缩短通道长度，`GAA` 形状推向了晶体管密度的极限 [5,6]。\n\n这些内在优势将 `hyper-FET`\
  \ 推向了晶体管研究的前沿，吸引了学术界和工业界的 7](#ch14.xhtml#r14_7), 8, 9 的高度关注。全球无数研究小组正在积极探索这项技术的潜力，该领域正见证材料工程、器件制造和电路设计的快速进步。\n\
  \n本章探索了 `hyper-FET` 迷人的领域，仔细分析了它们的基本概念、特征以及目前的技术水平 [10]。我们深入这一复杂的研究领域，考察了重大发现，识别了迫的问题，并考虑了可行的解决方案。我们还阐明了新的器件设计和不断发展的材料将如何在决定未来\
  \ `hyper-FET` 技术方向方面发挥关键作用（图 14.1](#ch14.xhtml#f14_1））。\n\n![图 14.1 Hyper-FET 结构。](img/Fig14_01.jpg)\n\
  \n图 14.1 Hyper-FET 结构。\n\n## 14.2 Hyper-FET 器件与应用\n\n为下一代电子设备寻找高效、高性能的晶体管促使了对新型材料和结构的研究。在这些迷人的竞争者中，`hyper-FET`\
  \ 是一种具有 `GAA` 设计并带有集成二氧化钒（`VO2`）这一诱人前景的新型晶体管 [11, 12, 13, 14, 15]。\n\n在提高 `hyper-FET`\
  \ 性能的各种方法中，一条引注目的路径涉及使用二氧化钒（`VO2`）[16]。这种材料之所以有趣，是因为它展现出惊人的绝缘到金属相变，这种相变可以通过电或热刺激引起。通过有意将\
  \ `VO2` 集成到 `hyper-FET` 架构中，科学家正在为超低功耗电子设备开启辟且迷人的途径。\n\n在绝缘状态下，`VO2` 当作动态栅极，在待机模式下实际上通过\
  \ `hyper-FET` 通道关闭电流。这显著减少了漏电流和静态功耗，这是传统晶体管中的主要瓶颈。通过引入电压或热脉冲，`VO2` 迅速过渡到金属相，恢复导电性并允许器件活跃工作。这种突破性方法为具有近零待机功耗的新电路设计提供了路径，显著提高了整体能量效率。\n\
  \n`VO2` 的集成也带来了自身的一系列挑战，需要对材料属性和器件制造技术进行精确控制。然而，潜在回报是巨大的，它突破了低功耗电子设备的边界，并为电池供电设备、移动计算和不断扩展的物联网（`IoT`）的应用开启了大门（图\
  \ 14.2](#ch14.xhtml#f14_2)）。\n\n![图 14.2 hyper-FET 示意图 [40]。](images/Fig14_02.jpg)\n\
  \n图 14.2 hyper-FET 示意图 [40]。\n\n在 68°C 附近，这种奇异材料从绝缘体转变为金属态。在该温度以下，其 I–V 曲线类似于绝缘体，电流极小。在该温度以上，曲线变为线性，表明具有导电性。\n\
  \n相变材料独特的 I–V 属性在多个领域应用，包括存储器：滞后行为可产生非易失性存储器，例如忆阻，其电阻状态由电压历史决定 [17]。\n\n**传感器**：导电性对温度、压力或磁场的敏感性可用于传感。\n\
  \n**电子开关**：期间导电性的快速变化可用于控制。\n\n理解相变材料的 I–V 属性让我们能够实现它们在未来的巨大潜力（图 14.3](#ch14.xhtml#f14_3)）。\n\
  \n## 14.3 Hyper-FET 的功耗与速度评估\n\nHyper-FET 凭借其 `GAA` 架构和改进的电子控制，是下一代晶体管非常有前景的候选者\
  \ [21, 22, 23]。然而，对更快、更高效电子设备的追求需要对其功耗和速度能力进行仔细检查。本节深入探讨了评估这些 `hyper-FET` 关键特征的方法和标准，提供了详尽分析。\n\
  \n然而，在它们统治电路之前，我们必须首先它们的功耗。\n\n**直流功耗**：显示 `hyper-FET` 在空闲和切换期间消耗的功率。最小化这两者对于效率至关重要。\n\
  \n**漏电流**：这个狡猾的罪祸首在 `hyper-FET` 冷却时仍保持电流流动。与普通的 `MOSFET` 相比，`hyper-FET` 改进的栅极控制显著减少了漏电流。\n\
  \n\n\n\n\n### 能效\n这表示 hyper-FET 开关每次翻转消耗的能量，以每操作消耗（Joules per operation）为单位。数值越低，设备越有效（图\
  \ 14.4）。\n\n![](img/Fig14_04a.jpg)![图 14.4 (a) hyper-FET 反相器的电压传输特性（同时也显示了原理图）[41]。(b)\
  \ 与 hyper-FET 反相器对应的波形，包含 n 型和 p 型 hyper-FET 的内部状态[41]。](images/Fig14_04b.jpg)\n\
  \n图 14.4 (a) hyper-FET 反相器的电压传输特性（同时也显示了原理图）[41]。(b) 与 hyper-FET 反相器对应的波形，包含 n 型和\
  \ p 型 hyper-FET 的内部状态[41]]。\n\n为了准确评估这些变量，我们采用了三管齐下的策略：\n\n- **设备级**：我们直接测量 hyper-FET\
  \ 上的电压和电流，像微型侦探一样窥视其内部。\n- **电路级**：我们将 hyper-FET 置于真实的电路仿真中，观察它在不同负载下的反应，并确定其际功耗。\n\
  - **基准测试**：我们将 hyper-FET 与 FinFET 等已知的冠军进行比较，利用功耗测量来客观地分析效率的提升。通过使用这些方法，我们可以揭开 hyper-FET\
  \ 功耗的秘密，为晶体管运行强度更高但又不消耗我们电池的未来铺平道路。\n\n为了确定 hyper-FET 的全速度潜力，研究人员使用了一系列关键指标和评估方法。开关延迟\
  \ \\[24\\]是一个重要指标，它揭示了 hyper-FET 在逻辑状态之间优雅翻转需要多长时间，就像舞者变换位置一样。最小化这种延迟对于提高电路速度和促进更快的处理至关重要。截止频率（`fT`）是衡量\
  \ hyper-FET 高频能力的指标，表示其电流增益优雅下降到单位的频率。较高的 `fT` 就像音乐家更宽的音域，表示更快的信号放大，并为高速应用开启可能性。传播延迟估计了信号穿过多级\
  \ hyper-FET 电路单级所需的时间，就像接力赛一样，每个阶段都必须快速传递接棒。减少这种延迟可以提高整体电路速度并确保信息的顺畅流动。\n\n为了评估这些指标，研究人员使用了多种技术。电学测量需要通过脉冲脉冲进行时域表征，就像秒表测量短跑运动员的分段时间一样\
  \ \\[25,26\\]。这直接评估了开关延迟和其他瞬态响应，展示了 hyper-FET 的灵敏性。频域分析检查了 hyper-FET 的增益和相位响应，就像将舞者的编舞映射到乐谱上。这种检查揭示了它的高频性能和截止频率，证明了它在高速下执行优雅动作的能力。电路仿真为测试提供了一个虚拟舞台。理解\
  \ hyper-FET 的性能需要考虑功耗与速度之间复杂的联系。优化其中一个往往会影响另一个。虽然开关延迟和其他瞬态响应展示了 hyper-FET 的灵敏性，但高频性能和截止频率揭示了它在高速下执行优雅动作的能力。平衡速度和功率对于整体性能至关重要，这将带来一个晶体管运行强度更高但又不消耗我们电池的未来。\n\
