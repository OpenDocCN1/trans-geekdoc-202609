  \ Devices, vol. 64, no. 12, pp. 4868–4874, 2017.\n\n## 基于忆器的设计与性能评估框架\n\nJalpaben\
  \ Pandya, Ramji Gupta, and Alpana Pandey\n\nDOI: [10.1201/9781003483038-3](https://doi.org/10.1201/9781003483038-3)\n\
  \n## 3.1 引言\n\n由于柔性和智能电子设备的出现，电子行业正经历着快速增长。柔性及智能电子设备的特点是具有极高的电路复杂性和巨大的数据存储能力 [1,\
  \ 2, 3, 4]]。历史上，数据存储通过缩 OSCMOS 技术以跟摩尔定律。然而，当尝试将处理器缩小到 22 纳米以下时，量子效应会出现，且芯片对工艺、电压和温度（PVT）变得敏感\
  \ [5, 6]]。这导致 CMOS 在存储大量数据且占用更大空间时性能下降。因此，有必要采用新型忆器技术构建非易失存储器，以解决与 CMOS 相关的所有问题\
  \ [7, 8, 9, 10, 11, 12]]。\n\n基于忆器的设计研究重点在于探索忆器存储器的潜在优势，包括高密度、低功耗和非易失性。忆器也称为记忆电阻，是具有两个终端的电子器件，可以控制电流并存储最后通过它的电荷\
  \ [5, 11, 12, 13]]。忆器是公式(3.1)所示连接通量和电荷的元件 [11, 14]]。\n\n```\nd = Mdq (3.1)\n```\n\
  \n其中：\n\n1. `⌀` – 通量\n2. `M` – 忆阻\n3. `q` – 电荷\n\n该器件在 2008 年被物理制造之前仅仅是一个概念。这种第一代忆器模型由两层组成，即高电阻的未掺杂`TiO[2]`层和高导电性的掺杂氧空位的`TiO[2−x]`层\
  \ [7, 13]]。两侧均连接了铂电极，其中`TiO[2]`作为负极，而`TiO[2−x]`作为正极。\n\n![图 1](img/Fig01.jpg)\n\
  ![图 2](img/Fig02.jpg)\n\n\n\n\n线性离子漂移模型 `[12]` 为理想忆阻器的建模提供了基础方程。然而，它受到边界效应和非线性度降低的困扰。为了解决边界效应，研究人员为忆器建模提出了多种窗口函数，包括\
  \ Strukov、Joglekar、Biolek、Prodromakis、Piecewise 和 Zha。这些函数各有一个自己的优缺点。表 3.1 显示了各种窗口函数及其对应的缺点。\n\
  \n### 表 3.1 不同的窗口函数及其缺点\n\n| 序号 | 窗口 | 窗口函数 | 缺点 |\n| --- | --- | --- | --- |\n\
  | 1. | Strukov 窗口函数 `[12]` | $f\\left( w \\right) = \\frac{w\\left( 1 - w \\right)}{D^{2}}$\
  \ `D` 和 `w` 是图 1.1 中指定的参数 | 存在边界锁定问题，且无法捕捉非线性效应 |\n| 2. | Joglekar 窗口函数 `[17]` |\
  \ `f(x)` = 1 − (2x−1)^(2p)` 其中 `x` – 内部状态变量 $x = \\frac{w}{D}$ | 存在边界锁定问题 |\n| 3.\
  \ | Biolek 窗口函数 `[18]` | `f(x)` = 1 − (x−sgn(-i))^(2p)` 其中 `p` – 正整数 `sgn(-i)` –\
  \ 流过忆器的电流 | 边界处不连续 |\n| 4. | Prodromakis 窗口函数 `[19]` | $f\\left( w \\right) = j\\\
  left\\{ 1 - \\left\\lbrack \\left( \\frac{w}{D} - 0.5 \\right)^{2} + 0.75 \\right\\\
  rbrack^{p} \\right\\}$ 其中 `p`, `j` – 控制参数 | 在低频率下，无法保持压字滞回环 |\n| 5. | Piecewise\
  \ 窗口函数 `[20]` | $\\begin{array}{l} {f\\left( x \\right) = \\left( 1 + \\left( \\\
  frac{x - 0.25}{a} \\right)^{2b} \\right)^{- 1};\\\\quad} \\\\ {x_{0} \\leq x \\\
  leq 1 - x} \\\\ \\end{array}$$f\\left( x \\right) = kx\\left( 1 - x \\right);\\\
  text{\\quad otherwise}$$\\text{where}x = \\frac{w}{D}$ | 需要仔细选择参数以保证精度 |\n| 6. |\
  \ Zha 窗口函数 `[21]` | `f(x)` = `j(1−{0.25[x−sgn(-i)]²+0.75}^p)` 其中 `p`, `j` 是控制参数\
  \ | 存在边界锁定问题 |\n| 7. | T. Anusudha 提出的窗口函数 `[22]` | `f(x)` = `J[1−2(x³−x+1)^(p)]`\
  \ 其中 `x` – 内部状态变量 `p` – 正整数 `J` – 控制参数 | 需要仔细选择参数以保证精度 |\n| 8. | Junrui 提出的窗口函数\
  \ `[23]` | $f\\left( x \\right) = j\\left\\{ 1 - \\left\\lbrack \\begin{array}{l}\
  \ {\\\\alpha x^{3} + a^{2}\\left\\lbrack x - \\text{stp}\\left( - i \\right) \\\
  right\\rbrack^{2}} \\\\ {+ \\left( 1 - a^{2} \\right) + \\beta x^{2} + \\gamma x}\
  \ \\\\ \\end{array} \\right\\rbrack^{p} \\right\\}$ 其中`α`, `β`, `γ` – 非线性漂移参数 `j`\
  \ – 控制参数 `p` – 正整数 | 函数复杂 |\n\n此外，还开发了其他窗口函数，通过引入非线性和模拟实际忆器器件的特性来解决边界锁定问题。Jeetendra\
  \ Singh `[24]` 提出了一种窗口函数，它考虑了忆器内部掺杂的线性和非线性漂移。该函数在边缘处表现出显著的非线性，并有效解决了其他边界问题，使其对于非线性忆器模型具有重要价值。因此，窗口设计必须包含引入受控非线性的能力，解决边界影响和边界锁定问题，这是至关重要的。\n\
  \n\n\n忆阻器已广泛应用于模拟和数字领域。忆阻器在模拟领域的最新进展包括：用于人工智能和机器学习的存储电路 [45,45]、忆阻器生物传感器 [46]、人工神经网络\
  \ [44,47,48]、神经形态应用 [35,44,49,50]、语音加密 [43]、脉冲神经网络 [30,44]、卷积神经网络 [41]、关联记忆 [51]、存储单元设计\
  \ [7,9,52, 53, 54, 55, 56]以及物理不可克隆函数（PUF） [2,45,57, 58, 59]]。\n\n数字领域基于忆阻器的电路的最新进展包括随机数生成器\
  \ [60]、三进制存储应用 [61]、存内计算 [62]、三进制忆阻器解码、逻辑门 [63,64]、锁存器、高级加密标准（AES）加密 [44,65]以及用于加密的密钥生成\
  \ [44,66]]。\n\n图 3.3 描述了在两个领域中使用忆阻器进行的研究调查。为了使用忆阻器，除了提供数学模型、电路设计和仿真外，还需要一个能够准确复制忆阻器行为的模型。自\
  \ 2008 年以来，已经开发了许多 `SPICE`（集成电路仿真）模型和忆阻器仿真器，以便于忆阻器电路的设计和仿真。尽管 `SPICE` 模型和实际仿真器已取得一些进展，但开发忆阻器数字电路仿真器的进展仍然落后。尽管如此，仿真工具的可访问性在设计基于忆阻器的综合系统时面临着挑战。图\
  \ 3.4 描述了用于仿真基于忆阻器电路的各种软件。\n\n![图 3.3 忆阻器研究领域](img/Fig03_03)\n图 3.3 忆阻器研究领域。\n\n\
  ![图 3.4 用于忆阻器电路设计的软件](img/Fig03_04)\n图 3.4 用于忆阻器电路设计的软件。\n\n忆阻器在广泛的应用中具有巨大的潜力，从其基本特性来看，它是存储设计的显而易见的选择。各种存储电路如\
  \ `1R`、`1T1R`、`2T2R`、`2T2M`、`3T2R`、`5CNT2R`、`6T1M`、`7T2M`、`8T2R` 和 `9T2R` 在表 3.2\
  \ 中进行了设计和比较。\n\n表 3.2 基于忆阻器的存储比较\n\n| 存储单元 | 晶管数量 | 数据存储数量 | 电路设计问题 |\n| :--- |\
  \ :--- | :--- | :--- |\n| `6T` `SRAM` 单元 [67] | 两个晶管 | 四个晶管 | 受工艺、电压和温度 (PVT) 变化的影响以及读取延迟增加\
  \ |\n| `2T2M` [7] | 传输门形式的两个晶管 | 差分配置 | 读取期间免疫 PVT 变化 |\n| `2T2M` [68] | 两个晶管 |\
  \ 差分配置 | 写入延迟增加 |\n| `1T1M` [8] | 一个晶管 | 单端配置的一个忆阻器 | 1. 用于正确读取的电压、脉冲宽度、高度和速度优化\
  \ 2. 快速写入需要高电压 |\n| `5CNTFET2M` [53] | 传输门形式的四个碳纳米管效应晶管 (`CNTFET`) | 差分配置 | 面积增加\
  \ |\n| `6T1M` [69] | 沿四个控制晶管 | 一个忆阻器 | 读取期间漏电功耗增加 |\n| `7T2M` [54] | 两个晶管 | 沿两个控制忆阻器和一个控制晶管\
  \ | 面积增加 |\n\n参考上述所有电路，存储单元主要评估读取延迟、写入延迟、保持功耗和静态噪声裕量。因此，使用忆阻器设计更好的存储单元仍有空间。\n\n\
  ## 3.4 基于忆阻存储的设计考虑\n\n参考上述所有电路设计，对于表 3.2 所示的存储电路，评估的参数是读取延迟、写入延迟、保持功率和面积。对于基于忆阻器的存储设计，需要考虑的理想参数\
  \ [70、71、72] 所示在表 3.3](#ch03.xhtml#t3_3)中。\n\n表 3.3 存储的设计考虑\n\n| 序号 | 参数 | 期望值 |\
  \ 典型值 |\n| :--- | :--- | :--- | :--- |\n| 1. | $\\frac{R_{\\text{OFF}}}{R_{\\text{ON}}}\\\
  text{比例}$ | 越高越好 | 200 |\n| 2. | 寿命（年） | 越高越好 | >10 |\n| 3. | 数据保持（秒） | 越高越好 | $10⁵$s\
  \ |\n| 4. | 设备速度 | 越高越好 | – |\n| 5. | 旁路电流 | 越低越好 | – |\n| 6. | 数据刷新（次数） | 越高越好\
  \ | ~ 14 × 10³ |\n| 7. | 读取延迟（ns） | 越低越好 | 几 ns |\n| 8. | 写入延迟（ns） | 越低越好 | < 50\
  \ ns |\n| 9. | 面积（μ²) | 越低越好 | – |\n\n增大 $\\frac{R_{\\text{OFF}}}{R_{\\text{ON}}}\\\
  text{比例}$ 有于实现正确读取。然而，在读取期间会发生状态漂移，导致读取错误数据。因此，需要存储刷新。在设计时，考虑到状态漂移问题，评估速度和鲁棒性之间的权衡是重要的。\n\
  \n寿命通过在设备上进行写入操作而不对存储数据产生任何影响的频率来衡量，该值应最大化。\n\n在读取机制期间，会发生状态漂移，导致读取错误数据。因此，需要存储刷新。实现这一点的方法之一是使用双向存储机制，它将在读取期间断开电路与位线的连接。实现此点的方法是设计多个程序/擦除电路，另一种方法是设计一种读取访问时间小于切换速率的电路。\n\
  \n此外，还需要考虑存储电路的设计因素。这基本上涉及存储架构的选择、读/写操作机制的设计、传感机制的选择以及与忆阻器阵列连接的合适外围电路的选择。\n\n\n\n\
  \n存储架构方案包括交叉杆阵列（crossbar arrays）和网格阻变随机存储器（RRAM）架构 [56]。网格 RRAM 架构具有更高的能量效率和优越的访问时间。然而，其结构尺寸较大，导致成本增加。由于使用交叉杆结构设计存储单元时不需要访问晶体管，这种架构因占用空间紧凑而极具吸引力。虽然交叉杆\
  \ RRAM 拓扑在紧凑性方面具有优势，但在切换时间、访问时间和可靠性方面也面临着挑战 [56]。此外，为单元建立一种熟练且高效的读写机制至关重要，以确保在效率、速度和可靠性方面获得最佳性能。这需要考虑许多参数，例如电压和电流水平、脉冲长度和传感机制。\n\
  \n## 3.5 使用忆阻器对存储单元进行仿真\n\n本节描述了 `2T2M` RRAM 的操作和架构。如图 3.5 所示，该电路使用了由晶体管 `M1` (PMOS)\
  \ 和 `M2` (NMOS) 组成的传输门，而不是传统的使用的 NMOS 访问晶体管。传输门允许在没有任何信号衰减的情况下实现强逻辑一和强逻辑零。忆阻器 `M3`\
  \ 和 `M4` 作为存储设备并以差分配置连接，与单端连接相比，它们不易受到 PVT（工艺、电压、温度）变化的影响。忆阻器采用了 `Joglekar` 窗口函数的线性离子漂移模型，解决了与非线性掺杂漂移相关的挑战。仿真使用\
  \ `LTspice®` 软件进行，这是一种与 `SPICE` 的开源仿真器，允许网列表编程和波形分析。选定的忆阻器参数为 `R*[ON] = 100Ω`、 R*[OFF] = 16KΩ`、 R*[INIT] = 11KΩ`、 D = 10`、 p = 10。\n\
  \n![FIGURE 3.5 2T2M memory cell.](img/Fig03_05.jpg)\n\nFIGURE 3.5 2T2M 存储单元。\n\n\
  ### 3.5.1 写操作\n\n为了在单元中存储任意位，字线（`WL`）应连接到逻辑高电，字线反相（`WLB`）连接到逻辑低电。要存储的数据应用数据线（`DL`）上，应用数据的补补给位线（`BL`）和位线反相（`BLB`）。由于忆阻器以差分配置连接，任一忆阻器将处于开启状态，数据将存储在存储节点上。写“1”操作的输出如图图\
  \ 3.6 所示。\n\n![FIGURE 3.6 Output for write operation.](img/Fig03_06.jpg)\n\nFIGURE\
  \ 3.6 写操作输出。\n\n为了读取存储的数据值，必须在读操作之前放电 `BL` 和 `BLB`。然后给 `WL` 逻辑高电，随后给 `WLB` 逻辑低电。传输门的晶体管一旦激活，`BL`\
  \ 和 `BLB` 开始以电阻水平成正比的速度充电。当电压差超过 50 mV 时，灵放大器将感知数据。\n\n## 3.6 结果与讨论\n\n为了仿真我们的器件，首先实现了\
  \ HP Lab 的忆阻器线性漂移模型。每个金属氧化物半导体场效应晶管（`MOSFET`）组件均利用 45 nm 工节点进行了仿真。将所提 RRAM 单元的写延迟结果与其他存储电路进行了比较。所提电路中忆阻器的写延迟通过平均\
  \ `write-1` 和 `write-0` 的写延迟来确定。所提 `2T2M` 的写延迟为 0.39 μs。如表 3.4 所示，该电路的写延迟大于参考文献中描述的其他存储单元设计。\n\
