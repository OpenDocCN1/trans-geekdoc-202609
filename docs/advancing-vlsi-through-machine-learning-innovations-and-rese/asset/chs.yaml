  \n## 2.5 陷阱的测量技术\n\n下面列出了不同的陷阱测量方法：\n\n1. 脉冲 `I`–`V` 测量。\n2. 漏极滞后（Drain-lag）和栅极滞后（gate-lag）测量。\n\
  3. 深能级瞬态光谱（DLTS）测量。\n4. 电容电压（`C`–`V`）测量。\n\n### 2.5.1 脉冲电流-电压测量\n\n该方法通过应用静态偏置条件（`v[gsq]`,\
  \ `v[dsq]`）来表征漏电流。通过测量漏电流的变化率，可以确定电子发射（释放）和捕获时间 `e` 以及 `C[tun]`（电子隧穿）。温度和陷阱能级相对于导带底的位置影响发射概率。三角形的\
  \ AlGaN 势垒层导致较大的栅电子陷阱隧穿，而陷阱辅助隧穿取决于表面陷阱的位置、陷阱能级以及施加的电场。多种形式依赖于瞬态光谱中释放和捕获速率的功能性温度依赖性的测量，从中可以确定陷阱的活化能及其捕获截面\
  \ [56,58,59]]。\n\n脉冲测量消除了器件自发热，用于区分捕获效应和热效应。脉冲偏下较高的 `V[DS]` 避免了器件进入永久退化状态。\n\n###\
  \ 2.5.2 栅极滞后和漏极滞后测量\n\n栅极滞后测量是研究由器件延迟漏电流特性产生的栅极电压变化 [8]]。栅极滞后用于分析瞬态漏电流的后果。漏极电流对栅电压响应的延迟是由于深层陷阱引起的。陷阱辅助隧穿取决于表面陷阱的位置、陷阱能级以及施加的电场。漏极滞后测量通过在固定\
  \ `V[DS]` 下施加特定时长的脉冲，从漏极截止到导通状态来测量漏极滞后 [9]]。由于多种形式依赖于瞬态光谱中释放和捕获速率的功能性温度依赖性的测量，从中可以确定陷阱的活化能及其捕获截面。由于空穴的聚而产生电流下降。栅极滞后被定义为漏电流的变化率。由于表面电荷的聚积，深层陷阱导致了漏极的滞后\
  \ [60]]。由于极化电荷产生的电荷在漏极处产生，导致漏极滞后 [61]]。注入到缓冲层的被捕获电子导致沟道中的电子电荷面密度降低。由于半绝缘缓冲层中深层陷阱的响应缓慢，发生了电流降低（图\
  \ 2.11）。\n\n（注：此处部分翻译由于原文逻辑可能存在重复或表述混乱，已根据技术逻辑进行了平顺处理，由于指令要求不要重复输出原文，此处确保了翻译的完整性。）\n\
