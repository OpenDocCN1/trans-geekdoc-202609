  \ | [66] |\n| 70 nm GaN HEMT | 30 | 16 | | [67] |\n\n## 4.5 结论\n\nPA 是电子和通信工程中使用最重要的设备。CMOS\
  \ 45 nm、CMOS 22 nm 和 GaN HEMT 有各种应用。无线通信和雷达系统主要使用 GaN HEMT 来实现高功率密度、高频工作以及高效率。在\
  \ PAE 方面的最佳结果是使用 GaN HEMT。功率电平、频率范围、成本和集成是其一些应用。GaN HEMT 最适用于高功率，而 CMOS PA 则提供了特定的方法。\n\
