  \ TCAD 增强机器学习\n\nSandeep Moparthi 和 Gopi Krishna Saramekala\n\nDOI: [10.1201/9781003483038-8](https://doi.org/10.1201/9781003483038-8)\n\
  \n## 8.1 引言\n\n为了跟上工业自动化日益增长的势并解决上市时间问题，集成电路（IC）行业正在其工艺层次架构的多个层面上集成机器学习（ML）。机器学习辅助的\
  \ TCAD 器件仿真已成为新兴器件性能分析和反向工程的可行解决方案。这里的想法是预测器件的电学特性，以便在训练良好的机器学习算法帮助下，在极短的时间内完成器件级的性能分析和优化。TCAD\
  \ 辅助的新兴器件 ML 仿真为研发提供了反向工程和更快的决策。本章介绍了一种基于圆柱硅纳米管的 TCAD-ML 模型。通过改变关键器件参数（如沟道长度 `L`\
  \ 和核心半径 `t[c]`）来创建所需的数据集。\n\n为了高效的 ML 设计，需要对输入和输出参数之间的依赖进行精确建模。这可以通过简单的多项式方程实现。然而，ML\
  \ 复杂度与多项式的次数成正比，这使得模型变得具有挑战性 [1,2]。使用多项式对高阶非线性问题建模是非常困难且不实际的。反过来，多项式模型的使用限制了数据输入变量的数量。此外，基于决策树（DT）和神经网络（NN）的算法为建模具有较高非线性的问题提供了灵活性。文献表明，大多数\
  \ TCAD 辅助的 ML 工作都采用了线性回归（LR）、NN 和随机森林（RF）技术对问题进行建模。尽管设计简单，但 LR 方法限制了对非线性依赖的预测。另一方面，在涉及非线性回归时，NN\
  \ 会增加处理时间和设计复杂度。然而，由于其直观的基于 DT 设计，RF 回器在处理非线性问题时以极低的复杂度提供了快速计算性能 [3]。\n\n此外，观察到文献广泛讨论了单变量线性模型。据我们所知，新开发的环绕栅极（gate-all-around）器件均未使用\
  \ TCAD 辅助 ML 进行性能预测。因此，本章开发了一种 ML 模型，通过改变重要的器件参数（如 `t[c]` 和 `L`）来预测其对 Si NTFET 性能的电影响。我们采用并评估了两种流行的基于\
  \ DT 的算法性能：梯度提升（GB）回归器和 RF 回器。使用最大误差（ME）和均方误差（MSE）等指标对正在训练的算法进行评估。在测试阶段，根据性能指标选择在训练期间表现更好的方法，来预测\
  \ Si NTFET 的阈值电压 `V[TH]`、`SS`、`I[ON]` 和 `I[OFF]`。数据集类型、大小以及输入参数的数量对 RF 和 GB 算法的适用性有很大影响。因此，比较算法性能以确定哪一个对于给定数据集最合适至关重要。本章其余章节安排如下：下一节将详细说明数据集的创建和\
  \ ML 方法；训练和测试结果将在结果部分列出，并对所考虑的算法进行讨论。\n\n## 8.2 数据生成与机器学习方法\n\n本文介绍了一种由 TCAD 支持的\
  \ ML 方法，用于预测 Si NTFET 的输出特性。图 8.1 和表 8.1 分别描述了 Si NTFET 的横面图和 Si NTFET 仿真考虑的器件参数。Silvaco\
  \ 的 3D TCAD 工具 Atlas 使用 Shockley-Read-Hall (SRH) 复合模型和载流子速度-温度（CVT）（Lombardi）迁移率模型来仿真器件结构。通过在表\
  \ 8.1 所示的给定范围内，在保持其他参数不变的情况下调整两个最重要的参数 `t[c]` 和 `L`，产生了一个包含 4641 个样本的数据集。以 0.1 nm\
  \ 为步长将关键参数 `t[c]` 从 2 nm 变为 7 nm。参数 `L` 以 1 nm 为步长进行调整，范围从 10 nm 到 100 nm，以捕捉短道和长道趋势。4641\
  \ 个提取的数据样本中，30% 用于测试，70% 用于训练。需要注意的是，数据样本的数量主要决定了数据集的划分比例 [3]。图 8.2 显示了 TCAD 确定的每个数据样本的\
  \ Si NTFET 转移特性。图 8.2 还显示了仿真数据集的平均值和中位数。\n\n\n\n\n\n输入参数变量与所有输出参数之间的非线性依赖关系从图 8.3\
  \ 所示。此外，随着输入参数的变化，所有输出参数也会发生持续变化。回归是一种用于连续值（输出）训练和预测的机器学习技术，而分类则用于预测离散值。由于上述因素，针对给定的输入参数，输出参数是通过多变量非线性回归预测的。两种常用的基于决策树（DT）的机器学习算法是\
  \ `GB` 和 `RF` 回归器 \\[3,4]]。Python 的 `scikit-learn` 库 \\[4]]提供了 `RF` 和 `GB` 算法。在机器学习中，将训练好的算法应用于新数据时，数据过拟合会降低其准确性。为了限制在单个\
  \ `DT` 中更严重的数据过拟合问题，`GB` 和 `RF` 回归器是使用一组 `DTs` 构建的。`DT` 的特性会影响 `RF` 和 `GB` 回归算法的性能。为了提高这些算法的效率，必须调整这些被称为超参数的特性。\n\
  \n![FIGURE 8.3 (a) VTH, (b) SS, (c) ION, 和 (d) IOFF 随 tc 和 L 的变化](img/Fig08_03.jpg)\n\
  \nFIGURE 8.3 (a) *V*[TH], (b) SS, (c) *I*[ON], 和 (d) *I*[OFF] 随 *t[c]* 和 *L* 的变化。\n\
  \n在本研究中，估计器数量、最大树深度、每个分裂最小样本数和每个叶节点最小样本数被视为主要超参数。估计器数量代表了在 `RF` 和 `GB` 中连续最小化 `MSE`\
  \ 可能使用的 `DTs` 最大数量。`DT` 的最大长度由其最大树深度决定。分裂 `DT` 内部节点所需的最小样本量被称为分裂最小样本数 \\[3,4]]。叶节点（结束节点）所需的最小样本量由叶节点最小样本数指定。对于\
  \ `RF` 和 `GB` 回归器，估计器数量、分裂最小样本数和叶节点最小样本数的默认参数分别为 100、2 和 1 \\[4]]。然而，对于 `RF` 和 `GB`\
  \ 回归器，最大树深度的默认值分别为 `NONE` 和 3 \\[4]]。对于 `RF` 回归器而言，最大树深度的默认值 `NONE` 表示程序员没有提供预定义值。因此，`RF`\
  \ 算法可以自由将树深度扩展到最优值，即当所有叶节点都低于分裂最小样本数时。根据 `RF` 回归器，对于提供的数据集，输出参数 *V*[TH], SS, *I*[ON],\
  \ 和 *I*[OFF] 的最大树深度最优值分别为 18、20、16 和 34。此外，`GB` 回归器的默认最大树深度 3 远小于 `RF` 回归器能够实现的理想值。这就是为什么与它们的默认超参数值相比，`GB`\
  \ 回归器优于 `RF` 回归器的原因。为了提供公平的比较环境，本研究采用了 `RF` 回归器生成的最大树深度值并将其应用于 `GB` 回归器。表 8.2 显示了比较\
  \ `RF` 和 `GB` 回归方法时使用的超参数值。\n\nTABLE 8.2GB 和 RF 回归器考虑的关键超参数\n\n|  || *V*[TH] (V)\
  \ || SS mV/decade || *I*[ON] (A) || *I*[OFF] (A) |\n| --- | --- | --- | --- | ---\
  \ |\n| 估计器数量 | 100 | 100 | 100 | 100 |\n| --- | --- | --- | --- | --- |\n| 最大树深度\
  \ | 18 | 20 | 16 | 34 |\n| 分裂最小样本数 | 2 | 2 | 2 | 2 |\n| 叶节点最小样本数 | 1 | 1 | 1 | 1\
