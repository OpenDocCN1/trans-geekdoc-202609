  \n## 13.1 引言\n\n静态随机访问存储器（SRAM）是当今基于超大规模集成电路（VLSI）电路中最常用的组件之一，其优点是尺寸小、低功耗和高速能力 [1]。由于制造一个单元涉及的晶体管数量众多，它们在\
  \ VLSI 电路设计占据占据了很大 [2,3]。随着技术的进步和 SRAM 单元尺寸缩小到微米级甚至亚微米级，这些芯片的密度显著增加 [3]。好处是这些芯片的速度显著提高，但同时功耗也随之增加。\n\
  \nSRAM 的拓扑结构根据晶体管的数量而异，例如，`6T` SRAM 使用六个晶体管来实现内存操作，而 `7T` SRAM 使用七个晶体管来实现内存操作，此类此类；可以根据应用制造具有不同晶体管数量的不同类型的\
  \ SRAM [4]。SRAM 的另一种区别方式是基于使用的尺寸，例如 45、65、90、180 nm 等。根据芯片在各种应用中的用途，使用合适的 SRAM。\n\
  \n低功耗和极低延迟（从而高速）是 SRAM 电路的重要特征。这些属性驱动了许多研究人员和科学家探索增强或最大化其潜力的方法 [5]。但在探索过程中面临许多问题；由于尺寸限制，必须提供较低的电压。这增加了\
  \ SRAM 的延迟，此外，芯片的阈值电压也必须降低。\n\n设计优化的 SRAM 有许多关键因素。针对特定任务，根据其架构和目的是否符合所需的性能要求来选择\
  \ SRAM。在设计时考虑到架构、算法、逻辑、布局等，有许多可能性来创建各种类型的 SRAM [4]。\n\n下一节将讨论 `6T` 和 `7T` SRAM 单元的模型和工作原理。我们将讨论了我们所采用的功耗耗散设计标准。然后，通过每个\
  \ SRAM 的蝴蝶曲线（butterfly curve），我们可以确定静态噪声裕量（SNM），并将其用于对单元进行稳定性分析。\n\n## 13.2 六晶体管\
  \ SRAM 或 6T SRAM\n\n`6T` SRAM 由六个互连的晶体管组成，作为我们打算提供的信息的内存存储器。两个 CMOS 交叉耦合。存储在这些反相器中的数据通过访问反相器使用位线（bit\
  \ line）和位线反线（bit line bar）进行访问。位线和位线反线在内存写入期间作为输入线，而 (BN) 位线反线作为读取内存的输出线 [6]（图 13.1](#ch13.xhtml#f13_1)）。\n\
  \n![FIGURE 13.1 6T SRAM 电路图](img/Fig13_01.jpg)\n\nFIGURE 13.1 6T SRAM 电路图\n\n当字线\
  \ `WL` 与相应的位线及其反线被激活时，系统进入准备好的读写状态；否则，系统进入保持状态 [7]。\n\n**读取操作**：\n\n当 `WL` 激活且被访问的内存单元处于高电平时，由于预充电电容器保持稳定的\
  \ `V[DD]` 电压水平，因为 `Q` 与 `N3` 之间没有电压差，因此没有变化。然而，在 `Q` 反和 `N4` 的情况下，由于 `Q` 为零存在电压差异，且\
  \ `Q` 附近的访问处处于 `V[DD]`，导致电容器放电并随后位反电压下降，从而输出 1 [8]。\n\n相反，当被访问的内存单元保持低状态时，位与 `N3`\
  \ 节点之间的电压差触发输出 0。\n\n**写入操作**：\n\n假设为低状态，位线反线接地以产生电压差异，这受 `N2` 阈值电压的影响。\n\n## 13.3\
  \ 七晶体管 SRAM 或 7T SRAM\n\n`7T` SRAM 由七个互连的晶体管组成，作为我们打算提供的信息的内存存储器。两个 CMOS 交叉耦合；在该电路中，我们额外向写线连接了一个\
  \ N 型氧化半导体（NMOS）晶体管。晶体管 3 和 4 连接到读线和写线 [5]（图 13.2](#ch13.xhtml#f13_2)）。\n\n![FIGURE\
