  \ 2021.\n\n\n\n\n与脑瘤相关的常见症状包括头痛、恶心、呕吐、视觉障碍、肌肉无力、癫痫以及性格特征和精神能力的变化。症状的严重程度和表现受肿瘤大小、位置和侵袭性的影响。早期发现和适当的干预对于优化脑瘤患者的预后和提高其生活质量至关重要。\n\
  \n每年有超过 12,000 人（包括 500 名儿童和年轻人）受原发性脑瘤的影响，即每天有 33 人患者 [1]..。每年，脑瘤夺走了超过 5,300 人的生命。源于大脑或脊髓的肿瘤被称为原发性脑瘤或脊髓肿瘤。预计\
  \ 2023 年，美国将有 24,810 人（14,280 名男性和 10,530 名女性）被确诊为脑部或脊髓初始恶性肿瘤 [2]..。2020 年，全球估计识别出\
  \ 308,102 例原发性脑瘤或脊髓肿瘤 [3]..。在美国，预计 2023 年将有 5,230 名 20 岁以下的儿童被确诊为中枢神经系统肿瘤 [2]..。在所有美国人中，每\
  \ 10 万中有 23–24 例脑瘤（恶性或非恶性） [1]..。胶质母瘤占所有脑瘤的约 14.5%，是最常见的恶性脑瘤 [3]..。脑膜瘤占所有脑瘤病例的约\
  \ 38.3%，是最常见的良性（或非恶性）脑瘤。\n\n磁共振成像（MRI）和计算机断层扫描（CT）可以帮助我们识别脑瘤的存在和位置及其大小形状。`MRI`和`CT`还可以帮助区分原发性脑瘤（起源大脑的肿瘤）和转移性脑瘤（从身体其他部位扩散的肿瘤）。分类：`MRI`和`CT`可以根据肿瘤的外观、强化、灌注和其他特征帮助确定脑瘤的类型和级别\
  \ [4]..。\n\n脑瘤在形态、大小、位置和外观方面表现出显著多样性。这些新生肿瘤可以根据其组织学亚型、级别和阶段进行进一步分层，从而影响其临床管理和预后\
  \ [5]..。例如，脑瘤可以分为原发性或转移性、良性或恶性，并可能表现出独特的组织学特征，如胶质瘤、脑膜瘤和垂体瘤。\n\n此外，脑瘤内部可能具有异质性，具有不同生物学特性的不同区域\
  \ [6]..。这种异质性增加了手术过程中评估肿瘤边缘的难度，并影响了治疗的效力。\n\n然而，由于人为错误或标注标准的差异等因素，标记数据集可能会受到噪声、不完整或不一致的影响。尽管存在这些挑战，机器学习和计算建模领域的持续努力旨在提高脑瘤诊断和预后的的准确性和可靠性\
  \ [7]..。\n\n总之，脑瘤在形态、位置和组成上表现出巨大的差异，这使得在开发诊断和治疗方案时必须仔细考虑这些属性。标记数据集虽然有价值，但由于存在噪声、不完整或不一致的可能性，必须谨慎对待。尽管如此，技术的进步正在不断增强我们有效理解和管理脑瘤的能力。\n\
  \n在计算机视觉领域，残差网络 50（`ResNet-50`）是一种突出的分类模型。`ResNet-50` 具有显著优势，例如：\n\n1. 高准确率，优于 `AlexNet`、`VGG`、`GoogleNet`\
  \ 等模型。\n2. 使用“瓶颈”设计，通过减少矩阵运算来加速训练 [8]..。\n3. 每个模块使用三层而非两层，从而增强表达能力。\n4. 在不同领域具有卓越性能，尽管与通用模型相比存在差异\
  \ [9]..。\n5. 应用迁移学习策略，以加速训练并提升性能。\n\n尽管具有优势，由于其深度架构，`ResNet-50` 需要大量的计算资源和内存，且训练过程可能是耗时且复杂的\
  \ [10]..。\n\n## 7.2 文献综述\n\n由于脑瘤具有多样性、复杂性且特征经常重叠，对其进行分类是一项挑战任务。此外，包括`MRI`、`CT`、正电子发射断层（PET）和单光子发射计算机扫描（SPECT）在内的多种成像技术可以产生需要整合和分析的独特信息。因此，需要能够应对这些并实现高准确性和适应性的先进方法和程序。\n\
  \n脑瘤的自动分类是非侵入性的，消除了活检的需求并提高了诊断精度。研究社区在创建这些方法方面投入了大量精力。将脑瘤分为相应的组织学类别是另一项已取得高性能的任务。\n\
  \n利用深度学习进行脑瘤分类。本文介绍了一种使用卷积神经网络（`CNN`）从脑部图像中提取特征，并使用全连接网络进行分类的方法。本章还比较了不同的`CNN`架构，如基础`CNN`和`VGG16`，并在数据集上报告了\
  \ 95.71%的准确率 [11,12]..。\n\n研究提出了基于机器学习的算法用于脑部分析和图像分类。Abd-Ellah 等人对脑`MRI`扫描诊断技术进行了深入研究\
  \ [13]..，他们对比了深度学习与传统机器学习技术的优缺点。作者还引入了一种新型脑瘤图像半自动分割方法 [6]..。该模型使用`T1W`配置进行三维`MRI`分割。为了分类乳癌图像，引入了一种基于`CNN`的架构。该系统的设计通过从拟合尺度检索信息，在肿瘤分割和定位上达到了最高水平。\n\
  \n\n\n\nSomasundaram 和 Gobinath [15] 提出了一些利用 MRI 图像识别脑恶性肿瘤的技术。研究人员调查了利用 `3D CNNs`、多分类支持向量机\
  \ (`SVMs`）和 `SVMs` 进行分割增强的效率。深度学习技术和 `CNNs` 在包括脑肿瘤识别在内的医学图像处理应用中表现出卓越的性能。使用深度学习技术对脑肿瘤进行分类和分割产生的结果比传统的机器学习分类器更优。\n\
  \n另一项研究使用深度学习神经模型从 MRI 中提取特征 [16]。这些特征随后被输入机器学习分类器，包括多层感知器 (`MLPs`)、`SVMs` 和 朴素贝叶斯。当使用\
  \ `SVMs` 时，所提的方法实现了 96% 的分类准确率。在 Kumar 等人 [17] 的研究中，调查了多种用于脑肿瘤识别和分割的机器学习和深度学习方法。这些方法包括支持向量机、K-最近邻\
  \ (`KNN`)、`MLPs`、朴素贝叶斯和随机森林算法。值得注意的是，传统 `SVMs` 的分类准确率为 92.4%，最高。研究人员还展示了一种具有五层的\
  \ MRI 脑肿瘤识别的自定义 `CNN` 设计，其实现了惊人的 97.2% 准确率。\n\nKhan 等人 [18] 使用 `VGG19 CNN` 架构结合\
  \ K-means 聚类来识别和分割 MRI 数据中的脑肿瘤。提出的方法最初将输入的 MR 模态分为切片，然后使用统计归一化程序对强度进行预处理。该方法的总准确率为\
  \ 94%。\n\n基于机器学习的脑肿瘤识别与分类：广泛综述。该研究对关于机器学习方法（如深度学习）用于脑肿瘤识别和分类的文献进行了全面评估。该研究讨论了用于脑肿瘤分析、分割、特征提取、分类、增强技术、公开数据集以及脑肿瘤解剖的深度学习方法。该研究还涵盖了该领域的优点、缺点、进展以及潜在的未来方向。\n\
  \nMajib 等人 [19] 提出了一种名为 `VGG-SCnet` 的创新方法，它结合了叠加在分类器之上的 `VGGNet`。为了从 MRI 图像进行脑肿瘤自动诊断，科学家通过其方法建议的额外层改进了预训练的\
  \ `VGG-16` 模型，以实现更快速更高效的训练。在数据准备阶段，使用最显著的轮廓识别感兴趣区域。使用增强技术纠正了数据集中的类别不平衡问题。由于特征较少，选择第六层进行特征提取。最后，使用多层分类器检测图像中的肿瘤。\n\
  \n深度迁移学习方法脑肿瘤检测中的性能分析。为了自动预测脑肿瘤细胞，该研究比较了使用迁移学习的 `CNN` 预训练 `VGG-16`、`ResNet-50` 和\
  \ `Inception-v3` 模型的性能。论文使用 `BRATS 2015` 和 `BRATS 2017` 数据集对模型进行评估。文章报告在 `BRATS\
  \ 2017` 上的准确率为 97.5%，在 `BRATS 2015` 上的准确率亦如此 [10]。\n\n基于深度学习的脑肿瘤检测与分类。该研究分别使用先进的目标检测框架\
  \ `YOLO` (You Only Look Once) 和深度学习库 `fastai`，提供了两种基于深度学习的脑肿瘤检测和分类技术。该研究通过 `BRATS\
  \ 2018` 数据集的一部分（包含 1992 张脑 MRI 图像）评估了这些方法。研究显示 `YOLO` 和 `fastai` 的准确率分别为 96.8% 和\
  \ 97.6%。\n\n## 7.3 提出的方法\n\n`ResNet-50`（残差网络 50）是一种在图像分类和其他计算机视觉应用中表现出的 `CNN` 设计。它是一个具有\
  \ 50 层的深度神经网络，其核心创新是使用了残差连接，这允许它训练更深的网络而无需处理梯度消失问题。这通过添加额外的神经层同时减少错误率，提升了深度神经网络的性能。换句话说，跳跃连接（skip\
  \ connections）将先前的层输出与堆叠层的输出相结合，允许训练比以前深得多的网络。\n\n`CNNs` 是一类主要用于处理网格数据结构（如图像）的深度学习模型。它们由多个相互连接的层组成，即卷积层、池化层、非线性激活层和全连接层，顺序排列以从底层像素输入中提取高级抽象。`CNNs`\
  \ 的基石围绕局部连接和权重共享原理，通过邻近像素的逐步聚合形成空间特征层次结构。因此，`CNNs` 比传统的手工特征具有更优越的表示能力，使其对各种计算机视觉应用非常有效。\n\
  \n残差网络（`ResNets`）以旗舰模型 `ResNet-50` 为例，引入了创新设计元素，旨在对抗由深度增加带来的负面影响。具体而言，`ResNets`\
  \ 包含了由多个卷积层组成的残差块，这些层配备了快捷连接（也称为跳跃连接）。这些连接允许激活值从较早层直接传输到后期，在整个架构中有效形成形成并行信号路径。值得注意的是，残差块使\
  \ `ResNets` 学习残差映射而不是直接特征表示，从而简化了优化区域并缓解了困扰深层架构的梯度消失问题。\n\n为了进一步阐明，让我们检查 `ResNet-50`\
  \ 中典型残差块的内部组成。它通常包含两个或三个连续的卷积层，之间夹着批归一化和修正的线性单元（`ReLU`）操作。一个关键区别在于增加了快捷连接，它跳过了中间层，与来自先前的层的激活输出进行逐元素求和。在反向传播期间，这些跳跃连接促进了更平滑的梯度流，减少了缺乏此类机制的标准前馈网络中遇到的优化困难。\n\
  \n通过堆叠多个残差块，`ResNet-50` 构建了一个层次化框架，能够捕捉输入数据中日益复杂的模式。此外，`ResNet-50` 采用了瓶颈结构设计以提高计算效率，其中每个残差块由三个嵌套的子块组成，这些子块具有降维、变换和恢复操作。总而言，`ResNet-50`\
  \ 体现了残差学习范式的威力，在保持相当复杂度水平的同时，证明了其相对于竞争对手性能的显著提升。\n\n\n\n\n\n综而言，`CNNs` 和 `ResNet-50`\
  \ 都属于专门用于网格数据分析的深度学习模型。虽然 `CNNs` 为现代计算机视觉架构奠定了基础，但 `ResNet-50` 引入的创新解决了由深度增加带来的关键局限性，最终增强了表达能力和稳定性。通过卷积层、批量归一化、激活函数和残差连接的合理组合，`ResNet-50`\
  \ 成为应对各种现实世界挑战的有力工具，涵盖了医疗诊断、自动驾驶和监控系统等。\n\n`ResNet-50` 的核心是一个复杂的深度架构，经过精心构建，旨在利用残差连接的潜力，并在具有挑战性的计算机视觉任务中提供卓越性能。该架构由\
  \ 50 个级联的残差块组成，这种金字塔结构在保留空间分辨率的同时，系统地扩展和收缩通道维度，从而在表示能力和计算可行性之间达到了最优平衡。每个残差块包含三个卷积层：用于降维的\
  \ `1 × 1` 卷积，用于挖掘上下文关系的 `3 × 3` 卷积，最后是另一个用于恢复初始维度的 `1 × 1` 卷积。这种优雅的配置不仅简化了信息流，还减少了参数膨胀，贡献了\
  \ `ResNet-50` 受誉的简洁性。\n\n`ResNet-50` 深度架构的一个显著特征是跳跃连接（skip connections），它们跨越残差块并在远程层之间建立了直接通信通道。这些通道确保了原始输入信号渗透整个网络，强化了特征层次，并减轻了噪声放大或失真带来的不利影响。此外，它们赋予了\
  \ `ResNet-50` 抵抗梯度消失困境的免疫力，即使在面对巨大的深度时也能保持稳健的学习动态。\n\n总之，`ResNet-50` 的深度架构织就了一张复杂的学习表示织谱，逐步分离了控制视觉概念的潜在因素，并为相关领域之间的知识迁移开启了新机会。无论是作为独立实体部署，还是集成在更大的集成框架中，这些深层模型继续担任推动人工智能研究和工业应用发展的支纽。\n\
  \n### 跳跃连接 (Skipping Connections)\n由于它们能够让梯度“跳过”层，这些残差连接通常被称为跳跃连接，它们使得极深网络的训练成为可能。\n\
  \n### 瓶颈架构 (Bottleneck Architectures)\n在更深网络的每层中使用相同数量的过滤器在计算成本很高。`ResNet-50` 采用其“瓶颈”设计，每个残差块有三层：`1\
  \ × 1`、`3 × 3` 和 `1 × 1` 卷积。由于 `1 × 1` 卷积首先降低后扩展维度，它在计算上更高效。\n\n### 全局平均池化 (Global\
  \ Average Pooling)\n网络末尾使用了全局平均池化，而不是全连接层。这种方法减少了过拟合以及网络中的参数量。\n\n### 预训练模型 (Pre-Trained\
  \ Models)\n`ResNet-50` 的权重已经在大型数据集（如 `ImageNet`）上学习过，经常被预预训练模型。对于较小的数据集，这些预训练权重可以针对特定任务进行调整。\n\
  \n不同模型的比较如表 7.1 所示，强调了性能指标的变化。\n\n#### 表 7.1 与各种模型的比较\n\n| 模型 | 训练参数 | 验证准确率 | 验证损失\
  \ | 测试准确率 | 测试损失 |\n| --- | --- | --- | --- | --- | --- |\n| Mobilenet | 3206976\
  \ | 0.9648 | 0.1321 | 0.9531 | 0.3220 |\n| Inception-v3 | 21768352 | 0.9688 | 0.2712\
  \ | 0.9621 | 0.3091 |\n| DenseNet-121 | 8068994 | 0.9812 | 0.1708 | 0.9745 | 0.0723\
  \ |\n| ResNet-50 (提出的) | 25698306 | 0.9910 | 0.0429 | 0.9949 | 0.0177 |\n\n## 7.4\
  \ 结果\n\n在训练过程中，我们的深度学习模型被分为两个不同的类别。初始类别标记为“是（yes）”，包含一组显示脑肿瘤明显迹象的图像。相反，第二个类别标记为“否（no）”，由显示健康或无肿瘤的脑部图像组成。\n\
  \n预测阶段完成后，我们的模型对每张输入图像给出判决，将其指定为属于“是”或“否”类。当图像属于“是”标签时，意味着所描绘脑组织中存在脑肿瘤。或者，如果图像接收到“否”分类，则意味着分析的脑图像没有显示出任何可识别的肿瘤指标。\n\
  \n总之，我们的深度学习模型是区分显示肿瘤的脑图像与健康脑图像的可靠工具。通过准确对输入进行分类，它使医疗专业人员能够进一步的诊断程序和潜在治疗方案做出明智决策。\n\
  \n我们的大型数据集总共包含 21672 张单独的 MRI 图像，为了训练和验证我们的深度学习模型而精心筛选。在在这些图像中，有 3066 个实例代表健康或无肿瘤的脑。相反，有大量的\
  \ 18606 张图像显示了不同类型脑肿瘤的存在（图 7.1）。\n\n![图 7.1 带有脑肿瘤的图像。](img/Fig07_01.jpg)\n\n图 7.1\
  \ 脑肿瘤\n\n图 7.1a 展示了上方 MRI 图像的示例，而图 7.1b 突出了数据集中的侧面 MRI 图像。多样化的表示使我们的模型对复杂情况有更全面的理解。\n\
  \n为了确保在训练和验证过程中数据的平衡和代表性，我们将数据集仔细地分为两个部分。整体的 80%用于密集训练，允许我们的模型从大量样本中有效学习。同时，其余 20%作为宝贵的测试数据，使我们能够严格评估模型性能并据此调整参数。\n\
  \n在整个研究过程中，我们致力于探索创新方法并精炼我们的深度学习模型，以在脑肿瘤检测领域达到与伦比的精确度和准确性。\n\n我们在脑肿瘤数据集上训练的深度学习模型在分类肿瘤方面表现优异。模型实现了\
  \ 99%的准确率、99.36%的敏感性和 98.78%的特异性。这些指标表明了模型在区分肿瘤和无肿瘤脑图像方面的稳健性。\n\n```\n$\\text{Sensitivity}\
  \ = \\frac{\\text{True��positives}}{\\text{True��positives} + \\text{false��negatives}}$\n\
  \n$\\text{Specificity} = \\frac{\\text{True��negatives}}{\\text{True��negatives}\
  \ + \\text{false��positives}}$\n```\n\n### 7.4.1 混淆矩阵\n\n**真阳性 (TP)**: 3737\n在这些实例中，您的模型准确地推出示例是正类（肿瘤）的成员。\n\
