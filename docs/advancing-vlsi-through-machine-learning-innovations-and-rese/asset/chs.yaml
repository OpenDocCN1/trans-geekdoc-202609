  \ | 18 | 28.5 |\n\n### 12.4.2 环境变化\n\n在本节中，针对变化的电源电压分析了所提 9T SRAM 的性能。图 12.5a、图\
  \ 12.5b 和图 12.5c 分别显示了所提 9T SRAM 的 `SNM`、访问时间以及功耗随电源电压的变化。图 12.5a 显示，随着电源电压（VDD）的增加，所提\
  \ 9T SRAM 出现明显的趋势。提供足够的电源可以减少这些泄漏电流，从而提高稳定性。但注意到 `VDD` 超过 1.1 V 会加剧各种形式的噪声（例如工艺波动和晶管匹配），导致错误敏感性增加和稳定性降低。此外，在图\
  \ 12.5b 中，由于较大的电压波动和寄生电容增加，SRAM 操作速度在较高的 `VDD` 水平下往往下降。虽然图 12.6c 显示随着 SRAM `VDD`\
  \ 水平的增加，功耗相应上升，这种升高由于集成电路中电源电压与功耗之间的直接关系。当 `VDD` 升高时，SRAM 阵列中的每个存储单元都需要更多能量来存储和保留数据，导致整体功耗增加。因此，观察到增加\
  \ `VDD` 将加快所提 9T SRAM 的运行，但稳定性略有降低。但这会导致功耗增加。因此，可以优化工作 `VDD` 以在最小化静态功耗和保持 9T SRAM\
  \ 设计具有足够的性能和可靠性之间取得平衡。\n\n![图 12.5a 保持 SNM、读取 SNM 和写入 SNM 随 VDD 的变化](img/Fig12_05a.jpg)\n\
  \n\n\n\n图 12.5d, 图 12.5e, 图 12.5f, 图 12.5g, 图 12.5h, 图 12.5i 展示了所提 9T SRAM 的稳定性、访问时间和功耗随温度变化的情况。图\
  \ 12.5d, 图 12.5e, 图 12.5f, 图 12.5g 显示 SRAM 的 `SNM` 通常随着温度升高而降低。由于温度升高会导致晶体管漏电流增加，这会影响存储数据的稳定性。此外，较高的温度会加剧工艺变异，导致晶体管特性不一致并降低\
  \ `SNM`。虽然如图 12.5h 所示，SRAM 的读访问时间随温度升高而增加，但这种现象是由于载流子热运动加剧导致更高的寄生效应和增加的延迟。写访问时间随迁移率的增加在一定程度上有所减少，但在不同温度下几乎相似。最后，图\
  \ 12.5i 显示了所提 9T SRAM 功耗随温度的变化。可以观察到，在保持（hold）和写（write）操作期间，迁移率随温度升高而增加，从而导致漏电流增大。因此，保持和写操作期间的功耗随温度升高而增加。尽管这似乎违反直觉，但所提\
  \ 9T SRAM 在读操作期间的功耗随温度升高而降低。因为温度的升高增加了可以激活半导体材料中载流子的热能，使它们能够更有效地填充原本会产生漏电流的陷阱和状态。因此，漏电流减小，导致整体功耗更低。因此，可以说，随着温度升高，所提\
  \ 9T SRAM 将导致稳定性降低和读操作变慢，但整体功耗保持恒定。\n\n![图 12.5d 所提 9T SRAM SNM 随温度变化的图](img/Fig12_05d.jpg)\n\
  \n图 12.5d 所提 9T SRAM `SNM` 随温度变化的图。\n\n![图 12.5e 读 SNM 随温度变化的图](img/Fig12_05e.jpg)\n\
  \n图 12.5e 读 `SNM` 随温度变化的图。\n\n![图 12.5f 写 SNM 随温度变化的图](img/Fig12_05f.jpg)\n\n图 12.5f\
  \ 写 `SNM` 随温度变化的图。\n\n![图 12.5g 保持 SNM 随温度变化的图](img/Fig12_05g.jpg)\n\n图 12.5g 保持\
  \ `SNM` 随温度变化的图。\n\n![图 12.5h 所提 9T SRAM 读写访问时间随温度变化的图](img/Fig12_05h.jpg)\n\n图\
  \ 12.5h 所提 9T SRAM 读写访问时间随温度变化的图。\n\n![图 12.5i 所提 9T SRAM 功耗随温度变化的图](img/Fig12_05i.jpg)\n\
  \n图 12.5i 所提 9T SRAM 功耗随温度变化的图。\n\n## 12.5 结论\n\n在本章中，对用于先进 AI/ML 应用的基于 FinFET 的\
  \ 9T SRAM 的设计和性能评估进行了全面研究。通过详尽的分析和仿真，本章展示了所提架构的卓越特性，突出了其增强的稳定性、降低的漏电功率、提升的读写性能，以及对各种工艺变异和环境因素的更强韧性。结果表明，FinFET\
  \ 技术与新型 9T SRAM 单元设计的创新结合，为满足未来 AI/ML 严苛先决条件提供了一条充满前景的途径。本章详细解释了为了实现针对 AI/ML 工作负载定制的高性能计算平台，在构建高效可靠的内存子系统时，所采取的优化结果以及各种参数之间的权衡。它表明，基于\
  \ FinFET 的 9T SRAM 可以实现快速的读写操作，但在稳定性和功耗方面进行了一定的权衡。虽然基于 FinFET 的 9T SRAM 不易受到温度等环境变化的影响，但功耗随电源电压的增加而增加。通过研究所提\
  \ SRAM，未来的研究可以进一步针对各种工艺变异、多单元设计和存储阵列等进行分析，以满足下一代 AI/ML 硬件性能的要求。\n\n## 12.6 谢谢\n\n\
