  \n# 2 AlGaN/GaN HEMTs 性能下降中陷阱现象的物理过程分析与洞察研究\n\nRayabarapu Venkateswarlu, G.P.S.C.\
  \ Mishra, and B. Acharya\n\nDOI: [10.1201/9781003483038-2](https://doi.org/10.1201/9781003483038-2)\n\
  \n## 2.1 引言\n\n\n\n\n\n宽带隙材料，如生长在硅、蓝宝石和碳化硅上的氮化镓（GaN）功率器件，本质上用于大功率、微波和毫米波（mm）波应用。由于其独特的特性，它能够为金属氧化物半导体场效应晶体管（`MOSFETs`）提供高击穿电压和高开关速度，且低动态导通电阻（`Dynamic-R*[ON]`）。`AlGaN/GaN`异质结由压电和自发极化诱产生高电子电荷密度，称为二维电子气（`2-DEG`）。这些三族氮化物材料的异质结特性形成了高电子迁移率晶体管中基于\
  \ GaN 的 `AlGaN/GaN` 异质结构。由于高电子迁移率的卓越特性，这些器件被应用于先进的毫米波、雷达、航空电子、功率开关和功率放大应用[1]。对于毫米波通信，需要高功率和大效率的功率放大器来满足高数据率传输的需求。第五代移动通信应用使用固态器件。传统的硅基器件无法满足高功率和高频率的要求。利用金属有机化学气相沉积开发的\
  \ GaN 射频（RF）电路设计近期取得了显著进展[2, 3, 4, 5, 6]。氮化硅是一种常用的钝化材料，已尝试使用多种生产技术将其应用于 GaN HEMTs\
  \ 上，包括 PECVD（等离子体增强化学气相沉积）[7]。该名称本身表明由于拥有 `2-DEG`，器件的速度（开/关比）非常快，范围从 10⁶ 到 10¹⁰。高电子迁移率器件最重要的特征是其阈值电压（`V*[TH]`）和饱和漏极电流（`I[D]*`）。阈值电压偏移是由于栅极电极下方负电电陷阱引起的。漏极电流的上升由于截止电压（`V[P]*`）偏移引起，导致栅极电流\
  \ `I[g]` 和 `I[gdo]` 降低[8]。此外，热电子载流子陷将在长时间应力下存在外延，退化器件的 DC 特性和 RF 性能[9]。\n\n## 2.2\
  \ 导带中的能态描述\n\n*AlGaN/GaN HEMT 的理论背景*：HEMT 是一种场效应晶体管（FET），采用 III-V 族元素的异质结结构，适用于高开关速度和高功率需求。GaN\
  \ 是一种三族氮化物直接带隙半导体，具有六方晶体结构。GaN 化合物是一种非常硬的材料，在纤锌矿晶体结构中具有镓和氮分子双层。这些双层存在晶格失配，导致自发极化（`P*[SP]`）和压电极化（`P*[PE]`）。随着应变\
  \ `AlGaN` 中铝（Al）浓度的增加，压电极化（`PPE`）和由总极化诱导的电子电荷密度也随之增加。`P*[SP]` 和 `P*[PE]`（自发和压电极化）电荷的存在导致\
  \ `2-DEG`（数量级为 10¹³ cm^(−2)）层载流子密度。电荷密度带隙不连续是由 Al 摩尔含量引起的。Al 含量的使用实现了器件的优化。这些器件基于调制掺杂原理；因此，这些器件也被调制掺杂\
  \ FET 或异质结 FET。这是通过载流子从 `Al*[x]*Ga[(1−]*[x]*[)]As/Al*[x]*Ga[(1−]*[x]*[)]N` 邻屏障层中的供体离子传输实现的，其中\
  \ `x` 表示进入高纯 GaAs/GaN 的 Al 浓度，电子和离子被内置异质结电势隔开[10]（图 2.1）。\n\n\n\n\n\n影响设备特性的挑战性参数包括：\n\
  \n- **载流子的捕获与释放**：当被捕获的电载流子释放时，它们会导致电流波动，使设备容易产生噪声和非理想行为。当捕获电子发射时，GaN 通道的 2-DEG（二维电子气）浓度会增加。陷阱会在载流子穿过二维电子气通道时捕获电载流子（n-HEMT\
  \ 中的电子），从而改变整体迁移率和电流流。设备内部温度的升高会导致栅极漏电流增大以及栅极端电压降增加。陷阱效应主要是由于栅极与漏极之间栅边缘漏极侧存在高场。\n\
  \n- **载流子迁移率**：陷阱会限制电载流子的移动能力，从而降低其迁移率。载流子在遇到陷阱时会发生散射，导致电流流效率降低。设备的速率、通用有效性和放大能力都会受到陷阱的影响。\n\
  \n- **阈值漂移（V[TH] 变化）**：阈值决定了设备切换到开启状态的状态。当设备在开启和关关闭之间进行切换时，由于陷阱的存在，可能会发生改变。栅极边缘的大负偏压会导致阈值电压漂移，因为这在栅极端下方留下了更多电子，导致表面供体陷阱产生虚拟栅极。虚拟栅的形成是由于表面净正电荷的衰减。这是由于存在于表面供体类能态的电子陷阱引起的\
  \ [14]。这些波动会导致设备行为和性能的变化，使得控制和预测其工作特性具有挑战性。\n\n- **退化与老化效应**：随着电荷以陷阱的形式在晶体管内部形成，设备的性能可能会随时间的推移而逐渐变化。结果是设备性能下降，包括增益降低和设备工作寿命缩短。\n\
  \n- **噪声与不稳定**：陷阱给电载流子的捕获和释放引入了不可预测性，导致噪声和不稳定。设备的电学行为由于随机性产生波动，增加了噪声、恶化了信号质量并导致输出不稳定。\n\
  \n## 2.4 捕获机制\n\n不同类型的陷阱如下：\n\n### 2.4.1 栅极漏电陷阱\n\n位于栅极-通道界面附近的陷阱会促进漏电流的产生。功率消耗和能量效率受到影响。根据电荷中性条件，在没有外部电场的情况下，极化电荷的大小会相等。随着相反电荷的积累，受体陷阱的电离也会增加，导致电子浓度降低\
  \ [15]。阈值电压（漂移）的变化受到栅下场的强烈影响，特别是当器件处于偏置（即静态）状态时 [8,16]。当施加栅极的电压超过临界值时，栅极漏电流占主导地位\
  \ [17]。改善栅极漏的关键现象模型包括陷阱进入势垒 [9,17]、晶格失配、AlGaN  中的缺陷 [9] 以及势垒层中的反压电极化效应 [18]。高质量\
  \ `SiO[2]/AlGaN` 和 `Si[3]N[4]/AlGaN` 界面的组合使栅极漏电流降低到常用高电子迁移率器件的几个数量级以下，具有良好的线性和饱和电流。双层还会导致较大的正阈值电压漂移。引入铟（In）活性剂和少量碳（C）可以改善表面和界面粗糙度\
  \ [19]。如果通过等离子体处理将深受体引入 AlGaN 势垒表面，它们会补偿高密度电荷，从而增加栅耗尽层厚。由于电子隧穿，栅极漏电流减小 [20,21]。\n\
  \n### 2.4.2 界面陷阱\n\n界面陷阱位于半导体与绝缘材料或钝化层之间。这些陷阱由于器件制造过程中引入的缺陷或界面本质产生。漏极的变化趋势源于电离受体类界面陷阱浓度的变化。界面陷阱会影响跨界面的电荷传输特性并改变器件特性\
  \ [15]。与金属氧化物半导体器件相比，电质材料与通道处半导体之间的连接，埋通道三氮化物金属-绝缘-半导体异质结构包含两个界面：一个位于钝化层/三氮化物，另一个位于势垒到通道层的界面。这增加了三氮化物异质结构中界面陷阱的提取难度\
  \ [22]（见图 2.5）。\n\n\n\n\n陷获和去捕获效应由于晶格结构不匹配和电流传输过程问题而在设备中出现的缺陷。陷阱可以是供体陷阱或受体陷阱。如果一个或多个电子捕获或从导带（`CB`）发射，或者空穴捕获或从价带（`VB`）发射就会形成陷阱。例如，陷阱是空的，当一个或多个能级被电子占据时，带负电的陷阱会电离。类似地，当一个或多个能级为空且所有能级都被电子填充时，供体陷阱带正电并电离。通过复合过程，释放的能量由于辐射复合（光子）、非辐射复合（声子）或俄歇复合。如果受限态中的电载子与相反符号的电载子复合，且电载子也被局部捕获，就会产生陷阱。\n\
  \n陷获和去捕获现象降低了晶体管性能，因此影响了 GaN/AlGaN 晶体管的可靠性。界面陷阱可能钝化/AlGaN 界面、AlGaN/GaN 界面以及缓冲层/GaN\
  \ 界面处存在[23]。不同的陷阱测量方法有：(i) 瞬态漏极滞和栅极滞，(ii) 脉冲 `I[DS]`–`V[DS]` 技术，(iii) 频率色散以及 (iv)\
  \ 脉冲 RF 激发。GaN 设备在执行高漏极偏置前后会出现电流下降，这被称为电流崩塌（CC）、电流跌落或电流色散 [24]。初始 CC 在高掺杂缓冲层中更严重，但由于较大比例被捕获电子的发射，观察到了较快的恢复过程。在开启后，较慢的恢复过程取决于铁浓度的高低。通过铁（Fe）缓冲层掺杂分布可以最大限度地减少缓冲层陷阱的负面影响。\n\
  \n阈值电压偏移或漂移（`ΔV[TH]`）是由哪些陷阱落在栅极下方引起的，这也影响了 `I[ds]`–`V[DS]` 饱和曲线。鉴于 T3 型陷阱靠近二维电子气，预计它们将主要影响直流电压（`I`–`V`）特性\
  \ [25]。在半开启状态下，热电子捕获加速了存在于钝化/势垒界面和 AlGaN 高电阻缓冲层处的陷阱。这就是 2-DEG 在势垒/沟道层耗尽的重要原因（图 2.6）。\n\
  \n![图 2.6 HEMT 截面图和陷阱位置：(I) T1 型表面陷阱，(II) T2 型 AlGaN 势垒陷阱，(III) T3 型 AlGaN/GaN 界面陷阱，以及\
  \ (IV) T4 型 GaN 缓冲层陷阱 [25]。](images/Fig02_06.jpg)\n\n图 2.6 HEMT 截面图和陷阱位置：(I) T1\
  \ 型表面陷阱，(II) T2 型 AlGaN 势垒陷阱，(III) T3 型 AlGaN/GaN 界面陷阱，以及 (IV) T4 型 GaN 缓冲层陷阱 [[25]]。\n\
  \n初始 CC 在高掺杂缓冲层中更严重，但由于较大比例被捕获电子的发射，观察到了较快的恢复过程。在开启后，较慢的恢复过程取决于铁浓度的高低。通过铁（Fe）缓冲层掺杂分布可以最大限度地减少缓冲层陷阱的负面影响。\n\
  \n阈值电压偏移或漂移（`ΔV[TH]`）是由哪些陷阱落在栅极下方引起的，这也影响了 `I[ds]`–`V[DS]` 饱和曲线。鉴于 T3 型陷阱靠近二维电子气，预计它们将主要影响直流电压（`I`–`V`）特性\
  \ [25]。在半开启状态下，热电子捕获加速了存在于钝化/势垒界面和 AlGaN 高电阻缓冲层处的陷阱。这就是 2-DEG 在势垒/沟道层耗尽的重要原因（图 2.6）。\n\
  \n\n\n\n深能级是电子赋予导带或从导带接受的能量态。半导体带隙中存在不同能量态的陷阱被 `VB` 和 `CB` 隔开。这些陷阱可以捕获和释放较高活化能的载流，对载流寿命和复合动力产生不利影响。缓冲层是一种半绝缘材料，用于减少深能级中的热电子注入陷阱。掺\
  \ `Fe` 的缓冲层具有小的 `CC`。缓冲层用于隔离器件和载流沟道限制。为了限制沟道载流，必须引入足够的 `GaN` 缓冲层以获得高浓度深受体。为了最大化晶管的射频功率性能，需要良好的缓冲工程补偿技术，使能带上半部分的费米能级位置接近导带\
  \ [33]。所采用的是本征或外延深供体或受体缺陷这两种掺杂方法，导致费米能级卡在带隙的顶部区域 [34]。`Fe` 掺杂浓度影响缓冲层中的深能级 [35]。通过增加缓冲层中的\
  \ `Fe` 掺杂来检查陷阱能。发现 `CC` 显著取决于缓冲层中的陷阱位置。`Fe` 掺杂导致原生 `GaN` 缺陷浓度的增加 [36]。在射频工作条件下，`GaN\
  \ HEMTs` 面临最具挑战性的条件，包括高电流电荷密度、强电场和沟道温度。射频运行引起了在热和直流测试中未观察到的结聚模式 [37]。高电阻半绝缘缓冲层能够实现输出功率，提高击穿电压，并最小化\
  \ `SCEs` 和缓冲层漏电 [38]。利用本征生长缺陷产生深供体和受体可以实现缓冲隔离 [39]。与阶梯掺杂 `C` 和高掺杂 `C`（`stepped-C`\
  \ 和 `high-C`）器件相比，低掺杂 `C` (`Low-C`) 观察到高栅漏电流，因此 `AlGaN/GaN` 界面能带斜率增加。电子隧穿是栅漏电流的原因。由于高\
  \ C，器件的射频性能严重下降，降低了输出功率和漏极效率 [24]。应选择标定的 `C`-掺杂陷阱能级 [14]。通过引入 `Fe` 或 `C` 的深能级受体陷阱可以高电阻\
  \ `GaN`。碳掺杂比 `Fe` 更主导，因为可以以阶梯方式组织，对沟道中的杂质进行极大控制 [39,40]。高 `C` 浓度能够实现高击穿电压，但也会与二维电子气形成浮空\
  \ p-n 结（在 `2-DEG` 和缓冲层之间），导致更多的 `CC` [34,41,42]。在大电场下，`GaN HEMT` 微波输出功率受限于 `C` 掺杂缓冲层中的局域态。`C`\
  \ 浓度通过在 `GaN/氮化铝` (`AlN`) 成核界面层处形成位错和捕获来实现陷阱。通过更多地关注碳的相互作用，可以减少微波应用 `GaN HEMTs`\
  \ 的位错。通过使用半绝缘 `GaN` 衬底可以最小化位错密度，并通过添加含 `C` 气体而非改变生长参数来控制 `C` 浓度 [43] (图 2.7)。\n\n\
  ![图 2.7 HEMT 结构 (a) 具有厚缓冲层 (b) 具有薄沟道层，其中 n 定义铝浓度 [43]。](images/Fig02_07.jpg)\n\n\
  图 2.7 HEMT 结构 (a) 具有厚缓冲层 (b) 具有薄沟道层，其中 n 定义铝浓度 [43]。\n\n在不影响其射频性能的情况下实现高击穿电压的方法最小化受体捕获浓度。漏电流由于以下原因：(i)\
  \ `Si` 掺杂浓度高于或相当于受体掺杂浓度；(ii) 受体浓度与 `Si` 掺杂一样。在第一情况下，漏电流是因为 `Si-doping` 引起的额外电子。在第二种情况下，漏电流是因为受体陷阱诱发的空穴。空穴诱发的漏极电将在强电场中工作，并结合受体掺杂诱发的空穴，累积增加漏电流\
  \ [44]。无缓冲层的高频 `HEMT` 生长在外延 `AlN` 成核层上 [45] (图 2.8)。\n\n![图 2.8 梯度变化的 AlGaN 缓冲层\
  \ AlGaN/GaN HEMT [49]。](images/Fig02_08.jpg)\n\n图 2.8 梯度变化的 AlGaN 缓冲层 AlGaN/GaN\
  \ HEMT [49]。\n\n在 `AlGaN` 层中具有 `Al` 浓度的线性梯度负极化电荷已从 25% 设计到 16%。通过均匀引入密度为 `-0.2505\
  \ C/cm³` 的负电荷以及 `GaN/AlGaN` 界面极化电荷 `-1.33 μC/cm²`，补偿了带正电的背景电离供体，导致导带远离费米能级 [46]。但深能级陷阱抑制了缓冲层中的漏电和\
  \ `SCEs`，这些不需要的缓冲陷阱/深能级陷阱可以通过排除厚缓冲层来最小化。\n\n\n\n\n这些缺陷存在于半导体的表面。这些陷阱会导致电荷载子的复合和散射，从而影响器件的速率和效率\
  \ [47]。当`GaN HEMT`器件由于栅极和漏极之间存在表面电荷而过驱动时，会发生电流崩溃（CC）[48]。这些表面陷阱通过扩展接入区域的耗尽区，除了内源栅外，还表现得像虚拟栅一样\
  \ [11,12,48]。虚拟栅效应是由来自通道的热电子或从栅极表面被推出的电子引起的 [47,49]。热电子诱导的晶格缺陷或陷阱会降低`GaN` 晶体管的可靠性。由于高漏极偏压产生的电子（热电子）会增强陷获效应，并形成新的陷获/去陷获过程，因为这些被捕获的电荷会影响电场（热电子），导致影响`AlGaN/GaN`的静态和\
  \ RF 性能。在不同的栅偏压和漏偏压值下进行电致光（`EL`）测量可以发现热电子的影响 [8]。热电子限制了射频下的输出功率，并最终导致低漏偏压下所谓的负微分电导（`NDC`）现象。在开启态观察到阈值电压漂移和漏电流减小。在截止态击穿中，碰撞电离产生电子空穴对（`EHPs`）。空穴流向负电的栅极，少数被陷获在表面层。由于`SiNx/AlGaN/GaN`界面处价带的不连续性，空穴向氮化硅的转移会导致漏电流增加并导致阈值电压变得更负。当漏极偏压大于截止电压时，高电场集中在漏极侧的栅边缘。强电场由于高电位产生热电子，这些电子延伸到势垒层并被`AlGaN`表面陷阱捕获。随着漏极应力和脉冲时间的增加，虚拟栅逐渐扩展并导致漏电流下降。这种\
  \ CC 可以通过以下方法消除：(a) 可以使用表面钝化来减少`AlGaN`表面陷阱密度；(b) 在`AlGaN`表面添加施主掺杂以补偿表面陷阱；以及(c) 使用不同类型的`FP`抑制漏极侧存在的高电场。`FP`可以是`源极-FP`、`栅极-FP`、`漏极-FP`以及这些`FP`向接入区域的延伸。遗憾的是，`FP`引入了额外的内电容，影响器件的\
