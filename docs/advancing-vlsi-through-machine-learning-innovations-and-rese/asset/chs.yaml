  \n图 15.3 提议系统的硬件实现。\n\n### 15.3.5 算法\n\n区块链平台的共识机制可以分为许可链（如 `Hyper Ledger` 和 `Ethereum\
  \ Private`）或无许可链（如 `Ethereum`）。许可链拥有预先选择的节点，而无许可链则允许任何人加入。这使得使用高扩展性和高带宽效率的共识类型成为可能。权威证明（`PoA`）共识是一种提供容错能力和高性能的共识类型。`Ethereum`\
  \ 和 `Parity Technologies` 的联合创始人 Gavin Wood 在 2017 年提出了这一术语。\n\n**PoA 的工作原理**：在\
  \ `PoA` 中，证明了其合法性的节点被授予创建新区块的能力。这些节点被称为“验证者”，它们运行的软件使其能够将交易分组为区块。由于该过程是自动的，验证者不需要密切关注他们的计算机，但他们需要确保它们的安全。`PoA`\
  \ 在分布式信任环境中运行良好，例如 `PoA Network` 这样的公共网络。由于 `PoA` 共识算法重视身份，区块验证者质押的是声誉而非代币。`PoA`\
  \ 受对所选身份的信任保护。\n\n**PoA 共识的条件**：`PoA` 共识通常在以下条件下应用，尽管它可能取决于具体的实现。验证者必须证明其真实身份。候选人需要准备好承担声誉和资金风险。严格的筛选程序降低了选择可疑验证者的可能性，并鼓励对区块链的持续投入。在验证者选择过程中，每个候选人都应被等对待。验证验证者的身份对于维护区块链的完整性是必要的。应该有一套程序来选择可靠的验证者。\n\
  \n**PoA 共识的优势**：对于生成的新区块具有高容量，区块以可预测的间隔生成（这与 `PoW` 不同），只要 51% 的节点没有恶意行为。**高交易率**：这比计算密集型算法（如\
  \ `PoW`）更健壮。\n\n**局限性**：`PoA` 是尝试提高中心化系统的效率；`PoA` 验证者是公开的。它不是去中心化的。验证者的可能会受到外部操控而损坏。\n\
  \n### 15.3.6 模块实现\n\n**IPFS 模块**：`IPFS` 是点对点（或 `P2P`）存储网络。节点可以通过中继、存储或两者同时进行来访问全球任何地方的内容。如果你要求\
  \ `IPFS` 定位某个东西，它可以使用内容地址而不是位置来实现。理解 `IPFS` 基于三个核心概念：使用分布式哈希表 (`DHTs`）进行内容发现、通过有向无环图\
  \ (`DAGs`）进行内容链接，以及通过内容寻址进行唯一标识。`IPFS` 生态是由这三个相互支持的支柱实现的。让我们先讨论内容寻址和内容唯一标识。为了存储患者记录、医生咨询报告和其他数据，我们实现了\
  \ `IPFS` 模块。医生、保险公司和患者都可以访问相同的记录。\n\n**交易模块**：我们使用名为 `MetaMask` 的软件加密货币钱包处理交易，它与\
  \ `Ethereum` 区块链通信。通过移动应用程序或浏览器扩展，它允许用户访问其以太坊钱包，用于与去中心化应用程序交互。该模块的包含了 `MetaMask`\
  \ 钱包，它可以跟踪多个用户账户及其相应的加密货币余额。通过此钱包进行的每笔交易都由 `Ganache` 挖掘。此外，交易使用钱包中的资金完成。从前端开始，我们使用了\
  \ JavaScript 库 `ReactJS` 并结合了一些样式库 `Tailwind CSS` 和 `Bootstrap`。我们使用由 `Truffle Suite`\
  \ 生成的模板代码模板来实现，该模板通过 `Web3.js` 与以太坊区块链有预定义的连接。我们使用了一些工具来实现作为后端的区块链：`Ganache` 提供了一个私有的\
  \ `Ethereum` 区块链环境，允许你模拟以太坊区块链以与智能合约、限制账户和加密货币进行交互；以及 `Solidity`，一种面向对象的编程语言。\n\n\
