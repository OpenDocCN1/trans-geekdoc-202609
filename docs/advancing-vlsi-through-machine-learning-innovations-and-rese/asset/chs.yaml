  \n`Ethereum`（以太坊）是一个开源的去中心化区块链，支持智能合约。`Ethereum` 是一个去中心化区块链平台，创建一个点对点网络用于智能合约应用代码的安全执行和验证。在不需要可靠中央权威的情况下，参与者可以使用智能合约进行相互交易。目前以太坊区块链使用的工作量共识由矿工竞争创建包含处理后交易的新区块完成。获胜者在获得一些新创建的电子健康记录（ETH）之外，还将将新区块共享给整个网络。最快完成数学题的计算机将赢得比赛，并创建当前区块与上一个区块之间的加密链接。解决这个谜题是“工作量证明”的任务。工作量共识机制需要超过\
  \ 51% 的投票才能批准交易，从而保护了网络。\n\n`Visual Studio` 是一个既轻量又强大的开源软件，需要扩展来进一步开发。\n\n`MetaMask`\
  \ 是一个免费的在线多用途加密货币钱包，允许用户与以太坊区块链交互，存储和交换虚拟货币，并托管一个不断发展的去中心化应用程序（dApps）。\n\n`Ganache`\
  \ 是一个个人以太坊区块链，你可以在其中免费开发应用、部署合约、运行测试并执行其他任务。它用于测试智能合约。为了测试你的 `Solidity` 合约，你可以使用\
  \ `Ganache` 设置一个个人以太坊区块链。它用于测试智能合约。`Ganache` 为区块链开发提供了本地环境，创建一个托管在本地网络上的仿真以太坊网络，并提供虚拟以太坊以执行交易，同时对每笔交易进行可自定义的成本计算，并在开发完成后直接推送到以太坊主网。\n\
  \n`NPM Node JS`：Node 包管理器（NPM）完全用 JavaScript 编写，是 `Node.js` 的默认包管理器。`NPM` 是管理所有\
