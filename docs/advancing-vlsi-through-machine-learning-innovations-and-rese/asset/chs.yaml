  \ | 1.76 | 4.97 | 4.97 | 1.76 |\n\n\n\n\n\n确定最优电路参数的方法论整合了 `NN` 拟合与目标达成法，如详尽流程图所示。该方法首先对\
  \ `ANN` 进行监督训练，利用在 `Cadence 180 nm SCL` 环境下生成的约 150 次近似仿真以及基于 `HWPSO` 的最佳结果产生的数据集。该数据集涵盖了一系列电路规格，包括压变斜率（`SR`）、`A[v]`\
  \ 和单位增益带宽（`UGB`），如 表 1.1 所示。这些参数对于计算电路面积以及进行进一步仿真以评估增益、相位、噪声和功耗等性能指标至关重要。开发一个判别性\
  \ `NN` 以根据六个输入参数预测电路面积，为大量的数值仿真提供了一种快速的替代方案。这对于复杂电路模型特别有优势，因为 `ANNs` 可以加速跨越密集参数空间的计算过程。所采用的\
  \ `ANN` 是一种基于前馈的浅层反向传播网络（`FFBN`），对于较大的数据集可能会扩展为深度结构。该网络使用 sigmoid 对称传输函数作为激活函数，并在隐藏层中测试了十个节点。\n\
  \n数据准备涉及将初始数据集分为训练集、验证集和测试集，并采用随机划分以适应不同的训练场景。训练过程通过迭代调整 `ANN` 的权重和偏置，直到输出紧密匹配源自\
  \ `Cadence` 仿真的目标值。使用均方误差（`MSE`）和回归分析评估拟合质量。在建立有效的 `ANN` 模型后，下一阶段是通过目标达成法进行优化。该方法是非线性规划技术的一部分，如序列二次规划（`SQP`），旨在考虑各种约束条件的情况下，使与设定设计目标之间的偏差最小化。该方法的优点在于能够实现精确的优化结果，引导设计在满足指定性能标准的同时向最小电路面积发展。图\
  \ 1.3 展示了通过 `NN` 拟合和目标达成法估计最优电路参数的方案流程图。\n\n![FIGURE 1.3 计算最佳电路参数组的流程图。](img/Fig01_03.jpg)\n\
  \nFIGURE 1.3 计算最佳电路参数组的流程图。\n\n本研究提出了一种通过将 `ANNs` 与生物启发算法相结合来减少电路合成时间的新方法。通过使用 `ANNs`\
  \ 根据电路配置预测结果，最大限度地减少了对仿真进行性能评估的依赖。该过程涉及初始化解决方案、评估解决方案、使用历史数据训练 `ANNs`，并使用这些 `ANNs`\
  \ 进行性能预测。这有助于高效探索搜索区域，最终通过迭代优化直到达到收敛标准，加速最优电路配置的识别。\n\n## 1.4 结果与讨论\n\n仿真结果证明了将\
  \ `ANNs` 与生物启发算法相结合以增强电路合成效率的有效性，通过用 `ANNs` 替代仿真进行性能预测，在不损害合成电路质量的情况下，可以显著缩短执行时间。传统基于仿真的方法与我们提议的方法之间的对比分析突显了后者在计算效率和设计优化方面的优越性。所示结果是在\
  \ `Octave` `2.0` 版本和 `MathWorks MATLAB` `R2019a` 版本中确定的。用于总面积与六个设计标准之间关系拟合的 `ANN`\
  \ 是如 图 1.4 所示的浅层 `FFBN`。\n\n![FIGURE 1.4 用于电路面积拟合的人工神经网络（ANN）架构。](img/Fig01_04.jpg)\n\
  \nFIGURE 1.4 用于电路面积拟合的人工神经网络（ANN）架构。\n\n使用 `ANN` 处理电路总尺寸与八个相关参数之间的关系是一个浅层 `FFBN`，其拓扑结构如图图\
  \ 1.4](#ch01.xhtml#f1_4）所示。由于数据集总共只有 150 个样本且只有一个隐藏层，建议的 `ANN` 是浅层的。如果有更多的数据集，可能会采用深度结构（具有多个隐藏层的结构）[18]。考虑到给定数量的电路变量（输入\
  \ `i/p` 和输出 `o/p`），可以通过改变隐藏层和输出层中的神经元总数、引入额外的隐藏层（并利用深度学习方法 [19]）或更改激活函数来找到最优 `ANN`\
  \ 设计。\n\n在描述的工作中，作者利用带有 sigmoid 对称传输函数作为激活函数的浅层 `FFBN NN`。该 `NN` 用于拟合电路总面积与七个相关参数之间的关系。`NN`\
  \ 架构如图 1.4](#ch01.xhtml#f1_4）所示，具有双隐藏层。需要注意的是，对于包含 150 个示例的数据集，所选架构是浅层的。然而，作者建议，在数据量更大的情况下，深度\
  \ `NN` 架构可能更为合适。深度结构通常涉及多个隐藏层。“ANN` 配置的优化可以涉及以下策略：\n\n1. **增加更多隐藏层**：可以采用深度学习技术创建一个具有多个隐藏层的网络，使网络能够捕捉数据中更复杂的模式。\n\
  2. **调整隐藏层和输出层中的神经元**：每层神经元的总数会显著影响网络的学习和泛化能力。可以根据问题的复杂性和可用数据调整此参数。\n3. **更改激活函数**：激活函数在为网络引入非线性方面起着至关重要的作用。虽然描述的工作使用了\
  \ sigmoid 对称传输函数，但可以探索其他激活函数，如 `ReLU`（线性整流单元）、`Tanh`（双曲正切）或其他，以可能提高模型性能。\n\n本章方程\
  \ (1.13) 使用 sigmoid 对称传输函数作为激活函数：\n\n```\ny = 2 / (1 + e^{-2x})\n```\n\n训练期间使用的参数为：最大迭代次数\
  \ `1000`、目标值 `0`、性能最小梯度 `10^(-7}`，以及 `μ` 从 `0.001` 开始以 `0.001` 的倍数增加，最大为 `10^{10}`。验证检查期间允许的失败次数最多为次。`ANN`\
  \ 辅助目标达成法的常量和变量与寻找目标函数优化值的 `HWPSO` 相同。`ANN` 拟合函数通过使用 `Levenberg–Marquardt (LM)`\
  \ 算法处理非线性最小二乘曲线拟合问题获得，比例为 `70:15:15`，这意味着在数据集的 150 个示例中，70%（104 个）用于训练，15%（23 个）用于验证，其余\
  \ 15%（23 个）用于测试。使用 `150 × 7` 矩阵作为输入，`150` 个数值值的列作为输出，完成了用于馈 `ANN` 的 150 个示例训练。带有十个神经元的\
  \ `ANN` 拟合函数训练过程在一秒内通过成功通过六次验证满足了训练标准，梯度的下降如图 1.5](#ch01.xhtml#f1_5）所示。\n\n![FIGURE\
  \ 1.5 用于 ANN 拟合函数的数据回归。](img/Fig01_05.jpg)\n\n\n\n\n获得的优化值如表 1.4 所示。结果表明，基于`ANN`\
  \ 的方法实现了具有更高增益和`UGB`的设计，但是以增加面积和功耗为代价的。然而，这种增加在表 1.1 定义的规范范围内。\n\nTABLE 1.4 优化与基于\
