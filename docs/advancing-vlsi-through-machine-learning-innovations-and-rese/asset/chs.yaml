  电子与通信系\n电子工程学院\n韦洛尔理工学院\n印度泰米尔纳纳德邦\n\n# 1 优化电路综合：集成神经网络与进化算法以提高设计效率\n\nSwagata Devi,\
  \ Naushad Manzoor Laskar, Shreyas Nirgude, 和 Saanvi Srivastava\n\nDOI: [10.1201/9781003483038-1](https://doi.org/10.1201/9781003483038-1)\n\
  \n## 1.1 引言\n\n神经网络（NNs`）与进化算法的集成代表了模拟设计和仿真工具的范式转变，并为电路设计中的挑战提供了极具吸引力的解决方案。这种方法不仅加速了电路综合过程，还为电路设计自动化领域的未来进展奠定了基础\
  \ [1]`。传统，设计人员依赖手动方法来优化电路配置，事实证明这种方法耗力且耗时。随着计算技术的出现，进化算法成为自动化电路综合过程强大工具。这些算法允许设计人员高效地探索庞大的搜索空间，根据指定的性能准则识别最优电路配置\
  \ [2]`。在传统的仿真驱动电路综合器中，由前代生成的数据往往被忽略，导致优化过程效率低下。相比之下，人工神经网络（`ANNs`）在优化循环中的力量利用前代的数据来训练\
  \ `NNs`，通过建立一种捕捉电路配置与性能指标之间底层关系的价值机制 [3]`。一旦训练完成，这些 `NNs` 将作为仿真器的有效替代模型，能够对新候选方案的性能参数进行快速估计。这种从基于仿真的评估到基于\
  \ `NN` 预测的范式转变显著缩短了执行时间，大大提高了电路综合过程的效率 [4,5]`。\n\n在过去的十年中，研究重点在于应用优化技术来改进人工智能（`AI`）。Abdolrasol\
  \ 等人 [6]` 使用了通过多种算法优化的 `ANNs`，包括遗传算法（`GAs`）、粒子群优化（`PSO`）方法、人工蜂算法（`ABC`）方法和回溯搜索算法（`BSA`）方法，以及闪电搜索优化（`LSA`）和鲸群优化（`WOA`）等先进技术。通过优化算法的\
  \ `ANNs` 用于调整参数以获得最优结构。结果表明，上述算法在解决系统能量管理方面提高了 `ANN` 的性能。Devi 等人 [7]` 使用元启发式和 `ANN`\
  \ 方法优化了癫痫诊断前放大器中自偏置放大器的参数，目标是最小前放大器面积。`ANN` 方法优于其他方法（包括高效的鲸群优化技术），实现了缩小 50% 的前放大器面积。这种优化对于开发紧凑、可穿戴或植入式神经诊断设备至关重要，并在\
  \ `Cadence 180 nm Semi-Conductor Laboratory (SCL)` 环境中进行了测试。Wang 等人 [8]` 引入结合基于\
  \ `GA` 的全局优化引擎和基于 `ANN` 的局部优化引擎的新型模拟电路优化方法，通过并行计算进行 `SPICE` 仿真的全局优化和通过 `ANN` 模型预测进行局部最小值搜索，显著加速了自动模拟电路尺寸调整，该系统实现了优化速度四倍增长。它成功设计了运算放大器和切比夫滤波器等复杂的模拟电路。在类似的研究中，Rosa\
  \ 等人 [9]` 使用基于 `ANN` 的方法进行 IC 的自动尺寸调整和布局，利用深度学习从优化设计中学习。该方法具有两种用于从规格直接映射到器件尺寸的 `ANN`\
  \ 架构，并包括拓扑选择。而 Chakraborty 等人 [10]` 讨论了多层前馈 `NNs` 在优化 CMOS 模拟电路中的应用，我们强调 `NN` 模型取代经验和数值方法的能力，以增强准确性和计算效率。Harsha\
  \ 等人 [11]` 提出了一种用于优化两级运放器设计的 `ANN` 模型，解决了模拟设计中多维权衡的挑战。该模型通过 `SPICE` 仿真验证，证明了 `ANNs`\
  \ 快速准确地实现设计优化的潜力。Budak 等人 [12]` 了一种了一种基于机器学习的模拟电路尺寸调整全局优化方法，名为 `ESSAB`。该方法在面对严格的设计规格时，通过设计排名和\
  \ `ANN` 模型构建的创新，解决了预测误差和高 `ML` 成本挑战。\n\n## 1.2 高摆自偏置折叠共源极 (HSSFC) 放大器的优化\n\n\n\n\
  \n\n图 1.1 展示了 HSSFC 放大器，它是传统折叠共栅极放大器的改进变体，结合了基于源极退化的电流源 `M[3]`–`M[4,]` 而非传统电流。这导致了输入噪声的增强。通过使用电流缩放电阻\
  \ `R[1]` 和 `R[2]` 实现了这一点，减少了流过 `M[7]`–`M[10]` 折叠区域的电流，该区域只有差分对 `M[1]`–`M[2]` 的部分电流通过。器件尺寸、电阻值和其他设计参数的选择确保了高整体跨导度，从而降低了噪声。此外，为了增大摆幅，引入了额外的晶体管\
  \ `M[13]`，如图 1.1 所示 [13]。在 HSSFC 中，混合鲸鱼群优化算法 (HWPSO) 和其他生物启发算法针对低频/生物医学应用进行了定制，并经过优化以在满足特定约束的同时最小化电路面积，如表\
