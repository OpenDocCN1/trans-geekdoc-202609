  # 4 高功率放大器的创新设计与优化：与 GaN HEMT 和 CMOS 技术的对比研究\n\nManju Yadav, Ramji Gupta, Abhishek\
  \ Narayan, and Alpana Pandey DOI: 10.1201/9781003483\n\n## 4.1 引言\n\n功率放大器（PAPA）是一种用于增强电信号强度或幅值的电子器件。它是通信系统、音频系统以及许多其他应用的重要部分，在这些应用中，信号必须放大到更高的功率水平。\n\
  \n`PA` 的主要工作是接收低功率电信号并将其提升到可以驱动负载（如电机、扬声器或天线）的水平。它在接收微小输入信号并产生更大更强输出信号的同时，保持原始信号的真实性和质量。根据所使用的放大技术，PA\
  \ 分为不同的类型。常见类型包括：\n\n1. **晶体管放大器**：由于性能优异、尺寸小且效率高，基于晶体管的放大器被广泛应用。它们进一步分为场效应晶体管（FET`）放大器和双极结晶体管（BJT`）放大器。\n\
  2. **真空管放大器**：由于其独特的音质，包括三极、四极和五极在内的真空管是早期放大器的常见组件，并且仍受到某些发烧友的青睐。\n3. **运算放大器（Op-Amps）**是专门用于增加信号增益和精度的集成电路。尽管它们的主要用途是低功率应用，但它们可以与功率级耦合形成\
  \ PA。\n4. **D 类放大器**：为了获得高效率，D 类放大器采用了脉冲宽度调制（PWM`）技术。它们经常用于音频系统，特别是与便携式扬声器和低音器单元配合。\n\
  \nPA 的设计因素包括调节散热、选择合适的放大技术、确定必要的功率输出、确保稳定性以及防止过载和短路。\n\n在许多电子系统中，PA 对于提供清晰澈的音频、可靠的无线连接和有效的功率传输至关重要。随着技术的发展，其设计原理和性能特性不断变化，改进了各种应用的功率传输和放大性能。\n\
  \n综述的第一节涵盖了 PA 的基本功能和特征，强调了重要变量，包括`o/p`（输出）功率、增益和效率。此外，本章研究了用于 PA 开发的不同方法，包括 GaN\
  \ HEMT 和 CMOS 技术。第二节讨论了 PA 的相关工作。此外，针对无线通信应用，对 GaN HEMT 和 CMOS 技术进行了对比分析，重点关注功率放大器的基础并评估这些技术的性能差异。最后一节讨论了结论。\n\
  \n## 4.2 相关工作\n\nTuffy 和 Neal 开发了一种用于宽带工作的分布式频率合成算法，在 51%的带宽内实现了 70%以上的效率。该算法使用数字失真进行了线性化。使用\
  \ 2 毫米 GaN-Si 芯片，Tuffy、Neal 和 Lyndon Patterson 创建了一种小型混合 PA，其为 J 类，工作频率范围为 1–2.1\
  \ GHz。该 PA 的功率输出为 13–18 W，效率在 60%到 69%之间。\n\nChen、Peng、Merrick 和 Brazil 的工作对比了基于电磁和基于电路的束形操作（BO），用于创建\
  \ 10 W 和 30 W 的 PA，输出功率为 39.8 dBm。基于电路的 BO 实现了超过 60%的效率，而基于电磁的 BO 则提供了 43.8 dBm\
  \ 的输出功率和 57%的效率。\n\nPang 和 Jingzhou 讨论了多频/多模式设备所需的宽带和多频 PA 设计技术，使用 GaN HEMT `CGH40010F`作为有源器件并进行负载抽取仿真以寻找最优阻抗。\n\
  \n\n\n\nDong, Yitian, Yi Huang 和 Ling Qiu 提出了发射协方矩阵和主动天线集的联合优化，以最大化非理想 PA 的多用户多输入多输出（MU–MIMO）系统的能量效率\
  \ [17]。Chen 和 Peng 提出了一种用于宽带差分功率分析（DPA）设计的多目标贝叶斯优化方法，利用 EM 仿真获得更准确的性能，并最小化了所需与仿真阻抗轨迹之间的误差\
  \ [8]。You, Fei 和 Johannes Benedikt [12] 提出了一种使用优化负载阻抗计算、I–V 曲线挖掘、直接阻抗计算、波形调节和谐波平衡仿真来设计宽带\
  \ PA，以获得精确的 `Zopt` 解决方案。该技术实现了简单、紧凑的多频匹配网络，且不会影响网络架构或频段。利用这种方法设计了一种三频放大器，实现了最大的功率增加效率和输出功率\
  \ [18]。Kouhalvandi, Lida, Osman Ceylan 和 Serdar Ozoguz 讨论了创建优化高功率放大器（PA）的自动化过程和方法。作者还注意到，自动化\
  \ RF 电路设计工具在人员中越来越流行，并为模拟和射频（RF）系统提供了高效解决方案 [19]。\n\nLi 和 Chuan 了一种增强型 `SA-PSO`\
  \ 方法来自动化设计高效 PA。初始值的选择对于电子设计自动化（EDA）至关重要，由于 PA 具有非线性特征且参数众多，大多数初始值最终会陷入局部优化，导致谐波平衡（HB）仿真收敛缓慢\
  \ [20]。对于宽带通信中的 PA 线性，Le 和 Duc Han 提出了一种利用减参数经验模型（RPEM）的自适应迭代学习算法（ILA），其性能优于最小均方法（LMS）或递归最小二乘法（RLS），并成功补偿了各种情况下的非线性失真\
  \ [21]。Zhang, Yumeng 和 Bruno Clerck 建议通道自适应波形设计，在考虑能量采集器和高 PA 非线性的情况下最大化发射器输入。他们通过重构\
  \ PA 结构并应用 `Barrier` 方法实现了这一点 [22]。\n\nZhang, Lei, Kaixue Ma 和 Haipeng Fu 利用 `55-nm\
  \ CMOS` 提供用于高功率的 `60-GHz PA`。他们在 `57 GHz` 到 `62 GHz` 频率范围内获得了良好的平坦度 [23]。Guixiang\
  \ Jin 讨论了功率放大器输出变压器的设计与实现，特别关注其减少谐波失真和提高变压器整体效率滤波能力 [24]。为了最大化偏压，Rawat 和 Arvind\
  \ Singh 建议用于 LoRa 应用的 `91–23 MHz CMOS PA` [25]。\n\n## 4.3 功率放大器基础\n\nPA 是放大电信号功率的电子器件\
  \ [26]，在音频、无线通信 [27] 和 RF 发送器至关重要。如今，PA 设计采用了针对不同应用的优化技术，如贝叶斯优化、优化负载阻抗计算、粒子群优化、用于无线功率传输的波形优化以及级联结构优化\
  \ [28，29]。从根本上说，PA 具有以下特性：\n\n1. **功率输出：** PA 的功率输出是输出功率 [30]。输出功率对于功率功率至关重要：\n\
  ```\nPout = I²\n```\n以瓦特（W）或分贝（dB）为参考功率 [31]。工作电压和负载阻抗影响 PA 的特性 [32]。工作频率和热考虑决定了功率输出\
  \ [33]。在理想条件下功率输出是最大功率 [34]。电源限制了实际功率输出 [35]。\n\n2. **增益：** PA 通过放大信号来增加功率水平 [36]。增益是输出与输入功率之间的比例，由放大器规格决定\
  \ [37]。它是固定的或可调的，有两种表示方式：\n\n    - **电压增益：** 输出电压与输入电压的比值，通常表示：\n```\nAV = VOUT\
  \ / VIN\n```\n\n    - **功率增益 (Ap)：** 输出与输入的关系：\n```\nAP = 10 * log10(POOUT / PIN)\n\
  ```\n\n3. **效率：** 效率是从输入功率接收到的输出功率 [39]。效率由公式 (4.4) 表示：\n```\nEff(η) = (Output power\
  \ / Input power) * 100%\n```\n通常以百分比表示。\n\n**功率增加效率 (PAE)**\n\n功率增加效率（PAE）基本上是将直流输入功率转换为\
  \ RF 输出功率 [40，41]。PAE 公式由方程 (4.5) 给出：\n\n```\nPAE = ((RF output power - RF input\
  \ power) / DC input power) * 100%\n```\n\n### 4.3.1 S 参数\n\nS 参数是散射参数，描述 PA 有用 [42]。它们描述了阻抗、增益、带宽和稳定性。\n\
  \nS11（或 S22）：在 PA 中，S11 描述阻抗不匹配而在输入端口或输出端口反射的功率。S22 描述稳定性因子，称为罗特稳定性因子；小于 1 表示稳定\
  \ [43]。S21（或 S12）：S21 的值越大，表示功率放大越多，而反向增益由 S12 表示。\n\n这就是为什么 PA 的 S 参数对于 PA 设计预测、参数分析、输入输出阻抗匹配、稳定性以及精确频率性能预测至关重要\
  \ [44，45]。\n\n## 4.4 关于功率放大器未来方面与挑战的讨论\n\n\n\n\n在设计功率器（PA）时，我们使用了晶体管和不同的 CMOS（互补金属氧化半导体）为不同的应用提供高增益和高效率\
  \ [46,47]。本节讨论了设计功率器的一些通用技术。\n\n### 4.4.1 不同技术的功率器电路设计及参数图详细说明\n\n#### 4.4.1.1 使用\
  \ GaN HEMT 的功率器\n\n氮化镓（GaN）高电子迁移率晶体（HEMT）技术提供了一种宽带隙半导体，具有特殊的功率处理能力和高击穿电压 [48]。通过将\
  \ GaN HEMT [49] 功率器与硅基金属氧化半导体场效应晶体管（MOSFETs）或砷化镓基的 HEMTs 等保守技术进行比较，GaN HEMT 功率器在高频工作中具有高效率、低功耗和高增益的优势\
  \ [50,51]。\n\n图 4.1 显示了功率器的框图，其中第一个框包含带有电感和电容元件的输入匹配网络。第二个框表示所使用的技术，如 MOSFET、晶体管和\
  \ GaN HEMT，第三个框显示包含电容和电感元件的输出匹配网络。该框图表示输入功率如何通过具有适当元件值 `L`、`C`、`R`、`V[gs]` 和 `V[ds]`\
  \ 的输入/输出匹配网络放大输入信号。\n\n![FIGURE 4.1 功率器框图。](img/Fig04_01.jpg)\n\n图 4.1 功率器框图。\n\n\
  图 4.2 代表了 GaN HEMT 功率器电路，该电路在 LT Spice 软件上实现，并使用了合适的 `L`、`R`、`C`、`V[ds]` 和 `V[gs]`\
  \ 值。\n\n![FIGURE 4.2 GaN HEMT 功率器电路设计 [19].](images/Fig04_02.jpg)\n\n图 4.2 GaN HEMT\
  \ 功率器电路设计 [19]。\n\n在此仿真中，使用了 GaN HEMT EPC 2007 模型进行验证。\n\n图 4.3 代表了 GaN HEMT 功率器的输出功率，显示了在\
  \ 1.7–2.5 GHz 频率范围内输出功率的变化。输出功率从 1.5 GHz 开始增加，并在 2.12 GHz 达到最大值 49 dB。由于 `S11` 参数（回波损），输出功率在\
