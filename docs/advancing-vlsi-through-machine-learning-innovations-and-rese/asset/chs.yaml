  \ 测量：当 GaN 进行外延生长时，缺陷最可能是不同 GaN 外延层与衬底之间的晶格失配参数和应变引起系数引起的。这些缺陷可能会向 AlGaN 层扩展 [67]。为了分析这些缺陷的起源，使用了\
  \ DLTS 技术。采用具有脉宽的恒定栅极电压测量漏电流和 `v[ds]` [68]。电流-DLTS 测量基于通道温度变化的瞬态漏电流响应。通过这种技术可以精确获得陷阱活化能和截面信息。电流-DLTS\
