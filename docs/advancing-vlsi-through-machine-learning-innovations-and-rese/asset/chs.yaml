  \ P. (2022). 使用机器学习的硬件漏洞分析综述。IEEE Access, *10*, 49508–49527.\n\n\n\n\n从历史上看，计算机是由大型真空管驱动的。当时，它们拥有最快速的称号，但\
  \ 1948 年贝尔实验室半导体晶体管的出现为整个计算系统开启了新时代。这使得设备变得更小、更廉价且更高效。在 20 世纪 60 年代，我们采用了一种称为小规模集成（`SSI`）的方法，它利用大约十个晶体管，采用低密度集成方法。在\
  \ 20 世纪 60 年代后期，我们在单个芯片上实现了约 100 个晶体管的集成，这种技术进步被称为中规模集成（`MSI`）。在 20 世纪 70 年代初，在晶体管晶逻辑（`TTL`）的帮助下，这种集成进一步增加，为更高密度集成提供了空间。在\
  \ 20 世纪 80 年代后期，晶体管的集成突破了单个芯片 1000 个的关关，被称为 `VLSI`。由于功耗以及单个芯片上对更多逻辑门的需求，金属氧化半导体（`MOS`）逐渐取代了\
  \ `TTL`。这些集成评估遵循摩尔定律，该定律预测单个芯片上的晶体管数量将指数级增长，并在近两年内翻倍。在过去的五十年里，该行业一直遵循如此[1,2]。缩小晶体管尺寸实现了这一现象。随着晶体管尺寸的缩小，芯片上的晶体管密度增加，晶体管性能得到提高[3]。面对便携设备的需求，这一过程将帮助半导体行业的发展。缩\
  \ SI 电路可以实现便携性所需的小尺寸和高效功耗。这种持续的缩放增长正将我们的半导体行业推向新高度。设备尺寸正在缩小到亚 3 纳米栅极范围内，甚至更小。目前，互补金属氧化半导体（`CMOS`）技术是微电子领域主导且革命性的技术。随着\
  \ `CMOS` 技术的缩小，它会导致短道效应（`SCEs`），包括漏极诱导势垒降低（`DIBL`）、漏电、增益下降、沟道长度调制以及阈电压滚降[4,5]。结果是随着微型化的增加，器件特性对各种参数的依赖性增加，制造过程中工艺变化的敏感性也之增加，最终影响芯片良率[6]。因此，我们必须在\
  \ `VLSI` 设计过程中使用先进且负担得起的设计技术，以维持半导体行业的未来增长。`VLSI` 计算机辅助设计（`CAD`）工具在芯片设计过程的多个阶段发挥着至关重要的作用。现代芯片设计和性能评估取决于这些\
  \ `CAD` 工具的能力。半导体芯片的交付时间很大程度上取决于电子设计自动化（`EDA`）工具克服上述限制的有效性。传统的 `EDA` 基于规则驱动的方法，当\
  \ `IC` 的复杂性增加时，会导致工艺变化和环境变量。结果是时间延迟[7]。随着芯片上晶体管数量的增加，需要 `CAD` 工具的进步。许多研究表明，我们可以使用基于人工网络的解决方案来\
  \ `EDA` 过程以实现快速收敛，从而提供更的时间消耗和高效率[8]。为了给这些限制提供解决方案，许多研究人员转向人工智能（`AI`）。`AI` 镜像人类智能并可以执行复杂任务。`AI`\
  \ 包含了机器学习（`ML`），它可以轻松识别海量数据集中的趋势和模式，并预测所需输入的的输出。该领域近期经历了显著扩张，主要归功于其韧性和广泛的应用范围。最近，`ML`\
  \ 已在数学、物理、化学、计算机视觉、医学和图像处理等多个学科中得到了广泛应用[9, 10, 11, 12]。这些 `ML` 方法以高计算速率运行，能够处理异构多元数据。由于这些优势，研究人员正将\
  \ `AI` 和 `ML` 整合到 `VLSI` 设计流中的各种设计过程中。本章总结了在 VLSI 领域的各种研究。\n\n## 11.2 VLSI 设计流程\n\
  \n典型的集成电路（`IC`）设计过程由多个层组成，如图 11.1 所示。这涵盖了后端和前端阶段。设计规范提供了功能、接口和架构。设计规范还作为客户与制造商之间的正式约。行为设计级（也称为功能级）通常使用\
  \ `Verilog`/`VHDL` 描述。功能以通用方式描述，而其具体的实现细节是隐藏的。高层次综合（`HLS`）工具可以将用 `C` 或 `C++` 编写的系统规范转换为硬件语言（`HDL`）或创建门级解释。测试平台用于验证逻辑，而可测试性设计（`DFT`）用于形式验证和扫描插入。这些方法被用于寄存器传输级（`RTL`）映射[13]。系统划分过程用于将大型复杂系统分解为更小的模块。随后是平面布局、布局和布线。平面规划器负责实现标准单元/模块设计所需的\
  \ `IC` 空间并优化设计性能。布局和布线工具负责子模块、门和触发器的定位。验证布局对于确保设计与原理图一致并符合电气和物理设计至关重要。一旦完成布局仿真，芯片将进入验收阶段，在此寄生电阻和电容被提取并验证[14]。`ICs`\
  \ 的制造包含了复杂的化学和物理工艺，包括光刻，它涵盖了特定位置掩模和材料的创建、验证和勾勒。由于工艺的变化和节点的缩小，重复此步骤至关重要。一旦芯片制造，我们将晶圆划分为更小的部分，分离芯片，封装每个芯片并进行彻底测试，以确保它们正常工作并符合指定的设计标准[15,16]。\n\
  \n## 11.3 人工智能/机器学习\n\n\n\n\n统计学习是许多科学技术领域中的一种重要工具，因为它能够通过研究海量数据对未来进行预测。人工智能（AI）是一种模拟人类行为的技术，它是机器学习（ML）和深度学习的子集，如图图\
  \ 11.2 所示。我们可以将机器学习分为三类：监督学习、无监督学习和强化学习。监督学习为给定数据中的所有元素分配输出标签，而无监督学习仅使用输入变量，半监督学习则使用部分为已标记示例、另一部分为未标记示例的数据\
  \ [17]。\n\n![FIGURE 11.2 人工智能技术概述。](img/Fig11_02.jpg)\n\nFIGURE 11.2 人工智能技术概述。\n\
  \n### 11.3.1 监督学习\n\n监督学习是一种机器学习技术，涉及使用标记信息学习算法模式。它包含在一组每个输入都对应相应输出的数据集上训练模型。在整个训练过程中，模型优化其参数以减少预测值与实际标签之间的差异。这使得模型具有良好的泛化能力，并能对新的、未见的数据做出精确预测。监督学习可以分为两种主要形式：分类和回归。分类是一种监督学习任务，算法将输入数据分配到预定义的类别或类中。模型从标记示例中学习，并对以前未观察过的数据提供预测。这些模型被称为分类器，提供关于离散类别标签的预测。回归是一种监督学习任务，通过分析因变量与一个或多个自变量之间的关系来预测连续的数值值。我们使用这种基础统计技术来预测和理解数据趋势\
  \ [18,19]。这些过程可以转化为一种学习函数，旨在预测 `Y`  = `f`(`X`)` 的映射，其中 `Y` 代表给定一组输入变量 `X` 的输出变量集。我们计算映射函数以为给定的新输入变量\
  \ `X` 预测相应的类别标签 `Y`，如图图 11.3 所示。\n\n![FIGURE 11.3 分类/回归算法的学习函数。](img/Fig11_03.jpg)\n\
  \nFIGURE 11.3 分类/回归算法的学习函数。\n\n回归和分类的一些常用方法包括决策树（DTs）、梯度提升机（GBMs）、随机森林（RFs）、支持向量机（SVMs）和集成学习\
  \ [20]。\n\n### 11.3.2 无监督学习\n\n无监督学习是机器学习的一种类型，模型使用没有标记响应的输入数据进行训练。算法自主分析数据以揭示模式或结构，而无需关于要搜索什么的任何明确指令。相反，它的目标是识别数据内部的联系或分组，通常使用聚类、降维或密度估计等方法。无监督学习对于标记数据有限的问题特别有益，因为它能够发现底层结构\
  \ [21]。无监督学习中使用的一些常用方法包括聚类、降维和异常检测。关联学习识别关系，而异常检测标记离群值。密度估计估计分布。常见算法包括 K-近邻、Apriori、隔离森林、K-means、主成分分析\
  \ [22]。\n\n### 11.3.3 强化学习\n\n强化学习是机器学习的一个分支，专注于寻找在不同场景下采取最佳行动以获得最大奖励。它的重点在于通过经验和交互进行学习\
  \ [23]。\n\n### 11.3.4 深度学习\n\n深度学习是机器学习的一种，采用具有许多层的人工神经网络来发现海量数据集中的复杂模式。这些神经网络根据大脑的结构和功能设计，能够自动学习数据的表示\
  \ [24]。多层感知器（MLPs）是深度学习系统的重要部分。它包含一个输入层、一个或多个隐藏层和一个输出层。如图图 11.4 所示，我们称为密集连接网络，因为一层中的每个神经元都连接到下面一层中的每个神经元。各种深度学习模型包括浅层神经网络、深度强化学习、生成对抗网络、循环神经网络和深度神经网络。\n\
  \n![FIGURE 11.4 深度学习模型流程概述。](img/Fig11_04.jpg)\n\nFIGURE 11.4 深度学习模型流程概述。\n\n##\
  \ 11.4 AI/ML 在电路仿真层面的应用\n\n仿真在 IC 建模中至关重要，因为由于工艺和环境变量，在纳米尺度范围内性能评估非常困难 [25,26]。为了获得合适的特性，需要仔细检查器件。尽早检测功能和性能的变化可以提高\
  \ IC 良率。AI 和 ML 算法可以提供帮助，缩短周期并提高性能，从而减少设计工作。许多研究人员提出了定义器件表征参数的替代方法 [27]。研究人员提出了许多学习算法，可以在多个抽象层级对器件进行表征，包括器件级和门级。许多研究人员在仿真的不同阶段开展工作，包括器件级、门级、电路级、RTL\
  \ 和布局后仿真级。许多研究人员正在开发 ML/AI 模型，用小规模仿真结果预测器件性能。图 11.5 显示了 ML 和 AI 在器件级仿真过程中应用的基本构建模块。\n\
  \n![FIGURE 11.5 基于 ML/AI 的器件仿真流程。](img/Fig11_05.jpg)\n\nFIGURE 11.5 基于 ML/AI 的器件仿真流程。\n\
  \n\n\n\n2019 年，Carrillo 等人开发了一种用于 TCAD 器件建模的神经网络（NN）模型，利用了来自无结纳米线晶体管的 1380 个训练数据点。该模型证明，ML\
  \ 技术可以将仿真工作时间从 5520 分钟缩短至 2 分钟 \\[28]。2021 年，Yoon 团队使用 TCAD 和 ML 最大化了垂直纳米线场效应晶体管的效率和效果。全连接多层感知器神经网络准确预测了输入参数，最大限度地减少了\
  \ RC 延迟[29]。2022 年，Akbar 团队使用 ML 模型为线型 TFET 的复杂器件仿真找到了高效的解决方案。该模型的 `R²` 分数大于 99%，误差率低于\
  \ 1%，降低了近 99% 的计算成本[30]。Stillmaker 等人 \\[31\\]提供了一个数据集和一种方法，用于建模跨越 180 纳米到 7 纳米技术节点的晶体管性能。2019\
  \ 年，Amuru 同事 \\[32\\]提出了一种用于估计亚纳米级器件静态漏电功率和总功耗的回归模型。他们建议使用多元线性回归（`MLR`）和多元项式回归（`MPR`），他们的模型不准确率小于\
  \ 1%。Khang 等人（2015 年）展示了一种基于 ML 的方法，可以预测由信号干扰（SI）引起的增量延迟和路径延迟，该方法在这两个方面的最坏误差分别为\
  \ 5.2 ps 和 8.2 ps \\[33]。该论文 \\[34\\]提出了一种使用随机森林的 CMOS VLSI 电路精确功率估计方法，其性能优于神经网络。结果显示其与\
  \ ISCAS’89 基准电路具有强相关性。该论文 \\[35\\]引入了一种基于 ResNet 的数字电路优化框架，既快速又高效。该框架专注于最小化漏电和延迟。对\
  \ 22 纳米金属栅极高 K 数字单元的研究结果表明，采用遗传算法时延迟显著减少了 36.7%，漏电减少了 18.8%。\n\n## 11.5 AI/ML 在架构层面的应用\n\
  \n现代时代对高处理速度、可靠系统以及减少开发成本和时间的需求，激发了大多数架构改进。AI 和 ML 通过实现高层综合综合（HLS）和对架构方案的快速探索，显著增强了架构级\
  \ VLSI 设计。AI 模型通过预测与性能、功耗和面积相关的参数，帮助设计人员快速评估各种设计方案。ML 技术通过优化高层代码（如 C/C++）到硬件描述语言（HDLs）的翻译，提高了在性能、面积和功率效率方面的输出质量。架构师可以通过使用\
  \ AI 和 ML 做出更有根据的判断，减少设计迭代并加速整个过程，从而创建更有效高效的 VLSI 设计。Gupta 及其团队在 2019 年提出的神经网络存内计算（`NNPIM`）加速了神经网络的推理阶段\
  \ \\[36]。为了让神经网络的推理阶段运行得更快，他们使用了基于交叉杆存储器的架构和权重共享来降低神经网络所需的计算量。他们实现了比传统神经网络高 131.5\
  \ 倍的能效和快 48.2 倍的速度。Yang 等人 \\[37]\\]基于静态随机访问存储器（`SRAM`）的存内架构检查了冯·诺依曼架构中数据传输的能量消耗。该架构从关注计算转向关注数据，产生了一种完全消除冯·诺依曼架构计算瓶颈的高能效设计。他们解决了\
  \ `SRAM` 中的读写稳定性问题。研究表明，由 96000 个 `SRAM` 阵组成的存内计算架构成功解决了 6T SRAM 的读写稳定性问题。\n\n在\
  \ VLSI 架构设计中，脉动阵列使用处理单元（`PEs`）网格来并行和流水线处理数据，从而尽可能地加速计算。这种设计使得矩阵乘法和神经网络操作等任务变得更快。它还减少了发送数据时所需的额外工作，并使半导体器件更具扩展性和能效性。2019\
  \ 年，Asgari 团队 \\[38\\]证明脉动阵列解决方案可以加速 DNN 推理，对于稠密线性代数非常有价值。然而，在训练期间或之后实施稀疏化机制会产生稀疏性问题。为了避免这个问题，他们提出了一种结构化剪枝的\
  \ Eridanus 方法，用于生成以内存恒定数据流运行的 `DNNs`。2020 年，Parmar 等人 \\[39\\]为 `CNNs` 中的卷积引入了一种硬件高效且非乘法器的方法。此外，与他们的时间结构相比，他们提出了一种具有可重构脉动环形架构的新型数据流模型，该模型将资源效率提高了\
  \ 55%，并降低了相同比例的功耗。2024 年，Inayat 等人 \\[40]\\]提出了两种使用因子分解和 8 进制乘法器的新型脉动阵列。第一个模型通过增加寄存器数量减少了延迟和面积，但这被\
  \ 8 进制偏移流水线中较低的寄存器需求所平衡。该模型在延迟、面积和功耗方面分别提升了 15%、13% 和 23%。\n\n\n\n\n2021 年，A. Mirhoseini\
  \ 等人展示了一种用于芯片平面布局的深度强化学习模型，并开发了一种基于边缘的图卷积神经网络架构，该架构能够学习丰富且可迁移的芯片表征。这种架构可以为现代加速器设计节省数百小时的时间。Google\
  \ 使用了这种方法来创建其实的处理器 [41]。2021 年，Xie 等人 [42] 利用约束求解器为 ML 模型建立了一种深度强化学习解决方案。这种方法分别将随机搜索和模拟退火算法提高了\
  \ 6.11% 和 5.85%，同时将搜索时间从 3 小时缩短至 99 分钟。Tsung-Wei Huang [43] 专注于通过布局和时序分析优化电子设计自动化中的\
  \ GPU 加速。为了实现这一目标，他利用 ML 实现了一种新型的异构并行 EDA 解决方案。他在 GPU 加速路径时序分析中达到了快 500 倍的速度。2021\
  \ 年，Huang 等人 [44] 借助 ML 模型解决了物理设计中的全局布线拥塞问题。该模型生成布线违规预测并将其返回给系统，从而创建出改进后的布局。\n\n\
  2022 年，Yeh 等人 [45] 采用监督 ML 技术来应对高密度封装中衬底信号布线相关的挑战。研究人员引入了一种创新的重新布线框架，可以预测低效布线，并在线数和线长度方面分别实现了\
  \ 36.5% 和 1.6% 的性能提升。\n\n## 11.7 AI/ML 在制造和可靠性层的应用\n\nAI 和 ML 正在通过改进工艺控制、缺陷预测和可靠性分析改变\
  \ VLSI 生产。AI 实时改进工艺参数，提高良率并消除半导体制造中的故障。ML 方法根据历史数据预测潜在故障，允许采取主动纠正措施并减少生产损失。此外，AI\
  \ 驱动的可靠性分析使用压力测试数据来估计设备的长期性能，从而产生稳健可靠的设备。这些应用简化了制造流程，降低了成本，并提高了 VLSI 设备的整体质量和良率，促进了半导体行业的效率和创新。Mansi\
  \ Phute 及其团队 [46] 强调了光刻在 VLSI 制造中的重要性。此外，他们研究了利用不同的 ML 模型（包括人工神经网络 `ANNs`、卷积神经网络\
  \ `CNNs` 和 `SVMs`）来识别热点。作者说明了不数据集导致假阴性结果的可能性，并建议使用高斯过程保证来解决这个问题。2021 年，Meng 团队 [47]\
  \ 为刻蚀偏置应用提出了创新的 ML 模型以及为这些模型提供了一种独特的数据结构。此外，他们还提出了一种基于边缘位置误差的新理论。Ying Chen 及其同事\
  \ [48] 解决了热点检测 ML 应用中获取大数据集的问题。作者提供了一种以半监督方式使用自步多任务学习方法检测热点的方法。与传统的 ML 方法相比，他们实现了\
  \ 4.6%–6.5% 的更高准确率，同时保持相同的误报水平。即使仅使用 10%–50% 的训练数据时，这种改进依然明显。\n\nAI 和 ML 通过优化测试模式开发、故障诊断和良率预测改进了\
  \ VLSI 设计的测试过程。ML 算法产生优化的测试模式，以增强故障覆盖并最大限度地缩短测试时间，从而确保在资源利用很少的情况下进行彻底测试。AI 驱动的故障诊断可以快速检测并定位缺陷，从而缩短了故障排除和修复所需的时间。此外，ML\
  \ 算法通过分析测试数据和历史模式预测制造良率并检测可能的问题点。这些发展提高了测试精度，降低了与测试相关的费用，并提高了 VLSI 设备的整体可靠性和卓越性。Soham\
  \ Roy 及其同事 [49] 展示了一种使用 ML 自动生成测试模式的系统。他们将无监督 ML 模型与专注于路径的决策系统相结合。这种方法减少了对回溯的需求，并显著减少了所需的中央处理器\
  \ `CPU` 时间。2021 年，Liu 和 Ou [50] 开发了一种利用 ML 提高系统级测试效率、缩短测试时间并管理每百万缺陷组件数量的方法。他们使用\
  \ `SVM` 和自动编码器估计了系统级测试程序中芯片故障的伪概率。他们证明该方法能够降低 40% 的系统级测试成本。\n\n## 11.8 结论\n\n本章展示了\
  \ AI 和 ML 在 VLSI 逻辑和物理规划多个领域的应用，包括电路仿真、架构、物理设计、测试和生产。这些示例说明了 AI 和 ML 在 VLSI 设计初始阶段的广泛用途。系统级\
  \ AI/ML 辅助架构发现和 `HLS`。这些技术有助于优化 `RTL` 设计的代码并检测 Bug，从而提高代码质量并减少了对验证的需求。AI/ML 增强了验证期间的测试生成、形式验证和仿真过程，确保了全面且高效验证。逻辑综合中的\
  \ AI 优化了综合参数并辅助实现时序收敛，从而提高了设计质量。AI/ML 技术增强了物理设计阶段的组件布局布线、进行设计规则检查并优化布局以确保高效制造和高良率。`DFT`\
  \ 利用 AI 生成优化测试模式、识别缺陷并预测良率，从而确保可靠测试并实现高产量。将 AI 和 ML 集成到 VLSI 设计流程对于提高效率、缩短上市时间和提高半整体质量具有巨大潜力。我们预计\
  \ AI 和 ML 技术的持续将扩大其在 VLSI 设计中的应用，为该领域带来进一步变革。\n\n## References\n\n1. J-A. Carballo,\
