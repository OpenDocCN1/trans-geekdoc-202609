  \ Node 项目中的 JavaScript 库。`package.json` 文件无法使用 `NPM` 安装项目的所有依赖项。包也可以被更新和卸载。使用语义化方案，`package.json`\
  \ 文件中的每个依赖项都可以指定接受的版本范围，允许开发者自动更新包而无需担心发生无意的破坏性更改。名为 `Node.js`（`Node`）的开源开发平台用于在服务器端运行\
  \ JavaScript 脚本。`Node` 在创建浏览器和服务器之间需要持续连接的应用时很有帮助。聊天、新闻推送和 Web 推通知等实时应用是 `Node`\
  \ 的常见用途。`Node.js` 设计为一次使用单线程单进程并运行在专用的 HTTP 服务器上。使用 `Node.js` 构建的应用是异步且基于事件的。\n\n\
