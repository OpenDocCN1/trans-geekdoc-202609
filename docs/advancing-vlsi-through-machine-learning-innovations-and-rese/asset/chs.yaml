  \n# 12 基于 FinFET 的用于 AI 应用的 9T SRAM\n\nYagnad Sarangi, Kartik Singh, Shelja Kaushal\n\
  \n## 12.1 引言\n\n在当今世界，对高效芯片设计的需求日益增长，因此需要低功耗且响应快速电路。在大规模集成电路（VLSI）领域，对晶体管的需求不断增加。长期以来，CMOS（互补金属氧化物晶体管）在开发电子设备和实现目标方面做出了巨大贡献。但考虑到现状，对高性能、低功耗和低延迟的需求非常迫切。CMOS\
  \ 在电流泄漏、功耗增加和严重的短沟效应（SCEs）方面的缺陷变得日益明显。为了应对这些问题，半导体行业出现了一种革命性的替代方案：FinFET（鳍栅场效应晶体管）。\n\
  \n芯片设计的重要组件之一是 SRAM（静态随机访问存储器）阵列。作为 SRAM 阵列的重要组成部分，SRAM 单元是计算机系统中临时数据存储的基石。作为易失性内存，它需要持续供电以维持存储的数据。在\
  \ VLSI 设计中，SRAM 单元具有重要意义，通常被集成为中央处理器（CPU）的缓存和内部寄存器。SRAM 的简单性和快速性使其非常适合需要快速数据检索且不需要刷新循环的任务。此外，现代微处理器在昂贵的缓冲区和缓存中广泛采用\
  \ SRAM 单元，以增强其运行效率和整体性能。SRAM 单元在电源开启时，其锁存结构可以存储数据。\n\n\n\n\n# 引言\n\n新兴的 SRAM 电路标志着存储技术的重大飞跃，在多个关键方面超越了传统的\
  \ `6T` SRAM 设计。新兴 SRAM 电路整合了如 `8T`、`7T`、`9T`、`10T` 和 `11T` 等多种配置元素，展现了可靠性、效率和性能的完美融合，使其成为未来存储架构格局中的关键组成部分。此外，这些创新电路在低功耗运行时表现出卓越的稳定性，使其特别适用于高能效应用，如物联网（IoT）设备和移动电子产品。在这些架构中，`8T`\
  \ 和 `10T` SRAM 配置贡献了独特的属性：前者擅长在面积效率和稳定性之间取得平衡，后者则增强了稳健性和性能，尽管是以增加面积开销为代价的。此外，`7T`\
  \ 和 `11T` SRAM 设计提供了专门的解决方案，前者优先考虑低功耗运行，后者强调在严苛环境下的增强可靠性。但在众多新兴设计中，`9T` SRAM 配置因其对各种形式的噪声和干扰（包括工艺偏差和辐射引起的错误）具有更强的抗干扰能力脱颖而出。此外，`9T`\
  \ SRAM 在低功耗运行方面表现出色，是高能效应用的理想选择，而 `7T` 或 `11T` 设计可能无法有效解决这些问题。`9T` SRAM 在与其竞争的产品中脱首选，提供了面积效率、稳定性、可靠性和低功耗运行的优异组合，使其成为先进存储架构中的关键组件。\n\
  \n在本章中，我们提出了一种采用 `18 nm` FinFET 技术的 `9T` SRAM。为了进行电路设计和各种仿真，使用了 `Cadence Virtuoso`\
  \ 工具 `[3,4]`。本章的章节如下：第 12.2 节解释了 `9T` SRAM 的工作原理及其各种操作；第 12.3 节采用了基于 FinFET 的 `9T`\
  \ SRAM 优化以实现低功耗和提高稳定性；第 12.4 节展示了对比和环境变化分析，随后在 第 12.5 节中给出结论。\n\n## 12.2 基于 FinFET\
  \ 的 9T SRAM\n\n在本节中，将解释所提出的基于 FinFET 的 `9T` SRAM。由于 FinFET 技术的特性相比传统 CMOS 技术有了显著改进，特别是在增强稳定性方面，通过对电流流进行更好的控制，FinFET\
  \ 技术减少了 SRAM 单元中由漏电流或噪声导致的数据损坏风险。这种稳定性的提高对应于各种计算环境中更高的可靠性和数据完整性 `[4]`。基于 FinFET\
  \ 的 `9T` SRAM 单元包含九个晶体管，以最佳方式排列以确保稳定性、耐用性和性能，如图图 12.1 所示。该单元的核心由六个存储晶体管组成，包括两个访问晶体管和两个交叉反相器。读、写操作由访问晶体管控制，这些晶体管提供了对\
  \ SRAM 单元存储节点（位线）的访问。交叉反相器构成了单元的锁存机制，以稳定的方式存储数据。每个反相器都由一个 n 型金属氧化半导体（NMOS）和一个 p\
  \ 型金属氧化半导体（PMOS）晶体管组成，并形成反馈回路，以确保可靠的数据留存和快速访问时间。除了存储晶体管外，`9T` FinFET SRAM 单元还包含三个辅助晶体管，以提高其稳定性和可靠性。通路晶体管为操作交叉反相器的状态增加了额外路径，从而增强了单元的抗噪声能力和读取稳定性。辅助晶体管在提高读取裕量的同时，减少了工艺波动和外部噪声的影响。因此，基于\
  \ FinFET 的 `9T` SRAM 单元可以提供更高的能量效率，特别是在待机或空闲状态下，这有助于移动和电池供电设备的整体节功并并电池电池寿命。\n\n\
  ![图 12.1 9T SRAM 的结构。](img/Fig12_01.jpg)\n\n图 12.1 9T SRAM 的结构。\n\n### 12.2.1 SRAM\
  \ 的操作\n\nSRAM 电路在现代电子设备中起着至关重要的作用，提供了快速可靠的数据存储。理解 SRAM 单元的操作模式（如保持模式、写入和读取模式）对于理解其功能至关重要。\n\
  \n**保持操作（Hold Operation）：** 在保持操作期间，SRAM 单元处于空闲状态，数据保持在锁存器中而不发生任何更改，直到启动下一次读取或写入指令。为了在此阶段保持存储的数据，单元内的访问晶体管通过将字线线（`WL`）设置为低电平而被断开。\n\
  \n**写入操作（Write Operation）：** 在写入模式下，目标是修改存储在单元中的数据。该过程涉及将逻辑的值（逻辑 `0` 或逻辑 `1`）放置在位线\
  \ `BL` 和 `BL-bar` 上。通常，逻辑 `0` 存储在节点 `1`，逻辑 `1` 存储在节点 `2`。为了执行写入操作，激活 `WL` 将设置为高电压（`WL\
  \ = 1`），从而开启访问晶体管。随后，位线 `BL` 和 `BL-bar` 设置为要写入的数据，例如如果 `BL = 1` 和 `BL-bar = 0`，则\
  \ `PM1` 和 `NM4` 将开启，而 `NM1` 和 `PM3` 将强制关闭。因此，存储的数据被覆盖，节点 `1` 更新为 `1`，节点 `2` 更新为\
  \ `0`。\n\n**读取操作（Read Operation）：** 在读取模式下，SRAM 单元检索存储的数据供后续处理。假设逻辑 `0` 存储在节点 `1`，`M4`\
  \ 和 `M1` 开启，导致节点 `2` 充电到电源电压（`V[DD]`），而 `PM1` 和 `NM4` 保持关闭。通过激活 `WL` 连接位线与存储节点的访问晶体管，位线\
  \ `BL` 和 `BL-bar` 预充电到 `V[DD]`。这种预充电引发了电位差，导致电流流过 `NM2`。因此，`BL` 和 `BL-bar` 之间的感测电压差决定了存储的值，`BL-bar`\
  \ 上的高电压表示存储逻辑 `1`，而 `BL` 上的高电压表示存储逻辑 `0`。读取数据随后在位线上提供供后续处理，完成了 SRAM 单元的读取操作。\n\n\
  在所提出的基于 FinFET 的 `9T` SRAM 单元中执行这些操作的各种控制信号列在表 12.1 所示。\n\n表 12.1 所提 9T FinFET SRAM\
  \ 单元的控制信号\n\n| 信号 | 保持 | 读取 | 写入 0 | 写入 1 |\n| --- | --- | --- | --- | --- |\n|\
  \ WL | 0 | 1 | 1 | 1 |\n| BL | 0 | 1 | 1 | 0 |\n| BL-bar | 0 | 1 | 0 | 0 |\n| RL\
  \ | 0 | 1 | 0 | 0 |\n\nSRAM 单元的特征由几个关键参数定义，这些参数定义了它们的性能和可靠性。这些参数包括：\n\n\n\n\n\n\
  ### 静态噪声裕量\n静态噪声裕（`SNM`）指的是`FinFET 9T SRAM`单元在维持存储数据时抗噪声引起误差的稳定性或稳健性。`SNM` 是评估存储单元可靠性的关键指标。在\
  \ 9T SRAM 单元中，`SNM` 通过各种工作参数（包括电压电平和和晶体管特性）进行评估。它量化了在噪声存在时，单元从一个稳定状态转换到另一个状态（无论是从‘0’到‘1’还是反之）的电压差。较高的\
  \ `SNM` 值表示具有优异的抗噪能力，从而增强了 SRAM 单元的整体可靠性 [5,6]。\n\n### 访问时间\n读、写操作的访问时间是直接影响存储器整体性能的关键参数。读取访问时间是指从\
  \ SRAM 单元检索数据所需的时间。它涉及激活相应的 `WL` 并感应单元中存储的数据，通常通过检测位线上的电压差来实现。`SRAMs` 以快速的读取访问时间而闻名（通常以纳秒计），使其适用于需要快速检索数据的应用，例如处理器中的缓存内存。另一方面，写入访问时间是指修改或将数据存储到\
  \ SRAM 单元所需的时间。这一过程涉及在位线上的设置所需的数据值、激活 `WL` 并相应更新单元的内容。`SRAMs` 的写入访问时间与读取访问时间相当，但可能会根据单元配置和电路设计等因素而异。确保读、写访问时间的平衡，对于维持高效的内存操作以及在各种计算应用中实现最佳系统性能至关重要。\n\
  \n### 功耗\n电源稳定性对于 `SRAM` 设计至关重要，可确保可靠的运行和数据完整性。采用电压调节、电源门控和静态功耗管理等技术可以最大限度地减少电源波动，并降低动态和静态功耗。通过优先考虑电源稳定性，`SRAMs`\
  \ 在各种工作条件下都能提供一致的性能，使其成为广泛计算系统的核心组件。\n\n## 12.3 9T SRAM 的优化\n在数字电路设计领域，实现高效可靠的运行至关重要。追求这一目标的一个关键因素是优化晶体管尺寸，特别是在基于\
  \ `FinFET` 的 `SRAM` 中。`FinFET SRAM` 中的晶体管尺寸与每个手指的鳍（fins）数量紧密相关，直接影响 `SNM` 和功耗。本节对晶体管尺寸\
  \ string 了系统性的探索，特别关注对 `FinFET` 设计中每个手指鳍数量的操作。我们的研究旨在揭示每个手指鳍数量与关键电路性能参数（如 `SNM`\
  \ 和功耗）之间的复杂关系。通过细致地检查和分析各种鳍拓扑结构的影响，我们希望为电路设计领域提供宝贵的见解，最终促进更高效、更具韧性的数字系统的进步 [7]。在图\
  \ 12.2a 和 b 中，同时改变了访问 NMOS 晶体管（即 `NM2` 和 `NM7`）的鳍数量，并分别对 `SNM` 和电源稳定性进行了分析。观察发现，随着访问晶体管鳍数量的增加，晶体管的驱动能力也随之增强。增强的驱动能力导致更快的切换速度和更大的电流流，导致\
  \ SRAM 单元稳定状态（‘0’和‘1’）之间的电压差减小。因此，电压差的减少使得单元更容易受到噪声引起误差的影响，最终降低了 `SNM`。由于此，读取操作中的功耗也随着鳍数量的增加而增加。\n\
  \n![FIGURE 12.2a 静态噪声裕量随访问 NMOS 每个手指鳍数量的变化的变化](img/Fig12_02a.jpg)\n\nFIGURE 12.2a\
  \ 静态噪声裕量随访问 NMOS 每个手指鳍数量的变化的变化。\n\n![FIGURE 12.2b 静态功耗随访问 NMOS 每个手指鳍数量的变化的变化](img/Fig12_02b.jpg)\n\
  \nFIGURE 12.2b 静态功耗随访问 NMOS 每个手指鳍数量的变化的变化。\n\n在图 12.3a 和 b 中，同时改变了反相器 NMOS 晶体管（即\
  \ `NM1` 和 `NM4`）的鳍数量，并分别对 `SNM` 和电源稳定性进行了分析。显然，写入静态噪声裕（WSNM）降低了，因为反相器 NMOS 晶体管可能会增强某些性能指标（如速度），同时也损害\
  \ SRAM 单元的抗噪性和稳定性，导致 `SNM`set。因此，写入操作期间静态功耗也会增加。随着 NMOS 反相器晶体管鳍数量的增加，读取静态噪声裕（RSNM）也得到了提高。鳍数量的增加改变了有效沟掺杂浓度，从而影响阈值电压。结果，更多的鳍提高了亚阈值斜（测量漏电流随栅电压的变化率），增强了单元可靠存储数据的能力，进一步促进了\
  \ `SNM` 的增加。\n\n![FIGURE 12.3a 静态噪声裕量随反相器 NMOS 每个手指鳍数量的变化的变化](img/Fig12_03a.jpg)\n\
  \nFIGURE 12.3a 静态噪声裕量随反相器 NMOS 每个手指鳍数量的变化的变化。\n\n![FIGURE 12.3b 静态功耗随反相器 NMOS 每个手指鳍数量的变化的变化](img/Fig12_03b.jpg)\n\
  \nFIGURE 12.3b 静态功耗随反相器 NMOS 每个手指鳍数量的变化的变化。\n\n最后，图 12.4a 和 b 显示了随着反相器 PMOS 晶体管（`PM0`\
  \ 和 `PM1`）每个手指鳍数量变化的 `SNM` 和电源稳定性变化。反相器 PMOS 晶体管中更多的鳍带来的增强驱动力和潜在阈值电压调整可以提高 SRAM\
  \ 单元整体 `SNMs`。驱动能力的增强将增加碰撞，从而增加功耗。因此，读取功耗随着 PMOS 鳍数量的增加而增加。而写入功耗在鳍数量增加到 5 之前一直在增加，之后由于更好的电流流和更小的漏电流开始减少。\n\
  \n![FIGURE 12.4a 静态噪声裕量随反相器 PMOS 每个手指鳍数量的变化的变化](img/Fig12_04a.jpg)\n\nFIGURE 12.4a\
  \ 静态噪声裕量随反相器 PMOS 每个手指鳍数量的变化的变化。\n\n![FIGURE 12.4b 静态功耗随反相器 PMOS 每个手指鳍数量的变化的变化](img/Fig12_04b.jpg)\n\
  \nFIGURE 12.4b 静态功耗随反相器 PMOS 每个手指鳍数量的变化的变化。\n\n\n\n\n对 `SNM` 和静态功耗的结果针对不同鳍片（fins）数量进行了分析。根据晶管在单元中的特定角色，保持了晶体管标准的分级尺寸顺序——从反相器\
  \ `PMOS` 开始，接着是反相器 `NMOS`，然后是访问 `NMOS` [8]。根据这种分级尺寸模式，负责写操作和待机模式下上拉功能的 `PMOS` 晶管尺寸往往最小，以确保稳定运行具有足够的驱动强度。促进单元数据读写访问的访问\
  \ `NMOS` 晶管在尺寸上通常大于反相器 `PMOS` 而小于反相器 `NMOS`，因为它主要用于实现对存储节点的高效访问，而不需要过大的面积。读取操作期间数据传感和放大至关重要的反相器\
  \ `NMOS` 通常尺寸最大。最后，这种尺寸分级确保了 9T SRAM 单元设计中性能、功耗效率和面积利用率的平衡。此外，`SNM` 和静态功耗对于决定 SRAM\
  \ 单元的整体效率起着重要作用。因此，通过综合仿真结果和分级尺寸模式，优化了鳍片数量，以增加低功耗操作的稳定性。9T SRAM 单元每个手指的优化鳍片数量如表\
  \ 12.2 所示。\n\n#### 表 12.2 所提 9T SRAM 单元每个手指的优化鳍片数量\n\n| 晶管 | 每个手指的鳍片数量 |\n| ---\
  \ | --- |\n| 访问 `NMOS`（即 `NM2` 和 `NM7`）每个手指的鳍片数 | 4 |\n| 反相器 `NMOS`（即 `NM1` 和 `NM4`）每个手指的鳍片数\
  \ | 10 |\n| `PMOS`（即 `PM0` 和 `PM1`）每个手指的鳍片数 | 3 |\n\n## 12.4 分析\n\n### 12.4.1 对比分析\n\
  \n在评估提出的 9T SRAM 设计时，与现有 SRAM 模型进行彻底对比至关重要。这种方法对于全面理解其性能和优势至关重要。通过将 9T SRAM 与传统的\
  \ 6T SRAM 以及可能更新的进展（如 10T SRAM）并列对比，这些对比分析使我们能够确定所提 9T SRAM 设计与其对应设计相比的特定优缺点。此外，与已有的\
  \ SRAM 架构进行基准测试，为潜在的权衡和改进领域提供了宝贵的见解，有助于优化所提 9T SRAM 以在现实应用中获得优越的性能。表 12.3a 显示了与各种\
  \ SRAM 设计的已发表结果相比的稳定性裕裕的对比分析。虽然表 12.3b 显示了与已发表结果相比的读写访问时间的对比分析，但发现与已发表的 10T SRAM\
  \ [8] 相比，所提 9T SRAM 的读写操作速度分别快了 2.14 倍和 4.05 倍。虽然读写操作的稳定性略降低了 1.7 倍和 1.9 倍，但还将所提\
  \ SRAM 与已发表的 8T SRAM 进行了比较 [[9]]。发现与已发表的 8T SRAM 单元相比，所提 9T SRAM 几乎快 42 倍和 20 倍。与\
  \ 8T SRAM 相比，稳定性降低得足够。因此，表明所提 9T SRAM 单元提供了快速的读写操作，对于未来的 AI 和 ML 应用非常有益。它仍然提供了需求范围内的稳定性，并且可以通过改变鳍片数量来改进。\n\
