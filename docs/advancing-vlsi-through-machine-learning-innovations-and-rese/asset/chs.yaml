  \ 特性。应用短时间漏极脉冲以达到指定的最终值。脉冲稳定后，栅极电压被强制移动到深度截止的 RB（反偏）状态，然后推向 FB 条件。保持较长的过渡时间允许逐渐移动并捕捉器件的响应。当栅极电压小于阈值电压时，AlGaN\
  \ 势垒/GaN 通道界面处的二维电子气因通道密度而截止。通过保持垂直耗尽区不变，势垒扩展到缓冲层中。当器件开启时，通道电荷密度开始增长。随着通道密度从截止开始建立，栅极电容开始上升，导致有效势垒降低。耗尽宽度边缘逐渐向\
  \ AlGaN 势垒/GaN 通道界面移动。达到一个该值等于阈值电压的点。这是耗尽宽度等于背景掺杂的点。如果栅极电容达到峰值，则表明存在强通道导电。栅极电压的进一步增加表现为栅极电容的轻微衰减，表明通道已饱和，耗尽区向源极端生长。`C`–`V`\
  \ 曲线在漏极偏压变化时表现出剧烈变化。这导致了二维电子气区域耗尽层的扩展 [69]。\n\n## 2.6 结论\n\nGaN 器件广阔的特性推动了器件技术向大信号应用的发展。GaN\
  \ 高电子迁移率晶体管功率器件适用于高开关速度和高功率需求。在讨论中，我们研究了陷阱产生的起源。由于意外陷阱，DC 和 RF 特性受到干扰。陷阱由于物理工艺产生。为了消除陷阱，实施了不同的工程技术。栅极工程技术用于控制栅极漏电和器件内的电子。通过实施各种技术，可以提高线性和噪声性能；因此，器件用于通信系统和广泛的雷达应用。良好的缓冲层设计可以通过适当的掺杂设计控制陷阱。可以通过适当的钝化消除表面陷阱。可以通过势垒层工程消除势垒陷阱。应变工程已通过引入缓冲层增加晶体管速度减少陷阱数量。晶体管设计中需要进行权衡。\n\
