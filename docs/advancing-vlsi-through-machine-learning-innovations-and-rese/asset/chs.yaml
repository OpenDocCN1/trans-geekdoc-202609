  \n**假阴性 (FN)**: 24\n\n\n\n\n\n这些是模型预测为非肿瘤，但实际类别为肿瘤的情况（图 7.2）。\n\n![图 7.2 无脑肿瘤图像。](img/Fig07_02.jpg)\n\
  \n图 7.2 无脑肿瘤图像。\n\n### 7.4.2 准确率\n\n![](img/Fig07_11.jpg)\n\n## 7.5 讨论\n\n在这一全面的探索中，我们展示了一种尖端的深度学习解决方案，用于通过\
  \ MRI 在早期阶段检测脑肿瘤。我们的突破性方法依赖于 `ResNet-50` 作为其底层结构的强大能力。为了验证我们所提方法的有效性，我们进行了广泛的评估，将其与目前常用的分类策略进行了比较。此外，我们在分析中还仔细地考虑了包含肿瘤定位的关键组件——语义分割。同时，我们研究了使用\
  \ `ResNet-50` 进行迁移学习的影响。\n\n所提模型与现有方法的对比分析见表 7.2。所有研究均使用广泛认可的 `BRATS` 数据集执行。然而，我们的先进模型结合了具有大脑顶视图和侧视图特征的不同数据集。\n\
