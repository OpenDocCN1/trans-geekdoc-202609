  图 15.13 显示了心率结果。\n\n图 15.14 显示了历史。\n\n## 15.5 结论\n\n这项工作实现了一个基于 `VLSI` 系统和概念验证的实用医疗平台。由于许多医院拥有自己的\
  \ `EHR`，在医院内部传输 `EHR` 将非常困难，这将导致用于药物和健康的患者数据丢失。考虑到每个医院在其中央数据库中存储数据的方法，存在单点故障的风险，通过使用\
  \ `blockchain` 的分布式结构可以防止这种情况。在未来的工作中，我们打算整合多种健康监测工具并增强性能。此外，我们计划将支付模块纳入当前框架中。为了实现这一点，我们需要考虑几个因素。具体来说，我们需要确定患者在去中心化\
  \ `blockchain` 系统上会诊的成本。为了遵循医疗行业的价值观，我们还需要定义特定的政策和法规。数百万人的 `EHR` 可以存储在 `EHR` 中。随着时间的推移，数据量将指数级增长。对于\
  \ `blockchain`，需要一个可扩展的系统。挖掘新区块所需的带宽资源以及向网络节点广播通信带来的额外开销是该建议系统的另一个问题。可以通过增加动态重构来进一步改进\
  \ `IP` 使用率和能量消耗。\n\n1. Shahnaz A., Qumar U., Khalid A. Using blockchain for electronic\
