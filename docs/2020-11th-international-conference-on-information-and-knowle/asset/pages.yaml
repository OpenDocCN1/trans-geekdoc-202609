    Depending on what p is, the probability of an attack in the system will be [7].
    In this section, we assumed that p=0.8. With a probability of 0.8 there will be
    an attack in system. The hypothesis is that if k=1 then there is an attack on
    the system, and if k=0 the system will be safe.


    It is assumed that the leader will not be attacked and only one agent can be attacked,
    each also one agent. It is also noted that the degree of network connection in
    G-graph is f-local, for the simplicity of the system is found to f=1. Which means
    a maximum of one node can be attacked. And in these conditions, f-graph has the
    ability to reach a certain amount of information up to 15 percent of the total
    data. After completing the training, the network performance will be evaluated
    with the excluded data. In the following, different network configurations are
    examined and curves related to the accuracy and mean squares of the error are
    presented to evaluate the performance of the model. By checking different network
    configurations of deep learning, The following results are the best of deep learning
    network.


    # IV. CONCLUSION


    In this study, we proposed a method to maintain resilient consensus in complex
    cyber-physical networks with local attacks of f. By applying this method, it was
    observed that in the event of an attack, the system can remain stable and the
    attacked node of the system is not weakened. We evaluated the performance of the
    proposed neural network in this study, it was observed with deep neural network,
    [8] the system shows better performance. In a recurrent network integrated with
    a deep neural network, a deep layer with a linear function performs better. It
    can be said that the system has less complexity. With deep learning method, systems
    can analyze patterns and learn to help prevent similar attacks and changing behavior.
    In short, machine learning can make cyber security simple, efficient and far more
    effective. After observing the state of the system reported by the neural network,
    the system makes decisions based on it, and if there is an attack, it detects
    and isolates it, so as not to have


    a effect on the behavior of agents. In future, more attacks on agents can be considered,
    data mining and other machine learning methods, such as support vector machine(SVM)
    algorithms or other types of neural networks as recurrent neural networks to evaluate
    system performances.


