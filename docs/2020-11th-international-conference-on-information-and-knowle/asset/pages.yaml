    B. Distributed control method in leader-follower network A leader leads to the
    inputs of the network, while the followers update their status using the consensus
    algorithm and gradually converge to the final state of the leader. Assuming that
    the leader can be a misbehaving agent, the distributed control algorithm for leader-follower
    consensus performs the function at four steps at each time step and provides references
    [4][5].


    +   1) Each agent detects misbehaving neighbors by their local observations and
    monitoring misbehaviors:


    ```

    $G_{ij}[k] = \begin{cases} G_{ij}[k-1] + 1, & \text{if } |r_{ij}-z[k]| < (\gamma,
    \delta) \ G_{ij}[k-1] - 1, & \text{if } |r_{ij}-z[k]| > (\gamma, \delta) \end{cases}
    (6)$

    ```


    $G(i,j)$ is the total number of correct states of the neighbor who is denoted
    by $j$ until k time step, which is controlled by agent $i$. $(\gamma)$ is a threshold
    function that depends on the time step $k$ and $\delta$ disorder.


    +   2) The weight of the consensus to the value of the neighbor''s reputation
    is adjusted. Given a set of correct and incorrect behaviors by neighbors, the
    probability distribution of participating particular combination of correct and
    incorrect behaviors from this agent satisfies the detection. The beta distribution
    expressing the reputation


    ```

    $d_{ij} = \frac{rep_{ij}[k]}{\sum_{j=1}^{n} rep_{ij}[k]} (8)$

    ```


    This equation is for normalization. If the above relation is used, the line sum
    of $d_{ij}$ elements will be one. If the neighbor agent is detected, the consensus
    manager reduces the weight of the corresponding consensus $d_{ij}$ to reduce the
    rate of spread of the effects of potential misbehaving agent. If an agent is identified
    as a misbehaving node, the $d_{ij}$ consensus manager resets it to disconnect
    from the other agents from that agent.


