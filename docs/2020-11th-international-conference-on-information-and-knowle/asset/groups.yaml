    # 2020 11th International Conference on Information and Knowledge Technology (IKT)

    December 22-23, 2020; Shahid Beheshti University - Tehran, Iran


    # Detection and Identification of Cyber-Attacks in Cyber-Physical Systems Based
    on Machine Learning Methods


    Zohre Zarandi, Iman Sharif

    Department of Electrical Engineering

    Imam Khomeini International University

    Qazvin, Iran

    Email: Nasari.zohre8888@gmail.com


    Abstract—Cyber-physical systems (CPS) have made significant progress in many applications
    despite the integration between physical components, computational resources,
    and communication capabilities. Cyber-attacks are a major threat to these systems.
    Attacks that occur by cyber-physical systems, cyber-attacks occur unexpectedly
    and stealthily. Some of these attacks, which are called data injection attacks,
    aim to mislead detection by compromising some systems, corrupting data, or entering
    misinformation into the system. If the system is unaware of the attack, its performance
    may be degraded or disabled. Therefore, it is necessary to adapt algorithms to
    identify the types of attacks in these systems. It should be noted that the data
    generated by CPS comes with so much variety, and it is important to use machine
    learning algorithms to facilitate the evaluation and analysis of data. In this
    paper, the CPS is modeled as a network of agents that move with each other, and
    one is considered as a leader, and attacks are commanded by the leader. The proposed
    method uses deep learning networks for the detection phase, which should inform
    the system of the existence of the attack in the initial moments of the attack.
    To isolate the misbehavior in the leader-follower mechanism has been investigated.
    In the proposed control method, the attack detection phase with the use of a deep
    neural network controls the misbehavior. Experimental analysis shows that using
    learning algorithms can detect attacks with higher performance, make security
    simpler, less expensive, and free from effort.


    Recent advances have led to the introduction of cyber-physical systems, which
    due to their better computational ability and integration between physical and
    cyber components, has led to significant improvement in many dynamic applications.
    This improvement comes at the cost of being vulnerable to cyber-attacks [11],
    [13], [14]. Cyber-physical systems are composed of logical and embedded devices,
    which communicate through communication channels as the IoT. More specifically,
    these systems include digital or cyber components, and log components, physical
    devices and humans designed to operate between physical and cyber parts. In other
    words, a cyber-physical system is any system that includes cyber physical components
    and humans, and has the ability to trade between the physical and cyber parts
    [1], [110]. In cyber-physical systems, the security of these types of systems
    becomes important due to the addition of the physical data components which receive
    data from the physical environment, may receive and be injected data into the
    system. One of the most important challenges of a cyber-physical system in the
    physical part is the presence of an environment, which collects so much data,
    with so much variety, and high speed. Also, the connection between physical and
    cyber parts makes the data obtained have many challenges. Therefore, one of the
    most important features of a cyber-physical system is to communicate between these
    systems, secure control, and the system.


    The security of cyber-physical systems to detect cyber-attacks is an important
    issue in these systems [1]. It should be noted to describe these attacks in irregular
    ways and a regular manner [9]. In general, cyber attacks in cyber-physical systems
    are of two main types: denial of service (DoS) and detection attacks [1]. In denial
    of service, the attacker attacks between network nodes and communication channels.
    How the deception attacks that inject false data into system, which are carried
    out by abusing system components as sensors or controllers and it can corrupt
    data or enter other information into the system and cause misbehaving [12]. These
    attacks can be detected by monitoring in the system. But if the attacker can gain
    a high-level attack to protect from himself being identified, these attacks are
    called stealth deception attacks, and other common methods of communication attacking
    [11], [12]. Therefore it is important to be aware of the attacks that occur in
    respond in a timely manner to attackers. Other when, the security system be aware
    of the attack, otherwise it will not be to.


