    B. 主跟随网络中的分布式控制方法。领导引导网络的输入，而跟随者使用共识算法更新其状态并逐渐收敛到领导的最终状态。假设领导可能是一个异常代理，用于主跟随者共识的分布式控制算法在每个时间步执行四个步骤的功能，并提供参考
    [4][5]。


    - 1) 每个代理通过其局部观测和行为监控来检测异常邻居：


    ```

    $G_{ij}[k] = \begin{cases} G_{ij}[k-1] + 1, & \text{if } |r_{ij}-z[k]| < (\gamma,
    \delta) \\ G_{ij}[k-1] - 1, & \text{if } |r_{ij}-z[k]| > (\gamma, \delta) \end{cases}
    (6)

    ```


    $G(i,j)$ 是由代理 $i$ 控制的表示为 $j$ 的邻居直到 $k$ 时间步的正确状态总数。$(\gamma)$ 是一个取决于时间步 $k$ 和无序度
    $\delta$ 的阈值函数。


    - 2) 调整趋向邻居信誉值的共识权重。给于邻居的一组正确和错误行为，该代理参与特定正确和错误行为组合的概率分布满足检测。表示信誉的贝塔分布：


    ```

