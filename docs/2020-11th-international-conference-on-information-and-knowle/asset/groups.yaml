    # 2020年第11次信息与知识技术国际会议 (IKT)

    2020年12月22-23日；谢德·贝赫什蒂大学 - 伊朗德黑兰


    # 基于机器学习方法的信息物理系统网络攻击检测与识别




    Zohre Zarandi, Iman Sharif

    电气工程系

    伊玛目·柯莱尼国际大学

    伊朗，加兹温

    邮箱：Nasari.zohre8888@gmail.com


    摘要——尽管物理组件、计算资源和通信能力之间实现了集成，但信息物理系统（CPS）在许多应用中取得了显著进展。网络攻击是这些系统的主要威胁。发生信息物理系统中的攻击是出其意料且隐蔽的。这些攻击中，有些被称为数据注入攻击，其旨在通过破坏某些系统、腐改数据或向系统输入虚假信息来误导检测。如果系统没有察觉攻击，其性能可能会下降或被停用。因此，有必要调整算法来识别这些系统中的攻击类型。需要注意的是，CPS
    生成的数据具有很多样性，使用机器学习算法来促进数据的评估和分析至关重要。在本文，CPS 被建模为相互移动的智能体网络，其中一个被视为领导者，攻击由领导者指挥。所提出的方法在检测阶段使用深度学习网络，应在攻击发生的初期通知系统攻击的存在。研究了如何在领导者-跟随机制中隔离异常行为。在所提出的控制方法中，利用深度神经网络攻击检测阶段控制异常行为。实验分析表明，使用学习算法可以更高的性能检测攻击，使安全更简单、更廉价且无需努力。


    最近的进展导致了信息物理系统的引入，由于更好的计算能力以及物理与网络组件之间的集成，许多动态应用得到了显著提高。这种改进是以易受到网络攻击为代价的 [11],
    [13], [14]。信息物理系统由逻辑和嵌入式设备组成，通过物联网等通信通道进行通信。具体来说，这些系统包括数字或网络组件、逻辑组件、物理设备以及设计在物理和网络部分之间运行的人员。换之，信息物理系统是任何包含信息物理组件和人类并能够在物理与网络部分之间进行交换的系统
    [1], [110]。在信息物理系统中，由于增加了接收物理环境数据的物理数据组件，这些数据可能会接收并向系统注入数据，因此这类系统的安全性变得非常重要。信息物理系统在物理部分面临的最大挑战之一是环境的存在，该环境收集了大量多样化且高速的数据。此外，物理部分与网络部分之间的连接使得获得的数据面临许多挑战。因此，信息物理系统最重要的特征之一是这些系统之间的通信、安全控制以及系统本身的安全性。


    信息物理系统检测网络攻击的安全性是这些系统中的一个重要问题 [1]。需要注意的是以不规则的方式和常规的方式来描述这些攻击 [9]。通常，信息物理系统中的网络攻击主要有两种类型：拒绝服务
    (DoS) 和检测攻击 [1]。在拒绝服务中，攻击者在网络节点和通信通道之间进行攻击。欺骗攻击向系统注入虚假数据，通过滥用作为传感器或控制器的系统组件实施，可能会腐改数据或向系统输入其他信息并导致异常行为
    [12]。这些攻击可以通过系统内部监控来检测。但如果攻击者能够获得高水平攻击以保护自己不被识别，这些攻击被称为隐蔽欺骗攻击以及其他常见的通信攻击方法 [11],
    [12]。因此，意识到发生的攻击并及时对攻击者做出响应至关重要。其他情况下，安全系统应当意识到攻击，否则将无法感知。


