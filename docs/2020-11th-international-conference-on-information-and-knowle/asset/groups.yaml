    ```


    该方程用于归一化。如果使用上述关系，$d_{ij}$ 元素的行和将为一。如果检测到邻居代理，共识管理器会降低相应共识 $d_{ij}$ 的权重，以减少潜在异常代理的影响扩散率。如果一个代理被识别为异常节点，$d_{ij}$
    共识管理器将将其重置以断开该代理与其他代理的连接。


