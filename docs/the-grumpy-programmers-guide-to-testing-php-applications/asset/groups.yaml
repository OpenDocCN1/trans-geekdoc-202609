    \ .*)?$/\" \\\n ApiResponseTest /Users/chartjes/grumpy-guide/test/api_response_test.php\
    \ \\\n --teamcity\n PHPUnit 8.3.4 by Sebastian Bergmann and contributors.\n\n\
    \ Time: 1.21 seconds, Memory: 12.00 MB\n\n OK (1 test, 3 assertions)\n```\n```\n\
    \nThese sorts of tests are pretty straightforward, but they might not provide\
    \ enough value depending on the types of responses we would get back. I could\
    \ write a much more comprehensive test that checks for the existence of a larger\
    \ number of fields, but I still have some potential issues. What if the response\
    \ contains additional fields I’m not expecting? Or what if the value for a field\
    \ changes from an integer to a string? Most APIs change over time and I want my\
    \ tests to be able to change with them. For scenarios like this, my best choice\
    \ is to switch to doing schema validation tests.\n\n### API Schema Validation\n\
    \nThere is a standard for describing your APIs, called OpenAPI. From the website\
    \ for the specification:\n\n> > The OpenAPI Specification (OAS) defines a standard,\
    \ language-agnostic interface to RESTful APIs which allows both humans and computers\
    \ to discover and understand the capabilities of the service without access to\
    \ source code, documentation, or through network traffic inspection. When properly\
    \ defined, a consumer can understand and interact with the remote service with\
    \ a minimal amount of implementation logic. An OpenAPI definition can then be\
    \ used by documentation generation tools to display the API, code generation tools\
    \ to generate servers and clients in various programming languages, testing tools,\
    \ and many other use cases. This is of interest to programmers because it allows\
    \ for a development-with-testing workflow that looks like this:\n\n+   - API developers\
    \ build their API\n+   - They document it using tools that support generating\
    \ an OpenAPI specification\n+   - Tests can be written by validating responses\
    \ against the specification\n"
  mdcn: "\n## 7. 以示例为依据的测试后开发\n\n有时候情况决定了你在已有可运行应用之后才编写测试。这并不意味着你不能开始编写测试。只需做好为期望结果做出选择的准备。你很可能需要修改一些代码以使其可测试。你会发现有些事情并不像你想象的那样工作。\n\
    \n最终，你所寻找的是一个测试系列，它能让你确信，如果你更改了某些内容，就有一些测试可以告诉你是否破坏了某些东西。就像事务日志条目一样。再次。\n\n##\
    \ 8. 重构辅助工具\n\n测试是你编写的代码，用来确保其他代码按预期行为。\n它们需要与你对所测试代码应给予的同等程度的关怀和关注。我们处理应用代码重构的许多相同方法也适用于测试代码。在本章中，我想展示我是如何重构一个现有的测试辅助工具使其更有用。\n\
    \n## 8. 重构辅助工具\n\n首先，我需要给你一些背景。我投入最多工作的开源项目是 OpenCFP，这是一个自托管的 PHP 应用，会议组织者可以用它来收集和评定会议演讲提案。它有很多测试。测试数量没有我希望的那么多，但我只是一个人，时间有限。我的贡献者也是如此。\n\
    \n所以我觉得同时需要务实和自律，如果这有意义的话。我们通过在该方法的 DocBlock 中添加注解来标记一个辅助方法以便将来移除。下面是我要重构的那个方法：\n\
    \n```\n```php\n/**\n * @deprecated\n *\n * @param array $properties\n *\n * @return\
    \ Model\\\\User|\\\\PHPUnit_Framework_MockObject_MockObject\n */\nprivate function\
    \ createUserMock(array $properties = []): Model\\\\User\n{\n    $user = $this->createMock(Model\\\
    \\User::class);\n\n    $user\n        ->expects($this->any())\n        ->method('__get')\n\
    \        ->willReturnCallback(function (string $property) use ($properties) {\n\
    \            if (\\\\array_key_exists($property, $properties)) {\n           \
    \     return $properties[$property];\n            }\n        });\n\n    return\
    \ $user;\n}\n```\n```\n\n重构结束时，这个辅助工具应该做同样的事情：创建一个可被现有测试使用的依赖。那，我们从哪里开始？\n\nOpenCFP\
    \ 的测试套件同时使用 Mockery 和 Prophecy，这两个库用于创建测试替身。如果我有强烈的偏好，我可能会选择其中一个工具，然后将使用未选工具的辅助方法标记为已弃用，或在测试中添加注释以指示需要修改。\n\
    \n我不认为其中一个对项目来说是“正确”的。我最初使用 Mockery，然后尝试了一些使用 Prophecy 的测试，我真的无法做出决定！不过，我确实需要一些东西来帮助我做出决定。\n\
    \n## 8. 重构辅助工具\n\n一切都通过了。下面是辅助工具现在的样子：\n\n```\n```php\n/**\n * @param array $properties\n\
    \ * @return Model\\User\n */\nprivate function createUserMock(array $properties\
    \ = []): Model\\User\n{\n    $user = new class extends Model\\User {\n       \
    \ public $properties;\n\n        public function __get($property)\n        {\n\
    \            if (\\array_key_exists($property, $this->properties)) {\n       \
    \         return $this->properties[$property];\n            }\n        }\n\n \
    \       public function __set($property, $value)\n        {\n            $this->properties[$property]\
    \ = $value;\n            return;\n        }\n    };\n    $user->properties = $properties;\n\
    \n    return $user;\n}\n```\n```\n\n重新运行测试并确保这次重构没有破坏任何东西。\n\n```\n```\n/usr/local/bin/php\
