    \ value=\"testing\"/>\n    <env name=\"CFP_ENV\" value=\"testing\"/>\n    <env\
    \ name=\"KERNEL_CLASS\" value=\"OpenCFP\\Kernel\"/>\n  </php>\n  <filter>\n  \
    \  <whitelist>\n      <directory>src</directory>\n    </whitelist>\n```\n\n[2]\
    \ OpenCFP: https://github.com/opencfp/opencfp"
