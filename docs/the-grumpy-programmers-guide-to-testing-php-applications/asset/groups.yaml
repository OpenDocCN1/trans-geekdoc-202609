  - '[PAGE 113]


    # Chapter


    # 13


    # Building a Testing Culture


    It takes a lot of work to put together the type of environment where testing is
    an integral part of your daily work. It can’t be an afterthought or something
    that is forgotten when the deadlines get tight. Testing has to become a primary
    practice, or it will just not work. Let’s also make sure we are getting all our
    terms straight–what does it mean when I start talking about “building a testing
    culture?”'
  - '[PAGE 114]


    # Primary Goal


    The primary goal should be “our developers write tests for any code that goes
    into production.” Anything less than that is an opportunity for those folks with
    a little less discipline or more anxiety about delivery times to backslide and
    abandon the primary goal of having tests for all your code.


    Primary goals are supposed to be lofty and ambitious–but in this case, they are
    totally achievable. You absolutely can provide your developers with all the training
    and support they need to learn how to write tests. You just have to change your
    behavior and probably challenge a lot of beliefs about programming that you have.


    With your primary goal set, let’s talk about the secondary goals you need to make
    the primary goal work.


    # Tests as First Class Components


    Of course, you can’t really have a culture that includes testing if you don’t
    have any tests! This is usually the biggest obstacle for any organization to becoming
    test-centric. Think back to when you were learning to program in PHP–were you
    taught to write tests? If you were, consider yourself extremely lucky!


    It may seem obvious, but the first thing you’ll have to do is commit to writing
    tests for any new code that is written. Yes, this is likely to be painful as your
    organization makes the transition. Yes, you will probably complain about this.
    I have been in more than one meeting where people complained their work would’ve
    been done if “it wasn’t for all these stupid tests I have to write.”


    Developers, who mostly pride themselves on logic and problem-solving skills, are
    just as resistant to change as anyone else. It will be hard to get into the habit
    of always having tests with your code.


    If you’re looking for a way to ease into adding tests, here are some strategies
    you can apply.


    # Tests for Bugs


    Any time someone reports a bug, write a test verifying the bug exists. By this,
    I mean the test should fail; you should know what the correct outcome should be,
    and then the test generates its own outcome you compare to the expectation.


    With a failing test that also has what the correct outcome is supposed to be,
    you change the code you’re testing until the test passes. Now, you have a passing
    test!'
  - '[PAGE 115]


    A test suite consisting of fixes for bugs can also show you some common patterns
    in your code–especially if you feel like you’re repeatedly fixing the same type
    of bugs.


    From a mentoring perspective, asking developers new to a project to write test
    cases that verify bugs exist can be a good strategy. It allows them a chance to
    explore the codebase and see how things fit together. For some codebases, this
    will definitely be intimidating. Giving them a chance to learn the codebase through
    tests is probably less risky than assigning work that needs to go up into production.


    # Tests for New Features


    Any time you add new code, it must come with tests that prove the new code works
    as expected. This is similar to writing tests for bugs, but in this case, you
    are using the tests to help you create working code.


    In this context of “tests are for new features,” Test-Driven Development can really
    shine. TDD is really a strategy for writing code in a specific way–one which results
    in code that is testable with low amounts of friction or developer pain.


    But it doesn’t come without costs. Often, a legacy application is not well-suited
    to allowing you to write easily tested code. This is a barrier many developers
    get slammed up against and, as a result, abandon the goal of having tests.


    I don’t have any shortcuts to make this easier. The pain you feel is neither good,
    nor bad–it is simply a result of the current architecture of your application.
    Well-tested apps tend to consist of small modules of code that:


    +   - Accept a small number of inputs

    +   - Does not alter anything other than what was given to it (no side-effects)

    +   - Returns a small number of outputs


    When you have code like this, it’s easy to test! Most code does not look like
    that. You will need to rewrite some code; you will need to start to use new strategies;
    you will end up taking longer than you thought to create new code and the tests
    that come with it.


    The upside to all this is you have tests that act as proof the new feature will
    work as expected, given the information you have at the time you wrote the code.
    Good defensive coding habits can help a little, but the truth is that code with
    unit tests with 100% coverage doesn’t always mean your application will work correctly.
    You still have to connect them together and use them in a way that makes sense.
    Testing is definitely not a substitute for common sense.'
