    ## 索引 139


    ## 1. 引言


    在这次发布之后，我被叫到项目经理办公室开会。讨论以他说，“好吧，我们不需要这个了，”结束，并把装着解雇信和遣散费支票的信封扔进了垃圾桶，随后他递给我一本书说，“我希望你周末看看这本书，周一早上告诉我你的想法。”那本书是
    Ron Jeffries、Ann Anderson 和 Chet Hendrickson 合著的《Extreme Programming Installed》一本复印件。当时，我从大多伦多地区的外围通勤，乘坐通勤火车往返
    90 分钟进城，回家要 2 小时（由于换乘）。我有充足的时间来阅读这本书。


    你很少会遇到一个真正改变成年后生活的概念。在这种情况下，当我读到书中关于单元测试的部分时，我震惊又兴奋。原来我们可以用计算机本身来发现代码中的错误和 bug，而不是依赖
    QA 人员或我们的客户？尽管我已经从事有偿编写计算机程序工作五年了，这对我来说仍然是革命性的。


    当我回到工作岗位并再次与那位项目经理会面时，我们制定了计划开始解决我们在应用程序中面临的问题并建立某种测试。不久之后，我使用 SimpleTest 框架（基本上是
    PHPUnit，但测试在浏览器中运行）编写了第一个单元测试，剩下的就是以测试为中心的职业生涯。


    测试作为一个概念，很难向初学者程序员解释：“我们将编写代码来确保你的其他代码按预期工作。”这一切背后的假设是你已经懂得如何在你选择的语言中编写计算机程序！这使得向初学者或经验不足的程序员教授它变得非常困难。当你再加上
    PHP 不强制任何特定结构的特点时，就形成了一个环境，只有真正有动力的人才会学习测试。


    这里也存在类似“幸存者偏差”的情况。那些把测试作为实践纳入开发工作流程的人，都是在其中取得成功的人。我们很少听到那些尝试学习测试（无论是自学还是向他人学习）却没有成功的人的声音。总的来说，测试社区规模很小，但对自己的观点非常直言不讳。我可以理解人们犹豫不愿分享自己的失败。


    这本书是我为希望变得更以测试为中心的发展者提供帮助的方式。通过学习基本技能（技术和非技术），你将能够使用几乎任何测试框架和几乎任何 PHP 应用程序编写测试。


    我们将从了解测试到底是什么开始，因为我觉得很多人（包括经验丰富的测试人员）对测试的目标存在误解。之后，我们将看看 PHPUnit 如何工作，以便你了解更好的使用方法。掌握这些知识后，我们将使用测试驱动开发（TDD）构建一些代码，以说明测试如何驱动应用程序代码的设计。


    我们大多数人都没有机会在新项目中使用 TDD。我将向你展示如何为现有应用程序编写测试，尤其是那些没有考虑到测试而编写的应用程序。工具是相同的；我们只是以不同的方式使用它们。


    在编写了一些测试之后，我们将转向测试的人性化方面，提供策略来帮助你身边的人变得更以测试为中心。认识到测试更多关乎人而非工具本身，对我来说是一个重大的启示。


    为了充分利用本书，你应该是一名对 PHP 有中级理解的开发者。当你对语言本身没有坚实掌握时，编写测试会很困难，而且你将编写的测试类型更多是需要理解和维护的
    PHP 代码。


    祝好运，我希望你觉得这里的材料有用。我很乐意在你阅读本书的过程中听到你的反馈。联系我的最佳方式是通过 Twitter，我在那里以 @grumpyprogrammer
    的身份进行行为艺术。如果 Twitter（或社交媒体一般）不是你的菜，你也可以发邮件到 chartjes@grumpy-learning.com。我会阅读所有未被标记为垃圾邮件的邮件，并尽力尽快回复。

