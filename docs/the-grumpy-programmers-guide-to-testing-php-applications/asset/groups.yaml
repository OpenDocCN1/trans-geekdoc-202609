  mdcn: "\n\n- 它会报告测试是通过还是失败\n\n进入最后这一阶段的好处之一是，你利用了计算机非常擅长的事情：一遍又一遍地做你让它们做的事情，通常还毫无怨言。所以，如果我能让另一台计算机对我所做的事情作出反应并替我运行测试，我就可以专注于解决问题，而不是去记忆一串很有可能不小心搞乱的命令。\n\
    \n## 最后的思考\n\n测试的目的是让你有信心：任何进入代码的缺陷都会在应用发布到生产环境之前被检测出来。这种信心也让你能够重构或重写代码，因为你知道，如果你不小心破坏了之前能正常工作的东西，你会在用户发现之前就知道。\n\
    \n## 第 4 章 PHPUnit 的工作原理\n\n### 高层概览\n\n虽然 PHPUnit 不是我使用的第一个测试框架（这个荣誉属于 SimpleTest），但它是我最常使用的框架。市面上还有很多其他测试代码的工具，但我总是回到\
    \ PHPUnit，因为它方法简单，而且其他人创建了大量插件让它更加有用。\n\nPHPUnit 是一组工具的集合，包含一个测试框架和一些命令行实用程序，允许你运行用\
    \ PHP 编写的测试。它最初由 Sebastian Bergmann 开发，如今已经拥有众多贡献者，并且仍在积极开发中。\n\nPHPUnit 的工具采用所谓的\
    \ xUnit 架构。xUnit 有许多约定，引导你通过使用断言来以特定方式构建测试。断言（PHP 的内置特性）是用于断言特定条件为真或假的语句，具体取决于你所创建测试场景的目标。\n\
    \n维基百科上关于 xUnit 的文章有一个很好的总结，但这里是我们需要关注的几个部分：\n\n- 测试运行器\n- 测试用例\n- 测试套件\n\n在我们讨论这些之前，需要先安装\
    \ PHPUnit。\n\n### 我们如何安装 PHPUnit？\n\nPHPUnit 官网是任何与 PHPUnit 相关内容的最佳真相来源。在安装之前，请务必查看网站上的任何要求。在我写这本书的时候，PHPUnit\
    \ 当前版本是 8.4。假设你满足它的最低要求，有两种方式可以安装 PHPUnit。\n\n### 通过 PHP Archive（PHAR）安装\n\nPHPUnit\
    \ 的 PHAR 版本是一个二进制文件，你可以下载并安装到路径中的某个位置。要使用它，你还必须为 PHP 安装并启用 phar 扩展。PHPUnit 建议下载\
    \ PHAR 版本并在本地为你的项目提供它，而不是全局安装。\n\nPHPUnit 还建议不要在 production 环境中安装 PHPUnit。带有 CLI（命令行界面）组件的工具可能会通过其他库中的漏洞被利用，而且一个坚决的攻击者有机会从测试运行的输出中了解到某些信息的概率并非为零。\n\
    \n我不是安全专家，但为什么要给人们机会来捣乱你的应用呢？\n\n### 通过 Composer 安装\n\nComposer 是 PHP 社区用于安装 PHP\
    \ 相关包及其依赖的工具。强烈建议使用 Composer 将 PHPUnit 仅作为开发时依赖来安装。同样，我们希望避免在生产环境中安装任何与 PHPUnit\
    \ 相关的东西。\n\n假设你已经安装了 Composer，你可以通过 shell 执行以下 CLI 命令将 PHPUnit 添加到你的项目中。这会安装任何与当前依赖兼容的\
    \ 8.4 及以上版本的 PHPUnit。\n\n```\ncomposer require --dev phpunit/phpunit ^8.4\n```\n\
    \n安装好 PHPUnit 之后，我们可以看看如何执行你将要编写的测试用例。\n\n### PHPUnit 测试运行器\n\n测试运行器是一个 CLI 工具，用于执行你的测试用例并报告这些测试的结果。要使用\
    \ PHPUnit，你需要熟悉你所选操作系统上的 CLI 用法。\n\n测试运行器有许多你应该了解的参数。和许多强大的工具一样，它有各种各样的选项；你会发现你只会使用其中一小部分。\n\
    \n最基本的是，你从 shell 中使用 `phpunit` 命令（这要求你要么指定 phpunit 的完整路径，要么它就在你的 shell 执行路径中）。然后它会从当前目录（默认）或你指定的路径开始递归搜索带有\
    \ `.php` 扩展名的文件。\n\n如果这些文件包含一个继承自 PHPUnit 基础测试用例类之一的对象，PHPUnit 就会尝试执行它识别为测试的任何类方法。默认情况下，它假定任何以\
    \ `test` 开头的方法都应该是测试用例，并尝试执行其中的代码。你也可以使用带有注解的 DocBlocks 来指示某个类方法应该是测试。本书后面会有一些这样的示例。\n\
    \n测试运行器会执行这些测试，并继续尝试执行它认为是测试的任何内容，直到找不到更多为止。\n\n下面是对运行器工作方式的一个小演示。首先，你需要创建最简单的测试用例。别担心；稍后你会了解测试用例的基础知识。我们现在只需要一个占位符。安装好\
    \ PHPUnit 后，创建以下文件并将其命名为 `BasicTestCase.php`。\n\n```php\n<?php\n\ndeclare(strict_types=1);\n\
    \nclass BasicTestCase extends PHPUnit\\Framework\\TestCase\n{\n    public function\
    \ testCase()\n    {\n        $this->assertTrue(false);\n    }\n}\n```\n\n接下来，使用\
    \ CLI 测试运行器。你应该会得到与以下输出非常相似的结果：\n\n```\n> phpunit BasicTestCase.php\nPHPUnit 8.3.4\
    \ by Sebastian Bergmann and contributors.\n\nF                               \
    \       1 / 1\n(100%)\n\nTime: 91 ms, Memory: 12.00 MB\n\nThere was 1 failure:\n\
    \n1) BasicTestCase::testCase\nFailed asserting that false is true.\n\n/Users/chartjes/grumpy-guide/test/basic_test_case.php:9\n\
    \nFAILURES!\nTests: 1, Assertions: 1, Failures: 1.\n```\n\n如你所见，测试运行器告诉我们：\n\n\
    - 测试的状态（在这里 F 表示失败）\n- 花费了多长时间\n- 消耗了多少内存\n- 概述了具体的失败原因，并贴心地包含了行号\n- 包含多少个测试和多少个断言\n\
    \n现在创建一个通过的测试用例，这样你就可以看到区别：\n\n```php\n<?php\n\ndeclare(strict_types=1);\n\nclass\
    \ BasicTestCase extends PHPUnit\\Framework\\TestCase\n{\n    public function testCase()\n\
    \    {\n        $this->assertTrue(true);\n    }\n}\n```\n\n然后，使用测试运行器运行这个测试。\n\
