    \ Environment::testing());\n$app['session'] = new Session(new MockFileSessionStorage());\n\
    ```\n\nThere is a tendency for testers who like to employ test doubles to sometimes\
    \ forget you can use a fake object instead of creating a stub or mock. In this\
    \ case, we're using a fake from the Symfony project.\n\nOur application used Sentry[4]\
    \ for handling authentication and authorization, so I needed to create a test\
    \ double for this particular test.\n\n```\n1. // Set things up so Sentry believes\
    \ we're logged in\n2. $user = m::mock('StdClass');\n3. $user->shouldReceive('id')->andReturn(1);\n\
    4. $user->shouldReceive('getId')->andReturn(1);\n5. $user->shouldReceive('hasAccess')->with('admin')->andReturn(true);\n\
    6. \n7. // Create a test double for Sentry\n8. $sentry = m::mock('StdClass');\n\
    9. $sentry->shouldReceive('check')->times(3)->andReturn(true);\n10. $sentry->shouldReceive('getUser')->andReturn($user);\n\
    11. $app['sentry'] = $sentry;\n```\n\nThe dashboard controller is expecting there\
    \ to be a profile for the user and a talk associated with the user.\n\n```\n1.\
    \ // Create a test double for a talk in profile\n2. $talk = m::mock('StdClass');\n\
    3. $talk->shouldReceive('title')->andReturn('Test Title');\n4. $talk->shouldReceive('id')->andReturn(1);\n\
    5. $talk->shouldReceive('type', 'category', 'created_at');\n6. \n7. // Create\
    \ a test double for profile\n8. $profile = m::mock('StdClass');\n9. $profile->shouldReceive('name')->andReturn('Test\
    \ User');\n10. $profile->shouldReceive(\n11. 'photo', 'company', 'twitter', 'airport',\
    \ 'bio', 'info', 'transportation', 'hotel'\n12. );\n13. $profile->shouldReceive('talks')->andReturn([$talk]);\n\
    14. \n15. $speakerService = m::mock('StdClass');\n16. $speakerService->shouldReceive('findProfile')->andReturn($profile);\n\
    17. \n18. $app['application.speakers'] = $speakerService;\n```\n\n[4] Sentry:\
    \ https://cartalyst.com/manual/sentry/2.1\n\n## 14. BOOTSTRAPPING\n\nI hope you’re\
    \ noticing the pattern here:\n\n- Create a stand-in for an existing dependency\n\
    - Tell the Application object to use it\n\nNow that we’re done bootstrapping,\
    \ we actually “run” the application, use output buffering to prevent output which\
    \ can mess up the test output, and then run through our testing scenario.\n\n\
    ```php\n1. ob_start();\n2. $app->run(); // Fire before handlers... boot...\n3.\
    \ ob_end_clean();\n4.\n5. // Instantiate the controller and run the indexAction\n\
    6. $controller = new \\OpenCFP\\Http\\Controller\\DashboardController();\n7. $controller->setApplication($app);\n\
    8.\n9. $response = $controller->showSpeakerProfile();\n10. $this->assertContains('Test\
    \ Title', (string) $response);\n11. $this->assertContains('Test User', (string)\
    \ $response);\n```\n\nI know I went through a lot of code, but go back and think\
    \ about the basics of creating bootstrapping sequences for your tests:\n\n- Pay\
    \ attention to dependencies set in the application itself\n- Create substitutes\
    \ for those dependencies\n- Set them in your test setup\n\nLike so many other\
    \ things, when you start writing tests for your code, design decisions which make\
    \ building the application easier through global “application” objects often mean\
    \ extra work when it comes time to test things.\n\n### Auto-Wiring Bootstrapping\n\
    \nThe examples in the previous section are for an older app using a pattern that\
    \ is perhaps not so common with PHP web application frameworks that are popular\
    \ as I write this in the winter of 2019-2020. OpenCFP has evolved as well to take\
    \ advantage of the “most batteries included” approach Symfony takes. Instead of\
    \ all that work (which is many lines of code that I have to support) of a custom\
    \ bootstrapping sequence, I can use the application’s “kernel” to do all the work\
    \ of creating dependencies for me.\n"
