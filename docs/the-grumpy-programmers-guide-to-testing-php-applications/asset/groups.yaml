    # Final Thoughts


    The role of a data provider is to reduce duplication of code in your tests by
    providing you with a way to have a test use multiple sets of data for inputs and/or
    expected results. Just like any code, if you realize you are repeating yourself,
    I suggest taking a look at the test and determine if a data provider is a good
    fit.'
