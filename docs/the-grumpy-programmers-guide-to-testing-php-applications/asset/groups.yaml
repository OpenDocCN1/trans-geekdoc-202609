  mdcn: "\n## 7. 以示例为导向的测试后开发\n\n看起来一个不错的测试是创建一个场景，我们从数据库中检索一条记录，其中包含一名球员，其未上卡状态设置为当前赛季。然后，我应该检查返回的详细信息是否符合预期。以下是测试的大纲，写成好像一切都已正常工作。我稍后再回来弄清楚依赖关系。\n\
    \n```php\n<?php\nrequire __DIR__ . '/../models/rosters.php';\n\nclass RostersTests\
    \ extends PHPUnit\\Framework\\TestCase\n{\n    /**\n     * @test\n     */\n  \
