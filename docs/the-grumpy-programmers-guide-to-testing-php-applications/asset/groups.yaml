  mdcn: "\n\n## 文档完善的构建系统鼓励持续部署\n\n当我刚开始思考如何实现这一点时，选用的工具是 Jenkins[2]。它是一个基于 Java 的自动化工具，在帮助你方面极其灵活，并且有大量可用的插件。很有可能，如果你想要用\
    \ Jenkins 做某事，已经有人想出了用插件实现的方法。\n\n构建自动化的理念是，将你在部署和测试过程中通常手动完成的步骤自动化。毕竟，计算机非常擅长一遍又一遍地执行你吩咐它们做的事情，而且毫无怨言！与许多事情一样，一旦你自动化了测试的运行方式，就不必再为之操心了。你可以把脑力节省下来，用于在公司聊天中开玩笑或在社交媒体上怼人。\n\
    \n然而，你的选择并不局限于 Jenkins。对于那些不想自己托管 CI 服务器的人来说，一个很好的替代方案是使用 Travis CI[3]、CircleCI[4]\
    \ 或 GitHub Actions[5] 等服务。这些服务允许你复制当有人获取你的代码并想要运行测试时所经历的过程。它们都有各自独特的语法和怪癖，但最终都会殊途同归——一个以\
    \ Git 为中心的系统，可以对拉取请求或合并做出反应，并执行一系列步骤，最终运行你的测试。\n\n对于 OpenCFP[6]，我已开始使用 GitHub\
    \ Actions 作为我的构建自动化工具。查看它的配置文件时，它会为我完成以下所有事情：\n\n- 检出代码\n- 安装我希望测试所针对的精确 PHP 版本\n\
    - 使用 Composer 安装所有依赖\n- 对代码运行代码检查器和样式修复器\n- 运行数据库迁移\n- 构建我的 CSS 和 JS 资源\n- 验证使用\
    \ ORM 的代码的所有映射和模式\n- 运行测试\n\n[2] Jenkins: https://jenkins-ci.org\n[3] Travis CI:\
    \ https://travis-ci.org\n[4] CircleCI: https://circleci.com\n[5] GitHub Actions:\
    \ https://github.com/features/actions\n[6] OpenCFP: https://github.com/opencfp/opencfp\n\
    \n## 12. 元测试\n\n这些一开始都是手动完成的事情，但我希望它们自动化。在理想的环境中，我会希望这类事情在本地完成。该项目确实使用 Composer\
    \ 的 “scripts” 部分来定义一些任务，以完成上述那些确切的步骤。我要再次强调，我希望计算机为我一遍又一遍地重复这些任务。与计算机执行相比，我在其中某一步出错的可能性要高得多。\n\
    \n## 有一些很棒的互补工具\n\n仅仅拥有代码测试是不够的。持续编写这些测试并专注于有效使用测试驱动开发（TDD）确实需要大量的自律。幸运的是，其他人也一直在解决同样的问题，并且有一些我可以推荐的解决方案。\n\
    \n## XDebug\n\n首先，有 XDebug[7]。XDebug 是一个 PHP 扩展，它可以让你做两件对 PHP 开发者有用的事情。第一，当你在重构现有代码或只是想弄明白“为什么这段代码没有按我预期的方式运行？”时，你可以将它用作逐步调试器。有很多关于如何安装\
    \ XDebug 并配置它与你喜欢的编辑器或 IDE 协作的文章。多年来，我一直抗拒使用调试器，而是依赖测试和在代码中打印调试语句。养成新习惯需要很长时间，但在\
    \ PhpStorm 的帮助下，我一直在努力记住我有一个逐步调试器，它可以在断点处向我展示变量的内容。对于任何语言的程序员来说，学习使用调试器都是一项值得精进的技能。\n\
    \n对于 PHP 开发者来说，XDebug 的第二个优点是，它可以与 PHPUnit 结合生成代码覆盖率报告。代码覆盖率是一个指标，许多人用它来跟踪你的代码中有多少被测试执行。代码覆盖率非常高（90%\
    \ 及以上）的代码库往往可靠且没有错误。达到 100% 的代码覆盖率是可能的，但如果你不采用 TDD 来构建项目，就很难做到。\n\n要生成代码覆盖率报告，你需要在从命令行运行测试的命令中添加一些选项，然后就会为你生成报告。最常见的选项是生成基于\
    \ HTML 的报告，你可以在浏览器中加载它，以验证测试覆盖了什么和没覆盖什么。\n\n对于 OpenCFP，我们生成基于文本的覆盖率报告。下面是一个示例：\n\
    \n[7] XDebug: https://xdebug.org\n\n```text\nCode Coverage Report:\n  2019-12-27\
    \ 19:36:57\n\nSummary:\n  Classes: 43.69% (45/103)\n  Methods: 52.15% (206/395)\n\
