    \ = ''): bool\n        {\n            return true;\n        }\n        public\
    \ function makeInactive($player_id): bool\n        {\n            return true;\n\
    \        }\n    };\n\n    $tm = new Transaction($rm);\n    $tm->transactionDate\
    \ = '01/01';\n\n    // Act\n    $response = $tm->generateTradeLogEntry($data,\
    \ $tradePartner);\n\n    // Assert\n    $this->assertEquals($expected, $response);\n\
    }\n```\n\nWhatever path you decide to go, it is good to know you can create a\
    \ double of something that perhaps is a lot of work to duplicate using test doubling\
    \ tools. Think about things that send emails when you do not want emails to be\
    \ sent at all as part of the test. You can create a fake object that uses all\
    \ the same methods but never sends it.\n\nMy preference when it comes to fakes\
    \ is to use anonymous classes in the test cases unless you are 100% sure the fake\
    \ you are creating can be reused by other tests. Remember, the same rules about\
    \ reusing code and trying not to repeat yourself apply to your tests!\n\n### Final\
    \ Thoughts\n\nTests are all about scenarios where you control the state of all\
    \ your dependencies. Sometimes you can use the “real” dependency–other times you\
    \ will need to create a double. You have multiple doubles to choose, depending\
    \ on what you need:\n\n- Dummies if you’re not using type-hinted code and need\
    \ a dependency that you’re not going to be calling any methods on in your test\n\
    - Test stubs if you need a dummy, but your code is type-hinted\n- Spies if you\
    \ need a stub where some methods are going to be called, but you don’t need to\
    \ worry if the method does anything\n- Mocks if you need a dependency with specific\
    \ methods being called and those methods need to return something or perform an\
    \ action required by the test\n\nTest doubles are definitely the number one thing\
    \ testing practitioners argue about—the next being how many assertions should\
    \ be in each test. This chapter should give you the confidence to determine when\
    \ test doubles are appropriate and which ones to choose.\n\n## Chapter 6: Test-Driven\
    \ Development by Example\n\nIn an idealized world of software development, you\
    \ would be writing all the code for your applications using Test-Driven Development\
    \ (TDD), implementing features, and deciding on APIs and interfaces one test at\
    \ a time. The way I use TDD follows this type of workflow:\n\n- Create an empty\
    \ test that fails\n- Write out my testing scenario as pseudocode\n- Turn the pseudocode\
    \ into a PHPUnit test\n- Run the test\n- If it fails, keep writing code until\
    \ the behavior I am testing passes\n\nMy experiences over the years have been\
    \ that a lot of programmers can benefit from both the structure and the discipline\
    \ that TDD forces upon you. I like how focusing on one test at a time keeps my\
    \ mind from wandering and thinking too far ahead. Of course, I am always thinking\
    \ about what I am doing from a high level, but I work very hard to implement the\
    \ simplest solution to make the test pass, knowing I can use the test to verify\
    \ I do not break anything when I go back and refactor the code.\n\nIn this example,\
    \ I’m going to be solving the following problem:\n\n> *Write some code that takes\
    \ any Arabic number and turns it into its Roman numeral equivalent for any number\
    \ up to 100.*\n\nThis is a good problem because it is one that has a known solution\
    \ (easier to write tests for) and requires you to have a good grasp of several\
    \ common programming techniques and structures.\n\n### Tooling\n\nI worked on\
    \ these examples on my late 2016 MacBook Pro laptop, running macOS 10.14.6. I\
    \ use PhpStorm (with Vim bindings enabled because I am a supporter of the One\
    \ True Editor) to write my PHP code. I am using PHP 7.3.6 installed using Homebrew\
    \ and have installed the PHAR version of PHPUnit as per the instructions on the\
    \ PHPUnit website.\n\nThe specifics of what I am using don’t really matter! You\
    \ don’t have to copy what I am doing to write tests. Just make sure you have a\
    \ stable version of PHP installed and PHPUnit available to you.\n\n### Getting\
    \ Started\n\nI’ve created an empty directory to put my code in. I will have my\
    \ code in the src directory and my tests in the tests directory. Due to PHP and\
    \ PHPUnit’s flexibility, you can organize these things whatever way you want as\
    \ long as you handle your paths correctly.\n\nFirst, let’s talk about how to solve\
    \ this problem. Roman numerals consist of creating a string consisting of symbols\
    \ that together represent positive Arabic integer values. You read the result\
    \ from left to right. So what are the base symbols we need to worry about?\n\n\
    - I -> 1\n- V -> 5\n- X -> 10\n"
  mdcn: "\n\n## 5. 测试替身\n\n```php\n// Assert\n$this->assertEquals($expected, $response);\n\
    }\n}\n```\n\n### 伪造对象\n\n伪造对象是测试中一种经常未被充分利用的工具。你可以不使用测试框架工具创建的模拟（mock），而是创建自己的对象，让它完成你期望从依赖中获得的行为。以我们刚才编写的测试为例，如果我决定使用伪造对象而不是\
    \ Prophecy 所提供的功能，那会是什么样子呢？\n\n有几种方法可以处理这个问题。你可以在测试之外创建一个独立对象，扩展我们正在为其创建替身的方法。可能看起来像这样：\n\
    \n```php\n<?php\ndeclare(strict_types=1);\n\nclass FakeRosterModel\n{\n    public\
    \ function getById($id): array\n    {\n        $responses = [\n            0 =>\
    \ ['ibl_team' => 'TEST', 'display_name' => 'Moe'],\n            1 => ['ibl_team'\
    \ => 'TEST', 'display_name' => 'Larry'],\n            2 => ['ibl_team' => 'TEST',\
    \ 'display_name' => 'Curly'],\n        ];\n\n        return $responses[$id];\n\
    \    }\n\n    public function updatePlayerTeam(\n        $iblTeam, $playerId,\
    \ $comments = \"\"): bool\n    {\n        return true;\n    }\n\n    public function\
    \ makeInactive($player_id): bool\n    {\n        return true;\n    }\n}\n```\n\
    \n最大的问题是 Transaction 对象在构造函数中期望一个类型化的 Roster 对象。没有简单的方法解决这个问题。我可以让这个对象继承 Roster\
    \ 并传入一个 QueryFactory，但不对它做任何处理。如果我真的想对 Roster 对象使用伪造对象而不是 Prophecy，这似乎是阻力最小的路径。所以我会这么做。这个伪造对象现在看起来像这样：\n\
    \n```php\n<?php\ndeclare(strict_types=1);\n\nrequire_once __DIR__ . '/../models/rosters.php';\n\
    \nclass FakeRosterModel extends Roster\n{\n    public function __construct($db)\n\
    \    {\n        $this->db = $db;\n    }\n\n    public function getById($id): array\n\
    \    {\n        $responses = [\n            1 => ['ibl_team' => 'TEST', 'display_name'\
