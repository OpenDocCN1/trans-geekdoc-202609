    \ new spec file into that directory.\n\n### Make a Request to the API\n\nBefore\
    \ I go any further, let me create the skeleton of my first validation test.\n\n\
    ```php\n/**\n * @test\n */\npublic function it_validates_getPetById(): void\n\
    {\n    $this->assertTrue(false);\n}\n```\n\nNow, I build the request I want to\
    \ make to the API.\n\n```php\npublic function it_validates_getPetById(): void\n\
    {\n    $uri = 'https://petstore.swagger.io/v2/pet/1';\n    $responseData = json_decode(\n\
    \        file_get_contents($uri),\n        true,\n        512,\n        JSON_THROW_ON_ERROR\n\
    \    );\n\n    // other code below...\n}\n```\n\nFor validating those responses,\
    \ I took some OpenAPI.Tools advice and chose to use OpenAPI-Validator, which you\
    \ can install using Composer (as a development dependency instead of placing it\
    \ in production, which is always a good idea).\n\n```shell\ncomposer req --dev\
    \ mmal/openapi-validator\n```\n\nNow, I want to share something with you. Different\
    \ OpenAPI validation tools use different techniques for deciding if your spec\
    \ is valid. Speccy said my spec was OpenAPI compliant once I fixed the problems\
    \ it reported. When I used OpenAPI-validator, well, it expressed its own ideas\
    \ on what a valid API is. When I added the code that validates the spec I have,\
    \ it reported many errors I corrected until everything seemed fine.\n\nAs annoying\
    \ as it was to iterate through the errors, it drives home the point that the job\
    \ of the specification is to tell you whether or not you are doing things correctly.\
    \ Much like unit tests, a good and thorough specification means you do not waste\
    \ time debugging errors that are easily caught.\n\n### API Schema Validation\n\
    \nSo, following the documentation, I added in the code that validates the specification\
    \ and then makes sure the response I got back matches our expectations.\n\n```php\n\
    // Added these dependencies that we needed at the top of the file\nuse Mmal\\\
    OpenapiValidator\\Validator;\nuse Symfony\\Component\\Yaml\\Yaml;\n\npublic function\
    \ it_validates_getPetById(): void\n{\n    $uri = 'https://petstore.swagger.io/v2/pet/1';\n\
    \    $responseData = json_decode(\n        file_get_contents($uri),\n        true,\n\
    \        512,\n        JSON_THROW_ON_ERROR\n    );\n    $validator = new Validator(Yaml::parse(\n\
    \        file_get_contents(__DIR__ . '/specs/api.yaml')\n    ));\n    $result\
    \ = $validator->validateBasedOnRequest(\n        '/pet/{petId}',\n        'GET',\n\
    \        200,\n        $responseData\n    );\n    $this->assertFalse($result->hasErrors());\n\
    }\n```\n\nOkay, I will explain this whole test from top to bottom.\n\nFirst, I\
    \ make my call to the API, getting back a JSON response that I decode and store\
    \ in $responseData. Next, I use the Validator object in combination with a YAML\
    \ parser to take a look at my spec file and validate it.\n\nThis next step requires\
    \ some more explanation. When you use the validateBasedOnRequest() method, you\
    \ need to provide the following things:\n\n- The path as outlined in the OpenAPI\
    \ spec for the call you are testing\n- Which HTTP method you used for the request\n\
    - The HTTP status code you are expecting\n- The JSON-decoded data you are expecting\
    \ to see\n\nWith that information, we round out the test by making an assertion\
    \ that we have no errors when comparing the contents of the response to our specification.\
    \ Does the test pass?\n\n```text\n/usr/local/bin/php -dxdebug.remote_mode=jit\
    \ /usr/local/bin/phpunit \\\n--no-configuration --filter \"/(::it_validates_getPetById(\
    \ .* )?$/\" \\\nApiResponseTest /Users/chartjes/grumpy-guide/test/api_response_test.php\
    \ \\\n--teamcity\nPHPUnit 8.3.4 by Sebastian Bergmann and contributors.\n\nTime:\
    \ 612 ms, Memory: 12.00 MB\n\nOK (1 test, 1 assertion)\n```\n\nHow about a test\
    \ that proves the validation works? I'll create an API response with an incorrect\
    \ value in it, and the test should then report errors with validation.\n\n```php\n\
    /**\n * @test\n */\npublic function it_catches_invalid_responses(): void\n{\n\
    \    // Arrange\n    $invalidResponse = '\n    {\n        \"id\": \"0\",\n   \
    \     \"category\": {\n            \"id\": 0,\n            \"name\": \"string\"\
    \n        },\n        \"name\": \"doggie\",\n        \"photoUrls\": [\n      \
    \      \"string\"\n        ],\n        \"tags\": [\n            {\n          \
    \      \"id\": 0,\n                \"name\": \"string\"\n            }\n     \
    \   ],\n        \"status\": \"available\"\n    }';\n\n    $validator = new Validator(Yaml::parse(\n\
    \        file_get_contents(__DIR__ . '/specs/api.yaml')\n    ));\n\n    // Act\n\
    \    $result = $validator->validateBasedOnRequest(\n        '/pet/{petId}',\n\
    \        'GET',\n        200,\n        json_decode($invalidResponse, true, 512,\
    \ JSON_THROW_ON_ERROR),\n    );\n\n    // Assert\n    $this->assertTrue($result->hasErrors());\n\
    }\n```\n\nThe test passes.\n\n```text\n/usr/local/bin/php -dxdebug.remote_mode=jit\
    \ /usr/local/bin/phpunit \\\n --no-configuration --filter \"/(::it_catches_invalid_responses)(\
    \ .*)?$/\" \\\n ApiResponseTest /Users/chartjes/grumpy-guide/test/api_response_test.php\
    \ \\\n --teamcity\nPHPUnit 8.3.4 by Sebastian Bergmann and contributors.\n\nTime:\
    \ 278 ms, Memory: 12.00 MB\n\nOK (1 test, 1 assertion)\n\nProcess finished with\
    \ exit code 0\n```\n\nValidation tests are great for figuring out if your API\
    \ has changed without anyone realizing it—that uncertainty can lead to bad experiences\
    \ and weird errors appearing in production. To be perfectly clear, there is extra\
    \ work involved because someone will have to create and maintain the OpenAPI specifications.\
    \ You can use tools like Stoplight Studio[^4] to create the specification at the\
    \ same time you are creating your API.\n\n## Chapter 10 Data Providers\n\n###\
    \ Why You Should Use Data Providers\n\nOne of your main goals should always be\
    \ writing the bare minimum amount of code in order to solve a particular problem.\
    \ This is no different when it comes to tests, which are really nothing more than\
    \ code.\n\nOne of the earliest lessons I learned when I started writing comprehensive\
    \ test suites was to always look for duplication in your tests. Here’s an example\
    \ of a situation where this can happen.\n\nYou might be familiar with the FizzBuzz\
    \ problem[^5], if only because it is sometimes presented as a problem to be solved\
    \ as part of an interview. It is a good problem because it touches on a lot of\
    \ really elementary basics of programming—you need to understand loops, collections,\
    \ and conditional statements.\n\nWhen you write tests for FizzBuzz, what you want\
    \ to do is pass it a set of values and verify they are FizzBuzzed correctly. This\
    \ could result in you having multiple tests that are the same, except for the\
    \ values you are testing with. Data providers give you a way to simplify that\
    \ process.\n\nA data provider is a way to create multiple sets of testing data\
    \ which can be passed in as parameters to your test method. You create a method\
    \ that is available to the class your tests are in that returns an array of values\
    \ matching the parameters you are passing into your test.\n\nIt sounds more complicated\
    \ than it really is; let’s look at an example.\n\n### Look at All Those Tests\n\
    \nIf you didn’t know about data providers, what might your FizzBuzz tests look\
    \ like?\n\n```php\n<?php\nclass FizzBuzzTest extends PHPUnit\\Framework\\TestCase\n\
    {\n    public function setUp()\n    {\n        $this->fb = new FizzBuzz();\n \
    \   }\n\n    public function testGetFizz()\n    {\n        $expected = 'Fizz';\n\
    \        $input = 3;\n        $response = $this->fb->check($input);\n        $this->assertEquals($expected,\
    \ $response);\n    }\n}\n```\n\n[^1]: OpenAPI.Tools: https://openapi.tools\n[^2]:\
    \ pyswagger: https://github.com/mission-liao/pyswagger\n[^3]: Speccy: https://github.com/wework/speccy\n\
    [^4]: Stoplight Studio: https://stoplight.io\n[^5]: FizzBuzz problem: <http://en.wikipedia.org/wiki/FizzBuzz>\n"
  mdcn: "\n\n## 9. 测试 API\n\n这里要强调的一点是，这类测试并不关心响应的实际内容。我不一定关注具体的值，比如 ID 或时间戳。我想要做的是确保响应中的任何数据都符合字段名称和数据类型的预期。\n\
    \n从宏观层面来看，这些测试的目标如下：\n\n-   获取被测 API 的 OpenAPI 模式\n-   向 API 发出请求\n-   根据模式验证响应\n\
    \n在下面的所有示例中，我使用 OpenAPI 3.x 作为 API 文档的标准。Swagger 是旧式的 API 文档方式，所以我强烈建议大家转向（或从一开始就使用）OpenAPI\
    \ 3.x。关于使用 OpenAPI 及相关工具的更多细节可以在 OpenAPI.Tools[^1] 找到，而关于使用 OpenAPI 规范构建 API 的优秀建议可以在\
    \ https://apisyouwonthate.com 找到。非常感谢 Phil Sturgeon 和 Matthew Trask 为我指出了许多非常有用的\
    \ API 资源。\n\n### 获取被测 API 的 OpenAPI 模式\n\n在这些示例中，我将使用一个带有 OpenAPI 模式的公开 API。你可以在\
    \ https://petstore.swagger.io 查看这个 API。\n\n下一步是将其从 Swagger 转换为 OpenAPI。OpenAPI.Tools\
    \ 有一个它们推荐的工具列表。同样，选择一个适合你的。就我而言（因为我用 Python 做了很多测试工作），我选择了 pyswagger[^2]。下载 Petstore\
    \ 的 YAML 规范后，我进行了转换，最终得到一个符合 OpenAPI 3.x 的 YAML 文件。\n\n但我还没有完成——我安装了 Speccy[^3]，并用它来验证这个新文档，修复了我发现的任何错误。然后，我在测试目录中创建了一个名为\
    \ specs 的目录，并将我的新规范文件复制到该目录中。\n\n### 向 API 发出请求\n\n在进一步操作之前，让我先创建第一个验证测试的骨架。\n\
    \n```php\n/**\n * @test\n */\npublic function it_validates_getPetById(): void\n\
    {\n    $this->assertTrue(false);\n}\n```\n\n现在，我构建要向 API 发出的请求。\n\n```php\npublic\
    \ function it_validates_getPetById(): void\n{\n    $uri = 'https://petstore.swagger.io/v2/pet/1';\n\
    \    $responseData = json_decode(\n        file_get_contents($uri),\n        true,\n\
    \        512,\n        JSON_THROW_ON_ERROR\n    );\n\n    // other code below...\n\
    }\n```\n\n为了验证这些响应，我采纳了一些 OpenAPI.Tools 的建议，选择使用 OpenAPI-Validator，你可以使用 Composer\
    \ 安装它（作为开发依赖，而不是放在生产环境中，这始终是一个好主意）。\n\n```shell\ncomposer req --dev mmal/openapi-validator\n\
    ```\n\n现在，我想与你分享一些东西。不同的 OpenAPI 验证工具使用不同的技术来判断你的规范是否有效。在我修复了 Speccy 报告的问题后，Speccy\
    \ 说我的规范符合 OpenAPI。而当我使用 OpenAPI-validator 时，嗯，它对什么是有效的 API 有自己的看法。当我添加验证规范的代码时，它报告了许多错误，我一一修正，直到一切看起来正常。\n\
    \n虽然遍历这些错误令人烦恼，但这恰恰说明了一个要点：规范的工作就是告诉你是否在做正确的事情。与单元测试非常相似，一份好的、全面的规范意味着你不会浪费时间调试那些容易被捕获的错误。\n\
    \n### API 模式验证\n\n因此，按照文档说明，我添加了验证规范并确保返回的响应符合我们期望的代码。\n\n```php\n// Added these\
    \ dependencies that we needed at the top of the file\nuse Mmal\\OpenapiValidator\\\
    Validator;\nuse Symfony\\Component\\Yaml\\Yaml;\n\npublic function it_validates_getPetById():\
    \ void\n{\n    $uri = 'https://petstore.swagger.io/v2/pet/1';\n    $responseData\
    \ = json_decode(\n        file_get_contents($uri),\n        true,\n        512,\n\
