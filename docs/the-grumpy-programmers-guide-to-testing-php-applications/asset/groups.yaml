    # 5. Test Double


    Whatever path you decide to go, it is good to know you can create a double of
    something that perhaps is a lot of work to duplicate using test doubling tools.
    Think about things that send emails when you do not want emails to be sent at
    all as part of the test. You can create a fake object that uses all the same methods
    but never sends it.


    My preference when it comes to fakes is to use anonymous classes in the test cases
    unless you are 100% sure the fake you are creating can be reused by other tests.
    Remember, the same rules about reusing code and trying not to repeat yourself
    apply to your tests!


    # Final Thoughts


    Tests are all about scenarios where you control the state of all your dependencies.
    Sometimes you can use the “real” dependency–other times you will need to create
    a double. You have multiple doubles to choose, depending on what you need:


    +   - Dummies if you’re not using type-hinted code and need a dependency that
    you’re not going to be calling any methods on in your test

    +   - Test stubs if you need a dummy, but your code is type-hinted

    +   - Spies if you need a stub where some methods are going to be called, but
    you don’t need to worry if the method does anything

    +   - Mocks if you need a dependency with specific methods being called and those
    methods need to return something or perform an action required by the test


    Tests doubles are definitely the number one thing testing practitioners argue
    about—the next being how many assertions should be in each test. This chapter
    should give you the confidence to determine when test doubles are appropriate
    and which ones to choose.'
