    # Chapter 6


    # Test-Driven Development by Example


    In an idealized world of software development, you would be writing all the code
    for your applications using Test-Driven Development (TDD), implementing features,
    and deciding on APIs and interfaces one test at a time. The way I use TDD follows
    this type of workflow:


    +   - Create an empty test that fails

    +   - Write out my testing scenario as pseudocode

    +   - Turn the pseudocode into a PHPUnit test

    +   - Run the test

    +   - If it fails, keep writing code until the behavior I am testing passes'
  - '[PAGE 48]


    # 6. Test-Driven Development by Example


    My experiences over the years have been that a lot of programmers can benefit
    from both the structure and the discipline that TDD forces upon you. I like how
    focusing on one test at a time keeps my mind from wandering and thinking too far
    ahead. Of course, I am always thinking about what I am doing from a high level,
    but I work very hard to implement the simplest solution to make the test pass,
    knowing I can use the test to verify I do not break anything when I go back and
    refactor the code.


    In this example, I’m going to be solving the following problem:


    > > *Write some code that takes any Arabic number and turns it into its Roman
    numeral equivalent for any number up to 100.*


    This is a good problem because it is one that has a known solution (easier to
    write tests for) and requires you to have a good grasp of several common programming
    techniques and structures.


    # Tooling


    I worked on these examples on my late 2016 MacBook Pro laptop, running macOS 10.14.6.
    I use PhpStorm (with Vim bindings enabled because I am a supporter of the One
    True Editor) to write my PHP code. I am using PHP 7.3.6 installed using Homebrew
    and have installed the PHAR version of PHPUnit as per the instructions on the
    PHPUnit website.


    The specifics of what I am using don’t really matter! You don’t have to copy what
    I am doing to write tests. Just make sure you have a stable version of PHP installed
    and PHPUnit available to you.


    # Getting Started


    I’ve created an empty directory to put my code in. I will have my code in the
    src directory and my tests in the tests directory. Due to PHP and PHPUnit’s flexibility,
    you can organize these things whatever way you want as long as you handle your
    paths correctly.


    First, let’s talk about how to solve this problem. Roman numerals consist of creating
    a string consisting of symbols that together represent positive Arabic integer
    values. You read the result from left to right. So what are the base symbols we
    need to worry about?


    +   - I -> 1

    +   - V -> 5

    +   - X -> 10'
