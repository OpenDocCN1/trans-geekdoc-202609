  - "[PAGE 76]\n\n# ## 8. Refactoring Helpers\n\nFirst, I need to give you some context.\
    \ The OSS project I have done the most work on is OpenCFP, a self-hosted PHP application\
    \ conference organizers can use to collect and rate conference talk proposals.\
    \ It has a lot of tests. Not as many as I want it to, but I am just one person\
    \ with a finite amount of time to spend on things. So are my contributors.\n\n\
    So I feel the need to be both pragmatic and disciplined at the same time, if that\
    \ makes sense. We marked a helper method for future removal by adding an annotation\
    \ to the DocBlock for that method. Here’s the one I’m going to refactor:\n\n```\n\
    ```php\n/**\n * @deprecated\n *\n * @param array $properties\n *\n * @return Model\\\
    \\User|\\\\PHPUnit_Framework_MockObject_MockObject\n */\nprivate function createUserMock(array\
    \ $properties = []): Model\\\\User\n{\n    $user = $this->createMock(Model\\\\\
    User::class);\n\n    $user\n        ->expects($this->any())\n        ->method('__get')\n\
    \        ->willReturnCallback(function (string $property) use ($properties) {\n\
    \            if (\\\\array_key_exists($property, $properties)) {\n           \
    \     return $properties[$property];\n            }\n        });\n\n    return\
    \ $user;\n}\n```\n```\n\nBy the end of the refactor, this helper should be doing\
    \ the same thing: Create a dependency that can be used by the existing tests.\
    \ So, where do we start?\n\nThe test suite for OpenCFP uses both Mockery and Prophecy,\
    \ two libraries for creating test doubles. If I had really strong feelings, I\
    \ would probably choose one of these tools and then mark helper methods using\
    \ the library I did not choose as deprecated, or add comments in the tests to\
    \ indicate it needs to be modified.\n\nI don’t think there is one that is “right”\
    \ for the project. I started off using Mockery and then tried out some tests using\
    \ Prophecy, and I really can’t make up my mind! I do need something to help me\
    \ make that decision, though."
