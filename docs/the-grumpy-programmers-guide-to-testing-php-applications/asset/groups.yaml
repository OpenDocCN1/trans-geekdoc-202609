    \ with exit code 0\n```\n```\n\n太棒了！测试套件仍然通过，并且我已修复了已弃用方法。\n\n## 9. 测试 API\n\n\
    我所做的大部分测试工作都集中在测试应用代码上。这对于帮助设计可测试代码和防止未来回归非常有效。但除了应用代码之外，还有很多其他东西需要测试。\n\n###\
