    like virtual machines and containers. These tools can be used to replicate the
    environment your code is likely to run in on your own computer. I upgraded from
    a mid-2012 MacBook Air to a late-2016 MacBook Pro in early 2017 (yes, with the
    cool little touch bar) because I found myself running out of resources all the
    time due to the demands of the modern development environments I find myself needing
    to use.


    [1] front controller: https://en.wikipedia.org/wiki/Front_controller

    [2] Arrange-Act-Assert: http://wiki.c2.com/?ArrangeActAssert


    ## 16. Nobody Is Running the Tests!


    So what happens when there is a shared development environment in place:


    - All the developers on the project do their work and maybe run individual tests

    - At some point, they need to merge their work and run the entire test suite

    - The shared environment combusts because of load

    - The testing suite randomly crashes due to race conditions on shared resources
    like databases


    Yes, I have been there. You end up with a terrible loop of behavior where people
    don’t run the tests until the last minute possible because the shared environment
    crashes when everyone is trying to run their tests at the last minute. This continues
    pretty much forever until enough people quit that the load on the shared environment
    doesn’t matter, or someone spends a bunch of time learning Vagrant[^3] or Docker[^4]
    and forces everyone to switch.


    [^3]: Vagrant: https://vagrantup.com

    [^4]: Docker: https://docker.com


    ## Chapter 17


    ## “You’re Not Getting Paid to Test!”


    Many times I have heard from people who work at agencies or as freelancers that
    they get a lot of pushback when the topic of testing comes up. You tell me, “I
    am having trouble convincing the client the value of tests,” and I totally understand.
    I’m often told, “Chris, clients see an item on the invoice about tests, and they
    start complaining!”


    ## 17. “YOU’RE NOT GETTING PAID TO TEST!”


    What can you do about this? I want to share with you some strategies I think can
    help.


    ### Testing Is Part of the Job


    We’re past the point where you can reasonably claim the person who writes code
    has no responsibility to test it. Even if you are not using automated tests, you
    are still testing what you’ve done! Are you adding “testing in the browser” as
    a line item in the invoice you submit? You will have to forgive my ignorance surrounding
    current client invoicing practices, but it strikes me as very unlikely.


    I’m not so militant that I am going to tell you, you’re not a professional if
    you don’t write tests because that ship sailed a very, very long time ago. The
    bottom line is you need to have some type of repeatable test for the work you’re
    doing for others.


    If you are in the position to use a web application framework not invented in-house,
    then you are likely using things that have automated tests you can run. But, you
    aren’t “allowed” to write tests for the other stuff you’re doing?


    So my advice is to write the tests and include them as part of the work you are
    doing. If questioned about it, there isn’t any other answer to give than, “Tests
    are part of what I am delivering, so it will not break after I am no longer involved.”
    I realize you will encounter some very aggressive clients who will proclaim you
    are expected to deliver bug-free products to them. I cannot think of any way to
    reduce the number of bugs that appear, other than to make sure you have tests
    to verify everything works as expected.


    ### Lost Opportunity Costs


    This is a topic that has become a personal favorite of mine because it is so relatable
    to non-technical types. It focuses on pointing out that bugs making it into production
    will actually cost you money. Here’s how it works.


    A developer is working on a new feature. If they were to find a bug, now is the
    cheapest time to fix it—and having automated tests to verify things aren’t broken
    is a good way to do this. But they don’t have tests, so they’re the best they
    can. Despite their best efforts, they create a bug.


    The next step is getting a coworker to check their code via a review. If the reviewer
    finds a bug, then our valiant developer has to go back and fix it. This costs
    time and money. Once they think they’ve fixed the problem, then it has to go back
    to the reviewer. In this case, the reviewer gives them the thumbs up, and the
    code can proceed to QA.


    ### Lost Opportunity Costs


    But what if there were some tests? I''m willing to bet the introduced bug would
    have a very high chance of getting caught before the code gets to the reviewer.
    Chances are the review goes more smoothly and costs less in time and resources.


    Now, if a bug is found during manual testing by QA, well, the cost to fix it is
    now significantly higher. Consider that this is now the flow:


    - Developer implements feature, no bugs found

    - Code is reviewed, no bugs found

    - QA finds bug

    - Developer goes back, hopefully, fixes the bug

    - Code is reviewed, no bugs found

    - QA does not find a bug


    That''s three extra steps, and those steps are not free in terms (again, I can''t
    stress this enough) of time and/or money.


    Let''s say the code makes it all the way into production, and there''s a bug found
    by the customer. The cost of fixing this could be cheap:


    - Developer implements feature, no bugs found

    - Code is reviewed, no bugs found

    - QA does not find bug

    - Customer finds the bug

    - Developer goes back, hopefully, fixes the bug

    - Code is reviewed, no bugs found

    - QA does not find a bug

    - Customer does not find a bug


    That was eight steps in total, but sometimes there are bugs that are really expensive.
    They could cost you ten times what the developer''s time costs. It might even
    ruin your company. I''m fortunate that only once in my career did I release code
    into production with a bug so bad the whole application got taken down. It was
    not a pleasant experience.


    So, the lack of tests is not only causing you to spend more money to fix bugs
    as they show up in more expensive parts of the process, having to go back and
    fix those bugs is actually causing you to miss out on other work.

