  md: "\n## 10. Data Providers\n\n```php\n17. public function testGetBuzz()\n18. {\n\
    19.     $expected = 'Buzz';\n20.     $input = 5;\n21.     $response = $this->fb->check($input);\n\
    22.     $this->assertEquals($expected, $response);\n23. }\n25. public function\
    \ testGetFizzBuzz()\n26. {\n27.     $expected = 'FizzBuzz';\n28.     $input =\
    \ 15;\n29.     $response = $this->fb->check($input);\n30.     $this->assertEquals($expected,\
    \ $response);\n31. }\n33. function testPassThru()\n34. {\n35.     $expected =\
    \ '1';\n36.     $input = 1;\n37.     $response = $this->fb->check($input);\n38.\
    \     $this->assertEquals($expected, $response);\n39. }\n40. }\n```\n\nI'm sure\
    \ you can see the pattern:\n\n- Multiple input values\n- Tests that are extremely\
    \ similar in setup and execution\n- Same assertion being used over and over\n\n\
    ### Creating Data Providers\n\nA data provider is another method inside your test\
    \ class that returns an array of results, with each result set being an array\
    \ itself. Through some magic internal work, PHPUnit converts the returned result\
    \ set into parameters your test method signature needs to accept.\n\n```php\n\
    public function fizzBuzzProvider()\n{\n    return [\n        [1, '1'],\n     \
    \   [3, 'Fizz'],\n        [5, 'Buzz'],\n        [15, 'FizzBuzz']\n    ];\n}\n\
    ```\n\nThe function name for the provider doesn’t matter, but I prefer to give\
    \ them a readable-as-English name as you might be stumped when a test fails, and\
    \ PHPUnit tells you about a data provider called ‘ex1ch2’, or something else equally\
    \ hard to instantly understand its purpose.\n\nTo use the data provider, we have\
    \ to add an annotation to the DocBlock preceding our test, so PHPUnit knows to\
    \ use it. Give it the name of the data provider method.\n\n```php\n/**\n * Test\
    \ for our FizzBuzz object\n *\n * @dataProvider fizzBuzzProvider\n */\npublic\
    \ function testFizzBuzz($input, $expected)\n{\n    $response = $this->fb->check($input);\n\
    \    $this->assertEquals($expected, $response);\n}\n```\n\nNow we have just one\
    \ test (less code to maintain) and can add scenarios to our heart’s content via\
    \ the data provider (even better). We have also learned the skill of applying\
    \ some critical analysis to the testing code we are writing to ensure we are only\
    \ writing the tests we actually need.\n\nWhen using a data provider, PHPUnit will\
    \ run the test method each time for every set of data being passed in by the provider.\
    \ If the test fails, it will indicate which index in the associative array was\
    \ being used for that test run.\n\n### More Complex Examples\n\nDon’t feel like\
    \ you can only have really simple data providers. All you need to do is return\
    \ an array of arrays, with each result set matching the parameters your testing\
    \ method is expecting. Here’s a more complex example:\n\n```php\npublic function\
    \ complexProvider()\n{\n    // Read in some data from a CSV file\n    $fp = fopen(\"\
    ./fixtures/data.csv\");\n    $response = [];\n\n    while ($data = fgetcsv($fp,\
    \ 1000, \",\")) {\n        $response[] = array($data[0], $data[1], $data[2]);\n\
    \    }\n\n    fclose($fp);\n\n    return $response;\n}\n```\n\nDon't think you\
    \ need to limit yourself in what your data providers are allowed to do. The goal\
    \ is to create useful data sets for testing purposes.\n\n### Data Provider Tricks\n\
    \nSince data providers return associative arrays, you can assign them a more descriptive\
    \ key to help with debugging. For example, I could refactor the data provider\
    \ for my FizzBuzz test:\n\n```php\nreturn [\n    'one' => [1, '1'],\n    'fizz'\
    \ => [3, 'Fizz'],\n    'buzz' => [5, 'Buzz'],\n    'fizzbuzz' => [15, 'FizzBuzz']\n\
    ];\n```\n\nAlso, data providers don't have to be methods inside the same class.\
    \ You can use methods in other classes, you just have to set their visibility\
    \ to public. You can use namespaces as well. Here are two examples that would\
    \ go into the DocBlock for any test that wants to use a provider in another class:\n\
    \n- `@dataProvider Foo::dataProvider`\n- `@dataProvider Grumpy\\Helpers\\Foo::dataProvider`\n\
    \nThis allows you to create helper classes that are just data providers and cut\
    \ down on the amount of duplicated code you have in your tests themselves.\n\n\
    ### Final Thoughts\n\nThe role of a data provider is to reduce duplication of\
    \ code in your tests by providing you with a way to have a test use multiple sets\
    \ of data for inputs and/or expected results. Just like any code, if you realize\
    \ you are repeating yourself, I suggest taking a look at the test and determine\
    \ if a data provider is a good fit.\n\n## Chapter 11: Wrappers\n\n### Wrappers\
