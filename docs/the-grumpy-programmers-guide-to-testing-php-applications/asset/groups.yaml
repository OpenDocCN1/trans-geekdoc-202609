    # 9. TESTING APIs


    The important point to make here is these sorts of tests are not about the actual
    content of the response. I''m not necessarily concerned with specific values,
    like IDs or timestamps. What I''m trying to accomplish is to make sure whatever
    data is in the response conforms to expectations of field names and data types.


    From a high level, here is what the tests are trying to accomplish:


    +   - Get the OpenAPI schema for the API you are testing

    +   - Make a request to the API

    +   - Validate that response against your schema


    For all the examples below, I am using OpenAPI 3.x as the standard for documenting
    your API. Swagger is the old way of documenting your API, so I highly encourage
    folks to move to (or use from the beginning) OpenAPI 3.x. More details on using
    OpenAPI and some associated tools can be found at OpenAPI.Tools[2] and some excellent
    advice on building APIs with OpenAPI specifications can be found at https://apisyouwonthate.com.
    Many thanks to Phil Sturgeon and Matthew Trask for pointing me to some very helpful
    resources for APIs.


    # Get the Open API Schema for the API You Are Testing


    For these examples, I am going to use a publicly available API with an OpenAPI
    schema. You can see this API at https://petstore.swagger.io.


    The next step is to convert it from Swagger to OpenAPI. OpenAPI.Tools has a list
    of tools they recommend. Again, pick one that resonates with you. In my case (because
    I do a lot of work testing things with Python), I went with pyswagger[3]. After
    downloading the YAML spec for Petstore, I converted it and ended up with a YAML
    file that is OpenAPI 3.x compliant.


    But I wasn’t done yet–I installed Speccy[4] and used it to validate this new document,
    fixing any errors I found. I, then, created a directory in my test directory called
    specs and copied my new spec file into that directory.


    # Make a Request to the API


    Before I go any further, let me create the skeleton of my first validation test.


    [2] OpenAPI.Tools: https://openapi.tools

    [3] pyswagger: https://github.com/mission-liao/pyswagger

    [4] Speccy: https://github.com/wework/speccy'
  - "[PAGE 85]\n\n# API Schema Validation\n\n```\n```php\n/**\n * @test\n */\npublic\
    \ function it_validates_getPetById(): void\n{\n    $this->assertTrue(false);\n\
    }\n```\n```\n\nNow, I build the request I want to make to the API.\n\n```\n```php\n\
    public function it_validates_getPetById(): void\n{\n    $uri = 'https://petstore.swagger.io/v2/pet/1';\n\
    \    $responseData = json_decode(\n        file_get_contents($uri),\n        true,\n\
    \        512,\n        JSON_THROW_ON_ERROR\n    );\n\n    // other code below...\n\
    }\n```\n```\n\nFor validating those responses, I took some OpenAPI.Tools advice\
    \ and chose to use OpenAPI-Validator, which you can install using Composer (as\
    \ a development dependency instead of placing it in production, which is always\
    \ a good idea).\n\n```\n```shell\ncomposer req --dev mmal/openapi-validator\n\
    ```\n```\n\nNow, I want to share something with you. Different OpenAPI validation\
    \ tools use different techniques for deciding if your spec is valid. Speccy said\
    \ my spec was OpenAPI compliant once I fixed the problems it reported. When I\
    \ used OpenAPI-validator, well, it expressed its own ideas on what a valid API\
    \ is. When I added the code that validates the spec I have, it reported many errors\
    \ I corrected until everything seemed fine.\n\nAs annoying as it was to iterate\
    \ through the errors, it drives home the point that the job of the specification\
    \ to tell you whether or not you are doing things correctly. Much like unit tests,\
    \ a good and thorough specification means you do not waste time debugging errors\
    \ that are easily caught.\n\nSo, following the documentation, I added in the code\
    \ that validates the specification and then makes sure the response I got back\
    \ matches our expectations."
  - "[PAGE 86]\n\n# 9. Testing APIs\n\n```\n```php\n// Added these dependencies that\
    \ we needed at the top of the file\nuse Mmal\\OpenapiValidator\\Validator;\nuse\
    \ Symfony\\Component\\Yaml\\Yaml;\n\npublic function it_validates_getPetById():\
    \ void\n{\n    $uri = 'https://petstore.swagger.io/v2/pet/1';\n    $responseData\
    \ = json_decode(\n        file_get_contents($uri),\n        true,\n        512,\n\
    \        JSON_THROW_ON_ERROR\n    );\n    $validator = new Validator(Yaml::parse(\n\
