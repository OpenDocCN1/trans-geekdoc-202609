    \ Test-Driven Development. Guide them and help them understand that TDD and testing\
    \ practices will soon feel as natural as other programming techniques they didn’t\
    \ previously understand but now embrace.\n\n### Lack of Good Docs\n\n> “Other\
    \ reasons are much more interesting. One is the perceived lack of good docs. For\
    \ instance, most documentation about unit testing uses a simple example, which\
    \ is fine for understanding the concept, but it lacks a real-world application.\
    \ Some developers actually want to use TDD, but they fear the project would be\
    \ too hard to test because there isn’t very much good documentation about testing\
    \ a complex system.”\n\nI have struggled with trying to find a good approach to\
    \ this one over the years. It’s true—most examples of how to write unit tests\
    \ are extremely simple. Providing people with more complicated answers can be\
    \ hard because everyone’s codebases are a little different and present unique\
    \ challenges. For example, my mentioned-too-many-times project OpenCFP has the\
    \ constraint of needing to always account for a global application object with\
    \ parts which need to be overridden and redefined just to test parts of the application.\
    \ It’s non-intuitive to know that unless you understand your tests are meant to\
    \ be doing a lot of things similar to what your application should be doing.\n\
    \nThis is getting to the heart of the biggest problem of teaching people about\
    \ testing. It’s almost impossible to give people generic advice about what they\
    \ should do! Sure, there are some guiding principles we can look at like Arrange-Act-Assert[^1]\
    \ or encouraging people not to abuse test doubles, but it’s not enough.\n\nIt’s\
    \ ironic that despite the ridiculous amount of information available at our fingertips\
    \ via the internet, the best way to teach people about unit testing is actually\
    \ to sit down next to someone and guide them through the task.\n\n### Convincing\
    \ People About Time\n\n> “My team is considering integrating unit tests into our\
    \ development process. Until now, we have only experimented in a rather small\
    \ prototype setting. In theory, I totally agree with you, but in practice, I haven’t\
    \ seen the benefits yet. Writing these tests definitely costs us time. I wonder\
    \ if this really pays off. At least it feels slow because you end up spending\
    \ half your time writing tests. Do you really get this time back?”\n\nIt’s an\
    \ entirely fair question: Am I going to see a benefit from the time I am spending\
    \ writing tests? I’m pretty sure you know what my opinion on this is, but let’s\
    \ dig a bit deeper into the issue.\n\nThis person correctly identified that writing\
    \ tests takes time. After all, you are spending time thinking about how to test\
    \ something. Then you have to spend time writing the test and iterating over the\
    \ test while you write them and making sure you have covered all your branches\
    \ and conditions and where did all the time go?!\n\nThat time went to you being\
    \ a little more deliberate and thoughtful about the problem you were trying to\
    \ solve! Those tests you spent time writing are there to make sure you didn’t\
    \ accidentally break something else. They are also there for the next time code\
    \ gets changed elsewhere, and it breaks. Except you’ll find out during the actual\
    \ coding work, instead of at the end of a long day when your attention is not\
    \ what it should be, and maybe you’re tired and want to go home.\n\nI feel the\
    \ need to circle back to the idea of “lost opportunity costs.” The idea is that\
    \ the use of TDD will lead to code with fewer bugs making it into production.\
    \ That means you can then continue to work on other tasks, like new features or\
    \ a much-needed refactoring of a key subsystem.\n\nNot to mention the beneficial\
    \ side effect of making it easier to modify existing code with confidence. Why?\
    \ The tests will let you know if you’ve broken something! This allows us to continue\
    \ with a cycle of forward progress, instead of feeling like you are in a permanent\
    \ state of emergency with respect to bug fixing.\n\n### Cowboys Above Me\n\n>\
    \ “How do you sell testing when your bosses are cowboy coders?”\n\nThere was a\
    \ time when my reaction to someone complaining about their job or terrible processes\
    \ was to snap off a quick, “Well, you should quit your job!” I’ve softened my\
    \ stance on this over the years, but I think this scenario is definitely one where\
    \ it’s warranted.\n\nBasically, you don’t want to work for people like this. Unless\
    \ you really don’t care about the work you’re doing. In that case, you should\
    \ also quit your job.\n\nThis is not about professionalism or software craftsmanship.\
    \ It’s about understanding that an environment where you are not encouraged to\
    \ be thoughtful about the work you’re doing—and discouraged from the use of tools\
    \ and practices that lead to repeatable success—is toxic.\n\nI have worked in\
    \ enough toxic environments over the years, and they all had many things in common.\
    \ Learn to recognize when the place you work is going to hold you back instead\
    \ of allowing you to grow both as a programmer and as a person.\n\nLike I said,\
    \ testing is really about people.\n\n[^1]: Arrange-Act-Assert: http://wiki.c2.com/?ArrangeActAssert\n\
