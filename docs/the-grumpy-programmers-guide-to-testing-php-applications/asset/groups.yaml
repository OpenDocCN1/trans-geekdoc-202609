    \ 75.00% (3/4)     Lines: 80.00% (4/5)\n\\OpenCFP::OpenCFP\\WebPath\n  Methods:\
    \ 66.67% (2/3)     Lines: 66.67% (2/3)\n\\OpenCFP\\Application::OpenCFP\\Application\\\
    Speakers\n  Methods: 100.00% (4/4)    Lines: 100.00% (13/13)\n\\OpenCFP\\Http\\\
    Action\\Profile::OpenCFP\\Http\\Action\\Profile\\EditAction\n  Methods: 50.00%\
    \ (1/2)     Lines: 35.48% (11/31)\n\\OpenCFP\\Http\\Action\\Profile::OpenCFP\\\
    Http\\Action\\Profile\\ProcessAction\n  Methods: 25.00% (1/4)     Lines: 19.35%\
    \ (12/62)\n```\n\n（看起来我还有通过测试提高覆盖率的工作要做。）\n\n代码覆盖率报告还有其他格式——它可以生成基于 XML 的格式以供其他工具导入，或者生成一系列\
    \ HTML 页面，如果你想查找尚未测试的特定代码段，可以浏览这些页面。\n\n就像我之前说的，代码覆盖率只是一个数字；在覆盖率 100% 的代码库中，你仍然可能会有错误和意外行为。100%\
    \ 的覆盖率，如果与数据验证、过滤输入和转义输出等防御性编程技术相结合，确实可以降低代码出现错误和/或意外行为的可能性。\n\n## 静态分析工具\n\n\
    测试无法告诉你是否正确使用了 PHP 语言本身的特性，甚至无法告诉你是否在制造非常隐蔽的错误。随着 PHP 在参数、返回类型和类属性中使用显式类型的方向进一步发展，一个能够发现类型相关错误实例的工具将非常有帮助。在\
    \ OpenCFP 中，我使用了两个工具——PHPStan 和 Psalm。\n\nPHPStan[8] 这样描述自己：\n\n[8] PHPStan: https://github.com/phpstan/phpstan\n\
