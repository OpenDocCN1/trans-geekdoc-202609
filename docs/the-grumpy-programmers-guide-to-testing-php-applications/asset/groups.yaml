    First, a bug is reported, and someone verifies the problem being reported is actually
    a bug. Sometimes it’s simply an unexpected outcome or a complaint about the user
    experience. We all know, “It’s broken!” is not always a bug report, but often
    a statement of frustration.


    Armed with proof that there is a bug ready to fix, the next step should be to
    write a test that assumes the bug does not exist. Using the conditions under which
    the bug occurs, you create a test which assumes (like all tests) everything is
    working correctly. The test should fail because of the bug! You then continue
    with the normal TDD cycle of re-running the test as you make changes to the code
    until the test passes.


    Now you have a test that is proof this bug no longer exists! Also, hopefully,
    you have not broken something in another part of your application. If that happens,
    you write another test to verify this new problem (the technical term is a regression)
    is fixed and then verify the test you wrote for the initial bug fix still passes.
    Test suites are your number one weapon against regressions in your code; you don’t
    want to always break old code when you make changes!


    ### New Features Require Proof


    Another strategy for tests is to require all new features to have a test proving
    the new feature works as expected. This differs from the “bug fixes” strategy
    in that you will often end up writing multiple tests to prove a new feature works
    correctly. This strategy is where you get to see the power of TDD as a tool for
    designing code that should be easy to test.


    So how do you do this? You need to begin by deciding how you will prove, at the
    code level, the feature is working. Do you need a new object with a new method
    that returns a specific value? Are you using existing code? Yes, you might have
    to do a little work up front to figure out how you’re going to make this new feature
    work. But that is where TDD shines!


    The next step is to write a test assuming the new or modified code works correctly.
    Of course, the test will fail! Again, just like when you are working with tests
    to verify bug fixes, you keep writing code and running the tests until they all
    pass. Now you have one or more tests that verify this new feature is working as
    expected at the code level.


    Also, just like with the bug fix strategy, there is likely a chance these changes
    have caused a regression elsewhere in your codebase. Make sure to do some thorough
    checking of things using the application itself in areas that have been deemed
    critical.


    ### Test Suites Are Not Bulletproof


    At this point, you’re beginning to have a test suite that covers some portion
    of your application and helps provide limited protection against regressions.
    Be careful not to be lulled into a false sense of security by any number of passing
    tests. After all, these tests are written by humans instead of super-intelligent
    AIs seeking to move us toward a life of leisure in a land of plenty.


    Tests only cover the scenarios the writer could think of at the time they were
    written. Yes, it is entirely possible to have a test suite with 100% coverage
    of your code (meaning every line of code in your application was executed as part
    of a test) and still have an application that does not work correctly.


    You need a wide variety of tests–unit tests for individual objects, integration
    tests to verify these objects interact correctly with each other, and some functional
    tests (perhaps done manually) to make sure the application works correctly.


    A test suite with high levels of coverage allows you to focus on solving problems
    with some level of confidence that you will not introduce new bugs into an existing
    system.


    Now get out there and start building those test suites!


    ## Chapter 16: Nobody Is Running the Tests!


    ### Time Pressure


    “We were in a rush to get a bunch of features done, and continuing to write tests
    was slowing us down, so we stopped.” Ah yes, time, the slayer of developer’s dreams.
    The only thing we can never make any more of.


    Given my experiences with development pushes, it is incredibly likely you spent
    more time fixing the bugs introduced by the abnormal work conditions than if you
    had continued with the slow-and-steady pace TDD advocates.


    What can be done to help with this? A firm commitment to the continued use of
    tests as a way to validate your code is working as expected, even in the face
    of intimidation or threats from stakeholders.


    I realize this will not be easy. I have been accused of being reckless by some
    folks when insisting tests be a non-negotiable part of your developer workflow.
    “I’ll get fired for suggesting it!”


    That is not my intention! My intention is to present the argument that some kind
    of crazy overtime schedule to meet a deadline will end up with more mistakes in
    the code than if a more measured pace had been used.


    ### Tests Are Too Slow


    Test suites should run quickly; quicker runs mean quicker feedback and more time
    to actually write code. I’ve worked on projects where running the test suite took
    over an hour. Nobody wins in that scenario. People become reluctant to run test
    suites as part of their normal workflow.


    Imagine a process like this:


    - Developer writes tests while working on a new feature

    - Developer runs the tests for that feature until everything passes

    - Developer then runs the entire test suite to make sure nothing else breaks


    How many times would you get to the third step and say, “Screw it, I’m not sitting
    here for an hour.” This is how slow tests ruin all the work you put into other
    parts of the test suite.


