    make to your data storage tools. It doesn’t matter if it’s a relational database
    or a key-value store or a document database—if you cannot roll back the changes
    you make to data or the schema you are using to guide organizing the data, you
    will constantly run into situations where you cannot go back.


    There are PHP tools available to help you with database migrations (what the changes
    you make to data sources are commonly referred to as), and many popular object-relational
    mappers (ORMs) come with tools to manage them.


    I cannot emphasize enough that you need to have procedures to roll back changes
    in place before you even attempt to get tests in place.


    ### Manual Tests


    If you have no tests in place, the first tests you should be writing are checklists
    for someone to manually follow. These tests should be having someone actually
    use your application and perform one or more tasks to make sure features of your
    application are behaving as expected. I usually advise people to begin with these
    checklists for the functionality of your application that absolutely has to work
    as expected 100% of the time.


    If any of these tests fail, you should be rolling back the changes you made and
