    # Chapter


    # 14


    # Bootstrapping


    Most modern PHP web application frameworks use the front controller design pattern[^1]
    to handle incoming requests. The use of this design pattern is also frequently
    accompanied by the use of code which “bootstraps” your application.


    [1] front controller design pattern: https://en.wikipedia.org/wiki/Front_controller'
