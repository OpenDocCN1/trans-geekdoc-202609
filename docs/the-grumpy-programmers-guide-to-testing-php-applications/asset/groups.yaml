    Beyond code style issues, you should also focus on making sure folks are using
    the same coding practices. This might not be an issue if your language of choice
    follows the “there is only one way to do it” path, but languages that mix procedural
    and object-oriented and functional practices (like PHP) give bored programmers
    lots of options to create code that is hard to maintain going forward.


    Pick some coding practices you’re happy with and make sure to enforce them via
    code reviews. The consistency in structures and practices will make it easier
    to spot when something has gone wrong, instead of having to make mental context
    switches to adjust to someone else’s style.


    Like so many things involved with test-centric culture, you are doing a bunch
    of work upfront to gain big benefits down the road.


    ### Trust


    Finally, I need to talk to you about trust. When you look at the practices I am
    advocating, it sure seems like I am not trusting you to do the “right thing” as
    expressed by all these rules:


    - We review code, so you understand what everyone else is doing.

    - We write tests for everything because you need confidence things work.

    - We write code in the same style, so you have less friction in naming things.

    - We write code using the same practices, so you can debug things easier.

    - We automate things, so you don’t zone out and make a critical mistake.


    In other words, I am trying to put you in a position to succeed! Test-centric
    cultures can be built; it just takes a lot of work and will require you (and others)
    to change what you’ve been doing.


    It took a terrible development experience and crazy amounts of overtime (like
    120 hours in six weeks) in 2003 for me to come around and start making the changes
    I felt I needed to make sure it would never happen again. I pushed hard to instill
    a lot of the practices I outlined above. Some of it worked, some of it didn’t,
    and I left when I realized I wasn’t going to get my way.


    Ever since, I have worked very hard to implement these same practices everywhere
    I went, wanting to trust that my coworkers thought these things were just as important
    as I did. It didn’t always work, but whenever I left, I felt I had put in an effort
    to change things. That’s all I ever really wanted.


    [^1]: FreeBSD jails: https://en.wikipedia.org/wiki/FreeBSD_jail

    [^2]: Vagrant: https://vagrantup.com

