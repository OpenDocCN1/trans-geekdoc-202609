    \ time you wrote the code. Good defensive coding habits can help a little, but\
    \ the truth is that code with unit tests with 100% coverage doesn’t always mean\
    \ your application will work correctly. You still have to connect them together\
    \ and use them in a way that makes sense. Testing is definitely not a substitute\
    \ for common sense.\n"
