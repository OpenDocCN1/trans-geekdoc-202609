    \  xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\n  xsi:noNamespaceSchemaLocation=\"\
    vendor/phpunit/phpunit/phpunit.xsd\"\n  backupGlobals=\"false\"\n  backupStaticAttributes=\"\
    false\"\n  bootstrap=\"vendor/autoload.php\"\n  colors=\"true\"\n  columns=\"\
