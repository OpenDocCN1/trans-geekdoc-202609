    # 1. INTRODUCTION


    In the aftermath of this launch, I was called into the project manager’s office
    for a meeting. After a discussion that ended with him saying, “Well, we’re not
    going to need this,” and threw an envelope containing a termination letter and
    a severance check into the trash, he handed me a copy of a book and said, “I’d
    like you to spend the weekend looking at this book and let me know what you think
    on Monday morning.” That book was a copy of “Extreme Programming Installed” by
    Ron Jeffries, Ann Anderson, and Chet Hendrickson. At the time, I was commuting
    from the outer fringes of the Greater Toronto Area, taking the commuter train
    for 90 minutes in and 2 hours home (due to connections). I had lots of time to
    take a look at this book.


    You rarely run across a concept that actually changes your life as an adult. In
    this case, when I read the sections of the book about unit testing, I was stunned
    and excited. There was a way we could use the computer itself to find mistakes
    and bugs in our code instead of relying on QA folks or our customers? This was
    revolutionary to me despite me being five years into getting paid to write computer
    programs.


    When I got back to work and met again with that project manager, plans were made
    to start attacking the problems we were facing in the application and get some
    sort of tests in place. Not too long afterward, I wrote my first unit test using
    the SimpleTest framework (basically PHPUnit, but the tests ran in the browser),
    and the rest is a test-centric career.


    Testing, as a concept, is hard to explain to beginning programmers: “We are going
    to write code that is going to make sure your other code works as expected.” The
    assumption underlying all this is that you already understand how to write computer
    programs in your chosen language! This makes it very difficult to teach to beginner
    or inexperienced programmers. When you combine this with how PHP does not force
    any particular structure on you, you have an environment where only the folks
    who are really motivated learn about testing.


    There is something like “survivorship bias” at play here, too. The people who
    latch onto testing as a practice to incorporate into their development workflow
    are those who have had success with it. We seldom hear from folks who tried to
    learn testing (either on their own or from others) and have not had success with
    it. In general, the testing community is small but quite vocal about their opinions.
    I can understand people hesitating to share their lack of success.


    This book is my way of providing some help for developers who are looking to become
    more test-centric. By learning the basic skills (both technical and non-technical),
    you will be able to write tests using almost any testing framework and almost
    any PHP application.'
  - '[PAGE 9]


    We’re going to start by taking a look at what a test actually is because I feel
    many people (including experienced testers) are misguided as to the target of
    a test. After that, we’ll take a look at how PHPUnit works so you can understand
    better ways of using it. Armed with that knowledge, we will use Test-Driven Development
    (TDD) to build some code to illustrate how tests can be used to drive the design
    of your application’s code.


    Most of us are not lucky enough to be in a position to use TDD on a new project.
    I will show you how to write tests for an existing application, especially one
    that was not written with any tests in mind. The tools are the same; we just use
    them differently.


    After having written some tests, we will then move onto dealing with the people
    side of testing by providing strategies to help get the people you work with to
    become more test-centric. Understanding that testing was more about people than
    the tools themselves was a major revelation for me.


    To get the most out of this book, you should be a developer who has an intermediate
    understanding of PHP. It’s hard to write tests when you don’t have a firm grasp
    of the language itself, and the types of tests you’ll be writing are more PHP
    code you will need to understand and support.


    Good luck and I hope you find the material in here useful. I would love to hear
    your feedback as you work your way through this book. The best way to reach me
    is via Twitter, where I do performance art as @grmypyprogrammer. If Twitter (or
    social media in general) is not your thing, you can email me at chartjes@grumpy-learning.com.
    I read every email that is not labeled as spam and try and answer them as soon
    as I can.'
