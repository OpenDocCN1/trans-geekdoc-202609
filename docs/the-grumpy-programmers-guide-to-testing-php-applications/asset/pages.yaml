- pgno: 27
  md: "PHPUnit’s default test runner output provides you with enough details that\
    \ you can figure out what tests are failing and can also be used as a sanity check\
    \ to make sure the number of tests and assertions you have written is correct.\
    \ PHPUnit provides you with many options for changing the display output. Again,\
    \ I’ll get into those later on in the book.\n\n# PHPUnit Test Cases\n\nWe’ve seen\
    \ how to use the test runner with some really simple (and throw-away) test cases;\
    \ now, it’s time to take a closer look at how we build test cases in PHPUnit.\n\
    \nAt the highest level, you have a file containing a class extending off of one\
    \ of the basic test classes. Remember your first basic test case example?\n\n\
    ```\n```php\n<?php\n\ndeclare(strict_types=1);\n\nclass BasicTestCase extends\
    \ PHPUnit\\Framework\\TestCase\n{\n    public function testCase()\n    {\n   \
    \     $this->assertTrue(false);\n    }\n}\n```\n```\n\nTo create test cases, you\
    \ create class methods which need to be identified as tests. There are two ways\
    \ to do this. You either prepend a test method with the word test like in your\
    \ example, or you create a documentation block to the test method and add a @test\
    \ annotation to indicate the method below is a test case. It looks like this:\n\
    \n```\n```php\n<?php\n\ndeclare(strict_types=1);\n\nclass BasicTestCase extends\
    \ PHPUnit\\Framework\\TestCase\n{\n    /**\n     * @test\n     */\n    public\
    \ function firstTestCase()\n    {\n        $this->assertTrue(False);\n    }\n\
    }\n```\n```"
  merge: -1
  img_proc: true
