  md: "To tell PHPUnit what data provider to use for a test case, you need to have\
    \ a DocBlock (if you aren't using one already) for the test method and then add\
    \ the @dataProvider annotation to it. Case matters! Then, you need to have your\
    \ test method accept as many parameters as individual data values you are passing\
    \ in.\n\nFor this test, I decided to provide the input I am testing and what I\
    \ expect the results to be.\n\nNow I verify that the test fails.\n\n```\nFailed\
    \ asserting that false is true.\n/Users/chartjes/grumpy-guide/test/NumeralConverterTest.php:34\n\
    \nFailed asserting that false is true.\n/Users/chartjes/grumpy-guide/test/NumeralConverterTest.php:34\n\
    ```\n\nNo, I didn't cut-and-paste the result twice. The test method using this\
    \ provider is executed once for each data set.\n\nWith the first step done, I\
    \ go and start implementing code to make this second test case pass.\n\n```\n\
    ```php\npublic function arabicToRoman($value) : string\n{\n    $currentValue =\
    \ $value;\n    $result = '';\n\n    while ($currentValue > 0) {\n        if ($currentValue\
    \ % 1 === 0) {\n            $result .= 'I';\n            $currentValue--;\n  \
    \      }\n    }\n\n    return $result;\n}\n```\n```\n\nThe test passes."
