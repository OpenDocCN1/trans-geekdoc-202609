  md: '# Chapter


    # 5


    # Test Double


    # What Is a Test Double?


    Test doubles are a concept that generates the most arguments between people discussing
    testing. They are a concept you have to understand to really have an opinion on
    them, but we all know that never stops people from arguing.


    Wikipedia has a definition that gets right to the heart of the matter:


    > “In automated unit testing, it may be necessary to use objects or procedures
    that look and behave like their release-intended counterparts, but are actually
    simplified versions that reduce the complexity and facilitate testing. A test
    double is a generic (meta) term used for these objects or procedures.”'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# 5. Test Double


    Test doubles are a tool we can use to represent dependencies we need for a given
    testing scenario. In the PHP world, they are commonly referred to as mocks, but
    I want to get you into the habit of using the correct word for it. You’ll see
    why in a little bit.


    At a high level, I will use a double to represent some dependency I need for a
    test when, for whatever reason, I am not using the real thing. There can be lots
    of reasons not to use the “real” dependency. The most common reasons are “it talks
    to a database” or “it talks to a remote API.”


    Before I go further, I want to be clear there are no right or wrong approaches
    to using test doubles. Some programming communities advocate using doubles for
    all dependencies. Some advocate never using a double. Other programming communities
    that use languages where objects and functions can be modified at run time (commonly
    referred to as “monkey patching”) use that technique instead of doubles.


    In this chapter, I want to show you the different types of test doubles available
    to PHP programmers and let you make up your own mind. My approach is to use the
    real dependency when possible unless there is significant overhead. Dependencies
    that use a database are the usual culprit for me or “request” objects used in
    frameworks.


    In this chapter, I will be using the test doubling framework Prophecy[1], which
    has been available in PHPUnit since version 4.5. I’ve also used Mockery[2] and
    liked its syntax, too. There is no “right” one to use — you can even use PHPUnit’s
    built-in test doubling tools. Pick one you like and stick with it; those who have
    to maintain the tests after you will thank you for being consistent.


    In these examples, I will be using code that is being used in production for an
    application that helps track transactions in a simulation baseball league.


    # Dummies


    Dummies are the first test double you might need. With Wikipedia as our guide:


    > > "..used when a parameter is needed for the tested method but without actually
    needing to use the parameter."


    In practical use, you will want to use a dummy when the code you are testing needs
    a dependency, but the dependency itself will never be used during the test. With
    PHP moving towards type hints and return types being used more and more, dummies
    are of limited use


    [1] Prophecy: https://github.com/phpspec/prophecy

    [2] Mockery: https://github.com/mockery/mockery'
  merge: -1
  img_proc: true
