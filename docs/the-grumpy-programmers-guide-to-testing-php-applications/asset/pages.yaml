  md: "# API Schema Validation\n\n```\n```php\n/**\n * @test\n */\npublic function\
    \ it_validates_getPetById(): void\n{\n    $this->assertTrue(false);\n}\n```\n\
    ```\n\nNow, I build the request I want to make to the API.\n\n```\n```php\npublic\
    \ function it_validates_getPetById(): void\n{\n    $uri = 'https://petstore.swagger.io/v2/pet/1';\n\
    \    $responseData = json_decode(\n        file_get_contents($uri),\n        true,\n\
    \        512,\n        JSON_THROW_ON_ERROR\n    );\n\n    // other code below...\n\
    }\n```\n```\n\nFor validating those responses, I took some OpenAPI.Tools advice\
    \ and chose to use OpenAPI-Validator, which you can install using Composer (as\
    \ a development dependency instead of placing it in production, which is always\
    \ a good idea).\n\n```\n```shell\ncomposer req --dev mmal/openapi-validator\n\
    ```\n```\n\nNow, I want to share something with you. Different OpenAPI validation\
    \ tools use different techniques for deciding if your spec is valid. Speccy said\
    \ my spec was OpenAPI compliant once I fixed the problems it reported. When I\
    \ used OpenAPI-validator, well, it expressed its own ideas on what a valid API\
    \ is. When I added the code that validates the spec I have, it reported many errors\
    \ I corrected until everything seemed fine.\n\nAs annoying as it was to iterate\
    \ through the errors, it drives home the point that the job of the specification\
    \ to tell you whether or not you are doing things correctly. Much like unit tests,\
    \ a good and thorough specification means you do not waste time debugging errors\
    \ that are easily caught.\n\nSo, following the documentation, I added in the code\
    \ that validates the specification and then makes sure the response I got back\
    \ matches our expectations."
