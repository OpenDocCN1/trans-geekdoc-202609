  md: "# 6. TEST-DRIVEN DEVELOPMENT BY EXAMPLE\n\n# First Test\n\nThe first test is\
    \ always the hardest because we are setting the stage for all the other code that\
    \ comes afterward. I definitely spend some time prototyping or thinking about\
    \ what I want my interfaces and parameters to look like. In this case, I have\
    \ a pretty good idea from the start what I want things to look like. I will write\
    \ the first test case:\n\n```\npublic function converts1ToRomanNumeral() : void\n\
    {\n    // Arrange\n    $nc = new NumeralConverter();\n    $input = 1;\n    $output\
    \ = 'I';\n\n    // Act\n    $result = $nc->arabicToRoman($input);\n\n    // Assert\n\
    \    $this->assertEquals($output, $result);\n}\n```\n\nBefore we get into the\
    \ specifics, I want to talk about a test design pattern taught to me many years\
    \ ago that I use on a regular basis to keep my test cases organized. It's called\
    \ the Arrange-Act-Assert pattern.\n\n# Arrange\n\nThis section is where I create\
    \ any dependencies I need for the testing scenario. In this example, I am creating\
    \ a NumeralConverter object along with my input for the method and the expected\
    \ output. In more advanced test cases, the code I need to create test doubles\
    \ would go in the arrange section as well. In most test cases, the arrange step\
    \ contains the most code.\n\n# Act\n\nThis is where we use the code we are testing\
    \ to generate output we can then verify matches our expectations. In our example,\
    \ we are executing the arabicToRoman() method, passing our selected input in and\
    \ storing the output in a variable.\n\nThis section can contain a lot of code\
    \ or maybe just one line, like in our example. It really depends on the testing\
    \ scenario. One thing to look out for is making sure that whatever is going on\
    \ in the section follows what is going on in the application code that uses whatever\
    \ we are testing. The further you drift away from using the code in your tests\
    \ from how it is"
