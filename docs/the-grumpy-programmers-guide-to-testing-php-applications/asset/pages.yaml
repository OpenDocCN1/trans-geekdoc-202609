    $db = new stdClass();

    $rm = new Roster($db);

    ```

    ```


    # Test Stub


    In our world of typed PHP code, the dummy will get upgraded to the test stub.
    Again, using Wikipedia as our guide, we get the following definition:


    > > "used for providing the tested code with ‘indirect input.’"'
