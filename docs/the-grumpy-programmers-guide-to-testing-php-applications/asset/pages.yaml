- pgno: 113
  md: '# Chapter


    # 13


    # Building a Testing Culture


    It takes a lot of work to put together the type of environment where testing is
    an integral part of your daily work. It can’t be an afterthought or something
    that is forgotten when the deadlines get tight. Testing has to become a primary
    practice, or it will just not work. Let’s also make sure we are getting all our
    terms straight–what does it mean when I start talking about “building a testing
    culture?”'
  merge: -1
  img_proc: true
- pgno: 114
  md: '# Primary Goal


    The primary goal should be “our developers write tests for any code that goes
    into production.” Anything less than that is an opportunity for those folks with
    a little less discipline or more anxiety about delivery times to backslide and
    abandon the primary goal of having tests for all your code.


    Primary goals are supposed to be lofty and ambitious–but in this case, they are
    totally achievable. You absolutely can provide your developers with all the training
    and support they need to learn how to write tests. You just have to change your
    behavior and probably challenge a lot of beliefs about programming that you have.


    With your primary goal set, let’s talk about the secondary goals you need to make
    the primary goal work.


    # Tests as First Class Components


    Of course, you can’t really have a culture that includes testing if you don’t
    have any tests! This is usually the biggest obstacle for any organization to becoming
    test-centric. Think back to when you were learning to program in PHP–were you
    taught to write tests? If you were, consider yourself extremely lucky!


    It may seem obvious, but the first thing you’ll have to do is commit to writing
    tests for any new code that is written. Yes, this is likely to be painful as your
    organization makes the transition. Yes, you will probably complain about this.
    I have been in more than one meeting where people complained their work would’ve
    been done if “it wasn’t for all these stupid tests I have to write.”


    Developers, who mostly pride themselves on logic and problem-solving skills, are
    just as resistant to change as anyone else. It will be hard to get into the habit
    of always having tests with your code.


    If you’re looking for a way to ease into adding tests, here are some strategies
    you can apply.


    # Tests for Bugs


    Any time someone reports a bug, write a test verifying the bug exists. By this,
    I mean the test should fail; you should know what the correct outcome should be,
    and then the test generates its own outcome you compare to the expectation.


    With a failing test that also has what the correct outcome is supposed to be,
    you change the code you’re testing until the test passes. Now, you have a passing
    test!'
  merge: -1
  img_proc: true
- pgno: 115
  md: 'A test suite consisting of fixes for bugs can also show you some common patterns
    in your code–especially if you feel like you’re repeatedly fixing the same type
    of bugs.


    From a mentoring perspective, asking developers new to a project to write test
    cases that verify bugs exist can be a good strategy. It allows them a chance to
    explore the codebase and see how things fit together. For some codebases, this
    will definitely be intimidating. Giving them a chance to learn the codebase through
    tests is probably less risky than assigning work that needs to go up into production.


    # Tests for New Features


    Any time you add new code, it must come with tests that prove the new code works
    as expected. This is similar to writing tests for bugs, but in this case, you
    are using the tests to help you create working code.


    In this context of “tests are for new features,” Test-Driven Development can really
    shine. TDD is really a strategy for writing code in a specific way–one which results
    in code that is testable with low amounts of friction or developer pain.


    But it doesn’t come without costs. Often, a legacy application is not well-suited
    to allowing you to write easily tested code. This is a barrier many developers
    get slammed up against and, as a result, abandon the goal of having tests.


    I don’t have any shortcuts to make this easier. The pain you feel is neither good,
    nor bad–it is simply a result of the current architecture of your application.
    Well-tested apps tend to consist of small modules of code that:


    +   - Accept a small number of inputs

    +   - Does not alter anything other than what was given to it (no side-effects)

    +   - Returns a small number of outputs


    When you have code like this, it’s easy to test! Most code does not look like
    that. You will need to rewrite some code; you will need to start to use new strategies;
    you will end up taking longer than you thought to create new code and the tests
    that come with it.


    The upside to all this is you have tests that act as proof the new feature will
    work as expected, given the information you have at the time you wrote the code.
    Good defensive coding habits can help a little, but the truth is that code with
    unit tests with 100% coverage doesn’t always mean your application will work correctly.
    You still have to connect them together and use them in a way that makes sense.
    Testing is definitely not a substitute for common sense.'
  merge: -1
  img_proc: true
- pgno: 116
  md: '# Tests for Refactoring


    You might think this is covered by the section on tests for new features, but
    I feel like they are two different things.


    Your definition of refactoring might be different from mine. To me, refactoring
    is the process of taking code that is working as expected and modifying it to
    take advantage of new knowledge, techniques, or libraries. The output or final
    result of the code should not change! If that happens, you’re rewriting the code
    to do something different.


    So when it comes to refactoring, this seems to me to be a perfect candidate for
    a test:


    +   - Write the test for the code that uses the expected outcome

    +   - Start modifying existing code that is being tested

    +   - Run the test and make sure it passes


    Repeat the three steps above until you are happy the refactor is complete.


    # Commitment to Peer Review


    Every place I have worked at that had a strong testing culture was also heavily
    committed to peer reviews of code. To me, peer review means someone else looks
    at my code to verify it is accomplishing the desired outcome before it goes into
    production. If you do nothing else other than adding peer review of code to your
    development practices, the quality and–more importantly–the purpose of your code
    will improve immensely.


    When related to the primary goal, we end up with a workflow like this:


    +   - Developer is writing code to solve a problem

    +   - Developer includes tests (hopefully using TDD, but test-after has value)

    +   - Developer indicates code is ready

    +   - Peer reviews the code, checking for tests and correct intent of code

    +   - With peer approval, code moves to the next target environment


    Now, there is something I feel is really important to stress here–it’s supposed
    to be peer review, not superior review. If we’re going to be honest, most people
    do not like being told the code they worked on isn’t any good. I used to be extremely
    defensive about the code I wrote and the ideas associated with those decisions.
    It made peer review way more stressful than it needed to be because I wasted more
    time arguing and trying to justify my choices rather than understanding the criticism
    being presented.'
  merge: -1
  img_proc: true
- pgno: 117
  md: 'To be clear, code reviews are often very political and can reflect the power
    dynamics that exist in the project or workplace. You have to work very hard to
    make them not end up that way! Remember, you are supposed to be reviewing the
    ideas and implementation, not using it as an opportunity to pump up your own ego
    or tear down a coworker with whom you might have personal issues with.


    # Consistency in Development Environments


    In my 20+ years of software development, I''ve used all sorts of different development
    environments:


    +   - Shared server used by the entire development team

    +   - Virtual servers maintained by the systems department

    +   - PCs on our desk configured to simulate production using FreeBSD jails^[1]

    +   - Virtual machines using Vagrant^[2]

    +   - Whatever I wanted to install on my own laptop


    Obviously, not all of these environments are optimal. Sometimes you have no choice–the
    decision is made by someone over whom you have no control. But it is obvious not
    having everyone use the same development environment is a sure way to end up with
    weird bugs.


    Test-centric cultures focus on repeatable processes, and having an easy-to-recreate
    development environment for people to work in is something definitely worth the
    time investment. Why? You''re trying to eliminate, “It works on my machine,” from
    the list of reasons why stuff isn''t working.


    The key here is to make sure everyone is using the same building blocks.


    # Automation Is Your Friend


    One of the other concepts I spend a lot of time promoting is the idea of using
    automation to help you accomplish tasks more quickly. If I find myself doing something
    manually more than a handful of times, it''s a sign this is a task that can definitely
    benefit from automation.


    In an era where we have tools like Vagrant and Docker at our disposal, allowing
    us to create environments for our code to run in, why do you want to rely on humans
    to do repetitive tasks? Computers are great at doing what we tell them, over and
    over again. It just makes sense to script as much as you can.


    [1] FreeBSD jails: https://en.wikipedia.org/wiki/FreeBSD_jail

    [2] Vagrant: https://vagrantup.com'
  merge: -1
  img_proc: true
- pgno: 118
  md: '# 13. BUILDING A TESTING CULTURE


    A process for automatically generating a development environment also means when
    a developer accidentally messes up their environment (I have lost track of the
    number of times this has happened), you can quickly get back to a known good state.
    This frees up developers to experiment, knowing there won’t be hours of downtime
    if they make a mistake.


    Pretty much every programming language has automation tools, so chances are you
    won’t have to learn another language to help build out your automation efforts.


    # Same Languages and Tools


    The most important one of these issues is likely making sure everyone is using
    the same version of the chosen programming language. If your chosen language also
    supports extensions or add-on libraries, make sure everyone is using the same
    ones there, too! It seems like such an easy thing to do, but with every developer
    having their own personal policies about this sort of thing, it’s almost inevitable
    some drift will occur if there are not strict procedures in place.


    This should be applied to the other complementary pieces of your application:
    database servers, caching servers, build tools for minifying and compressing things.
    Being consistent this way also eliminates weird bugs due to different versions
    of tools behaving in slightly different ways.


    I am a believer in always using the latest, stable version of every tool the application
    uses. That way, you get to take advantage of any updates for bug fixes or patching
    of security issues. The longer you hold off on updating the tools your application
    uses, the more likely you are to either get compromised or be in a position where
    an upgrade to the latest stable version of things is a nightmare. Don’t let it
    get to that point.


    # Same Practices


    This is one I feel is extremely underrated and can often lead to a lot of friction.
    You’re probably familiar with coding standards—how the code itself should be structured
    in terms of indenting, positioning of braces, brackets, things like that. Most
    languages have produced community-driven tools that make it easy to enforce or
    even automatically apply them.


    Beyond code style issues, you should also focus on making sure folks are using
    the same coding practices. This might not be an issue if your language of choice
    follows the “there is only one way to do it” path, but languages that mix procedural
    and object-oriented and functional practices (like PHP) give bored programmers
    lots of options to create code that is hard to maintain going forward.'
  merge: -1
  img_proc: true
- pgno: 119
  md: 'Pick some coding practices you’re happy with and make sure to enforce them
    via code reviews. The consistency in structures and practices will make it easier
    to spot when something has gone wrong, instead of having to make mental context
    switches to adjust to someone else’s style.


    Like so many things involved with test-centric culture, you are doing a bunch
    of work upfront to gain big benefits down the road.


    # Trust


    Finally, I need to talk to you about trust. When you look at the practices I am
    advocating, it sure seems like I am not trusting you to do the “right thing” as
    expressed by all these rules:


    +   - We review code, so you understand what everyone else is doing.

    +   - We write tests for everything because you need confidence things work.

    +   - We write code in the same style, so you have less friction in naming things.

    +   - We write code using the same practices, so you can debug things easier.

    +   - We automate things, so you don’t zone out and make a critical mistake.


    In other words, I am trying to put you in a position to succeed! Test-centric
    cultures can be built; it just takes a lot of work and will require you (and others)
    to change what you’ve been doing.


    It took a terrible development experience and crazy amounts of overtime (like
    120 hours in six weeks) in 2003 for me to come around and start making the changes
    I felt I needed to make sure it would never happen again. I pushed hard to instill
    a lot of the practices I outlined above. Some of it worked, some of it didn’t,
    and I left when I realized I wasn’t going to get my way.


    Ever since, I have worked very hard to implement these same practices everywhere
    I went, wanting to trust that my coworkers thought these things were just as important
    as I did. It didn’t always work, but whenever I left, I felt I had put in an effort
    to change things. That’s all I ever really wanted.'
  merge: -1
