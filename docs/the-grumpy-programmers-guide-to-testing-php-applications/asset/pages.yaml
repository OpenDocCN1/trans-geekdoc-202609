  md: "# Mock Objects and Test Spies\n\nNext, you create your test spies with specific\
    \ calls you are expecting to happen:\n\n```\n// Create our updatePlayerTeam test\
    \ spies\n$rm->updatePlayerTeam($tradePartner, 1, $tradeComment)->shouldBeCalled();\n\
    $rm->updatePlayerTeam($tradePartner, 2, $tradeComment)->shouldBeCalled();\n$rm->updatePlayerTeam($tradePartner,\
    \ 3, $tradeComment)->shouldBeCalled();\n```\n\nThose of you who sneak a peek at\
    \ the documentation for Prophecy will note there are ways to create these spies\
    \ without being specific about what parameters and in what order they go in. I\
    \ could’ve done the spies like this:\n\n```\n// Create our updatePlayerTeam test\
    \ spies\n$rm->updatePlayerTeam(\n    \\Prophecy\\Argument::any(),\n    \\Prophecy\\\
    Argument::any(),\n    \\Prophecy\\Argument::any()\n)->shouldBeCalled(3);\n```\n\
    \nWhich translates to “I expect updatePlayerTeam() to be called, with any values\
    \ as three arguments, three times.” I prefer for my tests to be as specific as\
    \ possible, as it reduces the likelihood of a test case failing in a way I did\
    \ not expect.\n\nThe test fails…\n\n```\nProphecy\\Exception\\Call\\UnexpectedCallException\
    \ : Unexpected method call on Double\\Roster\\P1:\n  - makeInactive(\n      \"\
    1\"\n    )\nexpected calls were:\n  - getById(\n      exact(1)\n    )\n  - getById(\n\
    \      exact(2)\n    )\n  - getById(\n      exact(3)\n    )\n  - updatePlayerTeam(\n\
    \      exact(\"TESTMORE\"),\n      exact(1),\n      exact(\"Trade TESTMORE 01/01\"\
    )\n    )\n```"
