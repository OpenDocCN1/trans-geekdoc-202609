- pgno: 93
  md: "```\npublic function complexProvider()\n{\n    // Read in some data from a\
    \ CSV file\n    $fp = fopen(\"./fixtures/data.csv\");\n    $response = [];\n\n\
    \    while ($data = fgetcsv($fp, 1000, \",\")) {\n        $response[] = array($data[0],\
    \ $data[1], $data[2]);\n    }\n\n    fclose($fp);\n\n    return $response;\n}\n\
    ```\n\nDon't think you need to limit yourself in what your data providers are\
    \ allowed to do. The goal is to create useful data sets for testing purposes.\n\
    \n# Data Provider Tricks\n\nSince data providers return associative arrays, you\
    \ can assign them a more descriptive key to help with debugging. For example,\
    \ I could refactor the data provider for my FizzBuzz test:\n\n```\nreturn [\n\
    \    'one' => [1, '1'],\n    'fizz' => [3, 'Fizz'],\n    'buzz' => [5, 'Buzz'],\n\
    \    'fizzbuzz' => [15, 'FizzBuzz']\n];\n```\n\nAlso, data providers don't have\
    \ to be methods inside the same class. You can use methods in other classes, you\
    \ just have to set their visibility to public. You can use namespaces as well.\
    \ Here are two examples that would go into the DocBlock for any test that wants\
    \ to use a provider in another class:\n\n+   - @dataProvider Foo::dataProvider\n\
    +   - @dataProvider Grumpy\\Helpers\\Foo::dataProvider\n\nThis allows you to create\
    \ helper classes that are just data providers and cut down on the amount of duplicated\
    \ code you have in your tests themselves."
