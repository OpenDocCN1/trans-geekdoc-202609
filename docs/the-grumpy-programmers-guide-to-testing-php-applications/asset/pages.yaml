- pgno: 86
  md: "# 9. Testing APIs\n\n```\n```php\n// Added these dependencies that we needed\
    \ at the top of the file\nuse Mmal\\OpenapiValidator\\Validator;\nuse Symfony\\\
    Component\\Yaml\\Yaml;\n\npublic function it_validates_getPetById(): void\n{\n\
    \    $uri = 'https://petstore.swagger.io/v2/pet/1';\n    $responseData = json_decode(\n\
    \        file_get_contents($uri),\n        true,\n        512,\n        JSON_THROW_ON_ERROR\n\
    \    );\n    $validator = new Validator(Yaml::parse(\n        file_get_contents(__DIR__\
    \ . '/specs/api.yaml')\n    ));\n    $result = $validator->validateBasedOnRequest(\n\
    \        '/pet/{petId}',\n        'GET',\n        200,\n        $responseData\n\
    \    );\n    $this->assertFalse($result->hasErrors());\n}\n```\n```\n\nOkay, I\
    \ will explain this whole test from top to bottom.\n\nFirst, I make my call to\
    \ the API, getting back a JSON response that I decode and store in $responseData.\
    \ Next, I use the Validator object in combination with a YAML parser to take a\
    \ look at my spec file and validate it.\n\nThis next step requires some more explanation.\
    \ When you use the validateBasedOnRequest() method, you need to provide the following\
    \ things:\n\n+   - The path as outlined in the OpenAPI spec for the call you are\
    \ testing\n+   - Which HTTP method you used for the request\n+   - The HTTP status\
