    ```\n\nLet me create an empty shell for the object.\n\n```\n<?php\ndeclare(strict_types=1);\n\
    \nclass NumeralConverter\n{\n}\n```\n\nThen, I update my test by adding a line\
    \ where to load this object:\n\n```\nrequire __DIR__ . '/../src/NumeralConverter.php';\n\
    ```\n\nFinally, I run the test again, and it fails because the method I am testing\
    \ doesn’t exist yet.\n\n```\nError : Call to undefined method NumeralConverter::arabicToRoman()\n\
    \    /Users/chartjes/grumpy-guide/test/NumeralConverterTest.php:16\n```\n\nYes,\
    \ this is exactly how I do my testing work. I go slow and steady, making sure\
    \ not to leave anything out. We all have our own habits and programming techniques\
    \ we like to use; being deliberate minimizes the likelihood I skip steps and make\
    \ an easily avoidable mistake.\n\nNow I write just enough code to satisfy the\
    \ behavior we are testing for."
