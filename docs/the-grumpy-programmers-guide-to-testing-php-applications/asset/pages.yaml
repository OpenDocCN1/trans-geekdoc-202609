- pgno: 51
  md: "used in production, the more likely you will end up with tests that pass but\
    \ applications that do not work as expected.\n\n# Assert\n\nThe final section\
    \ of the test is the one where we have all our assertions or other statements\
    \ that verify our code is behaving the way we expect. Some people follow a rule\
    \ of “one assertion per test,” while others follow “use however many assertions\
    \ you need.” There is no correct answer, but a test case without some kind of\
    \ assertion is not testing anything. In our example, we are verifying the expected\
    \ output matches what the arabicToRoman() method returns.\n\nBack to our example;\
    \ it fails because I haven’t created my NumeralConvertor object.\n\n```\nError\
