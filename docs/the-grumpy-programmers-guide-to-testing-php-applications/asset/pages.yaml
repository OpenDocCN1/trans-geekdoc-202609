  md: 'get out of sync with the dependencies they are representing, the overall “brittleness”
    of tests that rely on doubles, and a number of other complaints not worth rehashing
    here.


    Their solution is to create fakes (which are doubles but in disguise) or to use
    the real thing whenever possible. I don’t really object to this technique–using
    real dependencies is a good thing!


    The side effect of refusing to use test doubles is you start picking up what I
    have labeled “outside actor” costs. These are the tiny bits of extra time (and
    sometimes extra memory) your tests pick up whenever they talk to real databases
    or real web services. When your test suite is small, it’s more like a speed bump
    than anything. Once your test suite starts covering large parts of a large application,
    you will notice it.


    At this point, you might become conflicted. On the one hand, you want to make
    sure your application has sufficient test coverage to catch regressions and allow
    you to write new code easier. On the other hand, you want your test suite to be
    lightning-fast, so developers aren’t sitting around waiting for their tests to
    finish running.


    # Monolithic Bootstrapping


    Most web application frameworks are built around the front controller[1] design
    pattern. Part of using this pattern is also a bootstrapping sequence that takes
    place before the incoming request is handled. Often, there is a lot going on in
    there, and that means a lot of work for you to in the “arrange” step of the Arrange-Act-Assert[2]
    testing pattern. Of course, there are testing patterns; developers aren’t the
    only ones to get in on the pattern fun.


    What can we do? Well, one way I have found is to break down your bootstrapping
    sequence from one monolithic method doing a bunch of work into a smaller method
    that calls a series of other small methods that do all the bootstrapping. You
    are in a much better position to figure out what parts of the bootstrapping sequence
    are absolutely necessary for the code you’re trying to test.


    # Shared Testing Environments


    This is not the problem it used to be, thanks to the rapid adoption of technologies
    like virtual machines and containers. These tools can be used to replicate the
    environment your code is likely to run in on your own computer. I upgraded from
    a mid-2012 Mac Book Air to a late-2016 Mac Book Pro in early 2017 (yes, with the
    cool little touch bar) because I


    [1] front controller: https://en.wikipedia.org/wiki/Front_controller

    [2] Arrange-Act-Assert: http://wiki.c2.com/?ArrangeActAssert'
