  md: "# 14. BOOTSTRAPPING\n\nThis is the section of your application where you’re\
    \ probably doing things like initializing databases, setting environment variables,\
    \ or adding things to the service locator. In short, this work is critical to\
    \ making your application run.\n\nNaturally, a lot of your code relies on things\
    \ being done in bootstrapping, so for testing purposes, we need to create a bootstrapping\
