- pgno: 66
  md: '# # 7. Test-After Development by Example


    In these scenarios, I have found myself asking the same three questions over the
    years.


    +   - What is the expected behavior?

    +   - How am I going to test for that behavior?

    +   - What am I going to have to change to test this code?


    The biggest challenge for writing tests after we have working code is that the
    changes that need to be made in order for it “to be testable” can be challenging.
    It is very likely something will have to change. This fear of changing something
    that is “already working” is a real obstacle towards writing tests for existing
    code.


    Because code is often written without any thought toward its testability in isolation,
    I find it very hard to offer anything more than generic advice. I do think examples
    of how to do this are very helpful. Lucky for us, I have one in mind.


    # ## What Is the Expected Behavior?


    Many, many years ago, I wrote some web-based tools to help with the administration
    of the tabletop baseball league I am a member of. We needed something to manage
    the various transactions that occur: trades, player signings, and roster moves.
    The code was originally written in 2005 and, I’m sad to say, I did not write any
    tests for it. I needed it done in a hurry, so I slapped together a prototype with
    a very bad interface. The prototype became the production version. It has undergone
    some revisions over the years (drag-and-drop interfaces to make trades), but much
    of the code remains the same.


    One of the parts of the application that has given me lots of problems is code
    that displays the “uncharted” status of a player. The league has rules about retaining
    players on your teams during seasons when they do not have a card representing
    them in the game that we use. We recently updated some of those rules, so I had
    to add code to make sure that whenever we were displaying details about a player,
    we were showing their “uncarded status” if it was applicable.


    Each player has a row in a table in a Postgres database. There is a field indicating
    the “season” a player was uncharted. This is a two-digit integer—19 to represent
    2019, for example. The display logic should be like this:


    Given I am player And I had uncarded status for this season Or I had uncharted
    status for last season When my details are shown I should see my name And I should
    see my uncarded status'
