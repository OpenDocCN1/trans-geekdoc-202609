    \ => 'TEST', 'display_name' => 'Curly']);\n```\n\nProphecy uses an API for mocks\
    \ where you specify the method you are expecting to be called and then specify\
    \ what will be returned by that specific call. Prophecy allows you to mock out\
    \ multiple calls so you can have the exact level of control you need.\n\nThe test\
    \ run fails...\n\n```\nProphecy\\Exception\\Call\\UnexpectedCallException : Unexpected\
    \ method call on Double\\Roster\\P1:\n  - updatePlayerTeam(\n      \"TESTMORE\"\
    ,\n      \"1\",\n      \"Trade TESTMORE 01/01\"\n    )\nexpected calls were:\n\
    \  - getById(\n      exact(1)\n    )\n  - getById(\n      exact(2)\n    )\n  -\
    \ getById(\n      exact(3)\n    )\n```\n\n... because you have not implemented\
    \ the updatePlayerTeam() test spies.\n\nNext, we have to create the expectations\
