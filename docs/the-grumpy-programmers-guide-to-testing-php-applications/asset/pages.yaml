- pgno: 102
  md: '# 12. METATESTING


    One of the interesting concepts to come out of competitive tournament play is
    the idea of the metagame. It’s the label which has been attached to the decks
    people choose and the strategies they are likely to use. High-level players (yes,
    there are even professional players) gain advantages by understanding the metagame
    for a tournament they are going to play in and trying to figure out what decks
    and strategies are most likely to give them an edge.


    What does this have to do with writing tests for your PHP code? We can take this
    concept of the metagame and apply it to testing practices. Clearly, there are
    some practices which are good, and some which are not-so-good. I want to examine
    some of these to help you find things that might lead to better outcomes for your
    application. Remember, what you are really trying to do with tests is to prevent
    regressions and make sure the application is useful to the people who are going
    to use it. Nothing else matters in the end.


    So what does the testing “metagame” look like from my perspective?


    # Mature Testing Tools Are Available


    PHP developers are spoiled for choice when it comes to testing tools. The gold
    standard for unit testing tools, PHPUnit (a testing tool that promotes the use
    of the xUnit testing pattern), is stable and mature. I don’t want to be “back
    in my day you had to do things both ways, uphill, in the snow,” but as I am writing
    this at the end of 2019, there is a great ecosystem surrounding PHPUnit and lots
    of tools that are both complementary and use PHPUnit as a base to build on.


    When you consider tools such as Behat (which is a testing tool that promotes the
    use of Behavioural-Driven Development for defining tests) or Codeception (a testing
    tool focused on using browser automation), it is clear there isn’t any real excuse
    for not adopting automated testing practices.


    While there is a tendency for developers to reinvent tools rather than modify
    existing ones, I think we’ve reached a point where there are some solid testing
    strategies which have been accepted by the PHP community. Pick a tool and get
    started.


    You can either write tests you can automate, or you can write tests that you can
    manually perform. Either way, you are writing tests. Why not get the computer,
    which has no biases about what parts of the application are important, to run
    the tests for you?


    Yes, there was a time when these tools were not easy to install, and there was
    not a lot of information available on how to use them in a comprehensive way.
    But not anymore.


    Test your code. It will save you time and money and allow you to focus on solving
    problems instead of fixing bugs that could’ve been prevented from making it into
    production.'
  merge: -1
  img_proc: true
- pgno: 103
  md: '# Open Source Drives Acceptance


    It is highly unlikely any open source code you rely on to get your day-to-day
    work done has no tests. Every popular web application framework for PHP has a
    comprehensive test suite along with instructions on how to run it. The database
    you use has comprehensive tests. The web server your application relies on has
    comprehensive tests.


    Personally, I avoid using third-party libraries which don’t have a test suite
    of their own. In my mind, it speaks volumes about the author(s) commitment to
    quality and longevity in their code.


    In fact, many projects won’t accept bug fixes without a test proving the fix works
    as expected. For people looking to get into contributing code to OSS projects,
    you’ll get a crash course in how tests are written by simply looking at the ones
    which already exist.


    # Proof Exists to Back the Promises


    In 2008, a paper was published about the impact of TDD, which looked at case studies
    conducted by Microsoft and IBM. You can find the study online[1].


    Several teams were given the same problem to solve via code. Some of those teams
    were asked to use TDD, others were not. The results of this study were very interesting
    and are actual evidence of the value writing tests for your code.


    I encourage you to read the actual paper (it’s only 14 pages), but the big takeaway
    is this: The projects using TDD had 40-90% fewer reported defects than ones who
    didn’t use it, but they took 15-35% longer to get the job done.


    If you are into using statistics to your advantage in discussions with people,
    it can be summarized as “for an extra day a week we can have up to 90% fewer bugs
    making it into production.” It’s a very powerful argument to make.


    # Testing Moves Bug Fixing to a Cheaper Part of the Cycle


    This particular concept was one which took me a few years to fully understand.
    Much like the argument about the benefit of TDD being fewer production bugs existing
    with a small increase in development time, the “shifting the cost” argument is
    a very powerful one.


    The cheapest time (in terms of developer time and resources committed) to find
    a bug in your code is during initial development and exploratory testing by the
    developer. If you practice TDD, you’re writing tests for how you expect the code
    to work and then writing code until those tests pass. Let’s call this cost X.


    [1] online: http://research.microsoft.com/en-us/groups/ese/nagappan_tdd.pdf'
  merge: -1
  img_proc: true
- pgno: 104
  md: '# 12. METATESTING


    Once the developer is “done,” the code then needs to move from a state of “development”
    to a state of “quality assurance.” This can take many forms, such as code review,
    a staging environment where the code changes are tested. The cost of finding a
    bug during code review could be anywhere from 2X to 10X.


    Why? Think about it–you now have to go back and verify not only the bug but ensure
    the code changes you have made won’t result in something else breaking. Then,
    you have to move the code back out of “development” and into “quality assurance”
    again. Don’t ever kid yourself; this process takes time and is often at the mercy
    of someone else’s schedule!


    Once you’re convinced your code is behaving as expected, it needs to be moved
    into a state of “deployed.” I can tell you from personal experience, the most
    expensive time to fix a bug is when it has been discovered by a third-party out
    in the wild. I think a conservative estimate is labeling this as 100X. In fact,
    let’s break this down even further.


    First, we have the emotional or “cultural” cost of the bug. Serious production
    bugs are often accompanied by an environment of panic, and many people chaotically
    trying to solve the same problem. I have worked for many companies which forced
    development teams to all stick around to solve a problem–even if you didn’t have
    anything to do with the problem and couldn’t help.


    If you get enough bugs reaching production, you could end up with deployments
    becoming super stressful. What happens then? Deployments move to being done outside
    of “normal” business hours–meaning you end up working either way later or way
    earlier than normal. “Everyone needs to be here in case there is a problem.” In
    other words, panicking over pushes to production becomes the “new normal” instead
    of being a non-issue as they should.


    The second cost of a production bug is the cost of lost opportunity. If you’re
    in charge of a team working on a project, you must instinctively understand every
    minute spent fixing a bug found in a released product is a minute not being spent
    advancing the project’s goals. The bug is preventing your team from refactoring
    old problems or implementing new features. This is a real cost and is very rarely
    considered.


    # Well-Documented Build Systems Encourage Continuous Deployment


    One of the reasons for committing so many resources towards automated tests is
    to create automated build systems which take the code that’s been written, run
    all the tests, and if they all pass automatically deploy the code (along with
    anything else required to support it).'
  merge: -1
  img_proc: true
- pgno: 105
  md: '# Well-Documented Build Systems Encourage Continuous Deployment


    When I first started figuring out how to make this happen, the tool of choice
    was Jenkins[2]. It''s a Java-based automation tool which is ridiculously flexible
    in how it can help you and has a high number of plugins available. Chances are,
    if there is something you want to do with Jenkins, someone has figured out how
    to do it with a plugin.


    The idea of build automation is to take things you normally do by hand as part
    of your deployment and testing process and automate those steps. After all, computers
    are great at doing what you''ve told them to do over and over again without complaining!
    Like with many things, once you''ve automated how your tests are run, you don''t
    have to think about it anymore. You can save your brainpower for things like making
    jokes in your company chat or trolling people on social media.


    Your options, however, are not limited to just Jenkins. A great alternative for
    those who don''t want to host their own CI server is to use services like Travis
    CI[3], CircleCI[4], or GitHub Actions[5]. These services allow you to replicate
    the process you go through when someone grabs your code and wants to run your
    tests. They all have their own particular syntax and quirks, but they all end
    up at the same place-a Git-centric system that can react to pull requests or merges
    and execute a series of steps that should end with your tests being run.


    For OpenCFP[6], I have started using GitHub Actions as my build automation tool.
    When I look at the configuration file for it, it does all the following things
    for me:


    +   - Checkout the code

    +   - Install the exact versions of PHP I want my tests to be run against

    +   - Install all my dependencies using Composer

