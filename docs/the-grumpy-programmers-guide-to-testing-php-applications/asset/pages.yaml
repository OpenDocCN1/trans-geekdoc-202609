    \ tool for testing purposes. Instead of using a mock created with the testing\
    \ frameworks tools, you instead create your own object that does the same thing\
    \ you are expecting from your dependency. Using the example of the test we just\
    \ wrote above, what would it look like if I decided I wanted to use a fake instead\
    \ of what Prophecy can provide me.\n\nThere are a few ways you can approach this.\
    \ You could create a standalone object outside of the test that extends the methods\
    \ we are creating doubles for. That might look like this:\n\n```\n```php\n<?php\n\
    declare(strict_types=1);\n\nclass FakeRosterModel\n{\n    public function getById($id):\
    \ array\n    {\n        $responses = [\n            0 => ['ibl_team' => 'TEST',\
    \ 'display_name' => 'Moe'],\n            1 => ['ibl_team' => 'TEST', 'display_name'\
    \ => 'Larry'],\n            2 => ['ibl_team' => 'TEST', 'display_name' => 'Curly'],\n\
    \        ];\n\n        return $responses[$id];\n    }\n\n    public function updatePlayerTeam(\n\
    \        $tblTeam, $playerId, $comments = \"\"): bool\n    {\n        return true;\n\
    \    }\n\n    public function makeInactive($player_id): bool\n    {\n        return\
    \ true;\n    }\n}\n```\n```"
