    11. $this->assertContains(''Test User'', (string) $response);

    ```

    ```


    I know I went through a lot of code, but go back and think about the basics of
    creating bootstrapping sequences for your tests:


    +   - Pay attention to dependencies set in the application itself

    +   - Create substitutes for those dependencies

    +   - Set them in your test setup


    Like so many other things, when you start writing tests for your code, design
    decisions which make building the application easier through global “application”
    objects often mean extra work when it comes time to test things.


    # Auto-Wiring Bootstrapping


    The examples in the previous section are for an older app using a pattern that
    is perhaps not so common with PHP web application frameworks that are popular
    as I write this in the winter of 2019-2020. OpenCFP has evolved as well to take
    advantage of the “most batteries included” approach Symfony takes. Instead of
    all that work (which is many lines of code that I have to support) of a custom
    bootstrapping sequence, I can use the application’s “kernel” to do all the work
    of creating dependencies for me.'
