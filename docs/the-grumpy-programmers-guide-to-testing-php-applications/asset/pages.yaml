- pgno: 34
  md: '# 5. Test Double


    This is a shorter way of saying an object with the same class signature as our
    dependency but with no expectations that any methods of that object will be called
    during the test.


    So, using the same code you’re trying to test, but now you are type-hinting on
    what the $db parameter is supposed to be, so you need to create that as a test
    stub. This time you are using Prophecy to do so.


    ```

    // Create a stub of the QueryFactory object the constructor needs

    $db = $this->prophesize(QueryFactory::class);

    $db->reveal();

    $rm = new Roster($db);

    ```


    In more clear language, what these two lines do is:


    +   - Create a test double object with the same class signature as a QueryFactory
    (so it is of the correct type)

    +   - Activate the double

    +   - Create a Roster object that accepts our test double as a constructor parameter


    # Mock Objects and Test Spies


    In this section, I am going to combine two types of test doubles because they
    are both going to be used in this test scenario.


    First, we have a mock object which is used for verifying “indirect output” of
    the tested code by first defining the expectations before the tested code is executed.


    A mock is the most common test double you will be using in your tests when you
    need a test double. Mocks are where we end up with very large amounts of code
    that is part of our arrange step.


    Second, we have a test spy, used for verifying “indirect output” of the tested
    code, by asserting the expectations afterward, without having defined the expectations
    before the tested code is executed. It helps in recording information about the
    indirect object created.


    Spies are used when you are expecting a method on a mock is going to be called,
    but you don’t need to worry about any side effects (meaning actions the code in
    question takes) that happen.


    In this example, you’re writing a test for some code that generates entries in
    our “transaction log.” This is code I have broken multiple times because I did
    not initially write tests for it. After some refactoring, here is the code you
    are going to test:'
