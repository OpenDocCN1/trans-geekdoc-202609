  md: '# 7. TEST-AFTER DEVELOPMENT BY EXAMPLE


    Sometimes circumstances dictate that you are writing tests after you have a working
    application. This doesn’t mean you can’t start writing tests. Just be prepared
    to make choices about your desired outcomes. You will likely have to change some
    code to make things testable. You will discover that some things don’t work the
    way you thought they did.


