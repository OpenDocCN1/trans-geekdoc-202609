  md: '# Chapter


    # 4


    # How PHPUnit Works


    # High-Level Overview


    While PHPUnit wasn’t the first testing framework I used (that honor belongs to
    SimpleTest), it is the framework I use most often. There are many other tools
    out there for testing your code, but I keep coming back to PHPUnit for the simplicity
    of its approach and the wide variety of add-ons others have created to make it
    even more useful.'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# 4. How PHPUnit Works


    PHPUnit is a collection of tools consisting of a testing framework and some command-line
    utilities which allow you to run tests written in PHP. Originally developed by
    Sebastian Bergmann, it has grown to have many contributors and is still under
    active development.


    PHPUnit uses what is known as the xUnit architecture for its tools. xUnit has
    a number of conventions which lead you to build tests a specific way through the
    use of assertions. Assertions (a built-in feature of PHP) are statements which
    assert that a particular condition is true or false, depending on the goal of
    the testing scenario you have created.


    The Wikipedia article on xUnit contains a nice summary, but here are the parts
    we need to worry about:


    +   - test runner

    +   - test cases

    +   - test suites


    Before we can look at those, we need to install PHPUnit.


    # How Do We Install PHPUnit?


    The PHPUnit website is the best source of truthiness for anything to do with PHPUnit.
    Before you install it, make sure to check the website for any requirements. As
    I am writing this book, the current version of PHPUnit is 8.4. Assuming you have
    met the minimum requirements for it, there are two ways to install PHPUnit.


    # Install via PHP Archive (PHAR)


    The PHAR version of PHPUnit is a binary you download and install somewhere in
    your path. To use it, you must also have the phar extension installed and enabled
    for PHP. PHPUnit recommends downloading the PHAR version and making it available
    locally for your project as opposed to being installed globally.


    PHPUnit also recommends not having PHPUnit installed in a production environment.
    Tools with CLI (command-line interface) components can be exploited through vulnerabilities
    in other libraries, and there is a non-zero chance that a determined attacker
    can learn something from seeing the output of the test run.


    I am not a security expert, but why give people opportunities to mess around with
    your application?'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# Install via Composer


    Composer is the PHP community''s tool for installing PHP-related packages and
    their associated dependencies. It is highly recommended to install PHPUnit using
    Composer as a development-time dependency only. Again, we want to avoid installing
    anything to do with PHPUnit in production.


    Assuming you have installed Composer, you can add PHPUnit to your project with
    the following CLI command via your shell. This will install any version of PHPUnit
    that is 8.4 and above that fits with your current dependencies.


    ```

    composer require --dev phpunit/phpunit ^8.4

    ```


    With PHPUnit installed, we can take a look at how to execute the test cases you''re
    going to write.


    # The PHPUnit Test Runner


    The test runner is a CLI tool used to execute your test cases and report back
    the results of those tests. To use PHPUnit, you need to become familiar with using
    CLIs for your operating system of choice.


    The test runner has a number of parameters you should be aware of. Like many powerful
    tools, there are a wide range of options; you will find yourself using only a
    small subset of those available.


    At its most basic, you use the command phpunit from your shell (this assumes you
    either specify the complete path to where phpunit is, or it''s in your shell''s
    execution path). It then starts recursive searching from either your current directory
    (the default) or from the path you specify for files with a .php extension.


    If those files contain an object that extends from one of PHPUnit''s base test
    case classes, PHPUnit then tries to execute any class methods it recognizes as
    tests. By default, it assumes any method starting with test is supposed to be
    a test case, and tries to execute the code in it. You can also use DocBlocks with
    annotations in them to indicate a class method is supposed to be a test. There
    are some examples of this later in the book.


    The test runner will execute those tests, continuing to try and execute anything
    it thinks it is a test until it cannot find any more of them.


    Here''s a little demonstration of how the runner works. First, you need to create
    the simplest test case possible. Don''t worry; you''ll get into the basics of
    test cases later in the book. We just need a placeholder for now. Once you have
    PHPUnit installed, create the following file and call it BasicTestCase.php'
  merge: -1
  img_proc: true
- pgno: 24
  md: "# 4. How PHPUnit Works\n\n```\n```php\n<?php\n\ndeclare(strict_types=1);\n\n\
    class BasicTestCase extends PHPUnit\\\\Framework\\\\TestCase\n{\n    public function\
    \ testCase()\n    {\n        $this->assertTrue(false);\n    }\n}\n```\n```\n\n\
    Next, use the CLI test runner. You should get something very similar to the following\
    \ output:\n\n```\n```\n> phpunit BasicTestCase.php\nPHPUnit 8.3.4 by Sebastian\
    \ Bergmann and contributors.\n\nF                                      1 / 1\n\
    (100%)\n\nTime: 91 ms, Memory: 12.00 MB\n\nThere was 1 failure:\n\n1) BasicTestCase::testCase\n\
    Failed asserting that false is true.\n\n/Users/chartjes/grumpy-guide/test/basic_test_case.php:9\n\
    \nFAILURES!\nTests: 1, Assertions: 1, Failures: 1.\n```\n```\n\nAs you can see,\
    \ the test runner tells us:\n\n+   - The status of the test (in this case F for\
    \ fail)\n+   - How long it took\n+   - How much memory was consumed\n+   - Outlines\
    \ the exact failure and helpfully includes the line\n+   - How many tests and\
    \ how many assertions it contains"
