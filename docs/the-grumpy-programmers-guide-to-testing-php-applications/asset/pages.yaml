  md: "The test fails (as it should!)\n\n```\nTypeError : Return value of Double\\\
    Roster\\P1::getById() must be of the type array, null returned\n```\n\nNow go\
    \ back and implement the expected calls and return values on your mock. First,\
    \ the getById() calls:\n\n```\n$rm->getById(1)\n    ->willReturn(['ibl_team' =>\
    \ 'TEST', 'display_name' => 'Moe']);\n$rm->getById(2)\n    ->willReturn(['ibl_team'\
