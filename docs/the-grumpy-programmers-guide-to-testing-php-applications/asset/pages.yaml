    \ is using code I have written a test for to confirm an edge case (Is this player\
    \ uncarded?) is being correctly handled.\n\nAs you get deeper into writing tests\
    \ for an existing application, you will find this approach to be very useful:\n\
    \n+   - What behavior am I testing for?\n+   - What does the code that handles\
    \ this behavior look like?\n+   - What would a test for the behavior look like?\n\
    +   - What dependencies do we have?\n+   - Do those dependencies need to change\
    \ or can we use the real thing?\n+   - Do we need to challenge assumptions about\
    \ how the code actually works?\n+   - Do we need to change the code to make our\
    \ test pass?\n+   - Do we have a test that passes?\n\nIn the examples above, you\
    \ can see I followed every one of those steps. I have often told folks that testing\
    \ is all about focusing on small bits of work and iterating on them until a single\
    \ question is answered: Does this specific code display this specific behavior\
