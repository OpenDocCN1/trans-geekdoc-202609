- pgno: 90
  md: "# 10. DATA PROVIDERS\n\nOne of the earliest lessons I learned when I started\
    \ writing comprehensive test suites was to always look for duplication in your\
    \ tests. Here’s an example of a situation where this can happen.\n\nYou might\
    \ be familiar with the FizzBuzz problem[1] problem, if only because it is sometimes\
    \ presented as a problem to be solved as part of an interview. It is a good problem\
    \ because it touches on a lot of really elementary basics of programming—you need\
    \ to understand loops, collections, and conditional statements.\n\nWhen you write\
    \ tests for FizzBuzz, what you want to do is pass it a set of values and verify\
    \ they are FizzBuzzed correctly. This could result in you having multiple tests\
    \ that are the same, except for the values you are testing with. Data providers\
    \ give you a way to simplify that process.\n\nA data provider is a way to create\
    \ multiple sets of testing data which can be passed in as parameters to your test\
    \ method. You create a method that is available to the class your tests are in\
    \ that returns an array of values matching the parameters you are passing into\
    \ your test.\n\nIt sounds more complicated than it really is; let’s look at an\
    \ example.\n\n# Look at All Those Tests\n\nIf you didn’t know about data providers,\
    \ what might your FizzBuzz tests look like?\n\n```\n```php\n<?php\nclass FizzBuzzTest\
    \ extends PHPUnit\\Framework\\TestCase\n{\n    public function setup()\n    {\n\
    \        $this->fb = new FizzBuzz();\n    }\n\n    public function testGetFizz()\n\
    \    {\n        $expected = 'Fizz';\n        $input = 3;\n        $response =\
    \ $this->fb->check($input);\n        $this->assertEquals($expected, $response);\n\
    \    }\n}\n```\n```\n\n[1] FizzBuzz problem: <http://en.wikipedia.org/wiki/FizzBuzz>"
