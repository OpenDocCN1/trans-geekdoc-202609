- pgno: 47
  md: '# Chapter 6


    # Test-Driven Development by Example


    In an idealized world of software development, you would be writing all the code
    for your applications using Test-Driven Development (TDD), implementing features,
    and deciding on APIs and interfaces one test at a time. The way I use TDD follows
    this type of workflow:


    +   - Create an empty test that fails

    +   - Write out my testing scenario as pseudocode

    +   - Turn the pseudocode into a PHPUnit test

    +   - Run the test

    +   - If it fails, keep writing code until the behavior I am testing passes'
  merge: -1
