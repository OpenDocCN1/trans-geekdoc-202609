- pgno: 139
  md: '# Lost Opportunity Costs


    But what if there were some tests? I''m willing to bet the introduced bug would
    have a very high chance of getting caught before the code gets to the reviewer.
    Chances are the review goes more smoothly and costs less in time and resources.


    Now, if a bug is found during manual testing by QA, well, the cost to fix it is
    now significantly higher. Consider that this is now the flow:


    +   - Developer implements feature, no bugs found

    +   - Code is reviewed, no bugs found

    +   - QA finds bug

    +   - Developer goes back, hopefully, fixes the bug

    +   - Code is reviewed, no bugs found

    +   - QA does not find a bug


    That''s three extra steps, and those steps are not free in terms (again, I can''t
    stress this enough) of time and/or money.


    Let''s say the code makes it all the way into production, and there''s a bug found
    by the customer. The cost of fixing this could be cheap:


    +   - Developer implements feature, no bugs found

    +   - Code is reviewed, no bugs found

    +   - QA does not find bug

    +   - Customer finds the bug

    +   - Developer goes back, hopefully, fixes the bug

    +   - Code is reviewed, no bugs found

    +   - QA does not find a bug

    +   - Customer does not find a bug


    That was eight steps in total, but sometimes there are bugs that are really expensive.
    They could cost you ten times what the developer''s time costs. It might even
    ruin your company. I''m fortunate that only once in my career did I release code
    into production with a bug so bad the whole application got taken down. It was
    not a pleasant experience.


    So, the lack of tests is not only causing you to spend more money to fix bugs
    as they show up in more expensive parts of the process, having to go back and
    fix those bugs is actually causing you to miss out on other work.'
  merge: -1
  img_proc: true
- pgno: 140
  md: '# 17. “You’re Not Getting Paid to Test!”


    What about new features? Can’t — fixing bugs. What about going back and refactoring
    some code to use a new library? Can’t — fixing bugs. What about some custom work
    for a client? Can’t — fixing bugs.


    I’m sure you’re starting to spot a theme here.


    The value of having your developers write tests that can be automated is that
    you are far more likely to find bugs before they get into production. That is
    the ultimate goal of testing– moving code swiftly out of the developer’s environment
    and into production where it is fulfilling the goals of the application.'
