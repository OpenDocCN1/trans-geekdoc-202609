    # 4.2 The Rise of Multi-layer Neural Networks


    Despite these features, the Perceptron has clear limitations. It cannot solve
    problems where the data is not linearly separable, like the XOR problem. The XOR
    problem is a classic example where the output is 1 if the inputs are different
    and 0 if they are the same, which a single-layer Perceptron cannot solve.


    ![](image_rsrc31U.jpg)


    The Perceptron’s limitations do not stop there. It can only work with linearly
    separable data, but many real-world problems involve nonlinear data patterns.
    Therefore, the Perceptron alone is insufficient for solving complex problems.


    In 1969, psychologists Marvin Minsky and Seymour Papert proved mathematically
    in their book "Perceptrons" that while a Perceptron can solve AND, OR, and NOR
    gates, it cannot solve the XOR gate. This led to a decline in neural network research
    during the 1970s as interest waned.


    However, some researchers believed in the potential of neural networks and continued
    their work. Notable figures include David Rumelhart, Geoffrey Hinton, and Ronald
    Williams. Their research led to the development of Multi-layer Neural Networks,
    which marked a turning point in neural network research.


    # 4.3 Structure of Multi-layer Neural Networks


    ![](image_rsrc31V.jpg)


    A Multi-layer Neural Network consists of an input layer, one or more hidden layers,
    and an output layer. The more hidden layers there are, the more complex data the
    network can process. Multi-layer networks can solve problems that cannot be linearly
    separated, which is the fundamental concept of deep learning. More layers make
    the network deeper, hence the term "deep learning."


    ![](image_rsrc31W.jpg)


    Intuitively, while a single line cannot classify some datasets, multiple lines
    can. By connecting multiple Perceptrons and adding more layers, a Multi-layer
    Neural Network can handle non-linear problems. Each layer extracts different features
    from the input data, and these features combine to form the final output.


    So, the core idea of multi-layer neural networks is to use multiple layers to
    gradually transform the input data and introduce non-linearity through hidden
    layers, allowing the network to learn complex patterns. Each hidden layer extracts
    specific features from the input data, and these features combine to produce the
    final output.


    For instance, in recognizing handwritten digits, the first hidden layer might
    extract basic lines and curves, the second layer might combine these to form shapes,
    and the final layer recognizes the digit. Multi-layer Neural Networks learn through
    backpropagation, which adjusts the weights to minimize the error between the predicted
    and actual outputs.


    # 4.4 Summary


    The Perceptron is useful as a linear classifier but has limitations with non-linear
    problems like the XOR problem. To overcome these limitations, Multi-layer Neural
    Networks were developed, consisting of input, hidden, and output layers. These
    networks transform input data through multiple layers, introducing non-linearity
    to learn complex patterns. For example, in handwritten digit recognition, different
    layers extract various levels of features, leading to accurate digit recognition.
    Learning in Multi-layer Neural Networks is achieved through backpropagation, adjusting
    weights to minimize prediction errors, allowing them to solve complex problems.


    Chapter 5


    Activation Functions


    # 5.1 Limitations of the Step Function


    In the previous chapter, we introduced the step function as an activation function.
    The step function outputs 0 if the input is below a certain threshold and 1 if
    it is above that threshold, making it a nonlinear function. However, this function
    has a critical drawback: it does not provide a way to measure the degree of error.


    A perceptron operates by receiving input values, and if these values surpass a
    certain threshold, the perceptron fires. The step function offers a simple form
    of non-linearity by outputting 1 if the input sum exceeds 0.5 and 0 otherwise.
    While this simplicity helps in understanding the basic concept of perceptrons,
    it creates several issues during the learning process.


    ![](image_rsrc31X.jpg)


    Let’s discuss an example from the previous chapter. When a perceptron with an
    internal value of 0.36 uses the step function, the output is 0. After updating
    the weights and using the same input values, the internal value changes to 0.37,
    which is closer to the threshold of 0.5. However, due to the step function’s nature,
    values below the threshold all produce an output of 0. Therefore, whether the
    internal value is 0.36 or 0.37, the output remains 0.


    ![](image_rsrc31Y.jpg)


    In more extreme cases, internal values such as 0.001 or 0.4999 will still result
    in an output of 0. Clearly, 0.4999 is a better prediction than 0.001, but this
    difference is ignored, and both are considered equally erroneous with an error
    of 1.


    # 5.2 Sigmoid Function


    Let’s start by looking at the sigmoid function.


    ![](image_rsrc31Z.jpg)


    The sigmoid function has an S-shaped curve, making it smoother than the step function.
    The mathematical formula for the sigmoid function is:


    ![](image_rsrc320.jpg)


    One of the main advantages of the sigmoid function is that it can represent differences
    in internal values, which the step function cannot. The sigmoid outputs values
    between 0 and 1 based on the input value. This range allows for more nuanced error
    calculations compared to the binary output of the step function.


    The sigmoid function can also transform internal values of a neural network into
    probabilities. For example, if the output value is 0.8, it can be interpreted
    as the network predicting a certain class with an 80% probability. Additionally,
    the sigmoid function normalizes the input values, ensuring that each node''s output
    falls between 0 and 1. This helps stabilize the neural network and aids in the
    convergence during the learning process.


    # Vanishing Gradient Problem


    The sigmoid function is certainly an improvement over the step function, but it
    also has some notable weaknesses. The most significant issue is that the gradient
    (slope) of the function approaches zero at both ends of the curve. This is one
    of the primary drawbacks of the sigmoid activation function. But why is having
    a gradient close to zero at the extremes problematic?


    ![](image_rsrc321.jpg)


    The reason is that, as you can see here, even if the input values change significantly,
    the difference in output values is minimal. This is a problem similar to the one
    seen with the step function. With the step function, whether the input is 0.499
    or 0.001, the output is 0. In other words, the problem with the step function
    is that differences in input values are not effectively reflected in the output.
    Unfortunately, the sigmoid function also exhibits this issue at its extreme ends.


    ![](image_rsrc322.jpg)'
