  trans: "\n\n```python\nreturn x * (1 - x)\n```\n\n# 均方误差损失函数\n\n```python\ndef mse_loss(y_true,\
    \ y_pred):\n    return np.mean((y_true - y_pred) ** 2)\n```\n\n# 生成训练数据\n\n```python\n\
    def gen_training_data(data_points):\n    x1 = np.random.random(data_points)\n\
    \    x2 = np.random.random(data_points)\n    y = ((x1 + x2) > 1).astype(int) #\
    \ 线 x1 + x2 = 1 之上的点标记为 1，其他为 0\n    X = np.column_stack((x1, x2))\n    return\
    \ X, y\n```\n\n# 初始化参数\n\n```python\nnp.random.seed(42)\ninput_nodes = 2\nhidden_nodes\
    \ = 2\noutput_nodes = 1\nlearning_rate = 0.1\nepochs = 10000\n```\n\n# 权重和偏置初始化\n\
    \n```python\nw_ih = np.random.rand(input_nodes, hidden_nodes)\nw_ho = np.random.rand(hidden_nodes,\
    \ output_nodes)\nb_h = np.random.rand(hidden_nodes)\nb_o = np.random.rand(output_nodes)\n\
    ```\n\n# 训练数据\n\n```python\nX, y = gen_training_data(100)\ny = y.reshape(-1, 1)\n\
    ```\n\n# 训练 MLP\n\n```python\nfor epoch in range(epochs):\n    # 前向传播\n    hidden_input\
    \ = np.dot(X, w_ih) + b_h\n    hidden_output = sigmoid(hidden_input)\n    final_input\
    \ = np.dot(hidden_output, w_ho) + b_o\n    final_output = sigmoid(final_input)\n\
    \    # 计算损失\n    loss = mse_loss(y, final_output)\n    # 反向传播\n    error = y -\
    \ final_output\n    d_final_output = error * sigmoid_derivative(final_output)\n\
    \    error_hidden_layer = d_final_output.dot(w_ho.T)\n    d_hidden_output = error_hidden_layer\
    \ * sigmoid_derivative(hidden_output)\n    # 更新权重和偏置\n    w_ho += hidden_output.T.dot(d_final_output)\
    \ * learning_rate\n    b_o += np.sum(d_final_output, axis=0) * learning_rate\n\
    \    w_ih += X.T.dot(d_hidden_output) * learning_rate\n    b_h += np.sum(d_hidden_output,\
    \ axis=0) * learning_rate\n    if epoch % 1000 == 0:\n        print(f\"Epoch {epoch},\
    \ Loss: {loss}\")\n```\n\n# 测试 MLP\n\n```python\ntest_data, test_labels = gen_training_data(10)\n\
    test_labels = test_labels.reshape(-1, 1)\nhidden_input = np.dot(test_data, w_ih)\
    \ + b_h\nhidden_output = sigmoid(hidden_input)\nfinal_input = np.dot(hidden_output,\
    \ w_ho) + b_o\nfinal_output = sigmoid(final_input)\nprint(\"测试预测:\")\nprint(final_output)\n\
    print(\"测试标签:\")\nprint(test_labels)\n```\n\n### 代码解释：\n\n1. **Sigmoid 函数及其导数**：\n\
    \   - `sigmoid(x)`：Sigmoid 激活函数。\n   - `sigmoid_derivative(x)`：Sigmoid 函数的导数，反向传播过程所必需的。\n\
    2. **损失函数**：\n   - `mse_loss(y_true, y_pred)`：均方误差（MSE）损失函数。\n3. **生成训练数据**：\n\
    \   - `gen_training_data(data_points)`：生成输入数据和标签。\n4. **初始化参数**：\n   - 定义输入节点、隐藏节点、输出节点、学习率和迭代轮数（epochs）。\n\
    \   - 初始化权重 `w_ih`、`w_ho` 和偏置 `b_h`、`b_o`。\n5. **训练过程**：\n   - 对每个 epoch 执行前向传播和反向传播。\n\
    \   - **前向传播**：使用输入数据计算隐藏层和输出层的输出。\n   - **计算损失**：计算输出值与真实值之间的误差。\n   - **反向传播**：计算输出层和隐藏层的误差，然后更新权重和偏置。\n\
    6. **MLP 测试**：\n   - 生成新的测试数据并输出 MLP 的预测结果。\n\n这段代码有助于理解多层感知器（MLP）的训练过程和反向传播步骤。通过打印每个\
    \ epoch 的损失值，你可以跟踪训练过程的进度。\n\n# 7.5 总结\n\n反向传播算法由 David E. Rumelhart、Geoffrey\
    \ E. Hinton 和 Ronald J. Williams 于 1986 年开发，是一项关键技术，使深层神经网络（如多层感知机）的训练成为可能。反向传播计算神经网络输出与真实值之间的误差，然后利用链式法则通过该误差调整每一层的权重。在像\
    \ MNIST 等大型数据集上进行训练时，反向传播算法是关重要的。该算法涉及通过前向传播计算输出，使用损失函数计算误差，然后通过反向传播更新权重。通过重复这一过程，算法逐渐减少误差并找到权重。如果没有反向传播算法，我们今天看到的深度学习和人工智能进展将是不可能的。\n\
    \n# 第 8 章：神经网络的应用\n\n神经网络广泛应用于各个领域，其应用不断扩大。在这里，我们将通过实例来介绍神经网络的典型用途及其有效性。\n\n##\
    \ 8.1 神经网络在各领域的应用示例\n\n### 图像识别\n\n- **医学图像分析**：神经网络用于诊断图像中的疾病。例如，使用卷积神经网络（CNN）分析\
    \ MRI 或 X 光图像检测癌症和其他疾病。CNN 在学习图像空间结构方面非常有效，使图像分析具有高准确性。\n- **自动驾驶**：自动驾驶车辆使用 CNN\
    \ 识别标志、行人和其他车辆。这有助于规划路线并防止碰撞。例如，特斯拉的自动驾驶系统分析道路状况并控制车辆。\n\n### 语音识别\n\n- **虚拟助手**：语音识别在\
    \ Siri、Google Assistant 和 Alexa 等虚拟助手中起着关键作用。利用神经网络，它可以将用户的语音转换为文本并执行命令。这项技术极大提高了用户的便利性，允许通过语音命令完成各种任务。\n\
    - **医疗记录**：当医生口头记录病情时，神经网络可以将其转换为文本存储在电子记录系统中。这提高了医疗人员的效率，并有助于准确记录病情。\n\n### 自然语言处理（NLP）\n\
    \n- **聊天机器人**：聊天机器人常用于客户服务，通过神经网络处理自然对话。例如，它们能为用户问题提供合适的答案并检索必要信息。它们广泛应用于银行和电子商务等行业，提供了\
    \ 24 小时支持。\n- **翻译**：基于 NLP 的神经网络进行各种语言之间的翻译。例如，谷歌翻译使用神经网络理解句子含义并准确地翻译成其他语言。这促进了顺畅的国际交流并有助于打破语言障碍。\n\
    \n## 8.2 案例\n\n### AlphaGo\n\nGoogle DeepMind 的 AlphaGo 是一种下围棋的人工智能，它结合了神经网络和强化学习算法，击败了人类顶级。AlphaGo\
    \ 的成功证明了神经网络在复杂策略游戏中的卓越性能。通过从数百万局棋记录中学习，AlphaGo 提升了独立下棋的能力。\n\n### Facebook 人脸识别\n\
    \nFacebook 使用神经网络识别并标记用户照片中的脸部，增强了用户体验并提供了自动照片整理功能。Facebook 的 DeepFace 算法实现了 97%\
    \ 的脸识别准确率，接近人类的识别能力。\n\n"
