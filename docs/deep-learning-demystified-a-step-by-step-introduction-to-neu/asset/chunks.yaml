    # 6.4 Summary


    Gradient Descent is an optimization algorithm used in machine learning and deep
    learning to find the optimal parameters of a model by minimizing the loss function.
    The loss function measures the difference between the model''s predicted values
    and the actual values, with common examples being MSE, MAE, and cross-entropy.
    Gradient Descent works by calculating the gradient of the loss function and iteratively
    updating the parameters to move towards the point where the gradient is zero,
