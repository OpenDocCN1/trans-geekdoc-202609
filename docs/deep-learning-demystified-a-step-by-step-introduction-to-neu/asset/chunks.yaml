    # 3.3 带注释的 Python 简单感知机示例\n\n```python\nimport numpy as np\nimport matplotlib.pyplot\
    \ as plt\nfrom matplotlib.animation import FuncAnimation\n\n# 二分类的阶跃函数\ndef step_function(x,\
    \ threshold):\n    return 1 if x >= threshold else 0\n\n# 生成训练数据\ndef gen_training_data(data_points):\n\
    \    x1 = np.random.random(data_points)\n    x2 = np.random.random(data_points)\n\
    \    y = ((x1 + x2) > 1).astype(int)  # x1 + x2 = 1 以上的点标记为 1，其余为 0\n    return\
    \ [((x1[i], x2[i]), y[i]) for i in range(len(x1))]\n\n# 带动画的感知机训练函数\ndef perceptron_animation(data_points=100,\
    \ epochs=10, learning_rate=0.1, threshold=0.5):\n    global w\n    w = np.array([0.3,\
    \ 0.9])  # 初始权重\n    training_set = gen_training_data(data_points)\n    fig, ax\
    \ = plt.subplots()\n    plt.ylim((-0.1, 1.1))\n    plt.xlim((-0.1, 1.1))\n   \
    \ ax.set_aspect('equal', adjustable='box')\n    xx = np.linspace(0, 1, 50)\n \
    \   # 绘制训练数据点\n    for x, y in training_set:\n        if y == 1:\n           \
    \ ax.plot(x[0], x[1], 'bo')  # 类 1\n        else:\n            ax.plot(x[0], x[1],\
    \ 'go')  # 类 0\n\n    def update(epoch):\n        global w\n        for x, y in\
    \ training_set:\n            u = np.dot(w, x)\n            output = step_function(u,\
    \ threshold)\n            error = y - output\n            w += learning_rate *\
    \ error * x\n        ax.clear()\n        for x, y in training_set:\n         \
    \   if y == 1:\n                ax.plot(x[0], x[1], 'bo')\n            else:\n\
    \                ax.plot(x[0], x[1], 'go')\n        \n        line_data = np.array([xx,\
    \ (1 - w[0] * xx) / w[1]])\n        ax.plot(line_data[0], line_data[1], 'r-')\n\
    \        ax.ylim(-0.1, 1.1)\n        ax.xlim(-0.1, 1.1)\n\n    ani = FuncAnimation(fig,\
    \ update, frames=epochs, interval=500)\n    plt.show()\n\n# 主函数\nif __name__ ==\
    \ '__main__':\n    perceptron_animation()\n```\n\n# 3.4 总结\n\n感知机学习算法解释了如何调整神经网络中的权重（连接强度）以获得期望输出。该过程包括权重初始化、输出计算、误差计算和权重更新，这些步骤是重复的。感知机是深度学习的基础，并在解决复杂问题中起着重要作用。\n\
