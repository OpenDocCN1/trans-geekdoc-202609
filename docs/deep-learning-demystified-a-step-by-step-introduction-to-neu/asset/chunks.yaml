    # 2.1 Structure and Function of Neurons


    ![](image_rsrc2ZW.jpg)


    The human brain is composed of approximately 100 billion neurons. Although the
    structure and function of the brain are exceedingly complex, the basic unit that
    makes up this intricate system is relatively simple. This fundamental unit is
    called a neuron. Neurons play crucial roles in receiving inputs, processing information,
    and transmitting outputs.


    ![](image_rsrc2ZX.jpg)


    Neurons can be divided into three main parts:


    1.  Dendrite: Dendrites are the input parts of the neuron. They receive signals
    from other neurons. Dendrites branch out like tree branches, allowing them to
    connect with many other neurons and receive numerous signals.


    2.  Soma (Cell Body): The soma is the central part of the neuron. It processes
    the signals received by the dendrites. The soma integrates the incoming signals,
    and if the combined signal strength exceeds a certain threshold, it triggers an
    electrical impulse. This process is known as firing.


    3.  Axon: The axon is the output part of the neuron. It transmits the processed
    signal from the soma to other neurons. The axon extends from the soma and can
    be quite long, reaching different parts of the body. At its end, the axon branches
    out to form connections with the dendrites of other neurons, creating a structure
    known as a synapse.


    ![](image_rsrc2ZY.jpg)


    The transmission of signals between neurons occurs at the synapse. A synapse is
    a junction where the axon terminal of one neuron meets the dendrite of another.
    When an electrical impulse reaches the end of an axon, it triggers the release
    of neurotransmitters, which are chemical messengers. These neurotransmitters cross
    the synaptic gap and bind to receptors on the dendrites of the receiving neuron.
    This binding converts the chemical signal back into an electrical impulse in the
    receiving neuron, allowing the signal to continue its journey.


    This process of signal transmission is extremely rapid and precise, enabling the
    brain to process vast amounts of information and perform a wide range of functions.
    For example, when you touch a hot surface, sensory neurons in your skin send signals
    to your brain, which then processes this information and quickly sends a signal
    through motor neurons to your muscles to pull your hand away. This entire process
    happens almost instantaneously, showcasing the remarkable efficiency and speed
    of neuronal communication.


    Neurons are also capable of forming complex networks. Through learning and experience,
    the connections between neurons can strengthen or weaken, a property known as
    synaptic plasticity. This ability to change and adapt is fundamental to learning,
    memory, and overall brain function. It allows the brain to store information,
    learn new skills, and adapt to new situations.


    In summary, the neuron, despite its simplicity, is a highly efficient and essential
    component of the brain''s function. Its structure, consisting of dendrites, soma,
    and axon, enables it to receive, process, and transmit information rapidly. The
    synapse plays a critical role in neuron-to-neuron communication, ensuring that
    signals are transmitted accurately and swiftly across the neural network. This
    intricate system of neurons working together allows the brain to perform complex
    tasks, from basic reflexes to higher-order cognitive functions such as thinking,
    learning, and memory.


    # 2.2 Structure and Function of Artificial Neurons


    Artificial neurons are computer models that mimic the information processing of
    biological neurons. Artificial neurons receive inputs, perform calculations based
    on these inputs, and generate outputs. When multiple artificial neurons are combined,
    they form an artificial neural network (ANN), which can process various input
    data, learn from it, and solve complex problems.


    ![](image_rsrc2ZZ.jpg)


    To understand how an artificial neuron works, let’s look at a simple example.
    Suppose an artificial neuron receives three inputs and calculates a threshold
    to determine the output. Let the inputs be ![](image_rsrc300.jpg), ![](image_rsrc301.jpg),
    and ![](image_rsrc302.jpg), and the weights (which act like synapses) be ![](image_rsrc303.jpg),
    ![](image_rsrc304.jpg), and ![](image_rsrc305.jpg). The neuron calculates a node
    value using these inputs and weights and then determines the output.


    ![](image_rsrc306.jpg)


    For example, if the input values are ![](image_rsrc307.jpg), ![](image_rsrc308.jpg),
    and ![](image_rsrc309.jpg), and the weights are ![](image_rsrc30A.jpg), ![](image_rsrc30B.jpg),
    and ![](image_rsrc30C.jpg), the output value ![](image_rsrc30D.jpg)is calculated
    as follows:


    ![](image_rsrc30E.jpg)![](image_rsrc30F.jpg)![](image_rsrc30G.jpg)![](image_rsrc30H.jpg)


    So, the output value ![](image_rsrc30D.jpg)is 0.69.


    ![](image_rsrc30J.jpg)


    Just as a biological neuron fires when the input value exceeds a certain threshold,
    an artificial neuron also sets a threshold (here, 0.5) to decide whether to fire.
    The activation function is a function that determines the output value based on
    the input value. Among several activation functions, the step function is used
    here: it outputs 1 if the input value is above the threshold and 0 otherwise.
    For example, if the calculated node value is 0.69 and the threshold is 0.5, the
    output value is 1.


    # 2.3 Perceptron


    The perceptron is an artificial neural network model based on the work of neurophysiologist
    McCulloch and computational neuroscientist Pitts in 1943. It was implemented by
    psychologist Rosenblatt in 1958. The perceptron is a simple form of an artificial
    neuron and serves as the foundation for all deep learning models. It works by
    summing the weighted inputs and passing the result through an activation function
    to produce an output.


    The learning method of a perceptron is straightforward. If the output differs
    from the actual value, it calculates the error and adjusts the weights accordingly.
    By repeating this process, the perceptron optimizes the weights, allowing it to
    produce correct outputs for given inputs.


    # 2.4 Summary


    A neuron is the basic unit of the human brain, consisting of dendrites that receive
    input, a soma that processes signals, and an axon that transmits output. Neurons
    communicate through synapses, and this information processing mechanism is mimicked
    by artificial neurons. Artificial neurons generate outputs based on input values
    and weights. The perceptron is a simple form of an artificial neuron, calculating
    output by summing weighted inputs and applying an activation function. It learns
    by adjusting weights to minimize the error between the actual and predicted outputs.
    This basic principle of artificial neural networks forms the foundation of deep
    learning.


    Chapter 3


    Perceptron Learning Algorithm


    # 3.1 Learning Process of Artificial Neural Networks


    The perceptron learning algorithm, though relatively simple, forms the foundation
    for learning algorithms in deep learning models.


    ![](image_rsrc30K.jpg)


    Learning involves adjusting the weights to produce the desired output. When the
    neural network''s output differs from the actual value, this difference is called
    the error. To minimize the error, the weights are adjusted accordingly.


    The learning process of a perceptron consists of the following steps:


    1.  Initialization: Initialize the weights with random values.


    2.  Output Calculation: Calculate the output using the input values and the initial
    weights.


    3.  Error Calculation: Compute the error by finding the difference between the
    output and the actual value (true label).


    4.  Weight Update: Adjust the weights to minimize the error using the following
    formula:


    ![](image_rsrc30M.jpg)![](image_rsrc30N.jpg)


    Here, ![](image_rsrc30P.jpg)is the learning rate, which controls the magnitude
    of weight changes. ![](image_rsrc30R.jpg)is the actual value, ![](image_rsrc30S.jpg)is
    the predicted value, and ![](image_rsrc30T.jpg)is the input value.'
