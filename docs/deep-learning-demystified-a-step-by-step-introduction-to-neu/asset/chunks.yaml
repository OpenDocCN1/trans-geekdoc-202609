    \n根据此误差更新权重。假设学习率![](img/image_rsrc30P.jpg)为 `0.01`，权重更新如下：\n\n![](img/image_rsrc315.jpg)(image_rsrc316.jpg)(image_rsrc317.jpg)(image_rsrc318.jpg)(image_rsrc31A.jpg)\n\
