  trans: '

    这个问题很容易出现在使用 `sigmoid` 函数作为激活函数的深度学习模型中。如图所示，神经网络的上层是下层的加权之和。由于 `sigmoid` 的输出始终为正数，如果神经网络中的权重是正数，那么上层节点的输入值自然将是正数（正数之和为正数）。在这种情况下，随着层数的增加，输入值倾向于变得越大。人们可能会认为，通过适当平衡正负权重使其平均值为零就可以解决这个问题，但即使权重的平均值为零，节点输出的加权之和也不一定为零。即使结果为零，`sigmoid`
    函数也会将输出推回 `0.5`。因此，随着层数的增加，神经元的输出值倾向于变得越大。神经元的输出值越大，`sigmoid` 函数的导数就越接近零。正如反向传播章节中将详细介绍的，当
    `sigmoid` 函数的梯度接近零时，反向传播学习的效果就会趋于零。当这种情况发生时，神经网络的学习将变得失效，随着网络的加深和模型的增长，会出现一种模型性能反而下降的讽刺现象。这被称为梯度消失问题。


    # 非零中心化问题


    第二个问题是 `sigmoid` 的输出始终为正（+）。这被称为非零中心化问题。为什么 `sigmoid` 的输出始终为正是一个问题呢？让我们来看感知器的学习规则。


    ![](img/image_rsrc323.jpg)![](img/image_rsrc324.jpg)


    在这里，如果我们假设输入值 ![](img/image_rsrc325.jpg) 和 ![](img/image_rsrc301.jpg) 是上一层的输出值，那么这两个值的符号都是正数。因此，如果误差为正，权重
    ![](img/image_rsrc326.jpg) 和 ![](img/image_rsrc327.jpg) 的变化都将为正；如果误差为负，权重 ![](img/image_rsrc326.jpg)
    和 ![](img/image_rsrc327.jpg) 的变化都将为负。


    ![](img/image_rsrc328.jpg)


    在这种情况下，新的 ![](img/image_rsrc303.jpg) 和 ![](img/image_rsrc304.jpg) 只能在第一或第三象限内移动。这意味着权重学习图将呈现出锯字形模式。如果通过学习需要实现的最优连接权重位于如下所示的左上方，那么
    ![](img/image_rsrc303.jpg) 和 ![](img/image_rsrc304.jpg) 的值逐渐向左上移动是最理想的。然而，由于在学习过程中
    ![](img/image_rsrc303.jpg) 和 ![](img/image_rsrc304.jpg) 只能在第一或第三象限内移动，连接权重的学习过程呈现出如下的锯字形。锯字形意味着学习过程是无效的。换句话之，使用
    `sigmoid` 函数学习有时具有这种低效的特征。


    因此，随着神经网络学习理论的发展，开发出了其他几种激活函数来克服上述 `sigmoid` 激活函数的缺点。


    # 5.3 双曲正切函数 (tanh 函数)


    双曲正切函数（`tanh` 函数）是一种保留了 `sigmoid` 函数优点同时克服了其缺点的激活函数。该函数也具有类似于 `sigmoid` 函数的 S
    形，但它返回的是 -1 到 1 之间的值。


    ![](img/image_rsrc329.jpg)![](img/image_rsrc32A.jpg)


    `tanh` 函数与 `sigmoid` 函数不同，它的输出值在 -1 到 1 之间，解决了非零中心化问题。该函数在保持 `sigmoid` 函数优点的同时，在学习过程中提供了更稳定的输出。此外，由于输出值之间的差异较大，`tanh`
    函数提供了更快、更准确的学习效率。


    然而，`tanh` 函数在深度神经网络中仍然可能遇到梯度消失问题，因为梯度在极值处仍然可能接近零。


    # 5.4 ReLU 激活函数


    显著解决梯度消失问题的激活函数是 `ReLU`（修正线性线性单元）激活函数。`ReLU` 函数在输入值大于 0 时输出该输入值，对于任何小于或等于 0 的输入值则返回
    0。


    ![](img/image_rsrc32B.jpg)![](img/image_rsrc32C.jpg)


    `ReLU` 函数解决了梯度消失问题，因此被广泛用作现代深度学习模型的默认激活函数。在正数区域，它的梯度始终为 1，防止了梯度消失，并允许反向传播有效通过网络的深层。


    # Dying ReLU 问题


    然而，`ReLU` 函数也有它的缺点。当输入为负数时，梯度变为 0，导致“死亡 ReLU”（Dying ReLU）问题，即神经元完全停止学习。为了缓解这一问题，开发了多种
    `ReLU` 的变体。


    # 5.5 Leaky ReLU (带修正线性单元)


    `Leaky ReLU` 是 `ReLU` 函数的一种变体，它为负输入值分配一个小的梯度，允许网络即使在负数区域也能学习。这有助于缓解“死亡 ReLU”问题。


    ![](img/image_rsrc32D.jpg)![](img/image_rsrc32E.jpg)


    在这里 ![](img/image_rsrc32F.jpg) 是一个小的常数，通常设置为 0.01 或 0.02。这为负输入提供了极小的梯度，防止了梯度的完全消失。


    ## 工作原理


    `Leaky ReLU` 的工作原理如下：


    *   当输入 ![](img/image_rsrc32F.jpg) 大于或等于 0 时，它输出输入值。

    *   当输入 ![](img/image_rsrc32F.jpg) 小于 0 时，它输出该输入值。


    ## 优点


    *   **缓解死亡 ReLU 问题**：`ReLU` 函数在输入为负时输出 0，导致学习停止。`Leaky ReLU` 在负区域提供小的梯度，缓解了这一问题。

    *   **保持非线性**：与 `ReLU` 一样，`Leaky ReLU` 保持了非线性，使网络能够学习。

    *   **简单**：`Leaky ReLU` 实现简单且计算开销小。


    ## 缺点


    *   **α 值的选择**：虽然 ![](img/image_rsrc32F.jpg) 通常设置为 0.01 或 0.02，但根据数据集寻找最优值可能需要实验。

    *   **梯度爆炸问题**：`Leaky ReLU` 并没有完全解决梯度爆炸问题，这种问题仍然发生，特别是在深度神经网络中。

