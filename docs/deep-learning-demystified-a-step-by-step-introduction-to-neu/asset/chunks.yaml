- raw: 'This problem can easily occur in deep learning models that use the sigmoid
    function as the activation function. As shown in the diagram, the upper layers
    of the neural network are weighted sums of the lower layers. Since the sigmoid
    output is always positive, if the weights in the neural network are positive,
    the input values of the upper nodes will naturally be positive (the sum of positives
    is positive). In this case, as you move to higher layers, the input values tend
    to grow larger. One might think that appropriately balancing positive and negative
    weights to have an average of zero would solve this, but even if the average of
    the weights is zero, the weighted sum of the nodes'' outputs is not necessarily
    zero. Even if it is zero, the sigmoid function will push the output back to 0.5.
    Thus, as you move to higher layers, the neuron output values tend to grow larger.
    The larger the neuron output value, the closer the sigmoid function''s derivative
    gets to zero. As will be detailed in the backpropagation chapter, when the gradient
    of the sigmoid function approaches zero, the effectiveness of backpropagation
    learning approaches zero. When this happens, neural network learning becomes ineffective,
    and as the network deepens and the model grows, an ironic situation arises where
    the model''s performance degrades. This is known as the vanishing gradient problem.


    # Non Zero-Centered Problem


    And the second problem is that the sigmoid output is always positive (+). This
    is called the non zero-centered problem. Why is it an issue that the sigmoid output
    is always positive? Let''s look at the learning rule of the perceptron.


    ![](image_rsrc323.jpg)![](image_rsrc324.jpg)


    Here, if we assume that the input values ![](image_rsrc325.jpg)and ![](image_rsrc301.jpg)are
    the output values from the previous layer, then the signs of these two values
    are positive. So, if the error is positive, the changes in weights ![](image_rsrc326.jpg)and
    ![](image_rsrc327.jpg)  will both be positive, and if the error is negative, the
    changes in weights ![](image_rsrc326.jpg)and ![](image_rsrc327.jpg)will both be
    negative.


    ![](image_rsrc328.jpg)


    In that case, the new ![](image_rsrc303.jpg)and ![](image_rsrc304.jpg)can only
    move within the first or third quadrant. This means that the weight learning graph
    will show a zigzag pattern. If the optimal connection weights that need to be
    achieved through learning are located upward left as shown in the figure below,
    it would be ideal for the values of ![](image_rsrc303.jpg)and ![](image_rsrc304.jpg)to
    gradually move upward left. However, since![](image_rsrc303.jpg)and ![](image_rsrc304.jpg)can
    only move within the first or third quadrant during the learning process, the
    learning process of the connection weights shows a zigzag pattern as below. The
    zigzag pattern ultimately means that the learning process is inefficient. In other
    words, learning with the sigmoid function sometimes has this inefficient characteristic.


    Therefore, as neural network learning theory has advanced, several other activation
    functions have been developed to overcome the aforementioned shortcomings of the
    sigmoid activation function.


    # 5.3 Hyperbolic Tangent Function (tanh Function)


    The hyperbolic tangent function (tanh function) is an activation function that
    retains the advantages of the sigmoid function while overcoming its drawbacks.
    This function also has an S-shape, similar to the sigmoid function, but it returns
    values between -1 and 1.


    ![](image_rsrc329.jpg)![](image_rsrc32A.jpg)


    ​ The tanh function, unlike the sigmoid function, outputs values between -1 and
    1, solving the non-zero-centered problem. This function maintains the advantages
    of the sigmoid function while providing more stable outputs during the learning
    process. Additionally, the tanh function offers faster and more accurate learning
    efficiency due to the larger differences in output values.


    However, the tanh function can still encounter the gradient vanishing problem
    in deep neural networks because the gradient can still approach zero at extreme
    values.


    # 5.4 ReLU Activation Function


    The activation function that significantly addresses the gradient vanishing problem
    is the ReLU (Rectified Linear Unit) activation function. The ReLU function outputs
    the input value if it is greater than 0 and returns 0 for any input value less
    than or equal to 0.


    ![](image_rsrc32B.jpg)![](image_rsrc32C.jpg)


    The ReLU function addresses the gradient vanishing problem and is therefore widely
    used as the default activation function in modern deep learning models. In the
    positive region, its gradient is always 1, preventing the gradient from vanishing
    and allowing effective backpropagation through deep layers of the network.


    # Dying ReLU Problem


    However, the ReLU function has its drawbacks. When the input is negative, the
    gradient becomes 0, causing the "Dying ReLU" problem where neurons stop learning
    entirely. To mitigate this issue, several variations of ReLU have been developed.


    # 5.5 Leaky ReLU (Leaky Rectified Linear Unit)


    Leaky ReLU is a variation of the ReLU function that assigns a small gradient to
    negative input values, allowing the network to learn even in the negative region.
    This helps to mitigate the "Dying ReLU" problem.


    ![](image_rsrc32D.jpg)![](image_rsrc32E.jpg)


    Here, ![](image_rsrc32F.jpg)is a small constant, typically set to values like
    0.01 or 0.02. This provides a very small gradient for negative inputs, preventing
    the gradient from vanishing entirely when the input is negative.


    How It Works


    Leaky ReLU works as follows:


    *   When the input value ![](image_rsrc30T.jpg)is greater than or equal to 0,
    it outputs ![](image_rsrc30T.jpg).


    *   When the input value ![](image_rsrc30T.jpg)is less than 0, it outputs ![](image_rsrc32G.jpg).


    This small slope ![](image_rsrc32F.jpg)maintains a consistent gradient in the
    negative region, allowing the neural network to learn across all areas.


    Advantages


    *   Mitigates the Dying ReLU problem: The ReLU function outputs 0 for negative
    input values, causing the gradient to be zero and stopping the learning process.
    Leaky ReLU provides a small gradient in the negative region, alleviating this
    issue.


    *   Maintains non-linearity: Like ReLU, Leaky ReLU maintains non-linearity, enabling
    the neural network to learn complex patterns.


    *   Simplicity: Leaky ReLU is simple to implement and incurs minimal computational
    cost.


    Disadvantages


    *   Optimal α value selection: Although ![](image_rsrc32F.jpg)is typically set
    to 0.01 or 0.02, finding the optimal value may require experimentation depending
    on the dataset and model.


    *   Gradient Exploding problem: Leaky ReLU does not completely solve the Gradient
    Exploding problem, and this issue can still occur, especially in deep neural networks.


    # 5.6 PReLU (Parametric Rectified Linear Unit)


    PReLU (Parametric Rectified Linear Unit) is a generalized form of Leaky ReLU,
    allowing the slope of the negative region, ![](image_rsrc32F.jpg), to be optimized
    during the training process. This enables the model to learn the optimal slope
    for the given data.


    ![](image_rsrc32H.jpg)


    The formula for PReLU is as follows:


    ![](image_rsrc32J.jpg)


    Here, ![](image_rsrc32F.jpg)is a learnable parameter. The initial value is generally
    set to 0.01, but it is adjusted to the optimal value through learning.


    How It Works


    PReLU works as follows:


    *   If the input value ![](image_rsrc30T.jpg)is greater than or equal to 0, it
    outputs ![](image_rsrc30T.jpg).


    *   If the input value ![](image_rsrc30T.jpg)is less than 0, it outputs ![](image_rsrc32G.jpg).


    Here, ![](image_rsrc32F.jpg)is a learnable parameter, optimized during model training.
    Unlike Leaky ReLU, the slope can be automatically adjusted to fit the dataset.


    Advantages


    *   Mitigates the Dying ReLU Problem: Like the ReLU function, PReLU maintains
    nonlinearity for positive inputs while providing a learnable slope for negative
    inputs, mitigating the "Dying ReLU" problem.'
