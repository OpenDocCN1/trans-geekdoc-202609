    in 1943. It was implemented by Rosenblatt in 1958. The perceptron is a simple
    form of an artificial neuron, calculating output by summing weighted inputs and
    passing the result through an activation function.


    ## 2.4 Summary


    A neuron is the basic unit of the human brain, consisting of dendrites, soma,
    and axon. Neurons communicate through synapses, and this information processing
    mechanism is mimicked by artificial neurons. Artificial neurons generate outputs
    based on inputs and weights. The perceptron serves as the foundation for deep
    learning.


    # Chapter 3: Perceptron Learning Algorithm


    ## 3.1 Learning Process of Artificial Neural Networks


    The perceptron learning algorithm, though relatively simple, forms the foundation
    for learning algorithms in deep learning models.


    ![](image_rsrc30K.jpg)


    Learning involves adjusting the weights to produce the desired output. When the
    neural network''s output differs from the actual value, this difference is called
    the error. To minimize the error, the weights are adjusted accordingly. The learning
    process of a perceptron consists of the following steps:


    1.  **Initialization**: Initialize the weights with random values.

    2.  **Output Calculation**: Calculate the output using the input values and the
    initial weights.

    3.  **Error Calculation**: Compute the error by finding the difference between
    the output and the actual value (true label).

    4.  **Weight Update**: Adjust the weights to minimize the error using the following
    formula:


    ```

    weight = weight + learning_rate * error * input

    ```

