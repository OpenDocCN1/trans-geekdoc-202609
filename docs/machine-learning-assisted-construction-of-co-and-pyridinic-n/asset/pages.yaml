    heating rate has a relatively small impact on the predicted C=O within the range
    (Fig. 5b). As for pyrolysis time, the partial dependence steadily increases over
    time, reaching pyrolysis time peak between 120 and 200 min, where lead to increase
    the content of C=O active sites (Fig. 5c). Therefore, the heating rate has a relatively
    minor impact on the formation of C=O, while higher pyrolysis temperatures (500–800
    °C) and longer heating rate (10–20 °C/min) were conducive to C=O formation.


    For pyridinic N, the partial dependence on pyrolysis temperature was highest around
