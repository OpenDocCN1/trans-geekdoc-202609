  md: '![](img/7831497378234ae52d1984f43fb0c693_3_0.png)


    **Fig. 3.** R² of the machine learning algorithm after Bayesian optimization on
    the test data set: (a) C=O and (b) pyridine N active sites.


    XGB algorithm was chosen for further optimization to construct the ML framework
    for predicting C=O and pyridinic N active sites in sludge-based catalysts.


    Bayesian optimization was used to optimize the ML-XGB framework to improve prediction
    accuracy [40,41]. The number of trees, n_estimators parameter, typically increases
    model performance as model becomes more robust, reducing randomness. However,
    too many trees can increase computation time with limited performance improvement.
    The max_depth parameter determines the maximum depth of the trees, a crucial factor
    for model complexity. Increasing maximum depth allows the model to learn more
    complex patterns but can lead to overfitting. The learning_rate parameter signifies
    a lower learning rate, causing the model to learn data patterns more slowly, requiring
    more n_estimators for training but potentially enhancing final model performance.
    The subsample parameter trains each tree with a portion of the samples, a variance
    reduction technique achieved by using only part of the data. The colsample_bytree
    determines the proportion of features used by each tree, improving robustness
    by random feature selection for each tree.


    After 100 iterations (Text S4 in Supporting information), the optimal hyperparameter
    values were obtained (Table S2 in Supporting information). The average R² validation
    value of the ML-XGB framework predicting C=O active sites increased from 0.58
    to 0.79, which increased from 0.62 to 0.70 when predicting pyridinic N active
    sites, indicating further improvement of prediction accuracy through optimization.
    The change in R² validation value of the optimized ML-XGB framework was smaller
    than that before optimization, indicating stronger prediction robustness for data
    variation. Additionally, decision tree, Extra Tree, XGB, ARD Regression, and Bayesian
    Ridge machine learning algorithms were optimized with the optimized ML-XGB framework.
    Among all optimized models, the ML-XGB framework had the highest R² validation
    value, confirming its superior predictive performance over other models (Fig.
    3). Ensemble learning using multiple compatible learning algorithms/models for
    a single task can yield better predictive performance. Integrating XGB and Extra
    Tree models, with further Bayesian optimization, yielded optimal parameters (Table
    S2). The average R² validation value of integrated model increased from 0.70 to
    0.80 for pyridinic N active sites prediction. However, the R² value decreased
    from 0.80 to 0.63 after removing Fe content from the model input.


    Since ML is often seen as a “black box” model, interpretation is used to check
    if the framework has captured the relationship between structural features and
    reactivity [42,43]. The ML model exhibited high accuracy in predicting active
    sites on the SS carbon-based catalyst surface. To better guide the design of active
    sites, the importance of endogenous and exogenous factors and their correlation
    with active sites were evaluated from two perspectives.


    First, the constructed ML model was interpreted, and the importance of features
    was visualized, showing how to influence the active sites on the SS surface.


    Feature importance and SHAP were among the most commonly used methods for explaining
    ML frameworks (Text S4 in Supporting information) [44–46]. The methods can demonstrate
    the direction and contribution of each feature (e.g., positive or negative contribution).
    As shown in Fig. 4a, for C=O active sites, the endogenous factor O% and the exogenous
    factor heating rate were the most influential features. Among other factors, N%,
    pyrolysis temperature, and C% show moderate importance, while Fe% has relatively
    low importance. Pyrolysis time has the least impact on the model’s predictions.
    Similarly, as illustrated in Fig. 4c, among all fingerprint factors, the O% factor
    has the highest correlation coefficient, followed by the holding time. The O%
    feature exhibits the largest positive change, where higher values of O% (red dots)
    typically lead to increase the content of C=O active sites. The C% and pyrolysis
    temperature show a broad distribution around zero, indicating that the factors
    have a complex influence. Heating rate, and pyrolysis time also have a broad distribution
    around zero. N% has the lowest eigenvalue, and the characteristic points are concentrated
    near the zero line, making the lowest contribution to the generation of C=O active
    sites.


    For pyridinic N, as depicted in Fig. 4b, the endogenous factor C% and the exogenous
    factor pyrolysis temperature were the most critical features, contributing 24.1%
    and 22.9% to the model’s impact, respectively. Among other factors, pyrolysis
    time, O%, Fe%, and heating rate hold moderate importance. Similarly, as shown
    in Fig. 4d, the endogenous factor C% and the exogenous factor pyrolysis temperature
    have the greatest impact on the pyridinic N. For C%, higher values (red dots)
    generally increase the content of pyridinic N active sites. The pyrolysis temperature
    characteristic points are mainly distributed on the left side of the zero line.
    Higher characteristic values are not conducive to the formation of pyridinic N.
    The influence of heating rate and pyrolysis time was relatively centered around
    zero, suggesting a balanced contribution. The insights not only clarify the key
    factors influencing the prediction of active sites but also provide valuable guidance
    for optimizing the design of SS carbon-based catalysts. By leveraging the model,
    researchers can save time and costs associated with experimental conditions while
    enhancing catalyst performance in future studies.


    The PDP analysis reveals the partial dependence of certain predictors on the target
