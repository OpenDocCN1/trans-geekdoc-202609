    为了比较不同预处理方法的影响，所有其他超参数均设置为相同值。如表 1 所示，标准化预处理同时获得了最高的 R² 和最低的均方根误差（RMSE）。标准化预处理可能是因为，一旦变量被设定为相似的数值范围，每个特征变量比在原始数据中更突出
    [34,35]。PCA 方法可以降低输入变量的维度，但由于 PCA 可能掩盖特征，因此存在降低精度的风险 [36]。因此，研究选择标准化作为预处理方法。


    使用数据集作为输入，对九种常用的 ML 算法（SVM、K-Neighbors、Bagging、Decision Tree、Extra Tree、XGB、ARD
    Regression、Bayesian Ridge 和 Random Forest）进行了评估和比较，以预测污泥基催化剂活性位点的性能（支持信息中的表 S1）[37–39]。计算了训练集和测试集的
    R² 和 RMSE 值以评估预测精度（支持信息中的文本 S3）。如图所示，三种 ML 算法（Decision Tree、Extra Tree、XGB）的训练
    R² > 0.90（图 2a 和 c），表明 ML 算法已使用训练数据集得到良好训练。在训练 R² 良好的三种 ML 算法中，XGB 对 C=O 和吡啶 N
    的 R² 验证值最高，分别为 0.58 和 0.62（图 2b 和 d）。相比之下，XGB 受异常值影响较小，对不平衡数据具有更强的处理能力。较低的 RMSE
    值也表明 XGB 算法相对于其他算法的优势（图 2e–h）。基于筛选结果，选择 XGB 算法进行进一步优化，以构建预测污泥基催化剂中 C=O 和吡啶 N 活性位点的
    ML 框架。


