    unpaired electron migration and promote the cleavage of the O–O bond in PMS, further
    facilitating the formation of SO₄•− and •OH. The C=C bonds, owing to their freely
    delocalized π-electrons, can also activate PMS to produce SO₄•− and •OH. Moreover,
    a high concentration of sp² hybrid carbon structures and C=O groups can efficiently
    transfer electrons to PMS, initiating the generation of SO₄•−, which subsequently
    reacts with H₂O or OH− to form •OH. Singlet oxygen (¹O₂) can be generated through
    the reactions between SO₅•− and H₂O [12]. Research indicates that SS is a promising
    feedstock for biochar production due to rich carbon content and other elements
    [13–15]. SS-derived carbon-based materials feature complex pore structures, large
    specific surface area [16], abundant functional groups (such as hydroxyl, carboxyl,
    and amino groups), and excellent surface charge distribution [17]. The surface
    hydroxyl groups can bind to PS through hydrogen bonds, release electrons and activate
    PS through redox reactions, eventually generating SO₄•−; carbonyl C=O groups can
    also generate ¹O₂ through nucleophilic addition and interactions with PMS via
    peroxide intermediates.


    Amino groups can lead to negative binding energy or regions of high/low electron
    density, forming surface-bound reactive complexes [18]. SS-based carbon materials
    have been successfully used in redox processes for the removal of various pollutants,
    including dyes, heavy metals, herbicides, phenols, pharmaceuticals and antibiotics
    [19–22]. It is worth noting that Fe in SS raw materials influence the formation
    of pyridinic N active sites [23]. During pyrolysis, iron oxides in the raw material
    initially induce the conversion of protein-derived nitrogen in the char into nitrogen-containing
    functional groups (such as pyrrolic N, quaternary N, and nitrogen oxides), thereby
    fixing nitrogen within the char. As the pyrolysis temperature increases, α-Fe
    forms and reacts with pyridinic N in the semi-coke to further generate FeₓN. With
    a further increase in pyrolysis temperature, FeₓN decomposes and converts into
    N₂ [23]. Additionally, the presence of Fe in the raw materials favors the formation
    of C=O active sites [24]. Fe promotes the generation of structural defects on
    the surface of sludge-derived carbon, which serve as excellent sites for the formation
    of C=O. Therefore, Fe plays a crucial role in the construction of catalytic active
    sites. Moreover, the SS carbonization process under different pyrolysis parameters
    (such as heating rate, pyrolysis temperature, and atmosphere) involves complex
    chain reactions among various components. Under current scientific conditions,
    it is challenging to observe the changes of intermediates and functional groups
    during pyrolysis, which poses an obstacle to elucidating the mechanism of active
    sites formation and subsequently affects the precise regulation of active sites.


    Machine learning (ML) models, utilizing big data analysis and machine learning
    algorithms, can uncover hidden information and complex nonlinear relationships
    [25–27]. ML enables the establishment of complex correlations between the composition
    of sludge-derived carbon catalysts, preparation parameters, and the formation
    of active sites. Currently, ML has been used to predict catalytic active sites
    [28]. For instance, Gao et al. employed traditional ML models to predict biochar-based
    C–C/C=C, C=O, and defect active sites [29]. In comparison, Wang et al. utilized
    ML techniques to enhance non-radical activation of persulfates using biochar [30].
    However, it is important to note that Fe has a significant impact on the formation
    of C=O and pyridinic N active sites [23,24], a factor that has not yet been considered
    in existing ML models for active site prediction. Moreover, traditional models
    face certain challenges. For example, Random forests have been shown to overfit
    on some noisy classification or regression problems. For data with attributes
    that possess varying numbers of distinct values, attributes with a greater number
    of value partitions tend to exert a larger influence on random forests. Consequently,
    the attribute importance scores generated by random forests in high-dimensional
    sparse data may be unreliable [31,32]. It is noteworthy that inte-


    ![](img/7831497378234ae52d1984f43fb0c693_1_0.png)


    grating multiple models can enhance prediction accuracy and stability [31]. Model
    ensembles are particularly effective in handling imbalanced data; when noise or
    other uncertainties are present in the data, the ensemble model can mitigate effects
    by averaging the predictions of multiple models. Model ensemble is especially
    beneficial when dealing with small datasets or models with high complexity. The
    ensemble model can reduce the risk of overfitting [33]. Furthermore, ensemble
    models can process various data types, thereby improving the overall generalization
    ability of the model. Therefore, there is an urgent need to develop new models
    that can accurately predict the key active sites on the surface of Fe-containing
    sludge-derived carbon catalysts.


    In this study, a combination of big data and artificial intelligence was utilized
    to explore descriptors capable of predicting active sites from the complex composition
    of SS and pyrolysis parameters. The descriptors that incorporate both intrinsic
    factors (e.g., raw material composition including Fe), and extrinsic factors (e.g.,
    preparation parameters), have been proposed. The descriptor can accelerate the
    screening process for SS-based carbon catalysts with excellent activity. Furthermore,
    the relationships between SS composition, pyrolysis parameters, and active sites
    were elucidated by employing shapley additive explanation (SHAP) analysis and
    importance ranking. Through partial dependence plot analysis, the optimal conditions
    of pyrolysis time, temperature, and heating rate were determined for the generation
    of active sites in SS-based carbon catalysts. Two ML models were developed: An
    XGB model and an ensemble model combining XGB and Extra Tree. Based on the established
    relationships between the multidimensional factors and active sites, an intrinsic
    reactive descriptor was summarized. The reactive descriptor can reduce the trial-and-error
    time required to prepare SS-based carbon catalysts with targeted active sites.
    The proposed descriptors can also be extended to assist in constructing other
    active sites in SS-derived catalysts.


    Using the aforementioned filled data (Text S2 in Supporting information), we reconstructed
    the database and then performed Pearson correlation coefficient (PCC) analysis.
    As illustrated in Fig. 1, blue indicates a weaker linear relationship between
    two variables, while the red blocks along the diagonal represent autocorrelation,
    where the PCC value equals 1. Firstly, no single variable exhibits a high linear
    relationship with the target variables C=O and pyridine N, indicating the necessity
    for a complex model. Additionally, most variables, except for the pyrolysis temperature,
    do not show high correlation. Since the pyrolysis temperature can be obtained
    simultaneously through literature, there was no need for dimensionality reduction.
    As stated above, the study selected three different preprocessing methods: Standardization,
    PCA, and no preprocessing. The XGB method was chosen as a sam-'
