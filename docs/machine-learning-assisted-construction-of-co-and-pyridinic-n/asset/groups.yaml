  mdcn: "\n## 机器学习辅助构建污泥基催化剂中 C=O 和吡啶氮活性位点\n\nXu Heᵃ, Wenjie Gaoᵃ, Jinglei Xuᵃ, Zhanjun\
    \ Chengᵃ, Wenchao Pengᵇ, Beibei Yanᵃ, Guanyi Chenᵃᶜ, Ning Liᵃ\n\nᵃ 环境科学与工程学院/有机固体废物安全处置与能源利用工程天津研究中心,\
    \ 天津大学, 天津 300072, 中国  \nᵇ 化学工程与技术学院, 天津大学, 天津 300050, 中国  \nᶜ 天津商业大学机械工程学院, 天津\
    \ 300134, 中国\n\n* 通讯作者。  \n*电子邮件地址:* linningect@tju.edu.cn (N. Li).\n\n### 文章信息\n\
    \n*文章历史:*\n- 收稿日期 2024年10月21日\n- 修订日期 2025年1月13日\n- 接受日期 2025年2月27日\n- 在线发表日期\
    \ 2025年2月28日\n\n*关键词:*\n- 机器学习\n- 催化剂\n- 活性位点\n- 污泥\n- 模型集成\n\n## 摘要\n\n催化剂表面活性位点的类型和数量决定了催化活性。本研究采用机器学习辅助利用污泥废物构建\
    \ C=O 和吡啶氮活性位点。提出了包括 C%、N%、O%、Fe%、热解温度、升温速率和热解时间在内的反应性描述符。构建并优化了决策树、额外树、极限梯度提升\
    \ (XGB)、自动相关性确定和贝叶斯岭回归模型。其中，XGB 模型在预测催化剂表面 C=O 位点方面表现出优异的准确性。此外，还开发了结合额外树和 XGB\
    \ 的集成模型来预测吡啶氮，R² 值高达 0.80，最小均方根误差 (RMSE) 为 0.1386。集成模型与单个模型相比准确性提高了 17%。该模型能够对\
    \ C=O 和吡啶氮的构建条件进行高通量筛选。研究发现，热解温度 500–800 °C、升温速率 10–20 °C/min 和加热时间 120–200 min\
    \ 有利于 C=O 活性位点的生成。对于吡啶氮位点，热解温度在 400 °C 至 600 °C 之间、升温速率 5–10 °C/min、热解时间约为 150\
    \ min 为最佳。实验验证表明，两种模型均表现出优异的预测性能，所有情况下预测误差均低于 10%。该研究提供了一种辅助构建 C=O 和吡啶氮活性位点的方法，有利于指导污泥催化剂的设计。\n\
    \n污水污泥 (SS) 是废水处理的副产物，已引起广泛关注。SS 的安全处置成为污水处理厂关注的关键问题之一。目前，全球干固体污水污泥的年产量约为 5300\
    \ 万吨。然而，>80% 未得到妥善处理，对环境构成潜在威胁 [1,2]。因此，迫切需要有效措施来管理 SS。污泥富含有机物，通常需要在焚烧发电或供热前进行脱水。此外，污泥的矿物组成与粘土相似，因此污泥可用作生产陶粒等建筑材料的原料，替代部分粘土资源。此外，污泥富含氮、磷和钾，可用作有机肥料改善土壤质量\
    \ [3]。为实现可持续发展，SS 的资源化利用已成为首选方案 [4]。\n\n幸运的是，热处理通过将污泥废物转化为功能性生物炭 [5,6] 提供了一种高效且环保的高值回收方法。利用\
    \ SS 作为碳基催化剂制备的原料被视为污泥减量和资源回收的新途径 [7–9]。\n\n先进氧化工艺 (AOPs) 广泛应用于污染物去除和能量转换。具有 sp²\
