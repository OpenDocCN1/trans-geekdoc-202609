    图 3. 贝叶斯优化后机器学习算法在测试数据集上的 R²：(a) C=O 和 (b) 吡啶 N 活性位点。


    使用贝叶斯优化来优化 ML-XGB 框架以提高预测精度 [40,41]。树的数量（n_estimators 参数）通常会随着模型变得更稳健而提高模型性能，减少随机性。然而，过多的树会增加计算时间，而性能提升有限。max_depth
    参数决定树的最大深度，是模型复杂性的关键因素。增加最大深度允许模型学习更复杂的模式，但可能导致过拟合。learning_rate 参数表示较低的学习率，导致模型更缓慢地学习数据模式，需要更多的
    n_estimators 进行训练，但可能增强最终模型性能。subsample 参数使用样本的一部分训练每棵树，这是一种通过仅使用部分数据实现的方差减少技术。colsample_bytree
    决定每棵树使用的特征比例，通过为每棵树随机选择特征来提高鲁棒性。


    在 100 次迭代后（支持信息中的文本 S4），获得了最佳超参数值（支持信息中的表 S2）。ML-XGB 框架预测 C=O 活性位点的平均 R² 验证值从
    0.58 提高到 0.79，预测吡啶 N 活性位点时从 0.62 提高到 0.70，表明优化进一步提高了预测精度。优化后的 ML-XGB 框架的 R² 验证值的变化小于优化前，表明其对数据变化具有更强的预测鲁棒性。此外，使用优化后的
    ML-XGB 框架对 Decision Tree、Extra Tree、XGB、ARD Regression 和 Bayesian Ridge 机器学习算法进行了优化。在所有优化模型中，ML-XGB
    框架具有最高的 R² 验证值，证实了其相对于其他模型的优越预测性能（图 3）。使用多个兼容的学习算法/模型进行单一任务的集成学习可以获得更好的预测性能。集成
    XGB 和 Extra Tree 模型并进行进一步的贝叶斯优化，得到了最佳参数（表 S2）。集成模型的平均 R² 验证值在预测吡啶 N 活性位点时从 0.70
    提高到 0.80。然而，在模型输入中移除 Fe 含量后，R² 值从 0.80 下降到 0.63。


    由于 ML 通常被视为“黑箱”模型，因此使用解释来检查框架是否捕捉到了结构特征与反应性之间的关系 [42,43]。ML 模型在预测 SS 碳基催化剂表面的活性位点时表现出高精度。为了更好地指导活性位点的设计，从两个角度评估了内源性和外源性因素的重要性及其与活性位点的相关性。


    首先，对构建的 ML 模型进行了解释，并可视化了特征的重要性，展示了它们如何影响 SS 表面的活性位点。


    特征重要性和 SHAP 是解释 ML 框架最常用的方法之一（支持信息中的文本 S4）[44–46]。这些方法可以展示每个特征的方向和贡献（例如正贡献或负贡献）。如图
    4a 所示，对于 C=O 活性位点，内源性因素 O% 和外源性因素加热速率是最具影响力的特征。在其他因素中，N%、热解温度和 C% 具有中等重要性，而 Fe%
    的重要性相对较低。热解时间对模型预测的影响最小。同样，如图 4c 所示，在所有指纹因子中，O% 因子的相关系数最高，其次是保持时间。O% 特征表现出最大的正变化，其中较高的
    O% 值（红色点）通常会导致 C=O 活性位点含量的增加。C% 和热解温度在零附近呈现宽分布，表明这些因素具有复杂的影响。加热速率和热解时间也在零附近呈现宽分布。N%
    的特征值最低，特征点集中在零线附近，对 C=O 活性位点的生成贡献最小。


    对于吡啶 N，如图 4b 所示，内源性因素 C% 和外源性因素热解温度是最关键的特征，分别对模型影响贡献 24.1% 和 22.9%。在其他因素中，热解时间、O%、Fe%
    和加热速率具有中等重要性。同样，如图 4d 所示，内源性因素 C% 和外源性因素热解温度对吡啶 N 影响最大。对于 C%，较高的值（红色点）通常会增加吡啶
    N 活性位点的含量。热解温度特征点主要分布在零线的左侧。较高的特征值不利于吡啶 N 的形成。加热速率和热解时间的影响相对集中在零附近，表明贡献平衡。这些见解不仅阐明了影响活性位点预测的关键因素，还为优化
    SS 碳基催化剂的设计提供了宝贵的指导。通过利用该模型，研究人员可以在未来的研究中节省与实验条件相关的精力和成本，同时提高催化剂性能。


    PDP 分析揭示了某些预测因子对目标响应特征的部分依赖性（文本 S4）。对于 C=O 官能团，部分依赖于热解温度在约 400 °C 时开始逐渐增加，然后从
    500 °C 起急剧上升。较高的温度导致 C=O 活性位点含量的增加（图 5a）。加热速率的部分依赖性相对稳定，波动极小，表明在该范围内加热速率对预测的 C=O
    影响相对较小（图 5b）。至于热解时间，部分依赖性随时间稳步增加，在 120 至 200 分钟之间达到峰值，从而导致 C=O 活性位点含量的增加（图 5c）。因此，加热速率对
    C=O 的形成影响相对较小，而较高的热解温度（500–800 °C）和较高的加热速率（10–20 °C/min）有利于 C=O 的形成。


    对于吡啶 N，部分依赖于热解温度在 400–600 °C 左右最高，但随着温度继续升高，部分依赖性下降（图 5d）。600 °C 以上的温度通常会导致吡啶
    N 活性位点含量的减少。加热速率的部分依赖性显示出适度的增加，在约 5–10 °C/min 时达到峰值，然后略微下降或稳定（图 5e）。适中的加热速率与吡啶
