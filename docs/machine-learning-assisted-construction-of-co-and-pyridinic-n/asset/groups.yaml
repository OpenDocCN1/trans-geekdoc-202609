    content in the four samples was 9.51% (SC1), 9.82% (SC2), 8.19% (SC3), and 9.31%
    (SC4). The pyridinic nitrogen content was 23.90% (SC1), 29.91% (SC2), 21.22% (SC3),
    and 27.79% (SC4). The ML model was used to predict the active site content in
    the four samples, and the prediction error for C=O sites was below 10% for all
    samples, with an average error of <5.1% (Fig. 6a). For pyridinic N, the prediction
    errors were 5.1% (SC1), 7.2% (SC2), 8.9% (SC3), and 4.6% (SC4), with an average
    error of 6.38% (Fig. 6b). Clearly, the model was capable of accurately predicting
    the active sites in the sludge-derived biochar catalysts.


    This study developed an XGB model to predict the reactivity of C=O active sites,
    and proposed an ensemble machine learning model combining Extra Trees and XGB
    to predict pyridine N. A new descriptor was proposed, incorporating intrinsic
    factors related to raw material composition (including iron) and extrinsic factors
    related to preparation parameters. Models, along with the descriptor, predict
    the C=O (R²=0.79, RMSE=0.0812) and pyridinic N (R²=0.80, RMSE=0.1386) active sites
    on the surface of SS-derived carbon catalysts effectively. Experimental validation
    revealed that the average prediction error for C=O and pyridinic N active sites
    were 5.1% and 4.6%, respectively. In addition, high-throughput screening of the
    preparation parameters of C=O and pyridinic N active sites was achieved. For C=O
    active site, O% and heating rate played the most significant roles, followed by
    N% and pyrolysis temperature. Meanwhile, C% and Fe% had moderate effects, with
    pyrolysis time contributing the least to the overall impact. Additionally, the
    optimal pyrolysis conditions for C=O active sites were identified as pyrolysis
    temperature of 500–800 °C, heating rate of 10–20 °C/min, and heating time of 120–200
    min. For pyridinic N active site, C% and pyrolysis temperature dominated, followed
    by N% and holding time. Meanwhile, O% and Fe% presented moderate effects, with
    heating rate contributing to the least. The optimal pyrolysis conditions for pyridinic
    N were determined to be pyrolysis temperature of 400–600 °C, heating rate of 5–10
    °C/min, and pyrolysis time of around 150 min. A solid foundation was laid for
    the precise preparation of highly active sludge-derived carbon catalysts.


