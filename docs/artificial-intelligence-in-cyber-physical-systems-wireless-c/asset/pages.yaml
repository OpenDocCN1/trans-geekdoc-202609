  md: 'implanted his wife with a device that allowed him to feel the identical feeling
    in his hand when someone grabbed hers. It''s both jaw-dropping and oddly frightening.


    # 17.7 ADVANTAGES AND DISADVANTAGES OF CYBORGS


    There are several benefits of combining organic and mechanical components. The
    major benefit is to one''s health. Many individuals are now classified as cyborgs
    as a result of surgical operations; many advancements in the medical profession
    have allowed people to be classified as cyborgs [10]. Many body parts can be replaced,
    including knees, wrists, elbows, veins, hip, heart valve, and arteries. In the
    coming era, as there will be more advancements in our technology, humans will
    be able to replace more body parts. Brain implants based on neuromorphic modeling
    are also available. Many studies have been carried out using cyborg technology,
    which has been applied to both humans and animals. Ratbot was an experiment in
    which a rat was fitted with a small electronic backpack and electrodes in its
    brain [11].


    If there are pros of something, then there are cons as well. So, there are some
    drawbacks of combining organic and mechanical elements. Robots can use UV radiation,
    X-rays, infrared, and ultrasonic sensing to perceive things in ways that humans
    cannot. As a result, there is a greater reliance on cyber technology in general.
    Cyborgs are physically limited. Cyborgs are frequently incapable of healing bodily
    injuries and must instead be restored. For example, in the case of broken limbs
    and damaged armor plates, replacement is required, which can be costly and time-consuming
    [10]. Cyborgs have no trouble conceiving about the world around them in larger
    dimensions (multiple), but humans are more limited in this regard. In terms of
    memory and arithmetic processing, they outperform humans cognitively [11].


    # 17.8 PROPOSED WORK AND METHODOLOGY


    The survey was conducted on the awareness of cyborgs among students of age group
    15–20 years, as this is the tender age group which can be the building block of
    future research and technology.


    For the study purpose, the questionnaire was prepared, mentioned in Table 17.1,
    in which a total of 100 students participated.


    The study was conducted in India, where the questionnaire was shared with students
    online. The participated candidates were from different colleges of the University
    of Delhi, India.


    # 17.9 RESULT ANALYSIS


    The result of the study for how many students are aware of Cyborgs has been studied
    and analyzed deeply. The result analyses of questions in Table 17.1 are mentioned
    below.


    Hardly 29% of students in the age group of 15–20 years are aware of cyborgs, whereas
    71% don''t know about cyborgs, as depicted in Figure 17.1.


    It is also concluded that about 54% of people think that humans are more powerful
    than Cyborgs, as shown in Figure 17.2, but in reality, Cyborgs are more powerful
    than humans, as they get themselves replaced with some organs made using AI.'
