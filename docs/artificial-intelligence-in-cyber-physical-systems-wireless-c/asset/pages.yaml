- pgno: 249
  md: 'along with neurological examinations. Children and patients with cerebral palsy
    disease diagnosis come under this category. Normal and abnormal walk, types of
    impaired gait identifications, and their useful recommendations come from orthopedic
    care.


    # 12.3  GAIT ANALYSIS NEW EMERGING

    SECURITY DIMENSIONS IN CPS


    With the rapid growth in data and computational devices in networks, the importance
    of CPSs has gained an eye to researchers and academicians’ community. We need
    high computation, strong networking skills, and control management to interact
    with physical processes. Gait analysis has been stated to develop human-machine
    interaction with the IoT uses. Gait generation and design of suitable controllers
    for a bipedal walk have gained tremendous popularity in humanoid fields. Humanoid
    robots in the field of hotels, restaurants, assistantship for people, housework
    like cleaning, lifting heavy work, interaction with visitors, teaching and training
    purposes, and industry applications fields have gained popularity in the last
    few decades. During all work, proper controlling, feedback mechanism, and remote
    controlling in the network have made this more difficult. A robot is a good example
    of a CPS that can be statically or dynamically controlled, where instructions
    given remotely are being monitored. Fall risk evaluation, BP calculation, human
    activity recognition, occlusion, and gait as a new security layer to existing
    bioinformatics systems need storing instruction in the cloud and communicating
    signals to system side, high-vision cameras, large computation facility, and better
    algorithms. Due to the increasing number of technologies, the heterogeneous device
    uses, and inherent limitations of robotics, this domain has a lot of limitations
    and challenges [29].


    # 12.4  RESEARCH CHALLENGES AND LIMITATIONS


    +   - Trajectory optimization with/without a jerk, minimum energy consumption,
    and obstacle avoidance in a remote manner

    +   - Teaching and training robots are very cost-effective and complex processes
    due to human-machine interaction due to regulate direct command and govern

    +   - Modeling and framing human motion into bipeds are still challenging due
    to limitations of sensors data acquisitions properly, noise and filter process
    computation

    +   - Development of traditional and non-traditional controllers to execute generated
    gait

    +   - Privacy as a malicious attack, instruction detection, safety constraints,
    scalability and complexity managements, feedback systems involvement, etc. are
    gait inherent limitations that make gait more secure for general use

    +   - Gait as an additional layer into existing layers like voice recognition,
    thumb detection can be used to make a more secure CPS

    +   - Development of feasible computer algorithms to manage and control humanoid
    in uncontrolled environments like search operation in coal mines, remote mining,
    and search and rescue operations during the war'
