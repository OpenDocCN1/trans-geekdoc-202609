    # ### 9.9.1 SVM Models


    SVM model is a type of supervised machine learning approach which may be applied
    to classification and regression types of tasks. A linear boundary method is used
    to distinguish the classes for classification as shown in Figure 9.9.


    In a given high-dimensional space, it generates the hyperplane or a continued
    sequence of hyperplanes, with the hyperplane having largest distance to nearest
    training sample data point of each considered class achieving stable separation
    between the two considered classes. An algorithm’s true power is determined by
    the kernel function that is used.


    The most often used kernel models are as follows:


    +   - Linear kernel model

    +   - Gaussian kernel model

    +   - Polynomial kernel model


