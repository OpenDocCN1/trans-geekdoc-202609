    # 9.5.1  TECHNIQUES FOR OBJECT DETECTION


    The object detection is a machine learning task that may be implemented either
    by traditional image processing techniques or the advanced deep learning methods.
    The most recent development in the deep convolutional network and the GPUs that
    have increased computing power can be exclusively utilized for object detection.
    The advancements in the object detection algorithm have made it possible to achieve
    high accuracy in detection. The object detectors called one-stage and two-stage
    object detectors are represented in Figure 9.5:


    The above-presented object detection algorithms basically perform the following
    tasks:


    +   1. Determining the objects from the input image or video.

    +   2. The object recognition or classification and later find the size of the
    bounding box representing the object accurately.'
