    # 5.2 TRENDS OF SMART TRANSPORTATION SYSTEM


    This section of the chapter provides a basic gist of the smart transportation
    system and all the limitations associated with it. As nearly as six different
    divisions of issues involved in it are identified, and their possible solutions
    are presented in this section. The solution is derived with the use of technologies
    such as ML and IoT algorithms. Table 5.1 depicts the categories of issues and
    their references along with it.


    # 5.2.1 Route Optimization-Navigation


