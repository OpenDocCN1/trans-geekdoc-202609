- pgno: 190
  md: '# **Mask RCNN Applications:**


    +   - **Target detection [21]:**

    +     In many robotic applications, one of the major challenges is implementing
    the target detection in order to avoid collision at workplace. This also has impact
    on the robot object recognition time and target capture.

    +   - **Human Body Attitude Detection [22]:**

    +     The mask RCNN provides higher accuracy for detection models that can be
    utilized for the multi-person attitude detection. The detection speed can be further
    improved with the MobileNet-based mask RCNN method.


    # **d. Pyramid Networks/FPN:**


    The feature pyramid networks are simple frameworks under the CNN. The Feature
    Pyramid Network (FPN) has the capability to integrate the image features that
    are low resolution with the high-resolution features, which makes detection easier.


    # **FPN Applications:**


    +   - **Action Recognition [23]:**

    +     The two-pathway networks along with the feature pyramid networks can be
    utilized for implementing the action recognition in many applications. The network
    also handles the fusion of the temporal and spatial image features to assist the
    action recognition better.

    +   - **Medical Image Segmentation [24]:**

    +     The detection applied over the medical images is vital for the analysis
    after medical diagnosis. The FPNs can be utilized for performing the accurate
    and automatic segmentation for medical image.


    # **e. G-RCNN [26]**


    The graph recognition CNN is the extension of the RCNN. It utilizes the serious
    component of RCNN model, that is, the recurrent layer of convolution through which
    recurrent types of connections among given neurons can be incorporated creating
    the gated recurrent convolutional layer.


    # **G-RCNN Applications:**


