    # 13.3.1 PERMUTATION GROUP


    A set of permutations P is said to be a group if it contains any two permutations
    α and β; and a binary composition operation * such that α*β is again a permutation
    which is an element of P. The permutation group also satisfies the conditions
    of identity, and inverse elements as well as associativity [12]. There exist an
    identity element e ∈ P, and inverse element α⁻¹ ∈ P for each permutation group.


    The permutation group satisfies three conditions of the group. If permutation
    group P consists of more than two permutations, it is a non-abelian group, i.e.,
    α*β ≠ β*α for all α, β ∈ P. The permutation group P is a finite group if it contains
    a finite number of elements, i.e., it consists of n! permutations for a set N
    of n elements (customers). The permutation group P is also a symmetric group because
    each permutation is the bijection of itself. A subset ⟨P⟩ of P exists, which is
    a group under the composition operator (*) and ⟨P⟩ is known as the generator group
    if all elements of P can be generated using the elements of ⟨P⟩ and their inverses.
    The group P and the generating set ⟨P⟩ can be characterized by a connected directed
    graph known as the Caylay graph. The Cayley graph Γ = ⟨⟨P⟩, P⟩ is a directed graph
    with the following properties.


    +   - Every element α ∈ P is a node in the graph.

    +   - Every ρ ∈ ⟨P⟩ is assigned a color c_ρ.

    +   - For each α ∈ P and ρ ∈ ⟨P⟩, there exists a directed edge of color c_ρ to
    the node α*ρ ∈ P.


    # 13.3.2 ABSTRACT ALGEBRAIC OPERATIONS


    In numerical evolutionary algorithms like PSO and DE, the operations are applied
    on vectors to generate a new vector representing the new solution for the problem
    under consideration. The numerical evolutionary algorithms require decoding methods
    to convert the continuous-value vector into permutation, representing the solution.
    For combinatorial permutation spaces, it is necessary to define addition, subtraction,
    and scalar multiplication operators such that the resultant solution remains a
    permutation. For combinatorial permutation space, it has been proved in the research
    works [12–15] that the abstract addition (⊕), abstract subtraction (⊖), and abstract
    scalar multiplication (⊙) can be defined in terms of composition operator (*)
    such that these operations hold the same properties analogous to the numerical
    operations in Euclidean vector space.


    As proved in [12], the algebraic abstract addition (⊕) and subtraction (⊖) operators
    are independent of the generators and generating set given as'
