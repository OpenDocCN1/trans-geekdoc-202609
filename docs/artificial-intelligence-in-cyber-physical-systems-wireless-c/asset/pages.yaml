    # 2.5 ARCHITECTURE OF IOT BASED ON BSN IN HEALTHCARE SYSTEM


    The architecture of IoT in BSN consists of three components which constitute the
    overall working of technology for patients in a secured manner. The components
    are a BSN, a secured cloud server, and a medical expert who reads or assigns an
    emergency management system for the patient [24]. The overall architecture and
    operations of IoT-based BSN are shown in Figure 2.2.


    A BSN is the first component in the architecture as shown in Figure 2.2. It is
    used to capture the vitals of a patient through sensors attached to the human
    body. These sensors are known as wearable device sensors for example, a smart
    watch, or it can be sensors attached to the skin on various parts of the body
    depending on the kind of tests or vital signs being captured by it [25]. Regardless,
    these sensors can capture real-time information or human vitals such as heart
    rate, body temperature, blood oxygen levels, blood sugar levels, and humidity
    through sensors attached to the wearable device. Some sensors which can be attached
    to the skin can generate


