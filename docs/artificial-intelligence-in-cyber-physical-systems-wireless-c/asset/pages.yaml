    # ### 6.3.3 Intelligent Navigation


    In autonomous vehicles, navigation guidance is provided by digital maps and geo-positioning
    system to drivers. According to this online traffic information, the efficiency
    of driving was improved to choose appropriate routes. This traffic information
    is calculated from data delivered by vehicles in traffic management or data captured
    by camera. Based on the support of 5G, IoT and big data, all traffic-related information
    is collected. Notifications will be received on the driver’s mobile related to
    parking, restaurants, tourist spot, petrol bulk, ATM, hospitals, etc.


    # ### 6.3.4 Information Society on Road Safety


    The upcoming products of independent vehicles are increased a lot in electro-mobility
    and automotive industry. However, some potential applications do not require a
    high degree of automation. Information delivered by on-board sensors by the means
    of cameras or lasers via a cloud connection also allows the driver to be informed
    by the alert app. For safe, efficient as well as comfortable driving, the local
    V2V and V2X communication are expected to be used by vehicles. These vehicles
    can easily recognize an accidental situation previously. With the support of V2X
    communication, all possible information’s are shared to nearby vehicles. This
    possible information helps the driver to get knowledge about nearby vehicles on
    road. For example, one vehicle is moving on the road behind another vehicle. Suddenly
    one pedestrian may cross the road in front of the first vehicle. At that time,
    the first vehicle’s camera detects pedestrian and shares that picture to the second
    vehicle to alert the situation. This can be done with the help of augmented reality.
    This practical implementation involves a high visibility, reliability, data rate
    and low latency. This augmented reality can also support for warning road hazard,
    warning diversion, warning road work, lane change and so on. Using Vehicle Roadside
    Unit (VRU) and vehicular cloud computing, accidents can be avoided.


    # ### 6.3.5 Isolated Traffic Light Control


    In isolated control, traffic moves in a one-way path and does not communicate
    with the neighboring light signal [11,12]. The aim of isolated traffic was to
    minimize vehicle waiting time and maximize the number of vehicle traveled. Green
    signal period of traffic is represented as phasing to move vehicles from one direction
    to another. Signal phasing needs traffic direction to determine a vehicle’s direction.
