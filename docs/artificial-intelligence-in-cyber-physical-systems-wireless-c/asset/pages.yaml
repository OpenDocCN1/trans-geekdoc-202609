    # 12.1 INTRODUCTION


    Bipedal robot [1] walking has been used for more than four decades. Researchers
    have used numerous computational models to achieve humanoid walking in the robot,
    yet it is still a challenging task to develop humanoid walking. Gait analysis
    is the process of analyzing scientifically human walking. It is a combination
    of continuous as well as discrete dynamics. Biomechanics researchers study motion
    and ground reaction force to develop humanoid walking [2]. Gait analysis is divided
    into two phases, stance phase and swing phase, which are further divided into
    sub-phases. Technology maturity in many aspects has not been reached to develop
    humanoid walking as a hybrid system. We need high computing devices, hardware,
    and precision rate to make a proper walk by computer-enabled systems.


    # 12.1.1 HUMAN GAIT ANALYSIS AND KEY TERMS


    The process of scientific investigation and study of human walking or human locomotion
    is called human gait analysis. It has been divided into two sub-phases: stance
    phase and swing phase. The stance phase is further subdivided into loading response,
    mid-stance, and terminal stance, while the swing phase has pre-swing, initial
    swing, mid-swing, and terminal swing. The stance phase is 60% and the swing phase
    has 40% of the total gait cycle (GC) [3]. Human walk is a combination of many
    GCs which itself is a combination of continuous and discrete phases. The GC is
    the period of time of one foot to the next foot of the same side in the same event
    (Figure 12.1).


    # 12.1.2 HUMANOID MODEL


    A variety of models have been developed by domain experts for a few decades. These
    models have tried to copy human walking, for example, 2D musculoskeletal model,


