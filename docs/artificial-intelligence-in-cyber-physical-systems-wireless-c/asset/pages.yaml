  md: 'often mobile and with the combination of different sensors and actuators that
    are able to fulfill any task, even remotely. The year 2008 was a head-turner in
    this department as the total number of connected devices exceeded the human population
    [1]. This trend has not seen any decline and has seen tremendous growth even till
    this very second. The ease in connectivity has enabled each and every device to
    be in touch with each other using the Internet. This has given rise to a new branch
    of connectivity naming IoT (Internet of Things). As the number of devices is seeing
    rapid growth, it only makes sense that the data that they are built to collect
    is also increasing.


    # 5.1.1 Internet of Things (IoT)


    The building blocks in the IoT are ‘things’. These things are basically any device
    that can either send or receive some data. These may include physical actuators,
    sensors or the underlying processors. These devices need to be connected to a
    common network for efficient and effective exchange of data through machine-to-machine
    (M2M) communication. This range of this communication can vary from short distances
    enabled using Bluetooth, Wi-Fi, ZigBee or for longer distances that can be accessed
    using GPRS, 3G, 4G, LTE and 5G [2]. The sheer quantity of connected devices present
    in our daily lives poses an opportunity to use all this data and interconnected
    devices to something more useful and productive. As these devices are produced
    in a massive scale, the production cost is brought to a bare minimum. Using M2M
    communication protocols, the devices are capable enough of not only collecting
    raw data but also using advanced analytics to produce logical deductions. As with
    any other industrial application, it is imperative to strike a perfect balance
    between its production cost, robustness and power use. IoT applications are at
    an all-time high, one of the areas where IoT can be applied is in smart cities.
    The IoT infrastructure can be seen in Figure 5.1. Under the branch of smart cities,
    numerous avenues are touched upon by IoT applicability, which is mentioned below
    [3]:


    +   - **Smart Homes:** Under this category, daily-life household applications
    are included such as refrigerators, television sets and washing machines. The
    purpose of implementing them at this level is to create a network of


    ![](img/56cfba5af06305175d6488aec4d55ab0_104_0.png)


    FIGURE 5.1 IoT infrastructure.'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'communicating devices to ensure automation and contextually aware decision-making
    for the utmost comfort of a user.


    +   - **Healthcare Assistance:** The most important benefit of these IoT devices
    is their ability to collect data seamlessly. This is especially important for
    healthcare applications as patients’ data regarding important health indicators
    can be collected using smartwatches and other sensors and be continuously monitored
    for anomalies.

    +   - **Smart Transportation:** This industry has tremendous potential to be developed
    with IoT-based applications. Sensors embedded in routes or commuting vehicles
    can help recognize the shortest path, or the path with least traffic. This can
    even include vacant and occupied parking indicators for convenience of the general
    public. Weather and law and order situation can be major contributing factors
    for the traffic in third-world countries and can be updated using IoT devices.

    +   - **Logistics and Supply Chain:** Industrial applications can be greatly enhanced
    with IoT-based applications. This can include using advances in long- or short-ranged
    radio-frequency identification (RFID) devices to track parcels and products around
    every corner of the storage area and even to the production or dispersing unit.

    +   - **Security and Surveillance Systems:** Continuous monitoring of sensitive
    places can be done by using imaging devices and images collected from these could
    be transmitted to control rooms or law-enforcing authorities for better surveillance.


    # 5.1.2 MACHINE LEARNING (ML)


    ML added a unique capability in traditionally running systems that helped industry
    work autonomously with more efficiency. This did not only make a system learn
    from previous experiences, but also induced decision-making capability, helping
    in a more productive and versatile environment. ML is nothing but a set of specially
    designed intelligent algorithms that enabled a system run and learn with every
    trial. The model most of the time is tested and trained on available datasets
    that help the system make decision through neuron just like the human brain. We
    can further seek it with an example that during early human life, when he touches
    a cup of hot beverage, his hand gets burned a bit; this event is learned by the
    early neurons present in human brain. Now till his last days, his brain is able
    to stop his fingers to touch some hot beverage as it might get burn; this is ML
    [4]. All the algorithms developed under the tree of ML are divided further into
    following streams.


    +   - **Supervised Learning:** This is the kind of learning in which the model
    is fed with the possibilities and outcome both. The model is trained on both input
    and output so that on the basis of its relationship it could predict any floating
    input variable. The dataset required for supervised learning should include both,
    positive and negative images, most of the algorithm’s search for features within
    the image such as threshold and the pixels to read and learn.'
  merge: -1
  img_proc: true
- pgno: 106
  md: '+   - **Unsupervised Learning:** This is a kind of learning in which the model
    is only fed with the possibilities; the dataset is so vast that the model learns
    on its own by running the finite number of iterations. To model such network is
    a very complex and difficult task and needs much more computational power.

    +   - **Reinforcement Learning:** This learning style basically is based upon
    an incentive-based approach and on each step of the learning phase the algorithm
    is designed to increase the incentive. If the parameter and the output are aligned
    together then the learning phase is sped up for better results [5].


    # 5.1.3 SENSOR TECHNOLOGY


    Sensor technology has grown in popularity over the previous decade, attracting
    a lot of coverage. Sensors have been used in a variety of applications, including
    healthcare [6,7], agriculture [8], and forest [9,10], as well as automobile and
    marine monitoring


