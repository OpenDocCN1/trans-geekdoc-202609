  md: 'Cloud computing plays the main role in it; data can be sent in the cloud, and
    one can also access data from the cloud easily then and there.


    # 3. Task Performance


    IoT also makes sure multiple operations take place faster and better. For example,
    in agriculture and healthcare purposes, in this type of field, we need the speed
    to save time and effort. Digitalization in industry can only grow faster due to
    the performance, and hence, IoT furnishes the speed.


    # 4. Best in Time Administration


    Due to the digitalization in the industry and development of IoT, we can save
    our time very well. For example, if we want to read a newspaper, we don’t have
    to go to the shop and buy it. We can have it on our phone easily.


    # 5. Remotely Controlling


    The best examples will be healthcare and agriculture. In agriculture, farmers
    used to collect the data, and by the help of the data, they used to give the necessary
    operation to control the parameter or this operation can also be performed remotely.
    Farmers don’t need to go to the field regularly. From home, they can remotely
    control their plants. And this can become only possible with the help of IoT.


    # 6. Cost-Efficient


    Again, for the value of money, IoT manifested itself as a champion. Only with
    the help of IoT, one can assemble its system as per their needs, so this makes
    the system more cost-efficient and easy to handle.


    # 7.3.2 LIMITATION OF IoT


    Here we discussed some important limitations in IoT which need to be managed and
    which are very important in digital intelligence. The disadvantages of IoT are
    shown in Figure 7.2.


    # 1. Infringement of Data


