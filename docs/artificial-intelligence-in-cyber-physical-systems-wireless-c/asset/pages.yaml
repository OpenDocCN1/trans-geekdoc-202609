    the video call conversation and then convert that audio into simple text in real
    time. This simple text is to be then converted into dialogues that are to be grouped
    with each other in such way that it could be provided as an input in vector form
    for the neural network model to understand.


    # 15.4.3 To Implement Feature Extraction so as to Extract the Patient’s Details
    to Develop a Video-Calling Web Application


    It is very essential to understand the conversations between the doctors and the
    patients if the aim is to finally generate a medical report based just on the
    conversations. The objective is to create a module that will understand the dialogues
    generated and then create a report extracting necessary information from these
    dialogues. For this purpose, it needs to understand various features of NLP that
    would help it to extract just the relevant information and discard the other.
    It needs to learn to identify which of the words are of importance and what does
    that particular word depicts. This would help it to provide meaning to the sentences
    in the dialogue. Once it figures out the meanings of the sentences, now the final
    task is to generate the report taking into consideration information that has
    been extracted yet.


    # 15.4.4 To Build a Recommender System Similar for Patients Based on the Features
    Extracted


    The ultimate objective is to display the profiles of the patients that are similar
    to the one that the doctor has been currently working on. The aim is basically
    to create a content-based recommender system to provide recommendations to the
    doctor.


    First of all, the model must understand the features of the current patient. Then,
    it must be able to compare those features with the history of all other previous
    patients and then display the cases that have the most similarity score.


    # 15.5 PROPOSED METHOD/ALGORITHM


    This work aims in making a doctor-patient conversation to be easily and conveniently
    carried out. The idea is to create a video-calling web application between the
    doctor and the patient so that they can communicate with each other from where
    ever they are and at a time that is feasible to both. It also helps to generate
    a medical report automatically understanding the conversation between them and
    retaining required documents whenever necessary.


    Consider a patient is having a medical emergency and he/she has to visit the doctor
    but the doctor is out of town. This is one of the cases where the patient can
    contact the doctor through video call and the report of their conversation will
    be automatically generated. Slot filling, a technique to understand spoken language
    and particularly the dialogue, has been used for the generation of the report
    by understanding and extracting important keywords from the conversations. The
    term spoken language processing for semantic analysis is understanding of human
    speech directed'
