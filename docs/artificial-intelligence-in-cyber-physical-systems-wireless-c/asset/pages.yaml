    The *application layer* receives information from this network layer and employs
    it to assist these applications. Authentication, access control, vulnerability
    analysis, and trusted computing are key parameters to study in this layer.


    **Application Scenarios:** CPS technology has been widely used in a variety of
    scenarios like 5Gs, transportation, homes, and smart-industrial systems [34].
    Embedded system devices contain various security features.


    **MADC types:** There is a need to understand the entire offense and defensive
    processes to build an integrated prevention and control system.


    +   - **Measure:** In CPS security, misconfiguration recognition, malware discovery,
    and risk assessments, device driver software, and integrated circuits are all
    critical safety measures.

    +   - **Attack:** Researchers must also design new attack strategies to strengthen
    defense systems. Perception, application, and network layer attacks are the three
    types of attacks we categorize based on the location of the targets [23].

    +   - **Defense:** Researchers have used various ways for detection and to block
    attacks in diverse structure layers [27].

    +   - **Control:** Researchers have used several ways to distinguish structural
    layers. Device coupling, cloud service monitoring, trustworthy computing, key
    management, and encrypted communication schemes are all examples of control studies
    that have been conducted at the application layer.


