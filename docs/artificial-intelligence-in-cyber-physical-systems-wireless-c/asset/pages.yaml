    # 3.1 INTRODUCTION


    Internet of Things (IoT) is a global network of intelligent physical devices (referred
    to as “Things”) [1] and people. The IoT allows every “Thing” to link and connect,
    effectively transforming the entire physical ecosystem into a massive data managing
    environment. Cloud computing [2], artificial intelligence [3], and deep learning
    [4], as well as analyzing data and modeling of information, are all turning out
    to be important components of the IoT system. The great progress in the domain
    of IoT is also creating development in the “Information and Communication Technology”
    industry.'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'Smart devices gather data from their local environment and then communicate
    with other platforms and IoT devices. Data is gathered and stored on a centralized
    server in traditional IoT networks for later use (particularly cloud servers)
    [5]. As a result, IoT consumers must develop trust in the traditional central
    servers, knowing that the confidential and sensitive information is protected
    there. Despite the undeniable benefits that the service providers deliver, centralized
    IoT systems sometimes confront some obstacles. Unencrypted server data, for example,
    can be hacked, resulting in the disclosure of important information. A booming
    technology called blockchain is evolving which is a ledger that is distributed
    and immutable. This technology works by recording and storing transactions using
    its cryptographic algorithms and shared database. The participants in blockchain
    operate in a peer-to-peer manner on the Internet. Technically, blockchain resolves
    trust-related issues. The hash-chain-based encryption algorithm’s safe transmission
    with certificate value’s time stamp mechanism provides data traceability and irreversible
    change.


    In this book chapter, various security risks of IoT will be discussed such as
    issues with aggregated IoT data which can happen if the sensors are not monitored
    before aggregating the data. Some features of IoT can also pose a threat such
    as data storing, data transmission, embedded tag, IoT infrastructure, authentication
    [6], and access control. Furthermore, we will discuss why we need blockchain and
    an overview of the distributed ledger technology. Moreover, we will discuss the
    combination of blockchain with the IoT to enhance the security of IoT devices.
    Furthermore, we will discuss the benefits of the integration of these two emerging
    technologies such as decentralization, security, scalability, reliability, identity,
    autonomy, secure code deployment, and market of services. We will also present
    the issues/challenges that must be overcome when blockchain and IoT are integrated.


    Section 3.2 of the book chapter discusses the motivation and the need for blockchain.
    In Section 3.3, we talk about the IoT architecture and the various security risks
    that need to be addressed. Section 3.4 elaborates on the background concepts of
    blockchain technology. Section 3.5 talks about the blockchain-IoT approach which
    integrates the two core technologies. Section 3.6 presents the challenges that
    come up when blockchain is integrated with IoT. Finally, Section 3.7 concludes
    the book chapter.


    # 3.2 MOTIVATION


    IoT is a field that is growing at an alarming rate and consists of billions of
    connected devices worldwide. These devices will continue to increase in the future,
    and by 2025, this number is expected to reach 75 billion [7]. Data is shared by
    each of these devices on the Internet. Therefore, it is fairly understood that
    data will be produced continuously at a huge volume when these massive number
    of devices are considered. Hence, solving the security problems for such a massive
    amount of data becomes a major challenge. In this section, we will explain several
    IoT challenges and why blockchain is required.


    The distributed architecture of IoT is one of the most significant concerns. Each
    node in an IoT cluster could be used to execute “Distributed Denial-of-Service
    (DDoS)” and many other cyber-attacks, thus making it a potential failure point
    [8]. An IoT device cluster can quickly collapse if several devices working simultaneously'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'are compromised. Another issue with IoT is its centralized architecture which
    can become a central point of failure [9], and hence, it must be addressed. Data
    authentication and confidentiality [10] is another critical and one of the most
    important threats that must be addressed. If an IoT device is compromised, the
    data can be misused in many ways. Additionally, security of IoT data becomes crucial
    [11] in scenarios where the data, computational power, or electricity is being
    shared by devices autonomously in various application domains.


    # 3.3 IOT SECURITY


    # 3.3.1 IoT BACKGROUND


    The IoT stack contains four layers, namely, sensing, network, middleware, and
    application layer [12] which is portrayed in Figure 3.1. The sensing layer contains
    various IoT devices such as various categories of sensors, actuators, QR code
    scanners, and GPS modules. If an industry scenario is considered, these devices
    might be attached with some equipment such as conveyor systems, automated guided
    vehicles, and robotic arms. The network layer contains various technologies such
    as Bluetooth, MQ Telemetry Transport (MQTT), Wi-Fi, Zigbee, IPv6, and IPv4. All
    these protocols have the same task, i.e., to transfer data to the next layer for
    processing and analysis. The middleware layer contains data processing systems
    such as databases, servers which are responsible for providing storage and computation
    services such as computing optimization algorithms, decision-making, and maintain
    records of the huge volume of data. The final layer, i.e., the application layer,
    delivers the specific needs for various applications to the end users. Supply
    chain [13], digital healthcare


