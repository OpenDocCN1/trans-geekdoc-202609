    of novel solutions, such as allowing vehicles to better direct traffic or providing
    tourists with relevant transportation information. As a result, the notion of
    “smart cars” develops, and such data, if correctly collected and supplied, can
    help to make road transportation greener, smarter, and safer [9].


    # 10.2.6 SECURITY AND EMERGENCIES


    IoT technology is used in the realm of security and emergency extensively, with
    a few examples such as access control of perimeter, levels of radiation, explosive
    dangerous gases, and liquid presence. Access control of perimeter is utilized
    for identifying and regulating unauthorized persons entering restricted zones,
    space monitoring, people and asset tracking, equipment maintenance, infrastructure,
    alerting, and so on. To avoid corrosion and breakdowns, the presence of liquid
    is utilized for liquid identification in the data centers, grounds of sensitive
    buildings, and warehouses [8]. The radiation levels tool is being used to monitor
    radiation levels in nuclear power station settings to produce leakage warnings,
    while the final IoT tool is used to identify gas levels as well as leakages in
    production environments, chemical factory surrounds, and mines. By detecting disturbances
    or other natural catastrophes and taking necessary steps in advance, the mixture
    of sensors, their autonomous management, and modeling can assist to anticipate
    the onset of earthquakes and volcanoes [2].


    # 10.2.7 ENVIRONMENTAL MONITORING


    One of the most potential market sectors in the future is the use of wireless
    identifiable gadgets and IoT technology in nature conservation and other green
    activities. Bio-monitoring, soil monitoring, remote sensing, water monitoring,
    and pollution monitoring will all see a rise in their use in environmentally friendly
    initiatives throughout the world. IoT could be utilized to advance environmental
    programs, such as the gathering of recyclable materials for reutilization, the
    removal of electronic waste, and the gathering of recyclable materials for reutilization
    [15]. Weather monitoring includes humidity, pressure, temperature, wind speed,
    and rain, as well as earthquake early identification [10].


    # 10.2.8 SMART AGRICULTURE


    A network of sensors may collect data, process it, and alert the farmer via communication
    infrastructure, such as SMS text communication, regarding the areas of land requiring
    special care. Smart seed packaging, fertilizer, and pest control devices that
    adapt to particular regional circumstances and identify actions are examples of
    this. By having information about land conditions and climatic variability, intelligent
    farming systems will assist agronomists in having a better grasp of plant development'
