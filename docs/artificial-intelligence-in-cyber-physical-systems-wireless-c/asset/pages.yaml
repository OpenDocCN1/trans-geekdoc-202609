- pgno: 17
  md: '# Preface


    The cyber-physical systems (CPS) is an emerging computing concept that opened
    many research domains for academicians and industries worldwide. In our present
    living and future prospect everywhere, dependency on Artificial Intelligence (AI)
    and Internet of Things (IoT) increases tremendously. In each aspect, our applications
    are becoming smart and intelligent based. Applications of IoT include smart cities,
    agriculture, healthcare, home automation, water supply management, intelligent
    vehicles, etc. With the help of wireless communications, IoT is easily manageable
    for all of us.


    In IoT, we can consider AI an integral bundle of several arranged objects. From
    this point of view, it is fundamental to comprehend the part of AI which will
    give a worldwide spine to the overall data sharing. Hence, it is likewise basic
    to consider new empowering advances, for example, remote sensor organizations,
    intelligent 5G technology, and computer vision. This book aims to introduce CPS
    with wide application areas including AI procedures and other rising canny methodologies
    for worldwide enhancement and enrichment of IoT. The utilization of AI in IoT,
    assessment measurements, limitations, and open issues about the tended-to themes
    are included. This book will help specialists and experts working in the domain
    of AI. This book also covers various issues related to CPS and how higher system
    performance can be achieved by improving wireless device sensing capability, real-time
    data processing, and predicting system behaviour.'
  merge: -1
  img_proc: true
