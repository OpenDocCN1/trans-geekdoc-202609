    # 2.1 INTRODUCTION


    Wireless communications along with Internet of Things (IoT) are used in various
    aspects of our life, such as in the field of medicine, agriculture, entertainment,
    deep learning technologies to detect fatal conditions [1], Artificial Intelligence
    (AI) methods to provide smart technological systems [2] and in intelligent home
    devices. Body sensor network (BSN) is capable of monitoring health-related data
    of patients without requiring them to visit a medical expert [3]. It is widely
    useful for people who don’t have access to medical provisions and also for elderly
    people'
  merge: -1
