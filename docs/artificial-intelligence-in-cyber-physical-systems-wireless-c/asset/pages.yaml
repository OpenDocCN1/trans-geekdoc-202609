    # 11.4 CONCLUSION


    We presented a BCC model using the PSO-based feature selection approach with SRUF
    descriptor for MCNN to classify the ALL and AML type of blood cancer. The study
    also shows that feature selection is a very useful approach to optimize the relevant
    information using SURF descriptor. The feature optimization technique helps to
    reduce the dataset and hence the accuracy of classifier will be enhanced. The
    proposed work accuracy was also examined by the comparative study of ALL and AML
    blood cancer through gene expression dataset in two different manners with SURF-based
    MCNN and optimized SURF-based MCNN.'
