    # 6.1 INTRODUCTION


    Various networking topologies, mediums and methods supported in wired and wireless
    telecommunication are used to sustain information transmission between the distances
    among two or more nodes that form a network. The revolution in telecommunications,
    in specific wireless mobile communication, consumes to be substantial evolution
    as it has progressed over numerous generations, as mentioned in Figure 6.1.'
