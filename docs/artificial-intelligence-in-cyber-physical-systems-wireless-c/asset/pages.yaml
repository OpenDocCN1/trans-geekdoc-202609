    # ### 1.1.1 Mood Taxonomy


    As mentioned in [2], the conventional approach to identifying mood reaction in
    music psychology is to use adjective descriptors, such as pathetic, optimistic,
    and gloomy. In the late 1990s, a two-dimensional mood model was introduced by
    Thayer (1989). This dimensional approach takes the idea that mood consists of
    two factors, tension (happy/anxious) and energy (calm/energetic), and splits the
    mood of music into four clusters: contentment, sadness, exuberance, and anxious/frantic
    as depicted in Figure 1.1.


    Such concepts are clear and discriminatory for the four clusters, and the two-dimensional
    framework still offers significant computer modeling markers. It is, thus, used
    in our method of mood detection.


    # ## 1.2 RELATED WORKS


    # ### 1.2.1 MEDIA RECOMMENDATION


    In [3], Erion C Riccardo Coppola Eleonora Gargiulo, Marco Marengo, and Maurizio
    Morisio proposed a mood based on car music system which relates between the mood
    of the driver and mood of a song by analyzing its lyrics and hence a recommendation
    system.


    Charulatha Vijaykumar in her proposed theory [4] explained about a system by which
    lyrics of songs are extracted using APIs and an algorithm is used to determine
    mood of the user; then, the two are matched and music is played accordingly.'
