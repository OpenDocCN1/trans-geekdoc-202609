  md: '# 9.6.2 **OBJECT DETECTION AND DIMENSIONALITY PREDICTION USING MACHINE LEARNING
    AND DEEP LEARNING**


    Ever wondered while flying over the ocean and spotting several ships of various
    sizes and wondering what may be the size and shape of each of them. Object dimensionality
    can be found out after the object in the image is detected. The various machine
    and deep learning methods can be devised in order to analyze dimensions of a particular
    object. The object recognition algorithms work over output of object detection
    methods and use detected objects/interested object features from the input image
    or videos to classify objects into certain category, hence recognizing exact object.


    # 9.7 **IMAGE CLASSIFICATION**


    Object classification is a fairly straightforward exercise for human, however,
    which shows significant problem for recent machines; hence, image classification
    has in recent times become a critical area of research. The process of classifying
    an image is done by categorizing images into one class out of the several predetermined
    categories. Single image can be classified into an endless number of categories.
    The automation of the classification process with computer vision would be definitely
    helpful.


    Advances in the field of autonomous driving are also an excellent example of how
    picture categorization may be used nowadays.


    # 9.8 **CASE STUDIES [1]**


    Some examples are given below that show how the image gets processed completely.


    The steps for image pre-processing are shown in Figure 9.8.


    # 9.8.1 **READING IMAGE**


    At this phase, we save the complete path to the set of images under consideration
    in a particular variable and then a function is written in order to load image
    files into arrays structure, so that computers are able to manage them.


    # 9.8.2 **RESIZE IMAGE**


    Because the sizes of some photos acquired by a specific camera and provided to
    our artificial intelligence algorithm differ, we need to resize every image fed
    to our artificial intelligence algorithms to establish a base size.


    # 9.8.3 **DATA AUGMENTATION**


    Data augmentation is a technique for generating fresh “data” with various orientations.
    This has two advantages: first, it allows you to make “additional data” from inadequate
    data, and second, it prevents overfitting.'
