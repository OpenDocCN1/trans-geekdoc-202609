    it apart from other application domains.


    +   1. **Reliability:** Software failures in the CPS can have disastrous implications.

    +      CPS is known for its high level of reliability.

    +   2. **Security:** A security breach at a CPS involves data, but it can also
    have a significant impact on a person or property. Even if it is not directly
    accessible, CPS can be exploited.'
