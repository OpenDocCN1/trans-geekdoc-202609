    # 3.6 CHALLENGES OF THE INTEGRATED TECHNOLOGIES


    The important challenges that arise and must be addressed while integrating IoT
    and blockchain technology will be discussed in this section. Integrating IoT with
    the blockchain technology is not straightforward. Blockchain technology was developed
    for an Internet scenario with high-performing machines, which is contradictory
    to the IoT technology. The devices must be able to operate with the cryptocurrency
    and must have the capability to digitally sign transactions which is a blockchain
    requirement. In this section, we highlight and outline the key issues that occur
    when merging blockchain with IoT.


    # 1. Scalability and Storage


    While the scalability and the storage ability of blockchain is debatable, however,
    in the case of IoT applications, the low power and the constrained resources make
    these challenges much bigger. By looking at this scenario, it seems unsuitable
    to use blockchain for IoT applications; still the mentioned limitations can be
    completely avoided or assuaged by some methods. This limitation can be really
    challenging for IoT applications and for the integration with blockchain as the
    devices may produce a massive amount of information in real time. Therefore, these
    challenges must be addressed while integrating the two technologies [37].


    # 2. Privacy of Data and Anonymity


    Most applications of IoT deal with sensitive data, for example, an application
    of heart rate monitoring; hence, it is important to address the issue of privacy
    and anonymity of the data. To address the issue of identity management, blockchain
    is considered to be the best solution for IoT; nevertheless, in the case of Bitcoin,
    some applications may require anonymity.


    In public blockchains, the issue of privacy of the data has been discussed already
    along with other solutions. IoT devices face a major challenge of data privacy
    since these devices start at the collection of data and then use that data for
    various applications. It becomes a challenge to store and secure the device, its
    data, and making sure that only authorized people have access to it is another
    challenge as security software of cryptography must be integrated into the device
    [38].


    # 3. Smart Contracts


    Smart contracts are one of the most important uses of blockchain technology; however,
    there exists many challenges that must be addressed. IoT devices may benefit from
    smart contracts in a variety of ways, although integrating them with IoT applications
    is complicated [39,40].


    Furthermore, oracles are used while working with smart contracts; the role of
    these special entities is to establish trust and provide data in actual real-world
    scenarios. Due to the instability of the IoT devices, the validation of these
    smart contracts could be compromised. Additionally, these smart contracts could
    be easily overloaded if multiple data sources are accessed. Currently, smart'
  merge: -1
  img_proc: true
- pgno: 75
  md: 'contracts do not address a huge amount of computation and share resources to
    distribute tasks even though they are decentralized and distributed.


    # 4. Consensus Algorithms


    It is challenging to engage directly in consensus techniques such as PoW due to
    the restricted nature of IoT devices in various IoT applications. For consensus
    algorithms, there exists a wide range of proposals; however, they have not been
    tested and are immature. In a blockchain network, depending on which sort of consensus
    protocol is used, the resource requirements are determined. Normally, these tasks
    are allocated to devices which do not have computational limitations or gateways
    which have the ability to perform these functions. This functionality can be provided
    by off-chain methods which handle the data outside the blockchain to reduce the
    computational time in a blockchain network [41].


    # 3.7  CONCLUSION


    The IoT system has limited computational resources and generates a huge amount
    of data. Due to this, these devices consist of several security risks that must
    be addressed. In this book chapter, we identified and described the various security
    threats related to the IoT devices. We introduced blockchain technology which
    provides certain abilities that help to make the IoT devices more secure against
    various attacks. We proposed an architecture that involves various types of nodes
    and can be used to integrate the IoT devices and the blockchain technology. Furthermore,
    we identified and described various challenges that come when blockchain and IoT
    are integrated.


