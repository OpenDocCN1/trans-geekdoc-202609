  md: '# Various internet generation


    | 1G | 2G | 3G | 4G | 5G |

    |---|---|---|---|---|

    | 1980''s | 1990''s | 2000''s | 2010 | 2018 |

    |  |  |  |  |  |

    | Analog communication | Digital communication | Broadband | High speed data rates
    | Connected devices |

    | 2.4 Kbps | 64 Kbps | 3.1 Mbps | 100 Mbps | 10 Gbps |


    # FIGURE 6.1 Internet generations.


    On the basis of technical implementation, the evolutions are characterized for
    a particular standard, comprising novel methods and functions to distinguish it
    over to former generation [1].


    Fifth generation (5G) was introduced in the year of 2018 [3,4]. It has been associated
    with plenty of new services, and a digital application provides a hyper-connected
    life to peoples. This technology can give an ultra-fast connectivity and creates
    a bond between peoples and industries. Due to the current pandemic situation,
    the need and growth of digital applications, collaborations and services increase
    dramatically. 5G mobile technology is working by overcoming the drawbacks in fourth
    generation (4G) technology. 5G and a combination of intelligent connectivity create
    smarter and better applications to make a life better. Globally around 50 countries
    such as China and Japan are expected to launch 5G mobile networks within 2025.


    1G (first-generation) mobile network was hosted in the 1980s. Here analog technology
    was used for transmitting voice. Frequency division multiple access technology
    was supported. Signals were handled and transmitted by base stations. Voice call
    was the only service provided by 1G at that time. But 1G had various limitations.
    It did not support better data service and roaming facility. Maximum data speed
    provided by 1G was 2.4 kbps. Global roaming and poor voice quality were major
    drawbacks of 1G.


    2G (second generation) introduced the concept of digital communication introduced
    in the 1990s. Analog-to-digital transmission increased the voice quality. Time
    division multiple access and collision division multiple access was supported.
    Quality of voice and data rate also increased in this generation. SMS, GSM, MMS
    services were introduced during this generation. With the support of WAP protocol,
    Internet access was provided to mobiles. SMS was also born with the onset of 2G
    mobile communication. The multimedia technology supported by 2G consumes high
    battery power.'
  merge: -1
  img_proc: true
- pgno: 125
  md: '3G (third generation) appeared in the 2000s. The very fast and wide Internet
    access was given by wireless data here. Technology supported was wideband code
    division multiple access. The big advantage of 3G was high data transmission rate.
    UMTS was proposed in 3G. While compared to GSM, UMTS offered two modes of bands
    like Frequency Division Duplex (FDD) and Time Division Duplex (TDD). Wide-frequency
    bands are supported here. Advanced multimedia applications are supported. All
    mobile phones are supporting VoIP and IP Multimedia Subsystem (IMS) systems. It
    provides the data transmission rate of 144 kbps.


    4G was introduced in the year of 2010. This is mainly focused on Internet Protocol.
    It supports microwave access. 4G provides high-security, low-cost, high-speed
    Internet connection. Compared to other generations of network, 4G provides high
    band service. Data transmission speed is in megabytes and latency is in milliseconds.
    The Internet of Things (IoT) concept also introduced and implemented for smart
    home, smart city, smart office, etc. Due to the continuous growth in mobile communication
    technology, next-generation mobile network was introduced.


    5G provides something new which was not previously available [2]. 5G has been
    introduced in the year of 2018. This completely creates new network architecture
    in combination with various technologies like artificial intelligence, IoT, multiple
    access edge computing and network function virtualization. More number of sensors
    is highly connected to create 5G network. Computing and data analytics techniques
    are introduced in 5G. Devices with 5G will be able to stay connected to the network
    anytime and anywhere, which opens up the possibility of connecting all devices
    on the network. Virtual and augmented reality concepts also live in 5G. For this
    reason, it is supposed that the basic 5G system strategy can support up to 1 million
    instantaneous connections per square kilometer. The objective in 5G network has
    providing 100 Mbps data for 97% users [5].


    # 6.2 SMARTNESS OF 5G NETWORK


    The 5G mobile network remains predictable for being the next big leap forward
    in mobile broadband. Based on research, it should overcome the drawbacks of 4G
    and LTE network. It is a high-speed, very low latency and high-bandwidth network.
    The network capacity of 5G is thousand times larger than 4G. Data transmission
    speed of 5G network was improved in two ways namely spectrum utilization and bandwidth
    expansion. From these two, bandwidth expansions have the better solution for improving
    network speed. The data rate of 5G can be increased by different metrics called
    edge rate, peak rate and aggregate data rate. This aggregate data rate represents
    the quantity of entire data transferred over the network. Data rate is improved
    thousand times in 5G network. Peak rate of 5G has between 10 and 20 Gbps. In addition
    to this, the latency of 5G is expected to be reduced to less than 1 ms. 5G is
    implemented to handle 100,000 connected people per square kilometer. At the maximum
    expected download speed of up to 20 Gbps, at a time, five users will be able to
    download entire movies in seconds. That much of network speed is provided by 5G.
    It can launch specified tasks and functions, such as remote control, precision
    medicine, connected cars, virtual and augmented reality and the IoT. It creates
    novel types'
