  md: '# 13.4 THE PROPOSED ALGORITHM


    PSO algorithm is encouraged by the collective swarms’ intelligence, and it is
    capable of solving complex optimization problems [16]. Every particle is characterized
    by position and velocity, which are continuous-valued vectors. The following equations
    are employed to update the kth particle’s position and velocity.


    $v_k^{t+1} = \omega * v_k^t + c_1 * r \text{ and } [0,1] * (z b_k - z_k^t) + c_2
    * r \text{ and } [0,1] * (z b^t - z_k^t) \quad (13.17)$


    $\bar{z}_k^{t+1} = z_k^t + v_k^{t+1} \quad (13.18)$


    where $v_k^t$ and $v_k^{t+1}$ are kth particles’ velocities in iteration $t$ and
    $t+1$, respectively; $z_k^t$ and $z_k^{t+1}$ are the kth particles’ positions
    in iteration $t$ and $t+1$, respectively; and $z b^t$ and $z b_k$ are the position
    of the best particle at iteration $t$ and the best position of the kth particle
    so far, respectively. The $r$ and $[0,1]$ characterizes a random number in the
    $[0,1]$, and $c_1$ and $c_2$ correspond to the learning factors, while $\omega$
    denotes the inertia weight.


    The goal of the PSO is to find out a vector $z_k^t = [z_1 z_2 z_3 \dots z_y]$
    that optimizes the fitness function $f(z_k^t)$ of the problem under consideration.
    The dimensions of the position vector depend on the dimensions of the problem.
    In PSO, position and velocity vectors consist of continuous values for discrete
    and continuous optimization problems. For CVRP, the position vectors must convert
    into permutations using RK, angle modulation, or other methods.


    # 13.4.1 INITIAL POPULATION AND FITNESS VALUE


    For APS, the population of size $\eta$ is initialized with random permutations
    of given customers in the CVRP. Figure 13.3a shows the random particle (permutation)
    consisting of nine customers.


    The particle $\alpha$ can be decomposed into routes using the cluster-first and
    route-second method. This method assigns customers to the first vehicle in the
    same order as they appear in the particle until the capacity is exhausted. Next,
    the remaining particles’ remaining customers are allocated to the next vehicle
    until the second vehicles’ capacity is exhausted. This method is employed to decide
    routes for all customers.


    ![](img/56cfba5af06305175d6488aec4d55ab0_259_0.png)


    FIGURE 13.3 (a) A particle (permutation) for CVRP with nine customers. (b) Routes.'
