    “artificial intelligence” and “robot,” which represent robotics and related terminology,
    were used in the search. According to the data, the Global North presently has
    the most contemplated deployment of AI and robots in SC’s development, while nations
    in Global South are becoming more represented. Numerous cities in Canada and Australia
