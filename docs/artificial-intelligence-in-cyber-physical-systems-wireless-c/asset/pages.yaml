    # 4.2  CYBER-PHYSICAL SYSTEM


    # 4.2.1  CPS STRUCTURE


    The term CPS was proposed by the National Science Foundation in the United States
    in 2006. The President’s Council of Advisors on Science and Technology acknowledged
    the CPS strategy as a critical and promising transition toward the future of the
    network and IT domain in its 2007 report. A holistic view of CPS is shown in Figure
    4.1. The physical world activities are to be monitored [8]. Embedded devices of
    the next generation process the data and communicate with their distributed environment
    are termed as cyber systems. The communication and other middle components are
    referred to as interfaces. It connects cyber systems to the physical world by
    using actuators, Analog to Digital Converter (ADC)/ digital-to-analog converter
    (DAC) converters, interconnected sensors, etc. [6].


    A sensor node performs the operation of sensing, actuation, computation (using
    processors and memory) and also contains communication modules, along with a battery.
    These sensor nodes can either transmit raw data to the data fusion nodes or process
    this data using their processing capabilities and relay the needed portion to
    another sensor node [11].


