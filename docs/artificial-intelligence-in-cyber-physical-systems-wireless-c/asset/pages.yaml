    the cloud server. The controller module has a complimentary half fitted at each
    bus stop to display the arrival and departure of bus at the LCD at the bus stop.
    This can also be monitored remotely using the mobile application.


    The IoT network can be combined with the social network to provide much better
    accessibility to the users. It is termed as SiOV (Social Internet of Vehicles).
    The authors are of the opinion [17] that vehicular social network protocol can
    be used to reduce the amount of interference and crowdedness in an SiOV network.
    This protocol can cover the MAC, physical and network layers to make the communication
    faster.


    # 5.3 CASE STUDY: SMART TRANSPORTATION:

    THE CASE OF KARACHI


    The findings of a comprehensive report published by United Nations states that
    the world population will increase to 5.2 billion in year 2050 from 2.6 billion
    in year 2010. As per this finding, one can clearly estimates that it is almost
    the double increase [53]. The basic necessities to live a quality life are directly
    linked with the resources government poses, and if the population increases with
    the current pace then there is no doubt that world is going to short fall on its
    resources, hence badly affecting the quality of life. The only solution out to
    tackle this global phenomenon is to develop such policies that enable the government
    to utilize their limited resources effectively, and henceforth, technology comes
    into play. The concept of smart and sustainable cities is to utilize the current
    advancement of mankind in engineering and extract the safe and higher standard
    of living for its residents [53].


    Among the various problems that the urban areas are facing, one is traffic congestion.
    Traffic is a dynamic problem that can have various root causes: it can happen
    because of wrong/double parkings, heavy vehicle movement, some construction work,
    any roadside accident, etc. [54]. Currently, the authorities need to respond on
    time to ensure the flow of traffic. This gives a direction to researchers to work
    and find better solutions to this traffic congestion problem, and hence, the term
    smart transportation system came into being [55].


    # 5.3.1 SMART TRANSPORTATION: CONCEPT


    The system is a wireless sensor network (WSN) designed to sense different routine
    operations. Some of the salient features of such WSN is enlisted below [56].


    +   - Loop detecting sensors can be used to sense the presence of vehicles, its
    volume, flow and speed.

    +   - Radar sensor can be used on vehicles to detect possible obstacles and assure
    smooth traffic flow.

    +   - IR sensors can be utilized to characterize automobile types through its
    echo measurement.

    +   - Light detection and ranging sensors can be utilized within a vehicle to
    make the system autonomous and perform tasks such as obstacle detection and navigation
    without human interference.'
