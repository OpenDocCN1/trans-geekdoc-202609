- pgno: 57
  md: 'Researchers and engineers must ensure that the healthcare monitoring systems
    that are used for capturing various applications have authenticated security as
    the use of these applications is increasing with time [34].


    Keeping patient confidentiality and the importance of the medical data in mind,
    the healthcare system should take steps to improve the security, maintain confidentiality
    as well as ensure data quality.


    Based on the IoT healthcare environment, the “smart healthcare application system”
    is one of the most important applications for physicians to monitor the state
    of corresponding patients remotely via WBAN [49]. When information is exchanged
    through networks, phishing scams are one of the harmful attacks that might be
    expected. Hence, measures should be in place when designing a smart healthcare
    system.


    Gope et al. [50] introduced a method known as BSN-care which provides enhanced
    security to the patients in the healthcare application system. The total security
    framework was divided into two parts: network security and data security. Authentication,
    localization, and data anonymization are all aspects of network security. On the
    other hand, data privacy and integrity are handled by data security. Together
    these two components provide overall security and authentication of the healthcare
    system and prevent the data from forgery attacks.


    Lal et al. [35] proposed a “content-centric network” method based on “WBAN” for
    IoT healthcare. This method provides high security in applications that require
    connectivity to portals or another form of means to access patient data. To reach
    the patient information to the doctor, it goes through a lot of people who serve
    as the middlemen between the patient and doctor; hence, it is important to make
    sure the information is not accessible by wrong people and ensure seamless connectivity,
    and high data transmission rate at a faster speed provides better access to the
    information.


    Wu et al. [51] used an anonymous authentication system for maintaining enhanced
    security inpatient data information in healthcare applications. This method reduces
    the security issues in the authentication method which is most widely faced by
    many people. The author was able to achieve high security with better performance
    at a reduced cost in the healthcare system.


    # 2.8.3 **PRIVACY AND CONFIDENTIALITY**


    Privacy and confidentiality in a healthcare system are important for both patient
    and the doctor. It keeps the relationship between the patient and the doctor fair
    and builds trust in each other. Only a person’s doctor, healthcare provider, or
    health insurance provider should have access to such sensitive and confidential
    information. Any misuse or misconduct would lead to disastrous consequences in
    the medical system [52]. A lawsuit can be filed against the medical supervisor
    or the health insurance company due to a data privacy breach. Hence, the healthcare
    system should be safe, private, and must have enhanced security measures to keep
    the data confidential [53]. Therefore, BSN in IoT technology should overcome security
    and privacy issues as well as provide a faster and reliable source for patients
    and doctors to trust the system and improve their lifestyle [42].'
