  md: '# 12.2.7 Humanoid Robotics


    Bipedal robot walk is inspired by a human walk. Human gait analysis is based on
    the statistical data of hip, Knee, ankle position, and orientation to training
    robots to walk much like human beings. Sophia, ASIMO, Atlas, Aquanaut, etc. are
    just a few names of humanoid robots. Trajectory generation, optimization of trajectory,
    smooth walk, obstacle avoidance walks, jerk-free walk, walk-in controlled – uncontrolled
    environments, and monitoring daily activities of humans are just a few concepts
    that are taken from human gait analysis. Robot training [25] and path planning
    are very complex and time-consuming processes. The development of suitable algorithms
    for a robot for walking, very much similar to humans, is still in its early stage.
    Nowadays, deep learning, machine learning, natural language processing, and sentiment
    analysis are being used progressively to implement humanoid robot from computer
    science prospects. Humanoid robots have been used to teach students, serve tea,
    take care of elders, and send them to war and remote areas. Due to inherent limitations
    and challenges, it’s really difficult to replicate the human mind, body, and walk.
    Future scope lies in jerks free walk, minimum energy consumptions, obstacle avoidance,
    medical sector, agriculture sector, morphological computation aspects, and development
    of cognitive approaches in connection with interaction with environment dynamically.


    # 12.2.8 Human Activity Recognition


    Human gait is used to identify the person and classify whether a person is having
    a normal walk or abnormal walk. The latest research [26] is working on finding
    the emotions of the walker as people have different walking based on their mood,
    emotions. Slow walk, medium walk, and fast walk can be classified in the case
    of gait analysis which further helps to get insight into the elderly patient’s
    smooth walk and neurological disease identifications. The future application of
    gait analysis is to develop automatic emotion recognizers, developing assistance
    for patients and in the biometric field.


    # 12.2.9 Expert Systems


    Automated gait analysis can be used for decision-making in healthcare sectors
    and sports injuries. These systems can easily suggest proper walking posture in
    treadmills, terrains, and out of laboratories. Impaired gait and muscles responsible
    [27] for dysfunction gait pattern development should be automated and a data-driven
    approach should be used to extract useful information which will help to make
    decisions in case of normal and abnormal walking. Data analysis expert system
    and gait pathological expert system must be improved with rapid changes in technology.


    # 12.2.10 Orthopedic Care [28]


    Gait analysis is performed either visually or with the help of specialized instruments.
    Instrumented gait analysis has gained popularity as a complete and standard analysis
    due to capturing joint angle movements, joint force recording, and muscle activity'
