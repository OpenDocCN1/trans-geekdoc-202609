    # 2.7.5 ENTERTAINMENT


    Nowadays, the entertainment system is ever-changing, and new technologies are
    being added to entertainment daily be it mobile phones, televisions, or other
    electronic gadgets. Many latest technologies are going hands-free and require
    facial movements or speech recognition to operate such devices. This is due to
    the capability of wireless sensors and IoT technologies that detects motions or
    face recognition to provide entertainment services with ease of living [47,48].


    # 2.8 CHALLENGES OF BSN AND IOT IN HEALTHCARE TECHNOLOGIES


    The key requirements in designing a suitable wireless communication technology
    based on IoT healthcare system includes a real-time monitoring of the healthcare
    data, timely management of requests from patients to the medical experts, effective
    diagnosis and reading of the data, and providing enhanced security of the data.
    It is extremely important to maintain the privacy and confidentiality of the patient
    as well as keep the medical data secured.


    # 2.8.1 SCALABILITY


    Scalability in the “healthcare system” is an important benchmark that should be
    taken care of when designing or developing a new application. Scalability is nothing
    but the capability of any healthcare monitoring system to be able to adapt to
    the ever-changing environment of healthcare and fulfilling the needs of the users.
    Due to too many servers, and devices used for healthcare systems via the internet,
    IoT technologies become less scalable as it loses uniformity and communication
    techniques. Maintaining uniformity among the devices reduces the scalability issues
    and makes the use of BSN with IoT more flexible.


    The main objective is to make the BSN connect to a device more scalable so that
    it can meet the needs of the changing environment as scalability ensures the healthcare
    management system work smoothly without any delays from the server side. Unresponsive
    devices could cause errors in reading the data and make it less reliable for critical
    patients to use such devices. Hence, resolving the scalability issues becomes
    an important factor in the existing devices as well as takes care of scalability
    before developing a new device for future use.


    # 2.8.2 SECURITY


    In today’s world, as the data keep increasing day by day, it is imperative to
    take necessary steps with the aim to improve the security and privacy of the “healthcare
    monitoring system”.'
