  md: '[11,12]. Sensor technology aids the prototyping of a wide range of applications
    in transportation, including traffic control, safety, and entertainment. Numerous
    electrical devices under sensors and actuators categories have emerged that could
    be put to use in the transport industry. These include tire pressure sensor and
    rear-view cameras that could continuously monitor traffic and look for any mischievous
    activities [13]. These could eventually lead to better customer experience and
    citizens’ trust on the overall city government and traffic reduction as well.


    The sensors embedded in a vehicle cannot be limited to the only two listed in
    the above paragraph. More and more companies are looking for ways to make their
    vehicles ‘smarter’. The current industry standard of including sensors is at about
    60–100, but the way the need and demand for smart vehicles is increasing, it could
    certainly touch to around 200 [14].


    # 5.1.3.1 In-Vehicle Sensors


    Smart transportation system can only be built up once the correct identification
    of the problems involved with conventional traffic systems is done: (i) overcrowding
    and parking issues, (ii) extensive commuting times, (iii) harmful gases emissions
    and (iv) accidents are few of the areas of high interest in transportation systems.
    These are specifically important at not only individual levels but also at a collective
    level for the safety and security of everyone involved in the transportation network.
    Figure 5.3 illustrates few of the sensors installed in a typical vehicle.


