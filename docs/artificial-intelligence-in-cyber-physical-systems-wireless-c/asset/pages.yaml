    # 4.2.6 CPS SECURITY


    Attacks on CPSs can result in economic losses as well as casualties. As a result,
    examining and evaluating the most relevant publications to assess CPS security
    is essential [28]. The security framework for CPS technologies has three components
    like architecture layers, application scenarios, and measure, attack, defense,
    and control (MADC) types.


    Figure 4.6 shows the CPS security framework that is explained below.


    **Architecture Layers:** It contains three components perception, network, and
    application layers. The fundamental objective of the *perception layer* is to
    identify and measure objects before collecting and processing state information
    [39]. The *network layer* acquires the collected-data and delivers it to the application
    layer. It contains IoT protocol (ZigBee, Z-Wave, WiFi, Bluetooth, HDMI, etc.),
    lightweight crypto, traffic analysis methods, etc.'
