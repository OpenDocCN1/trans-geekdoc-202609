    # ## 9.6 APPLICATIONS OF MACHINE LEARNING


    # ### 9.6.1 MACHINE LEARNING IN COMPUTER VISION


    Computer vision tasks are tasks that replicate the human vision tasks. The human
    vision tasks include detecting the objects and then labeling them. This is done
    by a very complex organic process involving the eyes and the cortex. The human
    can do this using the stored and learnt models of different objects from the real
    world and the understanding of the concept. This also includes the experiences
    of the interactions to the environment.'
