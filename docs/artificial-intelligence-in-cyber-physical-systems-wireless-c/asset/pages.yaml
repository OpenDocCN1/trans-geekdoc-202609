    The basic component of IoT is sensors integrated with actuators and microcontrollers
    device. This smart IoT device has made the medical equipment intelligent enough
    to capture the patient''s data in real time so that the doctors can easily analyse
    the patient''s data within a fraction of time. This measured patient data can
    be sent to the cloud for clinical diagnosis from anywhere at any place.


    The entire system is designed in three steps:


    Step 1: To design a portable system using a wireless interface between the IoT
    compact system, mobiles and desktops, provide alertness to healthcare staff along
    with patients'' relatives. Hardware using an ARM CortexM3-based processor along
    with a wireless transmitter is embedded to connect different sensors through thin
    wires and place it on the patient''s bed or in the vicinity of his body. The hardware
    is operated using a battery that is rechargeable. It is a portable device with
    soft connections to the sensors in comparison to the existing conventional system
    in hospitals. Because of the freely available frequency bands for portable medical
    gadgets, using them in the ICU ward doesn''t create any interference with other
    tools. Management of individual IoT devices for patients in the ICU is ensured.
    Memory management slot in each module is ensured for faithful storage and restructured
    of data as and when required for analysis is taken care of.


    Step 2: A novel signal processing algorithm is designed for the analysis and processing
    of the data arriving from sensors and is wirelessly shared to desktop or other
    required devices. The algorithm has two levels of processing the signals: the
    first is for the removal of noise and compressing data; the second is for enhancement
    and marking required for the smart display that is to be implemented on the desktop
    of patients'' ICU ward. This received data from sensors is sampled easily using
    ARM CortexM3 single processor. The third level, data analysis and alert activation,
    will be implemented in the clinical team room''s desktop computer that will also
    acquire information from other rooms. This prominent feature will assist in alerting
    personnel if something goes wrong with the patient.


    Step 3: Testing the design novel efficient compact system in the laboratory and
    evaluating and testing the system remotely using various efficient smart medical
    sensors, the results obtained were very promising and satisfactory.'
