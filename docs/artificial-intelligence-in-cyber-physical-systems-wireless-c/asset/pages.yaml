- pgno: 129
  md: 'controller is modeled with sensors and traffic detectors. Traffic light control
    is connected with a number of parameters called direction, cycle length, phase
    length and offset [10].


    +   - **Direction:** Movement of vehicles from one direction to another direction.

    +   - **Cycle Length:** Amount of time needed to finish one signal phase.

    +   - **Phase Length:** Ratio of cycle length allotted to a signal phase.

    +   - **Offset:** Calculated a time difference between particular point and reference
    point in traffic.


    Three types of traffic-isolated controls are represented as semi-actuated controller,
    fully actuated controller and volume-density controller.


    +   - **Semi-Actuated Controller:** Based on the intersection of minor and major
    streets, the density of traffic volume differs. To detect traffic in minor streets,
    a detector is necessary. A green light can be requested for minor streets and
    also it extends the green light till the vehicles are present in the street.

    +   - **Fully Actuated Controller:** This can be supported in a combination of
    two similar volumes of streets. Here a sensor is necessary to turn on the green
    signal. If there is no vehicle in the night time then the same signal will be
    continued or signal will be changed based on previously defined cycle time.

    +   - **Volume-Density Controller:** This is an advanced controller technique
    but similar to fully actuated controller. The volume of vehicles in green level
    as well as waiting vehicles’ density in red phase is also measured. The controller
    can shorten the green stretching time or lengthen least green time by evaluating
    oncoming traffic. In order to respond correctly on traffic condition, sensors
    or detectors must be correctly and sufficiently positioned in front of the stop
    line.


