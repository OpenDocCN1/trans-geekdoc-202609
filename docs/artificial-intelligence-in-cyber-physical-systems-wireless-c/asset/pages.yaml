  md: 'developed countries for the underprivileged people. AI technology with IoT
    is not only useful for people but also for doctors or medical professionals as
    it helps to make better judgments and decisions based on the diagnosis [20].


    +   - BSN with IoT reduces the overall operational cost for people and provides
    a better outcome and strategy for healthcare management.

    +   - It improves and provides virtualization for in-home services for patients
    to access medical services and physician assistants in rural areas.

    +   - BSN also has capabilities of providing real-time services with ease of access
    and security to patients. It guarantees point-to-point reliability through mobile
    access for faster communication and results.


    # 2.4 IMPORTANCE OF BSN IN IOT


    The healthcare technological systems are continuously evolving with time and are
    becoming more and more advanced with the growing technology. Every part of the
    company is digitized including the network system, infrastructure, and virtual
    healthcare. It provides medical care to people at any given place and time, thereby
    reducing the risk of a patient’s life. Sensor networks and IoT have changed the
    face of the “healthcare system” all over the world; hence, we can say that without
    the use of BSN technology along with IoT, it is impossible to set up a “patient-oriented”
    healthcare system.


    Sensor and electronic equipment are connected through a network system with the
    help of BSN as it helps to establish a connection with a patient in a safe environment.
    The combination of networking and IoT allows the system to transfer the data to
    any location, thereby reducing the time taken by a person to reach the hospital,
    stand in the queue for their blood to be drawn, or check the vital stats of a
    patient like blood pressure, heart rate, and glucose [21].


    In today’s world, BSN can be built by rearranging the sensors either by positioning
    them around the body or by placing them in the body. Sensors can also be positioned
    over the body as a wearable device that collects important information about the
    person’s health. Along with IoT, BSN provides a framework in which human beings
    can receive proper, “up-to-date”, and cutting-edge “technology-driven” healthcare
    services to enhance their standard of living [22]. These types of services could
    include medical sickness monitoring, home or hospital appliance management, access
    to the patient’s medical records, automatic contact with a healthcare person in
    the case of any emergency, and the guidance of available hospitals and staff based
    on the emergency. However, one of the most difficult challenges in such type of
    situation is to overcome the network traffic. Managing the system based on an
    emergency and handling such network traffic can be a huge problem if the resources
    are limited. Even in BSN, the prototype is such that it includes a variety of
    sensors and other electronic devices such as routers, servers, LPUs, and sensor
    nodes. Due to the BSN configuration and its connection, IoT can provide real-time
    solutions for detecting and treating medical conditions such as malignant cancer,
    which if not treated on time can spread to other parts of the body as well. Hence,
    BSN is the main reason which facilitates the transmission of human body information
    from sensors to other local entity and from local entity to the centralized or
    personal server.'
