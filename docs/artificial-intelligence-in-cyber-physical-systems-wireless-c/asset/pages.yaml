  md: 'In this algorithm, we use feature extraction [6] and committee neural networks
    variance of CNN [8]. We have taken a committee of CNNs, i.e., generalized and
    specialized CNNs. The dataset used is Cohn-Kanade database [16]. Images of facial
    expressions were obtained from the Cohn-Kanade database [14]. The archive featured
    facial photographs taken of 97 subjects aged between 18 and 30 years. Sixty-five
    percent of the database had female subjects. Fifteen percent of the respondents
    were African-American and 3% were Latino or Asian. The CNNs are first trained
    on the basis of real-valued and binary-valued parameters. In case of testing,
    image is first fed into the committee of generalized CNNs, and based on normalized
    value of the parameters [8], it is checked for no classification or ambiguous
    classification, after which it is feed to committee of specialized CNNs based
    on the deciding factor, and hence, the emotion detected by majority of CNNs is
    the final emotions.


    # 1.3.3 MEDIA RECOMMENDATION ALGORITHM


    The algorithm for recommendation is named the Moodyst algorithm. After retrieving
    the emotion, we will encode and label the emotion like Happy is 1001 and Sad is
    1002. The media presented in the database is stored in different tables, and the
    names of tables match with corresponding mood table. After mapping of emotion
    with table, a random integer will be generated in the range of distinct values
    of primary key of that chosen table. On that basis, a random media will be shown,
    the primary key of which will be matched to a random integer generated. This system
    also has a provision of directing the user to applications such as YouTube, Spotify,
    Indian Express, Kindle, Audible, through which user can be redirected to these
    apps in the presence of network connection.


    +   - Moodyst algorithm

    +   - Moodyst (string emotion) labeling the emotion

    +   - Matching the label to tables'' names in database

    +   - Generation of random integer within range of primary key values

    +   - Mapping of media and random integer

    +   - Playing of media matched


