  md: '3. Blockchain: We will use a private blockchain [36] for our architectural
    system to attain better performance in managing the IoT devices. Since the private
    blockchain is more scalable than the public blockchain, we opted for that. Although
    the private blockchain performs better than the public blockchain, however, a
    public blockchain should be utilized in a real-world scenario since it is truly
    decentralized.


    If nodes are permitted, they have the ability to read and write on the private
    blockchain. The role of the miners is to verify blockchain transactions and keep
    the blockchain secure by maintaining the blockchain database copies. Access control
    policies can be accessed by the nodes globally and can store these policies by
    using the interface of the blockchain. The data once stored in the blockchain
    is immutable and easily available to all the participants.


    4. Agent Node: In our system, there is a special type of node called the agent
    node whose role is to implement the single smart contract in our proposed architecture.
    The agent node oversees executing the smart contract during the whole operation
    of the access control system. Once the smart contract is approved into the blockchain
    platform, the agent node obtains an address inside the blockchain that identifies
    the smart contract. To engage with a smart contract, every node on the blockchain
    network must know its address.


    5. Managers: There exist some blockchain participants in the proposed system known
    as managers that manage the permission rights for a group of IoT devices. In contrast
    to mining nodes, managers, also known as lightweight nodes, do not validate blockchain
    transactions or retain transactional data. Consequently, in our system, the restrained
    devices can also act as managers despite the limitations of their hardware. Additionally,
    utilization of managers’ hardware resources can be reduced by using our method
    since the managers do not need to be connected to the blockchain constantly.


    A manager can be any participant; nevertheless, the IoT devices which are registered
    must be under the control of the manager. Due to this, managers can be avoided
    from registering to devices which are under their control. Moreover, at least
    one registered manager in the system must have all the registered IoT devices
    under them. If that is not the case then the device will not be able to manage
    by any participant, and at the same time, many managers can oversee the same IoT
    device.


    The managers can define certain permissions for access control of the IoT devices
    once these devices are registered under the control of the manager.


    6. Smart Contract: The system of access management is managed by the activities
    of the sole smart contract created in the system. All operations for the access
    management system are defined by smart contracts, which are activated by blockchain
    transactions. Once an action on the access control is initiated by a transaction,
    the miners will store the transaction data, which will be available worldwide.
    The smart contract’s executing activities, as well as the smart contract itself,
    are both publicly available.'
