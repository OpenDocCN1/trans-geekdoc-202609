  md: 'This might lead to malfunctioning of the IoT application and may lead to incorrect
    results as well. An attempt to launch a DDoS attack can also be possible by the
    attacker if this method is used [17].


    3. **Malicious Code Injection Attack:** In this form of threat, the attacker inserts
    malicious script into the memory of the node. Commonly, the upgrades of the software
    or firmware are done over the air, which provides an opportunity which can be
    used by adversaries to infuse a program which includes malware. These adversaries
    might be able to access the entire IoT system or may even force the nodes to execute
    certain inessential functions by injecting such malicious code [18].


    4. **Sleep Deprivation Attack:** The power source of the low-powered IoT devices
    is drained by the attackers in this type of attack. Since the battery becomes
    dead, a denial of service in the IoT application can be launched originated from
    the nodes. Sleep deprivation attacks could be performed if an adversary can artificially
    increase the power consumption of various IoT devices or if the attacker is successful
    in using malicious code to run infinite loops in these IoT devices [19].


    5. **Side-Channel Attacks:** Attackers can leak sensitive and confidential data
    by launching different side-channel attacks contrary to the direct attack on the
    nodes. Sensitive data can be revealed to the attackers due to the power consumption
    and the electromagnetic emanation of processors and their microarchitectures.
    Electromagnetic attacks, laser-based attacks, power consumption and timing attacks
    are some of the types of attacks on which side-channel attacks are based upon.
    Cryptographic modules are implemented by modern chips which provide different
    methods to avoid these attacks [20].


    6. **Booting Attacks:** IoT devices become vulnerable to various threats during
    the boot process. The vulnerability occurs due to the disabled inbuilt security
    processes at that instance. Therefore, adversaries may take benefit of this susceptibility
    and may attack the devices while they are in the process of booting. It is necessary
    to secure the boot process of the edge devices since they are low powered and
    sometimes undergo sleep-wake cycles [21].


    7. **Eavesdropping and Interference:** There are various nodes deployed in open
    environments that are contained within the IoT applications. Therefore, these
    IoT applications are at a risk of exposure to eavesdroppers. Throughout different
    stages such as authentication of data or transmission, the adversaries might be
    able to capture or eavesdrop the data [22].


    # 3.3.2.2 Security Risks at Network Layer


    The network layer''s role is to transfer information from the sensing layer to
    the middleware layer or process unit for further analysis. The following are the
    security concerns at the network layer:


    1. **DoS/DDoS Attack:** In these types of threats, a huge quantity of unwanted
    requests is executed by an adversary to flood the target servers. Therefore, services
    to genuine users are disrupted as the target server is incapacitated.'
