  img_proc: true
- pgno: 68
  md: 'The attack is characterized as a DDoS attack when an attacker employs many
    sources to overload the target server. Because of the diversity and difficulty
    of IoT networks, the network layer of the IoT stack is susceptible to these threats.
    If the IoT devices present in the IoT applications are not correctly installed,
    attackers can launch DDoS attacks on the target servers, which can serve as simple
    gateways for them [23].


    2. **Phishing Attack:** Phishing attacks occur when an attacker employs minimal
    amount of effort to target a huge quantity of IoT devices. An expectation of the
    attacker is that at least some devices will get compromised due to the attack.
    While visiting web sites on the Internet, there may be a possibility to confront
    phishing sites by the users. The entire system of IoT which is currently utilized
    by a user can become susceptible to cyber-threats if the user''s login credentials
    are compromised. In the IoT architecture, the network layer is extremely vulnerable
    to phishing attacks [24].


    3. **Data Transit Attacks:** There is a lot of data exchange and storage involved
    in various IoT applications. Adversaries and hackers always attempt to target
    the data since it is valuable. When information is stored on the cloud or on local
    servers, there is a risk of security breach; however, when it is moved from one
    location to another, it becomes more vulnerable to cyber-threats [25].


    4. **Access Attack:** This is a type of attack where an adversary or any unapproved
    user achieves access to the IoT network and is also known as advanced persistent
    threat. The intruder if wishes to can remain inside the network undetected for
    a long duration. Since applications of IoT constantly transmit and receive vital
    information, they are especially vulnerable to these sorts of attacks [26].


    5. **Routing Attacks:** These attacks work because while data is in transit in
    an IoT application, malicious nodes may try to reroute the routing pathways. A
    type of routing attack in which an attacker uses advertisement to encourage nodes
    to route traffic along the shortest path possible is known as Sinkhole attack.
    Another attack known as wormhole attack if combined with sinkhole attacks or other
    kinds of attack can become a serious security threat. The purpose of a wormhole
    is for fast transfer of packets and is an out-of-band link between two nodes [27].


    # 3.3.2.3 Security Risks at Middleware Layer


    In the IoT stack, the middleware layer serves as an abstraction layer in between
    the network and application layers. The demands of the application layer are fulfilled
    as this layer provides APIs. The middleware layer is prone to various attacks
    even though it is useful and provides a robust and reliable IoT application. The
    following are the different attacks in the middleware:


    1. **Flooding Attack in Cloud:** In this type of threat, the quality of service
    is affected and is similar to Denial-of-Service (DoS) attack in the cloud. The
    adversaries consistently send numerous requests to a cloud service to deplete
    the cloud resources. If the load on the cloud servers is increased,'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'then these attacks could create a huge effect on the resources which are deployed
    on the cloud [28].


    +   2. **Man-in-the-Middle Attack:** Consider the example of the MQTT protocol
    which utilizes a communication model in the form of publishing and subscribing.
    There are three major roles in this protocol known as publisher (client), subscriber,
    and MQTT broker which efficiently acts as a proxy. Due to the presence of the
    MQTT broker, messages can be sent without any awareness about the destination
    and assists to decouple the publisher and subscriber from each other. The attacker
    could become a man-in-the-middle if the broker is managed by the attacker and
    full control of all the communication is acquired where the clients are not aware.


    +   3. **Signature Wrapping Attack:** Inside the web services that are utilized
    in the middleware, XML signatures are employed. The attacker in a signature wrapping
    attack is able to implement or alter eavesdropped data by manipulating the susceptibilities
    in Simple Object Access Control unless the adversary is successful in defeating
    the signature scheme.


    +   4. **SQL Injection (SQLI) Attack:** The middleware layer is prone to another
    type of attack known as SQLI attacks. Injection of malicious SQL statements can
    be done by the attacker in this type of attack. After the injection, the attackers
    can alter records in a database or may even obtain the confidential data of any
    user.


    +   5. **Cloud Malware Injection:** The attack is known as cloud malware injection
    if an adversary is able to gain control by injecting malicious script or a virtual
    machine into the cloud. A malicious service module or a virtual machine is created
    by the attacker while pretending to be a valid user. As a result, the attacker
    can get a hold of the victim’s service requests and private information that could
    be altered depending on the situation.


    # 3.3.2.4   **Security Risks at Application Layer**


    The application layer’s role is to deliver functional services to customers, and
    it’s where IoT applications like wearables, digital healthcare, and smart retail
    exist. There are specific issues related to security such as privacy of data and
    data theft in this layer that are not present in other layers. There are even
    specific security issues for specific IoT applications. The various security threats
    to the application layer are explained as follows:


    +   1. **Reprogram Attacks:** The adversary, in these types of attacks, attempts
    to reprogram the IoT devices remotely if the process of programming is not protected
    and ultimately leads to the hijacking of the IoT network [29].


    +   2. **Data Thefts:** A vast amount of confidential and sensitive data is dealt
    by various IoT applications. The data at rest or the static data is less vulnerable
    than the data in transit and frequent data movements occur in applications of
    IoT. When such IoT applications are susceptible to data theft threats, the clients
    will be hesitant to store or use their personal data on these IoT applications.'
