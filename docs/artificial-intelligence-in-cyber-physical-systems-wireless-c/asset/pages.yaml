  md: '# ### 5.2.4 Accident Detection and Prevention


    Accident prevention is major issue associated with the transportation system of
    any city. It is probably the most impacting event and hence must be taken into
    account very seriously as it directly affects the lives of people. A great deal
    of road accidents can be prevented if the drivers are focused on their commute,
    provided that they are abiding all the traffic rules. Smarter facilities in the
    transportation network can also help us detect already happened accidents at the
    earliest to supply them with emergency care measures.


    The research article [35] uses a CHMM technique to exchange information between
    the vehicles in real time to prevent collisions and crashes. This way of preventing
    accidents but autonomously is presented in the research article [47] which also
    makes use of road sensors data fed into a FF-NN and regression tree algorithm.
    The basis of all techniques is the V2V (vehicle-to-vehicle) communication for
    an overall smarter decision [37]. Another important aspect is touched upon in
    [26] where along with V2V communication, blind-spot identification is also done
    using the Fully Convolutional Layer (FCN) method. This can also be implemented
    using the deep recurrent attention model (DRAM) method [48] which is based upon
    image processing and object detection. Driver consciousness [49] can also be monitored
    using image data and by using different computer vision techniques. These images
    can also be fed into a neural network to work up for most accurate and reliable
    results [36,50].


    # ### 5.2.5 Road Anomalies Detection


    Condition of road surface is another very important parameter that directly affects
    the flow of traffic and vehicle degradation. Effective and efficient identification
    of potholes and bumps will let users know beforehand of the caveats of any route
    and will present them with an option to change it accordingly.


    The review paper [20] presents an elaborate take on the different deep learning
    techniques used in learning the surface of different pavements and roads. It makes
    use of as many as 12 of the most recent studies done in the same field. The neural
    networks that are employed are CNN and Deep convolutional neural network (DCNN).
    The techniques are pitted against each other with vital parameters such as performance,
    results, reliability and frameworks measured. The author finishes off with the
    opinion that CNNs perform the best when classifying pavement images.


    # ### 5.2.6 Infrastructure


    With the recent advancement in IoT technology, conventional transportation systems
    can benefit greatly from it. The transportation system can be improved with much
    smarter working modes that can provide comfort at any level. The following paragraphs
    enlist the ways in which it can be done.


    The research article [51] provides a mix of hardware and software to monitor bus
    fleets. This is done by using RFID tags, with each bus being uniquely identifiable
    and IR sensors fitted in the buses to count the number of passengers in a particular
    bus. GPS sensors are used to give information about the location of the vehicles.
    The'
