  md: 'security issues, it is still a challenge to manage and reduce the security
    weakness on the client side.


    Rana and Bajpayee [13] developed a system to capture patient’s data which includes
    vital signs of the patients such as body temperature, bloody oxygen level, and
    heart rate, which is stored and maintained in the cloud server to enable easy
    access for the medical expert from any part of the country. The authors mention
    the security issues being handled and assess the measures taken for the security
    breach of the patient data, but there is still a need for a deep study to handle
    the security issues in different aspects.


    Sharma et al. [14] used a star network topology that contains different components
    in a network to coordinate with the sensor nodes of a “WBAN” that monitors a patient’s
    physiological signs remotely. However, this method is not capable of capturing
    all the critical signs of the patient which is required in case of an emergency.


    Guidi et al. [15] developed a heart failure analysis dashboard system with AI
    technology to diagnose and analyze the health parameters of the patient and provide
    a follow-up on time. This dashboard the system provides the most up-to-date information
    about the patient’s health which is useful to the doctors to provide a healthcare
    plan to the patient.


    Hongxu et al. [16] proposed the use of a framework for monitoring healthcare data
    and providing trustworthy at-home assistance to patients. It uses a data transmission
    method via servers installed to provide remote healthcare to the patient via medical
    experts.


    Pandey et al. [17] provided an extensive survey on BSN in healthcare IoT. The
    paper mentions the limitations and challenges faced by these sensors, which should
    be taken into consideration when developing a BSN architecture but does not provide
    a systematic framework of how to overcome these challenges to develop a safe and
    secure BSN in IoT systems.


    # 2.3 FEATURES OF BSN


    A BSN system is an important technology that has been used most widely today by
    many people as it is the most convenient and fastest way to monitor healthcare
    vitals and keep a track of basic vital signs especially during the Covid-19 pandemic
    which makes very difficult to visit a doctor [18]. Several features describe the
    use and accessibility of BSN in IoT which are described in the below paragraph.


    +   - BSN in IoT opens a lot of doors in healthcare systems for patients to discuss
    their health results with the doctor. It improves the healthcare management system
    as it collects the data through sensors and analyzes the results of the most critical
    parts of the body like the brain and heart [19].

    +   - BSN gathers a huge amount of data that is accurate enough for the doctors
    to make better decisions for their patients. The use of AI in IoT has provided
    much smarter and improved the outcome of the BSNS in terms of diagnosis and follow-ups.

    +   - BSN helps people from all over the world and provides a huge pool of resources
    and allows the opportunity to use techniques available in'
