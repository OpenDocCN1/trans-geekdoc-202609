  md: 'and children. BSN has been proven to be effective in monitoring the health
    of people and providing accurate results of the diagnosis. IoT based on the healthcare
    system is also capable of providing physiological information such as electroencephalogram
    (EEG) and electrocardiography (ECG) through BSN [4]. The healthcare data is collected
    via sensors and is stored and secured in the cloud, which is useful by the medical
    experts for scrutinizing the stored data and making predictions or decisions based
    on the results. This type of intelligent healthcare system [5] is widely used
    today by medical experts and hospital staff for providing a telemedicine service
    to patients who can ask questions related to healthcare and consult a medical
    expert from anywhere in the world [6]. BSN uses the vital signs of the person
    captured through a wearable sensor device which sends the information to a medical
    expert through wireless communication technologies as shown in Figure 2.1. It
    monitors activity such as blood pressure, oxygen levels, body temperature, and
    cardiac and brain activity. By looking at the current situation, accessing medical
    advice and hospital administration has become even more difficult and expensive
    for most people. Using BSN- and IoT-based intelligent healthcare systems provides
    faster and better services to people so that they can treat and analyze their
    lifestyle and improve their quality of living. However, this type of intelligent
    healthcare system collects a large amount of data that is private and confidential
    [7]. Hence, it is extremely significant to take care of the data security and
    storage management [8]. It is necessary to protect the data from hacking and external
    threats [9]. This chapter suggests and analyzes advanced techniques to improve
    the traditional healthcare system and discusses the latest trends and improvements
    in IoT-based healthcare systems and provides ways to deal with majority of healthcare


