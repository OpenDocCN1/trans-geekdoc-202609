    # 4.1 INTRODUCTION


    Cyber-physical system (CPS) is defined as “Systems that integrate the cyber-world
    with the physical-world” as per the National Institute of Standards and Technology
    [46]. Because CPS DataStream has a big amount of data, machine-learning (ML) techniques
    are used to analyze and interpret it. In the CPS, ML approaches are employed in
    three domains: smart grid (SG), transportation, and industry. Artificial neural
    networks (ANN) can forecast trends by performing regression on a time series stream.
    ANN predicts energy consumption to help clients regulate demand. Support vector
    machine (SVM) is utilized in fault detection, forecasting, clustering, feature
    design, and in application domains such as SG and transportation since it has
    a short response time. Random forest (RF) is used to detect faults in manufacturing
    machines or products, as well as spurious electricity records from sensors. In
    the power system, a decision tree classification technique is utilized for fault
    detection, energy demand prediction, and bus travel time.


    This chapter is organized into three sections. First, Section 4.2 contains six
    subsections namely, CPS structure, CPS components, CPS characteristics, domains
    of CPS, CPS challenges, and CPS security. Second, Section 4.3 contains cloud computing
    technologies that discuss cloud computing systems, ML/deep learning (DL)'
