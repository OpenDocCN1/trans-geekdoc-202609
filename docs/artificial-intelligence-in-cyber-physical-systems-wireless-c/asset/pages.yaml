    # 13.3 PERMUTATION GROUP PRELIMINARIES


    CVRP is a well-acknowledged combinatorial NP-hard optimization problem in which
    permutations of integers (or n customers) are the solutions from the set of all
    permutations. Figure 13.1 shows two solutions (permutations) α and β for the CVRP
    consisting of nine customers. If α and β are solutions of the CVRP, there exists
    composition operator * so as α*β = α(β(i)), ∀ i ∈ V, is again a solution. Figure
    13.2 shows the resultant permutation γ of the composition of two permutations
    α and β given in Figure 13.1. In this work, we employ the group theory to simulate
    the moves of the bare-bones PSO algorithm to resolve the considered problem. This
    section discusses the group theory preliminaries corresponding to the permutation
    group.


