    fact that it has the ability to link every possible sensor and actuator to build
    up an actually complete system. This is the underlying concept behind the inception
    of IoT. Entire cities can get network-based connectivity. One area that could
    be greatly improved by this technological advancement is of the transportation
    system. The expanse of a typical and entire transportation system of a city is
