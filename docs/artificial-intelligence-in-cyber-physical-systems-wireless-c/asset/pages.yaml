    # 6.3 5G INTELLIGENT TRANSPORTATION


    Complexity and quantity of traffic is increased nowadays. To optimize the entire
    transportation, intelligent traffic is a best solution. 5G networks as well as
    artificial intelligence systems will interconnect the vehicles location, bicycles
    and people in real time, and reduce the possibility of accidents or collisions.
    Data such as weather, surface conditions, construction sites or traffic jams are
    transmitted in real time through the driver’s helmet, and joined with artificial
    intelligence to support road users find better routes. 5G promotes the social
    benefits of connected vehicles, automation, sharing and electric vehicle, and
    can contribute to and truly become the core of the future development of autonomous
    vehicles. A survey [6,7] shows that in the year of 2035, 5G technology will provide
    2.4 trillion dollars as the economic output. In Europe, the automotive transport
    will yield 220.5 billion euro.


    The key concepts of intelligent transportation are as follows:


    +   - Vehicular communication

    +   - Automated driving

    +   - Intelligent navigation

    +   - Information society on road

    +   - Isolated traffic light control


    # 6.3.1 Vehicular Communication


    In recent years, all modern vehicles are working with the support of sensor platform,
    which extract the data from environment. This extracted information is handled
    by a computer system and then used for navigation, traffic management, pollution
    control and more. However, to attain quick processing, a very potent on-board
    computer is needed. The costly usage of equipment has been reduced, via Internet
    that ought to be potential for transferring data over to the cloud for accomplishing
    substantial processing data. Therefore, IoT can helpful to gather further information
