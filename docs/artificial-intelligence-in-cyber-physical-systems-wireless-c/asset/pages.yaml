    # 9.5.2.2 Two-Stage Object Detection Algorithms


    # a. RCNN and Spatial Pyramid Pooling CNN (SPPNet)


    The SPPNet is the popular image classification and object detection method which
    works on the variable size input image. It helped the bounding box prediction
    speed as compared to other methods. The RCNN method generates the category-independent
    RPNs and extracts the fixed length feature vectors from CNN models. They use the
    superpixel-based selective search.


    # RCNN and SPPNet Applications:


    +   - **Traffic Classification [16]:**

    +     The SPPNet could be used by applying the method of max-pooling layer that
    can be utilized for analysis of network traffic and the variable length dataset.

    +   - **Intelligent Transportation Systems [17]:**

    +     Traffic monitoring, security systems, surveillance systems are the application
    areas where the RCNN has shown good performance.


    # b. Fast RCNN and the Faster RCNN:


    The fast RCNN was designed to improve or reduce the drawbacks from the RCNN and
    SPPNet.


    # Fast RCNN and Faster RCNN Applications:


    +   - **Object Detection for Optimal Remote-Sensing Images [18]:**

    +     The object detection finds its applications in many aerials and satellite
    image analysis. The images captured by the remote-sensing image devices may contain
    complex backgrounds and many other complexities. To deal with these, the faster
    RCNN along with feature pyramid networks and deformable convolution network could
    be used which also increases the detection performance.

    +   - **Event Analysis for Vehicle Classification [19]:**

    +     The vehicle classification and counting has formed an integral part in the
    traffic management to control and make analysis of the traffic flow. The fast
    RCNN can be utilized for the successful real-time vehicle classification by extracting
    the features from the event video streaming.

    +   - **Classification and Recognition over Documents [20]:**

    +     The limitation of the current OCR technology is that it can only process
    simple digital documents. The faster CNN can be utilized for processing of the
    complex documents involving non-textual contents like noise, signatures and forms.


    # c. Mask RCNN:


    Oriented on the concept of feature pyramid network, this mask RCNN is the effective
    object detection as well as segmentation method. This model helps to find out
    the bounding boxes and the segmentation masks for all the instances of objects
    appearing in the input image'
