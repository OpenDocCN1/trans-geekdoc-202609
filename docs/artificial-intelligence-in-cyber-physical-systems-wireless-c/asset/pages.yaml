    **Dr. Neetesh Kumar** received his M.Tech. and Ph.D. degrees from the School of
    Computer and Systems Sciences, Jawaharlal Nehru University, New Delhi. He has
    qualified GATE, and NET+JRF. He has got Travel Grant Awarded from IEEE IPDPS International
    Society and Special Mention Awarded from Xerox Research Centre, Bangalore. He
    has worked as an assistant professor in Shri Mata Vaishno Devi University (SMVDU),
    Katra, Jammu & Kashmir, India. He has also been appointed as a faculty incharge
    of Computer Network Center at SMVDU. Later, he has worked as an assistant professor
    in Delhi Technological University, Delhi. He has also been a faculty member at
    the Atal Bihari Vajpayee-Indian Institute of Information Technology and Management
    (IIIT) Gwalior, India. Currently, he is working as a faculty member at IIT Roorkee,
    India. He has published many research publications in world’s top tier publishers
    like IEEE journals and transactions, Elsevier journals (including *Future Generation
    Computer System* (FGCS), *Information Sciences*, etc.) and Springer journals (*Soft
    Computing*, *Computing*, etc.). One of his articles published in IEEE’s *Sensors*
    journal has been notified by IEEE Council in the list of world’s top 15 most downloaded
    articles in the month of October–November 2018. He is a regular reviewer of highly
    reputed journals like *IEEE Transactions on Parallel and Distributed Systems*,
    *IEEE Journal of Internet of Things*, FGCS, etc. He is also acting as a lead PI
    for three sponsored projects from DST/CSIR agencies, Government of India. He has
    been a technical program committee member in several conferences. He has also
    been invited as a keynote speaker in the conference held at Amity Gwalior and
    conference chair at IEEE CICT-2019 at IIIT Allahabad. Broadly, his research interests
    include algorithm design, scheduling in parallel computing systems (multi-core/many-core
    systems), applied evolutionary computing, and intelligent transportation systems.


    **Dr. Subrata Sahana** is an associate professor in the Department of CSE at Sharda
    University, Greater Noida, U.P. He received his Ph.D. in Computer Science from
    the JNU, New Delhi (Central University), India (NIRF Ranking-2020: 02), M.Tech.
    in Computer Science and Engineering form BIT, Mesra in 2010 (NIRF Ranking-2020
    under 100), and B.Tech. in Computer Science & Engineering from CEMK, Kologhat
    affiliated from West Bengal University of Technology in 2007. He joined Sharda
    University as an assistant professor in August 2019 and promoted as an associate
    professor in January 2021. Prior to this, he was associated with Galgotias University
    as an assistant professor from 2012 to 2019, V.I.T. University, Vellore as an
    assistant professor from 2010 to 2012 and RVSCET, Jamshedpur as a Lecturer from
    2007 to 2008. He has rich experience in publication in many international journals
    and conferences with high repute. He is also serving many reputed journals as
    editorial board member and reviewer board member. Moreover, Dr. Sahana has also
    delivered expert talks and guest lectures in international conferences and serving
    as the reviewer for journals of IEEE, Springer, IGI Global, etc. His research
    areas are underwater wireless sensor networks, pattern matching, bio-informatics,
    IoT, security, and cryptography.'
