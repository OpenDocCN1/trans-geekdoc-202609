  md: 'A cockroach moves to the left when a signal is sent to the right antenna. Similarly,
    if a charge is sent to the left antenna, the cockroach moves right. The information
    is sent to the operator by the microcircuit via the device’s tiny Bluetooth antenna.
    An average cell phone can readily detect the signal; this is how a Roboroach works
    and we can control its movement from our own mobile devices.


    # 17.4 CYBORG RAT


    Researchers have created a very effective cyborg rat for loop resolution. The
    robot rat was built by implanting electrodes in its brain and strapping a portable
    micro-stimulator to its back. These devices allow a computer to communicate with
    the rat remotely, assisting it in finding the fastest course through a labyrinth,
    avoiding dead ends, and traversing loops. Rather than remotely controlling the
    rat, the computer provided ideas to assist the rat in making decisions [5].


    Bio-robots have been used in a variety of animals, including cockroaches, rats,
    pigeons, goldfish, and others. Bio-robots outperform standard mechanical robots
    in many ways, including mobility, environmental adaptability, and energy usage,
    and they have enormous potential in rescuing and search operations [7]. Rat robots
    are a common type of bio-robot. An operator can use a computer to give control
    commands to the rat robot, causing it to follow a predefined path. Rat robots,
    however, are severely limited in practical applications due to their need for
    human instruction. When human supervision is unavailable in some rescue and search
    duties, such as under the remains of a fallen building, the rat robot is intended
    to be controlled automatically [7].


    # 17.5 HOW ARE HUMANOID AND ROBOTS DIFFERENT FROM CYBORGS


    Humanoids and cyborgs are not the same things. Human intelligence is present in
    a cyborg, although it is largely based on robotics, whereas a humanoid incorporates
    AI in a human-like body [4]. Humanoid is also known as an android. Humanoids have
    detachable components, which means they may be updated with new parts or altered
    according to work at hand, but Cyborgs’ parts cannot be removed because they are
    inside the human body. Like other machines and robots, humanoids can be reactivated,
    repaired, and reassembled [4], but Cyborgs cannot since they are human beings.
    Cyborgs have increased senses, powers, and talents, as well as computer-based
    minds, mental and physical capacities well beyond those of humans.


    However, most people are unaware that cyborgs and robots exist, albeit not in
    the way that they are portrayed in films [10]. The existence of life is the primary
    distinction between a cyborg and a robot. A robot is essentially a highly advanced
    machine. It is frequently automated and requires relatively little human input.
    Cyborgs, however, are a biological creature combined with a machine. It doesn’t
    have to be a person; it could be a dog, a bird, or any other living thing. A cyborg
    is distinguished from a robot by the presence of a living component. This indicates
    that a cyborg, but not a robot, is alive. A robot can only do what it was programmed
    to do, but cyborgs, particularly human cyborgs, have free choice over their actions
    [11]. Some officials'
