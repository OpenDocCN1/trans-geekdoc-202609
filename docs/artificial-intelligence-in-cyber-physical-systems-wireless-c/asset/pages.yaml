  md: 'migration to urban cities for finding livelihood. A solution that could be
    presented using IoT and ML algorithms is of route optimization. This is basically
    a technique that could provide any particular driver with the shortest route to
    any destination by accounting in all of the external factors. These factors can
    include time of day, weather conditions, road surface conditions and any other
    possible vehicle accidents. This could lead to ground-breaking development as
    it can prove valuable in not only providing comfort to the general public but
    also help in reducing road accidents. Emission of harmful gases can only be reduced
    if the vehicles are made to run for a shorter duration [15]. Several ways of implementing
    a route optimization algorithm have been proposed. One of them is by using an
    Markov decision process (MDP) algorithm that establishes a communication between
    vehicles for a group route. This will lead to entire groups of vehicles collaborating
    with each other with the same destination for a collective effort [38]. The other
    approach that has been proposed is a ML technique of implementing k-means and
    deep belief network (DBN) networks to streamline the traffic situation [25]. Several
    other literatures have provided background on different types of traffic forecasting.
    Short-term forecasting of traffic is handled in [39], and several other techniques
    such as FF-NN, Nonlinear Autoregressive (NARX) model and Seasonal Autoregressive
    Integrated Moving Average (BN-SARIMA) have been proposed for it. The same problem
    along with its counterpart are dealt in [28] with respect to application of four
    ML algorithms. These four algorithms are then tested among each other for performance
    and result evaluations. These four algorithms include baseline predictors, RF,
    FF-NN and a regression tree. FF-NN and baseline predictors are also used in [29]
    to estimate variations in time and total duration of the journey.


    Researchers in [27] implemented a logistic regression model along with support
    vector machine algorithms and other models to predict traffic conditions. Lv et
    al. [40] used advanced data analytics and extraction to perform operations on
    the sensor data to predict the basic flow of traffic. The approach makes use of
    stacked autoencoder.


    Swarm intelligence algorithms are a new department in computer science as they
    are nature-inspired algorithms and show great performance in modeling real-life
    systems. One of them is the ant colony optimization algorithm that could be used
    in conjunction with mobile crowd-sensing for ITS. The passengers are able to communicate
    with them for data regarding routes, surface conditions and other factors to find
    out less congested routes. This draws an analogy to how ants find their way to
    food by following the secretion of pheromone/chemicals [43].


    Implementation of a different algorithm for route optimization is done in [42].
    It makes use of a vehicular ad-hoc network that gathers traffic situation using
    mobile navigation devices and optimizes the route. This is similar in comparison
    to the above-mentioned techniques as it lets vehicles interact between them to
    share the traffic conditions.


    The research in [43] takes a different approach of crowdsourcing the route planning
    by making use of a mobile application. An application by the name of Crowd Navi
    is installed on mobile devices, which wirelessly uploads the information about
    a particular traffic area to the Internet and among various vehicles.'
