  md: '$I_2^{t+1} = c_1 \times r \text{ and } (0,1) \odot (ZB_k \ominus Z_k^t)$ (13.20)


    $I_3^{t+1} = c_2 \times r \text{ and } (0,1) \odot (ZB^t \ominus Z_k^t)$ (13.21)


    Now, the velocity of $k$th particle for iteration $t+1$ is computed as follows:


    $V_k^{t+1} = I_1^{t+1} \oplus I_2^{t+1} \oplus I_3^{t+1}$ (13.22)


    To compute the velocity, the highest precedence is given to abstract scalar multiplication
    ($\odot$), and the abstract addition ($\oplus$) and abstract subtraction ($\ominus$)
    have the same priority. For these three operators, associativity is considered
    from left to right.


    The position of the $k$th particle for iteration $t+1$ is computed as follows:


    $Z_k^{t+1} = Z_k^t \oplus V_k^{t+1}$ (13.23)


    Similarly, the remaining particles of the population for iteration $t+1$ are computed.
    Next, the fitness value of each particle is calculated using eq. (13.2) and cluster-first
    and route-second approach as discussed in Section 13.5.1.


    Simulate annealing improves the convergence speed and avoids trapping in the local
    optimum, based on local search operators, i.e., 2-opt*, exchange, and relocate
    operators [24–26]. In the beginning, SA requires the best particle $ZB^{t+1}$
    of the population at $t+1$ iteration and then searches the neighborhoods of the
    given best particle. Initially, the temperatures’ value $\tau$ is initialized
    to a constant value. Next, the neighborhood particles (solutions) are searched
    by the stochastic application of 2-opt*, exchange, and relocate operators. An
    operator is selected randomly, and a neighborhood solution is generated. The better-quality
    neighborhood solution is accepted; otherwise, the worst solution with some probability
    value based on Boltzmann’s constant is accepted. It is obtained as follows:


    $\text{Prob}_A = \begin{cases} 1 & \Delta C \le 0 \\ e^{-\Delta C / \theta} &
    \Delta C > 0 \end{cases}$ (13.24)


    $\tau = \tau^* (1 - \varnothing)$ (13.25)


    where the $\Delta C$ represents the change in objective values and $\varnothing$
    is the rate of temperature change.


    All steps of the loop are repeated for a fixed iteration. At last, the APS algorithm
    returns the global best particle. Every particle saves its own best positions
    and adjusts the velocity considering its own best performance and best performing
    particle. The particles are using their personal best, socially best particle
    followed by the application of SA to search the neighborhood of the given particle.
    Eventually, the swarm will converge to near-optimal positions with good convergence
    speed.


