    # 2.2 LITERATURE REVIEW


    Several research materials focus on the latest trends and use of wireless BSN
    and wearable devices. IoT in the healthcare system has changed how the world thinks
    about the healthcare system and made it better for a lot of people.


    Castillejo et al. [11] demonstrated the use of wireless sensor networks in IoT
    to integrate wearable devices for an e-health application system. The focus was
    to build an efficient e-healthcare system for women or other people who work in
    a hazardous environment so that they can report and take necessary action immediately.


    He et al. [12] proposed a “wireless body area network (WBAN)” with a focus on
    the security of medical data. It used integrated circuits and embedded systems
    to capture data from the WBAN. Even though this chapter has proven to reduce the'
