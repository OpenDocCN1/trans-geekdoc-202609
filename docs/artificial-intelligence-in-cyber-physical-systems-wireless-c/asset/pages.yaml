    # 3.5.1 ARCHITECTURE OF THE SYSTEM


    Figure 3.4 shows the full system architecture which is divided into six various
    components:


    +   1. Management hub

    +   2. WSNs

    +   3. Blockchain

    +   4. Agent node

    +   5. Managers

    +   6. Smart contract


    1. **Management Hub:** As previously stated, the IoT devices in the system design
    will not be present in the blockchain network. The majority of IoT devices have
    low power and storage, as well as a limited CPU. Because of these constraints,
    IoT devices find it difficult to join in the blockchain network directly. We introduced
    the management hub, a unique node that serves as an interface whose role is to
    translate data from the IoT devices which are encoded in constrained application
    protocol messages into JavaScript Object Notation Remote Procedure Call data which
    can be readable by blockchain participants. A node in the blockchain such as a
    miner is directly linked with the management hub. As shown in Figure 3.4, a node
    in the blockchain can have many management hubs linked to it and similarly a management
    hub can have many WSNs linked to it. IoT devices may request data from the blockchain
    via the management hub.


    The management hub nodes cannot have any limits comparable to IoT devices since
    they must be able to handle many concurrent queries from the IoT devices and,
    hence, require high performance.'
