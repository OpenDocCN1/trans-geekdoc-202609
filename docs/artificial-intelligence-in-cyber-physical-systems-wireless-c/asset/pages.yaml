  md: 'communication standards, identification, discovery of networks, and management
    of devices, among other things. Nevertheless, the sheer number of “standards,”
    many of which are incompatible with one another, hasn’t completely solved the
    interoperability problem, which might stymie IoT system expansion without a substantial
    redesign of system components.


    # 10.5.3 OPPORTUNITIES


    In terms of reducing vulnerabilities and providing new municipal services, IoT
    in smart cities offers numerous potentials to the researchers and companies alike.
    The data collected by sensors in IoT devices can give a comprehensive perspective
    of city’s status, enabling the development of new applications and services using
    big data techniques. This heterogeneous data presents a fantastic opportunity
    for data analytics researchers to build innovative data science algorithms for
    maintenance delivery. To make IoT deployment faster and cheaper, there is a high
    monetary value placed on the progress and use of computationally inexpensive encryption
    methods, efficient data storage systems, and networking techniques. Another potential
    for the IoT researchers working on SCs is the progress of new sensor technologies.
    Creation of improved, greater efficiency, and reduced cost sensors would help
    construction of IoT infrastructure, enabling broad usage.


    # 10.5.4 THREATS


    There are numerous dangers associated with IoT devices used in smart cities, including
    user trust difficulties, concerns of privacy on account of network assaults, potential
    data theft, and so on. The most important interests of IoT applications are privacy
    and security. With such a personalized interaction mechanism between devices and
    people as in smart cities, data theft, the risks of leakages and privacy breaches
    are significant, and this is a constant interest for both service users and providers.
    Several cyber-attacks against SC’s infrastructure have highlighted the skill’s
    susceptibility to cyber-attacks, as well as the repercussions for the general
    public. Because IoT devices generally lack adequate computational capabilities,
    conventional security processes and techniques like routing, authentication of
    access, and networking may not be sufficient or viable in various IoT implementations.
    This has increased security and privacy issues for stakeholders in IoT ecosystem.
    Customers’ lack of confidence in SC apps may be exacerbated as a result of this.


    # 10.6 CHALLENGES FOR DEPLOYMENT OF IOT IN SMART CITY


