- pgno: 2
  md: '# Wireless Communications and Networking Technologies: Classifications, Advancement
    and Applications


    Series Editor: D.K. Lobiyal, R.S. Rao, and Vishal Jain


    The series addresses different algorithms, architecture, standards and protocols,
    tools and methodologies which could be beneficial in implementing next generation
    mobile network for the communication. Aimed at senior undergraduate students,
    graduate students, academic researchers and professionals, the proposed series
    will focus on the fundamentals and advances of wireless communication and networking,
    and their such as mobile ad-hoc network (MANET), wireless sensor network (WSN),
    wireless mess network (WMN), vehicular ad-hoc networks (VANET), vehicular cloud
    network (VCN), vehicular sensor network (VSN) reliable cooperative network (RCN),
    mobile opportunistic network (MON), delay tolerant networks (DTN), flying ad-hoc
    network (FANET) and wireless body sensor network (WBSN).


    # Cloud Computing Enabled Big-Data Analytics in Wireless Ad-hoc Networks


    Sanjoy Das, Ram Shringar Rao, Indrani Das, Vishal Jain, and Nanhay Singh


    # Smart Cities: Concepts, Practices, and Applications


    Krishna Kumar, Gaurav Saini, Duc Manh Nguyen, Narendra Kumar, and Rachna Shah


    # Wireless Communication: Advancements and Challenges


    Prashant Ranjan, Ram Shringar Rao, Krishna Kumar, and Pankaj Sharma


    # Wireless Communication with Artificial Intelligence: Emerging Trends and Applications


    Anuj Singal, Sandeep Kumar, Sajjan Singh, and Ashish Kr. Luhach


    # Computational Intelligent Security in Wireless Communications


    Suhel Ahmad Khan, Rajeev Kumar, Omprakash Kaiwartya, Raees Ahmad Khan, and Mohammad
    Faisal


    # Networking Technologies in Smart Healthcare: Innovations and Analytical Approaches


    Pooja Singh, Omprakash Kaiwartya, Nidhi Sindhwani, Vishal Jain, and Rohit Anand


    # Artificial Intelligence in Cyber Physical Systems: Principles and Applications


    Anil Kumar Sagar, Parma Nand, Neetesh Kumar, Sanjoy Das, and Subrata Sahana'
