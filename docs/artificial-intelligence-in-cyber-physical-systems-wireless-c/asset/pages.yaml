  md: '# Editors


    **Dr. Anil Kumar Sagar** is currently working as a professor in the Department
    of Computer Science and Engineering, Sharda University Greater Noida, India. He
    did his B.E., M.Tech., and Ph.D. in Computer Science. Before joining Sharda University,
    he has worked as a professor at the School of Computing Science and Engineering,
    Galgotias University, India. His current research interests include Mobile Ad
    Hoc Networks and Vehicular Ad Hoc Networks, IoT, and AI. He has published numerous
    papers in international journals and conferences including IEEE and Springer.
    He has received a Young Scientist Award for the year 2018–19 from the Computer
    Society of India and the Best Faculty Award for the years 2006 and 2007 from SGI,
    Agra.


    **Dr. Parma Nand** has received his Ph.D. in Computer Science & Engineering from
    IIT Roorkee, and M.Tech. and B.Tech. in Computer Science & Engineering from IIT
    Delhi. Prof. Parma Nand is having more than 27 years of experience both in industry
    and in academia. He has received various awards like the Best Teacher Award from
    the Union Minister, Best Students’ Project Guide Award from Microsoft in 2015,
    and Best Faculty Award from Cognizant in 2016. He had successfully completed government-funded
    projects and spearheaded the last five IEEE International Conferences on Computing,
    Communication & Automation, IEEE Students Chapters, Technovation Hackathon 2019,
    Technovation Hackathon 2020, and International Conference on Computing, Communication,
    and Intelligent Systems (ICCCIS-2021). He is a member of Executive Council of
    IEEE UP section (R-10), member Executive Committee IEEE Computer and Signal Processing
    Society, member of Exec. India Council Computer Society, and member of Executive
    Council Computer Society of India, Noida section and has acted as an observer
    in many IEEE conferences. He is also having active memberships of ACM, IEEE, CSI,
    ACEEE, ISOC, IAENG, and IASCIT. He is a life-time member of Soft Computing Research
    Society and ISTE.


    **Dr. Sanjoy Das** is working as a professor and head of the Department of Computer
    Science, Indira Gandhi National Tribal University (A Central Government University),
    Amarkantak, M.P. (Regional Campus Manipur), India. He did his B.E., M.Tech., and
    Ph.D. in Computer Science. He did his Ph.D. from Jawaharlal Nehru University,
    New Delhi. Before joining IGNTU, he has worked as an associate professor at the
    School of Computing Science and Engineering, Galgotias University, India. He also
    worked as an assistant professor at G. B. Pant Engineering College (A Govt. Institute),
    Uttarakhand and at Assam University (Central University), Silchar. He has 16+
    years of experience in teaching and research. He has organized many international
    conferences and attended as session chair. He has published 70+ research papers
    in SCI, Scopus indexed, referred international journals and conferences, including
    publishers IEEE, Inderscience, Elsevier, and Springer. He has been the editor
    of five books on cloud computing, vehicular ad hoc networks, etc. His current
    research interests'
  merge: -1
  img_proc: true
