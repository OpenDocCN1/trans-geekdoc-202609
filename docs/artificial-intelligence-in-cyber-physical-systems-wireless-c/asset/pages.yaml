  md: '+   1. Data security is better in fog than cloud because you don’t need to
    send the data to a centralized cloud and hence can be managed easily by the IT
    team. It also has the tendency to connect multiple devices in the similar network;
    due to this process other than centralized cloud process, it becomes easier to
    identify the security threat and can be managed before doing any damage.

    +   2. When the factor feasibility comes in our mind then fog is better, because
    a client can use fog service and create its own product as they want. Though it
    is very helpful for programmers also because programmers use various types of
    tools, they can easily do it here.

    +   3. Bandwidth problem is also solved in fog; the data transmission is done
    by the help of bandwidth, and this costs a lot, so to solve this issue, fog has
    been introduced; we can send it locally by the help of IoT devices instead of
    sending the information or data in the cloud.


    # 7.4.3.2 Disadvantages of Fog in Security


    Disadvantages of fog securities are as follows:


    +   1. Due to its complex features and logic, it only makes the network more complex
    and hence becomes more adamant to acknowledge.

    +   2. Though it has a large number of devices in this architecture, there is
    a huge chance of man-in-the-middle attack, and hence, due to the large spectrum
    of network and devices, it creates less secure circumambience.

    +   3. Maintenance in fog is not as easy as in the cloud. Just because a huge
    number of devices are disseminated, it is decentralized and tougher to maintain.


