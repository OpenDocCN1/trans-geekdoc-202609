    engineering technology. Biotechnology is one of the most important current technical
    areas. Individuals benefit from biotechnology through medical treatment, but we
    could be on the brink of a future in which people are made up entirely of biotechnology.
    Extending the natural limits of human lives or extending longevity is at the extreme
    end of improvement. For example, automobile technology allows us to travel at
    speeds that would be impossible to achieve in our natural state of leg movements,
    effectively extending and magnifying our natural state of being on foot [11].
    Regenerative medicine can provide sick or dying people with better wellness or
    a longer lifespan through organ transplantation. As a result, biotechnology has
    aided people, such as regenerative medicine, and those who are thus made up of
    biotechnology are enhanced by this technology, which effectively extends their
    lives and instills the courage to battle death.


    # 17.11 CONCLUSION


    The study of communication and control systems involving living creatures and
    machines is known as cybernetics. The artificial parts used to build cyborgs use
    these to serve the primary function of an organ; can also add to, enhance, or
    replace the computational capacities of biological systems.


    Cyborg implementation on insects is not new, many experiments were done on some
    insects, and these experiments are continuously going on to discover something
    new. Humanity is getting closer to merging with artificially intelligent robots
    thanks to a variety of cyborg technologies.


    In this study, a comparative study on cyborgs has been analyzed. Different techniques
    have been studied and a survey was conducted on 100 people of age group of 15–20
    years’ students of various colleges of Delhi University, India. The analysis shows
    that only 29% of people are aware of cyborgs and 71% do not know that cyborgs
    even exist.


    As many people are unaware of cyborgs and believe that robots, humanoids, and
    cyborgs are all the same, we have included some instances of the differences in
    this study. Real-life cyborgs are a wonderful illustration of how humans are less
    powerful than cyborgs. Furthermore, their organs can be replaced, recovered, or
    recharged as per the study suggested by prominent cyborgs mentioned in this study,
    such as Neil Harbisson, Dr. Kevin Warwick.'
