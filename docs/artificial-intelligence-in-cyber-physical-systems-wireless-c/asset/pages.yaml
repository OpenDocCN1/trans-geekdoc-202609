  md: 'understands. It goes beyond NLP by its ability to understand incomplete sentences,
    rhetorical question-answer system, etc.


    **Keyword Extraction:** Keywords are the shortest units of content that can be
    used to summarize the document. Keyword extraction technique is used to extract
    important information from text. Keyword represents concise information about
    the data. Basic idea of keyword extraction system is to extract the handful of
    keywords from continuous bag of words, thus representing small word set from full
    list of words.


    **Recurrent Neural Network:** RNNs are a variant of neural networks that take
    input from previous outputs. Traditional neural networks don’t have connection
    between the inputs. However, sometimes there is connection between the inputs.
    RNNs contain a hidden layer which stores the information about the previous sequence
    in order to predict the output of the current input. RNNs transform independent
    activations to dependent activations and thus give same weights and biases input
    to all the layers. Thus, current output depends upon the previous computations.
    It contains “memory” to capture information captured so far, i.e. capture slots
    filled so far. RNNs remember each and every information at every timestamp.


    **Gated Recurrent Unit:** RNNs suffer from vanishing gradient problem. Gated Recurrent
    Units aims to help vanishing gradient problem. GRUs decide what information to
    be passed ahead instead of passing all the information. Thus, they are trained
    to keep information from long time with washing away important irrelevant information
    from past.


    **Slot Filling Technique:** A major task in NLP is to define semantic concepts
    by filling in slots or set of arguments in order to achieve its goal. Thus, it
    is sequence classification problem in which each word is tagged with a slot or
    label. Thus, the input is collection of word in the form of sentence and generates
    output as sequence of labels for those words.


    **Content-Based Recommender System:** This system is used to predict user’s performance
    rating for a particular item [5]. Content-based recommender system predicts an
    item based on previous similar item. Thus, basic idea is if a person likes a particular
    item, person will also like similar item. Thus, it makes predictions based on
    past user predictions. Content-based recommender system relies on similarity of
    the items.


