    range from 600 MHz to 80 GHz, depending on the method.


    # 10.4.10 LONG RANGE WIDE AREA NETWORK (LoRaWAN)


    LoRaWAN is low-power wide area network (LPWAN) which consists of a back-end network
    server and several gateways and end devices. Connection to the cloud is provided
    via the back-end server. When it comes to transferring data to cloud, end devices
    don’t having a set relationship with single gateway &may transmit data to the
    numerous gateways.


    # 10.4.11 LOW-POWER WIRELESS PERSONAL AREA NETWORKS (6LoWPAN)


    The Internet Engineering Task Force (IETF) established 6LoWPAN, which stands for
    IPv6 over less-power networks, particularly for IoT applications to enable internet
    access to tiny devices. It’s a network based on IP that uses IPv6 for communication.
    It is a small-ranged network that uses ISM bands to communicate.


    # 10.4.12 SigFox TECHNOLOGY


    SigFox is a proprietary standard created by SigFox Inc., a company based in France.
    It performs ultra-narrowband bidirectional communication at low rates using unlicensed
    bands. SigFox, like LoRaWAN and 6LoWPAN, has a similar design and is a common
    LPWAN in the IoT area, enabling a sufficiently long communication range of up
    to 50 km. Smart lighting, building security, and environmental monitoring are
    all uses for SigFox.


    # 10.4.13 NARROW BAND IoT (NB-IoT)


    NB-IoT is a kind of LPWAN that uses the global system for long-term evolution
    (LTE) and mobile communications (GSM) bands to communicate. Because it is a bare-bones
    version of LTE, it may run on the same hardware having an upgrade in software.
    It can link up to 100,000 devices per cell.


    A comparison study among IoT technologies is given in Table 10.1.


