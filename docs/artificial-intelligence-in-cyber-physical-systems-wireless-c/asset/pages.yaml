    by the government in maintaining the railway infrastructure, regular delays in
    arrival and departure resulted in the decrease in its customers [62].


    # 5.3.2.1 Proposed Framework for Karachi


    The problem of traffic jam arises when the vehicles on a road surpass its capacity.
    Smart traffic system provides an efficient solution to this problem by not only
    alerting the residents about a possible traffic jam but also provides the next
    shortest route to the destination [63]. As we have already discussed in the previous
    section that the megacity of Karachi has seen enormous increase in its population
    and the lack of interest of the government, it is getting difficult day by day
    for the authorities to regulate traffic flow. Therefore, to give its citizens
    a sense of relief, the deployment of smart transportation system will be very
    beneficial.


    With the influx of such great technologies, the transportation infrastructure
    is getting more and more advanced. This not only enabled the system to detect
    the dynamic behaviors, but also fast and accurate exchange of data. Moreover,
    with ML on board, the system starts predicting the high time of traffic jam of
    a particular road, hence alerting the users to take an alternate route. The proposed
    framework of smart transportation management system is shown in Figure 5.5.


    The proposed model is designed keeping in mind the dynamic behavior of traffic
    flow in Karachi city. The proposed framework is divided in multiple administration
    sectors as per the landscape of the city. This administrative sector works as
    a subsystem and coordinates with the centralized information handling hub that
    processes the data received on regular intervals and conveys the information to
    its resident. This information can be conveyed in terms of multiple route or best
    time to travel. The junction will act as a brain of the system connected to various
    neurons (subsystems).'
