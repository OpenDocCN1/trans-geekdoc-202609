  md: '# FIGURE 15.6 Architecture of the model.


    ![](img/56cfba5af06305175d6488aec4d55ab0_297_0.png)


    **Embedding Layer:** The indexes are assigned completely random. Semantic relation
    between the words is not portrayed by the index assigned to them. For this problem,
    first the embedding layer is used which according to the vector of each word assigns
    new vector with updated indexes. This makes similar words have closer vectors.
    In short, this layer groups the words according to the meaning of the word.


    **Convolution Layer:** Bidirectional RNNs are challenging to deploy in online
    low latency settings. To counter this, a lookahead convolution layer is used which
    gets information from future subsequence in efficient manner to improve unidirectional
    RNNs.


    **Gated Recurrent Unit:** GRU is an extension of Long Short-Term Memory (LSTM)
    which is an extension of a simple RNN.


    GRU works on two gates, update gate and reset gate. In update gate, which information
    is discarded and which information is kept is decided while reset gate decides
    point in past up to which information should be kept. Since the created dataset
    is limited, the use of LSTM is not advisable which needs larger dataset. For this
    reason, a layer of gated recurrent units is used. Also, due to lesser tensor operations,
    GRUs are faster to train.


    **Time Distributed Dense Layer:** This layer is used for each word to determine
    the appropriate label for the word. Time distributed dense layer is used because
    it needs to apply fully connected dense on each time step and get output separately
    by time steps which helps us to keep one-to-one relations on input and output.
    The softmax function calculates probability of each label for the word and label
    with the highest probability is chosen. The type of gradient descent used for
    the model is Adam and loss function used is categorical cross-entropy. Adam is
    an optimization algorithm that is extension of the classical stochastic gradient
    descent procedure to update'
