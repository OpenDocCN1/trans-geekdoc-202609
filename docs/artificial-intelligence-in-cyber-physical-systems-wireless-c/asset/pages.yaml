    IoT applications have been a victim of this attack in various instances. These
    attacks artificially make the servers, or a network, too engaged to respond, and
    thus, the authorized users are unable to use the services of the IoT application
    [31].


    # 3.4 BLOCKCHAIN TECHNOLOGY


    Blockchain technology has been proven to be immutable which is based on the digital
    ledgers in a distributed manner without the use of any centralized repository
    and authority to manage and govern it. At the initial phase, blockchain enables
    the user domain to have transactions in terms of the shared ledger under the umbrella
    of user domain [32]. The basic idea is that during the normal operations of the
    blockchain network, the transactions remain unchanged once published.


    Let’s dig deep into the architecture of blockchain technology which is shown in
    Figure 3.3. The backbone of blockchain are the digitally distributed ledgers which
    are signed cryptographically and finally grouped into the blocks [33]. Each of
    these blocks is then attached/linked to its predecessor block which makes in tamper
    proof by leveraging the validation mechanism [34] and a consensus decision. Furthermore,
    when an additional block is appended to the chain, changing the preceding blocks
    becomes extremely complex (which makes it tamper-resistant).


    # 3.5 INTEGRATION OF BLOCKCHAIN WITH IOT


    We describe how blockchain technology can be used where the data about the access
    control is distributed and stored by proposing an architecture which discusses
    a decentralized system for access management. All the nodes except the IoT devices
    and the management hub will be included in the blockchain network. Most IoT devices
    will be unable to store blockchain data due to the constraints of low-powered
    IoT devices. We also design a specific node known as the management hub, which'
