    The authors in [25] present a detailed review of the literature work that shows
    that research work on AI for sustainability is hampered by issues such as overreliance
    on the historical data in machine-learning–based models, the uncertain human behavioral
    responses to AI-based interventions, expanding cyber security risks, negative
    effects of AI applications, and challenges in measuring intervention. Future AI
    for sustainability research should include many points as multilevel perspectives,
    design thinking, systems dynamics approaches, sociological and psychological considerations,
    and economic value factors, according to the review.


    The author in [26] investigates such techniques to discover plans for the explicit
