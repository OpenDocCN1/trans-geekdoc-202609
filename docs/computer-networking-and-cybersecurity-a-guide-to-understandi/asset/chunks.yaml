- raw: 'Chapter Two: Cyberattacks and 10 Types of Cyber Hackers The Internet that
    you know today came into existence in the 1960s, and it was only accessible to
    a few scientists, researchers, and the Defense Departments at that time. However,
    the user base for the Internet has evolved exponentially ever since. In the initial
    days, a cybercrime was described as physical damage to a computer and its infrastructure.
    This definition of cybercrime changed in the 1980s to include using a virus that
    would cause a computer to malfunction. The effect of cybercrime was marginal back
    then as the Internet was limited to mostly defense setups, large organizations,
    and research communities. The Internet was launched for public use in 1996 and
    was instantly popular with the masses to the point that it changed their lives.
    The Graphical User Interface for the Internet was designed simplistically, making
    it easier for users to understand the functionalities and characteristics of the
    Internet. Life was simple, and users only had to click on hyperlinks or type URLs
    into the browser without having to think about where the data on their browsers
    came from. They did not need to worry if anyone else had access to the data or
    if the data they received was snooped or tampered with by an attacker. As the
    Internet evolved, cybercrime’s focus shifted from merely damaging a computer physically
    or interfering with data to committing financial crimes. The Internet was at its
    peak by 2013, and the rate at which cybercrimes were being committed increased
    rapidly. Twenty-five computers became victims every second, and an estimated 900
    million users were already victims of cybercrimes. With almost everyone in the
    world now owning a smartphone, the number of victims has vastly increased. Classification
    of Cybercrimes Most cybercriminals attack organizations since most organizations
    maintain a database or server with large volumes of sensitive data about their
    employees and customers. A cybercriminal can either be an outsider or an employee
    of the organization. You can classify cybercrimes into two kinds based on this
    criterion. Insider Attack An attack on a system or computer infrastructure by
    someone who already has access to it is an insider attack. The attacker, in this
    case, is either an employee or a consultant working in the organization. These
    attackers perform the hack for various reasons, such as greed and revenge. An
    insider can perform an attack on the system easily since he or she is aware of
    the infrastructure, policies, and the weaknesses of the security system. This
    individual also has access to the organization’s network. Therefore, it is relatively
    easy for an insider to steal information or harm the infrastructure. An insider
    usually finds a window of opportunity for an attack, especially when they are
    assigned new roles in the organization. For example, when a company develops a
    new application, it may not have the necessary controls and policies in place
    to secure the data in the application. An insider can use this vulnerability to
    perform the hack. Insider attacks can be detected and prevented by installing
    intrusion detection systems internally within the organization. External Attack
    External attacks arise when somebody inside or external to the organization hires
    a hacker to attack the organization’s network and systems. External attacks are
    executed to cause financial and reputational losses to an organization. An external
    attack needs more planning and research when compared to an insider attack. Every
    external attack goes through the following stages: ● Planning ● Reconnaissance
    ● Scanning ● Gaining Access ● Maintaining Access If the organization’s network
    admin is experienced, he or she constantly checks the firewall logs and scans
    the systems and network to identify vulnerabilities. The organization can also
    use intrusion detection systems to detect and prevent external attacks. In addition
    to insider attacks and external attacks, there are two more types of cyberattacks:
    structured or unstructured. This classification is based on the experience of
    the attacker. Most people classify these attacks as external attacks, but there
    are cases where an employee has performed structured attacks on the organization
    for personal gain. These types of attacks are often carried out by rival companies.
    They may send one of their employees to the company and ask them to collect information
    from that company. This is known as corporate espionage. Unstructured Attacks
    An attack carried out by an amateur attacker without any predefined motive is
    classified as an unstructured attack. These attacks are often carried out using
    a penetration tool readily available on the Internet. The attacker may use this
    tool on the company’s network. Structured Attacks A structured attack is planned
    and executed carefully by an experienced and skilled professional with clear objectives.
    Attackers have access to powerful tools and technologies that help them access
    the target system or network without being detected by an intrusion detection
    system. Additionally, an attacker also has the knowledge required to modify an
    existing tool to suit the specific attack requirements. Reasons for Cybercrimes
    An attacker can choose to hack a system or network of an organization for multiple
    reasons. The following are some common reasons why cybercrimes happen. Money Attackers
    commit cybercrimes to earn money since this is an easier and faster way to make
    money. They use hacking methods, such as phishing and spoofing, to trick someone
    into revealing their account information. The attacker can use this information
    to transfer the funds from the victim’s account into their own. Revenge Some attackers
    may want to take revenge against another individual, organization, religion, or
    government. They may choose to hack these entities to cause financial and physical
    losses. This form of attack is known as cyberterrorism. Some attackers hack systems
    and networks when they want to test a new tool or software. The only objective
    of such an attack is to understand how the new tool or software works. Recognition
    Some attackers choose to attack to gain popularity. They may hack a defense or
    large organization’s systems and networks to make a name for themselves—anonymity.
    Cybercriminals can ensure their anonymity when they perform a hack. It is extremely
    easy for cybercriminals to get away with their attack since nobody knows how to
    trace the attack back to the cybercriminal. This anonymity, at times, has even
    motivated respectable citizens to commit a cybercrime for personal gain. Cyber
    Espionage Some governments may choose to overlook the data privacy act and track
    everything their citizens do. They may choose to do this for political or economic
    reasons. Types of Cyber Hackers Hackers are curious about how networks and computer
    systems work. They are skilled in coding and programming since they do their best
    to hone their programming skills. They also learn about various tools and technologies
    they can use to perform hacks. Since hackers attack an operating system, they
    learn more about the different kinds of systems and find their way around the
    system to identify any vulnerability. Here are the most common types of hackers.
    White Hat Hackers Hackers who have certifications and are authorized to conduct
    penetration tests for an organization or a government to identify vulnerabilities
    in their information systems are white hat hackers—or also known as ethical hackers
    or cybersecurity experts. They are a part of the security team in an organization,
    and their job is to prevent an attack on the organization’s system and network.
    They comply with the rules of engagement stated by the organization or government.
    Black Hat Hackers Black hat hackers, also known as crackers, want to access your
    system and network and steal, manipulate, or destroy your data. They implement
    common hacking practices for their attacks. They are lawbreakers or criminals,
    and it is easy to differentiate between a white hat and black hat hacker based
    on their objectives. Gray Hat Hackers These are hackers that fall in a spectrum
    between white hat and black hat hackers. Since they are not certified as cybersecurity
    experts, they can choose to work for or against the organization. The motives
    of the hacker determine whether he is a white hat or black hat hacker. Script
    Kiddies Script kiddies are known to be the most dangerous people in the hacking
    world since they lack experience and knowledge. They use any malicious tool or
    software available on the Internet without learning what it is used for. They
    also have no idea about the damage they can cause to the network or system. They
    attack computers and networks intending to mark their presence in the hacking
    world. Green Hat Hackers Green hat hackers are also amateurs of the hacking world,
    but there is a difference between them and script kiddies. They have little knowledge
    about hacking and work on developing the necessary skills to hack since they are
    passionate about becoming professional hackers. They are inspired by other professional
    hackers and keep in touch with them to learn to hack. Blue Hat Hackers Blue hat
    hackers are script kiddies who have some knowledge about hacking. They are different
    from green hat hackers since they perform a hack with malicious intentions. However,
    they do not have the intention to develop the necessary skills to carry out the
    hack. Red Hat Hackers Red hat hackers, also known as eagle eye hackers, are like
    white hat hackers. They do their best to counter any attacks carried out by black
    hat hackers. The difference is that red hat hackers are ruthless and destroy the
    network and systems used by black hat hackers. State-Sponsored Hackers As the
    name suggests, a country or state hires these hackers to hack into other countries’
    or states’ systems to extract defense-related information. They are on the government’s
    payroll. Hacktivist The online version of an activist is known as a hacktivist.
    They are anonymous hackers, and they target government systems for social and
    political reasons. Whistleblower An employee of a government or organization who
    feels their institution is being unethical and conducting illegal activities may
    choose to call it out against their conscience. They may also do this for personal
    gain. Such hackers are known as whistleblowers. Common Tools Used by Hackers Hackers
    use numerous tools to execute the perfect attack. The following are the most common
    tools in a hacker’s toolkit. Rootkit A rootkit is an application or a set of tools
    that allows hackers to gain remote control of a computer or network of computers
    connected to the Internet. The rootkit was originally developed to open backdoors
    in any software so that it could be fixed or updated with patches. Hackers tweaked
    this application to suit their needs. They now use this tool to control the operating
    system. Rootkits can be installed in various ways on a target system. The most
    popular methods are phishing and social engineering. Once rootkits are installed
    on a target system, the hacker can control that system. They can destroy or steal
    sensitive information from that system. Keyloggers Keyloggers are tools capable
    of recording every key pressed on the keyboard. Keyloggers cling to the Application-programming
    Interface of any application and record every keystroke made by the user when
    they access the application. The recorded keystrokes are saved to a file that
    contains sensitive data, such as usernames, passwords, website URLs, opened applications,
    etc. Keyloggers are scary as they can record credit card details, mobile numbers,
    personal messages typed in email applications, etc., provided they were typed
    using the keyboard. Keyloggers are planted using malware such as Trojan horses
    on a target’s computer. Vulnerability Scanners As the name suggests, a vulnerability
    scanner is used to scan networks and computer systems to identify vulnerabilities
    or gaps. Ethical hackers commonly use this tool to identify loopholes in a system
    so they can patch them as soon as possible. Black hat hackers also take advantage
    of vulnerability scanners to discover weaknesses in a target’s system or network
    to exploit them. Types of Cybercrime It is also important to understand the crimes
    a person can commit using digital platforms, such as computers and the Internet.
    Here are the various types of cybercrimes people commit today. Cyberstalking When
    someone uses the Internet to stalk another person, harass, or threaten them, it
    is cyberstalking. A cyberstalker often uses applications like email, online messengers,
    social networking websites, etc., to execute cyberstalking. These mediums offer
    anonymity. Cyberstalking includes activities such as sexual harassment, monitoring
    someone’s private life, false accusations, etc. Forgery/Counterfeiting It is a
    crime to counterfeit documents. With advanced applications available today, it
    is easy to create a document that looks exactly like the original. It becomes
    difficult to differentiate between the correct and fake documents unless you are
    an expert. Child Pornography Possessing, uploading, or downloading the sexual
    content of a minor is a cybercrime. Multiple websites on the Internet promote
    child pornography and exploit many minors in the world. Cyber Terrorism Some people
    use digital resources to spread hatred against a religion, country, etc. This
    is an act of terrorism and is known as cyber terrorism. Piracy Content is available
    digitally today and can be easily copied and distributed over the Internet. Distribution
    of content owned by someone else is illegal. For example, the illegal distribution
    of movies or music over the Internet is classified as piracy and is a cybercrime.
    Computer Vandalism Destruction of digital resources, either using physical means
    or malicious code, is computer vandalism and a cybercrime. Phishing Phishing is
    the process of tricking someone into disclosing their sensitive information, such
    as bank account details, via email. The attacker sends an email that resembles
    emails sent from a bank or other financial institutions using a domain similar
    to the bank’s domain. The attacker can ask the victim to provide sensitive information,
    such as their account number, password, etc. The attacker can then use this information
    to transfer funds from the victim’s account into theirs. If the hacker performs
    the attack using a telephone, it is known as vishing or voice phishing. Hacking
    Hacking is the act of accessing a computer that does not belong to you to steal,
    modify, or destroy data present on it. The motive behind performing a hack can
    be political or social. Spreading Malware Some hackers use different websites
    to spread malware. They may do it for fun or have certain objectives. Malware
    can destroy systems resulting in financial losses for a business or individual.
    The losses include the cost of repairing the system and the data destroyed. If
    the hacker is found, the business can sue them for damages. Cross-Site Scripting
    Some notorious attackers inject a client-side script into the website’s code.
    An innocent user who visits this website ends up executing this script, and the
    script scans the cookies in the user’s network. The script uses the cookies to
    collect sensitive information and transfer that information to the attacker’s
    system. The attacker can use this information to gain access to the user’s computer
    or sessions on a website and use it to exploit the user financially. Spamming
    The act of sending bulk unwanted and unnecessary emails over the Internet is spamming.
    An email can be called spam if it is one of the following: ● Anonymous: The sender
    remains anonymous. ● Bulk Mail: The sender sends one email to multiple users.
    ● Unsolicited email: The sender did not request the email. Spam emails not only
    congest the victim’s inbox, but they also congest the network. Cyber Squatting
    The act of registering a domain using a trademark of another organization with
    the intention of later selling it to the organization that owns it for a high
    cost is cybersquatting. Online Auction Frauds Various websites on the Internet
    conduct online auctions, and cybercriminals take advantage of these websites.
    They clone the website, and any payment made during the auction moves to the hacker’s
    account. Internet Time Thefts Internet time thefts are mostly a crime of the past
    where an attacker steals a user’s Internet Service Provider (ISP) details and
    uses that information to surf the Internet at the cost of their time. This means
    the user is charged for the time spent on the Internet. Web Jacking Web jacking
    is when an attacker hacks an organization’s website to display irrelevant information.
    They may also use this opportunity to spread awareness about the organization’s
    activities. Web jacking serves political, social, or economic interests. Denial
    of Service Attack DoS or Denial of service is where the attacker floods a network
    with unnecessary traffic so that a website or domain becomes inaccessible. Email
    Spoofing Hackers manipulate headers of an email, so it does not show the source.
    This is done to trick the recipient into giving away sensitive information. Salami
    Attack A salami attack is marginal in nature and can go unnoticed for a long period.
    An example of a salami attack is when the attacker targets bank accounts of multiple
    users to withdraw 1 cent every day from each account. The users would not notice
    it, but 1 cent from multiple users’ bank account over many days can amount to
    a lot of money in a few months or years. Banks now monitor any unusual withdrawals
    immediately and notify the owner about the transaction. Data Diddling The act
    of manipulating data before it is entered into a computer system is data diddling.
    For example, an attacker can change the salary they are due to receive from the
    company on the day of payroll calculation. They can receive a higher salary from
    the company, but the company’s report shows they were paid the amount they were
    due. Logic Bombs Malicious code injected into genuine software is known as a logic
    bomb. The malicious code is triggered by an action the user performs. When the
    malicious code is triggered, it can destroy information on the system or destabilize
    the system. '
