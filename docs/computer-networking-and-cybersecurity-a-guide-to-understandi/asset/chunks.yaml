    你会发现 1000Base-T 网络与其前身 100Base-T 网络惊地相似，但在网络布线要求等方面有所不同。星型拓扑网络比总线拓扑网络更贵，因为使用的有线网络电缆更多。此外，安装这些电缆的人力成本更高，路由器或集线器的需求也增加了总成本。然而，这种昂贵的预算并非毫无价值。星型拓扑比使用总线拓扑的网络更可靠，并提供更好的性能。它不仅提供更高的带宽性能，而且如果隔离的网络连接中断或损坏，其他连接将保持不受影响。即使星型拓扑网络出现问题，故障排除也很简单，因为每根网络电缆都直接从集线器连接到节点。


    ### 形拓扑

    与我们之前讨论的两种使用物理网络电缆布局的拓扑不同，环形拓扑网络使用的是逻辑布局。详细来说，在环形拓扑中，实际的物理网络电缆布局是星型拓扑，电缆的每个节点都连接到自己的介质访问单元（Media
    Access Units）。但问题在于：尽管物理布局是如此，网络电缆在电气上的表现却是一个环形。这意味着来自网络的信号以环形的方式通过不同的节点传输。


    下面展示了环形拓扑网络的简单插图。

    ![](img/Image00010.jpg)(环形拓扑的物理表示)

    ![](img/Image00011.jpg)(环形拓扑的电气表示)


    与基于以太网的总线和星型网络拓扑不同，环形拓扑基于令牌环网（Token Rings）。有时，使用环形拓扑的网络也可以运行在光纤网络上，通常带宽容量为 100
    Mbps 而而不是铜基电缆。这种网络基于 `FDDI` 或光纤分布式数据接口（Fiber Distributed Data Interface）。环形拓扑的主要用途是大型电信网络，例如同步光网络
    `SONET`。环形拓扑也用于存储区域网络。


    # 第 4 章：无线通信系统与连接互联网


    ## 什么是无线通信？

    无线通信很少需要物理介质或通道来传输信号。相反，这些信号通过空间传输，通常被称为非引导通信介质。


    ## 连接互联网

    在本节中，你将学习互联网连接的基础知识及其特性。


    ### 广域网

    广域网或 `WAN` 只是范围更广的局域网。广域网可以定义为多个相互互连的局域网。当局域网需要更好且范围更广的方法时，会优先选择广域网。建立广域网可以通过多种方式实现。为了确定在设置
    `WAN` 时采用何种方法，组织或公司需要考虑不同的方面，例如：


    - 局域网使用的频率。

    - 局域网之间相互连接的频率。

    - 网络所需的“带宽”或数据容量。

    - 每个局域网点之间的距离测量。


    通过考虑这些因素，可以实施合适的解决方案来建立最优广域网。例如：


    1. 使用租赁电话线建立广域网，该线路能够支持高达 `56Kbps` 的带宽。

    2. 使用专用的 `DS1` 线路建立广域网，该线路能够支持高达 `1.544 Mbps` 的带宽。

    3. 使用专用的 `DS3` 线路建立广域网，该线路能够支持高达 `44.736 Mbps` 的带宽。


    可以使用私有卫星建立广域网，这最终支持更高的带宽。因此，为了为 `WAN` 连接选择最佳方案，建议首先评估情况和需求，得出明确的解决方案。广域网的出现是因为局域网的用户需要访问另一个局域网上的资源。这在大型机构中经常被观察到，例如大型企业、组织、银行和学校等。


    ### 互联网与内网

    考虑到互联网的普及及其在现代社会中的重要性，如果任何业务公司不正确使用互联网，其生产力就会瘫痪。处理和维护网络互联网连接是一项非常关键的工作，因为即使是几分钟的网也会给组织带来一堆问题。因此，互联网是计算机网络中非常关重要的服务和功能。现在很少有人不熟悉互联网。凭借其惊人的生产力和可及性，几乎所有公司现在都利用互联网的关键服务，如
    `e-mails`、访问万维网和使用 Usenet 新组。


    在网络上实现互联网连接涉及另一个名为互联网服务提供商（ISP`）的实体。个人或组织与 `ISP` 的连接基本上是电信网络连接。从 `ISP` 到客户端的连接是通过使用物理介质（如线路）建立的。`ISP`
    根据客户提供几种类型的连接，例如：


    - `DSL` 线路

    - `ISDN` 线路

    - `Fractional/Full DS1` 连接


    '
