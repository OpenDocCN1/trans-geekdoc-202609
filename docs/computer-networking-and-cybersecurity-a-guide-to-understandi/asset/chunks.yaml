    After a suitable line supported by the ISP is chosen, it is installed into the
    designated domicile by stretching the line to the building and connecting it to
    a special box, which is known as a `CSU/DSU` (channel service unit and data service
    unit). The main purpose of this box is data conversion, i.e., converting the form
    of data being carried by the specified local telephone company into a form usable
    by the Local Area Network. Also, this `CSU/DSU` box is then connected to a router
    (or a modem), which handles the routing of data packets between the Local Area
    Network and the Internet. Sometimes, this `CSU/DSU` box is built within the router
    provided by the ISP.


    ## Internet Connection Security

    Now let’s discuss the security of an Internet connection. When an ISP “ships”
    an Internet connection to its client, they provide them with a router during the
    installation. The data packets being sent out by this router are automatically
    filtered to prevent a data packet leak. The more common software-based security
    generally adopted by users is a ‘firewall.’ This program is what intelligently
    limits any unnecessary connection to a server on the Internet that an application
    on the computer might request. It also blocks harmful incoming traffic, which
    is usually from a hacker. So, by using a firewall, we can secure our computer
    systems from potential online threats while using the Internet.


    ## Intranet vs. Internet

    So far, we have discussed the Internet as an immensely interconnected network
    of people around the world. We will now discuss something similar to the Internet,
    and that is the ‘Intranet.’ They sound and work similarly. While the Internet
    is basically focused on external connectivity, an intranet is a form of network
    focused on internal connectivity.


    For instance, let’s say there is a company that wants to host a web page or even
    a server only for its employees to access. It needs an Intranet. The company will
    use a primary web server that will store all the resources of the company, such
    as documents, employee handbooks, invoices, and all such data regularly published
    within the company for the employees and departments. Hence, it becomes a miniaturized
    version of the Internet solely dedicated to the internal network infrastructure
    of the organization.


    However, the functionality of the intranet does not simply end here. It can perform
    Internet-related tasks, such as providing File Transfer Protocol (`FTP`) and Usenet
    servers. An intranet is implemented and maintained by the organization or company
    within the limits of its own Local Area Network. Usually, an intranet is not accessible
    from outside the LAN, but there are cases where penetration can happen.


    ## Features of Networking

    Up to now, we have discussed the simple relationship between computers connected
    on a network (`P2P` and `Client-Server Networks`). Now that the reader has developed
    an understanding of how connected computers interact with each other, we can discuss
    some tasks that they can perform on a network. This can be called the features
    of computer networking. In this section we will discuss these features:


    * File Sharing

    * Printer Sharing

    * Application Services

    * E-mail

    * Remote Access


    ### File Sharing

    Back in the day, file sharing was the very reason that people would use computer
    networks. In the mid-1980s the ability to share files and data from one computer
    to the other connected in a network without using physical storage devices was
    a revolutionary deal. Although it may not seem like much today, consider this:
    to share a file or media content with your acquaintance, you first had to store
    it in removable media storage and then physically get that media to that person.


    File sharing was so important that companies would specifically install a computer
    network to use this feature. File sharing usually entails the files that people
    would need to access regularly. Spreadsheets and word processing files are common
    examples, although there are many others. To enable file sharing, the first requirement
    is for those computers that require shared access to be connected in a network.
    Next, there should be a ‘shared drive’ which acts as a network place for the files
    to be stored while allowing users connected to the same network to access these
    shared files on their system remotely.


    To eliminate a repercussion of file sharing, namely that any user can modify the
    contents of the shared file, the system should have proper authorization privileges
    in place. This means that not every user in a computer network will have administrator
    rights that will allow them to change the files or the shared drive. This is also
    known as ‘file locking.’ Another reason for file locking is so the multiple users
    who are accessing the shared drive or the folder are not modifying it with conflicting
    changes simultaneously.


    ### Printer Sharing

    The printer sharing feature is also of great importance and makes computer networking
    even more useful. As the name suggests, printer sharing refers to sharing the
    printing resources between users within a computer network. If a company places
    a printer in one office, then it is possible to share the functionality of this
    single printer with every employee in the office using a computer network. This
    is not only economical for the company but the users. Since the office requires
    only one printer, the company can afford to pitch in for some high-quality top
    of the line printer designed to handle huge workloads. By implementing a computer
    network, a company can enjoy the economic benefits of printer sharing.


    Now we’ll discuss some details of how printer sharing works. Even though there
    are multiple ways printer sharing can be done, the most common method is to use
    a printing queue that holds the printing requests of the users in the interconnected
    computer network. This queue ensures that the printing task in progress is not
    disturbed by the other incoming requests, and the new printing tasks are not performed
    by the machine until the current task is completed. This method is recommended
    due to its efficiency.


    Another way of performing printer sharing is to allow the independent workstations
    to have direct access to the printer itself. The printer itself supports a setting
    where it''s configured to connect to a network as an ordinary workstation would.
    If there is a high demand for the resources of the shared printer, then the independent
    workstations are instructed to stand-by until it’s their respective turn. But
    this is not efficient. In the printer queue method, there is a special server
    known as the ‘print server’ which automates sending print requests according to
    their timestamps or urgency. There are several ways to set up a print server:


    1. Using a file server connected to the printer network.

    2. Using a workstation running special printing software and is connected to the
    network and printer. In this way, the software communicates with the other computers
    on the network, taking their print requests and forwarding them to the printer
    through the host computer.

    '
