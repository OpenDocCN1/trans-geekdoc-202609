    # 结论


    到目前，我们已经涵盖了与计算机相关的各种主题。我们全面讨论了计算机网络，因为在如今由互联网主导的现代社会中，它非常重要。我们学习了 OSI 网络模型，以及不同的协议和网络应用程序是如何遵循这一模型的。在处理完计算机网络后，我们将注意力转向了网络安全，这是一个非常重要的的话题，因为没有人希望自己的数据被泄露或滥用。


    在本书的最后部分，我们重点关注了网络设计和黑客攻击等主题，后者更具趣味性和信息量。黑客攻击是任何拥有正确工具和知识的人都可以做的。本书解释了黑客攻击的通用过程，即“杀链过程”。本书为读者提供了每个主题的精华，希望读者对书中讨论的每个主题建立基础的概念基础。在学习与书中涵盖主题相关的任何材料时，读者将拥有足够的背景知识，能够轻松消化面向中高级别受众的信息。


    # 第二部分：网络安全

    ## 网络安全、计算机网络新手入门指南：如何保护自己免受钓鱼、恶意软件、勒索软件和社会工程形式的攻击


    ![](img/Image00013.jpg)


    ### 引言


    互联网可能是二十世纪最重要的发明，它以人们无法意识到的更多方式影响着人们的日常生活。自从互联网发明以来，一切都改变了——你交流、玩游戏、购物、工作、听音乐、看电影、付账单、点餐，甚至交朋友的方式。想一你想任何东西，可能都有对应的移动或
    Web 应用程序。


    互联网让人们的生活变得非常舒适。你不再需要排队或通过写支票来支付账单。你只需点击几个按钮即可完成。技术已经进步到这种程度，数百万台设备能够连接到互联网——大多数设备不需要连接到你的电脑。有智能手机、平板电脑等，通过它们你可以随时与朋友保持联系，甚至随时工作。


    互联网不仅简化了事情，由于它不仅被富人而且被社会各阶层使用，还让事情变得更具效益。过去，由于电信运营商收取的费用影响，人们在拨打国际电话之前必须深思。今天，你可以利用互联网在世界任何地方以廉的资率进行标准通话和视频通话，在某些情况下甚至是免费的。互联网还改变了电视等传统设备的普及率，因为人们现在更倾向于通过互联网上的订阅模式观看所有内容。人们不再仅仅是为了打电话而使用手机，还有大量其他活动，例如看电影、在线订票等。


    互联网甚至让居家办公成为可能，这对于父母来说非常方便，因为他们可以同时看孩子。换句话说，自从互联网出现后，人们变得更近了。然而，互联网也为新型犯罪——网络犯罪提供了道路。当互联网成为人们聚集和社交的场所时，它为网络犯罪分子提供了巨大的机会。


    犯罪分子意识到，随着一切都数字化，他们也需要适应并同样数字化。他们并没有花费长时间就理解到整个世界都在利用互联网提供的服务进行购物、银行、点餐等活动，而所有这些活动都有共同点——通过数字媒体进行金融交易。如今，每天都有数十亿美元、英镑和其他数千种货币通过互联网流动，这对犯罪分子来说具有巨大的吸引力，为他们实施犯罪提供了另一种途径。小偷不再需要走进银行偷钱了；这可以在互联网上完成。这导致了在互联网上实施犯罪的被称为网络犯罪的网络犯罪分子的出现。


    在本书中，你将学习到各种网络犯罪以及网络犯罪分子是如何实施它们的。如果现实世界中有法律来监控犯罪活动，那么数字世界也有相应的流程来控制网络犯罪。网络安全是互联网上的一个热门词汇，这正是本书的重点。你将学习各种利用网络安全来反击网络犯罪的手段。读完本书后，如果你是一个有抱负的学生或希望从当前职业转型的人，你还将了解到安全测试以及你在网络安全领域可以拥有的职业。这本书将为你开启新可能的大门，并唤醒你内心深处数字版的福尔摩斯。


