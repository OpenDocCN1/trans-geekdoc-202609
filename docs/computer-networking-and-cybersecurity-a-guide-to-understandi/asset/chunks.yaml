- raw: "*   A distinguishing feature of hubs is that they can effectively cut off\
    \ a misbehaving node from the other properly functioning nodes by shutting it\
    \ off. This process is also known as ‘partitioning.’ The scenarios in which a\
    \ hub partitions a node include detection of a network-cable short circuit, an\
    \ excessive influx of data packets from a hub port flooding the network, and detection\
    \ of a serious problem relating to the hub port. Effective partitioning of a malfunctioning\
    \ node prevents the same effects from negatively affecting the other nodes functioning\
    \ normally. \n\nAs technology is developing, the mechanics and infrastructure\
    \ of a hub device are also becoming increasingly sophisticated. Newer versions\
    \ and models of hubs include pretty neat and advanced features out of the box.\
    \ \n\n*   Hubs now include a built-in management feature; by using network management\
    \ protocols such as SNMP, a hub can be managed centrally, over the network. \n\
    \n*   There are hubs now available that can automatically detect the connection\
    \ speed of the network and run each node at that speed. For instance, a hub detecting\
    \ a 10Base-T network will run each node at 10 Mbps. Similarly, for a 100Base-T\
    \ network, the hub will run each node at 100 Mbps. \n\n*   Hubs are using uplinks\
    \ with faster speeds to connect to a backbone. The average speed of the uplink\
    \ is usually ten times that of the basic speed of the hub. For instance, a hub\
    \ with a basic speed of 100 Mbps will have an uplink with a speed of 1 Gbps. \n\
    \n*   Hubs now come with a built-in bridging and routing feature. Previously,\
    \ networks using hubs would require separate dedicated hardware devices to perform\
    \ bridging and routing functions. With this function built into the hubs, using\
    \ such devices has become obsolete. \n\n*   Hubs feature a built-in switching\
    \ function. With this feature, the hub can switch the nodes instead of sharing\
    \ them. "
  fmt: '

    A distinguishing feature of hubs is that they can effectively cut off a misbehaving
    node from the other properly functioning nodes by shutting it off. This process
    is also known as ‘partitioning.’ The scenarios in which a hub partitions a node
    include detection of a network-cable short circuit, an excessive influx of data
    packets from a hub port flooding the network, and detection of a serious problem
    relating to the hub port. Effective partitioning of a malfunctioning node prevents
    the same effects from negatively affecting the other nodes functioning normally.


    As technology is developing, the mechanics and infrastructure of a hub device
    are also becoming increasingly sophisticated. Newer versions and models of hubs
    include pretty neat and advanced features out of the box.


    *   Hubs now include a built-in management feature; by using network management
    protocols such as `SNMP`, a hub can be managed centrally, over the network.

    *   There are hubs now available that can automatically detect the connection
    speed of the network and run each node at that speed. For instance, a hub detecting
    a `10Base-T` network will run each node at `10 Mbps`. Similarly, for a `100Base-T`
    network, the hub will run each node at `100 Mbps`.

    *   Hubs are using uplinks with faster speeds to connect to a backbone. The average
    speed of the uplink is usually ten times that of the basic speed of the hub. For
    instance, a hub with a basic speed of `100 Mbps` will have an uplink with a speed
    of `1 Gbps`.

    *   Hubs now come with a built-in bridging and routing feature. Previously, networks
    using hubs would require separate dedicated hardware devices to perform bridging
    and routing functions. With this function built into the hubs, using such devices
    has become obsolete.

    *   Hubs feature a built-in switching function. With this feature, the hub can
    switch the nodes instead of sharing them.

    '
  trans: '


    集线器的一个显著特征是，它们可以通过关闭节点来有效地将异常节点与其他正常工作的节点隔离开。这一过程被称为“分区”。集线器对节点分区的场景包括：检测到网线短路、集线器端口数据包过载导致网络风暴，以及检测到与集线器端口相关的严重问题。对故障节点进行有效分区可以防止相同的影响负面影响其他正常运行的节点。


    随着技术的发展，集线器的机制和基础设施也变得日益复杂。新版本的集线器模型内置了非常整洁且先进的特性。


    *   集线器现在内置了管理功能；通过使用 `SNMP` 等网络管理协议，可以通过网络对集线器进行集中管理。

    *   现在已有可以自动检测网络连接速度并以该速度运行每个节点的集线器。例如，检测到 `10Base-T` 网络的集线器以 `10 Mbps` 的速度运行每个节点。同样，对于
    `100Base-T` 网络，集线器将以 `100 Mbps` 的速度运行每个节点。

    *   集线器正在使用更快的上行链路连接到骨干网。上行链路的平均速度通常是集线器基础速度的十倍。例如，基础速度为 `100 Mbps` 的集线器其上行链路速度为
    `1 Gbps`。

    *   集线器现在带有桥接和路由功能。以前，使用集线器的网络需要单独的专用硬件来执行桥接和路由功能。随着这些功能内置于集线器，使用此类设备已变得过时。

    *   集线器具有交换功能。通过此功能，集线器可以切换节点而不是共享节点。


    '
