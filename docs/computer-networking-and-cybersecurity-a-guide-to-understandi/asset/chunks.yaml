    HTML documents are commonly accessed by using web browsers such as Google, Chrome,
    and Safari. The Hypertext Transfer Protocol is what controls the transfer of data
    between the client and the webserver. This protocol operates at the application
    layer of the OSI model. The `HTTP` protocol makes use of other Internet protocols
    and `DNS` to establish a connection between the web client and the webserver.
    The `HTTP` protocol itself is insecure because transferring data happens with
    no encryption and can be intercepted. To resolve this security issue, we now use
    ‘HTTP secure’, commonly known as `HTTPS`, and `SSL` (Secure Socket Layers).


    ## File Transfer Protocol (FTP)

    The word `FTP` refers to both ''File Transfer Protocol'' and ''File Transfer Program,''
    both of which are related to each other in that the latter is an application that
    makes use of the `FTP` protocol. However, in this section, we will only discuss
    the `FTP` protocol. `FTP` performs at the application layer in the OSI model,
    and it defines the method by which file data is sent and received between the
    `FTP` client and the `FTP` server. The data transferred can be text-based or binary-based,
    and there is no limit on the file size `FTP` can handle. To perform a file transfer,
    the user must first connect to the `FTP` server and log in with a valid username
    and password. Some sites allow users to enter the username ''anonymous'' with
    their e-mail address being the password. This is known as ''Anonymous FTP.''


    ## Network News Transfer Protocol (NNTP)

    This protocol is specifically used for Usenet. `Usenet` is a term referring to
    discussion groups on the Internet. These groups cover a huge variety of topics,
    and at the moment, there over ten thousand Usenet groups on the Internet. The
    conversations of a Usenet group are sent to the Usenet servers, which are then
    sent to the other international Usenet servers by echoing. Several classifications
    of Usenet groups are:


    - `Alt`: Usenet group that focuses on topics on alternate lifestyles and miscellaneous
    issues.

    - `Comp`: Usenet group that focuses on computer topics.

    - `Gov`: Usenet group that focuses on discussions about governments.

    - `Rec`: focus on recreational topics.

    - `Sci`: focus on discussions about science.


    Usenet groups are not all public. Those groups that are public get the news echoed
    by other Usenet servers, but the private ones are generally hosted by some organization
    or institution. Private Usenet groups require users to authenticate themselves
    with proper usernames and passwords. The phenomenon of Usenet is made possible
    only by the `NNTP` protocol. This protocol establishes a connection between the
    Usenet server and the Usenet reader. The protocol also handles message formatting.
    This makes it possible for the messages to be text-based or carry binary attachments.
    Messages with binary attachments are encoded through `MIME`, or Multipurpose Internet
    Message Encoding (the same encoder used for e-mail attachments).


    ## Simple Mail Transfer Protocol (SMTP)

    The Simple Mail Transfer Protocol handles the sending and receiving of e-mails
    from one e-mail server to another. The `SMTP` protocol is simply a way to communicate
    with the sending and receiving systems of e-mail servers. The `SMTP` protocol
    comes into play when the system sending the e-mail message connects to the receiving
    system through port `25`. Once the connection between the two systems has been
    established, the sender then transmits a `HELO` command along with its respective
    address towards the receiving system. Once this command has been acknowledged,
    and the receiver responds with its own address, then communication is initiated.
    The sender can then issue a command indicating it wants to send a message, by
    specifying the intended recipient of the message. Once the receiving system gets
    this request, it looks for the recipient. If the recipient is known to the system,
    then the request is acknowledged, and the sending system then forwards the message,
    along with any attachments, to the recipient. Once the receiving system has acknowledged
    that the entire message has been received, it terminates the connection.


    ## Keeping the Networks Safe with Firewalls

    Most people reading this book would have come across the Windows firewall prompt
    at least once. This firewall application running on your machine is what keeps
    the network security policies upheld. Firewalls are hardware devices that protect
    a network by enforcing the network’s security policies. In most networks, a firewall
    is installed into the router itself, leveraging its micro-processing chip and
    built-in memory. This is true with networks designed and installed in small offices
    or similar scenarios. However, for large networks, the networking equipment includes
    dedicated hardware running the firewall. This hardware can be a single unit or
    multiple pieces. Normally, a separate computer running the firewall software is
    designated for the network. Otherwise, there can be a firewall device with a computer
    chip within it. Generally, a firewall acts as an outpost stationed between a `
    and the `Internet`. Regarding the firewalls available for use, there are mainly
    two types:


    1. **Network-Based Firewall**: This firewall operates at the third layer, also
    known as the data-link layer, of the OSI networking model. The security technique
    used by a network-based firewall is primarily ‘packet filtering.’ Using this technique,
    the firewall is programmed with a defined set of rules. Whenever data packets
    travel between the two networks, the firewall analyzes and compares this packet
    against the rules and then decides whether the packet should be allowed to arrive
    or depart from the network or not. The permission or denial of passage according
    to the packet-filtering rules for the data packets is usually based on their destination
    address, source address, or the `TCP/IP` port.

    2. **Application Based Firewall**: This firewall serves the role of a proxy. The
    word ‘proxy’ in this context means that the firewall represents the user’s interactive
    session with the server of which services are requested. An application-based
    firewall allows no data traffic to pass through the two networks directly. Instead,
    the communication between the two networks will be handled on one side by the
    firewall, as a proxy. This is why an application-based firewall is also known
    as a ‘proxy firewall.’ The technique used by a proxy firewall is ‘NAT,’ also known
    as ‘Network Address Translation.’ In this technique, the main idea is to conceal
    the network addresses of the internal network so it is not directly visible to
    the external network. In an application-based model, the firewall is responsible
    for the transmission of data to the network addresses for which the connections
    are established.


    ## Chapter 3: Getting into the Networking Hardware Fundamentals of Computer Relationships

    The term ‘computer relationship’ refers to how a computer interacts with another
    computer connected on a network. There are generally two types of computer relationship.


    1. **Peer to Peer**

    2. **Client/server**

