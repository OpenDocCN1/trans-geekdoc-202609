- raw: "The following information relates to various backup technologies, their costs,\
    \ and the pros and cons of each one. All the values such as prices of drives,\
    \ media, and costs per megabytes, are based on approximations. Digital Linear\
    \ Tape (DLT) or Linear Tape-Open (LTO) are sturdy backup systems that should be\
    \ considered if your company has adequate resources and ways of using their capacities.\
    \ These systems are rated for re-use a million times, with a shelf life of 30\
    \ years. and have fast drives for backup and restoration. DLT and LTO can also\
    \ have robotic autochangers, which make a lot of headroom if the drives are being\
    \ filled up. These robotic autochangers are comparatively cheap, and various types\
    \ are available, ranging from small systems with a capacity of five tapes to large\
    \ systems holding tens to hundreds of tapes. Super DLT S4 with 600GB per tape\
    \ and LTO-4 with 800GB per tape are new backup technologies more advanced than\
    \ DLT and are suitable for larger networks. A lot of computer equipment vendors\
    \ support the tape formats of DLT and LTO and consider them to be reliable. Choosing\
    \ Backup Strategies The backup rotation strategy is planned after all the important\
    \ information is collected, and this plan contains the details of how the backup\
    \ media is rotated. Thoughtful designing of these backup rotations has these advantages:\
    \ \n\n*   If a disastrous failure occurs, the system can be rebuilt based on the\
    \ most recent data possible. \n\n*   If old tapes have been accidentally erased\
    \ or damaged without being noticed they can have their files restored immediately\
    \ before the data is lost. \n\n*   Provide protection if the backup media fails.\
    \ \n\n*   Protect the data against cases of environmental disasters like a fire.\
    \ \n\nThe files on most network operating systems have special bits assigned to\
    \ them, one of which is called the archive bit, and it specifies the backup status\
    \ of the file. The archive bit is set to ‘on’ whenever a file is edited, indicating\
    \ the need for a backup of this file. Once the backup is done, the archive bit\
    \ clears. With archive bit and backup software, the backups that can be created\
    \ are: \n\n*   A full backup in which all the files and directories are backed\
    \ up with no regard to the statuses of the archive bits. This method clears up\
    \ all the archive bit on every file in the backup. \n\n*   An incremental backup\
    \ selects those files modified and had their archive bit on, and then creates\
    \ backups for these files. The only files backed up are those that have been edited\
    \ since the last incremental or full backup, and their archive bit is reset; those\
    \ who have not been modified will not be included. Though the time consumed in\
    \ incremental backups is minimized in each daily backup, the restoration time\
    \ is increased, and the possibility of media failure becomes high. \n\n*   A differential\
    \ backup works by backing up those files which have their archive bits set to\
    \ on. The change in this backup is that the archive bits of the files are left\
    \ on even after a backup so that in subsequent backups, they will be backed up\
    \ repeatedly along with other new modified files. The time taken in performing\
    \ backups is increased, but the restoration time, and the possibility of media\
    \ failure, is reduced. \n\nIdeally, performing full backups is advantageous as\
    \ you have to access only the most recent backup tapes to restore the system if\
    \ a failure occurs. Looking at it realistically, such a thing is not feasible\
    \ due to several reasons. First, to perform a full backup is time-consuming, and\
    \ there may not be enough time to do a full back up daily. Second, the less work\
    \ is done by the tapes and media, the more shelf life they will have. Besides\
    \ these concerns, consider much restoration time the combination of a full and\
    \ incremental or differential backup will take along with the risk of being unable\
    \ to restore the data due to using a combination approach. Also, consider the\
    \ scenario where you need a full restoration, and you have to use one full backup\
    \ tape and four incremental backups used since then. All the five tapes need to\
    \ be in good condition, which is less likely than encountering a bad tape. It\
    \ is common to mix the backup types by performing one full back up in a week and\
    \ using the incremental or differential backups for the rest of the week. Some\
    \ examples are: \n\n*   Full back up Friday nights and incremental backups from\
    \ Monday to Thursday: Due to system failure on a Monday morning before any data\
    \ entry, only the Friday’s full backup needs to be restored. But if the failure\
    \ happens on Thursday, four tapes need to be restored in sequence for a complete\
    \ backup, starting from Friday’s full backup and continuing from Monday’s incremental\
    \ backups till Wednesday. In the second case, all the data in those tapes must\
    \ be restored successfully and sequentially to ensure data integrity. If it is\
    \ not done, the files might become mismatched and hard to use. Hence four points\
    \ of media failure in the form of tapes increase the risks more than you can handle.\
    \ \n\n*   Full back up Friday night and differential backups from Monday to Thursday:\
    \ if system failure on Monday morning occurs, only previous Friday night’s full\
    \ backup restoration is needed. But if it fails on a Thursday Morning, complete\
    \ restoration of data required only two tapes: the previous Friday’s full back\
    \ up with the differential backup done on Wednesday. This is because, in the differential\
    \ backup, all the modified files since the last backup have been backed up, and\
    \ so, the number of possible media failure points decreases due to only two tapes\
    \ needing to be restored. \n\nA good backup scheme needs a balance between the\
    \ data’s nature and the risks with each backup, the tapes’ capacity, and the time\
    \ consumed in each backup. The ‘Grandfather-father-son’ (GFS) scheme is the most\
    \ common backup rotation scheme. Eight tapes are used in implementing this scheme.\
    \ Four of these tapes are named from “Monday” to “Thursday,” while the other four\
    \ are “Friday 1”, “Friday 2”, “Friday 3,” and “Friday 4”. The first four are used\
    \ from Monday to Thursday to replace the data from the previous week, while the\
    \ next four tapes are designated for each Friday in the month. For the first Friday\
    \ in the month, use the “Friday 1” tape and so on. Prepare a month-end tape on\
    \ the last day of each month, not for being re-used but for keeping it off-site\
    \ so it can be used where a crisis like an environmental failure destroys the\
    \ system and all the on-site tapes. GFS has three main variations: 1.    Perform\
    \ a full back up each time, which increases media redundancy but reduces restoration\
    \ time. 2.    Perform full backups only on Fridays and the end of the month, and\
    \ during the rest of the weeks use incremental backups. 3.    Perform full backups\
    \ on Fridays and month ends, and during the weeks perform differential backups.\
    \ Compared to GFS, rotation schemes are simpler; only two or three tapes can be\
    \ used by rotating them in a sequence and overwriting the old data each time.\
    \ In this way, the three previous days’ data can easily be restored. But it is\
    \ impossible to retrieve data from further back in time if it was erased or damaged\
    \ with no one noticing immediately. A way of solving this shortcoming is by using\
    \ several more tapes that can be rotated weekly or monthly. "
