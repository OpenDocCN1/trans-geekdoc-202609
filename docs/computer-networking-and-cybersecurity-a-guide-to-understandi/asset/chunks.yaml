    # 集线器、交换机和路由器


    集线器、交换机和路由器等硬件组件的目的是纯粹为了便于网络的建立和正常运行。因此，这三类组件属于“纯””网络硬件，并被归类为“网络互连设备”。这些组件本质上是任何基础或复杂网络的基础，因为网络中的整个布线系统都连接到这些设备上。从
    OSI 网络模型来看，这些设备的数据流可以定义在物理层、数据链路层，甚至是网络层。


    ## 集线器 (Hubs)


    集线器也被称为“集中器”。集线器的核心目的是为网络电缆提供一个中央连接点。集线器可以支持多根网络电缆；线数取决于集线器的大小。典型的小型集线器可以连接来自两台电脑的网络电缆，而大型集线器可以支持六十台电脑（取决于规格）。


    最流行的集线器既不是“小型”也不是“大型”，而是“中型”集线器，通常支持最多 24 台客户端计算机。在集线器内部有一根逻辑线，连接的客户端计算机通过这根线与网络通信。这根逻辑线的能力被称为“冲突域”。有时，当太多客户端计算机连接到同一个集线器并尝试与网络通信时，就会产生干扰。


    ## 交换机 (Switches)


    交换机的电路结构（电缆的排列方式）与集线器非常相似。交换机的外观也与集线器相似。尽管集线器和交换机的工作概念基础也非常相似，但相似性仅此于此。


    与集线器不同，交换机上的每个连接端口都有自己的冲突域。通过这样，交换机上的每个网络连接都可以通过独立的冲突域与网络进行自由通信，而不是通过单一冲突域。交换机上的每个网络连接都被设计为私连接。


    如今，大多数计算机网络都采用交换机而不是集线器，主要是因为这是一种更廉价的解决方案。然而，交换机相比集线器还有许多优势（我们把这个讨论留到以后，因为现在的重点是学习它们是如何工作的）。良好的网络解决方案将使用一个或多个骨干交换机，它们连接到主交换机上。这些骨干交换机的运行速度通常远高于主交换机。然而，即使在网络解决方案中使用集线器，仍然会使用骨干交换机（这仅仅是一个连接到集线器的独立交换机）。


    下图显示了网络中交换机和集线器的典型布局。![](img/Image00003.jpg)


    ## 路由器 (Routers)


    最后但同样重要的是路由器。到目前为止，我们已经对路由器的工作和功能细节给予足够的关注。我们现在知道，路由器在计算机网络中的主要工作是将数据包有效从从一个网络路由到另一个网络。路由器也可以作为一个桥接器，为两个连接网络之间的数据包提供流传输路径。这两个网络通过各自的布线和连接方式建立与路由器的连接。


    让我们通过一个例子来更好地理解这一点。考虑网络中的一个路由器，它在 `10Base-T` 网络和 `ISDN` 电话线之间建立了连接。在这种场景下，路由器正在处理两个网络连接：一个连接自/通往
    `10Base-T` 网络，另一个连接自/通往 `ISDN` 电话线。路由器的工作将为数据包在这两个网络连接之间的传输创建一个适当的路径。除了这些定义的网络连接外，路由器还会有另一个终端连接。该辅助连接的目的是编程和维护路由器本身。


    # 布线与电缆房 (Cabling and Cable Plants)


    在建立计算机网络时，你会发现有许多种网络电缆可用。但在这一层面上，我们应该只关注常用的主网络电缆。


    在建立局域网（LAN）连接时常用的网络电缆是 `Category 5`（五类）双绞线。这些电缆也被称为 `Cat-5` 电缆。电缆有四对绞线；这意味着它有八个导线接触点。由于这种设计，电缆可以将网络信号传输到这八个线点中的每一个。`Category
    5` 双绞网络电缆主要用于 `Base-T` 网络，如 `100Base-T` 网络和 `1000Base-T` 以太网网络。


    这种网络电缆还有一种低等级版本，被称为“三类双绞线”。该网络电缆的整体设计和结构与高档的 `Cat-5` 电缆相似；主要区别在于它支持的对数。`Category
    5` 双绞网络电缆主要用于 `Base-T` 网络，如 `100Base-T` 网络和 `1000Base-T` 以太网网络。这种网络电缆还有一种低等级版本，被称为“三类双绞线”。该网络电缆的整体设计和结构与高档的
    `Cat-5` 电缆相似；主要区别在于它支持的对数。


    `Category 5` 双绞网络电缆主要用于 `Base-T` 网络，如 `100Base-T` 网络和 `1000Base-T` 以太网网络。这种网络电缆还有一种低等级版本，被称为“三类双绞线”。该网络电缆的整体设计和结构与高档的
    `Cat-5` 电缆相似；主要区别在于它支持的对数。


    `Category 5` 双绞网络电缆主要用于 `Base-T` 网络，如 `100Base-T` 网络和 `1000Base-T` 以太网网络。这种网络电缆还有一种低等级版本，被称为“三类双绞线”。该网络电缆的整体设计和结构与高档的
    `Cat-5` 电缆相似；主要区别在于它支持的对数。


    `Category 5` 双绞网络电缆主要用于 `Base-T` 网络，如 `100Base-T` 网络和 `1000Base-T` 以太网网络。这种网络电缆还有一种低等级版本，被称为“三类双绞线”。该网络电缆的整体设计和结构与高档的
    `Cat-5` 电缆相似；主要区别在于它支持的对数。


