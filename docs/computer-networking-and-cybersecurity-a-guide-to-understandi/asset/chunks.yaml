    # Chapter One: Cybersecurity and Why It’s Important


    ## What is Cybersecurity?

    Cybersecurity, also known as information security, is defined as the process of
    ensuring `ICA` of information, where `I` stands for `Integrity`, `C` stands for
    `Confidentiality`, and `A` stands for `Availability`. Cybersecurity comprises
    a set of relevant tools, approaches toward risk management, training, technologies,
    and methods to protect the information, networks, programs, and devices against
    attacks and unauthorized access. The following entities are part of the cybersecurity
    process.


    ### People

    People are part of a system. It could be a university or an organization or another
    institution. During their tenure with an institution, people should understand
    and comply with the basic principles of data security, such as using strong passwords,
    being alert about email attachments, and doing data backups.


    ### Processes

    Organizations need to have certain frameworks in place to tackle cyberattacks,
    both attempted and successful ones. If an organization has even one well-respected
    framework, it can guide them in times of a cyberattack. A framework will help
    them identify the attacker, protect all systems, be response-ready for threats,
    and quickly recover in case of successful attacks.


    ### Technology

    Without technology, organizations would not have the necessary tools for computer
    security to protect themselves against cyberattacks. There are three main entities
    to protect: personal end-point devices—such as smart devices, computers, and routers—the
    network, and the cloud. The common technologies used to protect these entities
    include firewalls, `DNS filters`, `anti-malware solutions`, `antivirus solutions`,
    and `email security solutions`.


    ## Why is Cybersecurity Important?

    Today, the world depends on technology more than it ever did in past decades.
    This has resulted in a huge surge in the creation of digital data. Data is stored
    on computers by individuals, businesses, government agencies, etc., and daily
    transferred to other computers over a network. There are loopholes and vulnerabilities
    in computers and their underlying systems. These can be exploited by an attacker,
    which leads to the downfall of an organization. This is why cybersecurity is vital.


    A breach in the system that allows an attacker access can have far-reaching consequences.
    The leak of customer data can affect the organization’s reputation and lead to
    a loss of trust with partners and customers. Theft of software source code can
    cost the organization a competitive advantage over its rivals. Additionally, a
    data breach can cause revenue losses due to data protection practices being non-compliant.
    On average, a data breach can cost an organization up to USD 3.6 million. Moreover,
    high-profile data breaches make it into the news headlines like wildfire resulting
    in a hit on a company’s reputation. This is why organizations need to implement
    a strong and powerful approach to cybersecurity.


    ## Cybersecurity Scenarios

    This section discusses the need for information security. You will go through
    a few common scenarios in which cybersecurity is used in the world today.


    ### Scenario for Organizations

    Try to picture an organization with all the latest IT equipment to cater to all
    their digital needs for their business to function smoothly. It is critical for
    this IT infrastructure to be up and running around the clock. The organization
    also needs to ensure that the identity of the data, network, equipment, and products
    are secured, except for public-access network and data identities. However, the
    public data itself must still be encrypted and secured.


    All organizations have gone digital, and therefore there is a mix of various technologies
    working together to drive the goals and objectives of an organization. Digitization
    also extends the boundaries of an organization, thereby increasing their connectivity.
    The connectivity is, of course, an advantage today but can be harmful to the organization.


    Three macro aspects define digitization and connectivity:

    * **Identity** – This is an aspect through which users can interact.

    * **Data** – This is data related to the user, business, system, or customer.

    * **Network** – This is the part where everyone is connected and restricted via
    access levels.


    These three macro entities are connected via equipment, software, and business
    processes. As already mentioned, an organization controls the level of access
    a user may have to create, view, or modify data via access developed for an identity.
    Additionally, data—whether it is in rest or motion—also needs to be secured. And
    finally, it goes without saying that the network perimeter for this infrastructure,
    whether it is in a physical form or on the cloud, requires security.


    ### The Scenario Where Everything is Moving to the Cloud

    #### What is the cloud?

    A cloud is a common space on the Internet where all your data can be stored instead
    of storing it locally. Most organizations are rapidly moving all their data to
    the cloud. This happens because cloud-based servers offer better computing power,
    and the cost of storing data on the cloud is less than storing it locally.


    Another benefit of cloud-based infrastructure is that it is scalable. This means
    that its parameters such as `RAM`, computing power, and disk space can be expanded
    on the go. With the Internet, the world is getting smaller, and organizations
    have started collaborating on a global scale, and cloud computing is to be credited
    for this.


    Gone are the days when employees would sit in an office and work. Today, employees
    prefer working out of remote locations, thereby eliminating the need for a physical
    office. Cloud infrastructure also takes away the burden on local IT teams to constantly
    keep a watch for software and hardware upgrades. Cloud infrastructure has definitely
    brought in a new era of more speed, control, accuracy, power, and availability,
    but many security risks also accompany it. Cloud infrastructure is no different
    vis-à-vis security, and disasters can happen if that infrastructure is not secured
    properly.


    The biggest advantage of cloud infrastructure is that an organization does not
    have to own or maintain infrastructure. However, the boon is accompanied by concerns
    such as how do you secure it? Who has access to the data present in the cloud?
    How do you keep the cloud compliant with government regulations such as `PCI`
    or `GDPR`? The service provider’s business model also governs the disaster recovery
    policy around cloud infrastructure, and therefore an organization needs to be
    up to date on this. The organization does not have any say in where the service
    provider’s data center is located. There are several other risks and challenges
    to using cloud infrastructure, which will be discussed in the next few chapters.


    ## Cybersecurity Terminology

    Several terms used throughout this book relate to the cybersecurity. It is important
    to cover these terms in the first chapter so that you are familiar with them when
    they start making subsequent appearances. These terms are related to all the devices
    you use today, the software, and the network infrastructure.


    * **Cloud**: The Internet is made up of clouds—and not the ones in the sky.

    * **Cloud computing**: A technology that allows a user to access their files from
    anywhere.

    * **Cloud network**: A network of computers that store data that can be accessed
    remotely from the world.

    * **Exploit**: A malicious piece of code that can be used to take advantage of
    a vulnerability or loophole in a computer or server.

    * **Software**: Instructions that tell a computer what to do.

    * **Domain**: A parent for devices that are interconnected, such as computers,
    smartphones.

    * **IP Address**: A digital address assigned to a device connected to a network.

    * **Virtual Private Network (VPN)**: A network over which you can be anonymous,
    keeping your original IP hidden.

    * **Malware**: A broad term or umbrella that includes any malicious software that
    can harm a computer.

    * **Virus**: Malware that can harm certain programs on a computer and can further
    replicate itself and spread over multiple files and computer networks.

    * **Ransomware**: A type of malware that will encrypt all the data on your computer
    and prevent you from accessing it.

    * **Trojan Horse**: Like a virus, but does not execute by itself; it is usually
    masked and lies under a file.

    * **Worm**: A piece of malicious code that is capable of replicating itself over
    a network, consuming network bandwidth.

    * **Bot or Botnet**: A `Bot` is a malicious application that can be planted over
    a network of computers, allowing an attacker to remotely take control of the complete
    network. The collection of computers on which the bots are planted is called a
    `botnet`, controlled by a `bot herder`.

    * **DDoS**: Stands for `Distributed Denial of Service`, a form of cyberattack
    intended to flood a network with malicious traffic.

    * **Phishing and Spear Phishing**: A technique used by attackers to retrieve information,
    often via emails that seem legit but contain malicious links.

    * **Encryption**: The process of encoding data using a known algorithm so that
    no one can access it, except someone with a decoding key.

    * **Bring Your Own Device (BYOD)**: A policy suggesting that employees can use
    their personal devices for business.

    * **Penetration Testing**: A process used to identify vulnerabilities in a system.

    * **Clickjacking**: An attack that tricks users into clicking a link or button
    via malicious scripts.

    * **Firewall**: The technology used to create rules for a system so incoming and
    outgoing traffic can be filtered.

    * **Breach**: The moment when an attacker takes advantage of a system’s vulnerability
    and gains access.

