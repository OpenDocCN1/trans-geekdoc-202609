    E-mails are the most dangerous form of communication because they might be infected
    by viruses and Trojan horse programs. If the e-mail traffic is not monitored carefully,
    these might infiltrate the company network. This threat is prevented by using
    a virus-scanning software on the e-mail server and updating the virus signatures
    regularly.


    ## DDoS Threats

    Another type of threat to the system network is the `DDoS` (Distributed Denial
    of Service) threat by which legitimate users of the network cannot obtain the
    network resources because they are denied access. It works in two ways, one of
    which is by flooding the network with useless traffic so the server (such as an
    e-mail server) denies services to the legitimate users or simply crashes under
    the heavy traffic load. The other way requires taking advantage of the existing
    bugs in the software of the network to crash the server. Prevention of DDoS threats
    include:


    *   Checking and confirming if the network’s software is updated and current.

    *   Firewall settings that allow the user to disable the Internet Control Message
    Protocol (`ICMP`) traffic service so traffic such as `ping` requests will not
    be allowed into the network.

    *   Not letting the people outside the LAN access those network resources and
    servers which they should not access. For example, the accounting system of a
    company is made inaccessible to those outside the LAN because they do not need
    it. So, the firewall or packet-filtering router is configured so the traffic coming
    from and going outside the server’s IP address is denied.


    ## Potential Attacks and Threats

    A wide variety of malicious software exists in the computer world, and the list
    continues to grow. Some are listed below.


    *   **Viruses**: A computer virus is a code or program capable of copying itself
    and spreading by infecting numerous files such as `COM`, `EXE`, AND `DLL` program
    and application files. The document files for applications like `Microsoft Word`
    and `Excel` prone to virus attacks support macro languages, which are sophisticated
    enough to allow it. The data files, such as `JPEG` image files, are also at risk
    of being attacked by these viruses.

    *   **Worms**: The worm program functions by sending a copy of itself to other
    computers, which spread it to different computers after running it. The e-mail
    systems have lately been a victim of worms attached to e-mails in an enticing
    message. If the e-mail user opens the attachment, copies of the worm are spread
    to other people present in the user’s e-mail address book. This action is carried
    out without the knowledge of the user, and the receivers of the worm face the
    same situation. In this way, worms spread like wildfire across the Internet through
    the e-mail server in just a few hours.

    *   **Trojan horses**: Trojan horse is a deceptive program that pretends to do
    something meaningful or of interest to the user but carries out malicious activities
    in the background during the period the user is busy interacting with the main
    program.

    *   **Logic bombs**: Logic bombs are malicious programming code pieces added into
    the normal program by the original author or by a person involved in developing
    the source code. They are set to become active after a certain amount of time,
    after which they delete key files and perform other malicious actions.


    With each passing day, the already enormous number of viruses increases even more
    as new viruses are written and discovered. An important requirement of network
    administration is to establish practices to deal with these viruses. Antivirus
    software runs on a network computer and monitors the software activities to search
    for potential virus threats. If a virus entity is discovered by the antivirus
    software, it protects the network by removing the virus from the original file
    while keeping it intact, and quarantines or locks it until an administrator checks
    it. Antivirus is developed so it can run on most network computers, including
    desktop computers, file servers, e-mail servers, print servers, and computerized
    firewalls. Three most notable vendors among many that provide the services of
    antivirus are `Symantec` (`Norton Antivirus`), `Trend Micro` (`PC-cillin`), and
    `Network Associates` (`McAfee VirusScan`). The most suitable option is to assure
    that the Antivirus is running on all the servers and customize the settings so
    its software is updated automatically. As e-mail servers are more at risk of virus
    attacks, it is highly recommended to make sure that Antivirus software is running
    on them. The newly created viruses associated with e-mails can spread throughout
    the world in a matter of hours, so if you set the update of virus signatures to
    be on an hourly basis, you will likely get a necessary virus update before it
    attacks your network. Running the Antivirus is also recommended on the workstations
    but depending only on this software to prevent virus attacks is not the right
    move. It should not be considered a primary way of dealing with viruses, but as
    a supplement to the server-based software.


    ## Basics to Hacking and Network Design

    In this section, we will be discussing network designing and the basics of hacking.
    Network designing is a very important job best handled by network professionals.
    Designing a network from the ground up is time-consuming, stressful, and a very
    sensitive job. However, in return for carrying such a burden and responsibility,
    the resulting network built for the company is specifically tailored to their
    needs. This allows the company to work and function efficiently while using a
    network. Although network designing might seem intimidating at first, the process
    and philosophy behind it are actually simple and straight-forward once you get
    the hang of it. Last but not least, we will lay the foundation for simple hacking
    by using the `Linux` operating system and briefly talk about the kill chain process
    of hacking that includes reconnaissance, exploitation, and such. However, clarify
    that covering even the basics of hacking is outside the scope of this book. Instead,
    we will focus on the major aspects.


    ## The Process of Designing a Network

    Network design does not follow a scientific procedure, nor is it an exact science.
    That’s own getting everything correct on the first attempt to design a network
    is virtually impossible, as every network has its own specific needs and demands
    that need to be met. Prominence and excellence in this task come from experience
    and practice. However, the trick to designing a good network is to estimate the
    needs of the network and then try to meet these needs to the best of your ability
    in the network design. The network design process is not universal. It varies
    from person to person. Some processes are simple and easy, and some processes
    are horrendously complicated. In this chapter, we will learn about a network designing
    process moderately comprehensive yet very simple. There are only two steps to
    this process:


    1.  Assessing the network needs

    2.  Meeting the network needs


    ## Assessing Network Needs

    Assessing the demands of the network is what will set up for good network design.
    Before we can even consider the specifics of the network design, such as the network
    cables, the topology, the operating system, etc., we must first understand the
    goal the network is supposed to accomplish. In the network design process, assessing
    the needs of the network should be given equal or more emphasis as the other steps.
    Here are four questions that can give more than enough information needed in this
    step of the process:


    *   How much storage space do we need?

    *   How much bandwidth capacity do we need?

    *   What are the network services required in this setup?

    *   What’s the maximum budget for the network installation?

