- raw: "These eight steps are the very core and fundamental stages of a penetration\
    \ attack by a hacker. No matter what type of attack you want to launch on a network,\
    \ whether it be an internal attack or an external attack, you must follow through\
    \ these eight phases to succeed in hacking. Phase 1: Reconnaissance The first\
    \ phase of the kill chain process is to gather information about the target. In\
    \ this stage, the hacker’s job is to simply observe the target and research information\
    \ about the target through online resources. The attacker can look around the\
    \ social media pages of the company it wants to target or go around gathering\
    \ information about the company’s employees from their social networking accounts.\
    \ In modern days, researching a target is relatively easy, with so many resources\
    \ at the hacker’s disposal. An attacker determines the internal situation of the\
    \ company itself by keenly observing it from an outsider’s perspective. This reveals\
    \ the potential weak links within the company’s network that the attacker should\
    \ target. During reconnaissance, hackers usually take either of two approaches:\
    \ \n\n*   Passive Reconnaissance \n\n*   Active Reconnaissance \n\nIn passive\
    \ reconnaissance, the attacker does not directly risk exposing his attempts to\
    \ the target. Instead, he aims to gather as much information about the target\
    \ as is available to the public and then to create links to other potential targets.\
    \ For example, garnering an employee’s name from the company’s website, then looking\
    \ up his social media accounts from his name, then figuring out his username,\
    \ and the chain of investigation continues. The information gathered is publicly\
    \ available, and this raises no alarms. But in Active Reconnaissance, the attacker\
    \ takes a more aggressive approach towards gathering information about the target.\
    \ When following this approach, the attacker usually engages with the target system\
    \ directly to figure out the potential vulnerabilities. However, doing so carries\
    \ a certain amount of risk because the attacker’s information-gathering attempts\
    \ can be discovered by the target, and the attacker can then be exposed. Once\
    \ the attacker has gathered information such as the names, titles, e-mail addresses\
    \ of the target, the reconnaissance phase is complete, and he can now explore\
    \ the different avenues through which he can proceed with the penetration attack.\
    \ Phase 2: Intrusion Once the attacker has gathered the information, he can devise\
    \ a way that will give him access to the target’s system. The focus of the attacker\
    \ in this phase is to somehow get into the target’s system by taking advantage\
    \ of malware or security vulnerabilities. Once the hacker is inside the target’s\
    \ system, he can set up for the later stages of the kill chain process. After\
    \ this, the information gathered from the reconnaissance phase will help the hacker\
    \ to devise a believable and feasible attack, such as a spear-phishing attack.\
    \ By sending a carefully constructed e-mail with a compelling context, an attacker\
    \ can easily trick the target into clicking on a malicious link. This will give\
    \ the attacker access into the target system and even more control of the system,\
    \ i.e., by injecting spyware to gather passwords and other such information from\
    \ the background without the target realizing. This phase of the kill-chain process\
    \ is basically the entry-point of a penetration attack. Phase 3: Exploitation\
    \ In this phase of the penetration attack, the attacker infects the system with\
    \ his own malicious code. This exploitation of the target system will essentially\
    \ provide the hacker with better control over the target system. Exploitation\
    \ needs to be done carefully. First, the target should not know the fact somebody\
    \ has sneaked into his system. The exploitation phase mainly focuses on giving\
    \ the attacker more resources to work with on the target system by exploiting\
    \ the vulnerabilities discovered in the reconnaissance phase. An attacker can\
    \ also install tools, create scripts, or even perform modifications to the security\
    \ certificates of the target’s system. Phase 4: Privilege Escalation Sometimes,\
    \ the target the attacker exploits has lower user privileges by default, or the\
    \ attacker is only given lower privileges by the operating system after penetration.\
    \ In such cases, it is of paramount importance for the attacker to elevate his\
    \ access privileges in the target system. Otherwise, he will be locked out of\
    \ most of the system’s resources even after successfully penetrating it. In an\
    \ analogy, privilege can be described in the following way. The attacker has successfully\
    \ penetrated a building undetected and is now in the lobby; however, unless he\
    \ escalates his privileges, he will stay stuck in the lobby, and that’s practically\
    \ useless for his objectives. Some of the most common approaches for escalating\
    \ privileges are: \n\n*   Brute force attacks - this approach targets the password\
    \ vulnerabilities to give the user administrator credentials, which can then access\
    \ the system as an administrator rather than a standard user. \n\n*   Exploiting\
    \ zero-day vulnerabilities - zero-day vulnerabilities are those weaknesses in\
    \ the security of a system or framework present from day one of its development.\
    \ The special thing about such a vulnerability is that neither the user nor the\
    \ developer knows this potential flaw making the exploit attack virtually unstoppable.\
    \ \n\nPhase 5: Lateral Movement Now that the attacker has complete control of\
    \ the system’s resources, time to find the jackpot he came looking for. In this\
    \ phase, the attacker will move from one system to the next in search of more\
    \ data and assets. This phase is a sort of data discovery mission for the attacker.\
    \ The goal is to find sensitive and critical data. Phase 6: Obfuscation In this\
    \ phase of the process, the attackers conceal their presence and cover their tracks.\
    \ This will prevent immediate discovery of the attack and also make the future\
    \ investigation of this attack more difficult. In this phase, the hackers usually\
    \ delete metadata files, overwrite the timestamps, and make other such modifications.\
    \ Phase 7: Denial of Service In this phase, the hackers target the network and\
    \ its corresponding infrastructure by temporarily dismantling it. In this way,\
    \ normal users won’t be able to access the network and won’t know what’s going\
    \ in their systems and network. This is also commonly known as a DDoS attack.\
    \ Phase 8: Exfiltration This phase of the kill-chain process is the escape route\
    \ of the hacker after he has gathered the data and information he came for. The\
    \ main focus here is to somehow move the data from the target system to a system\
    \ specified by the hacker, either by copying, moving, or transferring the data\
    \ over the network. This process can take time, but once the data is out, the\
    \ hacker can do anything he wants with it. "
  fmt: '

    These eight steps are the very core and fundamental stages of a penetration attack
    by a hacker. No matter what type of attack you want to launch on a network, whether
    it be an internal attack or an external attack, you must follow through these
    eight phases to succeed in hacking.


    ## Phase 1: Reconnaissance

    The first phase of the kill chain process is to gather information about the target.
    In this stage, the hacker’s job is to simply observe the target and research information
    about the target through online resources. The attacker can look around the social
    media pages of the company it wants to target or go around gathering information
    about the company’s employees from their social networking accounts. In modern
    days, researching a target is relatively easy, with so many resources at the hacker’s
    disposal. An attacker determines the internal situation of the company itself
    by keenly observing it from an outsider’s perspective. This reveals the potential
    weak links within the company’s network that the attacker should target. During
    reconnaissance, hackers usually take either of two approaches:


    * Passive Reconnaissance

    * Active Reconnaissance


    In passive reconnaissance, the attacker does not directly risk exposing his attempts
    to the target. Instead, he aims to gather as much information about the target
    as is available to the public and then to create links to other potential targets.
    For example, garnering an employee’s name from the company’s website, then looking
    up his social media accounts from his name, then figuring out his username, and
    the chain of investigation continues. The information gathered is publicly available,
    and this raises no alarms. But in Active Reconnaissance, the attacker takes a
    more aggressive approach towards gathering information about the target. When
    following this approach, the attacker usually engages with the target system directly
    to figure out the potential vulnerabilities. However, doing so carries a certain
    amount of risk because the attacker’s information-gathering attempts can be discovered
    by the target, and the attacker can then be exposed. Once the attacker has gathered
    information such as the names, titles, e-mail addresses of the target, the reconnaissance
    phase is complete, and he can now explore the different avenues through which
    he can proceed with the penetration attack.


    ## Phase 2: Intrusion

    Once the attacker has gathered the information, he can devise a way that will
    give him access to the target’s system. The focus of the attacker in this phase
    is to somehow get into the target’s system by taking advantage of malware or security
    vulnerabilities. Once the hacker is inside the target’s system, he can set up
    for the later stages of the kill chain process. After this, the information gathered
    from the reconnaissance phase will help the hacker to devise a believable and
    feasible attack, such as a spear-phishing attack. By sending a carefully constructed
    e-mail with a compelling context, an attacker can easily trick the target into
    clicking on a malicious link. This will give the attacker access into the target
    system and even more control of the system, i.e., by injecting spyware to gather
    passwords and other such information from the background without the target realizing.
    This phase of the kill-chain process is basically the entry-point of a penetration
    attack.


    ## Phase 3: Exploitation

    In this phase of the penetration attack, the attacker infects the system with
    his own malicious code. This exploitation of the target system will essentially
    provide the hacker with better control over the target system. Exploitation needs
    to be done carefully. First, the target should not know the fact somebody has
    sneaked into his system. The exploitation phase mainly focuses on giving the attacker
    more resources to work with on the target system by exploiting the vulnerabilities
    discovered in the reconnaissance phase. An attacker can also install tools, create
    scripts, or even perform modifications to the security certificates of the target.


    ## Phase 4: Privilege Escalation

    Sometimes, the target the attacker has lower privileges by default, or the attacker
    is given lower privileges after penetration. In such cases, it is of paramount
    importance for the attacker to elevate his privileges. Otherwise, he will be stuck.
    Some of the most common approaches for escalating privileges are:


    * Brute force attacks: this approach targets the password vulnerabilities to give
    the user administrator credentials, which can then access the system as an administrator
    rather than a standard user.

    * Exploiting zero-day vulnerabilities: zero-day vulnerabilities are those weaknesses
    in the security of a system or framework present from day one of its development.
    The special thing about such a vulnerability is that neither the user nor the
    developer knows this flaw making the exploit attack unstoppable.


    ## Phase 5: Lateral Movement

    Now that the attacker has complete control of the system’s resources, time to
    find the jackpot he came for. In this phase, the attacker will move from one system
    to the next in search of more data and assets. This phase is a sort of data discovery
    mission for the attacker. The goal is to find sensitive and critical data.


    ## Phase 6: Obfuscation

    In this phase of the process, the attackers conceal their presence and cover their
    tracks. This will prevent immediate discovery of the attack and also make the
    future investigation of this attack more difficult. In this phase, the hackers
    usually delete metadata files, overwrite the timestamps, and make other such modifications.


    ## Phase 7: Denial of Service

    In this phase, the hackers target the network and its corresponding infrastructure
    by temporarily dismantling it. In this way, normal users won’t be able to access
    the network and won’t know what’s going in their systems and network. This is
    also commonly known as a DDoS attack.


    ## Phase 8: Exfiltration

    This phase of the kill-chain process is the escape route of the hacker after he
    has gathered the data and information he came for. The main focus here is to somehow
    move the data from the target system to a system specified by the hacker, either
    by copying, moving, or transferring the data over the network. This process can
    take time, but once the data is out, the hacker can do anything he wants with
    it.

