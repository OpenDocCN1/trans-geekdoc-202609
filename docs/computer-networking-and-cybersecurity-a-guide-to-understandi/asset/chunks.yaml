    ## Password Security Policies


    *   Make a requirement that the passwords should be at least eight characters
    long. If the password being set is case-insensitive and does not allow special
    characters to be used, the possible variations of such a password are almost 368
    (three trillion). For case-sensitive passwords, the possibilities increase up
    to 628 (218 trillion). If special characters such as space, comma, asterisk, period,
    etc. may be used in passwords, the possible variations increase even further.


    *   The users should be encouraged to use passwords that do not make up a word
    in any language or insert numbers and other nonalphumeric characters between the
    letters of the word. In this way, a dictionary attack initiated by password-cracking
    programs will fail. Mixed-case characters should be used wherever the network
    supports mixed-case passwords.


    *   Policies that observe and detect numerous incorrect password attempts should
    be turned on. This policy is often termed `Intruder detection`. It monitors whether
    too many incorrect attempts at entering the password have occurred in a set amount
    of time and prevents further attempts by locking out the account. The locked account
    can only be reopened by talking to the administrator with the authority to reset
    the account. This case usually occurs when people forget their passwords, but
    this policy keeps in check any malicious intent to guess the password and gain
    access to the account.


    *   Novell NetWare and Windows servers can set limits on the amount of time a
    user can be logged in to the network, and restrict certain users to particular
    network computers. To impose these limits on every user would be too excessive;
    nonetheless, it is essential to restrict the administrative account to the fewest
    possible number of different workstations so a person operating at a different
    workstation cannot access the account even if they know the password.


    According to the Catch-22 of network security policies, making the policies too
    strict can actually reduce network security. For instance, if the password security
    policies require the user to use a 12-character password, change it once a week,
    and prohibit the reuse of passwords, most users cannot remember the changing passwords.
    They will write it down somewhere in the office, with the risk of it being discovered.
    To strengthen the security of the network, a balance must be maintained between
    security and usability.


    ## File and Directory Permissions


    Internal security also involves the maintenance and control of users’ access to
    files and directories. The settings related to this security are more difficult
    than managing the user accounts because every network user has at minimum 20 directories
    and hundreds of files, and managing this amount is a tough job. To make this task
    easier, the key is to follow regular procedures and periodically spot-audit particular
    parts of the directory tree that contain sensitive information. By effectively
    structuring the overall network directories, the top levels can simply be assigned
    permissions, which will “flow down” automatically to subdirectories and make identification
    of the users who have access to specific directories easier. The settings related
    to assigning permissions on files and directories is considerably flexible in
    network operating systems. Various kinds of roles can be enabled for different
    users through built-in permissions. The roles mentioned below describe the authoritative
    ability of what the user can do in the directory:


    *   Create Only: This role gives the user the ability to create and add new files
    to the directory and prevents the user from accessing, altering, or deleting previously
    existing files, including those which they created. Helped by this role, the users
    gain permission to include new information in a directory to which they shouldn’t
    have access otherwise. This role makes the directory function like a mailbox where
    one can only put new things in it, and only one other person will have full access
    to the content inside.


    *   Read Only: This feature allows users to see the files at a glance in the directory,
    and they can view these files on their computer. The read-only role only allows
    these users to view and read the information in the files, making no kind of changes.
    Such files can be copied via the read privilege by the users into another location
    or directory, which allows them to make desirable changes.


    *   Change: This feature gives the user a free hand with the files in the directory.


    *   Full control: This role is limited to the owner of the directory who can make
    any alteration and also grant access to other user.


    On different network operating systems, these features are designed in different
    ways. Security for specific files can also be set in a way similar to setting
    permission for directories. Directory permissions are usually overridden by file
    permissions. This concept can be understood by considering a user has access to
    change the files. Still, once the permission is set to read-only for the files,
    the user can now only access.


    ## Practices and User Education


    The people using the network are part of the reason for insecurity and internal
    threats. To make sure that the network remains secure and protected despite the
    threats, it is essential to develop effective security practices and habits. Besides
    developing and implementing a good security practice or scheme, it is also imperative
    to manage it regularly by archiving the procedures related to security and establishing
    a process to ensure they are followed. A simple and comprehensible procedure easily
    followed is much better than the poorly followed complex yet excellent procedure.
    Therefore, the overall design of network security must be made simple while keeping
    it consistent with the company’s needs. Make it possible for all the users to
    follow prudent procedures. These procedures can be enforced by customizing the
    settings available on the network operating system, but formal education of the
    employees regarding the importance of internal security is also needed.


    *   Inform the users of the basic conditions they need to follow related to network
    security and provide them with a document containing the details of network security
    and the users’ role in preserving it. The guidelines in the document for the user
    could be to choose a secure password and not disclose it, to take care not to
    leave their network-connected computers unattended for a long time, and to not
    install software from anywhere else than the company.


    *   Discuss the network security issues with the newly appointed employees that
    will be using the network.


    *   Examine the company culture, and depending on that, consider making the users
    sign a form that acknowledges their comprehension of the security procedures they
    must follow.


    *   Auditing users’ actions related to security should be done at certain intervals,
    and if some have full-control access to the directory, then keep a check on how
    they assign permissions to other users.


    *   Review the security logs on the network operating system occasionally, and
    if a problem occurs, investigate it properly.

