    It is supported on all operating systems and was originally developed for mass
    scanning of networks, but it works well on single hosts too.


    `Wireshark` is again a free tool used to analyze networks. It gives you a microscopic
    view of the network’s activities and is therefore used extensively by businesses,
    governments, and educational institutions. `Acunetix` is a penetration testing
    tool used by software engineers and security professionals since it has numerous
    features. It is user-friendly, robust, and straightforward. In addition to using
    internal tools, a business may also directly outsource its penetration testing
    to leading security companies, some of which are mentioned below.


    ### ScienceSoft

    `ScienceSoft` is a recognized company in the information technology domain for
    its software services. However, it also takes an interest in providing cybersecurity
    solutions to companies. The company has been on the market for seventeen years
    and is experienced in all penetration testing methods, namely, white box, black
    box, and grey box. This company can test small, medium, and large businesses.
    You can contact the cybersecurity team of `ScienceSoft` to get any assistance
    in setting up a penetration test for your business.


    ### ImmuniWeb

    Based out of Geneva, Switzerland, `ImmuniWeb` is another well-known penetration
    testing company. Their penetration testing platform boasts of a DevSecOps feature,
    which combines people and artificial intelligence to test the system. It also
    commits to a zero false-positive SLA. Additionally, they also claim they have
    detected the highest number of vulnerabilities detected and effective reporting.
    They have a comprehensive set of tools for penetration testing and also include
    `APIs`, `IoT` devices, mobile, and web testing, etc. They have the following key
    features:

    * Detection of new code in a continuous fashion.

    * Manual testing at affordable pricing.

    * Patching with single clicks.

    * 24/7 support.

    * CI/CD integrations for DevSecOps.

    * Instant integration.

    * Multi-resource dashboard.


    ## Why Penetration Testing?

    You may be wondering why this chapter is focusing more on penetration testing.
    The `WannaCry` ransomware that hit the world in 2017 has already been discussed.
    It was responsible for locking out more than two lakh users out of their computers
    and demanded money to unlock the systems. It affected many businesses around the
    world. Penetration testing could have helped these businesses prevent this magnitude
    of an attack since these tests, when conducted regularly, report the loopholes
    in security.


    Penetration testing majorly helps with the following scenarios:

    * Securing user data.

    * Identifying vulnerabilities in an application.

    * Determining the impact on business in case of a successful attack.

    * Helping a business meet compliance concerning security.

    * Many IT clients have started asking for penetration tests to be included in
    the software release life cycle.

    * Much financial data is transferred between systems today, and it needs to be
    secured.


    User data is the biggest currency in the world, and loss of such data can cause
    monetary and reputation damage to an organization. For instance, picture someone
    hacking a social media website like `Facebook`, hacking its user database, and
    exposing those details publicly on the Internet. `Facebook` can face legal consequences
    if that ever happened. Therefore, many businesses now enroll for compliance certifications
    before making financial transactions through their websites. Some of these compliance
    certifications include:

    * `PCI DSS` (Payment Card Industry Data Security Standard)

    * `ISO/IEC 27002`, `OSSTMM` (The Open Source Security Testing Methodology Manual)

    * `OWASP` (Open Web Application Security Project)


    ## Types of Penetration Testing


    ### Social Engineering Test

    Social Engineering has already been detailed in Chapter Six, so you already know
    that social engineering attacks are executed to trick people into disclosing sensitive
    information about themselves or their organization. Thus, humans can be the weakest
    link in a security system. Social engineering tests are conducted by emulating
    a social engineering attack. An employee is called via phone or contacted via
    a medium like text or email, and a scenario is put forward to try and test if
    the employee ends up disclosing any information. If the test is positive, it will
    be documented, and steps will be taken to educate employees about it.


    ### Web Application Test

    As discussed, various software tools are used to test how secure the code of a
    web application is. They test the code for any vulnerability and find a way to
    patch them to prevent any attacks. The team performing this test writes a report
    that discloses the flaws, and the development team can fix them as soon as possible.


    ### Physical Penetration Test

    Many organizations have physical devices on their property and must ensure that
    only authorized personnel can access the stored devices. This is more so in government
    and military facilities. All network-related devices and physical entry points
    are tested for any vulnerabilities. This test is not very relevant to software
    testing as such.


    ### Network Firmware Testing

    Networks are the most important part of an organization’s digital infrastructure.
    Therefore, tests are conducted on all the entry points of a network, and these
    tests check the traffic going in and out of the point. This test can be conducted
    both locally and remotely.


    ### Client-Side Testing

    During these tests, the organization tests the software on the client’s infrastructure
    to identify any vulnerability in the system.


    ### Wireless Network Testing

    As the name suggests, this test will scan all the `Wi-Fi` hotspots in an organization
    for vulnerabilities.


    ## The Penetration Testing Lifecycle

    The organization follows a disciplined process when it conducts a penetration
    test. Here is the process:


    ### Data Collection

    The first stage of a penetration testing life cycle is the collection of data.
    Penetration testers use numerous methods to collect information on the target
    system. The methods may use either a simple or complex tool or application to
    collect the data. Pen testers may also inspect the source code of the website
    to gather data about the target system. Simply put, any information about the
    target system available publicly is useful and documented. There are several paid
    and free tools available that the organization can use to collect information
    about the target system.


    ### Vulnerability Assessment

    The data collected in the first stage is analyzed and used to identify the target
    system’s weaknesses. Penetration testers now attack specific attack surfaces to
    identify any vulnerability. They may conduct these tests using trial and error.


    ### Exploitation

    Based on the information collected in the first and second stages, the hackers
    can use different tools to access the system and exploit it. The exploit could
    be of any type. A penetration tester may steal data, modify it, or destroy it.
    Given this is an ethical test, data is usually never destroyed as the tests are
    conducted against production servers.


    ### Maintaining Access

    The next stage is about maintaining access. A hacker does not exploit a system
    repeatedly since it may trigger the alarm. So, they usually access the system
    or network once and then deploy tools to maintain their connection to the target
    system. A penetration tester needs to cover this possibility and emulate the different
    ways an attacker can maintain access to the system so that they can patch those
    loopholes.


    ### Reporting

    The final stage of the penetration testing life cycle is reporting. Extensive
    and detailed reports are to be created of tests performed, vulnerabilities found,
    and steps the organization can take to patch these vulnerabilities. The team must
    present the report to the senior management of the company, describing the tests
    and assessments carried out. This report helps the management understand the priority
    of infrastructure security and invest the required time, effort, and money to
    secure the business against an actual attack.


    To conclude, security testing is a mandatory part of a software delivery life
    cycle, and organizations should never neglect this process. It costs a bit but
    definitely helps the business secure its assets against high-level cybercrimes.

