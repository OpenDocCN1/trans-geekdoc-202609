- raw: "The disaster recovery plan should cover the aspect of handling communication.\
    \ If during a disaster, communication is not effectively planned, the people might\
    \ not perform well at their jobs, and solving the crisis will be hampered. Communication\
    \ planning can be started by writing down the list of people that should be informed\
    \ about a problem, how to track the progress made toward resolving it, and the\
    \ result. An example list is given here: \n\n*   Board of directors \n\n*   President\
    \ or chief executive officer \n\n*   Vice presidents of respective areas \n\n\
    *   Supervisors \n\n*   Employees dealing with the problem \n\nThe next step includes\
    \ deciding the notification that should be given to each person regarding the\
    \ disaster recovery process. For instance, the board of directors may only need\
    \ to be informed when the disaster progresses so much that it has a material effect\
    \ on the performance of the company. But the supervisor and the employees directly\
    \ affected by the problem need to be constantly notified about every development.\
    \ After considering the list of people and what they need to be notified about,\
    \ decide the way they will be notified. If you are the one directly involved in\
    \ solving the problem, consider passing on the responsibility of notifying the\
    \ required people to another person not too directly involved so you can finish\
    \ the process of resolution soon. This task should be delegated to your department’s\
    \ supervisor or an employee clear on the procedures required in communication.\
    \ They should also have contact information such as home numbers, pager numbers,\
    \ etc. if they must inform the person after working hours. Setting up a telephone\
    \ tree will help to communicate with others quickly. The last task is to outline\
