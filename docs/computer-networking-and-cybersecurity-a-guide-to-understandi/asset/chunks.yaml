    \ with the latter being more interesting and informative. Hacking is something\
    \ anybody with the right tools and knowledge can do. This book has explained the\
    \ general process of hacking, which is commonly called the ‘kill chain process.’\
    \ the book has given readers the best of each topic and hopes that the readers\
    \ have developed a basic conceptual foundation of each topic discussed in this\
    \ book. When studying any material that relates to the topics covered in this\
    \ book, the reader will have enough background knowledge to readily digest information\
    \ meant for an intermediate or advanced-level audience. \n\nPart 2: Cybersecurity\
    \ A Simple Beginner’s Guide to Cybersecurity, Computer Networks and Protecting\
    \ Oneself from Hacking in the Form of Phishing, Malware, Ransomware, and Social\
    \ Engineering ![](Image00013.jpg)\n\nIntroduction The Internet may be the most\
    \ important invention of the twenty-first century, and it affects people’s lives\
    \ daily in more ways than they realize. Everything has changed since the invention\
    \ of the Internet—the way you communicate, play games, shop, work, listen to music,\
    \ watch movies, pay bills, order food, and even the way you make friends. Think\
    \ of anything you want, and there is probably a mobile or web-based app for it.\
    \ The Internet has made people’s lives very comfortable. You do not need to stand\
    \ in a queue or write a check to pay a bill anymore. You can just get done it\
    \ at the click of some buttons. Technology has advanced to such an extent that\
    \ millions of devices are capable of connecting to the Internet—most don’t need\
    \ to be connected to your computer. There are smartphones, tablets, etc., through\
    \ which you can stay connected to your friends and even work whenever you want.\
    \ The Internet has not only simplified things but also made them cost-effective\
    \ due to how it is used not only by the rich but all classes in society. In the\
    \ past, people had to think very hard before making international calls because\
    \ of the charges imposed by telecom providers. Today, you can use the Internet\
    \ to make standard and video calls at great rates, even free in some cases, anywhere\
    \ in the world. The Internet has also changed the adoption rate of traditional\
    \ devices like television, as people now prefer to watch everything through a\
    \ subscription model on the Internet. People do not use a mobile phone just to\
    \ make calls anymore, but tons of other activities, such as watching a movie,\
    \ booking tickets online, etc. The Internet has even made it possible to work\
    \ from home, which is convenient for parents as they can keep a watch over toddlers\
    \ at the same time. In other words, people have become closer since the arrival\
    \ of the Internet. However, the Internet has made way for new kinds of crime,\
    \ too, known as cybercrimes. While the Internet became the “in place” for people\
    \ to hang out and socialize, it also offered cybercriminals massive opportunities.\
    \ Criminals realized that with everything going digital, they also needed to adapt\
    \ and go digital too. It did not take them much time to understand that the entire\
    \ world uses the utilities provided by the Internet for activities such as shopping,\
    \ banking, ordering food, etc., and that all of these have a common twist—financial\
    \ transactions over digital media. Billions of dollars, British pounds, and thousands\
    \ of other currencies are moved around via the Internet these days, every day,\
    \ and that is a huge attraction to criminals, providing an alternative way for\
    \ them to commit their crimes. A thief does not need to walk into a bank anymore\
    \ to steal money; it can be done over the Internet. This led to the arrival of\
    \ cybercriminals who commit crimes over the Internet known as cybercrimes. In\
    \ this book, you will learn about all kinds of cybercrimes and how cybercriminals\
    \ implement them. If there is a law in the real world to keep a watch over criminal\
    \ activity, there are processes in the digital world to keep cybercrimes under\
    \ control. Cybersecurity is a hot term used on the Internet, and that is what\
    \ this book is all about. You will learn about the various ways through which\
    \ you can use cybersecurity to counter cybercrimes. By the end of the book, you\
    \ will also have read about security testing and the careers you can have for\
    \ yourself in the cybersecurity domain if you are an aspiring student or looking\
    \ to switch your field from your current profession. This book will open your\
    \ eyes to new possibilities and bring out the digital version of Sherlock Holmes\
    \ residing within you. "
