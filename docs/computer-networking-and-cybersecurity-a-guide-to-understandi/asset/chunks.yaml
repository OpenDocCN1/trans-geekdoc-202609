    # 第四章：如何识别和移除恶意软件


    恶意软件（Malware）是一个涵盖不同恶意软件的术语，例如间谍软件、勒索软件和病毒。恶意软件是攻击者开发的代码，用于攻击系统及其关联数据，或访问第三方网络。部署恶意软件最常用的媒介是电子邮件。电子邮件中包含链接或附件，点击或下载这些内容时会导致恶意软件代码的执行。恶意软件出现于
    20 世纪 70 年代后期，随着 `Creeper`（蠕虫）病毒的引入，它对个人用户和组织构成了威胁。从那时起，世界上看到了数千种恶意软件变种，它们的意图相同——破坏和毁灭服务。恶意软件包含载荷（payloads），以各种方式部署在目标系统上。攻击者的动机从索要钱到窃取信息不等，他们的攻击技术正变得越来越聪明。


    ## 恶意软件的类型


    这些术语中的一些已经在第一章的网络安全术语部分进行了简要讨论。在本节中，你将更详细地了解它们。


    ### 病毒 (Viruses)

    “病毒”是普通电脑用户和媒体对任何登上头条的恶意软件的通用术语。然而，说所有恶意软件都是病毒是不公平的。计算机病毒附带在你系统上的文件或指向这些文件的指针上，并在用户执行这些文件时被触发。例如，用户可能正在执行一个普通的
    PDF 文档，而病毒已通过嵌入代码渗透到其中。如今，数字领域通常不再有纯粹的病毒，因为它们占恶意软件的比例不足百分之十。这是一好事。病毒是恶意软件中唯一一种停留在一个文件并传播到另一个文件的子类型。由于这种特性，清理病毒变成了一项艰巨的任务，因为它们会不断传播。清理病毒一直非常复杂，即使是最好的防病毒解决方案也力不从心。大多数防病毒解决方案仅能够检测和隔离被感染的文件。它们无法清理这些文件，因此在最后的手段下只能删除这些文件。人们可能会认为删除文件有什么危害，但如果这些文件对于你的应用程序或
    Web 应用程序运行至关重要，它们的删除将导致你的应用程序或网站故障。


    ### 蠕虫 (Worms)

    蠕虫的存在历史早于病毒。自从大型机开发以来，它们就一直存在。随着 20 世纪 90 年代电子邮件的引入，它们变得流行起来，安全专家对以邮件附件形式的蠕虫感到沮丧。一个员工打开了带有蠕虫的电子邮件，整个组织就会在短时间内被感染。蠕虫与病毒的区别在于，蠕虫是自我复制的。例如，`Iloveyou`
    蠕虫在诞生之初通过影响电子邮件、电话系统、电视网络等接管了整个世界。其他流行的蠕虫，如 `MS Blaster` 和 `SQL Slammer`，也确保了它们会在计算机安全历史上被永远记住。蠕虫极其危险，因为它们可以在没有任何用户交互的情况下像野火一样蔓延。与此相反，病毒需要人类触发，然后感染其他文件。蠕虫可以仅依赖系统中的文件和进程来执行。例如，`SQL
    Slammer` 至今仍保持着利用 `Microsoft SQL` 漏洞的记录，在十分分钟内就在每个连接到互联网的 SQL 服务器上创建了缓冲区溢出。


    ### 特洛木马 (Trojans)

    攻击者已从蠕虫转向使用木马作为实施攻击的武器。木马伪装成真实的程序或文件，但其内部嵌入了恶意代码。木马在病毒出现之前就已经存在于数字世界，是当今网络犯罪分子最流行的恶意软件。与病毒一样，木马也需要用户交互才能执行。木马利用电子邮件或恶意网站作为媒介到达目标系统。最常见且流行的木马类型是伪造的防病毒软件。你在访问某些网站时可能会看到弹出窗口，说你的电脑已感染并要求你下载软件来清除病毒。你可能相信这是真的并中招，结果下载并安装了木马。随后木马将接管对你系统的控制。防御木马之所以困难，原因有两个：

    1. 木马的代码易于编写，如今网络犯罪集团甚至已经开发了木马构建工具包。

    2. 木马是通过欺骗用户部署到系统中的，因此它们可以方便地避开防火墙等传统防御。每个月开发的木马数量多达数百万计。防病毒开发者尽力反击木马，但特征码太多，无法逐一跟踪。


    ### 混合恶意软件 (Hybrid Malware)

    当今存在的恶意软件是恶意软件、木马甚至病毒的混合体。恶意软件最初可能看起来像木马，但它的执行最终将攻击网络上的所有用户，这是蠕虫所表现出的特性。如今的恶意软件被认为是隐身程序或根内核。这意味着今天恶意软件的主要目标是获取计算机系统的控制权并对其进行操作，使得是防恶意软件也无法检测。消除此类恶意软件的唯一方法是断开控制系统的内存组件。另一种木马和蠕虫的混合体是僵尸（bots），它们利用一个系统并试图将其加入针对更大基础设施的攻击。僵尸将自己放置在单个计算机系统中，然后接收来自主主的指令，即僵尸网络的命令与控制服务器。被称为僵尸网络（botnets）的网络可以通过互联网将数百台计算机感染到成千上万台服务器，由单个主主控制。主主通常会将这些僵尸网络租给其他犯罪分子，他们将其用于特定的需求。


    ### 勒索软件 (Ransomware)

    勒索软件是攻击者加密你所有数据并索要赎金以解密的恶意软件。攻击者最初使用勒索软件针对个人用户，但后来发现针对银行、医院等大型机构具有更高的经济利益。勒索软件将在以后详细讨论。


    ### 无文件恶意软件 (Fileless Malware)

    这并不是真的一种不同类型。无文件恶意软件可能看起来像木马，但它的执行最终将攻击网络上的所有用户，这是蠕虫所表现出的特性。如今的恶意软件是认为是隐身程序或根内核。这意味着今天恶意软件的主要目标是获取计算机系统的控制权并对其进行操作，使得是防恶意软件也无法检测。消除此类恶意软件的唯一方法是断开控制系统的内存组件。另一种木马和蠕虫的混合体是僵尸（bots），它们利用一个系统并试图将其加入针对更大基础设施的攻击。僵尸将自己放置在单个计算机系统中，然后接收来自主主的指令，即僵尸网络的命令与控制服务器。被称为僵尸网络（botnets）的网络可以通过互联网将数百台计算机感染到成千上万台服务器，由单个主主控制。主主通常会将这些僵尸网络租给其他犯罪分子，他们将其用于特定的需求。


    ### 广告软件 (Adware)

    这并不是真的一种不同类型。无文件恶意软件可能看起来像木马，但它的执行最终将攻击网络上的所有用户，这是蠕虫所表现出的特性。如今的恶意软件被认为是隐身程序或根内核。这意味着今天恶意软件的主要目标是获取计算机系统的控制权并对其进行操作，使得是防恶意软件也无法检测。消除此类恶意软件的唯一方法是断开控制系统的内存组件。另一种木马和蠕虫的混合体是僵尸（bots），它们利用一个系统并试图将其加入针对更大基础设施的攻击。僵尸将自己放置在单个计算机系统中，然后接收来自主主的指令，即僵尸网络的命令与控制服务器。被称为僵尸网络（botnets）的网络可以通过互联网将数百台计算机感染到成千上万台服务器，由单个主主控制。主主通常会将这些僵尸网络租给其他犯罪分子，他们将其用于特定的需求。


    ### 间谍软件 (Spyware)

    这并不是真的一种不同类型。无文件恶意软件可能看起来像木马，但它的执行最终将攻击网络上的所有用户，这是蠕虫所表现出的特性。如今的恶意软件被认为是隐身程序或根内核。这意味着今天恶意软件的主要目标是获取计算机系统的控制权并对其进行操作，使得是防恶意软件也无法检测。消除此类恶意软件的唯一方法是断开控制系统的内存组件。另一种木马和蠕虫的混合体是僵尸（bots），它们利用一个系统并试图将其加入针对更大基础设施的攻击。僵尸将自己放置在单个计算机系统中，然后接收来自主主的指令，即僵尸网络的命令与控制服务器。被称为僵尸网络（botnets）的网络可以通过互联网将数百台计算机感染到成千上万台服务器，由单个主主控制。主主通常会将这些僵尸网络租给其他犯罪分子，他们将其用于特定的需求。


    *(注：由于提供的待翻译文本存在大量段落重复（如 Fileless Malware, Adware, Spyware 的描述完全一致），译文已根据要求不重复输出原文的要求进行处理，确保逻辑清晰。)*


