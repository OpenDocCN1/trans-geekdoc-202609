    ## 2. IP

    Also known as the ‘Internet Protocol.’ `IP` operates at the third layer of the
    OSI networking model, i.e., the network layer. The main function of this protocol
    is to define the way network data is supposed to be addressed from its source
    to destination, respectively. `IP` also defines the sequence in which the data
    is supposed to be reassembled when it reaches its destination.


    `UDP` is known as ‘User Datagram Protocol,’ and it basically has the same job
    as `TCP/IP` protocols, with the only catch being that it offers limited features
    as compared to its counterparts. Although the `UDP` protocol is also carried by
    the `IP` datagrams, it has only a reliability feature, and that is that the `UDP`
    protocol will resend the data packets that did not arrive at the destination.
    The only advantage `UDP` has over `TCP/IP` is that it is considerably faster.
    However, it offers little error-checking and correction capability. Hence, `UDP`
    is best suited for trivial network communication tasks. Since `UDP` does not check
    for errors and simply resends the data when any error does come up, it should
    be only used for network communication when the reliability features are not important
    or if the application involved in the network communication offers its own extensive
    error handling and checking.


    The other networking protocols have been explained in chapter 2. Recall that they
    are:

    - Domain Name System (`DNS`), allowing users to access websites with easy-to-remember
    domain names instead of long numerical `IP` addresses.

    - Dynamic Host Configuration Protocol (`DHCP`), for assigning `TCP/IP` addresses
    to the nodes in a network.

    - Hypertext Transfer Protocol (`HTTP`), which controls the transfer of data between
    the client and the webserver.

    - File Transfer Protocol (`FTP`), which defines the method by which file data
    is sent and received between the `FTP` client and the `FTP` server.

    - Network News Transfer Protocol (`NNTP`), specifically used for Usenet discussion
    groups on the Internet.

    - Simple Mail Transfer Protocol (`SMTP`), which handles the sending and receiving
    of e-mails from one e-mail server to another.


    ## Chapter 6: Learning About the OSI Networking Model

    The very important, fundamental key to understanding computer networking is to
    perceive the conceptual realms of the OSI networking model. This is where all
    the beginners in IT start. The OSI model defines most methods defines with the
    protocols through which computers connect and communicate with each other on a
    network. When understanding the OSI networking model, the reader must firmly grasp
    the abstract visualizations as this will help create a strong foundation for network
    designing and network solution engineering. The OSI model is an accurate yet fundamental
    portrait of how networking in the real world actually works. Although there are
    subtle differences between the theories and practical implementation of the networking,
    it is by no means something that one should disregard. By understanding the OSI
    model, we are essentially learning about the intricacies of computer networking,
    and the reader can eventually visualize the networking process of computers. And
    this understanding is the key to success in the practical field of networking.
    The basis of a certified networking professional is to have an adept and comprehensive
    understanding of the OSI networking model itself.


    We have discussed the importance of the OSI model enough, now let’s talk about
    what it’s all about. As the name suggests, the OSI Networking Model is simply
    a framework that defines the operations and workings of modern networks. The model
    is divided into seven distinct and separate layers. Each layer possesses a trait
    known as ‘successive dependence.’ This means that the successively higher layers
    in the model depend largely on the services characteristic of the preceding lower
    layers. To understand this better, let''s use an analogy. Think of a standard
    desktop computer system you would commonly find in your home. Now, this computer''s
    several components work together, which makes the computer itself functional.
    If we divided this computer into layers such as in the OSI networking model, then
    according to this standard, the hardware component of this computer will be termed
    as the ‘lowest layer.’ The layer succeeding the ‘hardware layer’ of this computer
    would be the Operating System along with the respective system drivers. It’s a
    no-brainer that the Operating System and the respective drivers would be useless
    without the corresponding hardware. Hence, this higher layer is depending on the
    preceding lower layer to perform its function properly. Similarly, this successive
    hierarchy extends to the point where an application is displaying useful and digestible
    data to the user.


    The seven layers of the OSI Networking Model are:

    8. Physical Layer

    9. Data Link Layer

    10. Network Layer

    11. Transport Layer

    12. Session Layer

    13. Presentation Layer

    14. Application Layer


    The figure shown below depicts the structure of the OSI networking model in its
    basic form. ![pic 3 pg 48](Image00012.jpg) (Physical – Layer 1 up to Application
    – Layer 7 – in the OSI Networking Model)


    ### Layer 1: The Physical Layer

    The first layer of the OSI networking model is the physical layer. This layer
    essentially defines the characteristics of the physical parts used in a typical
    network connection. For instance, in a network connection, the physical layer
    specifies the network cable, the router, the `DSI/CSU` box, and the other physical
    mediums involved. The network cable transmits the data packet stream (in bits)
    from one node to the other in the physical network. Let’s discuss this physical
    connection in a little more detail. The network connection established through
    this cable can be in either of the two forms.


    - Point-to-Point, a network connection established between two points.

    - “Multipoint”, a network connection established between several points, for example,
    a single point connecting to multiple other points.


    The direction of transmission is also an important point of discussion in networking.
    This direction dictates the order of transmission, i.e., a data packet can be
    transmitted from one side of the network in one direction at a time. The sender
    transmits data received by the target, and only then can the receiver transmit
    data packets back to the sender. Hence data transmission is happening in opposing
    directions in turns). Similarly, in another type of data transmission on the network,
    both the sender and receiver can send and receive data simultaneously (data transmission
    is happening in both directions simultaneously). These two types of data transmission
    are called:


    1. Half-Duplex: data can be transmitted only in one direction at a time.

    2. Full-Duplex: data can be sent and received in both directions.


    The physical layer also specifies the method of bits transmission in the specified
    network. Transmission of bits in a network connection can be done in either of
    the two ways, i.e., Series or Parallel. Generally, the majority of network connections
    transmit bits serially, but the OSI networking model also accounts for the parallel
    transmission of bits. To further clarify the physical layer’s specification, here’s
    a small list of metrics that generally fall into the category of this layer.


    - The network cable being used

    - The voltage being carried by the cable

    - The measure of the electrical signal timing

    - The distance through which optimal data transmission is supported by the network
    cable

