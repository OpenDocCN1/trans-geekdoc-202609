    ## 2. IP

    也称为“网协议”。`IP` 运行在 OSI 网络模型的第三层，即网络层。该协议的主要功能是定义网络数据从源到到目的的预期寻址方式。`IP` 还定义了数据到达目的地时应当重组的顺序。


    `UDP` 被称为“用户数据报协议”，其基本工作与 `TCP/IP` 协议相同，唯一的区别在于与与其对应的协议相比，它提供的功能有限。虽然 `UDP` 协议也由
    `IP` 数据报承载，但它仅具有一种可靠性特征，即 `UDP` 协议会重新发送未到达目的地的数据包。`UDP` 优于 `TCP/IP` 的唯一优势是其速度要快得多。然而，它提供的错误检查和纠能力很小。因此，`UDP`
    最适用于琐微的网络通信任务。由于 `UDP` 不检查错误，并在发生任何错误时仅简单地重新发送数据，因此它应该在可靠性特征不重要，或者参与网络通信的应用程序提供了自己的详尽错误处理和检查的情况下用于网络通信。


    其他网络协议已在第 2 章中解释。回想一下它们是：

    - 域名系统 (`DNS`)，允许用户使用易记的域名而不是长数字 `IP` 地址来访问网站。

    - 动态主机配置协议 (`DHCP`)，用于为网络中的节点分配 `TCP/IP` 地址。

    - 超文本传输协议 (`HTTP`)，控制客户端与 Web 服务器之间的数据传输。

    - 文件传输协议 (`FTP`)，定义了在 `FTP` 客户端和 `FTP` 服务器之间发送和接收文件数据的方法。

    - 网络新闻传输协议 (`NNTP`)，专门用于互联网上的 Usenet 讨论组。

    - 简单邮件传输协议 (`SMTP`)，处理电子邮件从一个邮件服务器到另一个邮件服务器的发送和接收。


    ## 第 6 章：学习 OSI 网络模型

    理解计算机网络非常重要且基础的关键在于感知 OSI 网络模型的概念领域。此是所有 IT 初学者的起点。OSI 模型定义了大多数通过协议定义的、计算机在网络上相互连接和通信的方法。在理解
    OSI 网络模型时，读者必须牢牢掌握抽象的可视化内容，这将为网络设计和网络解决方案工程奠下坚实的基础。OSI 模型是对现实世界中网络工作原理的准确且基础的刻画。尽管网络理论与实际实现之间存在细微差异，但这绝不是人们应该忽视的。通过理解
    OSI 模型，我们本质上是在学习计算机网络的复杂性，读者最终可以具象化计算机的网络过程。而这种理解是网络实务领域成功的关键。认证网络专业人员的基础是对 OSI
    网络模型本身具有精练且全面的的理解。


    我们已经充分讨论了 OSI 模型的重要性，现在让我们谈谈它的核心内容。正如名称所示，OSI 网络模型仅仅是一个定义现代网络操作和机制的框架。该模型分为七个不同且独立的层。每一层都有一种被称为“逐级依赖”的特性。这意味着模型中连续较高的层在很大程度上依赖于前一个较低层的服务特性。为了更好地理解这一点，让我们用一个类比。想一下你家里常见的标准台式计算机系统。现在，这台电脑的几个组件共同工作，使得计算机本身发挥功能。如果我们像
    OSI 网络模型那样将这台电脑分为若干层，那么根据这一标准，这台电脑的硬件组件将被称为“最低层”。紧接这台电脑“硬件层”之后的层是操作系统以及相应的系统驱动程序。操作系统及其相应的驱动程序会发挥功能是显而易见的（在没有硬件层的情况下，操作系统和相应的驱动程序将无用武处）。因此，这种高层依赖于之前的较低层才能正常工作。同样，这种层级结构扩展到向用户展示有用数据。


    OSI 模型的七层是：

    8. 物理层

    9. 数据链路层

    10. 网络层

    11. 传输层

    12. 会话层

    13. 表示层

    14. 应用层


    下图显示了 OSI 模型的结构。Image00012.jpg（物理层 - 第 1 层到应用层 - 第 7 层）


    ### 第 1 层：物理层

    OSI 网络模型的第一层是物理层。该层本质上定义了网络连接中所使用的物理部分的特性。例如，在网络连接中，物理层指定了电缆、路由器、DSI/CSU 箱以及其他介质。网络电缆从一个节点向另一个节点传输数据位流。让我们更详细地讨论这种物理连接。通过这种电缆建立的网络连接可以是两种形式之一。


    - 点对点，两个点之间建立的连接。

    - “多点”，多个点之间建立的连接，例如单点连接到多个其他点。


    传输方向也是网络中的一个重要讨论点。这个方向决定了传输的顺序，即数据包可以从网络的一侧以一个方向传输。发送者传输接收到的数据，只有然后接收器才能将数据包传回发送者（因此数据传输是交替进行的）。同样，在网络另一种数据传输类型中，发送者和接收者可以同时发送和接收数据（数据传输是同时进行的）。这两种数据传输类型被称为：


    1. 半双工：数据一次只能在一个方向传输。

    2. 全双工：数据可以在两个方向发送和接收。


    物理层还指定了指定网络位传输的方法。网络连接中的位可以通过两种方式之一进行，即串行或并行。通常，大多数网络连接串行传输，但 OSI 网络模型也考虑了并行传输。为了进一步澄清物理层的规范，这里有一份属于该类别的小指标列表。


    - 使用的网络电缆

    - 电缆承载的电压

    - 电信号时序测量

    - 网络电缆支持优化数据传输的距离


    '
