- raw: "Application Services This feature is similar to the two features we have recently\
    \ explored, i.e., file sharing and printer sharing. The application service feature\
    \ allows users connected on a network to share applications. For instance, if\
    \ a company invests in a licensed software to be used by its employees, then it\
    \ can take advantage of computer networking to generate shared copies of the application\
    \ on to the network server to be used by others. The working of this feature is\
    \ very simple; a workstation connected to a network can access the shared application,\
    \ load the files from the shared drive into its system memory, and run the program.\
    \ By using this feature, the organization can also save on effective storage on\
    \ its workstations, as every user would access a centralized folder on a server\
    \ to run a program instead of installing the same program individually on each\
    \ running workstation. Another way to use this feature is to establish a shared\
    \ installation point on a network server. This allows the users who wish to install\
    \ the application to access the installation setup directly from the network instead\
    \ of downloading it or using physical media storage such as CDs, DVDs, etc. Hence,\
    \ the user can directly copy the contents of the installation setup for the program\
    \ onto their respective workstations and install the program as usual. E-mail\
    \ It wouldn't be an exaggeration to regard e-mail as one of the most resourceful,\
    \ convenient, and efficient ways of communication that have ever emerged. The\
    \ e-mail feature observes a widespread use in different environments, be it a\
    \ local or professional setting. On the outside, e-mail seems very simple with\
    \ a sender and receiver. Although this covers the gist of it, we will explore\
    \ the e-mail feature in more technical terms. Generally, there are two types of\
    \ e-mail systems. One is a file-based e-mail system, while the other is a client-server-based\
    \ e-mail system. The one most people are readily familiar with is the client-server-based\
    \ e-mail system, but we will come to that later. First, we will discuss how a\
    \ file-based e-mail system works. A file-based e-mail system is simply made up\
    \ of a server and a controlling host known as a ‘gateway server.’ The server defines\
    \ a storage location that consists of shared files. The server is to provide authorized\
    \ users access to these files. However, handling the connection requests between\
    \ the server and an external user falls under the jurisdiction of the ‘gateway\
    \ server,’ which is actually a single computer. This computer runs a special software\
    \ known as ‘gateway software’ to handle this job, and the unity of the server\
    \ and gateway server is what makes up a file-based e-mail system. But a client-server-based\
