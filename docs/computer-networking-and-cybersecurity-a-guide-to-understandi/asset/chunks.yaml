    clicking on a link they are not supposed to. These links can often ask you to
    enter your account details and even login passwords that will be recorded by the
    attacker. Encryption The process of encoding data using a known algorithm so that
    no one can access it, except someone with a decoding key, is called encryption.
    Bring Your Own Device (BYOD) This is a policy implemented by many organizations
    that suggests that employees can use their personal devices for business. A BYOD
    policy will have access restrictions concerning whether the personal device can
    connect to the corporate network or not. Penetration Testing Penetration testing—also
    known as a pen-test—is the process of using attacking tools and techniques to
    review the security of an organization’s infrastructure. Internal teams or external
    experts are hired to conduct the test to discover vulnerabilities in the organization’s
    infrastructure so that they can be fixed before encountering a real attack. Clickjacking
    This is an attack that tricks the user into clicking on a link or button, which
    looks genuine but has malicious scripts embedded in it. This book has only covered
    the tip of the iceberg for cybersecurity terminology, but this will serve as a
    launchpad to better understanding. History of Cyberattacks In this section, you
    will go through the most well-known cyberattacks in history. Cyberspace is an
    open community where everyone is connected and can reach anyone irrespective of
    time or distance. It may be called a way of life today, but if not used with care,
    it has consequences. There are notorious people in the world who use cyberspace
    to attack websites belonging to banks, social media that contains a gold mine
    of user information, and even governments. Here are a few modern cyberattacks.
    The SpamHaus Project SpamHaus is a public service on the Internet that helps filter
    out spam emails based on their content or the reputation of their origin. The
    attack on SpamHaus is considered to be the biggest cyberattack in history where
    home and business broadband router owners were targeted. The attackers gained
    control over these routers, and all these users became involuntary participants
    of the attack. Millions of email service providers use SpamHaus to filter out
    spam emails from the Internet. On March 18, 2013, SpamHaus had blacklisted a company
    called Cyberbunker, which led to losses for the company. Cyberbunker and other
    hosting companies retaliated to this by hiring hackers who deployed botnets by
    exploiting broadband routers to shut down the SpamHaus network. Sony Playstation
    In 2011, information such as credit card details and user information was stolen
    from 77 million users by a group of hackers. This cost Sony around USD two billion
    in damages. Another pain point for the company happened when hackers were continuously
    able to access the Sony network using the login details of gamers even when the
    company was trying to fix the issue. This whole attack lasted for twenty-four
    days. PayPal In December 2010, PayPal became a victim of a cyberattack. This happened
    immediately after PayPal had blocked the account of WikiLeaks for fundraising,
    citing violation of PayPal’s acceptable usage policy. Multiple users boycotted
    PayPal because of this event, and many hackers started targeting PayPal. Canadian
    Government Hacking In February 2011, the Canadian government disclosed via multiple
    news channels that they had become victim to hacking conducted from IPs that were
    traced back to China. The attackers were able to access three departments of the
    Canadian government and stole data from those departments. The attack was eventually
    stopped by cutting off Internet access to these three departments, putting a full
    stop to the transmission of data to China. 4chan 4chan is an English language
    based website used for posting pictures and discussing Japanese anime and manga.
    It was launched in October 2003 by a fifteen-year-old New York student named Christopher
    Poole. The users were allowed to post anonymously, which served as a drawback
    for the website. A user, Hal Turner, claimed he was the target of DDoS attacks
    and prank phone calls made to his radio show in 2006. In 2008, an anonymous 4chan
    user hacked the private Yahoo mail account of Sarah Palin, a candidate for vice-presidential
    elections. Citigroup Citigroup is one of the largest financial institutions in
    the world. On its own, this was enough incentive for notorious attackers to target
    their network as it had a lot of sensitive and valuable information flowing through
    it daily. An attack in 2011 on the Citigroup network led to customer information,
    such as contact details and account information, being stolen from more than 200,000
    customers. The company suffered monetary damage of USD 2.7 million due to this
    attack. Michael Calce In 2000, a fifteen-year-old boy named Michael Calce, popularly
    known as “Mafiaboy” in cyberspace, gained the spotlight for hacking high-profile
    companies such as computer giant Dell, Fifa.com, Yahoo, Amazon, CNN, and eBay,
    causing damage worth USD 1.2 billion. He also attacked nine out of thirteen root
    name servers of the Internet domain space. Being a juvenile, Calce got away with
    only eight months of open custody, a year of probation, and a small fine. He was
    also not allowed to own any Internet-powered device by the Montreal Youth Court
    for eight months. '
