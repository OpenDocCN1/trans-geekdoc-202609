    obtain some personal information of the target. Therefore, social websites like
    `LinkedIn` are commonplace for spear phishing attackers from where they try to
    retrieve as much personal information of a target as possible. The organization
    must conduct specific training regularly to ensure their users do not respond
    to such emails. Businesses should also invest in technologies that scan incoming
    emails for known malware.


