- raw: 'Chapter Nine: 9 Security Testing Methods This chapter looks at the different
    types of security testing methods. At the end, it will focus more on penetration
    testing. Most organizations adopt this form of testing to identify any vulnerability
    in the system and network. The business maintains cybersecurity testing measures
    are kept in place to check how prepared they are for any potential attack. A business
    may have an internal testing team or outsource the security testing to an external
    team when the need for security testing arises. Attackers are relentless when
    they want to perform the attack, and they always look for new loopholes in the
    system. There are methods such as Penetration Testing, User Awareness testing,
    Red Team Assessment, etc., that help businesses scan through their infrastructure
    for loopholes that are otherwise overlooked. Types of Security Testing Vulnerability
    Assessment The method of vulnerability testing is employed when a business needs
