  trans: '


    HTML 文档通常通过 Google、Chrome 和 Safari 等网络浏览器进行访问。超文本传输协议（Hypertext Transfer Protocol）控制着客户端与
    Web 服务器之间的数据传输。该协议运行在 OSI 模型的应用层。`HTTP` 协议利用其他互联网协议和 `DNS` 在 Web 客户端与 Web 服务器之间建立连接。`HTTP`
    协议本身是不安全的，因为数据传输没有经过加密且可能被拦截。为了解决这个安全问题，我们现在使用“安全 HTTP”，通常被称为 `HTTPS`，以及 `SSL`（安全套接层）。


    ## 文件传输协议 (FTP)

    `FTP` 一词既指“文件传输协议”（File Transfer Protocol），也指“文件传输程序”（File Transfer Program），两者相互相关，因为后者是使用
    `FTP` 协议的应用程序。然而，在本节中，我们只讨论 `FTP` 协议。`FTP` 运行在 OSI 模型的应用层，它定义了 `FTP` 客户端与 `FTP`
    服务器之间发送和接收文件数据的方法。传输可以是文本的或二进制的，且 `FTP` 处理的文件大小没有限制。要执行文件传输，用户必须先连接到 `FTP` 服务器并使用有效的用户名和密码登录。某些网站允许用户输入用户名“anonymous”，并将其电子邮件地址作为密码。这被称为“匿名
    FTP”。


    ## 网络新闻传输协议 (NNTP)

    该协议专门用于 Usenet。`Usenet` 是指代互联网上讨论小组的术语。这些小组涵盖了极其广泛的话题，目前互联网上有超过万个 Usenet 组。Usenet
    组的对话被发送到 Usenet 服务器，然后通过回声（echoing）发送到其他国际 Usenet 服务器。Usenet 组有以下几种分类：


    - `Alt`: 关注替代生活方式和杂杂话题的 Usenet 组。

    - `Comp`: 关注计算机主题的 Usenet 组。

    - `Gov`: 关注政府相关讨论的 Usenet 组。

    - `Rec`: 关注娱乐性主题。

    - `Sci`: 关注科学讨论。


    Usenet 组并非都是公开的。公开的组会接收来自其他 Usenet 服务器的回声新闻，但私有组通常由某些组织或机构托管。私有 Usenet 组要求用户使用正确的用户名和密码进行身份验证。Usenet
    现象的实现仅通过 `NNTP` 协议成为。该协议在 Usenet 服务器与 Usenet 读器之间建立连接。该协议还处理消息格式。这使得消息可以是文本的，也可以携带二进制附件。带有二进制附件的消息通过
    `MIME`（即多用途互联网邮件扩展编码，与电子邮件附件使用相同的编码器）进行编码。


    ## 简单邮件传输协议 (SMTP)

    简单邮件传输协议处理电子邮件从一个邮件服务器到另一个服务器的发送和接收。`SMTP` 协议只是与邮件服务器的发送接收系统通信的一种。当发送邮件消息的系统通过端口
    `25` 连接到接收系统时，`SMTP` 协议就会生效。一旦两个系统之间的连接建立，发送者就会向接收系统发送一个 `HELO` 命令及其相应的地址。一旦该命令被确认且接收者返回了自己的地址，通信就开始了。发送者可以发布命令，通过指定消息的预期接收者表示想要发送消息。一旦接收系统收到此请求，它会查找接收者。如果系统已知接收者，则确认该请求，发送系统随后将消息以及任何附件转发给接收者。一旦接收系统确认已收到整条消息，它就会终止连接。


    ## 使用防火墙保护网络安全

    阅读此书的大多数至少遇到过一次 Windows 防火墙提示。运行在你机器上的这种防火墙应用程序是维护网络安全策略的关键。防火墙是硬件设备，通过执行网络安全策略来保护网络。在大多数网络中，防火墙安装在路由器本身，利用其微处理器芯片和内置内存。这对于在小型办公室或类似场景中设计和安装的网络是如此的。然而，对于大型网络，网络设备包括运行防火墙的专用硬件。这些硬件可以是单个单元也可以是多个部分。通常，网络会指定一台运行防火墙软件的独立计算机。否则，也可以有一个内部带有计算机芯片的防火墙设备。通常情况下，防火墙充当驻守在
    ` ` 和 `Internet` 之间的哨所。关于可用的防火墙，主要有两种类型：


    1. **基于网络的防火墙**：这种防火墙运行在 OSI 网络模型的第三层，也称为链路层。基于网络的防火墙使用的安全技术主要是“数据包过滤”。通过使用这种技术，防火墙被设定了一组定义的规则。每当数据包在两个网络之间传输时，防火墙都会分析该包并与规则进行比较，然后决定该数据包是否允许进入或离开网络。根据数据包过滤规则对数据包进行的许可或拒绝通过，通常基于其目标地址、源地址或
    `TCP/IP` 端口。

    2. **基于应用的防火墙**：这种防火墙充当代理角色。在此语境下，“代理”一词意味着防火墙代表了用户与请求服务的服务器之间的交互式会话。基于应用的防火墙不允许任何数据流量直接通过两个网络。相反，两个网络之间的通信将由一侧的防火墙作为代理处理。这就是为什么基于应用的防火墙也被称为“代理防火墙”。代理防火墙使用的技术是
    `NAT`，也称为“网络地址转换”。在这项技术中，核心思想是隐藏内部网络的网络地址，使其无法被外部网络直接看到。在应用模型中，防火墙负责将数据传输到已建立连接的网络地址。


    ## 第三章：进入计算机关系的网络硬件基础

    “计算机关系”一术语是指计算机与连接在网络上的另一台计算机如何交互。通常有两种类型的计算机关系。


    1. **点对点**

    2. **客户端/服务器**


    '
