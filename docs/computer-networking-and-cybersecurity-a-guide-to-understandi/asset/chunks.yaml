    # Chapter Eight: Web Application and Smartphone Security


    The previous chapter looked at how organizations can secure their systems and
    networks. But is this enough? Or is there a need for more? Where does the process
    of security end exactly? Advancement in technology has led to the development
    of web applications. Today, most businesses have web applications, and many also
    use the cloud to store data securely. The demands of customers have evolved since
    the inception of modern Web 2.0 and web applications based on `HTML5`. Customers
    want to access data and information whenever they want. All these demands have
    put pressure on businesses to move their data onto web applications and cloud.
    For example, banking and shopping operations have moved online. You no longer
    have to walk into a bank or supermarket physically. This has made life convenient
    for customers as they can do things at the comfort of their couch, but it has
    some drawbacks. This has increased the number of cyberattacks or attempts that
    hackers make. This led to the introduction of another chapter in the security
    domain known as Web Application Security. This chapter looks at web application
    security, some myths around it, and how businesses can use web application firewalls
    to keep attackers away from their business.


    ## Web Application Security


    A web application firewall or `WAF` is a security protocol that works at the application
    level to filter `HTTP` and `HTTPS` traffic, thereby providing security from attackers
    at the application layer. In simple words, if an attacker tries to exploit a known
    vulnerability in a web application, it can block such attacks and protect the
    website or application from an attack. However, there are some cons to this process.
    Here are some of the drawbacks:


    *   **It can only detect known vulnerabilities**: A web application firewall has
    certain rules configured in its settings. It matches the web traffic rules and
    classifies the application based on whether the traffic matched with those rules
    or not. Given this, a web application firewall cannot protect you against newly
    discovered vulnerability in the web application. However, web application firewalls
    are effective against denial of service attacks.

    *   **It is only as good as its administrator**: A web application firewall has
    rules configured by a user. This means it is only as good as the weakest link
    in the chain and the user who configured the firewall. It is difficult to determine
    if there are any issues within the system. Therefore, if an experienced user does
    not configure the web application, it can be completely useless.

    *   **Does not fix security issues in a web application**: A web application does
    not automatically fix its code, and you must understand that. So, if there are
    loopholes in the application, it can only protect those loopholes from the attacker’s
    eyes based on the configured rules. The code still needs to be fixed by a human
    developer.

    *   **A web application firewall is a normal application and has its vulnerabilities**:
    A web application firewall is a software, like any other application, open to
    security issues. There are instances where attackers obtained admin access to
    the web application firewall through vulnerability and turned it off. They also
    break into the application firewall. Thus, web application firewalls are an additional
    layer of security but not the end solution.


    It is good practice to have a web application firewall (`WAF`) for an application,
    but if budget permits, it is always good to apply additional layers of security.
    It is important to pay attention to the vulnerabilities in the system or web application
    and fix them irrespective of the presence of a web application firewall. Businesses
    should have web application vulnerability testing as an integral part of their
    product quality testing processes.


    ## How Can You Secure Web Applications?


    To understand if the web application is completely secure, you must identify vulnerabilities
    in the system before an attacker finds out and starts exploiting them. You should
    test a web application for vulnerabilities during the entire software development
    life cycle and not only when the application goes live. There are various methods
    to test a web application for vulnerabilities. You can use any of the following
    methods:


    *   Use a black box scanner to scan the web application.

    *   Use a white box scanner to detect issues with the application code automatically.

    *   Manually audit the source code of the application.

    *   Do a manual penetration test and security audit.


    You cannot use just one method to test the system’s vulnerabilities since no method
    can guarantee a 100 percent detection rate. Every method has its pros and cons.
    For example, an automated tool can discover almost all vulnerabilities concerning
    code compared to a manual tester, but it cannot detect any logical loopholes.
    The tool cannot think like an attacker and will have an underlying code or application
    to perform the test. Manual intervention is required to identify logical flaws
    in the code. Conversely, it can take a lot of time, effort, and money to identify
    technical loopholes manually, and you cannot guarantee that the manual tester
    has identified all vulnerabilities in the system.


    It is advisable to use every tool available to test a web application if there
    is no time and budget constraint, but this only happens in an ideal scenario.
    Therefore, realistically speaking, a business needs to choose the most effective
    solution regarding time and money to simulate an attack. Most businesses use a
    black box scanner known as a web vulnerability scanner. It goes without saying
    that a manual audit should follow an automated web vulnerability scanner. This
    ensures that both technical and logical vulnerabilities are identified.


