    文中将引用这些协议在开放系统互连模型（或“OSI”模型）中的运行层次。该模型定义了计算机在网络上相互连接和通信的大多数方法和协议。它是一个抽象的，但非常有用；理解
    OSI 网络模型将为网络设计和网络解决方案工程奠定坚实的基础。第六章将对该主题进行详细阐述，但纯粹为了参考，我们在此仅介绍 OSI 模型的基本大纲。


    该模型由七个不同且独立的层组成。每一层都有一种被称为“继继依赖”的特性。这意味着模型中连续较高的层在很大程度上依赖于之前较低服务的服务的特性。考虑一个标准的台式计算机系统，它由几个共同工作以实现系统功能的组件组成。如果我们将该系统划分为
    OSI 网络模型的层，那么此计算机的硬件组件将被称为“最低层”。计算机硬件层之上的下一层是操作系统及其系统驱动程序。显然，如果没有相应的硬件，操作系统和驱动程序将无用武处。因此，这一较高层依赖于之前的较低层来正确执行其功能。这种连续层次的可视化一直向上延伸到顶层，即应用程序向用户显示有用且易于理解的数据。


    ### OSI 网络模型的七层


    1. **物理层** – 物理层规定了网络电缆、`router`、`DSU/CSU`箱以及其他涉及物理介质。

    2. **数据链路层** – OSI 模型的数据链路层通过定义和实现一种协议来桥接第三层（网络层）与第一层（物理层）之间的连接，该协议允许网络层将其数据传输到物理层。

    3. **网络层** – 网络层的主要工作是定义数据包从节点到节点传输的路由。为了这个目的，传输层为 OSI 模型的高层屏蔽较低层的特性。

    4. **传输层** – 传输层协调所有层之间的数据移动。

    5. **会话层** – 通过这一层，OSI 模型将两台计算机之间的连接定义为客户端-服务器连接或对等连接。“会话”一词用于描述计算机之间的这种虚拟网络连接。

    6. **表示层** – 表示层执行数据压缩/解压缩以及加密/解密。

    7. **应用层** – 应用层主要关注的是控制和协调网络与操作系统以及在该操作系统上安装的应用程序之间的交互。它基本上定义了应用程序在连接到网络时如何处理系统涉及的通信。


    如果我们分析网络中 OSI 模型各层的性质，会发现它们从与网络内的物理元素开始交互，即 `routers`、`network cables` 等。从那里开始，各层转向与虚拟特征和元素交互，即向网络的智能方面发展。此之后，OSI
    模型重点关注表示层和应用层。


    ### 域名系统 (DNS)


    域名系统的开发是为了解决跟踪 IP 地址的问题。如果互联网只有地址命名方案，跟踪这些地址将非常困难。这就是 `DNS` 发挥作用的地方。通过使用该系统，人们可以在
    `ICANN` 注册名称。以下是一些常见的域名扩展：


    * `.edu` – 用于教育机构

    * `.gov` – 用于政府机构

    * `.mil` – 用于军事机构

    * `.net` – 用于与互联网相关的实体

    * `.org` – 用于非营利组织

    * `.xx` – 用于国家。“xx”是一个占位符，由相应国家的首字母缩写。例如，美国：`.us`


    一旦实体获取了域名，它就可以向域名中添加描述符。域名名称通过 `DNS servers` 解析为它们各自的 IP 地址。


    ### 动态主机配置协议 (DHCP)


    `DHCP` 协议的开发是为了方便网络管理员轻松地节点分配 IP 地址。该协议用于管理员手动解析节点地址并将其放入文本文件中。`DHCP` 协议提供的服务实际上由被称为
    `DHCP servers` 的专用服务器运行。这些服务器控制一个 `scope`，即一个 IP 地址数组。因此，当节点在网络上上线时，它请求 `DHCP
    server` 为其分配一个地址。这些地址在有限的时间内有效，并在分配的时间限制后过期；然后它们将供另一个节点使用。这段时期被称为 `lease period`。


    ### 超文本传输协议 (HTTP)


    整个互联网（称为万维网）是由使用名为 `HTML` 或超文本标记语言的格式化语言创建的文档集合。互联网上的超文本通常包括：


    * 显示文本

    * 图形图像

    * 格式化命令

    * 超链接（点击它们将重定向到互联网上的其他文档）


    '
