    The following information relates to various backup technologies, their costs,
    and the pros and cons of each one. All the values such as prices of drives, media,
    and costs per megabytes, are based on approximations. Digital Linear Tape (`DLT`)
    or Linear Tape-Open (`LTO`) are sturdy backup systems that should be considered
    if your company has adequate resources and ways of using their capacities. These
    systems are rated for re-use a million times, with a shelf life of `30` years.
    and have fast drives for backup and restoration. `DLT` and `LTO` can also have
    robotic autochangers, which make a lot of headroom if the drives are being filled
    up. These robotic autochangers are comparatively cheap, and various types are
    available, ranging from small systems with a capacity of five tapes to large systems
    holding tens to hundreds of tapes. `Super DLT S4` with 600GB per tape and `LTO-4`
    with 800GB per tape are new backup technologies more advanced than `DLT` and are
    suitable for larger networks. A lot of computer equipment vendors support the
    tape formats of `DLT` and `LTO` and consider them to be reliable.


    ## Choosing Backup Strategies


    The backup rotation strategy is planned after all the important information is
    collected, and this plan contains the details of how the backup media is rotated.
    Thoughtful designing of these backup rotations has these advantages:


    * If a disastrous failure occurs, the system can be rebuilt based on the most
    recent data possible.

    * If old tapes have been accidentally erased or damaged without being noticed
    they can have their files restored immediately before the data is lost.

    * Provide protection if the backup media fails.

    * Protect the data against environmental disasters like a fire.


    The files on most network operating systems have special bits assigned to them,
    one of which is called the `archive bit`, and it specifies the backup status of
    the file. The `archive bit` is set to `on` whenever a file is edited, indicating
    the need for a backup of this file. Once the backup is done, the `archive bit`
    clears. With `archive bit` and backup software, the backups that can be created
    are:


    * A **full backup** in which all the files and directories are backed up with
    no regard to the statuses of the `archive bits`. This method clears up all the
    `archive bit` on every file in the backup.

    * An **incremental backup** selects those files modified and had their `archive
    bit` on, and then creates backups for these files. The only files backed up are
    those that have been edited since the last incremental or full backup, and their
    `archive bit` is reset; those who have not been modified will not be included.
    Though the time consumed in incremental backups is minimized in each daily backup,
    the restoration time is increased, and the possibility of media failure becomes
    high.

    * A **differential backup** works by backing up those files which have their `archive
    bits` set to `on`. The change in this backup is that the `archive bits` of the
    files are left on even after a backup so that in subsequent backups, they will
    be backed up repeatedly along with other new modified files. The time taken in
    performing backups is increased, but the restoration time, and the possibility
    of media failure, is reduced.


    Ideally, performing full backups is advantageous as you have to access only the
    most recent backup tapes to restore the system if a failure occurs. Looking at
    it realistically, such a thing is not feasible due to several reasons. First,
    to perform a full backup is time-consuming, and there may not be enough time to
    do a full back up daily. Second, the less work is done by the tapes and media,
    the more shelf life they will have. Besides these concerns, consider much restoration
    time the combination of a full and incremental or differential backup will take
    along with the risk of being unable to restore the data due to using a combination
    approach. Also, consider the scenario where you need a full restoration, and you
    have to use one full backup tape and four incremental backups used since then.
    All the five tapes need to be in good condition, which is less likely than encountering
    a bad tape. It is common to mix the backup types by performing one full back up
    in a week and using the incremental or differential backups for the rest of the
    week. Some examples are:


    * **Full back up Friday nights and incremental backups from Monday to Thursday**:
    Due to system failure on a Monday morning before any data entry, only the Friday’s
    full backup needs to be restored. But if the failure happens on Thursday, four
    tapes need to be restored in sequence for a complete backup, starting from Friday’s
    full backup and continuing from Monday’s incremental backups till Wednesday. In
    the second case, all the data in those tapes must be restored successfully and
    sequentially to ensure data integrity. If it is not done, the files might become
    mismatched and hard to use. Hence four points of media failure in the form of
    tapes increase the risks more than you can handle.

    * **Full back up Friday night and differential backups from Monday to Thursday**:
    if system failure on Monday morning occurs, only previous Friday night’s full
    backup restoration is needed. But if it fails on a Thursday Morning, complete
    restoration of data required only two tapes: the previous Friday’s full back up
    with the differential backup done on Wednesday. This is because, in the differential
    backup, all the modified files since the last backup have been backed up, and
    so, the number of possible media failure points decreases due to only two tapes
    needing to be restored.


    A good backup scheme needs a balance between the data’s nature and the risks with
    each backup, the tapes’ capacity, and the time consumed in each backup. The `Grandfather-father-son`
    (`GFS`) scheme is the most common backup rotation scheme. Eight tapes are used
    in implementing this scheme. Four of these tapes are named from `Monday` to `Thursday`,
    while the other four are `Friday 1`, `Friday 2`, `Friday 3`, and `Friday 4`. The
    first four are used from Monday to Thursday to replace the data from the previous
    week, while the next four tapes are designated for each Friday in the month. For
    the first Friday in the month, use the `Friday 1` tape and so on. Prepare a month-end
    tape on the last day of each month, not for being re-used but for keeping it off-site
    so it can be used where a crisis like an environmental failure destroys the system
    and all the on-site tapes. GFS has three main variations:


    1. Perform a full back up each time, which increases media redundancy but reduces
    restoration time.

    2. Perform full backups only on Fridays and the end of the month, and during the
    rest of the weeks use incremental backups.

    3. Perform full backups on Fridays and month ends, and during the weeks perform
    differential backups. Compared to GFS, rotation schemes are simpler; only two
    or three tapes can be used by rotating them in a sequence and overwriting the
    old data each time. In this way, the three previous days’ data can easily be restored.
    But it is impossible to retrieve data from further back in time if it was erased
    or damaged with no one noticing immediately. A way of solving this shortcoming
    is by using several more tapes that can be rotated weekly or monthly.

    '
  trans: '

    以下信息涉及各种备份技术、其成本以及每种技术的优缺点。所有数值（如驱动器、介质的价格以及每字节成本）均为估算值。数字线性磁带（`DLT`）或线性磁带开放（`LTO`）是稳固的备份系统，如果公司拥有足够的资源和使用方法，应该考虑这些系统。这些系统的设计寿命为重复使用百万次，寿命为
    `30` 年，并具有用于备份和恢复的快速驱动器。`DLT` 和 `LTO` 还可以配备机器人自动换库器，当驱动器满时，它们可以提供大量的空间。这些机器人自动换库器相对廉价，有多种类型，从容量为五盘磁带的小系统到持有几十到数百盘磁带的大型系统不等。每带容量
    600GB 的 `Super DLT S4` 和每带容量 800GB 的 `LTO-4` 是比 `DLT` 更先进的新备份技术，适用于较大的网络。许多计算机设备供应商都支持
    `DLT` 和 `LTO` 磁带格式，并认为它们是可靠的。


    ## 选择备份策略


    备份轮转策略在收集所有重要信息后制定，该计划包含了备份介质如何轮转的细节。周全地设计这些备份轮转具有以下优势：


    * 如果发生灾难性故障，可以根据尽可能最新的数据重建系统。

    * 如果旧磁带被不小心删除或损坏而未被察觉，可以在数据丢失之前立即恢复其文件。

    * 在备份介质故障时提供保护。

    * 防止数据免受火灾等环境灾害的影响。


    大多数网络操作系统的文件都被分配了特殊的标记位，其中一个称为 `archive bit`（归档位位），它指定了文件的备份状态。每当文件被编辑时，`archive
    bit` 就会被设置为 `on`，表示该文件需要备份。一旦备份完成，`archive bit` 就会清除。通过 `archive bit` 和备份软件，可以创建的备份有：


    * **全量备份**（full backup）：不考虑 `archive bits` 的状态，直接备份所有文件和目录。这种方法会清除备份中每个文件上的所有
    `archive bit`。

    * **增量备份**（incremental backup）：选择已修改且 `archive bit` 为 `on` 的文件，并为这些文件创建备份。仅备份的文件是自上次增量备份或全量备份以来被修改的文件，并且它们的
    `archive bit` 会被重置；未修改的文件将不包含在内。虽然每天增量备份消耗的时间减到最低，但恢复时间会增加，介质故障的可能性也会变高。

    * **差异备份**（differential backup）：通过备份那些 `archive bits` 设置为 `on` 的文件工作。这种备份的区别在于，备份后文件的
    `archive bits` 仍保持为 `on`，因此在随后的备份中，它们将与其他新的修改文件一起被重复备份。执行备份所需的时间增加了，但恢复时间和介质故障的可能性降低了。


    理想情况下，执行全量备份是有益的，因为如果发生故障，你只需要访问最近的备份磁带即可恢复系统。从现实来看，由于几个原因，这是不可行的。首先，执行全量备份非常耗时，可能没有足够的时间每天进行全量备份。其次，磁带和介质的工作越少，它们的寿命就越长。除了这些考虑之外，还要考虑全量备份与增量或差异备份相结合将花费的恢复时间，以及由于使用组合方法导致无法恢复数据的风险。此外，考虑一种场景：你需要进行全量恢复，必须使用一盘全量备份磁带和之后使用的四盘增量备份。这五盘磁带都必须处于良好状态，这比遇到坏带的概率小。混合备份类型是常见的，例如每周执行一次全量备份，其余时间使用增量或差异备份。一些示例包括：


    * **周五晚上进行全量备份，周一至周四进行增量备份**：由于周一早上在任何数据录入前发生系统故障，只需要恢复周五的全量备份。但如果故障发生在周四，则需要顺序恢复四盘磁带以完成完整备份，从周五的全量备份开始，一直到周一到周三的增量备份。在第二种情况下，这些磁带中的所有数据必须成功且按顺序恢复，以确保数据完整性。如果没这样做，文件可能会变得不匹配且难以使用。因此，磁带形式的四处介质故障点增加的风险超过了你能承受的范围。

    * **周五晚上进行全量备份，周一至周四进行差异备份**：如果周一早上发生系统故障，只需要恢复上周五晚上的全量备份。但如果故障发生在周四早上，数据完整备恢复只需要两盘磁带：上周五的全量备份和周三完成的差异备份。这是因为在差异备份中，自上次备份以来的所有修改文件都已备份，因此由于只需要恢复两盘磁带，可能的介质故障点数量随之减少。


    一个良好的备份方案需要在数据的性质与每次备份的风险、磁带容量以及每次备份消耗的时间之间取得平衡。`祖父-父亲-孙`（`GFS`）方案是最常用的备份轮转方案。该方案使用了八盘磁带。其中四盘磁带的名称为
    `Monday`（周一）到 `Thursday`（周四），而另外四盘是 `Friday 1`、`Friday 2`、`Friday 3` 和 `Friday
    4`。前四盘磁带在周一至周四使用以替换上周的数据，而另外四盘磁带指定用于每月每个周五。对于月的第一个周五，使用 `Friday 1` 磁带，依此类推。每月最后一天准备一个月底磁带，不是为了重复使用，而是为了异地存放，以便在环境灾害破坏系统和所有本地磁带时可以使用。GFS
    有三种主要的变体：


    1. 每次都执行全量备份，这增加了介质冗余但缩短了恢复时间。

    2. 仅在周五和月底执行全量备份，其余时间使用增量备份。

    3. 在周五和月底执行全量备份，在周期间执行差异备份。

    '
