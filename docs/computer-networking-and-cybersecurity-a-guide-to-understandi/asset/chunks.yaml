    # 第一部分：计算机网络——理解通信系统、网络安全、互联网连接、网络安全与黑客攻击的一站式入门指南


    ![](img/Image00002.jpg)


    ## 引言

    本书由现代社会中相关且热门的多个计算机主题汇编而成。在整本书中，读者将用易于理解的术语和类比来探索每个主题。本书从对计算机网络的描述性且全面的洞察开始，然后扩展到网络安全、网络设计和黑客攻击。主题的呈现专门设计用于：


    * 满足读者的兴趣需求。

    * 为现代计算机网络世界提供有价值的见解。

    * 提供详尽且扼要的知识。


    完成本书的计算机网络部分后，读者将遇到这本合一指南中的其他主题。在结束章节，对黑客攻击中的`kill-chain`（攻击链）过程进行了丰富的描述。这个主题不仅有趣，而且富有启发性，并涉及到黑客在渗透目标系统和网络时所采用的方法。因此，请系好安全带，享受这段旅程。


    ## 第一章：计算机网络基础

    在本章中，我们将探索计算机网络的基础和非常基本的概念。通过这种方式，我们本质上为读者奠定了概念基础。这将有助于增加后续讨论的概念以及计算机网络某些技术细节的易理解性。因此，本章将主要侧重于强调计算机网络细节，并在你学习的过程中稳步构建知识。为了开始，我们将简要介绍计算机网络到底是什么。然后我们将深入探讨细节，巩固读者已成功学习的每个概念的理解。


    ### 什么是现代计算机网络？

    “网络”（networking）一词描述的是多个对象之间的连接或一组连接。同样，“计算机网络”（computer networking）是指两或多台计算机相互连接，以便共享资源。计算机网络可以在多种环境中建立，例如家庭、办公室，甚至是大型商业机构。计算机网络甚至延伸到国际范围，计算机通过`Internet`（互联网）连接。计算机网络一个更微妙且易于观察的例子是连接（有线或无线）到用户个人电脑的打印机或扫描仪。


    由于计算机网络的根本目的是连接不同的 PC，因此产生了一个有趣的问题：我们最初为什么需要计算机网络呢？答案非常简单。如果一个人想看电影、视频，甚至是谈口节目，他可以通过两种方式实现：


    * 通过拥有一个包含内容的物理存储设备（可以在他的计算机上查看），或者简单地跳到`Internet`并访问他可以找到内容的网站，并直接从那里查看。

    * 后一种方法涉及计算机网络。它允许观看者连接到远程计算机服务器，该服务器是网站的主机，允许访问者使用其资源查看他喜爱的内容。这只是计算机网络造福普通用户的一个简单例子。


    `Internet`的现象是计算机网络的副产品，我们都知道几天没有`Internet`是什么样的感觉。虽然我们已经讨论了计算机网络对普通人来说有多重要，但对于大型组织和机构（如医院、商业公司、执法部门等），它变得更加重要和至关重要。这些组织依赖计算机网络来：


    * 高效地建立一个信息通道，整个组织通过该通道通信收集和修改的数据。计算机网络不仅对专业领域对商业领域也有巨大影响，因为如果没有适当的网络基础设施，相应的行业基本上就会崩溃。


    因此，为了理解计算机网络的重要性及其最基本的功能，请注意计算机网络是`Internet`本身的基础。将数据从一个地方传输到另一个地方是网络的目的。关于任何连接我们必须知道的另一个重要点是它可以从一个地方携带到另一个地方多少数据。这种携带数据的能力被称为`bandwidth`（带宽）。如果一个连接具有更高的带宽，它可以在特定时间范围内携带更多数据。网络传输数据的速率以每秒比特为单位测量，简称为
    `Bps`。`Bps`意味着带宽每秒可以携带多少比特。在现代社会，计算机技术和网络已经取得了巨大的进步；这种带宽现在以千为倍数测量。不同的数据传输速度为：


    * 千比特每秒（`Kbps`）

    * 兆比特每秒，或每秒千比特（`Mbps`）

    * 吉比特每秒，或每秒千兆比特（`Gbps`）


    你在计算机网络中还会看到的另一个密切相关的测量值是`hertz`（赫兹）；它是每秒携带的周期次数，正如`hertz`表示交流信号中每秒循环次数一样。赫兹简称为
    `Hz`，用于测量处理器的速度。这种测量以千为倍数计算，并且：


    * 千赫兹千赫兹（`kHz`）

    * 百万赫兹兆赫兹（`MHz`）

    * 十亿赫兹吉赫兹（`GHz`）


    例如，运行在`100 MHz`的处理器意味着每秒一亿次循环。`Hz`和`bps`本质上是相同的测量值，但用于不同的元素。然而，有时它们会被混淆。例如，说以太网线支持`10
    MHz`的带宽而不是`10 Mbps`在常用用法中是可以接受的。


    ## 第二章：网络服务详解

    在本节中，我们将讨论几种依赖于或使用`TCP/IP`协议的网络协议。我们将讨论的协议列举如下：


    1. `DNS`

    2. `DHCP`

    3. `HTTP`

    4. `FTP`

    5. `NNTP`

    6. `SMTP`


