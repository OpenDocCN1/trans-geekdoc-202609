    Reports suggest that GandCrab has managed to cause damages worth $300 million
    in ransoms, most of which have already been paid. The range of individual ransoms
    is between $600 and $700,000. In March 2018, another ransomware attack was initiated
    using SamSam ransomware. This attack was launched on the city servers in Atlanta,
    which infected essential city services, such as police record systems, and revenue
    collection systems were infected. SamSam caused $2.6 million in damages to Atlanta. '
