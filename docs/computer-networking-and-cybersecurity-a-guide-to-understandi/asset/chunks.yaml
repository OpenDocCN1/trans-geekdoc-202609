    # Application Services


    This feature is similar to the two features we have recently explored, i.e., file
    sharing and printer sharing. The application service feature allows users connected
    on a network to share applications. For instance, if a company invests in a licensed
    software to be used by its employees, then it can take advantage of computer networking
    to generate shared copies of the application on to the network server to be used
    by others. The working of this feature is very simple; a workstation connected
    to a network can access the shared application, load the files from the shared
    drive into its system memory, and run the program. By using this feature, the
    organization can also save on effective storage on its workstations, as every
    user would access a centralized folder on a server to run a program instead of
    installing the same program individually on each running workstation.


    Another way to use this feature is to establish a shared installation point on
    a network server. This allows the users who wish to install the application to
    access the installation setup directly from the network instead of downloading
    it or using physical media storage such as CDs, DVDs, etc. Hence, the user can
    directly copy the contents of the installation setup for the program onto their
    respective workstations and install the program as usual.


    ## E-mail


    It wouldn''t be an exaggeration to regard e-mail as one of the most resourceful,
    convenient, and efficient ways of communication that have ever emerged. The e-mail
    feature observes a widespread use in different environments, be it a local or
    professional setting. On the outside, e-mail seems very simple with a sender and
    receiver. Although this covers the gist of it, we will explore the e-mail feature
    in more technical terms.


    Generally, there are two types of e-mail systems. One is a file-based e-mail system,
    while the other is a client-server-based e-mail system. The one most people are
    readily familiar with is the client-server-based e-mail system, but we will come
    to that later. First, we will discuss how a file-based e-mail system works. A
    file-based e-mail system is simply made up of a server and a controlling host
    known as a `gateway server`. The server defines a storage location that consists
    of shared files. The server is to provide authorized users access to these files.
    However, handling the connection requests between the server and an external user
    falls under the jurisdiction of the `gateway server`, which is actually a single
    computer. This computer runs a special software known as `gateway software` to
    handle this job, and the unity of the server and gateway server is what makes
    up a file-based e-mail system.


    But a client-server-based e-mail system is something cleaner, sleeker, more powerful,
    and, most important, secure. This e-mail system also boasts extended functionality;
    for instance, in business companies, they can automate the e-mail system for generating
    invoices and making purchases automatically. It’s a given that such an e-mail
    system must be properly configured to do so. The client-server-based e-mail system
    consists of a single server responsible for collectively managing the external
    and internal e-mail interconnections on the network. This e-mail system also houses
    the messages. Some examples of a client-server-based e-mail system are `Microsoft
    Exchange` and `Lotus Notes`.


    Until now, we have mainly discussed these two e-mail systems in large-scale business
    companies. However, the e-mail feature is equally important for small-scale companies
    and organizations, such as those with less than twenty-five employees. For such
    companies, purchasing an entire e-mail system and maintaining it is comparatively
    expensive and requires much manpower for proper maintenance, hence making the
    use of e-mail systems out of their reach. However, there is another viable alternative
    for such scenarios. This includes using an e-mail system not primarily housed
    and maintained within the organization itself. For instance:


    *   Set up a shared connection with the Internet so every employee using a workstation
    can access it. Next, we have to do only simply set up the corresponding e-mail
    accounts for the users either through the `ISP` or just use an e-mail service
    free and popular such as `Yahoo!`, `Hotmail`, `Gmail`, etc.

    *   Use the `Microsoft Windows Small Business Server 2008` as the dedicated Operating
    System for all the workstations. This OS includes useful server-based tools that
    can facilitate setting up an-mail system. Best of all, the OS is natively bundled
    with a limited version of the `Exchange Server` software that can be used.

    *   Subscribe to a mailbox from a service provider that has set up and maintained
    an e-mail system with high specifications. Companies that go for this approach
    usually have to pay a monthly fee that corresponds to the number of mailboxes
    being used by them.


    ## Remote Access


    Another beneficial feature of computer networking is giving users the ability
    to remotely access the resources of their specific network. The reason that makes
    this feature so important is that a network’s physical limitations are ignored
    by the users, meaning they don’t need to be in the office or the building where
    the network is located. They can remotely access their files or e-mails even when
    they’re working away from the office, such as in their homes or a hotel. However,
    remote access is not a simple feature. But remote access can be delivered in a
    variety of flavors. To set up and use the remote access feature, the list shown
    below outlines several methods that can serve the purpose.


    *   Using the `Microsoft Windows Server` operating system to establish a `RAS`
    (Remote Access Service) connection. This connection entails a simple setup consisting
    of only one modem to an enlarged system that involves multiple modems.

    *   Using a remote access system set up and maintained to perform only this function.
    Such a system can handle multiple simultaneous connections at once, meaning that
    several computers can be set up easily. Each computer that is connected to the
    remote access system uses its own network card.

    *   Setting up a workstation with specific remote access software (for example,
    `pcAnywhere` and `GoToMyPC`) through which the users that intend to use the remote
    access feature simply dial in.

    *   Establishing a company connection to the Internet. The employees of this company
    can use this Internet connection to gain access to the resources available on
    the company’s networking system. To secure this remote access, the company usually
    implements a Virtual Private Network connection (`VPN`).

    *   Using a workstation running the `Windows Server` operating system as a connection
    server. This can be deone by installing software such as `Windows Terminal Services`.
    In this way, the workstation will be capable of hosting several client sessions
    allowing multiple users to gain remote access.


    # Chapter 5: Common Network Protocols and Ports


    Unlike the previous chapter, which covered more than half the topics under the
    scope of this book, we will be briefly going over and understanding some of the
    most common protocols we come across in networks. Network protocols are complex
    and difficult. We will reserve the more intricate details for the next series
    of this book and focus instead on the fundamentals of network protocols to build
    a basic conceptual foundation. In this chapter, we will be mainly discussing:


    *   `TCP/IP` and `UDP` Ports

    *   Other network protocols such as `DNS`, `DHCP`, `HTTP`, `FTP`, etc.


    ## TCP/IP and UDP


    `TCP` and `IP` are two protocols used in harmony with each other. The explanation
    of each protocol is:


    1.  `TCP`: Also known as the `Transmission Control Protocol`. `TCP` operates at
    the transport layer of the `OSI` model, and it mainly manages the connection between
    the computers on a network. The messages of the `TCP` protocol are ‘encapsulated’
    in `IP` datagrams.

