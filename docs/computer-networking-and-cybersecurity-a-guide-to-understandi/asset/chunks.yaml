    ## 后门威胁


    网络操作系统或网络基础设施的其他部分（如路由器）中存在的问题和漏洞是后门威胁的主要原因。安全漏洞是所有网络操作系统和组件中持续存在的一个问题。通过及时更新软件和安全相关的补丁，并审查与安全漏洞的新信息，可以有效解决这个问题。


    Web 服务器应通过以下方式确保安全：


    *   如果您将公司相关的网站托管在互联网提供商（ISP）的系统而不是您的网络上，服务器将更加安全。外部服务器的优点包括提供 24/7 服务以及先进的安全。另一个点是，允许或禁止从外部连接
    LAN 的担忧不再适用。

    *   确保为系统网络配置并实施强大的防火墙路由器。您设置的防火墙路由器最好由熟悉该防火墙原理或帮助过配置的人员进行测试。保持防火墙软件更新。

    *   调查所使用的 Web 服务器的安全设置，并确认它们已正确实施。通过定期审核这些安全设置，Web 服务器将保持安全。

    *   对于从公司外部访问 Web 服务器的人员，创建一个可以在防火墙之外、或更准确地说，在防火墙和互联网路由器之间（非军事化区）访问的 Web 服务器。这种安全方法为入侵
    Web 服务器的黑客制造了障碍，如果他们尝试入侵网络，将面临很大困难。


