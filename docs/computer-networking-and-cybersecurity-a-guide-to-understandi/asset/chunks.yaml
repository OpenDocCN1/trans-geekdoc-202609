    # Chapter Ten: Skills Required for a Career in Cybersecurity


    You are nearing the end of this book, and thus far, you have learned a lot about
    cybersecurity. So, what next? It is good to have all this knowledge, but what
    should you do if you wanted to use it? This chapter looks at the careers available
    in cybersecurity and the skills you need to develop to pursue such a career. The
    classification of the roles in this chapter will help you decide what area you
    would like to work in.


    A career in cybersecurity is not a bed of roses; it can be stressful. However,
    it has its rewards. Cybersecurity professionals find themselves in different roles
    across the organization, but their objective remains the same. They must develop
    methods and tools to protect the organization’s data from any attack.


    The process of getting into a cybersecurity role in the industry is not always
    straightforward. Some people jump into it right out of college, while others like
    to get some experience in software engineering before choosing to move to a role
    focused more on security. Here are some career options available in the cybersecurity
    field based on the experience of the candidate:


    ### Entry-Level Roles

    * Systems Administrator

    * Systems Engineer

    * Web Developer

    * IT Technician

    * Network Engineer

    * Security Specialist


    ### Mid-Level Roles

    * Security Analyst

    * Security Technician

    * Incident Analyst

    * Cyber Security Consultant

    * IT Auditor

    * Penetration Tester


    ### Senior Level Roles

    * Cyber Security Architect

    * Cyber Security Manager

    * Cyber Security Engineer

    * Chief Information Security Officer


    ## Four Popular Careers in Cybersecurity and How to Get There


    ### Security Architect

    If you like to solve problems, and develop strategies to prevent the same problems,
    consider the role of a security architect. A security architect is responsible
    for designing, developing, and implementing security for an organization’s systems
    and networks. They are capable of developing efficient complex security structures.
    The security structures can prevent any malware, DDoS, and other attacks.


    The average salary for a security architect in the USA is around $120,000 per
    annum. Security architects must have at least five years of experience in the
    IT industry and three to five years in security. Follow the path given below if
    you wish to pursue a career as a security architect:


    * Pursue a degree in information technology, computer science, cybersecurity,
    or any other relevant field. Alternatively, you can earn equivalent industry-level
    certifications.

    * Enter the industry as a systems administrator, security administrator, or network
    administrator.

    * Work in the same organization for a while, and move up the organization until
    you reach a security engineer level.

    * At this point, you can switch to a security architect role.


    The responsibilities of a security architect are as follows:

    * Research about current attack trends and design security architecture for all
    IT projects of the business.

    * Provide the requirement to management for networks and network devices.

    * Perform security testing, such as risk analysis and vulnerability testing.

    * Research about the latest standards in security and implement them in the organization.


    #### Training

    The role of a security architect is a senior-level role, and therefore recruiting
    managers to look for specific certifications when they hire any candidate. Industry-level
    certifications in cybersecurity give your profile an edge over your competitors.
    You can first earn a `CompTIA Security+` certificate and then proceed to the `Certified
    Ethical Hacker (CEH)` certification. To move on to the advanced and expert levels,
    you can earn an `EC-Council Certified Security Analyst (ECSA)` and `Certified
    Information Systems Security Professional (CISSP)` certification.


    ### Security Consultant

    A security consultant, also known as a cybersecurity expert, knows everything
    there is to know about cybersecurity. They can analyze risks and problems and
    provide appropriate solutions to other organizations to secure their infrastructure
    and protect their data. Some organizations use a different name for this role.
    Some commonly used terms are security consultant, network security consultant,
    or database security consultant.


    A security consultant is expected to be versatile and able to answer any queries
    related to cybersecurity. The salary range depends on the experience, but a senior-level
    security consultant can make up to $106,000 per annum in the USA. Most organizations
    prefer to hire consultants with at least three to five years of experience. You
    can follow the path below to become a security consultant:


    * Pursue a degree in information technology, computer science, cybersecurity,
    or any other relevant field. Alternatively, you can obtain the equivalent industry-level
    certifications.

    * Enter the industry though a general IT role.

    * Continue to work in the same organization and move up the ladder until you reach
    the security administrator, auditor, or analyst roles.

    * Get yourself some industry-level certifications and improve your skills.

    * Try moving to a security consultant role.


    The daily tasks of a security consultant are as follows:

    * Determine ways to protect systems, networks, and data from attacks.

    * Perform security assessments and vulnerability tests.

    * Communicate with staff and employees to understand security issues.

    * Using industry-standard solutions to test security.

    * Supervise and guide the security team of the organization.


    #### Training

    You can start with the `CompTIA Security+` certificate and move on to the `Certified
    Ethical Hacker (CEH)` certification. You also need to earn the `Cybersecurity
    Analyst (CySA+)` certification. Advanced certifications include `Certified Information
    Systems Auditor (CISA)`, `EC-Council Certified Security Analyst (ECSA)`, and `Certified
    Information Security Manager (CISM)`. To get to the expert level, you can get
    certified with `Certified Information Systems Security Professional (CISSP)`.


    ### Ethical Hacker/Penetration Tester

    Penetration testers, also known as ethical hackers, understand how an attacker
    thinks, and use that understanding to simulate different attacks on the organization’s
    systems and network to prevent any malicious attacks. They perform this attack
    only with the management’s consent, identifying the weak spots before an attacker
    can exploit them. This helps the business to protect their sensitive and critical
    data, both in storage and in transit.


    The average salary of a penetration tester in the USA is $80,000 per annum. If
    you want to become a penetration tester, follow the career path given below.


    * Pursue a degree in information technology, computer science, cybersecurity,
    or any other relevant field. Alternatively, you can obtain the equivalent industry-level
    certifications.

    * Enter the industry as a systems administrator, security administrator, or network
    administrator.

    * Get yourself some industry-level certifications and sharpen your skills.

    * Continue to work in the organization until you move up the organization and
    earn a senior penetration tester, security architect, or security consultant role.


    The duties of a penetration tester are as follows:

    * Conduct penetration tests on applications, systems, and networks.

    * Analyze weaknesses to identify methods an attacker could use to exploit the
    system.

    * Discuss and document the findings with the IT teams.

    * Design and implement new tools for penetration testing to keep up with modern-day
    attacks.


    #### Training

    Start with the `CompTIA Security+` and move on to the `Certified Ethical Hacker
    (CEH)` certification. At an advanced level, you can earn the `CompTIA Advanced
    Security Practitioner (CASP)` and `EC-Council Certified Security Analyst (ECSA)`.
    To become an expert, you can earn the `Certified Information Systems Security
    Professional (CISSP)`.


    ### Chief Information Security Officer (CISO)

    The Chief Information Security Officer profile is a senior-level profile in the
    field of cybersecurity. It is a very respected and rewarding job and includes
    a lot of power and freedom concerning creativity. The Chief Information Security
    Officer is responsible for assembling a security team and keeping a macroscopic
    view over the organization’s security.


    The average salary of a CISO is around $160,000 per annum in the USA. You must
    have at least seven to ten years of experience and five years of security. You
    can achieve this by:


    * Pursuing a degree in information technology, computer science, cybersecurity,
    or any other relevant field. Alternatively, you can earn the equivalent industry-level
    certifications.

    * Enter the industry through a general IT role.

    * Continue to work in the same organization and move up the ladder until you reach
    the security administrator, auditor, or analyst roles.

    * Get yourself some industry-level certifications and improve your skills.


    The responsibilities of a CISO will be as follows:

    * Creating security policies.

    * Managing security projects.

    * Establishing security teams.

    * Training security teams.


    #### Training

    The role of a CISO is a senior-level role, and therefore recruiting managers to
    look for specific certifications when they hire any candidate. Industry-level
    certifications in cybersecurity give your profile an edge over your competitors.
    You can first earn a `CompTIA Security+` certificate and then proceed to the `Certified
    Ethical Hacker (CEH)` certification. To move on to the advanced and expert levels,
    you can earn an `EC-Council Certified Security Analyst (ECSA)` and `Certified
    Information Systems Security Professional (CISSP)`.

