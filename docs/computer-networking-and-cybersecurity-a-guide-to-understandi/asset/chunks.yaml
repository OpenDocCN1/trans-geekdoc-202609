    is the best, analyze the results given by each crawler. Use the following parameters:
    1. The number of pages scanned; 2. The number of files used; 3. Various parameters
    included during the scan. There is a possibility that a crawler was unable to
    scan the entire surface of the web application. This often happens when the crawler
    must be configured manually, which brings leads to the next point.

    *   **User-Friendliness of the Web Vulnerability Scanner**: While most black box
    scanners are automatically configured to scan a web application, some may need
    you to specify certain parameters manually. Your business does not need to have
    a dedicated web application security team to configure a web vulnerability scanner
    as per business requirements. This means that the security scanner should be user-friendly
    so that anybody with basic programming or technical skills can configure the scanner.
    User-friendly web vulnerability scanners help businesses save money since they
    do not have to hire specialists to work on it.

    *   **Ability to Identify Vulnerabilities**: The next criterion is to see which
    web vulnerability scanners can identify the maximum vulnerabilities and how many
    contain false positives. Web vulnerability scanners find thousands of vulnerabilities,
    but more than 60 percent of those were false positives. You may ask why this is
    problem? The issue with false positives is that manual auditor must spend more
    time trying to verify if vulnerability is indeed vulnerability. This is a waste
    of resources and therefore, needs to be avoided.

    *   **Automation**: More automation in a web vulnerability scanner is equal to
    more relief for the company. This means that tester need not manually configure
    each parameter since the scanner is already configured to scan well-known vulnerabilities.
    There are more vulnerabilities in web application than meets the eye, and practically
    impossible for people to identify every vulnerability even if a time restriction.
    It is safer to use automated scanner since it can complete the scan and identify
    vulnerabilities within two-three hours. Additionally, tester’s knowledge about
    any vulnerability in system is dependent on their experience. Automated web vulnerability
    scanner is already equipped with knowledge of existing vulnerabilities, and developers
    constantly update database based on newly discovered vulnerabilities. In addition
    to these technical steps that you can take to secure web application, you must
    stay informed. The Internet is full of information with blogs.


    ## Smartphone Security


    When someone talks about ransomware attack, people immediately think of employees
    using laptops or desktops. This is where attacker considers all possibilities
    that help them enter system or network. An easy way to do this is through smartphones,
    which are easy to hack. Following are some numbers concerning cyber crimes and
    smartphones:


    *   Reports suggest the number of attacks on smartphones had gone up by 50 percent
    in 2019 compared to 2018 for Android devices.

    *   Reports by researcher suggest that in the past twelve months, 67 percent of
    small businesses are victims of cyberattacks, and 58 percent were data breach.

    *   Data breach report presented by Verizon in 2019 showed that 42 percent of
    victims were small businesses.

    *   Forty-seven percent of businesses agreed they do not know how to secure smartphones.


    Attacking smartphones is getting popular since attackers always look for new ways
    to attack. For instance, state-sponsored attacks have started integrating smartphones
    to gather information. Here are the simplest ways users owners can protect their
    smartphones:


    *   **Update the Operating System and Apps**: Just like you would do in the case
    of laptop or desktop, it is also important to keep your smartphone’s operating
    system and applications up to date. Many people are idle about updating their
    smartphone’s operating system and apps. This opens smartphone up to new vulnerabilities.
    When operating system providers roll out an update, it sends you a notification.
    Once you download and install it, it fixes what makes smartphone easy target for
    attackers.

    *   **Bring Your Own Device (BYOD)**: Businesses also have BYOD policy where personal
    smartphones can be connected to office network. This being said, businesses need
    to train employees about the importance of keeping smartphones up to date.

    *   **Lock Your Smartphone**: Keeping your phone unlocked is convenient for checking
    texts, emails, etc., but imagine if you forgot your phone in coffee shop. What
    do you think will happen? If you do not have security code, anybody can pick your
    phone up and access all information. If your phone contains business information,
    you will put your business or organization at risk because of minor negligence.
    Therefore, always make a point to lock your smartphone with a passcode or biometric
    authentication.

    *   **Use Inbuilt Device Security Features**: You can use the “locate my device”
    feature if you misplaced your smartphone. The feature makes your phone ring or
    help you locate your phone if lost it temporarily. There are options on the phone
    even to delete all data if there were few passcode attempts.

    *   **Using Bluetooth and Wi-Fi Wisely**: Many people like to use free or public
    Wi-Fi. If you are using a smartphone with critical business data, think twice
    before you do this. Make it point to ensure that the Wi-Fi you use is from a legitimate
    network. Free Wi-Fi available across public spaces such as coffee shops, malls,
    etc., are less secure. The same goes for Bluetooth. People tend to ignore the
    Bluetooth feature leaving it on all the time. An attacker can take advantage of
    this ignorance and break into your phone if they get sufficiently close to you.

    *   **App Permissions**: When you install an app on your smartphone, it asks you
    permission to access certain features. Be careful before you approve these permissions.
    For example, it is understood for Google maps to have permission to access your
    location since it needs this to give you the right information. On the other hand,
    if a simple game you downloaded asks you for permission for your location, you
    need to be alert immediately; attackers created the game to access your location.
    An application may ask many other permissions, so make sure to read these before
    you give the application access.

    *   **Phishing and Spam Emails**: Your smartphone also has an email application,
    and hackers can use phishing to obtain sensitive information. Everything learned
    in Chapter Three holds for emails received on your smartphone.

    *   **Data Backups**: Data backups are as important for your smartphone as for
    your laptops and desktops. Some issues may occur at any time. Your smartphone
    may get stolen, or you may cause accidental damage to it. Therefore, maintain
    data backup. Smartphone providers these days offer automated backups through cloud
    services such as `Google Drive` for Android and `iCloud` for iPhones. Always take
    advantage of this feature so you never have to worry about losing your data.

    *   **Antivirus Apps**: It is good to have an antivirus app installed on your
    smartphone since it protects your phone from any kind of malware. Attackers always
    deploy malware first to your device, so it is best to install an antivirus app
    to prevent any attacks.

    *   **Source of Your Apps**: The majority of users ignore this fact, but it is
    very important that the apps you download come from trusted sources. For Android,
    the `Play-store` is a trusted source, and for Apple, the `app store`. There are
    certain apps unavailable on the `play store` or `app store` due to security reasons.
    Users tend to sideload these apps that may be tampered with by an attacker, and
    your smartphone is conveniently opened up for attack because of your negligence
    to sideload third-party apps.


    To conclude, smartphones are critical extensions to business, more now than ever,
    and are no longer just a device used for making phone calls. Given its form factor,
    you can easily lose it, or it can be robbed. Therefore, it is really important
    in the modern world to care about the security of your smartphone just as much
    as you care about your other devices.

