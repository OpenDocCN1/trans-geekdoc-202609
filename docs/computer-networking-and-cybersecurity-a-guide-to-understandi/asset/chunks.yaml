    \ further attempts by locking out the account. The locked account can only be\
    \ reopened by talking to the administrator with the authority to reset the account.\
    \ This case usually occurs when people forget their passwords, but this policy\
    \ keeps in check any malicious intent to guess the password and gain access to\
    \ the account. \n\n*   Novell NetWare and Windows servers can set limits on the\
