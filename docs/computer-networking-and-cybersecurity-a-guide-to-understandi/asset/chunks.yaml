    When choosing a suitable hub for your network, the first thing to bear in mind
    is the specifications of your network. By knowing how many nodes are supposed
    to be connected to the hub, the required bandwidth for each node, and the network
    backbone type being used with the hub, we can choose the right hub best suited
    for the network. In terms of the network backbones usually installed with a hub,
    they are generally anything between shared 10 Mbps thin ethernet networks to 100
    Mbps `100Base-Tx` and high-speed networks. Whatever the case, the choosing of
    a backbone technology primarily depends on the bandwidth requirement of the network
    and other criteria that need to be fulfilled for the network designed. Technically,
    in a network where hubs are being used, the hubs act as ‘collision domains’, where
    collisions usually occur. So, if we use multiple hubs in a single network set
    up, then the area of the collision domain in the network will inevitably become
    larger. The only exception is when the hubs are individually connected to a switch.
    By using switches, we can restrict the collision domains of each hub to itself.
    The figure shown below depicts a network using several hubs. ![](Image00005.jpg)


    ### Switches

    Just as the name implies, a switch is a hardware component of a network that can
    rapidly switch connections from port to port. A switch creates these connections
    in a network by switching dynamically among the several network ports available.
    Consider a train yard, where several trains are coming in from certain tracks
    and leaving through other tracks. The train yard has a designated person tasked
    to manage the movement and routes of the train. This person is called the ‘yard
    manager.’ To make sure that the trains arrive at their destination, the yard manager
    essentially switches the tracks according to their specified route. In this analogy,
    the ‘switch’ is the ‘yard manager.’ Instead of directing trains by switching the
    tracks, a switch directs the data packets through the network by ethernet cabling.
    In this way, a data packet is effectively routed to its destination. We know that
    a switch establishes an individualized connection between any two given ports
    of the network; it makes sense that the entire ports converging into the switch
    device don’t share a common collision domain. This is why a switch device plays
    a role somewhat similar to that of a super bridge. Due to the nature of switches,
    they are mostly used to bridge the connection between hubs and relatively faster
    backbones in a network.


    For instance, consider a network using ten hubs. Each hub supports up to 24 connection
    nodes for workstations. With ten hubs, we will have about 240 connection nodes
    meaning there will be 240 workstations in total connected to the hubs. If these
    hubs are connected to the same backbone in the network, then it would mean that
    the collision domain of all the hubs would be the same. When the 240 workstations
    are sharing the same collision domain, then network performance will deteriorate.
    Here, we can fix this problem by using a switch with 12 ports. Earlier, each port
    of the switch had its own separate collision domain. Here, all ten of the hubs
    connected to the 12-port switch will have domains, thereby maintaining the network
    quality. A `100Base-T` network connection is commonly used with workstations.
    A networking expert would recommend a `1000Base-T` or faster connection as the
    backbone network. By using a switch and a fast backbone, the workstations connected
    to the network through the nodes can operate at 100 Mbps. Switches impact the
    speed and performance of the network so well that using a switch becomes a no-brainer.
    Another aspect that makes switches so desirable in networks is that they are very
    inexpensive. For a typical local area network, using switches instead of hubs
    makes more sense because hubs are expensive network components. In comparison,
    a switch is inexpensive, has much to offer to the network, and is comparatively
    easier and simple to install. Nowadays, you might find difficulty finding an available
    bridge on the market as the supply and demand of switches is overwhelming. The
    reason to know and understand hubs is that although they are not used now, you
    might still come across older installations using hubs. In newer network installations,
    it is guaranteed that you will exclusively deal with switches instead. To reiterate
    the main concept of these hubs and switches, hubs create a bigger packet collision
    domain, while switches have smaller, separated collision domains.


    ### Bridges

    A bridge is a hardware device that performs the same function as a repeater but
    is more intelligent. Bridges work by joining two network segments, just like repeaters;
    the main difference is that when a bridge must pass data traffic from a segment
    to another segment, it does so intelligently. This means that a bridge will only
    pass the data traffic to the other segment if this traffic’s destination is the
    target segment; otherwise, it will not. Another distinguishing feature of a bridge
    is that they also divide the network into smaller segments. Certain bridges can
    be connected to two network segments. For instance, such a bridge can span from
    coaxial Thin Ethernet to a twisted-pair Token Ring.


    We talked about the layer at which repeaters operate at (which was the physical
    layer of the OSI model). One would assume that since the function and purpose
    of the bridges is virtually the same as repeaters, they would also operate at
    the first layer of the OSI networking model. However, that’s not the case; instead,
    the bridges operate at a layer that is one level higher, i.e., at the second layer,
    also known as the data-link layer in the OSI networking model. This is because
    bridges connect the network segments and then pass the data traffic from segment
    to the other segment ‘intelligently.’ To do this, the bridge analyzes each encountered
    data packet’s `MAC`, or Media Access Control address. This analysis of the `MAC`
    address helps the bridge determine whether it should forward the data packet onto
    the other network or not. A bridge device can store the parts of the network’s
    address data. This can be done in either of two ways:


    1. The user programs a static routing table that contains the address information
    and data.

    2. The user implements a dynamic learning system that learns in a tree pattern
    by automatically identifying and discovering the network’s addresses.


    Bridges shouldn’t be used carelessly. Here are scenarios where using bridges in
    the network is recommended:


    *   If you are dealing with a small-scale network, then bridges can be used.

    *   If the network is using a repeater, then a bridge can be installed in place
    of the repeater.

    *   If the network you are dealing with seems to benefit when the network traffic
    is not transferred unnecessarily between the different segments of a network,
    then a bridge should be used.

    '
