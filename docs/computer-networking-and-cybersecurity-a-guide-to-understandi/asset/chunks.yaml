    # 第 2 层：数据链路层


    OSI 网络模型的第二层是数据链路层。该层定义了相关标准，为物理层传输和接收的数据包或比特位赋予了理解意义和价值。OSI 模型的数据链路层通过定义和实现一种可靠的协议，桥起了第三层（网络层）与第一层（物理层）之间的连接，使网络层能够通过该协议通过物理层传输其数据。


    OSI 模型中数据链路层的主要目的（除了连接第一层和第三层之外）是执行数据校验功能。这是对数据链路层次要工作的一种非正式且于理解的描述。根据技术标准，数据链路层对传出的数据流进行错误检测和纠正。通过这种方式，确保了数据流的可靠且无误。此外，数据链路层有一个被称为“帧”（frames）的术语，指的是该层所载的数据元素。存在多种帧类型，其中最常用的包括：


    * `X.25`

    * `802.x`（包括以太网和令牌环网络）


    在 OSI 网络模型中，数据链路层被进一步分为两个子层。这两个子层是：


    1. 逻辑链路控制 (LLC)

    2. 介质访问控制 (MAC)


    现在，这两个子层共同执行数据链路层的主要功能。这意味着这两个子层分别执行与数据链路层本身功能相关的独立任务。`LLC` 子层建立并控制链路，即呼叫的建立与终止以及数据传输。由于这一点，OSI
    模型兼容电信网络和局域网（LAN）。`MAC` 或介质访问控制子层处理网络中帧的组装和拆分，并负责寻址以及错误检测和纠正。现在，你可以将这些功能视为数据链路层本身的显著特征。以下是
    OSI 网络模型第二层中一些常见的 MAC 协议：


    1. `802.3` 以太网协议

    2. `802.5` 令牌环协议

    3. `802.12` 100Base-VBG 协议

    4. `802.11` 无线协议

    5. `802.7` 宽带协议


    在所有 MAC 协议中，以太网和令牌环协议在计算机网络中最常见。


    # 第 3 层：网络层


    OSI 网络模型的第三层是网络层。这是执行大多数关键网络功能的层级。该层涉及多个功能，但我们只讨论对网络工作产生重大影响的主要方面。通常，网络层决定数据包从一个网络上的节点（点）传输到另一个网络上的终点（节点）的路径或路由路线。网络层的主要工作是定义数据包在网络与网络之间传输的路由。


    关于网络层中使用的协议，有多种，但其中最重要的是：


    * 互联网协议 (IP)

    * 互联网协议交换协议 (IPX)


    这些协议包含了指定数据包源路由和目的路由的信息。因此，每个使用这些协议的网络数据包都可以根据协议提供的路由信息告诉网络其目的地。在数据包到达目的地后，该协议还帮助接收计算机识别数据包的源地。网络层在
    OSI 模型中具有重要性，因为它定义了从单路由器或多路由器设置进行数据包的传输。


    在我们讨论这些层的更多细节之前，让我们也明确路由器设备的工作。路由器仅仅是一种设计用于以下功能的硬件：


    * 检查每个数据包

    * 通过分析源和目的地址信息，将数据包传输到预定目的地


    互联网是一个复杂的网络，在互联网上传输的数据包在到达目的地之前可能需要通过多个路由器。但在相对简单且较小的网络中，数据包可能只需要经过几个或一个路由器经过。在更深入地分析网络层时，一个有趣的点变得清晰明了。如果网络层与第一层（物理层）和第二层（数据链路层）分离，我们会发现这一层的协议可以独立于这两个底层层而运行。简单来说，我们可以在任何变体中使用这一层的协议，并有效地将其与下层层配合使用，而无需建立一种独立性链。例如，如果计算机在在前两层方面具有共性，那么
    `IP` 协议和 `IPX` 协议就可以在这两台计算机之间建立网络。如果我们把这个概念应用于现实场景，那么意味着使用 `IP` 协议的数据包可以通过以太网、令牌环甚至连接计算机的有线电缆进行传输。使用
    `IPX` 协议的数据包也是如此，前提是两台计算机都支持 `IPX` 协议并在底层层上具有共性。在这种情况下，就可以建立网络连接。


    # 第 4 层：传输层


    传输层主要关注的是协调不同层之间的数据移动。为了这一目的，传输层向上层屏蔽了底层的特征。除了这些，传输层的主要功能包括：


    * **流量控制**：引导发送设备和接收设备之间的数据传输，主要管理接收设备产生的数据流入。传输层确保接收设备不会超过其处理能力的数据。

    * **复用**：将物理通道划分为多个逻辑通道，使得多个设备或应用程序可以在一个物理通道（或链路）上传输数据。

    * **虚拟电路管理**：在网络中管理虚拟电路的建立、维护和终止。

    * **错误检查与恢复**：结合多种机制来识别数据传输错误并尝试纠正错误，例如向发送设备请求重发数据。


    如果我们讨论传输层的核心和功能，它本质上是处理从一个节点到另一个节点的信息流。与我们目前讨论的所有其他层一样，传输层与它们的区别在于，对于每个操作系统，传输层的实现是不同的。传输层具有许多重要的协议。在协议中，以下两种分别与
    `IP` 或 `IPX` 数据包连接使用：


    1. 传输控制协议 (TCP)；与互联网协议 (IP) 使用

    2. 序列包交换协议 (SPX)；与互联网协议交换协议 (IPX) 使用


    '
