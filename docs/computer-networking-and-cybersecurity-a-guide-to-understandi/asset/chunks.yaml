    The disaster recovery plan should cover the aspect of handling communication.
    If during a disaster, communication is not effectively planned, the people might
    not perform well at their jobs, and solving the crisis will be hampered. Communication
    planning can be started by writing down the list of people that should be informed
    about a problem, how to track the progress made toward resolving it, and the result.
    An example list is given here:


    *   Board of directors

    *   President or chief executive officer

    *   Vice presidents of respective areas

    *   Supervisors

    *   Employees dealing with the problem


    The next step includes deciding the notification that should be given to each
    person regarding the disaster recovery process. For instance, the board of directors
    may only need to be informed when the disaster progresses so much that it has
    a material effect on the performance of the company. But the supervisor and the
    employees directly affected by the problem need to be constantly notified about
    every development. After considering the list of people and what they need to
    be notified about, decide the way they will be notified. If you are the one directly
    involved in solving the problem, consider passing on the responsibility of notifying
    the required people to another person not too directly involved so you can finish
    the process of resolution soon. This task should be delegated to your department’s
    supervisor or an employee clear on the procedures required in communication. They
    should also have contact information such as home numbers, pager numbers, etc.
    if they must inform the person after working hours. Setting up a telephone tree
    will help to communicate with others quickly. The last task is to outline the
    order in which people are given the notification. This list depends on the company
    environment and the disaster, disregarding the organization chart of the company.


    ## 2. Planning Off-Site Storage


    Off-site storage is a method of protecting data by keeping it in back-up tapes
    in an off-site place if a physical disaster like a fire destroys the copies of
    data present on-site. Along with off-site storage of files, companies also provide
    standardized tape-storage practices that work on a rotation basis (most often
    weekly). The employee of the storage company visits the office and exchanges boxes
    by dropping one box of tapes and picking up the next set of tapes. The backup
    tapes are commonly contained in stainless steel boxes, and the duty of keeping
    these boxes locked and guarded is given to the network administrator. The decision
    as to which tapes to keep on-site and which to send off-site should be made carefully,
    like keeping the most recent backup tapes on-site and sending the older ones off-site.
    This is helpful, as you can keep the tapes you need daily close to you while reducing
    the exposure to disaster. Even if a disaster damages the server room and backup
    tapes, only the recent data will be destroyed, which does not amount to much loss.


    ## 3. Describing Critical Components


    The plan developed for disaster recovery should also include all the computer
    equipment and software needed to keep the operations running should the entire
    building be lost. The roughly estimated cost of this equipment and the method
    of obtaining it quickly must all be a part of this plan. Such a list will help
    reduce the time lost in resuming the business operations in a temporary facility.
    The insurance purchases made against business operations will also be estimated
    in the total end cost.


    ## 4. The Backup and Restore Features of Networks


    An inclusion that the disaster recovery plan for a network must have is the method
    of recovering the stored server data if it gets destroyed. One such method is
    establishing network backup and restore procedures. A network administrator should
    know the importance of keeping reliable backups of important data and the system
    itself. When a person works with computers, it doesn’t take long for them to notice
    the importance of keeping good backups, because computers can fail unexpectedly,
    making recovery of the data inside them impossible. Some files on the computer
    may also get deleted or corrupted due to an incident. If such cases occur, the
    company employees’ jobs depend on the quality of backups for the destroyed data
    and the restoration of that important data.


    ### Assessing Backup Needs


    essing the needs of a company’s backup and restoration process comes before making
    the backup procedures for a network. To complete the assessment of backup needs,
    consider these questions:


    *   How dynamic is the server data, and with what frequency and in what ways does
    this change?

    *   What is data that needs to be backed up, and what is the growth rate?

    *   How much time does it take to make the backup of the data? Avoid a situation
    where you back up terabytes of data on a system that can only handle megabytes
    per hour.

    *   How quickly can a partial or complete restoration of data be done? Most often,
    the restoration of data takes twice if backing up the same data, though there
    are cases where the backup and restoration time is equal. For example, if the
    entire server took ten hours for backup, then the restoration data would be somewhere
    between ten to twenty hours, excluding the time needed to deal with the problem
    that led to having to restore the data.

    *   How much consistency in the backup data is required? Are the data files required
    to be managed as one unit? For example, the restoration of word processing files
    need not be coherent and will not impact other files in the system. However, a
    collection of database files from a high-end database is useful only if the files
    can be restored from the set from the same point.

    *   What compromise can be made between cost and recoverability? A backup system
    designed to backup files every minute can create high confidence in the fact there
    is no loss of data even if some issue arises. Such high-end backup systems are
    required in banks. But the cost and administration of such backup systems are
    high, and most companies might turn to some cheap alternative with a low degree
    of recoverability such as backup at off-hours (usually at night). A company can
    assess what it needs and how much it will spend.

    *   How many extra levels of backup are required by the company? The backups are
    mostly in tapes that support servers that use `RAID` arrays. In this way, the
    second level of protection is the tapes. Sometimes, multiple copies of the tapes
    are required, and each copy of the tape has a backup. Maximum redundancy can proceed
    by copying backups and keeping them at an off-site via some network connection.


    When the assessment is to be made, the company’s senior management must be involved.
    On a minimum level, the findings can be presented for seeking the agreement or
    input of the management.


    ### Acquiring Backup Media and Technologies


    These factors should be considered when a backup system (hardware and media) is
    being chosen.


    *   Reliability

    *   Cost

    *   Capacity of storage

    *   Probable restoration frequency

    *   Fitting an entire backup into a single media

