    1. 它是一台基于 Intel 处理器的计算机。

    2. 它通常运行基于微软 Windows 的操作系统。

    3. 安装的操作系统包含 `NIC` 和网络客户端软件（这使得网络客户端工作站能够与网络进行通信）。


    在上述提到的特性中，我们说网络客户端工作站通常运行 Windows 版本作为主操作系统。但这里的关键词是“通常”。在某些情况下，网络工作站使用 Windows
    以外的操作系统。这些计算机具有硬件和软件，允许即使操作系统不同，工作站也能参与网络活动。例如，苹果的 Macintosh 和基于 Unix 的计算机也可以作为网络工作站。


    ## 利用网络流量和了解网络硬件


    在本章的早些章节中，我们讨论了每个网络设置中涉及的硬件组件。我们还学习了网络中每个组件的作用。在这一节中，我们将更进一步，讨论硬件在引导网络流量方向的实际功能。在任何网络设计中，测试其能力最根本、最基础的方法是看网络如何多有效地在节点与节点之间引导网络流量。这项测试决定了设计的网络是否足够好，或者是否性能不足。要执行此测试，首要要求是将网络硬件组件置于配置中，允许网络通过连接的硬件组件高效地发送信号。这是在考虑网络类型和连接前提条件的情况下完成的。在本节中，我们将讨论以下基础网络硬件组件。


    * `Repeaters`（中继器）：这些设备延长相应网络类型中网络流量的传输距离。

    * `Hubs`（集线器）或集中器：这些设备用于建立星型拓扑的网络。`Hubs` 连接不同的节点。

    * `Bridges`（桥）：这些设备与中继器相同但更智能。`Bridges` 将网络流量引导到不同的段。这样做是为了只有当流量的目标确实是另一个段时才执行分段。

    * `Routers`（路由器）：这些设备只需有效、高效地路由网络流量。

    * `Switches`（交换机）：这些设备为其他连接的网络硬件提供快速高效的点对点连接。


    ### Repeaters（中继器）


    在网络中用于延长网络范围的硬件设备被称为 `repeater`。`Repeaters` 通过放大信号来扩展网络的覆盖范围。每当安装网络时，总会有网络信号微弱的地方。`repeater`
    会接入网络信号微弱的一侧，放大这个弱信号，然后从另一侧发送出去。`Repeaters` 最常用于范围有限的网络，如细以太网网络。因此你将在此类网络设置中使用
    `repeaters`。然而，这并不意味着使用 `repeaters` 受到限制。但 `repeaters` 几乎可以用于任何网络连接。例如，考虑使用 `Cat-5`
    网线安装的典型 `100Base-T` 网络。这种电缆的最大长度为一百米，这意味着这就是网络的范围。通过在这一网络设置中使用 `repeater`，我们可以将网络信号的范围翻倍到两百米。从
    OSI 网络模型来说，运行 `repeaters` 是第一层的过程，即物理层。`repeater` 设备并不智能。这意味着 `repeater` 并不具备理解其正在传输的信号的硬件能力。由于
    `repeater` 的唯一工作是执行网络信号放大，因此需要谨慎地使用。`repeater` 不会区分网络信号和干扰信号（通常称为“噪声”）。这就是为什么它们应该在对网络进行仔细评估后才使用。否则，`repeater`
    可能会放大网络中的噪声。`Repeaters` 不能连接不同的网络介质。例如，如果 `repeater` 用于 `10Base-2` 细以太网网络，那么它只能与另一个
    `10Base-2` 细以太网连接。如果我们批判性地分析 `repeater` 的智能性，会发现它确实某种智能功能；尽管如此，这不足以执行复杂的操作，例如区分正在传输的信号类型。`repeater`
    的智能程度在于当设备检测到连接网络中的任何问题或异常时，将一个连接与其他连接分离的能力。例如，假设我们正在处理细以太网网络的两个段。这两个段由一个 `repeater`
    设备连接。如果这两个段发生断开，`repeater` 将允许功能正常的段继续工作，而不是关闭整个网络。通过这种方式，网络用户可以访问仍然正常工作的网络段上的资源，但将无法访问断开段上的资源。然而，这里需要的一的一是，即使
    `repeater` 将工作段与断开段隔离开，如果服务器等主要资源位于断开段上，它将是徒劳的。这是因为即使工作站位于功能段，它们也无法访问服务器的主要网络资源。下图显示了一个扩展网络长度的典型中继设置。


    ![](img/Image00004.jpg)


    ### Hubs（集线器）


    `Hubs` 广 own 称为：

    * 智能局域网集中器

    * 集中器


    这种硬件设备用于网络设置，将节点连接到骨干上。如果我们讨论使用 `hubs` 的网络拓扑，我们可以看到节点以星形形状连接到 `hub`。这意味着连接到 `hub`
    的网络电缆扇布到每个相应的节点。无论是在星型拓扑网络还是环形拓扑网络中使用 `hub`，这种电缆的布置都保持不变。在较小的网络中，不需要骨干交换机，因此不需要
    `hub`。然而，`hubs` 可以用于简单网络也可以用于大型复杂网络。关于 `hubs` 与网络介质类型的兼容性，幸运的是，它们提供了无缝的兼容性。这意味着
    `hub` 可以用于任何网络，而无需担心兼容性问题。如果我们进一步查看 `hubs` 的高端顶端型号，我们会发现它们具有一个可更换的模块，通过该模块，单个
    `hub` 可以支持多种网络介质类型。例如，高端 `hub` 模型可以同时支持 `Ethernet`（以太网）和 `Token-ring`（令牌环）网络模块。`Hubs`
    有许多尺寸。某些 `hubs` 支持多达 2 个工作站，而另一些则支持一百多个工作站。这完全取决于网络的需求。以下是 `hub` 的几个重要特性：


    * 就像从一个源产生的声音在洞穴深处回声一样，`hub` 将其每个端口的数据都回声到所有其他相应的端口。尽管 `hubs` 的布线布局是星星的，但它们的逻辑功能更类似于总线拓扑。然而，由于数据的回声，任何逻辑或过滤过程无法阻止源自连接节点的数据包冲突。


    '
