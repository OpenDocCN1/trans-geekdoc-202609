- raw: 'Chapter Five: Recovering from Ransomware In recent years, you may have heard
    of the term Ransomware in your office or on the news. What is the fuss all about?
    Perhaps you received a pop-up on your computer screen saying your system is infected
    by ransomware. This chapter sheds light on what ransomware is, its types, a little
    history, and what you should do to protect your systems. Defining Ransomware Ransomware
    is the conjunction of the words ransom and malware. It is malware that infects
    your computer and encrypts all the data on it, restricting you from accessing
    it. It then demands a ransom payment if you wish to access all the data again.
    Ransomware first featured in the 1980s and payments were demanded via snail mail.
    Today, ransomware is much more evolved, and hackers demand payments via credit
    cards or cryptocurrency. How Can You Get Infected? Attackers can use ransomware
    in different ways to infect your system. A common way to do this is to fill your
    inbox or desktop with malicious spam, also known as malspam, where the medium
    used to deliver spam is an email. The email contains malicious attachments, such
    as word documents or PDF files, or even hyperlinks to third party websites. The
    malspam method employs social engineering tactics to make people believe the email
    and its attachments are genuine. The hacker does this by making them appear as
    if they come from a trusted source. Attackers also use social engineering in ransomware
    attacks where they pose to be the FBI to scare users and make them pay to access
    their files. Malvertising is another popular ransomware infection method that
    peaked around 2016. As the name suggests, malvertising employs the method of online
    advertising to spread ransomware. This type of ransomware did not interact too
    much with the users. Even today, you may come across websites filled with ads
    that redirect you to third-party websites without your permission. These third-party
    websites are kept to log all your activities and information. They then deploy
    malware on your computer. Most often, this malware turns out to be ransomware.
    Malvertising makes use of a technology called iframe that has malware hidden in
    invisible HTML elements. This iframe will redirect you to a malicious website,
    and the malware will be conveniently deployed to your computer from this website
    through an exploit kit. This process is called a drive-by-download process as
    everything happens without the user knowing what is happening. Types of Ransomware
    Ransomware is classified into three types based on their severity. Scareware Scareware
    is ransomware used to carry out tech support scams on old security software. You
    may receive pop-ups on your device asking you to download some information from
    a website. The pop-up may say there is a virus on your system, so you do exactly
    what the pop-up says, and find that your system is infected with a virus. If you
    ignore the message, several other pop-ups follow. However, your files will still
    be safe. If you have an anti-malware solution from a genuine provider, run it
    and see if there is some virus on your system. If you do not have an anti-malware
    solution on your computer, download one immediately before you resort to downloading
    anything from the link they share with you. In this case, the attacker is bluffing
    and trying to scare you in the hopes you fall for the trap. Screen Lockers This
    type of ransomware is an orange-level or medium type of ransomware. As the name
    suggests, this form of ransomware locks the target user out of their system. When
    the user tries to unlock the system, they can only see the US Department of Justice’s
    logo or the FBI’s logo. The message on the screen may say that they were caught
    doing something illegal, and therefore, must pay a fine. Firstly, it is important
    to know that any law institution will not lock you out of your computer or ask
    for a payment. If the FBI suspects you, they will contact you directly via legal
    channels. If you find yourself in a situation where your screen is locked and
    you cannot enter the system without making a payment, your system has been hacked.
    Encryption Ransomware This is the most dangerous form of ransomware because an
    attacker deploys encryption ransomware onto the victim’s system and encrypts all
    the files so the victim cannot access them. They then demand a payment to decrypt
    all the files to the original state again. It is considered the most threatening
    form of ransomware due to how difficult it is to decrypt files once encrypted—since
    no software can decrypt all forms of encryption. It is best to assume those files
    are lost unless you want to pay the ransom. There is no guarantee that you will
    get your files even after payment. Ransomware History The first occurrence of
    ransomware was in the 1980s, and it was called AIDS or PC Cyborg. This ransomware
    encrypted all files of a user present in the C: directory every time the user
    restarted the system. The ransomware collected all the files after 90 such reboots
    and then would send the user an email asking them to renew the license to the
    operating system. They may ask them to pay $189 to PC Cyborg Corporation. It was
    a very simple encryption technology, and therefore, was easy to reverse. Thus,
    users from the computer science industry knew how to reverse it, but it majorly
    impacted common people who were not so tech savvy. Over the next ten years, a
    few other variants appeared, but dangerous ransomware did not make a debut until
    2004. This was the year when GpCode took advantage of weak RSA encryption to encrypt
    user files. The next big ransomware showed up in 2007 when WinLock was introduced.
    Unlike other ransomware, WinLock did not encrypt user files but locked a user
    out of their system. It also showed pornographic images on the user screen. The
    attackers would then demand payment via SMS to grant the users access to their
    systems. Ransomware evolved in 2012 with the development of the ransom family
    called Reveton. This gave birth to another type of ransomware known as law enforcement
    ransomware. Attackers locked people out of their systems and left the FBI’s official
    logo or any other law enforcement agency’s on the lock screen. There would be
    a statement saying you committed a crime, such as downloading pirated content,
    hacking, or watching pornographic content on the screen. They would also imply
    to the target that they must pay a fine ranging from $100 to $3,000 using a prepaid
    cash card. Some people did not understand this, and they believed they had broken
    the law, and therefore, had to pay a fine. This is a social engineering tactic
    called “implied guilt,” where a user questions his or her actions. They don’t
    want to be called out publicly for an activity like watching porn, which they
    believe is a crime, and so prefer paying the ransom to end it immediately. Encryption
    ransomware resurfaced in 2013 with CryptoLocker but was far more dangerous. The
    CryptoLocker ransomware employed military level encryption, and the hacker would
    store the decryption key on a remote server. There was no way for users to retrieve
    their files without paying a ransom. This type of ransomware is even present today,
    and some cyberattackers are still making money off it. The recent ransomware outbreaks
    such as Petya and WannaCry in 2017 also made use of similar encryption techniques.
    As 2018 came to an end, another ransomware called Ryuk was developed by skilled
    hackers, and this created trouble for news publications in America, especially
    the Onslow Water and Sewer Authority in North Carolina. This ransomware attack
    was planned, so the attackers could first infect the target systems using information-stealing
    Trojans called TrickBot and Emotet. They would then use this information to install
    Ryuk and other ransomware in the system. Cybersecurity experts believe that hackers
    used TrickBot and Emotet to target high-profile business people. These Trojans
    infected random systems and deployed Ryuk once they identified that the target
    system belonged to a high-profile businessman, and the attacker could make a lot
    of money. Coming to the present day, a new type of ransomware called Sodinokibi,
    known to be an evolution of GandCrab, has been making news. The attackers use
    managed service providers to spread this ransomware. In August 2019, several dental
    care centers lost large volumes of data, and hospitals were unable to obtain records
    of their patients. The attackers used a compromised manager service provider to
    upstream the ransomware to 400 dental care centers. Who are Targets of a Ransomware
    Attack? When ransomware was invented, the primary victims of it were individuals
    who were regular computer users. Attackers realized later that ransomware had
    more potential, especially when they began to target businesses. When an attacker
    used ransomware to attack a business, they ensured they could stop the production,
    and create a loss in data and revenue. Attackers soon realized that attacking
    a business would fetch more money than attacking regular users. At the end of
    2016, statistics showed that ransomware was detected on roughly thirteen percent
    of global businesses and only two percent of regular users’ computers. By 2017,
    almost 35 percent of small and medium-sized businesses were already victims of
    ransomware. Geographically speaking, attackers deploy ransomware mostly on western
    markets, and the United Kingdom, the United States, and Canada are their biggest
    targets. Research shows that ransomware attackers always choose businesses and
    countries with more money. This means they look for regions where computer and
    Internet adoption rates are high, and the region is wealthy. It is believed that
    they will target the Asian and South American markets very soon, too, as these
    regions are picking up in terms of economic growth. What to Do If You Are Infected
    The thumb rule to follow if you are a victim of ransomware is never to pay the
    ransom. Even the FBI encourages you not to pay. If you pay the ransom, you end
    up doing what the attacker wants you to do. Therefore, you may encourage them
    to continue plotting ransomware attacks for the future. There is a small probability
    that you may get some of your files back using free file decryption software.
    However, there are only some ransomware attacks that these tools can reverse or
    prevent. Also, if a decryptor is available, you must ensure it helps to protect
    the system from ransomware already present on your system. It is advisable not
    to run any decryption software without knowledge as you may just end up encrypting
    your files even more. It is also important to look closely at the ransom message
    that appears or seek help from an IT security consultant. Other known methods
    for cleaning ransomware include anti-ransomware products to scan your system and
    remove the infection. These solutions may not help you retrieve your files but
    clean your system. In cases of a screen locker, try to restore the system to a
    previous health point or try running a scan from a bootable USB drive or DVD.
    If you want to defeat a ransomware attack while it is in progress, you must stay
    alert at all times. If you notice slowness in your system for no reason, it is
    best to restart the system and disconnect the Internet. This ensures that the
    malware is inactive when you boot the system. It also cannot send or receive instructions
    from the commanding server or attacker. This means that since the attacker has
    not completed the activity, they cannot have encrypted all files in the system,
    and thus, cannot demand money. At this point, you must install an anti-malware
    solution and run a complete scan of your system. How Do You Protect Yourself from
    Ransomware? Most security experts worldwide have one thing to say when it comes
    to protecting your system from ransomware—they ask you to prevent the attack from
    happening. There are a few methods to tackle a ransomware infection, but there
    is no evidence that they work. Most of them also require high-level technical
    expertise, and an average user may not be ready for such tools. Therefore, it
    is suggested that you follow the remedies below. The first step is to purchase
    a paid anti-malware solution that provides real-time protection. This solution
    can also detect attacks from advanced ransomware. The solution should also be
    capable of protecting vulnerable files and software while also blocking ransomware
    from encrypting any files. One such solution is the paid version of Malwarebytes,
    which protected users from all types of major ransomware attacks in 2017. The
    next step takes time and effort. You must regularly create backups of your data
    and store it on external media. Experts recommend that you store backups on a
    cloud-based solution that is protected via encryption and multiple-factor authorization.
    Another option is to store the backups on external media like USB drives or hard
    disks. However, ensure you disconnect them after you take the backup. Otherwise,
    there is high chance ransomware may infect these external devices too. The next
    step is to ensure your operating system and other software is up to date. The
    popular WannaCry ransomware exploited a vulnerability in the Microsoft operating
    system. Microsoft released an update in March 2017 to patch the vulnerability,
    but most people ignored this update and did not download it. This left their systems
    open to an attack. It is understood that manually updating the operating system
    and other software is difficult, and therefore, it is best to enable automatic
    updates for the operating system and other software. Finally, it is best to stay
    informed. The most common technique used by an attacker to deploy ransomware is
    social engineering. Educate yourself and your employees about how to detect malicious
    websites, malspam, and other harmful media. Always trust your instincts. If something
    seems harmful, it probably is. How Does Ransomware Affect a Business? Many businesses
    have been hit hard in the past few years by different types of ransomware, such
    as WannaCry, SamSam, GandCrab, and NotPetya. The number of ransomware attacks
    on businesses increased by 88 percent in the second half of 2018 as attackers
    stopped attacks on computers and normal users’ systems. Attackers understood that
    they could earn more when they attack big businesses, such as government agencies,
    hospitals, and other commercial institutions. The average damage done by ransomware,
