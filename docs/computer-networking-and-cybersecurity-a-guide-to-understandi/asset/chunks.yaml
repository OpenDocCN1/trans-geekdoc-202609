- raw: "1.  It is an Intel-based computer \n\n2.  It is usually running a Microsoft\
    \ Windows-based operating system \n\n3.  The install Operating System includes\
    \ NIC and network client software (this enables the network client workstation\
    \ to communicate with the network) \n\nIn the features mentioned above, we said\
    \ that a network client workstation usually runs a version of Windows as the main\
    \ OS. But the keyword here is ‘usually.’ There are cases where network workstations\
    \ use an operating system other than Windows. Such computers have the hardware\
    \ and software to allow the workstation to participate on the network even if\
    \ the operating system is different. For example, Apple’s Macintosh and Unix-based\
    \ computers can also be used as network workstations. Utilizing the Network Traffic\
    \ and Knowing the Network Hardware In the earlier sections of this chapter, we\
    \ discussed the hardware components involved in every network setup. We also learned\
    \ about the purpose of each component in a network. In this section, we will go\
    \ a step further and discuss the actual functionality of the hardware in directing\
    \ network traffic. In any network design, the very fundamental and basic approach\
    \ to test its capability is to see how effectively the network can direct the\
    \ network traffic from node to node. This test determines if the designed network\
    \ is good enough or if it is underperforming. To perform this test, the first\
    \ requirement is to put the network hardware components in a configuration that\
    \ allows the network to send signals through the connected hardware components\
    \ efficiently. This is done while keeping the type and connectivity pre-requisites\
    \ of the network under consideration. In this section, we will discuss the following\
    \ basic networking hardware components. \n\n*   Repeaters : These devices lengthen\
    \ the traveling distance of the network traffic in the corresponding network type.\
    \ \n\n*   Hubs or Concentrators : These devices are used when setting up a network\
    \ with a star topology. Hubs connect the different nodes. \n\n*   Bridges : These\
    \ devices are the same as repeaters but more intelligent. Bridges direct network\
    \ traffic to different segments. This is done so the segmentation is only performed\
    \ if the traffic’s destination is actually the other segment itself. \n\n*   Routers\
    \ : These devices simply route the network traffic effectively and efficiently.\
    \ \n\n*   Switches : These devices serve as a quick and efficient point-to-point\
    \ connection for the other connected network hardware. \n\nRepeaters A hardware\
    \ device used in a network to lengthen the range of the network is called a repeater.\
    \ Repeaters extend the network’s reach by boosting the signals. Whenever a network\
    \ is installed, it is a given there will be places where the network signal is\
    \ weak. The repeater will take this network’s side where the signal is weak, boost\
    \ this weak signal, and then send it out through the other side. Repeaters are\
    \ most commonly used for networks with a limited range, such as thin Ethernet\
    \ networks. Hence you will see the use of repeaters in such network setups. However,\
    \ this does not mean that using repeaters is limited. But repeaters can be used\
    \ for virtually any network connection. For example, consider a typical 100Base-T\
    \ network installed using Cat-5 network cables. The maximum length of this cable\
    \ is one hundred meters, meaning that’s the range of the network. By using a repeater\
    \ in this network setup, we can double the range of the network signal to two\
    \ hundred meters. In terms of the OSI networking model, operating repeaters is\
    \ a process in the first layer, i.e., the physical layer. A repeater device is\
    \ not intelligent. This means that a repeater does not have the hardware capability\
    \ to understand the signals it is transmitting. Since the only job of the repeater\
    \ is to perform a network signal amplification it needs to be used carefully.\
    \ A repeater will not discern between a network signal and an interference signal\
    \ (usually called “noise”). This is why they should be used only after careful\
    \ assessment of the network. Otherwise, a repeater might amplify the noise in\
    \ the network. Repeaters cannot be used to connect different network mediums.\
    \ For instance, if a repeater is being used with a 10Base-2 Thin Ethernet network,\
    \ then it can be connected only with another 10Base-2 Thin Ethernet network. If\
    \ we critically analyze the intelligence of a repeater, then we can find it does\
    \ possess a slight hint of intelligent functionality; nevertheless, this is not\
    \ enough to perform complex operations such as discerning between the signal types\
    \ being transmitted. The extent of the intelligent functionality of a repeater\
    \ device is the ability to separate a connection from the others when the device\
    \ detects any problem or anomaly in the connected network. For instance, let’s\
    \ consider that we are dealing with two segments of a thin ethernet network. These\
    \ two segments are connected by a repeater device. If these two segments become\
    \ broken, then instead of shutting down the entire network, the repeater will\
    \ still allow the functional segment to keep on working. In this way, the users\
    \ of the network can access the resources on the network segment still functional\
    \ but won’t have access to the resources on the broken segment. However, one thing\
    \ to note here is that even if the repeater does separate the working segment\
    \ from the broken segment, if the main resources such as the servers are on the\
    \ broken segment, it will be useless. This is because even if the workstations\
    \ were on the functional segment, they won’t be able to access the main networking\
    \ resources of the server. The figure shown below depicts a typical repeater setup\
    \ extending the length of the network. ![](Image00004.jpg)Hubs (Concentrators)\
    \ Hubs are known by these terms: \n\n*   Intelligent LAN concentrators \n\n* \
    \  Concentrators \n\nThis hardware device is used in a network setup to connect\
    \ the nodes to the backbones. If we discuss the topology of the network where\
    \ hubs are being used, we can see that the nodes are connected to the hub in a\
    \ star-like shape. This means that the network cables connected to the hub fan\
    \ out to each corresponding node. This arrangement of the cables remains the same,\
    \ whether a hub is being used in a star topology or a ring topology network. In\
    \ smaller networks, there is no need for backbone switches, and hence, there is\
    \ no need for a hub. However, hubs can be used in simple networks and large complex\
    \ networks. Regarding the compatibility of hubs with the network media types,\
    \ fortunately, they offer seamless compatibility. This means that a hub can be\
    \ used with any network without worrying about compatibility issues. If we go\
    \ further and look at the top shelf higher-end models of hubs, we will see they\
    \ feature a replaceable module through which a single hub can support multiple\
    \ network media types. For example, a high-end hub model can support both Ethernet\
    \ and Token-ring network modules. Hubs come in many sizes. Some hubs offer support\
    \ for up to 2 workstations while others for more than a hundred workstations.\
    \ It all depends on the needs of the network. Here are a few important characteristics\
    \ of a hub. \n\n*   Just as how a sound from one source echoes in the farther\
    \ depths of a cave, a hub echoes the data from each of its ports to all the other\
    \ corresponding ports. Even though the wired arrangement of hubs is star-styled,\
    \ their logical functioning is more akin to that of bus topology. However, due\
    \ to the echoing of the data, no logic or filtering process can stop data packet\
    \ collisions originating from the connected nodes. "
  fmt: "\n1. It is an Intel-based computer.\n2. It is usually running a Microsoft\
    \ Windows-based operating system.\n3. The install Operating System includes `NIC`\
    \ and network client software (this enables the network client workstation to\
    \ communicate with the network).\n\nIn the features mentioned above, we said that\
    \ a network client workstation usually runs a version of Windows as the main OS.\
    \ But the keyword here is ‘usually.’ There are cases where network workstations\
    \ use an operating system other than Windows. Such computers have the hardware\
    \ and software to allow the workstation to participate on the network even if\
    \ the operating system is different. For example, Apple’s Macintosh and Unix-based\
    \ computers can also be used as network workstations. \n\n## Utilizing the Network\
    \ Traffic and Knowing the Network Hardware\n\nIn the earlier sections of this\
    \ chapter, we discussed the hardware components involved in every network setup.\
    \ We also learned about the purpose of each component in a network. In this section,\
    \ we will go a step further and discuss the actual functionality of the hardware\
    \ in directing network traffic. In any network design, the very fundamental and\
    \ basic approach to test its capability is to see how effectively the network\
    \ can direct the network traffic from node to node. This test determines if the\
    \ designed network is good enough or if it is underperforming. To perform this\
    \ test, the first requirement is to put the network hardware components in a configuration\
    \ that allows the network to send signals through the connected hardware components\
    \ efficiently. This is done while keeping the type and connectivity pre-requisites\
    \ of the network under consideration. In this section, we will discuss the following\
    \ basic networking hardware components.\n\n* `Repeaters`: These devices lengthen\
    \ the traveling distance of the network traffic in the corresponding network type.\n\
    * `Hubs` or Concentrators: These devices are used when setting up a network with\
    \ a star topology. `Hubs` connect the different nodes.\n* `Bridges`: These devices\
    \ are the same as repeaters but more intelligent. `Bridges` direct network traffic\
    \ to different segments. This is done so the segmentation is only performed if\
    \ the traffic’s destination is actually the other segment itself.\n* `Routers`:\
    \ These devices simply route the network traffic effectively and efficiently.\n\
    * `Switches`: These devices serve as a quick and efficient point-to-point connection\
    \ for the other connected network hardware.\n\n### Repeaters\n\nA hardware device\
    \ used in a network to lengthen the range of the network is called a `repeater`.\
    \ `Repeaters` extend the network’s reach by boosting the signals. Whenever a network\
    \ is installed, it is a given there will be places where the network signal is\
    \ weak. The `repeater` will take this network’s side where the signal is weak,\
    \ boost this weak signal, and then send it out through the other side. `Repeaters`\
    \ are most commonly used for networks with a limited range, such as thin Ethernet\
    \ networks. Hence you will see the use of `repeaters` in such network setups.\
    \ However, this does not mean that using `repeaters` is limited. But `repeaters`\
    \ can be used for virtually any network connection. For example, consider a typical\
    \ `100Base-T` network installed using `Cat-5` network cables. The maximum length\
    \ of this cable is one hundred meters, meaning that’s the range of the network.\
    \ By using a `repeater` in this network setup, we can double the range of the\
    \ network signal to two hundred meters. In terms of the OSI networking model,\
    \ operating `repeaters` is a process in the first layer, i.e., the physical layer.\
    \ A `repeater` device is not intelligent. This means that a `repeater` does not\
    \ have the hardware capability to understand the signals it is transmitting. Since\
    \ the only job of the `repeater` is to perform a network signal amplification\
    \ it needs to be used carefully. A `repeater` will not discern between a network\
    \ signal and an interference signal (usually called “noise”). This is why they\
    \ should be used only after careful assessment of the network. Otherwise, a `repeater`\
    \ might amplify the noise in the network. `Repeaters` cannot be used to connect\
    \ different network mediums. For instance, if a `repeater` is being used with\
    \ a `10Base-2` Thin Ethernet network, then it can be connected only with another\
    \ `10Base-2` Thin Ethernet network. If we critically analyze the intelligence\
    \ of a `repeater`, then we can find it does possess a slight hint of intelligent\
    \ functionality; nevertheless, this is not enough to perform complex operations\
    \ such as discerning between the signal types being transmitted. The extent of\
    \ the intelligent functionality of a `repeater` device is the ability to separate\
    \ a connection from the others when the device detects any problem or anomaly\
    \ in the connected network. For instance, let’s consider that we are dealing with\
    \ two segments of a thin ethernet network. These two segments are connected by\
    \ a `repeater` device. If these two segments become broken, then instead of shutting\
    \ down the entire network, the `repeater` will still allow the functional segment\
    \ to keep on working. In this way, the users of the network can access the resources\
    \ on the network segment still functional but won’t have access to the resources\
    \ on the broken segment. However, one thing to note here is that even if the `repeater`\
    \ separates the working segment from the broken segment, if the main resources\
    \ such as the servers are on the broken segment, it will be useless. This is because\
    \ even if the workstations were on the functional segment, they won’t be able\
    \ to access the main networking resources of the server. The figure shown below\
    \ depicts a typical repeater setup extending the length of the network.\n\n![](Image00004.jpg)\n\
    \n### Hubs (Concentrators)\n\n`Hubs` are known by these terms:\n* Intelligent\
    \ LAN concentrators\n* Concentrators\n\nThis hardware device is used in a network\
    \ setup to connect the nodes to the backbones. If we discuss the topology of the\
    \ network where `hubs` are being used, we can see that the nodes are connected\
    \ to the `hub` in a star-like shape. This means that the network cables connected\
    \ to the `hub` fan out to each corresponding node. This arrangement of the cables\
    \ remains the same, whether a `hub` is being used in a star topology or a ring\
    \ topology network. In smaller networks, there is no need for backbone switches,\
    \ and hence, there is no need for a `hub`. However, `hubs` can be used in simple\
    \ networks and large complex networks. Regarding the compatibility of `hubs` with\
    \ the network media types, fortunately, they offer seamless compatibility. This\
    \ means that a `hub` can be used with any network without worrying about compatibility\
    \ issues. If we go further and look at the top shelf higher-end models of `hubs`,\
    \ we will see they feature a replaceable module through which a single `hub` can\
    \ support multiple network media types. For example, a high-end `hub` model can\
    \ support both `Ethernet` and `Token-ring` network modules. `Hubs` come in many\
    \ sizes. Some `hubs` offer support for up to 2 workstations while others for more\
    \ than a hundred workstations. It all depends on the needs of the network. Here\
    \ are a few important characteristics of a `hub`:\n\n* Just as how a sound from\
    \ one source echoes in the farther depths of a cave, a `hub` echoes the data from\
    \ each of its ports to all the other corresponding ports. Even though the wired\
    \ arrangement of `hubs` is star-styled, their logical functioning is more akin\
    \ to that of bus topology. However, due to the echoing of the data, no logic or\
    \ filtering process can stop data packet collisions originating from the connected\
    \ nodes.\n"
