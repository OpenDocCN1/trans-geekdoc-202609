    # 第 5 层：会话层


    OSI 网络模型的第五层是会话层。通过这一层，模型可以定义两台计算机之间建立的连接，无论是客户端-服务器连接还是对等连接关系。“会话”（session）一词被用于描述计算机之间的这种虚拟网络连接。由于
    OSI 模型第五层的主要关注点这些连接，因此被命名为“会话层”。两台计算机之间建立网络连接被称为“会话”的原因是，一旦连接建立，它就会持续一段时间。一个会话基本上涉及已连接的客户端与主机之间进行的谈判。以下列出了谈判过程中的关注点：


    *   流量控制

    *   事务处理

    *   用户信息传输

    *   网络身份认证


    # 第 6 层：表示层


    作为高层层之一，表示层主要关注如何以系统可以理解的形式呈现数据。OSI 网络模型的表示层负责收集由低层级提供的所有数据，然后将其转换为系统可以使用的格式。尽管“表示”（Presentation）这个名称可能具有误导性，但将数据交付得易于系统理解，与系统将数据呈现得易于用户理解同样重要。表示层执行以下功能：


    1. 数据压缩

    2. 数据解压缩

    3. 数据加密

    4. 数据解密


    由此我们可以得出结论，表示层的主要关注点是数据。


    # 第 7 层：应用层


    OSI 网络模型中最后一层也是最高层级是应用层。如果我们分析网络中每一层与其相应元素交互的性质，就会发现一种稳定的模式。OSI 网络模型中的层级从与网络内的物理元素开始交互，例如路由器、网络电缆等。从这里开始，各层转向与虚拟特征和元素交互，即向着网络的智能化方向发展。之后，OSI
    模型对网络虚拟方面的关注转向了计算机机器本身在网络中的参与度，这在最后两层（表示层和应用层）中显而易见。沿着这个思路，我们可以理解 OSI 网络模型中应用层的目的以及涉及计算机的网络的整体工作机制。通过这种方式，我们可以以更详细、更全面的方式分析网络。现在让我们来看看应用层到底是什么。应用层的主要关注点是控制和协调网络与操作系统以及安装在该操作系统上的应用程序之间的交互。它定义了应用程序如何处理系统在连接到网络时所参与的通信。符合应用层定义的软件示例包括：


    *   Microsoft 网络的 Windows 客户端

    *   Novell 网络的 Windows 客户端


    此类软件通常用计算机网络中的网络客户端应用。然而，数据在 OSI 网络模型中的传输并非仅向一个方向。当计算机处于网络接收端时，数据可以向上 OSI 模型移动；而当计算机通过网络传输数据时，数据可以向下
    OSI 模型移动。


    # 第 7 章：网络安全、网络安全与黑客方法


    本章侧重于网络安全和恢复的基础知识。网络安全起着至关重要的作用吗？内部安全使网络免受内部威胁成为，而内部威胁比外部威胁更常见。内部用户通过以下方式对网络造成威胁：


    *   访问薪资记录

    *   获取另一个用户的访问权限

    *   冒充另一个用户

    *   进入系统

    *   无意或故意让病毒进入系统

    *   发现用户账户及其密码


    这些内部威胁必须通过对网络的尽职管理来消除。


    ## 账户安全


    在账户安全中，通过执行各种任务来管理用户账户。为了确保不存在安全漏洞，管理账户员应经常对其进行审计。账户管理需要以下步骤：


    *   应立即删除标记为 `Guest` 的启动用户账户。

    *   不应创建用于测试的账户，如 `Test`、`Generic` 等，因为这些账户是黑客经常攻击的目标。

    *   操作系统为管理员账户分配一个默认名称。在 Windows 中可能名为 `Administrator`，在 NetWare 中可能名为 `Supervisor/Admin`。尽快更改此名称以避免针对账户的攻击。

    *   了解如何从任何用户账户移除对网络资源的访问权限，并验证包含安全系统的网络资源。


    例如，操作系统和数据库服务器或会计系统等特定应用程序处理账户的管理。某些系统在用户注销之前拒绝禁用或删除账户的访问，这会威胁安全。必须发现系统是如何管理删除账户的。


    *   建立信任关系并与人力资源（HR）部门的相关人员密切合作，对于维护适当的安全至关重要。通过与 HR 合作，你可以处理与员工离开的安全问题，并为影响 IT
    的变更制作清单。HR 部门可能不会提前通知，但你必须立即获知终止情况以便及时采取措施。

    *   尝试为新用户提供一个程序，让他们可以在其中提交权限，并由主管审核和签字。这一步骤消除了这些用户获取敏感信息的可能性。


    ## 密码安全


    密码安全是账户安全的一个重要方面，它允许你设置策略来控制系统强制用户更改密码的时间范围、密码的复杂性和长度以及旧密码是否可以重复。密码安全策略至少包含以下建议：


    *   通过网络密码策略设置，确保用户每 90 到 180 天更改一次主网络密码。尽管建议为 30 天，但在某些环境中这被认为太频繁。

    *   `Reuse policy` 应防止用户在至少一年内重复旧密码。


