    ## Back-door Threats


    Problems and bugs existing in the network operating system or some other part
    of the network infrastructure (such as routers) are the main cause of back-door
    threats. Security holes are one problem that persists in all network operating
    systems and components. It may be effectively dealt with by staying updated with
    the software and security-related patches as they are released, and reviewing
    new information related to the security holes.


    Web servers should be made secure in these ways:


