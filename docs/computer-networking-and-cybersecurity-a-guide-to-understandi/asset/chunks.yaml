- raw: "Routers Continuing the chain of intelligent iterations of the other hardware\
    \ components of a network, a router is basically a bridge, but even more intelligent,\
    \ just as a bridge is an intelligent version of a repeater. Just as bridges operate\
    \ at one layer higher (at the data-link layer) in the OSI networking model than\
    \ repeaters, routers operate at the third layer of the OSI networking model, also\
    \ known as the network layer. Routers are more efficient and far better than bridges\
    \ for transmitting data packets to their respective destinations. Since the operation\
    \ of the router is at the third layer of the OSI networking model, the only requirement\
    \ for the upper layers of the OSI model to establish a connection with the router\
    \ is that of using the same protocols. If the router is configured and designed\
    \ specifically for protocol translation, then it can translate any protocol from\
    \ the first three layers (physical, datalink and network layers) to any other\
    \ protocol also a part of these three layers. A router can also connect two networks\
    \ that have no similarity to each other (while connecting similar networks is\
    \ a given). Generally, routers are best suited and commonly used for Wide Area\
    \ Networks (WAN) as they can effectively create the links required for this network\
    \ to be established. If we analyze the characteristics of the router which allow\
    \ it to effectively connect two similar or dissimilar networks, we conclude that\
    \ a router essentially serves the purpose of a node. Routers feature their very\
    \ own network address, which solidifies their function as a node even more. A\
    \ router receives data packets from other nodes. After receiving the packets,\
    \ the router analyzes and examines the contents of the data packets: only after\
    \ this assessment does the router send the data packet to its destination. This\
    \ procedure needs to be performed almost instantaneously to avoid delay and lag\
    \ in data traffic. To ensure that the router swiftly and accurately performs this\
    \ job, they are designed with a microprocessor inside them to handle the computational\
    \ and logical needs of the task. Usually, this processor is a variant of the RISC\
    \ or Reduced Instruction Set Computer type chip. Besides a microprocessor, routers\
    \ also have built-in memory to help with routing function. Since routers are more\
    \ intelligent than bridges and they have more computational resources; they can\
    \ figure out the shortest route (if available) towards any data packet’s destination\
    \ and use it. Besides this, routers can also perform certain tasks that facilitate\
    \ the bandwidth maximization of a network. Also, a router can logically and dynamically\
    \ adapt to the traffic problems detected in a network. Let’s talk about the importance\
    \ of routers in a network. It wouldn’t be an exaggeration to say that routers\
    \ form the backbone of the entire Internet. For instance, consider the TRACERT\
    \ command. When you use this command to trace a route from two points, a node\
    \ to a destination, we can see there are multiple ‘hops’ shown by the terminal\
    \ before it can show the destination. These ‘hops’ are routers that are forwarding\
    \ the data packet until it reaches its destination. ![](Image00006.jpg)Routers\
    \ are not pre-configured. To perform their tasks and functions properly, they\
    \ need to be programmed. For instance, a standard router configuration may include\
    \ the assignment of network addresses to each of its ports and the configuration\
    \ of the protocol settings. The programming of routers is usually done in either\
    \ of these two ways. \n\n1.  Usually, there is a port known as the ‘RS-232C’ port.\
    \ By using terminal emulation software, we can connect a computer or a terminal\
    \ using this port. Once connected, it becomes possible to program the router in\
    \ text mode. \n\n2.  Besides programming a router directly from its RS-232C port,\
    \ routers can also be programmed by using network-based software that comes with\
    \ it. Usually, this software uses either a graphical tool or a simple web interface.\
    \ \n\nBoth of these two methods are supported by the majority of the routers available\
    \ nowadays. However, there is no recommended method. It all depends on aspects\
    \ such as your security needs and the specific model of the router you are using.\
    \ When using routers, one should be careful, as the network-based programming\
    \ method for a router can be exploited by hackers. This would allow unauthorized\
    \ users to change the configuration of the router. Gateways A gateway is an application-specific\
    \ interface. The main job of a gateway is to link all layers of the OSI networking\
    \ model whenever they are detected to be dissimilar. This dissimilarity can be\
    \ in any single layer or all layers and the gateway will still perform its function.\
    \ To understand this better, let’s see an example. Let’s say we have established\
    \ networks by using the OSI networking model, but we want to connect to a network\
    \ using Systems Network Architecture, also known as SNA, by IBM. These two networks\
    \ are not similar, so to connect them, we will use a gateway to do so. Gateways\
    \ also can translate Ethernet to Token Ring. However, there are simpler network\
    \ solutions if you need a network translation such as this one. Since the translation\
    \ load on gateways is considerably larger than other solutions, gateways perform\
    \ relatively slower. Nowadays, using gateways in networking is primarily to handle\
    \ e-mails. For example, two of the most common e-mail protocols handled by gateways\
    \ are: \n\n*   POP3 \n\n*   SMTP \n\nGenerally, the majority of the e-mail systems\
    \ that need to connect with systems on a different network will either use a computer\
    \ set up as a gateway or use the e-mail server to perform the gateway tasks. The\
    \ Core Fundamentals of Cable Topologies Before we move on to the cable topologies,\
    \ let’s refresh the concept of a ‘Topology.’ The word ‘Topology’ means ‘shape’;\
    \ similarly, the word ‘Network Topology’ essentially refers to a network’s shape\
    \ (the wired arrangement of the network’s nodes). ![](Image00007.jpg)Different\
    \ topologies have different costs, advantages, disadvantages, performance, stability,\
    \ and reliability. In this section, we will discuss the three main cable topologies\
    \ commonly used today. \n\n1.  Bus Topology \n\n2.  Star Topology \n\n3.  Ring\
    \ Topology \n\nBus Topology Bus topology is also commonly called ‘Common bus multipoint\
    \ topology.’ A bus topology is basically a network that uses a single end-to-end\
    \ network cable. On this network cable, some devices are connected at different\
    \ locations on the cable, and these connections are termed ‘nodes.’ A simple illustration\
    \ of a bus topology network is shown below: ![](Image00008.jpg)However, there\
    \ is no universal bus topology in use. Instead, bus topology comes in many types,\
    \ each featuring its own specifications. These specifications are based on these\
    \ factors: \n\n*   The number of nodes that can be handled by a single segment\
    \ \n\n*   By using a repeater, what is the resulting number of segments that can\
    \ be used \n\n*   The maximum limit of physical proximity for the nodes \n\n*\
    \   The network segment’s length \n\n*   The coaxial cable required \n\n*   How\
    \ the segment’s terminal ends are supposed to be terminated \n\nGenerally, a bus\
    \ topology network implements coaxial cable. In such a type of network, the two\
    \ open terminal ends of the network need to be addressed; otherwise, the network\
    \ would not be functional. A special type of cable terminator is used on each\
    \ terminal end of the network. There are several different bus topology, and each\
    \ group uses a different type of connector to conjoin the different segments of\
    \ the network cable. For instance, a Thin Ethernet 10Base-2 bus topology network\
    \ uses a connector known as a ‘BNC connector.’ This connector is also known as\
    \ the ‘BNC-T connector’ because it resembles a ‘T’ shape. This connector allows\
    \ a node (computer or a server) to be connected to the network segment while allowing\
    \ the network to continue its bus. There are also different types of BNC connectors:\
    \ \n\n1.  BNC-T connector "
