    \ to perform the hack. Insider attacks can be detected and prevented by installing\
    \ intrusion detection systems internally within the organization.\n\n### External\
    \ Attack\n\nExternal attacks arise when somebody inside or external to the organization\
    \ hires a hacker to attack the organization’s network and systems. External attacks\
    \ are executed to cause financial and reputational losses to an organization.\
    \ An external attack needs more planning and research when compared to an insider\
    \ attack. Every external attack goes through the following stages: \n* Planning\n\
    * Reconnaissance\n* Scanning\n* Gaining Access\n* Maintaining Access\n\nIf the\
    \ organization’s network admin is experienced, he or she constantly checks the\
    \ firewall logs and scans the systems and network to identify vulnerabilities.\
    \ The organization can also use intrusion detection systems to detect and prevent\
    \ external attacks. \n\nIn addition to insider attacks and external attacks, there\
    \ are two more types of cyberattacks: structured or unstructured. This classification\
    \ is based on the experience of the attacker. Most people classify these attacks\
    \ as external attacks, but there are cases where an employee has performed structured\
    \ attacks on the organization for personal gain. These types of attacks are often\
    \ carried out by rival companies. They may send one of their employees to the\
    \ company and ask them to collect information from that company. This is known\
    \ as corporate espionage.\n\n### Unstructured Attacks\n\nAn attack carried out\
    \ by an amateur attacker without any predefined motive is classified as an unstructured\
    \ attack. These attacks are often carried out using a penetration tool readily\
    \ available on the Internet. The attacker may use this tool on the company’s network.\n\
    \n### Structured Attacks\n\nA structured attack is planned and executed carefully\
    \ by an experienced and skilled professional with clear objectives. Attackers\
    \ have access to powerful tools and technologies that help them access the target\
    \ system or network without being detected by an intrusion detection system. Additionally,\
    \ an attacker also has the knowledge required to modify an existing tool to suit\
    \ the specific attack requirements.\n\n## Reasons for Cybercrimes\n\nAn attacker\
    \ can choose to hack a system or network of an organization for multiple reasons.\
    \ The following are some common reasons why cybercrimes happen.\n\n* **Money**:\
    \ Attackers commit cybercrimes to earn money since this is an easier and faster\
    \ way to make money. They use hacking methods, such as `phishing` and `spoofing`,\
    \ to trick someone into revealing their account information. The attacker can\
    \ use this information to transfer the funds from the victim’s account into their\
    \ own.\n* **Revenge**: Some attackers may want to take revenge against another\
    \ individual, organization, religion, or government. They may choose to hack these\
    \ entities to cause financial and physical losses. This form of attack is known\
    \ as cyberterrorism.\n* **Testing**: Some attackers hack systems and networks\
    \ when they want to test a new tool or software. The only objective of such an\
    \ attack is to understand how the new tool or software works.\n* **Recognition**:\
    \ Some attackers choose to attack to gain popularity. They may hack a defense\
    \ or large organization’s systems and networks to make a name for themselves—anonymity.\
    \ Cybercriminals can ensure their anonymity when they perform a hack. It is extremely\
    \ easy for cybercriminals to get away with their attack since nobody knows how\
    \ to trace the attack back to the cybercriminal. This anonymity, at times, has\
    \ even motivated respectable citizens to commit a cybercrime for personal gain.\n\
    * **Cyber Espionage**: Some governments may choose to overlook the data privacy\
    \ act and track everything their citizens do. They may choose to do this for political\
    \ or economic reasons.\n\n## Types of Hackers\n\nHackers are curious about how\
    \ networks and computer systems work. They are skilled in coding and programming\
    \ since they do their best to hone their skills. They also learn about various\
    \ tools and technologies they can use to perform hacks. Since hackers attack the\
    \ operating system, find their way around the system, here are the most common\
    \ types of hackers:\n\n### White Hat Hackers\nHackers who have certifications\
    \ and are authorized to conduct penetration tests for an organization to identify\
    \ vulnerabilities in their information are white hat hackers—or also known as\
    \ ethical hackers. They are a part of the security team in an organization, and\
    \ their job is to prevent an attack on the organization’s system and comply with\
    \ the rules of engagement stated by the organization or government.\n\n### Black\
    \ Hat Hackers\nBlack hat hackers, also known as crackers, want to access your\
    \ system and network and steal, manipulate, or destroy data. They implement common\
    \ hacking practices for their attacks, are lawbreakers or criminals, and it is\
    \ easy to differentiate between white hat and black hat based based their objectives.\n\
    \n### Gray Hat Hackers\nThese are hackers that fall in a spectrum between white\
    \ hat and black hat hackers. Since they are not certified as cybersecurity experts,\
    \ they can choose to work for or against the organization.\n\n### Script Kiddies\n\
    Script kiddies are known to be the most dangerous people in the hacking world\
    \ since they lack experience and knowledge. They use any malicious tool or software\
    \ available on the Internet without learning what it is used for or the damage\
    \ they can cause to the network or system.\n\n### Green Hat Hackers\nGreen hat\
    \ hackers are also amateurs of the hacking world, but they are passionate about\
    \ becoming professional hackers. They are inspired by professional hackers and\
    \ keep in touch with them to learn to hack.\n\n### Blue Hat Hackers\nBlue hat\
    \ hackers are script kiddies who have some knowledge about hacking are different\
    \ from green hat hackers since they perform a hack with malicious intentions.\
    \ However, they do not have the intention to develop necessary skills.\n\n###\
    \ Red Hat Hackers\nRed hat hackers, also known as eagle eye, are ruthless and\
    \ destroy the network and systems used by black hat hackers to counter any attacks.\n\
    \n### State-Sponsored Hackers\nAs the name suggests, a country or state hires\
    \ these hackers to hack into other countries’ or states’ systems to extract defense-related\
    \ information.\n\n### Hacktivist\nThe online version of an activist is known as\
    \ hacktivist. They are anonymous hackers, and they target government systems for\
    \ social and political reasons.\n\n### Whistleblower\nAn employee of a government\
    \ or organization who feels their institution is being unethical and conducting\
    \ illegal activities may choose to call it out against their conscience. Such\
    \ hackers are known asblowers.\n\n## Common Tools Used by Hackers\n\nHackers use\
    \ numerous tools to execute the perfect attack. The following are the most common\
    \ tools in a hacker’s toolkit:\n\n### Rootkit\nA rootkit is an application or\
    \ a set of tools that allows hackers to gain remote control of a computer or network\
    \ of computers connected to the Internet. The rootkit was originally developed\
    \ to open backdoors in any software so that it could be fixed or updated with\
    \ patches. Hackers tweaked this application to suit their needs and now use this\
    \ tool to control the operating system. Rootkits can be installed in various ways\
    \ on a target system.\n\n### Keyloggers\nKeyloggers are tools capable of recording\
    \ every key pressed on the keyboard. Keyloggers cling to the `Application-programming\
    \ Interface` of any application and record every keystroke made by the user when\
    \ they access the application. The recorded keystrokes are saved to a file that\
    \ contains sensitive data, such as usernames, passwords, website URLs, opened\
    \ applications, etc. Keyloggers are scary as they can record credit card details,\
    \ mobile numbers, personal messages typed in email applications, etc., provided\
    \ they were typed using the keyboard. Keyloggers are planted using malware such\
    \ as Trojan horses on a target’s computer.\n\n### Vulnerability Scanners\nAs the\
    \ name suggests, a vulnerability scanner is used to scan networks and computer\
    \ systems to identify vulnerabilities or gaps. Ethical hackers commonly use this\
    \ tool to identify loopholes in a system so they can patch them as soon as possible.\
    \ Black hat hackers also take advantage of vulnerability scanners to discover\
    \ weaknesses in a target’s system or network to exploit them.\n\n## Types of Cybercrime\n\
    \nIt is also important to understand the crimes a person can commit using digital\
    \ platforms, such as computers and the Internet. Here are the various types of\
    \ cybercrimes people commit today:\n\n* **Cyberstalking**: When someone uses the\
    \ Internet to stalk another person, harass, or threaten them, it is cyberstalking.\
    \ A cyberstalker often uses applications like email, online messengers, social\
    \ networking websites, etc., to execute cyberstalking. These mediums offer anonymity.\
    \ Cyberstalking includes activities such as sexual harassment, monitoring someone’s\
    \ private life, false accusations, etc.\n* **Forgery/Counterfeiting**: It is a\
    \ crime to counterfeit documents. With advanced applications available today,\
    \ it is easy to create a document that looks exactly like the original. It becomes\
    \ difficult to differentiate between the correct and fake documents unless you\
    \ are an expert.\n* **Child Pornography**: Possessing, uploading, or downloading\
    \ the sexual content of a minor is a cybercrime. Multiple websites on the Internet\
    \ promote child pornography and exploit many minors in the world.\n* **Cyber Terrorism**:\
    \ Some people use digital resources to spread hatred against a religion, country,\
    \ etc. This is an act of terrorism and is known as cyber terrorism.\n* **Piracy**:\
    \ Content is available digitally today and can be easily copied. The distribution\
    \ of content owned by someone else is piracy.\n* **Vandalism**: Destruction of\
    \ digital resources is computer vandalism.\n* **Phishing**: The act of tricking\
    \ someone into disclosing account information is phishing.\n* **Vishing**: The\
    \ act of phishing via the telephone is called vishing.\n* **Spamming**: The act\
    \ of sending unwanted emails is spamming.\n* **Malware**: The spreading of malware\
    \ is a crime.\n* **Cross-Site Scripting**: Injecting a malicious script into a\
    \ website is cross-site scripting.\n"
