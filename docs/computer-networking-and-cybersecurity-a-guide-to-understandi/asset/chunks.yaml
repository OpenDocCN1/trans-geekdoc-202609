    # Layer 5: Session Layer


    The fifth layer of the OSI networking model is the Session Layer. By this layer,
    the model can define the connection established between two computers, either
    in a client-server connection or a peer-t0-peer connection relationship. The term
    ‘session’ is used to describe this virtual network connection between computers.
    Since the primary focus of the OSI model’s fifth layer is upon these connections,
    hence it is named as the ‘Session Layer.’ the reason the establishment of a network
    connection between two computers is known as a ‘session’ is that once the connection
    is established, it persists for a certain period. A session basically involves
    negotiations that take place between the connected client and the host. The points
    of focus in the negotiation are listed below.


    *   Flow control

    *   Transaction processing

    *   User information transfer

    *   Network authentication


    # Layer 6: Presentation Layer


    One of the higher tier layers, the presentation layer, is mainly concerned with
    presenting data in a form that can be comprehended by the system. The presentation
    layer of the OSI networking model collects all the data being supplied by the
    lower-tier layers. It then converts into a format that can be used by the system.
    Even though the name ‘Presentation’ may be misleading, the deliverance of data
    to be easily understood by the system is as important as the system presenting
    the data to be easily understood by the user. The presentation layer performs
    these functions:


    1. Data compression

    2. Data decompression

    3. Data encryption

    4. Data decryption


    From this, we can conclude that the main concern of the presentation layer is
    data.


    # Layer 7: Application Layer


    The last and highest tier layer in the OSI networking model is the Application
    Layer. If we analyze the nature of the interaction of each layer with their respective
    elements in a network, we can see a steady pattern. The layers in the OSI networking
    model begin their interaction with the physical elements within a network, i.e.,
    the routers, network cables, etc. From here, the layers move toward interacting
    with virtual features and elements, i.e., moving toward intelligent aspects of
    the network. After this, the OSI model’s focus on the virtual aspects of the network
    shift towards the involvement of the computer machine itself within the network,
    which is evident from the last two layers (Presentation and Application layers).
    Continuing this train of thought, we can come to understand the purpose of the
    application layer in the OSI networking model and the overall working of a network
    involving computers. By doing this, we can analyze networks in a more detailed
    and comprehensive manner. Now let''s get to what the application layer is all
    about. The main concern of the application layer is to control and mediate the
    interaction of the network with the Operating System and the applications installed
    on this OS. It defines how the applications handle the communication that the
    system becomes involved in when connected to a network. Examples of the software
    that fall under the definition of the application layer include:


    *   Windows Client for Microsoft Networks

    *   Windows Client for Novell Networks


    Such software is typically used as a network client application in computer networks.
    However, the data does not go through the OSI networking model in only one direction.
    It can go up the OSI model when the computer is at the receiving end of the network,
    and the data can go down the OSI model when the computer is transmitting the data
    through the network.


    # Chapter 7: Network Security, Cybersecurity, and Hacking Methods


    This chapter focuses on the basics of network security and recovery. Does network
    security play a vital role? Internal security makes it possible to protect the
    network from internal threats, which are more common than external threats. A
    network’s security is threatened by internal users in these ways:


    *   Accessing records of payroll

    *   Gaining access to another user

    *   Impersonating another user

    *   Gaining entry into the systems

    *   Letting viruses into the system by accident or deliberately

    *   Discovering user accounts and their passwords


    Such internal threats must be eliminated by diligent management of the network.


    ## Account Security


    In Account security, various tasks are carried out to manage the user accounts.
    To make sure no security holes exist, those managing the accounts should audit
    them often. Management of account security requires these steps:


    *   The startup user account termed as `Guest` most network operating systems
    should be removed immediately.

    *   Accounts used for testing, such as `Test`, `Generic`, etc., should not be
    created because these accounts are easy and frequent targets of crackers.

    *   The network operating system assigns a default name to the administrative
    account. It may be named as `Administrator` in Windows and `Supervisor/Admin`
    in NetWare. Change this name soon so attacks directed against the account can
    be avoided.

    *   Knowing how to remove access to network resources with quick precision from
    any user account and verify the network resources that contain their security
    systems.


    For instance, network operating systems and specific applications like database
    servers or accounting systems handle the management of user accounts. Some systems
    don’t deny access to deactivated or removed accounts unless they log out from
    the system, which can threaten security. It is necessary to discover how the system
    manages removed accounts.


    *   Establishing a relationship of mutual trust and working closely with the appropriate
    people in the Human Resources (HR) department is essential in maintaining proper
    security. By co-operating with the HR staff, you could work on the security issues
    related to the departure of employees and make a checklist for employment changes
    affecting IT. The HR department may not provide you with advance notices, but
    you must know about the terminations immediately for taking proper steps in time.

    *   Try to provide the new users with a program where they can submit their permissions
    and have them reviewed and signed off by their supervisor. This step eliminates
    any possibility of these users gaining access to sensitive information.


    ## Password Security


    Password security is an important aspect of account security, which enables you
    to set policies that control the time period within which the system forces the
    user to change their passwords, the complexity and length of these passwords,
    and whether old passwords can be reused. Password security policies should at
    least include these suggestions:


    *   Make sure that the users change their main network passwords every ninety
    to one hundred and eighty days through the network password policy settings. Even
    though thirty days is recommended, it can be considered too frequent for some
    environments.

    *   `Reuse policy` should prevent users from reusing an old password for at least
    a year.

