- raw: "Chapter 8: Useful Cybersecurity Tips for 2020  Vital Function of a Disaster\
    \ Recovery Plan A disaster recovery plan is a document containing the step-by-step\
    \ procedure of recovering a network after a disaster endangers the network data\
    \ or hinders its functioning. The external financial auditors of a company need\
    \ the annual disaster recovery plan to get the information listing the network\
    \ data and its significance to the company, and repair the detrimental effects\
    \ a network failure can have on the company network. While preparing a disaster\
    \ recovery plan, the manager must carefully consider all the possible disaster\
    \ scenarios and develop effective protection plans to prevent data loss and restore\
    \ business operations quickly. Thus, the network Managers' two most crucial jobs\
    \ include developing an effective disaster recovery plan and managing the backup\
    \ systems of the company. Most often, the disaster recovery plans are not long,\
    \ although the length also depends on the complexity of the network’s operations.\
    \ Consider a single network with several hundred nodes and perhaps fifteen servers;\
    \ the disaster recovery plan prepared for this network will only be around ten\
    \ to twenty pages long. If a network is a complex like the Fortune 500 companies,\
    \ the plan for disaster recovery of all the sites considered in aggregate may\
    \ be several hundred pages long. The usefulness of the disaster recovery plan\
    \ can be maximized by making it concise and relevant while keeping some focus\
    \ on even the remote problems that have at least a small chance of occurring.\
    \ Pay attention to the results of the disaster, such as loss of a single server\
    \ or an entire server room, or loss of all the customer service workstations,\
    \ etc., instead of worrying about the causes that lead to this disaster. The minimum\
    \ issues that should be focused on in a disaster recovery plan are elaborated\
    \ in the following section. Depending on the company and the network being used,\
    \ other related issues might also need to be addressed. Assessing Disaster Recovery\
    \ Needs The disaster recovery plan should be drafted according to the needs of\
    \ the company, i.e., the issues the plan should focus on and the person that requires\
    \ the input into the process of recovery planning. Some other needs to be considered\
    \ are: \n\n*   Considering various contingencies and formally planning for all\
    \ kinds of possible disasters by designing countermeasures for them. \n\n*   Convincing\
    \ the external accounting auditors of the company that a plan has been developed\
    \ to counter the possible disasters. \n\n*   Making sure that the company’s top\
    \ management is notified about the risks and potential disasters, and the time\
    \ it would take to deal with any problem that occurs. \n\n*   Developing a plan\
    \ by starting from the key areas of the company’s business considerations, including\
    \ the different disasters related to the computer network. \n\n*   Persuading,\
    \ the firm’s customers that the data and operations of the firm are secure and\
    \ safe from disasters. \n\nKeeping these needs in view while planning will clearly\
    \ show you what the plan should entail and which people from the different parts\
    \ of the company should be involved in the planning process. Considering Disaster\
    \ Scenarios To effectively prepare for disaster scenarios, and develop a plan,\
    \ consider many probable disaster scenarios such as: \n\n*   A fire breaks out\
    \ in a room, such as the server room, and destroys some computers and tapes. \n\
    \n*   The computer and backup batteries close to the floor of the server room\
    \ are damaged by flooding. It can occur by an incident within the building such\
    \ as fire sprinklers activating due to a fire, or a serious case of water leaking\
    \ into a room near the server room. \n\n*   A problem in the electrical circuits\
    \ occurs, causing the power to fail. \n\n*   Connection to the outside world is\
    \ lost due to some problem like the critical Wide Area Network (WAN) or the Internet\
    \ connection going down. \n\n*   The network or servers of the company face problems\
    \ due to bad building structure. \n\n*   The computers in another part of the\
    \ building, essential for running the company’s operation, get affected by the\
    \ preceding events. It could be one of the manufacturing areas, the customer service\
    \ center, or the telephone system room. \n\nThe events mentioned above do not\
    \ have a high chance of occurring. However, it is still imperative to consider\
    \ them all because a disaster recovery plan is made to deal with serious problems.\
    \ If the planning is focused only on the problems most likely to occur, it will\
    \ be much less useful. Some failures which could endanger the system should also\
    \ be considered after planning for disasters: \n\n*   The server’s motherboard\
    \ fails and a new one cannot be obtained from the vendor in less three days. \n\
    \n*   The failure of a disk causes the loss of data. If using the scheme of Redundant\
    \ Array of Independent Disks (RAID), make a plan that accounts for failures worse\
    \ than the RAID system can protect. Such as, if RAID 1 mirrored drives are used,\
    \ create a plan that considers the failure of both sides of the mirror simultaneously.\
    \ For RAID 5, consider planning countermeasures for when two drives fail simultaneously.\
    \ \n\n*   Consider a case where the tape backup drive fails, and repairs cannot\
    \ be done within one or two weeks. This failure does not cause the loss of data,\
    \ but it does increase the chances of such an event. \n\nPlanning for these failures\
    \ requires ways of responding quickly and effectively. For example, if the server’s\
    \ motherboard fails, relocate the drives of that server to another one temporarily,\
    \ until the motherboard gets fixed or replaced. If a disk fails, design a plan\
    \ which contains a method to rebuild the disk array and quickly restore the data\
    \ from a backup. If the tape backup drive fails, plan on how to obtain an equivalent\
    \ drive soon, or if the tape-drive developer can make an exchange of the failed\
    \ drive for a reconditioned replacement drive. Consider keeping spare parts and\
    \ backup servers so that in case of any failure, system operation can be resumed\
    \ quickly. Examine what these responses entail: \n\n*   Should a maintenance contract\
    \ be kept close? If so, ensure that the guarantees and procedures are understood.\
    \ \n\n*   Should spare parts be stocked and ready to use if a failure occurs?\
    \ \n\n*   Is another computer available that can act as a temporary replacement\
    \ for a key server if it fails? Can the same be asked for routers, hubs, switches,\
    \ and other important components? \n\n*   Are the employees trained and ready\
    \ to work with the replacements, or with no system if temporary measures have\
    \ to be taken? For example, can a restaurant and its staff keep operating if the\
    \ electronic system goes down? \n\n*   Is it necessary to maintain a hot or cold\
    \ recovery site? A “cold” recovery site is a facility kept close to the protected\
    \ data center and managed by the company. If the data center faces some disaster,\
    \ the site can be hosted in this facility where all the power, air conditioning,\
    \ and facility features are available. But the “hot” site has the same features\
    \ as the “cold” site with the additional advantage of having computer equipment\
    \ and software to perform the same processing as done in the data center. The\
    \ data of the hot site is synchronized with that of the data center on a real-time\
    \ basis, due to which it can take over the work of the main site in a short amount\
    \ of time. Hot or cold sites are often used by those companies which need to carry\
    \ out sensitive and mission-critical data operations. \n\nThe core of disaster\
    \ recovery planning is based on two points; first, analyzing problems or potential\
    \ risks, e.g., malfunctioning or failure of essential equipment, and second, after\
    \ analyzing the risk managing it and overcoming the risk. \n\n1.  Handling Communications "
