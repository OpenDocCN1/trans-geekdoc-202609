    positives. You may ask why this is a problem? The issue with false positives is
    that a manual auditor must spend more time trying to verify if the vulnerability
    is indeed a vulnerability. This is a waste of resources and, therefore, needs
    to be avoided. Automation More automation in a web vulnerability scanner is equal
    to more relief for the company. This means that a tester need not manually configure
    each parameter since the scanner is already configured to scan well-known vulnerabilities.
    There are more vulnerabilities in a web application than what meets the eye. It
    is practically impossible for people to identify every vulnerability even if there
    is a time restriction. It is safer to use an automated scanner since it can complete
    the scan and identify vulnerabilities within two-three hours. Additionally, a
    tester’s knowledge about any vulnerability in the system is dependent on their
    experience. An automated web vulnerability scanner is already equipped with knowledge
    of existing vulnerabilities in web applications, and the developers of that scanner
    constantly update the database based on newly discovered vulnerabilities in different
    web applications. In addition to these technical steps that you can take to secure
    your web application, you must stay informed. The Internet is full of information
    with blogs and websites on web application security. You can protect your applications
    and software better if you update your knowledge and skills regularly and stay
    abreast of what is going on in the industry. Smartphone Security When someone
    talks about a ransomware attack, people immediately think of attacks on employees
    using laptops or desktops. This is where an attacker thinks differently. An attacker
    always considers all possibilities that help them enter the system or network.
    An easy way to do this is through smartphones, which are easy to hack into and
    offer quick rewards. The following are some numbers concerning cybercrimes and
    smartphones: ● Reports suggest that the number of attacks on smartphones had gone
    up by 50 percent in 2019 as compared to 2018. This was not just for Android devices.
    There is an estimate that, presently, around 1.6 million attack campaigns are
    targeting Apple devices. ● Reports by the researcher Ponemon suggest that in the
    past twelve months, 67 percent of small-medium sized businesses are victims of
    cyberattacks, and 58 percent were victims of a data breach. All this because of
    inefficient security on smartphones. ● The data breach report presented by Verizon
    in 2019 showed that 42 percent of the victims were small business owners. ● Forty-seven
    percent of small-medium sized businesses agreed that they do not know how to secure
    smartphones to protect their businesses. Attacking smartphones is getting popular
    since attackers always look for new ways to attack your business. For instance,
    even state-sponsored attacks have started integrating smartphones to gather information
    for their attacks. The reason smartphones are targeted is because everyone takes
    smartphone security for granted. Here are the simplest ways users and business
    owners can protect their smartphones and data: Update the Operating System and
    Apps Just like you would do in the case of your laptop or desktop, it is also
    important to keep your smartphone’s operating system and its applications up to
    date. Many people are idle about updating their smartphone’s operating system
    and apps. This opens their smartphone up to new vulnerabilities. When operating
    system and application providers roll out an update, they try to patch any discovered
    vulnerabilities. For instance, when OnePlus decides to upgrade the system, it
    sends you a notification. Once you download and install it, it tells you what
    fixes it made to your phone. Application providers also do the same. There may
    be a weekly update at times. If you do not update your smartphone, it becomes
    an easy target for attackers. Today, businesses also have a Bring Your Own Device
    BYOD policy where personal smartphones can be connected to the office network.
    This being said, businesses need to train their employees about the importance
    of keeping their smartphones up to date. Lock Your Smartphone Keeping your phone
    unlocked is convenient for checking texts, emails, etc., but imagine if you forgot
    your phone in a coffee shop. What do you think will happen? If you do not have
    a security code, anybody can pick your phone up and access all your information.
    If your phone contains business information, you will put your business or organization
    at risk because of minor negligence. Therefore, always make it a point to lock
    your smartphone with a passcode or biometric authentication. Use Inbuilt Device
    Security Features You can use the “locate my device” feature if you misplaced
    your smartphone. The feature makes your phone ring, which can threaten the thief
    or help you locate your phone if you lost it temporarily. There are options on
    the phone even to delete all data if there were a few incorrect passcode attempts.
    Using Bluetooth and Wi-Fi Wisely Many people like to use free or public Wi-Fi.
    If you are using a smartphone with critical business data, think twice before
    you do this. Make it a point to ensure that the Wi-Fi you use is from a legitimate
    network. Free Wi-Fi available across public spaces such as coffee shops, malls,
    etc. are less secure. The same goes for Bluetooth. People tend to ignore the Bluetooth
    feature leaving it on all the time. An attacker can take advantage of this ignorance,
    and break into your phone if they get sufficiently close to you. App Permissions
    When you install an app on your smartphone, it asks you permission to access certain
    features on your phone. Be careful before you approve these permissions. For example,
    it is understood for Google maps to have permission to access your location since
    it needs this to give you the right information. On the other hand, if a simple
    game you downloaded asks you for permission for your location, you need to be
    alert immediately. For all you know, attackers created the game to access your
    location. An application may ask many other permissions, so make sure to read
    these permissions before you give the application access. Phishing and Spam Emails
    Your smartphone also has an email application, and therefore, hackers can use
    phishing to obtain sensitive information. Thus, everything you learned in Chapter
    Three holds for emails received on your smartphone. Data Backups Data backups
    are as important for your smartphone as for your laptops and desktops. Some issues
    may occur at any time. Your smartphone may get stolen, or you may cause accidental
    damage to it. Therefore, it is advised that you maintain data backup. Smartphone
    providers these days even offer automated backups for your data through cloud
    services such as Google Drive for Android and iCloud for iPhones. Always take
    advantage of this feature, so you never have to worry about losing your data.
    Antivirus Apps It is good to have an antivirus app installed on your smartphone
    since it protects your phone from any kind of malware. Attackers always deploy
    malware first to your device, and so it is best to install an antivirus app to
    prevent any attacks. Source of Your Apps The majority of users ignore this fact,
    but it is very important that the apps you download come from trusted sources.
    For Android, the Play-store is a trusted source, and for Apple, the app store.
    There are certain apps unavailable on the play store or app store, and this is
    due to security reasons. Users tend to sideload these apps that may be tampered
    with by an attacker, and your smartphone is conveniently opened up for attack
    just because of your negligence to sideload third-party apps. To conclude, smartphones
    are critical extensions to business, more now than ever, and are no longer just
    a device used for making phone calls. Given its form factor, you can easily lose
    it, or it can be robbed. Therefore, it is really important in the modern world
    to care about the security of your smartphone just as much as you care about your
    other devices. '
