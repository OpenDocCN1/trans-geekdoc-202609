    is associated with an IP address. That IP address is used by other devices to
    locate and communicate with each other. Virtual Private Network (VPN) A virtual
    private network is a network over which you can be anonymous. You get assigned
    an IP belonging to a different region, and all your actions over the Internet
    are logged via that IP, thus keeping your original IP hidden. VPN applications
    also encrypt the traffic for you so that the Internet Service Provider or the
    government cannot track your activities online. VPNs are also used by organizations
    to keep you connected to the office network if you want to access the office network
    from outside. This has gained a lot of popularity in recent times as it helps
    a person work from home or remotely. Exploit An exploit is defined as a malicious
    piece of code that can be used to take advantage of a vulnerability or loophole
    in a computer or a server. Viruses, Trojans, Botnets, etc., are all used to execute
    an exploit in a target system. Breach The moment when an attacker takes advantage
    of a system’s vulnerability, and gains access, is known as a breach. Firewall
    The technology used to create rules for a system, so incoming and outgoing traffic
    can be filtered, is known as a firewall. Firewalls can be implemented using both
    hardware and software. Malware Malware is a broad term or an umbrella that includes
    any malicious software that can harm a computer. The most common types of malware
    are viruses, worms, Trojans, ransomware, etc. Virus A virus is defined as malware
    that can harm certain programs on a computer. It can further replicate itself
    and spread over multiple files and computer networks. It needs a host file and
    cannot execute by itself. Viruses were known to affect only software, but they
    have evolved in recent years even to cause physical damage to hardware. Ransomware
    Ransomware is a type of malware that will encrypt all the data on your computer
    and prevent you from accessing it. The attacker who deployed the ransomware will
    leave an application where you make a payment to them, after which the files will
    automatically be decrypted. In 2017, a ransomware known as WannaCry infected all
    Windows-based machines. Trojan Horse A Trojan horse is like a virus, but it does
    not execute by itself. It is usually masked and lies under a file, which may be
    important to a user. For example, a user may receive a PDF with the content they
    were expecting, but at the same time, clicking on that PDF triggers a malicious
    script. This implementation is known as a Trojan horse. Worm A worm is a piece
    of malicious code that is capable of replicating itself over a network. It may
    not necessarily infect a file like a virus does, but it can do something annoying
    like consuming the network bandwidth and denying the bandwidth to the user. Bot
    or Botnet A Bot is a malicious application that can be planted over a network
    of computers, allowing an attacker to remotely take control of the complete network.
    The collection of computers on which the bots are planted is called a botnet.
    The botnet is controlled by an attacker who is known as bot herder. DDoS DDoS
    stands for Distributed Denial of Service and is a form of cyberattack. The motive
    of a DDoS attack is to flood a network with malicious traffic so that genuine
    requests for a website cannot be accommodated in the bandwidth. DDoS attacks are
    often executed by implementing botnets. Phishing and Spear Phishing This is a
    technique that is used by attackers to retrieve information. The most common example
    of this is emails sent to unsuspecting users, which may seem legit but will have
    links redirecting you to something else. For example, if you have an account with
    Citibank, the sender of the email will have an email address like something@citibanks.com,
