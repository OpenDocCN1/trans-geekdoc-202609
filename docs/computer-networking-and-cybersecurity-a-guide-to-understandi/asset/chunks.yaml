    # 第十章：网络安全职业所需的技能


    你已经接近这本书的结尾，到目前为止，你学习了许多关于网络安全的知识。那么，接下来是什么？拥有这些知识很好，但如果你想使用它们，应该怎么做？本章将介绍网络安全领域的各种职业，以及你追求这类职业需要发展的技能。本章对角色的分类将帮助你决定想在哪个领域工作。


    网络安全职业并非一帆道路；它可能会充满压力。然而，它也有回报。网络安全专业人士在组织中承担不同的角色，但他们的目标是一样的。他们必须开发方法和工具来保护组织的数据免受任何攻击。


    在行业中进入网络安全岗位并不总是一帆风顺的。有些人一毕业就直接投身其中，而另一些人喜欢在选择转向更关注安全的职位之前获得一些软件工程方面的经验。以下是根据候选人的经验在网络安全领域提供的一些职业选择：


    ### 入级职位

    * 系统管理员

    * 系统工程师

    * 网页开发人员

    * IT 技术员

    * 网络工程师

    * 安全专家


    ### 中级职位

    * 安全分析师

    * 安全技术员

    * 事件分析师

    * 网络安全顾问

    * IT 审计

    * 渗透测试员


    ### 高级职位

    * 网络安全架构师

    * 网络安全经理

    * 网络安全工程师

    * 首席信息安全官 (CISO)


    ## 网络安全中的四个热门职业及实现路径


    ### 安全架构师

    如果你喜欢解决问题并开发策略来防止相同问题的发生，请考虑安全架构师这一角色。安全架构师负责组织系统和网络的设计、开发和实施安全性。他们能够开发高效复杂的安全结构。这些安全结构可以防止任何恶意软件、DDoS
    和其他攻击。


    美国安全架构师的平均年约为 120,000 美元。安全架构师必须在 IT 行业拥有至少五年的经验，并在安全领域拥有三到五年的经验。如果你想追求安全架构师职业，请遵循以下路径：


    * 攻读信息技术、计算机科学、网络安全或任何相关领域的学位。或者，你也可以获得同等的行业级认证。

    * 以系统管理员、安全管理员或网络管理员的身份进入行业。

    * 在同一组织工作一段时间，并在组织内不断晋升，直到达到安全工程师级别。

    * 在此时，你可以转变为安全架构师职位。


    安全架构师的职责如下：

    * 研究当前的攻击趋势，并为业务的所有 IT 项目设计安全架构。

    * 向管理层提供网络和网络设备的需求建议。

    * 执行安全测试，例如风险分析和漏洞测试。

    * 研究安全领域的最新标准并在组织中实施它们。


    #### 培训

    安全架构师是一个高级职位，因此招聘经理在聘用任何候选人时都会寻找特定的认证。网络安全领域的行业级认证会让你的简历比竞争对手更具优势。你可以先获得 `CompTIA
    Security+` 证书，然后进行 `认证道德黑客 (CEH)` 认证。要进入高级和专家级别，你可以获得 `EC-Council 认证安全分析师 (ECSA)`
    和 `注册信息安全专业人员 (CISSP)` 认证。


    ### 安全顾问

    安全顾问也被称为网络安全专家，他们了解网络安全的一切。他们可以分析风险和问题，并为其他组织提供适当的解决方案，以加固其基础设施并保护数据。有些组织对这一角色使用不同的名称。常用的术语包括安全顾问、网络安全顾问或数据库安全顾问。


    安全顾问被要求多才多艺，能够回答任何与网络安全相关的问题。薪资范围取决于经验，但在美国，高级安全顾问年薪可达 106,000 美元。大多数组织倾向于聘佣具有至少三到五年经验的顾问。你可以遵循以下路径成为安全顾问：


    * 攻读信息技术、计算机科学、网络安全或任何相关领域的学位。或者，你可以获得同等的行业级认证。

    * 通过通用的 IT 角色进入行业。

    * 继续在同一组织工作并不断向上晋升，直到达到安全管理员、审计师或分析师职位。

    * 获取一些行业级认证并提高你的技能。

    * 尝试转变为安全顾问职位。


    安全顾问的日常任务如下：

    * 确定保护系统、网络和数据免受攻击的方法。

    * 执行安全评估和漏洞测试。

    * 与工作人员和员工沟通以理解安全问题。

    * 使用行业标准解决方案测试安全性。

    * 监督和指导组织的安全团队。


    #### 培训

    你可以从 `CompTIA Security+` 证书开始，然后转向 `认证道德黑客 (CEH)`。高级认证包括 `网络分析师 (CySA+)`、`注册信息审计师
    (CISA)`、`EC-Council 认证安全分析师 (ECSA)` 以及 `信息安全经理 (CISM)`。要成为专家，你可以获得 `注册信息安全专业人员
    (CISSP)`。


    ### 道德黑客/渗透测试员

    渗透测试员也被称为道德黑客，了解攻击者如何思考，并通过模拟攻击来保护组织的系统、网络和敏感数据。渗透测试员在美国的平均年薪为 80,000 美元。如果你想成为渗透测试员，请遵循以下路径：


    * 攻读信息技术、计算机科学、网络安全或任何相关领域的学位。或者，你可以获得同等的行业级认证。

    * 以系统管理员、安全管理员或网络管理员的身份进入行业。

    * 获取一些行业级认证并提高你的技能。

    * 在同一组织工作直到你达到渗透测试员职位。


    渗透测试员的职责如下：

    * 对应用程序、系统和网络进行渗透测试。

    * 分析攻击者可能利用的漏洞。

    * 与团队讨论发现。

    * 设计并实施新的工具以跟上攻击。


    #### 培训

    从 `CompTIA Security+` 开始，然后转向 `认证道德黑客 (CEH)`。高级认证包括 `CompTIA 高级安全专家 (CASP)` 和
    `EC-Council 认证安全分析师 (ECSA)`。要成为专家，你可以获得 `注册信息安全专业人员 (CISSP)`。


    ### 首席信息安全官 (CISO)

    首席信息安全官职位是网络安全领域的一个高级职位。这是一个非常受尊重且回报丰厚的工作，包含了大量的权力和创作自由。首席信息安全官负责组建安全团队并对组织的安全保持宏观视角。


    美国 CISO 的平均年约为 160,000 美元。你需要通过以下方式实现这一目标：


    * 攻读信息技术、计算机科学、网络安全或任何相关领域的学位。

    * 也可以通过通用的 IT 角色进入行业。

    * 继续在同一组织工作并不断向上晋升，直到达到安全管理员、审计师或分析师职位。

    * 获取一些行业级认证并提高你的技能。


    CISO 的职责如下：

    * 创建安全策略。

    * 管理安全项目。

    * 组建安全团队。

    * 培训安全团队。


    '
