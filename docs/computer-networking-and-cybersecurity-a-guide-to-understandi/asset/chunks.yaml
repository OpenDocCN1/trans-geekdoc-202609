    # 应用服务


    此功能与我们最近探索的两个功能相似，即文件共享和打印机共享。应用服务功能允许连接到网络上的用户共享应用程序。例如，如果一家公司购买了一套受许可的软件供员工使用，那么它就可以利用计算机网络在网络服务器上生成该应用程序的共享副本，供他人使用。该功能的工作非常简单：连接到网络的工作站可以访问共享应用程序，将文件从共享驱动器加载到其系统内存中，并运行该程序。通过使用此功能，组织还可以节省工作站的有效存储空间，因为每个用户都通过访问服务器上的集中文件夹来运行程序，而不是在每台运行中的工作站上单独安装相同的程序。


    使用此功能的另一种方法是在网络服务器上建立一个共享安装点。这允许想要安装应用程序的用户直接从网络访问安装设置程序，而无需下载它或使用物理介质存储（如 CD、DVD
    等）。因此，用户可以直接将程序的安装设置程序的内容复制到他们各自的工作站上，并像往常一样安装程序。


    ## 电子邮件


    将电子邮件视为迄今出现的最资源丰富、最方便且高效的通信方式之一并不为夸张。电子邮件功能在不同的环境中都有广泛使用，无论是本地环境还是专业环境。从表面上看，电子邮件非常简单，只有一个发送者和一个接收者。尽管这涵盖了它的核心，但我们将用更技术术语来探索电子邮件功能。


    通常，有两种电子邮件系统。一种是基于文件的电子邮件系统，另一种是基于客户端-服务器的电子邮件系统。大多数人熟悉的是客户端-服务器的电子邮件系统，但我们稍后会讨论它。首先，我们将讨论基于文件的电子邮件系统是如何工作的。基于文件的电子邮件系统由一个服务器和一个称为
    `gateway server`（网关服务器）的主机组成。服务器定义了一个由共享文件组成的存储位置。服务器负责向授权用户提供这些文件的访问。然而，处理服务器与外部用户之间的连接请求归
    `gateway server` 管，它实际上是一台计算机。这台计算机运行名为 `gateway software`（网关软件）的特殊软件来处理此工作，服务器和网关服务器的统一构成了基于文件的电子邮件系统。


    但基于客户端-服务器的电子邮件系统更加简洁、更流畅、更强大，最重要的是安全。这种电子邮件系统还具有扩展功能；例如，在公司中，他们可以自动化电子邮件系统以自动生成发票并进行购买。众所周知，此类电子邮件系统必须经过适当配置才能实现这些功能。客户端-服务器的电子邮件系统由一个服务器组成，负责统一管理网络上的外部和内部电子邮件互连。该电子邮件系统还存储了消息。客户端-服务器电子邮件系统的示例有
    `Microsoft Exchange` 和 `Lotus Notes`。


    到为止，我们主要讨论了大型企业中的这两种电子邮件系统。然而，电子邮件功能对于小型公司和组织（例如员工少于 25 人的公司）同样重要。对于此类公司来说，购买整个电子邮件系统并对其进行维护相对昂贵，并且需要大量人力进行适当维护，因此使用电子邮件系统超出了他们的能力范围。然而，对于此类情况还有另一种可行的替代方案。这包括使用一个并非主要由组织内部托管和维护的电子邮件系统。例如：


    *   与互联网建立共享连接，以便每个使用工作站的员工都可以访问它。接下来，我们只需通过 `ISP` 为用户设置相应的电子邮件账户，或者直接使用免费且流行的电子邮件服务，如
    `Yahoo!`、`Hotmail`、`Gmail` 等。

    *   使用 `Microsoft Windows Small Business Server 2008` 作为所有工作站的专用操作系统。此操作系统包含实用的服务器工具，可以方便电子邮件系统的设置。最棒的是，该操作系统原生捆带了可以使用的
    `Exchange Server` 软件限制版。

    *   从已设置并维护高规格电子邮件系统的服务提供商订阅邮箱。采用这种方法的公司通常需要支付与其使用的邮箱数量相对应的月费。


    ## 远程访问


    计算机网络的另一个有利功能是赋予用户远程访问其特定网络资源的能力。该功能之所以如此重要，是因为用户忽略了网络的物理限制，这意味着他们不需要位于网络所在的办公室或建筑内。即使在离开办公室工作时（例如在家里或酒店），也可以远程访问他们的文件或电子邮件。然而，远程访问并不是一个简单的功能。但远程访问可以多种形式提供。为了设置和使用远程访问功能，下列表列出了几种可以实现目的的方法。


    *   使用 `Microsoft Windows Server` 操作系统建立 `RAS`（远程访问服务）连接。这种连接涉及简单的设置，仅由一个调制解调器连接到一个涉及多个调制解调器的扩展系统。

    *   使用专为此功能而设置和维护的远程访问系统。此类系统可以同时处理多个并发连接，这意味着可以轻松设置几台计算机。连接到远程访问系统的每台计算机都使用自己的网卡。

    *   通过带有特定远程访问软件（例如 `pcAnywhere` 和 `GoToMyPC`）的工作站，意图使用远程访问功能的用户只需拨入即可。

    *   为公司建立互联网连接。该公司的员工可以使用此互联网连接访问公司网络系统的可用资源。为了确保这种远程访问，公司通常会实施虚拟专用网络连接 (`VPN`）。

    *   使用运行 `Windows Server` 操作系统的工作站作为连接服务器。这可以通过安装 `Windows Terminal Services`
    等软件来实现。通过这种方式，工作站能够托管多个客户端会话，允许多个用户获得远程访问。


    # 第 5 章：常见网络协议和端口


    与涵盖了本书范围内半以上主题的上一章不同，我们将简要回顾并理解我们在网络中遇到的一些最常见的协议。网络协议既复杂又困难。我们将更复杂的细节留给本书的后续章节，转而关注网络协议的基础知识，以建立基础的概念基础。在本章中，我们主要讨论：


    *   `TCP/IP` 和 `UDP` 端口

    *   其他网络协议，如 `DNS`、`DHCP`、`HTTP`、`FTP` 等。


    ## TCP/IP 和 UDP


    `TCP` 和 `IP` 是两个协同工作的协议。每个协议的解释如下：


    1.  `TCP`：也称为传输控制协议。`TCP` 运行在 OSI 模型的传输层，它主要负责管理网络上计算机之间的连接。`TCP` 协议的消息被“封装”在
    `IP` 数据报中。


    '
