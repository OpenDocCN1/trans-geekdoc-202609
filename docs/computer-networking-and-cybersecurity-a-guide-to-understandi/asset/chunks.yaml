    # Part 1: Computer Networking An All-in-One Beginner''s Guide to Understanding
    Communications Systems, Network Security, Internet Connections, Cybersecurity
    and Hacking


    ![](Image00002.jpg)


    ## Introduction

    This book is a concoction of several computer topics that are relevant and popular
    in the modern age. Throughout this book, the reader will explore each topic with
    easy-to-understand terminology and analogies. The book starts with a descriptive
    and comprehensive insight into computer networking and then branches off to cover
    network security, network designing, and hacking. The delivery of topics is specifically
    designed to:


    * Entertain the needs of the readers.

    * Provide valuable insights into the world of computer networking in the modern
    era.

    * Deliver elaborative yet to-the-point knowledge.


    Once the computer networking portion of this book is finished, the reader will
    be greeted with the other topics in this all-in-one guide. In the ending section,
    there is an informative description of the `kill-chain` process in hacking. This
    topic is not only interesting but also informative and refers to the methods hackers
    employ when penetrating target systems and networks. So, buckle your seatbelts
    and enjoy the ride.


    ## Chapter 1: Computer Networking Basics

    In this chapter, we will explore the fundamentals and the very basic concepts
    of computer networking. By doing so, we will essentially lay a conceptual foundation
    for the reader. This will help increase the digestibility of the later discussed
    concepts and some technical details of computer networking. Hence, this chapter
    will be primarily focused on emphasizing the basic details of computer networking
    and then steadily building upon the knowledge as you learn. To start things off,
    we will go through a brief introduction of what computer networking actually is.
    Then we will delve deeper into the details solidifying the understanding of each
    concept that the reader will have successfully learned.


    ### What is Modern Computer Networking?

    The word “networking” describes a connection or set of connections between multiple
    objects. Similarly, “computer networking” refers to the interconnection of two
    or more computers together to allow for sharing resources. A network of computers
    can be established in a variety of environments, such as homes, offices, or even
    in large business organizations. Computer networking stretches even to the international
    scope where computers are connected through the `Internet`. A more subtle and
    easily observed example of computer networking is a printer or a scanner connected
    (wired or wireless) to the user''s personal computer.


    Since the fundamental purpose of computer networking is to interconnect different
    PCs, an interesting question arises; why do we need computer networking in the
    first place? The answer to this is very simple. If a person wants to watch a movie,
    a video, or even a talk show, he can do so in two ways:


    * By having a physical storage device that contains the content, viewable on his
    computer, or simply by hopping onto the `Internet` and accessing the website where
    he can find the content and view it directly from there.

    * The latter approach involves computer networking. It enables the viewer to connect
    to a remote computer server that is the host of the website allowing the visitor
    to use its resources to view his favorite content. This is just a simple example
    of how computer networking benefits an average user.


    The phenomenon of the `Internet` is a by-product of computer networking, and we
    all know what it’s like to spend a few days without the `Internet`. While we have
    discussed how big a deal computer networking is to a common person, it becomes
    even more important and crucial for big organizations and institutes such as hospitals,
    business companies, law enforcement departments, etc. These organizations rely
    on computer networking to:


    * Efficiently establish an information channel through which the entire organization
    communicates the data being gathered and modified. Computer networking has a huge
    influence on not only the professional sector but also the business sector as
    well because, without a proper networking infrastructure, the respective industry
    would essentially just collapse.


    Hence, to understand the importance and the very basic function of computer networking,
    note that computer networking is the very foundation of the `Internet` itself.
    Transferring data from one place to another is the purpose of networking. Another
    important thing we have to know about any connection is how much data it can carry
    from one place to another. This capacity to carry data is called `bandwidth`.
    If a connection has a higher capacity bandwidth, it can carry more data within
    a specific time slot. The rate at which a network can transfer data is measured
    in bits per second, which are abbreviated as `Bps`. `Bps` means how many bits
    a `bandwidth` can carry per second. In the modern age, computer technology and
    networking have come a long way; this bandwidth capacity is now measured in multiples
    of thousands. The different measures of data transfer speed are:


    * Kilobytes - thousands of bits per second (`Kbps`)

    * Megabytes - millions of bits per second, or thousands of Kilobytes per second
    (`Mbps`)

    * Gigabytes - billions of bits per second, or thousands of Megabits per second
    (`Gbps`)


    A closely related measurement you will also see in computer networking is `hertz`;
    it is the number of cycles being carried per second, in the same way `hertz` expresses
    the number of cycles per second in an alternating-current signal. Hertz is abbreviated
    as `Hz` and is used to measure the computational speed of a processor. This measurement
    is taken in multiples of thousands, and:


    * A thousand Hertz is known as a kilohertz (`kHz`)

    * A million Hertz is known as a Megahertz (`MHz`)

    * A billion Hertz is known as a Gigahertz (`GHz`)


    For example, a processor running at `100 MHz` means 100 million cycles per second.
    `Hz` and `bps` are essentially the same measurement but used for different elements.
    However, sometimes they can be mixed up. For instance, saying that an Ethernet
    cable supports a `10 MHz` bandwidth instead of `10 Mbps` is acceptable in common
    usage.


    ## Chapter 2: Networking Services Explained

    In this section, we will discuss several network protocols that either rely on
    or make use of the `TCP/IP` protocol. The protocols we will be discussing are
    listed below:


    1. `DNS`

    2. `DHCP`

    3. `HTTP`

    4. `FTP`

    5. `NNTP`

    6. `SMTP`

    '
