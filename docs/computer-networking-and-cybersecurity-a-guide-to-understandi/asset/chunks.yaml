    # Chapter Six: How to Spot and Stop a Social Engineering Attack


    Social Engineering is the process of manipulating or tricking people into giving
    you the information you need about them. Cybercriminals are looking for all kinds
    of information, but most commonly, they employ social engineering to coax you
    into disclosing your bank information, login credentials to various applications,
    or passwords to access your computer. They may use this information to transfer
    funds from your accounts to theirs or install malware on your system.


    Cybercriminals use social engineering because they know it is easier to win a
    person’s trust than hack software. For instance, they can use simple conversations
    to manipulate any victim to give you their password. They do not try to hack the
    system using a password or any other technical process. They may attack the system
    if the user has a weak password.


    The basic principle of security is to know who and what to trust. You must know
    when to trust a person and be alert when you communicate with them, especially
    online, since you cannot see them. This holds true for trusting applications too.
    You must know whether an application you download and install on your system or
    website is genuine and won’t harm you.


    Any security professional will tell businesses that the weakest point in a security
    chain is a user who accepts and trusts another user at face value. In simple words,
    it does not matter if you have top-notch security for your house with multiple
    locks, guard dogs, floodlights, alarm systems, barbed wire, fences, etc., if you
    let a stranger enter your home simply because they claim to be a plumber without
    doing any checks. In a case like this, you empowered the threat to enter your
    house.


    ## Social Engineering Methodologies


    There are three types of methodologies employed for social engineering:

    * Phishing

    * Vishing

    * Impersonation


    Phishing and Vishing were discussed in Chapter Three; however, Impersonation is
    when an attacker pretends to be someone you already know and tricks you into giving
    them access to your computer, network, etc. An attacker does a lot of research
    before using the impersonation technique to hack your accounts and systems. Attackers
    stalk people on social media and company websites and gather information about
    the victim’s friends and colleagues. They may also eavesdrop on your conversations
    and try to sniff around documents you have trashed.


    Here are a few statistics to help you understand these social engineering methods
    concerning their application in the real world.


    ### Phishing

    * Seventy-seven percent of the social engineering attacks carried are implemented
    through phishing.

    * Roughly 40 million people report phishing attacks every year.

    * Eighty-eight percent of all reported phishing was via links clicked within emails.

    * Ninety percent of all email traffic in the world is full of spam and viruses.


    ### Vishing

    * Sixty percent of adults in the USA were victims of vishing in 2012.

    * 2.4 million customers were targets of phone fraud in the year 2012.

