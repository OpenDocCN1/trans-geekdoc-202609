    \ the Middle\n\nA man in the middle attack is when a third party intercepts the\
    \ communication between two parties. There are various online channels the attacker\
    \ can hack to intercept the data, such as websites, social media, messengers,\
    \ etc. An attacker employing this attack can access your personal and business\
    \ transactions. A man in the middle attack can stop a message from reaching you\
