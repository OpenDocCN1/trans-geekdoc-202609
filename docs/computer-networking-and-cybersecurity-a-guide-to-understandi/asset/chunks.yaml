    the message, twenty-six percent of users tried to call the number, and fourteen
    percent of users replied to the text.


    ### Impersonation

    * 1.8 million people were victims of impersonation in the USA in 2013.

    * Medical identity thefts increased because of websites impersonating medical
    providers.

    * Eighty percent of thefts happened at the workplace that involved bypassing controls.

    * Eighty-eight percent of the stolen information was personal data.

    * The average age of a victim of impersonation was 42 years, and the average loss
    incurred by them was USD 4,200.


