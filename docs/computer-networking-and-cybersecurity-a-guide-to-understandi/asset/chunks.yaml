    \ We have comprehensively discussed computer networking because it is very relevant\
    \ in our modern age ruled by the Internet. We have learned about the OSI networking\
    \ model and how the different protocols and networking applications adhere to\
    \ this model. After addressing computer networking, we shifted our focus toward\
    \ network security, which is a very important topic to discuss as nobody wants\
    \ their data to be compromised and misused. In the final portion of this book,\
