    # 第五章：从勒索软件中恢复


    近年来，你可能在办公室或新闻中听过“勒索软件”（Ransomware）这个词。它到底在闹什么？也许你曾在电脑屏幕上看到过弹出窗口，说你的系统已被勒索软件感染。本章将介绍什么是勒索软件、它的类型、相关历史以及你应该采取什么措施来保护系统。


    ## 定义勒索软件


    勒索软件是“赎金”（ransom）和“恶意软件”（malware）两个词的结合。它是一种会感染你的计算机并加密其上所有数据的恶意软件，限制你对这些数据的访问。如果你希望再次访问所有数据，它就会要求你支付赎金。勒索软件最早出现在
    20 世纪 80 年代，当时通过信件（挂号）索要付款。今天，勒索软件已经演化得许多，黑客通过信用卡或加密货币索要付款。


    ## 你是如何被感染的？


    攻击者可以以不同的方式利用勒索软件感染你的系统。一种常见的方法是让你的收件箱或桌面充满恶意的垃圾邮件（也称为恶意垃圾邮件，malspam），其中用于发送垃圾邮件的媒介是电子邮件。邮件中包含恶意附件（如
    Word 文档或 PDF 文件），甚至是指向第三方网站的超链接。恶意垃圾邮件方法利用社会工程学策略，让人们相信这些邮件及其附件是真实的。黑客通过让这些内容看起来像来自受信任的来源来实现这一点。


    攻击者在勒索软件攻击中还会使用社会工程学，伪装成 FBI 来恐吓用户，并迫使他们付钱以访问自己的文件。


    恶意广告（Malvertising）是另一种流行的勒索软件感染方法，在 2016 年左右达到巅峰。正如名称所示，恶意广告利用在线广告的方法来传播勒索软件。这种类型的勒索软件与用户的互动不多。即使是今天，你可能会遇到充斥广告的网站，这些网站未经你的许可将你重定向到第三方网站。这些第三方网站会记录你所有的活动和信息，然后在你的计算机上部署恶意软件。大多数情况下，这种恶意软件结果是勒索软件。


    恶意广告利用了一种名为 `iframe` 的技术，在不可见的 HTML 元素中隐藏恶意软件。此 `iframe` 将将你重定向到一个恶意网站，恶意软件将通过漏洞工具包（exploit
    kit）方便地从该网站部署到你的计算机上。这个过程被称为“点击下载”（drive-by-download），因为这一切都是在用户不知道发生了什么的情况下。


    ## 勒索软件的类型


    勒索软件根据严重程度分为三类：


    ### 恐吓软件 (Scareware)

    恐吓软件是用于在旧安全软件上执行技术支持诈骗的勒索软件。你可能会在设备上收到弹出窗口，要求你从某个网站下载信息。弹出窗口可能会说你的系统上有病毒，于是你完全按照提示操作，结果发现系统确实感染了病毒。如果你忽略这条信息，随后会出现其他几个弹出窗口。不过，你的文件仍然是安全的。


    如果你拥有正规供应商的反恶意软件解决方案，请运行它并查看系统中是否有病毒。如果你的计算机上没有反恶意软件，在从他们提供的链接下载任何内容之前，请立即下载一个。在这种情况下，攻击者是在虚张声势，试图恐吓你，让你掉入陷阱。


    ### 锁屏 (Screen Lockers)

    这种类型的勒索软件属于橙色级或中级勒索软件。正如名称所示，这种形式的勒索软件会将目标用户锁定在系统之外。当用户尝试解锁系统时，他们只能看到美国司法部的标志或
    FBI 的标志。屏幕上的信息可能会说他们因从事非法活动被捕，因此必须缴纳罚款。


    首先，要重要的是，任何法律机构都不会将你锁定在计算机之外或要求你付款。如果 FBI 怀疑你，他们会通过法律渠道直接与你联系。如果你发现自己处于屏幕锁定且不付钱就无法进入系统，那么你的系统被黑客攻击了。


    ### 加密勒索软件 (Encryption Ransomware)

    这是最危险的勒索软件形式，因为攻击者在受害者系统上部署加密勒索软件，并加密所有文件，使受害者无法访问。然后他们要求付款以将所有文件恢复到原始状态。它被认为是最威胁性的勒索软件形式，因为文件一旦加密，解密极其困难——因为没有软件可以解密所有形式的加密。除非你想支付赎金，否则最好的假设是这些文件已经丢失。即使支付了钱，也不能保证你能拿回文件。


    ## 勒索软件历史


    勒索软件首次出现于 20 世纪 80 年代，被称为 `AIDS` 或 `PC Cyborg`。这种勒索软件每当用户重启系统时，就会加密 `C:` 目录下的用户所有文件。勒索软件在重启
    90 次后会收集所有文件，然后给用户发送一封邮件，要求他们续订许可证。他们可能会要求向 `PC Cyborg Corporation` 支付 189 美元。这是一种非常简单的加密技术，因此很容易逆向。因此，计算机科学行业的用户知道如何逆向它，但它主要影响了不精通技术的普通人。


    在接下来的十年里，出现了一些其他变体，但危险的勒索软件直到 2004 年才亮相。那一年 `GpCode` 利用薄弱的 `RSA` 加密加密了用户文件。下一个大型勒索软件出现在
    2007 年，`WinLock` 推出。与其他勒索软件不同，`WinLock` 没有加密用户文件，而是将用户锁定在系统之外。它还在用户屏幕上显示色情图像。攻击者随后会通过
    `SMS` 索要付款，以授予用户访问系统的权限。


    勒索软件在 2012 年发生演变，一种名为 `Reveton` 的勒索软件问世。这诞生了另一种被称为执法性质的勒索软件。攻击者将人们锁定在系统之外，并留下
    FBI 官方或其他执法机构的标志。屏幕上有一份声明，说你犯了犯罪，例如下载盗版内容或观看色情内容。他们还会暗示目标用户支付 100 到 3000 美元不等的罚款。有些人并不理解这一点，这种被称为“暗示罪恶”的社会工程学策略让用户怀疑自己的行为并倾向于支付赎金以结束这一切。


    加密勒索软件在 2013 年重新出现，是 `CryptoLocker`，但它危险得多。勒索软件采用了军事级加密，黑客会将密密钥存储在远程服务器上。用户在不付款的情况下没有方法恢复文件。这种类型的勒索软件今天仍然存在，某些网络攻击从中获利。近期爆发的如
    `Petya` 和 `WannaCry` 在 2017 年使用了类似的加密技术。


    随着 2018 年结束，另一种名为 `Ryuk` 的勒索软件由熟练的黑客开发，为出版物造成了麻烦。这种勒索软件攻击是针对美国的，特别是在美国。网络安全专家认为，黑客使用了
    `TrickBot` 和 `Emotet` 来针对高知名企业。直到今天，一种名为 `Sodin` 的新类型勒索软件出现，被认为是 `GandCrab` 的演变，正在制造恐慌。在
    2019 年 8 月，许多医疗机构丢失了大量数据，医院无法获取记录。攻击者利用托管服务商传播勒索软件。


    ## 如果你被感染了该


    如果你是勒索软件的受害者，遵循的准则是：永远不要支付赎金。FBI 也鼓励你不要付款。如果你支付了赎金，你是在鼓励攻击者继续策划勒索攻击。因此，只有某些勒索软件工具可以恢复或防止文件加密。如果可用解密程序，重要的是向
    IT 安全顾问寻求帮助。其他已清理勒索软件的方法包括使用反勒索软件产品扫描你的系统并移除感染。这些解决方案可能无法帮你恢复文件，但可以清理你的系统。在屏幕锁屏的情况下，尝试将系统恢复到之前的点，或尝试从可启动的
    USB 盘或 DVD 运行扫描。如果勒索软件攻击正在进行，你必须保持警惕。如果你发现系统无故变慢，最好重启系统并断开网络。这确保了恶意软件在系统启动时是不活跃的，并且无法发送或接收来自命令服务器或攻击者的指令。此时你必须安装反恶意软件解决方案并运行系统完整扫描。


    ## 如何保护自己免受勒索软件侵害


    全球大多数安全专家对于保护系统免受勒索软件侵害只有一点：他们让你防止攻击的发生。有很多方法可以应对勒索软件感染，但没有证据表明它们有效。大多数方法都需要高水平的技术知识，普通用户可能还没有准备好此类工具。因此，建议你遵循以下建议：


    第一步是购买提供实时保护的付费反恶意软件解决方案。这种解决方案还可以检测来自高级勒索软件的攻击。该解决方案还应该保护漏洞文件和软件，同时阻止勒索软件加密任何文件。一种解决方案是
    `Malwarebytes` 的付费版本，它在 2017 年保护用户免受所有类型的重大勒索软件攻击。下一步需要时间和精力。你必须定期创建数据备份并将其存储在外部介质上。另一个选择是云端解决方案。但是，在备份之后请确保断开外部设备。


    ## 谁是勒索软件攻击的目标？


    当勒索软件发明时，其主要受害者是个人用户。攻击者后来意识到勒索软件更有潜力，尤其是当他们开始针对企业时。攻击企业比攻击普通用户能获得更多钱，并造成数据和收入损失。2016
    年底，统计数据显示勒索软件检测了全球约 13% 的企业，仅占 2% 的普通用户计算机。到 2017 年，近 35% 的中小企业已成为勒索软件受害者。从地理上来说，攻击者主要在西方市场部署勒索软件，英国、美国和加拿大是他们最大的目标。研究显示，勒索软件攻击者总是选择钱的企业。这意味着他们寻找计算机和互联网普及率高且富裕的地区。预计他们很快将针对亚洲和南美市场，因为这些地区的经济增长正在回升。


