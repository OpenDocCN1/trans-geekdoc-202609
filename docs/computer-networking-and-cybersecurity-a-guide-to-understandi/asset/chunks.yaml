    # 路由器


    延续网络其他硬件组件的智能迭代链，路由器基本上是一个桥器，但它比桥器更智能，就像桥器是中继器的智能版本。正如桥器在 OSI 网络模型中的工作层比中继器高一层（数据链路层），路由器则工作在
    OSI 网络模型的第三层，也称为网络层。在将数据包传输到相应目的地方面，路由器比桥器更高效且远优。。


    由于路由器的运行位于 OSI 模型的第三层，因此 OSI 模型的上层与路由器建立连接的唯一要求是使用相同的协议。如果路由器专门为协议转换配置了配置和设计，那么它可以将从前三层（物理层、数据链路层和网络层）的任何协议翻译为同样属于这三层的任何其他协议。路由器还可以连接两个互不相似的网络（而连接相似的网络是所当然的）。


    通常，路由器最适合也常用于广域网（WAN），因为它们可以有效创建建立此类网络所需的链路。如果我们分析允许路由器有效连接两个相似或不同网络的特性，可以得出结论：路由器本质上起到了节点的作用。路由器拥有自己的网络地址，这进一步巩固了它们作为节点的功能。


    路由器接收来自其他节点的数据包。在接收数据包后，路由器分析并检查数据包的内容：只有在评估之后，路由器才会将数据包发送到目的地。这一过程需要几乎瞬间完成，以避免数据延迟。为了确保路由器快速准确地执行此任务，它们内部设计了微处理器来处理计算。通常，这种处理器是
    RISC 指令集类型的变体。此外，路由器具有内置内存来帮助路由功能。由于路由器比桥器更智能且拥有更多的计算资源；它们可以计算通往任何目的地的最短路径。此外，路由器还可以执行某些任务以实现网络带宽的最大化。路由器还可以逻辑地适应网络中的流量问题。


    ## 路由器的重要性


    说路由器成了整个互联网的骨干并不夸张。例如，考虑 `TRACERT` 命令。当你使用此命令从一个节点追踪到目的地时，我们可以看到在到达目的地之前有多个“跳”，这些“跳”是转发数据包直到其到达目的地的路由器。


    ![](img/Image00006.jpg)


    ## 配置路由器


    路由器不是预配置的。为了正确执行其任务和功能，需要对它们进行配置。例如，标准路由器配置可能包括为每个端口分配网络地址以及协议设置。路由器的配置通常通过以下两种方式完成：


    1. 通常有一个名为 `RS-232C` 的端口。通过终端仿真软件，连接计算机或终端。一旦连接，就可以以文本模式配置路由器。

    2. 除了直接从其 `RS-232C` 端口配置路由器，还可以使用带有的网络软件。通常，这种软件使用图形工具或简单的 Web 界面。


    目前大多数路由器支持这两种方法。然而，没有推荐的方法，这完全取决于安全需求以及你使用的路由器模型。在使用路由器时应小心，因为路由器的网络方法可能会被黑客利用。这允许未经授权的用户更改路由器的配置。


    # 网关


    网关是一种特定的接口。网关的主要工作是在 OSI 网络模型的所有层不同时连接它们。这种差异可以发生在单层或所有层，网关将执行其功能。


    为了更好地理解这一点，让我们来看一个例子。假设我们使用 OSI 网络模型建立了网络，但我们要连接到 IBM 的系统网络架构（也称为 `SNA`）。这两个网络是不相似的，因此为了连接它们，我们将使用网关。网关还可以将
    `Ethernet` 翻译为 `Token Ring`。然而，如果你需要这样的网络转换，还有简单的网络解决方案。由于网关上的转换负载远大于其他解决方案，网关运行相对较慢。


    如今在网络中使用网关主要是处理电子邮件。例如，网关处理的最常见的电子邮件协议有两个：

    * `POP3`

    * `SMTP`


    通常，大多数需要与不同网络连接的电子邮件系统将使用设置成网关的计算机或电子邮件服务器来执行网关任务。


    # 拓扑基础


    在讨论拓扑结构之前，让我们刷新一下“拓扑”的概念。“拓扑”意味着“形状”同样，“网络拓扑”本质指的是网络的形状（网络节点的布线布局）。


    ![](img/Image0007.jpg)


    不同的拓扑具有不同的成本、优缺点、性能、稳定可靠性。在本节中，我们将讨论今天常用的三种主要拓扑结构：


    1. 总线拓扑

    2. 星型拓扑

    3. 环形拓扑


    ## 总线拓扑


    总线拓扑也被称为“公共总线多点拓扑”。总线拓扑基本上是一种使用单端到端网络电缆的网络。在该网络电缆上，某些设备连接在电缆的不同位置，这些连接被称为“节点”。下面是总线拓扑网络的简单插图：


    ![](img/Image00008.jpg)


    然而，并没有通用的总线拓扑。相反，总线拓扑有许多类型，每种都有自己的规格。这些规格基于以下因素：

    * 单个段可以处理的节点数量

    * 通过使用中继器，可以使用的段数

    * 节点物理接近的最大限制

    * 网络段的长度

    * 所需的同轴电缆

    * 段的末端应如何终接


    通常，总线拓扑网络实现`同轴电缆`。在此类网络中，需要对网络的两个开放末端进行处理；否则网络将无法工作。网络的每个末端都使用一种特殊类型的电缆终端器。有几种不同的总线拓扑，每组使用不同类型的连接器来汇合网络电缆的不同段。例如，细型以太网
    `10Base-2` 总线拓扑网络使用一种名为 `BNC 连接器`的连接器。这种连接器也称为 `BNC-T 连接器`，因为它形状像“T”型。这种连接器允许节点（计算机或服务器）连接到网络段，同时允许网络继续其总线结构。还有不同类型的
    BNC 连接器：


    1. `BNC-T 连接器`


    '
