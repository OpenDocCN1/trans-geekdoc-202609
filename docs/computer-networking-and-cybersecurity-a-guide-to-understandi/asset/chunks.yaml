    # Layer 2: Data-Link Layer


    The second layer of the OSI networking model is the data link layer. This layer
    defines those standards which give a sense of comprehension and value to the data
    packets or bits being transmitted and received by the physical layer. The data
    link layer of the OSI model bridges the connection between the third layer (network
    layer) and the first layer (physical layer) by defining and implementing a reliable
    protocol through which the network layer transmits its data through the physical
    layer.


    The main purpose of the data link layer in the OSI model (besides linking the
    first and third layers) is to perform a data proofreading function. This is an
    informal and easy to understand way of describing the data-link layer’s secondary
    job. According to technical standards, the data link layer performs detection
    and correction of errors within the outgoing data streams. In this way, the network
    ensures a reliable and error-free stream of data. Also, the data link layer features
    a term known as ‘frames’ that refers to the data elements that are carried by
    this layer. There are multiple frames, and some of the most commonly used ones
    are:


    * `X.25`

    * `802.x` (includes Ethernet and Token Ring networks)


    In the OSI networking model, the data link layer is further divided into two sub-layers.
    These two sub-layers are:


    1. Logical Link Control (LLC)

    2. Media Access Control (MAC)


    Now, these two sub-layers collectively perform the main function of the data-link
    layer. This means that each of these two sub-layers individually performs separate
    tasks associated with the functionality of the data-link layer itself. The `LLC`
    sub-layer establishes a link and controls it, i.e., call setup and termination
    along with transferring data. Due to this, the OSI model is compatible with networks
    such as telecommunication and LAN. The `MAC` or Media Access Control sub-layer
    handles the assembly and disassembly of frames in the network, with addressing
    as well as error detection and correction. Now you can see these functions as
    the distinguishing characteristics of the data link layer itself. Here is a list
    of some of the most common MAC protocols in the second layer of the OSI networking
    model:


    1. `802.3` Ethernet protocol

    2. `802.5` Token Ring protocol

    3. `802.12` 100Base-VBG protocol

    4. `802.11` Wireless protocol

    5. `802.7` Broadband protocol


    Out of all these MAC protocols, the Ethernet and Token Ring protocols are the
    most common in computer networking.


    # Layer 3: Network Layer


    The third layer of the OSI networking model is the Network Layer. This is the
    layer where most of the crucial networking functions are performed. There are
    several functions involved in this layer, but we will only discuss the major aspects
    which have a significant impact on the working of a network. Generally, the Network
    Layer determines the path or the route by which the data packet will travel from
    one node (point) to the destination point (node) on another network. The main
    job of the network layer is to define the route through which the data packets
    will travel from network to network.


    Regarding the protocols used in the network layer, there are several, but the
    most important of them are the:


    * Internet Protocol (IP)

    * Internet Protocol Exchange (IPX)


    These protocols contain information which specifies the source and destination
    routing for the data packets. Hence, each network packet using these protocols
    can tell the network its destination based on the routing information from the
    protocol. After the data packet reaches its destination, this protocol also helps
    the receiving computer identify the source from where the data packet came. The
    Network Layer holds significant importance in the OSI model for defining the transmitting
    of data packets from a single or multi-router setup.


    Before we discuss more details about these layers, let’s also clarify the job
    of the router devices. A router is simply a piece of hardware designed to:


    * Examine each data packet

    * Transmit the data packets to their intended destination by analyzing the source
    and destination address information


    The Internet is a complex network, and a data packet being transmitted over the
    Internet might need to pass through several routers before it can arrive at its
    destination. But on a comparatively simpler and smaller network, the data packet
    might need to go through only a handful of routers or none. When analyzing the
    network layer in a little more depth, an interesting point becomes clear. If the
    Network Layer is separated from the first (Physical) and the second (Data Link)
    layers, we realize that the protocols of this layer can function independently
    of these two lower layers. To put it into simpler terms, we can use the protocols
    of this layer in any variation and effectively use it with the lower layers without
    having to establish a chain of independence. For example, if the computers share
    a commonality regarding the first two layers, then the `IP` protocol and the `IPX`
    protocols can establish a network between these two computers. If we take this
    concept and apply it to a real-world scenario, then it would mean that a data
    packet using the `IP` protocol can be transmitted over an Ethernet, Token Ring,
    or even a wired cable connecting the computers. The same holds true for data packets
    using the `IPX` protocol, with the pre-requisite because the computers both support
    the `IPX` protocol and share a commonality in terms of the lower-level layers.
    In such a scenario, a network connection can be established.


    # Layer 4: Transport Layer


    The major concern of the transport layer is mediating the movement of data between
    the different layers. For this purpose, the transport layer masks the characteristics
    of lower layers from the upper layers in the OSI model. Besides this, the major
    functions of the transport layer include:


    * **Flow Control**: directing the transmission of data between the sending device
    and the receiving device mainly to manage the influx of data that the receiving
    device experiences. The transport layer ensures that the receiving device is not
    flooded with more data than it can process.

    * **Multiplexing**: divides a physical channel into multiple logical channels,
    which makes it feasible for multiple devices or applications to transmit data
    over one physical channel (or link).

    * **Virtual Circuit Management**: Managing virtual circuits in a network in the
    sense of establishing, maintaining, and terminating the said virtual circuits.

    * **Error Checking and Recovery**: incorporating the applications of multiple
    mechanisms to achieve the function of identifying data transmission errors and
    trying to rectify this error, for instance, issuing a request to the transmitting
    device to re-send or retransmit the data.


    If we talk about the core purpose and functionality of the transport layer, then
    it would be essentially to handle the information flow that streams from one node
    to another node in a network. Like the rest of the layers we have discussed up
    till now, the transport layer differs from them in the sense that for each operating
    system, implementing the transport layer is done differently. The Transport Layer
    features a bunch of important protocols. Out of these protocols, the following
    two are used in connection with either `IP` or `IPX` data packets, respectively:


    1. Transmission Control Protocol (TCP); used with the Internet Protocol (IP)

    2. Sequenced Package Exchange (SPX); used with the Internet Protocol Exchange
    (IPX)

    '
