- raw: 'Chapter Seven: Network Security and Protection Techniques This chapter defines
    network security and the various processes associated with it. It also looks at
    the different types of cyberattacks that can affect your business and sheds light
    on how important it is to secure your network if you want to prevent a catastrophic
    loss. Network Security Network security is an umbrella term covering a variety
    of processes, technologies, and devices. Network security is the configuration
    of rules and policies in both hardware and software of any web application or
    tool to secure the integrity, accessibility, and confidentiality of computer data.
    This is closely associated with network infrastructure. Computer data and networks
    are vulnerable to numerous cyberattacks, and some of these were looked at earlier
    in the book. Therefore, every business, irrespective of its size, infrastructure,
    or industry, needs to have network security measures in place. The network architecture
    is evolving and becoming more complex every day. The threat environment is also
    constantly changing with attackers trying to find newer methods to exploit security
    vulnerabilities in the system. Vulnerabilities exist in various assets of network
    infrastructure such as data, devices, applications, and users. Given this, there
    are individual tools available to secure these assets. You can also use these
    tools to test the applications to ensure the business meets with the regular compliance
    terms. Network security is of the utmost importance as even a few minutes of downtime
    can damage the organization’s reputation and finances. How Does the Network Security
    Function? Network security across an organization has multiple layers. An attacker
    can target any layer in the network security model. Therefore, businesses need
    to define network security models for both hardware and software to tackle the
    vulnerable areas. There are three aspects to network security: physical, technical,
    and administrative. Physical Network Security This aspect deals with different
    types of physical access to network-related devices such as cables, modems, switches,
    and routers. An organization must ensure only authorized employees, especially
    those who are a part of the IT or network team, have access to these components.
    Some common ways in which the business can authorize access is through biometrics,
    security locks, etc. Technical Network Security This aspect deals with the protection
    of data stored on a network or in transit via the network. The business must include
    twofold protection to protect data and its associated systems from unauthorized
    access. Care should also be taken to protect data against malicious activities
    from internal employees. Internal employees may not do it intentionally, but actions
    such as using a personal USB drive on company property can be a threat. Administrative
    Network Security This aspect deals with processes and security policies to keep
    user behavior in control. This includes the authentication of users and the level
    of access based on the role and designation of the user in the organization. For
    example, a management bank user does not need technical access to a server or
    network device. Top Five Attacks Through a Network that can Affect Your Business
    The previous chapter briefly discussed the different types of cyberattacks. This
    section discusses the top five cyberattacks through a network that can destroy
    your business. From scheduling recruitments to customer relationship management,
    most organizations perform all their tasks online. Automation has reduced human
    effort and made processes much more efficient and convenient, opening up a window
    of opportunities for cyberattackers. A report released by the Center of Strategic
    and International Studies states that the damage caused by cyberattacks is $600
    billion annually. The evolution of technology has led to the development of new
    methods for attackers to scam a business. Here are the top five cyberattacks that
    businesses have to deal with. Advanced Persistent Threat (APT) This attack’s objective
    is to scan the organization’s network and software for vulnerabilities and use
    those vulnerabilities to steal data. An advanced persistent threat can go undetected
    for a long period. This attack was first introduced by attackers who wanted to
    steal government information. Attackers now use this method to steal sensitive
    information from organizations and claim ransom. Some indicators to help you determine
    whether your organization is a victim of an advanced persistent threat are as
    follows: ● Irregular flow of information – You may notice that the infrastructure
    is witnessing a sudden increase in inbound or outbound traffic. The flow of data
    has an irregular pattern, and this can happen between networks, servers, or server
    to client connections. ● Data bundle usage – An advanced persistent threat collates
    stolen data before transferring it to the desired computer. If you observe huge
    volumes of data or compressed data being transferred through your network, it
    indicates that your network may be infected. ● Increased number of user logins
    during unexpected hours. ● When you discover backdoor Trojans on the network and
    associated devices. Denial of Service Attack (DoS) A denial of service attack
    is an attack to prevent access to a genuine user from services, such as bank accounts
    or email accounts. An attacker attacks the network and server and floods the bandwidth
    with unnecessary requests. The motive of a Denial of Service attack is not to
    steal any information but to prevent access to the server or website. The business
    may incur huge financial losses due to this business. Assume that a user is trying
    to access their online bank account. They are unable to do so, despite having
    good internet connectivity. This indicates that the service is under a DoS attack,
    and genuine users are blocked from accessing their accounts. Internet of Things
    (IoT) Hacking Internet of Things refers to the devices connected to the Internet
    either directly or indirectly. When business setup is mentioned, it includes various
    IoT devices such as thermostats, locks, cameras, etc. An attacker can leverage
    IoT devices to attack a business. For instance, there are several IoT devices
    that businesses forget to update with the security and contain many vulnerabilities.
    Say an employee connects their smartwatch to a computer at work. If the smartwatch
    has vulnerabilities, the attacker can exploit those to access the entire infrastructure
    at work. It would make sense to uninstall applications on old and unused IoT devices
    to ensure an attacker cannot take advantage of them. Structured Query Language
    (SQL) Injection Structured Query Language (SQL) Injection is a hacking method
    discovered years ago but is still effective today. SQL is a language operated
    on databases and tables programmed in Oracle, MySQL, or Microsoft SQL. The injection
    affects any application that uses one of these databases, but attackers target
    websites that employ these databases. Many cases of SQL injection attacks have
    happened in the past decade. If an SQL injection attack is successful, the attacker
    can modify a website’s content and retrieve sensitive information, such as user
    account details. There are two stages to an SQL injection. In the first stage,
    the attacker observes the target infrastructure and gathers as much knowledge
    about it as possible. This stage is also known as Reconnaissance. The next stage
    is the attack stage, where the attacker uses the information collected to break
    into the target system. In an SQL injection attack, the attacker embeds malicious
    code in an SQL command to execute their commands. Man in the Middle A man in the
    middle attack is when a third party intercepts the communication between two parties.
    There are various online channels the attacker can hack to intercept the data,
    such as websites, social media, emails, messengers, etc. An attacker employing
    this attack can access your personal and business transactions. A man in the middle
    attack can stop a message from reaching you or redirect it to someone else. This
    is why most communication applications use end-to-end encryption. This means that
    when you send a message, an algorithm converts plain text into encrypted characters.
    Once the recipient receives this script, the algorithm on their device decrypts
    the characters into plain texts again. This way, the information, even if intercepted
    by someone in the middle, is useless since they do not know how to decrypt it.
    These are some of the common attacks businesses fall prey to. The next section
    looks at different methods you can use to protect your business. Protecting your
    Business from a Cyber Attack Multiple businesses are hit by cyberattacks regularly.
    Most attackers target those businesses with outdated security features. Here are
    the various ways through which you can avoid cyberattacks. You can classify these
    methods into the following types: ● Cybersecurity through hardware ● Cybersecurity
    through configurations and settings Cybersecurity through hardware Security Keys
    You may have heard a friend or team member say they have the same password for
    all their accounts. They may also say their password is their birth year or other
    simple words. Therefore, without a doubt, the biggest vulnerability in the cybersecurity
    domain is people. The tool Yubikeys allows employees to access their accounts
    without using a password. They also do not have to manage the number of passwords
    they need to change. Such applications gain a lot of popularity since attackers
    can use brute force attacks to hack this software. They may use a different combination
    of letters, numbers, and characters until they find the right password. Businesses
    should purchase a key for all employees or team members working on sensitive projects.
    When they do this, they can plug the key into a device and access the required
    tools, applications, documents, etc. Many times, an attacker can also trick an
    employee through phishing to obtain sensitive information. Attacks that lead to
    maximum damage are results of traps set through social engineering that bypass
    security flags, and those that do not set off any alarms. An experienced attacker
    tries to learn about an employee and get to know intricate details about them.
    They may obtain information about the people they communicate with regularly.
    The attacker then disguises themselves as someone the victim knows and sends you
    an email from an ID similar to the acquaintance’s email. The attacker can use
    these emails to coax you into clicking malicious links to obtain information about
    the victim. Yubikeys can help avoid such scenarios and provide additional security
    features, such as identifying malicious files or links. VPN Firewalls You protect
    your house from thieves by locking the doors and windows. This also helps you
    safeguard the people at home. You must maintain these locks on your system and
    network to prevent unauthorized access to your system and network. Senior leadership
    teams find it surprising when security teams advise them regarding a physical
    piece of security equipment. Most retaliate with questions like, “Doesn’t my computer’s
    built-in firewall protect me?” Yes, but it does not guarantee the security demands
    of a business. All communication irrespective of the location can be encrypted
    using a VPN Firewall. You may be seated in your office or coffee shop and still
    maintain a secure connection with the Internet. A firewall can maintain secure
    communication lines with anybody you want to speak with. This helps tackle Remote
    Desktop brute force attacks, which is the most common type of ransomware attack.
    A VPN firewall also monitors and logs break-in attempts and provides features
    to filter employees’ access, so they do not access harmful websites. You can save
    costs by purchasing a refurbished firewall. However, after the purchase, ensure
    it is updated with the latest firmware before adding employees to the security
    policies. Make sure to change the default password of the firewall and configure
    two-factor authentication for admin access. Nowadays, many firewalls also have
    a software component for employees to install on their official devices. This
    process may increase the login process time by a few seconds but ensure better
    security. Cybersecurity through Configurations and Settings Multi-factor Authentication
    Most applications offer two-factor authentication, but users are very reluctant
    to use it. However, this security setting is very effective and much needed today.
    Here is how it works. The user first logs in to their application using their
    username and password. After this, the system or application triggers a one-time
    temporary password, which is sent to another device connected to the application
    and user, like their smartphone. The user can only access the application once
    they enter this password. This cuts out the risks from the probability of an attacker
    having acquired the user’s username and password via methods such as email phishing,
    malware, or keyloggers. This means the attacker enters your username and password
    but does not receive the one-time password. This blocks the attacker from the
    application. The application may send a notification to the user if the attacker
    tries to hack the application multiple times. Password Vault Since users access
    multiple applications, they must maintain different passwords, but most users
    use the same password across all applications and devices. They do this so that
    they do not forget the password. There are password vault applications available
    today that allow users to store their passwords. That way, you must remember one
    password for the vault. The password vault has features to create complex passwords,
    manage, and auto-fill passwords into forms, applications, websites, and system
    logins. These passwords are random and complex and, therefore, difficult for an
    attacker to crack. Auto Updates As mentioned earlier, most businesses do not update
    their software and applications, which makes the system and network vulnerable
    and prone to attacks. Software providers regularly provide patch and software
    updates to maintain the security of the applications. Whenever a new vulnerability
    is discovered in the software, vendors create a patch for it to secure the application
    or software. Therefore, if you do not update the software regularly, you leave
    the software and application open to any incoming attack. Thus, it is wise to
    leave all your software on auto-update, so it automatically downloads any patch
    developed by the vendor to cover the vulnerability. Full Disk Encryption Every
    device part of a business must always be fully encrypted. This means that devices
    such as mobiles, laptops, hard drives, and network storage must always have an
    encryption layer. Since most businesses allow employees to work from home, they
    need to ensure any business devices and data are encrypted. For a low cost, full
    disk encryption ensures that your data is secure if it is ever stolen. Malware
    Scanners Malware scanners are available at low costs and help to detect any malware
    threats. The market offers different types of malware scanners, and these are
    classified based on their functionality and price. As discussed previously, it
    is important to regularly update your malware scanner to ensure that it detects
    new vulnerabilities. IP Address Lockdown Whenever you work on online applications,
    it is important to lock the IP addresses down, especially those that access the
    application. Additionally, you can add two-factor authentication to the application
    to determine if the user is accessing it. It is better to use a multi-factor authentication
    before you give the users access to the system. If you use third-party applications
    for business purposes, it makes sense to lock the IP addresses that have access
    to the applications down too. This helps prevent logins from unauthorized IPs,
    and these IPs belong to attackers from other countries or regions. System Backups
    If you grow crops but do not build a fence around the farm, you allow people to
    tread on the crops or allow rodents to enter and damage your crops. Similarly,
    if you have a lot of data, ensure you protect it from attacks and disasters by
    maintaining a backup. Do this routinely and store the backups on encrypted disks
    on a different network altogether. Ensure that backup devices do not operate using
    the same login credentials as other devices. Create and maintain different passwords
    for backups so that attackers cannot crack them easily. Security Training Create
    training routines for your teams and teach them the best security practices. A
    small fifteen-twenty minute training video on subjects such as phishing, spoofing,
    social engineering, etc. can help employees learn about various types of cyberattacks.
    Office 365 If your organization uses Office 365, make sure to check out the Office
    365 Secure Score tool. The tool goes through the active settings and configurations
    to generate a security score for you. Based on the security score, it also gives
    you suggestions on what you need to do to get a better security score. A better
    security score indicates that your network and tools are secure. G-Suite Many
    businesses today use G-Suite for email solutions. Google has placed all security
    measures in place, so it triggers a notification every time it sees unusual activity
    happening on any of your accounts. For example, log in through a different device
    or IP address. Continuous Evolution It is important for every business, regardless
    of whether it is a big or small organization, to learn more about the latest cybersecurity
    practices and newly emerging threats in the information world. Therefore, keep
    your business and employees updated about security policies, hardware, and software
    related to your organization. With all these settings and configurations in place
    for your business, you will have a better grip on your business infrastructure.
    That way, you can effectively identify a potential threat when you experience
    an attack or even before you have been hit. Some Tips to Maintain Cybersecurity
    This section lists some tips to help you maintain cybersecurity in your personal
    systems. This chapter helps you understand how businesses can maintain network
    and application security. Hackers Will Target You You cannot pretend that a hacker
    may never attack your system or network. You must remember that every individual
    is at risk, and the stakes are always high. A hack can harm your personal and
    financial wellbeing, and ruin your reputation or even the business. Thus, cybersecurity
    is every individual’s responsibility. Follow the tips mentioned in the book and
    remain vigilant. You must do your part to protect yourself, the business, and
    others. Always update the software when you install any software or applications
    on your system. Always remember that the programs and operating systems are critical
    to management. You must install the security updates for all software and applications
    on your device. All you must do is turn on the automatic updates feature in the
    application, so the updates are automatically downloaded onto your system. Ensure
    that you update your browsers and any plug-ins. Be Wary of Phishing Scams As mentioned
    earlier, a phishing scam is a threat, and attackers may use various social engineering
    techniques to trick you into providing personal and sensitive information that
    can lead to both personal and financial losses. We also discussed the different
    types of phishing scams that attackers can perform. Always be suspicious about
    any email message or phone call where they ask you for too much information. If
    you are unsure about what to do when you receive phishing emails or messages,
    refer to the earlier chapters to learn more about them. Always Maintain Strong
    Passwords Every user has many passwords to use and manage, and it is always easy
    to take some shortcuts. Some users reuse their old passwords, and this is a very
    unwise thing to do. Password management programs help you maintain unique and
    distinct passwords across different accounts. If you do not know what type of
    password to maintain, use these tools to generate strong passwords. These applications
    may also remind you to update your passwords periodically. Watch what You Click
    Do not visit unknown websites, and never download any software or application
    from these sources unless you know what they are for. These websites host malware
    and are automatically installed on your system when you download the application.
    If you find the link or attachment suspicious or unexpected, you should not click
    on it. Do Not Leave Devices Unattended Technical security is one aspect of your
    devices, but there is also physical security that you must consider. When you
    leave your phone, tablet, or laptop in a public space without locking it, anybody
    can access the information on those devices. If you protect data on an external
    hard drive or flash drive, you must ensure it is locked and encrypted. Always
    lock the screen of your desktop or laptop when you do not use it. You must understand
    that security experts can only do so much. If you do not help them protect the
    systems and network, there is no way the business is safe. The attacker can hack
    the system and obtain the necessary information. Use the tips mentioned in this
    chapter to prevent any attacks caused due to your mistakes. '
  fmt: "\n# Chapter Seven: Network Security and Protection Techniques\n\nThis chapter\
    \ defines network security and the various processes associated with it. It also\
    \ looks at the different types of cyberattacks that can affect your business and\
    \ sheds light on how important it is to secure your network if you want to prevent\
    \ a catastrophic loss.\n\n## Network Security\n\nNetwork security is an umbrella\
    \ term covering a variety of processes, technologies, and devices. Network security\
    \ is the configuration of rules and policies in both hardware and software of\
    \ any web application or tool to secure the integrity, accessibility, and confidentiality\
    \ of computer data. This is closely associated with network infrastructure.\n\n\
    Computer data and networks are vulnerable to numerous cyberattacks, and some of\
    \ these were looked at earlier in the book. Therefore, every business, irrespective\
    \ of its size, infrastructure, or industry, needs to have network security measures\
    \ in place. The network architecture is evolving and becoming more complex every\
    \ day. The threat environment is also constantly changing with attackers trying\
    \ to find newer methods to exploit security vulnerabilities in the system. Vulnerabilities\
    \ exist in various assets of network infrastructure such as data, devices, applications,\
    \ and users.\n\nGiven this, there are individual tools available to secure these\
    \ assets. You can also use these tools to test the applications to ensure the\
    \ business meets with the regular compliance terms. Network security is of the\
    \ utmost importance as even a few minutes of downtime can damage the organization’s\
    \ reputation and finances.\n\n## How Does the Network Security Function?\n\nNetwork\
    \ security across an organization has multiple layers. An attacker can target\
    \ any layer in the network security model. Therefore, businesses need to define\
    \ network security models for both hardware and software to tackle the vulnerable\
    \ areas. There are three aspects to network security: physical, technical, and\
    \ administrative.\n\n### Physical Network Security\n\nThis aspect deals with different\
    \ types of physical access to network-related devices such as cables, modems,\
    \ switches, and routers. An organization must ensure only authorized employees,\
    \ especially those who are a part of the IT or network team, have access to these\
    \ components. Some common ways in which the business can authorize access is through\
    \ biometrics, security locks, etc.\n\n### Technical Network Security\n\nThis aspect\
    \ deals with the protection of data stored on a network or in transit via the\
    \ network. The business must include twofold protection to protect data and its\
    \ associated systems from unauthorized access. Care should also be taken to protect\
    \ data against malicious activities from internal employees. Internal employees\
    \ may not do it intentionally, but actions such as using a personal `USB drive`\
    \ on company property can be a threat.\n\n### Administrative Network Security\n\
    \nThis aspect deals with processes and security policies to keep user behavior\
    \ in control. This includes the authentication of users and the level of access\
    \ based on the role and designation of the user in the organization. For example,\
    \ a management bank user does not need technical access to a server or network\
    \ device.\n\n## Top Five Attacks Through a Network that can Affect Your Business\n\
    \nThe previous chapter briefly discussed the different types of cyberattacks.\
    \ This section discusses the top five cyberattacks through a network that can\
    \ destroy your business. From scheduling recruitments to customer relationship\
    \ management, most organizations perform all their tasks online. Automation has\
    \ reduced human effort and made processes much more efficient and convenient,\
    \ opening up a window of opportunities for cyberattackers. A report released by\
    \ the Center of Strategic and International Studies states that the damage caused\
    \ by cyberattacks is $600 billion annually. The evolution of technology has led\
    \ to the development of new methods for attackers to scam a business. Here are\
    \ the top five cyberattacks that businesses have to deal with.\n\n### Advanced\
    \ Persistent Threat (APT)\n\nThis attack’s objective is to scan the organization’s\
    \ network and software for vulnerabilities and use those vulnerabilities to steal\
    \ data. An advanced persistent threat can go undetected for a long period. This\
    \ attack was first introduced by attackers who wanted to steal data. Attackers\
    \ now use this method to steal sensitive information from organizations and claim\
    \ ransom. Some indicators to help you determine whether your organization is a\
    \ victim of advanced persistent threat are follows:\n\n- Irregular flow of information:\
    \ You may notice that the infrastructure is witnessing a sudden increase in inbound\
