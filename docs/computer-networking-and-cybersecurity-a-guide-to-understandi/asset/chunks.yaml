- raw: "After answering these questions, you will get the majority of the network\
    \ demands. These sections provide a guideline on how to approach the network design\
    \ process by assessing the network’s needs. Applications A productive approach\
    \ towards assessing the network needs is to understand the applications supposed\
    \ to be run on the network. The productivity of the network in helping its users\
    \ defines a good network, and designing such a network is directly related to\
    \ accurately estimating its usefulness. Most users on the network will be using\
    \ software applications. Hence it is very important to make sure that the network\
    \ supports these applications. In networks, some applications are common among\
    \ the different departments of a company, and some applications are specific to\
    \ a certain department or a certain user. Here’s a list of some applications commonly\
    \ installed for all the users in a network. \n\n*   A Word processor \n\n*   A\
    \ spreadsheet program \n\n*   End-user database \n\n*   A graphical presentation\
    \ program \n\n*   E-mail application \n\n*   Anti-virus software \n\nAfter listing\
    \ the applications installed for every user, the person designing the network\
    \ needs to determine how these applications will be used, and how often they will\
    \ be accessed. For instance, a company of over 1,000 employees will likely have\
    \ over 90% of its populace using a word processor. Now you just estimate the number\
    \ of documents created by each user per month, the average size of the document,\
    \ and the average storage time for each document (usually either dating to 2 years\
    \ or indefinite). By making these educated guesses, we can estimate the demand\
    \ of the users from the network based on the average size of the documents created\
    \ by the users if they wish to transfer such documents over the network. You repeat\
    \ this process of estimation for the other applications. By doing this, you will\
    \ end up with a safe guess of what’s the storage and bandwidth capacity required\
    \ for the network. Once we are done with the common applications, we move on to\
    \ the department and user-specific applications. For new companies, this step\
    \ is relatively hard. The person designing the network will be ambiguous about\
    \ the applications used by the departments unless they are informed about it.\
    \ Similarly, for companies around for a while, the network designer will already\
    \ know these specific applications that the network must support. It is very important\
    \ to know about the impact of each departmental application as it can have a considerable\
    \ impact on the network. For instance, a department related to accounting will\
    \ most likely revolve around shared database files. The network design for such\
    \ a system must differ from the standard client-server design. Here is a list\
    \ of some of the most common categories of departmental applications. \n\n*  \
    \ Accounting \n\n*   Distribution and Inventory control \n\n*   MRP or Material\
    \ Requirement Planning \n\n*   IT \n\n*   Electronic commerce \n\n*   Human resources\
    \ \n\n*   Payroll and stock administration \n\n*   Publishing \n\n*   Marketing\
    \ \n\n*   Legal \n\nAssessing these specific categories of applications is the\
    \ same as the common applications. Users Once we are done with estimating the\
    \ application that the network must support, we can now work toward assessing\
    \ the number of users that the network must also support along with the applications\
    \ used by each user. Assessing the total is relatively easier. The company itself\
    \ can provide this information, or you can infer it from their business plans\
    \ and the long-range budget. While designing a network, one should also factor\
    \ in the growth capacity of the company, i.e., the network should be capable of\
    \ supporting new users that join the company in the coming years. By studying\
    \ the growth rate of the company, this demand can also be factored in while designing\
    \ the network. Besides estimating the number of users that will be on the network,\
    \ we also need to factor in some important questions about the users, which have\
    \ been listed below. \n\n*   The Bandwidth Requirement: Aside from the normal\
    \ use of network services, does any user have significant bandwidth requirements?\
    \ \n\n*   Storage Requirement: Are there any users with significant storage requirements\
    \ besides the general requirement of the majority of the users? For example, if\
    \ the electronic imaging department needs to catalog many documents into an image\
    \ file format on the network’s server, then how many users will need to access\
    \ this cataloged data? \n\n*   Service Requirement: Are there any users in the\
    \ company that need access to additional network services that most users normally\
    \ do not? This question can be related to a group in a company that deals with\
    \ sensitive data and needs to be partitioned from the rest of the groups on the\
    \ local area network by using a network firewall. \n\nNetwork Services While designing\
    \ the network, consider the range of network services. For different companies,\
    \ the requirement for network services is also different. For instance, if a company\
    \ requires a simple network setup, then it might only need simple network services\
    \ such as file and print services along with an Internet connectivity service.\
    \ But a complex network setup will include many other network services. Here’s\
    \ a list of the network services that should be considered when designing a network\
    \ for the company. \n\n*   File and print services \n\n*   Backup & restore services\
    \ \n\n*   Internet connectivity \n\n*   FTP & telnet \n\n*   Web browsing and\
    \ external e-mail services \n\n*   Internet security \n\n*   Remote access services\
    \ \n\n*   DHCP services \n\n*   Centralized anti-virus services \n\n*   WAN services\
    \ to other places \n\n*   Streaming services \n\n*   VoIP \n\nThere are three\
    \ main aspects you must know for each of the network services. \n\n1.  The storage\
    \ and bandwidth needed by each service. \n\n2.  Knowing the way these services\
    \ will be provided to the users. Knowing the server that will host these services.\
    \ Each server needs to be set up. \n\n3.  The network service requirement of the\
    \ users or groups in the company. The company will not require every network service\
    \ to be available for the users. Other times, there will be users or groups within\
    \ the company that will need access to specific network services as opposed to\
    \ the general populace of the company. \n\nMeeting the Network Needs Once we are\
    \ done with the assessment of the network requirements, the next thing to do is\
    \ ensure these requirements are met. This step of the network designing process\
    \ basically depends on the experience and resourcefulness of the person in charge\
    \ of designing. There is no defined series of steps that, when followed, will\
    \ give us a definite answer in what to do. Instead, you need to map the entire\
    \ network to paint a portrait of what the network will be like. The foundation\
    \ of this portrait will be the knowledge you have gained up to now in the assessment\
    \ step of the network designing process. Another good practice is to seek feedback\
    \ on your network design from networking professionals that have loads of experience\
    \ in this field. Gathering advice from different critics and implementing it in\
    \ your design may be the recipe for successful network design. The Basics of Hacking:\
    \ The Kill Chain Process The main focus of hacking is usually penetrating a network\
    \ or a user account. The latter is simpler as several techniques can be used to\
    \ approach hacking someone’s account, such as using a brute force attack. In this\
    \ book, we will discuss hacking regarding penetrating a network. However, we cannot\
    \ cover every aspect related to hacking because an entire book can be written\
    \ on this topic alone. Hence, we will only go through the main process of hacking,\
    \ i.e., the Cybersecurity kill-chain process. A Cybersecurity kill chain process\
    \ has eight essential steps, and these are: \n\n1.  Reconnaissance \n\n2.  Intrusion\
    \ \n\n3.  Exploitation \n\n4.  Privilege Escalation \n\n5.  Lateral Movement \n\
    \n6.  Obfuscation \n\n7.  Denial of Service \n\n8.  Exfiltration "
