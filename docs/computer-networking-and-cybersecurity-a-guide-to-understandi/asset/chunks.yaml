    # 第八章：Web 应用程序与智能手机安全


    上一章探讨了组织如何保护其系统和网络的安全。但这些足够了吗？或者是否需要更多的保护？安全流程究竟在何处终结？技术的进步促进了 Web 应用程序的发展。今天，大多数企业都有
    Web 应用程序，许多企业还使用云端安全地存储数据。自现代 Web 2.0 诞生以及基于 `HTML5` 的 Web 出现以来，客户的需求不断演变。客户希望随时随地访问数据和信息。所有这些需求给企业带来了压力，迫使其将数据迁移到
    Web 应用程序和云端。例如，银行和购物业务已经转向在线。你不再需要亲身走进银行或超市。这为客户生活带来了便利，因为他们可以舒服地待在沙发上完成事务，但它也存在一些缺点。这增加了黑客进行网络攻击或尝试攻击的次数。这导致了安全领域引入了另一个章节，即
    Web 应用程序安全。本章将介绍 Web 应用程序安全、关于它的一些误区以及企业如何利用 Web 应用程序防火墙让攻击者远离其业务。


    ## Web 应用程序安全


    Web 应用程序防火墙或 `WAF` 是一种在应用层工作的安全协议，用于过滤 `HTTP` 和 `HTTPS` 流量，从而提供免受应用层攻击者攻击的安全。简单来说，如果攻击者试图利用
    Web 应用程序中的已知漏洞，它可以阻止此类攻击并保护网站或应用程序免受攻击。然而，这个过程也有一些缺点。以下是一些局限性：


    *   **它只能检测已知漏洞**：Web 应用程序防火墙在设置中配置了某些规则。它匹配 Web 流量规则，并根据流量是否匹配这些规则对应用程序进行分类。基于此，Web
    应用程序防火墙无法保护你免受 Web 应用程序中新发现的漏洞。然而，Web 应用程序防火墙对于拒绝攻击是有效的。

    *   **它的好坏取决于管理员**：Web 应用程序防火墙的规则是由用户配置的。这意味着它的性能取决于链中最薄弱的一环以及配置防火墙的用户。很难判断系统中是否存在问题。因此，如果一个经验丰富的用户没有配置
    Web 应用程序，它可能完全毫无用处。

    *   **不修复 Web 应用程序中的安全问题**：你必须理解，Web 应用程序不会自动修复代码。所以，如果应用程序中存在漏洞，它只能根据配置的规则保护这些漏洞不被攻击者发现。代码仍然需要人类开发者来修复。

    *   **Web 应用程序防火墙是一个普通应用程序，也有自己的漏洞**：Web 应用程序防火墙是一种软件，与其他任何应用程序一样，面临安全问题。在某些情况下，攻击者通过漏洞获取
    Web 应用程序防火墙的管理员权限并将其关闭。他们还会侵入应用程序防火墙。因此，Web 应用程序防火墙是额外的安全层，但不是解决方案。


    为应用程序配备 Web 应用程序防火墙 (`WAF`) 是一种良好的做法，但如果预算允许，应用额外的安全层总是好的。关注系统或 Web 应用程序中的漏洞并修复它们，无论是否存在
    Web 应用程序防火墙都非常重要。企业应该将 Web 应用程序漏洞测试作为产品质量测试过程中不可或的一部分。


    ## 如何保护 Web 应用程序？


    要了解 Web 应用程序是否完全安全，你必须在攻击者发现并利用漏洞之前。你应该在整个软件开发生命周期中对 Web 应用程序进行漏洞测试，而不仅仅是在应用程序上线时。测试
    Web 应用程序漏洞有多种方法。你可以使用以下任何方法：


    *   使用黑盒扫描器扫描 Web 应用程序。

    *   使用白盒扫描器自动检测应用程序代码中的问题。

    *   手动审计应用程序的源代码。

    *   进行手动渗透测试和安全审计。


    你不能只用一种方法来测试系统的漏洞，因为没有一种方法可以测试出所有的漏洞。每种方法都有优缺点。例如，与手动测试相比，自动化工具可以发现几乎所有的代码漏洞，但它无法检测任何逻辑漏洞。工具无法像攻击者那样思考，需要人工干预来识别代码中的漏洞。相反，手动识别漏洞可能花费大量的时间、精力和资金，无法保证测试人员识别了系统所有的漏洞。


    在没有时间限制的情况下，建议使用所有可用工具来测试 Web 应用程序，但这只发生在理想情况下。因此，事实上，企业需要根据时间和资金选择最有效的解决方案来模拟攻击。大多数企业使用被称为黑盒扫描器的
    Web 应用程序扫描器。不言而喻，手动审计应该遵循自动化 Web 应用程序扫描器。这确保技术和逻辑漏洞都能识别。


    ### 漏洞扫描器


    黑盒扫描器（也称为 漏洞扫描器）是用于扫描网站和 Web 应用程序漏洞和其他安全问题的自动化应用程序。漏洞扫描器变得流行是因为它们易于使用并能使整个扫描过程自动化。如果你使用白盒扫描器，你需要访问底层代码并寻求理解应用程序的人的帮助。但对于黑盒扫描器，任何具备基本知识的人都可以操作漏洞扫描器并测试
    Web 应用程序。


    如何选择正确的漏洞扫描器？互联网上有大量的漏洞扫描器，分为商业的和免费的。选择最适合你应用程序的扫描器是困难的。因此，在选择之前你必须测试所有可用的扫描器。第一个显而易见的问题是使用免费的扫描器还是商业付费的？建议始终使用商业扫描器，因为它们有定期更新、专业培训团队的支持等。然后你可以根据以下标准选择漏洞扫描器：


    *   **它识别 Web 应用程序攻击的能力如何**：在测试扫描器时，仔细检查哪种最好。扫描器是扫描攻击者可以发起攻击的所有入口点的关键组件，因为只有识别入口点更容易发现漏洞。要理解哪种最好，请分析每个扫描器的结果。使用以下参数：1.
    扫描的页面数量；2. 使用的文件数量；3. 扫描期间包含的各种参数。扫描器无法扫描整个 Web 应用程序表面，这通常发生在必须手动配置时，导致了下一点。

    *   **Web 扫描器的易用性**：虽然大多数黑盒扫描器是自动配置扫描 Web 应用程序的，但某些可能需要你手动指定某些参数。根据业务需求，扫描器应该是易用的，这样任何具备基础编程或技术的人都可以配置。易用的漏洞扫描器帮助企业节省资金，因为他们不需要雇佣专家。

    *   **识别漏洞的能力**：下一个标准是看哪些漏洞扫描器可以识别最多的漏洞以及有多少是误报。漏洞扫描器会发现数千个漏洞，但超过 60%是误报。你可能会问为什么有问题？误报的问题在于手动审计员必须花费更多时间来验证漏洞是否真的是漏洞。这是资源的浪费，因此需要避免。

    *   **自动化**：漏洞扫描器的自动化程度越高，公司的负担越大。这意味着测试人员不需要手动配置每个参数，因为扫描器已经配置为扫描已知漏洞。Web 应用程序中的漏洞比看到的多，即使有时间限制，人们识别每一个漏洞也是可能的。使用自动化扫描器更安全，因为它可以在两三小时内完成扫描并识别漏洞。此外，测试人员对系统中任何漏洞的了解取决于他们的经验。自动化漏洞扫描器已经具备现有漏洞的知识，开发者根据新发现的漏洞不断更新数据库。除了你可以采取的保护
    Web 应用程序的技术步骤外，你必须保持信息灵通。互联网上有大量的博客。


    ## 智能手机安全


    当人们谈论勒索软件攻击时，会立即想到员工使用的笔记本电脑或桌面机。攻击者考虑所有帮助他们进入系统或网络的可能性。做到这一点的一种简单方法是通过容易破解智能手机。以下是一些关于网络犯罪和智能手机的数字：


    *   报告显示，安卓设备在 2019 年的智能手机攻击次数比 2018 年增加了 50%。

    *   研究人员的报告显示，在过去的十二个月里，67%的企业是网络攻击的受害者，58%发生了数据泄露。

    *   Verizon 在 2019 发布的数据泄露报告显示，42%的受害者是小企业。

    *   47%的企业同意他们不知道如何保护智能手机。


    攻击智能手机正变得流行，因为攻击者总是寻找新的攻击方法。例如，国家资助的攻击开始整合智能手机来收集信息。以下是用户保护其智能手机的最简单方法：


    *   **更新操作系统和应用程序**：就像你处理笔记本电脑或桌面机一样，保持智能手机的操作系统和应用程序更新也是重要的。许多人对于更新智能手机的操作系统和应用程序无于事。这让智能手机暴露于新的漏洞。当操作系统提供者发布更新时，它会向你发送更新。

    *   **自带设备 (BYOD)**：虽然大多数黑盒扫描器是自动配置扫描 Web 应用程序的，但某些可能需要你手动指定某些参数。根据业务需求，公司不需要专门的应用程序安全团队来配置扫描器。这意味着扫描器应该是易用的，这样任何具备基础编程或技术的人都可以配置。易用的漏洞扫描器帮助企业节省资金，因为他们不需要雇佣专家工作。

    *   **识别漏洞的能力**：下一个标准是看哪些漏洞扫描器可以识别最多的漏洞以及有多少是误报。漏洞扫描器发现数千个漏洞，但超过 60%是误报。你可能会问为什么这是问题？误报的问题在于手动审计员必须花费更多时间来验证漏洞是否真的是漏洞。这是资源的浪费，因此需要避免。

    *   **自动化**：漏洞扫描器的自动化程度越高，公司的负担越大。这意味着测试人员不需要手动配置每个参数，因为扫描器已经配置为扫描已知漏洞。Web 应用程序中的漏洞比看到的多，即使有时间限制，人们识别每一个漏洞也是可能的。使用自动化扫描器更安全，因为它可以在两三小时内完成扫描并识别漏洞。此外，测试人员对系统中任何漏洞的了解取决于他们的经验。自动化漏洞扫描器已经具备现有漏洞的知识，开发者根据新发现的漏洞不断更新数据库。除了你可以采取的保护
    Web 应用程序的技术步骤外，你必须保持信息灵通。


    ## 智能手机安全


    当有人谈论勒索软件攻击时，人们会立即想到员工使用的笔记本电脑或桌面机。这是攻击者考虑所有帮助他们进入系统或网络可能性。做到这一点的一种简单方法是通过容易破解的智能手机。以下是一些关于网络犯罪和智能手机的数字：


    *   报告显示，安卓设备在 2019 年的智能手机攻击次数比 2018 年增加了 50%。

    *   研究人员的报告显示，在过去的十二个月里，67%的企业是网络攻击的受害者，58%发生了数据泄露。

    *   Verizon 在 2019 发布的数据泄露报告显示，42%的受害者是小企业。

    *   47%的企业同意他们不知道如何保护智能手机。


    攻击智能手机正变得流行，因为攻击者总是寻找新的攻击方法。例如，国家资助的攻击开始整合智能手机来收集信息。以下是用户所有保护其智能手机的最简单方法：


    *   **更新操作系统和应用程序**：就像你处理笔记本电脑或桌面机一样，保持你智能手机的操作系统和应用程序更新也是重要的。许多人对于更新智能手机的操作系统和应用程序无于事。这让智能手机暴露于新的漏洞。当操作系统提供者发布更新时，它会向你发送更新。

    *   **自带设备 (BYOD)**：虽然大多数黑盒扫描器是自动配置扫描 Web 应用程序的，但某些可能需要你手动指定某些参数。根据业务需求，公司不需要专门的应用程序安全团队来配置扫描器。这意味着扫描器应该是易用的，这样任何具备基础编程或技术的人都可以配置。易用的漏洞扫描器帮助企业节省资金，因为他们不需要雇佣专家工作。

    *   **识别漏洞的能力**：下一个标准是看哪些漏洞扫描器可以识别最多的漏洞以及有多少是误报。漏洞扫描器会发现数千个漏洞，但超过 60%是误报。你可能会问为什么这是问题？误报的问题在于手动审计员必须花费更多时间来验证漏洞是否真的是漏洞。这是资源的浪费，因此需要避免。

    *   **自动化**：漏洞扫描器的自动化程度越高，公司的负担越大。这意味着测试人员不需要手动配置每个参数，因为扫描器已经配置为扫描已知漏洞。Web 应用程序中的漏洞比看到的多，即使有时间限制，人们识别每一个漏洞也是可能的。使用自动化扫描器更安全，因为它可以在两三小时内完成扫描并识别漏洞。此外，测试人员对系统中任何漏洞的了解取决于他们的经验。自动化漏洞扫描器已经具备现有漏洞的知识，开发者根据新发现的漏洞不断更新数据库。


