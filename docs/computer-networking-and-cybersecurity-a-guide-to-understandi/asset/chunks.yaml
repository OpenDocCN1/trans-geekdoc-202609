    # Understanding External Threats


    External security deals with protecting the network system from external threats.
    Before the Internet came into use, the procedures related to external security
    were easy to manage because the networks used only external modems to connect
    to the network. But Internet connectivity spread throughout the system increases
    the importance of external security and also the difficulty in managing it. As
    long as the network is connected to the Internet, it can never be secure. Techniques
    that the crackers develop to overcome the security of a network are implemented
    via the Internet. The external threats faced by a network develop so rapidly that,
    if a book were written on all the current threats to a network, it would be out
    of date when it was printed.


    The three basic external security threats are:


    *   **Front-door threats**: If an external person logs onto the network by guessing
    or cracking the password of one of the internal users, threats to system security
    arise termed as front-door threats. The intruder may have succeeded due to having
    a connection with the company or a personal relationship with someone using the
    network.

    *   **Back-door threats**: Back-door threats will arise if there are bugs in the
    software or hardware of the network operating system. The crackers take advantage
    of these bugs and breach the network security through them, then continue to find
    their way to the administrative account and finally taking control of the system.
    These threats can also be caused if the bugs are purposely programmed into the
    software of the system.

    *   **Denial of service (DDoS)**: The DDoS attack can deny service to the entire
    network. A few examples include causing servers to crash by specific actions and
    increasing Internet traffic by useless data such as flood ping requests.


    To counter the problem of crackers, several steps can be taken. These may not
    fend off the determined and highly skilled crackers completely, but they can make
    most of the crackers give up.


    ## Front-Door Threats


    The most common threat is the front-door threats, where the external person gains
    access to a user account on the network. Some forms of front-door threats include
    a displeased ex-employee who had access to the network in time, or an outsider
    who guessed or cracked the password to a valid user account on the network or
    got it from the original user of that account.


    The current or terminated internal users are more threatening to security because
    they have certain advantages of knowledge as compared to the regular crackers.
