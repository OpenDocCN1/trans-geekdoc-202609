    These two types of relationships essentially define the logical structure of a
    network. To understand them better, make an analogy to different management philosophies.
    A peer-to-peer, or ‘P2P’, network is much like a decentralized management philosophy
    where decisions are made locally, and resources are managed according to what
    users need to do first. A Client/server network is almost like a company that
    uses centralized management where decisions are made in a central location within
    a group of a few people. There exist circumstances where P2P and client/server
    relationships are both appropriate, and many networks incorporate both in their
    setup. Both P2P and client/server networks need certain layers in the OSI model
    to be common, along with a physical network connection between the communicating
    computers using the same network protocols. In this respect, the two types of
    computer relationships are virtually the same in a network. However, the major
    difference arises from whether you spread the shared network resources around
    all the computers on the network or use the centralized network servers.


    # Core Hardware Elements of a Network

    To reinforce and solidify the foundation of the concepts we are exploring in this
    discussion, you must learn more about the physical hardware components that make
    up a computer network. Until now, we have focused more on how a network works
    and interacts on the virtual level rather than the physical level. However, by
    understanding the behavior of the network in its virtual realm, we are now set
    up to understand the hardware. Understanding the physical aspect of computer networks
    provides us with adequate knowledge by which we can not only set up a computer
    network properly but also troubleshoot and maintain it. In this section we will
    be discussing the following hardware, each a core component of the network:


    1. Servers

    2. Hubs

    3. Routers

    4. Switches

    5. Cabling and cable plants

    6. Workstation hardware


    In the ending sections of this chapter, we will discuss these hardware components
    within the context of directing network traffic. However, we will only focus on
    understanding these components and their purposes.


    ## Servers

    A server is a computer assigned a very important and demanding job in computer
    networking. A server computer is essentially the component that handles all the
    networking requests and other functions of the computers on the network. Based
    on the network functions, a server can be classified into these different categories.


    * **File and Print Servers**: This category includes those servers that primarily
    provide file-sharing services to other computers, and handle requests for network-based
    printers.

    * **Application Servers**: The servers that essentially provide specific network
    application services to programs and software fall under this category. For example,
    a server running a database can provide (on request) access to the database to
    a distributed application connected to this server.

    * **E-mail Servers**: The servers primarily designed to store e-mails and provide
    interconnection services to the corresponding clients are categorized as ‘E-mail
    Servers.’

    * **Networking Servers**: This category of servers mainly offers a variety of
    services related to networking. For example, a `DHCP` server programmed to assign
    `TCP/IP` addresses is categorized as a networking server. Similarly, a server
    handling the routing of data packets through different networks (`routing server`),
    is providing a network service and is hence categorized as a network server. Other
    such services performed by network servers include encryption, decryption, security
    access, and VPN access services.

    * **Internet Servers**: The servers that provide access to common Internet services
    such as the World Wide Web, Usenet News (`NNTP`), or even e-mail services based
    on the Internet, are known as Internet servers.

    * **Remote Access Servers**: Such types of servers generally serve as a gateway
    or access point for users that want to access a network remotely.


    An operating system installed on a server is very specific and tailored to enable
    the performance of the tasks we have just mentioned. For instance, if a server
    is using an operating system distributed by `Microsoft`, then it will most likely
    be using the `Windows Server` edition. Similarly, a server can also run `Linux`
    or `UNIX` distributions designed for networking. Depending on the operating system
    installed, a server can either perform the networking functions or be specific
    to only a few. But it’s not always necessary for a server to comply with every
    network function; depending on its purpose, a server can only be tasked with a
    few networking operations, and that will be adequate. In this way, users can deploy
    multiple servers, each optimized for certain network operations. Here are a few
    features that qualify a server for a different class of computers as compared
    to domestic client computers.


    * Server computers natively incorporate the element of redundancy inside their
    hardware architecture. This means that even if something within the hardware breaks
    or fails, the server will still keep running normally. To achieve this redundancy,
    the internals of a server computer are lined with multiple power supplies and
    cooling fans, shielding the computer from malfunctioning due to the failure of
    any corresponding hardware component.

    * The subsystems of a server computer are also specifically designed to optimize
    data flow. If we analyze a typical server, we will see that the design scheme
    for the disk, memory, and network subsystems are different than those used for
    a desktop computer. This design supports a high-performance boost to not only
    the subsystems mentioned above but also to optimize the flow of data. So, data
    moving to and from different points such as the server, the client, and the network
    is comparatively more optimized and faster.

    * Since servers hold a crucial position within a computer network, special care
    is taken for the “health” of the computer. Server computers feature specially
    designed surveillance parameters on both software and hardware levels; the machine
    itself can keep an eye out for any alarming deterioration in its health and essentially
    warn the users of imminent failure before it happens. For instance, one of the
    common monitoring items installed in servers is `temperature monitors`; if the
    temperature of the server’s surroundings rises too much, it gives off a warning
    detailing the problem. In this way, the people maintaining the server learn of
    a problem before it causes hardware failure and can prioritize resolving this
    issue.

