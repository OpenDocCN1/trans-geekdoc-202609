- raw: "*   E-mails are the most dangerous form of communication because they might\
    \ be infected by viruses and Trojan horse programs. If the e-mail traffic is not\
    \ monitored carefully, these might infiltrate the company network. This threat\
    \ is prevented by using a virus-scanning software on the e-mail server and updating\
    \ the virus signatures regularly. \n\nDDoS Threats Another type of threat to the\
    \ system network is the DDoS (Distributed Denial of Service) threat by which legitimate\
    \ users of the network cannot obtain the network resources because they are denied\
    \ access. It works in two ways, one of which is by flooding the network with useless\
    \ traffic so the server (such as an e-mail server) denies services to the legitimate\
    \ users or simply crashes under the heavy traffic load. The other way requires\
    \ taking advantage of the existing bugs in the software of the network to crash\
    \ the server. Prevention of DDoS threats include: \n\n*   Checking and confirming\
    \ if the network’s software is updated and current. \n\n*   Firewall settings\
    \ that allow the user to disable the Internet Control Message Protocol (ICMP)\
    \ traffic service so traffic such as ping requests will not be allowed into the\
    \ network. \n\n*   Not letting the people outside the LAN access those network\
    \ resources and servers which they should not access. For example, the accounting\
    \ system of a company is made inaccessible to those outside the LAN because they\
    \ do not need it. So, the firewall or packet-filtering router is configured so\
    \ the traffic coming from and going outside the server’s IP address is denied.\
    \ \n\nPotential Attacks and Threats A wide variety of malicious software exists\
    \ in the computer world, and the list continues to grow. Some are listed below.\
    \ \n\n*   Viruses: A computer virus is a code or program capable of copying itself\
    \ and spreading by infecting numerous files such as COM, EXE, AND DLL program\
    \ and application files. The document files for applications like Microsoft Word\
    \ and Excel prone to virus attacks support macro languages, which are sophisticated\
    \ enough to allow it. The data files, such as JPEG image files, are also at risk\
    \ of being attacked by these viruses. \n\n*   Worms: The worm program functions\
    \ by sending a copy of itself to other computers, which spread it to different\
    \ computers after running it. The e-mail systems have lately been a victim of\
    \ worms attached to e-mails in an enticing message. If the e-mail user opens the\
    \ attachment, copies of the worm are spread to other people present in the user’s\
    \ e-mail address book. This action is carried out without the knowledge of the\
    \ user, and the receivers of the worm face the same situation. In this way, worms\
    \ spread like wildfire across the Internet through the e-mail server in just a\
    \ few hours. \n\n*   Trojan horses: Trojan horse is a deceptive program that pretends\
    \ to do something meaningful or of interest to the user but carries out malicious\
    \ activities in the background during the period the user is busy interacting\
    \ with the main program. \n\n*   Logic bombs: Logic bombs are malicious programming\
    \ code pieces added into the normal program by the original author or by a person\
    \ involved in developing the source code. They are set to become active after\
    \ a certain amount of time, after which they delete key files and perform other\
    \ malicious actions. \n\nWith each passing day, the already enormous number of\
    \ viruses increases even more as new viruses are written and discovered. An important\
    \ requirement of network administration is to establish practices to deal with\
    \ these viruses. Antivirus software runs on a network computer and monitors the\
    \ software activities to search for potential virus threats. If a virus entity\
    \ is discovered by the antivirus software, it protects the network by removing\
