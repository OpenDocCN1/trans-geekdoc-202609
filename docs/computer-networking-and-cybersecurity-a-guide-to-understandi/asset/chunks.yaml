- raw: "There will be references to the levels at which these protocols operate in\
    \ terms of the Open Systems Interconnection, or “OSI”, networking model. The OSI\
    \ model defines most methods and protocols through which computers connect and\
    \ communicate with each other on a network. It is an abstract visualization, but\
    \ a useful one; understanding the OSI networking model will create a strong foundation\
    \ for network designing and network solution engineering. Chapter Six goes into\
    \ a detailed treatment of the topic, but, purely for the sake of reference between\
    \ here and there, we will merely present here a basic outline of the OSI model.\
    \ The model is divided into seven distinct and separate layers. Each layer possesses\
    \ a trait known as ‘successive dependence.’ This means that the successively higher\
    \ layers in the model depend largely on the services and characteristics of the\
    \ preceding lower layers. Consider a standard desktop computer system. It is composed\
    \ of several components that must work together to make the system functional.\
    \ If we divide this system into the layers of the OSI networking model, the hardware\
    \ components of this computer will be termed as the ‘lowest layer.’ The next layer\
    \ above the hardware layer of this computer would be the Operating System and\
    \ its system drivers. Obviously, the operating system and drivers would be useless\
    \ without the corresponding hardware. Hence, this higher layer is depending on\
    \ the preceding lower layer to perform its function properly. This successive-hierarchy\
    \ visualization continues upwards to the final layer, where an application is\
    \ displaying useful and digestible data to the user. The seven layers of the OSI\
    \ Networking Model are: \n\n1.  Physical Layer – The physical layer specifies\
    \ the network cable, the router, the DSU/CSU box, and the other physical mediums\
    \ involved. \n\n2.  Data Link Layer –The data link layer of the OSI model bridges\
    \ the connection                between the third layer (network layer) and the\
    \ first layer               (physical layer) by defining and implementing a protocol\
    \ through which the network layer transmits its data to the physical layer. \n\
    \n3.  Network Layer – The main job of the network layer is to define the route\
    \ through which the data packets will travel from node to node. For this purpose,\
    \ the transport layer masks the characteristics of lower layers from the upper\
    \ layers in the OSI model. \n\n4.  Transport Layer – The transport layer mediates\
    \ the movement of data between all the other layers. \n\n5.  Session Layer – By\
    \ this layer, the OSI model defines the connection between two computers as either\
    \ a client-server connection or a peer-t0-peer connection. The term ‘session’\
    \ is used to describe this virtual network connection between computers. \n\n\
    6.  Presentation Layer – The presentation layer performs data compression/ decompression\
    \ and encryption/decryption. \n\n7.  Application Layer – The main concern of the\
    \ application layer is to control and mediate the interaction of the network with\
    \ the Operating System and the applications installed on this OS. It basically\
    \ defines how the applications handle the communications in which the system becomes\
    \ involved when connected to a network. \n\nIf we analyze the nature of the OSI-model\
    \ layers in a network, we see that they begin their interaction with the physical\
    \ elements within a network, i.e., the routers, network cables, etc. From there,\
    \ the layers move toward interacting with virtual features and elements, i.e.,\
    \ moving toward intelligent aspects of the network.  After this, the OSI model’s\
    \ focus on the virtual aspects of the network shift towards the involvement of\
    \ the computer machine itself within the network, which is evident from the last\
    \ two layers (Presentation and Application layers). A good grasp of this technique\
    \ allows network engineers to analyze networks in a more detailed and comprehensive\
    \ manner. Domain Name System (DNS) The Doman Name System was developed to solve\
    \ the inherent problem of keeping track of websites' IP addresses on the Internet.\
    \ For instance, let’s say that you want to visit Google. If the server housing\
    \ Google's resources had only an IP address, then you would have to type in [http://209.85.171.100](http://209.85.171.100)\
    \ to access it. If the computer addresses on the Internet had the same addressing\
    \ scheme, keeping track of them would be very difficult. This is where DNS comes\
    \ in. By using this system, people can register a name for their domain with ICANN.\
    \ This registered name will access that IP address on the Internet. Here are some\
    \ of the common domain extensions: \n\n*   .edu (used by educational institutions)\
    \ \n\n*   .gov (used by governmental institutions) \n\n*   .mil (used by military\
    \ institutions) \n\n*   .net (used by entities related to the Internet) \n\n*\
    \   .org (used by non-profit organizations) \n\n*   .xx (used by countries. The\
    \ “xx” is a space-holder and is replaced by the respective country's initials.\
    \ For instance, for America: “.us” ). \n\nOnce an entity has acquired a domain\
    \ name, it may add descriptors into the domain name. For instance, for the domain\
    \ dirbs.gov , the government entity can add pta.dirbs.gov, and it would be acceptable.\
    \ The names of the domains are resolved to their respective IP addresses by using\
    \ DNS servers, which means ‘domain-name servers’. These servers perform a database\
    \ query against a domain name entered by the user. The server then returns the\
    \ actual address of the domain to the user's web browser. Dynamic Host Configuration\
    \ Protocol (DHCP) The DHCP protocol was developed to facilitate the administrators\
    \ of a network to assign TCP/IP addresses to nodes easily. This protocol was used\
    \ in a time when administrators would resolve the address of a node to a TCP/IP\
    \ address and put it into a text file or even a dialog box. The services given\
    \ by the DHCP protocol is essentially run by dedicated servers known as DHCP servers.\
    \ These servers control a 'scope,' which is an array of IP addresses.  So, when\
    \ a node goes online on a network, it requests the DHCP server to assign it an\
    \ address. These addresses are valid for a limited period and expire after the\
    \ time limit assigned; they then become available for another node to use. This\
    \ period is known as the 'lease period,' and it can be set by the administrators\
    \ of the network. The main use of the DHCP protocol is to support the connectivity\
    \ needs of client workstations. Using DHCP for the nodes responsible for network\
    \ services is not recommended, as any change to the TCP/IP address will negate\
    \ the connection to the network service. Hypertext Transfer Protocol (HTTP) The\
    \ entire Internet (called the World Wide Web) is a collection of documents created\
    \ using a formatting language known as 'HTML' or 'Hypertext Markup Language.'\
    \ Hypertexts on the Internet usually consist of: \n\n*   Displayed text \n\n*\
    \   Graphical images \n\n*   Formatting commands \n\n*   Hyperlinks (clicking\
    \ them redirects the user to some other document on the Internet) "
