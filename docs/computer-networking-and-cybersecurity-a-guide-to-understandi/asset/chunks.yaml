    电子邮件是最危险的通信形式，因为它们可能被病毒和木马程序感染。如果不对电子邮件流量进行仔细监控，这些病毒可能会渗透到公司网络。这种威胁可以通过在电子邮件服务器上使用病毒扫描软件并定期更新病毒特征库来防止。


    ## DDoS 威胁

    对系统网络的另一种威胁类型是 `DDoS`（分布式拒绝服务）威胁，通过这种威胁，网络的合法用户由于被拒绝访问而无法获取网络资源。它的工作方式有两种，其中一种方法是通过向网络中灌入大量无用流量，导致服务器（例如电子邮件服务器）拒绝向合法用户提供服务，或直接在沉重的流量负载下崩溃。另一种方法是利用网络软件中现有的漏洞来使服务器崩溃。防止
    DDoS 威胁的方法包括：


    *   检查并确认网络软件是否已更新到最新版本。

    *   防火墙设置，允许用户禁用互联网控制消息协议（`ICMP`）流量服务，这样 `ping` 请求等流量将无法进入网络。

    *   不让局域网（LAN）之外的人访问他们不应该访问的网络资源和服务器。例如，公司的会计系统对局域网外的人是不可见的，因为他们不需要。因此，配置防火墙或数据包过滤路由器，拒绝来自服务器
    IP 地址及发往其之外的流量。


    ## 潜在攻击与威胁

    计算机世界中存在各种恶意软件，而且列表仍在不断增加。以下列出了部分。


    *   **病毒**：计算机病毒是一种能够复制自己并通过感染许多文件（如 `COM`、`EXE` 和 `DLL` 程序和应用程序文件）来传播的代码或程序。`Microsoft
    Word` 和 `Excel` 等应用程序的文档文件容易受到病毒攻击是因为它们支持宏语言，而宏语言足以实现这一点。数据文件（如 `JPEG` 图像文件）也面临被这些病毒攻击的风险。

    *   **蠕虫**：蠕虫程序通过向其他计算机发送自己的副本来运行，蠕虫在运行后将其传播到不同的计算机。最近，电子邮件系统经常成为附带在诱人信息中的蠕虫的受害者。如果电子邮件用户打开附件，蠕虫的副本就会传播到该用户电子邮件通讯录中的其他人员。这种操作是在用户不知情的情况下进行的，蠕虫的接收者也面临同样的处地。通过这种方式，蠕虫可以在几小时内通过电子邮件服务器在互联网上如野火蔓延般传播。

    *   **木马程序**：木马是一种欺骗性程序，它假装执行对用户有意义或感兴趣的操作，但在用户忙于与主程序交互期间，在后台执行恶意活动。

    *   **逻辑炸弹**：逻辑炸弹是由原始作者或参与源代码开发的人添加到正常程序的恶意编程代码段。它们被设置为在一定时间后激活，随后它们会删除关键文件并执行其他恶意操作。


    随着时间的推移，由于新病毒的编写和发现，巨大的病毒数量进一步增加。网络管理的一个重要要求是建立处理这些病毒的实践。防毒软件运行在网络计算机上，监控软件活动以搜索潜在的病毒威胁。如果防毒软件发现了病毒实体，它将通过从原始文件中删除病毒同时保持文件完整来保护网络，并将其隔离或锁定，直到管理员进行检查。防毒软件的设计使其能够在大多数网络计算机运行，包括台式计算机、文件服务器、电子邮件服务器、打印服务器和计算机防火墙。在提供防毒服务的众多供应商中，最著名的三家是
    `Symantec`（`Norton Antivirus`）、`Trend Micro`（`PC-cillin`）和 `Network Associates`（`McAfee
    VirusScan`）。最合适的选择是确保防毒软件运行在所有服务器上，并自定义设置以便其软件自动更新。由于电子邮件服务器更容易受到病毒攻击，因此强烈建议确保它们上运行了防毒软件。与电子邮件相关的新病毒可以在几小时内传播到全球，因此如果你将病毒特征库的更新设置为每小时一次，你很可能在病毒攻击你的网络之前获得必要的病毒更新。也建议在工作站上运行防毒软件，但仅依赖此软件来防止病毒攻击是不正确的举措。它不应被视为处理病毒的主要方法，而应作为基于服务器的软件的补充。


    ## 黑客基础与网络设计

    在本节中，我们将讨论网络设计和黑客攻击的基础知识。网络设计是一项非常重要的工作，最好由网络专业人员处理。从零开始设计网络是一项耗时、压力大且非常敏感的工作。然而，作为承担这种负担和责任的回报，为公司构建的网络是根据其需求量身定制的。这允许公司在使用网络时高效地工作和运行。尽管网络设计最初看起来可能令人生畏，但其背后的过程和哲学一旦掌握后其实非常简单。最后，通过使用
    `Linux` 操作系统为简单的黑客攻击奠定，并简要介绍侦察、利用等黑客攻击链过程。然而，需要明确的是，涵盖黑客攻击的基础不在本书的范围内。相反，我们将关注主要方面。


    ## 网络设计流程

    网络设计并不是遵循科学程序，也不是一门精确的科学。在第一次尝试设计网络时就完全正确几乎是不可能的，因为每个网络都有其需要满足的需求和要求。这项任务的卓越性来自于经验和实践。然而，设计良好网络的技巧是估计网络需求，并尽可能在网络设计中满足这些需求。网络设计过程并不是通用的，它因人而异。有些过程简单容易，而有些则极其复杂。在本章中，我们将学习一种适度全面且非常简单的网络设计过程。该过程只有步骤：


    1.  评估网络需求

    2.  满足网络需求

    '
