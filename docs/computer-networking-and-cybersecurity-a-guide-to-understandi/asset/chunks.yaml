    ## 2. BNC barrel connector

    ## 3. RG-58 cable with male BNC connector


    In terms of budget, the bus topology network is the least expensive option of
    the three. This is because a bus topology network uses comparatively less network
    cable regarding the star and ring topology. Hence, a bus topology network uses
    less networking materials and needs less installation labor. However, while the
    bus topology has advantages over the other two topologies with cost, it also has
    significant drawbacks. A network with a bus topology is more sensitive and prone
    to failure because it comprises multiple subscales, which essentially create a
    segment. These subscales must be connected to the nodes. Now, this level of intricacy
    introduces a new problem, and that is:


    * If the segments of the bus topology network fail, it will cause the failure
    of the segments in the network.

    * Identifying the source of failure is even more tedious and time-consuming, as
    the technician must go through the available cable connections until the source
    of the defective segment is identified.


    Since a bus topology network is seemingly unreliable and more prone to failure,
    many new wired network installations do not use this topology. However, bus topology
    networks may be seen in older network installations. The most commonly used bus
    topology network used back in the day and still in limited existence today is
    the `10Base-2` Ethernet network (also known as Thin Ethernet). A Thin Ethernet
    network has these characteristics:


    * 10 Mbps maximum speed rating

    * Type of network cable and connectors used are `RG-58/AU` or `RG-58/CU` (coaxial
    cable and BNC connectors respectively)

    * To function properly, the network requires each ending of every segment to be
    terminated with a 50-ohm terminating connector

    * Maximum node capacity per segment is 30 nodes

    * Maximum segment length is 185 meters, or 607 feet

    * Repeaters can feature extended segments

    * The minimum distance between each node should be 0.5 meters or 1.5 feet of cable
    distance.


    In a network using bus topology, with repeaters enabling the user to connect up
    to three segments together, each connected segment would support up to 30 nodes
    (counting the repeater as a node). Two more segments could be added, if the sole
    purpose was extended signal distance and they had no nodes connected to them.
    This would make five segments that could be added by using a repeater. The maximum
    length of the entire repeated segment should not exceed 925 meters, or 3,035 feet.
    To remember this arrangement, we can simply remember the `5-4-3` rule:


    * Five segments

    * Four repeaters

    * Three populated segments


    ## Star Topology

    In a star topology network, the connected computers, servers, or simply nodes
    are hooked up to a single central unit. In this wired arrangement, the connections
    radiate out from the main unit, similar to the shape of a star. This central unit
    is commonly called a `hub` or `concentrator`. The hub hosts a bunch of network
    cables that radiate out to the corresponding nodes on the network. In technical
    terms, a hub is known as a `Multistation Access Unit` or simply `MAU`. However,
    this term is strictly used with Token Ring networks. In a star topology network,
    there are multiple hub size options available. For instance, some hubs can support
    no more than two nodes, while there are also hubs that can support up to ninety-six
    nodes. Generally, a standard central hub unit used in this network has support
    for up to 24 nodes. Regardless, even if we use a 24-node hub or a 96-node hub,
    we are still given the freedom of connecting multiple nodes into a hub and shaping
    the network as we see fit. Here’s a simple illustration of a star topology network.
    ![](Image00009.jpg)


    However, remember that, since a hub is used as the central unit, there come complications
    in the previous sections of this chapter. A hub echoes the network traffic among
    its other ports. So, the network traffic from any node will be echoed to the other
    nodes. This means that a node’s entire bandwidth connection is shared among the
    other node connections. For instance, if the total bandwidth speed of the hub
    is 100 Mbps, but one nod is using only 50 Mbps of that total bandwidth, then the
    other nodes cannot access the rest of the bandwidth and instead, must share this
    50 Mbps. To put it into simpler terms, the total bandwidth available to one node
    is the same bandwidth shared among the other nodes. In a star topology network,
    there are multiple Ethernet connections available for use listed below:


    * `100Base-T` Ethernet is the most commonly used and provides a bandwidth limit
    of up to 100 Mbps.

    * `10Base-T` Ethernet is seen in older networks. This ethernet has a bandwidth
    limit of up to 10 Mbps.

    * `1000Base-T` Ethernet is a relatively newer Ethernet standard and is commonly
    known as Gigabit Ethernet. It offers a bandwidth capacity of 1000 Mbps or 1 Gbps.

    * `10GBase-X` is the most recent Ethernet standard. It is called 10 Gigabit Ethernet
    and uses a fiber optic cable connection offering a bandwidth capacity of 10 Gbps.


    Let’s talk about the cable requirements of the `10Base-T` and `100Base-T` Ethernet
    network connections:


    * `10Base-T` Ethernet requires a Category 3 (`Cat-3`) twisted-pair network cable.

    * `100Base-T` Ethernet requires a Category 5 (`Cat-5`) twisted-pair network cable.


    Remember that although `10Base-T` Ethernet can use a `Cat-3`, `100Base-T` Ethernet
    requires a `Cat-5` twisted-pair network cable. Whenever `10Base-T` Ethernet can
    use a `Cat-3`, `100Base-T` Ethernet cannot use `Cat-3`. For instance, if you are
    using a `Cat-5` network, then you can use `Cat-5E`, and if money is not a problem,
    you can even go for `Cat-6`. Here are wiring characteristics that `10Base-T` networks
    share:


    * They require four wires in two single-sheathed twisted pairs. These twisted
    pair wires can either be shielded or unshielded.

    * They can function on `Cat-3` cables and newer ones such as `Cat-5`.

    * There is a length limit for each node connection of 100 meters, or roughly 328
    feet.

    * They are not bound by a limitation on the number of nodes per logical segment.

    * For all of their connections, they use `RJ-45` connectors.


    A notable advantage that `1000Base-T` networks have over `100Base-T` networks
    is that they:


    * Are compatible with `Cat-5` network cables

    * Operate at ten times the speed of `100Base-T` networks, i.e., at 1 Gbps or 1000
    Mbps as opposed to 100 Mbps


    Arguably one of the most important advantages that `1000Base-T` networks have
    is their `Cat-5` cable compatibility. Nowadays, the most commonly used network
    cable in 75% of the installed networks is none other than `Cat-5` cables. If a
    `Cat-5` cable system is already present, a `1000Base-T` network can be installed
    without changing the cable system. This provides a huge saving in not only time
    but in installation costs, cabling costs, and labor costs, since installing a
    new cable networking standard for a whole building is very expensive. Here are
    a few characteristics of `1000Base-T` over `Cat-5` networks:


    * These networks need eight wires in four single-sheathed twisted pairs.

    * They require at least `Cat-5` or better network cable standards (`Cat-5E` or
    `Cat-6`).

    * The length limit for each node connection is 100 meters or roughly 328 feet.

    * They are not bound by a limitation on the number of nodes per logical segment.

    * For all of their connections, they use `RJ-45` connectors.

    '
