- raw: 'Chapter Ten: Skills Required for a Career in Cybersecurity You are nearing
    the end of this book, and thus far, you have learned a lot about cybersecurity.
    So, what next? It is good to have all this knowledge, but what should you do if
    you wanted to use it? This chapter looks at the careers available in cybersecurity
    and the skills you need to develop to pursue such a career. The classification
    of the roles in this chapter will help you decide what area you would like to
    work in. A career in cybersecurity is not a bed of roses; it can be stressful.
    However, it has its rewards. Cybersecurity professionals find themselves in different
    roles across the organization, but their objective remains the same. They must
    develop methods and tools to protect the organization’s data from any attack.
    The process of getting into a cybersecurity role in the industry is not always
    straightforward. Some people jump into it right out of college, while others like
    to get some experience in software engineering before choosing to move to a role
    focused more on security. Here are some career options available in the cybersecurity
    field based on the experience of the candidate: Entry-Level Roles ● Systems Administrator
    ● Systems Engineer ● Web Developer ● IT Technician ● Network Engineer ● Security
    Specialist ● Mid-Level Roles ● Security Analyst ● Security Technician ● Incident
    Analyst ● Cyber Security Consultant ● IT Auditor ● Penetration Tester Senior Level
    Roles ● Cyber Security Architect ● Cyber Security Manager ● Cyber Security Engineer
    ● Chief Information Security Officer Four Popular Careers in Cybersecurity and
    How to Get There Security Architect If you like to solve problems, and develop
    strategies to prevent the same problems, consider the role of a security architect.
    A security architect is responsible for designing, developing, and implementing
    security for an organization’s systems and networks. They are capable of developing
    efficient complex security structures. The security structures can prevent any
    malware, DDoS, and other attacks. The average salary for a security architect
    in the USA is around $120,000 per annum. Security architects must have at least
    five years of experience in the IT industry and three to five years in security.
    Follow the path given below if you wish to pursue a career as a security architect:
    ● Pursue a degree in information technology, computer science, cybersecurity,
    or any other relevant field. Alternatively, you can earn equivalent industry-level
    certifications. ● Enter the industry as a systems administrator, security administrator,
    or network administrator. ● Work in the same organization for a while, and move
    up the organization until you reach a security engineer level. ● At this point,
    you can switch to a security architect role. The responsibilities of a security
    architect are as follows: ● Research about current attack trends and design security
    architecture for all IT projects of the business. ● Provide the requirement to
    management for networks and network devices. ● Perform security testing, such
    as risk analysis and vulnerability testing. ● Research about the latest standards
    in security and implement them in the organization. Training The role of a security
    architect is a senior-level role, and therefore recruiting managers to look for
    specific certifications when they hire any candidate. Industry-level certifications
    in cybersecurity give your profile an edge over your competitors. You can first
    earn a CompTIA Security+ certificate and then proceed to the Certified Ethical
    Hacker (CEH) certification. To move on to the advanced and expert levels, you
    can earn an EC-Council Certified Security Analyst (ECSA) certification and Certified
    Information Systems Security Professional (CISSP) certification. Security Consultant
    A security consultant, also known as a cybersecurity expert, knows everything
    there is to know about cybersecurity. They can analyze risks and problems and
    provide appropriate solutions to other organizations to secure their infrastructure
    and protect their data. Some organizations use a different name for this role.
    Some commonly used terms are security consultant, network security consultant,
    or database security consultant. A security consultant is expected to be versatile
    and able to answer any queries related to cybersecurity. The salary range depends
    on the experience, but a senior-level security consultant can make up to $106,000
    per annum in the USA. Most organizations prefer to hire consultants with at least
    three to five years of experience. You can follow the path below to become a security
    consultant: ● Pursue a degree in information technology, computer science, cybersecurity,
    or any other relevant field. Alternatively, you can obtain the equivalent industry-level
    certifications. ● Enter the industry though a general IT role. ● Continue to work
    in the same organization and move up the ladder until you reach the security administrator,
    auditor, or analyst roles. ● Get yourself some industry-level certifications and
    improve your skills. ● Try moving to a security consultant role. The daily tasks
    of a security consultant are as follows: ● Determine ways to protect systems,
    networks, and data from attacks. ● Perform security assessments and vulnerability
    tests. ● Communicate with staff and employees to understand security issues. ●
    Using industry-standard solutions to test security. ● Supervise and guide the
    security team of the organization. Training You can start with the CompTIA Security+
    certificate and move on to the Certified Ethical Hacker (CEH) certification. You
    also need to earn the Cybersecurity Analyst (CySA+) certification. Advanced certifications
    include Certified Information Systems Auditor (CISA), EC-Council Certified Security
    Analyst (ECSA), and Certified Information Security Manager (CISM). To get to the
    expert level, you can get certified with Certified Information Systems Security
    Professional (CISSP). Ethical Hacker/Penetration Tester Penetration testers, also
    known as ethical hackers, understand how an attacker thinks, and use that understanding
    to simulate different attacks on the organization’s systems and network to prevent
    any malicious attacks. They perform this attack only with the management’s consent,
    identifying the weak spots before an attacker can exploit them. This helps the
    business to protect their sensitive and critical data, both in storage and in
    transit. The average salary of a penetration tester in the USA is $80,000 per
    annum. If you want to become a penetration tester, follow the career path given
    below. ● Pursue a degree in information technology, computer science, cybersecurity,
    or any other relevant field. Alternatively, you can obtain the equivalent industry-level
    certifications. ● Enter the industry as a systems administrator, security administrator,
    or network administrator. ● Get yourself some industry-level certifications and
    sharpen your skills. ● Continue to work in the organization until you move up
    the organization and earn a senior penetration tester, security architect, or
    security consultant role. The duties of a penetration tester are as follows. ●
    Conduct penetration tests on applications, systems, and networks. ● Analyze weaknesses
    to identify methods an attacker could use to exploit the system. ● Discuss and
    document the findings with the IT teams. ● Design and implement new tools for
    penetration testing to keep up with modern-day attacks. Training Start with the
    CompTIA Security+ and move on to the Certified Ethical Hacker (CEH) certification.
    At an advanced level, you can earn the CompTIA Advanced Security Practitioner
    (CASP) and EC-Council Certified Security Analyst (ECSA). To become an expert,
    you can earn the Certified Information Systems Security Professional (CISSP).
    Chief Information Security Officer (CISO) The Chief Information Security Officer
    profile is a senior-level profile in the field of cybersecurity. It is a very
    respected and rewarding job and includes a lot of power and freedom concerning
    creativity. The Chief Information Security Officer is responsible for assembling
    a security team and keeping a macroscopic view over the organization’s security.
    The CISO will report to the CEO of the organization. The average salary of a CISO
    is around $160,000 per annum in the USA. You must have at least seven to ten years
    of experience in the cybersecurity domain, and five years out of those must include
    managing security teams. You can achieve the career level of a CISO by: ● Pursuing
    a bachelor’s degree in information technology, computer science, cybersecurity,
    or any other relevant field. Alternatively, you can earn any equivalent industry-level
    certifications. ● Enter the industry as an analyst or a programmer. ● Continue
    to work in the organization until you move up the ladder to become an engineer,
    auditor, consultant, or security analyst. ● Get yourself some industry-level certifications
    and sharpen your skills. ● Try to become a manager of a team dealing with security.
    ● Get an MBA degree with a focus on IT. ● Get promoted to the role of Chief Information
    Security Officer (CISO). You will be the head of the IT team, and your responsibilities
    will be as follows: ● Taking the last round of interviews to have the best team
    of IT security experts. ● Creating new plans for security project deployments
    and working on improving existing methods. ● Analyzing and approving the design
    and development of security policies proposed by the IT and security teams. ●
    Establishing programs for risk management by collaborating with other leaders
    in the organization. ● In the event of a breach, the CISO must take charge of
    the security teams and propose a plan of action to fix and prevent the breach
    in the future. Training When you start your journey off in the information security
    industry, you must obtain the Certified Information Systems Auditor (CISA). At
    the advanced level, obtain the Certified Information Security Manager (CISM) and
    become an expert by completing Certified Information System Security Professional
    (CISSP). Required Skillset for a Career in Cybersecurity Here are some skills
    that recruiters look for when they hire people from the cybersecurity industry.
    Soft Skills Leadership A security expert leads a team through its ethics, credibility,
    and responsiveness. With amazing communication skills, a security expert can gain
    the trust and respect of senior management. It is also important to understand
    both the internal and external risks of the organization. Security leaders present
    all key information to the management and drive the business forward through informed
    decisions. Always Learning A security expert must keep up to date on the latest
    trends in attacks and solutions for those attacks. An aptitude for learning proves
    helpful for your personal and professional growth. Security is always evolving
    in the IT industry, and it requires someone who is a quick learner and can keep
    up. Determination The landscape of threat environments is always changing, and
    this demotivates some security experts easily. If you do not know how to tackle
    an attack, do not give up. Persevere and find a way to solve the issue. Determination
    and persistence always help you solve the issue. An ideal security expert always
    works on identifying a solution for any problem until the end and does not give
    up midway. Collaboration You must understand that cybersecurity is a shared responsibility
    of business. There are multiple teams involved, such as application developers,
    network engineers, server admins, management, and more. You must ensure you collaborate
    with every team in the organization and respect their inputs, as every input can
    be useful. Also, when you bond with stakeholders, you can explain the importance
    of and need for security. Ensure that every department in the organization does
    not ignore security. Analytical and Insightful A skilled security expert is good
    at analyzing incoming attacks and can assess how they can be thwarted. They further
    understand the attack surfaces and their vulnerabilities to minimize the attacks
    in the future. It can take a few years to develop this skillset, and sometimes
    it’s also an intuition that helps a few individuals. Hyper Critical Thought Process
    A skillful security expert knows how the attacker thinks. This helps them visualize
    how the attacker may plan and execute the attack. Therefore, they know how to
    think like the attacker and conduct penetration tests to identify vulnerabilities
    in the system before the attacker uses them to exploit the system and network.
    Approachable A security expert has to communicate with other teams constantly.
    Sometimes other teams may even want to consult the security expert before making
    changes to network policies or code. Thus, you must be approachable so that other
    leaders and team members can consult you. The combined effort helps the business
    strengthen its network and security policies. Project Manager Since you are a
    cybersecurity leader, you work day in and day out to protect your organization
    against attacks. You must develop holistic solutions rather than going with a
    solution for every attack module. Technical Skills Incident Management and Response
    As a security expert, you are expected to handle any threat that violates the
    organization’s security in real-time. There could be an incident involving malware,
    phishing, ransomware, etc., and it is critical that you can handle the situation,
    resolve it, and prevent it from happening again. SIEM Management SIEM stands for
    Security Information and Event Management. There are tools and services part of
    SIEM, and a security expert is expected to be well versed with them. You must
    learn to automate security procedures using SIEM tools so that the organization
    translates real-time alerts to response plans to prevent the effect. Firewall
    A security expert must thoroughly know the ins and outs of the firewall configuration
    so that it becomes easier to filter out malicious traffic from the network. Additionally,
    they must be very knowledgeable about intrusion detection and intrusion prevention
    systems and how they could be used in combination with the firewall. Intrusion
    Detection You are expected to know the workings of the intrusion detection system
    thoroughly so you can leverage it against any attack. Application Security A good
    security expert can find loopholes in the application and fix them before an attack
    comes in. It is also good practice to test applications during the software development
    life cycle to identify any vulnerability and fix them before deploying the application
    into production. Malware Prevention A good security expert can identify advanced
    persistent threats that may bypass traditional security solutions, such as firewalls,
    antivirus, etc. Mobile Device Management A security expert must work with the
    IT team to explain how hackers can exploit mobile devices such as smartphones,
    laptop, tablets, etc., to breach the system. They should further discuss how these
    devices could be secured to prevent a security breach. Data Management Data is
    the most expensive asset for any business, and a security expert should manage
    and protect it at all costs. Digital Forensics A security expert should know about
    digital forensics and leverage forensic tools to find anomalies in data or the
    network, which can be a backdoor for an attacker. They should subsequently patch
    the data or network if any anomalies are found. Identity/Access Management Through
    identity and access management, the organization creates roles, classifies users
    into groups, and then assigns roles to them. The IT team defines these roles along
    with the management, and a security expert is expected to audit the access levels
    granted to users and groups in the organization regularly. Intelligence and Analytics
    A security expert must know how to use analytics to understand historical attack
    patterns and learn how to predict future attacks and be ready for them. Reports
    suggest that if analytics is leveraged to combine network data and application
    data, it can help prevent attacks. Audit and Compliance While securing systems
    and networks, a security expert needs to ensure that all regulatory compliances
    such as PCI DSS, SOC, GDPR, HIPAA, PCAOB, SOX, etc., are adhered to by the organization.
    Compliance and security audits are critical since non-adherence to regulatory
    compliance can attract huge penalties or fines from the government. '
