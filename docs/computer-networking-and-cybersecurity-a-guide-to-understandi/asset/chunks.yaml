    Attackers are aware that users are getting wiser and being trained against common
    phishing scams. Therefore, most attackers no longer use methods where they need
    to use bait to obtain sensitive information. They now use pharming, where they
    take advantage of cache poisoning in the `Domain Name System`. The `Domain Name
    System`, or `DNS` in short, is a naming system used by the Internet to convert
    strings such as `google.com` to `IP` addresses to land the user on the website.
    When an attacker employs a DNS cache poisoning technique, they attack a DNS server
    and change the `IP` of a certain website to their own `IP`. This means that the
    attacker can redirect a user to their website instead of the genuine one. This
    happens even if the user enters the correct website name. Pharming attacks can
    be avoided by training users and employees to enter sensitive information only
    on websites secured by a digital certificate and `HTTPS` protocol. A business
    should also install antivirus and anti-malware solutions on all official devices
    and update virus signatures regularly. Internet Service Providers should also
    take proactive measures to secure their networks.


    ## Identifying a Phishing Email

    This section will go through an example so you can understand what a phishing
    email looks like, how to identify it, and what measures can be taken to avoid
    being tricked by such emails.


    ### What is Email Spoofing?

    Email Spoofing is a methodology under the umbrella of Email Phishing where an
    attacker manipulates the headers of an email to make the source of the email look
    genuine even when it is coming from an illegitimate source, like the attacker’s
    system. Attackers are aware that users trust an email as long as the sender’s
    email address resembles an address they have seen before. The motive of email
    spoofing is to trick the user into believing the email they have received is important,
    and the sender is genuinely requesting information.


    ### Identifying a Spoofed Email

    There are two ways to identify a spoofed email:

    If the subject line is similar to any of the examples below, the email is not
    valid:

    *   Your email account `abc@example.com` is hacked

    *   Urgent: Change your email account’s password right away

    *   Your bank account is hacked

    *   Security Alert: Save your email accounts


    If the email content asks for the following information, it is a spoofed email:

    *   Personal details or your bank account details

    *   Requesting you to send money to a particular account

    *   Password reset link though you did not request a password change

    *   Other unknown links to verify details


    ### How do you confirm that the email is indeed a spoofed or spam email from the
    email headers?

    You can determine the authenticity of the email by looking for either of the following
    parameters within the email source:


    - `Received-SPF`: `SPF` is an implementation of authorization through a `TXT DNS
    record` in the domain’s DNS zone to authorize emails to be sent only from authorized
    sources. The syntax contains an `IP address` added by the domain owner, which
    means the `SPF` check in the email headers will pass only if the email originated
    from that `IP`. If the email originated from any other `IP`, the `SPF` check fails,
    and the emails are redirected to the spam folder of the recipient.

