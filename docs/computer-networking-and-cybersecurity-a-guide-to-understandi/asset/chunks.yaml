    You will see that 1000Base-T networks are strikingly similar to their predecessor
    100Base-T networks except in areas such as network cabling requirements. Star
    topology networks are more expensive than bus topology networks because the use
    of wired network cables is greater. Also, the labor costs to install that wire
    is more expensive, and the need for routers or hubs also stacks up the overall
    cost. However, this expensive budget is not worthless. Star topologies are more
    reliable and offer better performance than networks using a bus topology. Not
    only does it offer higher bandwidth performance, if the isolated network connections
    break or go bad, but the other connections will remain unaffected. Even if a problem
    do come up in a star topology network, it is easy and simple to troubleshoot as
    each network cable is going from the hub to the node directly.


    ### Ring Topology

    Unlike the other two topologies we have discussed so far, that use an arrangement
    of physical network cables, a ring topology network uses a logical arrangement
    instead. To elaborate, in a ring topology the actual physical network cable arrangement
    is that of a star topology, and each node of the cable is connected to their very
    own Media Access Units. But here’s the catch; despite the physical arrangement,
    the network cables electrically behave as a ring. This means that the signals
    coming from the network travel through the different nodes in a ring.


    A simple illustration of a ring topology network is shown below.

    ![](Image00010.jpg)(Physical Representation of Ring Topology)

    ![](Image00011.jpg)(Electrical Representation of a Ring Topology)


    Unlike the bus and star network topologies based on Ethernet, the ring topology
    is based on Token Rings instead. Sometimes, a network using a ring topology can
    also be seen running on a fiber-optic network, usually with a bandwidth capacity
    of 100 Mbps instead of copper-based cables. This network is based on `FDDI` or
    `Fiber Distributed Data Interface`. The main use of a ring topology is for big
    telecommunication networks such as the Synchronous Optical Network, which is also
    known as `SONET`. Ring topology is also used in storage area networks.


    # Chapter 4: Wireless Communication Systems and Connecting to the Internet


    ## What is Wireless Communication?

    Wireless communication rarely requires a physical medium or a channel to transmit
    the signals. Rather these allow the signals to travel through space and are commonly
    called an unguided medium of communication.


    ## Connecting to the Internet

    In this section, you will learn about the fundamentals of Internet connectivity
    and its features.


    ### Wide Area Networks

    Wide Area Networks or `WAN` is just a Local Area Network with a wider range. Wide
    Area Networks can be defined as multiple interconnected Local Area Networks. `WANs`
    are preferred when a better and wider range approach is required of a Local Area
    Network. Establishing Wide Area Networks can be done in multiple ways. To determine
    which method to adopt in setting up a `WAN`, the organization or company need
    to consider different aspects such as:


    - The regularity with which the Local Area Networks must be used.

    - The regularity with which the Local Area Networks must be connected with each
    other.

    - The “bandwidth”, or data capacity required by the network.

    - The measurement of the distance between each Local Area Network point.


    By factoring in these aspects, a suitable solution can be implemented to establish
    an optimal Wide Area Network. For instance:


    1. Establishing a Wide Area Network using a leased telephone line capable of supporting
    a bandwidth of up to `56Kbps`.

    2. Establishing a Wide Area Network using dedicated `DS1` lines capable of supporting
    a bandwidth of up to `1.544 Mbps`.

    3. Establishing a Wide Area Network using dedicated `DS3` lines capable of supporting
    a bandwidth of up to `44.736 Mbps`.


    A Wide Area Network can even be established by using a private satellite, which
    ultimately supports even higher bandwidth. Hence, to choose the best option for
    a `WAN` connection, it is recommended first to assess the situation and needs
    to come to a clear solution. The emergence of Wide Area Networks began when users
    on a Local Area Network needed to access the resources on another Local Area Network.
    This was all too often observed in big institutions such as business companies,
    organizations, hospitals, banks, and schools, etc.


    Let’s discuss a brief example. Consider a big company with several buildings specializing
    in their respective functions. There’s the main headquarters of the company, and
    then there are the warehouse units of the same company but in a different location.
    Now, the main headquarters of the company houses some much-needed resources such
    as the `ERP`, or `Enterprise Resource Planning` system. For the warehouse to properly
    perform its job, it needs access to the inventory and shipping functions provided
    by this resource. Since the warehouse and the headquarters are in different physical
    locations, the Local Area Network of the warehouse needs access to the Local Area
    Network of the headquarter. So, the company will implement a Wide Area Network
    connection to resolve this issue. Generally, if an organization can design the
    infrastructure of its system so it does not need a Wide Area Network connection,
    this is better. The reason for this lies in the cost required to maintain the
    Wide Area Network links properly.


    ### Internet and Intranet

    Remembering the wide-spread popularity of the Internet and its importance in our
    modern society, the productivity of any business company is crippled if they do
    not properly use the Internet. Handling and maintaining Internet connectivity
    on a network is a very pivotal job, as even several minutes of Internet downtime
    can create a pile of problems for the organization. Hence, the Internet is a very
    crucial service and feature of computer networking. Now, very few people are unfamiliar
    with the Internet. With its amazing productivity and reachability, virtually all
    companies today take advantage of the Internet’s key services such as `e-mails`,
    accessing the World Wide Web, and using the Usenet newsgroups.


    Implementing an Internet connection on a network involves another entity known
    as the `Internet Service Provider` (`ISP`). The connection of a person or organization
    with the `ISP` is basically a telecommunications network connection. The connection
    from the `ISP` to the client is established by using a physical medium such as
    a line. There are several types of connections offered by `ISPs` depending on
    the client, for example:


    - `DSL` line

    - `ISDN` line

    - `Fractional/Full DS1` connection

    '
