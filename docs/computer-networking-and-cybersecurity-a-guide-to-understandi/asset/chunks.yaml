    # Chapter Three: Recognizing and Countering a Phishing Attack


    ## What is Phishing?

    Using a phishing attack, an attacker tries to get sensitive information, such
    as user accounts, bank and credit card details, and other important credentials.
    As mentioned earlier, the attacker may use electronic media, such as text messages
    or emails, and pose as a genuine user or organization to trick the end user into
    clicking a link or downloading an attachment. Since the email looks like it has
    come from a legitimate source, the user may divulge some sensitive information.


    Phishing attacks have been pain points for both individual users and organizations.
    Any kind of information gained from an individual or organization is valuable
    as it may help the attacker gain monetary benefits or attack the network used
    by the organization. Additionally, some states or nations may use phishing attacks
    to obtain the sensitivity of other countries.


    ## Methods used for Phishing

    The most common method used for phishing is an email where the attacker tries
    to obtain sensitive information by coercing users to access and interact with
    malicious websites. Here are some other methods that hackers use to perform this
    attack:


    *   An attacker may manipulate links in emails sent to you. They do this by changing
    the `URL` slightly, so the user cannot differentiate between the malicious link
    and the actual website. For instance, most web-based applications offer a “Forgot
    Password” feature. When you click on the button, the website sends you an email
    to reset the password. If the hacker manages to reroute the email, they can send
    you a different link where you enter your username and the answer to a security
    question. The hacker can then use that information to access your account.

    *   Some hackers also use website forgery as a means of phishing. This is a process
    where the attacker uses `JavaScript` commands to develop a fake website that looks
    genuine. This makes it easier to track the user.

    *   Attackers also make use of a technique known as covert redirection. In this
    process, they infect genuine websites to throw pop-ups. A user clicks on links
    in the pop-up that redirect him or her conveniently to the attacker’s website.

    *   Attackers can deploy malware and ransomware to a user’s system or network
    through `infected.EXE` attachments, `PDFs`, and Microsoft Office attachments.

    *   Attackers can also perform phishing attacks through other media, such as text
    messages, telephone calls, and social media.


    ## Common Ways to Tackle Phishing Attacks

    This section lists the different methods to protect your system and network from
    different types of phishing attacks. Some of the common methods used are:


    *   Malware Scanners

    *   Auto updates

    *   Multi-factor Authentication

    *   System or data backups


    This will be detailed later in the book. In addition to the methods mentioned
    above, there are other techniques you can use to protect your system and network
    from phishing attacks.


    ## Types of Phishing and How to Protect Yourself against Them


    ### Deceptive Phishing

    Deceptive phishing is the most common type of phishing attack. The attacker employs
