  trans: '


    这两种关系本质上定义了网络的逻辑结构。为了更好地理解它们，可以将其与不同的管理哲学进行类比。点对点（或“P2P”）网络非常类似于去中心化的管理哲学，决策在本地做出，并根据用户首要需要完成的任务来管理资源。客户端/服务器（Client/server）网络几乎像一家使用集中化管理的公司，决策由少数人小组内部的中心位置做出。在某些情况下，P2P
    和客户端/服务器关系都是合适的，许多网络在设置中同时包含了这两者。P2P 和客户端/服务器网络都需要 OSI 模型中的某些层保持通用，并且使用相同网络协议的通信计算机之间需要物理网络连接。在这方面，这两种计算机关系在网络中实际上是相同的。然而，主要的区别在于，你是将共享的网络资源分布在网络中的所有计算机上，还是使用集中的网络服务器。


    # 网络的核心硬件元素

    为了强化和巩固我们在讨论中探索的概念基础，你必须更多地了解构成计算机网络的物理硬件组件。目前为止，我们更多地关注网络在虚拟层面上是如何工作和交互的，而不是物理层面。然而，通过理解网络在其虚拟领域中的行为，我们现在为理解硬件奠定了基础。理解计算机网络的物理方面为我们提供了充分的知识，使不仅能够正确地建立计算机网络，还能对其进行故障排除和维护。在本节中，我们将讨论以下硬件，每种都是网络的核心组件：


    1. 服务器

    2. 集线器

    3. 路由器

    4. 交换机

    5. 布线和电缆系统

    6. 工作站硬件


    在这一章的最后部分，我们将在引导网络流量的范围内讨论这些硬件组件。然而，我们将仅关注理解这些组件及其用途。


    ## 服务器

    服务器是在计算机网络中被分配了重要且高要求任务的计算机。服务器计算机本质上是处理网络上计算机所有网络请求和其他功能的组件。根据网络功能，服务器可以分为以下不同的类别。


    *   **文件和打印服务器**：此类服务器包括主要为其他计算机提供文件共享服务，并处理基于网络打印机请求的服务器。

    *   **应用服务器**：本质上为程序和软件提供特定网络应用服务的服务器属于此类。例如，运行数据库的服务器可以（根据请求）为连接到该服务器的分布式应用程序提供数据库访问权限。

    *   **邮件服务器**：主要设计用于存储电子邮件并为相应客户端提供互连服务的服务器分类为“邮件服务器”。

    *   **网络服务器**：此类服务器主要提供与网络相关的各种服务。例如，编程用于分配 `TCP/IP` 地址的 `DHCP` 服务器被归类为网络服务器。同样，处理数据包通过不同网络进行路由的服务器（`routing
    server`）正在提供网络服务，因此被归类为网络服务器。网络服务器执行的其他此类服务包括加密、解密、安全访问和 VPN 访问服务。

    *   **互联网服务器**：提供常见互联网服务的服务器，如万维网（World Wide Web）、Usenet 新闻 (`NNTP`) 甚至基于互联网的电子邮件服务，被称为互联网服务器。

    *   **远程访问服务器**：此类服务器通常作为想要远程访问网络的用户的网关或访问点。


    安装在服务器上的操作系统是非常特定的，并经过了定制，以实现我们刚刚提到的任务性能。例如，如果服务器使用由 `Microsoft` 分发的操作系统，那么它最可能正在使用
    `Windows Server` 版本。同样，服务器也可以运行专为网络设计的 `Linux` 或 `UNIX` 发行版。根据安装的操作系统，服务器可以执行网络功能，也可以仅专门执行少数功能。但服务器并不总是需要符合每一个网络功能；根据其用途，服务器可以只负责几项网络操作，这就足够了。通过这种方式，用户可以部署多台服务器，每台都针对某些网络操作进行了优化。以下是使服务器与家用客户端计算机具有不同等级的一些特征：


    *   服务器计算机在其硬件架构中原生集成了冗余元素。这意味着即使硬件内部某些部分损坏或故障，服务器仍将保持正常运行。为了实现这种冗余，服务器计算机的内部配备了多个电源和冷却扇，保护计算机免受任何相应硬件组件故障而导致的故障。

    *   服务器计算机的子系统也经过专门设计以优化数据流。如果我们分析典型的服务器，会发现磁盘、内存和网络子系统的设计方案与桌面式计算机使用的不同。这种设计不仅支持上述子系统的高性能提升，还优化了数据流。因此，在服务器、客户端和网络等不同点之间移动的数据经过了更多的优化，速度也更快。

    *   由于服务器在计算机网络中处于关键位置，因此对计算机的“健康”会被特别关注。服务器计算机在软件和硬件层面都具有专门设计的监控参数；机器本身可以关注健康状况的任何警报性恶化，并在故障发生前本质上向用户发出。例如，安装在服务器中的常见监控项目之一是
    `temperature monitors`；如果服务器周围的温度升高过高，它会发出详细说明问题的警告。通过这种方式，维护服务器的人可以在问题导致硬件故障之前获知问题，并能够优先解决这个问题。


    '
