    ## 2. BNC 连接器

    ## 3. 带有公 BNC 接头的 RG-58 电缆


    在预算方面，总线拓扑网络是三种方案中最便宜的。这是因为与星型和环形拓扑相比，总线拓扑网络使用的网络电缆较少。因此，总线拓扑网络使用的材料较少，需要的安装人工也更少。然而，虽然总线拓扑在成本上优于其他两种，但它也有明显的缺点。总线网络更加敏感容易故障，因为它包含多个子尺度，本质上创建了一个分段。这些子尺度必须连接到节点。现在，这种复杂性引入了一个新问题，即：


    * 如果总线拓扑网络的分段故障，将导致网络中段的故障。

    * 识别故障源更加繁琐且耗时，因为技术人员必须检查所有可用电缆连接，直到确定故障分段的源。


    由于总线拓扑网络似乎不可靠且更容易故障，许多新的有线网络安装不再使用这种拓扑。然而，总线拓扑网络可能出现在旧的网络安装中。过去最常用且目前仍少量存在的总线拓扑网络是
    `10Base-2` 以太网（也称为细以太网）。细以太网具有以下特征：


    * 10 Mbps 最大速率额定

    * 使用的网络电缆类型和连接器类型为 `RG-58/AU` 或 `RG-58/CU`（分别为轴电缆和 BNC 连接器）

    * 为了正常运行，网络要求每个分段的末端都配备 50 欧姆终端连接器

    * 每个分段的最大节点容量为 30 个节点

    * 最大分段长度为 185 米（或 607 英尺）

    * 中继器可以扩展分段

    * 每个节点之间的最小距离应为 0.5 米或 1.5 英尺的电缆距离


    在使用总线拓扑的网络中，中继器允许用户将三个分段连接在一起，每个连接的分段最多支持 30 个节点（将中继器计为一个节点）。如果唯一的目的是扩展信号距离且分段没有连接任何节点，则可以再增加两个分段。这将通过使用中继器增加五个分段。整个重复分段的最大长度不应超过
    925 米（或 3,035 英尺）。为了记住这种安排，我们可以简单记住 `5-4-3` 规则：


    * 五个分段

    * 四个中继器

    * 三个带有节点的分段


    ## 星型拓扑

    在星型拓扑网络中，连接的计算机、服务器或简单的节点都连接到单个中央单元。在这种有线布局中，连接从主单元向外辐射，类似于星的形状。这个中央单元通常被称为 `hub`（集线器）或
    `concentrator`（集中器）。集线器承载许多辐射到网络中相应节点的网线。在技术术语中，集线器被称为 `Multistation Access Unit`（多站访问单元）或简称
    `MAU`。然而，这个术语严格用于令牌环（Token Ring）网络。在星型拓扑网络中，有多种尺寸的集线器可选。例如，某些集线器支持不超过两个节点，而有些集线器支持多达十六个节点。通常，这种网络使用的标准中央集线器单元支持
    24 个节点。无论如何，即使我们使用 24 节点集线器或 96 节点集线器，我们仍然拥有将多个节点连接到集线器并根据自己的需要构建网络的自由。这里是星型拓扑网络的简单插图
    ![](img/Image00009.jpg)


    然而，请记住，由于集线器被用作中央单元，在本章之前的章节中会出现复杂情况。集线器会在与其他端口之间广播网络流量。因此，来自任何节点的网络流量都会回传到其他节点。这意味着节点的整个带宽连接在与其他节点连接之间共享。例如，如果集线器的总带宽速度为
    100 Mbps，但一个节点仅使用总带宽的 50 Mbps，那么其他节点就无法访问剩余带宽，而是必须共享这 50 Mbps。简单来说，一个节点的可用总带宽与其他节点之间共享的带宽是相同的。在采用星型拓扑的网络中，有多种可用的以太网连接，列如下：


    * `100Base-T` 以太网是最常用的，提供高达 100 Mbps 的带宽限制。

    * `10Base-T` 以太网常见于旧网络。这种以太网的带宽限制为 10 Mbps。

    * `1000Base-T` 以太网是一种较新的以太网标准，被称为千兆以太网。它提供 1000 Mbps 或 1 Gbps 的带宽容量。

    * `10GBase-X` 是最新的以太网标准。它被称为 10 千兆以太网，使用光纤电连接提供 10 Gbps 的带宽容量。


    让我们谈谈 `10Base-T` 和 `100Base-T` 以太网连接的电缆要求：


    * `10Base-T` 以太网需要 3 类（Cat-3）双对网络电缆。

    * `100Base-T` 以太网需要 5 类（Cat-5）双对网络电缆。


    记住，尽管 `10Base-T` 以太网可以使用 `Cat-3`，但 `100Base-T` 以太网需要 `Cat-5` 双对网络电缆。每当 `10Base-T`
    以太网可以使用 `Cat-3` 时，`100Base-T` 以太网就需要 `Cat-5` 双对网络电缆。只要 `10Base-T` 以太网可以使用 `Cat-3`，`100Base-T`
    以太网就不能使用。例如，如果你使用的是 `Cat-5` 网络，那么你可以使用 `Cat-5E`，而如果资金不是问题，你甚至可以使用 `Cat-6`。以下是
    `10Base-T` 网络共享的布线特征：


    *它们需要双对单层线。这些双对线可以是屏蔽的或非屏蔽的。

    * 可以在 `Cat-3` 或更新的标准（如 `Cat-5`）上运行。

    * 每个节点的长度限制为 100 米（或约 328 英尺）。

    * 对逻辑分段的节点数量没有限制。

    * 在所有连接中，它们使用 `RJ-45` 连接器。


    `1000Base-T` 网络优于 `100Base-T` 网络的一个显著优势是它们：


    * 兼容 `Cat-5` 网线

    * 速度是 `100Base-T` 网络的十倍，即 1 Gbps 或 1000 Mbps，而非 100 Mbps


    可以说，`1000Base-T` 网络最重要的优势之一是它们对 `Cat-5` 电缆的兼容性。如今，75% 安装网络中最常用的网络电缆正是 `Cat-5`。如果已经存在
    `Cat-5` 电缆系统，可以在不更换系统的情况下安装 `1000Base-T` 网络。这不仅节省了时间，还节省了安装成本、布线成本和人工，因为为整栋建筑安装新的电缆网络标准是非常贵的。以下是
    `1000Base-T` 对应 `Cat-5` 网络的一些特征：


    * 这些网络需要四对单层线。

    * 它们至少需要 `Cat-5` 或更好的网络电缆标准（`Cat-5E` 或 `Cat-6`）。

    * 每个节点的长度限制为 100 米。

    * 对逻辑分段的节点数量没有限制。

    * 在所有连接中，它们使用 `RJ-45` 连接器。


    '
