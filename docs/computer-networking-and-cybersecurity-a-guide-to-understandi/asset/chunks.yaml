    在为网络选择合适的集线器（hub）时，首先要考虑到的是网络规格。通过了解预计有多少个节点连接到集线器、每个节点所需的带宽以及集线器所使用的网络骨干类型，我们可以选择最适合该网络的集线器。在通常与集线器配合使用的网络骨干方面，它们通常从共享
    10 Mbps 细以太网到 100 Mbps 的 `100Base-Tx` 以及高速网络不等。无论何种情况，骨干技术选择主要取决于网络的带宽需求以及设计网络需要满足的其他标准。从技术上讲，在使用集线器的网络中，集线器充当“冲突域”，冲突通常发生在此处。因此，如果我们在单个网络设置中使用多个集线器，网络中的冲突域将不可避免地变大。唯一的例外是集线器分别连接到交换机（switch）。通过使用交换机，我们可以将每个集线器的冲突域限制在其内部。下图显示了一个使用多个集线器的网络。![](img/Image00005.jpg)


    ### 交换机

    顾如名，交换机是网络中的硬件组件，可以快速地从一个端口切换连接到另一个端口。交换机通过在多个可用网络端口之间动态切换来创建网络中的这些连接。考虑一个火车站场，有几列火车从特定的轨道进入并从其他轨道离开。火车站场有一个指定的人员负责管理火车的移动和路线。这个人被称为“场长”。为了确保火车到达目的地，场长经理本质上是根据其指定的路线切换轨道。在这个类比中，“交换机”就是“场长经理”。交换机不是通过切换轨道来引导火车，而是通过以太网电缆在网络中引导数据包。通过这种方式，数据包被有效地路由到其终地。我们知道，交换机在网络的任何两个给定端口之间建立个性化连接；所有汇聚到交换机设备的端口不共享共同的冲突域是合逻辑的。这就是为什么交换机设备的作用有点类似于超级网桥器（super
    bridge）。由于交换机的特性，它们主要被用于桥接网络中集线器与较快骨干网之间的连接。


    例如，考虑一个使用十个集线器的网络。每个集线器支持多达 24 个工作站连接节点。有了十个集线器，我们大约会有 240 个连接节点，这意味着总共有 240 个工作站连接到集线器。如果这些集线器连接到网络中的同一骨干网，那么意味着所有集线器的冲突域将是相同的。当
    240 个工作站共享同一个冲突域时，网络性能将会下降。在这里，我们可以通过使用 12 端口的交换机来解决这个问题。早些，交换机的每个端口都有自己独立的冲突域。在这里，所有连接到
    12 端口交换机的十个集线器都将拥有自己的域，从而维持网络质量。工作站通常使用 `100Base-T` 网络连接。网络专家会建议使用 `1000Base-T`
    或更高的连接作为骨干网络。通过使用交换机和快速骨干网，通过节点连接到网络的工作站可以以 100 Mbps 的速度运行。交换机对网络速度和性能的影响如此，以至于使用交换机变成了一件理而易见的事。另一个让交换机在网络中如此受欢迎的方面是它们非常廉价。对于典型的局域网来说，使用交换机而不是集线器更有意义，因为集线器是昂贵的网络组件。相比之下，交换机价格低廉，为网络提供更多功能，而且安装相对更容易更简单。如今，你可能会发现很难在市场上找到可用的桥接器（bridge），因为交换机的供需关系是压倒性的。了解并理解集线器的原因是虽然它们现在不再被使用，但你可能仍然遇到使用集线器的旧安装设备。在较新的网络安装中，可以保证你将只与交换机打交道。重申这些集线器和交换机的主要概念：集线器创建一个数据冲突域，而交换机具有较小的、分离的冲突域。


    ### 桥器

    桥器是一种硬件设备，功能与中继器（repeater）相同，但更智能。桥器通过连接两个网络段来工作，就像中继器一样；主要区别在于当桥器必须将数据流量从一个段传递到另一个段时，它是智能地执行的。这意味着只有当数据流量的目标是目标网段时，桥器才会将流量传递到另一个段；否则，它不会这样做。桥器的另一个不同特征是它们还将网络划分为更小的网段。某些桥器可以连接到两个网络段。例如，这样的桥器可以跨越从同轴细以太网到绞对令牌环网（Token
    Ring）。


    我们讨论过中继器运行的层级（那是 OSI 模型的物理层）。人们会认为，既然桥器的功能和目的与中继器几乎相同，它们也将运行在 OSI 网络模型的第一层。然而，事实并非如此；相反，桥器运行在更高一层的层，即第二层，也称为
    OSI 网络模型的数据链路层。这是因为桥器连接网络段，然后“智能”地将数据流量从一个段传递到另一个段。为了实现这一点，桥器分析每个遇到的数据包的 `MAC`
    地址（介质访问控制地址）。对 `MAC` 地址的分析有助于桥器判断是否应该将数据包转发到另一个网络。桥器设备可以存储网络地址数据的部分。这可以通过两种方式之一实现：


    1. 用户编写一个包含地址信息和数据的静态路由表。

    2. 用户实现一种动态学习系统，通过自动识别和发现网络地址以树形模式进行学习。


    桥器不应随意使用。以下是建议在网络中使用桥器的场景：


    *   如果你正在处理一个小规模网络，可以使用桥器。

    *   如果网络正在使用中继器，可以使用桥器来替代中继器。

    *   如果你处理的网络在网络流量不在不同网段间进行不必要的传输时能获益，那么应该使用桥器。


    '
