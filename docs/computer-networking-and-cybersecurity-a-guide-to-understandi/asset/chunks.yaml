- raw: 'Hubs, Switches, and Routers The purpose of hardware components such as hubs,
    switches, and routers is purely to facilitate the establishment and proper functioning
    of a network. Hence, these three components are ‘pure’ networking hardware and
    categorized under the class of ‘internetworking devices.’ These components are
    essentially the foundation of any basic or complex network, as the entire cabling
    system in a network is connected to these devices. In terms of the OSI networking
    model, the data flow from these devices can be defined at the physical, data link,
    or even the network layer. Let’s talk about hubs first. Hubs are also commonly
    called ‘concentrators.’ The core purpose of a hub provides a point of central
    connection for the network cables. Hubs can support multiple network cables; the
    number of cables is a matter of the hub’s size. A typical small hub can connect
    network cables coming from two computers while a large hub can support over sixty
    computers (depending on the specification). The most popular hub is neither ‘small’
    nor ‘large’, but a ‘medium-sized’ hub that generally supports up to 24 client
    computers. In a hub, there is a logical wire through which the connected client
    computers communicate with the network. The capability of this logical wire is
    known as the ‘collision domain.’ Sometimes, interference results when too many
    client computers are connected to a single hub and attempt to communicate with
    the network. We will now discuss switches . The circuital infrastructure (how
    the wires have been arranged) of a switch is strikingly similar to that of a hub.
    A switch also looks similar to a hub. Although the conceptual foundation of the
    working of hubs and switches are also very similar, the similarity ends there.
    Unlike the hub, each connection port on a switch has its own collision domain.
    In this way, each network connection on a switch can freely communicate with the
    network through a separate collision domain rather than a single one. Each network
    connection on a switch is made to be a private connection. Nowadays, most computer
    networks implement switches instead of hubs, mainly because they are a cheaper
    solution. However, switches also have numerous benefits over hubs (we’ll leave
    this discussion for some other time since the main focus is to learn how they
    work). Good network solutions will use one or more backbone switches, which connect
    to the main switch(es). These backbone switches generally operate at a speed much
    higher than the main switch(es). However, even if hubs are used in a network solution,
    there will still be the use of a backbone switch (which is simply an individual
    switch connected to the hub). The figure below shows a typical arrangement of
    switches and hubs in a network. ![](Image00003.jpg)Last but not least, the router
    . By now, we have given adequate attention to the details of how a router works
    and functions. We now know that the primary job of a router in a computer network
    is to route the data packets effectively through one network on to the next. A
    router can also be a bridge that offers a path of flow for the data packets between
    two connected networks. These two networks establish a connection to the router
    by using their respective types of wiring and connection. Let’s understand this
    better through an example. Consider a router in a network that establishes a connection
    between a 10Base-T network and an ISDN telephone line. In this scenario, the router
    is dealing with two network connections, one from/to the 10Base-T network and
    the other from/to the ISDN telephone line. The job of the router will be to create
    a proper route for the data packets to travel between these two network connections.
    Besides these defined network connections, the router can also have another terminal
    connection. The purpose of this secondary connection would be to program and maintain
    the router itself. Cabling and Cable Plants When setting up a computer network,
    you’ll find there is a huge variety of network cables available to use. But on
    this level, we should only concern ourselves with the main network cables commonly
    used. The most common network cable used while setting up a Local Area Network
    connection is the Category 5 twisted-pair cables. These cables are also called
    ‘Cat-5’ cables. The cable has four twisted pairs; this means it has eight wire
    contact points. Due to this design, the cable can carry the network signal to
    each of these eight wire points. The Category 5 twisted-pair network cable is
    primarily used with Base-T networks such as the 100Base-T network and the 1000Base-T
    Ethernet network. A lower-grade version of this same network cable is also available,
    and it is termed ‘the Category 3 twisted-pair cable’. The overall design and structure
    of the network cable are similar to that of the higher-end Cat-5 cable; the main
    difference is the number of pairs it supports. While the Cat-5 cable has four
    twisted pairs of wires, the Cat-3 cable has two twisted pairs of wires, i.e.,
    half of the Cat-5. Hence, the Cat-3 twisted-pair network cable is generally used
    to support older network connections such as the 10Base-T network and uses connectors
    comparatively smaller than the Cat-5 connectors. Similarly, there are newer and
    improved versions of the Category 5 twisted-pair cables available now. There is
    the improved Cat-5E cable and the new Cat-6 standard network cable. There isn’t
    much difference between the Cat-5 and the newer versions; the Cat-5E and Cat-6
    are essentially the same as Cat-5 cables. The only difference is these newer twisted-pair
    network cables support higher network specifications, making them ideal for installation
    in networks running at higher speeds. Since there’s little physical difference,
    the newer versions are backward compatible with the older network types. If you
    used Cat-5 cable for a 100Base-T network, then you can also the Cat-5E and Cat-6
    network cables for the same network connections. Another type of network cable
    popular in the past but is not so common for newer network installations nowadays
    is the coaxial cable . This cable can be found installed in old network installations
    in old buildings. Let’s talk about the structure of the coaxial cable. In this
    network cable, there is a central core, usually no more than a thick wire, made
    up of copper and known as the ‘conductor.’ This core is surrounded by a plastic
    material. This plastic cover over the conductor is wrapped with a ‘shield’ which
    is basically braided metal. Over this shield, there is an outer covering made
    out of plastic. Back in the day, you might have seen a thick cable that would
    connect your television set to the TV cable station’s network. This cable was
    also a type of coaxial cable, and this same cable was also used for cable modems
    as well in the olden days. The particular coaxial cable used in networks such
    as ‘Thin Ethernet’ or 10Base-2 was the RG-58 coaxial cable. Similarly, for networks
    such as ARCnet, another (but similar) coaxial cable would be used, which was the
    RG-56 coaxial cable. The coaxial cable to be used would depend on the specification
    of the network in which it was being installed. A network’s specifications would
    define the support for a certain type of coaxial cable. This imposed a limitation
    on compatibility and universal usability of the coaxial cable. This meant that
    different coaxial cables could not be mixed when setting up a network, and it
    was very important to use the specified cable for the network being built. Let’s
    move on to discussing cable plants . A ‘Cable Plant’ is a term used to describe
    the complete installation of the network cable in the designated building. When
    we talk about a network’s cable plant, we are referring to the network cables,
    the connectors, the wall plates, the patch panels, and the networking equipment
    related to networking cables installed in the building. On the surface, the network
    cable installation and cable management might seem like a simple to-do task, but
    quite the opposite. Cable plants are very difficult and complex; due to this,
    it is always recommended to choose a vendor that is adept and experienced in cable
    plant installation. Workstation Hardware In a professional setting, the computers
    being used by the people connected on a network are network workstations. Generally,
    the workstations are the network client PCs on a network. However, workstations
    can also be modified to function as network servers. A workstation termed a ‘network
    client’ usually has these features. '
  fmt: "\n# Hubs, Switches, and Routers\n\nThe purpose of hardware components such\
    \ as hubs, switches, and routers is purely to facilitate the establishment and\
    \ proper functioning of a network. Hence, these three components are ‘pure’ networking\
    \ hardware and categorized under the class of ‘internetworking devices.’ These\
    \ components are essentially the foundation of any basic or complex network, as\
    \ the entire cabling system in a network is connected to these devices. In terms\
    \ of the OSI networking model, the data flow from these devices can be defined\
    \ at the physical, data link, or even the network layer.\n\n## Hubs\n\nHubs are\
    \ also commonly called ‘concentrators.’ The core purpose of a hub provides a point\
    \ of central connection for the network cables. Hubs can support multiple network\
    \ cables; the number of cables is a matter of the hub’s size. A typical small\
    \ hub can connect network cables coming from two computers while a large hub can\
    \ support over sixty computers (depending on the specification). \n\nThe most\
    \ popular hub is neither ‘small’ nor ‘large’, but a ‘medium-sized’ hub that generally\
    \ supports up to 24 client computers. In a hub, there is a logical wire through\
    \ which the connected client computers communicate with the network. The capability\
    \ of this logical wire is known as the ‘collision domain.’ Sometimes, interference\
    \ results when too many client computers are connected to a single hub and attempt\
    \ to communicate with the network.\n\n## Switches\n\nThe circuital infrastructure\
    \ (how the wires have been arranged) of a switch is strikingly similar to that\
    \ of a hub. A switch also looks similar to a hub. Although the conceptual foundation\
    \ of the working of hubs and switches are also very similar, the similarity ends\
    \ there. \n\nUnlike the hub, each connection port on a switch has its own collision\
    \ domain. In this way, each network connection on a switch can freely communicate\
    \ with the network through a separate collision domain rather than a single one.\
    \ Each network connection on a switch is made to be a private connection. \n\n\
    Nowadays, most computer networks implement switches instead of hubs, mainly because\
    \ they are a cheaper solution. However, switches also have numerous benefits over\
    \ hubs (we’ll leave this discussion for some other time since the main focus is\
    \ to learn how they work). Good network solutions will use one or more backbone\
    \ switches, which connect to the main switch(es). These backbone switches generally\
    \ operate at a speed much higher than the main switch(es). However, even if hubs\
    \ are used in a network solution, there will still be the use of a backbone switch\
    \ (which is simply an individual switch connected to the hub).\n\nThe figure below\
    \ shows a typical arrangement of switches and hubs in a network. ![](Image00003.jpg)\n\
    \n## Routers\n\nLast but not least, the router. By now, we have given adequate\
    \ attention to the details of how a router works and functions. We now know that\
    \ the primary job of a router in a computer network is to route the data packets\
    \ effectively through one network on to the next. A router can also be a bridge\
    \ that offers a path of flow for the data packets between two connected networks.\
    \ These two networks establish a connection to the router by using their respective\
    \ types of wiring and connection.\n\nLet’s understand this better through an example.\
    \ Consider a router in a network that establishes a connection between a `10Base-T`\
    \ network and an `ISDN` telephone line. In this scenario, the router is dealing\
    \ with two network connections, one from/to the `10Base-T` network and the other\
    \ from/to the `ISDN` telephone line. The job of the router will be to create a\
    \ proper route for the data packets to travel between these two network connections.\
    \ Besides these defined network connections, the router can also have another\
    \ terminal connection. The purpose of this secondary connection would be to program\
    \ and maintain the router itself.\n\n# Cabling and Cable Plants\n\nWhen setting\
    \ up a computer network, you’ll find there is a huge variety of network cables\
    \ available to use. But on this level, we should only concern ourselves with the\
    \ main network cables commonly used.\n\nThe most common network cable used while\
    \ setting up a Local Area Network connection is the `Category 5` twisted-pair\
    \ cables. These cables are also called `Cat-5` cables. The cable has four twisted\
    \ pairs; this means it has eight wire contact points. Due to this design, the\
    \ cable can carry the network signal to each of these eight wire points. The `Category\
    \ 5` twisted-pair network cable is primarily used with `Base-T` networks such\
    \ as the `100Base-T` network and the `1000Base-T` Ethernet network. \n\nA lower-grade\
    \ version of this same network cable is also available, and it is termed ‘the\
    \ Category 3 twisted-pair cable’. The overall design and structure of the network\
    \ cable are similar to that of the higher-end `Cat-5` cable; the main difference\
    \ is the number of pairs it supports. The `Category 5` twisted-pair network cable\
    \ is primarily used with `Base-T` networks such as the `100Base-T` network and\
    \ the `1000Base-T` Ethernet network. A lower-grade version of this same network\
    \ cable is also available, and it is termed ‘the Category 3 twisted-pair cable’.\
    \ The overall design and structure of the network cable are similar to that of\
    \ the higher-end `Cat-5` cable; the main difference is the number of pairs it\
    \ supports.\n\nThe `Category 5` twisted-pair network cable is primarily used with\
