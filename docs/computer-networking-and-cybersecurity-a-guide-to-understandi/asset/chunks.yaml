    the network needs to determine how these applications will be used, and how often
    they will be accessed. For instance, a company of over 1,000 employees will likely
    have over 90% of its populace using a word processor. Now you just estimate the
    number of documents created by each user per month, the average size of the document,
    and the average storage time for each document (usually either dating to 2 years
    or indefinite). By making these educated guesses, we can estimate the demand of
    the users from the network based on the average size of the documents created
    by the users if they wish to transfer such documents over the network. You repeat
    this process of estimation for the other applications. By doing this, you will
    end up with a safe guess of what’s the storage and bandwidth capacity required
    for the network. Once we are done with the common applications, we move on to
    the department and user-specific applications. For new companies, this step is
    relatively hard. The person designing the network will be ambiguous about the
    applications used by the departments unless they are informed about it. Similarly,
    for companies around for a while, the network designer will already know these
    specific applications that the network must support. It is very important to know
    about the impact of each departmental application as it can have a considerable
    impact on the network. For instance, a department related to accounting will most
    likely revolve around shared database files. The network design for such a system
    must differ from the standard client-server design. Here is a list of some of
    the most common categories of departmental applications.


    *   Accounting

    *   Distribution and Inventory control

    *   MRP or Material Requirement Planning

    *   IT

    *   Electronic commerce

    *   Human resources

    *   Payroll and stock administration

    *   Publishing

    *   Marketing

    *   Legal


    Assessing these specific categories of applications is the same as the common
    applications.


    ### Users

    Once we are done with estimating the application that the network must support,
    we can now work toward assessing the number of users that the network must also
    support along with the applications used by each user. Assessing the total is
    relatively easier. The company itself can provide this information, or you can
    infer it from their business plans and the long-range budget. While designing
    a network, one should also factor in the growth capacity of the company, i.e.,
    the network should be capable of supporting new users that join the company in
    the coming years. By studying the growth rate of the company, this demand can
    also be factored in while designing the network. Besides estimating the number
    of users that will be on the network, we also need to factor in some important
    questions about the users, which have been listed below.


    *   The Bandwidth Requirement: Aside from the normal use of network services,
    does any user have significant bandwidth requirements?

    *   Storage Requirement: Are there any users with significant storage requirements
    besides the general requirement of the majority of the users? For example, if
    the electronic imaging department needs to catalog many documents into an image
    file format on the network’s server, then how many users will need to access this
    cataloged data?

    *   Service Requirement: Are there any users in the company that need access to
    additional network services that most users normally do not? This question can
    be related to a group in a company that deals with sensitive data and needs to
    be partitioned from the rest of the groups on the local area network by using
    a network firewall.


    ### Network Services

    While designing the network, consider the range of network services. For different
    companies, the requirement for network services is also different. For instance,
    if a company requires a simple network setup, then it might only need simple network
    services such as file and print services along with an Internet connectivity service.
    But a complex network setup will include many other network services. Here’s a
    list of the network services that should be considered when designing a network
    for the company.


    *   File and print services

    *   Backup & restore services

    *   Internet connectivity

    *   FTP & telnet

    *   Web browsing and external e-mail services

    *   Internet security

    *   Remote access services

    *   DHCP services

    *   Centralized anti-virus services

    *   WAN services to other places

    *   Streaming services

    *   VoIP


    There are three main aspects you must know for each of the network services.


    1.  The storage and bandwidth needed by each service.

    2.  Knowing the way these services will be provided to the users. Knowing the
    server that will host these services. Each server needs to be set up.

    3.  The network service requirement of the users or groups in the company. The
    company will not require every network service to be available for the users.
    Other times, there will be users or groups within the company that will need access
    to specific network services as opposed to the general populace of the company.


    ### Meeting the Network Needs

    Once we are done with the assessment of the network requirements, the next thing
    to do is ensure these requirements are met. This step of the network designing
    process basically depends on the experience and resourcefulness of the person
    in charge of designing. There is no defined series of steps that, when followed,
    will give us a definite answer in what to do. Instead, you need to map the entire
    network to paint a portrait of what the network will be like. The foundation of
    this portrait will be the knowledge you have gained up to now in the assessment
    step of the network designing process. Another good practice is to seek feedback
    on your network design from networking professionals that have loads of experience
    in this field. Gathering advice from different critics and implementing it in
    your design may be the recipe for successful network design.


    ### The Basics of Hacking: The Kill Chain Process

    The main focus of hacking is usually penetrating a network or a user account.
    The latter is simpler as several techniques can be used to approach hacking someone’s
    account, such as using a brute force attack. In this book, we will discuss hacking
    regarding penetrating a network. However, we cannot cover every aspect related
    to hacking because an entire book can be written on this topic alone. Hence, we
    will only go through the main process of hacking, i.e., the Cybersecurity kill-chain
    process. A Cybersecurity kill chain process has eight essential steps, and these
    are:


    1.  `Reconnaissance`

    2.  `Intrusion`

    3.  `Exploitation`

    4.  `Privilege Escalation`

    5.  `Lateral Movement`

    6.  `Obfuscation`

    7.  `Denial of Service`

    8.  `Exfiltration`

    '
  trans: '


    在回答这些问题后，你将获得大部分网络需求。这些章节提供了一份指南，介绍如何通过评估网络需求来开展网络设计。


    ### 应用程序

    评估网络需求的一种有效方法是理解预计在网络上运行的应用程序。网络在帮助用户方面的效率决定了一个良好网络的优劣，而设计这样的网络与准确估算其用性直接相关。网络上的大多数用户将使用各种软件应用程序。因此，确保网络支持这些应用程序非常重要。在网络中，某些应用程序在公司的不同部门之间是通用的，而另一些应用程序则是特定部门或特定用户专用的。以下是网络中为所有用户安装的一些常用应用程序列表：


    *   文字处理器

    *   电子表格程序

    *   终端用户数据库

    *   图形化演示文程序

    *   电子邮件应用程序

    *   防病毒软件


    在列出为每个用户安装的应用程序后，网络设计人员需要确定这些应用程序将如何被使用以及访问的频率。例如，一家拥有超过 1000 名员工的公司可能会有超过 90%
    的人员在使用文字处理器。现在你只需要估计每个用户每月创建的文档数量、文档的平均大小以及每份文档的平均存储时间（通常为 2 年或无限期）。通过这些科学的推测，我们可以根据用户创建的文档的平均大小，估算出用户在希望通过网络传输此类文档时对网络的需求。对其他应用程序重复这一估算过程。通过这种方式，你将对网络所需的存储和带宽容量得出一个合理的估算。一旦完成了通用应用程序的评估，我们就转向部门特定和用户特定的应用程序评估。对于新公司来说，这一步相对困难。除非获得告知，否则网络设计人员将对部门使用的应用程序感到困惑。同样，对于运营了一段时间的公司，网络设计人员已经知道网络必须支持的这些特定应用程序。了解每个部门应用程序的影响非常重要，因为它们会对网络产生相当的影响。例如，与会计相关的部门很可能围绕共享数据库文件展开。此类系统的网络设计必须区别于标准的客户端-服务器设计。以下是一些最常见的部门应用程序类别：


    *   会计

    *   分销与库存控制

    *   MRP 或物料需求计划

    *   IT

    *   电子商务

    *   人力资源

    *   薪资与库存管理

    *   出版

    *   营销

    *   法律


    评估这些特定类别的应用程序与评估通用应用程序相同。


    ### 用户

    一旦我们完成了对网络必须支持的应用程序的估算，现在就可以评估网络必须支持的用户数量，以及每个用户使用的应用程序。评估总量相对容易。公司本身可以提供这些信息，或者你可以从他们的业务计划和长期预算中推断出来。设计网络时，还应该考虑公司的增长能力，即网络应该能够支持未来几年加入公司的新用户。通过研究公司的增长率，在设计网络时也可以将这一需求考虑在内。除了估计网络上的用户人数外，我们还需要考虑关于用户的的一些重要问题，这些问题列在下方：


    *   带宽需求：除了正常使用网络服务，是否有任何用户有重大的带宽需求？

    *   存储需求：除了大多数用户的通用需求外，是否有任何用户有重大的存储需求？例如，如果电子成像部门需要将许多文档以图像文件格式编目录到网络服务器上，那么将有多少用户需要访问这些已编目录的数据？

    *   服务需求：公司是否有任何用户需要访问大多数用户通常不需要的额外网络服务？


    '
