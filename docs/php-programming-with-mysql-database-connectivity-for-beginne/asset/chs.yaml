  ```php\necho mktime(23, 30, 0, 12, 31, 2023);\n```\n\n\n\nSwitch 是某些情况下非常有用的替代方案，当你想要根据单个值产生多个可能的分支，且使用一系列\
  \ `if` 语句会很繁琐时。\n\n### 1. If-else\n\n#### 语法：\n```php\nif (condition)\n{\n    statement-1\n\
  }\n```\n\n#### 或者带有可选的 else 分支：\n```php\nif (condition)\n{\n    statement-1\n}\n\
  else\n{\n    statement-2\n}\n```\n\n- 当处理一个 `if` 语句时，会计算测试表达式的值，并将结果解释为布尔值（Boolean\
  \ value）。\n- 如果 `condition` 为真，则执行 `statement-1`。如果 `condition` 为假且存在 `else` 子句，则执行\
  \ `statement-2`。\n- 如果 `condition` 为假且没有 `else` 子句，执行将直接继续到 `if` 结构之后的下一个语句。\n\n\
  #### 示例:-1 (简单 If)\n```php\n<?php\n$a=10;\nif ($a == 10)\n{\n    echo $a;\n}\n?>\n\
  ```\n\n#### 示例:-2 (简单 If 和 Else)\n```php\n<?php\n$a=10;\n$b=4;\nif ($a > $b)\n{\n\
  \    echo \"A is greater than\";\n}\nelse\n{\n    echo \"B is greater than\";\n\
  }\n?>\n```\n\n#### 示例:-3 (Elseif)\n```php\n<?php\n$a=2;\nif ($a == 1)\n{\n    print\
  \ \"Mon\";\n}\nelseif($a==2)\n{\n    print \"Thu\";\n}\nelse\n{\n    print \"wrong\
  \ choice\";\n}\n?>\n```\n\n#### 示例:-4 (嵌套 if……else)\n```php\n<?php\n$a=1;\n$b=2;\n\
  $c=3;\nif ($a > $b)\n{\n    if ($a > $c) {\n        print \"a is max\";\n    }\n\
  \    else {\n        print \"c is max\";\n    }\n}\nelse\n{\n    if ($b > $c)\n\
  \    {\n        print \"b is max\";\n    }\n    else\n    {\n        print \"c is\
  \ max\";\n    }\n}\n?>\n```\n\n### Switch\n\n- 对于特定类型的多路分支，`switch` 结构非常有用。\n- `switch`\
  \ 并不是根据任意逻辑表达式进行分支，而是根据单个表达式的值采取不同的路径。\n- 语法如下所示，可选部分包含在方括号 `[]` 中：\n\n```php\n\
  switch(expression)\n{\n    case value-1:\n        statement-1\n        statement-2\n\
  \        ...\n        [break;]\n    case value-2:\n        statement-3\n       \
  \ statement-4\n        ...\n        [break;]\n    .....\n    ……\n    [default:\n\
  \        default-statement]\n}\n```\n\n- `expression` 可以是一个变量或任何其他表达式，只要它能求得一个简单值（即整数、双浮点数或字符串）。\n\
  - 该结构通过求值表达式，然后将其结果与每个 `case` 值进行等性测试来执行。\n- 一旦找到匹配的值，将按顺序执行后续语句，直到遇到特殊语句（`break;`）或\
  \ `switch` 结构的结束。\n- 在结尾可以使用特殊的 `default` 标签，如果到为止没有其他 `case` 匹配该表达式，它将匹配该表达式。\n\
  \n#### 示例:\n```php\n<?php\n$a=6;\nswitch($a)\n{\n    case 1:\n        print \"Mon\"\
  ;\n        break;\n    case 2:\n        print \"Tue\";\n        break;\n    case\
  \ 3:\n        print \"Wen\";\n        break;\n    case 4:\n        print \"Thu\"\
  ;\n        break;\n    case 5:\n        print \"Fri\";\n        break;\n    case\
  \ 6:\n        print \"sat\";\n        break;\n    case 7:\n        print \"Sun\"\
  ;\n        break;\n    default:\n        print \"Wrong Choice\";\n}\n?>\n```\n\n\
  ## 第 5 章：PHP 中的循环\n\n循环：它允许程序员执行一个可以重复的操作，直到给定的条件为真。\n\n### 1. While\n- 最简单的 PHP\
  \ 循环结构是 `while`，它具有如下语法：\n\n```php\nwhile (condition)\n{\n    Statement\n}\n```\n\
  \n- `while` 循环将 `condition` 表达式评估为布尔值——如果为真，它执行 `statement` 然后通过重新评估 `condition`\
  \ 开始循环。\n- 如果 `condition` 为假，`while` 循环终止。当然，和 `if` 一样，`statement` 可以是一个单独的语句，也可以是一个大括号的块。\n\
  \n#### 示例:-\n```php\n<?php\n$a=1;\nwhile ($a <= 10)\n{\n    print \"count is $a<BR>\"\
  ;\n    $a = $a + 1;\n}\n?>\n```\n\n### 2. do-while\n- `do-while` 结构与 `while` 相似，不同在于测试发生在循环的最后。\n\
  - 语法为：\n\n```php\ndo\n{\n    code to be executed;\n}\nwhile (condition);\n```\n\n\
  - 语句执行一次，然后评估表达式。\n- 如果表达式为真，则重复执行语句，直到表达式变为假。\n- 与 `while` 相比，`do-while` 不同在于它至少执行一次语句。\n\
  \n#### 示例:-\n```php\n<?php\n$a=1;\ndo\n{\n    print \"count is $a<BR>\";\n    $a\
  \ = $a + 1;\n}\nwhile ($a <= 10);\n?>\n```\n\n### 3. For\n- 最复杂的循环结构是 `for`，语法如下：\n\
  \n```php\nfor (initial; condition; increment)\n{\n    statement\n}\n```\n\n- `for`\
  \ 循环通过初始化表达式、测试条件和更新表达式来执行。\n- 如果 `condition` 为真，循环执行 `statement` 然后执行 `increment`。\n\
  - 如果 `condition` 为假，循环终止。\n- `for` 循环通常用于已知循环次数的场景。\n\n#### 示例:-\n```php\n<?php\n\
  for ($i=1; $i<=10; $i++)\n{\n    print \"count is $i<BR>\";\n}\n?>\n```\n\n### 4.\
  \ Foreach\n- `foreach` 循环用于遍历数组中的每个元素。\n- 语法如下：\n\n```php\nforeach (array as value)\n\
  {\n    statement\n}\n```\n\n- `foreach` 循环也可以遍历数组的键和值：\n\n```php\nforeach (array\
  \ as key => value)\n{\n    statement\n}\n```\n\n- `foreach` 循环在处理完数组所有元素后会自动停止。\n\
  \n#### 示例:-\n```php\n<?php\n$colors = array(\"red\", \"green\", \"blue\");\nforeach\
  \ ($colors as $color)\n{\n    echo \"$color<br>\";\n}\n?>\n```\n\n### 5. Break 和\
  \ Continue\n- `break` 用于跳出整个循环。\n- `continue` 用于跳过当前迭代的剩余部分，直接进入下一次迭代。\n\n#### 示例\
  \ (Break):\n```php\n<?php\nfor ($i=0; $i<10; $i++)\n{\n    if ($i == 5) {\n    \
  \    break;\n    }\n    echo $i<br>\";\n}\n?>\n```\n\n#### 示例 (Continue):\n```php\n\
  <?php\nfor ($i=0; $i<10; $i++)\n{\n    if ($i == 5) {\n        continue;\n    }\n\
  \    echo $i<br>\";\n}\n?>\n```\n\n\n\n索引为 2，而“pratik”的索引为 3 。\n\n### 访问数组元素\n\n\
  一旦你创建了数组，如何访问内部的单个值呢？实际上，你这样做的方法与访问字符串中的单个字符的方法非常相似：\n\n```php\n$a = array( “Rahul”,\
  \ “ravi”, “ajit”, “pratik” );\n$b = $a[0]; // $myAuthor 包含 “Rahul”\n$c = $a[1];\
  \ // $anotherAuthor 包含 “ravi”\n$a = array( “Rahul”, “ravi”, “ajit”, “pratik” );\n\
  $pos = 2;\necho $a[$pos + 1]; // 显示 “ajit”\n```\n\n### 使用 `print_r()` 输出整个数组\n\n\
  你不能像对待普通变量那样直接用 `print()` 或 `echo()` 来打印数组，因为这些函数一次只能处理一个值。\n\n然而，PHP 确实提供了一个名为\
  \ `print_r()` 的函数，你可以用它来输出数组的内容以便调试。\n\n使用 `print_r()` 非常简单——只需将你想要输出的数组传递给它即可：\n\
  \n```php\nprint_r($a);\n```\n\n以下示例代码创建了一个索引数组和一个关联数组，然后显示这两个数组：\n\n```php\n<?php\n\
  $a = array( \"Rahul\", \"ravi\", \"ajit\", \"pratik\" );\nprint_r ( $a );\n?>\n\
  ```\n\n### `foreach` 循环结构\n\n- 存在一种 `foreach` 结构（命令），它会为数组中的每个值应用一组语句。\n- 然而，它只对数组有效，如果你尝试对另一种类型的变量使用它，它会给你一个巨大的错误。\n\
  - 你的 `foreach` 命令语法看起来如下：\n\n```php\nforeach ($array_variable as $value_variable)\n\
  {\n    // .. 对 $value_variable 中的值进行某些操作\n}\n\nforeach ($array_variable as $key_var\
  \ => $value_var)\n{\n    // .. 对 $key_var 和/或 $value_var 进行某些操作\n}\n```\n\n####\
  \ 示例：\n\n```html\n<<html>\n<head>\n<title>For Each 结构</title>\n</head>\n<body>\n\
  <?php\n$a[] = \"Rahul\";\n$a[] = \"Ravi\";\n$a[] = \"Pratik\";\necho \"My Name -->\"\
  .'</br>';\nforeach ($a as $b)\n{\n    // 只要 $a 中还有值，这些行就会执行\n    echo $b.'</br>';\n\
  }\n?>\n</body>\n</html>\n```\n\n### 与数组一起使用的内置函数：`sort()` 和 `rsort()`\n\n#### i.\
  \ `sort()`\n\n- 对数组进行排序\n- **定义与用法**：`sort()` 函数按值对数组进行排序。\n- 此函数会为数组中的元素分配新键。现有的键将被删除。\n\
  - 该函数在成功时返回 `TRUE`，失败时返回 `FALSE`。\n- **语法**：`sort(array,sorttype)`\n    - `Array`：必填。指定要排序的数组。\n\
  \    - `Sorttype`：可选。指定如何对数组值排序。可能的值有：\n        - `SORT_REGULAR` - 默认。按原样处理值（不改变类型）\n\
  \        - `SORT_NUMERIC` - 按数值处理值\n        - `SORT_STRING` - 将值视为字符串\n        -\
  \ `SORT_LOCALE_STRING` - 根据本地设置将值视为字符串\n- **示例**：\n\n```php\n<?php\n$animal = array(\"\
  a\" => \"Dog\", \"b\" => \"Cat\", \"c\" => \"Horse\");\nsort($animal);\nprint_r($animal);\n\
  ?>\n```\n\n- **输出**：\n```\nArray\n(\n    [0] => Cat\n    [1] => Dog\n    [2] =>\
  \ Horse\n)\n```\n\n#### ii. `rsort()`\n\n- 降序返回数组\n- **定义与用法**：`rsort()` 函数按降序返回数组。\n\
  \    - `Array`：必填。指定一个数组。\n    - `Preserve`：可选。可能的值：`true` 或 `false`。指定函数是否应该保留数组的键。\n\
  - **示例**：\n\n```php\n<?php\n$a=array(\"a\"=>\"Dog\",\"b\"=>\"Cat\",\"c\"=>\"Horse\"\
  );\nprint_r(rsort($a));\n?>\n```\n\n- **输出**：\n```\nArray ( [c] => Horse [b] =>\
  \ Cat [a] => Dog )\n```\n\n## 第 7 章：PHP 中的用户自定义函数和全局变量\n\n### 1 函数\n\n当你在多个地方使用代码时，函数最为有用，但即使在只使用一次的情况下它们也有帮助，因为它们可以使你的代码更具读性。\n\
  \n#### 语法\n\n- 函数定义具有以下形式：\n\n```php\nfunction function-name ($argument-1, $argument-2,\
  \ ..)\n{\n    statement-1;\n    statement-2;\n    ...\n}\n```\n\n#### 示例-1：\n\n\
  ```php\n<?php\nfunction add($a, $b)\n{\n    $c=$a+$b;\n    echo \"Total-->\".$c;\n\
  }\n$x = 10;\n$y = 20;\nadd($x,$y);\n?>\n```\n\n#### 示例-2（返回值）：\n\n```php\n<?php\n\
  function add($a, $b)\n{\n    $c=$a+$b;\n    return $c;\n}\n$x = 10;\n$y = 20;\n\
  echo add($x,$y);\n?>\n```\n\n### 形式参数与实际参数\n\n- 在前面的示例中，我们传递给函数的是变量，但也可以是数字。\n-\
  \ 实际参数（函数调用时的参数）可以与形式参数名称不同。\n- 形式参数（函数定义中的参数）在函数外部是独立的。\n- 正如我们在下一节中看到的，实际参数与形式参数名称可以相同。\n\
  - 无论如何，形式参数与实际参数是无关的。\n\n##### 值传递\n\n- PHP 的默认行为是值传递。\n- 这意味着当你传递变量给函数时，PHP 会创建变量的副本。\n\
  - 这取决于你是否要修改原始值，这可能是坏。\n\n```php\n<?php\nfunction add($a, $b)\n{\n    $c=$a+$b;\n\
  \    echo \"Total-->\".$c;\n}\nfunction sub($d, $e)\n{\n    $f=$d-$e;\n    echo\
  \ \"Sub-->\".$f;\n}\n$x=10;\n$y=20;\nadd($x,$y);\nsub($x,$y);\n?>\n```\n\n#####\
  \ 引用传递\n\n- PHP 提供了让函数实际修改参数两种方法：在函数定义和函数调用中。\n\n```php\n<?php\nfunction display(&$b1,\
  \ &$b2)\n{\n    $b1 = 30;\n    $b2 = 40;\n}\n$a1=10;\n$a2=20;\ndisplay($a1,$a2);\n\
  echo $a1;\necho $a2;\n?>\n```\n\n##### 返回函数\n\n- 使用 `return` 语句返回值。\n- 可以返回任何类型，包括数组和对象。\n\
  - 这会导致函数结束执行并将控制权传回调用它的行。\n- 如果在函数内部调用，`return()` 函数会立即结束当前函数的执行并将参数作为函数调用的值返回。\n\
  \n```php\n<?php\nfunction sum($a, $b)\n{\n    $c=$a+$b;\n    return $c;\n}\n$x=10;\n\
  $y=20;\n$z=sum($x,$y);\necho $z;\n?>\n```\n\n##### 默认参数\n\n- 要定义带有默认参数的函数，只需将形式参数名称转换为赋值表达式即可。\n\
  - 如果实际调用的参数少于定义中的形式参数数量，PHP 将匹配实际参数和形式参数，直到实际参数耗尽，然后使用默认赋值来填充剩余部分。\n\n```php\n<?php\n\
  function info($fname=\"rahul\",$lname=\"patel\")\n{\n    echo $fname;\n    echo\
  \ $lname.'</br>';\n}\ninfo();\ninfo(\"ravi\");\ninfo(\"ravi\",\"dave\");\n?>\n```\n\
  \n\n\n\n\n- 事实上，在函数内部声明的所有变量在函数退出时都会被删除，并在下次调用函数时重新创建一个新变量。\n- 这通常是你希望发生的情况，因为它允许你编写良好的、自包含的函数，这些函数之间可以独立运行。\n\
  - 然而，有时创建一个生命周期稍长的局部变量也是很有用的。\n- 静态变量（Static variables）可以让你实现。这类变量在某种意义上仍然是局部的，因为它们只能在函数代码内部被访问。\n\
  - 但是，与函数退出时就会消失的局部变量不同，静态变量会记住从一次函数调用到下一次调用的值。\n- 要将局部变量声明为静态，你只需要在变量名之前编写 `static`\
  \ 单词，并为变量分配一个初始值：\n\n```php\nstatic $var = 0;\n```\n\n- 第一次调用该函数时，变量被设置为其初始值（在本例中为\
  \ 0）。\n- 但是，如果变量的值在函数内部发生了变化，那么在下次调用函数时将记住这个新值。\n- 该值仅在脚本运行期间被保留，因此当你下次运行脚本时，变量会被重新初始化。\n\
  \n### 示例：（局部变量）\n\n```php\n<?php\nfunction nextNumber() \n{ \n  $counter = 0; \n\
  \  return ++$counter; \n}\n\necho \"I’ve counted to:\".nextNumber().\" <br/> \"\
  ;\necho \"I’ve counted to:\".nextNumber().\" <br/>\";\necho \"I’ve counted to:\"\
  .nextNumber().\" <br/>\";\n?>\n```\n\n**输出：**\nI’ve counted to: 1\nI’ve counted\
  \ to: 1\nI’ve counted to: 1\n\n- 每每次调用 `nextNumber()` 函数时，它的局部变量 `$counter` 都会被重新创建并初始化为\
  \ 0。\n- 然后它递增到 1 并将其值返回给调用代码。\n- 因此，无论调用多少次，函数始终返回 1。\n\n### 示例：（静态变量）\n\n```php\n\
  <?php\nfunction nextNumber() \n{ \n  static $counter = 0; \n  return ++$counter;\
  \ \n}\n\necho \"I’ve counted to:\".nextNumber().\" <br/> \";\necho \"I’ve counted\
  \ to:\".nextNumber().\" <br/>\";\necho \"I’ve counted to:\".nextNumber().\" <br/>\"\
  ;\n?>\n```\n\n**输出：**\nI’ve counted to: 1\nI’ve counted to: 2\nI’ve counted to:\
  \ 3\n\n- 你可能不会经常使用静态变量，而且你通常也可以使用全局变量（尽管风险更大）来实现相同的效果。\n\n## 全局变量\n\n- 尽管变量作用域的概念非常有用，但有时你确实想要创建一个可以在脚本任何地方访问的变量，无论是在函数内部还是外部。这种变量被称为全局变量。\n\
  - PHP 支持全局变量，但如果你习惯了其他编程语言，你会发现……\n- 在 PHP 中，在函数外部创建的变量是全局的，但它们不能在函数内部被直接访问。\n-\
  \ 要在函数内部使用全局变量，必须使用 `global` 关键字。\n\n**示例：**\n\n```php\n<?php\n$myGlobal = \"Hello\"\
  ;\nfunction hello() {\n  global $myGlobal;\n  echo $myGlobal;\n}\nhello();\n?>\n\
  ```\n\n- 你也可以使用 `$GLOBALS` 超全局数组来访问变量。\n\n**示例：**\n\n```php\n<?php\n$myGlobal =\
  \ \"Hello\";\nfunction hello() {\n  echo $GLOBALS['myGlobal'];\n}\nhello();\n?>\n\
  ```\n\n\n\n\n\n| `$_SERVER['HTTP_ACCEPT_CHARSET']` | 返回当前请求的 Accept_Charset 请求头（例如\
  \ utf-8,ISO-8859-1） |\n| `$_SERVER['HTTP_HOST']` | 返回当前请求的 Host 请求头 |\n| `$_SERVER['HTTP_REFERER']`\
  \ | 返回当前页面的完整 URL（不可可靠，因为并非所有用户代理都支持它） |\n| `$_SERVER['HTTPS']` | 脚本是否通过安全的 HTTP\
  \ 协议查询 |\n| `$_SERVER['REMOTE_ADDR']` | 返回用户查看当前页面的 IP 地址 |\n| `$_SERVER['REMOTE_HOST']`\
  \ | 返回用户查看当前页面的主机名 |\n| `$_SERVER['REMOTE_PORT']` | 返回用户机器上与 Web 服务器通信时使用的端口 |\n\
  | `$_SERVER['SCRIPT_FILENAME']` | 返回当前执行脚本的绝对路径名 |\n| `$_SERVER['SERVER_ADMIN']`\
  \ | 返回 Web 服务器配置文件中 `SERVER_ADMIN` 指令赋予的值（如果你的脚本运行在虚拟主机上，它将是该虚拟主机定义的值）（例如 someone@w3schools.com）\
  \ |\n| `$_SERVER['SERVER_PORT']` | 返回服务器机器上 Web 服务器用于通信的端口（例如 80） |\n| `$_SERVER['SERVER_SIGNATURE']`\
  \ | 返回添加到服务器生成页面中的服务器版本和虚拟主机名 |\n| `$_SERVER['PATH_TRANSLATED']` | 返回指向当前脚本的文件系统路径\
  \ |\n| `$_SERVER['SCRIPT_NAME']` | 返回当前脚本的路径 |\n| `$_SERVER['SCRIPT_URI']` | 返回当前页面的\
  \ URI |\n\n## 第 8 章：PHP 表单处理、表单验证\n## (使用 `$_GET`, `$_POST`, `$_REQUEST`)\n\n###\
  \ 1. `<FORM>` 的 `ACTION` 属性：\n当点击 `SUBMIT` 按钮时，`ACTION` 属性调用指定的 ASP 文件（注意：可能是 PHP）。如果未为\
  \ `<FORM>` 指定 `ACTION` 属性，则脚本将请求自身，这是一个“自引用”页面。\n\n### 2. GET 和 POST 方法：\na. `GET`\
  \ 方法通过将表单变量名和键值对与 URL 拼接并作为查询字符串（Query String）发送。\nb. `POST` 方法将表单变量名和键值对以编码的形式随\
  \ HTTP 请求头一起发送。\ni. **POST 的优点**：信息的安全性。\nii. **POST 的缺点**：生成的响应页面无法添加书签。\n\n###\
  \ 3. PHP 有两个全局变量 `$_GET` 和 `$_POST`，用于从 HTML 表单检索用户输入信息。\n\n### 4. 超全局变量 `$_REQUEST`\
  \ 用于收集输入字段的值，而不是 `$_GET` 或 `$_POST`。\n\n### 5. 实际示例：分离 HTML 和 PHP 文件。\n\n**Q. 编写\
  \ HTML 和 PHP 程序来创建欢迎消息：**\n\n\n\n![](img/image00184.jpeg)\n\n**答：保存在桌面的 HTML 文件\
  \ (`wel.html`)**\n```html\n<html \n<<body>\n<form action=\"welcome.php\" method=\"\
  post\">\nName: <input type=\"text\" name=\"name\"><br>\nE-mail: <input type=\"text\"\
  \ name=\"email\"><br>\n<input type=\"submit\">\n</form>\n</body>\n</html>\n```\n\
  \n**保存在 htdocs 中的 PHP 文件 (`welcome.php`)**\n```php\n<?php\necho \"Your name is:\
  \ \" . $_POST[\"name\"], \"<br>\";\necho \"You Email is \" . $_POST[\"email\"];\n\
  ?>\n```\n**输出：**\nWelcome John\nYour email address is john.doe@example.com\n\n---\n\
  \n### 实际示例：带有 HTML 表单的单个 PHP 文件。\n\n**Q. 编写单个 PHP 文件，其中包含一个可以接受用户姓名和年龄的表单，并在点击提交按钮时显示这些内容。（注意：示例中使用了\
  \ `$_GET`。）**\n\n**答：**\n```html\n<html>\n<head>\n<title>$_POST result in URL</title>\n\
  </head>\n<body>\n<FONT SIZE=\"6pt\" color=blue FACE=\"Comic Sans MS\">\n<H3>Handling\
  \ HTML forms</H3>\n</FONT>\n<HR>\n<form name=\"DisplayDetails\" method=\"GET\">\n\
  <input type=\"text\" name=\"name\">\n<input type=\"text\" name=\"age\">\n<input\
  \ type=\"submit\">\n</form>\n<?php\necho \"Name: \" . $_GET['name'];\necho \"Age:\
  \ \" . $_GET['age'];\n?>\n</body>\n</html>\n```\n\n---\n\n### 实际示例：表单验证\n\n**Q.\
  \ 编写 PHP 程序，显示一个接受姓名的表单。然后验证该姓名是否为空（注意：使用了 `$_REQUEST`）。**\n\n**答：**\n```html\n\
  <html>\n<body>\n<form action=\"<?php echo $_SERVER[\"PHP_SELF\"];\" method=\"post\"\
  >\nName: <input type=\"text\" name=\"fname\">\n<input type=\"submit\" value=\"Submit\"\
  >\n</form>\n\n<?php\nif ($_SERVER[\"REQUEST_METHOD\"] == \"POST\") {\n    $name\
  \ = $_REQUEST['fname'];\n    if (empty($name)) {\n        echo \"Name is empty\"\
  ;\n    } else {\n        echo \"Name submitted: \" . $name;\n    }\n}\n?>\n</body>\n\
  </html>\n```\n\n\n\n\n\n```php\necho \"No Cookie Named 'Example' Is Set\";\n}\n\
  ```\n\n?\n\n输出 : 我想要的任何值\n\n### 3. `$_SESSION[]`: 这是一个超全局变量，用于存储 Session 级别的变量。\n\
  \n#### a. 什么是 Session？\n\n**答案：**\n\n- 客户端与服务器的交互被称为 session（会话）。\n- Session 通过\
  \ `session_start()` 函数启动。\n- 当用户关闭浏览器窗口或调用 `session_destroy()` 函数时，session 结束。\n\
  - 每一个 session 都有一个唯一的 `SessionID`。\n- 可以创建 session 变量来存储用户的信息。\n- Session 变量比 Cookie\
  \ 更安全，因为 Session 变量存储在服务器端，而 Cookie 存储在客户端的计算机上。\n\n#### 示例\n\n```php\n<?php\n//\
  \ Start the session\nsession_start();\n?>\n```\n\n```php\n<?php\n// Set session\
  \ variables\n$_SESSION[\"favcolor\"] = \"green\";\n$_SESSION[\"favanimal\"] = \"\
  cat\";\necho \"Session variables are set.\";\n?>\n```\n\n```php\n<?php\nsession_start();\n\
  ?>\n```\n\n```php\n<?php\n// Echo session variables that were set on previous page\n\
  echo \"Favorite color is \" . $_SESSION[\"favcolor\"] . \".<br>\";\necho \"Favorite\
  \ animal is \" . $_SESSION[\"favanimal\"] . \".\";\n?>\n```\n\n```php\n<?php\nsession_start();\n\
  ?>\n```\n\n```php\n<?php\nprint_r($_SESSION);\n?>\n```\n\n#### 修改 PHP Session 变量\n\
  \n```php\n<?php\nsession_start();\n?>\n```\n\n```php\n<?php\n// to change a session\
  \ variable, just overwrite it \n$_SESSION[\"favcolor\"] = \"yellow\";\nprint_r($_SESSION);\n\
  ?>\n```\n\n#### 销毁 PHP Session\n\n要移除所有全局 session 变量并销毁 session，使用 `session_unset()`\
  \ 和 `session_destroy()`：\n\n```php\n<?php\nsession_start();\n?>\n```\n\n```php\n\
  <?php\n// remove all session variables\nsession_unset(); \n// destroy the session\
  \ \nsession_destroy(); \n?>\n```\n\n## 第 9 章：PHP 中的文件操作与错误处理\n\n本章将解释以下与文件相关的函数——\n\
  \n- 打开文件\n- 读取文件\n- 写入文件\n- 关闭文件\n\n## I. 打开和关闭文件\n\n#### 1. `fopen()` 函数：\n\ni)\
  \ PHP 的 `fopen()` 函数用于打开文件。它需要两个参数，首先是文件名，然后是操作的模式。\nii) 如果尝试打开文件失败，`fopen` 将返回\
  \ `false` 值，否则返回一个文件指针，用于对该文件进行后续的读取或写入。\niii) 文件模式可以指定为表中的六种选项之一。\n\n| 模式 | 用途\
  \ |\n| --- | --- |\n| `r` | 以只读模式打开文件。将文件指针放在文件的开头。 |\n| `r+` | 以读写模式打开文件。将文件指针放在文件的开头。\
  \ |\n| `w` | 以只写模式打开文件。将文件指针放在文件的开头并将文件截断为零长度。如果文件不存在，则会尝试创建文件。 |\n| `w+` | 以读写模式打开文件。将文件指针放在文件的开头并将文件截断为零长度。如果文件不存在，则会尝试创建文件。\
  \ |\n| `a` | 以只写模式打开文件。将文件指针放在文件的末尾。如果文件不存在，则会尝试创建文件。 |\n| `a+` | 以读写模式打开文件。将文件指针放在文件的末尾。如果文件不存在，则会尝试创建文件。\
  \ |\n\n#### 2. `fclose()` 函数：\n\na. 在对已打开的文件进行更改后，使用 `fclose()` 函数将其关闭很重要。`fclose()`\
  \ 函数需要一个文件指针作为参数，然后在关闭成功时返回 `true`，如果失败则返回 `false`。\n\n## II. 读取文件\n\n#### 1. `fread()`\
  \ 函数：\n\na. 一旦使用 `fopen()` 函数打开文件，就可以使用 `fread()` 函数进行读取。\nb. 该函数需要两个参数。这些必须是文件指针和以字节表示的文件长度。\n\
  \n#### 2. `fgets()` 函数：\n\n`fgets()` 函数用于从文件中读取单行，在调用此函数后，文件指针将移动到下一行。\n\n#### 3.\
  \ `fgetc()` 函数：\n\n`fgetc()` 函数用于从文件中读取单个字符，在调用此函数后，文件指针将移动到下一个字符。\n\n#### 4. `filesize()`\
  \ 函数：\n\n可以使用 `filesize()` 函数查找文件长度，该函数以文件名作为参数并返回以字节表示的文件大小。\n\n#### 5. `feof()`\
  \ 函数：\n\n`feof()` 函数用于检查是否已到达文件末尾。如果已到达末尾则返回 `true`，否则返回 `false`。以下是读取文件的步骤：\n\n\
  - 使用 `fopen()` 函数打开文件。\n- 使用 `filesize()` 函数获取文件长度。\n- 使用 `fread()` 函数读取内容。\n- 使用\
  \ `fclose()` 函数关闭文件。\n\n#### 示例 1：读取文件\n\n```php\n<?php\nsession_start();\n?>\n\
  ```\n\n```php\n<?php\n// to change a session variable, just overwrite it \n$_SESSION[\"\
  favcolor\"] = \"yellow\";\nprint_r($_SESSION);\n?>\n```\n\n#### 示例 2：销毁 PHP  话\n\
  \n```php\n<?php\nsession_start();\n?>\n```\n\n```php\n<?php\n// remove all session\
  \ variables\nsession_unset(); \n// destroy the session \nsession_destroy(); \n?>\n\
  ```\n\n# 第 10 章：PHP 错误处理\n\n### 1. 错误类型：\n\n- **语法错误 (Syntax Error)**：当我们违反编程的语法规则时发生。例如：`$abc=”hello\"\
  ` // 缺少分号\n- **运行时错误 (Run time error)**：在程序运行时发生的错误。例如：在数据库服务器离线时尝试连接数据库。\n- **逻辑错误\
  \ (Logical Error)**：由于编程算法错误导致的错误。\n\n### 2. PHP 通过三种方法处理错误：\n\na. `die()` 函数\n\
  b. 设置自定义处理程序和手动触发错误\nc. 错误报告\n\n### 3. 使用 `die()` 函数：\n\n`die()` 函数显示消息并停止执行当前脚本。\n\
  \n示例：在打开文本文件时，如果文件没有打开——则显示错误消息并停止脚本。\n\n```php\n<?php\n$file=fopen(\"welcome.txt\"\
  ,\"r\");\nif(!file_exists(\"welcome.txt\")) \n{\n  die(\"文件未找到\");\n} \nelse \n\
  {\n  $file=fopen(\"welcome.txt\",\"r\");\n} \n```\n\n\n\n\n```php\necho “File is\
  \ ready for reading\";\n\n} ?>\n```\n\n## 4. 创建自定义错误处理器与 PHP 错误报告\n\na. 可以使用 `CustomError()`\
  \ 函数来覆盖默认的 PHP 错误。\n\nb. 该函数必须处理至少 2 个参数（错误级别和错误消息）。\n\nc. 自定义错误处理器的示例：\n\n```php\n\
  <?php\n  function handleError($errno, $errstr, $error_file, $error_line) \n  {\n\
  \      echo \"<b>Error:</b> [$errno] $errstr – $error_file:$error_line\";\n    \
  \  echo \"<br />\";\n      echo \"Terminating PHP Script\";\n      die();\n  } //设置错误处理器\n\
  set_error_handler(\"handleError\");\n  //触发错误\nmyFunction();\n?>\n```\n\nd. `set_error_handler()`\
  \ 函数：可以使用此函数函数更改 PHP 的默认错误处理器。\n\ne. `trigger_error()` 函数：PHP 还提供了 `trigger_error()`\
  \ 函数，可用于触发错误。\n\n示例：\n\n```php\n<?php\n$test=2;\nif ($test>=1) {\n  trigger_error(\"\
  Value must be 1 or below\");\n} ?>\n```\n\n## 第 11 章：在 PHP 中操作数据库\n\n### 1. 前端与后端\n\
  前端指的是用户界面（浏览器），而后端是存储数据的部分。\n\n### 2. PHP 可以通过以下方式连接 MySQL：\na. `MySQLi`\nb. `PDO`\n\
  \n### 3. PDO\na. 它代表 PHP Data Objects（PHP 数据对象）。\nb. `PDO` 适用于 12 种不同的数据库系统，而 `MySQLi`\
  \ 仅适用于 MySQL 数据库。\nc. `PDO_ODBC` 驱动允许通过 `PDO` 接口访问 ODBC 数据库（ODBC 代表 Open Database\
  \ Connectivity，开放数据库连接）。\n\n### 4. MySQLi\na. `MySQLi` 是旧 PHP MySQL 驱动的改进版本。\nb.\
  \ `MySQLi` 扩展相比其前身具有多种优势：\ni. 面面向的接口\nii. 支持多语句执行\niii. 增强的调试支持\n\n### 5. 用于数据库连接的内置函数\n\
  \na. `mysqli_connect()`：打开与 MySQL 服务器的新连接，并返回一个表示到 MySQL 服务器连接的对象。\n语法：`mysqli_connect(host,username,password,dbname,port,socket);`\n\
  \nb. `mysqli_connect_error()`：返回描述错误的字符串。如果没有发生错误，则返回 NULL。\n\nc. `mysqli_query()`：`mysqli_query()`\
  \ 函数对数据库执行查询。\n语法：`mysqli_query(connection,query,resultmode);`\n\nd. `mysqli_fetch_assoc()`：`mysqli_fetch_assoc()`\
  \ 函数将结果行以关联数组的形式获取。如果结果集中没有更多行，则返回 NULL。\n\ne. `mysqli_close()`：`mysqli_close()`\
  \ 函数关闭之前打开的数据库连接并释放内存资源。\n\n## 数据库连接程序\n\n示例示例数据库：MyGuests 表\n\n### 1. Item 表设计视图：\n\
  ```sql\nCREATE TABLE MyGuests (\nid INT,\nfirstname VARCHAR(30),\nlastname VARCHAR(30),\n\
  email VARCHAR(50),\nreg_date DATE\n)\n```\n\n#### 程序 1. 打开与 MySQL 的连接\n```php\n\
  <?php\n$servername = \"localhost\";\n$username = \"username\";\n$password = \"password\"\
  ;\n// 创建连接\n$conn = mysqli_connect($servername, $username, $password);\n// 检查连接\n\
  if (!$conn) {\n    die(\"Connection failed: \" . mysqli_connect_error());\n}\necho\
  \ \"Connected successfully\";\n?>\n```\n\n#### 程序 2. 使用 MySQLi 创建 MySQL 数据库\n```php\n\
  <?php\n$servername = \"localhost\";\n$username = \"username\";\n$password = \"password\"\
  ;\n// 创建连接\n$conn = mysqli_connect($servername, $username, $password);\n// 检查连接\n\
  if (!$conn) {\n    die(\"Connection failed: \" . mysqli_connect_error());\n}\necho\
  \ \"Connected successfully\";\n```\n\n#### 程序 3. 使用 MySQLi 创建表\n```php\n<?php\n\
  $servername = \"localhost\";\n$username = \"username\";\n$password = \"password\"\
  ;\n// 创建连接\n$conn = mysqli_connect($servername, $username, $password);\n// 检查连接\n\
  if (!$conn) {\n    die(\"Connection failed: \" . mysqli_connect_error());\n}\n//\
  \ 创建数据库\nmysqli_set_db($conn, \"myDB\"); // 注意：此处原文逻辑应为创建数据库，此处保持翻译结构\n```\n\n####\
  \ 程序 4. 使用 MySQLi 插入数据\n```php\n<?php\n$servername = \"localhost\";\n$username =\
  \ \"username\";\n$password = \"password\";\n// 创建连接\n$conn = mysqli_connect($servername,\
  \ $username, $password);\n// 检查连接\nif (!$conn) {\n    die(\"Connection failed: \"\
  \ . mysqli_connect_error());\n}\n// 插入数据\n$sql = \"INSERT INTO MyGuests (firstname,\
  \ lastname, email) VALUES ('John', 'Doe', 'john@example.com')\";\nif (mysqli_query($conn,\
  \ $sql)) {\n    echo \"New record created\";\n} else {\n    echo \"Error: \" . mysqli_error($conn);\n\
  }\n```\n\n#### 程序 5. 使用 MySQLi 查询数据\n```php\n<?php\n$servername = \"localhost\"\
  ;\n$username = \"username\";\n$password = \"password\";\n// 创建连接\n$conn = mysqli_connect($servername,\
  \ $username, $password);\n// 检查连接\nif (!$conn) {\n    die(\"Connection failed: \"\
  \ . mysqli_connect_error());\n}\n$sql = \"SELECT id, firstname, lastname FROM MyGuests\"\
  ;\n$result = mysqli_query($conn, $sql);\nif (mysqli_num_rows($result) > 0) {\n \
  \   // 输出每一行\n    while($row = mysqli_fetch_assoc($result)) {\n        echo \"id:\
  \ \" . $row[\"id\"]. \" - Name: \" . $row[\"firstname\"]. \" \" . $row[\"lastname\"\
  ]. \"<br>\";\n    }\n} else {\n    echo \"0 results\";\n}\n```\n\n#### 程序 6. 使用\
  \ MySQLi 从表中删除数据\n```php\n<?php\n$servername = \"localhost\";\n$username = \"username\"\
  ;\n$password = \"password\";\n// 创建连接\n$conn = mysqli_connect($servername, $username,\
  \ $password);\n// 检查连接\nif (!$conn) {\n    die(\"Connection failed: \" . mysqli_connect_error());\n\
  }\n// 删除记录的 SQL\n$sql = \"DELETE FROM MyGuests WHERE id=3\";\nif (mysqli_query($conn,\
  \ $sql)) {\n    echo \"Record deleted successfully\";\n} else {\n    echo \"Error\
  \ deleting record: \" . mysqli_error($conn);\n}\n```\n\n#### 程序 7. 使用 MySQLi 更新表数据\n\
  ```php\n<?php\n$servername = \"localhost\";\n$username = \"username\";\n$password\
  \ = \"password\";\n// 创建连接\n$conn = mysqli_connect($servername, $username, $password);\n\
  // 检查连接\nif (!$conn) {\n    die(\"Connection failed: \" . mysqli_connect_error());\n\
  }\n$sql = \"UPDATE MyGuests SET lastname='Doe' WHERE id=2\";\nif (mysqli_query($conn,\
  \ $sql)) {\n    echo \"Record updated successfully\";\n} else {\n    echo \"Error\
  \ updating record: \" . mysqli_error($conn);\n}\n```\n\n"
