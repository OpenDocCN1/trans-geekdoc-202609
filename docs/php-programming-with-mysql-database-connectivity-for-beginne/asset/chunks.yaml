    ### Date and time functions


    1) `date_default_timezone_set()` : Function used to set the time zone. For India
    the valid code is “Asia/Calcutta”.


    2) `date_default_timezone_get()` : Function to display the time zone that has
    been set.

    Example:

    ```php

    date_default_timezone_set(''Asia/Calcutta'');

    echo date_default_timezone_get();

    ```

    Result: Asia/Calcutta


    3) `date()` : This function returns a string formatted to the given format using
    the current time.(ie. Timestamp is optional)

    Syntax

    `date(format,timestamp)`

    Example: To display

    ```php

    echo "Today is " . date("Y/m/d") . "<br>";

    echo "Today is " . date("Y.m.d") . "<br>";

    echo "Today is " . date("Y-m-d") . "<br>";

    echo "Today is " . date("l");

    ```

    Here are some characters that commonly used for dates:

    `d` - Represents the day of the month (01 to 31)

    `m` - Represents a month (01 to 12)

    `Y` - Represents a year (in four digits)

    `l` (lowercase ''L'') - Represents the day of the week

    Result:

    Today is 2016/08/03

    Today is 2016.08.03

    Today is 2016-08-03

    Today is Wednesday


    Example: To display Time

    ```php

    echo "The time is " . date("h:i:sa");

    ```

    Here are some characters that commonly used for times:

    `h` - 12-hour format of an hour with leading zeros (01 to 12)

    `i` - Minutes with leading zeros (00 to 59)

    `s` - Seconds with leading zeros (00 to 59)

    `a` - Lowercase Ante meridiem and Post meridiem (am or pm)

    Result: The time is 11:01:19am


    4) `time()` : Return the current time as a Unix timestamp. Returns the current
    time measured in the number of seconds since the Unix Epoch (January 1970 00:00:00
    GMT).This will a large number, it has to be formatted using `date()` to display
    is understandable.

    Example:

    ```php

    $t=time();

    echo($t . "<br>");

    echo(date("Y-m-d",$t));

    ```

    Result:

    1470236933 // this number cannot be understood

    2016-08-03 // using `date()` we have formatted it to year,month,day


    5) `gettimeofday()`: it returns the current time as an array

    Array Items:

    `sec` - seconds since the Unix Epoch

    `usec` - microseconds

    `minuteswest` - minutes west of Greenwich

    `dsttime` - type of dst correction

    Example:

    ```php

    // Print the array from gettimeofday()

    print_r(gettimeofday());

    // Print the float from gettimeofday()

    echo gettimeofday(true);

    ```

    Result:

    Array ( [sec] => 1470237375 [usec] => 298062 [minuteswest] => 240 [dsttime] =>
    1 )

    1470237375.298


    6) `mktime()`:Returns the Unix timestamp corresponding to the arguments given

    Syntax

    `mktime(hour,minute,second,month,day,year,is_dst)`

    Example:

    ```php

    echo(date("M-d-Y H:i:s",mktime(23,43,26,4,27,2015))."<br /> ");

    echo(date("M-d-Y",mktime(0,0,0,17,4,2005))."<br /> ");

    echo(date("M-d-Y",mktime(0,0,0,1,36,2000))."<br /> ");

    echo(date("M-d-Y",mktime(24,0,0,1,1,99))."<br />"); ?>

    ```

    Result:

    Apr-27-2015 23:43:26

    May-04-2006

    Feb-05-2000

    Jan-02-1999


    Example: Each of the following lines produces the string "Jan-01-1998".

    ```php

    echo date("M-d-Y", mktime(0, 0, 0, 12, 32, 1997));

    echo date("M-d-Y", mktime(0, 0, 0, 13, 1, 1997));

    echo date("M-d-Y", mktime(0, 0, 0, 1, 1, 1998));

    echo date("M-d-Y", mktime(0, 0, 0, 1, 1, 98));

    ?>

    ```


    7) `strtotime()`:Parse English textual datetimes into Unix timestamps

    Example:

    ```php

    echo(date("Y/m/d",strtotime("now")))."<br>";

    echo(date("Y/m/d",strtotime("3 October 2005")) . "<br>");

    echo(date("Y/m/d",strtotime("+5 hours")) . "<br>");

    echo(date("Y/m/d",strtotime("+1 week")) . "<br>");

    echo(date("Y/m/d",strtotime("+1 week 3 days 7 hours 5 seconds")))."<br>";

    echo(date("Y/m/d",strtotime("next Monday")) . "<br>");

    echo(date("Y/m/d",strtotime("last Sunday")));?>

    ```

    Result:

    2016/08/03

    2005/10/03

    2016/08/03

    2016/08/10

    2016/08/14

    2016/08/08

    2016/07/31

