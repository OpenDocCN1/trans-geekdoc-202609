    \ Custom Error Handler & PHP Error Reporting\n\na. It is possible to override\
    \ the default PHP errors by using `CustomError()` function.\n\nb. The function\
    \ has to handle minimum 2 parameters (error level and error message)\n\nc. Example\
    \ of custom error handlers:\n\n```php\n<?php\n  function handleError($errno, $errstr,\
    \ $error_file, $error_line) \n  {\n      echo \"<b>Error:</b> [$errno] $errstr\
    \ – $error_file:$error_line\";\n      echo \"<br />\";\n      echo \"Terminating\
    \ PHP Script\";\n      die();\n  } //set error handler\nset_error_handler(\"handleError\"\
    );\n  //trigger error\nmyFunction();\n?>\n```\n\nd. `set_error_handler()` function:\
    \ The default error handler for PHP can be changed using this function.\n\ne.\
    \ `trigger_error()` function: PHP also provides `trigger_error()` function that\
    \ can be used to trigger an error.\n\nExample:\n\n```php\n<?php\n$test=2;\nif\
