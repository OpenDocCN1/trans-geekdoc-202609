    | 5 | `*` | 乘 |

    | 6 | `/` | 除除 |

    | 7 | `%` | 取模 |

    | 8 | `+` | 加法 |

    | 9 | `-` | 减法 |

    | 10 | `.` | 字符串拼接 |

    | 11 | `<`, `<=` | 小于、小于等于 |

    | 12 | `>`, `>=` | 大于、大于等于 |

    | 13 | `=` | 值相等 |

    | 14 | `!=`, `<>` | 不等 |

    | 15 | `===` | 类型和值相等 |

    | 16 | `!==` | 类型和值不相等 |

    | 17 | `&&` | 逻辑与 |

    | 18 | `||` | 逻辑或 |

    | 19 | `?:` | 三元运算符 |

    | 20 | `=` | 赋值 |

    | 21 | `+=`, `-=`, `*=`, `/=`, `.=`, `%=`, `&=`, `|=`, `^=`, `~=`, `<<=`, `>>=`
    | 带运算的赋值 |

