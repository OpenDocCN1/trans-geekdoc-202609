- fmt: "\nSwitch is a useful alternative for certain situations where you want multiple\
    \ possible branches based on a single value and where a series of if statements\
    \ would be cumbersome.\n\n### 1. If-else\n\n#### Syntax:\n```php\nif (condition)\n\
    {\n    statement-1\n}\n```\n\n#### Or with an optional else branch:\n```php\n\
    if (condition)\n{\n    statement-1\n}\nelse\n{\n    statement-2\n}\n```\n\n- When\
    \ an `if` statement is processed, the test expression is evaluated, and the result\
    \ is interpreted as a Boolean value.\n- If `condition` is true, `statement-1`\
    \ is executed. If `condition` is not true, and there is an `else` clause, `statement-2`\
    \ is executed.\n- If `condition` is false, and there is no `else` clause, execution\
    \ simply proceeds with the next statement after the `if` construct.\n\n#### Example:-1\
    \ (Simple If)\n```php\n<?php\n$a=10;\nif ($a == 10)\n{\n    echo $a;\n}\n?>\n\
    ```\n\n#### Example:-2 (Simple If and Else)\n```php\n<?php\n$a=10;\n$b=4;\nif\
    \ ($a > $b)\n{\n    echo \"A is greater than\";\n}\nelse\n{\n    echo \"B is greater\
    \ than\";\n}\n?>\n```\n\n#### Example:-3 (Elseif)\n```php\n<?php\n$a=2;\nif ($a\
    \ == 1)\n{\n    print \"Mon\";\n}\nelseif($a==2)\n{\n    print \"Thu\";\n}\nelse\n\
    {\n    print \"wrong choice\";\n}\n?>\n```\n\n#### Example:-4 (Nested if……else)\n\
    ```php\n<?php\n$a=1;\n$b=2;\n$c=3;\nif ($a > $b)\n{\n    if ($a > $c) {\n    \
    \    print \"a is max\";\n    }\n    else {\n        print \"c is max\";\n   \
    \ }\n}\nelse\n{\n    if ($b > $c)\n    {\n        print \"b is max\";\n    }\n\
    \    else\n    {\n        print \"c is max\";\n    }\n}\n?>\n```\n\n### Switch\n\
    \n- For a specific kind of multi way branching, the `switch` construct can be\
    \ useful.\n- Rather than branch on arbitrary logical expressions, `switch` takes\
    \ different paths according to the value of a single expression.\n- The syntax\
    \ is as follows, with the optional parts enclosed in square brackets `[]`:\n\n\
    ```php\nswitch(expression)\n{\n    case value-1:\n        statement-1\n      \
    \  statement-2\n        ...\n        [break;]\n    case value-2:\n        statement-3\n\
    \        statement-4\n        ...\n        [break;]\n    .....\n    ……\n    [default:\n\
    \        default-statement]\n}\n```\n\n- The `expression` can be a variable or\
    \ any other kind of expression, as long as it evaluates to a simple value (that\
    \ is, an integer, a double, or a string).\n- The construct executes by evaluating\
    \ the expression and then testing the result for equality against each `case`\
    \ value.\n- As soon as a matching value is found, subsequent statements are executed\
    \ in sequence until the special statement (`break;`) or until the end of the `switch`\
    \ construct.\n- A special `default` tag can be used at the end, which will match\
    \ the expression if no other `case` has matched it so far.\n\n#### Example:\n\
    ```php\n<?php\n$a=6;\nswitch($a)\n{\n    case 1:\n        print \"Mon\";\n   \
    \     break;\n    case 2:\n        print \"Tue\";\n        break;\n    case 3:\n\
    \        print \"Wen\";\n        break;\n    case 4:\n        print \"Thu\";\n\
    \        break;\n    case 5:\n        print \"Fri\";\n        break;\n    case\
    \ 6:\n        print \"sat\";\n        break;\n    case 7:\n        print \"Sun\"\
    ;\n        break;\n    default:\n        print \"Wrong Choice\";\n}\n?>\n```\n\
    \n# CHAPTER 5: LOOPING IN PHP\n\nLooping: It allows the programmer to perform\
    \ an action that can be repeated till the given condition is true.\n\n### 1. While\n\
    - The simplest PHP looping construct is `while`, which has the following syntax:\n\
    \n```php\nwhile (condition)\n{\n    Statement\n}\n```\n\n- The `while` loop evaluates\
    \ the `condition` expression as a Boolean —if it is true, it executes `statement`\
    \ and then starts again by evaluating `condition`.\n- If the `condition` is false,\
    \ the `while` loop terminates. Of course, just as with `if`, `statement` may be\
    \ a single statement or it may be a brace-enclosed block.\n\n#### Example:-\n\
    ```php\n<?php\n$a=1;\nwhile ($a <= 10)\n{\n    print \"count is $a<BR>\";\n  \
    \  $a = $a + 1;\n}\n?>\n```\n\n### 2. do-while\n- The `do-while` construct is\
    \ similar to `while`, except that the test happens at the end of the loop.\n-\
    \ The syntax is:\n\n```php\ndo\n{\n    code to be executed;\n}\nwhile (condition);\n\
    ```\n\n- The statement is executed once, and then the expression is evaluated.\n\
    - If the expression is true, the statement is repeated until the expression becomes\
    \ false.\n- The only practical difference between `while` and `do-while` is that\
    \ the latter will always execute its statement at least once.\n\n#### Example:-\n\
    ```php\n<?php\n$a=1;\ndo\n{\n    print \"count is $a<BR>\";\n    $a = $a + 1;\n\
    }\nwhile ($a <= 10);\n?>\n```\n\n### 3. for\nThe most complicated looping construct\
    \ is `for`, which has the following syntax:\n\n```php\nfor (initial-expression;termination-check;loop-end-expression)\n\
    {\n    Number of statements\n}\n```\n\n- In executing a `for` statement, first\
    \ the `initial-expression` is evaluated just once, usually to initialize variables.\n\
    - Then `termination-check` is evaluated—if it is false, the `for` statement concludes,\
    \ and if it is true, the statement executes.\n- Finally, the `loop-end-expression`\
    \ is executed and the cycle begins again with `termination-check`.\n- As always,\
    \ by statement we mean a single (semicolon -terminated) statement, a brace-enclosed\
    \ block, or a conditional construct.\n\n#### Example:-\n```php\n<?php\nfor ($i\
    \ = 1; $i<= 5; $i++)\n{\n    echo $i;\n}\n?>\n```\n\n### 4. foreach loop\n- There\
    \ exists a `foreach` Constructs (command) that will apply a set of statements\
    \ for each value in an array.\n- It works only on arrays, however, and will give\
    \ you a big old error if you try to use it with another type of variable.\n- Your\
    \ syntax for the `foreach` command looks like this:\n\n```php\nforeach ($array_variable\
    \ as $value_variable)\n{\n    // .. do something with the value in $value_variable\n\
    }\nforeach ($array_variable as $key_var => $value_var)\n{\n    // .. do something\
    \ with $key_var and/or $value_var\n}\n```\n\n#### Example:\n```html\n<html>\n\
    <head>\n<title>For Each Constructs</title>\n</head>\n<body>\n<?php\n$a[] = \"\
    Rahul\";\n$a[] = \"Ravi\";\n$a[] = \"Pratik\";\necho \"My Name:<br>\";\nforeach\
    \ ($a as $b)\n{\n    echo $b.<br>\";\n}\n?>\n</body>\n</html>\n```\n\n### 5. Break\
    \ and continue\n- The standard way to get out of a looping structure is for the\
    \ test condition to become false.\n- The special commands `break` and `continue`\
    \ offer an optional side exit from all loops, including `while`, `do-while`, and\
    \ `for`.\n- The `break` command exits the innermost loop that contains it.\n-\
    \ The `continue` command skips to the end of the current iteration of the innermost\
    \ loop.\n\n#### Example(Break):\n```php\n<?php\n$i = 0;\nwhile ($i<10)\n{\n  \
    \  if ($i> 6) break;\n    echo $i;\n    $i=$i+1;\n}\n?>\n```\n\n#### Example(Continue):\n\
    The following code prints the number 0 to 9, except 5.\n```php\n<?php\nfor ($i\
    \ = 0; $i<10; $i++)\n{\n    if ($i == 5)\n    {\n        continue;\n    }\n  \
    \  echo $i;\n}\n?>\n```\n\n# CHAPTER 6: ARRAY IN PHP\n\n### Arrays\n- An array\
    \ is a single variable that can hold more than one value at.\n- You can think\
    \ of an array as a list of values.\n- Each value within an array is called an\
    \ element, and each element is referenced by its own index, which is unique to\
    \ that array.\n- To access an element’s value — whether you’re creating, reading,\
    \ writing, or deleting the element — you use that element’s index.\n- With associative\
    \ arrays, each element is referenced by a string index.\n\n### Creating Arrays\n\
    - This takes a list of values and creates an array containing those values, which\
    \ you can then assign to a variable:\n```php\n$a = array( “Rahul”, “ravi”, “ajit”,\
    \ “pratik” );\n```\n- In this line of code, an array of four elements is created,\
    \ with each element containing a string value.\n- The array is then assigned to\
    \ the variable `$authors`. You can now access any of the array elements via the\
    \ single variable name, `$a`, as you see in a moment.\n- This array is an indexed\
    \ array, which means that each of the array elements is accessed via its own numeric\
    \ index, starting at zero.\n- In this case, the “Rahul” element has an index of\
    \ 0, “ravi” has an index of 1, “ajit” has an index of...\n"
