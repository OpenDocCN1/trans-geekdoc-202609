  trans: "\n\n| `$_SERVER['HTTP_ACCEPT_CHARSET']` | 返回当前请求的 Accept_Charset 请求头（例如\
    \ utf-8,ISO-8859-1） |\n| `$_SERVER['HTTP_HOST']` | 返回当前请求的 Host 请求头 |\n| `$_SERVER['HTTP_REFERER']`\
    \ | 返回当前页面的完整 URL（不可可靠，因为并非所有用户代理都支持它） |\n| `$_SERVER['HTTPS']` | 脚本是否通过安全的 HTTP\
    \ 协议查询 |\n| `$_SERVER['REMOTE_ADDR']` | 返回用户查看当前页面的 IP 地址 |\n| `$_SERVER['REMOTE_HOST']`\
    \ | 返回用户查看当前页面的主机名 |\n| `$_SERVER['REMOTE_PORT']` | 返回用户机器上与 Web 服务器通信时使用的端口 |\n\
    | `$_SERVER['SCRIPT_FILENAME']` | 返回当前执行脚本的绝对路径名 |\n| `$_SERVER['SERVER_ADMIN']`\
    \ | 返回 Web 服务器配置文件中 `SERVER_ADMIN` 指令赋予的值（如果你的脚本运行在虚拟主机上，它将是该虚拟主机定义的值）（例如 someone@w3schools.com）\
    \ |\n| `$_SERVER['SERVER_PORT']` | 返回服务器机器上 Web 服务器用于通信的端口（例如 80） |\n| `$_SERVER['SERVER_SIGNATURE']`\
    \ | 返回添加到服务器生成页面中的服务器版本和虚拟主机名 |\n| `$_SERVER['PATH_TRANSLATED']` | 返回指向当前脚本的文件系统路径\
    \ |\n| `$_SERVER['SCRIPT_NAME']` | 返回当前脚本的路径 |\n| `$_SERVER['SCRIPT_URI']` | 返回当前页面的\
    \ URI |\n\n# 第 8 章：PHP 表单处理、表单验证\n## (使用 `$_GET`, `$_POST`, `$_REQUEST`)\n\n###\
    \ 1. `<FORM>` 的 `ACTION` 属性：\n当点击 `SUBMIT` 按钮时，`ACTION` 属性调用指定的 ASP 文件（注意：可能是\
    \ PHP）。如果未为 `<FORM>` 指定 `ACTION` 属性，则脚本将请求自身，这是一个“自引用”页面。\n\n### 2. GET 和 POST\
    \ 方法：\na. `GET` 方法通过将表单变量名和键值对与 URL 拼接并作为查询字符串（Query String）发送。\nb. `POST` 方法将表单变量名和键值对以编码的形式随\
    \ HTTP 请求头一起发送。\ni. **POST 的优点**：信息的安全性。\nii. **POST 的缺点**：生成的响应页面无法添加书签。\n\n\
    ### 3. PHP 有两个全局变量 `$_GET` 和 `$_POST`，用于从 HTML 表单检索用户输入信息。\n\n### 4. 超全局变量 `$_REQUEST`\
    \ 用于收集输入字段的值，而不是 `$_GET` 或 `$_POST`。\n\n### 5. 实际示例：分离 HTML 和 PHP 文件。\n\n**Q.\
    \ 编写 HTML 和 PHP 程序来创建欢迎消息：**\n\n\n\n![](img/image00184.jpeg)\n\n**答：保存在桌面的 HTML\
    \ 文件 (`wel.html`)**\n```html\n<html \n<<body>\n<form action=\"welcome.php\" method=\"\
    post\">\nName: <input type=\"text\" name=\"name\"><br>\nE-mail: <input type=\"\
    text\" name=\"email\"><br>\n<input type=\"submit\">\n</form>\n</body>\n</html>\n\
    ```\n\n**保存在 htdocs 中的 PHP 文件 (`welcome.php`)**\n```php\n<?php\necho \"Your name\
    \ is: \" . $_POST[\"name\"], \"<br>\";\necho \"You Email is \" . $_POST[\"email\"\
    ];\n?>\n```\n**输出：**\nWelcome John\nYour email address is john.doe@example.com\n\
    \n---\n\n### 实际示例：带有 HTML 表单的单个 PHP 文件。\n\n**Q. 编写单个 PHP 文件，其中包含一个可以接受用户姓名和年龄的表单，并在点击提交按钮时显示这些内容。（注意：示例中使用了\
    \ `$_GET`。）**\n\n**答：**\n```html\n<html>\n<head>\n<title>$_POST result in URL</title>\n\
    </head>\n<body>\n<FONT SIZE=\"6pt\" color=blue FACE=\"Comic Sans MS\">\n<H3>Handling\
    \ HTML forms</H3>\n</FONT>\n<HR>\n<form name=\"DisplayDetails\" method=\"GET\"\
    >\n<input type=\"text\" name=\"name\">\n<input type=\"text\" name=\"age\">\n<input\
    \ type=\"submit\">\n</form>\n<?php\necho \"Name: \" . $_GET['name'];\necho \"\
    Age: \" . $_GET['age'];\n?>\n</body>\n</html>\n```\n\n---\n\n### 实际示例：表单验证\n\n\
    **Q. 编写 PHP 程序，显示一个接受姓名的表单。然后验证该姓名是否为空（注意：使用了 `$_REQUEST`）。**\n\n**答：**\n```html\n\
    <html>\n<body>\n<form action=\"<?php echo $_SERVER[\"PHP_SELF\"];\" method=\"\
    post\">\nName: <input type=\"text\" name=\"fname\">\n<input type=\"submit\" value=\"\
    Submit\">\n</form>\n\n<?php\nif ($_SERVER[\"REQUEST_METHOD\"] == \"POST\") {\n\
    \    $name = $_REQUEST['fname'];\n    if (empty($name)) {\n        echo \"Name\
    \ is empty\";\n    } else {\n        echo \"Name submitted: \" . $name;\n    }\n\
    }\n?>\n</body>\n</html>\n```\n\n"
- fmt: "\n```php\necho \"No Cookie Named 'Example' Is Set\";\n}\n```\n\n?\n\nOutput\
    \ : Whatever Value I Want\n\n### 3. `$_SESSION[]`: This is the superglobal variable\
    \ that is used to Session level variables.\n\n#### a. What is a Session?\n\n**Ans:**\n\
    \n- The interaction of a client with the server is called as a session.\n- A session\
    \ is started with the `session_start()` function.\n- A session ends when the user\
    \ closes the browser window or `session_destroy()` function is called.\n- Every\
    \ session has an unique `SessionID`.\n- A session variables can be created to\
    \ store information about the user.\n- Session variables are more secure than\
    \ Cookies because session variables are stored on the serverside whereas the cookies\
    \ are stored on the clients computer.\n\n#### Examples\n\n```php\n<?php\n// Start\
    \ the session\nsession_start();\n?>\n```\n\n```php\n<?php\n// Set session variables\n\
    $_SESSION[\"favcolor\"] = \"green\";\n$_SESSION[\"favanimal\"] = \"cat\";\necho\
    \ \"Session variables are set.\";\n?>\n```\n\n```php\n<?php\nsession_start();\n\
    ?>\n```\n\n```php\n<?php\n// Echo session variables that were set on previous\
    \ page\necho \"Favorite color is \" . $_SESSION[\"favcolor\"] . \".<br>\";\necho\
    \ \"Favorite animal is \" . $_SESSION[\"favanimal\"] . \".\";\n?>\n```\n\n```php\n\
    <?php\nsession_start();\n?>\n```\n\n```php\n<?php\nprint_r($_SESSION);\n?>\n```\n\
    \n#### Modify a PHP Session Variable\n\n```php\n<?php\nsession_start();\n?>\n\
    ```\n\n```php\n<?php\n// to change a session variable, just overwrite it \n$_SESSION[\"\
    favcolor\"] = \"yellow\";\nprint_r($_SESSION);\n?>\n```\n\n#### Destroy a PHP\
    \ Session\n\nTo remove all global session variables and destroy the session, use\
    \ `session_unset()` and `session_destroy()`:\n\n```php\n<?php\nsession_start();\n\
    ?>\n```\n\n```php\n<?php\n// remove all session variables\nsession_unset(); \n\
    // destroy the session \nsession_destroy(); \n?>\n```\n\n# CHAPTER 9: WORKING\
    \ WITH TEXT FILES AND ERROR HANDLING IN PHP\n\nThis chapter will explain following\
    \ functions related to files –\n\n- Opening a file\n- Reading a file\n- Writing\
    \ a file\n- Closing a file\n\n## I. Opening and Closing Files\n\n#### 1. `fopen()`\
    \ function:\n\ni) The PHP `fopen()` function is used to open a file. It requires\
    \ two arguments stating first the file name and then mode in which to operate.\n\
    ii) If an attempt to open a file fails then `fopen` returns a false value, otherwise\
    \ it returns a file pointer which is used for further reading or writing of that\
    \ file.\niii) Files modes can be specified as one of the six options in this table.\n\
    \n| Mode | Purpose |\n| --- | --- |\n| `r` | Opens the file for reading only.\
    \ Places the file pointer at the beginning of the file. |\n| `r+` | Opens the\
    \ file for reading and writing. Places the file pointer at the beginning of the\
    \ file. |\n| `w` | Opens the file for writing only. Places the file pointer at\
    \ the beginning of the file and truncates the file to zero length. If files does\
    \ not exist then it attempts to create a file. |\n| `w+` | Opens the file for\
    \ reading and writing only. Places the file pointer at the beginning of the file\
    \ and truncates the file to zero length. If files does not exist then it attempts\
    \ to create a file. |\n| `a` | Opens the file for writing only. Places the file\
    \ pointer at the end of the file. If files does not exist then it attempts to\
    \ create a file. |\n| `a+` | Opens the file for reading and writing only. Places\
    \ the file pointer at the end of the file. If files does not exist then it attempts\
    \ to create a file. |\n\n#### 2. `fclose()` function:\n\na. After making a changes\
    \ to the opened file it is important to close it with the `fclose()` function.\
    \ The `fclose()` function requires a file pointer as its argument and then returns\
    \ true when the closure succeeds or false if it fails.\n\n## II. Reading a file\n\
    \n#### 1. `fread()` function:\n\na. Once a file is opened using `fopen()` function\
    \ it can be read with a function called `fread()`.\nb. This function requires\
    \ two arguments. These must be the file pointer and the length of the file expressed\
    \ in bytes.\n\n#### 2. `fgets()` function:\n\nThe `fgets()` function is used to\
    \ read a single line from a file and after a call to this function the file pointer\
    \ has moved to the next line.\n\n#### 3. `fgetc()` function:\n\nThe `fgetc()`\
    \ function is used to read a single Character from a file and after a call to\
    \ this function the file pointer has moved to the next character.\n\n#### 4. `filesize()`\
    \ function:\n\nThe files length can be found using the `filesize()` function which\
    \ takes the file name as its argument and returns the size of the file expressed\
    \ in bytes.\n\n#### 5. `feof()` function:\n\nReturns True if the end of text file\
    \ has been reached, else returns False.\n\nSo here are the steps required to read\
    \ a file with PHP:\n\n- Open a file using `fopen()` function.\n- Get the file's\
    \ length using `filesize()` function.\n- Read the file's content using `fread()`\
    \ function.\n- Close the file with `fclose()` function.\n\n#### EXAMPLE 1: File\
    \ Reading in PHP\n\n```php\n<?php\n$fileName=\"d:\\\\myFile.txt\";\n$fp = fopen($fileName,\"\
    r\");\nif( $fp==false)\n{\n  echo (\"Error in opening file\");\nexit();\n}\n$fileSize=filesize(\
    \ $fileName);\n$fileData=fread( $fp, $fileSize);\n?>\n```\n\n#### EXAMPLE 2 :\
    \ Reading a File Line by Line\n\n```php\n<?php\n$fileName=\"d:\\\\myFile.txt\"\
    ;\n$fp = fopen($fileName,\"r\");\nif( $fp==false)\n{\n  echo (\"Error in opening\
    \ file\");\nexit();\n}\nwhile(!feof($fp))\n{\necho fgets($fp). \"<br>\";\n}\n\
    ?> \n```\n\n#### EXAMPLE 3 : Reading a File Character by Character and display\
    \ the number of times character “s” appears.\n\n```php\n<?php\n$fileName=\"d:\\\
    \\myFile.txt\";\n$fp = fopen($fileName,\"r\");\nif( $fp==false)\n{\n  echo (\"\
    Error in opening file\");\nexit();\n}\nwhile(!feof($fp))\n{\n if  (fgetc($fp)=\
    \ =”s”)\n{\n  $count=;\n}\n}\necho “The total number of times character s appeared\
    \ is :”.$count;\n?>\n```\n\n## III. File Writing in PHP\n\n#### 1. `fwrite()`\
    \ function:\n\na) Using the PHP `fwrite()` function, a new file can be written\
    \ or text can be appended to an existing file.\nb) This function requires two\
    \ arguments, first specifying a file pointer and the string of data that is to\
    \ written. Optionally a third integer argument can be used to specify the length\
    \ to write. If the third argument is used, file writing would stop after the specified\
    \ length has been reached.\n\n#### EXAMPLE 1: File Writing in PHP\n\n```php\n\
    <?php\n$fileName=\"d:\\\\myFile.txt\";\n$fp = fopen($fileName,\"w\");\nfwrite(\
    \ $fp,\"This is a sample text to write\\\\n\");\n?>\n```\n\n## IV. Closing a File\
    \ in PHP\n\n#### 1. `fclose()` function:\n\nIn PHP it is not system critical to\
    \ close all files after using them because file will auto close after PHP finishes.\n\
    You can close file, using `fclose()` function.\n\nExample:\n```php\n<?php\n$fileName=\"\
    d:\\\\myFile.txt\";\n$fp = fopen($fileName,\"w\");\nif( $fp==false)\n{\n  echo\
    \ (\"Error in opening file\");\nexit();\n}\n//some code to be executed\nfclose(\
    \ $fp);\n?>\n```\n\n#### 2. `file()` function:\n\na. The PHP `file()` function\
    \ is used to read the entire content of a file in to array.\nb. This function\
    \ also opens the file in read mode and there is no need to open and close the\
    \ file separately.\nc. Each array element contains one line form the file.\n\n\
    Example : PHP program to read the entire text file and display is line-by-line\
    \ using `file()`.\n\n```php\n<?php\n$FArray=file('myFile.txt');\nforeach($FArray\
    \ as $line)\n{\necho $line.'<br>';\n} ?>\n```\n\n# CHAPTER 10: PHP ERROR HANDLING\n\
