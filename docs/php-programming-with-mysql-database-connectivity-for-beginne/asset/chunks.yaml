  trans: "\n\n- 事实上，在函数内部声明的所有变量在函数退出时都会被删除，并在下次调用函数时重新创建一个新变量。\n- 这通常是你希望发生的情况，因为它允许你编写良好的、自包含的函数，这些函数之间可以独立运行。\n\
    - 然而，有时创建一个生命周期稍长的局部变量也是很有用的。\n- 静态变量（Static variables）可以让你实现。这类变量在某种意义上仍然是局部的，因为它们只能在函数代码内部被访问。\n\
    - 但是，与函数退出时就会消失的局部变量不同，静态变量会记住从一次函数调用到下一次调用的值。\n- 要将局部变量声明为静态，你只需要在变量名之前编写 `static`\
    \ 单词，并为变量分配一个初始值：\n\n```php\nstatic $var = 0;\n```\n\n- 第一次调用该函数时，变量被设置为其初始值（在本例中为\
    \ 0）。\n- 但是，如果变量的值在函数内部发生了变化，那么在下次调用函数时将记住这个新值。\n- 该值仅在脚本运行期间被保留，因此当你下次运行脚本时，变量会被重新初始化。\n\
    \n### 示例：（局部变量）\n\n```php\n<?php\nfunction nextNumber() \n{ \n  $counter = 0;\
    \ \n  return ++$counter; \n}\n\necho \"I’ve counted to:\".nextNumber().\" <br/>\
    \ \";\necho \"I’ve counted to:\".nextNumber().\" <br/>\";\necho \"I’ve counted\
    \ to:\".nextNumber().\" <br/>\";\n?>\n```\n\n**输出：**\nI’ve counted to: 1\nI’ve\
    \ counted to: 1\nI’ve counted to: 1\n\n- 每每次调用 `nextNumber()` 函数时，它的局部变量 `$counter`\
    \ 都会被重新创建并初始化为 0。\n- 然后它递增到 1 并将其值返回给调用代码。\n- 因此，无论调用多少次，函数始终返回 1。\n\n### 示例：（静态变量）\n\
    \n```php\n<?php\nfunction nextNumber() \n{ \n  static $counter = 0; \n  return\
    \ ++$counter; \n}\n\necho \"I’ve counted to:\".nextNumber().\" <br/> \";\necho\
    \ \"I’ve counted to:\".nextNumber().\" <br/>\";\necho \"I’ve counted to:\".nextNumber().\"\
    \ <br/>\";\n?>\n```\n\n**输出：**\nI’ve counted to: 1\nI’ve counted to: 2\nI’ve counted\
    \ to: 3\n\n- 你可能不会经常使用静态变量，而且你通常也可以使用全局变量（尽管风险更大）来实现相同的效果。\n\n## 全局变量\n\n- 尽管变量作用域的概念非常有用，但有时你确实想要创建一个可以在脚本任何地方访问的变量，无论是在函数内部还是外部。这种变量被称为全局变量。\n\
    - PHP 支持全局变量，但如果你习惯了其他编程语言，你会发现……\n- 在 PHP 中，在函数外部创建的变量是全局的，但它们不能在函数内部被直接访问。\n\
    - 要在函数内部使用全局变量，必须使用 `global` 关键字。\n\n**示例：**\n\n```php\n<?php\n$myGlobal = \"\
    Hello\";\nfunction hello() {\n  global $myGlobal;\n  echo $myGlobal;\n}\nhello();\n\
    ?>\n```\n\n- 你也可以使用 `$GLOBALS` 超全局数组来访问变量。\n\n**示例：**\n\n```php\n<?php\n$myGlobal\
    \ = \"Hello\";\nfunction hello() {\n  echo $GLOBALS['myGlobal'];\n}\nhello();\n\
    ?>\n```\n\n"
- fmt: "\n| `$_SERVER['HTTP_ACCEPT_CHARSET']` | Returns the Accept_Charset header\
    \ from the current request (such as utf-8,ISO-8859-1) |\n| `$_SERVER['HTTP_HOST']`\
    \ | Returns the Host header from the current request |\n| `$_SERVER['HTTP_REFERER']`\
    \ | Returns the complete URL of the current page (not reliable because not all\
    \ user-agents support it) |\n| `$_SERVER['HTTPS']` | Is the script queried through\
    \ a secure HTTP protocol |\n| `$_SERVER['REMOTE_ADDR']` | Returns the IP address\
    \ from where the user is viewing the current page |\n| `$_SERVER['REMOTE_HOST']`\
    \ | Returns the Host name from where the user is viewing the current page |\n\
    | `$_SERVER['REMOTE_PORT']` | Returns the port being used on the user's machine\
    \ to communicate with the web server |\n| `$_SERVER['SCRIPT_FILENAME']` | Returns\
    \ the absolute pathname of the currently executing script |\n| `$_SERVER['SERVER_ADMIN']`\
    \ | Returns the value given to the `SERVER_ADMIN` directive in the web server\
    \ configuration file (if your script runs on a virtual host, it will be the value\
    \ defined for that virtual host) (such as someone@w3schools.com) |\n| `$_SERVER['SERVER_PORT']`\
    \ | Returns the port on the server machine being used by the web server for communication\
    \ (such as 80) |\n| `$_SERVER['SERVER_SIGNATURE']` | Returns the server version\
    \ and virtual host name which are added to server-generated pages |\n| `$_SERVER['PATH_TRANSLATED']`\
    \ | Returns the file system based path to the current script |\n| `$_SERVER['SCRIPT_NAME']`\
    \ | Returns the path of the current script |\n| `$_SERVER['SCRIPT_URI']` | Returns\
    \ the URI of the current page |\n\n# CHAPTER 8: PHP FORMS HANDLING, FORM VALIDATIONS\n\
    ## (USING `$_GET`, `$_POST`, `$_REQUEST`)\n\n### 1. The `ACTION` attribute of\
    \ the `<FORM>`:\nThe `ACTION` attributes calls the given ASP file (note: likely\
    \ PHP), when the `SUBMIT` button is clicked. If the `ACTION` attribute is not\
    \ given for a `<FORM>` then the script is requesting itself, it is a “Self-referencing”\
    \ page.\n\n### 2. The GET and POST method:\na. The `GET` method sends the variable\
    \ names and the value pairs of the Form by concatenating it along with the URL\
    \ as a Query String.\nb. The `POST` method sends the variable names and value\
    \ pairs of the Form as encoded along with the HTTP headers.\ni. **Advantage of\
    \ POST**: Security of information.\nii. **Disadvantage of POST**: The resulting\
    \ response page cannot be bookmarked.\n\n### 3. PHP has two global variables `$_GET`\
    \ and `$_POST` which are used to retrieve user input information from HTML forms.\n\
    \n### 4. Super global variable `$_REQUEST` to collect the value of the input field\
    \ instead of `$_GET` or `$_POST`.\n\n### 5. Practical Examples: Separate HTML\
    \ and PHP files.\n\n**Q. Write the HTML and PHP program to create the Welcome\
    \ message:**\n\n\n\n![](Images/image00184.jpeg)\n\n**Ans: HTML file saved on desktop\
    \ (`wel.html`)**\n```html\n<html> \n<body>\n<form action=\"welcome.php\" method=\"\
    post\">\nName: <input type=\"text\" name=\"name\"><br>\nE-mail: <input type=\"\
    text\" name=\"email\"><br>\n<input type=\"submit\">\n</form>\n</body>\n</html>\n\
    ```\n\n**PHP file saved in htdocs (`welcome.php`)**\n```php\n<?php\necho \"Your\
    \ name is: \" . $_POST[\"name\"], \"<br>\";\necho \"You Email is \" . $_POST[\"\
    email\"];\n?>\n```\n**Output:**\nWelcome John\nYour email address is john.doe@example.com\n\
    \n---\n\n### Practical Examples: Single PHP file with HTML form.\n\n**Q. Write\
    \ a single PHP file which contains the form that accepts the Name and Age of the\
    \ user displays it back when the submit button is clicked. (Note: In the example\
    \ `$_GET` is used.)**\n\n**Ans:**\n```html\n<html>\n<head>\n<title>$_POST result\
    \ in URL</title>\n</head>\n<body>\n<FONT SIZE=\"6pt\" color=blue FACE=\"Comic\
    \ Sans MS\">\n<H3>Handling HTML forms</H3>\n</FONT>\n<HR>\n<form name=\"DisplayDetails\"\
    \ method=\"GET\">\n<input type=\"text\" name=\"name\">\n<input type=\"text\" name=\"\
    age\">\n<input type=\"submit\">\n</form>\n<?php\necho \"Name: \" . $_GET['name'];\n\
    echo \"Age: \" . $_GET['age'];\n?>\n</body>\n</html>\n```\n\n---\n\n### Practical\
    \ Examples: Validating Forms\n\n**Q. Write the PHP program which displays a form\
    \ that accepts Name. Then it validates if the Name is empty (Note: `$_REQUEST`\
    \ is used).**\n\n**Ans:**\n```html\n<html>\n<body>\n<form action=\"<?php echo\
    \ $_SERVER[\"PHP_SELF\"];\" method=\"post\">\nName: <input type=\"text\" name=\"\
    fname\">\n<input type=\"submit\" value=\"Submit\">\n</form>\n\n<?php\nif ($_SERVER[\"\
    REQUEST_METHOD\"] == \"POST\") {\n    $name = $_REQUEST['fname'];\n    if (empty($name))\
    \ {\n        echo \"Name is empty\";\n    } else {\n        echo \"Name submitted:\
    \ \" . $name;\n    }\n}\n?>\n</body>\n</html>\n```\n"
