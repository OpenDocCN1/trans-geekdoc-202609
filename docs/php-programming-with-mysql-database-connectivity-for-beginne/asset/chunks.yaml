  trans: "\n\n# 使用 MySQL 数据库连接进行 PHP 编程\n\n初学者：\n解答你的所有问题\n分步教程\n\nRYSHITH DOYLE\n\
    Copyright © 2019 Ryshith Doyle\n保留所有权利\nISBN: 9781096303435\n\n## 目录\n- 第 1 章：PHP\
    \ 编程简介\n- 第 2 章：PHP 中的运算符\n- 第 3 章：PHP 中的内置函数\n- 第 4 章：PHP 中的分支\n- 第 5 章：PHP 中的循环\n\
    - 第 6 章：PHP 中的数组\n- 第 7 章：PHP 中的用户自定义函数和全局变量\n- 第 8 章：PHP 表单处理、表单验证（使用 `$_GET`,\
    \ `$_POST`, `$_REQUEST`）\n- 第 9 章：文本文件操作\n- 第 10 章：PHP 错误处理\n- 第 11 章：PHP 中的数据库操作\n\
    \n## 第 1 章：PHP 语言简介\n\n### 1. 什么是 PHP？\ni) `PHP` 代表“超文本预处理器”（Hypertext Preprocessor）\n\
    ii) 它用于创建“动态网页”\niii) 它是一门“服务端脚本”语言，并可以替代 `ASP`、`JSP`、`PERL`。\niv) 它是一个“开源软件”\n\
    \n### 2. 列出 PHP 的特性：\ni) `PHP` 易于阅读和理解。\nii) 不需要包含像 `C` 这样的库。\niii) 它是开源的——因此“免费使用”。\n\
    iv) 它是一种服务端脚本语言。\nv) 它是跨平台的（即可以在任何操作系统上运行——Windows、Mac 等）。\nvi) 它提供了与数据库的连接（如\
    \ `Oracle`、`MySQL`、`Ms-Access` 等）。\nvii) `PHP` 是面向对象的。\n\n### 3. 列出运行 PHP 的需求。\n\
    i) 一个 Web 服务器（如 `IIS` 服务器、`Apache` 服务器等）\nii) Web 浏览器（如 `IE`、`Google Chrome`）\n\
    iii) 文本编辑器（`Notepad` 或 `Notepad++`）\n\n### 4. PHP 和 HTML 的区别。\n\n| 序号 | PHP |\
    \ HTML |\n| --- | --- | --- |\n| 1 | `PHP` 用于设计动态网页 | `HTML` 用于设计静态网页 |\n| 2 |\
    \ `PHP` 文件在服务器端执行 | `HTML` 文件由浏览器解释并执行 |\n| 3 | `PHP` 文件首先由 `PHPengine` 执行，在发送到客户端之前转换为\
    \ `HTML` 代码 | 由于它运行在客户端的浏览器上，因此速度更快 |\n\n### 5. 服务端脚本和客户端脚本的区别。\n\n| 序号 | 服务端脚本\
    \ | 客户端脚本 |\n| --- | --- | --- |\n| 1 | 通常用 `ASP`、`JSP` 或 `PHP` 编写 | 通常用 `VBScript`\
    \ 或 `JavaScript` 编写 |\n| 2 | 始终由 Web 服务器处理 | 由客户端的 Web 浏览器处理 |\n| 3 | 能够根据用户需求创建\
    \ HTML 文件 | 无法根据用户需求创建 HTML 文件 |\n\n### 6. 什么是 IIS Web 服务器？\ni) Internet 信息服务（`IIS`）是微软公司创建的一种\
    \ Web 服务器。\nii) 它是开发和运行 `PHP` 文件的选项之一。\niii) 使用 `IIS` 时，`PHP` 文件必须保存在 `C:\\INETPUB\\\
    WWWROOT\\` 文件夹中。\n\n### 7. 什么是 Apache Web 服务器？\ni) `Apache` 是最广泛使用的 Web 服务器软件。\n\
    ii) `Apache` 是免费提供的开源软件。\niii) 可以使用 `XAMPP` 软件包安装 `Apache` Web 服务器。\niv) 使用 `XAMPP`\
    \ 时，`PHP` 文件必须保存在 `C:\\XAMPP\\HTDOCS\\` 文件夹中。\n\n### 8. 如何在网页中引入 PHP 脚本？\ni) 使用\
    \ `<?php ?>`\n示例：`<?php echo “hello world”; ?>`\nii) 使用 `<script language=\"php”>\
    \ ... </script>`\n\n### 9. 分号 (;) 在 php 代码中的作用是什么？\ni) 分号（`;`）用于终止/结束一个 `php`\
    \ 命令。\nii) 示例：\n```php\n<?php echo “hello world”; ?>\n```\n\n### 10. php 中如何编写注释？\n\
    i) 单行注释 (`//`）\nii) 多行注释 (`/* ... */`）\niii) 示例：\n```php\n<?php\n/* 这个 echo 语句将\n\
    打印我给它的消息  */\necho “Hello World”;\n// 我也可以显示欢迎消息\necho “Welcome Ajay”;     //\
    \ 以防用户名叫 Ajay\n```\n\n### 11. 变量（Variable） 是什么意思？\ni) 变量是一个命名的内存位置。\nii) 变量的值在程序执行过程中可以改变。\n\
    iii) php 变量的示例：\n```php\n<?php\n$x = 52;\necho $x;\n?>\n```\n\n### 12. 关于 php\
    \ 变量的注意事项：\ni) 所有 php 变量都以 `$` 符号开头，后跟变量名。\nii) 变量名必须以 `$` 符号后的字母或下划线 `_` 开头。\n\
    iii) 变量名只能包含字母、数字和下划线 (`a-z,A-Z,0-9` 和 `_`)。\niv) 变量名不包含空格。\nv) 变量名大小写敏感（$EMP`\
    \ 和 `$emp` 不同）。\nvi) PHP 中的变量没有内在类型。\nvii) 在赋值值之前使用的变量将具有默认值。\nviii) Php 能够在需要时自动转换变量类型。\n\
    ix) Php 不支持显式声明变量。\n\n### 13. “变量变量”（Variable Variables）或动态变量是什么意思？\ni) `Php`\
    \ 允许使用动态变量名，称为变量变量。\nii) 你可以使用另一个变量中存储的值来为变量命名。\niii) 示例：\n```php\n<?php\n$var1=”hello”\
    \ ;      // 创建了名为 var1 的变量并存储了值 “hello”\n$$var1=”world”;  // 创建了名为 hello 的变量并存储了值\
    \ “world”\n?>\n```\n\n### 14. 变量引用（Variable Reference） 是什么意思？\ni) 变量引用意味着为变量创建另一个名称（别名）。\n\
    ii) `&` 用于创建变量引用。\niii) 示例：\n```php\n<?php\n$var1=”hello”;      // 创建了名为 var1\
    \ 的变量并存储了值 “hello”\n$var2 = &$var1;      // 现在 var2 包含对 var1 的引用 \n?>\n```\n\n\
    ### 15. echo 和 print 的区别。\n\n| | echo | print |\n| --- | --- | --- |\n| 参数 | echo\
    \ 可以接受多个参数 | print 取一个参数 |\n| 返回值 | echo 不返回任何值 | print 总是返回 1 |\n| 语法 | echo\
    \ ( string ) | print ( string ) |\n| 它是什么？ | echo 不是函数而是语言结构 | print 不是函数而是语言结构\
    \ |\n\n### 16. 数据类型（Data types）是什么意思？\ni) 数据类型指的是变量可以存储的数据。\nii) 当你为变量赋值时，就会创建类型。\n\
    iii) PHP 无法声明为特定的类型。\niv) PHP 支持 8 种数据类型：\na. 整数 (Integer)：没有小数点的数字。\nb. 浮点数 (Double\
    \ or Float)：带有小数。\nc. 布尔 (Boolean)：只有两个可能的值 true 或 false。\nd. NULL：它只有一个值的特殊类型。\n\
    e. 字符串 (String)：字符/文本序列。\nf. 数组 (Array)：命名的索引集合。\ng. 对象 (Object)：程序员定义类的实例。\n\
    h. 资源 (Resource)：持有 PHP 外部引用（例如数据库连接）。\n\n![](img/image183.jpg)\n\n### 17. 特殊字符（Special\
    \ Characters）是什么意思？\ni) 在 PHP 字符串中，我们可以通过在字符前加反斜杠 `\\` 来转义/跳过。\nii) 以下是常用的特殊字符，前面带有反斜杠：\n\
    a. `\\n` – 换行符（等同于 `<br>`）\nb. `\\r` – 回车（Enter 键）\nc. `\\t` – TAB 键\nd. `\\$`\
    \ - 文字美元符号 ($)\ne. `\\'` - 文字单引号 (‘)\nf. `\\\"` - 文字双引号 (“)\ng. `\\\\` - 替换为单反斜杠\
    \ (\\)\n\n### 18. 类型转换（Type Casting）是什么意思？\ni) 类型转换是将数据类型从一种转换为另一种。\nii) `gettype()`：用于返回变量数据类型的函数。\n\
    iii) `settype()`：用于设置变量数据类型的函数。\niv) 示例：\n```php\n$myAge=17;\nPrint gettype($myAge);\
    \ // 返回： Integer\nsettype($myAge,”String”); \nPrint gettype($myAge); // 返回： String\n\
    ```\n\n### 19. 类型转换运算符（Type Casting Operators）是什么意思？\ni) PHP 提供了类型转换运算符，帮助将一种类型转换为另一种。\n\
    ii) 类型转换运算符列表：\na. `(int)`\nb. `(bool)`\nc. `(float)`\n\n"
