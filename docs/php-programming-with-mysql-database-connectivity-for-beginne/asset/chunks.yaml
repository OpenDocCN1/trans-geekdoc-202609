- fmt: "\n# PHP Programming with MySQL Database Connectivity\n\nFor Beginners:\nAnswers\
    \ all your Questions\nStep-by-Step\n\nRYSHITH DOYLE\nCopyright © 2019 Ryshith\
    \ Doyle\nAll rights reserved.\nISBN: 9781096303435\n\n## CONTENTS\n- CHAPTER 1:\
    \ INTRODUCTION TO PHP PROGRAMMING\n- CHAPTER 2: OPERATORS IN PHP\n- CHAPTER 3:\
    \ BUILT–IN FUNCTIONS IN PHP\n- CHAPTER 4: BRANCHING IN PHP\n- CHAPTER 5: LOOPING\
    \ IN PHP\n- CHAPTER 6: ARRAY IN PHP\n- CHAPTER 7: USER-DEFINED FUNCTIONS AND GLOBAL\
    \ VARIABLES IN PHP\n- CHAPTER 8: PHP FORMS HANDLING, FORM VALIDATIONS (USING `$_GET`,\
    \ `$_POST`, `$_REQUEST`)\n- CHAPTER 9: WORKING WITH TEXT FILES\n- CHAPTER 10:\
    \ PHP ERROR HANDLING\n- CHAPTER 11: WORKING WITH DATABASES IN PHP\n\n## CHAPTER\
    \ 1: INTRODUCTION TO PYTHON LANGUAGE\n\n### 1. What is PHP?\ni) `PHP` stands for\
    \ “Hypertext Preprocessor”\nii) It is used to create “Dynamic Web Pages”\niii)\
    \ It is “ “Server-side Scripting” Language and can be used in place of `ASP`,\
    \ `JSP`, `PERL`.\niv) It is an “Open Source Software “\n\n### 2. List the Features\
    \ of PHP:\ni) `PHP` is easy to read and understand.\nii) There is no need to include\
    \ libraries like `C`.\niii) It is Open Source – thus “free to use”\niv) It is\
    \ a Server-side scripting language\nv) It is Cross platform (ie. It can run on\
    \ any OS – Windows, Mac etc)\nvi) It provides connectivity to databases (ie. `Oracle`,\
    \ `MySQL`, `Ms-Access` etc)\nvii) `PHP` is Object Oriented.\n\n### 3. List the\
    \ Requirements to run PHP.\ni) A web server (such as `IIS` Web server, `Apache`\
    \ Web server etc)\nii) Web browser (ie. `IE`, `Google Chrome`)\niii) Text Editor\
    \ (`Notepad`, or `Notepad++`)\n\n### 4. Difference between PHP and HTML.\n\n|\
    \ S.NO | PHP | HTML |\n| --- | --- | --- |\n| 1 | `PHP` is used to design dynamic\
    \ web pages | `HTML` is used to design static web pages |\n| 2 | `PHP`files are\
    \ executed on the server side | `HTML` files are interpreted and execute by the\
    \ browser |\n| 3 | `PHP`file first executed by the `PHPengine` and converted into\
    \ `HTML` code before sending it to the client | As it runs on client’s browser,\
    \ so it is faster |\n\n### 5. Difference between Server Side Scripting and Client\
    \ Side Scripting.\n\n| S.no | Server Side Scripting | Client Side Scripting |\n\
    | --- | --- | --- |\n| 1 | It is usually written in `ASP`, `JSP` or `PHP` | It\
    \ is written in `VBScript` or `JavaScript` |\n| 2 | It is always processed by\
    \ the Web Server | It is processed by the Web Browser on the client side |\n|\
    \ 3 | It is capable of creating HTML files on demand of the user. | It is not\
    \ cable of creating HTML files on demand. |\n\n### 6. What is IIS Web server?\n\
    i) Internet Information Services (`IIS`) is an web server created by Microsoft\
    \ Inc.\nii) It is one of the options to develop and run `PHP` files\niii) When\
    \ using `IIS`, the `PHP` file have to be saved in `C:\\INETPUB\\WWWROOT\\` folder.\n\
    \n### 7. What is Apache Web server?\ni) `Apache` is the most widely used web server\
    \ software\nii) `Apache` is an open source software available for free\niii) `Apache`\
    \ web server can be installed using `XAMPP` software package.\niv) When using\
    \ `XAMPP`, the `PHP` file have to be saved in `C:\\XAMPP\\HTDOCS\\` folder.\n\n\
    ### 8. How to include PHP script in web pages?\ni) Using `<?php ?>`\nExample:\
    \ `<?php echo “hello world”; ?>`\nii) Using `<script language=\"php”> ... </script>`\n\
    \n### 9. What is the use of semicolon (;) in php code?\ni) Semicolon (`;`) is\
    \ used to terminate/end a `php` command.\nii) Example:\n```php\n<?php echo “hello\
    \ world”; ?>\n```\n\n### 10. How are comments given in php?\ni) Single Line Comment\
    \ (`//`)\nii) Multiline Comment (`/* ... */`)\niii) Example:\n```php\n<?php\n\
    /* This echo statement will \nprint the meggage I give it  */\necho “Hello World”;\n\
    // I can also display a welcome message\necho “Welcome Ajay”;     // In case the\
    \ users name is Ajay\n```\n\n### 11. What is meant by Variable?\ni) Variable is\
    \ a named memory location.\nii) The value of a variable can change during program\
    \ execution.\niii) Example of php variable:\n```php\n<?php\n$x = 52;\necho $x;\n\
    ?>\n```\n\n### 12. Points to remember about php variables:\ni) All variable is\
    \ php start with a `$` sign followed by the name of the variable\nii) A variable\
    \ name must start with a letter or an underscore `_` after `$` sign\niii) A variable\
    \ name can only contain alpha-numeric characters and underscore (`a-z,A-Z,0-9`\
    \ and `_`)\niv) A variable name should not contain spaces\nv) Variable names are\
    \ case-sensitive (`$EMP` and `$emp` are not same)\nvi) Variable in php does not\
    \ have Intrinsic types.\nvii) Variable that are used before they are assigned\
    \ values will have default values\nviii) Php is able to automatically convert\
    \ the variable type when required\nix) Php does not support Explicit declaration\
    \ of variables\n\n### 13. What is meant by “Variable Variables” or Dynamic Variables?\n\
    i) `Php` allows you use Dynamic Variable Names, called Variable Variables.\nii)\
    \ You can name a variable with the value stored in another variable.\niii) Example:\n\
    ```php\n<?php\n$var1=”hello” ;      // variable named var1 is created and value\
    \ “hello” is stored\n$$var1=”world”;  // variable named hello is created and value\
    \ “world” is stored\n?>\n```\n\n### 14. What is meant by Variable Reference?\n\
    i) Variable reference means creating another name (alias) for the variable.\n\
    ii) The `&` is used for creating Variable Reference\niii) Example:\n```php\n<?php\n\
    $var1=”hello”;      // variable named var1 is created and value “hello” is stored\n\
    $var2 =&$var1;  // now var2 is another name given to var1, and var2 also contains\
    \ “hello”\n?>\n```\n\n### 15. Difference between echo and print.\n\n| | echo |\
    \ print |\n| --- | --- | --- |\n| Parameters | `echo` can take more than one parameter\
    \ | `print` takes one parameter |\n| Return value | `echo` does not return any\
    \ value | `print` always returns 1 |\n| Syntax | `echo ( string )` | `print (\
    \ string )` |\n| What is it? | In PHP, `echo` is not a function but a language\
    \ construct. | In PHP, `print` is not really function but a language construct.\
    \ |\n\n### 16. What is meant by Data types?\ni) A data type refers to the data\
    \ a variable can store.\nii) PHP has no command to declare a variable, a variable\
    \ is created the moment you assign a value to it.\niii) In PHP a variable cannot\
    \ be declared as a specific type.\niv) PHP supports 8 Data Types:\na. Integer\
    \ : These are whole numbers, without decimal point.\nb. Double or Float : These\
    \ are decimal point.\nc. Boolean : Only two possible values true or false\nd.\
    \ NULL : It is a special type that only has one value.\ne. String : These are\
    \ sequence of characters/text.\nf. Array : These are named and indexed collection\
    \ of values.\ng. Object : These are instances of programmer-defined classes.\n\
    h. Resource : These are special variables that hold references to resources external\
    \ to PHP (such as database connection)\n\n![](image0183.jpg)\n\n### 17. What is\
    \ meant by Special Characters?\ni) In PHP strings we can escape/skip a characters\
    \ by preceding it with a `\\` backslash.\nii) The following are the commonly used\
    \ special characters and are preceded by a backslash :\na. `\\n` – Newline character\
    \ (same as `<br>`)\nb. `\\r` – Carriage Return (Enter Key)\nc. `\\t` – TAB Key\n\
    d. `\\$` - Literal Dollar($)\ne. `\\'` – Literal Single Quote (‘)\nf. `\\\"` –\
    \ Literal Double Quote (“)\ng. `\\\\` - Replaced with a Single Backslash (\\\\\
    )\n\n### 18. What is meant by Type Casting?\ni) Type Casting means changing the\
    \ data type of a variable from one type to another.\nii) `gettype()` : the function\
    \ used to return the name of the data type of the variable.\niii) `settype()`:\
    \ the function used to set the data type of a variable.\niv) Example:\n```php\n\
    $myAge=17;\nPrint gettype($myAge); // Returns : Integer\nsettype($myAge,”String”);\
    \ \nPrint gettype($myAge); // Returns : String\n```\n\n### 19. What is meant by\
    \ Type Casting Operators?\ni) PHP offers Type Casting Operators that help to convert\
    \ one type to another.\nii) List of Type Casting Operators:\na. `(int)`\nb. `(bool)`\n\
    c. `(float)`\n"
