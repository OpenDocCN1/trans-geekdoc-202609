    \ \n\n info(\"ravi\"); \n\n info(\"ravi\",\"dave\"); \n\n?>\n\n Output:- \n\n\
    Rahulpatel\n\nRavipatel\n\nRavidave\n\n The main limitation of default arguments\
    \ is that the matching of actual to formal parameters is determined by the ordering\
    \ of both—it’s first-come, first-served.\n\nScope and Lifetime of Variables:\n\
