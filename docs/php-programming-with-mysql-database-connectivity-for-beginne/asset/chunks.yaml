    ## 第 11 章：在 PHP 中操作数据库\n\n### 1. 前端与后端\n前端指的是用户界面（浏览器），而后端是存储数据的部分。\n\n### 2.\
    \ PHP 可以通过以下方式连接 MySQL：\na. `MySQLi`\nb. `PDO`\n\n### 3. PDO\na. 它代表 PHP Data\
    \ Objects（PHP 数据对象）。\nb. `PDO` 适用于 12 种不同的数据库系统，而 `MySQLi` 仅适用于 MySQL 数据库。\nc.\
    \ `PDO_ODBC` 驱动允许通过 `PDO` 接口访问 ODBC 数据库（ODBC 代表 Open Database Connectivity，开放数据库连接）。\n\
    \n### 4. MySQLi\na. `MySQLi` 是旧 PHP MySQL 驱动的改进版本。\nb. `MySQLi` 扩展相比其前身具有多种优势：\n\
    i. 面面向的接口\nii. 支持多语句执行\niii. 增强的调试支持\n\n### 5. 用于数据库连接的内置函数\n\na. `mysqli_connect()`：打开与\
    \ MySQL 服务器的新连接，并返回一个表示到 MySQL 服务器连接的对象。\n语法：`mysqli_connect(host,username,password,dbname,port,socket);`\n\
    \nb. `mysqli_connect_error()`：返回描述错误的字符串。如果没有发生错误，则返回 NULL。\n\nc. `mysqli_query()`：`mysqli_query()`\
    \ 函数对数据库执行查询。\n语法：`mysqli_query(connection,query,resultmode);`\n\nd. `mysqli_fetch_assoc()`：`mysqli_fetch_assoc()`\
    \ 函数将结果行以关联数组的形式获取。如果结果集中没有更多行，则返回 NULL。\n\ne. `mysqli_close()`：`mysqli_close()`\
    \ 函数关闭之前打开的数据库连接并释放内存资源。\n\n## 数据库连接程序\n\n示例示例数据库：MyGuests 表\n\n### 1. Item 表设计视图：\n\
    ```sql\nCREATE TABLE MyGuests (\nid INT,\nfirstname VARCHAR(30),\nlastname VARCHAR(30),\n\
    email VARCHAR(50),\nreg_date DATE\n)\n```\n\n#### 程序 1. 打开与 MySQL 的连接\n```php\n\
    <?php\n$servername = \"localhost\";\n$username = \"username\";\n$password = \"\
    password\";\n// 创建连接\n$conn = mysqli_connect($servername, $username, $password);\n\
    // 检查连接\nif (!$conn) {\n    die(\"Connection failed: \" . mysqli_connect_error());\n\
    }\necho \"Connected successfully\";\n?>\n```\n\n#### 程序 2. 使用 MySQLi 创建 MySQL\
    \ 数据库\n```php\n<?php\n$servername = \"localhost\";\n$username = \"username\";\n\
    $password = \"password\";\n// 创建连接\n$conn = mysqli_connect($servername, $username,\
    \ $password);\n// 检查连接\nif (!$conn) {\n    die(\"Connection failed: \" . mysqli_connect_error());\n\
    }\necho \"Connected successfully\";\n```\n\n#### 程序 3. 使用 MySQLi 创建表\n```php\n\
    <?php\n$servername = \"localhost\";\n$username = \"username\";\n$password = \"\
    password\";\n// 创建连接\n$conn = mysqli_connect($servername, $username, $password);\n\
    // 检查连接\nif (!$conn) {\n    die(\"Connection failed: \" . mysqli_connect_error());\n\
    }\n// 创建数据库\nmysqli_set_db($conn, \"myDB\"); // 注意：此处原文逻辑应为创建数据库，此处保持翻译结构\n```\n\
