  trans: "\n索引为 2，而“pratik”的索引为 3 。\n\n### 访问数组元素\n\n一旦你创建了数组，如何访问内部的单个值呢？实际上，你这样做的方法与访问字符串中的单个字符的方法非常相似：\n\
    \n```php\n$a = array( “Rahul”, “ravi”, “ajit”, “pratik” );\n$b = $a[0]; // $myAuthor\
    \ 包含 “Rahul”\n$c = $a[1]; // $anotherAuthor 包含 “ravi”\n$a = array( “Rahul”, “ravi”,\
    \ “ajit”, “pratik” );\n$pos = 2;\necho $a[$pos + 1]; // 显示 “ajit”\n```\n\n###\
    \ 使用 `print_r()` 输出整个数组\n\n你不能像对待普通变量那样直接用 `print()` 或 `echo()` 来打印数组，因为这些函数一次只能处理一个值。\n\
    \n然而，PHP 确实提供了一个名为 `print_r()` 的函数，你可以用它来输出数组的内容以便调试。\n\n使用 `print_r()` 非常简单——只需将你想要输出的数组传递给它即可：\n\
    \n```php\nprint_r($a);\n```\n\n以下示例代码创建了一个索引数组和一个关联数组，然后显示这两个数组：\n\n```php\n<?php\n\
    $a = array( \"Rahul\", \"ravi\", \"ajit\", \"pratik\" );\nprint_r ( $a );\n?>\n\
    ```\n\n### `foreach` 循环结构\n\n- 存在一种 `foreach` 结构（命令），它会为数组中的每个值应用一组语句。\n- 然而，它只对数组有效，如果你尝试对另一种类型的变量使用它，它会给你一个巨大的错误。\n\
    - 你的 `foreach` 命令语法看起来如下：\n\n```php\nforeach ($array_variable as $value_variable)\n\
    {\n    // .. 对 $value_variable 中的值进行某些操作\n}\n\nforeach ($array_variable as $key_var\
    \ => $value_var)\n{\n    // .. 对 $key_var 和/或 $value_var 进行某些操作\n}\n```\n\n####\
    \ 示例：\n\n```html\n<<html>\n<head>\n<title>For Each 结构</title>\n</head>\n<body>\n\
    <?php\n$a[] = \"Rahul\";\n$a[] = \"Ravi\";\n$a[] = \"Pratik\";\necho \"My Name\
    \ -->\".'</br>';\nforeach ($a as $b)\n{\n    // 只要 $a 中还有值，这些行就会执行\n    echo $b.'</br>';\n\
    }\n?>\n</body>\n</html>\n```\n\n### 与数组一起使用的内置函数：`sort()` 和 `rsort()`\n\n####\
    \ i. `sort()`\n\n- 对数组进行排序\n- **定义与用法**：`sort()` 函数按值对数组进行排序。\n- 此函数会为数组中的元素分配新键。现有的键将被删除。\n\
    - 该函数在成功时返回 `TRUE`，失败时返回 `FALSE`。\n- **语法**：`sort(array,sorttype)`\n    - `Array`：必填。指定要排序的数组。\n\
    \    - `Sorttype`：可选。指定如何对数组值排序。可能的值有：\n        - `SORT_REGULAR` - 默认。按原样处理值（不改变类型）\n\
    \        - `SORT_NUMERIC` - 按数值处理值\n        - `SORT_STRING` - 将值视为字符串\n      \
    \  - `SORT_LOCALE_STRING` - 根据本地设置将值视为字符串\n- **示例**：\n\n```php\n<?php\n$animal\
    \ = array(\"a\" => \"Dog\", \"b\" => \"Cat\", \"c\" => \"Horse\");\nsort($animal);\n\
    print_r($animal);\n?>\n```\n\n- **输出**：\n```\nArray\n(\n    [0] => Cat\n    [1]\
    \ => Dog\n    [2] => Horse\n)\n```\n\n#### ii. `rsort()`\n\n- 降序返回数组\n- **定义与用法**：`rsort()`\
    \ 函数按降序返回数组。\n    - `Array`：必填。指定一个数组。\n    - `Preserve`：可选。可能的值：`true` 或 `false`。指定函数是否应该保留数组的键。\n\
    - **示例**：\n\n```php\n<?php\n$a=array(\"a\"=>\"Dog\",\"b\"=>\"Cat\",\"c\"=>\"Horse\"\
    );\nprint_r(rsort($a));\n?>\n```\n\n- **输出**：\n```\nArray ( [c] => Horse [b] =>\
    \ Cat [a] => Dog )\n```\n\n## 第 7 章：PHP 中的用户自定义函数和全局变量\n\n#### 1 函数\n\n当你在多个地方使用代码时，函数最为有用，但即使在只使用一次的情况下它们也有帮助，因为它们可以使你的代码更具读性。\n\
    \n##### 语法\n\n- 函数定义具有以下形式：\n\n```php\nfunction function-name ($argument-1, $argument-2,\
    \ ..)\n{\n    statement-1;\n    statement-2;\n    ...\n}\n```\n\n#### 示例-1：\n\n\
    ```php\n<?php\nfunction add($a, $b)\n{\n    $c=$a+$b;\n    echo \"Total-->\".$c;\n\
    }\n$x = 10;\n$y = 20;\nadd($x,$y);\n?>\n```\n\n#### 示例-2（返回值）：\n\n```php\n<?php\n\
    function add($a, $b)\n{\n    $c=$a+$b;\n    return $c;\n}\n$x = 10;\n$y = 20;\n\
    echo add($x,$y);\n?>\n```\n\n#### 形式参数与实际参数\n\n- 在前面的示例中，我们传递给函数的是变量，但也可以是数字。\n\
    - 实际参数（函数调用时的参数）可以与形式参数名称不同。\n- 形式参数（函数定义中的参数）在函数外部是独立的。\n- 正如我们在下一节中看到的，实际参数与形式参数名称可以相同。\n\
    - 无论如何，形式参数与实际参数是无关的。\n\n##### 值传递\n\n- PHP 的默认行为是值传递。\n- 这意味着当你传递变量给函数时，PHP 会创建变量的副本。\n\
    - 这取决于你是否要修改原始值，这可能是坏。\n\n```php\n<?php\nfunction add($a, $b)\n{\n    $c=$a+$b;\n\
    \    echo \"Total-->\".$c;\n}\nfunction sub($d, $e)\n{\n    $f=$d-$e;\n    echo\
    \ \"Sub-->\".$f;\n}\n$x=10;\n$y=20;\nadd($x,$y);\nsub($x,$y);\n?>\n```\n\n#####\
    \ 引用传递\n\n- PHP 提供了让函数实际修改参数两种方法：在函数定义和函数调用中。\n\n```php\n<?php\nfunction display(&$b1,\
    \ &$b2)\n{\n    $b1 = 30;\n    $b2 = 40;\n}\n$a1=10;\n$a2=20;\ndisplay($a1,$a2);\n\
    echo $a1;\necho $a2;\n?>\n```\n\n##### 返回函数\n\n- 使用 `return` 语句返回值。\n- 可以返回任何类型，包括数组和对象。\n\
    - 这会导致函数结束执行并将控制权传回调用它的行。\n- 如果在函数内部调用，`return()` 函数会立即结束当前函数的执行并将参数作为函数调用的值返回。\n\
    \n```php\n<?php\nfunction sum($a, $b)\n{\n    $c=$a+$b;\n    return $c;\n}\n$x=10;\n\
    $y=20;\n$z=sum($x,$y);\necho $z;\n?>\n```\n\n##### 默认参数\n\n- 要定义带有默认参数的函数，只需将形式参数名称转换为赋值表达式即可。\n\
    - 如果实际调用的参数少于定义中的形式参数数量，PHP 将匹配实际参数和形式参数，直到实际参数耗尽，然后使用默认赋值来填充剩余部分。\n\n```php\n\
    <?php\nfunction info($fname=\"rahul\",$lname=\"patel\")\n{\n    echo $fname;\n\
    \    echo $lname.'</br>';\n}\ninfo();\ninfo(\"ravi\");\ninfo(\"ravi\",\"dave\"\
    );\n?>\n```\n\n"
- fmt: "\n- In fact, all variables declared within a function are deleted when the\
    \ function exits, and created a new when the function is next called.\n- This\
    \ is usually what you want to happen, because it allows you to write nicely self-contained\
    \ functions that work independently of each other.\n- However, sometimes it’s\
    \ useful to create a local variable that has a somewhat longer lifespan.\n- Static\
    \ variables let you do just this. These types of variables are still local to\
    \ a function, in the sense that they can be accessed only within the function’s\
    \ code.\n- However, unlike local variables, which disappear when a function exits,\
    \ static variables remember their values from one function call to the next.\n\
    - To declare a local variable as static, all you need to do is write the word\
    \ `static` before the variable name, and assign an initial value to the variable:\n\
    \n```php\nstatic $var = 0;\n```\n\n- The first time the function is called, the\
    \ variable is set to its initia value (zero in this example).\n- However, if the\
    \ variable's value is changed within the function, the new value is remembered\
    \ the next time the function is called.\n- The value is remembered only as long\
    \ as the script runs, so the next time you run the script the variable is reinitialized.\n\
    \n### Example: (Local variable)\n\n```php\n<?php\nfunction nextNumber() \n{ \n\
    \  $counter = 0; \n  return ++$counter; \n}\n\necho \"I’ve counted to:\".nextNumber().\"\
    \ <br/> \";\necho \"I’ve counted to:\".nextNumber().\" <br/>\";\necho \"I’ve counted\
    \ to:\".nextNumber().\" <br/>\";\n?>\n```\n\n**Output:**\nI’ve counted to: 1\n\
    I’ve counted to: 1\nI’ve counted to: 1\n\n- Each time the `nextNumber()` function\
    \ is called, its `$counter` local variable is re-created and initialized to zero.\n\
    - Then it’s incremented to 1 and its value is returned to the calling code.\n\
    - So the function always returns 1, no matter how many times it’s called.\n\n\
    ### Example: (Static variable)\n\n```php\n<?php\nfunction nextNumber() \n{ \n\
    \  static $counter = 0; \n  return ++$counter; \n}\n\necho \"I’ve counted to:\"\
    .nextNumber().\" <br/> \";\necho \"I’ve counted to:\".nextNumber().\" <br/>\"\
    ;\necho \"I’ve counted to:\".nextNumber().\" <br/>\";\n?>\n```\n\n**Output:**\n\
    I’ve counted to: 1\nI’ve counted to: 2\nI’ve counted to: 3\n\n- You probably won’t\
    \ use static variables that often, and you can often achieve the same effect (albeit\
    \ with greater risk) using global variables.\n\n## Global variable\n\n- Although\
    \ the concept of variable scope is extremely useful, occasionally you do actually\
    \ want to create a variable that can be accessed anywhere in your script, whether\
    \ inside or outside a function. Such a variable is called a global variable.\n\
    - PHP supports global variables, but if you’re used to other programming languages\
    \ you’ll find...\n- In PHP, variables created outside a function are global, but\
    \ they cannot be accessed directly inside a function.\n- To use a global variable\
    \ inside a function, you must use the `global` keyword.\n\n**Example:**\n\n```php\n\
    <?php\n$myGlobal = \"Hello\";\nfunction hello() {\n  global $myGlobal;\n  echo\
    \ $myGlobal;\n}\nhello();\n?>\n```\n\n- You can also use the `$GLOBALS` superglobal\
    \ array to access variables.\n\n**Example:**\n\n```php\n<?php\n$myGlobal = \"\
    Hello\";\nfunction hello() {\n  echo $GLOBALS['myGlobal'];\n}\nhello();\n?>\n\
    ```\n"
  raw: " In fact, all variables declared within a function are deleted when the function\
    \ exits, and created a new when the function is next called. \n\n This is usually\
    \ what you want to happen, because it allows you to write nicely self-contained\
    \ functions that work independently of each other.\n\n However, sometimes it’s\
    \ useful to create a local variable that has a somewhat longer \n\nlifespan. \n\
    \n Static variables let you do just this. These types of variables are still\
    \ local to a function, in \n\nthe sense that they can be accessed only within\
    \ the function’s code. \n\n However, unlike local variables, which disappear\
    \ when a function exits, static variables \n\nremember their values from one function\
    \ call to the next. \n\n To declare a local variable as static, all you need\
    \ to do is write the word static before the \n\nvariable name, and assign an initial\
    \ value to the variable: \n\n static $var = 0; \n\n The first time the function\
    \ is called, the variable is set to its initia l value (zero in this \n\nexample).\
    \ \n\n However, if the variable ’ s value is changed within the function, the\
    \ new value is \n\nremembered the next time the function is called. \n\n The\
    \ value is remembered only as long as the script runs, so the next time you run\
    \ the script \n\nthe variable is reinitialized. \n\n Example:(Local variable)\
    \ \n\n<?php\n\nfunction nextNumber() \n\n{ \n\n $counter = 0; \n\n return ++$counter;\
    \ \n\n} \n\necho \"I’ve counted to:\".nextNumber().\" <br/> \"; \n\necho \"I’ve\
    \ counted to:\".nextNumber().\" <br/>\"; \n\necho \"I’ve counted to:\".nextNumber().\"\
    \ <br/>\"; \n\n?>\n\n Output: \n\n I’ve counted to: 1 \n\n I’ve counted to: 1\
    \ \n\n I’ve counted to: 1 \n\n Each time the next Number() function is called,\
    \ its $counter local variable is re - created and initialized to zero. \n\n Then\
    \ it’s incremented to 1 and its value is returned to the calling code. \n\n So\
    \ the function always returns 1, no matter how man y times it’s called. \n\n\
    \ Example:(Static variable) \n\n<?php\n\nfunction nextNumber() \n\n{ \n\n static\
    \ $counter = 0; \n\n return ++$counter; \n\n} \n\necho \"I’ve counted to:\".nextNumber().\"\
    \ <br/> \"; \n\necho \"I’ve counted to:\".nextNumber().\" <br/>\"; \n\necho \"\
    I’ve counted to:\".nextNumber().\" <br/>\"; \n\n?>\n\n output: \n\n I’ve counted\
    \ to: 1 \n\n I’ve counted to: 2 \n\n I’ve counted to: 3\n\n You probably won’t\
    \ use static variables that often, and you can often achieve the same \n\neffect\
    \ (albeit with greater risk) using global variables.\n\nGlobal variable \n\n\
    \ Although the concept of variable scope is extremely useful, occasionally you\
    \ do actually \n\nwant to create a variable that can be accessed anywhere in your\
    \ script, whether inside or \n\noutside a function. Such a variable is called\
    \ a global variable. \n\n PHP supports global variables, but if you’re used to\
    \ other pro gramming languages you’ll find \n\nPHP handles global slightly differently.\
    \ \n\n In PHP, all variables created outside a function are, in a sense, global\
    \ in that they can be \n\naccessed by any other code in the script that ’ s not\
    \ inside a function. \n\n To use such a variable inside a function, write the\
    \ word global followed by the variable \n\nname inside the function’s code block.\
    \ \n\n Example: \n\n<?php\n\n$myGlobal = \"RAHUL PATEL\"; \n\nfunction hello()\
    \ \n\n{ \n\n global $myGlobal; \n\n echo \"$myGlobal\"; \n\n} \n\nhello(); //\
    \ Displays “RAHUL PATEL” ?>\n\n You can see that the hello() function accesses\
    \ the $myGlobal variable by declaring it to be \n\nglobal using the global statement.\
    \ \n\n The function can then use the variable to display the greeting. \n\n\
    \ In fact, you don’t need to have created a variable outside a function t o use\
    \ it as a global \n\nvariable. \n\n Take a look at the following script: \n\n\
    <?php\n\nfunction setup() \n\n{\n\nglobal $myGlobal; \n\n$myGlobal = \"Hello there!\"\
    ;\n\n} \n\nfunction hello() \n\n{ \n\n global $myGlobal; \n\n echo \"$myGlobal\"\
    ; \n\n} \n\nsetup(); \n\nhello(); // Displays “Hello there!” \n\n?>\n\n In this\
    \ script, the setup() function is called first. \n\n It declares the $myGlobal\
    \ variable as global, and gives it a value. \n\n Then the hello() function is\
    \ called. \n\n It too declares $myGlobal to be global, which means it can now\
    \ access its value — \n\npreviously set by setup() — and display it. \n\n By\
    \ the way, you can also declare more than one global variable at once on the same\
    \ line — \n\njust separate the variables using commas: \n\nfunction myFunction()\
    \ \n\n{ \n\nglobal $oneGlobal, $anotherGlobal; \n\n} \n\n Finally, you can also\
    \ access global variables using the $GLOBALS array. \n\n This array is a special\
    \ type of variable called a superglobal , which means you can access it \n\nfrom\
    \ anywhere without using the global statement. \n\n It contains a list of all\
    \ global variables, with the variable names stored in its keys and the \n\nvariable’s\
    \ values stored in its values. Here’s an example that uses $GLOBALS : \n\n<?php\n\
    \n$myGlobal = \"Hello\"; \n\nfunction hello() \n\n{ \n\n echo $GLOBALS\\[\"myGlobal\"\
    \\]; \n\n} \n\nhello(); // Displays “Hello there!” \n\n?>\n\n The hello() function\
    \ accesses the contents of the $myGlobal variable via the $GLOBALSarray. \n\n\
     Notice that the function doesn’t have to declare the $myGlobal variable as global\
    \ in order \n\nto access its value.\n\nPHP SUPERGLOBALS\n\n1.PHP Super Global\
    \ Variables:\n\n•Several predefined variables in PHP are \"superglobals\", which\
    \ means that they are always accessible, regardless of scope - and you can access\
    \ them from any function, class or file without having to do anything special\n\
    \n2.List PHP superglobals:\n\n•$GLOBALS\n\n•$\\_SERVER\n\n•$\\_REQUEST\n\n•$\\\
    _POST\n\n•$\\_GET\n\n•$\\_FILES\n\n•$\\_ENV\n\n•$\\_COOKIE\n\n•$\\_SESSION\n\n\
    $GLOBALS\n\n$GLOBALS is a PHP super global variable which is used to access global\
    \ variables from anywhere in the PHP script (also from within functions or methods).\n\
    \na.PHP stores all global variables in an array called $GLOBALS\\[index\\]. The\
    \ index holds the name of the variable.\n\nb.The example below shows how to use\
    \ the super global variable $GLOBALS:\n\n<?php \n\n$x = 75; \n\n$y = 25;\n\nfunction\
    \ addition() { \n\n    $GLOBALS\\['z'\\] = $GLOBALS\\['x'\\] + $GLOBALS\\['y'\\\
    ]; \n\n}\n\n addition(); \n\necho $z; \n\n?>\n\nOutput:100\n\n$\\_SERVER\n\na.$\\\
    _SERVER is a PHP super global variable which holds information about headers,\
    \ paths, and script locations.\n\nb.The example below shows how to use some of\
    \ the elements in $\\_SERVER:\n\n<?php \n\necho $\\_SERVER\\['PHP\\_SELF'\\];\n\
    \necho \"<br>\";\n\necho $\\_SERVER\\['SERVER\\_NAME'\\];\n\necho \"<br>\";\n\n\
    echo $\\_SERVER\\['HTTP\\_HOST'\\];\n\necho \"<br>\";\n\necho $\\_SERVER\\['HTTP\\\
    _REFERER'\\];\n\necho \"<br>\";\n\necho $\\_SERVER\\['HTTP\\_USER\\_AGENT'\\];\n\
    \necho \"<br>\";\n\necho $\\_SERVER\\['SCRIPT\\_NAME'\\];\n\n?>\n\nOUTPUT:\n\n\
    /php/demo\\_global\\_server.php\n\nwww.w3schools.com\n\nwww.w3schools.com\n\n\
    http://www.w3schools.com/php/showphp.asp?filename=demo\\_global\\_server\n\nMozilla/5.0\
    \ (Windows NT 6.1) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/52.0.2743.116\
    \ Safari/537.36\n\n/php/demo\\_global\\_server.php\n\nThe following table lists\
    \ the most important elements that can go inside $\\_SERVER:\n\n| Element/Code\
    \ || Description |\n\n| --- | --- |\n\n| $\\_SERVER\\['PHP\\_SELF'\\] || Returns\
    \ the filename of the currently executing script |\n\n| $\\_SERVER\\['GATEWAY\\\
    _INTERFACE'\\] || Returns the version of the Common Gateway Interface (CGI) the\
    \ server is using |\n\n| $\\_SERVER\\['SERVER\\_ADDR'\\] || Returns the IP address\
    \ of the host server |\n\n| $\\_SERVER\\['SERVER\\_NAME'\\] || Returns the name\
    \ of the host server (such as www.w3schools.com) |\n\n| $\\_SERVER\\['SERVER\\\
    _SOFTWARE'\\] || Returns the server identification string (such as Apache/2.2.24)\
    \ |\n\n| $\\_SERVER\\['SERVER\\_PROTOCOL'\\] || Returns the name and revision\
    \ of the information protocol (such as HTTP/1.1) |\n\n| $\\_SERVER\\['REQUEST\\\
    _METHOD'\\] || Returns the request method used to access the page (such as POST)\
    \ |\n\n| $\\_SERVER\\['REQUEST\\_TIME'\\] || Returns the timestamp of the start\
    \ of the request (such as 1377687496) |\n\n| $\\_SERVER\\['QUERY\\_STRING'\\]\
    \ || Returns the query string if the page is accessed via a query string |\n\n\
    | $\\_SERVER\\['HTTP\\_ACCEPT'\\] || Returns the Accept header from the current\
    \ request |"
