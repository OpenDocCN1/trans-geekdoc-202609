  trans: "\nSwitch 是某些情况下非常有用的替代方案，当你想要根据单个值产生多个可能的分支，且使用一系列 `if` 语句会很繁琐时。\n\n###\
    \ 1. If-else\n\n#### 语法：\n```php\nif (condition)\n{\n    statement-1\n}\n```\n\
    \n#### 或者带有可选的 else 分支：\n```php\nif (condition)\n{\n    statement-1\n}\nelse\n\
    {\n    statement-2\n}\n```\n\n- 当处理一个 `if` 语句时，会计算测试表达式的值，并将结果解释为布尔值（Boolean value）。\n\
    - 如果 `condition` 为真，则执行 `statement-1`。如果 `condition` 为假且存在 `else` 子句，则执行 `statement-2`。\n\
    - 如果 `condition` 为假且没有 `else` 子句，执行将直接继续到 `if` 结构之后的下一个语句。\n\n#### 示例:-1 (简单 If)\n\
    ```php\n<?php\n$a=10;\nif ($a == 10)\n{\n    echo $a;\n}\n?>\n```\n\n#### 示例:-2\
    \ (简单 If 和 Else)\n```php\n<?php\n$a=10;\n$b=4;\nif ($a > $b)\n{\n    echo \"A\
    \ is greater than\";\n}\nelse\n{\n    echo \"B is greater than\";\n}\n?>\n```\n\
    \n#### 示例:-3 (Elseif)\n```php\n<?php\n$a=2;\nif ($a == 1)\n{\n    print \"Mon\"\
    ;\n}\nelseif($a==2)\n{\n    print \"Thu\";\n}\nelse\n{\n    print \"wrong choice\"\
    ;\n}\n?>\n```\n\n#### 示例:-4 (嵌套 if……else)\n```php\n<?php\n$a=1;\n$b=2;\n$c=3;\n\
    if ($a > $b)\n{\n    if ($a > $c) {\n        print \"a is max\";\n    }\n    else\
    \ {\n        print \"c is max\";\n    }\n}\nelse\n{\n    if ($b > $c)\n    {\n\
    \        print \"b is max\";\n    }\n    else\n    {\n        print \"c is max\"\
    ;\n    }\n}\n?>\n```\n\n### Switch\n\n- 对于特定类型的多路分支，`switch` 结构非常有用。\n- `switch`\
    \ 并不是根据任意逻辑表达式进行分支，而是根据单个表达式的值采取不同的路径。\n- 语法如下所示，可选部分包含在方括号 `[]` 中：\n\n```php\n\
    switch(expression)\n{\n    case value-1:\n        statement-1\n        statement-2\n\
    \        ...\n        [break;]\n    case value-2:\n        statement-3\n     \
    \   statement-4\n        ...\n        [break;]\n    .....\n    ……\n    [default:\n\
    \        default-statement]\n}\n```\n\n- `expression` 可以是一个变量或任何其他表达式，只要它能求得一个简单值（即整数、双浮点数或字符串）。\n\
    - 该结构通过求值表达式，然后将其结果与每个 `case` 值进行等性测试来执行。\n- 一旦找到匹配的值，将按顺序执行后续语句，直到遇到特殊语句（`break;`）或\
    \ `switch` 结构的结束。\n- 在结尾可以使用特殊的 `default` 标签，如果到为止没有其他 `case` 匹配该表达式，它将匹配该表达式。\n\
    \n#### 示例:\n```php\n<?php\n$a=6;\nswitch($a)\n{\n    case 1:\n        print \"\
    Mon\";\n        break;\n    case 2:\n        print \"Tue\";\n        break;\n\
    \    case 3:\n        print \"Wen\";\n        break;\n    case 4:\n        print\
    \ \"Thu\";\n        break;\n    case 5:\n        print \"Fri\";\n        break;\n\
    \    case 6:\n        print \"sat\";\n        break;\n    case 7:\n        print\
    \ \"Sun\";\n        break;\n    default:\n        print \"Wrong Choice\";\n}\n\
    ?>\n```\n\n# 第 5 章：PHP 中的循环\n\n循环：它允许程序员执行一个可以重复的操作，直到给定的条件为真。\n\n### 1. While\n\
    - 最简单的 PHP 循环结构是 `while`，它具有如下语法：\n\n```php\nwhile (condition)\n{\n    Statement\n\
    }\n```\n\n- `while` 循环将 `condition` 表达式评估为布尔值——如果为真，它执行 `statement` 然后通过重新评估 `condition`\
    \ 开始循环。\n- 如果 `condition` 为假，`while` 循环终止。当然，和 `if` 一样，`statement` 可以是一个单独的语句，也可以是一个大括号的块。\n\
    \n#### 示例:-\n```php\n<?php\n$a=1;\nwhile ($a <= 10)\n{\n    print \"count is $a<BR>\"\
    ;\n    $a = $a + 1;\n}\n?>\n```\n\n### 2. do-while\n- `do-while` 结构与 `while` 相似，不同在于测试发生在循环的最后。\n\
    - 语法为：\n\n```php\ndo\n{\n    code to be executed;\n}\nwhile (condition);\n```\n\
    \n- 语句执行一次，然后评估表达式。\n- 如果表达式为真，则重复执行语句，直到表达式变为假。\n- 与 `while` 相比，`do-while` 不同在于它至少执行一次语句。\n\
    \n#### 示例:-\n```php\n<?php\n$a=1;\ndo\n{\n    print \"count is $a<BR>\";\n   \
    \ $a = $a + 1;\n}\nwhile ($a <= 10);\n?>\n```\n\n### 3. For\n- 最复杂的循环结构是 `for`，语法如下：\n\
    \n```php\nfor (initial; condition; increment)\n{\n    statement\n}\n```\n\n- `for`\
    \ 循环通过初始化表达式、测试条件和更新表达式来执行。\n- 如果 `condition` 为真，循环执行 `statement` 然后执行 `increment`。\n\
    - 如果 `condition` 为假，循环终止。\n- `for` 循环通常用于已知循环次数的场景。\n\n#### 示例:-\n```php\n<?php\n\
    for ($i=1; $i<=10; $i++)\n{\n    print \"count is $i<BR>\";\n}\n?>\n```\n\n###\
    \ 4. Foreach\n- `foreach` 循环用于遍历数组中的每个元素。\n- 语法如下：\n\n```php\nforeach (array as\
    \ value)\n{\n    statement\n}\n```\n\n- `foreach` 循环也可以遍历数组的键和值：\n\n```php\nforeach\
    \ (array as key => value)\n{\n    statement\n}\n```\n\n- `foreach` 循环在处理完数组所有元素后会自动停止。\n\
    \n#### 示例:-\n```php\n<?php\n$colors = array(\"red\", \"green\", \"blue\");\nforeach\
    \ ($colors as $color)\n{\n    echo \"$color<br>\";\n}\n?>\n```\n\n### 5. Break\
    \ 和 Continue\n- `break` 用于跳出整个循环。\n- `continue` 用于跳过当前迭代的剩余部分，直接进入下一次迭代。\n\n####\
    \ 示例 (Break):\n```php\n<?php\nfor ($i=0; $i<10; $i++)\n{\n    if ($i == 5) {\n\
    \        break;\n    }\n    echo $i<br>\";\n}\n?>\n```\n\n#### 示例 (Continue):\n\
    ```php\n<?php\nfor ($i=0; $i<10; $i++)\n{\n    if ($i == 5) {\n        continue;\n\
    \    }\n    echo $i<br>\";\n}\n?>\n```\n"
- fmt: "\nindex of 2 , and “pratik” has an index of 3 .\n\n### Accessing Array Elements\n\
    \nOnce you’ve created your array, how do you access the individual values inside\
    \ it? In fact, you do this in much the same way as you access the individual characters\
    \ within a string:\n\n```php\n$a = array( “Rahul”, “ravi”, “ajit”, “pratik” );\n\
    $b = $a[0]; // $myAuthor contains “Rahul”\n$c = $a[1]; // $anotherAuthor contains\
    \ “ravi”\n$a = array( “Rahul”, “ravi”, “ajit”, “pratik” );\n$pos = 2;\necho $a[$pos\
    \ + 1]; // Displays “ajit”\n```\n\n### Output an Entire Array with `print_r()`\n\
    \nYou can’t just print an array with `print()` or `echo()`, like you can with\
    \ regular variables, because these functions can work with only one value at a\
    \ time.\n\nHowever, PHP does give you a function called `print_r()` that you can\
    \ use to output the contents of an array for debugging.\n\nUsing `print_r()` is\
    \ easy — just pass it the array you want to output:\n\n```php\nprint_r($a);\n\
    ```\n\nThe following example code creates an indexed array and an associative\
    \ array, then displays both arrays:\n\n```php\n<?php\n$a = array( \"Rahul\", \"\
    ravi\", \"ajit\", \"pratik\" );\nprint_r ( $a );\n?>\n```\n\n### foreach loop\
    \ Constructs\n\n- There exists a `foreach` Constructs (command) that will apply\
    \ a set of statements for each value in an array.\n- It works only on arrays,\
    \ however, and will give you a big old error if you try to use it with another\
    \ type of variable.\n- Your syntax for the `foreach` command looks like this:\n\
    \n```php\nforeach ($array_variable as $value_variable)\n{\n    // .. do something\
    \ with the value in $value_variable\n}\n\nforeach ($array_variable as $key_var\
    \ => $value_var)\n{\n    // .. do something with $key_var and/or $value_var\n\
    }\n```\n\n#### Example:\n\n```html\n<html>\n<head>\n<title>For Each Constructs</title>\n\
    </head>\n<body>\n<?php\n$a[] = \"Rahul\";\n$a[] = \"Ravi\";\n$a[] = \"Pratik\"\
    ;\necho \"My Name -->\".'</br>';\nforeach ($a as $b)\n{\n    //these lines will\
    \ execute as long as there is a value in $a\n    echo $b.'</br>';\n}\n?>\n</body>\n\
    </html>\n```\n\n### In-Built Functions used with Arrays: `sort()` and `rsort()`\n\
    \n#### i. `sort()`\n\n- Sorts an array\n- **Definition and Usage**: The `sort()`\
    \ function sorts an array by the values.\n- This function assigns new keys for\
    \ the elements in the array. Existing keys will be removed.\n- This function returns\
    \ `TRUE` on success, or `FALSE` on failure.\n- **Syntax**: `sort(array,sorttype)`\n\
    \    - `Array`: Required. Specifies the array to sort.\n    - `Sorttype`: Optional.\
    \ Specifies how to sort the array values. Possible values:\n        - `SORT_REGULAR`\
    \ - Default. Treat values as they are (don't change types)\n        - `SORT_NUMERIC`\
    \ - Treat values numerically\n        - `SORT_STRING` - Treat values as strings\n\
    \        - `SORT_LOCALE_STRING` - Treat values as strings, based on local settings\n\
    - **Example**:\n\n```php\n<?php\n$animal = array(\"a\" => \"Dog\", \"b\" => \"\
    Cat\", \"c\" => \"Horse\");\nsort($animal);\nprint_r($animal);\n?>\n```\n\n- **Output**:\n\
    ```\nArray\n(\n    [0] => Cat\n    [1] => Dog\n    [2] => Horse\n)\n```\n\n####\
    \ ii. `rsort()`\n\n- Returns an array in the descending order\n- **Definition\
    \ and Usage**: The `rsort()` function returns an array in the descending order.\n\
    \    - `Array`: Required. Specifies an array.\n    - `Preserve`: Optional. Possible\
    \ values: `true` OR `false`. Specifies if the function should preserve the array's\
    \ keys or not.\n- **Example**:\n\n```php\n<?php\n$a=array(\"a\"=>\"Dog\",\"b\"\
    =>\"Cat\",\"c\"=>\"Horse\");\nprint_r(rsort($a));\n?>\n```\n\n- **Output**:\n\
    ```\nArray ( [c] => Horse [b] => Cat [a] => Dog )\n```\n\n## CHAPTER 7: USER-DEFINED\
    \ FUNCTIONS AND GLOBAL VARIABLES IN PHP\n\n#### 1 Function\n\nFunctions are most\
    \ useful when you will be using the code in more than one place, but they can\
    \ be helpful even in one-use situations, because they can make your code much\
    \ more readable.\n\n##### Syntax\n\n- Function definitions have the following\
    \ form:\n\n```php\nfunction function-name ($argument-1, $argument-2, ..)\n{\n\
    \    statement-1;\n    statement-2;\n    ...\n}\n```\n\n#### Example-1:\n\n```php\n\
    <?php\nfunction add($a, $b)\n{\n    $c=$a+$b;\n    echo \"Total-->\".$c;\n}\n\
    $x = 10;\n$y = 20;\nadd($x,$y);\n?>\n```\n\n#### Example-2 (Return A value):\n\
    \n```php\n<?php\nfunction add($a, $b)\n{\n    return $a+$b;\n}\n$x = 10;\n$y =\
    \ 20;\n$c=add($x,$y);\necho \"Total-->\".$c;\n?>\n```\n\n##### Formal parameters\
    \ versus actual parameters\n\n- In the preceding examples, the arguments we passed\
    \ to our functions happened to be variables, but this is not a requirement.\n\
    - The actual parameters (that is, the arguments in the function call) may be any\
    \ expression that evaluates to a value.\n- In our examples, we could have passed\
    \ numbers to our function calls rather than variables, as in: `add(10,20);`.\n\
    - Also, notice that in the examples we had a couple of cases where the actual\
    \ parameter variable had the same name as the formal parameter (for example, `$a`),\
    \ and we also had cases where the actual and formal names were different (`$x`\
    \ is not the same as `$a`).\n- As we will see in the next section, this name agreement\
    \ doesn’t matter either way—the names of a function’s formal parameters are completely\
    \ independent of the world outside the function, including the function call itself.\n\
    \n```php\n<?php\nfunction add($a, $b)\n{\n    $c=$a+$b;\n    echo \"Total-->\"\
    .$c;\n}\n$x = 10;\n$y = 20;\nadd($x,$y);\n?>\n```\n\n```php\n<?php\nfunction add($a,\
    \ $b)\n{\n    return $a+$b;\n}\n$x = 10;\n$y = 20;\n$c=add($x,$y);\necho \"Total-->\"\
    .$c;\n?>\n```\n\n##### Call-by-Value\n\n- The default behavior for PHP is call-by-value.\n\
    - This means that when you pass variables to function, PHP makes copies of the\
    \ variables.\n- This can be good or bad depending on whether you want to modify\
    \ the original.\n\n```php\n<?php\nfunction add($a, $b)\n{\n    $c=$a+$b;\n   \
    \ echo \"Total-->\".$c;\n}\nfunction sub($d, $e)\n{\n    $f=$d-$e;\n    echo \"\
    Sub-->\".$f;\n}\n$x=10;\n$y=20;\nadd($x,$y);\nsub($x,$y);\n?>\n```\n\n##### Call-by-Reference\n\
    \n- PHP offers two ways to have functions actually modify their arguments: in\
    \ the function definition and in the function call.\n\n```php\n<?php\nfunction\
    \ display(&$b1, &$b2)\n{\n    $b1 = 30;\n    $b2 = 40;\n}\n$a1=10;\n$a2=20;\n\
    display($a1,$a2);\necho $a1;\necho $a2;\n?>\n```\n\n##### Return Function\n\n\
    - Values are returned by using the `return` statement.\n- Any type may be returned,\
    \ including arrays and objects.\n- This causes the function to end its execution\
    \ and pass control back to the line from which it was called.\n- If called from\
    \ within a function, the `return()` function immediately ends execution of the\
    \ current function and returns its argument as the value of the function call.\n\
    \n```php\n<?php\nfunction sum($a, $b)\n{\n    $c=$a+$b;\n    return $c;\n}\n$x=10;\n\
    $y=20;\n$z=sum($x,$y);\necho $z;\n?>\n```\n\n##### Default arguments\n\n- To define\
    \ a function with default arguments, simply turn the formal parameter name into\
    \ an assignment expression.\n- If the actual call has fewer parameters than the\
    \ definition has formal parameters, PHP will match actual with formal until the\
    \ actual parameters are exhausted and then will use the default assignments to\
    \ fill in the rest.\n\n```php\n<?php\nfunction info($fname=\"rahul\",$lname=\"\
    patel\")\n{\n    echo $fname;\n    echo $lname.'</br>';\n}\ninfo();\ninfo(\"ravi\"\
    );\ninfo(\"ravi\",\"dave\");\n?>\n```\n"
