    ## 什么是函数？


    i) 函数是一段代码，它接收参数形式的一个或多个输入，进行某些处理并返回一个值。


    ii) 函数可以被反复使用。


    ## 函数有哪两种类型？


    i) 内置/系统定义函数

    ii) 用户定义函数


    ## 函数有什么用处？


    i) 函数可以被反复使用

    ii) 易于调试


