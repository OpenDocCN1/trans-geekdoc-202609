    ## CHAPTER 11: WORKING WITH DATABASES IN PHP\n\n### 1. Front-end and Back-end\n\
    Front-end refers to the user-interface(browser) and the back-end is the part that\
    \ stores the data\n\n### 2. PHP can connect to MySql using:\na. `MySQLi`\nb. `PDO`\n\
    \n### 3. PDO\na. It stands for PHP Data Objects\nb. `PDO` will work on 12 different\
    \ database systems, whereas `MySQLi` will only work with MySQL databases.\nc.\
    \ The `PDO_ODBC` driver enables to access ODBC databases via the `PDP` interface\
    \ (ODBC stands for Open Database Connectivity)\n\n### 4. MySQLi\na. `MySQLi` is\
    \ an improved version of the older PHP MySQL driver.\nb. The `MySQLi` extension\
    \ provides various benefits with respect to its predecessor:\ni. An object-oriented\
    \ interface\nii. Support for multiple statements\niii. Enhanced debugging support\n\
    \n### 5. Inbuilt Functions used for Database Connectivity\n\na. `mysqli_connect()`:\
    \ Opens a new connection to the MySQL server and Returns an object representing\
    \ the connection to the MySQL server.\nSyntax: `mysqli_connect(host,username,password,dbname,port,socket);`\n\
    \nb. `mysqli_connect_error()`: Returns a string that describes the error. NULL\
    \ if no error occurred.\n\nc. `mysqli_query()`: The `mysqli_query()` function\
    \ performs a query against the database.\nSyntax: `mysqli_query(connection,query,resultmode);`\n\
    \nd. `mysqli_fetch_assoc()`: The `mysqli_fetch_assoc()` function fetches a result\
    \ row as an associative array. NULL if there are no more rows in result-set.\n\
    \ne. `mysqli_close()`: The `mysqli_close()` function closes a previously opened\
    \ database connection and releases the memory resource.\n\n## Database Connectivity\
    \ Programs\n\nSample Database for the Example: MyGuests table\n\n### 1. Item table\
    \ Design view:\n```sql\nCREATE TABLE MyGuests (\nid INT,\nfirstname VARCHAR(30),\n\
    lastname VARCHAR(30),\nemail VARCHAR(50),\nreg_date DATE\n)\n```\n\n#### Program\
    \ 1. Open a Connection to MySQL\n```php\n<?php\n$servername = \"localhost\";\n\
    $username = \"username\";\n$password = \"password\";\n// Create connection\n$conn\
    \ = mysqli_connect($servername, $username, $password);\n// Check connection\n\
    if (!$conn) {\n    die(\"Connection failed: \" . mysqli_connect_error());\n}\n\
    echo \"Connected successfully\";\n?>\n```\n\n#### Program 2. Create a MySQL Database\
    \ Using MySQLi\n```php\n<?php\n$servername = \"localhost\";\n$username = \"username\"\
    ;\n$password = \"password\";\n// Create connection\n$conn = mysqli_connect($servername,\
    \ $username, $password);\n// Check connection\nif (!$conn) {\n    die(\"Connection\
    \ failed: \" . mysqli_connect_error());\n}\n// Create database\n$sql = \"CREATE\
    \ DATABASE myDB\";\nif (mysqli_query($conn, $sql)) {\n    echo \"Database created\
    \ successfully\";\n} else {\n    echo \"Error creating database: \" . mysqli_error($conn);\n\
    }\nmysqli_close($conn);\n?>\n```\n\n#### Program 3. Create a MySQL Table Using\
    \ MySQLi\nThe `CREATE TABLE` statement is used to create a table in MySQL. We\
    \ will create a table named \"MyGuests\", with five columns: \"id\", \"firstname\"\
    , \"lastname\", \"email\" and \"reg_date\":\n```php\n<?php\n$servername = \"localhost\"\
    ;\n$username = \"username\";\n$password = \"password\";\n$dbname = \"myDB\";\n\
    // Create connection\n$conn = mysqli_connect($servername, $username, $password,\
    \ $dbname);\n// Check connection\nif (!$conn) {\n    die(\"Connection failed:\
    \ \" . mysqli_connect_error());\n}\n// sql to create table\n$sql = \"CREATE TABLE\
    \ MyGuests (\nid INT, \nfirstname VARCHAR(30),\nlastname VARCHAR(30),\nemail VARCHAR(50),\n\
    reg_date DATE\n)\";\nif (mysqli_query($conn, $sql)) {\n    echo \"Table MyGuests\
    \ created successfully\";\n} else {\n    echo \"Error creating table: \" . mysqli_error($conn);\n\
    }\nmysqli_close($conn);\n?>\n```\n\n#### Program 4. Insert Data Into MySQL Using\
    \ MySQLi\n```php\n<?php\n$servername = \"localhost\";\n$username = \"username\"\
    ;\n$password = \"password\";\n$dbname = \"myDB\";\n// Create connection\n$conn\
    \ = mysqli_connect($servername, $username, $password, $dbname);\n// Check connection\n\
    if (!$conn) {\n    die(\"Connection failed: \" . mysqli_connect_error());\n}\n\
    $sql = \"INSERT INTO MyGuests (firstname, lastname, email)\nVALUES ('John', 'Doe',\
    \ 'john@example.com')\";\nif (mysqli_query($conn, $sql)) {\n    echo \"New record\
    \ created\";\n} else {\n    echo \"Error: \" . mysqli_error($conn);\n}\nmysqli_close($conn);\n\
    ?>\n```\n\n#### Program 5. Select Data With MySQLi\n```php\n<?php\n$servername\
    \ = \"localhost\";\n$username = \"username\";\n$password = \"password\";\n$dbname\
    \ = \"myDB\";\n// Create connection\n$conn = mysqli_connect($servername, $username,\
    \ $password, $dbname);\n// Check connection\nif (!$conn) {\n    die(\"Connection\
    \ failed: \" . mysqli_connect_error());\n}\n$sql = \"SELECT id, firstname, lastname\
    \ FROM MyGuests\";\n$result = mysqli_query($conn, $sql);\nif (mysqli_num_rows($result)\
    \ > 0) {\n    // output data of each row\n    while($row = mysqli_fetch_assoc($result))\
    \ {\n        echo \"id: \" . $row[\"id\"]. \" - Name: \" . $row[\"firstname\"\
    ]. \" \" . $row[\"lastname\"]. \"<br>\";\n    }\n} else {\n    echo \"0 results\"\
    ;\n}\nmysqli_close($conn);\n?>\n```\n\n#### Program 6. Delete Data From a MySQL\
    \ Table Using MySQLi\n```php\n<?php\n$servername = \"localhost\";\n$username =\
    \ \"username\";\n$password = \"password\";\n$dbname = \"myDB\";\n// Create connection\n\
    $conn = mysqli_connect($servername, $username, $password, $dbname);\n// Check\
    \ connection\nif (!$conn) {\n    die(\"Connection failed: \" . mysqli_connect_error());\n\
    }\n// sql to delete a record\n$sql = \"DELETE FROM MyGuests WHERE id=3\";\nif\
    \ (mysqli_query($conn, $sql)) {\n    echo \"Record deleted successfully\";\n}\
    \ else {\n    echo \"Error deleting record: \" . mysqli_error($conn);\n}\nmysqli_close($conn);\n\
    ?>\n```\n\n#### Program 7. Update Data In a MySQL Table Using MySQLi\n```php\n\
    <?php\n$servername = \"localhost\";\n$username = \"username\";\n$password = \"\
    password\";\n$dbname = \"myDB\";\n// Create connection\n$conn = mysqli_connect($servername,\
    \ $username, $password, $dbname);\n// Check connection\nif (!$conn) {\n    die(\"\
    Connection failed: \" . mysqli_connect_error());\n}\n$sql = \"UPDATE MyGuests\
    \ SET lastname='Doe' WHERE id=2\";\nif (mysqli_query($conn, $sql)) {\n    echo\
    \ \"Record updated successfully\";\n} else {\n    echo \"Error updating record:\
    \ \" . mysqli_error($conn);\n}\nmysqli_close($conn);\n?>\n```\n"
