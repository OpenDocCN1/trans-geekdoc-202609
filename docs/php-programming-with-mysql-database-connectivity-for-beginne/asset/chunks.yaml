    $myAge=17;\nPrint gettype($myAge);      // 返回 : Integer\n\n$age=(string) $myAge;\n\
    Print gettype($age);        // 返回 : String\n```\n\n# 第 2 章：PHP 中的运算符\n\n## 1.\
    \ 什么是表达式（Expression）？\ni) 表达式（Expression）是值、变量、运算符和函数的组合，结果产生一个值。\n\nii) 示例： `$Num=5+15/2;`\n\
    \n## 2. 什么是运算符（Operators）？\ni) 运算符（Operators）是字符（或字符集），在 PHP 代码中执行特殊操作的操作。\n\n\
    ii) 示例：`$ Num=5+15/2;`      // `=`, `+`, ` /` 是运算符。\n\n## 3. 解释 PHP 运算符的类型：\n\
    i) 赋值运算符\nii) 算术运算符\niii) 一元和二元运算符\niv) 复合赋值运算符\nv) 比较运算符\nvi) 逻辑运算符\nvii) 递增递减运算符\n\
    viii) 条件运算符\n\n## 4. 结合示例解释赋值运算符：\ni) 赋值运算符 `=` 用于给变量赋值。\nii) 示例： `$Num=7`\n\n\
    ## 5. 复合赋值\n赋值运算符可以与算术运算符结合创建复合运算符。\n例如 `+=`, `-=`, `/=`, `*=`, `%=`。复合赋值运算符允许编写更短的表达式。例如：\n\
    \n```php\n<?php\n    $i = 100;\n    $i = $i + 10;\n    echo $i;\n?>\n```\n\n可以写为：\n\
    \n```php\n<?php\n    $i = 100;\n    $i += 10;\n?>\n```\n\n## 6. PHP 中的字符串运算符有哪些？\n\
    i) 用于进行字符串拼接和追加操作的运算符。\nii) 字符串运算符列表：\niii) PHP 有两个专门为字符串设计的运算符。\n\n| 运算符 | 名称\
    \ | 示例 | 结果 |\n| --- | --- | --- | --- |\n| `.` | 拼接 | `$txt1 . $txt2` | `$txt1`\
    \ 和 `$txt2` 的拼接 |\n| `.=` | 拼接赋值 | `$txt1 .= $txt2` | 将 `$txt2` 追加到 `$txt1` |\n\
    \n## 7. 结合示例解释算术运算符：\ni) 这些是通用的数学运算符。\nii) 算术运算符列表：\n\n| 运算符 | 用途 |\n| --- | ---\
    \ |\n| `+` | 加法 |\n| `-` | 减法 |\n| `*` | 乘法 |\n| `/` | 除法 |\n| `%` | 取模 |\niii)\
    \ `/` 运算符返回商，`%`（模）返回除法余数。\n\n## 8. 结合示例解释一元运算符：\ni) 一元运算符只处理一个参数（通常是一个单一变量）。在\
    \ PHP 中，只有几个这样的运算符如下所示：\n\n| 运算符 | 用途 |\n| --- | --- |\n| `!` | 取反 |\n| `++` |\
    \ 增 1 |\n| `--` | 递减 1 |\n\nii) 下面这些运算符的一些用法示例。\n\n```php\n<?php\n// 取反\n$bool\
    \ = true;\n$bool = !$bool;   // $bool 现在将为 false\n$k = 0;  // 将 k 的值初始化为 0\n//\
    \ 增 1\n$k++;\necho \"k = \".$k;  // 输出: k = 1\n// 减 1\n$k--;\necho \"k = \".$k;\
    \  // 输出: k = 0\n?>\n```\n\n## 9. 结合示例解释二元运算符：\ni) 二元运算符处理两个参数的运算符，两者都是变量或常量。PHP\
    \ 中发现的一些二元运算符示例：\n\n| 运算符 | 用途 |\n| --- | --- |\n| `+` | 加法 |\n| `-` | 减法 |\n\
    | `*` | 乘法 |\n| `/` | 除法 |\n| `%` | 取模 |\n| `=` | 赋值 |\n| `==` | 等于 |\n| `>` |\
    \ 大 |\n| `<` | 小 |\n| `&&` | 与 |\n| `||` | 或 |\n\nii) 这些运算符是 PHP 中最直观的运算符。它们非常容易理解，因为我们在学校里都见过它们。例如，看下这段代码：\n\
    \n```php\n<?php\n$a = 5;\n$b = 6;\n$c = $a + $b;\n?>\n```\n\n## 10. PHP 中的比较运算符有哪些？\n\
    i) 用于进行比较并返回真（true）或假（False）的运算符。\nii) PHP 比较运算符列表：\n\n| 运算符 | 名称 | 示例 | 结果 |\n\
    | --- | --- | --- | --- |\n| `==` | 等 |x == $y` | 如果 `$x` 等于 `$y` 则返回 true |\n\
    | `===` | 相同 | `$x === $y` | 如果 `$x` 等于 `$y` 且类型相同则返回 true |\n| `!=` | 不等于 | `$x\
    \ != $y` | 如果 `$x` 不等于 `$y` 则返回 true |\n| `>` | 大 | `$x > $y` | 如果 `$x` 大于 `$y`\
    \ 则返回 true |\n| `<` | 小 | `$x < $y` | 如果 `$x` 小于 `$y` 则返回 true |\n| `&&` | 与 |\
    \ `$x && $y` | 如果 `$x` 和 `$y` 都为真则返回 true |\n| `||` | 或 | `$x || $y` | 如果 `$x`\
    \ 或 `$y` 任意一个为真则返回 true |\n\n*(注：原文表格中第 10 部分存在逻辑混乱和重复，译文已根据标准逻辑修正对齐，保持格式一致)*\n\
    \n## 11. 逻辑运算符有哪些？\ni) 用于进行逻辑操作并返回真或假。\nii) 它们被称为布尔运算符。\niii) 逻辑运算符列表：\n\n| 运算符\
    \ | 名称 | 示例 | 结果 |\n| --- | --- | --- | --- |\n| `and` | 与 | | 如果两者为真 |\n| `or`\
    \ | 或 | | 如果一个为真 |\n| `&&` | 与 | `$x && $y` | 如果 `$x` 和 `$y` 都为真 |\n| `||` | 或\
    \ | `$x || $y` | 如果 `$x` 或 `$y` 任意一个为真 |\n| `!` | 取反 | `!$x` | 如果 `$x` 为假则取反 |\n\
    \n## 12. 递增递减运算符有哪些？\ni) 递增运算符用于增加值。\nii) 递减运算符用于减少值。\n\n| 运算符 | 名称 | 描述 |\n|\
    \ --- | --- | --- |\n| `++` | 递增 | `$x++` 或 `++$x` 增 1 |\n| `--` | 递减 | `$x--`\
    \ 或 `--$x` 递减 1 |\n\n## 13. 条件运算符有哪些？\ni) 三元运算符（条件运算符）用于简写表达式。\nii) 语法：`条件?表达式\
    \ 1:表达式 2`\niii) 示例：\n\n```php\n$x=10;\n$y=15;\n$z=($x > $y) ? \"真\" : \"假\";\n\
    echo $z;\n```\n\n"
