    \ including arrays and objects. \n\n This causes the function to end its execution\
    \ immediately and pass control back to the line from which it was called. \n\n\
     If called from within a function, the return() function immediately ends execution\
    \ of the current function, and returns its argument as the value of the function\
    \ call.\n\nExample:- \n\n<?php\n\n function sum($a,$b) \n\n { \n\n $c=$a+$b; \n\
    \n return $c; \n\n } \n\n $x=10; \n\n $y=20; \n\n $z=sum($x,$y); \n\n echo $z;\
