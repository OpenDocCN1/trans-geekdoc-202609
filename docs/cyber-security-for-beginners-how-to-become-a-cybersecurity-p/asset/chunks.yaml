- raw: "The virus remains dormant until the infected file is executed, at which point\
    \ the virus's code is executed. The virus's primary goal is to cause havoc. It\
    \ accomplishes this by corrupting files, including system files, so that the underlying\
    \ operating system does not function properly. Spyware Another type of malware\
    \ is spyware. Spyware, as the name suggests, is designed to run on a victim's\
    \ computer and steal sensitive information. Spyware can take the form of a key\
    \ logger, which records each keystroke. If a victim visits a banking website and\
    \ then logs in, the attacker will be able to see the keystrokes to determine which\
    \ banking website the user was visiting, as well as the username and password.\
    \ Spyware can also find credit card numbers, browsing habits, and pretty much\
    \ anything else that a victim does on the computer.\n\n# Chapter 10\n\n# Trojan\
    \ & Ransomware\n\n# ![Ransomware Attacks and Types | How do Locky, Petya and other\
    \ ransomware differ?](image.016.jpeg)\n\nA trojan is another type of malware that\
    \ is designed to cause serious harm. Trojans frequently do not appear to be malicious\
    \ software, but they, like any other malware, contain code that is designed to\
    \ perform a specific task. Trojans, unlike viruses, cannot replicate themselves.\
    \ They must be set up by the user. A backdoor Trojan is a common type of Trojan\
    \ that is designed to give the attacker access to the infected computer, allowing\
    \ them to do whatever they want with it. They can add the lead, or even send and\
    \ receive various files, or perhaps the Trojan's sole purpose is to annoy the\
    \ user by displaying AD pop-ups or simply changing the desktop background. The\
    \ attacker can also take control of multiple machines and use them to attack other\
    \ victims. In a Distributed Denial of Service attack, the attacker can have all\
    \ infected computers attempt to bring down a system. In the following chapter,\
    \ we will discuss Denial of Service and Distributed Denial of Service attacks.\
    \ \n\nRansomware A specific type of Trojan is designed to infect a user's computer\
    \ and render it inoperable. The only way for the victim to gain access to their\
    \ computer and files is to pay the attacker a fee. This type of Trojan is known\
    \ as ransomware because the attacker demands that the victim pay a ransom.\n\n\
    # Chapter 11 \n\n# Rootkits & Worms\n\n# ![Rootkit definition. How to remove it\
    \ \U0001F4CC](image.017.png)\n\n## Rootkits are another type of malware. \n\n\
    RootKits are designed to perform many of the same malicious actions as some of\
    \ the other malware we've discussed. The most significant distinction is that\
    \ rootkits are specifically designed to avoid detection by traditional antimalware\
    \ software.\n\nThey can accomplish this by inserting themselves into the computer's\
    \ kernel, which is the same level as the host operating system. This gives attackers\
    \ complete control of the computer, including the ability to overwrite or delete\
    \ operating system files.\n\n## Worms\n\n## ![2,913 Computer Worm Stock Photos,\
    \ Pictures & Royalty-Free Images - iStock](image.018.jpeg)\n\nWorms are a type\
    \ of malware that is distinct from viruses. \n\nThey replicate themselves in the\
    \ same way that viruses do, but they are not attached to another program and do\
    \ not require the user or host program to help spread the worm.\n\nWorms exploit\
    \ a vulnerability in the target system in order to spread from system to system.\
    \ This is why it is critical to keep operating systems and software up to date.\n\
    \n## Adware\n\n## ![What is Adware And How Can I Get Rid Of It? | by AdBlock |\
    \ AdBlock's Blog](image.019.png)\n\nAnother type of malware is adware, which generates\
    \ revenue by displaying advertisements on an infected machine. The malware's creator\
    \ earns money by displaying advertisements or using a pay-per-click model.\n\n\
    Malware will almost certainly evolve alongside computer and network systems as\
    \ they continue to evolve. This is why it is more important than ever to ensure\
    \ that you, as a security engineer, are up to date on the various types of threats\
    \ that exist, as well as how to mitigate them.\n\n# Chapter 12\n\n# DoS Attacks\n\
    \n# ![What Is a Distributed Denial of Service (DDoS) Attack?](image.020.png)\n\
    \nNumerous threats are not specifically malware.\n\nWe will discuss Denial of\
    \ Service and Distributed Denial of Service attacks, as well as man-in-the-middle\
    \ attacks, in this chapter.\n\n## Denial of Service (DoS) attack\n\nA Denial of\
    \ Service (DoS) attack occurs when a system's services are rendered inoperable\
    \ to legitimate users. A system could be a web server, an email server, or any\
    \ other service that is dependent on a computer or a network of computers.\n\n\
    A malicious attacker must send so much traffic that the service's server does\
    \ not have enough resources to respond to every piece of traffic to effectively\
    \ orchestrate a DoS attack.\n\nThis could be accomplished by sending a large number\
    \ of ICMP messages, messages that attempt to initiate but never complete the three-way\
    \ handshake, UDP messages, or any other type of message that the service is designed\
    \ to respond to under normal conditions.\n\nWhen a system or service becomes overburdened,\
    \ it is unable to process any incoming legitimate requests, and users are denied\
    \ access to the service.\n\nAttack on Distributed Denial of Service (DDoS)\n\n\
    A Distributed Denial of Service (DDoS) attack occurs when multiple machines collaborate\
    \ to attack a service.\n\nThe attacker can command malware-infected machines to\
    \ send various types of messages to the intended victim of the DDoS attack.\n\n\
    # Chapter 13\n\n# Man-in-the-middle attacks\n\n# ![Executing a Man-in-the-Middle\
    \ Attack in just 15 Minutes - Hashed Out](image.021.png)\n\nWhen someone intercepts\
    \ traffic between two otherwise normal systems, this is referred to as a man-in-the-middle\
    \ attack. For example, if a malicious attacker intercepted traffic between a client\
    \ and a server, they would be able to see the entire contents of the traffic.\
    \ A man-in-the-middle attack intercepts the client's initial request to the server,\
    \ then copies that message and sends it to the original server. The server then\
    \ responds to the man-in-the-middle with its return message. Once again, the man-in-the-middle\
    \ copies the traffic and then replies to the client with the copy. The man-in-the-middle\
    \ can repeat this process throughout the entire conversation between the client\
    \ and the server. Both the client and the server believe they are conversing with\
    \ each other, unaware that there is a device in the middle that can see the entire\
    \ conversation. Furthermore, a man-in-the-middle attacker with the right tools\
    \ could inject whatever they wanted into the communication between the client\
    \ and the server. So they can not only read the contents of the conversation but\
    \ also manipulate it in any way they want. The threats discussed in previous chapters,\
    \ such as SQL injection and cross-site scripting, can also be used to wreak havoc\
    \ on devices located both on-premises and in the cloud.\n\n# CHapter 14 \n\n#\
    \ Social Engineering and Phishing Attacks\n\n# ![What is phishing attacks ❓ Types\
    \ and business impact | Wallarm](image.022.jpeg)"
