    我们将在 VPN 中使用哈希机制来确保数据完整性。哈希算法可用于创建哈希机制。我们有 MD5（Message Digest 5）和 SHA（Secure Hash
    Algorithm，也称为 SHA-1 或 SHA-256）。


    基本上，我们对数据包进行哈希处理，然后附加哈希，就像称重箱子一样，然后将其发送到另一端，另一端将对数据包自行进行哈希处理。


    他们将通过哈希算法（例如 SHA）运行它，然后生成一个哈希（只是某个哈希），并将该哈希与发送的哈希进行比较。如果哈希匹配，我们知道它基本上重量相同，我们就可以接受它。这就是
    VPN 如何帮助我维护数据完整性。


    我们将介绍的第三点是，VPN 应为我提供数据源身份验证。我们可以使用预共享密钥来提供数据源身份验证。


    我们将简单地使用 PSK（预共享密钥）或数字证书，数字证书类似于从 DMV 获取驾驶执照，因此由受信任的第三方进行身份验证。


    例如，如果您去 DMV 并填写您的信息，他们将向您颁发驾驶执照。如果您被拦下，您可以向他们出示驾驶执照，警察会信任它，因为它由受信任的来源（DMV）颁发，并且它对您进行身份验证。


    我们可以用数字证书实现相同的结果。我们可以与 CA 服务器（例如 Verisign、Entrust 或 GoDaddy）注册，获取证书，然后将该证书出示给我们希望建立
    VPN 的对方。


    他们可以看到谁颁发了证书，从而信任他们。


    由于您的证书已由他们签名，我将接受它。因此，他们可以以这种方式使用证书进行源身份验证。


    作为替代方案，我们可以使用预共享密钥。基本上，我在发送数据之前先将其与预共享密钥进行哈希处理。我们也与他们共享了该密钥，我们是离线完成的，他们可以比较哈希值；如果匹配，我们将进行通信。


    这些是我们想要了解的关于 VPN 的三件事：机密性、数据完整性和数据源身份验证。VPN 还可以提供抗重放保护，它们通常也会提供。至于如何实现，没什么可说的。


    它内置于协议中，以及 iOS 和 Cisco ASA 防火墙中，它们会自动执行，但这些是我们在配置中将控制的三个部分。我们已经讨论了导致很多这些问题的原因。我们已经讨论了加密协议和哈希算法。到目前为止，我们讨论了
    AES、3DES、MD5 和 SHA，但还有更多内容，所以让我们回顾一些额外的术语。


    首先，考虑如何交换加密密钥。但是，有一个名为 ISAKMP 的协议。它被称为 Internet Security Association Key Management
    Protocol。我们简单地称其为 ISAKMP，许多人称其为 IKE（Internet Key Exchange），这是 ISAKMP 的一个组件。


    ISAKMP 提供 IKE（Internet Key Exchange）和 Oakley，还有几个位于 ISAKMP 下方的其他协议，但我们将它们全部归为一类。ISAKMP
    将为我们协商一个安全通道并提前交换我们的密钥。


    这些安全加密密钥可以使用 Diffie-Hellman 算法（缩写为 DH）生成。Diffie-Hellman 算法生成一个不在线路上交换的密钥，但最终，我们在两台设备上都有这些密钥，它们可以用于加密和解密，即对称密钥，并且我们没有在线路上发送这些密钥，这是一件好事。


    因此，当我们建立连接时，我们创建一个称为安全关联（Security Association）的东西。安全关联本质上是我的路由器上的一个条目，列出了我正在与谁通信、我正在使用哪些算法以及我可以使用哪些密钥。因此，在设备之间可以相互通信之前，两台设备都将拥有一个
    SA（Security Association）。


    当我们开始发送数据包时，它们将使用 ESP、AH 或两者来构建，但一般来说，我们现在只会使用 ESP。ESP 代表 Encapsulating Security
    Payload，我们可以在两种模式下使用它：隧道模式和传输模式。当我们在隧道模式下使用 ESP 时，我们有一个私有 IP 地址，它被隧道在公共地址内部。


    这就是 ESP 协议的高级概述。它是 IPsec 协议套件的一部分。如果我们查看 ESP 头部，可以看到它有一个安全参数索引编号。它将有一个安全参数索引编号，该编号将其链接到安全关联。我们将从序列号开始，然后是加密的有效载荷、一些填充，最后是完整性检查。


    其中包含的有效载荷数据是已加密的原始 IP 数据包。我们在隧道模式下加密数据并在其上添加 ESP 头部。该 ESP 头部将为我提供有关安全参数、索引等的信息。


    '
