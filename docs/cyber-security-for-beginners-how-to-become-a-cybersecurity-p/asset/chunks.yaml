    # Chapter 17


    # Security Intelligence Basics


    # ![A Brief Overview of Threat Intelligence](image.025.jpeg)


    We have already learned about various threats that can affect both on-premises
    and cloud-hosted environments. We also discussed social engineering and phishing
    attacks, so in the following chapters, we will discuss security intelligence fundamentals.
    First, we''ll go over a quick overview of what security intelligence is, and then
    you''ll learn about the various components that make security intelligence so
    effective. Finally, you will learn about Cisco Talos, which is Cisco''s solution
    for security intelligence. As we''ve seen in previous chapters, numerous threats
    can impact an enterprise network. As time goes on, it is almost certain that new
    types of attacks will emerge that do not exist today.


