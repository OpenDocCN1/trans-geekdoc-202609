    有各种各样的威胁你应该了解，以及如何缓解它们。


    可以手动完成，也可以使用安全设备或 API 自动完成。


    本书将教你这些威胁以及如何缓解它们，无论是通过安全情报还是自动化。


    我们将涵盖的一些主要主题包括：无论设备是在本地还是在云端，都可能影响组织的威胁类型，什么是安全情报以及我们有哪些解决方案，以及如何使用 API 与某些安全设备进行交互。


    读完第 1 本书后，你将了解如何识别网络威胁，并使用业内最好的一些安全工具来缓解它们。


    本书将涵盖各种通常针对组织 IT 基础设施的安全威胁。


    如果你正在阅读此书，欢迎你开始了解这些威胁以及我们可以提供的解决方案之旅。


    如果你想担任网络或安全管理员，这本书就是为你准备的。


    如果你在 IT 行业工作，或者想在 IT 行业转型，这本书将教你应该了解的安全威胁。


    虽然你不需要是职业计算机程序员，但强烈建议具备基本的网络知识。


    假设你是一名网络工程师，CIO（首席信息官）已指派你学习可能影响贵公司网络的各种威胁。


    无论设备是在本地还是在云端。


    因为贵公司正在考虑使用安全情报解决方案来帮助防范这些威胁，你已被指派学习其工作原理。


    接下来的章节将向你介绍可能影响贵公司 IT 网络的各种威胁。


    首先，我将通过讨论影响本地环境的各种威胁以及影响云环境的威胁来扩展这些知识。


    此外，我将讨论社会工程学和网络钓鱼如何对公司和个人产生重大影响。


    # Chapter 1


    # 软件缺陷与缓冲区溢出


    # ![Types of Bugs in Software Testing: 3 Classifications with Examples](img/image.001.png)


    我首先想与你讨论的漏洞是软件缺陷。软件缺陷只是计算机程序中的一个缺陷。这会导致程序出现意外行为。这可能只是软件逻辑中的一个缺陷。


    ## 计算错误


    例如，假设一个 Excel 电子表格应该获取两个单元格的内容，将它们相加，并将结果存储在第三个单元格中，但它却将数值相加而不是相乘。当你将它们组合时，会得到意外结果。这被称为计算错误。


    第三个单元格应该包含你预期的结果。即前两个单元格的乘积，因为应用程序没有按预期执行。这就是一个缺陷的示例，正如编写它的人所意图的那样。


    ## 缓冲区溢出


    缓冲区溢出是另一种类型的软件缺陷。缓冲区被定义为为特定数量的数据预留的一块内存。如果数据量大于缓冲区的容量，就会发生缓冲区溢出。


    ![What is a Buffer Overflow | Attack Types and Prevention Methods | Imperva](img/image.002.png)


    ## 内存缓冲区的容量


    表单是一个在计算机之外发生这种情况的示例，你可能在表单上提供过信息，例如你的姓名和地址，表单上有几排方框。填写这些表单时，你只应填写空白处。每个方框应包含一个字母或一个数字。如果你碰巧拥有一个比表单设计者预留空间更长的姓氏。


    例如，在填写表单时，你会超出为姓氏预留的空间。这会产生歧义。把名字放在哪里才是合适的？你觉得呢？


    留出一个空格继续？如果那样太慢怎么办？侵占下一个方框的空间？读表单的人会怎么做？我相信你本意是写在另一部分的方框上。


    同样，当计算机软件写入内存时。除了栈，软件还使用缓冲区来存储各种数据。在内存中，这些缓冲区相互紧邻。因此，如果每个缓冲区包含多个不同的值，并且每个缓冲区都有一个固定数量的位用于保存数据，类似于一个包含特定数量方框的表单，用于姓氏、地址等，如果存在这样的表单的话。放入缓冲区的数据超过其容量时，后续缓冲区中的数据可能会被覆盖。你可能会想，“了解这些琐碎的事情（例如电子表格无法正常工作，或数据大于为其预留的缓冲区）对我有什么重要性？”确实，在大多数情况下，软件缺陷最坏的结果是引起沮丧，而且大多数时候，缺陷完全不被察觉。


    ![Buffer Memory and the Difference in Buffer and Cache](img/image.003.jpeg)


    但是，你应该意识到恶意攻击者可以利用这些缺陷。这些缺陷被用来操纵程序，使其执行攻击者想要的操作。与程序无法正常运行（即其设计应执行的操作）造成的小麻烦不同，熟练的攻击者可以利用其对缺陷的了解，并以对其有利的方式加以利用。例如，熟练的攻击者可以利用缓冲区溢出获取原本无法获得的信息。他们甚至能够覆盖原始数据，使其不再包含相同的信息，或者他们可以利用缓冲区溢出导致运行该软件的主机崩溃，从而导致拒绝服务（DoS）攻击。


    ![What is a denial-of-service (DoS) attack? | Cloudflare](img/image.004.png)


    # Chapter 2


    # 弱密码


    # ![Weak Passwords Are A Gift To Hackers - Teamstack Blog](img/image.005.png)


    密码用于限制对敏感数据的访问，只有特定的人或程序才应有权访问。密码要有效，必须满足某些标准。其中一个要求是密码必须强。密码必须既复杂又长才能被视为强密码。密码越长，暴力破解攻击就越难破解。


    密码曾经只需要八个字符长就被认为是安全的。根据研究，至少需要 12 或 16 个字符。密码复杂性也很重要。正如每增加一个字符会使密码更安全一样，增加可用字符的类型会使密码破解程序更难获得最终密码。例如，如果你创建一个八个字符长且仅包含大写和小写字母的密码，则有超过
    53 万亿种可能的密码组合。当添加 0 到 9 等数字字符时，每个字符现在有 62 个选项，使可能的组合总数超过 218 万亿。最后，允许特殊字符将每个字符的选项数增加到
    74 个，使你的 8 个字符密码达到近 900 万亿个选项。虽然所有这些数字看起来都非常大，以至于破解需要一千年，但事实是，即使有近 900 万亿种组合，当今的计算机也只需要
    2 个半小时就能破解。


    '
