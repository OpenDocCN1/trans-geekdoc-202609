    \ The content used by the attacker to gain the victim's trust would be tailored\
    \ to target upper management. clone Phishing\n\nA clone phishing attack occurs\
    \ when an attacker duplicates an otherwise legitimate service or company to impersonate\
    \ them.\n\nContinuing with our impersonation of the title company, the attacker\
    \ may have made a copy of a legitimate wire transfer form and then edited it to\
    \ look almost identical except the updated router number.\n\nIf the attacker sends\
    \ the victim the new form and then calls the victim to say they made a mistake\
