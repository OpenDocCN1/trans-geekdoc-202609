- raw: 'Once reported to the IT Department, engineers should have enough time to analyze
    the logs and figure out what happened, but they won''t find anything other than
    normal traffic flow. However, if everyone disconnects from the same wireless network
    at the same or similar time, this raises suspicion. Still, it would be difficult
    to determine what exactly occurred and where the traffic initiation of several
    de-authentication requests originated.


    # Chapter 23


    # Wireless Collision Attack


    # ![Wireless Attacks Unleashed - Infosec Resources](image.031.png)


    Wireless collisions are common and can be unintentionally caused by devices such
    as cordless phones and microwaves that cause interference, weakening wireless
    signals for existing trusted connected devices.


    Wireless access points use various channels to send signals through the air. For
    example, if you live in a flat, your neighbor''s wireless access point may cause
    wireless interference to your home connection.


    Access points have a signal range of 30-50 meters, but some Ap-s designed for
    enterprise use can transmit wireless signals up to 600 meters if there is no interference
    and no obstruction within reach.


    When wireless signals encounter obstacles such as windows, doors, walls, and thicker
    objects, their quality begins to deteriorate. Weak wireless signals are common
    in flats, especially if you have multiple neighbors leaving nearby.


    I already mentioned that you can configure Kali Linux to provide stronger wireless
    signals, as well as monitor and identify wireless SSIDs, wireless access points
    in range, and the channel on which they operate.


    Hackers frequently configure their Kali Linux to use the same channels as the
    victims'' AP-s, causing significant wireless interference, causing the victim''s
    network to become not only slow but in some cases completely useless.


    By continuously increasing wireless signals, packets would eventually be dropped,
    and most, if not all, clients would be unable to connect to the wireless network.
    Taking this a step further, hackers install Kali on a Raspberry Pi and hide it
    near the targeted wireless access point to cause even worse wireless signals.


    In some cases, hackers attach a Raspberry Pi pre-configured to run Kali Linux
    to a Drone and land it on the targeted building. When a sophisticated wireless
    collision attack is used, wireless signals can be severely weakened, affecting
    multiple SSIDs and even multiple APs. Clients would drop off the wireless network
    as a result of Wireless Collision Attacks.


    # Chapter 24


    # Wireless Replay attacks


    # ![Cyber Attacks | Network Attacks | Threats | Vulnerabilities ⋆ IpCisco](image.032.png)


    Wireless Replay attacks have fallen out of favor, but they were once very common.
    At the same time, wireless replay attacks continue to be used on wireless networks
    for a variety of reasons.


    Capturing wireless signals is simple, especially since they are all around us.
    Before connecting to a wireless network, a hacker must first monitor the wireless
    signals.


    Wireshark software can be used to record wireless traffic while monitoring it.
    Wireshark is packet analysis software that network engineers frequently use to
    troubleshoot wired and wireless network issues.


    Wireshark can assist in further analyzing captured traffic and understanding what
    type of communication is taking place on the wireless network. A hacker would
    specifically examine packets associated with the client authentication process
    to a specific SSID.


    This packet would validate the password used to connect to the wireless access
    point. Once the hacker has access to the data, he can use it to send the same
    message over the air to the AP. As a result, the access point would authenticate
    and authorize the hacker to connect to the network on the assumption that it is
    a known trusted device.


    Because most large corporations are already implementing new security practices
    for better encryption, Wireless Replay attacks are not as common as they once
    were. However, not all organizations use strong encryption techniques, and many
    businesses could be exploited by employing this antiquated method.


    # Chapter 25


    # Protecting wireless networks


    # ![Secure Wireless Network](image.033.png)


    Because infrastructure security is critical, most large companies already have
    good security in places, such as Cisco Identity Service Engine (ISE), Cisco, Checkpoint,
    or Palo Alto Firewalls, and some sort of Intrusion Prevention System (APS) and
    Intrusion Detection System (IDS) such as Cisco FirePower.


    Most businesses prefer to have two types of firewalls, just in case one of them
    is compromised.


    Intrusion Detection Systems are also well-known for wireless security and are
    excellent at detecting network anomalies. Engineers and security professionals
    will be notified via e-mail once anomalies are discovered. One thing to keep in
    mind is that IDS-s are only very good at identifying or detecting anomalies, not
    stopping them.


    This is where Intrusion Prevention Systems come in, as they can prevent or mitigate
    such wireless attacks. The issue with intrusion detection systems is that, while
    they are effective at preventing hacks, they are not very effective at detecting
    them. As a result, having both devices and virtual appliances IPS-s and IDS-s
    is a good practice.


    The majority of Wireless Access Points are Power over Ethernet devices and thus
    are connected to network switches. Additional commands must be implemented on
    network switches if a hacker attempts to connect to the network via wired or wireless
    connections.


    Wireless network security is critical, and if you have a personal wireless network
    at home, you are most likely using a protocol like WPA-Personal or WPA-PSK. PSK
    is an abbreviation for Pre-shared Key, which is a password required to connect
    to a wireless network.


    A pre-shared key can be compromised using a variety of techniques, including a
    brute-force attack or a dictionary attack. Brute-force and dictionary attacks
    are both relatively simple tasks to carry out, especially with Kali Linux.


    Running these tools requires only a few clicks, and once started, they will begin
    the job of locating the password or Pre-shared Key.


    Pre-shared keys should contain both uppercase and lowercase letters, numbers,
    and various symbols, as well as at least 12 characters. The more complex your
    password, the more difficult it is for a hacker to crack.


    Furthermore, your password should not be associated with you. Please refrain from
    using your name, date of birth, or any names that belong to family members.


    Most people use passwords that are simple to remember. Of course, the bad guys
    are aware of this, and by using social networking sites, they can easily crack
    passwords related to individuals.


    Brute-force or dictionary attacks can crack passwords, and even if it takes days,
    they will eventually be broken. This is one of the primary reasons why companies
    implement password policies such as password complexity and requiring users to
    change passwords regularly. These are standard practices, and if they have not
    yet been implemented in your organization, you should bring them to the attention
    of your manager.


    # Bonus Chapter VPN Concepts


    ![How a VPN (Virtual Private Network) Works | HowStuffWorks](image.034.jpeg)


    What do you consider a VPN to be? If I said to you, "Hey, we''re setting up a
    VPN," what would you think or how would you define it? So, here''s how some of
    us have defined it.


    First and foremost, VPN stands for Virtual Private Networking. Let''s get back
    to the virtual part of things. Let us instead begin with private networking.


    Private networking implies that I can network and send data and other such things
    while remaining private, correct? There''s an assumption that whatever I send
    over the network is private to me, so the virtual part comes in here: my network
    is private, but it''s a virtual network.'
