    \ wire transfer website, where the attacker owns both the fake wire transfer site\
    \ and the title company subdomain. This means that any information provided to\
    \ the title company's subdomain can be retrieved by the attacker.\n\n## Website\
    \ forgery\n\nPhishing attacks can also make use of website forgery. This involves\
