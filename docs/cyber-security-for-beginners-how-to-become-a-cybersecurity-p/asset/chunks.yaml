    Another type of attack that has been on the rise in recent years is known as a
    social engineering attack. When there is a perceived trust between the attacker
    and another party, this is an example of social engineering. The party could be
    the victim or a third-party, such as an internet service provider or email provider.
    Also, if the attacker can gain the provider''s trust and persuade them that they
    are the victim''s identity, the service provider may reveal confidential information
    that should only be disclosed to the victim, such as an account name and password.
    Once the attacker has this information, they can use it to obtain additional information
    or even change the service to prevent the victim from using it. If the attacker
    has completed social engineering attacks directly with the victim, they are convincing
    the victim that they are a trusted authority. There are several methods that attackers
    can use to gather enough information to gain the victim''s trust. In today''s
    world, using social media and other online profiles of the victim is a common
    method. Regardless of the method used to collect information, once trust is established,
    the attacker can use it to persuade the victim that all correspondence is legitimate.
    This means they can send emails with malicious links. If the user believes the
    email is legitimate, they are much more likely to click on the link.


    The email does not even have to contain a malicious file. Assume the attacker
    learned that the victim was buying a house and needed to send a large wire transfer
    for the down payment. Normally, the funds are transferred to a title company.
    If the attacker uses social engineering to convince the victim that they are the
    title company, they may provide an incorrect banking number, causing the victim
    to send money to the attacker rather than the legitimate title company.


    ## Bulk Phishing


    Phishing is a common method for launching a social engineering attack. Phishing
    is the use of electronic communications to gain the trust of an unsuspecting user.


    There are several types of phishing. Bulk phishing occurs when no specific individual
    or organization is targeted; instead, the attacker will launch a phishing campaign
    and target as many people as possible to gain as many victims as possible who
    fall for the phishing attempt. Phishing is a type of fraud. When an attacker attempts
    to target a specific individual or organization, this is referred to as spear
    phishing. To increase their chances of success, the attacker will conduct research
    and gather as much information about their intended target as possible. The earlier
    example of the attacker impersonating a title company is an example of a spear-phishing
    attack. The attacker was aware that the victim was planning to purchase a home
    and was most likely aware of the title company that the victim intended to use.
    Again, having this information gave the attacker a better chance of success because
    they would know information that the victim believes only a legitimate person
    or company would know.


    ## Whaling


    Whaling is a subset of spear phishing that attempts to target senior executives
    and other high-profile targets. The content used by the attacker to gain the victim''s
    trust would be tailored to target upper management.


    ## Clone Phishing


    A clone phishing attack occurs when an attacker duplicates an otherwise legitimate
    service or company to impersonate them.


    Continuing with our impersonation of the title company, the attacker may have
    made a copy of a legitimate wire transfer form and then edited it to look almost
    identical except the updated router number.


    If the attacker sends the victim the new form and then calls the victim to say
    they made a mistake on the original document and should use the one provided by
    the attacker, this is an example of clone phishing.


    As I mentioned earlier, phishing attempts use a variety of techniques to trick
    their victims into clicking on malicious content. For example, link manipulation
    is commonly used to make links appear to go to a legitimate organization but go
    to a malicious site or destination.


    Sometimes the domain link contains misspellings of the website that the attacker
    is pretending to represent. Another example would be to create a website with
    a legitimate-looking subdomain.


    For example, some users may believe that the site will take the victim to the
    title company''s updated wire transfer section. When, in reality, it takes them
    to the title company''s subdomain of the updated wire transfer website, where
    the attacker owns both the fake wire transfer site and the title company subdomain.
    This means that any information provided to the title company''s subdomain can
    be retrieved by the attacker.


    ## Website forgery


    Phishing attacks can also make use of website forgery. This involves using JavaScript
    to make the address bar look like the website the attacker is attempting to impersonate.
    If the address bar displays the correct URL of the website that the attacker was
    attempting to impersonate, the user will have a difficult time determining that
    they are going to the wrong website.


    # Chapter 15


    # Mitigate Phishing Attacks


    # ![How to Mitigate the Risk From Phishing Attacks - CybelAngel](image.023.png)


    We''ve talked about social engineering attacks, which include phishing, so let''s
    talk about different ways to mitigate phishing. One of the most effective ways
    to reduce phishing attempts is to train the user base by preparing them to recognize
    common tactics used by phishing attackers. As a result, if they see any of these
    techniques, they are less likely to click on malicious links or attachments in
    an email. Here are some helpful hints for teaching your user base. First, you
    should have them double-check that the domain name looks correct before clicking
    on any of the links, regardless of who is sending them. Another suggestion is
    for users to ask themselves if the email makes complete sense.


    As an example, imagine attacking a corporate user in finance and including a link
    to an invoice. If the user attempts to inquire whether it makes sense that they
    are receiving the invoice, this will help raise red flags. Perhaps they are expecting
    an invoice, but the "from address" appears to be unfamiliar. This brings me to
    my next point. If the phishing attempt appears plausible, instruct the user to
    call to confirm. Even if the attacker was able to spoof the "from address" to
    be the correct domain or even an email address, the user should call to confirm
    that an invoice was sent. If a phishing attempt is detected, do not have the user
    respond; instead, train the user to mark the email as spam to help prevent further
    phishing attempts from passing through the company''s filters. Finally, teach
    users that if they happen to click on a malicious link, they should immediately
    contact their IT department or security team.

