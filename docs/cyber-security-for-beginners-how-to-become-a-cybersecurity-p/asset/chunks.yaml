    仅由大写和小写字母组成的 8 位字符密码，破解只需 9 分钟。如果将密码字符数从 8 增加到 12，仅使用大写和小写字母的密码总数将从 53 万亿增加到超过
    390 百万亿。百万亿是十亿乘以十亿。仅由大写和小写字母组成的密码破解所需时间比这个数字本身更令人印象深刻。当今的计算机需要 123 年才能破解该密码。包含数字和特殊字符会使可能的组合数量增加到
    26 百万亿，即百万亿乘以 1,000。而该密码的破解时间将从 123 年增加到超过 8500 年。密码的长度和复杂性并非影响其强度的唯一因素。密码不应包含任何字典单词、姓名或重要日期。因为密码破解工具预先加载了字典单词以供优先尝试，使用字典单词会将你的
    12 位密码从需要 8500 年才能破解变为瞬间被破解。


    姓名和重要日期也会使密码更容易被猜测，因为它们更容易被推断出来。毕竟，它们对你很重要。此外，在密码末尾添加特殊字符，例如用 `$` 代替 `S`，用 `3`
    代替 `E`，用 `@` 代替 `A`，用 `0` 代替 `O` 或使用感叹号，并不能提供额外的安全性。虽然这种方法在过去可能有效，但现在的密码破解工具已包含这些字母替换的库。为了防止弱密码，应包括要求密码在一定期限后过期，并且任何先前使用过的密码都应被排除。


    # Chapter 3


    # Hardcoded passwords


    # ![Password Spraying is on the Rise and C-Suite Execs Are Being Targeted | Tech.co](img/image.006.jpeg)


    硬编码密码是与密码相关的另一种安全风险。硬编码密码是指嵌入到各种应用程序中的密码。


    密码可以是入站变体或出站变体。在入站变体中，为了获得对程序的管理访问权限，提供的凭据会与一组硬编码凭据进行检查。当应用程序需要连接到另一个设备或服务时，使用出站变体。在原始应用程序中，连接到该设备或服务的密码是硬编码的。这两种变体的问题在于，攻击者可以通过检查代码的源代码或二进制导出轻松获得密码。一旦攻击者获得了密码，他们就可以访问所有使用相同密码的程序。如果软件安装在多个设备上，攻击者可以用一个密码攻破所有设备。防止硬编码密码有几种选择。一种选择是将密码与代码分开，存储在经过强加密和保护的配置文件中。程序不再使用硬编码的默认用户名和密码，而是可以在用户首次登录时提示用户创建密码。如果软件必须包含硬编码凭据，另一种缓解措施是使用强单向哈希，并将这些哈希存储在配置文件中。然后，程序会将输入密码的哈希与配置的密码进行比较。这样做有利于，即使攻击者获得了配置文件的访问权限，他们仍然需要尝试破解密码，而且如果密码足够强，如前面讨论的那样，攻击者需要数千年才能破解该密码。


    # Chapter 4


    # No Encryption


    # ![What is Encryption & How Does It Work? | by Privacy Guy | Privacy Guy | Medium](img/image.007.jpeg)


    在当今世界，加密对于敏感数据至关重要。加密数据可确保其机密性和完整性。


    加密既可用于传输中的数据，也可用于静态数据。例如，连接到网站时，通常会使用 `HTTPS`，它使用 `TLS` 创建隧道。由于通信已加密，任何能够看到客户端和服务器之间通信的人都无法看到数据的实际负载。同样重要的是加密静态数据。加密文件和其他敏感数据会使攻击者更难以未经授权地访问信息。此外，这也会使攻击者更难以操纵数据。如果数据中缺少加密，数据就会暴露。例如，如果程序将用户的凭据保存到
    `cookie` 中以便更快地登录网站，但该 `cookie` 未加密密码，那么如果系统被攻破，凭据将非常容易被推断出来。正如你所见，这些只是不使用加密所带来的严重安全风险的几个示例。


    ![Six Top Information Security Risks to Be Aware of in 2019 -- Security Today](img/image.008.jpeg)


    # Chapter 5


    # Path Traversal


    # ![](img/image.009.png)


    路径遍历是另一种安全缺陷。当应用程序允许恶意行为者导航到用户所看到的目录之外时，就会发生此漏洞。


    例如，如果攻击者在网页上并想尝试浏览以查找不同的文件，他们可以使用路径遍历攻击来实现。当攻击者在合法网页上时，他们可以尝试通过键入 `"../"` 来导航到上一级目录，或者通过键入
    `".. / %2e %2e %2f"` 来使用表示此路径的编码，从而导航到不同的文件。如果网站易受攻击，攻击者可以通过几次猜测，以及通过 Web 服务器返回的关于文件结构的错误，快速了解目录结构。一旦目录结构被攻破，攻击者就可以浏览各种文件，例如密码文件、系统文件和其他未经授权的数据。为了防止路径遍历攻击，网站在使用文件系统调用时应尽量不依赖用户输入。另一种预防机制是确保用户输入经过验证，除了已知的良好条目（例如特殊字符）外，将所有条目列入黑名单。另一种良好的缓解技术是让管理员使用索引而不是文件位置的实际名称。因此，不要让用户输入
    `Alaska` 来导航到 `Alaska` 目录，而是让他们使用 `id`，例如 `20`。


    ![Comprehensive Guide on Path Traversal | LaptrinhX](img/image.010.png)


    # Chapter 6


    # SQL Injection


    # ![What is SQL Injection Attack? Definition & FAQs | Avi Networks](img/image.011.png)


    SQL 注入攻击是另一种可能影响 Web 应用程序的安全缺陷。SQL 注入攻击是指将额外代码注入到原始 `SQL` 代码中的攻击。


