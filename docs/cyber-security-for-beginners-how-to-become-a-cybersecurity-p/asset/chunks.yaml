- raw: "Essentially, it allows the attacker to add additional code to achieve their\
    \ goals. SQL injections are important to understand for a variety of reasons.\
    \ First and foremost, they are easily discovered. A quick web search will reveal\
    \ several vulnerable sites. Furthermore, SQL injections are common and easy to\
    \ export, although the impact of SQL injections can be severe. In terms of impact,\
    \ consider what can happen if a SQL injection is successful. The SQL injection\
    \ attack, for example, has the potential to gain access to confidential data.\
    \ Data such as usernames and passwords, personally identifiable information, social\
    \ security numbers, home addresses, or sensitive corporate records such as bank\
    \ accounts, profit and loss statements, or even intellectual property can be accessed\
    \ with a successful SQL injection attack. Once the SQL injection has access to\
    \ the data, it can modify it. This has an impact on data integrity because it\
    \ is impossible to know whether or not the data is accurate once the attack has\
    \ occurred. Some attacks may even initiate the creation of additional accounts\
    \ for the attacker to use to gain even more access or the creation of fake information\
    \ that could be harmful to the organization. Another effect is the original system's\
    \ availability. If the attacker can manipulate the data using SQL injection, they\
    \ may be able to delete critical data, rendering the system inoperable. They could,\
    \ for example, delete all of the records stored in the database, rendering the\
    \ database useless. The attacker could even go a step further and delete critical\
    \ files required for the database or the operating system that the database runs\
    \ on to function properly. In any case, the database isn't working the way it\
    \ was intended to.\n\n# Chapter 7\n\n# Cross Site Scripting\n\n# ![What is Cross\
    \ Site Scripting? Definition & FAQs | Avi Networks](image.012.png)\n\nCross-site\
    \ scripting, abbreviated as XSS. When a malicious user injects malicious code\
    \ or scripts into a legitimate website, this is referred to as XSS. For the website\
    \ to behave as the attacker desires, the attacker uses untrusted data, which is\
    \ user input that websites use as a search function. A malicious attacker, for\
    \ example, could write code, such as JavaScript, that would run in the search\
    \ function. The attacker inserts malicious code into a link to a legitimate website.\
    \ If the attacker then convinces a user to click on that link, the code will be\
    \ executed on that user's machine. JavaScript code can easily send the attacker\
    \ the user's cookie data, which may contain usernames and passwords for various\
    \ sites. The attacker can use various tools, such as a URL shortener, to make\
    \ a link display only the legitimate website while concealing the malicious code\
    \ behind it. A persistent XSS can also be used by the attacker to change the code\
    \ on the server-side. Once the code is saved on the server, it's easy to imagine\
    \ the various types of security flaws that the attacker could exploit on unsuspecting\
    \ website visitors. They can have their code permanently saved to a benign website,\
    \ so that when legitimate user traffic navigates to the site, the attacker's code\
    \ runs, even if the user did not click on the attacker's malicious link. Using\
    \ the security encoding library is one of the best ways to protect against cross-site\
    \ scripting. This prevents attackers from using various escaping shortcuts to\
    \ run their code. Another preventative measure is to properly design the web page\
    \ by not allowing untrusted data within specific areas of HTML, JavaScript, CSS,\
    \ or other coding languages.\n\n# Chapter 8\n\n# Cross-site forgery request\n\n\
    # ![What is CSRF | Cross Site Request Forgery Example | Imperva](image.013.png)\n\
    \nBy forging a cross-site request, an attacker can take advantage of legitimate\
    \ cross-site requests and force the victim's computer to perform unwanted actions\
    \ on websites to which they have already authenticated. For example, if an attacker\
    \ successfully social engineers a user into clicking on a link, or replants the\
    \ link in an otherwise legitimate site, the script will run and force the user\
    \ to perform an unwanted action. If a banking website uses a get request to transfer\
    \ money from one member to another, an attacker can change the URL to transfer\
    \ money to themselves. This URL is easily concealed by using a URL shortener or\
    \ embedding the link within a different name. Cross-site scripting mitigations\
    \ are recommended to protect against cross-site forgery. While XSS is not required\
    \ for a successful cross-site forgery attack, cross-site forgery mitigations can\
    \ be circumvented with a successful cross-site scripting attack. Once cross-site\
    \ scripting has been addressed, cross-site forgery requests can be addressed by\
    \ employing secure random tokens. Users can also help to protect themselves by\
    \ using a browser that supports SameSite cookie attributes. Even if the link is\
    \ legitimate, this will prevent the browser from sending the cookie.\n\n# Chapter\
    \ 9\n\n# Viruses & Malware\n\n# ![What are viruses and malware? - BBC Bitesize](image.014.jpeg)\n\
    \nWe've already discussed the various types of security flaws that can affect\
    \ today's networks. Now it's time to move on, expand on that knowledge, and discuss\
    \ different threats that can affect both on-premises networks and cloud-based\
    \ network environments. In particular, we'll go over some additional threats that\
    \ you should be aware of to protect your company's on-premises IT equipment. The\
    \ course will then go over Denial of Service and man-in-the-middle attacks. \n\
    \nFollowing that, you will learn about social engineering and how phishing is\
    \ a common social engineer attack. After you've learned about phishing, you'll\
    \ understand how the endpoint can help the user and prevent a successful phishing\
    \ attack. Following that, we will go over specific threats that can affect your\
    \ company's cloud-based IT infrastructure. As a security engineer, you must be\
    \ aware of the various digital threats that attackers can use to disrupt legitimate\
    \ business activity. Enterprise IT equipment is no longer restricted to a single\
    \ location or even a few different remote sites. Cloud environments are still\
    \ being used by businesses to run some, if not all, of their operations. Malware\
    \ Let's take a look at some of the threats that can affect enterprise environments,\
    \ starting with malware. The term malware is derived from combining the words\
    \ \"malicious software\" into one word, and it is a broad term that encompasses\
    \ a wide range of threats. To name a few, threats include viruses, Trojans, backdoors,\
    \ worms, rootkits, spyware, exploits, adware, and any potentially unwanted programs.\n\
    \n![10 types of malware + how to prevent malware from the start | Norton](image.015.jpeg)\n\
    \n Virus Viruses are one of the oldest types of malware. While some people confuse\
    \ malware and viruses, the most accurate definition of a virus is a computer program\
    \ that copies itself. The virus spreads from one file to the next, eventually\
    \ infecting enough files to cause serious computer damage. Although a single infected\
    \ file can cause damage, viruses can also spread from computer to computer when\
    \ infected files are transferred via a shared drive, USB drive, or any other medium\
    \ of the file transfer. A virus is a piece of executable code that attaches itself\
    \ to another program, such as an executable file or a macro within a Microsoft\
    \ Office file. "
