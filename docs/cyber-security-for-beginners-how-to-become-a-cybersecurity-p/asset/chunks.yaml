  trans: "\n\n病毒在感染文件被执行之前始终处于休眠状态，一旦执行，病毒的代码就会被运行。病毒的主要目标是造成破坏。它通过损坏文件（包括系统文件）来实现这一目标，从而导致底层操作系统无法正常运行。间谍软件\
    \ 另一种恶意软件是间谍软件。顾名思义，间谍软件旨在运行在受害者的计算机上并窃取敏感信息。间谍软件可以采用键盘记录器的形式，记录每一次按键。如果受害者访问银行网站并登录，攻击者就能看到按键记录，从而确定用户访问了哪个银行网站，以及用户名和密码。间谍软件还可以查找信用卡号码、浏览习惯，以及受害者在计算机上进行的几乎任何其他操作。\n\
    \n# Chapter 10\n\n# 木马与勒索软件\n\n# ![勒索软件攻击与类型 | Locky、Petya 等勒索软件有何不同？](img/image.016.jpeg)\n\
    \n木马是另一种旨在造成严重危害的恶意软件。木马通常看起来并非恶意软件，但与其他任何恶意软件一样，它们包含旨在执行特定任务的代码。与病毒不同，木马无法自我复制。它们必须由用户安装。后门木马是一种常见的木马类型，旨在让攻击者访问受感染的计算机，从而允许他们随意操作。他们可以添加主机，甚至发送和接收各种文件，或者木马的唯一目的是通过显示广告弹窗或仅仅更改桌面背景来惹恼用户。攻击者还可以控制多台机器并用它们攻击其他受害者。在分布式拒绝服务攻击中，攻击者可以让所有受感染的计算机尝试瘫痪一个系统。在下一章中，我们将讨论拒绝服务攻击和分布式拒绝服务攻击。\n\
    \n勒索软件 一种特定类型的木马旨在感染用户的计算机并使其无法使用。受害者访问其计算机和文件的唯一方法是向攻击者支付费用。这种木马被称为勒索软件，因为攻击者要求受害者支付赎金。\n\
    \n# Chapter 11 \n\n# Rootkits 与蠕虫\n\n# ![Rootkit 定义。如何删除它 \U0001F4CC](img/image.017.png)\n\
    \n## Rootkits 是另一种类型的恶意软件。\n\nRootkits 旨在执行与我们讨论过的其他一些恶意软件相同的许多恶意操作。最显著的区别是，rootkits\
    \ 专门设计用于避免被传统反恶意软件检测到。\n\n它们可以通过将自身插入计算机内核来实现这一点，内核与主机操作系统处于同一级别。这使攻击者完全控制计算机，包括覆盖或删除操作系统文件的能力。\n\
    \n## Worms\n\n## ![2,913 张计算机蠕虫股票照片、图片及免版税图片 - iStock](img/image.018.jpeg)\n\n\
    蠕虫是一种与病毒不同的恶意软件。\n\n它们以与病毒相同的方式自我复制，但它们不附加到另一个程序，也不需要用户或主机程序来帮助传播蠕虫。\n\n蠕虫利用目标系统中的漏洞，以便从一个系统传播到另一个系统。这就是为什么保持操作系统和软件更新至关重要。\n\
    \n## Adware\n\n## ![什么是 Adware 以及我如何摆脱它？ | 由 AdBlock | AdBlock 的博客](img/image.019.png)\n\
    \n另一种类型的恶意软件是广告软件，它通过在受感染的机器上显示广告来产生收入。恶意软件的创建者通过显示广告或使用按点击付费模式来赚钱。\n\n随着计算机和网络系统的不断发展，恶意软件几乎肯定也会随之演变。这就是为什么作为安全工程师，确保自己了解各种存在的威胁类型以及如何缓解这些威胁比以往任何时候都更加重要。\n\
    \n# Chapter 12\n\n# DoS 攻击\n\n# ![什么是分布式拒绝服务 (DDoS) 攻击？](img/image.020.png)\n\n\
    许多威胁并非专门指恶意软件。\n\n我们将在本章中讨论拒绝服务攻击和分布式拒绝服务攻击，以及中间人攻击。\n\n## 拒绝服务 (DoS) 攻击\n\n当系统的服务对合法用户不可用时，就会发生拒绝服务\
    \ (DoS) 攻击。系统可以是 Web 服务器、电子邮件服务器，或任何依赖于计算机或计算机网络的其他服务。\n\n恶意攻击者必须发送如此多的流量，以至于服务的服务器没有足够的资源来响应每一条流量，从而有效地发动\
    \ DoS 攻击。\n\n这可以通过发送大量 ICMP 消息、尝试启动但从未完成三次握手的消息、UDP 消息，或服务在正常情况下设计为响应的任何其他类型的消息来实现。\n\
    \n当系统或服务过载时，它无法处理任何传入的合法请求，用户被拒绝访问该服务。\n\n分布式拒绝服务 (DDoS) 攻击\n\n当多台机器协作攻击一个服务时，就会发生分布式拒绝服务\
    \ (DDoS) 攻击。\n\n攻击者可以命令被恶意软件感染的机器向 DDoS 攻击的预期受害者发送各种类型的消息。\n\n# Chapter 13\n\n\
    # 中间人攻击\n\n# ![仅需 15 分钟即可执行中间人攻击 - Hashed Out](img/image.021.png)\n\n当有人拦截两个原本正常系统之间的流量时，这被称为中间人攻击。例如，如果恶意攻击者拦截了客户端和服务器之间的流量，他们将能够看到流量的全部内容。中间人攻击拦截客户端发送到服务器的初始请求，然后复制该消息并将其发送到原始服务器。服务器随后用其返回消息响应中间人。再次，中间人复制流量，然后用副本响应客户端。中间人可以在客户端和服务器之间的整个对话过程中重复此过程。客户端和服务器都认为它们正在互相通信，\
    \ unaware 中间有一个设备可以看到整个对话。此外，拥有合适工具的中间人攻击者可以将他们想要的任何内容注入客户端和服务器之间的通信中。因此，他们不仅可以读取对话的内容，还可以以任何他们想要的方式操纵它。前几章讨论过的威胁，例如\
    \ SQL 注入和跨站点脚本，也可以用于对本地和云端设备造成破坏。\n\n# Chapter 14\n\n# 社会工程学和网络钓鱼攻击\n\n# ![什么是网络钓鱼攻击\
    \ ❓ 类型和商业影响 | Wallarm](img/image.022.jpeg)\n\n"
