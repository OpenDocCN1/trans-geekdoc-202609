    There are a variety of threats out there that you should be aware of, as well
    as how to mitigate them.


    This can be done manually or automatically using security appliances or APIs.


    This book will teach you about these threats and how to mitigate them, whether
    through security intelligence or automation.


    Some of the major topics we will cover include the types of threats that can affect
    organizations regardless of whether the devices are on-premises or in the cloud,
    what security intelligence is and what solutions we have for it, and how to use
    APIs to interact with certain security appliances.


    By the end of book 1, you''ll understand how to identify threats to your network
    and mitigate them with some of the industry''s best security tools.


    This book will cover a variety of security threats that commonly target organizations''
    IT infrastructures.


    If you''re reading this, I''d like to welcome you to your journey of learning
    about these threats and the solutions we can offer.


    This book is for you if you want to work as a network or security administrator.


    If you work in IT or want to change careers in IT, this book will teach you about
    the security threats that you should be aware of.


    While you do not need to be a computer programmer by trade, basic networking knowledge
    is highly recommended.


    Assume you are a network engineer, and the CIO (Chief Information Officer) has
    assigned you the task of learning about the various threats that may affect your
    company''s network.


    Regardless of whether the devices are on-premises or in the cloud.


    Because your company is thinking about using a security intelligence solution
    to help protect against these threats, you''ve been tasked with learning how it
    works.


    The chapters that follow will introduce you to the various threats that may affect
    your company''s IT networks.


    First, I''ll expand on that knowledge by discussing the various threats that affect
    on-premises environments, as well as threats that affect cloud environments.


    In addition, I will discuss how social engineering and phishing can have a significant
    impact on both the company and individual people.


    # Chapter 1


    # Software Bugs and Buffer Overflow


    # ![Types of Bugs in Software Testing: 3 Classifications with Examples](image.001.png)


    The first vulnerability I''d like to discuss with you is software bugs. A software
    bug is simply a flaw in a computer program. This causes a program to behave unexpectedly.
    This could be as simple as a flaw in the software''s logic.


    ## Error in calculation


    For instance, suppose an excel spreadsheet is supposed to take the contents of
    two cells, add them together and store the result in a third cell, but instead
    adds the values together rather than multiplying them. When you combine them,
    you will get unexpected results. This is known as a calculation error.


    The third cell should contain the results that you expect. The product of the
    previous two cells Because the application did not do what it was supposed to
    do. That is an example of a bug, as the person who wrote it intended.


    ## Overflow of a buffer


    A buffer overflow is another type of software bug. A buffer is defined as a section
    of memory set aside for a specific amount of data. Buffer overflow can occur if
    the amount of data is greater than the capacity of the buffer.


    ![What is a Buffer Overflow | Attack Types and Prevention Methods | Imperva](image.002.png)


    ## The memory buffer''s capacity


    A form is an example of this occurring outside of computers that you may have
    provided information on a form, such as your name and address, and there are a
    few rows of boxes on the form. When filling out these forms, you are only supposed
    to fill in the blanks. Each box should contain one letter or one number. If you
    happen to own a longer last name than the form''s designer made room for.


    For example, you would go over the amount of space when filling out the form reserved
    for the use of your surname. This creates ambiguity. What is the proper place
    to put your first name? Do you think so?


    Just leave a space and continue? What if that takes too long? Trespass on the
    space of the next box? Will the person who reads the form? I believe you meant
    to write over the box in the other section.


    Similarly, when a computer''s software writes to memory. In addition to the stack,
    the software makes use of buffers to store various data. Inside one''s memory,
    these buffers are positioned next to one another. As a result, if each buffer
    contains multiple different values, and each buffer has a set number of bits that
    will be used to hold the data, similar to a form that contains a specific number
    of boxes for the last name, address, and so on, similar to the form, if there
    was one. The more data that is placed inside the buffer than there is space for,
    the data in the following buffer may be overwritten. You may be wondering, "Why
    is this important for me to know?" about trivial matters such as spreadsheets
    that aren''t working properly or data that is larger than the buffer set aside
    for it? True, in most cases, the worst that can happen with software bugs is to
    cause frustration, and more often than not, the bug is completely unnoticed.


    ![Buffer Memory and the Difference in Buffer and Cache](image.003.jpeg)


    However, you should be aware that malicious attackers can exploit these bugs.
    These bugs are used to manipulate programs so that they do what they want. Rather
    than a minor annoyance caused by the program not working properly, that it was
    designed to do, a skilled attacker could exploit their knowledge of the bug and
    exploit it in a way that will benefit them. A skilled attacker, for example, could
    exploit a buffer overflow and obtain information that they would not have been
    able to obtain otherwise. They are even capable of writing over their original
    data so that it no longer contains the same information, or they could take advantage
    of the buffer overflow to cause a host on which the software was running to crash,
    resulting in a Denial of Service (DoS) attack.


    ![What is a denial-of-service (DoS) attack? | Cloudflare](image.004.png)


    # Chapter 2


    # Weak Passwords


    # ![Weak Passwords Are A Gift To Hackers - Teamstack Blog](image.005.png)


    Passwords are used to restrict access to sensitive data that only certain people
    or programs should have access to. Certain criteria must be met for the passwords
    to be effective. One of the requirements is that the password is strong. A password
    must be both complex and long to be considered strong. The longer the password,
    the more difficult it is for brute force attacks to crack it.


    Passwords used to only need to be eight characters long to be considered secure.
    According to research, a minimum of 12 or 16 characters is required. Password
    complexity is also important. Just as each additional character makes a password
    more secure, increasing the type of character that can be used makes it more difficult
    for a password cracker program to obtain the final password. For example, if you
    create a password that is eight characters long and only contains upper and lowercase
    letters, there are over 53 trillion possible password combinations. When numeric
    characters such as 0 through 9 are added, there are now 62 options for each character,
    bringing the total number of possible combinations to more than 218 trillion.
    Finally, allowing special characters increases the number of options for each
    character to 74, bringing your 8-character password to nearly 900 trillion options.
    While all of these numbers appear to be so large that it would take a millennium
    to crack, the truth is that even with nearly 900 trillion combinations, it would
    only take today''s computers 2 and a half hours to crack.

