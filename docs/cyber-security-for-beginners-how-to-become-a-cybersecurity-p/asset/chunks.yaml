    本质上，它允许攻击者添加额外代码以实现其目标。理解 SQL 注入非常重要，原因有很多。首先，它们很容易被发现。快速的网络搜索将揭示几个易受攻击的网站。此外，SQL
    注入很常见且易于利用，尽管 SQL 注入的影响可能很严重。就影响而言，请考虑如果 SQL 注入成功会发生什么。例如，SQL 注入攻击有可能访问机密数据。成功的
    SQL 注入攻击可以访问的数据包括用户名和密码、个人身份信息、社会安全号码、家庭住址，或银行账户、损益表甚至知识产权等敏感的企业记录。一旦 SQL 注入访问了数据，它就可以修改数据。这会影响数据完整性，因为攻击发生后无法知道数据是否准确。某些攻击甚至可能发起创建额外账户，供攻击者用来获得更多访问权限，或创建可能对组织有害的虚假信息。另一个影响是原始系统的可用性。如果攻击者可以使用
    SQL 注入操纵数据，他们可能能够删除关键数据，使系统无法运行。例如，他们可以删除数据库中存储的所有记录，使数据库无用。攻击者甚至可以进一步删除数据库或数据库运行所在的操作系统正常运行所需的关键文件。无论如何，数据库都无法按预期方式工作。


    # Chapter 7


    # Cross Site Scripting


    # ![What is Cross Site Scripting? Definition & FAQs | Avi Networks](img/image.012.png)


    跨站脚本，缩写为 XSS。当恶意用户将恶意代码或脚本注入合法网站时，这被称为 XSS。为了使网站按照攻击者的意愿运行，攻击者使用不可信数据，即网站用作搜索功能的用户输入。例如，恶意攻击者可以编写
    JavaScript 等代码，这些代码将在搜索功能中运行。攻击者将恶意代码插入指向合法网站的链接中。如果攻击者随后说服用户点击该链接，代码将在该用户的计算机上执行。JavaScript
    代码可以轻松地将用户的 Cookie 数据发送给攻击者，其中可能包含各种网站的用户名和密码。攻击者可以使用各种工具，例如 URL 缩短器，使链接仅显示合法网站，同时隐藏其背后的恶意代码。攻击者还可以使用持久性
    XSS 来更改服务器端的代码。一旦代码保存在服务器上，就不难想象攻击者可以利用各种安全漏洞来攻击毫无戒备的网站访问者。他们可以将代码永久保存在良性网站上，因此当合法用户流量导航到该网站时，攻击者的代码会运行，即使用户没有点击攻击者的恶意链接。使用安全编码库是防范跨站脚本的最佳方法之一。这可以防止攻击者使用各种转义快捷方式来运行其代码。另一种预防措施是正确设计网页，不允许不可信数据出现在
    HTML、JavaScript、CSS 或其他编程语言的特定区域内。


    # Chapter 8


    # Cross-site forgery request


    # ![What is CSRF | Cross Site Request Forgery Example | Imperva](img/image.013.png)


    通过伪造跨站请求，攻击者可以利用合法的跨站请求，并强制受害者的计算机在其已进行身份验证的网站上执行不需要的操作。例如，如果攻击者成功地通过社交工程诱使用户点击链接，或将链接重新植入原本合法的网站，脚本将运行并强制用户执行不需要的操作。如果银行网站使用
    GET 请求在一个成员与另一个成员之间转账，攻击者可以更改 URL 以将资金转给自己。这个 URL 可以通过使用 URL 缩短器或将链接嵌入到不同名称中来轻松隐藏。建议采用跨站脚本缓解措施来防范跨站请求伪造。虽然
    XSS 并非成功进行跨站请求伪造攻击所必需，但成功的跨站脚本攻击可以绕过跨站请求伪造缓解措施。一旦解决了跨站脚本问题，就可以通过使用安全随机令牌来解决跨站请求伪造请求。用户也可以通过使用支持
    SameSite Cookie 属性的浏览器来帮助保护自己。即使链接是合法的，这也将防止浏览器发送 Cookie。


    # Chapter 9


    # Viruses & Malware


    # ![What are viruses and malware? - BBC Bitesize](img/image.014.jpeg)


    我们已经讨论了可能影响当今网络的各种安全漏洞类型。现在是时候继续前进，扩展这些知识，并讨论可能影响本地网络和基于云的网络环境的不同威胁。特别是，我们将介绍一些您应该了解的额外威胁，以保护您公司的本地
    IT 设备。课程随后将介绍拒绝服务攻击和中间人攻击。


    随后，您将了解社会工程学以及网络钓鱼是一种常见的社会工程攻击。了解网络钓鱼后，您将明白端点如何帮助用户并防止成功的网络钓鱼攻击。随后，我们将介绍可能影响您公司基于云的
    IT 基础设施的特定威胁。作为安全工程师，您必须了解攻击者可用于干扰合法业务活动的各种数字威胁。企业 IT 设备不再局限于单一位置甚至几个不同的远程站点。企业仍在使用云环境来运行其部分或全部业务。恶意软件
    让我们来看看一些可能影响企业环境的威胁，从恶意软件开始。恶意软件一词源于将“恶意软件”两个词合并为一个词，它是一个广义术语，涵盖了广泛的威胁。举几个例子，威胁包括病毒、特洛伊木马、后门、蠕虫、rootkit、间谍软件、漏洞利用、广告软件以及任何潜在的不需要程序。


    ![10 types of malware + how to prevent malware from the start | Norton](img/image.015.jpeg)


    病毒 病毒是最古老的恶意软件类型之一。虽然有些人将恶意软件和病毒混淆，但病毒最准确的定义是一种会自我复制的计算机程序。病毒从一个文件传播到下一个文件，最终感染足够多的文件以造成严重的计算机损坏。虽然单个受感染的文件可能会造成损坏，但当受感染的文件通过共享驱动器、USB
    驱动器或任何其他文件传输介质传输时，病毒也可以从一台计算机传播到另一台计算机。病毒是一段可执行代码，它会附加到另一个程序上，例如可执行文件或 Microsoft
    Office 文件中的宏。


