    \ Chapter 15\n\n# Mitigate Phishing Attacks\n\n# ![How to Mitigate the Risk From\
    \ Phishing Attacks - CybelAngel](image.023.png)\n\nWe've talked about social engineering\
    \ attacks, which include phishing, so let's talk about different ways to mitigate\
    \ phishing. One of the most effective ways to reduce phishing attempts is to train\
    \ the user base by preparing them to recognize common tactics used by phishing\
    \ attackers. As a result, if they see any of these techniques, they are less likely\
    \ to click on malicious links or attachments in an email. Here are some helpful\
    \ hints for teaching your user base. First, you should have them double-check\
    \ that the domain name looks correct before clicking on any of the links, regardless\
    \ of who is sending them. Another suggestion is for users to ask themselves if\
    \ the email makes complete sense. \n\nAs an example, imagine attacking a corporate\
    \ user in finance and including a link to an invoice. If the user attempts to\
    \ inquire whether it makes sense that they are receiving the invoice, this will\
    \ help raise red flags. Perhaps they are expecting an invoice, but the \"from\
    \ address\" appears to be unfamiliar. This brings me to my next point. If the\
