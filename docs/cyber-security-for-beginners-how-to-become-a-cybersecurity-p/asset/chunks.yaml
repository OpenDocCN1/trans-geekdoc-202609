  trans: '


    一旦向 IT 部门报告，工程师应有足够的时间分析日志并找出发生了什么，但他们除了正常的流量流外，不会发现任何其他情况。然而，如果所有人在同一时间或相近的时间断开与同一无线网络的连接，这会引起怀疑。尽管如此，要确定究竟发生了什么，以及几个去认证请求的流量发起源头在哪里，仍然很困难。


    # Chapter 23


    # Wireless Collision Attack


    # ![Wireless Attacks Unleashed - Infosec Resources](img/image.031.png)


    无线碰撞很常见，可能由无绳电话和微波炉等设备无意中引起，这些设备会造成干扰，削弱现有可信连接设备的无线信号。


    无线接入点使用各种信道通过空气发送信号。例如，如果你住在公寓里，你邻居的无线接入点可能会对你的家庭连接造成无线干扰。


    接入点的信号范围为 30-50 米，但一些为企业设计的 `Ap-s` 在没有干扰且范围内无障碍的情况下，可以传输高达 600 米的无线信号。


    当无线信号遇到窗户、门、墙壁和较厚物体等障碍物时，其质量开始恶化。公寓中无线信号弱的情况很常见，尤其是当你附近有多个邻居时。


    我已经提到过，你可以配置 `Kali Linux` 以提供更强的无线信号，以及监控和识别无线 `SSIDs`、范围内的无线接入点以及它们运行的信道。


    黑客经常将他们的 `Kali Linux` 配置为使用与受害者的 `AP-s` 相同的信道，造成显著的无线干扰，导致受害者的网络不仅变慢，在某些情况下甚至完全无法使用。


    通过不断增强无线信号，数据包最终会被丢弃，大多数甚至所有客户端都将无法连接到无线网络。更进一步，黑客将 `Kali` 安装在 `Raspberry Pi`
    上，并将其隐藏在目标无线接入点附近，以造成更糟糕的无线信号。


    在某些情况下，黑客将预先配置为运行 `Kali Linux` 的 `Raspberry Pi` 连接到 `Drone` 上，并将其降落在目标建筑物上。当使用复杂的无线碰撞攻击时，无线信号可能会被严重削弱，影响多个
    `SSIDs` 甚至多个 `APs`。客户端会因无线碰撞攻击而断开无线网络连接。


    # Chapter 24


    # Wireless Replay attacks


    # ![Cyber Attacks | Network Attacks | Threats | Vulnerabilities ⋆ IpCisco](img/image.032.png)


    无线重放攻击已经不再流行，但它们曾经非常普遍。与此同时，出于各种原因，无线重放攻击仍在无线网络中被使用。


    捕获无线信号很简单，尤其是因为它们无处不在。在连接到无线网络之前，黑客必须先监控无线信号。


    `Wireshark` 软件可用于在监控的同时记录无线流量。`Wireshark` 是网络工程师经常用于排查有线和无线网络问题的数据包分析软件。


    `Wireshark` 可以帮助进一步分析捕获的流量，并了解无线网络上正在进行哪种类型的通信。黑客会特别检查与客户端到特定 `SSID` 的身份验证过程相关的数据包。


    这个数据包将验证用于连接到无线接入点的密码。一旦黑客获得数据，他就可以使用它通过空气向 `AP` 发送相同的消息。结果，接入点将在假设它是已知可信设备的前提下，对黑客进行身份验证和授权，允许其连接到网络。


    由于大多数大型公司已经实施了新的安全实践以实现更好的加密，无线重放攻击不像以前那么常见了。然而，并非所有组织都使用强加密技术，许多企业可能会通过采用这种过时的方法而被利用。


    # Chapter 25


    # Protecting wireless networks


    # ![Secure Wireless Network](img/image.033.png)


    由于基础设施安全至关重要，大多数大型公司已经建立了良好的安全措施，例如 `Cisco Identity Service Engine (ISE)`、`Cisco`、`Checkpoint`
    或 `Palo Alto Firewalls`，以及某种入侵防御系统 (`APS`) 和入侵检测系统 (`IDS`)，例如 `Cisco FirePower`。


    大多数企业更喜欢拥有两种防火墙，以防其中一个被攻破。


    入侵检测系统在无线安全方面也很著名，并且擅长检测网络异常。一旦发现异常，工程师和安全专业人员将通过电子邮件收到通知。需要注意的是，`IDS-s` 只擅长识别或检测异常，而不是阻止它们。


    这就是入侵防御系统派上用场的地方，因为它们可以防止或减轻此类无线攻击。入侵检测系统的问题在于，虽然它们在防止黑客攻击方面有效，但在检测黑客攻击方面并不十分有效。因此，同时拥有设备和虚拟设备
    `IPS-s` 和 `IDS-s` 是一种良好的做法。


    大多数无线接入点是以太网供电设备，因此连接到网络交换机。如果黑客试图通过有线或无线连接连接到网络，必须在网络交换机上实施其他命令。


    无线网络安全至关重要，如果你在家里有个人无线网络，你很可能正在使用 `WPA-Personal` 或 `WPA-PSK` 之类的协议。`PSK` 是预共享密钥的缩写，是连接到无线网络所需的密码。


    预共享密钥可以通过多种技术被攻破，包括暴力攻击或字典攻击。暴力攻击和字典攻击都是相对容易执行的任务，尤其是使用 `Kali Linux` 时。


    运行这些工具只需点击几下，一旦启动，它们就会开始查找密码或预共享密钥的工作。


    预共享密钥应包含大写和小写字母、数字以及各种符号，并且至少 12 个字符。你的密码越复杂，黑客就越难破解。


    此外，你的密码不应与你本人相关联。请避免使用你的名字、出生日期或任何属于家庭成员的名字。


    大多数人使用容易记住的密码。当然，坏人也知道这一点，并且通过使用社交网络网站，他们可以轻松破解与个人相关的密码。


    暴力攻击或字典攻击可以破解密码，即使需要几天时间，它们最终也会被破解。这是公司实施密码策略（如密码复杂性和要求用户定期更改密码）的主要原因之一。这些是标准做法，如果你的组织尚未实施这些做法，你应该将其提请经理注意。


    # Bonus Chapter VPN Concepts


    ![How a VPN (Virtual Private Network) Works | HowStuffWorks](img/image.034.jpeg)


    你认为什么是 VPN？如果我对你说：“嘿，我们正在设置一个 VPN，”你会怎么想，或者你会如何定义它？那么，以下是我们中一些人对它的定义。


    首先，`VPN` 代表 `Virtual Private Networking`。让我们回到虚拟部分。我们不妨先从私有网络开始。


    私有网络意味着我可以进行网络连接并发送数据等，同时保持私密，对吗？有一个假设，即我通过网络发送的任何东西都对我是私密的，所以虚拟部分就在这里：我的网络是私密的，但它是一个虚拟网络。


    '
