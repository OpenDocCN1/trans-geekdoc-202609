- raw: 'VPNs are what we call an overlay technology because they sit on top of another
    network that already exists. We''re putting our virtual private network on top
    of an existing network or a collection of networks that we''ll be traversing.


    So that''s how a virtual private network is envisioned. What services do VPNs
    provide, and why are they so important? As an overlay, a VPN is typically designed
    to connect remote sites or users in remote locations over a wide area network.


    We could do it via public network access such as the internet, or we could do
    VPNs over private wide area networks. But the idea is that it connects us across
    multiple sites, and because we''re sending traffic over a public network that
    we don''t control, the VPN should provide some level of confidentiality for us
    and our data. So that will take the form of encryption.


    There are several encryption technologies that we could use, and you may be familiar
    with some of them already. So, many years ago, the most popular encryption technology
    was DES or Data Encryption Standard. There was 3DES, which was three distinct
    DES processes.


    These are still in use, and some organizations do, but DES and 3DES are considered
    to be older protocols. Instead, we''d employ the Advanced Encryption Standard
    (AES).


    DES is a 56-bit encryption algorithm. 3DES is 168 bits, and AES can be 128 bits,
    168 bits, 256 bits, and so on. There are various AES groups, encryption methods,
    and strengths that we can employ.


    As a result, we would select these based on the level of encryption required,
    which is the level of confidentiality. So, if we wanted to be secure, AES-256
    is probably a good choice.


    VPN should also ensure data integrity, ensuring that data is not tampered with
    while in transit. Consider it this way: Let''s say we have a box and we''re sending
    it from one location to another, so we put it on a scale and weigh it, and we
    say it weighs 20 pounds, and we send it off.


    Someone messes with it while it''s in transit. They open the box and take items
    from it. When the box reaches the other side of the line and is weighed, it weighs
    only two pounds.


    We can look at the label and say, "Wait a minute, the shipping label said it was
    20 pounds, but it only weighs 2 right now." This package''s integrity has been
    compromised, so we don''t open it, we don''t tamper with it, we send it back,
    or we simply say, "Hey, I don''t accept this." That is character.


    We''ll use a hash mechanism with VPNs to ensure data integrity. A hash algorithm
    can be used to create the hash mechanism. We have MD5, which is Message Digest
    5, and SHA, which is a Secure Hash Algorithm, also known as SHA-1 or SHA-256 today.


    So, essentially, we take the data packet and hash it, and then we attach the hash,
    just like weighing the box, and then we send it to the other side, and the other
    side will take the packet and hash it themselves.


    So they''ll run it through the hash algorithm, let''s say SHA, and then they''ll
    generate a hash, which is just some 3 or 5 hash, and they''ll compare that hash
    to the hash that was sent. If the hash matches, we know it essentially weighs
    the same, and we''re good to go, and we accept it. That''s how VPNs help me maintain
    data integrity.


    The third point we''ll cover is that a VPN should provide me with data origin
    authentication. We can provide data origin authentication using a pre-shared key.


    We''ll simply use PSK, or pre-shared key, or a digital certificate, and the digital
    certificate would be similar to getting a driver''s license from the DMV, so it''s
    authenticated by a trusted third party.


    For instance, if you go to the DMV and fill out your information, they will issue
    you a driver''s license. If you are pulled over, you can show them your driver''s
    license, and the police officer will trust it because it was issued by a trusted
    source, the DMV, and it authenticates you.


    We can achieve the same result with a digital certificate. We can enroll with
    a CA server such as Verisign, Entrust, or GoDaddy, obtain a certificate, and then
    present that certificate to someone with whom we want to establish a VPN.


    They can see who issued the certificate and thus trust them.


    Because your certificate has been signed by them, I''m going to accept it. As
    a result, they can use certificates for origin authentication in this manner.


    As an alternative, we can use a pre-shared key. So I take my data and, in essence,
    hash it with that pre-shared key before sending it to the other side. We shared
    that key with them as well; we did this offline, and they can compare the hashes;
    if they match, we''ll talk.


    These are the three things we want to understand about VPNs: confidentiality,
    data integrity, and data origin authentication. VPNs could also provide anti-replay
    protection, which they usually do. In terms of how that occurs, there isn''t much
    to say.


    It''s built into the protocol, as well as iOS and Cisco ASA Firewalls, and they
    just do it, but these are the three pieces we''ll have control over in our configuration.
    We''ve already discussed what causes a lot of this. We''ve discussed encryption
    protocols as well as hash algorithms. So far, we''ve discussed AES, 3DES, MD5,
    and SHA, but there''s a little more to it, so let''s go over some additional terminology.


    First and foremost, consider how encryption keys are exchanged. There is, however,
    a protocol known as ISAKMP. The Internet Security Association Key Management Protocol
    is what it''s called. We simply refer to it as ISAKMP, and many people refer to
    IKE, the Internet Key Exchange, which is a component of ISAKMP.


    ISAKMP provides IKE, the Internet Key Exchange, and Oakley, and there are a few
    other protocols that sit beneath ISAKMP, but we just lump them all together. ISAKMP
    will negotiate a secure channel for us and exchange our keys in advance.


    Those secure encryption keys could be generated using the Diffie-Hellman algorithm,
    abbreviated as DH. The Diffie-Hellman algorithm generates a secret key that is
    not exchanged across the wire, but in the end, we have these keys on both devices
    that they can use for encryption and decryption, symmetric keys, and we didn''t
    send those keys across the wire, which is a good thing.


    As a result, when we establish a connection, we create what is known as a security
    association. A security association is essentially an entry on my router that
    lists who I''m communicating with, what algorithms I''m using, and what keys I
    could use. So, before they can communicate with each other, both devices will
    have a SA or Security Association.


    When we start sending packets, they will be formulated using either ESP, AH, or
    both, but in general, we will only use ESP these days. ESP stands for Encapsulating
    Security Payload, and we can use it in two modes: tunnel mode and transport mode.
    When we use ESP in tunnel mode, we have a private IP address that is tunneled
    inside of a public address.


    So, that''s a high-level overview of the ESP protocol. It is a protocol that is
    part of the IPsec protocol suite. If we look at the ESP header, we can see that
    it has a security parameter index number. It will have a security parameter index
    number, which will link it to a security association. We''ll start with a sequence
    number, then the encrypted payload, some padding, and finally an integrity check.


    The payload data contained within is the original IP packet that has been encrypted.
    We encrypt our data in tunnel mode and add an ESP header on top of it. That ESP
    header will provide me with information about the security parameter, index, and
    so on.'
