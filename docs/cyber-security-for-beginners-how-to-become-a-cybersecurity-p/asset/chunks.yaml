- raw: 'Once the Man in the Middle has poisoned the ARP table, the computer will believe
    that the new route to the internet is the new IP Address. As a result, every packet
    sent to the internet would be routed through the attacker.


    There are numerous ways to accomplish this using both wired and wireless networks.
    ARP poisoning via Man in the Middle attack can be accomplished in a variety of
    ways, but the concepts are always the same.


    # Chapter 20


    # Rogue Access Points


    # ![Rogue AP - fake access points - KaliTut](image.028.png)


    There are numerous ways to attack wireless networks, but let''s start with the
    fundamentals. Most people want to use free WiFi wherever they can; in fact, there
    are free wireless networks in many public places these days.


    Wireless networks are becoming more prevalent as more Access Points are deployed,
    sending wireless signals over the internet.


    Chatting on mobile devices, voice calls, live streaming, Internet banking, shopping,
    and other activities are examples of these signals.


    Because wireless networks are so prevalent in our daily lives, hackers have begun
    to exploit them by employing various techniques to gain control of Wireless Networks.


    Previously, hackers used wireless networks to gain access to company networks.
    Despite the fact that wireless networks are more secure, hackers continue to gain
    access through Wireless Access Points because many organizations do not implement
    good security measures within their Wireless Networks.


    People like to use free WIFI Hotspots, as I mentioned earlier, but many of us
    are unaware of the dangers of connecting to a Rogue Access Point that advertises
    itself as a genuine Free WIFI Hotspot.


    It is very simple to set up a rogue access point; therefore, large organizations
    must have a variety of security measures in place to protect their Wireless Network.


    Most access points do not use electricity; instead, they are PoE devices that
    use Power over Ethernet. As a result, access points must be linked to another
    network device that is turned on, such as a network switch. Because access points
    are not small, you will not see hackers walking around with one in their hands.


    Instead, hackers can use an operating system like Kali Linux to virtualize Access
    Points within a laptop. Hacking wireless networks are simple once Kali Linux is
    installed and bridged on a laptop.


    To become a Rogue Access Point on a Wireless Network, configure Kali Linux to
    begin monitoring Wireless signals and then analyze existing genuine Access Points
    in greater detail. Following that, you can learn the MAC addresses of the valid
    access points as well as the channel they use to transmit wireless signals.


    With that information, you can configure Kali Linux to advertise the same information
    as the valid Access Point, and then become the new fake Access Point, also known
    as a Rogue Access Point.


    There are many other configurations required, such as DHCP services or DHCP Server
    settings, to provide IP addresses to the clients who are now also victims, but
    Kali Linux makes the job very easy for any unskilled person as well.


    Another setting required for Rogue Access Points is "NAT," or Network Address
    Translation, which converts private IP addresses to public IP addresses. Finally,
    routing functionality must be configured so that victims can communicate with
    the internet via the Rogue Access Point.


    Rogue Access Points are also known as Man in the Middle attacks because they are
    placed between the victim and the destination address that the victim is visiting.


    # Chapter 21


    # Man in the Middle on Wireless Networks


    # ![What is MITM (Man in the Middle) Attack | Imperva](image.029.png)


    To continue, once there is a Man in the Middle, the Man in the Middle can capture
    anything the end-user does, including any website visits where usernames or passwords
    are required to be typed.


    In addition to capturing data, a Man in the Middle can modify details or even
    change data entry that the victim provides, such as when filling out important
    online forms. One of the most common ways that the Man in the Middle attack is
    used is to have victims connect to a Rogue Access Point via wireless networks.


    This is critical to understand, and end-users must be trained to always verify
    the Wireless SSID to which they are connecting.


    ## Attacks Based on Misconceptions


    You can use operating systems like Kali Linux to replicate or create any MAC address,
    allowing your laptop to function as any other network device.


    As a result, once you start monitoring wireless signals with your Virtualized
    Kali Linux, you can begin identifying Wireless Networks, where you can identify
    both the Access Point and the Clients that are associated with the Access Points.


    Once you have those details, you can either fake the MAC address of the Access
    Point and become a Rogue Wireless Access Point, or you can learn enough about
    the connected clients to begin replicating them.


    The MAC addresses of successfully connected devices are learned and remembered
    by most access points. That''s why you don''t have to type the password every
    time you connect to a wireless network to which you''ve previously provided a
    password.


    You won''t even have to click or select the SSID again because your device will
    automatically connect to trusted access points while in your pocket. However,
    keep in mind that trust between the client and the Access Point must be mutual.
    So the client device must not only trust the Wireless Access Point, but the Wireless
    Access Point must also trust the client device.


    Once Kali Linux has discovered the MAC address of an existing Client that has
    already established a connection with a trusted Wireless Access Point, all you
    have to do is replicate the trusted device''s MAC address and assign it to your
    own Kali Linux Wireless Interface.


    By replicating a trusted Client''s Mac Address and assigning it to your own Kali
    Linux interface, you still need to figure out how to connect to the wireless network,
    and this is where the trick comes in. To de-authenticate all existing trusted
    connected clients, send a de-authentication message to the Access Point.


    While all previously trusted clients would attempt to re-authenticate themselves
    to the wireless network to gain internet access, your device must connect to the
    wireless access point faster than the previously trusted device. You can use Kali
    Linux to make your wireless signal stronger to connect to the wireless access
    point faster.


    # Chapter 22


    # De-Authentication Attack


    # ![Deauthenticate Wireless Client - javatpoint](image.030.png)


    The goal of a Mis-Association Attack is for a hacker to become authenticated and
    authorized on a wireless network. Once you connect to a wireless network, you
    can do a variety of things, and hackers don''t use this technique for the sole
    purpose of obtaining free wireless internet, but rather to carry out a more sophisticated
    attack.


    The most common reason for hacking is for financial gain, but there are other
    reasons for hacking as well, such as espionage or impersonation.


    Sometimes hackers only intend to cause a simple network delay, something that
    would slow down the network, or cause issues such as individual devices failing
    to operate properly or connect to the network.


    With a tool like Kali Linux, you can monitor and learn all MAC addresses of trusted
    clients that are connected to the network, and once you''ve learned enough data
    about the clients, you can run an automated de-authentication request for every
    single trusted device that originates from an attacking laptop.


    The attacking laptop or Kali Linux would appear to the AP aka Access Point as
    if all re-authentication requests were coming from existing clients. In turn,
    the AP would deauthenticate all of those devices, leaving end-users perplexed
    as to why they had lost Internet access.'
