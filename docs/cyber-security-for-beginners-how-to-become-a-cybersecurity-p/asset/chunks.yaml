    社区整体因此受益。如果世界上任何地方的安全情报组织遇到前所未见的威胁，现在就有相关信息可供参考。尽管该组织可能已遭到攻破，但收集并共享的信息将使所有其他组织能够更好地保护自己免受该威胁。外部有许多安全情报云，它们都围绕相同的概念构建，但首先必须编写安全情报。一旦情报被创建，云就必须将其分发给参与者。最后，每个成员都必须消费情报，并以合理的方式应用它。在下一章中，我将介绍安全情报的各个方面。


    # Chapter 18


    # Authoring the intelligence


    # ![How The Right Authoring Tools Affect Training? - IntelligentHQ](img/image.026.jpeg)


    首先，让我们谈谈谁创建了情报。要编写关于当前威胁的任何情报，首先必须提供信息。遥测共享是安全情报云发现组织网络中实时发生情况的一种非常强大的方式。当设备本身将其看到的数据上传到更大的网络或云以进行进一步分析时，就会发生遥测共享。继续上一章中关于全球组织遇到前所未见威胁的示例。让我们称该组织为
    Sunshine Store。当威胁影响 Sunshine Store 时，他们的设备现在拥有关于该威胁的宝贵信息。如果他们参与威胁遥测共享，这些信息将与安全情报云的其余部分共享。这是从设备到云自动完成的，不需要安全工程师进行任何手动干预。安全情报云中的每个其他组织也在共享关于云威胁的关键信息。所有这些共享都提供了关于威胁的宝贵背景信息，这些信息无法来自单一来源。也许威胁在每个组织中每天发生的时间相同，或者威胁仅限于特定的国家或行业。通过让更大的样本池向云提供数据，可以做出更好的推断。


    云随后将对信息执行各种任务，例如对其进行归一化并分析以发现模式。情报云可以确定各种因素，例如威胁类型、攻击发生的频率、威胁用于获得访问权限的组织内部表面区域、影响的严重程度以及更多指标。如前所述，当云分析威胁时，它会确定是否存在目标行业、目标国家或其他模式。随着有关威胁的更多信息可用，安全情报云可以制定各种对策。安全情报云现在可以为云的所有产品生成不同的签名和内容更新。


    组织的电子邮件安全设备将参与安全情报云，并将向该电子邮件安全设备发布更新，以便它阻止威胁。例如，如果另一家公司决定加入威胁情报云，例如 Cisco Talos，他们将向电子邮件安全设备提供最新更新，以阻止被识别为使用电子邮件作为攻击媒介的威胁。这与入侵防御系统相同。将围绕所有可以使用
    IPS（入侵防御系统）阻止的威胁创建更新。因此，任何安装该更新的 IPS 都将阻止这种新威胁。Cisco Talos 将在公司的下一代入侵防御系统上接收更新。这引出了安全情报的共享和消费。既然安全情报云已经为其遇到的威胁创建了各种更新和签名，现在是时候将它们与安全情报社区的其余部分共享了。


    这通常通过内容更新推送来完成，Cisco Talos 等组织每隔 3-5 分钟就会发布内容更新。一旦更新下载完成，每个设备现在必须安装它，一旦内容安装完成，每个设备现在就准备好阻止最新威胁了。同样，一种新威胁已经影响了安全情报云中的组织，包括
    Sunshine Store。因为另一家公司正在参与云，一旦威胁被分析，就发现了适当的缓解措施，并创建、推送和安装了更新。这家新公司现在免受这种新威胁的影响。这之所以如此有益，是因为它发生在无需安全工程师手动干预的情况下。


    他们不再需要自行进行这项研究，想出如何阻止它，然后手动应用他们的更改。说到研究，我想指出，安全情报信息共享不仅仅指设备接收到的自动更新。它是一个整个生态系统，使安全专业人员能够了解威胁。虽然网络安全设备可以自动配置以阻止新威胁，这很好，但如果管理员不知道正在实施的威胁和缓解措施，那将是一种不负责任的行为。更好地了解最新的安全威胁只会对您作为安全工程师有所帮助。您越了解各种类型的威胁以及它们用于渗透网络和造成混乱的实际方法，您就越能理解大局。


    # Chapter 19


    # ARP Poisoning


    # ![ARP spoofing attacks - CCNA Security 210-260 Certification Guide \[Book\]](image.027.png)


    说到中间人攻击，它可以有多种形式，但最常见的是称为 ARP 中毒。


    要了解 ARP 中毒，您必须首先了解 ARP（也称为地址解析协议）的工作原理。


    ARP 将 IP 地址转换为连接到特定网络设备的所有网络设备的 MAC 地址，也称为物理地址。Windows 机器上的命令是 `arp –a`，但其他操作系统也可以使用相同的命令。


    要在 Windows 操作系统上启动命令提示符，请单击“开始”按钮，输入 Command Prompt，然后按 Enter。之后，只需输入 `arp` 并按
    Enter 即可查看与 `arp` 命令相关的所有选项。


    完成这些操作后，您会注意到以下变体；


    • `Arp – a` > 此命令显示计算机所知道的网络中当前的 ARP 条目，列出这些设备的 IP 地址和 MAC 地址。


    • `Arp – d` > 此命令删除您指定的主机的 ARP 条目。


    • `Arp – s` > 此命令将帮助您添加主机并为其分配 IP 地址。


    • `Arp – v` > 此命令以详细模式显示当前的 ARP 条目，以及所有无效条目和回环接口。


    这些是 ARP 相关的一些基本变体和选项，但没有必要了解所有可用选项。


    要回到 ARP 中毒，一旦连接，同一网络上的计算机和网络设备会互相学习对方的 Mac 地址。一旦它们学习了对方的 MAC 地址，就会创建一个 ARP 表，并将来使用该表在同一网络上定位彼此。


    ARP 正是通过这种方式帮助计算机和网络设备在网络上轻松发现彼此；然而，黑客会利用 ARP 表，通过使用虚假 MAC 地址将自己引入网络，欺骗计算机认为它们是新的路由器。结果，真实的
    ARP 表会被虚假条目污染。


    '
