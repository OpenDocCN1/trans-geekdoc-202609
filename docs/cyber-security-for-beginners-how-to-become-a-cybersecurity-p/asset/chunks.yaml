- raw: 'We''ll add a new IP header that isn''t encrypted and can be used to route
    traffic. While the ESP trailer should be encrypted, not all of it is because we
    wouldn''t know where the end of the packet is if we didn''t know where the end
    of the packet is, the majority of that trailer is encrypted and then we can authenticate
    this entire ESP header, plus the encrypted data and the ESP authentication, we
    can use SHA-1, SHA-256, or MD-5 to do the ESP authentication. That is if we are
    in tunnel mode.


    When we''re in transport mode, the data is encrypted but not the original IP header.
    So, if you tried to send private network traffic over the internet, you wouldn''t
    be able to use transport mode because the IP header would be a private IP address
    rather than the public address. That is what the new header is for: to connect
    us to the internet. So that''s what ESP is.


    AH, on the other hand, is an abbreviation for Authentication Header. The authentication
    header authenticates, and one example is where we take our original IP header
    and data and authenticate it.


    The only part that we don''t authenticate is what''s known as a mutable field.
    A mutable field changes as it moves; therefore, can you think of anything in an
    IP packet that changes while it is in transit?


    You''re correct if you think it''s the TTL value or Time to Live because it decrements
    with each hop. As a result, this is a mutable field.


    We''re not going to authenticate that because if we route the packet from hop
    to hop and the TTL changes, the hash will make no sense when we recreate it on
    the other end and compare it. It''s not going to work.


    So, with AH, we can use transport mode or tunnel mode. Except for the mutable
    fields in the new IP header, AH has a new IP header and everything is authenticated.
    So that''s an overview of ESP and AH, and we mostly use ESP these days because
    it supports Network Address Translation and connects us to the internet.


    Everything we''ve discussed so far is considered a foundation component of VPN.
    So, in terms of core components, we have IPsec, which will provide me with certain
    building blocks, and we''ll need to plug all of these building blocks in for the
    VPN to work.


    So we need an ISAKMP policy, Diffie-Hellman keys, ESP, or AH, and we need to decide
    what kind of traffic should be encrypted. We can do this, for example, with an
    access control list. All of these little building blocks come together, and when
    we plug them all into our configuration, it forms an IPsec VPN, and we can now
    safely transmit our traffic across the network.


    Many people say, "I have VPN" or "I use VPN," but they often don''t understand
    what VPN is or what VPN-s can do for us.


    As a result, I wanted to explain in a nutshell what a VPN is.


    Just keep in mind that VPN consists of three components: confidentiality, data
    integrity, and data origin authentication. We talked about what makes all of that
    happen, the protocols, hash algorithms, key exchange methods, and security associations,
    and how when we put all of that together, all of those building blocks, they create
    a secure IPsec VPN.'
  fmt: '

    # IPsec VPN 核心组件与工作原理


    ## ESP（封装安全载荷）


    We''ll add a new IP header that isn''t encrypted and can be used to route traffic.
    While the ESP trailer should be encrypted, not all of it is because we wouldn''t
    know where the end of the packet is if we didn''t know where the end of the packet
    is, the majority of that trailer is encrypted and then we can authenticate this
    entire ESP header, plus the encrypted data and the ESP authentication, we can
    use `SHA-1`, `SHA-256`, or `MD-5` to do the ESP authentication. That is if we
    are in tunnel mode.


    When we''re in transport mode, the data is encrypted but not the original IP header.
    So, if you tried to send private network traffic over the internet, you wouldn''t
    be able to use transport mode because the IP header would be a private IP address
    rather than the public address. That is what the new header is for: to connect
    us to the internet. So that''s what ESP is.


    ## AH（认证报头）


    AH, on the other hand, is an abbreviation for Authentication Header. The authentication
    header authenticates, and one example is where we take our original IP header
    and data and authenticate it.


    The only part that we don''t authenticate is what''s known as a mutable field.
    A mutable field changes as it moves; therefore, can you think of anything in an
    IP packet that changes while it is in transit?


    You''re correct if you think it''s the `TTL` value or Time to Live because it
    decrements with each hop. As a result, this is a mutable field.


    We''re not going to authenticate that because if we route the packet from hop
    to hop and the `TTL` changes, the hash will make no sense when we recreate it
    on the other end and compare it. It''s not going to work.


    So, with AH, we can use transport mode or tunnel mode. Except for the mutable
    fields in the new IP header, AH has a new IP header and everything is authenticated.
    So that''s an overview of ESP and AH, and we mostly use ESP these days because
    it supports Network Address Translation and connects us to the internet.


    ## IPsec VPN 的构建块


    Everything we''ve discussed so far is considered a foundation component of VPN.
    So, in terms of core components, we have `IPsec`, which will provide me with certain
    building blocks, and we''ll need to plug all of these building blocks in for the
    VPN to work.


    So we need an `ISAKMP` policy, `Diffie-Hellman` keys, `ESP`, or `AH`, and we need
    to decide what kind of traffic should be encrypted. We can do this, for example,
    with an access control list. All of these little building blocks come together,
    and when we plug them all into our configuration, it forms an `IPsec VPN`, and
    we can now safely transmit our traffic across the network.


    ## VPN 概述


    Many people say, "I have VPN" or "I use VPN," but they often don''t understand
    what VPN is or what VPN-s can do for us.


    As a result, I wanted to explain in a nutshell what a VPN is.


    Just keep in mind that VPN consists of three components: confidentiality, data
    integrity, and data origin authentication. We talked about what makes all of that
    happen, the protocols, hash algorithms, key exchange methods, and security associations,
    and how when we put all of that together, all of those building blocks, they create
    a secure `IPsec VPN`.

    '
  trans: '


    # IPsec VPN 核心组件与工作原理


    ## ESP（封装安全载荷）


    我们将添加一个未加密的新 IP 头，可用于路由流量。ESP 尾部应当加密，但并非全部加密，因为如果不知道数据包的结束位置，我们就无法确定数据包的结束位置，该尾部的大部分会被加密，然后我们可以对整个
    ESP 头、加密数据以及 ESP 认证进行认证，可使用 `SHA-1`、`SHA-256` 或 `MD-5` 进行 ESP 认证。前提是我们处于隧道模式。


    当我们处于传输模式时，数据会被加密，但原始 IP 头不会被加密。因此，如果你尝试通过互联网发送专用网络流量，就无法使用传输模式，因为 IP 头将是专用 IP
    地址而非公共地址。新头部的作用就是：将我们连接到互联网。这就是 ESP 的含义。


    ## AH（认证报头）


    另一方面，AH 是 Authentication Header 的缩写。认证报头用于认证，例如，我们对原始 IP 头和数据进行认证。


    我们不认证的唯一部分是所谓的可变字段。可变字段在传输过程中会发生变化，因此你能否想到 IP 数据包中在传输过程中会变化的内容？


    如果你认为是 `TTL` 值（生存时间），那你是正确的，因为它在每经过一跳时都会递减。因此，这是一个可变字段。


    我们不会对其进行认证，因为如果我们将数据包逐跳路由且 `TTL` 发生变化，那么在另一端重新创建哈希并进行比较时，哈希将毫无意义，无法工作。


    因此，使用 AH 时，可以使用传输模式或隧道模式。除了新 IP 头中的可变字段外，AH 有一个新 IP 头，所有内容都会被认证。这就是 ESP 和 AH 的概述，如今我们大多使用
    ESP，因为它支持网络地址转换并能将我们连接到互联网。


    ## IPsec VPN 的构建块


    我们迄今讨论的所有内容都被视为 VPN 的基础组件。因此，就核心组件而言，我们有 `IPsec`，它将为我提供某些构建块，我们需要将所有这些构建块都插入，VPN
    才能工作。


    因此，我们需要一个 `ISAKMP` 策略、`Diffie-Hellman` 密钥、`ESP` 或 `AH`，并且需要决定哪种流量应当被加密。例如，我们可以使用访问控制列表来实现这一点。所有这些小型构建块结合在一起，当我们将它们全部插入配置时，就会形成一个
    `IPsec VPN`，我们现在可以安全地在网络中传输流量。


    ## VPN 概述


    许多人说“我有 VPN”或“我使用 VPN”，但他们通常不了解 VPN 是什么，或者 VPN 能为我们做什么。


    因此，我想简要解释一下什么是 VPN。


    请记住，VPN 由三个组件组成：机密性、数据完整性和数据源认证。我们讨论了使所有这些成为可能的协议、哈希算法、密钥交换方法和安全关联，以及当我们将所有这些构建块结合在一起时，它们如何创建一个安全的
    `IPsec VPN`。


    '
