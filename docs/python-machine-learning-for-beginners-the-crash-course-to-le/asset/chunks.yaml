    ### Sublime Text


    对于 Python 编程，最著名的文本编辑器之一是 `Sublime Text` 编辑器。它拥有文本编辑器可以的所有顶级功能。基本上，这个文本编辑器是用 `C++`
    编程语言开发的，但你也可以用它支持 Python。


    许多编程语言都支持它的更新版本。`Jon Skinner` 是创建它的人，它于 2007 年进入市场。他遵循这三个基本规则来开发这个文本编辑器。它的内容不会被窗口隐藏。


