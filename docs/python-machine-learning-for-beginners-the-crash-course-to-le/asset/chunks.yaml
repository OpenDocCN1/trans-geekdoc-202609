    让我们从 `Python` 的一些独特特征开始。


    ### ### 易于理解和编码


    当我们对 Python 编程使用“简单”或“容易”一词时，我们必须从非常不同的语境来看待它。


    我们之前读过 Python 语言是一门高级语言。通常情况下，通过非常少的关键字和标识符，你可能会发现 Python 代码与英语如出一。任何程序员甚至非程序员都可以通过查看代码看出这段代码的作用。


    然而，Python 是动态类型语言，这需要使用缩进。这一功能（特性）使得 Python 的代码更加稳定且易于理解。


    此外，在写完第一个程序后，我们可以发现在 Python 中编写代码是毫不费力的事情。我们可能会发现，与其他编程语言相比，Python 的代码更容易上手。在几个小时内，一个具有编程背景的人就能学会
    Python 的语法。


    然而，要精通 Python 编程及其原理、模块和包还需要一些时间。因此，换句话说，我们可以说 Python 是一门**开发者友好**的语言。


    ### ### 开源且免费


    首先，你可能知道 Python 是免费的，并且在许多平台上都可用。它的官方网站是下载和安装 Python 最可靠的来源，即：


    `https://www.python.org/`


    第二点是，Python 是一门开源编程语言。开源确保了公众可以随时访问 Python 的源代码。即使是非专业人士也可以下载、修改、使用和分发 Python。`FLOSS`
    通常将此类软件或语言称为“自由、许可和开源软件”。所有的 Python 开发者都在 Python 世界中为了一个共同的目标努力，即增强 Python 及其功能。Python
    正此将源代码设为开源代码。


    ### ### 高级语言


    从书的开始，我们一直在讨论这样一个观点：Python 是一门高级计算机编程语言。


    作为一名开发者，你不需要思考或回忆你的计算机或设备的设计。用 Python 编写的代码可以在全球范围内任何程序、机器或系统上运行。你不需要关心系统的内存。这一功能使得在
    Python 中编写和编码变得更容易。因此，我们可以像之前描述的那样称 Python 为“开发者友好语言”。


    ### ### 便语言


    对于你面向 Windows 系统的计算机，假设你构建了一个 Python 程序或应用。假设你只想在面向 MAC 系统的计算机上运行该程序。现在，你不需要对
    Python 代码进行太多的修改。


    你可以从面向 Windows 系统的计算机上获取 Python 代码并在任何 MAC 机器上运行它。因此，如果你使用 Python，就不必为不同的工具或操作系统编写不同的代码。这一
    Python 特性使得我们的语言成为一种极具移植性的编程语言。


    ### ### 解释型语言


    如果你使用 Python，你的代码不需要编译。这是因为 Python 是一种解释型语言，意味着代码是按行执行的。


    ### ### 面对象语言


    我们从开始就在讨论这个观点：`Python` 是一门面向对象的语言。这意味着它关注对象，并将数据和函数结合。Python 在其范式中支持多重继承。


    ### ### 可扩展语言


    假设你是某些编程语言的开发者。Python 是非常有扩展性的，这意味着它可以被扩展和扩大以包含其他语言。


    ### ### 嵌入式语言


    在之前的阶段，我们已经提到其他语言的代码和命令也可以被我们的 Python 代码接受。这有助于我们整合其他语言的脚本能力。


    ### ### 标准库


    通过丰富的包和库，你可以下载 Python，这样你就不需要为软件中的每一项都编写完整的代码。常用短语、各种版本的文档、测试单元、网站和浏览器的创建、线程、数据库的开发和维护、流行接口、电子邮件的开发和维护以及许多形式的图像处理都有相应的库。


    ### ### 图形界面编程


    除非你创建图形界面（GUI），否则任何应用程序或软件可能都不够友好。通过你软件的图形界面，任何使用你软件的用户都可以轻松与其交互。为了改进程序、应用的图形界面，Python
    提供了一系列库。其中 `wxPython`、`JPython` 和 `Tkinter` 最受欢迎。


    # 2.2 Python 版本


    ### ### 第一阶段


    Python 在 1994 年 1 月的第一阶段开发并发布了其第一个版本，即 `Python 1.0`。函数式编程工具如 `reduce`、`filter`、`lambda`
    和 `map` 是该版本实现的关键特性。`Python 1.2` 是 Rossum 先生仍在 `CWI` 工作时发布的最后更新。该版本于 1995 年出版。


