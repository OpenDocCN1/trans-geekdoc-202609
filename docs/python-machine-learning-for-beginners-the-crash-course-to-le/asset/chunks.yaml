    *   PyDatalog


    This is a Python logic programming engine.


    *   Easy


    It was used to build a basic two-player Python engine for AI games. (ex: Negamax)
    (in French only)


    *   PyBrain 


    A simple but powerful Machine Learning algorithm for evaluating and comparing
    predefined environments.


    *   PyML


