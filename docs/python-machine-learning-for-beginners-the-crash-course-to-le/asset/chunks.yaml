    在 Python 中，运算符被表示为函数的符号表示，为了实现某些真实且期望的结果，它在两个操作数之间执行特定的操作。在单个计算机编程语言中，运算符被视为软件运行的基石。Python
    提供的运算符选择被看作一种追求。为了执行基本操作，这里是一些被广泛使用的运算符：


    * 算术运算符

    * 比较运算符

    * 赋值运算符

    * 逻辑运算符

    * 位运算符

    * 成员运算符

    * 标识运算符


    在本书的这一章节中，我们将讨论上述提到的一些运算符。


    ### 算术运算符


    为了获得期望的结果，算术运算符被用于执行复杂的算术运算。在这种情况下，取两个操作数，并通过运算符在它们之间执行操作，从而产生某些期望的、唯一且绝对的值。


    以下是 Python 中广泛使用且重要实用的算术运算符：


    * 加法 `"+"`

    * 减法 `"-"`

    * 除法 `"/"`

    * 乘法 `"*"`

    * 取余 `"%"`


    这些运算符的详细定义：


    * 加法 `"+"`


    该运算符用于两个操作数之间，执行加法或求和操作。


    示例：

    ```

    >>> n, v = 25, 25

    >>> n + v

    ```

    在这种情况下，你的控制台将打印

    “50”


    * 减法 `"-"`


    该运算符取第一个操作数，并从第一个操作数减去第二个操作数。


    示例：

    ```

    >>> n, v = 25, 25

    >>> n - v

    ```

    在这种情况下，你的控制台将打印

    “0”


    * 除法 `"/"`


    该运算符取第二个操作数并将第二个操作数除以第一个操作数，并根据你的性能给出商。


    示例：

    ```

    >>> n, v = 6, 2

    >>> n / v

    ```

    在这种情况下，你的控制台将打印

    “3.0”


    * 乘法 `"*"`


    该运算符如前所述，在第一个操作数和第二个操作数之间执行乘法操作。


    示例：

    ```

    >>> n, v = 6, 3

    >>> n * v

    ```

    在这种情况下，你的控制台将打印

    “18”


    * 取余 `"%"`


    该运算符负责除法服务，并接收余数作为你的产。


    示例：

    ```

    >>> c, w = 4, 2

    >>> c % w

    ```

    在这种情况下，你的控制台将打印

    “0”


    ### Python 的比较运算符


    当我们谈论 Python 时，比较运算符被用于比较两个操作数，并分别返回一个布尔类型，即 TRUE 或 FALSE。


    * `==`

    真实：当且仅当值逻辑上相等且有效时，使用此运算符。

    * `!=`

    真实：当值准确但不相等时，使用此运算符。

    * `<=`

    真：当第一个操作数小于或等于第二个操作数时，使用此运算符。

    * `>=`

    真：当你的第一个操作数大于或等于第二个操作数时，使用此运算符。

    * `<>`

    真：当且仅当两个值不等时，使用此运算符。

    * `>`

    真：当你的第一个操作数大于第二个操作数时，使用此运算符。

    * `<`

    真：如果第一个操作数小于第二个操作数，使用此运算符。


    ### Python 的赋值运算符


    在 Python 中，我们使用赋值运算符将右表达式的值赋值给左侧的操作数。


    * `=`

    该运算符通常用于将左操作数的值赋值给右表达式。

    * `+=`

    通过估算正确的操作数，该运算符用于构建左侧操作数的估计，并将修改后的机会赋回左侧操作数。


    示例：

    ```

    >>> n = 2, v = 4

    >>> n += v

    ```

    这等同于

    ```

    >>> n = n + v

    >>> print (n)

    ```

    如果 `n` 为 "6"，你的控制台可能会打印该值。


    * `-=`

    关于该运算符，左侧操作数的估计通过减去右侧操作数的估计来减少并将并将后的激励赋回左侧操作数。


    示例：

    ```

    >>> n, v = 4, 2

    >>> n -= v

    ```

    这等同于：

    ```

    n = n - v

    >>>print (n)

    ```

    你的控制台可能会打印

    "2"


    * `*=`

    通过估算正确的操作数，它增加了左侧操作数的估计，并将调整后的奖励赋回左侧操作数。


    示例：

    ```

    >>> n, v = 4 , 2

    >>> a * = b

    ```

    这等同于

    ```

    n = n * v

    >>> print (n)

    ```

    如果 `n` 为 "8"，你的控制台可能会打印该值。


    * `%=`

    该运算符负责将左侧操作数的计算除以右侧操作数的计算，并将更新赋回左侧操作数。


    示例：

    ```

    >>> n, v = 4 , 2

    >>> a % = b

    ```

    这等同于

    ```

    n = n % v

    >>> print (n)

    ```

    如果 `n` 为 “0”，你的控制台可能会打印该值。


    ### Python 中的逻辑运算符


    就我们的现实生活而言，我们也必须根据逻辑事实（即真或假）做出困难的决定。例如，假设有人打电话并问你：“你在家吗？”


    * `And` 运算符

    如果两个操作数都为真，结果为真。

    * `Or` 运算符

    如果至少有一个操作数为真，结果为真。

    * `Not` 运算符

    反转操作数的逻辑状态。


    ### 5.3 Python 数据类型


    数据类型指定了可以应用于值的一组操作和值。例如，由于它有两个不同的值，灯泡的开关可以与计算机系统相比；True 表示开，False 表示关。由于灯泡开关只包含这两个值，我们可以认为它的大小为二。对于灯泡开关，只有两种操作可以执行：


    * 我们可以开启

    * 我们可以关闭


    Python 中的因子可以携带不同类型的数据。Python 是一种动态类型的语言，因此在声明和描述它们时，我们不需要描述所有变量的形式。变量将其与其类型绑定。


    此外，Python 允许开发者验证软件中使用的变量类型。Python 提供了 `type()` 结构，它返回传递的变量类型。为了描述各种数据类型的形式，你可以参考以下指南。


    示例：

    ```

    >>> C = 69

    >>> W = "Hi Python"

    >>> K = 17.5

    >>> print ( type (C));

    >>> print ( type (W));

    >>> print ( type (K));

