    等标准 Python 科学库，`SPYDER` 协调得很好。


    你可以想象 `SPYDER` 拥有大量的内置 IDE 功能。例如，`SPYDER` 是一个具有持久语言结构特性的 Python 代码管理器。此外，它包含了
    Python 代码实现，甚至还是 `IDP`，即集成文档程序。


    另一个你在其他 Python IDE 中可能看不到的元素是 `SPYDER` 包含一个向前的“变量航游者”（variable voyager）。它允许你在使用基于表格的设计的同时在
    IDE 中显示信息。


    #### 特殊特性：

    * 集成 `IPython`

    * 良好的语法质量


    ### PYDEV IDE


    `PYDEV` IDE 是世界上需求量巨大的 Python IDE 之一。对于 Python 开发者而言，出于许多原因，他们倾向于使用 `PYDEV`。`PYDEV`
    有一个功能包含 `"django"` 组合、智能缩进、程序代码的实现和块缩进等许多功能。


    面向 `Windows OS`、`MAC OS X` 和 `Linux OS` 的机器使得 `PYDEV` 可用。我们也可以将 `PYDEV` 视为基于 `Java`
    开发的认可的开源 IDE。它包含了一个用于附加和扩展项目的商业中心。这一功能使得 `PYDEV` 适用于广泛的和练习。


    #### 特殊特性：

    * `PyLint`、远程调试器、单元测试结合的组合。

    * 代码的检查和验证。


    ### Atom IDE


    `Atom IDE` 是由 `GitHub` 开发的 Python 最流行的 IDE。它是一个开源且跨平台的 IDE。


    在 `Atom IDE` 中，你可以分步了解关于 IDE 的功能。这种集成开发技术允许你在不同平台之间工作。这就是为什么 `Atom IDE` 被广泛推崇。尽管它也有缺点，但对于爱好者和初学者来说，它被认为是最好的工具。除了它的优点之外，`Atom
    IDE` 是让你处理高级编程语言的科学工具之一。


    #### 特殊特性：

    * 拥有 `Markdown Preview` 模块

    * 它在运行窗口中显示结果


    ### Wing IDE


    首先，`Wing IDE` 是免费且开源的。它包含了一些可以用于实现、调查和缩进的功能。


    它还有一个名为 `Wing Pro` 的付费版本。使用 `Wing Pro` 的好处是它可以为你的 Python 代码提供调试、突出显示等。


    #### 特殊特性：

    * 结合单元测试，它支持远程

    * 它可以自定义并插件


    ### Jupyter Notebook IDE


    `Jupyter IDE` 是为服务器客户端结构设计的 IDE。对于你的 Python 程序，它允许你创建和控制记本文档。2014 年 10 月，Jupyter
    notebook 发布了 `IPython`。它是一个基于服务器客户端结构的 Web 应用程序，同时也允许你创建、自定义和控制在记笔记本上的报告。


    然而，Jupyter Notebook 证明它是每个 Python 数据研究工具箱中不可或缺的一部分。对于原型开发非常出色，也用于展示记笔记本的形式。


    #### 特殊特性：

    * 你的代码可以在此 IDE 中生成并轻松修改

    * Jupyter 笔记本提供了 markdown 支持


