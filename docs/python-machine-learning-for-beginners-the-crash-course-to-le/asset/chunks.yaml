- raw: "In 1995, Mr. Van Rossum worked at the Company for National Research Initiatives\
    \ on his own invented language, Python. He released several other versions of\
    \ Python from there. Python gained several new and unknown features of its own\
    \ with the release of Python 1.4. Modula-3 was the most common among these features.\
    \ To inspire keyword-arguments, Modula-3 was. They also implemented a simple form\
    \ of data hiding in Python 1.4 through the use of name mangling.\n\nComputer Programming\
    \ for All, which is called CP4E, was also introduced by Van Rossum. His goal was\
    \ to make programming, with the requisite know-how of many computer programming\
    \ languages, available to laypeople. Python has played an essential role in this\
    \ respect. The explanation was that there is a simple and straightforward syntax\
    \ for Python.\n\nPython 1.6 was the next Python version. They launched a new CNRI\
    \ license in Python 1.6. With some bug fixes, Python 1.6 released another version\
    \ of itself.\n\n### Phase – 2\n\nIn Python's second Phase, Python published its\
    \ version of Python 2.0.0. In October 2000, it was released. Python implemented\
    \ list comprehension in this edition. This was a functionality Python borrowed\
    \ from the other languages of practical computer programming. Python then implemented\
    \ Python 2.1, which was similar to Python 1.6.1 and was closely aligned with Python\
    \ 2.0.0.0. In order to accommodate the nested scopes, the introduction of Python\
    \ 2.1 implemented a fundamental change to allow it to compete with other statically\
    \ scoped programming languages.\n\nGoing on, Python 2.2 was the next version of\
    \ Python. In 2001, Python 2.2 was released. Python was able to implement a significant\
    \ improvement in this version, unifying the categories of Python, i.e., separate\
    \ classes in a single hierarchy. This transition was the fundamental reason why\
    \ Python became the programming language of the object-oriented Paradigm. Python\
    \ 2.5 was the next Python version. In September 2006, Python released this version.\
    \ Statements that we're able to enclose any code block with a context manager\
    \ were the required improvement in this version.\n\nPython 2.6.1 and Python 2.7.0\
    \ were the next versions released by Python during Phase-2. Python 2.6 was created\
    \ to support Python 3.0, and with the introduction of Python 3.0, there were some\
    \ bugs, alerts, and syntax errors that were debugged. Python 2.7 was, on the other\
    \ hand, released to support Python 3.1.\n\n### Phase – 3\n\nPython released Python\
    \ 3.0.0. In Phase – 3 of Python development. Often known as Py3K or Python 3000,\
    \ Python 3.0 is in 2008, Python 3000 was released. Besides, to overcome Python's\
    \ flaws, Py3K was developed.\n\nPython 3.0 is called a language with a multi-paradigm.\
    \ However, developers can still use it as a standardized, functional, and object-oriented\
    \ paradigm programming language as opposed to other programming languages.\n\n\
