    * `<>`

    True: If, and only if both the values are not equal, this operator is used.

    * `>`

    True: When your first operand is greater than the second operand, this operator
    is used.

    * `<`

    True: This operator is used if the first operand is smaller than the second operand.


    ### Assignment Operators of Python


    In Python, we use assignment operators to assign the value of the right-hand expression
    to the left-hand operand.


    * `=`

    This operator is commonly used to assign the value of the left operand to the
    right expression.

    * `+=`

    By estimating the correct operand, this operator is used to construct the estimate
    of the left operand and designate the altered an opportunity back to the left
    operand.


    Example Given:

    ```

    >>> n = 2, v = 4

    >>> n += v

    ```

    This will be equivalent to

    ```

    >>> n = n + v

