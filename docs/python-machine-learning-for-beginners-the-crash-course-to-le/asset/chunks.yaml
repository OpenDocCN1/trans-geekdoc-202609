    * `And` Operator

    If both operands are true, the result is true.

    * `Or` Operator

    If at least one operand is true, the result is true.

    * `Not` Operator

    Inverts the logical state of the operand.


    ### 5.3 Data Types in Python


    A data form specifies a set of operations and values which can be applied to the
