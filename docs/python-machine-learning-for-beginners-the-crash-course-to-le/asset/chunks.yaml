    ## 结语


    恭喜！你已经读到了这里。我们希望你已经真正开始理解 Python 的基本概念和复杂性。此时，我们假设你应该能够自信地阅读任何 Python 代码了。


    我们尝试在书中涵盖许多重要的 Python 概念和特性，包括面向对象编程的概念（即 OOP）。此外，我们努力让写作变得清晰易懂，书中包含了许多理论、实践性的示例。


    在计算机科学和计算机编程领域，你可能会发现许多学术书籍。它们中的许多是为学生设计的。你可能会发现一些专门为需要解决开发过程中语法问题和运行时问题的专业开发人员设计的书籍。如果你通过编程学习，在书中很少页面没有
    `Python` 源码，但每个概念都通过至少一个代码示例进行了演示。


    未来，如果你是 Python 的初学者，只需阅读这本书即可，书中包含了八个章节，使你能够在一周内更好地了解 Python。


