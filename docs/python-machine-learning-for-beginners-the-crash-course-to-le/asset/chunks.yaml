    # 第 3 章：编译器、文本编辑器和 IDE


    Python 编译器、IDE 和文本编辑器在 Python 编程中起着至关重要的作用。与其他编程语言一样，我们有许多应用程序、编译器和文本编辑器可以以非常简化的方式编译
    Python 语法。在本章中，我们将学习编译器、文本编辑器和 IDE。


    ## 3.1 Python 编译器


    如果你有编程背景，需要知道编译器是一种用于代码翻译的应用程序，或者说是一种简单的软件，它能将你编写的代码从高阶计算机编程语言转换为机器语言，以便计算机能够理解。Python
    有许多编译器，它们都有自己特定的计算机编程语言转换系统。许多程序员使用这些编译器来调试程序，或使代码具有可执行性，或为程序创建算法。


    `PyCharm` 是大多数 Python 程序员在进行 Python 编程时最喜欢的 IDE 之一。


    在本书的范围内，我们将讨论一些最好的编译器。


    ### NUITKA 编译器


    `NUITKA` 是一个非常著名的 Python 编译器，用于编译和执行你的代码。`NUITKA` 将你编写的 Python 代码作为输入并进行编译和执行；它将你的代码转换为
    C。在几乎每一个操作系统和平台上你都可以访问 `NUITKA`。`NUITKA` 定期更新，Windows、`MAC`、`UNIX` 以及其他操作系统变得非常用户友好。


    `NUITKA` 的另一个特性是，你可以在未在工作站安装 Python 的情况下对其进行编码。


    `NUITKA` 是一个基于 Python 的编译器，通常不支持任何其他语言。因此，对于 Python 开发，它拥有不同的功能和库。开发者还使用 `NUITKA`
    来开发人工智能和信息科学程序。


    ### PYJS 编译器


    许多专业级程序员和软件开发公司使用 `PYJS` 编译器作为 Python 的编译器。它是一种不同类型的编译器。它最广为人知的特性是它可以将 JavaScript
    转换为你的 Python 代码。因为其在 Web 程序方面的独特特性，大多数网站开发者更倾向于这种编译器。


    当我们谈论 `PYJS` 提供的独特特性时，`PYJS` 提供了运行时支持。这就是为什么 Web 开发者主要推荐将其用于 Web 应用程序和程序。它支持那些希望用
    Python 编写代码并直接在网页浏览器上运行的人。`PYJS` 还会将你的 Python 代码解释为经过调试的 `JavaScript` 代码，这些代码可以在你指定的互联网浏览器上执行和运行。


    此外，`PYJS` 是一个非常轻量级的编译器。此外，`PYJS` 还为运行时错误的调试提供了运行时支持。


    ### SKULPT 编译器


    在你的网页浏览器中，`SKULPT` 编译器也可以直接执行编写的 Python 代码。你的 Python 代码变得更具执行性。在某个网站页面的博客中，`SKULPT`
    最近被引入。要将你的 Python 代码转换为 HTML，也可以使用 `SKULPT`。你的代码还可以用 `JavaScript` 结构编译以供你的网页浏览器使用。


    在网页浏览器中运行 Python 不需要任何额外的模块、文件或服务器设置，因为我们已经讨论过 `SKULPT` 是 Python 使用的一个程序。每个在 `SKULPT`
    中编写的 Python 代码都将从你的网页浏览器直接执行。


    许多 Web 工程师和 Web 开发者想要开发某些 Web 应用程序，允许用户在浏览器中直接执行 Python 程序并使用 `SKULPT`。


    ### BRYTHON 编译器


    Python 的编译器之一被认为是 `BRYTHON`。同样，它将你的 Python 代码转换为 `JavaScript` 代码。这种编译器具有一些独特特性，作为第三方编辑器，它可以转换你的代码和程序，以最短的时间内获得卓越的结果。此外，对于许多支持
    `CPython` 的模块，该编译器提供了实时协助。需要记住的是，该编译器也支持许多其他语言。对于用户端的 Web 编程，`BRYTHON` 被经常使用。这种编译器是一个
    Python 压缩包。


    ### Shed Skin 编译器


    Python 编译器中的一个被认为是 `Shed Skin`。它也是列表中的一个，用于 Python 编程的编译器。该编译器的主要特性是它可以将 C++ 程序转换为你的
    Python 向代码。`Shed Skin` 编译器的缺点是它没有为常见的错误和问题提供实时帮助。此外，支持的 Python 库和模块很少。


    你可能会发现 `Shed Skin` 编译器很有用，许多 Python 开发者使用它来提取静态编写的 Python 代码，以获得修改后的 C 和 C++ 代码。该编译器提供了基础显示支持，可以使用它。


