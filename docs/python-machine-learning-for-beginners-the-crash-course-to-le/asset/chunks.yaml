    1995 年，Van Rossum 先生在国家研究倡议公司（Company for National Research Initiatives）研究了他自己发明的语言
    `Python`。他在那里发布了其他几个版本的 `Python`。随着 `Python 1.4` 的发布，`Python` 获得了一些自己新的且未知的特性。这些特性中，`Modula-3`
    最常见。为了激发关键字参数的灵感，引入了 `Modula-3`。他们还通过 `Python 1.4` 中通过名称修饰（name mangling）实现了一种简单的数据隐藏形式。


    Van Rossum 还引入了名为 `CP4E` 的“全民计算机编程”（Computer Programming for All）。他的目标是让普通人也能掌握编程，以及许多计算机编程语言所需的专业知识。`Python`
    在这方面发挥了至关重要的作用。解释是 `Python` 拥有一种简单直观的语法。


    `Python 1.6` 是下一个 Python 版本。他们在 `Python 1.6` 中发布了新的 CNRI 许可。在修复了一些 bug 之后，`Python
    1.6` 发布了它的另一个版本。


    ### 第二阶段 – 2


    在 `Python` 的第二个阶段，`Python` 发布了 `Python 2.0.0` 版本。它于 2000 年 10 月发布。`Python` 在此版本中实现了列表推导式（list
    comprehension）。这是 `Python` 从其他实用计算机编程语言中借鉴的功能。随后 `Python` 实现了 `Python 2.1`，它类似于
    `Python 1.6.1` 并且与 `Python 2.0.0.0` 高密一致。为了适应嵌套作用域，`Python 2.1` 的引入实现了一个根本性的变化，使其能够与其他静态作用域编程语言竞争。


    接下来，`Python 2.2` 是 `Python` 的下一个版本。`Python 2.2` 于 2001 年发布。`Python` 在这个版本中实现了一个重大改进，统一了
