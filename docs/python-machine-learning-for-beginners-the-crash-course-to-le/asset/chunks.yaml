    \ December 2016 |\n\n| Python 3.7.6 || June 2018 |\n\n| Python 3.8.1 || October\
    \ 2019 |\n\n| Python 3.9.0 Alpha 1 || May 2020 (Expected Date) |\n\n## 2.3 Applications\
    \ of Python\n\nPython is an open-source and a commonly used programming language\
    \ for computers considered to be most useful, distinguishing it from other programming\
    \ languages. In several ways, Python as a language can be used in any computer\
    \ programming discipline.\n\n### Web Application Development\n\nTo build many\
    \ kinds of web applications, you can use Python. To develop and manage websites\
    \ and web applications, Python provides you with several libraries. Email Handling,\
    \ lovely soup, demand, JSON, XML, HTML, and many others, for example. Besides,\
    \ Python provides you with many built-in frameworks to manage and build software\
    \ and web applications, such as Pyramid, Flask, Django (we spoke about this in\
    \ chapter – 1), and many more.\n\n### Desktop Graphical User Interface Applications\n\
    \nTo build a user interface for Python-based programs, Python provides you with\
    \ several graphical user interface libraries. Kivy and wxWidgets are some of the\
    \ tools and applications in this respect. In several developmental stages, you\
    \ can use these resources. Keep in mind that Kivy is commonly used to create multi-touch\
    \ applications.\n\n### Software Development\n\nTo advance computer programming\
    \ procedures, you can use Python. Python serves as a supporting language and can\
    \ be used for software testing, control fabrication, and board testing.\n\n###\
    \ Scientific and Numeric Usage\n\nPython is a mainstream language that is widely\
    \ used to describe logical, numerical issues. You could find many Python bundles\
    \ and Python libraries useful in this regard, such as IPython, Pandas, SciPy,\
    \ etc.\n\n### Business Applications Usage\n\nFor the development and maintenance\
    \ of any business software or application, many developers use Python.\n\nMoreover,\
    \ Python is used by many developers to maintain their e-commerce websites.\n\n\
    ### Console Based Application\n\nConsole-based applications can be built using\
    \ Python. You can, for example, use IPython to build various support-based applications.\n\
    \n### Audio or Video-based Application Programming\n\nPython is a fantastic language\
    \ for doing several tasks based on video or audio. To build various kinds of media\
    \ applications, many developers use Python. You can use a Python function, known\
    \ as cplay, for this.\n\n### 3D based Computer-Aided Drafting Applications\n\n\
    To build and develop 3D based computer-aided drafting applications, many Python\
    \ developers use Python. Fandango is a beneficial Python-based framework for creating\
    \ specific applications that allow you to view full CAD highlights.\n\n### Enterprise\
    \ Applications\n\nPython is used by many Python developers to build many applications\
    \ that can be used within a company or in an enterprise. Tryton and Picalo are\
    \ the most well-known applications in this regard.\n\n## 2.4 Installing Python\n\
    \nYou can visit the mentioned website in order to download and install Python\
    \ on your Windows.\n\nhttps://www.python.org\n\n### Installation on Windows\n\n\
    This will allow you to download the new Python-released update. If you're using\
    \ this process, the website mentioned above will redirect you to a new window\
    \ where you may find a list of several Python versions, as described earlier.\
    \ You can download the new Python version from there, i.e., Python 3.8.1. Now,\
    \ everything you have to do is to download and install the latest Python update\
    \ and save it. Double click on the executable file after downloading and saving\
    \ it. A new window will open after this. Only click on the \"Customize Configuration\"\
    \ button and let your device install it automatically.\n\nA new window will pop\
    \ up after that, displaying all the optional Python features. All the optional\
    \ features need to be enabled, and you have to pick or check them all. Click on\
    \ the Next button after this to begin the process.\n\nWith the advanced options\
    \ for downloading Python, a new window will pop open. You only need to check the\
    \ \"pick everything\" button for a better installation, and then you have to press\
    \ the \"Next\" button.\n\nAfter you press the 'Next' button, Python 3.8.1 will\
    \ download the program on your computer."
