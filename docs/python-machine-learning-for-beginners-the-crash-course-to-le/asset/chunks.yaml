    # 第 5 章：Python 编程中的数据类型、运算符和变量


    `Python` 的基本概念是数据类型、变量和运算符，它们被认为是这种高级计算机编程语言作为编程语言的基础构建块。通常，我们使用它们来为项目编程，并通过它们的特性实现所需的结果。在这些概念中，数据类型是最重要的概念，如果没有掌握这些基本概念，没有人能掌握
    `Python` 的编程。作为一种计算机编程语言，我们本章将介绍 `Python` 的基本变量、运算符和数据类型。


    ## 5.1 Python 变量


    `Python` 标识符的另一个名称是“变量”。变量是一个指代机器或设备内存区域的术语。你不需要在 `Python` 中确定这些变量，因为 `Python`
    是一种推断语言，足够智能对其变量进行排序。


    此外，我们可以说 `Python` 变量是具有不同类型数据（如整数或字符）的内存位置。在 `Python` 中，变量是可更改和可操作的，因为它们使用了一组不同的操作。


    无论如何，为了初始化，变量需要一个字母或下划线。建议使用小写字母作为变量名。两者在 `Python`、Sledge 和 Mallet 中都是特殊元素。


    ### 命名变量或标识符


    标识符的情况是因素。为了构思程序中使用的字面系数和整数，使用了变量。对于 `Python`，以下是变量命名的标准。


    *   字母或下划线 `_` 必须是标识符的核心字符。

    *   除了核心字符外，每个字符可以是由 `"a-z"`、`"A-Z"` 排列的字母、下划线或 `"0-9"` 数字。

    *   变量名不能包含任何空白区域或任何独特或不常用的字符，如 `! @, #`,百分，`^` 和 `*`。

    *   变量名不能与 Python 程序语法中描述的词汇相似。

    *   在 `Python` 中，区分大小写。

    *   有效标识符实例：`n69`、`v`、`v69`。

    *   无效标识符实例：`5a`、`v 69`、`x69`。


    ### 多变量赋值


    在单一描述中，通常称为变量赋值，`Python` 帮助保留多个标识符的机会。它可以通过同时声明多个标识符的单一激励，或在不同时间将不同的属性分配给多个变量来实现。


    示例 -1：


    打开 Python 控制台或 IDE 并编写声明变量的命令。


    ```

    >>> n=v=w=987

    >>> print

    >>> print (n, v, w)

    ```


    输出：当你打印变量值的命令时，输出如下。


    ```

    >>> 987, 987, 987

    ```


    示例 -2：


    ```

    >>> n, v, w = 987, 876, 765

    >>> print

    >>> print (n)

    >>> print (v)

    >>> print (w)

    ```


    输出：对于输出，当你输入你的命令时


    ```

    >>> print (n)

    "987"

    >>> print (v)

    "876"

    >>> print (w)

    "765"

    ```


    ## 5.2 Python 中的运算符


    通常，运算符是语言中独特的语法标记，需要执行某些操作。运算符主要源于数学原理。例如，乘法符号 (*)` 是一个 Python 编程运算符。它用于两个数字的相乘。


