    \ |\n\n| Python 2.6.9 || October 2008 |\n\n| Python 2.7.17 || July 2010 |\n\n\
    | Python 3.0.1 || December 2008 |\n\n| Python 3.1.5 || June 2009 |\n\n| Python\
