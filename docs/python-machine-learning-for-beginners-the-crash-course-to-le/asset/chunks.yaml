    In Python, operators are represented as a symbolic representation of a function
    that, in order to achieve some real and desired results, does a specific act between
    two operands. Operators are regarded in an individual computer programming language
    as the cornerstones of software on which your software operates. The selection
    of operators provided by Python is represented as a pursuit. To execute basic
    operations, here are some widely used operators:


    * Arithmetic Operators

    * Comparison Operators

