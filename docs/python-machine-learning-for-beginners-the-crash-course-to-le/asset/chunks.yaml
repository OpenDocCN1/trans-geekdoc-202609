    ### String


    In Python, a string can be defined as a sequence of characters represented by
    quotation marks. Moreover, to describe a series, single, double, or triple quotes
    may be used.


    The handling of strings is an easy, understandable, and very clear task since
    Python provides several in-built functions and operators to perform this task.
    The operator "+" is used for string handling in Python to concatenate two strings
    as the process


    "Hello" + "Mr. David Robertson"


    Returns,


    "Hello Mr. David Robertson"


    Moreover, the operator "\*" is commonly known as a repetition operator as the
    operation


    "Object" \* 2


