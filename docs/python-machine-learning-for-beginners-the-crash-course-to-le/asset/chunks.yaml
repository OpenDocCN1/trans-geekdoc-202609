    人们通常认为 Python 是用蛇或蛇类命名的，甚至 Python 的标志中也了两条蛇，第一条是蓝色的，第二条是金色的。但我们中很少有人知道 Python
    这个名字背后的真实故事。


    20 世纪 70 年，BBC 有一部非常非常成功的喜剧电视节目叫做《蒙派森的飞行马戏团》（Monty Python''s Fly Circus）。巧的是，Van
    Rossum 是该节目的超级粉丝。因此，在看完这个节目后，Rossum 将他新开发的语言命名为：


    ''Python''


    # 1. 学习 Python 的步骤


    在现代世界，每个开发者都应该掌握的核心编程结构和语言之一就是 Python。大多数程序员使用这种语言来构建网站、开发学习算法以及执行其他编程任务。首先，学习
    Python 可能会令人畏畏、沮丧且困难，特别是当你不确定如何接触工具和资源时。


    你可能会发现的最大挑战之一，是所有的学习材料和资源是如此相似。假设你对理解和编写 Python 感兴趣。在这种情况下，你会发现，在你甚至考虑做你感兴趣的事情之前，任何写作资源都需要你在
    Python 语法上花费大量时间。


    这种不一致性让许多程序员学习 Python 变得非常困难。经验丰富的程序员也会向你提出这样的论点：“噢，老兄！学习 Python 太容易了！”他们甚至经常向你保证这一点。但事实上，即使是几行看似基础的代码也可能让你感到难以置信的困惑。例如，即使是一行代码也会让你感到困惑！在
    Python 中：


    * `django.http` 是什么意思！

    * 为什么某些代码行中会有括号？


    当你对 Python 一无所知时，要理解它是如何协同工作的是非常困难的。


    这里最初的问题是，你需要理解 Python 的构建块才能构建出有趣的东西。上面提到的 `django.http` 代码段使用了流行的 MVC 架构来创建网站的视图（view），这是网站的关键构建块之一。如果你无法编写开发视图的代码，那么归结底，在这个阶段你是不可能创建一个动态网站的。


    大多数 Python 编程教程和课程都假设你在开始做某些事情之前需要理解 Python 语法的一切内容。这导致你在语法上浪费了几个月的时间，而你真正想做的是分析数据、创建一个网站或创建一个自主无人机。


    通常，花费所有时间研究语法会导致灵感流失。我们在这里将其称为一个“无聊之墙”。一些教程和课程建议你需要准备得充分以爬越这道“无聊之墙”，使其变成“你将要从事的迷人事物之地”，但请相信我们，那不是学习
    Python 的唯一方法！


    一个人在遇到几次那道“无聊之墙”并离开后，可能会发现一个更适合他或她的过程。他/她特别可以找到一种将简单学习与开发有趣的想法和程序结合起来的方法。在某种程度上，他绕过了这个“无聊区块”，直接到达顶端。他应该花尽可能少的时间学习基础知识，然后立即跳跃到做他感兴趣的事情上。


    在这个阶段，我们将一步步向你如何重现这个过程，无论你为什么要学习 Python。这一切都始于寻找你的灵感！


    ## 动机


    在你开始探索并跳入 Python 世界之前，值得问问自己为什么要学习它，因为成为一名 Python 开发者将是一个漫长且往往充满沮丧的旅程。如果没有足够的灵感，你无法走下去！


    所以！对我我来说，动机非常重要，比你想象的要得多！


    高中和大学的大多数人在编程课程上睡觉，在那里他们必须记忆语法，他们没有灵感。另一方面，当他们需要使用 Python 创建一个自动生成文章的网站时，他们会坚持工作。


    所以！根据我的，动机影响很大，比你想象的要大！


    为了确保你真正取得进展，以下是一些建议，Python 会帮助你找到一个你感兴趣的领域。当你准备学习 Python 时，你可以选择你感兴趣的领域，例如：


    * 数据科学

    * 机器学习

    * 人工智能

    * 移动设备开发

    * 机器人 / 传感器


    遗憾的是，在学习 Python 时，你不能跳过这一阶段。在深入你感兴趣的领域之前，你必须掌握 Python 的基础知识。我知道你想尽可能少地花时间在语法上，因为这没有启发性。本书将帮助你学习
    Python 的基础知识。


    在这个阶段，自由形式的项目将会很困难。


    你会感到非常困惑，并且必须回到文档并阅读它。正因如此，通常更容易创建更正式的项目，直到你有足够的安全感在自己的管理下构建项目。为了让你从中学习，大多数教程网站或书籍都有结构化的项目。这有助于你在编辑这些项目后，创建你感兴趣的项目，从而防止你迷失。由于你想创建一个游戏，或者在技术领域工作，或其他领域，你可能对
    Python 感兴趣。所以，在本文指南的最后，我们将从人工智能的角度来看 Python 的未来。


    ## 工作，工作和工作


    如果你完成了上述所有阶段，在 Python 编程中，你可以不断增加项目的复杂性。如果你对自己创建的内容完全满意，这意味着是时候尝试更困难、更复杂的东西了。你可以考虑一个全新的、更有挑战性的项目，或者在你最近的项目中增加难度，也许你可能为你的项目寻找完全不同的挑战。嘿！对于这一点！你必须记住，人通过实践变得更好！

