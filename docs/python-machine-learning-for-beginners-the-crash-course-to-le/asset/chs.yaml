- "# Python 机器学习初学者指南：学习 Python 编程如何助力数据科学、数据分析和人工智能的速成课程\n\n\n\n\n\n\n\n\n\n\n\n\n\
  \n\n\n\n    - 结论\n\n# 引言\n\nPython 是一种著名的面向对象高级计算机语言，被全球的软件开发者、游戏开发者、网站开发者、数据科学家等使用。Guido\
  \ Rossum 先生在 1991 年开发并构建了这种语言，Python 软件公司负责其进一步开发。尽管当时有很多面向对象（OOP）语言，构建 Python 的主要原因是强调一致性和数值处理，例如\
  \ `NumPy`、`SymPy`、`Orange` 等。目前，Python 的语法简洁直观。Python 是一种开源、面向对象且多功能的语言，支持大量的标准库。Python\
  \ 在信息科学领域也闻名。\n\n# 第 1 章：开始学习 Python\n\n谈到 Python 的起源，我们提到 80 年代初使用的 `ABC` 语言。`ABC`\
  \ 语言的影响推动了 Python 的增长和兴起，它现在是最流行的编程语言之一。\n\n## 1.1 学习 Python 的步骤\n\n在 20 世纪 80 年初，计算机工程师兼数学家\
  \ Van Rossum 先生曾在 `Centrum Voor Wiskunde en Informatica` 作为名为 `ABC` 的编程语言的项目协调员。Van\
  \ Rossum 在开发一个名为 `AMOEBA` 的新型分布式操作系统时，开始寻找一种像 `ABC` 具有新语法的新脚本语言，该语言可以访问 `ABC` 的系统调用。\n\
  \n## 1.2 Python 基础\n\n最后，Van Rossum 在 90 年代初最终发布了他编程语言的第一版本。最初，`Modula-3` 模块框架支撑了他的编程语言。今天，我们把他的编程语言称为\
  \ `Python`。\n\n\n\n\n人们通常认为 Python 是用蛇或蛇类命名的，甚至 Python 的标志中也了两条蛇，第一条是蓝色的，第二条是金色的。但我们中很少有人知道\
  \ Python 这个名字背后的真实故事。\n\n20 世纪 70 年，BBC 有一部非常非常成功的喜剧电视节目叫做《蒙派森的飞行马戏团》（Monty Python's\
  \ Fly Circus）。巧的是，Van Rossum 是该节目的超级粉丝。因此，在看完这个节目后，Rossum 将他新开发的语言命名为：\n\n'Python'\n\
  \n# 1. 学习 Python 的步骤\n\n在现代世界，每个开发者都应该掌握的核心编程结构和语言之一就是 Python。大多数程序员使用这种语言来构建网站、开发学习算法以及执行其他编程任务。首先，学习\
  \ Python 可能会令人畏畏、沮丧且困难，特别是当你不确定如何接触工具和资源时。\n\n你可能会发现的最大挑战之一，是所有的学习材料和资源是如此相似。假设你对理解和编写\
  \ Python 感兴趣。在这种情况下，你会发现，在你甚至考虑做你感兴趣的事情之前，任何写作资源都需要你在 Python 语法上花费大量时间。\n\n这种不一致性让许多程序员学习\
  \ Python 变得非常困难。经验丰富的程序员也会向你提出这样的论点：“噢，老兄！学习 Python 太容易了！”他们甚至经常向你保证这一点。但事实上，即使是几行看似基础的代码也可能让你感到难以置信的困惑。例如，即使是一行代码也会让你感到困惑！在\
  \ Python 中：\n\n* `django.http` 是什么意思！\n* 为什么某些代码行中会有括号？\n\n当你对 Python 一无所知时，要理解它是如何协同工作的是非常困难的。\n\
  \n这里最初的问题是，你需要理解 Python 的构建块才能构建出有趣的东西。上面提到的 `django.http` 代码段使用了流行的 MVC 架构来创建网站的视图（view），这是网站的关键构建块之一。如果你无法编写开发视图的代码，那么归结底，在这个阶段你是不可能创建一个动态网站的。\n\
  \n大多数 Python 编程教程和课程都假设你在开始做某些事情之前需要理解 Python 语法的一切内容。这导致你在语法上浪费了几个月的时间，而你真正想做的是分析数据、创建一个网站或创建一个自主无人机。\n\
  \n通常，花费所有时间研究语法会导致灵感流失。我们在这里将其称为一个“无聊之墙”。一些教程和课程建议你需要准备得充分以爬越这道“无聊之墙”，使其变成“你将要从事的迷人事物之地”，但请相信我们，那不是学习\
  \ Python 的唯一方法！\n\n一个人在遇到几次那道“无聊之墙”并离开后，可能会发现一个更适合他或她的过程。他/她特别可以找到一种将简单学习与开发有趣的想法和程序结合起来的方法。在某种程度上，他绕过了这个“无聊区块”，直接到达顶端。他应该花尽可能少的时间学习基础知识，然后立即跳跃到做他感兴趣的事情上。\n\
  \n在这个阶段，我们将一步步向你如何重现这个过程，无论你为什么要学习 Python。这一切都始于寻找你的灵感！\n\n### 动机\n\n在你开始探索并跳入 Python\
  \ 世界之前，值得问问自己为什么要学习它，因为成为一名 Python 开发者将是一个漫长且往往充满沮丧的旅程。如果没有足够的灵感，你无法走下去！\n\n所以！对我我来说，动机非常重要，比你想象的要得多！\n\
  \n高中和大学的大多数人在编程课程上睡觉，在那里他们必须记忆语法，他们没有灵感。另一方面，当他们需要使用 Python 创建一个自动生成文章的网站时，他们会坚持工作。\n\
  \n所以！根据我的，动机影响很大，比你想象的要大！\n\n为了确保你真正取得进展，以下是一些建议，Python 会帮助你找到一个你感兴趣的领域。当你准备学习 Python\
  \ 时，你可以选择你感兴趣的领域，例如：\n\n* 数据科学\n* 机器学习\n* 人工智能\n* 移动设备开发\n* 机器人 / 传感器\n\n遗憾的是，在学习\
  \ Python 时，你不能跳过这一阶段。在深入你感兴趣的领域之前，你必须掌握 Python 的基础知识。我知道你想尽可能少地花时间在语法上，因为这没有启发性。本书将帮助你学习\
  \ Python 的基础知识。\n\n在这个阶段，自由形式的项目将会很困难。\n\n你会感到非常困惑，并且必须回到文档并阅读它。正因如此，通常更容易创建更正式的项目，直到你有足够的安全感在自己的管理下构建项目。为了让你从中学习，大多数教程网站或书籍都有结构化的项目。这有助于你在编辑这些项目后，创建你感兴趣的项目，从而防止你迷失。由于你想创建一个游戏，或者在技术领域工作，或其他领域，你可能对\
  \ Python 感兴趣。所以，在本文指南的最后，我们将从人工智能的角度来看 Python 的未来。\n\n### 工作，工作和工作\n\n如果你完成了上述所有阶段，在\
  \ Python 编程中，你可以不断增加项目的复杂性。如果你对自己创建的内容完全满意，这意味着是时候尝试更困难、更复杂的东西了。你可以考虑一个全新的、更有挑战性的项目，或者在你最近的项目中增加难度，也许你可能为你的项目寻找完全不同的挑战。嘿！对于这一点！你必须记住，人通过实践变得更好！\n\
  \n\n\n\n*   你可以提出建议，让你的界面更加用户友好。\n*   你可能考虑让你的项目公开的方法。\n\n## 1.2 Python 基础\n\n在开始编写你的第一个\
  \ Python 程序（通常被称为 \"Hello World\"）之前，你必须学习 Python 语法的基础知识。在这一阶段，我们将讨论 Python 编程的基础及其语法，这无疑将帮助你开启作为一名\
  \ Python 开发者的职业生涯。现在，让我们先编写一个最基础的 Python 程序。\n\n### 编写你的第一个 Python 软件/程序\n\nPython\
  \ 程序可以打印和编译，通常以两种不同的形式存在。\n\n#### 交互模式\n\n程序员可以简单地在 Python 的交互模式下编写并正常地编译 Python\
  \ 程序。\n\n#### 脚本模式\n\n程序员必须先以脚本方式执行其 Python 程序，这通常是一个 `.py` 扩展名的文件，已经保存在你的计算机上。\n\
  \n让我们实际查看一下这两者。\n\n### 交互模式下的 Hello World!\n\n你可以在终端的 Python 编程交互模式下输入以下命令来编写你的第一个程序。\n\
  \n```\n>>> $ Python\n```\n\n如果你在终端中输入并执行了此命令，那么你现在就处于 Python 的交互模式下。\n\n另一方面，如果你正在使用\
  \ IDE 进入 Python 的交互模式，则无需输入上述命令。以下是用于你的第一个软件编译的 Python 基础编程语法。首个程序通常被称为 \"Hello\
  \ World!\"，但我们将改变这个习惯。我们将编写第一个“Hello to the Universe of Python!”。\n\n当你写下第一个程序并按下回车键时，你的\
  \ IDE 应该显示 \"Hello to the Universe of Python!\"。你应该注意，括号中你所写的一切“将会在写在你的 IDE 上”。在我们的情况下，它是\
  \ Hello to the Universe of Python!。\n\n语法：\n\n```\n>>> print (\"Hello to the Universe\
  \ of Python!\")\n```\n\n输出：\n\n在编译上述命令后，你将在执行屏幕上看到文本，“Hello to the Universe of Python!”。\n\
  \n### 脚本模式下的 Hello World!\n\n假设你已经将你的“Hello to the Universe of Python!”项目作为一个编写好的程序和\
  \ Python 文件（即 `.py` 文件）保存了。现在你可以在计算机上查找 `.py` 扩展名文件。假设你将项目保存为 `Hello to the Python.py`，这里是你的代码在\
  \ Python 脚本模式下的运行方式。\n\n你所编写并保存的项目文件在开始时必须是可用且执行的。通常，这通过程序员使用以下命令来实现：\n\n```\n>>>\
  \ $ chmod +x test.py\n```\n\n现在，如果你的文件是可以运行和重新执行的，你就可以在 Python 的脚本模式下运行并执行你的软件。\n\
  \n```\n>>> $ Python Hello to the Python.py\n```\n\n你可以看到计算机终端或控制台上显示 \"Hello to\
  \ the Universe of Python!\"，直到该命令结束。通过运行 \"Hello to the Universe of Python!\" 你已经掌握了第一个\
  \ Python 语法。\n\n### Python 关键字和标识符\n\nPython 编程中总共有三十一个关键字和五个重要的标识符。在学习 Python 编程技能时，标识符和关键字是你可以快速习惯的内容。\n\
  \n#### Python 标识符\n\n通常，Python 标识符是一个函数、模块、向量、类或其他内容。在 Python 编程中，你为一个对象分配一个名称，这被称为标识符。通常，正确的标识符以大写字母（A-Z）、小写字母（a-z）或下划线（`_`）开头。这些通常伴随着下划线、零、字母或数字（0\
  \ 到 9）。\n\nPython 编程中有五种标识符的基本形式：\n\n*   函数\n*   模块\n*   类\n*   变量\n*   对象\n\n我们应该查看\
  \ Python 语法中可用的关键字以便继续后续。\n\n#### Python 语法关键字基础\n\n你必须打开 IDE 并输入以下命令来查看 Python\
  \ 中所有的三十一个关键字。\n\n语法\n\n```\n>>> import keyword\n>>> keyword.kwlist\n```\n\n输出：\n\
  \n当你输入这些命令时，你的 IDE 将打印此关键字表：\n\n```\n['False', 'None', 'True', 'and', 'as', 'assert',\
  \ 'break', 'class', 'continue', 'def', 'del', 'elif', 'else', 'except', 'finally',\
  \ 'for', 'from', 'global', 'if', 'import', 'in', 'is', 'lambda', 'nonlocal', 'not',\
  \ 'or', 'pass', 'raise', 'return', 'try', 'while', 'with', 'yield']\n```\n\n随着 Python\
  \ 新版本的发布，这些列出的关键字可能会发生变化。现在，当 Python 作为编程语言使用时，还有几件事你需要记住。\n\n存在 set 关键字，我们不能将它们作为标识符。\n\
  \n*   在 Python 中，关键字是区分大小写的。通常\n*   关键字被称为保留字。\n\n### Python 语句\n\n在我们继续 Python\
  \ 语法的基本概念之前，你应该记住的后续事情是行和缩进。\n\n在 Python 中，组织代码块或模块的主要支持是缩进。此外，它是严格执行的，使得 Python\
  \ 代码具有可读性、可扫描性和可审查性。\n\n我们必须注意，缩进空格在每种情况下是不同的。我们需要观察以下代码来理解这一点。\n\n```\n>>> Person\
  \ = [\"David\", \"Jennifer\", \"Michael\"]\n>>> for n in person:\n... if n == \"\
  David\": print(n)\n... else: print(\"Not David\")\n```\n\n在以下代码中，你必须注意 `for` 语句有一个空格，而\
  \ `if` 语句有两个空格。\n\n在 Python 中，当你结束语句时不需要分号。\n\n之后，你也可以在一行中声明多个语句。例如：\n\n```\nPerson\
  \ = \"David\" ; age = 25 ; location = \"NYC\"\n```\n\n### 命令行参数\n\n在 \"Hello to\
  \ Python.py\" 中，我们在交互模式下使用了命令行。因此，最好的方法是向你介绍命令行参数。这些是你阅读的命令行基础的重要组成部分。\n\n### 如何创建虚拟环境\n\
  \n对于任何新项目，虚拟环境将是你制作的内容之一。在 Python 中，即使不构建新的环境你也可以处理新项目。然而，这样做可能会让你陷入这种情况：\n\n* \
  \  依赖项可能无法增强或优化。例如，Python 版本可能无法从 2.7 更新到 3.8。\n\n你必须进入终端并输入以下命令创建一个虚拟世界：\n\n```\n\
  >>> $virtualenv newvironment\n```\n\n我们刚刚创建的虚拟环境名称在命令中是 `newenvironment`。现在，要打开你的新世界，输入以下指令：\n\
  \n```\n>>> source newenvironment\n```\n\n### 从用户处输入\n\n有两种常见的 Python 语法可以请求用户输入。\n\
  \n#### Raw Input\n\n在这种下，任何程序员都可以邀请用户提交他们的输入。\n\n```\n>>> raw_input ()\n```\n\n\
  这在 Python 3.0 中不再准确或有效。新的输入形式是 `input()`。\n\n#### Input ( )\n\n我们必须查看上述示例来理解这个概念。\n\
  \n```\n>>> user_input_request = input (\"Enter your worst Ex’s name: \")\n```\n\n\
  在你输入后，你的 IDE 将允许你输入你糟糕的前任的名字。我的错！\n\n# 第 2 章：Python 的基本属性\n\n到目前为止，我们拥有的编程语言几乎可以\
  \ {手指数得来。有这么多编程语言，每种计算机编程语言都有其独特的特性。这些特性是该语言区别于其他语言的特征。\n\n\n\n\n\n最后，由于该语言的特性，某种语言可能会被迁移或用于更广泛的项目。因此，在深入学习\
  \ Python 概念之前，让我们先来看看 Python 的功能、特性和应用。在接下来的章节中，你将学习 Python 的基本概念、特性、应用和架构，这使其与其他许多语言相比显得独特且强大。\n\
  \n## 2.1 Python 的独特特性\n\n让我们从 `Python` 的一些独特特征开始。\n\n### ### 易于理解和编码\n\n当我们对 Python\
  \ 编程使用“简单”或“容易”一词时，我们必须从非常不同的语境来看待它。\n\n我们之前读过 Python 语言是一门高级语言。通常情况下，通过非常少的关键字和标识符，你可能会发现\
  \ Python 代码与英语如出一。任何程序员甚至非程序员都可以通过查看代码看出这段代码的作用。\n\n然而，Python 是动态类型语言，这需要使用缩进。这一功能（特性）使得\
  \ Python 的代码更加稳定且易于理解。\n\n此外，在写完第一个程序后，我们可以发现在 Python 中编写代码是毫不费力的事情。我们可能会发现，与其他编程语言相比，Python\
  \ 的代码更容易上手。在几个小时内，一个具有编程背景的人就能学会 Python 的语法。\n\n然而，要精通 Python 编程及其原理、模块和包还需要一些时间。因此，换句话说，我们可以说\
  \ Python 是一门**开发者友好**的语言。\n\n### ### 开源且免费\n\n首先，你可能知道 Python 是免费的，并且在许多平台上都可用。它的官方网站是下载和安装\
  \ Python 最可靠的来源，即：\n\n`https://www.python.org/`\n\n第二点是，Python 是一门开源编程语言。开源确保了公众可以随时访问\
  \ Python 的源代码。即使是非专业人士也可以下载、修改、使用和分发 Python。`FLOSS` 通常将此类软件或语言称为“自由、许可和开源软件”。所有的\
  \ Python 开发者都在 Python 世界中为了一个共同的目标努力，即增强 Python 及其功能。Python 正此将源代码设为开源代码。\n\n###\
  \ ### 高级语言\n\n从书的开始，我们一直在讨论这样一个观点：Python 是一门高级计算机编程语言。\n\n作为一名开发者，你不需要思考或回忆你的计算机或设备的设计。用\
  \ Python 编写的代码可以在全球范围内任何程序、机器或系统上运行。你不需要关心系统的内存。这一功能使得在 Python 中编写和编码变得更容易。因此，我们可以像之前描述的那样称\
  \ Python 为“开发者友好语言”。\n\n### ### 便语言\n\n对于你面向 Windows 系统的计算机，假设你构建了一个 Python 程序或应用。假设你只想在面向\
  \ MAC 系统的计算机上运行该程序。现在，你不需要对 Python 代码进行太多的修改。\n\n你可以从面向 Windows 系统的计算机上获取 Python\
  \ 代码并在任何 MAC 机器上运行它。因此，如果你使用 Python，就不必为不同的工具或操作系统编写不同的代码。这一 Python 特性使得我们的语言成为一种极具移植性的编程语言。\n\
  \n### ### 解释型语言\n\n如果你使用 Python，你的代码不需要编译。这是因为 Python 是一种解释型语言，意味着代码是按行执行的。\n\n\
  ### ### 面对象语言\n\n我们从开始就在讨论这个观点：`Python` 是一门面向对象的语言。这意味着它关注对象，并将数据和函数结合。Python 在其范式中支持多重继承。\n\
  \n### ### 可扩展语言\n\n假设你是某些编程语言的开发者。Python 是非常有扩展性的，这意味着它可以被扩展和扩大以包含其他语言。\n\n### ###\
  \ 嵌入式语言\n\n在之前的阶段，我们已经提到其他语言的代码和命令也可以被我们的 Python 代码接受。这有助于我们整合其他语言的脚本能力。\n\n###\
  \ ### 标准库\n\n通过丰富的包和库，你可以下载 Python，这样你就不需要为软件中的每一项都编写完整的代码。常用短语、各种版本的文档、测试单元、网站和浏览器的创建、线程、数据库的开发和维护、流行接口、电子邮件的开发和维护以及许多形式的图像处理都有相应的库。\n\
  \n### ### 图形界面编程\n\n除非你创建图形界面（GUI），否则任何应用程序或软件可能都不够友好。通过你软件的图形界面，任何使用你软件的用户都可以轻松与其交互。为了改进程序、应用的图形界面，Python\
  \ 提供了一系列库。其中 `wxPython`、`JPython` 和 `Tkinter` 最受欢迎。\n\n## 2.2 Python 版本\n\n### ###\
  \ 第一阶段\n\nPython 在 1994 年 1 月的第一阶段开发并发布了其第一个版本，即 `Python 1.0`。函数式编程工具如 `reduce`、`filter`、`lambda`\
  \ 和 `map` 是该版本实现的关键特性。`Python 1.2` 是 Rossum 先生仍在 `CWI` 工作时发布的最后更新。该版本于 1995 年出版。\n\
  \n\n\n\n\n1995 年，Van Rossum 先生在国家研究倡议公司（Company for National Research Initiatives）研究了他自己发明的语言\
  \ `Python`。他在那里发布了其他几个版本的 `Python`。随着 `Python 1.4` 的发布，`Python` 获得了一些自己新的且未知的特性。这些特性中，`Modula-3`\
  \ 最常见。为了激发关键字参数的灵感，引入了 `Modula-3`。他们还通过 `Python 1.4` 中通过名称修饰（name mangling）实现了一种简单的数据隐藏形式。\n\
  \nVan Rossum 还引入了名为 `CP4E` 的“全民计算机编程”（Computer Programming for All）。他的目标是让普通人也能掌握编程，以及许多计算机编程语言所需的专业知识。`Python`\
  \ 在这方面发挥了至关重要的作用。解释是 `Python` 拥有一种简单直观的语法。\n\n`Python 1.6` 是下一个 Python 版本。他们在 `Python\
  \ 1.6` 中发布了新的 CNRI 许可。在修复了一些 bug 之后，`Python 1.6` 发布了它的另一个版本。\n\n### 第二阶段 – 2\n\n\
  在 `Python` 的第二个阶段，`Python` 发布了 `Python 2.0.0` 版本。它于 2000 年 10 月发布。`Python` 在此版本中实现了列表推导式（list\
  \ comprehension）。这是 `Python` 从其他实用计算机编程语言中借鉴的功能。随后 `Python` 实现了 `Python 2.1`，它类似于\
  \ `Python 1.6.1` 并且与 `Python 2.0.0.0` 高密一致。为了适应嵌套作用域，`Python 2.1` 的引入实现了一个根本性的变化，使其能够与其他静态作用域编程语言竞争。\n\
  \n接下来，`Python 2.2` 是 `Python` 的下一个版本。`Python 2.2` 于 2001 年发布。`Python` 在这个版本中实现了一个重大改进，统一了\
  \ `Python` 的类别，即将单独的类统一到单一层次结构中。这一转变是 `Python` 成为面向对象范式编程语言的根本原因。`Python 2.5` 是下一个\
  \ Python 版本。2006 年 9 月，`Python` 发布了这个版本。该版本要求的改进是能够使用上下文管理器封装任何代码块语句。\n\n`Python\
  \ 2.6.1` 和 `Python 2.7.0` 是 `Python` 在第二阶段发布的后续版本。创建 `Python 2.6` 是为了支持 `Python\
  \ 3.0`，并且随着 `Python 3.0` 的引入，一些 bug、警告和语法错误得到了调试。另一方面，发布 `Python 2.7` 是为了支持 `Python\
  \ 3.1`。\n\n### 第三阶段 – 3\n\n`Python` 发布了 `Python 3.0.0`。在 `Python` 开发的第三阶段——通常被称为\
  \ `Py3K` 或 `Python 3000`——`Python 3.0` 于 2008 年发布（`Python 3000` 发布）。此外，为了克服 `Python`\
  \ 的缺陷，开发了 `Py3K`。\n\n`Python 3.0` 被称为多范式语言。然而，开发者仍然可以将其作为标准的、函数式和面向对象的范式编程语言，与其他编程语言区分。\n\
  \n因此，在阅读这些之后，我们可以假设 `Python` 正在通过更新的版本、支持和组件不断被修改。如果你需要了解更多关于 `Python` 版本及其发布日细节，你会发现这个表对你有帮助。\n\
