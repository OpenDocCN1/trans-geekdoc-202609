  \ Android 设备上。出于许多原因，你可能更喜欢 `pg4a`，它是 Android 的 `Pygame` 子集。\n\n#### 特性：\n\n- 该库不需要\
  \ `OpenGL`。\n- 它能帮助你简单地利用多中心 CPU。\n- 在使用此库时，无需 GUI 即可使用每一个可用功能。\n- 该库支持广泛的阶段和工作框架。\n\
  - 该库简单易用。\n- `Pygame` 使用 `Assembly Code`（汇编代码）和高级 `C` 代码来实现核心功能。\n\n### Bokeh\n\n\
  `Bokeh` 是 Python 编程语言的一种直观的可视库；它允许在现代 Web 程序中以惊艳且交互的方式可视化数据。该数据可视化库鼓励创建仪表板、数据应用程序和精美的图表。\n\
  \n尽管提供了灵活方案的简短且优美的改进，`Bokeh` 库同样通过对流式或海量数据集及数据库的最佳知识扩展了其能力。\n\n#### 特性：\n\n- 在使用此库时，可以轻松构建具有清晰标题的真实图表，无需任何复杂操作。\n\
  - `Bokeh` 可可视化可以成功引入两个最标准的 Python 框架：`Django` 和 `Flask`。\n- 它提供了在多种编程语言变体中创建惊艳自然数据识别的能力。\n\
  \n### Asyncio\n\n该库被开发者用于利用 `async` 和等待语法来编写并发代码。在大多数程序中，`asyncio` 库非常适合 IO 密集型和高层组织系统源码。\n\
  \n`Asyncio` 已用于 Python 非并发框架的结构化差异，这些框架提供了与数据库相关的库、循环任务线、进程系统和 Web 服务器等。相关库包含了许多高级和低级\
  \ API。\n\n#### 特性：\n\n- 该库用于通过传输实现协议。\n- 在使用此库时，你会发现 Python 代码简单且直接。\n- `Asyncio`\
  \ 有助于生成许多不同的循环。\n\n## 8.2 Python 数据科学库\n\nPython 库每天都在变得更加易于获取和更有用。作为一组开源语言，有数百万计的数据科学家正在通过高级编码，使用工具和库来丰富\
  \ Python。现在，数据科学家正在使用极其先进的包和库来处理多项数据分析任务。下面给出了一些最佳 Python 数据科学库的简要描述。\n\n### Numpy\n\
  \n`NumPy` 是一个非常重要的 Python 数据科学库，用于逻辑注册。它为强大的 N 维数组对象和广播功能提供了支持。\n\n此外，该库提供了傅里叶变换、任意数值能力，以及协调\
  \ `C`、`C++` 和 `FORTRAN` 代码的设备。对于涉及使用 Python 的人工智能项目的全栈开发者来说，拥有 `NumPy` 的信息是必要的。\n\
  \n`Numpy` 是 Python 中处理数据的基础且完美的包，因为不同的数据调查包都是基于 `Numpy` 和 `sci-kit-learn` 包的，后者被用于构建人工智能应用，并与\
  \ `Numpy` 完美工作。\n\n最初，`Numpy` 提供了卓越的类数组、n 维簇。在 `'ndarray'` 对象（也称为 `'exhibit'`）中，你可以存储各种相同类型的信息。数组对象周围的方法使得\
  \ `Numpy` 在执行数学计算和数据控制方面非常有优势。\n\n#### 特性：\n\n- `Numpy` 是一个非常有交互性的库，而且也很简单。\n- 在使用\
  \ `Numpy` 时，数学问题被轻松解决。\n\n### Pandas\n\n在 Python 中，我们使用二维表格来分析数据，就像在 `SQL` 或 `Excel`\
  \ 中。最初 Python 没有这个功能。但后来 `Pandas` 被引入了。无疑，`Pandas` 是“Python 的 SQL”。简而言之，`Pandas`\
  \ 是可以帮助我们在 Python 中处理二维数据表的库。在许多情况下，它类似于 `SQL`。\n\n此外，`Pandas` 基于 `NumPy` 包，这意味着\
  \ `NumPy` 的大部分结构都被使用或复制以开发 `Pandas`。`pandas` 中的数据经常被用于增强 `SciPy` 中的事实检查、来自 `Matplotlib`\
  \ 的绘制能力以及 `Scikit-learn` 中的机器学习计算。\n\n此外，`Jupyter Notebooks` 为使用 `pandas` 执行数据调查和演示提供了良好的环境，但\
  \ `pandas` 也可以简单地用于内容工具。\n\n`Jupyter Notebooks` 允许开发者在特定的单元格中执行代码，而不是运行整个记录。这在处理大型数据集和复杂更改时节省了大量时间。Scratchpad（草稿板）同样提供了可视化\
  \ `pandas` `DataFrames` 和图表的简单方法。确实。\n\n`Pandas` 主要以在 Python 中提供数据大纲而闻名。这是一个优秀的数据检查库，与\
  \ `R` 等其他特定领域的语言相比。通过使用 `Pandas`；处理缺失信息变得简单，支持处理来自各种资产的对比信息，并支持程序数据安排。\n\n此外，它提供了诸如合并、塑造或切割数据集的数据检查和结构，它在处理来自\
  \ `Excel`、级别文件和数据库的时间安排信息也非常有用。\n\n### Matplotlib\n\n`Matplotlib` 是一个用于 Python 的二维绘图库，具有卓越的表示模块。它配备用于在各种打印版本组织和智能跨平台条件下交付顶级图表。除了在\
  \ Python shell、Python 内容和 IPython shell 中外，`Matplotlib` 还可以用于：\n\n- `Jupyter Notebook`\n\
  - `Web 应用程序服务器`\n- `GUI 工具箱`\n\n\n\n\n正如 Matplotlib 官网所说，这个 Python 库试图“让简单变得更简单，让复杂变得易懂”。这个\
  \ 2D 绘图 Python 库允许用较少的代码生成条形图、误差图、直方图、图形、散点图等。\n\n也许，可视化最大的优势在于它允许我们以有效吸收的视觉效果访问海量信息。Matplotlib\
  \ 包含了许多图表，如线图、条形图和散点直方图等。\n\nMatplotlib 是 Python 中的数学绘图库。它在很大程度上用于信息表示，包括 3D 图表、直方图、图片图、散点图、条形图，以及在各种打印副本设计中具有高亮显示的缩放和搜索功能的光谱。它支持几乎所有的操作系统，例如\
  \ Windows、Mac 和 Linux。该库同样作为 `NumPy` 库的扩展。Matplotlib 包含一个用于绘图的模块 `pyplot`，该模块经常与\
  \ MATLAB 进行对比。\n\n这些库是初学者利用 Python 编程语言开启数据科学领域的最佳选择。还有许多其他 Python 库可用，例如用于标准自然语言处理的\
  \ `NLTK`、用于网络挖掘的 `Pattern`、用于深度学习的 `Theano`、`IPython`、用于网络爬虫的 `Scrapy`、`Mlpy`、`Stats\
  \ models` 等，机会在此无限。\n\n### 特殊功能\n\n- 通过面向对象的接口拥有实用的属性、字体属性、线条样式等。\n- MATLAB 接口支持数据的简单绘图。\n\
  - 支持次级 x/y 轴以表示两个维度。\n- 该库支持多个操作系统。\n\n### Scikit-Learn\n\nScikit-learn 通过 Python\
  \ 的可预测接口提供了一系列监督和无监督学习算法。它在宽松的重写 BSD 许可证下授权，并在许多 Linux 发行版中发布，能够满足学术和商业用途。该库基于 `SciPy`（科学\
  \ Python），在在使用 `sci-kit-learn` 之前必须引入它。\n\n有几个 Python 库在机器学习算法领域提供了强强大的性能实现。其中最著名的是\
  \ `Scikit-Learn`，这是一个提供许多基础算法的高效实现的包。`Scikit-Learn` 以完美、统一且精简的 API 描述，并拥有极其有用且详尽的在线文档。这种一致性的优势在于，一旦你理解了某类模型的基本用法和语言结构，切换到另一种模型或算法将极其直接。\n\
  \n无疑 Python 中最酷炫的东西是机器学习和预测性分析。此外，为此最好的库是 `Scikit-Learn`，它本质描述为“Python 中的机器学习”。`Scikit-Learn`\
  \ 拥有一些技术，基本上涵盖了你在数据职业生涯初期几年可能需要的所有内容：回归策略、分类策略和聚类，以及模型评估和模型选择。\n\n这个流行的库用于数据科学中的\
  \ AI，带有回归、分类和分组计算，提供了支持向量机、朴素贝叶斯、梯度提升和逻辑回归。`SciKit` 旨在与 `SciPy` 和 `NumPy` 协作。\n\n\
  ### 特殊功能\n\n- 从图像和文本中提取特征的能力\n- 可以在多个场景中重复使用\n\n### Scipy\n\n存在 `scipy` 库和 `scipy`\
  \ 栈。大多数的库和包都是 `Scipy` 栈的一部分（用于 Python 中的逻辑处理）。其中一个部分就是简单的 `scipy` 库，它为数值计划（AI 模型背后的数学内容）提供高效的解决方案。这些包括集成、导入、优化等等。`Scipy`\
  \ 为执行 `Scikit-learn` 中不可预测的 AI 形式提供了核心科学策略。\n\n它是一个开源库，用于注册不同的模块，例如图像处理、合并、插入、唯一功能、增强、线性变量数学、傅里叶变换、分组以及许多不同的任务。该库配合\
  \ `NumPy` 使用以执行高效的数值计算。\n\n### 特殊功能\n\n- 舒适地处理数学运算\n- 使用子模块提供高效的数值例程，如数值积分和优化\n\
  - 支持信号处理\n\n### TensorFlow\n\n任何从事使用 Python 的 机器学习任务的人都至少听说过 `TensorFlow`。它由 Google\
  \ 开发，是一个利用数据流图进行数值计算的开源代表性数学库。普通 `TensorFlow` 数据图中的科学活动由图节点表示。图的边缘则表示多维数据表示，又称 `Tensors`，它们在图节点之间流动。\n\
  \n`TensorFlow` 展示了一种灵活的设计。它允许 Python 工程师将计算传递到工作区、手机或服务器中的一个或多个 CPU 或 GPU，而无需修改代码。所有在\
  \ `TensorFlow` 中的库都是用 `C` 和 `C++` 编写的。广泛使用的 Google 产品如 Google Photos 和 Google Voice\
  \ Search 都是使用 `TensorFlow` 构建的。该库对 Python 有一个复杂的前端。Python 代码将被编译，然后在 `TensorFlow`\
  \ 提供的执行引擎上运行。\n\n### 特殊功能\n\n- 允许训练各种神经系统和许多 GPU，使得模型对于大规模框架极具效率\n- 可以在 CPU 和 GPU\
  \ 上轻松训练以进行分布式计算\n- 在其操作上具有灵活性，这意味着 `TensorFlow` 提供了提取所需部分并留下不需要部分的选择\n- 高级别的网络和设计器支持\n\
  -与其他数据科学 Python 库不同，`TensorFlow` 改进了想象图中每一个部分的方法。\n\n### Keras\n\n它被认为是最酷的 AI（算法）Python\
  \ 库之一；`Keras` 为通信系统提供了一个简单的工具。它还具有用于积累模型、准备数据集、可视化图表等的特实用工具。`Keras` 用 Python 编写，可以在\
  \ `CNTK`、`TensorFlow` 和 `Theano` 上运行。这个 Python AI 库的创建重点关注允许快速实验。所有 `Keras` 模型都是紧凑的。\n\
  \n与其他 Python AI 库相比，`Keras` 非常轻量。这是因为它首先利用后端框架创建计算图，然后使用等效方法执行操作。`Keras` 在进行创新研究方面极具表现力且灵活。\n\
  \n### 特殊功能\n\n- 完全基于 Python 使得它更容易调试和调查\n- 本质上是模块化的。\n- 神经系统模型可以组合以构建日益复杂的模型\n-\
  \ 在 CPU 和 GPU 上轻松运行\n- 支持几乎所有的神经系统模型，包括卷积、嵌入、全连接、池化和循环\n\n### Seaborn\n\n`Seaborn`\
  \ 本质上是一个 Python 的数据感知库，它基于 `Matplotlib` 库。此外，它与 `Pandas` 数据结构紧密集成。这个 Python 数据感知库提供了一个异常接口，用于绘制美观且实用的事实图表。\n\
  \n\n\n\n\nSeaborn 的核心点是将数据表示成为调查和获取信息的不可或缺的一部分。其基于数据集的绘图功能适用于包含整个数据集的展示和信息边缘。该库非常适合检查许多因素之间的关系。Seaborn\
  \ 内部为创建教育性图表提供了所有重要的语义映射和可测量集合。该 Python 数据可视化库还拥有用于选择调色板的设备，有助于发现数据集中的设计。\n\n###\
  \ 特色功能\n\n*   直接回归模型的自动估计绘图。\n*   对复杂数据集总体结构的直观视角。\n*   便于利用异常状态分析构建复杂的表示以组织多图矩阵。\n\
  *   用于双变量或单变量分布的选项。\n*   对使用清晰因素的专门支持。\n\n### 自然语言工具包 (NLTK)\n\n`Natural Language\
  \ Toolkit`（简称 `NLTK`）对于常见的语言准备和设计识别任务非常有价值，并可用于创建智能模型、分词、标记、推理以及各种有助于 AI 应用的任务。\n\
  \n### 特色功能\n\n*   带有一个语言结构标记器\n*   支持词法分析\n\n# 第 9 章：人工智能与 Python\n\n人工智能，即 `A.I`，已经存在了半个世纪，其发展正呈指数级增长。AI\
  \ 市场正处于鼎盛时期，如果你想了解人工智能，你来对地方了。本关于人工智能和 Python 的书籍将允许你理解 Python 中所有的 AI 概念。\n\n##\
  \ 9.1 什么是人工智能？\n\n人工智能 (`AI`) 是一种理性推理和行为的工具。这些计算机由内部的软件驱动，因此 AI 与驱动它们的创新软件密切有关。它是一门可以帮助机器像人类一样理解世界并对情况的科学。\n\
  \n看看过去几十年 AI 的出现，你会发现不同的研究人员倾向于关注其他的 AI 定义概念。在现实世界中，AI 以不同的形式出现在许多垂直领域。我们想要的机器人正在检测、理解、梦想和行为。我们也希望我们的机器人具有逻辑性。\n\
  \nAI 与大脑研究密切相关。研究人员认为，可以通过理解大脑的工作来实现人工智能。通过模仿人类思考、相信和行为的方式，我们将创建一个相同的计算机。这可以作为构建智能学习系统的平台。\n\
  \n## 9.2 什么是机器学习？\n\n机器学习是实现人工智能 (`AI`)，允许设备在没有直接编程的情况下自动学习和发展行为。机器学习侧重于创建可以操纵数据并为了其目的使用计算机系统。\n\
  \n学习过程从见解或证据开始，例如证据、直接经验或训练，以识别知识中的趋势，并根据我们提供的示例在未来做出明智的决策。主要目的是允许计算机在人类参与或协助的情况下自动学习并改变行为。\n\
  \n使用经典的机器学习算法，文本被称为关键字序列；相反，它是一种模仿人类解释书籍上下文的能力的语义处理方法。\n\n## 9.3 Python 编程在现代人工智能中的作用\n\
  \nPython 对其人工智能原型算法非常有帮助。该语言还支持无需常规编译器的解释型执行时间，并为 AI 具有独特的结构算法，例如简洁的语法、数据结构和简单的控制流。\n\
  \n### 人工智能与 Python\n\n*   `Python`:\n    它是一种具有复杂语义的高级面向对象语言。它通过易读且清晰的语法降低了软件开发成本，即使是初学者也能阅读。\n\
  *   `Artificial Intelligence`:\n    这是一个计算机科学领域，优先开发能够像人类一样运行的智能机器，例如语音识别、视觉感知、翻译甚至选择。\n\
  \n### Python 的优势和特点\n\n*   `通过虚拟机或模拟器进行简单解释`：\n    它在执行之前不需要编译成机器语言。然而，程序员可以使用硬件理解的本地机器语言直接运行它。\n\
  *   `高级编程语言`：\n    它包含了变量、表格、复杂算术、伪代码、布尔表达式和其他抽象原理，使其更易于。\n*   `通用编程语言`：\n    它可以跨越技术和领域使用。\n\
  *   `自动内存控制和动态类型系统`：\n    它有一系列编程风格，包括命令式、面向对象、函数和过程化的特征。\n*   `独立平台`：\n    它可以在所有操作系统上运行，并且是一种开源编程语言。\n\
  \n### 为什么选择 AI 和 Python？\n\n与其他 `OOPs` 相比，`Python` 提供的代码仅为 1/5。我们应该从其他编程语言中选择 `Python`\
  \ 用于 AI 的原因：\n\n*   `内置库`：\n    用于 Python 机器语言的 `Numpy`、`PyBrain` 以及用于高级计算的 `Scipy`\
  \ 是这些库使得 `Python` 成为 AI 的正确语言。\n*   `强大的社区`：\n    全球的 `Python` 开发者通过论坛和指南提供支持和贡献，帮助编写代码。\n\
  *   `独立平台`：\n    它通过极少的简单代码更改即可灵活地使用各种操作系统。\n*   `OOPs 脚本和概念选择`：\n    帮助 `IDE`（集成软件环境）通过使用多种算法解决开发者的困难。\n\
  \n## 使用 AI 进行 Python 编码\n\n`Python` 有了一系列库包用于 AI 项目的创建和解码。少数高级包：\n\n*   `NumPy`：\n\
  \    它被用作通用数据容器，由 N 数组元素、`C / C++` 集成资源、随机数能力和其他特征组成。\n*   `Pandas`：\n    它为 `Python`\
  \ 提供了易用的数据结构和计算方法，是一个开源库。\n*   `Matplotlib`：\n    这是一个 2D 绘图库，为出版生成高质量图像。\n*   `AIMA`：\n\
  \    Russel 和 Norvig 使用 `Artificial Intelligence – A New Solution` 应用通用 AI 算法。\n\
  *   `PyDatalog`：\n    这是一个 `Python` 逻辑编程引擎。\n*   `Easy`：\n    它被用于构建 AI 游戏的基础双玩家\
  \ `Python` 引擎。（例如：Negamax）（仅限法语）\n*   `PyBrain`：\n    一种简单但强大的机器学习算法，用于评估和比较预定义的环境。\n\
  *   `PyML`：\n    双边 SVM 和其他内核方法系统。并支持 `Linux` 和 `Mac OS X`。\n*   `Scikit-Learn`：\n\
  \    最流行的机器学习库是一个非常强大的数据分析平台。\n*   `MDP-Toolkit`：\n    学习算法是管理且无人的，可以扩展到网络架构的使用。\n\
  *   `NLTK`：\n    自然语言工具包用于语言数据和文档中的文本解释以及自然语言处理的研究与开发。\n\n### AI Python 比 C++\n\n\
  *   `Python` 是 AI 最常用的 `C++` 语言，以 57% 的得票领先开发者。`Python` 易于阅读和应用。它们也可以用于多个仓库的数据挖掘。\n\
  *   `C++` 效率优于 `Python`。这是因为 `C++` 是一种静态类型语言，所以运行时没有类型错误。`C++` 还让运行时编程更轻量、更快。\n\n\
