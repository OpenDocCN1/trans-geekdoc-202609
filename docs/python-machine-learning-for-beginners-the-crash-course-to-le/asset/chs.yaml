  ```\n\n输出：\n\n请输入您的值: 22\n\n### `int() ` 函数\n\n`int()` 函数设计用于将字符串和其他数据结构转换为整数。\n\
  \n示例：\n\n```python\n>>> n = int(15) # 整数\n>>> v = int(15.5) # 浮点\n>>> w = int('15')\
