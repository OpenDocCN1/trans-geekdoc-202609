  \n### 在 Windows 上安装\n\n这将允许你下载新的 Python 发布更新。如果你使用此过程，上述网站将重定向到一个新窗口，你可以在那里找到几个\
  \ Python 版本，如之前所述。你可以从那里下载新的 Python 版本，即 `Python 3.8.1`。现在，你所做的就是下载并安装最新的 Python\
  \ 更新并保存。下载并保存后，双击可执行文件。之后将打开一个窗口。只需点击“自定义配置”按钮并让你的设备自动安装。\n\n之后会弹出一个窗口，显示所有可选的 Python\
  \ 功能。所有可选功能都需要启用，你需要勾选所有项。之后点击“下一步”按钮开始该过程。\n\n在使用下载 Python 的高级选项时，一个新窗口将打开。你只需要勾选“全选”按钮以获得更好的安装，然后按下“下一步”按钮。\n\
  \n```\n当你按下“下一步”按钮后，Python 3.8.1 将在你的电脑上下载程序。\n```\n\n\n\n\n安装后，你必须在框架的 `CMD`（即\
  \ `命令提示符`）上运行 Python。只需在命令提示符中输入以下命令来检查 Python 是否安装正确。\n\n```\npython\n```\n\n当你按下回车键时，命令提示符可能会显示错误。这通常是因为\
  \ Python 路径没有设置正确。\n\n现在，你只需要去桌面正确地设置 Python 路径，右键点击“此电脑”并进入“属性”。选择属性后，点击“高级”，然后进入“环境变量”。你会发现在用户变量部分将添加一条新路径。你可以在“环境变量”中将\
  \ Python 路径设置为变量名，Python 安装目录设置为变量值。设置好 Python 路径后，你现在在本地站上执行 Python 了。\n\n现在，只需重置你的命令提示符并重新输入以下命令。\n\
  \n```\npython\n```\n\n终于！Python 解释器打开了，你可以在这里开始编写和执行 Python 命令和语句。\n\n### 在 MAC\
  \ 上安装\n\nApple 官方为 Mac OS X 10.8 内置了 Python 2.7。如果你想安装特定版本的 Python，可以访问该网站进行下载。\n\
  \n`https://www.python.org`\n\n你可以从此网站获取新的 Python 更新版本及其许多组件。为此，必须从相关网站下载 Python\
  \ 程序包。\n\n安装套件后，一个名为“Python 3.8.1”的文件夹将下载到你的“应用程序”文件夹中。你在这里会找到 Python 开发环境，即 `IDLE`。\n\
  \n还可以从你的设备下载名为 `Python Module` 的模块。该框架通常包含各种 Python 编程库和其他几个可执行文件。\n\n# 第 3 章：编译器、文本编辑器和\
  \ IDE\n\nPython 编译器、IDE 和文本编辑器在 Python 编程中起着至关重要的作用。与其他编程语言一样，我们有许多应用程序、编译器和文本编辑器可以以非常简化的方式编译\
  \ Python 语法。在本章中，我们将学习编译器、文本编辑器和 IDE。\n\n## 3.1 Python 编译器\n\n如果你有编程背景，需要知道编译器是一种用于代码翻译的应用程序，或者说是一种简单的软件，它能将你编写的代码从高阶计算机编程语言转换为机器语言，以便计算机能够理解。Python\
  \ 有许多编译器，它们都有自己特定的计算机编程语言转换系统。许多程序员使用这些编译器来调试程序，或使代码具有可执行性，或为程序创建算法。\n\n`PyCharm`\
  \ 是大多数 Python 程序员在进行 Python 编程时最喜欢的 IDE 之一。\n\n在本书的范围内，我们将讨论一些最好的编译器。\n\n### NUITKA\
  \ 编译器\n\n`NUITKA` 是一个非常著名的 Python 编译器，用于编译和执行你的代码。`NUITKA` 将你编写的 Python 代码作为输入并进行编译和执行；它将你的代码转换为\
  \ C。在几乎每一个操作系统和平台上你都可以访问 `NUITKA`。`NUITKA` 定期更新，Windows、`MAC`、`UNIX` 以及其他操作系统变得非常用户友好。\n\
  \n`NUITKA` 的另一个特性是，你可以在未在工作站安装 Python 的情况下对其进行编码。\n\n`NUITKA` 是一个基于 Python 的编译器，通常不支持任何其他语言。因此，对于\
  \ Python 开发，它拥有不同的功能和库。开发者还使用 `NUITKA` 来开发人工智能和信息科学程序。\n\n### PYJS 编译器\n\n许多专业级程序员和软件开发公司使用\
  \ `PYJS` 编译器作为 Python 的编译器。它是一种不同类型的编译器。它最广为人知的特性是它可以将 JavaScript 转换为你的 Python 代码。因为其在\
  \ Web 程序方面的独特特性，大多数网站开发者更倾向于这种编译器。\n\n当我们谈论 `PYJS` 提供的独特特性时，`PYJS` 提供了运行时支持。这就是为什么\
  \ Web 开发者主要推荐将其用于 Web 应用程序和程序。它支持那些希望用 Python 编写代码并直接在网页浏览器上运行的人。`PYJS` 还会将你的 Python\
  \ 代码解释为经过调试的 `JavaScript` 代码，这些代码可以在你指定的互联网浏览器上执行和运行。\n\n此外，`PYJS` 是一个非常轻量级的编译器。此外，`PYJS`\
  \ 还为运行时错误的调试提供了运行时支持。\n\n### SKULPT 编译器\n\n在你的网页浏览器中，`SKULPT` 编译器也可以直接执行编写的 Python\
  \ 代码。你的 Python 代码变得更具执行性。在某个网站页面的博客中，`SKULPT` 最近被引入。要将你的 Python 代码转换为 HTML，也可以使用\
  \ `SKULPT`。你的代码还可以用 `JavaScript` 结构编译以供你的网页浏览器使用。\n\n在网页浏览器中运行 Python 不需要任何额外的模块、文件或服务器设置，因为我们已经讨论过\
  \ `SKULPT` 是 Python 使用的一个程序。每个在 `SKULPT` 中编写的 Python 代码都将从你的网页浏览器直接执行。\n\n许多 Web\
  \ 工程师和 Web 开发者想要开发某些 Web 应用程序，允许用户在浏览器中直接执行 Python 程序并使用 `SKULPT`。\n\n### BRYTHON\
  \ 编译器\n\nPython 的编译器之一被认为是 `BRYTHON`。同样，它将你的 Python 代码转换为 `JavaScript` 代码。这种编译器具有一些独特特性，作为第三方编辑器，它可以转换你的代码和程序，以最短的时间内获得卓越的结果。此外，对于许多支持\
  \ `CPython` 的模块，该编译器提供了实时协助。需要记住的是，该编译器也支持许多其他语言。对于用户端的 Web 编程，`BRYTHON` 被经常使用。这种编译器是一个\
  \ Python 压缩包。\n\n### Shed Skin 编译器\n\nPython 编译器中的一个被认为是 `Shed Skin`。它也是列表中的一个，用于\
  \ Python 编程的编译器。该编译器的主要特性是它可以将 C++ 程序转换为你的 Python 向代码。`Shed Skin` 编译器的缺点是它没有为常见的错误和问题提供实时帮助。此外，支持的\
  \ Python 库和模块很少。\n\n你可能会发现 `Shed Skin` 编译器很有用，许多 Python 开发者使用它来提取静态编写的 Python 代码，以获得修改后的\
  \ C 和 C++ 代码。该编译器提供了基础显示支持，可以使用它。\n\n## 3.2 Python 文本编辑器\n\n### Sublime Text\n\n\
  对于 Python 编程，最著名的文本编辑器之一是 `Sublime Text` 编辑器。它拥有文本编辑器可以的所有顶级功能。基本上，这个文本编辑器是用 `C++`\
  \ 编程语言开发的，但你也可以用它支持 Python。\n\n许多编程语言都支持它的更新版本。`Jon Skinner` 是创建它的人，它于 2007 年进入市场。他遵循这三个基本规则来开发这个文本编辑器。它的内容不会被窗口隐藏。\n\
  \n它利用屏幕上任何可以合理利用的空间，因为全屏使用使得编辑变得更容易。他考虑的关键点之一是无关且简洁的界面。你可以在此工具中优先考虑内容，并避免多个工具。\n\
  \n优点：\n\n- 它运行很快且 Bug 较少。\n- 它能够打开大型文档。\n- 它支持许多编程语言及其变言。\n\n### GNU/EMACS 文本编辑器\n\
  \n\n\n\n\n这是一款被许多开发者强烈推荐的 GNU 文本编辑器。该文本编辑器由理查德·斯尔曼（Richard Stallman）开发，在二十多年里，它一直是软件开发人员和编程专业人士中最受欢迎的文本编辑器。该文本编辑器的所有者理查德·斯尔曼先生让每位用户都能免费使用。\n\
  \n在许多计算机编程语言中，`GNU/EMACS` 文本编辑器主要使用独特的自定义功能来实现渐进式方法。\n\n该文本编辑器的一个扩展是 `Elpy` 扩展。该文本编辑器有许多功能使其与其他文本编辑器区分开来。例如，它提供了一种句式结构，可以将文本之间的存档记录分段和空格隔离开，以获得最佳格式。\n\
  \n#### 核心优势：\n* 它是免费的，并提供了一个完全移动的编程环境。\n* 它支持记录结构所需分段的自动扩展。\n* 它支持具有 24 位色彩方案的各种操作系统。\n\
  \n## 3.3 Python 的 IDE\n\n你可以使用称为集成开发环境（IDE）的工具进行 Python 开发。IDE 通常用于以下用途：\n\n* 可以使用\
