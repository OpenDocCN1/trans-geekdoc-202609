    # 6.4.1 Audio Signals


    The story of recognizing emotions through speech have become a significant focus
    within the scope of affective computing [10], and healthcare is no exception [11].

    Audio signals are typically represented as numerical time-series data, where each
    data point corresponds to the amplitude of the audio signal at a specific time.
    Analyzing this data is essential for tasks like audio classification, where you
    want to categorize audio clips into different classes (e.g., speech recognition,
    music genre classification). Traditionally, Recurrent Neural Networks (RNNs) have
    been used for processing sequential data like audio signals. RNNs have a recurrent
    structure that capture dependencies over time. However, they have some limitations,
    including difficulties in handling long-range dependencies and issues with computational
    efficiency.

    Audio spectrogram transformers (ASTs) [12, 13] are a relatively recent advancement
    in the field of audio processing. They are based on the transformer architecture,
    which are convolution-free and attention-based, meaning they rely on attention
    mechanisms and can fully capture the sequential relationship in the data without
    depending on the convolution layers.


    # 6.4.2 Text Transcripts


    In the preceding chapter, we explored the use of sequential models such as LSTM
    for text classification. We also introduced transformers which are known for superior
    performance in NLP tasks. For our study, we use the encoder component of transformer,
    specifically BERT [14]. BERT stands for Bidirectional Encoder Representations
    from Transformers. Pretrained models like BERT enable us to harness the benefits
    of transfer learning, reducing the amount of data required for training.'
