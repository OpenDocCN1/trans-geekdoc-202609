    in various ways to approximate any kind of function. These are called neural networks,
    and they require a large amount of data to be trained as opposed to shallow learning
    techniques described in the previous sections.


    Once the output is generated, we must compute the loss, which is a measure of
    the distance between real and the predicted values. The choice of loss function
    depends on the type of data we are dealing with. Generally, a loss function $L$
    is denoted by $loss = L(y, y_{target})$. Once the loss for the network is calculated,
    a mathematical algorithm called backpropagation is used.


    Backpropagation is a mathematical technique employed for training neural networks.
    It involves computing the gradient of the loss function concerning the network''s
    weights and biases. This gradient is subsequently utilized to adjust the weights
    and biases, aiming to minimize the loss. To calculate the gradient of loss with
    respect to the output, we use partial derivatives:


