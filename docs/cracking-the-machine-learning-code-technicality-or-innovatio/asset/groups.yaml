    ## 3 基础构建模块：从浅学习到深度学习


    ![](img/a499312facf6bd3577be03d7b7eddea9_49_0.png)


    **图 3.7** 显示边界超平面和最优超平面的向量机


    支持向量机试图创建一个最优超平面（称为支持向量），以便尝试最大化化与类别之间的间距（如图 3,7 所示）。在图中，我们只考虑了两个特征，因此只得到一条分割两个类别的线。SVM
    模型（或决策边界）的标准写法方式为：


    $z(x) = w^T x + b,$


    其中 $w^T$ 是计算出的决策边界的权重向量转置，$x$ 是特征向量。我们可以定义分类器 $f(z)$ 为：


    ```

    $f(z) = \begin{cases} 0 & \text{if } z \ge 0 \\ 1 & \text{if } z < 0 \end{cases}$

    ```


    该条件确保了特征向量根据其位于超平面的哪侧进行分类。最优超平面是从现有数据得出的，但我们也希望 SVM 模型能够在新的（或未测试的）数据上泛化。为了确信地分类新的观测值，SVM
    算法还计算了边界超平面。我们计算决策边界（如图 3,7 所示），使得两个类别之间存在尽可能的空间。这些边界的计算超出本书。鼓励读者阅读 [2]。


    ## 3.2 分类


    ### 3.2.3 决策树分类器


    决策树是另一种分类算法。与 SVM 一，它也可以用于回归。但目前我们的重点是决策树分类器。决策树也被称为分类回归树（CART）。决策树创建了一组用于决策的规则。这些规则是非参数算法的示例，这意味着模型对数据没有任何统计假设。


    让我们看看图 3.8，使用著名的泰坦尼克数据集来可视化决策树。任务是根据年龄等特征预测个人是否能够幸存。


    在图 3.8 中，第一个决策是基于乘客的性别。我们可以从第一个根节点看出，如果乘客是男性，那么他的生存概率较低。决策树清晰地传达了数据中的见解，不需要大量的解释。


    ![](img/a499312facf6bd3577be03d7b7eddea9_50_0.png)


    图 3.8 用于预测泰坦尼克号事件死亡的决策树


    ### 3.2.4 朴贝叶斯分类器


    朴贝叶斯分类器是一种基于条件概率定理的分类算法。该分类器基于贝叶斯定理：


    ```

    $$P(A|B) = P(A)\frac{P(B|A)}{P(B)}$$

    ```


    让我们看看上面的公式。它给出了在事件 $B$（证据）已经发生的情况下，事件 $A$（假设）发生的概率 $P(A)$。朴贝叶斯假设特征之间是相互独立的。由于这种宽松的假设，该算法被称为“朴素”（naive）。为了让它更直观，让我们用
    $X$ 和 $y$ 重写上面的方程。$X$ 和 $y$ 是输出：


    ```

    $$P(y|X) = P(Y)\frac{P(X|y)}{P(X)}$$

    ```


    因此，我们可以重新描述定义以适应分类问题。朴贝叶斯分类器为给定的 $X$ 列表（参数/特征）给出了 $y$（预测）的概率。我们可以进一步扩展方程为


    ```

    $$P(y|x_1, x_2, \dots, x_n) = P(y)\frac{P(x_1|y)P(x_2|y) \dots P(x_n|y)}{P(x_1)P(x_2)
    \dots P(x_n)}$$

    ```


    其中 $x_i$ 对应于特征属性，如花瓣长度（cm）和花瓣宽度（cm）。特征独立的假设是朴贝叶斯分类器最大的弱点。在现实生活中，这些特征很少是独立的。这阻碍了分类器的性能。


    ### 3.2.5 K-近邻分类器


    K-近邻分类器是另一种监督分类算法，也可以用于回归。这些算法假设具有相似特征的邻近（邻域）。如果我们研究鸢花数据集，许多同种鸢花的样本将具有相似的特征，如果我们在这个多维平面上绘制这些特征，我们将看到这些样本的图聚集在一起。


    为了简单起见，我们取两个特征：花瓣长度和花瓣宽度，并绘制散点图。我们看到折鸢花（Iris Setosa）聚集在左下侧。这种花的样本具有相似的花瓣长度和花瓣宽度，并且在这里彼此靠近。其他鸢花也可以看到这一点（但没有像折鸢花那样明显）（图
    3.9）。


    ![](img/a499312facf6bd3577be03d7b7eddea9_52_0.png)


    图 3.9 用于分类的 K-近邻


    我们可以使用欧几里得距离、曼哈顿距离等距离指标来衡量接近。给定任意两个点 $p$ 和 $q$：$d(p, q) = \sqrt{\sum_{i=1}^{n}(q_i
    - p_i)^2}$。


    ### 3.2.6 随机森林分类器


    随机森林顾义是决策树的集合。简单来说，我们有很多树。但我们如何确保这些树是不相同的呢？随机森林使用了一种名为 bagging（自助聚合）的集成技术。在 bagging
    方法中，我们取数据的子样本并将其传递给一棵树。这确保了这些树是不相关的。


    随机森林算法还实现了特征随机性。在普通的决策树中，所有特征都被传递给树并被使用。但在随机森林中，每棵树只能从随机特征集中进行选择。例如，假设我们对创建的树强制实施更多的变化。我们可以说有十棵不同的树（在实际实现中数量非常高）。决策树
    1 可能从总训练数据集中取子样本，并可能选取特征 1 和特征 2；决策树 2 可能从总训练数据集中取另一个子样本并选取特征 2 和 4，以此此类推。


    在上面的示例中，我们看到随机森林算法创建了九棵不同的决策树。其中六个预测为球，只有三个预测结果为箱子。由于球比箱子多，球被随机森林分类器投票选为预测结果。


