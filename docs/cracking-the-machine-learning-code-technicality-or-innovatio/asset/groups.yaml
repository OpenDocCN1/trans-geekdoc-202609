    ## 2.2 数据预处理


    **图 2.4** 分布图中的离群值可视化


    ![](img/a499312facf6bd3577be03d7b7eddea9_38_0.png)


    ### 2.2.4 离群值


    数据中的离群值非常常见。这些是那些明显偏离平均值的数据点。在机器学习中，我们将这些在统计上罕见的数据点称为离群值。这些离群值可能是自然产生的，并证明可以改进模型。但有时，这些出现是由于数据收集错误导致的。虽然罕见，但出现百岁老人是完全正常的。然而，年龄超过150岁的人出现是不可能的，并且可能需要处理此类离群值。这些离群值会损害所收集数据的可靠性，不可靠的数据会产生不可靠的模型。较大的离群值也会偏曲数据分布。


    在我们开始处理离群值之前，对其进行适当调查是非常重要的。如果数值不合理（例如，年龄为200和-2），那么最好是移除离群值或用均值或中位数替换它们。为了过滤离群值，我们可以使用四分位范围（IQR）、z-score和改进z-score等技术
    [4]（图2,4）。


    ### 2.2.5 数据转换


    如前几章节所述，数据以多种模态存在。有必要将数据转换为所使用的机器学习模型能够理解的格式。数据转换可以从简单到非常复杂的技巧不等。数值特征可能是广泛的，并且具有不同的范围。例如，年龄范围可能从0到100，而薪资范围可能从数百美元不等。在使用这些不同范围的特征构建模型时，模型可能会学习到薪资比年龄重要——这并不一定真实。为了将这些值引入相同的尺度，我们可以使用归一化、标准化和缩放等技术
    [5]。对于类别值，我们使用标签编码器（label-encoders）或独热编码器（one-hot encoders）将其表示为数值格式。


    文本的转换与数值值有所不同。回想我们讨论过的假新闻分类或检测问题的示例。我们使用的特征是字符串。显然，许多学习模型无法理解字符串。最流行且简易的解决方案之一是使用词袋模型
    [6]。更复杂的方法是word2vec[7]和TD-IDF方法。特征也可以使用深度学习方法（如BERT [8]）通过嵌入（embeddings）提取。然而，在计算词表示之前，文本应该经过一些通用步骤，包括归一化、分词、词形还原/词干提取以及标点/空格/停用词的删除。


    正如我们所知，图像是范围从0到255或8位图像（0到2^8-1）的像素值多维数组。这些值很大，对模型来说可能成本很高。我们通过将每个值除以255来对其归一化。通常，图像具有代表每个颜色通道（红、绿、蓝）的二维数组。通常，构建模型并不总是需要RGB通道，在这种情况下，图像被转换为灰度图——单通道。这进一步降低了计算的复杂性。其他变换如旋转、缩放、裁剪、基于直方图的技术和生成对抗网络也可以应用于图像
    [9]。此类变换用于从现有图像生成新图像以解决过拟合问题。这些谨慎使用这些方法通常被称为数据增强。尽管在医学影像等敏感领域，数据增强可能并不完全合理 [10]（图2.5）。


    ![](img/a499312facf6bd3577be03d7b7eddea9_39_0.png)


    图2.5 图像中不同的仿变换


    ## 2.3 总结


    在本章中，我们探索了数据模态以及数据预处理的关键过程。我们还介绍了三种核心数据模态——数值、文本和视觉。其中，我们强调了理解这些模态对于更好的学习和/或决策过程的必要性。


    这就是我们在机器学习世界中观察不同数据类型的方式。数值数据是机器学习的基础，我们讨论了它的离散连续形式。文本数据具有独特的挑战，我们讨论了将其转换为数值表示的技术，特别是对于分类假新闻等任务。视觉数据对人类来说是直观的，但对机器来说是复杂的，我们讨论了将其转换为像素强度值数组，重点关注卷积神经网络（CNN）。数据预处理至关重要，我们涵盖了适用于所有数据模态的常用技术，包括处理缺失数据、降维、处理不平衡数据、管理离群值和数据转换
    [11, 12]。我们讨论了用于缺失数据的插补策略、用于降维的特征选择，以及处理不平衡数据集和离群值的方法。


    以下是所有机器学习科学家在项目（现实世界）中都会看到的典型案例。他们的数据集最初规模较小，但随着时间的推移增长巨大，需要持续的机器学习适应过程。随着数据流入，模型必须动态演变以适应这些变化，确保其相关性和性能（优化）。然而，何时停止集成或添加数据以及
    (b) 何时确定模型已就绪 [13, 14]。这一关键决策通常基于对数据语义及其目的的理解。此外，这强调了纯数据量之外的模态的重要性（例如医学影像信息 [13,
    18]）。它带给我们的上下文以及嵌入数据中的目的，除了其大小和复杂性。有效利用数据集和上下文相关性对于构建不仅能管理大量非结构化数据集还能利用其来指导决策过程的方法至关重要。总而言，到此，本章为我们提供了理解和为机器学习应用预处理数据的知识和工具。


