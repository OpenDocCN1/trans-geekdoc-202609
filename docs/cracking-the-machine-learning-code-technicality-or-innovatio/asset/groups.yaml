    $Recall = \frac{TP}{TP + FN}$

    $Specificity = \frac{TN}{TN + FP}$

    $Precision \cdot Recall = 2 \cdot \frac{Precision}{Precision + recall}$

    ```


    **Fig. 4.7** Confusion matrix for binary classification problem and derived evaluation
    metrics


    As a result, it should be used when you want to minimize false positives.


    - **Recall (Sensitivity or True Positive Rate):** It is the measure of how many
    of the actual positive instances the model correctly predicted as positive. Thus,
    it should be used in circumstances where false negatives should be avoided.


    - **Specificity (True Negative Rate):** Specificity is the metric used to measure
    the ability of the model to correctly identify negative instances.


    - **F1 Score:** It is the harmonic mean of recall and precision. Since recall
    and precision are inversely related, the F1 score provides a balance between two
    metrics.


    ### 4.6.3 Cluster Analysis


    Cluster analysis is an unsupervised technique since there are no labels dependent
    variables associated, the evaluation can become obfuscating. The goodness of the
    cluster also depends on the use case of the application domain. For example, if
    clustering analysis is performed for customers (business world) in an online store,
    the cluster can be formed based on spending behavior.

