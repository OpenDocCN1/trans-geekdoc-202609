    126 7 Technicality or Innovation?


    Chapter 4 provided a guide to the tools, libraries, and techniques necessary for
    implementing AI experiments, highlighting that practicalities matter for readers
    to start building learning models.


    Chapter 5 delved into the application of AI in real-world scenarios. It explored
    three distinct use cases in finance, journalism, and medical imaging, highlighting
    the versatility of AI in transforming different data modalities. Through these
    use cases, the chapter effectively demonstrates the practical application of AI
    in various fields, providing a glimpse into the immense potential of AI in driving
    progress and innovation.


    Chapter 6 showcased the power of combining multiple modalities, demonstrating
    how sentiment analysis across audio, text, and visual data create a holistic understanding
    of information. Unlike Chap. 5, in this chapter, we built a multimodal learning
    and representation model to showcase the importance of data and their effective
    usefulness. In other words, the right use of data is crucial, rather than building
    machine learning models.


    In this final chapter (Chap 7), we circled back to the core. In a world with technical
    intricacies, is AI merely about algorithms, or is it a force of innovation that
    shapes the future? We leave the readers pondering the delicate balance between
    the technicalities and the transformative power of AI.


    The journey through technicalities and innovation in the machine learning field
    is ongoing, and we hope this book serves as a compass, guiding the readers through
    the evolving landscape of artificial intelligence. The algorithms and techniques
    may evolve, the essence of AI remains timeless. However, for applied machine learning
    students to handle AI cases, the message we consider important to share (ref.
    Chap. 1):


    > For any innovation leveraging machine learning models on diverse applications/use
    cases, the focus of innovation includes model selection, parameter tuning and
    optimization, use of pre-trained models and transfer learning, right use of limited
    data, model interpretability and explainability, feature engineering and AutoML
    robustness and security, and computational-efficiency and scalability.


    Let us repeat: building machine learning models is not an innovation (ref. Chap.
    5). Innovation in building machine learning models involves a continuous cycle
    of exploration, experimentation, and improvement, with a focus on pushing the
    boundaries of what is achievable while considering ethical implications and real-world
    applicability.


    As we have been advancing with "Augmenting (human) Intelligence (AI)\ in the world
    of large language models (LLMs), we are looking at how to build trustworthy sustainable
    (highly energy-efficient) solutions, which we call green computing and/or sustainable
    AI. This brings us to the new era of innovation in building/computing machine
    learning models when they tend to behave exactly similar to human neurons, all
    of them do not get processed/activated for all input types or asks. We are limited
    to building models to automate the industry, otherwise.'
