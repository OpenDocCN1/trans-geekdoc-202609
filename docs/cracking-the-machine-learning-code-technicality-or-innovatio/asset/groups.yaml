    # 3.6 Natural Language Processing


    ![](img/a499312facf6bd3577be03d7b7eddea9_70_0.png)


    **Fig. 3.23** Vector representation of words. Vector representation of similar
    or related words are close to each other


    The commonly practiced Word2vec variant is based on the skip-gram model, where
    for a given word (e.g., Doctor) the model tries to predict the context words that
    are likely to be in its neighborhood (like Scientist). Mathematically, the skip-gram
    model is defined as


    > $P(w_c|w_t) = \frac{\exp(v_c \cdot v_t)}{\sum_{i=1}^{V}\exp(v_i \cdot v_t)}$


    where $w_c$ is a context word, $w_t$ is a target word, $v_c$ is the vector word
    for $w_c$, $v_t$ is the vector for for $w_t$, and $V$ is the size of the vocabulary.


    # 3.6.2 Recurrent Neural Networks


    Recurrent neural networks (RNN) [18] are the kind of neural network that takes
    sequential or time-series data. Because of the nature of the model, these models
    can retain a memory [19] (or take the inputs from the previous sequences). Hence,
    this kind of model is used in natural language processing as the language is also
    a sequence of words. Because of the previous inputs (words), these models can
    successfully understand the context of the sentences.'
