    # 第3章

    ## 基础构建模块：从浅学习到深度学习


    在本章中，我们将讨论浅学习和深度学习的基础构建模块。我们将介绍传统的机器学习模型，如回归、分类、聚类和降维。之后，我们还将介绍深度学习，并讨论重要的架构，如卷积神经网络（CNN）、循环神经网络（RNN）和Transformer。


    ## 3.1 回归分析


    回归模型是许多从业者用于建立因变量与一个或多个自变量之间关系的统计技术。


    ### 3.1.1 简单线性回归


    简单线性回归意味着只有一个自变量。例如，使用简单线性回归模型，我们可以建立房价与房屋面积之间的关系。在这里，房屋面积将是自变量，因变量将是房价。该模型随后可以根据房屋面积预测房价。这种类型的回归模型可以在二维图中轻松可视化。查看图3.1，回归线可以表示为
    $y = mx + C$。


    3 基础构建模块：从浅学习到深度学习


    ![](img/a499312facf6bd3577be03d7b7eddea9_43_0.png)


    ### 3.1.2 多元线性回归


    如果存在多个自变量，则回归模型被称为多元线性回归（MLR）。我们可以通过引入多个自变量来扩展上述房价检测问题。例如，房价可能不仅取决于面积，还取决于位置、房屋建筑年份，这些变量被称为自变量，它们会影响因变量（即房价），影响可能是正向的也可能是负向的。多元回归模型可以建立这些自变量与因变量以及房价之间的关系。这种模型具有更多维度，因此无法通过肉眼进行于可视化（想象图3.2中每个特征对应一个轴）。


    向模型添加更多特征是可能的，但产生的结果（可视化结果）将变得越来越难以处理。在三维平面上，可以通过近似函数 $y = \beta_0 + \beta_1x_1
    + \beta_2x_2$ 来预测价格，其中 $\beta_0$ 是截距项，$\beta_1$ 和 $\beta_2$ 是特征的系数：$x_1$（犯罪率）和
    $x_2$（房龄）。


    3.1 回归分析


    ![](img/a499312facf6bd3577be03d7b7eddea9_44_0.png)


    图3.2 多元线性回归中三维特征的表示


    ### 3.1.3 多项式回归


    与线性回归一样，多项式回归是一种统计量，用于建立一个或多个自变量与因变量 $y$ 之间的关系。线性回归只能解决线性问题，但多项式回归正如其名，也可以处理非线性数据。非线性是通过引入
    $n$ 次多项项引入的。


    让我们了解这些多项式项和多项式阶。假设我们有特征 $x_0, x_1$ 和 $x_2$，且多项式阶为二。我们将拥有 $x_0^2, x_0x_1, x_0x_2$
    等多项项。通过这样做，我们能够研究多个特征对因变量的组合影响。在某些情况下，我们可以忽略 $x^2$ 这样的项，因为它们与 $x$ 高度相关。其他剩余项被称为交互项。


    多项式回归模型可以使用方程表示：$y = \beta_0 + \beta_1x_0 + \beta_2x_0^2$，其中 $x_0, x_0^2$ 代表房龄的多项式项，$\beta_0,
    \beta_1$ 和 $\beta_2$ 代表截距和项的系数。从图3.3可以观察到多项式回归捕捉了两个变量之间的非线性关系。


    ### 3.1.4 岭回归


    图3.3 多项式回归（红线显示简单线性回归，蓝线显示多项式线性回归线）


    岭回归是带有L2正则化的简单线性回归。它用于处理数据集中的多共线性问题。当线性回归器面临过拟合且存在大量特征时，也可以使用它。简单来说，它是一种特征选择方法。其余过程与线性回归相同。在图3.4中，拟合模型对测试集的泛化效果不好。通过在模型中引入正则化，我们可以使模型泛化以拟合与训练数据行为不同的未见数据。L1和L2正则化技术超出了本书的范围。然而，它们是经典技术。[1]3.1.5
    Lasso 回归


    Lasso回归是带有L1正则化的简单线性回归。与岭回归一样，它也引入了惩罚因子。Lasso回归考虑系数的幅度。![](img/a499312facf6bd3577be03d7b7eddea9_45_0.png)


    3.1 回归分析


    ![](img/a499312facf6bd3577be03d7b7eddea9_46_0.png)


    图3.4 线显示拟合模型


    3.1.6 弹性网络回归


    使用哪种正则化技术有时会令人困惑。为了利用两种正则化的优势，可以使用弹性网络。它同时使用了L1和L2。


    3.1.7 其他回归器


    许多其他回归器可以用于特定场景。某个模型可能无效，而其他模型在相同数据上效果良好。因此，有必要了解回归的底层假设。其他回归模型包括


    - 支持向量回归器

    - 决策树回归器

    - 梯度提升回归器

    - 随机森林回归器

    - XGBoost回归器


    3.2 分类


    我们说在回归中我们有一个连续值，如房价。因此回归是处理连续值的算法。但如果值是离散的呢？例如，我们需要判断给定的动物是狗还是猫。猫和狗是两个类别。不一定只有两个类别。


    当然，并不是所有算法都能处理像狗和猫这样的类别值，我们用数值表示它：例如，用（0）代表狗，用（1）代表猫。同样重要的是，0和1都代表名义数据（类别），而不是有序值。我们可以在图3.5中看到二分类的示例。


    3.2. 逻辑回归


    逻辑回归适用于分类问题，因为它估计了事件发生的概率。当然，概率值范围在0到1之间（这类似于我们预测0到1连续值时的回归问题）。在逻辑回归中，使用了一种称为Sigmoid函数的特殊数学函数：


    $y = \frac{1}{1 + e^{-x}}$


    Sigmoid函数接受输入x，并输出0到1之间的值。然后我们确定一个阈值（例如0.5），高于该阈值的预测类别为1，低于该阈值的预测类别为0（图3.6）。


    3.2.2 支持向量机


    支持向量机（SVMs）是一组用于分类的监督学习方法。它们也可以用于其他的监督学习问题，如回归分析。支持向量机和其他算法一样适用于任意数量的特征（维度），但为了直观起见，让我们以一个二维数据示例为例，如图3.7所示。


