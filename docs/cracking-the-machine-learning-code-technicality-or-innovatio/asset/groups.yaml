    # 3 Basic Building Blocks: From Shallow to Deep Learning


    ![](img/a499312facf6bd3577be03d7b7eddea9_71_0.png)


    **Fig. 3.24** Recurrent neural network architecture. Folded (left) and unfolded
    (right)


    The left side of Fig. 3.24 shows the folded notation of RNNs, and right side of
    the figure is the unfolded representation. Green circles represent the input in
    time $t$ (for example a sequence of words), blue circles represent the hidden
    layers, and red circles represent the output of the network. The hidden state
    $h$ for time $t$ is calculated by $h(t) = f(U.x(t) + W.h(t-1))$, where $U, W$
    are weight matrices that represent the relationship between input and hidden layers,
    and between hidden layers, respectively. In the previous equation, $h(t)$ is calculated
    based on the current input and previous hidden states (acting as a memory). This
    network is called ''recurrent'' as there is feedback from the previous time steps.


    # 3.6.3 Transformers


    Transformers are the neural network architecture that deals with sequence-to-sequence
    NLP problems. Sequence to Sequence means that if the model is given a sequence
    (e.g., sequence of words), it is going to give outputs as a sequence (e.g., sequence
    of words).


    Transformers are based on self-attention layers. Because of this, transformers
    are especially useful for handling long-range dependencies. Let us illustrate
    it with an example. Suppose we want to convert a sentence from French to English.
    The problem requires that no matter how long the sentence is, each word should
    have a context and relevance to the words that came before it.'
