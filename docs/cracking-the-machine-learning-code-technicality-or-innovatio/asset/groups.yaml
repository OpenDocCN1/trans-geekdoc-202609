    不平衡数据集是大多数从业业者面临的另一个普遍问题。简单来说，数据不平衡意味着你的某些事物的示例比其他示例多。让我们用一个现实生活的例子来说明这个问题。假设我们正在教一个孩子区分三种形状：三角形、正方形和矩形。

