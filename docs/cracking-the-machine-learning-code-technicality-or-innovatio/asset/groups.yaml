    # Multimodal Learning and Representation


    ![](img/a499312facf6bd3577be03d7b7eddea9_127_0.png)


    Fig. 6.1 Histogram showing the number of words per percent in scripted and spontaneous
    sessions (left to right) [1]


    ![](img/a499312facf6bd3577be03d7b7eddea9_127_1.png)


    Fig. 6.2 Distribution of emotion category in scripted and spontaneous sessions
    (from left to right) [1]


    6.2. The charts show that a higher percentage of people are experiencing positive
    emotions, such as happiness and excitement, than negative emotions, such as sadness
    and anger. The emotion category fear is the least with less than one percent of
    the total emotion category in scripted and spontaneous sessions.


    # 6.4 Implementation


    The implementation of multimodal learning is shown in Fig. 6.3. The audio and
    text data are fed as input to the model. Since an audio signal is a sequence of
    numerical data and text is a sequence of words, the feature extraction for each
    is done differently. The extracted features are then fused and passed through
    fully connected layers and finally through the output layer. The implementation
    details for each modality are discussed in the latter part of this section.'
