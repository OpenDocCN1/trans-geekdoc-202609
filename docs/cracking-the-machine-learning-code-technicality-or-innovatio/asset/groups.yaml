    ## 3.6 自然语言处理


    RNN、LMs 和 GRU 等序列分析方法无法处理较长的句子 [20]。但在计算能力足够的情况下，Transformer 可以处理任何长度的序列。此外，Transformer
    并不要求输入是序列形式。因此，它可以实现并行化，而这在 RNN（及其变体）等模型中是一个问题。Transformer 的架构如图 3.25 所示 [20]。


    ![](img/a499312facf6bd3577be03d7b7eddea9_72_0.png)


    图 3.25 论文《Attention is All You Need》中阐述的 Transformer 架构 [20]


    ## 56 基础构建模块：从浅层学习到深度学习


    Transformer 架构依赖于自注意力机制来处理序列数据。它由一个编码器和一个解码器组成，每个部分都由多个层组成。自注意力机制允许 Transformer
    捕捉序列中每个元素之间的关系和依赖关系，无论这些元素的位置如何。这使得 Transformer 在 NLP 任务中表现出色，因为它们能够捕捉长句和复杂句子的上下文。Transformer
    的关键组件说明如下。


    **自注意力机制：** 自注意力（也称为缩放点积注意力）是 Transformer 的核心组件，它允许模型对输入序列中的重要部分赋予权重。它允许模型识别并学习序列数据中的复杂关系。有三个可学习参数，分别称为查询
    (Q)、键 (K) 和值 (V)。查询代表该标记（token）相对于句子中其他标记的重要性，键向量有助于识别当前标记与所有其他标记之间的关系，而值向量包含有关该标记内容的信息。从数学上讲，对于位置
    $i$ 的给定标记的注意力计算如下：


    ```

    $Attention(Q, K, V)_i = softmax\left(\frac{QK^T}{\sqrt{d_k}}\right)V$

    ```

    其中 $d_k$ 是键的维度。由于点积的结果可能很大，通过除以 $d_k$ 的平方根进行缩放。


    **多头注意力：** 在原始论文中，作者使用了八个注意力头（如图 3.26 所示），通过学习 $Q, K$ 和 $V$ 的不同表示来增强性能。


    **编码器-解码器架构：** Transformer 通常采用编码器-解码器架构，对于机器翻译任务，编码器接收源语言，解码器输出。


    ## 3.7 总结


    在本章中，我们深入探讨了机器学习的各个方面。从线性回归、多线性回归、多项式回归、Lasso 回归和弹性网开始。


    > “标记”（token）是指文本中的一个单位。


    ![](img/a499312facf6bd3577be03d7b7eddea9_72_0.png) 我们讨论了逻辑回归、支持向量机、决策树、朴素贝叶斯分类器、随机森林。在聚类方面，我们探讨了
    K-means、DBSCAN 和高斯混合模型等技术。降维是一个重要课题。我们的之旅继续到深度学习，涵盖人工神经网络（ANN）和卷积神经网络（CNN）。自然语言处理（NLP）是另一个领域，我们关注了词袋模型、TF-IDF
    和 Word2vec。循环神经网络使我们能够处理数据。


    ## 基础构建模块：从浅层学习到深度学习


    最后，本章为我们对机器学习技术提供了全面的理解。


