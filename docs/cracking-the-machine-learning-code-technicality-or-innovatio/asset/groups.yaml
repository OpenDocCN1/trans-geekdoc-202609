    ## 3.6 Natural Language Processing


    sequence analysis such as RNN, LMs, and GRUs are not able to manage larger sentences
    [20]. But transformers can manage any length of sequences given enough computational
    power. On top of that, the transformers do not require the input to be in a sequence.
    Hence, parallelism can be achieved, which was a problem in models such as RNN
    (and its derivatives). The architecture of the transformer is shown in Fig. 3.25
    [20].


    ![](img/a499312facf6bd3577be03d7b7eddea9_72_0.png)


    Fig. 3.25 Transformer architecture as described in the paper “Attention is All
    You Need” [20]


    ## 56 Basic Building Blocks: From Shallow to Deep Learning


    Transformer architecture relies on the self-attention mechanism to process sequential
    data. It consists of an encoder and a decoder, each consisting of multiple layers.
    The self-attention mechanism allows the transformers to capture relationships
    and dependencies between each element of the sequence, regardless of the position
    of these elements. allows transformers to excel at NLP tasks, as they can capture
    the context of lengthy and complicated sentences. Key components of transformers
    are explained below.


    **Self-attention mechanism:** Self-attention (also known as scaled dot-product
    attention) is the core component of transformers which allows the model to give
    weight to important parts of the input sequence. It allows the model to identify
    and learn complex relationships within the sequential data. There are three learnable
    parameters called query (Q), key (K), and value (V). Query represents the token''s
    importance in relation to other tokens in the sentence, the key vector helps identify
    the relationship between the current token with all other tokens, and the value
    vector contains the information about the content of the token. Mathematically,
    the attention for a given token at position $i$ is calculated as


    ```

    $Attention(Q, K, V)_i = softmax\left(\frac{QK^T}{\sqrt{d_k}}\right)V$

    ```


    where $d_k$ is the dimension of the key vector. Because the output of the dot
    product can be a very large value, it is scaled by dividing the dot product by
    the square root of $d_k$.


    **Multi-head attention:** In the original paper [20], the authors have used eight
    attention heads (shown in Fig. 3,26), which allows the transformers to enhance
    their performance by learning different representations of $Q, K,$ and V. Consequently,
    it allows transformers to learn even more complex dependencies. Additionally,
    these learners are independent, they can be parallelized.


    **Encoder-Decoder Architecture:** Transformers are usually seen in encoder-decoder
    architecture, although they can also be used in only-encoder and only-decoder
    configurations. For a machine translation task, the encoder takes the source language,
    and the decoder outputs the translation.


