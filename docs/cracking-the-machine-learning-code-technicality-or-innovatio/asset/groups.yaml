    # 2.1 Data Modalities


    labeling the patient. Another example of nominal value is labeling cats as 1 and
    dogs as 0.


    Continuous numbers represent the other type of numerical data. Financial institutions,
    including banks, insurance companies, and stockbrokers, use continuous numbers
    to denote monetary values in financial transactions and to analyze the profitability
    of their businesses. Without numbers, tracking how much money their customers
    would be a challenging task. Numerical data, whether discrete or continuous, play
    a vital role in many domains. As machine learning practitioners, it is crucial
    to differentiate between the two types of numerical data and select the appropriate
    machine learning algorithms to effectively analyze and interpret them.


    Algorithms like regression models are suitable for predicting continuous values,
    such as house prices. They are inappropriate for predicting discrete numerical
    values representing labels. To predict such values, such as 1 for cats and 0 for
    dogs, we need use classification models since the numbers do not represent the
    values of cats or dogs. For example, although some people prefer cats over dogs
    and might rate them higher than, the machine learning models we train should be
    impartial to these preferences. Classification models are the appropriate choice
    in this scenario because we are not concerned with the value represented by the
    numbers, i.e., the labels.


    # 2.1.2 Textual Data


    Textual data is another type of data that we encounter in books, websites, research
    articles, and newspapers. Text is a combination of alphanumeric values and symbols:
    anything we write down can be considered text. Even the book that you are currently
    reading is an example of textual data. Given the abundance of textual data in
    the world, it is crucial to know how to handle it correctly when using machine
    learning algorithms.


    Unlike numerical data, textual data has no inherent value, so it requires special
    attention when being used in machine learning algorithms. It''s crucial to know
    how to properly handle and process it. To process textual data with machine learning
    algorithms, we must first transform it into numeric representations. There are
    various techniques for this kind of transformation.


    Textual data can come in different shapes and sizes. News articles, for example,
    are typically composed of multiple sentences and paragraphs, while names of medicines
    and diseases are often short and concise. It is important to ensure that machine
    learning algorithms can distinguish between these different types of textual data
    and transform them into appropriate numeric representations that can be effectively
    used for analysis and modeling.


    An example of using machine learning algorithms with textual data is the classic
    task of classifying fake news or detecting spam and ham emails. Let us focus on
    the fake news classification task as an example. In today''s world, with the widespread'
  - '[PAGE 33]


    # 16 2 Understanding Data—Modalities and Preprocessing


    availability of the Internet, information is easily accessible to everyone. Unfortunately,
    this easy accessibility can also lead to malicious intent, and it can be challenging
    to distinguish genuine information from fake information, particularly in the
    field of journalism. A significant portion of consumers reads news through online
    sources and social media, providing an opportunity for male to exploit the lack
    of critical thinking skills or media literacy of these consumers for their own
    malicious cause.


    One general approach to classifying fake news from real news is to use machine
    learning. As machines can only understand numbers, it is necessary to transform
    the textual data into appropriate numerical representations. Various techniques
    can be used for this purpose, including the bag of words model, word2vec, and
    vector embeddings. These techniques will be explored in later chapters of this
    book. Once we have the data in the appropriate format, we can easily feed it to
    any classification model.


    # 2.1.3 Visual Data


    Visual data is perhaps the most appealing data type for humans. Our brains have
    remarkable image-processing abilities compared to computers. Neurons in our brains
    have a predisposition for images over numbers or texts. In the above examples,
    it is impossible for humans to go through all the numbers in financial transaction
    data to make decisions about credit approvals, and it is equally challenging to
    analyze whether the news is fake or not. If we were presented with a picture of
    a cat and a dog, we would be immediately able to identify the cat and the dog
    from the two pictures.


    Visual data can be either in the form of a still image or a video. In fact, a
    video is a series of still images presented in a rapid sequence. The term “motion
    picture” is aptly named, as it is created by moving multiple pictures in succession.
    Therefore, any technique or algorithm used for images can also be applied to videos.
    For instance, YOLO is a powerful algorithm that works well for object detection
    in images. Videos, YOLO models can be utilized in object-tracking applications,
    allowing for real-time object detection, and tracking.


    However, for computers, the process of understanding visual data is much more
    complex. Computers do not perceive images in the same way as humans do. Rather,
    they see and store images as a multidimensional array of numerical values. Typically,
    these values correspond to the pixel intensity values of the red, green, and blue
    channels. In traditional machine learning, these values are directly passed through
    machine learning models. However, thanks to the success of Convolutional Neural
    Networks (CNN), we are now able to use high-level and low-level image features
    instead of raw pixel intensity values. These techniques will be discussed in later
    chapters of this book.'
