    ## 3.3 聚类


    - 梯度提升分类器

    - XGBoost 分类器

    - AdaBoost 分类器


    ## 3.3 聚类


    聚类是一种无监督机器学习技术。在分类和回归中，我们看到数据集需要标签。相比之下，聚类算法作为一种无监督方法，不需要任何标签。聚类算法尝试在没有人工干预的情况下学习数据中的模式，并将数据集划分为不同的簇。


    聚类算法虽然很有趣，但很难解释，因为我们不知道算法是基于什么基础创建这些簇的。这取决于领域知识专家来确定这些簇的含义。聚类特别不是一种预测解决方案，而是可以作为一种分析工具使用。


    例如，我们可能想使用聚类对金融机构的客户类型进行细分。但如果没有金融知识，我们可能无法根据这些聚类算法的输出做出决策。在图 3.11 中，我们看到簇是根据某个金融机构的数据集创建的，但我们不知道这些簇代表什么。


    ![](img/a499312facf6bd3577be03d7b7eddea9_54_0.png)


    **图 3.11** 基于收入和消费行为划分客户类别的聚类分析


    ## 3 基础构建模块：从浅层到深度学习


    ![](img/a499312facf6bd3577be03d7b7eddea9_55_0.png)


    图 3.12 K-means 聚类显示了五个簇及其质心。


    ### 3.3.1 K-Means 聚类


    K-Means 是一种要求执行者知道可能簇数量的聚类算法。假设簇的数量为 $K$。该算法从随机选择 $k$ 个质心作为簇的质心开始。然后在一个迭代过程中，重新计算质心的位置，最终找到优化的质心。两点
    $p(p_1, p_2)$ 和 $q(q_1, q_2)$ 之间的距离可以使用欧几里距离公式计算：$d(p, q) = \sqrt{(p_1 - q_1)^2
    + (p_2 - q_2)^2}$。然后将质心附近的点分配给它们所属的簇。当簇的质心与其他点的距离最小化时，算法停止。算法也可以强制在经过次数迭代后停止（图
    3.12）。


    ### 3.3.2 DBSCAN


    DBSCAN 是基于密度的应用空间聚类的缩写。与 K-Means 聚类不同，DBSCAN 是一种不需要执行者指定簇数量的算法。DBSCAN 算法使用两个参数：


    - minPts：被认为一个簇所需要的最少点数（或阈值）。

    - eps：两点之间的距离测量，以便它们被认为是一个簇。


    ## 3.3 聚类


    ![](img/a499312facf6bd3577be03d7b7eddea9_56_0.png)


    图 3.13 DBSCAN 算法


    该算法从在数据集中选取随机点开始，然后开始寻找最小点数。如果满足阈值条件，就会形成一个簇。然后在一个迭代过程中，它通过搜索附近的点开始寻找其他点（图 3.13）。


    ### 3.3.3 高斯混合模型


    高斯混合模型 (GMM) 是另一种使用概率方法进行聚类的无监督方法。正如其名所示，高斯混合包含几个不同的高斯分布（假设为 $k$，其中 $k$ 是簇的数量）。GMM
    后面的数学原理相对直观。一个 GMM 由两组集合定义：混合权重 $\pi_k$ 以及分量均值 $\mu_k$ 和协方差 $\Sigma_k$。混合权重表示每个高斯分量的相对重要性，分量均值和协方差定义了每个组件分布的中心和形状。GMM
    的概率密度函数由以下方程给出：$p(x) = \sum_{k=1}^k \pi_k N(\mu_k, \Sigma_k)$，其中 $N(\mu_k, \Sigma_k)$
    是 $k$ 的高斯概率密度（图 3.14）。


    ![](img/a499312facf6bd3577be03d7b7eddea9_57_0.png)


    图 3.14 高斯混合模型


    我们看到数据集被分为三个簇，每个簇都有自己的均值方差。简单来说，GMM 模型执行软分类（不像 k-means 聚类是在质心周围画一个圆圈，这给出了数据点属于某个簇的概率）。让我们以二维空间为例。k-means
    聚类使得处理长方形数据变得困难（在 K-Means 聚类的插图中可以所示）。高斯混合模型可以通过创建长方形簇来处理这个问题。


    ## 3.4 降维


    在机器学习中，维度指的是数据集中特征的数量。虽然我们可能会认为特征数量越多，我们的模型就越好，因为我们现在有更多数据来训练预测器，但我们必须理解机器学习模型是如何工作的，以便使用最优数量的特征。机器学习需要大量数据集是有原因的。我们将维度灾难，随后讨论如何减少维度以使我们的预测器表现良好。


    ### 3.4.1 维度灾难


    让我们取一个只有一个特征的简单例子（图 3.15 中的第一张图）。我们看到没有稀疏性，图表上的数据点分布均匀，这意味着所有可能的空间都很好地代表了我们拥有的数据点。因此，如果我们在这这样的数据集上训练模型，就可以获得一个覆盖大多数情况的预测器。


    让我们增加一个特征（看图 3.15 中的第二张图）。在这个图表中，数据点的数量保持不变，但我们引入了一个新维度。我们看到二维空间是稀疏的。然而，这些数据点仍然能够代表二维空间。当我们向空间再增加一个维度时，情况变得有趣了。由于数据点数量保持相同，我们看到空间非常稀疏，这些数据点无法准确地代表该空间。机器学习需要大量数据集是有原因的。我们将维度灾难，随后讨论如何减少维度以使我们的预测器表现良好。


    '
