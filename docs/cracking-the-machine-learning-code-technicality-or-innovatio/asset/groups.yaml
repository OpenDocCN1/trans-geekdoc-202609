    ## # 主成分分析


    ![](img/a499312facf6bd3577be03d7b7eddea9_61_0.png)


    $Y = X * W$。通常，我们选择 $k$ 以使其能够解释数据中的显著方差（例如 95% 或 99%）。


    ## # 3.5 深度学习


    深度学习是一种基于人工神经网络（ANN）的机器学习技术，它模拟了人类大脑的工作方式。神经网络的基本单元称为神经元，它们接收输入并根据数学计算给出输出。这些人工神经类似于人类大脑中的神经元。在经过数学运算后，通过一个激活函数，如果达到某个阈值，该神经元就会激活或点火（图
    3.18）。


    输入将是数值 $x_1, x_2$ 等。$w_1, w_2$ 等是神经元的权重，告诉我们该输入有多重要：


    ```

    $z = x_0 * b + x_1 * w_1 + x_2 * w_2 + \cdots + x_n * w_n$.

    ```


    我们将输出通过一个称为激活函数的函数，该函数决定神经元是否应该点火，$y = f(z)$。


    ![](img/a499312facf6bd3577be03d7b7eddea9_62_0.png)


    **图 3.18** 神经元的基本结构


    这些激活函数为模型引入了非线性，因此如果有足够的神经元层，它们甚至可以处理高度非线性的数据。表 3.1 显示了一些激活函数 [6–9]。从理论上讲，描述的神经元可以以各种方式组合以近似任何函数。这些被称为神经网络，与前面节描述的浅学习技术相比，它们需要大量的数据进行训练。


    一旦生成输出，我们必须计算损失，损失是真实值与预测值之间距离的量。损失函数的选择取决于我们处理的数据类型。通常，损失函数 $L$ 表示 $loss = L(y,
    y_{target})$。一旦计算出网络的损失，就会使用名为反向传播的数学算法。


    反向传播是一种用于训练神经网络的数学技术。它涉及计算损失函数关于网络权重和偏置的梯度。该梯度随后被用于调整权重和偏置，旨在最小化损失。为了计算损失相对于输出的梯度，我们使用偏导数：


    $\frac{\partial L}{\partial z} = \frac{\partial L}{\partial y} \frac{\partial
    y}{\partial z}$


    使用该梯度，我们可以更新第 $n$ 层的权重，$w_{new} = w_n - \alpha \frac{\partial L}{\partial h_{n-1}}$，其中
    $\alpha$ 是学习率，$y_n$ 是最后一层的输出。不可学习的参数 $\alpha$ 决定了算法的学习速度。将其设置过高可能会导致非最优解，并可能导致收敛缓慢。因此，针对不同的问题尝试不同的学习率是明智的。使用这种方法，整个神经网络的权重都会重新计算。重复此过程直到达到所需的损失。


    **Sigmoid 函数：** Sigmoid 函数输出范围在 0–1 之间的值。这与二分类配合得很好，因为二分类的输出是 0 或 1。


    ### 表 3.1 常见激活函数、公式和插图


    | 激活函数 | 公式 | 插图 |

    | :--- | :--- | :--- |

    | Sigmoid | $y = \frac{1}{1+e^{-x}}$ | ![image]() |

    | ReLU | $y = \begin{cases} x, & x > 0 \\ 0, & \text{otherwise} \end{cases}$ |
    ![image]() |


    ### 表 3.1（续）


    | 激活函数 | 公式 | 插图 |

    | :--- | :--- | :--- |

    | Leaky ReLU | $y = \begin{cases} x, & x < 0 \\ ax, & \text{otherwise} \end{cases}$
    | ![Leaky ReLU Graph]() |

    | Tanh | $y = \frac{e^x - e^{-x}}{e^x + e^{-x}}$ | ![Tanh Graph]() |


    **ReLU**：修正线性单元（ReLU）在输入大于 0 时输出与输入相同的值。对于负值，ReLU 的输出为 0。某些神经元接收到 零作为输入并变得不活跃。这不仅减少了计算的复杂性，还有助于泛化。


    **Leaky ReLU**：Leaky ReLU 是 ReLU 的修改版本。它不是消除负输入，而是输出一个所需大小的值。通常该值很小。深度神经网络中的一个问题是梯度在训练过程中会变得极小，使得网络难以有效学习。


    **Tanh 函数：**这是一个双曲正切函数，对于任何输入都输出 -1 到 1 之间的值，使得它对于需要对正负输入进行强分离的任务非常有用。Tanh 激活函数主要出现在
    RNN、自然语言处理（NLP）和语音识别任务中 [10]。


    一个人工网络由许多相互连接的神经元组成（如图 319 所示）。第一层称为输入层，最后一层称为输出层。中间所有的层都称为隐藏层。此类层和神经元的数量与模型的复杂性成正比。这些神经网络也被称为通用函数生成器。


    这些神经网络可以像传统算法一样轻松地解决分类和回归等问题，而不需要太多的调优。分类和回归可以使用不同的配置。例如，我们可以为回归设置一个单一输出来预测一个连续值。对于二分类，我们仍然可以使用单个概率值来使其工作。我们甚至可以使用多个输出节点来描述不同的类别。


    然而，在使用深度学习模型时，有几点需要注意。这些算法是黑箱，很难解释我们是如何得到结果的；解释性丢失了。这些网络需要比传统机器学习模型多得的数据。这些深度学习模型也很容易输出


    ![](img/a499312facf6bd3577be03d7b7eddea9_65_0.png)


    **图 3.19** ANN 架构


    对于特定任务，我们需要多少层或多少神经元也没有通用的规则。


    ### 3.5.1 使用 ANN 进行分类


    对于二分类问题，我们将采用单个输出节点。输入层中的节点数将等于特征总数。由于我们正在使用腰痛数据集（链接在下文的节中给出），它只有两个类（正常病例或异常病例）。所有步骤都像传统的机器学习问题一样。我们只需要构建自己的自定义神经网络即可。


    ANN 的使用不仅限于分类，还可以用于回归问题以及我们之前讨论过的各种机器学习问题。然而，深度学习在计算机视觉和自然语言处理（NLP）等问题上成功，而在这些领域传统的机器学习模型失败了。


    ### 3.5.2 图像分类


    图像数据或非结构化数据无法由传统的机器学习算法处理，但深度学习网络在任何时候都优于任何经典的机器学习模型。我们可以将图像看作像素的多维数组。一个 $16 \times
    16$ 像素的灰度图像。有 256 个唯一的像素代表整个图像。解决图像分类问题的一种简单方法是将这 256 个唯一像素直接输入到全连接神经网络。这意味着对于
    $16 \times 16$ 的图像，我们需要 256 个输入层。想象一下如果图像尺寸更大，网络将有多大！或者想象一下所需的计算能力！此外，这些方法将仅适用于简单的二值图像，对于复杂的图像将失败得惨惨。


