    In simple words, having an imbalance in data means that you have more examples
    of things than others. Let us illustrate this problem with a real-life example.
    Suppose we are teaching a child to differentiate between three shapes: triangle,
    square, and rectangle. The most trivial way to do that is to show one of the shapes
    and tell them the name of this shape. During this teaching experiment, if we were
    to show a smaller number of rectangles than the other two shapes, the child would
    probably confuse rectangles for squares as they look similar. This example not
    only shows the problem of imbalanced data but also addresses the importance of
    sampling data.


    Let us take an example of imbalanced data in the case of a classification model.
    If we assume the world is honest, there would be far lesser of fake news than
    genuine news. This is an example of an imbalanced dataset that occurs inherently.
    Training models on an imbalanced dataset would cause the model to learn less about
    the minority classes, i.e., the model has few samples for the fake news that it
    does not have enough “evidence” to classify it as fake.


    Some imbalance in data also occurs due to human biases when collecting data. One
    of the use cases we refer to in this situation is healthcare informatics [3],
    where authors leveraged sampling techniques on skewed class distribution to enhance
