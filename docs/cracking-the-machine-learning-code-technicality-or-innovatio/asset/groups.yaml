    activates or fires the neuron if a certain threshold is reached (Fig. 3.18).


    The inputs will be the numeric values $x_1, x_2$, and so on. $w_1, w_2$, and so
    on are the weights of the neurons that tell us how important that input is:


    ```

    $z = x_0 * b + x_1 * w_1 + x_2 * w_2 + \cdots + x_n * w_n$.

    ```


    We pass the output through a function called the activation function which decides
    whether the neuron should be fired or not, $y = f(z)$.


    ![](img/a499312facf6bd3577be03d7b7eddea9_62_0.png)


