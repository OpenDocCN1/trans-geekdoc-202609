    \n## 6.2 Objective\n\nThe dataset was gathered to investigate human behavior,\
    \ and we can utilize it to develop a sentiment analysis model. To introduce the\
    \ idea of multimodal learning while keeping the case study straightforward, we\
    \ will focus solely on audio signals and text transcripts. The inclusion of audio\
    \ data allows the model to capture patterns in speech. Sentiment analysis often\
    \ depends on more than just the words used; also factors like tone, pitch, speed,\
    \ and other acoustic characteristics of speech. By incorporating audio, the model\
    \ can consider these additional factors when determining sentiment. Simultaneously,\
    \ the text transcripts provide the model with the vocabulary and language used\
    \ in the spoken content. By combining audio and text modalities, the goal is to\
    \ create a sentiment analysis model that is more robust and accurate. This multimodal\
    \ approach leverages the strengths of both audio and text to improve the model's\
    \ performance. It can capture the richness of sentiment expressed in speech and\
    \ the subtleties of language used in text, making it better equipped to understand\
    \ sentiment in a variety of contexts.\n\nIn summary, the idea here is to enhance\
    \ sentiment analysis by leveraging a dataset that includes both audio and text\
    \ data. This approach acknowledges sentiment is a complex concept influenced by\
    \ both the content of the words and the way they are spoken. By considering both\
    \ modalities, the model aims to provide a more comprehensive and accurate analysis\
    \ of sentiment in human behavior data.\n\n## 6.3 Dataset\n\nThe dataset we use\
    \ for this extension is the Interactive Emotional Dyadic Motion Capture (IEMOCAP)\
    \ dataset. The dataset stands as a rich resource in the field of emotional communication\
    \ research. Compiled at the SAIL lab at the University of South Carolina, this\
    \ database is a curated collection of 12 h of audiovisual content. Encompassing\
    \ video footage, speech records, facial motion capture data, and text transcripts,\
    \ the dataset is designed to offer a comprehensive understanding of human emotional\
    \ expression. The dataset offers a diverse range of modalities for analysis, including\
    \ motion capture face information, speech recordings, videos, head movement, head\
    \ angle information, and dialog transcripts.\n\nNotably, it provides alignment\
    \ at various linguistic levels, such as word, syllable, and phoneme.\n\n### 6.3.1\
    \ Purpose\n\nWithin the IEMOCAP database, dyadic sessions unfold, featuring actors\
    \ engaged in both improvisational and scripted scenarios. These scenarios are\
    \ thoughtfully chosen to evoke a spectrum of emotional responses, providing a\
    \ nuanced exploration of human expression. The uniqueness of this database lies\
    \ not only in its extensive content but also in the incorporation of multiple\
    \ modalities, including speech, facial expressions, and body language.\n\nThe\
    \ meticulous annotations provided by multiple annotators further enhance the database's\
    \ value. Emotions are categorized into labels such as anger, happiness, sadness,\
    \ and neutrality. Additionally, dimensional labels like valence, activation, and\
    \ dominance contribute to a more nuanced understanding of the emotional landscape\
    \ captured in the dataset.\n\nResearchers and practitioners in the IEMOCAP field\
    \ of multimodal and expressive human communication will find the database to be\
    \ an invaluable asset. Its detailed motion capture information, the use of interactive\
    \ services to elicit authentic emotions, and the substantial size of the dataset\
    \ collectively position it as a significant addition to existing resources in\
    \ the research community. This corpus promises to further exploration and advancements\
    \ in the study and modeling of human emotional communication.\n\nThe dataset can\
    \ be requested and downloaded through their website. There are two datasets: one\
    \ containing the visual recording and one without the visual recording. For demonstration\
    \ and to make reproducibility less complicated, we access the dataset containing\
    \ auditory recordings.\n\n### 6.3.2 Description\n\nThe 12 h audiovisual recordings\
    \ are segmented into sentences (or turns). Segmentation resulted in 1039 turns\
    \ where 5255 are scripted and 4784 are spontaneous sessions. There are two annotations:\
    \ categorical-based annotation (anger, happiness, sadness, etc.) and continuous\
    \ value-based annotation (valence, activation, and dominance). In this chapter,\
    \ we are interested in classifying the emotions using categorical labels and this\
    \ will be the sum used. The average duration of the turns and the number of words\
    \ per turn is shown in Fig. 6.1.\n\nThe distribution of data for each emotion\
    \ category is well distributed except surprise and fear. The distribution for\
    \ scripted and spontaneous sessions is shown in\n\n^2 https://sail.usc.edu/iemocap/index.html.\n\
    \n![](img/a499312facf6bd3577be03d7b7eddea9_127_0.png)\nFig. 6.1 Histogram showing\
    \ the number of words per percent in scripted and spontaneous sessions (left to\
    \ right) [1]\n\n![](img/a499312facf6bd3577be03d7b7eddea9_127_1.png)\nFig. 6.2\
    \ Distribution of emotion category in scripted and spontaneous sessions (from\
    \ left to right) [1] The charts show that a higher percentage of people are experiencing\
    \ positive emotions, such as happiness and excitement, than negative emotions,\
    \ such as sadness and anger. The emotion category fear is the least with less\
    \ than one percent of the total emotion category in scripted and spontaneous sessions.\n\
    \n## 6.4 Implementation\n\nThe implementation of multimodal learning is shown\
    \ in Fig. 6.3. The audio and text data are fed as input to the model. Since an\
    \ audio signal is a sequence of numerical data and text is a sequence of words,\
    \ the feature extraction for each is done differently. The extracted features\
    \ are then fused and passed through fully connected layers and finally through\
    \ the output layer. The implementation details for each modality are discussed\
    \ in the latter part of this section.\n"
  mdcn: "\n\n# 第 6 章\n 多模态学习与表示\n\n本章深入探讨了多模态学习与表示的概念，以情感分析为例，并参考了 IEMOCAP 数据集 [1]。尽管这超出了本文的研究范围，但我们也受到了此前此前关于医学信息学的“多模态学习与表示”工作\
    \ [2] 的启发。该数据集 [1] 比我们在前面章节中遇到的数据集更为复杂，为获得真实世界数据的经验提供了宝贵机会。该数据集包含约 12 小时的录音，由\
    \ 10 名演员展示各种情绪。录音涵盖了动作捕捉、视频和音频数据，以及对话的文本转录。本章的后续章节将介绍更多细节。为了说明这一概念，我们将采用音频信号（数值时间信号数据）和文本转录来演示多模态学习。任务是预测十种情绪状态之一：愤怒、悲伤、快乐、厌恶、恐惧、惊讶、兴奋和中性状态。数据集可以通过其主页申请。\n\
    \n^1 https://sail.usc.edu/imecocap/imecocap-release.html。\n\n## 6.1 情感分析\n\n情感分析（有时被称为意见挖掘）是人工智能中的一个领域，我们试图衡量数据中积极和消极情绪的程度。传统上，情感分析认为与自然语言处理相关\
    \ [3–5]。然而，正如我们所论证的，情感和情绪（例如 [6]）不仅可以通过文本表达，还可以通过口语或视觉线索表达——对话中的愤怒可能无法通过文本数据完全覆盖。句子“你喜欢冰淇淋吗？”末尾上扬的语调可能表示提问者对其喜欢冰淇淋感到惊讶，但中性的语调可能表示此人只是好奇想知道你喜不喜欢冰淇淋。句子增加的语气可以提供更多背景，以做出更明智的决策。\n\
    \n近年来，研究人员对利用多模态特征进行情感分析越来越感兴趣 [7–9]。文本特征结合视听特征被广泛用于证明多模态表示学习在情感分析中的稳健性。\n\n##\
    \ 6.2 目标\n\n收集该数据集的目的是为了研究人类行为，我们可以利用它来开发情感分析模型。为了在保持案例研究简单的同时引入多模态学习的概念，我们将仅关注音频信号和文本转录。音频数据的加入允许模型能够捕捉语音中的模式。情感分析通常不仅取决于所使用的词，还取决于语调、音高、速度以及语音的其他声学特征等因素。通过结合音频，模型可以在确定情感时考虑这些额外因素。同时，文本转录为模型提供了口语内容中词汇和语言。通过结合音频和文本模态，目标是创建一个更稳健、更准确的情感分析模型。这种多模态方法利用了音频和文本的优点来提高模型性能。它可以捕捉语音中表达的情感丰富性，以及文本中所用语言的细微差别，使其能够更好地理解各种语境下的情感。\n\
    \n总而言之，这里的思想是利用一个包含音频和文本数据的数据集来增强情感分析。这种方法承认情感是一个复杂的概念，受到词汇内容和说话方式的影响。通过同时考虑两种模态，模型旨在对人类行为数据中的情感提供更全面、更准确的分析。\n\
    \n## 6.3 数据集\n\n我们用于此扩展部分的数据集是交互式情感双人动作捕捉（IEMOCAP）数据集。该数据集是情感通信研究领域的一个丰富资源。该数据库由南卡罗来纳大学的\
    \ SAIL 实验室汇编，是 12 小时视听内容的精选集。数据集涵盖了视频片段、语音记录、面部动作捕捉数据和文本转录，旨在对人类情感表达提供全面的理解。该数据集提供了分析的多样模态，包括动作捕捉面部信息、语音录音、视频、头部运动、头部角度信息和对话转录。\n\
    \n值得注意的是，它提供了不同语言层面的对齐，例如单词、音节和音素。\n\n### 6.3.1 目的\n\n在 IEMOCAP 数据库中，开展了双人会话，演员参与了即兴和剧本化的场景。这些场景经过深思熟虑的选择，以唤起一系列情感反应，对人类表达进行细致入微探索。该数据库的独特之处不仅在于其丰富的内容，还在于结合了多种模态，包括语音、面部表情和肢体语言。\n\
    \n多位标注者提供的细致注释进一步增强了数据库的价值。情绪被分类为愤怒、快乐、悲伤和中性等标签。此外，效价（valence）、激活（activation）和主导（dominance）等维度标签有助于更细致地理解数据集中捕捉的情感图谱。\n\
    \n多模态和表达性人类通信领域的 IEMOCAP 研究人员和从业者将发现该数据库是无价之宝。其详细的动作捕捉信息、使用交互服务诱发真实情感，以及数据集的大规模，共同使其成为研究社区现有资源的重要补充。这一语料库有望促进人类情感通信研究和建模的进一步探索与进展。\n\
    \n数据集可以通过其网站申请和下载。有两个数据集：一个包含视频录制，另一个不包含视频录制。为了演示并简化可重复性，我们访问了包含音频记录的数据集。\n\n\
    ### 6.3.2 描述\n\n12 小时的视听录音被分成句子（或轮次）。分割产生了 1039 轮，其中 5255 处是脚本化的，4784 处是自发会话。有两种标注：基于类别的标注（愤怒、快乐、悲伤等）和基于连续值的标注（效价、激活和主导）。在本章中，我们感兴趣使用类别标签对情绪进行分类，并将以此作为使用依据。每轮的平均时长和每轮的单词数如图\
    \ 6.1 所示。\n\n每个情绪类别的数据分布良好，惊讶和恐惧除外。剧本化和自发会话的分布见\n\n^2 https://sail.usc.edu/iemocap/index.html。\n\
    \n![](img/a499312facf6bd3577be03d7b7eddea9_127_0.png)\n图 6.1 剧本化和自发会话每百分比单词直方图（从左到右）[1]\n\
    \n![](img/a499312facf6bd3577be03d7b7eddea9_127_1.png)\n图 6.2 剧本化和自发会话中的情绪类别分布（从左到右）[1]\
    \ 图表显示，积极情绪（如快乐和兴奋）的比例高于消极情绪（如悲伤和愤怒）。恐惧情绪类别占剧本化和自发会话总情绪类别的比例小于 1%。\n\n"
