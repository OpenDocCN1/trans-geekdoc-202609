    ### 6.4.1 音频信号


    通过语音识别情感的故事已成为情感计算领域的一个重要关注点 [10]，医疗健康也不例外 [11]。


    音频信号通常被表示为数值时间序列数据，其中每个数据点对应于特定时间内音频信号的振幅。分析这些数据对于音频分类等任务至关重要，在这些任务中，你希望将音频片段分类到不同的类别（例如，语音识别、音乐流派分类）。传统上，递归神经网络（RNN）被用于处理音频信号等序列数据。RNN
    具有循环结构，可以捕捉时间上的依赖关系。然而，它们也存在一些局限性，包括在处理长距离依赖方面存在困难，以及计算效率问题。


    音频频谱图变换器（ASTs）[12, 13] 是音频处理领域的一项较新进展。它们基于 transformer 架构，该架构是无卷积且基于注意力的，这意味着它们依赖于注意力机制，并且能够完全捕捉数据中的序列关系，而不依赖于卷积层。


    ### 6.4.2 文本转录


    在节一章中，我们探索了使用 LSTM 等序列模型进行文本分类。我们还引入了以在 NLP 任务中具有卓越性能而闻名的 transformers。对于我们的研究，我们使用了
    transformer 的编码器部分，特别是 BERT [14]。BERT 代表“来自 Transformer 的双向编码器表示”。像 BERT 这样的预训练模型使我们能够利用迁移学习的优势，减少训练所需的数据量。


    ## 6 多模态学习与表示


    利用 BERT 等预训练模型的另一个优势是，它们在处理输入文本时，消除了对预训练任务的需求（如分词、移除停用词和标点符号）。该编码器产生的输出与来自 AST
    的输出特征相结合。


