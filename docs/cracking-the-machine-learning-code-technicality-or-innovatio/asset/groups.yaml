    ## 第5章：AI 应用案例——从数字到图像


    在本章中，我们将通过机器学习探讨之前章节中讨论的一些有趣的现实场景。


    ## 5.1 数字数据：金融与住房


    当我们谈论数字时，往往会想到金融。几十年来，统计学家使用了各种统计模型来检测欺诈、为客户提供财务咨询、投资组合、预测房价等。


    在本案例中，我们将使用机器学习来研究房价。


    为了构建预测房价的模型，我们首先需要获取数据。这类数据通常由金融机构收集，幸运的是我们不需要自己收集数据。常见的机器学习库为我们提供了可以尝试的各种数据集。我们将使用一个通过
    scikit-learn 提供的波士顿房价数据集。


    ### 表 5.1 波士顿数据集特征描述


    | 特征 | 描述 |

    | :--- | :--- |

    | CRIM | 城镇的人均犯罪率 |

    | ZN | 面积超过 25000 平方英的住宅用地比例 |

    | INDUS | 城镇非零售商业用地比例 |

    | CHAS | 查尔斯河虚拟变量（1 表示区域边界河流，否则为 0） |

    | NOX | 氧化氮浓度（每千万分之一） |

    | RM | 住房的平均房间数 |

    | AGE | 1940 年以前建造的自住单元比例 |

    | DIS | 到波士顿五个就业中心的加权距离 |

    | RAD | 径向公路的可及性索引 |

    | TAX | 每 10000 美元的全额房产税率 |

    | PRTX | 城镇生师比 |

    | B | 1000 (Bk–0.63)²，其中 Bk 是城镇的黑人比例 |

    | LSTAT | 低地位人口百分比 |

    | MEDV (Y) | 自住住房的中位价值（单位：千美元） |


