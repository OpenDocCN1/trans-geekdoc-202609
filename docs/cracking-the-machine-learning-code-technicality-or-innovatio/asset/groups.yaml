    ## 4.6 评估


    模型训练完成后，有必要测试模型的运行是否符合预期。模型性能不佳可能有潜在原因：欠拟合或过拟合 [10, 11]、模型选择不当或特征选择/工程不良 [12]。分析和调整模型的范围不在本书的范围内。然而，评估模型输出的相关性至关重要，在本章节节中，我们将涵盖用于回归、分类和聚类的一些评估技术及其基础数学原理。


    ### 4.6.1 回归


    正如已经提到的，回归模型用于预测连续值。因此，为了评估回归模型，我们使用适用于连续值的指标。用于连续变量的指标是基于距离的指标 [13]，例如均方误差 (MSE)、平均绝对误差
    (MAE)、R方值等 [14]。


    - 均方误差 (MSE)：它是最流行且易于理解的指标之一。顾名其实，它计算了实际值 (y) 与预测值 ($\hat{y}$) 之间差平方和的平均值$MSE=\frac{1}{N}\sum_{i=1}^{N}(y_i-\hat{y}_i)^2$，其中
    $N$ 是预测次数，$y_i-\hat{y}_i$ 是预测值 $\hat{y}_i$ 的误差。


    - 平均绝对误差 (MAE)：MAE 是另一个可评估回归模型的指标。其计算步骤与 MSE 相同，但在 MAE 中，我们不是取误差的平方，而是直接取绝对值$MAE=\frac{1}{N}\sum_{i=1}^{N}|y_i-\hat{y}_i|$。


    - 均方根误差 (RMSE)：RMSE 就是 MSE 的平方根。平方根确保了误差与预测值的尺度相似。它可以定义为 $RMSE=\sqrt{\frac{1}{N}\sum_{i=1}^{N}(y_i-\hat{y}_i)^2}$。


    - R方 ($R^2$)：R方也称为决定系数，衡量特征对因变量方差的解释比例。因此，$R^2=1-\frac{SSR}{SST}$，$SSR$ 是残差平方和，$SST$
    是总平方和。


    ## 4.6 评估


    不应使用单一指标来评估回归模型。然而，指标的选择取决于用例或当前问题的需求。鼓励考虑选择多个评估指标以获得更好的优化。


    ### 4.6.2 分类


    分类问题处理类别变量。可视化和评估分类模型性能的最基本方法是通过混淆矩阵。混淆矩阵是一种特殊的列联表（如图 4.7 所示），其中行和列代表预测值和实际值的类别。二分类混淆矩阵的示例如图4.7
    所示。对于 N 个类，矩阵将是一个 NXN 矩阵。混淆矩阵的一些重要元素包括：


    - **真正性 (True Positive)**：分类为正类的实例数量。

    - **真负性 (True Negative)**：正确分类为负类的实例数量。

    - **假负性 (False Negative)**：错误分类为负类的实例数量。

    - **假正性 (False Positive)**：错误分类为正类的实例数量。


    使用这些元素：


    - (a) **准确率 (Accuracy)**：分类模型的整体正确性。

    - (b) **精确率 (Precision)**：精确率（或正预测值）是指在所有预测为正的实例中，模型正确预测为正的实例的比例。


    | 实际值 | 正 (1) | 负 (0) |

    | :--- | :--- | :--- |

    | 预测负 (0) | 真正性 TP | 假正性 FP |

    | 预测正 (1) | 假负性 FN | 真负性 TN |


    ```

    $Accuracy = \frac{TP + TN}{TP + FP + FN}$

    $Precision = \frac{TP}{TP + FP}$

    $Recall = \frac{TP}{TP + FN}$

    $Specificity = \frac{TN}{TN + FP}$

    $Precision \cdot Recall = 2 \cdot \frac{Precision}{Precision + recall}$

    ```


    **图 4.7** 二分类问题的混淆矩阵及导出的评估指标


    因此，当你想要最小化假正性时，应该使用它。


    - **召回率 (Recall / 灵敏度或真正率)**：它是衡量模型正确预测为正的实际正类实例占的比例。因此，它在应该避免假负性的情况下应当使用。


    - **特异性 (Specificity / 真负率)**：特异性是衡量模型正确识别负类实例能力的指标。


    - **F1 分数**：它是召回率和精确率的调和平均数。由于召回率和精确率反相关，F1 分数提供了这两个指标之间的平衡。


    ### 4.6.3 聚类分析


    聚类是一种无监督技术，因为没有相关的标签因变量，评估可能会变得模糊。聚类的效果还取决于应用领域的用例。例如，如果对在线商店的客户（商业世界）进行聚类分析，可以根据消费行为形成聚类。

