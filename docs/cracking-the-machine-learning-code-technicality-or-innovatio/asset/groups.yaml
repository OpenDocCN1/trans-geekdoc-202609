    ## 1 引言


    这种数据驱动的决策方法非常有前景，且多功能性，足以应用于其他领域。一旦我们掌握了有效处理和利用数值数据的技能，就可以轻松地将这些知识应用到不同的领域和场景。我们用于理解住房市场的相同算法和分析方法也可以被用于预测疾病爆发、评估制造业中的资源需求，并为各种挑战提供解决方案。


    ### 1.1.2 公平的新闻与媒体


    “虚假信息是一个老话题，正受到新技术的推波” [12]。操纵信息并不新鲜，自古以来就有。随着时间的推移，我们发现了传播信息的新方法，甚至是更新的操纵信息的方法。社交媒体是大多数人最大的信息来源之一。但美国三分之一（31%）的成人从
    Facebook [13] 获取新闻。这些社交媒体平台是伪造新闻的易事场所，因为来源很多，无法将新闻与真实新闻区分来。


    生成式 AI 的进步使得制作虚假内容变得更加容易。最近在孟加拉，AI 生成的深度伪造（deepfakes）影响着 2024 年的。根据多个新闻来源 [14,
    15]，亲政府媒体使用 HeyGen 等 AI 工具制作了一个视频，指控美国外交官干预孟加拉的选举过程。AI 生成的主播员“Edward”传播了虚假信息，影响了公众认知。尽管存在威胁，但仍缺乏有效的检测技术。全球科技巨头的努力（如
    Google 和 Meta 的披露政策）在较小市场是不够的。这凸显了对高级 AI 检测、监管和国际合作的迫切需求，以保持媒体和新闻的公平。


    在第二个案例研究中，我们观察 AI 如何缓解新闻伪造和操纵的问题。早期的新闻在发布之前需要进行人工事实核查 [16]，这是一项手动任务。随着新闻出版数量的增加，核查大多数事实并不困难，而且检查它们的信誉也很容易。然而，正如所讨论的，由于互联网，现在任何人可以在互联网上发布任何内容。轻信的读者会掉入这种欺骗性的设计，而不那么容易利用的读者至少会尝试进行事实核查。但事实核查变得混乱混乱，因为有大量信息被人们当作事实呈现出来。因此，随着
    AI 的进步，我们现在可以处理大量的文本来检测虚假信息的模式 [17]。例如，核查新闻文章是 AI 在新闻领域的众多应用之一（图 1.2）。


    互联网和社交媒体以文本的形式出现。文本是我们经常遇到的另一种模态，而对于我们的案例研究，我们关注新闻文章中的虚假新闻检测。


    **图 1.2** 虚假新闻


    ![](img/a499312facf6bd3577be03d7b7eddea9_23_0.png)


    新闻分类数据集。这是一个分类问题，但它需要一些预处理的特殊模型，如 transformers [18] 和 RNN，我们将在后续章节中介绍它们。


    ### 1.1.3 医学影像信息学


    医学信息学是指将信息技术、数据科学（例如，预测 [19]）、分析、机器学习和人工智能应用于健康相关数据的管理、分析和解释中，特别关注医学影像 [20]。每天产生的海量健康相关数据包括各种类型的信息，例如来自个人设备（如健身心率监测器、移动端应用程序）、环境传感器、电子健康记录、病理报告、实验室结果、医学影像、语音记录等。


    AI 改变了医学影像的格局。机器学习被广泛用于检测 X 光异常 [21–26]、CT 扫描 [25, 27–30] 和 MRI 扫描 [31]。所有的诊断都需要这些类型的影像，如
    CT 扫描、X 光、MRI 扫描等。根据世界卫生组织的说法，70% 到 80% 的诊断问题可以通过更廉价的成像技术（如 X 光和超声）解决。近期，计算机视觉和深度学习技术已用于通过
    X 光检测新冠肺炎 [33–35]。医学影像涵盖了广泛的应用，包括使用堆叠泛化模型分析 X 光、通过分割方法检测 TB 以及通过深度学习进行脑肿瘤图像分割。AI
    的影响也体现在生物医学应用中的 3D 成像等领域 [19]。然而，全球三分之二的人无法获得影像诊断。问题的出现不仅是因为缺乏适当的仪器，还因为放射科医生和专业技术人才的短缺。尽管
    AI 可能在提供仪器方面没有帮助，但通过自动化诊断可以缓解劳动力需求。目前已有手持工具，例如 Micro-CXOS [36]，这是一种手持 X 光设备。在这些设备中集成深度学习视觉模型可以有效解决这些问题并帮助资源限制地区。此外，为了确保数据隐私，可以结合联邦学习技术
    [24]。


    我们在后续章节中看到的最后一个案例是医学影像领域。例如，我们将讨论的最后一种模态，即图像无处不在，研究如何使用浅层和深度学习有效处理图像是有意义的，但最重要的无疑是
    CNN（卷积神经网络）[38, 39]。所有的深度学习架构都使用 CNN 作为构建组件。在第 5 章中，我们将学习使用和不用 CNN 开发深度学习模型。目前的实现包括多模态技术和主动医学影像的使用
    [20, 40, 41]。


    对于我们的案例研究，我们选择了来自 NIH [21] 的各种胸部 X 光图像（见图 1.3）。X 光是许多肺部疾病（如结核、肺癌和肺炎）的主要诊断影像工具
    [26, 42]。数据集包含与肺部相关的各种状况，但为了简单起见，我们只考虑两种情况：正常和异常。更多将在第 5 章的实现中解释。


    图 1.3 X 光图像中的肺肿检测 [21]


