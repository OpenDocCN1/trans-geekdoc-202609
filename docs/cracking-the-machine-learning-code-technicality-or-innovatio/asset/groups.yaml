    图像过滤器


    图 3.20 卷积过程


    ```

    y = Image * Filter


    0*1+1*0+0*0+

    y=0*0+2*0+1*0+

    0*0+4+5*1


    y=0+0+0+

    0+0+0+

    0+0+5


    y=5

    ```


    信号处理中，$x(t)$ 和 $h(t)$ 是输入信号，类似于 CNN 过程中的图像和滤波器。*星号或圆星号*表示卷积操作，$\tau$ 是代表时间偏移的积分变量，代表了
    CNN 中池化的数量（关于池化的更多将在后续章节介绍）。


    **卷积层**是 CNN 的核心模块。在这一层中，滤波器（或特征检测器）在图像上滑动以计算点积（如图 3.20 所示），从而生成特征图。这些是学习图像局部特征的可学习参数。


    **池化层**也利用在图像上滑动的滤波器，将特征图划分为多个区域（池），并为每个池提取一个单值（例如，最大值、平均值）。这个单值代表了该位置出现特征的总结。


    **展平层**将来自最大池化层的特征图（这些仍为二维数组）展平（变为一维数组），以便输入到模型（全连接 ANN）。


    **全连接层**是我们在第 3.5.1 节中已经讨论过的 ANN。


    ## 3.6 自然语言处理


    自然语言处理（NLP）是人工智能的一个子集（有时也被称为计算机科学的一个分支），旨在教授机器理解和生成人类使用的语言。NLP 帮助从非结构化文本中提取有价值的信息。与其说机器学习或深度学习是一种工具，不如说
    NLP应该被视为一个可以使用机器学习（ML）和深度学习（DL）工具解决的问题。


    “John 吃了一个苹果”


    ![](img/a499312facf6bd3577be03d7b7eddea9_68_0.png)


    图 3.21 NLP 过程


    解决 NLP 问题需要特定的数据预处理（图 3.21）：


    - **归一化**：移除标点符号并将所有单词转为小写。这样做是因为我们每次都需要单词的统一表示形式。例如，如果我们搜索单词 ''john''，它也应该返回
    ''John'' 甚至 ''JOHN''。

    - **分词**：这是 NLP 的第一步。在此期间，整个句子被切分成更小的单元：单词列表。

    - **停用词去除**：停用词是语言中出现非常频繁的词。这些词会被过滤掉，因为它们没有提供价值的信息且是冗余的。

    - **词干提取/还原**：有时单词会以多种形式出现，例如 went 和 give 的含义相同。在 NLP 中，含义相同的单词会被还原为同一个词。词干提取为给定的根词使用根词，而词形还原则根据单词使用时的上下文来还原单词。


    ### 3.6.1 向量化


    向量化是指将文本转换为计算机可以理解的数值向量的方法。这是从文本到机器可读格式的特征提取。向量化的输出被馈到机器学习或深度学习算法中。有很多类型的向量化方法。


    ### 词袋向量化


    词袋（BoW）[14] 是最简单的向量化方法。我们构建一个句子（或文档）以及这些句子中单词的稀疏矩阵，并统计这些单词的频率[15]。随着词汇数量的增加，矩阵变得越来越大（图
    3.22）。


    ### TF-IDF 向量化


    词袋模型赋予常用词（如冠词和介词）更高的权重，这可能会产生误导。相反，TF-IDF 使用算法降低常用词的重要性，并增加常见词（通常这些词通常包含更多信息）的重要性[16]。


    | | machine | learning | book | textbook | of | life |

    |---|---|---|---|---|---|---|

    | machine learning book | 1 | 1 | 1 | 1 | 0 | 0 |

    | The deep learning textbook | 1 | 0 | 1 | 0 | 1 | 0 |

    | The book of the book | 1 | 0 | 0 | 2 | 0 | 1 |


    **图 3.22** 词袋


    **词频**（TF）可以定义为特定单词的频率与该文档中单词总数之比。它可以被看作是一个归一化分数：


    $$TF = \frac{\text{单词在文档中的频率}}{\text{该文档中的单词总数}}$$


    **文档频率**（DF）告诉我们包含该单词的文档比例：


    $$DF = \frac{\text{包含单词 W 的文档数}}{\text{文档总数}}$$


    **逆文档频率**（IDF）是文档频率倒数的对数。随着包含某个单词的文档总数增加，该词重要性就会降低。我们对该值取对数（因为包含该单词的文档总数增加，它的重要性会降低）：


    $$IDF = \log\left(\frac{\text{文档总数}}{\text{包含单词 W 的文档数}}\right)$$


    **Word2vec**


    Word2vec 是2013年的一种新方法。在之前的方法中，我们看到单词是用数百表示的。Word2vec 的思想是创建词嵌入。从数学上讲，skip-gram
    模型定义为


    $$P(w_c|w_t) = \frac{\exp(v_c \cdot v_t)}{\sum_{i=1}^{V}\exp(v_i \cdot v_t)}$$


    其中 $w_c$ 是上下文词，$w_t$ 是目标词，$V$ 是词汇大小。


    ### 3.6.2 循环神经网络


    循环神经网络（RNN)[18] 是处理序列或时间序列数据的神经网络。由于模型的特性，这些模型可以保留记忆。因此，这种模型用于自然语言处理，因为语言也是单词序列。


    ![](img/a499312facf6bd3577be03d7b7eddea9_71_0.png)


    **图 3.24** 循环架构。折叠（左）和展开（右）


    图 3.24 的左侧显示了 RNN 的折叠表示，右侧是展开表示。绿色圆表示时间 $t$ 的输入（例如单词序列），蓝色圆表示隐藏层，红色圆表示网络的输出。时间
    $t$ 的隐藏状态 $h$ 通过 $h(t) = f(U.x(t) + W.h(t-1))$ 计算。其中 $U, W$ 分别代表输入与隐藏层之间以及隐藏层之间关系的权重矩阵。


    ### 3.6.3 Transformer


    Transformer 是处理序列到序列 NLP 问题的神经网络架构。序列到序列意味着如果给模型一个序列（例如单词序列），它将输出一个序列（例如单词序列）。Transformer
    基于自注意力层。正因如此，Transformer 在处理长距离依赖关系方面特别有用。让我们用一个例子来说说明。假设我们想将一个句子从法语翻译成英语。这个问题要求，无论句子有多长，每个单词对于它之前的单词都有上下文和相关性。


