    less important. We take the log of this value (because the Inverse document frequency
    alone could be an exceptionally substantial number as there might be a hundred
    thousand documents and very few documents containing the word):


    IDF = \log\left(\frac{\text{Total number of documents}}{\text{Document containing
    the word W}}\right), \text{ and } TF - IDF = TF \times IDF$.


    # **Word2vec**


    Word2vec is a novel approach developed by Google in 2013 [17]. In the previous
    approaches, we saw that the words were represented by a single entity (meaning
    we had one hundred words in the vocabulary, we needed a vector of one hundred
    elements. Imagine hundreds of thousands of words.). The main idea Word2vec is
    to create a word embedding where similar words are grouped together. The illustration
    of implementation is described as shown in Fig. 3.23. In the figure, for a given
    word ''Doctor'', a similar word is ''Scientist'', where both are a type of profession
    and are closer to each other in the vector representation.'
