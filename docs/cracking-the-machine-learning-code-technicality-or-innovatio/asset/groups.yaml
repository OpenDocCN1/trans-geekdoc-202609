    ## 3.6 Natural Language Processing


    Natural Language Processing (NLP) is a subset of Artificial Intelligence (sometimes
    it is referred to as a branch of computer science) that deals with teaching machines
    to understand and generate languages spoken by humans. NLP helps extract valuable
    information from unstructured texts. Instead of a tool like machine learning or
    deep learning, NLP should be considered as a problem that can be solved using
    ML and DL tools.


    "John ate an apple"


    ![](img/a499312facf6bd3577be03d7b7eddea9_68_0.png)


    Fig. 3.21 NLP process


    Solving NLP problems requires some specific data preprocessing (Fig. 3.21):


    - **Normalize**: Remove punctuation and lowercase all words. We do this because
    we need a uniform representation of words every time. For instance, if we search
    for the word ''john,'' it should also return ''John'' or even ''JOHN.''

    - **Tokenize**: It is the first step of NLP. During this, the whole sentence is
    chopped into smaller units: a list of words.

    - **Stop words removal**: Stop words are those that occur very frequently in the
    language. These words are filtered as they do not give valuable information and
    are redundant.

    - **Stemming/Lemmatization**: Sometimes a word can occur in many forms, such as
    went and to give the same meaning. In NLP, words that give the same meanings are
    reduced to the same word. Stemming uses the root word for the given root, while
    lemmatization uses the context in which the word was used to reduce the word.


    ### 3.6.1 Vectorization


    Vectorization refers to the method of conversion of texts to numerical vectors
    that computers understand. It is a feature extraction from texts to machine-readable
    formats. Outputs of the vectorization are fed to the Machine Learning or Deep
    Learning algorithms. There are many types of vectorizations.


    ### Bag of words vectorization


    Bag of Words (BoW) [14] is the simplest method of vectorization. We construct
    a sparse matrix of sentences (or documents) and the words that occur in those
    sentences and count the frequency of those words [15]. As the number of vocabulary
    increases, the matrix becomes larger (Fig. 3.22).


    ### TF-IDF vectorization


    Bag of words models give more importance to common words, such as articles and
    prepositions, which can be misleading. TF-IDF, on the other hand, uses algorithms
    to reduce the importance of common words and increase the importance of common
    words, which are often more informative [16].


    | | machine | learning | book | textbook | of | life |

    |---|---|---|---|---|---|---|

    | machine learning book | 1 | 1 | 1 | 1 | 0 | 0 |

    | The deep learning textbook | 1 | 0 | 1 | 0 | 1 | 0 |

    | The book of the book | 1 | 0 | 0 | 2 | 0 | 1 |


    **Fig. 3.22** Bag of words


    **Term frequency** (TF) can be defined as the ratio of the frequency of a particular
    word to the total number of words in that document. It can be thought of as a
    normalized score:


    $$TF = \frac{\text{Frequency of the word in the document}}{\text{Total number
    of words in that document}}$$


    **Document frequency** (DF) gives us the proportion of the documents that contain
    that word:


    $$DF = \frac{\text{Document containing the word W}}{\text{Total number of documents}}$$


    **Inverse document frequency** (IDF) is the log of the inverse of the document
    frequency. As the total number of documents containing a word increases, it becomes
    less important. We take the log of this value (because the total number of documents
    containing a word increases, it becomes less important):


    $$IDF = \log\left(\frac{\text{Total number of documents}}{\text{Document containing
    the word W}}\right)$$


