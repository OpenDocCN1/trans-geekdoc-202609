  md: '# Chapter 6

    Multimodal Learning

    and Representation


    This chapter delves into the concept of multimodal learning and representation,
    using sentiment analysis as an example and drawing from the IMOECAP dataset [1].
    Even though it is beyond the scope of the work, we are also inspired by our previous
    work titled "multimodal learning and representation" on medical informatics [2].
    This dataset [1] is more intricate than the ones we encountered in earlier chapters,
    providing a valuable opportunity to gain experience with a real-world dataset.
    This dataset comprises roughly 12 h of recordings featuring 10 actors displaying
    various emotions. The recordings encompass motion capture, video, and audio data,
    as well as text transcripts of the dialogues. More details are covered in the
    following sections of this chapter. To illustrate the concept, we will employ
    audio signals (numerical time signal data) and text transcripts to demonstrate
    multimodal learning. The task is to predict one of ten emotional states: anger,
    sadness, happiness, disgust, fear and surprise, excited and neutral states. The
    dataset can be requested through their homepage.^1


    # 6.1 Sentiment Analysis


    Sentiment analysis (sometimes referred to as opinion mining) is a domain in AI,
    where we try to measure the degree of positive and negative emotions in data.
    Traditionally, sentiment analysis is used to be related to natural language processing
    [3–5]. However, as we argued out, the sentiments and/emotions (e.g., [6]) can
    be expressed not only through texts, but also through spoken language or visual
    cues—anger in a dialogue may not be fully covered by text data. The sentence,
    "You like ice cream?". A rising intonation at the end may suggest that the person
    who asked is surprised that they like ice cream, but a neutral


    ^1 https://sail.usc.edu/imecocap/imecocap-release.html.


    © Author(s), under exclusive license to Springer Nature Singapore Pte Ltd. 2024

    KC Santosh et al., Cracking the Machine Learning Code: Technicality or Innovation?,

    Studies in Computational Intelligence 1155,

    https://doi.org/10.1007/978-981-97-2720-9_6'
  merge: -1
  img_proc: true
- pgno: 125
  md: 'intonation may suggest that the person is just curious to know whether you
    like ice cream or not. The added tone to the sentence can provide more context
    to make more informed decisions.


    In recent years, researchers are more interested in multimodal features to perform
    sentiment analysis [7–9]. Textual features along with audiovisual features have
    been widely used to demonstrate the robustness of multimodal representation learning
    for sentiment analysis.


    # 6.2 Objective


    The dataset was gathered to investigate human behavior, and we can utilize it
    to develop a sentiment analysis model. To introduce the idea of multimodal learning
    while keeping the case study straightforward, we will focus solely on audio signals
    and text transcripts. The inclusion of audio data allows the model to capture
    patterns in speech. Sentiment analysis often depends on more than just the words
    used; also factors like tone, pitch, speed, and other acoustic characteristics
    of speech. By incorporating audio, the model can consider these additional factors
    when determining sentiment. Simultaneously, the text transcripts provide the model
    with the vocabulary and language used in the spoken content. By combining audio
    and text modalities, the goal is to create a sentiment analysis model that is
    more robust and accurate. This multimodal approach leverages the strengths of
    both audio and text to improve the model''s performance. It can capture the richness
    of sentiment expressed in speech and the subtleties of language used in text,
    making it better equipped to understand sentiment in a variety of contexts.


    In summary, the idea here is to enhance sentiment analysis by leveraging a dataset
    that includes both audio and text data. This approach acknowledges sentiment is
    a complex concept influenced by both the content of the words and the way they
    are spoken. By considering both modalities, the model aims to provide a more comprehensive
    and accurate analysis of sentiment in human behavior data.


    # 6.3 Dataset


    The dataset we use for this extension is the Interactive Emotional Dyadic Motion
    Capture (IMOCAP) dataset. The dataset stands as a rich resource in the field of
    emotional communication research. Compiled at the SAIL lab at the University of
    South Carolina, this database is a curated collection of 12 h of audiovisual content.
    Encompassing video footage, speech records, facial motion capture data, and text
    transcripts, the dataset is designed to offer a comprehensive understanding of
    human emotional expression. The dataset offers a diverse range of modalities for
    analysis, including motion capture face information, speech recordings, videos,
    head movement, head angle information, and dialog transcripts.'
