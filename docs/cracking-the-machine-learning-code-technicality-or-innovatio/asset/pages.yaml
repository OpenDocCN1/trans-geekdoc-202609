    # ## 4.6.3 Cluster Analysis


    Cluster analysis is an unsupervised technique since there are no labels dependent
    variables associated, the evaluation can become obfuscating. The goodness of the
    cluster also depends on the use case of the application domain. For example, if
    clustering analysis is performed for customers (business world) in an online store,
    the cluster can be formed based on spending behavior, loyalty, or anything else.
    The techniques for evaluating cluster evaluation [15–23], but they should be complementary
    to the opinions of domain experts as well.


    +   **Visual inspection:** The clusters can be visualized in cases when the features
    are 2 or 3-dimensional. Higher dimensional features are difficult to visualize.
    For higher dimensions, we can employ dimensionality reduction techniques and perform
    clustering.


    +   **Silhouette score [24]:** The silhouette score measures how densely or sparsely
    the clusters are. It ranges from –1 to 1, where high values mean the clusters
    are densely packed and are properly separated from other clusters. Silhouette
    score for data point $i$ is calculated using


    ```

    $S_i = \frac{a_i - b_i}{\max(a_i, b_i)}$

    ```


    where $a$ and $b$ are the average distance of point $i$ within the cluster and
    the nearest cluster. This score is calculated for all data points, the average
    of this is the silhouette score.


    +   **Dunn index [25]:** It measures the ratio of the minimum inter-cluster distance
    to the maximum intra-cluster distance, as expressed in following equation:


    ```

    $Dunn index = \frac{\min(d_{ij})}{\max(d_i)}$

    ```'
