    These activation functions induce nonlinearity to the models and hence can even
    highly nonlinear data if there are enough layers of neurons. Some activation functions
    [6–9] are shown in Table 3.1. Theoretically, the described neurons can be combined
    in various ways to approximate any kind of function. These are called neural networks,
    and they require a large amount of data to be trained as opposed to shallow learning
    techniques described in the previous sections.


    Once the output is generated, we must compute the loss, which is a measure of
    the distance between real and the predicted values. The choice of loss function
    depends on the type of data we are dealing with. Generally, a loss function $L$
    is denoted by $loss = L(y, y_{target})$. Once the loss for the network is calculated,
    a mathematical algorithm called backpropagation is used.


    Backpropagation is a mathematical technique employed for training neural networks.
    It involves computing the gradient of the loss function concerning the network''s
    weights and biases. This gradient is subsequently utilized to adjust the weights
    and biases, aiming to minimize the loss. To calculate the gradient of loss with
    respect to the output, we use partial derivatives:


    $\frac{\partial L}{\partial z} = \frac{\partial L}{\partial y} \frac{\partial
    y}{\partial z}$


    Using this gradient, we can update the weights of the $n$th layer, $w_{new} =
    w_n - \alpha \frac{\partial L}{\partial h_{n-1}}$, where $\alpha$ is the learning
    rate and $y_n$ is the output from the last layer. The non-learnable parameter
    $\alpha$ determines how fast the algorithms learn. Setting this too high may lead
    to non-optimal solutions, and may cause extremely slow convergence. Hence, it
    is wise to try out different learning rates for different problems. Using this
    approach, the entire weight of the neural network is recalculated. The process
    is repeated until the desired loss is reached.


    **Sigmoid function:** Sigmoid function outputs values with a range of $0–1$. This
    works well with binary classification as the output of binary classification is
    either 0 or 1.'
