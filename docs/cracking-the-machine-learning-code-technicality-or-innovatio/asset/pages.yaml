  md: "# 56 Basic Building Blocks: From Shallow to Deep Learning\n\nTransformer architecture\
    \ relies on the self-attention mechanism to process sequential data. It consists\
    \ of an encoder and a decoder, each consisting of multiple layers. The self-attention\
    \ mechanism allows the transformers to capture relationships and dependencies\
    \ between each element of the sequence, regardless of the position of these elements.\
    \ allows transformers to excel at NLP tasks, as they can capture the context of\
    \ lengthy and complicated sentences. Key components of transformers are explained\
    \ below.\n\nSelf-attention mechanism: Self-attention (also known as scaled dot-product\
    \ attention) is the core component of transformers which allows the model to give\
    \ weight to important parts of the input sequence. It allows the model to identify\
    \ and learn complex relationships within the sequential data. There are three\
    \ learnable parameters called query (Q), key (K), and value (V). Query represents\
    \ the token's importance in relation to other tokens in the sentence, the key\
    \ vector helps identify the relationship between the current token with all other\
    \ tokens, and the value vector contains the information about the content of the\
    \ token. Mathematically, the attention for a given token at position $i$ is calculated\
    \ as\n\n```\n$Attention(Q, K, V)_i = softmax\\left(\\\frac{QK^T}{\\sqrt{d_k}}\\\
    right)V$$\n```\n\nwhere $d_k$ is the dimension of the key vector. Because the\
    \ output of the dot product can be a very large value, it is scaled by dividing\
    \ the dot product by the square root of $d_k$.\n\n**Multi-head attention:** In\
    \ the original paper [20], the authors have used eight attention heads (shown\
    \ in Fig. 3,26), which allows the transformers to enhance their performance by\
    \ learning different representations of $Q, K,$ and V. Consequently, it allows\
    \ transformers to learn even more complex dependencies. Additionally, these learners\
    \ are independent, they can be parallelized.\n\n**Encoder-Decoder Architecture:**\
    \ Transformers are usually seen in encoder-decoder architecture, although they\
    \ can also be used in only-encoder and only-decoder configurations. For a machine\
    \ translation task, the encoder takes the source language, and the decoder outputs\
    \ the translation.\n\n# 3.7 Summary\n\nIn this chapter, we delve into various\
