    # 3.2.6 Random Forest Classifier


    Random forest as the name suggests is a ‘random’ collection of decision trees.
    Simply put, multiple decision trees are generated which give their predictions.
    The prediction with the highest number of votes is marked as the ultimate prediction.
    But how do we ensure the predictions from all these trees will not be the same?
    Let us look at how the predictions are made, and the trees are voted.


    Random forest is an example of ensemble learning. Ensemble learning is a technique
    that allows us to train multiple prediction models, in this case, multiple decision
    trees. But if we are not highly correlated with each other? The random forest
    algorithm uses an ensemble technique called bagging (bootstrap aggregation). In
    the bagging method, we take a subsample of the data and pass this subsample to
    a tree. Similarly, we take many random subsamples with resampling and pass them
    to multiple decision trees. This ensures that these trees are not correlated.'
