  md: '# About the Authors


    **Prof. KC Santosh** a highly accomplished AI expert—is the chair of the Department
    of Computer Science as well the founder/director of the Applied AI research lab
    at the University of South Dakota. He is also served the National Institutes of
    Health as a research fellow. Before that, he worked as a postdoctoral research
    scientist at the LORIAS research, Université de Lorraine in direct collaboration
    with industrial partner, ITESOF, France. He earned his PhD in Computer Science—Artificial
    Intelligence from INRIA Nancy Grand East Centre (France). With funding of over
    $2 million, including a $1 million grant from DOD (2023) for AI research capacity
    building at USD, including IEEE Transactions on PAMI. He is an associate editor
    of multiple prestigious journals such as IEEE Transactions on AI, International
    Journal of Machine Learning and Cybernetics, and International Journal of Pattern
    Recognition & Artificial Intelligence. To name a few, Prof. Santosh is the proud
    recipient of the Cutler Award for Teaching and Research Excellence (USD, 2021),
    the President’s Research Excellence Award (USD, 2019) and the Ignite Award from
    the U.S. Department of Health & Human Services (HHS, 2014). As the founder of
