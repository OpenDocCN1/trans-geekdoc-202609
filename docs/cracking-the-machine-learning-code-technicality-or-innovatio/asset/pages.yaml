    # 2.3 Summary


    In this chapter, we have explored data modalities the critical process of data
    preprocessing. We have also introduced three core data modalities—numerical, textual,
    and visual. Within these, we have emphasized the need to comprehend these modalities
    for a better learning and/or decision-making process.


    This is how we observe different data types in the machine learning world. Numerical
    data is foundational for machine learning, and we discuss its discrete and continuous
    forms. Textual data possess unique challenges, and we discuss techniques for transforming
    it into numeric representations, particularly for tasks like classifying fake
    news. Visual data is intuitive for humans but complex for machines, and we discuss
    its transformation into arrays of pixel intensity values, with a focus on Convolutional
    Neural Networks (CNNs). Data preprocessing is crucial, and we cover common techniques
    applicable to all data modalities, including handling missing data, dimensionality
    reduction, addressing unbalanced data, managing outliers, and data transformation
    [11, 12]. We discuss strategies like imputation for missing data, feature selection
    for dimensionality reduction, and methods to deal with imbalanced datasets and
    outliers.


    The following is the typical case that all machine learning scientists would see
    in their projects (real-world). Their dataset initially begins on a modest scale
    but grows greatly over time, demanding a continuous process of machine learning
    adaptation. As data streams in, the model must dynamically evolve to accommodate
    these changes, ensuring its relevance and performance (optimized). However, when
    to stop the integration or addition of data and (b) when to ascertain the model''s
    readiness [13, 14]. This pivotal decision is typically based on the understanding
    of the data''s semantics and their purposes. Further, such underscores the importance
    of modalities beyond sheer data volume (e.g., medical imaging informatics [13–18]).
    It brings us the context as well as the purpose embedded within the data, in addition
    to its size (data) and complexity [17, 18]. Effectively harnessing datasets and
    contextual relevance becomes pivotal in crafting methods that not only manage
    extensive and unstructured datasets but also exploit rationale to efficiently
    inform decision-making processes.


    Overall, at this point, this chapter equips us with the knowledge and tools to
    understand data modalities and efficiently preprocess data for machine learning
    applications or use cases.


