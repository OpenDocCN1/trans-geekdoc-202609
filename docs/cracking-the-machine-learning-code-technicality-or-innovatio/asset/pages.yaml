    # 3.4.1 Curse of Dimensionality


    Let us take a simple example with only one feature (the first graph in Fig. 3.15).
    We see that there is no sparsity and the data points on the chart are well distributed,
    meaning all the probable space is represented well the data points we have. Hence,
    if we train our models on such a dataset, we can have a predictor that can cover
    most of the cases.


    Let us add a feature (look at the second graph in Fig. 3.15). In this chart, the
    number of data points remains the same, but we have introduced a new dimension.
    We see that the 2-dimensional space is sparse. However, these data points are
    still able to represent the 2-dimensional space. It becomes interesting when we
    add another one more dimension to our space. Since the number of data points is
    the same, we see that the space is very sparse, these data points cannot accurately
    represent the overall 3-dimensional space. The sparsity is exponentially increasing
    when we increase the number of dimensions or features. If we decide to train the
    model on these three features with the same amount of data, then what will happen
    when the test data is from the space there was no data? The model will be underfitted
    and hence underperformed.


    Therefore, if we want to train a model with many features, we need to have a proportionately
    large dataset to represent the multidimensional space accurately (Fig. 3.16).


    ![](img/a499312facf6bd3577be03d7b7eddea9_58_0.png)


    Fig. 3.15 Oblique clusters created by Gaussian mixture models'
