  md: "# # Chapter 7\nTechnicality or Innovation?\n\nAs we come to the end of our\
    \ exploration of applied artificial intelligence, we take a moment to look back\
    \ at the journey that has led us from the complex technicalities of machine learning\
    \ models to the groundbreaking innovations they have made possible. In a world\
    \ that is often fascinated by the magic of artificial intelligence, our goal in\
    \ writing this book was to demystify the process behind it, emphasizing that the\
    \ true marvel is not just in the algorithms themselves, but in how they are applied\
    \ in the real world.\n\nWe started exploring different cases where AI, especially\
    \ machine learning, has a tangible impact on various domains, going beyond abstract\
    \ concepts. The chapters we went through talked about AI’s influence on financial\
    \ predictive analysis, fair journalism, media imaging, and more. From predicting\
    \ trends to changing the media narratives are presented and transforming health\
    \ care, the cases we looked at showed how powerful AI can be.\n\nYet, amid the\
    \ detailed discussions on data modalities, preprocessing techniques, and the fundamental\
    \ blocks of machine learning, we remained focused on the ultimate objective—understanding\
    \ the real essence of AI. It extends beyond numbers, text, or images; it involves\
    \ transforming these components into actionable insights that enhance our lives.\
    \ We now revisit the book and summarize as follows.\n\nThe opening chapter (Chap.\
    \ 1) demystified the aura around AI by clarifying that AI’s true innovation lies\
    \ in its application across various domains, rather than in technical intricacies\
    \ of model building.\n\nChapter 2 delve into the raw materials of AI—data. From\
    \ numerical to textual and visual data, we explored the nuances of handling, processing,\
    \ and transforming data, emphasizing the importance of refining the raw material\
    \ for meaningful outcomes.\n\nChapter 3 incorporated the core of AI—from shallow\
    \ to deep learning. We navigated through regression, classification, clustering,\
    \ dimensionality reduction, and deep learning, understanding the fundamental building\
    \ blocks pave the way for advanced applications.\n\n© The Author(s), under exclusive\
    \ license to Springer Nature Singapore Pte Ltd. 2024\n Santosh et al., Cracking\
    \ the Machine Learning Code: Technicality or Innovation?,\nStudies in Computational\
    \ Intelligence 1155,\nhttps://doi.org/10.1007/978-981-97-2720-9_7"
