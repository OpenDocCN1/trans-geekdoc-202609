  md: '# 1.1 Applied AI Cases


    As a case study, later in the book, we will look at the prediction of house prices
    using the famous Boston housing dataset [11] using shallow and deep learning techniques.
    In a trivial situation where we do not have many variables to consider, predicting
    house prices can be extremely easy. Suppose you are looking to buy a house; you
    would want the price to be fair and competitive. A naive assumption would be that
    a bigger house is more expensive than a smaller one. Now you find the biggest
    house on the market, and the price is significantly lower than the other houses.
    Would you consider buying it or you also want to look at other factors such as
    location, or how old the house is? What if the house you looked at in a neighborhood
    that has a lot of crime incidents? There are a lot of factors that must be taken
    into account with other factors, making the problem more complex. The human brain
    is not naturally equipped to handle large numbers, let alone discover concealed
    patterns within them.


    Let us analyze our thought process up to this point. We have been relying on a
    lot of assumptions regarding the housing market, and we lack concrete evidence
    that these numerical factors indeed influence house prices. One alternative is
    to engage a real estate agent and trust their expertise or make an informed decision
    independently. To validate our assumptions, we can leverage available data, but
    it is challenging to process all the numbers and arrive at a reliable conclusion.
    Through methods like regression analysis, we can unveil hidden patterns, gain
    insights into the housing market, and make well-founded choices. For example,
    Fig. 1.1 shows a linear relationship between house price and house area. Such
    relationships can be extracted from linear regression models.


