    # 3.5.2 Image Classification


    Image data or unstructured data cannot be handled by traditional ML algorithms,
    but deep learning networks outperform any classical ML model any day. We can think
    of images as multidimensional arrays of pixels. A grayscale image of $16 \times
    16$ pixels. That there are 256 unique pixels that represent the whole image. A
    trivial way of solving the image classification problem would be to just these
    256 unique pixels into the fully connected neural networks. That would mean we
    would need 256 input layers for $16 \times 16$ images. Imagine how big the network
    will be if the image size is larger or imagine the computational power needed!
    Furthermore, these would work only for simple binary images and would fail terribly
    for complex images.


