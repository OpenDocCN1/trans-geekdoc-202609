    # 3.3.3 Gaussian Mixture Models


    Gaussian mixture models (GMM) are yet another unsupervised method that uses a
    probabilistic approach for clustering. A Gaussian mixture as the name suggests
    several different Gaussians. (Let us say $k$ where $k$ is the number of clusters).
    The mathematics behind GMMs is relatively straightforward. A GMM is transfer by
    two sets of: the mixing weights $\pi_k$ and the component means $\mu_k$ and covariances
    $\Sigma_k$. The mixing weights indicate the relative importance of each Gaussian
    component, and the component means and covariances define the center and shape
    of each component''s distribution. The probability density function of GMM is
    given by the following equation: $p(x) = \sum_{k=1}^k \pi_k N(\mu_k, \Sigma_k)$,
    where $N(\mu_k, \Sigma_k)$ is the Gaussian probability density for $k$ (Fig. 3.14).'
