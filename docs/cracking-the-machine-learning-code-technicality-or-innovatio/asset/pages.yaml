  md: '# 3.2.4 Naive Bayes Classifier


    Naive Bayes classifier is a classification algorithm that is based on a conditional
    probability theorem. The classifier is based on the Bayes Theorem:


    ```

    $$P(A|B) = P(A)\frac{P(B|A)}{P(B)}$$

    ```


    Let us look at the above mean equation. It gives us a probability of an event
    $A, P(A)$ (Hypothesis) that given an event $B$ (Evidence) has already occurred.
    Naive Bayes assumes that the features are independent of each other. Due to this
    relaxed assumption, the algorithm is called naive. To make it more intuitive,
    let us rewrite the above equation in terms of $X$ and $y$. X and $y$ are the output:


    ```

    $$P(y|X) = P(Y)\frac{P(X|y)}{P(X)}$$

    ```


    So, we can rephrase our definition to fit the classification problem. The Naive
    Bayes classifier gives us a probability of $y$ (prediction) for the given list
    of $X$''s (parameters/features). We can further expand the equation as


    ```

    $$P(y|x_1, x_2, \dots, x_n) = P(y)\frac{P(x_1|y)P(x_2|y) \dots P(x_n|y)}{P(x_1)P(x_2)
    \dots P(x_n)}$$

    ```


    where $x_i$ corresponds to the feature attributes, such as petal length (cm) and
    petal width (cm). The assumption that the features are independent is the biggest
    weakness of Naive Bayes classifiers. In real-life situations, these features are
    seldom independent. This hinders the performance of the classifier.


