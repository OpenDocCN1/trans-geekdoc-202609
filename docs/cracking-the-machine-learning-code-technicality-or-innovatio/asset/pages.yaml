    DBSCAN is an abbreviation for Density-Based Spatial Clustering of Application
    with Noise. In contrast to the K-Means clustering, DBSCAN is an algorithm that
    does not require one to specify the number of clusters. The DBSCAN algorithm uses
    two parameters:'
