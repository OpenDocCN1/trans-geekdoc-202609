    algorithms. We have already seen the models from scikit-learn, XGBoost, and other
    frameworks can be trained in a similar way. However, we still need the images
    to be in numerical representation. Fortunately, for us, images are already represented
    using pixels, which are the intensity values of the image at that position. Furthermore,
    more Python frameworks and libraries use a multidimensional matrix to represent
    these numbers.


    Some important packages necessary for this task are listed below:


    > ^7 https://www.kaggle.com/datasets/nih-chest-xrays/data.


    > ^8 Note that most medical images are in DICOM format so they may require conversion
    to JPG or PNG.'
