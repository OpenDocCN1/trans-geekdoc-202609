    **Term frequency** (TF) can be defined as the ratio of the frequency of a particular
    word to the total number of words in that document. It can be thought of as a
    normalized score:


    TF = \frac{\text{Frequency of the word in the document}}{\text{Total number of
    words in that document}}$


    **Document frequency** (DF) gives us the proportion of the documents that contain
    that word:


    DF = \frac{\text{Document containing the word W}}{\text{Total number of documents}}$


    **Inverse document frequency** (IDF) is the log of the inverse of the document
    frequency. As the total number of documents containing a word increases, it becomes
    less important. We take the log of this value (because the Inverse document frequency
    alone could be an exceptionally substantial number as there might be a hundred
    thousand documents and very few documents containing the word):


    IDF = \log\left(\frac{\text{Total number of documents}}{\text{Document containing
    the word W}}\right), \text{ and } TF - IDF = TF \times IDF$.


