  md: '# # Chapter 3

    # Basic Building Blocks: From Shallow to Deep Learning


    In this chapter, we will discuss the basic building blocks for shallow learning
    and deep learning. We will go through the traditional machine learning models
    like regression, classification, clustering, and dimensionality reduction. Afterward,
    we will also look at deep learning and discuss important architectures such as
    Convolutional Neural Networks (CNNs), Recurrent Neural Networks (RNNs), and transformers.


    # ## 3.1 Regression Analysis


    Regression models are the statistical techniques used by many practitioners to
    establish the relationship between a dependent variable and one or more independent
    variables.


    # ### 3.1.1 Simple Linear Regression


    A simple linear regression model means that there is only one independent variable.
    For example, using a simple linear regression model, we can establish a relationship
    between housing price and the area of the property. Here, the area of the property
    will be the independent variable and the dependent variable will be the housing
    price. This model can then be used to predict the housing price based on the area
    of the property. This type of regression model can be easily visualized in 2-dimensional
    graphs. Look at Fig. 3.1, the regression line can be expressed as an y = mx +
    C.'
