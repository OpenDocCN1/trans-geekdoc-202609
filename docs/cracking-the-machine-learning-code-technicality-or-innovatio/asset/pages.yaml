    # 3.3 Clustering


    Clustering is an unsupervised machine learning technique. In classification and
    regression, we saw that we need a label for the dataset. In contrast, clustering
    algorithms, being an unsupervised method, do not need any labels. Clustering algorithms
    try to learn the pattern in the data without any human intervention and group
    the dataset into different clusters.


    Clustering algorithms, though interesting, are hard to interpret because we do
    not know on what basis the algorithms have created the clusters. It is up to the
    domain knowledge specialist to figure out what the clusters mean. Clustering is
    particularly not a predictive solution but rather can be used as an analytical
    tool.


    For example, we might want to use clustering to segment the types of customers
    of a financial institution. But without financial knowledge, we might not be able
    to make decisions based on just the output of these clustering algorithms. In
    Fig. 3.11, we see that the clusters have been created on a dataset from a financial
