    # 3.5 Deep Learning


    Deep learning is a machine learning technique based on the artificial neural network
    (ANN) that emulates how the human brain works. The fundamental unit of a neural
    network called neurons takes inputs and gives output based on mathematical computations.
    These artificial neurons are analogous to the neurons in the human brain. After
    the mathematical operation, it is passed through an activation function, which
    activates or fires the neuron if a certain threshold is reached (Fig. 3.18).


    The inputs will be the numeric values $x_1, x_2$, and so on. $w_1, w_2$, and so
    on are the weights of the neurons that tell us how important that input is:


    ```

    $z = x_0 * b + x_1 * w_1 + x_2 * w_2 + \cdots + x_n * w_n$.

    ```


    We pass the output through a function called the activation function which decides
    whether the neuron should be fired or not, $y = f(z)$.'
