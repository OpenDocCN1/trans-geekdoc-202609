  md: '# 3.4 Dimensionality Reduction


    # 3.4.2 Linear Discriminant Analysis


    Now, we shall discuss a supervised method for dimensionality reduction. Linear
    Discriminant Analysis (LDA) [4] is a technique that can help tackle the curse
    of dimensionality reduction. The idea behind LDA is to project the data from the
    higher dimensional feature space to the lower dimensional feature space to maximize
    between-class separability ($S_B$) and minimize within-class separability ($S_W$).
    Since it is a supervised technique, a label is required. LDA is used for classification
    purposes as well. $S_B$ and $S_W$ are calculated


    ```

    $S_B = \Sigma(N_i * (m_i - m) * (m_i - m)^T), S_W = \Sigma((x - m) * (x - m)^T)$

    ```


    where $N_i$ is the number of samples in class $i$, $m_i$ is the mean vector of
    class $i$, and $m$ is the overall mean. After obtaining $S_B$ and $S_W$, you find
    the eigenvalues ($\lambda$) and corresponding eigenvectors ($W$) of the matrix
    $S_B W = \lambda S_W$. The projection of data point $x$ into the new LDA space
    can be achieved by multiplying eigenvector $W$ with $x$; $y = Wx$.


    # 3.4.3 Principal Component Analysis


    Principle component analysis (PCA) [5] is another dimensionality reduction algorithm.
    Unlike LDA, PCA is an unsupervised algorithm, which means that we do not need
    a target class. PCA tries to find the new axis which can represent the highest
    variance in the data.


    Since we do not require the target variable ($y$) to perform the PCA, it is preferred
    over LDA because LDA can show more biases towards the majority class. We can see
    in Fig. 3.17 the blue data points in the original axis (black). Principle components
    try to find a new axis (red) principal components that can explain the highest
    variance in the data. Principle component one explains the most variance, and
    principal two explains low variance. We can also see it from the picture. As many
    number of principal components can be created as the subsequent principal components
    will explain less variance in the data than the previous ones. However, we should
    note that PCA is also a dimensionality reduction technique, and creating many
    principal components defeats the purpose of performing PCA.


    The first step to calculate PCA is to standardize the values. Calculate the mean
    ($\mu$) and standard ($\sigma$) for each feature ($x$) $z_i = (x - \mu_i)/\sigma_i$.
    For each element, we calculate the covariance matrix ($Cov$), $Cov = \frac{1}{n}X^T
    X$, where $X$ are the standardized inputs. We find the eigenvalues ($\lambda$)
    and eigenvectors ($W$) of the covariance matrix: $Cov V = \lambda * W$. We sort
    the eigenvalues in descending order corresponding to their eigenvectors. The eigenvalues
    represent the importance of each principal component. To get the top $k$ principal
    component, we choose $k$ eigenvalues and multiply the corresponding eigenvectors
