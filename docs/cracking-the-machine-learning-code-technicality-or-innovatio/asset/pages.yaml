    # 5.3 Visual Data: Medical Image


    The final data modality that we investigate is the image or visual data. Images
    are everywhere and are a very good representation of data for communication. A
    lot of advancement has been made in the field of machine learning for image processing.
    Continuous research and application have been going in on face recognition, medical
    image recognition, and remote sensing image classification [7].


    For our case study, we look at the application of machine learning in medical
    images. The dataset for this is the NIH Chest X-rays dataset [8]. The dataset
    is public and can be accessed through the Kaggle.^7 The dataset consists of 112,220
    X-rays with a variety of conditions organized into 12 folders. For simplicity
    and the sake of this example, we will only take the first folder. It has 4999
    chest X-rays. The original dataset has various classes, but to elucidate the problem
    of classification, we will divide the dataset into two classes: no finding (0)
    and anomaly (1). All the diagnosed X-rays are considered to have anomalies (Table
    5.3).


    The X-rays are provided in a folder as PNG images.^8 There is another CSV file
    that contains the metadata for the generic dataset. It has several columns, but
    the important ones are the ‘Image Index’ and ‘Finding Labels’ which correspond
    to the filename and labels.


