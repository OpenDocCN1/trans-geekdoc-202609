    # 3.3.1 K-Means Clustering


    K-Means is a clustering algorithm that requires one to know the number of probable
    clusters. Let us say $K$ number of clusters. The algorithm starts by randomly
    selecting $k$ centroids which are the centroids of the clusters. Then in an iterative
    process, the positions of the centroids are recalculated to finally find the optimized
    centroids. The distance between two points $p(p_1, p_2)$ and $q(q_1, q_2)$ can
    be calculated using Euclidean distance formula: $d(p, q) = \sqrt{(p_1 - q_1)^2
    + (p_2 - q_2)^2}$. The points that are in the vicinity of the centroids are then
    assigned to their cluster. The algorithm stops when the distance from the centroid
    of a cluster to the other points is minimized. The algorithm can also be forced
    to stop after a certain number of iterations (Fig. 3.12).


