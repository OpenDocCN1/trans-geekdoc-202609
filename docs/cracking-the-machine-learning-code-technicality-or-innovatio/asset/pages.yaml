    # 4.6.2 Classification


    Classification deals with categorical variables. The most basic way to visualize
    and evaluate the performance of a classification model is through the confusion
    matrix. A confusion matrix is a special type of contingency table (as shown in
    Fig. 4.7), where the rows and columns represent classes of predicted and actual
    values. An example of a confusion matrix for a binary classification is shown
    in Fig. 4.7. For N classes, the matrix would be an NXN matrix. Some important
    elements of the confusion matrix are


    +   - **True Positive**: Number of instances classified as positive.

    - **True Negative**: Number of instances correctly negative instances.

    - **False Negative**: Number of instances incorrectly classified as negative.

    - **False Positive**: Number of instances incorrectly classified as positive.


    Using these elements


    +   (a) **Accuracy**: It is the overall correctness of the classification model.

    (b) **Precision**: Precision (or positive predictive value) refers to the proportion
    of the positive instances correctly predicted by the model out of all instances
    predicted


    | Actual Values |

    | Positive (1) | Negative (0) |

    |---|---||

    | Prediction Negative (0) | True Positive TP | False Positive FP |

    | Prediction Positive (1) | False Negative FN | True Negative TN |


    ```

    $Accuracy = \frac{TP + TN}{TP + FP + FN}$

    $Precision = \frac{TP}{TP + FP}$

    $Recall = \frac{TP}{TP + FN}$

    $Specificity = \frac{TN}{TN + FP}$

    $Precision \cdot Recall = 2 \cdot \frac{Precision}{Precision + recall}$

    ```


