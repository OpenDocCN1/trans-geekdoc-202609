  md: '# 2.2.1 Handling Missing Data


    It is common to have missing data in our dataset. This can happen because of many
    reasons. For example, let us say you survey forms to a group of individuals for
    a research project. Some individuals might leave a few fields empty because they
    do not understand what the field means, while others might ignore it or even miss
    the fields. As a researcher, each of these data points is important to you and
    you cannot leave them empty.


    In such a case, you have two options: to ignore the data points with missing values
    or to fill in the data. If you have collected a large amount of data, you might
    probably get away with ignoring these data points. But if you have few data points,
    ignoring them might cause you to lose potentially valuable information.


    To missing numerical data, you may use statistical methods to fill up these values.
    Filling missing data using mean, median, and mode is quite popular. Filling missing
    data using these measures of central tendency is simple and effective. But, it
    is also true that these values might not represent the true values. A more advanced
    way to fill these missing values is to check the distribution of these fields
    with the target variable and other features by performing data analysis. Scikit-Learn
    provides ways to fill in missing values using the k-nearest neighbor approach.


    # 2.2.2 Dimensionality Reduction


    For any machine learning model, features are necessary. If one wants to build
    a model for predicting house prices, one should probably consider the features
    of the house. For example, when was the house built? What is the size of the house?
    How many rooms does it have? Where is it located? These are some of the questions
    that we ask ourselves when buying a house. Although it is nice to know more about
    the house, it becomes more difficult to decide based on multiple factors.


    Similarly, for any machine learning model, more features are not always good.
    This is known as the curse of dimensionality. In Fig. 2.2, we see plots of some
    data in different dimensions. As we move from higher to lower dimensional representation,
    we notice that the data becomes less sparse, and the number of data points can
    represent most of the space. If we consider a 3-dimensional space (dataset with
    three features) in Fig. 2.2, the model built using this data is not able to learn
    through this dimensional space. The takeaway from this is that if we want to use
    many features, we must make sure that we have an appropriately large dataset to
    represent the whole dimensional space.


    The dimensions can be reduced by multiple techniques. One method is to use feature
    selection techniques, such as removing the features that are highly correlated
    with each other. Another popular technique is to use the chi-square method to
    keep only the features that are highly dependent on the target variable. Another
    feature'
