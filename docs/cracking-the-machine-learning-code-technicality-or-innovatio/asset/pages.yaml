    # 2.2.4 Outliers


    Outliers in data are very common. These are the data points that seem way off
    from the average. In machine learning, we call those data points outliers whose
    occurrence is statistically rare. These outliers can occur naturally and prove
    to improve the model. But sometimes, these occurrences are due to errors in data
    collection. It is completely normal, although rare to have a person aged more
    than a hundred years. However, the occurrence of persons aged more than 150 might
    be impossible and may require dealing with such outliers. These outliers harm
    the reliability of the data collected and unreliable data produces unreliable
    models. Large outliers can skew the data distributions as well.


    It is important to properly investigate the outliers before we begin handling
    them. If the values are improper (e.g., 200 and -2 for age), then it is best to
    remove the outliers or replace them with the mean or the median. To filter the
    outliers, we can use techniques such as interquartile range (IQR), z-score, and
    modified z-score techniques [4] (Fig. 2,4).


    # 2.2.5 Data Transformation


    As discussed in previous chapters, data comes in multiple modalities. It is necessary
    to transform data into formats that are understood by the machine learning model
    being used. Data transformation can range from simple to very complicated techniques.
    Numerical features can be extensive and can have different ranges. For example,
    age may range from 0 to 100 while salary can range from hundreds of'
