    layer that encodes the texts into a fixed-length vector. The encoding maintains
    the sequential behavior of the texts along with feature extraction, dimensionality
    reduction, and representation of texts as numeric values. We use the Textization
    encoder with maximum tokens set to 1000, meaning that the vectorizer will only
    take 1000 words (Fig. 5.21).


    The model consists of the encoder that we just defined. The second layer is the
    embedding layer that learns the relationship between the encoded words. Then we
    add a bidirectional LSTM layer. Finally, we have a dense layer followed by the
    output dense layer with one neuron since the output is either 0 or 1.


