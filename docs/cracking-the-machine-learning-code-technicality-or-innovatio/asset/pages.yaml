  md: 'where $d_{ij}$ is the inter-cluster distance between cluster $i$ and $j$ (usually
    distance between the centroids) and $d_i$ is the intra-cluster distance (the average
    of distance between all points in cluster $i$).


    +   **Davies-Bouldin index [26]:** It measures the average similarity between
    each cluster and its most similar cluster. The lower the value, the better the
    clusters. Mathematically,


    ```

    $DB \text{ index} = \frac{1}{k} \sum_{i=1}^{k} \max_{j \neq i} \frac{S_i + S_j}{d(C_i,
    C_j)}, $

    ```


    where $k$ is the number of clusters, $S_i$ is the average distance of points within
    the cluster $i$ to its centroid, $C_i$ is the centroid of the cluster $i$, and
    $d(C_i, C_j)$ is the distance between centroids of clusters $i$ and $j$.


