    In recent years, machine learning has made significant strides, with over 100
    papers published daily on Arxiv alone. The number of algorithms developed is impossible
    to keep track of, but they all revolve around the fundamental data types discussed
    earlier. Looking back at history, it''s unlikely that we will see a new data representation
    emerge anytime soon. As practitioners working with data, it is crucial that we
    have a strong foundation in data modalities. In this chapter, we will delve into
    these modalities, discussing their characteristics and how they can be utilized
    to extract valuable insights from data. By understanding the different modalities,
    we can effectively apply the appropriate techniques and algorithms to the right
    types of data, leading to more effective and efficient data analysis.


    # 2.1.1 Numerical Data


    Numerical data is a critical data type in machine learning algorithms. It serves
    as the foundation for all algorithms in one way or another. When we discuss numerical
    data in machine learning, we shift our focus from the complex calculations and
    number crunching done internally by computers to the numbers humans encounter
    in everyday life.


    Numbers are ubiquitous, serving as a fundamental tool for counting, measuring,
    and labeling. In machine learning, we frequently encounter numerical data, making
    it an essential component of many models. Building models using numerical data
    is relatively straightforward and requires minimal additional steps to convert
    the data into a format that machine learning algorithms utilize. Numerical data
    can be further categorized as either discrete or continuous. Discrete numerical
    data is typically used for counting the number of objects, often having ordinal
    importance. In some cases, discrete numerical data may take on nominal value,
    such as assigning numbers to patients in a hospital, where the numbers carry no
    more significance than'
