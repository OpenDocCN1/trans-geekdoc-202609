    # 2.1.4 Multimodal Representation Focused


    In previous sections, we have focused on analyzing just one type of data at a
    time, whether it''s text, numbers, or images. However, this unimodal approach
    doesn''t fully capture the richness of real-life experiences. Think about watching
    your favorite soap opera on TV with your eyes closed. You can still follow the
    storyline through the audio alone, but the visual component adds depth and immersion
    to your understanding. This highlights the need to embrace a more holistic, multimodal
    perspective when dealing with various types of data for a more complete and meaningful
    analysis.


    Multimodal data, in this context, pertains to information collected from various
    sources. For instance, in medical imaging applications like [1, 2], multimodality
    might encompass X-rays, CT scans, or MRI scans of the same anatomical. Even though
    they are all image data, they originate from distinct sensors, making them genuinely
    multimodal, in contrast to the example presented in the previous paragraph.


    Within the field of deep learning, accomplishing this involves capturing distinct
    features from diverse data types, amalgamating them, and subsequently training
    models using this unified feature representation. Given that we have already touched
    upon the approach of handling these modalities separately, it''s only logical
    to integrate them to enhance the quality and robustness of our models.


    # 2.2 Data Preprocessing


    In the previous chapters, we studied the different data modalities and looked
    at some real-world machine-learning applications where these data types are used.
    Each of these data types typically requires some kind of manipulation before the
    machine learning models can use them. Data preprocessing is crucial for any machine
    learning model because feeding garbage to the models will only produce garbage
    results. Some preprocessing methods are common for all kinds of data while are
    specific to a particular data type.


    A common pitfall for learning enthusiasts is disregarding the time and effort
    that goes into data preparation. Most of the learning projects start with cleaned
    data that are somewhat guaranteed to produce good results. In a real-world application,
    the raw dataset is almost never used. We will begin with some common data preprocessing
    methods that are applicable to all kinds of data while also discussing the specific
    data modality.'
  merge: -1
