    get a line that separates the two classes. The standard way to write the model
    (or decision boundary) for SVM is


    $z(x) = w^T x + b,$$


    where $w^T$ is the weight vector transpose of the computed decision boundary,
    and $x$ is the feature vector. We can then define the classifier $f(z)$ as


    ```

    $f(z) = \begin{cases} 0 & \text{if } z \ge 0 \ 1 & \text{if } z < 0 \end{cases}$

    ```


    This condition ensures the feature vectors are classified as they lie on either
    side of the hyperplane. The optimal hyperplane is derived from the available data,
    but we would also like the SVM model to generalize on new (or untested) data.
    To confidently classify new observations, the SVM algorithm also calculates bounding
    hyperplanes. We calculate the decision boundary (as seen in Fig. 3,7), such that
    there is the highest possible amount of space between the two classes. The calculation
    of these boundaries is out of scope of this book. The readers are encouraged to
    read [2].'
