    # Class imbalance in news classification


    ![](img/a499312facf6bd3577be03d7b7eddea9_37_0.png)


    Since we have already established that the imbalance classes are detrimental to
    the model''s performance, let us look at methods for handling this. However, there
    is no guarantee that these solutions will work, and, in some cases, these are
    not recommended at all.


    One of the ways to deal with imbalanced data is to perform under sampling or oversampling
    or remove the majority classes. Oversampling may be better than under sampling
    because we are not losing any valuable information. However, oversampling has
    limitations too because we are not learning anything new, and the models can easily
    overcome the same information leading to overfitting.


    Another method would be to generate synthetic data based on the distribution of
    the minority class. This would mean new data is generated and overcomes one of
    the problems we discussed with oversampling. For generating synthetic data for
    numerical values, we can use frameworks like imlearn which provides sampling for
    synthetic data. Generative models (e.g., GANNs) can be used to generate synthetic
    data for text and images. For images, synthetic data can be generated by applying
    affine transformations (e.g., rotating, shearing, rescaling,) to the same images
    and performing random sampling from the transformed images. Conventional methods
    like generating images using rendering software for images are also popular. Synthesizing
    data is a simple method, but it might not be an option for some applications.
    For example, if you are building a model for financial institutions, models built
    with synthetic data might lose their credibility. Similarly, models built for
    detecting bone fractures using synthetic X-rays do not sound credible either.'
