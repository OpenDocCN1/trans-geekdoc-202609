  md: '# 5.4.2 Classification


    As opposed to continuous data, the targets for classification are categorical
    in nature. The evaluation metrics for classifications are based on counting the
    right and wrong predictions. We have already discussed some of the evaluation
    metrics for evaluating classification models in the previous chapter. In this
    chapter, we will use scikit-learn''s modules to calculate these evaluation metrics.
    Although the deep learning frameworks have their own implementation for these
    metrics, we do not introduce them here. As an example, we use the PyTorch model
    from Sect. 5.3.2 Deep learning methods: CNN. Inference using PyTorch is not as
    straightforward as using TensorFlow, and we will then demonstrate inference using
    PyTorch and the results to calculate some important metrics for classification
    problems. As the training begins, we can monitor the trend of training and validation
    loss. Ideally, both losses decrease gradually until convergence. Apart from monitoring
    loss, we may also want to monitor other evaluation metrics such as accuracy, precision,
    recall, and so on for both training and validation data. To visualize this, the
    general approach is to plot losses and metrics against the training step. We can
    use the matplotlib to plot validation and accuracy as shown in Fig. 5.42. The
    variables val_loss loss from epoch 0 to 4. As an example, only a loss of 5 epochs
    is presented. These variables can be created to store training and validation
    loss by editing the code presented in Fig. 5.40. Ideally, both lines should demonstrate
    a decreasing trend with a minimal gap between them. It should be noted that the
    model is not tuned to perform well. Additionally, the number of epochs shown here
    is significantly less than what is used generally.


    As mentioned earlier, inferencing PyTorch models is not straightforward, and thus
    in Fig. 5.43, we demonstrate code to show inference. Notice the last two lines.
    It is used to extract values from the tensors as scikit-learn library does not
    work on tensors.


    After extracting the ground truths and predictions, we can proceed to calculate
    evaluation metrics. For one of the widely used metrics for visual inspection is
    the confusion matrix. To produce one, we can run codes as shown in Fig. 5.44.


