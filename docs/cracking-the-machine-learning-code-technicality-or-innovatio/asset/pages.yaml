    # ## 2.1 Data Modalities


    Data has been ubiquitous throughout the history of humanity. In ancient times,
    societies recorded the Egyptians used Hieroglyphs to document financial transactions
    and notable events, while the Sumerians used stone tablets as pay slips around
    5000 BCE (refer to Fig. 2.1). The Phoenicians, another ancient civilization, developed
    one of the most significant innovations in written language: the alphabet. While
    previous civilizations used pictographs and other forms of writing, the Phoenicians
    created a writing system consisting of only 22 consonants. This made reading and
    writing much easier and more efficient than previous methods. These early forms
    of data recording illustrate the importance of information management: data is
    a legacy of all civilizations. As scientific progress continued, people developed
    more efficient and advanced methods of data storage. The invention of paper, ink,
    and the printing press allowed for more convenient and accessible record-keeping.
    Today, the technological advancements of the past decades have enabled us to store
    vast amounts of data in devices that fit in our palms. These have facilitated
    the production of an unprecedented volume of data, which we continue to create
    at an exponential rate. From ancient civilizations to modern societies, data has
    played a crucial role in shaping our understanding of the world and our place
    within.


    As data grows and technology advances, it is natural to consider the various ways
    it can be represented. However, upon closer examination, we can narrow these representations
    down to three: numerical, textual, and visual. This is not a new concept; ancient
    civilizations like the Egyptians and Sumerians stored their data through symbolic
    or pictorial representations, well as scripts and numbers. While the methods of
    storage have changed over time, these three modalities of data representation
    have remained consistent. This reinforces the importance of studying and understanding
    each modality. By doing so, we can extract valuable insights and meaning from
    the data and to drive progress and innovation.


