    # 4.6 Evaluation


    Once the models are trained, it is necessary to test whether the models are behaving
    as expected. The underperformance of models may have underlying causes: underfitting
    or overfitting [10, 11], poor model choice, or poor feature selection/engineering
    [12]. The scope of analyzing and tuning the model is out of scope of this book.
    However, it is of utmost importance to evaluate the relevance of the model''s
    output and in this section of the chapter, we will cover some of the evaluation
    techniques and their basic mathematics used for regression, classification, and
    clustering.


    # 4.6.1 Regression


    As we have already established, regression models are used for predicting continuous
    values. And, thus, to evaluate regression models, we must use metrics that work
    with continuous values. Metrics used for continuous variables are distance-based
    metrics [13] such as Mean Squared Error (MSE), Mean Absolute Error (MAE), R-squared,
    metrics, and so on [14].


    +   Mean Squared Error (MSE): It is one of the most popular and comprehensible
    metrics. As the name suggests, it calculates the average of the sum of squares
    of the difference between the actual value (y) and the predicted value (\hat{y}).
    $MSE=\frac{1}{N}\sum_{i=1}^{N}(y_i-\hat{y}_i)^2$, where $N$ is the number of predictions.
    $y_i-\hat{y}_i$ is the error for predicted $\hat{y}_i$.


    +   Mean Absolute Error (MAE): MAE is another metric that can be used to evaluate
    regression models. The procedure to calculate this is the same as MSE, but in
    MAE, instead of taking the square of the error, we simply take the absolute value.
    $MAE=\frac{1}{N}\sum_{i=1}^{N}|y_i-\\hat{y}_i|$.


    +   Root Mean Squared Error (RMSE): RMSE is just square root of MSE. The square
    root ensures that the error is on a similar scale as the predictions.\It can be
    defined as $RMSE=\sqrt{\frac{1}{N}\sum_{i=1}^{N}(y_i-\hat{y}_i)^2}$.


    +   R-squared ($R^2$): R-square is also called the coefficient of determination
    and measures the proportion of variance in the dependent variable explained by
    the features. Hence, $R^2=1-\frac{SSR}{SST}$, $SSR$ is the Sum of Squared Residuals
    and $SST$ is the Total Sum of Squares.'
