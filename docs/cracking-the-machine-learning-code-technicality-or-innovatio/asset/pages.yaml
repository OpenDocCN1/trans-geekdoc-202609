    dollars. When building models using these features in different ranges, the models
    may learn that salary is more important than age—which might not necessarily true.
    To bring these values to a common scale, we can use techniques like normalization,
    standardization, and scaling [5]. We use label-encoders or one-hot encoders to
    represent them in numerical format for categorical values.


    Transformation for texts is a bit different than numerical values. Recall the
    examples that we discussed as the fake news classification or detection problem.
    The features we use are strings. Obviously, the strings are not understood by
    many learning models. One of the most popular and trivial solutions is to use
    a bag of words model [6]. More complicated methods are word2vec’[7] and TD-IDF
    methods. The features can also be extracted using embeddings as embeddings using
    deep learning methods such as BERT [8]. However, before we compute the word representations
    the texts should go through some general steps including normalization, tokenization,
    lemmatization/stemming, and punctuation/space/stop-words removal.


    Images, as we know, are a multidimensional array of pixel values ranging from
    0 to 255 or 8-bit images (0 to 2^8 - 1). These values are large and may be costly
    for the models. We normalize the them by dividing each value by 255. Usually,
    images have two-dimensional arrays representing each color channel (Red, Green,
    and Blue). Generally, the RGB channels may not always be necessary for building
    models, and in such cases, the images are transformed into grayscale—a single
    channel. This further decreases the complexity of the calculation. Other transformations
    using rotation, scaling, cropping, histogram-based techniques, and generative
    adversarial networks can also be applied to an image [9]. Such transformations
    are used to generate new images from existing images to solve overfitting problems.
    These methods can successfully improve model performance, they should be used
    cautiously. These methods are commonly known as data augmentation. Although In
    sensitive domains like medical imaging, data augmentation may not fully make sense
    [10] (Fig. 2.5).


