- pgno: 117
  md: 'Another well-known problem with ML models, specifically with classification
    problems, is unbalanced classes. In a classification model, you can say that a
    dataset is unbalanced when most of its observations belong to one (or some) of
    the classes (target variable).


    This is very common in fraud identification systems: for example, where most of
    the events belong to a regular operation, while a very small number of events
    belong to a fraudulent operation. In this case, you can also say that fraud is
    a rare event.


    There is no strong rule for defining whether a dataset is unbalanced or not, it
    really depends on the context of your business domain. Most challenge problems
    will contain more than 99% of the observations in the majority class.


    The problem with unbalanced datasets is very simple: ML algorithms will try to
    find the best fit in the training data to maximize their accuracy. In a dataset
    where 99% of the cases belong to one single class, without any tuning, the algorithm
    is likely to prioritize the assertiveness of the majority class. In the worst-case
    scenario, it will classify all the observations as the majority class and ignore
    the minority one, which is usually our interest when modeling rare events.


    To deal with unbalanced datasets, you have two major directions to follow: tuning
    the algorithm to handle the issue or resampling the data to make it more balanced.


    By tuning the algorithm, you have to specify the weight of each class under classification.
    This class weight configuration belongs to the algorithm, not to the training
    data, so it is a hyperparameter setting. It is important to keep in mind that
    not all algorithms will have that type of configuration, and that not all ML frameworks
    will expose it, either. As a quick reference, the `DecisionTreeClassifier` class,
    from the scikit-learn ML library, is a good example that does implement the class
    weight hyperparameter.


    Another way to work around unbalanced problems is changing the training dataset
    by applying **undersampling** or **oversampling**. If you decide to apply undersampling,
    all you have to do is remove some observations from the majority class until you
    get a more balanced dataset. Of course, the downside of this approach is that
    you may lose important information about the majority class that you are removing
    observations from.


    The most common approach for undersampling is known as random undersampling, which
    is a naïve resampling approach where you randomly remove some observations from
    the training set.


    On the other hand, you can decide to go for oversampling, where you will create
    new observations/samples of the minority class. The simplest approach is the naïve
    one, where you randomly select observations from the training set (with replacement)
    for duplication. The downside'
  merge: -1
  img_proc: true
- pgno: 118
  md: 'of this method is the potential issue of overfitting, since you will be duplicating/highlighting
    the observed pattern of the minority class.


    To either underfit or overfit your model, you should always test the fitted model
    on your testing set.


    # IMPORTANT NOTE


    > *The testing set cannot be under/oversampled: only the training set should pass
    through these resampling techniques.*


    You can also oversample the training set by applying synthetic sampling techniques.
    Random oversample does not add any new information to the training set: it just
    duplicates the existing ones. By creating synthetic samples, you are deriving
    those new observations from the existing ones (instead of simply copying them).
    This is a type of data augmentation technique known as the **Synthetic Minority
    Oversampling Technique (SMOTE).**


    Technically, what SMOTE does is plot a line in the feature space of the minority
    class and extract points that are close to that line.


    # IMPORTANT NOTE


    > *You may find questions in your exam where the term SMOTE has been used. If
    that happens, keep in mind the context where this term is applied: oversampling.*


    Alright – in the next section, you will learn how to prepare text data for ML
    models.


    # Dealing with text data


    You have already learned how to transform categorical features into numerical
    representations, either using label encoders, ordinal encoders, or one-hot encoding.
    However, what if you have fields containing long pieces of text in your dataset?
    How are you supposed to provide a mathematical representation for them in order
    to properly feed ML algorithms? This is a common issue in **Natural Language Processing
    (NLP)**, a subfield of AI.


    NLP models aim to extract knowledge from texts; for example, translating text
    between languages, identifying entities in a corpus of text (also known as **Name
    Entity Recognition**, or **NER** for short), classifying sentiments from a user
    review, and many other applications.


    # IMPORTANT NOTE


    > *In [Chapter 8, AWS Application Services for AI/ML], you will learn about some
    AWS application services that apply NLP to their solutions, such as Amazon Translate
    and Amazon Comprehend. During the exam, you might be asked to think about the
    fastest or easiest way (with the least development effort) to build certain types
    of NLP applications. The fastest or easiest way is usually to use those out-of-the-box
    AWS services, since they offer pre-trained models for some use cases (especially
    machine translation, sentiment analysis, topic modeling, document classification,
    and entity recognition).*'
  merge: -1
  img_proc: true
- pgno: 119
  md: 'In a few chapters'' time, you will also learn about some built-in AWS algorithms
    for NLP applications, such as BlazingText, **Latent Dirichlet Allocation (LDA)**,
    **Neural Topic Modeling (NTM)**, and the **Sequence-to-Sequence** algorithm. Those
    algorithms also let you create the same NLP solutions that are created by those
    out-of-the-box services; however, you have to use them on SageMaker and write
    your own solution. In other words, they offer more flexibility but demand more
    development effort.


    Keep that in mind for your exam!


    Although AWS offers many out-of-the-box services and built-in algorithms that
    allow you to create NLP applications, you will not look at those AWS product features
    now (you will do in **Chapter 6, Applying Machine Learning Algorithms**, and **Chapter
    8, AWS Application Services for AI/ML**). You will finish this chapter by looking
    at some data preparation techniques that are extremely important for preparing
    your data for NLP.


    # # Bag of words


    The first one you will learn is known as bag of words (BoW). This is a very common
    and simple technique, applied to text data, that creates matrix representations
    to describe the number of words within the text. BoW consists of two main steps:
    creating a vocabulary and creating a representation of the presence of those known
    words from the vocabulary in the text. These steps can be seen in *Figure 4.11*.


    | | this | movie | really | good | although | old | production |

    |---|---|---|---|---|---|---|---|

    | Binary | 1 | 1 | 1 | 1 | 1 | 1 | 1 |

    | Frequency | 0.14 | 0.14 | 0.28 | 0.14 | 0.14 | 0.14 | 0.14 |

    | Count | 1 | 1 | 2 | 1 | 1 | 1 | 1 |


    Figure 4.11 – BoW in action


    First things first, you usually can’t use raw text to prepare a BoW representation.
    There is a data cleansing step where you lowercase the text; split each work into
    tokens; remove punctuation, non-'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'alphabetical, and stop words; and, whenever necessary, apply any other custom
    cleansing techniques you may want.


    Once you have cleansed your raw text, you can add each word to a global vocabulary.
    Technically, this is usually a dictionary of tuples, in the form {(word, number
    of occurrences)} – for example, {(apple, 10), (watermelon, 20)}. As I mentioned
    previously, this is a global dictionary, and you should consider all the texts
    you are analyzing.


    Now, with the cleansed text and updated vocabulary, you can build your text representation
    in the form of a matrix, where each column represents one word from the global
    vocabulary and each row represents a text you have analyzed. The way you represent
    those texts on each row may vary according to different strategies, such as binary,
    frequency, and count. Next, you will learn these strategies a little more.


    In Figure 4.11, a single piece of text is being processed with the three different
    strategies for BoW. That’s why you can see three rows on that table, instead of
    just one (in a real scenario, you have to choose one of them for implementation).


    In the first row, it was used a binary strategy, which will assign 1 if the word
    exists in the global vocabulary and 0 if not. Because the vocabulary was built
    on a single text, all the words from that text belong to the vocabulary (the reason
    you can only see 1s in the binary strategy).


    In the second row, it was used a frequency strategy, which will check the number
    of occurrences of each word within the text and divide it by the total number
    of words within the text. For example, the word “this” appears just once (1) and
    there are seven other words in the text (7), so 1/7 is equal to 0.14.


    Finally, in the third row, it was used a count strategy, which is a simple count
    of occurrences of each word within the text.


    # IMPORTANT NOTE


    This note is really important – you are likely to find it in your exam. You may
    have noticed that the BoW matrix contains unique words in the columns and each
    text representation is in the rows. If you have 100 long pieces of text with only
    50 unique words across them, your BoW matrix will have 50 columns and 100 rows.
    During your exam, you are likely to receive a list of pieces of text and be asked
    to prepare the BoW matrix.


    There is one more extremely important concept you should know about BoW, which
    is the n-gram configuration. The term n-gram is used to describe the way you would
    like to look at your vocabulary, either via single words (uni-gram), groups of
    two words (bi-gram), groups of three words (tri-gram), or even groups of n words
    (n-gram). So far, you have seen BoW representations using a uni-gram approach,
    but more sophisticated representations of BoW may use bi-grams, tri-grams, or
    n-grams.'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'The main logic itself does not change, but you need to know how to represent
    n-grams in BoW. Still using the example from Figure 4.11, a bi-gram approach would
    combine those words in the following way: [this movie, movie really, really good,
    good although, although old, old production]. Make sure you understand this before
    taking the exam.


    # IMPORTANT NOTE


    *The power and simplicity of BoW come from the fact that you can easily come up
    with a training set to train your algorithms. If you look at Figure 4.11, can
    you see that having more data and just adding a classification column to that
    table, such as good or bad review, would allow us to train a binary classification
    model to predict sentiments?*


    Alright – you might have noticed that many of the awesome techniques that you
    have been introduced to come with some downsides. The problem with BoW is the
    challenge of maintaining its vocabulary. You can easily see that, in a huge corpus
    of texts, the vocabulary size tends to become bigger and bigger and the matrices’
    representations tend to be sparse (yes – the sparsity issue again).


    One possible way to solve the vocabulary size issue is by using word hashing (also
    known in ML as the **hashing trick**). Hash functions map data of arbitrary sizes
    to data of a fixed size. This means you can use the hash trick to represent each
    text with a fixed number of features (regardless of the vocabulary’s size). Technically,
    this hashing space allows collisions (different texts represented by the same
    features), so this is something to take into account when you are implementing
    feature hashing.


    # TF-IDF


    Another problem that comes with BoW, especially when you use the frequency strategy
    to build the feature space, is that more frequent words will strongly boost their
    scores due to the high number of occurrences within the document. It turns out
    that, often, those words with high occurrences are not the key words of the document,
    but just other words that *also* appear many times in several other documents.


    **Term Frequency-Inverse Document Frequency (TF-IDF)** helps penalize these types
    of words, by checking how frequent they are in other documents and using that
    information to rescale the frequency of the words within the document.


    At the end of the process, TF-IDF tends to give more importance to words that
    are unique to the document (document-specific words). Next, let’s look at a concrete
    example so that you can understand it in depth.


    Consider that you have a text corpus containing 100 words and the word “Amazon”
    appears three times. The Term Frequency (TF) of this word would be 3/100, which
    is equal to 0.03. Now, suppose'
  merge: -1
  img_proc: true
- pgno: 122
  md: 'you have other 1,000 documents and that the word “Amazon” appears in 50 of
    these. In this case, the Inverse Document Frequency (IDF) would be given by the
    log as 1,000/50, which is equal to 1.30. The TF-IDF score of the word “Amazon,”
    in that specific document under analysis, will be the product of TF * IDF, which
    is 0.03 * 1.30 (0.039).


    Suppose that instead of 50 documents, the word “Amazon” had also appeared on another
    750 documents – in other words, much more frequently than in the prior scenario.
    In this case, the TF part of this equation will not change – it is still 0.03.
    However, the IDF piece will change a little, since this time it will be log 1,000/750,
    which is equal to 0.0036. As you can see, now the word “Amazon” has much less
    importance than in the previous example.


    # # Word embedding


    Unlike traditional approaches, such as BoW and TD-IDF, modern methods of text
    representation will take care of the context of the information, as well as the
    presence or frequency of words. One very popular and powerful approach that follows
    this concept is known as **word embedding.** Word embeddings create a dense vector
    of a fixed length that can store information about the context and meaning of
    the document.


    Each word is represented by a data point in a multidimensional hyper plan, which
    is known as embedding space. This embedding space will have *n* dimensions, where
    each of these dimensions refers to a particular position of this dense vector.


    Although it may sound confusing, the concept is actually pretty simple. Suppose
    you have a list of four words, and you want to plot them in an embedding space
    of five dimensions. The words are king, queen, live, and castle. Table 4.13 shows
    how to do this.


    | | Dim 1 | Dim 2 | Dim 3 | Dim 4 | Dim 5 |

    |---|---|---|---|---|---|

    | King | 0.22 | 0.76 | 0.77 | 0.44 | 0.33 |

    | Queen | 0.98 | 0.09 | 0.67 | 0.89 | 0.56 |

    | Live | 0.13 | 0.99 | 0.88 | 0.01 | 0.55 |

    | Castle | 0.01 | 0.89 | 0.34 | 0.02 | 0.90 |


    Table 4.13 – An embedding space representation'
  merge: -1
  img_proc: true
- pgno: 123
