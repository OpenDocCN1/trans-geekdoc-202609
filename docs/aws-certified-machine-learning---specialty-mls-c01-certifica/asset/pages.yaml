- pgno: 159
  md: '![](img/87c29232224b00f5a8bba6a66a391700_159_0.png)


    Figure 6.5 – Residual analysis


    The takeaway here is that the errors are randomly distributed. Such evidence,
    along with a high R squared rating, can be used as arguments to support the use
    of this model.


    # IMPORTANT NOTE


    In Chapter 7, Evaluating and Optimizing Models, you will learn about evaluation
    metrics. For instance, you will learn that each type of model may have its own
    set of evaluation metrics. Regression models are commonly evaluated with Mean
    Squared Error (MSE) and Root Mean Squared Error (RMSE). In other words, apart
    from R, R squared, and residual analysis, ideally, you will execute your model
    on test sets to extract other performance metrics. You can even use a cross-validation
    system to check model performance, as you learned in Chapter 1, Machine Learning
    Fundamentals.


    Very often, when the model residuals do present a pattern and are not randomly
    distributed, it is because the existing relationship in the data is not linear,
    but non-linear, so another modeling technique must be applied. In the next subsection,
    you will learn how you can interpret regression models.


    # Interpreting regression models


    It is also good to know how to interpret a linear regression model. Sometimes,
    you use linear regression not necessarily to create a predictive model but to
    do a regression analysis. You can then use regression analysis to understand the
    relationship between the independent and dependent variables.


    Looking back at the regression equation (y = 1021.212 * x + 53.30), you can see
    the two terms: alpha or slope (1021.20) and beta or y intercept (53.3). You can
    interpret this model as follows: for each additional year of working experience,
    you will increase your salary by $1,021.20. Also, note that when “years of experience”
    is equal to 0, the expected salary is going to be $53.30 (this is the point where
    the straight line crosses the y axis).


    From a broad perspective, your regression analysis should answer the following
    question: for each extra unit that is added to the independent variable (slope),
    what is the average change in the dependent variable?


    # Checking adjusted R squared


    At this point, you have a much better idea of regression models! There is just
    one other very important topic that you should be aware of, regardless of whether
    it will come up in the exam or not, which is the parsimony aspect of your'
