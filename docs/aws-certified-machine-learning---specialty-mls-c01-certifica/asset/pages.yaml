  md: 'another AWS service – that is, you can trigger it manually for your web or
    mobile application, for example.


    When it comes to deployment, you can upload your function as a ZIP file or as
    a container image. Although this is not ideal for an automated deployment process,
    coding directly into the AWS Lambda console is also possible.


    As with any other service, this one also has some downsides that you should be
    aware of:


    +   - Memory allocation for your function: This ranges from 128 MB to 10,240 MB
    (AWS has recently increased this limit from 3 GB to 10 GB, as stated previously)

    +   - Function timeout: This is a maximum of 900 seconds (15 minutes)

    +   - Function layer: This is a maximum of five layers

    +   - Burst concurrency: This is from 500 to 3,000, depending on the AWS Region

    +   - Deployment package size: This is 250 MB unzipped, including layers

    +   - Container image code package size: This is 10 GB

    +   - Available space in the /tmp directory: This is 512 MB


    Before opting for Lambda functions, make sure these restrictions fit your use
    case. By bringing Lambda functions closer to your scope of alternative pipelines
    for SageMaker, you can leverage one potential use of Lambda, which is to create
    inference pipelines for the models.


    As you know, SageMaker has a very handy `.deploy()` method that will create endpoints
    for model inference. This is so that you can call to pass the input data to receive
    predictions back. Here, you can create this inference endpoint by using the API
    gateway and Lambda functions.


    If you do not need an inference endpoint and you just want to make predictions
    and store results somewhere (in a batch fashion), then all you need is a Lambda
    function, which is able to fetch the input data, instantiate the model object,
    make predictions, and store the results in the appropriate location. Of course,
    it does this by considering all the limitations that you discussed earlier.


    Alright, now that you have a good background about Lambda and some use cases,
    you can take a look at the most important configurations that you should be aware
    of for the exam.


    # Creating and configuring a Lambda Function


    First of all, you should know that you can create a Lambda function in different
    ways, such as via the AWS CLI (a Lambda API reference), the AWS Lambda console,
    or even deployment frameworks (for example, *the serverless framework*).'
