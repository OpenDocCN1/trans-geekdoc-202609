- pgno: 186
  md: '# # Evaluating and Optimizing Models


    It is now time to learn how to evaluate and optimize machine learning models.
    During the process of modeling, or even after model completion, you might want
    to understand how your model is performing. Each type of model has its own set
    of metrics that can be used to evaluate performance, and that is what you are
    going to study in this chapter.


    Apart from model evaluation, as a data scientist, you might also need to improve
    your model’s performance by tuning the hyperparameters of your algorithm. You
    will take a look at some nuances of this modeling task.


    In this chapter, the following topics will be covered:


    +   - Introducing model evaluation

    +   - Evaluating classification models

    +   - Evaluating regression models

    +   - Model optimization


    Alright, time to rock it!


    # ## Introducing model evaluation


    There are several different scenarios in which you might want to evaluate model
    performance. Some of them are as follows:


    +   - You are creating a model and testing different approaches and/or algorithms.
    Therefore, you need to compare these models to select the best one.

    +   - You have just completed your model and you need to document your work, which
    includes specifying the model’s performance metrics that you got from the modeling
    phase.

    +   - Your model is running in a production environment, and you need to track
    its performance. If you encounter model drift, then you might want to retrain
    the model.


    # ### IMPORTANT NOTE


    The term model drift is used to refer to the problem of model deterioration. When
    you are building a machine learning model, you must use data to train the algorithm.
    This set of data is known as training data, and it reflects the business rules
    at a particular point in time. If these business rules change over time, your
    model will probably fail to adapt to those changes. This is because it was trained
    on top of another dataset, which was reflecting another business scenario. To
    solve this problem, you must retrain the model so that it can consider the rules
    of the new business scenario.'
  merge: -1
  img_proc: true
- pgno: 187
  md: 'Model evaluations are commonly inserted in the context of testing. You have
    learned about holdout validation and cross-validation before. However, both testing
    approaches share the same requirement: they need a metric in order to evaluate
    performance.


    These metrics are specific to the problem domain. For example, there are specific
    metrics for regression models, classification models, clustering, natural language
    processing, and more. Therefore, during the design of your testing approach, you
    have to consider what type of model you are building in order to define the evaluation
    metrics.


    In the following sections, you will take a look at the most important metrics
    and concepts that you should know to evaluate your models.


    # # Evaluating classification models


    Classification models are one of the most traditional classes of problems that
    you might face, either during the exam or during your journey as a data scientist.
    A very important artifact that you might want to generate during the classification
    model evaluation is known as a confusion matrix.


    A confusion matrix compares your model predictions against the real values of
    each class under evaluation. Figure 7.1 shows what a confusion matrix looks like
    in a binary classification problem:


    ![](img/87c29232224b00f5a8bba6a66a391700_187_0.png)


    Figure 7.1 – A confusion matrix


    There are the following components in a confusion matrix:


    +   - TP: This is the number of true positive cases. Here, you have to count the
    number of cases that have been predicted as true and are, indeed, true. For example,
    in a fraud detection system, this would be the number of fraudulent transactions
    that were correctly predicted as fraud.


    +   - TN: This is the number of true negative cases. Here, you have to count the
    number of cases that have been predicted as false and are, indeed, false. For
    example, in a fraud detection system, this would be the number of non-fraudulent
    transactions that were correctly predicted as not fraud.


    +   - FN: This is the number of false negative cases. Here, you have to count
    the number of cases that have been predicted as false but are, instead, true.
    For example, in a fraud detection system, this would be the number of fraudulent
    transactions that were wrongly'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'predicted as not fraud.


    +   FP: This is the number of false positive cases. Here, you have to count the
    number of cases that have been predicted as true but are, instead, false. For
    example, in a fraud detection system, this would be the number of non-fraudulent
    transactions that were wrongly predicted as fraud.


    In a perfect scenario, your confusion matrix will have only true positive and
    true negative cases, which means that your model has an accuracy of 100%. In practical
    terms, if that type of scenario occurs, you should be sceptical instead of happy,
    since it is expected that your model will contain some level of errors. If your
    model does not contain errors, you are likely to be suffering from overfitting
    issues, so be careful.


    Once false negatives and false positives are expected, the best you can do is
    prioritize one of them. For example, you can reduce the number of false negatives
    by increasing the number of false positives and vice versa. This is known as the
    precision versus recall trade-off. Let’s take a look at these metrics next.


    # Extracting metrics from a confusion matrix


    The simplest metric that can be extracted from a confusion matrix is known as
    **accuracy**. Accuracy is given by the following equation, as shown in *Figure
    7.2*:


    ```

    Accuracy = \frac{TrueNegatives + TruePositive}{TruePositive + FalsePositive +
    TrueNegative + FalseNegative}

    ```


    Figure 7.2 – Formula for accuracy


    For the sake of demonstration, *Figure 7.3* shows a confusion matrix with data.


    ![](img/87c29232224b00f5a8bba6a66a391700_188_0.png)


    Figure 7.3 – A confusion matrix filled with some examples'
  merge: -1
  img_proc: true
- pgno: 189
  md: "According to *Figure 7.3*, the accuracy would be (100 + 90) / 210, which is\
    \ equal to 0.90. There is a common issue that occurs when utilizing an accuracy\
    \ metric, which is related to the balance of each class. Problems with highly\
    \ imbalanced classes, such as 99% positive cases and 1% negative cases, will impact\
    \ the accuracy score and make it useless.\n\nFor example, if your training data\
    \ has 99% positive cases (the majority class), your model is likely to correctly\
    \ classify most of the positive cases but work badly in the classification of\
    \ negative cases (the minority class). The accuracy will be very high (due to\
    \ the correctness of the classification of the positive cases), regardless of\
    \ the bad results in the minority class classification.\n\nThe point is that on\
    \ highly imbalanced problems, you usually have more interest in correctly classifying\
    \ the minority class, not the majority class. That is the case in most fraud detection\
    \ systems, for example, where the minority class corresponds to fraudulent cases.\
    \ For imbalanced problems, you should look for other types of metrics, which you\
    \ will learn about next.\n\nAnother important metric that you can extract from\
    \ a confusion matrix is known as recall, which is given by the following equation,\
    \ as shown in *Figure 7.4*:\n\nRecall = \nTrue Positive \nTrue Positive+False\
    \ Negative\n\nFigure 7.4 – Formula for recall\n\nIn other words, recall is the\
    \ number of true positives over the total number of positive cases. Recall is\
    \ also known as sensitivity.\n\nWith the values in *Figure 7.3*, recall is given\
    \ by 100 / 112, which is equal to 0.89. Precision, on the other hand, is given\
    \ by the following formula, as shown in *Figure 7.5*:\n\nPrecision = \nTrue Positive\
    \ \nTrue Positive+False Positive\n\nFigure 7.5 – Formula for precision\n\nIn other\
    \ words, precision is the number of true positives over the total number of predicted\
    \ positive cases. Precision is also known as positive predictive power.\n\nWith\
    \ the values in *Figure 7.3*, precision is given by 100 / 108, which is equal\
    \ to 0.93. In general, you can increase precision at the cost of decreasing recall\
    \ and vice versa. There is another model evaluation artifact in which you can\
    \ play around with this precision versus recall trade-off. It is known as a precision-recall\
    \ curve.\n\nPrecision-recall curves summarize the precision versus recall trade-off\
    \ by using different probability thresholds. For example, the default threshold\
    \ is 0.5, where any prediction above 0.5 will be"
  merge: -1
  img_proc: true
- pgno: 190
  md: 'considered true; otherwise, it is false. You can change the default threshold
    according to your need so that you can prioritize recall or precision. Figure
    7.6 shows an example of a precision-recall curve:


    ![](img/87c29232224b00f5a8bba6a66a391700_190_0.png)


    Figure 7.6 – A precision-recall curve


    As you can see in Figure 7.6, increasing the precision will reduce the amount
    of recall and vice versa. Figure 7.6 shows the precision/recall for each threshold
    for a **gradient boosting model** (as shown by the orange line) compared to a
    **no-skill model** (as shown by the blue dashed line). A perfect model will approximate
    the curve to the point (1,1), forming a squared corner on the top right-hand side
    of the chart.


    Another visual analysis you can use on top of confusion matrices is known as a
    **Receiver Operating Characteristic (ROC) curve**. ROC curves summarize the trade-off
    between the **true positive rate** and the **false positive rate** according to
    different thresholds, as in the precision-recall curve.


    You already know about the true positive rate, or sensitivity, which is the same
    as what you have just learned about with the precision-recall curve. The other
    dimension of an ROC curve is the **false positive rate**, which is the number
    of false positives over the number of false positives plus true negatives.


    In literature, you might find the false positive rate referred to as **inverted
    specificity**, represented by $1 - specificity$. Specificity is given as the number
    of true negatives over the number of true negatives plus false positives. Furthermore,
    false-positive rates or inverted specificity are the same. Figure 7.7 shows what
    an ROC curve looks like:'
  merge: -1
  img_proc: true
- pgno: 191
  md: '![](img/87c29232224b00f5a8bba6a66a391700_191_0.png)


    Figure 7.7 – ROC curve


    A perfect model will approximate the curve to the point (0,1), forming a squared
    corner on the top left-hand side of the chart. The orange line represents the
    trade-off between the true positive rate and the false positive rate of a gradient-boosting
    classifier. The dashed blue line represents a no-skill model, which cannot predict
    the classes properly.


    To summarize, you can use ROC curves for fairly balanced datasets and precision-recall
    curves for moderate to imbalanced datasets.


    # Summarizing precision and recall


    Sometimes, you might want to use a metric that summarizes precision and recall,
    instead of prioritizing one over the other. Two very popular metrics can be used
    to summarize precision and recall: **F1 score** and **Area Under Curve (AUC)**.


    The F1 score, also known as the **F-measure**, computes the harmonic mean of precision
    and recall. AUC summarizes the approximation of the area under the precision-recall
    curve.


    That brings us to the end of this section on classification metrics. Let’s now
    take a look at the evaluation metrics for regression models.


    # Evaluating regression models


    Regression models are quite different from classification models since the outcome
    of the model is a continuous number. Therefore, the metrics around regression
    models aim to monitor the difference'
  merge: -1
  img_proc: true
- pgno: 192
  md: 'between real and predicted values.


    The simplest way to check the difference between a predicted value (\(\hat{y}\))
    and its actual value (\(y\)) is by performing a simple subtraction operation,
    where the error will be equal to the absolute value of \(\hat{y} - y\). This metric
    is known as the **Mean Absolute Error (MAE)**.


    Since you usually have to evaluate the error of each prediction, \(i\), you have
    to take the mean value of the errors. Figure 7.8 depicts formula that shows how
    this error can be formally defined:


    ![](img/87c29232224b00f5a8bba6a66a391700_192_0.png)


    Figure 7.8 – Formula for error of each prediction


    Sometimes, you might want to penalize bigger errors over smaller errors. To achieve
    this, you can use another metric, known as the **Mean Squared Error (MSE)**. The
    MSE will square each error and return the mean value.


    By squaring errors, the MSE will penalize bigger ones. Figure 7.9 depicts formula
    that shows how the MSE can be formally defined:


    ![](img/87c29232224b00f5a8bba6a66a391700_192_1.png)


    Figure 7.9 – Formula for MSE


    There is a potential interpretation problem with the MSE. Since it has to compute
    the squared error, it might be difficult to interpret the final results from a
    business perspective. The **Root Mean Squared Error (RMSE)** works around this
    interpretation issue, by taking the square root of the MSE. Figure 7.10 depicts
    the RMSE equation:


    ![](img/87c29232224b00f5a8bba6a66a391700_192_2.png)


    Figure 7.10 – Formula for RMSE


    The RMSE is one of the most used metrics for regression models, since it can penalize
    larger errors and remains easy to interpret.'
  merge: -1
  img_proc: true
- pgno: 193
  md: '# Exploring other regression metrics


    There are many more metrics that are suitable for regression problems, in addition
    to the ones that you have just learned. You will not learn about most of them
    here, but you will be introduced to a few more metrics that might be important
    for you to know.


    One of these metrics is known as the Mean Absolute Percentage Error (MAPE). As
    the name suggests, the MAPE will compute the absolute percentage error of each
    prediction and then take the average value. Figure 7.11 depicts formula that shows
    how this metric is computed:


    ![](img/87c29232224b00f5a8bba6a66a391700_193_0.png)


    Figure 7.11 – Formula for MAPE


    The MAPE is broadly used in forecasting models since it is very simple to interpret,
    and it provides a very good sense of how far (or close) the predictions are from
    the actual values (in terms of a percentage).


    You have now completed this section on regression metrics. Next, you will learn
    about model optimization.


    # Model optimization


    As you know, understanding evaluation metrics is very important in order to measure
    your model’s performance and document your work. In the same way, when you want
    to optimize your current models, evaluating metrics also plays a very important
    role in defining the baseline performance that you want to challenge.


    The process of model optimization consists of finding the best configuration (also
    known as hyperparameters) of the machine learning algorithm for a particular data
    distribution. You do not want to find hyperparameters that overfit the training
    data, in the same way that you do not want to find hyperparameters that underfit
    the training data.


    You learned about overfitting and underfitting in Chapter 1, Machine Learning
    Fundamentals. In the same chapter, you also learned how to avoid these two types
    of modeling issues.'
  merge: -1
  img_proc: true
- pgno: 194
  md: 'In this section, you will learn about some techniques that you can use to find
    the best configuration for a particular algorithm and dataset. You can combine
    these techniques of model optimization with other methods, such as cross-validation,
    to find the best set of hyperparameters for your model and avoid fitting issues.


    # IMPORTANT NOTE


    Always remember that you do not want to optimize your algorithm to the underlying
    training data but to the data distribution behind the training data, so that your
    model will work on the training data as well as the production data (the data
    that has never been exposed to your model during the training process). A machine
    learning model that works only on the training data is useless. That is why combining
    model-tuning techniques (such as the ones you will learn about next) with sampling
    techniques (such as cross-validation) makes all the difference when it comes to
    creating a good model.


    # Grid search


    Grid search is probably the most popular method for model optimization. It consists
    of testing different combinations of the algorithm and selecting the best one.
    Here, there are two important points that you need to pay attention to:


    +   - How to define the best configuration of the model

    +   - How many configurations should be tested


    The best model is defined based on an evaluation metric. In other words, you have
    to first define which metric you are going to use to evaluate the model’s performance.
    Secondly, you have to define how you are going to evaluate the model. Usually,
    cross-validation is used to evaluate the model on multiple datasets that have
    never been used for training.


    In terms of the number of combinations/configurations, this is the most challenging
    part when playing with grid search. Each hyperparameter of an algorithm may have
    multiple or, sometimes, infinite possibilities of values. If you consider that
    an algorithm will usually have multiple hyperparameters, this becomes a function
    with quadratic cost, where the number of unique combinations to test is given
    as the number of values of hyperparameter a * the number of values of hyperparameter
    b * the number of values of hyperparameter i. Table 7.1 shows how you could potentially
    set a grid search configuration for a decision tree model:


    | Criterion | Max depth | Min samples leaf |

    |---|---|---|

    | Gini, Entropy | 2, 5 =, 10 | 10, 20, 30 |


    Table 7.1 – Grid search configuration'
  merge: -1
  img_proc: true
- pgno: 195
  md: 'In Table 7.1, there are three hyperparameters: **Criterion**, **Max depth**,
    and **Min samples leaf**. Each of these hyperparameters has a list of values for
    testing. That means by the end of the grid search process, you will have tested
    18 models (2 * 3 * 3), where only the best one will be selected.


    As you might have noticed, all the different combinations of those three hyperparameters
    will be tested. For example, consider the following:


    +   - Criterion = Gini, Max depth = 2, Min samples leaf = 10

    +   - Criterion = Gini, Max depth = 5, Min samples leaf = 10

    +   - Criterion = Gini, Max depth = 10, Min samples leaf = 10


    Some other questions that you might have could be as follows:


    +   - Considering that a particular algorithm might have several hyperparameters,
    which ones should I tune?

    +   - Considering that a particular hyperparameter might accept infinite values,
    which values should I test?


    These are good questions, and grid search will not give you a straight answer
    for them. Instead, this is closer to an empirical process, where you have to test
    as much as you need to achieve your target performance.


    # IMPORTANT NOTE


    *Of course, grid search cannot guarantee that you will come up with your target
    performance. That depends on the algorithm and the training data.*


    A common practice, though, is to define the values for testing by using a **linear
    space** or **log space**, where you can manually set the limits of the hyperparameter
    you want to test and the number of values for testing. Then, the intermediate
    values will be drawn by a linear or log function.


    As you might imagine, grid search can take a long time to run. A number of alternative
    methods have been proposed to work around this time issue. **Random search** is
    one of them, where the list of values for testing is randomly selected from the
    search space.


    Another method that has gained rapid adoption across the industry is known as
    **Bayesian optimization**. Algorithm optimizations, such as **gradient descent**,
    try to find what is called the **global minima**, by calculating derivatives of
    the cost function. The global minima are the points where you find the algorithm
    configuration with the least associated cost.


    Bayesian optimization is useful when calculating derivatives is not an option.
    So you can use the **Bayes theorem**, a probabilistic approach, to find the global
    minima using the smallest number of steps.


    In practical terms, Bayesian optimization will start testing the entire search
    space to find the most promising set of optimal hyperparameters. Then, it will
    perform more tests specifically in the place'
  merge: -1
  img_proc: true
