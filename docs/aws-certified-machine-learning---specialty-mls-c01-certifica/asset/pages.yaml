  md: '# # Model Deployment


    In the previous chapter, you explored various aspects of Amazon SageMaker, including
    different instances, data preparation in Jupyter Notebook, model training with
    built-in algorithms, and crafting custom code for training and inference. Now,
    your focus shifts to diverse model deployment choices using AWS services.


    If you are navigating the landscape of model deployment on AWS, understanding
    the options is crucial. One standout service is Amazon SageMaker – a fully managed
    solution that streamlines the entire **machine learning (ML)** life cycle, especially
    when it comes to deploying models. There are several factors that influence the
    model deployment options. As you go ahead in this chapter you will learn different
    options to deploy models using SageMaker.


    # # Factors influencing model deployment options


    Here are the primary factors that play a crucial role in determining a model deployment
    option:


    +   **Scalability requirements**


    +   **High traffic:** Imagine you are developing a recommendation system for a
    popular e-commerce platform expecting fluctuating traffic throughout the day.
    If the application anticipates high traffic and varying loads, services such as
    Amazon SageMaker with autoscaling capabilities or AWS Lambda may be preferable.
    This is crucial to maintain performance during peak hours.


    +   **Real-time versus batch inference**


    +   **Real-time inference:** Consider a fraud detection system for a financial
    institution where immediate decisions are essential for transaction approval or
    denial. For such real-time predictions, services such as Amazon SageMaker and
    AWS Lambda are suitable. For fraud detection, these services provide low-latency
    responses, enabling quick decisions on the legitimacy of transactions. Real-time
    transactions trigger immediate predictions through SageMaker''s inference endpoints
    in this case.


    +   **Batch inference:** In a healthcare setting, you may need to process a large
    volume of patient data periodically to update predictive models for disease diagnosis.
    This is a batch processing use case, and a combination of SageMaker and services
    such as Amazon S3 can be employed. You can efficiently handle large datasets,
    perform periodic model updates, and ensure that predictions align with the latest
    information, which is crucial for maintaining accuracy in healthcare predictions.


    +   **Infrastructure management complexity**


    +   **Managed deployment versus custom deployment:** Suppose you are developing
    a computer vision application for analyzing satellite images, requiring specialized
    configurations and dependencies. In cases where custom'
  merge: -1
  img_proc: true
- pgno: 275
  md: 'configurations are necessary, opting for custom deployments using EC2 instances
    allows more control over the infrastructure. SageMaker''s managed services are
    ideal for scenarios where you prioritize ease of management and do not want to
    delve into intricate infrastructure details.


    +   • Cost considerations


    +   • Pay-per-use: Consider a weather forecasting application where the computational
    demand varies based on weather events. AWS Lambda''s pay-per-use model is advantageous
    in situations where the workload fluctuates. You pay only for the compute time
    consumed, making it cost-effective for applications with sporadic, unpredictable
    usage patterns compared to alternatives with fixed costs.


    # # SageMaker deployment options


    Amazon SageMaker offers diverse deployment options to deploy ML models effectively.
    In this section, you will explore different ways of deploying models using SageMaker,
    providing technology solutions with scenarios and examples.


    # # Real-time endpoint deployment


    In this scenario, you have a trained image classification model, and you want
    to deploy it to provide real-time predictions for incoming images.


    # ## Solution


    Create a SageMaker model and deploy it to a real-time endpoint.


    # ## Steps


    +   1. Train your model using SageMaker training jobs.

    +   2. Create a SageMaker model from the trained model artifacts.

    +   3. Deploy the model to a real-time endpoint.


    # ## Example code snippet


    ```

    from sagemaker import get_execution_role

    from sagemaker.model import Model

    from sagemaker.predictor import RealTimePredictor

    role = get_execution_role()

    model_artifacts=''s3://your-s3-bucket/path/to/model.tar.gz''

    model = Model(model_data=model_artifact, role=role)

    predictor = model.deploy(instance_type=''ml.m4.xlarge'', endpoint_name=''image-classification-endpoint'')

    ```'
