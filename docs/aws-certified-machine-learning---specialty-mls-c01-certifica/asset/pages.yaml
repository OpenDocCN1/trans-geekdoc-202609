- pgno: 25
  md: '# Making the Most Out of this Book – Your Certification and Beyond


    This book and its accompanying online resources are designed to be a complete
    preparation tool for your MLS-C01 Exam.


    The book is written in a way that you can apply everything you’ve learned here
    even after your certification. The online practice resources that come with this
    book (Figure 1.1) are designed to improve your test-taking skills. They are loaded
    with timed mock exams, interactive flashcards, and exam tips to help you work
    on your exam readiness from now till your test day.


    # BEFORE YOU PROCEED


    To learn how to access these resources, head over to Chapter 11, Accessing the
    Online Practice Resources, at the end of the book.


    ![](img/87c29232224b00f5a8bba6a66a391700_25_0.png)


    Figure 1.1 – Dashboard interface of the online practice resources


    Here are some tips on how to make the most out of this book so that you can clear
    your certification and retain your knowledge beyond your exam:


    +   1. Read each section thoroughly.

    +   2. Make ample notes: You can use your favorite online note-taking tool or
    use a physical notebook. The free online resources also give you access to an
    online version of this book. Click the BACK TO THE BOOK link from the Dashboard
    to access the book in Packt Reader. You can highlight specific sections of the
    book there.'
  merge: -1
  img_proc: true
