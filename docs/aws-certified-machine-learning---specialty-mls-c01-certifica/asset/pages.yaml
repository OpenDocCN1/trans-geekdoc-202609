    Figure 5.2 – Plotting relationships with a bubble chart


    Looking at Figure 5.2, you can see two types of relationships. The first one is
    the relationship between the annual rate and investment period: the longer the
    investment period, the higher your annual rate. The second one is the relationship
    between the amount invested and the annual rate: the higher the amount invested,
    the higher your annual rate. As you can see, this is a very effective way to present
    this type of analysis. Next, you will learn how to compare variables.


    # Visualizing comparisons in your data


    Comparisons are very common in data analysis and there are different ways to present
    them. Starting with the bar chart, you must have seen many reports that have used
    this type of visualization.


    Bar charts can be used to compare one variable among different classes – for example,
    a car’s price across different models or population size per country. In Figure
    5.3, the bar chart is used to analyze the percentage of positive tests for COVID-19
    in a range of regions of India as of April 7th, 2020.'
