- pgno: 61
  md: 'Access. Standard is used for frequently accessed data. Infrequent Access is
    the cost-effective storage class for long-lived, less frequently accessed data.
    Lifecycle policies can be used for the transition of data between storage classes.
    EFS offers a pay-as-you-go pricing model, where you only pay for the storage capacity
