    \ exam day. If you get some answers wrong, go back to the book and revisit the\
    \ concepts you're weak in.\n+   \n+   6. Exam Tips: Review these from time to\
    \ time to improve your exam readiness even further.\n\nThe main topics of this\
    \ chapter are as follows:\n\n+   • Comparing AI, ML, and DL\n+   • Classifying\
    \ supervised, unsupervised, and reinforcement learning\n+   • The CRISP-DM modeling\
    \ life cycle\n+   • Data splitting\n+   • Modeling expectations\n+   • Introducing\
    \ ML frameworks\n+   • ML in the cloud\n\n# Comparing AI, ML, and DL\n\nAI is\
    \ a broad field that studies different ways to create systems and machines that\
    \ will solve problems by simulating human intelligence. There are different levels\
    \ of sophistication to create these programs and machines, which go from simple\
    \ rule-based engines to complex self-learning systems.\nAI covers, but is not\
    \ limited to, the following sub-areas:\n\n+   • Robotics\n+   • Natural language\
    \ processing (NLP)\n+   • Rule-based systems\n+   • Machine learning (ML)\n+ \
    \  • Computer vision\n\nThe area this certification exam focuses on is ML.\n\n\
