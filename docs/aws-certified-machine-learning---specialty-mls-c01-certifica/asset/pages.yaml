    # Choosing the right instance type for a training job


    There is no rule of thumb to determine the instance type that you require. It
    changes based on the size of the data, the complexity of the network, the ML algorithm
    in question, and several other factors such as time and cost. Asking the right
    questions will allow you to save money and make your project cost-effective.


    If the deciding factor is instance size, then classifying the problem as one for
    CPUs or GPUs is the right step. Once that is done, then it is good to consider
    whether it could be multi-GPU or multi-CPU, answering the question about distributed
    training. This also solves your instance count factor. If it’s compute intensive,
    then it would be wise to check the memory requirements too.


    The next deciding factor is the instance family. The right question here is, is
    the chosen instance optimized for time and cost? In the previous step, you figured
    out whether the problem can be solved best by either a CPU or GPU, and this narrows
    down the selection process. Now, let’s learn about inference jobs.


    # Choosing the right instance type for an inference job


    The majority of the cost and complexity of ML in production is inference. Usually,
    inference runs on a single input in real time. Inference jobs are usually less
    compute/memory-intensive. They have to'
