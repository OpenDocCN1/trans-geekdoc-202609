    What you understood from the traditional data pipeline is that ETL is all about
    coding and maintaining code on the servers so that everything runs smoothly. If
    the data format changes in any way, then the code needs to be changed, and that
    results in a change to the target schema. If the data source changes, then the
    code must be able to handle that too, and it’s an overhead. Should you write code
    to recognize these changes in data sources? Do you need a system to adapt to the
    change and discover the data for you? The answer to these questions is yes, and
    to do so, you can use AWS Glue. Now, you will learn why AWS Glue is so popular.


    # Features of AWS Glue


    AWS Glue is a completely managed serverless ETL service on AWS. It has the following
    features:


    +   - It automatically discovers and categorizes your data by connecting to the
    data sources and generates a data catalog.

    +   - Services such as Amazon Athena, Amazon Redshift, and Amazon EMR can use
    the data catalog to query the data.

    +   - AWS Glue generates the ETL code, which is an extension to Spark in Python
    or Scala, which can be modified, too.

    +   - It scales out automatically to match your Spark application requirements
    for running the ETL job and loading the data into the destination.


    AWS Glue has the Data Catalog, and that’s the secret to its success. It helps
    with discovering data from data sources and understanding a bit about it:'
