  md: '# Applying Machine Learning Algorithms


    In the previous chapter, you learned about understanding data and visualization.
    It is now time to move on to the modeling phase and study machine learning algorithms!
    In the earlier chapters, you learned that building machine learning models requires
    a lot of knowledge about AWS services, data engineering, data exploration, data
    architecture, and much more. This time, you will delve deeper into the algorithms
    that have been introduced and more.


    Having a good sense of the different types of algorithms and machine learning
    approaches will put you in a very good position to make decisions during your
    projects. Of course, this type of knowledge is also crucial to the AWS Certified
    Machine Learning Specialty exam.


    Bear in mind that there are thousands of algorithms out there. You can even propose
    your own algorithm for a particular problem. In this chapter, you will learn about
    the most relevant ones and, hopefully, the ones that you will probably face in
    the exam.


    The main topics of this chapter are as follows:


    +   - Storing the training data

    +   - A word about ensemble models

    +   - Supervised learning:

    +   - Regression models

    +   - Classification models

    +   - Forecasting models

    +   - Object2Vec

    +   - Unsupervised learning:

    +   - Clustering

    +   - Anomaly detection

    +   - Dimensionality reduction

    +   - IP Insights

    +   - Textual analysis (natural language processing)

    +   - Image processing

    +   - Reinforcement learning


