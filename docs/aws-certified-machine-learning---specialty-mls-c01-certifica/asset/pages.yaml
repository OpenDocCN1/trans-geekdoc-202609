    Next, you will create a co-occurrence matrix, which will count the number of occurrences
    of each pair of words, according to the pre-defined context window. Consider the
    following text: “I will pass this exam, you will see. I will pass it.”


    The context window of the first word “pass” would be the ones in bold: “I will
    pass this exam, you will see. I will pass it.” Considering this logic, have a
