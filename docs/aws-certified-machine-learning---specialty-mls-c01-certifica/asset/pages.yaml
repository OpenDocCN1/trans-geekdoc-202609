    # Relational Database Service (RDS)


    This is one of the most commonly featured topics in AWS exams. You should have
    sufficient knowledge prior to the exam. In this section, you will learn about
    Amazon’s RDS.


    AWS provides several relational databases as a service to its users. Users can
    run their desired database on EC2 instances, too. The biggest drawback is that
    the instance is only available in one Availability Zone in a Region. The EC2 instance
    has to be administered and monitored to avoid any kind of failure. Custom scripts
    will be required to maintain a data backup over time. Any database major or minor
    version update would result in downtime. Database instances running on an EC2
    instance cannot be easily scaled if the load increases on the database as replication
    is not an easy task.


    RDS provides managed database instances that can themselves hold one or more databases.
    Imagine a database server running on an EC2 instance that you do not have to manage
    or maintain. You need only access the server and create databases in it. AWS will
    manage everything else, such as the security of the instance, the operating system
    running on the instance, the database versions, and high availability of the database
    server. RDS supports multiple engines, such as MySQL, Microsoft SQL Server, MariaDB,
    Amazon Aurora, Oracle, and PostgreSQL. You can choose any of these based on your
    requirements.


    The foundation of Amazon RDS is a database instance, which can support multiple
    engines and can have multiple databases created by the user. One database instance
    can be accessed only by using the database DNS endpoint (the CNAME, which is an
    alias for the canonical name in a domain name system database) of the primary
    instance. RDS uses standard database engines. So, accessing the database using
    some sort of tool in a self-managed database server is the same as accessing Amazon
    RDS.


    As you have now understood the requirements of Amazon RDS, let’s understand the
    failover process in Amazon RDS. You will cover what services Amazon offers if
    something goes wrong with the RDS'
