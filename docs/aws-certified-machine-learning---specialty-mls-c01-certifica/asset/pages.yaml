  md: '# Amazon SageMaker Modeling


    In the previous chapter, you learned several methods of model optimization and
    evaluation techniques. You also learned various ways of storing data, processing
    data, and applying different statistical approaches to data. So, how can you now
    build a pipeline for this? Well, you can read data, process data, and build machine
    learning (ML) models on the processed data. But what if my first ML model does
    not perform well? Can I fine-tune my model? The answer is yes; you can do nearly
    everything using Amazon SageMaker. In this chapter, you will walk you through
    the following topics using Amazon SageMaker:


    +   - Understanding different instances of Amazon SageMaker

    +   - Cleaning and preparing data in Jupyter Notebook in Amazon SageMaker

    +   - Model training in Amazon SageMaker

    +   - Using SageMaker''s built-in ML algorithms

    +   - Writing custom training and inference code in SageMaker


    # Technical requirements


    You can download the data used in this chapter’s examples from GitHub at https://github.com/PacktPublishing/AWS-Certified-Machine-Learning-Specialty-MLS-C01-Certification-Guide-Second-Edition/tree/main/Chapter09.


    # Creating notebooks in Amazon SageMaker


    If you are working with ML, then you need to perform actions such as storing data,
    processing data, preparing data for model training, model training, and deploying
    the model for inference. They are complex, and each of these stages requires a
    machine to perform the task. With Amazon SageMaker, life becomes much easier when
    carrying out these tasks.


    # What is Amazon SageMaker?


    SageMaker provides training instances to train a model using the data and provides
    endpoint instances to infer by using the model. It also provides notebook instances
    running on the Jupyter Notebook to clean and understand the data. If you are happy
    with your cleaning process, then you'
  merge: -1
  img_proc: true
