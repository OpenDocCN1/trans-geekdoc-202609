    # Conventions Used


    There are a number of text conventions used throughout this book.


    **Code in text**: Indicates code words in text, database table names, folder names,
    filenames, file extensions, pathnames, dummy URLs, user input, and Twitter handles.
    Here is an example: “You will use the detect_labels API from Amazon Rekognition
    in the code.”


    A block of code is set as follows:


    ```

    from sagemaker.predictor import Predictor

    predictor = Predictor(endpoint_name=''your-endpoint-name'',

    sagemaker_session=sagemaker_session)

    predictor.predict(''input_data'')

    ```


    Any command-line input or output is written as follows:


    ```

    sh-4.2$ cd ~/SageMaker/ sh-4.2$ git clone https://github.com/PacktPublishing/
    AWS-Certified-Machine-Learning-Specialty-MLS-C01- Certification-Guide-Second-Edition.git

    ```


