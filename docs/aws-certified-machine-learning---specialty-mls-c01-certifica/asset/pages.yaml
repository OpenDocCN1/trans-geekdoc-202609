  md: 'feature, you will come up with 49. Sometimes, when there are outliers in the
    data, the median might be more appropriate (in this case, the median would be
    35):


    | Age | Job status |

    |---|---|

    | 35 | Employee |

    | 30 | Employee |

    | | Retired |

    | 25 | Employee |

    | 80 | Retired |

    | 75 | Retired |


    Table 4.11 – Replacing missing values with the mean or median of the group


    If you want to go deeper, you could find the mean or median value according to
    a given group of features. For example, Table 4.11 expanded the previous dataset
    from Table 4.10 by adding the Job status column. Now, there is some evidence that
    the initial approach of changing the missing value by using the overall median
    (35 years old) was likely to be wrong (since that person is retired).


    What you can do now is replace the missing value with the mean or median of the
    other observations that belong to the same job status. Using this new approach,
    you can change the missing information to 77.5. Considering that the person is
    retired, 77.5 makes more sense than 35 years old.


    # IMPORTANT NOTE


    In the case of categorical variables, you can replace the missing data with the
    value that has the highest occurrence in your dataset. The same logic of grouping
    the dataset according to specific features is still applicable.


    You can also use more sophisticated methods of imputation, including constructing
    an ML model to predict the value of your missing data. The downside of these imputation
    approaches (either by averaging or predicting the value) is that you are making
    inferences about the data that are not necessarily right and will add bias to
    the dataset.


    To sum this up, the trade-off while dealing with missing data is having a balance
    between losing data or adding bias to the dataset. Unfortunately, there is no
    scientific recipe that you can follow, whatever your problem is. To decide on
    what you are going to do, you must look at your success criteria, explore your
    data, run experiments, and then make your decisions.'
