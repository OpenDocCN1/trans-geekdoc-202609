- pgno: 82
  md: 'Lambda consumer as soon as data arrives in the Kinesis stream.


    +   - Kinesis is scalable due to its shard architecture, which is the fundamental
    throughput unit of a Kinesis stream. _What is a shard?_ A shard is a logical structure
    that partitions the data based on a partition key. A shard supports a writing
    capacity of 1 MB/sec and a reading capacity of 2 MB/sec. 1,000 `PUT` records per
    second are supported by a single shard. If you have created a stream with _three
    shards_, then 3 MB/sec write throughput and 6 MB/sec read throughput can be achieved,
    and this allows 3,000 `PUT` records. So, with more shards, you have to pay an
    extra amount to get higher performance.


    +   - The data in a shard is stored via a Kinesis data record and can be a maximum
    of 1 MB. Kinesis data records are stored across the shard based on the partition
    key. They also have a sequence number. A sequence number is assigned by Kinesis
    as soon as a `putRecord` or `putRecords` API operation is performed so as to uniquely
    identify a record. The partition key is specified by the producer while adding
    the data to the Kinesis data stream, and the partition key is responsible for
    segregating and routing the record to different shards in the stream to balance
    the load.


    +   - There are two ways to encrypt the data in a Kinesis stream: server-side
    encryption and client-side encryption. Client-side encryption makes it hard to
    implement and manage the keys because the client has to encrypt the data before
    putting it into the stream and decrypt the data after reading it from the stream.
    With server-side encryption enabled via **AWS KMS**, the data is automatically
    encrypted and decrypted as you put the data and get it from a stream.


    # NOTE


    Amazon Kinesis shouldn''t be confused with Amazon SQS. Amazon SQS supports one
    production group and one consumption group. If your use case demands multiple
    users sending data and receiving data, then Kinesis is the solution.


    For decoupling and asynchronous communications, SQS is the solution, because the
    sender and receiver do not need to be aware of one another.


    In SQS, there is no concept of persistence. Once the message is read, the next
    step is deletion. There''s no concept of a retention time window for Amazon SQS.
    If your use case demands large-scale ingestion, then Kinesis should be used.


    In the next section, you will learn about storing the streamed data for further
    analysis.


    # Storing and transforming real-time data using Kinesis Data Firehose


    There are a lot of use cases that require data to be streamed and stored for future
    analytics purposes. To overcome such problems, you can write a Kinesis consumer
    to read the Kinesis stream and store the data in S3. This solution needs an instance
    or a machine to run the code with the required access to read from the stream
    and write to S3. The other possible option would be to run a Lambda function that
    gets triggered on the `putRecord` or `putRecords` API made to the stream and reads
    the data from the stream to store in the S3 bucket:


    +   - To make this easy, Amazon provides a separate service called Kinesis Data
    Firehose. This can easily be plugged into a Kinesis data stream and will require
    essential IAM roles to write data into S3. It is a fully managed service to reduce
    the load of managing servers and code. It also supports loading the streamed data
    into Amazon Redshift, Elasticsearch, and Splunk. Kinesis Data Firehose scales
    automatically to match the throughput of the data.


    +   - Data can be transformed via an AWS Lambda function before storing or delivering
    it to the destination. If you want to build a raw data lake with the untransformed
    data, then by enabling source record backup, you can store it in another S3 bucket
    prior to the'
