    4. To validate the file upload operation via the AWS console, please log in to
    your AWS account and go to the AWS S3 console to see the same. The AWS S3 console
    lists the result as shown in Figure 2.2. The console may have changed by the time
    you are reading this book!


    ![](img/87c29232224b00f5a8bba6a66a391700_49_0.png)


    # Figure 2.2 – AWS S3 listing your files


    You can also list the files in your S3 bucket from the command line, as shown
