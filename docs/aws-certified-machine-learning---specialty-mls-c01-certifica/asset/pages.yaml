- pgno: 113
  md: 'You will now move to another headache for many ML algorithms: outliers.


    # # Dealing with outliers


    You are not on this studying journey just to pass the AWS Machine Learning Specialty
    exam but also to become a better data scientist. There are many different ways
    to look at the outlier problem purely from a mathematical perspective; however,
    the datasets used in real life are derived from the underlying business process,
    so you must include a business perspective during an outlier analysis.


    An outlier is an atypical data point in a set of data. For example, Figure 4.8
    shows some data points that have been plotted in a two-dimension plan; that is,
    x and y. The red point is an outlier since it is an atypical value in this series
    of data.


    ![](img/87c29232224b00f5a8bba6a66a391700_113_0.png)


    Figure 4.8 – Identifying an outlier


    It is important to treat outlier values because some statistical methods are impacted
    by them. Still, in Figure 4.8, you can see this behavior in action. On the left-hand
    side, there has been drawn a line that best fits those data points, ignoring the
    red point. On the right-hand side, the same line was drawn, but including the
    red point.


    You can visually conclude that, by ignoring the outlier point, you will come up
    with a better solution on the plan of the left-hand side of the preceding chart
    since it was able to pass closer to most of the values. You can also prove this
    by computing an associated error for each line (which you will learn later in
    this book).


    It is worth reminding that you have also seen the outlier issue in action in another
    situation in this book: specifically, in Table 4.10, while dealing with missing
    values. In that example, the median was used to work around the problem. Feel
    free to go back and read it again, but what should be very clear at this point
    is that median values are less impacted by outliers than average (mean) values.


    You now know what outliers are and why you should treat them. You should always
    consider your business perspective while dealing with outliers, but there are
    mathematical methods to find them.'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'Now, you are ready to move on and look at some methods for outlier detection.


    You have already learned about the most common method: zscore. In Table 4.7, you
    saw a table containing a set of ages. Refer to it again to refresh your memory.
    In the last column of that table, it was computed the zscore of each age, according
    to the equation shown in Figure 4.4.


    There is no well-defined range for those zscore values; however, in a normal distribution
    without outliers, they will mostly range between -3 and 3. Remember: zscore will
    give you the number of standard deviations from the mean of the distribution.
    Table 4.10 shows some of the properties of a normal distribution:


    ![](img/87c29232224b00f5a8bba6a66a391700_114_0.png)


    Figure 4.9 – Normal distribution properties. Image adapted from https://pt.wikipedia.org/wiki/Ficheiro:The_Normal_Distribution.svg


    According to the normal distribution properties, 95% of values will belong to
    the range of -2 and 2 standard deviations from the mean, while 99% of the values
    will belong to the range of -3 and 3. Coming back to the outlier detection context,
    you can set thresholds on top of those zscore values to specify whether a data
    point is an outlier or not!


    There is no standard threshold that you can use to classify outliers. Ideally,
    you should look at your data and see what makes more sense for you... usually
    (this is not a rule), you will use some number between 2 and 3 standard deviations
    from the mean to flag outliers, since less than 5% of your data will be selected
    by this rule (again, this is just a reference threshold, so that you can select
    some data from further scrutinizing). You may remember that there are outliers
    below and above the mean value'
