  md: 'instance.


    # Managing failover in Amazon RDS


    RDS instances can be **Single-AZ** or **Multi-AZ**. In Multi-AZ, multiple instances
    work together, similar to an active-passive failover design.


    For a Single-AZ RDS instance, storage can be allocated for that instance to use.
    In a nutshell, a Single-AZ RDS instance has one attached block store (EBS storage)
    available in the same Availability Zone. This makes the databases and the storage
    of the RDS instance vulnerable to Availability Zone failure. The storage allocated
    to the block storage can be SSD (gp2 or io1) or magnetic. To secure the RDS instance,
    it is advised to use a security group and provide access based on requirements.


    Multi-AZ is always the best way to design the architecture to prevent failures
    and keep the applications highly available. With Multi-AZ features, a standby
    replica is kept in sync synchronously with the primary instance. The standby instance
    has its own storage in the assigned Availability Zone. A standby replica cannot
    be accessed directly, because all RDS access is via a single database DNS endpoint
    (CNAME). You can’t access the standby unless a failover happens. The standby provides
    no performance benefit, but it does constitute an improvement in terms of the
    availability of the RDS instance. It can only happen in the same Region, another
    AZ’s subnet in the same Region inside the VPC. When a Multi-AZ RDS instance is
    online, you can take a backup from the standby replica without affecting the performance.
    In a Single-AZ instance, availability and performance issues can be significant
    during backup operation.


    To understand the workings of Multi-AZ, let’s take an example of a Single-AZ instance
    and expand it to Multi-AZ.


    Imagine you have an RDS instance running in Availability Zone AZ-A of the us-east-1
    Region inside a VPC named db-vpc. This becomes a primary instance in a Single-AZ
    design of an RDS instance. In this case, there will be storage allocated to the
    instance in the AZ-A Availability Zone. Once you opt for Multi-AZ deployment in
    another Availability Zone called AZ-B, AWS creates a standby instance in Availability
    Zone AZ-B of the us-east-1 Region inside the db-vpc VPC and allocates storage
    for the standby instance in AZ-B of the us-east-1 Region. Along with that, RDS
    will enable **synchronous replication** from the primary instance to the standby
    replica. As you learned earlier, the only way to access our RDS instance is via
    the database CNAME, hence, the access request goes to the RDS primary instance.
    As soon as a write request comes to the endpoint, it writes to the primary instance.
    Then it writes the data to the hardware, which is the block storage attached to
    the primary instance.'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'At the same time, the primary instance replicates the same data to the standby
    instance. Finally, the standby instance commits the data to its block storage.


    The primary instance writes the data into the hardware and replicates the data
    to the standby instance in parallel, so there is a minimal time lag (almost nothing)
    between the data commit operations in their respective hardware. If an error occurs
    with the primary instance, then RDS detects this and changes the database endpoint
    to the standby instance. The clients accessing the database may experience a very
    short interruption with this. This failover occurs within 60-120 seconds. It does
    not provide a fault-tolerant system because there will be some impact during the
    failover operation.


    You should now understand failover management on Amazon RDS. Let’s now learn about
    taking automatic RDS backups and using snapshots to restore in the event of a
    failure, and read replicas in the next section.


    # Taking automatic backups, RDS snapshots, and restore and read replicas


    In this section, you will see how RDS automatic backups and manual snapshots work.
    These features come with Amazon RDS.


    Let’s consider a database that is scheduled to take a backup at 5 A.M. every day.
    If the application fails at 11 A.M., then it is possible to restart the application
    from the backup taken at 11 A.M. with the loss of 6 hours’ worth of data. This
    is called a 6-hour Recovery Point Objective (RPO). The RPO is defined as the time
    between the most recent backup and the incident, and this determines the amount
    of data loss. If you want to reduce this, then you have to schedule more incremental
    backups, which increases the cost and backup frequency. If your business demands
    a lower RPO value, then the business must spend more to provide the necessary
    technical solutions.


    Now, according to our example, an engineer was assigned the task of bringing the
    system back online as soon as the disaster occurred. The engineer managed to bring
    the database online at 2 P.M. on the same day by adding a few extra hardware components
    to the current system and installing some updated versions of the software. This
    is called a 3-hour Recovery Time Objective (RTO). The RTO is determined as the
    time between the disaster recovery and full recovery. RTO values can be reduced
    by having spare hardware and documenting the restoration process. If the business
    demands a lower RTO value, then your business must spend more money on spare hardware
    and an effective system setup to perform the restoration process.


    In RDS, the RPO and RTO play an important role in the selection of automatic backups
    and manual snapshots. Both of these backup services use AWS-managed S3 buckets,
    which means they cannot be'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'visible in the user''s AWS S3 console. They areRegion-resilient because the
    backup is replicated into multiple Availability Zones in the AWS Region. In the
    case of a Single-AZ RDS instance, the backup happens from the single available
    data store, and for a Multi-AZ enabled RDS instance, the backup happens from the
    standby data store (the primary store remains untouched as regards the backup).


    The snapshots are manual for RDS instances, and they are stored in the AWS-managed
    S3 bucket. The first snapshot of an RDS instance is a full copy of the data and
    the onward snapshots are incremental, reflecting the change in the data. In terms
    of the time taken for the snapshot process, it is high for the first one and,
    from then on, the incremental backup is quicker. When any snapshot occurs, it
    can impact the performance of the Single-AZ RDS instance, but not the performance
    of a Multi-AZ RDS instance as this happens on the standby data storage. Manual
    snapshots do not expire, have to be cleared automatically, and live past the termination
    of an RDS instance. When you delete an RDS instance, it suggests making one final
    snapshot on your behalf and it will contain all the databases inside your RDS
    instance (there is not just a single database in an RDS instance). When you restore
    from a manual snapshot, you restore to a single point in time, and that affects
    the RPO.


    To automate this entire process, you can choose a time window when these snapshots
    can be taken. This is called an automatic backup. These time windows can be managed
    carefully to essentially lower the RPO value of the business. Automatic backups
    have a retention period of 0 to 35 days, with 0 being disabled and the maximum
    is 35 days. To quote AWS documentation, retained automated backups contain system
    snapshots and transaction logs from a database instance. They also include database
    instance properties such as allocated storage and a database instance class, which
    are required to restore it to an active instance. Databases generate transaction
    logs, which contain the actual change in data in a particular database. These
    transaction logs are also written to S3 every 5 minutes by RDS. Transaction logs
    can also be replayed on top of the snapshots to restore to a point in time of
    5 minutes'' granularity. Theoretically, the RPO can be a 5-minute point in time.


    When you perform a restore, RDS creates a new RDS instance, which means a new
    database endpoint to access the instance. The applications using the instances
    have to point to the new address, which significantly affects the RTO. This means
    that the restoration process is not very fast, which affects the RTO. To minimize
    the RTO during a failure, you may consider replicating the data. With replicas,
    there is a high chance of replicating the corrupted data. The only way to overcome
    this is to have snapshots and restore an RDS instance to a particular point in
    time prior to the corruption.


    Amazon RDS Read Replicas are unlike the Multi-AZ replicas. In Multi-AZ RDS instances,
    the standby replicas cannot be used directly for anything unless a primary instance
    fails, whereas Read Replicas can be used directly, but only for read operations.
    Read replicas have their own database endpoints and read-heavy applications can
    directly point to this address. They are kept in sync asynchronously with the
    primary instance. Read Replicas can be created in the same Region as the'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'primary instance or in a different Region. Read Replicas in other Regions are
    called Cross-Region Read Replicas and this improves the global performance of
    the application.


    As per AWS documentation, five direct Read Replicas are allowed per database instance
    and this helps to scale out the read performances. Read Replicas have a very low
    RPO value due to asynchronous replication. They can be promoted to a read-write
    database instance in the case of a primary instance failure. This can be done
    quickly and it offers a fairly low RTO value.


    In the next section, you will learn about Amazon’s database engine, Amazon Aurora.


    # Writing to Amazon Aurora with multi-master capabilities


    Amazon Aurora is the most reliable relational database engine developed by Amazon
    to deliver speed in a simple and cost-effective manner. Aurora uses a cluster
    of single primary instances and zero or more replicas. Aurora’s replicas can give
    you the advantage of both read replicas and Multi-AZ instances in RDS. Aurora
    uses a shared cluster volume for storage and is available to all compute instances
    of the cluster (a maximum of 64 TiB). This allows the Aurora cluster to provision
    faster and improves availability and performance. Aurora uses SSD-based storage,
    which provides high IOPS and low latency. Aurora does not ask you to allocate
    storage, unlike other RDS instances; it is based on the storage that you use.


    Aurora clusters have multiple endpoints, including the cluster endpoint and reader
    endpoint. If there are zero replicas, then the cluster endpoint is the same as
    the reader endpoint. If there are replicas available, then the reader endpoint
    is load-balanced across the reader endpoints. Cluster endpoints are used for reading/writing,
    while reader endpoints are intended for reading from the cluster. If you add more
    replicas, then AWS manages load balancing under the hood for the new replicas.


    When failover occurs, the replicas are promoted to read/write mode, and this takes
    some time. This can be prevented in a Multi-Master mode of an Aurora cluster.
    This allows multiple instances to perform reads and writes at the same time.


    # Storing columnar data on Amazon Redshift


    Amazon Redshift is not used for real-time transactions, but it is used for data
    warehouse purposes. It is designed to support huge volumes of data at a petabyte
    scale. It is a column-based database used for analytics, long-term processing,
    tending, and aggregation. Redshift Spectrum can be used to query data on S3 without
    loading data to the Redshift cluster (a Redshift cluster is required, though).'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'It''s not an OLTP, but an OLAP. AWS QuickSight can be integrated with Redshift
    for visualization, with a SQL–like interface that allows you to connect using
    JDBC/ODBC connections to query the data.


    Redshift uses a clustered architecture in one AZ in a VPC with faster network
    connectivity between the nodes. It is not high availability by design as it is
    tightly coupled to the AZ. A Redshift cluster has a leader node, and this node
    is responsible for all the communication between the client and the computing
    nodes of the cluster, query planning, and aggregation. Compute nodes are responsible
    for running the queries submitted by the leader lode and for storing the data.
    By default, Redshift uses a public network for communicating with external services
    or any AWS services. With enhanced VPC routing, it can be controlled via customized
    networking settings.


    By combining Redshift with SageMaker, data scientists and analysts can leverage
    the scalability and computational power of Redshift to preprocess and transform
    data before training machine learning models. They can utilize Redshift’s advanced
    SQL capabilities to perform aggregations, joins, and filtering operations, enabling
    efficient feature engineering and data preparation. The processed data can then
    be seamlessly fed into SageMaker for model training, hyperparameter tuning, and
    evaluation.


    # Amazon DynamoDB for NoSQL Database-as-a-Service


    Amazon DynamoDB is a NoSQL database-as-a-service product within AWS. It’s a fully
    managed key/value and document database. Accessing DynamoDB is easy via its endpoint.
    The input and output throughputs can be managed or scaled manually or automatically.
    It also supports data backup, point-in-time recovery, and data encryption.


    One example where Amazon DynamoDB can be used with Amazon SageMaker in a cost-efficient
    way is for real-time prediction applications. DynamoDB can serve as a storage
    backend for storing and retrieving input data for prediction models built using
    SageMaker. Instead of continuously running and scaling an inference endpoint,
    which can be costlier, you can leverage DynamoDB’s low-latency access and scalability
    to retrieve the required input data on demand.


    In this setup, the input data for predictions can be stored in DynamoDB tables,
    where each item represents a unique data instance. When a prediction request is
    received, the application can use DynamoDB’s efficient querying capabilities to
    retrieve the required input data item(s) based on specific attributes or conditions.
    Once the data is retrieved, it can be passed to the SageMaker endpoint for real-time
    predictions.'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'By using DynamoDB in this way, you can dynamically scale your application’s
    read capacity based on the incoming prediction requests, ensuring that you only
    pay for the read capacity you actually need. This approach offers a cost-efficient
    solution as it eliminates the need for running and managing a continuously running
    inference endpoint, which may incur high costs even during periods of low prediction
    demand. With DynamoDB and SageMaker working together, you can achieve scalable
    and cost-efficient real-time prediction applications while maintaining low latency
    and high availability.


    You will not cover the DynamoDB table structure or key structure in this chapter
    as this is not required for the certification exam. However, it is good to have
    a basic knowledge of them. For more details, please refer to the AWS docs available
    here: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/SQLtoNoSQL.html.


