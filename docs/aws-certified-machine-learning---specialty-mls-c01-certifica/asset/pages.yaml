- pgno: 153
  md: 'AWS provides supervised learning algorithms for general purposes (regression
    and classification tasks) and more specific purposes (forecasting and vectorization).
    The list of built-in algorithms that can be found in these sub-categories is as
    follows:


    +   - Linear learner algorithm

    +   - Factorization machines algorithm

    +   - XGBoost algorithm

    +   - KNN algorithm

    +   - Object2Vec algorithm

    +   - DeepAR forecasting algorithm


    You will start by learning about regression models and the linear learner algorithm.


    # Working with regression models


    Looking at linear regression models is a nice way to understand what is going
    on inside regression models in general (linear and non-linear regression models).
    This is mandatory knowledge for every data scientist and can help you solve real
    challenges as well. You will now take a closer look at this in the following subsections.


    # Introducing regression algorithms


    Linear regression models aim to predict a numeric value (y) according to one or
    more variables (x). Mathematically, such a relationship can be defined as y =
    f(x), where y is known as the dependent variable and x is known as the independent
    variable.


    With regression models, the component that you want to predict (y) is always a
    continuous number – for example, the price of houses or the number of transactions.
    You saw this in Chapter 1, Machine Learning Fundamentals, in Figure 1.2, when
    you were learning about the right type of supervised learning algorithm, given
    the target variable. Please feel free to go back and review it.


    When you use just one variable to predict y, this problem is referred to as simple
    linear regression. On the other hand, when you use more than one variable to predict
    y, you have a multiple linear regression problem.


    There is also another class of regression models, known as non-linear regression.
    However, let us put that aside for a moment and understand what simple linear
    regression means.


    Regression models belong to the supervised side of machine learning (the other
    side is non-supervised) because algorithms try to predict values according to
    existing correlations between independent and dependent variables.


    But what does f mean in y=f(x)? Here, f is the regression function responsible
    for predicting y based on x. In other words, this is the function that you want
    to find. When talking about simple linear regression, pay attention to the next
    three questions and answers:


    +   - What is the shape of f in linear regression?

    +     Linear, of course!

    +   - How can you represent a linear relationship?

    +     Using a straight line (you will understand why in a few minutes).'
  merge: -1
  img_proc: true
- pgno: 154
  md: '+   - So what is the function that defines a line?

    +   ax + b (just check any mathematics book).


    That is it! Linear regression models are given by y = ax + b. When you are trying
    to predict y given x, you just need to find out the values of a and b. You can
    adopt the same logic to figure out what is going on inside other kinds of regression.


    Finding out the values of a and b is the only thing you are going to do. It is
    nice to know that a is also known as the alpha coefficient, or slope, and represents
    the line’s inclination, while b is also known as the beta coefficient, or y intercept,
    and represents the place where the line crosses the y axis (into a two-dimensional
    plane consisting of x and y). You will learn about these two terms in a later
    subsection.


    It is also nice to know that there is a bias (e) associated with every predictor
    that you do not have control over. That being said, the formal definition of simple
    linear regression is given by y = ax + b + e.


    In the next subsection, you will learn how to find alpha and beta to solve a simple
    linear regression problem.


    # Least squares method


    There are different ways to find the slope and y intercept of a line, but the
    most used method is known as the least squares method. The principle behind this
    method is simple: you have to find the best line that reduces the sum of squared
    error.


    In Figure 6.1, you can see a Cartesian plane with multiple points and lines in
    it. Line a represents the best fit for this data – in other words, that would
    be the best linear regression function for those points. But how can you know
    that? It is simple: if you compute the error associated with each point, you will
    realize that Line a contains the least sum of squared errors.


    ![](img/87c29232224b00f5a8bba6a66a391700_154_0.png)


    Figure 6.1 – Visualizing the principle of the least squares method


    It is worth understanding linear regression from scratch not only for the certification
    exam but also for your career as a data scientist. To provide you with a complete
    example, a spreadsheet containing all the calculations that you are going to see
    has been developed! You are encouraged to jump on this support material and perform
    some simulations. In any case, you will see these calculations in action in the
    next subsection.'
  merge: -1
  img_proc: true
- pgno: 155
  md: '# Creating a linear regression model from scratch


    You are going to use a very simple dataset, with only two variables:


    +   * x: Represents the person''s number of years of work experience

    +   * y: Represents the person''s average salary


    You want to understand the relationship between x and y and, if possible, predict
    the salary (y) based on years of experience (x). Real problems very often have
    far more independent variables and are not necessarily linear. However, this example
    will give you the baseline knowledge to master more complex algorithms.


    To find out what the alpha and beta coefficients are (or slope and y intercept
    if you prefer), you need to find some statistics related to the dataset. In Table
    6.3, you have the data and these auxiliary statistics.


    | X (INDEPENDENT) | Y (DEPENDENT) | X MEAN | Y MEAN | COVARIANCE (X,Y) | X VARIANCE
    | Y VARIANCE |

    |---|---|---|---|---|---|---|

    | 1 | 1.000 | | | 21.015 | 20 | 21.808.900 |

    | 2 | 1.500 | | | 14.595 | 12 | 17.388.900 |

    | 3 | 3.700 | | | 4.925 | 6 | 3.880.900 |

    | 4 | 5.000 | | | 1.005 | 2 | 448.900 |

    | 5 | 4.000 | | | 835 | 0 | 2.788.900 |

    | 6 | 6.500 | | | 415 | 0 | 688.900 |

    | 7 | 7.000 | | | 1.995 | 2 | 1.768.900 |

    | 8 | 9.000 | | | 8.325 | 6 | 11.088.900 |

    | 9 | 9.000 | | | 11.655 | 12 | 11.088.900 |

    | 10 | 10.000 | | | 19.485 | 20 | 18.748.900 |

    | COUNT | 10 | 5,50 | 5.670,00 | 8.425,00 | 8,25 | 8.970.100,00 |


    Table 6.3 – Dataset to predict average salary based on the amount of work experience


    As you can see, there is an almost perfect linear relationship between x and y.
    As the amount of work experience increases, so does the salary. In addition to
    x and y, you need to compute the following statistics: the number of records,
    the mean of x, the mean of y, the covariance of x and y, the variance of x, and
    the variance of y. Figure 6.2 depicts formulas that provide a mathematical representation
    of variance and covariance (respectively), where x bar, y bar, and n represent
    the mean of x, the mean of y, and the number of records, respectively:'
  merge: -1
  img_proc: true
- pgno: 156
  md: '![](img/87c29232224b00f5a8bba6a66a391700_156_0.png)


    Figure 6.2 – Mathematical representation of variance and covariance respectively


    If you want to check the calculation details of the formulas for each of those
    auxiliary statistics in Table 6.2, please refer to the support material provided
    along with this book. There, you will find these formulas already implemented
    for you.


    These statistics are important because they will be used to compute the alpha
    and beta coefficients. Figure 6.3 explains how you can compute both coefficients,
    along with the correlation coefficients R and R squared. These last two metrics
    will give you an idea about the quality of the model, where the closer they are
    to 1, the better the model is.


    | Term | Equation |

    | :--- | :--- |

    | Line inclination | Angular coefficient (A, Alpha) | A = cov (x, y) / var (x)
    |

    | Interceptor (B, Beta) | B = mean Y - (Alpha * mean X) |

    | Correlation coefficient R | R = cov (x, y) / sqrt (variance x * variance y)
    |

    | Adjusted Correlation coefficient (R adjusted) | R adjusted = R ^ 2 |

    | Error (variability not explained) | Ei = Yi – yi |

    | Equation | Y = A.X + B + Ei |


    Figure 6.3 – Equations to calculate coefficients for simple linear regression'
  merge: -1
  img_proc: true
