- pgno: 160
  md: 'model.


    You have already heard about parsimony in Chapter 1, Machine Learning Fundamentals.
    This is the ability to prioritize simple models over complex ones. Looking into
    regression models, you might have to use more than one feature to predict your
    outcome. This is also known as a multiple regression model.


    When that is the case, the R and R squared coefficients tend to reward more complex
    models with more features. In other words, if you keep adding new features to
    a multiple regression model, you will come up with higher R and R squared coefficients.
    That is why you cannot anchor your decisions only based on those two metrics.


    Another additional metric that you could use (apart from R, R squared, MSE, and
    RMSE) is known as adjusted R squared. This metric is penalized when you add extra
    features to the model that do not bring any real value. In Table 6.6, you can
    see when a model is starting to lose parsimony.


    | Number of features | R squared | Adjusted R squared |

    |---|---|---|

    | 1 | 81 | 79 |

    | 2 | 83 | 82 |

    | 3 | 88 | 87 |

    | 4 | 90 | 86 |

    | 5 | 92 | 85 |


    Table 6.6 – Comparing R squared and adjusted R squared


    Here, you can conclude that maintaining three variables in the model is better
    than maintaining four or five. Adding four or five variables to the model will
    increase the R squared (as expected), but decrease the adjusted R squared.


    At this point, you should have a very good understanding of regression models.
    Now, let us check what AWS offers in terms of built-in algorithms for this class
    of models.


    # Regression modeling on AWS


    AWS has a built-in algorithm known as linear learner, where you can implement
    linear regression models. The built-in linear learner uses Stochastic Gradient
    Descent (SGD) to train the model.


    # IMPORTANT NOTE


    You will learn more about SGD when neural networks are discussed. For now, you
    can look at SGD as an alternative to the popular least squares error method that
    was just discussed.


    The linear learner built-in algorithm provides a hyperparameter that can apply
    normalization to the data, prior to the training process. The name of this hyperparameter
    is normalize_data. This is very helpful since linear models are sensitive to the
    scale of the data and usually take advantage of data normalization.


    # IMPORTANT NOTE


    Data normalization was discussed in Chapter 4, Data Preparation and Transformation.
    Please review that chapter if you need to.'
  merge: -1
  img_proc: true
- pgno: 161
  md: 'Some other important hyperparameters of the linear learner algorithm are L1
    and wd, which play the roles of L1 regularization and L2 regularization, respectively.


    L1 and L2 regularization help the linear learner (or any other regression algorithm
    implementation) to avoid overfitting. Conventionally, regression models that implement
    L1 regularization are called lasso regression models, while regression models
    with L2 regularization are called ridge regression models.


    Although it might sound complex, it is not! The regression model equation is still
    the same: y = ax + b + e. The change is in the loss function, which is used to
    find the coefficients that best minimize the error. If you look back at Figure
    6.1, you will see that the error function is defined as e = (ŷ - y)^2, where ŷ
    is the regression function value and y is the real value.


    L1 and L2 regularization add a penalty term to the loss function, as shown in
    the formulas in Figure 6.6 (note that you are replacing ŷ with ax + b):


    ```

    $L_1 = (ax + b - y)^2 + \lambda|a|$


    $L_2 = (ax + b - y)^2 + \lambda a^2$

    ```


    Figure 6.6 – L1 and L2 regularization


    The λ (lambda) parameter must be greater than 0 and manually tuned. A very high
    lambda value may result in an underfitting issue, while a very low lambda may
    not result in expressive changes in the end results (if your model is overfitted,
    it will stay overfitted).


    In practical terms, the main difference between L1 and L2 regularization is that
    L1 will shrink the less important coefficients to 0, which will force the feature
    to be dropped (acting as a feature selector). In other words, if your model is
    overfitting because of the high number of features, L1 regularization should help
    you solve this problem.


    # IMPORTANT NOTE


    *During your exam, remember the basis of L1 and L2 regularization, especially
    the key difference between them, where L1 works well as a feature selector.*


    Finally, many built-in algorithms can serve multiple modeling purposes. The linear
    learner algorithm can be used for regression, binary classification, and multi-classification.
    Make sure you remember this during your exam (it is *not* just about regression
    models).


    AWS has other built-in algorithms that work for regression and classification
    problems – that is, **factorization machines**, **KNN**, and the **XGBoost** algorithm.
    Since these algorithms can also be used for classification purposes, these will
    be covered in the section about classification algorithms.


    # IMPORTANT NOTE


    *You''ve just been given a very important tip to remember during the exam: linear
    learner, factorization machines, KNN, and XGBoost are suitable for both regression
    and classification problems. These algorithms are often known as algorithms for
    general purposes.*


    With that, you have reached the end of this section about regression models. Remember
    to check out the supporting material before you take the exam. You can also use
    the reference material when you are working on your daily activities! Now, let
    us move on to another classical example of a machine learning problem: classification
    models.'
  merge: -1
  img_proc: true
- pgno: 162
  md: '# Working with classification models


    You have been learning what classification models are throughout this book. However,
    now, you are going to look at some algorithms that are suitable for classification
    problems. Keep in mind that there are hundreds of classification algorithms out
    there, but since you are preparing for the AWS Certified Machine Learning Specialty
    exam, the ones that have been pre-built by AWS will be covered.


    You will start with **factorization machines**. Factorization machines is considered
    an extension of the linear learner algorithm, optimized to find the relationship
    between features within high-dimensional sparse datasets.


    # IMPORTANT NOTE


    > A very traditional use case for factorization machines is recommendation systems,
    where you usually have a high level of sparsity in the data. During the exam,
    if you are faced with a general-purpose problem (either a regression or binary
    classification task) where the underlying datasets are sparse, then factorization
    machines is probably the best answer from an algorithm perspective.


    When you use factorization machines in a regression model, the RMSE will be used
    to evaluate the model. On the other hand, in the binary classification mode, the
    algorithm will use log loss, accuracy, and F1 score to evaluate results. A deeper
    discussion about evaluation metrics will be provided in _Chapter 7, Evaluating
    and Optimizing Models_.


    You should be aware that factorization machines only accepts input data in the
    **recordIO-protobuf** format. This is because of the data sparsity characteristic,
    in which recordIO-protobuf is supposed to do a better job on data processing compared
    to **text/.csv** format.


    The next built-in algorithm suitable for classification problems is known as K-nearest
    neighbors, or KNN for short. As the name suggests, this algorithm will try to
    find the _K_ closest points to the input data and return either of the following
    predictions:


    +   * The most repeated class of the _K_ closest points, if it is a classification
    task

    +   * The average value of the label of the _K_ closest points, if it is a regression
    task


    KNN is an **index-based algorithm** because it computes distances between points,
    assigns indexes for these points, and then stores the sorted distances and their
    indexes. With that type of data structure, KNN can easily select the top _K_ closest
    points to make the final prediction. Note that _K_ is a hyperparameter of KNN
    and should be optimized during the modeling process.


    The other AWS built-in algorithm available for general purposes, including classification,
    is known as **eXtreme Gradient Boosting**, or **XGBoost** for short. This is an
    ensemble, decision tree-based model.


    XGBoost uses a set of **weaker** models (decision trees) to predict the target
    variable, which can be a regression task, binary class, or multi-class. This is
    a very popular algorithm and has been used in machine learning competitions by
    the top performers.


    XGBoost uses a boosting learning strategy, in which one model tries to correct
    the error of the prior model. It carries the name “gradient” because it uses the
    gradient descent algorithm to minimize the loss when adding new trees.


    # IMPORTANT NOTE


    > The term **weaker** is used in this context to describe very simple decision
    trees.'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'Although XGBoost is much more robust than a single decision tree, it is important
    to go into the exam with a clear understanding of what decision trees are and
    their main configurations. By the way, they are the base model of many ensemble
    algorithms, such as AdaBoost, Random Forest, gradient boost, and XGBoost.


    Decision trees are rule-based algorithms that organize decisions in the form of
    a tree, as shown in Figure 6.7.


    ![](img/87c29232224b00f5a8bba6a66a391700_163_0.png)


    Figure 6.7 – Example of what a decision tree model looks like


    They are formed by a root node (at the very top of the tree), intermediary or
    decision nodes (in the middle of the tree), and leaf nodes (bottom nodes with
    no splits). The depth of the tree is given by the difference between the root
    node and the very last leaf node. For example, in Figure 6.7, the depth of the
    tree is 3.


    The depth of the tree is one of the most important hyperparameters of this type
    of model and it is often known as the **max depth**. In other words, the max depth
    controls the maximum depth that a decision tree can reach.


    Another very important hyperparameter of decision tree models is the minimum number
    of samples/observations in the leaf nodes. It is also used to control the growth
    of the tree.


    Decision trees have many other types of hyperparameters, but these two are especially
    important for controlling how the model overfits. Decision trees with a high depth
    or a very small number of observations in the leaf nodes are likely to face issues
    during extrapolation/prediction.


    The reason for this is simple: decision trees use data from the leaf nodes to
    make predictions, based on the proportion (for classification tasks) or average
    value (for regression tasks) of each observation/target variable that belongs
    to that node. Thus, the node should have enough data to make good predictions
    outside the training set.


    If you encounter the term **CART** during the exam, you should know that it stands
    for **Classification and Regression Trees**, since decision trees can be used
    for classification and regression tasks.


    To select the best variables to split the data in the tree, the model will choose
    the ones that maximize the separation of the target variables across the nodes.
    This task can be performed by different methods, such as **Gini** and **information
    gain**.


    # Forecasting models'
  merge: -1
  img_proc: true
- pgno: 164
  md: 'Time series refers to data points that are collected on a regular basis with
    a sequence dependency. Time series have a measure, a fact, and a time unit, as
    shown in Figure 6.8.


    ![](img/87c29232224b00f5a8bba6a66a391700_164_0.png)


    Figure 6.8 – Time series statement


    Additionally, time series can be classified as univariate or multivariate. A univariate
    time series contains just one variable connected across a period of time, while
    a multivariate time series contains two or more variables connected across a period.
    Figure 6.9 shows the univariate time series.


    # Number of approved proposals per day


    ![](img/87c29232224b00f5a8bba6a66a391700_164_1.png)


    Figure 6.9 – Time series example


    Time series can be decomposed as follows:


    +   - Observed or level: The average values of the series

    +   - Trend: Increasing, decreasing pattern (sometimes, there is no trend)

    +   - Seasonality: Regular peaks at specific periods of time (sometimes, there
    is no seasonality)

    +   - Noise: Something that cannot be explained


    Sometimes, you can also find isolated peaks in the series that cannot be captured
    in a forecasting model. In such cases, you might want to consider those peaks
    as outliers. Figure 6.10 is a decomposition of the time series shown in Figure
    6.9.'
  merge: -1
  img_proc: true
- pgno: 165
  md: '![](img/87c29232224b00f5a8bba6a66a391700_165_0.png)


    Figure 6.10 – Time series decomposition


    It is also worth highlighting that you can use additive or multiplicative approaches
    to decompose time series.


    Additive models suggest that your time series adds each component to explain the
    target variable – that is, y(t) = level + trend + seasonality + noise.


    Multiplicative models, on the other hand, suggest that your time series multiplies
    each component to explain the target variable – that is, y(t) = level * trend
    * seasonality * noise.


    In the next section, you will take a closer look at time series components.


    # Checking the stationarity of time series


    Decomposing time series and understanding how their components interact with additive
    and multiplicative models is a great achievement! However, the more you learn,
    the more you want to go deeper into the problem. Maybe you have realized that
    time series without trend and seasonality are easier to predict than the ones
    with all those components!


    That is naturally right. If you do not have to understand trend and seasonality,
    and if you do not have control over the noise, all you have to do is explore the
    observed values and find their regression relationship.


    A time series with constant mean and variance across a time period is known as
    stationary. In general, time series with trend and seasonality are not stationary.
    It is possible to apply data transformations to the series to transform it into
    a stationary time series so that the modeling task tends to be easier. This type
    of transformation is known as differentiation.


    While you are exploring a time series, you can check stationarity by applying
    hypothesis tests, such as Dickey-Fuller, KPSS, and Phillips-Perron, just to mention
    a few. If you find it non-stationary, then you can apply differentiation to make
    it a stationary time series. Some algorithms already have that capability embedded.


    # Exploring, exploring, and exploring'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'At this point, it is important to remember that exploration tasks happen all
    the time in data science. Nothing is different here. While you are building time
    series models, you might want to take a look at the data and check whether it
    is suitable for this type of modeling.


    Autocorrelation plots are one of the tools that you can use for time series analysis.
    Autocorrelation plots allow you to check the correlations between lags in the
    time series. Figure 6.11 shows an example of this type of visualization.


    ![](img/87c29232224b00f5a8bba6a66a391700_166_0.png)


    Figure 6.11 – Autocorrelation plot


    Remember, if you are playing with univariate time series, your time series just
