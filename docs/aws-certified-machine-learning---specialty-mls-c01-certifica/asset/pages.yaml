    # Clustering


    Clustering algorithms are very popular in data science. Basically, they aim to
    identify similar groups in a given dataset, also known as clusters. Clustering
    algorithms belong to the field of non-supervised learning, which means that they
    do not need a label or response variable to be trained.


    This is just fantastic since labeled data is very scarce! However, it comes with
    some limitations. The main one is that clustering algorithms provide clusters
    for you, but not the meaning of each cluster. Thus, someone, as a subject matter
    expert, has to analyze the properties of each cluster to define their meanings.


    There are many types of clustering approaches, such as hierarchical clustering
    and partitional clustering. Inside each approach, you will find several algorithms.
    However, K-Means is probably the most popular clustering algorithm, and'
