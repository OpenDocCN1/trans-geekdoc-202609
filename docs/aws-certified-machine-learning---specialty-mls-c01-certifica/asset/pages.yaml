- pgno: 304
  md: '**Flashcards** are designed to help you memorize key concepts. Here’s how to
    make the most of them:


    +   • We’ve organized all the flashcards into stacks. Think of these like an actual
    stack of cards in your hand.

    +   • You start with a full stack of cards.

    +   • When you open a card, take a few minutes to recall the answer.

    +   • Click anywhere on the card to reveal the answer (Figure 11.10).

    +   • Flip the card back and forth multiple times and memorize the card completely.

    +   • Once you feel you’ve memorized it, click the Mark as memorized button on
    the top-right corner of the card. Move on to the next card by clicking Next.

    +   • Repeat this process as you move to other cards in the stack.


    You may not be able to memorize all the cards in one go. That’s why, when you
    open the stack the next time, you’ll only see the cards you’re yet to memorize.


    Your goal is to get to an empty stack, having memorized each flashcards in that
    stack.


    ![](img/87c29232224b00f5a8bba6a66a391700_304_0.png)


