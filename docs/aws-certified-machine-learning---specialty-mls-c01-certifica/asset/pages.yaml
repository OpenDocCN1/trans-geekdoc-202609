  md: "Furthermore, to properly configure a Lambda function, you have to, at least,\
    \ write its code, set the execution role, and make sure the VPC and security group\
    \ configurations match your needs. Next, you will take a look at other configurations.\n\
    \n# # Completing your configurations and deploying a Lambda function\n\nOnce your\
    \ Lambda is created in the AWS console, you can set additional configurations\
    \ before deploying the function. One of these configurations is the event trigger.\
    \ As mentioned earlier, your Lambda function can be triggered from a variety of\
    \ services or even manually.\n\n# ## IMPORTANT NOTE\n\n> > A very common example\
    \ of a trigger is Amazon EventBridge. This is an AWS service where you can schedule\
    \ the execution of your function.\n\nDepending on the event trigger you choose,\
    \ your function will have access to different event metadata. For example, if\
    \ your function is triggered by a `PUT` event on S3 (for example, someone uploads\
    \ a file to a particular S3 bucket), then your function will receive the metadata\
    \ associated with this event – for example, the bucket name and object key. Other\
    \ types of triggers will give you different types of event metadata!\n\nYou have\
    \ access to that metadata through the event parameter that belongs to the signature\
    \ of the entry point of your function. Not clear enough? You will now look at\
    \ how your function code should be declared, as follows:\n\n```\ndef lambda_handler(event,\
    \ context) :\n    TODO\n```\n\nHere, `lambda_handler` is the method that represents\
    \ the entry point of your function. When it is triggered, this method will be\
    \ called, and it will receive the event metadata associated with the event trigger\
    \ (through the `event` parameter). That is how you have access to the information\
    \ associated with the underlying event that has triggered your function! The `event`\
    \ parameter is a JSON-like object.\n\nIf you want to test your function but do\
    \ not want to trigger it directly from the underlying event, that is no problem;\
    \ you can use **test events**. They simulate the underlying event by preparing\
    \ a JSON object that will be passed to your function.\n\n_Figure 10.2_ shows a\
    \ very intuitive example. Suppose you have created a function that is triggered\
    \ when a user uploads a file to S3, and now, you want to test your function. You\
    \ can either upload a file to S3 (which forces the trigger) or create a test event."
