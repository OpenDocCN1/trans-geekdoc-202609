- pgno: 265
  md: '+   - **Feature store**: At its core, a feature store is the storage and data
    management layer for ML features. It stands as the single source of truth, handling
    storage, retrieval, removal, tracking, sharing, discovery, and access control
    for features.

    +   - **Online store**: This is the realm of low latency and high availability,
    allowing real-time lookup of records. The online store ensures quick access to
    the latest record via the GetRecord API.

    +   - **Offline store**: When sub-second latency reads are not a priority, the
    offline store stores historical data in your Amazon S3 bucket. It''s your go-to
    for storing and serving features for exploration, model training, and batch inference.

    +   - **Feature group**: The cornerstone of Feature Store, a feature group contains
    the data and metadata crucial for ML model training or prediction. It logically
    groups features used to describe records.

    +   - **Feature**: A property serving as an input for ML model training or prediction.
    In the Feature Store API, a feature is an attribute of a record.

    +   - **Feature definition**: Comprising a name and data type (integral, string,
    or fractional), a feature definition is an integral part of a feature group.

    +   - **Record**: A collection of values for features tied to a single record
    identifier. The record identifier and event time values uniquely identify a record
    within a feature group.

    +   - **Record identifier name**: Each record within a feature group is defined
    and identified with a record identifier name. It must refer to one of the names
    of a feature defined in the feature group''s feature definitions.

    +   - **Event time**: The time when record events occur is marked with timestamps,
    which are vital for differentiating records. The online store contains the record
    corresponding to the latest event time, while the offline store contains all historic
    records.

    +   - **Ingestion**: The process of adding new records to a feature group, usually
    achieved through the PutRecord API.


