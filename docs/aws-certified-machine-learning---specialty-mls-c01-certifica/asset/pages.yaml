- pgno: 214
  md: '# # Exploring the benefits of Amazon Transcribe


    Let’s look at some of the benefits of using Amazon Transcribe:


    +   - Content redaction: Customer privacy can be ensured by instructing Amazon
    Transcribe to identify and redact personally identifiable information (PII) from
    the language transcripts. You can filter unwanted words from your transcript by
    supplying a list of unwanted words with VocabularyFilterName and VocabularyFilterMethod,
    which are provided by the StratTranscriptionJob operation. For example, in financial
    organizations, this can be used to redact a caller’s details.


    +   - Language identification: It can automatically identify the most used language
    in an audio file and generate transcriptions. If you have several audio files,
    then this service will help you classify them by language.


    +   - Streaming transcription: You can send recorded audio files or live audio
    streams to Amazon Transcribe and output a stream of text in real time.


    +   - Custom vocabulary or customized transcription: You can use your custom vocabulary
    list as per your custom needs to generate accurate transcriptions.


    +   - Timestamp generation: If you want to build or add subtitles to your videos,
    then Amazon Transcribe can return the timestamp for each word or phrase from the
    audio.


    +   - Cost effectiveness: Being a managed service, there is no infrastructure
    cost.


    Now, let’s get hands-on with Amazon Transcribe.


    # # Getting hands-on with Amazon Transcribe


    In this section, you will build a pipeline where you can integrate AWS Lambda
    with Amazon Transcribe to read an audio file stored in a folder in an S3 bucket,
    and then store the output JSON file in another S3 bucket. You will monitor the
    task’s progress in CloudWatch Logs too. You will use the start_transcription_job
    asynchronous function to start our job and you will constantly monitor the job
    through get_transcription_job until its status becomes COMPLETED. Let’s get started:


    +   1. First, create an IAM role called transcribe-demo-role for the Lambda function
    to execute. Ensure that it can read and write from/to S3, use Amazon Transcribe,
    and print the output in CloudWatch logs. Add the following policies to the IAM
    role:


    +   - AmazonS3FullAccess


    +   - CloudWatchFullAccess


    +   - AmazonTranscribeFullAccess


    +   2. Now, you will create a Lambda function called transcribe-lambda with our
    existing IAM role, transcribe-demo-role, and save it.


    Please make sure you change the default timeout to a higher value in the **Basic
    settings** section of your Lambda function. I have set it to 10 min and 20 sec
    to avoid timeout errors. You will be using an asynchronous API call called start_transcription_job
    to start the task and monitor it by using the get_transcription_job API.'
