    # Anomaly detection


    Finding anomalies in data is a very common task in modeling and data exploratory
    analysis. Sometimes, you might want to find anomalies in the data just to remove
    them before fitting a regression model, while other times, you might want to create
    a model that identifies anomalies as an end goal – for example, in fraud detection
    systems.


    Again, you can use many different methods to find anomalies in the data. With
    some creativity, the possibilities are endless. However, there is a particular
    algorithm that works around this problem that you should definitely be aware of
    for your exam: RCF.


    RCF is an unsupervised decision tree-based algorithm that creates multiple decision
    trees (forests) using random subsamples of the training data. Technically, it
    randomizes the data and then creates samples according to the number of trees.
    Finally, these samples are distributed across each tree.


    These sets of trees are used to assign an anomaly score to the data points. To
    calculate the anomaly score for a particular data point, it is passed down each
    tree in the forest. As the data point moves through the tree, the path length
    from the root node to the leaf node is recorded for that specific tree. The anomaly
    score for that data point is then determined by considering the distribution of
    path lengths across all the trees in the forest.


    If a data point follows a short path in most trees (i.e., it is close to the root
    node), it is considered a common point and will have a lower anomaly score.


    On the other hand, if a data point follows a long path in many trees (i.e., it
    is far from the root node), it is considered an uncommon point and will have a
    higher anomaly score.


    The most important hyperparameters of RCF are num_trees and num_samples_per_tree,
    which are the number of trees in the forest and the number of samples per tree,
    respectively.


    # Dimensionality reduction


    Another unsupervised algorithm that was implemented by AWS in its list of built-in
    algorithms is known as principal component analysis, or PCA for short. PCA is
    a technique that’s used to reduce the number of variables/dimensions in'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'a dataset.


    The main idea behind PCA is plotting the data points to another set of coordinates,
    known as Principal Components (PCs), which aims to explain the most variance in
    the data. By definition, the first component will capture more variance than the
    second component, then the second component will capture more variance than the
    third one, and so on.


    You can set up as many PCs as you need, as long as it does not surpass the number
    of variables in your dataset. Figure 6.18 shows how these PCs are drawn:


    ![](img/87c29232224b00f5a8bba6a66a391700_177_0.png)


    Figure 6.18 – Finding PCs in PCA


    As mentioned previously, the first PC will be drawn in such a way that it will
    capture most of the variance in the data. That is why it passes near the majority
    of the data points in Figure 6.18.


    Then, the second PC will be perpendicular to the first one, so that it will be
    the second component that explains the variance in the data. If you want to create
    more components (consequently, capturing more variance), you just have to follow
    the same rule of adding perpendicular components. Eigenvectors and eigenvalues
    are the linear algebra concepts associated with PCA that compute the PCs.


    So, what is the story with dimension reduction here? In case it is not clear yet,
    these PCs can be used to replace your original variables. For example, consider
    you have 10 variables in your dataset, and you want to reduce this dataset to
    three variables that best represent the others. A potential solution for that
    would be applying PCA and extracting the first three PCs!


    Do these three components explain 100% of your dataset? Probably not, but ideally,
    they will explain most of the variance. Adding more PCs will explain more variance
    but at the cost of adding extra dimensions.


