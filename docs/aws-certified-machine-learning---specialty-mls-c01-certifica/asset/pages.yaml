  md: 'monitoring section and clicking on **View logs in CloudWatch**.


    In CloudWatch, each Lambda function will have a log group and, inside that log
    group, many **log streams**. Log streams store the execution logs of the associated
    function. In other words, a log stream is a sequence of logs that share the same
    source, which, in this case, is your Lambda function. A log group is a group of
    log streams that share the same retention, monitoring, and access control settings.


    You are now reaching the end of this section, but not the end of this topic on
    Lambda functions. As mentioned earlier, this AWS service has a lot of use cases
    and integrates with many other services. In the next section, you will look at
    another AWS service that will help orchestrate executions of Lambda functions.
    This is known as **AWS Step Functions**.


    # Working with step functions


    Step Functions is an AWS service that allows you to create workflows to orchestrate
    the execution of Lambda functions. This is so that you can connect them in a sort
    of event sequence, known as **steps**. These steps are grouped in a **state machine**.


    Step Functions incorporates retry functionality so that you can configure your
    pipeline to proceed only after a particular step has succeeded. The way you set
    these retry configurations is by creating a **retry policy**.


    # IMPORTANT NOTE


    Just like the majority of AWS services, AWS Step Functions also integrates with
    other services, not only AWS Lambda.


    Creating a state machine is relatively simple. All you have to do is navigate
    to the AWS Step Functions console and then create a new state machine. On the
    **Create state machine** page, you can specify whether you want to create your
    state machine from scratch or from a template, or whether you just want to run
    a sample project.


    AWS will help you with this state machine creation, so even if you choose to create
    it from scratch, you will find code snippets for a various list of tasks, such
    as AWS Lambda invocation, SNS topic publication, and running Athena queries.


    For the sake of demonstration, you will now create a very simple, but still helpful,
    example of how to use Step Functions to execute a Lambda function with the **retry**
    option activated:


    ```

    {

    "Comment": "A very handy example of how to call a lambda function with retry option",

    "StartAt": "Invoke Lambda function",

    "States": {

    "Invoke Lambda function": {

    "Type": "Task",

    ```'
