    \ with any kind of encryption. So, if you run aws s3api get-bucket-encryption\
    \ --bucket version-demo-mlpractice, then it will output an error that says the\
    \ following:\n+   **The server side encryption configuration was not found**\n\
    \n+   3. Server-Side Encryption (SSE) can be applied from the AWS S3 console while\
    \ creating a bucket. This is called bucket default encryption. You can also apply\
