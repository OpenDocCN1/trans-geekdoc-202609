    | | I | Will | Pass | This | Exam | You | See | It |

    |---|---|---|---|---|---|---|---|---|

    | I | 0 | 3 | ... | ... | ... | ... | ... | ... |

    | Will | 3 | 0 | ... | ... | ... | ... | ... | ... |

    | Pass | ... | ... | 0 | ... | ... | ... | ... | ... |

    | This | ... | ... | ... | 0 | ... | ... | ... | ... |

    | Exam | ... | ... | ... | ... | 0 | ... | ... | ... |

    | You | ... | ... | ... | ... | ... | 0 | ... | ... |

    | See | ... | ... | ... | ... | ... | ... | 0 | ... |

    | It | ... | ... | ... | ... | ... | ... | ... | 0 |


    Figure 4.13 – Co-occurrence matrix


    As you can see, the pair of words “I will” appears three times when a context
