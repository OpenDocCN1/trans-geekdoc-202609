    # Examining DL


    DL is a subset of ML that aims to propose algorithms that connect multiple layers
    to solve a particular problem. The knowledge is then passed through, layer by
    layer, until the optimal solution is found. The most common type of DL algorithm
    is deep neural networks.


    At the time of writing this book, DL is a very hot topic in the field of ML. Most
    of the current state-of-the-art algorithms for machine translation, image captioning,
    and computer vision were proposed'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'in the past few years and are a part of the DL field (GPT-4, used by the ChatGPT
    application, is one of these algorithms).


    Now that you have an overview of types of AI, take a look at some of the ways
    you can classify ML.


    # Classifying supervised, unsupervised, and reinforcement learning


    ML is a very extensive field of study; that’s why it is very important to have
    a clear definition of its sub-divisions. From a very broad perspective, you can
    split ML algorithms into two main classes: supervised learning and unsupervised
    learning.


    # Introducing supervised learning


    Supervised algorithms use a class or label (from the input data) as support to
    find and validate the optimal solution. In Table 1.1, there is a dataset that
    aims to classify fraudulent transactions from a financial company.


    | Day of the week | Hour | Transaction amount | Merchant type | Is fraud? |

    | :--- | :--- | :--- | :--- | :--- |

    | Mon | 09:00 | $1000 | Retail | No |

    | Tue | 23:00 | $5500 | E-commerce | Yes |

    | Fri | 14:00 | $500 | Travel | No |

    | Mon | 10:00 | $100 | Retail | No |

    | Tue | 22:00 | $100 | E-commerce | No |

    | Tue | 22:00 | $6000 | E-commerce | Yes |


    Table 1.1 – Sample dataset for supervised learning


    The first four columns are known as features or independent variables, and they
    can be used by a supervised algorithm to find fraudulent patterns. For example,
    by combining those four features (day of the week, EST hour, transaction amount,
    and merchant type) and six observations (each row is technically one observation),
    you can infer that e-commerce transactions with a value greater than $5,000 and
    processed at night are potentially fraudulent cases.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# IMPORTANT NOTE


    In a real scenario, you will have more observations in order to have statistical
    support to make this type of inference.


    The key point is that you were able to infer a potential fraudulent pattern just
    because you knew, a priori, what is fraud and what is not fraud. This information
    is present in the last column of Table 1.1 and is commonly referred to as a target
    variable, label, response variable, or dependent variable. If the input dataset
    has a target variable, you should be able to apply supervised learning.


    In supervised learning, the target variable might store different types of data.
    For instance, it could be a binary column (yes or no), a multi-class column (class
    A, B, or C), or even a numerical column (any real number, such as a transaction
    amount). According to the data type of the target variable, you will find which
    type of supervised learning your problem refers to. Table 1.2 shows how to classify
    supervised learning into two main groups: classification and regression algorithms:


    | Data type of the target variable | Sub data type of the target variable | Type
    of supervised learning applicable |

    |---|---|---|

    | Categorical | Binary | Binary classification |

    | Categorical | Multi class | Multi classification |

    | Numerical | N/A | Regression |


    Table 1.2 – Choosing the right type of supervised learning given the target variable


    While classification algorithms predict a class (either binary or multiple classes),
    regression algorithms predict a real number (either continuous or discrete).


    Understanding data types is important to make the right decisions on ML projects.
    You can split data types into two main categories: numerical and categorical data.
    Numerical data can then be split into continuous or discrete subclasses, while
    categorical data might refer to ordinal or nominal data:


    +   * Numerical/discrete data refers to individual and countable items (for example,
    the number of students in a classroom or the number of items in an online shopping
    cart).

    +   * Numerical/continuous data refers to an infinite number of possible measurements
    and they often carry decimal points (for example, temperature).

    +   * Categorical/nominal data refers to labeled variables with no quantitative
    value (for example, name or gender).

    +   * Categorical/ordinal data adds a sense of order to a labeled variable (for
    example, education level or employee title level).


    In other words, when choosing an algorithm for your project, you should ask yourself:
    do I have a target variable? Does it store categorical or numerical data? Answering
    these questions will put you'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'in a better position to choose a potential algorithm that will solve your problem.


    However, what if you don’t have a target variable? In that case, you are facing
    an unsupervised learning problem. Unsupervised problems do not provide labeled
    data; instead, they provide all the independent variables (or features) that will
    allow unsupervised algorithms to find patterns in the data. The most common type
    of unsupervised learning is **clustering**, which aims to group the observations
    of the dataset into different clusters, purely based on their features. Observations
    from the same cluster are expected to be similar to each other, but very different
    from observations from other clusters. Clustering will be covered in more detail
    in future chapters of this book.


    **Semi-supervised learning** is also present in the ML literature. This type of
    algorithm can learn from partially labeled data (some observations contain a label
    and others do not).


    Finally, another learning approach that has been taken by another class of ML
    algorithms is **reinforcement learning**. This approach rewards the system based
    on the good decisions that it has made autonomously; in other words, the system
    learns by experience.


    You have been learning about approaches and classes of algorithms at a very broad
    level. However, it is time to get specific and introduce the term **model**.


    # The CRISP-DM modeling life cycle


    **Modeling** is a very common term used in ML when you want to specify the steps
    taken to solve a particular problem. For example, you could create a binary classification
    model to predict whether the transactions from _Table 1.1_ are fraudulent or not.


    A model, in this context, represents all the steps to create a solution as a whole,
    which includes (but is not limited to) the algorithm. The **Cross-Industry Standard
    Process for Data Mining**, more commonly referred to as **CRISP-DM**, is one of
    the methodologies that provides guidance on the common steps that you should follow
    to create models. This methodology is widely used by the market and is covered
    in the AWS Machine Learning Specialty exam:'
  merge: -1
  img_proc: true
- pgno: 31
  md: '![](img/87c29232224b00f5a8bba6a66a391700_31_0.png)


    Figure 1.3 – CRISP-DM methodology


    Everything starts with business understanding, which will produce the business
    objectives (including success criteria), situation assessment, data mining goals,
    and project plan (with an initial assessment of tools and techniques). During
    the situation assessment, you should also look into an inventory of resources,
    requirements, assumptions and constraints, risks, terminology, costs, and benefits.
    Every single assumption and success criterion matters when you are modeling.


    The next step is known as data understanding, where you will collect raw data,
    describe it, explore it, and check its quality. This is an initial assessment
    of the data that will be used to create the model. Again, data scientists must
    be skeptical. You must be sure you understand all the nuances of the data and
    its source.


    The data preparation phase is actually the one that usually consumes most of the
    time during modeling. In this phase, you need to select and filter the data, clean
    it according to the task that needs to be performed, come up with new attributes,
    integrate the data with other data sources, and format it as expected by the algorithm
    that will be applied. These tasks are often called **feature engineering**.


    Once the data is prepared, you can finally start the modeling phase. Here is where
    the algorithms come in. You should start by ensuring the selection of the right
    technique. Remember: according to the presence or absence of a target variable
    (and its data type), you will have different algorithms to'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'choose from. Each modeling technique might carry some implicit assumptions
    of which you have to be aware. For example, if you choose a multiple linear regression
    algorithm to predict house prices, you should be aware that this type of model
    expects a linear relationship between the variables of your data.


    There are hundreds of algorithms out there and each of them might have its own
    assumptions. After choosing the ones that you want to test in your project, you
    should spend some time checking their specifics. In later chapters of this book,
    you will learn about some of them.


    # IMPORTANT NOTE


    Some algorithms incorporate in their logic a sub-process known as feature selection.
    This is a step where the most important features will be selected to build your
    best model. Decision trees are examples of algorithms that perform feature selection
    automatically. You will learn about feature selection in more detail later on,
    since there are different ways to select the best variables for your model.


    During the modeling phase, you should also design a testing approach for the model,
    defining which evaluation metrics will be used and how the data will be split.
    With that in place, you can finally build the model by setting the hyperparameters
    of the algorithm and feeding the model with data. This process of feeding the
    algorithm with data to find a good estimator is known as the training process.
    The data used to feed the model is known as training data. There are different
    ways to organize the training and testing data, which you will learn about in
    this chapter.


    # IMPORTANT NOTE


    ML algorithms are built of parameters and hyperparameters. Parameters are learned
    from the data; for example: a decision-tree-based algorithm might learn from the
    training data that a particular feature should compose its root level based on
    information gain assessments. Hyperparameters, on the other hand, are used to
    control the learning process. Taking the same example about decision trees, you
    could specify the maximum allowed depth of the tree (regardless of the training
    data). Hyperparameter tuning is a very important topic in the exam and will be
    covered in fine-grained detail later on.


    Once the model is trained, you can evaluate and review the results in order to
    propose the next steps. If the results are not acceptable (based on business success
    criteria), you should go back to earlier steps to check what else can be done
    to improve the model''s results. It could either be the subtle tuning of the hyperparameters
    of the algorithm, a new data preparation step, or even the redefinition of business
    drivers. On the other hand, if the model quality is acceptable, you can move on
    to the deployment phase.


    In this last phase of the CRISP-DM methodology, you have to think about the deployment
    plan, monitoring, and maintenance of the model. You can look at this step from
    two perspectives: training and inference. The training pipeline consists of those
    steps needed to train the model, which include data preparation, hyperparameter
    definition, data splitting, and model training itself. Somehow, you'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'must store all the model artifacts somewhere, since they will be used by the
    next pipeline that needs to be developed: the inference pipeline.


    The inference pipeline just uses model artifacts to execute the model against
    brand-new observations (data that has never been seen by the model during the
    training phase). For example, if the model was trained to identify fraudulent
    transactions, this is the time when new transactions will pass through the model
    to be classified.


    In general, models are trained once (through the training pipeline) and executed
    many times (through the inference pipeline). However, after some time, it is expected
    that there will be some model degradation, also known as model drift. This phenomenon
    happens because the model is usually trained in a static training set that aims
    to represent the business scenario at a given point in time; however, businesses
    evolve, and it might be necessary to retrain the model on more recent data to
    capture new business aspects. That''s why it is important to keep tracking model
    performance even after model deployment.


    The CRISP-DM methodology is so important to the context of the AWS Machine Learning
    Specialty exam that, if you look at the four domains covered by AWS, you will
    realize that they were generalized from the CRISP-DM stages: data engineering,
    exploratory data analysis, modeling, and ML implementation and operations.


    You now understand all the key stages of a modeling pipeline and you know that
    the algorithm itself is just part of a larger process! Next, you will see how
    to split your data to create and validate ML models.


    # # Data splitting


    Training and evaluating ML models are key tasks of the modeling pipeline. ML algorithms
    need data to find relationships among features in order to make inferences, but
    those inferences need to be validated before they are moved to production environments.


    The dataset used to train ML models is commonly called the training set. This
    training data must be able to represent the real environment where the model will
    be used; it will be useless if that requirement is not met.


    Coming back to the fraud example presented in Table 1.1, based on the training
    data, you found that e-commerce transactions with a value greater than $5,000
    and processed at night are potentially fraudulent cases. With that in mind, after
    applying the model in a production environment, the model is supposed to flag
    similar cases, as learned during the training process.'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'Therefore, if those cases only exist in the training set, the model will flag
    **false positive** cases in production environments. The opposite scenario is
    also true: if there is a particular fraud case in production data, not reflected
    in the training data, the model will flag a lot of **false negative** cases. False
    positive and false negative ratios are just two of many quality metrics that you
    can use for model validation. These metrics will be covered in much more detail
    later on.


    By this point, you should have a clear understanding of the importance of having
    a good training set. Now, supposing you do have a valid training set, how could
    you have some level of confidence that this model will perform well in production
    environments? The answer is by using testing and validation sets:


    ![](img/87c29232224b00f5a8bba6a66a391700_34_0.png)


    Figure 1.4 – Data splitting


    _Figure 1.4_ shows the different types of data splitting that you can have during
    training and inference pipelines. The training data is used to create the model;
    the testing data is used to extract the final model quality metrics. The testing
    data _cannot_ be used during the training process for any reason other than to
    extract model metrics.


    The reason to avoid using the testing data during training is simple: you _cannot_
    let the model learn on top of the data that will be used to validate it. This
    technique of holding one piece of the data for testing is often called **hold-out
    validation**.


    The box on the right side of _Figure 1.4_ represents the production data. Production
    data usually comes in continuously and you have to execute the inference pipeline
    in order to extract model results from it. No training, nor any other type of
    recalculation, is performed on top of production data; you just have to pass it
    through the inference pipeline as it is.


    From a technical perspective, most ML libraries implement training steps with
    the `.fit` method, while inference steps are implemented by the `.transform` or
    `.predict` method. Again, this is just a common pattern used by most ML libraries,
    but be aware that you might find different name conventions across ML libraries.


    Still looking at _Figure 1.4_, there is another box, close to the training data,
    named **Validation data**. This is a subset of the training set often used to
    support the creation of the best model, before moving'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'on to the testing phase. You will learn about validation sets in much more
    detail, but first, you should

    understand why you need them.


    # Overfitting and underfitting


    ML models might suffer from two types of fitting issues: **overfitting** and **underfitting**.
    Overfitting

    means that your model performs very well on the training data but cannot be generalized
    to other

    datasets, such as testing and, even worse, production data. In other words, if
    you have an overfitted

    model, it only works on your training data.


    When you are building ML models, you want to create solutions that are able to
    generalize what they

    have learned and infer decisions on other datasets that follow the same data distribution.
    A model that

    only works on the data that it was trained on is useless. Overfitting usually
    happens due to the large

    number of features or the lack of configuration of the hyperparameters of the
    algorithm.


    On the other hand, underfitted models cannot fit the data during the training
    phase. As a result, they

    are so generic that they can’t perform well within the training, testing, or production
    data.

    Underfitting usually happens due to the lack of good features/observations or
    due to the lack of time

    to train the model (some algorithms need more iterations to properly fit the model).


    Both overfitting and underfitting need to be avoided. There are many modeling
    techniques to work

    around them. For instance, you will learn about the commonly used **cross-validation**
    technique and

    its relationship with the validation data box shown in Figure 1.4.


    # Applying cross-validation and measuring overfitting


    Cross-validation is a technique where you split the training set into training
    and validation sets. The

    model is then trained on the training set and tested on the validation set. The
    most common cross-

    validation strategy is known as **k-fold cross-validation**, where k is the number
    of splits of the

    training set.


    Using k-fold cross-validation and assuming the value of k equals 10, you are splitting
    the training set

    into 10 folds. The model will be trained and tested 10 times. On each iteration,
    it uses 9 splits for

    training and leaves one split for testing. After 10 executions, the evaluation
    metrics extracted from

    each iteration are averaged and will represent the final model performance during
    the training phase,

    as shown in Figure 1.5:'
  merge: -1
  img_proc: true
- pgno: 36
  md: '![](img/87c29232224b00f5a8bba6a66a391700_36_0.png)


    # Figure 1.5 – Cross-validation in action


    Another common cross-validation technique is known as **leave-one-out cross-validation
    (LOOCV)**. In this approach, the model is executed many times and, within each
    iteration, one observation is separated for testing and all the others are used
    for training.


    There are many advantages of using cross-validation during training:


    +   - You mitigate overfitting in the training data since the model is always
    trained on a particular chunk of data and tested on another chunk that hasn’t
    been used for training.

    +   - You avoid overfitting in the test data since there is no need to keep using
    the testing data to optimize the model.

    +   - You expose the presence of overfitting or underfitting. If the model performance
    in the training/validation data is very different from the performance observed
    in the testing data, something is wrong.


    It might be worth diving into the third item on that list since it is widely covered
    in the AWS Machine Learning Specialty exam. For instance, assume you are creating
    a binary classification model, using cross-validation during training, and using
    a testing set to extract final metrics (hold-out validation). If you get 80% accuracy
    in the cross-validation results and 50% accuracy in the testing set, it means
    that the model was overfitted to the training set, and so cannot be generalized
    to the testing set.


    On the other hand, if you get 50% accuracy in the training set and 80% accuracy
    in the testing set, there is a systemic issue in the data. It is very likely that
    the training and testing sets do not follow the same distribution.'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# IMPORTANT NOTE


    Accuracy is a model evaluation metric commonly used on classification models.
    It measures how often the model made a correct decision during its inference process.
    That metric was selected just for the sake of demonstration, but be aware that
    there are many other evaluation metrics applicable for each type of model (which
    will be covered at the appropriate time).


    # Bootstrapping methods


    Cross-validation is a good strategy to validate ML models, and you should try
    it in your daily activities as a data scientist. However, you should also know
    about other resampling techniques available out there. **Bootstrapping** is one
    of them.


    While cross-validation works _with no replacement_, a bootstrapping approach works
    _with replacement_. With replacement means that, while you are drawing multiple
    random samples from a population dataset, the same observation might be duplicated
    across samples.


    Usually, bootstrapping is not used to validate models as you do in the traditional
    cross-validation approach. The reason is simple: since it works with replacement,
    the same observation used for training could potentially be used for testing,
    too. This would result in inflated model performance metrics since the estimator
    is likely to be correct when predicting an observation that was already seen in
    the training set.


    Bootstrapping is often used by ML algorithms in an embedded way that requires
    resampling capabilities to process the data. In this context, bootstrapping is
    not used to _validate_ the model but to _create_ the model. **Random forest**,
    which will be covered in **Chapter 6, Applying Machine Learning Algorithms**,
    is one of those algorithms that use bootstrapping internally for model building.


    Designing a good data splitting/sampling strategy is crucial to the success of
    the model or the algorithm. You should come up with different approaches to split
    your data, check how the model is performing on each split, and make sure those
    splits represent the real scenario where the model will be used.


    # The variance versus bias trade-off


    Any ML model is supposed to contain errors. There are three types of errors that
    you can find in models: **bias** errors, **variance** errors, and **unexplained**
    errors. The last one, as expected, cannot be explained. It is often related to
    the context of the problem and the relationships between the variables (you can’t
    control it).'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'The other two types of errors can be controlled during modeling. You can say
    that there is a trade-off between bias and variance errors because one will influence
    the other. In this case, increasing bias will decrease variance and vice versa.


    Bias errors relate to assumptions taken by the model to learn the target function,
    the one that you want to solve. Some types of algorithms, such as linear algorithms,
    usually carry over that type of error because they make a lot of assumptions during
    model training. For example, linear models assume that the relationship present
    in the data is linear. Linear regression and logistic regression are types of
    algorithms that, in general, contain high bias. Decision trees, on the other hand,
    are types of algorithms that make fewer assumptions about the data and contain
    less bias.


    Variance relates to the difference in estimations that the model performs on different
    training data. Models with high variance usually overfit the training set. Decision
    trees are examples of algorithms with high variance (they usually rely a lot on
    specifics of the training set, failing to generalize), and linear and logistic
    regression are examples of algorithms with low variance. It does not mean that
    decision trees are bad estimators; it just means that you need to prune (optimize)
    them during training.


    That being said, the goal of any model is to minimize both bias and variance.
    However, as already mentioned, each one will impact the other in the opposite
    direction. For the sake of demonstration, consider a decision tree to understand
    how this trade-off works.


    Decision trees are nonlinear algorithms and often contain low bias and high variance.
    In order to decrease variance, you can prune the tree and set the `max_depth`
    hyperparameter (the maximum allowed depth of the tree) to 10. That will force
    a more generic model, reducing variance. However, that change will also force
    the model to make more assumptions (since it is now more generic) and increase
    bias.


    # Shuffling your training set


    Now that you know what variance and data splitting are, you can go a little deeper
    into the training dataset requirements. You are very likely to find questions
    around data shuffling in the exam. This process consists of randomizing your training
    dataset before you start using it to fit an algorithm.


    Data shuffling will help the algorithm to reduce variance by creating a more generalizable
    model. For example, let''s say your training represents a binary classification
    problem and it is sorted by the target variable (all cases belonging to class
    “0” appear first, then all the cases belonging to class “1”).


    When you fit an algorithm on this sorted data (especially some algorithms that
    rely on **batch processing**), it will make strong assumptions about the pattern
    of one of the classes, since it is very'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'likely that it won’t be able to create random batches of data with a good representation
    of both classes. Once the algorithm builds strong assumptions about the training
    data, it might be difficult for it to change them.


    # IMPORTANT NOTE


    Some algorithms are able to execute the training process by fitting the data in
    chunks, also known as batches. This approach lets the model learn more frequently
    since it will make partial assumptions after processing each batch of data (instead
    of making decisions only after processing the entire dataset).


    On the other hand, there is no need to shuffle the testing set, since it will
    be used only by the inference process to check model performance.


    # Modeling expectations


    So far, you have learned about model building, validation, and management. You
    can now complete the foundations of ML by learning about a couple of other expectations
    while modeling.


    The first one is parsimony. Parsimony describes models that offer the simplest
    explanation and fit the best results when compared with other models. Here’s an
    example: while creating a linear regression model, you realize that adding 10
    more features will improve your model’s performance by 0.001%. In this scenario,
    you should consider whether this performance improvement is worth the cost of
    parsimony (since your model will become more complex). Sometimes it is worth it,
    but most of the time it is not. You need to be skeptical and think according to
    your business case.


    Parsimony directly supports interpretability. The simpler your model is, the easier
    it is to explain it. However, there is a battle between interpretability and predictivity:
    if you focus on predictive power, you are likely to lose some interpretability.
    Again, you must select what is the best situation for your use case.


    # Introducing ML frameworks


    Being aware of some ML frameworks will put you in a much better position to pass
    the AWS Machine Learning Specialty exam. There is no need to master these frameworks
    since this is not a framework-specific certification; however, knowing some common
    terms and solutions will help you to understand the context of the problems/questions.


    scikit-learn is probably the most popular ML framework that you should be aware
    of. It is an open source Python package that provides implementations of ML algorithms
    such as decision trees, support vector machines, linear regression, and many others.
    It also implements classes for data'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'preprocessing, for example, one-hot encoding, label encoders, principal component
    analysis, and so on. All these preprocessing methods (and many others) will be
    covered in later sections of this book.


    The downside of scikit-learn is the fact that it needs customization to scale
    up through multiple machines. There is another ML library that is very popular
    because of the fact that it can handle multiprocessing straight away: **Spark''s
    ML library**.


    As the name suggests, it is an ML library that runs on top of **Apache Spark**,
    which is a unified analytical multi-processing framework used to process data
    on multiple machines. AWS offers a specific service that allows developers to
    create Spark clusters with a few clicks, known as **EMR**. Additionally, SageMaker
    (a fully managed ML service provided by AWS, which you will cover in a separate
    chapter) is well integrated with Apache Spark.


    The Spark ML library is in constant development. As of the time of writing, it
    offers support to many ML classes of algorithms, such as classification and regression,
    clustering, and collaborative filtering. It also offers support for basic statistics
    computation, such as correlations and some hypothesis tests, as well as many data
    transformations, such as one-hot encoding, principal component analysis, min-max
    scaling, and others.


    Another very popular ML framework is known as **TensorFlow**. This ML framework
    was created by the Google team and it is used for numerical computation and large-scale
    ML model development. TensorFlow implements not only traditional ML algorithms
    but also DL models.


    TensorFlow is considered a low-level API for model development, which means that
    it can be very complex to develop more sophisticated models, such as **transformers**
    (for text mining). As an attempt to facilitate model development, other ML frameworks
    were built on top of TensorFlow to make it easier. One of these high-level frameworks
    is **Keras**. With Keras, developers can create complex DL models with just a
    few lines of code. More recently, Keras was incorporated into TensorFlow and it
    can be now called inside the TensorFlow library.


    **MXNet** is another open source DL library. Using MXNet, you can scale up neural
    network-based models using multiple GPUs running on multiple machines. It also
    supports different programming languages, such as Python, R, Scala, and Java.


    **Graphical processing unit (GPU)** support is particularly important in DL libraries
    such as TensorFlow and MXNet. These libraries allow developers to create and deploy
    neural network-based models with multiple layers. The training process of neural
    networks relies a lot on matrix operations, which perform much better on GPUs
    rather than on CPUs. That''s why these DL libraries commonly offer GPU support.
    AWS also offers EC2 instances with GPU enabled.'
