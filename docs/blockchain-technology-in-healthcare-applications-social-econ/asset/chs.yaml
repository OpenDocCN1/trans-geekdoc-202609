  \ 和加权价格 [[49]](#C_009_c4.xhtml#r4_49)。对于时间序列预测，共观察了 1,048,576 条数据条目；为展示原型，检测同一数据集上的异常时采用了\
  \ 19,999 条数据条目。\n\n### 4.4.1 ARIMA 模型\n\n在时间序列预测分析中，实现 表 4.4 所示 ARIMA 模型步骤后获得以下结果。图\
  \ 4.7–4.9 代表使用 ARIMA 模型预测获得的结果。\n\n**表 4.4** ARIMA 模型步骤\n\n| 步骤 | 描述 |\n| --- |\
  \ --- |\n| 1 | START |\n| 2 | 将时间戳调整为日期和时间格式 |\n| 3 | 绘制数据并注意异常观测值 |\n| 4 | 将 `NaN`\
  \ 值替换为 0 或预先定义的值 |\n| 5 | 将序列转换为平稳序列 |\n| 6 | 分解模型以寻找趋势、季节性变化和残差 |\n| 7 | 在 `statsmodel.graphics.tsaplots`\
  \ 上建模数据 |\n| 8 | 绘制 ACF 模型并找到最佳解 |\n| 9 | 构建自动 ARIMA 模型 |\n| 10 | 进行预测并比较预期与实际结果\
  \ |\n| 11 | END |\n\n![FIGURE 4.7 Analysis of decomposition of bitcoin price.](img/Fig04_07.jpg)\n\
