  \n# 14 制药行业中的区块链：通过架构与开放挑战实现更好的药品追踪\n\nAyasha Malik\n\nNoida Institute of Engineering\
  \ Technology (NIET)\n\nNeha Yadav\n\nBabasaheb Bhimrao Ambedkar University\n\nJaya\
  \ Srivastava\n\nNoida Institute of Engineering Technology (NIET)\n\nAhmed J. Obaid\n\
  \nKufa University\n\nMuzafer Saracevic\n\nUniversity of Novi Pazar\n\nDOI: [10.1201/9781003224075-14](http://doi.org/10.1201/9781003224075-14)\n\
  \n## 14.1 介绍\n\n\n\n\n\n### 药品篡改与基于区块链的药品追踪\n\n药品篡改已成为当今的主要关注点，它对公共卫生构成恶性威胁，对人类健康和医疗效果产生不利影响。根据世界卫生组织（WHO）的数据[[1]](#C_019_c14.xhtml#r14_1)，篡改药品是伪造产品来源和身份的结果。据世卫组织数据显示，发展中国家\
  \ 15%的药品和发达国家 1.5%–2.5%的药品遭到篡改[[2]](#C_019_c14.xhtml#r14_2)。篡改药品对所有制药利益相关者产生不利影响，包括全球的医院、药房、批发分销商、全球卫生项目和监管机构。这些药品对人类致命。在有远见的制药供应链（PSC）背后，存在着一个巨大的非法药品市场，这些市场通过改变成分、将过期库存混入新库存中来生产虚假和受污染的药品。之所以存在这个过程，仅仅是因为缺乏在供应链每个环节追踪和验证药品真实性的技术。新冠疫情期间假瑞德西韦注射液的流通，就是近期造成人员伤亡的假冒药品案例[[3]](#C_019_c14.xhtml#r14_3)。\n\
  \n更容易受到非正规药品影响的地区有亚太地区、埃及和拉丁美洲。40%的药品制造和使用导致每年 170 万人死亡[[4]](#C_019_c14.xhtml#r14_4)。在欧洲地区，基于假冒药品的案件总数比去年增加了一倍[[5]](#C_019_c14.xhtml#r14_5)。欧洲一位杰出研究人员刚刚发布的一份报告强调，假冒药品行业现在被认为是一项更有利可图、更赚钱的生意，因为合法药品销售更加困难，其预估收入损失约占行业药品销售额的\
  \ 8%，每年达 160 亿欧元[[6]](#C_019_c14.xhtml#r14_6)。通过网上药店和非法分销渠道购买和获取药品的增长，使得在供应链网络系统中确保产品安全变得极具挑战性。同样，供应链网络中针对库存的有限数据透明度不足，给非正规行为进入市场提供了更多机会[[7]](#C_019_c14.xhtml#r14_7)。药品检测是辨别药品真伪和合法性的能力，确保所有利益相关者能在供应链系统的每个阶段检测和追踪每笔交易。美国《药品供应链安全法》（DSCSA）[[8]](#C_019_c14.xhtml#r14_8)等法规要求所有药品供应链利益相关者采取可靠措施以实现更好的产品追踪；DSCSA\
  \ 的实际实施将以渐进分阶段的方式在 2025 年前完成。通过在线访问 PSC 的日益增长的需求，为造假者提供了更多造假途径，未经授权的经销商分销药品也是药品造假的一个附加因素[[9]](#C_019_c14.xhtml#r14_9)。缺乏透明度和可追溯性也为药品造假者提供了可乘之机。\n\
  \n区块链技术是以分布式方式排列的区块链，旨在确保其所持有数据的安全性、真实性、透明度和可追溯性。存储在区块链上的数据是不可篡改的[[10]](#C_019_c14.xhtml#r14_10)；它凭借银行、教育、物流、交通管理、身份管理、电子健康记录管理、能源、贸易等应用覆盖了生活的几乎所有领域[[11]](#C_019_c14.xhtml#r14_11)。区块链在追踪\
  \ PSC 以根除篡改药品方面大有可为。区块链技术能够创建一个用于分配共享数据存储的平台，并在利益相关者不同的供应链系统之间共享交易数据，确保信息可供授权群体获取、不可更改、透明，并通过不同的加密技术保持安全[[12]](#C_019_c14.xhtml#r14_12)，[[13]](#C_019_c14.xhtml#r14_13)。因此，为制药系统供应链中的追踪、查找和管理真实性提供前瞻性方法至关重要。我们研究工作的主要贡献如下：\n\
  \n*   本文探讨了制药行业如何从基于区块链的供应链药品追踪系统中受益的原因。\n*   本文揭示了使用基于区块链的药品配送解决方案相较于现有解决方案所带来的所有重要优势。\n\
  *   本文重点介绍了三种用于制药行业药品供应或使用追踪的基于区块链的架构，分别为 `Hyperledger fabric`、`Hyperledger besu`\
  \ 和 `Ethereum`。\n*   本文检测、评估并反驳了一些可能阻碍基于区块链的解决方案在药品正确使用和配送中有效实施的挑战性问题。\n\n本文其余部分安排如下：第\
  \ 14.2 节 概述区块链技术，包括其特性和本质，并探讨了区块链类别的比较。此外，第 14.3 节 概述制药行业的药品追踪。另外，第 14.4 节 阐述三种基于区块链的药品追踪系统及其药品追踪流程。而且，针对一些参数对三种讨论的基于区块链的药品追踪架构进行了比较。第\
  \ 14.5 节 阐述与区块链采用技术相关的一些挑战或局限性，这些问题需要被描述以促进药品追踪。最后，第 14.6 节 给出结论并展望未来研究方向。\n\n##\
  \ 14.2 区块链概述\n\n区块链是区块的链条，每个区块包含关于交易的信息。区块链的副本共享给网络中的每台计算机/节点，这确保了存储数据的透明度。区块链网络由一组计算机组成，它们在单一协议下运行，以将更新的区块添加到现有链中[[14]](#C_019_c14.xhtml#r14_14)，[[15]](#C_019_c14.xhtml#r14_15)。因此，区块链的区块网络是一个分布式系统，它存储了所有过去执行交易的信息，并选择一个协议来验证交易、裁决交易流程，并确定网络及其所有参与者的所有工作。因此，该网络被称为分布式网络，在该网络中，每笔交易的数据都存储在其中工作的每个特定区块上[[16]](#C_019_c14.xhtml#r14_16)。\n\
  \n\n\n\n\n### 区块链网络类型与药品追踪概述\n\n#### 区块链网络的三大类型\n\n主要有三种区块链网络：**公有链**、**私有链**和**联盟链**。\n\
  \n**公有链**对所有人开放，任何人都可以作为用户、矿工、开发者或社区成员加入。它面向大众终端用户，无限制且无需许可，任何拥有互联网接入的人都可以加入公有链网络并成为其节点。公有链的例子包括\
  \ **Bitcoin (BTC)** 和 **Ethereum (ETH)** [17]。\n\n**私有链**在单一实体控制的受限环境中运行。只有拥有加入网络权限的节点才能加入私有链网络；因此，它也被称为**许可链**。**Hyperledger**\
  \ 和 **Ripple (XRP)** 是私有链广为人知的例子。\n\n**联盟链**兼具公有链和私有链的特性。来自多个组织的成员在联盟链网络上协作 [18]。现有节点控制联盟链中的共识机制。三种区块链的区别如\
  \ 表 14.1 所示。\n\n##### 表 14.1 区块链类别的差异\n\n| Property | Public [17] | Private [18]\
  \ | Consortium [18] |\n| :--- | :--- | :--- | :--- |\n| Type of governance | Public\
  \ | Single owner | Set of owners |\n| Example | Ripple, Bitcoin, Ethereum | Hyperledger,\
  \ Quorum | Multi-chain |\n| Consensus algorithm | PoW, PoS, etc. | PoA, PBFT, etc.\
  \ | Tendermint, etc. |\n| Infrastructure | Highly decentralized | Distributed |\
  \ Decentralized |\n| Transaction reading | Any node | Any node/list of predefined\
  \ node | Any node/list of predefined node |\n| Immutability of data | Yes | Yes\
  \ | Yes |\n| Network scalability | High | Low to medium | Low to medium |\n| Throughput\
  \ of transaction | Low | High | High |\n\n区块链技术的选择取决于手头的工作类型。例如，小企业的会计管理由其他机构管理，该场景的另一种选择是创建一个私有链网络，在该网络中，名为分布式账本的分布式区块集合是真实信息的唯一来源。而在供应链系统的另一场景中，客户希望追溯产品的一切信息，则适用联盟网络的方法。因此，参与者能够读取产品数据，但要确保只有真实的参与者（如供应商、制造商和原材料供应商）才能写入数据\
  \ [19]。\n\n## 14.3 医疗领域药品追踪概述\n\n本节重点关注药品供应链（PSC）中与药品可追溯性相关的问题。PSC 遵循从收集原材料到向最终用户（患者）供应成品的端到端供应流程。供应链的主要目标是在正确的时间提供正确且优质的药品，因为人们的生命安全至关重要。当前的\
  \ PSC 存在许多漏洞，且缺乏可追溯性和透明度。由于利益相关者的非一致性，不存在清晰的所有权，这也使得交易验证更加困难。缺乏对整个系统的单一视图，导致需要中央权威来管理整个系统\
  \ [20]。\n\nPSC 包含存储、包装、拆包、重新包装等多个流程，以及供应商、制造商、经销商、销售人员、药店和患者等多个利益相关者，这使得药品追踪变得困难。许多因素导致供应链系统中出现篡改药品；例如，未经行政机关许可从其他国家购买劣质药品、不良的制造和储存习惯、盗窃和不合格药品的泄露\
  \ [21]。为了提高供应链的可追溯性和透明度，已应用了大量补救措施，如序列化、条形码、射频识别（RFID）等，但它们在隐私、安全性和透明度方面都存在一些局限性。\n\
  \n区块链在供应链、运输、物流和交通控制系统中得到广泛应用，因为它为互不信任的利益相关者之间存储交易数据提供了一个不可篡改、安全、可验证且透明的环境 [22]。区块链的主要特性是利用哈希函数将包含交易数据的区块与前一个区块连接起来。这确保了数据的不可变性并便于追溯。区块链技术提供了一种结构化且经济的解决方案，可用于多种药品追踪功能和方法，以确保正确的查找、追踪和培训。区块链技术的优势可与现有的防伪解决方案（如\
  \ RFID、近场通信 NFC、质量风险与合规 QRC 和电子溯源）相结合，提供互操作且改进的集成解决方案 [23]。图 14.1 展示了药品供应链系统中所有中间利益相关者之间的关系。\n\
  \n![图 14.1 药品供应链利益相关者之间的关系](img/Fig14_01.jpg)\n\n**图 14.1** 药品供应链利益相关者之间的关系。\n\n\
  区块链技术允许授权的私有网络追踪 PSC 中的事件，并提供每笔交易的时间密封历史记录。事件样本包括执行者、所有者、交易时间、地点及相关利益相关者 [24]。这保持了药品的可靠性、完整性、有效性、透明度和安全性。该方法减少了药品供应链系统中的障碍，实现了互不信任的利益相关者之间的协作，并创建了一个安全且防篡改的分布式药品追踪系统\
  \ [25]。这些优势通过共享知识交换，为跨越多个国家和药品监管机构提供了标准化和指导性监管，以获得由食品药品监督管理局（FDA）和欧洲药品管理局（EMA）等众多监管机构支持的切实可行的解决方案。在下一部分中，将对\
  \ PSC 中产品追踪的三种区块链架构进行比较和解释。制药行业对基于区块链技术解释的广泛接受，明显建立在涉及主要利益相关者的一些当前项目基础之上，如 表 14.2\
  \ 所示。\n\n### 表 14.2 基于区块链的药品可追溯性及初始参与者\n\n| Products and Initials Participants [26]\
  \ | Solutions Types Based on Blockchain [26] | Platform [26] |\n| :--- | :--- |\
  \ :--- |\n| SAP multi-chain Merck, Ameri-source, Bergen, GSK, Amgen, Boehringer\
  \ Ingellheim, McKesson, Novo Nordisk | Authentication of copies along with tracing\
  \ of profitable revenues | Multi-chain |\n| IBM, KPMG, Merck, Walmart ID Logiq |\
  \ Proper tracking and authentication of intelligent medication management on a regular\
  \ basis | Hyperledger private platform |\n| Indiana university health, Wakemed health,\
  \ and hospitals | Tracking of special medicine inside as well as outside of providers\
  \ or networks | Private platform |\n\n\n\n\n\n| 账本领域 | 加州大学洛杉矶分校医疗 | 提供对额外或伪造副本的检测和解决方案\
  \ | Hyperledger |\n|---|---|---|---|\n| Medi Ledger-AmerisourceBergen, McKesson,\
  \ 药物制造商 Genentech, Pizer, Gilead | 有利收入的认证和验证系统 | 许可型企业以太坊 |\n| Trace Link 25 个以上参与者（生产商、供应商等）\
  \ | 包含数字追溯和互操作性的解决方案 | Hyperledger |\n\n## 14.4 基于区块链的药品追踪架构\n\n本节介绍并探讨了三种区块链架构的构建，以满足药品追踪的关键需求。这些结构或架构基于三个不同的区块链平台：`Hyperledger\
  \ fabric`、`Hyperledger besu` 和 `Ethereum`。因为与其他区块链平台相比，它提供了高水平的可靠性、权力分配、清晰度、机密性、安全性、数据可靠性、安排以及故障处理能力。这些是用于生成经批准的私有/公有区块链的主要区块链架构，在其中生产者、贡献者和最终用户被记录在案。这三种结构和传输流程在后续小节中定义\
  \ [[27]](#C_019_c14.xhtml#r14_27)。\n\n### 14.4.1 基于 Hyperledger Fabric 区块链的架构\n\n\
  基于 `Hyperledger fabric` 区块链的架构是一种具有链式结构设计的分布式账本技术 (DLT)，提供最高程度的保密性、稳健性和弹性。它是一种基于区块链的商业\
  \ DLT，采用智能合约在众多参与者之间建立信任。它摒弃了挖矿的概念，同时保留了基于区块链技术的传统加密货币的优势，如区块的不可篡改性、事件的顺序性以及双重支付保护。`Hyperledger\
  \ fabric` 已被证明能提供更高的交易吞吐量，每秒可达数千笔交易 [[28]](#C_019_c14.xhtml#r14_28)。由于这些特性以及下文将进一步讨论的其他特性，`Hyperledger\
  \ fabric` 成为具有众多流程和参与者的复杂供应链网络的绝佳选择。智能合约的采用标准低于使用特定编程语言（如 `Java`、`Go` 和 `NodeJS`）的其他技术\
  \ [[29]](#C_019_c14.xhtml#r14_29)。基于 `Hyperledger fabric` 区块链的药品追踪架构是基于区块链的企业级供应链系统的初稿，其中\
  \ PSC 内的不同利益相关者得到识别，他们之间的关联通过各种通道实施，以确保极高水平的保密性、权威性以及数据的全面保护。`Hyperledger fabric`\
  \ 首创了通道的概念。通道允许同一网络中的不同利益相关者隔离其业务逻辑和数据隐私标准。它还提供了一个安全清晰、抗故障且容错的交易收集机制，确保不可避免的事件记录、安全传输以及一群互不信任的利益相关者之间可靠的医疗对话。这有助于在\
  \ PSC 中建立标准化的追踪归因机制 [[30]](#C_019_c14.xhtml#r14_30)。建议的区块链设计采用独特的模块化方法，以实现最高程度的可追溯性、适应性和匿名性。该架构创建了一个许可型区块链系统，其中卫生管理局\
  \ (HA) 使用成员服务提供商 (MSP)（架构的一个组件）来识别和注册所有参与组织及其最终用户。`Hyperledger fabric` 的 MSP 组件可以提供证书颁发机构\
  \ (CA)，或者提供的 CA 可以是外部的，例如与活动目录配合使用的 `OpenSSL` 证书。该架构要求使用 MSP 来在互不信任的各方之间创建机密环境 [[31]](#C_019_c14.xhtml#r14_31)。\n\
  \n最后，排序服务 (OS) 和对等节点是 `Hyperledger fabric` 设计的核心。`Hyperledger fabric` 对等节点维护账本副本，运行智能合约（也称为链码）、背书并提交交易。操作系统从客户端应用程序接收授权交易，并将它们组织成区块，带有背书方的加密数字签名以及批准贵族的签名，最后将这些区块转发给系统中的有望节点，以根据授权策略进行验证\
  \ [[32]](#C_019_c14.xhtml#r14_32)。图 14.2 显示了基于 `Hyperledger fabric` 区块链的架构。\n\n\
  ![图 14.2 基于 Hyperledger fabric 区块链的架构。](img/Fig14_02.jpg)\n\n**图 14.2** 基于 Hyperledger\
  \ fabric 区块链的架构。\n\n#### 14.4.1.1 基于 Hyperledger Fabric 区块链架构的药品追踪流程\n\n制造商发起一项业务交易提案，根据区块链的背书策略，该提案将与网络的所有对等节点共享。背书策略是一组预先指定的策略，规定了对等节点可以签署/检查每笔交易的程度。这些交易提案由背书策略中指定的总节点数执行。交易提案的结果（也称为背书）连同背书对等节点的数字签名、读/写\
  \ (RW) 集一起共享，并作为提交提案的确认发送回用户/客户端应用程序。当足够多的响应到达用户应用程序时，它会检查它们以确定 RW 集是否相同，以确保区块链不会因提案和认证阶段而更新。在此之后，用户应用程序将提案及其响应广播到排序服务\
  \ (OS) 的一笔业务交易中。分布式 OS 使用共识算法，对每个通道转发的业务交易的实施顺序进行适当估算和维护。排序服务按时间顺序将多笔药品传输排序在一个区块中，并将区块哈希链接到前一个区块。然后，操作系统将所有新区块转发给架构上的首要节点。首要节点的任务是使用对话协议将区块传播给组织中其他参与节点。首要节点由联盟选出，然后也被接纳到订阅服务中。对等节点通过“根据链码的认证策略进行背书合法且一致的验证”，同时还验证\
  \ RW 集自上次验证以来未被破坏。如果某些背书不可接受或与 RW 集不匹配，则该操作被标记为非法。或者，记录有效，此外，所有对等节点按预定义顺序将交易添加到通道账本中以确保准确性。有效交易将更新世界状态。无效交易将保留在账本中，但世界状态不会更新。最后，发送交易提议的客户端应用程序将通过系统上的每个对等节点收到通知，告知发生的业务交易成功\
  \ [[33]](#C_019_c14.xhtml#r14_33)，[[34]](#C_019_c14.xhtml#r14_34)，[[35]](#C_019_c14.xhtml#r14_35)。\n\
  \n### 14.4.2 基于 Hyperledger Besu 区块链的架构\n\n\n\n\n为了生成一个具有私有访问权限的许可区块链以供 PSC 使用，基于\
  \ Hyperledger Besu 区块链的架构允许使用关联网络账户来创建特定组织及其用户。Hyperledger Besu 利用固有的基于基础设施的公钥进行数字签名，并对业务交易/事务进行认证；每个节点的地址用于中间节点的唯一识别。为了区分存储过程、管理过程和业务逻辑，建议结合使用\
  \ EthSigner 与基于 Hyperledger Besu 区块链的架构，作为钱包服务的第三方供应商。交易被接受后，EthSigner 平台将使用存储的私钥生成签名，并通过一个完全合法的签名向以太坊客户端广播业务交易，以便将其添加到区块链中[36,\
  \ 37, 38]。\n\n为了保护股东之间的交易隐私，架构使用了像 Orion 这样的私有交易管理器（PTM）。符合企业以太坊联盟（EEA）客户端规范的 PTM，允许智能合约中的通用企业逻辑仅对远程且受限数量的参与者可见，从而使每笔业务交易及与这些智能合约相关的状态也保持私密。Orion\
  \ 是 Hyperledger Besu 的原生 PTM，属于一种 PTM[39]。最后，为了授予不同用户及其个人账户在系统中的准入权，它提供了链上和链下权限。授权系统启用节点和账本权限以供访问，并将网络访问限制为仅特定节点和账户。此外，Hyperledger\
  \ Besu 的权限功能允许实时暂停账户、拒绝访问受损的智能合约，并根据所需的群组详细信息限制操作[40]（图 14.3 展示了基于 Hyperledger Besu\
  \ 区块链的架构）。\n\n![图 14.3 基于 Hyperledger Besu 区块链的架构。](img/Fig14_03.jpg)\n\n**图 14.3**\
  \ 基于 Hyperledger Besu 区块链的架构。\n\n#### 14.4.2.1 基于 Hyperledger Besu 区块链架构的药品追踪流程\n\
  \n本节详细描述了如何在基于 Hyperledger Besu 区块链的系统中，在不同股东之间执行和通信药品相关的可追溯性交易。当组织用户想要执行交易时，他们将首先通过分布式应用（DApp）向\
  \ Hyperledger Besu 电子投票机（EVM）节点发送签名的私有交易请求。签名交易包括接收者地址列表或隐私组 ID、发送者地址、交易类型、交易载荷等。为了解释群组的机密性，所有中间节点通过唯一的隐私组\
  \ ID 被 Orion 识别。Orion 使用隐私组 ID 存储每笔私有交易。基于 Hyperledger Besu 区块链架构的节点维护区块链的公共世界状态和每个隐私组的私有状态。私有状态包含不在全球复制的世界状态中共享的数据。隐私组仅允许一组账户/节点访问特定数据。应用操作员接口通过\
  \ JSON-RPC 经由私有交易处理程序（PTH）向 Orion 执行交易发送任务。Orion 根据私有组 ID 或接收者地址识别，将交易分配给其他 Orion\
  \ 节点。一旦 Orion 节点接收到交易，它将其存储在状态记录中，并将交易哈希返回给 PTH。除了私有交易外，PTM 还会创建一个用于传输的隐私标记交易（PMT），该交易被包含在账本的区块中并进行传输。系统中每个节点上的主网交易处理器将处理\
  \ PMT，并将交易传递给合约，在包含一致的预编译智能合约的节点上执行。合约使用交易哈希值查询 Orion 以获取私有交易，并将业务交易移交给私有交易处理器；它执行交易并将读写（RW）过程发送到私有状态，以更新其余参与节点。缺少预编译合约的节点将忽略标记交易[41,\
  \ 42, 43]。\n\n### 14.4.3 基于以太坊的架构\n\n以太坊是一种无许可的公共区块链技术，任何人都可以对其进行编辑[44]。智能合约使用 Solidity\
  \ 编写；测试和编译通过 Remix 集成开发环境（IDE）完成。Remix 是一个基于 Web 的工具，用于实现和调试智能合约代码，也可以检查代码的健壮性。智能合约将由生产商提交，该合约包含生产药批的所有事实，包含说明以及在供应链环境中触发事件。每当新成员加入系统时，他们将能够使用这些操作，因为这些操作完全存储在分布式账本中，因此他们可以轻松观察某些生产药批的过去交易。生产商可以选择将药批的图片上传到星际文件系统（IPFS），以便参与人员可以轻松访问和查看药批树。对于药批的销售，必须先进行铸造；然后生产商将通过触发事件向其他参与者宣布新获得的药批可供交易。想要购买新获得药批的参与生产商需要执行特定函数以进行药批转移，交易完成后，事件将通知参与者宣布新的药批所有者[45]。在\
  \ FDA 批准之前，生产商将无法提交药批的智能合约；然而，由于简化考虑，该授权未在智能合约中实现（图 14.4 展示了基于以太坊的区块链架构）。\n\n![图\
  \ 14.4 基于以太坊的区块链架构。](img/Fig14_04.jpg)\n\n**图 14.4** 基于以太坊的区块链架构。\n\n#### 14.4.3.1\
  \ 基于以太坊架构的药品追踪流程\n\n\n\n智能合约将通过持有者 ID 等特性实现，并包含最近合约持有者的以太坊位置[46]。关键点在于持有者 ID 是主要位置而非映射，因为批次智能药品合约只能有一个持有者\
  \ ID，每当持有权发生变更，交易/动作就会被释放并存储在区块链中，这些动作用于追踪药品批次的初始信息[47]。智能合约代表特定的一批药品，还包含批次名称、批次价值、总箱数、每箱价格及其实物照片等其他特征[48]。此外，三个必需的认证属性映射允许在智能合约内访问生产商、供应商和药剂师等服务。智能合约具有多种角色，执行药品批次的生产流程和销售流程[49]。此外，生成的药品批次信息包含作为输入参数的药品批次活动详情，包括批次名称、批次价值、总箱数、每箱价格及其实物照片。而且，生产商可选择将照片上传至\
  \ IPFS，IPFS 照片的哈希函数将被存储并通过另一属性检索。智能合约与 IPFS 的连接比例为 1:1，因为每个药品批次一次只能上传一张照片到 IPFS[50]。\n\
  \n### 14.4.4 Hyperledger Fabric、Hyperledger Besu 和 Ethereum 架构的比较\n\n本节对三个讨论的基于区块链的平台进行深入实用的评估，强调其优缺点。虽然\
  \ Ethereum 可设为私有系统，但本关联将其视为公共网络。比较特征汇总自先前研究建议、扩展、真实文献及部分进行中项目[51]。\n\n与基于 Ethereum\
  \ 的架构相比，基于 Hyperledger Fabric 的架构和基于 Hyperledger Besu 的架构旨在作为独立、有效的 B2B 系统。Ethereum\
  \ 是一种略微面向 B2C 的方法，天然不支持机密性或个人记录/交易的维护。Hyperledger Fabric 和 Hyperledger Besu 支持快速最终确认并提供高交易速率。Hyperledger\
  \ Fabric 中的智能合约易于升级，因为它们使用标准软件设计语言，这与使用特定领域语言的 Hyperledger Besu 区块链架构和 Ethereum\
  \ 区块链架构不同。Hyperledger Fabric 区块链架构没有 Besu 和 Ethereum 可用的改进结构的适当共识。Hyperledger Fabric\
  \ 的系统配置、格式化和分发非常高，但因所有模块均已容器化，故易于管理和升级。使用 Hyperledger Fabric 区块链架构也带来了改进的客户请求功能；然而，它增加了消费端的控制器数量。对于由物理和逻辑双重包含来管理的专有行政和准入，Hyperledger\
  \ Fabric 区块链架构优于 Hyperledger Besu 和 Ethereum 区块链架构。在治理计划中，基于 Hyperledger Fabric\
  \ 和基于 Hyperledger Besu 的区块链均提供了一些最佳的替代方案和主动追踪解决方案的结构[52]。**表 14.3** 旨在提供上述架构比较效果的深度细节。\n\
