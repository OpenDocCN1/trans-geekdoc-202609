  \ Doi:[10.1093/ijlit/eaaa003](http://doi.org/10.1093/ijlit/eaaa003)。\n\n# 9 区块链与智能合约导论——原理、应用与安全\n\
  \nAdarsh Singh, Ananya Smirti, and Raghav Gupta\n\n曼尼帕尔大学斋普尔分校\n\nChamitha de Alwis\n\
  \n斯里贾亚瓦德纳普拉大学\n\nAnshuman Kalla\n\n奥卢大学\n\nDOI: [10.1201/9781003224075-9](http://doi.org/10.1201/9781003224075-9)\n\
  \n## 9.1 导论\n\n过去几年见证了区块链技术流行度的巨大增长。区块链技术的第一个也是最流行的用例是 `Bitcoin`（加密货币），它于 2008 年问世。从那时起，研究人员、开发人员和从业者已经意识到区块链技术的潜力，并将其用于医疗保健、供应链管理、电子投票、能源管理、教育和电信等各个领域的众多其他应用。区块链已成为一种去中心化、分布式且安全的技术，用于存储交易记录和有价值的数字资产。区块链通过以点对点（P2P）的方式连接称为节点的计算和存储机器，充分利用加密机制，并在所有节点上运行共识算法而创建。确实，区块链是一种分布式账本技术（DLT），其本质是在底层\
  \ P2P 网络中的所有节点上复制数据库。此外，加密技术和去中心化决策的使用使区块链成为一项极具前景的技术。\n\n区块链技术的简要历史如下。区块链最著名的用例比特币，由一个使用中本聪（Satoshi\
  \ Nakamoto）化名的团体或个人于 2008 年引入。该化名发表了一份白皮书，重点关注点对点电子现金系统 [[1]](#C_014_c9.xhtml#r9_1)。该论文的主要目的是为去中心化的无信任环境中的双重支付问题提供解决方案。这种电子现金系统催生了比特币加密货币。然而，诸如默克尔树、哈希、数字签名、P2P\
  \ 网络和分布式存储等底层技术和概念，在比特币（以及作为底层技术的区块链）出现之前很久就已存在。例如，Ralph Merkle 于 1979 年提出了默克尔树或哈希树的概念\
  \ [[2]](#C_014_c9.xhtml#r9_2)。Stornetta 和 Haber 于 1991 年引入了一种旨在对电子文档进行数字时间戳标记的系统\
  \ [[3]](#C_014_c9.xhtml#r9_3)。智能合约的概念由 Nick Szabo 于 1994 年提出 [[4]](#C_014_c9.xhtml#r9_4)。因此，中本聪将这些现有技术和概念有利地结合在一起，重新诠释了区块链技术的含义。\n\
  \n本章其余部分的组织结构如下。第 9.2 节 阐述区块链基础、通用区块结构、交易流程、区块链显著特征及区块链类型。第 9.3 节 讨论智能合约、其特性以及支持智能合约的不同平台。第\
  \ 9.4 节 简要概述区块链和智能合约的广泛应用。第 9.5 节 简要介绍针对区块链和智能合约的各种安全攻击。最后，第 9.6 节 总结本章。\n\n## 9.2\
  \ 区块链\n\n\n\n\n\n### 理解区块链\n\n首先，让我们尝试理解什么是区块链，它是如何运作的，以及它的显著特征是什么。简单来说，区块链是最流行的\
  \ DLT（分布式账本技术）类型，其中所有的交易记录和数据（价值数据）都被存储、共享并同步到 P2P 网络中所有节点上 [5]。这一记录集合或数据库被称为`digital\
  \ ledger`（数字账本）。P2P 网络中的节点是参与的机器，它们贡献自己的计算和存储能力来建立和维护区块链设施。此外，由于区块链中的数字账本是共享的；因此，它在所有节点上被复制，从而形成一个分布式账本。这意味着\
  \ P2P 区块链网络中的所有节点都在本地存储了整个数据库（即数字账本）的精确副本。由任何节点执行的账本中的任何合法更新都会被广播，以便每个节点在分布式数字账本的当前状态方面保持同步。\n\
  \n区块链与其他类型 DLT 的区别在于它用于分布式账本的数据结构。从数据结构的角度来看，区块链是一个按时间顺序连接的记录（又称区块）链表 [6]。每个记录或区块将一组在时间窗口内发生的有效交易打包在一起（使用加密技术）。此外，每个区块都存储前一个区块的指针（即哈希值）。在给定的时间窗口过后，会创建一个新区块，并使用基于加密哈希的链在逻辑上与前一个区块相连。因此，该技术被称为`blockchain`（区块链）。随着时间的推移，会创建更多的区块，加上时间戳，并追加到现有的区块链中。因此，区块链的大小随时间增长，新区块以纯追加模式添加。值得注意的是，区块链广泛使用加密技术来保护账本（即数据库）的安全，因为它保存在\
  \ P2P 网络中的各个（不受信的）节点上。此外，需要共识算法来就区块链中要执行的每次更新在节点间建立一致。\n\n#### 9.2.1 区块结构\n\n现在，是时候了解区块链中区块的结构了。区块只是一个用于存储一组有效交易和数据的容器。虽然典型的区块结构可能因需求、平台和应用而异，但为了理解基本概念，我们讨论比特币区块链中区块的结构。从概念上讲，一个区块分为两部分：区块头和区块体。比特币区块头的结构有六个字段，总大小为\
  \ 80 字节 [1]。区块体大小可变，存储一组交易以及交易计数器。此外，平均而言，一笔比特币交易的大小至少为 250 字节，平均交易大小为 500 字节 [7,8]。此外，每个区块的比特币交易数量通常超过\
  \ 500 笔，平均每个区块约 2,000 笔交易 [7,8]。任何区块链的第一个区块被称为创世区块，它没有指向的前一个/父区块。图 9.1 展示了区块的结构。\n\
  \n![图 9.1 区块结构。](img/Fig09_01.jpg)\n\n**图 9.1** 区块结构。\n\n##### 9.2.1.1 区块头\n\n表\
  \ 9.1 简要描述了比特币区块头中的六个字段。`version`（版本）字段基本上用于跟踪区块链（软件）升级。`timestamp`（时间戳）字段记录矿工开始挖掘新区块时的\
  \ Unix 纪元时间。为了将每个区块与其前一个区块相连，使用了`previous block hash`（前一个区块哈希）字段。该字段为 32 字节，存储前一个区块的加密哈希值（通常为\
  \ SHA256 哈希 [9])。\n\n**表 9.1** 区块链中区块头的字段 [12]\n\n| 字段 | 字段大小 | 数据类型 | 简要说明 |\n\
  | --- | --- | --- | --- |\n| Version（版本） | 4 字节 | Int32 | 指示当前区块需遵循的验证规则集。 |\n|\
  \ Timestamp（时间戳） | 4 字节 | Unit32 | 存储矿工开始挖掘过程时的 Unix 纪元时间（自 1970-01-01 00:00:00\
  \ UTC 以来经过的秒数 [13])。 |\n| Previous block hash（前一个区块哈希） | 32 字节 | Char | 存储前一个区块的双重\
  \ SHA-256 哈希值，使所有区块在逻辑上链接在一起。 |\n| Difficulty/nBits（难度/位数） | 4 字节 | Unit32 | 目标阈值的编码版本。\
  \ |\n| Nonce（随机数） | 4 字节 | Unit32 | 矿工添加到区块头的任意数字，以便计算区块哈希时，获得的值小于或等于目标阈值。 |\n|\
  \ Merkle Root（梅克尔根） | 32 字节 | Char | 包含通过梅克尔树哈希获得的最终（根）哈希值。在该树中，所有叶子节点基本上是当前区块中所有交易的哈希值。\
  \ |\n\n`nbits`字段只是目标哈希值（一个 256 位数字）的编码和紧凑表示，用于挖掘新区块 [10]。`nonce`是挖矿节点不断更改的字段，以计算当前区块头的哈希值，使得获得的值小于等于目标值。换句话说，矿工通过为`nonce`字段尝试随机数不断对区块头进行哈希运算，直到区块哈希值小于等于目标值时停止。目标哈希值根据当前难度级别设定\
  \ [10]。\n\n`difficulty`（难度）基本上是挖掘新区块以找到可接受的区块哈希值所需的相对计算量（工作量）。创世区块的难度被认为是 1。如果当前难度级别为\
  \ 2，则意味着挖掘新区块所需的计算工作量是挖掘创世区块所需计算量的两倍。\n\n在挖掘一组 2016 个区块后，难度会被重新计算，这随后设定目标值，并相应地决定`nbits`字段的值。改变难度级别的原因是为了确保区块间挖掘时间保持大致恒定，即比特币中的约\
  \ 10 分钟 [11]。值得注意的是，上述解释假设使用的是工作量证明（PoW）共识算法。\n\n为了计算`Merkle Root`（梅克尔根）字段的值，将当前区块中所有交易的加密哈希值作为梅克尔树的叶子节点。然后通过哈希子节点的连接（哈希）值来计算非叶子节点。在二叉梅克尔树的情况下，每个非叶子节点有两个子节点。计算非叶子节点值的过程持续进行，直到获得根哈希值。因此，`Merkle\
  \ root hash`（梅克尔根哈希）字段提供了一种紧凑表示（即固定大小位）当前区块中所有交易的方法。该字段允许任何实体验证给定区块中打包交易的合法性 [14]。\n\
  \n##### 9.2.1.2 区块体\n\n\n\n\n区块体包含一组有限的有效交易，这些交易需要在区块链上得到确认。比特币区块的主体由交易和交易计数器组成。然而，对于其他区块链，主体的内容有所不同。例如，在以太坊区块链中，区块体包含一个名为\
  \ `state` 的额外部分，以支持智能合约的存储和执行 [15]。一个区块中的交易数量取决于允许的最大区块大小（例如比特币区块链为 1 MB [7]）以及要包含在区块中的每笔交易的大小。因此，矿工倾向于从交易池中选择体积小、手续费高的交易。换句话说，矿工旨通过在新区块中容纳尽可能多的交易来最大化其利润。此处，交易手续费是指交易用户承诺支付给成功挖出新区块并将其交易确认上链的矿工的金额。总之，区块体可以包含交易和智能合约。此外，区块体的大小是可变的，因为包含在一个区块中的交易数量不是固定的。\n\
  \n##### 9.2.2 区块挖矿中的流程\n\n区块创建的完整过程分为几个步骤，如图 9.2 所示。这些步骤需要多个实体和机制的参与，它们对于创建新区块是必需的。下面将对这些内容进行讨论。\n\
  \n![FIGURE 9.2 Flow of transaction and block mining.](img/Fig09_02.jpg)\n\n**图 9.2**\
  \ 交易与区块挖矿的流程。\n\n第一步是在属于鲍勃和爱丽丝的两个数字账户之间发起一笔交易。交易的一个简单示例是将加密货币（如比特币）从一个账户发送到另一个账户。区块链中的每个账户都有一对相关联的公钥和私钥。账户通过其地址来标识，该地址就是与该账户关联的公钥的加密形式。用户可以通过他们的钱包访问这些地址，钱包是用于创建和管理多个地址以执行交易的软件应用程序\
  \ [16]。\n\n如图 9.2 所示，鲍勃向爱丽丝发送一些加密货币，并使用他的私钥对交易进行数字签名。交易签名完成后，会被广播到区块链 P2P 网络中直接相连的节点。P2P\
  \ 网络中的每个节点验证该交易，并将其转发给其对等节点（即直接邻居）。因此，新交易会在整个 P2P 网络中传播 [17]。每个挖矿节点（即有权在区块链上创建新区块的节点）都维护一个未确认交易的临时集合（内存池\
  \ [18])。随后，参与的矿工从他们的内存池中选择一组未确认交易。值得注意的是，某些区块链允许用户指定其愿意支付给成功处理该交易的矿工的交易手续费。在这种情况下，矿工通常会根据交易手续费选择未确认交易，以最大化利润。接下来，每个参与的矿工为选定的交易构建一棵默克尔树，并最终获得一个默克尔根哈希\
  \ [1]。在此步骤之后，即可挖掘新区块。为了挖掘新区块，矿工为区块加上时间戳，填充区块头中的不同字段，并将交易添加到区块体中。随后，矿工开始在预定义的难度目标范围内计算区块的哈希值（如第\
  \ 9.2.1 节所述）。区块挖矿要求矿工不断更改区块头中的 `nonce` 值，直到获得满足难度等级且小于或等于目标值的区块哈希值（参见第 9.2.1 节）。这种计算需要消耗大量能源，因为区块头哈希运算是以暴力方式进行的。\n\
  \n然后，所有矿工相互竞争，以在其他人之前计算出区块哈希值。最早成功找到哈希值的矿工是获胜矿工 [19]。该获胜矿工随后将新创建的区块广播到区块链 P2P 网络\
  \ [17]。每个矿工通过首先验证接收到的区块中的交易，然后使用区块头中的 `nonce` 值重新计算区块哈希以确保合规性，来验证新创建的区块。如果大多数矿工批准新创建的区块，则达成共识，节点随即将新区块添加到其区块链的本地副本中。同样，新区块被追加到区块链，而新区块中的所有交易得到确认。此外，获胜矿工将获得将新区块挖掘到区块链上的奖励。\n\
  \n### 9.2.3 区块链的特性\n\n区块链提供了多种特性，如图 9.3 所示。这些特性包括透明性、不可抵赖性、去中心化、假名性、不可篡改性、可用性、可溯源性、自动化、可审计性、快速处理、建立信任和降低运营支出（lower-OPEX）。\n\
  \n![FIGURE 9.3 Blockchain features.](img/Fig09_03.jpg)\n\n**图 9.3** 区块链特性。\n\n####\
  \ 9.2.3.1 不可篡改性\n\n如前所述，区块链是一个仅追加型数据库，只能添加新信息（即包含交易数据且可选包含智能合约的新区块）。然而，修改或删除任何现有信息在计算上是不可行的，这使得区块链具有不可篡改性或防篡改性。从根本上说，不可篡改性源于区块创建方式：使用加密技术创建区块，通过基于哈希的链在逻辑上将它们串联在一起，并利用共识算法在\
  \ P2P 区块链网络的所有节点上进行复制。数据的任何微小变化都会产生不同的哈希值。因此，区块中已确认交易的任何更改都会改变该区块的哈希值。随着区块链的增长和\
  \ P2P 区块链网络规模的扩大，存储在区块上的数据变得更加难以篡改。例如，如果修改了对应第 100 号区块的任何数据，则该区块的哈希值将发生变化。由于前一个区块的哈希值连接着下一个区块，第\
  \ 100 号区块的哈希值任何变化都会影响后续区块（即 101、102 等）的哈希值，一直到最近的区块。这种级联效应在区块链网络中显而易见，使得区块链具有不可篡改性\
  \ [20]。\n\n#### 9.2.3.2 去中心化\n\n\n\n该属性意味着区块链不受中央权威机构管辖。这是因为在 P2P 区块链网络中，每个节点都拥有参与所有操作的平等权利，因此，任何节点都可以向现有的分布式账本添加新区块\
  \ [21]。与传统系统相比，去中心化架构防止了任何系统出现单点故障。中心化系统容易发生单点故障，这意味着任何漏洞都可能导致系统完全或部分瘫痪。此类故障可能导致数据泄露以及身份与访问管理（IAM）功能受损\
  \ [22]。得益于去中心化和分布式的 P2P 网络（共同管理区块链），即使其中一个节点受到攻击，网络中的其他节点仍将继续运行，并确保系统平稳工作。去中心化还导致了去中介化，即通常存在于中心化系统中的所有中介机构，在基于区块链的系统中不再需要。\n\
  \n#### 9.2.3.3 透明性\n\n透明性一直是中心化系统的主要问题之一，其中诸如谁在访问用户数据以及数据如何被处理等详细信息对用户不可见。此外，当此类中心化系统中存在多个第三方时，透明性问题变得更为重要。区块链通过允许\
  \ P2P 网络的成员读取区块链化系统中发生的交易、数据和其他活动，为该问题提供了解决方案。此外，根据区块链的类型（例如公有链或私有链）和应用领域，透明度级别可能有所不同。例如，在公开无许可区块链（如比特币）的情况下，数据是透明的，且任何用户均可公开读取或查询（即完全没有限制）。然而，在许可区块链的情况下，数据保持机密，仅对经过认证的授权方可用\
  \ [23]。尽管如此，一旦实体成为区块链化系统的成员，区块链中存在的一切皆为透明。\n\n#### 9.2.3.4 匿名性\n\n区块链允许其用户在无需披露现实身份的情况下参与并扮演不同角色。这是通过为区块链化系统中的每个实体分配唯一的数字身份（ID）来实现的。通常，会为每个实体唯一生成一对公私钥，ID\
  \ 则以某种方式从公钥派生而来。简单来说，ID 是一个加密的公钥，其中哈希处理是加密过程中涉及的工序之一。使用此类 ID 不会泄露参与实体的现实身份 [21]。尽管如此，值得注意的是，如果系统设计不当或用户不够谨慎，仍有可能追溯到用户的真实身份\
  \ [24]。因此，只要交易无法追溯到用户，用户的隐私就能得到保护。\n\n#### 9.2.3.5 不可抵赖性\n\n不可抵赖性意味着一旦实体在区块链上执行并提交了任何活动，就无法否认/反驳该活动\
  \ [25]。不可抵赖性服务的目标是生成、收集并保存已执行数字活动的证据，以便日后能够证伪虚假的抵赖行为 [26]。在区块链中，非对称加密和数字签名等加密技术实现了不可抵赖性\
  \ [27,28]。每笔交易在被推送到区块链平台之前，都由发送方进行数字签名。得益于区块链技术的不可抵赖性，发送方无法否认其发送的内容，接收方也无法否认其接收的内容\
  \ [27]。\n\n#### 9.2.3.6 快速处理\n\n通常，传统系统包含一个中心化权威机构，该机构可能会雇佣一个或多个第三方来运行和管理所有操作及相关数据。这基本上是为了在传统系统中建立信任\
  \ [29]。有时，会有多个第三方共同构成系统。例如，一笔金融交易可能面临清算所、存管机构和支付网关等多个受信中介机构 [30]。此类中介机构的存在增加了操作/处理延迟。说明区块链快速处理能力的另一个例子是其用于赋能\
  \ 5G-IoT 生态系统时 [31]。具体而言，利用区块链赋能边缘网络和核心网，可以消除物联网消息必须一路传输到云端等中心化系统的需求。因此，作为一种去中心化和分布式技术，区块链允许去除此类第三方中介，从而实现快速处理。\n\
  \n#### 9.2.3.7 低成本\n\n基于区块链的系统中的任何交易都可以在对等层面进行，无需受信第三方。通常，受信方会为其提供的服务收取一定费用。例如，使用环球同业银行金融电讯协会（SWIFT）系统进行的国际银行交易可能需要经过许多中间银行。这些银行除了收取\
  \ SWIFT 费用和汇率费用外，各自还会收取一定手续费 [32]。在基于区块链的系统中，不存在第三方中介机构；因此，总成本低于传统系统。\n\n#### 9.2.3.8\
  \ 来源溯源\n\n来源溯源是提供数据生命周期完整历史的一种方式，即可以从当前时间点追溯到起始点发生的各种状态变更或修改 [33]。换句话说，数据溯源因此提供了关于数据如何获得、存储在何处、如何被利用等完整信息。由于账本分布在\
  \ P2P 网络上，且网络中的每个节点均可访问，溯源特性很好地诠释了区块链。溯源被证明是区块链技术在供应链管理、土地登记和珠宝交易等领域的一个有用特性 [34]。\n\
  \n#### 9.2.3.9 可审计性\n\n区块链上的每笔交易都带有时间戳，并使用用户的私钥进行数字签名。这使得网络能够验证每笔交易 [21]。时间戳允许节点追溯先前的记录并记录交易的具体细节。这提高了交易的透明度和安全性\
  \ [35]。\n\n#### 9.2.3.10 可用性\n\n可用性理想情况下意味着给定系统应始终处于运行状态，并无论发生任何故障、问题或持续攻击，都能为其用户提供所需服务。由于去中心化和分布式特性，区块链具备这一特性。与中心化系统不同，去中心化区块链系统中的任何节点都同等具备提供分布式账本访问的能力。此外，可用性适用于系统可用性和交易可用性\
  \ [36]。此处，区块数据必须可供合法用户按需获取，以便他们随时随地查看交易数据，而不会出现数据损坏、不可访问或不一致的情况 [25,36]。\n\n####\
  \ 9.2.3.11 自动化\n\n\n\n区块链通过使用智能合约来促进自动化，智能合约是模拟协议条款和条件的自执行计算机程序。自动化构成了开发去中心化应用（dApps）的基础，并提高了交易的效率和速度[37]。此外，区块链中的自动化减少了人工干预，消除了对第三方的需求，并提高了依赖区块链的各个领域的运营效率[38]。\n\
  \n### 9.2.4 区块链类型\n\n本节讨论三种不同类型的区块链。\n\n#### 9.2.4.1 公有链\n\n公有链是一个开放、无限制且无需许可的分布式账本系统。在这样的开放网络中，节点有权访问所有记录、在区块链上添加数据、验证交易的能力，甚至参与挖矿过程[39]。公有链充分利用了去中心化和可访问性的特性（尽管并非完全[40]），没有任何限制。公有链最常见的例子是比特币和以太坊。\n\
  \n使用公有链的优势是高度透明、无需信任、开放且最优去中心化[41]。由于所有内容都被记录并对所有人可见，公有链通过消除对受信任第三方的需求，形成了一个无需信任的环境。网络中的每个实体都为区块链的增长做出贡献，并防止了对中介的需求。系统中去中心化的程度意味着系统的容错弹性水平。与中心化系统相比，完全去中心化的系统提供了更好的安全性和容错弹性[42]。然而，公有链的缺点是能源效率低、因高透明度导致隐私较差、收敛缓慢、更容易受到攻击、高度不受监管，因此不适合某些应用[41]。\n\
  \n#### 9.2.4.2 私有链\n\n私有链是一个封闭、受限且需许可的区块链，其中每个节点的网络访问权限不同[43]。此类网络中的大多数节点仅拥有特定权限的访问权，而某些节点可以拥有对网络的完全访问权。因此，这种类型的区块链并非完全去中心化，因为部分许可被限制在中央权威机构[44]。私有链的例子有\
  \ Corda 和 Hyperledger[45]。\n\n私有链的优势（与公有链相比）是更高的吞吐量、低延迟、更好的隐私和更强的可扩展性。由于网络中的权威节点数量较少，达成共识所需的时间更短。因此，私有链可以满足高交易吞吐量的需求（即单位时间内的交易速度）。使用私有链，每秒可处理数千笔交易[46]。与公有链相比，私有链具有更强的可扩展性。这得益于较少的授权节点来管理和验证交易及相关数据。私有链面向需要最大隐私和流程稳定性的企业和组织[47]。私有生态系统使此类组织能够以更高的效率、速度和更少的停机时间运行。另一方面，私有链的缺点是需要受信任的节点、监管机构，且由于由单一组织管理，倾向于中心化[41]。\n\
  \n#### 9.2.4.3 联盟链\n\n联盟被定义为两个或多个个人、组织或政府为实现共同目标而结成的联盟。在联盟链中，联盟中的所有成员都有权在区块链上写入和验证数据。它也是一种像私有链一样的许可区块链[48]。因此，只有来自联盟各成员的选定节点可以参与与区块链相关的操作。这使得联盟链成为一个半去中心化的网络，虽然权力分散在联盟成员之间，但只允许来自各成员的授权节点参与挖矿和验证过程。节点无法在未经每个节点确认的情况下自行向区块链添加信息。每个成员在达成共识中平等参与，这与公有链不同，需要的计算能力显著降低，能耗也更少[49]。\n\
  \n联盟链的优势如下。交易不需要任何费用，因为所有基础设施由成员自己提供，消除了激励交易的需求[50]。联盟链中的权力分配使其免受垄断。区块链回滚、错误交易纠正以及其他与区块链相关的操作，都是由所有成员协议达成的[51]。参与节点较少有利于更快地达成共识和同步。与公有链相比，交易吞吐量更高，从而实现了更好的可扩展性。\n\
  \n## 9.3 智能合约\n\n### 9.3.1 简介\n\n智能合约的概念由计算机科学家和密码学家 Nick Szabo 在 20 世纪 90 年代提出[4]。该概念被引入为一组数字形式的承诺，以及为履行承诺而应遵循的协议。这一概念被比作自动售货机的操作。此外，智能合约的概念预期遵循简单清晰的逻辑，并通过密码学方法进行验证，以比传统的纸质合同更有用、更实用。近年来，随着区块链和\
  \ DLTs 的增长，智能合约的概念被认定为更有用[52]。\n\n区块链通过基于共识机制的去中心化决策来实现智能合约，从而促进许多新兴的基于区块链的应用，如数据市场、能源互联网（EI）和微交易[53,54]。智能合约将传统合同中的合同条款转化为具有明确条件的逻辑和可执行计算机程序[37]。一旦满足预定义要求，合同语句即被执行。此外，由于智能合约遵循面向对象的方法，每个智能合约实例都可以通过其唯一地址访问，而所有智能合约实例都可以驻留在区块链上。智能合约作为不可变记录存储在区块链中，并确保严格的访问控制。\n\
  \n### 9.3.2 智能合约的特性\n\n智能合约部署在区块链上后，提供了一系列特性和优势。以下是基于[37,38,55,56]的一些重要特性（运行在区块链之上）。\n\
  \n#### 9.3.2.1 去中心化操作\n\n\n\n智能合约作为去中心化程序在区块链网络中运行。这使得智能合约能够克服中心化应用面临的各种问题。例如，去中心化运行确保了对单点故障的弹性，即使网络中的一个或多个节点受到攻击，也能自主运行。此外，智能合约服务不受拒绝服务攻击影响，并提供有保障的服务可用性。另外，去中心化运行将数据传输成本和延迟降至最低。\n\
  \n#### 9.3.2.2 不可篡改性\n\n智能合约的执行以交易的形式安全地存储在区块链上。区块链网络在将这些经过加密密封的交易添加到区块链时对其进行验证。一旦智能合约被记录在区块链中，就无法被篡改。此外，随着区块链的增长，智能合约的不可篡改性会增强，因为篡改区块链（在攻击下）所需的时间会随着区块链变长而增加。\n\
  \n#### 9.3.2.3 消除第三方\n\n可信第三方是中心化应用运行所必需的。然而，区块链上智能合约的去中心化特性使其能够在不需要任何第三方服务的情况下运行。这将使大量连接设备能够以去中心化的方式做出决策并执行交易。\n\
  \n#### 9.3.2.4 自主执行\n\n区块链上的 dApps 根据智能合约中定义的条款和条件运行。这些应用将持续运行直到达到终止条件，而智能合约的执行不受任何权威机构或第三方的干预。\n\
  \n#### 9.3.2.5 透明度\n\n在去中心化的点对点网络中运行使节点能够访问区块链上的交易。智能合约执行的每个条款对整个网络都是可见且可供检查的。这使智能合约比中心化应用具有优势，因为执行过程对网络可见。它为执行过程提供了透明度，并使参与用户以及其他节点能够检查智能合约执行的流程。\n\
  \n#### 9.3.2.6 准确性\n\n传统应用涉及人工干预进行数据库管理，这可能导致错误数据被存入数据库。这将引发对存储数据准确性的担忧。然而，智能合约在执行前验证预设条件，并在消除人工干预的同时提高准确性。此外，智能合约是无偏见的，通过提供透明、不可篡改和准确的执行，建立了一个值得信任的执行环境。\n\
  \n#### 9.3.2.7 速度\n\n中心化应用中的流程执行需要在每个流程的不同层级进行文档记录和授权。它还需要第三方和其他中介机构的参与，这增加了复杂性和流程的总体执行时间。相比之下，智能合约执行利益相关者商定的预定义条件，同时消除了不同授权和中介机构的参与。因此，整个处理时间仅取决于合约执行和验证所需的时间。这提高了处理速度。\n\
  \n### 9.3.3 支持智能合约的不同区块链平台\n\n已有多个区块链平台将智能合约作为一项核心功能采用。以下简要介绍这些平台：\n\n#### 9.3.3.1\
  \ 以太坊\n\nVitalik Buterin 于 2015 年开发了 `Ethereum`，旨在提供一个能够支持 `dApps` 的平台 [57]。`Ethereum`\
  \ 还支持使用智能合约在网络上创建和部署 `dApps`。`Ethereum` 上的每个智能合约都有其自己的 `Ethereum` 地址，该地址位于 `Ethereum\
  \ Blockchain` 上。`Ethereum` 地址是指分配给用户和智能合约用于识别的唯一值。该地址允许智能合约在通过 `Ethereum` 网络执行交易时保留资产。此外，`Ethereum`\
  \ 使用“`Gas Fee`”，即执行交易所需的费用 [58]。此费用包括执行合约的计算成本。每个函数或操作根据执行操作的复杂性需要相应的 `Gas Fee`。另外，`Ethereum`\
  \ 支持使用 `Solidity`、`Serpent`、`LLL` 和 `Muran` 等编程语言 [37]。这些程序被编译为机器码并加载到 `EVM`（`Ethereum\
  \ Virtual Machine`，以太坊虚拟机）中执行。\n\n#### 9.3.3.2 Hyperledger Fabric\n\n与 `Ethereum`\
  \ 类似，`Hyperledger Fabric` 也是一个能够运行智能合约和 `dApps` 的分布式账本平台 [59]。`Hyperledger Fabric`\
  \ 旨在使用许可型区块链环境支持企业应用。智能合约在 `Hyperledger` 中也称为 `Chaincode`，在许可型环境中运行，不需要任何交易费用。与\
  \ `Ethereum`（使用虚拟机运行智能合约）不同，`Fabric` 使用 `Docker` 容器。`Docker` 是一个使用操作系统级虚拟化来促进应用独立运行的开源平台\
  \ [60]。这导致开销降低，使平台和应用能够以更快、更节能的方式运行。此外，`Fabric` 支持 `Java` 和 `Golang` 等高级编程语言 [37]。\n\
  \n#### 9.3.3.3 Corda\n\n它是一个专为企业设计的开源分布式账本平台，允许企业进行交易，同时确保严格的隐私 [61]。`Corda` 支持在\
  \ `JVM`（`Java Virtual Machine`，Java 虚拟机）上运行的高级编程语言，如 `Java` 和 `Kotlin` [62]。`Corda`\
  \ 中的智能合约不像 `Ethereum` 和 `Hyperledger Fabric` 那样被整齐地封装在包中。相反，合约被拆分为不同的部分，以增加灵活性，同时满足受监管的金融和工业机构的需求。智能合约的数据存储在称为\
  \ `ContractStates` 的状态对象中。这些 `ContractStates` 包含用于执行合约中定义的函数和操作的不透明数据。参与方可以在发生法律纠纷时依赖这些合约\
  \ [37]。\n\n#### 9.3.3.4 Stellar\n\n`Stellar` 是一个基于区块链的开源平台，可促进货币交易和支付 [63]。`Stellar`\
  \ 允许用户执行创建、发送和交易多种形式货币的数字表示等操作。此外，`Stellar` 支持 `Python`、`JavaScript`、`Golang` 和\
  \ `PHP` 等语言 [37]。与 `Fabric` 类似，`Stellar` 也需要 `Docker` 容器来执行程序 [60]。另外，与其他平台相比，`Stellar`\
  \ 的交易处理时间快得多。这是由于使用了 `Anchors`。`Anchors` 通过持有用户存款向 `Stellar` 网络发放信用额度。`Stellar`\
  \ 交易基于发布的锚点进行。这使得交易时间缩短至甚至不到 5 秒 [37]。\n\n#### 9.3.3.5 EOS\n\n\n\n\n##### EOS 平台概述\n\
  \nEOS 是一个去中心化且可扩展的平台，专为企业级应用设计，同时也可运行 dApps。该平台支持公有链和私有链部署 [64]。合约具有图灵完备性，并使用 C/C++\
  \ 进行开发。此外，EOS 中使用的智能合约与以太坊类似，每次执行合约时都会创建一个新的合约实例。另外，EOS 中的合约不需要任何交易手续费 [37]。此外，EOS\
  \ 中的节点协作出块而非竞争出块，这也提高了安全性 [65]。\n\n## 9.4 区块链与智能合约的应用\n\n区块链结合智能合约，凭借其去中心化、不可篡改、透明、抗抵赖、假名性和快速处理等显著特性，带来了巨大的机遇。医疗保健\
  \ [66]、金融 [67]、房地产、音乐产业 [68]、保险 [69] 和媒体 [70] 等领域只是其中一部分，它们已经意识到区块链和智能合约的潜在优势，并因此开始使用它们。例如，在医疗保健领域，区块链可实现患者和医疗设备记录的数字化维护、药品供应链管理、远程患者监测和健康数据分析\
  \ [71]。涉足该领域的公司包括 Medicalchain [72]、IRYO [73] 和 Burstiq [74]。许多此类公司旨在让患者完全控制并拥有其电子病历，并允许患者决定与谁共享其医疗记录。保险是另一个可以利用区块链和智能合约提升的领域。区块链和智能合约在保险领域可实现的功能包括：消除对中介的需求、更高效地检测欺诈、协助建立动态的保险公司/客户关系，并使申请流程更加以客户为中心\
  \ [75]。\n\n房地产是另一个拥抱区块链的领域。得益于智能合约和分布式账本，客户可以在一个安全高效的环境中租赁、购买、投资和借贷。例如，基于区块链的公司\
  \ Propertyclub 允许用户利用区块链通过其门户浏览、出售、出租、购买和投资房产 [76]。因此，区块链正成为一种极具前景的未来技术，能够支持和增强商业的许多领域和域。\n\
  \n## 9.5 区块链与智能合约的安全性\n\n区块链和智能合约蕴含巨大潜力，由于底层特性如加密技术、去中心化和分布式数据库，被认为是安全的，这使得攻击者极难进行黑客攻击或篡改。特别是，基于区块链的系统不会遭受与中心化系统相关的问题，如单点故障、对第三方或中介的必要性、权威机构保持完全控制，以及最重要的是用户隐私问题。\n\
  \n尽管如此，区块链本身仍存在安全和隐私问题。过去发生的许多安全攻击，如 DAO 攻击、自私挖矿攻击、Parity 多签攻击和 51% 攻击 [77, 78,\
  \ 79]，表明该技术仍处于发展阶段。一些与区块链和智能合约相关的安全攻击在 表 9.2 中简要讨论。尽管如此，区块链社区和联盟正持续致力于缓解这些攻击。\n\n\
  ### 表 9.2：区块链和智能合约的各类攻击\n\n| 攻击焦点 | 攻击 | 简要描述 |\n| :--- | :--- | :--- |\n| 区块链 |\
  \ 多数攻击 | 当攻击者积累的算力超过其他人时，其能够控制整个区块链并改变诚实节点对网络的视图 [79, 80]。 |\n| 区块链 | 日蚀攻击 | 攻击者填充诚实节点的数据结构，以将其隔离并操纵其对区块链的视图（即\
  \ P2P 网络中的账本）。该攻击是其他攻击（如多数攻击和 DDoS 攻击）的基石 [81]。 |\n| 区块链 | DoS 攻击 | 攻击者向网络发送异常大量的请求，瘫痪网络处理真实流量的能力\
  \ [82]。攻击者旨在使网络的矿池、电子钱包、加密货币交易所和其他金融服务断开连接 [80]。 |\n| 区块链 | 女巫攻击 | 由单个用户控制的多个节点。通过利用它们，可能会排挤诚实节点。此攻击通常用于控制网络，也可能为更大规模的攻击（如\
  \ DDoS 攻击或多数攻击）铺平道路 [83]。 |\n| 区块链 | 自私挖矿攻击 | 恶意矿工（或矿工组）私下挖掘新区块并不向网络其余部分发布。此类矿工持续挖掘新区块，直到其本地（私有）区块链副本比当前公开可用的区块链更长。在获得足够领先优势后，自私矿工发布（广播）更长的区块链，该链将被网络接受。自私矿工的一个明显意图是最大化获得的奖励\
  \ [28, 80]。 |\n| 区块链 | 竞争攻击 | 竞争攻击是一种双重支付尝试。它要求接收方接受未确认的交易作为付款。这是通过向目标发送欺诈交易、向矿池发送合法交易来实现的\
  \ [83, 84]。 |\n| 智能合约 | DAO 攻击 | DAO 黑客事件发生于 2016 年 6 月，攻击者窃取了超过 360 万个以太币（当时价值\
  \ 6000 万美元）。智能合约中的一个称为重入的漏洞是 DAO 攻击的根源 [77, 85]。 |\n| 智能合约 | Parity 多签钱包攻击 | 钱包开发者创建了一个部署在以太坊上的公共库，以节省每笔交易产生的\
  \ Gas 成本。攻击者利用此公共库窃取了超过 150,000 个以太币（3000 万美元）[77, 86]。 |\n| 智能合约 | 整数下溢/上溢攻击 |\
  \ 以太坊和 Solidity 中的漏洞为攻击者传递某些参数创造了途径，这些参数可被利用以获取比原本可用更多的账户余额 [77]。 |\n\n## 9.6 结论\n\
  \n\n\n\n## 区块链与智能合约：讨论与参考文献\n\n本章详细讨论了区块链与智能合约。介绍了区块链概念，解释了区块结构、区块挖矿的流程、区块链特性以及区块链类型。随后，介绍了智能合约的概念，并详述了其特性和支持智能合约的区块链平台。然后，展示了区块链与智能合约的应用。此外，还阐述了区块链与智能合约的安全与隐私问题，重点强调了可能的攻击。区块链的独特特性使其成为开发新颖创新应用和服务的有前景技术。然而，区块链与智能合约仍需进一步的研究与开发工作，特别是在可扩展性、交易速度和安全性方面，以确立其作为支撑未来应用和服务的稳健敏捷平台的地位。\n\
