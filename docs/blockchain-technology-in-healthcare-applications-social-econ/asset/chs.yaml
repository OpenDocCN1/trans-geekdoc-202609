  \ | [91] |\n| 逻辑攻击 | 运行时错误 | * 用于验证和访问控制的 Hyperledger Fabric。 | [92] |\n| 零日攻击 |\
  \ 网络安全、零知识 | * 基于深度区块链框架的检测机制。<br>* 基于区块链的认证机制。 | [93, 94] |\n| 嗅探攻击 | 未授权访问 | *\
  \ 基于区块链的事件日志安全机制。<br>* 区块链加密方案中的 GADV。 | [95, 96] |\n| 路由攻击 | 恶化网络效率、DoS | * 使用智能合约识别被篡改传感器节点的基于区块链的框架。\
  \ | |\n\n\n\n\n\n|| [97] |\n\n上表表明，区块链在改善物联网安全问题方面具有巨大潜力。但仍需更多研究来探究区块链应用的效率与简易性。\n\
  \n## 1.6 挑战与未来工作\n\n在物联网生态系统中实施区块链的主要缺点在于，缺乏通用的方法论或系统架构来根据需求组合这些系统。区块链在共识协议的可扩展性和大数据处理方面存在问题。这些顾虑带来了一些需要更多关注的挑战。\n\
  \n### 1.6.1 设备异构性\n\n物联网生态系统涉及从低端设备到高端服务器的各类设备。它们在多层中计算数据，每层都有其自身的机制 [98]。因此，需要引入一个用于安全赋能的通用框架，使设备能在各层动态适应安全需求。\n\
  \n### 1.6.2 硬件与固件漏洞\n\n随着需求增加，物联网设备趋向于更低成本、更低功耗。这以降低硬件或固件质量为代价换取了系统的用户友好性 [99]。除了物理干扰外，恶意软件和路由问题等软件相关问题也可能发生。因此，需要一套标准系统来监控这些问题。\n\
  \n### 1.6.3 可扩展性\n\n物联网设备用于处理数十亿设备收集的大数据。区块链在处理这些数据时需要大量计算时间。此外，物联网设备自身在同步和基于海量数据传输决策方面也存在特定限制。因此，尚需寻找一种可扩展的通用机制，以同时配合物联网与区块链工作\
  \ [100]。\n\n### 1.6.4 物联网友好型共识机制的局限性\n\n物联网设备多执行实时交互。它们高速收集、处理、传输和同步数据以提供基本服务。大多数提案中采用的共识协议（如\
  \ `PoW`、`PoET` 和 `PoC`）用于公有链。其计算时间相当可观，导致快速响应产生时延。因此，需要一种更以物联网为中心的共识机制，以更高效地服务于区块链\
  \ [101]。\n\n除了这些问题外，区块链和物联网生态系统在数据完整性、通信协议以及未来物联网设备的普适性集成方面，仍需更多有影响力的工作来缓解安全问题。\n\
  \n## 1.7 结论\n\n本章呈现了基于区块链的物联网安全问题及其解决方案的综合研究。为便于深入理解，还提及了区块链技术和物联网架构的基本属性与术语。五层架构对工业领域和智慧城市概念的实施极具成效。结合区块链技术，整个生态系统可更加高效完整。我们指出的安全问题非常普遍，物联网设备极易受其侵害。网络层和中间件层对于维持设备间通信至关重要。攻击者利用这些层寻找入口点，轻易发动网络攻击。其自身限制未授权访问或检测入侵者的机制仍在完善中。区块链在这方面成为最具前景的技术。我们希望这些发现有助于深入理解整个系统，并激励我们致力于解决现有物联网设备及未来物联网应用的安全问题。\n\
