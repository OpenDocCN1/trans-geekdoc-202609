  \n### 4.4.2 XGBoost 模型\n\n\n\n\n\n#### XGBoost 模型\n\n用于预测的另一个模型是 XGBoost，它使用梯度提升框架，并用前值或零填充缺失值。它基于集成技术工作。表\
  \ 4.5 显示了 XGBoost 模型的步骤。\n\n**表 4.5** XGBoost 模型步骤\n\n1.  开始\n2.  生成一组实际预测值作为 `Y[a]`。\n\
  3.  生成一组假设值作为 `Z[a]`。\n4.  谬误 = `P(Y[a], Z[a])`\n5.  均方误差可计算为\n    `J() = Σ(Y[a]\
  \ − Z[a])²`\n6.  识别观测值中的负梯度\n7.  重复：\n8.  持续尝试移动 `Z[a]` 以减少假设中的谬误。\n    `Z[a] =\
  \ Z[a] + γH[a]`\n9.  `H[a]` 近似于 `▼P(Y[a], Z[a])`\n10. 结束\n\n图 4.13 展示了 XGBoost 建模描绘的比特币加权价格小时预测。为了划分训练集和测试集，我们使用“2018\
  \ 年 6 月 25 日”作为分割日期，因为在 2018 年 6 月 10 日至 7 月 20 日期间，比特币价格经历了显著下跌。上图显示，市场在 2017 年\
  \ 12 月达到 20K 的最高价，但此后于 2018 年年中跌至 5,970 美元至 5,980 美元的低价区间，且直到年底未能恢复。\n\n![图 4.13\
  \ 比特币加权价格小时预测。](img/Fig04_13.jpg)\n\n**图 4.13** 比特币加权价格小时预测。\n\n### 4.4.3 异常检测\n\
  \n对于异常检测，可以使用许多机器学习算法，如孤立森林、K 近邻和 K 均值聚类。在本章中，实现了 K 均值聚类来查找比特币数据集中的异常。表 4.6 显示了用于异常检测的\
  \ K 均值聚类步骤。\n\n**表 4.6** K 均值聚类模型步骤\n\n1.  开始\n2.  输入\n    `Z` ← 要形成的聚类数量\n    `R`\
  \ ← 提升比例集合\n3.  从 `R` 中随机选择 `Z` 个对象作为初始聚类中心\n4.  重复：\n    {\n    4.1 根据配置的高度相似性，将每个条目分配到对应的聚类。\n\
  \    4.2 计算各个聚类中条目的平均值。\n    4.3 直到不再发生变化\n    }\n5.  结束\n\n图 4.14 表示比特币时间戳的分析。时间戳是指由计算机通过网络时间协议等不同进程维护的事件当前时间。计算机维护的时间经过校准，精确到秒的微小分数，以提供准确性。\n\
  \n![图 4.14 用于异常检测的比特币时间戳分析。](img/Fig04_14.jpg)\n\n**图 4.14** 用于异常检测的比特币时间戳分析。\n\n\
  图 4.15 显示，当 k 值位于 `3 ≤ k ≤ 5` 之间时，K 均值聚类将显示最佳可能结果。向上或向下的拐点称为“肘部”，代表 `k` 的最佳值。在拐点明显的地方，基础模型在该特定点拟合得最好。\n\
  \n![图 4.15 为比特币数据集得出的肘部曲线。](img/Fig04_15.jpg)\n\n**图 4.15** 为比特币数据集得出的肘部曲线。\n\n\
  在 3 均值、4 均值和 5 均值中，四个聚类的绘图得出了最佳结果，因此我们将继续采用 4 均值聚类。图 4.16 表示使用 4 均值聚类对测试数据集中的异常进行聚类，这为表示各个组别提供了更好、更清晰的方式。\n\
  \n![图 4.16 基于 4 均值聚类的聚类。](img/Fig04_16.jpg)\n\n**图 4.16** 基于 4 均值聚类的聚类。\n\n## 4.5\
  \ 性能评估\n\n数据集处理完成后，机器学习方法被逐一实施用于时间序列预测，各种输出已在前面的图表中显示。在异常检测过程中，正如肘部曲线所示，4 均值聚类显示出最佳结果，因此异常将基于此进行预测。最后，将在比特币的加权价格和成交量中预测异常检测，因为这两个属性发生异常的几率最高。\n\
  \n图 4.17 显示了使用 ARIMA 模型的预测比特币价格与实际价格的对比，其呈现出与实际值非常接近的近似度。\n\n![图 4.17 实际与预测比特币价格（美元）的对比。](img/Fig04_17.jpg)\n\
  \n**图 4.17** 实际与预测比特币价格（美元）的对比。\n\n从迄今为止的分析来看，正如输出图表所描绘的，ARIMA 模型在时间序列预测中显示出最接近实际值的近似度。根据获得的结果，结论是\
  \ ARIMA 比 LSTM 和 XGBoost 模型更适合预测研究。\n\n图 4.18 表示 K 均值算法在包含 19,999 条记录的最近 2 年记录中预测了\
  \ 999 个异常。异常用红点表示。现在，同样绘制相对于成交量和加权价格的离群异常值。\n\n![图 4.18 测试数据集中异常的聚类。](img/Fig04_18.jpg)\n\
  \n**图 4.18** 测试数据集中异常的聚类。\n\n图 4.19 表示比特币成交量中的异常。这里红点显示了比特币成交量在交易过程中的异常行为。图表在 y\
  \ 轴上绘制 `volume_BTC`，在 x 轴上绘制日期时间格式的时间戳。\n\n![图 4.19 比特币价格成交量中的异常。](img/Fig04_19.jpg)\n\
  \n**图 4.19** 比特币价格成交量中的异常。\n\n图 4.20 表示加权价格中的异常。这里红点显示了交易过程中的异常行为。异常检测工具可通过自动分析、识别和分离异常，建设性地用于使区块链领域更安全、更强大。\n\
  \n![图 4.20 比特币价格加权价格中的异常。](img/Fig04_20.jpg)\n\n**图 4.20** 比特币价格加权价格中的异常。\n\n##\
  \ 4.6 结论与未来展望\n\n\n\n\n\n### 时间序列预测与区块链应用\n\n时间序列预测确实彻底改变了商业领域，因为它能提前预测未来结果，从而据此制定策略。对于处理区块链数据库而言，机器学习算法是最合乎逻辑且最优越的方法。近期研究表明，比特币的趋势容易受到不准确衡量的影响，因为比特币价格极其波动且随机，且常受外部因素（或新闻）影响，如加密货币监管、投资或社交媒体上的简单谣言。需要来自新闻或社交媒体网站的额外数据，才能使这些模型表现得更好、更准确。尽管预测常被视为监督回归类的一个细分领域，但由于数据集的时间相关性质，仍需要一些特定工具；因此，我们使用\
  \ `ARIMA`、`XGBoost` 和 `LSTM` 来预测数字加密货币比特币。比特币的时间序列预测显示，`ARIMA` 模型最接近实际值。区块链异常检测已成功实现，每\
  \ 20,000 笔交易的异常发生率为 4.9%。本文综述了该领域各类最新研究工作，展示了机器学习在区块链技术中的广泛应用。\n\n在经济领域，人们看到了区块链技术惊人的应用前景。货币组织在\
  \ 2016 年废除大额钞票后，无法充分应对巨大的工作量，从而暴露了由中心化机构处理金融交易的问题。将区块链与金融结算相结合带来了惊人的益处，例如可节省大量时间和资金，包括大幅减少处理和验证交易所需的时间。区块链还将有助于压缩黑资金流动，并处理经济中的大规模洗钱问题，因为用于交易的每个地址都会持续、定期地存储在数据库中，使所有交易都可被证明且可追责。影响比特币的一些社会经济因素包括供需波动、银行封锁、市场操纵、价格异常、利益驱动因素（丝绸之路）等。比特币交易分布式和匿名的主要优势，使其成为非法活动中心（包括隐瞒黑钱、贩毒、走私贩卖和购买军火）的推荐货币。这引起了犯罪调查机关的关注。研究这一问题也可作为未来的研究方向。\n\
