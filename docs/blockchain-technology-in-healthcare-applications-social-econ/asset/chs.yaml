  \ | + | − | + |\n\n**图例：** ++ 好；+ 一般；− 差（有限）；−− 极差。\n\n## 基于区块链的解决方案\n\n\n\n\n物联网还涉及许多其他问题，其中最重要的一个是安全问题。一个拥有大量互联设备的庞大网络的存在，几乎必然会引出各种攻击和窃听场景，这些场景可能会危及这些实体及其用户。如前所述，由于物联网设备在处理和存储方面存在物理限制，典型的安全措施无法直接应用于物联网设备。此外，在设备或用户访问物联网服务之前，必须根据预设的安全规定，在设备/用户与物联网系统之间执行相互认证和授权。另一方面，所提出的安全措施必须考虑到物联网设备的受限资源。区块链技术可以解决这些主要问题\
  \ [32]。研究人员越来越多地转向基于区块链的安全框架，以保护医疗数据免受未授权方的侵害。为了确保基于物联网的医疗应用中的通信安全，文献 [31] 的作者提出了一种有效的多层认证协议和一种用于无线体域网\
  \ (WBAN) 的安全会话密钥生成机制。文献 [32] 的作者提出了一种基于区块链技术的医疗数据存储方案，以确保个人医疗数据的安全存储和共享。为了实现医疗应用中的安全通信，Deebak\
  \ 等人 [33] 基于 ECC 和加密哈希函数提出了一种安全匿名生物识别用户认证方案 (SAB-UAS)。表 11.3 总结了这些工作。\n\n### 11.4.4\
  \ 基于轻量级密码学的解决方案\n\n密码学解决方案是密码学提供的所有安全服务。密码学提供各种安全技术，并可在使用物联网的医疗应用中提供机密性、认证、完整性及许多其他优势。为实现这些安全服务，密码学采用不同的方法，如加密/解密方法、密钥生成方法、哈希函数\
  \ [3] 和数字签名。可采用轻量级密码技术来实现包括机密性、完整性和认证在内的关键安全需求 [4]。许多基于密码学的方法被构建出来，用于检测和阻断使用物联网的医疗应用中的攻击。文献\
  \ [6] 中，作者提出了一个名为 `MADAR` 的框架来对抗 DoS 攻击。`MADAR` 可以抵抗利用基于 ID 的签名方案和自生成假名组合来影响通信的\
  \ DoS 攻击。它还可以检测基于使用强度可变的消息特定谜题来攻击通信的 DoS 攻击。Kiho 等人 [8] 引入了一种基于群签名的密钥管理协议，以确保基于物联网的医疗系统保护中的认证。利用这一概念，拥有相同签名组的设备可以安全通信。文献\
  \ [10] 的作者使用哈希函数为基于物联网的医疗系统构建了 `HCPA-GKA` 方案。设备的组密钥管理机制分发是通过中国剩余定理 (CRT) 完成的。当设备加入和退出组时，它可以被更新。表\
  \ 11.3 总结了这些工作。\n\n### 11.4.5 基于人工智能的解决方案\n\n机器学习 (ML) 是一种数据分析技术，它允许医疗系统从数据中学习并执行特定任务，如异常检测、行为分析等。机器学习主要有两类：监督学习和无监督学习。当人工手动将训练数据分类为有害或真实，然后将这些数据输入算法以开发一个包含数据“类别”的模型，并将待分析流量与之比较时，就会发生监督学习\
  \ [38]。无监督学习避免使用训练数据和人工标记，转而支持将可比较的数据片段分组到类别中，然后根据每个类别内的数据连贯性和类别间的数据模块化对其进行分类 [39]。机器学习被用于创建复杂的算法，以保护网络和系统，包括物联网设备。研究界已探讨了\
  \ ML 技术以检测针对医疗系统的攻击 [40]。Saeedi 等人在文献 [41] 中利用决策树方法检测医疗设备中的恶意攻击。Vhaduri 等人利用支持向量机\
  \ (SVM) 特性，通过卡路里消耗、平均步数和每分钟心率等多种生理和行为指标，检测对医疗设备及其获取数据的非法访问 [42]。Newaz 等人提出了 HealthGuard，这是一种基于\
  \ ML 的安全框架，用于检测互联医疗系统中的敌对行为 [43]。HealthGuard 从各种医疗设备收集生命体征，并应用 ML 算法关联患者生物过程的变化，以区分良性和恶性活动。表\
  \ 11.3 总结了这些工作。\n\n### 11.4.6 基于同态加密和可搜索加密的解决方案\n\n\n\n技术的进步现在使得监测心率、体温和睡眠模式成为可能；利用\
  \ IoT 设备持续追踪运动；记录大脑活动。经典加密技术已非常成功地用于保护传输中和存储中的数据 [[44]](#C_016_c11.xhtml#r11_44)。然而，加密数据的过程也使其在计算中变得不可用。最近开发的全同态加密（FHE）技术在很大程度上改进了这一点。与需要在计算前解密数据的经典方法不同，同态方法允许数据同时被安全地存储或传输并用于计算\
  \ [[45]](#C_016_c11.xhtml#r11_45)。然而，FHE 对计算施加了严重的限制，无论是算术方面（例如，无法执行除法）还是计算方面（例如，乘法变得慢得多），导致传统统计算法不再适用。使用可搜索加密（SE），可以对存储在云服务器上的加密数据进行安全搜索。非对称\
  \ SE、对称 SE 和基于属性的 SE 是 SE 技术的示例 [[46]](#C_016_c11.xhtml#r11_46)。文献中提供了多种利用同态加密和\
  \ SE 保护基于 IoT 的医疗系统的安全方案。Almalki 等人 [[8]](#C_016_c11.xhtml#r11_8) 提出了 EPPDA：一种带有认证的高效隐私保护数据聚合方案，用于基于\
  \ IoT 的医疗应用。EPPDA 在数据聚合和转发过程中验证数据完整性，以便在验证和授权阶段尽早检测到虚假数据。在另一项工作中，Helen 等人 [[46]](#C_016_c11.xhtml#r11_46)\
  \ 强调了用于 WBAN 系统的增强型基于 MAC 的安全延迟感知医疗监测系统（E-MHMS）。该解决方案确保了安全高效的数据聚合，其中数据分为三类：关键数据、近关键数据和普通数据。首先，基站（BS）向所有授权节点发送密钥。Mahender\
  \ 等人 [[48]](#C_016_c11.xhtml#r11_48) 阐述了一项名为“托管免身份基聚合签加密方案以保障数据传输（EF-IDASC）”的新贡献，以确保医疗物联网（IoMT）上的隐私保护访问控制。表\
  \ 11.3 总结了这些工作。\n\n## 11.5 结论\n\n基于 IoT 的医疗提供持续的健康监测，特别针对老年人和患有慢性病的患者，这使得医疗团队和/或卫生服务能够对患者做出更快、更准确的响应。确实，由于医疗设备和应用中存在多种设计缺陷且缺乏有效的安全措施，基于\
  \ IoT 的医疗行业正日益面临安全挑战和威胁。医疗系统安全不足的后果可能包括：某些健康记录可能包含地址、姓名和家庭详细信息，这些信息可被用于推断或向未经授权的用户泄露患者身份，从而导致隐私泄露。本概述旨在作为一个知识库，提供独特的见解，帮助用户和管理员以符合其总体目标、使命和愿景的方式定位自己及其组织，以取得卓越成果。\n\
