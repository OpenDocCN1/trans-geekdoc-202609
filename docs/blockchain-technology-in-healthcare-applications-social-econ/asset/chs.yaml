  \ IEEE.\n\n# 6 通过机器学习方法改进制药行业机械——以津巴布韦为例\n\nShadreck N. Tasiyana, Prince Chitopho,\
  \ and Tawanda Mushiri\n\nUniversity of Zimbabwe\n\nAbid Yahya\n\nBotswana International\
  \ University of Science & Technology\n\nDOI: [10.1201/9781003224075-6](http://doi.org/10.1201/9781003224075-6)\n\
  \n## 6.1 介绍\n\n制药需求建立在健康需求之上，自 1970 年代以来，本地制药生产一直是各国际平台关注的重点 [38, 43]。一些研究还揭示，低生产能力是导致东非和南部非洲药品获取不足的挑战之一\
  \ [29]。根据 2020 年津巴布韦卫生预算，资本支出分配在 2019 年和 2020 年之间翻了一番，卫生预算约占津巴布韦年度预算的 32%。这些事实及预算轨迹使该国陷入困境。各国（尤其是包括津巴布韦在内的发展中国家）因此需要采取各种策略来管理这种支出/需求。改进制造工艺便是其中一项策略。根据《政府公报》（2021\
  \ 年 5 月 7 日），批准了一项制药战略，旨在将药品产量从 30% 提升至 60%。此外，制药行业已被确定为《国家发展战略》和《津巴布韦国家工业发展政策》中的优先领域\
  \ [40, 41, 42, 43]。\n\n制药行业除其他职能外，还负责将原材料转化为可给药形式的制药产品。与其他行业一样，制药行业也经历了工业革命的不同阶段，旨在提高生产率和盈利能力，同时实现产品价格亲民。国际制药工程学会\
  \ (ISPE) 引入了工业 4.0 的概念，通过提议用 CPM 取代批次加工来应对生产挑战。与传统的制药批次制造系统不同，CPM 涉及将单元操作集成到一个通过集中控制平台运行的单一连续生产线中，进行实时工艺运行数据收集，并随后应用这些数据来控制生产线，以高效实现预期的产品质量\
  \ [2]。\n\n本研究旨在通过机器学习 (ML) 提高本地制药制造机械的运行效率，减少劳动力和材料浪费，提高机械产品输出质量，从而在本地和区域市场上实现竞争力。研究涉及本地行业背景、标准和制造工艺，以及人工智能\
  \ (AI) 在制造业中的潜在影响。重点还在于从时间和货币两方面比较传统手工制造方法与自动化制造方法。同时也提供了 AI 应用的潜在益处及案例。\n\n## 6.2\
  \ 津巴布韦制药行业的背景与现状\n\n津巴布韦制药行业由八家通用制药制造公司组成，生产成品人用药。制药市场包括进口药品、捐赠药品（进口）和本地生产药品。**图\
  \ 6.1** 展示了 2014 年的市场分布统计数据 [3]。\n\n![图 6.1 2014 年津巴布韦制药市场分布。（转载自 3。）](img/Fig06_01.jpg)\n\
  \n**图 6.1** 2014 年津巴布韦制药市场分布。（转载自 [3]。）\n\n\n\n\n\n### 津巴布韦制药出口市场\n\n尽管南部非洲发展共同体提供了\
  \ 47 亿美元的市场[3]，津巴布韦制药出口市场仍然微不足道。这与其他报告一致，显示津巴布韦经济存在贸易逆差，进口超过出口至少 40 亿美元[4]。选定药品的价格指标显示，本地生产的产品缺乏竞争力[3]。\n\
  \n鉴于发展中国家几乎没有本地生产，世界卫生组织最近启动了本地生产计划，作为促进质量合格医疗产品本地生产的一种方式[5]。文献[3]中本地产品市场份额低的一些原因构成了本研究工作的基础（本地制造商不具备资格且无力供应捐赠药品，以及本地产品价格相对于进口药品缺乏竞争力）。\n\
  \n### 6.2.1 津巴布韦制药制造工艺\n\n自诞生以来，制药一直采用批次工艺制造[1]。制造工艺始于原材料称量。起始材料经过一系列制造步骤，直到获得成品包装片剂。每个制造步骤在独立的机器上并在其制造室（隔间）内进行。图\
  \ 6.2 中的工艺流程展示了片剂的制造过程及其包装成最终消费包装。\n\n![FIGURE 6.2 Process flow for tablets manufacturing\
  \ in Zimbabwe.](img/Fig06_02.jpg)\n\n**图 6.2** 津巴布韦片剂制造工艺流程。\n\n这些机器大多数是人工单独操作的。因此，本地制造商在劳动力资源、高人工干预以及正式雇用人员的劳动力成本上投入巨大。在人工操作中，效率也取决于操作员。全自动化工厂不存在这些挑战，因为可追溯性和审计追踪内置在机器的操作软件中。另一个挑战是产品受到人体自然脱落颗粒的污染[1]。\n\
  \n虽然制药制造规定了个人防护装备（PPE）并提倡顶级卫生，但无法确信操作员始终遵循程序；因此，使用半自动化机器存在产品污染的风险。制药厂还专门设计了供暖、通风和空调（HVAC）系统，以控制所需的制造条件并最大限度地减少产品交叉污染。\n\
  \n## 6.3 制药行业设备、工艺与标准\n\n制药行业运作更多，尽管是设计陈旧的产品，需要常规制造工艺，因此批次制造工艺普遍存在。本节将重点关注制药制造中的传统设备/方法和当前技术趋势。因此，将更仔细地审视批次加工、人工智能、各类别的优缺点，以及产品和工艺合规性等方面。\n\
  \n### 6.3.1 制药制造\n\n图 6.3 显示了片剂及其包装成最终消费包装的典型常规批次制造工艺。\n\n![FIGURE 6.3 A typical\
  \ conventional batch manufacturing process for tablets.](img/Fig06_03.jpg)\n\n**图\
  \ 6.3** 片剂典型常规批次制造工艺。\n\n常规制药制造具有相对较低的效率和产能利用率、较高的废品和不合格品率以及较高的质量成本[6]。常规批次加工要求对预定间隔和不同加工步骤采集的产品样品进行离线实验室分析。样品采集和测试主要在过程中进行，并在批次加工结束时进行，这一概念被称为质量源于检测（QbT）[7]。然后利用样品的离线测试结果作为反馈来控制制造工艺。质量体系包括工艺/方法/设备确认、通过标准操作规程（SOP）和批次制造指令或配方进行工艺控制，以及每批次结束时产品样品的离线测试。为了支持这些质量体系，一些合规基础设施是必不可少的，尽管其经济维持困难。如文献[6]所述，虽然合规负担一直是向患者提供优质药品的推动因素，但质量成本已增加到行业总成本的平均\
  \ 20%，这对制药制造组织产生了负面影响。从产能利用率约 15% 或更低、废品或返工约 5%–10% 以及平均周期时间约 95 天等指标来看，常规制造范式也在亚最优状态下运行[6]。当前范式的问题汇总表明，有必要将制药制造范式转向具有智能在线监测和智能控制系统的范式，该范式具有质量提升、缩短周期时间和降低成本等潜在优势[8]。\n\
  \n由于制药行业监管严格，其制造创新方法通常比较保守。人们认为引入新制造技术会延误监管机构的批准并带来商业挑战[9]。其他加工行业已全面拥抱第四次工业革命，唯独制药制造业尚在探索这一新行业范式的理念和原则是否适用于制药行业。它们需要一定程度的定制（ISPE,\
  \ 2017）。然而，迫切需要引入创新技术解决方案，以实现复杂药物输送系统[11]。GEA[12]断言，组织应利用智能制造——第四次工业革命的一个子集——来挖掘其众多有益能力，例如对各种条件的敏捷适应。\n\
  \n第四次工业革命（4IR）工厂的机器增强了无线连接和传感器，连接到一个可视化整条生产线并自主做出分散决策的系统。各种物理和数字技术构成了 4IR，可概括为网络物理系统的连接性。Henstock[13]认为工业转型的目的是提高资源效率和生产力，以增强竞争力。控制不断攀升的成本以及对推动以患者为中心的日益认识，促使制药业采用\
  \ 4IR 技术[14]。ISPE 指出，4IR 应经过定制采用，以支持行业现行的质量和法规指南。4IR 是制药质量要求的推动者。常规制造范式采用 QbT 体系，即在制造过程结束时根据批准的规格验证产品质量。然而，这已被证明对制药制造商产生了负面影响。\n\
  \n\n\n\n制药领域的质量近期趋势是设计质量（QbD）和过程分析技术（PAT）。美国食品药品监督管理局（FDA）此后发起了 QbD 和 PAT，旨在在产品诞生前就将质量构建到产品中\
  \ [15]。与 QbT 不同，QbD 是一种现代制药质量方法，它通过深入理解产品与产品制造中涉及的所有组件和工艺的相容性，确保质量内嵌于产品之中 [16]。\n\
  \n工具包确保在制造 PAT 过程中将质量构建到产品中，这随后提高了运营效率、产能利用率和过程理解，同时降低了运营费用 [6]。PAT 被定义为一种系统，通过测量和控制关键工艺参数和质量属性，来设计、分析和控制药品制造过程\
  \ [6]。FDA 指出实施 PAT 的三大主要益处：增加对过程和产品的理解、改进对药品制造过程的控制、以及在设计阶段将质量融入产品。Jolliffe 等人 [17]\
  \ 断言，对关键工艺和物料参数进行在线监测对于更好地控制过程和提高其稳健性是必要的。\n\n与传统的制药批量制造系统不同，CPM 将单元操作集成到单一的连续生产线中。通过\
  \ PAT 引入关键物料属性（CMA）和关键工艺参数（CPP）等工艺运行数据的实时采集。随后利用这些数据在无人工干预的情况下智能控制生产线，以实现符合预期关键质量属性（CQAs）的产品。除其他益处外，CPM\
  \ 因其前所未有的维持受控状态的能力、低停留时间和无中间持料步骤，在工艺质量和一致性方面带来了巨大改进 [9]。\n\n### 6.3.2 机器学习\n\n正如所强调的，CPM\
  \ 需要机器来解放人类繁重的体力劳动，提供智力能力，甚至自主产生创新 [18]。Limaye 等人 [19] 断言，基于 QbD 的高效药品制造高度需要实时过程控制。在关于\
  \ CPM 试点工厂（从粉末到片剂）控制系统实施的研究中，文献 [19] 的作者对先进模型预测控制（MPC）系统、在线预测工具、PAT 和数据管理工具等各种工具进行了研究。\n\
  \nLin [20] 绘制了一幅草图（**图 6.4**）以展示 ML 与不同知识学科的关系。结论指出：“计算机程序从经验中学习以完成某类任务并衡量性能。”性能任务随经验而提高。ML\
  \ 有各种学习技术：监督学习、无监督学习、半监督学习和强化学习 [20]。\n\n![图 6.4 机器学习与其他知识学科的关系。（转载自参考文献 [20]。）](images/Fig06_04.jpg)\n\
  \n**图 6.4** 机器学习与其他知识学科的关系。（转载自参考文献 [20]。）\n\n### 6.3.3 AI 在制药行业中的作用\n\nAI 有助于上市速度、响应能力、资源生产率、效率、定制化和商业模式创新等业务价值驱动因素\
  \ [21]。\n\n**图 6.5** 展示了智能制造系统的组成部分，其中利用 AI 和云计算（CC）等工业 4.0 组件使系统智能化。工业 4.0 涉及药物发现、过程控制和质量保证（QA），与制药行业保持一致。\n\
  \n![图 6.5 智能制造系统。（转载自参考文献 [22]。）](images/Fig06_05.jpg)\n\n**图 6.5** 智能制造系统。（转载自参考文献\
  \ [22]。）\n\n#### 6.3.3.1 AI 在药物发现中的应用\n\nAI 已被发现对药物开发具有变革性影响，能对系统产生积极影响，并带来每年 1000\
  \ 亿美元的市场规模。在大多数情况下，制药行业中所谓的 AI 主要是指 ML。ML 应用于药物开发的各个领域，从疾病识别、诊断、药物研究和制造试验、临床试验、流行病爆发预测等功能\
  \ [23]。\n\n在临床前阶段，即考察药物疗效和工艺的阶段，会开发替代药物处方以创造具有必要特性的药物。药物制剂由成分的类型、数量和加工条件决定。过去，制剂师会使用统计技术进行制剂建模，并不得不依赖响应面来提供优化机制。然而，对于复杂制剂，这有时会产生误导\
  \ [24]。AI 此后为药物制剂生成提供了更好的替代方案，例如使用神经网络、模糊逻辑来辅助建模制剂。\n\n临床开发是药物开发中另一个关键且潜在漫长的过程。评估药物疗效以及相应的毒性和安全水平。在确定药物毒性后，使用人体进行临床试验。现在可以通过\
  \ ML 和自然语言处理更高效地进行临床试验的患者选择、设计和优化。物联网（IoT）和 CC 使智能传感器能够通过互联网传输数据至制药公司的云端，并在临床试验期间提供患者的实时数据\
  \ [25]。生成的大量数据（大数据，BD）随后使用 ML 算法进行分析以优化制剂。\n\n制药公司还在药物警戒中使用 ML，利用真实世界数据（如索赔和电子健康数据）进行不良事件处理或收集监管情报\
  \ [23]。原本耗时的活动显著减少，从而实现了开发药物上市的整体速度提升。重要的是要注意，AI 通过开发最佳剂量确定、最佳工艺，降低开发成本，最重要的是缩短时间，提高了制药研发工作的运营效率。上市速度是关键业务价值驱动因素之一，利用\
  \ AI 可以实现这一点 [21]。\n\n#### 6.3.3.2 AI 在过程控制和质量保证中的应用\n\n关于控制和 QA，智能规划、智能调度、智能控制和智能质量管理问题是工业\
  \ 4.0 概念的关键组成部分。该概念涉及效率、盈利能力、合规性、质量和最终产品消费者——患者。\n\n\n\n智能规划涉及通过智能优化算法（即 ML 的基础）确定制造资源的最佳配置和资源执行。由此产生的工艺计划将确保资源的高效利用，最重要的是，在确保符合所有适用法规指南的前提下，将产品可能发生的交叉污染降至最低\
  \ [5]。其他演化方法，如遗传算法 (GA)、人工神经网络 (ANN) 和粒子群优化 (PSO)，已被实施以增强计算机辅助工艺规划系统的 AI 能力，从而提供更高效的系统\
  \ [26]。\n\n在智能制造中，客户订单、制造资源状态、生产能力、供应链数据、销售数据、库存数据和法规指南会产生大量数据。因此，企业资源规划 (ERP) 软件中的数据分析\
  \ (DA) 和 ML 能力可以智能地生成优化的生产计划 [26]。智能排程还考虑材料分发。结合实际生产进度和各种现场紧急需求，将合适的材料在正确的时间送达正确的加工工位。\n\
  \n智能制造控制系统具备 AI。它包括执行器、工艺传感器、数据处理设备、设备连接性，以及将工艺变量 (CPP 和 CMA) 与 CQA 关联起来的算法。随着 AI\
  \ 在 PAT 等技术中的应用进步，在线测量现已成为可能，这使得生产过程的优化控制成为可能。通过将网络知识本体与分布式且协作的物理设备相结合，智能制造控制系统\
  \ (iMCS) 可以独立地从 DA 中学习，并适应制造系统的状况 [27]。PAT（即过程分析仪）是制药生产线 iMCS 中的主要数据来源，因为它们持续测量\
  \ CPP、CMA 和产品 CQA。PAT 的各种 AI 方法是 iMCS 的赋能者。这些方法提供学习、推理和行动等典型特征。增强 PAT 与控制系统集成的关键技术包括物联网、云计算、大数据分析\
  \ (BDA) 和信息通信技术。物联网的采用使得 PAT 在制药行业的实施以及后续的连续制造成为可能。各种物联网技术使这成为可能，如今我们拥有可通信的智能传感器\
  \ [28]。作为 PAT 的组成部分，近红外光谱 (NIR) 传感器已具备智能通信能力，可传输其从 CPP 过程测量中生成的数据。因此，物联网实现了制造生产线的智能运行，因为\
  \ iMCS 中取代传统逻辑控制器的本体论和知识推理，可以在通过物联网机制接收感测数据后自主响应状况 [27]。云计算可通过虚拟化生产过程增强数据的计算服务；然而，网络安全、数据管理和可用性等挑战可能会瘫痪生产控制系统\
  \ [28]。然而，这实现了制药的无污染加工，因为生产线是在“无人现场”的情况下“远程”受控的。先进的 DA 对于发掘隐藏模式和未知关联至关重要，学术界和工业界的研究表明，投资回报率可提高\
  \ 15%–20% [28]。大数据和 ML 在工业过程的监控、控制和优化中不可或缺。\n\n大数据和 ML 用于制造过程自动控制中的多元统计过程监控和软测量。在\
  \ CPM 中，没有离线样品检测，这意味着每个 CMA 和 CQA 都必须在线测量。然而，目前某些化学和物理性质无法测量。这催生了智能感测技术（特征学习软测量），利用易于测量的工艺变量来估算和预测难以测量的变量。表征学习也正在被使用。在这种情况下，概率慢特征分析被用来诱导缓慢变化的特征，在此基础上构建简单的最小二乘回归模型\
  \ [18]。与传统的动态偏最小二乘法不同，缓慢变化的特征能很好地代表潜在的过程变化，并且其中一些往往与质量指标高度相关。因此，ML 在制造过程控制中的进步和应用，显著实现了在更高效的连续制造范式下的实时监控和产品放行。\n\
  \n根据质量管理要求，ICH Q10 文件详细说明了制药公司如何开发和使用有效的监控和控制系统，以保证工艺性能和产品质量，确保工艺能力和持续适用性。QbD 和\
  \ PAT 作为第四代制药质量保证的主要支柱，已通过 AI 得以实现。\n\n### 6.3.4 AI 的采用，重点关注发达国家利用 ML 改进制药制造\n\n\
  制药制造始于药物本身的开发，AI 的采用在发达国家取得了巨大成就。凭借当今海量的生物和医疗数据以及先进的 ML 算法，药物的自动化设计正成为现实 [30]。ML\
  \ 技术被用于成功实现高维噪声生物数据分析的自动化，例如通过分子对接进行药物候选物识别，预测并预选有趣的药物-靶点相互作用以供进一步研究 [30]。生成对抗网络\
  \ (GAN) 已被用于生成与蛋白质设计中特定 DNA 基序匹配的 DNA 序列。ML 已应用于自适应临床试验 (ACT) 的药物测试中。ML 算法已成功实施于毒性预测，DeepTrox\
  \ 算法就是一个很好的例子 [31]。还开发了其他几种基于 AI 的药物发现计算工具。\n\nML 和其他 AI 技术使 CPM 实施成为必要，因为它实现了 CPM\
  \ 的关键概念，即 QbD 和 PAT。QbD 和 PAT 是制药制造的关键，因为它们保证药物的疗效和整体质量。QbD 确保在材料的设计和加工过程中将质量构建到产品中，而\
  \ PAT 引入了实时过程控制和实时质量保证的理念 [11]。除了效率和质量，CPM 还是一种敏捷灵活的制造技术，能够以减少原材料使用和损耗、减少停机时间、最小化人工或人工干预的方式，提供更一致、更可靠的片剂生产。\n\
  \n#### 6.3.4.1 药物开发\n\n监督学习、无监督学习和强化学习均已应用于药物开发。deepDR 方法使用自编码器 (AE) 从异构药物数据中生成信息丰富的特征。然而，文献\
  \ [30] 的作者指出，必须对 DL 中神经网络的仔细训练和正则化给予重视，以确保学习特征的相关性。这促使发达国家选择半自动化药物发现，以缩短药物研发时间和降低成本。\n\
  \n\n\n他们的研究[23]观察到，70%的受访者表示以某种方式使用了 AI，特别是在临床试验研究的患者选择和招募方面。同时也指出，AI 的使用存在一些挑战，如员工技能约占\
  \ 55%、数据结构占 52%、预算限制约占 49%。然而，此后多家制药公司已投资基于 AI 的研发项目，并与 AI 机构建立了合作伙伴关系。武田药品工业（世界最大的制药公司之一）与\
  \ Recursion Pharmaceuticals（一家 AI 和 ML 公司）合作，最近宣布在罕见病的新型临床前化合物鉴定方面取得了成果[31]。其他一些知名制药公司的合作伙伴关系估计价值达\
  \ 1 亿美元，以获取 AI 的竞争优势[13]。\n\n#### 6.3.4.2 制造控制与质量保证（QA）\n\n与传统的 V 型混合机不同，在连续制造中，通常使用管式混合机。管式混合机是带有叶片轴的水平圆筒，该轴沿其中心轴线（叶轮）旋转。配方组分从一端加入，由叶轮诱导的颗粒轴向和径向运动沿圆筒向另一端移动，这决定了混合效果。Limaye\
  \ 等人[19]开发了一个在 CPM 过程中实施控制系统的框架。在混合过程中，活性药物成分（API）通过先进的预测模型（MPC）和 NIR 传感器得到有效控制。图\
  \ 6.6 展示了 CPM 闭环操作的典型 GUI。\n\n![图 6.6 CPM 闭环操作的图形用户界面。（改编自[19]。）](images/Fig06_06.jpg)\n\
  \n**图 6.6** CPM 闭环操作的图形用户界面。（改编自[19]。）\n\nAPI 浓度在混合机末端通过微型 NIR 传感器进行测量。在`UnscramblerX`中开发了一个偏最小二乘法（PLS）模型来预测\
  \ NIR，并使用 Unscrambler 过程脉冲和预测引擎（`OLUPX`）进行实时 NIR 预测[19]。混合粉末既可以直接压片，也可以在大多数情况下先造粒干燥。包装前，可在连续包衣机上对片剂进行包衣。\n\
  \n实时监测和先进计算控制为实时产品质量保证铺平了道路，即药品的实时放行（RTR）[33]。在药品包装方面，例如将片剂装入泡罩，图像处理和光学缺陷识别已成功用于检测任何未填充或错误填充的泡罩包装。卷积神经网络等机器算法越来越多地用于质量保证中的分类任务[34]。ML\
  \ 算法通过软传感器为 CPM 中的实时监测提供了“验证”机制。\n\n#### 6.3.4.3 GEA（比利时），一家应用 AI 和 ML 实现 CPM 的制药设备制造商\n\
  \n来自比利时的领先制药设备制造商 GEA，通过在其全集成的从粉末到片剂 CPM 解决方案 ConsiGma 的设计中应用 AI 和 ML，为行业开创连续制造做出了更多贡献。与传统的批量生产线相比，ConsiGma\
  \ 占用的制造设施空间体积不到 50%。这不仅有利于工厂的占地面积，而且由于暖通空调（HVAC）能耗降低，对整体运营成本也产生了积极影响。采用 AI 和 ML\
  \ 使得神经模糊空气质量评估成为可能，从而为智能建筑（如制药智能工厂）产出了节能的暖通空调设计[35]。\n\n在利用 AI 赋能的 CPM 生产布洛芬的技术经济可行性研究中，文献[35]的作者观察到资本支出（CapEx）和运营支出（OpEx）均实现了正向成本节约。布洛芬及其替代药青蒿素的\
  \ CPM 分别显示了 53%至 71%、27%至 52.6%的总成本大幅降低。因此，CPM 在提升质量和供应响应速度等其他优势之外，还有效降低了药品生产成本。统计数据显示，82%采用\
  \ AI 制造技术的公司经历了效率提升，45%经历了客户满意度提升[37]。多家发达国家公司已采用 AI 和 ML 来改善其运营。\n\n## 6.4 方法与材料\n\
  \n本研究采用案例研究法，这是一种归纳研究技术。对案例收集的证据进行系统分析，以使模式和概念浮现。这些模式和概念随后被用于扩展现有理论并建立新理论[37]。在本例中，案例基于\
  \ PharmaCo (PVT) LTD，一家领先的本地制药制造公司，本研究旨在确定 ML 是否确实能提高本地生产线的运营效率，进而降低生产成本，同时提升产品质量和合规性。本研究旨在获得关于特定现实问题的具体且情境化的深入知识，即将\
  \ ML 和 AI 整体引入制药行业以实现运营效率的提升。因此，本节涉及所有相关方面，范围涵盖数据收集和处理方法/工具及编程。\n\n### 6.4.1 数据收集\n\
  \n必须收集定量和定性数据。定量数据有助于系统描述 ML 采用的影响，并有助于验证研究，因为它产生了可复现的知识。本研究收集的定量数据包括在本地制造业实施 ML\
  \ 的资本支出及其对生产成本的影响。本地制造业的定量数据包括现状：加工时间、产品产出、产品切换时间和维护数据。收集的定性数据有助于制定全面的技术转移计划，特别是在变更管理方面。定量数据主要通过主要来源（结构化访谈和问卷）从设备制造商处获取，获得了\
  \ ML 技术/机械规格和成本数据。\n\n### 6.4.2 编程\n\n数据被分为训练集和测试集，并对算法进行了验证。通过数学计算手动验证了模型，结果显示模型稳健。为模拟\
  \ ML 的效果（作为处理样本的一种方式），开发了一种算法并用于评估 ML 对制片机的影响。评估了内置于压片机中的 ML 能力的影响模拟。使用`Python`语言开发了一个\
  \ ML 算法。在其他语言和包中选择 Python，是基于其更高的生产率、简化的编程语法、代码可读性以及类英语的命令。\n\n### 6.4.3 观察与访谈\n\
  \n\n\n\n在观察生产过程和访谈操作员期间，记录了用于编程机器学习（ML）算法的关键数据。记录在案的是，片剂重量主要受料斗向转塔下落的片剂粉末流速以及片剂压缩速度（转塔速度）的影响。通过在案例现场（PharmaCo）进行观察（既作为参与者也作为非参与者），记录了产品制造参数和成本数据。这是在对选定案例进行公司审计期间完成的。同时也探索了次级数据来源。在\
  \ PharmCo 审计期间，重点关注制造设备、工艺和设施布局、产品制造工艺细节、产品成本模型以及销售记录。\n\n### 6.4.4 统计工具\n\n已确定粉末流速、机器速度与片剂重量之间存在线性关系。因此，ML\
  \ 算法利用该模型，采用线性回归算法来预测片剂重量 [39]。随后利用百分比偏差预测调整后的速度，从而实现目标产品重量。通过回归分析获得了模型（机器算法）的 R\
  \ 平方值。\n\n### 6.4.5 数据可用性声明\n\n支持本研究发现的数据包含在补充信息文件中。\n\n## 6.5 结果与讨论\n\n本节由不同受访者和观察获得的结果组成，涵盖了布洛芬（作为典型药物示例）制造过程中的关键问题。同时也对结果进行了分析，并以多种格式呈现以便快速分析。在制造模拟过程中，考虑了各种场景并记录了行为变化。随后据此对结果进行了讨论。\n\
  \n### 6.5.1 与董事总经理的访谈\n\n访谈的主要目的是了解高层管理的观点和对采用 ML 的支持，因为这对于制定技术转让计划或路线图至关重要。董事总经理（MD）的回答显示，他热衷于尽可能降低生产成本。对严格遵守产品规格的要求表明了优化制造的必要性。本研究旨在将劳动力成本降低\
  \ 50%，从而显著降低总生产成本。成本和产品销售成本的下降将使组织能够抵御进口产品的竞争。这将增加市场份额，这是董事总经理期盼并渴望投资的，正如他们所说，数字不会撒谎。从\
  \ MD 的参与中得到的结论是，如果 ML 方法能增加他的市场份额，他愿意投资，这对于采用本地产业方法的便利性来说是一个额外的优势，如图 6.7 所示。\n\n\
  ![图 6.7 生产经理回答。](img/Fig06_07.jpg)\n\n**图 6.7** 生产经理回答。\n\n### 6.5.2 给生产经理的问卷\n\n\
  生产经理的回答如图 6.7 所示。\n\n图例：\n\n*   **Q1**：您与运营效率相关的 KPI 是什么？\n*   **Q2**：从我们最初的讨论中，您对\
  \ ML 的理解是什么？\n*   **Q3**：您如何评价贵工厂 AI 采用的水平？ML 呢？描述您最不成功和最成功的采用实例。描述您最不成功和最成功的采用实例。\n\
  *   **Q4**：您从具备 ML 能力的机器中获得了什么收益？\n*   **Q5**：您在这种程度的 ML 应用中面临什么挑战？\n*   **Q6**：您是否需要更多具备\
  \ ML 能力的机器？您期望获得什么收益？\n    讨论劳动力、产品产量、物料使用和产品质量等领域。\n*   **Q7**：如果片剂制造线具备 ML 能力，您认为哪些功能对您的运营至关重要？\n\
  \n生产经理如图 6.7 所示回答了问卷。每个问题都被赋予了权重，并对每个回答进行了评分，以量化采用 ML 的必要性并评估行业的准备情况。93%（平均值）的高分表明\
  \ ML 是提高本地制药行业生产力的解决方案。讨论显示，片剂制造中需要解决的关键领域是降低劳动力成本、改善片剂重量变异和物料使用。这与 MD 降低生产成本以促进销售和扩大市场份额的愿景一致。\n\
  \n### 6.5.3 与操作员的访谈\n\n片剂制造部门的操作员最后接受了访谈。这些是口头访谈，是在观察片剂制造过程中进行的。在访谈中，操作员强调了三个重大挑战：可接受范围内显著的片剂重量变异，以及缺乏可能的设置来调整机器以生产重量恒定的片剂。在操作层面，还注意到在机器能连续运行前进行设置平均需要约\
  \ 40 分钟。调整机器速度是一个挑战，因为片剂重量会随流速而变化。物料和产品浪费是另一个被强调的担忧和缺点。\n\n从与操作员的访谈中观察/产生的一些关键问题涉及：拥有能够记录每种产品最佳运行速度以提高效率的机器/系统的问题。因此，拟采用\
  \ ML 的建议解决方案必须解决这些问题。还观察到所有工厂操作员都赞赏自动化，这使他们更容易理解 AI 基础知识。80% 的操作员欢迎在机器上实施 ML 的想法。约\
  \ 90% 的操作员正在攻读电子学文凭或已获得文凭，因此引入 ML 和 AI 将使他们能够运用所学知识并提升职业生涯。在这方面，注意到在制药制造中采用 ML 将是无缝的，因此利用\
  \ ML 方法改进制药机械有可能取得成功。\n\n### 6.5.4 布洛芬 400 mg 片剂制造工艺概述及批生产记录审查\n\n布洛芬是一种止痛药，被 WHO\
  \ 列为关键药物。它也是生产成本显著较高、因此成本高于进口药物的药物之一，因此选择它作为案例研究。制造过程从领料开始，即称量原材料。起始物料经过一系列制造步骤，直到获得成品包装片剂。每个制造步骤都在制造隔间（离散操作单元）内的独立机器上进行。从工艺描述中可以推断，该过程中存在显著的库存积压。生产计划中的微小失误可能会损害中间体的保持时间，从而对最终产品质量产生负面影响。从工艺审查来看，ML\
  \ 方法确实将提高运营效率。\n\n#### 6.5.4.1 产品成本审查\n\n出于保密考虑，产品成本以百分比而非实际数字表示。该组织采用吸收成本法模型，如图\
  \ 6.8 所示。成本数据表明，布洛芬 400 mg 片剂生产的前三大成本驱动因素是原材料、劳动力和质量控制/法规成本。这与 MD 和生产经理访谈的观察结果一致。由此可见，降低产品成本将主要降低这三项成本。\n\
  \n![图 6.8 PharmaCo 的产品成本核算。](img/Fig06_08.jpg)\n\n\n\n\n\n#### 6.5.4.2 用于片剂压片机片重控制的机器学习算法\n\
  \n该算法使用 `Python` 编程语言开发。ML 算法利用了产品属性、机器参数和产品输出之间的线性关系。图 6.10 展示了这种关系。测得的产品流速作为 `CMA`\
  \ 输入程序。相比之下，机器转速将作为 `CPP`，而片剂重量则作为产品的 `CQA`，如 图 6.9 所示。\n\n![FIGURE 6.9 Linear relationship\
  \ between the CMA, CCP, and CQA for Ibuprofen 400 mg tablets.](img/Fig06_09.jpg)\n\
  \n**图 6.9** 布洛芬 400 mg 片剂的 CMA、CCP 与 CQA 之间的线性关系。\n\n在程序模拟中，创建了一个产品处方文件，并作为该特定产品（本例中为布洛芬\
  \ 400 mg 片剂）的训练和测试数据集。机器算法已成功完成训练和测试。模型的 R 平方值约为 0.999，令人满意。在意图值与负/正偏差之间改变流速，产生了机器转速的预期调整，进而实现了恒定的片剂重量。图\
  \ 6.10 显示了布洛芬 400 mg 片剂的设定参数，目标重量为 15 g，目标流速为 5 m/s，目标机器转速为 15 m/s。\n\n![FIGURE\
  \ 6.10 Learning algorithm for tablet weight control Scenario 1.](img/Fig06_10.jpg)\n\
  \n**图 6.10** 片剂重量控制学习算法 场景 1。\n\n##### 场景 1：测得流速等于意图值时\n\n根据代码和输出（图 6.10 和 6.11），当测得流速（`FLOW\
  \ = 5`）与意图值匹配时，程序返回目标转速 60 RPM，并在输出面板（`MACHINE SPEED STATUS`）中显示详细信息。因此，预测重量与 15\
  \ g 的意图值相符。这是片剂重量所需的控制标准。\n\n结果如 图 6.11 所示。\n\n![FIGURE 6.11 Scenario 1: When the\
  \ measured flow rate is equal to the intent.](img/Fig06_11.jpg)\n\n**图 6.11** 场景\
  \ 1：测得流速等于意图值时。\n\n##### 场景 2：测得流速低于意图值时\n\n根据代码和输出（图 6.12 和 6.13），当测得流速（`FLOW =\
  \ 4.65`）低于意图值时，程序预测重量为 12.2 g。基于产品之前的训练和测试数据，算法必须预测一个调整后的转速来补偿低流速，这种情况下该转速低于目标转速。返回的\
  \ 49 RPM 转速使最终预测片剂重量达到 15 g。这是片剂重量所需的控制标准。\n\n![FIGURE 6.12 Learning algorithm using\
  \ Jupiter Scenario 2.](img/Fig06_12.jpg)\n\n**图 6.12** 使用 Jupiter 的学习算法 场景 2。\n\n\
  ![FIGURE 6.13 Scenario 2: When the measured flow rate is less to the intent.](img/Fig06_13.jpg)\n\
  \n**图 6.13** 场景 2：测得流速低于意图值时。\n\n##### 场景 3：测得流速高于意图值时\n\n根据代码和输出（图 6.14 和 6.15），当测得流速（`FLOW\
  \ = 5.35`）高于意图值时，程序预测重量为 17.8 g。基于产品之前的训练和测试数据，算法必须预测一个调整后的转速来补偿高流速，这种情况下该转速高于目标转速。返回的\
  \ 71 RPM 转速使最终预测片剂重量达到 15 g。这是片剂重量所需的控制标准。\n\n![FIGURE 6.14 Scenario 3: Jupiter\
  \ machine learning.](img/Fig06_14.jpg)\n\n**图 6.14** 场景 3：Jupiter 机器学习。\n\n![FIGURE\
  \ 6.15 Scenario 3: When the measured flow rate is higher than the intent.](img/Fig06_15.jpg)\n\
  \n**图 6.15** 场景 3：测得流速高于意图值时。\n\n##### 结果\n\n##### 场景 4：测得流速超出可接受产品流速范围时\n\n根据代码和输出（图\
  \ 6.16 和 6.17），当测得流速（`FLOW = 4.1`）超出 4.65–5.35 的可接受范围时，程序预测重量为 7 g 规格。\n\n![FIGURE\
  \ 6.16 Jupiter machine learning Scenario 4.](img/Fig06_16.jpg)\n\n**图 6.16** Jupiter\
  \ 机器学习 场景 4。\n\n![FIGURE 6.17 Scenario 4: When the measured flow rate is out of\
  \ the acceptable product flow rate.](img/Fig06_17.jpg)\n\n**图 6.17** 场景 4：测得流速超出可接受产品流速范围时。\n\
  \n此类超范围的流速数据显示粉末 `CMA` 存在显著偏差，或发生机器故障（如粉末给料路径堵塞）；因此必须停止操作。在这种情况下，算法返回错误代码并停止生产，以便操作员处理问题。正如\
  \ 图 6.16 所示，这是片剂重量所需的控制标准。\n\n### 6.5.5 机器学习算法在片剂压片机上的应用影响\n\n这些收益对产品价格的影响以图形方式表示，如\
  \ 图 6.18 所示。\n\n![FIGURE 6.18 Effect of ML adoption on product pricing.](img/Fig06_18.jpg)\n\
  \n**图 6.18** ML 采用对产品定价的影响。\n\n采用本研究中讨论的此类 ML 功能成本约为 735 美元。\n\n## 6.6 结论与建议\n\n\
  ### 6.6.1 结论\n\n\n\n\nML 算法被证明足以控制一台制片机。正如结果所述，在改变流速时，引入数据以预测相应的机器转速，从而生产出符合预期重量的药片，置信度至少为\
  \ 99.8%（根据线性模型计算得出）。除了质量提升的益处外，ML 算法还使人工成本显著降低了 50%，材料浪费最多减少 4%（约为初始浪费的 80%），以及设置时间缩短了\
  \ 13%。因此，采用 ML 可使总生产成本降低多达 19%，这意味着本地生产药片的价格降低 19%。以布洛芬 400 mg 药片（其价格比进口药片高 10%）为例，可以得出结论：ML\
  \ 可以改进制药机械，使本地产业具备足够的竞争力，从而在本地和区域市场扩大市场份额。通常情况下，通过不同程度的 ML 采用并管理 ML 实施成本，可以达到盈亏平衡点，即本地产业实现最低程度的\
  \ ML 采用，在将生产成本至少降低 10% 的同时，还能提升质量和法规合规性。PharmaCo 代表对引入 ML 持积极态度，使技术转移顺利进行；操作员（将在职业上受益）和高层管理人员（最终将为组织实现利润增长）几乎没有任何抵触情绪。结果使用各种统计工具进行处理和分析，并得出了归纳性结论。为\
  \ PharmaCo 制定了一份技术转移计划，其他本地制药制造公司也可采用。采用如本研究所述的 ML 能力大约需要 735 美元。还值得注意的是，该研究是作为制药工作组（PWG）提出的问题的解决方案而产生的。本地制造在其生产机器上存在运营效率问题。\n\
  \n### 6.6.2 建议\n\n据观察，过程中的中间体对产品产量产生了显著的负面影响。虽然该解决方案可仅用于压片机，但也建议在整条片剂制造线上采用 ML 技术，从物料称量到包装，以充分发挥该技术的潜力。\n\
