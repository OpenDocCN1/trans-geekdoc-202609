  \n\n\n\n\n# 12 利用区块链技术实现个人健康记录的有效管理\n\n**Jacek Klich**  \n克拉科夫经济大学  \nDOI: [10.1201/9781003224075-12](http://doi.org/10.1201/9781003224075-12)\n\
  \n## 12.1 引言\n\n正如本书所述，区块链技术（BT）在医疗保健领域得到广泛应用。它被视为应对医疗保健系统结构性变革的适当回应，这些变革由远程医疗、远程诊疗和移动健康（mHealth）的快速发展等因素推动。BT\
  \ 允许以安全、可靠、可信、可追溯、防篡改、透明和去中心化的方式提供医疗保健服务（Ahmad et al. 2021）。Radanović 和 Likić（2018）确定了\
  \ BT 在医疗保健领域的六大应用：质量控制、药品供应链管理、公共卫生、健康保险和采购政策、医学教育、生物医学研究，以及电子健康记录（EHRs），后者是本章的主题。\n\
  \n区块链还对医疗保健行业和医疗保健系统产生了重大影响，这一点在最近的系统性文献综述中有记载（Hussien et al. 2021）。这种影响可以从第四次工业革命的角度进行分析，因为\
  \ BT 是其重要组成部分（Kimani et al. 2020）。换句话说，有必要从整体上审视 BT 与健康之间的关系。\n\n### 12.1.1 动机\n\
  \n这种关系复杂且多维，可在众多领域和不同层面观察到。世界经济论坛（WEF）及其战略情报创建的交互式地图（称为转型地图）非常生动地展示了这种关系的复杂性。它们确定了\
  \ BT 对医疗保健系统影响的领域和范围，并在三张地图上展示了它们的相互关联性。第一张以区块链为核心组成部分（出发点）的地图确定了八个直接受 BT 影响的领域/因素，例如*区块链与数据利用*、*区块链与加密货币气候影响*、*智能合约与自动化*、*区块链与数字身份*、*去中心化治理与新模式*、*代币化与数字资产*、*区块链、安全与互操作性*，以及*区块链政策、监管与法律*。\n\
  \n*区块链与数据利用*类别进而关联到十个领域/现象，其中两个，即*精准医疗*和*健康与医疗保健的未来*代表了医疗保健系统的组成部分。\n\n正如第二张地图所示，*健康与医疗保健的未来*直接关联到五个领域/因素：*医疗保健系统的可持续性*、*医疗保健技术*、*流行病的准备与应对*、*普及健康获取*和*健康维护*。\n\
  \n第三张交互式地图聚焦于*精准医疗*。在此，*精准医疗*直接关联到九个领域/因素：*避免差异*、*伦理与合法性*、*多组学科学*、*精准预防方法*、*数据驱动行动*、*探索\
  \ DNA 的新途径*、*精准医疗的成本*、*重新定义健康与疾病*，以及*为精准医疗做准备*。\n\n### 12.1.2 主要贡献\n\nWEF 转型地图上展示的\
  \ BT 对医疗保健影响的详尽阐述具有双重目的。首先，它阐释了该问题的复杂性，以及区块链与健康和医疗保健系统之间多维和多边的关系；其次，旨在指出本章的增值贡献。就后者而言，可以观察到*区块链、安全与互操作性*既未关联到*精准医疗*，也未关联到*健康与医疗保健的未来*，而这两者是医疗保健系统的关键要素。本章详细阐述了这一缺失的环节，因为安全性和互操作性是\
  \ PHR 所关注的最重要问题。因此，可以得出结论，本章为上述 WEF 模型做出了贡献。\n\n### 12.1.3 章节安排\n\n本章旨在确定近期出版物中指出的将\
  \ BT 实施到 PHR 中的关键挑战。主要发现呈现在三个领域：技术发展、法律挑战和社会挑战。这些发现为反思 BT 在 PHR 中的未来搭建了平台。研究结果为预测\
  \ PHR 背景下区块链发展的未来方向奠定了基础。这伴随着对 BT 在 PHR 中有效实施的关键成功因素的识别。结论位于本章末尾。\n\n## 12.2 文献综述\n\
  \n\n\n\n\n### PHRs as Constitutive Elements of Healthcare Systems\n\nPHRs can be\
  \ perceived as constitutive elements of healthcare systems. Although an effective\
  \ flow of information is essential in every sector of the economy, it has double\
  \ importance in healthcare which is virtually based on the exchange of information\
  \ between health professionals and patients and where quick access to reliable information\
  \ in many cases means life. Because the medical information gets in volume and comes\
  \ from diversified sources, this leads to the development of digitized platforms.\
  \ Researching on them, Flaumenhaft and Ben-Assuli (2018) distinguish between the\
  \ PHR and the electronic medical/health record (EMR/EHR).\n\n#### Electronic Health\
  \ Records (EHR)\n\nThe EHR is usually defined as a repository of patient data kept\
  \ in a digital form by different healthcare providers. An EHR consists of a retrospective,\
  \ current, and also prospective information regarding the patient’s medical condition.\
  \ The information usually includes demographic characteristics, documentation of\
  \ encounters with healthcare providers (i.e., primary physician, community clinic,\
  \ and hospital), or a patient’s health history, including immunization plans, diagnosis,\
  \ laboratory reports, etc. The European Commission to foster the cross-border exchange\
  \ of medical information defined EHR as consisting of at least five components:\
  \ Patient Summary, ePrescription/eDispensation, Laboratory results, Medical imaging\
  \ and reports, and Hospital discharge reports (Commission Recommendation on a European\
  \ Electronic Health Record exchange format).\n\n#### Personal Health Records (PHR)\n\
  \nThe notion of PHR is older than EHR because personal health information in paper-based\
  \ records has been kept for decades (if not centuries). Over the last few decades,\
  \ PHR has undergone a radical change because of the fast development of digitalization\
  \ and health information technology. There is no clear consensus regarding the exact\
  \ definition of PHR so one can find various definitions in the literature (Flaumenhaft\
  \ and Ben-Assuli 2018).\n\nIn this chapter, PHR is understood as a private application\
  \ where data comes from multiply sources (including EHR from various healthcare\
  \ providers) accessed through the Internet and entered by the patient and is freely\
  \ and easily accessible by patients 24/7. PHR’s goal is to offer individual patients\
  \ free and full access to their personal health information and to allow them to\
  \ exercise control over this information. This means that PHR is driven by the patient\
  \ who may access, provide, manage, and share his/her personal health information.\
  \ One may maintain that PHR is a patient-centred tool leveraging patients’ engagement\
  \ and involvement. It also allows the self-management of ongoing healthcare. PHR\
  \ – like EHR – may include medical history and related information but also information\
  \ generated and collected by patients themselves such as weight, health, and lifestyle\
  \ habits such as diet, exercise, activity logs, and stress levels. PHR may contain\
  \ alerts and reminders for assisting in disease management and monitoring, especially\
  \ for chronic diseases like diabetes (where glucose levels monitoring and data storage\
  \ are essential) (Chen et al. 2021; Sheela and Priya 2022). The latter functions\
  \ are gaining in importance leveraged by better access to broadband Internet, implementation\
  \ of 3G, 4G, and 5G systems, a growing number of biomedical sensors, various mobile\
  \ devices (especially smartphones and related applications), and development of\
  \ mHealth (Wang et al. 2020a). Taking into account the current stage of development\
  \ of digitalization as well as in communication technologies, one may consider PHR\
  \ as an electronic PHR (ePHR) and, therefore, use these two terms interchangeably.\n\
  \n#### ePHR Architecture Models\n\nThe administration and disposal of health records\
  \ depend largely on the chosen architecture of the place health records are stored.\
  \ Following Alsahafi and Gay (2018) typology, the architecture of ePHR can be grouped\
  \ into three models:\n\n1.  **Standalone or web-based ePHR**: Patients are responsible\
  \ for creating and maintaining their health information; thus, all administrative\
  \ decisions are in their hands.\n2.  **Tethered ePHR**: The executive power of patients/consumers\
  \ is smaller because they are only granted access to the information stored by a\
  \ healthcare provider.\n3.  **Integrated/Unified ePHR**: This model responds to\
  \ the growing number of medical data because it enables the gathering and viewing\
  \ of health information from multiple sources. As such, it could be used regionally\
  \ as well as at the national level (Alsahafi and Gay 2018).\n\n#### Comparing EHR\
  \ and PHR\n\nComparing EHR to PHR one may indicate that EHR is structured, keyed,\
  \ kept, and managed by healthcare providers. It may only contain information from\
  \ a single healthcare provider. Opposite to EHR, PHR is kept and managed by the\
  \ patient and might encompass health information from different sources, mainly\
  \ healthcare providers, but also – in the growing scale – monitoring devices (mHealth)\
  \ and the Internet at large.\n\n### 12.2.1 Method\n\nTo review, assess, and synthesize\
  \ publications proposing to utilize the blockchain to PHRs, a structured literature\
  \ search on the topic was used. Databases such as ScienceDirect, EBSCOhost (including\
  \ Health Source – Consumer Edition and MEDLINE), OECD iLibrary, Open Knowledge Repository,\
  \ Scopus, and Web of Science were searched and a combination of the following terms:\
  \ PHRs, benefits, healthcare, challenges, security, and trust was used. Although\
  \ the time frame used in the search was 2019–2021, a few earlier publications were\
  \ also analysed. The study selection process was performed in two steps. In the\
  \ first step, after the elimination of duplications (the results of a search came\
  \ from six databases indicated above), the titles were checked against the goal\
  \ of the chapter. Then, in the second step, abstracts of all publications chosen\
  \ in the first step were studied and compared with the chapter’s goal. Finally,\
  \ 86 publications were selected for analysis. As occurred later, not all of them\
  \ matched with the topic and goals of the chapter.\n\n### 12.2.2 Results\n\nThe\
  \ results will not be presented in a formal academic manner as in the case of a\
  \ classic systematic review on BT in healthcare (Agbo et al. 2019), i.e., without\
  \ tables and graphs. Also, the structure will not mirror the standard style. Consequently,\
  \ the findings are presented on two levels: general and specific.\n\n#### 12.2.2.1\
  \ General Observations\n\nGeneral observations can be presented in just three points:\n\
  \n*   Widespread EHR adoption originates, among others, from substantial investment\
  \ and increased financial incentives to implement EHRs even in mid-income countries.\n\
  *   Gaining in importance are also PHRs. Their rising value is leveraged by fast\
  \ mobile health (mHealth) development and the growing number of various sensory\
  \ devices.\n\n\n\n\n\n##### 区块链在 EHR 和 PHR 中的实施获得积极评价\n\n绝大多数出版物对区块链在电子健康记录（EHR）和个人健康记录（PHR）中的实施给予了积极评价。区块链带来的益处包括：\n\
  \n*   **访问控制**（Hasselgrena et al. 2020; McGhin et al. 2019; Tandona et al. 2020;\
  \ Dagher et al. 2018; Nguyen et al. 2021; Singh et al. 2021; Ogundoyin and Kamil\
  \ 2021; Wang et al. 2021）\n*   **互操作性**（Gordon and Catalini 2018; Sreenivasan and\
  \ Chacko 2020; Margheri et al. 2020）\n*   **安全性**（Tariq et al. 2020; Shi et al.\
  \ 2020; Tseng et al. 2021; Gimenez-Aguilar et al. 2021; Shamshad et al. 2020）\n\
  *   **隐私保护**（Hussien et al. 2021; Agbo et al. 2019; Tandona et al. 2020; Sookhak\
  \ et al. 2021; Saxena and Verma 2020; Antwi et al. 2021; Mohanta et al. 2019; Soni\
  \ and Singh 2021; Axon et al. 2018; Feng et al. 2019; Badr et al. 2018; Al Omar\
  \ et al. 2019; Ul Hassan et al. 2020; Attarian and Hashemi 2021; Hathaliya and Tanwar\
  \ 2020; Bhavin et al. 2021; Jeet and Kang 2020）\n\nAbu-elezz 等人（2020）提出了源自区块链技术（BT）益处的其他分类，区分了与患者相关的益处和与组织相关的益处。个性化医疗、安全与授权、患者健康数据追踪、患者健康状态监测属于第一类；而健康信息交换、药品供应链、临床试验、医疗保险管理属于第二类（Abu-elezz\
  \ et al. 2020）。\n\n值得注意的是，总体上探讨区块链局限性的出版物数量有限（Jeet and Kang 2020; Abu-elezz et al.\
  \ 2020; Negro-Calduch et al. 2021），特别是针对 PHR 方面的。这一问题将在下文第三小节进一步展开。\n\n#### 12.2.2.2\
  \ 具体观察\n\n基于 Malhotra 等人（2021）提出的区块链采用战略风险类型学（并对此进行进一步阐述），可以确定三个领域，我们综述中的更详细发现可归入其中。它们是技术、法律和社会问题。下文将*法律*和*社会*问题称为“挑战”，因为报告相关发现几乎自动引导我们采取未来必要的行动来解决已识别的问题。\n\
  \n##### 12.2.2.2.1 技术发展\n\nBT 持续发展，因此多篇出版物在这方面提出了新的改进和想法。这些新提案名称各异。在下文引用的文章中，可以找到“新模型”、“新系统”、“新架构”、“新框架”、“新概念”、“新机制”、“新方案”、“新结构”或“新平台”。\n\
  \n**新模型**\n\n首先从“新模型”说起，Chen 等人（2021）提出了他们所谓的“完整的医疗信息系统模型”以及基于物联网（IoT）的数据收集系统。该系统拥有基于云服务器和代理重加密算法的匿名医疗数据共享方案。这有助于提高私人医疗数据共享的安全性。\n\
  \n与前者不同，Roehrs 等人（2019）开发的第二个模型遵循 OmniPHR 架构模型，利用 BT 和 openEHR 互操作性标准整合分布式健康记录。该模型使用来自两个医院数据库的四万多名成年患者的数据集进行了测试。据作者报告，原型中使用的区块链实现了\
  \ 98% 的可用性（Roehrs et al. 2019）。\n\nKanwa 等人（2020）承认数据发布中隐私与效用之间始终存在权衡，提出了一种名为“1:\
  \ M MSA-(p, l)-diversity”的扩展隐私模型。实验结果表明该模型高效。\n\n最后一个被评审的模型由 Mohsin 等人（2019）提出，是一种结合射频识别和指静脉（FV）生物特征特征的混合生物特征模式模型，旨在提高安全性。评估结果显示，高抗性验证框架可防范欺骗攻击和暴力攻击。该模型优于基准。\n\
  \n**新系统**\n\n转向新系统，首先可参考 Chelladura 等人（2021）提出的系统。这是一个以患者为中心的系统，旨在掌握完整性管理。该系统针对注册、健康记录创建和存储、安全存储、更新权限、紧急访问、数据共享权限和查看权限合同启动智能合约。文章展示了\
  \ BT 如何进一步发展。\n\nSharma 和 Balamurugan（2020）提出了另一个利用 BT 实施 EHR 以使其更安全、更私密的系统。它使用加密技术和去中心化（经典\
  \ BT 特性），并在数据隐私和数据可访问性之间保持平衡。\n\nKumar 和 Chand（2021）开发的下一个系统被作者称为“基于 Hyperledger\
  \ Fabric 的最先进隐私保护医疗数据共享系统”，名为 MedHypChain。作者坚称 MedHypChain 实现了机密性、匿名性、可追溯性和不可伪造性。作为对\
  \ SARS-CoV-2 大流行的响应，MedHypChain 允许患者管理区块链中的健康相关信息，且 MedHypChain 在延迟时间、执行时间和吞吐量方面的性能取得了积极结果。正如文中所推销的，将\
  \ MedHypChain 与相关的基于区块链的医疗系统进行比较显示，MedHypChain 需要最小的计算和通信成本，并实现了所有安全特性，如真实性、可扩展性和访问控制。\n\
  \nShuaib 等人（2022）基于伊斯坦布尔拜占庭容错（IBFT）共识算法和星际文件系统（IPFS）开发了一个同样具有竞争力（至少在作者眼中）的许可区块链医疗数据共享系统。基于交易延迟、吞吐量和失败率评估和比较的系统性能表明，其性能优于其他系统。结果还显示，去中心化文件系统提供比现有传统中心化数据库系统更好的安全性。\n\
  \nHussein 等人（2018）开发的下一个新系统主要旨在保护患者隐私和安全。该系统由离散小波变换和遗传算法技术支持。它仅在确认用户的加密密钥和身份后允许请求数据。作者坚称该系统健壮、高效、免疫且可扩展。\n\
  \n\n\n\n\n##### 12.2.2.2.2 法律挑战\n\n与区块链技术新技术发展的丰富文献相反，关于区块链技术在医疗保健领域应用的法律和社会决定因素的文献相对较少。关于电子健康记录（`EHR`）和个人健康记录（`PHR`）中区块链技术使用法律法规的出版物数量有限。\n\
  \n《通用数据保护条例》（`GDPR`），作为欧盟国家的基础法规，在文献中得到了深入讨论。在 `GDPR 第 4 条第 5 款` 中可以找到假名化的定义。问题是\
  \ `GDPR` 是否通过“假名化”一词扩大了个人数据的范围。Mourby 等人（2018）认为，“假名化”不会扩大个人数据的范畴。他们坚持认为，假名化的含义并非旨在确定数据是否属于个人数据。他们还主张，所有符合\
  \ `GDPR 第 4 条第 5 款` 定义的数据均为个人数据。这进而引出了关于该个人数据保护的问题。\n\n在持续讨论的话题中，有效的数据保护是一个核心议题。该问题之所以复杂，主要是因为它在各个层面（地区和国际）均受到监管，且指导敏感健康记录安全与隐私的法规在不同地区和国家之间存在显著差异。这些法规的例子包括上文提到的《健康保险流通与责任法案》（`HIPAA`）和\
  \ `GDPR`。Shuaib 等人（2021a）在基于区块链的 `EHR` 系统遵循 `HIPAA` 和 `GDPR` 的背景下分析了这两项法规。正如预期的那样，作者得出结论：存在许多差距和不一致之处。\n\
  \n\n\n\nPool 等人（2020）通过系统文献检索的结果显示，数据保护的成败及其影响取决于情境因果机制。情境因素包括系统、用户、任务、服务和地理要素；因果机制包括未经授权的访问、设备盗窃、丢失和共享、缺乏网络卫生意识、以及数据保护顾虑（导致失败的因素），还有建立信任的活动、安全合规的平台、感知到的数据保护（导致成功的因素）。他们的结论是可以预见且颇为平庸的：他们认为，要使移动健康干预有效，必须减轻并补救数据泄露。\n\
  \nNalin 等人（2019）指出，如今欧盟成员国之间必须交换越来越多的健康数据。这很困难，部分原因在于每个成员国都有不同的国家监管框架和不同的国家医疗结构。作者通过\
  \ epSOS（“面向欧洲患者的智能开放服务”）项目应对这一挑战。他们展示了欧洲跨境健康数据交换不断演进的 eHealth 基础设施全貌，并通过一个具体案例研究（描述意大利如何采纳该系统并适应已识别的障碍）来说明挑战、未决问题和局限性。可以了解到，欧盟成员国之间医疗信息的安全可靠流动仍是一项重大挑战。\n\
  \nBT 为医疗信息财产权的讨论引入了一个非常有趣的线索，为文献中的辩论做出了贡献，特别是关于 PHR（个人健康记录）的所有权。这在美国尤为有趣且重要，因为在美国，所有权及所有权权利拥有全世界最高的社会、政治和法律价值。根据法律，患者拥有与其健康信息相关的合法隐私权、安全权和准确权。正如\
  \ Schneider 和 Scheibling（2019）所指出的，一旦该信息被记录下来（无论是书面还是电子形式），且医疗服务提供者拥有存储该信息的媒介，该提供者便获得数据的占有财产权。现在，当基于区块链的平台帮助患者恢复其数据所有权并可管理其使用时，PHR\
  \ 的所有权问题引发了争议。这部分是因为——正如 Schneider 和 Scheibling（2019）所计算的——PHR 产生了一定的经济价值。作者在所有权、市场、隐私、质量和创新背景下对\
  \ PHR 进行的增值估算显示，每位 PHR 所有者都能创造一定价值。换句话说，在 PHR 交易发生的地方，所有者、生命科学公司和地方经济可以创造人均 2,107\
  \ 美元的总经济价值（分别为 620 美元、343 美元和 1,144 美元）。即使是如此粗略的估算，也为 PHR 所有权问题投下了新的光芒。\n\n如果记住患者作为医疗数据的主要所有者，却不像次级数据所有者（如\
  \ Facebook 和 Twitter，它们通过将这些数据转售给第三方或生成统计分析来获取经济利益）那样从其财产中获得任何收益，后者将具有额外的价值。这种不平等激励\
  \ Bataineh 等人（2020）开发了一个双边市场平台，以实现患者数据变现并从其所有权中获取经济利益。作者正式证明了他们的概念是一个切实可行的解决方案且可付诸实施。\n\
  \n上述出版物及其探讨的问题，可以置于 Malgieria 和 Custers（2018）提出的更广泛框架中。他们注意到，数据驱动经济建立在数字身份的商品化之上。他们赞同\
  \ Schneider 和 Scheibling 的观点，即个人数据代表货币价值，但个人似乎并未充分意识到其数据中的货币价值，且倾向于低估其经济力量。作者探讨了欧盟立法如何应对个人数据财产化和货币化这一新兴问题。他们提出了量化个人数据价值的模型。他们表明个人数据的货币价值是可以量化的，因此财产权的价值也可以估算。他们研究中最引人入胜的结论是：他们的模型与欧盟数据保护法不兼容。这反过来又引发了关于欧盟立法可能修改的问题。\n\
  \n这种悲观评估与 Nir Kshetri（2021）对供应链中使用区块链的法律法规所做的负面评估不谋而合。他描述了影响 BT 在供应链中使用和吸引力的法规，并展示了某些国家薄弱的执法和无法无天如何使区块链项目的实施过程变得困难。后者意味着不断增长的\
  \ PHR 资源代表着不断增加的市场价值（以货币衡量），因此，个人医疗记录的财产权和所有者权利（*ius utendi, fruendi at abutendi*）将必须被精确定义并高效执行。\n\
  \n##### 12.2.2.2.3 社会挑战\n\n正如引言所述，BT 以多种方式影响着社会（进而——*ipso facto*——影响我们每个人）。有趣的是，旨在研究\
  \ BT 影响的出版物，数量上不及专注于 BT 技术方面的出版物。\n\n在探讨 BT 社会层面的出版物中，有两类值得特别关注。一类由医疗专业人员组成，主要是医生（及其对数字化和\
  \ EHR 的态度），另一类是患者。\n\n\n\n第一组在 Eric Topol（2012）所著、2012 年出版的书中有所描述，他是一名医学博士。Topol\
  \ 书中最引人注目的是（考虑到这是由一名执业医生撰写的）他对美国医疗系统实施 EHR（电子健康记录）准备情况的批判性评估。正如我们所了解到的：“在 2009 年接受调查的\
  \ 3,000 多家美国医院中，只有 1.5% 拥有完全电子化的健康记录和健康信息技术（HIT）系统，而且这些主要局限于大城市的大型教学医院”（Topol 2012，143）。考虑到美国医疗系统高度碎片化：“美国\
  \ 65 岁或以上的普通人每年平均从四个机构的七位医生那里接受护理”（Topol 2012，144），整合 IT 系统是一项巨大的挑战。此外，“……数百家公司、医院和医生诊所开发了专有的、互不连通的\
  \ EHR 软件。综合来看，我们面临的是指数级的碎片化”（Topol 2012，144）。EHR 的发展可能有所帮助，但 Eric Topol 倾向于电子 PHR（个人健康记录）。物联网和大数据的快速发展支持了这一选择。Topol\
  \ 对医疗系统日益增长的数字化以及 EHR 感到某种程度的不适，因为个体医患关系正在受损。医生花在打字（编写病历）上的精力比关注患者的更多。最终，医生和患者都感到不适（Topol\
  \ 2012，150）。人们可能会质疑上述观点，认为那已是近十年前的事，医院的 IT 基础设施和医生的态度都可能发生实质性变化。遗憾的是，没有证据支持这一点。恰恰相反，医生（以及医院和其他医疗服务提供者）相当不愿意与患者共享医疗信息，甚至更不愿意对病历进行任何更改。Chen\
  \ 等人（2019）的研究结果支持了这一点。作者表明，一旦数据被录入系统，EHR 中的大多数数据保持不变。这种抵触情绪在多大程度上适用于 BT（区块链技术）的使用仍不得而知。\n\
  \n与医生和 EHR 相比，患者在管理其 PHR 方面仅略显活跃。如前所述，患者部分意识到了其 PHR 的价值以及作为病历所有者所拥有的机会。Heister 和\
  \ Yuthas（2020）沿着这一思路展望了医疗数据自我主权所有权可能产生的潜在影响。自我主权所有权是一个有趣的概念，它假设患者拥有完全的自主权，并掌握使其能够做出理性决策的信息和数据。“自我主权”一词也出现在下一篇被评论的文章中，Shuaib\
  \ 等人（2021b）在文中探讨了安全可靠的身份。他们提出了自我主权身份的概念，可用于提供用户控制和安全身份。尽管这具有技术性，但该提案表明 PHR 所有者的作用日益增强，并强调了个体的作用。\n\
  \n虽然上述出版物具有理论价值，但 Esmaeilzadeh（2021）的工作侧重于实证。作者进行了一项在线调查，研究使用各种个人健康设备以改善健康状况和/或实现健康目标的情况。正如预期的那样，结果表明\
  \ IT 身份是一个复杂且多维的建构。身份验证过程促进了 IT 身份的形成，并鼓励个体从事有益行为。这项研究有助于更好地理解移动健康的成果，而这一领域目前研究仍不充分。\n\
  \nAvram 等人（2018）进行了另一项关于患者偏好的实证研究，他们评估了 590 名心脏病患者关于在与国家健康数据库共享信息的背景下使用个人信息的偏好。结果显示，大多数受访者（80.3%）愿意授权研究人员访问健康行政数据库以进行筛查和随访。尽管总体结果积极，但人们可能会指出潜在的偏见，因为心脏病（相对而言）比性病、精神病或慢性病具有更中性的性质。了解受访者如何感知该个人信息的价值也会很有趣。\n\
  \n这一段表明，PHR 作为一种社会现象仅被部分研究，还有数十个问题悬而未决。\n\n## 12.3 区块链技术在 PHR 中未来发展的预期趋势\n\n结合对\
  \ BT（区块链技术）最新出版物的简要回顾结果，可以概括并推断出未来趋势。预期趋势可综合如下：\n\n*   有充分理由认为 BT 将在医疗保健领域进一步扩展。即使是上述关于\
  \ BT 实施到 PHR 技术发展的简要文献回顾，也显示了 BT 在仅一个领域（即 PHR）内扩展的速度之快。人们可以将其延伸至 EHR 和医疗信息总体，以看到\
  \ BT 在医疗保健领域的进一步机遇。\n\n*   这种扩展将由 eHealth（电子健康）和 mHealth（移动健康）的扩展所推动，并由生物医学传感器、物联网和电子设备的快速发展提供伴随和杠杆作用。此外，个性化医疗的发展将支持\
  \ BT（Abul-Husn and Kenny 2019）。当前的 SARS-CoV-2 大流行表明，eHealth 在对抗 COVID-19 中可以提供实质性帮助。人们也可以预期，在后\
  \ COVID-19 时代，电子咨询、电子处方和其他 eHealth 应用将在范围和重要性上不断扩大。更有前景的是各种生物医学传感器的快速发展，它们被用于（除其他外）监测心脏病和糖尿病患者。与此并行的是各种物联网应用的快速增长。人们应该注意到，与过去\
  \ PHR 与特定人的健康问题紧密相关不同，如今 PHR 也可应用于使用水疗和健身设施、从事体育活动（即慢跑、散步、游泳、远足和骑行）的健康个体。大量的电子设备和\
  \ Wi-Fi 技术允许记录和存储个人信息，这些信息必须得到妥善保护。\n\n*   健康数据的来源/数据库将更加分散和多样化。如上所述，个性化信息将借助物联网的发展得到利用，从而导致信息来源不断增加。这些来源将高度异构且分布在网络中。\n\
  \n*   互操作性将日益重要。由于上述来源的异构性和存储信息的多样性，互操作性将成为战略性因素。在此，尖端硬件和合适的软件将是关键成功因素。\n\n*   存入并从医疗服务提供者管理的来源/数据库（即\
  \ EHR）以外的各种来源/数据库获取的健康信息，将在 PHR 中占据越来越大的份额。这与上述第 2 点的评论一致，也是其结果。人们可以再次强调，物联网的发展将导致关于健康状况良好人群的个人数据量不断增长。\n\
  \n\n\n\n*   虽然安全和隐私问题已由 BT 成功解决，但在这方面仍需进一步改进。虽然 BT 允许个人医疗记录的安全传输和存储，但它并不能保证完全的保护。这反过来意味着，安全和隐私问题始终将是重中之重，迫使人们持续精通\
  \ BT 和其他旨在保障安全和隐私保护的技术。\n\n*   患者将更加意识到他们所拥有和管理的医疗信息的市场价值。这反过来可能导致创建平台，用于交易来自 `PHR`\
  \ 的信息。问题不是“会不会”，而是“何时”。即使 `PHR` 信息的供给适中（假设个人不太愿意出售数据），市场的需求方也会使这种选择变得可行。与此并行的可能是非官方的、未登记的、且极有可能是非法的交易。\n\
  \n## 12.4 在 PHR 中有效实施 BT 的关键成功因素\n\n正如 Radanović 和 Likić 正确总结的那样：“……学术文献关于区块链在医疗保健系统中潜在用途的研究仍相当缺乏”\
  \ (Radanović and Likić 2018, 589)。这在一定程度上是因为 BT 仍处于*初生状态*并快速发展。因此，首要任务是深入了解这一现象，这意味着要持续监测\
  \ BT 的发展。第二是研究 BT 在医疗保健领域（总体上）和 PHR 领域（特别是）的实施过程。正如 Balasubramanian 等人总结的：“……迄今为止，尚未做出全面的、基于证据的努力来了解该行业（即医疗保健，JK）对区块链采用的准备程度”\
  \ (Balasubramanian et al. 2021, 1)。Kouhizadeh 等人 (2021) 也持有此类评估，他们调查了区块链采用的障碍。\n\
  \n上述活动的共同分母是**知识**，因此，关于尖端技术成果和有效实施实践的充分、更实用的知识，可被视为将 BT 引入医疗保健领域的第一个关键成功因素。\n\n\
  第二个关键成功因素可称为国家和国际（参见欧盟）层面的**清晰、全面的法律制度**。正如本章所述，BT 实施的一个障碍是区块链法规和法律方面缺乏清晰度 (Balasubramanian\
  \ et al. 2021)。\n\n第三个关键成功因素是**充足的资源**（人力和资本），因为 BT 需要大量投资。\n\n最后但同样重要的是对在医疗保健领域实施\
  \ BT 的**政治和社会接受与支持**。\n\n## 12.5 结论\n\n本章表明，BT 在医疗保健领域（总体上）以及 EHR 和 PHR（特别是）中是不可避免的。本章有助于填补交互式\
  \ WEF 图谱中的空白，其中区块链、安全性和互操作性未与健康与医疗保健的未来相关联。本章详细阐述了这一缺失的环节，因为安全性和互操作性是 `PHR` 最重要的问题。本章表明，BT\
  \ 允许解决 `PHR` 的安全和隐私问题。然而，必须强调的是，仍有改进空间，因为上述引用的绝大多数出版物都涉及以新模型、系统、架构、框架、概念、机制、方案、结构和平台的形式，进一步改进安全性和隐私性。由于\
  \ `mHealth` 和 `eHealth` 在医疗保健系统中的份额不断增长，安全性和隐私性变得愈发重要。正如 SARS-CoV-2 大流行所显示的，`eHealth`\
  \ 拥有巨大潜力，可以替代（有一定局限性）传统提供的医疗服务，即医生和患者之间的面对面互动。后者首先指初级保健，但一些专科护理服务也可以在线提供。由于其本质，BT\
  \ 受到 IT 专家和技术人员的最大关注。由于 BT 的本质，这是自然的，但人们可能会注意到，区块链的法律和社会维度也应当被研究。这首先涉及 `PHR` 财产权的执行以及机密医疗和医疗相关的个人/患者数据。\n\
