  \ | Secp256k1 |\n| 贡献者 | | ~220 | | ~70 | | ~475 |\n| 模式 | | 私有, 许可制 | | 半私有 | |\
  \ 公开 |\n| 成熟度 | | 高水平 | | 中等 | | 高水平 |\n\n## 14.5 讨论与开放挑战\n\n本节描述在制药业务中实施基于区块链的溯源与追踪解决方案的重要讨论和开放挑战（**图\
  \ 14.5** 突出了药品追踪系统中的开放挑战）。\n\n![图 14.5 药品追踪系统中的讨论与开放挑战。](img/Fig14_05.jpg)\n\n**图\
  \ 14.5** 药品追踪系统中的讨论与开放挑战。\n\n### 14.5.1 利益相关者协议\n\n区块链建立是一个分散平台，所有制药服务提供商在此存储其必要商业记录，且所有人均可通过区块链平台访问给定的机密记录。参与者可能不愿加入这些系统，因为这可能导致其经济利益受损，特别是当多个商业参与者处于同一供应链上时[54]。\n\
  \n### 14.5.2 互操作性\n\n其定义为通过多个政府部门广泛接受商业软件和平台，以提供政策的有效整合。它作为不同软件和平台用户相互交互并自由创建合理业务活动的方式。现有的药品追踪解决方案（如序列、条形码、RFID\
  \ 标签、基于区块链技术的解决方案和平台）无法完全发挥作用，因为缺乏经过验证的解决方案来实现组合、灵活性和简易性。此外，Hyperledger 旗下不同的基于区块链的平台在提供协作方面面临挑战，难以确保高范围和灵活性，以允许商业管理机构之间的内部和外部通信[55]。\n\
  \n### 14.5.3 实施成本\n\n\n\n设计一个优秀的区块链系统并非易事，因为许多现存的解决方案仍在建立之中。保密性、故障和协作挑战同样对这一问题有显著影响。执行成本和能源效率是大多数企业以及基于供应链的医药行业面临的重要挑战之一。现存的平台和继承的软件程序在交易处理方面无能且中心化，这给初创和维护开销带来了巨大成本。例如，基于\
  \ `Hyperledger fabric` 的架构能够实现每秒 4000 多笔交易，且其命令消耗相比 `Ethereum` 显著降低，这是由于各种共识协议的作用\
  \ [56]。\n\n### 14.5.4 攻击与漏洞\n\n基于区块链的网络或技术的主要优势和劣势在于其打击多种攻击类别（包括网络攻击）的能力。当前的网络安全记录揭示了许多安全威胁，如针对中心化网络的恶意攻击、参与区块链网络以及暴露网络漏洞。区块链的近期应用因未成熟程序和组织的增长而使环境暴露于漏洞和错误之中。由于缺乏道德规范和流程，敏感信息的欺诈性窃取、技术易感性、执行问题和恶意软件，目前是阻碍前进的主要挑战\
  \ [57]。\n\n### 14.5.5 缺乏标准化\n\n药品监管专家的职责包含质量检验、质量监控、安全性和有效性，以及药品的上市后监管。它还监督药理学产品的生产、流通和储存，从而能迅速且充分地打击非法获取和假药贩运。随着这些组织越来越难以界定区块链技术的授权和生态边界，监管框架的关键作用变得更加相关和复杂。例如，每当网络上执行任何新操作或传输时，这些专家要明确解释权力并纠正相关利益方的法律义务就相当困难。另一个挑战是应对未来的监管需求，如\
  \ `FDA`、`QRC`、`DSCSA` 以及对基于区块链系统的关注。因此，基于区块链的技术不符合关于药品供应的最新规则和指南 [58]。\n\n## 14.6\
  \ 结论\n\n医疗供应链是跨越许多行政和领土限制的复杂基础设施，为日常生活中的基本设施提供必要支持。这些系统固有的复杂性可能导致污染，包含不精确的数据、模糊性和有限数据的来源。假冒药品是现存供应链中此类限制的关键标志，这不仅对人类健康造成毁灭性影响，还导致医疗行业重大的经济损失。因此，当前的研究强调了对强有力的、端到端的追溯计划和药品供应链追踪的需求。通过制药行业对商品进行端到端追踪，对于保障商品安全和消除虚假请求或未经授权的访问至关重要。此外，现存的大多数追踪系统是中介化的，导致医疗链中的数据保密性、可见性和合法性问题。本文探讨了区块链及其不同特性的概述。此外，本文讨论了区块链技术如何应用于药品追踪和药品配送。另外，本文深入探讨了当今研究中最重要和最受关注的主题，即医疗领域药品追踪的概述。再者，本文阐述了基于区块链的药品追踪系统的基本架构。讨论了基于\
  \ `Hyperledger fabric`、`Hyperledger besu` 和 `Ethereum` 的架构及其药品追踪流程。这些架构为各药品供应利益相关者之间的维护和通信提供了一个共享、可靠、权威和基于社区的平台，能够满足安全性、保密性、可用性、透明性和可扩展性等重要需求或特性。此外，通过表格展示了这三个讨论平台的评估。最后，本文指出了一些开放挑战和讨论，描述了阻碍基于区块链的技术在真实药品追踪中广泛采用的诸多部署挑战。作为未来的参考，我们计划通过安装系统的所有部分并为提议的属性创建\
  \ `DApps` 用户界面来构建智能合约。\n\n## 参考文献\n\n1.  Malik, A., Gautam, S., Abidin, S. and Bhushan,\
