  \n# 3 面向智慧城市应用物联网安全的区块链技术\n\nW. Basmi and A. Boulmakoul\n\n卡萨布兰卡哈桑二世大学\n\nL. Karim\n\
  \n哈桑第一大学\n\nDOI: [10.1201/9781003224075-3](http://doi.org/10.1201/9781003224075-3)\n\
  \n## 3.1 引言\n\n数据安全一直是现代科学的主要关注点，并持续推动创新，保持着开发新技术以保护各类信息免遭窃取和损坏的稳定曲线。与此同时，我们正在向一个运行着数不胜数的连接智能设备的世界过渡，这些设备也被称为“物联网”，简称\
  \ `IoT`，它们与远程服务器协同互操作，服务于不同领域的各种目的（Fox et al. 2019），即农业（Puranik et al. 2019）、供应链（Pal\
  \ and Kant 2018）、医疗保健（Al-Mahmud et al. 2020）、交通管理（Akhtar et al. 2020）等等。这些智能设备由智能手机、传感器、执行器和计算机程序组成，构成了一个对现代社会运行至关重要的生态系统。事实上，仅在二十年间，人类社会就从有线连接的手机、零星或有限的联网机器和人工管理的服务，转变为无线社会和数量不可胜数的连接设备，产生海量信息。然而，尽管这听起来多么强大，这种宏大和无处不在却是危险的，因为对智能对象数据和通信基础设施的任何附带损害都可能导致许多关键服务的瘫痪。相应地，`blockchain`（区块链）是一种应用于加密货币的革命性技术，作为核心支付网络，由一个去中心化账本组成，该账本包含多个相连的交易节点，每个节点都作为真相的来源，并形成共识以决定交易是否合格（Nakamoto\
  \ 2009）。虽然 `Blockchain` 常用于加密货币，但也用于其他领域和应用部门，如数字身份（Takemiya and Vanieiev 2018）、选举（Cooley\
  \ et al. 2018）和合同验证（Upadhyay et al. 2020）。因此，完全有可能将其应用于 `IoT` 应用中，以解决其一些挑战。\n\n\
  本章探讨 `Blockchain` 作为 `IoT` 应用安全组件的效用，以及它如何缓解由连接对象组成的网络世界在全球范围内共享个人和非个人数据所带来的日益增加的风险。我们将这项工作分为四个独立的部分，结构顺序如下。在第\
  \ 3.2 节中，我们将 `Blockchain` 作为一项新技术进行探索，揭示其可靠性的奥秘；此外，我们讨论其起源、特征、关键组件以及提升其声誉的不同协议。在第\
  \ 3.3 节中，我们介绍智慧城市、`IoT` 应用概念，以及它们如何已成为现代社会的一部分，真正实现了在我们日常生活中的无处不在。此外，我们介绍复杂事件的概念，并解释它们如何扩大选择范围以丰富数据收集。最后，在第\
  \ 3.4 节中，我们讨论并提供了一种系统的方法，说明 `Blockchain` 如何集成到 `IoT` 应用中以增强其安全性。\n\n## 3.2 区块链概述\n\
  \n`Blockchain` 和 `Bitcoin` 是文献中无处不在的两个术语。然而，它们截然不同，但又相互关联，正如我们将在以下小节中所述。\n\n###\
  \ 3.2.1 区块链简介\n\n2009 年初，中本聪创建了 `Bitcoin` 的第一个创世区块，引爆了第一种原始加密货币 `Bitcoin` 的诞生，其骨干网络技术\
  \ `Blockchain` 也随之浮出水面（Nakamoto 2009）。`Blockchain` 指的是一种由无限数量的区块组成的不可变区块数据结构，这些区块保存着关于特定交易的加密信息。换句话说，它代表一个链表，其中每个区块都引用前一个区块；此外，其不可变性在于每个区块的加密信息都依赖于前一个区块；因此，账本越大，在没有正确技术的情况下破坏其数据就越困难。`Blockchain`\
  \ 的主要卖点在于它如何在没有第三方的情况下自然地提供数据安全；而且，它吸引了大量关注和呵护，这有助于其改进。因此，自 2009 年以来的过去几年里，`Blockchain`\
  \ 得到了开发和演变，并呈现出三个不同的版本。\n\n`Blockchain` 的第一个版本指的是 `Blockchain 1.0`，它是一个启动器，用于开发\
  \ `Bitcoin`，允许任何计算机启动一个节点并成为复制账本的网络的一部分——也称为全节点、数字钱包、挖矿设备和挖矿软件。图 3.1 说明了 `Bitcoin`\
  \ 交易是如何处理的以及 `Blockchain` 在其执行中的作用。验证被称为 `Proof-of-Work (PoW)`（工作量证明）共识过程，它验证节点网络内发生的交易。轻节点创建交易后，交易被分发并使用加密哈希进行加密。然后，节点参与解决一个难度随账本大小而升级的问题。这个操作称为挖矿，需要重要的物理资源和能源容量才能运行。一旦矿工解决了问题，交易就会被提交并广播给\
  \ `P2P` 网络中所有在场的节点，作为回报，矿工会获得奖励，作为参与交易去中心化验证的费用，并随之将信息区块添加到不可变链中（Schinckus 2020）。这个过程称为共识协议，它对于允许\
  \ `P2P` 网络协作并建立信任地共同工作非常重要。\n\n\n\n\n\n![FIGURE 3.1 Bitcoin transaction illustration.](img/Fig03_01.jpg)\n\
  \n**FIGURE 3.1** 比特币交易示意图。\n\n区块链协议验证并保障区块引入账本。\n\n### 3.2.2 区块结构\n\n区块链账本利用 `P2P`\
  \ 网络和公共时间戳服务器自主运行。它由许多区块组成；每个区块都有一个代表其标识符的唯一哈希值。\n\n链中的第一个区块是创世区块，即账本的头部，没有父区块，如\
  \ **图 3.2** 所示，其结构分为两部分（**Torky and Hassanein 2020**）：\n\n![FIGURE 3.2 Blockchain\
  \ block structure.](img/Fig03_02.jpg)\n\n**FIGURE 3.2** 区块链区块结构。\n\n*   **Merkle\
  \ Tree Root Hash（默克尔树根哈希）** – 它是一个用于验证区块内所有交易的哈希值，通过哈希代码的二叉树递归生成。\n*   **Timestamp（时间戳）**\
  \ – Unix 时间戳，用于不可篡改地追踪区块的创建和更新时间，以验证其完整性。\n*   **N-Bits** 标识指定有效区块的哈希代码目标阈值。\n*\
  \   **Nonce（随机数）** 是一个用于加密操作的随机 4 字节数字。\n*   **Parent Block Hash（父区块哈希）** 是一个指向前一个区块的\
  \ 256 位哈希代码。\n*   **Difficulty（难度）** 是一个指向前一个区块的 256 位哈希代码。\n*   **Content（内容）**\
  \ 存放待保存至账本的交易。\n\n### 3.2.3 共识协议\n\n区块链是一个由许多节点通过 `P2P` 网络连接、由时间戳服务器管理的去中心化账本。为了将新创建的区块附加到账本，共识协议旨在解决这一问题：共识问题。该问题等同于拜占庭将军问题（`BGP`）。该问题阐述了将军们在存在叛徒和通信错误的情况下能否达成共同结论。区块链共识协议具有\
  \ `BFT`（拜占庭容错）特性，并遵循 `Proof-of-*`（工作量证明/权益证明等）惯例，其机制目的是决定哪些节点将参与验证区块（**Panarello\
  \ et al. 2018**）。在加密货币中，共识协议旨在增加挖矿过程的难度，以实现不可穿透的不可变层，因为每个区块相互依赖，篡改整条链在理论上是可能的，但如果没有更新的技术基础设施（量子计算机）（**Fernández-Caramès\
  \ and Fraga-Lamas 2020**），这种尝试在成本上是徒劳的。\n\n`PoW` 协议是区块链技术中采用的第一种机制，其中一方必须解决一个计算密集型数学问题，以向另一方证明其付出了巨大努力。在加密货币背景下，该数学问题为加密谜题，其难度随账本规模而调整。`PoW`\
  \ 在创建哈希和验证哈希时所付出的努力是不对称的。事实上，从验证过程开始，区块哈希的任何微小变化都会导致匹配失败，因为输出哈希将会不同。然而，对于哈希生成，区块链网络使用只能通过试错法解决的加密谜题，且传递给这些问题的参数将始终变化，将本可能是通用任务的事情变成了实际的“工作”，并具有时间成本。然而，由于\
  \ `PoW` 协议一次能处理的交易数量有限（**Nakamoto 2009**），且其能源成本若用于公共区块链（即加密货币）会对环境产生负面影响（**O’Dwyer\
  \ and Malone 2014**），因此已显过时。\n\n`PoW` 被证明有许多缺点，但截至 2021 年，比特币和以太坊仍在使用它。然而，后者将切换到另一种共识机制，即权益证明（`PoS`）。它的设计初衷主要是应对\
  \ `PoW` 面临的安全威胁，例如 51% 攻击——恶意用户控制网络 51% 以上的算力，在决定区块是否损坏时破坏投票。事实上，在决定将交易追加到区块链时，`PoS`\
  \ 协议要求验证节点必须持有一定数量的区块链代币——加密货币术语中的币，才能参与验证。因此，通过这种机制，区块链迫使攻击者将自己置于风险中才能发动攻击（**Tasca\
  \ and Tessone 2019**）。\n\n一种比 `PoW` 更环保的替代方案是容量证明（`PoS`），其核心在于分配磁盘空间而非计算资源。它也是一类基于前置需求的共识机制。事实上，节点不再持续搜索并付出努力寻找加密谜题的解，而是在启动前存储一份可能解的列表（绘图），然后使用这些解开始挖矿。因此，这种替代方案被证明更节能，因为它需要的电力更少，且硬盘价格比强大的处理器便宜（**Dziembowski\
  \ et al. 2013**）。`PoW` 的存在促使研究人员开始寻找成本效益高的替代方案，从而以环保且安全的方式维护区块链的稳定性和核心支柱。\n\n###\
  \ 3.2.4 智能合约\n\n区块链是一项技术，它实现了一个完全无需信任的系统，无需第三方参与其两个用户之间的交易。智能合约是区块链的另一项功能，由律师兼密码学家\
  \ Nick Szabo 提出。它们只是合同的数字形式，即一组需要满足的条款，以执行特定任务，如转移资产或存款（**Alharby and van Moorsel\
  \ 2017**）。此外，基本文档存在于公共账本上，因此它们也符合防丢失安全性，且只要节点足够多就可以备份。最后，智能合约是脚本化且自动执行的；因此，它们不需要任何中介，非常便捷。\n\
  \n## 3.3 智慧城市与物联网应用\n\n很长一个十年来，由小型智能设备统治世界的预言在投机者脑海中游荡，随后激励许多科学家和企业家投入资源，利用创新技术彻底颠覆世界，这些技术已成为我们日常生活的一部分。在下一节中，我们将解释这是何种技术，并探讨其在现代社会中的规模。\n\
  \n### 3.3.1 总体概述\n\n\n\n\n\n#### 物联网与智慧城市\n\n物联网在构建一个智能事物（连接互联网的物理或虚拟对象群组）互联并交换数据的空间中发挥着重要作用，这种交换要么自主进行，要么以单元群组的形式进行（Lo\
  \ et al. 2019）。云计算、机器学习和数据分析被用于物联网建设（Panarello et al. 2018）。十多年来，它一直是研究领域的热门话题，其文本存在早已超越现实，长期以来成为我们生活中至关重要的一部分，并持续贯穿从自然、工业到城市现象的一切。物联网帮助世界各地的许多城市提升了其智慧水平，以至于许多城市如今已在报纸头条中被视为智慧城市。从根本上说，智慧城市是指利用物联网帮助决策者实现城市和市民服务自动化、推进设施物流与立法建设的城市，旨在培育一个生态系统，让中小微及大型企业均能蓬勃发展，并为各自城市的物联网化做出贡献（Kummitha\
  \ and Crutzen 2019）。此外，智慧城市的称号是城市与其市民（无论是个人还是组织）之间双射关系的结果，如图 3.3 所示。事实上，后者参与成为决策者计划的一部分，以产生反馈、丰富流程并将其优化至极限；与此同时，将城市视为其居民的总和进行紧凑化，促进城市经济及其所属国家的经济发展（Basmi\
  \ et al. 2020）。\n\n![FIGURE 3.3 Smart city components.](img/Fig03_03.jpg)\n\n**图\
  \ 3.3** 智慧城市组件。\n\n大多数人类社会活动领域自古以来就并肩演进。农业作为帮助人类物种繁衍昌盛的主要技术之一，已从涉及人力的传统方法、发展到由人控制的机械机器，并最终演变为如今各种设备协同自主运行，测量控制作物品质和特性的环境因素，以满足日益增长的粮食需求（Hsu\
  \ et al. 2020）。同样，供应链是关键行业之一，也是经济的重要器官之一。个人和组织如今都已习惯从供应商追踪货物至目的地。因此，许多仓储公司和工厂正在推行从精巧高效到不人道的各种技术和政策来对待员工。例如，在中国惠阳，阿里巴巴的仓库几乎完全由机器人管理，它们能搬运\
  \ 500 公斤重的货物，使用激光避免碰撞，并由一个中央应用程序管理，一次仅需一名人工监控。相比之下，亚马逊仓库工人的薪资是美国最低的之一，时薪约 15 美元。此类工作会损害人体健康，或许外骨骼等解决方案有助于减少肌肉骨骼疾病（Bances\
  \ et al. 2020），但重要的是要想出不让个人从事重复性任务、且可用智能设备复制的人体工程学解方案。在乌托邦社会中，人力资源是社会最宝贵的资产；因此，社会基础设施必须设计为培养能够适应自第一次工业革命以来我们正在经历的快速技术飞跃的个体。事实上，根据麦肯锡全球研究院的数据，到\
  \ 2030 年将有 4500 万美国人失业（Lund et al. 2021）。因此，物联网技术必须保持一致，并应有效地围绕成本效益展开，无论其复杂性和创造性如何。\n\
  \n### 3.3.2 复杂事件\n\n电信技术和智能设备在赋予现代世界生活质量飞跃方面发挥了重要作用。但来自物联网应用的累积数据经过分析后，要么转化为其他设备消费的可感知输出，要么归类为表面上合成的事件，称为复杂事件。这是一个高层概念，也是一种基于从各种来源发出的海量数据流中提取相关信息的软件技术。其旨在推断数据之间隐藏的关系，尽管技术手段肯定有所不同（Bruns\
  \ et al. 2019）。在 Basmi 等人（2019）中，我们在智慧城市背景下使用复杂事件，并将其定义为可在智慧城市中发生的一组事件的抽象表示，例如：城市、自然或工业事件。我们提供了一个数据模型来表示这些事件，使其成为交互系统的一部分，该系统在传感器和执行器之间扮演门户的角色。同样，我们拓宽了传感器和执行器的定义，使其与复杂事件相关联；因此，它们对应于任何能够通过观察或接收来通信事件、并将其转化为实际可观测的虚拟或物理现象的对象（无论虚拟或物理）。因此，我们创造了一个数据不仅流通，还能成熟并转化为另一种形式的环境，如图\
  \ 3.4 所示。\n\n![FIGURE 3.4 Complex events data distribution.](img/Fig03_04.jpg)\n\
  \n**图 3.4** 复杂事件数据分布。\n\n为了帮助理解我们随 Portunus 复杂事件框架引入的概念，我们丰富了 Basmi 等人（2020）中提出的领域数据模型；它代表了系统领域数据模型。在图\
  \ 3.5 中，从关注特征开始，它代表现实世界中存在并关联到数据流的对象。数据流是一个具有标识符的对象，它汇集了一组由传感器收集的事件，这些传感器收集与特定现象相关的事件，其值的元信息可在观测元数据模型中找到，随后被订阅的执行器消费。传感器具有其他元信息，帮助系统识别其任一阈值何时被达到，例如“预警值”、“传感器空闲预警”和“危险值”。数据流是连接对特定关注特征现象感兴趣的传感器和执行器的关键，无论其性质如何。这种接入为创建更丰富的数据池提供了可能性，并有助于揭示独立不同事件之间潜在的联系。\n\
  \n![FIGURE 3.5 Portunus complex events domain data model.](img/Fig03_05.jpg)\n\n\
  **图 3.5** Portunus 复杂事件领域数据模型。\n\n## 3.4 物联网与区块链集成\n\n在浏览了区块链和物联网之后，可以提出许多设想，例如结合这两种技术的可能性，以及它们为促进智慧城市领域信息流通的安全生态系统带来的益处。因此，我们将在以下章节中探讨这些主题。\n\
  \n### 3.4.1 物联网安全性通缩\n\n\n\n\n物联网的无处不在可被视为一种福祉，因为它用可替换的高性能小型机器取代了由人类管理的手工或系统化服务。后者与远程服务器通信，或直接在其单元内部通信，利用从外部世界收集的数据来完成任务：周围环境、无生命物体、自然或工业现象以及人类。物联网连接设备持续增长，每年的预测数量都超过数十亿台。尽管数字不够精确，但仅\
  \ 100 亿台设备（甚至更少）就暴露在外部世界中，它们的数据实实在在地存在，并代表了特定时间点上外部世界一部分的快照。正如每一个数据库或系统一样，恶意实体可能会觊觎这些数据，意图窃取或破坏它们，从而造成现实世界的损害。\n\
  \n例如，2016 年，许多知名大型网站因一种名为 `Mirai` 的恶意软件而瘫痪。该病毒持续扫描互联网以寻找物联网设备的 IP 地址。`Mirai` 包含一个它不会感染的\
  \ IP 地址范围表，包括私有网络以及分配给美国邮政服务和国防部的地址。`Mirai` 能够抓取的大部分地址属于物联网设备，这些设备仍沿用出厂设置和凭证，而这正是其算法的一部分。随后，它控制设备，通过占用大部分带宽来隐藏自身，删除任何其他恶意软件，并封锁所有管理端口以保护自身；最终，重启后，`Mirai`\
  \ 会在瞬间再次感染该设备。结果，该病毒接管了可能占数十亿设备很大一部分的设备——这些设备本应巩固物联网的声誉——组建了一支受感染设备大军，将 GitHub、Twitter、Reddit、Netflix、Airbnb\
  \ 及许多其他服务作为其 DDoS（分布式拒绝服务）攻击目标，导致这些服务瘫痪了一整天（Zhang et al. 2020）。\n\n随后几年发生了许多类似事件，未来仍将发生。然而，随着年份的增加，现代世界正趋向于对物联网的更紧密耦合和更强依赖，后果可能比无法访问您最喜爱的搜索引擎\
  \ 5 分钟更严重，例如自动驾驶汽车和城市物联网设备。\n\n在文献中，区块链可被描述为数据安全的“救世主”，其坚实的天然安全架构基于匿名性、不可篡改性和无需信任。然而，将这两种技术融合仍处于起步阶段，是研究中众多提案和解决方案的主题（Tran\
  \ et al. 2021）。此外，某些技术可能不适用于不同的应用，只能在相同或相似场景的背景下应用。\n\n### 3.4.2 物联网应用架构\n\n图 3.6\
  \ 展示了物联网应用通常包含的四个阶段。第一阶段汇集了与外部世界交互的部分，涵盖物理和虚拟事物（传感器和执行器等）。通常，物联网设备的处理能力有限，其任务仅限于创建测量值或生成输出。任何数据处理仅服务于这些目的。第二阶段代表互联网网关、传输支撑、将模拟测量值转换为数字形式并通过互联网或蓝牙等介质直接发送给其他设备的工具和程序。第三阶段代表在数据发送到数据中心之前负责预处理和转换数据的技术。该阶段的技术基础设施减轻了数据中心繁重的资源使用负担。文献中也将其称为雾层，包含减轻终端设备负担的技术和手段（Bhushan\
  \ et al. 2020）。例如，它可以利用机器学习进行数据过滤以检测异常、过滤异常传输，或利用易失性内存控制设备群以实现优化。最后，第四阶段代表准备好数据的目的地，在那里数据被收集、深度分析、管理和存储（Fuller\
  \ 2019）。还有其他类似物联网架构四阶段的逻辑架构，但除符号和细微差别外，它们大体相同。下一步是确定区块链在物联网系统中的合适角色。我们从关联性最低的可能性入手，讨论其应用的有效性。\n\
  \n![图 3.6 物联网应用架构阶段。](img/Fig03_06.jpg)\n\n**图 3.6** 物联网应用架构阶段。\n\n### 3.4.3 区块链作为物联网架构中的组件\n\
  \n在将物联网应用呈现为具有灵活架构的复杂系统后，我们讨论区块链如何作为高效扩展用于后者。\n\n#### 3.4.3.1 区块链作为安全数据存储\n\n在 Tran\
  \ 等人（2021）中，区块链在物联网系统中的逻辑位置作为系统的功能性可替换模块随区块链而来。尽管使用区块链的主流技术（如加密货币等）大多是公开的，但它也可以作为私有解决方案纳入（Bhushan\
  \ et al. 2021）。尽管该模块在访问控制管理、业务流程编排、数据存储、认证管理、信任管理系统或通信通道等应用示例之间有所变化。物联网应用是极短时间内产生大量数据的系统，将数据封装在交易中以安全存储会起阻碍作用，并随着存储的区块链交易数量增长而拖慢系统性能，考虑到区块链节点验证传入交易所需的时间和延迟，这会随难度增加和网络负载而扩展（Cao\
  \ et al. 2020）。更重要的是，在许多用例场景中，输出数据作为单个测量或观察并不重要（无论其性质如何），但数据作为按时间戳间隔或特定属性分段的大块数据组进行处理时则很重要。然而，说设备收集的数据完整性和数据不重要是不对的；事实上，正如单个数据单元不如其总和有价值这一说法，如果大多数单元被破坏，则操作和分析将不得不应用于损坏的数据，结果将只是误导性的噪音。因此，依赖区块链存储数据的物联网架构不得牺牲速度和响应性。图\
  \ 3.7 展示了一种架构，其中数据中心和云阶段提供区块链数据库。如前所述，在需要高交互性的系统中存储并尝试读取数据是非最优的。因此，为了补偿这一点，云层将提供一个注册表，可运行批量操作以与分布在雾层许多组件上的片段同步，这些片段作为快速复制数据库。\n\
  \n![图 3.7 使用区块链作为数据库的物联网应用架构。](img/Fig03_07.jpg)\n\n**图 3.7** 使用区块链作为数据库的物联网应用架构。\n\
  \n#### 3.4.3.2 区块链作为认证管理器\n\n\n\n在 Basmi 等人 (2020) 的研究中，我们提出了一个复杂时空事件框架架构，重点介绍了四个层：\n\
  \n*   **数据分发层**：它托管从传感器收集复杂事件并将其分发给执行器的组件。\n*   **日志层**：记录所有系统活动，包括错误、警告和系统信息。\n\
  *   **对象数据信息层**：提供负责存储系统中流通的所有事件、与之通信的事物以及所有关注特性及其相关信息的组件。\n*   **认证层**：包含控制已连接复杂事件对象的认证和访问权限的组件。\n\
  \n将系统设计为其组件内部的一群微服务，为架构物理组件（数据库系统、去中心化系统编排框架和核心应用）的演进提供了无限可能，因为它们是自主的，并且要么通过编排方式通信，要么使用请求-响应方式，要么两者兼用\
  \ (Newman 2015)。我们选择不详细展示分发层、日志层和对象数据信息层的内部组件，以便将重点放在我们如何集成区块链作为认证管理器上。\n\n在之前的架构中，认证层提供了验证传感器数字身份的可能性，方法是生成可过期的公钥加密和订阅令牌——订阅令牌用于连接到特定数据流。传感器持有公钥，用它加密数据并连同令牌发送以保存其事件。在内部，认证器将其数据保存在集中式数据库中。通过用基于区块链的数据库替换集中式数据库，整个框架将受益于增强的安全性。在\
  \ 图 3.8 中，我们展示了传感器如何经历一个过程：系统为其创建一个令牌和一对公钥和私钥，以便它可以用它们加密其事件并发送给系统收集服务。Portunus 将区块链作为数据库，只不过这是一个非常难以攻破的数据库，因为每个区块都保存了之前所有已保存交易哈希的历史。如果检索到的令牌未过期，则继续使用私钥作为第二道屏障解密哈希值；如果失败则拒绝该事件，但如果成功则在系统中处理并保存，并分发给属于同一数据流的其他执行器。\n\
  \n![图 3.8 在区块链数据库中保存 CE 传感器认证凭据。](img/Fig03_08.jpg)\n\n**图 3.8** 在区块链数据库中保存 CE 传感器认证凭据。\n\
  \n## 3.5 结论\n\n随着加密货币的出现，区块链在过去十年的技术革命中扮演了关键角色。得益于其天然的安全性、匿名性、可审计性和去中心化，许多加密货币的价值在短短\
  \ 6 年内从几百美元飙升至数万美元。这种成功促使该技术被应用于包括物联网在内的各个其他领域。物联网应用是操纵传感器和执行器网络以交换和处理其数据的系统，无论是在本地还是全球范围内。另一方面，当决策者利用物联网改善其关键服务时，一些城市被称为智慧城市。智慧城市涉及来自公共和私营部门的个人和组织的总和，以增加其范围内流通的数据量并疏通其渠道。有时，在城市中传播的数据或具体的单一事件可以被组装起来，形成所谓的复杂事件。此外，复杂事件还涵盖了自然现象以外的现象，如工业事件、城市事件，或者基本上任何能够发出有意义数据的可观测对象。在同一背景下，Portunus\
  \ 是一个复杂事件分发框架，提供操纵复杂事件的基本组件。实际上，除了连接到互联网的数十亿智能设备外，我们还获得了更多发送额外形式数据的候选者，这引出了一个问题：是否有可能改进物联网应用的安全性。因此，我们发现只要不损害这些系统快速且闪电般的交互性，区块链就可以被智能地改造以服务于这一目的。基于这个原因，我们提出了一种关于如何实现集成的方案，即通过用区块链扩展认证器来保护加密密钥数据库。\n\
