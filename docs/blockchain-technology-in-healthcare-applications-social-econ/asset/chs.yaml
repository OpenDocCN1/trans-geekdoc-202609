  \ 恶意软件攻击 [[24]](#C_016_c11.xhtml#r11_24) | 恶意软件攻击是旨在获取访问权限或破坏网络的软件。 | 可用性、机密性 |\
  \ 网络层 |  | ✓ |  | ✓ |  | ✓ |\n| 窃听攻击 [[21]](#C_016_c11.xhtml#r11_21) | 窃听攻击是一种威胁物联网机密性的攻击，旨在获得未经授权的访问以获取必须对恶意节点不可访问的机密信息。\
  \ | 机密性 | 物理层 | ✓ |  |  |  |  |  |\n\n**缩略语说明**：AA，主动攻击；EA，外部攻击者；HA，硬件攻击；IA，内部攻击者；PA，被动攻击；SA，软件攻击。\n\
  \n## 11.3 基于物联网的医疗应用中的安全需求\n\n我们根据 11.2 节 中所示的物联网攻击目的，将物联网安全需求分为三类：数据安全、通信安全和设备安全。表\
  \ 11.2 总结了这些安全需求。\n\n**表 11.2 基于物联网的医疗安全需求**\n\n| 特性 | 描述 |\n| :--- | :--- |\n|\
  \ **数据安全** | **机密性** [[3]](#C_016_c11.xhtml#r11_3)<br>只有授权的人员或实体才能访问设备信息、系统设置和医疗数据。在访问任何与医疗相关的机密信息之前，这些实体必须经过授权。然而，现有的医疗设备（如胰岛素泵通信路径）可能被窃听，以获取患者数据和设备相关信息。\
  \ |\n| | **完整性** [[4]](#C_016_c11.xhtml#r11_4)<br>当交换的消息受到保护，防止未经授权的修改时，即实现了完整性。它是指以安全的方式从设备、应用程序或基础设施传输数据，而不篡改原始数据。\
  \ |\n| | **隐私** [[6]](#C_016_c11.xhtml#r11_6)<br>隐藏个人信息以及控制其处理方式都是隐私的例子。在数据收集、传输和存储过程中，必须考虑数据隐私。针对数据隐私问题提供了许多切实可行的解决方案。例如基于匿名化的解决方案、伪随机数生成器、分组密码和流密码等技术。\
  \ |\n| **通信安全** | **认证** [[8]](#C_016_c11.xhtml#r11_8)<br>认证是验证某人或某物是否为其声称的身份的机制，用于允许访问信息系统中的资源，防止未经授权访问程序、系统、网络或设备；只有经过认证的对等方才能参与该过程。认证机制分为两类：节点认证（验证访问网络信息的权利）和消息认证（通过认证消息来保证其完整性和隐私）。\
  \ |\n| | **访问控制** [[12]](#C_016_c11.xhtml#r11_12)<br>访问控制是一种安全要素，用于检查人员和系统是否有权限对其他系统和资源执行操作。访问控制算法分为五种不同类型：基于角色、基于组织、基于能力、基于属性和基于信任的算法。\
  \ |\n| | **不可抵赖** [[4]](#C_016_c11.xhtml#r11_4)<br>医疗系统会执行不同的程序，这些程序通常保存在访问日志中。对该日志的任何更改都应被追踪和监控，且仅允许确认的用户进行修改。攻击者可能试图删除这些日志以掩盖踪迹。许多资源受限的医疗设备没有日志记录功能，攻击者可能试图在不留下任何痕迹的情况下访问系统。\
  \ |\n| **设备安全** | **信任** [[8]](#C_016_c11.xhtml#r11_8)<br>关于与未知实体通信做出决策的过程称为信任管理。为了保护物联网系统，需要与受信任的物联网设备进行交互，以防止流氓节点执行不良操作。信任管理技术分为两类：确定性信任和非确定性信任。\
  \ |\n| | **可用性** [[16]](#C_016_c11.xhtml#r11_16)<br>在正常和紧急情况下，医疗系统的服务应始终可供授权用户访问设备系统和患者数据。在可用性网络中，信息应全天候（24/7）可供真实用户访问，以防止网络中的多种攻击。\
  \ |\n\n## 11.4 基于物联网的医疗应用中的安全解决方案\n\n安全是基于医疗系统的物联网中最热门的研究课题之一，吸引了来自学术界、工业界和标准化机构的众多研究人员。迄今为止，已出现大量旨在解决物联网安全问题的解决方案。为了提高物联网安全性，提出了几种新技术和方法。在以下小节中，我们将通过归纳为六大类来讨论医疗系统的不同现有安全措施，包括雾计算、软件定义网络、区块链、轻量级密码学、同态加密与可搜索加密，以及机器学习。\n\
  \n### 11.4.1 基于雾计算的解决方案\n\n\n\n\n\n#### 基于雾计算的解决方案\n\n雾计算作为一种新范式被引入，用于扩展云计算的处理资源。在网络边缘，它提供存储、处理和网络/通信功能\
  \ [20]。雾计算由部署在靠近物联网设备并连接到云服务器的雾节点组成。由于物联网设备资源有限，雾节点可通过提供认证、隐私保护和加密来帮助保护物联网环境。文献中提供了多种利用雾计算保护基于物联网的医疗系统的安全方案。本小节概述了最新的综述。\n\
  \nHassen 等人 [21] 通过结合雾计算和云计算等物联网应用，提出了一种居家住院系统。该研究旨在提出一种用于冠状病毒大流行期间医疗系统的智能模型。Pham\
  \ 等人 [23] 开展了另一项研究，构建了“基于云的智能家居环境”，这有助于对患者进行健康评估和监测，从而为他们提供居家医疗服务。Tuli 等人 [24] 旨在探究雾计算系统在开发名为\
  \ Health Fog 的框架中的效用，该框架用于心脏疾病的深度学习和实时分析。该研究成功结合物联网系统开发了 Health Fog 模型的系统架构。表 11.3\
  \ 总结了这些工作。\n\n#### 基于软件定义网络的解决方案\n\n由于将可编程性和智能引入网络，软件定义网络 (SDN) 是一种改变网络世界的新范式。相应地，在基于\
  \ SDN 的网络中，存在数据平面、控制平面和监控平面 [26]。这些功能平面各自在减少或保护其对应资源方面面临独特的挑战。软件定义网络使医疗机构能够利用虚拟化的优势，从而提高网络敏捷性并降低总体拥有成本。由于其设计，SDN\
  \ 提供了安全优势 [27]。由于 SDN 控制器可以同时查看所有网络数据，因此更容易发现入侵者在网络流量中产生的异常行为。一旦发现新威胁，操作员可以即时设计新软件来评估和解决漏洞，而无需等待制造商专有设备的操作系统或应用软件更新。文献中提供了多种利用软件定义网络保护基于物联网的医疗系统的安全方案。在物联网应用中，SDN\
  \ 可成为密钥管理 [28]、身份管理、认证、机密性和入侵检测的绝佳解决方案。作者在 [29] 中演示了一种用于物联网设备的 OpenFlow SDN 架构。该建议架构包含受管理的物联网网关，用于检测攻击和异常，以确定哪些设备出现故障以及网络中哪些节点受到影响。Aydeger\
  \ 等人在 [30] 中提出了一种基于 SDN 的 MTD（移动目标防御）机制，用于防御称为 Crossfire 的特定 DDoS 攻击。表 11.3 总结了这些工作。\n\
