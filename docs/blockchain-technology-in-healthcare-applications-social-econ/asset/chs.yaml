- "## 医疗保健应用中的区块链技术：社会、经济与技术影响\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n##\
  \ 前言\n\n如今，医疗保健组织正利用各种多媒体技术，将自身转型为更加以用户为中心、协调高效的系统。然而，此类系统内的数据管理需要投入巨大的人力，并面临安全漏洞的威胁。物联网（`IoT`）与医疗保健的融合可缓解此类威胁，降低总体成本，并提高患者护理标准。然而，这些\
  \ `IoT` 设备易受大范围攻击。由于医疗数据包含敏感和个人信息，可能引起各类网络犯罪分子的兴趣。区块链被视为最具颠覆性和革命性的技术，将在实时环境中为控制系统提供保护和控制的保密性。区块链技术能够通过存储来自众多设备的数据并形成各方，在无需联邦云的情况下跟踪、组织和验证通信。此外，区块链促进了患者数据的可访问性，并记录患者档案及中间活动信息。然而，区块链领域的研究仍处于起步阶段。这从存在许多限制区块链在医疗应用中广泛采用的开放性挑战中可见一斑。本书重点关注与分布式账本技术（`DLT`）的最新安全、隐私、互操作性解决方案、安全多媒体处理和区块链技术相关的技术、经验和教训。本书的核心在于解释这些技术为何具有颠覆性，并进一步探讨这些颠覆在技术、经济和社会方面的具体后果。本书从可靠、可信和安全的数据传输视角，提供了理论概念、实证研究以及与医疗应用开发相关各个方面的详细概述。此外，本书还旨在激发关于此类颠覆性技术兴起所带来的新“分布式信任”范式的伦理影响的进一步研究。\n\
