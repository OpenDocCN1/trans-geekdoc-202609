  \n# 13 医疗系统区块链中的互操作性、匿名性和隐私问题\n\n**Avinash Kumar**、**Abhishek Bhardwaj** 和 **Trisha\
  \ Bhowmik**  \nSharda University\n\n**Ahmed J. Obaid**  \nKufa University\n\n**Muzafer\
  \ Saracevic**  \nUniversity of Novi Pazar\n\n**Tanmayee Prakash Tilekar**  \nISAC\
  \ India\n\nDOI: [10.1201/9781003224075-13](http://doi.org/10.1201/9781003224075-13)\n\
  \n## 13.1 简介\n\n随着大数据的出现，医疗记录变得越来越大且更加复杂，但它们尚未得到优化。常见的情况是发现使用相同标识符和姓名的重复记录。这些记录存储在医疗架构的不同网络和目录中\
  \ [[1]](#C_018_c13.xhtml#r13_1)。由于医疗数据高度敏感，数据安全变得至关重要，以防止安全漏洞和非法活动。如果未经授权的用户获得患者信息，该信息可能被出售给对手或从医院泄露。患者的个人信息可能会在公共领域暴露\
  \ [[2]](#C_018_c13.xhtml#r13_2)，[[3]](#C_018_c13.xhtml#r13_3)。为了成功管理医疗保健，保护患者数据至关重要。包含更多易被篡改的个人和敏感数据的分布式网络，可以使用区块链技术进行保护。更新或向区块链添加交易的唯一方式是通过哈希值；这也确保了现有交易无法被篡改\
  \ [[4]](#C_018_c13.xhtml#r13_4)。\n\n制药行业现已成为任何国家的重要资产，因为它确保了药品和其他医院必需品的适当供应。制药行业现在正演变为传统和现代工业概念的结合体\
  \ [[5]](#C_018_c13.xhtml#r13_5)，[[6]](#C_018_c13.xhtml#r13_6)。这些行业拥有非常复杂的工作环境。对制药行业进行优化、控制和监控以实现安全和可持续的工作非常重要。区块链是一项非常安全的技术，可用于供应链（SC）以及数据完整性管理。在制药行业中使用区块链将带来各种解决方案，可实现行业的完整性和安全性\
  \ [[7]](#C_018_c13.xhtml#r13_7)，[[8]](#C_018_c13.xhtml#r13_8)。区块链具有非常特定的数据结构。此外，它可高效用于追踪和监控。区块链的使用将有助于通过确保传输中和存储中的数据完整性，使制药行业更加可靠。本文力求涵盖区块链的关键方面，以提升制药行业。\n\
  \n总之，本文的主要贡献如下：\n\n*   本文展示了医疗保健和制药行业的演变。\n*   本文展示了区块链应对医疗生态系统的贡献及其与追踪和监控的相关性。\n\
  *   本文审视了医疗保健和制药行业的各种关键挑战及其利用区块链的解决方案。\n\n\n\n\n\n### 摘要\n\n*   本文介绍了区块链可在制药供应链行业中处理的各种方法。\n\
  *   本文展示了利用区块链实现医疗和制药行业数据共享与互操作性的最先进解决方案。\n\n本文其余部分安排如下：第 13.2 节阐述医疗保健的演变。第 13.3\
  \ 节描述区块链的作用。第 13.4 节介绍医疗和制药行业面临的关键挑战及其基于区块链的解决方案。第 13.5 节介绍在医疗和制药行业中实施区块链。最后，医疗供应链已在第\
  \ 13.5 节中涵盖，随后是第 13.6 节中的结论与未来研究方向。\n\n## 13.2 医疗保健及其演变\n\n由于医疗保健行业的快速发展，生活质量得到了提高，因此具有重要的社会意义。医疗保健领域解决实际健康问题，进而有助于提高生活质量\
  \ [9]。通过使用计算机执行任务，如共享一致信息、临床培训与诊断协作、计算机化医疗记录系统以及大数据分析，医疗保健系统已取得显著进步 [10, 11, 12]。\n\
  \n医疗保健系统已发展壮大，并帮助制药行业变得更具竞争力，克服了诸多挑战 [13]。为了更好地管理医疗记录，用户（如医生、社工和护士）可为患者提供更高质量的护理。通过计算机，可采用多种方法来帮助组织和管理患者护理所需的信息\
  \ [11,13,14]。\n\n计算机中预先存储的数据可提供关于患者状况的重要医疗信息。这些数据可被组织并用于调查疫情以及不同地区的医疗设施。不同领域的研究人员利用这些数据来理解现象并克服特定挑战\
  \ [11]。由于这些信息涉及患者的个人信息，必须严格保密。患者个人信息泄露给公众可能会对医疗机构的声誉产生负面影响 [11]。为避免不道德或尴尬的情况，必须保护患者的临床信息，防止其被泄露。\n\
  \n区块链技术激励了各种研究人员和专业人士寻找解决方案，以创建更安全、更可靠的医疗保健系统 [12,15,16]。除了区块链的不可篡改性、透明性和可靠性外，其他因素还能缓解医疗保健中与患者数据相关的隐私和完整性问题\
  \ [15,17]。基于区块链的医疗保健系统仍面临需克服的困难 [18]。由于网络的核心特性未被明确规定，很难追踪信息可访问性背后的相互关联 [19]。控制和管理药品分销是区块链的众多应用方式之一，这可通过在供应链的所有阶段实施区块链来实现\
  \ [20, 21, 22]。除了打击假冒药品外，区块链还有助于防止药品转移和盗窃 [21]。值得注意的是，根据 Dash 等人 [23] 的研究，国际商业机器公司\
  \ (IBMC) 的一项研究表明，约 16% 的医疗管理人员计划在其工作环境中将区块链作为解决方案实施。此外，56% 以上的医疗高管计划优先实施区块链。总而言之，区块链可在各种医疗领域场景中发挥作用并受到追捧\
  \ [24]。有必要分析其后续的优势、劣势、机会和威胁。具体而言，该技术揭示了许多可为未来技术带来隐私和安全的关键点 [25]。Babenko 等人 [25]\
  \ 通过提供简要的系统性领域评估、所调查的实施搜索约束的简要讨论以及一些与该主题相关的工作，简要讨论了这些系统的优缺点。物联网 (IoT) 技术结合区块链在医疗保健领域也得到非常有效的应用。Cai\
  \ 等人 [26] 讨论了去中心化应用 (DApps) 在特定加密货币中的众多分发场景，并检查了区块链的一些基本特征。它提供了与医疗保健相关的当前区块链工作的深度分析。相比之下，本研究提供了区块链在各种场所实施的全面概述，并描述了其可能性。\n\
  \n## 13.3 区块链技术的作用\n\n一项名为区块链的先进技术于 2008 年左右随加密货币启动 [27,28]。最近，区块链在医疗保健、政府、金融、交通和其他领域执行一些精确任务。利用这项新技术，用户资产可被更高效、更安全地记录\
  \ [18]。Rouhani 等人 [29] 调查表明，它也可被理解为一种基于分布式账本理念的点对点 (P2P) 网络，并可被视为一种去中心化技术。区块链数据结构通过将每个区块与指向创世区块的加密哈希指针相链接，按时间顺序链接区块。因此，默克尔树\
  \ (MT) 将区块内的交易分组并分发到各节点 [30]。\n\n比特币、莱特币和以太坊等加密货币已向公众开放 [28]。这些理念促成了其他类型加密货币和基于区块链技术的发展。Hoy\
  \ 等人 [31] 将先进的区块链技术分类为区块链 1.0、2.0 和 3.0。区块链的第一阶段以比特币等加密货币的到来为特征（Berentsen [28]），并伴随着简单资产转移系统的出现而同时推出。随着区块链\
  \ 2.0 的出现，创新协议（智能合约）变得可见 [32]，并发现了新的使用方式，如贷款、房地产基金和其他投资。区块链的演进阶段是区块链 3.0，它适用于金融和社会的其他领域，如科学、制药和艺术。去中心化、不可篡改性、分布式账本、透明性、隐私性和智能合约是区块链的特征\
  \ [33,34]。\n\n\n\n\n加密货币（如 `bitcoin` 和 `Ethereum`）的出现增加了人们对区块链和智能账本研究的兴趣。区块链技术以一种可靠且绝对的方式累积和共享分布式数据，无需中介即可进行数据共享。它不需要交易确认集中化\
  \ [35, 36]。在区块链中，透明性使得跨网络访问基于账本的交易变得更加简单；网络可以连接来自多个节点的不同算力，因此其计算速度极快 [37]。区块链包含各种技术和设施。简述如下。\n\
  \n*   **哈希密码学**：区块链使用 `SHA256` 哈希添加交易。这是由美国国家安全局（NSA）创建的，具有 64 位字符代码、单向加密、确定性函数、增强计算和雪崩效应以抵抗碰撞。哈希算法也需要是确定性的。\n\
  *   **分布式 P2P 网络**：跨多个用户分发和更新数据。交易通过网络传输。\n*   **共识协议**：区块链网络拥有各自的共识协议，该协议决定允许哪些用户进行交易。\n\
  *   **不可变账本**：区块链网络记录所有交易，共享账本无法被第三方访问或修改。\n*   **挖矿**：奖励由源自 `nonce` 值的哈希值决定，为了获得奖励，矿工必须拥有高算力。\n\
  \n区块链网络可以复制到另一个不同的位置，以便与学者、合作机构或其他相关组织（如保险提供商）共享医疗数据。区块链是一个由连接的计算机组成的网络，它们共享数据并确保其准确性、可靠性和一致性。因此，区块链可以在一个位置填充数据，并分发到同一网络上的另一个或多个额外位置。此外，这些新位置将数据传输到整个网络，最终允许位置访问分发给整个网络中每个人的最新数据。\n\
  \n### 13.3.1 区块链网络的类型\n\n存在几个不同的区块链群组，每个群组都有其特征，反映了网络行为。就区块链的特性而言，Gautam 等人 [38]\
  \ 描述了区块链的分类。区块链的类型枚举如下。\n\n*   **公有区块链**：所有节点间保持交易透明。网络中的任何节点均可使用共识机制验证区块链交易。网络管理员无需授权即可允许该节点加入。此类网络内的节点能够以前所未有的水平进行通信与协作。`Bitcoin`\
  \ 和 `Ethereum` 等加密货币即此类网络的示例 [34]。\n*   **许可区块链**：该网络中的节点仅在获得组织事先授权后才被允许加入结构，该组织也控制其交易\
  \ [34]。由于访问该网络上的内容需要认证过程，因此提供了更高程度的保密性。Multichain Platform (MP) 是此类平台的一个示例 [39]。\n\
  *   **联盟区块链**：由于由一个群体管理且加入网络需要认证，因此与许可区块链共享部分特征。其特点是极少数验证节点可通过预定义功能验证交易。在此类网络中，验证交易需要选定节点间的相互同意，从而创建新区块并完成流程\
  \ [40]。\n\n### 13.3.2 区块链中的有效性验证流程\n\n区块链被用于许多算法实现中，其中算法（如 `proof-of-work (PoW)`）将区块链验证过程定义为挖矿\
  \ [28]。共识算法确定节点为验证区块必须遵循的规则。它遵循交易应执行的顺序，以确保验证节点从所有节点接收到满意的响应。区块可基于这些决定插入链中 [40,\
  \ 41]。区块链已成为更可靠的网络，归功于旨在验证区块的共识协议。医疗区块链的分析需要以下提及的关键协议。\n\n*   **PoW**：在此认证过程中，多个节点解决加密谜题（即矿工）。节点可通过找到解决方案来创建有效区块以进行交易并验证它。还值得注意的是，某些\
  \ `PoW` 实现（如 `Bitcoin`）会向获胜者提供奖励 [28]。在医疗场景中，它可用于检查有效交易。\n*   **权益证明**：选择验证者时会考虑其在网络中的参与度。该节点将通过验证拥有更多代币的区块来确定区块的真实性\
  \ [42, 43]。这可以识别涉及的节点是医疗系统中的有效用户还是入侵者。\n*   **实用拜占庭容错 (PBFT)**：该系统中的节点分为两类：客户端和服务端。`PBFT`\
  \ 通过多个过程验证交易，例如客户端节点向提供商节点请求交易。服务提供商节点广播交易以决定是否接受。节点在获得服务端节点对交易的接受后广播就绪消息。在这种情况下，只要许多节点批准交易，它就会进入“确认警报”阶段；节点确认交易后，向其他节点发送消息以验证其行为，最后发送方收到响应，确认交易是否有效\
  \ [43, 44]。\n\n### 13.3.3 面向医疗生态系统的区块链\n\n在医疗行业，区块链的采用已分为多个阶段。在初始阶段，区块链可直接供医疗服务提供商访问；现有的医疗信息技术（IT）系统追踪并存储所有临床数据。区块链网络的应用程序接口（API）利用患者\
  \ ID 传输各种患者数据。智能合约允许在区块链系统中执行入账转移。每笔区块链网络上的交易均使用患者公共 ID（非个人信息）。不可变账本将区块链接在一起。然后，为每笔交易分配一个唯一标识符。因此，医疗服务提供商通过\
  \ API 发起挖矿过程或查询处理。区块数据库中可用的信息仅包括患者的非可识别特征，包括性别、年龄和疾病。通过分析临床数据可发现新见解。最后，患者若希望披露身份，也可选择与其医疗服务提供商共享私钥。这样，提供商即可访问患者数据，进而针对已识别症状提供护理或解决方案。任何没有患者私钥的人都无法访问数据，因此数据保持机密。\n\
  \n### 13.3.4 制药领域的区块链：挑战与机遇\n\n\n\n\n\n#### 医疗保健领域的区块链挑战\n\n区块链是一个多学科概念，这使其更适合应用于多个领域，尽管区块链存在多种局限性和挑战\
  \ [18]。目前正在进行多项研究，以减弱或克服这些因素的影响。在医疗保健领域，区块链技术面临诸多挑战，其中一些如下所述。\n\n##### 13.3.4.1\
  \ 吞吐量\n\n在医疗保健系统中，吞吐量问题发生的概率始终很高，因为数据交易和节点的数量不断增加，这增加了网络管道中的检查负担，最终导致网络瓶颈。吞吐量是嵌入区块链的医疗保健系统中的常见问题，因为网络需要快速访问；如果无法提供，这可能会对本可挽救生命的分析产生不利影响\
  \ [31]。\n\n##### 13.3.4.2 延迟\n\n系统中的延迟可能被证明是有害的，因为验证一个区块可能需要 10 分钟，这可能是对系统发动成功攻击的理想时间窗口\
  \ [45]。任何医疗检查的延迟都可能极大地影响其结果，这迫使医疗保健系统必须定期进行评估。\n\n##### 13.3.4.3 安全性\n\n如果任何对象或实体控制了网络\
  \ 51% 的算力，安全性就会受到威胁 [45]。安全性是医疗保健系统的一个基本方面，它们必须时刻重视，因为安全的丧失将导致信誉的丧失。\n\n##### 13.3.4.4\
  \ 资源消耗\n\n在系统中嵌入区块链所需的巨大能量导致投资者严重的资源损失。该技术的能耗主要源于挖矿过程。对投资者而言，区块链的真正威胁在于需要监控多台设备并保持定期供电。然而，这项技术也可能给现有系统带来沉重负担，并对已在使用的资源构成真正威胁。管理嵌入成本是组织面临的最大问题之一\
  \ [46]。\n\n##### 13.3.4.5 中心化\n\n区块链的架构并非中心化，但某些方法试图使矿工中心化，这降低了网络的可靠性。中心化使网络变得脆弱，因为中心节点可能遭受攻击，其所有信息均可通过网络攻击被窃取。\n\
  \n## 13.4 关键挑战与基于区块链的解决方案\n\n美国拥有全球最突出的医疗保健产业，每年获得约 1.7 万亿美元的业务量，且在当前，美国人均每年在医疗保健上的支出近\
  \ 10,739 美元，为全球最高 [47]。医疗保健部门占美国国内生产总值 (GDP) 的约 18% [47]。根据基于当前形势的预测，到 2027 年，医疗保健部门将占美国\
  \ GDP 的 20% [48]。许多新方法正在开发并应用于医疗保健系统，以提高生活质量并促进医疗基础设施的发展。\n\n由于技术的快速发展带来的诸多挑战和问题，医疗保健领域正在进行各种变革。早期，该部门通常是大型制药组织和训练有素的医疗专业人员的联盟。然而，现在该部门已被意图将技术与现有系统相结合的科技巨头所主导。这些科技巨头可能利用各种策略和方法，通过技术优化利润并最小化投入资源的价值。这些新形成的联盟的目标已发生转移，现在它们更关注消费者的健康。导致现有医疗保健系统失效的因素之一是，系统更关注症状，试图在人生病后治疗，而非预防根本原因。\n\
  \n科技巨头的另一策略是引入可穿戴设备，利用多种传感器定期监测人体温度、心率、步数等多项参数。所有这些传感器收集的数据随后被评估，可用于预测一个人的睡眠习惯、饮食习惯和一系列行为。这些公司开发并使用了许多软件，旨在改善患者生活。该软件监控我们的日常活动，并建议由数字健康研究人员发布的预防性指导\
  \ [48]。\n\n在当前的大流行背景下，苹果和谷歌等公司正试图推出一款全面的基于蓝牙的自愿加入式交互追踪技术 [49]。该蓝牙协议旨在通过共享消费者数据、追踪不同移动轨迹，以及追踪被追踪用户之间的特定交互及其健康数据，来实现全面的接触者追踪\
  \ [49]。\n\n改善医疗保健的技术进步必须反映来自消费者、患者等不同视角的真实需求，并能应对医疗保健领域相比其他领域所面临的独特挑战。投资者正积极寻求利用区块链优化业务。这些探索的解决方案带来了降低初始成本、改善患者结果，并允许更好地利用医疗保健相关数据\
  \ [50]。据 IBM 对 18 个国家的 200 多位生命科学高管进行的一项调查显示，区块链目前正积极嵌入医疗保健系统 [50]。\n\n调查观察到，每十位受访者中有七位以上认为，区块链将帮助他们克服低效的官僚方法和遗留系统，这些方法和系统阻碍了他们实现创新和适应性\
  \ [51]。最大的健康保险公司之一 Anthem 于 2019 年宣布，将使用区块链存储超过 4000 万患者的医疗数据 [52]。\n\n### 13.4.1\
  \ 数据收集与存储\n\n为监测医疗保健而开发的技术（包括数字腕带等可穿戴设备）会产生与个人健康相关的海量数据。所有关键的数据驱动决策都需要使用经过妥善管理并能从源头安全检索的数据来做出。当前的医疗保健结构也通过开展业务和提供服务的标准日常活动产生数据。\n\
  \n通常，一个人一生中会访问多家医疗服务提供者，因此该人的医疗数据分散在许多提供者的系统中。在大量情况下，数据由提供者以其自己的方式保留，且他们经常使数据轨迹碎片化，最终降低了患者访问数据的便利性。从医疗保健领域获得的大数据通常以三种方式分类：大体量、多样性和高速度。这三大基本类别具有非均匀性、众多变量，并要求实时数据分析。获取的数据通常难以访问、不受监管，或分散在各个系统中，难以理解、使用和共享\
  \ [53]。\n\n\n\n\n\n# 数据共享与互操作性\n\n患者的病历仍存储在纸质文档和分散的位置中，这最终导致医疗行业在快速发展的世界中变得极其低效。这些纸质记录不适合同步护理，也无法减少常见的医疗错误\
  \ [47]。如今，医疗数据的收集通过数字方式在各个节点进行。有必要检索收集到的数据，以便在不使流程复杂化的前提下充分利用这些数据。医疗行业面临着一个关键挑战：无法高效且以合理的资源支出存储和共享大数据\
  \ [54]。在跨各种系统操作时，实现数据可移植性和分布式数据兼容性至关重要 [55]。\n\n对于需要关于数据一致性的身份验证和同意的数据，区块链技术是完美的选择。区块链可更好地用于保护具有多个访问点的大数据，且多方可访问。关键且必要的数据通过区块链变得不可攻破\
  \ [56]。医疗行业面临的问题是记录保存和收集持续稳定增长的业务往来，对此区块链是一个坚实的解决方案。\n\n开放消费者交易能发现区块链更大的用武之地，在这些场景中，旧数据的重要性微乎其微，且数据稳步持续增长\
  \ [57]。数据记录包含基因信息和个人医疗史，这些被考虑应用区块链以提供高标准的安全性。医疗机构可实施区块链来存储患者病史的特定信息，并帮助医生通过提供给他们的网络访问这些数据\
  \ [58]。\n\n### 13.4.2 数据共享与互操作性\n\n低效的可交换性引发了两类问题。第一个常见问题是患者识别困难，当医疗机构不允许与另一个网络交换信息时就会出现此问题。其次，信息阻断发生的原因是患者不得不重复进行许多检测和体检\
  \ [59]。只有当患者的统一识别标识符和反信息阻断法律在基础层面被引入时，高效的医疗系统才能成为日常实践。此外，可交换性至关重要，特别是在冠状病毒等流行病期间。这场大流行的突然爆发揭示了医疗系统的现状，并暴露了对强健的数据共享基础设施的迫切需求。\n\
  \n强健的基础设施有助于简化患者与机构之间的沟通，缓解可管理的数据流动，避免公共卫生威胁。拜访一位可能非其家庭医生的医生时，患者必须能轻松访问其病历。此外，优化医疗数据流将允许医生进行远程监测和远程医疗咨询，使患者能让其家庭医生知晓其医疗史\
  \ [60]。在当前，随着冠状病毒感染者数量激增，包含患者体征、症状及风险数据在内的宝贵且透明的数据变得最为重要。\n\n当前医疗系统缺乏可交换性的问题在这次大流行中凸显得更加明显\
  \ [60]。中心化 IT 系统以数字方式保存医疗史，但使共享变得困难。申请、发送、获取和汇总患者医疗信息既耗时、费力，又昂贵。由于监管限制、患者记录碎片化和后端系统不协调，医疗数据管理行业开发解决方案的速度较慢。由于医疗数据存储系统缺乏联盟，数据传输、恢复和调查变得困难。因此，患者与其医疗记录交互的能力受限，因为大多数数据存放在孤岛数据库中\
  \ [54]。\n\n将区块链技术引入医疗领域，可显著提高医疗信息共享效率，并终结行业内缺乏可交换性的问题。哈希标识（ID）可作为使用授权医疗区块链的患者的唯一标识符。ID\
  \ 的哈希值使其具有唯一性，并确保用户的真实性。患者将选择其医疗服务提供者，并向其披露各自的解密密钥。健康生态系统将变得更安全、私密和互操作，并以患者为中心 [61]。精确、当前且包容的医疗记录将使患者和提供者受益匪浅。\n\
  \n### 13.4.3 数据安全与管理\n\n患者健康记录的安全漏洞引发了关于患者数据和隐私的警示性担忧。名为 Beazley 的公司报告称，针对医疗和制药行业的勒索软件网络攻击增加了\
  \ 45% [62]。医疗记录越来越频繁地遭到黑客攻击，医疗数据泄露事件频发。报告发现，2017 年医疗领域报告的数据泄露事件超过 350 起，而 2009 年不足\
  \ 20 起 [63]。卫生与公众服务部（DHHS）数据显示，2018 年因医疗行业数据泄露，共 1300 万份医疗记录被暴露 [64]。2016 年，有超过\
  \ 2700 万份患者记录受健康数据泄露影响，平均每天一起 [65]。Unity Point Health 医院网络于 2018 年遭黑客攻击，导致 140 万患者的敏感医疗信息泄露，黑客从患者记录中窃取了实验室检测结果、治疗方案、社会安全号码及其保险信息\
  \ [66]。\n\n大多数医疗机构的 IT 基础设施老化，往往容易受到勒索软件和其他网络攻击。各类医疗和制药公司将其重要的健康相关数据及信息保存在中心化位置\
  \ [54]。医疗机构海量的数据常使其成为复杂网络攻击的主要目标。如果提供者失去对患者医疗记录和其他基本数据的访问权，可能导致机构损失数百万美元。医疗行业投资于加密数据和利用人工智能等先进安全技术，以在泄露变得严重前加以预防。数据安全和患者隐私担忧日益增加，网络攻击数量上升，IT\
  \ 安全已成为亟待解决的关键问题。\n\n基于区块链的系统可为医疗数据的安全和管理提供多重优势 [66]。它保护私人数据不被滥用，并能遏制威胁。除了使数据不可篡改外，区块链还对其进行加密，使其无法解密。每笔交易由唯一的私有标识密钥发起。交易由仅用户知晓的私有标识密钥授权。因此，与当今的数据访问技术不同，医疗服务提供者只有在直接访问区块链记录时，才被允许访问患者的医疗信息\
  \ [55]。医疗机构可通过改善提供者间的数据协作，提供具有成本效益的护理。\n\n\n\n\nAccurate diagnosis results lead\
  \ to successful treatment of diseases. Patients can use blockchain to share their\
  \ information with their chosen service providers while keeping their information\
  \ safe and reliable. Credentials prove who owns the medical records. They act as\
  \ a security check against forgery 67. A recent study by Business Intelligence and\
  \ Strategy Research (BIS) states that the healthcare industry can save up to $100\
  \ billion per year by 2025 through the implementation of blockchain 68. In addition\
  \ to savings in data breaches, operations, IT, misappropriation fraud, and insurance\
  \ fraud, these savings will improve the overall quality of life. The report indicates\
  \ that approximately $6 billion in revenue could be generated by 2025 68.\n\n##\
  \ 13.5 Healthcare Supply Chain\n\nSupply chain logistics in healthcare involve multiple\
  \ procedures, different teams, and the flow of medicines, surgical kits, and various\
  \ other products used daily by healthcare providers. By exploring vulnerabilities\
  \ in the healthcare industry supply chain, healthcare managers can propose measures\
  \ to reduce these vulnerabilities. By identifying weak links and focusing resources\
  \ on targeted health outcomes, global health investments can be increased. The healthcare\
  \ supply chain offers numerous benefits, such as improved processes, efficient resource\
  \ utilization, staff service, and effective patient treatment. To achieve these\
  \ goals, hospitals should use integrated supply chains to ensure that hospital operations\
  \ and departments are fully connected within the supply chain. An example of a supply\
  \ chain is a backend computer program that helps integrate all the different steps\
  \ in the manufacturing process. Supply chain implementation ensures that medicines\
  \ and products are available at the right time, inventory is minimized, patients\
  \ receive maximum care, and all departments coordinate to minimize human and medication\
  \ errors.\n\n### 13.5.1 Blockchain for Supply Chain\n\nBlockchain technology allows\
  \ pharmaceutical companies to track raw materials, materials, or compounds from\
  \ the source at every transition point to the patient 69. Healthcare and health-related\
  \ supply chains can also leverage blockchain to protect pharmaceutical research\
  \ data and information. Blockchain improves supply chain security by enhancing the\
  \ ability to identify the source and authenticity of medical products 70, 71, 72.\
  \ Furthermore, blockchain allows us to track and detect the full range of difficulties\
  \ associated with pharmaceutical treatments, which have become more prevalent in\
  \ recent decades. Pharmaceutical industry data is shared in a more trusted manner\
  \ through blockchain-based technology. Additionally, [Modum.io](http://Modum.io),\
  \ a Swiss company with sensor and blockchain technology, improves supply chain productivity\
  \ 73. The `MODSense` system ensures accurate readings of recorded temperatures and\
  \ ensures stakeholders receive actual handling information for specific products\
  \ during transport 73. Besides medical supplies, vaccine transport, clinical trials,\
  \ drug samples, and perishable foods, blockchain solutions can benefit a wide range\
  \ of other products.\n\nThe pharmaceutical supply chain claims that the solution\
  \ achieves a higher level of efficiency and safety by identifying product locations\
  \ faster than ever before 74. As an authenticating agent for sharing data and information,\
  \ blockchain has the potential to convince supply chain managers to adopt this technology\
  \ for supply chain management. Blockchain research related to supply chain management\
  \ is still in its infancy; therefore, investigating the possible applications of\
  \ this technology warrants further discussion. Companies must quantitatively demonstrate\
  \ what advantages can be gained before implementing blockchain-enabled supply chains\
  \ in the industry. In this regard, trust in blockchain still relies on trust in\
  \ partner companies. Data sent to the blockchain by companies can still be pre-forged\
  \ or tampered with. For blockchain to provide high performance, accurate or non-forged\
  \ data regarding demand and inventory must be shared among participants in the supply\
  \ chain.\n\n### 13.5.2 Drug Traceability Using Blockchain\n\nTo reduce data breaches\
  \ related to costs, procedures, and IT, traditional solutions for tracking drugs\
  \ in the supply chain are usually centralized and expensive, and reduce the number\
  \ of counterfeit drugs. Due to a lack of transparency among supply chain participants,\
  \ central authorities can modify data without notifying other stakeholders. On the\
  \ other hand, blockchain-based solutions provide data security, transparency, immutability,\
  \ traceability, and transaction record authentication.\n\nBlockchain technology\
  \ facilitates information transactions across a decentralized, immutable ledger\
  \ used to record various business transactions. Although the terms \"transparent\"\
  \ and \"traceable\" are often used interchangeably, they serve different purposes.\
  \ Supply chain transparency refers to the openness of top-level information. A detailed\
  \ supply chain map would include product components, facility locations, and supplier\
  \ names. Traceability, on the other hand, involves selecting specific components\
  \ to track, defining common standards for communication with partners, determining\
  \ appropriate procedures for generating and collecting accurate information, selecting\
  \ a data accumulation platform, and making necessary decisions on data sharing mechanisms.\
  \ Despite the differences between transparency and traceability, the two concepts\
  \ are interrelated because accessing detailed information requires a comprehensive\
  \ study of the supply chain. In this regard, several existing pharmaceutical drug\
  \ tracking and tracing solutions leverage the cryptographic properties of blockchain.\n\
  \nIngraham et al. 75 outlined healthcare problems and described a blockchain-based\
  \ approach, although without providing details or examples. Nageswar et al. 76 discussed\
  \ how blockchain technology can be used for the pharmaceutical supply chain. Dindarian\
  \ et al. 77 designed a traceability system using Ethereum as an anti-counterfeiting\
  \ tool. The proposed solution used smart contracts but lacked implementation or\
  \ evaluation, making its contribution unclear. Stevens et al. 78 developed an integrated,\
  \ secure drug traceability system—Drug Ledger (`DL`)—which simulates real transactions\
  \ managing the supply chain while maintaining the identity and confidentiality of\
  \ stakeholders' traceability information without compromising system security.\n\
  \nUsing the data structure of Unspent Transaction Outputs (`UTXOs`), including packaging,\
  \ repackaging, and unpacking, `DL` completes its workflow. Research indicates that\
  \ the `UTXO` data structure is prone to bugs, has high storage costs, and low state\
  \ space utilization 79. Jamil et al. 80 proposed a solution using Hyperledger technology\
  \ to track drugs in the healthcare supply chain, a more efficient system with slightly\
  \ increased latency but improved throughput and less capital lock-up. However, their\
  \ solution has not undergone systematic testing and has only been applied in a small-scale\
  \ environment.\n\n\n\n超级账本技术未能为可扩展性提供合适的解决方案[81]。McKee 等人[82]对其分析方法也有类似的担忧。随着比特币的发展，私有区块链被开发出来，用于哈希特定数据以保障交易安全。由于每条区块链都维护着自己的永久记录，因此无法操纵与每个产品关联的私钥。该系统的创建旨在防止产品转移过程中的任何错误，并确保整个供应链的完全透明。\n\
  \n制药供应链也是许多正在进行的项目的研究主题，这些项目探索分布式账本的使用以实现可追溯性。Arsene 等人[83]涉及 IBM、Cisco、Intel、Bloomberg\
  \ 和 Blockstream 等公司的全球合作。每种药物都被分配一个时间范围，使其能够追溯到其源头和制造商。Le 等人[84]考察了利用区块链提供符合 DSSA\
  \ 监管框架的解决方案，以增强全球互操作性。\n\n### 13.5.3 基于区块链的制药供应链追踪器\n\n研究发现，利益相关者可以使用一个称为 DApp 的前端软件层，该层通过类似\
  \ `Infura`、`Web3` 和 `JSON RPC` 的 API 连接到区块链和存储系统。利益相关者可以通过智能合约调用预授权函数，并通过去中心化存储系统访问数据文件。作为最后一步，他们将与链上资源交互以获取相关数据，如日志、星际文件系统（`IPFS`）哈希值和交易。以下要点提供了有关系统各组件的更多信息。\n\
  \n*   药房、制造商、分销商以及食品药品监督管理局（`FDA`）等监管机构是利益相关者。在智能合约中，参与者根据其在供应链中的角色被分配特定功能。链上资源（`OR`），如日志信息和历史记录，均可随时访问，以确保供应链交易可被追踪。此外，他们还可以访问\
  \ `IPFS` 信息，包括药品批次图片和说明书。\n\n*   去中心化存储系统利用低成本的链下存储[85]，使供应链交易数据公开可访问、可靠且安全。每个上传的文件都会生成一个存储在公司服务器上的唯一哈希值。然后将这些哈希值存入区块链，当这些上传文件发生变化时，可通过哈希技术经由智能合约检索这些哈希值。\n\
  \n*   通过使用以太坊智能合约（`ESC`）和智能合约部署区块链供应链，参与者可以访问供应链信息并追踪交易的历史渊源。智能合约管理去中心化存储服务器上的哈希值，从而记录交易历史。此外，智能合约定义了每个利益相关者的功能，并通过修饰符授权相关方访问这些功能。修饰符通过添加额外功能或限制来增强或修饰函数。\n\
  \n*   供应链部署通过 `ESC` 处理。它允许参与者检索供应链信息，因为智能合约使他们能够访问交易历史并管理哈希值。此外，智能合约定义了各利益相关者的职责。获授权的参与者可通过修饰符访问这些功能。修饰符用于通过添加更多功能或施加限制来增强组件。智能合约还可以处理交易，如药品批次或箱子的交易。\n\
  \n*   日志和事件由智能合约存储在 `OR` 中，以便进行追踪。注册和文档系统作为 `OR`，将参与者的以太坊地址与一种以去中心化方式存储人类可读文本的方法相关联。\n\
  \n集成系统组件可使用户实时验证药品历史，从而消除实时追踪需求。用户只需检查药品的真实性，并确认药品来自信誉良好的制造商即可。可以实施多种技术来实时追踪药品批次的位置。启用\
  \ `IoT` 的智能集装箱配备了传感器，可从起点到目的地持续监控和追踪集装箱。全球定位系统（`GPS`）接收器用于确定其位置，温度传感器用于监控温度，压力传感器则对集装箱的任何开启或关闭敏感[86]。\n\
  \n## 13.6 结论与未来研究方向\n\n区块链是当今医疗保健领域最具革命性的底层技术之一。数据收集和验证实现了自动化，提供无错误、不可篡改且防篡改的数据，确保网络犯罪尝试减少。数据还可以从多种来源聚合，并以安全的方式查看。此外，区块链具有容错性并支持分布式数据。医疗保健是区块链技术最重要的应用之一，而这是一个相对较新的领域。医疗保健领域已开发出该技术的多种应用，包括共享医疗信息、管理药品供应链和监测患者。利用区块链技术，我们可以实现运营去中心化，并高效、高保真地管理安全。本文进行了深入分析，建议将区块链技术作为保障医疗保健和制药行业数据安全与追溯的具体解决方案之一。论文从区块链嵌入式医疗系统领域的当前进展切入。论文还介绍了医疗保健和制药行业盛行的各种网络攻击。\n\
  \n最后，概述了医疗行业区块链应用的众多未来指导方针。预计这项工作将作为知识库和有序标准，协助未来关于整合区块链、`IoT` 设备和连接技术到医疗系统的研究。医疗保健和制药行业正在迅速采用现代技术，因此需要更多的安全性和可追溯性。本文提供了可用于未来研究工作的各种参数。\n\
