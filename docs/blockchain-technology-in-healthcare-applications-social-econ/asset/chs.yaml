  \n## 1.1 绪论\n\n物联网在通信和数据处理中的引入改变了全球技术的应用 [[1]](#C_006_c1.xhtml#r1_1)。如今更多人沉浸于互联网，而物联网利用这一媒介直接或间接地与用户交互。物与物之间可以互联，这里的“物”指数十亿台独特的设备。据估计，到\
  \ 2025 年，物联网设备将超过 210 亿台 [[2]](#C_006_c1.xhtml#r1_2)。它们就像在观察、交谈和聆听我们。这些设备在小范围内工作，但普适性的实现可以执行众多应用。物联网将这些传统用途的设备转变为智能设备，为大规模计算、大数据处理和现实生活服务奠定了基础。借助物联网的力量，智能家居、智能交通、智能电力系统、工业生态系统等应用均可付诸实践\
  \ [[3]](#C_006_c1.xhtml#r1_3)，[[4]](#C_006_c1.xhtml#r1_4)。通常，物联网设备使用云、边缘、雾计算等不同类型的网络及其\
  \ IP 地址 [[5]](#C_006_c1.xhtml#r1_5)，[[6]](#C_006_c1.xhtml#r1_6)。此外，由于连接设备的大规模异构性，它们采用不同类型的数据处理机制。因此，安全、隐私、数据管理、数据传输等方面的主要问题随之而来。此外，入侵者利用这些安全漏洞获取优势并篡改信息，给整个系统带来隐患。研究人员已开展大量工作以寻找解决此类问题的方案。区块链是这些解决方案中最新且最富成果的通用补充之一\
  \ [[7]](#C_006_c1.xhtml#r1_7)，[[8]](#C_006_c1.xhtml#r1_8)。\n\n区块链概念由来已久，但其在加密货币中的近期实际应用为数据管理和通信创造了巨大机遇。物联网网络的缺陷主要源于中心化处理机制以及设备间缺乏同构计算特性\
  \ [[9]](#C_006_c1.xhtml#r1_9)。这增加了成本，降低了信任度，并损害了数据安全。另一方面，区块链引入了一种去中心化系统，可在无信任环境中确保安全。此外，它还能针对安全威胁提供高效的认证和访问控制策略\
  \ [[10]](#C_006_c1.xhtml#r1_10)。用户匿名性、用于数据验证的稳健共识协议，以及交易过程中公钥加密机制的使用，强烈推动了针对区块链的研究，以解决物联网安全问题\
  \ [[11]](#C_006_c1.xhtml#r1_11)。\n\n考虑到上述事实，物联网安全问题亟待解决。由于数据安全是重中之重，而区块链以提供数据完整性、安全性和透明度著称，它有望成为一种潜在的关键技术。因此，需要一项研究来解决物联网的安全问题，并探索区块链解决这些问题的潜在可行性。\n\
  \n本章阐述了物联网生态系统的关键安全问题及其基于区块链集成系统的解决方案。该领域可延伸至物联网视角，以拓展区块链技术的广泛应用。本文贡献的大纲简述如下：\n\n\
  *   简明扼要地讨论了区块链的概念及其演变。\n*   解释了区块链架构及其最新分类。\n*   评估了使其高效适用于物联网基础设施的区块链特性。\n*  \
  \ 以简单步骤讨论了区块链交易的系统设计。\n*   推测了五层架构在工业物联网（IIoT）中的相关性。\n*   简要描述了构建物联网系统的主要组件。\n*\
  \   详细分析了每一层的关键安全缺陷和网络攻击。\n*   讨论了利用区块链解决物联网安全问题的最新解决方案。\n*   进一步指出了区块链在保障未来物联网环境安全时将面临的挑战，以启发未来研究方向。\n\
  \n本章其余部分结构如下。第 1.2 节概述区块链原理，详述结构、特性和交易流程。第 1.3 节详述物联网基础，解释分层架构和组件。第 1.4 节展示各层的重大安全问题和攻击。第\
  \ 1.5 节阐述缓解特定安全情况的最新基于区块链的解决方案。最后，第 1.6 节重点介绍区块链遵循物联网安全所面临的挑战，激发未来研究，随后是第 1.7 节的结论。\n\
  \n## 1.2 区块链原理\n\n区块链随中本聪于 2008 年提出的比特币应用而首次普及 [[12]](#C_006_c1.xhtml#r1_12)。区块链引入了去中心化账本的理念，实现了更安全的交易。区块链于\
  \ 2009 年至 2013 年用于数字货币交易，被称为区块链 1.0 [[13]](#C_006_c1.xhtml#r1_13)。随后，智能合约的利用于 2015\
  \ 年引入了区块链 2.0，提供了更好的认证和防篡改交易流程 [[14]](#C_006_c1.xhtml#r1_14)。以太坊平台引入 DApps 的理念，开启了区块链\
  \ 3.0 时代 [[15]](#C_006_c1.xhtml#r1_15)。如今，我们处于区块链 4.0 时代，其应用拓展至商业和工业领域 [[16]](#C_006_c1.xhtml#r1_16)。\n\
  \n### 1.2.1 概述\n\n区块链可划分为三个主要部分进行讨论：区块、链和网络。\n\n*   **区块**：区块以加密形式保存交易数据。它使用随机数、默克尔根哈希、时间戳、前一个和当前哈希信息等来加密数据。这些区块不可篡改，分为“区块头”和“区块体”两部分\
  \ [[17]](#C_006_c1.xhtml#r1_17)。区块链的类型决定了其功能和特性，如大小和执行过程。\n*   **链**：区块链类似于链表，区块链接在一起。\n\
  *   **网络**：区块链建立在去中心化网络的概念之上。它确保没有单一参与者或实体能控制区块的交易或验证。它建立 P2P 网络，但包含信息的区块由被称为矿工的对等节点处理和存储\
  \ [[18]](#C_006_c1.xhtml#r1_18)。\n\n\n\n\n通常，区块链可分为两类：公有链和私有链。在公有链中，用户可以加入无许可账本，即他们既拥有读取权限，也拥有写入权限[19]。参与者可以匿名，但安全性由有效的区块挖掘和公钥密码系统保障。尽管区块防篡改，但执行和交易速度比私有链慢[20]。另一方面，私有链限制参与者，仅允许选定的矿工进行读写。这里的去中心化概念略有妥协，但效率极高，同时确保了区块链的所有其他特性[21]。还有一种称为联盟链或混合链的区块链类型。它结合了公有链和私有链的条件，以满足预期结果。\n\
  \n### 1.2.2 特性\n\n除了在加密货币中的应用，区块链因其特性还具有多功能应用，如：\n\n*   **去中心化**：区块链确保没有单一实体或第三方组织能够控制网络。矿工需遵循共识算法挖掘区块，以确保交易经过认证[22]。\n\
  \n*   **不可篡改性**：一旦区块被添加到网络，没有人可以更改其中的信息或将其删除[23]。\n\n*   **匿名性**：即使所有矿工都拥有每个区块的副本，除持有密钥者外，数据也无法被提取[24]。此外，参与交易的个人信息对所有人也是未知的，因为他们每次都会使用生成的地址。\n\
  \n*   **可审计性**：通过哈希函数，每个区块将包含前一个区块的信息[25]。因此，透明度和可审计性将得以维持。\n\n*   **安全性与隐私**：区块链最重要的特性是提供高度的安全性和隐私。公钥密码系统、共识协议、数字签名、点对点网络的使用，以及以太坊等最新技术的加入，使区块链在抵御恶意活动和网络攻击方面更加强健[26]。\n\
  \n### 1.2.3 交易流程\n\n1.  **请求交易**：用户使用私钥加密数据，生成唯一哈希值及数字签名，并请求将其添加到点对点网络[27]。\n\n\
  2.  **认证交易**：使用公钥密码学对交易进行认证，网络验证该请求。\n\n3.  **区块验证**：使用真实的哈希值、随机数、时间戳等，矿工对区块进行验证，并考虑将其追加到网络。\n\
  \n4.  **添加至区块链**：最后，区块被组装进区块链网络，遵循 PoW 或 PoS 等共识协议。此后该区块不可移除、不可更改[28]。\n\n## 1.3\
  \ 物联网基础\n\n物联网不断扩展其关联传感器和设备的领域，使系统比以往任何时候都更复杂。因此，为了高效发挥物联网的效益，提出了不同的物联网架构[29]。考虑到区块链和物联网日益增长的工业用途和应用，我们将讨论日益流行的五层架构方法。五层架构包括：\n\
  \n1.  物体层\n2.  网络层\n3.  服务管理层\n4.  应用层\n5.  业务层\n\n### 1.3.1 物体层\n\n物体层或感知层作为数据收集和处理层工作。它利用物联网传感器和设备收集湿度、位置、温度、振动和重量等信息[30]。随后，数据被传输至网络层以建立通信过程。该层使用安全通道并传输大数据。\n\
  \n### 1.3.2 网络层\n\n网络层或对象抽象层用于将收集的信息从物体层传输到服务管理层。它利用 GSM、RFID、Wi-Fi、WiMAX、3G、4G、卫星、蓝牙和红外等技术传输数据[31]。此外，数据管理和云计算等任务也由该层维护[32]。\n\
  \n### 1.3.3 服务管理层\n\n服务管理层或中间件层的目的是连接不同类型物联网设备之间的服务。设备携带其地址和名称创建请求，中间件层管理服务请求并存储来自下层的信息。该层还参与决策制定，并将计算结果传递给设备[33]。\n\
  \n### 1.3.4 应用层\n\n应用层直接与用户连接。它将来自前几层生成或收集的信息（如温度或湿度）传递给最终客户[34]。该层的例子包括智能家居、智能交通、智能治理和智能识别。\n\
  \n### 1.3.5 业务层\n\n业务层或管理层代表系统的聚合性能或分析。它可以根据接收和传输的数据生成图表、流程图或模型。因此，它提供了架构中所用各层和设备的完整效率。此外，通过比较各层预期输出与实际输出，它还可以提升性能[35]。\n\
  \n其他提出的物联网架构（如三层模型或中间件模型）在某些情况下也很有效。然而，并非所有层都能利用所有类型的技术和数据传输过程。例如，基于 SOA 的架构有一个服务组合层，在数据执行和传输上耗时较多[36]。另一方面，这种五层模型可以生成架构分析，并倾向于提升性能。业务层可以使用大量数据并在强大设备上执行复杂计算。因此，为满足当前对大数据和更快传输的需求，五层模型是首选架构之一。\n\
  \n### 1.3.6 物联网组件\n\n通常，物联网系统由五个主要组件构成[37]：\n\n1.  **传感器**：物联网系统使用许多传感器来识别、收集和传输数据。根据数据的多样性，存在不同类型的传感器。\n\
  \n2.  **计算**：包含处理器的节点用于处理传感器收集的信息。这些节点用于执行特定计算，以进一步保护和传输接收到的数据。\n\n3.  **接收器**：它像收发器一样工作，将消息从一个节点传输到另一个节点。它通常连接本地和远程节点，并收集其计算数据。\n\
  \n4.  **激活器**：根据从前序组件接收和计算的数据，为请求的服务生成信号。物联网设备的功能被激活以触发目标设备。\n\n5.  **设备**：触发功能后，连接到物联网系统的设备执行期望的功能。\n\
  \n## 1.4 物联网安全问题\n\n\n\n\n# 物联网系统安全问题\n\n物联网系统及其各类通信设备存在若干安全问题。研究人员正致力于寻找安全风险的解决方案，并提出多种架构以应对这些问题。然而，目前仍无单一架构可被视为适用于所有情境。五层架构被提出作为这些安全问题的通用解决方案，但仍有部分问题未得到解决\
  \ [38]。此处，我们将详细探讨物联网五层模型的安全问题。\n\n### 1.4.1 对象层（感知层）安全问题\n\n对象层或感知层面临的问题主要集中在其传感器和数据收集过程中。该层的关键安全问题如下：\n\
  \n*   **节点劫持**：节点劫持或捕获攻击是针对感知层的一种危险攻击。它发生在 `WSN`（无线传感器网络）中 [39]。入侵者可以替换系统中的一个无线传感器，取代另一个传感器的位置。因此，本应收集或传输的信息会流向另一个源头。它甚至可以篡改信息，导致整体计算错误。此外，接管整个系统的一个节点后，入侵者可以泄露数据，使系统安全性更加脆弱。攻击者还可能尝试从发送方和接收方推断密钥，随后利用这些密钥提取其通信的信息和内存数据\
  \ [40]。\n\n*   **窃听**：在此攻击中，入侵者在不留痕迹的情况下监听或查看发送方与接收方之间交换的信息 [41]。攻击者试图获取图片、消息和语音通话等信息。尽管攻击者无法更改网络中传输的任何信息，但他们可以收集并记录仅在选定参与者间共享的秘密数据。\n\
  \n*   **重放攻击**：最常见的攻击之一是扮演“伪造发送方”的角色，即重放攻击。在此攻击中，入侵者秘密进入通信通道，随后收集发送方的消息。攻击者不修改消息，而是创建一条与发送方消息相似、具有相似认证和身份的新消息\
  \ [42]。这在接收方看来是有效的，但一旦接收方接收了来自攻击者的加密消息，受害者的所有信息就会流向攻击者 [43]。\n\n*   **时序攻击**：物联网系统中的所有传感器以不同的计算时间收集和处理数据。这种计算时间的差异源于所处理数据的大小以及加密算法的使用。此外，入侵者可以观察各类传感器针对特定请求或查询的执行时间。攻击者可利用交换消息或签名的这种时间差来攻破密码系统\
  \ [44]。\n\n*   **恶意与伪造节点**：攻击者还可以在系统中添加一个仅由其控制的传感器作为节点。利用这个伪造节点，攻击者可向系统注入恶意数据或文件\
  \ [45]。它的工作方式与其他所有节点完全相同，但会将发送方和接收方的秘密信息传输给攻击者。它还拥有破坏整个系统的能力，并消耗大量能量 [46]。\n\n###\
  \ 1.4.2 网络层安全问题\n\n连接感知层与应用层的层级是网络层。它指代设备、传感器或智能事物之间的通信通道。因此，入侵者特别倾向于攻击这一层。使其脆弱的安全问题如下：\n\
  \n*   **中间人攻击**：在此攻击中，入侵者位于通信通道中两端之间的中间位置 [47]。攻击者使用不同类型的欺诈性传感器或设备以保持隐匿。他可以实时篡改消息，而实际的发送方和接收方无法确认他们正在与谁通信\
  \ [48]。\n\n*   **漏洞利用攻击**：攻击者利用物联网设备所用软件或硬件的安全漏洞，拦截恶意数据或命令，并从网络中提取关键数据。此外，攻击者还可利用设备的\
  \ `IP` 地址获取访问权限，并将受污染的数据植入系统 [49]。\n\n*   **拒绝服务攻击**：此攻击使特定节点或设备无法提供服务，制造海量流量或消息，导致网络变慢、不可用，甚至使系统崩溃\
  \ [50]。\n\n*   **女巫攻击**：利用一台设备复制多台具有真实地址的设备，侵犯网络信息。具有虚假身份的复制设备（女巫设备）若被置于汇聚所有流量的单一路由上，还可能引发其他安全威胁，如\
  \ `DoS` 攻击、网络钓鱼 [51]。\n\n*   **黑洞与蜗牛攻击**：此攻击生成虚假流量和路由数据发送给其他设备，导致 `WSN` 生成的数据包无法到达目的地，而是被丢弃在伪造路由中。若结合两个通过私有链路连接的欺诈设备，攻击效果可进一步增强，该链路仅对攻击者有用。其他设备随后将此链路（蜗牛隧道）作为其路由路径，攻击者便可从中提取信息\
  \ [52]。\n\n### 1.4.3 中间件层（处理层）安全问题\n\n中间件或处理层对数据进行过滤，以分离特定设备所需的关键数据。它剔除某些操作不必要的额外信息。该层面临的一些关键攻击如下：\n\
  \n*   **病毒攻击**：攻击者利用内容、文件或可执行代码进入系统 [53]。此类攻击包括病毒、特洛伊木马、间谍软件、恶意软件、广告软件等，旨在获取用户信息。\n\
  \n*   **耗尽攻击**：耗尽攻击可在物理上损害设备和网络。它可能由其他类型攻击引发。例如，`DoS` 攻击可产生大量流量，最终导致设备耗尽内存、数据库资源或电力系统\
  \ [54]。\n\n### 1.4.4 应用层安全问题\n\n应用层是整个架构的输出层级，用户由此接收最终服务。根据其服务和实现差异，会出现不同的安全问题。应用层的一些重大安全问题如下：\n\
  \n*   **数据破坏**：攻击者可向基站发送虚假信息，导致计算错误。此外，他还可利用物联网设备间服务管理的漏洞泄露数据 [55]。\n\n*   **网络钓鱼攻击**：攻击者可使用钓鱼链接、网站或携带恶意文件的电子邮件，诱使用户点击\
  \ [56]。用户的密码、出生日期、身份证号等私人信息极易被窃取，攻击者可借此获取受害者的凭证。\n\n*   **恶意脚本与特洛伊木马**：物联网应用极易遭受病毒或特洛伊木马攻击。入侵者注入恶意软件，可生成副本并逐步破坏受害者的环境。仅靠杀毒软件很难防范此类恶意代码攻击。恶意脚本还可更改设备中已安装软件的基本命令\
  \ [57]。在系统一定部分受到 `HTML` 注入、脚本注入和蠕虫影响后，攻击者可扩大攻击范围。这也为网络钓鱼、`DoS` 和缓冲区溢出等其他攻击创造了条件。\n\
  \n\n\n\n\n#### 软件和固件的不确定性\n\n随着物联网设备不同应用的出现，运行它们的软件和固件类型也各不相同 [58]。但由于缺乏标准化和适当的审查，要创建安全代码变得困难。此外，未能定期向设备提供安全更新会增加漏洞。攻击者还可以通过操纵时钟时间，破坏物联网设备与其他设备的同步过程。最终，入侵者更容易利用后端代码并更改预分配内存的代码\
  \ [59]。\n\n#### XMPPilot 攻击\n\n为了窃听发送方和接收方之间的通信信道，攻击者使用 XMPPilot。他编写代码以破坏 XMPP 连接，并将加密过程限制在接收方一侧的通信中\
  \ [60]。\n\n#### 可信度问题\n\n缺乏认证标准或授权方来维护安全，使入侵者更容易发动攻击 [61]。他们可以利用更新文件注入自己篡改的脚本。同样，有必要对通信中的端到端加密进行认证。\n\
  \n### 1.4.5 业务层的安全问题\n\n业务层是物联网结构中最新增添的一层，使系统更具生产力且更易于使用。目前尚未发现针对该层的许多威胁，但攻击者可以利用前几层的攻击手段。该层可能存在的安全问题如下：\n\
  \n#### 零日攻击\n\n零日攻击是指针对软件或应用程序的特定安全弱点发起的攻击，该弱点已被开发者发现但尚未缓解。它可能在开发者发现弱点的当天就发生。通常，这种攻击会在供应商完全不知情的情况下利用安全漏洞\
  \ [62]。\n\n#### 逻辑攻击\n\n业务层使用大量逻辑来计算数据并生成必要的图表或决策。编程时的逻辑错误会在计算这些结果时引发特定威胁 [63]。同样，密码恢复或认证、加密、输入验证等算法的缺陷也会给业务层带来一些安全威胁。\n\
  \n还有其他方法可以发现物联网的安全漏洞并对可能的威胁进行分类。但五层架构几乎涵盖了所有物联网生态系统中常见的关键攻击。\n\n## 1.5 基于区块链的解决方案\n\
  \n区块链可以为物联网的不同领域提供改进的解决方案。物联网设备需要处理大量私有数据。许可型区块链可以成为避免暴露用户数据的绝佳解决方案 [64]。消除中央机构的直接通信可以应对指数级增长的物联网设备带来的不断增加的流量。它还可以减轻云服务器存储数据的负载。通过强化基础设施，区块链可以进一步有助于防止数据篡改和众多网络攻击。\n\
  \n近年来，已采取多种方法来解决物联网的问题。研究人员提出了不同的架构和系统设计。表 1.1 列出了一些旨在解决安全以及物联网架构和数据管理问题的区块链解决方案的最新研究成果。\n\
  \n**表 1.1** 基于区块链的最新物联网安全解决方案\n\n| 攻击名称 | 影响 | 区块链解决方案 | 参考文献 |\n| --- | --- | ---\
  \ | --- |\n| 窃听攻击 | 传输数据失去隐私 | * 将区块链分为两部分：链下和链上，分三步处理数据。 | [65] |\n| 时序攻击 | 易受侧信道攻击，暴露密码系统\
  \ | * 将区块链与国产商用密码算法相结合。<br>* 在区块链框架中应用概率模型进行数据收集。 | [66, 67] |\n| 节点劫持 | 破坏数据收集或将数据传输给攻击者\
  \ | * 提出许可型区块链的签名方案。<br>* 在无人机网络中引入基于区块链的框架。 | [68, 69] |\n| 重放攻击 | 破坏私有数据安全 | *\
  \ 带有特殊监控传感器的基于区块链的物流系统。<br>* 区块链方案中的双向认证。<br>* 批量系统的 BSS（区块链赋能安全系统）方案。 | [70, 71,\
  \ 72] |\n| 恶意和伪造节点 | 消耗能量 | * 区块链网络中基于 RSA（Rivest–Shamir–Adleman）签名的认证。<br>* 使用轻量级区块链管理身份认证。<br>*\
