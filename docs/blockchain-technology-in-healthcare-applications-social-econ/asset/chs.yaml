  \ | [78, 79] |\n| 利用攻击 | 污染网络/IP 地址 | * 基于 DPoA（授权委托证明）的混合区块链。 | [80] |\n| 中间人攻击\
  \ | 网络安全、密钥管理 | * 用于密钥生成和管理的基于种子的区块链方案。<br>* 面向 CAV（网联自动驾驶汽车）的基于区块链的架构。 | [81, 82]\
  \ |\n| DoS/DDoS | 网络不可用、系统崩溃 | * 面向 IIoT 的混合区块链。<br>* 使用以太坊平台的私有区块链。<br>* 使用智能合约和\
