  \n## 11.1 简介\n\n近年来，物联网的出现对科学技术产生了重大影响 [[1]](#C_016_c11.xhtml#r11_1)。物联网被定义为一个由可识别且唯一的元素组成的网络，这些元素利用\
  \ IP 连接在无需人工干预的情况下进行通信 [[1]](#C_016_c11.xhtml#r11_1)。这些项目能够独立或与其他对象协作地进行感知、控制、分析和决策\
  \ [[2]](#C_016_c11.xhtml#r11_2)。根据 IoT Analytics 的估计，到 2019 年底，联网物联网设备约有 95 亿台 [[3]](#C_016_c11.xhtml#r11_3)。物联网的概念正呈指数级演变，并日益覆盖更多领域\
  \ [[4]](#C_016_c11.xhtml#r11_4)。它将通过使生活的各个方面智能化，改变我们的生活和工作方式。通过在智能家居、智慧医疗、智慧城市、工业\
  \ 4.0、无线传感器网络 (WSN)、智慧农业等领域开发新应用，物联网有潜力引入并建立一个智能世界 [[5]](#C_016_c11.xhtml#r11_5)。有兴趣的读者可参考\
  \ [[1]](#C_016_c11.xhtml#r11_1)、[[2]](#C_016_c11.xhtml#r11_2)、[[3]](#C_016_c11.xhtml#r11_3)、[[4]](#C_016_c11.xhtml#r11_4)、[[5]](#C_016_c11.xhtml#r11_5)、[[6]](#C_016_c11.xhtml#r11_6)、[[7]](#C_016_c11.xhtml#r11_7)、[[8]](#C_016_c11.xhtml#r11_8)、[[9]](#C_016_c11.xhtml#r11_9)、[[10]](#C_016_c11.xhtml#r11_10)、[[11]](#C_016_c11.xhtml#r11_11)、[[12]](#C_016_c11.xhtml#r11_12)、[[13]](#C_016_c11.xhtml#r11_13)、[[14]](#C_016_c11.xhtml#r11_14)、[[15]](#C_016_c11.xhtml#r11_15)、[[16]](#C_016_c11.xhtml#r11_16)、[[17]](#C_016_c11.xhtml#r11_17)、[[18]](#C_016_c11.xhtml#r11_18)、[[19]](#C_016_c11.xhtml#r11_19)、[[20]](#C_016_c11.xhtml#r11_20)\
  \ 以深入了解物联网。\n\n医疗保健 4.0 是物联网与现代信息通信技术的结合 [[6]](#C_016_c11.xhtml#r11_6)。智慧医疗通过将传感器和执行器集成到患者体内以进行监测和随访，在健康应用中发挥着重要作用。全球物联网医疗设备市场预计将以\
  \ 4.5% 的复合年增长率增长，到 2025 年达到 4095 亿美元 [[7]](#C_016_c11.xhtml#r11_7)。物联网用于医疗保健以监测患者的生理状态。植入式/穿戴式传感器可直接从患者体内采集信息并将其传输给医生。这些采集的信息可被存储、处理，并提供给医生，使其能够随时随地通过任何连接互联网的设备（如智能手机或平板电脑）进行会诊\
  \ [[8]](#C_016_c11.xhtml#r11_8)、[[9]](#C_016_c11.xhtml#r11_9)、[[10]](#C_016_c11.xhtml#r11_10)、[[11]](#C_016_c11.xhtml#r11_11)、[[12]](#C_016_c11.xhtml#r11_12)、[[13]](#C_016_c11.xhtml#r11_13)、[[14]](#C_016_c11.xhtml#r11_14)、[[15]](#C_016_c11.xhtml#r11_15)。此外，医生可实时收到患者病情任何突然变化的警报，并采取建议患者、查询传感器以获取当前数值等行动。这项技术可在让患者与医生保持沟通的同时，使其完全脱离医院的中心化系统。采用物联网的远程医疗监控系统如图\
  \ 11.1 所示。\n\n![图 11.1 基于物联网的医疗监控架构。](img/Fig11_01.jpg)\n\n**图 11.1** 基于物联网的医疗监控架构。\n\
  \n\n\n\n\n### 物联网医疗应用中的安全挑战\n\n物联网部署了大量小型智能设备来收集关于环境的详细信息 [10]。尽管实现了微型化并降低了制造成本，但这些设备在功率传输、数据处理、带宽、存储容量和能源方面通常资源有限。然而，传输和接收操作消耗了节点设备的大部分能量\
  \ [11]。毫不奇怪，在评估传感器网络性能时，服务寿命可能是最重要的指标，特别是因为大多数低功耗设备的寿命有限；此外，为成千上万部署在难以到达区域的这些设备持续更换电池通常是不切实际甚至不可能的\
  \ [12]。因此，能量消耗是传感器面临的一个关键挑战。为此，提出了多种方法来节约感知层面的能源资源，并克服其局限性固有的挑战 [13]。\n\n已经探讨了与物联网相关的许多其他问题，其中最重要的问题之一是安全问题\
  \ [14]。一个拥有大量互联设备的巨大网络的存在几乎肯定会暗示各种攻击和窃听场景，这可能会危及这些实体及其用户 [15]。这些联网“事物”构成的威胁不仅影响物联网系统，还影响整个生态系统，包括网站、应用程序、社交网络和服务器。在使用物联网的医疗应用中，随着我们在衣物和身体上添加更多设备，将收集更多个人信息。随着物联网设备数量呈指数级增长，技术和安全挑战也随之增加\
  \ [16]。例如，攻击可能会合理地修改药物剂量，从而导致某位患者死亡或产生灾难性的健康后果。此外，医疗设备可以通过多种通信媒介（如 Wi-Fi、Zigbee、蓝牙、6LowPAN\
  \ 和 NFC）被远程利用。在这种情况下，攻击者可以轻松窃听通信信道并获取传输的数据 [17]。开发新的安全框架以防止敌对或未授权对象访问物联网系统、读取或篡改收集的数据至关重要\
  \ [18]。\n\n本章旨在回顾关于基于物联网的医疗应用中安全和隐私挑战及方法的当前文献。为了揭示物联网危险的根源，我们介绍并分类了物联网安全威胁类别以及防御技术，以便为读者提供必要的安全背景知识，从而更好地理解这一领域。我们呈现了物联网攻击的分类法，以及对物联网各层级安全关注点的分析。我们还根据攻击目标给出了安全需求分类法。然后，我们介绍了提高物联网安全性的解决方案。本文其余部分组织如下：我们在第\
  \ 11.2 节 [Section 11.2] 中给出了针对医疗系统的当前安全和隐私攻击的完整分类法。医疗系统的安全需求分类法在下一节中提供。在第 11.4 节\
  \ [Section 11.4] 中，我们将探讨研究人员提供的一些保护医疗系统的现有方法。最后，我们在第 11.5 节 [Section 11.5] 中总结本文。\n\
  \n## 11.2 基于物联网的医疗应用中的安全攻击\n\n如前所述，当前的医疗设备和应用不符合安全和隐私标准。攻击者可以利用医疗系统的许多组件来执行不需要的操作\
  \ [19]。为了将安全需求仔细纳入物联网系统，首先需要调查物联网的漏洞和攻击。攻击是一种破解加密方案的尝试，成功的攻击意味着该方案下加密数据的安全性已被破坏\
  \ [20]。在本节中，我们将讨论针对医疗系统不同部分（如传感器、设备和网络）的多种攻击类型，以及攻击者如何破坏目标医疗系统的安全性和隐私。详细总结见表 11.1\
  \ [Table 11.1]。\n\n**表 11.1** 基于物联网的医疗安全攻击\n\n| 攻击 | 描述 | 安全目标 | 目标层 | 攻击类型 |\n\
