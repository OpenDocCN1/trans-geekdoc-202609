  \nP.R. Mahalingam and K.A. Fasila\n\nMuthoot Institute of Technology and Science\n\
  \nDOI: [10.1201/9781003224075-2](http://doi.org/10.1201/9781003224075-2)\n\n## 2.1\
  \ 引言：工业物联网\n\n工业物联网（IIoT）是当今自动化时代的一个蓬勃发展的领域。IIoT 是指将物联网（IoT）应用于工业以提高运营效率。信息技术（IT）和运营技术（OT）在\
  \ IIoT 中融合，使工业能够提升其性能 [[1]](#C_007_c2.xhtml#r2_1)[[2]](#C_007_c2.xhtml#r2_2)。IT\
  \ 和 OT 的融合有助于组织整合自动化、优化、数据分析等。由智能传感器和执行器组成的物联网生态系统将使机器和其他基础设施的监控与控制变得更加容易。IIoT 的抽象视图如\
  \ 图 2.1 所示。\n\n![FIGURE 2.1 IIoT architecture. (Courtesy: The Future of Industrial\
  \ Automation by Paul McLaughlin and Rohan McAdam.)](img/Fig02_01.jpg)\n\n**图 2.1**\
  \ IIoT 架构。（来源：Paul McLaughlin 和 Rohan McAdam 合著的《工业自动化的未来》）\n\n\n\n\n\n### 架构概述\n\
  \n图 2.1 所示的架构采用了模型的分层视图。底层构成“边缘”，由传感器和网关等有形组件组成。边缘层连接到“网络”层，后者在计算基础设施和网关之间架起桥梁。最顶层构成“云”部分，包含云端的处理单元，以及仪表盘和分析等各类应用。\n\
  \n### IIoT 安全挑战\n\nIIoT 构成了一个自主环境，因此必须严肃对待安全特性。随着 IIoT 应用使用量的巨大增长，网络安全威胁也随之增加。在像\
  \ IIoT 这样的自主互联环境中，可能出现多种漏洞，此类攻击将损害系统的可靠性。在考虑 IIoT 生态系统的安全挑战时存在若干问题。一个主要问题是缺乏风险缓解。这意味着\
  \ OT 部分的操作员可能不深刻理解由 IT 专家处理的原则。因此，尽管存在多种缓解技术，但只有少数被有效利用。其他问题包括缺乏适当的安全更新、攻击影响、缺乏终端组件可见性等。\n\
  \n另一个主要问题是所涉及系统组件的脆弱性。由于工业设备最初设计用于封闭环境，当时未考虑安全问题。与 IIoT 设备相关的安全风险包括设备管理、补丁管理、使用相同的认证凭据以及返回错误数据。IIoT\
  \ 依赖大量传感器、处理元件和执行器来自动化数据收集、处理和响应。IoT 生态系统的可靠性取决于实施的几个阶段，如设备可靠性、通信可靠性、网络可靠性和应用可靠性\
  \ [[3]](#C_007_c2.xhtml#r2_3)。\n\nIoT 系统的设备层包含电磁设备，称为传感器和执行器。一旦这些资源受限的传感器设备大规模部署在各个位置，就难以监控并确保它们准确传送数据。数据收集阶段面临的主要挑战之一是机电设备提供的准确性。传感器性能可能因设备故障、环境因素和缺乏固件更新等原因而下降。本文提出了一种基于区块链的算法，以提高\
  \ IIoT 应用数据收集阶段的传感器可靠性。该范围最初在 [[4]](#C_007_c2.xhtml#r2_4) 中探讨。\n\n### 本章结构\n\n本章其余部分安排如下：\n\
  \n- 第 2.2 节 论述如何在工业规模上部署 IoT 以获得 IIoT。\n- 第 2.3 节 涉及区块链的一般概念，并介绍权益证明（`PoS`）算法。\n\
  - 第 2.4 节 描述如何结合 IIoT 和区块链，重点关注 `PoS`。\n- 第 2.5 节 基于权益概念提出一种算法，确保传感器的可靠性。\n- 第 2.6\
  \ 节 讨论该算法的仿真并评估其性能。\n- 第 2.7 节 给出总结性评论。\n\n在本章其余部分中，术语“设备”、“节点”和“传感器”将交替使用。尽管它们在现实世界中有所不同，但当前重点在于算法，底层硬件可抽象为上述任一术语。\n\
  \n## 2.2 IIoT —— 用例\n\nIIoT 也称为工业 4.0，具有多种应用。零售、医疗、制造、教育、油气、交通和能源等各工业部门均从使用 IIoT\
  \ 中获益。智慧城市和农业等其他用例也受益于 IIoT。使用 IIoT 的主要益处包括改善设备连接性、M2M 通信、提高效率、增加利润、工业安全等。除了这些要点，开发新服务、商业模式和创新也在各行业的目标集中。表\
  \ 2.1 总结了一些基于 IIoT 运作并从中获益的主要工业组织。作为最重要的用例，IIoT 用于自动化，通常使用无线传感器网络实现 [[5]](#C_007_c2.xhtml#r2_5)。\n\
  \n**表 2.1** 行业用例\n\n| 组织 | 区域/主要益处 |\n| --- | --- |\n| ABB | 对智能机器人使用预测性维护 |\n|\
  \ Boeing | 提高制造效率 |\n| Bosch | 使用 IoT 方法追踪工具，帮助工人节省大量时间 |\n| Caterpillar | 重型设备制造商，利用\
  \ IoT 和增强现实（`AR`）应用向机器操作员提供一目了然的全景视图 |\n| Stanley Black & Decker | 智能工厂、建筑 IoT |\n\
  \n表 2.1 中的示例展示了 IIoT 实施的多样性。随着工业 4.0 及其后续发展的到来，IoT 的前景处于历史最高水平 [[6]](#C_007_c2.xhtml#r2_6)。Senathipathi\
  \ 等人 [[7]](#C_007_c2.xhtml#r2_7) 描述了结合区块链的 IIoT 前景应用。\n\n## 2.3 区块链与权益证明算法\n\n区块链被设想为一种分布式账本，可取代现有的中心化记录模型。它作为比特币（首个被接受的加密货币）运行平台被引入。区块链通常基于分布式共识概念工作，确保仅在大多数参与者认可真实性时才添加账本条目。这是验证者的职责。交易存储在条目链上，每个条目保存链中前一条目的哈希值。这使区块链天生具有不可篡改性，因为交易后对区块链的任何更改都会导致哈希值改变，从而使此后所有条目失效。文献\
  \ [[8]](#C_007_c2.xhtml#r2_8) 描述的区块链基本组成部分和方面如下：\n\n- **交易**：交易是区块链的基本单元。执行交易需要源地址、源数字签名、交易信息和目标地址。\n\
  - **矿工**：矿工是区块链网络中的共识参与者，确保所有交易得到验证。每笔交易经验证后与其他交易打包进一个区块。若成功，则广播给所有其他节点进行验证，并标记为最新区块。\n\
  - **哈希指针**：由哈希函数创建，将区块内容映射到哈希指针。通常通过获取前一区块的哈希值并将其作为条目添加到当前区块来创建。这通过确保前一数据的任何变更将导致下一区块出现不同的哈希值，并可追溯至创世区块（即链的第一个区块），使任何篡改显而易见。\n\
  - 根据不同共识机制的要求，区块还可包含额外数据。为减少存储空间，区块中的交易可按默克尔树形式存储。\n\n\n\n\n这些概念使区块链具有去中心化、透明、不可篡改、安全和私密的特性。之所以说它是去中心化的，是因为矿工独立工作，仅广播每个过程的成功结果。由于交易携带所有必要的标识符，因此对所有参与者都是透明的。哈希指针使得无法修改链的任何特定部分，因为哈希是单向的，而像\
  \ `SHA-256` 和 `SHA-512` 这样的密码学级哈希几乎零碰撞。密码学安全性和隐私性可以轻松地在现有链的基础上融合。\n\n随后，通过启用轻量级算法在链上运行，利用智能合约等概念，基础概念得到了扩展。如今存在该概念的不同实现风格，其中最流行的是\
  \ `Hyperledger`（使用原始概念）和 `Ethereum`（使用智能合约）。\n\n与分布式环境中的任何其他多智能体系统一样，区块链也必须确保整体系统可靠性。因此，所有协调过程必须达成一致，这被称为共识。它是分布式节点之间用于达成共同状态的容错机制。该机制确保节点间的同步以及对添加到区块链的交易达成一致。区块链中常用的共识机制有\
  \ `Proof of Work (PoW)` 和 `PoS` [8]。`PoW` 要求验证者拥有足够的计算能力来验证交易。在 `PoS` 中，验证者根据其持有量或权益进行选择。`PoS`\
  \ 要求验证者拥有最低数量的权益。因此，恶意节点要想成为验证节点，必须分别在 `PoW` 和 `PoS` 中获取足够的计算能力或权益。在这两种机制中，`PoS`\
  \ 更节能。此外，[8] 指出 `PoS` 的能耗可忽略不计，这非常适合 `IIoT` 等低功耗设备。此外，无需额外硬件，且处理速度快。\n\n## 2.4 将权益证明模型集成到\
  \ IIoT 中\n\n许多研究人员已经探索了将区块链平台与 `IoT` 相结合的概念 [9, 10, 11, 12, 13, 14]。Miller [15]\
  \ 探讨了将其改编应用于 `IIoT` 的可能性。但现有研究的共同点在于，它们试图将区块链平台直接适配到 `IoT` 实现上，从而实现去中心化处理。但这些实现会带来更强大边缘节点的开销，这些节点拥有存储和计算能力。此外，安全性和可扩展性在现有研究中至关重要。\n\
  \n在本章中，重点不再是利用区块链实现 `IoT` 的安全性和可扩展性。应用领域转移到了如何利用区块链概念确保传感器的可靠性。Fortino 等人 [16] 提出了一种基于区块链的信誉模型，以确保\
  \ `IIoT` 中的可靠性。Kang 等人 [17] 提出了一种基于激励的模型，用于正确的共识传播，Yang 等人 [18] 提出在 `PoS` 中增加降级机制，以更容易地隔离恶意节点。这些概念可以很容易地改编来实现一种算法，该算法消除了对区块链的需求，但保留了隔离恶意节点的能力。在没有存储链的限制下，所有处理都必须实时进行，且可以是集中式或去中心化的。\n\
  \n`PoS` 模型的两个方面可以直接集成以管理 `IIoT` 中的可靠性：\n\n1.  贡献者和验证者的选择，\n2.  权益和费用的转移。\n\n这种集成背后的基本原则在于如何有效惩罚错误的传感器，同时将它们保留在生态系统内。其目的还在于允许传感器（或节点）在重新开始提供正确观测值时恢复到显著状态。这将为监控拜占庭故障提供有效机制，同时适应故障设备更换等因素。\n\
  \nBhushan 等人 [19] 描述了区块链使其在当今技术领域广泛应用的不同方面。Bhushan 等人 [20] 通过分析优缺点，进一步探讨了集成区块链和\
  \ `IoT` 的可能性，并观察到能源效率和延迟是关注点。尽管隐私和安全性同样重要，但由于假设为无菌环境，我们的研究未考虑这些方面。安全性方面由 Uddin 等人\
  \ [21] 和 Krishna 等人 [22] 深入探讨。\n\n## 2.5 提出的算法\n\n基于 `PoS` 的 `IIoT` 可靠性基本算法如下。这在每个采样间隔内为传感器执行。\n\
  \n*   **算法：** `pow_iiot_reliability`\n*   **输入：** `stakes`、`observations`\n*   **输出：**\
  \ `accepted observation`、`failure status`、`revised stakes`\n\n1.  接受来自传感器的最新一组观测值。\n\
  2.  选择权益大于 `min_stake` 的传感器。它们构成贡献集（`c_set`）。其余构成验证者集（`v_set`）。\n3.  计算 `c_set`\
  \ 中传感器给出的观测值的平均值。\n4.  计算每个 `c_set` 观测值与平均值的偏差。\n5.  如果最小偏差高于 `min_deviation`，则报告系统失效，并终止。否则继续。\n\
  6.  接受与平均值偏差最小的观测值。\n7.  将观测值偏差不大于 `min_deviation` 的 `c_set` 中的传感器组成 `allow_contrib`\
  \ 集。其他贡献者组成 `deny_contrib` 集。\n8.  从 `deny_contrib` 集中的每个元素中取出 `k%` 的权益，其中 `k` 称为“惩罚分数”。将所有这些权益加入\
  \ `stake_pool`。\n9.  将 `stake_pool` 均匀分配给 `allow_contrib` 的所有成员。\n10. 在 `v_set`\
  \ 中，选择偏差不大于 `min_deviation` 的观测值并将它们加入 `fee_set`。\n11. 从 `c_set` 中的每个元素取出 `n%` 的权益，其中\
  \ `n` 称为“费率”。将所有这些权益加入 `fee_pool`。\n12. 将 `fee_pool` 均匀分配给 `fee_set` 的所有成员。\n\n\
  该过程可以用更简单的术语来解释。工作可以从多个细节层面来考虑。高层设计见 图 2.2。\n\n![图 2.2 基于 PoW 的可靠性模型高层设计。](img/Fig02_02.jpg)\n\
  \n**图 2.2** 基于 PoW 的可靠性模型高层设计。\n\n此时可以添加第一层细节，内部模块及其交互如 图 2.3 所示。这将过程分解为五个步骤——贡献者/验证者选择、平均、偏差测试、费用资格测量和权益重新分配。\n\
  \n![图 2.3 基于 PoW 的可靠性模型中存在的模块。](img/Fig02_03.jpg)\n\n**图 2.3** 基于 PoW 的可靠性模型中存在的模块。\n\
  \n\n\n\n### 贡献者/验证者选择与权益转移机制\n\n每当所有传感器传来新的读数时，算法会检查所有传感器是否都剩余最低数量的权益。拥有最低可用权益的节点将被命名为“贡献者”，而其他节点则保持为“验证者”。原则上，这种区分不会改变任何节点的行为。只有在读数被接受时才会产生差异。这种划分受权益证明（PoS）概念的启发，即只有当节点拥有足够的权益时，才能执行以太坊交易。这由图\
  \ 2.4 中的流程图描述。\n\n![图 2.4 贡献者/验证者选择模块。](img/Fig02_04.jpg)\n\n**图 2.4** 贡献者/验证者选择模块。\n\
  \n一旦选出贡献者，将对其读数求平均以估算原始值可能是什么。此操作还有一个额外优势，即利用该指标易于识别不一致性。如果读数分布方差很高，意味着传感器捕获了相当多的噪声（同一生态系统极不可能包含差异巨大的读数）。考虑到这一点，每个读数都会与平均值进行交叉核对以计算偏差。偏差超过设定阈值的读数将被排除在外，假设它们是错误的。最接近平均值的读数将被采纳为接受值。\n\
  \n在取平均值时，可能存在实际值位于离群值附近的情况。为了防范此情况，会记录超出阈值的违规次数，如果没有任何读数落在阈值内，算法将报错并停止。这将处理因所有读数都偏向极端值而产生的问题。在任何其他情况下，方差都足够小，足以解释实际值与预期值之间的误差。根据应用的关键性，阈值可适当调整，那些需要严格质量控制的应用可设置更严格的阈值。但应注意，更严格的阈值会增加系统故障次数，这总比未检测到故障的后果要好。图\
  \ 2.5 总结了该过程。\n\n![图 2.5 偏差测试模块。](img/Fig02_05.jpg)\n\n**图 2.5** 偏差测试模块。\n\n记录完违规集合后，每个违规者将上缴固定比例的权益，然后均匀分配给给出正确读数的节点。这将使可靠的传感器受益，同时惩罚其他传感器。验证者集合不受这些变化影响。\n\
  \n权益转移完成后，将检查验证者集合中落在阈值内的读数（尽管平均值计算未考虑这些值）。如果任何验证者能够生成可靠读数，它们可以向贡献者收取“费用”，贡献者随后捐出其可用权益的固定比例，均匀分配给所有合格的验证者。这使得验证者一旦开始生成良好读数，最终就能恢复为贡献者状态。不合格节点将保持其原有权益，等待恢复生成正确读数。这相当于收取“Gas\
  \ 费”，由节点在执行时上缴。图 2.6 和图 2.7 深入解释了该过程。\n\n![图 2.6 费用资格模块。](img/Fig02_06.jpg)\n\n\
  **图 2.6** 费用资格模块。\n\n![图 2.7 权益转移模块。](img/Fig02_07.jpg)\n\n**图 2.7** 权益转移模块。\n\n\
  最终结果是一个始终保持总权益一致的系统，根据节点的可靠性将权益适当分配给不同节点。即使某节点被标记为不可靠并失去贡献特权，它仍有机会恢复其角色。\n\n## 2.6\
