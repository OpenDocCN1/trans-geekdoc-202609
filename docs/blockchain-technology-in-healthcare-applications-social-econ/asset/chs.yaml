  \n# 7 基于健康参数的血压预测回归分析\n\n**Biswabandhu Jana**\n\n**IIT Kharagpur (印度理工学院卡尔格普尔分校)**\n\
  \nDOI: [10.1201/9781003224075-7](http://doi.org/10.1201/9781003224075-7)\n\n## 7.1\
  \ 引言\n\n血压（BP）是我们整体健康的代表性参数，也是疾病的最佳预测指标之一。在全球范围内，高血压导致 750 万人死亡，约占总死亡人数的 12.8% [[1]](#C_012_c7.xhtml#r7_1)。高血压加剧了冠心病、短暂性脑缺血发作（TIA）、痴呆（脑部疾病）、肾脏损害（肾病）、出血性卒中以及多种慢性疾病的主要风险\
  \ [[2]](#C_012_c7.xhtml#r7_2)。低血压则使严重健康状况（如步履蹒跚、头晕、晕厥等）的风险增加。为了有效控制血压，医疗专业人员需要一个持续的健康监测系统。本研究旨在通过生物特征参数——即体重指数（BMI）、心率（HR）和年龄——来估算收缩压（SBP）和舒张压（DBP），以实现早期检测和诊断。总体而言，开发的模型促进了即时检测（POC）应用的发展。\n\
  \n本文其余部分安排如下。第 7.2 节 介绍了与血压研究领域相关的文献综述。在 第 7.3 节 中，利用一些生物特征因素建立了估算 SBP 和 DBP 的模型。这些参数与血压的相关性也通过统计分析进行了展示。第\
  \ 7.4 节 计算了误差估计，并使用 *t* 检验验证了结果。最后，开发了一款智能手机应用程序用于预测 SBP 和 DBP 数值。结论性意见见 第 7.5 节。\n\
  \n## 7.2 文献综述\n\n多篇研究文章展示了预测血压的无创技术及高血压的影响。文献 [[3]](#C_012_c7.xhtml#r7_3) 中，作者提出超重会增加高血压的几率，并利用多元线性回归分析了\
  \ BMI 与血压的关联。文献 [[4]](#C_012_c7.xhtml#r7_4) 报道了低 BMI 人群中血压与 BMI 的关系，并利用多元回归建模考察了该关系中的性别差异。文献\
  \ [[5]](#C_012_c7.xhtml#r7_5) 对人工神经网络（ANN）和多元线性回归（MLR）进行了比较研究，利用一些生物特征参数和脉搏波传输时间（PTT）连续估算血压。文献\
  \ [[6]](#C_012_c7.xhtml#r7_6)、[[7]](#C_012_c7.xhtml#r7_7) 描述了年龄对正常人群和未治疗高血压人群血压的影响。此外，文献\
  \ [[8]](#C_012_c7.xhtml#r7_8)、[[9]](#C_012_c7.xhtml#r7_9) 还提出了一种基于心电图（ECG）和光容积脉搏波（PPG）信号的连续无袖带血压筛查方法。文献\
  \ [[10]](#C_012_c7.xhtml#r7_10) 中，作者提出了一种基于加速度计的方法（无需任何专用外部传感器），可在平板触摸屏上显示血压。文献\
  \ [[11]](#C_012_c7.xhtml#r7_11) 还提出了一种基于多普勒超声的血压估算方法，提供了一种无创、无阻塞的血压估算手段。此外，文献 [[12]](#C_012_c7.xhtml#r7_12)\
  \ 还提出了一种基于人工特征向量的深度神经网络血压估算模型。还有一些基于指纹的开源 Android 应用程序可用于监测血压。然而，这些血压应用程序可能显示不准确的读数，从而使我们的健康状况复杂化，或带来虚假的安全感\
  \ [[13]](#C_012_c7.xhtml#r7_13)。为了有所不同，本研究引入了一种基于智能手机的应用程序，可收集健康参数、处理并预测血压。此外，还广泛报道了年龄调整后\
  \ BMI 对血压的影响。所提方法的优势在于针对小训练样本的计算复杂度较低，且无袖带血压估算可赋能 POC 系统。\n\n## 7.3 提出的方法\n\n提出方法的框图如\
  \ 图 7.1 所示，描述了从数据收集到血压预测的整个过程。\n\n![图 7.1 提出方法的框图。](img/Fig07_01.jpg)\n\n**图 7.1**\
  \ 提出方法的框图。\n\n### 7.3.1 数据收集\n\n为进行本实验，从受试者处收集了血压、心率、年龄、身高和体重。受试者表面健康，在该年龄段无严重临床病症，且无慢性疾病。受试者在仰卧休息状态下，由受过训练的人员通过听诊收缩期和舒张期\
  \ Korotkoff 音测量血压。在左侧肱动脉处，血压测量袖带试图阻断动脉。在经验丰富的专业人员协助下，使用 `Rossmax GB102 Aneroid Blood\
  \ Pressure monitoring device`（Rossmax GB102 液柱血压监测装置）测量血压。BMI 由体重（kg）与身高平方（m²）的比值计算得出。\n\
  \n实验研究在 156 名年龄介于 21 至 80 岁的志愿者身上进行。所有获得参数的均值和标准差（SD）分别为：SBP 124.27 ± 13.86 mmHg，DBP\
  \ 76.1 ± 8.37 mmHg，年龄 43.60 ± 18.11 岁，HR 73.12 ± 7.67 bpm，BMI 24.9 ± 4.35 kg/m²。血压大于\
  \ 140/90 mmHg 的患者视为高血压，120–140/80–90 mmHg 为高血压前期，低于 120/80 mmHg 定义为正常血压。\n\n###\
  \ 7.3.2 模型\n\n基于训练数据，考察了不同的基于机器学习的回归模型以获得最佳性能。在输入值被视为 BMI、HR 和年龄的情况下，选择了采用 10 折交叉验证的线性回归模型。采用\
  \ `WEKA Machine Learning toolbox`（WEKA 机器学习工具箱）实现提出的模型 [[14]](#C_012_c7.xhtml#r7_14)。模型经过训练并保存，用于预测未知受试者的血压值。\n\
  \n此外，还进行了统计分析以确定输入变量作为合适预测因子的有效性 [[15]](#C_012_c7.xhtml#r7_15)。在显著性水平 `P < 0.05`\
  \ 下，使用 Pearson 相关系数确定所有变量之间的关系。所有这些自变量与血压之间存在中等程度的相关性。相关值如下（见 图 7.2）：SBP 与 BMI（`r\
  \ = 0.43`，`P < 0.0001`），DBP 与 BMI（`r = 0.35`，`P < 0.0001`），SBP 与 HR（`r = 0.3`，`P\
  \ < 0.0001`），DBP 与 HR（`r = 0.44`，`P < 0.001`），SBP 与年龄（`r = 0.47`，`P < 0.0001`）以及\
  \ DBP 与年龄（`r = 0.17`，`P < 0.0001`）。\n\n![图 7.2 相关性图。(a) SBP 对 BMI，(b) DBP 对 BMI，(c)\
  \ SBP 对 HR，(d) DBP 对 HR，(e) SBP 对年龄，(f) DBP 对年龄。](img/Fig07_02.jpg)\n\n\n\n\n\n\
  ### 7.3.3 Android 应用程序\n\n基于线性回归分类器开发了一款 Android 应用程序，用于根据用户输入预测 SBP 和 DBP。系数值从预训练模型中获取并用于血压估计。所提设计采用了\
  \ JAVA 平台，并在运行 Android 操作系统（KitKat，Google, Inc.）的 Moto E（Motorola, Inc.）智能手机上实现了该应用程序\
  \ [[17]](#C_012_c7.xhtml#r7_17)。\n\n## 7.4 结果与讨论\n\n156 名受试者的测量数据被顺序划分为 106 名受试者用于训练，50\
  \ 名受试者作为未知测试集。50 名测试受试者的血压预测准确性如 表 7.1 所示。通过测量平均误差（ME）、平均绝对误差（MAE）、误差标准差（SDE）和均方根误差（RMSE）来观察性能。根据医疗仪器促进协会（AAMI）的标准，测试受试者的\
  \ ME 和 SDE 值必须分别低于 5 和 8 mmHg [[18]](#C_012_c7.xhtml#r7_18)。在 表 7.1 中，所提方法的 ME 值低于\
  \ AAMI 标准的可接受限值。就 SDE 标准而言，DBP 值在误差范围内，而根据获取的数据集，SBP 超出了可接受限值。\n\n**表 7.1** 测试数据血压预测误差\n\
  \n| | ME | MAE | SDE | RMSE |\n| --- | --- | --- | --- | --- |\n| SBP | −1.5 | 9.36\
  \ | 11.5 | 11.49 |\n| DBP | 1.94 | 4.9 | 6.48 | 6.7 |\n\n表 7.2 还展示了关于英国高血压学会（BHS）标准\
  \ [[19]](#C_012_c7.xhtml#r7_19) 的准确性。BHS 标准考虑三个不同的阈值，即误差值小于 5、10 和 15 mmHg 进行分级。根据\
  \ BHS 协议，针对获取的数据集，所提方法对于 DBP 的估计可视为 B 级，对于 SBP 的估计可视为 C 级。\n\n**表 7.2** SBP 和 DBP\
  \ 测量的累积误差百分比\n\n| | < 5 mmHg | < 10 mmHg | < 15 mmHg |\n| --- | --- | --- | ---\
  \ |\n| SBP | 39.74 | 69.23 | 85.25 |\n| DBP | 57.69 | 81.4 | 93.6 |\n\n图 7.3 显示了\
  \ Bland-Altman 图的散点图，用于检查实际和预测血压值之间的差异。*y* 轴表示测量值和估计值之间的差异，而 *x* 轴显示这两种技术的平均值 [[20]](#C_012_c7.xhtml#r7_20)，[[21]](#C_012_c7.xhtml#r7_21)。Bland-Altman\
  \ 图使用虚线包含了上下一致性限值的 95% 置信区间。\n\n![图 7.3 误差值的 Bland-Altman 图。(a) 显示实际值和参考值平均值的 SBP\
  \ 差异。(b) 显示实际值和参考值平均值的 DBP 差异。](img/Fig07_03.jpg)\n\n**图 7.3** 误差值的 Bland-Altman\
  \ 图。(a) 显示实际值和参考值平均值的 SBP 差异。(b) 显示实际值和参考值平均值的 DBP 差异。\n\n从 Bland-Altman 图中可以明显看出存在来自偏差的趋势。误差差异随\
  \ DBP 测量幅度变宽，且预测高 DBP 值时比例误差也增加。对于 SBP，标准值存在中等趋势，且在预测高 SBP 值时绝对系统误差在减小。此外，实际值与预测值之间的相关性分别为\
  \ SBP 0.64 和 DBP 0.54。\n\n根据此分析，发现 BMI 与 BP 之间存在显著正相关。BMI 的增减与 SBP 和 DBP 的变化显著相关。然而，BMI\
  \ 对 BP 的确切影响仍不清楚。表 7.3 显示了预测 SBP 和 DBP 值的优势比（OR） [[22]](#C_012_c7.xhtml#r7_22)，[[23]](#C_012_c7.xhtml#r7_23)。就\
  \ SBP 而言，超重人群（BMI > 25 kg/m²）患高血压（SBP > 140 mmHg）的可能性是正常 BMI（18–25 kg/m²）人群的 7.3\
  \ 倍，患高血压前期（SBP 120–140 mmHg）的可能性是正常人群的 3.82 倍。DBP 显示超重人群患高血压的可能性是正常人群的 6.3 倍，且低于高血压前期人群与正常\
  \ BMI 类别人群的对比。低体重人群（BMI < 18 kg/m²）与高血压和高血压前期均无关联。在一项额外分析中，BMI 对 60 岁及以上人群影响最强。SBP\
  \ 的 OR 为高血压 11，高血压前期 1.86。对于 DBP 测量，高血压人群的 OR 为 8。特别是，BMI 异常升高的老年患者表现出向高血压发展的渐进倾向。\n\
  \n**表 7.3** SBP 和 DBP 的优势比预测\n\n| | 高血压 | 高血压前期 |\n| --- | --- | --- |\n| 超重 | SBP\
  \ | 7.3 | 3.82 |\n| | DBP | 6.3 | 0.8 |\n| 低体重 | SBP | 0.87 | 0.38 |\n| | DBP |\
  \ NA | 0.25 |\n| 正常 | 作为参考 |\n\n此外，执行了双尾独立样本 *t* 检验，以观察每对血压测量值之间是否存在统计学显著差异。在 *t*\
  \ 检验中，三个参数（BMI、HR 和年龄）的显著性水平取为 0.05。峰度和偏度的值小于进行 t 检验的可接受值 [[24]](#C_012_c7.xhtml#r7_24)。表\
  \ 7.4 显示了高血压、高血压前期和正常人不同配对获得的 *P* 值。应注意，*P* 值越小表明这三种情况之间的区分度越好。结果显示，除了一种情况（高血压-高血压前期情况下\
  \ HR 的 *P* 值）外，BMI、HR 和年龄的 *P* 值均显示出高血压、高血压前期和正常患者之间的区分。\n\n\n\n\n\n### 表 7.4 不同血压病例配对获得的\
  \ *P* 值\n\n| | BMI | HR | 年龄 |\n|---|---|---|---|\n| 高血压–临界高血压 | 0.013 | 0.36 |\
  \ 0.007 |\n| 临界高血压–正常 | 0.000 | 0.005 | 0.000 |\n| 正常–高血压 | 0.000 | 0.005 | 0.000\
  \ |\n\n最后，基于所提出的线性回归模型，实现了一个基于智能手机的 Android 应用程序，用于预测 SBP 和 DBP 值。图 7.4 展示了基于用户输入的年龄、HR\
  \ 和 BMI 来预测血压的 Android 应用程序。图 7.4a 和 7.4b 分别显示了 Android 应用程序的主屏幕和应用程序预测 SBP 与 DBP\
  \ 值的界面。\n\n![图 7.4 Android 应用程序。(a) Android 应用程序主屏幕和 (b) Android 应用程序预测血压。](img/Fig07_04.jpg)\n\
  \n**图 7.4** Android 应用程序。(a) Android 应用程序主屏幕和 (b) Android 应用程序预测血压。\n\n#### 7.4.1\
  \ 局限性与未来展望\n\n所提出的研究存在一些局限性。获取的数据集不符合 AAMI 或 BHS 标准的标准，无法据此观察模型的性能。此外，在 Bland-Altman\
  \ 图中可见一种趋势，即误差值在高和低血压值处增加。未来，可以根据国际标准协议收集更多数据集，以改进血压估计值。此外，基于深度学习框架的物联网系统可将该工作扩展至改善医疗保健系统以及连续血压监测\
  \ [25, 26]。\n\n## 7.5 结论\n\n在本研究中，基于生物特征参数的独立效应，提出了一种无创且非阻塞性的血压估计回归模型。对于即时检测（POC）应用，还实现了一个基于\
  \ Android 的平台，以在远程环境中连续监测血压。此外，BMI 显示出是血压测量的强预测因子，高 BMI 是高血压的风险增加因素。但现有模型的局限性在于，预测血压的性别相关差异未包含在本研究中。对于未来的研究，建议纳入性别差异对血压和\
  \ BMI 双方的影响，以便在更大样本量中验证该模型。\n\n## 致谢\n\n我们感谢印度加尔各答 EKO 心脏基金会的 Sankar Mitra 博士，以及印度加尔各答\
