  \n# 4 加密货币革命：比特币时间预测与区块链异常检测\n\nVishakha\n\n塔塔咨询服务公司\n\nNikhil Sharma\n\n德尔理工大学\n\
  \nIla Kaushik\n\n克里希纳工程技术学院\n\nBharat Bhushan\n\n沙达大学\n\nChaitanya Kumar Dixit\n\
  \n比姆拉奥·安贝德卡尔大学\n\nDOI: [10.1201/9781003224075-4](http://doi.org/10.1201/9781003224075-4)\n\
  \n## 4.1 简介\n\n几天前，一个标题在市场上引起了轰动：“ICICI 银行成为首家利用区块链进行结算的印度银行。他们目前处于测试阶段。” 现在问题来了，什么是区块链？区块链简单来说就是一个分布式数据库和\
  \ P2P 账本 [[1]](#C_009_c4.xhtml#r4_1)。账本基本上是交易的注册表。数据库在去中心化网络的成员之间共享、复制和同步。每个参与者对账本中的记录更新进行治理并达成共识\
  \ [[2]](#C_009_c4.xhtml#r4_2)。每条记录都包含一个时间戳和唯一的加密签名，这使得账本不可篡改且可审计。在这种布局下，黑客攻击是不可行的。它可以在参与者之间转移任何有价值的物品。它是比特币背后的底层技术\
  \ [[3]](#C_009_c4.xhtml#r4_3)。之所以称为分布式，是因为每个人都是权威，这使其不易崩溃。由于不需要中介，总体成本降低了。区块链的概念源于\
  \ 2008 年金融危机 [[4]](#C_009_c4.xhtml#r4_4)。它被称为自 1929 年以来最大的衰退。2008 年金融危机的原因如下：低效且腐败的金融体系，经济市场以多米诺骨牌效应崩溃，多家投资银行破产导致多次救助。\n\
  \n\n\n\n### 经济危机的后续影响\n\n经济危机的后续影响包括人们对现有金融体系失去信心，导致大规模从银行提款。这促成了比特币的演变 [5]。它由一名叫中本聪的人于\
  \ 2008 年发明，旨在作为比特币的社区交易或业务注册系统。比特币通常称为 `BTC` [6]，其本质完全是数字化的，运作方式类似于任何独立货币。它是一种开源的\
  \ P2P 货币，数据同时存储在多个节点上 [7]。由于交易是匿名的，它提供了高度的隐私保护。它具有不可篡改、成本更低、安全和通货紧缩的特性。它也是法币性质的，因为它不由有形物质作担保\
  \ [8]。本文介绍了一些机器学习和深度学习算法 [9] 的概念，用于处理比特币数据集，从而提出比特币价格和趋势的时间预测。对于时间序列预测，可以使用两类算法：(1)\
  \ 白箱算法，如 `Auto Regressive Integrated Moving Average (ARIMA)` [10]、`ARMA` 和 `AR`；(2)\
  \ 黑箱算法，如 `long short-term memory (LSTM)` [11]、`Recurrent Neural Network (RNN)`、`CNN`\
  \ 和 `NNETAR`，以及一些监督学习概念，如 `support vector machine` [12]。时间序列可以用不同的模型进行预测。其中一些模型如下：`Naïve`、`Seasonal\
  \ decomposition (+ any model)`、`ARIMA`、`GARCH`、`Prophet`、`NNETAR` 和 `LSTM`。\n\n\
  使用 `K-means clustering` [13] 预测数据集中的异常数量，旨在检测比特币交易过程中的异常。由于区块链是一个数字化过程，它极易受到虚假交易和异常的影响\
  \ [14]。为克服这种情况，首先应预测交易中异常发生的几率和领域。`Blockchain anomaly detection` [15] 有助于构建标准行为模型，然后对新数据集（测试数据）进行预测，以判断其与该基准模型的偏离程度。区块链技术的核心概念蕴含于两个主要组件中：`Hash\
  \ Tree` 和 `Timestamp`。`Merkle Tree (Hash Tree)`：由 R. Merkle 于 1979 年提出。叶子节点的顶点由数据的哈希标记，非叶子节点的顶点由标签及其子节点的解码哈希标记。如果我们更改数据或哈希，将导致与根哈希不匹配。因此，它非常难以被篡改\
  \ [16]。\n\n本文介绍了一种综合方法，利用各种机器学习算法预测比特币过程中时间序列的性质，并自动识别区块链系统中的异常。在当前数据集中，比特币的加权价格和交易量处发生异常的几率较高；因此，在对时间戳进行日期时间转换后，我们分别绘制了比特币加权价格和交易量随时间戳变化的图表。此外，本文还讨论了实施过程中的各种挑战性结果及可能的解决方案。本工作的主要贡献总结如下。\n\
  \n*   系统详细地研究了 `ARIMA`、`LSTM` 和 `XGBoost` 等机器学习算法。\n*   本工作展示了使用 `ARIMA`、`LSTM`\
  \ 和 `XGBoost` 进行比特币趋势预测。此外，输出图表显示 `ARIMA` 模型产生的预测趋势优于其他模型。\n*   还通过使用 `K-means clustering`\
  \ 的实施程序研究了异常检测。此处，利用时间戳概念来防止篡改，并避免在任何情况下出现单点故障。\n*   展示了比特币加权价格和交易量随时间戳变化的图表。\n\n\
  本文其余部分组织如下。第 4.2 节 介绍时间序列预测和异常检测模型的背景。第 4.3 节 介绍相关工作。第 4.4 节 重点介绍 `ARIMA` 模型、`XGBoost`\
  \ 模型和异常检测模型的设计与实现。这些模型的性能评估见 第 4.5 节。最后，第 4.6 节 总结全文并概述若干未来研究趋势。\n\n## 4.2 背景\n\n\
  比特币是一种加密货币，用于在线交换数字资产。区块链是数字加密货币比特币的支柱。它是一个分布式软件网络，服务于两大核心功能 [17]。第一是作为数字账本，第二是一种无需中介即可安全转移资产的机制。许多人混淆了区块链和比特币的概念。区块链是一项技术，而\
  \ `Ethereum` [18]、比特币和 Neo 是其协议。`Ethereum` 是一个构建了货币和支付系统（称为加密货币）的互联网。其他应用既不会窃取你的数据，也无法监视你。它为每个人提供了一个可访问的经济系统。它于\
  \ 2015 年提出概念，至今仍是世界领先的计算化区块链。`Ether` 是 `Ethereum` 的原生货币，在许多方面与比特币相似。许多去中心化应用构建于\
  \ `Ethereum` 之上，这意味着没有单一实体可以控制它。图 4.1 展示了区块链与比特币及 `Ethereum` 的区别。\n\n![图 4.1 区块链与比特币的区别。](img/Fig04_01.jpg)\n\
  \n**图 4.1** 区块链与比特币的区别。\n\n简单来说，区块链是一种 `P2P (Peer to Peer)` 即对等网络账本数据结构。该数据结构的内容是区块，例如比特币交易。该数据结构还有一个区块头，包含关于区块的数据、前一个区块的引用以及一个指纹（称为哈希），用于引用下一个区块。区块的指纹用于引用目标区块\
  \ [19]。这些区块指纹通过算法生成，用于验证数据。每笔交易都由 51% 多数派验证。每个参与者都拥有数据库的完整版本。部分区块链领域的顶级投资者如下：`Mitsubishi\
  \ UFJ Capital`、`Andreessen Horowitz`、`Greylock partners`、`Xapo`、`Ripple labs`、`Coinbase`\
  \ 等。表 4.1 展示了 `Cascading Style Sheets (CSS) System`（客户端-服务器系统）与 `P2P System` 的对比。\n\
  \n**表 4.1** CSS 系统与 P2P 系统的区别 [20]\n\n| 标准 | 客户端-服务器系统 | P2P 系统 |\n| --- | --- |\
  \ --- |\n| 定义 | 多个客户端连接到一台服务器 | 每个节点可随时成为客户端或服务器 |\n| 服务提供 | 客户端向服务器请求服务 | 每个节点均可请求或提供服务\
  \ |\n| 关注点 | 信息共享 | 互联互通 |\n| 数据存储 | 集中式 | 存储在每个对等节点上 |\n| 服务器请求处理 | 请求过多时成为瓶颈和单点故障\
  \ | 不适用 |\n| 成本 | 高端服务器，昂贵且可扩展 | 由物联链构成，因此更便宜 |\n\n时间序列预测和异常检测可通过以下不同的机器学习概念进行研究：\n\
  \n### 4.2.1 ARIMA\n\n\n\n\n\n## 4.2 时间序列预测模型\n\n### 4.2.1 ARIMA\n\nARIMA 代表一类原型，能够捕捉时间序列统计中一套不同的常规时间配置\
  \ [21]。模型的本质或内在性质由其自身捕获。`AR` 代表自回归，一种利用实际观测值与少数滞后观测值之间依赖关系的模型。`I` 代表整合，即利用实际原始观测值的差分（如用后一观测值减去前一观测值）使时间序列平稳。`MA`\
  \ 代表移动平均，一种利用观测值与移动平均模型的残余误差之间的关联，并进一步应用滞后观测值的模型。在 Python 中，基于 ARIMA 的预测原型可以利用 `Auto\
  \ ARIMA` (Pyramid ARIMA) 或 `Stats Model` 进行设计 [22]。模型进一步拟合到时间序列数据集中，以预测序列中的后续点。\n\
  \n### 4.2.2 RNN\n\nRNN 是人工神经网络 (ANN) 的一种分类，其中顶点之间的依赖关系形成一条具有时间序列的有向轨迹，从而使其能够表现出时间动态性能\
  \ [23]。“循环神经网络”这一术语被随意用来指代两大类具有相同通用结构的网络，其中一类是有限脉冲，另一类是无限脉冲。这两类网络均表现出时间动态行为。有限脉冲循环网络也可以是一条有向无环轨迹，可以通过实际的前馈人工神经元网络展开并复原；而无限脉冲循环网络可能是一条有向环状轨迹，无法展开\
  \ [24]。本章中实现了 LSTM，它是 RNN 的一种分类。\n\n### 4.2.3 Prophet\n\n预测被用作战略制定者或企业的顾问，因此在塑造商业决策方面发挥着重要作用\
  \ [25]。Prophet 是一款用于商业预测的公共领域软件，由 Facebook 数据科学团队发布。它基于一种加法模型，其中非线性趋势被训练以拟合季节性。图\
  \ 4.2 展示了 Prophet 模型。Prophet 的通用方程如下：\n\n![FIGURE 4.2 Prophet model.](img/Fig04_02.jpg)\n\
  \n**图 4.2** Prophet 模型。\n\n```\nz(t)=j(t)+r(t)+h(t) + €n(4.1)\n```\n\n`j(t)` 定义数据中长期增长或下降的模型趋势。根据预测问题的类型，Prophet\
  \ 结合了两种趋势表示：饱和增长模型和分段线性模型。`r(t)` 描述数据集如何受季节性因素（如年份周期）影响，基本上它用傅里叶级数建模季节性。`h(t)` 对假期或大型事件的影响进行建模，这些事件可能对商业时间序列产生不利或有利影响，`€n`\
  \ 代表不可约误差项。表 4.2 展示了各类时间序列预测之间的比较。\n\n**表 4.2** 各类时间序列预测的差异 [26,27]\n\n| 标准 | ARIMA\
  \ | Prophet | RNN |\n| --- | --- | --- | --- |\n| 定义 | 基于回归分析工作。 | 基于加法模型的商业预测公共领域软件。\
  \ | 代表循环神经网络，是人工神经网络的一种分类。 |\n| 基础 | 基于线性时间序列分析。 | 基于贝叶斯曲线拟合。 | 以前的观测值用作当前步骤的输入，描绘过去和当前观测值之间的关系。\
  \ |\n| 用户 | 由受过训练的专业人员使用。 | 通常由非专业人士（非统计学家）使用。 | 因为是深度学习概念，所以由训练有素的专家使用。 |\n| 优势\
  \ | 不需要调整超参数。 | 能高效识别复杂的季节性模式。 | 与 ARIMA 相比，能捕捉时间序列中更多的滞后阶数，本质也非常灵活。 |\n| 后果/局限\
  \ | 需持续输入数据以进行进一步预测，且应使用平稳数据。 | 具有强随机成分的时间序列模型无法使用 Prophet 进行适当预测。 | 梯度消失和梯度爆炸问题。此外，训练时间较长。\
  \ |\n\n### 4.2.4 聚类\n\n聚类是最被广泛接受的探索性数据分析方法之一，用于获取对数据配置的直观理解 [28]。它可以描述为在数据集中识别子群，使得同一簇或子群中的数据点非常相似，而不同簇或子群中的数据点非常不相似。簇之间可以基于欧氏距离或相关距离来判定相似或不相似。`K-means`\
  \ 聚类侧重于将 `t` 个观测值划分为 `K` 个簇。此处每个观测值仅属于一个具有最近平均值的簇。因此，数据空间被划分为 Voronoi 单元。\n\n###\
  \ 4.2.5 XGBoost\n\nXGBoost 使用零值或前值填补缺失值。eXtreme Gradient Boosting 包的一些特性如下：速度与性能，因为它比其他集成分类器快得多。核心算法可并行化，因为它可以利用多核的力量。它始终表现出优于其他算法方法的性能。有多种调优参数，包括正则化、交叉验证、树参数、缺失值处理和\
  \ scikit-learn。XGBoost 属于提升算法家族，其核心使用梯度提升 (GBM) 框架。图 4.3 展示了 XGBoost 模型，表 4.3 展示了\
  \ XGBoost 模型与聚类的比较。\n\n![FIGURE 4.3 XGBoost model.](img/Fig04_03.jpg)\n\n**图 4.3**\
  \ XGBoost 模型。\n\n**表 4.3** XGBoost 与聚类的差异 [29,30]\n\n| XGBoost | 聚类 |\n| --- | ---\
  \ |\n| 是一种集成技术，也称为梯度提升。 | 是一种无监督算法，将数据分组到不同的簇中，使得每组内的观测值相似，而组之间互斥。 |\n| 代表一组对特定问题有不同见解的模型，并组合多个模型。\
  \ | 当数据多样化时，该算法才有意义。 |\n| 在现实问题中，集成比单独聚类更常执行。 | 聚类集成比单独聚类产生更好的结果。 |\n| 用于预测。 | 该方法用于异常检测。\
  \ |\n\n## 4.3 文献综述\n\n\n\n\n\n### 研究现状与应用综述\n\n#### 价格预测与区块链优化\n\n许多研究已利用 `RNN`\
  \ 和 `ARIMA` 模型进行价格预测。研究人员正在提出检测异常的解决方案，并致力于预防异常。研究工作正集中于最大化吞吐量、带宽和规模。为了在比特币交易区块中提供低延迟并增强区块链安全性，必须在特定交易区块上花费更多时间。因此，开发了一种技术，可在不干扰其安全模型的前提下，在几秒钟内构建区块并确认其交易。研究人员正尝试为哈希函数增加更多安全层级。比特币应用程序编程接口（`API`）难以使用；因此，需要一个对开发者友好的\
  \ `API` 以预测更好的结果。\n\n在韩国等国家，区块链被用于发行债券。区块链已被用于屏蔽假新闻。印度即将开发基于区块链的投票系统，而非使用以太坊虚拟机。阿联酋政府转向区块链，以使其医疗数据防篡改。时间序列预测已被用于简化、观察和预测趋势的某些因果行为。它基本上允许我们发现数据集的过去结果如何影响未来。\n\
  \n#### 时间序列预测的应用领域\n\n时间序列预测的应用涵盖商业、金融、科学、工程和医疗健康领域。\n\n- **商业领域**：广泛用于供应链、预订、监控网络流量等。能有效预测商业领域的未来发展，涉及收入政策、销售、税收以及各类资源和交付物的需求。基于历史数据集，企业界可预测未来结果，从而相应规划预算和资金，并合理分配资源。它还影响策略决策，以采用最佳方法实现持续增长。\n\
  - **金融与经济**：用于预测股市趋势和价格、货币兑换、计量经济学。\n- **科学与工程**：用于天文学预测、天气预报、地震和自然灾害预测；广泛应用于传感器和控制信号处理。\n\
  - **医疗健康**：用于疾病医学诊断和生物医学监测。时间序列预测可成功应用于预测死亡率、疾病进展，并据此预测未来可能发生的各种风险。\n\n#### 异常检测的应用与区块链结合\n\
  \n异常检测广泛用于保护基于 Web 的零售业务、金融部门、入侵和欺诈活动检测、故障检测、医疗设施监控、传感器网络和控制信号中的事件检测以及环境干扰检测。使用机器学习算法进行异常检测是当今几乎所有行业最重要的活动之一。\n\
  \n区块链领域有许多拟议研究，为加密世界指明新方向。`SreeragIyer` 等人 [[31]](#C_009_c4.xhtml#r4_31) 提出，`Hyperledger\
  \ Composer` 中的代币（也称为资产，`Hyperledger Composer` 是一组工具，为各类开发者和商人提供制造区块链应用以解决业务问题的能力）可根据企业在废水管理中的贡献发放给商业和工业。\n\
  \n- 最有效的企业是指在水体中实行零排放政策，并将公司产生的废水完全再利用于自身程序和操作的企业。\n- 最差的企业是指不顾后果将所有废水排放到周围栖息地或领土，且不将其视为可重用组分的企业。\n\
  \n因此，代币的分发同时考虑废水再利用的质量和数量。如果企业超过了定义的阈值，则可将代币出售给未达到阈值的其他企业。生成的代币数量与再利用水的纯度成正比。发行和交易这些代币或资产的规则和法规称为智能合约\
  \ [[32]](#C_009_c4.xhtml#r4_32)。许多企业可能将此作为通过篡改授予这些资产的信息来非法获取比特币的手段。因此，该拟议系统利用异常检测算法来预测物联网（`IoT`）仪表中可能发生的潜在骗局或异常。\n\
  \n#### 聚类算法与深度学习在异常检测中的研究\n\n研究了各种聚类算法，如 `K-means` 聚类和基于密度的空间聚类。空间聚类也称为 `DBSCAN`。研究的用于异常检测的深度学习领域其他算法包括自编码器（`auto-encoder`）和\
  \ `LSTM`。\n\n在区块链上存储数据和信息使其成为不可更改的审计追踪，并根据智能合约提供自动分析系统 [[33]](#C_009_c4.xhtml#r4_33)。为使原型更坚固、更稳健，执行有监督和无监督算法以查明供应废水回收统计数据的企业\
  \ `IoT` 仪表的任何变化。\n\n- `K-means` 聚类通过研究肘部图并确定拐点，预先指定了要形成的聚类数量。\n- `DBSCAN` 算法根据其输入变量形成聚类。\n\
  \n此处 `Hyperledger Fabric` 使用基于 `Kafka` 的共识机制，这与使用昂贵的工作量证明（`Proof-of-Work`）的 `Ethereum`\
  \ 或 `bitcoin` 不同。该拟议系统具有一个控制机制，用于提供资产并检查异常或欺诈，因此不需要 `Proof-of-Work` [[34]](#C_009_c4.xhtml#r4_34)，因为供应商和借款人的身份必须是已知的。\n\
  \n#### 基于区块链与深度学习的智能电网隐私保护架构\n\n`MarwaKeshk` 等人 [[35]](#C_009_c4.xhtml#r4_35) 提出了一种依赖于区块链和各种深度学习算法的隐私保护架构，以委托智能电网的数据集，从而能感知未来对数据的潜在攻击。该架构包含两级安全机制：\n\
  \n1. 第一级定义了一种 `ePoW` 方法以确认信息完整性。\n2. 第二级包含一种变分自编码器（`variational auto encoder`）技术，以隐藏数据并将其重组为新配置。\n\
  \n与当代方法相比，利用两步安全机制可获得更优越的成果，且在避免数据篡改和推理攻击利用智能电网本地数据存储方面也非常有效。其中一种异常观测方法是 `LSTM`，它在执行两步安全技术前后均应用于数据\
  \ [[36]](#C_009_c4.xhtml#r4_36)。获得的结果表明，该拟议技术在精确率和预警率方面优于其他拟议技术。该研究的未来扩展包括在来自智能电网的各种实时数据上实施该架构，以评估其可扩展性、可行性和盈利能力。\n\
  \n电网现代化极受关注，特别是对美国和澳大利亚等技术领先的发达国家而言，因为智能电力系统有能力最大化能源消耗并提供最佳解决方案。如 图 4.4 所示的网络物理系统展示了单个每次点击成本（`cost-per-clicks`）单元如何合并以确定智能电网，后者结合物理和信息传输自动化及相应组件，以扩展电网的能力和生产力\
  \ [[37]](#C_009_c4.xhtml#r4_37)。\n\n![图 4.4 网络物理系统框图](img/Fig04_04.jpg)\n\n**图 4.4**\
  \ 网络物理系统框图\n\n\n\n\n\n### 文献综述\n\nAtzei 等人 [[38]](#C_009_c4.xhtml#r4_38) 提出了通用智能合约程序陷阱的分类，注意到了针对智能合约的各种批评，并提供了常见智能合约编程陷阱的分类法。Anh\
  \ 等人 [[39]](#C_009_c4.xhtml#r4_39) 结合数据处理视角，强调了私有区块链的概念。Tschorsch 等人 [[40]](#C_009_c4.xhtml#r4_40)\
  \ 没有强调区块链技术本身，而是提出了关于分布式数字货币的实用综述。Holub 等人 [[41]](#C_009_c4.xhtml#r4_41) 梳理了 1,200\
  \ 多篇关于比特币的论文，并将其分为六类。Mingli Wu 等人 [[42]](#C_009_c4.xhtml#r4_42) 将区块链技术分为四层，并就区块链的各种应用（特别是在物联网、网络和交易共识机制领域）进行了广泛研究。从版本\
  \ 1.0 到最近的版本 3.0，区块链在持续演进。版本 1.0 代表比特币时代，版本 2.0 定义了智能合约，版本 3.0 目前处于观察状态，涉及去中心化应用（DApps）。在金融系统未来的背景下，Vigna\
  \ 等人 [[43]](#C_009_c4.xhtml#r4_43) 分析了区块链应用对全球商业领域的影响。Peters 等人 [[44]](#C_009_c4.xhtml#r4_44)\
  \ 探讨了区块链的安全攻击面，包括自私挖矿、区块分叉和共享拒绝服务攻击。Swan 等人 [[45]](#C_009_c4.xhtml#r4_45) 提出即将到来的区块链\
  \ 3.0 时代将在隐私管理、投票结构和物联网方面创造许多新前景。Kosba 等人 [[46]](#C_009_c4.xhtml#r4_46) 分析了涉及罪魁祸首智能合约的智能合约系统的不同前景。McNally\
  \ 等人 [[47]](#C_009_c4.xhtml#r4_47) 利用比特币价格指数，结合机器学习和深度学习概念预测比特币价格，使用 LSTM 网络实现了\
  \ 52% 的准确率。Jang 等人 [[48]](#C_009_c4.xhtml#r4_48) 使用贝叶斯神经网络及其他线性和非线性原型来解释比特币的波动性，从而提高了预测性能。\n\
  \n## 4.4 设计与实现\n\n在时间序列分析方法中，首先对数据进行预处理并转换为合适的形式。基于各种方法找出最佳模型，并将其应用于测试数据集。通过从 Google\
  \ APIs 导入实时数据集，该架构可很好地用于实时场景。时间序列分析的架构如 图 4.5 所示。\n\n![FIGURE 4.5 Architecture showing\
  \ the flow of time analysis.](img/Fig04_05.jpg)\n\n**图 4.5** 时间分析流程架构。\n\n在数据集上实现简单\
  \ K-means 聚类，计算每个聚类的均值或集合，并根据数据点与特定聚类值的相似性或差异性对数据集点进行区分。图 4.6 展示了 K-means 聚类模型。\n\
