    According to Mintzberg, there are seven organization types, depending on which
    of the five parts plays the dominant role. Mintzberg''s basic organizational configurations
    are:


    +   1. The entrepreneurial organization: it has a flat structure and a large strategic
    top.

    +   2. The machine bureaucracy: a heavy middle management and standardization
