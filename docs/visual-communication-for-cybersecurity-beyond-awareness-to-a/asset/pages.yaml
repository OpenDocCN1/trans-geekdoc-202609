    # 9.5 Nudge theory


    The nudge theory is often used in politics, healthcare, marketing, and organizational
    communication to influence behaviour. A nudge is a small change to the context
    within which a decision is made. A nudge, as defined by Thaler and Sunstein96,
    is any aspect of the choice architecture (the set of options to choose from) that
    alters people''s behaviour in a predictable way without forbidding any options
    or significantly changing their economic incentives. Changing the choice architecture
    makes it easier for people to make decisions that are in their self-interest.
    A famous example is the fly that is painted on urinals in restrooms. Men tend
    to aim at the fly, thus reducing spillage and cleaning costs. It is not mandatory
    to aim at the fly and there is no specific economic benefit for the visitor of
    the restroom. They could still choose to aim somewhere else. Another well-known
    nudge is to set a default option as opt-in for specific choices that are better
    for the community: opt-in as default for organ donation or pension-saving schemes.


    Nudges are frequently used in a cybersecurity context to influence behaviour of
    an end-user. Nudges for security and privacy face some challenges regarding ethics,
    criminal exploitation, and design. There are concerns about the impact on the
    nudgees'' welfare, autonomy, and dignity97. Nudging ought to be carried out for
    the good, but the question is, whose good? There is ongoing debate about the ethics
    of nudging, especially when carried out by governments. The danger with nudges
    is that people are forced into political or religious directions. Most people
    tend to support nudges as long as they serve to promote health, safety, and environmental
    protection98. Sometimes, however, they are based on lies and manipulation. Nudges
    can be used by cybercriminals to nudge people into disclosing personal information,
    to install malicious software, or to click on something that looks attractive
    but eventually leads to identity theft or fraud. Another criticism is that design
    choices may lead people to start ignoring risks. They may rely completely on the
    default settings and stop thinking about security.


    The table lists some examples of nudges in cybersecurity.'
