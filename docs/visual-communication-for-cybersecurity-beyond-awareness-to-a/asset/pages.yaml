  md: 'self and others. They found that employees'' long-lasting learning is enabled
    by having them exploring the unwanted consequences of their own actions. They
    also found empirical evidence that one-off training is not enough, and that training
    should be supported with continuous communication activities.


    A study amongst 325 students in an American university91 tested individual responses
    to phishing emails and found results consistent with ELM and other related theories.
    The study found that several variables influence the elaboration likelihood:


    +   1. Level of involvement in the phishing detection process. The more relevant
    an email is, the more elaboration.

    +   2. Attention to urgency cues. Phishers use urgency cues to communicate fear
    or threat. In this study, the individuals focused disproportionately on urgency
    cues, often ignoring other elements of the email such as its source and the grammar
    and spelling used in the email. The lack of attention to these elements increases
    the individual''s likelihood to be phished.

    +   3. Habitual media use patterns, where individuals inattentively respond to
    relevant emails, accounted for at least one-half of the phishing susceptibility.

    +   4. Email load. Individuals were far more likely to respond to phishing emails
    in the presence of large email loads.


    The main lesson is that, according to the ELM, people are more likely to be persuaded
    if they engage with a message longer and repeatedly. To achieve longer attention,
    the message must be understandable and personally relevant. Distractions should
    be avoided.


    # 9.4 Cognitive dissonance theory


    Cognitive dissonance is the discomfort that people feel when they simultaneously
    hold conflicting beliefs, ideas, or behaviours. For example, when a person believes
    it is important to exercise but rarely makes time for sports. This causes a feeling
    of discomfort that may stimulate the person to change the behaviour and go to
    the gym. Other ways of dealing with the discomfort are justification of their
    behaviour by changing attitudes (I do not have to go: the health benefits are
    overrated, I get injuries) or by adding more arguments to their beliefs (it is
    expensive, I am too busy).


    Knowledge about the particular cognitive dissonance of a person gives the potential
    to amend that person''s behaviour. This makes it a popular theory amongst advertisers,
    salespeople, activists, and politicians. If marketers want people to buy their
    product, they feed consumers with informa-'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'tion that forces them to make a decision. Think, for example, of commercials
    for health-related products. They argue that a regular product is not good enough;
    your symptoms will not go away with the other products, but when you buy their
    product you can enjoy life again.


    There are several theories about reducing dissonance between attitudes and actions:


    +   Selective exposure. People tend to select information that fits with what
    they already believe and ignore the opposite. A warm and personal environment
    is best for considering different views.


    +   Need for reassurance after a decision. Dissonance is greater after an important
    decision was made, especially if it is hard to change it back and if it took a
    long time to make the decision.


    +   Minimal justification. The best way to change attitude is to offer just enough
    incentive. If there is no significant reward, people will change their attitude
    to justify their behaviour. If there is a large reward, people will achieve compliance
    without attitude change.


    Steps to reduce dissonance of end-users regarding cyber secure behaviour are stimulating
    new beliefs to change the weight of the conflict (e.g. by demonstrating how easy
    it is for third parties to access their computer), to provide them with new information
    (show them solutions such as password management software), or to reduce the importance
    of the beliefs (by enforcing certain actions through technology).


    Cognitive dissonance is a phenomenon that is targeted by cybercriminals. A study
    amongst students in South Africa found that students were confident about their
    attitude and skills in security, their actual behaviour showed differently, indicating
    that they will behave in a way they know is wrong7. For instance, they were trusting
    email content sent from email accounts with names of their friends, even though
    they were confident about their skills in recognizing phishing. Similar results
    were found in the attitude versus cyberbullying and perception of skills for avoiding
    cyberbullying. Finally, the students knew that complex passwords are more secure
    but choose simple ones anyway. These examples of cognitive dissonance make the
    students vulnerable for cybercrimes.


    Another example is the privacy paradox. Online users claim to be very concerned
