  md: '![](img/7ffc38f932cabd3a29392ff94c7e70f0_120_0.png)


    # Cybersecurity skills gap?


    Nicole van Deursen, created with Piktochart


    Based on data from 165


    This infographic is based on a content analysis of 52 job vacancies in The Netherlands
    in spring 2018. With all the talk about the shortage of cybersecurity professionals,
    the results of this analysis suggest that it''s the businesses own fault. Many
    of the job descriptions were written in confusing language (''your job is to level
    the management''); requiring certifications that do not exist (such as: ''you
    are ISO 27001 certified'' -this certificate is for organisations, not for people-);
    or they demand impossible combinations (a CISSP certificate -that requires >5
    years of experience- combined with less than 2 years of working experience). Almost
    half of the employers do not really care about the level of education the candidate
    has completed. They write: ''you have a vocational or university degree''. That''s
    not really encouraging for university graduates... Worst of all, there is no demand
    for the more experienced professional. 67% of employers are not interested in
    professionals with more than 5 years of experience.'
  merge: -1
  img_proc: true
