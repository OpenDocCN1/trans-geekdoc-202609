  md: '# # 17. Visualizing with metaphors


    A metaphor is a way of describing something by relating it to something else.
    It usually refers to common characteristics between the two. This common characteristic
    can relate to a physical similarity, its history, or its constituent parts. There
    are endless possibilities to bring cybersecurity concepts to life through metaphors.


    | Iceberg | Pyramid | Temple |

    |---|---|---|

    | Mountain | Fort/tower | Sandwich |

    | Gears | Clock | Conveyor belt |

    | Funnel | Bridge | Ecosystem |

    | Puzzle | Balance | Gauge diagram |'
