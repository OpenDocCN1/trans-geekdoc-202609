  md: 'or relation with a reputable organization, you will be viewed as someone with
    authority³. It will help you build relationships and gain credibility.


    Personal branding is largely, but not only, about your online presence. It requires
    visual communication. Examples are storytelling to deliver your message, an attention-grabbing
    biography on a website, a catchy LinkedIn headline, your personal style and design
    in presentations, professional profile pictures, as well as video messages. Most
    influencers have a visually attractive website and a consistent visual style in
    articles, blog, and presentations. They know what they are talking about and stand
    by their norms and values. They live by those rules all the time and are always
    conscious about others seeing them.'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# 11. Conclusion


    Communication theory guides us to make better communication design decision. It
    provides models to understand the context in which communication takes place so
    that we understand our audience better.


    It also demonstrates how people learn and how they receive and consider security
    messages. Communication research demonstrates that remembering and understanding
    information does not necessarily lead to commitment and advocacy. To set up a
    communication strategy, there are many choices such as using marketing models,
    rhetoric, storytelling, framing, or personal branding.


    The key takeaways from communication theory are:


    +   1. Tailor security education to the cognitive level of learning objectives

    +   2. Mix visuals, spoken words, written words, and hands-on for maximum effect

    +   3. Adjust communication style to match the organizational structure

    +   4. A shared culture = a shared language

    +   5. Stakeholders influence success

    +   6. Trust in employer motivates compliant behaviour

    +   7. Messages must be relevant and repeated

    +   8. A visual has more effect when the design is coherent

    +   9. Information should fit with what is already believed

    +   10. Persuasion need trust and reassurance

    +   11. The strongest influencer is the social group that a person belongs to


    In the next section of this book, you will find many ideas to support your communication
    strategy. A selection of these examples is briefly discussed in relation to communication
    theory, to help you train your mindset when you are looking at pictures.'
  merge: -1
  img_proc: true
