  md: '# # THIS IS YOUR BRAIN ON PASSWORDS


    Does the theory of cognitive dissonance also apply to our digital behavior? You
    know it''s bad for you, but you do it anyway. Although more malicious continues
    to make headlines, we have changed how we protect our digital life.


    > **Cognitive Dissonance** is the psychological conflict resulting from an individual''s
    performing an action that contradicts his or her attitude, belief, or value.


    # ## WHAT YOU KNOW


    # ## WHAT YOU DO


    +   - **59%** know secure passwords are important

    +   - **91%** understand the risk of using the same passwords

    +   - **2/3** feel their password managing is weak

    +   - **75%** consider these threats important yet still take risks

    +   - **72%** consider their passwords to be secure enough to protect their online
    information

    +   - **47%** are afraid of someone stealing their passwords

