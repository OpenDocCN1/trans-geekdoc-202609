    # 7.4 Lessons from phishing simulations


    The popularity of simulated phishing campaigns as part of corporate cyber-security
    awareness training is still rising. A phishing simulation is when an organization
    sends a mock phishing email to employees. It’s designed to provide feedback if
    employees click the link included in the phishing email. Actions such as opening
    the email or clicking on the link are analysed to evaluate how susceptible the
    people are to email phishing campaigns and to guide further awareness training.
    The theory behind this approach is that staff will learn from their mistakes and
    that the next time they receive a suspicious email they will be more vigilant.
    Some academics call this bullying^9 and there is even an example of a trade union
    publicly disapproving of misleading workers in a financial institution^51.


    Research into the effectiveness of this kind of campaigns delivers mixed results.
    A study amongst 1,350 university students in the USA even found an unexpected
    result: they observed greater user susceptibility with greater phishing knowledge
    and awareness^52. Another study^53 amongst nearly 11,000 students and university
    staff saw a drop of the number of people that clicked on phishing emails in the
    second round of an awareness campaign. However, the numbers were still high, considering
    it was the second round of a repetitive campaign combined with an announcement
    that there was a phishing scam.


    A recent study in Thailand^54 used a mixed training format approach to educate
    participants in the phishing simulation. Before the training the participants
