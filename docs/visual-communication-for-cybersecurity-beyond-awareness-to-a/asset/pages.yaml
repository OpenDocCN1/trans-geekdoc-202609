  md: '# Introducing the psychology of passwords


    LastPass^199

    Copyright: permission from LastPass


    This infographic shows the results of a survey by LastPass and Lab42. The survey
    about attitudes and behaviours around password security found that although people
    know what safe passwords should be, they tend to ignore this knowledge in favour
    of using easy-to-remember passwords, because the fear of forgetting is stronger
    than the fear of being hacked. Furthermore, the personality traits that normally
    define us seem to have little bearing on our poor behaviour but do help people
    rationalize it.'
