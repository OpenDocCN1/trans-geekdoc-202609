    # 10.2 Repetition and habituation


    Habituation is a form of learning where the response to a stimulus decreases after
    being repeatedly exposed to it. People habituate and, as a result, respond less
    to repeated security warnings over time. Neurobiologists argue that this is not
    something people do on purpose but that it is a natural consequence of how the
    brain works. Habituation is an important survival mechanism because it allows
    organisms to save their energy for relevant threats.


    For cybersecurity, this implies that after the first exposure to a security warning,
    the attention to this warning drops when it is repeated over time. The attention
    can improve again by improving the design of the warning messages, by frequently
    changing the design (border, colour, size, symbols, and text) over time, and by
    giving the users a temporary break from the messages before starting again.


    In an experiment with eye tracking technology, researchers compared the user’s
    attention to conventional warning messages with warning messages that were designed
    to change their appearance (polymorphic warnings)¹⁰⁶.'
