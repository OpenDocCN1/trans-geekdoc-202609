    # 9.3 Elaboration likelihood model


    The elaboration likelihood model (ELM) is based on the idea that attitude change
    follows one of the two basic mental routes. They are known as the two routes of
    persuasion. The central route of persuasion is the logical, conscious, and thoughtful
    route. In this route, the person thinks about a message for a longer duration
    of time and carefully considers the information that is given. The process of
    thinking for a longer duration is known as elaboration. To achieve this, people
    need motivation: they should be interested in the information. If the persuasion
    level of the message is strong, well-constructed, convincing, or creative, people
    will get persuaded to change their attitude and behaviour. Attitudes obtained
    via the central route last longer, are less vulnerable to contra-argumentation,
    and are better predictors of human behaviour. The peripheral route is used when
    the message recipient has little or no interest in the subject or has a lesser
    ability to process the message, or when the content is weak. With the peripheral
    route, people do not pay attention to persuasive arguments and are instead influenced
    by superficial characteristics, such as the popularity of the speaker, and the
    change in their attitude is consequently temporary.'
