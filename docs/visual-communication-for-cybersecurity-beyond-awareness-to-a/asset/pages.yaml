  md: 'Security researchers can use attack graphs to organise information on possible
    attack paths within a certain space. The graphs above are based on Verizon’s annual
    Data Breach Investigations Report (2016). They have a starting point at the left
    and an end point (the goal), as well as nodes that function as attack steps or
    entities. The edges are possible paths from one entity to another. These nodes
    and edges carry with them several parameters, such as probability, cost, and incident
    count.


