    at the highest level possible to handle their digital activities.


    Bloom''s taxonomy might assist in tailoring the level of education to the needs
    of the audience with different forms of communication that are not often explored
    by cybersecurity professionals. ''For example, simply teaching an individual what
    a password is, would lie on the remember, and possibly understand level(s) of
    Bloom''s taxonomy. However, [...] to understand why'
