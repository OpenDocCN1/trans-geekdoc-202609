- pgno: 38
  md: 'their own passwords [...] should also be properly constructed and guarded might
    lie as high as the evaluate level of the taxonomy43(p284). This requires people
    to be able to compare passwords and to explain which one is stronger.

    Bloom''s taxonomy could also be useful in the design of cybersecurity education
    for professionals. It helps to identify areas where cybersecurity topics could
    be added to IT courses.

    The other domains from Bloom''s taxonomy (affective and psychomotor) are highly
    overlooked in a cybersecurity context. Skills in the affective domain target,
    for example, attitude and the psychomotor domain focusses on change in behaviour
    and skills. To improve the gap in knowledge about cybersecurity learning in these
    domains, we might find connections in theory of psychology and communication,
    such as those described in the remainder of this book section.


    # 7.2 Learning styles


    Learning style theories claim that individuals learn differently and classify
    people according to their preferred style of learning. A plethora of such models
    sprouted from the 1970s onwards. These theories are much contested and criticized
    for the lack of scientific evidence that individual learning styles even exist.
    Still, many teachers support these theories. In 2014, 90% of surveyed teachers
    in five countries (the United Kingdom, the Netherlands, Turkey, Greece, and China)
    believed that individuals learn better when they receive information tailored
    to their preferred learning styles45.


    One of the theories divides learning into four modalities that are used for learning
    information: visual, aural, read/write, and kinaesthetic (VARK)46,47. Aural or
    auditory means a preference for information that is spoken or heard. The read/write
    modality refers to a preference for written words. Visual modality includes the
    description of information in maps, diagrams, charts, and so on. It includes designs,
    patterns, shapes, and other symbols. Remember that not all pictures are visual.
    Use of a screen (think presentation slides) does not mean that the material on
    it is visual. The message can be text (bullet points), and just because it is
    shown on screen does not mean it is a visual message. The fourth modality, kinaesthetic,
    refers to the preference to experience and practice as a learning style. Learning
    by doing or watching videos of themselves doing it are most effective for people
    with this preference. With the help of a questionnaire, people can find out what
    works best for them. People may switch between modes in different situations or
    prefer a combination of two or more modes. Different researchers that used the
    VARK questionnaire found that the majority of the respondents prefer a combined
    style. This implies that teaching methods should blend the four styles to improve
    the chance of maximum effect.


    VARK and communication have strong links48. Interpersonal communication is embedded
    in the four styles. People inform, persuade, or build rela-'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'tionships the best with their preferred style. Mismatches in VARK profiles
    between people can lead to conflicts and misunderstanding. Marketeers use the
    VARK principles in television commercials when they appeal to all modalities.
    Other forms, such as a video, to explain how a product works appeal more to kinaesthetic
    learners. The read/write modality is needed to read Internet sources, as many
    websites are textual.


    Cybersecurity professionals can take away from this theory that for effective
    communication at conferences, workshops, in marketing, or team building situations,
    the combined use of visuals, text, videos, games, and physical activities may
    be more effective than relying on one single modality. This is also relevant for
    the design of awareness training. A study in Australia looked into the question
    why the staff at a specific bank demonstrated higher levels of information security
    awareness than the general workforce in other industries⁴⁹. Research into the
    explanation of this phenomenon found no correlation between frequency of training
    and the level of awareness. Therefore, the explanation was sought in the type
    of training that the staff received and the way that it was designed. The team
    that developed the training regime consisted of behavioural experts and educators.
    Being aware of different learning styles, they used different channels and media
    to communicate the topics of interest, including video, posters and flyers, and
    informative emails. Furthermore, all employees must pass a mandatory training
    course before gaining access to the ICT systems. Management should focus less
    on the frequency of awareness training, and more on the design of the types of
    training.


    # 7.3 Security education, training, and awareness


    Danish researchers⁵⁰ recently looked into the body of academic literature about
    security training and awareness programmes. Where in the early days of information
