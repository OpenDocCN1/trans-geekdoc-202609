  md: '# 10. Message presentation


    # 10.1 Gestalt principles


    The Gestalt school of thought started around 1912. More than a century later,
    Gestalt psychology continues to inspire research into vision science and cognitive
    neuroscience¹⁰³. However, most people will associate Gestalt with design and arts.
    Gestalt psychology forms the foundation of design rules still used today. It refers
    to perception of grouping: people, when looking at an object, first see the whole
    of something and after that, they start seeing the details. This process is called
    emergence. When we see an object, we first seek for its outline. Then we match
    this outline against shapes and entities that we know. After that, we start identifying
    the parts that make up the whole object.


    Another process is called reification. If we cannot find a pattern match to an
    object, we search our memory to find something that looks like it and we fill
    in the gaps. Some pictures can be interpreted in multiple ways. Our mind then
    chooses to see one at the time.


    There are several principles that help to understand what people observe and thus
    help to design a visual aid in a way that it will look coherent and complete.
    They are called the principles of grouping or the laws of Gestalt.


    Table 4 Overview of Gestalt principles


    | Principle of grouping | Effect | Example |

    |---|---|---|

    | Similarity | The most similar elements (colour, size, texture, type font, or
    orientation) are perceived as more related than elements that do not share those
    characteristics. | ![Example of similarity with red and black dots] |

    | Closure | We tend to look for a recognizable pattern. We fill in the missing
    information to complete a figure. | ![Example of closure with fragmented shapes]
    |'
