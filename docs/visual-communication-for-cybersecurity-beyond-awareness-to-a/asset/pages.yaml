- pgno: 129
  md: '# # Social Engineering


    *noun* ...the art of manipulating people into performing actions or divulging
    confidential information.


    # ## TYPES OF ATTACKS


    **PHISHING**


    Email sent under false pretenses to trick users into supplying attackers with
    their login credentials.


    Types of Accounts Phishers Target:

    - Financial Services: 37%

    - Social networking sites: 26%

    - Others: 17%, 7%, 13%

    - Includes: Global Internet portals, Telephone & Internet Service providers


    **SPEAR PHISHING**


    A targeted phishing email


    91% of the most advanced attacks start with a spearphishing email


    **VISHING** (Voice Phishing)


    Calling a target pretending to be a person of authority, such as an IT supervisor,
    to pump someone for credentials or important Information.


    UK banks alone lost £21 million from vishing attacks in 2014


    **SMISHING** (SMS Phishing)


    Phishing messages sent through text messages rather than email


    200 million SMiShing messages are sent worldwide every day


    **MINING SOCIAL MEDIA**


    Learning more about targeted people through social media in order to build better
    phishing lures


    Between 52 million and 97 million Facebook accounts are fake or duplicate accounts


    **MAN-IN-THE-MIDDLE ATTACKS**


    The attacker impersonates a company by hijacking an SSL connection between a browser
    and legitimate web server by exploiting server-side vulnerability.


    Just a single rogue DNS attack in 2014 targeted all of the customers at over 70
    financial institutions.


    **MAN-IN-THE-BROWSER ATTACKS**


    Same principle as Man-in-the-Middle, only exploiting vulnerabilities in the browser
    itself.


    90% of enterprises are exposed to man-in-the-browser attacks'
  merge: -1
  img_proc: true
