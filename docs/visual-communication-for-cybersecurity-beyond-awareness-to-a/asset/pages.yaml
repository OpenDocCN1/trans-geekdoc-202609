  md: '# 6. Introduction


    This part of the book briefly introduces some of the theories and models studied
    in communication science and how they can be applied to cybersecurity. The content
    may be a bit heavy for some readers. It is not very visual and frequently refers
    to academic publications. In some business situations, it helps to have this background
    information about communication models and theory. Basic knowledge of communication
    theory will help cybersecurity professionals in several ways:


    +   1. To get to know their audience

    +   2. To design the best way to teach their audience

    +   3. To select communication channels that will reach their audience

    +   4. To plan communication activities

    +   5. To design and create better content

    +   6. To better liaise with communication specialists

    +   7. To understand why awareness is not good enough


    The overview on the previous page summarizes this part of the book. The theory
    and models are grouped into three areas: how people learn, the context in which
    communication takes place, and how people are persuaded. The overview of theories
    introduced in this part is far from complete. There are many more models that
    could apply to cybersecurity communication. Unfortunately, research into applying
    those models to a cybersecurity context is scarce. There is still much to learn,
    and hopefully, this book section can be of interest to researchers who are at
    the beginning of a research project and are looking for an overview of communication
    theory applied to cybersecurity.'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# 7. How people learn


    Security awareness programmes aim to inform and train employees so that they are
    able to perform their tasks in a secure way. In many organizations, these awareness
    programmes are created by the security staff, sometimes in collaboration with
    communication specialists. These awareness programmes often include training programmes
    and, therefore, cybersecurity professionals will benefit from some knowledge of
    learning theory.


    # 7.1 Bloom''s taxonomy


    In the 1950s, Benjamin Bloom, together with a group of scholars, developed a classification
    of educational goals known as Bloom''s Taxonomy of Educational Objectives40. In
    2001, key elements of the taxonomy were updated to reflect more relevance to 21st-century
    educational goals41. The taxonomy classifies three areas of learning: the cognitive
    domain (knowledge), the affective domain (emotion), and the psychomotor domain
    (actions). The cognitive domain consists of six levels of learning objectives:


    Table 1 Bloom''s levels of learning objectives.


    | Bloom''s level (version 2001) | Learning objective | Related verbs |

    |---|---|---|

    | **Create** | Produce something new | Design, forecast, reorganize, construct,
    conjecture, develop, author, investigate |

    | **Evaluate** | Justify a stand or decision | Argue, defend, select, support,
    value, critique, weigh, estimate, classify, assess, check, appraise |

    | **Analyse** | Connect ideas or break them down. | Organize, relate, inspect,
    investigate, compare, distinguish, experiment, question, test, examine |

    | **Apply** | Use information in new situations | Execute, compare, implement,
    solve, use, demonstrate, interpret, operate, schedule, sketch |

    | **Understand** | Explain ideas or basic concepts | Classify, describe, discuss,
    explain, identify, locate, recognize, report, select, translate |

    | **Remember** | Recall facts and basic concepts | Define, duplicate, list, memorize,
    label, locate, repeat, state |'
  merge: -1
  img_proc: true
- pgno: 37
