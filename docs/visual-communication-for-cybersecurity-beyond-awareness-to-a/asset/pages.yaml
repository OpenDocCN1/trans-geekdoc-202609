- pgno: 75
  md: '# 13. Visualizing hierarchy


    Hierarchy is typically visualized in tree diagrams. A tree can be used to display
    textual information as well as numerical data. Some examples of situations where
    a tree visualization is helpful are:


    +   - To display a taxonomy

    +   - To show family relations and descent

    +   - To show decision-making options

    +   - To calculate probabilities

    +   - To show an organizational structure


    There are many forms to display a tree. The basic shapes are horizontal or vertical
    trees, rectangular tree maps, circular tree maps, and radial trees.


    | | | | |

    |---|---|---|---|

    | | | | |

    | Tree map | Tree diagram | Circular tree map | Sun burst |


    Visualization of data in tree diagrams is one of the simplest forms of presenting
    data. Many examples of these types of hierarchy visualisations can be found in
    academic literature and within a business context. Some references to examples
    are:


    > **Tree map**: tree map of vulnerability categories¹²³, tree map of trojan families¹²⁴(p12)

    > **Circular tree map**: status of tokens and services across subnets¹²⁵, active
    nodes in software-defined networking¹²⁶

    > **Fault tree/attack tree diagrams**: CORAS model for risk analysis¹²⁷, sensor
    cloud framework risk assessment¹²⁸, CVSS attack graphs¹²⁹

    > **Sunburst**: Mitre ATT&CK framework¹³⁰

    > **Multi-directional tree**: patterns of breaches¹³¹, attack reactability¹³⁰'
  merge: -1
  img_proc: true
