- pgno: 15
  md: '# 1. Image and stereotypes


    Should you search online for cybersecurity, images appear of men in hoodies looking
    at a computer screen. The news stories and videos that you will find speak mainly
    about cybercrime and warfare. This leads to the public perception that cybersecurity
    is only about hacking, war, and men wearing hoodies. The image is a disadvantage
    to the engagement with a broader public and the attraction of a more diverse workforce.
    The public image suggests that cybersecurity is predominantly male and technical
    and it does not represent the other disciplines that are working together to resolve
    complex cybersecurity challenges. This is not only a problem to get the public
    interested and involved in the risks of their online behaviour but also in filling
    the millions of open cybersecurity positions worldwide. Some predictions state
    that this number might go up to 3.5 million by 2021¹. Apart from the public image,
    the field also suffers from the image within organisations. The cybersecurity
    department is seen as the department that says ‘no’ to everything the business
    needs and is always checking and spying on colleagues. Cybersecurity colleagues
    are perceived as ‘nosy’ and hold up projects with their checklists and requirements.
    Finally, classic military metaphors that are sometimes used in publications to
    convince decision-makers ‘trigger very specific images in our heads’² leading
    to wrong beliefs.


    > Cybersecurity protects much more than computers and it involves much more than
    only computer science.


    Cybersecurity is a multi-disciplinary team effort. It is an entire ecosystem not
    only protecting the confidentiality, integrity, and availability of data, but
    it also aims to protect our democratic values and even human rights. Knowledge
    of psychology, behaviour, politics, legislation, and management is just as important
    as coding, threat hunting, and encryption. Required skills vary from academic
    to vocational skills in mathematics, computing, law, engineering, social sciences,
    and politics to protect our economy and our society. Moving away from the image
    of the hoody to more diverse stereotypes will make it easier to attract a more
    diverse workforce. Many tasks can be learned on the job and self-starters with
    skills such as analytical thinking, creativity, communication skills, and complex
    problem solving can have great careers in cybersecurity.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# Cybersecurity professionals need to change the way they present themselves.


    The public stereotype image is partly influenced by movies and news stories. Cybersecurity
    experts can use the same media to influence the public stereotype towards a more
    realistic image. Cybersecurity is not ‘scary, confusing, and dull’. Cybersecurity
    experts are not there to say ‘no’ to new business initiatives. To overcome the
    misconceptions about cybersecurity, we need to establish trust with our audience
    and employ engaging communication techniques. Cybersecurity is the field that
    makes new opportunities happen.


    ![](img/7ffc38f932cabd3a29392ff94c7e70f0_16_0.png)


    Figure 1 An internet search on ‘cybersecurity’ will show you pictures similar
    to this theme: a person in a hoody or wearing a mask with one or more screens
    in a dark, gloomy setting.'
