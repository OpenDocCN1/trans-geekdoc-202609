- pgno: 153
  md: '# A final note


    ![](img/7ffc38f932cabd3a29392ff94c7e70f0_153_0.png)


    I started this book with a call for change. The image of cybersecurity can do
    with a positive change: we need more people in our profession, we need collaboration
    with other disciplines, and we should stop treating computer users as the enemy.
    By pointing out to you the relevant communication theory and models, I hope that
    you can find some anchors towards understanding how your audience thinks and behaves
    in their environment. I am grateful to the people I met throughout the process
    of creating this book and I cannot thank them enough for going to great lengths
    to help me collecting the images.


    Hopefully you''ll find the examples in the book inspirational and perhaps you
    will send me more examples and case studies to include in future work. Please
    create more visuals, share them, and enjoy. Cybersecurity is cool. Show it to
    the world!'
  merge: -1
