    refers to the degree to which a person has a positive or negative evaluation of
    the behaviour. Norms refer to subjective and social norms, for instance, the individual’s
    perception about a behaviour is influenced by the judgement of parents, friends,
    teachers, and so on. Perceived behavioural'
