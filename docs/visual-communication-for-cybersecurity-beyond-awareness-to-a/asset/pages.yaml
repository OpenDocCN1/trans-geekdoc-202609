- pgno: 25
  md: '# # 4. The way forward


    The aforementioned communication problems have resulted in a large disconnect
    between cybersecurity professionals and their stakeholders. Cybersecurity is an
    exciting field but has a hard time shaking off a misplaced reputation. Visual
    communication is one of many other tools that can be used to improve this disconnect.


    Some may think that visual communication only means drawing pictures. They may
    say that drawing is frivolous and unprofessional and that it is something that
    only ‘creative types’ do. However, visual communication is not about drawing pictures,
    it is about applying meaningful visual tools. Those tools can also be stories,
    as stories help the audience to visualize a mental picture. Other tools are the
    use of colour, typography, and text size option to visually structure information.
    It helps us in many ways:


    +   - It orders our thoughts.

    +   - It helps to recall information.

    +   - It increases insight in patterns.

    +   - It helps to see the big picture.

    +   - It supports decisions.

    +   - It communicates information.

    +   - It generates new ideas and inspires.

    +   - It makes a subject approachable.

    +   - It provides for a relaxing means to find focus.


    Visual communication is one of the components that form visual literacy and is
    inherent to design thinking.


    # ## 4.1 Visual literacy


    Visual literacy is the ability to read, comprehend, create, and use, and the insight
    to plan visual language. It is grounded concepts such as visual perception, visual
    language, visual learning, visual thinking, and visual communication²⁶. It is
    a topic of study and discussion in different fields amongst which are librarians,
    designers, computer experts, educators, and biologists. In recent years, with
    the growing use of social media and multi-sensory devices, visual communication
    is finding a place in education and businesses. It is an interdisciplinary and
    multi-dimensional area of knowledge and skills that involve cognitive functions
    such as critical viewing and thinking, visualizing, deduction, reasoning, and
    construction of meaning. Unfortunately, it is hardly'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'included in the curriculum of cybersecurity education. This is a big gap in
    the development of the profession since its inclusion develops skills such as
    problem solving and collaboration. Cybersecurity professionals need to learn how
    to use engaging communication techniques, such as showing enthusiasm and making
    security relatable³.


    ![](img/7ffc38f932cabd3a29392ff94c7e70f0_26_0.png)


    # Centre for teaching quality


    Common Core: Paths to 21st-century success²⁷ Copyright: permission to print from
