    The structure of the organization is an important factor for cybersecurity communication.
    Mintberg⁵⁹ described five main parts of an organizational structure, and the most
    dominant of these parts defines what type of organization it is. The basic five
    parts are:


    +   1. At the strategic top, we find top management and its support staff.

    +   2. At the bottom of the organizations is the operative core, the workers who
