- pgno: 17
  md: '# 2. Awareness campaigns:

    disconnected and astray


    Security awareness is a compliance requirement that organizations need to meet
    for information security related standards and regulations such as ISO 27001,
    CobiT, PCI DSS, GDPR, HIPAA, and many more⁴. The majority of these standards and
    regulations explicitly require organizations to implement a communication and
    awareness programme for employees and contractors on how to protect valuable information.
    It has led to a lucrative market for businesses selling awareness training, posters,
    educational games, campaigns, and so on.


    The Oxford dictionary⁵ defines awareness as:

    1. Knowledge or perception of a situation or fact.

    ‘we need to raise public awareness of the issue’

    ‘there is a lack of awareness of the risks’

    2. Concern about and well-informed interest in a particular situation or development.

    ‘a growing environmental awareness’

    ‘his political awareness developed’


    Following the Oxford definition, security awareness is a synonym to knowledge
    and consciousness. There exists no significant relationship between knowledge
    and secure behaviour⁶⁻⁸. Still, many cybersecurity professionals state that humans
    are the weakest link in security and that they should be trained to change their
    behaviour. Organizations that plan regular awareness activities such as e-learning,
    fake-phishing emails, or posters follow the requirements of the standards and
    regulations, and with that they satisfy the compliance auditors with evidence
    of activities to ‘improve knowledge and concern’. However, if awareness programmes
    are treated as tick-box exercises, they do not always lead to the desired behaviour⁸
    and neither does ‘scaring, tricking, and bullying users into secure behaviors’⁹.


    > Knowledge of security risks and solutions do not always lead to people actually
    using those solutions.


    When communication is approached as a compliance or policing exercise, the employees
    in the organization will continue to see cybersecurity as a nec-'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'essary evil. Auditors are not the only audience that cybersecurity needs to
    satisfy. The real judges of our work are the people that work with valuable information,
    such as salespeople, information technology (IT) staff, managers, or human resources
    staff. Unfortunately, this audience does not seem to like cybersecurity professionals.
    A survey amongst IT security leaders at 200 organizations in the UK and Germany
    showed that 84% felt negativity towards their cybersecurity teams from within
    their organization¹⁰. One-third even felt that they are being viewed as ‘doom
    mongers’. This negative attitude holds back collaboration and cybersecurity innovation.


    To create a more secure workplace, people do not only need to know and be concerned
    about security, they have to start acting according to that consciousness. In
    marketing models, awareness is just a first step in the process that leads to
    the point where customers actually perform an action (buying the product). In
    parallel to cybersecurity, awareness is only the first step in the process to
    actually change the behaviour. When we have a security solution, awareness is
    only the stage with advertisements and campaigns to attract attention. In this
    context, security awareness can never be the goal. It is only a first step in
    a longer journey.


    # Awareness is not the end goal, it is only the beginning.


    We need to aim higher. Modern marketing models are no longer satisfied with customers
    that have bought a product. The stage after that is where customers act as brand
    advocates and recommend the product to their friends. When we apply this to cybersecurity,
    we should not treat our co-workers as the weakest link. These people are potential
    advocates of security. Friends and social processes influence security behaviour
    more than any other strategy. People change through triggers such as conversations
    with peer about new threats and by observing how others use a security feature¹¹⁻¹⁴.
    People need to be able to make informed choices in the way they use their computers
    and share data, to help each other with clear instructions on how to act secure,
    to make security a routine in their cyber activities, and to have them looking
    after their peers as advocates of cybersecure behaviour. This starts with trust
    in cybersecurity professionals and by involving end-users in the design of secure
    solutions.'
  merge: -1
  img_proc: true
