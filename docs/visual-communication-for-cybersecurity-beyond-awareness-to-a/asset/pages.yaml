    # 10.3 Semiotics


    Semiotics is the study of signs and signification. Signs represent objects that
    are not physically there. A sign can be a word, an image, a performance, a multimedia
    production, a building, or even a trend. Also sounds, fashion, and traffic signals
    could be signs. Signification is the process of creating meaning to a sign. Signification
    is related to the way a sign is encoded, transmitted, and decoded. For people
    to understand the meaning of a sign, they must be able to encode and decode it.
    The decision that a word, colour, or symbol is a code for something is made by
    the social group (culture), as they agree on the meaning of it. Take, for example,
    some specialised vocabularies (work, office, and sports), various kinds of slang,
    street art, or the use of emojis. We only know what the words or symbols used
    there mean if we belong to the group and learn using one of these kinds and styles
    of language. Semiotics is a learned and a shared conceptual connection in all
    uses of signs (language as well as visual).


    There are mainly three types of signs: (1) an icon, which resembles its referent
    (such as a road sign for falling rocks or pictograms); (2) an index, which is
    associated with its referent (as smoke is a sign of fire, a fingerprint relates
    to a person); and (3) a symbol, which is related to its referent only by convention
    (as with words or logos). A symbolic relation between an object and a sign is
    more abstract and can only be learned through learning the cultural codes in a
    society.


