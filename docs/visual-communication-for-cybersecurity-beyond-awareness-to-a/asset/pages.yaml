- pgno: 131
  md: '# 19. Infographics


    Infographics show both quantitative data (statistics) and qualitative data (knowledge).
    This causes some discussion around the exact definition of an infographic. Some
    state that an infographic is a larger graphic design that combines data visualizations,
    illustrations, text, and images together into a format that tells a complete story
    197,198. An infographic in this perspective is a story with a header, a middle,
    and a conclusion or call to action. A single data visualization by itself is not
    an infographic. Neither is a number or percentage with a picture next to it. Others
    state that there are many different forms of infographics possible, ranging from
    an infographic resume to informational infographics with mostly text. In such
    a production, the ‘data’ can be text and as long as its function is clear it counts
    as an infographic.


    An infographic can be an effective means to inform, to convince, to tell a story,
    or to show an analysis. As long as your audience connects with the infographic,
    it does not really matter if the design is ‘correct’. For that purpose, it is
    important to test your design on your audience to see if they respond to it as
    you would expect. Do they understand the message, do they feel it, learn something,
    or are they compelled into doing something? Learn from their feedback and improve
    the design. The purpose is to make meaningful infographics. Well-designed infographics
    are easier for many readers to process cognitively than text-only documents. When
    published online, they are easy to share within social networks and have the potential
    to go viral.


    The aim of an infographic can be:


    +   - **To instruct:** an infographic helps to explain how to do something or
    how to use a product.

    +   - **To inform:** it can be used to present research results or to raise awareness
    for a certain topic.

    +   - **To persuade:** use an infographic as a call to action, to invite people
    to join, buy, or change something.

    +   - **To tell a story:** an infographic can tell the story through a timeline
    of events or actions; what happened to someone, how they did it.

    +   - **To analyse:** to demonstrate the root cause of an event, to deduct a sequence
    of events, and to show it happened.

    +   - **To compare two things:** when comparing two products, best practices,
    or events over the past two years.


    Over the years I have collected many examples of infographics on Pinterest. I
    invite you to join me and grow this collection together:

    https://www.pinterest.co.uk/nicole9319/information-security-infographics/.'
  merge: -1
  img_proc: true
