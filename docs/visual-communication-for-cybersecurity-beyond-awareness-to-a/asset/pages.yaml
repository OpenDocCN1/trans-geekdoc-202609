  md: '![](img/7ffc38f932cabd3a29392ff94c7e70f0_98_0.png)


    # 10 steps to cyber security


    National Cyber Security Centre, UK^148

    Copyright: Open government licence v 3.0


    The aim of this infographic is to explain the central focus points of a cybersecurity
    strategy. The dominant part is the middle figure, a circular process that is continuously
    moving clockwise.


    # 10 Steps to Cyber Security


    Defining and communicating your Board''s Information Risk Regime is central to
    your organisation''s overall cyber security strategy. The National Cyber Security
    Centre''s 10 steps are summarised below, in order to protect your business against
    the majority of cyber attacks.


    **Network Security**

    Protect your networks from attack. Defend the network perimeter, filter out unauthorised
    access and malicious content. Monitor and test security controls.


    **User education and awareness**

    Produce user security policies covering acceptable and secure use of your systems.
    Include staff training as part of any induction process. Maintain user awareness
    of cyber risks.


    **Malware prevention**

    Produce relevant policies. Establish anti-malware defences across your organisation.


    **Removable media controls**

    Produce a policy to control all access to removable media. Limit media types and
    use. Scan all media for malware before importing onto the corporate system.


    **Secure configuration**

    Apply security patches and ensure secure configuration of all systems is maintained.
    Create a system inventory and define a baseline build for all devices.


    # Set up your Risk Management Regime


    Assess the risks to your organisation''s information and systems with a focus
    on achieving an appropriate and achievable level of security risk. Embed an appropriate
    management regime, supported by the Board and senior managers.


    Make cyber risk a priority for your Board

    Produce supporting risk management policies

    Determine your risk appetite


    **Managing user privileges**

    Establish effective management processes and limit the number of privileged accounts.
    Manage user activity. Control access to activity and audit logs.


    **Incident management**

    Establish an incident response and disaster recovery capability. Produce and test
    your incident management plans. Provide specialist training. Report criminal incidents
    to law enforcement.


    **Monitoring**

    Establish a monitoring strategy and produce supporting policies. Continuously
    monitor all systems and networks. Analyse logs for unusual activity that could
    indicate an attack.


    **Home and mobile working**

    Develop a mobile working policy and train users to adhere to it. Apply secure
    baseline build to all devices. Protect data both in transit and at rest.


    For more information go to www.ncsc.gov.uk @ncsc'
  merge: -1
  img_proc: true
- pgno: 99
  md: '# # 15. Visualizing whole, loose, and connected concepts


    In some situations, you want to explain related concepts that do not involve a
    hierarchy or movement. For example, when things exist in parallel or next to each
    other. In those situations, you can use simple shapes as circles and rectangles.
    By making them bigger or smaller, you can express importance, where the shapes
    cross is an overlap, and how they are connected signifies a relationship.


    | Bubbles | Venn diagram | Concentric diagram (onion) |

    |---|---|---|

    | Radar | Periodic table | Geographical map |

    | Matrix | Chord chart | Sphere |

    | Parallel coordinates | Network | Arc diagram |'
  merge: -1
  img_proc: true
