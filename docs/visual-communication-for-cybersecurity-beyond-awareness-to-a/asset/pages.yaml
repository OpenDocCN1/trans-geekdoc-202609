    # 10.4 Personal branding


    Personal branding is a marketing strategy that a person adopts in order to promote
    his or her major personal characteristics. Personal branding is common amongst
    politicians, actors, manager, scientists, and entrepreneurs. With social media,
    everyone can be a broadcaster and can create a personal brand. Personal branding
    became popular in the late 1990s under the influence of business articles, such
    as The Brand Called You by Tom Peters in 1997 and Managing Oneself by Peter Drucker
    in 1999. The discourse sees mainly publications in the form of self-help books
    and career advice and is often criticized by academia as a fantasy. Some state
    that personal branding sells hope instead of the person: ''the hope of standing
    out, the hope of being acknowledged, feeling unique and worthy of attention and
    most of all, the hope of finding meaning''¹¹⁵⁹⁶. Academic papers that discuss
    personal branding sprout mainly from the fields of sociology¹¹⁶ and marketing¹¹⁵.


