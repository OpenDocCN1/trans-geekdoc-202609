- pgno: 143
  md: '# 22. Activity 1: Stakeholder map


    # Assignment


    You are a cybersecurity professional who sees the advantages of visual communication.
    You are not great at drawing pictures or at explaining complex topics. You have
    no budget of your own and your manager is only interested in getting the work
    done without any frills. She says that visuals do not fit into the company culture.
    You think that you are not able to explain the advantage of visual communication
    good enough to persuade your manager to send you on a visual design training course
    or to hire a visual facilitator.


    Remembering the sections from this book about stakeholders, advocates, and how
    people are more likely to be persuaded if their peer groups recommend it, you
    decide to find stakeholders that have the power to influence your goal. Even if
    these people do not have any formal relation to your work, they may influence
    the success of your mission. A stakeholder map will help you to get insight into
    all people that are interested in visual communication and all people that formally
    and informally influence your goal.


    # Step 1: Understanding


    If you know some co-workers who are also interested in getting more visual, invite
    them to collaborate with you. Together you can achieve more. The first challenge
    is to identify all relevant stakeholders and how they may benefit from visual
    communication.


    With your team, you can think of all the work that you are doing and with whom
    you are related. Creating a stakeholder map is like creating a map of your own
    environment and the people that you know. Some questions you could ask are:


    +   1. Who gives you budget?

    +   2. Where does your work come from?

    +   3. With whom do you need to cooperate?

    +   4. Who thinks they are involved (but are not)?'
  merge: -1
  img_proc: true
- pgno: 144
  md: '+   5. Who are involved (but does not act on it)?

    +   6. Who are the people that you need to explain complex topic to?

    +   7. Who may have the resources that you need?

    +   8. Who are the external groups that can help you?

    +   9. Who is really good at visual communication?


    The list will give an overview of whom to speak to next. You could ask them what
    they think about visual communication and how it will help them in their work.
    Do they experience any problems with the communication with the cybersecurity
    team? Get to know them to find out how they think that visual communication could
    help them (after all, you do not want this for yourself, but you want it for others
    so that they get a better understanding of cybersecurity). Speak to people who
    are already very visual, even if they are in a completely different line of work.
    Ask them how they convinced their management. What are the advantages that they
    experience?


    # Step 2: Define the goal


    Decide how you will use your stakeholder map. Will you use it to explain to your
    management how complex your environment is to communicate with? Will you keep
    it to yourself as a map towards influencing ‘difficult’ stakeholders? Will it
    be a map supported with data to prove how many stakeholders are with you in this
    topic? Who will be looking at the map? What other goals could you use it for?


    In general, there are three essential goals in stakeholder mapping:


    +   1. Identifying the key stakeholders and their interests (positive or negative)
    in your goal

    +   2. Assessing the influence and importance of each stakeholder

    +   3. Identifying how best to engage them


    ![](img/7ffc38f932cabd3a29392ff94c7e70f0_144_0.png)'
  merge: -1
  img_proc: true
- pgno: 145
  md: '# Steps 3 and 4: Ideas and prototypes


    As steps 3 and 4 are closely related, it makes sense to combine them in this case.
    With your team, you can start organizing your list of stakeholders. There are
    different options thinkable:


    +   - Formal versus informal stakeholders

    +   - Internal versus external to the organization

    +   - Individuals versus groups

    +   - Visible (in your team) versus invisible (contributors such as support teams)

    +   - Stakeholders of your stakeholders

    +   - Influencers versus followers


    The result may look like a mind map, spider''s web, or network diagram showing
    who is related to who. For instance, suppose you know a person who is a gifted
    storyteller and always uses that technique in presentations. You are not connected
    to that person through work and have never met her in person. You can still add
    this person to your map as an important champion of your goal. If you find out
    who knows her and how you are connected to these people, they may be able to introduce
    you. This person may be able to help you influence the people that you need to
    engage. You can advance the diagram or mind map by adding emoticons, arrows, boundaries,
    or colours to indicate good/bad relationships, influences, power, and so on.


    You could start with a template as below and make changes as you go. Maybe you
    will invent your own type of map after organizing your stakeholders in different
    groups and relationship types.


    ![](img/7ffc38f932cabd3a29392ff94c7e70f0_145_0.png)'
  merge: -1
  img_proc: true
- pgno: 146
  md: 'The next step is to plan the communication strategy for each stakeholder. It
    may help to first organize your stakeholders in a power grid. The grid has four
    quadrants:


    ![](img/7ffc38f932cabd3a29392ff94c7e70f0_146_0.png)


    # Key players, champions (top right)


    This is where to really focus your efforts. These are the people who have the
    power to support your idea and are interested in visual communication. Invest
    time to get to know these stakeholders. Find out what matters to them. Keep proactive
    and collaborative relationships with them. Explain to them what you want to achieve
    and how you all will benefit from it. These people might have the influence to
    demonstrate your management the need to invest in visual communication. Give them
    this book, they may pass it on to their peers in the next group: the barriers.


    # Barriers: Keep satisfied (top left)


    These are the second priority group. They have influence on your goal but less
    interest in the results. Keep your communication to them brief and to the point.
    Consult them: their opinion matters and they have the power to help you to be
    successful. It is also worth to invest time in building relationships with the
    people who influence these stakeholders.


    # Advocate: Keep informed (bottom right)


    These are less important than the two groups above, but they are interested in
    visual communication. This group is a potential group of advocates. Share visual
    messages such as infographics and videos with them. With their'
  merge: -1
  img_proc: true
- pgno: 147
  md: 'enthusiasm, they are likely to send them on to their peers who will send it
    on and on. One day, those messages might just reach your most powerful stakeholders.


    Bystander: Minimal effort (bottom left)


    These are the least important stakeholders for your mission right now. Do not
    waste too much time on them on this topic.


    It is easy to draw a power grid, just two lines will do the trick.


    ![](img/7ffc38f932cabd3a29392ff94c7e70f0_147_0.png)


    # Step 5: Test and improve


    Engage with your stakeholders as you planned in the previous steps. Evaluate on
    a regular basis whether your map is still correct and whether your approach is
    working. New stakeholders may appear. Some may change roles and lose power or
    interest.


    Do not give up and above all present visually!'
  merge: -1
  img_proc: true
- pgno: 148
  md: '# # 23. Activity 2: Visual dictionary


    # ## Assignment


    Imagine you have just finished your stakeholder map and during the time that you
    created it, you have met a lot of people who are enthusiastic about visual communication.
    Your manager is still not convinced. You decide that an example is necessary to
    support your case. The example you choose is a visual dictionary. Defining and
    visualizing your cybersecurity abbreviations and jargon is a good topic to start
    with. Cybersecurity experts use a variety of taxonomies and dictionaries. Different
    security dictionaries give different definitions to the same jargon. To support
    a shared language in your organization, you should choose one of those dictionaries
    and use it consistently. It is a good exercise if you decide to create your own
    dictionary. It is even better if you create it as a team building exercise, and
    it is a relatively easy topic to start with. Creating a shared language is important
    to engage with audiences outside the cybersecurity team and also for collaboration
    amongst your team of cybersecurity experts.


    A dictionary can be supported with icons and symbols. They are so powerful because
    they


    +   - Work anywhere. A well-designed icon has the potential for communicating
    across language barriers.

    +   - Cut through the clutter. Between all the words in print and online, an icon
    stands out to help readers navigate, guiding them to various kinds of content.

    +   - Create recall. Some organizations use icons to represent key information,
    like company values. Icons or symbols serve as ‘handles’ that employees can grasp
    when trying to recall information.

    +   - Invite interaction. Icons on websites draw attention and invite the visitor
    to look for more information.'
  merge: -1
  img_proc: true
- pgno: 149
  md: '# # Step 1: Understanding and empathizing


    Call in your team. Which cybersecurity terms and abbreviations do you use?

    Does everybody know how to explain what these words mean? Together, make

    a list of jargon used in cybersecurity documents and presentation slides. What

    are the words that the experts threw at the people outside the team?


    With this list, go and interview some people outside the security depart-

    ment. Have they ever heard these words? Do they know what they mean?

    Are these words relevant for their job? Where would they go to find out the

    meaning of a word they do not know? How much understanding of cybersecu-

    rity concepts do they have? You can organize your findings in a list, in a 2 ×
    2

    matrix, or write each finding on a post-it and stick it on the wall.


    | **Going well:** | **Could be better:** |

    |---|---|

    | Jargon easy to explain

    and well understood | Jargon difficult to explain

    and hardly understood |

    | **What goes wrong:** | **Miracles:** |

    | Jargon easy to explain

    and wrongly understood | Jargon difficult to explain

    and well understood |


    # # Step 2: Define the goal


    Define the goal of your visual dictionary. Will it be used for reference only
    or

    will it be used as a part of cybersecurity training? Is it for internal use only

    or will you publish it to third parties as well? Will it be presented in an app
    or

    online to explain privacy and security settings? Multiple goals might involve

    multiple types of audiences that, in turn, may require different communica-

    tion styles and channels.


    ![](img/7ffc38f932cabd3a29392ff94c7e70f0_149_0.png)'
  merge: -1
  img_proc: true
- pgno: 150
  md: "# Step 3: Let your ideas out!\n\nInvite your team again and this time also\
    \ invite representatives of your potential audience. Make sure you prepare the\
    \ room. There must be enough space to walk around a little and to stick pictures\
    \ to a wall. You will need paper, markers, sticky notes, tape, scissors, and so\
    \ on.\n\nTogether, think about possible options for the dictionary. What style\
    \ of language will work? Formal or informal? Should you just give a definition\
    \ or does the audience appreciate examples as well?\n\n![](img/7ffc38f932cabd3a29392ff94c7e70f0_150_0.png)\n\
    \nAdopt a beginner's mindset. Start sketching with pen and paper. Make a list\
    \ of definitions and start drawing icons. It may be difficult in the beginning:\
    \ visual thinking is like muscle: it needs warming-up. If you can find inspiration\
    \ in existing definitions and icons in other dictionaries, it is alright to copy\
    \ them for the moment. At this point, it does not matter; they are likely to change\
    \ or be dropped during the process (if not: check the copyright and pay the licence\
    \ if necessary). You can find inspiration in icon libraries such as ²¹⁸,²¹⁹.\n\
    \n+   Here is a list of useful books that will help you to get started with drawing:\n\
    +   \n+   Dan Roam. Show and Tell. Penguin, 2014 ²²⁰\n+   Sunni Brown. The Doodle\
    \ Revolution. Penguin, 2014³¹\n+   Willemien Brand. Visual Thinking. BIS Publishers,\
    \ 2017²²¹"
  merge: -1
  img_proc: true
- pgno: 151
  md: '![](img/7ffc38f932cabd3a29392ff94c7e70f0_151_0.png)


    Working on an icon library for secure software development.


    Photo: author''s private collection.


    # # Step 4 and Step 5: Prototype and test


    Cut out your team''s doodles and pictures and start organizing them on a paper
    next to the definitions of the jargon. This creates a prototype of your visual
    library. You can test the dictionary on different people in your organization.
    What is their opinion? Do they understand the icons and the definitions? You could
    maybe re-visit the people that you met during Step 1 and ask them what they think.
    With this feedback, you can improve your dictionary.


    When your team is happy with the results, it is time to go digital. You can re-draw
    your icons yourself with your tool of preference.


    It is important to publish your dictionary for everybody to find. And use it consistently:
    use your icons in your documents, presentations, and on your webpages. The more
    you use them, the more feedback you will receive. If they are not clear, get outdated,
    or become a topic of discussion: go back to Step 1. Change them. Improve where
    necessary. Remove words that you do not use any more and add new ones that have
    become important over time.


    The more you use the icons, the more people start recognizing cybersecurity messages.
    You may win over a few new stakeholders. Use the positive reactions in discussions
    with your manager. Maybe the positive response will finally convince her that
    visual communication helps to engage other people with cybersecurity.'
  merge: -1
  img_proc: true
