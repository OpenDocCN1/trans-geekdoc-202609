  md: '# ## 8.4 Stakeholder theory


    Although more than 55 definitions of the word stakeholder exist<sup>71</sup>,
    in general, stakeholders are seen as the individuals, groups, or organizations
    who can affect or can be affected by a decision, activity, or outcome of a project,
    programme, portfolio, or the activities of an organization. Stakeholders exist
    inside and outside of the organization. They are vital for the success or failure
    of a project, mission, or strategy, and therefore they should be ‘managed’. Stakeholder
    theory states that you cannot look at stakeholders in isolation, each is important
    for a business to be successful. Figuring out whether their interests go into
    the same directions is important for success. If you focus on just one group of
    stakeholders, you miss things; all of them are needed to create success<sup>72</sup>.
    Many books and academic papers have been written about stakeholder management
    since the 1990s. They come from different perspectives, including law, marketing,
    finance, ecology, and industrial relations.


    Stakeholder analysis (SA) aims at analysing their relative power and interest,
    the importance and influence they have, what ‘hats’ they may wear, and to what
    networks they belong<sup>73</sup>. For successful engagement, it is necessary
    to know their stake in the outcomes of your project or strategy. A common tool
    for SA is a matrix, in which stakeholder groups appear on one axis and a list
    of criteria or attributes appears on the others. For each overlapping area, a
    qualitative description or quantitative rating is given. The aim is to gain insight
    into their position and possible influence on some envisioned end-result; a project
    goal, conflict solving, organizational change, and so on. A second option for
    analysing stakeholders is to examine their degree of synergy against their level
    of antagonism<sup>74</sup>. People with low synergy and moderate antagonism are
    your opponents; those with high synergy and low antagonism are your unthinking
    supporters.


    Designing a visual aid such as a matrix or stakeholder map during SA helps to
    understand which stakeholders are the most important. Bourne<sup>75</sup> suggests
    that some of the dimensions in the picture to be considered include:


    +   - **Attitude:** Will the person help or hinder the work?

    +   - **Hierarchy:** Where is the person in the organization’s structure compared
    to the activity manager: higher/lower, internal/external, colleague or competitor?

    +   - **Influence:** How well connected is the person?

    +   - **Interest:** Does the person have an active interest, passive interest,
    or no interest?

    +   - **Legitimacy:** Does the person have some level of entitlement to be consulted?

    +   - **Power:** What is the person’s ability to cause change?

    +   - **Proximity:** How involved is the person in the work?

    +   - **Receptiveness:** How easy is it to communicate with this person?'
  merge: -1
  img_proc: true
