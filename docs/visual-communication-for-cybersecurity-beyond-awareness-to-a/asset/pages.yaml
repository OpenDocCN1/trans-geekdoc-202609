  md: 'The principles can be used to improve the composition in a presentation or
    on the design of a poster, a warning message, website, or infographics. Being
    aware of and implementing the principles of Gestalt theory can have the effect
    of making visualizations feel stronger and more coherent.


    Gestalt can also be applied to data visualization. Data visualizations for cybersercurity
    are often created for IT experts and analysts (e.g. for their work with log files,
