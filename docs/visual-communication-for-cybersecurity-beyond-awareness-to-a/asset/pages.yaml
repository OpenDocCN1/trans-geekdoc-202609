- pgno: 141
  md: '# 21. Introduction


    Cybersecurity is an exciting field to work in and offers many career paths for
    people from different disciplines. Professionals working in cybersecurity have
    many complex problems to solve and, therefore, they need to collaborate amongst
    each other and with professionals from other fields. This means that they have
    to be able to translate technical concepts and jargon into a language that their
    colleagues and audience understand.


    Visual communication is a tool that will help to advance the cybersecurity field
    in many ways:


    +   - It improves collaboration.

    +   - It helps to explain complex topics.

    +   - It makes cybersecurity understandable.

    +   - It radiates enthusiasm.

    +   - It invites to share stories.

    +   - It engages end-users.


    With improved communication, cybersecurity professionals will be able to design
    better security products and services in multi-disciplinary teams. Visual tools
    are fun to share with others. When we share our visual stories, we all become
    advocates of cybersecurity. If we are enthusiastic, others will follow.


    Unfortunately, enthusiasm alone will not give you the budget to go on a visual
    design course, hire visual facilitators, or to employ professional designers.
    You will have to make the right stakeholders enthusiastic as well, so that they
    will spread this enthusiasm and help others to get the right mindset for visual
    communication.


    The first activity in this workbook, drawing a stakeholder map, is a practise
    in visualization as well as an assignment to work with stakeholders that can help
    you to achieve support for visual communication in your organization.


    The second activity, a visual dictionary, will help you to start using simple
    visuals in your communication as well as achieving a shared language in your organization.


    The steps in each activity are based on the concepts of design thinking. The steps
    are not necessarily chronological: they can occur in parallel and can be repeated
    iteratively. Our work environment is dynamic, the circumstances change continuously,
    and we need to always be ready to learn, listen, and improve our visual tools.'
  merge: -1
  img_proc: true
