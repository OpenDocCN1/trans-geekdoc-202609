  md: '# 4.2 Design thinking


    Design thinking is an iterative process in which we seek to understand the people
    for whom we are designing the products or services. The process helps us to develop
    empathy with the intended users. The engineering behind computers is beyond comprehension
    to a large proportion of mankind. Fortunately, most people do not need to know
    all of the technical details. However, they should be engaged with the design
    of new solutions and be ready to accept changes to existing systems. They also
    need to be able to reproduce new instructions to others. With some practice, specialists
    should all be able to communicate complex topics to end-users and to encourage
    them to tell it on. Most problems and incidents in cybersecurity are caused by
    human behaviour and not all risks can be controlled through technology. Design
    thinking is an approach to design security products and services in collaboration
    with multiple disciplines and end-users from the beginning. Cybersecurity education
    currently teach little about user centric design although there are rare initiatives
    to change this35. Engineering studies focus on system development, developers
    learn about coding and business students learn about risk management. Design thinking
    is most likely to be of interest to cybersecurity professionals with a background
    in software engineering: design thinking is the foundation of several software
    development methods. However, design thinking is not only suitable for the development
    of software or human–computer interfaces but can also be applied to the development
    of corporate policies, procedures, and training programmes. It also applies to
    the design of visual aids in communication processes. Design thinking by its nature
    is a very visual process, supported by visual tools and techniques such as brainstorming,
    sketching, prototyping, experimenting, and testing. It helps to design usable
    security.


    > Design thinking provides the processes to create visual communication and better
    security solutions.


    Security by design means that the development process for security products (these
    could be hardware, software, as well as the accompanying procedures) aims to make
    systems as secure as possible from the beginning of the design process and continues
    to test and improve security controls throughout the design cycles. Design thinking
    is a process in five stages36: empathize, define, ideate, prototype, and test.
    The stages are not sequential: the process is iterative in nature. Design thinking
    assumes that you may not reach your final solution in one go but that you take
    more experimental approaches to prove ideas early on and then adjust based on
    user feedback. The user takes central stage: they help to seamlessly blend cybersecurity
    controls into their'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'environment, instead of cybersecurity experts wishing that users would just
    follow technically perfect security controls that they impose on them.


    Design thinkers have a few distinctive qualities such as empathy, optimism, integrative
    thinking, experimentation, and collaboration. These qualities support the way
    forward to design better solutions. In this light, designers can be seen as problem
    solvers. Cybersecurity problems are often wicked: they are ambiguous problems:


    +   - A solution that works today might not work in the future.

    +   - A security control that works in one organisation might not work in another
    organisation.

    +   - Most cybersecurity solutions require a lot of people to change their mindsets
    and behaviour.

    +   - Some security problems are symptoms of other problems.

    +   - New threats are often novel and unique.

    +   - There is not enough time.

    +   - The problem is never solved definitively (100% security does not exist).


    Wicked problems can’t be “fixed”. Approaches should be focused on how to best
    mitigate their immediate impact. Finally, wicked problems require an interdisciplinary
    approach with an understanding that no quick result will be forthcoming. Addressing
    wicked problems is time-consuming and iterative, requiring long-term dedication³⁷.
    This is one of the reasons that design thinking as a problem-solving method seems
    promising for the cybersecurity field.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# 5. Conclusion


    It may seem ambitious to write a book that combines two fields that are fuzzy,
    widely misunderstood, multi-disciplinary, as well as multi-dimensional. At the
    same time, cybersecurity and visual literacy have in common that they require
    similar cognitive functions such as critical thinking, visualizing, deduction,
    complex problem solving, and reasoning. Cybersecurity professionals are likely
    to possess the skills required for visual communication but lack the training
    to confidently use it. Cybersecurity suffers from communication problems such
    as the absence of a common langue and an obscure image. This is impeding the progress
    of the field and obstructs the path from security awareness to advocacy.


    Recently, a more positive vibe towards cybersecurity amongst the general public
    is certainly noticeable. Consumers, educators, parents, and politicians ask more
    questions and debate publicly about cybersecurity and privacy. Mass media and
    social media have contributed to the dispersion of stories of cybercrime and the
    interest from a wider audience. News stories about data breaches, identity theft,
    or cyberattacks by foreign governments attract attention. One explanation is that
    news stories offer a learning experience and, as a result, the public becomes
    more informed. The media has a wide reach to different audiences and many different
    channels to deliver news stories, opinion, and background articles. Communication
    theorists attribute the influence of mass media on public opinion and behaviour
    to the power of visual illustrations. Mass media traditionally use visual communication
    to illustrate, attract attention, and to explain a sequence of events. Cybersecurity
    professionals in organizations could benefit from these techniques to gain the
    interest from the audience within their organization. Unfortunately, cybersecurity
    education does not usually include communication theory or visual design classes.
    Producing clear, organized visual communication requires visual insight. The problem
    is that there remains an outdated bias that visual production is a vocational
    and not an intellectual process³⁸, and at the same time, there remains an outdated
    bias that cybersecurity is an intellectual and not a vocational profession. The
    reality is both are needed to create progress in cybersecurity.


    Visual communication is a tool that supports each step of the way that leads us
    from the first impressions of cybersecurity to knowledge and awareness to advocacy.
    When applied strategically, visual communication can contribute to a people-centric
    approach to security, where employees are encouraged to make informed security
    decisions, take personal accountability, and actively engage in security activities,
    rather than simply complying with the policies³⁹. This will result in cybersecurity
    products and services that are transparent, accessible, visually clear, useable,
    understandable, useful, and engaging. Ultimately, this will advance the development
    of the discipline.'
  merge: -1
  img_proc: true
