- pgno: 134
  md: '# ## 20. Cybersecurity art


    Cybersecurity is increasingly inspiring artists as a topic for motion pictures,
    museum exhibitions, and artistic data visualizations. Fortunately, more and more
    businesses work with designers and data artists to create alternative approaches
    to awareness campaigns by using different art forms and techniques. Working with
    trained artists delivers innovative and emotionally engaging approaches to draw
    attention to the complexity of the field and the impact of technology on society.
    Art has the strength to express emotions such as fear, confusion, optimism, or
    enthusiasm. Through art, an audience can understand and feel the limitations and
    the possibilities of cybersecurity. This chapter highlights some of the initiatives
    where cybersecurity experts collaborate with professionally trained artists.


    # ### 20.1 Photography


    The first chapter of this book pointed out that the media often pictures cybersecurity
    experts as shady figures wearing hoodies. In The Netherlands, the photo exhibition
    called Hackers Handshake brings an honest and more diverse image to the public.
    Hackers Handshake is a project by Tobias Groenland200. He started to investigate
    the hackers’ scene expecting that they would confirm the stereotypes. In contrast,
    he discovered a diversity of individuals who have a passion for technology in
    common. The 16 portraits in the exhibition tell the story of helpful hackers who
    seek, find, and report vulnerabilities in computer systems in order to improve
    security. They report their findings to the owners of the vulnerable systems first
    and then to the hacker community, governments, and businesses that are related
    to that system, a practice is known as Responsible Disclosure, or Coordinated
    Vulnerability Disclosure201.


    Between 2014 and 2018 Tobias Groenland and author Chris van ’t Hof collected stories
    of hackers using their skills for good purposes. Chris van ’t Hof wrote the texts
    that tell the stories behind the portraits and published a book called Helpful
    Hackers202 that portraits Dutch hackers and the concept of responsible disclosure.
    The message behind this work not only contributes to a realistic and honest public
    image of cybersecurity experts, it might also invite young people with advanced
    technical skills to choose to use their skills for good instead of straying into
    cybercrime.'
  merge: -1
  img_proc: true
- pgno: 135
  md: '![](img/7ffc38f932cabd3a29392ff94c7e70f0_135_0.png)


    Hackers Handshake photo exhibition.

    Photographer: Tobias Groenland (https://www.tobiasgroenland.nl).

    Image Copyright © Tobias Groenland.


    During the photography sessions the photographer requested to think of coding
    during the shoot. In their minds they might be scanning for vulnerabilities or
    doing a DDoS attack and as a result they might be revealing something of themselves
    to the wider audience through their gaze.


    # 20.2 Data art


    Data visualization for cybersecurity has further evolved since the publication
    of Raffael Marty''s book on Applied Security Visualization in 2008¹²¹. We can
    even see an emerging trend where cybersecurity data turns into art. However, data
    art is not the same as data visualization. Data art does not seek to present unmistakable
    evidence and to explain structures from data, but rather creates a visual experience
    or seeks new methods of presentation²⁰³. Data artists take the data and create
    new compositions from it.


    Books such as Knowledge is Beautiful and Information is Beautiful and their supporting
    website¹⁴⁹,²⁰⁴,²⁰⁵, or the collections of Manuel Lima, amongst which are The Book
    of Trees²⁰⁶, the Book of Circles²⁰⁷, and Visual Complexity²⁰⁸ are inspirational
    to find new ways to visualize data in beautiful ways, and with many of the examples
    in these books it''s not easy to separate the explanatory data visualization from
    data art.'
  merge: -1
  img_proc: true
