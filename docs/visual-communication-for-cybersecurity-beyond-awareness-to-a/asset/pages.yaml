- pgno: 125
  md: '**Cyber attack**


    Malicious attempts to damage, disrupt or gain unauthorised access to computer
    systems, networks or devices, via cyber means.


    **Cloud**


    Where shared compute and storage resources are accessed as a service (usually
    online), instead of being hosted locally on physical services.


    **Bring your own device (BYOD)**


    An organisation''s strategy or policy that allows employees to use their own personal
    devices for work purposes.


    **Botnet**


    A network of infected devices, connected to the Internet, used to commit co-ordinated
    cyber attacks without their owners'' knowledge.


    **Antivirus**


    Software that is designed to detect, stop and remove viruses and other kinds of
    malicious software.


    **End user device**


    Collective term to describe modern smartphones, laptops and tablets that connect
    to an organisation''s network.


    **Encryption**


    A mathematical function that protects information by making it unreadable by everyone
    except those with the key to decrypt it.


    **Digital footprint**


    A footprint of digital information that a user''s online activity leaves behind.


    **Denial of Service (DoS)**


    When legitimate users are denied access to computer services (or resources) usually
    by overloading the service with requests.


    **Cyber security**


    The protection of devices, services and networks - and the information on them
    - from theft or damage.


    **Phishing**


    Untargeted, mass emails sent to many people asking for sensitive information (such
    as bank details) or encouraging them to visit a fake website.


    **Patching**


    Applying updates to firmware or software to improve security and/or enhance functionality.


    **Macro**


    A small program that can automate tasks in applications (such as Microsoft Office)
    which attackers can use to gain access to (or harm) a system.


    **Internet of Things (IoT)**


    Refers to the ability of everyday objects (rather than computers and devices)
    to connect to the Internet via Wi-Fi, include kettles, fridges and televisions.


    **Firewall**


    Hardware or software which uses a defined rule set to constrain network traffic
    to prevent unauthorised access to a network.


    **Trojan**


    A type of malware or virus disguised as legitimate software that is used to hack
    into the victim''s computer.


    **Spear-phishing**


    A more targeted form of phishing, where an email is designed to look like it''s
    from someone the recipient knows and/or trusts.


    **Social engineering**


    Manipulating people into carrying out specific actions, such as divulging information
    or clicking on an attacker''s website.


    **Software as a Service (SaaS)**


    Describes a business model where consumers access centrally-hosted software applications
    over the Internet.


    **Ransomware**


    Malicious software that makes data or systems unusable until the victim makes
    a payment.


    **Zero-day**


    Recently discovered vulnerabilities (or bugs) that hackers can exploit to attack
    computers, or antivirus companies, that hackers can exploit.


    **Whitelisting**


    Authorising approved applications for use within organisations in lieu of attempting
    to block all potentially harmful applications.


    **Whaling**


    Highly targeted phishing attacks (masquerading as legitimate emails) that are
    aimed at senior executive.


    **Watering hole attack (watering hole attack)**


    Setting up a fake website (or compromising a legitimate one) in order to exploit
    visiting users.


    **Two-factor authentication (2FA)**


    The use of two different components to verify a user''s claimed identity. Also
    known as multi-factor authentication.'
  merge: -1
  img_proc: true
