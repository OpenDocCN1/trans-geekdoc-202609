  md: '![](img/7ffc38f932cabd3a29392ff94c7e70f0_57_0.png)


    # Figure 10 Elaboration likelihood model.


    The model is useful when planning communication for attitude change:


    +   - Elaboration requires concentration and distraction will disrupt the process.

    +   - Repetition of messages is likely to increase the possibility of elaboration,
    but too much repetition eventually leads to the peripheral route.

    +   - When the audience is motivated to elaborate a message, rely on facts and
    strong arguments. Weak arguments will backfire and cause discussion.

    +   - If the audience is unable or unwilling to elaborate a message, make the
    presentation more important than the message. Appealing messages will be processed
    on the peripheral route. However, the level of persuasion will be fragile.


    Researchers have tested the ELM in the context of security awareness. Researchers
    in Singapore tested a security message from a security awareness campaign of a
    university, informing students about an anti-virus software package that they
    could install on their computers⁸⁹. Four versions of the security message were
    created, i.e., high/low on message comprehensibility and with/without message
    repetition. They found that repetition of a security message enhances the elaboration
    likelihood. Message comprehensibility only had a positive effect on elaboration
    when used in combination with repetition. They argue that including some information
    security jargon in a message can be reassuring to readers and give precise meanings.


    In Finland, a study used the ELM as underlying theory for information systems
    security policy compliance training⁹⁰. They found that security policy compliance
    training should use learning tasks that are of personal relevance to the learners
    so that there are visible consequences for the'
