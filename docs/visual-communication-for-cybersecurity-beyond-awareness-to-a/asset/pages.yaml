- pgno: 137
  md: '# ## 20.3 Malware exhibitions


    Computer viruses have become part of our daily digital life and the design and
    creativity behind malware is related to digital culture. In this light, the activity
    of programming a virus is seen as an art form and cultural practice that, in the
    words of Jussi Parikka, ‘refashions our sense of security and self’²¹². Malware
    is much more than just a security issue. It is a way to turn a real situation
    into a lie and an invention of an accidental situation that turns out into the
    advantage of the creator. The artistic value is placed in the paradox of the beautiful
    complexity behind the malware and the damage it can cause.


    An overview of different malware programs can be found at The Malware Museum.
    The Malware Museum is an online collection of malware examples at the Internet
    Archive²¹³. It shows a selection of malware from the 1980s and 1990s on home computers.


    The most famous and more recent examples of malware were displayed in 2019 in
    The Netherlands in an exhibition called Malware: symptoms of viral infection,
    curated by Bas van de Poel and Marina Otero Verzier²¹⁴. The exhibition showed
    images of the malware and engaged the audience in questions about safety, war
    fare and geopolitics. As many viruses cannot be seen, the curators created visualizations
    to match the stories behind the creators of the virus or those of the victims.


    An earlier exhibition to feature viruses and malware was I Love You [rev. engl],
    conceived and presented by the digitalcraft.org Kulturbüro, curated by Franziska
    Nori, and first shown in Frankfurt in 2002. The exhibition was later expanded
    and travelled through different countries until 2006²¹⁵. The exhibition was divided
    into four investigative areas - political, cultural, technical and historical.
    It included for visitors to:


    +   - Force computers to crash

    +   - Experience a global virus outbreak in real time via a 3D world

    +   - View security concepts and methods for preventing global network attacks

    +   - Witness computer viruses as works of art

    +   - See films by hackers on their subculture

    +   - Learn about programming languages as the material for contemporary poetry

    +   - Compare experimental literature and code poetry


    # ## 20.4 Immersive art


    Immersive art is a form of art where the viewer becomes part of the artwork. The
    viewer can walk within the installation or can interact with it. They are often
    multi-sensory experiences that include sound, scent, touch, and vision.'
  merge: -1
  img_proc: true
- pgno: 138
  md: 'Immersive art can make the spectator feel like they are part of something big
    and even infinite. They appear to be in the middle of the elements of time and
    space. This art form suits the perception of the infinity of internet and the
    connections of a single person with countless numbers of networks.


    Immersive art exhibitions with a technology theme often are inspired by big data,
    neural networks, artificial intelligence²¹⁶, and machine learning. Some of them
    even use machine learning algorithms on a database with images to display those
    images in multiple dimensions in a way that the algorithm decides²¹⁷.


