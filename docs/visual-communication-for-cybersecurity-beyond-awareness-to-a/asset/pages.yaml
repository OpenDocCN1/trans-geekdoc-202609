  md: '# # 18. Visualizing with style and colour


    Sometimes you may not have the option to create pictures and you are in a situation
    that you just have to go forward with a lengthy textual document. There is a lot
    you can do to make a text attractive. By using colour, different fonts and font
    sizes, you can draw attention to the important parts. This will help your reader
    to quickly scan the document and see the keywords in an instant. The designers
    that worked on this book also used typography and colour options to make this
    book more visual.


    Also, tables benefit from colour and style such as coloured dots and labels or
    bold headings.


