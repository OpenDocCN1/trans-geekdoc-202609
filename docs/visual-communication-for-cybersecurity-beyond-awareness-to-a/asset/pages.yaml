  md: '# # 9. How people are persuaded


    Persuasion is a form of communication aimed to influence beliefs, values, attitude,
    intention, motivation, and behaviour. For persuasion, we need a sender, a medium,
    and a recipient. The sender has a goal and intents to achieve that through communication.
    The recipient is not persuaded by accident or by force. Persuasion depends on
    the circumstances in which the recipient resides, the content and form of the
    message, as well as the credibility of the sender. In cybersecurity, we put a
    lot of energy into trying to persuade others. The theory discussed in this chapter
    provides anchors to better understand the processes involved with persuasion.


    # ## 9.1 Marketing


    Marketing is a discipline that sprouted from selling or bartering goods on a market
    and has since evolved to a science with a focus on delivering added value to customers
    and maintaining positive relationships. Marketing theory is related to psychology,
    sociology, economy, social sciences, creative arts, as well as statistics. Marketing
    theory provides useful insights for cybersecurity when it comes to influencing
    behaviour. After all, organizations are trying to persuade people to use security
    procedures, tools, and to act in a certain way.


    One of the most traditional marketing models is the AIDA model (attributed to
    E. St Elmo Lewis, around 1898). The model describes that customers need to go
    through a number of steps: **Attention-Interest-Desire-Action**. First you need
    to draw attention from the people, for instance, by shouting out loud: ''Tasty
    apples''. Then, the customer must get interested: ''from the best trees, very
    fresh''. Interest is changed into desire when the customer tastes the apple or
    sees other people enjoying it. The final step is the actual buying action. This
    model has since inspired many other marketing models. Today, marketing no longer
    stops at the buying action but aims at an extended ‘customer journey’ that includes
    the post-purchase experience. In modern marketing models, loyalty and advocacy
    of the product has become the ultimate goal of marketing. Customers nowadays trust
    the f-factor (friends, family, Facebook fans, and followers) more than they trust
    marketing communication⁸⁰. People tend to ask their friends on social media for
    advice. Customers are no longer seen as the ‘target’ in marketing campaigns. Customers
    are now considered peers and friends of a brand or product. Advocates tell positive
    stories and advice their peers. They become evangelists.'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'Kotler⁸⁰ extends the original AIDA to five A’s to better fit our modern connected
    society. The steps are now: aware (I know it), appeal (I like it), ask (I am convinced),
    act (I buy it), and advocate (I recommend it).


    The AIDA model and its newer varieties help us to influence employee behaviour.
    Organizations that aim for security awareness programmes as a check-box exercise
    for compliance to standards and regulations do not have do to more than expose
    a target group to their messages and training courses. When we aim for employees
    to act, and re-act, such as periodically changing a password, we should take employees
    through all the stages from awareness to action. However, organizations that aim
    for structural changes and long-lasting behaviour behaviour need to take the extra
    steps to achieve employee loyalty and advocacy of secure behaviour. Several studies
    found evidence that observing the secure behaviour of peers motivates the secure
    behaviour of followers¹¹,¹³,⁸¹. To change security behaviour, we need advocates
    in the peer groups of our audience.


    Researchers⁶⁵ who studied the effectiveness of sanctions on information security
    violations found that a policy enforcing strategy has limited effect. They found
    that enforcing becomes non-significant when an influencing strategy is used. Employees
    can be educated to hold themselves accountable for their actions. The authors
    suggest that there should be a focus on the link between employees’ actions and
    business risks. Another tactic is to use role models who understand security issues
    and help to advocate policy compliant behaviour. However, the same researchers
    furthermore discovered that the more senior the position of an employee, the more
    likely this person is to violate security rules. This conclusion points out an
    interesting topic for future research, as most best practices state that security
    governance ought to be driven by senior executives.


    # 9.2 Rhetorical theory, framing, and narrative paradigm/ storytelling


    Classical rhetorical theories were dominated by the ideas of Aristotle and Plato
    with a focus on persuasion through language and speech in politics and law. In
