- pgno: 23
  md: 'this view, security risks are technology risks that threaten the confidentiality,
    integrity, or availability of systems. These risks can be contained through the
    installation of artefacts and mechanisms and through the use of standards and
    checklists. Around the centre, the growing insight from business sociology, politics
    and humanities complement the technical scope. These different streams strengthen
    and inspire the field. Security thinking has expanded from the concept of technical
    containment to socio-technical complexity. This does not mean that one could replace
    another: the different perceptions are complementary to each other and all of
    them are needed to understand risks. Risks include the whole of technology risks,
    business risks and society risks. A technology risk (such as the risks that a
    critical infrastructure stops working because of a technical issue) could cause
    a business risk (when organizations relying on the infrastructure cannot complete
    their production). In turn these risks could cause risks to people and groups
    in society. To illustrate the disappearing boundaries around environments and
    systems, the box around the technical area has dashed lines and the text on the
    outside is not framed at all, as a symbol of the pervasiveness of security issues.


    The outside area of the figure is related to risks in society. These risks can
    be identified and better understood by studying information society discourse.
    From studying the works of information society thinkers such as Ulrich Beck, Manuel
    Castells, Jan van Dijk, or David Lyon, we can learn that the scope of security
    risk is global and infinite, through the connections in socio-technical networks.
    Furthermore, the risks can be economic (influencing stock markets), personal (identity
    theft, social inequalities, damaged social relations), political (bringing down
    governments, or damaging international relations), and have the potential to influence
    basic human rights (the right to be left alone, freedom of speech). Information
    society theory teaches us that the perception of societal security risks is likely
    to be socially constructed by international power and power struggles, (lack of)
    public information policy, mass media and culture.


    We face a difficult, maybe even impossible, task in bringing all these disciplines
    together in a field that we are trying to scope with the term cybersecurity. Yet,
    as technology risks could pose a threat to our human rights and physical safety,
    we’ll have to find a way to work together across disciplines and nations.'
