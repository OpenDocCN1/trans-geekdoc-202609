    prefer combined learning styles34. It demonstrates that visuals are a much-appreciated
    addition to communication style and should not be forgotten.


    The proverb ''a picture is worth a thousand words'' is often used to promote visual
    thinking. It leads some to think they need to replace all content with pictures.
    That is not necessary and often not helpful at all. Most of our information consumption
    is text-based and we need words to communicate. A picture cannot always replace
    all words, but it can help to reduce the number of unnecessary words and an attractive
    layout can draw attention to something important. An image might support and strengthen
    a text and make it more interesting. Some images (such as journalistic photos)
    can also provoke words and spark discussion about an event. Other pictures help
    to convince an audience of a version of the truth that is written down in lengthy
    documents (such as in legal files or in fraud investigations). Text and images
    complement each other.


    In the case of data privacy and security, even the GDPR suggests the use of visual
    aids such as icons. Article 12 of the GDPR requires the provision of intelligible
    and easily accessible information on data practices. Article 12(7) even suggests
    the use of icons ''in order to give in an easily visible, intelligible and clearly
