  md: '# # Manifesto


    Present yourself **as you are**. The way you present your norms and values influence
    how others see cybersecurity.


    **Talk** the language of your audience. Get to know your **audience** and **connect**
    with them. Agree on definitions.


    **Stop bullying** your colleagues with dull awareness campaigns. Design policy
    & products together with end-users. Collaborate with other cybersecurity professionals
    and speak the same **language**.'
  merge: -1
  img_proc: true
