    The communication escalator^70, illustrated in figure 2, describes the intended
    goals of internal communication. For each goal, there are different communication
    channels to choose from, depending on the degree of interaction, variety of language,
    and variety of signals (emotional, social, verbal, and non-verbal) and on the
    degree of behaviour change intended. The higher on the escalator, the greater
    the degree of change projected. Awareness is at the bottom, with low interaction
    with the audience and minimum intention to change. The communication channels
    used at the awareness level are one-directional, such as email or posters. Commitment
    is at the top of the escalator, where interaction is high and the degree of change
    is high. Modern communication channels dominate the top of the escalator, providing
    many opportunities to create communities that exchange content-rich information
    and stimulate involvement and commitment of employees.


    Communication activities for cybersecurity often remain at the bottom of this
    escalator. When awareness is the goal, one-directional communication channels
    such as newsletters or manuals are common practise. To reach the commitment level
    of the escalator, continuous interaction with end-users is required through collaboration
    to solve problems and to design solutions.


