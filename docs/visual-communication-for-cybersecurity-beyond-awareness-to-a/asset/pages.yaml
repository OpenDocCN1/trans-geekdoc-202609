- pgno: 7
  md: '# # Introduction


    Cybersecurity is at the top of the agenda in business and politics. It is an exciting
    field to work in with many job opportunities for people from different backgrounds
    and education. Unfortunately, communication problems are holding back advances
    in the field. It is difficult to fulfil the many job vacancies because the general
    public does not really understand what cybersecurity is and what a career has
    to offer. Professionals working in cybersecurity experience that lay people understand
    little of security risks and controls. Over the years, security professionals
    have tried different strategies to promote their work and to improve the knowledge
    of their audience. For that purpose, communication strategies include avalanches
    of jargon thrown over lay people or hours of mandatory e-learning modules that
    will only tick the boxes for the compliance auditor. However, the much-aspired
    security awareness is only the first step in the process to change behaviour.
    When we promote a security solution, we need to bear in mind lessons from marketing
    theory: making your audience aware of it is just the first stage in the marketing
    funnel to get the audience’s buy-in.


    # Awareness is not the goal.


    Many professionals agree that working towards security awareness is a good start
    and better than doing nothing at all. Even better is to actually change the behaviour
    of people. However, changing end-user behaviour is not the ultimate goal either.
    No. We should aim even higher: aim at getting people to look after their peers
    as advocates of cybersecure behaviour; to have them demonstrating correct security
    manners and to explain it to their friends, family, and colleagues. Example behaviour
    within peer groups is far more effective than corporate policy and awareness campaigns.


    # We need a common language.


    Cybersecurity experts disagree amongst themselves about definitions, responsibilities,
    problems, and solutions. These frictions in the communication amongst experts
    and awkward communication between experts and their non-expert audience is a complication
    to the proper protection of valuable information. Cybersecurity professionals
    need to change the way they present themselves and their services to the public.'
  merge: -1
  img_proc: true
- pgno: 8
  md: '# # Design thinking is the foundation for innovation and engaging security
    products.


    We need creativity and innovation on how to approach cybersecurity, the relationship
    with lay people, and the interactions with other professionals. We need to design
    better security products and services together with the people that work with
    those. When the design processes for security products and risk reduction includes
    a multi-disciplinary team involving the end-users, the acceptance of the security
    rules will increase. Design thinking is commonly used in the development of human–computer
    interfaces, but it can also be applied to other things such as the design of policies,
    procedures, reports, and training.


    # # With visual communication skills, we can improve collaboration.


    The cybersecurity profession needs to be refreshed, with collaboration leading
    to human-centric design approaches and human forms of communication. Visual communication
    is useful to explain complex topics and to solve complex problems. It helps to
    engage audiences. It lights up meetings and it provokes discussion. When done
    right, visual aids help the audience remember a message and to act on it. When
    applied strategically, visual communication can contribute to a people-centric
    approach to security, where employees are encouraged to actively engage in security
    activities rather than simply complying with the policies.


    # # Cybersecurity education needs to teach visual thinking.


    Visual communication has proven its effectiveness in science education, in the
    communication of health issues, and in legal design. It is gaining popularity
    amongst cybersecurity professionals as well. Unfortunately, cybersecurity education
    does not usually include communication theory or design classes. Many experts
    think that it is not part of their job and is best left to the communication department,
    or they think that they lack any creative talent.


    # # Reading guide


    This book introduces the possibilities of visual communication for cybersecurity.
    It outlines some of the relevant communication theories and models, gives practical
    tips, and shows many examples. The book can support students in cybersecurity
    education and professionals searching for alternatives'
  merge: -1
  img_proc: true
