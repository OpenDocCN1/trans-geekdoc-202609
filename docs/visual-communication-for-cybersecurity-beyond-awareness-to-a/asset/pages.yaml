  md: '# 3. Gobbledygook


    Cybersecurity is multi-disciplinary but does include, for a large part, highly
    technical expertise. This expertise is characterized by a lot of jargon. It is
    often forgotten that most of our audience speaks a different language. Some cybersecurity
    experts are masters in mysterious language.


    ![](img/7ffc38f932cabd3a29392ff94c7e70f0_20_0.png)


    Figure 2 What the professional says, and the lay people hear.


    He or she who talks like this to novices is a threat to cybersecurity. On top
    of this, it is likely that experts will disagree amongst themselves about the
    technical correctness of statements such as the above. Friction in the communication
    amongst experts and awkward communication between experts and their non-expert
    audience is a complication to the proper protection of valuable information. Highly
    technical concepts should be communicated in a language that lay people understand.


    One of the most distressing language problems is that professionals do not agree
    amongst themselves on terminology and definitions. For non-expert audiences, cybersecurity
    is a complex and mysterious field that needs clarification. To meet that purpose,
    various definitions and taxonomies of technical cybersecurity jargon are used
    by different organizations. This has led to multiple dictionaries16–19, style
    guides20,21, and at least 17 different taxonomies for incident detection and prevention
    in Europe alone22. If even cybersecurity'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'professionals do not use a unified language amongst each other, how will they
    ever be able to collaborate amongst each other effectively, let alone with people
    outside their group?


    ![](img/7ffc38f932cabd3a29392ff94c7e70f0_21_0.png)


    Figure 3 Stop throwing jargon and abbreviations to your audience!


    > How will cybersecurity professionals ever be able to collaborate if they cannot
    consent on terminology?


    Cybersecurity professionals do not even agree on what their field is called. Is
    it information security or cybersecurity? The words are used interchangeably by
    experts and the general public alike. When I am at a party and say that I work
    in information security, people tend to nod politely and look slightly bored.
    When I say that I work in cybersecurity, they suddenly pretend to know exactly
    what I am talking about and start telling stories about hacking and fraud. Cybersecurity
    as a term seems to connect better with the general public. According to Google
    Trends, cybersecurity is nowadays more popular as a search term than information
    security. The many debates about the definition of cybersecurity seem to have
    in common that cybersecurity aims to protect more than just information. It aims
    to protect cyber activities and other things that are vulnerable through IT, such
    as people, cars, machines, or traffic lights. The other things could also be conceptual,
    such as our economy and'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'society at large, because disruptions in IT could potentially lead to disasters
    (loss of critical infrastructures), international distrust (digital espionage
    and propaganda), or mass outrage. Cybersecurity includes the security of IT and
    information (with the exception of analog information). However, no concise, broadly
    accepted definition of cybersecurity exists. On top of that, the meaning of the
    word security is also much contested²³. This Babylonian confusion of languages
    evokes discussion amongst experts and this discussion influences the image of
    the cybersecurity profession. Without a shared language, it is not easy to achieve
    collaboration and success ²⁴.


    ![](img/7ffc38f932cabd3a29392ff94c7e70f0_22_0.png)


    Figure 4 Comparison of the search interest of cyber security and information security.

    Data source: Google Trends (https://www.google.com/trends).


    The complexity of the collaboration between experts from different disciplines
    is described in more detail in my doctoral thesis²⁵. The broadest perspective
    on our field of work can be described in a multi-layer model. The many risks that
    we are trying to manage affect more than just ICT and businesses. The global entanglement
    of people, ICTs, and organisations with cultural norms and ethics calls for risk
