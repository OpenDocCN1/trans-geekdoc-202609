    ## CyberSeek


    网络安全职业路径¹⁴⁶


    版权：经CyberSeek项目及其合作伙伴Burning Glass Technologies、CompTIA、网络安全教育国家倡议（NICE）许可。


    ![](img/7ffc38f932cabd3a29392ff94c7e70f0_96_0.png)


    这是一个交互式网络图的示例。它是CyberSeek网站的截图。此交互式职业路径显示了网络安全领域的关键职位、它们之间常见的转型机会，以及与每个角色相关的薪资、凭证和技能集的详细信息。该工具通过使用NICE网络安全劳动力框架来帮助描述每个角色，并列出雇主用于相同角色的常见职位名称，从而支持社区内共同语言的概念。


    | 常见的网络安全入职角色 | 核心网络安全角色 | | |

    | :--- | :--- | :--- | :--- |

    | **入职角色** | **入门级** | **中级** | **高级** |

    | 网络 | 网络安全专家/技术人员 | 网络安全分析师 | 网络安全经理/管理员 |

    | 软件开发 | 网络犯罪分析师/调查员 | 网络安全顾问 | 网络安全工程师 |

    | 系统工程 | 事件分析师/响应人员 | 渗透与漏洞测试人员 | 网络安全架构师 |

    | 财务和风险分析 | IT审计师 | | |

    | 安全情报 | | | |


