    7。例如，他们信任来自使用朋友名字的电子邮件账户发送的邮件内容，尽管他们对自己识别网络钓鱼的技能充满信心。在态度与网络欺凌以及避免网络欺凌的技能感知方面也发现了类似结果。最后，学生们知道复杂密码更安全，但仍然选择简单密码。这些认知失调的例子使学生容易受到网络犯罪的侵害。


    另一个例子是隐私悖论。在线用户声称非常关注隐私，但同时却很少采取行动保护个人数据。几项研究试图解释人们用来为自己行为辩解的合理化方式，但结果不一 92–94。


