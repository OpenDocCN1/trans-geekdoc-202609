    图12 符号三角形概述。三个符号三角形分别解释图标（可识别的图片）、符号（图片的含义需要学习）和索引（与对象或概念的关联，它们彼此不相似）。


    ble 信息，关于数据实践。第12(7)条甚至建议使用图标“以便以易于可见、可理解且清晰易读的方式，对拟进行的处理提供有意义的概览”。图标可以代表数据保护概念及其诠释，并充当共享语言。当设计、沟通和信息技术协作时，就有可能生成用户友好的法律界面¹¹⁴。


    ### 10.4 个人品牌


    个人品牌是个人为推广其主要个人特征而采用的一种营销策略。个人品牌在政客、演员、经理、科学家和企业家中很常见。随着社交媒体的发展，每个人都可以成为信息发布者并创建个人品牌。个人品牌在20世纪90年代末期在商业文章的影响下变得流行，例如汤姆·彼得斯（Tom
    Peters）于1997年发表的《名为“你”的品牌》和彼得·德鲁克（Peter Drucker）于1999年发表的《管理自我》。该话语主要以自助书籍和职业建议的形式出版，并常被学术界批评为一种幻想。有观点指出，个人品牌出售的是希望而非本人：“脱颖而出的希望、获得认可的希望、感到独特并值得关注的希望，最重要的是，寻找意义的希望”¹¹⁵⁹⁶。讨论个人品牌的学术论文主要产生于社会学¹¹⁶和市场营销¹¹⁵等领域。


    大多数人已经在潜意识里推销自己，并认为个人品牌是有效的。例如，当求职者接受面试时，他们中大多数人都已内化了个人品牌的概念，并非常关注自己的在线存在与形象¹¹⁶。欧洲和美国各类公司中的销售人员和高管在访谈中表示，他们觉得个人品牌为他们带来了有形的结果（例如销售业绩、客户回电、奖项和旅行）以及无形的回报（客户对你微笑、得到赞美等）¹¹⁷。


    越来越多的网络安全专家正在推广他们的个人品牌。这些人被视为网络安全领域的顶级影响者。这不仅对于将网络安全作为招聘的有吸引力领域进行推广，或影响和倡导安全行为很重要，而且还有助于推进个人的职业生涯。网络安全女企业家简·弗兰克兰（Jane
    Frankland）在其著作¹¹⁸中描述了她如何决定提升自己在网络安全领域的个人品牌，花时间学习如何使用社交媒体，并自此受益。其他影响者因其行为（凯文·米特尼克）、知识和写作（布鲁斯·施奈尔）或发现（丹·卡明斯基）而闻名。他们被视为榜样和影响者。个人品牌有助于赢得受众的信任，因为你作为知识渊博的专家的声誉变得更加可见。通过展示你的知识或与知名组织的关系，你会被视为具有权威性的人³。这将帮助你建立关系并获得可信度。


    个人品牌在很大程度上，但并非仅限于，你的在线存在。它需要视觉沟通。例如，用讲故事的方式传达你的信息、网站上引人注目的个人简介、吸引人的LinkedIn标题、演示文稿中的个人风格与设计、专业个人资料照片以及视频消息等。大多数影响者都有视觉吸引力的网站，并在文章、博客和演示文稿中保持一致的视觉风格。他们知道自己在说什么，并坚持自己的规范和价值观。他们始终遵循这些规则，并时刻注意他人对他们的看法。


    ## 11. 结论


    沟通理论指导我们做出更好的沟通设计决策。它提供模型来理解沟通发生的背景，从而让我们更好地了解受众。


    它还展示了人们如何学习以及如何接收和考虑安全信息。沟通研究表明，记住和理解信息不一定会导致承诺和拥护。要制定沟通策略，有许多选择，例如使用营销模型、修辞、讲故事、框架或个人品牌。


    沟通理论的关键要点如下：


    - 1. 将安全教育定制为学习目标的认知水平

    - 2. 混合使用视觉、口语、文字和实践操作以达到最大效果

    - 3. 调整沟通风格以匹配组织结构

    - 4. 共享文化 = 共享语言

    - 5. 利益相关方影响成功

    - 6. 对雇主的信任激励合规行为

    - 7. 信息必须相关且重复

    - 8. 当设计连贯时，视觉效果更佳

    - 9. 信息应与已有信念相符

    - 10. 说服需要信任和保证

    - 11. 最强的影响者是一个人所属的社会群体


    在本书的下一部分中，你将找到许多支持沟通策略的想法。这些示例中的精选内容将简要讨论其与沟通理论的关系，以帮助你在查看图片时培养思维模式。


    ## 第三部分


    ### CISO办公室中的视觉沟通


    ## 12. 引言


    首席信息安全官（CISO）及其团队有1001项任务要完成。视觉沟通可以帮助更有效地工作并吸引利益相关方。本书的这部分为CISO团队可能向不同受众解释的不同概念提出了一些常见的可视化方案。请记住，本节中的示例只是比喻意味上的冰山一角。我们的社区才刚刚开始意识到可视化的力量，本书的这部分只是一段漫长而富有创造力的旅程的开端。法律设计、信息设计和数据科学等其他领域是重要的创新者，网络安全专家应当与他们合作。许多工作已经在诸如IEEE网络安全可视化研讨会（VizSec，自2004年起举办^119）以及自2014年起举办的年度安全图形模型国际研讨会（GraMSec，^120）等活动中汇集在一起。拉斐尔·马蒂（Raffael
    Marty）在其著作《应用安全可视化》（2008）中表示：


    > ''一张图片抵得上一千条日志记录''^121（第xiii页）。


    在他看来，可视化是基于数据生成图表的过程。在上述示例中，侧重于数据可视化和工具，而不是向非专家传达复杂概念。


    其他工作则是从视觉信息中创建安全。例如，通过拍摄移动高速公路、云层或熔岩灯的照片来为密码学创建随机性^122。


    在本书中，可视化主要是指以尽可能清晰的方式传达信息，同时考虑目标受众和背景。接下来章节中的示例演示了如何在网络安全的不同背景下使用可视化。我们的眼睛无法看到网络安全风险、威胁或组织结构，但当以可视化形式呈现时，这些概念更容易理解。这些示例展示了不同的风格、技术和信息。有些源自商业来源，其他则来自公共部门和学术出版物。希望，本书的进一步版本和支持网站将使我们的社区能够建立一个示例库，以启发未来的视觉沟通者。


