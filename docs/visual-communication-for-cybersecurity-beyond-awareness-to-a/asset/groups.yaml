    ### 网络安全技能缺口？


    Nicole van Deursen，使用 Piktochart 创建


    基于 165 份数据


    此信息图基于对 2018 年春季荷兰 52 个职位空缺的内容分析。尽管大家都在谈论网络安全专业人员短缺，但此分析结果表明，这可能是企业自身的问题。许多职位描述使用了令人困惑的语言（“你的工作是平衡管理”）；要求不存在的认证（例如：“你已获得
    ISO 27001 认证” - 该证书是针对组织而非个人 -）；或者要求不可能的组合（CISSP 证书 - 该证书要求超过 5 年经验 - 结合不到 2 年的工作经验）。近一半的雇主并不真正关心候选人完成的教育水平。他们写道：“你拥有职业学位或大学学位”。这对大学毕业生来说并不十分鼓舞人心……最糟糕的是，对更有经验的专业人士没有需求。67%
    的雇主对拥有超过 5 年经验的专业人士不感兴趣。


    ![](img/7ffc38f932cabd3a29392ff94c7e70f0_121_0.png)


