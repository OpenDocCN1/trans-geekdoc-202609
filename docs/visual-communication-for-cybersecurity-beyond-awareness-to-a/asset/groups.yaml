    # 3. Gobbledygook


    Cybersecurity is multi-disciplinary but does include, for a large part, highly
    technical expertise. This expertise is characterized by a lot of jargon. It is
    often forgotten that most of our audience speaks a different language. Some cybersecurity
    experts are masters in mysterious language.


    ![](img/7ffc38f932cabd3a29392ff94c7e70f0_20_0.png)


    Figure 2 What the professional says, and the lay people hear.


    He or she who talks like this to novices is a threat to cybersecurity. On top
    of this, it is likely that experts will disagree amongst themselves about the
    technical correctness of statements such as the above. Friction in the communication
    amongst experts and awkward communication between experts and their non-expert
    audience is a complication to the proper protection of valuable information. Highly
    technical concepts should be communicated in a language that lay people understand.


