    ## 8.5 沟通隐私管理理论


    沟通隐私管理理论（CPM）是关于人们如何决定披露和隐瞒私人信息的理论 76。它描述了人们根据个人规则控制其私人信息的过程。个人认为自己拥有私人信息，并有权控制它。他们根据个人隐私规则共享信息。当人们共享信息时，意味着他人被赋予共同所有权地位。因此，个人可能不仅披露自己的信息，还可能披露属于他人的信息。因此，信息需要管理。


    管理私人信息的三个主要组成部分是：隐私所有权、隐私控制和隐私湍流。隐私所有权意味着人们相信自己拥有私人信息，并可以选择拒绝或向谁提供其私人信息的访问权限。隐私控制代表提供或拒绝访问私人披露的管理过程。因为原始所有者相信他们拥有该信息，所以他们相信即使在授权共同所有者后，他们也控制对其的访问。当与私人信息的个人边界与公开披露的边界重叠时，就会发生隐私湍流。


    CPM 用于框架关于家庭沟通、健康（例如可穿戴设备和个人健康信息共享的研究）、社交媒体（社交网络中个人数据共享）、大数据收集、电子商务以及工作场所（员工监控）的研究。随着个人移动设备在工作场所越来越被允许，CPM
    在工作场所变得非常适用。自带设备（Bring Your Own Device）的概念意味着雇主必须为隐私和安全制定规则。公司必须采取措施保障其网络安全。同时，一些员工认为，即使他们在工作场所，公司也不应能够追踪其个人设备甚至公司电脑上的操作
    77。


    一项针对台湾员工的研究 78 发现，员工在控制型组织文化中感到隐私受限。研究人员建议，组织最好避免过度控制，以改善员工与雇主之间隐私边界的协商。在与员工协商隐私时，对组织侵权的担忧是影响信任的主要因素。他们得出结论，良好的隐私管理能够在工作关系中产生信任，并鼓励员工强烈的承诺和合规动机与意愿。


    在移动商务背景下，研究人员发现，对感知控制边界和未经授权访问个人信息的担忧会对消费者使用移动商务产生负面影响。当消费者信任商务合作伙伴时，他们对共享个人信息的担忧较少
    79。因此，向个人告知数据处理的范围以及对未来数据使用的明确同意确认，不仅是 GDPR 下的法律要求，而且还可能增强消费者信任，从而改善业务。


    ## 9. 如何说服他人


    说服是一种旨在影响信念、价值观、态度、意图、动机和行为的沟通形式。进行说服需要发送者、媒介和接收者。发送者有一个目标，并打算通过沟通实现该目标。接收者不是偶然或被强迫而被说服的。说服取决于接收者所处的环境、消息的内容和形式，以及发送者的可信度。在网络安全领域，我们投入大量精力试图说服他人。本章讨论的理论为更好地理解说服过程中涉及的过程提供了锚点。


    ### 9.1 营销


    营销是一门起源于市场上商品销售或以物易物的学科，此后已发展成为一门科学，侧重于向客户提供附加值并维护良好关系。营销理论与心理学、社会学、经济学、社会科学、创意艺术以及统计学相关。在影响行为方面，营销理论为网络安全提供了有用的见解。毕竟，组织都在努力说服人们使用安全程序、工具，并以某种方式行事。


    最传统的营销模型之一是 AIDA 模型（归因于 E. St Elmo Lewis，约 1898 年）。该模型描述了客户需要经历若干步骤：**关注-兴趣-欲望-行动**。首先需要吸引人们的注意力，例如，大声喊叫：“好吃的苹果”。然后，客户必须产生兴趣：“来自最好的树，非常新鲜”。当客户品尝苹果或看到别人享受它时，兴趣就转变为欲望。最后一步是实际购买行为。此模型此后启发了许多其他营销模型。如今，营销不再止步于购买行为，而是致力于延伸的“客户旅程”，其中包括购后体验。在现代营销模型中，忠诚度和产品拥护已成为营销的最终目标。如今，客户对
    f 因素（朋友、家人、Facebook 粉丝和追随者）的信任，超过了对营销传播的信任 80。人们倾向于在社交媒体上向朋友征求建议。客户在营销活动中不再被视为“目标”。客户现在被视为品牌或产品的同伴和朋友。拥护者讲述积极的故事，并向同伴提供建议。他们成为布道者。


    Kotler 80 将原始 AIDA 扩展为五个 A，以更好地适应我们现代互联社会。步骤现在是：认知（我知道）、吸引（我喜欢）、询问（我确信）、行动（我购买）和拥护（我推荐）。


    AIDA 模型及其新变体帮助我们影响员工行为。将安全意识计划作为符合标准和法规的勾选练习的组织，只需让目标群体接触其信息和培训课程即可，无需做更多。当我们旨在让员工采取行动并再次行动（例如定期更改密码）时，应让员工经历从意识到行动的所有阶段。但是，旨在实现结构性变革和持久行为的组织需要采取额外步骤，以实现员工对安全行为的忠诚和拥护。多项研究发现，观察同伴的安全行为能激励追随者的安全行为
