    不同学科专家之间协作的复杂性在我的博士论文²⁵中有更详细的描述。对我们工作领域最广泛的视角可以用多层模型来描述。我们试图管理的许多风险不仅影响 ICT 和企业。人员、ICT
    和组织与文化规范及伦理的全球纠缠，要求风险方法比技术或业务风险更广泛。网络安全风险不是一种可以单独识别和控制的“事物”。它部分与危险和烦恼以及规范和价值观的感知相关。形成我们工作领域的不同视角和学科在图
    5 中汇聚。图中中心方框说明了对 ICT 的传统关注。它主要是计算机科学、数学和工程的领域。当今，我们可能还希望将运营技术（OT）放入这一层。在这种观点下，安全风险是威胁系统机密性、完整性或可用性的技术风险。这些风险可以通过安装工件和机制以及使用标准和检查表来控制。在中心周围，来自商业社会学、政治和人文学科的日益增长的洞察力补充了技术范围。这些不同的流派增强并启发了该领域。安全思维已从技术控制的概念扩展到社会技术复杂性。这并不意味着一方可以取代另一方：不同的感知互相补充，理解风险需要所有这些观点。风险包括技术风险、业务风险和社会风险的全部。技术风险（例如关键基础设施因技术问题停止工作的风险）可能导致业务风险（当依赖该基础设施的组织无法完成生产时）。反过来，这些风险可能导致社会中人员和群体面临风险。为了说明环境和系统周围边界的消失，技术区域周围的方框使用虚线，外部文本完全没有边框，以象征安全问题的普遍性。


    图形外部区域与社会风险相关。通过研究信息社会话语，可以识别并更好地理解这些风险。从研究乌尔里希·贝克、曼努埃尔·卡斯特尔斯、扬·范·戴克或大卫·里昂等信息社会思想家的作品，我们可以了解到，通过社会技术网络中的连接，安全风险的范围是全球且无限的。此外，风险可能是经济的（影响股市）、个人的（身份盗窃、社会不平等、社会关系受损）、政治的（推翻政府或损害国际关系），并且有可能影响基本人权（不受打扰的权利、言论自由）。信息社会理论告诉我们，社会安全风险的感知可能是由国际权力和权力斗争、（缺乏）公共信息政策、大众媒体和文化社会建构的。


    我们面临一项艰巨，甚至可能是不可能的任务，即将所有这些学科汇集到一个我们试图用网络安全一词来界定的领域中。然而，由于技术风险可能威胁我们的人权和人身安全，我们必须找到一种跨学科、跨国家合作的方式。


