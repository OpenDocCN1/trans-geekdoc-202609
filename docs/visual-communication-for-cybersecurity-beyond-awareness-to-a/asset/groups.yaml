    # 7.1 Bloom''s taxonomy


    In the 1950s, Benjamin Bloom, together with a group of scholars, developed a classification
    of educational goals known as Bloom''s Taxonomy of Educational Objectives40. In
    2001, key elements of the taxonomy were updated to reflect more relevance to 21st-century
    educational goals41. The taxonomy classifies three areas of learning: the cognitive
    domain (knowledge), the affective domain (emotion), and the psychomotor domain
    (actions). The cognitive domain consists of six levels of learning objectives:


    Table 1 Bloom''s levels of learning objectives.


    | Bloom''s level (version 2001) | Learning objective | Related verbs |

    |---|---|---|

    | **Create** | Produce something new | Design, forecast, reorganize, construct,
    conjecture, develop, author, investigate |

    | **Evaluate** | Justify a stand or decision | Argue, defend, select, support,
    value, critique, weigh, estimate, classify, assess, check, appraise |

    | **Analyse** | Connect ideas or break them down. | Organize, relate, inspect,
    investigate, compare, distinguish, experiment, question, test, examine |

    | **Apply** | Use information in new situations | Execute, compare, implement,
    solve, use, demonstrate, interpret, operate, schedule, sketch |

    | **Understand** | Explain ideas or basic concepts | Classify, describe, discuss,
    explain, identify, locate, recognize, report, select, translate |

    | **Remember** | Recall facts and basic concepts | Define, duplicate, list, memorize,
    label, locate, repeat, state |'
