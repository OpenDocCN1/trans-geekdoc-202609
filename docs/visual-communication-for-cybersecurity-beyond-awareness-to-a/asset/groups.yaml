  mdcn: "\n\n## 2. 意识宣传活动：脱节与偏离\n\n安全意识是组织为了满足 ISO 27001、CobiT、PCI DSS、GDPR、HIPAA\
    \ 以及更多⁴ 等信息安全相关标准和法规的合规要求。这些标准和法规中的大多数明确要求组织为员工和承包商实施保护宝贵信息的沟通和意识计划。这催生了一个利润丰厚的市场，供应商销售意识培训、海报、教育游戏、宣传活动等等。\n\
    \n牛津词典⁵ 将 awareness 定义为：\n- 1. 对某一情况或事实的知识或感知。\n  - ‘我们需要提高公众对该问题的认识’\n  - ‘人们对风险缺乏认识’\n\
    - 2. 对特定情况或发展的关切和了解充分的兴趣。\n  - ‘日益增长的环保意识’\n  - ‘他的政治意识逐渐形成’\n\n遵循牛津定义，安全意识是知识和意识的同义词。知识与安全行为之间不存在显著关系⁶⁻⁸。尽管如此，许多网络安全专业人员表示，人类是安全领域中最薄弱的环节，应该接受培训以改变其行为。组织策划定期的意识活动，例如电子学习、钓鱼邮件模拟或海报，以遵循标准和法规的要求，并通过提供活动证据来满足合规审计师关于“改善知识和关注”的要求。然而，如果意识计划被视为走过场的任务，它们并不总能导致所需的行为⁸，同样，“通过恐吓、欺骗和欺凌用户来实现安全行为”⁹\
    \ 也起不到作用。\n\n> 了解安全风险和解决方案并不总能让人们实际使用这些方案。\n\n当沟通被视为合规或警务任务时，组织内的员工将继续将网络安全视为一种必要之恶。审计师并非网络安全需要满足的唯一受众。我们工作的真正评判者是那些处理宝贵信息的人，例如销售人员、信息技术（IT）人员、经理或人力资源人员。不幸的是，这一受众似乎并不喜欢网络安全专业人员。一项对英国和德国\
    \ 200 家组织的 IT 安全领导者进行的调查显示，84% 的人对其组织内部的网络安全团队持负面态度¹⁰。三分之一的人甚至觉得自己被视为“危言耸听者”。这种负面态度阻碍了协作和网络安全创新。\n\
    \n要创造一个更安全的工作场所，人们不仅需要知道并关注安全，还必须开始根据这种意识行事。在营销模型中，意识只是导致客户实际采取行动（购买产品）过程中的第一步。与网络安全类似，意识只是真正改变行为过程中的第一步。当我们拥有安全解决方案时，意识只是通过广告和宣传活动来吸引注意力的阶段。在这种情况下，安全意识绝不能成为目标。它只是一段更长旅程中的第一步。\n\
    \n## 安全意识不是最终目标，它只是起点。\n\n我们需要设定更高的目标。现代营销模式不再满足于购买产品的客户。之后的阶段是客户充当品牌拥护者并向朋友推荐产品。当我们将此应用于网络安全时，不应该将同事视为最薄弱的环节。这些人是安全的潜在拥护者。朋友和社会过程对安全行为的影响大于任何其他策略。人们通过诸与同龄人讨论新威胁以及观察他人如何使用安全功能等触发因素而改变¹¹⁻¹⁴。人们需要能够就其使用计算机和共享数据的方式做出明智的选择，互相提供关于如何安全行动的清晰说明，将安全作为其网络活动中的常规，并让他们作为网络安全行为的拥护者关心同事。这始于对网络安全专业人员的信任，并让最终用户参与安全解决方案的设计。\n\
    \n## 工作伙伴宾果\n\n安全是每个人的责任。要保持警惕，并意识到网格中的所有陈述都是安全失职。请留意，看是否有任何同事犯下这些失职之一。\n\n请记住，只有在向涉事人员或其直属经理指出安全失职后，才能在你的工作伙伴宾果卡上盖章。\n\
    \n> **将此卡放在所有人都能看到的地方**\n\n| 办公室内不佩戴通行证 | 离开办公室时未取下通行证 | 电脑未锁定即离开座位 |\n| --- |\
