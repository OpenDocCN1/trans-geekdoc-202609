    # 5. Conclusion


    It may seem ambitious to write a book that combines two fields that are fuzzy,
    widely misunderstood, multi-disciplinary, as well as multi-dimensional. At the
    same time, cybersecurity and visual literacy have in common that they require
    similar cognitive functions such as critical thinking, visualizing, deduction,
    complex problem solving, and reasoning. Cybersecurity professionals are likely
    to possess the skills required for visual communication but lack the training
    to confidently use it. Cybersecurity suffers from communication problems such
    as the absence of a common langue and an obscure image. This is impeding the progress
    of the field and obstructs the path from security awareness to advocacy.


    Recently, a more positive vibe towards cybersecurity amongst the general public
    is certainly noticeable. Consumers, educators, parents, and politicians ask more
    questions and debate publicly about cybersecurity and privacy. Mass media and
    social media have contributed to the dispersion of stories of cybercrime and the
    interest from a wider audience. News stories about data breaches, identity theft,
    or cyberattacks by foreign governments attract attention. One explanation is that
    news stories offer a learning experience and, as a result, the public becomes
    more informed. The media has a wide reach to different audiences and many different
    channels to deliver news stories, opinion, and background articles. Communication
    theorists attribute the influence of mass media on public opinion and behaviour
    to the power of visual illustrations. Mass media traditionally use visual communication
    to illustrate, attract attention, and to explain a sequence of events. Cybersecurity
    professionals in organizations could benefit from these techniques to gain the
    interest from the audience within their organization. Unfortunately, cybersecurity
    education does not usually include communication theory or visual design classes.
    Producing clear, organized visual communication requires visual insight. The problem
    is that there remains an outdated bias that visual production is a vocational
    and not an intellectual process³⁸, and at the same time, there remains an outdated
    bias that cybersecurity is an intellectual and not a vocational profession. The
    reality is both are needed to create progress in cybersecurity.


    Visual communication is a tool that supports each step of the way that leads us
    from the first impressions of cybersecurity to knowledge and awareness to advocacy.
    When applied strategically, visual communication can contribute to a people-centric
    approach to security, where employees are encouraged to make informed security
    decisions, take personal accountability, and actively engage in security activities,
    rather than simply complying with the policies³⁹. This will result in cybersecurity
    products and services that are transparent, accessible, visually clear, useable,
    understandable, useful, and engaging. Ultimately, this will advance the development
    of the discipline.'
