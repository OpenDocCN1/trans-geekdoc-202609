    # 8.5 Communication privacy management theory


    Communication privacy management theory (CPM) is about the way people make decisions
    about revealing and concealing private information76. It describes that people
    control their private information based on personal rules. Individuals believe
    they own their private information and have the right to control it. They share
    the information based on their personal privacy rules. When people share information,
    it means that others are given co-ownership status. As a result, individuals are
    potentially able to disclose not only their own information but also information
    that belongs to others. Therefore, the information needs management.


    There are three main components to manage private information: privacy ownership,
    privacy control, and privacy turbulence. Privacy ownership means people believe
    they own their private information and can choose to whom they will deny or provide
    access to their private information. Privacy control represents the management
    process of providing or denying access to private disclosures. Because the original
    owner believes they own the information, they also believe that they control access
    to it even after authorizing co-owners. Privacy turbulence occurs when personal
    boundaries with private information overlap with boundaries for public disclosure.


    CPM is used to frame studies on family communication, health (such as studies
    into wearable devices and sharing of personal health information), social media
    (sharing personal data in social networks), big data collection, e-commerce, and
    in studies of the workplace (employee surveillance). CPM has become very applicable
    in the workplace as personal mobile devices are increasingly allowed at work.
    The concept of Bring Your Own Device means that employers have to set rules for
    privacy and security. Companies have to take measures to secure their network.
    At the same time, some employees feel that companies should not be able to track
    what is being done on their personal devices or even on company computers even
    if they are in the work place77.


    A study amongst employees in Taiwan78 found that employees feel limited privacy
    in an organizational culture that is controlling. The researchers suggest that
    organizations better avoid excessive control to improve the negotiation of the
    privacy boundary between employees and employers. In negotiating privacy with
