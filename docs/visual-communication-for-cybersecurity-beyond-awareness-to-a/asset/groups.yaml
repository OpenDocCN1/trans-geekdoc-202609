  - '[PAGE 132]


    # Introducing the psychology of passwords


    LastPass^199

    Copyright: permission from LastPass


    This infographic shows the results of a survey by LastPass and Lab42. The survey
    about attitudes and behaviours around password security found that although people
    know what safe passwords should be, they tend to ignore this knowledge in favour
    of using easy-to-remember passwords, because the fear of forgetting is stronger
    than the fear of being hacked. Furthermore, the personality traits that normally
    define us seem to have little bearing on our poor behaviour but do help people
    rationalize it.'
  - '[PAGE 133]


    # # THIS IS YOUR BRAIN ON PASSWORDS


    Does the theory of cognitive dissonance also apply to our digital behavior? You
    know it''s bad for you, but you do it anyway. Although more malicious continues
    to make headlines, we have changed how we protect our digital life.


    > **Cognitive Dissonance** is the psychological conflict resulting from an individual''s
    performing an action that contradicts his or her attitude, belief, or value.


    # ## WHAT YOU KNOW


    # ## WHAT YOU DO


    +   - **59%** know secure passwords are important

    +   - **91%** understand the risk of using the same passwords

    +   - **2/3** feel their password managing is weak

    +   - **75%** consider these threats important yet still take risks

    +   - **72%** consider their passwords to be secure enough to protect their online
    information

    +   - **47%** are afraid of someone stealing their passwords

    +   - **Women are more afraid than men**: 55% | 39%


    +   - **41%** choose a password that is easy to remember

    +   - **61%** visit the same few passwords

    +   - **55%** do not even thought about changing their passwords

    +   - **Millennials 85%** | **Generation X 82%** | **Baby Boomers 45%**

    +   - **The strongest passwords**: Icons shown for 69%, 43%, 31%, 20%

    +   - **Easy to crack info**: 47% Pet names... 42% Significant dates/numbers 26%
    % pets 21% holidays 14% hometowns 13% children names/names


    # ## WHAT YOU REMEMBER


    # # WHY YOUR PERSONALITY WILL GET YOU HACKED


    When it comes to online security your personality type may not inform your behavior,
    but it does reveal how you rationalize your bad password habits.


    # ## TYPE A


    Bad password behavior in Type A personalities stems from a desire to feel in control
    even though passwords, they don''t believe they are actually at risk because of
    how well organized system are and proactive efforts.


    +   - **CONTROL** 35% Retake because they want to remember all passwords

    +   - **DETAIL-ORIENTED** 49% Have a personal "system" for remembering passwords

    +   - **DELIBERATE** 2/3 Are proactive to help keep personal info secure

    +   - **DRIVEN** 86% Having a strong password makes you feel like you''re protecting
    yourself and your family


    # ## TYPE B


    Type B personalities rationalize their bad behavior by comparing it to actions
