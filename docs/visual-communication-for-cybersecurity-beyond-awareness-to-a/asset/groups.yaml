    the best practice for a secure software development. Most organizations follow
    their own software development method, and the best practices for secure development
    conflict with their team members’ roles and responsibilities. Many organizations
    find it unreasonable to change their structure in order to comply with these best
    practices⁵⁸. Among the teams that were observed, only one considered security
    as a part of the design stage of the development process. Many of the other teams
    stated that they are not re-

