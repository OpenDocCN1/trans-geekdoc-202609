    # # Step 4 and Step 5: Prototype and test


    Cut out your team''s doodles and pictures and start organizing them on a paper
    next to the definitions of the jargon. This creates a prototype of your visual
    library. You can test the dictionary on different people in your organization.
    What is their opinion? Do they understand the icons and the definitions? You could
    maybe re-visit the people that you met during Step 1 and ask them what they think.
    With this feedback, you can improve your dictionary.


    When your team is happy with the results, it is time to go digital. You can re-draw
    your icons yourself with your tool of preference.


    It is important to publish your dictionary for everybody to find. And use it consistently:
    use your icons in your documents, presentations, and on your webpages. The more
    you use them, the more feedback you will receive. If they are not clear, get outdated,
    or become a topic of discussion: go back to Step 1. Change them. Improve where
    necessary. Remove words that you do not use any more and add new ones that have
    become important over time.


    The more you use the icons, the more people start recognizing cybersecurity messages.
    You may win over a few new stakeholders. Use the positive reactions in discussions
    with your manager. Maybe the positive response will finally convince her that
    visual communication helps to engage other people with cybersecurity.'
