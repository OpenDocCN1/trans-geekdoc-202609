    ![](img/7ffc38f932cabd3a29392ff94c7e70f0_14_1.png)


    ### 我们只需培训


    ![](img/7ffc38f932cabd3a29392ff94c7e70f0_14_2.png)


    ### 1. 形象与刻板印象


    若在线搜索“网络安全”，出现的图片中常有戴兜帽的男性盯着电脑屏幕。你能找到的新闻报道和视频主要讲述网络犯罪和网络战争。这导致公众认为网络安全仅关乎黑客攻击、战争和戴兜帽的男性。这种形象不利于与更广泛的公众互动，也不利于吸引更多元化的劳动力。公众形象暗示网络安全主要由男性和技术人员构成，并未代表那些共同应对复杂网络安全挑战的其他学科。这不仅会导致公众对其在线行为风险缺乏兴趣和参与，也会导致全球数以百万计的网络安全职位空缺难以填补。有些预测称，这一数字可能在
    2021 年增至 350 万¹。除了公众形象之外，该领域在组织内部的形象也同样糟糕。网络安全部门被视为对业务需求动辄说‘不’的部门，总是在检查和监视同事。网络安全同事被认为爱管闲事，并用他们的清单和要求拖慢项目进度。最后，有时在出版物中用来说服决策者的经典军事隐喻²会“在我们脑海中触发非常具体的画面”，从而导致错误的认知。


    > 网络安全保护的远不止是计算机，它所涉及的远不止是计算机科学。


    网络安全是一项多学科团队协作工作。它是一个整体生态系统，不仅保护数据的机密性、完整性和可用性，还旨在保护我们的民主价值观乃至人权。心理学、行为学、政治学、立法学和管理学方面的知识与编码、威胁狩猎和加密同样重要。所需技能涵盖从学术到职业技能，涉及数学、计算、法律、工程、社会科学和政治学，以保护我们的经济和社会。摆脱戴兜帽的形象，转向更多元化的刻板印象，将更容易吸引更多元化的劳动力。许多任务可以在工作中学习，具有分析思维、创造力、沟通技巧和复杂问题解决能力等技能的自驱型人员在网络安全领域可以拥有出色的职业生涯。


    ### 网络安全专业人员需要改变其自我呈现的方式。


    公众的刻板印象形象部分受电影和新闻报道影响。网络安全专家可以利用同类媒体，将公众刻板印象引导向更现实的形象。网络安全并非‘可怕、令人困惑和枯燥’。网络安全专家并非为了对新业务倡议说‘不’。要克服关于网络安全的误解，我们需要与受众建立信任，并采用引人入胜的沟通技巧。网络安全是创造新机遇的领域。


    ![](img/7ffc38f932cabd3a29392ff94c7e70f0_16_0.png)


    图 1 对“网络安全”进行互联网搜索，将显示与此主题类似的图片：一个人穿着兜帽或戴着面具，身旁有一个或多个屏幕，背景昏暗阴郁。


    '
