    ## Steps 3 and 4: Ideas and prototypes


    As steps 3 and 4 are closely related, it makes sense to combine them in this case.
    With your team, you can start organizing your list of stakeholders. There are
    different options thinkable:


    - Formal versus informal stakeholders

    - Internal versus external to the organization

    - Individuals versus groups

    - Visible (in your team) versus invisible (contributors such as support teams)

    - Stakeholders of your stakeholders

    - Influencers versus followers


    The result may look like a mind map, spider''s web, or network diagram showing
    who is related to who. For instance, suppose you know a person who is a gifted
    storyteller and always uses that technique in presentations. You are not connected
    to that person through work and have never met her in person. You can still add
