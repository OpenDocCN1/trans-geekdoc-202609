    ## 密码心理学简介


    LastPass^199

    版权：经 LastPass 授权


    此信息图展示了 LastPass 和 Lab42 进行的一项调查结果。关于密码安全态度和行为的调查发现，虽然人们知道安全密码应当是什么样，但他们往往倾向于忽视这些知识，转而使用容易记住的密码，因为害怕忘记的心理强于害怕被攻击的心理。此外，通常定义我们的人格特质似乎对我们不良的密码行为影响甚微，但确实有助于人们为其行为找借口。


    ## 这就是你的大脑在面对密码时的状态


    认知失调理论是否也适用于我们的数字行为？你知道这对你有害，但你还是照做。尽管更多恶意行为继续登上头条，但我们改变了保护数字生活的方式。


    > **认知失调**是指个体从事与其态度、信念或价值观相悖的行为而产生的心理冲突。


    ### 你知道什么


    ### 你做什么


    - **59%** 知道安全密码很重要

    - **91%** 理解使用相同密码的风险

    - **2/3** 觉得自己的密码管理很薄弱

    - **75%** 认为这些威胁很重要，但仍会冒风险

    - **72%** 认为自己的密码足够安全，足以保护其在线信息

    - **47%** 害怕有人窃取其密码

    - **女性比男性更害怕**：55% | 39%


    - **41%** 选择容易记住的密码

    - **61%** 使用相同的几个密码

    - **55%** 甚至不考虑更改自己的密码

    - **千禧一代 85%** | **X 世代 82%** | **婴儿潮一代 45%**

    - **最强密码**：图标分别显示 69%、43%、31%、20%

    - **容易被破解的信息**：47% 宠物姓名……42% 重要日期/数字 26% 宠物 21% 节日 14% 家乡 13% 孩子的姓名


    ### 你记得什么


    ## 为什么你的人格类型会导致你被攻击


    在在线安全方面，你的人格类型可能不会决定你的行为，但它确实揭示了你如何为自己的不良密码习惯找借口。


    ### A 型人格


    A 型人格的不良密码行为源于想要感觉自己有控制欲的渴望，尽管就密码而言，他们并不认为自己实际上面临风险，因为系统组织良好且采取了主动措施。


    - **控制欲** 35% 重新设置密码是因为他们想记住所有密码

    - **注重细节** 49% 有自己记住密码的“系统”

    - **深思熟虑** 2/3 采取主动措施来帮助保护个人信息安全

    - **有动力** 86% 拥有强密码会让你感觉自己在保护自己和家人


    ### B 型人格


    B 型人格通过将其行为与他们认为更危险的行为进行比较来为其不良行为找借口，这使他们成为黑客更大的目标。这使他们能够保持对密码安全随意、漫不经心的态度。


    - **漠不关心** 45% 认为自己的账户不够有价值，不值得黑客花时间去攻击

    - **漫不经心** 43% 优先选择容易记住的密码，而不是安全的密码

    - **灵活** 1/2 觉得仅仅因为害怕密码泄露就需要限制自己的在线活动

    - **心事重重** 86% 觉得除了弱密码之外的其他事情可能会危及其在线安全


    ## 不要只重置你的密码，要重置你的思维


    正确管理密码可以是一种快速的行为调整，能够带来长期的好处。


    ## LastPass...


    无论你是什么人格类型，LastPass 都可以帮助你以方便且安全的方式管理密码。LASTPASS.COM


    ## 20. 网络安全艺术


    网络安全日益成为电影、博物馆展览和艺术数据可视化等主题的灵感来源。幸运的是，越来越多的企业与设计师和数据艺术家合作，利用不同的艺术形式和技巧，为意识宣传活动创造替代方案。与受过训练的艺术家合作，能够提供创新且情感引人入胜的方法，引起人们对该领域复杂性和技术对社会影响的关注。艺术有能力表达恐惧、困惑、乐观或热情等情感。通过艺术，观众可以理解并感受到网络安全的局限性和可能性。本章将介绍一些网络安全专家与专业受训艺术家合作的项目。


    ### 20.1 摄影


    本书第一章指出，媒体经常将网络安全专家描绘成穿着连帽衫的神秘人物。在荷兰，名为“黑客握手”的摄影展向公众展示了更真实、更多样化的形象。“黑客握手”是 Tobias
    Groenland200 的一个项目。他开始调查黑客圈，原本期望他们能证实刻板印象。然而，他发现了一群拥有共同技术热情的多样化个体。展览中的 16 幅肖像讲述了乐于助人的黑客的故事，他们寻找、发现并报告计算机系统中的漏洞，以改善安全性。他们首先将调查结果报告给易受攻击系统的所有者，然后再报告给与该系统相关的黑客社区、政府和企业，这种做法被称为负责任披露（Responsible
    Disclosure）或协调漏洞披露（Coordinated Vulnerability Disclosure201）。


    2014 年至 2018 年间，Tobias Groenland 和作者 Chris van ’t Hof 收集了黑客将其技能用于善举的故事。Chris van
    ’t Hof 撰写了讲述肖像背后故事的文字，并出版了一本名为《乐于助人的黑客》（Helpful Hackers）202 的书，描绘了荷兰黑客和负责任披露的概念。这项作品背后的信息不仅有助于塑造网络安全专家真实、诚实的公众形象，还可能邀请拥有先进技术技能的年轻人选择将其技能用于善举，而非涉足网络犯罪。


    ![](img/7ffc38f932cabd3a29392ff94c7e70f0_135_0.png)


    黑客握手摄影展。

    摄影师：Tobias Groenland (https://www.tobiasgroenland.nl)。

    图片版权 © Tobias Groenland。


    在拍摄过程中，摄影师要求被摄者思考编码。在他们的脑海中，他们可能正在扫描漏洞或进行 DDoS 攻击，因此他们可能通过自己的目光向更广泛的观众展示自己的一些方面。


    ### 20.2 数据艺术


    自 2008 年 Raffael Marty 出版《应用安全可视化》一书以来¹²¹，网络安全数据可视化已进一步发展。我们甚至可以看到一种新兴趋势，即网络安全数据转化为艺术。然而，数据艺术与数据可视化不同。数据艺术并不旨在展示确凿证据和解释数据结构，而是创造视觉体验或寻求新的呈现方法²⁰³。数据艺术家获取数据，并从中创作新的构图。


    《知识即美》《信息即美》等书籍及其支持网站¹⁴⁹,²⁰⁴,²⁰⁵，或 Manuel Lima 的作品集，其中包括《树之书》²⁰⁶、《圆之书》²⁰⁷和《视觉复杂性》²⁰⁸，为以美丽的方式可视化数据提供了新的灵感，而这些书中的许多示例很难将解释性数据可视化与数据艺术区分开来。


    科技企业越来越多地与艺术家合作。趋势科技（Trend Micro）委托全球的数据艺术家将真实的趋势科技数据转化为艺术作品²⁰⁹。它们可以免费下载为屏幕保护程序。


    ![](img/7ffc38f932cabd3a29392ff94c7e70f0_136_0.png)


    Brendan Dawes 的《随时间检测并阻止的未知威胁》^210。

    版权所有 © [2019] 趋势科技公司。保留所有权利。


    ![](img/7ffc38f932cabd3a29392ff94c7e70f0_136_1.png)


