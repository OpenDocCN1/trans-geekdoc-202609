    after specific combinations of training methods, so none of the training method
    combinations performed better than another. The participants had different opinions
    on the training methods, therefore awareness campaign designers should include
    a variety of learning methods to meet the learning style preferences of the participants.


    What studies such as those mentioned above lack is the measurement of effectiveness
    of the training over a longer period of time. Several studies suggest that the
    effect wears off after 28 days⁵⁵, but not enough studies that include repeated
    campaigns over a longer period of time have been conducted. One study in healthcare⁵⁶
    measured the effect of 20 simulated campaigns, combined with mandatory phishing
    training, over nearly three years. They found that there was some reduction in
    click rates, but the number of susceptible employees remained high. An additional
    mandatory phishing training was introduced for a specific group within the participants
    after 15 rounds of phishing campaigns. The training did not lead to a significant
    decrease of the click rates in round 16 to 20 by this group and there was no difference
    in results from the group that did not undergo the training course.


    We need a lot more evidence before we can draw any conclusions about the effectiveness
    of phishing training through mock-phishing simulations and additional training.
    We are only just beginning to learn about teaching cybersecurity concepts and
    the long-term effectiveness of training and more research into the effect of training
    should be conducted.


    ## 8. Context in which communication takes place


    Effective communication requires knowledge of the environment where the communication
    takes place. Most cybersecurity professionals will focus on communication within
    their organization. Internal communication is a continuous process of exchanging
    and interpreting messages between members within that organization. This type
    of communication strongly depends on organizational structure and culture. Before
    planning communication activities, it is important to understand the organization.


    Organizations can be described by six variables⁵⁷:


    - 1. Goals: why does the organization exist?

    - 2. Strategy: how the organization reaches its goals

    - 3. Structure: the division of tasks

    - 4. Culture: unwritten rules that exist within the organization

    - 5. Technology: machines, ICT, procedures, and tasks

    - 6. People: people that work in the organization


    Although all six variables influence internal communication, the following paragraphs
    are limited to structure and culture because these topics are highly relevant
    to empathize with the people that we want to engage with.


    ### 8.1 Organizational structure


    The business goals and the division of labour in an organization influence security.
    The organizational structure can be an obstacle for security as well as a source
    for change. Take, for example, the concept of security by design, expected to
    be a common practice in software development. However, the reality in organizations
    does hardly match the best practices for secure software development.


