    61% 的人仍然继续使用相同或相似的密码，其中超过一半（55%）的人在充分理解风险的情况下仍然这样做。


    ## 9.5 助推理论


    助推理论常用于政治、医疗保健、营销和组织传播，以影响行为。助推是指对决策所处情境的微小改变。正如泰勒和桑斯坦 96 所定义的，助推是选择架构（可供选择的选项集合）的任何方面，它以可预测的方式改变人们的行为，而不禁止任何选项或显著改变其经济激励。改变选择架构使人们更容易做出符合自身利益的决策。一个著名的例子是厕所小便池上画的苍蝇。男性往往瞄准苍蝇，从而减少溅出和清洁成本。瞄准苍蝇不是强制性的，使用厕所的访客也没有特定的经济利益。他们仍然可以选择瞄准其他地方。另一个著名的助推是为对社区更有利的特定选择设置默认加入选项：例如，将器官捐赠或养老金储蓄计划设为默认加入。


    助推经常在网络安全领域被用来影响最终用户的行为。安全与隐私方面的助推在伦理、犯罪利用和设计方面面临一些挑战。人们担心助推会影响被助推者的福祉、自主性和尊严
    97。助推应该是为了公益而进行，但问题是，谁的公益？关于助推伦理存在持续的争论，尤其是在政府实施时。助推的危险在于人们可能被迫朝着政治或宗教方向发展。大多数人倾向于支持助推，只要它们旨在促进健康、安全和环境保护
    98。然而，有时助推是基于谎言和操纵的。网络犯罪分子可以利用助推诱导人们泄露个人信息、安装恶意软件，或点击看起来有吸引力但最终导致身份盗窃或欺诈的内容。另一个批评是，设计选择可能导致人们开始忽视风险。他们可能完全依赖默认设置，不再思考安全问题。


    表格列出了网络安全领域的一些助推示例。


    | 期望行为 | 刺激更好决策的助推 |

    |----------|-------------------|

    | 选择强密码 | 消息和密码强度计鼓励用户选择更强的密码或更强的安全问题。 |

    | 将默认设置更改为退出 | 设计软件以预先勾选允许用户退出使用其个人数据的框。互联网和移动应用用户几乎不会更改默认的安全和隐私设置。将默认设置更改为“不要向我发送新闻通讯”99
    几乎不会导致用户选择相反的、隐私保护程度较低的加入选项。 |

    | 保持个人数据私密 | 每天向人们展示智能手机应用程序访问其个人数据的频率，以激励用户更新隐私设置。 |

    | 激活隐私设置 | 有些社交媒体网站会显示图标或消息，让用户了解谁可以看到和分享他们的帖子以及如何更改这些设置。 |

    | 安装更新 | 通知用户安装更新，除非用户点击某个内容推迟，否则会自动安装更新。 |

    | 安全网上购物 | 警告消息提醒消费者在购物开始时安全浏览，以解释如何安全连接、如何找到可信赖的供应商，并在完成后登出 100。 |

    | 不活跃时使用屏幕锁定 | 一段时间无活动后自动锁定屏幕。 |

    | 使用可靠的 Wi-Fi 网络 | 对可用网络列表进行排序或颜色编码，将最安全的网络放在最上面 101。 |


    ## 9.6 计划行为理论


    计划行为理论（TPB）用于预测一个人在特定时间和地点采取某种行为的意图。该理论指出，要预测人们将要做什么，需要知道他们的意图。意图受态度、规范和感知行为控制
    102 的影响。态度是指一个人对某种行为持正面或负面评价的程度。规范是指主观规范和社会规范，例如，个人对某种行为的感知会受到父母、朋友、教师等人的评价的影响。感知行为控制是指个人对自己执行特定行为能力的感知。


    ![](img/7ffc38f932cabd3a29392ff94c7e70f0_62_0.png)


    图 11 计划行为理论。


    少数研究人员在网络安全领域使用了 TPB。澳大利亚研究人员调查了不同国家用户的在线安全行为，并发现感知行为控制是预期行为的最强预测因素 12。此外，社会规范也是一个强预测因素。这表明，一个人所属社会群体的影响对其是否打算采取安全行为或不采取安全行为有显著影响。这一结果与现代营销理论的观点相符，即客户被视为品牌或产品的拥护者。


