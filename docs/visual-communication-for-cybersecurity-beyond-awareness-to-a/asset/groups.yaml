  mdcn: "\n\n![](img/7ffc38f932cabd3a29392ff94c7e70f0_74_0.png)\n\n### 图 13 可视化有何帮助？\n\
    \n## 13. 可视化层次结构\n\n层次结构通常以树状图可视化。树可用于显示文本信息以及数值数据。树可视化有帮助的一些场景示例如下：\n\n- 显示分类法\n\
    - 显示亲属关系和血缘\n- 显示决策选项\n- 计算概率\n- 显示组织结构\n\n显示树的形式有很多种。基本形状包括水平或垂直树、矩形树图、圆形树图和放射状树。\n\
    \n| | | | |\n|---|---|---|---|\n| 树图 | 树状图 | 圆形树图 | 旭日图 |\n\n在树状图中可视化数据是呈现数据的最简单形式之一。此类层次结构可视化的许多示例可在学术文献和业务环境中找到。一些示例参考如下：\n\
    \n> **树图**：漏洞类别树图¹²³、木马家族树图¹²⁴（第 12 页）\n> **圆形树图**：子网中令牌和服务状态¹²⁵、软件定义网络中的活跃节点¹²⁶\n\
    > **故障树/攻击树图**：CORAS 风险分析模型¹²⁷、传感器云框架风险评估¹²⁸、CVSS 攻击图¹²⁹\n> **旭日图**：Mitre ATT&CK\
    \ 框架¹³⁰\n> **多方向树**：违规模式¹³¹、攻击反应性¹³⁰\n\n![](img/7ffc38f932cabd3a29392ff94c7e70f0_76_0.png)\n\
    \n### 信息事件场景开始时行为者及其位置的树图\n\n*Nicole van Deursen*\n\n该树图基于 2006 年至 2010 年间医疗保健组织研究中的数据²⁵。它显示，医疗保健组织内被调查的绝大多数事件（n=2108）始于内部员工（74%），大多发生在组织内部，但有时也发生在家中或患者家中。事件的其他主要起点为业务合作伙伴（2%）、软件/最终用户应用程序（5%），且许多事件（18%）原因未知。\n\
    \n### 行为者开始引发信息事件的位置\n\n- 建筑物\n- 业务合作伙伴\n- 硬件\n- 内部员工\n- 患者\n- 软件\n- 未知\n- 家庭成员\n\
    - 外部人员\n\n- 在场所内\n- 内部员工\n- 患者家中\n- 未知\n- 员工家中\n- 其他位置\n- 软件\n- 未知\n- 在场所内\n-\
    \ 未知\n- 员工家中\n- 其他位置\n- 业务合作伙伴\n- 其他位置\n- 患者\n\n![](img/7ffc38f932cabd3a29392ff94c7e70f0_78_0.png)\n\
    \n### 医疗保健信息风险的分类法\n\nNicole van Deursen，使用 Flourish 制作\n\n基于：25\n\n分类法是将具有相似特征的事物命名并组织成群组的系统。分类法通常按层次结构组织，包含不同层级的群组和子群组。本医疗保健信息风险分类法可视化展示了共同描述风险情景的类别（威胁、方法、弱点、事件和损害）及其子类别。\n\
    \n![](img/7ffc38f932cabd3a29392ff94c7e70f0_79_0.png)\n\n![](img/7ffc38f932cabd3a29392ff94c7e70f0_80_0.png)\n\
    \n### 软件保证成熟度模型\n\nOWASP\n版权：Creative Commons 署名-相同方式共享 4.0 许可证\n\n软件保证成熟度模型 (SAMM)\
    \ 是一个开放框架，帮助组织制定和实施针对其面临特定风险量身定制的软件安全策略。树状图概述了软件开发的核心业务功能，并将安全实践与每个功能相关联。该模型的构建基块是为每十二项安全实践定义的三个成熟度级别。\n\
    \n![](img/7ffc38f932cabd3a29392ff94c7e70f0_80_1.png)\n\n![](img/7ffc38f932cabd3a29392ff94c7e70f0_81_0.png)\n\
    \n### 让 CISO 忙碌的事是什么？\n\nNicole van Deursen\n\n旭日图可以作为项目符号列表式工作描述的替代方案。你甚至可以通过颜色和方框大小来指示你设定的优先级或占用大部分时间的任务。\n\
    \n![](img/7ffc38f932cabd3a29392ff94c7e70f0_81_1.png)\n\n## 14. 可视化流程与方向\n\n网络安全工作通常非常动态。流程和方向图有助于可视化工作流程以及对人员的期望。可视化有助于对一系列事件进行排序，也可以表达对未来的增长愿景。这些图表可以是方向性的、圆形的，或暗示某个过程。它们的共同点是代表某种形式的移动。\n\
    \n| | | |\n|---|---|---|\n| 流程图 | 蝎尾图 | 路线图 |\n| 地铁图 | 比较 | 时间轴 |\n| 圆形图 | 梯子图\
    \ | 泳道图 |\n| 鱼骨图 | Petri 网 | 成熟度模型 |\n| （交互式）路径图 | 螺旋图 | 桑基图 |\n\n本章未介绍的插图参考如下：\n\
    \n- **Petri 网：** FTP 攻击的 Petri 网建模结果^134，用于情境感知的物理系统和运营 Petri 网模型^135\n- **时间轴：**\
    \ Zeus 时间轴 (2007-2016)^136\n- **桑基图：** 虚拟基础设施^137\n- **成熟度模型：** 安全意识^138\n- **地铁图：**\
    \ 勒索软件家族^139\n\n![](img/7ffc38f932cabd3a29392ff94c7e70f0_84_0.png)\n\n### 欧洲网络安全月路线图\n\
    \nENISA¹⁴⁰\n版权：ENISA：授权复制本网站上发布的材料\n\n欧洲网络安全月 (ECSM) 是一项欧盟宣传活动，每年 10 月举行，旨在提高公民网络安全意识。它总结了未来的愿景：号召所有组织参与年度意识月。在通往未来的道路上，已有许多汽车，每辆代表参与意识月的一个合作伙伴。本书前一章讨论了消息呈现的格式塔原则。你在这张图片中识别出了哪些原则？\n\
    \n### 欧洲网络安全月通往未来的路线图...\n\n### ECSM 的增强内容：\n\n- 继续开发素材库\n- 继续鼓励公私合作活动\n- 在网站上引入最佳实践板块\n\
    \n### 进一步在欧洲和成员国层面发展稳定的协调模式：\n\n- 提前规划所有步骤并予以传达\n- 改善交互性\n- 改善内容和参与度\n\n![](img/7ffc38f932cabd3a29392ff94c7e70f0_85_0.png)\n\
    \n![](img/7ffc38f932cabd3a29392ff94c7e70f0_85_1.png)\n\n欧盟成员国 + 更多合作伙伴国家\n\n####\
