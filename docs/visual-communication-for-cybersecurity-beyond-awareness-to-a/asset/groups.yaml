    ## 23. Activity 2: Visual dictionary


    ### Assignment


    Imagine you have just finished your stakeholder map and during the time that you
    created it, you have met a lot of people who are enthusiastic about visual communication.
    Your manager is still not convinced. You decide that an example is necessary to
    support your case. The example you choose is a visual dictionary. Defining and
    visualizing your cybersecurity abbreviations and jargon is a good topic to start
    with. Cybersecurity experts use a variety of taxonomies and dictionaries. Different
    security dictionaries give different definitions to the same jargon. To support
    a shared language in your organization, you should choose one of those dictionaries
    and use it consistently. It is a good exercise if you decide to create your own
    dictionary. It is even better if you create it as a team building exercise, and
    it is a relatively easy topic to start with. Creating a shared language is important
    to engage with audiences outside the cybersecurity team and also for collaboration
    amongst your team of cybersecurity experts.


    A dictionary can be supported with icons and symbols. They are so powerful because
    they


    - Work anywhere. A well-designed icon has the potential for communicating across
    language barriers.

    - Cut through the clutter. Between all the words in print and online, an icon
    stands out to help readers navigate, guiding them to various kinds of content.

    - Create recall. Some organizations use icons to represent key information, like
    company values. Icons or symbols serve as ‘handles’ that employees can grasp when
    trying to recall information.

    - Invite interaction. Icons on websites draw attention and invite the visitor
    to look for more information.


    ## Step 1: Understanding and empathizing


    Call in your team. Which cybersecurity terms and abbreviations do you use? Does
    everybody know how to explain what these words mean? Together, make a list of
    jargon used in cybersecurity documents and presentation slides. What are the words
    that the experts threw at the people outside the team?


    With this list, go and interview some people outside the security department.
    Have they ever heard these words? Do they know what they mean? Are these words
    relevant for their job? Where would they go to find out the meaning of a word
    they do not know? How much understanding of cybersecurity concepts do they have?
    You can organize your findings in a list, in a 2 × 2 matrix, or write each finding
    on a post-it and stick it on the wall.


    | **Going well:** | **Could be better:** |

    |---|---|

    | Jargon easy to explain<br>and well understood | Jargon difficult to explain<br>and
    hardly understood |

    | **What goes wrong:** | **Miracles:** |

    | Jargon easy to explain<br>and wrongly understood | Jargon difficult to explain<br>and
    well understood |


    ## Step 2: Define the goal


    Define the goal of your visual dictionary. Will it be used for reference only
    or will it be used as a part of cybersecurity training? Is it for internal use
    only or will you publish it to third parties as well? Will it be presented in
    an app or online to explain privacy and security settings? Multiple goals might
    involve multiple types of audiences that, in turn, may require different communication
    styles and channels.


    ![](img/7ffc38f932cabd3a29392ff94c7e70f0_149_0.png)


    ## Step 3: Let your ideas out!


    Invite your team again and this time also invite representatives of your potential
    audience. Make sure you prepare the room. There must be enough space to walk around
    a little and to stick pictures to a wall. You will need paper, markers, sticky
    notes, tape, scissors, and so on.


    Together, think about possible options for the dictionary. What style of language
    will work? Formal or informal? Should you just give a definition or does the audience
    appreciate examples as well?


    ![](img/7ffc38f932cabd3a29392ff94c7e70f0_150_0.png)


    Adopt a beginner''s mindset. Start sketching with pen and paper. Make a list of
    definitions and start drawing icons. It may be difficult in the beginning: visual
    thinking is like muscle: it needs warming-up. If you can find inspiration in existing
    definitions and icons in other dictionaries, it is alright to copy them for the
    moment. At this point, it does not matter; they are likely to change or be dropped
    during the process (if not: check the copyright and pay the licence if necessary).
    You can find inspiration in icon libraries such as ²¹⁸,²¹⁹.


    - Here is a list of useful books that will help you to get started with drawing:

    - Dan Roam. Show and Tell. Penguin, 2014 ²²⁰

    - Sunni Brown. The Doodle Revolution. Penguin, 2014 ²²²

    - Willemien Brand. Visual Thinking. BIS Publishers, 2017 ²²¹

