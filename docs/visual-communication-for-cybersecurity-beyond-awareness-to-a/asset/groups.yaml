    ## 阻碍企业将信息作为业务资产进行管理的障碍


    Danette McGilvray, James Price, Tom Redman142 版权：经作者许可出版


    鱼骨图基于南澳大学Nina Evans博士和James Price143的工作。该图高层次展示了信息资产管理不善的根本原因。


    ### 最常观察到的根本原因


    Danette McGilvray / James Price / Tom Redman

    2016年10月


    ## 缺乏领导力和管理


    - 愿景

    - 战略

    - 指导原则

    - 政策

    - 管理体系


    - 缺乏开展工作的能力

    - 未投资于质量，增加成本并使数据使用工作复杂化

    - 不适当的文化（例如，直觉重于“事实”，信息不被视为资产）

    - 不适当的结构（例如，信息孤岛）

    - 对“谁负责什么”感到困惑

    - 缺乏主动领导。


    ## 不适当或无效的工具


    - 缺乏GAAP的等效物


    ## 缺乏意识 • 高管 • 从业者


    - 没有高等教育

    - 没有在职教育


    不知道如何将信息付诸实践


    ## 未得到妥善管理的信息资产


    - 客户体验

    - 组织对齐

    - 收入

    - 竞争优势

    - 生产力

    - 成本

    - 风险连续性

    - 发现

    - 安全


    ## 缺乏业务治理


    - 缺乏问责制

    - 缺乏所有权

    - 谁负责什么不清楚

    - 缺乏指导行动的度量


    ## 证明的困难


    - 市场不要求他们这样做

    - 管理信息资产的成本不被理解

    - 数据的价值取决于上下文，难以界定

    - 收益难以得出

    - 商业案例不能创造紧迫感


