  trans: '

    -   [拜占庭将军问题](https://en.wikipedia.org/wiki/Byzantine_Generals_problem)在拜占庭将军数量等于或超过总数的三分之一时，不存在解决方案。


    -   能够抵御拜占庭将军问题的共识协议称为拜占庭容错 (BFT)。


    -   工作证明 (PoW) 共识协议展示了这一能力。


    -   在 PoW 的情况下，拜占庭将军问题通过协议不需要网络中所有节点参与达成共识而得到解决。


    # 矿业的目的


    -   网络内共识的获得方式因区块链类型而异。


    -   因此，并非所有共识机制都适用于所有区块链。


    -   在比特币区块链的情况下，共识机制基于经济激励。


    -   通过矿业活动，节点被激励帮助达成交易共识，奖励以比特币形式发放（正如我们在讨论 PoW 时所看到）。


    -   这种经济激励体系对于公共区块链尤为重要，因为它使它们能够实现并维持自身架构的可持续性。


    # 区块链的不同类型


    -   区块链技术存在不同的实现形式，提供不同的功能和特性。


    -   事实上，区块链不仅可以根据所采用的共识协议进行区分，还可以根据其他特性进行区分，例如执行智能合约的能力。


    -   因此，让我们来看看当前存在的主要区块链类型。


    ### 公共区块链


    -   公共区块链是任何人都可以加入的区块链，无需根据网络内所扮演的角色获得权限。


    -   因此，公共区块链也被称为 `permissionless`（无需许可）区块链。


    -   公共区块链的例子包括 `Bitcoin`、`Ethereum`、`Litecoin` 等。


    ### 私有区块链


    -   在私有区块链中，网络内的读写权限分配给不同的用户群体。


    -   读取权限通常是公开的，或分配给不限定的用户群体，而写入权限则保留给预定义的用户群体或组织。


    -   因此，事务验证委托给预定义的节点数量。


    -   私有区块链的例子包括 `Gem Health` 网络、`Corda` 等。


    ### 联盟区块链


    -   在联盟区块链中，共识管理受限于预定义的主体群体。


    -   因此，事务验证不存在激励或经济奖励机制。


    -   与公共区块链相比，联盟区块链的事务验证时间更短。


    -   联盟区块链的例子包括 `Deutsche Boerse` 和 `R3`。


    # 作者简介


    -   Alessandro Parisi 作为 IT 专业人员已有 20 多年经验，在安全数据科学、人工智能网络安全以及区块链专家方面拥有显著经验。


    -   他曾在高度复杂的组织和决策环境中工作。


