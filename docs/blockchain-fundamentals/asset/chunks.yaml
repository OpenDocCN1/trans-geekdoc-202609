    这些决定随后被压缩在块中，而块构成了区块链的构建单元。


    # 块，区块链的构建元素


    区块链，顾名思义，仅仅是一个 `块链`。


    区块链的最简单单元实际上是由 `块` 构成的。


    每个 `块` 内包含一定数量的 `交易`，这些交易代表了在区块链内部对双方之间进行的价值转移。


    ## 块和交易


    每个 `块` 包含若干 `交易` 的批次及其哈希值。


    `块` 中包含的 `交易` 数量取决于 `块大小`。


    平均 `块` 大小约为 1 MB，但也可能更大，例如在以太坊的情况下。


    在比特币中，`块` 平均包含超过 500 个 `交易`。


    让我们现在看看 `块时间` 如何影响能够嵌入单个 `块` 中的 `交易` 数量和大小。


    ## 区块链块时间


    每个区块链都有自己的 `块时间`，即添加新 `块` 到区块链所需的时间大约是多少。


    `块时间` 影响了单个 `块` 内插入的 `交易` 数量。


    例如，如果区块链的 `块时间` 为五分钟，且在这五分钟内仅完成了四个 `交易`，那么 `块` 将只包含这四个 `交易`。


    ### 块时间与交易数量


    当 `交易` 数量超过 `块大小` 时，这些 `交易` 需要等待一个仍然打开的 `块`，该 `块` 仍有足够的空间容纳并插入它们。


    在比特币的情况下，`块时间` 为 10 分钟。


    这个值来源于比特币源代码中设定的限制。


    这些限制源自于在 2009 年至 2024 年期间最多发行 2100 万比特币的目标。


    矿工的报酬相应地每四年减半。


    ## 块的结构


    每个 `块` 由 `头`（header）和 `交易列表` 组成。


    每个 `块` 包含前一个 `块` 的哈希值，因此整个 `块` 链将所有 `块` 连接在一起。


    区块链的第一个 `块` 称为“创世块”。


    ### 块头


    `块` 的结构由 `块头` 表示。


    ![](img/file2.png)


    比特币 `块头`


    该数据结构包含一系列与 `块` 相关的信息，也称为元数据。


    *   前一个 `块` 的哈希值：该值用于计算即将添加到区块链的新 `块` 的相应哈希值；


    *   Merkle 根：它是与 `交易` 树根节点相关联的哈希值，用于检查 `块` 的有效性；


    *   时间戳：它是分配给 `块` 的时间戳；


    *   Nonce：一个任意值，用于 `块` 挖矿时使用。


    `块` 存储在一种称为 Merkle 树的树结构中。


    # 区块链交易 - 本质和特征


    区块链，顾名思义，仅仅是一个 `块链`。


    区块链的最简单单元实际上是由 `块` 构成的。


    每个 `块` 内包含一定数量的 `交易`，这些交易代表了在区块链内部对双方之间进行的价值转移。


    `交易` 必须经过矿工的确认阶段，矿工因其工作而获得比特币奖励。没有确认，任何 `交易` 都无法被验证。


    ![](img/file3.png)


    区块链整体流程


    ## 交易和分布式账本


    区块链的一个特点是它使得 `交易` 中介的介入变得多余。


    人们可以在没有第三方参与的情况下进行 `交易`。共享账本本身管理并确保参与方之间 `交易` 的 **完整性** 和 **可靠性**。


    账本由区块链的所有参与者以分布式方式维护和更新，所有参与网络的节点都可以在不诉诸于可信第三方的情况下验证 `交易` 的可靠性。


    让我们现在看看 **分布式账本** 的特性以及它是如何被管理的。


    ## 分布式账本


    从会计角度来看，账本仅仅是按时间顺序保存的经济 `交易` 登记册。


    它类似于银行和其他金融机构常用的账本，用于调节会计余额。


    账户期间的所有借方和贷方都会计算以准备会计余额。


    银行、金融机构和企业的资产负债表是使用账本内的会计记录编制的。


    当我们使用法币进行传统的 `交易` 时，我们有一个第三方账本来记录每个 `交易` 的信息。


    一些传统的第三方信任系统传统上由银行和金融机构（如 VISA、MasterCard 等）代表。


    区块链彻底改变了这种会计系统的管理方式，使得所有网络操作者都参与账本的编制。


    因此，账本也被称为 **分布式账本**：所有在区块链中进行 `交易` 的人也可以访问区块链中其他 `交易` 的登记，或正在发生的 `交易`。


    用于实现分布式账本的数据结构被称为 `Merkle 树`：


    ![](img/file4.jpg)


    Merkle 树


    基本上，它追踪树结构，其叶子对应于账本中记录的不同 `交易`；对于从根节点开始的每一条路径，都会计算相应的哈希值，这些哈希值的引用存储在 `块` 中。


    由于每个 `交易` 都与前一个 `交易` 相连，任何后续的变更都会被任何人通过重新计算相应的哈希值轻易识别。


    由于其分布式特性，这种去中心化的账本为每个发生的 `交易` 提供了多重真实性确认。


    区块链技术的一个关键属性是它鼓励对 `交易` 的 **全球** 和 **共享** **信任** 概念。


    ## 确保交易完整性


    在区块链中，如何保证 `交易` 的完整性？


    我们现在将分析用于实现区块链完整性的各种加密特性，如 **哈希** 和 **哈希摘要**，并突出它们与实际加密算法之间的差异。


    最后，我们将使用区块链实现中采用的基于 SHA 算法的类计算哈希摘要的实际示例，使用简单的在线工具。


    ### 哈希摘要：区块的指纹


    让我们先展示 `块` 的哈希摘要，它们被视为 `块` 的“指纹”。


    正如我们所讨论的，区块链中 `交易` 的完整性是通过使用哈希函数实现的。


    哈希函数属于一类算法，使得不同的字母数字字符串产生相同哈希值的可能性极低。


    哈希算法被专门设计为对输入数据的最微小变化都极为敏感。


    ### 加密和哈希：区别


    哈希算法的一个有趣属性是它们不可逆，与密码学算法不同。


    **可逆**在这里意味着可以使用解密函数将加密文本转换回其原始明文，这是加密函数的逆运算：


    ![](img/file5.jpg)


    加密与解密


    与密码学不同，哈希没有逆函数。


    这意味着我们无法将计算出的哈希值转换回其原始输入，因为哈希是由定义的单向过程。


