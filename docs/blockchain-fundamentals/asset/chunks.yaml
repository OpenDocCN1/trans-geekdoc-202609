- raw: 'These decisions are then condensed within the blocks, which constitute the
    building blocks of the blockchain.


    # Blocks, the building elements of Blockchain


    The Blockchain, as the name states, is nothing more than a **chain of blocks**.


    The simplest unit of a blockchain is in fact constituted by the block.


    Each block contains within it a certain number of transactions that represent
    the transfers of values ​​between the counterparties, carried out within the blockchain.


    ## Blocks and transactions


    Each block contains batches of transactions with their hashes.


    The number of transactions contained in a block depends on the **block size**.


    The average size of a block is about 1 MB, but it can even reach larger sizes,
    as in the case of Ethereum.


    In Bitcoin, a block contains **more than 500 transactions on average**


    Let’s now see how the **block time** affects the size and the number of transactions
    that can be embedded inside a block.


    ## Blockchain block time


    Each blockchain has its own **block time**, i.e. the approximate amount of time
    required to add a new block to the Blockchain.


    The **block time** affects the **number of transactions** that are inserted within
    the single block.


    For example, if the blockchain had a blocking time of five minutes, and there
    were only four transactions completed during those five minutes, the block will
    consequently contain only those four transactions.


    ### Block time and number of transactions


    In the event that there are too many transactions compared to the block size,
    the transactions should wait for a block still open, which has enough space left
    to accommodate and insert them within it.


    In the case of Bitcoin, the blocking time is 10 minutes.


    This value derives from the limits set in the Bitcoin source code.


    These limits in turn derive from the objective of issuing no more than 21 million
    bitcoins in the period between 2009 and 2024.


    Remunerations for miners are reduced accordingly by half every four years.


    ## The structure of the blocks


    Each block consists of a **header** and a **list of transactions.**


    Each block includes the hash of the previous block, thus the blocks as a whole
    constitute a chain that connects all the blocks together.


    The first block of the Blockchain is called “genesis block”.


    ### Block header


    The block structure is represented by the block header.


    ![](media/file2.png)


    Bitcoin block header


    This data structure contains a series of information relating to blocks, also
    known as metadata.


    *   Hash of the previous block: this value is required to compute the corresponding
    hash of the new block to be added to the blockchain;


    *   Merkle root: it is the hash value associated with the root node of the transaction
    tree, which acts as a check on the validity of the block;


    *   Timestamp: it’s the time stamp assigned to the block;


    *   Nonce: an arbitrary value that is used in block mining.


    The blocks are stored in a tree structure known as the Merkle tree.


    # Blockchain transactions - Nature and characteristics


    The Blockchain, as the name states, is nothing more than a **chain of blocks**.


    The simplest unit of a blockchain is in fact constituted by the block.


    Each block contains within it a certain number of transactions that represent
    the transfers of values ​​between the counterparties, carried out within the blockchain.


    Transactions must undergo the confirmation phase by miners, which are rewarded
    for their work in bitcoins. Without confirmation, no transaction can be convalidated.


    ![](media/file3.png)


    Blockchain overall process


    ## Transactions and Distributed Ledger


    One of the characteristics of Blockchain is that it makes the intervention of
    intermediaries in transactions superfluous.


    People can carry out transactions without third parties being involved. The shared
    ledger itself manages and ensures the **integrity** and **reliability** of transactions
    between the parties.


    The ledger is maintained and updated in a distributed manner by all participants
    in the blockchain, and all nodes taking part of the networks can verify the reliability
    of transactions without resorting to trusted third parties.


    Let’s now see the characteristics of the **distributed ledger** and the ways in
    which it is managed.


    ## Distributed Ledger


    From the accounting point of view, the ledger is simply a cronologically held
    register of economic transactions.


    It is analogous to the ledger commonly used by banks and other financial institutions,
    to reconcile the accounting balances.


    All the charges and credits during an accounting period are calculated to prepare
    the accounting balance.


    The balance sheets of banks, financial institutions and businesses, are compiled
    using accounting records within a ledger.


    When we conduct a traditional financial transaction using fiat currency, we have
    a third party ledger that keeps information about each transaction.


    Some of these third-party trust systems are traditionally represented by banking
    and financial institutions (such as VISA, MasterCard, and so on).


    Blockchain has radically changed the management methods of this accounting system,
    making all the network operators participate in the preparation of the ledger.


    This is why the ledger is also called **distributed ledger**: all those who carry
    out a transaction in the blockchain, also have access to the registration of other
    transactions that have occurred, or that are taking place in the blockchain.


    The data structure employed in the implementation of the distributed ledger is
    known as the *merkle tree*:


    ![](media/file4.jpg)


    Merkle tree


    Basically, it traces the structure of a tree, whose leaves correspond to the different
    transactions recorded within the ledger; for each path, starting from the root
    node, the corresponding hash values ​​are calculated, the references of which
    are stored inside the blocks.


    Since each transaction is linked to the previous ones, any subsequent changes
    would be immediately recognizable by anyone, simply by recalculating the corresponding
    hash values.


    Being distributed, this decentralized ledger provides several confirmations of
    authenticity for each transaction that has occurred.


    One of the key properties of blockchain technology is that it encourages a **global**
    and **shared** concept of **trust** in transactions.


    # Assuring transactions integrity


    How is the integrity of transactions guaranteed within the Blockchain?


    This is what we will deal with now, analyzing the different cryptographic features,
    such as **hashing** and **hash digests**, highlighting the differences that exist
    with the actual encryption algorithms.


    Finally, we will show a practical example of calculating a hash digest using the
    class of SHA algorithms used in the implementation of the Blockchain, using simple
    tools available online.


    ## Hash digests: the fingerprints of the blocks


    Let’s start by showing the hash digests, considered the “fingerprints” of the
    blocks of the Blockchain.


    As we have said, the integrity of transactions within the blockchain is achieved
    through the use of hash functions.


    Hash functions constitute a class of algorithms that make it computationally unlikely
    that different alphanumeric strings will give rise to equal hash values.


    Hashing algorithms are specifically designed to be sensitive to even the slightest
    variations in the input data.


    ### Encryption and Hashing: Differences


    An interesting property of hashing algorithms is that they are not reversible,
    unlike cryptographic algorithms.


    **Reversible** here means that it is possible to convert an encrypted text into
    its original plaintext, using the decrypting function, which is the inverse of
    the encrypting function:


    ![](media/file5.jpg)


    Encrpytion and decryption


    Unlike cryptography, there is no reverse function for hashing.


    This means that we cannot convert the calculated hash value to its original input,
    as hashing is a one-way process by definition.'
