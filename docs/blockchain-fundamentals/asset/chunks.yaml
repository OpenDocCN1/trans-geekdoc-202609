  trans: "\n# 区块链基础\n\n# 区块链技术入门\n\nAlessandro Parisi\n\n© 2021 Alessandro Parisi\
    \ \n\n# 介绍区块链\n\n本质上，`Blockchain` 是一个\n\n`distributed` 归档\n\n`peer-to-peer` 网络\n\
    \n`encryption`\n\n作为一个 `distributed and decentralized` 归档，旨在管理数字 `assets` 的转移，`Blockchain`\
    \ 允许用户以交易的形式相互交换数字值。\n\n通过这种方式，无需依赖第三方/权威机构来保证交易。\n\n下面我们来了解区块链的目标以及底层技术是如何实现这些目标的。\n\
    \n## 区块链的目标\n\n区块链技术最初是为了支持 Bitcoin 而被提出的。\n\n其主要目的是防止 `double spending`（即同一加密货币被多次花费）的现象。\n\
    \n然而，区块链的作用并不局限于金融交易领域。\n\n一般而言，任何涉及数字值的交易都可以记录在分布式账本中。\n\n## 区块链技术\n\n区块链技术可以采取多种形式和实现方式。\n\
    \n因此，它更多是一种架构概念，而非特定且明确的技术。\n\n每种不同的实现也可以提供特定的功能和特性，例如执行 `smart contracts`。\n\n\
    ### 区块链交易\n\n区块链内部的双方价值交换通过交易（transactions）实现。\n\n这些交易在区块链节点网络验证后，才会被写入分布式账本。\n\
    \n一旦交易被添加到账本中已有的记录，交易即变得不可篡改且不可更改。\n\n### 区块链的区块\n\n从名称本身就能看出，区块链本质上是一个 `chain\
    \ of blocks`（区块链）。\n\n每个区块中包含一个或多个交易。\n\n新区块的加入遵循预定义的时间间隔。\n\n通过这种方式，可以通过追踪区块上登记的交易序列，保持整个交易历史的记录。\n\
    \n### 分布式账本\n\n在会计术语中，区块链可以被视为 `distributed` 和去中心化的账本，即所谓的“分布式账本”。\n\n账本的管理通过\
    \ `consensus protocols`（共识协议）来完成，这些协议设计用于在账本中记录的交易上达成网络一致。\n\n共识协议种类繁多，与区块链的实现形式同样多样。其中最常见的共识协议包括\
    \ `Proof of Work`（`PoW`）、`Proof of Stake`（`PoS`）和 `Proof of Authority`（`PoA`）。\n\
    \n# 区块链核心概念\n\n我们现在将介绍区块链技术基于的核心概念，如分布式存储、去中心化的点对点网络、交易的透明性以及不可逆性。\n\n## 分布式存储\n\
    \n能够在分布式数据库中存储数据，使得每个参与者都能访问完整的交易历史。\n\n此外，分布式存储防止任何单一实体完全控制已存档的信息。\n\n分布式存储让各个节点能够直接且独立地验证所存储信息的完整性。\n\
    \n因此，无需使用第三方或中介机构来验证交易。\n\n信息完整性的验证实际上是通过哈希函数实现的。\n\n下面我们来看看点对点网络如何帮助在区块链中实现交易的分布式存储。\n\
    \n## 点对点网络\n\n为了实现分布式存储，区块链使用 `Peer-to-peer`（`P2P`）网络。\n\n在该类型网络中，没有节点充当中央服务器的角色。\n\
    \n相反，在 P2P 网络中，每个节点在需要时可分别充当客户端和服务器的角色。\n\n![](img/file0.png)\n\nP2P 网络\n\n##\
    \ 交易透明性\n\n每笔交易及其关联的价值对所有网络参与者均公开可见。\n\n交易的对等方通过其各自的 `addresses`（由字母数字序列组成）进行识别。\n\
    \n在被写入分布式账本并得到确认之前，每笔交易都需要由矿工节点进行若干次确认。\n\n## 交易不可逆性\n\n一旦交易被写入区块并加入区块链，就不再可修改。\n\
    \n这一结果是通过将构成区块链的各个区块逐一拼接起来实现的。\n\n对已存档交易进行修改会导致先前计算的哈希值被改变，这将立即被网络中所有节点察觉，从而阻止交易确认。\n\
    \n# 集中化与去中心化网络\n\n如前所述，区块链的基本原则之一是使用 `Peer-to-peer` 网络通信协议，以实现信息的 `去中心化存储`。\n\n\
    为了理解去中心化网络的优势，我们首先介绍传统的集中化网络，分析其主要特征，然后将其与点对点网络进行比较。\n\n## 集中化网络（客户端-服务器）\n\n\
    下面的图展示了典型的 `centralized` 网络：\n\n![](img/file1.png)\n\n集中化网络\n\n这类网络的主要特征是存在一个\
    \ `central node`（中心节点），它充当 `server node`（服务器节点）。\n\n客户端节点只能连接到中心服务器以获取所需信息。\n\n\
    下面我们来看一些集中化网络的例子，并评估其优缺点。\n\n### 集中化网络：例子\n\n典型的集中化网络例子是传统的客户端-服务器式网页连接。\n\n集中化网络的主要优势在于其\
    \ `实现、维护和更新的简便性`。\n\n所需信息存储和更新在单一的中心节点（服务器）中，并向客户端提供。\n\n### 集中化网络：局限性\n\n集中化网络的根本局限性在于，如果中心节点发生故障或被\
    \ compromise（例如受到网络攻击），其中包含的信息将不再对整个网络可用和可访问。\n\n此外，在集中化网络中，服务器节点拥有并完全控制信息。\n\n\
    基于这些局限性，区块链采用去中心化网络通信协议来实现其功能。\n\n## 去中心化（点对点）网络\n\n按定义，去中心化网络中不存在充当信息共享控制权威的中心节点。\n\
    \n相反，在点对点网络协议中，每个节点都能够在适当时互换客户端和服务器的角色。\n\n去中心化模型使得网络中的每个节点能够自主地参与信息的共享和验证。\n\n\
    ![](img/file0.png)\n\nP2P 网络\n\n该模式使得中心化信息控制权威变得多余。\n\n### 区块链与去中心化网络\n\n去中心化网络的特性对于实现区块链的功能至关重要。\n\
    \n区块链的一个关键优势是其在交易验证、有效性确认以及将交易写入区块链中的决策去中心化。\n\n"
