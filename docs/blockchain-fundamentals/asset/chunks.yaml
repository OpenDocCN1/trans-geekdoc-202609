- raw: 'Now let’s see how the Blockchain exploits the irreversibility characteristics
    of the hashing algorithms to guarantee the integrity of transactions.


    ### Hashing and transaction integrity


    Hashing algorithms are designed to prevent **collisions**, i.e. the possibility
    of obtaining the same hash value for two different input strings.


    Thanks to these features, hashes can be considered a kind of **data fingerprint**:
    any variation, even minimal, in the original data will result in a very different
    calculated hashing value.


    Making use of hash functions within the blockchain, anyone can verify the integrity
    of blocks and transactions by calculating their corresponding hash values ​​and
    comparing them with the values ​​stored within the blockchain.


    There are several families of hashing algorithms: the bitcoin Blockchain adopts
    the SHA-256 hashing algorithm.


    ### SHA hash value: calculation example


    In the example below, we see how the hash value generated by the hashing algorithm
    radically changes even in the case of minimal changes in the input data.


    The images below show the results obtained using the hashing tool available online
    at www.sha1-online.com


    ![](media/file6.png)


    SHA256 digest ex.1


    ![](media/file7.png)


    SHA256 digest ex.2


    As it is easy to notice from the output produced, even minimal variations in the
    input strings determine completely different output values, that are not easily
    attributable to the original ones.


    # Achieving Trust in a Distributed environment


    One of the most interesting tasks of the Blockchain concerns the goal of achieving
    the shared consensus of the network on the **global state** of the transactions
    recorded in the distributed ledger.


    That of shared consensus represents one of the classic problems of computer science
    relating to distributed systems.


    As we have seen previously, the Blockchain is nothing more than a particular implementation
    of a distributed storage system; as such, many of the solutions adopted by the
    Blockchain reproduce the solutions commonly adopted by distributed systems.


    First of all, distributed systems must provide a consensus protocol that is “fault-tolerant”,
    meaning that it is robust and capable of tolerating any malfunctions, to ensure
    that a common consensus can be reached on the state of the system as a whole.


    By reaching a consensus on the global status of the transactions stored in the
    ledger, all the players in the distributed system consequently share a common
    “truth” on which to place their “trust”.


    Achieving consensus is fundamental in a distributed system, in order to share
    a common “truth”, to which to attribute “trust”.


    Let’s now see the most common consensus protocols. ## Proof of Work (PoW)


    In the PoW consensus protocol, the nodes of the Blockchain must employ high computational
    resources to solve mathematical challenges of increasing difficulty, required
    in order to reach the consensus on transactions.


    The PoW, in fact, generates a hash value of a given length, and the goal of the
    nodes is to discover the input value that gave rise to this hash value.


    Since, as we have seen previously, the values ​​calculated by hashing algorithms
    are **not reversible**, to solve these challenges it is necessary to proceed “by
    brute force”, that is, it is necessary to proceed **by trial and error**.


    This results in a lot of computational work by the block validation nodes (hence
    the name “Proof of Work”).


    The node that finds the solution to the math challenge sends it to the rest of
    the network for verification by the other nodes (in the Bitcoin blockchain, these
    nodes are called “miners”, and they receive a reward for their activity, which
    is quantified in units or fractions of bitcoins).


    The logic of the PoW is to make adding a new block to the chain computationally
    difficult and onerous, thus reducing the possibility for anyone of being able
    to modify the transaction ledger.


    Then, once the solution found by the node has been verified, the block created
    can be inserted into the blockchain.


    The length of the blockchain increases accordingly, reflecting the computational
    effort (PoW) it took to reach the current size.


    Therefore, the consensus on which of the local copies of the blockchain should
    be considered the updated one, is reached simply by selecting the longest chain,
    which is consequently attributed the trust of the network.


    Given the characteristics of the PoW, it is very difficult to modify a block (thus
    altering the transactions within it) once it has been inserted into the blockchain,
    and this difficulty increases as the length of the chain increases.


    The advantages of PoW are not without costs, both in terms of the time required
    to validate the blocks, and the electricity required to meet the required computational
    load.


    To try to address these disadvantages, the alternative consensus mechanism known
    as Proof of Stake (PoS) has been proposed.


    ## Proof of Stake (PoS)


    In the case of the PoS protocol, digital signatures are used instead of hash values,
    and the node that was authorized to create the next block to be included in the
    blockchain is selected, based on the amount of investment made by that node in
    the network.


    Block validation is rewarded by attributing financial commissions to the nodes
    that contributed to the validation.


    ## Proof of Authority (PoA)


    Unlike previous mechanisms, the Proof of Authority (PoA) protocol is a consensus
    mechanism that works in the presence of a limited number of transaction validation
    nodes.


    Its use is therefore considered more appropriate in permissioned blockchains,
    rather than in public blockchains.


    In the case of PoA, consensus is reached on the basis of the greater trust (authority)
    recognized in these nodes.


    # The problem of the Byzantine Generals


    One of the classical coordination problems, most studied in the field of computer
    science and distributed systems, is known as the “Byzantine Generals” problem.


    The problem concerns the achievement of consensus by the Generals who surrounded
    the enemy, on the moment in which to launch the attack all together, to guarantee
    the success of the military operation.


    The problem lies in the fact that Generals can communicate with each other remotely,
    through the reciprocal exchange of messages.


    Each General decides whether to attack or retreat, communicating their decision
    to the others by sending messengers.


    Among these, however, there may be “traitors”, who prevent with their behavior
    to reach shared and unanimous consent, by sending contradictory messages to others.


    The final aim, in fact, is to reach a shared consensus on the action to be undertaken
    all together, to attack or withdraw, avoiding a disordered behavior, which would
    determine a sure failure.


    ### Byzantine Generals problem in the context of the Blockchain


    The problem of the Byzantine Generals arises in the context of the Blockchain
    in relation to the need to choose the correct version of the ledger, which preserves
    the real history of transactions.


    In the blockchain, this choice occurs in the presence of nodes that cannot communicate
    correctly with others, or of dishonest nodes that intend to cheat on the correct
    version of the transaction history, thus making it difficult to reach consensus
    within the network.


    ## What solution to the problem of the Byzantine generals?


    The problem of the Byzantine Generals therefore represents a problem of coordination
    on how to reach shared consensus in the presence of possible errors (represented
    by the conflicting messages sent by the “infidel” Generals).


    This coordination problem also arises in achieving consensus on Blockchain transactions.


    Therefore, it is necessary to implement a consensus protocol capable of maintaining
    its reliability even in the presence of “unfaithful” nodes.'
  fmt: '

    Now let’s see how the Blockchain exploits the irreversibility characteristics
    of the hashing algorithms to guarantee the integrity of transactions.


    ### Hashing and transaction integrity


    Hashing algorithms are designed to prevent `collisions`, i.e. the possibility
    of obtaining the same hash value for two different input strings.


    Thanks to these features, hashes can be considered a kind of `data fingerprint`:
    any variation, even minimal, in the original data will result in a very different
    calculated hashing value.


    Making use of hash functions within the blockchain, anyone can verify the integrity
    of blocks and transactions by calculating their corresponding hash values and
    comparing them with the values stored within the blockchain.


    There are several families of hashing algorithms: the bitcoin Blockchain adopts
    the `SHA-256` hashing algorithm.


    ### SHA hash value: calculation example


    In the example below, we see how the hash value generated by the hashing algorithm
    radically changes even in the case of minimal changes in the input data.


    The images below show the results obtained using the hashing tool available online
    at `www.sha1-online.com`


    ![](media/file6.png)


    SHA256 digest ex.1


    ![](media/file7.png)


    SHA256 digest ex.2


    As it is easy to notice from the output produced, even minimal variations in the
    input strings determine completely different output values, that are not easily
    attributable to the original ones.


    # Achieving Trust in a Distributed environment


    One of the most interesting tasks of the Blockchain concerns the goal of achieving
    the shared consensus of the network on the `global state` of the transactions
    recorded in the distributed ledger.


    That of shared consensus represents one of the classic problems of computer science
    relating to distributed systems.


    As we have seen previously, the Blockchain is nothing more than a particular implementation
    of a distributed storage system; as such, many of the solutions adopted by the
    Blockchain reproduce the solutions commonly adopted by distributed systems.


    First of all, distributed systems must provide a consensus protocol that is “fault-tolerant”,
    meaning that it is robust and capable of tolerating any malfunctions, to ensure
    that a common consensus can be reached on the state of the system as a whole.


    By reaching a consensus on the global status of the transactions stored in the
    ledger, all the players in the distributed system consequently share a common
    “truth” on which to place their “trust”.


    Achieving consensus is fundamental in a distributed system, in order to share
    a common “truth”, to which to attribute “trust”.


    Let’s now see the most common consensus protocols. ## Proof of Work (PoW)


    In the PoW consensus protocol, the nodes of the Blockchain must employ high computational
    resources to solve mathematical challenges of increasing difficulty, required
    in order to reach the consensus on transactions.


    The PoW, in fact, generates a hash value of a given length, and the goal of the
    nodes is to discover the input value that gave rise to this hash value.


    Since, as we have seen previously, the values calculated by hashing algorithms
    are `not reversible`, to solve these challenges it is necessary to proceed “by
    brute force”, that is, it is necessary to proceed `by trial and error`.


    This results in a lot of computational work by the block validation nodes (hence
    the name “Proof of Work”).


    The node that finds the solution to the math challenge sends it to the rest of
    the network for verification by the other nodes (in the Bitcoin blockchain, these
    nodes are called “miners”, and they receive a reward for their activity, which
    is quantified in units or fractions of bitcoins).


    The logic of the PoW is to make adding a new block to the chain computationally
    difficult and onerous, thus reducing the possibility for anyone of being able
    to modify the transaction ledger.


    Then, once the solution found by the node has been verified, the block created
    can be inserted into the blockchain.


    The length of the blockchain increases accordingly, reflecting the computational
    effort (PoW) it took to reach the current size.


    Therefore, the consensus on which of the local copies of the blockchain should
    be considered the updated one, is reached simply by selecting the longest chain,
    which is consequently attributed the trust of the network.


    Given the characteristics of the PoW, it is very difficult to modify a block (thus
    altering the transactions within it) once it has been inserted into the blockchain,
    and this difficulty increases as the length of the chain increases.


    The advantages of PoW are not without costs, both in terms of the time required
    to validate the blocks, and the electricity required to meet the required computational
    load.


    To try to address these disadvantages, the alternative consensus mechanism known
    as Proof of Stake (PoS) has been proposed.


    ## Proof of Stake (PoS)


    In the case of the PoS protocol, digital signatures are used instead of hash values,
    and the node that was authorized to create the next block to be included in the
    blockchain is selected, based on the amount of investment made by that node in
    the network.


    Block validation is rewarded by attributing financial commissions to the nodes
    that contributed to the validation.


    ## Proof of Authority (PoA)


    Unlike previous mechanisms, the Proof of Authority (PoA) protocol is a consensus
    mechanism that works in the presence of a limited number of transaction validation
    nodes.


    Its use is therefore considered more appropriate in permissioned blockchains,
    rather than in public blockchains.


    In the case of PoA, consensus is reached on the basis of the greater trust (authority)
    recognized in these nodes.


    # The problem of the Byzantine Generals


    One of the classical coordination problems, most studied in the field of computer
    science and distributed systems, is known as the “Byzantine Generals” problem.


    The problem concerns the achievement of consensus by the Generals who surrounded
    the enemy, on the moment in which to launch the attack all together, to guarantee
    the success of the military operation.


    The problem lies in the fact that Generals can communicate with each other remotely,
    through the reciprocal exchange of messages.


    Each General decides whether to attack or retreat, communicating their decision
    to the others by sending messengers.


    Among these, however, there may be “traitors”, who prevent with their behavior
    to reach shared and unanimous consent, by sending contradictory messages to others.


    The final aim, in fact, is to reach a shared consensus on the action to be undertaken
    all together, to attack or withdraw, avoiding a disordered behavior, which would
    determine a sure failure.


    ### Byzantine Generals problem in the context of the Blockchain


    The problem of the Byzantine Generals arises in the context of the Blockchain
    in relation to the need to choose the correct version of the ledger, which preserves
    the real history of transactions.


    In the blockchain, this choice occurs in the presence of nodes that cannot communicate
    correctly with others, or of dishonest nodes that intend to cheat on the correct
    version of the transaction history, thus making it difficult to reach consensus
    within the network.


    ## What solution to the problem of the Byzantine generals?


    The problem of the Byzantine Generals therefore represents a problem of coordination
    on how to reach shared consensus in the presence of possible errors (represented
    by the conflicting messages sent by the “infidel” Generals).


    This coordination problem also arises in achieving consensus on Blockchain transactions.


    Therefore, it is necessary to implement a consensus protocol capable of maintaining
    its reliability even in the presence of “unfaithful” nodes.

    '
  trans: '

    让我们看看区块链如何利用哈希算法的不可逆性特征来保证交易的完整性。


    ### 哈希与交易完整性


    哈希算法的设计是为了防止`collisions`，即获得两个不同输入字符串相同哈希值的可能性。


    得益于这些特性，哈希值可以被视为一种`数据指纹`：原始数据的任何变化，即使是最小的，也会导致计算出的哈希值发生很大差异。


    在区块链中使用哈希函数，任何人都可以通过计算相应哈希值并与区块链中存储的值进行比较，来验证区块和交易的完整性。


    有几种哈希算法家族：比特币区块链采用`SHA-256`哈希算法。


    ### SHA 哈希值：计算示例


    在下面的示例中，我们看到即使输入数据发生极小的变化，哈希算法生成的哈希值也会发生根本性变化。


    下面的图片展示了在在线工具 `www.sha1-online.com` 上使用该工具获得的结果：


    ![](img/file6.png)


    SHA256 消息摘要示例 1


    ![](img/file7.png)


    SHA256 消息摘要示例 2


    从输出结果中可以明显看出，即使输入字符串发生极小的变化，输出值也会完全不同，且难以追溯到原始值。


    # 在分布式环境中实现信任


    区块链最有趣的任务之一是实现网络对分布式账本中记录的交易`全局状态`的共识。


    共识是分布式系统领域中计算机科学的经典问题之一。


    如前所述，区块链本质上是一种分布式存储系统的特殊实现；因此，区块链采用的许多解决方案都反映了分布式系统中常用的解决方案。


    首先，分布式系统必须提供一个“容错”共识协议，即能够抵御故障、确保能够就整个系统的状态达成一致的协议。


    通过对账本中存储的交易全局状态达成共识，分布式系统中的所有参与者因此共享一个共同的“真相”，基于此可以建立“信任”。


    实现共识在分布式系统中至关重要，是为了共享一个共同的“真相”，并将“信任”属性赋予它。


    下面我们来看看最常见的共识协议。## 证明工作量（Proof of Work, PoW）


    在 PoW 共识协议中，区块链的节点必须使用越来越难的数学挑战来消耗大量计算资源，以达成交易共识。


    PoW 实际上生成一个指定长度的哈希值，节点的目标是找出产生该哈希值的输入值。


    由于如前所述，哈希算法计算出的值是`不可逆`的，因此解决这些挑战需要“蛮力”，即通过`试错`的方式进行。


    这导致区块验证节点（因此得名“Proof of Work”）进行大量计算工作。


    找到解决方案的节点会将其结果发送给网络其他节点进行验证（在比特币区块链中，这些节点被称为“矿工”），他们因活动获得以比特币单位或其分数计量的奖励。


    PoW 的逻辑是使将新区块添加到链中变得计算上困难且繁琐，从而降低任何人修改交易账本的可能性。


    随后，一旦节点找到的解决方案被验证，创建的区块即可插入区块链。


    区块链的长度随之增加，反映了达成当前尺寸所需的计算努力（PoW）。


    因此，共识是通过简单选择最长链来达成的，这条链因此获得网络的信任。


    鉴于 PoW 的特性，一旦区块被插入区块链，修改该区块（从而修改其中的交易）就变得极其困难，且随着链长的增加，这种困难程度会进一步提升。


    PoW 的优势并非没有代价，代价体现在验证区块所需的时间以及满足计算负载所需的电力上。


    为解决这些缺点，被提议的替代共识机制是 Proof of Stake（PoS）。


    ## 证明权益（Proof of Stake, PoS）


    在 PoS 协议中，使用数字签名替代哈希值，且被选中创建下一个区块的节点是根据该节点在网络中投入的金额来决定的。


    区块验证通过向为验证做出贡献的节点分配财务佣金来获得奖励。


    ## 证明权威（Proof of Authority, PoA）


    与之前的机制不同，证明权威（PoA）协议是一种在交易验证节点数量有限的情况下运作的共识机制。


    因此，其使用被认为更适合**许可链**（permissioned blockchains），而非公开链（public blockchains）。


    在 PoA 的情况下，共识基于这些节点所获得的更大信任（权威）。


    # 拜占庭将军问题


    在计算机科学和分布式系统领域，最著名的协调问题之一是所谓的“拜占庭将军”问题。


    该问题涉及围困敌军的将军们达成共识的目标：在何时统一发起攻击以保证军事行动的成功。


    问题在于，将军们只能通过远程消息交换进行沟通。


    每位将军决定攻击或撤退，并通过派遣使者将其决定告知其他人。


    然而，这些使者中可能存在“叛徒”，他们通过发送矛盾的消息阻碍达成一致，从而导致无法达成共识。


    最终目标是达成共识，统一行动（攻击或撤退），避免行为混乱导致失败。


    ### 拜占庭将军问题在区块链中的应用


    拜占庭将军问题在区块链中表现为选择正确账本版本的需求，该版本应保存真实的交易历史。


    在区块链环境中，这种选择发生在存在无法正确通信的节点，或恶意节点试图篡改交易历史、使网络难以达成共识的情况下。


    ## 如何解决拜占庭将军问题？


    拜占庭将军问题因此代表了在存在“叛徒”（即发送矛盾消息的“异端”将军）时，如何协调达成共识的问题。


    这个协调问题同样出现在区块链交易达成共识的过程中。


    因此，有必要实施一种共识协议，使其即使在存在“不忠”节点的情况下也能保持可靠性。


    '
