- raw: "It has been shown that the Byzantine Generals problem does not admit a solution\
    \ in the event that the number of infidel generals is equal to or greater than\
    \ one third of the total.\n\nA consensus protocol capable of resisting the problem\
    \ of the Byzantine Generals is called Byzantine Fault Tolerant (BFT).\n\nThe Proof\
    \ of Work consensus protocol demonstrates this capability.\n\nIn the case of the\
    \ PoW, the problem of the Byzantine Generals is solved by the fact that the protocol\
    \ does not require the participation of all the nodes of the network to reach\
    \ consensus.\n\n# The Purpose of Mining\n\nThe ways in which consensus is obtained\
    \ within the network varies according to the different types of blockchains.\n\
    \nConsequently, not all consensus mechanisms are suitable for all blockchains.\n\
    \nIn the case of the Bitcoin’s blockchain, the mechanism for achieving consensus\
    \ is based on the economic incentive.\n\nNodes are encouraged to help reach consensus\
    \ on transactions through their mining activity, which is rewarded in the form\
    \ of bitcoin (as we saw when talking about PoW).\n\nThis system of economic incentives\
    \ is particularly important for public blockchains, as it allows them to achieve\
    \ and maintain the sustainability of the architecture itself.\n\n# The different\
    \ types of Blockchain\n\nThere are different implementations of Blockchain technology,\
    \ which offer different features and functionalities.\n\nIn fact, blockchains\
    \ can be differentiated not only based on the consensus protocol adopted, but\
    \ also for other features, such as the ability to execute smart contracts.\n\n\
    So let’s see the main types of blockchains currently existing.\n\n### Public blockchain\n\
    \nA public blockchain is a blockchain in which anyone can join, without the need\
    \ to obtain permissions based on the role played within the network.\n\nTherefore,\
    \ public blockchains are also called **permissionless** blockchains.\n\nAmong\
    \ the examples of public blockchains we can mention Bitcoin, Ethereum, Litecoin\
    \ and so on.\n\n### Private blockchain\n\nIn private blockchains, read and write\
    \ permissions within the network are assigned to different groups of users.\n\n\
    Read permissions are usually public or assigned to an indefinite number of users,\
    \ while write permissions are reserved for a predetermined group of users or organizations.\n\
    \nConsequently, the validation of the transactions is entrusted to a predetermined\
    \ number of nodes.\n\nSome examples of private blockchain include the Gem Health\
    \ network, Corda, and so on.\n\n### Consortium Blockchain\n\nIn this type of blockchain,\
    \ consensus management is limited to a predefined group of subjects.\n\nConsequently,\
    \ there are no incentives or economic rewards for the validation of transactions.\n\
    \nTransaction validation times are reduced compared to public blockchains.\n\n\
    Among the examples of blockchain consortium we can mention Deutsche Boerse and\
    \ R3.\n\n# About the Author\n\nAlessandro Parisi has been an IT professional for\
    \ over 20 years, acquiring significant experience as a Security Data Scientist,\
    \ and as an Artificial Intelligence Cybersecurity and Blockchain specialist.\n\
    \nHe has experience of operating within organizational and decisional contexts\
    \ characterized by high complexity.\n\nOver the years, he has helped companies\
    \ to adopt Artificial Intelligence and Blockchain DLT technologies as strategic\
    \ tools in protecting sensitive corporate assets.\n\nHe holds a Master Degree\
    \ in Economics and Statistics.\n\nPlease find further info on the professional\
    \ profile of the Author at the following link:  \n\n[https://www.linkedin.com/in/parisialessandro/](https://www.linkedin.com/in/parisialessandro/)\n\
    \n# Image Credits\n\nUnless otherwise expressly indicated, the images appearing\
    \ in the text are available under public domain license and can be found on the\
    \ Wikipedia commons website (https://commons.wikimedia.org)"
