- raw: "\n\n# Blockchain Fundamentals\n\n# A Gentle Intro to Blockchain Technology\n\
    \nAlessandro Parisi\n\n© 2021 Alessandro Parisi \n\n# Introducing the Blockchain\n\
    \nEssentially, the *Blockchain* is a\n\n*   **distributed** archive\n\n*   based\
    \ on **peer-to-peer** networks\n\n*   implemented through **encryption**\n\nAs\
    \ a **distributed and decentralized archive**, aimed at managing the transfers\
    \ of digital *assets*, the Blockchain allows users to exchange digital values\
    \ with each other in the form of transactions.\n\nIn this way, there is no need\
    \ to resort to third parties/authorities which guarantee transactions.\n\nLet’s\
    \ now see the Blockchain goals and how they are met by the underlying technology.\n\
    \n## Blockchain’s Goals\n\nBlockchain technology was originally introduced to\
    \ support Bitcoin.\n\nThe main purpose was to prevent the phenomenon of **double\
    \ spending** of cryptocurrencies, i.e. the possibility of spending the same currency\
    \ several times.\n\nHowever, the role of the Blockchain is not limited to the\
    \ financial transaction sector.\n\nIn general, each transaction involving digital\
    \ values can be recorded within a distributed ledger.\n\n## Blockchain technology\n\
    \nBlockchain technology can take different forms and implementations.\n\nTherefore,\
    \ it represents more a concept of an architectural nature than a specific and\
    \ well-defined technology.\n\nEach different implementation can also provide specific\
    \ features and functionalities, such as the execution of smart contracts.\n\n\
    ### Blockchain transactions\n\nThe exchange of values between the counterparties\
    \ within the Blockchain takes place by recurring to transactions.\n\nThe transactions\
    \ are validated by the network of blockchain nodes, before being inserted into\
    \ the distributed ledger.\n\nOnce appended to the ones already registered within\
    \ the ledger, transactions become unalterable and unchangeable.\n\n### Blockchain’s\
    \ blocks\n\nBy its very nature, as the name itself shows, the Blockchain is nothing\
    \ more than a **chain of blocks.**\n\nEach block within the Blockchain contains\
    \ one or more transactions.\n\nThe addition of new blocks to the Blockchain takes\
    \ place on the basis of predetermined time elapses.\n\nIn this way, it is possible\
    \ to keep the overall history of transactions, by tracing the sequence of registrations\
    \ made on the blocks.\n\n### The distributed ledger\n\nIn accounting terms, the\
    \ blockchain can be considered a **distributed** and decentralized ledger, known\
    \ precisely as the “distributed ledger”.\n\nThe management of the ledger takes\
    \ place through the use of **consensus protocols**, which are designed to achieve\
    \ the network’s consent on the transactions recorded within the ledger.\n\nThere\
    \ are different types of consensus protocols, as much as there are different implementations\
    \ of the blockchain.\n\nAmong the most common consensus protocols we can mention\
    \ the **Proof of Work** (PoW), the **Proof of Stake** (PoS) and the **Proof of\
    \ Authority** ( PoA).\n\n# Blockchain core concepts\n\nWe’ll now introduce the\
    \ concepts on which Blockchain technology is based, such as distributed archiving,\
    \ decentralized peer-to-peer networks, transparency and irreversibility of transactions.\n\
    \n## Distributed Archiving\n\nThe ability to store data within a distributed database\
    \ allows each participant to access the complete transaction history.\n\nIn addition,\
    \ distributed archiving prevents a single entity from taking full control over\
    \ the archived information.\n\nDistributed archiving allows individual nodes to\
    \ directly and independently verify the integrity of the information stored.\n\
    \nIt is therefore not necessary to use third parties or intermediaries to carry\
    \ out the verification of transactions.\n\nThe verification of the integrity of\
    \ the information is in fact implemented through the hashing functions.\n\nLet’s\
    \ now see how peer-to-peer networks help implement distributed storaging of transactions\
    \ in the Blockchain.\n\n## Peer-to-peer networks\n\nTo implement distributed storage,\
    \ the blockchain uses **Peer-to-peer** (P2P) networks.\n\nIn this type of network,\
    \ no node assumes the role of central server.\n\nOn the contrary, in a P2P network\
    \ each node assumes the role respectively of client and server when appropriate.\n\
    \n![](media/file0.png)\n\nP2P network\n\n## Transactions transparency\n\nEach\
    \ transaction and its associated value are publicly visible to all network participants.\n\
    \nThe counterparties of a transaction are identified by their respective **addresses**,\
    \ consisting of alphanumeric sequences.\n\nEach transaction is subjected to a\
    \ number of confirmations by the miners nodes, before being validated and inserted\
    \ into the distributed ledger.\n\n## Transactions Irreversibility\n\nAfter being\
    \ entered into a block and added to the blockchain, transactions are no longer\
    \ modifiable.\n\nThis result is achieved by concatenating togheter the different\
    \ blocks that make up the blockchain.\n\nAny modification to the transactions\
    \ already archived in the ledger would in fact lead to the alteration of the calculated\
    \ previously hashes.\n\nThis alteration would be immediately evident to all the\
    \ nodes in the network that would therefore prevent transaction confirmation.\n\
    \n# Centralized versus Decentralized networks\n\nAs we have seen, one of the basic\
    \ principles of the Blockchain involves the use of a **Peer-to-peer** network\
    \ communication protocol, in order to achieve **the decentralized storage** of\
    \ the information.\n\nTo understand the advantages associated with decentralized\
    \ networks, we will first introduce traditional centralized networks, analyzing\
    \ their main characteristics, then comparing them with decentralized peer-to-peer\
    \ networks.\n\n## Centralized networks (Client-Server)\n\nIn the following image,\
    \ we show a typical example of a **centralized** network:\n\n![](media/file1.png)\n\
    \nCentralized network\n\nThe main feature of these types of networks is the presence\
    \ of a **central node**, acting as the **server node**.\n\nClient nodes can connect\
    \ only to the central server to get the information they need.\n\nLet’s now see\
    \ some examples of centralized networks, assessing their pros & cons.\n\n### Centralized\
    \ networks: examples\n\nA typical example of a centralized network is represented\
    \ by traditional client-server web connections.\n\nThe main advantage of a centralized\
    \ network is represented by the **simplicity of implementation, maintenance and\
    \ updating** of this architectural model.\n\nThe necessary information is stored\
    \ and updated in a single central node (the server) which makes it available to\
    \ clients.\n\n### Centralized networks: limitations\n\nThe fundamental limitation\
    \ of centralized networks is represented by the fact that in the event of a malfunction\
    \ or compromise of the central node (for example due to cyber attacks), the information\
    \ contained therein is no longer available and accessible by the entire network.\n\
    \nIn addition, in centralized networks the server node assumes and retains full\
    \ control over information.\n\nDue to these limitations, the Blockchain adopts\
    \ a decentralized network communication protocol to achieve its own functionality.\n\
    \n## Decentralized (Peer-to-peer) networks\n\nBy definition, in a decentralized\
    \ network there is no central node that assumes the role of control authority\
    \ of information sharing.\n\nIn contrast, in a peer to peer network protocol,\
    \ each individual node is able to interchangeably play the roles of client and\
    \ server.\n\nThe decentralized model therefore allows each node of the network\
    \ to autonomously contribute to the sharing and verification of information.\n\
    \n![](media/file0.png)\n\nP2P network\n\nThis model therefore makes the presence\
    \ of a central information control authority superfluous.\n\n### Blockchain &\
    \ Decentralized networks\n\nThe characteristics of decentralized networks are\
    \ essential for realizing the features of the blockchain.\n\nOne of the key advantages\
    \ of the blockchain is in fact the decision-making decentralization on the verification,\
    \ validation and insertion of transactions within the blockchain."
