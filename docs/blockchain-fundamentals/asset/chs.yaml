- "# \n区块链 入门指南\n\n\n\n## 区块链技术入门\n\n\n\n本质上，`Blockchain` 是一个\n\n`distributed` 归档\n\
  \n`peer-to-peer` 网络\n\n`encryption`\n\n作为一个 `distributed and decentralized` 归档，旨在管理数字\
  \ `assets` 的转移，`Blockchain` 允许用户以交易的形式相互交换数字值。\n\n通过这种方式，无需依赖第三方/权威机构来保证交易。\n\n\
  下面我们来了解区块链的目标以及底层技术是如何实现这些目标的。\n\n\n区块链技术最初是为了支持 Bitcoin 而被提出的。\n\n其主要目的是防止 `double\
  \ spending`（即同一加密货币被多次花费）的现象。\n\n然而，区块链的作用并不局限于金融交易领域。\n\n一般而言，任何涉及数字值的交易都可以记录在分布式账本中。\n\
  \n\n区块链技术可以采取多种形式和实现方式。\n\n因此，它更多是一种架构概念，而非特定且明确的技术。\n\n每种不同的实现也可以提供特定的功能和特性，例如执行\
  \ `smart contracts`。\n\n\n区块链内部的双方价值交换通过交易（transactions）实现。\n\n这些交易在区块链节点网络验证后，才会被写入分布式账本。\n\
  \n一旦交易被添加到账本中已有的记录，交易即变得不可篡改且不可更改。\n\n\n从名称本身就能看出，区块链本质上是一个 `chain of blocks`（区块链）。\n\
  \n每个区块中包含一个或多个交易。\n\n新区块的加入遵循预定义的时间间隔。\n\n通过这种方式，可以通过追踪区块上登记的交易序列，保持整个交易历史的记录。\n\
  \n\n在会计术语中，区块链可以被视为 `distributed` 和去中心化的账本，即所谓的“分布式账本”。\n\n账本的管理通过 `consensus protocols`（共识协议）来完成，这些协议设计用于在账本中记录的交易上达成网络一致。\n\
  \n共识协议种类繁多，与区块链的实现形式同样多样。其中最常见的共识协议包括 `Proof of Work`（`PoW`）、`Proof of Stake`（`PoS`）和\
  \ `Proof of Authority`（`PoA`）。\n\n\n我们现在将介绍区块链技术基于的核心概念，如分布式存储、去中心化的点对点网络、交易的透明性以及不可逆性。\n\
  \n\n能够在分布式数据库中存储数据，使得每个参与者都能访问完整的交易历史。\n\n此外，分布式存储防止任何单一实体完全控制已存档的信息。\n\n分布式存储让各个节点能够直接且独立地验证所存储信息的完整性。\n\
  \n因此，无需使用第三方或中介机构来验证交易。\n\n信息完整性的验证实际上是通过哈希函数实现的。\n\n下面我们来看看点对点网络如何帮助在区块链中实现交易的分布式存储。\n\
  \n\n为了实现分布式存储，区块链使用 `Peer-to-peer`（`P2P`）网络。\n\n在该类型网络中，没有节点充当中央服务器的角色。\n\n相反，在\
  \ P2P 网络中，每个节点在需要时可分别充当客户端和服务器的角色。\n\n![](img/file0.png)\n\nP2P 网络\n\n\n每笔交易及其关联的价值对所有网络参与者均公开可见。\n\
  \n交易的对等方通过其各自的 `addresses`（由字母数字序列组成）进行识别。\n\n在被写入分布式账本并得到确认之前，每笔交易都需要由矿工节点进行若干次确认。\n\
  \n## 交易不可逆性\n\n一旦交易被写入区块并加入区块链，就不再可修改。\n\n这一结果是通过将构成区块链的各个区块逐一拼接起来实现的。\n\n对已存档交易进行修改会导致先前计算的哈希值被改变，这将立即被网络中所有节点察觉，从而阻止交易确认。\n\
  \n\n如前所述，区块链的基本原则之一是使用 `Peer-to-peer` 网络通信协议，以实现信息的 `去中心化存储`。\n\n为了理解去中心化网络的优势，我们首先介绍传统的集中化网络，分析其主要特征，然后将其与点对点网络进行比较。\n\
  \n\n下面的图展示了典型的 `centralized` 网络：\n\n![](img/file1.png)\n\n集中化网络\n\n这类网络的主要特征是存在一个\
  \ `central node`（中心节点），它充当 `server node`（服务器节点）。\n\n客户端节点只能连接到中心服务器以获取所需信息。\n\n\
  下面我们来看一些集中化网络的例子，并评估其优缺点。\n\n## 集中化网络：例子\n\n典型的集中化网络例子是传统的客户端-服务器式网页连接。\n\n集中化网络的主要优势在于其\
  \ `实现、维护和更新的简便性`。\n\n所需信息存储和更新在单一的中心节点（服务器）中，并向客户端提供。\n\n## 集中化网络：局限性\n\n集中化网络的根本局限性在于，如果中心节点发生故障或被\
  \ compromise（例如受到网络攻击），其中包含的信息将不再对整个网络可用和可访问。\n\n此外，在集中化网络中，服务器节点拥有并完全控制信息。\n\n\
  基于这些局限性，区块链采用去中心化网络通信协议来实现其功能。\n\n## 去中心化（点对点）网络\n\n按定义，去中心化网络中不存在充当信息共享控制权威的中心节点。\n\
  \n相反，在点对点网络协议中，每个节点都能够在适当时互换客户端和服务器的角色。\n\n去中心化模型使得网络中的每个节点能够自主地参与信息的共享和验证。\n\n\
  ![](img/file0.png)\n\nP2P 网络\n\n该模式使得中心化信息控制权威变得多余。\n\n## 区块链与去中心化网络\n\n去中心化网络的特性对于实现区块链的功能至关重要。\n\
  \n区块链的一个关键优势是其在交易验证、有效性确认以及将交易写入区块链中的决策去中心化。\n\n\n\n\n这些决定随后被压缩在块中，而块构成了区块链的构建单元。\n\
  \n## 块，区块链的构建元素\n\n区块链，顾名思义，仅仅是一个 `块链`。\n\n区块链的最简单单元实际上是由 `块` 构成的。\n\n每个 `块` 内包含一定数量的\
  \ `交易`，这些交易代表了在区块链内部对双方之间进行的价值转移。\n\n## 块和交易\n\n每个 `块` 包含若干 `交易` 的批次及其哈希值。\n\n`块`\
  \ 中包含的 `交易` 数量取决于 `块大小`。\n\n平均 `块` 大小约为 1 MB，但也可能更大，例如在以太坊的情况下。\n\n在比特币中，`块` 平均包含超过\
  \ 500 个 `交易`。\n\n让我们现在看看 `块时间` 如何影响能够嵌入单个 `块` 中的 `交易` 数量和大小。\n\n## 区块链块时间\n\n每个区块链都有自己的\
  \ `块时间`，即添加新 `块` 到区块链所需的时间大约是多少。\n\n`块时间` 影响了单个 `块` 内插入的 `交易` 数量。\n\n例如，如果区块链的 `块时间`\
  \ 为五分钟，且在这五分钟内仅完成了四个 `交易`，那么 `块` 将只包含这四个 `交易`。\n\n## 块时间与交易数量\n\n当 `交易` 数量超过 `块大小`\
  \ 时，这些 `交易` 需要等待一个仍然打开的 `块`，该 `块` 仍有足够的空间容纳并插入它们。\n\n在比特币的情况下，`块时间` 为 10 分钟。\n\n\
  这个值来源于比特币源代码中设定的限制。\n\n这些限制源自于在 2009 年至 2024 年期间最多发行 2100 万比特币的目标。\n\n矿工的报酬相应地每四年减半。\n\
  \n## 块的结构\n\n每个 `块` 由 `头`（header）和 `交易列表` 组成。\n\n每个 `块` 包含前一个 `块` 的哈希值，因此整个 `块`\
  \ 链将所有 `块` 连接在一起。\n\n区块链的第一个 `块` 称为“创世块”。\n\n## 块头\n\n`块` 的结构由 `块头` 表示。\n\n![](img/file2.png)\n\
  \n比特币 `块头`\n\n该数据结构包含一系列与 `块` 相关的信息，也称为元数据。\n\n*   前一个 `块` 的哈希值：该值用于计算即将添加到区块链的新\
  \ `块` 的相应哈希值；\n\n*   Merkle 根：它是与 `交易` 树根节点相关联的哈希值，用于检查 `块` 的有效性；\n\n*   时间戳：它是分配给\
  \ `块` 的时间戳；\n\n*   Nonce：一个任意值，用于 `块` 挖矿时使用。\n\n`块` 存储在一种称为 Merkle 树的树结构中。\n\n##\
  \ 区块链交易 - 本质和特征\n\n区块链，顾名思义，仅仅是一个 `块链`。\n\n区块链的最简单单元实际上是由 `块` 构成的。\n\n每个 `块` 内包含一定数量的\
  \ `交易`，这些交易代表了在区块链内部对双方之间进行的价值转移。\n\n`交易` 必须经过矿工的确认阶段，矿工因其工作而获得比特币奖励。没有确认，任何 `交易`\
  \ 都无法被验证。\n\n![](img/file3.png)\n\n区块链整体流程\n\n## 交易和分布式账本\n\n区块链的一个特点是它使得 `交易` 中介的介入变得多余。\n\
  \n人们可以在没有第三方参与的情况下进行 `交易`。共享账本本身管理并确保参与方之间 `交易` 的 **完整性** 和 **可靠性**。\n\n账本由区块链的所有参与者以分布式方式维护和更新，所有参与网络的节点都可以在不诉诸于可信第三方的情况下验证\
  \ `交易` 的可靠性。\n\n让我们现在看看 **分布式账本** 的特性以及它是如何被管理的。\n\n\n从会计角度来看，账本仅仅是按时间顺序保存的经济 `交易`\
  \ 登记册。\n\n它类似于银行和其他金融机构常用的账本，用于调节会计余额。\n\n账户期间的所有借方和贷方都会计算以准备会计余额。\n\n银行、金融机构和企业的资产负债表是使用账本内的会计记录编制的。\n\
  \n当我们使用法币进行传统的 `交易` 时，我们有一个第三方账本来记录每个 `交易` 的信息。\n\n一些传统的第三方信任系统传统上由银行和金融机构（如 VISA、MasterCard\
  \ 等）代表。\n\n区块链彻底改变了这种会计系统的管理方式，使得所有网络操作者都参与账本的编制。\n\n因此，账本也被称为 **分布式账本**：所有在区块链中进行\
  \ `交易` 的人也可以访问区块链中其他 `交易` 的登记，或正在发生的 `交易`。\n\n用于实现分布式账本的数据结构被称为 `Merkle 树`：\n\n\
  ![](img/file4.jpg)\n\nMerkle 树\n\n基本上，它追踪树结构，其叶子对应于账本中记录的不同 `交易`；对于从根节点开始的每一条路径，都会计算相应的哈希值，这些哈希值的引用存储在\
  \ `块` 中。\n\n由于每个 `交易` 都与前一个 `交易` 相连，任何后续的变更都会被任何人通过重新计算相应的哈希值轻易识别。\n\n由于其分布式特性，这种去中心化的账本为每个发生的\
  \ `交易` 提供了多重真实性确认。\n\n区块链技术的一个关键属性是它鼓励对 `交易` 的 **全球** 和 **共享** **信任** 概念。\n\n\n\
  在区块链中，如何保证 `交易` 的完整性？\n\n我们现在将分析用于实现区块链完整性的各种加密特性，如 **哈希** 和 **哈希摘要**，并突出它们与实际加密算法之间的差异。\n\
  \n最后，我们将使用区块链实现中采用的基于 SHA 算法的类计算哈希摘要的实际示例，使用简单的在线工具。\n\n## 哈希摘要：区块的指纹\n\n让我们先展示\
  \ `块` 的哈希摘要，它们被视为 `块` 的“指纹”。\n\n正如我们所讨论的，区块链中 `交易` 的完整性是通过使用哈希函数实现的。\n\n哈希函数属于一类算法，使得不同的字母数字字符串产生相同哈希值的可能性极低。\n\
  \n哈希算法被专门设计为对输入数据的最微小变化都极为敏感。\n\n## 加密和哈希：区别\n\n哈希算法的一个有趣属性是它们不可逆，与密码学算法不同。\n\n\
  **可逆**在这里意味着可以使用解密函数将加密文本转换回其原始明文，这是加密函数的逆运算：\n\n![](img/file5.jpg)\n\n加密与解密\n\n\
  与密码学不同，哈希没有逆函数。\n\n这意味着我们无法将计算出的哈希值转换回其原始输入，因为哈希是由定义的单向过程。\n\n\n\n\n让我们看看区块链如何利用哈希算法的不可逆性特征来保证交易的完整性。\n\
  \n## 哈希与交易完整性\n\n哈希算法的设计是为了防止`collisions`，即获得两个不同输入字符串相同哈希值的可能性。\n\n得益于这些特性，哈希值可以被视为一种`数据指纹`：原始数据的任何变化，即使是最小的，也会导致计算出的哈希值发生很大差异。\n\
  \n在区块链中使用哈希函数，任何人都可以通过计算相应哈希值并与区块链中存储的值进行比较，来验证区块和交易的完整性。\n\n有几种哈希算法家族：比特币区块链采用`SHA-256`哈希算法。\n\
  \n## SHA 哈希值：计算示例\n\n在下面的示例中，我们看到即使输入数据发生极小的变化，哈希算法生成的哈希值也会发生根本性变化。\n\n下面的图片展示了在在线工具\
  \ `www.sha1-online.com` 上使用该工具获得的结果：\n\n![](img/file6.png)\n\nSHA256 消息摘要示例 1\n\n\
  ![](img/file7.png)\n\nSHA256 消息摘要示例 2\n\n从输出结果中可以明显看出，即使输入字符串发生极小的变化，输出值也会完全不同，且难以追溯到原始值。\n\
  \n## 在分布式环境中实现信任\n\n区块链最有趣的任务之一是实现网络对分布式账本中记录的交易`全局状态`的共识。\n\n共识是分布式系统领域中计算机科学的经典问题之一。\n\
  \n如前所述，区块链本质上是一种分布式存储系统的特殊实现；因此，区块链采用的许多解决方案都反映了分布式系统中常用的解决方案。\n\n首先，分布式系统必须提供一个“容错”共识协议，即能够抵御故障、确保能够就整个系统的状态达成一致的协议。\n\
  \n通过对账本中存储的交易全局状态达成共识，分布式系统中的所有参与者因此共享一个共同的“真相”，基于此可以建立“信任”。\n\n实现共识在分布式系统中至关重要，是为了共享一个共同的“真相”，并将“信任”属性赋予它。\n\
  \n下面我们来看看最常见的共识协议。## 证明工作量（Proof of Work, PoW）\n\n在 PoW 共识协议中，区块链的节点必须使用越来越难的数学挑战来消耗大量计算资源，以达成交易共识。\n\
  \nPoW 实际上生成一个指定长度的哈希值，节点的目标是找出产生该哈希值的输入值。\n\n由于如前所述，哈希算法计算出的值是`不可逆`的，因此解决这些挑战需要“蛮力”，即通过`试错`的方式进行。\n\
  \n这导致区块验证节点（因此得名“Proof of Work”）进行大量计算工作。\n\n找到解决方案的节点会将其结果发送给网络其他节点进行验证（在比特币区块链中，这些节点被称为“矿工”），他们因活动获得以比特币单位或其分数计量的奖励。\n\
  \nPoW 的逻辑是使将新区块添加到链中变得计算上困难且繁琐，从而降低任何人修改交易账本的可能性。\n\n随后，一旦节点找到的解决方案被验证，创建的区块即可插入区块链。\n\
  \n区块链的长度随之增加，反映了达成当前尺寸所需的计算努力（PoW）。\n\n因此，共识是通过简单选择最长链来达成的，这条链因此获得网络的信任。\n\n鉴于 PoW\
  \ 的特性，一旦区块被插入区块链，修改该区块（从而修改其中的交易）就变得极其困难，且随着链长的增加，这种困难程度会进一步提升。\n\nPoW 的优势并非没有代价，代价体现在验证区块所需的时间以及满足计算负载所需的电力上。\n\
  \n为解决这些缺点，被提议的替代共识机制是 Proof of Stake（PoS）。\n\n## 证明权益（Proof of Stake, PoS）\n\n在\
  \ PoS 协议中，使用数字签名替代哈希值，且被选中创建下一个区块的节点是根据该节点在网络中投入的金额来决定的。\n\n区块验证通过向为验证做出贡献的节点分配财务佣金来获得奖励。\n\
  \n## 证明权威（Proof of Authority, PoA）\n\n与之前的机制不同，证明权威（PoA）协议是一种在交易验证节点数量有限的情况下运作的共识机制。\n\
  \n因此，其使用被认为更适合**许可链**（permissioned blockchains），而非公开链（public blockchains）。\n\n在\
  \ PoA 的情况下，共识基于这些节点所获得的更大信任（权威）。\n\n## 拜占庭将军问题\n\n在计算机科学和分布式系统领域，最著名的协调问题之一是所谓的“拜占庭将军”问题。\n\
  \n该问题涉及围困敌军的将军们达成共识的目标：在何时统一发起攻击以保证军事行动的成功。\n\n问题在于，将军们只能通过远程消息交换进行沟通。\n\n每位将军决定攻击或撤退，并通过派遣使者将其决定告知其他人。\n\
  \n然而，这些使者中可能存在“叛徒”，他们通过发送矛盾的消息阻碍达成一致，从而导致无法达成共识。\n\n最终目标是达成共识，统一行动（攻击或撤退），避免行为混乱导致失败。\n\
  \n## 拜占庭将军问题在区块链中的应用\n\n拜占庭将军问题在区块链中表现为选择正确账本版本的需求，该版本应保存真实的交易历史。\n\n在区块链环境中，这种选择发生在存在无法正确通信的节点，或恶意节点试图篡改交易历史、使网络难以达成共识的情况下。\n\
  \n## 如何解决拜占庭将军问题？\n\n拜占庭将军问题因此代表了在存在“叛徒”（即发送矛盾消息的“异端”将军）时，如何协调达成共识的问题。\n\n这个协调问题同样出现在区块链交易达成共识的过程中。\n\
  \n因此，有必要实施一种共识协议，使其即使在存在“不忠”节点的情况下也能保持可靠性。\n\n\n\n\n-   [拜占庭将军问题](https://en.wikipedia.org/wiki/Byzantine_Generals_problem)在拜占庭将军数量等于或超过总数的三分之一时，不存在解决方案。\n\
  \n-   能够抵御拜占庭将军问题的共识协议称为拜占庭容错 (BFT)。\n\n-   工作证明 (PoW) 共识协议展示了这一能力。\n\n-   在 PoW\
  \ 的情况下，拜占庭将军问题通过协议不需要网络中所有节点参与达成共识而得到解决。\n\n## 矿业的目的\n\n-   网络内共识的获得方式因区块链类型而异。\n\
  \n-   因此，并非所有共识机制都适用于所有区块链。\n\n-   在比特币区块链的情况下，共识机制基于经济激励。\n\n-   通过矿业活动，节点被激励帮助达成交易共识，奖励以比特币形式发放（正如我们在讨论\
  \ PoW 时所看到）。\n\n-   这种经济激励体系对于公共区块链尤为重要，因为它使它们能够实现并维持自身架构的可持续性。\n\n## 区块链的不同类型\n\
  \n-   区块链技术存在不同的实现形式，提供不同的功能和特性。\n\n-   事实上，区块链不仅可以根据所采用的共识协议进行区分，还可以根据其他特性进行区分，例如执行智能合约的能力。\n\
  \n-   因此，让我们来看看当前存在的主要区块链类型。\n\n## 公共区块链\n\n-   公共区块链是任何人都可以加入的区块链，无需根据网络内所扮演的角色获得权限。\n\
  \n-   因此，公共区块链也被称为 `permissionless`（无需许可）区块链。\n\n-   公共区块链的例子包括 `Bitcoin`、`Ethereum`、`Litecoin`\
  \ 等。\n\n## 私有区块链\n\n-   在私有区块链中，网络内的读写权限分配给不同的用户群体。\n\n-   读取权限通常是公开的，或分配给不限定的用户群体，而写入权限则保留给预定义的用户群体或组织。\n\
  \n-   因此，事务验证委托给预定义的节点数量。\n\n-   私有区块链的例子包括 `Gem Health` 网络、`Corda` 等。\n\n## 联盟区块链\n\
  \n-   在联盟区块链中，共识管理受限于预定义的主体群体。\n\n-   因此，事务验证不存在激励或经济奖励机制。\n\n-   与公共区块链相比，联盟区块链的事务验证时间更短。\n\
  \n-   联盟区块链的例子包括 `Deutsche Boerse` 和 `R3`。\n\n## 作者简介\n\n-   Alessandro Parisi 作为\
  \ IT 专业人员已有 20 多年经验，在安全数据科学、人工智能网络安全以及区块链专家方面拥有显著经验。\n\n-   他曾在高度复杂的组织和决策环境中工作。\n\
