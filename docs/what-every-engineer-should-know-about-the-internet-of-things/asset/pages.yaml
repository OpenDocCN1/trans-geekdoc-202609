  md: '# Smart Homes¹


    # 6.1 INTRODUCTION


    The smart home (SH) market is exploding. In fact, the market is predicted to increase
    to $174 billion by 2025 (Marr, 2020). The popularity stems from many innovative
    SH devices available to make our lives more comfortable, safe, and convenient
    – such as devices that monitor a person''s health (e.g., monitor sleep, track
    heart activity), increase safety (e.g., alert caregivers), and those that learn
    and adapt to the preferences and behavior of the homeowners. increased processing
    speed, powerful networks, data analytics, artificial intelligence (AI), etc.


    As engineers, we know that a SH is much more than adding a smart refrigerator
    or an intelligent virtual assistant (IVA) such as Amazon Alexa, Google Home, and
    Apple’s Siri to play your favorite music, open the blinds, order more paper towels,
    make reservations, etc. The complexity comes from the required interoperability
    of all the devices and systems in the home and the need for the entire system
    to be energy efficient and the privacy and safety of its inhabitants. That said,
    engineers and developers need to understand everything about SH systems to keep
    improving the security, privacy, scalability, performance, interoperability, efficiency,
    and usability of SH systems.


    The major themes of SH design and development among researchers are as:


    +   Security Design and Management: This area includes security systems and management,
    device security, risk management, security architecture, application security,
    intrusion detection, encryption, authentication, and privacy.


    +   Products: This topic includes specific products for home comfort, such as
    emotion/social connectedness, gardening assistance, entertainment, applications
    to control household devices, home automation systems, smart house assistants,
    and health notification/monitoring.


    +   Activity and Behavior Patterns: This area is focused on identifying human
    activity and behavior patterns, models for planned behavior, and user location
    (ULD).


    +   Power Efficiency: Developers in this area focus on device/system power consumption/efficiency
    and energy optimization.


    +   Systems Design, Simulation: This area includes systems design, models, simulations,
    requirements, architectures, frameworks, cost models, performance-analytics, and
    interoperability solutions.


    > ¹Contributions to this chapter were made by Nina DeFranco Tommareo and Hyunji
    Chun.


    DOI: 10.1201/9781003027799-6'
