  md: '# # 7 IoT in Education¹


    # ## 7.1 INTRODUCTION


    According to analyst firm Gartner, 8.4 billion ‘things’ were connected to the
    Internet in 2017; excluding the laptops, computers, tablets, and mobile phones
    (Gartner, 2017). In addition, an estimate predicts this number to increase to
    64 billion Internet of Things (IoT) devices worldwide by 2025 (Petrov, 2020).
    Regardless of the exact number of devices, spending in this market is expected
    to increase substantially. The International Data Corporation (IDC) is forecasting
    worldwide IoT spending to reach $1.1 trillion in 2023 (IDC, 2019).


    As we have discussed throughout the book, IoT applications are already leveraged
    in diverse domains such as the medical services, small retail, customer service,
    smart homes, environmental monitoring, and industrial internet. Now, because of
    their unique nature, academic academic institutions are looking to incorporate
    IoT in educational activities to benefit students, instructors, and the entire
    education system.


    For example, because IoT can monitor student attendance and in-class activities
    in Alotaibi (2015) and Jiang (2016). However, monitoring can also be applied in
    other ways. Some studies focus on monitoring the students and objects in online
    laboratories’ settings (e.g., Fernandez et al., 2015; Lamri et al., 2014; Bisták,
    2014; Yin et al., 2012; Bin, 2012; Srivastava & Yammijavar, 2016; Shi et al.,
    2010). IoT is also being deployed for more pragmatic scenarios in education. For
    example, Valpreda & Zonda (2016), an IoT-based system was proposed to increase
    children’s knowledge about agricultural food production and consumption. Other
    studies on deploying IoT to educate students with special needs exist (e.g., Sula
    et al. 2013, 2014) for children with autism spectrum disorder.


    Educators in the USA (GSMA, 2012), Japan (Fuse, Ozawa & Miura, 2012), and the
    UK (UNICEF, 2024) already have been applying IoT technologies in their pedagogical
    processes. Also, several academic institutions (e.g., University of San Francisco
    (Nie, 2013)) have incorporated IoT technology to enhance campus safety. The information
    technology and networking giant Cisco has launched several IoT projects for the
    education sector through engaging schools and students in a smart academic forum
    (Cisco, 2013). Despite the several studies available on the inclusion of IoT into
    the education domain, there is a lack of consolidated and coherent views on this
    subject. On the other hand, although beneficial, the adoption of IoT technologies
    in education also poses new challenges to their realization.


    > Excerpts of this chapter are from Kassab, DeFranco and Laplante (2020).


    DOI: 10.1201/9781003027799-7'
