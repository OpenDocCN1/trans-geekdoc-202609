    # 3.4 THE ANATOMY OF A SMART CITY UNDER IoT PERSPECTIVE


    As we have discussed, in a smart city, all the systems are networked together
    to form a real "internet of things" directly or indirectly. These things appear
    in different granularities and dimensions. Hence, we deepen on the smart home
    within the smart city example to discuss how IoT and smart cities are intertwined
    for the sake of exemplification.


    Let us consider a general data life cycle in IoT applications: data acquisition,
    modeling, reasoning, and dissemination (Perera et al., 2014; Maranhão & Bulcão-Neto,
    2016). Data is acquired from physical or virtual sensors (acquisition) and stored
    in an internal and meaningful representation (modeling), as attribute-value pairs.
    Data precessing techniques over modeled data may precede inference processes,
    which apply decision models over these data (reasoning). Then, actors perform
    the decided actions or inference trigger event notifications to a third-party
    system (dissemination).


    Noteworthy depending on the networking, processing, and storage capabilities of
    a given component, these workflow steps may occur at multiple and different components
    of an IoT system (Lynn et al., 2020): at the cloud (centralized), at device, or
    in an intermediate layer between the devices and the cloud (fog).


    Cloud computing to control most IoT systems, like smart cities. It provides sensor
    data collection, access, analytics, and actuation support services, besides administrative
    functions, such as device and user account management and reporting capabilities.
    Fog computing, in turn, has become a commonly used computing paradigm in IoT.
    It is a complement to cloud computing, consisting of fog nodes (e., devices) that
    offer cloud services closer to the users (Gianniakis et al., 2020). Hence, fog
    computing reduces latency and data transfer costs to a, enabling real-time applications
    and services.


    Figure 3.2 illustrates a general IoT-based architecture for smart cities, mostly
    influenced by the ITU-T’s reference model for the IoTs (ITU-T, 2012). The perception
    layer comprises sensors, actuators, tags, and general devices (e., everyday appliances),
    and directly or indirectly (e.g., through a gateway) associated with the network
    layer. The network layer involves networking and transport capabilities that enable
    devices to transmit information securely and with low latency, such as authentication,
    authorization and accounting, and transport of application-specific data. This
    layer is the core of an IoT system because it may connect smart things, network
    devices, and servers through multiple networks, such as the Internet, sensor networks,
    and communications networks. Despite its importance, details about the network
    layer are out of the scope of this chapter.'
