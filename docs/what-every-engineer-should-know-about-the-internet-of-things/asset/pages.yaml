- pgno: 189
  md: '# Blockchain Technologies and IoT


    The Sibling Attack problem is solved by making block validation computationally
    expensive. This concept is called "Proof of Work" (PoW). To translate the actions,
    and therefore the blocks, it is necessary to have high-speed and therefore energy-consuming
    hardware. The network self-adjusts to the available computing power so that the
    time required for validating transactions is approximately constant. In this scenario,
    a Sibling Attack would be costly and therefore impractical.


    Validation of transactions and blocks through PoW is also used for creating currency.
    The first node which validates the current block, stores it in the blockchain
    and earns a fixed amount of cryptocurrency. All nodes concurring for solving the
    computational challenge accept the validated block, solving it, and move on to
    the next block. In this, two problems are solved:


    +   - The remuneration of mining;

    - The gradual introduction of new currency in the system.


    Existing cryptocurrencies typically have a limited amount of currency, or one
    that grows by a fixed amount each year, so that the growth percentage decreases
    over time. Bitcoin is an example of the first approach: the reward for validating
    a block is halved every 4 years, until it reaches zero in 2040. Ethereum is an
    example of the second approach.


    # 11.3 BITCOIN


    Bitcoin is the cryptocurrency par excellence, the mother of all other cryptocurrencies.
    It was introduced in 2009 by Satoshi Nakamoto (Nakamoto & Bitcoin, 2008), the
    pseudonym of a still unknown person or group. Bitcoin is used with three different
    meanings:


    +   - The architecture/platform of the Bitcoin network;

    - The protocols to make this platform work;

    - The "currency" traded on the platform (the acronym is BTC).


    One Bitcoin is composed of 100 million Satoshi (the current minimum transfer unit
    of the cryptocurrency).


    # 11.3.1 THE BITCOIN ADDRESS


    A Bitcoin address is a number associated with a private–public key pair, and it
    is the public part of all Bitcoin transfers.

    An address is generated from the public key so that:


    +   - An address corresponds to a single public key;

    - Given the address, it is not possible to know the public key; this is because
    the explicit knowledge of this key could in the future make the system more vulnerable;

    - An address contains checks in order to recognize any typing errors (as with
    the tax code).'
