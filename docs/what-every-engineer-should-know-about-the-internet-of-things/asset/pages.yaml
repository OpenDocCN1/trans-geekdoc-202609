  md: '# 10.16 DATA INTEGRITY


    Data is the ''blood'' of any computing system including IoT systems. And if a
    network of ''things'' involves many sensors, there may be a lot of data.


    The ability to trust data involves many factors: (1) accuracy, (2) fidelity, (3)
    availability, (4) confidence that the data cannot be corrupted or tampered with,
    etc. Whether any of these is more important than the others depends on the system''s
    requirements; however, with respect to a network of ''things'', the timeliness
    with which the data is transferred is of particular importance. Stale, latent,
    and tardy data is a trust concern, and while it is not a direct problem with the
    "goodness" of the data itself, it is a performance concern for the mechanisms
    within the network of ''things'' that transfer. In short, late, and tardy data
    in certain situations will be no worse than data at all.


    Cloud computing epitizes the importance of trusting data. Where resides is important.
    Where is the cloud? And can the data be leaked from location? A tendency to "your
    data" on "your machine". But in some cases, the data is not just "yours". Least
    data can originate from anywhere and from vendors at the time of their choosing
    and with the integrity of their choosing. Competitors can lease the same data
    (Miller, Voas & Lapante, 2010; NIST, 2016).


    The production, communication, transformation, and output of large amounts in
    networks of ''things'' create various concerns related to trust. A few of these
    include:


    +   Missing or Incomplete Data: How does one identify and address missing or incomplete
    data? Here, missing or incomplete data could originate from a variety of cases,
    but in IoT, probably refers to sensor data that is not released or transferred
    to databases of information that are inaccessible (e.g., clouds). Each network
    of ''things'' will need some level of resilience to be built-in to allow a potentially
    crippled network of ''things'' to still perform even when data is missing or incomplete.

    Data Quality: How does one address data quality? To begin, a definition is needed
    for what data quality means for a particular system. Is it fidelity of the information,
    accuracy of the information, etc.? Each network of ''things'' will need some description
    for what an acceptable level of data quality.

    Faulty Interfaces and Communication Protocols: How does one identify and address
    faulty interfaces and communication protocols? Here, data is the ''blood'' of
    a network of ''things'', the interfaces and communication protocols are the veins
    and arteries of that system. Defective mechanisms that perform transfer within
    a system if ''things'' are equally as damaging to the overall trust in the data
    as is poor quality, missing data, and incomplete data. Each network of ''things''
    will need some level of resilience to be built in to ensure that the data moves
    from point A to point B in a timely manner. This solution might include fault-tolerance
    techniques such as redundancy of the interfaces and protocols.'
