  md: 'assistance of some kind to be 117 million, the overall number of unpaid caregig-ers
    (e.g., family members) is only expected to reach 45 million. That makes one unpaid
    caregiver for every 2.6 persons needing assistance.


    Therefore, a large market opportunity is presented by those people who are online
    and connected, and who would use of technology that is intuitive and consumer-friendly
    to provide care. Yet, there is not enough technology that can make caring needs.


    According to a recent study conducted by Project Catalyst and the Health Innovation
    Technology Laboratory (HITLAB) to better understand how caregivers are currently
    using technology, an average of 71.5% of caregivers reported that they are interested
    in using technology across 17 tested care-giving tasks if such technol-ogy exists
    (Caregivers & Technology, 2016).


    In this chapter, we present a discussion on using IoTs for healthcare. We will
    also present a discussion on how IoT has been used for digital surveillance to
    combat the coronavirus disease 2019 (COVID-19) pandemic. We also discuss considerations
    for traditional and emerging quality requirements in IoTs for healthcare.


    # 9.2 GENERAL CLASSIFICATION FOR USE CASES FOR IOT IN HEALTHCARE


    Healthcare can be delivered in three broad-based serving types:


    +   1. Acute care,

    2. Community-based care, and

    3. Long-term care.


    Acute care refers to a hospital setting where the caregivers are paid healthcare
    pro-fessional. Community-based care is delivered in a home setting, where the
    patient is living in his or her own or another''s home and where caregivers are
    either paid professionals or unpaid family members or friends. Long-term care
    refers to nursing homes or skilled nursing facilities where patients reside for
    weeks, months, years, or for the remainder of their lives where caregivers are
    paid professionals.


    IoTs can be used to collect patient and other data in these settings and aggregate
    the data using analytics then reporting this information to caregivers/or take
    some action (such as shutting down a faulty device). It would be futile to enumerate
    conceivable IoT applications in healthcare after completing any list, new applications
    will be innovative.


    Instead, we define three classes of use cases of healthcare IoTs:


    +   Class A: tracking humans (e.g., patients, caregivers, and family members),

    Class B: tracking things (e.g., medical devices, supplies, and specimens),

    Class C: tracking humans and things.


    Taking the dimensions of care settings and IoT application classes yields nine
    general use cases: acute (A, B, C), long term (A, B, C), and home (A, B, C). In
    the next sec-tion, we will focus on the first class: tracking humans.'
