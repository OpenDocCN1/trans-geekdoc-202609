  md: '# What Every Engineer Should Know About IoT


    fatal consequences. If the PLC of chemical factories is transferred to hackers,
    the neighborhood or the country is at risk – as this control produces a substance
    that is harmful to the human body.


    At the hardware level, in the device itself constitutes the energy system, attacks
    as supply chain compromise, pre-OS boot, and firmware corruption are a risk. Attacks
    targeting software that manages energy systems can attempt to exploit credentials
    and initiate attacks that involve data destruction and data encryption for impact.
    The possible attacks are MITM, network DoS, and service stop attacks that can
    occur over the network within a normed energy system.


    # 5.4.4 BUILDING ATTACK


    When a house or organization is infected with malware, the malware can be transmitted
    through smart device communication. If a hacker attacks an area of building successfully,
    it can be said to have the potential to infect the entire organization. Residents
    can be filmed/recorded by hacked smart TVs and infected AI speakers can eavesdrop
    on personal conversations. Smart video conferencing devices can record the content
    of meetings between employees in the company. These are all examples of privacy
    violations.


    At the hardware level, is the device itself that attacks as supply chain compromise,
    pre-OS boot, and firmware corruption are likely to occur. In this environment,
    or other scenarios, attacks on the network, for example, MITM, can occur because
    it is a networked environment. In addition, since smart homes or offices are relatively
    narrow spaces, data can be stolen from the network or prevent devices from operating
    properly through signal jamming attacks.


    # 5.4.5 PRIVACY BREACH


    Hacking a data system in a smart city that uses Big Data to provide citizens with
    convenient services is on a much larger scale of risk due to information leakage.
    Cyberattacks on sensitively sensitive data such as city administration, health-care,
    and finance can be devastating to city operations. A perfect example is in 2017,
    a database of hospital ''Atrium Health'' was hacked in the United States, and
    2.65 million personal records were leaked (Milliard, 2018). When a user’s credentials
    are hijacked, a security break-in can occur as the key to access the data is acquired.
    There is also a possibility that attack techniques related to data capture at
    the edge/cloud level may be applied.


    # 5.5 SECURING SMART CITIES


    There are many ways to secure smart cities. Possible strategies include the following
    and will be discussed further in the upcoming sections:


    +   Cyber Risk Management: Urban planners and smart city governments can proactively
    seek ways to make their cities'' infrastructures safe from potential cyberthreats.'
