- pgno: 182
  md: '# What Every Engineer Should Know About IoT


    [begin verbatim text]


    To complete this model, we define six elements, namely, environment, cost, geographic-location,
    owner, Device_ID, and snapshot, although that are not primitives, are key players
    in trusting NoTs. These elements play a major role in fostering the degree of
    trustworthiness that a specific NoT can provide.


    +   1. Environment: The universe that all primitives in a specific NoT operate
    in; this is essentially the operational profile of a NoT. The environment is particularly
    important to the sensor and aggregator primitives since it offers context to them.
    An analogy is the various weather profiles that an aircraft operates in or a particular
    factory setting that a NoT operates in. This will likely be difficult to correctly
    define.


    +   2. Cost: The expenses, in terms of time and money, a specific NoT incurs in
    terms of the nonmitigated reliability and security risks; additionally, the costs
    associated with each of the primitive components needed to build and operate a
    NoT. Cost is an estimation or prediction that can be measured or approximated.
    Cost drives the design decisions in building a NoT.


    +   3. Geographic Location: Physical place where a sensor or eUtility operates
    in, e.g., using RFID to decide where a ‘thing’ actually resides. Note that the
    operating location may change over time. Note that a sensor or eUtility’s geographic
    location along with communication reliability and data security may affect the
    dataflow throughout a NoT’s workflow in a timely manner. Geographic location determinations
    sometimes not be possible. If not possible, the data should be suspect.


    +   4. Owner: Person or organization that has a particular sensor, communication
    channel, aggregator, decision trigger, or eUtility. There can be multiple owners
    for any of these. Note that owners may have nefarious intentions that affect over
    time. Note that further owners may remain anonymous. Note that there is also a
    role for an operator; similarly we roll up that role into the owner.


    +   5. Device_ID: A unique identifier for a particular sensor, communication channel,
    aggregator, decision trigger, or eUtility. Further, a Device_ID may be the only
    sensor data transmitted. This will typically originate from the manufacturer of
    the entity, but could be modified or forged. This can be accomplished using RFID
    for physical primitives.


    +   6. Snapshot: An instant in time. Basic properties, assumptions, and general
    statements about snapshot include:


    +   a. Because a NoT is a distributed system, event data, data transfers, and
    computations occur at different snapshots.


    > 7 Trustworthiness includes attributes as security, privacy, reliability, safety,
    availability, and performance, to mean a name.


    > 8 RFID readers that work on the same protocol may be distributed at key points
    throughout a NoT. Readers activate the tag to broadcast radio waves within bandwidths
    reserved for RFID usage by individuals internationally. These radio waves transmit
    identifiers or codes that reference unique information associated with the item
    to which the RFID inlay is attached, and in this case, the item would be a primitive.'
