- pgno: 143
  md: 'IoT in Healthcare


    # 9.4.4 Emerging QUALITY REQUIREMENTS FOR IOT in HEALTHCARE


    Caring can be described as an act or a way to approach a patient. Caring can be
    a trait that one possesses and an adjective to describe what is perceived to be
    a “good” caregiver. Most nurses will be articulate what is perceived of caring
    if asked. Lachman highlights the pervasiveness of the link between nurses and
    caring by pointing out that “caring and nursing are so intertwined that nursing
    appears on the same page in a Google search for the definition of caring”. For
    our purposes, we adopt caring as an adjective (functional quality) with the following
    definition: “displaying kindness and concern for others”.


    Caring likely encompasses all the qualities of trust, reliability, privacy, and
    more, none of them, by themselves, capture the full essence of caring. Instead,
    caring is a super itself resulting as some composite of other ilities (and the
    system called empathy). One possible hierarchical representation for caring in
    terms of these other ilities is to break it down into priority, empathy, and loyalty.


    Other types of systems may contain additional qualities (e.g., usability, availability)
    forming a slightly different hierarchy. Since caring is comprised of some combination
    of other qualities that differ for each stakeholder and each system, we find it
    convenient to express caring for a given system as a linear combination of these
    constituent qualities.


    “Caring” also means different things for different people and for different systems.
    Consider, a robotic surgery system. These systems are used extensively for many
    procedures including heart, cancer, and prostate surgery. While current systems
    are robotic in the sense that the machine mimics the movements of a human surgeon,
    fully autonomous robotic systems are envisioned in the future, replacing nurses
    in the operating room (OR; Bergele & Yang, 2014). When we expect the human surgeon
    and nurses to care about the patient, as systems engineers, what should we require
    of a fully autonomous robotic surgeon? Furthermore, what should the patient expect,
    in terms of a caring system, especially since the patient be unconscious during
    the procedure? Their concerns are somewhat different.


    Consider, eg., the constituent qualities of caring in the robotic surgery system.
    The safe and reliable, likely, as the primary concerns. Both the safety and trustworthy
    operations of the system contribute to a sense of reliability in the system and
    are of concern to the systems engineers. The patient shares these concerns but
    also wants the system to preserve his privacy (e.g., by not exposing medical records
    or embarrassing images). If the actors in the OR were humans, the patient would
    probably also expect a sense of empathy from the surgeons or nurses. Of course,
    robot surgeons look nothing like humans; therefore, there would need to be a means
    by which the robots could emote empathy via speech or facial expression generation
    on some display device. These diverse concerns, with respect to the qualities
    related to caring, will inform the specific requirements discovery and representation
    process.


    Since many different definitions of caring exist, it is important to engage all
    stakeholders when trying to define a notion of caring for a new healthcare system,
    and it is critically important to engage systems engineers, computer scientists,
    doctors,'
  merge: -1
  img_proc: true
- pgno: 144
  md: '# What Every Engineer Should Know About IoT


    nurses, and most importantly patients during requirements discovery. Many traditional
    requirement elicitation techniques could be used to uncover and related requirements
    depending on the size of the system. The most useful elicitation techniques for
    caring and related qualities, include surveys, interviews, prototyping (executable
    and nonexecutable), ethnographic observation, and designer as apprentice. Of course,
    different elicitation techniques may be used with different stakeholder groups,
    and multiple complementary techniques should be used with each group.


    For example, empathy can be expressed via emoticons, prototyping (of various facial
    feature displays or voice outputs) could be used to generate empathy requirements.
    Interviews and surveys of patients could be used to capture desired caregivers
    behaviors (e.g., verbal cues, event triggered) that support patients in their
    belief that the healthcare system is trustworthy and safe. Ethnographic observation
    and designer as apprentice could also be used to elicit caring requirements by
    recording and analyzing the behaviors and movements of caregivers who are rated
    highly along the dimension of caring.


    Of course, caring and related requirements that have been specified and delivered
    successfully, in-built systems could be used in related systems and in product
    lines. Other caring and related requirements may emerge from laws and regulations,
    e.g., in the robotic surgery case, HIPAA. Finally, other requirements for caring
    and related qualities will eventually emerge as standards and reference architectures
    are developed for applicable systems (e.g., smart healthcare).


    # 9.5 SMART MEDICAL DEVICES


    Smart medical devices are life-changing technologies similar to other medical
    advances such as artificial organs, prosthetics, and robotic surgery. IoT has
    made the creation of devices that improve the quality of life and peace of mind
    of individual patients. These type of devices fall into two main categories: devices
    that collect data to provide information aiding in patient care and devices that
    are more advanced than can automate patient care. Following are some examples
    IoT medical devices:


    +   Parkinson''s Movement Tracking: Parkinson''s is a brain disorder that causes
    physical movement problems. This watch-like movement tracking device uses a motion
    sensor to track abnormal movements. The patient can also use the device to record
    medication dosing times. The movements are recorded every 2 minutes. Comparing
    the movement data with the recorded medication dosing assists providers with adjusting
    medication decisions (Talan, 2019). Without a device like this, providers make
    medication adjustments based on a snapshot from a patient that occurs every 3
    months.


