- pgno: 201
  md: '# 12 IoT Requirements

    and Architecture

    A Case Study


    # 12.1 INTRODUCTION


    There are various challenges associated with building requirements and architecture
    for Internet of Things (IoT) systems. First, it is relatively a new domain, and
    capturing the requirements based on the proper domain knowledge is necessary before
    designing and developing IoT-based systems. Most of the developers do not know
    the IoT domain. If a software developer and requirement analyst lack domain knowledge
    regarding IoT, it will be difficult for them to design and develop an effective
    system.


    Second, when specifying the functionality for IoT applications, attention is naturally
    focused on concerns such as fitness of purpose, wireless interoperability, energy
    efficiency, and so on. Conventional requirements elicitations such as domain analysis,
    Joint Application Development (JAD), and Quality Function Deployment (QFD) among
    others are usually adequate for these kinds of requirements. In some domains,
    such as healthcare or education, where IoT applications can be deployed, some
    quality requirements are probably of greater concern.


    Given the increased connection and complexity of IoT technology, there is an increase
    in security-related concerns (Georgescu & Popescu, 2015). Many of the devices
    used in a process, specialized IoT will collect various data that surveillance
    is known or not (Laplante, Laplante & Voas, 2015). Why are these datas being collected?
    Who owns the data? And where does the data come from? These questions need to
    be answered by the legal profession and government entities that will oversee
    the deployment of IoT systems in various domains.


    On the other hand, by embedding sensors into sensor/actuator environments as well
    as terminal devices, an IoT network can collect sensor data that reflect the real-time
    environment conditions of the front sensor/actuator and the events/activities
    that are going on. Since the data is collected in the granularity of elementary
    event in a 7x24 mode, the data volume is high and the data access differs considerably
    from traditional business data. The related scalability will need to be addressed.
    Finally, deploying IoT opens the doors for new attributes to emerge. For example,
    there are questions on the moral role IoT play in human lives, particularly concerning
    personal control. Applications in IoT involve more than computers interacting
    with other computers. Fundamentally, the success of the IoT will depend less on
    how far the technologies are connected and more on the humanization of the technologies
    that are connected.'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'In this chapter, we present a case study for building the requirements and
    the architecture for an IoT-based Home Automation Management System (HAMS).


    # 12.2 CASE STUDY DESCRIPTION: HOME AUTOMATION MANAGEMENT SYSTEM (HAMS)


    Consider a business leader that primarily sells sensors and actuators for building
    automation. They have software applications that manage a network of these devices,
    but this constitutes a loss leader, i.e., they lose money on the software but
    it helps the sale of the hardware devices.


    Now, the company realizes that the hardware is becoming commoditized, and over
    time, the profit margins on the sale of their hardware devices are going to shrink.
    To sustain their business long term, the company decides to create a new building
    automation system that will be profitable. They wish to accomplish this by doing
    two things:


    +   1. Reduce internal development costs and

    2. Expand the market.


    The company wishes to build a single Home Management System that will manage the
    sensors and actuators. With that, the company''s internal development costs can
    be reduced by replacing several of the existing applications with a single one,
    while the market expansion can be achieved by entering and emerging geographic
    markets and opening new sales channels in the form of supporting not only native
    sensors/actuators but also from different manufacturers.


    # 12.3 REQUIREMENTS FOR THE HOME AUTOMATION MANAGEMENT SYSTEM (HAMS)


    The first step is to clearly outline the business goals of the HAMS and their
    refinements; Table 12.1 rest the business goals and refines these into their corresponding
    objectives.


    # TABLE 12.1

    Business Goals and Engineering Objectives for HAMS


    | Business Goal | Engineering Objectives |

    |---|---|n| Reduce internal development costs | 1. Integrate the four existing
    management solutions into a single unified building automation system

    2. Support international languages

    3. Comp with regulations impacting life-critical systems, such as fire alarms,
    to operate within specific latency constraints |

    | Expand by entering new and emerging geographic markets | 4. Support hardware
    devices from different manufacturers

    5. Support conversions of non-standard units used by the different hardware devices
    |

    | Open new sales channels in the form of value-added resellers (VARs/VAPs) | |'
  merge: -1
  img_proc: true
- pgno: 203
  md: '# IoT Requirements and Architecture


    From the engineering objectives, we can start defining the functions product must
    support. For instance, integration (engineering objective 1) implies the features
    of existing applications to be integrated (e.g., lighting, HVAC, security, and
    so forth) must be supported in the system. This may require innovative ways of
    displaying information in the user interface and providing fine-grained control
    on who is allowed to interact with what part of the system. Supporting international
    languages (engineering objective 2) implies personalization capabilities. Regulatory
    policies for safety-critical parts of the system (engineering objective 3) would
    require alarm handling capabilities for situations that cause loss of life. Supporting
    hardware devices from different manufacturers (engineering objective 4) would
    require dynamic configuration capabilities.


    12.1 presents the functionalities of the system through a use case diagram. In
    this diagram, we can see that the IoT engineer intends to manage sensor/actuator
    systems and dynamically reconfigure them. The facilities manager intends to manage
    alarms generated by sensor/actuator systems that monitor a building. Alarms related
    to events that cause loss of life also result in notifications to the public safety
    system. The system administrator intends to manage the users of the building automation
    system.


    The use cases can be further refined into a set of functional responsibilities
    that must be fulfilled by the system. The following responsibilities are derived
    from the use cases shown in Figure 12.1:


    +   1. The system shall send commands to a sensor/actuator device.

    2. The system shall receive events from a sensor/actuator device.


    ![](img/41fdf2aa71adfa568d36836737f447e6_203_0.png)


    FIGURE 12.1 Use case diagram for Home Automation Management System (HAMS).'
  merge: -1
