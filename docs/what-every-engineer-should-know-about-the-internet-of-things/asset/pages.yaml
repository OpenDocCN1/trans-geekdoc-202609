- pgno: 149
  md: '# # 10 IoT Trust Concerns


    # ## 10.1 INTRODUCTION


    As mentioned in Chapter 2, Internet of Things (IoT) refers to systems that involve
    computation, sensing, communication, and actuation (NIST SP 800-183). IoT involves
    the connection between humans, nonhuman physical objects, and cyber objects, enabling
    monitoring, automation, and decision-making. The connection is complex and inherits
    a core set of trust concerns, most of which have no current resolution. This chapter
    contains NIST Internal Report 8222 (NISTIR 8222 (DRAFT)), which details IT trust-related
    concerns for individuals and organizations before and after IoT adoption. The
    set of concerns discussed here is necessarily incomplete given this rapidly changing
    industry; however, this publication should still leave readers with a broader
    understanding of the topic. This set was derived from the six trustworthiness
    elements in NIST SP 800-183. When possible, NIST 8222 (DRAFT) outlines recommendations
    on how to mitigate or reduce the effects of these IoT concerns. It also recommends
    new areas of IoT research and study.


    # ## 10.2 EXECUTIVE SUMMARY OF NIST 8222 (DRAFT)


    The IoT is used in almost every aspect of personal life and is being adopted within
    nearly every country. Governments are taking notice and are looking to mitigate
    IoT from a variety of domains. One dimension is how IoT systems can improve efficiency,
    analytics, intelligence, and decision-making. Another dimension deals with regulation,
    i.e., IoT is a technology that needs governance, legislation, and standards for
    its universal reach and impact. For example, IoT carries security concerns due
    to its high degree of connectivity. Should there be rules or laws to limit security
    issues? And the same applies to privacy, safety, and dependability.


    As with new, proven technology, questions about trustworthiness arise: are the
    benefits worth the risks, i.e., are there more positive reasons to adopt a new
    technology to avoid it? If answered with ‘yes’, a secondary question is: how you
    minimize the risks to make the technology more acceptable and therefore ‘suitable
    for use’ by a wider audience? Most new technologies are created to benefit humanity;
    however, those technologies in the wrong hands can enable harmful and unforeseen
    actions.


    NIST 8222 (DRAFT) is not directly focused on risk assessment and mitigation but
    instead on trust. That is, will an IoT product or service provide the desired
    operations with an acceptable level of quality? To answer this question, the analysis
    begins with a simple understanding of trust. Here, trust is the probability


    > This chapter was contributed by Drs. Jeffrey Voas, Rik Kuhn, Phillip Laplante,
    and Sophia Applebaum.


    DOI: 10.1201/9781003027799-10'
  merge: -1
  img_proc: true
- pgno: 150
  md: 'the *intended* behavior and the *actual* behavior are equivalent, given a fixed
    context, fixed environment, and fixed point in time. Trust is viewed as a level
    of confidence. In this publication, trust is considered at two levels: (1) can
    a ''thing'' or device trust the data it receives, and (2) can a human trust the
    ''things'', services, data, or complete IoT offerings that it uses. In this chapter,
    we are more focused on the human trust concern than the concern of ''things''
    to trust data (however, both are important).


    NISTIR 8222 (DRAFT) promotes awareness of 17 technical concerns that can negatively
    affect one''s ability to trust IoT products and services. It is intended for a
    general information technology audience including managers, supervisors, technical
    staff, and those involved in IoT policy decisions, governance, and procurement.
    This publication should be of interest to early adopters and people responsible
    for integrating the various devices and services into proposed IoT offerings.
    The following is a brief synopsis of each technical concern.


    # 10.2.1 SCALABILITY


    This concern occurs from a combinatorial explosion in the number of ''things''
    that are part of a system. ''Things'' and the services to interconnect them are
    often inexperienced, therefore creating an opportunity for functionality bloat.
    This allows complexity to skyrocket for testing, security, and performance. If
    the average person is associated with ten or more IoT ''things'', the number of
    ''things'' requiring connectivity explodes quickly and so do bandwidth and energy
    demands. Combinatorial explosion and functionality bloat are trust concerns.


    # 10.2.3 HETEROGENEITY


    This concern results from competition in the marketplace. The argument goes that
    with more choices, the competition will result in lower prices. While true, the
    ability of heterogeneous ''things'' to operate and integrate creates a different
    tension related to emergent behaviors. And heterogeneity will almost create *emergent
    behaviors* that will enable new and unknown security vulnerabilities, as well
    as impact other concerns such as reliability and performance. Potential vulnerability
    issues related to heterogeneity also occur with *supply chain* applications.


    # 10.2.4 OWNERSHIP AND CONTROL


    This concern occurs when much of the functionality within an IoT system originates
    from third-party vendors. Third-party black-box devices make trust more difficult
    for integrators and adopters to assess. This is particularly true for security
    and reliability since the internal ''workings'' of black boxes are not observable
    and individually tested. No internal computations can be singled out and black-box
    ''things'' can contain malicious Trojan behaviors. When IoT adopters better understand
    the losing of access to the internals of these acquired functions, they will recognize
    limitations to trust in their composite IoT systems.'
  merge: -1
  img_proc: true
- pgno: 151
  md: '# 10.2.5  COMPOSABILITY, INTEROPERABILITY, INTEGRATION, AND COMPATIBILITY


    This trust concern occurs because hardware and software components may not work
    well when composed, depending on (1) the “right” components were selected, (2)
    the components have the proper security and reliability built-in, and (3) the
    architecture and specification of the system that the components will be incorporated
    into were. Further, problems arise if components cannot be swapped in or out to
    satisfy system requirements, components cannot communicate, or components work
    without conflict. Integration, interoperability, compatibility, and composability
    each impact IoT trust in a slightly different manner for networks of ‘things’,
    and each ‘thing’ should be evaluated before adoption into a system for each of
    its four properties.


    # 10.2.6  “ILITIES”


    This trust concern deals with the quality attributes frequently referred to as
    “ilities”. Functional requirements state what a system shall do. Negative requirements
    state what a system shall not do, and non own requirements, i.e., the “ilities”,
    typically state what level of quality the system shall exhibit both for the functional
    and negative requirements. One difficulty for IoT adopters and integrators is
    that there are dozens of “ilities” and most are not easily measured. Another difficulty
    is that technically a system cannot have high levels of all “ilities” since some
    are in conflict. For example, higher security typically means lower performance.
    And deiciding which is not a well understood process. No cookbook approach exists.
    So, although quality is desired, getting it is the challenge.


    # 10.2.7  SYNCHRONIZATION


    This trust concern stems from IoT systems being distributed computing systems.
    Distributed computing systems have events occurring concurrently. There can be
    numerous computations and events (e.g., data transfers) occurring in parallel,
    and those computations and events must need some degree of synchronization. For
    that occur, a timing mechanism is needed that applies to all computations and
    events; however, no global clock exists. Therefore, timing anomalies will occur,
    enabling vulnerabilities, poor performance, and IoT failures.


    # 10.2.8  MEASUREMENT


    This trust concern stems from a lack of IoT metrics and measures. Metrics and
    measures are keystones of trust. Since IoT is a relatively young set of technologies,
    few metrics and measures are available to adopters and integrators. To date, there
    are few ways to measure IoT systems other than by counting ‘things’ or dynamic
    testing. Because of this, it becomes difficult to argue that a system is trustworthy
    or estimate the amount of testing that a system should receive.'
  merge: -1
  img_proc: true
- pgno: 152
  md: '# 10.2.9 PREDICTABILITY


    This trust stems from an interdependency to predict how different components will
    interact. The ability to design useful IT systems depends at a fundamental level
    on predictability, the assurance that components will provide the resources, performance,
    and functions that are specified when they are needed. This is hard to establish
    in a conventional system, but an extensive body of knowledge in queuing theory
    and related subjects has been developed. IoT systems will provide an even greater
    challenge, since more components will interact in different ways, and possibly
    not at consistent times.


    # 10.2.10 TESTING AND ASSURANCE


    This trust stems from the additional testing challenges created by IoT beyond
    those encountered with conventional systems. The numerous number of interdependencies
    create testing difficulty because of the large numbers of tests that are needed
    to simply cover percentage of the interdependencies. Testing always increases
    when devices and services are black box and offer no transparency to their internal
    “workings”. Most IoT systems will be built from only black-box devices and services.
    IoT systems are highly data-driven and assuring the integrity of the data and
    assuring that a system is resilient to data anomalies will be just a few of the
    many testing and assurance problems related to IoT.


    # 10.2.11 CERTIFICATION


    This trust occurs because certification is difficult and often causes conflict.
    Questions immediately arise as to what criteria will be selected, and will perform
    the certification. Other questions that raise include: (1) What is the impact
    on time-to-market if the system undergoes certification prior to operation? (2)
    What is the lifespan of a ‘thing’ relative to the time required to certify that
    ‘thing?’ and (3) What is the value of building a system from ‘things’ of which
    few received certification? Without acceptable answers to such questions, it is
    unlikely that certification can offer the degree of trust most IoT adopters would
    want.


    # 10.2.12 SECURITY


    Security is a trust for all ‘things’ in IoT systems. For example, sensors data
    may be tampered with, stolen, deleted, dropped, or transmitted insecurely allowing
    it to be accessed by unauthorized parties. IoT devices may be counterfe and default
    credentials are still widely used. Further, unlike traditional personal computers,
    there are few security upgrade processes for ‘things’ as patches and updates.


    # 10.2.13 RELIABILITY


    Reliability is a trust concern for all IoT systems and ‘things’. It rarely be
    possible to claim that an IoT system works perfectly for any environment, context,
    and for any anomalous event that the system can experience. What this means for
    trust is'
  merge: -1
  img_proc: true
- pgno: 153
  md: '# IoT Trust Concerns


    that reliability assessments depend heavily on correct knowledge of the context
    and environment and resilience to handle anomalous events and data. Rarely will
    such knowledge exist and provide complete resilience.


    # 10.2.14 DATA INTEGRITY


    This trust concerns on the quality of the data that is generated by or fed into
    an IoT system. The quality of the data flowing between devices and sensors will
    directly impact whether an IoT system is fit for purpose. The data is the ‘blood’
    flowing through IoT systems. The ability to trust data involves many factors:
    (1) accuracy, (2) fidelity, (3) availability, (4) confidence that the data cannot
    be corrupted or tampered with, (5) Cloud computing prioritizes the importance
    of trusting data. Data remains important. Where is the cloud? And can the data
    be leaked from that location? It is a tendency to think of “your data” on “your
    machine”. But in some cases, the data is not “yours”. Leased data can originate
    from anywhere and from vendors at the time of their choosing and with the integrity
    of their choosing. These trust concerns should be considered during IoT system
    development and throughout operation.


    # 10.2.15 EXCESSIVE DATA


    This concern is overwhelming amounts of data that generates and is processed in
    an IoT system. IoT systems are likely to have a dynamic and rapidly changing dataflow
    and workflow. There may be numerous inputs from a variety of sources such as sensors,
    external databases or clouds, and other subsystems. The potential for the generation
    of vast amounts of data over time renders IoT systems as potential ‘big data’
    generators. The possibility of not being able to guarantee the integrity of excessive
    amounts of data or even process that data is a trustworthiness concern.


    # 10.2.16 PERFORMANCE


    This concern is too much performance. This may seem counterintuitive. The speed
    at which computations and data generation can occur in an IoT system is increasing
    rapidly. Increased computational speed inhibits a system’s ability to log and
    audit all transactions as the rate of data generation exceeds the speed of storage.
    This situation, in turn, makes real-time forensic analysis and recovery from faults
    and failures more difficult as data is local and computational deadlines become
    harder to meet. Consequently, there are fewer ways to “put on the brakes”, undo
    incorrect computations, and fix internal and external anomalies. Furthermore,
    computing faster to a wrong outcome offers little trust.


    # 10.2.17 USABILITY


    This concern deals with whether users understand how to use the devices that they
    have access to. How “friendly” are IoT devices to use and learn? This quality
    is an important consideration for most IT systems but may be more of a challenge'
