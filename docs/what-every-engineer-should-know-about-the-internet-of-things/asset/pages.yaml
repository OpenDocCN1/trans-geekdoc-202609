    ''things'' is increasing rapidly. Increased computational speed inhibits a system''s
    ability to log and audit transactions as the rate of data generation exceeds the
    speed of storage. This, in turn, makes real-time forensic analysis and recovery
    from faults and failures more difficult as data is lost and computational deadlines
    harder to meet. Consequently, there are fewer ways to “put on the brakes”, undo
    incorrect computations, fix internal and external data anomalies. Furthermore,
    computing to a wrong outcome offers little trust.


    A related problem is of measuring the speed of any network of ''things''. Speed-oriented
    metrics are needed for optimization, comparison between networks of ''things'',
