    #  5.3.1 DEVICE/SENSOR LEVEL


    Hardware chips of hub devices such as those that control digital devices or sensors
    (Table 5.1) can be exploited by physical attacks. Sensors used by smart cities
    are often built into traffic lights and streetlamps to manage parking and traffic
    congestion; however, wireless sensors are a vulnerability risk because they do
    not have built-in security. In addition, there are cases where the smart devices
    used in traffic lights, healthcare devices, energy sensors, and home environments
    are attacked at the hardware level (The 8 Most Common Types of Cyber Attacks Explained,
    2019). For example, there were vulnerabilities discovered in Medtronic''s infrastructure
    that enabled an attacker to control an implanted pacemaker remotely through compromised
    software updates (Newman, 2018).


    #  5.3.2 APPLICATION LEVEL


    As shown in Table 5.2, each element of smart cities use mobile or web applications
    to control the devices/sensors and to manage the data generated. Applications
    are a frequent target of cyberattacks via cross-site scripting (XSS) attacks (e.g.,
    injecting malicious script into a client) or man-in-the-middle (MITM) attacks
    (e.g., data transfer eavesdropping). Smart cities are also a target of these type
    of attacks where transmitted data can be intercepted or altered.'
  merge: -1
  img_proc: true
