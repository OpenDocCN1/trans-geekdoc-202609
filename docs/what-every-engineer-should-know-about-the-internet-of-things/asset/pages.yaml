    +   - Implementing performance tactics resulted in the creation of multiple components
    (Rule Manager and Alarm Manager, for instance) that now depend on the virtual
    device. Therefore, based on its current structure, we can predict that some changes
    to the virtual device have the potential to propagate to several other components
