  md: '# What Every Engineer Should Know About IoT


    cameras, social media feeds, and cyber devices – anything that can produce data.
    The things can be wired or wireless – although most are wireless due to the scale
    of IoT and the limitations of wired infrastructures.


    The National Institute of Standards and Technology (NIST), Special Publication
    (800-183), describes the set of building blocks that "govern the operation, trustworthiness,
    and lifecycle of IoT" (Voas, 2016). NIST is a federal agency whose central mission
    is to support innovation. In order to design and enable IoT innovations, it is
    extremely important to understand the underlying and foundational science behind
    IoT; thus, described five primitives (sensor, aggregator, communication channel,
    utility, and decision trigger) that may be used to build an IoT system. This is
    included in Chapter 2 of this book.


    What do the "things" do? They capture data and communicate/transmit the data or
    perform some action (e.g., an actuator). IoT has enabled many new applications,
    helped to expand domains such as big data, business and data analytics, and artificial
    intelligence. Most importantly, the IoT has an impact on quality of life for many.


    #  1.3 IoT ECOSYSTEMS


    IoT has also made an enormous impact on our critical infrastructure systems. When
    the "things" are networked systems, it is called a cyber-physical system (CPS).
    Critical infrastructure systems fall in the CPS category. A system is deemed critical
    when its assets, systems, and networks are so vital that if compromised, would
    have a debilitating effect on US security, economic security, and national health
    or safety. IoT allows these physical devices to connect, network, exchange data,
    and provide real-time decision support. The Cybersecurity Infrastructure Security
    Agency (CISA) – https://www.cisa.gov/) names and defines the 16 critical infrastructure
    sectors below:


    +   - Chemical Sector: The part of the economy that manufactures, stores, uses,
    and transports potentially dangerous chemicals.

    - Commercial Facilities Sectors: A diverse range of sites that draw large crowds
    of people for shopping, business, entertainment, or lodging.'
