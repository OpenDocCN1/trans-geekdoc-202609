  md: '# 9 IoT in Healthcare¹


    # 9.1 INTRODUCTION


    Healthcare is a data-intensive discipline (Patil & Seshadri, 2014) in which large-scale
    data is generated, disseminated, stored, and accessed daily. In 2017, 16.5 million
    patients globally exploited remote health monitoring (a 41% growth from 2016),
    and this panorama has the potential to reach 50.2 million by 2021 (Mack, 2017).
    Also, since January 1, 2018, the US Centers for Medicare & Medicaid Services developed
    new reimbursement incentives to promote the adoption of “active feedback loop”
    devices to provide real-time monitoring (Daniel & Uppaluru, 2017). Data created
    when a patient is monitored or undergoes some tests needs to be accessible at
    a later time by a healthcare provider within the same or even different network
    or context. Healthcare applications that are connected to the Internet, also referred
    to as Internet of Things (IoT) applications in healthcare, have been widely forecast,
    investigated, and even deployed on a small scale. For example, hospitals have
    been implementing “smart beds” that can detect when they are occupied and when
    a patient is attempting to get up, sending this information over the network/Internet
    to nurses (Babu & Jayashree, 2015). The beds also self-adjust to ensure appropriate
    pressure and support is applied to the patient without having to be manually adjusted
    by the users. Another area where smart technology is being discussed as an asset
    is coupled with medication dispensers to automatically upload data to the cloud
    when medication is not taken or any other indicators for which the care team should
    be alerted (Chauffani, 2016).


    The nature of healthcare and the computational and physical technologies and constraints
    present several challenges to system designers and implementers. These challenges
    are complex and include the following:


    +   1. Physical (e.g., available technology);

    2. Logical (e.g., analytics, languages, tools);

    3. Political (e.g., funding, mandates);

    4. Behavioral (i.e., desired functionality);

    5. Communications (e.g., available channels);

    6. Ethical (e.g., governmental privacy protection standards);

    7. Structural (e.g., patterns of architecture and design).


    Despite these concerns, polls show that 90% of Americans still value online access
    to their health records (FDA, 2013). It is easy to perceive that IoT contribute
    to enhancing the quality of caregiving for patients at a reduced cost. For example,
    it was projected by 2020, the number of Americans are expected to need


    > Excerpts of this chapter are from Laplane, P. A., Kassab, M., Laplane, N., Voas,
    J. “Building Caring Healthcare Systems in the Internet of Things.” IEEE Systems
    Journal, 2017.


    DOI: 10.1201/9781003027799-9'
  merge: -1
