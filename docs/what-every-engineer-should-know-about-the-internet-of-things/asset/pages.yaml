  md: '# 4 Smart Cities – Energy¹


    # 4.1 INTRODUCTION


    At the energy level we are experiencing a trend that will change our traditional
    model, moving from centralized to decentralized power generation to produce wind
    and solar energy and reduce carbon emissions. This decentralized model is important
    given the limitations of storing wind and solar energy and therefore the need
    to produce them close to points of consumption. With this advancement, the importance
    of electrical energy is growing much faster than other forms of energy with more
    urbanization and, access to electricity decarbonization of many industries including
    transport.


    As we get more digital, this increase in demand for energy of electricity will
    continue to grow, creating the greatest challenge in the history of humanity which
    is the sustainability of our future together with the exponential growth of technological
    development.


    To make this, we need to make sure that the infrastructures are safe, intelligent
    and sustainable to decarbonize our model and improve the lives of new generations.
    This calls for decarbonization, decentralization, and digitalization of power
    generation.


    This chapter will discuss how the Internet of Things digital technologies are
    changing practically aspects of all of our lives and is transforming how we produce
    and consume energy with what is being called the 4th industrial revolution (Industry
    4.0) with Communications between people, services, and things.


    # 4.2 IoT FOR SMART ENERGY


    The traditional electricity grid is characterized by large generation powers of
    plants that produce energy into the grid and transport it over kilometers to consumption
    points. This model is not sustainable when dealing with smart cities with distributed
    renewable energy sources, thus requiring shifting the infrastructure investments
    from high voltage transmission to medium voltage transmission system that requires
    to balance the consumption with the smaller amount of electricity from distributed
    generation.


    The success of the decarbonization of the energy model depends on a large extent
    on the capacity to integrate renewable sources in a massive way in each of the
    facilities or points of consumption, be it a home, a building or an industry.
    Every consumer of electricity should integrate renewable generation to reduce
    their energy costs and dependence on the traditional centralized grid, becoming
    a “prosumer” (producer and consumer). This means that power generation must gradually
    change from a centralized model in large power plants to a renewable energy model
    distributed throughout the entire electricity grid.


