  md: '# 8 IoT Education¹


    # 8.1 INTRODUCTION


    By 2025 there will be 75 billion connected smart devices (Newman, 2020). Every
    industry is realizing Internet of Things (IoT) can help make their systems and
    devices more effective and efficient, including healthcare, education, retail,
    logistics, workforce management, and many. Thus, there is a clear urgency for
    an IoT workforce that has the skills and knowledge in the areas of computer science,
    engineering, and cybersecurity to build the IoT devices and systems. A quick search
    on indeed.com for US jobs in this area produced 25,920 jobs when searching for
    ‘Internet of things’. Other search terms produced 16,840 jobs with ‘IoT’; 5,314
    with ‘IoT Systems Engineer’; It is important to note that those results did not
    include jobs in the areas of data analytics, algorithms, security, which are clearly
    important disciplines in the design and implementation of IoT as well. In addition,
    the Bureau of Labor and Statistics predicts a 30% increase in these by 2026.


    In this book, we cover the major areas that are using IoT (e.g., education, cities,
    homes, healthcare) – but we need to address how we will teach the next generation
    of engineers that analyze, design, and implement these complex systems. We need
    a new engineering discipline for the 21st century as IoT engineering, IoT systems
    engineering, or network engineering. This is similar to that called for new engineering
    disciplines such when the electrical engineering emerged in the 19th century with
    the invention of the electric motor or as the Industrial Revolution called for
    a chemical engineering discipline to design the mass production of chemicals.
    Even more, we have experienced the Software Engineering discipline that emerged
    with the need for the development of complex software systems. The industry needs
    a complete-physical system (CPS)/IoT curriculum that will require core set of
    competencies from multiple disciplines that is already existing in our engineering
    and computer science programs.


    The goal of this chapter is to present an analysis that determines the state of
    this educational need and to provide the knowledge to advance the effort in adapting
    IoT training within academic institutions to meet the urgent employment needs.
    This chapter presents an analysis of courses related to educating students to
    build IoT and results of a program review for CPS/IoT-related courses currently
    being offered at the top 50 universities ranked by Collegegeice.net. The results
    from this review were analyzed and mapped to the NIST networks of things’ (NoT)
    primitives discussed earlier in this book and the Association for Computing


    > Excerpts of this chapter are from DeFranco, Kassab and Voas (2018); DeFranco
    & Kassab “Considerations for an Internet of Things Curriculum,” HICSS 2019.'
