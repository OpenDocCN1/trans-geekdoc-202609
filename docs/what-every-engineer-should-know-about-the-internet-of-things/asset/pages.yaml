- pgno: 164
  md: '# What Every Engineer Should Know About IoT


    Prediction is different than estimation, although estimation can be used for prediction.
    For example, an estimate of the current reliability of a system, given a fixed
    environment, context, and in time might be 99%. The key word is point in time.
    In comparison, a prediction would say something like: based on an estimate of
    99% reliability today, it is believed that the reliability will also be 99% tomorrow,
    but after tomorrow, the reliability might change. The reason is simple: As time
    moves forward, components usually wear out, thus reducing system reliability.
    Or as time moves forward, the environment may change such that the system is under
    less stress, increasing predicted reliability. In IoT, as ''things'' may be swapped
    in and out on a continuous basis, and predictions and estimations of an ''ility''
    such as reliability will be difficult.


    To date, there are ways to measure IoT systems other than by ''things'' or dynamic
    testing. Counting is a static approach. Testing is a dynamic approach when the
    network is executed. (Note that there are static approaches that do not require
    execution, e.g., a walkthrough of the network architecture.) Thus, the number
    of ''things'' in a system can be counted just like lines of code in software can
    be counted, and black-box testing can be used to measure ''ilities'',


    In summary, several limited recommendations have been mentioned for mitigating
    the current lack of measurement and metrics for IoT. To date, counting and dynamic
    approaches such as estimating reliability and performance are reasonable candidates.
    Static testing (e.g., code checking) can also be used to show that certain classes
    of IoT vulnerabilities are likely not present. IoT methodology is an open question.


    # 10.11 PREDICTABILITY


    The ability to design useful IoT systems depends at a fundamental level on predictability,
    assurance that components will provide the resources, performance, and functions
    that are specified when they are needed. This is hard enough to establish in a
    conventional system, but an extensive body of knowledge in queuing theory and
    related subjects has developed. IoT systems will provide an even greater challenge,
    since more components will interact in different ways and possibly not at consistent
    times.


    Two properties of IoT networks have a major impact on predictability: (1) a larger
    set of communication protocols may be involved in a single network, and (2) the
    network configuration changes rapidly. Communication protocols for networks of
    ''things'' include at least 13 data links, 3 network layer routing, 5 session
    layers, and 2 management standards (Salman). Data aggregators in the network must
    be able to communicate with devices that have widely varying, throughput, and
    storage characteristics. Since many small devices have limited battery life, data
    transmission times must be rationed, so devices are not always online. For example,
    Bluetooth Low Energy (BLE) devices can be configured to broadcast their presence
    for periods ranging from 0.2 to 10.2 seconds.


    In addition to second-by-second changes in the set of devices currently active,
    another issue with network configuration changes stems from the embedding of computing
    devices with the physical world. Even more than conventional systems,'
