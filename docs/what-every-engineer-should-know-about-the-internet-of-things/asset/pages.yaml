    they are indistinguishable from it” (Weiser, 1991). Today this vision is coming
    true, as IoT devices proliferate into every aspect of daily life. According to
    one study, in 4 years there will be more than 500 IoT devices in an average household
    (Gartner), so that they are beginning to disappear.


    But is this disappearance uniformly a good thing? If a technology is invisible,
    then users will not be aware of its presence, or what it is doing. Trust issues
    related to this new technology world when news reports suggest that smart televisions
    were “eavesdropping” on users (Toyukawa, 2015; Chung et al., 2017). Voiceoperated
    remote controls in smart televisions can only work if the televisions are always
    “listening”, but the trust implications are obvious. To resolve concerns in cases
    like this, applications need to be configurable for users to balance convenience
    with their personal security and privacy requirements, and device capabilities
    need to be visible with clear explanation of implications.


    A different set of concerns is involved with technical aspects of device discovery
    in networks of ‘things’. The Internet was built almost entirely on the TCP/IP
    protocol suite, with HTML for web sites running on top of TCP/IP. Standardized
    communication protocols and internationally agreed web names enable consistent
    operation regardless of the computer or router manufacturer. Smartphones have
    the Bluetooth protocol for devices. This structure has not been extended to IoT
    devices, because they generally do not have the processing power to support it.
    Instead, a proliferation of protocol families has developed by different companies
    and consortia, including BLE, ZigBee, Digital Enhanced Cordless Telecommunications
    Ultra Low Energy (DECT ULE), and collection of proprietary technologies for Low
    Power Wide Area Networks (LPWAN). These many technologies result in a vast number
    of possible interactions across various versions of software and hardware from
    many different sources.


    Most computer users are familiar with problems that arise when some business application
    or other software will not run because other software was changed on the system,
    and the two packages are no longer compatible. At least with PCs and mainframes,
    a person generally has a good idea of what is running on the systems.'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'With 500 IoT devices in a home, will the homeowner even know where the devices
    are located? How do they make their presence known, with multiple protocols? It
    may not be clear from day to day what devices are on a network, or where they
    are, much less how they are interacting.


    Device discovery is a complex problem for networks of things (Bello, Zeadally
    & Badra, 2017, the general problem of discovery within networks has been studied
    for decades. There are generally two approaches:


    **Centralized:** Nodes register with a central controller when they are brought
    into a network. The controller manages a database of currently available devices
    and periodically sends heartbeat messages to ensure devices are available, dropping
    from the database that does not respond.


    **Distributed:** In this case, devices conduct a search for partner devices with
    the necessary features, by broadcasting to the local network. This approach avoids
    the need for a central controller, providing flexibility and scalability.


    Scalability requirements for hundreds of devices often lead to implementing the
    distributed approach, but trust issues have enormous implications for discovery
    in a large network. Without sophisticated cryptographically based authentication
    mechanisms, it becomes very difficult to ensure trusted operation in a network.
    For example, it has been shown that malware installed on a smartphone can open
    paths to other IoT devices, leaving the home network fully vulnerable to attack
    (Sivaraman et al., 2016). This is possible because many IoT devices have little
    or no authentication, due to the resource constraints described earlier.


    Discoverability of IoT devices is thus a key problem for trust. Its dimensions
    include human factors, as user''s trust in behavior of devices such as the Smart
    TV, and examples of authentication among devices. Solutions will require adoption
    of some common protocols, which may take years for development of consensus standards,
    or emergence de facto proprietary standards. In many cases, there will also be
    organizational challenges, since different kinds of devices may be installed by
    different organizations. Organizations will need to know what devices are present,
    manage security, or even just to avoid duplication of effort. This need can be
    addressed with audit tools that can identify and catalog devices on the network,
    reducing dependence on user cooperation but requiring trust in the audit tools.


    # 10.21 SUMMARY


    This publication has enumerated 17 technical concerns for any IoT system based
    on NIST (2016). These systems have significant differences with traditional IT
    systems, such as much smaller size and limited performance, larger and more diverse
    networks, minimal or no user interface, lack of consistent access to reliable
    power and communications, and many others. These differences necessitate new approaches
    to planning and design. An essential aspect of developing these new systems is
    understanding the ways in which their characteristics affect user trust and avoiding
    a “business as usual” approach that might be doomed to failure in the new world
    of IoT.'
  merge: -1
  img_proc: true
- pgno: 179
  md: '# IoT Trust Concerns


    For each of the technical concerns, this publication introduced and defined the
    trust issues, pointed out how they differ from IoT as compared with traditional
    IT systems, gave examples of their effect in various IoT applications, and when
    appropriate, outlined solutions to dealing with these issues. Some of these recommendations
    apply not only to IoT systems but to other traditional IT systems as well. For
    the trust issues, IoT introduces complications that defy easy answers in the current
    level of development. These are noted as requiring or industry consensus on solutions.
    This document offers an additional benefit of providing guidance towards a roadmap
    on needed standards efforts or research into how to better trust IoT systems.


    # 10.22 ADITIONAL SUPPORTING INFORMATION


    # 10.22.1 IN INSURABILITY AND RISK MEASUREMENT


    IoT trust issues come to the fore in assessing the impact of this new technology
    on insurance and risk management, because insurance requires that risk be measured
    and quantified. In this era, the emergence of IoT can have significant trade-offs—networks
    of ''things'' can make it easier to estimate risk for the physical systems in
    which devices are embedded, but estimating risk for the device networks themselves
    may be much more difficult than for conventional systems.


    Cars, homes and factories with embedded sensors provide more data than ever, making
    it possible to estimate their risks more precisely, a huge benefit for insurers
    (Forbes, 2016). For example, insurance companies have begun offering lower rates
    for drivers who install tracking devices in their vehicles, to report here, and
    how fast they drive. Depending on a user''s privacy expectations, there are obvious
    trust issues, and the legal aspects of installing such devices to monitor employee
    driving are just being developed (Grossbacher, 2018). Additionally, an often,
    neglected aspect of such devices is the possible trade-off between reducing risk
    by measuring the physical world, such with driving, and increased risk from a
    complex network of things being introduced into a vehicle or other critical system.
    Already there have been claims that vehicle tracking devices have interfered with
    vehicle electronics, possibly leading to dangerous situations (Neison, 2014).
    Examples include claims of losing headlights and taillights unexpectedly and complete
    shutdown of the vehicle (Horcher, 2014). As a result of an unexpected interaction
    between the vehicle monitor and other components of the car''s network of things.


    In addition to estimating the risk, and thus insurability, of systems with embedded
    IoT devices, cybersecurity risks may become much harder to measure. Quantifying
    potential vulnerability for conventional client–server systems, as e-commerce,
    is not well understood, and reports of data loss are common. As a result, insurance
    against cybersecurity attacks is expensive—a $10 million policy can cost $200,000/year,
    because of the risk (the Wall Street Journal, 2018). It will be much more difficult
    to measure risk for IoT networks of thousands of interacting devices than it is
    even for a corporate system made up of a few hundred servers and thousand client
    nodes. IoT interactions are significantly more varied and numerous than client–server
    architectures. Risk estimation for secure systems requires measurement of a work
    factor, the time, and the resource cost of defeating'
  merge: -1
  img_proc: true
- pgno: 180
  md: '# 164 What Every Engineer Should Know About IoT


    a security measure. The same principle has been applied to vaults and safes long
    before the arrival of IT systems - the cost of defeating system security must
    be much higher than the value of the assets protected, so that attackers have
    no motivation to attempt to break in. The problem for networks of things is that
    there are few good measures of the work factor involved in breaking into these
    systems. They are not only new technology, but they have vast differences depending
    on where they are applied, and it is difficult to evaluate their defenses.


    From a protection cost standpoint, IoT systems also have a huge negative trade
    off – the typical processor and resource limitations of the devices make them
    easier to compromise, but at the same time, they have data as sensitive as what''s
    on a typical PC, or in extreme cases may present risks to life and health. Implantable
    medical devices be much harder to secure than a home PC, but the risks are obviously
    much greater (Newman, 2017; Rushanan et al., 2014). Determining the work factor
    in creating security of such devices and “body networks” is an unsolved problem.
    A basic goal may be to ensure that life-critical IoT devices adhere to sound standards
    for development (Haigh & Landweiter, 2015), but establishing trust for such systems
    is likely to remain a challenge.


    To complete further, IoT systems provide functions that may inspire much trust
    from users. Drivers who placed unwanted trust in vehicle autonomy have been involved
    in fatal crashes, with suggestions that they were inattentive and the car could
    successfully avoid any obstacle (Siddiqui & Laris, 2018). Establishing the right
    level of trust for users will likely be a human factor challenge for IoT systems
    for many years to come.


    No specific recommendations are made. It is inevitable that insurers and engineers
    will eventually develop appropriate risk measures and mitigation strategies for
    IoT systems.


    # 10.2.2 REGULATORY OVERSIGHT AND GOVERNANCE


    Regulations have the power to significantly shape consumer interaction with technologies.
    Consider motor vehicles, whose safety is regulated by the National Highway Traffic
    Safety Administration (NHTSA, 2018). NHTSA enforces the Federal Motor Vehicle
    Safety Standards, which specify minimum safety regulations for motor vehicles
    to meet; seatbelts in all vehicles, which can reduce fatalities in vehicular accidents.
    NHTSA likewise regulates supply of vehicles that consumers can buy – and also
    provides access to a safety rating system that consumers can consult. Multiple
    studies have shown the potential for regulations to continue to increase the safety
    of motor vehicles (e.g., Neely & Richardson, 2009).


    Regulatory oversight and governance have been established in most domains for
    safety-critical systems. However, there is no parallel to the NHTSA for IoT systems:


    +   1. There are no regulations on the security of IoT devices.

    2. There is no oversight on the licensing of IoT device manufacturers.

    3. There are no governing authorities evaluating the security of IoT devices.'
