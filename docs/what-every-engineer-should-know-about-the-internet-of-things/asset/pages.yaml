    # 8.7 RECOMMENDATIONS


    It is urgent that engineering programs provide engineering students with the skills,
    tools, and training to design, implement, and validate these complex IoT and CPSs.
    The current state according to the data presented in this chapter indicates that
    course offerings are at the beginning stages. This is not surprising the challenge
    academic programs have in adding courses and/or establishing new programs in general.
    Thus, it may be practical for a traditional college-level curriculum to adapt
    the conventional courses to include the tools and'
