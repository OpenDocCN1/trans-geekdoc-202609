    #  2.3.3 PRIMITIVE #3: COMMUNICATION CHANNEL


    A communication channel is a medium by which data is transmitted (e.g., physical
    via Universal Serial Bus (USB), wireless, wired, verbal). Basic properties, assumptions,
    recommendations, and general statements about communication channel include include
    the following:


    +   1. Communication channels move between computing, sensing, and actuation.

    2. Since data is the "blood" of a NotT, communication channels are the "veins"
    and "arteries", as data moves to and from intermediate events at different snapshots
    in time. We talk about the role of snapshots in time in Section 2.3.

    3. Communication channels will have a physical or virtual aspect to them, or both.
    Protocols and associated implementations provide a virtual dimension. W provide
    a physical dimension.

    4. Communication channel dataflow may be unidirectional or bidirectional. There
    are many conditions where an aggregator might query more advanced sensors, or
    potentially recalibrate them in some way (e.g., request more observations per
    time interval).

    5. No standardized communication channel protocol is assumed; a specific NotT
    may have multiple communication protocols between different entities.

    6. Communication channels may be wireless.

    7. Communication channels may be an offering (service or product) from third-party
    vendors.

    8. Communication channel trustworthiness may make sensors appear to be failing
    when the communication channel is failing.

    9. Communication channels can experience disturbances, delays, and interruptions.

    10. Redundancy can improve communication channel reliability. There may be more
    than one distinct communication channel between a computing primitive and a sensing
    primitive.'
