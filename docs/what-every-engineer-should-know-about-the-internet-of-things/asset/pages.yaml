  md: '# Internet of Things Defined


    +   * Communications Sector: The underlying operations for businesses, public
    safety, and government.

    * Critical Manufacturing Sector: Primary metals, machinery, electrical equipment,
    appliance, transportation, and component manufacturing.

    * Dams Sector: Navigation locks, levees, hurricane barriers, water retention facilities,
    etc.

    * Defense Industrial Base Sector: The maintenance of military weapons, subsystems,
    and components to meet US military requirements.

    * Emergency Services Sector: Agencies that prevent/prepare/respond/recover a range
    of emergency services.

    * Energy Sector: The energy supply.

    * Financial Services Sector: Depository institutions, providers of investment
    products, insurance companies, other credit and financing organizations, and the
    providers of critical financial utilities and services.

    * Food and Agriculture Sector: Food manufacturing/processing/storage facilities
    – also have criticality on other critical infrastructure (water, transportation,
    energy, chemical).

    * Government Facilities Sector: A wide variety of US-owned facilities.

    * Healthcare and Public Health Sector: Public and private healthcare organizations
    that respond and provide recovery across all other sectors in the event of a natural
    or man-made disaster.

    * Information Technology Sector: The virtual and distributed functions that produce
    and provide hardware, software, and information technology systems and services,
    and the Internet.

    * Nuclear Reactors, Materials, and Waste Sector: The reactors that provide electricity
    to millions of Americans, the medical isotopes used to treat cancer patients,
    the nuclear reactors, materials, and waste sector.

    * Transportation Systems Sector: This sector includes aviation, highway, maritime
    transit, passenger rail, pipeline, freight, and postal.

    * Water and Wastewater Systems Sector: Public drinking water and wastewater systems.


    # 1.4 IoT Applications


    IoT is slowly pervading every part of our lives.³ Consider the Amazon Go app used
    with a mobile app and RFID tags, the customer takes an item off a shelf and an
    instantaneous charge is posted to their account (and the store inventory is decreased!).
    If the customer changes their mind, they can put the item back on the shelf to
    credit their account and the store inventory. Using computer vision, deep learning,
    and RFID, a customer can walk in the store, take an item off the shelf, put the
    item in bag, and walk out of the store. The time saved is amazing. The remainder
    of this section will cover IoT in the most prevalent domains.


