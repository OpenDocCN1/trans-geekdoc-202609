  md: '# 5 Smart Cities – Security¹


    # 5.1 INTRODUCTION


    Smart cities use networked technology to gather data to optimize and manage city
    resources, businesses, and government entities. The optimization of a smart city
    comes from leveraging the data aggregated and analyzed that is collected from
    a city''s assets. With the appropriate analysis of data collected from a city''s
    assets, city components such as traffic patterns, energy distribution, and air
    quality can be improved more efficiently. These improved elements of a smart city
    can also increase the quality of life and convenience for its citizens, integrating
    IT technology into many aspects of a citizen''s day-to-day tasks such as simplifying
    access to a city''s services. According to the American Society of Mechanical
    Engineer (ASME), subjects such as mobility, healthcare, water, energy, engagement
    and community, economic development and housing, and security can all be integrated
    into the core of a smart city to create an infrastructure that makes a smart city
    (Kosowatz, 2020). The three US smart cities are New York, NY; Boston, MA; and
    San Francisco, CA (Datalux.com). Smart cities have also been deployed in many
    places such as Europe, Singapore, and South Korea.


    Smart city implementations come with challenges such as insufficient funds, inconsistent
    connectivity, lack of experienced professionals, and security risks (Joshi, 2020).
    The focus of this chapter is on cybersecurity, and preparing countermeasures for
    the cyberattacks in a smart city can protect the lives of its citizens. Smart
    city security threats will be examined from a multilayer perspective, targeting
    representative elements that make up a smart city. This chapter will also describe
    attack scenarios and threat countermeasures. In addition, a discussion on educating
    the professionals needed to design and build smart cities will be provided.


    # 5.2 SMART CITY ARCHITECTURE


    One of the goals of a smart city is to improve the quality of life of people by
    building an IT infrastructure that improves the many pieces of everyday life.
    Figure 5.1 shows the multilayer architecture of a smart city. Figure 5.1 also
    shows the attack points of each layer. Security and privacy are essential in a
    smart city environment where many end-point devices are connected to the Internet,
    communicate with each other, and accumulate data store in a cloud. Cyberattacks
    on a smart city can debilit critical system such as water and electricity. In
    addition, these attacks can be very damaging on an individual level because smart
    cities are enabled by cyber-physical systems (CPSs), which involve connecting
    devices and systems as Internet of Things (IoT) (Aldairi & Tawalbeh, 2017). Emergency
    alert systems, street surveillance, and smart traffic lights are very vulnerable
    (Lawrence, 2021).


    > ¹ Excerpts of this chapter are from Chung, Park and DeFranco (2021).


