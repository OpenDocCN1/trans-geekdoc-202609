- pgno: 140
  md: '# What Every Engineer Should Know About IoT


    sharing of information that is needed to provide high-quality care across the
    continuum. Many of the devices used in a provisioned, specialized IoT will collect
    various data whether surveillance is known or not (Laplande, Laplande & Voas,
    2015). If so, where does data go? Who owns it? And why is it being collected in
    the first place? Sensors and surveillance will be huge concerns to argue convincingly
    for pricing when the economic healthcare providers are overwhelming for this technology.


    The Health Insurance Portability and Accountability Act (HIPAA) of 1996 addresses
    how patient''s personal health information can be used and shared not only to
    ensure privacy but also for sharing of information that is needed to provide high-quality
    care. HIPAA is an integral part of today''s healthcare system, and no provider
    would argue its relevance. New concerns, however, have been raised to the relationship
    of HIPAA and the IoT.


    A Forbes magazine report calls for new federal privacy legislation, built-in for
    IoT devices, data minimization (storing less, not more data), and security breach
    notification (Mcue, 2016).


    In February 2016, the Office of the Privacy Commissioner of Canada released a
    34-page report (Privacy Commissioner of Canada Report, 2016) outlining concerns
    for privacy and data the IoTs continues to take shape: "The Internet of Things
    has been compared to electricity, or a nervous system for the planet, to illustrate
    phenomena that are at once pervasive, unseen and will become crucially integrated
    within the fabric of our society", states the report. "Several international experts,
    thinkers and technology builders are forecasting profound, social and economic
    transformations; concerns about privacy and surveillance are chief among them".


    There has also been a substantial amount of academic research considering IoT
    functionality versus privacy. For example, Winter conducted a survey of Hawaiian
    healthcare consumers to identify "practices that will be brought about by the
    IoTs that may be perceived as privacy violations"\Winter, 2012). Essentially,
    Winter found that consumers were willing to trade-off privacy for the perceived
    benefits of information sharing. Moreover, Thierer argues against rash, restrictive
    regulation in response to security and privacy concerns that could thwart innovation
    in applications (healthcare) related to wearable IoT technologies (Thierer, 2014).
    And Walla discusses some of the issues of patient privacy in the Internet-hosted
    records that are not covered by HIPAA (Walla, 2008) and Mercuri considers regulations
    intended to improve healthcare data access have created new security and privacy
    risks with regulatory complexity for patients and practitioners (Mercuri, 2004).


