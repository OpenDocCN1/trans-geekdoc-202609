  md: '# 8.3 THE ACM AND IEEE COMPUTER SCIENCE KNOWLEDGE AREAS


    The ACM and IEEE Computer Society have a long record of sponsoring efforts to
    establish international curriculum guidelines for academic programs in computing.
    These guidelines are approximately a 10-year cycle starting with the publication
    of Curriculum 68 (Atchison et al., 1968) 50years ago. The IEEE/ACM Curriculum
    Guidelines for Undergraduate Programs in Computer Science was published in 2013
    (Force, 2013). In Computer Science, one can view the body of knowledge (BOK) as
    a specification of the content to be taught and a curriculum as an implementation.
    As shown in Table 8.1, the IEEE/ACM BOK is composed of 18 KAs.


    KAs are not intended to be in one-to-one correspondence with a course that is
    part of a curriculum. A set of topics was recommended from Voas and Laplante to
    be considered when creating new computer science curricula, or the recommendations
    can be used to modify an existing computer science curriculum (Voas & Laplante,
    2017). Further, if the curriculum is focused on CPS issues rather than IoT, modifying
    a systems engineering, electrical engineering, or mechanical engineering curricula
    might be worth pursuing as well.


    # 8.4 MAPPING STUDY AND PROGRAMS REVIEW


    We conducted a review with the goal of discovering how IoT knowledge is currently
    taught in academia. This review was completed in two parts:


    +   1. Mapping Study: First we searched the Engineering Village database to learn
    about existing research and the proposed courses for designing and implementing
    IoT and CPS. The Engineering Village database is a comprehensive database that
    aggregates 12 engineering literature and patent databases to provide coverage
    from a wide range of trusted engineering sources.


    # TABLE 8.1

    IEEE/ACM Computer Science Knowledge Areas


    | Algorithms and complexity | 10 | Networking and communications |

    |---|---|--|

    | Architecture and organization | 11 | Operating systems |

    | Computational science | 12 | Platform-based development |

    | Discrete structures | 13 | Parallel and distributed computing |

    | Graphics and visualization | 14 | Programming languages |

    | Human-computer interaction | 15 | Software development fundamentals |

    | Information assurance and security | 16 | Software engineering |

    | Information management | 17 | Systems fundamentals |

    | Intelligent systems | 18 | Social issues and professional practice |'
