    tied have significant implications for user trust.


    # 10.2.18 Visibility and Discovery


    The visibility concern manifests when technologies become so ingrained into daily
    life that they disappear from users. If you cannot see a technology, how do you
    know what it might be doing? For example, with voice response technology such
    as a smart speaker, when you talk to the device, do you know if it is the only
    system listening, and do you know if the sounds it hears are stored somewhere
    for eternity and linked to you?


    The discovery trust concern stems from the fact that the Internet was built almost
    entirely on the TCP/IP protocol suite, with HTML for web sites running on top
    of TCP/IP. Standardized communication port numbers and agreed web domain names
    enabled consistent operation regardless of the computer or router manufacturer.
    This structure has not extended to IoT devices, because generally do not have
    the processing power to support it. This has enabled a vast number of possible
    interactions among various versions of software and hardware from many different
    sources. These interactions are prone to security and reliability problems.


    In addition, to these the 17 concerns, this chapter concludes with two nontechnical,
    trust-related issues. In the Section 10.22, the impact that many of the 17 technical
    concerns have on insurance and risk measurement will be discussed as well as how
    a lack of IoT regulatory oversight and governance affects users of IoT technologies
    by creating a vacuum of trust in the products and services that they can access.


    # 10.3 Introduction of NIST 8222 (DRAFT)


    The IoT is being utilized in almost every aspect of life, although this fact is
    often unknown and not advertised. The incorporation of IoT into everyday processes
    will continue to emerge.


    According to Forbes magazine (Columbus, 2017), there will be a significant increase
    in spending on the design and development of IoT applications and analytics. Furthermore,
    the biggest increases will be in the business-to-business (b2b) IoT systems (e.g.
    manufacturing, healthcare, agriculture, transportation, utilities), which will
    reach $267 billion by 2020. In addition to b2b, smart products are becoming more
    prevalent as smart homes, smart cars, smart TVs, even smart light bulbs, and other
    basic commodities. In other words, products that can sense, learn and react to
    user preferences are gaining acceptance and are deployed in modern living.'
