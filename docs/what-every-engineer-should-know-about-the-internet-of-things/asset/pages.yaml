- pgno: 183
  md: '# IoT Trust Concerns


    +   b. Snapshots may be aligned to a clock synchronized within their own network
    (NIST, Weiss et al., 2015). A global clock may be burdensome for sensor networks
    that operate in the wild. Others, however, argue in favor of a global clock (Li,
    2004). This publication does not endorse either scheme at the time of writing.


    +   c. Data, without some ''agreed upon'' time stamping mechanism, is limited
    or reduced value.


    +   d. NoTs may affect business performance – sensing, communicating, and computing
    can speed or slow down a NotT''s workflow and therefore affect the ''perceived''
    performance of the environment it operates in or controls.


    +   e. Snapshots may be tampered with, making unclear when events actually occurred,
    not changing time (which is not possible) but by changing the recorded time at
    which an event in the workflow is generated, or computation is performed, e.g.,
    sticking in a delay(y) function call.


    +   f. Malicious latency to induce delays is possible and will affect when decision
    triggers are able to execute.


    +   g. Reliability and performance of a NoT may be highly based on (e) and (f).


    **verbatim text**


    NIST 8222 (DRAFT) has taken Section 10.3 from NIST SP 800-183 and expanded into
    a richer discussion as to worrying IoT products and services is difficult. It
    has derived 17 new technical trust concerns from the six elements in NIST SP 800-183.
    For example, the snapshot element briefly mentioned in NIST SP 800-183 is discussed
    in detail in Section 10.7 concerning a lack of precise timestamps.


