  md: '# Blockchain Technologies and IoT


    When the Bitcoins associated with an address are spent, the public key B is made
    visible in the blockchain, and thus, it becomes more vulnerable.


    # 11.3.2 THE BITCOIN BLOCKCHAIN


    The blockchain is composed of an ordered sequence of blocks. These blocks contain
    the validated transactions, which in turn contain the Bitcoin transfers from one
    address to another and the payment of the block reward to the miner who validated
    it.


    A block is composed of a header and all its transactions. A block header contains
    the following data:


    +   * Date and time

    * Number of transactions contained in the block

    * Nonce (a 32-bit integer)

    * Block hash

    * Hash of the previous block

    * Merkle tree hash containing transactions


    It follows a list of all the transactions in the block, contained in a Merkle
    tree (an efficient data structure to verify by hash that the transactions have
    not been altered.


    The blockchain is a sequence of blocks, each with a hash to ensure its inalterability.
    Each block also incorporates the hash of the previous block, thus “hooking” the
    together and creating the “chain”. If a block of the blockchain were altered,
    the hash would also be altered, and therefore, to preserve the integrity of the
    blockchain, it would also be necessary to modify all subsequent blocks. Since
    the computation of the hash of a block is computationally costly, such alteration
    is practically impossible.


    The main features of a blockchain technology are as follows:


    *Transparency:* all the transactions (the whole history) are stored and can not
    be altered. For each transaction, it is possible to know the amount in Bitcoins,
    the addresses from which they are withdrawn, and to which the transfer goes. In
    this way, a complete tracking of Bitcoin transfer flows from one address to another
    is possible.


    *Anonymity:* In the Bitcoin system, the holders of the funds are identified only
    by an anonymous address, to which a private key is associated. Thus, the flow
    of Bitcoin from one address to another is completely transparent, the holders
    of the funds are only identified by an anonymous address.


    *Double Spending:* only the first verified transaction is accepted, all the others
    are rejected.


    *Nonrepudiation:* once a transaction has been sent and accepted, it cannot be
    canceled for any reason.


    *Security:* the transaction can only be activated by the private key relating
    to the withdrawal address of the funds. If this key is lost, the related funds
    are lost forever.'
