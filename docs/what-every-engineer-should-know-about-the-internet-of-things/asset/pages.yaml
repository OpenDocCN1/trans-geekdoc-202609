    # 3.5 CHALLENGES FOR USING IoT AS THE BACKBONE OF SMART CITIES


    Several challenges remain to bring smart cities to reality. Some of them are discussed
    as follows.


    Interoperability: Interoperability per se is a grand challenge for several disciplines,
    ranging from computer networks, passing by information systems, and reaching software
    engineering (Boscarioli, Araujo & Maciel, 2017; Maciel et al., 2017). For smart
    cities and IoT, this is not. Recalling the basic notion, interoperability consists
    of the ability to use two or more systems to exchange data/information and use
    the data/information exchanged. Then, interoperability is a challenge because
    interoperability links should enable effective communication between technology
    elements, and those elements can be highly heterogeneous. The operating systems
    or components maybe be codified in different programming language paradigms, or
    are deployed in different hardware architectures or operating systems, or the
    networks to communicate are not compatible (compatible), or the difference can
    be even at business, with a person being with a different set of attributes in
    two different systems. In cases, *how to establish communication between these
    systems and enable them to exchange data and use the data effectively*


    In IoT-based systems (as smart cities), these challenges can be maximized once:
    (1) the metrics used to sense the environment are between different things and
    demand conversions (e.g., Fahrenheit or Celsius in different devices), (2) the
    data representation can be different, which could cause redundancy or inconsistencies
    in the data being represented in the data modeling step (e.g., ontologies and
    object-oriented models), and (3) of the reasoning demands a sort of intelligence
    to deal with high diversity of types of data and their associated representation
    (e.g., rule- and ontology-based reasoning).


    Solutions have been proposed over the years, as realizing the full interoperability
    (Maciel et al., 2017). In the former, supporting all interoperability levels (syntactic,
    semantic, pragmatic, dynamic, and organizational or conceptual) for specific domain
    applications could be considered as full interoperability. In the latter, the
    idea comprises the autic synthesis of middleware, i.e., a software component capable
    of abstracting the heterogeneities mentioned above, for specific domains. For
    instance, in a smart home environment, a software component could analyze the
    rounding things and automatically synthesize a component capable of collecting
    the data representation formats, as automatically establishing mappings that could
    support a communication without inconsistencies between the involved components.
    This could avoid inconsistencies in fault detection, for instance. However, both
    topics are still a matter of interest but promise to solve the problem for IoT
    and smart cities.


    *A Quality Model for IoT and Smart Cities:* We mentioned the possible consequences
    of different architectural designs over the quality exhibited by a smart home
    system during this chapter. The complexity of trading-off the multiple quality
    attributes involved in a city-scale system can be even more challenging. Indeed,


    41'
