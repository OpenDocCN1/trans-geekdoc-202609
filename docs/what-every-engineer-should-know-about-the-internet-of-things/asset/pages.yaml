  md: '# IoT Trust Concerns


    The 17 technical concerns are (1) scalability; (2) heterogeneity; (3) control
    and ownership; (4) composability, interoperability, integration, and compatibility;
    (5) ''ilities''; (6) synchronization; (7) measurement; (8) predictability; (9)
    IoT-specific testing and assurance approaches; (10) IoT certification; (11) security;
    (12) reliability; (13) data integrity; (14) excessive data; (15) speed and performance;
    (16) usability and discovery. The publication also offers recommendations to reduce
    the impacts of some of the 17 concerns.


    This chapter also addresses two ٹرسٹ concerns in Section 10.22: insurability and
    risk management and lack of regulatory oversight and governance.


    In summary, NIST 8222 (DRAFT) addresses the original IoT trust elements presented
    in NIST (2016). It also serves as a roadmap for where research and thought needed.


    # 10.4 OVERHELMING SCALABILITY


    Computing is now embedded in products as mundane as light bulbs and kitchen faucets.
    When computing becomes part of the tiniest of consumer products, quality becomes
    an issue, particularly if these products require network connectivity. Referring
    back to the primitives introduced earlier, scalability issues are seen particularly
    with the sensor and aggregator components of IoT. Collecting and aggregating data
    from IoTs to hundreds of devices sensing their environment can quickly become
    a performance issue.


    Consider this analysis. If the average person is associated with then or more
    IoT ''things'' requiring connectivity quickly and so do bandwidth and energy demands.
    Computing, architecture, and verification changes are inevitable, particularly
    if predictions of 20–50 billion IoT devices being created within the next 3 years
    come true. More ''things'' will require a means of communication between the ''things''
    and the consumers they serve, and the need for intercommunication between ''things''
    adds an additional scalability concern beyond simple complexity (Voas, Kuhn &
    Laplante, 2018a).


    Increased scalability leads to increased complexity, the converse is not necessarily
    true. Increased scalability is not necessarily true. Increased complexity can
    arise from other factors such as infinite numbers of dataflows and workflows.


    Unfortunately, complexity does not itself to trust that it is easy to verify.
    Consider an analogous difficulty that occurs during software testing when the
    number of source lines of code (SLOC) increases. When SLOC increases, more test
    cases are needed to achieve greater testing coverage. Simple statement testing
    coverage is the process of making sure that a test case touches (executes) each
    line of code test. As SLOC increases, so the number of paths though the code,
    and when conditional statements are considered, the number of test cases to exercise
    all of them thoroughly upon the definition of


