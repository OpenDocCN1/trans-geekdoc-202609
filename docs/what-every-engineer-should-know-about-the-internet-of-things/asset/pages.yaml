    (the). About 7% of all academic institutions in the United States have at least
    one breach. From 2005 to 2014, 66% of academic institutions listed in the PRC
    experienced only one reported breach. However, about one-third of institutions
    with breaches have more than one. Six of the listed institutions have experienced
    five or more reported breaches. Hacking/malware where an outside party accessed
    records via direct entry, malware, or spyware was the largest portion of the reported
