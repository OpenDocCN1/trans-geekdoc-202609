    # 7.2 WHAT ARE THE BENEFITS OF THE ADOPTED SCENARIOS OF IoT IN EDUCATION?


    # 7.2.1 APPLYING IoT IN DIFFERENT EDUCATION LEVELS AND SUBJECTS


    The literature suggests that IoT can be incorporated at all education levels.
    We provide a mapping of the primary selected studies into the educational levels
    in: https://bit.ly/2XCZFI5K. We also find that IoT incorporation is not limited
    to particular education subjects. “Computer, Electrical and Electronics Engineering”
    education, “Science”, “language skills” education, “Physical education”, “Physiological
    education”, and “Business education”.


    # 7.2.2 PERCEPTION


    Perception is a way of regarding, understanding, or interacting with something.
    More specifically, in the context of this chapter, perception refers to a stakeholder
    role that calls on the IoT system to deliver one of its services in education
    settings. A stakeholder has a goal concerning the system – one that can be satisfied
    by its operation. We identified from the extracted scenarios three different primary
    stakeholders, each'
