    # 6.5 POWER EFFICIENCY


    Power is another predominant topic with cost reduction (energy efficiency), comfort,
    and safety as concerns. Cost reduction can come from estimating energy consumption.
    Popa et al. (2019) presented a modular platform that creates user awareness from
    an advanced neural network model from the aggregated stored user data.


    Home Energy Management System (HEMS) focuses on energy efficiency while maintaining
    user comfort. HEMS reduced consumption by 5.15% and comfort by 42.3%(Matsui, 2017).
    One of the most concerning issues with power outlet system can react fast and
    avoid overconsumption, fires, and shocks (Fernandez-Carames, 2015).'
