    # 1.5 IoT CHALLENGES


    Clearly IoT-enhanced systems have many benefits such as ubiquitous network connectivity,
    real-time response, enhanced situational awareness, and process optimization (CISA,
    2019). The IoT system challenges are the same quality requirements that should
    be designed into any system. Here are a few examples that will be expanded upon
    Chapter 12, the requirements chapter of the book:


    +   - Security: Systems should be resilient to attacks (e.g., avoiding single
    points of failure); authenticate retrieved data; implement access control; maintain
    privacy.

    - Trust: This is an involved topic as the IoT connections and systems inherit
    a core set of trust concerns. Trust is very difficult to test and prove. This
    will be avoided in Chapter 10, where the NIST Internal Report 8222 (NISTIR 8222
    (DRAFT)) is included. This report details 17 trust-related concerns for individuals
    and organizations before and after IoT adoption (Voas et al., 2018).

    - Reliability: IoT systems should perform as expected and should not terminate
    abnormally. Maintenance and repairs reliability issues to be avoided.

    - Safety: IoT applications should have parameters that show in a specific range.
    A safety (and security) violation can cause harm to its operational environment
    (Zalewski, 2019). Consider the levels of safety concerns shown in Figure 1.1.
    Individuals are wearing medication IoT devices, households have IoT devices protecting
    the homeowners, smart cities have automated automated systems (e.g., traffic,
    power/energy distribution), and industries have critical infrastructure.

    - Scalability: The system should be able to grow with minimal interruption. Address
    traffic and loading issues – especially in private clouds.

    - Vulnerability: The system should be tested for possible attacks. With the increased
    connectivity in IoT systems, there is an increased attack surface. Vulnerabilities
    can be inadvertently or deliberately planted.


    One of the most important challenges for IoT systems is the inadvertent creation
    of ad hoc networks. Due to, the high level of connectivity using wireless devices,
    an IoT can can accidentally, or through malicious intent, make a connection to
    another IoT network in range, causing undesirable consequences. For example, if
