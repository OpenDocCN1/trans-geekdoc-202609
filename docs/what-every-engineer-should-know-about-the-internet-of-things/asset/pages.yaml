  md: 'With the increased use of IoT in the education domain, it is of utmost importance
    to study how this technology with its distinguished systems functions, as sensing
    and decision-making, can support and challenge the pedagogical processes for all
    interacted actors (faculty, students, and staff) as well as all involved assets
    (e.g., libraries, classrooms, laboratories).


    Although there are several benefits of the inclusion of IoT into the education
    domain, there is still lack of consolidated and coherent views on this subject.
    Hence, the discussions in this chapter aim to close the gap of knowledge and embark
    on mapping the published studies available. Results of a systematic literature
    review focused on the benefits and the challenges faced in education integrating
    IoT into the curriculum and educational environments will be presented. Differing
    mapping views of the extracted studies are provided as well as a summary of the
    already implemented tools and a list of gap research questions yet to be investigated.
    We also provide a tool for an adaptive learning experience in response to a remote
    learner''s emotions. This chapter will answer the following questions:


    # Q1. What are the benefits of the adopted scenarios of IoT in education?


    +   - Q1.1. Which education level(s) are addressed with the discussed educational
    scenarios?


    +   - Q1.2. Which education subject(s) are addressed with the discussed educational
    scenarios?


    +   - Q1.3. Which perspective(s) (e.g., instructor, student, staff) are addressed
    with the discussed educational scenarios?


    +   - Q1.4. Which learning principles are addressed with the discussed educational
    scenarios?


    +   - Q1.5. Which education settings (e.g., face to face, online) are addressed
    with the discussed educational scenarios?


    # Q2. What are the challenges of incorporating IoT in education?


    To answer the above questions, we used the systematic literature review (SLR)
    method (Keleet, 2007) to identify, extract, evaluate, and synthesize the articles
    on the symbiosis of IoT in education. The results show that we identified a significant
    variety of positive contributions for IoT technologies on education. In particular,
    we identified three dimensions to classify emerging scenarios of IoT in education:
    delivery mode, perception, and learning principles (Figure 7.1). While the focus
    of this chapter is answering the above questions, we also raise a set of research
    questions that we discuss in Section 7.5, and also provide a demonstration of
    a tool we developed to provide an adaptive learning experience in response to
    a remote learner''s emotions in Section 7.4.


    The presentation in this chapter will be mostly in the format of reporting on
    the results from the SLR we followed. Nevertheless, the description of the SLR
    process conducted is beyond scope of this chapter. If the reader is interested
    in learning more about the methodology we followed in the preparation of the content
    of'
