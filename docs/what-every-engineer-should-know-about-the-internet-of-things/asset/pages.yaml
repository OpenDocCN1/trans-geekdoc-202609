    # 10.14.2 PASSWORDS


    Default credentials have a problem plaguing the security community for some time.
    Despite the many guides that recommend users and administrators change passwords
    during system setup, IoT devices are not designed with this practice in mind.
    In fact, most IoT devices offer intuitive user interfaces with credentials can
    be changed. While some device passwords are documented either in user manuals
    or on manufacturer websites, some device passwords are never documented or unchangeable.
    Indeed, both scenarios can be leveraged by botnets. The Mirai bot and its variants
    successfully forced IoT device passwords to ultimately launch distributed-of-service
    attacks against various targets (Kolias et al., 2017).


    Many practitioners have proposed solutions to the problem of default credentials
    in IoT systems, ranging from the usual recommendation to change credentials –
    perhaps with more user awareness – to more advanced ideas like encouraging manufacturers
    to randomize passwords per device. While not explicitly mitigating the problem
    of default credentials, the Manufacturer Usage Description (MUD) specification
    (Lear, Drom & Mascanu, 2017) allows manufacturers to specify authorized network
    traffic, which can reduce the damage caused by default credentials. This specification
    employs a defense-in-depth strategy to address a variety of problems associated
    with the widespread use of sensor-enabled end devices such as IP cameras and smart
    thermostats. MUD reduces the threat surface of an IoT device by explicitly restricting
    communications to and from the IoT device to sources and destinations intended
    by the manufacturer. This prevents vulnerable or insecure devices from being exploited
    and allevi some of the fault of manufacturers leaving default credentials.


    # 10.14.3 SECURE UPGRADE PROCESS


    On a traditional computer, weaknesses are typically mitigated with patches and
    upgrades to various software components, including the operating system. On established
    systems, these updates are usually delivered via a secure process, where the computer
    can authenticate the source patch. While parallels exist for IoT devices, very
    few manufacturers have secure upgrade processes with which to deliver patches
    and updates; oftentimes, attackers can man-in-the-middle the traffic to push their
    malicious updates to devices, thereby compromising them. Similarly, IoT devices
    can receive feature and configuration updates, which can be hijacked by attackers
