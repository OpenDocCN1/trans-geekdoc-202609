    2. Physical (e.g., solitude, mostly etc.),

    3. Associational (e.g., medical context intimate experiences such as suffering
    and recovery from an illness),

    4. Proprietary (e.g., anything related to a person’s DNA), and

    5. Decisional privacy (e.g., taking medication in the home).


    Some of the recommendations to increase privacy include:


    +   - Permitting rights to set privacy settings,

    - Obtaining electronic consent, making sure the consent is understood by the inhabitant,

    - Anonymizing data, and

    - Securing medical data.


    Researchers have also attempted many ways to safeguard personal information privacy
    for SH services. Wang et al. created a taint propagation analysis model to analyze
    how software-defined networking uses sensitive information and investigates suspicious
    security vulnerabilities. Traditional taint analysis is a method to check which
    variables can be modified/contaminated by user/attacker input. The taint propagation
    model uses a weighted spanning tree analysis scheme to track data to. This method
    is focused on checking for exploits and suspicious behavior (Wang et al., 2016).
    Another solution for privacy management in the SH system is searchable'
