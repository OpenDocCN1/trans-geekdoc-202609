    # 7.4 MONITORING EMOTIONAL STATE OF ONLINE LEARNER: A TOOL


    There are no adequately proven strategies to address the presence of emotions
    in education. Incorporating IoT technologies combined with the power of Big Data
    analytics to support the detection of (or reacting to) the learner''s emotional
    state during online learning can positively improve the learners'' motivation
    and satisfaction with the course climate, which may decrease the drop-out rate
    in an on-line program. The captured data could also lead to insights that can
    be functional for the well-being of students and provide the “feedback”. For example,
    a simple webcam combined with an already-existing emotion detection artificial
    programming interface (API) can be utilized for an affordable and noninvasive
    emotional-based learning to detect the facial expressions of the remote learner.
    The webcam can also be used to capture the learners'' eye-tracking (detecting
    a learner’s gaze location). Companies that provide webcam eye-tracking services
    include GazeHawk and EyeTrackShop. Fitness monitoring devices, such as Fitbit,
    can also be used to capture the heartbeat of heartbeat in real time.


    With this background in mind, we developed a Learning Management System (LMS)
    that supports capturing and reacting to learner''s emotions. The LMS was developed
    using Python 3.7. The system client APIs are Query, markdown for UI, and Webs
    for communicating with a server. The system server APIs are as follows: Tornado
    framework for web service, OpenCV, Keras CNN model, and TensorFlow API for real-time
    face detection Towards Designing Smart Learning Environments with IoT and emotion/gender
    classification.


    The integrated system captures the user’s expressions based on the gender against
    the online content and time stamp. It detects seven emotional expressions: angry,
    disgust, fear, happy, surprise, and neutral. Once a learner logs into the website,
    the system triggers a pop-up message notifying and while navigating through the
    online materials (Figure 7.3), the system captures the facial expressions of a
    learner. The tool captures the user’s webcam frame data with websocket once every
    100 ms.


    The system evaluates the expressions every 10 seconds as per customized parameters
    which can be modified by a course administrator. The system detects whether the
    user’s expressions match with the customized parameters while navigating particular
    content (e.g., a percentage of emotional expressions (sad, happy, etc.) within
    any 10 seconds time frame). If there is a match, then the system prompts a'
