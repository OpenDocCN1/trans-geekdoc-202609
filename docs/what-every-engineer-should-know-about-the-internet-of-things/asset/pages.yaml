    On top of this, the primary IoT support layer''s role is to provide generic functions
    to diverse applications in a smart city scenario. These functions may include
    cloud and fog computing services, such as data processing, data storage, networking,
    and data analytics (Santos, Monteiro & Endo, 2020). Due to the differences in
    handling large volumes of data with velocity and veracity, the design decision
    by cloud or fog depends on the application''s latency requirement. Fog computing
    is more suitable for low latency applications applications (Shrivastava & Pandey,
    2020), such as the in-home patient health monitoring situation described in Section
    9.2. Besides generic support capabilities, the IoT support layer may also cater
    to specific requirements of varied applications.


    Finally, the application layer provides the user interface of smart cities vertical
    visualizations of analysis results. Examples of applications include, but are
    not limited to, smart government, smart environment, smart transportation, and
    smart services (e.g., Healthcare; Cui et al., 2018).


    IoT management capabilities include generic resources for IoT use cases, such
    as device management, local network topology management, traffic and congestion
    management, and resource reservation for critical data. Besides, IoT applications''
    specific requirements may also be supported. Observe that IoT applications'' generic
    and specific security demands are also considered, e.g., privacy protection over
    the application layer and authorization, authentication, data confidentiality,
    and integrity protection at the application, network, and device layers.


    The wearable and nonwearable devices at home, the traffic lights spread around
    the city, the ambulance''s GPS, and the patient''s body sensor network reside
    in the perception layer.


