- pgno: 194
  md: 'One part of the miners accepts the first block, the other part accepts the
    second block. However, as time passes, all the miners choose the longer branch
    of the blockchain, abandoning the shorter and invalidating the “orphan” blocks
    of that branch. Note that in case of double validation, the two competing blocks
    will contain almost the same transactions. It is probable that, in the competing
    branches, the two subsequent blocks are not again validated simultaneously. In
    this case, one of the branches becomes longer than a block, and the miners choose
    the chain containing it. Otherwise, the two branches will grow together, until
    one becomes longer than the other. The blockchain, however, also includes orphan
    blocks, which are however ignored in the validation of transactions.


    # 11.4 SMART CONTRACTS


    One of the fundamental properties of the blockchain is that it can be the basis
    for Smart Contracts. Smart Contracts are automated contracts, where participants
    prove their identity and agreement with their private key. Many of the major cryptocurrencies
    have been designed to carry out Smart Contracts, albeit with different levels
    of sophistication.


    Although the Smart concept is old, the name and definition were proposed by Nick
    Szabo, an American lawyer guard cryptography, in 1994. According to his definition:
    “A Smart Contract is a computerized protocol for executing transactions, which
    executes the terms of a contract. The general objectives of a Smart Contract are
    to satisfy the usual contractual conditions (such as the payment terms, rights,
    confidentiality, and even enforcement), to minimize both intentional and accidental
    exceptions, and to minimize the need for trusted intermediaries. Other economic
    objectives include the reduction of costs due to fraud, arbitration and enforcement
    costs, and other transaction costs”.


    A Smart Contract is basically a program, which runs on a secure medium. It takes
    digital signatures of participants, and other information, from secure sources
    as input. In output, it transfers cryptocurrency amounts, can activate contracts,
    record information, or connect to external systems. Smart Contracts also have
    a user interface that emulates the jargon and logic of contract clauses.


    Since the execution of a software program is deterministic and immutable, with
    the same input and program status, the code can be considered a contract. Once
    the contractual clauses are correctly inserted in the code of a Smart Contract,
    and this is accepted by the contractors, the effects are no longer linked to their
    will or to the action of intermediaries. Obviously, precise guarantees are needed:


    +   - The code must have no errors, must be executed correctly, and must not be
    modified;

    - The inputs to the code come from secure and identified sources;

    - The code must output the desired effects.


    In other words, there must be a mechanism that guarantees the trust that the contractors
    place in the Smart Contract. At this point, the blockchain comes into play: it
    provides all the previously mentioned guarantees, without the need for a central
    authority.'
  merge: -1
  img_proc: true
- pgno: 195
  md: '# Blockchain Technologies and IoT


    Since the first versions of the implementation of the Bitcoin blockchain, it was
    equipped with a real programming language, albeit at the assembler level. The
    Bitcoin transaction, which involves the transfer of cryptocurrency from one or
    more inputs to one more outputs, is in fact carried out by executing code written
    in this language, which takes care to verify the authenticity of the private keys
    in possession of carries the outputs. However, the language of Bitcoin is limited,
    does not include decision points or cycles, and is therefore Turing complete.


    The introduction of Ethereum in 2015 filled this gap, introducing a blockchain
    and a low-level language, with various high-level and actually usable languages
    (among them we mention Solidity and Serpent, to code and execute Smart Contracts
    (Marches et al., 2020)).


    The best-known real implementation of a Smart Contract was the DAO. It is an autonomous
    distributed venture project funding organization, launched in May 2015 with US150
    million raised in the crowdfunding campaign. In June 2016, it was attacked and
    emptied of a third of the funds, corresponding to approximately US50 million in
    other cryptocurrency. The cause of this problem was an error in the writing of
    the Smart Contract, which left a "door" capable of recursively emptying all the
    collected.


    The debate that followed centered on one the fact that the feature of the code
    that enabled the attack cycle did not respect the will of the programmers and
    was a matter, and on the other, the observation that, if the code is correct,
    freely examined and by the parties, this feature was also part of the contract,
    and the attack could not be considered a breach of contract. Since the very nature
    of Smart Contracts on blockchain does not provide for any authority with the power
    to intervene, it was the community of Ethereum developers and miners who decided
    by majority for the first hypothesis, to the fork. As already mentioned, there
    were those who did not accept the fork and continued with the old blockchain and
    the old rules, resulting in the generation of Ethereum Classic.


    Despite the DAO''s epic failure, the topic of Smart Contracts is more relevant
    than ever. There are many initiatives, on Ethereum, on extensions to the Bitcoin
    blockchain, on Ripple, or on ongoing implementations of new private blockchains,
    aimed at creating Smart Contracts systems. The most active sector is currently
    banking and finance (Dashkevich, Counsell & Estefanis, 2020), but also for other
    sectors, such as the Public Administration and the Internet of Things, we are
    actively working to find and experiment with Smart Contracts applications.


    Possible application sectors are electoral systems (Caseleggio et al., 2021),
    domain name registration, financial markets (Dashkevich, Counsell & Estefanis,
    2020), healthcare (Kassab et al., 2019), crowdfunding platforms (Fenu et al.,
    2018), intellectual property, supply chain (Marchesi, Mannaro & Porcu, 2021).


    # 11.5 IoT AND SMART CONTRACTS: A FOOD TRACEABILITY SYSTEM


    Food fraud has become a global issue for producers, consumers, governments, and
    other actors. Although this is not a new problem, unfortunately, it is rising
    in the last few years and threatening both public health and the economy. According'
  merge: -1
