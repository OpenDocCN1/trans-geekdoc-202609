  md: '# 48 What Every Engineer Should Know About IoT


    Those intermittent renewable sources of energy (the wind is blowing or the sun
    is shining) must be coordinated together to guarantee the net balance of energy
    consumed and energy generated in the overall system. In other words, the electricity
    grid must be managed correctly to transfer excess energy from points where there
    is surplus renewable generation, to points where is consumer demand and a limited
    or non-existent level of renewable generation due unfavorable environmental conditions.


    The solution to this challenge is the ability of any electrical installation to
    generate and transmit data in real time to the Electrical System Operator, to
    facilitate automation and its energy balance in a reliable way. Any electrical
    installation must be intelligent and capable of responding quickly to the needs
    of the grid, to weather conditions and to the control requirements of renewable
    generation. To do so, we need to introduce Internet of Things devices to digitalize
    any type of electrical installation and make them ready for the new network management
    model. This brings a new structural approach to generation and supply.


    In addition, new technology like blockchain can be developed and integrated with
    IoT devices, for seamless integration of data bits to track the movement of energy
    electrons. This will bring transparency to the origin of energy sources (for example
    when utilities are marketed to consumers by stating that electricity is coming
    from 100% renewable source).


    Another example where IoT is in the sustainability of electrification is the need
    to store the surplus energy that renewable sources have available at certain times
    of the day when the consumer''s demand is low. It does not make sense to waste
    these surpluses and use polluting fuels to cover demand peaks at times when there
    are no favorable weather conditions for renewable generation. Therefore, we need
    IoT connected devices to better use the energy storage system (ESS) and uninterruptible
    power supply (UPS) system to be part of this ecosystem to optimize and minimize
    the waste of energy as well as minimizing energy at peak load times. This interoperability
    of IoT devices is one of the main pillars of IEEE P2030 Smart Grid working group.


    One of essential devices is Smart Meter or Advanced Metering Infrastructure which
    allows for Machine to Machine (M2M) interaction over the internet. For real time
    reading of electricity demand and consumption which enables the decentralized
    system to respond to energy needs as well as promotion of energy efficiency giving
    the users visibility to use patterns. For IoT connectivity, the manual process
    of periodically reading power consumption from analogue meters would only serve
    billing purposes and does not enable such data insights and actions.


    This comes with its cybersecurity risk just like IoT application connected to
    the internet. These Smart Meters must be secured (Hansen (2017) to prevent intrusion
    of privacy or unauthorized access to data, as hacking into the readings can give
    an indication of what type of valuable electronics are at the house and make you
    vulnerable for malicious attacks when no one is home to plan for thieves breaking
    in. Cybersecurity must be looked from a system point of view to prevent cyber
    attacks from the weakest link.


    Another important point is data access and ownership while allowing seamless data
    integration into a variety of ecosystems. This is important to ensure that'
