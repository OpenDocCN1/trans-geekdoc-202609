- pgno: 163
  md: '# IoT Trust Concerns


    high levels of fidelity, e.g., a microsecond. Further, events are regionalized
    around particular airspace sectors and airports.


    There is nothing like IoT. Events and computations can occur anywhere, be transferred
    at “any time”, and occur at differing levels of speed and performance. The desired
    result is that all events and computations converge towards a single decision
    (output). The key concern is “any time”, because these transactions can take place
    geographically anywhere, at the microsecond level, and with clear understanding
    of what the clock in one geographic region means with respect to the clock in
    another geographic region.


    There is no universal time-stamping mechanism for practical use in many or most
    IoT applications. The Global Positioning System (GPS) can provide very precise,
    accurate up to 100 ns with most devices. Unfortunately, GPS devices have two formidable
    limitations in use IoT. First, GPS requires line-of-sight access to satellite
    signals. Many IoT devices are designed to work where a GPS receiver could not
    receive a signal, such as indoors or enclosed in walls or other obstructions.
    Additionally, if an IoT device is placed where satellite reception is available,
    GPS power demands are significant. Many IoT devices have drastically battery life
    or power access, requiring carefully planned communication. Adding the comparatively
    high-power demands of devices to such a system could cripple it, so in general
    GPS may not be practical for use in many networks of things.


    Consider a scenario where a sensor in location v is supposed to release data at
    time x. There is an aggregator in location z waiting to receive this sensor’s
    data concurrently with other sensors. Note that v and z are geographically apart
    and the local time x in location v does not agree, at a global level, with what
    time it is at z. If there existed a universal time-stamping mechanism, local clocks
    could be avoided altogether, and this problem would go away. With universal time-stamping,
    the time of every event and computation in a network of ‘things’ could be agreed
    upon by using a central time-stamping authority that would produce time stamps
    for all computations that request them. Because time is a vital component needed
    to trust distributed computations, such an authority would be beneficial. However,
    such an authority does not exist (Stravou & Voas, 2017). Research is warranted.


    # 10.10 LACK OF MEASUREMENT


    Standards are intended to offer levels of trust, comparisons of commonality, and
    predictions of certainty. Standards are needed for nearly everything, but without
    metrics and measures, standards become more difficult to write and determine compliance
    against. Metrics and measures are classified in many ways.


    Measurement allows for determination of one of two things: (1) what currently
    exists, and (2) what is predicted and expected in the future. The first is generally
    easier to measure. One example is counting. For example, one can count the number
    of coffee beans in a bag. Another approach is estimation. Estimation approximates
    what you have. By using the coffee example and having millions of beans to count,
    it might be easier weighing the beans and using that to estimate an approximate
    count.'
