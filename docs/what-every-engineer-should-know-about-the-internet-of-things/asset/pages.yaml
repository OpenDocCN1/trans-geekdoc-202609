  md: '# Networks of ‘Things’


    NoTs in a bounded way gives better traction to addressing trustworthiness problems
    that an unbounded Internet does not. Some may argue that ‘thing’ in a NoT is ultimately
    a service. The primitives definitely offer services; however, because of the combinatorics
    of mixtures of hardware and software ‘things’, we prefer to distinguish.


    Five primitives and six elements that impact IoT trustworthiness have been presented.
    The primitives are the building blocks; elements are the less tangible trust factors
    impacting NoTs. Primitives also offer analytics and formal arguments of IoT use
    scenarios. Without an actionable and universally accepted definition for IoT,
    the model and vocabulary presented here how IoT, in the broad sense, behaves.


    Use scenarios employing the primitives afford us quick recommendations and guidance
    concerning a NoT’s potential trustworthiness. For example, authentication can
    be used in addressing issues such as geolocation and sensor ownership, but authentication
    may not be relevant if an adversary owns the sensors and can detect information
    based on privacy. Encryption can protect sensor data transmission integrity and
    confidentiality including cloud-to-cloud communication, but it may render IoT
    sensors unusable due to excessive energy requirements. Fault-tolerant techniques
    can alleviate reliability concerns with inexpensive, replaceable, and third-party
    ‘things’, they can also be insecure and induce communication overhead and increased
    attack surfaces. In short, primitives and how they can be composed a design vocabulary
    for how to apply existing technologies that support IoT trustworthiness.


    These primitives are simply objects with attributes. The five, along with the
    context offered by the six elements, form a design catalog for those persons and
    organizations interested in exploring and implementing current and future IoT-based
    technology.


    # 2.8 ADDITIONAL TAKEWAY MESSAGES


    +   1. ‘Things’ may be all software, hardware, a combination of both, and human.

    2. A NoT may or not employ ‘things’ connected to the Internet.

    3. The number of ‘things’ in a NoT functions complexity and diminishes testability
    unless observability is boosted by test instrumentation (assertions).

    4. NoTs bound scalability and complexity and, therefore, enhance arguments for
    trustworthiness since assurance techniques generally offer better efficacy to
    less complex systems.

    5. Known threats from previous generics of complex software-centric systems apply
    to NoTs.

    6. Security flaws and threats in NoTs may be exacerbated by the composition of
    third-party ‘things’. This creates an emergent class of security ‘unknowns’.

    7. NoTs may have the ability to self-organize, self-modify, and self-repair when
    AI technologies are introduced, e.g., neural networks, genetic algorithms, and
    machine learning. If true, NoTs could potentially rewire their security policy
    mechanisms and implementations or or disengage them altogether.'
