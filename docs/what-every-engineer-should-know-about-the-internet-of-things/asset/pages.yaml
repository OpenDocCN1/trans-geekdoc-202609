  md: 'domain and addressing the accompanying challenges. SP 800-183 defines the underlying
    science for the IoT by describing the technology''s five primitives (sensor, aggregator,
    a communications channel, external entity, decision trigger; Voas, 2016).


    Our findings from the extracted scenarios were categorized using a classification
    scheme with three dimensions related to education mode, perception, and learning
    principle. We also argued that the potential of IoT to improve educational outcomes
    needs to be moderated with attention to the important challenges uncovered in
    this literature review. That is, security issues, scalability of solutions, and
    humanization of the delivery system. New scenarios for IoT in education applications
    to be proposed or need to address these challenges while delivering an optimal
    experience for students, teachers, and other stakeholders.


    Also, while this revealed that there is no lack of study on the potential usages
    of IoT on every education level, only three studies addressed the usages for children
    who are 5 years or younger (Miglino et al., 2014; Murphy et al., 2015; Lei et
    al., 2016). This low number suggests that more research needs to be conducted
    in regard to this particular, particularly concerning integration with the right
    mix of IoT technologies while respecting the constraints due the population''s
    characteristics. Besides, the relatively low numbers of studies addressing IoT
    for “knowledge organization” and “prior knowledge”, learning principles suggest
    that more scenarios need to be investigated for these principles.


