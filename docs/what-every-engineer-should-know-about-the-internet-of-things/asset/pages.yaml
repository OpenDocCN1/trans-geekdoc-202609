- pgno: 161
  md: '# IoT Trust Concerns


    Consider previous decades of building systems of systems (SoS). Engineering systems
    from smaller components is nothing new. This engineering principle is basic and
    taught in all engineering disciplines, and building networks of ''things'' should
    be no different. However, here is where IoT''s concerns of heterogeneity, scalability,
    and a lack of ownership and control converge differentiate SoS engineering from
    IoT composition.


    Consider military-critical and safety-critical systems. Such systems require components
    that have prescriptive requirements. The systems themselves will also have prescriptive
    architectures that require each component''s specification is considered before
    adoption. Having access to information concerning the functionality, results from
    prior testing and expected usage of components are always required before critical
    systems.


    IoT systems will likely not have these prescriptive capabilities. IoT''s ''things''
    may or may not have specifications, and the system built may not have a complete
    or formal specification. It may be more of an informal definition of what the
    system is to do without an architecture for how the system should be built. Depending
    on (1) the grade of a system (e.g., consumer, industrial, military), (2) the criticality
    (e.g., safety-critical, business-critical, life-critical, security-critical),
    and (3) the domain (e.g., healthcare, agricultural, transportation, entertainment,
    energy), the level of effort required to specify and build an IoT system can be
    approximated. However, no cookbook guidance yet exists.


    In summary, specific recommendations for addressing the inevitable issues of composability,
    interoperability, and integration are (1) the actual behaviors of the ''things'';
    (2) understand the environment, context, and timing that each ''thing'' will operate
    in, (3) understand the communication channels between the ''things'' (NIST, 2016),
    (4) apply systems of systems design and architecture principles when (5) apply
    the appropriate risk assessment and mitigation approaches during architecture
    and design based on the grade, criticality, and domain.


    # 10.8 ABUNDANCE OF "ILITIES”


    A trust concern for networks of ''things'' deals with the quality attributed ''ilities''
    (Voas, 2004). Functional requirements state what a system shall do, Negative requirements
    state what a system shall not do, and nonfunctional requirements, i.e., the "ilities"
    typically state level of quality the system shall exhibit both for the functional
    and negative requirements. "Ilities" apply to both ''things'' and the systems
    they are built into.


    It is unclear how many ''ilities'' there are – it depends on who you ask. This
    document mentions each of these ''ilities'' in various contexts and level of detail:
    availability, composability, computability, dependability, discurability, fault
    tolerance, flexibility, insurability, liability, maintainability, observability,
    privacy, performance, portability, predictability, probability of failure, readability,
    reliability, resilience, reachability, safety, scalability, security, sustainability,
    testability, traceability, usability, vulnerability. Most of these will apply
    to ''things'' and networks of ''things''. However, not all readers will consider
    these to be legitimate ''ilities''.'
