- pgno: 129
  md: '# IoT Education


    training that address the need to develop this skill set of next-generation engineers
    in designing and building IoT and CPS. For example, an effective approach is to
    create learning modules that address specific learning objectives. The modules
    would highlight CPS/IoT concepts using appropriate tools and hands-on exercises
    that could easily fit into existing courses as embedded systems, systems administration,
    computer security, software architecture, and software construction. Virginia
    Tech created CPS-focused learning modules for this purpose (Deshmukh, Patterson
    & Baumann, 2016). Another approach is to create elective courses where students
    implement practical CPS or IoT systems as a project mission similar to these desired.


    Accordingly, the path of least resistance to create new programs by modifying
    existing programs may already exist at the institution and only require slight
    modifications. This appears to be the most efficient way to create new CPS/IoT
    educational program that is relevant, timely, and available.

    The burden and challenge is on higher education to prepare the next generation
    of engineers with the skill necessary to build these complex systems. Universities
    are being tasked to provide working knowledge of a new engineering discipline
    that adapts the IoT and CPS differences in existing engineering disciplines. This
    is not an easy mission as it is challenging for educators to keep up with the
    rapid technology development as well as students (Zhu et al., 2014).


