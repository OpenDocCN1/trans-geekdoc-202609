  md: 'widely diverse application domains, the many applicable standards, and the
    cross-disciplinary nature of IoT education. Some of the gap research questions
    that we identified are as follows:


    # 5.5.1 WHAT ARE THE RIGHT DEVICES AND PROCESSING COMPONENTS FOR IOT PEDAGOGY?


    There are many IoT technologies including various sensors, processing elements,
    and cloud-based services, and it would be impossible to represent a comprehensive
    set in any academic laboratory or classroom Research is needed to understand a
    sufficient and cost-effective subset of technologies for the development and delivery
    of the IoT curricula and experimental laboratories.


    In our SLR, we assembled a list of IoT tools discussed provided implementation
    for IoT systems in educational settings from those studies. We provide the list
    link (https://bit.ly/2XD23ji). As we mentioned, 64% of the extracted studies proposed
    a system architecture for IoT in educational settings but only 21% of the overall
    papers provided actual implementation. As of the implemented systems were tested
    for usability or effectiveness with quantitative andor qualitative methodologies.
    We provide a summary of implemented systems through the link (https://bit.ly/2XD23ji)
    along with these systems were integrated into educational settings and tested.
    We also provide a summary of the testing results for these systems.


    # 5.5.2 HOW ARE INSTRUCTORS, STAFF, AND STUDENTS TO CONNECT AND USE THE IOT NETWORK
    FOR TEACHING AND LEARNING?


    When we investigated the subset of tools extracted from the prime studies and
    which are proposed to be used by students, instructors, or to interact with the
    IoT systems, smartphones/mobile devices were the most commonly mentioned (42%
    of the overall extracted; Figure 7,5), followed by sensors/RFID technologies (27%
    of the overall extracted scenarios). Selecting the right technology mix for IoT
    curriculum is important, but students and instructors will need to access technology
    from within and outside the classroom and laboratories. There are significant
    security, safety (e.g., in cyber-physical systems), and privacy issues surrounding
    IoT systems as we discussed in the previous section. There are also issues involving
    low power consumption (e.g., for battery-powered IoT devices), high power requirements
    for programs and courses with many students. Therefore, further research is needed
    towards defining a safe and efficient networking structure for IoT program delivery.


    # 5.5.3 WHAT CAN EDUCATIONAL INSTITUTES DO TO MITIGATE THESE COMPLEXITIES?


    IoT systems and the relative hardware and software are highly complex. Many applicable
    standards to IoT systems and their components and these need to be taught in the
    curriculum and educational systems will need to comply with these standards.'
