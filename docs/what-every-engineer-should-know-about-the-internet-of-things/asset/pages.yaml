- pgno: 159
  md: '# IoT Trust Concerns


    definitely create emergent behaviors that will enable new and unknown security
    vulnerabilities as well as impact other concerns such as reliability and performance.


    And finally, this is an appropriate place to mention potential vulnerabilities
    related to supply chain. For example, how do you know that a particular ''thing''
    is not counterfeit? Do you know where the ''thing'' originated from? Do you trust
    any documentation to the specification of a ''thing'' or warranties of the ''thing''
    was tested by the manufacturer? While supply chain is a concern that is too large
    to dwell on with any depth, a simple principle appears as: heterogeneity increases,
    it is likely that supply chain concerns will also increase.


    # 10.6 LOSS OF OWNERSHIP AND CONTROL


    Third-party black-box devices make trust more difficult for integrators and adopters
    to assess. This is particularly true for security and reliability in networks
    of ''things''. When a ''thing'' is a black box, the internals of the ''thing''
    are not visible. No internal computations can be specifically singled out and
    individually tested. Black-box ''things'' can contain Trojan behaviors. Black
    boxes have no transparency.


    Long-standing black-box software testing approaches are a prior example of how
    to view this dilemma. Black-box software reliability testing, the software under
    test is viewed strictly by (input, output) pairs, the best that can be done is
    to build tables of (input, output) pairs, and if the tables become large enough,
    they can offer hints about the functionality of the box and its internals. This
    process becomes an informal means to attempt to reverse engineer functionality.
    In contrast, when source code is available, white-box testing approaches can be
    applied. Whitebox software testing offers internal visibility to the lower-level
    computations (e.g., at the line-of-code level).


    This testing approach is particularly important for networks of ''things''. It
    is likely that most of the physical ''things'' that will be employed in a network
    of ''things'' will be third party, commercial, and, therefore, are commercial
    off-the-shelf (COTS). Therefore, visibility into the inner workings of a network
    of ''things'' may only be possible at the communication interface layer (Voas,
    Charron & Miller, 1996).


    Consider the following scenario: A hacked refrigerator interacts with an app on
    a person''s smartphone, installing a security exploit that can be propagated to
    other applications with the phone interacts. The users enter their automobile
    and the phone interacts with the vehicle''s interface software, which downloads
    the new software, including the defect. Unfortunately, the software defect causes
    an interaction problem (e.g., a deadlock) that leads to a failure in the controlled
    safety system during a crash, leading to injury. A scenario such as this is referred
    to as a "chain of custody".


    The above scenario demonstrates how losing control of the cascading events during
    operation can result. This sequence also illustrates the challenges of identifying
    and mitigating interdependency risks and assigning blame when something goes wrong
    (using techniques such as propagation analysis and traceability analysis). And
    liability claims are hard to win the "I agree to all terms" button is usually
    unavoidable (Voas & Laplante, 2017). (See Section 10.13).'
