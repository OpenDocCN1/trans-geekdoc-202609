  md: 'a quality model for smart cities and the consequences over the IoT-based systems
    that compose it is still lacking and can bring significant results in the forthcoming
    years. Particularly, the quadruple “protection, security, privacy, and safety”
    (IEEE, 2019a; Spinelli; availability (DelLochelle et al., 2020); responsiveness
    (Motta, de Oliveira & Travassos, 2019); and other attributes can be further explored
    to assure the quality of the services provided by smart cities users’


    Regarding privacy, in particular, a smart city processes personal, enter-, and
    governmental data 24/7 an unauthorized person should not be able to access. Despite
    cryptography, anonymization, and access control, four factors are determinants
    for a comprehensive privacy solution: time and space (Arruda & Bulcão-Neto 2019;
    Perera et al., 2020). Access to the elderly’s data is immediately granted to an
    emergency service when a call occurs and remains until his/her admission at the
    hospital. From this moment, the patient’s location is notified of emergency contacts,
    whereas her/her health conditions are available only by health professionals in
    charge during the hospitalization period. The closer an IoT device is to the end
    user (e.g., a smartphone), the more challenging it is to protect the privacy of
    consumers before their sensitive data “leaves” (Hom et al., 2018).


    Standard Reference Architecture for IoT called “P2413”, motivated by concerns
    shared by stakeholders across multiple IoT domains (IEEE, 2019a). These concerns
    relate to directing, domain-specific, and other redundant standardization efforts.
    The P2413 incorporates a collection of architecture viewpoints elaborated to form
    the framework description body: a reference model, a reference architecture, and
    a blueprint for data abstraction.


    An active project of the same IEEE working group leveraged the IEEE P2413 is the
    standardization of a Reference Architecture for Smart Cities (RASC; IEEE, 2019b).
    RASC’s goals include defining different vertical applications in the smart city
    (e.g., water and waste management, environment monitoring, smart buildings, and
    eHealth), communications between these vertical applications, and an intelligent
    and integrated operations center in a smart city use case. Besides, RASC also
    provides a four-tiered architecture for smart cities (device, communication network,
    IoT platform, and application) and defines the relationships with attributes specific
    to cloud computing technologies and Big Data analytics. By this writing, RASC
    is still an IEEE draft standard, under regular revisions.


    Software-Engineering Smart Cities: It is common sense that a considerable investment
    in networking infrastructure is needed to make a smart city reality. Nevertheless,
    networking is not enough (Weyl & Ebert, 2016). Software is mass pervasive in smart
    cities, covering data acquisition, communication, representation, storage, reasoning,
    retrieval, and visualization, among others. Furthermore, the multidisciplinary
    nature of IoT and the nature of stakeholders in a smart city challenge current
    software engineering practices (Santana et al., 2018; Motta, de Oliveira & Travassos,
    2019).


    In a smart city use case, requirements should be elicited from citizens and system
    stakeholders using a more comprehensive approach with business, usage, functional,
    and implementation viewpoints (Fraile et al., 2019). A viewpoint conforms'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# Smart Cities


    to a value-driven model with quantitative performance indicators, such as business
    value, expected return of investments, and maintenance costs. The usage perspective
    identifies parties, actors, roles, tasks, and workflows involved in different
    smart city cases. The functional viewpoint output is the decomposition of each
    constituent system into functional parts, describing its structure and interrelations,
    interfaces, and interactions between its internal components and other constituent
    systems. This viewpoint should also include data model definitions, security requirements,
    and the alignment of functional components and implementation components. Finally,
    the implementation viewpoint should provide details on how an asset will be deployed
    to the computing infrastructure. If these multiple points of view will be well
    coordinated in a smart city development project. However, in a large-scale and
    complex system-of-systems scenario, there is still a road to paving representing,
    describing, and integrating systems in the light of software requirements (Motta,
    de Oliveira & Travassos, 2019). As pointed out by Spinellis (2017), the design
    and construction of integrated IoT systems, as smart cities, require complex adaption
    layers to the requirements'' dynamic nature as these systems operate. The scale
    of a smart city also poses challenges to software verification and validation
    techniques, including simulation (Larrucea et al., 2017; Graciano Neto et al.,
    2018). Finally, as IoT technologies and real-world smart cities'' experiences
    accumulate, more research on software engineering will be needed, including general
    models and methodologies and associated tool support (Morin, Hann & Fleury, 2017;
    Santana and Zamboni, 2017; Motta, de Oliveira & Travassos, 2019).


    # 3.6 CONCLUSION


    In this chapter, we discussed the intersection between IoT and smart cities. We
    introduced the general structure of a smart city and recalled how an IoT application
    is composed to show how these emerging topics are intimately related. We used
    a motivational example of a smart home environment with things to detect falls
    that elderly could be automatically assisted with an emergency service. From that
    example, we showed that the IoT sensing is the frontier that connects the smart
    city system to the public (or domestic) environment, draw our conclusion, and
    showed, at the end, the open research avenues that are still available to be explored.


    Smart cities and IoT are closely related. The latter is actually considered the
    backbone of the former, which makes them share several characteristics and challenges.
    As long as IoT technologies and its associated challenges, such as a full interoperability,
    are solved, smart cities will instantaneously be benefited from those advances
    and be refined to offer more elaborated services to the society.


