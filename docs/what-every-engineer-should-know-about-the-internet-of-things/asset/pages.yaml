    send a signal directly to a smart light bulb to turn it off or.


    +   10. Security is a concern for aggregators (malware or general defects) and
    for the sensitivity of their aggregated data. Further, aggregators could be attacked,
    e.g., by denying them ability to operate/execute or by feeding them bogus data.


    +   11. Reliability is a concern for aggregators (general defects).


    # 2.3.2.1 Actor #1: Cluster (or “Sensor Cluster”)


    A cluster is an abstract grouping of sensors that can appear and disappear instantaneously.
    Basic properties, assumptions, recommendations, and general statements about cluster
    include the following:


    +   1. Clusters are abstractions of a set of sensors along with the data they
    output — clusters may be created in an ad hoc manner or organized according to
    fixed rules.


    +   2. Clusters are not inherently physical.'
