    temperature sensor connected to an IoT platform. The temperature is recorded every
    10 minutes, and the value is sent and stored in a blockchain. The values recorded
    in the blockchain will be accessible by all the stakeholders involved in the process.
    For example, for phase 3 (milk arrived at the factory), the responsible person
    of the factory could be able to verify if the milk was stored following the procedure
    in the farm and during the transport phase (from the farm to the factory). This
    point is crucial, not only the final customer can verify the quality of all the
    ingredients in the supply-chain but also all the stakeholders involved.


    A process with an IoT supported solution can be the following proposed in Figure
    11.3:

    A sensor of temperature will be able to record (or the IoT devices to store the
    data in a blockchain, Figure 11.4) the temperature of the milk from stage 3, and
    then the temperature of the cheese will be monitored after stage 4. The final
    customer will be able to verify if the level of temperature of both the ingredients
    and the final product was kept in the correct quality range.'
