    ULD is a critical feature of a SH system. To address user privacy, device/tag
    inconvenience, and fault tolerance/accuracy, the ULD system employs the prevalence
    of sensors in the home as well as a context broker (e.., receives information
    from sensors) and a fuzzy-based decision-maker (e.g., evaluates the data from
    the broker: Ahvar et al., 2016b). In a literature survey of ULD methods discovered,
    there is not yet a definitive ULD approach (e.g., outside uses GPS; Ahvar et al.,
    2016a). Accuracy and cost requirements need improvement. The recommendation that
