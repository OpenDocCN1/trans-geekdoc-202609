  md: '# 8.5 CPS/IoT COURSES AND THE IoT PRIMITIVES


    Next, course descriptions and course structures were reviewed to determine the
    IoT primitive focus. Again, these courses were taught at the top 50 universities.
    We analyzed the course syllabi, descriptions, and available materials for each
    of the 45 courses. The resulting course data was mapped to the NoT primitives.
    For example, in an "embedded systems" course, the description stated:


    Lectures will cover theoretical concepts of embedded and cyberphysical systems
    including discrete and continuous dynamics, hybrid systems, state machines, concurrent
    computation, embedded systems architecture and scheduling. Lab involves programming
    embedded applications using C# and the Microsoft Robotics Software Development
    Kit (SDK) together with the hardware image processing and tracking capabilities
    of the Kinet sensor.


    This description was mapped accordingly to the "sensor", "communication", and
    "decision trigger" IoT primitives. The complete mapping matrix for the 45 courses
    is available via the link: goo.gl/8VmGTV. The results showed that only 11% of
    the 45 courses cover to all 5 primitives (see Figure 8.1).


    The courses, Interconnected Embedded Systems, Networked CPSs, IoT Intelligent
    and Connected Systems, and Body Sensor Networks in the IoT appear to be introductory
    to IoT and CPS technical and design understanding.


    When the combined list of courses from top 50 universities and the 11 courses
    from the retrieved studies were analyzed, we determined that the primitive focus
    that was most prevalent was "Utility" with almost 25% of the courses covering
    that primitive in its content. In general, the courses described various scenarios
    to teach each NoT primitive. Particularly, courses that covered the NoT primitives
    involved projects that focus on the design and implementation of devices for


