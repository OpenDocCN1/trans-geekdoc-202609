- pgno: 192
  md: '# 176 What Every Engineer Should Know About IoT


    Smart Contract: transactions can be activated by several parties involved (with
    their respective private keys), and they can carry out even complex preprogrammed
    calculations.


    “Notarial” Storage: it is possible to use special transactions to store information
    on the blockchain. This information is used to certify the existence and integrity
    of a document, or set of documents, at a certain date.


    # 11.3.3 THE BITCOIN TRANSACTION


    The purpose of a transaction is to record the transfer of Bitcoin from one or
    more addresses to one or more addresses in the blockchain.


    Each transaction is uniquely identified by a hash, called its “id”. A transaction
    has one or more inputs, and one or more outputs, although there are exceptions
    to this rule.


    The inputs are the outputs of previous transactions not spent yet (UTXO, Unspent
    Transaction Output). Each input contains an address, the hash (id) of the transaction
    that transferred the Bitcoin to the address, and the amount transferred in that
    transaction (Satoshi). All this information is verifiable because it is already
    present in the blockchain.


    In output, there are one or more addresses, with the one (in Satoshi) to be transferred
    for each address.


    Typically, the sum of all Satoshi in input to the transaction is greater than
    the sum of in output. The difference between input and output goes to the miner
    who validates the block as a “commission” (fee), which is therefore added to the
    fixed fee in Bitcoin for validation. If the commission for the miners is zero,
    or too low, the transaction, while valid, may not be accepted or its validation
    may be delayed.


    Transactions, once written on the blockchain, are irrevocable: the Bitcoin protocol
    does not provide any possibility for canceling a verified and recorded transaction.
    For a transaction to be valid, the following are necessary:


    +   - All inputs must be “signed” by the private keys associated with the addresses.

    - None of the inputs must have appeared as inputs in another transaction (“double
    spending” is not possible).

    - The addresses of the output must be valid.

    - The sum of the input amounts must be greater than or equal to that of the output
    amounts.


    The inputs of a transaction are UTXO of a previous transaction. These inputs must
    all be spent within the transaction.


    For transferring only part of the input to the output, it is necessary to add
    an output that transfers the “remaining amount” to an address controlled by whoever
    carries out the transaction itself. This address can be the one (or one of those)
    used for the input, but usually, a new address is generated for security and privacy
    reasons.'
