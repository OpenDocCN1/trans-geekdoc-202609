    FIGURE 5.1 Smart city architecture.


    To appreciate the severity, recall the 2018 situation in Hawaii where the emergency
    management agency mistakenly sent out this message,


    > BALLISTIC MISSILE THREAT INBOUND TO HAWAII. SEEK IMMEDIATE SHELTER. THIS IS
    NOT A DRILL.


    This false alarm was apparently not caused by hackers (according to the news),
    nonetheless critical phone systems had many attacks – where the attackers are
    looking for ransom payments in addition to determining where the weak points are
    in a critical network (Starks, 2018).


    Researchers have faced security and privacy challenges for intelligent healthcare-transport,
    smart building and smart energy (Braun et al., 2018). However, there have been
    no studies on systematically addressing security level with a multilayer structure
    to include device/sensor level, network level, application level, and cloud level
    from viewpoint of security and privacy. In the remainder of this chapter, we will
    look at the attack points and countermeasures that exist on multiple layers of
    a smart city.


    # 5.3 ATTACK POINT EXAMPLES IN A SMART CITY


    In this section, we will discuss each of the attack point levels (i.e., device/sensor,
    application, network, cloud/data) with four smart city elements: smart transportation,
    smart healthcare, smart energy, and smart buildings.'
