- pgno: 49
  md: '# 3 Smart Cities¹


    # 3.1 INTRODUCTION


    The United Nations estimates that almost 70% of the world population will live
    in urban areas by 2050 (United Nations, 2018). Consequently, the urban environments,
    which are already crowded and chaotic, should be further improved and prepared
    to accommodate higher number of citizens sustainably and feasibly.


    Cities will then be required to be smarter, i.e., to be transformed and connected
    via their physical, social, and business infrastructures using Information and
    Communication Technology (ICT) to leverage the collective services to the society
    (Harrison et al., 2010; Mohanty, Choppali & Kouianos, 2016). Smarter means that
    the services should ideally rely on technology infrastructure, particularly software.
    That infrastructure is composed of a diversity of individual systems and physical
    objects (e.g., sensors, actuators, and tags). For instance, in a smart traffic
    system, sensors can detect the presence of a person in a crossing. The traffic
    lights turn to red and the autonomous cars stop movement through break systems
    (actuators). People cross the street interacting to tags to notify the traffic
    should still be interrupted. As no presence is detected, the traffic lights turn
    green and the car''s actuators restart their movement. Those systems and objects
    interoperate to provide solutions for the population, as as


    +   i. offering transportation options that could be more economical or optimized
    about time and lower risks, as it has been implemented in Singapore (Asiat, 2020);

    ii. operating systems to provide a collective sense of safety, avoiding collisions
    between cars, between these and public buildings or between cars and pedestrians,
    as in the application proposed by Taylor, Siebold & Nowzari (2020);

    iii. exchanging and sharing data/information or energy to prevent electricity,
    water, or other natural resources, such as sensors measuring the energy wasting
    in a neighborhood and alerting users they should save power; or

    iv. offering solutions for the population using artificial intelligence (AI) algorithms
    that could deliver more optimized results than using hoc strategies, such as smart
    solutions to find faster or more economical routes to achieve a destination.


    Hence, turning smart cities into reality inherently leads the intensive use of
    technology in all the public sectors.


    > ¹ This chapter was contributed by Valdemar Vicente Graciano Neto and Renato
    F. Bulcão-Neto.


    DOI: 10.1201/9781003027799-3'
