  img_proc: true
- pgno: 181
  md: '# IoT Trust Concerns


    These problems are compounded due to the economies behind IoT; the barrier to
    constructing an IoT device is low, meaning that the market contains many different
    devices and models from many different manufacturers, with very few authoritative
    bodies attending the security of any of these devices. While these problems extend
    into the traditional computing market i.e., laptops and personal computers – the
    market mechanics have driven most products towards consolidated products and features,
    making it easier for consumers to evaluate and understand the security offered
    by the devices and manufacturers.


    Nonetheless, there is no central entity regulating the security of IoT devices,
    recent progress has been seen as regulatory participants consider how they want
    to address this complex problem. As an example, the Internet of Things Cybersecurity
    Improvement Act (Weaver, 2017) was introduced in 2017 with the goal of setting
    standards for IoT devices specifically installed in government networks. The bill
    contains several important stipulations, requiring devices to abandon fixed default
    passwords and devices that must not have any known vulnerabilities. The act also
    relaxes other acts that could be used to prosecute researchers looking to test
    the safety of these devices.


    The mandates of several agencies border with the IoT security space. A good example
    of this is the Federal Trade Commission (FTC). In January 2018, the VTech agreed
    to settle charges by the FTC that they violated not a security law, but US children''s
    privacy law, collecting private information from children, without obtaining consent,
    and failing to take reasonable steps to secure the data (Federal Trade Commission,
    2018). The key phrase is VTech''s products were the connected-toys – i.e., IoT
    devices – which collected personal information, and due to security risks in how
    these devices handled and managed data, the company was fined. This case shows
    that if IoT devices do not have reason security, a manufacturer may be held liable.


    The US Consumer Product Safety Commission has called for more collaboration between
    lawyers and experts in the area (American Bar Association, 2017). Outside of the
    United States, the European Union for Network and Information Security (ENISA)
    has published security guidelines for IoT (ENISA, 2017). As more calls for security
    and recommendations occur, standardization and regulation may flow, increasing
    the security and safety of deployed IoT systems.


    Regulations offer a serious means with which can help increase the security and
    safety of IoT systems, as evidenced by their successes in other industries such
    as vehicle manufacturing. While some improvements have been noticed as some agencies
    and organizations attempt to influence in IoT regulation, it has not been seen
    where one central organization mandates rules regarding the use and development
    of IoT systems. Such an organization could have significant impact on the security
    and safety of IoT systems and consumers'' lives.


    # 10.22.3 TRUSTWORTHINESS ELEMENTS IN NIST SP 800-183


    Six trustworthiness elements are listed in Section 10.3 of NIST SP 800-183. The
    verbatim text for six is given here, and note that NoT stands for network of ''things'':'
