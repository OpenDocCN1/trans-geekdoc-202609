    # 5.4.2 MEDICAL RANSOMWARE


    Management of individual medical services, remote medical examinations, and the
    use of smart medical devices are becoming more prevalent in smart cities. Thus,
    smart medical devices, applications, medical information, Big Data systems, and
    medical management are major cyber targets. If a medical device is directly connected
    to an individual, such as a respirator or closed-loop insulin pump system is hacked,
    the patient’s life is at risk. Personal information is also at risk. In 2018,
    a medical group’s database was infected with malware, and about 16,000 prescriptions
    were leaked, including the local Prime Minister (Davie, 2018). By exploiting these
    attacks, ransomware is often used to exploit money from patients or their caregivers.


    Attacks such as supply chain compromise, pre-OS boot, and firmware corruption
    are also likely to be carried out at the medical equipment, device, or sensor
    level. In order to gain access to the hospital’s application that manages medical
    equipment or to the patient’s information, hackers can attack to steal credentials
    and perform data destruction and data encryption. Devices, medical institutions,
    and patients that make up smart equipment are networked to each other, which can
    lead to frequent network-level attacks such as MITM attacks, network DoS attacks,
    and service stop attacks. If this happens, it could pose a major threat to patients
    and medical institutions.


    # 5.4.3 ENERGY SYSTEM HACKING


    Cyberattacks at energy collection sensors and management systems are also a tremendous
    risk to smart cities. In the Ukraine, power grids were hacked in 2015, causing
    30 substations to cease operation and the electricity supply to suspend its operation.
    In April 2016, a power plant facility in Michigan, USA, was infected with ransomware
    (Conlifde, 2016). This attack was aimed at a programmable automatic control unit
    (PLC), which is a significant part of the operation of a factory as it can'
