    # 7.2.3 LEARNING PRINCIPLES


    In Ambrose et al. (2010), the authors listed seven principles that underlie the
    foundations for effective learning. These principles are prior knowledge, knowledge
    organization, motivation, practice and feedback, course climate, and self-directed
    learning. These principles are distilled from research from a variety of disciplines
    (CMU, 2017). Figure 7.2 shows the distribution of the extracted scenarios we collected
    from our search in literature among the seven principles.


    Our findings indicate that IoT technologies will make a positive impact on each
    of these principles. While there is a slight bias in the extracted scenarios towards
    utilizing IoT to improve the "course climate" in particular, every learning principle
    can be enhanced with IoT. For example, in Sula et al. (2014) the authors propose
    a smart assistive environment that uses a Heuristic Diagnostic Teaching (HDT)
    process where the intention is to identify each student''s learning abilities
    in math as well as their creativity traits. Their proposed system uses a computer,
    sensors, RFID tag reader, and a SmartBox device in order support learning for
    students with Autism (2013); by providing a personalized "practice and feedback"
    on a case-by-case basis. Other studies discussing utilizing IoT to provide personalized
    learning experience include Sula et al. (2013, 2014); Möller, Haas & Vakilzadian
    (2013); Meda, Kumar & Parupalli (2014); Jeong, Kim & Chong (2015); Murphy et al.
    (2012); Lenz et al. (2016); Chen et al. (2011); Wang (2010); Ma & Li (2013); Gómez,
    Huete & Hernandez (2016).


    In Wan (2016), improving student’s "motivation" principle is addressed through
    a proposed scenario aiming at bridging the communication between teachers and
    students using IoT. In Elyamany and AlKhairi (2015), the authors proposed an innovative
    system based on IoT to analyze the impact of several parameters of the physical


