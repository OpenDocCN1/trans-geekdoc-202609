- pgno: 11
  md: '# Preface


    In 2022, worldwide Internet of Things (IoT) spending will exceed $1 trillion.
    By 2025, there will be 75 billion connected smart devices. IoT products and cyber-physical
    systems (CPS) are being utilized in almost every discipline. In addition, smart
    products are becoming more advanced to improve our health and comfort. There are
    IoT applications for healthcare that not only provide information to assist decision-making
    that is based on real-time data, but also can improve a patient''s treatment regime
    for diseases that require around the clock. There are products that sense, learn,
    and adapt to user preferences that are gaining popularity. IoT is also making
    our cities, government, and homes more efficiently.


    IoT devices have a ubiquitous nature; they are being integrated into every domain.
    With this increase, it is of utmost importance to communicate how this technology,
    with its distinguished system functions such as sensing and decision-making, can
    support and challenge all interrelated actors as well as all involved assets of
    many domains.


    There are three goals of this book. The first goal is to provide an introduction
    to the IoT that can be understood and appreciated by every engineering discipline.
    We include chapters that highlight the top applications of IoT (Smart Homes, Smart
    Healthcare, Smart Cities, and Smart Education) to engineers who have an interest
    in design, with chapters on IoT requirements and architecture, IoT and blockchain,
    and the National Institute of Standards and Technology (NIST) definitions of Networks
    of ''Things'' and their white paper on IoT Trust Concerns. The second goal is
    to provide insight into engineering educators on educating the next generation
    of engineers who are needed to build IoT systems. We hope the book will give you
    a new appreciation for IoT and its many applications, as it will probably be integrated
    into almost every part of our lives sometime soon.'
  merge: -1
  img_proc: true
