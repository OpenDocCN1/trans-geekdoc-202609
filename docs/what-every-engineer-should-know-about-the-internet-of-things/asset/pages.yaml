    Utility Reliability: A point-of-sale system syncing automatic smart payments depends
    on a cloud server for verifying the identity of the person using a card. System
    maintenance of the cloud server happens to occur during business hours, which
    causes delays in verification. This is an example of system failures that make
    the resource unavailable and, therefore, unreachable.


    Utility Security: A ''smart home'' has a security camera installed at the door
    and sends data to a corresponding cloud application that then forwards notifications
    and video footage to the homeowner''s device after the door is detected. An attacker
    conducts a DDoS attack on the application''s servers for 2 hours. They''re able
    to break into the house without the user being notified. This is an example of
    a DDoS attack.


    Decision Trigger Reliability: The logic implemented, e.g., a decision trigger
    is a conditional expression, e.g., if a > 100 open garage door. But what if the
    expression should have been if a > 10 open garage door. This is a reliability
    problem because the function implemented is incorrect for all values of between
    11 and 99. Decision triggers are likely to be written in code, although this assumption
    could be relaxed.


    Decision Trigger Security: The decision trigger implementation accepts malicious
    inputs or the outputs from the trigger are sniffed and relayed to competitors
    unbeknownst to the legitimate owner of the trigger. Either way, this is an example
    of data tampering and loss of data integrity.


    Note that there are relatively few standards or best practices for IoT security
    design and testing, although some related guidance is being developed by the Cyber-Physical
    Systems Public Working Group (NIST, 2014a) and in documents such as the NIST''s
    Guidelines for Smart Grid Cybersecurity (NIST, 2014b).


