- pgno: 17
  md: '# Internet of Things Defined¹


    # 1.1 INTRODUCTION


    If you ask the average person to explain “Internet of Things” (IoT²), they probably
    will respond that they have never heard of IoT or have no idea how to explain
    it. If they make a guess, they will tell that IoT are ‘things’ that are ‘smart’.
    Most likely they do not understand what the device senses. In fact, the term ‘smart’
    seems to also become a marketing term on products that don’t warrant description.
    Consider outdoor lights that can be operated from your phone. These lights are
    not smart unless they also sense something as motion and then send a notification
    to your phone. In other words, ‘smart’ should refer to a device that meets certain
    criteria such as embedded sensors and analytical software. Specifically, along
    with the sensing, the device can also collect and analyze data, is connected to
    a wired or wireless network, and then performs some type of action based on data
    analysis, it can be called an IoT device or a ‘smart’ device. There are many inconsistent
    and inaccurate definitions of IoT; thus, one goal of this book is to provide clarity
    and accuracy in understanding IoT and its applications. In addition, as engineers,
    we need to understand everything about IoT – especially the benefits, risks, and
    to continually improve the security, safety, privacy, scalability, performance,
    interoperability, and usability of IoT systems.


    # 1.2 IoT DEFINED


    Wikipedia defines IoT as “the network of physical objects – a.k.a. ‘things’ that
    are embedded with sensors, software, and other technologies for the purpose of
    connecting and exchanging data with other devices and over the Internet”. The
    IoT concept emerged from the RFID (radio-frequency identification) community and
    initially focused on the ability to track location and provide a status for a
    physical object (Greer et al., 2019). This greatly improved the visibility in
    supply chains.


    The “Internet of Things” has been around since 1999. Kevin Ashton, founder of
    MIT’s Auto-ID Labs, coined the term IoT to refer to a combination of real and
    virtual information that that are connected through identification technologies
    (e.g., RFID), location systems (global positioning system (GPS)), sensors (e.g.,
    temperature sensor), and actuators (e.g., electric motor). There are many types
    of sensors, as RFID tags, GPS, and accelerometers. ‘Things’ could


    > ¹ Portions of this chapter were contributed by Dr. Philip Laplante.


    > ² We refer to “Internet of Things”, “IoT”, or the Internet of Things throughout
    this book. These forms are all equivalent in meaning.'
