  md: 'Some symptoms of AWS can be as severe as hallucinations and seizures. At its
    most extreme, AWS can be life-threatening. Detecting the degree of severity of
    these symptoms is essential to adjust the treatment. Matching the right therapy
    to the individual is important to its success. No single treatment will benefit
    everyone in the alcoholism case.


    Many of the above symptoms could potentially be monitored by a specialized IoT
    or Internet-enabled analytics. For example, a patient with AWS needs to be carefully
    monitored trembling and irregular movement. Sensors can be strategically placed
    in the patient''s home and used to pick up on accelerated and irregular walking
    or movement activity as compared to walking or moving at a normal pace.


    In addition, a patient can be monitored for vomiting by omitting instances of
    bathroom use with an IoT. A sensor that can detect the odor of vomit could provide
    additional clues in the diagnosis and management of the AWS patient in home care
    settings.


    An IoT system can render a decision on the existence of AWS symptoms and the degree
    of such symptoms. If a patient has mild-to-moderate withdrawal symptoms, a healthcare
    provider may prefer to continue the treatment in an outpatient setting while prescribing
    some medications to reduce the severity of the symptoms, especially if a patient
    has a supportive family and friends. If the symptoms are extremely severe, the
    system may alert the case as a medical emergency that requires an acute setting.
