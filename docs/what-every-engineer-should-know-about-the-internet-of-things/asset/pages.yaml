    communications are normal. Hackers attack autonomous driving shuttles by taking
    control of vehicle in an attempt to cause unexpected traffic chaos. Attackers
    gain control of the vehicles by creating and modifying communication messages.
    For example, using security vulnerabilities, US security company IOActive successfully
    hacked a major urban traffic control system (Cerrudo, 2015). This demonstrated
    that traffic hacker can cause.


    Examples at the device or sensor level are supply chain compromise, pre-OS boot,
    and firmware corruptions. In applications that control the transport systems,
    attacks using credential access can occur as well as attacks focusing on data'
