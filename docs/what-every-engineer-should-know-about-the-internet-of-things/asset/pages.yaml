  md: '# IoT in Education


    # IoT Tools


    ![](img/41fdf2aa71adfa568d36836737f447e6_113_0.png)


    **FIGURE 7.5** Tools used to interact with Internet of Things (IoT) systems in
    educational settings.


    International standardization bodies; industrial organizations publish hundreds
    of standards that can apply to IoT systems, both domain-specific and cross-domain.
    For example, the IEEE (and its association and industrial partners) supports nearly
    100 standards applicable to IoT (https://standards.ieee.org/initiatives/iot/).
    Therefore, any IoT-based curricula must address the identification of appropriate
    standards, harmonization of differences, and standards blending.


    # 7.6 CONCLUSION


    The advances in sensors, nano-electronics, smart objects, cloud computing, Big
    Data, and communication on a wide scale will make innovation continuous in IoT,
    and it will clout a great number of domains. The education domain is not an exception.
    While IoT education is a new conceptual paradigm and is still in its starting
    phase, IoT is set to transform the education domain in many ways shortly.


    This systematic review presented in this chapter is a starting point for an in-depth
    understanding of the impact of IoT devices and applications in the education domain.
    This review demonstrated that the curiosity of utilizing IoT applications has
    well-reached education discipline and that it has been accompanied by increasing
    research publications.


    As the realm of IoT protocols and standards expands, adding these standards to
    the education system could also increase the complexity for all its members. While
    mitigating this complexity is open for research, the US National Institute of
    Standards and Technologies (NIST) Special Publication SP 800-183, "Networks of
    Things," which was presented earlier earlier in this book, should form the building
    blocks of IoTs and a framework for researching and developing IoT scenarios for
    education'
