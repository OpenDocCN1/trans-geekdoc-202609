  md: '# IoT in Healthcare


    # 9.3 IoT FOR TRACKING HUMANS


    Tracking humans involves humans’ data (e.g., patients, caregivers, family members)
    using IoT devices. Perhaps the most mature field for IoT in healthcare is patient
    data gathering. Currently, telemetry monitors can accurately measure and send
    upload electrocardiogram (EKG) stats, core temperature, blood pressure, urine
    output, etc.


    By monitoring these vital signs, healthcare professionals can detect and start
    care for earlier infectious disease, cancer, heart failure, etc. Another example
    in this class involves tracking the physical location of patients in any setting
    (acute, long term, home). From wandering patients admitted to emergency room (ER)
    to tracking patients dementia, the IoT could locate patients with Alzheimer’s
    disease or self-destructive behaviors such as bulimia, cutting, or suicidal tendencies.
    Such tracking can already be accomplished with commercial GPS bracelets, but local
    proximity sensors connected through the Internet or cloud-based technologies could
    allow tracking inside the facility or home or outside, where GPS signals may not
    reach.


    To demonstrate tracking humans, we will present in the next subsection study on
    tracking patients with alcohol withdrawal syndrome (AWS) symptoms.


    # 9.3.1 ALCOHOLISM USE CASE


    Alcoholism is a long-term chronic disease in which a person has developed an unhealthy
    dependence on alcohol. In the United States, there are close to 14 million people
    who are alcohol abusers or alcoholics (National Institute of Alcohol Abuse and
    Alcoholism, 2016). Fortunately, no matter how severe the problem may seem, Research
    shows that about one-third of people who are treated for alcohol problems people
    with alcohol disorder can benefit from some form of treatment have no further
    symptoms 1 year later. Many others substantially reduce their drinking and report
    fewer alcohol-related problems.


    In the early stages of the treatment phase, a patient may suffer from AWS, which
    refers to the set of symptoms that occur when a heavy drinker suddenly stops or
    significantly reduces their alcohol intake. With AWS, a patient may experience
    a combination of physical and emotional symptoms which include one or more of
    the following:


    +   - Anxiety or jumpiness

    - Depression

    - Shaking or trembling

    - Irritability

    - Sweating

    - Fatigue

    - Nausea and vomiting

    - Loss of appetite

    - Insomnia

    - Headache'
