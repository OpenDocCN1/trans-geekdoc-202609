- pgno: 40
  md: '4. Owner: Person or organization that owns a particular sensor, communication
    channel, aggregator, decision trigger, or uEntity. There can be multiple owners
    for any of these five. Note that owners may have nefarious intentions that affect
    overall trust. Note that owners may remain anonymous. Note that there is also
    a role for an “operator”; for simplicity, we roll up that into the owner element.


    5. Device_ID: A unique identifier for a particular sensor, communication aggregator,
    decision trigger, or uEntity. Further, a Device_ID may be the only sensor data
    transmitted. This will typically originate from the manufacturer of the entity,
    but it could be modified or forged. This can be accomplished using RFID for physical
    primitives.


    6. Snapshot: An basic properties, assumptions, and general statements about snapshot
    include the following:


    +   a. Because a NoT is a distributed system, different events, data transfers,
    and computations occur at snapshots.


    +   b. Snapshots may be aligned to a clock synchronized within their own network
    (NIST, 2015). A global clock may be too burdensome for sensor networks that operate
    in the wild. However, argue in favor of a global clock (Li & Rus, 2004). This
    publication does not endorse either scheme at this time of this writing.


    +   c. Data, without some “upon-time”ing mechanism, is of limited or reduced value.


    +   d. NoTs may affect business performance – sensing, communicating, and computing
    can speed or slow down a NoT’s workflow and therefore affect the “perceived” performance
    of the environment it operates in or controls.


    +   e. Snapshots may be tampered with, making it unclear when events actually
    occurred, not by changing time (which is not possible) but by changing the recorded
    time at which an event in the workflow is generated or computation is performed,
    e.g., sticking in a delay() function call.


    +   f. Malicious latency to induce delays is possible and will affect when decision
    triggers are able to execute.


    +   g. Reliability and performance of a NoT may be highly based on (e) and (f).


