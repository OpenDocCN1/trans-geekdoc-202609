- pgno: 165
  md: 'humans are part of IoT systems, and necessarily affect the predictable availability
    of services, often in unexpected ways. Consider the story of a driver who took
    advantage of a cell phone app that interacts with his vehicle''s onboard network
    to allow starting the car with the cell phone. Though probably not considered
    by the user, the starting instructions are routed through the cellular network.
    The car started his car with the cell phone app, then later parked the car in
    a mountainous area, only to discover that it was impossible to restart the car
    because there was no cell signal (Neumann, 2018).


    This amass story illustrates a basic predictability problem for IoT networks –
    node location and signal strength may be constantly changing. How do you a constantly
    changing network will continue to function adequately and remain safe? Properties
    such as performance and capacity are unavoidably affected as the configuration
    evolves, but you need to be able to predict these to know if and how a system
    can be used for specific purposes. Modeling and simulation become essential for
    understanding system behavior in a changing environment, but trusting requires
    some assurance that it incorporates all features of interest and accurately represents
    the environment. Beyond this, it must be possible to adequately analyze system
    interactions with the physical world, including potentially rare combinations
    of events.


    Recommendations for design principles for this new environment will take time
    before users are able to trust systems often casually from assorted components.
    Here, the importance of a central theme of this document is reshown: to be able
    to trust a system, it must be bounded, and IoT by its nature may defy any ability
    to bound the problem.


    # 10.12 FEW IoT-SPECIFIC TESTING AND ASSURANCE APPROACHES


    To have any networks of ''things'' acting together, assurance will need to be
    much better than it is today. A network of ''things'' presents a number of testing
    challenges beyond encountered with conventional systems. Some of the more significant
    include the following:


    +   * Communication among Large Numbers of Devices: Conventional Internetbased
    systems usually include one or more servers responding to short communications
    from users. There may be thousands of users, but the communication is typically
    one to one, with possibly a few servers cooperating to produce a response to users.
    Networks of ''things'' may have several tens to hundreds of devices communicating.

    * Significant Latency and Asynchrony: Low power devices may conserve power by
    communicating only on a periodic basis, and it may not be possible to synchronize
    communications.

    * More Sources of Failure: Inexpensive, low power devices may be more likely to
    fail, and interoperability problems may also occur among devices with slightly
    different protocol implementations. Since the devices may have limited storage
    and processing power, software errors in memory management or timing may be more
    common.'
