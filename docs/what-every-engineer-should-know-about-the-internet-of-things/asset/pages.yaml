- pgno: 166
  md: '+   Dependencies among Devices Matter: With multiple nodes involved in decisions
    or actions, some nodes will typically require data from multiple sensors or aggregators,
    and there may be dependencies in the order this data is sent and received. The
    odds of failure increase rapidly as the chain of cooperating devices grows.


    The concerns listed above provide a complex problem for testing and assurance,
    exacerbated by the fact that many IoT applications may be safety critical. In
    such cases, the testing problem is harder, the stakes may be higher than for most
    testing. For essential or life-critical applications, conventional testing and
    assurance will not be acceptable.


    For a hypothetical example, consider a future remote health monitoring and diagnosis
    app, with four sensors connected to two aggregators, which are connected to an
    Utility that is connected to a local communication channel, which in turn connects
    to the Internet, and finally with a large artificial intelligence (AI) application
    at a central decision trigger node. While 99.9% reliability might seem acceptable
    for a critical system. If correct operation depends on all ten of these nodes,
    and each node is 99.9% reliable, then there is nearly a 1% chance that this network
    of nodes will fail its mission, unacceptable for critical systems. This analysis
    has not even considered the reverse path from the central node with instructions
    back to the originating app.


    Basic recommendations to reduce this level of risk include redundancy among nodes,
    and much better testing. This means not just conventional testing and review activities
    but different kinds of testing and verification. For some IoT applications, it
    will be necessary to meet test criteria closer to what are used in applications
    such as telecommunications and avionics, which are designed to meet requirements
    for failure probabilities of 10⁻⁵ and 10⁻⁹, respectively. Redundancy is part of
    the answer, with trade-off that interactions among redundant nodes become more
    critical and the redundant node interactions are added to the large number of
    interacting IoT nodes.


    One additional testing and assurance issue concerns the testability of IoT systems
    (Voun, Kuhn & Laplante, 2018b). There are various meanings of this "ility"; however,
    two that apply are (1) the ability of testing to detect defects, and (2) the ability
    of testing to cover⁶ execute outputs of the system using a fixed set of test cases.
    The reason (1) is that IoT systems may have small output ranges, e.g., a system
    may only produce a binary output. Such systems, if critical, may inherit an ability
    to hide defects during testing. The reason (2) is a concern that if high levels
    of test coverage cannot be achieved, more portions of the overall system will
    go unversed leaving no as to what might happen when those portions are executed
