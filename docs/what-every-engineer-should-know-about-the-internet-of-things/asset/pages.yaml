  md: '# What Every Engineer Should Know About IoT


    2. Programs Review: In the second part of this review, we analyzed CPS and IoT-related
    programs at the top 50 universities ranked by Collegechoice.net and TopUniversities.com.
    Collegechoice.net is an aggregate of US News & World Report and the National Center
    for Education Statistics, and TopUniversities.com includes international universities
    for IoT and CPS courses.


    At this point, it is important to differentiate in order not to confuse "IoT in
    Education" and "IoT Education". IoT in Education was covered in another chapter
    of this book and focuses on technological tools that improve academic infrastructure.
    This discussion, IoT Education, focuses on courses or subjects which teach fundamental
    concepts of computer science (Elyamany & AlKhairi, 2015). An example of IoT Education
    is a focus on utilizing IoT in an education setting as a tool to manage student
    attendance with RFID readers at the school, library, cafeteria, dormitory entrances,
    and to monitor student activities in these locations (Cată, 2015). In this chapter,
    we are covering IoT Education. Thus, during the first part of the study, the research
    that focused on the first facet (IoT in education) were excluded. We found that
    there are much fewer research papers that matched our criteria in this study which
    focuses on educating the next generation of engineers and computer scientists
    to build IoT and CPS.


    We searched the database using keywords related to IoT such as "Internet of Things",
    "IoT", "Network of Things" and "NOT", "Cyber Physical Systems". We also included
    a string made up of keywords-related education such as "education" and "course".
    An example of a search was performed with ("Internet of Things" OR "IoT" OR "Network
    of Things") OR ("Cyber Physical Systems") AND ("Education" OR "Course").



    This search resulted in 309 articles. To determine whether a study should be included,
    the following exclusion criteria were used:


    +   1. A study that was not a peer reviewed such as an opinion, viewpoint, discussion,
    editorial, tutorials, prefaces, and presentations;

    2. Studies that were not in English;

    3. Studies focused on IoT in Education but not IoT Education as we discussed previously.


    After reviewing the titles and metadata of the 54 papers were downloaded to be
    considered in this analysis. After reading the abstract of each paper, there 30
    articles were reviewed on the basis of the exclusion criteria mentioned earlier.
    The remaining 24 papers were reviewed in their entirety, and ultimately, only
    11 remained to be considered that the inclusion criteria.


    While reading papers and reviewing the courses retrieved from the two parts of
    the study, the primitives and Computer Science KAs were documented. The findings
    are discussed in the next sections.


    # 8.4.1 OVERVIEW OF COURSES FROM THE MAPPING STUDY


    Nearly half of the courses discussed in the 11 identified are US based with others
    located in other countries (Italy, Spain, India, UK, and China). Eight'
