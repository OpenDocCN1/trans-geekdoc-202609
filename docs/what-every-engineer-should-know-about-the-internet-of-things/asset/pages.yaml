    # 6.7.2 SMART TRASHCAN


    A smart trashcan is one of the possible components of a SH implementation as waste
    management. This could also be a vital function of a smart city concept. The collection
    of trash has a fixed schedule, but as the generation of the trash is dynamic in
    nature, it may be that one trashcan fills earlier than another. This creates problems
    not only by the bad odor but also from the perspective of environmental factors.
    By building a smart trashcan, the concerned people can be notified well in advance
    which can pick up first.


    # 6.7.2.1 Concept


    The best way to detect the level of filled trash in a trashcan is by using ultrasonic
    sensor attached to the lid as shown below in Figure 6.3.


    Ultrasonic sensor mounted on the lid will face downward and send waves towards
    the bottom of the trashcan. When the can is filled up to a certain level, waves
    will bounce back as echo which will be captured by the sensor. The time difference
    between the sending of trigger signal and reception of echo signal provides a
    reasonable measure of the level of the garbage in the trashcan.

    This system can be simulated with the following components:


    +   - IBM Bluemix IoT Service: IBM offers its inhouse IoT messaging service based
    on MQTT protocol. It is available as part of the IBM Bluemix catalog. A sign-up
    for IBM Bluemix trial account will be needed.


    ![](img/41fdf2aa71adfa568d36836737f447e6_95_0.png)


    FIGURE 6.3 Trashcan with ultrasonic sensor attached.'
