- pgno: 171
  md: '# IoT Trust Concerns


    The relationship between anomalous events and ''things'' is important for a variety
    of reasons, not the least of which is the loss of ownership and control already
    mentioned. Assume worst-case scenarios for ''things'' that are complete boxes.


    Consider certain scenarios: (1) a ''thing'' fails completely or in a manner that
    makes bad data that infects the rest of the system, and (2) a ''thing'' is fed
    corrupt data that you wish to know that ''thing'' reacts, i.e., it is resilient.
    Resilience means that the ''thing'' still provides acceptable behavior. These
    two scenarios have been referred to as ''propagation attack'' and ''propagation
    from'' (Voas, 1997). Propagation across is the study of ''garbage in garbage out''.
    Propagation across tests the strength of a component or ''thing''. Propagation
    from is the study of how through a system an internal failure that creates corrupt
    data can cascade. Possibly it propagates all of the way and perhaps the corrupt
    internal state of the system is not enough to cause damage. In this case, the
    system shows its resilience.


    A related concern involves who is to blame when a ''thing'' or network of ''things''
    fails? This trust (and legal liability) becomes especially problematic when there
    are unplanned interactions between critical and noncritical components. Discussing
    IoT trust, there are two questions: (1) What is the possibility of system failure?
    And (2) Who is liable when the system fails? (Voas & Lapantie, 2017).


    Consider the first question: Is there the possibility of system failure? The answer
    to this question is very difficult to determine. A powerful technique for determining
    the risks of a system-level failure would involve fault injection to simulate
    the effects of real faults as opposed to simulating the faults themselves. But
    until these risks can be accurately and scientifically measured, there likely
    won''t be a means for probabilistically and mathematically bounding and quantifying
    liability (Voas & Lapantie, 2017).


    Now consider the second question: Who is liable when the system fails? For any
    nonconnected system, the responsibility for failure lies with the developer (i.e.,
    the individual, individuals, company, or companies, inclusive). But for systems
    that are connected to other systems and through the Internet, the answer becomes
    more difficult. Consider the following legal opinion:


    > In case of (malfunctioning) ''thing'' it is d''t difficult to determine the
    perimeter of the liability of each supplier. The issue is even more complex for
    artificial intelligence systems involving a massive amount of collected data so
    that it might be hard to determine the reason the system made a specific decision
    at a specific time. (Coraggio, 2016)


    Interactions, both planned and spontaneous, between critical and noncritical systems
    create significant risk and liability concerns. These interacting, dynamic, cross-domain
    ecosystems create the potential for increased threat vectors, new vulnerabilities,
    and new risks. Unfortunately, many of these will remain as unknown unknowns until
    a failure or successful attack has occurred.


    In summary, this paper offers no recommendations for assessing and measuring reliability.
    The traditional reliability measurement approaches that have been around for decades
    are appropriate for a ''thing'' and a network of ''things''. These approaches,
    as well as assessments of resilience, should be considered throughout a system''s
    life cycle.'
