  md: '# IoT Trust Concerns


    +   1. Response Time: The time between the presentation of a set of inputs to
    a system and the realization of the required behavior, including the availability
    of all associated outputs.

    2. Real-Time System: A system in which logical correctness is based on both the
    correctness of the outputs and their timelines.

    3. Hard Real-Time System: A system in which failure to meet even a single deadline
    lead to complete or catastrophic system failure.

    4. Firm Real-Time System: A system in which a missed deadline will not lead to
    total failure but more than a few may lead to complete or catastrophic system
    failure.

    5. Soft Real-Time System: A system in which performance is degraded but not destroyed
    by failure to meet response-time constraints (Lapante & Ovaska, 2012).


    These traditional measures of performance can be recommended as building blocks
    for next-generation IoT trust metrics. For example, taking a weighted average
    of response times across a set of actuation and event combinations can give a
    “response time” for an IoT system. Once “response time” is defined, then notions
    of deadline satisfaction and designation of hard, firm, or soft real-time can
    be assigned. Furthermore, repositories of performance data for various types of
    IoT systems, devices, and communication channels should be created for benchmarking
    purposes and eventual development of standards.


