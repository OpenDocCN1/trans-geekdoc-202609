  md: "# What Every Engineer Should Know About IoT\n\nNext, each of these SH research\
    \ themes is explained in further detail. This chapter concludes with a description\
    \ of two do-it-yourself SH devices: a smart garden and a smart trashcan.\n\n#\
    \ 6.2 SECURITY DESIGN AND MANAGEMENT\n\nSecurity is one of the most predominant\
    \ SH research areas. When designing a SH, there are two main categories of home\
    \ security to consider: cyber and physical. Cybersecurity can be one of a challenge\
    \ to manage because for every device added to the SH, there is an added way for\
    \ a hacker to break into the system. This is not to minimize the importance of\
    \ the physical security of a SH – but now with Internet of Things (IoT), activity\
    \ monitoring, face recognition, and real-time notifications can be added to the\
    \ traditional security system.\n\n# 6.2.1 SMART HOME SECURITY OVERVIEW\n\nSecurity\
    \ should be a consideration in the initial design of all SH products. Products\
    \ are more vulnerable than others such as those that feature multiple users, use\
    \ web-based services, and have multiple in-home sensors. The challenge is that\
    \ these products need to manage security while also improving communication and\
    \ reliability (Golvik et al., 2018).\n\nSpecific product examples focusing on\
    \ security are those that enable real-time monitoring of the home and disturbance\
    \ detection, automation of lighting, temperature, and humidity of the home (Sharma\
    \ et al., 2015). Researchers working on security design and management focus on\
    \ the best practices to mitigate threats, vulnerabilities of the SH system. In\
    \ other words, the approaches to integrate security in SH devices design include\
    \ standards and best practices to deal with security threats and the countermeasures\
    \ to secure vulnerabilities in SH design (Batalla, Vasilakos & Gajewicki, 2017).\
    \ Typical threats include privacy and security attacks where assets are compromised,\
    \ physical attacks on smart devices where device firmware and hardware are manipulated,\
    \ and denial of service.\n\nDirect consequences of a cyberattack on a SH include\
    \ financial, vocational, invasion and inconvenience, and much more. To help researchers\
    \ from diverse disciplines evaluate SH attacks, a classification of SH threats\
    \ to highlight vulnerabilities of SH configurations was identified (Heartfield\
    \ et al., 2018).\n\n+   * Cyber Threat Impact:\n    * Confidentiality (e.g., keeping\
    \ sensitive data private)\n    * Integrity (e.g., accuracy, completeness, and\
    \ consistency of SH data)\n    * Availability (e.g., data is available at a required\
    \ level of performance)\n    * Nonproduction (e.g., assurance that the data sender\
    \ is provided with proof of delivery AND the data recipient is provided with proof\
    \ of the sender's identity)\n* Physical Threat Impact:\n    * Unauthorized actuation\
    \ (i.e., an authorized user did not initiate or approve the action to cause something\
    \ in the operate)."
