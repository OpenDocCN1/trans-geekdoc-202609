- pgno: 13
  md: '# Authors


    **Dr. Joanna F. DeFranco** is an associate professor of software engineering and
    a member of the graduate faculty at The Pennsylvania State University. Before
    her academic career, she spent many years as a software engineer for government
    and industry. Notable engineering experiences during this period including travel
    to the Naval scientific ships while developing and testing ocean mapping software
    for the Naval Air Development Center (NADC) and developing software for cable
    head devices at Motorola. She has published many journal articles and conference
    proceedings on software security, IoT, blockchain, and software engineering. She
    authored another book in this series on Cyber Security and Digital Forensics and
    coauthored a book on project management.


    In addition to academia, Dr.DeFranco is currently a researcher for the National
    Institute of Standards and Technology (NIST), the Computing Fundamentals area
    editor for IEEE Computer, and the IoT column editor of *IEEE Computer* magazine.
    As her scholarly credentials, she earned a BS in electrical engineering and math
    from Penn State University, an MS in computer engineering from Villanova University,
    and a PhD in computer and information science from New Jersey Institute of Technology.


    **Dr. Mohamad Kassab** is an associate research professor in software engineering
    at Pennsylvania State University, and earned his PhD and MS degrees in software
    engineering from Concordia University in Montreal, Canada. Previously, Dr. Kassab
    has been a postdoctoral researcher at ETS School of Advanced Technology in Montreal
    and visiting scholar at Carnegie Mellon University. Dr. Kassab''s research interests
    includes requirements engineering, system architecture, software quality and measurements,
    blockchain, and the Internet of Things. He has published extensively in software
    engineering books and journals. With more than 18 years of industrial experience,
    he has worked in various industrial roles which include business unit manager
    at Soramitsu, senior quality engineer at SAP, senior associate at Morgan Stanley,
    senior quality assurance specialist at NOKIA, and senior software developer at
    Positron Safety Systems.'
