    # 9.4 CONSIDERATION FOR QUALITY REQUIREMENTS FOR IoT IN HEALTHCARE APPLICATIONS


    When specifying the functionality for IoT healthcare applications, attention is
    naturally focused on such as fitness of purpose, wireless interoperability, energy
    efficiency, and so on. Conventional requirements elicit techniques such as domain
    analysis, Joint Application Development (JAD), and Quality Function Deployment
    (QFD) among others (Laplaine, 2013) are usually adequate for these kinds of requirements.
    But in healthcare applications, some requirements are probably of greater concern.
    We explore these types of requirements further in this section.


    # 9.4.1 PRIVACY REQUIREMENTS


    Privacy concerns have always been a crucial aspect of healthcare. Patients expect
    that their PII remain confidential and that healthcare providers will protect
    them. Similarly, IoT-based healthcare systems must assure privacy but allow for'
