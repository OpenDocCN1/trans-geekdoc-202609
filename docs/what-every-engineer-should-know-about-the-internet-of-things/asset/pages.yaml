  md: '# What Every Engineer Should Know About IoT


    Machinery/Institute of Electrical and Electronic Engineers (ACM/IEEE) computer
    science knowledge areas (KAs). In addition, to highlight specific course projects,
    this chapter will be able to assist in the effort of building or adapting current
    academic programs offered to meet the current and future IoT/CPS development.


    # 8.2 INTERNET OF THINGS


    Since we are mapping the courses to the NIST NoT primitives discussed earlier
    in the book, a review of those primitives is useful. Recall that an IoT is representation
    of a NoT, and because of the upward trend of IoT applications and various domains,
    it is useful to use a consistent language to build NoTs (Voas, 2016). As described
    in Chapter 2, IoTs can be described by five primitives (i.e., the five Lego-like
    building blocks for any IoT-based system) as proposed in the NIST Special Publication
    800-183 (Voas, 2016):


    +   1. A sensor is an electronic utility (e.g., cameras and microphones) that
    measures properties such as sound, weight, humidity, temperature, and acceleration.
    Properties of a sensor could be the transmission of data or (e.g., RFID), Internet
    access, and/or be able output data based on specific events.

    2. A communication channel is the medium by which data is transmitted (e.g., via
    Universal Serial Bus (USB), wired, wireless, verbal). This software is based on
    mathematical function().

    3. An aggregator is software that can transform raw data (from any source) into
    intermediate, aggregated data. Aggregators have two actors for consolidating large
    volumes of data into lesser amounts:

    4. Cluster is "abstract grouping of sensors (along with the data they output)
    can appear and disappear instantaneously"

    5. Weight is the "degree to which a particular sensors will impact an aggregator''s
    computation"

    6. A decision trigger "creates the final result(s) needed to satisfy the purpose,
    specification and requirements of a specific NoT". A decision trigger is a conditional
    expression that triggers an action and absolutely defines the end purpose of a
    NoT. A decision trigger output can control actuators and transactions.

    7. External utility (Utility) is a "hardware product, software or service that
    executes processes or feeds data into the overall data flow of the NoT"


    Note, that any specifically proposed NoT may not include all five primitives.
    For example, you could have a NoT without any sensors. The simplest way to think
    about IoT is that the "things" are what make IoT unique. Remember, that the IoT
    is an acronym, the (T) is the letter that matters the most. The primitives are
    essentially the (T)s. We need to educate the next generation of computer scientists
    and engineers on the (T)s (DeFranco, Kassab & Voas, 2018).'
