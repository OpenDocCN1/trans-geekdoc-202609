    # 10.5 HETEROGENEITY


    The heterogeneity of ''things'' is economically desirable because it fosters market-place
    competition. But today, IoT creates technical problems that mirror past problems
    when various flavors of Unix and Postscript did not integrate, operate, or compose
    well. Then, different versions of Postscript might or might not print on a specific
    printer and when Unix applications to different Unix platforms did not necessarily
    mean the applications would execute. It was common to ask which ''flavor of Unix''
    which vendor''s product operate.


    As scalability, issues concerning heterogeneity are inevitable as IoT networks
    develop. A network of ''things'' is simply a system of ''things'' that are made
    by various manufacturers, and these ''things'' will have certain tolerances (or
    intolerances) to the other ''things'' that they are connected to and communicate
    with.


    The marketplace of ''things'' and services (e.g., wireless communication protocols
    and clouds) will allow for the architecture of IoT offering functionality with
    multiple vendors. Ideally, the architecture for a network of ''things'' will allow
    IoT products and services to be swapped in and out quickly but often will not
    be the case.


    Heterogeneity will create problems in getting ''things'' to integrate and operate
    with other ''things'', particularly when they are from different and competing
    vendors, and these issues must be considered for all five classes of IoT primitives
    (NIST, 2016). This is discussed in Section 10.5. And heterogeneity will allow


