    # 10.17 EXCESSIVE DATA


    Any network of ''things'' is likely to have a dynamic and rapidly changing dataflow
    and workflow. There may be numerous inputs from a variety of sources such as sensors,
    external databases or clouds, and other external subsystems. The potential for
    the generation of vast amounts of data over time renders IoT systems ''big data''
    generators. In fact, one report predicts that global data will reach 44 zettabytes
    (44 billion terabytes) by 2020 (IoT IQ News). Note there will be networks of ''things''
    that are not involved in receiving or generating large quantities of data, e.g.,
    closed-loop systems that have a small and specialized purpose. An example would
    be a classified network that is not tethered to the Internet.


    The data generated in any IoT system can be corrupted by sensors, aggregators,
    communications channels, and other hardware and software utilities (NIST, 2016).
    Data is not only susceptible to accidental corruption and delay but also malicious
    tampering, delay, and theft. As previously mentioned in Section 10.14, data is
    the most important asset to be protected from a cybersecurity perspective.


    Each of the primitives presented in NIST (2016) is a potential source for a variety
    of classes of corrupt data. Section 10.3 discussed the problems of “propagation”
    and “propagation from”. Although hyperbole, it is reasonable to visualize an executing
    network of ''things'' to a firework show. Different explosions occur at different
    times although all are in timing coordination during a show. Networks of ''things''
    are similar in that internal computations, and the resulting data is in continuous
    generation until the IoT system performs an actuation or decision.'
