    # 8.6 CPS /IoT COURSES KNOWLEDGE AREAS OF COMPUTER SCIENCE


    Most of the analyzed courses focused on IoT and CPS development. For example,
    an AMI system utilizes pervasive technology and refers to the capacity of an IoT
    system to sense the environment and respond to the presence of people. Pervasive
    computing are the microprocessors that facilitate the consistent communication
    connection in AMI systems.


    In other words, AMI builds upon pervasive computing and human-centric computer
    interaction (KA: human-computer interaction). Environments that use AMI have the
    following properties (Lee, 2017):


    +   - Identity recognition;

    - Awareness of an individual''s presence;

    - Context awareness (e.g., traffic, weather);

    - Activity recognition and;

    - Individual needs adaptation.


    An excellent example of AMI are Ambient Assistant Living (AAL) technologies. These
    technologies are designed to assist autonomous aging care such as detecting falls
    or medication reminders (Jaschinski & Allchouch, 2015). Another example of an
    ambient technology device is one that detects and absorbs emission carbon dioxide
    in order to reduce control global warming (Manoj & Renold, 2011).


