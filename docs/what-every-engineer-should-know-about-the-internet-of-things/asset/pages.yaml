  md: '# 12 What Every Engineer Should Know About IoT


    type of NoT could be a local area network (LAN), with none of its ''things'' connected
    to the Internet. Social media networks, sensor networks, and the Industrial Internet
    are all variants of NoTs. This differentiation in terminology provides ease in
    rating out cases from varying vertical and quality domains (e.g., transportation,
    medical, financial, agricultural, safety-critical, security-critical, performance-critical,
    high assurance, to name a few). That is useful since there is no singular IoT,
    and it is meaningless to speak of one IoT to another.


    Primitives are building blocks that offer the possibility of an answer to the
    aforementioned questions and statements by allowing comparisons between NoTs.
    We use the term ''primitive'' to represent smaller pieces from which larger blocks
    or systems can be built. In software coding, primitives typically include the
    arithmetic and logical operations (plus, minus, and, or etc.). In this document,
    we do not employ the restriction that primitives cannot be developed or derived
    from something else; this is a common, paraphrased definition for ''primitive'',
    but it is not employed here.


    This model does not specify a definition for what is or not a ''thing''. Instead,
    consider that each primitive injects a behavior representing that ''thing'' into
    a NoT''s workflow and dataflow. ''Things'' occur in physical or virtual space.
    In physical space, consider humans, vehicles, residences, computers, switches,
    routers, smart device, networks, office buildings, etc. In virtual space, consider
    social media threads, files, data streams, virtual machines, virtual networks,
    etc. More considering ''things'' are presented later in this chapter.


    Primitives offer a unifying vocabulary that allows composition and information
    exchange among differently positioned networks. They offer clarity regarding concerns
    that are subtle, including interoperability, composability, and continuously binding
    assets that come and go on the fly. Because no simple, actionable, and universally
    accepted definition for IoT exists, the model and vocabulary proposed here reveals
    underlying foundations of the IoT, i.e., they expose the ingredients that can
    express how the IoT behaves, without defining IoT. This offers insights into issues
    specific to trust.


    Further, we may general definition for a distributed system: a software system
    in which components located on networked computers communicate and coordinate
    their actions by passing messages. The components interact with each other in
    order to achieve a common goal. NoTs satisfy this definition. Thus, we consider
    IoT to be one of type a NoT and to be one type of a distributed system.


