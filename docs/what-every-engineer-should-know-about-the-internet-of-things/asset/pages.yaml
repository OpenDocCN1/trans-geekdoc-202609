  md: '# What Every Engineer Should Know About IoT


    # 11.6 CONCLUSION


    In this chapter, we introduced the concept of blockchain and Smart Contracts and
    provided a high-level example of integration between blockchain technologies and
    IoT devices.


    Traceability systems are considered fundamental to ensure the safety of a food
    product and prevent food fraud in the food supply chain. System based on blockchain
    and Smart Contracts for monitoring, integrated with the IoT, allow a traceability
    system to operate without third party, which is usually responsible for controlling
    the agri-food supply chain, transparency of data, and indication of the origin
    of the products, as well as allowing the end customer to control the characteristics
    of the product purchased.


    IoT and blockchain will be the protagonists of a technological revolution which
    has already started. Understanding the implications of the combined use of these
    technologies will be fundamental for both practitioners and researchers. IoT devices
    generate, collect, and transform data, while a blockchain stores data in a tamper-resistant
    way, and Smart Contracts are the foundations of decentralized applications.


