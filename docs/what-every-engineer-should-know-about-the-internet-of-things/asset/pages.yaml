  md: '# Smart Homes


    # 75


    # 6.5.1 MANAGING ACTIVITY AND DAILY CONSUMPTION


    Power consumption is also a common research area. In a field study with participants
    managing their energy tariff daily to match their consumption level, participants
    showed to be ready to use a Tariff Agent to manage their energy tariffs (Alan
    et al., 2016). The findings imply that this activity is a way to stay engaged
    with the system.


    Understanding the usage patterns for more effective resource planning of a smart
    grid is critical. An effective SH approach, focusing on cost reduction, is to
    enable the homeowner to plan appliance usage. Gupta, Jha, and Nagar (2016) created
    an approach to increase convenience to resource planning and cost reduction with
    their proposed approach to a smart grid that is a reliable technology to control
    and monitor electricity and information to generate, transmit, and distribute
    electricity.


    # 6.6 SYSTEMS DESIGN


    In SH design, researchers focused on requirements, both functional and nonfunctional,
    and architecture. Functional requirements are those that describe the services
    a system provides and how the system reacts to input (Laplande, 2014). Nonfunctional
    requirements are slightly more challenging as they are difficult to define and
    verify (e.g., safety, reliability, usability, interoperability). Software architecture
    involves the structure, interaction, and organization of the system''s components
    and subsystems to form a system (Laplande, 2007). There are many architectural
    styles, each representing important properties of the system.


    # 6.6.1 ARCHITECTURE


    A SH high-level architecture is made up of three main components (Li et al, 2018):


    +   1. Smart System: Servers, communication networks, workstations, and interactions
    with applications, websites.

    2. Family Intelligent Interactive Terminal: Interface into the system components
    (appliances, security, etc.).

    3. Smart Electrical Equipment: Appliances, security, electrical systems data collection,
    etc.


    # 6.6.2 REQUIREMENTS


    The major requirements to provide an SH platform with which to build more robust
    SH applications were provided along suggested architecture styles (Hui, Sherratt
    and Sanchez, 2017).


    +   1. Heterogeneity (Server Centralized Architecture and Service-Oriented Architecture):
    Enabling information exchange between things connected to the network.

    2. Self-Configurable (Wireless Sensor Network Architecture – WSN): Enabling the
    addition or removal of connected devices in the SH network.'
  merge: -1
  img_proc: true
- pgno: 92
  md: '+   Extensibility (WSN): Enabling the extension or configuration update of
    the connected devices.


    +   Context Awareness (Open Services Gateway Initiative Architecture – OSGI);
    The capability to detect location or environmental changes.


    +   Usability (Brain–Computer Interface – BCI): Ease of use and easy to learn
    the SH system.


    +   Security and Privacy Protection (WSN): Level of protection against unauthorized
    use and malicious attacks.


    +   Intelligence (Data-Information-Knowledge-Wisdom – DIKW): Enabling human activity
    prediction.


    Interoperability is an essential requirement of SH as integrating heterogeneous
    devices to enable communication. Santofimia et al. (2018) proposed a virtual protocol
    that supports communication among different technology. Puustjarvi and Puustjarvi
    (2015) went a further step and created SH ontology to facilitate semantic interoperability
    in SH. Semantic interoperability enables data exchange between devices with unambiguous
    shared meaning. They used the principles of Linked Data (e.g., a best practice
    for providing a data infrastructure to share data across the web) to integrate
    data from external data sources as well – all to increase the usability of the
    system within a SH.


    For device management, which can facilitate device interoperability, the requirements
    and design of a fog-assisted cloud architecture were proposed. Fog computing environment
    provides a means to share network services between cloud centers and end users.
    A technique called Resource Management Technique for Smart homes (ROUTER) for
    fog-enabled computing environments was proposed. This technique optimizes the
    response time, network bandwidth, energy consumption, and latency of the devices
    (Gill, Garraghan & Buyya, 2019).


    IoT device management not only needs to facilitate interoperability between devices,
    but also to be efficient. A prevalent research area is energy efficiency. Jo and
    Yoon (2018) created three IoT platform models to work together to allow the IoT
    devices to operate as well as reduce network congestion and conserve energy.


    +   Intelligence Awareness as a Service (IAT): Learns situational awareness of
    the data generated by sensors.


    +   Intelligence Energy Efficiency as a Service (IE''S): Processes the data collected
    by IAT to learn energy usage patterns.


    +   Intelligence Service TAS (IST): Provides control and management of the services.


    Efficient device communication and management are vital requirements of an SH.
    For SH device communication (i.e., efficient initialization, synchronization,
    and data transmission), a model based on visible light communication (VLC) was
    proposed. This model (Tiwari, Sewaiar & Chung, 2017) uses light-emitting diodes
    to transmit and photodetectors as receivers. Another proposed cuckoo search algorithm
    to optimize VLC (Sun et al., 2017).'
