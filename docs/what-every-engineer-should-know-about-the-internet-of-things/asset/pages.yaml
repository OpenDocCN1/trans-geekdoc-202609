  md: '# Smart Homes 67


    +   * Incorrect actuation (i.e., the operation was not as required by an authorized
    user).

    * Prevented actuation (i.e., authorized user not able to initiate a desired actuation).

    * Delayed actuation (i.e., actuation is initiated or completed later than desired
    by the user).

    * Breach of physical privacy (i.e., covertly recording audio in a home).


    Another category of home security focuses on the inside of the home autonomously
    detecting security-related situations (Dahmen et al., 2017):


    +   * Detecting Resident-Based Target States: Systems using sensors learn inhabitant
    activity/activity patterns throughout the home to determine if intervention is
    needed. There are many methods using audio and video to detect individuals with
    the aging population. Sensors, wearables, and vibration sensors in the floor.

    * Home-Based Target States: Sensing the location of inhabitants, looking for anomalies
    (i.e., finding data not conforming to expected behavior), and sensing visitors
    or intruders.

    * Home-Anomaly Behavior Detection: Techniques to determine unexpected behavior
    patterns. Location in the home using mass doors and window sensors.

    * Activity Anomaly Detection: A deeper level of activity recognition (i.e., health
    monitoring as sleep patterns or a decline in cognitive health).


    # 6.2.2 Smart Home Design and Management


    Security and privacy go hand in hand. A security breach causes a vulnerability
    that could expose an unsuspecting user to a privacy breach. For example, an IVA
    has four possible attacks: wiretapping, direct communication to an IVA-enabled
    device, malicious voice commands, and unintentional voice recognition. Figure
    6.1 represents the four possible attacks in the IVA environment.


    The IVA ecosystem is complex and heterogeneous, there are also various points
    where attacks can occur. In the first scenario, the IVA-enabled device is an attack
    that intercepts conversations between people and speakers by wirelessly the protocols
    that communicate with the cloud. In the second scenario, the speakers are compromised
    by hackers via eavesdropping devices that record what users say. Furthermore,
    in the third scenario, the hacker impersonates the user as a starting point for
    attacking the smart home to carry out criminal acts such as ordering things from
    the homeowner''s account or opening the garage door to enter and steal from the
    home. Fourth, AI speakers inadvertently overhear what users say as wake-up words
    record it and send it to the cloud. This could be an unintentional recording attack
    because the user did not attempt to communicate with the speaker (Chung et al.,
    2017).'
