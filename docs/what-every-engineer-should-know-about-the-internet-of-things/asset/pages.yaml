- pgno: 190
  md: '# 174 What Every Engineer Should Know About IoT


    When transferring the Bitcoins associated with one address to another, the public
    key of the first must be revealed.


    The procedure for generating a new Bitcoin address is as follows:


    +   1. A random number d (private key) of 256 bits is generated;

    2. The public key B is generated starting from d and from the standard elliptic
    curve sec256k1;

    3. Starting from b, the Bitcoin address A is generated with a procedure;

    4. A Bitcoin address has about 195 bits, and it is represented with 30-34 alphanumeric
    characters (BASE85 representation) always starting with “1”.


    Given an address, only the owner of the key d can generate B from it, and from
    B generate A.


    The steps to generate a Bitcoin address from the public key B are the following:


    +   1. Calculation of the RIPEMD160 hash of the SHA256 hash of B:

    hash:= RIPEMD160 (SHA256 (B))

    2. Add a byte (address version) in the hash of:

    ha:=b with b equal:

    0x05(0000101) for the main key (Bitcoin)

    0xc4(1100100) for the net test

    3. Calculation of the SHA256 hash of the SHA256 hash of ha:

    hh:=SHA256 (SHA256 (ha))

    4. Extract the first 4 bytes of hh, to be used as checksum (cs):\cs=First4Bytes(hh)

    5. Concatenation of b, hash and cs (8+60+32=200 bits):

    a:=BASE58(b.hash.cs)


    A BASE58 string is generated by encoding a number (a sequence of bits) in base
    58, using the following 58 alphanumeric characters as digits from 0 to 57:

    123456789ABCDEFJKLQRSTUVWXYZabcdefghijkmnopqrstqrstuvwxyz


    Without the “ambiguous” characters: 0, O, 1

    Examples of Bitcoin addresses:


    NdNaNG1K9eDW5jFDmTIbih5micPsGE1yQ3Kkhf9QABRKKZzTjdAc2NGFUaoDcR


    The procedure of calculating A starting from B, with four successive hashing is
    to:


    +   * Prevent B from being made public (because it could be attacked with quantum
    computers in the future);

    * Insert a “checksum” that verifies whether the address has been entered incorrectly:
    in this case, the software does not make payments to this address;'
