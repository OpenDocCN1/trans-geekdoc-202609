    # 6.3.2 SMART HOME PRODUCTS DESIGN CONSIDERATIONS


    The hot topics for SH product design include improving specific development challenges,
    creating more products with a healthcare focus, and improving overall safety of
    SH products. Following are design recommendations for each of those topics (Alaa
    et al., 2017):


    +   * Challenges: correct usage and monitoring power consumption,

    * Healthcare: following medical guidelines and creating more products to assist
    the elderly

    * Safety: easing network and fault management


    # 6.3.2.1 User Acceptance/User Experience


    User acceptance is a highly researched topic. A survey was administered to analyze
    and understand the acceptance model of SH services (Park et al., 2018). The acceptance
    is based on attitude towards SH services, perceived usefulness, and ease of use.
    The results showed that the perceived usefulness had the most influence on attitude
    – where the ease of useness depends on compatibility between the user''s traditional
    devices and the new service. Another survey regarding user acceptance resulted
    in the understanding that users want to be able to access their SH services while
    outside the home (Yang, Lee & Zo, 2018). This indicates that security, privacy,
    and trust are the vital factors of the provided SH services.


    A comparative study with the most suitable SH control and management tools was
    conducted (Caivano et al., 2018). They chose the tools based on the following
    criteria: license and price, flexibility for users to add and modify devices in
    the SH, ease of controlling the device, tool extensibility (e.g., integration
    with other home systems), technical support, ease of interconnection with other
    smart devices in the SH, interoperability with web services (e.g., file sharing,
    e-mail, weather apps, etc.). These provide guidelines for SH management tool design.
    The top three tools were Atooma, IFTTT, and Tasker. In general, all of the SH
    management tools evaluated need to address a better user experience.


    # 6.3.2.2 Data Transfer


    Within the SH, sending data from one sensor to another is a major part of the
    real-time monitoring process. Having this transfer over in real time is the challenge.
    When comparing two methods, WebSocket and polling for data transfer, it was determined
    that the WebSocket methods were more effective (Soewito, Gunawan & Kusuma, 2019).'
