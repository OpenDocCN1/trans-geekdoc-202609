- pgno: 162
  md: 'One difficulty is here that for some "ities", there is a subsumies hierarchy.
    For example, reliability, security, privacy, performance, and resilience are "ities"
    that are grouped into what LaPrie termed "dependability". While having a subsumies
    hierarchy might appear to simplify the relationship between different "ities",
    that is not necessarily the case. This can create confusion.


    Building levels of the "ities" into a network of ''things'' is costly and not
    all "ities" operate with each other, i.e., "building in" more security can reduce
    performance (Voas & Hurlbert, 2015). Another example could be fault tolerance
    and test. Fault-tolerant systems are designed to mask errors occurring during
    operation. Testable systems are those that do not mask errors and make it easier
    for a test to notify when something is in error inside of a system. Deciding which
    "ities" are more important is better from both a cost-benefit trade-off analysis
    and a technical trade-off analysis. Also, some "ities" can be quantified and others
    cannot. For those that cannot be quantified, qualified measures exhibit.


    Further, consider an "ility" such as reliability. Reliability can be assessed
    for (1) a ''thing'', (2) interfaces between ''things'', and (3) the network of
    things itself (Voas, 1997). These three types of assessments apply as most "ities".


    Deciding which "ities" are more important and at what level and cost is not a
    well-understood process. No cookbook approach exists. The point here is that nonfunctional
    requirements might play just as important of a role in terms of the overall system
    quality as functional requirements. This reality will impact the satisfaction
    of the integrators and adopters with the resulting network.


    In summary, deciding which "ity" is more important than others must be dealt with
    a case-by-case basis. It is recommended that the "ities" are considered at the
    beginning of the life cycle of a network of ''things''. Failure to do so will
    cause downstream problems throughout the system''s life, and it may continue cause
    attention as to how unintended behaviors do not match actual behaviors.


    # 10.9 SYNCHRONIZATION


    A network of ''things'' is a distributed computing system. Distributed computing
    systems have different computations and events occurring concurrently. There are
    numerous computations and events (e.g., data transfers) occurring in parallel.


    This creates an interesting dilemma, similar to in traffic control: trying to
    keep all events synchronized and executing at the precise times and in a precise
    order. When events and computations get out of order due to delays or failures,
    an entire ecosystem can become unbalanced and unstable.


    IoT is no different and possibly more complex than traffic control. In traffic
    control, there is a global clock that does not require events be time-stamped


