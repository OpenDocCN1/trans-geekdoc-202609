    # 6.3 SMART HOME PRODUCTS/TOOLS/APPLICATION


    SH products are those that focus on improving an inhabitant''s comfort and automates
    some of their everyday tasks. The following sections will cover SH product examples
    followed by more specific considerations for SH product design.


    # 6.3.1 Smart Home Products Examples


    Plants are a lovely addition to a home – however, require continual care. A smart
    botanical garden with sensors to monitor the humidity, illumination, and temperature
    is an IoT device for the time-challenged. A smart garden with an emotion-aware
    feature that adjusts its growing and flowering to the user''s sleep schedule was
    described in Chen et al. (2017). Further plans for this system to integrate security
    and privacy into the system.


    Lee et al. (2017) introduced the concept of social connectedness (e.g., sense
    of belonging) and its integration with SH devices. Their research showed the effectiveness
    of SH devices when social connectedness is considered in the design. The typical
    SH IoT device is to facilitate the efficiency of the homes residents'' day-to-day
    tasks, given that 28% of all households are single person (www.census.gov), many
    people who live alone would also benefit from devices that provide social support.
    Experimental results showed that social connectedness with SH devices improved
    the perceived social support for users.


    A home recommend based on emotion analysis of texts collected during outdoor activities
    is proposed in Kang & Seo (2019). When the user''s phone coordinates were more
    than the predefined distance from their home, texts were collected. The server
    continually evaluated the emotion of the texts and played the matching music upon
    the user''s home arrival.


    An application using a smart wall socket was developed to control the household
    appliances remotely using a mobile application (Pangbertha et al., 2019). There
    is a feature to turn on/off manually or by a timer. An electric current-monitoring
    feature is also under deman.


    Some unique IoT healthcare products are also available. One product was equipped
    for a person with dementia. A system was designed to detect and record home activities
    that were incomplete due to a person''s condition (e.g., leaving the door open;
    Demir et al., 2017). The system will remind/notify the resident with dementia
    as well as the caregiver of hazards with photographs.


    Another product describes an integration with an SH dashboard includes notification
    for disease outbreaks using sentiment analysis on data mined and extracted'
