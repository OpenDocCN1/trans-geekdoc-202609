  md: 'data. Since the data is collected in the granularity of elementary event level
    in a 7×24 mode, the data volume is very high and the data access pattern also
    differs considerably from traditional business data. This has motivated a new
    generation of data management solutions, e.g., NoSql database, map-reduce distributed
    computing framework, et. (Zhang, 2016).


    The IoT in the education domain is not an exception. Incorporating IoT in education
    will generate a large volume of data. Hence, the need for analyzing and treating
    these data to capture information and trends emerges. The scalability concern
    is addressed in papers over the selected primary studies. In Jagapt et al. (2016),
    the authors address the issue of scalability in the context of providing personalized
    content to the students based on analyzing a large volume of collected student
    data and activity. They propose a design for a “social recommender” system that
    is based on Hadoop and its particular computing platform.


    In Mahmood et al. (2017), the authors discuss scalability concern when designing
    a learning management system. Other studied that discussed the scalability issue
    are Lamri et al. (2014); Sandu, Costache & Basel (2015); Poi et al. (2013); Jurkovic
    et al., (2015); and Alvarez, Silva & Correa (2016). With scalability, concerns
    regarding the discussion on the cost of IoT technology in education also becomes
    significant. The main question that may arise is in the 20 runs, IoT devices and
    Big Data analysis will increase the already-divide into a two-class learning system:
    those who can disburse these technologies and those who cannot! At the same time,
    if going to school should be affordable for everyone, which schools will be able
    to buy and service their devices? The financial concern of IoT in education is
    discussed in four selected articles: Maleko, Hamilton & D’Souza (2012); Putjorn,
    Ang & Farzin (2015); Georgescu & Popescu (2015); and Pruet et al., (2015).


    # 7.3.3 HUMANIZATION


    There are questions on the moral rate that IoT may play in human lives, particularly
    in respect to personal control. Applications in the IoT involve more than computers
    interacting with other computers. Fundamentally, the success of the IoT will depend
    on how far the technologies are connected and on the humanization of the technologies
    that are connected (Tech, 2015). IoT technology may reduce people’s autonomy,
    shift towards particular habits, and then shifting power to corporates focused
    on financial gain. For the education system, this effectively means that the controlling
    agents are the organizations that control the tools used by the academic professionals
    but not the academic professionals themselves (Gubbi et al., 2013).


    Dehumanization is discussed in selected papers: Murphy et al. (2015) and Lenz
    et al (2016). Many studies indicate that face-to-face interaction between students
    will not only benefit a child’s skills also positively contributes to the character
    building. The issue that may arise from increased IoT technologies in education
    is the partial loss of the social aspect of going to school. Conversely, using
    IoT in virtual learning environments can be of special support to students of
    special needs (e.g., dyslexic and dyscalculic needs, for example Lenz et al. (2016)).'
