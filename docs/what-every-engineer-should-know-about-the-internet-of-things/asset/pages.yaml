    of the system (e.g., application programming interfaces (APIs) and mobile apps)
    were classified as the highest risk Jacobson, Boldt & Carlsson, 2016). The results
    indicate these risks can be minimized if a more general model of security and
    privacy is included in the design phase of a SH with the following steps:


    +   1. Identify and categorize SH personal data in transit,


    +   2. Perform analysis and describe the main risks to privacy and security,


    +   3. Identify and implement mitigating measures to reduce risk, and


    +   4. Develop a strategy for SH information management.


    Diagnostic testing could reveal vulnerabilities to improve the trustworthiness
    of the SH systems. When testing an IVA system, it is important to understand where
    data is generated and where it flows. For example, the malfunctions occur occur
    during place by operating IVA-related services directly. Through the process of
    direct operation, we understand how the entire ecosystem of IVA is constructed.
    It roughly selects potential attack points out of the entire ecosystem where cyberattacks
    are likely to take place. Potential attack points can be hardware level, software
    level, network level, cloud level, and so on. Empirical experiments and fuzz testing
    (i.e., software testing that involves invalid, unexpected, or random data as inputs)
    are also effective to show vulnerabilities at each possible attack point (Yu et
    al., 2020). Through experimentation, it distinguishes a traditional attack from
    a completely new type of attack. This can help improve the reliability of IVAs
    in the future.


    # 6.2.3 PHYSICAL SECURITY


    Data privacy and protection is clearly an important aspect to a SH but will not
    prevent a traditional home invasion. Thus, SHs just like a traditional home still
    need physical security – but it can be smaller than the average motion sensor
    that alerts the owner with the captured video of a squirrel running across your
    path. For example, the traditional door chime and motion sensor to secure the
    physical security in a home can be transformed with IoT. Maybe we can determine
    exactly is at the door with a video doorbell camera, for example. When someone
    presses the doorbell, the app on the smartphone alerts you to check who visited
    the home remotely.'
