    # 7.2.4 DELIVERY MODE


    Education can be delivered in one of three broad-based modes: to face, remote,
    or hybrid. The findings from the SLR we indicate that the selected students were
    almost equally distributed between the face-to-face setting and the online setting.
    IoT has been discussed in all of these three modes: https://bit.ly/2Xu0Ym.


    # 7.3 WHAT ARE THE CHALLENGES OF INCORPORATING IoT IN EDUCATION?


    When specifying the functionality for IoT education applications, attention is
    often focused on concerns such as fitness of purpose, Big Data, interoperability,
    and so on. Conventional requirement elicitations techniques such as Quality Function
    Deployment (QFD), Joint Application Development (JAD), and domain analysis among
    others (Lapl, 2017) are usually adequate for these types of requirements. But
    in IoT applications for education, specific quality requirements are probably
    of greater concern. We identified three major qualities from the extracted scenarios
    that may pose a challenge for IoT in education: security, scalability, and humanization.
    We explore these three qualities further in this section.


    # 7.3.1 SECURITY


    Security requirements have always been a crucial aspect of education. Given the
    increased communication and complexity of IoT technology, there is an increase
    in security-related concerns (Georgescu & Popescu, 2015). Out of the selected
    studies,'
