- pgno: 207
  md: '# IoT Requirements and Architecture 191


    At this stage, architecture driver #1 is satisfied (and as a side effect so is
    architecture driver #3), we next consider architectural drivers 4–6 related to
    the performance quality attribute of the HAMS. There are two design concerns related
    to these drivers:


    +   * Resource Demand: The arrival of change of property value events from the
    various sensor/actuator devices and the evaluation of automation rules in response
    to these events are a source of resource demand

    * Resource Management: The demand on resources may have to manage the latency
    of event and alarm propagation


    To address these concerns, we move the responsibility of evaluation and execution,
    respectively, to a separate Logic & Reaction (L&R) component and an alarm component.
    These components running outside the server can now be easily moved to dedicated
    nodes if necessary. In doing so, we are making use of the increased availability
    resources to address the resource management concern and the reduced computational
    overhead tactic to address the resource demand concern.


    We use an additional tactic to address the resource management concern. This tactic
    relies on introducing “concurrency” to reduce delays in processing time. Concurrency
    is used inside the L&R and alarm components to perform simultaneous


    We assign the following responsibilities to the L&R and alarm components:


    +   * Evaluate and execute automation rules

    * Send alarm automation commands


    Besides, we assign the following responsibility to the alarm component:


    +   * Generate alarm notifications


    The results of applying these tactics are shown in Figure 12.2.

    We finally consider architectural driver 2 related to international language support
    for the HAMS. There are two design concerns for this driver:


    +   * Localize Changes: This relates to changing the user interface to deal with
    a new language and culture

    * Prevention of Ripple Effects: This relates to minimizing the number of modules
    affected as a result of changing the user interface


    We address these concerns using the following modify tactics to address localize
    changes and prevention of ripple effects design concerns:


    +   * Anticipation of Expected Changes: Changes to the user interface (UI) are
    localized to the presentation component

    * Intermediary: The presentation component acts as an intermediary-preventing
    ripple effects from changes to the UI from propagating to the rest of the application.'
  merge: -1
