- pgno: 196
  md: 'to Spink and Moyer (2011), “Food fraud is a collective term used to encompass
    the deliberate and intentional substitution, tampering, or misrepresentation of
    food, food ingredients, or food packaging; or false or misleading statements made
    about a product, for economic gain”.


    Market globalization reduces food traceability facilitating fraud. Consequently,
    food safety can be increased through higher traceability. To identify and address
    food frauds, it is essential to trace and authenticate the food supply chain to
    understand provenance and ensure food quality compliance with international standards
    and national legislation.


    Food traceability can be defined as “the ability to follow the movement of a food
    and food stage(s) of production, processing and distribution”, as defined by the
    International Organization for Standardization in ISO 22005:2007 – a specific
    standard for traceability in the food feed chain. Additionally, a traceability
    system is based on product labeling and contains both quantitative and qualitative
    information about the final product and its provenance.


    In this context, a distributed ledger technology such as blockchain provides a
    complete and immutable audit trail of transaction for all stages of the food supply
    chain, allowing for transparency and verifiable and immutable records in form
    of digital certificates.


    The immutability of data enables the technology to be considered for regulated
    industries such as agri-food.


    A decentralized application, or DApp (Marchesi, Marchesi & Tonelli, 2020), can
    be used for enabling food traceability. A decentralized application is a computer
    application that runs on a distributed system on a network of nodes, with no node
    acting as supervisor. In the blockchain P2P network, a DApp is stored and executed
    on the blockchain to be decentralized, transparent, deterministic, and redundant.
    DApp is developed by writing Smart Contracts and may have a user interface that
    allows users and devices to interact with it.


    Based on various definitions of traceability systems, the main purposes of a food
    traceability system are the following:


    +   * To document transparently and irreversibly any event relevant to production;

    * To allow authorities, laboratories, and certified experts to asertain the production,
    giving proof of their identity and their certifications;

    * To integrate manual registrations and automatic registrations, made by Internet
    of Things (IoT) devices that are increasingly widespread;

    * To keep track of the quantities produced, so that these cannot be increased
    by introducing products of noncertified origin;

    * To give evidence of all stages of production to the authorities responsible
    for verifying the specifications;

    * To allow retailers and end consumers to learn about the history of the products
    purchased, from the field to the purchased product, using an app.


    Traditional approaches for food traceability systems are usually inefficient.
    Blockchain is a promising technology that is tamper-proof and decentralized, and
    self-executing and self-verifying Smart Contracts can conduct transactions between
    mutually untrusted parties.'
