    # 6.6.3 SIMULATIONS/MODELING


    Context information (i.e., temperature, humidity, sound) and user modeling and
    adaptation are pervasive part of SH. Thus, effective user modeling is critical.
    The system must take into account users'' cognitive level and physical disabilities.
    A user model focuses on extracting a user''s cognitive activity rather than movement
    is effective (Vlachostorgiev, 2016).


    SH simulation helped to improve the SH design to meet the needs of the residents
    with minimal investment. Using agent modeling, SHs can adapt to the owner''s needs
    (Visaneleanu & Bennovici, 2018). Testing and determining the most effective SH
    configuration of the IoT sensors and actuators will meet the personal- needs of
    residents.


    # 6.7 CONSTRUCTING AN IoT HOME DEVICE


    Often, life can be challenging. We are constantly working, taking care of ourselves,
    family, and learning new things. However, sometimes everyday tasks can get in
    the way of what we need to do, but they don''t always have too. This section will
    explain SH devices that are easy to build and help someone easily grasp the concept
    of IoT: a smart garden and smart trash can.


    # 6.7.1 SMART GARDEN


    Watering plants can be a burden and is easy to forget. A smart garden uses a simple
    program to monitor and care for a plant. While it seems like a minor convenience,
    it is really more than that. The smart garden is a symbol of the infinite possibilities
    that the IoT provides.


    The smart garden, Figure 6.2, is a device that demonstrates how a computer program
    can automatically grow a plant. The raspberry pi, a credit card computer, is used
    in the device to allow a software application to collect and act on the plant
    data. Using a sensor, the application measures the plant levels and distributes
    the correct amount of water to the plant based of the data – a true IoT device.
    The application is able to do this infinitely as long as water is accessible.'
