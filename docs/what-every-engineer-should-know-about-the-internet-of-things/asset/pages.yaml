    For example, in July 2000, the Higher Education Information Security Council (HEISC)
    was established. The HEISC provides guidance and support about information security
    governance, compliance, and data protection and privacy to higher education institutions.
    To help a better understanding of the nuance of information security issues in
    higher education, the HEISC drilled into the topic of information security and
    identified their top three strategic information security issues for 2016 (Grama
    & Vogel, 2016). "Planning for implementing next-generation security technologies"
    with increasing concerns of the IoT is one of the three strategic issues.


    # 7.3.2 SCALABILITY


    By embedding sensors into field environments as well as terminal devices, an IoT
    network can collect rich sensor data that reflect the real-time environment conditions
    of the front field and the events/activities that are going on. Advanced data
    mining technologies can be applied to explore in-depth business insights from'
