    # 7.5 DISCUSSION


    Looking at all the extracted studies on IoT in education, we find that 21% of
    the overall studies provided actual implementation for IoT systems which were
    tested in actual educational settings. We provide through a link (https://bit.ly)
    a summary of these implemented systems along with information on how these were
    tested in practice and the testing results.


    We further analyzed these systems and extracted the below list of the most implemented
    scenarios we can integrate IoT in education:


    +   * Smart environment for supporting learning and improving the quality of education

    * eLearning and education management

    * Virtual learning, teaching, and management

    * Remote laboratories and distant elaboratories

    * Human motion capture

    * Ubiquitous learning, distance eTeaching, and eLearning

    * Augmented reality learning

    * Wireless robotic educational platform

    * Cybersecurity laboratory

    * Attendance system based on IoT

    * Psychological health education service based on IoT


    On the other hand, this literature review demonstrated that there are significant
    research gaps related to IoT education and its derivatives (such as cyber-physical
    systems). These gaps are driven by the large number and ever-evolving technologies,'
  merge: -1
  img_proc: true
