    in the cloud. Whenever the movement data analysis concludes that a fall has occurred,
    the fall detection service automatically notifies the smart emergency service.


    Observe that alternative designs could be planned, with the fall monitoring service
    implemented and deployed at the elderly''s home. Attention should be paid to the
    latency needed to conduct the acquired data until processing center in the cloud
    (performance). Moreover, problems relating to safety and quality of service may
    arise since missing connection could prevent the data from being processed, preventing
    the emergency service to be called, and the domestic accident could become fatal.
    Here, architectural alternatives could be exploited so that the resulting system
    meets each type of stakeholder''s requirements and needs. For instance, a fog
    node serving multiple houses in a city region might acquire, model, and preprocess
    elderlies movement data. Then, it might automatically send this preprocessed data
    to a fall detection service resident in the cloud.


    Back to the smart emergency service notification, it sends an ambulance to the
    house where a fall took place. Throughout its route, the ambulance is monitored
    by smart traffic lights around the city, measuring and analyzing traffic data
    (e.g., drivers'' speed) as it collects. As any traffic accident notification should
    be on time for the ambulance''s staff, the traffic lights themselves may make
    decisions to reorganize routes whenever it is necessary. The collected data can
    be sent to the cloud later on for more long-term and in-depth analyses, e.g.,
    for planning purposes.


    The smart public health system runs in the cloud. It collects and analyzes information
    from other healthcare institutions in the city to decide which hospital the emergency
    team must drive. Once again, smart traffic lights help the ambulance to reach
    the hospital.


    Finally, the patient''s emergency contacts are communicated by a private service
    running at the hospital infrastructure. During the hospitalization period, the
    patient''s vital signs are sent by a wireless body sensor network that sends them
    to a vital sign analyzer running at the hospital''s private cloud. Whenever the
    analysis of vital signs indicates the patient''s health condition degradation,
    service notifies health professionals'' smartphones in charge.


    From this discussion and merging Figures 3.1 and 3.2, we can observe that IoT
    and smart cities converge, in a domestic environment or the public spaces, the
    IoT sensing layer is the frontier that connects the smart city to the public (or
    domestic) environment. In parallel, modeling and reasoning layers are the IoT
    components that support the services implementations, and the interoperability
    between the systems that compose a smart city. From a layered architectural perspective,
    it is evident that an ideal smart city system should understand the capability
    differences and perform data management accordingly with effectiveness and efficiency.


    Since we acquired a big picture of how IoT and technologies have intersections,
    we can now discuss the challenges of becoming smart cities a widespread reality.
    The following section brings which discussion.'
