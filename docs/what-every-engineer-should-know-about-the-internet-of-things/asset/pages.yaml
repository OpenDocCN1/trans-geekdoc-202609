  md: '# 8 What Every Engineer Should Know About IoT


    and best practices. We recommend an approach to development of IoT systems that
    encompasses the following activities:


    +   1. Mission identification

    2. Goal identification

    3. Stakeholder analysis

    4. Standards identification

    5. Requirements writing/agreement/verification/validation

    6. Design

    7. Construction

    8. Testing


    Mission identification involves clearly defining the overall intent of the system,
    the application domain or domains in which it is operating, and the appropriate
    governing entities. From the mission statement, the high-level goals can be identified.
    From these goals, the mission statement, and application domain identification,
    a set of stakeholders (direct users, indirect users, people and systems impacted,
    etc.) can be identified. Relevant stakeholders for any system include manufacturers,
    owners, and users of IoT-enabled artifacts in the system consideration and which
    could possibly interact with it. Identifying the stakeholders permits analysis
    of their concerns and sources of possible interactions. Then approaches to eliminate
    or mitigate these unwanted interactions can be undertaken.


    Next, all standards governing the application domain and the devices and systems
    used to be identified. Any applicable laws, regulations, standards, etc., e.g.,
    those concerning wireless communications, need to be identified. All of these
    steps are preparation for the development of a comprehensive System Requirements
    Specification (SRS), which is discussed in detail at Chapter 12.


    Design of the system follows, ideally using structured approach that is somewhat
    unique for IoT systems (identifying the IoT elements and primitives). Chapter
