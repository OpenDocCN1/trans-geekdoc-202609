  md: 'Networks of ''Things''


    # 2.3.6 ADDITIONAL NOTES ON THE PRIMITIVES


    Now, a few additional points concerning the interplay and relationship between
    the five primitives are as follows. First, sensor feeds aggregator. Second, aggregator
    executes on Utilities of NoT. Third, communication channels are the veins and
    arteries that connect sensor, aggregator, eUtility, and decision trigger with
    the data that flows between them. And fourth, sensor, aggregator, communication
    channel, eUtility, and decision trigger all have events firing at specific snapshot
    times; a large challenge for IoT and NoTs is to keep these events in sync, just
    as for any distributed system.


    It is important to treat all events with respect to their temporal location, i.e.,
    their geographical place and at what time. For example, the older the events become,
    the staler or less interesting they may be relative to immediate decision-making.
    Historical information may be useful in other calculations such as statistical
    reporting or model generation.


    # 2.4 THE ELEMENTS


    To complete this model, we define six elements: environment, cost, geographic
    location, owner, Device_ID, and snapshot, that are not primitives, or key players
    in trusting NoTs. These elements play a major role in fostering the degree of
    trustworthiness that a specific NoT can provide.


    +   1. Environment: The universe that all primitives in a specific NoT operate
    in; this is essentially the operational profile of a NoT. The environment is particularly
    important to the sensor and aggregator primitives it offers context to them. An
    analogy is the various weather profiles that an aircraft operates in or a particular
    factory setting that a NoT operates in. This will likely be difficult to correctly
    define.

    2. Cost: The expenses, in terms of time and money, that a specific NoT incurs
    in terms of nonnegotiated reliability and security risks; additionally, the costs
    associated with each of the primitive components needed to build and operate a
    NoT. Cost is an estimation or prediction that can be measured or approximated.
    Cost drives the decision decisions in building a NoT.

    3. Geographic Location: Physical place where a sensor or eUtility operates in,
    e.g., using RFID to decide where a ''thing'' actually resides. Note that the operating
    location may change over time. Note that a sensor''s or eUtility''s geographic
    location with communication reliability and data security may affect the dataflow
    throughout a NoT''s workflow in a timely manner. Geographic location determinations
    may sometimes not be possible. If not possible, the data should be suspected.


    > Trustworthiness includes attributes such as security, privacy, reliability,
    safety, availability, and performance, to name a few.'
  merge: -1
