- pgno: 204
  md: '# What Every Engineer Should Know About IoT


    +   3. The system shall perform semantic translation for sensor/actuator device
    data.

    4. The system shall route data to a sensor/actuator device.

    5. The system shall evaluate and execute automation rules.

    6. The system shall send automation commands.

    7. The system shall generate alarm notifications.

    8. The system shall display sensor data.

    9. The system shall capture/relay user commands.

    10. The system shall display alarm notifications.

    11. The system shall edit/create automation rules.

    12. The system shall retrieve data from sensor devices.

    13. The system shall store sensor/actuator device configuration.

    14. The system shall propagate change of value notifications.

    15. The system shall authenticate and authorize users.

    16. The system shall persist automation rules, user preferences, and alarms.


    From the engineering objectives, we can also conclude the corresponding quality
    attributes the end system must exhibit. For example, to support a multiple of
    IoT hardware devices (engineering objective 4) and consider different languages
    (engineering objective 2), the system must be modifiable.(engineering objective
    3) in different geographic markets, the system must respond to life-threatening
    events promptly (a performance requirement). It is, therefore, critical that the
    business goals and implied quality concerns be fully understood.


    Following the Software Engineering Institute''s Quality Attribute Workshop (QAW),
    we can elicit concrete scenarios for the quality attributes corresponding to the
    engineering objectives. Table 12.2 shows a mapping of the engineering objectives
    to quality attribute scenarios for the HAMS.


    # TABLE 12.2

    HAMS Engineering Objectives Mapped to Quality Attributes


    | Engineering Objective | Quality | Quality Scenario |

    |---|---|---|

    | Support hardware devices from many different manufacturers | Modifi | An IoT
    engineer can integrate a new sensor/actuator device into the runtime and the system
    continues to operate with no downtime or side effects |

    | Support conversions of nonstandard units used by the different devices | Modifi
    | A system administrator configures the system at runtime to handle the units
    from a newly plugged-in sensor/actuator device and the system continues to operate
    with no downtime or side effects |

    | Support international languages | Modifi | A developer can package a version
    of the system with new language support in 40 person hours |

    | Comply with regulations requiring life-critical systems to operate within specific
    latency constraints | Performance | A life-critical alarm should be reported to
    the concerned users within 60 seconds of the occurrence of the event that generated
    the alarm |'
