  md: 'As a matter of consensus, the Internet of Things (IoT) is the technical backbone
    intended to underpin smart cities (Alampalli & Pardo, 2014). Under perspective,
    a smart city connects a network of interconnected physical objects so-called “things”,
    i.e., various physical components that embed some portion of the software, including
    electronics, sensors, actuators, microcontroller, or a microprocessor-based device,
    embedded computing, and Radio Frequency Identification (RFID)-based devices. Things
    can transmit and receive data over the smart city network infrastructure to collect
    information from the environment, control other devices, exchange and process
    data, or interact with a user.


    Given that first glance, we can deepen the IoT theoretical basis that supports
    smart cities and explore the possible synergies that can emerge from combining
    these topics to establish the forthcoming vision of what we know as cities.


    This chapter involves offering a comprehensive background on smart cities besides
    how IoT is a critical topic in that domain. In the next section, we provide a
    motivational example that will guide our discussion for achieving that goal.


    # 3.2 MOTIVATIONAL EXAMPLE


    Our motivational example comprises a smart home. Smart homes (or smart houses)
    are important components of smart cities and materialize an ideal scenario to
    explain how IoT and smart systems, are tightly intertwined. In our example, the
    smart home is owned by an older adult, who demands a sort of specific services.
    That house consists of a domestic environment monitored by sensors to provide
    elderly people with fall detection and notification service. Falls are a fairly
    important topic, being one of the main reasons that leads to injuries and deaths
    of older adults (Burns, Stevens & Lee, 2016). As such, smart home environment
    has been equipped with IoT technologies to monitor and detect falls and notify
    smart emergency services accessible by citizens in a (Chaudhuri, Thompson & Demir,
    2014; Gutierrez-Madñal et al., 2019).


    In our scenario, an elderly person can be monitored by wearable and nonwearable
    devices. Device used in their everyday life, such as smartphones and smartwatches
    (Maudlin et al., 2018). Conversely, when the person is in the bathroom, nonwearable
    devices such as conversational agents, depth cameras (e.g., Kinect), and Doppler
    radar can monitor to instantaneously detect a fall (Anishchenko, Zhurav & Chizh,
    2019). Although a small percentage of falls occurs in the bathroom, they are at
    least twice as likely to result in an injury as in other in-home places (Mulley,
    2001; Stevens, Mahoney & Ehrenreich, 2014). Moreover, most of those falls are
    not detected, once people take off the wearable devices, for example.


    Regardless of what happens, when a fall is detected, the smart home environment
    should notify emergency services that health professionals could assist the elderly,
    sending an ambulance and removing him/her as soon as possible. The smart home
    system then notifies an emergency service. The emergency service sends an ambulance
    that communicates with the smart traffic monitoring system to find the shortest
    and fastest path until the elderly’s route. Meanwhile, the traffic monitoring
    system monitors the ambulance’s route in response to likely traffic problems.
    The ambulance reaches the destination, the older adult is then removed.'
