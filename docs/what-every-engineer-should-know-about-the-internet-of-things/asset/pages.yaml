  md: '# Smart Homes


    encryption. Liu, Chen, and Huang (2019) proposed such a system – a searchable
    information retrieval of smart home data.


    Typically, sensitive data is safeguarded with authentication methods. Authentication
    into the SH is a dominant theme researchers as privacy is a challenging quality
    requirement to integrate into a SH system. Research in this is at an early stage;
    thus, there are many recently proposed options. One authentication process proposed
    is access control mechanisms based on symmetric key cryptography. This provides
    secure access to IoT devices and stakeholders (Braeken et al., 2016). Other authentication
    schemes were proposed by Alshahrani and Traoire (2019) and Raniyal (2018). Alshahrani
    and Traoire (2019) proposed and validated design of an authentication scheme with
    dynamic/temporary identities and cumulative Keyedhash chain using various known
    attacks (i.e., eavesdropping, impersonation, man-in-the-middle, session key guessing).
    Raniyal et al. (2018) proposed two passphrase-protected device-to-device mutual
    authentication scheme.


    In addition to data, another weak/vulnerability in SH are the smart appliances.
    Every added device adds a new way to access. In other words, remote access of
    devices such as smart appliances is highly desirable for SH system but come with
    a security risk. A more secure two-factor anonymous authentication was proposed
    in Shuai (2019). Others proposed encryption schemes for lightweight remote user
    authentication in the SH environment (Naoui, Elhdhili & Saidane, 2019). The goal
    of these authentication schemes is to know who is accessing the SH devices.


    Along those same, an intrusion detection system (IDS) was proposed for nefarious
    hackers. The idea is that the IDS is shared between the devices on the home network.
    This distributed IDS aggregated data from the devices that is analyzed by an expert
    system using an anomaly-based data analysis (Gajweski et al., 2019). Other researchers
    provided architectures or frameworks focusing on security and privacy in an SH
    design:


    +   - SHSec-based architecture is a design to secure and manage the SH network.
    This is a middleware to ensure the interoperability of SH devices. It also includes
    threat prevention and mitigation of network security attacks (Sharma et al., 2019).

    - An architecture to be able to control the home system the same way set-top boxes
    are to stream multimedia was presented by Batalla and Gonciarz (2019). The home
    system is isolated from the Internet enabling secure communication from the homeowner
    to the SH.

    - A Bluetooth, keyless door lock is proposed with an informal architecture (Dabbadeh
    et al., 2017). Bluetooth technology is more cost-efficient than radio frequency
    (RFID) and near-field communication (NFC) solutions. The system uses user detection,
    verification, request processing, and emergency actions.

    - A SH security framework providing an integrity system to prevent security attacks
    and promotes data integrity using self-signing and access control (Kang, Moon
    & Park, 2017).'
