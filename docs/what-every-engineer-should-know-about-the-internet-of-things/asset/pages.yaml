    # 2.3.1 PRIMITIVE #1: Sensor


    A sensor is an electronic utility that measures physical properties such as temperature,
    acceleration, weight, sound, location, presence, and identity. All sensors employ
    mechanical, electrical, chemical, optical, or other effects at an interface to
    a controlled process or environment. Basic properties, assumptions, recommendations,
    and general statements about sensor include the following:


    +   - Sensors are physical; some may have an Internet access capability.

    - Sensor output data: in our writings, $s_1 \to d_1$ means produced a piece of
    data that is numbered 1. Likewise, $s_2 \to d_2$ means sensor 2 has produced a
    piece of data that is numbered 2. $(d_1, d_2, d_3, ... d_4$ will be literally
    data). Analog sensors such as microphones and voters are counterexamples.

    - Sensor may also transmit device information, such as via Radio Frequency Identification
    (RFID).^3$

    - Sensors may have identity or the identity of the ''thing'' to which they are
    attached.

    - Sensors may have little or no software functionality and computing power; more
    advanced sensors may have software functionality and computing power.

    - Sensors may be heterogeneous, from different manufacturers, and collect data,
    with varying levels of data integrity.

    - Sensors may be associated with fixed geographic locations or may be mobile.

    - Sensors may provide surveillance. Cameras and microphones are sensors.

    - Sensors may have an owner(s) who will have control of the data sensors, who
    is allowed to access it, and when.

    - Sensors will have pedigree — geographic locations of origin and manufacturers.
    Pedigree may be cheap, disposable, and susceptible to wear over time.

    - There may be differences in sensor security, safety, and reliability, e.g.,
    between consumer grade, military grade, and industrial grade.

    - Sensors may return no data, totally flawed data, partially flawed data, or correct
    and acceptable data. Sensors may fail completely or intermittently. They may lose
    sensitivity or calibration.


    > ^3 RFID is an identification method that detects and remotely retrieves data
    via a RFID tag or transponder. A RFID programmer encodes information into a thin
    microchip within a RFID inlay. In supply chain applications, these inlays are
    typically embedded in a tag that looks similar to pressure sensitive labels. RFID
    inlays can be applied to a variety of NoTs, RFID technology offers security and
    reliability features that enhance trustworthiness in IoT ecosystems.'
