- pgno: 77
  md: '# Smart Cities – Security


    +   * Cyber Patrol Bots: Capture data on the overall state of the system, including
    end-point devices and connectivity traffic.

    * Security and Privacy Labels: Security and privacy labels for huge systems as
    well as single IoT products that make up a smart city should be provided with
    detailed descriptions of cybersecurity risks.

    * Education: Make available education programs to cultivate talent and skilled
    cybersecurity experts (Kitchin & Dodge, 2019).


    # 5.5.1 CYBERSECURITY RISK MANAGEMENT


    Urban planners and smart city governments to proactively seek ways to make their
    cities'' infrastructures safe from potential threats. This can be done by managing
    the security needs of the smart city at multiple levels as explained earlier.
    It is also necessary to analyze the security threats of the smart city components
    and establish protection measures for each layer according the multilevel measures
    described above.


    A smart city should consider a plan of action using the National Institute of
    Standards and Technology (NIST) Cybersecurity Framework to improve the management
    of cybersecurity risk in order to prioritize and align cybersecurity activities
    with city risk tolerance and requirements. The framework provides detailed guidance
    to help develop a cybersecurity profile in order to prioritize and align cybersecurity
    activities with city risk tolerance.


    Furthermore, smart city designs needs to meet legal requirements as outlined in
    the ‘Personal Information Protection Act’ (which governs how organizations are
    allowed to collect, and use personal information in the commercial business space
    – Canada) and the ‘Geolocation Privacy and Surveillance Act’ (establishes a framework/guidelines
    for agencies, entities, and cities to know how and when geolocation information
    can be utilized and accessed – USA). All services must be designed and developed
    by considering the information protection requirements.


    # 5.5.2 CYBER PATROL BOT


    Just as police patrol monitor dangerous/vulnerable areas, it is necessary to monitor
    smart technology to prevent and detect attacks. A bot is needed to automatically
    detect and patrol abnormalities through data-generating devices and sensors in
    the smart city operation. Cyber patrol captures data on the overall state of the
    system, including endpoint devices and connectivity traffic. This data is then
    analyzed to detect possible security vulnerabilities or potential system threats.
    Once detected, a broad range of attacks are formulated in the context of an overall
    security policy that should be executed, such as quarantining devices based on
    behavior anomalies.


    The solution has several limitations. The cyber patrol bot will be effective in
    situations where various systems are interoperable. Thus, in order to implement
    this solution in the real world, it will only be possible for uniform systems.
    Moreover, it can be difficult to be interoperable with state-of-the-art systems
    for legacy systems such as the traffic management systems that can be somewhat
    antiquated.'
  merge: -1
  img_proc: true
- pgno: 78
  md: '# 5.5.3 SECURITY AND PRIVACY LABEL


    Most consumer products are labeled with a description of the product for safety
    reasons. On groceries, the ingredients and processing plant information/location
    are provided to the consumer. Food nutrition labels were developed to decrease
    obesity and mitigate medical conditions such as severe allergies and diabetes
    who need food carbohydrate and sugar information to dose medication.


    Similar to this concept, a label for IoT devices, sensors, and systems that makes
    up a smart city be provided with detailed descriptions of the security and privacy
    risks. The concept of labeling a single product was proposed by Emami-Naeini et
    al. (2020). In a smart city, security and privacy labels for huge systems as well
    as single IoT products should be delivered to the administrator in the form of
    step-by-step instructions or notification.


    Specifically, to summarize the information to be included on a label:


    +   * Security mechanisms

    * Security update dates (e.g., update available January 1, 2021)

    * Access control passwords

    * Data practices:

    * Sensor data collection (e.g., text, video, audio)

    * Data stored on the device or edge/cloud that is shared.


    # 5.5.4 NURTURING TALENTED CYBERSECURITY PERSONNEL


    For the security of smart cities, an education program that can cultivate the
    best talent should be established. When developing a smart city project, local
    governments will face the workforce issues familiar to everyone in the private
    sector: shortage of talent/workforce with greater cybersecurity skills. This only
    increases the security concerns inherent in these projects. To make cities safer,
    countries and cities need to cooperate with schools and institutes to create new
    workforces and systematically reeducate existing workforces. A complete CPS/IoT
    curriculum requires a skill set from existing engineering and computer science
    programs. To begin with, it is recommended to start with IoT/CPS elective courses
    in these major academic programs or at the very least, add CPS/IoT concepts to
    existing courses in those programs (DeFranco, Kassab & Voas, 2018). More on this
    topic is included in the IoT education chapter of this book.


    # 5.6 CONCLUSION


    The smart cities are being built and expanded. Therefore, we must be vigilant
