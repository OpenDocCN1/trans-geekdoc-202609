    # 6.8 CONCLUSION


    In this chapter, we defined the SH research, categorized and identified the SH
    research areas, and presented key findings in each category. Several improvement
    areas emerged from the studies analyzed such as improved user experience, human
    interaction with SH systems, and integration of wellness/healthcare devices. On
    the security side, research is needed in detecting multipersion activity patterns
    and keeping ahead of new security threats. Therefore, threat-detecting technologies
    need to improve to reduce false positives and to prevent new security risks and
    increase privacy. Besides, future SH designs should take advantage of more flexible,
    accurate, and ubiquitous UOLD methods – also facilitating improvement in SH security.
    In summary, given the research presented, great strides have been made in SH development
    – but there is always room to enhance, improve, and innovate, especially with
    security and privacy.'
