  md: '# Networks of ''Things''


    # 2.5. Environment


    As NotS are likely to rely on factors from outside native environmental boundaries
    (., sensor readings from a NoT''s surrounding external environment, whatever that
    environment may be), it is equally logical to assume that some form of actuation
    may be in place to effect or at least influence that external environment as a
    result of a Not Action. it is feasible that a Utility may be more than a software-driven
    virtual entity is so strongly implied but could also be a cyber-physical or purely
    mechanical actuator (eg. control hydraulics on an aircraft) that extends an action
    to influence a NoT environment as possibly influencing the internal workings of
    the NoT itself. This raises the larger question of how a NoT and its environment
    interact, not only at the element level which is addressed but also, more significantly,
    at the NotT''s operating level.


    # 2.6 Reliability and Security primitive scenarios


    The elements lay out contextual issues related to trustworthiness of a specific
    NoT. The primitives are the building blocks of NotS. Because trustworthiness is
    such a broad concept, this document has mainly focused on two "ities” related
    to the five primitives: security and reliability. People often ask for simple
    examples of real or hypothetical use cases relating these “ities” to each primitive.
    The following are examples of simple, hypothetical reliability and security scenarios
    associated with each primitive.


    Sensor Reliability: A modern car''s speed sensor is exposed to heat, water, and
    dust (environment). Years later, it starts providing inconsistent readings due
    to occurring fatigue that induces sensor drift. This is an example of malfunctions
    caused by environmental conditions.


