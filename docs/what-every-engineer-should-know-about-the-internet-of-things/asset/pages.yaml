  md: '# Networks of ''Things''1


    # 2.1 INTRODUCTION


    This chapter contains an essential National Institute of Standards and Technology
    (NIST) standard (SP 800-183) that describes the building blocks of IoT (Voas,
    2016). A standard is a document that provides the definitions needed for technologies
    to be built and worked together seamlessly. NIST is an organization with a central
    mission of promoting innovation and industrial competitiveness. Founded in 1901,
    NIST is a nonregulatory federal agency within the U.S. Department of Commerce.
    NIST innovations are based on measurement science, standards, and technology to
    enhance economic security and improve our quality of life.


    The five primitives belonging to the Internet of Things (IoT) systems, and to
    most distributed systems, heterogeneity concerns, formalisms, reasoning, simulations,
    reliability and security risk trade-offs to be formulated and argued. These primitives
    apply well to systems with large amounts of data, scalability concerns, temporal
    concerns, and elements of unknown pedigree with nefarious intent. These primitives
    are the basic blocks for networks of ''things'' (IoT), including the IoT. This
    offers an underlying and foundational understanding of IoT based on the realization
    that IoT involves sensing, computing, communication, and actuation. The material
    presented is generic to all distributed systems that employ IoT technologies (i.e.,
    ''things'' and networks).


    # 2.2 NETWORKS OF ''THINGS''


    From agriculture, to manufacturing, to smart homes, to healthcare, and beyond,
    there is value in having numerous sensory devices connected to larger infrastructures.
    This technology advance acknowledges the reality that human society is moving
    towards ''smart'' and ''smarter'' systems. The rapid changes in computer science,
    software engineering, systems engineering, networking, sensing, communication,
    and artificial intelligence (AI) are converging. The tethering factor is data.


    There is no formal, analytic, or even descriptive set of the building blocks that
    govern the operation, trustworthiness, and life cycle of IoT. A composability
    model and vocabulary that defines principles common to most, if not networks of
    things, is needed to address the question: “what is the science, if any, understanding
    IoT?” NIST SP 800-183 offers an underlying and foundational science to IoT based
    on a belief that IoT involves sensing, computing, communication, and actuation.


    Two acronyms will be used in this chapter, IoT and NoT, extensively and interchangeably
    – the relationship between NoT and IoT is subtle. IoT is an instantiation of a
    NoT, more specifically, IoT has its ''things'' tethered to the Internet. An different


