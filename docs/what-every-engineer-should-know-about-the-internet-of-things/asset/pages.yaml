- pgno: 104
  md: '# 88 What Every Engineer Should Know About IoT


    with perception when interacting with the IoT technologies when deployed in the
    education field: instructor, IoT, student, and staff.


    As for the instructor, IoT can help manage attendance of a class and availability
    required equipment/devices for each student (Alotaibi, 2015; Jiang, 2016; Borges
    et al., 2011; Qi & Shen, 2011; Gul et al., 2017). "Installing RFID reader at the
    entrance of school gate, library, cafeteria, dormitory and teaching building,
    and other places to identify students'' electronic tags, it can obtain the students''
    activities trajectory" (Jiang, 2016). Besides, with IoT, an instructor may initiate
    and manage class session with voice/face/gesture commands (Fuse, Ozawa & Miura,
    2012; He & Zhuang, 2016; Zhu, 2016), communicate with remote students at different
    locations (Sari, et al., 2016; Shereijini, 2016), and collect immediate feedback
    from students in terms of interests in an activity or lesson and sensor.


    Analytics could be run on the sensor data to evaluate performance, interest, and
    participation of each student and provide a summary to the instructor (ElElyany
    & AlKhairi, 2015; Haian & Chang 2012; Ueda & Ikeda, 2016; Richert et al., 2016).
    IoT can help the instructor to identify the identity of students (Wang, 2015;
    Zhu, 2016; Tan et al., 2014); it can also help the instructor to identify and
    help students with special needs (Sula et al., 2014; Lenz et al., 2016).


    From a student perspective, IoT will help to communicate with classmates (local
    or remote; Yin et al., 2012), share project data, discuss and access learning
    resources (e.g., remote labs; Fernández de, et al., 2015; Lamri et al., 2014;
    Bistäk, 2014; De La Torre, Sánchez & Sarmiento, 2016; García et al., 2013; Chunxia,
    2015; Kane et al., 2013; Tune et al., 2015). Also, IoT could provide support to
    students with adapted learning resources by integrating content that is based
    on location, time, date, student-to-student interaction, knowledge level, etc.
    (Sula et al., 2013, 2014; Haas & Vaaklizadian, 2013; Peña-Ríos et al., 2012; Jeong
    & Chong, 2015; Murphy et al., 2015; Lenz et al., 2016; Chen et al., 2011; Ma &
    Li, 2013; Goetz, Huerte & Hernandez, 2016).


    From a staff perspective, IoT will play a designated role in elements as tracking
    (Peena-Ríos et al., 2012; Xue et al., 2011). For example, an IoT scenario is reported
    in Wang (2014) on monitoring and maintaining psychological health for students.
    Another reported contribution is the potential assistance for staff members in
    managing and tracking fixed and portable resources (Han, 2011; Catã, 2015). “Using
    a noise sensor, one classroom can communicate automatically to a neighbor classroom
    and inform them if the noise level exceeds a certain level. A warning message
    could be displayed on the LCD screen in the noisy room” (Catã, 2015). For the
    public equipment (e.g., portable projectors, laboratory equipment, sports equipment),
    these can be marked with a tag to be tracked by the Radio Frequency Identification
    (RFID) technology (Bin, 2012). The collected data from tracking equipment can
    be further utilized to automatically calculate patterns and find inefficiencies
    (Li & Li, 2014). IoT can also assist staff in managing events (e.g., registration
    events (Tan et al., 2014), sports events (Ma & Li, 2013)) and in managing the
    general safety and security (Fuse, Ozawa & Miura, 2012; ElElyany & AlKhairi, 2015;
    Catã, 2015). In addition, it can also play a role in institutional energy management
    (Cisco, 2013; Catã, 2015).


