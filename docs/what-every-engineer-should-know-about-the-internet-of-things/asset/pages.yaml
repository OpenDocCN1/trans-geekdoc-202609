    # 1.6 IoT DEVELOPMENT APPROACH


    IoT system development requires a comprehensive and reliable approach that encompasses
    the development processes (e.g., requirements engineering, design, construction,
    and testing), the people involved in the development (i.e., qualification through
    certification and licensure), and the use of appropriately certified tools. Application
    governance entities set the standards for the appropriate qualifications, certifications,
    and standards involved in the development of these systems. For example, in the
    United States, there are governing agencies for avionics (the Federal Aviation
    Administration), medical devices (Federal Drug Administration), and for transportation
    of vehicles and infrastructure (Department of Transportation), to just name a
    few. For other types of systems, other governing bodies, professional organizations,
    and standards boards help to ensure process discipline.


    Whether an IoT system is a critical one developed under the discipline of an appropriate
    regulating or guiding agency or an informal one with no particular rules, it is
    imperative that the system be built with a structured, disciplined approach. Using
    such process discipline can also promote standardization, reuse, interoperability,'
