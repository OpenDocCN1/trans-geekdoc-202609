    Complex systems are those with many independent and interdependent components,
    which interact in nonlinear ways (behavior cannot be expressed as the direct conjunction
    of the activity of individual components) and have interdependencies that are
    difficult to describe, predict, and design (Alpampi & Pardo, 2014). The IoT includes
    many physical objects (e.g., sensors and actuators) that interact autonomously
    and heavily depend on their capabilities, such as state, processing, and memory
    (Khanna & Kaur, 2020). Both smart cities and IoT-based systems are composed of
    several communicating systems that form large networks that can be hard to manage,
    which characterizes a complex system.


    Second, every IoT may demand a tremendous amount of infrastructure (e.g., sensing
    resources) to ease a smart city’s deployment (Shen et al., 2013). Highly interrelated
    with IoT, the cloud computing paradigm has already shown that consuming resources
    as a service (platform, infrastructure, or software) is highly efficient, scalable,
    and easy to use. This is an emerging but already recurrent paradigm as a service,
    with functionalities (e.g., sensing and analytics) that are offered to be invoked
    by other systems and applications via well-defined interfaces (Tanna, Kumar &
    Karthika, 2017). This can be clearly observed in Figure 3.1, where the emergency
    service is available via the elderly’s smart home environment and the emergency
    service.


    Third, both cities are spatially structured, they have geographical coverage and
    can be spread along a region, forming alliances, as the network formed by the
    smart hospital, the emergency service, and the ambulance.


    Regarding the temporal dimension, the IoT infrastructure in a smart city may manage
    many parallel and concurrent events due to the vast number of interactions. In
    smart cities, real-time data processing is crucial when a system must be notified
    immediately after a significant event occurs, such as the interaction between
    the smart home environment and the emergency service. In both, space and time
    rule the different types of events taking place in every IoT use case, such as
    smart cities (Arroyo & Bulcão-Neto, 2019).


    Moreover, IoT and smart cities provide intelligent services, i.e., could use AI
    Analytics to process the volume of data that forms a Big Data structure. In that
