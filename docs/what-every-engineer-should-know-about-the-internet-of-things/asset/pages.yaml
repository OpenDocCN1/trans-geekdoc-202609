    The IoT community has been stimulated with the COVID-19 outbreak to conceive solutions
    to combat the pandemic. IoT protocols (e.g., Bluetooth Low Energy (BLE), Near-Field
    Communications (NFC), Radio Frequency Identification (RFID), global positioning
    system (GPS), and Wi-Fi) are receiving great attention for providing solutions
    spanning the spectrum from a biosensor capable of detecting the SARS-CoV-2 virus
    in the air (Qiu et al., 2020) to the rapidly emerging digital surveillance technologies
    to track individuals and crowds. A digital surveillance for an individual relies
    on unique identifiers that are either temporarily (RFID tags) or permanently assigned
    to a person like identifiers, or to a sample individual''s locations, either on
    short or long temporal scales for authorities to keep track of the citizens or
    residents.


    At the most general level, surveillance of humans can be defined as “regard and
    attention to others (whether a person, group, or an aggregate with a national
    census) or factors presumed to be associated with this. A central feature gathering
    some form of data connectable to individuals (whether uniquely identified or as
    a member of a category)” (Marx, 2015).


    Our review identified 64 digital tracking measures deployed in 38 countries (see:
    https://bit.ly/2Zpmhg). The textual analysis of publications on “Digital Tracking
    for COVID” shows that two classes of technologies have been utilized to establish
    digital tracking:


    +   i. Mobile technologies (e.g., tracking bracelets, cameras with thermal sensors,
    drones), and

    ii. Mobile technologies (e.g., smartphones with inbuilt location sensors, contact-tracing
    mobile-based applications).


    Despite the avalanche of emerging surveillance technologies to combat the pandemic,
    there is still a little knowledge of how these could affect society. How widely
    the contact-tracing mobile applications are being used? What type of data will
    they collect, and how will data be saved? Whom is it shared with? And are there
    policies in place to prevent abuse?


    # 9.3.2.1 Digital Tracking with Mobile Technologies


