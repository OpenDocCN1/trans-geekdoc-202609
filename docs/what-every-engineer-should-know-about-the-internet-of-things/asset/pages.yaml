    Communication Security: A wearable activity tracker is attached to a person''s
    wrist and measures heart rate and blood pressure. It communicates via Bluetooth
    Low Energy (BLE) with the smartphone and forwards the data to a physician. Despite
    the fact that BLE takes specific actions to randomize the MAC address of the devices,
