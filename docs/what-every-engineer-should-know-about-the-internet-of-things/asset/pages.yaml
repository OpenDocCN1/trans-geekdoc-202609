  md: '# IoT Trust Concerns


    The term “Internet of Things” (IoT) is a metaphor that was coined by Kevin Ashton
    in 1999 (Ashton, 2009) although he prefers the phrase “Internet for things” (BBC,
    2016). IoT is an acronym of three letters: (I), (o), and (T). The (o) matters
    little, as already mentioned, might be better replaced by ‘for’. The Internet
    (I) existed long before the IoT acronym was coined, and so is the ‘things’ (T)
    that makes IoT different from previous IT systems and computing approaches. ‘Things’
    are what make IoT unique. Many people question whether IoT is just marketing hype
    or there is a science behind it. It''s a fair question to ask about any new, unproven
    technology.


    The acronym IoT currently has no universally accepted and actionable definition.
    Others have been made. Few examples include:


    +   - The Internet of Things generally refers to scenarios where network connectivity
    and computing capability extends to objects, sensors and everyday items not normally
    considered computers, allowing these devices to generate, exchange and consume
    data with minimal human intervention. Internet of Things (IoT): An Overview, Karen
    Rose, al. The Internet Society, 2015. p. 5.


    +   - Although there is no single definition for the Internet of Things, competing
    visions agree that it relates to the physical world with the virtual world – with
    any object having the potential to connect to the Internet via short-range wireless
    technologies, such as radio frequency identification (RFID), near field communication
    (NFC), or wireless sensor networks (WSNs). The merging of the physical and virtual
    worlds is intended to increase instrumentation, tracking, and measurement of both
    natural and social processes. “Algorithmic Discrimination: Big Data Analytics
    and the Future of the Internet”, Jennifer Winter. In: The Future Internet: Alternatives.
    Jennifer Winter and Ryota Ono, ed. Springer, December 2015. p. 127.


    +   - The concept of Internet of Things (IoT)... is that every object in the infrastructure
    is interconnected into a global expanding network. “An efficient user authentication
    and key agreement scheme for heterogeneous sensor network tailored for the Internet
    of Things environment”, Mohammad Sabzinejad Farasha, et al. Ad Hoc Networks 36(1),
    January 2016.


    Instead of an official definition of IoT in 2016, NIST published a document titled
    “Networks of Things” (SP 800-183 and Chapter 2 of this book) to partially address
    the difficulty of having an accepted definition (NIST, 2016). Five primitives
    were presented that can be visualized as Lego-like building blocks for any network
    of ‘things’. The primitives are the (T).


    Recall that the primitives are (1) sensors (a physical utility that measures physical
    properties), (2) aggregators (software that transforms data into smaller data),
    (3) communication channels (data transmission utilities that allow ‘things’ to
    communicate with ‘things’), (4) eUtilities (software or hardware components that
    perform computation), and a (5) decision trigger (an algorithm and implementation
    that'
  merge: -1
  img_proc: true
- pgno: 156
  md: 'satisfies the purpose of a network of ''things'' by creating the final output).
    Note that any proposed network of ''things'' may not include all five. For example,
    a network of ''things'' can exist without sensors. And not that having a model
    of the components of a network of ''things'' is not a definition of IoT.


    Before leaving the problem of having no universally accepted and acceptable definition
    for IoT, it should be stated that IoT is increasingly associated with artificial
    intelligence (AI), automation and ''smart'' objects. So, is "IoT" any you can
    attach the adjective "smart" to, e.g., smartphone, smart car, smart appliance,
    toy smart home, smart watch, smart grid, smart city, smart tv, smart suitcase,
    smart clothes? No answer is offered here, but it is something to consider, the
    overuse of the adjective ''smart'' adds confusion to what IoT is about.


    Now consider the question: what is meant by ''trust''? No formal definition is
    suggested in this publication but a variation on the classical definition of reliability.
    Here, trust is the probability that the intended behavior and the actual behavior
    are equivalent, given a context, fixed environment, and fixed point in time. Trust
    should be viewed as a level of confidence. For example, cars have a trusted set
    of behaviors when operating on a roadway cannot be expected when the car is sunken
    in a lake. This informal trust definition works well when discussing ''things''
    and networks of ''things''.


    The value of knowing intended behaviors can be dismissed when attempting to establish
    trust. Lack of access to a specification for intended behaviors is a trust concern.
    If there is little difficulty giving ''things'' to other ''things'', that only
    addresses a network of ''things'' architecture and is one of determining trust.
    Correct architecture does not ensure that the actual behavior of the ''things''
    will exhibit the intended behavior. Hardware and software components may not work
    well when integrated, depending on whether they were the right components to be
    selected, whether they had the proper levels of ''ilities'', such as security
    and reliability built-in, and whether the architecture and specification for the
    composition was correct.


    The Internet (I) is rarely associated with the term ''trust'' or ''trustable''.
    Identity theft, false information, the dark web, breakdown in personal privacy,
    and other negative features of (I) have caused some people to avoid the Internet
    altogether. But for most, avoidance is not an option. Similar trust concerns occur
    for (T) because ''things'' carry their own trust and the interactions between
    ''things'' can exacerbate these concerns. From a trust standpoint, the Internet
    should be viewed as untrustworthy backbone with untrustworthy things attached–
    that becomes a perfect storm. Here, there are three categories of IoT trust that
    must be addressed: (1) trust in a ''thing''; (2) trust in a network of ''things'';
    and (3) the environment and context that the network will operate in and context,
    and at a specific point in time.


    Understanding what IoT is and what trust means is the first step in confidently
    relying on IoT. IoT is a complex, distributed system with temporal constraints.
    This publication highlights 17 technical concerns that should be considered and
    after deploying IoT systems. This set has been derived from the six trustworthiness
    elements presented in NIST SP 800-183 (the six are reprinted in Section 10.22).'
