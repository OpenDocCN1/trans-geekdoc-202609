- pgno: 160
  md: 'Public clouds are important for implementing the economic benefits of IoT.
    Public clouds are black-box services. Public clouds are a commodity where vendors
    rely on service-level agreements for legal protection from security problems and
    other forms of inferior service form offerings. Integrators and adopters have
    few protections here. Further, what properties associated with trust can integrators
    and adopters test for public clouds?


    There are examples of where an organization might be able to test for some trust
    in a public cloud: (1) performance (i.e., latency time to retrieve data and the
    computational time to execute a software app or algorithm) and (2) data leakage.
    Performance is a more straightforward measure to assess using traditional testing
    approaches. Data leakage is harder but not impossible. By storing data, if leaked,
    it is easy to detect, i.e., credit card information, a bank can quickly notify
    a card owner when an illegitimate transaction was noted. Note, tests that do not
    result in the observation of leakage prove that a cloud is not leaking since testing
    guarantees complete observability and is not exhaustive. This is no different
    than the traditional software testing problem where ten passing tests (meaning
    that no failures were observed) do not guarantee that the eleventh test will be
    successful.


    In summary, concerns related to loss of ownership and control are often human,
    legal, and contractual. Technical recommendations cannot fully address these.
    It should be mentioned, that these concerns can be enumerated (e.g., misuse or
    abuse cases) and evaluated during risk assessments and risk mitigation in the
    design and specification phases of a network of ‘things’, And this risk assessment
    and mitigation may, and possibly should, continue throughout operation and deployment.


    # 10.7 COMPOSABILITY, INTEROPERABILITY, INTEGRATION, AND COMPATIBILITY


    Hardware and software components may not work well when composed, depending on
    whether (1) the “right” components are selected, (2) the components have the proper
    security and reliability built-in (as well as other quality attributes), and (3)
    the architecture and specification of the system that will be incorporated into
    was.


    Note there is a subtle difference between composability, interoperability, integration,
    and compatibility. Composability addresses the issue of subsystems and components
    and the degree to which a subsystem or component can be swapped in or out to satisfy
    a system’s requirements. Interoperability occurs at the interface level, meaning
    that when interfaces interact, two distinct subsystems can communicate via a communication
    format without needing knowledge concerning the functionality of the subsystems.
    Integration is a process of often bringing disparate subsystems into a new system.
    And compatibility means that two subsystems can exist or work in conjunction without
    conflict.


    Integration, interoperability, compatibility, and each impact IoT trust in a slightly
    different manner for networks of ‘things’, and each ‘thing’ should be evaluated
    before adoption into a system for each of these four properties.'
