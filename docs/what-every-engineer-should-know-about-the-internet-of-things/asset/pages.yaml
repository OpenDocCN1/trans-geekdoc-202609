  md: '# 11 Blockchain Technologies and IoT¹


    # 11.1 INTRODUCTION


    According to Hileman and Rauchs (2017) "A blockchain is a special data structure
    that is composed of transactions, batched into blocks, that are cryptographically
    linked to each other to form a sequential, tamper-evident chain that determines
    the ordering of transactions in the system. In this context, a transaction represents
    any change or modification to the database". More broadly, a blockchain is a peer-to-peer
    (P2P) distributed network of independent participants that generally broadcast
    all data to each other, each of whom have different motivations and objectives.
    They may not necessarily trust one another but reach a consensus (a consistent
    agreement about the state of the shared database) on a linear history of operations
    of that shared database. A high-level workflow of blockchain is presented in Figure
    11.1.


    The key advantages of blockchain (compared to existing distributed systems and
    database technologies) are the use of a specialized data structure that bundles
    transactions into blocks and the broadcast of all data to all participants. Some
    of the main components of a blockchain are cryptography, P2P networks, consensus
    mechanisms, the ledger, validity rules, and access or permission types.


    ![](img/41fdf2aa71adfa568d36836737f447e6_187_0.png)


    FIGURE 11.1 Blockchain technology.


    ¹This chapter was contributed by Giuseppe Defesani, Ludovica Marchesi, Michele
    Marchesi, Marco Ortu, Roberto Tonelli.


    DOI: 10.1201/9781003027799-11'
