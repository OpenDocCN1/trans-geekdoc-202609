    # 3.3 BACKGROUND


    A smart city is a complex network of several independent and interoperating systems.
    Smart cities use ICTs, IoT, and other means to improve life quality and efficiency
    of urban operations and services while ensuring it meets the needs of present
    and future generations with respect to economic, social, and environmental (sustainability)
    aspects (ITU-T, 2014).


    Standards for smart cities and their different components, including smart grids,
    the IoT, eHealth, and intelligent transportation systems (ITS), have been developed.
    A specific example of such a standard is ISO 37120 (ISO, 2014), which defines
    100 city performance indicators, 64 core and 54 supporting, some of which include
    economy, education, energy, and environment. IoT can play an important role in
    smart cities by enabling the collection of some of indicators. For instance, sensors
    collect environmental or energy data, such as humidity and air quality, or the
    energy expenditure in a neighborhood. Components of a smart city include smart
    infrastructure, smart buildings, smart transportation, smart energy, smart healthcare,
    smart technology, smart governance, smart education, and smart citizens (Mohanty,
    Choppali & Kougianos, 2016; Manzano, Graciano Neto & Nakagawa, 2020).


    A smart city is actually formed by a high diversity of smart components and systems.
    Smart houses, smart traffic control systems, and autonomous cars are other examples
    of systems that are part of the smart cities. They are networked together and
    need to operate at a certain level to make the city work. By "certain level" we
    mean that not all the systems directly operate. For instance, smart buildings
    and smart traffic control systems do not have many reasons to operate, while,
    in parallel, a traffic control system and autonomous cars certainly should be
    able to convert.


    As shown in Figure 3.1, a smart city is structured on many levels. In general,
    these levels are materialized by geographic coverage. At the bottom level, we
    have isolated systems. These systems are private properties, such as smart houses,
    smart buildings, autonomous cars, and smart hospitals. In the next level, we find
    the first level of interoperability that, in general, directly links the private
    systems to other external systems, such as the smart home from our motivational
    example that is linked to a public emergency service. Actually, multiple systems
    within a smart home environment can be linked to systems externally, as wearable
    devices linked to emergency services and electrical devices linked to'
