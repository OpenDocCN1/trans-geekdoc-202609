  \n# 第 5 章\n\n# Scipy 及其应用\n\n***注意：* \\[Q: 问题编号 和 Ans: 答案\\]**\n\n### Q1: 解释 Scipy\
  \ 库。\n\n*答：* Scipy 用于科学计算。它是组件的集合，为科学计算提供了生态系统。\n\n**数据与计算：**\n\n*   `pandas`，提供易用性和极高性能的数据处理\n\
  *   `SymPy`，用于符号数学和计算机代数。\n*   `scikit-image` 用于图像处理。\n*   `scikit-learn` 用于机器学习。\n\
  *   `h5py` 和 `PyTables` 均可访问存储在 HDF5 格式中的数据。\n\n### Q2: 解释如何执行正态性检验。\n\n*答：* 正态性检验是以高斯分布形式检验数据分布的检验。\n\
  \n每种检验对输入和输出都有以下假设：\n\n**输入假设：**\n\n*   每个样本中的观测值是独立同分布的。\n\n**输出假设：**\n\n*   H0：样本服从高斯分布\n\
  *   H1：样本不服从高斯分布\n\n其中包含三种类型的检验。\n\n所有三种类型均作为 scipy 的一部分受支持。\n\n```\nimport scipy.stats\
  \ as ss\n\n#### Shapiro-Wilk 检验\nstat, p = ss.shapiro(data)\n\n#### D’Agostino’s\
  \ K² 检验\nstat, p = ss.normaltest(data)\n\n#### Anderson-Darling 检验\nresult = ss.anderson(data)\n\
  ```\n\n**结论：** 如果计算出的 p 值 < alpha，我们可以得出拒绝原假设的结论，否则无法拒绝。\n\n### Q3: 解释如何执行相关性检验？\n\
  \n*答：* **皮尔逊相关系数**\n\n检验两个数据集之间是否存在线性关系。\n\n**输入假设：**\n\n所有这些均针对观测值：\n\n*   它们是独立同分布的\n\
  *   它们服从正态分布\n*   它们具有相同的方差\n\n**输出假设：**\n\n*   H0：两个样本相互独立。\n*   H1：两个样本存在依赖关系。\n\
  \n```\nimport scipy.stats\ncorr, p = scipy.stats.pearsonr(data1, data2)\n```\n\n\
  根据 corr 和 p 的值，我们可以判断两列之间是否存在关系。\n\n**斯皮尔曼等级相关和肯德尔等级相关。**\n\n两者具有相同的输入和输出假设。\n\n\
  检验数据集之间是否存在单调关系。\n\n**输入假设：**\n\n所有假设均针对观测值：\n\n*   它们是独立同分布的\n*   它们可以被排序\n\n**输出假设：**\n\
  \n*   H0：两个样本相互独立\n*   H1：样本之间存在依赖关系\n\n**斯皮尔曼等级相关**\n\n```\nimport scipy.stats\n\
  corr, p = scipy.stats.spearmanr(data1, data2)\n```\n\n**肯德尔等级相关**\n\n```\nimport\
  \ scipy.stats\ncorr, p = scipy.stats.kendalltau(data1, data2)\n```\n\n根据 corr 和\
  \ p 的值，我们可以判断两列之间是否存在关系。\n\n**卡方检验**\n\n检验两个分类变量之间的独立性：\n\n**输入假设：**\n\n*   观测值相互独立。\n\
  *   就列联表而言，每个单元格需要 25 个或更多样本。\n\n**输出假设：**\n\n*   H0：两个样本相互独立。\n*   H1：样本之间存在依赖关系。\n\
  \n```\nimport scipy.stats\nstat, p, dof, expected = scipy.stats.chi2_contingency(table)\n\
  ```\n\n### Q4: 解释参数统计假设检验相关的检验。\n\n*答：* 数据比较通过以下检验进行：\n\n**学生 t 检验**\n\n\n\n\n####\
  \ 统计假设检验\n\n##### 独立样本 Student's t 检验\n\n它检验两个独立样本的均值是否存在显著差异。\n\n#### 输入假设\n\n\
  所有假设均针对观测值。\n\n*   它们是独立同分布的。\n*   它们服从正态分布。\n*   它们具有相同的方差。\n\n#### 输出假设\n\n* \
  \  H0：样本的均值相等\n*   H1：样本的均值不相等\n\n```python\nimport scipy.stats as ss\n\nstat, p\
  \ = ss.ttest_ind(data1, data2)\n```\n\n##### 配对样本 Student's t 检验\n\n检验两个配对样本的均值之间是否存在显著差异。\n\
  \n#### 输入假设\n\n*   每个样本中的观测值是独立同分布的\n*   每个样本中的观测值服从正态分布\n*   每个样本中的观测值具有相同的方差\n\
  *   各样本之间的观测值是配对的\n\n#### 输出假设\n\n*   H0：样本的均值相等\n*   H1：样本的均值不相等\n\n```python\n\
  import scipy.stats\n\nstat, p = scipy.stats.ttest_rel(data1, data2)\n```\n\n#####\
  \ 方差分析检验 (ANOVA)\n\n它检验两个或多个独立样本的均值是否存在显著差异。\n\n#### 输入假设\n\n所有假设均针对观测值：\n\n*  \
  \ 它们是独立同分布的。\n*   它们服从正态分布。\n*   它们具有相同的方差。\n\n#### 输出假设\n\n*   H0：样本的均值相等。\n* \
  \  H1：一个或多个样本的均值不相等。\n\n```python\nimport scipy.stats\n\nstat, p = scipy.stats.f_oneway(data1,\
  \ data2, ...)\n```\n\n---\n\n### Q5：解释如何进行非参数统计假设检验。\n\n**答：** Mann-Whitney U 检验：\n\
  \n它检验两个独立样本是否相等。\n\n#### 输入假设\n\n所有假设均针对观测值：\n\n*   它们是独立同分布的。\n*   它们可以被排序。\n\n\
  #### 输出假设\n\n*   H0：两个样本的分布相等。\n*   H1：两个样本的分布不相等。\n\n```python\nimport scipy.stats\n\
  \nstat, p = scipy.stats.mannwhitneyu(data1, data2)\n```\n\n---\n\n### Q6：如何在 Python\
