  \ 'log10', 'log1p', 'log2', 'modf', 'nan', 'pi', 'pow', 'radians', 'sin', 'sinh',\
  \ 'sqrt', 'tan', 'tanh', 'tau', 'trunc']\n```\n\n### Q63: 解释 Python 中的异常处理。\n\n\
  **答：** 异常处理借助 `try...except` 块支持。\n\n任何可能逻辑上导致问题的语句都会放在 `try` 块中。\n\n如果发生异常，相应的处理会在\
  \ `except` 块中完成。\n\n一个 `try` 可以包含多个 `except` 块。\n\n![Image](img/39.jpg)\n\n在上述示例中，我们将接受用户输入并将其类型转换为\
  \ `int` 的代码放在 `try` 块中。我们有两个 `except` 块：一个捕获特定异常，另一个捕获通用 `Exception`。根据引发的异常，相应的\
  \ `except` 块会被调用。\n\n要打印异常的完整详细信息，我们使用别名，即 `except Exception as e:` 为异常创建一个别名。\n\
  \n如果没有发生异常，将执行 `else` 块。\n\n### Q64: 如何创建用户自定义异常？\n\n**答：** Python 支持用户自定义异常。\n\n\
