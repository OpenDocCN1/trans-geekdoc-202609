  4.  假设：温度在上升。\n5.  分析上述数据集的数据。\n\n    ![分析图表](img/2.jpg)\n\n6.  拟合模型。\n7.  假设被接受或拒绝。\n\
  \n### Q2: 请解释变量及不同类型的变量？\n\n\n\n\n\n# 统计学基础概念问答\n\n#### Q1: 什么是变量？\n\n**Ans:** 任何持续变化的事物都称为变量。变量有不同类型，主要包括以下几种：\n\
  \n**因变量/结果变量:** 受影响的变量，例如上例中的年温度。\n\n**自变量/预测变量:** 影响结果的变量，例如上例中的森林砍伐、污染等。\n\n####\
  \ Q2: 解释分类测量？\n\n**Ans:** 分类测量包含类别，即不同的实体。地球生命分类的例子包括植物、动物等。\n\n#### Q3: 解释二元变量？\n\
  \n**Ans:** 二元变量是指只有两个类别的变量，如生或死、男或女、开或关。\n\n#### Q4: 解释名义测量？\n\n**Ans:** 名义测量包含两个以上的类别。这些类别也可以是数字。\n\
  \n#### Q5: 解释有序变量？\n\n**Ans:** 这些是具有逻辑顺序的名义变量。例子包括板球或足球中的队伍排名、参加年级考试的学生成绩单。\n\n\
  #### Q6: 解释连续变量？\n\n**Ans:** 这些变量可以在测量尺度上取任意值，例如声音的音调，它可以在范围内取任何可能的值。\n\n#### Q7:\
  \ 解释离散变量？\n\n**Ans:** 这些变量在范围内只能取固定值。例如，银行里的客户数量。\n\n#### Q8: 是否可以将连续值转换为离散值，反之亦然？\n\
  \n**Ans:** 是的，根据研究目的，可以将离散值转换为连续值，反之亦然。例如，水箱中的水位可以在范围内取任意值，因此是连续变量。\n\n但我们可以将其近似为三个不同的水平，如空、满或半满，这现在就变成了离散性质。\n\
  \n#### Q9: 什么是区间变量？\n\n**Ans:** 这些是按区间分组的变量。例如年龄可以划分为 10-20、20-30 等范围，特定年龄的人会被放入上述组别之一。当区间相等时，它们代表被测量属性的等量差异。\n\
  \n#### Q10: 什么是比率变量？\n\n**Ans:** 这是区间变量的一个子类型，用比率尺度进行测量。\n\n例如化学中水的表示是 `H₂O`，代表两个氢分子和一个氧分子。因此，元素的比率是\
  \ 2:1。\n\n#### Q11: 什么是单变量和双变量？\n\n**Ans:** **单变量:** 当考虑的变量只有一个时，称为单变量研究。\n\n**双变量:**\
  \ 涉及两个变量之间关系的研究。\n\n#### Q12: 什么是测量误差？\n\n**Ans:** 以数字形式表示的测量值与实际值之间的差异称为测量误差。\n\
  \n例如：从商贩处按公斤购买水果时，如果我们想要 1 公斤水果，商贩的秤显示 1 公斤。但如果在另一台机器上检查，测量值比预期少 0.1 公斤，这个差异就是我们所说的测量误差。\n\
  \n#### Q13: 解释效度？\n\n**Ans:** 效度意味着一种工具是否测量了它应该测量的内容。\n\n#### Q14: 解释信度？\n\n**Ans:**\
  \ 信度意味着仪器在不同条件下是否给出一致的结果。\n\n例如，如果我们在同一实体上用同一数值测试两次，如果仪器要可靠，则结果应保持不变。这种测试称为重测信度。\n\
  \n#### Q15: 检验假设有哪些不同方法？\n\n**Ans:** 检验假设主要有两种方法：\n\n1.  **相关研究**\n    *   也称为横截面研究\n\
  \    *   通过观察自然模式或发生来进行检验\n    *   原始发生不被操纵\n\n2.  **实验研究**\n    *   选择感兴趣的变量\n\
  \    *   操纵环境的某些方面\n    *   观察对选定变量的影响\n\n#### Q16: 解释不同类型的变异？\n\n**Ans:** 变异主要有两种类型，说明如下：\n\
  \n**系统变异:**\n*   由实验者引入\n*   参与者在不同条件下接受测试，条件差异由实验者引入\n\n例如：为测试羊毛衣物使用与温度的关系，我们可以让一组\
  \ 20 人分别在炎热和寒冷的气候下测试。因此，此处引入的差异仅在于温度。\n\n**非系统变异:**\n*   由实验条件之间存在的随机因素引入\n*   例如：为测试羊毛衣物使用与温度的关系，我们测试一组\
  \ 20 人。选定组中有些人可能因疾病等因素表现出与预期不同的行为。\n\n#### Q17: 解释重复测量设计？\n\n**Ans:** 在同一组参与者身上，在不同条件下测量同一指标。\n\
  \n两种条件的差异可能由以下原因引起：\n*   对参与者实施的操纵/变化\n*   可能影响参与者从一次表现到下一次表现方式的因素\n\n#### Q18:\
  \ 什么是独立设计？\n\n**Ans:** 在不同参与者组上，在不同条件下测量同一指标。\n\n两种条件之间的差异可能由以下原因引起：\n*   对参与者实施的操纵/变化\n\
  *   每种情况下参与者本质或特征的差异\n\n#### Q19: 解释随机化在变异方面的作用？\n\n**Ans:** 通过使用随机化，我们可以确保引入的任何变异是由于条件/变量的变化，而不是过程中的其他意外变化。因此，它有助于消除其他系统变异来源。\n\
  \n#### Q20: 解释各种汇总度量？\n\n**Ans:** **众数:** 表示数据集中出现频率最高的值/分数。\n\n例如：足球运动员进球数按球衣号码统计如下：\n\
  \n1, 2, 2, 3, 4, 1, 1, 1, 1, 1, 1\n\n若整理成表格：\n\n![](img/3.jpg)\n\n上例中众数为 1，频率最高为\
  \ 7。这可以从直方图轻松确定，如下截图所示：\n\n![](img/4.jpg)\n\n**中位数:** 将值/分数按升序排列后得到的中间值。如果中间值有两个数字，则取其平均值：\n\
  \n**例如：**\n\n2, 3, 4, 5, 6 的中位数是 4。\n\n2, 3, 4, 5 的中位数是 3 和 4 的平均值，即 3.5。\n\n中位数受异常值影响最小。\n\
  \n**平均数:** 表示数学平均值，即所有元素之和除以元素个数。\n\n例如，板球比赛中击球手的平均击球率是各场比赛击球率的平均值。\n\n**分数范围:**\
  \ 范围内最大值与最小值之差称为分数范围。这表示离散程度。\n\n**截尾平均数:** 表示去除两端极端情况（即最小端和最大端）后的平均值。最小值和最大值可能代表不正常的值，即异常值。因此，在计算截尾平均数时，我们指定从两端忽略的值的百分比。因此，截尾平均数能更好地代表排除异常值后的数据。\n\
  \n**四分位距 (IQR)**\n\n\n\n\n\n## 变异性度量：四分位数与四分位距\n\n它是一种变异性度量，基于将数据集划分为四分位数。\n\n四分位数是将排序后的数据分成四等份的三个值：\n\
  \n*   **Q1** 是有序数据集前半部分的*中间*值\n*   **Q2** 是数据集的*中位数*值\n*   **Q3** 是有序数据集后半部分的*中间*值\n\
  \n四分位距（IQR）等于 **Q3 减去 Q1**。\n\n下四分位数是数据下半部分的中位数。\n\n上四分位数是数据上半部分的中位数。\n\n##### 平均绝对偏差\n\
  \n**平均绝对偏差：** 表示偏离平均值的绝对值的平均数。\n\n**中位数平均绝对偏差：** 由偏离中位数的绝对值表示。\n\n##### 异常值\n\n\
  **异常值：** 表示不正常或超出范围的值，因此是在采集时损坏的数据或由于其他原因导致的数据。由于它在计算平均值和其他汇总值时会产生影响，因此需要妥善处理这类数据。\n\
  \n---\n\n#### 统计假设检验\n\n#### Q22: 解释备择假设与原假设\n\n**备择假设：**\n\n*   也称为实验假设\n*   记为\
  \ `H[1]`\n*   假设预测的效应会存在于结论中\n\n**原假设：**\n\n*   记为 `H[0]`\n*   假设预测的效应不会存在于结论中\n\
  *   因此，这代表了备择假设的对立面\n\n#### Q23: 什么是 P 值？\n\n它衡量支持原假设的证据强度。如果该值小于显著性水平，则接受原假设，否则拒绝。\n\
  \n导致研究者接受原假设的值的范围称为**接受域**。\n\n除接受域以外的区域称为**拒绝域**。\n\n#### Q24: 当原假设被拒绝时会发生什么？\n\
  \n当原假设被拒绝时，会发生**第一类错误（Type 1 error）**。第一类错误发生的概率称为**显著性水平**。\n\n#### Q25: 解释单向假设与非单向假设\n\
  \n**单向假设：**\n\n*   指出所研究的效应会正向还是负向增长\n*   通常使用**单尾检验**\n\n**非单向假设：**\n\n*   不指示所研究的效应会正向还是负向增长\n\
  *   通常使用**双尾检验**\n\n#### Q26: 解释模型拟合度\n\n它表示确定的统计模型代表数据的程度。\n\n模型拟合度可以表示为**欠拟合**、**过拟合**或**完美拟合**。\n\
  \n一个拟合度好的模型，其计算值与测量值之间的方差较低。\n\n#### Q27: 样本与总体的关系是什么？\n\n样本是原始数据或总体的子集或一部分。如果总体非常大，对整个总体进行分析并不容易。因此，会取总体数据的一个子集，称为样本数据。\n\
  \n样本数据是否真实代表原始数据集，可通过**估计**、**置信区间**等来确定。\n\n![图示](img/5.jpg)\n\n#### Q28: 什么是估计？\n\
  \n通过使用样本提供的信息，我们可以对总体进行推断，这就是所谓的估计。使用的参数包括均值、标准差等。\n\n#### Q29: 解释偏差分数\n\n它被定义为实际分数/值与平均值之间的差异。\n\
  \n#### Q30: 解释方差\n\n方差是平均值与测量值之间的平均误差。\n\n它指示计算出的平均值与观测值之间的差异。\n\n它表明组内不同个体彼此差异或变化的程度。\n\
  \n总体方差公式：\n\n```\nPV = Σ (Xi - X)² / N\n```\n\n*   `PV` 是总体方差\n*   `X` 是总体均值\n*\
  \   `Xi` 是总体中的第 `i` 个元素\n*   `N` 是总体中的元素数量\n\n样本方差公式：\n\n```\nSV = Σ (xi – x)² /\
  \ (n – 1)\n```\n\n*   `SV` 是样本方差\n*   `x` 是样本均值\n*   `xi` 是样本中的第 `i` 个元素\n*   `n`\
  \ 是样本中的元素数量\n\n#### Q31: 解释标准差\n\n方差的平方根也称为标准差。\n\n这样做是为了保持测量单位与原始数据一致。\n\n它们表示测量点相对于平均值的接近程度。\n\
  \n标准差越小，数据越接近平均值，反之亦然。\n\n#### Q32: 解释标准误\n\n标准误指示样本代表原始总体的程度。当我们将原始总体分解为各个小样本时，我们想知道所考虑的样本与原始总体之间的差异。这由标准误表示。\n\
  \n标准误越小，越接近或越真实地代表原始总体。\n\n```\nSE = Σ (sample mean – overall population mean)²\
  \ / (number of samples)\n```\n\n#### Q33: 什么是精度？\n\n它指不同样本估计值之间的接近程度。因此表示与标准误相反的含义，并与标准误成反比。\n\
  \n#### Q34: 解释置信区间\n\n它指示均值将落在其中的边界。\n\n它是一个构建的分数范围，使得总体均值将落在其中。\n\n它们是构建的界限，使得在一定百分比的时间内，总体均值的真实值将落在此范围内。\n\
  \n#### Q35: 解释置信水平\n\n指所有可能样本中包含真实总体参数的样本所占的百分比。\n\n#### Q36: 解释 Alpha\n\nAlpha\
  \ 定义为 `1 - 置信区间`。这意味着真实值落在置信区间之外的概率。如果置信区间是 99%，则 Alpha 为 `1 - 99% = 0.01`。\n\n\
  #### Q37: 解释 Beta\n\n犯**第二类错误（Type 2 error）**的概率称为 Beta。第二类错误是指被拒绝的原假设被接受。避免第二类错误的概率称为**检验效能**。\n\
  \n#### Q38: 解释准确度\n\n它指示样本值或参数与总体统计量匹配的程度。如果样本和总体的均值完全相等，则可以说样本完全准确。如果不完全相等，则可以说样本准确到\
  \ `n` 限度，其中 `n` 是样本与总体之间的差异。\n\n#### Q39: 解释偏倚\n\n偏倚指示样本的估计相对于总体数据是过拟合还是欠拟合。例如，如果总体均值为\
  \ 4 而计算出的样本均值为 3，则这是**低估偏倚**。此类样本参数与总体参数不相等的估计称为**有偏估计**。\n\n#### Q40: 什么是中心极限定理？\n\
  \n它指出：如果样本量足够大，任何独立随机变量的均值分布都可以近似为正态分布。\n\n通常，样本量 **30 或 40 以上** 作为参考标准。\n\n这使我们无需获取成百上千个分布，即可将较大样本近似为正态分布。\n\
  \n标准正态分布更受青睐，因为其均值等于 0，方差等于 1。\n\n![图示](img/6.jpg)\n\n#### Q41: 解释绝对值\n\n绝对值是无论其初始符号如何的正值或大小。\n\
  \n\n\n\n\n#### Q42: 什么是自由度？\n\n**答：** 它等于样本中独立观测值的数量减去待估计的总体参数数量。\n\n#### Q43: 解释聚类抽样。\n\
  \n**答：** 在这种方法中，要形成的聚类或分组的数量是预先决定的（通常用 `N` 表示），源自总体数据。\n\n![](img/7.jpg)\n\n每个聚类中的元素数量是已知的，且总体数据中的每个元素都被分配到一个聚类中。例如，可以根据客户所在州等属性进行聚类。\n\
  \n抽样可进一步分类为：\n\n*   **单阶段抽样：** 选定聚类内的所有元素均包含在样本中。\n*   **两阶段抽样：** 从选定聚类内的元素中随机选择一个子集。\n\
  \n#### Q44: 解释相关系数？\n\n**答：** 相关性表示两个变量之间的关系。\n\n*   因此，变量可以是正相关的，此时一个变量的正向变化会对另一个变量产生正向影响。\n\
  *   如果变量是负相关的，一个变量的正向变化会对另一个变量产生负向影响。\n*   上述公式为：\n\n    `Correlation co-efficient\
  \ = Σ(xy) / sqrt[(Σx²) * (Σy²)]`，其中 `x` 和 `y` 为考察的变量。\n\n*   相关系数的取值范围为 -1 到 +1。\n\
  \n#### Q45: 解释样本空间。\n\n**答：** 任何统计实验的结果均用样本空间表示。来自该空间的任一结果称为样本点。一个或多个样本点称为事件。当事件之间没有共同的样本点时，它们被称为互斥事件。\n\
  \n#### Q46: 什么是非参数算法？\n\n**答：** 非参数不对数据分布做任何假设。\n\n#### Q47: 学习可以如何分类？\n\n**答：**\
  \ 分类如下：\n\n*   **监督学习：**\n    *   数据有明确标签，算法从输入数据中学习以预测输出\n    *   可进行数据的离线分析\n\
  \    *   类别数量预先定义\n    *   准确率高\n    *   示例包括分类和回归\n*   **无监督学习：**\n    *   大量数据无标签，算法从输入数据中学习固有结构\n\
  \    *   分析基于实时数据\n    *   类别数量可能未知\n    *   准确率范围从中等到高\n    *   示例包括聚类和关联\n*  \
  \ **半监督学习：**\n    *   有标签和无标签数据的混合构成此类\n    *   可视为上述两者的中间形式\n\n#### Q48: 什么是分类？\n\
  \n**答：** 分类预测建模是从输入变量 (`X`) 到离散输出变量 (`y`) 逼近映射函数 (`f`) 的任务。\n\n输出变量通常称为标签或类别。\n\n\
  映射函数为给定观测值预测类别或类别。\n\n![](img/8.jpg)\n\n#### Q49: 解释分类涉及的步骤。\n\n**答：**\n\n![](img/9.jpg)\n\
  \n#### Q50: 什么是回归？\n\n**答：** 回归预测建模是从输入变量 (`X`) 到连续输出变量 (`y`) 逼近映射函数 (`f`) 的任务。\n\
  \n连续输出变量可以是实值，如整数或浮点数，可以是大小、数量等任何度量。\n\n误差表示回归中实际值与预测值的差异，主要使用均方根误差。\n\n![](img/10.jpg)\n\
  \n#### Q51: 解释分类与回归的异同。\n\n**答：** 分类与回归的区别：\n\n![](img/11.jpg)\n\n相同点是两者都试图基于输入值进行预测。\n\
  \n#### Q52: 解释分类算法中遇到的各种术语。\n\n**答：** `Classifier`（分类器）是将输入数据映射到特定类别的算法。\n\n**分类模型：**\
  \ 分析输入数据后，构建分类模型。该模型可接收新数据作为输入并预测类标签/类别。\n\n**特征：** 特征是所观测现象的一个可测量的个别属性。\n\n**二分类：**\
  \ 具有两种可能结果的分类任务。\n\n**多分类：** 涉及两个以上类别的分类。在多分类中，每个样本仅被分配到一个目标标签。\n\n例如：一个项目可被分类为水果或蔬菜，不能两者皆是。\n\
  \n**多标签分类：** 每个样本映射到一组包含多个类别的目标标签的分类任务。\n\n示例：一种水果可同时被分类为甜和酸。\n\n#### Q53: 解释多分类？\n\
  \n**答：** 每当我们有两个以上（即三个或更多）类别需要分类时，称为多分类。这也称为多项分类。\n\n默认情况下，scipy 的所有算法均为多分类。\n\n\
  涉及的一些策略有：\n\n*   **一对其余：** 每个类别训练一个分类器。与该类别匹配的样本为正类，不匹配的为负类。\n*   **一对一：**\n   \
  \ *   从 `n` 个类别的集合中选取一对类别\n    *   为每个选定的类别对开发一个二分类器\n    *   从 `n` 个类别中选取所有可能的类别对组合\n\
  \    *   然后，为每一对开发一个二分支持向量机 (`SVM`)\n\n#### Q54: 解释多标签分类？\n\n**答：** 每当一个问题关联多个目标变量时，我们称之为多标签分类。\n\
  \n例如：在对水果分类时，我们可以将其分类为水果、甜、红色等。正如我们清楚看到的，我们给同一对象分配了多个标签。\n\n#### Q55: 解释如何解决多标签问题？\n\
  \n**答：** 实现的不同方式如下：\n\n**二元相关性：** 此技术将每个标签视为一个单独的单类别分类问题。\n\n借助 `skmultilearn.problem_transform.BinaryRelevance`\
  \ 实现示例：\n\n```\nfrom skmultilearn.problem_transform import BinaryRelevance\nclassifier\
  \ = BinaryRelevance(any model)\n```\n\n**分类器链：** 形成一个分类器链，输入传递给第一个分类器进行训练，再传递给下一个分类器，以此类推。\n\
  \n使用 `skmultilearn.problem_transform.ClassifierChain` 实现此目的：\n\n```\nfrom skmultilearn.problem_transform\
  \ import ClassifierChain\nclassifier = ClassifierChain(model)\n```\n\n**标签幂集：**\
  \ 此方法尝试构建一个单一模型来解决多类别模型问题。\n\n使用 `skmultilearn.problem_transform.LabelPowerset`：\n\
  \n```\nfrom skmultilearn.problem_transform import LabelPowerset\nclassifier = LabelPowerset(model)\n\
  ```\n\n#### Q56: 解释关于测试模型的一些重要指标？\n\n**答：** **真阳性** 表示模型正确预测了正类结果。它表明模型能在条件存在时识别出该条件。\n\
  \n**真阴性** 表示模型能正确预测负类。它表明模型在条件不存在时未发现该条件。\n\n**假阳性** 表示模型错误地预测了正类。它表明模型在条件不存在时却发现或报告了该条件。\n\
  \n**假阴性** 表示模型错误地预测了负类。它表明模型在条件实际存在时未报告该条件。\n\n\n\n\n\n# 混淆矩阵指标\n\n所有四种情况均可通过混淆矩阵指标轻松表示：\n\
  \n![](img/12.jpg)\n\n**图 1**\n\n**召回率 / 灵敏度 / 真正例率 (TPR)：** 当条件存在时，判定该条件的能力。计算公式为：\n\
  \n`真正例 / (真正例 + 假负例)`\n\n**特异度 / 真负例率 (TNR)：** 表示当条件实际不存在时，不检测出该条件的能力。计算公式为：\n\n\
  `真负例 / (真负例 + 假正例)`\n\n**精确率 / 阳性预测值：** 表示从总项目中正确识别为正例的项目数量。\n\n`真正例 / (真正例 + 假正例)`\n\
  \n**假正例率 或 I 类错误：** 从总真负例中被错误识别为正例的项目数量。\n\n`假正例 / (假正例 + 真负例)`\n\n**假负例率 或 II 类错误：**\
  \ 表示从总真正例中被错误识别为负例的项目数量。\n\n`假负例 / (假负例 + 真正例)`\n\n---\n\n##### Q57: 什么是逻辑回归？\n\n\
  *答：* 逻辑回归也称为对数几率模型，最适用于理解多个自变量对单个结果变量的影响。\n\n函数表示：\n\n`p = 1 / (1 + e^(-(β0 + β1X1\
  \ + β2X2… βnXn)))`\n\n它是一种预测分析。在此算法中，描述单次试验可能结果的概率使用逻辑函数进行建模。\n\n**缺点：**\n\n*  \
  \ 假设所有预测变量相互独立，这并不总是成立。\n*   仅当预测或输出变量为二分类时才有效。\n\n---\n\n##### Q58: 解释朴素贝叶斯。\n\n\
  *答：* 朴素贝叶斯算法基于贝叶斯定理，并假设每对特征之间相互独立。这意味着预测变量彼此独立。\n\n设 `P(c|x)` 为给定预测变量 (`x`，属性) 下类别\
  \ (`c`，目标) 的后验概率。\n\n`P(c)` 为类别的先验概率。\n\n`P(x|c)` 为似然概率，即给定类别下预测变量的概率。\n\n`P(x)`\
  \ 为预测变量的先验概率。\n\n![](img/13.jpg)\n\n**优点：**\n\n*   速度极快\n*   所需训练集较少\n*   对类别型数值表现良好\n\
  \n**缺点：**\n\n*   如果某些类别缺失，会出现零频率问题，导致该类别的影响被忽略\n*   假设预测变量相互独立，这在现实世界中并不总是成立\n\n\
  ---\n\n##### Q59: 什么是随机梯度下降？\n\n*答：* 梯度是计算参数或系数以使成本最小化的有效方法。该过程涉及假设某个值作为系数，不断计算斜率并调整系数，直到找到最小成本。\n\
  \n但当逻辑应用于超大数据集时，速度会变慢。随机梯度下降用于解决此问题。在此方法中，计算基于批次实例进行，而非在最后进行。\n\n**优点：**\n\n*  \
  \ 算法极其有效\n*   易于使用\n\n**缺点：**\n\n*   需要大量参数\n\n---\n\n##### Q60: 解释决策树算法。\n\n*答：*\
  \ 决策树生成一组规则，这些规则依赖于属性或特征并基于类别。决策树是一棵倒置的树。顶部的节点称为根节点，没有任何子节点的节点称为叶节点。\n\n决策树的每一部分代表特定含义，如下所示：\n\
  \n*   每个属性/特征由节点表示\n*   规则或决策由连线表示\n*   叶节点或无子节点的节点代表输出类别\n\n它采用递归方法。目标是根据成本函数将给定数据划分为不同的组或类别。\n\
  \n**分类与回归树 (CART)** 也称为 **CART**。\n\n![](img/14.jpg)\n\n**优点：**\n\n*   所需数据准备工作少\n\
  *   易于理解和可视化\n*   可处理包含数值的数据集\n*   可处理包含类别形式数据的数据集\n\n**缺点：**\n\n异常值会对输出产生严重影响。输入数据的变化确实会对输出产生重要影响。\n\
  \n---\n\n##### Q61: 什么是基尼指数？\n\n*答：* 基尼指数是用于评估数据集划分优劣的成本函数。它给出了不纯度的度量。基于特征的数据划分效果如何，可以通过基尼指数轻松确定。基尼得分为\
  \ 0 是理想的预期结果，而概率五五开的情况则不受青睐。\n\n![](img/15.jpg)\n\n---\n\n##### Q62: 基尼指数是决策树中唯一可用的度量吗？\n\
  \n*答：* 熵是另一种可用于决策树的度量。\n\n---\n\n##### Q63: 关于决策树，什么是剪枝？\n\n*答：* 剪枝是指移除在分类或回归方面重要性较低的分支。其优势在于降低复杂度和减少过拟合。算法基本上计算移除特定节点是否会影响树的预测精度。\n\
  \n---\n\n##### Q64: 什么是随机森林？\n\n*答：* 随机森林是一种元估计器，它拟合多棵决策树。它利用平均值来提高模型的预测能力。每棵决策树的输出被用于最终预测最终模型，为此它采用多数投票机制。数据被分类为获得多数票的类别。为生成该森林，使用子样本，并利用原始数据集的子样本创建子树。\n\
  \n![](img/16.jpg)\n\n**优点：** 减少过拟合。\n\n**缺点：** 速度较慢，因为实时更新耗时。\n\n---\n\n##### Q65:\
  \ 解释随机森林和决策树的区别。\n\n*答：*\n\n![](img/17.jpg)\n\n---\n\n##### Q66: 什么是过拟合和欠拟合？\n\n\
  *答：* 以下是过拟合和欠拟合的解释：\n\n**过拟合：**\n\n*   指在训练集上表现极好的模型。此类模型能非常好地预测训练集的噪声和随机性，但在面对新到达的数据时表现不佳。\n\
  *   发生在非参数和非线性模型中。\n\n**欠拟合：**\n\n*   指在训练集和新到达的数据上均表现不佳的模型。\n*   欠拟合模型会因基准测试和准确率表现不佳而被直接拒绝。\n\
  \n---\n\n##### Q67: 欠拟合发生的原因是什么？\n\n*答：* 当模型无法捕捉或理解数据的本质时，就会发生欠拟合。这会直接影响模型的准确性。\n\
  \n原因可能包括：\n\n*   可用于分析的数据较少\n*   数据错误\n*   考虑的特征错误\n*   也可能是由于模型构建错误\n\n解决欠拟合的方法是使用更多数据，并可能通过移除不需要的特征或列来清洗数据。\n\
  \n下图展示了欠拟合绘图时的样子：\n\n![](img/18.jpg)\n\n**图 2**\n\n---\n\n##### Q68: 过拟合会受噪声影响吗？\n\
  \n*答：* 当模型容易受噪声或异常值影响时，就会发生过拟合。此情况下可用的细节更多，结果模型受到影响。\n\n以下是过拟合绘图时的图示：\n\n![](img/19.jpg)\n\
  \n**图 3**\n\n**克服过拟合的方法：**\n\n*   **剪枝：** 顾名思义，剪枝即修剪。我们在修剪不需要的数据的同时，也修剪那些容易受错误数据影响的节点。\n\
  \n\n\n\n\n##### 交叉验证\n\n样本预测误差是有助于解决过拟合问题的一种方法。这通常借助 k 折验证来完成。在 k 折验证中，原始样本数据被分为\
  \ k 个子集。其中一个子集用于测试，其余子集用于构建模型。收集输出结果并将其平均，从而得到最终估计。\n\n##### 正则化\n\n其目的是找出与问题目标相符的特征，从而移除那些对最终输出无贡献的特征。\n\
  \n##### Q69：解释 KNN（K 近邻）涉及的步骤、优点和缺点。\n\n**答：** KNN 全称为 K Nearest Neighbor（K 近邻），解释如下：\n\
  \n*   非急切学习者，即惰性学习\n*   存储训练集的实例\n*   输出由每个点的 k 个最近邻的多数表决决定\n\n涉及的步骤如下：\n\n1.  计算距离。\n\
  2.  寻找最近邻。\n3.  对标签进行投票。\n\n###### 优点\n\n*   速度更快。\n*   无需为泛化训练模型。\n*   可用于非线性数据和回归问题。\n\
  \n#### 缺点\n\n*   内存占用大。\n*   随维度数量增加，性能下降。\n\n##### Q70：解释选择偏差。\n\n**答：** 选择偏差是指在选择用于分析的个体、群体或数据时，未能实现适当的随机化，从而导致获得的样本不能代表拟分析的总体，所引入的偏差。\n\
  \n它们本质上是系统性的，由测量或抽样过程产生。\n\n##### Q71：选择偏差对于算法意味着什么？\n\n**答：** 它表明在算法过程中，某些重要变量被遗漏或未被考虑。\n\
  \n##### Q72：什么是 Bootstrap 样本（自助样本）？\n\n**答：** Bootstrap 样本用于估计分布。从观测数据集中有放回地抽取的样本称为\
  \ bootstrap 样本。\n\n![Image](img/20.jpg)\n\n##### Q73：什么是重采样？\n\n**答：** 重采样结合了洗牌和自助法。\n\
  \n##### Q74：解释尾部。\n\n**答：** 尾部是频率分布中极端值以极低频率被观测到的部分。\n\n##### Q75：解释单向检验和双向检验的区别。\n\
  \n**答：**\n\n###### 单向检验\n\n这是一种假设检验，结果仅朝一个方向出现。\n\n###### 双向检验\n\n这是一种假设检验，结果朝两个方向出现。\n\
  \n##### Q76：解释自由度。\n\n**答：** 它表示给定样本中有多少值应当变化以给出所需结果。\n\n在一个包含 5 个样本的样本中，如果均值已知且\
  \ 4 个值已知，我们可以说有 4 个值可以变化。\n\n##### Q77：什么是预测建模？\n\n**答：** 预测建模涉及构建一个模型，当输入变量的值给定时，该模型允许预测结果/事件/行为。寻找输入变量之间的关系以及它们如何影响输出，构成回归研究的一部分。\n\
  \n##### Q78：什么是时间序列分析？\n\n**答：** 利用特定时间间隔或周期内的数据进行的分析称为时间序列分析。时间方面在此类分析中持续存在。它可能涉及在不同时间点观测一个变量（时间序列数据），或在同一时间点收集不同数据（横截面数据），或两者的结合（汇合数据）。\n\
  \n##### Q79：什么是深度学习？\n\n**答：** 深度学习使通过现有示例进行学习成为可能。模型由计算机利用现有示例生成。\n\n数据的潜在关系可借助神经网络确定。\n\
  \n神经网络由各种相互连接的节点或计算机组成，以执行复杂/大规模计算。\n\n要实现深度学习，我们需要大量标记数据集以及强大的计算能力。\n\n此外，深度学习是机器学习的一部分，其操作规模要大得多。\n\
  \n![Image](img/21.jpg)\n\n##### Q80：什么是卷积神经网络？\n\n**答：** CNN 或 ConvNet 代表卷积神经网络，是一种学习类型，其中模型学习执行模型分类。它消除了手动特征提取的需求。借助许多层（其中许多可以是隐藏层），它实现了这一点。\n\
  \n##### Q81：确定聚类最优值的不同方法有哪些？\n\n**答：**\n\n###### 肘部法\n\n利用计算每个聚类的平方和。计算出的值以图表形式绘制。通过观察斜率，根据图表选择最佳解决方案。\n\
  \n###### 间隙法\n\n这利用间隙值，该值通过在零假设参考下观察不同 k 值时聚类间的变异来确定。\n\n###### 轮廓系数法\n\n利用轮廓系数平均值计算表现最佳的聚类。上述平均值通过观察聚类内的一致性来确定。\n\
  \n##### Q82：用于相似度度量的各种距离相关函数有哪些？\n\n**答：** 常见的有欧氏距离、余弦相似度、皮尔逊系数和杰卡德相似度。\n\n# 第 2\
