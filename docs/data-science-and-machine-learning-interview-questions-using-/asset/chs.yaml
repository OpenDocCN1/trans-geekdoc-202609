  ||||||---Salary<=0.03\n|||||||---class:1\n```\n\n---\n\n### Q17：Boosting 技术的用途是什么？\n\
  \n**答：** Boosting 技术属于集成算法家族。在 Boosting 技术中，许多本质上可能较弱的分类器的集合可以组合在一起，形成一个新的强分类器。\n\
  \n可以说在 Boosting 中，一系列不同的分类器被逐步创建，其中每个分类器都试图解决前一个分类器的减少误差。经过这一过程后的最终产物将是一个经过改进的分类器，其性能优于之前的分类器。\n\
  \n![Boosting 技术](img/145.jpg)\n\n---\n\n### Q18：解释 Boosting 技术的一些优缺点？\n\n**答：**\
  \ ### 优点\n\n*   由于它们是集成模型，预测结果易于解释。\n*   与普通分类器相比，预测效果更好。\n*   过拟合可以在一定程度上通过此技术得到处理。\n\
  \n#### 缺点\n\n*   异常值需要考虑。如果处理不当，它们会影响整个模型。\n*   除了 XGBoost 之外，大多数其他算法都是顺序执行的，从而限制了并行运行的范围。\n\
  \n---\n\n### Q19：什么是 AdaBoost？\n\n**答：** ADA，也称为自适应 Boosting 技术，由 Yoav Freund 和\
  \ Robert Schapire 提出。既然它是一种 Boosting 技术，其目的就是从各种弱分类器的集合中找到一个新的强分类器。\n\n它主要应用于决策树或二分类。\n\
  \n通常，ADA Boost 使用决策桩，即只有一层的决策树。\n\n训练数据集中的实例会被加权。这非常重要，且与多数投票法不同，因为每个输出的重要性是根据权重来考量的。\n\
  \n因此，该过程是利用决策桩接收输入变量并预测二值作为分类。\n\n通过上述方法计算错误分类率。\n\n使用加权和，然后计算阶段值。\n\n利用此值，更新训练权重，这使得错误预测的实例获得更高权重，正确预测的实例获得更低权重。\n\
  \n序列中添加的弱模型随后使用加权训练数据进行训练。\n\n\n\n\n上述过程重复进行，直到达到所需的准确性，或无法再进行改进。\n\n以下是 Ada Boosting\
  \ 的代码：\n\n```python\nfrom sklearn.ensemble import AdaBoostClassifier\n\nbooster\
  \ = AdaBoostClassifier()\nn_estimators = 50  # 默认值\nbase_estimator = DecisionTreeClassifier\
  \  # 默认值\nbooster.fit(x_train, y_train)\nbooster.predict(x_test)\n```\n\n### Q20:\
  \ 解释梯度提升？\n\n**答：** 梯度提升利用训练好的序列模型。它使用梯度下降函数，该函数计算给定函数的局部最小值。因此，我们试图为损失函数找到局部最小值函数。\n\
  \n该过程是构建新的学习器，也称为基学习器，它们可以与损失函数的负梯度下降相关联：\n\n```python\nfrom sklearn.ensemble import\
  \ GradientBoostingClassifier  # 用于分类\n# from sklearn.ensemble import GradientBoostingRegressor\
  \  # 用于回归\n\nclassifier = GradientBoostingClassifier(n_estimators, learning_rate,\
  \ max_depth)\nclassifier.fit(X_train, y_train)\n```\n\n*   **`n_estimators`：** 表示弱学习器的数量\n\
  *   **`learning_rate`：** 决定弱学习器在最终组合中的贡献\n*   **`max_depth`：** 单个回归估计器的最大深度。这限制了树中的节点数量。\n\
  \n### Q21: 解释 XGBoost？\n\n**答：** **XGBoost**，也称为极端梯度提升，是一组用于开发快速且高性能梯度提升树模型的算法/库。\n\
  \n它利用梯度提升框架。\n\n部分特性包括：\n\n*   自动处理缺失数据值。\n*   可并行化树的构建。\n*   利用损失函数的二阶偏导数。这是与其他梯度算法的主要区别。其他算法使用一阶导数的损失函数，而\
  \ XGB 使用二阶导数，这也给出了梯度的方向。\n*   使用先进的正则化技术。\n\n示例片段：\n\n```python\nimport pandas as\
  \ pd\nfrom xgboost import XGBClassifier\nfrom sklearn.metrics import accuracy_score\n\
  \nmodel = XGBClassifier()\nmodel.fit(x, y)\npredict_train = model.predict(test_x)\n\
  accuracy_train = accuracy_score(train_y, predict_train)\n```\n\n### Q22: 解释 Bagging\
  \ 和 Boosting 的区别/相似之处？\n\n**答：** **相似之处：**\n\n*   两者都属于称为集成学习的算法方法，即从 N 个分类器中生成/获得\
  \ 1 个学习器。\n*   两者都通过将原始数据集划分为较小的单元来工作。\n*   都考虑输出的平均值。\n*   两者都试图提高性能。\n\n下表显示了区别：\n\
