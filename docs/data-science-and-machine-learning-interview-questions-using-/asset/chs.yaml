  \ 支持以下函数。这些函数的优势在于它们作用于 `numpy` 数组的所有元素。\n\n*   **abs, fabs：** 逐元素返回绝对值。Fabs 可用于非复数值数据，并具有额外的速度优势。\n\
  *   **sqrt：** 计算每个元素的平方根。\n*   **square：** 计算每个元素的平方。\n*   **exp：** 计算每个元素的指数 ex。\n\
  *   **log：** log10, log2, log1p 分别为自然对数（底数 e）、以 10 为底的对数、以 2 为底的对数和 log(1 + x)。\n\
  *   **sign：** 计算每个元素的符号：1（正）、0（零）或 -1（负）。\n*   **ceil：** 确定每个元素的上取整值。\n*   **floor：**\
  \ 确定每个元素的下取整值。\n*   **rint：** 将元素四舍五入到最接近的整数，保留 dtype。\n*   **modf：** 返回给定输入的小数部分和整数部分。\n\
  *   **isnan：** 如果值为 NaN 则返回 true，否则返回 false。\n*   **isfinite, isinf：** 分别返回 true，指示每个元素是有限还是无限。\n\
  *   **常规和双曲三角函数：** cos, cosh, sin, sinh, tan, tanh, arccos, arccosh, arcsin, arcsinh,\
  \ arctan, arctanh\n*   **maximum, fmax：** 逐元素最大值。fmax 忽略 NaN。\n*   **minimum, fmin：**\
  \ 逐元素最小值。fmin 忽略 NaN。\n*   **mod：** 逐元素取模（除法余数）。\n*   **copysign：** 将第二个参数中值的符号复制到第一个参数的值中。\n\
  \nQ13: 什么是广播？\n\n\n\n## 答：`numpy` 能够以统一的方式处理维度或形状不同的数组，这种能力称为广播。\n\n我们可以借助 broadcast\
  \ 方法进行广播。\n\n![](img/77.jpg)\n\n**输出：**\n\n```\n(4, 1)\n(5, 1)\n(6, 1)\n(4, 2)\n\
  (5, 2)\n(6, 2)\n(4, 3)\n(5, 3)\n(6, 3)\n```\n\n### Q14：解释广播的规则。\n\n*   当两个数组的维度不同时，维度较少的那个数组的形状会通过在其前导（左）侧填充\
  \ 1 来进行调整。\n*   如果两个数组的形状存在差异，在某个维度上不匹配，则该维度会被拉伸以匹配另一个形状为 1 的数组。\n*   如果维度和大小不一致，且两者都不等于\
  \ 1，则会引发错误。\n\n### Q15：解释 numpy 支持的一些统计度量。\n\n*答*：\n\n*   **amin**：按行或按列查找最小值\n\
  *   **mean**：查找给定数据集的平均值\n*   **std**：查找给定数据集的标准差\n*   **var**：查找给定数据集的方差\n*   **average**：查找加权平均值，其中平均值是根据变量出现的频率计算的\n\
  *   **percentile**：计算各种百分位数区间，主要集中在 25%、50% 和 75% 处\n*   **ptp**：计算给定数据集中的峰峰值\n\
  *   **median**：计算给定数据集的中位数\n\n![](img/78.jpg)\n\n```\nprint (np.ptp(a, axis = 0)\
  \ )\nprint('percentile axis 1')\nprint (np.percentile(a,50, axis = 1) )\nprint('percentile\
  \ axis 0')\nprint (np.percentile(a,50, axis = 0) )\nprint('median')\nprint (np.median(a,\
  \ axis = 0) )\nprint('mean')\nprint (np.mean(a, axis = 0) )\na = np.array([1,2,3,4])\n\
  wts = np.array([4,3,2,1])\nprint('average')\nprint (np.average(a,weights = wts)\
  \ )\nprint('std')\nprint (np.std([1,2,3,4]))\nprint('var')\nprint (np.var([1,2,3,4]))\n\
  ```\n\n**输出：**\n\n```\na\n[[3 7 5]\n [8 4 3]\n [2 4 9]]\namin 1\n[3 3 2]\namin 0\n\
  [2 4 3]\nptp\n7\nptp axis 0\n[6 3 6]\npercentile axis 1\n[5. 4. 4.]\npercentile\
  \ axis 0\n[3. 4. 5.]\nmedian\n[3. 4. 5.]\nmean\n[4.33333333 5. 5.66666667]\naverage\n\
  2.0\nstd\n1.118033988749895\nvar\n1.25\n```\n\n### Q16：解释 numpy.linalg 中可用的函数。\n\
  \n*答*：\n\n*   **dot(a, b[, out])**：两个数组的点积。\n*   **linalg.multi_dot(arrays)**：在单次函数调用中计算两个或多个数组的点积，同时自动选择最快的计算顺序。\n\
  *   **vdot(a, b)**：返回两个向量的点积。\n*   **inner(a, b)**：两个数组的内积。\n*   **outer(a, b[,\
  \ out])**：计算两个向量的外积。\n*   **matmul(a, b[, out])**：两个数组的矩阵乘积。\n*   **tensordot(a,\
  \ b[, axes])**：沿指定轴为数组（>= 1-D）计算张量点积。\n*   **einsum(subscripts, *operands[, out,\
  \ dtype, •])**：在操作数上求解爱因斯坦求和约定。\n*   **linalg.matrix_power(M, n)**：将方阵提升到（整数）`n`\
  \ 次幂。\n*   **kron(a, b)**：两个数组的克罗内克积。\n*   **linalg.cholesky(a)**：乔莱斯基分解。\n*   **linalg.qr(a[,\
  \ mode])**：计算矩阵的 QR 分解。\n*   **linalg.svd(a[, full_matrices, compute_uv])**：奇异值分解。\n\
  *   **矩阵特征值 linalg.eig(a)**：计算方阵的特征值和右特征向量。\n*   **linalg.eigh(a[, UPLO])**：返回厄米特矩阵或对称矩阵的特征值和特征向量。\n\
  *   **linalg.eigvals(a)**：计算一般矩阵的特征值。\n*   **linalg.eigvalsh(a[, UPLO])**：计算厄米特矩阵或实对称矩阵的特征值。\n\
  *   **linalg.norm(x[, ord, axis, keepdims])**：矩阵或向量范数。\n*   **linalg.cond(x[, p])**：计算矩阵的条件数。\n\
  *   **linalg.det(a)**：计算数组的行列式。\n*   **linalg.matrix_rank(M[, tol])**：使用 SVD 方法返回数组的矩阵秩。\n\
  *   **linalg.slogdet(a)**：计算数组行列式的符号和（自然）对数。\n*   **trace(a[, offset, axis1, axis2,\
  \ dtype, out])**：返回数组对角线元素的和。\n*   **linalg.solve(a, b)**：求解线性矩阵方程或线性标量方程组。\n* \
  \  **linalg.tensorsolve(a, b[, axes])**：求解张量方程 a x = b 求 x。\n*   **linalg.lstsq(a,\
  \ b[, rcond])**：返回线性矩阵方程的最小二乘解。\n*   **linalg.inv(a)**：计算矩阵的（乘法）逆矩阵。\n*   **linalg.pinv(a[,\
  \ rcond])**：计算矩阵的（Moore-Penrose）伪逆矩阵。\n*   **linalg.tensorinv(a[, ind])**：计算 N 维数组的“逆”。\n\
