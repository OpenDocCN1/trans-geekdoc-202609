  \ '__package__', '__spec__', 'acos', 'acosh', 'asin', 'asinh', 'atan', 'atan2',\
  \ 'atanh', 'ceil', 'copysign', 'cos', 'cosh', 'degrees', 'e', 'erf', 'erfc', 'exp',\
