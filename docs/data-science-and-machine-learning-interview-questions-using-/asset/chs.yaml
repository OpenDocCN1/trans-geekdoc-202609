  \n*   **`capitalize()`**：将字符串的第一个字母大写。\n*   **`isalnum()`**：如果字符串至少有一个字符且所有字符都是字母数字，则返回\
  \ `True`，否则返回 `False`。\n*   **`isdigit()`**：如果字符串仅包含数字，则返回 `True`，否则返回 `False`。\n\
  *   **`islower()`**：如果字符串至少有一个大小写字符且所有大小写字符均为小写，则返回 `True`，否则返回 `False`。\n*   **`isnumeric()`**：如果\
  \ Unicode 字符串仅包含数字字符，则返回 `True`，否则返回 `False`。\n*   **`isspace()`**：如果字符串仅包含空白字符，则返回\
  \ `True`，否则返回 `False`。\n*   **`isupper()`**：如果字符串至少有一个大小写字符且所有大小写字符均为大写，则返回 `True`，否则返回\
  \ `False`。\n*   **`lower()`**：将字符串中的所有大写字母转换为小写。\n*   **`lstrip()`**：移除字符串中的所有前导空白字符。\n\
  *   **`max(str)`**：从字符串 `str` 中返回最大的字母字符。\n*   **`replace(old, new[, max])`**：将字符串中所有出现的\
  \ `old` 替换为 `new`；如果给定 `max`，则最多替换 `max` 次。\n*   **`strip([chars])`**：在字符串上同时执行\
  \ `lstrip()` 和 `rstrip()`。\n*   **`swapcase()`**：反转字符串中所有字母的大小写。\n\n---\n\n### Q40:\
  \ 如何检查两个字符串是否相等。\n\n**答：** 可以使用 `==` 运算符来检查字符串是否相等。\n\n---\n\n### Q41: 字符串可以使用单引号还是双引号？\n\
