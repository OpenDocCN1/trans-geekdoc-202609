  \ B not in A {1}\nElements in A but not in B {33, 11, 5}\nElements in B not in A\
  \ {1}\n```\n\n---\n\n### Q44: 解释 `frozenset`？\n\n**答：** `frozenset` 赋予集合不可变性，即其中的任何内容都无法被修改。\n\
  \n---\n\n### Q45: 解释 Python 中的函数？\n\n**答：** 函数是一组用于执行特定任务的语句。在 Python 中，我们可以借助 `def`\
  \ 来定义函数。\n\n```python\ndef fun():\n    print('hello')\n```\n\n以上代码创建了一个打印 **hello**\
  \ 消息的函数 `fun`。\n\n```python\ndef fun1(ip):\n    print('hello', ip)\n```\n\n以上代码创建了一个名为\
  \ `fun1` 的函数，它接受参数 `ip` 并打印带有该参数的相应 hello 消息。\n\n```python\ndef area(r):\n    return\
  \ 3.14 * r * r\n```\n\n以上代码创建了一个借助 `return` 语句返回结果的函数。\n\n---\n\n### Q46: 什么是布尔函数？\n\
  \n**答：** 布尔函数是指返回 `True` 或 `False` 的函数。\n\n```python\ndef isdivisble(num, den):\n\
  \    if num % den == 0:\n        return True\n    else:\n        return False\n\n\
  print(isdivisble(10, 2))\n```\n\n上述函数根据分子是否能被分母整除，返回 `True` 或 `False`。\n\n---\n\n\
