- raw: "*Ans:* Anything which keeps on changing is called variable. Variables are\
    \ of different type and below are the following:\n\n**Dependant/Outcome:** A variable\
    \ being affected, for example annual temperature in above example.\n\n**Independent/Predictor:**\
    \ A variable affecting the outcome for e.g. deforestation, pollution, and so on\
    \ in above example.\n\n[Q3: Explain Categorical measurement?](#toc.xhtml#c01q3a)\n\
    \n*Ans:* Categorical measurement contains categories i.e. distinct entities. Example\
    \ of categories of life on earth is plants, animals, and so on.\n\n[Q4: Explain\
    \ Binary variables?](#toc.xhtml#c01q4a)\n\n*Ans:* Binary variables are those in\
    \ which only two classes exist, like live or dead male or female on or off.\n\n\
    [Q5: Explain Nominal measurement?](#toc.xhtml#c01q5a)\n\n*Ans:* Nominal measurements\
    \ are there more than two classes. Such categories can be numbers too.\n\n[Q6:\
    \ Explain Ordinal variable?](#toc.xhtml#c01q6a)\n\n*Ans:* These are nominal variables\
    \ which have logical order. Examples include team ranks in cricket or football,\
    \ merit list of students appearing for grade students.\n\n[Q7: Explain Continuous\
    \ variables?](#toc.xhtml#c01q7a)\n\n*Ans:* These are variables which can take\
    \ can any value on the measurement scale example includes pitch of voice which\
    \ can take any possible value within the range.\n\n[Q8: Explain Discrete variables?](#toc.xhtml#c01q8a)\n\
    \n*Ans:* These are variables which can take fixed values in range. For example,\
    \ number of customers in a bank.\n\n[Q9: Is it possible to convert continuous\
    \ values to discrete and vice versa?](#toc.xhtml#c01q9a)\n\n*Ans:* Yes, based\
    \ upon the motive of study, it is possible to convert discrete values to continuous\
    \ and vice versa for example, Level of water in tank can take any value in the\
    \ range and as such a continuous variable.\n\nBut we can approximate the same\
    \ to three different levels like empty, full, or half empty and this now becomes\
    \ discrete in nature.\n\n[Q10: What are interval variables?](#toc.xhtml#c01q10a)\n\
    \n*Ans:* These are variables which are grouped on interval. Example is age can\
    \ be divided in range like 10-20, 20-30 and so on and, person with particular\
    \ age would be placed in one of the above groups. When intervals are equal, they\
    \ represent difference in equal property being measured.\n\n[Q11: What are ratio\
    \ variables?](#toc.xhtml#c01q11a)\n\n*Ans:* This is sub type of interval variables\
    \ where ratio of scales is used for measurement.\n\nFor Example Water representation\
    \ in chemistry is H[2]O which represent two molecules of hydrogen and one molecule\
    \ of oxygen. Thus, the ratio of elements is 2: 1.\n\n[Q12: What are Univariate\
    \ and Bivariate variables?](#toc.xhtml#c01q12a)\n\n*Ans:* **Univariate variable:**\
    \ When the variable under consideration is only one then it is called univariate\
    \ variable study.\n\n**Bivariate variable:** Involves study of relationship between\
    \ two variables.\n\n[Q13: What is measurement error?](#toc.xhtml#c01q13a)\n\n\
    *Ans:* The discrepancy between the measured value and actual value in terms of\
    \ number is called measurement error.\n\nFor Example While buying fruits from\
    \ a vendor in kilograms, if we wanted 1 kilogram of fruits and the vendor’s weighing\
    \ machine showed 1 kilogram when we brought the same. After checking the same\
    \ in another machine, if the measured value shows 0.1 kilogram less than expected\
    \ then this difference is what we call as measurement error.\n\n[Q14: Explain\
    \ Validity?](#toc.xhtml#c01q14a)\n\n*Ans:* Validity implies whether an instrument\
    \ measures what it is supposed to measure.\n\n[Q15: Explain Reliability?](#toc.xhtml#c01q15a)\n\
    \n*Ans:* Reliability implies whether the instrument gives consistent result across\
    \ different conditions.\n\nFor example, if we test the same value twice on the\
    \ same entity then the results from the instrument should remain same if it has\
    \ to be reliable. Such tests are known as test-retest.\n\n[Q16: What are the different\
    \ ways to test hypotheses?](#toc.xhtml#c01q16a)\n\n*Ans:* There are two ways in\
    \ which hypotheses can be tested:\n\n1.  Correlational research \n\n    *   This\
    \ is also known as cross-sectional research\n\n    *   This involves observing\
    \ the natural pattern or occurrence to test\n\n    *   Original occurrences are\
    \ not manipulated\n\n2.  Experimental research \n\n    *   We select the variables\
    \ of interest\n\n    *   Then we manipulate some aspect of the environment\n\n\
    \    *   Observe the effect on selected variable\n\n[Q17: Explain the different\
    \ types of variation?](#toc.xhtml#c01q17a)\n\n*Ans:* There are two types in variation\
    \ explained as follows:\n\n**Systematic variation:**\n\n*   Introduced by experimenter\n\
    \n*   The participants are tested under different conditions and the difference\
    \ in condition is introduced by experimenter\n\nFor Example to test use of woolen\
    \ clothes w.r.t. temperature, we can test a group of 20 people, in both hot and\
    \ cold climate. Thus, the difference introduced here is in terms of temperature\
    \ only.\n\n**Unsystematic variation:**\n\n*   Introduced by random factors that\
    \ exist between the experimental conditions.\n\n*   For Example To test use of\
    \ woolen clothes w.r.t. temperature, we can test a group of 20 people. Of the\
    \ selected set some might behave differently than expected due to factors like\
    \ illness and so on.\n\n[Q18: Explain repeated-measures design?](#toc.xhtml#c01q18a)\n\
    \n*Ans:* Same measure is measured under different conditions on same set participants.\n\
    \nThe difference in two conditions can be caused by the following:\n\n*   The\
    \ manipulation/changes that was carried out on the participants\n\n*   Factors\
    \ that might affect the way in which a participant performs from one time to the\
    \ next\n\n[Q19: What is independent design?](#toc.xhtml#c01q19a)\n\n*Ans:* Same\
    \ measure is measured under different conditions on different set of participants.\n\
    \nThe differences between the two conditions can be caused by the following:\n\
    \n*   The manipulation/changes that were carried out on the participants\n\n*\
    \   Difference in nature or characteristics of participants in each case\n\n[Q20:\
    \ Explain the role of randomization w.r.t variation?](#toc.xhtml#c01q20a)\n\n\
    *Ans:* By using randomization we can ensure that any variation introduced, is\
    \ due to changes in the conditions/variables introduced rather than any other\
    \ unexpected changes during the process. Thus, it helps in removing other sources\
    \ of systematic variation.\n\n[Q21: Explain various summary measures.](#toc.xhtml#c01q21a)\n\
    \n*Ans:* **Mode:** Represents the value/score which occurs most frequently in\
    \ data set.\n\nFor example: In the values of occurrences of goal in football by\
    \ players having T-shirt numbers is as follows:\n\n1, 2, 2, 3, 4, 1, 1, 1, 1,\
    \ 1, 1\n\nIf we arrange it in form of table:\n\n![](OEBPS/images/3.jpg)\n\nThus\
    \ the mode in above example is 1 which happens to have maximum frequency of 7.\
    \ This can be easily determined from histogram as shown in the following screenshot:\n\
    \n![](OEBPS/images/4.jpg)\n\n**Median:** This is the middle value which is obtained\
    \ by ordering the values/scores in ascending order. If the middle value happens\
    \ to have two numbers then the average is taken as such:\n\n**For example:**\n\
    \nMedian of 2, 3, 4, 5, 6 happens to be 4.\n\nMedian of 2, 3, 4, 5 happens to\
    \ be average of 3 and 4 which is 3.5.\n\nMedian is least affected by outliers.\n\
    \n**Mean:** Represents mathematical average which is sum of all the elements divided\
    \ by number of elements.\n\nFor example, average strike rate of the batsmen in\
    \ the game of cricket is the average of strike rates in individual matches.\n\n\
    **Range of scores:** Subtraction between the maximum value and minimum value in\
    \ range is called range of scores. This indicates dispersion.\n\n**Trimmed mean:**\
    \ Represents the mean after removing extreme cases from both the end i.e. from\
    \ minimum and maximum end. Both the minimum and maximum values may represent values\
    \ which are not normal and hence represent outlier. So, while fining trimmed mean,\
    \ we specify the percentage of values to be ignored from both the ends. Hence,\
    \ trimmed mean gives better representation of data excluding outlier.\n\n**Interquartile\
    \ range (IQR)**"
  fmt: "\n# 统计学基础概念问答\n\n## Q1: 什么是变量？\n\n**Ans:** 任何持续变化的事物都称为变量。变量有不同类型，主要包括以下几种：\n\
    \n**因变量/结果变量:** 受影响的变量，例如上例中的年温度。\n\n**自变量/预测变量:** 影响结果的变量，例如上例中的森林砍伐、污染等。\n\n\
    ## Q2: 解释分类测量？\n\n**Ans:** 分类测量包含类别，即不同的实体。地球生命分类的例子包括植物、动物等。\n\n## Q3: 解释二元变量？\n\
    \n**Ans:** 二元变量是指只有两个类别的变量，如生或死、男或女、开或关。\n\n## Q4: 解释名义测量？\n\n**Ans:** 名义测量包含两个以上的类别。这些类别也可以是数字。\n\
    \n## Q5: 解释有序变量？\n\n**Ans:** 这些是具有逻辑顺序的名义变量。例子包括板球或足球中的队伍排名、参加年级考试的学生成绩单。\n\n\
    ## Q6: 解释连续变量？\n\n**Ans:** 这些变量可以在测量尺度上取任意值，例如声音的音调，它可以在范围内取任何可能的值。\n\n## Q7:\
    \ 解释离散变量？\n\n**Ans:** 这些变量在范围内只能取固定值。例如，银行里的客户数量。\n\n## Q8: 是否可以将连续值转换为离散值，反之亦然？\n\
    \n**Ans:** 是的，根据研究目的，可以将离散值转换为连续值，反之亦然。例如，水箱中的水位可以在范围内取任意值，因此是连续变量。\n\n但我们可以将其近似为三个不同的水平，如空、满或半满，这现在就变成了离散性质。\n\
    \n## Q9: 什么是区间变量？\n\n**Ans:** 这些是按区间分组的变量。例如年龄可以划分为 10-20、20-30 等范围，特定年龄的人会被放入上述组别之一。当区间相等时，它们代表被测量属性的等量差异。\n\
    \n## Q10: 什么是比率变量？\n\n**Ans:** 这是区间变量的一个子类型，用比率尺度进行测量。\n\n例如化学中水的表示是 `H₂O`，代表两个氢分子和一个氧分子。因此，元素的比率是\
    \ 2:1。\n\n## Q11: 什么是单变量和双变量？\n\n**Ans:** **单变量:** 当考虑的变量只有一个时，称为单变量研究。\n\n**双变量:**\
    \ 涉及两个变量之间关系的研究。\n\n## Q12: 什么是测量误差？\n\n**Ans:** 以数字形式表示的测量值与实际值之间的差异称为测量误差。\n\
    \n例如：从商贩处按公斤购买水果时，如果我们想要 1 公斤水果，商贩的秤显示 1 公斤。但如果在另一台机器上检查，测量值比预期少 0.1 公斤，这个差异就是我们所说的测量误差。\n\
    \n## Q13: 解释效度？\n\n**Ans:** 效度意味着一种工具是否测量了它应该测量的内容。\n\n## Q14: 解释信度？\n\n**Ans:**\
    \ 信度意味着仪器在不同条件下是否给出一致的结果。\n\n例如，如果我们在同一实体上用同一数值测试两次，如果仪器要可靠，则结果应保持不变。这种测试称为重测信度。\n\
    \n## Q15: 检验假设有哪些不同方法？\n\n**Ans:** 检验假设主要有两种方法：\n\n1.  **相关研究**\n    *   也称为横截面研究\n\
    \    *   通过观察自然模式或发生来进行检验\n    *   原始发生不被操纵\n\n2.  **实验研究**\n    *   选择感兴趣的变量\n\
    \    *   操纵环境的某些方面\n    *   观察对选定变量的影响\n\n## Q16: 解释不同类型的变异？\n\n**Ans:** 变异主要有两种类型，说明如下：\n\
    \n**系统变异:**\n*   由实验者引入\n*   参与者在不同条件下接受测试，条件差异由实验者引入\n\n例如：为测试羊毛衣物使用与温度的关系，我们可以让一组\
    \ 20 人分别在炎热和寒冷的气候下测试。因此，此处引入的差异仅在于温度。\n\n**非系统变异:**\n*   由实验条件之间存在的随机因素引入\n* \
    \  例如：为测试羊毛衣物使用与温度的关系，我们测试一组 20 人。选定组中有些人可能因疾病等因素表现出与预期不同的行为。\n\n## Q17: 解释重复测量设计？\n\
    \n**Ans:** 在同一组参与者身上，在不同条件下测量同一指标。\n\n两种条件的差异可能由以下原因引起：\n*   对参与者实施的操纵/变化\n* \
    \  可能影响参与者从一次表现到下一次表现方式的因素\n\n## Q18: 什么是独立设计？\n\n**Ans:** 在不同参与者组上，在不同条件下测量同一指标。\n\
    \n两种条件之间的差异可能由以下原因引起：\n*   对参与者实施的操纵/变化\n*   每种情况下参与者本质或特征的差异\n\n## Q19: 解释随机化在变异方面的作用？\n\
    \n**Ans:** 通过使用随机化，我们可以确保引入的任何变异是由于条件/变量的变化，而不是过程中的其他意外变化。因此，它有助于消除其他系统变异来源。\n\
    \n## Q20: 解释各种汇总度量？\n\n**Ans:** **众数:** 表示数据集中出现频率最高的值/分数。\n\n例如：足球运动员进球数按球衣号码统计如下：\n\
    \n1, 2, 2, 3, 4, 1, 1, 1, 1, 1, 1\n\n若整理成表格：\n\n![](OEBPS/images/3.jpg)\n\n上例中众数为\
    \ 1，频率最高为 7。这可以从直方图轻松确定，如下截图所示：\n\n![](OEBPS/images/4.jpg)\n\n**中位数:** 将值/分数按升序排列后得到的中间值。如果中间值有两个数字，则取其平均值：\n\
    \n**例如：**\n\n2, 3, 4, 5, 6 的中位数是 4。\n\n2, 3, 4, 5 的中位数是 3 和 4 的平均值，即 3.5。\n\n\
    中位数受异常值影响最小。\n\n**平均数:** 表示数学平均值，即所有元素之和除以元素个数。\n\n例如，板球比赛中击球手的平均击球率是各场比赛击球率的平均值。\n\
    \n**分数范围:** 范围内最大值与最小值之差称为分数范围。这表示离散程度。\n\n**截尾平均数:** 表示去除两端极端情况（即最小端和最大端）后的平均值。最小值和最大值可能代表不正常的值，即异常值。因此，在计算截尾平均数时，我们指定从两端忽略的值的百分比。因此，截尾平均数能更好地代表排除异常值后的数据。\n\
    \n**四分位距 (IQR)**\n"
