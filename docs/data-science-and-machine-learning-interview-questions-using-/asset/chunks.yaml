    \ deployment environment we can make use of setup.py which stores the dependencies\
    \ on various modules which were used in project.\n\n[Q91: Is it possible to make\
    \ connections to database using Python?](#toc.xhtml#c02q91a)\n\n*Ans:* Python\
    \ supports connection to database with Db-Api modules.\n\nThe mechanism to query\
    \ remains same but difference lies in the classes to be imported to suit various\
    \ databases."
