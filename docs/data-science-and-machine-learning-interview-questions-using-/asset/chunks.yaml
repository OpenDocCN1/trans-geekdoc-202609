- raw: "It is a measure of variability, based on dividing a data set into quartiles.\n\
    \nQuartiles are the three values that split the sorted data into four equal parts:\n\
    \n*   Q1 is the *middle* value in the first half of the rank-ordered data set\n\
    \n*   Q2 is the *median* value in the set\n\n*   Q3 is the *middle* value in the\
    \ second half of the rank-ordered data set\n\nThe interquartile range is equal\
    \ to Q3 minus Q1.\n\nThe lower quartile is the median of the lower half of the\
    \ data.\n\nThe upper quartile is the median of the upper half of the data.\n\n\
    **Mean absolute deviation:** Represents the mean of the absolute value of the\
    \ deviations from the mean.\n\n**Mean absolute deviations from median:** Represented\
    \ by absolute value of the deviations from the median.\n\n**Outliers:** Represents\
    \ the value which are not normal or within the range and hence data which is corrupted\
    \ at the time of capture or due to some other reasons. Since it affects all while\
    \ finding the mean and other summary values they need to represent this data properly.\n\
    \n[Q22: Explain alternate hypotheses and null hypotheses.](#toc.xhtml#c01q22a)\n\
    \n*Ans:* **Alternative hypotheses:**\n\n*   Also called experimental hypotheses\n\
    \n*   Denoted by H[1]\n\n*   It assumes that effect as per prediction would exist\
    \ in the conclusion\n\n**Null hypotheses:**\n\n*   Denoted by H[0]\n\n*   It assumes\
    \ that effect as per prediction would not exist in the conclusion\n\n*   Thus,\
    \ this represents opposite of alternative hypotheses\n\n[Q23: What is p value?](#toc.xhtml#c01q23a)\n\
    \n*Ans:* It measures the strength of evidence in support of null hypotheses. If\
    \ this value is less than significance level then null hypotheses is accepted,\
    \ else rejected.\n\nThe range of values that leads the researcher to accept the\
    \ null hypothesis is called the region of acceptance.\n\nThe region other than\
    \ acceptance is called region of rejection.\n\n[Q24: What happens when null hypotheses\
    \ is rejected?](#toc.xhtml#c01q24a)\n\n*Ans:* When a null hypothesis is rejected,\
    \ it becomes Type 1 error. The probability of Type 1 error occurring is called\
    \ significance level.\n\n[Q25: Explain directional and non-directional hypotheses.](#toc.xhtml#c01q25a)\n\
    \n*Ans:* **Directional hypotheses:**\n\n*   Gives an indication whether the effect\
    \ which is being studied would grow positively or negatively\n\n*   One tailed\
    \ test is generally used for such cases\n\n**Non directional hypotheses:**\n\n\
    *   Does not give indication of whether the effect which is being studied would\
    \ grow positively or negatively\n\n*   Two tailed test is generally used for such\
    \ cases\n\n[Q26: Explain fit of model?](#toc.xhtml#c01q26a)\n\n*Ans:* It represents\
    \ the degree till which the determined statistical model represents the data.\n\
    \nFit of model can represent either under fit, over fit, or perfect fit as such.\n\
    \nA model which is good fit would have low variance between the calculated value\
    \ and measured value.\n\n[Q27: What is relation between sample and population?](#toc.xhtml#c01q27a)\n\
    \n*Ans:* Samples are subset or part of original data or population. If population\
    \ is very big hence performing analysis on the whole population as such is not\
    \ easy. Hence, a subset of population data is taken which is known as sample data.\n\
    \nWhether the sample data is true representation of original data set considered\
    \ is determined with the help of estimation, confidence interval, and so on.\n\
    \n![](OEBPS/images/5.jpg)\n\n[Q28: What is estimation?](#toc.xhtml#c01q28a)\n\n\
    *Ans:* By using information available from sample, we can make inferences w.r.t.\
    \ population, which is what is known as estimation. Parameters used are mean,\
    \ standard deviation, and so on.\n\n[Q29: Explain deviation score?](#toc.xhtml#c01q29a)\n\
    \n*Ans:* This is defined as the difference between actual score/value and mean.\n\
    \n[Q30: Explain variance?](#toc.xhtml#c01q30a)\n\n*Ans:* Variance is the average\
    \ error between the mean and the measured values.\n\nIt indicates the difference\
    \ between the average value calculated and the observed value as such.\n\nIt is\
    \ an indication of how different individuals in group differ or vary from each\
    \ other.\n\nThe population variance is given:\n\nPV = Σ (Xi - X)2 / N\n\n*   PV\
    \ is the population variance\n\n*   X is the population mean\n\n*   Xi is the\
    \ i^(th) element from the population\n\n*   N is the number of elements in the\
    \ population\n\n    The sample variance is given by:\n\n    SV = Σ (xi – x)2 /\
    \ (n – 1)\n\n*   SV is the sample variance\n\n*   x is the sample mean\n\n*  \
    \ xi is the i^(th) element from the sample\n\n*   n is the number of elements\
    \ in the sample\n\n[Q31: Explain Standard deviation.](#toc.xhtml#c01q31a)\n\n\
    *Ans:* Square root of the variance is also called standard deviation.\n\nThis\
    \ is done to keep the measurement same as original one.\n\nThey indicate the nearness\
    \ of the points measured w.r.t. mean.\n\nSmaller the standard deviation will be\
    \ more nearer to mean and vice versa.\n\n[Q32: Explain standard error.](#toc.xhtml#c01q32a)\n\
    \n*Ans:* Standard error indicates how well a sample represents the original population.\
    \ When we break the original population into various small samples, we would like\
    \ to know the difference between the sample considered and original population.\
    \ This is represented by standard error.\n\nThe smaller the standard error, the\
    \ closer or true representation of original population.\n\nSE = Σ (sample mean\
    \ – overall population mean)2 / (number of samples)\n\n[Q33: What is precision?](#toc.xhtml#c01q33a)\n\
    \n*Ans:* It refers to the closeness between estimates from different samples.\
    \ Thus indicating the opposite of standard error and are inversely related to\
    \ Standard error.\n\n[Q34: Explain confidence intervals.](#toc.xhtml#c01q34a)\n\
    \n*Ans:* This indicates the boundaries in which the mean value will fall.\n\n\
    It is a range of scores constructed, such that the population mean will fall within.\n\
    \nThey are limits constructed such that for a certain percentage of the time the\
    \ true value of the population mean will fall within these range.\n\n[Q35: Explain\
    \ confidence level.](#toc.xhtml#c01q35a)\n\n*Ans:* Refers to the percentage of\
    \ all possible samples that can be expected to include the true population parameter.\n\
    \n[Q36: Explain alpha.](#toc.xhtml#c01q36a)\n\n*Ans:* Alpha is defined as 1-confidence\
    \ interval. This implies probability that the true value remains outside the confidence\
    \ interval. If confidence interval is 99% then alpha is 1-99% which is 0.01.\n\
    \n[Q37: Explain Beta.](#toc.xhtml#c01q37a)\n\n*Ans:* The probability of committing\
    \ Type 2 error is called beta. Type 2 error is one in which a rejected null hypotheses\
    \ is accepted. The probability of avoiding Type 2 error is called power of test.\n\
    \n[Q38: Explain Accuracy.](#toc.xhtml#c01q38a)\n\n*Ans:* It indicates how much\
    \ does sample value or parameters matches with the population statistic. If the\
    \ value of mean of both sample and population are exactly equal then we can say\
    \ that the sample is fully accurate. If not fully equal then we say that sample\
    \ is accurate by n limit where n is the difference between sample and population.\n\
    \n[Q39: Explain Bias.](#toc.xhtml#c01q39a)\n\n*Ans:* Bias indicates whether the\
    \ estimation of sample is over fit or under fit w.r.t. population data. For e.g.\
    \ if the population mean is 4 and sample mean calculated is 3 then this is under\
    \ estimate bias. Such estimate in which both sample and population parameter is\
    \ not equal are called bias estimate.\n\n[Q40: What is central limit theorem?](#toc.xhtml#c01q40a)\n\
    \n*Ans:* It states that the distribution of the mean of any independent, random\
    \ variable can be approximated to normal if the sample size is large enough.\n\
    \nGenerally, the sample size of above 30 or sometimes 40 is taken as reference.\n\
    \nThis all ows us to approximate bigger samples to normal distribution without\
    \ having to take hundreds or thousands of distribution.\n\nStandard Normal distribution\
    \ is preferred as such because mean is equal to zero and variance is one.\n\n\
    ![](OEBPS/images/6.jpg)\n\n[Q41: Explain Absolute value?](#toc.xhtml#c01q41a)\n\
    \n*Ans:* Absolute value is positive value or magnitude irrespective of its initial\
    \ sign."
