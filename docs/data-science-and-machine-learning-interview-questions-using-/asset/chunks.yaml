    # 统计假设检验


    ## 独立样本 Student''s t 检验


    它检验两个独立样本的均值是否存在显著差异。


    ### 输入假设


    所有假设均针对观测值。


    *   它们是独立同分布的。

    *   它们服从正态分布。

    *   它们具有相同的方差。


    ### 输出假设


    *   H0：样本的均值相等

    *   H1：样本的均值不相等


    ```python

    import scipy.stats as ss


    stat, p = ss.ttest_ind(data1, data2)

    ```


    ## 配对样本 Student''s t 检验


    检验两个配对样本的均值之间是否存在显著差异。


    ### 输入假设


    *   每个样本中的观测值是独立同分布的

    *   每个样本中的观测值服从正态分布

    *   每个样本中的观测值具有相同的方差

    *   各样本之间的观测值是配对的


    ### 输出假设


    *   H0：样本的均值相等

    *   H1：样本的均值不相等


    ```python

    import scipy.stats


    stat, p = scipy.stats.ttest_rel(data1, data2)

    ```


    ## 方差分析检验 (ANOVA)


    它检验两个或多个独立样本的均值是否存在显著差异。


    ### 输入假设


    所有假设均针对观测值：


    *   它们是独立同分布的。

    *   它们服从正态分布。

    *   它们具有相同的方差。


    ### 输出假设


    *   H0：样本的均值相等。

    *   H1：一个或多个样本的均值不相等。


    ```python

    import scipy.stats


    stat, p = scipy.stats.f_oneway(data1, data2, ...)

    ```


    ---


    ## Q5：解释如何进行非参数统计假设检验。


    **答：** Mann-Whitney U 检验：


    它检验两个独立样本是否相等。


    ### 输入假设


    所有假设均针对观测值：


    *   它们是独立同分布的。

    *   它们可以被排序。


    ### 输出假设


    *   H0：两个样本的分布相等。

    *   H1：两个样本的分布不相等。


    ```python

    import scipy.stats


    stat, p = scipy.stats.mannwhitneyu(data1, data2)

    ```


