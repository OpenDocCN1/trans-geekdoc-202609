    \ = b 求 x。\n*   **linalg.lstsq(a, b[, rcond])**：返回线性矩阵方程的最小二乘解。\n*   **linalg.inv(a)**：计算矩阵的（乘法）逆矩阵。\n\
    *   **linalg.pinv(a[, rcond])**：计算矩阵的（Moore-Penrose）伪逆矩阵。\n*   **linalg.tensorinv(a[,\
    \ ind])**：计算 N 维数组的“逆”。\n\n### Q17：如何将内存中的 numpy 数据保存到平面文件？\n\n*答*：numpy 数据可以存储在\
