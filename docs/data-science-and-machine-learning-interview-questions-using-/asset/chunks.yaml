    # Statistical Hypothesis Tests


    ## Independent Student''s t-test


    It tests whether the means of two independent samples are significantly different.


    ### Input assumptions


    All assumptions are made w.r.t observation.


    *   They are independent and identically distributed (iid).

    *   They are normally distributed.

    *   They have the same variance.


    ### Output assumptions


    *   H0: the means of the samples are equal

    *   H1: the means of the samples are unequal


    ```python

    import scipy.stats as ss


    stat, p = ss.ttest_ind(data1, data2)

    ```


    ## Paired Student''s t-test


    Tests whether the significant difference exists between the means of two paired
    samples.


    ### Input assumptions


    *   Observations in each sample are independent and identically distributed

    *   Observations in each sample are normally distributed

    *   Observations in each sample have the same variance

    *   Observations across each sample are paired


    ### Output assumptions


    *   H0: the means of the samples are equal

    *   H1: the means of the samples are unequal


    ```python

    import scipy.stats


    stat, p = scipy.stats.ttest_rel(data1, data2)

    ```


    ## Analysis of Variance Test (ANOVA)


    It tests whether the means of two or more independent samples are significantly
    different.


    ### Input assumptions


    All assumptions are made w.r.t observation:


    *   They are independent and identically distributed (iid).

    *   They are normally distributed.

    *   They have the same variance.


    ### Output assumptions


    *   H0: the means of the samples are equal.

    *   H1: one or more of the means of the samples are unequal.


    ```python

    import scipy.stats


    stat, p = scipy.stats.f_oneway(data1, data2, ...)

    ```


