    [Q51: Write a simple Lambda expression?](#toc.xhtml#c02q51a)


    *Ans:* `sumlambda = lambda x, y : x + y`


    `print(sumlambda(2, 3))`


    In the above example, we have defined lambda expression which takes two parameters
    and performs the addition. The return result is x+ y but no need to return explicitly
    since it contains single statement only.


    [Q52: Lambda forms in Python contain statements? True or False?](#toc.xhtml#c02q52a)


    *Ans:* Statement is true as lambdas in Python have to be single line expressions.


    [Q53: Explain filter function?](#toc.xhtml#c02q53a)


    *Ans:* The filter function is a utility function which can skip values based on
    some condition.


    ![](OEBPS/images/38.jpg)


    [Q54: Explain steps involved in reading and writing a file?](#toc.xhtml#c02q54a)


    *Ans:* In both the case, three steps are involved.


    1.  Opening the file.


    2.  Reading or writing the file using corresponding functions (read or write).


    3.  Closing the file.


    Write example:


    `a =open(‘hello.txt’,’a’) # opens a file in write mode`


    `a.write(‘welcome to files with python’) # writes this line in file`


    `a.close() # closes the file`


    The above code writes the welcome message to **hello.txt** file.


    Read example:


    `a =open(‘hello.txt’,’r’) # opens a file in read mode`


    `text = a.read() # reads the entire contents of file in memory`


    `print(text) #prints the read text`


    `a.close()# closes the file`


    [Q55: Explain the term “withstatement”?](#toc.xhtml#c02q55a)


    *Ans:* The **with** statement would be useful whenever there are related operations
    block on each other.


    `with expression [as variable]:`


    `with-block`


    In the above statement, we see that **with** block would be used within the context
    of variable opened with the help of **with** statement.


    `with open(‘output.txt’, ‘w’) as f:`


    `f.write(‘|Python!’)`


    In the above example, the file would be closed as soon as the scope of **with**
    block gets over the advantage of being not to close the file explicitly using
    close block.


    [Q56: Explain the preferred way of reading a big file?](#toc.xhtml#c02q56a)


    *Ans:* ` with open(“sampleread.txt”, “r+”) as ip:`


    `for singleLine in ip:`


    `print(singleLine)`


    The above code opens the file in read mode with the help of with statement. So,
    as soon as file operations get over, the file would be automatically closed.


    Further the above code loads only a single line in memory at a time thus saving
    memory or making it possible to run, this program even with computer having lower
    memory footprint.


    [Q57: Explain modules in Python.](#toc.xhtml#c02q57a)


    *Ans:* Modules both inbuilt and user defined are ways of writing reusable set
    of code or reusing common set of code.


    Python provides set of many inbuilt modules like mathos, sys etc.


    To use a module, we will have to import the same with the help of import statement
    or “from ..import” statement.


    [Q58: Explain different ways of importing modules.](#toc.xhtml#c02q58a)


    *Ans:* Modules can be imported using import statement or *from ..import* statement.


    The difference lies in fact whether we want the entire module or particular part
    of it.


    The *from..import*statement is preferred when we want to import particular module.


    `from math import pi`


    `print(pi)`


    The **import** statement is preferred when the entire module is to be imported.


    `import math`


    `print(math.pi)`


    As you can see in import statement we have to use the module name wherever we
    want to get variables or methods from modules.


    [Q59: Can we create our own module?](#toc.xhtml#c02q59a)


    *Ans:* Yes, we can create our own module. Any Python file itself is a module.


    Consider for example following **mathop.py** file containing following code:


    `def sum(a,b):`


    `return a+b`


    `def sub(a,b):`


    `return (a-b)`


    In another file named **usage.py** we can write the following code:


    `import mathop`


    `print(mathop.sum(99,100))`


    `print(mathop.sub(99,100))`


    `print(dir(mathop))`


    The above code reads from the modules and performs the required operations.


    If the files were in different directory, for example, com folder then we could
    have imported by giving:


    `com.modulename`


    [Q60: Explain in brief about os module and its corresponding functions.](#toc.xhtml#c02q60a)


    *Ans:* os module provides various functions to perform operating system related
    functions especially w.r.t. file operations.


    Following are some of the important functions:


    **os.chdir(“D:/pythoneg/intro/pyFolder”):** It is used to change the current working
    directory.


    **os.mkdir(‘pyFolder’):** It is used to create new directory.


    **os.remove():** It removes a particular file.


    **os.getcwd():** It gets the current working directory.


    **os.environ:** It prints environment related details.


    **os.system(‘ dir>>1.txt’):** It execute a command line related command. For example,
    executes dir command which is windows command prompt command, to list directories.


    **os.walk(dir):** It lists down sub directory and files within a particular directory.


    [Q61: Using os module print the directory structure.](#toc.xhtml#c02q61a)


    *Ans:* `import os`


    `rootDir = ‘D:/nodejstraining/NodeJSExample/NodeJSExample’`


    `for dirName, subdirList, fileList in os.walk(rootDir):`


    `print(‘Found directory: %s’ % dirName)`


    `for fname in fileList:`


    `print(‘\t%s’ % fname)`


    In the above example we print the directory structure with the help of **os.walk**
    function which can list down directory name, sub directory list and file list
    within a particular directory.


    [Q62: Explain dir function.](#toc.xhtml#c02q62a)


    *Ans:* The dir function is used to print various functions which are exposed by
    a module.


    For e.g dir(math) prints all the functions within math module.


    `import math`


    `print(dir(math))`


    **Output:**


    `[‘__doc__’, ‘__loader__’, ‘__name__’, ‘__package__’, ‘__spec__’, ‘acos’, ‘acosh’,
