    (6, 2)\n(4, 3)\n(5, 3)\n(6, 3)\n```\n\n### Q14：解释广播的规则。\n\n*   当两个数组的维度不同时，维度较少的那个数组的形状会通过在其前导（左）侧填充\
    \ 1 来进行调整。\n*   如果两个数组的形状存在差异，在某个维度上不匹配，则该维度会被拉伸以匹配另一个形状为 1 的数组。\n*   如果维度和大小不一致，且两者都不等于\
    \ 1，则会引发错误。\n\n### Q15：解释 numpy 支持的一些统计度量。\n\n*答*：\n\n*   **amin**：按行或按列查找最小值\n\
    *   **mean**：查找给定数据集的平均值\n*   **std**：查找给定数据集的标准差\n*   **var**：查找给定数据集的方差\n* \
    \  **average**：查找加权平均值，其中平均值是根据变量出现的频率计算的\n*   **percentile**：计算各种百分位数区间，主要集中在\
    \ 25%、50% 和 75% 处\n*   **ptp**：计算给定数据集中的峰峰值\n*   **median**：计算给定数据集的中位数\n\n![](img/78.jpg)\n\
    \n```\nprint (np.ptp(a, axis = 0) )\nprint('percentile axis 1')\nprint (np.percentile(a,50,\
    \ axis = 1) )\nprint('percentile axis 0')\nprint (np.percentile(a,50, axis = 0)\
    \ )\nprint('median')\nprint (np.median(a, axis = 0) )\nprint('mean')\nprint (np.mean(a,\
    \ axis = 0) )\na = np.array([1,2,3,4])\nwts = np.array([4,3,2,1])\nprint('average')\n\
    print (np.average(a,weights = wts) )\nprint('std')\nprint (np.std([1,2,3,4]))\n\
    print('var')\nprint (np.var([1,2,3,4]))\n```\n\n**输出：**\n\n```\na\n[[3 7 5]\n\
    \ [8 4 3]\n [2 4 9]]\namin 1\n[3 3 2]\namin 0\n[2 4 3]\nptp\n7\nptp axis 0\n[6\
