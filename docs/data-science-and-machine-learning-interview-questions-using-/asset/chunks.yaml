    [Q69: Explain KNN (K Nearest Neighbour) steps involved, advantage and disadvantage.](#toc.xhtml#c01q69a)


    *Ans:* KNN abbreviation is K Nearest Neighbor and is explained down below:


    *   Not an eager learner i.e. learns lazily


    *   It stores instances of training set.


    *   The output is determined by majority vote which is given by k nearest neighbors
    of each point.


    Steps involved are as follows:


    1.  Calculate the distance.


    2.  Find the closest neighbors.


    3.  Vote for labels.


    **Advantages:**


    *   Much faster.


    *   No need to train a model for generalization.


    *   Can be used for nonlinear data and regression problems.


    **Disadvantages:**


    *   Large memory foot print.


    *   Performance decreases with increase in number of dimensions.


    [Q70: Explain selection bias.](#toc.xhtml#c01q70a)


    *Ans:* Selection bias is the bias introduced by the selection of individuals,
    groups or data for analysis in such a way that proper randomization is not achieved,
    thereby ensuring that the sample obtained is not representative of the population
    intended to be analyzed.


    They are systematic in nature and produced by the measurement or sampling process.


    [Q71: What does selection bias indicate w.r.t. algorithm?](#toc.xhtml#c01q71a)


    *Ans:* It indicates that some important variable has been left off or not considered
    during the algorithm.


    [Q72: What is Bootstrap sample?](#toc.xhtml#c01q72a)


    *Ans:* Bootstrap sample is used to estimate the distribution. A sample taken with
    replacement from an observed data set is called bootstrap sample.


    ![](OEBPS/images/20.jpg)


    [Q73: What is Resampling?](#toc.xhtml#c01q73a)


    *Ans:* Resampling combines shuffling and bootstrapping.


    [Q74: Explain tail.](#toc.xhtml#c01q74a)


    *Ans:* Tail is the portion of frequency distribution where extreme values are
    observed at a very low frequency.


    [Q75: Explain the difference between one way test and two way test.](#toc.xhtml#c01q75a)


    *Ans:* **One-way test**


    It is the hypothesis test where results occur only in one direction.


    **Two-way test**


    It is the hypothesis test where results occur in two directions.


    [Q76: Explain degree of freedom.](#toc.xhtml#c01q76a)


    *Ans:* It indicates how much value from given samples are supposed to vary to
    give the required result.


    In a sample of 5 we can say 4 values can vary if the mean is known and 4 values
    are known.


    [Q77: What is predictive modeling?](#toc.xhtml#c01q77a)


    *Ans:* Prediction modeling involves building a model which will allow predicting
    a result/events/behavior whether value of input variables are given. To find out
    the relationship of input variables and how they affect the output forms the part
    of regression study.


    [Q78: What is time series analysis?](#toc.xhtml#c01q78a)


    *Ans:* Analysis which makes use of data in a particular time interval or periods
    is called time series analysis. Temporal aspects continue in this type of analysis.
    It may involve observation of a variable at different time instances (time series
    data) or collecting different data at same point of time (cross sectional data)
    or a combination of both (pooled data).


    [Q79: What is deep learning?](#toc.xhtml#c01q79a)


    *Ans:* Deep learning makes it possible to learn by existing examples. The models
    are generated by computer by using existing examples.


    The underlying relationship of data can be determined with the help of neural
    network


    Neural network consists of various nodes or computers interconnected to perform
    complex/vast computation.


    To achieve deep learning we require large amount of labeled data set as well as
    large computing capability.


    Again, deep learning is a part of machine learning where the scale of operation
    is much higher.


    ![](OEBPS/images/21.jpg)


    [Q80: What is Convolutional Neural Network?](#toc.xhtml#c01q80a)


    *Ans:* CNN or ConvNet stands for Convolutional neural network, is a type of learning
    in which model learns to perform classification of models. It eliminates the need
    to perform manual feature extraction. It allows this with the help of many layers
    many of which can be hidden.


    [Q81: What are different ways to determine optimal value of clusters?](#toc.xhtml#c01q81a)


    *Ans:* **Elbow method:** makes use of sum of squares of each cluster is calculated.
    The calculated values is then plotted in the form of graph. The best solution
    is selected based on graph by looking at the slope


    **Gap method:** This makes use of gap value which is determined by looking at
    the variation between clusters for various values of k under null reference


    **Silhouette method:** makes use of silhouette average to compute the best performing
    cluster. The above average is determined by looking at consistency within cluster


    [Q82: What are various distance related functions for similarity measures?](#toc.xhtml#c01q82a)


    *Ans:* Some of the common ones are Euclidean Distance, Cosine Similarity, Pearson’s
    Coefficient and Jaccard Similarity.


