    \ name of the variable can be anything but it always represents the object. The\
    \ self is the preferred and a general practice naming convention.\n\n[Q68: Explain\
    \ inheritance in Python.](#toc.xhtml#c02q68a)\n\n*Ans:* Python supports inheritance\
    \ with classes. A class extending another class needs to use ().\n\nAlso, super\
    \ method needs to be used to call base class constructor and methods.\n\n![](OEBPS/images/42.jpg)\n\
    \n[Q69: How to determine whether a particular class is sub class?](#toc.xhtml#c02q69a)\n\
    \n*Ans:* **issubclass(ChildClass,ParentClass)**\n\nThe above function would return\
    \ true only if the **ChildClass** has inherited from **ParentClass**.\n\n[Q70:\
    \ Does Python support multiple inheritance?](#toc.xhtml#c02q70a)\n\n*Ans:* Yes,\
    \ Python supports multiple inheritance.\n\nA particular class can extend from\
    \ any number of super classes.\n\nclass Child(Parent1,Parent2,…..,ParentN):\n\n\
    [Q71: How is diamond problem resolved in case of Python?](#toc.xhtml#c02q71a)\n\
    \n*Ans:* Diamond problem occurs whenever Child class inherits same method with\
    \ different body from two different parents.\n\nIn the case of Python this is\
    \ resolved by order in which parent is inherited. Parent which is inherited first\
    \ is given more importance. In the following example we have two parents both\
    \ having hello method.\n\n![](OEBPS/images/43.jpg)\n\n[Q72: Does Python support\
    \ private method and variables?](#toc.xhtml#c02q72a)\n\n*Ans:* Private method\
    \ and variables are supported in Python. Any variable or method having \\_\\_\
    \ becomes private in nature and cannot be accessed directly by using object.\n\
    \nTo get their value we will have to use class name reference from the object.\n\
    \nThe main aim of these variables and functions is to ensure that the sub classes\
    \ do not accidentally override them.\n\n[Q73: Can \\_\\_ be used for other purpose\
    \ than creating private variables or functions?](#toc.xhtml#c02q73a)\n\n*Ans:*\
    \ \\_\\_ has many use cases.\n\nFollowing are some of them:\n\n1.  Ignoring while\
    \ assigning values from tuples or list.\n\n    `a, _, b = (11, 220,54)`\n\n  \
    \  In the above example, a gets value 11 and b gets 54. The \\_\\_ is used for\
    \ ignoring the central value 220.\n\n2.  Used to separate numbers *no = 3\\_200*.\
    \ This gives better understanding and readability. The number represented here\
    \ is 3200.\n\n[Q74: Does Python support abstract classes?](#toc.xhtml#c02q74a)\n\
    \n*Ans:* Python supports abstract classes with the help of module named **abc**.\n\
    \nAn abstract class contains abstract functions and cannot be instantiated.\n\n\
    The abc module contains ABC which stands for Abstract base class and abstract\
    \ method to do necessary things.\n\n![](OEBPS/images/44.jpg)\n\nThe classes which\
    \ extend the above class have to give body to abstract method else even they cannot\
    \ be instantiated.\n\n[Q75: Differentiate between static methods and class methods\
    \ in Python.](#toc.xhtml#c02q75a)\n\n*Ans:*\n\n![](OEBPS/images/45.jpg)\n\n[Q76:\
    \ What are named tuple?](#toc.xhtml#c02q76a)\n\n*Ans:* Named tuple allows us to\
    \ create classes at run time with attributes.\n\n![](OEBPS/images/46.jpg)\n\n\
    [Q77: How to sort using lamdas?](#toc.xhtml#c02q77a)\n\n*Ans:*\n\n![](OEBPS/images/47.jpg)\n\
    \n[Q78: Explain Generators?](#toc.xhtml#c02q78a)\n\n*Ans:* Generators are used\
    \ to save memory as they store only some values in memory at a time rather than\
    \ storing entire dataset in memory.\n\nGenerators make use of yield function which\
    \ stores the previous state to remember.\n\nGenerators are invoked using next\
    \ function.\n\nFor example, if we want to process the entire file having million\
    \ records, generator function would bring only one record at a time in the memory.\n\
    \n![](OEBPS/images/48.jpg)\n\n[Q79: What is generator expression?](#toc.xhtml#c02q79a)\n\
    \n*Ans:* The above generators concept can also be applied to expressions.\n\n\
    ![](OEBPS/images/49.jpg)\n\n[Q80: When Python program exits, all the memory is\
    \ released? Say true or false?](#toc.xhtml#c02q80a)\n\n*Ans:* **The answer is\
    \ false because** objects that are referenced from global namespaces of Python\
    \ modules are not always de-allocated when Python exits.\n\n[Q81: Can a function\
    \ be passed as parameter to another function?](#toc.xhtml#c02q81a)\n\n*Ans:* Yes,\
    \ it is possible to do the same in Python.\n\n![](OEBPS/images/50.jpg)\n\n[Q82:\
    \ Can a function be retuned as result from another function?](#toc.xhtml#c02q82a)\n\
    \n*Ans:* Yes, the result of a function can be another function.\n\n![](OEBPS/images/51.jpg)\n\
    \n[Q83: Explain decorator function.](#toc.xhtml#c02q83a)\n\n*Ans:* Decorator function\
    \ allows performing wrapper around a function. It acts as an interceptor which\
    \ allows performing pre-processing and post-processing.\n\n![](OEBPS/images/52.jpg)![](OEBPS/images/53.jpg)\n\
    \n[Q84: How can we represent big text in Python?](#toc.xhtml#c02q84a)\n\n*Ans:*\
    \ Representation of big text is quite simple w.r.t. Python, unlike other programming\
    \ language.\n\n![](OEBPS/images/54.jpg)\n\n[Q85: What is PEP 8?](#toc.xhtml#c02q85a)\n\
    \n*Ans:* PEP 8 is a coding convention, a set of recommendation, about how to make\
    \ your Python code more readable. It can be said as globally accepted standards\
    \ for Python programming.\n\n[Q86: What is anaconda?](#toc.xhtml#c02q86a)\n\n\
    *Ans:* Anaconda is easy to use distribution which comes bundled up with lot of\
    \ modules used in data science world. It provides a packaged environment to get\
    \ started easily. It also manages dependencies.\n\n[Q87: How to install external\
    \ modules?](#toc.xhtml#c02q87a)\n\n*Ans:* External modules can be easily installed\
    \ with the help of pip tool which comes bundled with Python.\n\nThe command to\
    \ execute is **python –m pip install module name**.\n\n`For e.g. python –m pip\
    \ install numpy`\n\nIn anaconda environment we can install with **conda** command.\n\
    \n`conda install --name environment_name module`\n\n[Q88: What is Jupyter notebook?](#toc.xhtml#c02q88a)\n\
    \n*Ans:* Jupyter Notebook is a web application that allows you to create and share\
    \ documents that contain:\n\n*   Python code\n\n*   visualizations\n\n*   explanatory\
    \ text of code\n\nIt can be installed as an external module with the help of **pip**.\n\
    \n`python –m pip install jupyter`\n\nOnce installed, it can be started by executing\
    \ command **jupyter notebook**.\n\nThe above command will start the web server\
    \ with notebook opened on web browser.\n\nNotebooks consist of a linear sequence\
    \ of cells. There are four basic cell types:\n\n*   **Code cells:** Input and\
    \ output of live code that is run in the kernel\n\n*   **Markdown cells:** Narrative\
    \ text with embedded LaTeX equations\n\n*   **Heading cells:** 6 levels of hierarchical\
    \ organization and formatting\n\n*   **Raw cells:** Unformatted text that is included\n\
    \n[Q89: What is pickling and unpickling?](#toc.xhtml#c02q89a)\n\n*Ans:* Pickling\
    \ is the process of converting from Python format to intermediate string formats\
    \ which can be then be stored on file.\n\nUnpickling is the process of bringing\
    \ or loading the stored Python objects back into memory.\n\n[Q90: Explain the\
    \ importance of setup.py?](#toc.xhtml#c02q90a)\n\n*Ans:* The setup.py allows setting\
    \ up dependencies easily. While generating one project, it is quite natural to\
