    **Left merge:**


    In left merge, all data from left side will come and only those matching from
    right would come.


    ![](OEBPS/images/122.jpg)


    **Right merge:**


    In right merge everything from right side comes and only matching in left would
    come else it would come as NaN.


    **print (‘right’,pd.merge(left, right, on=’id’, how=’right’))**


