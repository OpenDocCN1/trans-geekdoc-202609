    `(5, 3)`


    `(6, 3)`


    [Q14: Explain rules of broadcasting.](#toc.xhtml#c03q14a)


    *   Whenever two arrays have different dimensions the shape of the one with fewer
    dimensions is adjusted by padding with ones on its leading (left) side.


    *   If there is a difference in the shape of the two arrays, it does not match
    in any dimension, then dimension is stretched to match the other shape for that
    array with shape one.


    *   An error is raised in case the dimension and sizes disagree, and neither is
    equal to 1.


    [Q15: Explain some statistical measures supported by numpy.](#toc.xhtml#c03q15a)


    *Ans*: **amin:** Find the minimum value row wise or column wise


    **mean:** Finds the mean value of given dataset


    **std:** Finds standard deviation of given dataset


    **var:** Finds variance of given dataset


    **average:** Finds weighted average in which average is calculated based upon
    frequency of occurrence of variables


    **percentile:** Calculates various percentile intervals mostly around 25,50 and
    75%


    **ptp:** Calculates peak to peak values in a given dataset


    **median:** Calculates median from given dataset


    ![](OEBPS/images/78.jpg)


    `print (np.ptp(a, axis = 0) )`


