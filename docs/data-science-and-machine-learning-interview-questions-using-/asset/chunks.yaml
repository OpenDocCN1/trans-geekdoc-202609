    ### Q20: Explain Gradient boosting?


    **Ans:** Gradient boosting makes use of the trained sequence model. It makes use
    of Gradient descent function, which calculates the local minimum of a given function.
    Thus we try to find the local minimum function for loss.


    The procedure is to construct new learners who are also known as the base and
    which can be correlated with negative gradient descent of the loss function:


    ```python

    from sklearn.ensemble import GradientBoostingClassifier  # For Classification

    # from sklearn.ensemble import GradientBoostingRegressor  # For Regression


    classifier = GradientBoostingClassifier(n_estimators, learning_rate, max_depth)

    classifier.fit(X_train, y_train)

    ```


    *   **`n_estimators`:** indicates the number of weak learners

    *   **`learning_rate`:** determines the contribution of weak learners in the final
    combination

    *   **`max_depth`:** maximum depth of the individual regression estimators. This
    limits the number of nodes in the tree.


    ### Q21: Explain XGBoost?


    **Ans:** The **XGBoost**, also known as eXtreme Gradient Boosting, is a set of
    algorithms/library for developing fast and high-performance gradient boosting
    tree models.


    It makes use of the gradient boosting framework.


    Some of the features are:


    *   Automatic handling of missing data values.

    *   Parallelization of tree construction is possible.

    *   Makes use of the second partial derivatives of the loss function. This is
    the major difference as compared to other gradient algorithms. While other algorithms
    make use of loss function which is first order derivative, XGB makes use of second
    order derivative which also gives the direction of the gradient.

    *   Advanced regularization techniques are used.


    Sample snippet:


