    ip6 = np.arange((5))\nprint(ip6)\n```\n\n**输出：**\n\n```\n[0 1 2 3 4]\n```\n\n\
    Q6: 如何改变对象的形状？\n\n*答：* 对象的形状可以通过 `shape` 属性或 `reshape` 方法来改变。\n\n**Shape 属性：**\n\
    \n```\n![](img/69.jpg)\n```\n\n**输出：**\n\n```\nshape (2, 3)\n```\n\n修改前，\n\n```\n\
    [[1 2 3]\n [4 5 6]]\n```\n\n修改后，\n\n```\n[[1 2]\n [3 4]\n [5 6]]\n```\n\n**reshape：**\n\
    \n允许根据指定的维度来改变形状。\n\n```\na = np.array([[1,2,3],[4,5,6]])\nb = a.reshape(3,2)\n\
    print('reshape', b)\n```\n\n**输出：**\n\n```\n[[1 2]\n [3 4]\n [5 6]]\n```\n\nQ7:\
    \ Python 支持哪些数据类型？\n\n*答：*\n\n*   `int8`, `uint8` `i1`, `u1`\n*   `int16`, `uint16`\
    \ `i2`, `u2`\n*   `int32`, `uint32` `i4`, `u4`\n*   `int64`, `uint64` : 有符号和无符号\
    \ 8 位（1 字节）16 位整数类型或 32 位或 64 位整数类型\n*   `float16` `float32` `float64`, `float128`\
    \ 具有 16、32、64 或 128 位的浮点数\n*   `complex64`, `complex128`, `complex256` 由两个 32、64\
    \ 或 128 位表示的复数\n*   `bool` `?` : 存储 True 和 False 值的布尔类型\n*   `object` `O` : Python\
    \ 对象类型\n*   `string_` `S` : 固定长度字符串类型（每字符 1 字节）\n*   `unicode_` `U` : 固定长度 unicode\
    \ 类型（特定平台的字节数）\n\nQ8: 解释可以在 numpy 上完成的各种简单数学运算？\n\n*答：*\n\n```\n![](img/70.jpg)\n\
    ```\n\nQ9: 解释 numpy 中的切片操作？\n\n*答：* 切片是指通过行或列或两者从 `numpy` 数组中获取数据。\n\n一维通用切片 `[start:end]`。\n\
    \n起始元素包含在内，结束元素不包含在内。\n\n```\n![](img/71.jpg)\n```\n\n**输出：**\n\n```\n[5 6 7]\n\
    ```\n\n对于 2 维及 2 维以上，我们可以通过行和列索引指定切片。在这种情况下，切片如下：\n\n`[rowStart:rowEnd,columnStart:columnEnd]`\n\
    \n*   如果未指定 `rowStart`，则从零开始\n*   如果未指定 `rowEnd`，则一直延伸到末尾\n*   如果未指定 `columnStart`，则从零开始\n\
    *   如果未指定 `columnEnd`，则一直延伸到末尾\n\n例如：\n\n```\n![](img/72.jpg)\n![](img/73.jpg)\n\
    ```\n\nQ10: 解释布尔索引？\n\n*答：* 布尔索引根据某个条件返回 True 或 False。\n\n考虑以下包含名字的 numpy 数组。\n\
    \n```\n![](img/74.jpg)\n```\n\n**输出：**\n\n```\n[False True False False True]\n\
    ```\n\n```\n![](img/75.jpg)\n```\n\n布尔索引也可以被掩码化，即可以包含多个条件。\n\n`(names == 'Rahul')\
    \ | (names == 'Raj')`\n\n上述代码对 Rahul 和 Raj 均返回 true。\n\nQ11: 使用 numpy 执行矩阵乘法？\n\
    \n*答：* 矩阵乘法可以借助 `dot` 函数轻松实现。\n\n```\n![](img/76.jpg)\n```\n\nQ12: 解释 numpy 可用的各种函数？\n\
    \n*答：* `numpy` 支持以下函数。这些函数的优势在于它们作用于 `numpy` 数组的所有元素。\n\n*   **abs, fabs：** 逐元素返回绝对值。Fabs\
    \ 可用于非复数值数据，并具有额外的速度优势。\n*   **sqrt：** 计算每个元素的平方根。\n*   **square：** 计算每个元素的平方。\n\
    *   **exp：** 计算每个元素的指数 ex。\n*   **log：** log10, log2, log1p 分别为自然对数（底数 e）、以 10\
    \ 为底的对数、以 2 为底的对数和 log(1 + x)。\n*   **sign：** 计算每个元素的符号：1（正）、0（零）或 -1（负）。\n* \
    \  **ceil：** 确定每个元素的上取整值。\n*   **floor：** 确定每个元素的下取整值。\n*   **rint：** 将元素四舍五入到最接近的整数，保留\
    \ dtype。\n*   **modf：** 返回给定输入的小数部分和整数部分。\n*   **isnan：** 如果值为 NaN 则返回 true，否则返回\
    \ false。\n*   **isfinite, isinf：** 分别返回 true，指示每个元素是有限还是无限。\n*   **常规和双曲三角函数：**\
    \ cos, cosh, sin, sinh, tan, tanh, arccos, arccosh, arcsin, arcsinh, arctan, arctanh\n\
    *   **maximum, fmax：** 逐元素最大值。fmax 忽略 NaN。\n*   **minimum, fmin：** 逐元素最小值。fmin\
    \ 忽略 NaN。\n*   **mod：** 逐元素取模（除法余数）。\n*   **copysign：** 将第二个参数中值的符号复制到第一个参数的值中。\n\
