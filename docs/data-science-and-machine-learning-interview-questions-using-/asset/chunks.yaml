    \ to the number of independent observations in a sample minus number of population\
    \ parameters to be estimated.\n\n[Q43: Explain cluster sampling.](#toc.xhtml#c01q43a)\n\
    \n*Ans:* In this method the number of clusters or groups to be formed as pre decided\
    \ (generally denoted by N) from population data.\n\n![](OEBPS/images/7.jpg)\n\n\
    The number of elements in each cluster is known and each element from population\
    \ data is assigned to one cluster. For e.g. clustering can be done on attributes\
    \ like customer state.\n\nSampling can be further classified as:\n\n*   **One-stage\
    \ sampling:** All of the elements within selected clusters are included in the\
    \ sample.\n\n*   **Two-stage sampling:** A subset of elements within selected\
    \ clusters is randomly selected.\n\n[Q44: Explain Correlation coefficients?](#toc.xhtml#c01q44a)\n\
    \n*Ans:* Correlation indicates the relationship between two variables.\n\n*  \
    \ As such variables can be positively correlated in which positive change in one\
    \ variable effect the other variable positively.\n\n*   If variables are negatively\
    \ correlated the positive change in one variable affects the other variable negatively.\n\
    \n*   The formula for above is given by:\n\n    *Correlation co-efficient* = Σ(*xy*)/\
    \ *sqrt*\\[(Σ*x*²) \\* (Σ*y*²)\\], where *x* and *y* are variables under consideration.\n\
    \n*   The value of correlation co-efficient ranges from -1 to +1.\n\n[Q45: Explain\
    \ sample space.](#toc.xhtml#c01q45a)\n\n*Ans:* The outcomes of any statistical\
    \ experiment are denoted by sample space. Any outcome from such space is called\
    \ sample point. One or more sample point is called event. When events do not have\
    \ any sample point in common they are known as mutually exclusive event.\n\n[Q46:\
    \ What is non parametric algorithm?](#toc.xhtml#c01q46a)\n\n*Ans:* Non parametric\
    \ algorithm does not make any assumptions on data distribution.\n\n[Q47: How can\
    \ learning be classified?](#toc.xhtml#c01q47a)\n\n*Ans:* Following are the classifications:\n\
    \n*   **Supervised:** \n\n    *   Data is clearly labeled and the algorithms learn\
    \ to predict the output from the input data\n\n    *   Offline analysis of data\
    \ possible\n\n    *   The number of classes are predefined\n\n    *   Accuracy\
    \ is high\n\n    *   Examples include classification and regression\n\n*   **Unsupervised:**\
    \ \n\n    *   Much amount of data is unlabeled and the algorithms learn to inherent\
    \ structure from the input data\n\n    *   Analysis is on real time data\n\n \
    \   *   Number of classes may be unknown\n\n    *   Accuracy ranges from moderate\
    \ to high\n\n    *   Examples include Clustering and Association\n\n*   **Semi-supervised:**\
    \ \n\n    *   A mixture of data having label and no labels forms this one\n\n\
    \    *   Can be considered as intermediate to above two\n\n[Q48: What is classification?](#toc.xhtml#c01q48a)\n\
    \n*Ans:* Classification predictive modeling is the task of approximating a mapping\
    \ function (f) from input variables (X) to discrete output variables (y).\n\n\
    The output variables are often called labels or categories.\n\nThe mapping function\
    \ predicts the class or category for a given observation.\n\n![](OEBPS/images/8.jpg)\n\
    \n[Q49: Explain the steps involved in classification.](#toc.xhtml#c01q49a)\n\n\
    *Ans:*\n\n![](OEBPS/images/9.jpg)\n\n[Q50: What is regression?](#toc.xhtml#c01q50a)\n\
    \n*Ans:* Regression predictive modeling is the task of approximating a mapping\
    \ function (f) from input variables (X) to a continuous output variable (y).\n\
    \nA continuous output variable can be a real-value, such as an integer or floating\
    \ point value and be any measures such as size amount, and so on.\n\nError indicates\
    \ the difference between actual value and predicted value in case of regression\
    \ mostly root mean square error is used w.r.t. regression.\n\n![](OEBPS/images/10.jpg)\n\
    \n[Q51: Explain the similarities and differences between Classification and Regression.](#toc.xhtml#c01q51a)\n\
    \n*Ans:* Differences between classification and regression:\n\n![](OEBPS/images/11.jpg)\n\
    \nThe similarities are that both try to make prediction based on input values.\n\
    \n[Q52: Explain various terms encountered during classification algorithm.](#toc.xhtml#c01q52a)\n\
    \n*Ans:* Classifier is an algorithm that maps the input data to a specific category.\n\
    \n**Classification model:** After analyzing input data, a classification model\
    \ is made. The model can take new data as input and predict the class labels/categories.\n\
    \n**Feature:** A feature is an individual measurable property of a phenomenon\
    \ being observed.\n\n**Binary Classification:** Classification task with two possible\
    \ outcomes.\n\n**Multi class classification:** Classification with more than two\
    \ classes is involved. In multi class classification each sample is assigned to\
    \ one and only one target label.\n\nE.g. an item can be classified as fruit or\
    \ vegetable not both.\n\n**Multi label classification:** Classification task where\
    \ each sample is mapped to a set of target labels having more than one class.\n\
    \nExample: A fruit can be classified as sweet and sour both.\n\n[Q53: Explain\
    \ multi class classification?](#toc.xhtml#c01q53a)\n\n*Ans:* Whenever we have\
    \ more than two, that is, three or more classes to classify it is called multi\
    \ class classification. This is also known as a multi nominal classification.\n\
    \nBy default, all the algorithms of scipy are multi class.\n\nSome of the strategies\
    \ involved are:\n\nOne vs. rest (One vs. all) trains a single classifier per class.\
    \ The samples that match with the class are positive, and that which does not\
    \ match is negative.\n\nOne vs. One:\n\n*   We pick a pair of classes from a set\
    \ of n classes\n\n*   Develop a binary classifier for each selected pair\n\n*\
    \   For n classes, all possible combinations of pairs of classes from n are selected\n\
    \n*   Then, for each pair, we develop a binary support vector machine (SVM)\n\n\
    [Q54: Explain multi label classification?](#toc.xhtml#c01q54a)\n\n*Ans:* Whenever\
    \ we have more than one target variables associated with a problem, we call that\
    \ as multi label classification.\n\nFor example: While classifying fruit, we can\
    \ classify it as fruit, sweet, red-colored, and so on. As we can clearly see,\
    \ we have assigned multi labels to the same object.\n\n[Q55: Explain how multi\
    \ label problem can be solved?](#toc.xhtml#c01q55a)\n\n*Ans:* Following are different\
    \ ways in which it can be achieved:\n\n**Binary relevance:** In this technique,\
    \ we treat each label as a separate single class classification problem.\n\nAchieved\
    \ with the help of skmultilearn.problem\\_transform.BinaryRelevance sample:\n\n\
    `fromskmultilearn.problem_transform import BinaryRelevance`\n\n`classifier = BinaryRelevance(any\
    \ model)`\n\n**Classifier Chains:** A chain of a classifier is formed in which\
    \ input passed to the first classifier is trained and passed on to the next classifier\
    \ and so on.\n\nskmultilearn.problem\\_transform.ClassifierChain is used for this\
    \ purpose:\n\n`fromskmultilearn.problem_transform import ClassifierChain`\n\n\
    `classifier = ClassifierChain(model)`\n\n**Label power set:** In this we try to\
    \ form a single model which would try to solve the multi class model problem.\n\
    \nskmultilearn.problem\\_transform.LabelPowerset is used:\n\n`fromskmultilearn.problem_transform\
    \ import LabelPowerset`\n\n`classifier = LabelPowerset(model)`\n\n[Q56: Explain\
    \ some important metrics with respect to testing a model?](#toc.xhtml#c01q56a)\n\
    \n*Ans:* True positive indicates that the model was able to predict the positive\
    \ outcome correctly. It indicates that the model is able to identify the condition\
    \ when the condition is present.\n\nTrue negative indicates the model is able\
    \ to properly predict the negative class. It indicates that the model does not\
    \ find the condition when the condition is not present.\n\nFalse positive indicates\
    \ the model wrongly predicts the positive class. It indicates that the model finds\
    \ or reports a condition when the condition is not present.\n\nFalse negative\
    \ indicates the model wrongly predicts the negative class. It indicates that the\
    \ model does not report a condition when it is actually present."
