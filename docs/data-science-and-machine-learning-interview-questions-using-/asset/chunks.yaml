    \n    \"1918\",\"28.66\",\"23.57\",\"30.68\",\"31.11\",\"26.77\"\n    ```\n\n\
    2.  研究问题：印度的年温度在上升吗？\n3.  从上述数据集中感兴趣的变量：`ANNUAL`。\n4.  假设：温度在上升。\n5.  分析上述数据集的数据。\n\
    \n    ![分析图表](img/2.jpg)\n\n6.  拟合模型。\n7.  假设被接受或拒绝。\n\n## Q2: 请解释变量及不同类型的变量？\n\
