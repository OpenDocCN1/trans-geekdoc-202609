    ,\"31.33\",\"26.57\"\n    \"1906\",\"28.73\",\"23.03\",\"31.11\",\"30.86\",\"\
    27.29\"\n    \"1907\",\"28.65\",\"24.23\",\"29.92\",\"30.80\",\"27.36\"\n    \"\
    1908\",\"28.83\",\"24.42\",\"31.43\",\"30.72\",\"26.64\"\n    \"1909\",\"28.39\"\
    ,\"23.52\",\"31.02\",\"30.33\",\"26.88\"\n    \"1910\",\"28.53\",\"24.20\",\"\
    31.14\",\"30.48\",\"26.20\"\n    \"1911\",\"28.62\",\"23.90\",\"30.70\",\"31.14\"\
    ,\"26.31\"\n    \"1912\",\"28.95\",\"24.88\",\"31.10\",\"31.15\",\"26.57\"\n \
