    By using the above misclassification rate is calculated.


    Using the weighted sum, the stage value is then calculated.


    Using this, training weights are updated, which gives more weightage to wrongly
    predicted instances and less weightage to properly predicted instances.


    Weak models that are added in the sequence are then trained using the weighted
    training data.

