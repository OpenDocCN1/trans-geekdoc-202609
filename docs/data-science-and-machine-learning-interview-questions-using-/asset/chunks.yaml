    \ 20 Ansari Road, Darya Ganj, New Delhi-110002 and Printed by him at Repro India\
    \ Ltd, Mumbai\n\n# Dedicated to\n\n*Dedicated to Pratyangira, Bala, Durga, Mom,\
    \ Dad, Chitti my aunt, my sister Ishwarya, Sridhar my brother in law and to all\
    \ my mentors especially Shiv without whom this book would still be a dream. Also\
    \ the support extended by Shyam Sir, Khadak and BPB Publications is very much\
    \ appreciated.*\n\n*Durga has been a great inspiration for this book.  \n\nShe\
    \ has always been and will me my encouragement to write more books.*\n\n*Also\
    \ remember Sudarshan as a friend in need.*\n\n*Also dedicated to my students from\
    \ whom I equally learned as I taught them.*\n\n*Along with all the blessing of\
    \ almighty is also remembered here without which even a blade of grass does not\
    \ move*\n\n# About the Author\n\n**Mr Vishwanathan** has twenty years of hard\
    \ code experience in the software industry spanning across many multinational\
    \ companies and domains. Playing with data to derive meaningful insights has been\
    \ his domain and that is what took him towards data science and machine learning.\n\
    \n# Preface\n\nData science is one of the hottest topics mainly because of the\
    \ application areas it is involved and things which were once upon of time, impossible\
    \ with earlier software has been made easy. This book tries to comprehend the\
    \ ocean of data science into small book which is mainly intended to be used as\
    \ last minute revision. Before interview, all the important concepts have been\
    \ given in simple and understand format.\n\nThis book tries to include various\
    \ terminologies and logic used both as a part of Data Science and Machine learning\
    \ for last minute revision. As such you can say that this book acts as a companion\
    \ whenever you want to go for interview.\n\nSimple to use words have been used\
    \ in the given answers for the questions to help ease of remembering and representation\
    \ of same. Examples where ever deemed necessary have been provided so that same\
    \ can be used while giving answers in interview. Author tried to consolidate whatever\
    \ he came across, on multiple interviews that he attended and put the same in\
    \ words so that it becomes easy for the reader of the book to give direction on\
    \ how the interview would be.\n\nWith the number of data science jobs increasing,\
    \ Author is sure that everyone who wants to pursue this field would like to keep\
    \ this book as a constant companion. Soon, Author will be coming shortly with\
    \ a new book on R too, so that it makes a complete data science stack.\n\nHappy\
    \ reading to all the readers, your feedback is highly appreciated.\n\n# Foreword\n\
    \nIt is not wrong to say that today’s dynamic world is driven totally by statistics.\
    \ With decision making becoming important in being successful the use of software\
    \ this task has become common, Thanks to the advancement made with respect to\
    \ technology. While software application always existed for doing the above task,\
    \ the volume and ability of software programmes to represent complex equation\
    \ related to statistics and probability was limited.\n\nThanks to pandas, numpy,\
    \ scipy and sklearn modules of Python, the above problem faced has been removed\
    \ to a great extent and the problem is no more a challenge. With complex mathematical\
    \ concepts easily convertible to algorithms the life of data scientist and analyst\
    \ has become quite easy.\n\nThis book is mainly intended to help people represent\
    \ their answer in a sensible way to the interviewer. The answers have been carefully\
    \ rendered in a way to make things quite simple and yet represent the seriousness\
    \ and complexity of matter. Since data science is incomplete without mathematics\
    \ we have also included a part of the book dedicated to statistics.\n\nPython\
    \ has already taught us that small code does not mean lesser powerful the same\
    \ concept has been adopted to keep the book a powerful weapon for any one attending\
    \ interview.\n\n# [CHAPTER 1](#toc.xhtml#c01)\n\n# [Data Science Basic Questions\
    \ and Terms](#toc.xhtml#c01)\n\n***Note:* \\[Q: Question Number and Ans: Answer\\\
    ]**\n\n[Q1: Explain the steps involved in data science?](#toc.xhtml#c01q1a)\n\n\
    *Ans:* Following are the steps involved:\n\n1.  Get data from various data sources\
    \ available.\n\n2.  Generate research question from data.\n\n3.  Identify variables\
    \ present in data. Also, identify important variables or variables to be analyzed\
    \ as such.\n\n4.  Generate hypothesis.\n\n5.  Analyze data using graph data like\
    \ histogram for example.\n\n6.  Fit a model from analyzed data.\n\n7.  Accept\
    \ or reject the hypothesis.\n\n8.  Research question answer found.\n\n![](OEBPS/images/1.jpg)\n\
    \n**Example of above steps:**\n\n1.  Get data related to temperature for India\
    \ reference [https://data.gov.in/catalog/annual-and-seasonal-maximum-temperature-india](https://data.gov.in/catalog/annual-and-seasonal-maximum-temperature-india)\n\
    \n    A template of data set:\n\n    `“YEAR”,”ANNUAL”,”JAN-FEB”,”MAR-MAY”,”JUN-SEP”,”OCT-DEC”`\n\
    \n    `“1901”,”28.96”,”23.27”,”31.46”,”31.27”,”27.25”`\n\n    `“1902”,”29.22”,”25.75”,”31.76”,”31.09”,”26.49”`\n\
    \n    `“1903”,”28.47”,”24.24”,”30.71”,”30.92”,”26.26”`\n\n    `“1904”,”28.49”,”23.62”,”30.95”,”30.67”,”26.40”`\n\
    \n    `“1905”,”28.30”,”22.25”,”30.00”,”31.33”,”26.57”`\n\n    `“1906”,”28.73”,”23.03”,”31.11”,”30.86”,”27.29”`\n\
    \n    `“1907”,”28.65”,”24.23”,”29.92”,”30.80”,”27.36”`\n\n    `“1908”,”28.83”,”24.42”,”31.43”,”30.72”,”26.64”`\n\
    \n    `“1909”,”28.39”,”23.52”,”31.02”,”30.33”,”26.88”`\n\n    `“1910”,”28.53”,”24.20”,”31.14”,”30.48”,”26.20”`\n\
    \n    `“1911”,”28.62”,”23.90”,”30.70”,”31.14”,”26.31”`\n\n    `“1912”,”28.95”,”24.88”,”31.10”,”31.15”,”26.57”`\n\
    \n    `“1913”,”28.67”,”24.25”,”30.89”,”30.92”,”26.42”`\n\n    `“1914”,”28.66”,”24.59”,”30.73”,”30.84”,”26.40”`\n\
    \n    `“1915”,”28.94”,”23.22”,”31.06”,”31.51”,”27.18”`\n\n    `“1916”,”28.82”,”24.57”,”31.88”,”30.52”,”26.32”`\n\
    \n    `“1917”,”28.11”,”24.52”,”30.06”,”30.24”,”25.74”`\n\n    `“1918”,”28.66”,”23.57”,”30.68”,”31.11”,”26.77”`\n\
    \n2.  Research question, is the annual temperature in India rising?\n\n3.  Variable\
    \ of interest from the above data set ANNUAL.\n\n4.  Hypothesis: Temperature is\
    \ rising.\n\n5.  Analyze data from the above data set.\n\n    ![](OEBPS/images/2.jpg)\n\
    \n6.  Fit the model.\n\n7.  Hypothesis accepted or rejected.\n\n[Q2: Explain variable\
    \ and different types of variables?](#toc.xhtml#c01q2a)"
