  trans: "\n\n# Python 面试问答集锦\n\n## 类方法与实例方法\n\n作为类一部分创建的任何函数，如果是非静态且非类方法，则应将 `self`\
    \ 作为第一个参数，它代表该对象。\n\n以下是创建名为 `Complex` 的类的代码，该类包含两个成员 `real` 和 `img` 以及一个显示函数。\n\
    \n![](img/41.jpg)\n\n### Q67: 类函数的第一个参数必须是 self 吗？我们能不能把它重命名为其他变量？\n\n**答：** 变量的名称可以是任何东西，但它始终代表该对象。`self`\
    \ 是首选且通用的命名约定。\n\n## 继承\n\n### Q68: 解释 Python 中的继承。\n\n**答：** Python 支持类的继承。扩展另一个类的类需要使用\
    \ `()`。\n\n此外，需要使用 `super` 方法来调用基类的构造函数和方法。\n\n![](img/42.jpg)\n\n### Q69: 如何判断某个类是否为子类？\n\
    \n**答：** `issubclass(ChildClass, ParentClass)`\n\n只有当 `ChildClass` 继承自 `ParentClass`\
    \ 时，上述函数才会返回 true。\n\n### Q70: Python 支持多重继承吗？\n\n**答：** 是的，Python 支持多重继承。\n\n\
    一个特定的类可以扩展任意数量的超类。\n\n```python\nclass Child(Parent1, Parent2, ….., ParentN):\n\
    ```\n\n### Q71: Python 中如何解决菱形问题？\n\n**答：** 当子类从两个不同的父类继承具有不同方法体的同名方法时，就会发生菱形问题。\n\
    \n在 Python 中，这通过父类被继承的顺序来解决。先被继承的父类优先级更高。在下面的示例中，我们有两个父类，都拥有 hello 方法。\n\n![](img/43.jpg)\n\
    \n## 私有成员与特殊语法\n\n### Q72: Python 支持私有方法和变量吗？\n\n**答：** Python 支持私有方法和变量。任何带有\
    \ `__` 的变量或方法都变成私有性质，不能通过对象直接访问。\n\n要获取它们的值，我们必须从对象使用类名引用。\n\n这些变量和函数的主要目的是确保子类不会意外覆盖它们。\n\
    \n### Q73: `__` 除了创建私有变量或函数外，还能用于其他目的吗？\n\n**答：** `__` 有许多用例。\n\n以下是其中一些：\n\n\
    1.  在从元组或列表赋值时忽略值。\n\n    ```python\n    a, _, b = (11, 220, 54)\n    ```\n\n\
    \    在上面的示例中，`a` 得到值 11，`b` 得到 54。`__` 用于忽略中间的值 220。\n\n2.  用于分隔数字 `no = 3_200`。这提供了更好的理解和可读性。此处表示的数字是\
    \ 3200。\n\n## 抽象类\n\n### Q74: Python 支持抽象类吗？\n\n**答：** Python 在名为 `abc` 的模块帮助下支持抽象类。\n\
    \n抽象类包含抽象函数且不能被实例化。\n\n`abc` 模块包含 `ABC`（代表抽象基类）和抽象方法，用于执行必要的操作。\n\n![](img/44.jpg)\n\
    \n扩展上述类的类必须为抽象方法提供方法体，否则它们也无法被实例化。\n\n## 静态方法与类方法\n\n### Q75: 区分 Python 中的静态方法和类方法。\n\
    \n**答：**\n\n![](img/45.jpg)\n\n## 命名元组\n\n### Q76: 什么是命名元组？\n\n**答：** 命名元组允许我们在运行时创建带有属性的类。\n\
    \n![](img/46.jpg)\n\n## Lambda 排序\n\n### Q77: 如何使用 lambda 进行排序？\n\n**答：**\n\n\
    ![](img/47.jpg)\n\n## 生成器\n\n### Q78: 解释生成器？\n\n**答：** 生成器用于节省内存，因为它们一次只在内存中存储部分值，而不是将整个数据集存储在内存中。\n\
    \n生成器利用 `yield` 函数来存储先前的状态以便记忆。\n\n生成器通过 `next` 函数调用。\n\n例如，如果我们想要处理一个包含百万条记录的整个文件，生成器函数每次只会将一条记录带入内存。\n\
