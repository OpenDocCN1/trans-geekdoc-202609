    ![](OEBPS/images/12.jpg)


    **Figure 1**


    Recall /Sensitivity / True Positive Rate (also known as TPR) ability to determine
    the condition when the condition is present. It can be found by:


    **True Positive/ (True Positive + False Negative)**


    **Specificity/ True Negative Rate (also known as TNR):** It indicates the ability
    to not detect the condition when the condition is not actually present. It can
    be found by


    **True Negative/ (True Negative + False Positive)**


    **Precision/ Predictive value positive:** This indicates the number of items correctly
    identified as positive from total items True Positive/ (True Positive + False
    Positive)


    **False Positive Rate or Type I Error:** Number of items which are wrongly identified
    as positive from total true negatives


    **False Positive/ (False Positive + True Negative)**


    **False Negative Rate or Type II Error:** This indicates the number of items wrongly
    identified as negative out of total true positives


    **False Negative/ (False Negative + True Positive)**


    [Q57: What is logistic regression?](#toc.xhtml#c01q57a)


    *Ans:* Logistic regression also known as logit model is most useful for understanding
    the influence of several independent variables on a single outcome variable.


    Function representation:


    *p* = 1/1 + *e*^(–(β0 + β1X1 + β2X2… β*n*X*n*))


    It is a kind of predictive analysis.


    In this algorithm, the probabilities describing the possible outcomes of a single
    trial are modeled using a logistic function.


    **Disadvantages:**


    Assumes all predictors are independent of each other which may not always be true.


    Works only when the predicted or output variable is binary.


    [Q58: Explain Naïve Bayes.](#toc.xhtml#c01q58a)


    *Ans:* Naive Bayes algorithm based on Bayes’ theorem with the assumption of independence
    between every pair of features. This implies the predictors are independent of
    each other.


    Let **P(c|x)** is the posterior probability of class (c, target) given predictor
    (**x**, attributes).


    **P(c)** is the prior probability of class.


    **P(x|c)** is the likelihood which is the probability of predictor given class.


    **P(x)** is the prior probability of predictor.


    ![](OEBPS/images/13.jpg)


    **Advantages:**


    *   Are extremely fast


    *   Training set required is less


    *   Performs well for categorical values


    **Disadvantages:**


    *   Zero frequency problems will occur if some of the categories is missed and
    as a result the effect of same would be neglected


    *   Assumes independence of predictors which is not always true in real world


    [Q59: What is Stochastic Gradient Descent?](#toc.xhtml#c01q59a)


    *Ans:* Gradient is an effective method to calculate parameters or co-efficient
    which would cause the cost to minimum. The process involves assuming some value
    as co-efficient and keeping on calculating the slope and adjusting the co-efficient
    till a minimum cost is found.


    But when the logic is applied on very large data set, it becomes slow. Stochastic
    Gradient Descent is used for this purpose. In this, calculation is done based
    on batch instances rather than at the end.


    **Advantages:**


    *   The algorithm is extremely effective


    *   Easy to use


    **Disadvantages:**


    *   Requires large number of parameters


    [Q60: Explain decision tree algorithm.](#toc.xhtml#c01q60a)


    *Ans:* Decision tree


    Generates the set of rules which depends on attributes or features and based upon
    classes.


    A decision tree is an inverse tree.


    The node at the top is called root node and the one without any child is called
    leaves.


    Each part of decision tree represents something which is indicated:


    *   Each attribute/feature is represented by node


    *   Rule or decision is represented by link


    *   Leaf node or node without children represents an the output class


    It uses a recursive approach.


    The aim is to divide the given data to various groups or classes based upon cost
    function.


    **Classification and Regression trees** are also known as **CART**.


    ![](OEBPS/images/14.jpg)


    **Advantages:**


    *   Requires small data preparation


    *   Simple to understand and visualize


    *   Can handle dataset which can contain numbers


    *   Can handle dataset which can contain data in the form of categories


    **Disadvantages:**


    Outliers can have severe effect on output. Changes in input data does have an
    important effect on output.


    [Q61: What is Gini index?](#toc.xhtml#c01q61a)


    *Ans:* The Gini index is the cost function used to evaluate splits in the dataset.


    It gives the measure of impurity.


    How effective is the split of data based upon features can be easily determined
    by Gini index.


    A Gini score of 0 is ideal expected result while one having half-half probability
    is not preferred.


    ![](OEBPS/images/15.jpg)


    [Q62: Is Gini index the only means which can be used in decision tree?](#toc.xhtml#c01q62a)


    *Ans:* Entrophy is another measure which can be used with decision tree.


    [Q63: What is Pruning w.r.t. decision tree?](#toc.xhtml#c01q63a)


    *Ans:* Pruning refers to the removal of branches having low importance in terms
    of classification or regression. The advantages are reduced complexity and reducing
    over fitting.


    The algorithm basically calculates whether removing a particular node causes an
    impact on prediction precision of the tree.


    [Q64: What is random forest?](#toc.xhtml#c01q64a)


    *Ans:* Random forest is a meta-estimator that fits a number of decision trees.


    It makes use of average to improve the ability to predict the model.


    The output from each decision tree is used to finally predict the final model
    and for doing this, it makes use of majority voting. The data is classified on
    the class which has majority voting.


    To generate this forest, sub samples are used and using sub samples from original
    data set sub trees are created.


    ![](OEBPS/images/16.jpg)


    **Advantages:** Over fitting is reduced.


    **Disadvantages:** It’s slow as real time updates take time.


    [Q65: Explain the difference between Random forest and decision tree.](#toc.xhtml#c01q65a)


    *Ans:*


    ![](OEBPS/images/17.jpg)


    [Q66: What is overfitting and underfitting?](#toc.xhtml#c01q66a)


    *Ans:* Following is the explanation for overfitting and underfitting:


    **Overfitting:**


    *   Refers to a model which performs very well w.r.t. training set. Such model
    is able to predict the noise and randomness w.r.t. training set very well but
    would not perform well when it comes to newly arrived data.


    *   Occurs with nonparametric and nonlinear models.


    **Underfitting:**


    *   Refers to a model that does not perform well both with training set and newly
    arrived data.


    *   An underfitted model would be directly rejected due to its performance via
    benchmark and accuracy.


    [Q67: What are the reasons for under fitting occurrences?](#toc.xhtml#c01q67a)


    *Ans:* Under fitting is said to happen when a model is unable to capture or understand
    the nature of data. This has a direct impact on the accuracy of the model.


    The reason for this could be:


    *   Less data available to analyze


    *   Wrong data


    *   Wrong features considered


    *   It could be also be due to wrong formed model


    The solution to under fitting is to make use of more data and possibly even clean
    data by removing unwanted features or columns.


    Shown below is how under fitting looks when plotted


    ![](OEBPS/images/18.jpg)


    **Figure 2**


    [Q68: Does over fitting get affected by noise?](#toc.xhtml#c01q68a)


    *Ans:* Over fitting is said to happen when a model gets easily affected by noise
    or outliers.


    The details available in such a case are more, and as a result of this, model
    gets affected.


    Following is the over fitting diagram when plotted:


    ![](OEBPS/images/19.jpg)


    **Figure 3**


    **Over fitting can be overcome by:**


    *   **Pruning:** Pruning as the name suggests, is cutting. We prune wanted data
    in addition to nodes that gets easily affected by wrong data.'
