    # V. CONCLUSION


    In this paper, a reactive power optimization method considering switching is proposed
    to address the impact of random power injection on the transmission network. DDQN,
    an algorithm with frequency experience methods, helps to solve nonlinear and non-convex
    model. Taking into account the requirements of stability and security, a penalty
    for over-limit voltage-based control is added to the algorithm. Numerical analysis
    shows that the results of reactive power optimization after considering switching
    can be improved and the online operating time also within the acceptable range.


    It has been revealed from Fig.5 that the reward of algorithm and the effect of
    reactive power optimization have improved after adding line switch to the control
    methods. Reactive power optimization that transmission network switching into
    has lower active power and higher reward. Furthermore, the variation trend of
    reward and active power is basically opposite, which indicates the designed reward
    function conforms to the actual conditions.


