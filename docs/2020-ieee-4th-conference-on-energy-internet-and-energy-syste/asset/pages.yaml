  md: 'When calculating the total reward, whether the action has caused the constraint
    to exceed the bound will be prioritized to determine the reward for the action.
    If the action is not over-limit, simulation will be performed on operating indicators
    such as power loss and node voltage to calculate the state, which will be merged
    into the total reward; otherwise, the reward is directly output. The flow chart
    for calculating rewards shows Fig. 1.


    ![](img/cf7065e69b6b14dd79340a2bc93afda4_3_0.png)


    Fig. 1. Reward calculation process


    The over-limit penalty introduced by choice rewards can guide the agent to avoid
    over-limit behavior when the generator or node voltage reaches the lower bounds,
    improving the training efficiency and the rationality of the results.


    # B. Model-guided control


    Neural network training is relatively sensitive to reward settings and can entirely
    output a wrong action, which may lead to long-term effects on power system. For
    the purpose of ensuring the performance in real environment, this paper adopts
    the model-guided control strategy. The trained algorithm outputs the two actions
    in the Q-network set. According to the simulation results, the action with the
    greater return will be selected from candidate action set. The execution flow
    chart of the strategy shows in Fig. 2.


    ![](img/cf7065e69b6b14dd79340a2bc93afda4_3_1.png)


    Fig. 2. Model-guided control


    This method can prevent the agent from relying on the judgement of the Q-network,
    which can increase the fault tolerance of the algorithm.


    # IV. CASE STUDY


    Numerical study is performed to verify the effectiveness of reactive power optimization
    considering line switching.


    # A. Test Conditions


    In order to simulate the real power system environment, this paper uses the Python-based
    PYPOWER platform, PYPOWER is a Python library that can solve power flow and optimal
    power flow (OPF).


    The IEEE-238 bus system used in this study carries 33 generators, 38 lines and
    5 transformers. The generators are installed at 11 nodes. The range of active
    power generation is 10300MW, and those of reactive power is -535MVar to 1776MVar.
    The total active load and reactive load in the system are 2850MW and 580MVar respectively,
    and this load level is treated as the rated load.


    ![](img/cf7065e69b6b14dd79340a2bc93afda4_3_2.png)


    Fig. 3. IEEE 22-bus system


