  md: 'β is the conversion factor of emotion and voltage safety.


    To estimate the quality of a strategy, define the state-action value function
    $Q^*(s,a)$:


    ```

    $Q^*(s,a) = \mathbb{E}_{s'' \sim p} [r(s,a'') + \gamma V^*(s'')] \quad (14)$

    ```


    State-action value function is the basis for strategy optimization. The continuously
    estimates the revision of the state-action value function through interaction
    with the environment.


    Q-learning is a learning method based on value function, which absorbs the advantages
    of Monte Carlo method and dynamic programming algorithm [10]. It updates the value
    function using the following formula:


    ```

    $Q^*(s,a) = Q^*(s,a) + \alpha(r + \gamma Q^*(s'',a'') - Q^*(s,a)) \quad (15)$

    ```


    The information we need is the current status $s$, the state-action value function
    in the next state $Q^*(s'',a'')$. The main idea is to optimize the value in each
    iteration to bridge the gap between the actual reward $r + \gamma Q^*(s'',a'')$
    and the estimated $Q^*(s,a)$, which is similar to the mechanism of human learning.


    Q-learning is very effective for dealing with problems with a finite number of
    discrete states, but for problems with a large number of states or continuous
    states, it is obviously impossible to obtain each state-action value function
    enumeration. In order to calculate the value $Q^*(s,a)$, we use a function $Q(s,a)$
    to approximate its value, value function approximation:


    ```

    $Q(s,a) = Q^*(s,a) \quad (16)$

    ```


    The $Q(s,a)$ is usually a neural network Q-network parameters are defined by $\Phi$.
    The learning process is to learn a parameter $\phi$ to make the output of the
    network $Q(s,a)$ as close to the real value function $r + \gamma Q^*(s'',a'')$
    as possible.


    However, there are two problems. One is that the training process is unstable[10];
    the other is that the sample is divided into target and evaluate net. The parameters
    of the target are fixed for a period of time while the parameters of the evaluate
    net used to estimate the value function is changing during training stage. This
    approach stabilizes the parameters and reduces oscillation of


    algorithm.


    The other method is experience replay. Different from the information using exploration
    directly, this method uses experience pool to store the obtained data. Batch processing
    is adopted to randomly sample data from the experience pool for training. This
    means the correlation between adjacent samples prevents the agent from falling
    into the local optimum and reduces the variance during parameter update.


    # Algorithm: DQN


    +   1. Initialize state space $s$, action space $a$, time discount factor rate
    $\gamma$;

    2. Randomly initialize the experience pool capacity $N$;

    3. Copy $\phi$ to the target network parameters $\Phi$;

    4. While value function does not converge:

    5. Initialize the state $s$;

    6. While not terminal:

    7. Choose an action $a$

    8. Execute $a$, get reward $r$ and next state $s''$

    9. Put $(s,a,r,s'')$ into experience pool

    10. Sampling $s,a,rr''$ in batches to train data


    $y = \frac{rr, r + \gamma Q^*(s'',a'')}{ss'', arg Q(s,a)}$, not terminal,


    +   12. Train the network with the loss function $(y - Q^*(s,a))^2$;

    13. Update state $s$;

    14. Every steps, copy the parameters of $\phi$ to target net

    15. Output: $Q^*(s,a)$


    # III. INACTIVE IN REACTIVE POWER OPTIMIZATION


    The primary requirement of power system is stability and reliability. For this
    reason, special design is required for adaptive protection mechanism considering
    power system characteristics.


    # A. Over-limit Behavior Penalty


    Voltage control policy is to maintain the deviation of the bus voltage within
    a value certain range, the terminal voltage adjustment of the generator is limited
    by the bus voltage. In addition, there are upper and lower limits of generator,
    which cannot be further increased or decreased when the generator output reaches
    the limit. If no penalize on over-limit actions, invalid or fallacious in-formation
    will enter the experience pool.


    In order to fix the over-limit actions, a penalty mechanism for over-limit actions
    is introduced into the reward, and the reward is divided into state reward and
    reward choice. The calculation of state reward remains as same as that in (13)
    while the choice reward relates to whether an over-limit action is taken, the
    calculation of which is follows:


    ```

    choice reward \begin{cases} zero reward (0) , over-limit minus penalty (-5) ,
    not over \end{cases} \quad (17)

    ```'
