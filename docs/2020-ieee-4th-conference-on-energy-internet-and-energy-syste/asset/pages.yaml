  md: '# Deep Reinforcement Learning based Wind Farm Cluster Reactive Power Optimization
    Considering Network Switching


    Xianbe Ke

    Northwest Branch of China State Grid Corporation

    Xian, China


    Yaqi Sun

    Department of Electrical Engineering Tsinghua University

    Beijing, China


    Gang Zhang

    Northwest Branch of China State Grid Corporation

    Xian, China


    Wenchuan Wu

    Department of Electrical Engineering Tsinghua University

    Beijing, China


    Abstract—For wind farms clusters, the overall performance of reactive power optimization
    can be improved via optimal network switching. The problem can be precisely modeled
    as a mixed integer non programming (MINP) model, which is intractable. A deep
    reinforcement learning (DRL) algorithm is proposed to solve the real-time performance.
    There are two stages in this solution, the first stage is the offline training
    of the agent, and the second stage is the deployment of the trained agent and
    MINP model. Considering the operational constraints, a learning framework with
    over-behavior penalty and model-guided constraint with symmetric and asymmetric
    convergence strategies are applied to enhance the training efficiency. Results
    show that the proposed algorithm can reduce the computation time and the optimal
    network switching can further improve the wind farms'' safety and economic de-optimization.


    problem with high non-convexity and nonlinearity is intractable applying the existing
    method. Artificial intelligence algorithms proposed by deep reinforcement learning
    provide possible solutions to this problem.


    Many studies have revealed the potential of reinforcement learning in the field
    of intelligent control, for example, reinforcement learning and Monte Carlo tree
    search has shown the top player Lee Sedol [5], and the used deep reinforcement
    algorithm achieved scores higher than human players in various competitions. However,
    few methods exist to apply reinforcement learning in the field of power system
    optimization. Melavini Galic et al. introduced a deep learning-based method to
    solve the problem [7]. Jia Duan et al. proposed a module-based optimal power dispatch
    method based on deep reinforcement learning [8]. In addition, Zim Yan et al. applied
    reinforcement learning to the field of grid power frequency control, and proposed
    a low frequency control (LFC) method, which can well-adjust the frequency error
    caused by wind power [9]. The methods with continuous and discrete variables like
    comprehensive optimization of topology and dispatch had been largely explored
    domain.


    Keywords—reinforcement learning, reactive power optimization


    # I. INTRODUCTION


    Concerning the problem of energy shortage and global warming [1], it is of great
    significance to develop renewable energy and its importance in the energy structure
    are the key directions of China structure.


    Wind power is one of the renewables with installed capacity. There are a large
    number of wind farms deployed in the northwest [2]. The distribution of natural
    resources, generations of wind power have uncertainties, which makes it impossible
    to control the output of the real-time wind power. Wind power injection has a
    severe impact on the power system stability. Under certain circumstances it is
    necessary to balance the wind power to ensure the safety and stability requirement
    of the power system, resulting in mass waste of energy.


    Traditional reactive power optimization models does not take transmission network
    switching into consideration, which leads to suboptimal utilization of system
    resources [4]. The optimization considering network switching is a mixed integer
    nonlinear programming


    This work was supported by the Maintenance Company of Gansu Electric Power Company
    (Project SGGSJ001WJS2005036)


    this paper, we adopt deep reinforcement learning with knowledge in the field of
    power system to meet requirements for security and stability. Offline training
    reduces the online decision time and provides an adequate solution for reactive
    power system optimization with wind farm cluster.


    In this section, the mathematical model of the problem is established considering
    the physical constraint and operation. The concepts related to deep reinforcement
    learning are introduced.


    # II. PROBLEM FORMULATION


    # A. Mathematical Model and Optimization


    The module of reactive power optimization considering network switching is based
    on the AC reactive power optimization model, and group of binary variables are
    appended to represent the state of transmission network.'
