    在计算总奖励时，将优先考虑动作是否导致约束超过界限，以确定该动作的奖励。如果动作未超限，将对功率损耗和节点电压等运行指标进行仿真以计算状态，并将其合并到总奖励中；否则，直接输出奖励。奖励计算的流程图1所示。


    ![](img/cf7065e69b6b14dd79340a2bc93afda4_3_0.png)


    图1. 奖励计算过程


    由选择奖励引入的超限惩罚可以引导智能体在发电机或节点电压达到下限时避免超限行为，提高训练效率和结果的合理性。


    ## B. 模型引导的控制


    神经网络训练对奖励设置相对敏感，可能会输出完全错误的动作，这可能对电系统产生长期影响。为了确保在真实环境中的性能，本文采取了模型引导的控制策略。训练后的算法输出
    Q 网络集中的两个动作。根据仿真结果，将从候选动作集中选择回报较大的动作。该策略的执行流程图如图2所示。


    ![](img/cf7065e69b6b14dd79340a2bc93afda4_3_1.png)


    图2. 模型引导的控制


    这种方法可以防止智能体依赖 Q 网络的判断，从而增加算法的容错性。


