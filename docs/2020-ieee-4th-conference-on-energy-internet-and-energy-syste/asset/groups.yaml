    # II. PROBLEM FORMULATION


    ## A. Mathematical Model and Optimization


    The module of reactive power optimization considering network switching is based
    on the AC reactive power optimization model, and group of binary variables are
    appended to represent the state of transmission network.


    This paper mainly considers the active power loss on transmission lines which
    should be minimized on the basis of ensuring that the voltage is not out of limit.
    The objective can be expressed as:


    $$\sum_{i\in\Omega} p_i \quad (1)$$


    where $p_i$, are the active power injection of node $i$.


    The constraints of the reactive power optimization include:


    - Line state constraint

    $x\theta\in[0,1] \quad (2)$


    - Power flow constraint

    $p_i=(G_iV_i^2-G_{ij}V_iV_j\cos\theta_{ij}) \quad (3)$

    $q_i=(-B_iV_i^2+B_{ij}V_iV_j\sin\theta_{ij}) \quad (4)$


    - Power balance constraints

    $p_i-p_i^l=G_{ii}V_i^2+\sum_{j\in\Omega}p_j \quad (6)$

    $q_i-q_i^l=-\frac{1}{2}\sum_{j\in\Omega}B_{ij}V_iV_j+\sum_{j\in\Omega}q_j \quad
    (7)$

    where $p_i^l$ and $q_i^l$ are the active and reactive load at node $i$, $B_{ij}$
    and $G_{ii}$ are susceptance and conductance of node $i$.


    - Generator operation constraint

    $p_i^l\le p_i\le p_i^u \quad (8)$

    $q_i^l\le q_i\le q_i^u \quad (9)$

    where $p_i^l$ and $q_i^u$ are the upper and lower bound of the active power output
    of generator at node $i$.


    - Security constraints

    $-\theta_i^u\le\theta_i\le\theta_i^u \quad (10)$

    $p_i^2+q_i^2\le\theta_i^u \quad (11)$

    $V_i^l\le V_i\le V_i^u \quad (12)$


    ## B. Principle of Deep Reinforcement Learning


    The model of reinforcement learning is based on Markov decision process, which
    contains the following elements:


    - Episode: refers to a period of history in which agent interacts with environment
    from initial state to terminal state, containing the state, the action taken,
    and reward obtained in each iteration

    - Environment: an external object that interacts with the agent. The agent distinguishes
    the agent''s change, and environment returns the reward of the action

    - State: information which determines the decision. The set of state variables
    is defined as $S$. The state space of environment includes: a) voltage and phase
    angle of wind turbines, b) load of system, d) status of circuit breaker are binary
    variables, 0 means open, e) active power loss of whole system

    - Action: a operation that the agent can execute. The set of actions is defined
    as $A$. The action space is divided into slow action space and fast action space;
    a) reactive power adjustment of wind turbines, b) terminal voltage adjustment
    of transmission lines

    - Policy $\pi(a|s)$: the mapping from state to action. The agent evaluates the
    value of each action on current environment state $s$, and selects actions according
    to certain rules, for example, greedy method

    - State transition probability $p(s''|s,a)$: the probability that the environment
    state transitions from $s''$ to $s$ after the agent executes an action $a$ on
    the state

    - Reward: a scalar quantity to evaluate the quality of action. After the agent
    executes an action under guidance of policy the environment returns the remuneration
    for the current state $s$ so that the agent can modify its policy. In this paper,
    the reward is composed of economic factors and voltage safety. The reward calculation
    formula follows:


    $$\sum_{i\in\Omega}(p_i+\max|V_i|-1/\beta) \quad (13)$$


    $\beta$ is the conversion factor of emotion and voltage safety.


    To estimate the quality of a strategy, define the state-action value function
    $Q^*(s,a)$:


    $$Q^*(s,a) = \mathbb{E}_{s'' \sim p} [r(s,a'') + \gamma V^*(s'')] \quad (14)$$


    State-action value function is the basis for strategy optimization. The continuously
    estimates the revision of the state-action value function through interaction
    with the environment.


    Q-learning is a learning method based on value function, which absorbs the advantages
    of Monte Carlo method and dynamic programming algorithm [10]. It updates the value
    function using the following formula:


    $$Q^*(s,a) = Q^*(s,a) + \alpha(r + \gamma Q^*(s'',a'') - Q^*(s,a)) \quad (15)$$


    The information we need is the current status $s$, the state-action value function
    in the next state $Q^*(s'',a'')$. The main idea is to optimize the value in each
    iteration to bridge the gap between the actual reward $r + \gamma Q^*(s'',a'')$
    and the estimated $Q^*(s,a)$, which is similar to the mechanism of human learning.


    Q-learning is very effective for dealing with problems with a finite number of
    discrete states, but for problems with a large number of states or continuous
    states, it is obviously impossible to obtain each state-action value function
    enumeration. In order to calculate the value $Q^*(s,a)$, we use a function $Q(s,a)$
    to approximate its value, value function approximation:


    $$Q(s,a) = Q^*(s,a) \quad (16)$$


    The $Q(s,a)$ is usually a neural network Q-network parameters are defined by $\Phi$.
    The learning process is to learn a parameter $\phi$ to make the output of the
    network $Q(s,a)$ as close to the real value function $r + \gamma Q^*(s'',a'')$
    as possible.


    However, there are two problems. One is that the training process is unstable;
    the other is that the sample is divided into target and evaluate net. The parameters
    of the target are fixed for a period of time while the parameters of evaluate
    net is changing during training.


    The other method is experience replay. Different from the information using directly,
    this method uses experience pool to store obtained data. Batch processing is adopted
    to randomly sample from experience pool for training. This means the correlation
    between adjacent samples reduces the variance during parameter update.


    # Algorithm: DQN


    1. Initialize state space $s$, action space $a$, time discount factor $\gamma$;

    2. Randomly initialize the experience pool capacity $N$;

    3. Copy $\phi$ to the target network $\Phi$;

    4. While value function does not converge:

    5. Initialize the state $s$;

    6. While not terminal:

    7. Choose an action $a$

    8. Execute $a$, get reward $r$ and next state $s''$

    9. Put $(s,a,r,s'')$ into experience pool

    10. Sampling $s,a,rr''$ in batches to train data

    $y = \frac{r + \gamma Q^*(s'',a'')}{ss''}$, not terminal,

    11. Train the network with the loss function $(y - Q^*(s,a))^2$;

    12. Update state $s$;

    13. Every steps, copy the parameters of $\phi$ to target net

    14. Output: $Q^*(s,a)$


    # III. INACTIVE IN REACTIVE POWER OPTIMIZATION


    The primary requirement of power system is stability and reliability. For this
    reason, special design is required for adaptive protection mechanism considering
    power system characteristics.


    ## A. Over-limit Behavior Penalty


    Voltage control policy is to maintain the deviation of the bus voltage within
    a value certain range, the terminal voltage adjustment of the generator is limited
    by the bus voltage. In addition, there are upper and lower limits of generator,
    which cannot be further increased or decreased when the generator output reaches
    the limit. If no penalize on over-limit actions, invalid or fallacious information
    will enter the experience pool.


    In order to fix the over-limit actions, a penalty mechanism for over-limit actions
    is introduced into the reward, and the reward is divided into state reward and
    reward choice. The calculation of state reward remains as same as that in (13)
    while the choice reward relates to whether an over-limit action is taken, the
    calculation of which is follows:


    $$choice reward \begin{cases} zero reward (0) , over-limit minus penalty (-5)
    , not over \end{cases} \quad (17)$$

