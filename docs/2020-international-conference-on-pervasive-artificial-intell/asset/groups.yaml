    # 2020 年感知智能人工智能国际会议 (ICPAI)


    # 基于自适应采样深度强化学习的投资组合管理


    第一作者 苗向翔（音译： Miao Miao）、萧依婷

    信息管理学院

    国立交通大学

    台湾新竹

    jathan1011.iom09@nctu.edu.tw, tiffany.iom09@nctu.edu.tw


    第二作者 黄思豪

    信息管理与金融学科学系

    国立交通大学

    台湾新竹

    szahaohuang@nctu.edu.tw


    **摘要—** 量化交易通过统计学或数学方法观察历史数据来寻找稳定且盈利的交易机会。然而，现有研究在交易策略的生成方面仍然不足。因此，本研究包含道琼斯指数目标的构建及其在投资组合中的应用。目标是从成分股中构建一个多元化的资产组合，且该组合可以通过我们的交易策略获得卓越的性能。此外，本研究提出了一种值得学习的采样策略，通过观察学习状态来节省计算时间。实验结果表明，采用该策略的模型在夏普率方面比基准模型表现出
    6-7% 的提升。


    **索引词—**深度学习、强化学习、投资组合管理。


    量化交易通过统计学或数学方法观察历史数据来寻找稳定且盈利的交易机会。在陌生区域的计算能力。此外，通过这种设计，可以加速智能体对通用规则的学习。此外，我们也知道智能体的作用不是追求利润最大化，而是具有处理风险的能力，因为在奖励设计中考虑了风险因素。因此，我们训练了一个嵌入网络模型来学习趋势与未来价格趋势之间的关系，在训练嵌入网络后，采用策略网络对其进行微调。最后，整个设计在夏普率方面比计划方法优出
    6-7%，且与随机采样相比缩短了计算时间。


    ## I. 引言


    金融市场有许多机器学习方法。然而，尽管试图预测趋势波动，但根据随机游动理论，历史趋势并非当前趋势。历史高度依赖于预测的准确性。这使得预测变得极其困难。


    详细而言，投资组合研究是在有限的环境中编码的。换句话说，可以通过部分选择来训练智能体。如果我们能够解决模型在训练阶段表现良好但在实际中难以解决的生成问题，那么我们的目标是为任何由系统选择的投资组合找到基础交易策略，智能体应该具有优化投资组合的能力。为了实现这一目标，问题就可以解决。然而，训练所有可能的排列是不可能的任务，会消耗大量的时间和计算资源。


    因此，本文提供了一种自适应采样来增加投资组合的机会。通过我们的采样策略，可以防止表现不佳的智能体在已经学习过的投资组合上花费过多时间。然后，智能体可以将更多的时间和精力花在不熟悉的领域。


    ## II. 与投资组合管理相关


    马科维茨（Markowitz）提出的现代投资组合理论或均值-方差理论利用数学解决方案来构建在考虑预期收益最大化和给定风险水平下的投资组合 [1]。当方差分析在金融领域被广泛接受时，均值-方差理论包含两个部分：预期收益和与资产风险不同的方差（后者意味着发生或负面结果的数学概率）。对于该理论，投资者只需要考虑收益均值与方差之间的权衡，并在给定风险水平下寻求最大预期收益，以增加调整智能体收益的确定性。然而，均值-方差理论更好是因为它可能精确控制各种资产的未来收益和标准差，在实践中我们已经准确确定了这些方法。此外，这会导致非常不稳定的结果。此外，这项工作依赖于正态假设。


    在数学和统计方法中，动量是广为人知的投资策略之一。金融市场如股票市场和外汇提供了许多投资策略。该策略使用某段时间的股票标记 [2]。978-1-6648-9823-9
    ©2020 IEEE DOI:10.1109/ICPAI.2020.0031130 授权：密歇根大学。5月14日。


    ### B. 深度学习方法


    近年来，有将深度学习应用于投资组合优化的工作。Alahmadi [6][7] 提出了一个框架，Li 实现了 DQN、DDPG 和 PPO 等算法。投资组合是随机构建的。


    ### A. 动作


    如图2所示，智能体的职责是确定组合权重。动作空间分为离散动作和连续动作。策略适应，分布


    ## III. 方法论


    在本节中，我们提供了投资组合系统的简单概述。系统概览如图1所示。与之前投资组合的差异在于


    ![img/062c58f7926b7676b4266415b418f4_1_0.png]


    ![img/062c58f7926b7676b4266415b418f4_1_1.png]


    由于每个智能体相互独立，网络输出 mu 和对角 sigma。对于上下文，本文采用激活函数来控制 -1 到 1 的值范围。对于输出信号，本文学习一种激活函数。信号值范围从零到无穷，可能大于1。由于
    mu 只能在 1 到 -1 之间，本文应用裁剪函数来限制连续值。在此尝试中，如果策略不使用任何激活函数，将非常难以训练。值得注意的是，软件转换后的权重仅用于与环境交互以获取组合奖励。我们应该调整最优权重以更新策略网络。


    ### B. 奖励函数


    我们的奖励设计只考虑利润。为了实现奖励最大化，每一步奖励为 rt，表示从 t+1 时刻到 t 时刻的组合价值。智能体的目标策略是选择一系列动作以最大化随时间累积的奖励。在长期组合管理中，我们追求最高的组合价值
    pt。每一步的即时奖励为 rt = pt+1-pt。


