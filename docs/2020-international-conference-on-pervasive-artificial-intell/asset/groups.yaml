    ## C. Adaptive Sampling Strategy


    Our sampling strategy is coming from the idea of Adaboost. Adaboost is a boosting
    improvement algorithm. The goal is to increase the weight of the errors which
    are easily corrected by the first classifiers, so that each time the new classifier
    is trained, it will be focused on the samples that are hard to classify. Each
    classifier uses a weighted voting mechanism instead of average voting, and only
    classifiers with higher weight are greater. The policy is made up of all the classifiers
    which are also classified as part of the large number of samples. With this, we
    will make the following discussion based on whether the sampling weight of each
    company is the same on the different trading days or.


