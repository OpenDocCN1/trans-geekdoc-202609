    # II. BACKGROUND AND RELATED WORK


    Blockchain architecture is mainly used to keep records on an immutable chain of
    blocks, where nodes agree on the state of untrusted parties. This forms the blockchain
    platform that can be viewed as a distributed (transaction-log) or database system.
    The blocks are agreed by the majority of validators using the consensus protocol
    that tolerate Byzantine faults. The well-known platforms include [12], Hyperledger
    [13], Monad [14]. This architecture does not require a centralized server and
