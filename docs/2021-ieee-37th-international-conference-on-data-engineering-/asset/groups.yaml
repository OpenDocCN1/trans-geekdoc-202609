    same. In this paper, we propose the Proof-of-Federated Learning (PoFL), which
    brings new technological advantages with respect to security level.


    Triage blockchain nodes maintain a permission blockchain where local models of
    federated learning are stored in the distributed ledger. Hence, we define two
    types of records: the training model records and the IoT datasets. We distinguish
    only the first record in block that contains the aggregate model for every generation
    as a separate round of federated learning. We share model block $k-1$ and their
    existing local models to generate next round models.


    The process starts with training local models by using data at the user side.
    Then, the communication takes place between rounds to broadcast the models and
    store them as the distributed ledger. The blockchain node that was from the previous
    round (on the blockchain difference) is responsible for the 2-step consensus and
    constructs the blocks with all the transactions that are not yet.


    In addition, the winner is in charge for aggregating the users models and producing
    the shared model. The shared model is added as the first transaction in block
    for the next round round to access it, in the next. Our PoFL consensus ensures
    participants in the blockchain process will be rewarded with training rewards.
    Users are awarded according to their performance in the training, which is whether
    the federated training converges faster and achieves higher accuracy. The winner
    node of round is the one that achieves better accuracy, considering the blockchain
    difference. Furthermore, in training rounds will be adjusted to the users depending
    on their contribution.


    Nevertheless, we secure the protocol that we use by ensuring every user will follow
    the hierarchy of simply calling peacemaker. The peacemaker''s entity is responsible
    to ensure the correctness of the protocol followed by the federated learning.
    For example, users who refuse to cooperate with the protocol will get no payment
    for their work. Users who try to cheat and verify the correctness of the whole
    process will get a punishment by the peacemaker entity. The peacemaker will claim
    the adjusted models as their reward for the effort in the protocol process.


    increased performance. This component is inspired by our earlier Sprite [22] and
    the work on datapunction.


    The federated learning process aims to train a global model by aggregating local
    models from all clients, and consequently allow client to maintain its own data.
    We followed the weighted averaging method in [23], which in a fixed set of $N$
    clients, each holding $n_i$ data points and compute the aggregate data on current
    model $w_t$ with a fixed learning rate $\eta$: $g_t(w_t) = \sum_{i=1}^{N} \frac{n_i}{n}
    F_i(w_t)$, where $F_i$ is the prediction on local data. Each client can then update
    their local model as $w_{t+1} = w_t - \eta \nabla g(w_t)$.


    The primary objectives of Triage are to protect the local data from any entity
    by not allowing them to be extracted from the devices, and protecting the local
    data by using encrypted private inference while updating the global model at the
    server. In addition, our research goals are to provide security to the users and
    ensure integrity of the local models from attacks that might compromise the performance.


    ## C. Triage/Indexing Layer


    The main purpose of this layer is to minimize the response time that requires
    storage space with efficient algorithms and minimal overhead. We use compression
    techniques to achieve higher compression ratios. In addition, we are going to
    use a specific type of queries in the Triage architecture to optimize the response
    time. We specified the types of queries by Triage standard queries, where only
    the next dataset is queried, range query on a predicate range, and delta query
    that helps the queries to change the changes made by the transactions committed
    at any period.


    Indexing is an essential task to increase query performance. In Triage architecture,
    we use machine learning models to categorize queries by their temporal and spatial
    characteristics. Since different models might get better on data from different
    times and geographical locations. To optimize the performance of the queries,
    we use an unconstrained B+ Tree index. When a new block is added, the Tree index
    is updated according to the new models. This temporal index can be divided into
    multiple levels, according to our needs. The lower layer (leaves) holds the pointers
    to specific models stored throughout the Blockchain. Using this data structure,
    we do not need to scan the database to find a specific model. Instead, we use
    the index to navigate to a specific block and thus improve the asymptotic complexity
    to logarithmic time.


    ## B. Storage Layer


    This layer is responsible to store the incoming data in the Triage blockchain,
    in an offline or online mode, and provide access methods to various sources. Furthermore,
    the incoming data is aggregated and used by the federated learning nodes to recover
    the information and therefore failure recovery, as well as availability and increased
    performance.


    ## IV. LIMITATIONS AND FUTURE WORK


    Privacy is critical to be carefully handled in IOT environments. Data leakage
    is highly sensitive because it is easy to extract user activities from trackers.
    To tackle these issues, we are investigating techniques and algorithms to achieve
    strong privacy. For example, zk-Snarks [24] can be utilized to protect the privacy
    of our infrastructure. Future, we may use bloom filters [25], which offer an efficient
    way to describe a search pattern without specifying and revealing information
    for the entities and thus the. In addition a key challenge is to achieve reasonable
    scalability to improve the performance of Triage. To protect the data integrity
    of transactions in the network we are going to use hash trees, also known as merkle
    trees, that construct structure and efficiently verify transactions. Additionally,
    we may use only basic hashes to construct a merkle path from the root to a specific
    transaction. Thorough analysis and empirical evidence will be conducted to validate
    the performance of our approach.


