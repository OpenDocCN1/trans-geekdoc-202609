    Triage 区块链维护着一个许可区块链，其中联邦学习的本地模型存储在分布式账本中。因此，我们定义了两类记录：训练模型记录和 IoT 数据集。我们仅将块中包含每代聚合模型的第一条记录视为一个联邦学习轮次。我们通过共享模型块
    $k-1$ 及其现有的本地模型来生成下一轮的模型。


    该过程始于使用用户侧的数据训练本地模型。然后，在各轮次之间进行通信，以广播模型并将其存储为分布式账本。来自上一轮的区块链节点（根据区块链差异）负责 2 步共识，并构建包含所有尚未处理交易的区块。


    此外，获胜者负责聚合用户模型并生成共享模型。共享模型将作为第一笔交易添加到下一轮的区块中，以便在下一轮中进行访问。我们的 PoFL 共识机制确保了区块链过程中的参与者将获得训练奖励。用户根据其在训练中的表现获得奖励，即联邦训练是否收敛更快且达到了更高的精度。考虑到区块链差异，该轮的获胜节点是实现更高精度的节点。此外，训练轮将根据用户的贡献对用户进行调整。


    尽管如此，我们通过确保每个用户遵循简单调用“和平者”（peacemaker）的层次结构来保护我们使用的协议。和平者实体负责确保联邦学习所遵循协议的正确性。例如，拒绝配合协议的用户将无法获得报酬。试图作弊并验证整个过程正确性的用户将受到和平者实体的惩罚。和平者将获得调整后的模型作为其在协议过程中努力的奖励。


    性能提升。该组件的灵感来源于我们早期的 Sprite [22] 以及关于 datapunction 的工作。


    联邦学习过程旨在通过聚合所有客户端的本地模型来训练全局模型，从而允许客户端维护自己的数据。我们遵循了 [23] 中的加权平均法，在固定的 $N$ 个客户端中，每个客户端持有
    $n_i$ 个数据点，并使用固定的学习率 $\eta$ 在当前模型 $w_t$ 上计算聚合数据：$g_t(w_t) = \sum_{i=1}^{N} \frac{n_i}{n}
    F_i(w_t)$，其中 $F_i$ 是本地数据上的预测。每个客户端随后更新其本地模型为 $w_{t+1} = w_t - \eta \nabla g(w_t)$。


    Triage 的主要目标是不允许从设备中提取本地数据以保护其不受任何实体侵害，并在服务器更新全局模型时通过加密隐私推理保护本地数据。此外，我们的研究目标是为用户提供安全保障，并确保本地模型免受可能损害性能的攻击。


    ## C. Triage/索引层


    该层的主要目的是通过高效的算法和最小的开销，最小化需要存储空间的响应时间。我们使用压缩技术来获得更高的压缩率。此外，我们将在 Triage 架构中使用特定类型的查询来优化响应时间。我们通过
    Triage 标准查询指定了查询类型，其中包括仅查询下一个数据集、针对谓词范围的范围查询，以及帮助查询跟踪任何时期提交交易所引起更改的增量查询。


    索引是提高查询性能的一项任务。在 Triage 架构中，我们使用机器学习模型根据其时间和空间特征对查询进行分类。因为不同的模型在不同时间和不同地理位置的数据上可能表现更好。为了优化查询性能，我们使用了无约束
    B+ 树索引。当添加新块时，树索引会根据新模型进行更新。这种时间索引可以根据我们的需求分为多个级别。底层（叶节点）持有存储在整个区块链中的特定模型的指针。使用这种数据结构，我们不需要扫描数据库来查找特定模型，而是通过索引导航到特定区块，从而渐渐复杂度提高到对数时间。


    ## B. 存储层


    该层负责以离线或在线模式在 Triage 区块链中存储传入的数据，并为各种来源提供访问方法。此外，传入的数据会被联邦学习节点聚合并用于恢复信息，从而实现故障恢复、提高可用性并提升性能。


    ## IV. 局限性与未来工作


    在 IoT 环境中，谨慎处理隐私至关重要。数据泄露高度敏感，因为很容易从跟踪器中提取用户活动。为了解决这些问题，我们正在研究实现强隐私的技术和算法。例如，利用
    zk-Snarks [24] 来保护我们基础设施的隐私。未来，我们可能会使用布隆过滤器 [25]，它提供了一种高效的方法来描述搜索模式，而无需为实体指定和泄露信息。此外，一个关键挑战是实现合理的扩展性以提高
    Triage 的性能。为了保护网络中交易的数据完整性，我们将使用哈希树（也称为梅克尔树），它可以构建结构并高效地验证交易。此外，我们可能仅使用基础哈希来构建从根到特定交易的梅克尔路径。将进行彻底的分析和实证证据来验证我们方法的性能。


