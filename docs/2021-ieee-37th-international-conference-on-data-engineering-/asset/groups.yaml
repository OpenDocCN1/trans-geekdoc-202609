    To enhance security and privacy in Triabase, we propose federated learning [11]
    as a new wise choice for distributed learning. Federated learning from the traditional
    artificial intelligence trains a federated learning model at the server, keeping
    the full amount of data at the user end, mitigating in this security and privacy
