  - "[PAGE 2]\n\nsame. In this paper, we propose the Proof-of-Federated Learning (PoFL),\
    \ which brings new technological advantages with respect to security level.\n\n\
    Triage blockchain nodes maintain a permission blockchain where local models of\
    \ federated learning are stored in the distributed ledger. Hence, we define two\
    \ types of records: the training model records and the IoT datasets. We distinguish\
    \ only the first record in block that contains the aggregate model for every generation\
    \ as a separate round of federated learning. We share model block $k-1$ and their\
    \ existing local models to generate next round models.\n\nThe process starts with\
    \ training local models by using data at the user side. Then, the communication\
    \ takes place between rounds to broadcast the models and store them as the distributed\
    \ ledger. The blockchain node that was from the previous round (on the blockchain\
    \ difference) is responsible for the 2-step consensus and constructs the blocks\
    \ with all the transactions that are not yet\n\nIn addition, the winner is in\
    \ charge for aggregating the users models and producing the shared model. The\
    \ shared model is added as the first transaction in block for the next round round\
    \ to access it, in the next. Our PoFL consensus ensures participants in the blockchain\
    \ process will be rewarded with training rewards. Users are awarded according\
    \ to their performance in the training, which is whether the federated training\
    \ converges faster and achieves higher accuracy. The winner node of round is the\
    \ one that achieves better accuracy, considering the blockchain difference. Furthermore,\
    \ in training rounds will be adjusted to the users depending on their contribution.\n\
    \nNevertheless, we secure the protocol that we use by ensuring every user will\
    \ follow the hierarchy of simply calling peacemaker. The peacemaker's entity is\
    \ responsible to ensure the correctness of the protocol followed by the federated\
    \ learning. For example, users who refuse to cooperate with the protocol will\
    \ get no payment for their work. Users who try to cheat and verify the correctness\
    \ of the whole process will get a punishment by the peacemaker entity. The peacemaker\
    \ will claim the adjusted models as their reward for the effort in the protocol\
    \ process.\n\nincreased performance. This component is inspired by our earlier\
    \ Sprite [22] and the work on datapunction.\n\nThe federated learning process\
    \ aims to train a global model by aggregating local models from all clients, and\
    \ consequently allow client to maintain its own data. We followed the weighted\
    \ averaging method in [23], which in a fixed set of $N$ clients, each holding\
    \ $n_i$ data points and compute the aggregate data on current model $w_t$ with\
    \ a fixed learning rate $\\eta$: $g_t(w_t) = \\sum_{i=1}^{N} \\frac{n_i}{n} F_i(w_t)$,\
    \ where $F_i$ is the prediction on local data. Each client can then update their\
    \ local model as $w_{t+1} = w_t - \\eta \nabla g(w_t)$.\n\nThe primary objectives\
    \ of Triage are to protect the local data from any entity by not allowing them\
