    # I. INTRODUCTION


    Internet of Things (IoT) refers to a large number of devices connected to the
    Internet that we are able to see, hear, think, perform, and communicate with each
    other using other protocols [1–14]. IoT devices are connected to Cloud and Edge
    operating applications through mainly ipv4 protocols (5G, WiFi 6) with low latency
    offers as well as safety. In about human health and well-being, IoT is expected
    to bring the huge number of devices close to a staggering 40 billion in 2020,
    not more than double from 2015. This will create tumultuous opportunities for
    IoT between multiple places, such as collaborative machine learning [6], machine
    learning [7], cognitive robotics and reality technology [9].


    A key component in the IoT scenarios is the requirement to utilize a shared database
    that allows all participants to operate collaboratively with more functionality.
    The shared database can bridge the actual gap between the data generated from
    the IoT applications [10] and the rate that these


    It is imperative to provide a database that can handle billions of transactions
    per second, as opposed to that is currently the cause of bottleneck due to the
    expensive verification cost.

    In this paper, we propose Triebee (inspired from Greek “three”), being a Database
    for Web 3.0, permissioned database system that carries out machine learning in
    primitive blocks that are subsequently stored and retrieved from the blockchain.
    We have divided those that store the shared database, and those that use the database
    for their operations, such as using query and update requests to the blockchain
    ledger. We expect the blockchains to be synchronized within the decentralized
    blockchain network. The clients that utilize the block header only, as opposed
    to the full nodes that store the entire blockchain.


