    # II. BACKGROUND AND RELATED WORK


    Blockchain architecture is mainly used to keep records on an immutable chain of
    blocks, where nodes agree on the state of untrusted parties. This forms the blockchain
    platform that can be viewed as a distributed (transaction-log) or database system.
    The blocks are agreed by the majority of validators using the consensus protocol
    that tolerate Byzantine faults. The well-known platforms include [12], Hyperledger
    [13], Monad [14]. This architecture does not require a centralized server and
    arbitrary authorities.


    The authors of [112] introduce a system named Caper, a permission blockchain architecture
    based on an acyclic graph and three consensus protocols to support internal and
    external applications makers. [115] introduces a new framework, Cail, which is
    able to store and retrieve data by the user and verify queries to ensure the security.


    To enhance security and privacy in Triabase, we propose federated learning [11]
    as a new wise choice for distributed learning. Federated learning from the traditional
    artificial intelligence trains a federated learning model at the server, keeping
    the full amount of data at the user end, mitigating in this way security and privacy
    risks.


    In order to improve the validity of our approach, we propose an enhanced implementation
    of our architecture using the hyperledger fabric technology, which enables us
    to measure the latency, as well as the throughput of different parts of our implementation
    during the in load and the searching query. Our primary results are encouraging
    to reveal that our architecture can balance the trade-off between the latency
    and the efficiency of the trained models from the federated learning approach.


    Artificial intelligence with the integration of blockchain technology is a great
    promise to solve various resource optimization problems. Moreover, the merit of
    the approach proposed in [17] is secure research sharing by developing a caching
    mechanism with the use of DRLeyn. [17] introduced how blockchain may potentially
    improve IoT efficiency and how blockchain can overcome security challenges, which
    are vulnerable to threats. However, Al algorithm based on certification approach
    has a negative impact on efficiency, because it consumes a large number of communication
    resources.


    The main contributions of our vision paper are follows:


    +   * We introduce Triabase, a blockchain database enhanced with federated learning
    approach, which contains the nature and behavior of the blockchain nodes to ensure
    the security and data privacy of users;

    * We propose a new consensus empowering collaboration, named Proof of Federated
    Learning (PoFL), to share parameters over distributed multiple to reduce the risk
    of data leakage and to protect federated nodes from being tampered;

    * We also implement our proposal with the integration of the open source platform
    to provide a more realistic scenario.


    The rest of the paper is organized as follows. Related work is presented in Section
    II. Section III presents the proposed architecture. Section IV discusses the current
    limitations of the proposed system and future work.


    # III. The TRIBASE ARCHITECTURE


    In this section, we introduce the Triabase architecture in a bottom-up manner.


    # A. Blockchain Layer


