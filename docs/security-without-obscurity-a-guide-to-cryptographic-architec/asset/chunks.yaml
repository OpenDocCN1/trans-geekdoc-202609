    ![](img/00002.jpeg)`CA`（证书颁发机构）是一个受信任发布和撤销证书的实体，取决于 `RA`（注册机构）对主体进行身份验证和授权。`CA`
    对系统和人员维持信息安全控制，确保只有授权的过程或个人才能访问数据和组织资源。


    ![](img/00002.jpeg)`Relying Party`（信方）是主体证书的使用实体，因此依赖 `RA` 对主体进行身份验证和授权，依赖 `CA`
    发布和撤销证书，并依赖主体安全地管理其相应的私钥。


    如果每个 PKI 参与者都能符合预期，特别是当主体安全地管理其私钥且信方执行了证书验证时，那么主体的数字签名就可以在加密和操作上提供不可否认性。法律控制包括两个主要领域：纠纷解决和证据链。美国律师协会^(\*)
    发布了《数字签名指南》（`DSG`） \[14\]和《PKI 保证指南》（`PAG`） \[15\]，这些指南将不可否认性定义为并非技术机制的自动结果，而是诉诸法院或仲裁员等可用纠纷机制后才能确定的属性。`PAG`
    还讨论了数字签名交易或通信产生的证据提议者可能如何根据既定的证据规则在审判或其他程序中寻求其证据的采纳。基本上，所有的加密和操作控制都需要向独立的第三方提供证明。


    确保 `RA` 和 `CA` 按照行业标准运行的一种方法是由信息安全专业人员进行的独立审计。此类审计的评估标准由 `Webtrust for CA` \[17\]
    展示，该标准被许多 `CA/Browser Forum` 成员的 `CA` 和浏览器制造商认可。^(\*)最初的 `Webtrust for CA` `v1.0`
    基于 `X9.79` \[19\]，该标准后来国际化为 `ISO 21188` \[20\]。此外，之前的 `PKI Forum`（现并入“结构化信息标准身份与可信任基础设施推进组织”^†
    (`IDtrust`) 部门）在其 `CA Trust` \[18\]白皮书中也支持了 `Webtrust` 审计。`Webtrust for CA` `v2.0`
    审计标准目前组织为七个领域：


    1. `CA 业务实践披露`，预计在 `CA` 证书策略或证书实践声明中记录。

    2. `CA 业务实践管理`，即提供有效控制，以确保 `CA` 按照其证书策略或证书实践声明运行。

    3. `CA 环境控制`，即针对资产、人员、物理和逻辑访问控制、由于开发、维护、监控和安全日志的控制。

    4. `CA 密钥生命周期管理控制`，涉及密钥生成、密钥存储、密钥备份与恢复、公钥分发、密钥使用、密钥存档、密钥销、密钥泄露、加密硬件安全模块和密钥托管。

    5. `订阅者密钥生命周期管理控制`，涉及 `CA` 为订阅者提供的管理用户加密密钥的服务。

    6. `证书生命周期管理控制`，涉及订阅者注册、证书续期、证书更换、证书发放、证书分发、证书撤销、吊吊和证书验证。关于订阅者注册，请参考之前讨论过的 `EV`
    证书 \[16\]历史起源。

    7. `从属 CA 证书生命周期管理控制`，涉及对 `PKI` 内部运行的一个或多个从属 `CA` 的控制。


    每个领域都包含了用于衡量合规性的控制目标和作为示例的说明控制，但 `Webtrust for CA` 对于技术或解决方案既不是强制性的，也不是禁止性的。同样，行业标准
    \[20\]定义了要求但没有指定技术。因此，读者获得的是指导而非具体的规格说明。关于 `PKI` 操作的更深入的讨论，请参阅 `Ref.` \[5\]，关于本书对这些领域的描述，请参阅第
    7 章。


    关于数字签名与电子签名的最后一点是：2000 年的《全球和国家商业电子签名法》^(\*) (`ESIGN`) \[21\]将电子签名定义为电子声音、符号或过程，附属于合同或其他记录或与之逻辑关联，并由具有签署记录意图的人执行或采用。因此，由于数字签名是表示签署记录意图的加密过程，它适用于电子签名。然而，如果没有加密、操作和法律控制，电子签名无法提供
    `DSG` 和 `PAG` 中描述的不可否认性服务。


    ### 2.5 令牌化（Tokenization）


    令牌化是将敏感数据替换为无害数据的过程。什么是敏感数据（也称为底层敏感值 `USV`）取决于业务应用。通常对于支付应用，账号号是敏感的。


    例如，《支付卡行业数据安全标准》（`PCI DSS`）令牌化指南 \[26\]提供了特定应用的描述：*令牌化是将主账号（PAN）替换为称为“令牌”的替代值的过程。解令牌是将令牌兑换为相关
    PAN 值的逆过程。单个令牌的安全性主要取决于仅通过替代值无法推断出原始 PAN*。


    Eupay Mastercard-Visa（EMV）支付令牌化规范 \[27\]提供了类似的描述：*支付令牌是支付生态系统中替代 PAN 的替代值。支付令牌可用于支付交易，而非支付令牌可用于辅助过程，如忠诚度跟踪。*


    对于医疗保健，患者姓名或诊断代码可能被认为是敏感的。关于隐私，任何个人身份信息如邮寄地址或 `SSN` 可能是需要保护的敏感 (`USV`) 数据。


    什么是无害数据取决于令牌化方法。`X9.119-1` \[22\] 定义了使用加密方法保护敏感支付卡数据的要求，而 `X9.119-2` \[23\] 则涉及令牌化方法。`X9.119-2`
    提供了类似的令牌化定义：*将明文值（即 USV）映射到现有或新生成的替代值（即令牌）的过程*，并识别了四种令牌化方法。


