    \ The CVV is generated using a CVV validation key with three data inputs: the\
    \ card PAN, expiration date, and card service code; the latter being a value designated\
    \ by the brands. There are three different CVV on each card.\n\n![](images/00002.jpeg)CVV1\
    \ is encoded onto the magnetic stripe. This variation uses the PAN, expiration\
    \ date, and the card service code.\n\n![](images/00002.jpeg)CVV2 is printed in\
    \ the signature panel. This version uses the PAN, expiration date, and a special\
    \ card service code.\n\n![](images/00111.jpeg)\n\nFigure 9.5   Dynamic data authentication.\n\
    \n![](images/00002.jpeg)CVV3 is installed in the ICC. This algorithm uses the\
    \ PAN, expiration date, and another CSC for EMV.\n\nThe issuer can verify CVV1\
    \ for legacy magstripe transaction, and CVV3 for EMV transactions, but transaction\
    \ is either magstripe or EMV but never both. CVV2 is used by mail order or telephone\
    \ order merchants, or for Internet (e.g., browser, mobile) merchants when the\
    \ cardholder enters the PAN and expiration date. When neither the magstripe nor\
    \ the ICC data is captured by a POS or EMV terminal it is considered a card-not-present\
    \ (CNP) transaction; the CVV2 is entered by the cardholder for additional security.\n\
    \nWhile the four examples described do not address all of the payment authorization\
    \ options and cryptography supported by EMV cards, the discussion provides a reasonable\
    \ overview. Online PIN verification with the issuer provides stronger authentication.\
    \ Online EMV authorization with the issuer reduces fraud but requires terminal\
    \ connectivity. Offline EMV authorization with offline PIN verification is weaker\
    \ than online but does not require terminal connectivity. CNP transactions are\
    \ at higher risk and tend to incur the most fraud."
