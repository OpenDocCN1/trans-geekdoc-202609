    # HTTPS and MITM Interception


    The HTTPS call from the browser to the server is redirected to the proxy server
    which intercepts the server TLS certificate. The proxy CA issues a MITM certificate
    by duplicating the TLS certificate, replacing the server public key with a proxy
    public key, and signing the MITM certificate with the proxy CA keys. The browser
    recognizes the proxy CA and so uses the MITM certificate to establish a TLS connection
    to the proxy. The proxy uses the TLS certificate to establish a TLS connection
    to the server. The server assumes the proxy is the browser, so the proxy acts
    as a TLS client. The browser assumes the proxy is the server, so the proxy also
    acts as a TLS server. The MITM certificate retains the server subject name so
    the browser does not incur a name mismatch; however, the server is unaware that
    a MITM certificate has been issued in its name with a forged public key.


    ![](images/00102.jpeg)

    Figure 7.11 Enterprise monitoring.


    ![](images/00103.jpeg)

    Figure 7.12 MITM monitoring.


    # Data Usage and Monitoring


    `Data usage` is when information is stored and subsequently read or written. Read
    access and write access are fundamental access control mechanisms. Logical access
    controls for networks, systems, applications, databases, and other nonvolatile
    storage devices restrict data access to authorized users and administrators. However,
    if an access control can be bypassed or deceived then information might be disclosed
    to unauthorized attackers. Bypassing includes physical access to storage devices,
    which avoids network controls. Local console access might circumvent system, application,
    or database access controls. Identity theft, stealing passwords, fake credentials,
    social engineering, and hacking systems can deceive access controls. Consequently,
    data monitoring and database encryption have evolved as information security controls.


    `Data monitoring` observes information objects at the system, file, record, or
    field level for various types of access. Monitoring tools typically do not authenticate
    nor authorize access, rather they compare actions against `security policy`. For
    example, if an individual has read-only access, but an administrator enables write
    access, the monitoring system would trigger an alert. As another example, if a
    database is accessed by an unexpected protocol or port that violates a security
    policy, the monitor system triggers another alert.


    # Database Encryption


    `Database encryption` keeps information encrypted on disk and only decrypts information
    in memory when needed. Encryption might be managed at the database table, database
    column, system file, record, or field level. Key management methods for database
    encryption are discussed in [Chapter 3](#part0008.html#ch03). If the access control
    is bypassed or the physical disks are stolen, the information is encrypted and
    theoretically inaccessible. Of course, with sufficient time and resources any
    cryptographic key might be determined.


    # Data Deletion and Retention


    `Data deletion` is when information is erased from storage. However, unlike a
    cryptographic key where all instances are destroyed, data deletion might occur
    in stages. Information aged on one system might not have the same expiration on
    another. Backup copies are sometimes kept as part of data retention. Another consideration
    is when information is in the cloud. Third-party data deletion is often very difficult
    to manage, verify, and audit. Often third-party service providers including cloud
    providers do not permit audits of storage systems.


    Another misnomer is that encrypted data can be logically deleted by simply destroying
    the cryptographic key; however, this is no longer the case. As noted with data
    usage, given sufficient time and resources, any cryptographic key might be determined.
    An exhaustive key attack is always viable if the data holds its value past the
    time it takes to determine the key.


    `Data retention` is for long-term information storage. As noted in data deletion,
    backup copies are sometimes kept for data retention. Data retention varies by
    industry such as health care versus financial services, by business such as automobile
    loans versus mortgages, or by company policy. However, if the retention period
    exceeds the key lifecycle, the cryptography needs to be transitioned [[94](#part0016.html#ref_94)]\]
    possibly from one key to another, a longer key size, or even another algorithm.


    For example, a document signed with an `RSA 512-bit` key in 1980 would be insecure
    in 1990, and an `RSA 1024-bit` key in 1990 is considered insecure in 2010. The
    proper method to preserve the chain of evidence is to preserve each signature
    by re-signing the signed document as demonstrated in [Figure 7.13](#part0012.html#fig7_13).
    The original document signed with an `RSA-512` key is signed with an `RSA-1024`
    key, again with an `RSA-2048` key, and eventually signed with an `ECDSA`.

