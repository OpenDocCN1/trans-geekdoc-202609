    系统日志和电子邮件需要作为证据捕获。可能还需要捕取截图。测试完成后，需要停用测试账户。因此，每个测试用例都将包含执行前、执行和执行后任务。随着测试用例的完成，可能会出现需要后续访谈或额外文档的问题，如图
    8.1 中的虚线所示。然而，如前所述，后续访谈并非总是需要的，简单或容易的问题可以通过电子邮件、电话、短信或其他方法处理。此外，文档与访谈的循环、访谈与测试的循环最终会导致收益递减点。但是，所有答案都需要记录在案。最终，测试用例和结果以及访谈笔记和文档被输入分析阶段。


    ## 表格 8.2 测试用例：登录尝试


    | *测试用例 #13 超过登录尝试次数* |

    | --- |

    | 1\. 分配具有用户名(`Sam Test`)和密码(`Test1234`)的测试账户 |

    | 2\. 尝试使用用户名(`Sam Test`)和密码(`Test1111`)进行首次登录 a. 警告信息：登录失败，尝试 1/3b. 验证系统日志和时间戳
    |

    | 3\. 尝试使用用户名(`Sam Test`)和密码(`Test2222`)进行第二次登录 a. 警告信息：登录失败，尝试 2/3b. 验证系统日志和时间戳
    |

    | 4\. 尝试使用用户名(`Sam Test`)和密码(`Test3333`)进行第三次登录 a. 警告信息：登录失败尝试 3/3 – 点击密码重置链接
    b. 验证系统日志和时间戳 |


    ## 表格 8.3 测试用例：临时密码


    | *测试用例 #14 超过临时密码超时* |

    | --- |

    | 1\. 点击密码重置链接 a. 输入用户名(`Sam Test`)和电子邮件地址(`sam.test@example.com`)b. 验证系统日志和时间戳
    |

    | 2\. 打开包含临时密码的电子邮件 a. 验证邮件内容显示密码将在 15 分钟后过期 b. 验证邮件时间戳 c. 等待 15 分钟 5 秒使临时密码过期
    |

    | 3\. 尝试使用用户名(`Sam Test`)和临时密码进行登录 a. 警告信息：登录失败尝试 1/1 – 点击密码重置链接 b. 验证系统日志和时间戳
    |


    ### 8.4 分析


    分析是评估中一个必不可少的过程，它是文档、访谈笔记和测试结果的结晶。图 8.1 显示分析在逻辑上是在文档、访谈和测试之后顺序进行的；然而，分析实际上在文档审查期间或之后开始，并持续到报告阶段。当确认了足够的信息以确定加密架构时，分析结束。


    分析过程实际上相当简单。事实被汇编起来，并与文档、访谈和测试进行交叉引用。每个事实可能有多个引用，某些事实可能具有几个共同引用（表格 8.4）。一致之处会被记录下来，但不一致之处则需要解决。例如，如果文档提供了加密算法列表，但访谈揭示了不同的列表，且测试无法证实这些差异，则需要解决这些问题。


    表格 8.4 提供了一个分析工作表的示例，包含四个事实陈述、评分和引用。评分从 0 到 10 分，10 分最高，0 分最差。工作表中的引用与引用列表进行交叉引用。


    ![](img/00002.jpeg)事实 #1 显示产品“X”具有 FIPS 140-2 认证，得 10 分，有四个引用：产品技术规范、NIST 证书、相应的
    FIPS 140-2 安全策略以及访谈 #1 的笔记。技术规范提了 FIPS 140-2 认证，证书号是在访谈中提供的。评估人员能够查找到该证书和相应的安全策略。


    #### 表格 8.4 分析工作表


    | *事实* | *评分* | *引用* |

    | --- | --- | --- |

    | 1\. 产品 X 有 FIPS 140-2 认证 | 10 | a. 产品技术规范<br>b. NIST 证书<br>c. FIPS 140-2 安全策略<br>d.
    访谈 #1 |

    | 2\. 产品 X 支持 AES | 10 | a. 产品技术规范<br>b. NIST 证书<br>c. 安全策略<br>d. 访谈 #2 |

    | 3\. 产品 X 支持 2K 和 3K | 6 | a. 产品技术规范<br>b. NIST 证书<br>c. 访谈 #2 |

    | 4\. 产品 X 支持 DES | 2 | a. 安全策略<br>b. 访谈 #2 |


