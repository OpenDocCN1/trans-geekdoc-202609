    The web server communicates to the `AS` which connects to the `DB server` over
    an application virtual local area network (`VLAN`) shown as a solid line. Conversely,
    the `RAS` communicates to the `AS` which connects to the `SS` and other servers
    over a separate admin `VLAN` denoted by a dotted line. What is new to this diagram
    is the network topology of the DMZ and the internal network showing the various
    routers, firewalls, and the two VLAN separating applications from administration.
    However, this diagram implies a single network instance with all routers, firewalls,
    and servers comingled at the same physical location with no redundancy, load balancing,
    or backup capabilities. Hence, the Network Architecture is yet another “cartoon”
    that provides more information but raises more questions. Once again, an information
    security professional needs further clarification.


    ![](images/00005.jpeg)


    Figure 1.3 Network architecture.


    When interviewed further, the system architects reveal the actual design; see
    [Figure 1.4](#part0006.html#fig1_4). The Network Architecture is duplicated in
    two regional datacenters: West and East. The two external routers are cross-connected,
    such that a connection to the West external router might be redirected to the
    East external router, and likewise a connection to the East external router might
    be redirected to the West external router. This cross-connection allows the datacenters
    to backup each other. Regardless of which external path is chosen the external
    firewall always interrogates the connection.


    Another discovery is the existence of the Business Portal (`BP`) server which
    supports an application direct connection. Comparable to the web server which
    only offers user access, the `BP` server offers a business-to-business connection
    for high volume traffic. Similar to the web server, the `BP` server communicates
    to the `AS` which connects to the `DB server` over the application `VLAN`. Also,
    the `BP` server is accessed by the `SS` and the `AS` over the Admin `VLAN`. As
    is often the case with enhancement projects, the focus on updating the web and
    `ASs` overlooked the `BP` server as, for this example, no changes are planned.


    Another difference is the cross-connection between the Region West and Region
    East internal network routers. This connection allows data synchronization between
    the regional servers: `ASs`, `DB servers`, `SSs`, and (`ASs`). The internal network
    router connection also allows system, `DB`, and application administrators to
    manage maintenance changes and modifications pushed from either region to another.


    ![](images/00006.jpeg)


    Figure 1.4 Enterprise architecture.


    The examples discussed in this chapter provide a typical discovery process when
    an information security professional gets involved with an enhancement project.
    Incomplete information is usually par as the various project teams have limited
    experience with information security issues and solutions. However, the importance
    of maintaining network diagrams should not be ignored nor understated. As an industry
    example, consider the Payment Card Industry Data Security Standard `[[24](#part0016.html#ref_24)]`
    requirements referring to current (accurate) network diagrams.


    ![](images/00002.jpeg)1.1.2 Current network diagram that identifies all connections
    between the cardholder data environment and other networks, including any wireless
    networks.


    ![](images/00002.jpeg)1.1.3 Current diagram that shows all cardholder data flows
    across systems and networks.


    Further, as another industry example, X9-TR-39 PIN Security and Key Management
    `[[28](#part0016.html#ref_28)]` addresses documented procedures (including network
    diagrams) within its compliance control objectives.


    ![](images/00002.jpeg)4.1.1 Secure Environment for PINs and Keys


    The secure environment is physically, logically, and procedurally protected with
    access controls or other mechanisms designed to prevent any penetration, which
    would result in the disclosure of all or part of any cryptographic key and/or
    PINs stored within the environment. Documented procedures exist and are followed
    that ensure the secured environment remains secure until all keying material has
    been removed or destroyed.


    References X9.8-1—Section 6.3.3 `[[29](#part0016.html#ref_29)]`; X9.24-1—[Sections
    7.3](#part0012.html#sec7_3) and 7.5.2 `[[30](#part0016.html#ref_30)]`; X9.24-2—[Section
    7.3](#part0012.html#sec7_3) `[[31](#part0016.html#ref_31)]`.


    Consequently, industry standards are equally important. However, technical and
    security standards abound with abbreviations, nomenclature, and terminology. Accordingly,
    the reader is provided with a cryptography lexicon and an overview of industry
    standards.


    ### 1.4 Cryptography Lexicon (#part0003.html#Rsec1_4)


    It was mentioned in the previous section that a little bit of math is unavoidable,
    but it is kept to a minimum. This section provides a simple math refresher, commonly
    used notation, and conventional cryptographic terminology used throughout the
    book. The information is listed by increasing order of difficulty.


    ![images](images/00007.jpeg)

    ![images](images/00008.jpeg)

    ![images](images/00009.jpeg)

    ![images](images/00010.jpeg)

    ![images](images/00011.jpeg)

    ![images](images/00012.jpeg)

    ![images](images/00013.jpeg)

    ![images](images/00014.jpeg)


    The reader is now armed with sufficient math notation and cryptographic terminology
    used throughout the book. Another area the reader should familiarize themselves
    is industry standards and the standard developer organizations.


    ### 1.5 Industry Standards (#part0003.html#Rsec1_5)


    Reading books, technical papers, journal articles, and blogs can be informational
    and often instructional, but knowing and understanding industry standards and
    specifications is a treasure trove. Cryptographic algorithms, schemas, protocols,
    and message specifications are all defined in standards. It is also important
    to understand who developed which standard. [Figure 1.5](#part0006.html#fig1_5)
    shows an overview of relevant standards organizations, including national standards
    body (NSB) and standards development organization (SDO) groups.


    **International Standards Organization** [(\*)](#part0006.html#fn1_1) (ISO) develops
    numerous worldwide standards based on consensus with 163 participating member
    countries. ISO is organized into hundreds of technical committees (TCs) arranged
    by industry areas that have published over 21,000 international standards and
    related documents. For example, `TC1` is screw threads, `TC120` is leather, `TC215`
    is health informatics, and `TC307` is blockchain and distributed ledger technologies.
    Relevant to this book is `TC68` for financial services.


    ![](images/00015.jpeg)


    Figure 1.5 Standards organizations.


    Members [(\*)](#part0006.html#fn1_2) of ISO are countries with NSB; individuals
    or companies cannot become ISO members. ISO offers three membership categories
    (full, correspondent, and subscriber) to over 160 countries, including the following:


    ![](images/00002.jpeg)The Australian NSB is Standards Australia [†](#part0006.html#fn1_3)
    (SA)


    ![](images/00002.jpeg)The Canadian NSB is the Standards Council of Canada [‡](#part0006.html#fn1_4)
    (SCC)


    ![](images/00002.jpeg)The French NSB is the Association French Normalization Organization
    Regulation [§](#part0006.html#fn1_5) (AFNOR)


    ![](images/00002.jpeg)The German NSB is the Deutsches Institut für Normung [¶](#part0006.html#fn1_6)
    (DIN)


    ![](images/00002.jpeg)The Japanese NSB is the Japanese Industrial Standards Committee
    [\*\*)](#part0006.html#fn1_7) (JISC)


    ![](images/00002.jpeg)The United Kingdom’s NSB is the British Standards Institution
    [††](#part0006.html#fn1_8) (BSI)


    ![](images/00002.jpeg)The United States’ NSB is the American National Standards
    Institute (ANSI)

