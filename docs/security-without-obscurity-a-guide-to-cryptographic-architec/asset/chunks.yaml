    Cryptographic hash algorithms have three essential characteristics.


    ![](images/00019.jpeg)


    Figure 2.3   Hash function.


    ![](images/00002.jpeg)**Pre-image resistance**: given a hash value (h) it is difficult
    to find any cleartext (Ci) such that H(Ci) = h. This characteristic is the basis
    for a one-way function.


    ![](images/00002.jpeg)**Second pre-image resistance**: given an input cleartext
    (Ci) it is difficult to find another cleartext (Cj) such that H(Ci) = H(Cj).


    ![](images/00002.jpeg)**Collision resistance**: it is difficult to find any two
    cleartext (Cj) and (Ck) such that H(Cj) = H(Ck). The pair (Cj) and (Ck) is called
    a cryptographic hash collision.


    Older hash functions such as MD4 and MD5 (named for message digest, another term
    for hash value) with 128-bit hashes are no longer considered cryptographically
    secure. Federal Information Processing Standard (FIPS) 180-4 \[[28](#part0016.html#ref_28)\]
    defines the Secure Hash Algorithm SHA-1 with 160-bit hash as a replacement for
    earlier message digest algorithms; SHA-2 family with 224-bit, 256-bit, 384-bit,
    and 512-bit hashes as a replacement for SHA-1. FIPS 202 \[[29](#part0016.html#ref_29)\]
    introduces an alternative SHA-3 family with 224-bit, 256-bit, 384-bit, and 512-bit
    hashes as a future replacement for SHA-2. Since SHA-2 is a family of hash algorithms,
    they are often referred to as SHA-256 or SHA-512; however, since the SHA-2 and
    SHA-3 have the same sizes, the hash algorithms can be confusing.


    Hash algorithms are used to protect stored passwords, as a type of non-cryptographic
    checksum, or with cryptographic keys discussed in [Section 2.3](#part0007.html#sec2_3).
    However, hash functions are susceptible to exhaustive attacks. Knowing the hash
    algorithm in use, anyone can create a list, commonly called a rainbow table, of
    possible hash values based on likely cleartext. For example, a hash table of all
    possible social security numbers (SSNs) is feasible since every possible SSN is
    also known. As another example, creating a rainbow table of all possible passwords
    is more difficult; however, generating a smaller table of commonly used 8-character
    passwords is much easier. Further, it is equally likely that such rainbow tables
    already exist.


    ### [2.3 Integrity and Authentication](#part0003.html#Rsec2_3)


    There are several data integrity and authentication methods including MAC and
    HMAC. In general, an ICV is created from the cleartext using a cryptographic key
    such that any party without access to the key cannot recreate the ICV. Any change
    to the cleartext is discernable because the ICV would not verify. However, data
    integrity and authentication do not provide data confidentially, as the cleartext
    is needed to create and verify the ICV. See [Section 2.1](#part0007.html#sec2_1)
    for a discussion on data confidentiality.


    ![](images/00002.jpeg)MAC \[[7](#part0016.html#ref_7)\] encrypts the cleartext
    but only retains part of the ciphertext as an ICV.


    ![](images/00002.jpeg)HMAC \[[8](#part0016.html#ref_8)\] merges (XOR) the cleartext
    with a key and hashes the result as an ICV.


    Symmetric integrity and authentication is illustrated in [Figure 2.4](#part0007.html#fig2_4)
    showing cleartext and a key used to create an ICV which can be verified using
    the same cleartext and key. The same key is used to create and verify the ICV,
    thus “symmetric” cryptography can provide data integrity and authentication. Following
    the data path from left to right, the cleartext and key are inputs to the MAC
    (or HMAC) function which yields the ICV. The same cleartext and key are inputs
    to another MAC (or HMAC) function which gives another ICV. If the two ICV match
    then the cleartext has not been modified or substituted. However, if the two ICV
    do not match then the cleartext has been altered or replaced.


    When a sender and a receiver are involved, as noted with dotted boxes, the sender
    generates the ICV using the cleartext and sends both the cleartext and ICV to
    the receiver. The receiver uses the same key to generate another ICV using the
    cleartext and compares the two ICV. If the two ICV match then the receiver not
    only knows the cleartext has integrity, the cleartext is also authenticated because
    only the sender should have the key. However, if the sender or receiver shares
    the key with other parties, authentication is no longer provided by the ICV. Further,
    neither the sender nor receiver can claim non-repudiation because the authentication
    is not provable to a third party. Any third party such as a judge or arbitrator
    would be unable to determine which party generated the ICV as both, the sender
    and receiver, has the same capability.


    Asymmetric integrity and authentication is depicted in [Figure 2.5](#part0007.html#fig2_5)
    showing cleartext and a private key used to create an ICV which can be verified
    using the corresponding public key. Only the private key can generate the ICV
    and only the associated public key can verify the ICV, thus “asymmetric” cryptography
    can provide data integrity with strong authentication. Following the data path
    from right to left (note the reversed asymmetric encryption flow from [Section
    2.1](#part0007.html#sec2_1)), the cleartext and private key are inputs to the
    sign function which yields the ICV (more commonly known as a digital signature).
    The same cleartext and associated public key are inputs to the verify function.
    If the digital signature (ICV) verifies then the cleartext has not been modified
    or substituted, then the signature must have been generated by the corresponding
    private key.


    ![](images/00020.jpeg)


    Figure 2.4   Symmetric integrity and authentication.


    ![](images/00021.jpeg)


    Figure 2.5   Asymmetric integrity and authentication.


    When a sender and a receiver are involved, as noted with dotted boxes (note the
    reversed symmetric sender and receiver from [Figure 2.4](#part0007.html#fig2_4)),
    the sender generates the digital signature using the cleartext and the private
    key and sends both the cleartext and the digital signature to the receiver. The
    receiver uses the same cleartext and associated public key to verify the digital
    signature, and if the signature verifies the receiver not only knows the cleartext
    has integrity, the cleartext has strong authentication because only the sender
    has the private key. Further, if the sender has the appropriate controls for the
    private key and digital signature, the receiver might also claim non-repudiation.
    See [Section 2.4](#part0007.html#sec2_4) for details of non-repudiation services.


    In summary, symmetric algorithms use the same key for:


    ![](images/00002.jpeg)encryption versus decryption, or


    ![](images/00002.jpeg)generation of an ICV for sending a message versus verifying
    a message.


    Conversely, asymmetric algorithms use different keys for:


    ![](images/00002.jpeg)public key for encryption versus private key for decryption,
    or


    ![](images/00002.jpeg)private key for generation of a digital signature versus
    public key for verification of a digital signature.'
