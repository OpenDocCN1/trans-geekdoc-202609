    某些安全策略考虑了在密钥泄露这种极罕见情况下的撤销；然而，有许多合法的业务和运营原因会导致提前终止加密密钥。例如，当员工离职或被解雇时，雇主提供的任何加密密钥都需要撤销；禁用员工账户是必要的，但并不充分，因为攻击者可能会重新使用这些密钥。另一个例子是，当在线网络服务停用时，发放给该服务的`TLS`密钥需要撤销。一个遗憾的场景是为去世客户撤销加密密钥。


    ### 密钥终止 (Key Termination)

    `Key Termination` 是预期的密钥过期。如所述，所有密钥都必须有有效期；密钥不能永久使用。不幸的是，安全专业人员发现已使用十年或更久的密钥并不罕见。数字证书
    [13]\]中公钥中最为人知的有效期是 `not-before` 和 `not-after` 有效日期；参见附录：X.509 证书快速参考以获取数字证书概述。常见的假设是证书的有效期同样适用于相应的私钥，但情况并非如此。例如，用于验证数字签名的公钥生命周期可能比用于生成数字签名的私钥更长。这一点可以参考代码签名证书：如果软件上的签名日期在证书的
    `not-after` 有效日期之前，即使证书已过期，签名通常仍被认为是有效的。相关的风险是系统钟可以调整到更早的时间以反映更早的软件签名。


    当对称密钥或异步私钥过期时，正确的做法是销毁所有副本以防止滥用。数据无法使用过期的密钥加密，之前加密的数据无法解密。无法使用过期的私钥生成数字签名。然而，数字签名可能仍然可以验证，因为公钥证书是公开的，可能每一份副本都未被纳入范围。与密钥终止相关的风险是忽略了过期的密钥。此外，当密钥用于身份验证和完整性（如
    `MAC`、`HMAC` 或数字签名）时，可能存在业务或运营需求，在超出运行周期后保留密钥。


    ### 密钥归档 (Key Archive)

    `Key Archive` 是在密钥超出运行周期后将其保留。归档密钥不允许存在于生产环境中，否则可能会被滥用。相反，归档密钥存储在隔离环境中，仅用于验证旧的受加密保护的数据（例如
    `HAC`、`HMAC`、数字签名），以应对欺诈调查、传票、诉讼或其他法律争议等事件。用于数字签名的私钥绝不应归档，以避免任何伪签名可能。在实践中，加密密钥很少被归档。归档密钥相关的主要风险将其重新安装到生产环境中。


    ### 7.5 数据管理

    与加密密钥类似，数据也有自己的生命周期。虽然有许多数据管理模型，但图 7.10 提供了一个基于本章讨论的密钥管理生命周期的数据生命周期状态转换图。数据生命周期阶段类似于密钥生命周期阶段：(1)
    数据创建，(2) 数据传输，(3) 带备份和恢复的数据使用，(4) 数据删除以及(4) 数据保留。


    #### 数据创建 (Data creation)

    `Data creation` 是信息首次提供的过程。例如，分配账号、分配密码、分配社会安全号、保存电子表格、撰写电子邮件、发布文档、输入推文、创建卡片账号、与持卡人共享
    `PAN`、与商户共享 `PAN` 以及对 `PAN` 进行去令牌化。如第 2 章所述，保护信息的方法之一是 `detokenization`。


    #### 数据传输 (Data transfer)

    `Data transfer` 是发送或接收信息的过程。通过公共网络（如互联网）、私有网络（如 `MPLS`）或专用连接（如租线）进行数据加密变得越来越常见。`TLS`
    和 `IPsec` 等加密解决方案在第 5 章中进行了讨论，但如第 3 章所述，有很多可用的管理方法。本章还讨论了影响加密的密钥管理生命周期相对风险。


    ![](img/0101.jpeg)


    图 7.10 数据管理。


    然而，加密架构中需要考虑的另一个常见安全控制是对传输中加密数据的监控。企业级监控在第 3 章中讨论过，并在图 7.11 中再次展示，显示浏览器通过 `TLS`
    连接到服务器。`TLS` 连接从浏览器出发，通过互联网连接到位于 DMZ 内的服务器。服务器拥有一个 `TLS` 非对称公私钥对，其证书与浏览器共享。TLS
    非对称密钥对被复制到位于企业内部的监控系统中。TLS 流量在 DMZ 内被捕获并同样复制到监控系统中。监控系统可以重放 TLS 握手，从而重新计算会话密钥并解密。


    然而，如果使用了临时密钥，监控系统无法重新计算会话密钥，因为临时密钥寿命很短且在服务器外部不可用。3](#part0008.html#ch03)，`TLS
    v1.3` 已在第 5 章中讨论过。`TLS v1.3` 强制使用临时密钥以实现后安全性，并弃用了用 `RSA` 进行密钥建立。基于目前的设计，监控系统可能无法转发
    TLS 握手；监控系统需要访问临时密钥。


    另一种基于浏览器的监控方法使用 `MITM` 证书，如图 7.12 所示。企业网络内部的浏览器通过 `TLS` 连接到互联网上的服务器。在这种情况下，企业需要监控入站流量以发现可能的恶意软件，并监控出站流量以防止数据泄露。监控由位于
    DMZ 的代理服务器完成，该服务器干预浏览器和服务器之间；代理服务器也是一个颁发 `MITM` 证书的证书机构 (CA)。`MITM` 证书适用于任何包含临时密钥的
    `TLS` 密码套件。


