    当然，目标是利用消耗最少资源、成本最低的安全控制措施来实现最低合理的风险，从而节省资金。这有时被称为“魔力盒”（Magic Box），它代表了在可接受的安全控制下实现了足够低的风险。例如，如果成功攻击的概率被认为太遥远，或者对业务的影响被认为微乎其微，那么实施安全控制的可能性较低，特别是当该安全控制成本高昂且与应用程序及其数据的价值不成比例时。相反，如果安全控制带来的收益（如降低风险或符合合规性）足够高，且总成本可以接受并与应用程序（及其数据）成比例，那么该安全控制更有可能被实施。


    ISO/IEC 信息安全管理实践规范标准 [74] 建议，由管理层批准的信息安全策略文档应包含一个设定控制目标和控制的框架，包括风险评估和风险管理的结构。一个示例框架《联邦信息安全管理法风险管理框架》提供了一个六步流程
    [75]。


    ![](img/00089.jpeg)


    图 7.1    风险降低曲线。


    1. 根据影响分析，对信息系统以及该系统处理、存储和传输的信息进行`Categorize`（分类）。这一步考虑了法律法规、政策、指令、条例、标准以及组织的使命/业务/运营需求，有助于识别安全需求。

    2. 根据安全分类，为信息系统`Select`（选择）一组初始基线安全控制；根据组织对风险的评估和当地状况，对安全控制基线进行调整和补充。

    3. `Implement`（实施）安全控制，并描述这些控制如何在信息系统及其运行环境中使用。

    4. 使用适当的评估程序对安全控制进行`Assess`（评估），确定控制实施是否正确、是否按预期运行，以及在满足系统安全需求方面是否产生了预期结果。

    5. 根据信息系统运行对组织业务和资产、个人、其他组织以及国家带来的风险判断，以及该风险可接受的决策，对信息系统运行进行`Authorize`（授权）。

    6. 持续监控信息系统中的安全控制，包括评估控制的有效性、记录系统或其运行环境的变化、对相关更改进行安全影响分析，并向指定的组织官员报告系统的安全状态。


    然而，实施或衡量一个不影响或依赖于其他控制的安全控制通常是困难的。例如，实施密码构造规则（例如：由八字符组成，包含大写和小写字母且至少包含一个数字和一个特殊字符）实际上减少了可能密码的集合。同时，没有密码构造规则将允许用户选择糟糕且易于破解的密码。因此，添加密码构造控制会影响密码验证控制。但很少有任何安全控制是在孤立状态下运行的，安全模型见图
    7.2。需要理解安全需求，以确定整体风险与控制的平衡。


    图 7.2 显示了评估风险和控制的分层“洋葱”方法。加密密钥用于保护数据。加密模块用于保护加密密钥。但加密模块可能是计算机系统绑的软件库、嵌入在应用程序软件中，或封装在加密硬件安全模块（`HSM`）中。无论如何，系统保护加密模块。最终，具有物理和逻辑安全控制的设施保护系统。然而，在加密架构方面，存在内在的标准差距，如图图
    7.3 所示。


    当加密算法、密钥管理方案或安全协议的标准发布时，它将包含读者需要理解的要求（例如 `shall`）和建议（例如 `should`）。遗憾的是，当此类安全标准被产品化时，标准内容与产品实际功能之间往往存在差距。这是由于多种因素造成的，包括缺乏理解、缺乏知识、缺乏专业知识、设计缺陷、编码错误、成本限制以及上市时间。如今的信息技术行业倾向于以更少的测试将产品推向市场，导致修复、补丁和频繁的修改已成为常见主题。遗憾的是，这对于加密产品通常也是如此，因为它们的更新有时会对安全控制产生不利影响。


    ![](img/00090.jpeg)


    图 7.2    安全模型。


    ![](img/00091.jpeg)


    图 7.3    标准差距。


    另一个差距来源是加密产品的安装。当加密产品配置不当时，其安全性可能会受到损害。为了向下兼容，某些产品支持旧的算法、较弱的密钥或过时的协议。如果不需要的功能无法禁用只是不使用，那么存在漏洞的方法可能会被无意或故意使用，增加对应用程序环境的风险。此外，如果产品的使用方式与相应的标准或制造商的建议不，就会增加风险。例如，一个旨在加密数据的加密产品被用于加密密钥，增加了密钥泄露的风险。


    一旦产品安装，就需要进行妥善管理。需要建立访问控制以防止未经授权的重新配置。错误修复、补丁和修改在非生产环境中经过充分测试后才能应用。需要监控处理过程以确保没有活跃攻击。配置更改、软件更改和处理过程都需要记录日志，并对日志进行分析。然而，如果产品管理不当，差距可能会增加风险，并随着时间的推移使风险不断增大。


    后续章节将讨论每一层：设施安全、系统安全加密模块、密钥管理和数据管理。第一层设施安全将讨论物理和逻辑控制。


    ### 7.1 设施安全


    设施安全包括各种物理和逻辑控制，用于保护系统，系统反过来保护加密模块，模块保护加密密钥，密钥用于保护数据。图 7.4 展示了一个示例数据中心，它被安全围栏包围，并环绕着一条排水沟。一个带有岗亭的单一入口提供了校园的进出。停车位和大堂入口之间是一条环绕在土坡种植树木上的环形车道。建筑有屋顶进入通道，周围环绕着小路。


    众多校园元素提供的物理安全控制代表了分层安全方法。每个元素提供的各种控制将从校园外部向内部呈现，最终进入实际的数据中心。


