    客户端使用 SSH 主机 PK 加密随机数，SSH 主机解密该随机数，双方派生 SK（加密和 HMAC）。除了 SSH 主机外，SSH 客户端可能还有自己的
    RSA 密钥对来数字签名挑战，以便 SSH 主机认证 SSH 客户端。


    ![](img/00063.jpeg)


    图 5.5 SSH 加密架构。


    ### 5.4 良好的隐私保护 (OpenPGP)


    OpenPGP [72] 是一种基于 Pretty Good Privacy® (PGP) 的标准安全协议，由 Philip R. Zimmermann^(\*)
    于 1991 年开发。PGP® 是一组提供加密、数字签名和密钥管理的软件功能。OpenPGP 消息由由数字标识的各种包组成。图 5.6 提供了两个从 Alice
    发给 Bob 和 Chuck 的消息示例，其中一个使用非对称密钥加密，另一个使用对称密钥加密。两条消息都使用对称数据加密保证机密性，并使用哈希保证数据完整性。


    从密码学的角度来看，每个参与者都有一个包含其公私钥以及其他人 PK 的密钥环。任何对称密钥都封装在消息内部，而不是参与者的密钥环中。


    ![](img/00002.jpeg)Alice 的密钥环：包含她的公私钥、Bob 的 PK 和 Chuck 的 PK。


    ![](img/00002.jpeg)Bob 的密钥环：包含他的公私钥、Alice 的 PK 和 Chuck 的 PK。


    ![](img/00002.jpeg)Chuck 的密钥环：包含他的公私钥、Alice 的 PK 和 Bob 的 PK。


    ![](img/00064.jpeg)


    图 5.6 OpenPGP 加密架构。


    第一条消息（左侧）由四个包组成：两个 Tag 1 包、一个 Tag 9 包和一个 Tag 19 包。两个 Tag 1 包是公钥加密的会话密钥包。这些包包含使用接收者
    PK 加密的 SK。单个 Tag 9 包是对称密钥加密的会话密钥包。该包包含使用对称 SK 加密的数据。最后的 Tag 19 包是篡改检测码包，包含数据的哈希值。


    ![](img/00002.jpeg)Bob 仅可以使用其私钥解密其中一个 Tag 1 包，得到用于解密 Tag 9 包的 SK，从而得到数据。Bob 使用
    Tag 19 包来验证解密数据的完整性。


    ![](img/00002.jpeg)Chuck 仅可以使用其私钥解密另一个 Tag 1 包，得到用于解密 Tag 9 包的 SK，从而得到数据。Chuck
    使用 Tag 19 包来验证解密数据的完整性。


    第二条消息（右侧）同样由四个包组成：两个 Tag 1 包、一个 Tag 9 包和一个 Tag 19 包。两个 Tag 1 包是公钥加密的会话密钥包。这些包包含使用接收者
    PK 加密的 SK。单个 Tag 9 包是对称密钥加密的会话密钥包。该包包含使用对称 SK 加密的数据。最后的 Tag 19 包是篡改检测码包，包含数据的哈希值。


    ### 5.5 密码与个人识别码


    知识因素认证是“你所知道”的方法，包括密码和个人识别码（PIN）。传输密码与 PIN 的方法非常不同，验证密码与 PIN 的方法也不同。密码和 PIN 的验证在第
    4 章中讨论过，而图 5.7 显示了密码与 PIN 加密的对比。图的上部分显示用户输入密码进行密码验证；下半部分显示用户输入 PIN 进行 PIN 验证。无论何种知识因素，密码（或
    PIN）都需要从输入点传输到验证点。用户标识符（例如名称）被验证过程用于从数据库中获取用户配置。


    密码流（上图）包括用户输入并加密密码、将加密后的密码传输到验证系统，以及在验证时解密密码。很少有加密密钥专门用于加密密码。相反，如果加密了密码，通常是在 TLS
    连接中。因此，从加密架构的角度来看，用户系统拥有验证系统的 PK（最好是 X.509 证书）。验证系统拥有其公私钥对。加密和 HMAC SK 在 TLS 握手期间协商，密码在
    TLS 数据包内传输。加密后的密码从用户传输到验证系统。


    PIN 流（下图）包括用户输入 PIN，但由专门进程执行 PIN 加密。加密 PIN 块从一个系统传输到另一个系统，从一个对称密钥转换为另一个。随着加密 PIN
    块跨越多个网络到达 PIN 验证系统，PIN 转换次数会有变化。PIN 验证系统解密加密 PIN 块并按照第 4 章所述的方法验证 PIN。图 5.8 提供了一个
    PIN 支付过程的示例。


