  trans: "\n\nITU-T(0) 建议(0) 也写作 `0.0 arc`\n\nITU-T(0) 管理(2) 也写为 `0.2 arc`\n\nITU-T(0)\
    \ 网络运营商(3) 也写为 `0.3 arc`\n\nITU-T(0) 识别组织(4) 也写为 `0.4 arc`\n\nITU-T(0) R-建议(5)\
    \ 也写为 `0.5 arc`\n\nITU-T(0) 数据(9) 也写为 `0.9 arc`\n\n次级 ISO 弧的定义如下：\n\nISO(1) 标准(0)\
    \ 也写为 `1.0 arc`\n\nISO(1) 注册机构(1) 也写为 `1.1 arc`\n\nISO(1) 成员机构(2) 也写为 `1.2 arc`\n\
    \nISO(1) 识别组织(3) 也写为 `1.3 arc`\n\n次级 联合 ISO-ITU-T 弧的定义如下：\n\nISO/ITU-T(2) 模块(1)\
    \ 也写为 `2.1 arc`\n\nISO/ITU-T(2) 文档类型(2) 也写为 `2.2 arc`\n\nISO/ITU-T(2) asn-1(3)\
    \ 也写为 `2.3 arc`\n\nISO/ITU-T(2) 国际 md(5) 也写为 `2.5 arc`\n\nISO/ITU-T(2) 国际组织(6)\
    \ 也写为 `2.6 arc`\n\nRFC 5820 Internet X.509 公钥基础设施 (PKIX) 规范示例包含以下 OID。详情请参附录：X.509\
    \ 证书快速参考。\n\n`CPS Qualifier` 为 `iso (1) identified-organization(3) dod(6) internet(1)\
    \ security(5) mechanisms(5) pkix(7) id-qt(2) id-qt-cps(1)` 或 `1.3.6.1.5.5.7.2.1`\n\
    \n`Key Usage` 为 `joint-iso-ccitt(2) ds(5) id-ce(29) id-ce-keyUsage (15)` 或 `2.5.29.15`\n\
    \n`Extended Key Usage` 为 `joint-iso-ccitt(2) ds(5) id-ce(29) id-ce-extKeyUsage(37)`\
    \ 或 `2.5.29.37`\n\n`Subject Alternate Name` 为 `joint-iso-ccitt(2) ds(5) id-ce(29)\
    \ id-ce-subjectAlt-Name(17)` 或 `2.5.29.17`\n\n`CRL Distribution Points` 为 `joint-iso-ccitt(2)\
    \ ds(5) id-ce(29) id-ce-cRLDistributionPoints(31)` 或 `2.5.29.31`\n\n另一个例子是 X9.73\
    \ 加密消息语法 (CMS) 标准根据国际标准组织技术委员会 68 分配给金融服务业的认可标准委员会 X9 组织拥有其自己的 OID。\n\n`CMSObjectIdentifers`\
    \ 为 `iso(1) identified-organization(3) tc68(133) country(16) x9(840) x9Standards(9)\
    \ x9-73(73) module(0) oids(1) v2009(1)` 或 `1.3.133.16.840.9.73.0.1.1`\n\n每个 X9\
    \ 标准都根据 ASC X9 弧 `1.3.133.16.840.9` 拥有自己的弧，使用其分配的数字作为下一个值，随后是其自己的 OID 结构。\n\n\
    有几个在线 OID 注册表，但没有一个能包含所有注册的 OID，或者说没有中央仓库。此外，许多标准或规范并不使用 OID，而是使用私有编号系统或其他标识方案。在互联网上可以找到一些\
    \ OID 注册表：\n\n- [Alvestrand](https://alvestrand.no/objectid/) Alvestrand OID 注册表\n\
    - [GnuPG](https://gnupg.org/oids.html) GnuPG OID 注册表\n- [Info](https://oid-info.com/)\
    \ Info OID 注册表\n\n### ASN.1 模块\n\n本附录提供了一个抽象语法一 (ASN.1) 模块，用于定义第 6 章](#part001)\
    \ 中讨论的加密架构。此 ASN.1 模块适用于编程语言代码生成。此处提供的抽象模式可能填充数据库或创建加密模块的可视化解释。\n\n```\nCryptographicModule\
    \ ::= SEQUENCE {\n   version          INTEGER,\n   productInfo      ProductData,\n\
    \   cryptoInfo       CryptoData,\n\n   productCategory  ProductType,\n   hostInfo\
    \         HostData,\n   protocolInfo     ProtocolData\n}\n\nProductData ::= SEQUENCE\
    \ SIZE(1..MAX) OF ProductName\n\nProductName ::= SEQUENCE {\n   manufacturer \
    \ AnyLanguage,\n   make          AnyLanguage OPTIONAL,\n   model         AnyLanguage\
    \ OPTIONAL,\n   number        AnyLanguage OPTIONAL,\n   nickname      AnyLanguage\
    \ OPTIONAL\n}\n\nAnyLanguage ::= UTF8String (SIZE(1..MAX))\n\nCryptoData ::= SEQUENCE\
    \ SIZE(1..MAX) OF CryptoName\n\nCryptoName ::= SEQUENCE {\n   algorithmID    AlgorithmIdentifier,\n\
    \   keySizeBits    INTEGER  OPTIONAL,\n   hashSizeBits   INTEGER  OPTIONAL,\n\
    \   keyUse         KeyUsage,\n   keyLifecycle   CryptoDates\n}\nKeyUsage ::= SEQUENCE\
    \ SIZE(1..MAX) OF OBJECT IDENTIFIER\n\nCryptoDates ::= SEQUENCE {\n   generationDate\
    \  Time,\n   useDate         Time  OPTIONAL,\n   endDate         Time  OPTIONAL,\n\
    \   terminationDate  Time,\n   archiveDate     Time  OPTIONAL\n}\nTime ::= GeneralizedTime\n\
    \nProductType ::= SEQUENCE {\n   hardware  BOOLEAN,\n   firmware  BOOLEAN,\n \
    \  software   BOOLEAN,\n   compiled   BOOLEAN,\n   embedded  BOOLEAN,\n   bundled\
    \   BOOLEAN\n}\n\nHostData ::= SEQUENCE SIZE(1..MAX) OF ProductName\n\nProtocolData\
    \ ::= SEQUENCE SIZE(1..MAX) OF ProtocolName\n\nProtocolName ::= SEQUENCE {\n \
    \  protocolName  AnyLanguage,\n   nickname      AnyLanguage OPTIONAL,\n   protocolID\
    \    INTEGER,\n   parameters    INTEGER\n}\n```\n\n### 鸣谢\n\n特别感谢 Phil Griffin\
    \ 审查、更新和验证 ASN.1 语法。\n\nRFC 4648 Base16, Base32 和 Base64 数据编码。\n\n"
