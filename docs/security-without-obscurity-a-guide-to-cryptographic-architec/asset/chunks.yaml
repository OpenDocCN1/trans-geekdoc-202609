- fmt: '

    This X.509 extension contains policy information for the certificate. For end-entity
    certificates, the extension identifies the specific policy under which the certificate
    was issued including the intended purposes for using the certificate. For CA certificates
    the extension might list the set of policies for issuing certificates; however,
    if the CA has no policy limits then the `anyPolicy` OID = `2.5.29.32.0` can be
    used instead. Business applications with specific policy requirements can validate
    this extension and reject the certificate if noncompliant. Ideally, this extension
    includes a uniform resource locator (`URL`) pointing to the Certificate Practice
    Statement (`CPS`) published by the CA.


    ### Subject Alternative Name


    This X.509 extension, the subject alternate name (`SAN`) contains a list of substitute
    identities, basically a type of “doing business as” information. Each name is
    equally associated with the subject public key as is the `Subject`. This allows
    a `Subject` to operate under more than one name, but using the same certificate
    and asymmetric keys.


    Industry conventions now include the Subject common name (`CN`) in the `SAN` extension
    along with other names, and sometimes the `SAN` only includes the `CN`. Further,
    the `SAN` size has been extended to allow for hundreds of alternate names. This
    latter change alleviates the need for wildcard certificates where the `Subject
    CN` `*` matches any name. For example, the domain name `[www.example.com]` might
    be listed as `*.[example.com]` which would match `[sample1.example.com]` and `[sample2.example.com]`
    or any similar website. Conversely, the `SAN` extension would include `[www.example.com]`,
    `[sample1.example.com]`, and `[sample2.example.com]` but no others. The wildcard
    allows any equivalent match whereas the `SAN` extension limits matching to a specific
    set of names. Ironically, adding a wildcard name to a `SAN` extension basically
    defeats the purpose of using the `SAN` extension altogether.


    ### Basic Constraints


    This X.509 extension identifies whether the certificate subject is a CA and can
    further define the maximum PKI hierarchy for certificate validation. Otherwise,
    the certificate is an end-entity certificate whose public key cannot be used to
    verify a certificate signature.


    Paradoxically, end-entity self-signed certificates are not CA certificates, and
    yet the certificate public key is used to verify the certificate signature. Despite
    the digital signature, a self-signed certificate cannot have data integrity or
    authenticity much less any non-repudiation. Any attacker can change any of the
    certificate information, replace the public key, and resign the certificate with
    a corresponding private key; the changes are undetectable. See the discussion
    in this annex on self-signed certificates.


    ### CRL Distribution Points


    This X.509 extension provides information to obtain `CRL` information. Typically,
    an `URL` points to a website where the current `CRL` is posted for downloading.
    The `CRL` reason flags are another set of bits.


    ### Authority Information Access


    This X.509 extension provides issuer information or access to issuer services.
    Issuer information might contain CA certificates to assist in determining an appropriate
    certificate chain. Issuer services might contain validation services such as the
    location of Online Certificate Status Protocol responder. The authority information
    access extension does not contain `CRL` as that information is in the `CRL Distribution
    Points` extension.


    ![images](images/00150.jpg)


    #### Self-Signed Certificates


    This X.509 extension identifies whether the certificate subject is a CA and can
    further define the maximum PKI hierarchy for certificate validation. Otherwise,
    the certificate is an end-entity certificate whose public key cannot be used to
    verify a certificate signature.


    Paradoxically, end-entity self-signed certificates are not CA certificates, and
    yet the certificate public key is used to verify the certificate signature. Despite
    the digital signature, a self-signed certificate cannot have data integrity or
    authenticity much less any non-repudiation. Any attacker can change any of the
    certificate information, replace the public key, and resign the certificate with
    a corresponding private key; the changes are undetectable. See the discussion
    in this annex on self-signed certificates.


    ![images](images/00151.jpg)

    Figure 1: Self-signed vs CA-signed certificates


    The self-signed certificate has a signature generated by its own private key,
    and the public key is used to verify the signature. The CA-signed certificate
    has a signature generated by the CA''s private key, and the CA''s public key is
    used to verify the signature.


    ![images](images/00152.jpg)

    Figure 2: Comparison of self-signed and CA-signed certificates


    The self-signed certificate has a signature generated by its own private key,
    and the public key is used to verify the signature. The CA-signed certificate
    has a signature generated by the CA''s private key, and the CA''s public key is
    used to verify the signature.


    ![images](images/00153.jpg)


    ### OID Quick Reference


    This annex provides an overview of OID values. The ITU-T X.660 standard provides
    the following definition for an OID.


    **Object identifier**: An ordered list of primary integer values from the root
    of the international OID tree to a node, which unambiguously identifies that node.


    ![images](images/00154.jpg)


    According to the scheme, each numbered position can take any integer value of
    0 or greater so an OID is infinitely extensible, and as many positions can be
    used so an OID is infinitely expandable. This allows every OID to be globally
    unique. Once defined and registered, an OID is never deleted or changed. However,
    more than one OID might have the same meaning.

