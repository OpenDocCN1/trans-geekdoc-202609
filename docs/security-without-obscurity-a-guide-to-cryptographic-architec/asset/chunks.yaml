    哈希（Hash）也被称为“单向”函数，因为给定一个哈希值，函数无法还原以恢复明文；哈希是不可逆的。哈希的目的是对明文进行相对唯一的表示，有时被称为指纹。哈希之所以是“相对”唯一的，是因为所有可能的输入（变长明文）的总数远大于可能的输出（固定长度哈希）的数量。这简单意味着多个明文输入可能会相同的哈希值。因此，对于某组不同的明文（`Ci`、`Cj`、`Ck`
    或更多），相同的哈希函数产生相同的哈希值：即 `H(Ci) = H(Cj) = H(Ck) = h`。这被称为哈希碰撞，是任何哈希函数的特征。然而，某些哈希函数的碰撞率太高；这就是加密哈希算法存在的根本原因。


    加密哈希算法具有三个基本特性。


    ![](img/00019.jpeg)


    图 2.3 哈希函数。


    ![](img/00002.jpeg)


    **抗原像性**：给定一个哈希值（`h`），很难找到任何满足 `H(Ci) = h` 的明文（`Ci`）。这一特性是单向函数的基础。


    ![](img/00002.jpeg)


    **抗二原像性**：给定一个输入明文（`Ci`），很难找到另一个满足 `H(Ci) = H(Cj)` 的明文（`Cj`）。


    ![](img/00002.jpeg)


    **抗碰撞性**：很难找到任意两个明文（`Cj`）和（`Ck`）使得 `H(Cj) = H(Ck)`。这对（`Cj`）和（`Ck`）被称为加密哈希碰撞。


    旧的哈希函数如 `MD4` 和 `MD5`（以消息摘要，即哈希值的另一个术语命名）具有 128 位哈希值，不再被认为是加密安全的。联邦信息处理标准（FIPS）
    180-4 [28]）定义了具有 160 位哈希的安全哈希算法 `SHA-1`，作为较早消息摘要算法的替代方案；具有 224 位、256 位、384 位和
    512 位哈希的 `SHA-2` 族作为 `SHA-1` 的替代。FIPS 202 [29] 引入了另一种 `SHA-3` 族，具有 224 位、256 位、384
    位和 512 位哈希，作为 `SHA-2` 的未来替代。由于 `SHA-2` 是一族哈希算法，它们通常被称为 `SHA-256` 或 `SHA-512`；然而，由于
    `SHA-2` 和 `SHA-3` 具有相同的大小，哈希算法可能会引起混淆。


    哈希算法用于保护存储的密码、作为一种非加密校验和，或与节 2.3 节中讨论的加密密钥配合。然而，哈希函数容易受到穷举攻击。一旦知道使用的哈希算法，任何人都可以根据可能的明文创建一个可能的哈希值列表，通常称为彩虹表。例如，哈希算法可以用于从明文生成哈希值，但在计算上逆转该过程是不可行的。


