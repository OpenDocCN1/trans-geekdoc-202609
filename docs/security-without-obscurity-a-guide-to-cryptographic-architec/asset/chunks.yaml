    ![](images/00002.jpeg)[Figure 3.6](#part0008.html#fig3_6) shows how a terminal
    uses the `IK` to generate derived keys (`DKs`) to send encrypted transactions
    to a host.


    ![](images/00002.jpeg)[Figure 3.7](#part0008.html#fig3_7) shows how a host receives
    and processes the encrypted transactions from a terminal having only the base
    derivation key (`BDK`).


    [Figure 3.5](#part0008.html#fig3_5) shows how the host injects a unique `IK` into
    a terminal. The host encrypts a terminal identifier (`TID`) to generate an `IK`
    that is electronically injected into a terminal. The `TID` is unique to each terminal;
    consequently, each `IK` is unique to each terminal. The key injection is typically
    performed within a key injection facility (`KIF`) specifically designed and managed
    for key loading. A `KIF` has physical security, logical access controls, and monitoring.
    Once terminals are loaded with unique `TID` and `IK`, they are added to an inventory
    system and eventually shipped to their designated locations for physical installation.


    ![](images/00033.jpeg)


    Figure 3.5  DUKPT IK.


    [Figure 3.6](#part0008.html#fig3_6) shows how a terminal uses the `IK` to generate
    `DKs` per transaction to encrypt personal identification numbers (`PINs`). The
    terminal uses the transaction counter (`TC`) and the `IK` exactly once to generate
    the first `DK`. The `IK` is destroyed so it no longer resides within the terminal.
    If the terminal is compromised only an unused `DK` remains in the terminal. When
    a user enters a `PIN`, the `DK` is used to encrypt the `PIN` creating an encrypted
    PIN (`EP`). The `EP`, the `TC`, and the `TID` are sent to the host which only
    has the `BDK`. The terminal increments `TC` and uses the `DK` to generate the
    next `DK`. Again, if the terminal is compromised only an unused `DK` remains in
    the terminal. Each time a `DK` is used, the current `EP`, `TC`, and `TID` are
    sent to the host, and the `TC` is incremented to generate the next `DK`.


    [Figure 3.7](#part0008.html#fig3_7) shows how the host processes a transaction
    received from a terminal having only the `BDK`. The transaction includes the `EP`,
    the `TC`, and the `TID`. First, the host uses the `BDK` to encrypt the `TID` for
    recreating the terminal’s unique `IK`. Second, the host uses the `IK` with the
    `TC` to cycle through the derivation algorithm to determine the current `DK`.
    Third, the host uses the `DK` to decrypt the `EP` and recover the `PIN`. Once
    the `PIN` has been decrypted, the `IK` and the `DK` are erased and the host only
    retains the `BDK`. Note that the same `DK` might be inadvertently generated on
    different terminals at different times, but overall each `DK` is relatively unique
    to each terminal.


    The DUKPT example discussed here is for securely transmitting a `PIN` from a terminal
    to a host.


    ![](images/00034.jpeg)


    Figure 3.6  DUKPT terminal keys.


    ![](images/00035.jpeg)


    Figure 3.7  DUKPT host keys.


    ![](images/00002.jpeg)The `PIN` is encrypted at the point of entry by the terminal


    ![](images/00002.jpeg)The `EP` is transmitted from the terminal to the host


    ![](images/00002.jpeg)The `PIN` is decrypted by the host for verification


    The host might verify the `PIN` or possibly re-encrypted the `PIN` for further
    transmission to another network or host for verification. However, the DUKPT method
    can be used to establish an encryption key for any type of data or cryptographic
    function, not just `PIN` encryption. Any of these methods (fixed key, `MK/SK`,
    and DUKPT) can be used for establishing keys between communicating parties (e.g.,
    sender and receiver).


    ## Faux Key Method


    Other methods can be used for delivering `DEKs` from a key management system to
    a data storage system, such as a database or other information repository. Some
    key delivery methods protect keys better than others, while others challenge basic
    cryptography industry practices. [Figure 3.8](#part0008.html#fig3_8) illustrates
    one method called faux key showing a database on the left communicating over a
    secure channel (`TLS`) to a key manager on the right. Transport Security Layer
    (`TLS`) is addressed in [Chapter 5](#part0010.html#ch05). This method is called
    faux key because the database spoofs the key manager by encrypting and decrypting
    a special data element that is used as a `DEK`. Cryptographic hardware security
    modules versus software modules are discussed in [Chapter 7](#part0012.html#ch07).


    The database performs key initialization at start-up when it generates a `DEK`
    in system memory using some random number generation method. The database uses
    the cleartext `DEK` in memory to encrypt and decrypt local data. The cleartext
    key is sent to the key manager over a secure connection (`TLS`). The key manager,
    functionally unaware that the data encryption request is actually for a cryptographic
    key, dutifully encrypts the `DEK` and returns it to the database. The database
    stores the encrypted `DEK` on disk for subsequent restarts. When the system or
    database is restarted, the database sends the encrypted key is sent to the key
    manager for decryption. Again, the key manager unaware that the data decryption
    request is for a cryptographic key, obediently decrypts the `DEK` and returns
    it to the database. The database uses the cleartext `DEK` in memory to encrypt
    and decrypt local data.


    ![](images/00036.jpeg)


    Figure 3.8  Faux key delivery.


    The key manager uses what is commonly called a “master” key to encrypt and decrypt
    the `DEK`, and often the `MK` is assumed to be a `KEK`. However, the `DEK` is
    actually a data element and not a cryptographic key the “master” key is actually
    another `DEK` and not a `KEK`. This difference is important when addressing key
    management controls as cryptographic modules are designed to protect keys and
    not disclose cryptographic material outside its cryptographic boundary. The key
    management lifecycle is discussed in [Chapter 7](#part0012.html#ch07). The faux
    key method is proprietary and is not defined in any industry standard or specification.


    ## PKCS Token Method


    [Figure 3.9](#part0008.html#fig3_9) shows another key delivery method called PKCS
    token. The token is created by encrypting a `DEK` using a `DK` which is generated
    using a password-based key derivation function (`PBKDF`). The underlying function
    is `HMAC` using a hash algorithm (e.g., `SHA-1` or `SHA-2`) as discussed in [Chapter
    2](#part0007.html#ch02). The `HMAC` is repeated some number of times based on
    an iteration count. The initial `HMAC` inputs a password and a `salt`. The `salt`
    is a non-secret value used to deter rainbow table attacks by increasing the workload
    and making the `DK` relatively unique. Each subsequent `HMAC` inputs the result
    from the previous `HMAC` and reuses the password per the iteration count. The
    iteration count is based on the processing capacity and relative risks. Larger
    iteration counts increase workload to decrease risk, while smaller iteration counts
    increase risk. `PBKDF` is defined in `PKCS#5` [[33](#part0016.html#ref_33)] which
    recommends a minimum of 1,000 iterations, whereas the NIST Special Publication
    800-132 [[39](#part0016.html#ref_39)] recommends for critical keys or powerful
    systems upwards of 10 million iterations.


    [Figure 3.10](#part0008.html#fig3_10) shows key delivery for the PKCS token method.
    The key manager uses the password and `salt` to generate the `DK` which is used
    to encrypt a randomly generated `DEK` to create the PKCS token. The password,
    `salt`, and PKCS token are sent from the key manager to the database which are
    stored to disk. The database uses the password (and `salt`) to unlock the PKCS
    token which allows the recovered `DEK` to be installed in memory for subsequent
    data encryption and decryption. However, storing all three components (password,
    `salt`, and PKCS token) locally is basically equivalent to storing a cleartext
    `DEK` since all information needed to access the `DEK` is available. Alternatively,
    the key manager might provide only the PKCS token or password on-demand such that
    the database need not store both locally. Another option is to have a database
    administrator manually enter the password during database start-up. The PKCS token
    is defined in `PKCS#12` [[38](#part0016.html#ref_38)].

