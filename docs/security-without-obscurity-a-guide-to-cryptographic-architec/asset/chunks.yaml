    ### 9.1 Hypothetical Mobile Transaction


    [Figure 9.1] shows an example architecture for handling mobile transactions. Reading
    the diagram from left to right, a mobile store (`mStore`) provisions a mobile
    device. The mobile device connects to the web server and sends a message. The
    web server connects to the app server and forwards the message for processing.
    The app server connects to the database (`DB`) server to fetch the device profile.
    The `DB` server connects to the key management (`KM`) server for DB encryption
    keys.


    Each entity within the example mobile architecture uses cryptographic keys for
    a variety of purposes including Transport Layer Security (`TLS`), Secure Shell
    (`SSH`), database encryption (`DBE`), and mobile security. The following cryptographic
    keys are deployed within the mobile environment.


    ![](images/00002.jpeg)The `mStore` generates a unique asymmetric key pair per
    mobile device. The public key is encapsulated in an `X.509` digital certificate
    issued by an external (commercial) certification authority (`CA[1]). The private
    key and the complete certificate chain is installed onto the mobile device for
    `TLS` connections.


    ![](images/00002.jpeg)The mobile device, in addition to its `TLS` private key
    and certificate chain, might use one or more unique symmetric keys for a variety
    of reasons. For example, a symmetric might be used to encrypt the asymmetric private
    key, authentication data (e.g., password), or other sensitive data (e.g., account
    number). White-box cryptography might be used to obfuscate the symmetric key;
    various key bits are scattered throughout the mobile device using a pseudo-random
    pattern known only to the mobile device. The mobile application might be further
    obfuscated by rearranging executable code such that each mobile device has a relatively
    unique software version, making reverse engineering difficult.


    ![](images/00107.jpeg)


    Figure 9.1 Example mobile transaction.


    ![](images/00002.jpeg)The web server has its own `TLS` private key and certificate
    chain, the certificates issued by a different external (commercial) `CA[2]). In
    addition to the `TLS` static keys, the web server might also employ ephemeral
    keys. The `TLS` handshake negotiates the session unique symmetric encryption and
    Hash Message Authentication Code (`HMAC`) keys with the mobile device. A successful
    `TLS` handshake requires that the web server recognizes the `CA[1]` certificate
    chain and the mobile device recognizes the `CA[2]` certificate chain. The web
    server also has asymmetric `SSH` keys for key agreement to negotiate session symmetric
    encryption keys and for digital signature authentication with administrators.


    ![](images/00002.jpeg)The app server has its own `TLS` private key and certificate
    chain, the certificates issued by an internal (private) `CA[3]). In addition to
    the `TLS` static keys, the web server might also employ ephemeral keys. The `TLS`
    handshake negotiates the session unique symmetric encryption and `HMAC` keys with
    the web server. A successful `TLS` handshake requires that the app server recognizes
    the `CA[2]` certificate chain and the web server recognizes the `CA[3]` certificate
    chain. The app server also has asymmetric `SSH` keys for key agreement to negotiate
    session symmetric encryption keys and for digital signature authentication with
    administrators.


    ![](images/00002.jpeg)The `DB` server has its own `TLS` private key and certificate
    chain, the certificates issued by an internal (private) `CA[4]` same as the `KM`
    server. In addition to the `TLS` static keys, the `DB` server also has `DBE` keys
    managed by the `KM` server. The `DB` server also has asymmetric `SSH` keys for
    key agreement to negotiate session symmetric encryption keys and for digital signature
    authentication with administrators.


    ![](images/00002.jpeg)The `KM` server has its own `TLS` private key and certificate
    chain, the certificates issued by an internal (private) `CA[4]). In addition to
    the `TLS` static keys, the `KM` server might also employ ephemeral keys. The `TLS`
    handshake negotiates the session unique symmetric encryption and `HMAC` keys with
    the `DB` server. A successful `TLS` handshake requires that the `DB` server recognizes
    the `CA[4]` certificate chain and the `KM` server recognizes the `CA[4]` certificate
    chain. The `KM` server also has asymmetric `SSH` keys for key agreement to negotiate
    session symmetric encryption keys and for digital signature authentication with
    administrators.


    Some keys are managed by external parties. For example, the `mStore` is an external
    party to the organization, as is essentially the mobile device. The cryptographic
    keys generated by the `mStore` and installed into mobile devices are basically
    beyond the control of the organization without any legal or other contractual
    obligations. Further, the certificates used by the mobile device are issued by
    `CA[1]` which is another external party. Also, the certificates used by the web
    app are issued by `CA[2]` another external party. The web app uses commercially
    issued certificates recognizable by the mobile device; a mobile device would not
    necessarily be able to trust certificates from a private CA (e.g., `CA[3]` or
    `CA[4]`).


    Different groups within the same organization might managed dissimilar keys. For
    example, the two internal certificate authorities (e.g., `CA[3]` and `CA[4]`)
    might be managed by an enterprise public key infrastructure (`PKI`) group. Alternatively,
    the two certificate authorities might be managed by different groups; the internal
    `CA[3]` might be managed by the enterprise `PKI` group, whereas `CA[4]` might
    be specific to the `KM` servers operated by another group. The `SSH` administrator
    keys might be managed by another group altogether, such as system administrators.
    The `DBE` keys might be managed by DB administrators. Thus, multiple groups might
    be managing various keys throughout the organization, but hopefully compliant
    to enterprise policy and standards.


    ### 9.2 EMV Payment Cards


    EMV® is an abbreviation for three card payment brands: EuroPay, MasterCard, and
    Visa (EMV) covering various payment technologies. Mastercard integrated with Europay
    in 2002 to become a private share corporation, but the name EMV and the company
    EMVCo continues its operations. EMV® technologies cover a variety of payment-related
    methods including integrated circuit chip (`ICC`) contact and contactless specifications,
    its mobile specifications, token payment specifications, quick response two-dimensional
    specifications, and its three-domain (3-D) secure specification.


    The EMV smartcard (`ICC`) payment card is an alternative to the legacy magnetic
    stripe (`magstripe`) payment cards. EMV payment “chip and PIN” card specifications
    were available as early as 1994, but worldwide adoption was slow for several reasons.
    First, there was no smartcard infrastructure; point-of-sale (`POS`) terminals
    and automated teller machines (`ATMs`) only had `magstripe` readers. Second, the
    costs associated with replacing legacy `POS`, `ATM`, and `magstripe` cards was
    another hurdle that had to be overcome. Consequently, hybrid cards with both legacy
    `magstripe` and `ICC` have been issued. [Figure 9.2] demonstrates the security
    and cryptography for a hybrid payment card ecosystem consisting of the issuer,
    cardholder, merchant, acquirer, and network.


    The issuer, typically a financial institution, sends a payment card to the cardholder.
    The cardholder uses the card with PIN at a merchant location. For online authorization,
    the merchant sends an authorization request message to the acquirer, the merchant’s
    financial institution. The acquirer forwards the request to the payment network.
    The network routes the request to the issuer. The issuer checks the cardholder
    profile, and returns an authorization response message to the network, acquirer,
    and merchant. Online PIN verification undergoes the following steps.

