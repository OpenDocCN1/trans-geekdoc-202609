    关于供应商信息的一个重要问题是准确性。通常，应用团队通过供应商名称来指代产品，而不是服务或产品名称。此外，服务和产品名称可能会因营销而改变，但团队可能仍在使用旧名称。此外，合并与收购可能会改变公司名称、结束某些产品线并启动新的产品线。这些任何一个因素都会产生困惑，安全专业人员需要进行破译。


    ![](img/00002.jpeg) `用户指南`对于如何安装、配置、注册和使用服务或产品提供了详尽的说明，但截图传达的技术细节较少。评估人员通常需要“读言外之意”来获取具体信息。例如，可能会从图形化的下拉菜单中发现完整的加密算法列表。


    ![](img/00002.jpeg) `技术规范`可以提供评估人员所需的细节，但此类文档往往是无法获取的。由于各种原因，供应商可能不会记录此类信息。服务或产品的更新频率足够快，以至于细节无法完全记录。某些供应商倾向于不记录技术细节，而是将此类知识通过口头传授。其他供应商可能由于依赖承包商、使用加密库或员工流失而丢失知识。另一些供应商则无论任何协议，都拒绝共享技术规范。


    ![](img/00002.jpeg) 供应商编写的`白皮书`可能会提供一些技术细节。并非所有供应商都会发布白皮书。更多的是关于讨论供应商服务或产品优势的营销论文。营销论文很少提供任何重大的技术信息。此外，它们倾向于误用术语或对主张进行泛化处理，因此有时跳过营销论文是明智的。


    关于供应商文档，作为道口信收集的信息是不证实的，因此是不可靠的。从本质上说，如果没有记录，它就不存在。此外，如果信息不是来自权威来源，即使是文档也是可疑的。供应商访谈有助于证实实供应商提供的文档，但来自独立来源的供应商相关文档更为佳。例如，如第
    7 章所讨论的，许多产品根据美国国家标准与技术研究所（NIST）加密算法验证计划（CAVP）和加密模块验证计划（CMVP）进行评估。相应的安全策略列出了联邦信息处理标准（FIPS）和非
    FIPS 算法及密钥长度，并已通过 NIST 认证实验室的验证，这代表了独立且权威的评估。虽然全球有多种评估计划，但它们都基于各种行业标准。行业标准的重要性至关重要。行业文档可能包括标准、规范、指南、研究论文、文章或新闻稿。


    ![](img/00002.jpeg) `行业标准`涵盖了广泛的主，包括加密算法、密钥管理方案、第 4 章和第 5 章中讨论的安全协议，并指导安全管理策略和实践。传统的标准语言使用“应
    (shall)”或“必须 (must)”陈述定义要求，使用“应该 (should)”句定义建议，使用“可以 (may)”观察定义选项。标准组织在第 1 章中进行了描述。


    ![](img/00002.jpeg) `行业规范`涉及广泛的安全协议。标准关注“是什么”和“为什么”，而规范则相应关注事情“如何”实现，特别是为了互操作性。然而，规范经常使用类似的“应
    (shall)”和“应该 (should)”语言。供应商和服务产品可能通过开发通常基于加密库的软件来实现行业规范，或整合现有的加密工具。然而，如第 7 章所讨论的，实现与规范之间往往存在差距。


    ![](img/00002.jpeg) `行业指南`为实施标准和规范提供了建议和信息。指南有许多其他名称，包括技术报告、补充说明、建议等。虽然指南的地位不如标准或规范，但它们可以提供有关近期漏洞或配置建议的相关信息。指导可以源自任何来源，例如标准组织、监管机构、大学以及供应商。


    ![](img/00002.jpeg) `行业研究论文`可以提供关于算法、协议、加密库或产品的常见漏洞与披露**)（CVE）细节。研究论文还可以提供关于公告的观点。有些研究论文是公开的，分发范围有限，但通常会发布需要修复的已知漏洞。遗憾的是，零日攻击非常棘手。


    ![](img/00002.jpeg) `行业文章`提供了关于数据泄露、威胁、黑客攻击和新发布的 CVE 的新闻。文章还可以提供关于产品安全、可靠性的意见。某些文章提供了其他文章、行业研究论文或网站的链接。


    ![](img/00002.jpeg) `行业新闻稿`提供了关于合并、收购、剥离、破产和其他公告的新闻。新闻稿有助于澄清供应商名称、产品名称、产品发布甚至缩写。


    企业、供应商和行业文档可以建立评估的基础知识库。没有记录的信息从本质上说是不可靠的。召开启动会议来讨论文档和其他问题是有帮助的。评估人员在访谈或测试之前需要时间审阅文档。遗憾的是，文档往往无法获取，或者在访谈期间才提供。


    ### 8.2 访谈](#part0003.html#Rsec8_2)


    访谈是证实文档的关键评估机制。请参考图 8.1](#part0013.html#fig8_1)了解访谈输入的概述。访谈包括企业内部和与供应商之间的对话。企业访谈涉及业务经理、应用经理、数据库经理、管理员、工程师、开发人员以及可能的承包商。供应商访谈可能涉及客户代表、产品经理或工程师。


    某些评估可能具有对抗性。例如，外部评估人员可能由另一个法律机构指定，以进行必要但不受欢迎的评估。另一个例子是外部或内部评估人员可能由内部权威小组（如高层或内部审计）指定。相反，更具合作性的评估是项目团队请求安全专业人员进行评估。


