    ![](images/00002.jpeg)Alice’s key ring: contains her private and public keys,
    Bob’s PK, and Chuck’s PK.


    ![](images/00002.jpeg)Bob’s key ring: contains his private and public keys, Alice’s
    PK, and Chuck’s PK.


    ![](images/00002.jpeg)Chuck’s key ring: contains his private and public keys,
    Alice’s PK, and Bob’s PK.


    ![](images/00064.jpeg)


    Figure 5.6   OpenPGP cryptographic architecture.


    The first message (left) is composed of four packets: two Tag 1 packets, a Tag
    9 packet, and a Tag 19 packet. The two Tag 1 packets are public-key encrypted
    session key packets. These packets contain an encrypted SK using the recipient’s
    PK. The single Tag 9 packet is a symmetric-key encrypted session key packet. This
    packet contains data encrypted using a symmetric SK. The final Tag 19 packet is
    a modification detection code packet which contains a hash of the data.


    ![](images/00002.jpeg)Bob can decrypt only one of the Tag 1 packets using his
    private key yielding the SK which is used to decrypt the Tag 9 packet which yields
    the data. Bob uses the Tag 19 packet is used to verify the integrity of the decrypted
    data.


