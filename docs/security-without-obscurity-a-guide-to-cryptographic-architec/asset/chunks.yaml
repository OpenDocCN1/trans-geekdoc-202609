    域名系统（DNS）是一组分布式数据库，包含了各种各种类型的资源记录（RRs），用于管理互联网域名名。基本上，DNS 将诸如 [www.example.com](http://www.example.com)
    这样的域名翻译为网协议（IP）地址（`198.51.100.0`）。DNS 还提供反向查询；即将 IP 地址翻译为对应的域名名。最右侧的名称（例如 `.com`）被称为顶级域名（TLD）名称。其他顶级域名还包括用于商业实体的
    `.com`、主要用于非营利组织的 `.org`、用于高等教育机构的 `.edu`、用于美国政府机构的 `.gov`、用于美国军方的 `.mil`，以及基于
    ISO 3166-1 的两位国家代码 [48]\]，例如代表澳大利亚的 `.au`、日本的 `.jp`、俄罗斯联邦的 `.ru` 以及美国的 `.us`。ISO
    还提供了一个在线浏览平台^(\*)。


    ![](img/00046.jpeg)


    图 4.1 DNS 示例。


    二级域名（例如 [www.example.com](http://www.example.com)）通过点号与顶级域名分隔，无限数量的低层级（例如三级、四级）同样通过点号分隔。前缀
    `www` 表示万维网服务器，而 `ftp` 是文件传输协议服务器，`mail` 用于邮件服务器。互联网名称与数字分配机构（IANA）^† 管理顶级域名和许多其他唯一标识符。图
    4.1 给出了两个简单的 DNS 示例：一次成功查询和一次失败。对于第一个示例，服务器 `Bob` 使用名称 [www.example.com](http://www.example.com)
    连接到服务器 `Alice`。`Bob` 将该名称提交给 DNS 服务器，该服务器可能会与其它 DNS 服务通信，然后将翻译后的 IPv4 地址 `198.51.100.0`
    返回给 `Bob`，允许其连接到 `Alice`。对于第二个示例，`Bob` 获取名称 [bob.net](http://bob.net) 时报错，因此由于没有
    IP 地址，连接失败。


    然而，如果任何 DNS 资源记录是伪造的，`Alice` 可能会连接到错误的服务器（而不是 `Bob`），但无法察觉这种不诚实的连接。存在三种基本的 DNS
    协议攻击 [50]。DNS 缓存投毒是将错误的记录信息注入到 DNS 服务器中。DNS 欺骗是非法服务器拦截有效的 DNS 请求并返回无效的 DNS 响应。DNS
    ID 破解是非法服务器伪装成合法的 DNS 服务器并提供不准确的资源记录。域名系统安全扩展（DNSSEC）是一种旨在缓解此类 DNS 攻击的认证方案。


    图 4.2 提供了 DNSSEC 密码学的概述。DNSSEC 使用公钥加密对资源记录进行签名和认证，但并不使用公钥基础设施（PKI）或数字证书。数字签名请参见
    第 2 章，数字证书和 PKI 考虑请参见 第 3 章。相反，公钥存储在 `DNSKEY` 资源记录中，相应的私钥由权威 DNS 签名者存储。数字签名存储在
    `RRSIG` 资源记录中。`DNSKEY` 资源记录的摘要（哈希）存储在 `DS` 资源记录中。此外，DNSSEC 不提供机密性。


    ![](img/00047.jpeg)


    图 4.2 DNSSEC 密码学。


    域名密钥（`DNSKEY`）资源记录包含所有者名称、算法标识符和公钥值。公钥采用 Base64 编码。RFC 4034 [49]\] 要求使用带有安全哈希算法（`SHA-1`）哈希的里斯特-沙米尔-阿德曼（`RSA`）数字签名，并包含带有
    `SHA-1` 的数字签名算法（`DSA`），但不再推荐消息摘要 5（`MD5`）哈希。

