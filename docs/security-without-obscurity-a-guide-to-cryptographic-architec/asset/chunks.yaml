- fmt: '

    Certificate validation is a complex process that includes verification of multiple
    `X.509` data fields for multiple certificates. The first step is to determine
    the complete certificate chain from the end user certificate to the root CA certificate,
    such that if any certificate is missing the validation fails, and processing stops.
    Otherwise, for each certificate, check the following items.


    1. Verify the certificate name

    2. Verify the certificate validity period

    3. Verify the algorithm and key usage

    4. Verify the certificate signature

    5. Verify the certificate status

    6. Verify the critical extensions


    If any item fails for any of the certificates, the validation fails and processing
    stops. Otherwise, if all of the items for all of the certificates verify, then
    and only then the subject public key can be used per the key usage declarations.
    However, above and beyond certificate validation, the relying application might
    have additional restrictions. For example, specific end user certificates or CA
    certificates might be required based on a white list. As another example, a specific
    `X.509` extension might be required for processing. If any of the required certificate
    information is missing or invalid, the application might likewise stop processing.
    Verification details are discussed as follows.


    ### 1. Verify the certificate name.


    - The subject certificate name matches the subject name.

    - The issuer CA certificate name matches the issuer CA name.

    - The intermediate CA certificate name matches the intermediate CA name.

    - The root CA certificate matches the root (trust anchor) CA name.


    If the names do not match the validation fails. For example, browsers are known
    for name mismatch errors when the uniform resource locator does not match the
    server common name, but many browsers allow the user to accept an invalid certificate
    anyway. For example, a user might enter [www.one.example.com](http://www.one.example.com),
    but the certificate subject name might differ such as [www.example.com](http://www.example.com)
    or some other name.


    However, certificates have two identity fields: the basic `Subject` field and
    the `SAN` extension. The `SAN` might contain other identities such as [www.one.example.com](http://www.one.example.com)
    and [www.two.example.com](http://www.two.example.com) so any match verifies the
    name. However, a single name mismatch for any of the certificates in the chain
    fails the certificate validation.


    ### 2. Verify the certificate validity period.


    If the current date and time is not between the certificate `not-before` and `not-after`
    dates and times, the certificate is invalid. The validity dates for each certificate
    must be legitimate otherwise the chain fails the certificate validation. Expired
    certificates should not be used as the validity periods are risk based correlating
    the public key with the private key’s cryptoperiod.


    ### 3. Verify the key usage.


    If the certificate presented is not compatible with the intended cryptography
    functions, the public key should not be misused. For example, key management keys
    should not be used for digital signatures, `DEKs` should not be used for key management,
    and digital signature keys should not be used for data encryption or key management.


    Key usage is defined in two extensions: `key usage` and `extended key usage`.
    The former extension indicates the cryptographic functions such as digital signature,
    key transport or key agreement, or data encryption. The latter extension identifies
    the application purpose such as server authentication, client authentication,
    or code signing. The first extension is a fully defined bit map so there is no
    room left for other indicators. The second extension uses object identifiers (`OIDs`)
    so it is infinitely extensible.


    ### 4. Verify the certificate signature.


    Each certificate’s signature is verified using the public key in the next certificate
    within the certificate chain. The subject certificate is verified using the issuer
    CA certificate, the issuer CA certificate is verified using the next level CA
    certificate such as an intermediate CA certificate, and the final intermediate
    CA certificate is verified using the root CA certificate. The root CA certificate
    is self-signed and used to verify itself; however, it is preinstalled in a trust
    store.


    Any certificate signature that fails to verify invalids the certificate chain
    so the subject certificate cannot be used. Failure might occur from constructing
    the chain incorrectly or possibly one of the certificates has been altered. Regardless,
    an invalid chain is a void subject certificate.


    ### 5. Verify the certificate status.


    The subject certificate should contain access information to a status service.
    The `CRL Distribution Points` extension refers to a `CRL`. Alternatively, the
    `Authority Information Access` extension might provide location to an `OCSP` responder.
    However, the `CRL` download might fail or the `OCSP` might not respond, or the
    `CRL` or `OCSP` signatures might not verify.


    If the certificate status cannot be verified then either its validity must be
    assumed with an appropriate risk or the subject certificate must be rejected.
    Depending on the business risks and application environment the relative risks
    need to be evaluated. For example, if the subject certificate status cannot be
    verified at one point it might be verified at a later time. But if the verification
    is for a real-time transaction then its status is critical.


    ### 6. Verify the critical extensions.


    `X.509` extensions are tagged using `OIDs` and marked as either critical or non-critical.
    If any extension is marked critical but the verification process does not recognize
    the `OID` then the certificate validation fails and the subject certificate is
    invalid. Extensions marked non-critical can be ignored if unrecognized but otherwise
    should be processed.


    In addition to certificate validation, the Digital Signature Guideline (`DSG`)
    [[14](#part0016.html#ref_14)] and the PKI Assurance Guideline (`PAG`) [[15](#part0016.html#ref_15)]
    acknowledge that operational and legal controls need to be in place for genuine
    non-repudiation services. Operational controls consist of each PKI participant
    (subject, `RA`, `CA`, relying party) performing according to an agreed-upon set
    of rules to establish trust.

