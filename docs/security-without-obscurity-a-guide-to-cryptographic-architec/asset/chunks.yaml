    chain and the KM server recognizes the CA[4] certificate chain. The KM server
    also has asymmetric SSH keys for key agreement to negotiate session symmetric
    encryption keys and for digital signature authentication with administrators.


    Some keys are managed by external parties. For example, the mStore is an external
    party to the organization, as is essentially the mobile device. The cryptographic
    keys generated by the mStore and installed into mobile devices are basically beyond
    the control of the organization without any legal or other contractual obligations.
    Further, the certificates used by the mobile device are issued by CA[1] which
    is another external party. Also, the certificates used by the web app are issued
    by CA[2] another external party. The web app uses commercially issued certificates
    recognizable by the mobile device; a mobile device would not necessarily be able
    to trust certificates from a private CA (e.g., CA[3] or CA[4]).


    Different groups within the same organization might managed dissimilar keys. For
    example, the two internal certificate authorities (e.g., CA[3] and CA[4]) might
    be managed by an enterprise public key infrastructure (PKI) group. Alternatively,
    the two certificate authorities might be managed by different groups; the internal
    CA[3] might be managed by the enterprise PKI group, whereas CA[4] might be specific
    to the KM servers operated by another group. The SSH administrator keys might
    be managed by another group altogether, such as system administrators. The DBE
    keys might be managed by DB administrators. Thus, multiple groups might be managing
    various keys throughout the organization, but hopefully compliant to enterprise
    policy and standards.


    ### [9.2 EMV Payment Cards](#part0003.html#Rsec9_2)


    EMV® is an abbreviation for three card payment brands: EuroPay, MasterCard, and
    Visa (EMV) covering various payment technologies. Mastercard integrated with Europay[^(\*)](#part0014.html#fn9_1)
    International in 2002 to become a private share corporation, but the name EMV
    and the company EMVCo[^†](#part0014.html#fn9_2) continues its operations. EMV®
    technologies cover a variety of payment-related methods including integrated circuit
    chip (ICC) contact and contactless specifications, its mobile specifications,
    token payment specifications, quick response two-dimensional specifications, and
    its three-domain (3-D) secure specification.


    The EMV smartcard (ICC) payment card is an alternative to the legacy magnetic
    stripe (magstripe) payment cards. EMV payment “chip and PIN” card specifications
    were available as early as 1994, but worldwide adoption was slow for several reasons.
    First, there was no smartcard infrastructure; point-of-sale (POS) terminals and
    automated teller machines (ATMs) only had magstripe readers. Second, the costs
    associated with replacing legacy POS, ATM, and magstripe cards was another hurdle
    that had to be overcome. Consequently, hybrid cards with both legacy magstripe
    and ICC have been issued. [Figure 9.2](#part0014.html#fig9_2) demonstrates the
    security and cryptography \[[98](#part0016.html#ref_98)\] for a hybrid payment
    card ecosystem consisting of the issuer, cardholder, merchant, acquirer, and network.


    The issuer, typically a financial institution, sends a payment card to the cardholder.
    The cardholder uses the card with PIN at a merchant location. For online authorization,
    the merchant sends an authorization request message to the acquirer, the merchant’s
    financial institution. The acquirer forwards the request to the payment network.
    The network routes the request to the issuer. The issuer checks the cardholder
    profile, and returns an authorization response message to the network, acquirer,
    and merchant. Online PIN verification undergoes the following steps.'
