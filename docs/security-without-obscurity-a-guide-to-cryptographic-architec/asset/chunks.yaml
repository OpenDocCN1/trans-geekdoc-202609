    ### Base64 Quick Reference


    The following table (#part0015.html#fnbm_2) provides `Base64` encoding alphanumeric
    uppercase and lowercase displayable characters, and values in decimal, 6-bit binary,
    and hexadecimal notations. In addition to the 6-bit binary mapping to the `Base64`
    character there are encoding rules. The encoding results need to be a multiple
    of three bytes such that the last 24-bits appear as one of the following:


    ![](images/00002.jpeg) Three `ASCII` characters encoded as 8-bit values (despite
    the fact that `ASCII` only uses the rightmost 7-bits)


    ![](images/00002.jpeg) Two `ASCII` characters encoded as 8-bit values with 8 binary
    zeros


    ![](images/00002.jpeg) One `ASCII` character encoded as an 8-bit value with 16
    binary zeros


    For two `ASCII` characters the eight binary zeros are encoded as one displayable
    `=` equal character. For one `ASCII` character the 16 binary zeroes are encoded
    as two displayable `=`` equal characters. Note that the `=` character is not included
    in the table.


    `Base64` encoders and decoders can be found online (#part0015.html#fnbm_3) to
    translate characters.


    ![](images/00137.jpeg)

