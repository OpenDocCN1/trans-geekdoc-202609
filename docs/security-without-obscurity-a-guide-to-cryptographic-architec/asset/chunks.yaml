  trans: '

    在图 6.8 的应用架构中添加密码学信息对于理解加密架构是有意义且有帮助的。识别了实体（谁），通过协议（`HTTP`、`TLS`）暗示了密钥类型（什么）和目的（为什么），标明了位置（哪里），并提供了协议（何时）。但并不是所有的连接都包含在内，而且在改进后的应用架构图中没有捕获加密细节（如何）。然而，应用团队可能并不一定了解网络或加密细节，因此需要安全专业人员进行进一步审查。网络架构的更多示例请参见图
    6.9 和图 6.10。


    ![](img/00076.jpeg)

    图 6.9 带有加密的应用架构。


    ![](img/00077.jpeg)

    图 6.10 用于应用 VLAN 的网络架构。


    图 6.9 显示了带有密码学信息的应用 VLAN 网络架构。DMZ 中的应用 VLAN 限制了对 Web 和 BP 服务器的访问，网络中的另一个应用 VLAN
    限制了对 App 和 DB 服务器的访问。正如对 DMZ 应用 VLAN 所讨论的：


    ![](img/00002.jpeg)

    Web 服务器拥有 `TLS` 密钥、一个私有对称密钥和一个公钥证书，用于到 浏览器的外部 `HTTPS` 连接。


    ![](img/00002.jpeg)

    App 服务器拥有 `TLS` 密钥、一个私有对称密钥和一个公钥证书，用于到 Web 服务器和 BP 服务器的内部 `TLS` 连接。


    正如对网络应用 VLAN 的观察：


    ![](img/00002.jpeg)

    App 服务器拥有 `TLS` 密钥、一个私有对称密钥和一个公钥证书，用于到 Web 服务器和 BP 服务器的内部 `TLS` 连接。


    ![](img/00002.jpeg)

    Web 服务器和 BP 服务器对于其外部和内部的 `TLS` 连接重用相同的证书。


    同样，在网络图中修改以密码学信息有助于理解加密架构。识别了网络设备（谁），通过协议（`HTTP`、`TLS`）暗示了密钥类型（什么）和目的（为什么），标明了位置（哪里），并提供了协议（何时）。然而，图
    6.9 没有记录所有的连接；为了更完整的视角，需要考虑图 6.10。


    图 6.10 显示了带有密码学信息的管理 VLAN 网络架构。DMZ 中的管理 VLAN 限制了对 RAS 的访问，网络中单独的 VLAN 限制了对 SS
    和 AS 的访问。从网络角度来看，


    ![](img/00002.jpeg)

    DMZ 外部的互联网路由器拥有 `IPsec` 密钥、一个私有对称密钥和一个公钥证书，用于跨连接东部和西部数据中心。


    ![](img/00002.jpeg)

    DMZ 内部的 RAS 拥有 `TLS` 密钥、一个私有对称密钥和一个公钥证书，用于 VPN 访问。


    ![](img/00002.jpeg)

    网络内部的路由器拥有 `IPsec` 密钥、一个私有对称密钥和一个公钥证书，用于同步 DB 服务器。


    ![](img/00002.jpeg)

    网络内部的 AS 拥有 `TLS` 密钥、一个私有对称密钥和一个公钥证书，用于连接到 DMZ 内部的 RAS。


    ![](img/00002.jpeg)

    网络内部的 AS 拥有 `SSH` 密钥、一个私有对称密钥和一个公钥证书，用于连接到 DMZ 内部的 RAS。


    通过密码学信息修改网络图同样有助于理解加密架构。识别了网络设备（谁），通过协议（`HTTP`、`TLS`）暗示了密钥类型（什么）和目的（为什么），标明了位置（哪里），并提供了协议（何时）。图
    6.9 和图 6.10 并未涵盖所有的连接。另一种视角是在图 6.12 中添加密码学信息。


    ![](img/00002.jpeg)

    Web 服务器拥有 `TLS` 密钥、一个私有对称密钥和一个公钥证书，用于到 浏览器的外部 `HTTPS` 连接。


    ![](img/00002.jpeg)

    App 服务器拥有 `TLS` 密钥、一个私有对称密钥和一个公钥证书，用于到 Web 服务器和 BP 服务器的内部 `TLS` 连接。


    ![](img/00002.jpeg)

    Web 服务器和 BP 服务器对于其外部和内部的 `TLS` 连接重用相同的证书。


    （此处省略重复性翻译逻辑...）


    ![](img/00002.jpeg)

    RAS 拥有 `TLS` 密钥、一个私有对称密钥和一个公钥证书，用于 VPN 访问。


    ![](img/00078.jpeg)

    图 6.11 管理 VLAN 网络架构。


    ![](img/00002.jpeg)

    AS 拥有 `TLS` 密钥、一个私有对称密钥和一个公钥证书，用于连接 DMZ 内部的 RAS。


    ![](img/00079.jpeg)

    图 6.12 带有加密信息的数据图。


    ![](img/00080.jpeg)

    图 6.13 加密架构。

