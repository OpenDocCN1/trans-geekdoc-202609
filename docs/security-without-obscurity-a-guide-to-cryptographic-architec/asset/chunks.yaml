    not included. Hence, a specialized diagram should be considered for documenting
    a cryptographic architecture such as the example provided in [Figure 6.13](#part0011.html#fig6_13).
    The locations and connections shown are based on the application and network diagrams
    but consolidated to reflect cryptography information.


    For [Figure 6.13](#part0011.html#fig6_13), each of the cryptography instances
