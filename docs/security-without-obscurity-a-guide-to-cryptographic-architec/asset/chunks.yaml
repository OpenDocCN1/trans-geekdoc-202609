    # [Chapter 6](#part0011.html#ch06): Architectures` compares the commonalities
    and differences between various architectures and introduces the cryptographic
    architecture. The foundational information provided in the previous chapters is
    assimilated into the cryptographic architecture. The information needed for documenting
    a cryptographic architecture is explored along with its characteristics and attributes.


    # [Chapter 7](#part0012.html#ch07): Risk Management` discusses data lifecycle
    and cryptographic key lifecycle considerations along with the differences between
    using cryptographic hardware modules versus cryptographic software modules. The
    relative risks are examined and analyzed.


    # [Chapter 8](#part0013.html#ch08): Security Assessments` provides guidelines
    on how to conduct a security assessment in order to determine the cryptographic
    architecture. Information might come from internal, external, or publicly available
    sources. Interviews might be internal, external, or adversarial situations. This
    chapter also explores analysis and reporting.


    # [Chapter 9](#part0014.html#ch09): Illustrations` pulls together all the previous
    chapters by considering several hypothetical scenarios. These are theoretical
    case studies intended to demonstrate the information presented in the previous
    chapters.


    ## [1.2 Book Applicability](#part0003.html#Rsec1_2)


    This book is applicable to system architects, managers, administrators, security
    professionals, auditors, and even lawyers. These roles range from support staff
    to senior management including chief information officers, chief technology officers,
    and chief information security officers. Each can benefit from this book in a
    variety of ways involving general education and awareness of cryptography and
    key management issues.


    **System Architects** are responsible for general research, keeping up with technology,
    making strategic decisions, and assisting others (technology managers, auditors,
    and security professionals) with making good tactical decisions that improve systems,
    and operations.


    **Technology Managers** are responsible for making tactical decisions and supervising
    personnel including administrators and security professionals. The more management
    understands the underlying technologies supported by their teams, the better they
    can manage their staff and make superior decisions.


    **Administrators** are responsible for installing, configuring, running, monitoring,
    and eventually decommissioning network, system, and application components inclusive
    of hardware devices, firmware modules, and software elements. Basic knowledge
    of cryptographic architectures is necessary for administrators to properly manage
    cryptographic features, functionality, and associated cryptographic keys.


    **Security Professionals** are responsible for supporting operational teams, assisting
    development teams, and managing information security policy, standards, practices,
    and procedures. But security professionals are often expected to have general
    knowledge of many areas with expertise typically in only a few areas, so reference
    material is always a valuable commodity.


    **Auditors** are responsible for verifying compliance to information and security
    policy, standards, practices, and procedures. Risk can be better identified and
    managed when the evaluator has a solid understanding of general cryptography and
    related key management. Further, compliance includes not just the organization’s
    internal security requirements but also external influences such as regulations,
    international and national laws, and contractual responsibilities.


    **Corporate Lawyers** are responsible for legal practices and interpretations
    within an organization. Consequently, having a basic understanding of cryptography
    enhances their ability to provide counsel on technology claims, operational risks,
    and even privacy issues.


    Clearly, others can benefit from this book. Cryptographic architectures provide
    a means to document what, where, when, why, and how keys are deployed and managed
    within the context of an application and network deployment. Otherwise, these
    types of details are typically overlooked or undocumented, and the information,
    if known, is often lost. The means and methods for determining a cryptographic
    architecture are explored throughout this book.


    ## [1.3 Network Cartoons](#part0003.html#Rsec1_3)


    When presented with an application solution, the business managers or development
    team will typically provide a high-level design document; see [Figure 1.1](#part0006.html#fig1_1).
    Looking at the figure from left to right, customers access the website server
    over the Internet, the website server gets services from the application server,
    and the application server gets data from the database (DB) server.


    Viewing the same figure from right to left, administrators log on to the admin
    server (AS) to manage the various servers including the software server (SS),
    and the SS pushes updates to the other various servers. Updates might include
    system software, application software, and configuration data. An information
    security professional will have many questions regarding data flows, data storage,
    protection methods, authentication, authorization, and logs. The basic problem
    is that such a high-level diagram is basically a “cartoon” that conveys very little
    significant security information.


    When pressed for additional information security details, the application managers
    or developers might provide another high-level design document; see [Figure 1.2](#part0006.html#fig1_2).
    Following the figure from left to right, customers access the web server which
    resides within demilitarized zone (DMZ), the web server connects to App server
    (AS) which resides on the internal network, and the AS gets data from the DB server.
    What is new to this diagram is that the web server sits within a DMZ presumably
    behind at least one external firewall, and communicates to the AS sitting on the
    internal network, again presumably separated by one or more internal firewalls.
    Firewall rules are a new element.


    ![](images/00003.jpeg)


    Figure 1.1   Application architecture.


    ![](images/00004.jpeg)


    Figure 1.2   Access architecture.


    Tracing the figure from right to left, administrators log on to the AS to manage
    the various servers including the SS, and the SS pushes updates to the other various
    servers. What is new to this diagram is that administrators have network access
    to the AS and remote access via the remote access server (RAS). Also, the AS and
    SS which sit on the internal network both communicate to the web server which
    resides in the DMZ across the internal firewalls. The information provided by
    the Access Architecture is helpful, but more information is needed especially
    with regard to the actual network topology. Thus, the Access Architecture is another
    “cartoon” without providing sufficient security information. The updated diagram
    raises more questions than answers.


    When pushed for additional information security details, the network team might
    provide another high-level diagram to include some network information; see [Figure
    1.3](#part0006.html#fig1_3). Looking at the figure from left to right, customers
    access the web server and administrators connect to the RAS. Both servers are
    located in the DMZ which is bracketed between the Internet and the internal network
    by a pair of firewalls. An external router (`R`) enables access to the DMZ, another
    router within the DMZ enables access to the internal network, and a third router
    manages the internal network.

