    Inconsistent or conflictual answers can occur for a variety of reasons. The interviewee
    might inadvertently have misinformation. Alternatively, the interviewee might
    intentionally provide disinformation. Another possibility is that the actual processes
    do not comply with the documented policy, practices, or procedures. It is not
    uncommon to discover any of the following: obviously, the fourth scenario is the
    best situation.


    1. Processes are inconsistent and undocumented.

    2. Processes are consistent but undocumented.

    3. Processes are consistent and documented but not always followed.

    4. Processes are consistent, documented, and followed.


    When documentation is not previously available, questions can be queued up and
    submitted to interviewees ahead of time to allow preparing answers. However, without
    reliable information on which to base questions, such inquires tend to be generic
    in nature. Again, any answers provided by a vendor might need to be protected,
    which is often done under an `NDA`. Documentation can be requested during these
    types of interviews.


    Even when documents are previously available, the interview will likely uncover
    some other documentation not provided. Thus, as indicated by the dotted line in
    [Figure 8.1](#part0013.html#fig8_1), the assessor should expect to ask for additional
    documents. Naturally, additional documents may lead to additional interviews.
    The documentation versus interview cycle is sometimes considered to be a never-ending
    cycle; however, eventually the assessor will reach a point of diminishing returns
    where no substantive information is uncovered. There are two basic results: either
    no further information is available and things look good, or things look so bad
    that no further interviews (or documentation) will make things better.


    During the interview, notes are taken. The notes should be typed up and shared,
    and if more than one person is taking notes, they should be consolidated. Any
    differences need to be reconciled with the interviewee. However, follow-up interviews
    are not always needed, simple or easy questions might be handled by email, phone,
    text, or other method. But, all answers need to be documented. The notes are updated,
    accordingly with a version number or date to indicate changes. Differences exposed
    between the documentation and interviewee should be addressed during the interview.
    If the issue cannot be resolved during the interview, then it should be added
    to an issue list for reconciliation.


    An issues list is maintained and updated across all the interviews. As each issue
    is resolved, the list is updated and cross-referenced to the notes. Some issues
    might be determined irrelevant and can be resolved, while others might be overtaken
    by events (OBE). For example, an OBE might be a bug with older software version
    that has since been fixed. An irrelevant issue might be an erroneous process that
    has no security affect. The issues list and notes might be managed in the same
    or separate document.


    The notes include date and time, the meeting venue such as conference call or
    location of the face-to-face meeting, a list of attendees, interviewers, interviewees,
    questions, answers, issues, and list of relevant documentation. Resolutions are
    cross-referenced to the issues list. The notes and issues list might be managed
    in the same or separate document.


    During the interview, an interviewer leads the discussion. Too many participants
    attempting to interact with the interviewee is chaos. Interviews might be conducted
    by a small team of interviewers, but one person must take the lead. A single interviewee
    is preferable, but often small teams are assembled to cover topics. Similarly,
    one person must take the interviewee lead, directing questions to the appropriate
    person. Further, interviews often have observers, but again one person must be
    the lead interviewer. Regardless, too many participants increase distractions,
    whether it be background noise, side conversations, or interruptions. Participation
    should be kept to a minimum to reduce complications.


    ### [8.3 Testing](#part0003.html#Rsec8_3)


    Testing can be an important assessment technique to validate normal processing
    or security controls when normal processing does not trigger an incident. For
    a normal processing example, consider when a password needs to be reset due to
    a forgetful user. Testing can be accomplished by a user accessing the password
    reset page and following the directions. A temporary password sent to the user
    via email is used for logon to the system. Each normal test case also needs to
    be well defined. The configuration parameters need to be established, the expected
    result needs to be documented, the actual results need to be recorded, and evidence
    needs to be captured. For example, test case #12 is testing password reset ([Table
    8.1](#part0013.html#tab8_1)).


    For an incident example, consider when a user enters the correct password and
    the system allows access. Alternatively, procedures addressing the number of logon
    attempts and temporary password time-outs do not occur during normal processing.
    Testing can be arranged for each exception: exceed the number of logon attempts,
    and attempt using a temporary password after it has expired. Each test will have
    an expected result that can be verified; screenshots or security logs might be
    captured. When an unexpected test result is observed, it is possible the test
    configuration is invalid, the test is invalid, the control is in error, or sometimes
    the control itself is invalid.


    Table 8.1 Test Case: Password Reset


    | Test Case #12 Password Reset |

    | --- |

    | 1. Access the password reset page and click on password reset linkaa. Enter
    user name (Sam Test) and email address ([sam.test@example.com](mailto:sam.test@example.com))b.
    Verify system log and timestamp |

    | 2. Open email message with temporary passworda. Verify email message timestamp
    |

    | 3. Logon with user name (Sam Test) and temporary passworda. Verify system access
    and timestamp |


    ![](images/00002.jpeg)If the test configuration is invalid, the configuration
    needs to be revised, and the test needs to be repeated.


    ![](images/00002.jpeg)If the test is invalid, the control needs to be reviewed,
    the test configuration needs to be revised, and the test needs to be repeated.


    ![](images/00002.jpeg)If the control is in error, either the control needs to
    be remediated or the documentation needs to be revised.


    Upon occasion, the control itself might be invalid. The application or system
    might not be able to detect the incident or be unable to protect against its occurring.
    For example, a policy might state that employees never write down passwords. However,
    there is no technical control to enforce such a policy. No hardware or software
    control can feasibly ascertain whether an employee has written a password on a
    piece of paper. The policy might be valid and procedural controls might enforce
    the policy, such as a statement in an employee handbook and mandatory training,
    but no technical control can be tested.


    Each incident test case also needs to be well defined. Likewise the configuration
    parameters need to be established, the expected result needs to be documented,
    the actual results need to be recorded, and evidence needs to be captured. For
    example, test case #13 is testing the number of logon attempts, and test case
    #14 is testing temporary password time-outs ([Tables 8.2](#part0013.html#tab8_2)
    and [8.3](#part0013.html#tab8_3)).

