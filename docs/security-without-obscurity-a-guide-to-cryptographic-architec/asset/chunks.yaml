    for a network diagram of the ongoing scenario used throughout this book, organized
    into zones: the external Internet, the DMZ, and the internal network.


    [Figure 6.6](#part0011.html#fig6_6) shows the usual servers in the DMZ: the web
    servers, the BP servers, and the remote access servers (RASs). The diagram also
    shows the other servers in the network zone: the App servers, the DB servers,
    the software server (SS), and the admin servers (ASs). In addition to the servers,
    the network diagram shows routers (R) located in the Internet zone, the DMZ, and
    the network zone. FWs separate the DMZ from the Internet and the network zone.
    All network traffic flow through the FWs where FW rules control which ports and
    protocols are permitted.


    ![](images/00073.jpeg)


    Figure 6.6   Network diagram.


    Not shown or addressed are multiple FWs, web application firewalls (WAFs), application
    firewalls (AFs), or virtualization. Multiple FWs are commonly used to thwart hackers
    from using zero-day attacks, auto-script attacks, or lagging security configurations.
    For example, the FW shown between the Internet and the DMZ might be two different
    systems where the chance of the same vulnerability occurring on both FWs is very
    low. Auto-scripts designed to attack one system have a lesser chance of success
    against a different system. Further, a delayed patch on one system should have
    minimal effect on the other system.


    WAFs and AFs interrogate network traffic beyond port and protocol FW rules. WAF
    or AF might run on traditional FWs, dedicated servers (not shown) or on the functional
    servers (e.g., Web, BP, or RAS). While WAFs and AFs are valid IS controls, they
    typically do not incorporate cryptography; thus they are not discussed further
    in this book.


    Virtualization refers to hardware servers running hypervisors to enable resource
    sharing among multiple application instances running on the same hardware. Some
    virtualized servers can share resources among themselves across hardware platforms.
    Virtualization technology does not implement or rely on cryptography, rather applications
    running in virtual environments might employ cryptography; thus virtualization
    is not discussed further in this book.


    [Figure 6.6](#part0011.html#fig6_6) also shows the various communication channels
    and virtual local area network (VLAN) connections. Inbound traffic from the Internet
    is directed by the external router to the external FW residing within the DMZ.
    The external FW filters messages and the DMZ router directs requests to either
    the web servers or the BP servers over the application VLAN, often called an “application
    rail” to collectively refer to other similar VLAN. Once the request is recognized
    by either server, the DMZ router redirects requests to the internal FW. The internal
    FW also filters messages and the network router sends requests to the App server
    over the “application rail” for processing. Further, the App server interfaces
    to the DB server over the same application rail via the network router.


    Responses are returned by the network and DMZ routers over the network application
    rail from the App server to either the original Web or BP server through the internal
    FW. Once handled by the Web or BP servers the response is returned to the Internet
    via the DMZ and external routers over the DMZ application rail through the external
    FW. However, the network diagram does not address security controls for the application
    rail.'
