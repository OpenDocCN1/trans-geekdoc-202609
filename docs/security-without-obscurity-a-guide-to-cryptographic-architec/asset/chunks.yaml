  trans: '

    从加密架构的角度来看，基于标准的加密方法优于专有解决方案。然而，不同的算法和其他加密需求在全球范围内各不相同，某些国家会强制要求某些算法。此外，优选经过独立权威机构（例如
    `NIST`）评估的加密模块。具有 `NIST` 认证的模块对加密算法进行了评估（至少是经过 `NIST` 批准的算法），并提供了安全配置文件。安全配置文件识别了所有的加密算法、密钥长度、哈希长度和安全协议；它是准确可靠加密信息的价值来源。下一层“密钥管理”讨论了密钥生命周期。


    ## 7.4 密钥管理


    加密密钥（包括对称密钥、非对称密钥对和相关的加密材料）在整个生命周期内都需要安全地管理。密钥生命周期阶段在不同标准和组织之间存在差异，对于本书，提供了图 7.8
    中的 `ANSI X9.79` [85] 密钥生命周期。共认有六个阶段：(1) 密钥生成，(2) 密钥分，(3) 密钥使用，(4) 密钥撤销，(5) 密钥终止，和
    (6) 密钥存档。如果没有适当的控制，密钥在任何生命周期阶段都面临泄露的风险。


    ![](img/00098.jpeg)


    图 7.8 密钥管理生命周期。


    ![](img/00002.jpeg)对称密钥可能泄露，导致加密数据被破解或数据被修改或替换。


    ![](img/00002.jpeg)非对称私钥可能泄露，导致加密的加密材料被破解或创建伪造数字签名。


    ![](img/00002.jpeg)非对称公钥可能被替换，导致各种中间人攻击 (MITM)。数字签名可能被类似的替换，或者加密的密钥材料被破解。


    文中讨论了每个密钥管理生命周期阶段的相对风险。虽然某些风险比其他风险更具理论性，但也审查了实际现实世界的攻击。对于某些案例研究，提供了风险场景，但名称保持匿名。


    **密钥生成**发生在创建密钥时。对称密钥使用随机数生成器 (`RNGs`) [86] 和 [89] 或伪随机数生成器 (`PRNGs`) [88] 生成。`RNG`
    需要一个良好的熵源 [87] 以确保随机性是真实的。否则，如果熵源受到影响，对称密钥或其某些位可能是可预测的。攻击者可以利用这种预测性减少穷举攻击的可能密钥空间，例如常见漏洞披露
    (`CVE-2017-15361`) 中定义的 Coppersmith 攻击。同样，`PRNG` 依赖于 `RNG` 的随机输入。或者，`PRNG` 可能使用相同的密钥材料在一次或不同位置建立相同的密钥。


    非对称密钥成对生成，即私钥和公钥，不仅依赖随机数，还依赖素数生成器 (`PNGs`) [90]。随机数可以使用概率测试进行素性测试，或者素数可以构造出来。然而，素数也需要随机生成。如果
    `PNG` 是可预测的，攻击者就可以利用该缺陷攻击非对称密钥生成方案。


    非对称公钥应封装在数字证书 [45] 中。正如附录 X.509 证书快速参考所述，自签名在没有额外安全控制的情况下不可靠。创建并提交证书签名请求 [91]
    给注册机构 (`RA`) 是密钥生成阶段的一部分。`RA` 验证并授权提交者，`CA` 生成并签名，`RA` 将其返回给请求实体。如果 `RA` 验证提交者失败可能会颁发伪造证书。


    表 7.2 加密强度


    ![images](img/009.jpeg)


    更糟糕，如果 `RA` 没有按照适当的安全控制运行，就会颁发伪造证书，例如 DigiNotor](#part0012.html#fn7_6) 或 Comodo](#part0012.html#fn7_7)。发了伪造的代码签名证书，使得攻击者伪装成合法软件供应商并分发恶意软件。


    **密钥分发**当密钥从生成点传输到使用点时（如果它们不同）是必要的。当密钥在同一设备或位置生成并使用时，可能不需要分发。因此，密钥分发是一个条件阶段。然而，密钥分发包括对称、非对称私钥和非对称公钥的移动。当使用合法证书（例如
    `CA` 签名证书）分发公钥时，完整性和真实性更高。然而，对称和非对称私钥需要机密性。


    对称和非对称私钥的机密性通常使用先建立的 `KEK` 完成。`KEK` 可能是非对称公钥。`KEK` 需要具有与密钥交换或更高的加密强度，否则弱的 `KEK`
    可能会破解密钥。参见表 7.2 的加密强度。该表是 `NIST` 算法和等效长度的摘要 [92]。`NIST` 计算了使用各种攻击进行破解的工作因子，但不是用时间来表示（因为时间随计算机的数量和大小而异），强度用密钥搜索的位数来表示。


    例如，`3DES-2K` 使用两个 56 位密钥的三重 DES 算法（使用第一个密钥加密，使用第二个密钥解密，然后使用第一个密钥加密）具有 112 位密钥，但仅有
    80 位强度。然而，具有 128 位密钥的 `AES-128` 具有 128 位强度。相反，具有 2048 位密钥的 `RSA-2048` 由于已知的缺陷和攻击，只有
    112 位强度。因此，`RSA-2048` 足够加密 `3DES-2K`，因为它们都有 112 位强度，但不足以加密 `AES-128`。因此，应使用 `RSA-3072`
    来加密 `AES-128` 密钥。该表仅包含 `NIST` 批准的对称、非对称和哈希算法，因为其他算法尚未公开评估。


    对于这个案例研究，支付处理器的 `HSM` 遇到硬件故障，导致加密密钥丢失。故障转移没有按预期发生，因为备份 `HSM` 在几个月前也同样故障了，但运营团队忘记更换单元。存储在离线保险箱中的备份密钥没有帮助，因为硬件芯片是空的。密钥的丢失导致支付处理的中断。因此，所有银行的密钥都必须在周末发送给支付处理器，而忙更换密钥组件遇到了许多问题。密钥和密钥组件以明文值传真，密钥组件由个人交付或接收，密钥组件散落在六个人可以接触的会议室桌上。密钥泄露的可能性非常大。

    '
- fmt: '

    ## Key Usage


    `Key Usage` occurs after keys are generated and possibly distributed. As discussed
    in this chapter on Cryptographic Modules, keys might be stored and used in software
    or hardware. Thus, the protection afforded cryptographic keys varies depending
    on the cryptographic module security level and the combined application and operational
    environments. Application and operational controls were discussed in this chapter
    on Facility Security and System Security. See [Figure 7.9](#part0012.html#fig7_9)
    for a graphical interpretation of business security objectives versus security
    controls. The x-axis represents the four cryptographic module security levels,
    and the y-axis represents additional security controls provided by the application
    and operational environments. Theoretically, line of business (LOB) can achieve
    their security objective using a combination of a cryptographic module with additional
    application and operational controls.


    ![](images/00100.jpeg)


    Figure 7.9 Information security levels.


    For this example, five different LOB have approached their security objectives
    in dissimilar ways. Two businesses have opted for a high (5) security environment,
    but one has chosen a level 1 cryptographic module, while the other has chosen
    a level 4 cryptographic module. The former LOB needs to implement strong environmental
    security controls to compensate for the level 1 module, whereas the latter LOB
    can rely on the level 4 module with lesser environmental security controls. Conversely,
    another LOB has likewise chosen a level 1 cryptographic module but with much lower
    (2) security environment. The other two businesses have chosen medium security
    environments but with different cryptographic modules: medium (3) with a level
    2 module and medium (4) with a level 3 module. Each LOB needs to use its cryptographic
    keys according to the security policy relative to its cryptographic module and
    the compensating security controls offered by the various environments.


    Another important key usage control is that keys are used for their intended purpose,
    also called key separation. Key separation goes beyond the cryptographic functions
    discussed in [Chapter 2](#part0007.html#ch02): encryption, MAC and HMAC, and digital
    signatures. Rather key usage needs to also address the data types being protected,
    the application environment, and the business logic being supported. This is best
    illustrated by examples.


    ![](images/00002.jpeg)Compliant with X9.8 \[[73](#part0016.html#ref_73)], the
    cardholder PIN is encrypted at the point of entry and remains encrypted during
    transport to the issuer for verification. While PIN encryption keys (PEKs) might
    be established using a variety of key management methods as discussed in [Chapter
    3](#part0008.html#ch03), a PEK and only a PEK should only be used to protect a
    PIN. Cryptographic modules are designed to perform PIN translations such that
    an encrypted PIN is decrypted using one PEK and re-encrypted using another PEK
    so that the PIN can be sent from one network domain to another without ever being
    cleartext. However, data encryption keys (DEKs) are intended to encrypt and decrypt
    other types of data such that cleartext data goes into a cryptographic module
    and ciphertext comes out, or ciphertext goes in and cleartext goes out. Thus,
    `DEK` cannot be used in lieu of `PEK` because the cleartext PIN would be compromised.


    ![](images/00002.jpeg)Compliant with X9.31 \[[10](#part0016.html#ref_10)], an
    RSA key pair should not be used for both data encryption and digital signatures.
    RSA signatures are generated by encrypting a hash using the private key, and verification
    requires decrypting the hash using the corresponding public key to recover the
    hash. However, a cryptographic module can be spoofed by submitting ciphertext
    as a signature; the module will dutifully decrypt the “signature” but instead
    of returning a decrypted hash, the decrypted ciphertext is revealed. When a relying
    party encrypts cryptographic material such as a shared secret as is done for TLS,
    the shared secret is revealed, or when a PIN is encrypted, the PIN is revealed.
    Notably, most TLS certificates have both the key encipherment bit for server support
    and the digital signature bit for client support under the assumption that the
    TLS software is the sole user.


    ![](images/00002.jpeg)Another example is reusing an RSA key pair originally generated
    for TLS with password encryption. As noted, most TLS certificates have both the
    key encipherment bit for server support and the digital signature bit for client
    support. But TLS certificates typically do not have the data encipherment bit
    set. Using TLS key pair for passwords violates the certificate key usage bits.
    Allowing the password process to reuse the TLS keys enables the TLS process to
    decrypt the password, and the password process to decrypt the TLS shared secret.
    Thus, both the password and TLS session keys are compromised.


    There are so many risks related to reusing keys, it is far easier and better to
    simply generate separate keys for each specific purpose. Attempting to analyze
    the various risks and information disclosures for each key reuse case is problematic
    and time consuming. Subscribing to key separation as a security control is a valid
    policy and valuable key management practice.


    Another important aspect of key usage is key backup and recovery. There are many
    legitimate scenarios when a cryptographic key is inadvertently lost. Cryptographic
    modules might suffer a power outage, a catastrophic failure, datacenters might
    flood, facilities can catch fire, or whole areas might suffer an earthquake. Regardless,
    copies of keys can be reloaded into recovered or replaced cryptographic hardware
    or software modules. However, unsafe recovery processes such as the case study
    described for Key Distribution can significantly increase risk.


    `Key Revocation` is the unexpected termination of a key prior to its expiration.
    All keys need to have an expiration date; keys cannot be used forever. Probably,
    the most well-known revocation mechanism is a Certificate Revocation List (CRL)
    \[[47](#part0016.html#ref_47)], but the Online Certificate Status Protocol (OCSP)
    \[[93](#part0016.html#ref_93)]\] is becoming more popular. The CRL is basically
    a negative list of public key certificates, and by extension the associated private
    keys, that have been revoked for one reason or another by the issuing CA. OCSP
    was originally perceived as a positive file of all valid certificates from the
    issuing CA but has devolved into a negative file, using the CRL as input to maintain
    the OCSP database. The advantage to a relying party is that a specific certificate
    can be submitted to an OCSP responder to get its current status. Otherwise, the
    relying party needs to download the current CRL and check the whole list.


    There are no common industry mechanisms for symmetric key revocation. When a symmetric
    key is revoked, the usual process is to simply change the key. However, it is
    often the case that new data protected by the new key is insufficient; the old
    data protected by the old key needs to be considered. For example, when a database
    encryption key (DBEK) is changed, the data encrypted under the previous `DBEK`
    needs to be translated from old to the new `DBEK`. As another example, if a `DEK`
    is changed then any data encrypted under the old `DEK` might need to be translated
    to the new `DEK` or possibly deleted. Consider a log encryption key (LEK); older
    logs might be deleted but if the logs need to be retained for a longer period,
    they might need to be translated to the new `LEK`. The relative risks of allowing
    data to be kept encrypted under old keys need to be assessed as revoked keys might
    still be compromised or determined exhaustively. Copies of older data encrypted
    using older keys should be migrated to newer keys or deleted altogether.

    '
