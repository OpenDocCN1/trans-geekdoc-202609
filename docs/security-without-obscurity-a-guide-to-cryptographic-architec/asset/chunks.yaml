    # 国际电工委员会 (IEC) [#part0006.html#fn1_9]

    `IEC` 根据 83 个参与成员国和 2000 多名行业专家的共识，制定电气、电子及相关技术（统称为“电电技术”）的全球标准。`IEC` 组织由 100
    多个 `TCs` 组成，并通过联合委员会与 `ISO` 和 `国际电信联盟` (`ITU`) 合作。与本书相关的是负责信息技术标准的 `ISO/IEC 联合技术委员会一`
    (`JTC1` )。


    # 国际电信联盟 (ITU) [#part0006.html#fn1_10] 是联合国负责信息和通信技术的专门机构。`ITU` 研究小组 `电信标准化部门`
    (`ITU-T`) 根据其 176 个成员国的共识制定全球标准（称为 `ITU-T 建议书`）。`ITU-T` 由 11 个活跃研究小组组成。与本书相关的是负责安全的
    `ITU-T` 研究小组 `SG17`。


    请注意，`ITU-T` 免费提供了其许多标准 #¶¶。


    `ISO`、`IEC` 和 `ITU-T` 基本上是国际标准化的三大柱。成员身份是国家级的，每个国家都有一个指定的 `NSB`。每个国家的 `NSB` 负责担任技术咨询小组
    (`TAG`)，但这可以委托给经 `NSB` 认证为 `SDO` 的其他小组。


    # 美国国家标准协会 (ANSI) ^\* 是美国的 `NSB`。`ANSI` 本身并不制定标准，而是根据各个行业领域对其他 `SDO` 进行认证，并将它们作为
    `US TAG` 分配给 `ISO`、`IEC` 或 `ITU` 委员会。`ANSI` 目前已认证了 282 个 `SDO`，并分配了 584 个 `TAG`
    到不同的 `ISO` `TCs` 和子委员会。与本书相关的 `SDOs` 涉及：`美国标准与技术研究院` (`NIST`)、`信息技术标准国际委员会` (`INCITS`)、`认证标准委员会
    X9` (`ASC X9`)、`结构化信息标准促进组织` (`OASIS`) 以及 `电气电子工程师学会` (`IEEE`)。


    # 美国标准与技术研究院 (NIST) ^\† 是一个美国政府机构，通过推进测量科学、标准和技术来促进创新和工业竞争力。在 `NIST` 组织内部，“信息技术实验室`
    (`ITL`) 是一个 `ANSI SDO`。然而，`NIST` 也产生自己的 `联邦信息处理标准` (`FIPS`) 出版物特别出版。与本书相关的是多个编号自
    800 系列的 `FIPS` 和特别出版。


    # 信息技术标准国际委员会 (INCITS) ^\‡ 是经 `ANSI` 认证的 `SDO`，也是 `ISO/IEC JTC1` 的 `TAG`，拥有 500
    个参与成员组织。`INCITS` 在 1961 年到 1996 年间名为 `认证标准委员会 X3`，目前有 8 个 `TCs` 并管理与各种 `ISO` 委员会和
    `JTC1` 子委员会的十多个 `TAG` 关系。例如，`INCITS` 是第 307 技术委员会——区块链和分布式账本的 `TAG`。与本书相关的 `TCs`
    包括：B10 识别卡及相关设备、`CS1` 网络安全以及 `M1` 生物识别。


    # 电气电子工程师学会 (IEEE) ^\§ 发音为“Eye-triple-E”，是一个经 `ANSI` 认证的 `SDO` 以及 `ISO/IEC JTC1`
    子委员会的 `TAG`，拥有来自 160 多个国家的 423,000 多名成员。与本书相关的是安全与隐私技术委员会。


    # 认证标准委员会 X9 (ASC X9) ^\¶ 是经 `ANSI` 认证的 `SDO`、`ISO TC68` 的 `TAG` 以及 `TC68` 秘书处，拥有
    112 个参与成员组织。`X9` 有五个活跃子委员会，并管理与 `TC68` 子委员会的若干 `TAG` 关系。与本书相关的是 `X9F` 信息安全子委员会及其三个活跃工作组：`X9F1`
    密码学工具、`X9F4` 密码协议与应用安全以及 `X9F6` 持卡人认证与集成电路芯片 (`ICC`)。


    # 结构化信息标准促进组织 (OASIS) ^\*

    `OASIS` 是经 `ANSI` 认证的 `SDO`。`OASIS` 在 1993 年到 1998 年间名为 `XML`。与本书相关的是 `XML`、`PKCS`
    和安全标记语言 (`SAML`)。


    # 互联网工程任务组 (IETF) ^\†

    `IETF` 是经 `ANSI` 认证的 `SDO`。`IETF` 免费提供其许多标准。^\‡


    # 美国注册会计师协会 (AICPA) ^\§

    `AICPA` 是经 `ANSI` 认证的 `SDO`。`AICPA` 免费提供了其许多标准。


