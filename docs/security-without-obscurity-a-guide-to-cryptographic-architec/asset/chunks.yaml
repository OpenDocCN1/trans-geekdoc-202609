    图 7.5 显示了位于受操作系统控制的计算机系统内存中的内部加密模块。算法在加密模块的内存中执行。数据密钥以加密形式存储在系统存储器中。加密密钥从存储器获取并传输到加密模块，在模块中使用
    `KEK` 进行解密。明文 `KEK` 和明文数据密钥永远离开模块内存。现在，明文数据密钥可以使用算法进行操作。


    图 7.5 还显示了进入和离开算法的数据输入输出。输入数据从系统内存移动到模块内存，以便算法和数据密钥对其处理，输出数据则从模块内存移动到系统内存。例如，输入数据可能是明文，通过算法和密钥进行加密，使得输出数据变为密文。相反，输入数据可能是密文，通过算法和密钥进行解密，使得输出数据变为明文。


    如果加密模块是基于软件的，则模块内存与系统内存相同，这意味着明文 `KEK` 和明文数据密钥容易受到攻击。然而，如果加密模块是基于硬件的，则模块内存与系统内存分离，这意味着
    `KEK` 和数据密钥永远不会暴露在加密模块之外。通常，加密硬件模块的设计旨在保护密钥，并仅允许输入和输出明文数据。


    图 7.6 显示了一个连接到网络的外部加密硬件模块，通常被称为 `HSM` 或安全加密设备 (`SCD`)。与内部模块类似，算法在加密边界内执行。加密数据密钥传输到模块，在模块中使用明文
    `KEK` 进行解密。明文 `KEK` 和明文数据密钥永远离开加密边界。图中显示的数据输入和输出也以类似的方式进行传输，通常通过应用程序系统与加密模块之间的安全网络连接进行。安全网络连接通常使用传输层安全协议
    (`TLS`) 或等效加密协议。`HSM` 通常有自己的公钥基础设施，使得加密模块作为根证书机构 (`CA`)，向自己颁发 `TLS` 服务器证书向应用程序系统颁发
    `TLS` 客户端证书。


    ![](img/00094.jpeg)


    图 7.6 外部加密模块。


    NIST [80]] 将加密模块定义为实现批准的安全功能（包括加密算法和密钥生成）并包含加密边界内的硬件、软件和/或固件集合。NIST 进一步将加密边界定义为明确定义的连续边界，它建立了加密模块的物理边界，并包含了加密模块的所有硬件、软件和/或固件组件。NIST
    标准定义了 11 个安全区域的要求，并分为四种不同的安全级别，总结在 表 7.1 中。


    ### 安全级别 1

    **安全级别 1** 是最低的安全级别，允许在通用计算系统上使用未经评估的操作系统执行加密模块的软件（或固件）组件。然而，其优势之一是包含了经过批准的算法（或安全功能）。批准意味着算法已通过评估，根据相应的标准正确实现，例如对称算法高级加密标准
    (`AES`) [81]]。因此，可以避免由于算法薄弱或软件漏洞导致的漏洞问题。


    ### 安全级别 2

    **安全级别 2** 通过防篡改机制、基于角色的认证 (`RBA`) 和经过评估的操作系统对级别 1 进行增强。硬件防篡改机制包括可见涂层、可观察封条、防钻锁和可拆卸盖。软件完整性机制可能包括用于代码签名的
    `MAC`、`HMAC` 或数字签名。`RBA` 意味着加密模块验证操作员的权限以承担特定角色（例如终端用户、密钥管理器、管理员）并执行相应的服务集。经过评估的操作系统意味着它已使用通用标准
    [82]] 保护配置文件 (`PP`) 在评估保证等级二 (`EAL2`) 下通过评估。


    ### 安全级别 3

    **安全级别 3** 通过增加防篡检测和防改响应机制、基于身份的认证、专用输入/输出端口以及经过评估的 `EAL3`（或更高）操作系统对级别 2 进行增强。对未经授权物理访问的识别会触发密钥清零；一旦检测到，模块将擦除加密密钥。认证验证所识别的操作员有权访问特定角色并执行相应的服务集。专用端口要求明文关键安全参数
    (`CSPs`)（如密钥组件）的导入或导出在物理或逻辑上与其他端口分离。操作系统需要根据通用标准 [82]] `PP` 在 `EAL3` 进行评估。


    表 7.1 NIST 安全要求摘要


    ![images](img/00095.jpeg)


    ![images](img/00096.jpeg)


    ### 安全级别 4

    **安全级别 4** 是最高的安全级别，通过要求更强的防篡改机制、环境传感器和经过评估的 `EAL4`（或更高）对级别 3 进行增强。任何物理渗透的检测都会触发密钥清零。环境传感器验证模块是否在其正常运行范围（例如电压、温度、振动）内使用，以防止攻击。操作系统需要使用通用标准
    [82]] `PP` 在 `EAL4` 进行评估。


    表 7.1 显示了每个安全级别增加的要求，但某些区域适用于多个级别。例如，安全区域 (1) `加密模块规范` 对四个级别都有相同的文档要求。相反，安全区域
    (2) `加密模块端口` 对级别 1 和 2 要求相同，但对级别 3 和 4 分离了 `CSPs` 数据端口。另一个例子是安全区域 (5) `物理安全` 为每个安全级别增加了要求。图
    7.7 提供了表 7.1](#part0012.html#tab7_1) 要求的图形总结。


    NIST 标准还翻译成了国际标准 [83]]，美国国家标准协会 (`ANSI`) [84]] 将 `SCD` 定义为提供物理和逻辑保护的加密和服务存储的设备，例如密码
    (`PIN`) 输入设备或 `HSM`。然而，只有 NIST 为其认可的算法提供了加密模块验证计划^(\*) 和加密算法验证计划^(\*)。国家信息保障伙伴^†
    (`NIAP`) 是 NIST 与国家安全局之间的伙伴，旨在支持通用标准评估与验证方案。通用标准 [82]] 提供了一种定义产品评估安全要求的方法。要求以独立标准组织发布的
    `PP` 或通常由产品制造商提供的安全目标的形式发布。NIAP 维护一份批准的 `PP` 列表^‡；值得注意的是，目前还没有加密模块的 `PP`。


