    on Pretty Good Privacy® (PGP) originally developed by Philip R. Zimmermann[^(\*)](#part0010.html#fn5_2)
    published in 1991. PGP® was a collection of software functions providing encryption,
    digital signatures, and key management. OpenPGP messages are composed of various
    packets identified by tag numbers. [Figure 5.6](#part0010.html#fig5_6) provides
    two examples of messages sent from Alice to Bob and Chuck, one message using asymmetric
