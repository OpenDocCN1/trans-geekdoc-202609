  raw: 'The role of a security professional includes information security consulting.
    Consulting includes determining what security controls are in place, identifying
    control gaps, assisting lines of business (LOB) in assessing risks, and recommending
    solutions. However, determining controls can often be problematic. As discussed
    in [Chapter 1](#part0006.html#ch01), knowledge is often dispersed among various
    teams such as application groups, network group, database group, administrators,
    and various developers. Collecting and consolidating information is an important
    skill for any security professional; as shown in [Figure 8.1](#part0013.html#fig8_1),
    this includes sifting through documentation, conducting interviews, testing, performing
    analysis, and eventually producing reports.


    At the initiation of the assessment, the security professional might have little
    to no information regarding the problems, products, applications, environments,
    or the business. Gathering information can often be difficult. The assessor might
    be external to the enterprise for an independent assessment or an employee for
    an internal evaluation. The size, complexity, and organizational structure of
    the enterprise can impede knowledge sharing. Individuals or groups might withhold
    pertinent information due to internal politics, personal agendas, or denial of
    responsibilities. Product manufacturers and service providers are sometimes reluctant
    to share details or unable due to knowledge loss. Mergers, acquisitions, end of
    product lifecycles, and rebranding can affect information. Donald Rumsfeld was
    quoted \[[96](#part0016.html#ref_96)\] describing the known and the unknown conditions
    in his report to the North Atlantic Treaty Organization in 2002.


    Now what is the message there? The message is that there are no “knowns.” There
    are things we know that we know. There are known unknowns. That is to say there
    are things that we now know we don’t know. But there are also unknown unknowns.
    There are things we don’t know we don’t know. So when we do the best we can and
    we pull all this information together, and we then say well that’s basically what
    we see as the situation, that is really only the known knowns and the known unknowns.
    And each year, we discover a few more of those unknown unknowns.


    **Donald Rumsfeld**


    ![](images/00106.jpeg)


    Figure 8.1   Assessment process.


    Assessments have similar problems. With regard to cryptography, there are known
    knowns, misunderstood knowns (things to be true but are actually false), known
    unknowns, and of course unknown unknowns. There is also information, misinformation
    (false or incorrect information), and even disinformation (false information spread
    deliberately to deceive). Some engagements might be antagonistic in nature, one
    or more of the groups might not want the assessment, while others may welcome
    the evaluation. The assessor must work through all of these hurdles to determine
    when sufficient information has been gathered via documentation, interviews, and
    testing to perform analysis and develop the report.


    ### [8.1 Documentation](#part0003.html#Rsec8_1)


    Documentation is the cornerstone of any assessment. While hallway conversations,
    emails, chat sessions, and phone calls are all acceptable methods to gather information,
    at the end of the day only official documentation is reliable. Basically, if it
    is not documented it does not exist. Official documentation should be on company
    letterhead or equivalent stationary. Enterprise policy, standards, practices,
    and procedures need to be documented. Vendor services, product manuals, user guidelines,
    and technical specifications need to be documented. Refer to [Figure 8.1](#part0013.html#fig8_1)
    for an overview of documentation inputs.


    Prior to exchanging any documents, conducting any interviews, or performing any
    tests, a kickoff meeting should be held to discuss the engagement scope, expectations,
    timeline, LOB, resources, applications, products, and vendors. Resources include
    available and needed documentation, contact information, list of interviewees,
    and relevant environments including production and test systems.


    Ideally, all relevant documentation is provided to the assessor prior to scheduling
    any interviews or scheduling any tests. The assessor needs sufficient time to
    review the documentation in preparation for interviews, otherwise info provided
    by interviewees is uncorroborated. Likewise, the assessor needs adequate time
    to read the documentation as background material for planning test cases with
    expected results. Depending on the volume of documentation, days or weeks might
    be needed to sift through all the material. Enterprise documentation might include
    policy, standards, practices, or procedures.


    ![](images/00002.jpeg)**Enterprise security policies** typically define high-level
    responsibilities (the “who”) and requirements (the “what”). Responsibilities can
    be defined at the senior management level, identifying which organizational groups
    are accountable. Requirements might be broadly outlined and refer to various regulatory,
    legal, and industry organizations.


    ![](images/00002.jpeg)**Enterprise security standards** usually define medium-level
    responsibilities (the “who”) and requirements (the “what”), characteristically
    expanding on the security policy, and sometimes provide high-level “how” specifications.
    Responsibilities might identify which managerial teams are accountable. Requirements
    are more explicit and refer to exact regulations, laws, and industry standards.


    ![](images/00002.jpeg)**Enterprise security practices** typically define low-level
    specifications (the “how”) and justifications (the “why”), often organized by
    the security standards. Practices specify products, tools, resources, and named
    procedures. For example, certificate policy and certificate practice statement
    documents are integral components for operating a certification authority. Justifications
    identify relative risks and related countermeasures provided by the security practices.


    ![](images/00002.jpeg)**Enterprise security procedures** provide detailed instructions
    (the “how”), sometimes locational information (the “where”), and specific roles
    (the “who”). Procedures are step-by-step tasks executed using products and tools
    at designated locations per role assignment (e.g., security officer). Executing
    procedures typically includes capturing sign-in sheets, checklists, and various
    system and application logs.


    An external assessor would likely be unfamiliar with enterprise documentation,
    and thus might need more time to read the material. However, while policy might
    be shared publicly, the more detailed standards, practices and especially procedures
    need to be protected, which is often done under a nondisclosure agreement (NDA).
    Conversely, an internal assessor would be familiar with most of the enterprise
    documentation, and no NDA is needed for employees, but time is still needed to
    review the various documents. Only relevant enterprise documentation needs to
    be read or reviewed, but determining which documents are pertinent can be problematic.
    The kickoff meeting enables discussion for determining enterprise documentation
    and vendor documentation which might include service or product manuals, user
    guidelines, technical specifications, or white papers.


    ![](images/00002.jpeg)**Service Manuals** present a high-level overview of available
    applications offered by the third-party providers. While few technical details
    are included, important information includes service names, acronyms, abbreviations,
    and vendor website.


    ![](images/00002.jpeg)**Product Manuals** provide a high-level overview of available
    applications offered by the software manufacturer. While few technical details
    are included, important information includes product names, acronyms, abbreviations,
    and vendor website.'
