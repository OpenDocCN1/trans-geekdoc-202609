    This section discusses various symmetric-based cryptographic schemes to establish
    symmetric keys, versus the next section which discusses asymmetric-based cryptographic
    schemes to establish symmetric keys. Key establishment schemes include the following:


    ![](images/00002.jpeg)Initial key

    ![](images/00002.jpeg)Fixed key

    ![](images/00002.jpeg)Master/Session key

    ![](images/00002.jpeg)Derived unique key per transaction (DUKPT)


    Key delivery schemes discussed in this section include the following:


    ![](images/00002.jpeg)Faux key

    ![](images/00002.jpeg)PKCS tokens

    ![](images/00002.jpeg)Database encryption key management (DBEKM)


    As discussed in [Chapter 2](#part0007.html#ch02) the same symmetric key is used
    for encryption versus decryption, for message authentication code (MAC) or keyed
    hash message authentication code (HMAC) to generate or verify an integrity check
    value (ICV), or for some tokenization methods. When a sender and receiver is involved,
    the same key must be shared by both entities. However, establishing the initial
    key (IK) is problematic. Without a key encryption key (KEK) to protect other keys,
    the IK needs to be securely exchanged in some manner. Historically, this has been
    accomplished using key components; see [Figure 3.1](#part0008.html#fig3_1). The
    term key component is defined in X9.24-1 standard \[[30](#part0016.html#ref_30)\].


    `Key Component`: one of at least two parameters having the format of a cryptographic
    key that is exclusive-ORed/added modulo-2 with one or more like parameters to
    form a cryptographic key. A component is equal in length to the resulting key
    \[[30](#part0016.html#ref_30)\].


    Note that exclusive OR (same as exclusive-ORed) is also defined in [Chapter 1](#part0006.html#ch01),
    and Annex: XOR Quick Reference provided a complete list of XOR values in hex and
    binary. [Figure 3.1](#part0008.html#fig3_1) shows an example of two entities,
    a sender and a receiver, exchanging key components to establish a symmetric key.
    In this scenario, the sender generates a 128-bit symmetric key and creates two
    128-bit key components, sends both components securely to the receiver, and the
    receiver recombines the components to install the symmetric key. The actual procedures
    will vary depending on the capabilities and expertise of the two participants
    with several viable options.


    ![](images/00029.jpeg)


    Figure 3.1 Symmetric IK.


    ![](images/00002.jpeg)The sender generates two random numbers as key components,
    assigns each component to separate holders, then each component holder hand delivers
    their components to two separate component owners at the receiver. Alternatively,
    the sender holders might separately send the components via letter post to the
    receiver holders.


    ![](images/00002.jpeg)The sender generates a random key, a random number as the
    first key component, and XOR the key with the component to derive the second component.
    The sender then assigns each component to separate holders, who then securely
    transfer each component to separate receiver holders via hand delivery, letter
    post, or possibly secure email.


    Alternatively (not shown in [Figure 3.1](#part0008.html#fig3_1)), the sender generates
    a random number as the first component, and the receiver generates a random number
    as the second component. The sender assigns a component holder who securely transfers
    the first component to a specific receiver holder. Similarly, the receiver assigns
    a holder who securely transfers the second component to another sender holder.
    Both sides then combine their original and the delivered components to reconstitute
    the symmetric key.


    Other key component procedures are possible. However, once the components have
    been exchanged and the symmetric key has been established, the components can
    then be reused for backup and recovery. [Figure 3.2](#part0008.html#fig3_2) shows
    an example of symmetric key recovery. The sender can retain the key components
    in a secure storage facility and maintain the component holders’ responsibilities
    in the event that the key needs recovery due to some technical glitch. Likewise,
    the receiver can retain the key components in a secure storage facility and maintain
    the component holders’ responsibilities in the event that the key needs recovery.
    In this manner, the components do not need to be reexchanged unless a new key
    is being redistributed. X9.24-1 provides requirements and recommendations for
    handling key components \[[30](#part0016.html#ref_30)\].


    Once the symmetric key has been established, there are two basic operating methods:
    either fixed key or master key (MK)/session key (SK). [Figure 3.3](#part0008.html#fig3_3)
    shows an example of the fixed key method using key components to establish an
    initial symmetric key. The IK is used by the sender to encrypt cleartext and used
    by the receiver to decrypt ciphertext. Once the fixed key has reached the end
    of its lifecycle, it is replaced by exchanging new components all over again.
    Thus, once the IK has been established using key components with manual procedures,
    it remains “fixed” until it is replaced using the same manual procedures. X9.24-1
    provides requirements and recommendations for the fixed key method \[[30](#part0016.html#ref_30)\].


    ![](images/00030.jpeg)


    Figure 3.2 Symmetric key recovery.


    ![](images/00031.jpeg)


    Figure 3.3 Symmetric fixed key.


    Some systems might reuse the current fixed key to exchange a new key; however,
    this violates a basic key management principle: keys are generated and used for
    an intended purpose. The fixed key lifecycle is intended to protect data by not
    overusing the encryption key. Repurposing the data encryption key (DEK) as a KEK
    at the end of the key lifecycle increases risk of a key compromise to the new
    key and consequently to the data.


    [Figure 3.4](#part0008.html#fig3_4) shows an example of the MK/SK method using
    key components to establish an initial symmetric key. The IK is used as an MK
    to exchange one or more SKs. The sender encrypts a random SK using the MK and
    sends the ciphertext to the receiver who decrypts the ciphertext to recover the
    SK. Once the SK has been established, the sender encrypts cleartext using the
    SK and the receiver decrypts ciphertext using the SK. X9.24-1 provides requirements
    and recommendations for the MK/SK method \[[30](#part0016.html#ref_30)\].


    When the SK has reached the end of its lifecycle, it is replaced by exchanging
    another SK using the MK. When the MK has reached the end of its lifecycle, it
    is replaced by exchanging new components all over again. An alternative to redoing
    components is to exchange a new MK using the current MK; however, this is only
    valid if the current MK is not compromised. The MK is a KEK used to exchange the
    DEK so reusing it to exchange another KEK preserves its intended purpose and is
    compatible with the basic key management principle: keys are generated and used
    for an intended purpose.


    ![](images/00032.jpeg)


    Figure 3.4 Symmetric MK/SK.


    Unfortunately, both fixed key and MK/SK share a common problem. Industry standards
    \[[30](#part0016.html#ref_30)\] require that any key used by a communicating pair
    be unique (other than by chance). This means that a host processing system communicating
    with hundreds, thousands, or even million terminal devices needs to manage a separate
    key per terminal. Using fixed key or MK/SK methods would necessitate a database
    of keys. Alternatively, the DUKPT (pronounced “duck putt”) allows a host to manage
    many terminals with unique keys using a single base derivation key (BDK). X9.24-1
    provides requirements and recommendations for the DUKPT method \[[30](#part0016.html#ref_30)\].


    DUKPT is a key management scheme between a host system and many terminals although
    it can be used in many other scenarios.


    ![](images/00002.jpeg)[Figure 3.5](#part0008.html#fig3_5) shows how a host uses
    the base derivation key (BDK) to generate and inject an IK into a terminal.

