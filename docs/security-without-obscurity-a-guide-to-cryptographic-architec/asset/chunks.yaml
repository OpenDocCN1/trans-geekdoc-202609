  raw: 'On another note, the ISSA article and this book refer to simple applications
    or network diagrams as cartoons. I personally credit Don Provencher[^(\*)](#part0004.html#fnf_1)
    a former colleague at Bank of America, coining the term “cartoon” when referring
    to simplistic diagrams. Don was extremely knowledgeable about network architectures
    and was able to educate even me. We all miss you, Don.


    In the first book, I mentioned my long-term participation with X9 standards. My
    participation and chairing the X9F4 workgroup endures to this day. The X9F4 program
    of work continues to grow with new standards and technical reports. Meanwhile,
    I continue to have a day job, work on X9 standards, and write this book. All of
    this with the loving support from my wife, Linda, and everyone still likes her
    best.


