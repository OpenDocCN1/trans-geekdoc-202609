    Web 服务器通过实线所示的应用虚拟局域网（`VLAN`）与 `AS` 通信，`AS` 连接到 `DB server`。相反，`RAS` 通过虚线表示的独立管理
    `VLAN` 与 `AS` 通信，`AS` 连接到 `SS` 和服务器。此图的新之处在于 DMZ 和内部网络的网络拓扑结构，它展示了各种路由器、防火墙以及将应用程序与管理分离的两个
    `VLAN`。然而，该图暗示了一个单一的网络实例，所有的路由器、防火墙和服务器都混合在同一物理位置，没有任何冗余、负载均衡或备份能力。因此，该网络架构又是另一个“卡通画”，提供了更多信息，但引发了更多问题。再次，信息安全专业人员需要进一步的澄清。


    ![](img/00005.jpeg)


    图 1.3 网络架构。


    在进一步访谈时，系统架构师透露了实际设计；参见图 1.4。网络架构在两个区域数据中心（西部和东部）复制的。两个外部路由器交叉连接，使得连接到西部外部路由器的连接可能会重定向到东部外部路由器，反然，连接到东部外部路由器的连接可能会重定向到西部外部路由器。这种交叉连接允许数据中心相互备份。无论选择哪个外部路径，外部防火墙会对连接进行检查。


    另一个发现是业务门户（`BP`）服务器的存在，它支持应用程序直接连接。与仅提供用户访问的 Web 服务器相比，`BP` 服务器为高流量提供企业对企业的连接。与
    Web 服务器类似，`BP` 服务器通过应用 `VLAN` 与 `AS` 通信，`AS` 连接到 `DB server`。此外，`SS` 和 `AS` 通过管理
    `VLAN` 访问 `BP` 服务器。正如增强项目中常见的情况，对更新 Web 和 `ASs` 的关注忽略了 `BP` 服务器，因为在本例中，没有计划更改。


    另一个区别是西部区域和东部区域内部网络路由器之间的交叉连接。这种连接允许区域服务器之间进行数据同步：`ASs`、`DB servers`、`SSs` 和 (`ASs`)。内部网络路由器的连接还允许系统、`DB`
    和应用程序管理员管理从一个区域推送到另一个区域的维护更改和修改。


    ![](img/00006.jpeg)


    图 1.4 企业架构。


    本章讨论的示例提供了一个信息安全专业人员参与增强项目时的典型发现过程。信息不完整通常是常态，因为各个项目团队在信息安全问题和解决方案方面的经验有限。然而，维护网络拓扑图的重要性不应被忽视或低估。作为一个行业示例，考虑支付卡行业数据安全标准
    `[24]` 的要求，它提到了当前的（准确的）网络图。


    ![](img/00002.jpeg)1.1.2 现有网络图，识别了持卡人数据环境与其他网络之间的所有连接，包括任何无线网络。


    ![](img/00002.jpeg)1.1.3 显示所有持卡人数据流跨越系统和网络的当前图表。


    此外，作为另一个行业示例，X9-TR-39 PIN 安全与密钥管理 `[28]` 在其合规控制目标中包含了记录的程序（包括网络图）。


    ![](img/00002.jpeg)4.1.1 PIN 和密钥的安全环境


    该安全环境在物理、逻辑和程序上受到访问控制或其他机制的保护，防止任何渗透，渗透会导致存储在环境内的任何或部分加密密钥和/或 PIN 的泄露。存在并遵循记录的程序，确保安全环境在所有密钥材料移除或销毁之前保持安全。


    参考文献 X9.8-1—Section 6.3.3 `[29]`；X9.24-1—Sections 7.3 和 7.5.2 `[30]`；X9.24-2—Section
    7.3 `[31]`。


    因此，行业标准同样重要。然而，技术和安全标准充满了缩写、命名法和术语。因此，读者将获得加密词汇表和行业标准的概述。


    ### 1.4 加密词汇表 (#part0003.html#Rsec1_4)


    在前节中提到，少量的数学是不可避免的，但已降至最低。本节提供了简单的数学复习、常用符号和贯书中使用的惯用加密术语。信息按难度从小到大的顺序排列。


    ![images](img/00007.jpeg)

    ![images](img/00008.jpeg)

    ![images](img/00009.jpeg)

    ![images](img/00010.jpeg)

    ![images](img/00011.jpeg)

    ![images](img/00012.jpeg)

    ![images](img/00013.jpeg)

    ![images](img/00014.jpeg)


    读者现在已经掌握了书中使用的足够的数学符号和加密术语。读者应该熟悉的另一个领域是行业标准和标准组织。


    ### 1.5 行业标准 (#part0003.html#Rsec1_5)


    阅读书籍、技术论文、期刊文章和博客可以是信息性的且具有指导性的，但了解行业标准和规范是一个宝库。加密算法、架构、协议和消息规范都在标准中定义。了解谁开发了标准也很。图
    1.5 显示了相关的标准组织，包括国家标准机构（NSB）和标准开发组织（SDO）。


    **国际标准组织** (\*) (ISO) 基于 163 个成员国的共识开发了全球标准。ISO 由数百个技术委员会（TC）组成，按行业划分，已发布超过 2
    万份国际标准和相关文档。例如，`TC1` 是螺纹，`TC120` 是皮革，`TC215` 是健康信息，`TC307` 是区块链和分布式账本技术。与本书相关的是金融服务的
    `TC68`。


    ![](img/00015.jpeg)


    图 1.5 标准组织。


    ISO [](#part0006.html#fn1_2) 成员是拥有 NSB 的国家；个人或公司不能成为 ISO 成员。ISO 为 100 多个国家提供三种成员类别（正式、特派和订阅），包括：


    ![](img/00002.jpeg)澳大利亚 NSB 是 Standards Australia † (SA)


    ![](img/00002.jpeg)加拿大 NSB 是加拿大标准委员会 ‡ (SCC)


    ![](img/00002.jpeg)法国 NSB 是法国标准协会协会 § (AFNOR)


    ![](img/00002.jpeg)德国 NSB 是德国标准协会 ¶ (DIN)


    ![](img/00002.jpeg)日本 NSB 是日本工业标准委员会 \*\*) (JISC)


    ![](img/00002.jpeg)英国 NSB 是英国标准协会 †† (BSI)


    ![](img/00002.jpeg)美国 NSB 是美国国家标准协会 (ANSI)


