    ## [Encryption Protocols](#part0003.html#rch05)


    This chapter discusses various encryption protocols (procedures to provide data
    confidentiality) versus authentication protocols (procedures to provide data integrity
    and authenticity) discussed in [Chapter 4](#part0009.html#ch04). While this chapter
    does not (and cannot) address every encryption protocol, framework, method, or
    algorithm, it does provide a decent overview that the reader can use as reference
    material and as a foundation for performing security assessments. Some encryption
    protocols include integrity and authentication mechanisms but are primarily used
    for data confidentiality and not authentication.


    ### [5.1 Transport Layer Security (TLS)](#part0003.html#Rsec5_1)


    Transport Layer Security (TLS) is the successor to Secure Socket Layer (SSL);
    both protocols provide secure communication over a computer network. It is a common
    misnomer to say SSL but mean TLS and often the term SSL/TLS is used. Many implementations
    include both protocols, but they are not interoperable; however, earlier versions
    of TLS supported backwards compatible with SSL. Further, SSL has been deprecated
    due to a variety of vulnerabilities.


    ![](images/00002.jpeg)SSL v1.0 was developed by Taher Elgamal[^(\*)](#part0010.html#fn5_1)
    while he worked at the Netscape Corporation but it was never release publically.


    ![](images/00002.jpeg)SSL v2.0 was released in February 1995.'
