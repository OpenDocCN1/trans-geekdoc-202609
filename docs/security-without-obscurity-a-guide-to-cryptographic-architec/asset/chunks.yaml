    The system logs and email need to be captured as evidence. Screenshots might also
    be captured. Once testing is completed, the test account needs to be deactivated.
    Hence, every test case will have pre-execution, execution, and post-execution
    tasks. As the test cases are completed, issues might arise that require follow-up
    interviews or additional documentation, as indicated by the dotted lines in [Figure
    8.1](#part0013.html#fig8_1). However, as discussed earlier follow-up interviews
    are not always needed, simple or easy questions might be handled by email, phone,
    text, or other method. Further, the documentation versus interview cycle, and
    the interview versus test cycle will eventually reach a point of diminishing returns.
    But, all answers need to be documented. Ultimately, the test cases and results
    along with interview notes and documentation are input to the analysis phase.


    ## Table 8.2 Test Case: Logon Attempts


    | *Test Case #13 Exceed Number of Logon Attempts* |

    | --- |

    | 1\. Allocate test account with user name (`Sam Test`) and password (`Test1234`)
    |

    | 2\. Attempt first logon with user name (`Sam Test`) and password (`Test1111`)a.
    Warning message: logon failed, attempt 1 of 3b. Verify system log and timestamp
    |

    | 3\. Attempt second logon with user name (`Sam Test`) and password (`Test2222`)a.
    Warning message: logon failed, attempt 2 of 3b. Verify system log and timestamp
    |

    | 4\. Attempt third logon with user name (`Sam Test`) and password (`Test3333`)a.
    Warning message: logon failed attempt 3 of 3 – click on password reset linkb.
    Verify system log and timestamp |


    ## Table 8.3 Test Case: Temporary Password


    | *Test Case #14 Exceed Temporary Password Time-out* |

    | --- |

    | 1\. Click on password reset linka. Enter user name (`Sam Test`) and email address
    (`[sam.test@example.com](mailto:sam.test@example.com)`)b. Verify system log and
    timestamp |

    | 2\. Open email message with temporary passworda. Verify email message states
    password expires in 15 minutesb. Verify email message timestampc. Wait 15 minutes
    and 5 seconds for temporary password to expire |

    | 3\. Attempt logon with user name (`Sam Test`) and temporary passworda. Warning
    message: logon failed attempt 1 of 1 – click on password reset linkb. Verify system
    log and timestamp |


    ### 8.4 Analysis


    Analysis is an essential process of the assessment as it is the culmination of
    documentation, interview notes, and testing results. [Figure 8.1](#part0013.html#fig8_1)
    shows analysis logically occurring sequentially after documentation, interviews,
    and testing; however, analysis actually begins at or about documentation reviews
    and continues into reporting. Analysis ends when sufficient information has been
    confirmed to determine the cryptographic architecture.


    The process of analysis is actually rather straightforward. Facts are compiled
    and crossed referenced to documentation, interviews, and testing. Each fact might
    have multiple references, and some facts might have several references in common
    ([Table 8.4](#part0013.html#tab8_4)). Consistencies are noted, but inconsistencies
    need to be resolved. For example, if the documentation provides a list of cryptographic
    algorithms, but interviews reveal a different list, and testing cannot corroborate
    the differences, the issues need to be resolved.


    [Table 8.4](#part0013.html#tab8_4) provides an example analysis worksheet with
    four fact statements, scores, and references. The scores are rated from 0 to 10
    with 10 the best and 0 the worst. The references in the worksheet are cross-referenced
    with those in the reference list.


    ![](images/00002.jpeg)Fact #1 identifies that the product “X” has FIPS 140-2 certification
    with a best score of 10, and four references: the product technical specification,
    the NIST certificate, the corresponding FIPS 140-2 security policy, and notes
    from interview #1. The technical specification refers to the FIPS 140-2 certification,
    and the certificate number was provided in the interview. The assessor was able
    to look up the certificate and the corresponding security policy.


    #### Table 8.4 Analysis Worksheet


    | *Facts* | *Scores* | *References* |

    | --- | --- | --- |

    | 1\. Product X has FIPS 140-2 certification | 10 | a. Product technical specification<br>b.
    NIST certificate<br>c. FIPS 140-2 security policy<br>d. Interview #1 |

    | 2\. Product X supports AES | 10 | a. Product technical specification<br>b. NIST
    certificate<br>c. Security policy<br>d. Interview #2 |

    | 3\. Product X supports 2K and 3K | 6 | a. Product technical specification<br>b.
    NIST certificate<br>c. Interview #2 |

    | 4\. Product X supports DES | 2 | a. Security policy<br>b. Interview #2 |


    *(Note: The table content above has been restructured for clarity based on the
    provided text descriptions)*

