    Thus, a rainbow table for no-salt (or pepper) with one iteration would have half-a-quadrillion
    entries. But, modern computers have clocked modern hash algorithms (e.g., `SHA-512`)
    at a million or more per second so the 576 trillion hash calculations using a
    thousand computers could be computed in about two months. Given the availability
    of cloud computing, the attack is feasible and the costs are realistic. Adding
    a random salt to each password replicates the work factor for each password, so
    an end-user database with a thousand passwords would increase the overall work
    from two months to 166 years. Of course increasing the computer power reduces
    the time factor, but the attacker is not interested in cracking all the passwords,
    just an administrator’s password. So if the attacker knows which end-user profile
    is an administrator, the work factor is pragmatically reduced to a single password.


    Password iteration count is the number of times the hash is applied to the password
    (and salt) for storage. Iterations counts merely increase the work factor, but
    can delay password verification, affecting the end-user experience. NIST recommends
    a minimum of one thousand iterations, but for more powerful servers an iteration
    count of 10 million may be appropriate [[39](#part0016.html#ref_39)] when computing
    password-based key derivation functions. Irrespective of the salt and iterations,
    the password verification process needs to obtain the transmitted password as
    cleartext to apply the hashing so that it can be compared to the stored hashed
    password.


    PIN verification for payment cards is very different than password verification.
    The PIN is a 4- to 12-digit number defined in ISO 9564 [[56](#part0016.html#ref_56)]
    and associated to the card’s primary account number (PAN). The PAN is a 12- to
    19-digit number defined in ISO/IEC 7812 [[57](#part0016.html#ref_57)]. Unlike
    passwords, the PIN might be bank issued or customer selected. Bank-issued PIN
    might be derived directly from the PAN or a random number, similar to a customer-selected
    PIN.


    As shown in [Figure 4.12](#part0009.html#fig4_12), the IBM 3624 PIN verification[^(\*)](#part0009.html#fn4_7)
    is based on a PIN offset (oPIN). The oPIN is generated by subtracting the customer-selected
    PIN from an intermediate PIN value (iPIN). The iPIN is generated by encrypting
    validation data (vData) with a PIN verification key (3K-3DES) and then replacing
    the ciphertext characters using a decimalization table. The oPIN is stored in
    the end-user database. The PIN is recovered by adding the oPIN to the iPIN which
    is then compared to the customer-entered PIN. If the customer-entered PIN matches
    the recovered PIN the user is authenticated.


    The IBM oPIN method allows a PIN to be changed without changing the PAN. Other
    PIN verification methods derive the PIN from the PAN using `DES` or triple-DES
    (`3DES`) keys, but changing the PIN requires changing the PAN. From a cryptographic
    architecture viewpoint, password verification schemes typically use a keyless
    hash; however, PIN verification methods use `DES` or `3DES` cryptographic keys.
    Newer PIN verification schemes using `AES` are in development; draft X9.132 [[58](#part0016.html#ref_58)].


    ![](images/00057.jpeg)


    Figure 4.12 IBM 3624 PIN verification.


    ### [4.6 One-Time Password (OTP)](part0003.html#Rsec4_6)


    One-time passwords (OTPs) are short-lived authentication credential which are
    not to be confused with the cryptographic method one-time pad (OTP). Cryptographic
    OTP is a key management method for using a different encryption key for each message.
    Authentication OTP uses passwords with a limited TTL denoted by the clock icon.
    [Figure 4.13](#part0009.html#fig4_13) depicts an OTP architecture showing a client-based
    end user, an application, a verifier, and a provider. The OTP provider might be
    a host-based server sending a TTL password to a client-based end user. The end
    user might employ a workstation, laptop, tablet, or mobile device. Alternatively,
    the OTP provider might be client-based software running on the end-user device
    or a separate hardware token held by the end user.


    ![](images/00058.jpeg)


    Figure 4.13 OTP cryptographic architecture.


    Regardless of the OTP provider origins, the TTL password is delivered to the end
    user in various communications. For handheld hardware tokens, the TTL password
    might be displayed for the end user to enter or speak the value. For mobile devices,
    the TTL password might be transmitted using short message service (SMS) also called
    texting or email. For other devices, the TTL password might be transmitted via
    email. The TTL OTP might also be spoken to the end user when talking to a customer
    service representative. Note that NIST 800-63B [[59](#part0016.html#ref_59)] restricts
    sending secrets using SMS or voice to out-of-band devices via the public switched
    telephone network. However, since the TTL password is only valid for some number
    of minutes, there is some debate whether an OTP is a secret, semisecret, or something
    less.


    The OTP end user offers the TTL password to an OTP-enabled application. The application
    checks the password with the OTP verifier. The verifier checks whether the password
    has expired and is valid. The OTP verifier grants (or denies) the password to
    the application, and if granted, the application enables access to the end user.
    OTPs are typically random values to be unpredictable without using cryptographic
    keys, but a critical component are accurate clocks for the OTP provider and OTP
    verifier to maintain the TTL expiration.


    [^(\*)](#part0009.html#fn4_1a) [www.iso.org/obp/ui/#home](http://www.iso.org/obp/ui/#home)


    [^†](#part0009.html#fn4_2a) [www.icann.org/](http://www.icann.org/)


