    # X.509 Certificate Quick Reference


    This annex provides an overview of X.509 certificates and its extensions.


    ## Certificate


    The main certificate consists of three primary fields: (1) the content to be signed
    (TBS), (2) the digital signature algorithm for the certificate signature generated
    by the certification authority (CA), and (3) the actual digital signature. The
    TBS filed is comprised of many secondary fields including the Extensions. The
    Extensions field is actually a sequence of numerous extensions each of which has
    a unique label called an Object Identifier (OID). An OID is basically an ordered
    list of numbers where each position and value has specific meaning with the characteristic
    that every OID has unique meaning.


    ![images](images/00151.jpeg)


    The certification authority (CA) generates a digital signature of the TBS certificate,
    adds the signature algorithm such as the Rivest–Shamir–Adleman (RSA) algorithm,
    the Digital Signature Algorithm, or the Elliptic Curve Digital Signature Algorithm,
    and appends the digital signature to create the certificate. The certificate signature
    is a cryptographic binding of the TBS certificate fields, including the various
    Extensions fields, and significantly the subject’s name and public key.


    ## Extensions


    X.509 certificate extensions are only present in version 3 certificates. While
    the X.509 standard includes numerous extensions, only the more commonly implemented
    and useful extensions are discussed in this annex.


    ### Authority Key Identifier


    This X.509 extension contains an identification, typically an SHA-1 hash, of the
    CA public key corresponding to the CA private key that signed the certificate.
    Its purpose is to help facilitate certificate chain construction during certificate
    validation particularly when the CA has more than one asymmetric key pair for
    signing certificates. The authority key identifier (AKI) in any certificate is
    the subject key identifier (SKI) of the succeeding CA certificate.


    ### Subject Key Identifier


    This X.509 extension contains an identification, typically an SHA-1 hash, of the
    public key contained within the certificate. Its purpose is to help facilitate
    certificate chain construction during certificate validation. The SKI in a CA
    certificate is the AKI in the preceding certificate.


    ### Key Usage


    This X.509 extension defines the purpose of the public key and consequently its
    corresponding private key. The field has nine bits defined but typically the expressed
    in hexadecimal notation where each “1” bit represents a key usage type. Any combination
    of bits is permitted, but there are common industry practices on how to use various
    permutations. While the key usage field is helpful to determine the type of certificate,
    the extended key usage (EKU) extension is also valuable.


    ![images](images/00152.jpeg)


    For example, a typical CA certificate has the key certificate signature (5) and
    the certificate revocation list (CRL) signature (6) bits sent so the key usage
    value is hex `06 = 0000 0110`. Since the two bits are for signatures, the digital
    signature (0) is not needed or appropriate; however, not all CA follow the same
    nomenclature, so CA certificates will have differences.


    As another example, a certificate for signing emails might have the digital signature
    (0) bit set so the key usage value would be hex `80 = 1000 0000`. Conversely,
    a certificate for signing legal documents might have both the digital signature
    (0) and the non-repudiation (1) bits set so the key usage value is hex `C0 = 1100
    0000`. However, setting the non-repudiation bit does not inherently provide non-repudiation;
    rather additional controls need to be implemented.


    For yet another example, a certificate for key management might have the key encipherment
    (2) or the key agreement (4) bits set depending if the algorithm supports key
    transport such as the Rivest–Shamir–Adleman scheme (RSA) or key agreement such
    as the Diffie–Hellman (DH) or the Elliptic Curve Diffie–Hellman (ECDH) schemes.
    Stereotypically TLS certificate has the digital signature (0) bit for client authentication
    and the key encipherment (2) bit for RSA-based key transport so the key usage
    value is hex `A0 = 1010 0000`.


    ### Extended Key Usage


    This X.509 extension indicates the intended purposes for the public key, in addition
    to or in place of the basic key usage extension. Instead of using a bit-map, the
    EKU field incorporates OIDs as follows.


    ![images](images/00002.jpeg)Server authentication OID = `1.3.6.1.5.5.7.3.1` is
    for TLS with consistent key usage bit digital signature (0) and the key management
    bits either key encipherment (2) or key agreement (4).


    ![images](images/00002.jpeg)Client authentication OID = `1.3.6.1.5.5.7.3.2` is
    for TLS with consistent key usage bit digital signature (0) and the key management
    bits either key encipherment (2) or key agreement (4).


    ![images](images/00002.jpeg)Code signing OID = `1.3.6.1.5.5.7.3.3` is for protecting
    executable code using digital signatures with consistent key usage bit digital
    signature (0).


    The EKU field has several other OID defined in the X.509 standard. The EKU field
    provides additional information about the certificate, the public key, and the
    corresponding private key. However, when the EKU field is used without the basic
    key usage bits, information about the keys is less and the purpose of the keys
    needs to be extrapolated.


    ### Certificate Policies

