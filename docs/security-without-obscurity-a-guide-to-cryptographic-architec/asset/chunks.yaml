    ## [Preface](#part0003.html#rch00_fm05_preface)


    This is the third book in the Security without Obscurity series. The first installment
    was my first book done on my very own. Previously, I had written articles and
    chapters for other peoples’ books but not my own. The second book came about because
    of my collaboration with Clay Epstein and our decision to write a book together,
    and inadvertently created the series. At that time, I had no particular plans
    for a third book. The genesis for this book had several origins.


    First, during my career, many times I have had to ferret out the cryptographic
    details for products, applications, and networks. From a crypto perspective, understanding
    the journalistic questions: who, what, why, where, when, and how is a critical
    aspect of information security. Too often the information is difficult to ascertain;
    misinformation and disinformation are not helpful. For example, vendors or service
    providers might be reluctant to reveal details, developers might have unreliable
    data, or product specifications are obsolete.


    Further, vendors and service providers undergo mergers and acquisitions. Knowledge
    is often lost when employees or contractors depart. Product lines might be decommissioned
    and no longer supported. Products might not be updated and run with aging software.
    Product documentation might be dated or contain mistakes. Marketing sometimes
    makes unsubstantiated claims that are difficult to verify.


    Second, the ability to conduct a security assessment in a reluctant or adversarial
    situation requires a set of skills that can only be learned by experience. However,
    there are dependable processes that can provide consistent results. Over the years,
    things to do and things not to do are included in lessons learned. These same
    processes work just as well for enthusiastic conditions. This book has an entire
    chapter on performing risk assessments.


    Third, I published the article Cryptographic Architectures: Missing in Action
    in the July 2017 *ISSA Journal*. The article was on the journal cover, and it
    was republished in the Best Articles of 2017 in the January 2018 *ISSA Journal*.
    However, there was so much that I could have discussed, but a six-page article
    can only provide a limited amount of information. I provided the article to my
    publisher, and he agreed the topic would make another good book.'
