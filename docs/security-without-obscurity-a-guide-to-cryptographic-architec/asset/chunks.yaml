    ![](images/00037.jpeg)

    Figure 3.9 PKCS token PBKDF.


    ![](images/00038.jpeg)

    Figure 3.10 PKCS token delivery.


    [Figure 3.11](#part0008.html#fig3_11) shows the setup for another key delivery
    method called DBEKM. The key manager generates two keys: an actual `MK` that is
    `KEK` and an HMAC key (`HK`). The `HK` is encrypted using the `MK` and sent to
    the database. The `HK` is then erased so the key manager only retains the `MK`.
    The database stores the benign encrypted `HK` to disk and generates an identifier
    (`ID`) that is relatively unique to the database. The `ID` is likewise benign
    and might refer to a region, datacenter, server, or specific to a database volume,
    file, or column.


    [Figure 3.12](#part0008.html#fig3_12) shows the key delivery for the DBEKM method.
    The database sends the encrypted `HK` and cleartext `ID` to the key manager over
    a secure communication. The key manager decrypts the `HK` using the `MK`, then
    uses the `HK` and `ID` as inputs to `HMAC` to generate a seed value. The seed
    is returned to the database and then the `HK` and seed are erased so the key manager
    only retains the `MK`. The database uses the seed as input into a `KDF` to generate
    a `DEK` in system memory. Note that the key manager does not contain the `KDF`
    and so cannot generate the `DEK`. The key manager does not violate its cryptographic
    boundary and protects keys at all times. Further, the database server only has
    benign data stored on disk and only uses key in system memory.


    ![](images/00039.jpeg)

    Figure 3.11 DBEKM setup.


    ![](images/00040.jpeg)

    Figure 3.12 DBEKM key delivery.


    This section discussed several symmetric-based key establish schemes and key delivery
    schemes, and the next section discusses asymmetric-based cryptographic schemes.


    ### 3.2 Asymmetric Keys](#part0003.html#Rsec3_2)


    This section discusses various asymmetric-based cryptographic schemes to establish
    symmetric keys, versus the previous section which discusses symmetric-based cryptographic
    schemes to establish symmetric keys. Unlike symmetric keys which are basically
    random or pseudorandom strings of binary bits, asymmetric keys are constructed
    using mathematical equations. Further, asymmetric keys are always built in pairs,
    the private key and the public key. Generally speaking, the public is derived
    from the private key, but the private key cannot be derived from the public key.
    Thus, the public can be safely distributed and used by many without risk to anyone
    determining the private key.


    Depending on the asymmetric algorithm, asymmetric keys can be used for data integrity
    and authenticity, data confidentiality, or key management.


    1. For data integrity and authenticity, the private key might be used to generate
    a digital signature, and the corresponding public key can be used to verify the
    digital signature. Asymmetric algorithms used for digital signatures can be reversible
    or irreversible.

    2. For data confidentiality, the public key might be used for data encryption,
    and the corresponding private key can be used for data decryption. However, for
    encryption and decryption to be possible, the asymmetric algorithm must be reversible.

    3. For key management, the public key might be used for key encryption, and the
    corresponding private key can be used for key decryption. When a symmetric key
    is encrypted using the public key at one location and decrypted using the private
    key at another location, this is called asymmetric key transport. However, for
    encryption and decryption to be possible, the asymmetric algorithm must be reversible.

    4. For key management, the public and private keys might be used with another
    set of asymmetric keys to mathematically calculate a shared secret which can then
    be used to derive a shared symmetric key. When two parties exchange public keys
    and use them with their own asymmetric keys to calculate a shared secret, this
    is called asymmetric key agreement; the symmetric is not physically sent between
    the two parties. Asymmetric algorithms used for key establishment can be reversible
    or irreversible.


    Cryptographic methods for data integrity and authentication (A) and data confidentiality
    (B) were discussed in [Chapter 2](#part0007.html#ch02). This section addresses
    key establishment, a general term for key transport (C) and key agreement (D)
    methods. Various asymmetric cryptographic schemes are used to establish symmetric
    keys which in turn are used to protect data. [Figure 3.13](#part0008.html#fig3_13)
    illustrates key transport using the Rivest–Shamir–Adleman (`RSA`) algorithm \[[9](#part0016.html#ref_9)\]
    defined in X9.44 \[[42](#part0016.html#ref_42)\]. The sender (Alice) uses the
    receiver’s public key to encrypt an `SK` which only the receiver (Bob) can decrypt.
    The transport of the encrypted symmetric key from the sender to the receiver establishes
    the `SK` between the two parties. The `RSA` algorithm is reversible so keys can
    be encrypted and decrypted but irreversible algorithms cannot be used for key
    transport.


    ![](images/00041.jpeg)

    Figure 3.13 RSA key transport.


    There are several alternatives for key transport. For example, the sender might
    encrypt a random number and transmit it to the receiver to be used as an `SK`.
    As another example, the sender might encrypt a random number and transmit it to
    the receiver as an ingredient to create a symmetric key. Another example is the
    sender might encrypt a random number and transmit it to the receiver to be used
    as an `MK` which in turn is used to exchange an `SK`. Each of these alternatives
    are valid key transport methods.


    Note that the sender is shown using a public key (digital) certificate versus
    using a “naked” public key. Thus, the sender (Alice) uses the receiver’s (Bob)
    digital certificate which contains Bob’s public key. Digital certificates were
    introduced in [Chapter 2](#part0007.html#ch02) when addressing non-repudiation
    and are discussed in more details in the latter sections of this chapter. See
    also the Annex: X.509 Certificate Quick Reference for certificate formats.


    [Figure 3.14](#part0008.html#fig3_14) demonstrates key agreement using the Diffie–Hellman
    (`DH`) algorithm \[[40](#part0016.html#ref_40)\] as defined in X9.42 \[[41](#part0016.html#ref_41)\].
    For key agreement to work mathematically the first step is for both parties, the
    sender (Alice) and the receiver (Bob), exchange public keys as digital certificates.
    The second step, ignoring the underlying algebra, is each party computes the same
    shared secret using its asymmetric key pair and the other party’s public key.


    ![](images/00002.jpeg)

    Alice uses her public asymmetric key, her private asymmetric key, and Bob’s public
    key.


    ![](images/00002.jpeg)

    Bob uses his public asymmetric key, her private asymmetric key, and Alice’s public
    key.


    The third step is each party derives a symmetric key from the shared secret using
    a common `KDF`. The `KDF` allows Alice and Bob to derive the same symmetric key
    from the shared secret. The length of the symmetric keys is determined by the
    intended symmetric algorithm and its options, for example the Advanced Encryption
    Standard (`AES`) supports 128-bit, 192-bit, and 256-bit keys, whereas the length
    of the shared secret differs depending on the `DH` domain parameters and the length
    of the `DH` keys, so the `KDF` allows the key size to be derived from the shared
    secret.


    ![](images/00042.jpeg)

    Figure 3.14 DH or ECDH key agreement.


    [Figure 3.14](#part0008.html#fig3_14) also represents the Elliptic Curve Diffie–Hellman
    (`ECDH`) algorithm defined in X9.83 \[[43](#part0016.html#ref_43)\] which is an
    elliptic curve analogue of the `DH` key agreement mechanism defined in X9.42 \[[41](#part0016.html#ref_41)\].
    Thus, the asymmetric keys used for DH key agreement might be `DH` keys or `ECDH`
    keys and interestingly the digital certificate encapsulating the public key is
    signed using a completely different algorithm (e.g., `RSA` or `ECDSA`).

