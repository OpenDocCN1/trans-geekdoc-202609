    The Domain Name System (DNS) is a set of distributed databases that contain various
    types of resource records (RRs) for managing Internet domain names. Basically,
    DNS translates domain names like [www.example.com](http://www.example.com) to
    an Internet Protocol (IP) address (`198.51.100.0`). DNS also provides reverse
    lookups; an IP address is translated to the corresponding domain name. The right-most
    name (e.g., `.com`) is known as the top-level domain (TLD) name. Other TLD include
    `.com` for commercial entities, `.org` primarily for nonprofit organizations,
    `.edu` for higher education institutions, `.gov` for US government agencies, `.mil`
    for US military forces, and two-letter country codes based on ISO 3166-1 [[48](#part0016.html#ref_48)]\]
    such as `.au` for Australia, `.jp` for Japan, `.ru` for Russian Federation, and
    `.us` for United States. ISO also offers an Online Browsing Platform[^(\*)](#part0009.html#fn4_1).


    ![](images/00046.jpeg)


    Figure 4.1  DNS example.


    The second-level domain name (e.g., [www.example.com](http://www.example.com))
    is separated from the TLD by a period, with an unlimited number of lower levels
    (e.g., third level, fourth level) likewise separated by periods. The prefix `www`
    denotes a World Wide Web server, whereas `ftp` is a file transfer protocol server
    and `mail` is for an email server. The Internet Corporation for Assigned Names
    and Numbers[^†](#part0009.html#fn4_2) manages the TLD and many other unique identifiers.
    [Figure 4.1](#part0009.html#fig4_1) gives a two simplistic DNS examples: a successful
    lookup and a failure. For the first example, the server `Bob` connects to the
    server `Alice` using the name [www.example.com](http://www.example.com). `Bob`
    submits the name to a DNS server which may communicate to other DNS services,
    and the translated IPv4 address `198.51.100.0` is returned to `Bob` allowing a
    connection to `Alice`. For the second example, `Bob` gets an error for the name
    [bob.net](http://bob.net) so without an IP address the connection fails.


    However, if any of the DNS RRs are counterfeit, `Alice` might connect to the wrong
    server (not `Bob`) but be unaware of the dishonest connection. There are three
    basic DNS protocol attacks [[50](#part0016.html#ref_50)]. DNS cache poisoning
    is where the wrong record information is injected onto a DNS server. DNS spoofing
    is when an illegitimate server intercepts a valid DNS request and returns an invalid
    DNS response. DNS ID hacking is when an illegitimate server masquerades as a legitimate
    DNS server and provides inaccurate RRs. Domain Name System Security (DNSSEC) is
    an authentication scheme designed to mitigate these types of DNS attacks.


    [Figure 4.2](#part0009.html#fig4_2) provides an overview of DNSSEC cryptography.
    DNSSEC uses Public Key cryptography to sign and authentication RRs but does not
    use Public Key infrastructure (PKI) or digital certificates. See [Chapter 2](#part0007.html#ch02)
    for digital signatures and [Chapter 3](#part0008.html#ch03) for digital certificates
    and PKI considerations. Rather, the Public Keys are stored in `DNSKEY` RRs, and
    the corresponding private keys are stored by the authoritative DNS signers. The
    digital signatures are stored in `RRSIG` RRs. The digest (hash) of the `DNSKEY`
    RRs is stored in `DS` RRs. Further, DNSSEC does not provide confidentiality.


    ![](images/00047.jpeg)


    Figure 4.2  DNSSEC cryptography.


