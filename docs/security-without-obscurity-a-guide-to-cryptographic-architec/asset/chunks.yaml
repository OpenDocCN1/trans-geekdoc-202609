    ![Images](img/00086.jpeg)


    `Host Info` (4) 被定义为 `Host Data`，它是另一个一个或多个 `Product Name` 序列，由五个数据元素组成：制造商、品牌、型号、序列号和别名。主机信息识别了与加密模块连接、编译、嵌入或绑定的相关系统。例如，HSM
    可能通过网络连接或物理线缆连接到服务器。另一个例子是，加密模块可能嵌入网络设备中。或者，加密库可能被编译到应用程序中或与操作系统绑定。


    ![Images](img/00087.jpeg)

    ![Images](img/00088.jpeg)


    总之，任何开发项目都会产生诸如应用程序或网络架构等产物，但加密架构往往被忽视。现代网络、系统和产品在演变过程中，加密几乎无处不在，但细节往往被忽略、未记录或简单地无视。应用程序开发者、技术经理和业务分析师往往只是寄希望于运气。当漏洞影响加密算法或协议时，其对架构的影响是未知的。因此，安全专业人员需要将加密架构的关键性纳入考虑。


    ## *第 7 章*


    ## 风险管理


    风险管理基于这样一个假设：通过实施安全控制可以降低数据风险。虽然这通常是正确的，但在加密架构方面，所能实现的目标存在限制和权衡。图 7.1 显示了一个具有风险下降曲线的风险模型。x
    轴表示安全控制从左到右增加，y 轴表示数据风险从上到下减少。曲线实际上并没有触及 y 轴（靠近 x-y 原点处），因为每个系统和网络都有一些极少的安全控制（例如访问控制、事件日志）有助于降低风险。随着安全控制的增加（沿
    x 轴从左向右移动），风险降低，曲线与 x 轴之间的距离代表残余风险。


