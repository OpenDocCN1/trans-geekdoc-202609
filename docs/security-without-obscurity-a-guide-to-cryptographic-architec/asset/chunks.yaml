    ISO/ITU-T(2) document-types(2) also written as 2.2 arc


    ISO/ITU-T(2) asn-1(3) also written as 2.3 arc


    ISO/ITU-T(2) international-md(5) also written as 2.5 arc


    ISO/ITU-T(2) international-organization(6) also written as 2.6 arc


    Examples from the RFC 5820 Internet X.509 Public Key Infrastructure (PKIX) specification
    include the following OID. See Annex: X.509 Certificate Quick Reference for details.


    **CPS Qualifier** is iso (1) identified-organization(3) dod(6) internet(1) security(5)
    mechanisms(5) pkix(7) id-qt(2) id-qt-cps(1) or 1.3.6.1.5.5.7.2.1


    **Key Usage** is joint-iso-ccitt(2) ds(5) id-ce(29) id-ce-keyUsage (15) or 2.5.29.15


    **Extended Key Usage** is joint-iso-ccitt(2) ds(5) id-ce(29) id-ce-extKeyUsage(37)
    or 2.5.29.37


    **Subject Alternate Name** is joint-iso-ccitt(2) ds(5) id-ce(29) id-ce-subjectAlt-Name(17)
    or 2.5.29.17


    **CRL Distribution Points** is joint-iso-ccitt(2) ds(5) id-ce(29) id-ce-cRLDistributionPoints(31)
    or 2.5.29.31


    As another example, the X9.73 Cryptographic Message Syntax (CMS) standard has
    its own OID per the Accredited Standards Committee X9 organization assigned from
    the International Standards Organization Technical Committee 68 for the financial
    services industry.


    **CMSObjectIdentifers** is iso(1) identified-organization(3) tc68(133) country(16)
    x9(840) x9Standards(9) x9-73(73) module(0) oids(1) v2009(1) or 1.3.133.16.840.9.73.0.1.1


    Each X9 standard has its own arc based on the ASC X9 arc 1.3.133.16.840.9 using
    its assigned number as the next value and then followed by its own OID structure.


    There are several online OID registries, but none of them necessarily contain
    all registered OID and there is no central repository. Alternatively, any OID
    can be searched on the Internet with a good chance of finding an appropriate source
    or even a definition. OIDs are typically defined in various international and
    national standards, specifications, and even proprietary documents. Here are a
    few online OID registries.


    ![](images/00002.jpeg)Alvestrand OID Registry at [www.alvestrand.no/objectid/](http://www.alvestrand.no/objectid/)


    ![](images/00002.jpeg)GnuPG OID Registry at [www.gnupg.org/oids.html](http://www.gnupg.org/oids.html)


    ![](images/00002.jpeg)Info OID Registry at [www.oid-info.com/](http://www.oid-info.com/)


    However, many standards or specifications do not use OID, rather they use proprietary
    numbering systems or other identification schemes.


    ### ASN.1 Module


    This annex provides an Abstract Syntax Notation One (ASN.1) module for defining
    cryptographic architecture information discussed in [Chapter 6](#part0011.html#ch06).
    This ASN.1 module is suitable for input to programming language code generation
    tools. The abstract schema provided here might be used to populate a database
    or create a graphic interpretation of the cryptographic module information.


    ```

    CryptographicModule ::= SEQUENCE {

       version          INTEGER,

       productInfo      ProductData,

       cryptoInfo       CryptoData,


       productCategory  ProductType,

       hostInfo         HostData,

       protocolInfo     ProtocolData

    }


    ProductData ::= SEQUENCE SIZE(1..MAX) OF ProductName


    ProductName ::= SEQUENCE {

       manufacturer  AnyLanguage,

       make          AnyLanguage OPTIONAL,

       model         AnyLanguage OPTIONAL,

       number        AnyLanguage OPTIONAL,

       nickname      AnyLanguage OPTIONAL

    }


    AnyLanguage ::= UTF8String (SIZE(1..MAX))


    CryptoData ::= SEQUENCE SIZE(1..MAX) OF CryptoName


    CryptoName ::= SEQUENCE {

       algorithmID   AlgorithmIdentifier,

       keySizeBits   INTEGER  OPTIONAL,

       hashSizeBits  INTEGER  OPTIONAL,

       keyUse        KeyUsage,

       keyLifecycle  CryptoDates

    }

    KeyUsage ::= SEQUENCE SIZE(1..MAX) OF OBJECT IDENTIFIER


    CryptoDates ::= SEQUENCE {

       generationDate   Time,

       useDate          Time  OPTIONAL,

       endDate          Time  OPTIONAL,

       terminationDate  Time,

       archiveDate      Time  OPTIONAL

    }


    Time ::= GeneralizedTime


    ProductType ::= SEQUENCE {

       hardware  BOOLEAN,

       firmware  BOOLEAN,

       software  BOOLEAN,

       compiled  BOOLEAN,

       embedded  BOOLEAN,

       bundled   BOOLEAN

    }


    HostData ::= SEQUENCE SIZE(1..MAX) OF ProductName


    ProtocolData ::= SEQUENCE SIZE(1..MAX) OF ProtocolName

    ProtocolName ::= SEQUENCE {

       protocolName    AnyLanguage OPTIONAL,

       nickname        AnyLanguage OPTIONAL,

       protocolID      OBJECT IDENTIFIER,

       protoclVersion  INTEGER,

       parameters      OCTET STRING

    }

    ```


    ### Acknowledgments


    Special thanks is extended to Phil Griffin for reviewing, updating, and verifying
    the ASN.1 syntax.


