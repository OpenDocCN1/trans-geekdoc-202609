    ### 6.5 加密清单


    除了图 6.13 中提供的加密架构图外，还可以提供更多信息，如表 6.2 所示的清单。可以使用简单的表格来总结基本的 5W1H 问题。图表中能提供的信息量存在实际限制。信息过多会使图表杂乱且难以阅读，而信息过少则会降低其效用。某些图形化工具允许嵌入注释或附件，但这只允许读者一次看到一个实例。表格则允许读者查看常见的数据点或数据模式。


    表 6.2 加密架构清单


    ![images](img/00081.jpeg)

    ![images](img/00082.jpeg)


    表 6.2 的编号对应图 6.13 中的加密架构图。每行都提供了基本的 5W1H 问题。实体（谁）信息可以根据需要尽可能详尽；可能精确到特定的主机名。算法（什么）信息可以扩展到包含密钥长度（例如：Rivest–Shamir–Adleman
    (RSA) 2048 位，高级加密标准 (AES) 256 位）。目的（为什么）可以增强以反映特定的应用程序或网络用途。位置（何地）可以扩展到包含物理地址（例如：主街
    123 号）或 IP 地址。协议（何时）可能包含协议选项或特定配置。进一步的细节（如何）可能包括处理限制、错误处理、法律保证或责任或其他业务相关的事务。


    或者，可以使用使用抽象语法表示一 (`ASN.1`) 定义的元数据结构来对每个加密模块的关联信息进行编码。参考`附录：ASN.1 模块`以获取适用于编程语言代码生成工具的完整章节。抽象模式可能用于填充数据库或创建加密模块信息的图形化解释。


    ![Images](img/00083.jpeg)


    `Version` 标识 ASN.1 模块的发布版本。就本书而言，`附录：ASN.1 模块`中提供的结构版本号为零“0”。任何修改或更新都应增加版本号。这允许对语法进行程序化的解析和解释，以便显示信息或分析架构。


    ![Images](img/00084.jpeg)

