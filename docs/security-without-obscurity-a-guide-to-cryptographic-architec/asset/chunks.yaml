    ![](images/00002.jpeg)The drainage ditch around the facility not only prevents
    flooding during heavy rains, it also acts as an “invisible” barrier obstructing
    vehicles from crashing the security fence.


    ![](images/00002.jpeg)The security fence surrounding the facility hinders unauthorized
    individuals from entering the facility by directing traffic to the single entrance.


    ![](images/00002.jpeg)The guard shack at the entrance controls inbound and outbound
    vehicle traffic and the guards authenticate and authorize employees and visitors.


    ![](images/00002.jpeg)The landscaped trees and the raised berm is another “invisible”
    barrier blocking vehicle access to the building lobby.


    ![](images/00002.jpeg)The pathway around the building allows guards to patrol
    the grounds.


    ![](images/00002.jpeg)The lobby at the building entrance controls entering and
    departing human traffic and the guards authenticate and authorize visitors.


    Cameras monitor traffic at the guard shack, the parking lot area, the lobby, the
    pathway, the foot traffic in the lobby, and the rooftop access. In addition to
    the physical security controls, there are logical security controls such as automated
    processes and manual procedures that supplement the overall security posture.


    ![](images/00002.jpeg)At the entrance, the guards must recognize employees but
    check identification of any unfamiliar faces including all visitors. Visitors
    must be invited by an employee.


    ![](images/00002.jpeg)In the lobby, guards issue visitor badges and manage employee
    escorts. Employees’ badges are scanned by readers for access through mantraps
    into the main building.


    ![](images/00002.jpeg)Within the main building, employees regularly display badges
    and escort visitors at all times. Some areas require badge access and visitor
    sign in.


    Camera video and badge access logs are retained in case of a security incident.
    Some videos are kept online for quick reference, while others are preserved offline
    for longer periods. Guards patrol the pathway and the rooftop to inspect the building.
    Problems are reported and repairs are effected straightaway. Videos and logs are
    reviewed regularly for continuity. Any abnormality or suspicious activity is immediately
    reported. From a cryptographic architecture perspective, the physical and logical
    controls to restrict access to cryptographic equipment, systems that employ cryptography,
    and the storage of cryptographic material is an important group of compensating
    controls. The next layer System Security discusses business continuity and disaster
    recovery (BCDR), vulnerability lifecycle management systems (VLMSs), and penetration
    (pen) testing.


    ### 7.2 System Security


    BCDR was introduced in [Chapter 6](#part0011.html#ch06) when discussing the datacenter
    diagram and the cryptographic architecture. The datacenter diagram recognized
    that Internet connections were redundant between the regional west and east datacenters,
    data was backed up for recovery, and data was synchronized between the two datacenters
    and the two backup and recovery sites. The cryptographic architecture identified
    the Internet cross-connection, the datacenter cross-connections, the backup connection,
    and the backup and recovery cross-connection. BCDR includes processes, procedures,
    and people to maintain business availability and recover information in the event
    of a disaster.


    VLMS maintain software for applications, servers, and other network devices. When
    a bug fix, patch, or modification is provided by the product manufacturer, the
    changes need to be applied. National Institute of Standards and Technology (NIST)
    provides a guide to enterprise patch management technologies [[76](#part0016.html#ref_76)]\]
    for identifying, acquiring, installing, and verifying patches. The guideline discusses
    challenges inherent in performing patch management and provides an overview of
    technologies. There are various VLMS models. For example, the Qualys paper, a
    Guide to Effective Remediation of Network Vulnerabilities, provides an eight-step
    process [[77](#part0016.html#ref_77)]\]


    1. Create security policies and controls

    2. Track inventory/categorize assets

    3. Scan systems for vulnerabilities

    4. Compare vulnerabilities against inventory

    5. Classify risks

    6. Pretest patches

    7. Apply patches

    8. Re-scan and confirm fixes


    As another example, the System Admin, Audit, Network, Security (SANS) paper Implementing
    a Vulnerability Management Process describes a simpler five-phase program [[78](#part0016.html#ref_78)]\].
    The SANS first preparation phase basically combines the first two Qualys steps.
    Both models recognize vulnerability scanning; Qualys step three and SANS phase
    three. The Qualys steps five, six, and seven are essentially merged into the SANS
    fourth phase. Both models recommend re-scans to confirm the fixes.


    1. Preparation

    2. Vulnerability scan

    3. Define remediating actions

    4. Implement remediating actions

    5. Re-scan


    Similarly, the X9.111 standard [[79](#part0016.html#ref_79)]\] identifies five
    stages for penetration testing. Whereas a vulnerability scan is a test process
    that attempts to identify the presence of potential vulnerabilities to known network-based
    attacks; a penetration test attempts to exploit vulnerabilities to determine whether
    unauthorized access or other malicious activity is possible. Penetration testing
    includes network and application testing as well as controls and processes around
    the networks and applications, and occurs from both outside the network trying
    to come in (external testing) and from inside the network.


    1. Specification of penetration test

    2. Engagement guidelines

    3. Penetration test activity

    4. Engagement reporting

    5. Remediation


    The first stage is to identify and evaluate the set of information security objectives
    agreed to in the statement of work. The second stage is to arrive at an agreement
    on the test parameters and scope. The third stage is when the actual penetration
    test activity occurs. The fourth stage is for the tester reports findings to the
    organization. The fifth stage is remediation either independent of the tester
    or if the tester is involved, the same tester cannot conduct follow-up tests.
    From a cryptographic architecture perspective, BCDR and VLMS along with pen testing
    are important aspects to ensure reliability of cryptographic equipment, systems
    that employ cryptography, and the storage of cryptographic material. The next
    layer Cryptographic Modules addresses hardware versus software cryptography and
    network security for using and managing cryptographic modules.


    ### 7.3 Cryptographic Modules


    A cryptographic module provides cryptographic services by executing cryptographic
    algorithms (e.g., encryption, Message Authentication Code (MAC), keyed Hash Message
    Authentication Code [`HMAC\], digital signatures) and protecting cryptographic
    keys during the algorithm execution. Cryptographic modules also perform related
    functions (e.g., hash, number generations) that do not use keys. In order for
    a cryptographic algorithm to use a key, the key must be cleartext. The key might
    be encrypted using another key, called a key encryption key (KEK), to protect
    it during storage or transmission, but it must be decrypted for the algorithm
    execution in memory. See [Figure 7.5](#part0012.html#fig7_5) for an example of
    cryptographic module.


    ![](images/00093.jpeg)


    Figure 7.5 Internal cryptographic module.

