- fmt: '

    Hashes are also called “one-way” functions because given a hash the function cannot
    be reversed to recover the cleartext; hashing is irreversible. The purpose of
    the hash is a relatively unique representation, sometimes called a fingerprint,
    of the cleartext. The hash is “relatively” unique because the total number of
    possible inputs (variable length cleartext) is much larger than the number of
    possible outputs (fixed length hash). This simply means that multiple cleartext
    inputs may yield the same hash. So for some set of different cleartext (`Ci`,
    `Cj`, `Ck`, or more), the same hash function yields the same hash: so `H(Ci) =
    H(Cj) = H(Ck) = h`. This is called a hash collision which is characteristic of
    any hash function. However, some hash functions have collision rates that are
    too high; this is the fundamental reason for cryptographic hash algorithms.


    Cryptographic hash algorithms have three essential characteristics.


    ![](images/00019.jpeg)


    Figure 2.3 Hash function.


    ![](images/00002.jpeg)


    **Pre-image resistance**: given a hash value (`h`) it is difficult to find any
    cleartext (`Ci`) such that `H(Ci) = h`. This characteristic is the basis for a
    one-way function.


    ![](images/00002.jpeg)


    **Second pre-image resistance**: given an input cleartext (`Ci`) it is difficult
    to find another cleartext (`Cj`) such that `H(Ci) = H(Cj)`.


    ![](images/00002.jpeg)


    **Collision resistance**: it is difficult to find any two cleartext (`Cj`) and
    (`Ck`) such that `H(Cj) = H(Ck)`. The pair (`Cj`) and (`Ck`) is called a cryptographic
    hash collision.


    Older hash functions such as `MD4` and `MD5` (named for message digest, another
    term for hash value) with 128-bit hashes are no longer considered cryptographically
    secure. Federal Information Processing Standard (FIPS) 180-4 [[28](#part0016.html#ref_28)]
    defines the Secure Hash Algorithm `SHA-1` with 160-bit hash as a replacement for
    earlier message digest algorithms; `SHA-2` family with 224-bit, 256-bit, 384-bit,
    and 512-bit hashes as a replacement for `SHA-1`. FIPS 202 [[29](#part0016.html#ref_29)]
    introduces an alternative `SHA-3` family with 224-bit, 256-bit, 384-bit, and 512-bit
    hashes as a future replacement for `SHA-2`. Since `SHA-2` is a family of hash
    algorithms, they are often referred to as `SHA-256` or `SHA-512`; however, since
    the `SHA-2` and `SHA-3` have the same sizes, the hash algorithms can be confusing.


    Hash algorithms are used to protect stored passwords, as a type of non-cryptographic
    checksum, or with cryptographic keys discussed in [Section 2.3](#part0007.html#sec2_3).
    However, hash functions are susceptible to exhaustive attacks. Knowing the hash
    algorithm in use, anyone can create a list, commonly called a rainbow table, of
    possible hash values based on likely cleartext. For example, a hash algorithm
    can be used to generate a hash from a cleartext, but it is computationally infeasible
    to reverse the process.

