  trans: "\n\n# EMV 支付验证流程\n\n1. 发行机构使用 PIN 验证密钥 (`PVK`) 创建一个 PIN，并向持卡人发送 PIN 信封。PIN\
    \ 信封包含明文 PIN，以便持卡人记忆该 PIN。\n2. 发行机构在 PIN 信封之外，将支付卡单独发送给持卡人。\n3. 持卡人在商户处使用支付卡。持卡人在终端\
    \ PIN 键盘上输入 PIN，该 PIN 会立即使用终端 PIN 加密密钥 (`TPK`) 进行加密。交易数据和加密后的 PIN 被传输到商户系统。\n\
    \   注意 `TPK` 会使用密钥加密密钥 (`KEK`) 定期更换。\n4. 商户在硬件安全模块 (`HSM`) 内执行 PIN 翻译，使用 `TPK`\
    \ 解密 PIN，并使用商户 PIN 加密密钥 (`MPK`) 对 PIN 重新加密。将带有加密后 PIN 的授权请求消息发送给收单行。\n   ![](img/00108.jpeg)\n\
    \   图 9.2 EMV 支付卡。\n\n5. 收单行在 `HSM` 内执行另一次 PIN 翻译，使用 `MPK` 解密 PIN，并使用网络 PIN 加密密钥\
    \ (`NPK`) 对 PIN 重新加密。授权请求被转发到支付网络。\n6. 网络在 `HSM` 内执行另一次 PIN 翻译，使用 `NPK` 解密 PIN，并使用发行机构\
    \ PIN 加密密钥对进行重新加密。网络将请求路由到发行机构进行授权。\n7. 发行机构使用 `PVK` 验证 PIN，检查持卡人资料，并向网络、收单行和商户返回授权响应消息。\n\
    \n无论支付是基于磁条还是基于 EMV，在线 PIN 验证都是相同的。在线 EMV 授权按照以下步骤运行：\n\n1. 发行机构使用发行主密钥 (`IMK`)\
    \ 结合卡片的主账号标识 (`PAN`) 导出唯一的卡片主密钥 (`CMK`)，并将 `CMK` 注入卡片中。\n2. 发行机构将 EMV 卡发送给持卡人。\n\
    3. 持卡人在商户处使用卡片。\n4. EMV 卡使用 `CMK` 结合应用交易计数器导出唯一的交易会话密钥 (`TSK`)，并使用 `TSK` 生成交易数据生成授权请求密文\
    \ (`ARQC`)。交易数据和 `ARQC` 被传输到商户系统。参见图 9.3。\n5. 带有 `ARQC` 的授权请求消息发送给收单行。\n6. 带有\
    \ `ARQC` 的授权请求被转发到支付网络。\n   ![](img/00109.jpeg)\n   图 9.3 授权请求与响应。\n7. 网络将带有 `ARQC`\
    \ 的授权请求路由到发行机构进行授权。\n8. 发行机构使用 `IMK` 重新导出 `CMK`，然后使用 `CMK` 导出唯一的 `TSK`，用于验证 `ARQC`。随后\
    \ `TSK` 配合 `ARQC` 复用以生成授权响应密文 (`ARPC`)。发行机构将带有 `ARPC` 的授权响应消息返回给网络、收单行和商户。参见图\
    \ 9.3。\n\n除了在线授权外，EMV 还支持线下授权。EMV 终端执行授权：商户、收单行、网络和发行机构不会接收在线授权消息。EMV 不使用 `X.509`\
    \ 证书，而是采用专有的 PKI 凭据。线下 EMV 授权按照以下步骤运行：\n\n1. 发行机构生成一对 Rivest–Shamir–Adleman (`RSA`)\
    \ 密钥，获得由品牌 (`B`) CA 签名的凭据，并将发行机构 (`I`) 凭据安装到 ICC 卡中。\n2. 发行机构使用发行私钥对静态应用数据 (`SAD`)\
    \ 对象进行签名，并将签名的静态应用数据 (`SSAD`) 安装到 ICC 卡中。参见图 9.4。\n3. 发行机构生成另一对 `RSA` 密钥，创建一个由其发行机构\
    \ (`I`) 私钥签名的 ICC 凭据，并安装到 ICC 卡中。\n4. 发行机构将 EMV 卡发送给持卡人。\n5. 持卡人在商户处使用卡片。\n6.\
    \ 可选地，终端使用静态数据认证 (`SDA`) 验证 ICC 卡。发行机构 (`I`) 凭据和 `SSAD` 从 ICC 卡发送到终端。终端使用品牌 (`B`)\
    \ 凭据验证发行机构 (`I`) 凭据，然后使用发行机构 (`I`) 凭据验证 `SSAD`。参见图 9.4。\n7. 或者，终端使用动态数据认证验证 ICC\
    \ 卡。终端向 ICC 卡发送一个随机值。ICC 卡使用 ICC 私钥对动态应用数据（包含终端的随机值）进行签名，并将签名的动态应用数据 (`SDAD`)\
    \ 发送到终端进行验证。终端使用品牌 (`B`) 凭据验证发行机构 (`I`) 凭据，使用发行机构 (`I`) 凭据验证 ICC 凭据，并使用 ICC 凭据验证\
    \ `SDAD`。参见图 9.5。\n   ![](img/00110.jpeg)\n   图 9.4 静态数据认证。\n8. 对于线下授权，终端使用静态数据认证\
    \ (`SDA`) 验证 ICC 卡。发行机构 (`I`) 凭据和 `SSAD` 从 ICC 卡发送到终端。终端使用品牌 (`B`) 凭据验证发行机构 (`I`)\
    \ 凭据，然后使用发行机构 (`I`) 凭据验证 `SSAD`。参见图 9.4。\n9. 对于线下授权，终端使用动态数据认证验证 ICC 卡。终端向 ICC\
    \ 卡发送一个随机值。ICC 卡使用 ICC 私钥对动态应用数据（包含终端的随机值）进行签名，并将签名的动态应用数据 (`SDAD`) 发送到终端进行验证。终端使用品牌\
    \ (`B`) 凭据验证发行机构 (`I`) 凭据，使用发行机构 (`I`) 凭据验证 ICC 凭据，并使用 ICC 凭据验证 `SDAD`。参见图 9.5。\n\
    \   ![](img/00111.jpeg)\n   图 9.5 动态数据认证。\n\n"
- fmt: '

    ### 9.3 Secure Electronic Transactions (SET)


    Secure Electronic Transactions (SET) was a joint venture between MasterCard and
    Visa consisting of technical specifications and an operational organization (SETCo).
    The World Wide Web opened the Internet in the early 1990s to anyone with a browser
    (e.g., `Netscape`, `Mosaic`) and a network connection. The primary SET business
    driver was fraudulent merchants; fraudsters posing as legitimate merchants to
    gather card information (e.g., `PAN`, `expiration date`, `CCV2`, `PIN`) for subsequent
    CNP transactions or creating counterfeit cards for online or offline transactions.
    SET was designed to protect cardholders, acquirers, and issuers from merchant
    fraud, and consequently reduce cardholder fraud to the benefit of legitimate merchants,
    acquirers, and issuers.


    Visa began working with Microsoft to create a centralized model called Secure
    Transaction Technology. MasterCard created a consortium with `IBM`, `Netscape`,
    `GTE`, and others to develop a distributed specification called Secure Electronic
    Payment Protocol. Eventually Visa and MasterCard, under pressure from their financial
    institution members, merged their efforts and published SET as three books: (1)
    Business Description [[99](#part0016.html#ref_99)], (2) Programmer’s Guide [[100](#part0016.html#ref_100)],
    and (3) Formal Protocol Definition [[101](#part0016.html#ref_101)].


    All three books were developed with advice and assistance provided by `GTE`, `IBM`,
    `Microsoft`, `Netscape`, `RSA`, `Science Applications International Corporation
    (SAIC)`, `Terisa`, and `VeriSign`. Many individuals from other companies who participated
    in the manufacturing or deployment of SET included (in alphabetical order) `American
    Express`, `CertCo`, `Digital Signature Trust`, `Fisher International`, `KMPG LLP`,
    and `Nortel`. Visa and MasterCard established SETCo, a legal entity to specifically
    manage SET participants and affiliations, in the hopes that other brands (e.g.,
    `American Express`) would join; however, no other brands officially became members.
    After operating worldwide for six years, SET was decommissioned in 2002. See [Figure
    9.6](#part0014.html#fig9_6).


    The SET scheme has three processing environments: the cardholder, the merchant,
    and the gateway. Transactions originate with the cardholder, sent to the merchant,
    forwarded to the gateway, and transmitted to a legacy payments network. SET was
    based on a global PKI, the SETCo root CA (SET) was operated offline at an undisclosed
    location; its technical details was a closely guarded secret. See [Figure 9.7](#part0014.html#fig9_7).


    Each participating brand (e.g., `Visa`, `MasterCard`) operated a brand CA (BCA)
    whose certificate was signed by the SETCo root CA. Each BCA had regional CA around
    the world, including Japan, the United States, Denmark, and France, whose certificates
    were signed by the associated BCA. Each regional CA issued certificates to a cardholder
    CA (CCA), a merchant CA (MCA), and a gateway CA (GCA). The CCA issued certificates
    to cardholders, the MCA issued certificates to merchants, and the GCA issued certificates
    to gateways. Consequently, cardholders, merchants, and gateways had separate certificate
    chains for each brand (`Visa`, `MasterCard`). The SET cryptography operates as
    follows:


    1. The cardholder signs the purchase data (e.g., red sweater size XL, priced at
    $30, customer name, customer address, shipping address) using its private key
    and encrypts the signed data using the merchant’s certificate.


    ![](images/00112.jpeg)

    Figure 9.6 SET cryptography.


    ![](images/00113.jpeg)

    Figure 9.7 SET certification authority.


    2. The cardholder signs the payment data (e.g., `PAN`, `expiration date`, `CVV2`)
    using its private key and encrypts the signed data using the gateway’s certificate.

    3. The cardholder sends both signed and encrypted objects to the merchant.

    4. The merchant decrypts the purchase data using its private key and verifies
    the signature using the cardholder’s certificate.

    5. The merchant re-signs the encrypted signed payment data using its private key
    and forwards the doubly signed encrypted object to the gateway; the merchant cannot
    decrypt the encrypted signed payment data.

    6. The gateway verifies the merchant signature using the merchant’s certificate,
    decrypts the payment object using its private key, and verifies the cardholder
    signature using the cardholder’s certificate.

    7. The gateway uses the payment data to send an authorization request to a legacy
    payment network and receives an authorization response.

    8. The gateway signs the authorization using its private key and returns it to
    the merchant.

    9. The gateway sends daily settlement information to the payment gateway for normal
    clearing and settlement processes. The settlement process moves money from the
    issuer (who in turn bills the cardholder) to the acquirer and the merchant’s account.

    Alternatively, for merchants who process their own clearing and settlement, the
    gateway signs the settlement information using its private key and sends it to
    the merchant. The gateway knows when to provide settlement info to the merchant
    based on a settlement flag in the merchant’s certificate.

    10. The merchant verifies the authorization (and possibly the settlement) signatures
    using the gateway’s certificate. If the merchant is authorized to receive settlement
    info, then the merchant handles its own clearing and settlement.


    During the development and deployment of SET, another technology developed by
    Netscape called Secure Socket Lay (SSL) was also deployed in browsers and servers.
    As discussed in [Chapter 5](#part0010.html#ch05), SSL was the predecessor to TLS.
    SSL and eventually TLS overcame SET due to three significant issues: cardholder
    authentication, merchant authentication, and merchant settlement.


    ![](images/00002.jpeg)Cardholder authentication was lacking, as SET rarely issued
    cardholder certificates. The cardholder relationship is with the issuer; for MasterCard
    and Visa, the issuers are financial institutions. However, banks were not prepared
    to provide federated identity of its customers to any relying party (e.g., merchants,
    gateways, acquires, networks).


    ![](images/00002.jpeg)Merchant authentication was available using other methods.
    Acquirers and gateways have contractual agreements with their merchants; vetting
    merchants is business as usual and part of the business due diligence. Fraudulent
    merchants seemed to be less of an issue than originally envisioned. However, hacking
    and data breaches have apparently overtaken the fraudulent merchant threat with
    hacked merchant.


    ![](images/00002.jpeg)Merchant settlement was enabled, as SET regularly allowed
    gateways to send settlement information back to large merchants. Large merchants
    were better suited to deploy SET but typically process their own settlement. Thus,
    large merchants gained access to the payment data from the settlement information.


    When cardholder signatures are eliminated, the connection to the merchant is just
    encryption, basically the same as SSL or TLS. When merchant signatures are negated
    by other business due diligence, the connection to the gateways is just encryption,
    again the same as SSL or TLS. And since settlement information returned by the
    gateway provides payment data to the merchant, this is basically the same result
    as the cardholder encrypting card data to the merchant using SSL or TLS. Hence,
    SET, which was complicated and expensive to use, was basically reduced to the
    security equivalent of SSL or TLS which is simpler and cheaper to operate.


    ### 9.4 ATM Remote Key Load (RKL)

