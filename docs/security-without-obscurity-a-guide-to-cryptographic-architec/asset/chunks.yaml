    ![](img/00002.jpeg)SSL v3.0 于 1996 年 11 月发布，并于后期 2011 年 8 月作为历史性请求意见文档（`RFC 6101`）\[60\]编码。


    ![](img/00002.jpeg)基于 SSL v3.0 的 TLS v1.0 于 1999 年 1 月发布为 `RFC 2246` \[61\]。


    ![](img/00002.jpeg)TLS v1.1 于 2006 年 4 月发布为 `RFC 4346` \[62\]。


    ![](img/00002.jpeg)TLS v1.2 于 2008 年 8 月发布为 `RFC 5246` \[63\]。


    ![](img/00002.jpeg)TLS v1.3 自 2014 年 4 月起一直在开发中。


    各种 TLS v1.3 草草案对 v1.2 进行了协议更改，包括强制使用临时密钥（ephemeral keys）以实现后安全性，并废弃了里斯特-沙米尔-阿德曼（`RSA`），因为它不支持临时密钥。临时密钥在第
    3 章中被讨论过。TLS v1.2 由两个层组成：TLS 握手协议和 TLS 记录协议。TLS 握手交换静态的 X.509 \[45\]证书以建立一个共享密钥，并在此推导出两个密钥：加密密钥和哈希消息认证码（`HMAC`）密钥。图
    5.1 显示了传输层安全协议（TLS）客户端与 TLS 服务器之间的一条虚线，代表传输密钥。会话密钥（`SKs`）（加密和 HMAC）可能通过密钥传输（例如，`RSA`）或密钥协商（例如，Diffie–Hellman
    [`DH\]）建立；而密钥协商可能会使用临时密钥来实现后安全性。


    一旦 TLS 握手协议建立了 `SKs`，TLS 记录协议就会加密 SSL 客户端与 SSL 服务器之间的每条消息。TLS 密文记录显示了四种元素：内容类型（Content
    Type）、协议版本（Protocol Version）、长度字段（Length field）和通用加密字段（Generic Cipher field）。通用加密字段包括明文数据的
    HMAC 和加密数据。通用加密三种加密选项：流密码加密、块密码加密以及带附加数据的认证加密（AEAD）。TLS 握手协议协商密码套，该密码套定义了用于 `SK`
    的密钥建立方案、加密选项、加密算法以及用于 HMAC 的哈希算法。从加密架构的角度来看，TLS 协议具有以下密钥：


    ![](img/00002.jpeg)TLS 客户端拥有其公钥和私钥传输密钥、SSL 服务器 X.509 证书以及两个派生的 `SKs`：加密密钥和 HMAC
    密钥。


    ![](img/00002.jpeg)TLS 服务器拥有其公钥和私钥传输密钥、SSL 客户端 X.509 证书以及两个派生的 `SKs`：加密密钥和 HMAC
    密钥。


    ![](img/00059.jpeg)


    图 5.1   TLS 加密架构。


    某些密钥建立方案（如 `RSA` 密钥传输）不需要客户端传输密钥，只需要服务器传输密钥。TLS 客户端使用 TLS 服务器密钥加密随机数，双方使用这些密钥来派生
    `SKs`。如果使用了临时密钥，那么除了静态 TLS 客户端和主机传输密钥外，一个或两个实体将拥有另一对异步密钥，并与另一个实体共享公钥（`PK`）。由于密钥对生命周期很短（通常为几毫秒），临时
    `PKs` 不封装在 X.509 证书中。然而，如所述，`RSA` 不支持临时密钥。


    ### 5.2 Internet Protocol Security (IPsec)


    网协议安全（IPsec） \[64\] 是一种用于互联网协议（IPv4 和 IPv5）数据包的加密和认证协议。IPsec 提供了两个独立的安全机制：封装安全载荷（`ESP`）。TLS
    握手协议协商密码套，该密码套定义了用于 `SK` 的密钥建立方案、加密选项、加密算法以及用于 HMAC 的哈希算法。

