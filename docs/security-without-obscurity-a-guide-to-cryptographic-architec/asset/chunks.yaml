    \nISO/ITU-T(2) international-organization(6) also written as `2.6 arc`\n\nExamples\
    \ from the RFC 5820 Internet X.509 Public Key Infrastructure (PKIX) specification\
    \ include the following OID. See Annex: X.509 Certificate Quick Reference for\
    \ details.\n\n`CPS Qualifier` is `iso (1) identified-organization(3) dod(6) internet(1)\
    \ security(5) mechanisms(5) pkix(7) id-qt(2) id-qt-cps(1)` or `1.3.6.1.5.5.7.2.1`\n\
    \n`Key Usage` is `joint-iso-ccitt(2) ds(5) id-ce(29) id-ce-keyUsage (15)` or `2.5.29.15`\n\
    \n`Extended Key Usage` is `joint-iso-ccitt(2) ds(5) id-ce(29) id-ce-extKeyUsage(37)`\
    \ or `2.5.29.37`\n\n`Subject Alternate Name` is `joint-iso-ccitt(2) ds(5) id-ce(29)\
    \ id-ce-subjectAlt-Name(17)` or `2.5.29.17`\n\n`CRL Distribution Points` is `joint-iso-ccitt(2)\
    \ ds(5) id-ce(29) id-ce-cRLDistributionPoints(31)` or `2.5.29.31`\n\nAs another\
    \ example, the X9.73 Cryptographic Message Syntax (CMS) standard has its own OID\
    \ per the Accredited Standards Committee X9 organization assigned from the International\
    \ Standards Organization Technical Committee 68 for the financial services industry.\n\
    \n`CMSObjectIdentifers` is `iso(1) identified-organization(3) tc68(133) country(16)\
    \ x9(840) x9Standards(9) x9-73(73) module(0) oids(1) v2009(1)` or `1.3.133.16.840.9.73.0.1.1`\n\
    \nEach X9 standard has its own arc based on the ASC X9 arc `1.3.133.16.840.9`\
    \ using its assigned number as the next value and then followed by its own OID\
    \ structure.\n\nThere are several online OID registries, but none of them necessarily\
    \ contain all registered OID and there is no central repository. Alternatively,\
    \ any OID can be searched on the Internet with a good chance of finding an appropriate\
    \ source or even a definition. OIDs are typically defined in various international\
    \ and national standards, specifications, and even proprietary documents. Here\
    \ are a few online OID registries.\n\n- ![](images/00002.jpeg) Alvestrand OID\
    \ Registry at [www.alvestrand.no/objectid/](http://www.alvestrand.no/objectid/)\n\
    - ![](images/00002.jpeg) GnuPG OID Registry at [www.gnupg.org/oids.html](http://www.gnupg.org/oids.html)\n\
    - ![](images/00002.jpeg) Info OID Registry at [www.oid-info.com/](http://www.oid-info.com/)\n\
    \nHowever, many standards or specifications do not use OID, rather they use proprietary\
    \ numbering systems or other identification schemes.\n\n### ASN.1 Module\n\nThis\
    \ annex provides an Abstract Syntax Notation One (ASN.1) module for defining cryptographic\
    \ architecture information discussed in [Chapter 6](#part001.html#ch06). This\
    \ ASN.1 module is suitable for input to programming language code generation tools.\
    \ The abstract schema provided here might be used to populate a database or create\
    \ a graphic interpretation of the cryptographic module information.\n\n```\nCryptographicModule\
    \ ::= SEQUENCE {\n   version          INTEGER,\n   productInfo      ProductData,\n\
    \   cryptoInfo       CryptoData,\n\n   productCategory  ProductType,\n   hostInfo\
    \         HostData,\n   protocolInfo     ProtocolData\n}\n\nProductData ::= SEQUENCE\
    \ SIZE(1..MAX) OF ProductName\n\nProductName ::= SEQUENCE {\n   manufacturer \
    \ AnyLanguage,\n   make          AnyLanguage OPTIONAL,\n   model         AnyLanguage\
    \ OPTIONAL,\n   number        AnyLanguage OPTIONAL,\n   nickname      AnyLanguage\
    \ OPTIONAL\n}\n\nAnyLanguage ::= UTF8String (SIZE(1..MAX))\n\nCryptoData ::= SEQUENCE\
    \ SIZE(1..MAX) OF CryptoName\n\nCryptoName ::= SEQUENCE {\n   algorithmID    AlgorithmIdentifier,\n\
    \   keySizeBits    INTEGER  OPTIONAL,\n   hashSizeBits   INTEGER  OPTIONAL,\n\
    \   keyUse         KeyUsage,\n   keyLifecycle   CryptoDates\n}\nKeyUsage ::= SEQUENCE\
    \ SIZE(1..MAX) OF OBJECT IDENTIFIER\n\nCryptoDates ::= SEQUENCE {\n   generationDate\
    \  Time,\n   useDate         Time  OPTIONAL,\n   endDate         Time  OPTIONAL,\n\
    \   terminationDate  Time,\n   archiveDate     Time  OPTIONAL\n}\nTime ::= GeneralizedTime\n\
    \nProductType ::= SEQUENCE {\n   hardware  BOOLEAN,\n   firmware  BOOLEAN,\n \
    \  software   BOOLEAN,\n   compiled   BOOLEAN,\n   embedded  BOOLEAN,\n   bundled\
    \   BOOLEAN\n}\n\nHostData ::= SEQUENCE SIZE(1..MAX) OF ProductName\n\nProtocolData\
    \ ::= SEQUENCE SIZE(1..MAX) OF ProtocolName\n\nProtocolName ::= SEQUENCE {\n \
    \  protocolName  AnyLanguage,\n   nickname      AnyLanguage OPTIONAL,\n   protocolID\
    \    INTEGER,\n   parameters    INTEGER\n}\n```\n\n### Acknowledgments\n\nSpecial\
    \ thanks to Phil Griffin for reviewing, updating, and verifying the ASN.1 syntax.\n\
    \nRFC 4648 Base16, Base32, and Base64 Data Encodings.\n"
