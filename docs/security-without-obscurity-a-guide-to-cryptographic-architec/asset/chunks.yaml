    admin VLAN to the ASs.

    15. The DB servers have symmetric DBE keys.

    16. The East datacenter network routers have SSH keys for connections over the
    admin VLAN to the ASs.

    17. The East datacenter network routers have IPsec keys, a private asymmetric
    key and a public key certificate, for cross-connecting to the West datacenter
    network routers.

    18. The West datacenter network routers have SSH keys for connections over the
    admin VLAN to the ASs.

    19. The West datacenter network routers have IPsec keys, a private asymmetric
    key and a public key certificate, for cross-connecting to the East datacenter
    network routers.

    20. The SSs in the network zone have SSH keys for connections over the admin VLAN
    to the ASs.

    21. The ASs in the network zone have TLS keys, a private asymmetric key and a
    public key certificate, for internal TLS connections to the RASs.

    22. The ASs in the network zone have SSH keys for connections over the admin VLAN
    to the other servers in the DMZ, network zone, and routers.

    23. The West BR servers have IPsec keys, a private asymmetric key and a public
    key certificate, for synchronizing to the East BR servers.

    24. The East BR servers have IPsec keys, a private asymmetric key and a public
    key certificate, for synchronizing to the West BR servers.


    There are almost four dozen keys shown in [Figure 6.13](#part0011.html#fig6_13),
    counting symmetric keys, asymmetric public keys and digital certificates, and
    asymmetric private keys. The graphical depiction gives an overview and the relative
    relations between the keys. However, it cannot provide all of the associated information,
    as there is simply insufficient room to include everything. Another option might
    be cross-referencing the graphical depiction with an inventory. But, an inventory
    without the graphic is less meaningful; having both are optimal.


    ### [6.5 Cryptographic Inventory](#part0003.html#Rsec6_5)


    In addition to the cryptographic architecture diagram provided in [Figure 6.13](#part0011.html#fig6_13),
    more information can be proved such as an inventory shown in [Table 6.2](#part0011.html#tab6_2).
    The basic five Ws and H questions can be summarized using a simple table. There
    is a practical limit as to how much information can be provided in a diagram.
    Too much information clutters the diagram and makes it unreadable, whereas too
    little information reduces its usefulness. Some graphical tools allow embedded
    comments or attachments, but this only allows a reader to see one instance at
    a time. A table allows a reader to see common data points or data patterns.


    Table 6.2 Cryptographic Architecture Inventory


    ![images](images/00081.jpeg)

    ![images](images/00082.jpeg)


    [Table 6.2](#part0011.html#tab6_2) is numbered per the cryptographic architecture
    diagram in [Figure 6.13](#part0011.html#fig6_13). The basic five Ws and H questions
    are provided in each row. The entity (who) information can be as detailed as needed;
    it might be host name specific. The algorithm (what) information can be extended
    to include the key size (e.g., Rivest–Shamir–Adleman (RSA) 2048-bit, Advanced
    Encryption Standard (AES) 256-bit). The purpose (why) can be enhanced to reflect
    application or network specific uses. The location (where) might be expanded to
    include physical address (e.g., 123 Main Street) or an IP address. The protocol
    (when) might include protocol options or specific configurations. Further details
    (how) might include processing restrictions, error handling, legal warranties
    or liabilities, or other business-related manners.


    Alternatively, a metadata structure defined using Abstract Syntax Notation One
    (`ASN.1`) can be used to encode the associated information for each cryptographic
    module. Refer to `Annex: ASN.1 Module` for a complete section suitable for input
    to programming language code generation tools. The abstract schema might be used
    to populate a database or create a graphic interpretation of the cryptographic
    module information.


    ![Images](images/00083.jpeg)


    `Version` identifies the ASN.1 module release number. For the purposes of this
    book, the version number is zero “0” for the structure provided in `Annex: ASN.1
    Module`. Any modifications or updates should increment the version number. This
    allows the syntax to be programmatically parsed and interpreted for displaying
    information or analyzing architectures.


    ![Images](images/00084.jpeg)

    ![Images](images/00085.jpeg)

    ![Images](images/00086.jpeg)


    `Host Info` (4) is defined as `Host Data` which is another sequence of one or
    more `Product Name` consisting of five data elements: Manufacturer, Make, Model,
    Number, and Nickname. The host information identifies the associated system with
    which the cryptographic module is connected, complied, embedded, or bundled. For
    example, a HSM might have a network connection or physically cabled to a server.
    As another example, a cryptographic module might be embedded within a network
    appliance. Alternatively, a cryptographic library might be complied into an application
    or bundled with an operating system.


    ![Images](images/00087.jpeg)

    ![Images](images/00088.jpeg)


    In conclusion, any development project produces artifacts such as an application
    or network architectures, but all too often the cryptographic architecture is
    overlooked. Modern-day networks, systems, and products have evolved with cryptography
    almost everywhere, but details are often overlooked, undocumented, or simply ignored.
    All too often, application developers, technical managers, and business analysts
    simply hope for the best. When vulnerabilities affect cryptographic algorithms
    or protocols, the architectural impacts are unknown. Consequently, the critical
    nature of the cryptographic architecture needs to be included by security professionals.


    ## [*Chapter 7*](#part0003.html#rch07)


    ## [Risk Management](#part0003.html#rch07)


    Risk management is based on the presumption that data risks can be reduced by
    implementing security controls. While this is generally true, there are limits
    and trade-offs as to what can be achieved with regard to cryptographic architectures.
    [Figure 7.1](#part0012.html#fig7_1) shows a risk model with a descending risk
    reduction curve. The x-axis represents security controls increasing from left
    to right, and the y-axis represents data risks decreasing from top to bottom.
    The curve does not actually touch the y-axis (near the x–y origin) because every
    system and network has some minimal security controls (e.g., access controls,
    event logging) that help reduce risk. As increasing security controls (moving
    left to right along the x-axis) reduce risk, the distance between the curve and
    the x-axis represents the residual risk. However, the curve never reaches the
    x-axis as there are always some residual risks.

    '
