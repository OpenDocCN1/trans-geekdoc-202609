    ## [*Chapter 1*](#part0003.html#rch01)


    ## [Introduction](#part0003.html#rch01)


    Cryptography is everywhere. It’s in your browsers, your mobile phones, the applications
    and services you use, and probably in places you don’t think about. What was once
    a technology limited to governments, military, and eventually financial systems
    is now commonly used in about every industry in almost every application on the
    planet. Actually, since we now regularly send space probes to other planets and
    even beyond our own solar system, one might claim that cryptography is a universal
    practice. And while implementing cryptography might not be rocket science, although
    its development and analysis is certainly mathematically intense, there are important
    things to know and understand to deploy good crypto versus bad crypto.


    To be clear, cryptanalysis and its underlying math is beyond the scope of this
    book. And while a little bit of math is unavoidable, it is kept to a minimum.
    Rather, this book focuses on crypto engineering: the design, implementation, deployment,
    testing, and assessment of cryptographic architectures. There are many good books
    on number theory and general cryptography such as the *Handbook of Applied Cryptography*
    \[[1](#part0016.html#ref_1)\] and *Applied Cryptography* \[[2](#part0016.html#ref_2)\].
    There are also many excellent books on the history of cryptography such as *The
    Code Book* \[[3](#part0016.html#ref_3)\] and *The Code Breakers* \[[6](#part0016.html#ref_6)\].
    This book provides a basic description of cryptography, protocols, risk management,
    key management, data management, and security assessments, and offers several
    illustrations putting all of these various elements into an overall strategy for
    establishing a cryptographic architecture.


    Consider any development or maintenance project. Application developers will typically
    offer a simple diagram consisting of a few boxes with arrows representing various
    application systems. Network engineers will often provide a more detailed diagram
    showing various network connections and components such as routers, firewalls,
    and datacenters. However, the information security professional is forced to interpret
    and compare the application and network diagrams and expand the information to
    address the relevant security controls \[[4](#part0016.html#ref_4)\]. One of the
    more critical aspects of the use of cryptography is to achieve security controls
    and their associated key management lifecycle controls. This book provides a guide
    to cryptographic architectures.


    ### [1.1 Book Organization](#part0003.html#Rsec1_1)


    This book and its chapters are organized as follows. Each chapter builds on the
    previous chapter with the final chapter providing illustrations.


    **[Chapter 1](#part0006.html#ch01): Introduction** provides an overview of the
    book, cryptographic terminology, and a general discussion of industry groups and
    standards that define cryptographic algorithms, schemas, protocols, and message
    specifications. Readers of this book are also presented with a road map for readability
    of roles and general job descriptions.


    **[Chapter 2](#part0007.html#ch02): Cryptography Basics** presents a synopsis
    of cryptographic functions including encryption, authentication and integrity,
    non-repudiation, and tokenization processes. Modern algorithms, key sizes, and
    relevant security services are discussed. This chapter provides a knowledge foundation
    for later chapters and also provides crypto reference material.


    **[Chapter 3](#part0008.html#ch03): Cryptographic Keys** reviews symmetric keys,
    asymmetric private and public key pairs, and public key certificates. This chapter
    expands the cryptography discussion from the previous chapter and discusses public
    key infrastructures (PKI) but does not address operational aspects. For details
    see *Security without Obscurity: A Guide to PKI Operations* \[[5](#part0016.html#ref_5)\].


    **[Chapter 4](#part0009.html#ch04): Authentication Protocols** considers several
    common authentication protocols that rely on cryptography but typically do not
    address key management issues. Often one or more of these protocols are used within
    the application or network architectures and thus affect the corresponding cryptographic
    architecture.


    **[Chapter 5](#part0010.html#ch05): Security Protocols** considers several common
    security protocols that rely on cryptography but typically do not address key
    management issues. Often one or more of these protocols are used within the application
    or network architectures and thus affect the corresponding cryptographic architecture.'
