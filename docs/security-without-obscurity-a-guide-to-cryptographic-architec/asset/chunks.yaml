    [Figure 2.8](#part0007.html#fig2_8) depicts the tokenization encryption method.
    The tokenization process is when the USV is encrypted using a symmetric key which
    results in the token. The detokenization process is when the token is decrypted
    using the same symmetric key which recovers the USV. Since the USV can be recovered
    directly from the token no USV database, also called a token vault, is needed.
    However, the cryptographic key, also called a token key, must be managed securely
    otherwise if the key is compromised then any token ever generated can be decrypted.
    Further, unauthorized access to the detokenization service allows recovery of
    any USV from a token, and unlimited access to the tokenization service allows
    its misuse to create an exhaustive list, sometimes called a rainbow table, of
    all possible USV and tokens.


    [Figure 2.9](#part0007.html#fig2_9) shows the tokenization MAC method. The tokenization
    process is when the USV is used as input into `MAC` or `HMAC` function using a
    symmetric key which results in the token. The detokenization process can only
    occur using a token vault which contains a mapping of the USV to the token. Alternatively,
    an USV can be verified with a specific token. Likewise, the token key must be
    managed securely otherwise if the key is compromised then it can be used to create
    a rainbow table of all possible USV and tokens. Further, unauthorized access to
    the detokenization service (if a vault is enabled) allows recovery of any USV
    from a token, and unlimited access to the tokenization or verification service
    allows misuse to create a dictionary table of all possible USV and tokens.


    ![](images/00024.jpeg)

    Figure 2.8 Tokenization encryption method.


    ![](images/00025.jpeg)

    Figure 2.9 Tokenization MAC method.


    [Figure 2.10](#part0007.html#fig2_10) illustrates the tokenization random method.
    The tokenization process is when the USV is replaced by a random value using a
    random number generator (`RNG`). The entropy source for the `RNG` is independent
    from the USV input such that the token has no correlation with the USV. Consequently,
    the detokenization process can only occur using a token vault which contains a
    mapping of the USV to the token. Additionally, since the random method does not
    employ a cryptographic key there are no risks due to key compromise; however,
    the `RNG` might be influenced to produce skewed versus random values. Further,
    unauthorized access to the detokenization vault allows recovery of any USV from
    a token, and unlimited access to the tokenization service allows misuse to create
    a dictionary table of all possible USV and tokens.


    [Figure 2.11](#part0007.html#fig2_11) shows the tokenization table method. The
    tokenization process is when the USV is replaced by a value derived from a table
    of pseudo random numbers. The table is generated once, using an `RNG` to seed
    a pseudo random number generator (`PRNG`) which is used to populate the table.
    Once generated the table remain static for all tokenization and detokenization.
    The detokenization process is when the token is replaced by the USV derived from
    the same table; essentially tokenization is a lookup, and detokenization is a
    reverse lookup. Consequently, a token vault is unnecessary. Additionally, since
    the table method does not employ a cryptographic key there are no risks due to
    key compromise; however the `RNG` or `PRNG` might be influenced to adversely affect
    the table. Also, once generated the table needs to be managed securely otherwise
    if the table is compromised then any token ever generated can be decrypted. Further,
    unauthorized access to the detokenization service allows recovery of any USV from
    a token, and unlimited access to the tokenization service allows its misuse to
    create a rainbow table of all possible USV and tokens.


    ![](images/00026.jpeg)

    Figure 2.10 Tokenization random method.


    ![](images/00027.jpeg)

    Figure 2.11 Tokenization table method.


    [Figure 2.12](#part0007.html#fig2_12) provides an overview of the tokenization
    environment. From a tokenization perspective, there are either authorized entities
    that include users and business applications that interface to the tokenization
    system or unauthorized entities that do not. Hence the enterprise consists of
    a tokenization and non-tokenization environments. Authorized entities are authenticated
    by the Tokenization Request (`TRI`) for tokenization, detokenization, and possibly
    verification or other related services. Communications between the `TRI` and authorized
    entities should also be secured; for details, see `Chapters 4` and `5`. The tokenization
    service might include a token vault but only interacts with a valid `TRI` and
    only responds to legitimate requests.


    ![](images/00028.jpeg)

    Figure 2.12 Tokenization environment.


    Regardless of the methods offered by the tokenization service, although it is
    more likely only a single method is supported, unlimited access to tokenization
    allows its misuse to create a dictionary table of all possible USV and tokens.
    Likewise, unauthorized access to detokenization (or verification) allows recovery
    of any USV from a token. Thus the tokenization environment should be kept isolated
    from other services and unauthorized entities.


