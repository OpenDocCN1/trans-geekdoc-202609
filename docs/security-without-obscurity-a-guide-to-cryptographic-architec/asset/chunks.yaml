- fmt: "\n# EMV Payment Verification Processes\n\n1. The issuer creates a PIN using\
    \ the PIN verification key (`PVK`) and sends a PIN mailer to the cardholder. The\
    \ PIN mailer contains the cleartext PIN so the cardholder can memorize the PIN.\n\
    2. The issuer sends the payment card to the cardholder separately from the PIN\
    \ mailer.\n3. The cardholder uses the payment card at a merchant location. The\
    \ cardholder enters the PIN into the terminal PIN pad, and the PIN is immediately\
    \ encrypted using the terminal PIN encryption key (`TPK`). The transactional data\
    \ and the encrypted PIN are transmitted to the merchant system.\n   Note that\
    \ the `TPK` is changed periodically using the key encryption key (`KEK`).\n4.\
    \ The merchant performs a PIN translation within a hardware security module (`HSM`),\
    \ decrypting the PIN using the `TPK` and re-encrypting the PIN using the merchant\
    \ PIN encryption key (`MPK`). An authorization request message with the encrypted\
    \ PIN is sent to the acquirer.\n   ![](images/00108.jpeg)\n   Figure 9.2 EMV payment\
    \ card.\n\n5. The acquirer performs another PIN translation within an `HSM`, decrypting\
    \ the PIN using the `MPK` and re-encrypting the PIN using the network PIN encryption\
    \ key (`NPK`). The authorization request is forwarded to the payment network.\n\
    6. The network performs another PIN translation within an `HSM`, decrypting the\
    \ PIN using the `NPK` and re-encrypting the PIN using the issuer PIN encryption\
    \ key. The network routes the request to the issuer for authorization.\n7. The\
    \ issuer verifies the PIN using the `PVK`, checks the cardholder profile, and\
    \ returns an authorization response message to the network, acquirer, and merchant.\n\
    \nRegardless of whether the payment is magstripe based or EMV based the online\
    \ PIN verification is the same. Online EMV authorizations operate per the following\
    \ steps:\n\n1. The issuer uses an issuer master key (`IMK`) to derive a unique\
    \ card master key (`CMK`) with the card’s primary account number (`PAN`), and\
    \ the `CMK` is injected into the card.\n2. The issuer sends the EMV card to the\
    \ cardholder.\n3. The cardholder uses the card at a merchant location.\n4. The\
    \ EMV card uses the `CMK` to derive a unique transaction session key (`TSK`) with\
    \ the application transaction counter and uses the `TSK` to generate an Authorization\
    \ Request Cryptogram (`ARQC`) with the transaction data. The transactional data\
    \ and the `ARQC` is transmitted to the merchant system. See [Figure 9.3](#part0014.html#fig9_3).\n\
    5. An authorization request message with the `ARQC` is sent to the acquirer.\n\
    6. The authorization request with the `ARQC` is forwarded to the payment network.\n\
    \   ![](images/00109.jpeg)\n   Figure 9.3 Authorization request and response.\n\
    7. The network routes the authorization request with the `ARQC` to the issuer\
    \ for authorization.\n8. The issuer uses the `IMK` to re-derive the `CMK` and\
    \ then uses the `CMK` to derive the unique `TSK` which is then used to verify\
    \ the `ARQC`. The `TSK` is then reused with the `ARQC` to generate an Authorization\
    \ Response Cryptogram (`ARPC`). The issuer returns an authorization response message\
    \ with the `ARPC` to the network, acquirer, and merchant. See [Figure 9.3](#part0014.html#fig9_3).\n\
    \nIn addition to online authorization, EMV supports offline authorizations. The\
    \ EMV terminal performs authorization: the merchant, acquirer, network, and issuer\
    \ do not receive an online authorization message. EMV does not use `X.509` certificates\
    \ but employs a proprietary PKI credential. Offline EMV authorizations operate\
    \ per the following steps:\n\n1. The issuer generates a Rivest–Shamir–Adleman\
    \ (`RSA`) key pair, obtains a credential signed by the brand (`B`) CA, and installs\
    \ the issuer (`I`) credential into an ICC card.\n2. The issuer signs the static\
    \ application data (`SAD`) object using the issuer private key installs the signed\
    \ static application data (`SSAD`) into the ICC card. See [Figure 9.4](#part0014.html#fig9_4).\n\
    3. The issuer generates another `RSA` key pair, creates an ICC credential signed\
    \ by its issuer (`I`) private key, and installs the ICC credential and ICC private\
    \ key into the ICC card.\n4. The issuer sends the EMV card to the cardholder.\n\
    5. The cardholder uses the card at a merchant location.\n6. Optionally, the terminal\
    \ authenticates the ICC card using static data authentication (`SDA`). The issuer\
    \ (`I`) credential and `SSAD` are sent from the ICC card to the terminal. The\
    \ terminal uses the brand (`B`) credential to verify the issuer (`I`) credential\
    \ and then the issuer (`I`) credential to verify the `SSAD`. See [Figure 9.4](#part0014.html#fig9_4).\n\
    7. Alternatively, the terminal authenticates the ICC card using dynamic data authentication.\
    \ The terminal sends a random value to the ICC card. The ICC card signs the dynamic\
    \ application data (which includes the terminal random value) using the ICC private\
    \ key and sends the signed dynamic application data (`SDAD`) to the terminal for\
    \ verification. The terminal uses the brand (`B`) credential to verify the issuer\
    \ (`I`) credential, uses the issuer (`I`) credential to verify the ICC credential,\
    \ and uses the ICC credential to verify the `SDAD`. See [Figure 9.5](#part0014.html#fig9_5).\n\
    \   ![](images/00110.jpeg)\n   Figure 9.4 Static data authentication.\n8. For\
    \ offline authorization, the terminal authenticates the ICC card using static\
    \ data authentication (`SDA`). The issuer (`I`) credential and `SSAD` are sent\
    \ from the ICC card to the terminal. The terminal uses the brand (`B`) credential\
    \ to verify the issuer (`I`) credential and then the issuer (`I`) credential to\
    \ verify the `SSAD`. See [Figure 9.4](#part0014.html#fig9_4).\n9. For offline\
    \ authorization, the terminal authenticates the ICC card using dynamic data authentication.\
    \ The terminal sends a random value to the ICC card. The ICC card signs the dynamic\
    \ application data (which includes the terminal random value) using the ICC private\
    \ key and sends the signed dynamic application data (`SDAD`) to the terminal for\
    \ verification. The terminal uses the brand (`B`) credential to verify the issuer\
    \ (`I`) credential, uses the issuer (`I`) credential to verify the ICC credential,\
    \ and uses the ICC credential to verify the `SDAD`. See [Figure 9.5](#part0014.html#fig9_5).\n\
    \   ![](images/00111.jpeg)\n   Figure 9.5 Dynamic data authentication.\n\nRegardless\
    \ of whether the payment is magstripe based or EMV based the online PIN verification\
    \ is the same. Online EMV authorizations operate per the following steps... (Wait,\
    \ the text provided has repetition here, I will maintain the flow of the provided\
    \ source).\n\n*Note: The provided text contained some overlapping sections in\
    \ the list list. I have formatted them as they appeared in the source structure.*\n"
