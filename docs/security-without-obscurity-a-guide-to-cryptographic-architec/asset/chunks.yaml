    ### 9.1 假设的移动交易


    [图 9.1] 显示了处理移动交易的示例架构。从左到右读取该图，移动商店 (`mStore`) 为移动设备提供配置服务。该移动设备连接到 Web 服务器并发送消息。Web
    服务器连接到应用服务器并转发消息进行处理。应用服务器连接到数据库 (`DB`) 服务器以获取设备配置文件。`DB` 服务器连接到密钥管理 (`KM`) 服务器以获取数据库加密密钥。


    该示例移动架构中的每个实体都使用加密密钥用于多种用途，包括传输层安全 (`TLS`)、安全外壳 (`SSH`)、数据库加密 (`DBE`) 和移动安全。以下加密密钥被部署在移动环境中。


    ![](img/00002.jpeg)`mStore` 为每个移动设备生成一对唯一的非对称密钥对。公钥封装在由外部（商业）认证机构（`CA[1]``) 颁发的
    `X.509` 数字证书中。私钥和完整的证书链被安装在移动设备上，用于 `TLS` 连接。


    ![](img/00002.jpeg)移动设备除了其 `TLS` 私钥和证书链外，可能由于各种原因使用一个或多个唯一的对称密钥。例如，对称密钥可能用于加密非对称私钥、认证数据（如密码）或其他敏感数据（如账号）。白盒加密可能被用于混淆对称密钥；各种密钥位通过仅移动设备已的伪随机模式分散在整个移动设备中。移动应用程序可能通过重排可执行代码进行进一步混淆，使得每个移动设备具有相对唯一的软件版本，从而使逆向工程变得困难。


    ![](img/00107.jpeg)


    图 9.1 示例移动交易。


    ![](img/00002.jpeg)Web 服务器了自己的 `TLS` 私钥和证书链，这些证书由不同的外部（商业）`CA[2]` 颁发。除了 `TLS`
    静态密钥外，Web 服务器可能还会使用临时密钥（ephemeral keys）。`TLS` 握手与移动设备协商会话唯一的对称加密密钥和哈希消息认证码 (`HMAC`)
    密钥。成功的 `TLS` 握手要求 Web 服务器识别 `CA[1]` 证书链，且移动设备识别 `CA[2]` 证书链。Web 服务器还拥有用于密钥协商的非对称
    `SSH` 密钥，用于协商会话对称加密密钥以及与管理员进行数字签名认证。


    ![](img/00002.jpeg)应用服务器了自己的 `TLS` 私钥和证书链，这些证书由内部（私有）`CA[3]` 颁发。除了 `TLS` 静态密钥外，应用服务器可能还会使用临时密钥。`TLS`
    握手与 Web 服务器协商会话唯一的对称加密密钥和 `HMAC` 密钥。成功的 `TLS` 握手要求应用服务器识别 `CA[2]` 证书链，Web 服务器识别
    `CA[3]` 证书链。应用服务器还拥有用于密钥协商的非对称 `SSH` 密钥，用于协商会话对称加密密钥以及与管理员进行数字签名认证。


    ![](img/00002.jpeg)`DB` 服务器有了自己的 `TLS` 私钥和证书链，证书由与 `KM` 服务器相同的内部（私有）`CA[4]` 颁发。除了
    `TLS` 静态密钥外，`DB` 服务器还有由 `KM` 服务器管理的 `DBE` 密钥。`DB` 服务器还拥有用于密钥协商的非对称 `SSH` 密钥，用于协商会话对称加密密钥以及与管理员进行数字签名认证。


    ![](img/00002.jpeg)`KM` 服务器有了自己的 `TLS` 私钥和证书链，证书由内部（私有）`CA[4]` 颁发。除了 `TLS` 静态密钥外，`KM`
    服务器可能还会使用临时密钥。`TLS` 握手与 `DB` 服务器协商会话唯一的对称加密密钥和 `HMAC` 密钥。成功的 `TLS` 握手要求 `DB` 服务器识别
    `CA[4]` 证书链，`KM` 服务器识别 `CA[4]` 证书链。`KM` 服务器还拥有用于密钥协商的非对称 `SSH` 密钥，用于协商会话对称加密密钥以及与管理员进行数字签名认证。


    某些密钥由外部管理。例如，`mStore` 是组织的外部实体，移动设备也是如此。由 `mStore` 生成并安装到移动设备中的加密密钥在没有法律或其他合同义务的情况下，基本上超出了组织的控制范围。此外，移动设备使用的证书由
    `CA[1]` 颁发，这是另一个外部实体。同样，Web 应用程序使用的证书由 `CA[2]` 颁发，是另一个外部实体。Web 应用程序使用移动设备可识别的商业发行证书；移动设备并不一定能够信任来自私有
    CA（例如 `CA[3]` 或 `CA[4]`）的证书。


    同一组织内的不同小组可能管理不同的密钥。例如，两个内部证书机构（例如 `CA[3]` 和 `CA[4]`）可能由企业公钥基础设施 (`PKI`) 组管理。或者，这两个证书机构可能由不同的小组管理；内部
    `CA[3]` 可能由企业 `PKI` 组管理，而 `CA[4]` 可能专门用于另一个小组的 `KM` 服务器。`SSH` 管理员密钥可能由另一个小组管理，例如系统管理员。`DBE`
    密钥可能由数据库管理员管理。因此，组织内部可能有多个小组管理各种密钥，但希望符合企业政策和标准。


    ### 9.2 EMV 支付卡


    EMV® 是三个卡支付品牌的缩写：EuroPay、MasterCard 和 Visa (EMV)，涵盖了支付技术。Mastercard 在 2002 年与
    Europay 合并成为一家私有股份公司，但 EMV 的名称和 EMVCo 公司继续运营。EMV® 技术涵盖了多种支付相关方法，包括集成芯片 (`ICC`)
    接触和非接触规范、其移动规范、令牌支付规范、二维码规范以及其三域 (3-D) 安全规范。


    EMV 智能卡 (`ICC`) 支付卡是传统磁条 (`magstripe`) 支付卡的替代方案。EMV 支付“芯片和密码”卡规范早在 1994 年就可用，但由于几个原因，全球采用缓慢。首先，缺乏智能卡基础设施；销售点
    (`POS`) 终端和自动取款机 (`ATMs`) 只有磁条读取器。其次，更换传统 `POS`、`ATM` 和 `magstripe` 卡的成本是另一个必须克服的障碍。因此，发行了具有传统
    `magstripe` 和 `ICC` 的混合卡。[图 9.2] 展示了由发卡行、持卡人、商户、收单行和网络组成的混合支付卡生态系统的安全性和加密技术。


    发卡行（通常是金融机构）向持卡人发送支付卡。持卡人在商户处使用密码使用卡片。对于在线授权，商户将授权请求消息发送给收单行（商户的金融机构）。收单行将请求转发给支付网络。网络将请求路由到发卡行。发卡行检查持卡人配置文件，并向网络、收单行和商户返回授权响应消息。在线密码验证遵循以下步骤。


