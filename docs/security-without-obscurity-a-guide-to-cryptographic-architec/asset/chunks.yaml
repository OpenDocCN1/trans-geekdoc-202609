    such as .au for Australia, .jp for Japan, .ru for Russian Federation, and .us
    for United States. ISO also offers an Online Browsing Platform[^(\*)](#part0009.html#fn4_1).


    ![](images/00046.jpeg)


    Figure 4.1   DNS example.


    The second-level domain name (e.g., [www.example.com](http://www.example.com))
    is separated from the TLD by a period, with an unlimited number of lower levels
    (e.g., third level, fourth level) likewise separated by periods. The prefix www
    denotes a World Wide Web server, whereas ftp is a file transfer protocol server
    and mail is for an email server. The Internet Corporation for Assigned Names and
    Numbers[^†](#part0009.html#fn4_2) manages the TLD and many other unique identifiers.
    [Figure 4.1](#part0009.html#fig4_1) gives a two simplistic DNS examples: a successful
    lookup and a failure. For the first example, the server Bob connects to the server
    Alice using the name [www.example.com](http://www.example.com). Bob submits the
    name to a DNS server which may communicate to other DNS services, and the translated
    IPv4 address 198.51.100.0 is returned to Bob allowing a connection to Alice. For
    the second example, Bob gets an error for the name [bob.net](http://bob.net) so
    without an IP address the connection fails.


    However, if any of the DNS RRs are counterfeit, Alice might connect to the wrong
    server (not Bob) but be unaware of the dishonest connection. There are three basic
    DNS protocol attacks \[[50](#part0016.html#ref_50)\]. DNS cache poisoning is where
    the wrong record information is injected onto a DNS server. DNS spoofing is when
    an illegitimate server intercepts a valid DNS request and returns an invalid DNS
    response. DNS ID hacking is when an illegitimate server masquerades as a legitimate
    DNS server and provides inaccurate RRs. Domain Name System Security (DNSSEC) is
    an authentication scheme designed to mitigate these types of DNS attacks.


    [Figure 4.2](#part0009.html#fig4_2) provides an overview of DNSSEC cryptography.
    DNSSEC uses Public Key cryptography to sign and authentication RRs but does not
    use Public Key infrastructure (PKI) or digital certificates. See [Chapter 2](#part0007.html#ch02)
    for digital signatures and [Chapter 3](#part0008.html#ch03) for digital certificates
    and PKI considerations. Rather, the Public Keys are stored in DNSKEY RRs, and
    the corresponding private keys are stored by the authoritative DNS signers. The
    digital signatures are stored in RRSIG RRs. The digest (hash) of the DNSKEY RRs
    is stored in DS RRs. Further, DNSSEC does not provide confidentiality.


    ![](images/00047.jpeg)


    Figure 4.2   DNSSEC cryptography.


    ![](images/00002.jpeg)The Domain Name System Key (DNSKEY) RR includes Owner Name,
    Algorithm identifier, and the Public Key value. The Public Key is Base64 encoded.
    RFC 4034 \[[49](#part0016.html#ref_49)\] mandates Rivest–Shamir–Adleman (RSA)
    digital signatures with Secure Hash Algorithm (SHA-1) hash and includes the Digital
    Signature Algorithm (DSA) with SHA-1, but the Message Digest 5 (MD5) hash is no
    longer recommended.


    ![](images/00002.jpeg)The Resource Records Signature (RRSIG) RR includes Owner
    Name, Algorithm identifier, a Labels field to help resolve the key Owner Name,
    Signature Expiration and Signature Inception validity dates with a ±68-year limit,
    a Key Tag which provides a mechanism for selecting a Public Key efficiently, the
    Signer’s Name, and the Signature over various RRSIG fields.


    ![](images/00002.jpeg)The DS RR includes Owner Name, a Key Tag, Algorithm identifier,
    a Digest (hash) identifier, and a Digest of the DNSKEY RR.


    The requesting server (e.g., Bob) is essentially a relying DNS verifier to verify
    the hash (Digest) of the Public Key which is then used to verify the signature.
    The DS record is accessed to find the DNSKEY record, and the Digest (hash) in
    the DS record is used to verify the Public Key in the DNSKEY record. In lieu of
    a PKI and digital certificates, the hash of the Public Key is stored in a separate
    record than the Public Key itself, thus arguably the dual records are akin to
    separate accounting ledgers, the legitimacy of one ledger provides legitimacy
    of another. Next, the Public Key has been verified, the DNSKEY record is used
    to find the RRSIG record, and the Public Key in the DNSKEY record is used to verify
    the signature in the RRSIG record. Once the signature has been verified, the content
    of the RRSIG record can then be trusted.


    The requesting server (e.g., Bob) does not have the target server’s (e.g., Alice)
    Public Key until the DNS responds with the appropriate DNSSEC records. Thus, Alice
    and Bob do not need to establish any keys directly. Further, Bob does not need
    any keys of her own. And, because DNSSEC does not use digital certificates, Bob
    does not have a certificate chain to validate, but does need to verify each Public
    Key and signature within the DNS RRs. The legitimacy of the RRSIG record depends
    on the digital signature provided by the authoritative DNS signer (Bob) and the
    controls Bob maintains over the corresponding private key. The legitimacy of the
    DNSKEY record depends on the validity of the Public Key based on the Digest (hash)
    provided in the DS record. However, there is no central authority (e.g., PKI)
    vouching for the trustworthiness of the DS records. See [Figure 4.3](#part0009.html#fig4_3)
    for a cryptographic architecture perspective of DNSSEC and the corresponding DNS
    records.


    Alice is the asymmetric key owner. She provides to DNS her public in a DNSKEY
    record, the hash of her Public Key in a DS record, and a digital signature using
    her private key in a RRSIG record. Bob is the relying party (RP). He retrieves
    the records from DNS, verifies Alice Public Key in the DNSKEY record using the
    hash in the DS record, verifies Alice’s digital signature in the RRSIG record
    using her Public Key, and consequently verifies the RRSIG content based on the
    signature verification. Bob can then access Alice’s Internet site using the DNS
    records protected by Alice’s hash, Public Key, and digital signature.


    ![](images/00048.jpeg)


    Figure 4.3   DNS cryptographic architecture.


    ### [4.2 Domain Keys Identified Mail (DKIM)](#part0003.html#Rsec4_2)


    Domain Keys Identified Mail (DKIM) is an authentication scheme that enables validation
    of email messages from one organization to another using digital signatures. The
    signer might be the individual email sender, the sender’s desktop agent, the organization
    email system, or an intermediary email transfer system. Further, the verifier
    might be the individual email receiver, the receiver’s desktop agent, the organization
    email system, or an intermediary transfer email system. According to RFC 6376
    \[[51](#part0016.html#ref_51)\], the reputation of the signer is the basis for
    evaluating whether to trust the email message. See [Figure 4.4](#part0009.html#fig4_4)
    for a cryptographic architecture perspective of DKIM and the associated DNS records.'
