    Web 服务器和 BP 服务器。


    `Figure 6.1` 提供了应用流程视图。请求由 Web 服务器或 BP 服务器接收，并在通过身份验证后，传递给 `App` 服务器进行处理。`App`
    服务器从 `DB` 服务器获取用户配置。某些请求处理过程将更新 `DB`。响应从 `App` 服务器返回到网络请求源（即 Web 服务器或 BP 服务器），然后返回到原始请求源（即外部
    `BA` 或个人浏览器）。从安全的角度来看，`Figure 6.1` 包含了：


