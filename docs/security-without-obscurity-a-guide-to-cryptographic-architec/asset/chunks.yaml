- fmt: "\nSome security policies address revocation in the unlikely event of a key\
    \ compromise; however, there are many legitimate business and operational reasons\
    \ to prematurely terminate a cryptographic key. For example, when an employee\
    \ quits or is terminated, any cryptographic keys provisioned by the employer need\
    \ to be revoked; deactivating employee accounts is necessary but insufficient\
    \ as keys might be reused by attackers. As another example, `TLS` keys issued\
    \ to an online web service need to be revoked when the service is decommissioned.\
    \ A regrettable scenario is revoking cryptographic keys for deceased customers.\n\
    \n### Key Termination\n`Key Termination` is the expected expiration key. As noted,\
    \ all keys need to have an expiration date; keys cannot be used forever. Unfortunately,\
    \ it is not uncommon for a security professional to discover keys that have been\
    \ in use for decades or longer. Probably, the most well-known expiration dates\
    \ are the `not-before` and `not-after` validity dates in digital certificates\
    \ [[13](#part0016.html#ref_13)]\\] for the public key; see Annex: X.509 Certificate\
    \ Quick Reference for an overview of a digital certificate. A common presumption\
    \ is that the certificate validity dates equally apply to the corresponding private\
    \ key, but this is not necessarily the case. For example, the public key used\
    \ to verify a digital signature might have a longer lifecycle than the private\
    \ key used to generate the digital signature. Case in point, consider a code signing\
    \ certificate. The signature on the software is often considered valid if the\
    \ signature date precedes the certificate `not-after` validity date even after\
    \ the certificate has expired. The related risk is that the system clock can be\
    \ adjusted to an earlier time to reflect an earlier software signature.\n\nWhen\
    \ symmetric keys or asymmetric private keys expire, the correct practice is to\
    \ destroy all copies to prevent misuse. Data can no longer be encrypted using\
    \ an expired key, and data previously encrypted cannot decrypted. Digital signatures\
    \ can no longer be generated using an expired private key. However, digital signatures\
    \ might still be verified as every copy of the public key certificate might not\
    \ be accounted for since certificates are public. The risks related to key termination\
    \ are overlooking an expired key. Further, there might be business or operational\
    \ requirements to retain keys past their operational lifecycle when used for authentication\
    \ and integrity such as `MAC`, `HMAC`, or digital signatures.\n\n### Key Archive\n\
    `Key Archive` is when keys are retained past their operational lifecycle. Archived\
    \ keys cannot be allowed to exist in a production environment, otherwise they\
    \ might be misused. Rather, archived keys are stored in an isolated environment\
    \ and only used to verify older cryptographically protected data (e.g., `HAC`,\
    \ `HMAC`, digital signatures) for such incidents as fraud investigations, subpoenas,\
    \ lawsuits, or other legal disputes. Private keys used for digital signatures\
    \ should never be archived to avoid any possibility of counterfeit signatures.\
    \ In practice, cryptographic keys are rarely archived. The primary risk related\
    \ to archiving keys is reinstalling them into production.\n\n### 7.5 Data Management\n\
    Similar to cryptographic keys, data likewise has its own lifecycle. While there\
    \ are many data management models, [Figure 7.10](#part0012.html#fig7_10) provides\
    \ an example state transition diagram for a data lifecycle based on the key management\
    \ lifecycle discussed in this chapter. The data lifecycle stages are analogous\
    \ to the key lifecycle stages: (1) data creation, (2) data transfer, (3) data\
    \ usage with backup and recovery, (4) data deletion, and (4) data retention.\n\
    \n#### Data creation\n`Data creation` is when information is first provisioned.\
    \ For example, an account number is assigned, a password is assigned, a social\
    \ security number is allocated, a spreadsheet is saved, an email is written, a\
    \ document is posted, a tweet is typed, a card account number is created, a `PAN`\
    \ is shared with the cardholder, a `PAN` is shared with merchants, and a `PAN`\
    \ is detokenized. As discussed in [Chapter 2](#part007.html#ch02), one method\
    \ of protecting information is `detokenization`. \n\n#### Data transfer\n`Data\
    \ transfer` is when information is sent or received. Data encryption over public\
    \ networks (e.g., Internet), private networks (e.g., `MPLS`), or private connections\
    \ (e.g., `leased line`) is becoming more common. Encryption solutions such as\
    \ `TLS` and `IPsec` are discussed in [Chapter 5](#part0010.html#ch05), but as\
    \ discussed in [Chapter 3](#part0008.html#ch03) there are many management methods\
    \ available. This chapter also discusses the relative risks of the key management\
    \ lifecycle that affects cryptography.\n\n![](images/0101.jpeg)\n\nFigure 7.10\
    \ Data management.\n\nHowever, another common security controls that need to be\
    \ considered within the cryptographic architecture is monitoring of encrypted\
    \ data in transit. Enterprise monitoring was discussed in [Chapter 3](#part0008.html#ch03)\
    \ and shown again in [Figure 7.11](#part0012.html#fig7_11) with a browser connecting\
    \ to a server over `TLS`. The `TLS` connection is from the browser, over the Internet,\
    \ and to the server residing within the DMZ. The server has a `TLS` asymmetric\
    \ private and public key pair, and its certificate is shared with the browser.\
    \ The TLS asymmetric key pair is replicated to a monitoring system residing on\
    \ the enterprise network. The TLS traffic is captured within the DMZ and likewise\
    \ replicated to the monitoring system. The monitoring system can replay the TLS\
    \ handshakes, allowing it to recalculate the session keys, and decrypt traffic.\n\
    \nHowever, if ephemeral keys are used, the monitoring system cannot recalculate\
    \ the session keys, as the ephemeral keys lifespan is short and unavailable outside\
    \ the server. 3](#part0008.html#ch03), and `TLS v1.3` was discussed in [Chapter\
    \ 5](#part0010.html#ch05). `TLS v1.3` mandates ephemeral keys for forward secrecy\
    \ and deprecates `RSA` for key establishment. Based on current designs, the monitoring\
    \ system might be unable to relay the TLS handshake; monitoring systems will need\
    \ to access ephemeral keys.\n\nAnother browser-based monitoring method uses `MITM`\
    \ certificates, as shown in [Figure 7.12](#part0012.html#fig7_12). The browser\
    \ inside the enterprise network connects to a server on the Internet over `TLS`.\
    \ However, in this case, the enterprise needs to monitor the inbound traffic for\
    \ possible malware and outbound traffic for data leakage. The monitoring is done\
    \ by a proxy server residing in the DMZ which intervenes between the browser and\
    \ the server; the proxy server is also a certification authority (CA) that issues\
    \ `MITM` certificates. `MITM` certificates work with any `TLS` cipher suite including\
    \ ephemeral keys.\n"
  raw: 'Some security policies address revocation in the unlikely event of a key compromise;
    however, there are many legitimate business and operational reasons to prematurely
    terminate a cryptographic key. For example, when an employee quits or is terminated,
    any cryptographic keys provisioned by the employer need to be revoked; deactivating
    employee accounts is necessary but insufficient as keys might be reused by attackers.
    As another example, TLS keys issued to an online web service need to be revoked
    when the service is decommissioned. A regrettable scenario is revoking cryptographic
    keys for deceased customers.


    **Key Termination** is the expected expiration key. As noted, all keys need to
    have an expiration date; keys cannot be used forever. Unfortunately, it is not
    uncommon for a security professional to discover keys that have been in use for
    decades or longer. Probably, the most well-known expiration dates are the not-before
    and not-after validity dates in digital certificates \[[13](#part0016.html#ref_13)\]
    for the public key; see Annex: X.509 Certificate Quick Reference for an overview
    of a digital certificate. A common presumption is that the certificate validity
    dates equally apply to the corresponding private key, but this is not necessarily
    the case. For example, the public key used to verify a digital signature might
    have a longer lifecycle than the private key used to generate the digital signature.
    Case in point, consider a code signing certificate. The signature on the software
    is often considered valid if the signature date precedes the certificate not-after
    validity date even after the certificate has expired. The related risk is that
    the system clock can be adjusted to an earlier time to reflect an earlier software
    signature.


    When symmetric keys or asymmetric private keys expire, the correct practice is
    to destroy all copies to prevent misuse. Data can no longer be encrypted using
    an expired key, and data previously encrypted cannot decrypted. Digital signatures
    can no longer be generated using an expired private key. However, digital signatures
    might still be verified as every copy of the public key certificate might not
    be accounted for since certificates are public. The risks related to key termination
    are overlooking an expired key. Further, there might be business or operational
    requirements to retain keys past their operational lifecycle when used for authentication
    and integrity such as MAC, HMAC, or digital signatures.


    **Key Archive** is when keys are retained past their operational lifecycle. Archived
    keys cannot be allowed to exist in a production environment, otherwise they might
    be misused. Rather, archived keys are stored in an isolated environment and only
    used to verify older cryptographically protected data (e.g., HAC, HMAC, digital
    signatures) for such incidents as fraud investigations, subpoenas, lawsuits, or
    other legal disputes. Private keys used for digital signatures should never be
    archived to avoid any possibility of counterfeit signatures. In practice, cryptographic
    keys are rarely archived. The primary risk related to archiving keys is reinstalling
    them into production.


    ### [7.5 Data Management](#part0003.html#Rsec7_5)


    Similar to cryptographic keys, data likewise has its own lifecycle. While there
    are many data management models, [Figure 7.10](#part0012.html#fig7_10) provides
    an example state transition diagram for a data lifecycle based on the key management
    lifecycle discussed in this chapter. The data lifecycle stages are analogous to
    the key lifecycle stages: (1) data creation, (2) data transfer, (3) data usage
    with backup and recovery, (4) data deletion, and (4) data retention.


    **Data creation** is when information is first provisioned. For example, an account
    number is assigned, a password is generated, a social security number is allocated,
    a name is recorded, an email is typed, a tween is posted, a document is written,
    or a spreadsheet is saved. Many data elements are created by one organization
    but shared with many others. For example, when a financial institution creates
    a credit card primary account number (PAN), the PAN is shared with the cardholder,
    and the cardholder shares the PAN with hundreds or perhaps thousands of merchants
    who consequently share the PAN with their payment processor and networks. Thus,
    one data element created by a single entity might be distributed to thousands
    of others.


    As discussed in [Chapter 2](#part0007.html#ch02), one method of protecting information
    is tokenization. However, each entity in the work flow must be capable of processing
    the token versus the original data element. Otherwise, the token must be detokenized.


    **Data transfer** is when information is sent or received. Data encryption over
    public networks (e.g., Internet), private networks (e.g., Multiprotocol Label
    Switching or MPLS), or private connections (e.g., leased line) is becoming more
    common. Encryption solutions such as TLS and IPsec are discussed in [Chapter 5](#part0010.html#ch05),
    but as discussed in [Chapter 3](#part0008.html#ch03) there are many key management
    methods available. This chapter also discusses the relative risks of the key management
    lifecycle that affects cryptography.


    ![](images/00101.jpeg)


    Figure 7.10   Data management lifecycle.


    However, another common security controls that need to be considered within the
    cryptographic architecture is monitoring of encrypted data in transit. Enterprise
    monitoring was discussed in [Chapter 3](#part0008.html#ch03) and shown again in
    [Figure 7.11](#part0012.html#fig7_11) with a browser connecting to a server over
    TLS. The TLS connection is from the browser, over the Internet, and to the server
    residing within the DMZ. The server has a TLS asymmetric private and public key
    pair, and its TLS certificate is shared with the browser. The TLS asymmetric key
    pair is replicated to a monitoring system residing on the enterprise network.
    The TLS traffic is captured within the DMZ and likewise replicated to the monitoring
    system. The monitoring system can replay the TLS handshakes, allowing it to recalculate
    the session keys, and decrypt traffic.


    However, if ephemeral keys are used, the monitoring system cannot recalculate
    the session keys, as the ephemeral keys lifespan is short and unavailable outside
    the server. Ephemeral keys were discussed in [Chapter 3](#part0008.html#ch03),
    and TLS v1.3 was discussed in [Chapter 5](#part0010.html#ch05). TLS v1.3 mandates
    ephemeral keys for forward secrecy and deprecates RSA for key establishment. Based
    on current designs, the monitoring system might be unable to relay the TLS handshake;
    monitoring systems will need to access ephemeral keys.


    Another browser-based monitoring method uses MITM certificates, as shown in [Figure
    7.12](#part0012.html#fig7_12). The browser inside the enterprise network connects
    to a server on the Internet over TLS. However, in this case, the enterprise needs
    to monitor the inbound traffic for possible malware and outbound traffic for data
    leakage. The monitoring is done by a proxy server residing in the DMZ which intervenes
    between the browser and the server; the proxy server is also a certification authority
    (CA) that issues MITM certificates. MITM certificates work with any TLS cipher
    suite including ephemeral keys.'
