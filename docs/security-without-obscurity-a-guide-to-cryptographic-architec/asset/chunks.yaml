    Name, Algorithm identifier, and the Public Key value. The Public Key is Base64
    encoded. RFC 4034 [[49](#part0016.html#ref_49)]\] mandates Rivest–Shamir–Adleman
    (`RSA`) digital signatures with Secure Hash Algorithm (`SHA-1`) hash and includes
    the Digital Signature Algorithm (`DSA`) with `SHA-1`, but the Message Digest 5
    (`MD5`) hash is no longer recommended.


