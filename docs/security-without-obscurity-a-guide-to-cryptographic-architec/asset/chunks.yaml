    ### [5.2 Internet Protocol Security (IPsec)](#part0003.html#Rsec5_2)


    Internet Protocol Security (IPsec) \[[64](#part0016.html#ref_64)\] is an encryption
    and authentication protocol for the Internet Protocol (IPv4 and IPv5) data packets.
    IPsec offers two independent security mechanisms: the Encapsulating Security Payload
    (ESP) \[[66](#part0016.html#ref_66)\] provides data packet confidentiality and
    optionally integrity, and the Authentication Header (AH) \[[65](#part0016.html#ref_65)\]
    provides data packet integrity and authenticity. AH is not an authentication protocol;
    it does not authenticate an individual, application, system, or device; rather
    it provides protection of the data packet within the IPsec protocol. [Figure 5.2](#part0010.html#fig5_2)
    shows how the AH is created and used with IP headers.


    The AH is first inserted between the IP header(s) and the Transport Control Protocol
    (TCP) header with the Integrity Check Value (ICV) set to null (binary zeroes),
    and then an HMAC using an HMAC key is computed over the following elements: the
    IP header(s), the AH (with ICV = 0), the TCP header, and the data payload. The
    ICV field is then updated with the HMAC value. The receiver recomputes the HMAC
    in a similar matter to verify the integrity of the IP packet, and arguably, if
    only the sender and receiver have the HMAC key then the receiver can authenticate
    the sender. Conversely, the ESP offers integrity with encryption; [Figure 5.3](#part0010.html#fig5_3)
    shows how the ESP is created and used with IP headers.


    The ESP header is inserted between the IP header(s) and the TCP header, the ESP
    trailer is appended after the data payload, and if the ESP ICV is used it is further
    appended after the ESP trailer. An HMAC using an HMAC key is computed over the
    following elements: the ESP header, the cleartext TCP header, the cleartext data
    payload, and the cleartext ESP trailer. The ESP ICV is updated with the HMAC value.
    For confidentiality, the following elements are encrypted using an encryption
    key: the TCP header, the data payload, the ESP trailer. Regardless of whether
    ESP or AH or both are used, [Figure 5.4](#part0010.html#fig5_4) shows IPsec from
    a cryptographic architecture perspective.


    ![](images/00060.jpeg)


    Figure 5.2   IPsec AH.


    ![](images/00061.jpeg)


    Figure 5.3   IPsec ESP.


    For an IPsec connection between Alice and Bob, each party exchanges PKs (or preferably
    X.509 certificates. Thus, Alice has its public and private transport keys, and
    Bob’s PK (or certificate), and Bob has its public and private transport keys,
    and Alice’s PK (or certificate). The IPsec transport keys are used with the Internet
    Key Exchange protocol to establish two encryption keys and two HMAC keys. Alice
    uses the first SK pair (encryption, HMAC) to send IP packets to Bob, and Bob uses
    the second SK pair to send IP packets to Alice. Conversely, Alice uses the second
    SKs to receive IP packets from Bob, and likewise Bob uses the first SK pair to
    receive IP packets from Alice.


    ### [5.3 Secure Shell (SSH)](#part0003.html#Rsec5_3)


    Secure Shell (SSH) is a protocol for remote login and other network services over
    an insecure network. The protocol is described in four parts: architecture per
    RFC 4251 \[[67](#part0016.html#ref_67)\], authentication per RFC 4252 \[[68](#part0016.html#ref_68)\],
    transport per RFC 4253 \[[69](#part0016.html#ref_69)\], and connection per RFC
    4254 \[[70](#part0016.html#ref_70)\]. While SSH offers password- and signature-based
    authentication, it is primarily an encryption protocol to protect administrative
    commands between an SSH client and SSH host. The transport protocol defines the
    encryption and key management, and the authentication protocol defines digital
    signatures. [Figure 5.5](#part0010.html#fig5_5) shows both the SSH cryptographic
    architecture.


    ![](images/00062.jpeg)


    Figure 5.4   IPsec cryptographic architecture.


    Each SSH packet is composed of five elements: packet length, padding length, payload,
    padding, and HMAC. SSH integrity consists of an HMAC computed over the cleartext
    of the first four elements (packet length, padding length, payload, and padding).
    SSH encryption consists of encrypting the same four elements after the HMAC has
    been computed. The HMAC key and the encryption key are derived from a shared secret
    computed using the DH key agreement scheme. Thus, from a cryptographic architecture
    perspective, the SSH client and the SSH host have the following keys:'
