    # HTTPS 与 MITM 拦截


    从浏览器到服务器的 HTTPS 调用被重定向到代理服务器，该服务器拦截服务器的 TLS 证书。代理 CA 通过复制 TLS 证书、将服务器公钥替换为代理公钥，并使用代理
    CA 密钥对 MITM 证书进行签名，颁发 MITM 证书。浏览器识别代理 CA，因此使用 MITM 证书与代理建立 TLS 连接。代理使用 TLS 证书与服务器建立
    TLS 连接。服务器认为代理是浏览器，因此代理充当 TLS 客户端。浏览器认为代理是服务器，因此代理也充当 TLS 服务器。MITM 证书保留了服务器的主体名称（subject
    name），因此浏览器不会产生名称不匹配；然而，服务器并不知道已经以其名义使用伪造公钥发了一个 MITM 证书。


    ![](img/00102.jpeg)

    图 7.11 企业监控。


    ![](img/00103.jpeg)

    图 7.12 MITM 监控。


    # 数据使用与监控


    `Data usage`（数据使用）是指信息被存储并随后被读取或写入。读取访问和写入访问是基本的访问控制机制。针对网络、系统、应用程序、数据库和其他非易失性存储设备的逻辑访问控制限制了授权用户和管理员访问数据。然而，如果访问控制可以被绕过或欺骗，信息可能会泄露给未经授权的攻击者。绕过包括对存储设备的物理访问，这避开了网络控制。本地控制台访问可能会绕过系统、应用程序或数据库访问控制。身份盗窃、密码破解、伪凭据、社会工程和系统攻击可以欺骗访问控制。因此，数据监控和数据库加密已演变为信息安全控制。


    `Data monitoring`（数据监控）在系统、文件、记录或字段级别观察信息对象的各种类型访问。监控工具通常不验证或授权访问，而是将操作与`security
    policy`（安全策略）进行对比。例如，如果个人具有读取权限，但管理员启用了写入权限，监控系统将触发报警。另一个例子是，如果通过违反安全策略意外协议或端口访问数据库，监控系统将触发另一个报警。


    # 数据库加密


    `Database encryption`（数据库加密）使信息在磁盘上保持加密状态，仅在需要时在内存中进行解密。加密可以在数据库表、数据库列、系统文件、记录或字段级别进行管理。数据库加密的密钥管理方法在第
    3 章中讨论。如果访问控制被绕过或物理磁盘被盗，信息是加密的，理论上是不可访问的。当然，如果有足够的时间和资源，任何加密密钥都可能被破解。


    # 数据删除与保留


    `Data deletion`（数据删除）是指从存储器中擦除信息。然而，与所有所有实例加密密钥不同，数据删除可能分阶段进行。在一个系统中过期的信息在另一个系统中可能没有相同的过期时间。备份副本有时作为数据保留的一部分被保留。另一个考虑是信息位于云端的情况。第三方数据删除通常很难管理、验证和审计。通常第三方服务提供商（包括云提供商）不允许对存储系统进行审计。


    另一个误区是加密数据可以通过简单销毁加密密钥来逻辑逻辑删除；然而，这种情况现在已不再适用。正如在数据使用中提到的，如果有足够的时间和资源，任何加密密钥都可能被破解。如果数据的价值持续超过破解密钥所需的时间，那么详尽的密钥攻击总是可行的。


    `Data retention`（数据保留）用于长期信息存储。正如数据删除中提到的，备份副本有时为了数据保留而被保留。数据保留因行业（如医疗保健与金融服务）、业务类型（如汽车贷款与抵押贷款）或公司政策而异。然而，如果保留期超过密钥寿命，则需要对加密进行转换
    [94]\]，可能从一个密钥转换为另一个密钥、更长的密钥，甚至是另一种算法。


    例如，1980 年使用`RSA 512-bit`密钥签署的文档在 1990 年将是不安全的，而 1990 年使用的`RSA 1024-bit`密钥在 2010
    年也被认为是不安全的。保留证据链的正确方法是通过重新对已签名文档进行签名来保留每个签名，如图 7.13 所示。使用 `RSA-512` 密钥签名的原始文档随后使用
    `RSA-1024` 密钥签名，再次使用 `RSA-2048` 密钥签名，最终使用 `ECDSA` 签名。


