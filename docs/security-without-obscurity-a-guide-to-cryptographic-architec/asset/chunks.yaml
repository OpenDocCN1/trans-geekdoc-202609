    ![](images/00002.jpeg)`CA` is an entity trusted to issue and revoke certificates
    and depends on an `RA` to authenticate and authorize the subject. The `CA` maintains
    information security controls over its systems and personnel such that only authorized
    processes or individuals have access to data and organizational resources.


    ![](images/00002.jpeg)`Relying Party` is the entity who uses the subject certificate
    and therefore depends on the `RA` to authenticate and authorize the subject, depends
    on the `CA` to issue and revoke certificates, and depends on the subject to securely
    manage its corresponding private key.


    If each PKI participant performs to expectations, especially if the subject securely
    manages its private key and the relying party performs certificate validation,
    then the subject’s digital signature can cryptographically and operationally provide
    non-repudiation. Legal controls include two primary areas: dispute resolution
    and chain of evidence. The American Bar Association[^(\*)](#part0007.html#fn2_5)
    published the Digital Signature Guideline (`DSG`) \[[14](#part0016.html#ref_14)\]
    and the PKI Assurance Guideline (`PAG`) \[[15](#part0016.html#ref_15)\] which
    define non-repudiation not as an automatic result of technical mechanisms, but
    as a property that can only be determined after recourse to available dispute
    mechanisms such as a court or arbitrator. The `PAG` also discusses how the proponent
    of evidence produced by a digitally signed transaction or communication might
    seek its admission at trial or another proceeding under established rules of evidence.
    Basically, all of the cryptographic and operational controls need to be provable
    to an independent third party.


    One method for assuring the `RA` and `CA` are operating according to industry
    standards is an independent audit conducted by an information security professional.
    The evaluation criteria for such audits are demonstrated by the `Webtrust for
    CA` \[[17](#part0016.html#ref_17)\] which is recognized by many `CA` and browser
    manufacturers who are members of the `CA/Browser Forum`.[^(\*)](#part0007.html#fn2_6)
    The original `Webtrust for CA` `v1.0` was based on `X9.79` \[[19](#part0016.html#ref_19)\]
    which was later internationalized as `ISO 21188` \[[20](#part0016.html#ref_20)\].
    Further, the former `PKI Forum`, now incorporated into the `Organization for the
    Advancement of Structured Information Standards Identity and Trusted Infrastructure`[^†](#part0007.html#fn2_7)
    (`IDtrust`) section, also endorsed the `Webtrust` audit in its `CA Trust` \[[18](#part0016.html#ref_18)\]
    white paper. The `Webtrust for CA` `v2.0` audit criteria is currently organized
    into seven areas:


    1. `CA Business Practices Disclosures`, which are expected to be documented in
    the `CA` certificate policy or certificate practices statement.

    2. `CA Business Practices Management`, which are effective controls to provide
    reasonable assurance that the `CA` operates according to its certificate policy
    or practices statement.

    3. `CA Environmental Controls`, which are controls addressing assets, personnel,
    physical and logical access controls, development, maintenance, monitoring, and
    security logs.

    4. `CA Key Life Cycle Management Controls`, which address key generation, key
    storage, key backup and recovery, public key distribution, key usage, key archival,
    key destruction, key compromise, cryptographic hardware security modules, and
    key escrow.

    5. `Subscriber Key Lifecycle Management Controls`, which address `CA` services
    provided to subscribers for managing users’ cryptographic keys.

    6. `Certificate Lifecycle Management Controls`, addressing subscriber registration,
    certificate renewal, certificate rekey, certificate issuance, certificate distribution,
    certificate revocation, certificate suspension, and certificate validation. Regarding
    subscriber registration, refer to `EV` certificate \[[16](#part0016.html#ref_16)\]
    historical origin discussed previously.

    7. `Subordinate CA Certificate Lifecycle Management Controls`, addressing controls
    over one or more subordinate `CA` operating within the hierarchy of a `PKI`.


    Each of these areas includes control objectives for measuring compliance and illustrative
    controls as examples, but the `Webtrust for CA` is neither prescriptive nor proscriptive
    relative to technology or solutions. Likewise, industry standards \[[20](#part0016.html#ref_20)\]
    define requirements but do not specify technology. Thus, the reader is provided
    guidance but not the particulars specifications. For a more thorough discussion
    of `PKI` operations, refer to `Ref.` \[[5](#part0016.html#ref_5)\], and for a
    description of these areas relative to this book, refer to [Chapter 7](#part0012.html#ch07).


    One last note on digital signatures versus electronic signatures is as follows:
    the `Electronic Signatures in Global and National Commerce Act`[^(\*)](#part0007.html#fn2_8)
    (`ESIGN`) of 2000 \[[21](#part0016.html#ref_21)\] defines an electronic signature
    as an electronic sound, symbol, or process, attached to or logically associated
    with a contract or other record and executed or adopted by a person with the intent
    to sign the record. Thus, since a digital signature is a cryptographic process
    representing the intent to sign a record, it is suitable for an electronic signature.
    However, without the cryptographic, operational, and legal controls, an electronic
    signature cannot provide non-repudiation services as described in the `DSG` and
    the `PAG`.


    ### 2.5 Tokenization


    Tokenization is the process for substituting sensitive data with benign data.
    Exactly what constitutes sensitive data, also called the underlying sensitive
    value (`USV`), is relative to the business application. Generally for payment
    applications, the account number is sensitive.


    For example, the `Payment Card Data Security Standard` (`PCI DSS`) Tokenization
    Guidelines \[[26](#part0016.html#ref_26)\] offer an application-specific description:
    *Tokenization is a process by which the primary account number (PAN) is replaced
    with a surrogate value called a “token.” Detokenization is the reverse process
    of redeeming a token for its associated PAN value. The security of an individual
    token relies predominantly on the infeasibility of determining the original PAN
    knowing only the surrogate value*.


    Euapay-MasterCard-Visa (`EMV`) Payment Tokenization Specification \[[27](#part0016.html#ref_27)\]
    offers a similar description: *Payment Tokens are surrogate values that replace
    the PAN in the payments ecosystem. Payment Tokens may be used to originate payment
    transactions, whereas non-Payment Tokens may be used for ancillary processes,
    such as loyalty tracking.*


    For health care, the patient’s name or diagnostic codes might be deemed sensitive.
    Regarding privacy, any personally identifiable information such as a mailing address
    or `SSN` might be considered sensitive (`USV`) data that needs protection.


    What comprises benign data depends on the tokenization method. `X9.119-1` \[[22](#part0016.html#ref_22)\]
    defines requirements for protecting sensitive payment card data using encryption
    methods, whereas `X9.119-2` \[[23](#part0016.html#ref_23)\] addresses tokenization
    methods. `X9.119-2` offers a similar tokenization definition: *the process of
    mapping a plaintext value (i.e., the USV) to an existing or newly generated surrogate
    value (i.e., a token)* and identifies four tokenization methods.

