  raw: 'Alice sends an email to Bob. The signer adds the DKIM header to the message
    which contains the digital signature, reference to an DNS RR, a list of which
    message elements were hashed for the signature, and other related DKIM information.
    In this example, Header 2 and the Body text were hashed for the signature; thus
    Header 1 and Header 3 have not been signed. The DNS record contains the signer’s
    Public Key such that the verifier can use the Public Key to verify the digital
    signature in the DKIM header. The signer generates the digital signature using
    the corresponding private key.


    A common DKIM implementation is for the signer and verifier to be an organization
    email system. Alice sends the email from her workstation and her organization
    email system signs the message. Bob’s organization email system verifies the signature
    and delivers Alice’s message to Bob’s workstation. Neither Alice nor Bob needs
    cryptographic keys. Alice’s organizational email system manages a private key
    and provides its corresponding Public Key in a DNS RR. Bob’s organizational email
    system does not manage cryptography keys, rather Alice’s Public Key is obtained
    from the DNS record referenced in the DKIM header.


    ![](images/00049.jpeg)


    Figure 4.4   DKIM cryptographic architecture.


    ### [4.3 Security Assertion Markup Language (SAML)](#part0003.html#Rsec4_3)


    Security Assertion Markup Language (SAML) is an authentication and authorization
    scheme developed by the Organization for the Advancement of Structured Information
    Standards (OASIS) Security Services[^(\*)](#part0009.html#fn4_3) Technical Committee
    \[[52](#part0016.html#ref_52)\]. The scheme also supports confidentiality. SAML
    is an Extensible Markup Language (XML)-based \[[53](#part0016.html#ref_53)\] framework
    for communicating authentication, entitlement, and attribute information. [Figure
    4.5](#part0009.html#fig4_5) provides a high-level overview of SAML. There are
    many logical entities within the SAML framework but for the purposes of this book
    only three are introduced: the SAML user, the SAML-enabled service provider (SP),
    and the SAML identity provider (IdP). The SAML framework supports many scenarios
    which can be described by the message path.


    One scenario is a simple user access to an SAML-enabled SP where the SP gets the
    SAML token from the IdP, path = (1, 2, 2, 1).


    Path (1) the user requests access to an SAML-enabled SP. The access request typically
    incudes the user’s identity (e.g., name) and authentication credentials (e.g.,
    password, digital signature, mobile device information).


    Path (2) the SP sends an SAML request to the SAML IdP. The SAML request includes
    the user identity and authentication requests.


    Path (2) the SAML IdP returns an SAML response (also called the SAML token) to
    the SP. The SAML response includes the user authentication validation information
    and authorization attributes.


    Path (1) the SP allows (or denies) user access based on the authentication validation
    information and authorization attributes in the SAML token.


    A similar scenario is user access to an SAML-enabled SP where the SP redirects
    the user to the IdP to get an SAML token, path = (1, 2a, 2b, 1).


    Path (1) the user requests access to an SAML-enabled SP. The access request typically
    incudes the user’s identity (e.g., name) without authentication credentials.


    ![](images/00050.jpeg)


    Figure 4.5   SAML overview.


    Path (2a) the SAML-enabled SP redirects the user request as an SAML request to
    the SAML IdP. The SAML request only includes the user identity such that the IdP
    engages the user to provide authentication credentials (e.g., password, digital
    signature, mobile device information).


    Path (2b) the SAML IdP returns an SAML response (token) to the user. The SAML
    token includes the user authentication validation information and authorization
    attributes.


    Path (1) the SP allows (or denies) user access based on the authentication validation
    information and authorization attributes in the SAML token.


    Another scenario is when a user gets the SAML token from the IdP before accessing
    the SAML-enabled SP, path = (2a, 2b, 1, 1).


    Path (2a) the user sends an SAML request to the SAML IdP. The SAML request includes
    the user’s identity (e.g., name) and authentication credentials (e.g., password,
    digital signature, mobile device information).


    Path (2b) the SAML IdP returns an SAML response (token) to the user. The SAML
    token includes the user authentication validation information and authorization
    attributes.


    Path (1) the user requests access to an SAML-enabled SP using the SAML token.


    Path (1) the SP allows (or denies) user access based on the authentication validation
    information and authorization attributes in the SAML token.


    For the last scenario, the SP and the IdP might be the same organization where
    an SAML token is issued to a user for subsequent access. Each SAML token has a
    time to live (TTL) such that an expired token is invalid. Thus, the user would
    need to periodically refresh its SAML token. The SAML token is basically used
    as an access ticket.


    There are many other possible paths that correlate to the mapping of the SAML
    request–response message exchanges onto standard communication protocols which
    are called SAML *protocol bindings* (or just *bindings*) such as Simple Object
    Access Protocol and Hypertext Transfer Protocol (HTTP). Regardless, SAML messages
    are expected to be exchanged over a Secure Socket Layer (SSL) or Transport Layer
    Security (TLS) connection. See [Chapter 5](#part0010.html#ch05) for a discussion
    of SSL and TLS.


    [Figure 4.6](#part0009.html#fig4_6) shows an SAML cryptographic architecture for
    sending request or response messages between an SAML server (SP or IdP) and an
    RP (user or SP) depending on the scenario, over an SSL or TLS connection. The
    SAML assertions (authentication or authorization information) are digitally signed
    by the asserting party (AP) (IdP) within the SAML message (request or response).
    The SAML messages are digitally signed by the sender (IdP, SP, or user). Within
    the SSL/TLS session, the SAML messages are also encrypted and have an keyed hash
    message authentication code (HMAC) for integrity. The SSL/TLS session keys (one
    for encryption, another for HMAC) are established using an asymmetric key management
    scheme. See [Chapter 2](#part0007.html#ch02) for details on encryption or HMAC
    and [Chapter 3](#part0008.html#ch03) for details on key establishment schemes.


    ![](images/00051.jpeg)


    Figure 4.6   SAML cryptographic architecture.


    The SAML assertion signature is generated by the AP so that entity manages a private
    key and provides its certificate to the RP. The SAML message signature is generated
    by the message originator (sender) so that entity manages a private key and provides
    its certificate to the RP. The SSL/TLS connection is offered by the SAML server
    so that entity manages a private key and provides its certificate to the RP (SSL/TLS
    client). Thus, for authentication and authorization, the RP might only have Public
    Keys relative to the various certificates. If mutual TLS authentication is used,
    then the RP would also have a certificate and a private key. However, it was mentioned
    that SAML also supports confidentiality as shown in [Figure 4.7](#part0009.html#fig4_7)
    for various SAML messages.'
