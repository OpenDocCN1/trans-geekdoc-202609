  trans: '

    出现不一致或冲突的答案可能有多种原因。受访者可能在无意中提供了错误信息。或者，受访者可能故意提供虚假信息。另一种可能性是实际流程不符合记录的政策、惯例或程序。发现以下任何一种情况并不罕见：显然，第四种情况是最理想的。


    1. 流程不一致且没有记录。

    2. 流程一致但没有记录。

    3. 流程一致且有记录，但并非总是被遵守。

    4. 流程一致、有记录且被遵守。


    在事先没有可用文档的情况下，可以将问题排队并提前提交给受访者，以便其准备答案。然而，如果没有可靠的信息来作为提问依据，此类询问在性质上往往是通用的。同样，供应商提供的任何答案都可能需要保护，这通常在
    `NDA` 下进行。在这些访谈期间，可以提供文档。


    即使事先已有可用文档，访谈也可能发现某些未提供的文档。因此，如图 8.1 中的虚线所示，评估人员应该预料索要额外的文档。自然地，额外的文档可能会导致额外的访谈。文档与访谈的循环有时被认为是一个无休止的循环；然而，评估人员最终将达到收益递减点，此时无法再发现任何实质性信息。有两种基本结果：要么没有更多信息可用且情况良好，要么情况糟糕到任何进一步的访谈（或文档）都无法使情况好转。


    在访谈期间，会记录笔记。笔记应该打字字并共享，如果有多人在记录笔记，则应对它们进行合并。任何差异都需与受访者进行协调。然而，并不总是需要后续访谈，简单或容易的问题可以通过电子邮件、电话、短信或其他方法处理。但是，所有答案都需要记录。笔记会相应更新，并带有版本号或日期以指示更改。文档与受访者之间的差异应在访谈期间解决。如果问题在访谈期间无法解决，则应将其添加到问题列表中进行协调。


    在所有访谈期间会维护并更新一个问题列表。随着每个问题的解决，列表将更新并与笔记进行交叉引用。某些问题可能被认为无关并可以解决，而另一些问题可能被事件（OBE）所覆盖。例如，一个
    OBE 可能是旧版本软件的 Bug，该 Bug 已经修复。一个无关的问题可能是一个对安全没有影响的错误流程。问题列表和笔记可能在同一份或独立的文档中管理。


    笔记包括日期和时间、会议地点（如电话会议或面对面会议地点）、参会人员列表、访谈者、受访者、问题、答案、问题以及相关文档列表。解决方案与问题列表进行交叉引用。笔记和问题列表可能在同一份或独立的文档中管理。


    在访谈期间，由一名访谈员主导讨论。过多的参与者试图与受访者互动会导致混乱。访谈可以由较小的访谈员小组进行，但必须由一个人主导。单个受访者为优，但通常会组建小团队来涵盖各个主题。同样，必须由一个人主导受访过程，将问题引导给合适的人。此外，访谈通常有观察者，但同样必须有一人担任首席访谈员。无论如何，过多的参与者会增加干扰，无论是背景噪音、私下对话还是中断。参与人数应保持在最低，以减少复杂性。


    ### 8.3 测试


    测试可以是一种重要的评估技术，用于在正常处理未触发事件时验证正常处理或安全控制。对于正常处理的示例，考虑当用户因忘记密码而需要重置密码的情况。测试可以通过用户访问密码重置页面并按照指示操作完成。通过电子邮件发送给用户的临时密码将用于登录系统。每个正常测试用例也需要良好的定义。需要建立配置参数，记录预期结果，记录实际结果，并捕获证据。例如，测试用例
    #12 是测试密码重置（表 8.1）。


    对于事件示例，考虑当用户输入正确密码且系统允许访问的情况。或者，在正常处理过程中没有发生处理登录尝试次数和临时密码超时的程序。可以为每种异常安排测试：超过登录尝试次数，以及在临时密码后尝试使用临时密码。每个测试都将有一个可以验证的预期结果；可能会捕捉截图或安全日志。当观察到意外的测试结果时，可能是测试配置无效、测试无效、控制错误，或者有时是控制本身无效。


    表 8.1 测试用例：密码重置


    | 测试用例 #12 密码重置 |

    | --- |

    | 1. 访问密码重置页面并点击密码重置链接 aa。输入用户名（Sam Test）和电子邮件地址 (sam.test@example.com)b. 验证系统日志和时间戳
    |

    | 2. 打开带有临时密码的邮件 a. 验证邮件时间戳 |

    | 3. 使用用户名（Sam Test）和临时密码登录 a. 验证系统访问和时间戳 |


    ![](img/00002.jpeg)如果测试配置无效，则需要修订配置并重复测试。


    ![](img/00002.jpeg)如果测试无效，则需要审查控制，修订测试配置并重复测试。


    ![](img/00002.jpeg)如果控制存在错误，则可能需要修复控制，或者需要修订文档。


    有时，控制本身可能是无效的。应用程序或系统可能无法检测事件，或者无法防止其发生。例如，政策可能规定员工绝不写下密码。然而，没有技术控制来执行此类政策。没有任何硬件或软件控制能够可行地确定员工是否将密码写在纸上。政策可能是有效的，程序性控制可能执行政策（例如员工手册中的声明和强制性培训），但没有技术控制可以进行测试。


    每个事件测试用例也需要良好的定义。同样，需要建立配置参数，记录预期结果，记录实际结果，并捕获证据。例如，测试用例 #13 测试登录尝试次数，测试用例 #14
    是测试临时密码超时（表 8.2 和 8.3）。


