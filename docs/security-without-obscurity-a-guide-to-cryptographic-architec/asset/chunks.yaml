    # Chapter 6


    ## Architectures


    Architectures define the various components and the interactions between those
    components that comprise the structure of a complete system. However, architectures
    can have more than one focus with distinct viewpoints. This chapter considers
    the similarities and differences between application architectures, network architectures,
    information architectures, and of course cryptographic architectures.


