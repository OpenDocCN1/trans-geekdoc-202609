    20 世纪 80 年代的 ATM（自动取款机）仅使用对称密钥；直到 20 世纪 90 年代，非对称密钥才出现。ATM 有两个密钥，分别称为 `A-key`
    和 `B-key`。`B-key` 被称为通信密钥，用于 PIN 加密。`A-key` 被称为终端主密钥，基本上是一个用于交换 `B-keys` 的 `KEK`（密钥密钥）。然而，此后的
    ATM 已根据支付卡行业安全标准委员会（`PCI SSC`）的指令，使用加密密码键盘（`EPP`）进行了升级。


    `PCI SSC` 由美国运通、Discover Financial Services、JCB 国际、万事达（MasterCard）和 Visa 于 2006
    年创立，旨在合作开展通用安全计划。在众多安全标准和程序之一是 `EPP 安全要求`。这些要求涵盖了设备特性（包括物理安全和逻辑安全），以及制造期间以及从制造到初始密钥加载之间的设备管理。`图
    9.8` 显示了 ATM 远程密钥加载（`RKL`）过程，以及针对三种类型交易的后续 PIN 处理：本行卡（on-us）、外地卡和外地 ATM。


    `图 9.8` 中讨论的 `RKL` 包括主机将初始加密密钥加载到由密钥管理服务（`KMS`）提供的空 `EPP` 中。`KMS` 为新所有者（主机）提供
    `EPP` 密钥文件（`EKF`），以便可以将密钥初始化到安装在各种 ATM 中的多个 `EPPs` 中。`RKL` 包括以下步骤：


    1. 主机与 `KMS` 使用多种可能的方法（包括便携式介质或电子传输）交换公密钥。或者，两个实体交换 X.509 证书。

    2. 主机与 `KMS` 交换并验证每个公密钥的哈希值，以验证公密钥的完整性。不使用证书。或者，每个实体验证另一个实体证书。

    3. `KMS` 为每个 `EPP` 生成唯一的非对称密钥，并创建一个包含 `EPP` 序列号和非对称密钥的 `EKF`。

    4. `KMS` 使用其私钥对 `EKF` 签名，并使用主机公钥对签名后的 `EKF` 进行加密。加密后的签名 `EKF` 传输到主机。

    5. 主机使用其私钥解密 `EKF` 并使用 `KMS` 公钥验证签名。

    ```

    ![](img/00114.jpeg)

    ```

    图 9.8 ATM 远程密钥加载。

    6. 主机使用 `EKF` 将每个 `EPP` 唯一的密钥加载到指定的 `EPP` 中，并将激活设备安装到各种 ATM 中以启用 PIN 加密。


    一旦每个 ATM 都拥有了激活的 `EPP`，它就可以通过 `EPP` 非对称密钥远程加载 `A-key`，然后使用 `A-key` 远程加载 `B-key`。随后
    ATM 即可接受并加密持卡者的 PIN。对于运营 ATM 的发行机构来说，有三种不同类型的交易：本行卡交易、外地卡交易和外地 ATM 交易。`图 9.8`
    显示了持卡人在发行机构（A）的 ATM 上使用卡片（A）时的本行卡交易。


    1. 主机生成一个对称 `A-key`，使用 `EPP` 公钥对其加密，并将加密后的 `A-key` 远程加载到 `EPP` 中。`EPP` 解密并安装 `A-key`
    终端主密钥。

    2. 主机生成一个对称 `B-key`，使用 `A-key` 对其加密，并将加密后的 `B-key` 远程加载到 `EPP` 中。`EPP` 解密并安装 `B-key`
    通信密钥。

    3. 持卡者将卡片（A）插入 ATM 1 并输入 PIN。

    4. ATM 使用其 PIN 加密密钥（`PEK`）加密 PIN，并将 `PAN` 和其他交易数据发送到主机系统（发行机构 A）。

    5. 主机系统识别 `PAN`，解密 PIN 进行验证，并授权持卡者完成 ATM 交易。


    `图 9.8` 还描述了持卡人在发行机构（A）的 ATM 上使用卡片（B）的外地卡交易。该交易需要由相应的发行机构（B）授权。


    1. 持卡者将卡片（B）插入 ATM 2 并输入 PIN。

    2. ATM 使用其 `PEK` 加密 PIN，并将 `PAN` 和其他交易数据发送到主机系统（发行机构 A）。

    3. 主机系统不识别 `PAN`，因此 PIN 从 ATM 密钥转换为网络密钥，并向网络发送授权请求。

    4. 网络将 PIN 从与发行机构 A 共享的密钥转换为与发行机构 B 共享的密钥，并将请求路由到发行机构 B。

    5. 发行机构 B 解密 PIN 进行验证，授权持卡者交易并返回授权响应。

    6. 网络将响应返回给发行机构 A 以完成 ATM 交易。


    `图 9.8` 进一步显示了持卡人在发行机构（B）的 ATM 上使用卡片（A）的外地 ATM 交易。该交易需要由相应的发行机构（A）授权。


    1. 持卡者将卡片（A）插入 ATM X 并输入 PIN。

    2. ATM 使用其 `PEK` 加密 PIN，并将 `PAN` 和其他交易数据发送到主机系统（发行机构 B）。

    3. 主机系统（B）不识别 `PAN`，因此 PIN 从 ATM 密钥转换为网络密钥，并向网络发送授权请求。

    4. 网络将 PIN 从与发行机构 B 共享的密钥转换为与发行机构 A 共享的密钥，并将请求路由到发行机构 A。

    5. 发行机构 A 解密 PIN 进行验证，授权持卡者交易并返回授权响应。

    6. 网络将响应返回给发行机构 B 以完成 ATM 交易。


    本节讨论的交易用于在线 PIN 验证以及密钥加载到 `EPP` 的过程。一旦非对称密钥加载到 `EPP` 中，`A-key` 和 `B-key` 就可以远程加载到
    `EPP` 中。可以使用 `A-key` 根据需要频繁交换新的 `B-keys`。同样，可以使用 `EPP` 非对称密钥根据需要交换新的 `A-keys`。非对称密钥在
    `EPP` 的整个生命周期内保持静态。


    ### 9.5 数据库加密 (DBE)


    DBE 已成为一种数据保护机制，用于防止信息未经授权的泄露。被盗的介质仅包含加密数据，如果没有数据密钥（`DEK`）则无法解密。对存储介质的未经授权访问会导致下载加密数据，而这些数据再次无法在没有密钥的情况下解密。因此，DBE
    是保护网络、服务器、数据库的深度防御方法的一种层次。然而，`DEK` 可以使用软件和硬件加密的多种方法进行。`图 9.9` 展示了一个使用加密的数据库服务器、由
    `KMS` 管理的数据库密钥以及使用 `HSM` 的 KMS 服务器。


    此外，如 `图 9.9` 所示，加密可以应用于多个级别：磁盘加密、数据库加密、表加密或列加密。

