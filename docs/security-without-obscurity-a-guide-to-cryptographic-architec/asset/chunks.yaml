    Clearly the IS controls documented by the various application diagrams need to
    be reflected in the network diagrams. Further, the information technology and
    the IS controls need to align and be represented in the network diagrams. These
    tasks are typically addressed by documentation, interviews, and analysis as discussed
    in [Chapter 8](#part0013.html#ch08). However, the end goal is to produce a cryptographic
    architecture.


    ### [6.3 Information Architecture](#part0003.html#Rsec6_3)


    Information architectures identifies what data is stored or processed, where the
    data is stored or processed. Many organizations employ a data classification scheme
    with corresponding security requirements. For example, a data classification simple
    scheme might have three levels from lowest to highest security levels.


    1.  Public data


    2.  Proprietary data


    3.  Confidential data


    **Public data** is made widely available without encryption or other access controls.
    For example, a store’s address so shoppers can find the location, a restaurant’s
    menu so people can order food, an organization’s phone number so people can call,
    or a company’s brochure so consumer can order services. However, data integrity
    and authenticity are still needed to avoid misinformation.


    **Proprietary data** is controlled to restrict accessibility to within an organization.
    For example, a store’s profit margin is private, a restaurant’s ingredients can
    be nonpublic, an organization’s technology might be intellectual property, or
    a company’s marketing plans are hush-hush. Proprietary data might be encrypted
    when transported outside the company, access controls might be sufficient when
    inside the company, but integrity and authenticity are also needed.


    **Confidential data** is restricted on a need-to-know basis. For example, a store’s
    accounting ledger is only for owners and managers, a restaurant’s recipes can
    be secret, an organization’s acquisition is covert, or a company’s undisclosed
    stock dividend is kept quiet. Confidential data might be encrypted anywhere it
    is stored, but integrity and authenticity are also needed.


    However, such a minimal classification model might be too simplistic. For example,
    identification data such as account numbers, employee identification numbers,
    or customer numbers are a special type of confidential data. As another example,
    authentication data such as personal identification numbers (PINs) or passwords
    that grant access to networks, systems, or applications are another exceptional
    type of confidential data. Cryptographic data such as symmetric keys or asymmetric
    private keys are not the same as PINs or passwords, as they require much stronger
    controls than lesser data. Consequently, the first book \[[4](#part0016.html#ref_4)\]
    in this series offered a six-level data classification example, from lowest to
    highest security level.


    1.  Public data


    2.  Proprietary data


    3.  Confidential data


    4.  Identification data


    5.  Authentication data


    6.  Cryptographic data'
