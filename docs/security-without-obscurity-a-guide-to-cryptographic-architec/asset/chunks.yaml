    Adding cryptography information to the application architecture in [Figure 6.8](#part0011.html#fig6_8)
    is meaningful and helpful to understand the cryptographic architecture. The entities
    (who) are identified, the key types (what) and purposes (why) are implied by the
    protocols (`HTTP`, `TLS`), the locations (where) are indicated, and the protocols
    (when) are provided. But not all of the connections are included, and the cryptographic
    details (how) are not captured in the improved application architecture diagram.
    However, the application team might not necessarily know the network or cryptographic
    details, so further review by the security professional is needed. Additional
    examples for network architecture are shown in [Figures 6.9](#part0011.html#fig6_9)
    and [6.10](#part0011.html#fig6_10).


    ![](images/00076.jpeg)

    Figure 6.9 Application architecture with crypto.


    ![](images/00077.jpeg)

    Figure 6.10 Network architecture for application VLAN.


    [Figure 6.9](#part0011.html#fig6_9) shows a network architecture for the application
    VLAN with cryptography information. The application VLAN in the DMZ restricts
    access to the Web and BP servers, and another application VLAN in the network
    limits access to the App and DB servers. As discussed for the DMZ application
    VLAN:


    ![](images/00002.jpeg)

    The Web servers have `TLS` keys, a private asymmetric key and a public key certificate,
    for the external `HTTPS` connection to web browsers.


    ![](images/00002.jpeg)

    The App servers have `TLS` keys, a private asymmetric key and a public key certificate,
    for the internal `TLS` connections to the Web servers and the BP servers.


    As observed for the network application VLAN:


    ![](images/00002.jpeg)

    The App servers have `TLS` keys, a private asymmetric key and a public key certificate,
    for the internal `TLS` connections to the Web servers and the BP servers.


    ![](images/00002.jpeg)

    The Web servers and the BP servers reuse their same certificates for both their
    external and internal `TLS` connections.


    Modifying network diagrams with cryptography information likewise is helpful to
    understand the cryptographic architecture. The network devices (who) are identified,
    the key types (what) and purposes (why) are implied by the protocols (`HTTP`,
    `TLS`), the locations (where) are indicated, and the protocols (when) are provided.
    However, [Figure 6.9](#part0011.html#fig6_9) does not document all of the connections;
    for a more complete viewpoint, [Figure 6.10](#part0011.html#fig6_10) needs to
    be considered.


    [Figure 6.10](#part0011.html#fig6_10) shows a network architecture for the administrative
    VLAN with cryptography information. The admin VLAN in the DMZ limits access to
    the RAS and a separate VLAN in the network restricts access to the SS and AS.
    From a network perspective,


    ![](images/00002.jpeg)

    Outside the DMZ the Internet routers have `IPsec` keys, a private asymmetric key
    and a public key certificate, for cross-connecting the East and West datacenters.


    ![](images/00002.jpeg)

    Inside the DMZ the RAS has `TLS` keys, a private asymmetric key and a public key
    certificate, for VPN access.


    ![](images/00002.jpeg)

    Inside the network the routers have `IPsec` keys, a private asymmetric key and
    a public key certificate, for synchronizing the DB servers.


    ![](images/00002.jpeg)

    Inside the network the AS has `TLS` keys, a private asymmetric key and a public
    key certificate, for connecting to the RAS inside the DMZ.


    ![](images/00002.jpeg)

    Inside the network the AS has `SSH` keys, a private asymmetric key and a public
    key certificate, for administrating other servers and network devices.


    As mentioned, updating network diagrams with cryptography information is helpful
    to understand the cryptographic architecture. The network devices (who) are identified,
    the key types (what) and purposes (why) are implied by the protocols (`HTTP`,
    `TLS`), the locations (where) are indicated, and the protocols (when) are provided.
    However, [Figures 6.10](#part0011.html#fig6_10) and [6.11](#part0011.html#fig6_11)
    together still do not address all of the cryptography information. Another viewpoint
    is adding cryptography information to the data diagram as shown in [Figure 6.12](#part0011.html#fig6_12).


    ![](images/00002.jpeg)

    The web servers have a `TLS` certificate chain and its `TLS` private key for external
    connections, along with an `SSH` public key for internal administration.


    ![](images/00002.jpeg)

    The BP servers have a `TLS` certificate chain and its `TLS` private key for external
    connections, along with an `SSH` public key for internal administration.


    ![](images/00002.jpeg)

    The RASs have a `TLS` certificate chain and its `TLS` private key for internal
    connections, along with an `SSH` public key for internal administration.


    ![](images/00002.jpeg)

    The App servers have a `TLS` certificate chain and its `TLS` private key for external
    connections, along with an `SSH` public key for internal administration.


    ![](images/00078.jpeg)

    Figure 6.11 Network architecture for admin VLAN.


    ![](images/00079.jpeg)

    Figure 6.12 Data diagram with crypto information.


    However, even this perspective only provides partial crypto info. The protocols
    (e.g., `HTTPS`, `VPN`, `IPsec`) are not documented, and the datacenter connections
    are not included. Hence, a specialized diagram should be considered for documenting
    a cryptographic architecture such as the example provided in [Figure 6.13](#part0011.html#fig6_13).
    The locations and connections shown are based on the application and network diagrams
    but consolidated to reflect cryptography information.


    For [Figure 6.13](#part0011.html#fig6_13), each of the cryptography instances
    are numbered for cross-referencing. Asymmetric key pairs for `HTTPS`, `TLS`, and
    `IPsec` are reflected by a private key and either a public key or a public key
    certificate. Asymmetric `SSH` public keys are shown for most servers and routers,
    where the `SSH` private keys reside on the AS. Asymmetric ephemeral key pairs
    and symmetric session keys are not shown as they are temporary; however, the symmetric
    DBE is included.


    ![](images/00080.jpeg)

    Figure 6.13 Cryptographic architecture.


    1. The East datacenter Internet routers have `IPsec` keys, a private asymmetric
    key and a public key certificate, for cross-connecting the West datacenter Internet
    routers.

    2. The East datacenter Internet routers have `SSH` keys for connections over the
    admin VLAN to the ASs.

    3. The West datacenter Internet routers have `IPsec` keys, a private asymmetric
