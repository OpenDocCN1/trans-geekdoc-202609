    various types of resource records (RRs) for managing Internet domain names. Basically,
    DNS translates domain names like [www.example.com](http://www.example.com) to
    an Internet Protocol (IP) address (198.51.100.0). DNS also provides reverse lookups;
    an IP address is translated to the corresponding domain name. The right-most name
