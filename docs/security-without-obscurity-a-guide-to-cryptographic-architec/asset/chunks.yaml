    compromise at any lifecycle stage.


    ![](images/00098.jpeg)


    Figure 7.8   Key management lifecycle.


    ![](images/00002.jpeg)Symmetric keys might be disclosed allowing encrypted data
    to be revealed or data to be modified or substituted.


    ![](images/00002.jpeg)Asymmetric private keys might be disclosed allowing encrypted
    cryptographic material to be revealed or creating fraudulent digital signatures.


    ![](images/00002.jpeg)Asymmetric public keys might be substituted allowing various
    man-in-the-middle (MITM) attacks. Digital signatures might be similarly substituted
    or encrypted keying material can be revealed.


    Relative risks are discussed for each key management lifecycle stage. While some
    risks are more theoretical than others, actual real-world attacks are also reviewed.
    For some case studies, the risk scenario is provided but the names are kept anonymous.


    **Key generation** occurs when the keys are created. Symmetric keys are generated
    using random number generators (RNGs) \[[86](#part0016.html#ref_86)\] and \[[89](#part0016.html#ref_89)\]
    or pseudo-random number generators (PRNGs) \[[88](#part0016.html#ref_88)\]. An
    RNG needs a good source of entropy \[[87](#part0016.html#ref_87)\], so the randomness
    is truly random. Otherwise, if the entropy source is vulnerable to outside influence,
    the symmetric key or at least some of its bits might be predictable. An attacker
    can use such predictability to reduce the possible key space for an exhaustive
    attack, such as the Return of the Coppersmith Attack identified in the Common
    Vulnerabilities and Exposure (CVE-2017-15361[^(\*)](#part0012.html#fn7_5)) notice.
    Similarly, a PRNG relies on an RNG for a random input. Alternatively, the PRNG
    might be used with the same keying material to establish the same symmetric key
    more than once or at different locations.


    Asymmetric keys are generated in pairs, the private key and the public key, and
    rely not only on random numbers but also prime number generators (PNGs) \[[90](#part0016.html#ref_90)\].
    Random numbers can be tested for primality using probabilistic testing, or prime
    number can be constructively built. However, prime numbers likewise need to be
    randomly generated. If the PNG is predictable, then an attacker can use that weakness
    to exploit asymmetric key generation schemes.


    Asymmetric public keys should be encapsulated in digital certificates \[[45](#part0016.html#ref_45)\].
    As discussed in Annex: X.509 Certificate Quick Reference, self-sign is unreliable
    and represents undue risk without additional security controls. Creating and submitting
    a Certificate Signing Request \[[91](#part0016.html#ref_91)\] to the registration
    authority (RA) of a CA is part of the key generation stage. The RA authenticates
    and authorizes the requesting submitter, the CA generates and signs the certificate,
    and the RA returns it to the requesting entity. If the RA fails to validate the
    submitter then counterfeit certificates might be issued.


    Table 7.2   Cryptographic Strengths


    ![images](images/00099.jpeg)


    Worse, if the RA does not operate with appropriate security controls, then counterfeit
    certificates can be issued, such as the DigiNotor[^(\*)](#part0012.html#fn7_6)
    or Comodo[^(\*)](#part0012.html#fn7_7) hacks. Fraudulent code signing certificates
    were issued, so attackers masqueraded as legitimate software vendors and distribute
    signed malware posing as trustworthy software.


    **Key Distribution** is necessary when keys are transported from the generation
    point to the usage point, if they differ. When keys are generated and used within
    the same device or location, the keys might not need to be distributed. Hence,
    key distribution is a conditional stage. However, key distribution includes the
    movement of symmetric, asymmetric private, and asymmetric public keys. When public
    keys are distributed using legitimate certificates (e.g., CA-signed certificates),
    the integrity and authenticity has a much higher assurance level. However, symmetric
    and asymmetric private keys require confidentiality.


    Key confidentiality for symmetric and asymmetric private keys is typically done
    using a KEK that has been previously established. The KEK might be a symmetric
    key or the recipients’ asymmetric public key. The KEK needs to have the equivalent
    or greater cryptographic strength then the key being exchange, otherwise a weak
    KEK might compromise the exchanged key. Refer to [Table 7.2](#part0012.html#tab7_2)
    for cryptographic strengths. The table is a summary of algorithms and equivalent
    key lengths from NIST \[[92](#part0016.html#ref_92)\]. NIST has calculated the
    work factor for cryptanalysis using various attacks, but instead of expressing
    the work in time since that would vary depending on the number and size of computers,
    the strength is expressed in the number of bits for an exhaustive key search.


    For example, 3DES-2K is the triple DES algorithm using two 56-bit keys (encrypt
    using DES with the first key, decrypt using DES with the second key, and then
    encrypt using DES with the first key) has 112 key bits but only 80-bit strength.
    However, AES-128 with 128 key bits has 128-bit strength. Conversely, RSA-2048
    with 2048 key bits only has 112-bit strength due to various known weaknesses and
    attacks. Consequently, RSA-2048 is sufficient to encrypt 3DES-2K since they both
    have 112-bit strength, but it is insufficient to encrypt AES-128. Hence, RSA-3072
    should be used for encrypting AES-128 keys. The table only includes the symmetric,
    asymmetric, and hash algorithms approved by NIST as others have not been publicly
    evaluated.


    For this case study, a payment processor’s HSM encountered a hardware failure
    such that the cryptographic keys were lost. The failover did not happen as expected
    because the backup HSM had likewise failed months earlier, but the operations
    team forgot to replace the unit. Backup keys stored in an offsite safe did not
    help as the hardware chips were empty. The loss of keys resulted in an interruption
    in payments processing. Consequently, keys from all the banks had to be sent to
    the payment processor over the weekend and the rush to exchange key components
    encountered many problems. Keys and key components were faxed as cleartext values,
    key components were delivered or received by single individuals, and key components
    were spread over a conference room table accessible by half-a-dozen individuals.
    The chances of a key compromise were very likely. Whether or not any fraud occurred
    due to this unpublicized incident is unclear; this particular case study occurred
    over 20 years ago.'
