  raw: 'The assessor needs to recognize when an issue becomes immaterial. If one or
    more issues represent equivalent risk then further research is irrelevant. For
    example, the original single DES algorithm employs a 56-bit key which by current
    standards is too weak, and pre-1992 restricted exportable DES to a 40-bit key.
    However, some cryptographic modules retain DES (56-bits) and exportable DES (40-bits)
    for backward compatibility. Since any use of DES is an unacceptable risk, the
    details regarding anything weaker than DES is immaterial although the risks are
    relevant and need to be factored into the analysis and summarized into the report.


    Some facts are positive while others are negative. For example, a cryptographic
    module certified per the NIST cryptographic algorithm (CAVP) and cryptographic
    module (CMVP) validation programs is a positive fact. Further, the list of FIPS-approved
    algorithms in the security policy is another positive fact. Conversely, the list
    of non-FIPS algorithm might be a negative. And if the list of non-FIPS algorithms
    includes DES and exportable DES, then these would definitely be negative facts.
    Suspicions or unsubstantiated opinions are not facts; they cannot be treated as
    such and should not be represented in the report.


    The analysis process can be arduous and is typically done using spreadsheets or
    online tools; but for smaller engagements, the draft reports might be used. For
    each factoid, a numeric score should be assigned and the associated justification
    is referenced. The score reflects the advantages versus the disadvantages using
    a range of values (e.g., using a scale of 1–10 where 10 is best and 0 is worst).
    Additionally, version control and track changes are paramount. When more than
    one assessor is involved, as is common with larger projects, keeping track of
    action items, edits, and updates is critical. Further, the assessors’ unedited
    notes and any intermediate drafts should not be shared to manage expectations.


    ### [8.5 Reporting](#part0003.html#Rsec8_5)


    Reporting is the culmination of reviewing documentation, conducting interviews,
    executing tests, and performing analysis. The enterprise might provide a template
    to the assessor, regardless of whether the assessor is external or internal, and
    insist it to be used. Alternatively, the enterprise might provide a template as
    an example that the assessor is expected to customize. Otherwise, the enterprise
    might expect the assessor to provide a report format. Regardless, the report needs
    to reflect the facts determined during the analysis phase ([Table 8.5](#part0013.html#tab8_5)).


    The sample report is organized in four sections: executive summary, report summary,
    report details, and report references. Its structure is based on the premise that
    an advantage or disadvantage can be rated as significant, important, or meaningful.
    More or fewer ratings are possible, but three are used for this example. The numerical
    scoring used in the analysis can be and should be used to determine the verbal
    rating in the report.


    ![](images/00002.jpeg)Significant advantages are those that provide the best security
    controls. For example, current algorithms with larger keys (e.g., AES-256) is
    stronger than shorter keys or older algorithms (e.g., 3DES).


    ![](images/00002.jpeg)Important advantages are those that provide better security
    controls. For example, current algorithms with shorter keys (e.g., AES-128) is
    better than older algorithms (e.g., 2K-DES or 3K-DES).


    ![](images/00002.jpeg)Meaningful advantages are those that provide good security
    controls. For example, older algorithms (e.g., 3K-DES) are acceptable than deprecated
    algorithms (e.g., DES).


    Table 8.5 Example Security Assessment Report


    | *Security Assessment Report on Product X* |


    | --- |


    | 1\. Executive Summary1.1. Significant advantages1.2. Significant disadvantages1.3.
    Significant recommendations |


    | 2\. Report Summary2.1. List of significant and important advantages2.2. List
    of significant and important disadvantages2.3. List of significant and important
    recommendations |


    | 3\. Report Details3.1. Discussion on advantages with cross-references3.2. Discussion
    on disadvantages with cross-references3.3. Discussion of associated recommendations
    |


    | 4\. Report References4.1. List of documentation4.2. List of interviews4.3. List
    of test cases |


    ![](images/00002.jpeg)Significant disadvantages are those that are the worst vulnerabilities.
    For example, storing or transmitting cleartext sensitive data.


    ![](images/00002.jpeg)Important disadvantages are those that are worse vulnerabilities.
    For example, using older cryptographic software with known bugs.


    ![](images/00002.jpeg)Meaningful disadvantages are those that are bad vulnerabilities.
    For example, using deprecated algorithms (e.g., DES).


    The executive summary includes the significant advantages and disadvantages along
    with any associated recommendations. Executive summaries are optional and not
    always needed, but some enterprise prefer them. When an executive summary is included,
    it is common to only address the more significant issues. However, identifying
    significant disadvantages without providing recommendations is an incomplete report.
    Disadvantages should either be remediated by fixes or enhancements, or alternatively
    by compensating controls. Compensating controls are additional constraints that
    can be applied to the existing product under assessment. For example, if a product
    uses a vulnerable protocol over a port address, and the protocol cannot be disabled
    within the product, the port address might be blocked to prevent access to the
    protocol. The executive summary should include a final accept or reject status.
    Note that the acceptance might be conditional based on the recommendations.


    The report summary includes the significant advantages and disadvantages along
    with the important advantages and disadvantages. If an executive summary is not
    included, then the significant advantages and disadvantages are fully spelled
    out in the report summary; however, if an executive summary is included then an
    abridged version of the significant advantages and disadvantages might be used
    in the report summary with a cross-reference to the executive summary. Regardless,
    a discussion of the recommendations for the significant and important disadvantages
    is included in the report summary. If no executive summary is provided, then the
    report summary should include a final accept or reject status. Note that acceptance
    might be conditional based on the recommendations.


    The report details include all of the significant, important, and meaningful items
    for the advantages and disadvantages. Each item is cross-referenced to the various
    documents, interviews, and test cases. Further, the report details address all
    of the associated recommendations for reconciling the disadvantages. It is likely
    that few recipients will read the whole report; often only the summaries are reviewed.
    Items considered immaterial and sufficiently inconsequential to not be rated as
    meaningful can be disregarded in the report. The analysis worksheet will include
    all of the issues and can always be examined.


    The report references list the documentation, interviews, and test cases. The
    documentation lists include the enterprise, vendor, and industry documents. Regular
    references include the document name, authors (if applicable), source, and date.
    The interview list should include the date, attendees, associations (e.g., company
    name, title), and topic. The test cases should include a test case name, reference
    number, and date. In addition to the reference list, reports might include one
    or more appendices to provide further details. Supplemental information might
    be provided by separate presentation material.


