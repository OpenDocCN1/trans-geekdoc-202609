    任何 SAML 消息都可能包含使用 `Encrypted ID` 选项加密的数据。同样，认证断言或授权属性也可能使用 `Encrypted Assertion`
    或 `Encrypted Attribute` 选项加密。所有三个加密选项都包含 `Encrypted Data` 和 `Encrypted Key` 字段。SAML
    `Encrypted Key` 字段并没有定义自己的密钥管理方案，而是使用 XML 加密方案 [54]。XML 加密方案包含一个用于定义加密算法的 `Encryption
    Method` 字段、一个用于定义密钥建立方法的 `Key Info` 字段以及一个 `Cipher Data` 字段。根据密钥建立方法，发送者和接收者将拥有额外的密钥（参见图
    4.8）。


    例如，图 4.8 中的 SAML 消息包含一个 `Encrypted ID`，其 `XML Key Info` 字段使用了基于 Diffie–Hellman
    (DH) 密钥建立方案的 `Encrypted Key`。除了 SSL 私钥外，SAML 服务器 (SS) 还拥有另一个带有私钥的证书以及 RP 证书副本。同样，除了
    SSL 证书外，RP 也拥有另一个带有私钥的证书以及 SS 证书副本。SAML 服务器使用这两个 DH 证书和其 DH 私钥来计算共享密钥，并为 `Encrypted
    Data` 派生对称密钥。同样，RP 使用这两个 DH 证书和其 DH 私钥计算相同的共享密钥，并为 `Encrypted Data` 派生相同的对称密钥。


    ![](img/00052.jpeg)


    图 4.7  SAML 机密性。


    ![](img/00053.jpeg)


    图 4.8  SAML 加密架构。


    ### 4.4 开放授权 (OAUTH)


    开放授权^(\*) (OAUTH) 是一种用于为 Web、移动和桌面应用程序启用授权（而不一定是认证）的开放标准。更具体地说，OAuth 2.0 授权框架^†
    允许第三方应用程序获取对 HTTP 服务的有限访问权限。OAUTH 不应与开放认证倡议^‡ (OATH) 框架混淆。图 4.9 显示了基本的 OAUTH 协议
    [55]，它包含了服务器（客户端、服务、授权和所有者）和消息（授权请求、授权许可、访问令牌、受保护资源）。


    ![](img/00054.jpeg)


    图 4.9  OAUTH 加密架构。


    消息流由 OAUTH 客户端与 OAUTH 所有者之间的 (a) 授权请求和 (b) 授权响应消息启动。OAUTH 所有者授予（或拒绝）客户端访问请求服务的权限。如果获得授权，消息流通过
    OAUTH 客户端与 OAUTH 授权 (OA) 服务之间的 (c) 授权许可和 (d) 访问令牌消息继续。OA 服务（其可能与 OAUTH 所有者是同一实体）提供访问令牌。消息流通过
    OAUTH 客户端与 OAUTH 服务 (OS) 之间的 (e) 访问令牌和 (f) 受保护资源消息完成。访问令牌允许 OAUTH 客户端获取 OS 的资源。


    OAUTH 预计运行在最新的 TLS 之上。因此，每个服务器都将向 OATH 客户端提供其公钥证书并管理其对应的私钥。OAUTH 所有者 (OO) 服务器将其证书发送给
    OAUTH 客户端以建立第一个 TLS 会话，OA 服务器将其证书发送给 OAUTH 客户端以建立独立的 TLS 会话，而 OS 将其证书发送给 OAUTH
    客户端以建立另一个 TLS 会话。因此，OAUTH 客户端可能拥有多种证书。


    ### 4.5 密码与 PIN 验证


    知识认证是“你所知道的”的方法，包括密码和识别码 (PIN)。密码与 PIN 的传输方法非常不同，密码和 PIN 在传输过程中是加密的（参见第 5 章](#part0010.html#ch05)），而图
    4.10 显示了密码哈验证。


    密码验证基本上是将输入的密码与存储的密码进行匹配。输入的密码安全地传输（参见第 5 章](#part0010.html#ch05)）从用户端到密码验证过程。密码验证过程从可能包含数百、数千或百万密码的用户数据库中获取存储的密码。因此，验证过程需要一个用户标识符来定位正确的用户配置。密码也以安全方式存储。可能，存储的密码与传输的密码格式不同；验证过程需要将格式转换为通用格式以便比较这两个密码。比较结果（匹配或不匹配）提供给应用服务。应用服务做出授予或拒绝访问的最终决定，因为它可能在使用密码验证之外还使用了其他认证方法，例如挑战答题。


    ![](img/00055.jpeg)


    图 4.10  密码与 PIN 验证。


    密码存储方法极少保留明文；对用户数据库的未经授权访问将导致所有密码泄漏。此外，拥有访问权限的管理员可能被强制披露密码，因此完全避免存储密码更好。存储的密码可以使用加密密钥加密，但由于密码验证通常使用软件执行，保护密钥是个问题。因此，大多数密码存储使用哈希算法。然而，如所述，哈希算法容易受到字典攻击，通常称为彩虹表。所有可能的密码都可以进行哈希处理，使得能够访问用户数据库的攻击者只需在彩虹表中查找哈希即可确定密码。密码哈希使用两种额外机制来防御字典攻击：密码盐和迭代次数
    [39]。如图 4.11 所示，密码加盐在哈希处理之前向密码添加一个随机值，使得生成的哈希值因盐的添加而改变。盐并不是为了保密；秘密盐类比地称为加调 (peppering)。相反，盐增加了创建彩虹表的工作量。考虑一个允许大小写字母、数字和特殊字符的
    8 字符密码的工作量。


    ![](img/00056.jpeg)


    图 4.11  密码验证。


    ![](img/00002.jpeg)


    密码字母表：26 小写 + 26 大写 + 10 个数字 + 8 特殊字符 = 70 种可能字符


    ![](img/00002.jpeg)


    可能的 8 字符密码：70⁸ 或约 576 万亿种可能的密码


