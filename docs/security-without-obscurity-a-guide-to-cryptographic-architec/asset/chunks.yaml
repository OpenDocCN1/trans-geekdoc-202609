    [³](#part0013.html#fntab8_4_3a) Security policy #nnnn.


    [⁴](#part0013.html#fntab8_4_4a) Interview #1 on mm/dd/yyyy.


    [⁵](#part0013.html#fntab8_4_5a) Interview #2 on mm/dd/yyyy.


    ![](images/00002.jpeg)Fact #2 states that the product supports the advanced encryption
    standard (AES) algorithm with another score of 10 and three references: the technical
    specification, the NIST FIPS 140-2 security policy, and notes from interview #2.
    The first interviewee could only corroborate the NIST certificate but could not
    provide details regarding algorithms. The NIST certificate provides general vendor
    and product information, but the corresponding security plan lists the FIPS and
    non-FIPS algorithms. The second interviewee was able to verify the AES algorithms.


    ![](images/00002.jpeg)Fact #3 refers to the two-key (2K) and three-key (3K) triple-DES
    (2DES) algorithm, with a lower score of 6 because of its lesser key length and
    cryptographic strengths, with the same three references as AES. The second interviewee
    was able to verify the 3DES algorithms.


    ![](images/00002.jpeg)Fact #4 refers to the DES algorithm and the exportable DES
    key length, with the lower score of 2 and two references: the NIST FIPS 140-2
    security policy, and notes from interview #2. The technical specification neglected
    to mention the DES algorithm, but the security plan did not. The second interviewee
    was able to verify the DES algorithms.


    Thus, as the analysis is performed, concerns might arise that require follow-up
    testing, interviews, or additional documentation, as indicated by the dotted lines
    in [Figure 8.1](#part0013.html#fig8_1). However, the documentation versus interview
    cycle, the interview versus test cycle, and the test versus analysis cycle will
    eventually reach a point of diminishing returns. The ability to determine when
    to pursue an issue and at what time to discontinue investigation is part of the
    skill set of a good assessor. William James (1842–1910), an American philosopher
    and psychologist, once observed \[[97](#part0016.html#ref_97)\] that differences
    are sometimes insignificant:


    A difference which makes no difference is no difference at all.


    **William James**'
