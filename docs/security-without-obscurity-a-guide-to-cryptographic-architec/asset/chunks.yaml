    An alternate to application process flows, sequence diagrams, and flow charts
    is a state transition diagram shown in [Figure 6.5](#part0011.html#fig6_5). Notwithstanding
    the various servers, the system rests in idle state until a request changes it
    to the validation state. An error returns the system back to the idle state awaiting
    the next request. Otherwise, a fetch transitions the system to a data state for
    acquiring the individual’s profile record. A successful fetch changes the system
    to a process state. A successful response returns the system from either process
    or data state to the idle state, or potentially an error returns the system from
    either data or process state to the idle state. State transition diagrams are
    not widely used but can identify processing conditions that other application
    diagrams might inadvertently overlook. Otherwise, they are not typically used
    to determine information security (IS) controls.


    Another method to document application processing is a RACI matrix. RACI stands
    for responsible, accountable, consulted, and informed. The purpose for a RACI
    is to describe the various process roles. Roles can be a software or hardware
    component, a manual process, a group, or even an individual. For this scenario,
    shown in [Table 6.1](#part0011.html#tab6_1), the roles are the individuals, and
    the various servers: the `BA server`, the `BP server`, the `Web server`, the `App
    server`, and the `DB server`. The roles are mapped to the messages: the request,
    the response, and errors.


    ![](images/00070.jpeg)

    Figure 6.4 Application flow chart.


    ![](images/00071.jpeg)

    Figure 6.5 Application state transition diagram.


    ![](images/00002.jpeg)Request messages: the individual is responsible to initiate
    the request; the `BA`, `BP`, and `Web servers` are accountable to handle the request;
    the `App server` is responsible for processing the request; and the `DB server`
    is informed when updates are needed.


    ![](images/00002.jpeg)Response messages: the individual is responsible for accepting
    the response; the `BA`, `BP`, and `Web servers` are accountable to handle the
    response; the `App server` is responsible for processing the response; and the
    `DB server` is informed when updates are needed.


    ![](images/00002.jpeg)Error messages: the individual is consulted when an error
    occurs; the `BA`, `BP`, `Web`, and `App servers` are responsible for returning
    error messages; and the `DB` is informed when updates are needed.


    RACI do not typically convey IS controls unless processes are purposely added
    to the matrix. However, a RACI is often built from other application plans so
    unless other diagrams have incorporated security controls, it is unlikely any
    would be incorporated into the RACI chart. Further, it is infrequent to address
    cryptography or key management controls using an application-based RACI. However,
    RACI have been used to capture responsibilities regarding the cryptographic key
    lifecycle. See [Chapter 3](#part0008.html#ch03) for an overview of symmetric,
    asymmetric, and certificates and [Chapter 7](#part0012.html#ch07) for a discussion
    of the key management lifecycle.


    Table 6.1 Application RACI Chart


    ![images](images/00072.jpeg)


    It is important to recognize that applications do not operate in a vacuum. Software
    runs on hardware, hardware is deployed in datacenters, and datacenters are connected
    to networks which in turn rely on other hardware that runs other software or firmware.
    Thus, in addition to looking at application architectures, it is equally important
    to consider network architectures.


    ### [6.2 Network Architecture](#part0003.html#Rsec6_2)


    Network architectures convey equipment, locations, and connectivity information.
    Equipment includes mainframes, various servers, and a variety of network appliances.
    Servers range from dedicated `web servers`, `App servers`, `DB servers`, `file
    servers`, and `virtual servers` running hypervisors that logically “slice” the
    hardware server into multiple instances. Network appliances include `routers`,
    `firewalls` (`FWs`), `load balancers`, `switches`, `hubs`, and other devices.
    Other appliances are functional specific such as `DBs`, `log management systems`,
    `traffic monitoring system`, and even cryptographic hardware security modules
    (`HSMs`). These latter appliances are sometimes treated as servers while other
    times are considered network devices; it often depends on the culture and experience
    of the network engineers. See [Figure 6.6](#part0011.html#fig6_6) for a network
    diagram of the ongoing scenario used throughout this book, organized into zones:
    the external Internet, the DMZ, and the internal network.


    [Figure 6.6](#part0011.html#fig6_6) shows the usual servers in the DMZ: the `web
    servers`, the `BP servers`, and the remote access servers (`RASs`). The diagram
    also shows the other servers in the network zone: the `App servers`, the `DB servers`,
    the `software server` (`SS`), and the `admin servers` (`ASs`). In addition to
    the servers, the network diagram shows `routers` (`R`) located in the Internet
    zone, the DMZ, and the network zone. `FWs` separate the DMZ from the Internet
    and the network zone. All network traffic flow through the `FWs` where `FW rules`
    control which ports and protocols are permitted.


    ![](images/00073.jpeg)

    Figure 6.6 Network diagram.


    Not shown or addressed are multiple `FWs`, web application firewalls (`WAFs`),
    application firewalls (`AFs`), or virtualization. Multiple `FWs` are commonly
    used to thwart hackers from using zero-day attacks, auto-script attacks, or lagging
    security configurations. For example, the `FW` shown between the Internet and
    the DMZ might be two different systems where the chance of the same vulnerability
    occurring on both `FWs` is very low. Auto-scripts designed to attack one system
    have a lesser chance of success against a different system. Further, a delayed
    patch on one system should have minimal effect on the other system.


    `WAFs` and `AFs` interrogate network traffic beyond port and protocol `FW rules`.
    `WAF` or `AF` might run on traditional `FWs`, dedicated servers (not shown) or
    on the functional servers (e.g., Web, BP). While `WAFs` and `AFs` are valid IS
    controls, they typically do not incorporate cryptography; thus they are not discussed
    further in book.


    Virtualization refers to hardware servers running hypervisors to enable resource
    sharing among application instances running on the same hardware. Some virtualized
    servers can share resources among themselves across hardware platforms. Virtualization
    technology does not implement or rely on cryptography, rather applications running
    in virtual environments might employ cryptography; thus virtualization is not
    discussed further in this book.


    [Figure 6.6](#part0011.html#fig6_6) also shows the various communication channels
    and virtual local area network (`VLAN`) connections. Inbound traffic from the
    Internet is directed by the external router to the external `FW` residing within
    the DMZ. The external `FW` filters messages and the DMZ router directs requests
    to either the `web servers` or the `BP servers` over the application `VLAN`, often
    called an “application rail” to collectively refer to other similar VLAN. Once
    the request is recognized by either server, the DMZ router redirects requests
    to the internal `FW`. The internal `FW` also filters messages and the network
    router sends requests to the `App server` over the “application rail” for processing.
    Further, the `App server` interfaces to the `DB server` over the same application
    rail.


    Responses are returned by the network and DMZ routers over the network application
    rail from the `App server` to either the original Web or BP server through the
    internal `FW`. Once handled by the Web or BP servers the response is returned
    to the Internet via the DMZ and external routers over the DMZ application rail
    through the external `FW`. However, the network diagram does not address security
    controls for the application rail.

