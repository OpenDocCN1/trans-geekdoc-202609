    ##### Subject Alternative Name


    This X.509 extension, the subject alternate name (SAN) contains a list of substitute
    identities, basically a type of “doing business as” information. Each name is
    equally associated with the subject public key as is the Subject. This allows
    a Subject to operate under more than one name, but using the same certificate
    and asymmetric keys.


    Industry conventions now include the Subject common name (CN) in the SAN extension
    along with other names, and sometimes the SAN only includes the CN. Further, the
    SAN size has been extended to allow for hundreds of alternate names. This latter
    change alleviates the need for wildcard certificates where the Subject CN “\*”
    matches any name. For example, the domain name [www.example.com](http://www.example.com)
    might be listed as \*.[example.com](http://example.com) which would match [sample1.example.com](http://sample1.example.com)
    and [sample2.example.com](http://sample2.example.com) or any similar website.
    Conversely, the SAN extension would include [www.example.com](http://www.example.com),
    [sample1.example.com](http://sample1.example.com), and [sample2.example.com](http://sample2.example.com)
    but no others. The wildcard allows any equivalent match whereas the SAN extension
    limits matching to a specific set of names. Ironically, adding a wildcard name
    to a SAN extension basically defeats the purpose of using the SAN extension altogether.


    ##### Basic Constraints


    This X.509 extension identifies whether the certificate subject is a CA and can
    further define the maximum PKI hierarchy for certificate validation. Otherwise,
    the certificate is an end-entity certificate whose public key cannot be used to
    verify a certificate signature.


    Paradoxically, end-entity self-signed certificates are not CA certificates, and
    yet the certificate public key is used to verify the certificate signature. Despite
    the digital signature, a self-signed certificate cannot have data integrity or
    authenticity much less any non-repudiation. Any attacker can change any of the
    certificate information, replace the public key, and resign the certificate with
    a corresponding private key; the changes are undetectable. See the discussion
    in this annex on self-signed certificates.


    ##### CRL Distribution Points


    This X.509 extension provides information to obtain CRL information. Typically,
    an URL points to a website where the current CRL is posted for downloading. The
    CRL reason flags are another set of bits.


    ##### Authority Information Access


    This X.509 extension provides issuer information or access to issuer services.
    Issuer information might contain CA certificates to assist in determining an appropriate
    certificate chain. Issuer services might contain validation services such as the
    location of Online Certificate Status Protocol responder. The authority information
    access extension does not contain CRL as that information is in the CRL Distribution
    Points extension.


    ![images](images/00153.jpeg)


    #### Self-Signed Certificates


    Self-signed certificates as subject certificates should never be used as self-sign
    certificates do not provide data integrity or authenticity much less non-repudiation.
    See Figure Annex 1 for a comparison between self-signed certificates versus CA-signed
    certificates. The self-signed certificate is shown on the left and the CA-signed
    certificate is shown on the right with a certificate chain. The CA certificates
    are kept within a certificate trust store, whereas the subject certificates are
    exchanged during an authentication or encryption protocol. The certificate trust
    store might be prepopulated by a browser manufacturer or installed by a system
    administrator onto an application server or other network device.


    ![](images/00154.jpeg)


    Figure Annex 1   Self-signed certificates.


    The CA-signed subject certificate has a signature generated by the issuer CA private
    key, and the corresponding issuer CA public key is used to verify the signature.
    The issuer CA public key is fetched from the issuer CA certificate stored in the
    certificate trust store. Subsequently, the issuer CA certificate has a signature
    generated by the sub-CA private key, and the corresponding sub-CA public key is
    used to verify that signature. Successively, the sub-CA certificate has a signature
    generated by the root CA private key, and the corresponding root CA public key
    is used to verify the signature. Since the root CA is the trust anchor, the root
    CA certificate is signed using its own private key and verified using its own
    public key. But, as noted, the certificate trust store has been provided by an
    authoritative source so the root CA “self-sign” certificate is trustworthy. Thus,
    when the CA-signed subject certificate is exchanged, it is validated using the
    CA certificate chain in the certificate trust store.


    The self-signed subject certificate has a signature generated by the subject private
    key, and the corresponding subject public key in the certificate is used to verify
    the signature. There is no trustworthy certificate chain to validate the self-signed
    subject certificate. Thus, any attacker can copy the subject certificate, alter
    any information, replace the subject public key with the attacker public key,
    and resign the certificate using the attacker private key. Hence, an unsuspecting
    relying party receiving an unsolicited self-signed subject certificate unwittingly
    uses the certificate public key (subject or attacker) to verify the signature
    generated by the associated private key (subject or attacker).


    Further, even if the relying party is provided the self-signed subject certificate
    over an independent communications channel but stored locally without appropriate
    security controls, the certificate still has no integrity. Anyone with access
    to the system can change and re-sign the certificate. Thus, the self-signed subject
    certificate is susceptible to an insider attack. Basically, a self-signed subject
    certificate is equivalent to a bare public key without any integrity or authenticity.
    Clearly, additional security controls are needed when PKI-based digital certificates
    are not used to protect public keys.


    ### OID Quick Reference


    This annex provides an overview of OID values. The ITU-T X.660 standard provides
    the following definition for an OID.


    **Object identifier**: An ordered list of primary integer values from the root
    of the international OID tree to a node, which unambiguously identifies that node.


    ![images](images/00155.jpeg)


    According to the scheme, each numbered position can take any integer value of
    0 or greater so an OID is infinitely extensible, and as many positions can be
    used so an OID is infinitely expandable. This allows every OID to be globally
    unique. Once defined and registered, an OID is never deleted or changed. However,
    more than one OID might have the same meaning. An OID is typically described as
    a tree structure with the ordered list beginning at the top of the tree and extending
    downward. Any list of numbers is called an arc. There are only three (0, 1, 2)
    root arcs which represent three standards organizations.


    0 is ITU-T commonly written ITU-T(0)


    1 is ISO commonly written ISO(1)


    2 is Joint-ISO-ITU-T commonly written ISO/ITU-T(2)


    The secondary ITU-T arcs are defined as follows:'
