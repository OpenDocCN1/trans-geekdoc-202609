    the web servers or the BP servers, and then onto the original request source,
    either the external BA or individual browsers. From a security perspective, [Figure
    6.1](#part0011.html#fig6_1) includes the following information:


    ![](images/00002.jpeg)Individuals connect to the web servers using Hypertext Transfer
    Protocol Secure (HTTPS) which is HTTP over Transport Layer Security (TLS).


    ![](images/00067.jpeg)


    Figure 6.1   Application process flows.


    ![](images/00002.jpeg)Individuals are authenticated and authorized by the web
    servers using identity-based authentication.


    ![](images/00002.jpeg)Other individuals use a local BA that connects to the BP
    server over TLS.


    ![](images/00002.jpeg)Other individuals are presumed to be authenticated and authorized
    by the BA servers, and connections are authenticated and authorized by the BP
    server using group-based authentication.


    ![](images/00002.jpeg)The web server and the BP server both connect to the App
    server using TLS from the DMZ to the network.


    ![](images/00002.jpeg)The App server connects to the DB server over an open connection
