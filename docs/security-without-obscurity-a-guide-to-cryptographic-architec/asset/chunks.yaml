    private key yielding the SK which is used to decrypt the Tag 9 packet which yields
    the data. Chuck uses the Tag 19 packet is used to verify the integrity of the
    decrypted data.


    The second message (right) is likewise composed of four packets: two Tag 3 packets,
    a Tag 9 packet, and a Tag 19 packet. The two Tag 9 packets are symmetric-key encrypted
    session key packets. These packets contain an encrypted SK encrypted using a key
    encryption key (KEK). Each packet uses a different KEK generated using different
    passphrases that Alice has shared separately with Bob and Chuck. The single Tag
    9 packet is a symmetric-key encrypted session key packet. This packet contains
