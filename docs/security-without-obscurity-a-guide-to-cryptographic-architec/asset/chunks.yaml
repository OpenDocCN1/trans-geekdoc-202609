    There are many other types of application architecture diagrams. For example,
    [Figures 6.2](#part0011.html#fig6_2) and [6.3](#part0011.html#fig6_3) are sequence
    diagrams for the same scenario. Sequence diagrams are often used to provide additional
    messaging details. [Figure 6.2](#part0011.html#fig6_2) depicts web-based transactions,
    and [Figure 6.3](#part0011.html#fig6_3) shows portal-based transactions. As shown
    in [Figure 6.2](#part0011.html#fig6_2), requests flow from individuals using browsers
    to the web servers; the BA and BP servers are skipped. The first sequence illustrates
    the web server rejecting the request due to an authentication error; a response
    error is returned to the individual. The second sequence describes a successful
    transaction: the request is received by the web server, passed to the App server,
    a fetch occurs with the DB server, a DB update might happen, and a response is
    sequentially returned from the App server to the web server and back to the end
    user browser.


    ![](images/00068.jpeg)


    Figure 6.2   Application web sequence diagram.


    ![](images/00069.jpeg)


    Figure 6.3   Application BP sequence diagram.


    As shown in [Figure 6.3](#part0011.html#fig6_3), requests flow from individuals
    using an external BA servers and onto the BP servers. The first sequence illustrates
    either the BA server or the BP server rejecting the request due to an authentication
    error. If the BA server rejects the request then the BP server never sees the
    message. If the BP server rejects the request then a response error is returned
    to the BA server. The second sequence describes a successful transaction: the
    request is received by the BP server, passed to the App server, a fetch occurs
    with the DB server, a DB update might happen, and a response is sequentially returned
    from the App server to the BP server and back to the BA server.


    From a security perspective, [Figures 6.2](#part0011.html#fig6_2) and [6.3](#part0011.html#fig6_3)
    reconfirm the access controls at the web servers and the BP servers. However,
    neither [Figure 6.2](#part0011.html#fig6_2) nor [Figure 6.3](#part0011.html#fig6_3)
    provides any further information regarding data in transit or data in storage.
    Sequence diagrams tend to not provide security controls information, whereas process
    flows such as [Figure 6.1](#part0011.html#fig6_1) might. Another possible application
    diagram is a classical flow chart shown in [Figure 6.4](#part0011.html#fig6_4).
    Irrespective of the various servers, an individual submits a request, if valid
    the individual’s profile is fetched from the DB, the request is processed, and
    a response is returned to the individual. Processing the request may update the
    DB. Further, if the request is invalid an error is returned. Similar to the sequence
    diagrams, flow charts focus on the inputs, data processes, and outputs, but not
    so much on security controls. However, the validity check reconfirms access controls.'
