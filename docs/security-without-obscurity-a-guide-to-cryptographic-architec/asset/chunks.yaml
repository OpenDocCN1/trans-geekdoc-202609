    ### 9.3 安全电子交易 (SET)


    安全电子交易 (SET) 是 MasterCard 和 Visa 之间的一项合资项目，由技术规范和一个运营组织（SETCo）组成。20 世纪 90 年代初，万维网向任何拥有浏览器（如
    `Netscape`、`Mosaic`）和网络连接的人开放了互联网。SET 的主要业务动力是欺诈商户；欺骗者伪装成合法商户收集卡信息（例如 `PAN`、有效期、`CCV2`、`PIN`），用于随后的无卡交易（CNP）交易，或为在线或线下交易制作伪卡。SET
    的设计旨在保护持卡人、收单行和发行免受商户欺诈，从而减少持卡人欺诈，使合法商户、收单行和发行行受益。


    Visa 开始与微软合作创建一种名为“安全交易技术”的中心化模型。MasterCard 与 `IBM`、`Netscape`、`GTE` 等建立了一个财团，开发了一种名为“安全电子支付协议”的分布式规范。最终，Visa
    和 MasterCard 在其金融机构成员的压力下合并了努力，并将 SET 以三本书的形式出版：(1) 业务描述 [99]，(2) 程序员指南 [100]，以及
    (3) 正式协议定义 [101]。


    这三本书均在 `GTE`、`IBM`、`Microsoft`、`Netscape`、`RSA`、科学应用国际公司 (SAIC)、`Terisa` 和 VeriSign
    的建议和协助下开发的。参与 SET 制造或部署的其他公司（按字母顺序排列）包括 `American Express`、`CertCo`、`Digital Signature
    Trust`、`Fisher International`、`KMPG LLP` 和 `Nortel`。Visa 和 MasterCard 建立了 SETCo，这是一个专门用于管理
    SET 参与者及其关系的法律实体，希望其他品牌（例如 `American Express`）能够加入；然而，没有其他品牌正式成为成员。在范围内运营六年后，SET
    于 2002 年退役。请参见 图 9.6。


    SET 方案包含三个处理环境：持卡人、商户和网关。交易源自持卡人，发送给商户，转发到网关，并传输到遗留支付网络。SET 基于全球 PKI，SETCo 根 CA
    (SET) 在未公开的地点离线运行；其技术细节是严格保密的秘密。请参见 图 9.7。


    每个参与品牌（例如 `Visa`、`MasterCard`）都运营一个品牌 CA (BCA)，其证书由 SETCo 根 CA 签名。每个 BCA 在全球范围内设有区域
    CA，包括日本、美国、丹麦和法国，其证书由相关的 BCA 签名。每个区域 CA 向持卡人 CA (CCA)、商户 CA (MCA) 和网关 CA (GCA)
    发放证书。CCA 向持卡人发放证书，MCA 向商户发放证书，GCA 向网关发放证书。因此，持卡人、商户和网关对于每个品牌（`Visa`、`MasterCard`）都拥有独立的证书链。
    SET 的加密工作原理如下：


    1. 持卡人使用其私钥对购买数据（例如红色毛衣 XL 码、价格 30 美元、客户姓名、客户地址、收货地址）签名，并使用商户证书对签名数据进行加密。


    ![](img/00112.jpeg)

    图 9.6 SET 加。


    ![](img/00113.jpeg)

    图 9.7 SET 认证机构。


    2. 持卡人使用其私钥对支付数据（例如 `PAN`、有效期、`CVV2`）签名，并使用网关证书对签名数据进行加密。

    3. 持卡人将签名并加密的支付数据发送给商户。

    4. 商户使用其私钥解密购买数据，并使用持卡人证书验证签名。

    5. 商户使用其私钥解密加密的购买数据，并将双重签名的加密对象发送给网关。

    6. 网关使用商户证书验证签名，使用其私钥解密支付数据，并使用持卡人证书验证签名。

    7. 网关使用支付数据向遗留支付网络发送授权请求，并接收授权响应。

    8. 网关使用其私钥对授权进行签名并返回给商户。

    9. 网关将结算信息发送给支付网络进行常规结算和结算。结算流程将资金从发行行（反之向持卡人收费）转移到收单行和商户账户。

    或者，对于处理自身清结算的商户，网关使用其私钥对结算信息进行签名并发送给商户。

    10. 商户使用网关证书验证授权（以及可能的结算）签名。


    在 SET 开发和部署期间，Netscape 开发的另一种名为安全套接字层 (SSL) 的技术也被应用于浏览器和服务器中。正如第 5 章 所述，SSL 是
    TLS 的前身。SSL 最终由于三个重大问题超越了 SET：持卡人认证、商户认证和商户结算。


    ![](img/00002.jpeg)

    持卡人认证缺失，因为 SET 很少发放持卡人证书。持卡人的关系在于发行行；对于 MasterCard 和 Visa 而言，发行行是金融机构。然而，银行并未准备好向任何依赖方（例如商户、网关、收单行、网络）提供客户的联邦身份。


    ![](img/00002.jpeg)

    商户认证可以通过其他方法。收单行和网关与其商户签有合同；审核商户是常规业务也是尽调的一部分。欺诈商户问题似乎没有想象的那么严重。然而，黑客攻击和数据泄露显然超过了欺诈商户的威胁。


    ![](img/00002.jpeg)

    商户结算实现了，因为 SET 通常允许网关将结算信息传回大型商户。大型商户更适合部署 SET，但通常处理自己的结算。因此，大型商户从结算信息中获取支付数据。


    当消除持卡人签名时，到商户的连接仅为加密，基本上类似于 SSL 或 TLS。当商户签名被其他业务尽调抵消时，到网关的连接仅为加密，同样类似于 SSL 或 TLS。由于网关返回的结算信息为商户提供了支付数据，这基本上与持卡人使用
    SSL 或 TLS 将卡片数据加密给商户的结果相同。因此，使用复杂且昂贵的 SET 基本上被简化为安全性等同但更简单廉价的 SSL 或 TLS。


    ### 9.4 ATM 远程密钥加载 (RKL)


    '
- fmt: '

    ATMs in the 1980s only had symmetric keys; it was not until the 1990s when asymmetric
    keys became available. ATM had two keys denoted `A-key` and `B-key`. The `B-key`
    was known as the communication key, used for PIN encryption. The `A-key` was called
    the terminal master key, basically a `KEK` used to exchange `B-keys`. However,
    ATMs have since been upgraded using Encryption PIN Pad (`EPP`) as per the directives
    from the Payment Card Industry Security Standards Council (`PCI SSC`).


    `PCI SSC` was founded in 2006 by American Express, Discover Financial Services,
    JCB International, MasterCard, and Visa as a collaboration for common security
    programs. One of the many security standards and programs is the `EPP Security
    Requirements`. The requirements address device characteristics consisting of physical
    security and logical security, and device management during manufacturing and
    between manufacturing and initial key loading. `Figure 9.8` shows an ATM remote
    key loading (`RKL`) process and the subsequent PIN processing for three types
    of transactions: on-us, foreign card, and foreign ATM.


    The `RKL` discussed in `Figure 9.8` consists of the host loading initial cryptographic
    keys into empty `EPP` provided by the manufacturer’s key management service (`KMS`).
    The `KMS` provides an `EPP` key file (`EKF`) to the new owners (host), so keys
    can be initialized into multiple `EPPs` that are installed in various ATMs. `RKL`
    consists of the following steps:


    1. The host and `KMS` exchange public keys using a variety of possible methods
    including portable media or electronic transmission. Alternatively, the two entities
    exchange `X.509` public key certificates.

    2. The host and `KMS` exchange and verify the hash of each public key to verify
    the integrity of the public keys. Certificates are not used. Alternatively, each
    entity validates the certificate of the other entity.

    3. The `KMS` generates different asymmetric keys unique per `EPP` and creates
    an `EKF` containing the `EPP` serial numbers and asymmetric keys.

    4. The `KMS` signs the `EKF` using its private key and encrypts the signed `EKF`
    using the host public key. The encrypted signed `EKF` is transmitted to the host.

    5. The host decrypts the `EKF` using its private key and verifies the signature
    using the `KMS` public key.

    ```

    ![](images/00114.jpeg)

    ```

    Figure 9.8 ATM remote key load.

    6. The host loads the unique keys per `EPP` using the `EKF` into the designated
    `EPP` and installs the active devices into the various ATMs to enable PIN encryption.


    Once each ATM has an active `EPP` it can remotely load the `A-key` using the `EPP`
    asymmetric keys, and then remotely load the `B-key` using the `A-key`. The ATM
    can then accept and encrypt a cardholder PIN. For an issuer that operates an ATM,
    there are three different types of transactions: on-us transactions, foreign card
    transactions, and foreign ATM transactions. `Figure 9.8` shows an on-us transaction
    when the cardholder uses a card (`A`) at the issuer’s (`A`) ATM.


    1. The host generates a symmetric `A-key`, encrypts it using the `EPP` public
    key, and remotely loads the encrypted `A-key` into the `EPP`. The `EPP` decrypts
    and installs the `A-key` terminal master key.

    2. The host generates a symmetric `B-key`, encrypts it using the `A-key`, and
    remotely loads the encrypted `B-key` into the `EPP`. The `EPP` decrypts and installs
    the `B-key` communication key.

    3. The cardholder inserts the card (`A`) into ATM 1 and enters the PIN.

    4. The ATM encrypts the PIN using its PIN encryption key (`PEK`) and sends it
    onto the host system (Issuer A) along with the `PAN` and other transaction data.

    5. The host system recognizes the `PAN`, decrypts the PIN for verification, and
    authorizes the cardholder to complete the ATM transaction.


    `Figure 9.8` also depicts a foreign card transaction when the cardholder uses
    a card (`B`) at the issuer’s (`A`) ATM. The transaction needs to be authorized
    by the appropriate issuer (`B`).


    1. The cardholder inserts the card (`B`) into ATM 2 and enters the PIN.

    2. The ATM encrypts the PIN using its `PEK` and sends it onto the host system
    (Issuer A) along with the `PAN` and other transaction data.

    3. The host system does not recognize the `PAN`, so the PIN is translated from
    the ATM key to the network key, and sends an authorization request to the network.

    4. The network translates the PIN from the key shared with issuer A to the key
    shared with issuer B, and routes the request to issuer B.

    5. Issuer B decrypts the PIN for verification, authorizes the cardholder transaction,
    and returns an authorization response.

    6. The network returns the response to issuer A for completing the ATM transaction.


    `Figure 9.8` further shows a foreign ATM transaction when the cardholder uses
    a card (`A`) at the issuer’s (`B`) ATM. The transaction needs to be authorized
    by the appropriate issuer (`A`).


    1. The cardholder inserts the card (`A`) into ATM X and enters the PIN.

    2. The ATM encrypts the PIN using its `PEK` and sends it onto the host system
    (issuer B) along with the `PAN` and other transaction data.

    3. The host system (B) does not recognize the `PAN`, so the PIN is translated
    from the ATM key to the network key, and sends an authorization request to the
    network.

    4. The network translates the PIN from the key shared with issuer B to the key
    shared with issuer A, and routes the request to issuer A.

    5. Issuer A decrypts the PIN for verification, authorizes the cardholder transaction,
    and returns an authorization response.

    6. The network returns the response to issuer B for completing the ATM transaction.


    The transactions discussed in this section are for online PIN verification and
    the process for loading keys into an `EPP`. Once the asymmetric keys are loaded
    into an `EPP`, the `A-key` and `B-key` can be remotely loaded into the `EPP`.
    New `B-keys` can be exchanged as often as required using the `A-key`. Similarly,
    new `A-keys` can be exchanged as often as needed using the `EPP` asymmetric keys.
    The asymmetric keys remain static for the lifetime of the `EPP`.


    ### 9.5 Database Encryption (DBE)


    DBE has emerged as a data protection mechanism to prevent unauthorized disclosure
    of information. Stolen media only contains encrypted data which cannot be decrypted
    without the data encryption key (`DEK`). Unauthenticated access to storage media
    which bypasses access controls enables downloading encrypted data, which again
    cannot be decrypted without the key. Consequently, DBE is one layer for a defense
    in depth approach to protect networks, servers, DBs, and information. However,
    the `DEK` might be managed in a variety of methods using software and hardware
    cryptography. `Figure 9.9` depicts a DB server using encryption, the DB keys managed
    by a `KMS`, and the KMS server using an `HSM`.


    Further, as shown in `Figure 9.9`, encryption can be applied at several levels:
    disk encryption, DBE, table encryption, or column encryption.


    ```

    ![](images/00002.jpeg)

    ```

    (Note: The original text provided duplicate image paths for Figure 9.9; maintaining
    structure based on the provided flow.)


    ```

    ![](images/00002.jpeg)

    ```

    **Disk encryption** uses a `DEK` to encipher the whole disk irrespective of the
    file system or any DB. The disk is enciphered during system shutdown and deciphered
    during system start-up. This protects the disk if lost or stolen but does not
    offer protection when the system is running.


    ```

    ![](images/00002.jpeg)

    ```

    **Database encryption** uses a `DEK` to encipher the whole DB regardless of any
    tables or columns. The DB is initially enciphered, sections are deciphered in
    memory as needed, and re-enciphered to disk according to need. This protects the
    DB from unauthenticated access. Authenticated access automatically deciphers the
    DB sections into memory.


    ```

    ![](images/00115.jpeg)

    ```

    Figure 9.9 Database encryption.

