    # Chapter 2


    ## Cryptography Basics


    Cryptographers are mathematicians who specialize in cryptography or cryptanalysis.
    Essentially, cryptanalysis is breaking protection mechanisms, whereas cryptography
    is making protection mechanisms. All cryptographers are mathematicians but not
    all mathematicians are cryptographers. This book includes some math and discusses
    some cryptographic concepts but does not use any serious math.


    ![](images/00002.jpeg)Cryptography is from the Greek words “kyrptós” meaning hidden
    (or secret) and “graphein” meaning writing.


    ##images/00002.jpeg)Cryptanalysis is from the Greek words “kyrptós” meaning hidden
    (or secret) and “analýein” meaning loosen (or untie).


    The first known use of cryptography was in ancient Egypt \[[6](#part0016.html#ref_6)\]
    when the priesthood substituted common hieroglyphics with secret symbols to hide
    their true meaning. Governments and military have used cryptography for thousands
    of years for secret communications. Modern cryptography and cryptanalysis began
    during World War II with the infamous German Enigma[^(\*)](#part0007.html#fn2_1)
    machine and the Japanese Purple cipher. The financial services industry has been
    using cryptography for decades to protect personal identification numbers with
    automated teller machines and point-of-sale terminals. Information technology
    uses various types of cryptography to protect communications, passwords, files,
    databases, and much more.


    For the purposes of this book, cryptography is discussed as symmetric versus asymmetric
    methods, and organized into encryption, integrity and authentication, non-repudiation,
    and tokenization services. There are many associated topics such as random numbers,
    prime numbers, exclusive OR, hashing, and many other functions referenced in this
    book but only as they pertain to cryptographic architectures. Some of the notation
    used in this chapter includes the following abbreviations and acronyms.


    ![images](images/00016.jpeg)


    Cryptography, like mathematics, is an evolving science. What might have been considered
    secure or good practices today can change and become obsolete or vulnerable. Mathematical
    problems once considered difficult enough for cryptographic use have and will
    continue to get resolved such that better and stronger algorithms are always needed.
    Scientific research in physics and quantum computers will continue to increase
    computational capabilities such that strong algorithms eventually become weak
    and need to be replaced. Meanwhile, the fundamental principles in this book remain
    valid and continue to be valuable.


    ### 2.1 Encryption


    Encryption provides data confidentiality, either in storage or during transmission.
    In general, the encryption process transforms data from cleartext to ciphertext
    using a cryptographic key such that any party without access to the key cannot
    reverse the process. However, encryption does not provide data integrity, as the
    ciphertext can still be altered rendering the decrypted data useless. See [Section
    2.3](#part0007.html#sec2_3) for a discussion on data integrity and authentication.


    Symmetric encryption is depicted in [Figure 2.1](#part0007.html#fig2_1) showing
    cleartext transformed into ciphertext and back into cleartext. The same key is
    used to encrypt and to decrypt, hence the term “symmetric” cryptography, sometimes
    called “secret key” to distinguish symmetric keys from asymmetric keys. Following
    the data path in [Figure 2.1](#part0007.html#fig2_1) from left to right, the cleartext
    and key are inputs into the `encrypt` function which yields the ciphertext. The
    ciphertext and the same key are inputs into the `decrypt` function which recovers
    the original cleartext.


    ![](images/00017.jpeg)


    Figure 2.1 Symmetric encryption.


    When a sender and receiver are involved, as noted with dotted boxes, the sender
    encrypts the cleartext and transmits the ciphertext to the receiver. The receiver
    uses the same key to decrypt the ciphertext for recovering the cleartext. In this
    manner, any third party attempting to access the transmitted data can only “see”
    the ciphertext and is unable to read the cleartext. Thus, only the sender and
    receiver who have access to the key can access the cleartext. However, if the
    sender or receiver shares the key with other parties, the overall system security
    can be weakened. See [Chapter 3](#part0008.html#ch03) for further details and
    [Chapter 7](#part0012.html#ch07) for key management issues and practices.


    Asymmetric encryption is illustrated in [Figure 2.2](#part0007.html#fig2_2) showing
    cleartext transformed into ciphertext and back into cleartext but using different
    keys to encrypt and decrypt. Asymmetric keys always come in pairs, where one key
    is called the public key and the other private key. Following the data path from
    left to right, the cleartext and public key are inputs into the `encrypt` function
    which yields the ciphertext. The ciphertext and private key are inputs into the
    `decrypt` function which recovers the original cleartext. Cleartext encrypted
    using the public key cannot be decrypted using the public key, only the corresponding
    private key will work.


    When a sender and receiver are involved, as noted with dotted boxes, the sender
    encrypts the cleartext using the receiver’s public key and transmits the ciphertext
    to the receiver. The receiver uses the corresponding private key to decrypt the
    ciphertext to recover the cleartext. Thus, only the receiver who has access to
    the private key can decrypt the data. The sender already has access to the cleartext.
    In general, anyone who has the receiver’s public key can encrypt data, but only
    the receiver who has the private key can decrypt the data. Asymmetric key pair
    owners should never share the private key, although keys might be backed up for
    recovery or escrowed due to legal or contractual requirements. See [Chapter 3](#part0008.html#ch03)
    for further details and [Chapter 7](#part0012.html#ch07) for key management issues
    and practices.


    ![](images/00018.jpeg)


    Figure 2.2 Asymmetric encryption.


    Since encryption can only provide data confidentiality, other cryptographic services
    are needed to address data integrity and authentication. However, since many integrity
    and authentication techniques use hash functions, hashing is discussed in [Section
    2.2](#part0007.html#sec2_2).


    ### 2.2 Hash Functions


    Hash functions are shown in [Figure 2.3](#part0007.html#fig2_3), but note that
    hashing is not necessarily a cryptographic function; hash functions do not use
    cryptographic keys. Rather, many cryptographic methods employ hash functions.
    But not all hash functions are good enough to be used with cryptographic methods;
    a sufficiently strong hash is called a cryptographic hash. The basic hash process
    is to input the cleartext into a hash function whose output is a hash value, often
    just called a hash. We denote the hash function as `H(C) = h` where uppercase
    `H` is the hash function, uppercase `C` is the input cleartext, and lowercase
    `h` is the output. Any hash function inputs a variable length cleartext but outputs
    a fixed length hash.

