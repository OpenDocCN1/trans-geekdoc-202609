    The goal, of course, is to achieve the lowest reasonable risk with the fewest
    security controls that cost the least amount of resources to save money. This
    is sometimes called the Magic Box that represents sufficiently low risk with acceptable
    security controls. For example, if the probability of a successful attack is considered
    too remote, or the impact to business is viewed minimal, the security controls
    are less likely to be implemented, especially of the security control is costly
    and disproportional to the value of the application and its data. Conversely,
    if the benefit of the security control such as reduced risk or regulatory compliance
    is sufficiently high and the overall cost is acceptable and proportional to the
    application (and its data), the security control is more likely to be implemented.


    The ISO/IEC Code of Practice for Information Security Management standard [[74](#part0016.html#ref_74)]]
    recommends that information security policy document approved by management incorporates
    a framework for setting control objectives and controls, including the structure
    of risk assessment and risk management. An example framework is the Risk Management
    Framework for the Federal Information Security Management Act provides a six-step
    process [[75](#part0016.html#ref_75)].


    ![](images/00089.jpeg)


    Figure 7.1   Risk reduction curve.


    1. `Categorize` the information system and the information processed, stored,
    and transmitted by that system based on an impact analysis. This step, including
    consideration of legislation, policies, directives, regulations, standards, and
    organizational mission/business/operational requirements, facilitates the identification
    of security requirements.

    2. `Select` an initial set of baseline security controls for the information system
    based on the security categorization; tailoring and supplementing the security
    control baseline as needed based on an organizational assessment of risk and local
    conditions.

    3. `Implement` the security controls and describe how the controls are employed
    within the information system and its environment of operation.

    4. `Assess` the security controls using appropriate assessment procedures to determine
    the extent to which the controls are implemented correctly, operating as intended,
    and producing the desired outcome with respect to meeting the security requirements
    for the system.

    5. `Authorize` information system operation based on a determination of the risk
    to organizational operations and assets, individuals, other organizations, and
    the nation resulting from the operation of the information system and the decision
    that this risk is acceptable.

    6. `Monitor` the security controls in the information system on an ongoing basis
    including assessing control effectiveness, documenting changes to the system or
    its environment of operation, conducting security impact analyses of the associated
    changes, and reporting the security state of the system to designated organizational
    officials.


    However, it is often difficult to implement or measure one security control that
    does not affect or rely on other controls. For example, imposing a password construction
    rule (e.g., eight characters consisting of both uppercase and lowercase letters
    with at least one number and one special character) actually reduces the set of
    possible passwords. At the same time, no password construction rules allow users
    to choose poor and easily guessable passwords. Thus, adding a password construction
    control affects the password authentication control. But rarely does any security
    control operate in a vacuum, see [Figure 7.2](#part0012.html#fig7_2) for a security
    model. The aggregate security needs to be understood to determine the overall
    risks versus controls.


    [Figure 7.2](#part0012.html#fig7_2) shows a layered “onion” approach to evaluate
    risk and controls. Cryptographic keys are used to protect data. Cryptographic
    modules are used to protect cryptographic keys. But a cryptographic module might
    be a software library bundled with a computer system, embedded within application
    software, or enclosed within a cryptographic hardware security module (`HSM`).
    Regardless, systems protect cryptographic modules. And ultimately, facilities
    with physical and logical security controls protect systems. However, with respect
    to cryptographic architectures, there is an intrinsic standards gap, shown in
    [Figure 7.3](#part0012.html#fig7_3).


    When a standard for a cryptographic algorithm, key management scheme, or security
    protocol is published, it will contain requirements (e.g., shall) and recommendations
    (e.g., should) that the reader is expected to understand. Unfortunately, when
    such a security standard is productized there is often a gap between what the
    standard says versus what the product does. This is due to a variety of factors
    including lack of understanding, lack of knowledge, lack of expertise, design
    flaws, coding errors, cost limitations, and time to market. Today’s information
    technology industry tends to push products to market faster with less testing
    such that bug fixes, patches, and frequent modifications are now a common theme.
    Unfortunately, this is often true for cryptographic products whose updates can
    sometimes adversely affect security controls.


    ![](images/00090.jpeg)


    Figure 7.2   Security model.


    ![](images/00091.jpeg)


    Figure 7.3   Standards gaps.


    Another gap source is the installation of cryptographic products. When a cryptographic
    product is misconfigured, its security can be compromised. Some products support
    older algorithms, weaker keys, or aging protocols, for backwards compatibility.
    If the unwanted offerings cannot be disabled but just not used, the vulnerable
    methods might be inadvertently or intentionally be used, increasing risk to the
    application environment. Further, if the product is used in a manner inconsistent
    with the corresponding standard or the manufacturer’s recommendation, it can increase
    risk. For example, a cryptographic product intended to encrypt data but instead
    is used to encrypt keys increases the risk of a key compromise.


    Once a product is installed, it needs to be properly managed. Access controls
    need to be in place to avoid unauthorized re-configurations. Bug fixes, patches,
    and modification need to be applied but only after the updates have fully tested
    in a nonproduction environment. Processing needs to be monitored to ensure no
    attacks are active. Configuration changes, software changes, and processing all
    need to be logged, and the logs need to be analyzed. However, if the product is
    improperly managed the gap might increase risk, and over time the gap might increase.


    The following sections discuss each of the layers: Facility Security, System Security
    Cryptographic Modules, Key Management, and Data Management. The first layer Facility
    Security discusses physical and logical controls.


    ### [7.1 Facility Security](#part0003.html#Rsec7_1)


    Facility security includes a wide variety of physical and logical controls to
    protect systems, which in turn protect cryptographic modules, which protect cryptographic
    keys, which are used to protect data. [Figure 7.4](#part0012.html#fig7_4) illustrates
    an example datacenter surrounded by a security fence and encircled by a drainage
    ditch. A single entrance with a guard shack provides ingress and egress to the
    campus. Between the parking spaces and the lobby entrance is a circular drive
    enclosed by trees planted on a berm. The building has roof access and is surrounded
    by a pathway.


    ![](images/00092.jpeg)


    Figure 7.4   Physical security.


    The physical security controls afforded by the numerous campus elements represent
    a layered security approach. The various controls provided by each element are
    presented from the campus exterior toward the interior into the actual datacenter.

