    ## Chapter 3 (#part0003.html#rch03)


    ## Cryptographic Keys (#part0003.html#rch03)


    This chapter builds on the information from previous chapters and provides further
    details symmetric keys, asymmetric key pairs, and public key certificates. The
    information presented here remains largely algorithm agnostic, but some algorithm
    specifics are referenced where needed. And although some public key infrastructure
    (`PKI`) components are discussed here, this chapter does not address operational
    aspects; see *Security without Obscurity: A Guide to PKI Operations* [5].


    ![](images/00002.jpeg)

    Chapter 1 (#part0006.html#ch01) provided a cryptography lexicon with a math refresher,
    commonly used notation, and conventional cryptographic terminology.


    ![](images/00002.jpeg)

    Chapter 2 (#part0007.html#ch02) provided an overview of symmetric and asymmetric
    cryptography including encryption, hashes, integrity and authentication, non-repudiation,
    and tokenization.


    The key management methods discussed in this chapter are used in various protocols
    which are addressed in `Chapters 4` (#part0009.html#ch04) and `5` (#part0010.html#ch05).
    The key management schemes discussed in this chapter address both data in transition
    between a sender and a receiver, and data in storage such as a database environment.
    While key management schemes are introduced in this chapter, the key management
    lifecycle and cryptographic modules are discussed in `Chapter 7` (#part0012.html#ch07).


