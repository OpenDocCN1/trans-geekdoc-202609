    使用密钥传输或密钥协商方案建立的会话密钥（SKs）不对称私钥泄露，将会受到威胁。例如，获取了私钥并拥有网络流量记录的攻击者，可以在几小时、几天、几个月甚至几年后重新建立
    SKs 并解密数据。图 3.15 显示了针对这种易感性的加密应对措施，即被称为使用临时密钥（ephemeral keys）的“前向安全性”。


    根据定义，临时密钥是短寿命的，与长期静态密钥相反。Alice 和 Bob 都拥有一个由私钥和数字证书组成的长期密钥。此外，其中一个（或双方）拥有由私钥和公钥组成的临时密钥。为了本文的讨论，假设双方都拥有临时密钥。临时公密钥不封装在证书中，因为临时密钥的寿命只有几秒或更短。生成临时密钥，交换公密钥，并将临时密钥作为计算共享密钥的第二步的一部分。


    ![](img/00043.jpeg)


    图 3.15 临时密钥协商。


    ![](img/00002.jpeg)Alice 使用 Bob 的静态和临时公密钥，以及自己的非对称静态临时密钥对计算她的共享密钥。在生成 SKs 后，Alice
    销毁了所有临时密钥。


    ![](img/00002.jpeg)Bob 使用 Alice 的静态和临时公密钥，以及自己的非对称静态临时密钥对计算他的共享密钥。在生成 SKs 后，Bob
    销毁了所有临时密钥。


    一旦临时密钥被删除，攻击者就无法确定 SKs，因为临时私钥已不存在。这假设生成临时密钥的系统在其短暂寿命内没有被破坏。因此，前向安全性得以保留。然而，某些监控系统依赖于访问服务器非对称密钥，而临时密钥干涉了这种访问。图
    3.16 说明了如何复制服务器静态密钥，以便监控系统能够复制密钥建立过程。可以说，监控系统由于业务和运营的需要是合法的；然而，一些安全传统主义者持不同意见。企业需要分析客户交互，运营需要排排除网络问题。取决于网络架构和网络组件（例如路由器、防火墙、负载均衡器），情况会有所不同。


    服务器非对称公私静态密钥通常通过手动过程复制到监控系统。数据分路捕获所有网络流量；每个数据包都会复制，包括密钥建立包和随后的加密数据包。数据包按会话 ID
    组织并记录到磁盘。监控系统可以访问从客户端发送到服务器的任何证书或公密钥，并在访问服务器静态密钥的情况下，重复密钥建立过程以产生 SKs。随后加密数据包就可以被解密。


    然而，有了前向安全性，服务器临时私密钥缺失了。监控系统无法再次完成密钥建立过程，无法再次访问 SKs，因此无法再次解密加密数据包。前向设计的目的是防止服务器私钥泄露时加密数据被记录并解密。讽刺的是，前向安全性也禁用了完全依赖复制服务器密钥来重建密钥的监控系统。


    ![](img/00044.jpeg)


    图 3.16 密钥建立监控。


    ### 3.3 证书与 PKI


    证书和 PKI 在第 2 章 讨论不可否认性时引入。有多种类型的 PKI 凭证，例如 OpenPGP [44] 消息格式、用于私钥信息的 PKCS#8 [35]，以及用于包括私钥或公钥在内的个人信息交换
    PKCS#12 [38]。本书重点关注仅包含公密钥的 `X.509` 证书。`X.509` 标准 [45,46] 和 [47] 中定义的数字证书包含五个主要部分：


    1. 公钥，

    2. 公钥所有者的信息，

    3. 公私密钥对信息，

    4. 颁发机构（CA）的信息，以及

    5. 对前四个组件的 CA 数字签名。


    详情请参见附录：`X.509` 证书快速参考。公钥在数学上与其私钥相关，因此数字证书代表了密钥对和密钥所有者的信息。最重要的是，证书签名 (5) 在公钥 (1)
    和所有者信息 (2) 之间提供了加密绑定。这种绑定本质上是 CA 对密钥对属于所有者的证明。此外，CA 签名还加密地将 CA 信息 (4) 和密钥对信息 (3)
    绑定到所有者信息 (2) 和公钥 (1)。图 3.17 将额外的证书细节与常见 PKI 层次结构的证书链相关起来。


    与主体相关的信息包括其主名称、公钥和相关算法标识、密钥用途指示以及任何主体备用名称 (`SANs`)）。密钥用途可能是主体在提交给注册机构 (`RA`) 的证书签名请求
    (`CSR`) 中显式请求，或者根据主体选择的 `RA` 隐式。任何备用名称都可以在 `CSR` 中显式请求，或通过带外通道提供给 `RA`。


    ![](img/00045.jpeg)


    图 3.17 证书与 PKI。


    与颁发者相关的信息包括其名称、其证书策略和实践，以及证书状态可用性，例如证书吊销列表 (`CRL`) 位置或在线证书状态协议 (`OCSP`) 响应器。


    由颁发者提供的信息包括主体的公钥有效期和证书上的 CA 签名。证书的有效期基于 CA 策略和证书实践声明。证书签名由 CA 使用其安全的私钥生成，并使用 CA
    的公钥进行验证。CA 公钥封装在颁发 CA 证书中。每个证书的签名都使用证书链中下一个证书的公钥进行验证。


    ![](img/00002.jpeg)主体证书的签名使用颁发 CA 证书进行验证。


    ![](img/00002.jpeg)颁发 CA 证书的签名使用从属 CA 证书进行验证。


    ![](img/00002.jpeg)从 CA 证书的签名使用根 CA 证书进行验证。


    ![](img/00002.jpeg)根 CA 证书的签名使用自身的公钥进行验证。


