    Data confidentiality is provided using encryption. Data integrity and authentication
    is provided using `MAC` or `HMAC`, but both are reputable. Digital signatures
    provide data integrity with strong authentication and with appropriate controls
    potentially provide non-repudiation. However, any use of cryptographic keys necessitates
    that keys be managed is a secure manner to prevent misuse, unauthorized access,
    and generally avoid key compromise. For more information regarding the key management
    life cycle, see [Chapter 3](#part0008.html#ch03).


    ### [2.4 Non-Repudiation](#part0003.html#Rsec2_4)


    Non-Repudiation is the set of controls necessary to prevent repudiation, which
    is the refusal by one party to acknowledge an agreement claimed by another party.
    As discussed in *Security without Obscurity: A Guide to Confidentiality, Authentication,
    and Integrity* [[4](#part0016.html#ref_4)], there are technical, cryptographic,
    operational, and legal considerations. Technology considerations include two primary
    industry elements.


    ![](images/00002.jpeg)Extended Validation (EV) certificates; see the CA/Browser
    Forum’s Guidelines for Extended Validation Certificates [[16](#part0016.html#ref_16)].
    EV certificates require additional subject authentication and authorization procedures
    performed by the Registration Authority (RA) and the Certification Authority (CA).
    The historical origin behind EV certificates was an attempt to address an industry
    challenge of invalid certificates. The CA (and RA) is audited to the EV criteria
    and recognized as issuing EV certificates versus regular certificate. An EV-designated
    CA cannot issue regular certificate just as a regular CA cannot issue EV certificates.
    However, EV certificate do not mystically provide digital signatures with non-repudiation
    properties.


    ![](images/00002.jpeg)Certificate key usage “non-repudiation” flag, which has
    been renamed to “content commitment” to avoid confusion; see Annex: X.509 Certificate
    Quick Reference. However, the presence of the flag does not magically manifest
    non-repudiation.


    Rather, each of the public key infrastructure (PKI) participants needs to provide
    the appropriate cryptographic, operational, and legal controls. Cryptographic
    considerations begin with digital signature algorithms. There are numerous digital
    signature algorithms based on asymmetric algorithms. Some of the algorithms are
    named for inventors, whereas others are abbreviations.


    ![](images/00002.jpeg)`RSA` is named for its inventors Ron Rivest,[^(\*)](#part0007.html#fn2_2)
    Adi Shamir,[^†](#part0007.html#fn2_3) and Leonard Adleman[^‡](#part0007.html#fn2_4)
    based on the ground breaking 1978 paper [[9](#part0016.html#ref_9)] and codified
    in the American National Standards Institute (ANSI) standard [[10](#part0016.html#ref_10)].


    ![](images/00002.jpeg)`DSA` is named the Digital Signature Algorithm codified
    in the NIST standard [[11](#part0016.html#ref_11)].


    ![](images/00002.jpeg)`ECDSA` is named the Elliptic Curve Digital Signature Algorithm
    codified in the ANSI standard [[12](#part0016.html#ref_12)].


    Asymmetric digital signatures are depicted in [Figure 2.6](#part0007.html#fig2_6)
    showing cleartext and a private key used to create a digital signature (called
    an ICV in [Section 2.3](#part0007.html#sec2_3)) which can be verified using the
    associated public key encapsulated in a digital certificate [[13](#part0016.html#ref_13)].
    Only the private key can generate the digital signature and only the associated
    public key can verify the signature. Following the data path from right to left,
    the cleartext and private keys are inputs into the `sign` function which yields
    the digital signature. The same cleartext and associated public key are inputs
    into the `verify` function. If the digital signature verifies then the cleartext
    has data integrity, and the digital signature provides strong authentication.


    ```

    ![](images/00022.jpeg)

    Figure 2.6 Digital signature.

    ```


    The digital certificate, sometimes called a public key certificate, is an identity
    credential which contains the public key, the asymmetric key pair owner name,
    the certification authority (CA) name that issued the certificate, and other significant
    information. The difference emphasized between an ICV and a digital signature
    is the PKI required to support digital certificates. However, this book is not
    a guideline [[5](#part0016.html#ref_5)] on operating a PKI but rather provides
    sufficient details on managing certificates and the corresponding private keys.
    See [Chapter 3](#part0008.html#ch03) for more information regarding cryptographic
    keys.


    When a sender and a receiver are involved, as noted with dotted boxes, the sender
    generates the digital signature using the cleartext and the private key. The sender
    transmits the cleartext and the signature to the receiver. The receiver uses the
    same cleartext and associated public key certificate to verity the digital signature.
    The verification process varies depending on which digital signature algorithm
    (`RSA`, `DSA`, and `ECDSA`) is being used. Other digital signature algorithms
    exist and clearly more will be invented as time unfolds but for the purposes of
    this book only these three digital signature algorithms are referenced.


    When the digital signature verifies, the receiver knows the cleartext has data
    integrity, the sender is authenticated, and theoretically since only the sender
    controls the corresponding private key, the receiver has the cryptographic foundation
    for non-repudiation. However, signature verification is not enough, rather certificate
    validation is needed. [Figure 2.7](#part0007.html#fig2_7) illustrates a basic
    certificate chain within any PKI beginning on the left with the subject certificate
    and ending on the right with the trust anchor. The subject certificate links to
    the issuer CA certificate, which links to the subordinate CA (sub-CA) certificate,
    which links to the root CA (trust anchor) certificate. Some PKI might have fewer
    certificates, whereas others have more, but three-tier PKI issuing a subject certificate
    is not an uncommon hierarchy.


    ```

    ![](images/00023.jpeg)

    Figure 2.7 Public key infrastructure.

    ```


    Certificate chain validation involves a series of technical and cryptographic
    steps, anyone of which can fail which negates the overall process. Each certificate
    needs to be individually verified which depends on all of the other certificates.
    See Annex: X.509 Certificate Quick Reference for certificate formats and [Chapter
    3](#part0008.html#ch03) for certificate validation. Once the certificate chain
    validation is successful, the signed information has data integrity, the digital
    signature provides strong authentication, and since only the signer has access
    to the private key, the integrity and authentication is provable to a third party.
    However, in addition to the technical and cryptographic steps already discussed,
    operational and legal controls need to be in place for genuine non-repudiation
    services.


    Operational controls consists of each PKI participant performing according to
    an agreed-upon set of rules to establish trust. Within any PKI are the following
    participants:


    ![](images/00002.jpeg)Subject is the entity whose public key and common name are
    encapsulated within a certificate and who securely manages the corresponding private
    key. The subject maintains information security controls over its system components
    such that access controls are in place and system patches are kept current to
    avoid risks of known vulnerabilities.


    ![](images/00002.jpeg)RA is the entity responsible for authenticating and authorizing
    subjects, but the RA does not issue or revoke certificates. The RA maintains information
    security controls over its systems and personnel such that only authorized processes
    or individuals have access to data and organizational resources.

