    Alice sends an email to Bob. The signer adds the `DKIM` header to the message
    which contains the digital signature, reference to an `DNS RR`, a list of which
    message elements were hashed for the signature, and other related `DKIM` information.
    In this example, `Header 2` and the `Body` text were hashed for the signature;
    thus `Header 1` and `Header 3` have not been signed. The `DNS` record contains
    the signer’s `Public Key` such that the verifier can use the `Public Key` to verify
    the digital signature in the `DKIM` header. The signer generates the digital signature
    using the corresponding private key.


    A common `DKIM` implementation is for the signer and verifier to be an organization
    email system. Alice sends the email from her workstation and her organization
    email system signs the message. Bob’s organization email system verifies the signature
    and delivers Alice’s message to Bob’s workstation. Neither Alice nor Bob needs
    cryptographic keys. Alice’s organizational email system manages a private key
    and provides its corresponding `Public Key` in a `DNS RR`. Bob’s organizational
    email system does not manage cryptography keys, rather Alice’s `Public Key` is
    obtained from the `DNS` record referenced in the `DKIM` header.


    ![](images/00049.jpeg)


    Figure 4.4 DKIM cryptographic architecture.


    ### 4.3 Security Assertion Markup Language (SAML)


    Security Assertion Markup Language (`SAML`) is an authentication and authorization
    scheme developed by the Organization for the Advancement of Structured Information
    Standards (`OASIS`) Security Services Technical Committee. The scheme also supports
    confidentiality. `SAML` is an Extensible Markup Language (`XML`)-based framework
    for communicating authentication, entitlement, and attribute information. [Figure
    4.5] provides a high-level overview of `SAML`. There are many logical entities
    within the `SAML` framework but for the purposes of this book only three are introduced:
    the `SAML` user, the `SAML`-enabled service provider (`SP`), and the `SAML` identity
    provider (`IdP`). The `SAML` framework supports many scenarios which can be described
    by the message path.


    One scenario is a simple user access to an `SAML`-enabled `SP` where the `SP`
    gets the `SAML` token from the `IdP`, `path = (1, 2, 2, 1)`.


    Path (1) the user requests access to an `SAML`-enabled `SP`. The access request
    typically incudes the user’s identity (e.g., `name`) and authentication credentials
    (e.g., `password`, digital signature, mobile device information).


    Path (2) the `SP` sends an `SAML` request to the `SAML` `IdP`. The `SAML` request
    includes the user identity and authentication requests.


    Path (2) the `SAML` `IdP` returns an `SAML` response (also called the `SAML` token)
    to the `SP`. The `SAML` response includes the user authentication validation information
    and authorization attributes.


    Path (1) the `SP` allows (or denies) user access based on the authentication validation
    information and authorization attributes in the `SAML` token.


    A similar scenario is user access to an `SAML`-enabled `SP` where the `SP` redirects
