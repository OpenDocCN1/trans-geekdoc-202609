    ![](images/00002.jpeg)SSL v3.0 was released in November 1996 and later codified
    as a historical document Request For Comment (`RFC 6101`) \[[60](#part0016.html#ref_60)\]
    in August 2011.


    ![](images/00002.jpeg)TLS v1.0 based on SSL v3.0 was published as `RFC 2246` \[[61](#part0016.html#ref_61)\]
    in January 1999.


    ![](images/00002.jpeg)TLS v1.1 was published as `RFC 4346` \[[62](#part0016.html#ref_62)\]
    in April 2006.


    ![](images/00002.jpeg)TLS v1.2 was published as `RFC 5246` \[[63](#part0016.html#ref_63)\]
    in August 2008.


    ![](images/00002.jpeg)TLS v1.3 has been in development since April 2014.


    The various TLS v1.3 drafts make protocol changes to v1.2 including mandating
    ephemeral keys for forward secrecy and deprecating Rivest–Shamir–Adleman (`RSA`)
    since it cannot support ephemeral keys. Ephemeral keys were discussed in [Chapter
    3](#part0008.html#ch03). TLS v1.2 consists of two layers: the TLS handshake protocol
    and the TLS record protocol. The TLS handshake exchanges static X.509 \[[45](#part0016.html#ref_45)\]
    certificates to establish a shared secret from which two keys are derived: the
    encryption key and the Hash Message Authentication Code (`HMAC`) key. [Figure
    5.1](#part0010.html#fig5_1) shows a dotted line between the Transport Layer Security
    (TLS) client and TLS server representing the transport keys. The session keys
    (`SKs`) (encryption and HMAC) might be established using key transport (e.g.,
    `RSA`) or key agreement (e.g., Diffie–Hellman [`DH\]); and key agreement might
    use ephemeral keys for forward secrecy.


    Once the TLS handshake protocol has established the `SKs`, the TLS record protocol
    encrypts each message between the SSL client and the SSL server. The TLS Ciphertext
    record shows four elements: the Content Type, the Protocol Version, the Length
    field, and the Generic Cipher field. The Generic Cipher field includes an HMAC
    of the cleartext data and the encrypted data. There are three encryption options
    for the Generic Cipher: stream cipher encryption, block cipher encryption, and
    the authenticated encryption with additional data encryption. The TLS handshake
    protocol negotiates the cipher suite that defines the key establishment scheme
    for the `SK`, the cipher option, the encryption algorithm, and the hash algorithm
    for the HMAC. From a cryptographic architecture perspective, the TLS protocol
    has the following keys:


    ![](images/00002.jpeg)The TLS client has its public and private transport keys,
    the SSL server X.509 certificate, and the two derived `SKs`: the encryption key
    and the HMAC key.


    ![](images/00002.jpeg)The TLS server has its public and private transport keys,
    the SSL client X.509 certificate, and the two derived `SKs`: the encryption key
    and the HMAC key.


    ![](images/00059.jpeg)


    Figure 5.1   TLS cryptographic architecture.


    Some key establishment schemes such as `RSA` key transport do not require client
    transport keys, only server transport keys are necessary. The TLS client encrypts
    a random number using the TLS server keys which both entities use to derive the
    `SKs`. If ephemeral keys are used, then in addition to the static TLS client and
    host transport keys, one or both entities would have another asymmetric key pair
    and share the public key (`PK`) with the other entity. Ephemeral `PKs` are not
    encapsulated in X.509 certificates due to the key pair brief lifecycle, typically
    a few milliseconds. However, as mentioned, `RSA` cannot support ephemeral keys.


