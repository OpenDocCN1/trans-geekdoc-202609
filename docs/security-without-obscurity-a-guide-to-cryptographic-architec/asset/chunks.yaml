    # 第 6 章


    ## 架构


    架构定义了构成完整系统的各种组件以及这些组件之间的交互。然而，架构可以具有不同视角的多个重点。本章将考虑应用架构、网络架构、信息架构以及密码架构之间的相似与差异。


    ### 6.1 应用架构


    应用架构为业务逻辑的实现提供了图形化描述，可以使用多种方法进行描述。正如 `Chapter 1` 中讨论，图表可能是简单的卡通画。但希望安全专业人员能够获得包含更多信息的架构图。`Figure
