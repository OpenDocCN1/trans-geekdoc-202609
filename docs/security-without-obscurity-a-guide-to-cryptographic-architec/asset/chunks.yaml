    An important issue regarding vendor information is accuracy. Often application
    teams refer to products by the vendor name and not the service or product name.
    Further, service and product names can change due to marketing, but teams might
    refer to the older names. Also, mergers and acquisition can change the company
    name, end product lines, and begin new ones. Any of these factors create confusion
    which the security professional needs to decipher.


    ![](images/00002.jpeg) `User Guidelines` provide great detail on how to install,
    configure, register, and employ services or products, but screenshots convey few
    technical details. The assessor often needs to “read between the lines” to acquire
    specifics. For example, a complete list of cryptographic algorithms might be discovered
    from a graphic pull-down menu.


    ![](images/00002.jpeg) `Technical Specifications` can offer the details needed
    by an assessor but too frequently such documentation is unavailable. Vendors might
    not document such information for a variety of reasons. Services or products might
    change frequently enough such that details are not fully documented. Some vendors
    prefer to not document technical details and keep such knowledge verbally. Other
    vendors might have lost knowledge due to reliance on contractors, use of cryptographic
    libraries, or employee attrition. Yet other vendors refuse to share technical
    specifications regardless of any agreements.


    ![](images/00002.jpeg) `White Papers` written by vendors might provide some technical
    details. Not all vendors publish white papers. More often marketing papers discussing
    the advantages of the vendor’s services or products are available. Marketing papers
    rarely offer any significant technical information. Further, they tend to misuse
    terminology or generalize claims such that it is sometimes better to skip marketing
    papers.


    With regard to vendor documentation, information gathered as hearsay is unsubstantiated
    and hence unreliable. Essentially, if it is undocumented it does not exist. Further,
    if it is not from an authoritative source even the documentation is questionable.
    Vendor interviews help corroborate vendor-provided documentation, but vendor-related
    documentation from an independent source is preferable. For example, as discussed
    in [Chapter 7](#part0012.html#ch07), many products are evaluated per the National
    Institute of Standards and Technology (NIST) cryptographic algorithm validation
    program (`CAVP`) and cryptographic module validation program (`CMVP`). The corresponding
    security policy listing both Federal Information Processing Standard (`FIPS`)
    and non-FIPS algorithms and key lengths has been verified by an NIST-accredited
    laboratory which represents an independent and authoritative evaluation. While
    there are several evaluation programs available worldwide, all are based on various
    industry standards. The importance of industry standards is paramount. Industry
    documentation might include standards, specifications, guidelines, research papers,
    articles, or press releases.


    ![](images/00002.jpeg) `Industry standards` cover a wide range of topics, including
    cryptographic algorithms, key management schemes, security protocols as discussed
    in [Chapters 4](#part0009.html#ch04) and [5](#part0010.html#ch05), and inform
    security management policy and practices. Conventional standards language defines
    requirements using “shall” or “must” statements, recommendations as “should” sentences,
    and options as “may” observations. Standards organizations were described in [Chapter
    1](#part0006.html#ch01).


    ![](images/00002.jpeg) `Industry specifications` address a broad range of security
    protocols. Whereas standards focus on “what” and “why” alternatively specification
    address “how” things are done, more so for interoperability. However, specification
    often uses similar “shall” and “should” language. Vendor services and products
    might implement an industry specification by developing software often based on
    cryptographic libraries, or incorporate an existing cryptographic tool. However,
    as discussed in [Chapter 7](#part0012.html#ch07), there is often a gap between
    implementation versus specification.


    ![](images/00002.jpeg) `Industry guidelines` provide advice and information on
    implementing standards and specifications. Guidelines have many alternate names
    including technical report, supplemental, recommendation, and the like. While
    guidelines do not have the same status as standards or specifications, they can
    provide relevant information regarding recent vulnerabilities or configuration
    advice. Guidance can originate from any source such as standards organizations,
    regulatory agencies, universities, and even vendors.


    ![](images/00002.jpeg) `Industry research papers` can provide details regarding
    Common Vulnerabilities and Exposures[^(\*)](#part0013.html#fn8_1) (`CVE`) for
    algorithms, protocols, crypto libraries, or products. Sometimes the research paper
    is publicly available or it might have limited distribution, but the `CVE` is
    typically posted. Applications, products, or services susceptible to known vulnerabilities
    which need to be fixed. Unfortunately, zero-day attacks are problematic.


    ![](images/00002.jpeg) `Industry articles` provide current news regarding data
    breaches, threats, hacks, and newly posted `CVE`. Articles can also offer opinion
    pieces regarding product safety, reliability, and efficiency. Some articles provide
    links to other articles, industry research papers, or websites with related information.


    ![](images/00002.jpeg) `Industry press releases` provide current news regarding
    mergers, acquisitions, divestitures, bankruptcy, and other announcements. Press
    releases can help clarify vendor names, product names, product releases, and even
    acronyms.


    Enterprise, vendor, and industry documentation can establish a foundational knowledge
    base for any assessment. Undocumented information is fundamentally unreliable
    information. A kickoff meeting to discuss documentation among other project issues
    is helpful. The assessor needs time to review documentation prior to interviews
    or testing. Unfortunately, documentation is often unavailable or provided by request
    during the initial interviews.


    ### 8.2 Interviews](#part0003.html#Rsec8_2)


    Interviews are a crucial assessment mechanism to corroborate documentation. Refer
    to [Figure 8.1](#part0013.html#fig8_1) for an overview of interview inputs. Interviews
    include conversations within the enterprise and with vendors. Enterprise interviews
    are with business managers, application managers, database managers, administrators,
    engineers, developers, and possibly contractors. Vendor interviews might be with
    account representatives, product managers, or engineers.


    Some assessments might be adversarial in nature. For example, an external assessor
    might be assigned by another legal authority for a necessary but unwelcomed assessment.
    As another example, an external or internal assessor might be assigned by an internal
    authoritative group such as senior management or internal audit. Conversely, a
    more cooperative assessment is when the project team requests an assessment to
    engage a security professional.


    When documentation is previously available, it can be used to coordinate interviews
    versus haphazardly discussing topics or asking random questions. Documentation
    should be listed in order of priority, and then the various table of contents
    can be used as an agenda. Care should be taken to avoid repeatedly asking the
    same question. However, at the same time, the same topic can be queried to confirm
    answers. As questions are asked and answers are collected, it is extremely important
    to be mindful for conflicting or inconsistent answers. This is especially true
    tracking answers from one interview to another.

