    这是《非隐晦性安全》系列的第三本书。第一本是我独立完成的。在此之前，我为其他书籍编写过文章和章节，但还没有自己的著作。第二本书是因为我与 Clay Epstein\
    \ 的合作而产生的，当时我并没有编写第三本书的特别计划。这本书的诞生源于以下几点。\n\n首先，在我的职业生涯中，我多次需要挖掘产品、应用和网络的密码细节。从密码学的角度来看，理解“谁、什么、为什么、在哪里、何时以及如何”这些问题是信息安全的关键。很多信息难以确定；错误信息和虚假信息毫无帮助。例如，供应商或服务商可能不愿透露细节，开发者提供的数据不可靠，或者产品规格已经过时。\n\
    \n此外，供应商和服务提供商会进行合并。知识会在员工或承包商离开时流失。产品线可能会停产并运行过旧软件。\n\n其次，在不配合或对抗性的环境下进行安全评估需要一套只有通过经验才能获得的技能。但是可靠的流程可以提供一致的结果。多年来，要做和不该做什么已包含在教训中。这些流程在良好的情况下同样适用。书中有一整个章节专门讨论风险评估。\n\
    \n第三，我在 2017 年 7 月的《ISSA Journal》上发表了名为《密码架构：失踪》的文章。该文章位于期刊封面，并于 2018 年 1 月在《2017\
    \ 年最佳文章》中重新出版。然而，我有很多可以讨论的内容，但六页的文章提供的信息有限。我将文章交给了我的出版商，他同意这个主题可以写成另一本好书。\n\n"
- fmt: '

    On another note, the ISSA article and this book refer to simple applications or
    network diagrams as cartoons. I personally credit Don Provencher[^(\*)](#part0004.html#fnf_1)`
    a former colleague at Bank of America, coining the term “cartoon” when referring
    to simplistic diagrams. Don was extremely knowledgeable about network architectures
    and was able to educate even me. We all miss you, Don.


    In the first book, I mentioned my long-term participation with `X9` standards.
    My participation and chairing the `X9F4` workgroup endures to this day. The `X9F4`
    program of work continues to grow with new standards and technical reports. Meanwhile,
    I continue to have a day job, work on `X9` standards, and write this book. All
    of this with the loving support from my wife, Linda, and everyone still likes
    her best.


    [^(\*)](#part0004.html#fnf_1a) [www.legacy.com/obituaries/timesunion-albany/obituary.aspx?pid=186270529](http://www.legacy.com/obituaries/timesunion-albany/obituary.aspx?pid=186270529)


    ## Author (#part0003.html#rch00_fm06_author)


    `J. J. Stapleton` has been involved with cryptography, public key infrastructure
    (`PKI`), key management, and numerous other information security technologies
    since 1989 when he attended his first Accredited Standards Committee `X9` work-group
    meeting. He has continued his `X9` membership across many employers and has been
    chair of the `X9F4` cryptographic protocol and application security work-group
    since 1998.


    ![Images](images/00002.jpeg)Jeff began as a software engineer at `Citi Information
    Resources` in 1982 when he was still working on his bachelors of science in computer
    science from the University of Missouri–St. Louis (`UMSL`).


    ![Images](images/00002.jpeg)Jeff continued his career as a developer at `MasterCard`
    in 1984, managed developers on card payments applications, and began working on
    his masters of science in computer science from the University of Missouri–Rolla
    (`UMR`, now renamed Missouri Science and Technology). He also began his long-term
    `X9` affiliation.


    Jeff was assigned the design and development of a key management service (`KMS`)
    for the `MasterCard` network `Banknet`. The `KMS` was literally 24 hour from going
    live in production when a strategic decision to replace the then current `IBM
    Series/1` minicomputers with a to-be-determined platform delayed the `KMS` project.
    He was able to take advantage of the experience by writing his thesis: `Network
    Key Management in a Large Distributed Network`, `J. J. Stapleton`, 1992, a thesis
    presented to the faculty of the Graduate School of `UMR` approved by Daniel C.
    St. Clair, Chaman L. Sabharwal, and James Hahn.


    He actively participated in the development of the `X9` technical guideline `TG-3`
    personal identification number (`PIN`) Security Compliance Guideline (renumbered
    as technical report `TR-39`). The guideline provides evaluation criteria based
    on industry standards (`X9.8` and `X9.24`) that defined security requirements
    for handling `PINs` and associated cryptographic keys. `TG-3` was adopted by many
    payment networks for a biennial security assessment for interoperability.


    Another accomplishment was his involvement in the development of the `Secure Electronic
    Transaction (SET)` specification, a joint venture between `Visa` and `MasterCard`
    for online card payments. As part of the `SET` project, he also worked with `Netscape`
    in their development of the `Secure Socket Layer Protocol`.


    ![Images](images/00002.jpeg)Jeff joined `Security Dynamics` (renamed `Rivest-Shamir-Adleman
    (RSA) Security`) in 1996 when his division at `MasterCard` was sold to `Global
    Payment Systems`. He became part of `RSA Labs`, continued his `X9` standards affiliation,
    and became the `X9F4` workgroup chair.


    ![Images](images/00002.jpeg)Jeff continued chairing `X9F4` when he joined the
    auditing firm `KPMG` in 1998. `SET` had continued to evolve, and he led the `KMPG`
    team in the worldwide security assessment of the `SET` brand certification authorities
    (`CA`) in Japan, the United States, and France.


    He actively participated in the development of the `American National Standard
    X9.79 PKI Policy and Practices`, and was involved with the `American Institute
    of Certified Public Accountants (AICPA)` in the adoption of `X9.79` which eventually
    became the `Webtrust for CA` auditing standard. He also helped build the `CA`
    auditing program at `KPMG`.


    He also assisted a major financial institution establish their first `PKI` including
    their certificate policy and certificate practice statement (`CPS`).


    ![Images](images/00002.jpeg)Jeff was one of the founders of `Cryptographic Assurance
    Services (CAS)` in 2008, offering `TG-3` assessments and `Qualified Security Assessor
    (QSA)` evaluations as a `Payment Card Industry (PCI)` certified company. He continued
    as the `X9F4` chair.


    In addition to performing numerous `TG-3` assessments and `QSA` evaluation, Jeff
    assisted a major security company establish their first `PKI` including their
    certificate policy and `CPS`, key generation ceremony procedures, and completing
    a `Webtrust for CA` audit and `Webtrust for Extended Validation` audit.


    ![Images](images/00002.jpeg)Jeff joined `Bank of America` in 2010 and eventually
    `CAS` ceased doing business when its contracts were completed. Meanwhile, he continued
    as the `X9F4` chair and published the first `Security without Obscurity` in 2014.


    ![Images](images/00002.jpeg)Jeff joined `Wells Fargo` in 2015, continued as the
    `X9F4` chair, and published the second `Security without Obscurity` in 2016. Jeff
    is the primary author of several other books discussing cryptography.

