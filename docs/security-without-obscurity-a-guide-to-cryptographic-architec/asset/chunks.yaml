    The issuer provides a payment card and `PIN` to the cardholder using separate
    delivery methods, such as two different letters. The cardholder makes a purchase
    at a merchant submitting the payment card and entering the `PIN` into a point-of-sale
    (POS) terminal. The terminal encrypts the `PIN` using a symmetric PIN encryption
    key (`PEK`). The first `PEK` is shared with the acquirer system that provides
    payment services to the merchant. The acquirer translates the `PIN` from the `PEK`
    shared with the POS terminal to another `PEK` shared with `network A` that provides
    payment services to the acquirer. `Network A` translates the `PIN` from the `PEK`
    shared with the acquirer to a different `PEK` shared with `network B` that provides
    payments services to the issuer. `Network B` translates the `PIN` from the `PEK`
    it shares with `network A` to the `PEK` it shares with the issuer. The issuer
    decrypts the `PIN` so it can verify the `PIN` using PIN verification keys.


