    # International Electrotechnical Commission (IEC) [#part0006.html#fn1_9]

    `IEC` develops worldwide standards for electrical, electronic, and related technologies
    (known collectively as “electrotechnology”) based on consensus with 83 participating
    member countries and over 2,000 industry experts. `IEC` is organized into over
    100 `TCs` and cooperates with `ISO` and `International Telecommunication Union`
    (`ITU`) by means of joint committees. Relevant to this book is the `ISO/IEC Joint
    Technical Committee One` (`JTC1`) for information technology.


    # International Telecommunication Union (ITU) [#part0006.html#fn1_10] is the United
    Nations specialized agency for information and communication technologies. The
    `ITU` study group `Telecommunication Standardization Sector` (`ITU-T`) develops
    worldwide standards (called `ITU-T Recommendations`) based on consensus with 176
    member countries. `ITU-T` is organized into 11 active study groups. Relevant to
    this book is the `ITU-T` study group `SG17` for Security.


    Note that the `ITU-T` offers many of its standards [#¶¶](#part0006.html#fn1_11)
    for free.


    `ISO`, `IEC`, and `ITU-T` are basically the three pillars for international standardization.
    Membership is at the country level where each country has a designated `NSB`.
    Each country’s `NSB` is responsible as the technical advisory group (`TAG`), but
    this can be delegated to other groups accredited by the `NSB` as an `SDO`.


    # American National Standards Institution (ANSI) [^\*](#part0006.html#fn1_12)
    is the `NSB` for the United States. `ANSI` does not develop standards per se but
    rather accredits other `SDO` per various industry segments and assigns them as
    `US TAG` to `ISO`, `IEC`, or `ITU` committees. `ANSI` currently has accredited
    282 `SDO` and assigned 584 `TAG` to various `ISO` `TCs` and subcommittees. Relevant
    to this book are `SDOs`’ `National Institute of Standards and Technology` (`NIST`),
    `International Committee for Information Technology Standards` (`INCITS`), `Accredited
    Standards Committee X9` (`ASC X9`), `Organization for the Advancement of Structured
    Information Standards` (`OASIS`), and `Institute of Electrical and Electronics
    Engineers` (`IEEE`).


    # National Institute of Standards and Technology (NIST) [^\†](#part0006.html#fn1_13)
    is a US government agency that promotes innovation and industrial competitiveness
    by advancing measurement science, standards, and technology. Within the `NIST`
    organization, the `Information Technology Laboratory` (`ITL`) is an `ANSI SDO`.
    However, `NIST` also produces its own `Federal Information Processing Standards`
    (`FIPS`) Publications and Special Publication. Relevant to this book are several
    `FIPS` and Special Publications numbered from the 800 series.


    # International Committee for Information Technology Standards (INCITS) [^\‡](#part0006.html#fn1_14)
    is an `ANSI`-accredited `SDO` and the `TAG` to `ISO/IEC JTC1` with 500 participating
    member organizations. `INCITS` was originally named the `Accredited Standards
    Committee X3` from 1961 to 1996, and currently has eight `TCs` and manages over
    a dozen `TAG` relationships with various `ISO` committee and `JTC1` subcommittees.
    For example, `INCITS` is the `TAG` to `Technical Committee 307` blockchain and
    distributed ledger. Relevant to this book are `TCs` B10 Identification Cards and
    Related Devices, `CS1` Cyber Security, and `M1` Biometrics.


    # Institute of Electrical and Electronics Engineers (IEEE) [^\§](#part0006.html#fn1_15)
    pronounced “Eye-triple-E” is an `ANSI`-accredited `SDO` and `TAG` to `ISO/IEC
    JTC1` subcommittees with more than 423,000 individuals from more than 160 countries.
    Relevant to this book is the `Technical Committee on Security and Privacy`.


    # Accredited Standards Committee X9 (ASC X9) [^\¶](#part0006.html#fn1_16) is an
    `ANSI`-accredited `SDO`, the `TAG` to `ISO TC68`, and the `TC68` secretariat with
    112 participating member organizations. `X9` has five active subcommittees and
    manages several `TAG` relationships with `TC68` subcommittees. Relevant to this
    book is the `X9F` Information Security subcommittee with its three active workgroups:
    `X9F1` Cryptographic Tools, `X9F4` Cryptographic Protocols and Application Security,
    and `X9F6` Cardholder Authentication and Integrated Circuit Chip (`ICC`).


    # Organization for the Advancement of Structured Information Standards (OASIS)
    [^\*](#part0006.html#fn1_17)

    `OASIS` is an `ANSI`-accredited `SDO`. `OASIS` was originally named `XML` from
    1993 to 1998. Relevant to this book are `XML`, `PKCS`, and `Security Markup Language`
    (`SAML`).


    # Internet Engineering Force (IETF) [^\†](#part0006.html#fn1_18)

    `IETF` is an `ANSI`-accredited `SDO`. `IETF` offers many of its standards for
    free. [^\‡](#part0006.html#fn1_19)


    # American Public Accountants (AICPA) [^\§](#part0006.html#fn1_20)

    `AICPA` is an `ANSI`-accredited `SDO`. `AICPA` offers many of its standards for
    free.


