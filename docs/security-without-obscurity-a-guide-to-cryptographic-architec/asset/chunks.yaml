    ![](images/00002.jpeg)For SSH transport, the SSH client has its DH public and
    private keys, the SSH host PK (preferably encapsulated within an X.509 certificate),
    and the two derived SKs: the encryption key and the HMAC key.


    ![](images/00002.jpeg)For SSH authentication, the SSH client might also have its
    digital signature (e.g., RSA) private key.


    ![](images/00002.jpeg)For SSH transport, the SSH host has its DH public and private
    keys, the SSH client PK (preferably encapsulated within an X.509 certificate),
    and the two derived SKs: the encryption key and the HMAC key.


    ![](images/00002.jpeg)For SSH authentication, the SSH host might also have the
    client’s digital signature PK (preferably encapsulated within an X.509 certificate).


    If ephemeral keys are used, then in addition to the static SSH client and host
    DH public and private keys, one or both entities would have another DH key pair
    and share the PK with the other entity. Ephemeral PKs are not encapsulated in
    X.509 certificates due to the key pair brief lifecycle, typically a few milliseconds.


    RSA key transport which does not support ephemeral keys was added to SSH transport
    RFC 4432 [[71](#part0016.html#ref_71)] later the same year. For RSA key transport,
    only the SSH host needs a key pair. The SSH client encrypts a random number using
    the SSH host PK, the SSH host decrypts the random number, and both sides derive
    the SKs (encryption and HMAC). In addition to the SSH host, the SSH client might
    also have its own RSA key pair to digitally sign a challenge so that the SSH host
    can authenticate the SSH client.


    ![](images/00063.jpeg)


    Figure 5.5 SSH cryptographic architecture.


    ### [5.4 Pretty Good Privacy (OpenPGP)](part0003.html#Rsec5_4)


    OpenPGP [[72](#part0016.html#ref_72)] is a standardized security protocol based
    on Pretty Good Privacy® (PGP) originally developed by Philip R. Zimmermann[^(\*)](#part0010.html#fn5_2)
    published in 1991. PGP® was a collection of software functions providing encryption,
    digital signatures, and key management. OpenPGP messages are composed of various
    packets identified by tag numbers. [Figure 5.6](#part0010.html#fig5_6) provides
    two examples of messages sent from Alice to Bob and Chuck, one message using asymmetric
    key encryption, and another using symmetric key encryption. Both messages use
    symmetric data encryption for confidentiality and hashing for data integrity.


    From a cryptographic perspective, each participant has a key ring containing its
    public and private keys, and the PKs of the others. Any symmetric keys are encapsulated
    within the messages and not the participants’ key rings.


    ![](images/00002.jpeg)Alice’s key ring: contains her private and public keys,
    Bob’s PK, and Chuck’s PK.


    ![](images/00002.jpeg)Bob’s key ring: contains his private and public keys, Alice’s
    PK, and Chuck’s PK.


    ![](images/00002.jpeg)Chuck’s key ring: contains his private and public keys,
    Alice’s PK, and Bob’s PK.


    ![](images/00064.jpeg)


    Figure 5.6 OpenPGP cryptographic architecture.


    The first message (left) is composed of four packets: two Tag 1 packets, a Tag
    9 packet, and a Tag 19 packet. The two Tag 1 packets are public-key encrypted
    session key packets. These packets contain an encrypted SK using the recipient’s
    PK. The single Tag 9 packet is a symmetric-key encrypted session key packet. This
    packet contains data encrypted using a symmetric SK. The final Tag 19 packet is
    a modification detection code packet which contains a hash of the data.


    ![](images/00002.jpeg)Bob can decrypt only one of the Tag 1 packets using his
    private key yielding the SK which is used to decrypt the Tag 9 packet which yields
    the data. Bob uses the Tag 19 packet is used to verify the integrity of the decrypted
    data.


    ![](images/00002.jpeg)Chuck can decrypt only the other Tag 1 packets using his
    private key yielding the SK which is used to decrypt the Tag 9 packet which yields
    the data. Chuck uses the Tag 19 packet is used to verify the integrity of the
    decrypted data.


    The second message (right) is likewise composed of four packets: two Tag 1 packets,
    a Tag 9 packet, and a Tag 19 packet. The two Tag 1 packets are public-key encrypted
    session key packets. These packets contain an encrypted SK using the recipient’s
    PK. The single Tag 9 packet is a symmetric-key encrypted session key packet. This
    packet contains data encrypted using a symmetric SK. The final Tag 19 packet is
    a modification detection code packet which contains a hash of the data.


    ### [5.5 Password and Personal Identification Number](part0003.html#Rsec5_5)


    Knowledge factor authentication is the “something you know” method which includes
    passwords and personal identification numbers (PIN). The methods for transporting
    passwords versus PIN are very different, as are the methods for verifying passwords
    versus PIN. Password and PIN verification was discussed in [Chapter 4](#part0009.html#ch04),
    whereas [Figure 5.7](#part0010.html#fig5_7) shows password versus PIN encryption.
    The upper part of the diagram shows an end user entering a password for password
    verification; the lower part of the diagram shows an end user entering a PIN for
    PIN verification. Regardless of the knowledge factor, the password (or PIN) needs
    to be transported from the point of entry to the point of verification. The end
    user identifier (e.g., name) is used by the verification process to fetch the
    end user profile from a database.


    The password flow (upper diagram) consists of the end user entering and encrypting
    the password, transporting the encrypted password to the verification system,
    and the password decrypted for verification. Rarely are any cryptographic keys
    used exclusively to encrypt a password. Rather, if the password is encrypted at
    all, it is often within a TLS connection. Thus, from a cryptographic architecture
    perspective, the end user system has the PK (or preferably an X.509 certificate)
    of the verification system. The verification system has its public and private
    key pair. The encryption and HMAC SKs are negotiated during the TLS handshake,
    and the password is transported within the TLS data packet. The encrypted password
    is transported from the end user to the verification system.


    The PIN flow (lower diagram) consists of the end user entering the PIN, but a
    dedicated process performs the PIN encryption. The encrypted PIN block is transported
    from one system to another, translated from one symmetric key to another. The
    number of PIN translation will vary as the encrypted PIN block traverses multiple
    networks until it reaches the PIN verification system. The PIN verification then
    decrypts the encrypted PIN block and verifies the PIN as described in [Chapter
    4](#part0009.html#ch04). [Figure 5.8](#part0010.html#fig5_8) provides an example
    of PIN payment process.

