    ### [6.1 Application Architecture](#part0003.html#Rsec6_1)


    Application architectures provide a graphical description of the implementation
    for the business logic which can be portrayed in a wide variety of methods. As
    discussed in [Chapter 1](#part0006.html#ch01), diagrams might be simple cartoons.
    Hopefully however, the security professional is provided with more informative
    architectural diagrams. [Figure 6.1](#part0011.html#fig6_1) continues the network
    scenario introduced in the first chapter. An organization provides web services
    to individuals and a business portal (BP) for external business applications (BAs).
    The backend application (App) and database (DB) servers support the web and BP
    servers located in the network demilitarized zone (DMZ).


    [Figure 6.1](#part0011.html#fig6_1) provides an application process flow view.
    Requests are received by either the web servers or the BP servers and when authenticated,
