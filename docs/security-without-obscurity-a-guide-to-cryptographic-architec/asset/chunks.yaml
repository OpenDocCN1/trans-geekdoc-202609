  trans: '


    每种数据分类都有其相应的安全需求。组织的数据分类策略、标准和实践应清晰地阐述其数据保护安全需求。因此，了解数据所在的位置及其相应的分类有助于根据相关的安全需求定义安全控制措施。请参见图
    6.8，该信息图提供了一个示例，展示了位于路由器、防火墙（FW）以及各种 Web、BP、RAS、App、DB、SS 和 AS 服务器上的大量数据元素。


    ### 网络信息

    网络信息包括互联网协议（IP）地址、防火墙规则、端口和协议号。路由器使用 IP 地址管理众多网络设备和各种服务器之间的流量。防火墙使用 IP 地址和规则根据允许的端口和协议允许或阻塞流量。防火墙或
    Web 服务器可能运行 WAF（Web 应用防火墙），对数据包内容进行更深层的分析。


    ![](img/00075.jpeg)

    图 6.8 信息图。


    ![](img/00002.jpeg)端口和协议号是公开数据。

    ![](img/00002.jpeg)IP 地址被视为私有数据。

    ![](img/00002.jpeg)防火墙规则被归为机密数据。


    ### 应用信息

    应用信息包括客户标识（ID）、客户端 ID、消息、应用（App）日志、系统（sys）日志、客户配置和客户端配置。Web 服务器使用客户 ID 将合法消息转发到
    App 服务器，但拦截非合法或过期的客户 ID。BP 服务器使用业务客户端 ID 将合法消息转发到 App 服务器，但拦截非合法或过期的客户端 ID。App
    服务器使用客户 ID 或客户端 ID 从 DB 服务器获取相应的客户配置或客户端配置以处理消息。


    ![](img/00002.jpeg)客户 ID 是私有的。

    ![](img/00002.jpeg)客户端 ID 是私有的。

    ![](img/00002.jpeg)消息是私有的。

    ![](img/00002.jpeg)应用日志是机密的。

    ![](img/00002.jpeg)系统日志是机密的。

    ![](img/00002.jpeg)客户配置是机密的。

    ![](img/00002.jpeg)客户端配置是机密的。


    ### 管理信息

    管理信息包括员工 ID、命令、应用日志和系统日志。RAS 使用员工 ID 将有效命令转发到 AS，但拦截无效命令。AS 使用员工 ID 将相关命令转发到 SS。


    ![](img/00002.jpeg)员工 ID 是私有的。

    ![](img/00002.jpeg)命令是机密的。

    ![](img/00002.jpeg)应用日志是机密的。

    ![](img/00002.jpeg)系统日志是机密的。


    然而，私有数据和机密数据可以被许多人员访问：包括客户、客户端、员工和管理员。因此，将加密密钥作为普通数据进行管理是一种不可接受的做法。第 3 章 讨论了使用各种方案安全管理密钥的重要性。第
    7 章 讨论了加密模块和密钥管理周期的意义。一个极其重要的安全准则是：加密密钥不是数据，它们是用来保护数据的，因此不能作为数据进行管理。因此，除了应用架构、网络架构和信息架构之外，加密架构的需求是必不可少的。缺乏加密架构是一个明确且紧迫的风险。


    ### 6.4 加密架构


    加密架构基本上可以涵盖新闻中的“五 W 和 H”问题：**谁**在使用密钥、密钥的**类型**是什么、**为什么**使用密钥、密钥存储**在哪里**、**何时**使用密钥以及**如何**使用密钥。


    ![](img/00002.jpeg)谁在使用密钥：识别实体，无论是个人、移动设备、笔记本电脑、服务器、网络设备还是应用程序。

    ![](img/00002.jpeg)密钥的类型是什么：定义对称或非对称算法以及密钥长度。

    ![](img/00002.jpeg)为什么使用密钥：传达安全目的，如加密、身份验证、完整性、不可否认性或令牌化。

    ![](img/00002.jpeg)密钥存储在哪里：获取位置信息，例如在互联网上、DMZ 内部或内部网络中。

    ![](img/00002.jpeg)何时使用密钥：提供加密协议信息，如身份验证、加密或密钥建立。

    ![](img/00002.jpeg)如何使用密钥：提供有关加密协议（如 TLS 密码套件）内部密钥使用的更多细节。


    加密信息可以使用图表或其他格式（如列表、表格或其他表格）进行记录。虽然列表很有价值，但它们没有提供视觉视角；俗话说一图胜千言。现有的应用图或网络图可以被复用，也可以开发专门的插图。例如，图
    6.8 显示了包含加密信息的应用架构。


    Web 服务器拥有 TLS 密钥（一个私有非对称密钥和一个公钥证书），用于与浏览器的外部 HTTPS 连接。由于浏览器不提供客户端证书，Web 服务器会将服务器证书作为
    `TLS` 握手的一部分发送给浏览器，以建立对称会话密钥。浏览器需要验证 Web 应用证书，包括指向信任根的证书链（如证书环所示）。


    Web 服务器还存储了经过加盐和哈希处理的密码，用于个人身份验证和授权。然而，这里没有使用密钥。个人使用浏览器输入的密码通过 `HTTPS` 连接传输，由
    Web 服务器进行加盐和哈希处理，然后与存储的版本进行比对。


    BP 服务器拥有 TLS 密钥（另一个私有非对称密钥和一个公钥证书），用于与 BA 服务器的外部 TLS 连接。同样，BA 服务器也拥有 TLS 密钥（一个私有非对称密钥和一个公钥证书），用于双方身份验证。双方交换
    TLS 证书以建立对称会话密钥。此外，双方都需要验证对方的 TLS 证书，包括指向信任根的证书链。注意，这两个证书链很可能指向不同的信任根。


    App 服务器拥有 TLS 密钥（一个私有非对称密钥和一个公钥证书），用于与 Web 服务器和 BP 服务器的内部 TLS 连接。Web 服务器和 BP 服务器在它们的外部和内部
    TLS 连接中复用相同的证书。因此，App 与 Web 服务器以及 App 与 BP 服务器之间的 TLS 连接具有双向身份验证。此外，所有服务器都需要验证交换的证书，包括指向信任根的证书链。由于
    Web 和 BP 证书也用于外部连接，而 App 证书仅用于内部连接，App 证书可能会指向不同的信任根。


    DB 服务器没有任何 TLS 密钥，因为与 App 服务器的内部连接并非通过安全通道。然而，安全专业人员应该能够论证：虽然连接是在私有网络上进行的，但 App
    与 DB 服务器之间传输的数据敏感性以及未经验证连接的相对风险，值得建立 TLS 连接。无论如何，DB 服务器拥有一个用于数据库加密（DBE）的对称密钥。


    '
