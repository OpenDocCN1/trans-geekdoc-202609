    安全专业人员的角色包括信息安全咨询。咨询包括确定已实施哪些安全控制措施、识别控制缺口、协助业务部门（LOB）评估风险以及建议解决方案。然而，确定控制措施往往会产生问题。正如第
    1 章所讨论的，知识通常分散在各个团队中，如应用程序组、网络组、数据库组、管理员以及各种开发人员。收集和整合信息是任何安全专业人员的一项技能；如图 8.1
    所示，这包括筛选文档、进行访谈、测试、执行分析并最终生成报告。


    在评估开始时，安全专业人员对于问题、产品、应用程序、环境或业务可能掌握的很少或完全没有信息。收集信息往往是困难的。评估者可能是企业外部人员（以进行独立评估），也可能是员工（以进行内部评估）。企业的规模、复杂性和组织结构可能会阻碍知识共享。个人或小组可能由于内部政治、个人意图或推卸责任而保留相关信息。产品制造商和服务提供商有时不愿分享细节，或由于知识流失而无法分享。合并、收购、产品周期结束和重品牌都会影响信息。唐纳德·拉姆斯菲尔在
    2002 年向北大西洋条约组织的报告中引用了 \[96\]，描述了其中已知和未知的情况。


    现在这里传达的信息是什么？信息就是没有所谓的“已知”。我们有自己自己知道的事。有“已知的未知”。也就是说，我们现在知道自己不知道某些事。但还有“未知的未知”。即我们不知道自己不知道某些事。所以，当我们尽所努力并将所有信息整合在一起，然后说“好吧，这基本上是我们对形势的看法”，那实际上仅仅是“已知的已知”和“已知的未知”。而每年我们都会发现更多此类的“未知的未知”。


    **唐纳德·拉姆斯菲尔**


    ![](img/00106.jpeg)


    图 8.1 评估流程。


    评估也存在类似的问题。在加密方面，有已知的、误解的已知（本应真实但实际上为假的事）、已知的未知，当然还有未知的未知。还有信息、错误信息（虚假或错误的信息），甚至是误导信息（故意传播的欺骗性虚假信息）。某些项目可能是对抗性的，一个或多个小组可能不想要评估，而另一些则可能欢迎这种评估。评估者必须克服所有障碍，以确定何时通过文档、访谈和测试收集了足够的信息来执行分析并编写报告。


    ### 8.1 文档](#part0003.html#Rsec8_1)


    文档是任何评估的基石。虽然走廊对话、电子邮件、聊天会和电话都是收集信息的接受方法，但说到底，只有官方文档是可靠的。基本上，如果没有记录，它就不存在。官方文档应使用公司抬头纸或等效信纸。企业政策、标准、实践和程序需要记录。供应商服务、产品手册、用户指南和技术规范需要记录。请参阅图
    8.1 文档输入的概述。


    在交换任何文档、进行任何访谈或执行任何测试之前，应召开启动会议，讨论项目范围、预期、时间表、业务部门、资源、应用程序、产品和供应商。资源包括可用和所需的文档、联系信息、受访者名单以及包括生产和测试系统在内的相关环境。


    理想情况下，在安排任何访谈或测试之前，所有相关文档都会提供给评估者。评估者需要足够的时间审查文档以准备访谈，否则受访者提供的信息将无法证实。同样，评估者需要充足的时间来阅读文档。根据文档的量，可能需要几天或几周来处理这些材料。企业文档可能包括政策、标准、实践或程序。


    ![](img/00102.jpeg) **企业政策**通常定义高层责任（谁）和要求（什么）。责任可以由管理层定义，并识别哪些组织小组负责这些。


    ![](img/00102.jpeg) **企业标准**通常定义中层责任（谁）和要求（什么），特点是扩展安全政策，有时提供高层的“如何”。要求更为明确，并参考具体的法规、法律和行业标准。


    ![](img/00102.jpeg) **企业实践**通常定义低层规范（如何）和理由（为什么），通常按安全标准组织。实践规定了产品、工具、资源和命名的程序。例如，证书政策和证书实践文件是运营证书机构的不可组成部分。理由识别了安全实践提供的相关风险和应对措施。


    ![](img/00102.jpeg) **企业程序**提供详细说明（如何），有时提供位置信息（哪里）和特定角色（谁）。程序是根据角色分配（例如安全官）在指定位置使用产品和工具执行逐步任务。执行程序通常包括签到表、清单以及各种系统和应用程序日志。


    外部评估者可能不熟悉企业文档，因此可能需要更多时间阅读材料。然而，虽然政策可能是公开的，但详细的程序需要保护，这通常在保密协议（NDA）下进行。相反，内部评估者会熟悉大多数企业文档，员工不需要
    NDA，但仍需要时间审查各种文档。相关的企业文档需要阅读或审查，但确定哪些文档是相关的可能会产生问题。启动会议有助于确定企业文档和供应商文档，后者可能包括服务或产品手册、用户指南、技术规范或白皮书。


    ![](img/00102.jpeg) **服务手册**展示了第三方提供商提供的可用应用程序的高层概述。虽然包含的技术细节较少，但重要信息包括服务名称、缩写和网址。


    ![](img/00102.jpeg) **产品手册**提供了软件制造商提供的可用应用程序的高层概述。虽然包含的技术细节较少，但重要信息包括产品名称、缩写和网址。


