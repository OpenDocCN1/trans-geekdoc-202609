- fmt: '

    Each data classification has its own corresponding security requirements. An organization’s
    data classification policy, standards, and practices should clearly articulate
    its data protection security requirements. Thus, knowing where data is located
    and its corresponding classification helps defines the security controls based
    on the associated security requirements. See [Figure 6.8](#part0011.html#fig6_8)
    for an example of information diagram showing numerous data elements located on
    routers, FWs, and the various web, BP, RAS, App, DB, SS, and AS servers.


    ### Network Information

    Network information includes Internet Protocol (IP) addresses, FW rules, ports,
    and protocol numbers. Routers use IP addresses to manage traffic among the numerous
    network devices and various servers. FWs use IP addresses and rules to permit
    or block traffic based on the allowed ports and protocols. FWs or web servers
    might run WAFs that perform a deeper analysis of the data packet content.


    ![](images/00075.jpeg)

    Figure 6.8 Information diagram.


    ![](images/00002.jpeg)Port and protocol numbers are public data.

    ![](images/00002.jpeg)IP addresses are considered proprietary data.

    ![](images/00002.jpeg)FW rules are categorized as confidential data.


    ### Application Information

    Application information includes customer identification (ID), client ID, messages,
    application (App) logs, system (sys) logs, customer profiles, and client profiles.
    Web servers use the customer ID to forward legitimate messages to the App servers
    but block illegitimate or expired customer ID. BP servers use the business client
    ID to forward legitimate messages to the App servers but block illegitimate or
    expired client ID. The App servers use the customer ID or client ID to fetch the
    corresponding customer profile or client profile from the DB servers to process
    the messages.


    ![](images/00002.jpeg)Customer ID is proprietary.

    ![](images/00002.jpeg)Client ID is proprietary.

    ![](images/00002.jpeg)Messages are proprietary.

    ![](images/00002.jpeg)Application logs are confidential.

    ![](images/00002.jpeg)System logs are confidential.

    ![](images/00002.jpeg)Customer profiles are confidential.

    ![](images/00002.jpeg)Client profiles are confidential.


    ### Administrative Information

    Administrative information includes employee ID, commands, application logs, and
    system logs. The RAS uses the employee ID to forward valid commands to the ASs
    but blocks invalid commands. The AS uses the employee ID to forward related commands
    to the SS.


    ![](images/00002.jpeg)Employee ID is proprietary.

    ![](images/00002.jpeg)Commands are confidential.

    ![](images/00002.jpeg)Application logs are confidential.

    ![](images/00002.jpeg)System logs are confidential.


    However, proprietary and confidential data are accessible by many individuals:
    customers, clients, employees, and administrators. Consequently, managing cryptographic
    keys as regular data is an unacceptable practice. [Chapter 3](#part0008.html#ch03)
    discussed the importance of managing keys securely using various schemes. [Chapter
    7](#part0012.html#ch07) discusses the significance of cryptographic modules and
    the key management lifecycle. An extremely important security axiom is that cryptographic
    keys are not data, they are used to protect data, and therefore cannot be managed
    as data. Thus, in addition to application architectures, network architectures,
    and information architectures, there is an essential need for cryptographic architectures.
    The lack of cryptographic architectures is a clear and present risk.


    ### [6.4 Cryptographic Architecture](#part0003.html#Rsec6_4)


    Cryptographic architectures can basically convey the journalistic five Ws and
    H questions: **who** uses the keys, **what** are the key types, **why** keys are
    used, **where** keys are stored, **when** keys are used, and **how** keys are
    used.


    ![](images/00002.jpeg)Who uses the keys: identifies the entity, whether it be
    an individual, mobile device, laptop, server, network appliance, or an application.

    ![](images/00002.jpeg)What are the key types: defines the symmetric or asymmetric
    algorithm and key sizes.

    ![](images/00002.jpeg)Why keys are used: conveys the security purpose such as
    encryption, authentication, integrity, non-repudiation, or tokenization.

    ![](images/00002.jpeg)Where keys are stored: captures location information, such
    as on the Internet, within a DMZ or on an internal network.

    ![](images/00002.jpeg)When keys are used: provides cryptographic protocol information,
    such as authentication, encryption, or key establishment.

    ![](images/00002.jpeg)How keys are used: gives further detail regarding key usage
    within a cryptographic protocol such as TLS cipher suites.


    Cryptography information might be documented using diagrams or other formats such
    as lists, tables, or other spreadsheets. While lists are valuable they do not
    provide a visual perspective; literally a picture is worth a thousand words. An
    existing application or network diagram might be reused, or a specialized illustration
    can be developed. For example, [Figure 6.8](#part0011.html#fig6_8) shows an application
    architecture with cryptography information.


    The Web servers have TLS keys, a private asymmetric key and a public key certificate,
    for the external HTTPS connection to web browsers. Since browsers do not offer
    client certificates, the Web servers send their server certificates to the browser
    as part of the `TLS` handshake to establish the symmetric session keys. The browser
    needs to validate the Web App certificate, including the certificate chain to
    the trust anchor, as indicated by the certificate loops.


    The Web servers also store salted and hashed passwords for individual authentication
    and authorization. However, no keys are used. The passwords entered by the individuals
    using their browsers are transmitted over the `HTTPS` connection, salted and hashed
    by the Web servers, and then matched to the stored versions for password verification.


    The BP servers have TLS keys, another private asymmetric key and a public key
    certificate, for the external TLS connection to the BA servers. Likewise, the
    BA servers likewise have TLS keys, a private asymmetric key and a public key certificate,
    for mutual authentication. Both servers exchange TLS certificates to establish
    the symmetric session keys. Further, both servers need to validate each other’s
    TLS certificates, including the certificate chains to a trust anchor. Note that
    the two certificate chains might very well validate to different trust anchors.


    The App servers have TLS keys, a private asymmetric key and a public key certificate,
    for the internal TLS connections to the Web servers and the BP servers. The Web
    servers and the BP servers reuse their same certificates for both their external
    and internal TLS connections. Thus, the TLS connections between the App-to-Web
    servers and App-to-BP servers have mutual authentication. Further, all of the
    servers need to validate the exchanged certificates including the certificate
    chain to a trust anchor. Because the Web and BP certificates are also used for
    external connections, whereas the App certificates are only used for internal
    connections, the App certificates might validate to different trust anchors.


    The DB servers do not have any TLS keys, as the internal connections to the App
    servers are not over a secure channel. However, a security professional should
    be able to argue that while the connections are over a private network, the sensitivity
    of the data transmitted between the App and DB servers and the relative risks
    of an unauthenticated connections warrant a TLS connection. Regardless, the DB
    server has a symmetric key for database encryption (`DBE`).

