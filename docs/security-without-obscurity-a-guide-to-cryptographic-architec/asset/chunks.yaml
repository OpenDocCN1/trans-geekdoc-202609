    ## 第 3 章 (#part0003.html#rch03)


    ## 加密密钥 (#part0003.html#rch03)


    本章基于之前章节的信息，并提供了关于对称密钥、非对称密钥对和公钥证书的更多细节。这里介绍的信息在很大程度上与算法无关，但在需要时引用了某些特定算法。尽管这里讨论了某些公钥基础设施（`PKI`）组件，但本章未涉及操作方面；请参见
    *Security without Obscurity: A Guide to PKI Operations*[5]。


    ![](img/00002.jpeg)

    第 1 章 (#part0006.html#ch01) 提供了密码学词汇表，包含数学回顾、常用符号和传统的密码学术语。


    ![](img/00002.jpeg)

    第 2 章 (#part0007.html#ch02) 提供了对称和非对称加密的概述，包括加密、哈希、完整性与身份验证、不可否认性和令牌化。


    本章讨论的密钥管理方法用于各种协议，这些协议在第 4 章 (#part0009.html#ch04) 和第 5 章 (#part0010.html#ch05)
    中介绍。本章讨论的密钥管理方案涵盖了发送者和接收者之间传输的数据，也涵盖了数据库环境等存储中的数据。虽然本章介绍了密钥管理方案，但密钥生命周期和加密模块将在第
    7 章 (#part0012.html#ch07) 中讨论。


    ### 3.1 对称密钥 (#part0003.html#Rsec3_1)


