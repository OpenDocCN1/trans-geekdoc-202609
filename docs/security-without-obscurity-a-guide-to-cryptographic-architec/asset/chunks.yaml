    因此，一个针对无盐（或无胡椒）且经过一次迭代的彩虹表将包含五千亿条目。但是，现代计算机对现代哈希算法（例如 `SHA-512`）的处理速度达到每秒百万次或以上，因此使用一千台计算机进行的
    57.6 万亿次哈希计算可以在两个月左右完成。考虑到云计算的可用性，这种攻击是可行的，且成本是现实。为每个密码添加随机盐会使每个密码的工作因子倍增，因此一个拥有一千个密码的用户端数据库将使总工作量从两个月增加到
    166 年。当然，增加计算机计算能力可以缩短时间因素，但攻击者并不对破解所有密码感兴趣，只需要管理员的密码。因此，如果攻击者知道哪个终端用户配置是管理员，工作因子在实践上就减少到了单个密码。


    密码迭代次数是指用于存储时对密码（及盐）应用哈希函数的次数。迭代次数仅仅会增加工作因子，但可能会延迟密码验证，影响终端用户的体验。NIST 建议至少迭代一千次，但对于性能更强的服务器，在计算基于密码的密钥衍生函数时，1000
    万次的迭代可能是合适的 [39]。无论盐和迭代次数如何，密码验证过程都需要获取传输的明文密码以进行哈希处理，以便以便其与存储的哈希密码进行比较。


    支付卡的 PIN 验证与密码验证非常不同。PIN 是 ISO 9564 中定义的 4 到 12 位数字 [56]，并与卡片的主账户号码 (PAN) 关联。PAN
    是 ISO/IEC 7812 中定义的 12 到 19 位数字 [57]。与密码不同，PIN 可能是银行颁发的，也可能是客户选择的。银行生成的 PIN 可能直接派自
    PAN 或随机数，类似于客户选择的 PIN。


    如图 4.12 所示，IBM 3624 PIN 验证^(\*) 基于 PIN 偏移量 (oPIN)。oPIN 是通过从中间 PIN 值 (iPIN) 中去客户选择的
    PIN 生成的。iPIN 是通过 PIN 验证密钥 (3K-3DES) 加密验证数据 (vData)，然后使用十进制表替换密文字符生成的。oPIN 存储在终端用户数据库中。通过将
    oPIN 加到 iPIN 上恢复 PIN，然后将其与客户输入的 PIN 进行比较。如果客户输入的 PIN 与恢复的 PIN 匹配，则用户通过身份验证。


    IBM 的 oPIN 方法允许在不更改 PAN 的情况下更改 PIN。其他 PIN 验证方法使用 `DES` 或三重 DES (`3DES`) 密钥从 PAN
    派生 PIN，但更改 PIN 需要更改 PAN。从密码体系的角度来看，密码验证方案通常使用无密钥哈希；然而，PIN 验证方法使用 `DES` 或 `3DES`
    加密密钥。使用 `AES` 的新型 PIN 验证方案正在开发中；草案 X9.132 [58]。


    ![](img/00057.jpeg)


    图 4.12 IBM 3624 PIN 验证。


    ### 4.6 一次密码 (OTP)


    一次性密码 (OTP) 是短寿命的身份验证凭，不应与加密方法的一次性扇 (OTP) 混淆。加密 OTP 是一种密钥管理方法，为每条消息使用不同的加密密钥。认证
    OTP 使用具有有限 TTL（生存时间）的密码，用时钟图标表示。图 4.13 展示了 OTP 架构。

