    to be translated from old to the new DBEK. As another example, if a DEK is changed
    then any data encrypted under the old DEK might need to be translated to the new
    DEK or possibly just deleted. Consider a log encryption key (LEK); older logs
    might be deleted but if the logs need to be retained for a longer period, they
    might need to be translated to the new LEK. The relative risks of allowing data
    to be kept encrypted under old keys need to be assessed as revoked keys might
    still be compromised or determined exhaustively. Copies of older data encrypted
    using older keys should be migrated to newer keys or deleted altogether.'
