    1.  CA Business Practices Disclosures, which are expected to be documented in
    the CA certificate policy or certificate practices statement.


    2.  CA Business Practices Management, which are effective controls to provide
    reasonable assurance that the CA operates according to its certificate policy
    or practices statement.


    3.  CA Environmental Controls, which are controls addressing assets, personnel,
    physical and logical access controls, development, maintenance, monitoring, and
    security logs.


    4.  CA Key Life Cycle Management Controls, which address key generation, key storage,
    key backup and recovery, public key distribution, key usage, key archival, key
    destruction, key compromise, cryptographic hardware security modules, and key
    escrow.


    5.  Subscriber Key Lifecycle Management Controls, which address CA services provided
    to subscribers for managing users’ cryptographic keys.


    6.  Certificate Lifecycle Management Controls, addressing subscriber registration,
    certificate renewal, certificate rekey, certificate issuance, certificate distribution,
    certificate revocation, certificate suspension, and certificate validation. Regarding
    subscriber registration, refer to EV certificate \[[16](#part0016.html#ref_16)\]
    historical origin discussed previously.


    7.  Subordinate CA Certificate Lifecycle Management Controls, addressing controls
    over one or more subordinate CA operating within the hierarchy of a PKI.


    Each of these areas includes control objectives for measuring compliance and illustrative
    controls as examples, but the Webtrust for CA is neither prescriptive nor proscriptive
    relative to technology or solutions. Likewise, industry standards \[[20](#part0016.html#ref_20)\]
    define requirements but do not specify technology. Thus, the reader is provided
    guidance but not the particulars specifications. For a more thorough discussion
    of PKI operations, refer to Ref. \[[5](#part0016.html#ref_5)\], and for a description
    of these areas relative to this book, refer to [Chapter 7](#part0012.html#ch07).


    One last note on digital signatures versus electronic signatures is as follows:
    the Electronic Signatures in Global and National Commerce Act[^(\*)](#part0007.html#fn2_8)
    (ESIGN) of 2000 \[[21](#part0016.html#ref_21)\] defines an electronic signature
    as an electronic sound, symbol, or process, attached to or logically associated
    with a contract or other record and executed or adopted by a person with the intent
    to sign the record. Thus, since a digital signature is a cryptographic process
    representing the intent to sign a record, it is suitable for an electronic signature.
    However, without the cryptographic, operational, and legal controls, an electronic
    signature cannot provide non-repudiation services as described in the DSG and
    the PAG.


    ### [2.5 Tokenization](#part0003.html#Rsec2_5)


    Tokenization is the process for substituting sensitive data with benign data.
    Exactly what constitutes sensitive data, also called the underlying sensitive
    value (USV), is relative to the business application. Generally for payment applications,
    the account number is sensitive.


    For example, the Payment Card Industry Data Security Standard (PCI DSS) Tokenization
    Guidelines \[[26](#part0016.html#ref_26)\] offer an application-specific description:
    *Tokenization is a process by which the primary account number (PAN) is replaced
    with a surrogate value called a “token.” Detokenization is the reverse process
    of redeeming a token for its associated PAN value. The security of an individual
    token relies predominantly on the infeasibility of determining the original PAN
    knowing only the surrogate value*.


    Europay-MasterCard-Visa (EMV) Payment Tokenization Specification \[[27](#part0016.html#ref_27)\]
    offers a similar description: *Payment Tokens are surrogate values that replace
    the PAN in the payments ecosystem. Payment Tokens may be used to originate payment
    transactions, whereas non-Payment Tokens may be used for ancillary processes,
    such as loyalty tracking.*


    For health care, the patient’s name or diagnostic codes might be deemed sensitive.
    Regarding privacy, any personally identifiable information such as a mailing address
    or SSN might be considered sensitive (USV) data that needs protection.


    What comprises benign data depends on the tokenization method. X9.119-1 \[[22](#part0016.html#ref_22)\]
    defines requirements for protecting sensitive payment card data using encryption
    methods, whereas X9.119-2 \[[23](#part0016.html#ref_23)\] addresses tokenization
    methods. X9.119-2 offers a similar tokenization definition: *the process of mapping
    a plaintext value (i.e., the USV) to an existing or newly generated surrogate
    value (i.e., a token)* and identifies four tokenization methods.


