- fmt: '

    SKs established using key transport or key agreement schemes are vulnerable if
    the asymmetric private keys are ever compromised. For example, an adversary who
    gains access to the private keys and has recordings of the network traffic can
    reestablish the SKs and decrypt the data hours, days, months, or even years later.
    [Figure 3.15](#part0008.html#fig3_15) shows the cryptographic countermeasure to
    this susceptibility called “forward secrecy” using ephemeral keys.


    Ephemeral keys are by definition short-lived as opposed to long-term static keys.
    Both Alice and Bob have long-term keys consisting of a private key and a digital
    certificate. In addition, one (or both) has ephemeral keys consisting of a private
    key and a public key. For the purposes of this discussion, the underlying assumption
    is both have ephemeral keys. The ephemeral public key is not encapsulated within
    a certificate because the ephemeral keys’ lifetime is only a few seconds or less.
    The ephemeral keys are generated, the public key(s) are exchanged, and the ephemeral
    keys are included as part of the second step to compute the shared secret.


    ![](images/00043.jpeg)


    Figure 3.15 EpEphemeral key agreement.


    ![](images/00002.jpeg)Alice computes her shared secret using Bob’s static and
    ephemeral public keys, and her own asymmetric static ephemeral key pair. Immediately
    after the SKs are generated, Alice destroys all the ephemeral keys.


    ![](images/00002.jpeg)Bob computes his shared secret using Alice’s static and
    ephemeral public keys, and his own asymmetric static ephemeral key pair. Immediately
    after the SKs are generated, Bob destroys all the ephemeral keys.


    Once the ephemeral keys are erased an adversary cannot determine the SKs because
    the ephemeral private keys no longer exist. This presumes that the systems generating
    the ephemeral keys have not been compromised during their brief lifetime. Hence,
    forward secrecy is preserved. However, there are monitoring systems that rely
    on access to the server asymmetric keys which ephemeral keys interfere. [Figure
    3.16](#part0008.html#fig3_16) illustrates how server static keys are replicated
    so monitoring system can duplicate the key establishment process. Arguably, monitoring
    systems are legitimate due to business and operational necessities; however, some
    security traditionalists will disagree. Businesses need to analyze customer interactions
    and operations need to troubleshoot network problems. Depending on network architectures
    and network components (e.g., routers, firewalls, load balancers) circumstances
    will vary.


    The server asymmetric public and private static keys are replicated to the monitoring
    system typically using a manual process. A data tap captures all of the network
    traffic; every data packet is duplicated, including the key establishment packets
    and the subsequent encrypted data packets. The data packets are organized by a
    session ID and recorded to disk. The monitoring system has access to any certificates
    or public keys sent from clients to servers, and with access to the server static
    keys, can repeat the key establishment process which yields the SKs. The encrypted
    data packets can then be decrypted.


    However, with forward secrecy, the server ephemeral private keys are missing.
    The monitoring systems can no longer complete the key establishment process, can
    no longer access the SKs, and therefore can no longer decrypt the encrypted data
    packets. Forward secrecy was designed to prevent encrypted data from being recorded
    and decrypted if the server private key was ever compromised. Ironically, forward
    secrecy also disables monitoring systems that rely wholly on the server keys being
    replicated for key reestablishment.


    ![](images/00044.jpeg)


    Figure 3.16 EpKey establishment monitoring.


    ### [3.3 Certificates and PKI](#part0003.html#Rsec3_3)


    Certificates and PKI were introduced in [Chapter 2](#part0007.html#ch02) when
    discussing non-repudiation. There are various types of PKI credentials such as
    OpenPGP [[44](#part0016.html#ref_44)] message formats, PKCS#8 [[35](#part0016.html#ref_35)]
    for private key information, and PKCS#12 [[38](#part0016.html#ref_38)] for personal
    information exchange including private or public keys. This book focuses on `X.509`
    certificates which only include public keys. Digital certificates defined in `X.509`
    standards [[45](#part0016.html#ref_45),[46](#part0016.html#ref_46)] and [[47](#part0016.html#ref_47)]
    contain five major components:


    1. a public key,

    2. the public key owner’s information,

    3. the public and private key pair information,

    4. the certification authority’s (CA) information, and

    5. the CA digital signature over the previous four components.


    See the Annex: `X.509` Certificate Quick Reference for details. The public key
    is mathematically related to its private key so the digital certificate represents
    information about the key pair and the keys’ owner. Most importantly, the certificate
    signature (5) provides a cryptographic binding between the public key (1) and
    the owner information (2). The binding is essentially an attestation by the CA
    that the key pair belongs to the owner. Additionally, the CA signature also cryptographically
    binds the CA information (4) and the key pair information (3) to the owner information
    (2) and public key (1). [Figure 3.17](#part0008.html#fig3_17) correlates additional
    certificate details to the certificate chain for a common PKI hierarchy.


    The subject-related information includes its primary name, public key and related
    algorithm identification, the key usage indicators, and any subject alternate
    names (`SANs`). The key usage might be explicitly requested by the subject in
    the certificate request (`CSR`) submitted to the registration authority (`RA`)
    or implicit based on the `RA` selected by the subject. Any alternate names might
    be explicitly requested in the `CSR` or provided to the `RA` using an out-of-band
    channel.


    ![](images/00045.jpeg)


    Figure 3.17 EpCertificates and PKI.


    The issuer-related information includes its name, its certificate policy and practices,
    and certificate status accessibility such as a certificate revocation list (`CRL`)
    location or an online certificate status protocol (`OCSP`) responder.


    The issuer-provided information includes the subject’s public key validity dates
    and the CA signature on the certificate. The certificate’s validity dates are
    based on the CA policy and certificate practices statement. The certificate signature
    is generated by the CA using its secured private key and verified using the CA’s
    public key. The CA public key is encapsulated in the issuer CA certificate. Each
    certificate’s signature is verified using the public key in the next certificate
    within the certificate chain.


    ![](images/00002.jpeg)The subject certificate’s signature is verified using the
    issuer CA certificate.


    ![](images/00002.jpeg)The issuer CA certificate’s signature is verified using
    the subordinate CA certificate.


    ![](images/00002.jpeg)The subordinate CA certificate’s signature is verified using
    the root CA certificate.


    ![](images/00002.jpeg)The root CA certificate’s signature is verified using its
    own public key.


    Some PKI might not employ an intermediate (subordinate) CA or might have more
    than one intermediary CA, so the length of the certificate chain may vary. The
    recipient of the subject’s certificate is called the relying party because it
    must trust the `RA` and `CA`. However, the relying party needs to validate the
    complete certificate chain, called certificate validation.


    ### [3.4 Certificate Validation](#part0003.html#Rsec3_4)

