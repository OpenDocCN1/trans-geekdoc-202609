  trans: '


    本节讨论了用于建立对称密钥的各种基于加密加密方案，而下一节将讨论用于建立对称密钥的基于非对称加密方案。密钥建立方案包括：


    ![](img/00002.jpeg)初始密钥 (Initial key)

    ![](img/00002.jpeg)固定密钥 (Fixed key)

    ![](img/00002.jpeg)主密钥/会话密钥 (Master/Session key)

    ![](img/00002.jpeg)交易唯一密钥 (DUKPT)


    本节讨论的密钥交付方案包括：


    ![](img/00002.jpeg)伪密钥 (Faux key)

    ![](img/00002.jpeg)PKCS 令牌

    ![](img/00002.jpeg)数据库加密密钥管理 (DBEKM)


    如第 2 章所示，同一个对称密钥用于加密或解密、消息认证码（MAC）或密钥哈希消息认证码（HMAC）以生成或验证完整性检查值（ICV)，或者用于某些令牌化方法。当涉及发送者和接收者时，双方实体必须共享同一个密钥。然而，建立初始密钥（IK）是有困难的。在没有密钥加密密钥（KEK）保护其他密钥的情况下，IK
    需要以某种方式安全地交换。在历史上，这是通过使用密钥分量实现的；参见图 3.1。密钥分量的术语定义在 X9.24-1 标准中 \[30\]。


    `Key Component`：至少两个参数之一，其格式为加密密钥，通过与一个或多个类似的参数进行模 2 异或/加法运算形成一个加密密钥。分量的长度与生成的密钥长度相等
    \[30\]。


    注意，异或（等同于异或运算结果）在第 1 章中也有定义，附录：XOR 快速参考提供了十六进制和二进制格式的 XOR 值的完整列表。图 3.1 展示了两个实体（发送者和接收者）交换密钥分量以建立对称密钥的示例。在这种情况下，发送者生成一个
    128 位的对称密钥并创建两个 128 位的密钥分量，将两个分量安全地发送给接收者，接收者重新组合分量以安装对称密钥。实际操作将取决于两个参与者的能力和专业知识，有多种可行的方案。


    ![](img/00029.jpeg)


    图 3.1 对称 IK。


    ![](img/00002.jpeg)发送者生成两个随机数作为密钥分量，将每个分量分配给不同的持有者，然后每个分量持有者将他们的分量手递给接收端的两个独立分量所有者。或者，发送者持有者可以通过信函将分量分别发送给接收持有者。


    ![](img/00002.jpeg)发送者生成一个随机密钥和一个随机数作为第一个密钥分量，并将密钥与该分量异或以推导出第二个分量。发送者将每个分量分配给不同的持有者，然后这些持有者通过手递、信函或可能的安全电子邮件将每个分量安全地传输给不同的接收持有者。


    或者（未在图 3.1 中显示），发送者生成一个随机数作为第一个分量，接收者生成一个随机数作为第二个分量。发送者分配一个分量持有者，其将第一个分量安全地传输给特定的接收持有者。同样，接收者分配一个持有者，其将第二个分量安全地传输给另一个发送持有者。双方随后将其原始分量和交付的分量结合以重建对称密钥。


    其他密钥分量操作也是可能的。然而，一旦分量交换并建立了对称密钥，分量就可以用于备份和恢复。图 3.2 展示了对称密钥恢复的示例。发送者可以将密钥分量保留在安全存储设施中，并在由于某些技术故障需要恢复密钥时维持分量持有者的责任。同样，接收者可以将密钥分量保留在安全存储设施中，并在需要恢复密钥时维持分量持有者的责任。通过这种方式，除非要分发新密钥，否则分量不需要重新交换。X9.24-1
    提供了处理密钥分量的要求和建议 \[30\]。


    一旦建立了对称密钥，有两种基本操作方法：固定密钥或主密钥（MK)/会话密钥（SK）。图 3.3 展示了使用密钥分量建立初始对称密钥的固定密钥方法示例。IK
    被发送者用于加密明文，被接收者用于解密密。一旦固定密钥达到生命周期结束，将通过再次交换新分量来替换。因此，一旦使用手动程序通过密钥分量建立了 IK，它将保持“固定”，直到使用相同的手动程序进行替换。X9.24-1
    为固定密钥方法提供了要求和建议 \[30\]。


    ![](img/00030.jpeg)


    图 3.2 对称密钥恢复。


    ![](img/00031.jpeg)


    图 3.3 对称固定密钥。


    某些系统可能会重用当前的固定密钥交换新密钥；然而，这违反了基本的密钥管理原则：密钥是生成并用于预期用途的。固定密钥生命周期旨在通过不过度使用加密密钥来保护数据。在密钥生命周期结束时将数据加密密钥（DEK）重新用作
    KEK 会增加新密钥泄露的风险，从而导致数据泄露。


    图 3.4 展示了使用密钥分量建立初始对称密钥的 MK/SK 方法示例。IK 被用作 MK 来交换一个或多个 SK。发送者使用 MK 加密一个随机 SK 并将密文发送给接收者，接收者解密密文以恢复
    SK。一旦建立了 SK，发送者使用 SK 加密明文，接收者使用 SK 解密密文。X9.24-1 为 MK/SK 方法提供了要求和建议 \[30\]。


    当 SK 达到生命周期结束时，通过使用 MK 交换另一个 SK 来替换。当 MK 达到生命周期结束时，将通过再次交换新分量来替换。重做分量的替代方案是使用当前
    MK 交换新的 MK；然而，只有在当前 MK 未被泄露时这种方法才是有效的。MK 是用于交换 DEK 的 KEK，因此重用它交换另一个 KEK 符合其预期用途，并符合基本的密钥管理原则：密钥是生成并用于预期用途的。


    ![](img/00032.jpeg)


    图 3.4 对称 MK/SK。


    的是，固定密钥和 MK/SK 存在一个共同问题。行业标准 \[30\]要求通信双方使用的任何密钥都是唯一的（随机情况除外）。这意味着与成百上千甚至数百万终端设备通信的主机系统需要为每个终端管理单独的密钥。使用固定密钥或
    MK/SK 方法将需要密钥数据库。或者，DUKPT（读作“duck putt”）允许主机使用单个派生密钥（BDK）管理许多终端的唯一密钥。X9.24-1 为
    DUKPT 方法提供了要求和建议 \[30\]。


    DUKPT 是主机系统与许多终端之间的密钥管理方案，尽管它也可以用于许多其他场景。


    ![](img/00002.jpeg)图 3.5 展示了主机如何使用派生密钥（BDK）生成并向终端注入 IK。


