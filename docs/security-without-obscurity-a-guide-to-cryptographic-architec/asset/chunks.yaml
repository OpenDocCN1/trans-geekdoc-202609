    is when information is in the cloud. Third-party data deletion is often very difficult
    to manage, verify, and audit. Often third-party service providers including cloud
    providers do not permit audits of storage systems.


    Another misnomer is that encrypted data can be logically deleted by simply destroying
    the cryptographic key; however, this is no longer the case. As noted with data
    usage, given sufficient time and resources, any cryptographic key might be determined.
    An exhaustive key attack is always viable if the data holds its value past the
    time it takes to determine the key.


    **Data retention** is for long-term information storage. As noted in data deletion,
    backup copies are sometimes kept for data retention. Data retention varies by
    industry such as health care versus financial services, by business such as automobile
    loans versus mortgages, or by company policy. However, if the retention period
    exceeds the key lifecycle, the cryptography needs to be transitioned \[[94](#part0016.html#ref_94)\]
    possibly from one key to another, a longer key size, or even another algorithm.


    For example, a document signed with an RSA 512-bit key in 1980 would be insecure
    in 1990, and an RSA 1024-bit key in 1990 is considered insecure in 2010. The proper
    method to preserve the chain of evidence is to preserve each signature by re-signing
    the signed document as demonstrated in [Figure 7.13](#part0012.html#fig7_13).
    The original document signed with an RSA-512 key is signed with an RSA-1024 key,
    again with an RSA-2048 key, and eventually signed with an ECDSA-256 key. Note
    that the hash sizes also need to increase. Each signature needs to include the
    digital signature algorithm, the hash algorithm, and the public key certificate
    \[[95](#part0016.html#ref_95)\].


    For another example, a document encrypted using DES in 1980 would be insecure
    in 2000, and the same document encrypted using 2K-3DES in 2000 would be insecure
    in 2010. Likewise, the document encrypted using AES-128 in 2010 might be at risk
    in 2030 if quantum computer become operational. The data might be decrypted and
    re-encrypted for each key and algorithm; however, the proper method to preserve
    the chain of evidence is to preserve each encryption as shown in [Figure 7.14](#part0012.html#fig7_14).
    The original document encrypted using DES is doubly encrypted using 2K-3DES, and
    then again using 3K-3DES, then AES-128, and eventually using AES-256. Each encrypted
    layer needs to indicate the algorithm and symmetric key \[[95](#part0016.html#ref_95)\].


    ![](images/00104.jpeg)


    Figure 7.13   Signature transitions.


    ![](images/00105.jpeg)


    Figure 7.14   Encryption transitions.


    The data management lifecycle differs from the key management lifecycle in stages
    and lifetimes, so the cryptographic transitions need to be managed. From a cryptographic
    architecture perspective, the relative risks include data disclosure for confidentiality,
    data modification or substitution for authentication and integrity, and deniability
    for non-repudiation. Data stored in one decade is susceptible to more powerful
    computers or mathematical advances in the next decade. For example, information
    encrypted today might be vulnerable to quantum computers by the next decade, including
    copies of the ciphertext stored in unforeseen locations such as cloud storage
    or perhaps attackers planning for long-term fraud.


