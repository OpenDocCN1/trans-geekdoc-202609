  raw: '[Figure 7.5](#part0012.html#fig7_5) shows an internal cryptographic module
    residing within the system memory of a computer that is controlled by an operating
    system. The algorithm executes within the memory of the cryptographic module.
    The data key is stored encrypted in system storage. The encrypted data key is
    fetched from storage and transmitted to the cryptographic module where it is decrypted
    using the KEK. The cleartext KEK and cleartext data key never leave the memory
    of the module. The cleartext data key can now be used with the algorithm.


    [Figure 7.5](#part0012.html#fig7_5) also shows the data input and data output
    into and out of the algorithm. The input data is moved from system memory to the
    module memory so it can be operated on by the algorithm and data key, and the
    output data is moved from the module memory to the system memory. For example,
    the input data might be cleartext that gets encrypted by the algorithm and key
    such that the output data is ciphertext. Conversely, the input data might be ciphertext
    that gets decrypted by the algorithm and key such that the output data is cleartext.


    If the cryptographic module is software based then the module memory is the same
    as the system member which means the cleartext KEK and cleartext data key are
    vulnerable. However, if the cryptographic module is hardware based then the module
    memory is separate from the system member which means the KEK and data key are
    never exposed outside the cryptographic module. In general, cryptographic hardware
    modules are designed to protect keys and only allow cleartext data to be inputted
    and outputted.


    [Figure 7.6](#part0012.html#fig7_6) shows an external cryptographic hardware module
    connected to a network, often called a HSM or a secure cryptographic device (SCD).
    Similar to the internal module, the algorithm executes within the cryptographic
    boundary. The encrypted data key is transmitted to the module where it is decrypted
    using the cleartext KEK. The cleartext KEK and cleartext data key never leave
    the cryptographic boundary. Also shown are the data input and data output which
    are likewise transmitted, typically over a secure network connection between the
    application system and the cryptographic module. The secure network connections
    typically use transport layer security (TLS) or equivalent cryptographic protocol.
    The HSM is often its own public key infrastructure such that the cryptographic
    module is the root certification authority (CA) issuing TLS server certificates
    to itself and TLS client certificates to application systems.


    ![](images/00094.jpeg)


    Figure 7.6   External cryptographic module.


    NIST \[[80](#part0016.html#ref_80)\] defines a cryptographic module as the set
    of hardware, software, and/or firmware that implements approved security functions
    (including cryptographic algorithms and key generation) and is contained within
    the cryptographic boundary. NIST further defines a cryptographic boundary as an
    explicitly defined continuous perimeter that establishes the physical bounds of
    a cryptographic module and contains all the hardware, software, and/or firmware
    components of a cryptographic module. The NIST standard defines requirements for
    11 security areas with four different security levels summarized in [Table 7.1](#part0012.html#tab7_1).


    **Security Level 1** is the lowest level of security, allowing software (or firmware)
    components of a cryptographic module executed on a general purpose computing system
    using an unevaluated operating system. However, one benefit is that approved algorithms
    (or security functions) are included. Approval means that algorithms have been
    evaluated to be correctly implemented per the corresponding standards, such as
    the symmetric algorithm advanced encryption standard (AES) \[[81](#part0016.html#ref_81)\].
    Thus, vulnerabilities due to weak algorithms or buggy software are avoided.


    **Security Level 2** enhances level 1 with tamper-evident mechanisms, role-based
    authentication (RBA), and an evaluated operating system. Tamper-evident mechanisms
    for hardware include visible coatings, observable seals, pick-resistant locks,
    and removable covers. Software integrity mechanisms might include MAC, HMAC, or
    digital signatures for code signing. RBA means the cryptographic module authenticates
    the authorization of an operator to assume a specific role (e.g., end user, key
    manager, administrator) and perform a corresponding set of services. An evaluated
    operating system means it has been assessed using a Common Criteria \[[82](#part0016.html#ref_82)\]
    Protection Profile (PP) at evaluation assurance level two (EAL2).


    **Security Level 3** increases level 2 by adding tamper detect and tamper response
    mechanisms, identity-based authentication, dedicated input/output ports, and evaluated
    EAL3 (or higher) operating system. Recognition of unauthorized physical access
    triggers key zeroization; on detection, the module erases the cryptographic keys.
    Authentication verifies that the identified operator is authorized to access a
    specific role and perform a corresponding set of services. Dedicated ports require
    that the import or export of cleartext critical security parameters (CSPs) such
    as key components be physically or logically separated from other ports. The operating
    system needs to be assessed against a Common Criteria \[[82](#part0016.html#ref_82)\]
    PP at EAL3.


    Table 7.1   NIST Summary of Security Requirements


    ![images](images/00095.jpeg)


    ![images](images/00096.jpeg)


    **Security Level 4** is the highest level of security improving level 3 by requiring
    stronger anti-tamper mechanisms, environmental sensors, and evaluated EAL4 (or
    higher). Detection of any physical penetration triggers key zeroization. Environmental
    sensors verify that the module is used within its normal operating ranges (e.g.,
    voltage, temperature, vibration) to thwart attacks. The operating system needs
    to be assessed using a Common Criteria \[[82](#part0016.html#ref_82)\] PP at EAL4.


    [Table 7.1](#part0012.html#tab7_1) shows the increasing Security Area requirements
    for each Security Level, but some of the areas are the same for more than one
    level. For example, Security Area (1) Cryptographic Module Specification has the
    same documentation requirement for all four levels. Conversely, Security Area
    (2) Cryptography Module Ports and Interfaces has the same requirements for levels
    1 and 2 but separates data ports for CSPs for levels 3 and 4. As another example,
    Security Area (5) Physical Security increases requirements for each Security Level.
    [Figure 7.7](#part0012.html#fig7_7) provides a graphical summary of the [Table
    7.1](#part0012.html#tab7_1) requirements.


    The NIST standard has also been translated into an international standard \[[83](#part0016.html#ref_83)\],
    and the American National Standards Institute (ANSI) \[[84](#part0016.html#ref_84)\]
    standard defines an SCD as a device that provides physically and logically protected
    cryptographic services and storage, for example, personal identification number
    (PIN) entry device or HSM. However, only NIST provides a cryptographic module
    validation program[^(\*)](#part0012.html#fn7_1) and a cryptographic algorithm
    validation program[^(\*)](#part0012.html#fn7_2) for the algorithms it recognizes.
    The National Information Assurance Partnership[^†](#part0012.html#fn7_3) (NIAP)
    is a partnership between the NIST and the National Security Agency to support
    the Common Criteria Evaluation and Validation Scheme. The Common Criteria \[[82](#part0016.html#ref_82)\]
    provides a method to define security requirements for the evaluation of products.
    Requirements are published as either a PP by an independent standards organization
    or a Security Target typically provided by the product manufacturer. NIAP maintains
    a list[^‡](#part0012.html#fn7_4) of approved PPs; however, notably there are no
