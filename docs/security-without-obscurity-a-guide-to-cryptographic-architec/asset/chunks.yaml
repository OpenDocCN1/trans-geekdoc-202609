    ![](img/00002.jpeg)设施周围的排水沟不仅能防止大雨期间的洪水，还充当了“invisible”屏障，防止车辆撞击安全栅。


    ![](img/00002.jpeg)环绕设施的安全围栏通过将交通引导至单一入口，阻止未经授权的人员进入设施。


    ![](img/00002.jpeg)入口岗亭控制进出车辆流量，安保人员对员工和访客进行身份验证和授权。


    ![](img/00002.jpeg)景观树和加高的土堤是另一个阻止车辆进入建筑大厅的“invisible”屏障。


    ![](img/00002.jpeg)建筑周围的小径允许安保人员巡逻地面。


    ![](img/00002.jpeg)建筑入口的大厅控制人员进出，安保人员对访客进行身份验证和授权。


    摄像头监控岗亭、停车场区域、大厅、通道、大厅内的人流量以及屋顶访问的情况。除了物理安全控制外，还有逻辑安全控制（如自动化流程和手动程序），它们补充了整体安全态势。


    ![](img/00002.jpeg)在入口处，安保人员必须识别员工，但检查任何陌生面孔（包括所有访客）的身份证明。访客必须由员工邀请。


    ![](img/00002.jpeg)在大厅内，安保人员发放访客证并管理员工陪同。员工的证会被读取器扫描，以通过步入室（mantraps）进入主楼。


    ![](img/00002.jpeg)在主楼内，员工定期佩戴证并全程陪同访客。某些区域需要证访问和访客签到。


    摄像头视频和门禁日志被保留以备发生安全事件。某些视频保留在网上以供快速参考，而另一些则离线保存较长时间。安保人员巡逻通道和屋顶以检查建筑。问题会被立即报告并进行修复。定期审查视频和日志以确保连续性。任何异常或可疑活动都会立即报告。从加密架构的角度来看，限制访问加密设备、使用加密的系统以及加密材料存储的物理和逻辑控制，是一组重要的补偿控制。下一层“系统安全”讨论了业务连续性与性恢复（BCDR）、漏洞生命周期管理系统（VLMSs）以及渗透（pen）测试。


    ### 7.2 系统安全


    在第 6 章]，用于识别、获取、安装和验证补丁。该指南讨论了执行补丁管理时固有的挑战，并提供了技术概述。存在多种 VLMS 模型。例如，Qualys 的论文《网络漏洞有效修复的指南》提供了一个八步流程
    [77]\]


    1. 创建安全策略和控制

    2. 跟踪库存/分类资产

    3. 扫描系统漏洞

    4. 将漏洞与资产清单进行对比

    5. 分类风险

    6. 预测试补丁

    7. 应用补丁

    8. 重新扫描并确认修复


    另一个例子是 SANS（系统管理、审计、网络、安全）论文《实施漏洞管理过程》描述了一个更简单的五阶段计划 [78]\]。SANS 的准备准备阶段基本上结合了
    Qualys 的前两个步骤。两种模型都承认漏洞扫描；即 Qualys 的第三步和 SANS 的第三阶段。Qualys 的第五、六、七步本质上被合并到了 SANS
    的第四阶段。两种模型都建议重新扫描以确认修复结果。


    1. 准备

    2. 漏洞扫描

    3. 定义修复措施

    4. 实施修复措施

    5. 重新扫描


    同样，X9.111 标准 [79]\] 定义了渗透测试的五个阶段。漏洞扫描是一个尝试识别针对已知网络攻击的潜在漏洞存在的过程；而渗透测试则尝试利用漏洞来确定是否可能发生未经的访问或其他恶意活动。渗透测试包括网络和应用测试，以及围绕网络和应用程序的控制和流程，并且既可以从网络外部尝试进入（外部测试），也可以从网络内部进行。


    1. 渗透测试规范

    2. 参与指南

    3. 渗透测试活动

    4. 参与报告

    5. 修复


    第一阶段是识别和评估工作说明书中约定的信息安全目标。第二阶段是对测试参数和范围达成共识。第三阶段是实际渗透测试活动。第四阶段是测试人员向组织报告发现。第五阶段是独立于测试人员的修复，如果测试人员参与，则同一测试人员不能进行后续测试。从加密架构的角度来看，BCDR
    和 VLMS 以及渗透测试是确保加密设备、使用加密系统以及加密材料存储可靠性的重要方面。下一层“加密模块”涉及硬件与软件加密，以及使用和管理加密模块的网络安全。


    ### 7.3 加密模块


    加密模块通过执行加密算法（例如加密、消息认证码 (MAC)、密钥哈希消息认证码 `HMAC\`、数字签名）以及在算法执行期间保护加密密钥提供加密服务。加密模块还执行不使用密钥的相关功能（例如哈希、数字生成）。为了让加密算法使用密钥，密钥必须是明文。密钥可以使用另一个密钥（称为密钥密钥
    KEK）进行加密，以在存储或传输期间保护它，但在内存中执行算法时必须进行解密。参见[图 7.5 的加密模块示例。


    ![](img/00093.jpeg)


    图 7.5 内部加密模块。


