    评估人员需要识别问题何时何时变得无关紧要。如果一个或多个问题代表相同的风险，那么进一步的研究就没有意义。例如，原始的单一 `DES` 算法采用 56 位密钥，按目前的标准来说太弱了，而
    1992 年之前的可导出的 `DES` 被限制为 40 位密钥。然而，某些加密模块为了后兼容，保留了 `DES`（56 位）和可导出的 `DES`（40 位）。由于对
    `DES` 的任何使用都是不可接受的风险，因此关于任何比 `DES` 更弱的细节都是无关紧要，尽管这些风险是相关的，需要纳入分析并总结在报告中。


    某些事实是正面的，而另一些是负面的。例如，通过 NIST 加密算法 (`CAVP`) 和加密模块 (`CMVP`) 验证计划的加密模块是一个正面事实。此外，安全策略中
    `FIPS` 批准的算法列表是另一个正面事实。相反，非 `FIPS` 算法列表可能是负面的。如果非 `FIPS` 算法列表包含 `DES` 和可导出的 `DES`，那么这些无疑是负面事实。怀疑或未经证实的意见不是事实；它们不能被视为事实处理，且不应体现在报告中。


    分析过程可能是艰苦的，通常使用电子表格或在线工具完成；但对于规模较小的项目，可能会使用草案报告。对于每个事实项，应分配一个数值分，并引用相关的理由。该分数使用一系列值来反映优势优于劣势（例如，使用
    1–10 的分表，10 为优，0 为差）。此外，版本控制和修订跟踪至关重要。当涉及多个评估人员时（这在大型项目中很常见），跟踪行动事项、编辑和更新至关重要。此外，不应共享评估人员未经编辑的笔记和任何中间草稿，以管理预期。


    ### 8.5 报告


    报告是审查文档、进行访谈、执行测试和执行分析的结晶。无论评估人员是外部还是内部人员，企业都可能为评估人员提供一个模板并坚持使用它。或者，企业可能会提供一个模板作为示例，要求评估人员进行自定义。否则，企业可能期望评估人员提供报告格式。无论如何，报告都需要反映分析阶段确定的事实（`表
    8.5`）。


    示例报告分为四个部分：执行摘要、报告摘要、报告详情和报告引用。其结构基于这样一个前提：优势或劣势可以被评为重大的、重要的或有意义的。评级数量多或少都是可能的，但本示例使用了三个等级。分析中使用的数值评分也可以也应该用于确定报告中的文字评级。


    ![](img/00002.jpeg)**重大优势**是指那些提供最佳安全控制的项。例如，具有较大密钥的当前算法（例如 `AES-256`）比短密钥或旧算法（例如
    `3DES`）更强。


    ![](img/00002.jpeg)**重要优势**是指那些提供更好安全控制的项。例如，具有较短密钥的当前算法（例如 `AES-128`）比旧算法（例如
    `2K-DES` 或 `3K-DES`）更好。


    ![](img/00002.jpeg)**有意义的优势**是指那些提供良好安全控制的项。例如，旧算法（例如 `3K-DES`）比已废弃的算法（例如 `DES`）可以接受。


    #### 表 8.5 示例安全评估报告


    | 产品 X 的安全评估报告 |

    | :--- |

    | 1. 执行摘要 1.1. 重大优势 1.2. 重大劣势 1.3. 重大建议 |

    | 2. 报告摘要 2.1. 重大和重要的优势列表 2.2. 重大和重要的劣势列表 2.3. 重大和重要的建议列表 |

    | 3. 报告详情 3.1. 带交叉引用的优势讨论 3.2. 带交叉引用的劣势讨论 3.3. 相关建议讨论 |

    | 4. 报告引用 4.1. 文档列表 4.2. 访谈列表 4.3. 测试用例列表 |


    ![](img/00002.jpeg)**重大劣势**是指最严重的漏洞。例如，存储或传输明文敏感数据。


    ![](img/00002.jpeg)**重要劣势**是指那些较严重的漏洞。例如，使用带有已知漏洞的旧加密软件。


    ![](img/00002.jpeg)**有意义的劣势**是指那些糟糕的漏洞。例如，使用已废弃的算法（例如 `DES`）。


    执行摘要包含了重大的优劣势以及任何相关的建议。执行摘要是可选的，并非总是需要，但某些企业更倾向于使用。当包含执行摘要时，通常只处理更重要的问题。然而，在不提供建议的情况下识别重大劣势是不完整的报告。劣势应该通过修复或增强来补救，或者通过通过补偿措施来解决。补偿措施是可以施应用于被评估现有产品的额外限制。例如，如果产品在端口地址上使用了脆弱的协议，且该协议无法在产品内禁用，则可能阻止该端口地址以防止访问该协议。执行摘要应包含最终的接受或拒绝状态。注意，接受可能根据建议而带有条件。


    报告摘要包含了重大的优劣势以及重要的优势和劣势。如果不包含执行摘要，则重大优劣势将在报告摘要中详细列出；然而，如果包含了执行摘要，则报告摘要可以使用重大优劣势的简版版本，并对执行摘要进行交叉引用。无论如何，报告摘要中都包含了对重大和重要劣势的建议讨论。如果没有提供执行摘要，则报告摘要应包含最终的接受或拒绝状态。注意，接受可能根据建议而带有条件。


    报告详情包含了优势和劣势的所有重大、重要和有意义的项。每个项目都与各种文档、访谈和测试用例进行了交叉引用。此外，报告详情针对了解决劣势的所有相关建议。被认为无关紧要且不足以评为有意义的项可以在报告中忽略。分析工作表将包含所有问题并可以随时查看。


    报告引用列出了文档、访谈和测试用例。文档列表包括企业、供应商和行业文档。常规引用包括文档名称、作者（适用）、来源和日期。访谈列表应包括日期、参与者、关联关系（例如公司名称、职位）和主题。测试用例应包括测试用例名称、编号和日期。除了引用列表外，报告可能包含一个或多个附录以提供更多细节。补充信息可能通过单独的演示材料提供。

