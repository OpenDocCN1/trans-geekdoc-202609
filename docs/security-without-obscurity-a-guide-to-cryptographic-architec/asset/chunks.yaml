    ![](images/00002.jpeg) `Table encryption` uses a `DEK` to encipher a specific
    table within a `DB` regardless of its columns. The table is initially enciphered,
    sections are deciphered in memory as needed, and re-enciphered to disk according
    to need. This protects the table from unauthenticated access. Authenticated access
    automatically deciphers the table sections into memory.


    ![](images/00002.jpeg) `Column encryption` uses a `DEK` to encipher a specific
    column within a `DB` table. The column is initially enciphered, sections are deciphered
    in memory as needed, and re-enciphered to disk according to need. This protects
    the column from unauthenticated access. Authenticated access automatically deciphers
    the column sections into memory.


    Regardless of the `DBE` method, the `DEK` typically resides in the memory of server.
    The `DEK` is often stored encrypted on the server using a master key such that
    the `DEK` can be decrypted for use in memory. However, the master key is not stored
    on the `DB` server; rather the master key is provided to the `DB` server from
    either a `KMS` or possibly an `HSM`. The method used to transport the master key
    to the `DB` server varies widely among `DB` providers and third-party `DBE` providers.
    Many of these key transport methods were discussed in [Chapter 3](#part0008.html#ch03).


    ![](images/00002.jpeg) `Faux key` misuses a data object as a cryptographic key.
    The `DEK` is encrypted using a faux key. The faux key is encrypted using a master
    key that resides only in the `HSM`. The enciphered faux key and the enciphered
    `DEK` are stored on the `DB` server.


    At start-up, the `DB` sends the enciphered faux key to the `KMS` over a `TLS`
    connection and the `KMS` sends it to the `HSM` over another `TLS` connection.
    The `HSM` decrypts the faux key using the master key, unawares the data object
    is being misused as a faux key. The `HSM` returns the cleartext faux key to the
    `KMS` and the `KMS` returns it to the `DB` server. The `DB` server decrypts the
    `DEK` using the faux key in memory.


    ![](images/00002.jpeg) `Public Key Cryptography Standards (PKCS) tokens` uses
    a password-based key derivation function to derive a `KEK` which is used to encipher
    a master key. The master key is used to encrypt the `DEK`. The master key resides
    in the `HSM`, and the enciphered `DEK` is stored on the `DB` server.


    At start-up, the `DB` sends a request to the `KMS` over a `TLS` connection and
    the `KMS` sends the request to the `HSM` with a password over another `TLS` connection.
    The `HSM` exports the master key enciphered within the `PKCS` using a `KEK` derived
    from the password. The `PKCS` is returned to the `KMS` which returns it to the
    `DB` server. The password might be stored on the `DB` server or provided by the
    `KMS` to the `DB` server. The `DB` server uses the password to open the `PKCS`
    and decrypt the `DEK` using the master key in memory.


    ![](images/00002.jpeg) `Database Encryption Key Management` uses `HMAC` within
    an `HSM` to generate a seed that is subsequently an input to a key derivation
    function (`KDF`) on the `DB` server to generate a `DEK`. The `HSM` provides an
    `HMAC` key (`HK`) encrypted using a master key. The master key resides in the
    `HSM` and the enciphered `HK` is stored on the `DB` server.


    At start-up, the `DB` sends a request to the `KMS` over a `TLS` connection with
    the enciphered `HK` and a unique database identifier (`ID`). The `KM` sends the
    items to the `HSM`. The `HSM` decrypts the `HK` using the master key and generates
    a `seed` with `HK` and `ID` as inputs. The `seed` is returned to the `KMS` and
    the `DB` server. The `DB` server generates the `DEK` in memory using a `KDF`.


    ## Annex Quick References


    ### ASCII and EBCDIC Quick Reference


    The following table (#part0015.html#fnbm_1) provides both American Standard Code
    for Interchange (`ASCII`) and Extended Binary Coded Interchange Code (`EBCDIC`)
    symbols, descriptions, and values in binary and hexadecimal notations. `ASCII`
    is a 7-bit encoding scheme so only has an alphabet for hex values `00` through
    `7F`. `EBCDIC` is an 8-bit encoding scheme and so has an alphabet for hex `00`
    through `FF`. Note that not every hex value has a corresponding `ASCII` or `EBCDIC`
    value.


