    Any SAML message might include encrypted data using the `Encrypted ID` option.
    Likewise, authentication assertions or authorization attributes might also be
    encrypted using the `Encrypted Assertion` or `Encrypted Attribute` options. All
    three encrypted options include the `Encrypted Data` and `Encrypted Key` fields.
    Instead of defining its own key management scheme, the SAML `Encrypted Key` field
    uses the XML Encryption scheme [[54](#part0016.html#ref_54)].. The XML Encryption
    scheme includes an `Encryption Method` field used to define the cryptographic
    algorithms, a `Key Info` field used to define the key establishment method, and
    a `Cipher Data` field. Depending on the key establishment method, the sender and
    receiver will have additional keys (see [Figure 4.8](#part0009.html#fig4_8)).


    For example, the SAML message in [Figure 4.8](#part0009.html#fig4_8) includes
    an `Encrypted ID` with the `Encrypted Key` using a Diffie–Hellman (DH) key establishment
    scheme in the `XML Key Info` field. In addition to the SSL private key, the SAML
    server (SS) has another certificate with a private key and a copy of the RP certificate.
    Similarly, in addition to the SSL certificate, the RP has another certificate
    with a private key and a copy of the SS certificate. The SAML server uses the
    two DH certificates and its DH private key to compute a shared secret and derive
    a symmetric key for the `Encrypted Data`. Likewise, the RP uses the two DH certificates
    and its DH private key to compute the same shared secret and derive the same symmetric
    key for the `Encrypted Data`.


    ![](images/00052.jpeg)


    Figure 4.7  SAML confidentiality.


    ![](images/00053.jpeg)


    Figure 4.8  SAML cryptographic architecture.


    ### 4.4 Open Authorization (OAUTH)


    Open Authorization[^(\*)](#part0009.html#fn4_4) (OAUTH) is an open standard to
    enable authorization (not necessarily authentication) for web, mobile, and desktop
    applications. More specifically, OAuth 2.0 authorization framework[^†](#part0009.html#fn4_5)
    enables a third-party application to obtain limited access to an HTTP service.
    OAUTH should not be confused with the Initiative for Open Authentication[^‡](#part0009.html#fn4_6)
    (OATH) framework. [Figure 4.9](#part0009.html#fig4_9) shows the basic OAUTH protocol
    [[55](#part0016.html#ref_55)] which includes servers (client, service, authorization,
    and owner) and messages (authorization request, authorization grant, access token,
    protected resources).


    ![](images/00054.jpeg)


    Figure 4.9  OAUTH cryptographic architecture.


    The message flow is initiated by (a) authorization request and (b) authorization
    response messages between the OAUTH client and the OAUTH owner. The OAUTH owner
    grants (or denies) the client access to the requested service. If granted, the
    message flow continues by (c) authorization grant and (d) access token messages
    between the OAUTH client and the OAUTH authorization (OA) service. The OA service
    (which might be the same entity as the OAUTH owner) provides an access token.
    The message flow is completed by (e) access token and (f) protected resource messages
    between the OAUTH client and the OAUTH service (OS). The access token enables
    the OAUTH client to acquire the OS’s resources.


    OAUTH is expected to run over the most current TLS. Thus, each server will provide
    its Public Key certificate with the OATH client and manage its corresponding private
    key. The OAUTH owner (OO) server sends its certificate to the OAUTH client to
    establish the first TLS session, the OA server sends its certificate to the OAUTH
    client to establish a separate TLS session, and the OS sends its certificate to
    the OAUTH client to establish another TLS session. Thus, the OAUTH client might
    only have Public Keys relative to the various certificates. If mutual TLS authentication
    is used, then the RP would also have a certificate and a private key.


    ### 4.5 Password and PIN Verification


    Knowledge factor authentication is the “something you know” method which includes
    passwords and personal identification numbers (PIN). The methods for transporting
    passwords versus PIN are very different, as are the methods for verifying passwords
    versus PIN. Passwords and PIN are encrypted during transportation, which is discussed
    in [Chapter 5](#part0010.html#ch05), whereas [Figure 4.10](#part0009.html#fig4_10)
    shows password and PIN verification.


    Password verification basically consists of matching the entered password against
    the stored password in a secure manner. The entered password is transmitted securely
    (discussed in [Chapter 5](#part0010.html#ch05)) from the end-user process to the
    password verification process. The password verification process fetches the stored
    password from the end-user database which might contain hundreds, thousands, or
    millions of passwords. Thus, the verification process needs an end-user identifier
    to locate the correct end-user profile in order to fetch the correct password.
    The passwords are also stored in a secure manner. Likely, the stored password
    versus the transmitted password formats are different; the verification process
    needs to convert the formats into a common format in order to compare the two
    passwords. The comparison result (match or no match) is provided to the application
    service. The application service makes the final decision to grant or deny access
    as it might be using other authentication services in addition to password verification,
    or supports alternative authentication methods such as challenge questions.


    ![](images/00055.jpeg)


    Figure 4.10  Password and PIN verification.


    Password storage methods rarely keep cleartext; unauthorized access to the end-user
    database would compromise all passwords. Further, an administrator with authorized
    access might be coerced to reveal the passwords, so it is better to avoid storingtext
    passwords altogether. Stored passwords might be encrypted using a cryptographic
    key, but since password verification is typically done using software, protecting
    keys is problematic. Thus, most password storage is done using a hash algorithm.
    However, as discussed, hash algorithms are susceptible to dictionary attacks,
    commonly called rainbow tables. All possible passwords can be hashed such that
    an attack who has access to the end-user database can simply look up the hash
    against the rainbow table to determine the password.


    Password hashing uses two additional mechanisms to deter dictionary attacks: password
    salting and iteration counts [[39](#part0016.html#ref_39)]. As shown in [Figure
    4.11](#part0009.html#fig4_11), password salting adds a random value to the password
    before hashing such that the resulting hash value is changed by the addition of
    the salt. The salt is not intended to be kept secret; secret salting is analogously
    called peppering. Rather, the salt increases the work factor for creating the
    rainbow tables. Consider a work factor for one 8-character password allowing uppercase
    and lowercase letters, numerical digits, and special characters.


    ![](images/00056.jpeg)


    Figure 4.11  Password verification.


    ![](images/00002.jpeg)


    Password alphabet: 26 lower + 26 upper + 10 digits + 8 special = 70 possible characters


    ![](images/00002.jpeg)


    Possible 8-character passwords: 70⁸ or about 576 trillion possible passwords

    '
