  \ 0（二进制 0000）到十六进制 7（二进制 0111）的异或。\n\n表 2 提供了十六进制值 8（二进制 1000）到 F（二进制 1111）的异或。\n\
  \n请注意，异或今天仍用于关键组件和其他加密方法，因此读者有了参考资料。例如，查找 `7 ⊕ A`，在第一列找到十六进制 7（二进制 0111），在第一行找到十六进制\
  \ A（二进制 1010），以查找交集（二进制 1101），即十六进制 D，因此 `7 ⊕ A = D`，或者二进制 `0111 ⊕ 1010 = 1101`。另一种确定异或的方法是在位位上进行的，如下所示。\n\
  \n![images](img/00148.jpeg)\n\n表 1   十六进制 0-F XOR 0-7\n\n![images](img/00149.jpeg)\n\
  \n表 2   十六进制 0-F XOR 8-F\n\n![images](img/00150.jpeg)\n\n# X.509 证书快速参考\n\n本附录提供了\
  \ X.509 证书及其扩展的概述。\n\n## 证书\n\n主证书由三个主要字段组成：(1)待签名内容 (TBS)，(2) 由认证机构 (CA) 生成证书签名的数字签名算法，以及\
  \ (3) 实际的数字签名。TBS 字段由许多辅助字段组成，包括扩展（Extensions）。扩展字段实际上是许多扩展的序列，每个扩展都有一个称为对象标识符（OID）的唯一标签。OID\
  \ 基本是一个有序数字列表，每个位置和值都有特定含义，其特征是每个 OID 都有唯一的含义。\n\n![images](img/00151.jpeg)\n\n\
  认证机构 (CA) 生成 TBS 证书的数字签名，添加签名算法，例如 Rivest–Shamir–Adleman (RSA) 算法、数字签名算法或椭圆曲线数字签名算法，并附加数字签名以创建证书。证书签名是\
  \ TBS 证书字段的加密绑定，包括各种扩展字段，特别是主体的名称和公钥。\n\n## 扩展\n\nX.509 证书扩展仅存在于版本 3 证书中。虽然 X.509\
  \ 标准包含许多扩展，但本附录仅讨论了较常用且实用的扩展。\n\n### 权威密钥标识符\n\n此 X.509 扩展包含一个标识（通常是 SHA-1 哈希值），该标识对应于签名证书的\
  \ CA 私钥的 CA 公钥。其目的是帮助在证书验证期间促进证书链的构建，特别是当 CA 具有多个用于签名证书的不对称密钥对时。任何证书中的权威密钥标识符（AKI）都是下一个\
  \ CA 证书主体密钥标识符（SKI）。\n\n### 主体密钥标识符\n\n此 X.509 扩展包含证书内公钥的标识（通常是 SHA-1 哈希值）。其目的是帮助在证书验证期间促进证书链的构建。CA\
  \ 证书中的 SKI 是前证书中的 AKI。\n\n### 密钥用法\n\n此 X.509 扩展定义了公钥及其相应私钥的用途。该字段定义了九位，但通常用十六进制表示，其中每个“1”位表示一种密钥用法类型。允许任何位组合，但行业对于如何使用各种排列组合有通用的惯例。虽然密钥用法字段有助于确定证书类型，但扩展密钥用法（EKU）扩展也很有价值。\n\
  \n![images](img/00152.jpeg)\n\n例如，典型的 CA 证书发送了密钥证书签名 (5) 和证书吊销列表 (CRL) 签名 (6) 位，因此密钥用法值为十六进制\
  \ `06 = 0000 0110`。这两个位用于签名，因此不需要或不适用数字签名 (0)；然而，并非所有的 CA 都遵循相同的命名法，因此 CA 证书会有差异。\n\
  \n另一个示例是，用于签署电子邮件的证书可能设置了数字签名 (0) 位，因此密钥用法值为十六进制 `80 = 1000 0000`。相反，用于签署法律文档的证书可能同时设置了数字签名\
  \ (0) 和不可否认性 (1) 位，因此密钥用法值为十六进制 `C0 = 1100 0000`。然而，设置不可否认性位本质上并不提供不可否认性；而是需要实施额外的控制。\n\
  \n还有一个示例，用于密钥管理的证书可能设置了密钥加密 (2) 或密钥协商 (4) 位，取决于算法是否支持密钥传输（如 Rivest–Shamir–Adleman\
  \ 方案 (RSA））或密钥协商（如 Diffie–Hellman (DH) 或椭圆曲线 Diffie–Hellman (ECDH) 方案）。通常，TLS 证书具有用于客户端认证的数字签名\
  \ (0) 位和用于 RSA 密钥传输的密钥加密 (2) 位，因此密钥用法值为十六进制 `A0 = 1010 0000`。\n\n### 扩展密钥用法\n\n\
  此 X.509 扩展指示或替代基本密钥用法指示公钥的用途。EKU 字段不是使用位图，而是包含以下 OID：\n\n![images](img/00002.jpeg)服务器端认证\
  \ OID = `1.3.6.1.5.5.7.3.1` 用于具有一致密钥用法数字签名 (0) 且密钥位为密钥加密 (2) 或密钥协商 (4) 的 TLS。\n\n\
  ![images](img/00002.jpeg)客户端认证 OID = `1.3.6.1.5.5.7.3.2` 用于具有一致密钥用法数字签名 (0) 且密钥位为密钥加密\
  \ (2) 或密钥协商 (4) 的 TLS。\n\n![images](img/00002.jpeg)代码签名 OID = `1.3.6.1.5.5.7.3.3`\
  \ 用于使用具有一致密钥用法数字签名 (0) 的数字签名来保护可执行代码。\n\n### 证书策略\n\n\n\n\n\n此 X.509 扩展包含了证书的策略信息。对于实体证书，该扩展标识了颁发证书的特定策略，包括使用该证书的预期用途。对于\
  \ CA 证书，该扩展可能会列出颁发证书的策略集；然而，如果 CA 没有策略限制，则可以使用 `anyPolicy` OID = `2.5.29.32.0` 代替。具有特定策略要求的应用程序可以验证此扩展，并在不符合要求时拒绝该证书。理想情况下，此扩展包含一个指向\
  \ CA 发布的《证书实践规范》（CPS）的统一资源定位符（`URL`）。\n\n### 主体备别名称 (Subject Alternative Name)\n\
  \n此 X.509 扩展——主体备别名称（`SAN`）包含一个替代身份列表，基本上是一种“业务名称”信息。每个名称与主体公钥的关联程度与 `Subject`（主体）相同。这允许\
  \ `Subject` 使用相同的证书和非对称密钥，在多个名称下运行。\n\n行业惯例现在将主体通用名称（`CN`）与其他名称一起包含在 `SAN` 扩展中，有时\
  \ `SAN` 仅包含 `CN`。此外，`SAN` 的大小已扩展，允许包含数百个备用名称。这一变化缓解了对通配符证书的需求（其中 `Subject CN` `*`\
  \ 可以匹配任何名称）。例如，域名 `[www.example.com]` 可能被列为 `*.[example.com]`，它将匹配 `[sample1.example.com]`\
  \ 和 `[sample2.example.com]` 或任何类似的网站。相反，`SAN` 扩展将包含 `[www.example.com]`、`[sample1.example.com]`\
  \ 和 `[sample2.example.com]`，但不包含其他。通配符允许任何等效匹配，而 `SAN` 扩展将匹配限制在特定的名称集合。讽的是，在 `SAN`\
  \ 扩展中添加通配符名称基本上违背了使用 `SAN` 扩展的初。\n\n### 基本约束 (Basic Constraints)\n\n此 X.509 扩展标识证书主体是否为\
  \ CA，并可以进一步定义证书验证的最高 PKI 层次结构。否则，该证书为实体证书，其公钥不能用于验证证书签名。\n\n矛盾的是，实体自签名证书不是 CA 证书，但证书公钥却被用于验证证书签名。尽管有数字签名，自签名证书无法具有数据完整性或真实性，更不用说不可否认性。任何攻击者都可以更改任何证书信息，替换公钥并用相应的私钥对证书重新签名；这些更改是无法检测的。参见本附录关于自签名证书的讨论。\n\
  \n### CRL 分布点 (CRL Distribution Points)\n\n此 X.509 扩展提供了获取 `CRL` 信息的信息。通常，`URL`\
  \ 指向一个发布当前 `CRL` 以供下载的网站。`CRL` 标记是另一组位。\n\n### 授权信息访问 (Authority Information Access)\n\
  \n此 X.509 扩展提供了颁发者信息或颁发者服务的访问。颁发者信息可能包含有助于确定适当证书链的 CA 。颁发者服务可能包含验证服务，例如在线证书状态协议（OCSP）响应器的位置。授权信息访问扩展不包含\
  \ `CRL`，因为该信息位于 `CRL 分布点`扩展中。\n\n![images](img/00150.jpg)\n\n#### 自签名证书 (Self-Signed\
  \ Certificates)\n\n此 X.509 扩展标识证书主体是否为 CA，并可以进一步定义证书验证的最高 PKI 层次结构。否则，该证书为实体证书，其公钥不能用于验证证书签名。\n\
  \n矛盾的是，实体自签名证书不是 CA 证书，但证书公钥却被用于验证证书签名。尽管有数字签名，自签名证书无法具有数据完整性或真实性，更不用说不可否认性。任何攻击者都可以更改任何证书信息，替换公钥并用相应的私钥对证书重新签名；这些更改是无法检测的。参见本附录关于自签名证书的讨论。\n\
  \n![images](img/00151.jpg)\n图 1：自签名证书与 CA 签名证书对比\n\n自签名证书拥有由其自身私钥生成的签名，并使用公钥验证该签名。CA\
  \ 签名证书拥有由 CA 私钥生成的签名，并使用 CA 的公钥验证该签名。\n\n![images](img/00152.jpg)\n图 2：自签名证书与 CA\
  \ 签名证书的比较\n\n自签名证书拥有由其自身私钥生成的签名，并使用公钥验证该签名。CA 签名证书拥有由 CA 私钥生成的签名，并使用 CA 的公钥验证该签名。\n\
  \n![images](img/00153.jpg)\n\n### OID 快速参考 (OID Quick Reference)\n\n本附录提供了 OID 值的概述。ITU-T\
  \ X.660 标准对 OID 提供了以下定义。\n\n**对象标识符 (Object identifier)**：一个从国际 OID 树根到节点的有序主整数值列表，用于唯一地标识该节点。\n\
  \n![images](img/00154.jpg)\n\n根据该方案，每个编号的位置可以取 0 或更大的任意整数值，因此 OID 是无限可扩展的；由于可以使用任意数量的位置，因此\
  \ OID 是无限展开的。这使得每个 OID 在全球范围内都是唯一的。一旦定义并注册，OID 就永远不会被删除或更改。然而，多个 OID 可能具有相同的含义。\n\
  \n\n\n\n\nITU-T(0) 建议(0) 也写作 `0.0 arc`\n\nITU-T(0) 管理(2) 也写为 `0.2 arc`\n\nITU-T(0)\
  \ 网络运营商(3) 也写为 `0.3 arc`\n\nITU-T(0) 识别组织(4) 也写为 `0.4 arc`\n\nITU-T(0) R-建议(5) 也写为\
  \ `0.5 arc`\n\nITU-T(0) 数据(9) 也写为 `0.9 arc`\n\n次级 ISO 弧的定义如下：\n\nISO(1) 标准(0) 也写为\
  \ `1.0 arc`\n\nISO(1) 注册机构(1) 也写为 `1.1 arc`\n\nISO(1) 成员机构(2) 也写为 `1.2 arc`\n\n\
  ISO(1) 识别组织(3) 也写为 `1.3 arc`\n\n次级 联合 ISO-ITU-T 弧的定义如下：\n\nISO/ITU-T(2) 模块(1) 也写为\
  \ `2.1 arc`\n\nISO/ITU-T(2) 文档类型(2) 也写为 `2.2 arc`\n\nISO/ITU-T(2) asn-1(3) 也写为 `2.3\
