  \ BR 服务器。\n\n在图 6.13 中显示了近几十个密钥，包括对称密钥、异步公钥、数字证书以及异步私钥。图形描述提供了密钥的概述和相互关系。然而，它无法提供所有关联信息，因为空间不足以包含所有内容。另一种选择是将图形描述与清单进行交叉引用。但是，没有图形的清单意义较小；两者兼备是最优的。\n\
  \n### 6.5 加密清单\n\n除了图 6.13 中提供的加密架构图外，还可以提供更多信息，如表 6.2 所示的清单。可以使用简单的表格来总结基本的 5W1H\
  \ 问题。图表中能提供的信息量存在实际限制。信息过多会使图表杂乱且难以阅读，而信息过少则会降低其效用。某些图形化工具允许嵌入注释或附件，但这只允许读者一次看到一个实例。表格则允许读者查看常见的数据点或数据模式。\n\
  \n表 6.2 加密架构清单\n\n![images](img/00081.jpeg)\n![images](img/00082.jpeg)\n\n表 6.2\
  \ 的编号对应图 6.13 中的加密架构图。每行都提供了基本的 5W1H 问题。实体（谁）信息可以根据需要尽可能详尽；可能精确到特定的主机名。算法（什么）信息可以扩展到包含密钥长度（例如：Rivest–Shamir–Adleman\
  \ (RSA) 2048 位，高级加密标准 (AES) 256 位）。目的（为什么）可以增强以反映特定的应用程序或网络用途。位置（何地）可以扩展到包含物理地址（例如：主街\
  \ 123 号）或 IP 地址。协议（何时）可能包含协议选项或特定配置。进一步的细节（如何）可能包括处理限制、错误处理、法律保证或责任或其他业务相关的事务。\n\
  \n或者，可以使用使用抽象语法表示一 (`ASN.1`) 定义的元数据结构来对每个加密模块的关联信息进行编码。参考`附录：ASN.1 模块`以获取适用于编程语言代码生成工具的完整章节。抽象模式可能用于填充数据库或创建加密模块信息的图形化解释。\n\
  \n![Images](img/00083.jpeg)\n\n`Version` 标识 ASN.1 模块的发布版本。就本书而言，`附录：ASN.1 模块`中提供的结构版本号为零“0”。任何修改或更新都应增加版本号。这允许对语法进行程序化的解析和解释，以便显示信息或分析架构。\n\
  \n![Images](img/00084.jpeg)\n![Images](img/00085.jpeg)\n![Images](img/00086.jpeg)\n\
  \n`Host Info` (4) 被定义为 `Host Data`，它是另一个一个或多个 `Product Name` 序列，由五个数据元素组成：制造商、品牌、型号、序列号和别名。主机信息识别了与加密模块连接、编译、嵌入或绑定的相关系统。例如，HSM\
  \ 可能通过网络连接或物理线缆连接到服务器。另一个例子是，加密模块可能嵌入网络设备中。或者，加密库可能被编译到应用程序中或与操作系统绑定。\n\n![Images](img/00087.jpeg)\n\
  ![Images](img/00088.jpeg)\n\n总之，任何开发项目都会产生诸如应用程序或网络架构等产物，但加密架构往往被忽视。现代网络、系统和产品在演变过程中，加密几乎无处不在，但细节往往被忽略、未记录或简单地无视。应用程序开发者、技术经理和业务分析师往往只是寄希望于运气。当漏洞影响加密算法或协议时，其对架构的影响是未知的。因此，安全专业人员需要将加密架构的关键性纳入考虑。\n\
  \n## *第 7 章*\n\n## 风险管理\n\n风险管理基于这样一个假设：通过实施安全控制可以降低数据风险。虽然这通常是正确的，但在加密架构方面，所能实现的目标存在限制和权衡。图\
  \ 7.1 显示了一个具有风险下降曲线的风险模型。x 轴表示安全控制从左到右增加，y 轴表示数据风险从上到下减少。曲线实际上并没有触及 y 轴（靠近 x-y 原点处），因为每个系统和网络都有一些极少的安全控制（例如访问控制、事件日志）有助于降低风险。随着安全控制的增加（沿\
  \ x 轴从左向右移动），风险降低，曲线与 x 轴之间的距离代表残余风险。\n\n\n\n\n\n当然，目标是利用消耗最少资源、成本最低的安全控制措施来实现最低合理的风险，从而节省资金。这有时被称为“魔力盒”（Magic\
  \ Box），它代表了在可接受的安全控制下实现了足够低的风险。例如，如果成功攻击的概率被认为太遥远，或者对业务的影响被认为微乎其微，那么实施安全控制的可能性较低，特别是当该安全控制成本高昂且与应用程序及其数据的价值不成比例时。相反，如果安全控制带来的收益（如降低风险或符合合规性）足够高，且总成本可以接受并与应用程序（及其数据）成比例，那么该安全控制更有可能被实施。\n\
  \nISO/IEC 信息安全管理实践规范标准 [74] 建议，由管理层批准的信息安全策略文档应包含一个设定控制目标和控制的框架，包括风险评估和风险管理的结构。一个示例框架《联邦信息安全管理法风险管理框架》提供了一个六步流程\
  \ [75]。\n\n![](img/00089.jpeg)\n\n图 7.1    风险降低曲线。\n\n1. 根据影响分析，对信息系统以及该系统处理、存储和传输的信息进行`Categorize`（分类）。这一步考虑了法律法规、政策、指令、条例、标准以及组织的使命/业务/运营需求，有助于识别安全需求。\n\
  2. 根据安全分类，为信息系统`Select`（选择）一组初始基线安全控制；根据组织对风险的评估和当地状况，对安全控制基线进行调整和补充。\n3. `Implement`（实施）安全控制，并描述这些控制如何在信息系统及其运行环境中使用。\n\
  4. 使用适当的评估程序对安全控制进行`Assess`（评估），确定控制实施是否正确、是否按预期运行，以及在满足系统安全需求方面是否产生了预期结果。\n5. 根据信息系统运行对组织业务和资产、个人、其他组织以及国家带来的风险判断，以及该风险可接受的决策，对信息系统运行进行`Authorize`（授权）。\n\
  6. 持续监控信息系统中的安全控制，包括评估控制的有效性、记录系统或其运行环境的变化、对相关更改进行安全影响分析，并向指定的组织官员报告系统的安全状态。\n\n\
  然而，实施或衡量一个不影响或依赖于其他控制的安全控制通常是困难的。例如，实施密码构造规则（例如：由八字符组成，包含大写和小写字母且至少包含一个数字和一个特殊字符）实际上减少了可能密码的集合。同时，没有密码构造规则将允许用户选择糟糕且易于破解的密码。因此，添加密码构造控制会影响密码验证控制。但很少有任何安全控制是在孤立状态下运行的，安全模型见图\
  \ 7.2。需要理解安全需求，以确定整体风险与控制的平衡。\n\n图 7.2 显示了评估风险和控制的分层“洋葱”方法。加密密钥用于保护数据。加密模块用于保护加密密钥。但加密模块可能是计算机系统绑的软件库、嵌入在应用程序软件中，或封装在加密硬件安全模块（`HSM`）中。无论如何，系统保护加密模块。最终，具有物理和逻辑安全控制的设施保护系统。然而，在加密架构方面，存在内在的标准差距，如图图\
  \ 7.3 所示。\n\n当加密算法、密钥管理方案或安全协议的标准发布时，它将包含读者需要理解的要求（例如 `shall`）和建议（例如 `should`）。遗憾的是，当此类安全标准被产品化时，标准内容与产品实际功能之间往往存在差距。这是由于多种因素造成的，包括缺乏理解、缺乏知识、缺乏专业知识、设计缺陷、编码错误、成本限制以及上市时间。如今的信息技术行业倾向于以更少的测试将产品推向市场，导致修复、补丁和频繁的修改已成为常见主题。遗憾的是，这对于加密产品通常也是如此，因为它们的更新有时会对安全控制产生不利影响。\n\
  \n![](img/00090.jpeg)\n\n图 7.2    安全模型。\n\n![](img/00091.jpeg)\n\n图 7.3    标准差距。\n\
  \n另一个差距来源是加密产品的安装。当加密产品配置不当时，其安全性可能会受到损害。为了向下兼容，某些产品支持旧的算法、较弱的密钥或过时的协议。如果不需要的功能无法禁用只是不使用，那么存在漏洞的方法可能会被无意或故意使用，增加对应用程序环境的风险。此外，如果产品的使用方式与相应的标准或制造商的建议不，就会增加风险。例如，一个旨在加密数据的加密产品被用于加密密钥，增加了密钥泄露的风险。\n\
  \n一旦产品安装，就需要进行妥善管理。需要建立访问控制以防止未经授权的重新配置。错误修复、补丁和修改在非生产环境中经过充分测试后才能应用。需要监控处理过程以确保没有活跃攻击。配置更改、软件更改和处理过程都需要记录日志，并对日志进行分析。然而，如果产品管理不当，差距可能会增加风险，并随着时间的推移使风险不断增大。\n\
  \n后续章节将讨论每一层：设施安全、系统安全加密模块、密钥管理和数据管理。第一层设施安全将讨论物理和逻辑控制。\n\n### 7.1 设施安全\n\n设施安全包括各种物理和逻辑控制，用于保护系统，系统反过来保护加密模块，模块保护加密密钥，密钥用于保护数据。图\
  \ 7.4 展示了一个示例数据中心，它被安全围栏包围，并环绕着一条排水沟。一个带有岗亭的单一入口提供了校园的进出。停车位和大堂入口之间是一条环绕在土坡种植树木上的环形车道。建筑有屋顶进入通道，周围环绕着小路。\n\
  \n众多校园元素提供的物理安全控制代表了分层安全方法。每个元素提供的各种控制将从校园外部向内部呈现，最终进入实际的数据中心。\n\n\n\n\n\n![](img/00002.jpeg)设施周围的排水沟不仅能防止大雨期间的洪水，还充当了“invisible”屏障，防止车辆撞击安全栅。\n\
  \n![](img/00002.jpeg)环绕设施的安全围栏通过将交通引导至单一入口，阻止未经授权的人员进入设施。\n\n![](img/00002.jpeg)入口岗亭控制进出车辆流量，安保人员对员工和访客进行身份验证和授权。\n\
  \n![](img/00002.jpeg)景观树和加高的土堤是另一个阻止车辆进入建筑大厅的“invisible”屏障。\n\n![](img/00002.jpeg)建筑周围的小径允许安保人员巡逻地面。\n\
  \n![](img/00002.jpeg)建筑入口的大厅控制人员进出，安保人员对访客进行身份验证和授权。\n\n摄像头监控岗亭、停车场区域、大厅、通道、大厅内的人流量以及屋顶访问的情况。除了物理安全控制外，还有逻辑安全控制（如自动化流程和手动程序），它们补充了整体安全态势。\n\
  \n![](img/00002.jpeg)在入口处，安保人员必须识别员工，但检查任何陌生面孔（包括所有访客）的身份证明。访客必须由员工邀请。\n\n![](img/00002.jpeg)在大厅内，安保人员发放访客证并管理员工陪同。员工的证会被读取器扫描，以通过步入室（mantraps）进入主楼。\n\
  \n![](img/00002.jpeg)在主楼内，员工定期佩戴证并全程陪同访客。某些区域需要证访问和访客签到。\n\n摄像头视频和门禁日志被保留以备发生安全事件。某些视频保留在网上以供快速参考，而另一些则离线保存较长时间。安保人员巡逻通道和屋顶以检查建筑。问题会被立即报告并进行修复。定期审查视频和日志以确保连续性。任何异常或可疑活动都会立即报告。从加密架构的角度来看，限制访问加密设备、使用加密的系统以及加密材料存储的物理和逻辑控制，是一组重要的补偿控制。下一层“系统安全”讨论了业务连续性与性恢复（BCDR）、漏洞生命周期管理系统（VLMSs）以及渗透（pen）测试。\n\
  \n### 7.2 系统安全\n\n在第 6 章]，用于识别、获取、安装和验证补丁。该指南讨论了执行补丁管理时固有的挑战，并提供了技术概述。存在多种 VLMS\
  \ 模型。例如，Qualys 的论文《网络漏洞有效修复的指南》提供了一个八步流程 [77]\\]\n\n1. 创建安全策略和控制\n2. 跟踪库存/分类资产\n\
  3. 扫描系统漏洞\n4. 将漏洞与资产清单进行对比\n5. 分类风险\n6. 预测试补丁\n7. 应用补丁\n8. 重新扫描并确认修复\n\n另一个例子是 SANS（系统管理、审计、网络、安全）论文《实施漏洞管理过程》描述了一个更简单的五阶段计划\
  \ [78]\\]。SANS 的准备准备阶段基本上结合了 Qualys 的前两个步骤。两种模型都承认漏洞扫描；即 Qualys 的第三步和 SANS 的第三阶段。Qualys\
  \ 的第五、六、七步本质上被合并到了 SANS 的第四阶段。两种模型都建议重新扫描以确认修复结果。\n\n1. 准备\n2. 漏洞扫描\n3. 定义修复措施\n\
  4. 实施修复措施\n5. 重新扫描\n\n同样，X9.111 标准 [79]\\] 定义了渗透测试的五个阶段。漏洞扫描是一个尝试识别针对已知网络攻击的潜在漏洞存在的过程；而渗透测试则尝试利用漏洞来确定是否可能发生未经的访问或其他恶意活动。渗透测试包括网络和应用测试，以及围绕网络和应用程序的控制和流程，并且既可以从网络外部尝试进入（外部测试），也可以从网络内部进行。\n\
  \n1. 渗透测试规范\n2. 参与指南\n3. 渗透测试活动\n4. 参与报告\n5. 修复\n\n第一阶段是识别和评估工作说明书中约定的信息安全目标。第二阶段是对测试参数和范围达成共识。第三阶段是实际渗透测试活动。第四阶段是测试人员向组织报告发现。第五阶段是独立于测试人员的修复，如果测试人员参与，则同一测试人员不能进行后续测试。从加密架构的角度来看，BCDR\
  \ 和 VLMS 以及渗透测试是确保加密设备、使用加密系统以及加密材料存储可靠性的重要方面。下一层“加密模块”涉及硬件与软件加密，以及使用和管理加密模块的网络安全。\n\
  \n### 7.3 加密模块\n\n加密模块通过执行加密算法（例如加密、消息认证码 (MAC)、密钥哈希消息认证码 `HMAC\\`、数字签名）以及在算法执行期间保护加密密钥提供加密服务。加密模块还执行不使用密钥的相关功能（例如哈希、数字生成）。为了让加密算法使用密钥，密钥必须是明文。密钥可以使用另一个密钥（称为密钥密钥\
  \ KEK）进行加密，以在存储或传输期间保护它，但在内存中执行算法时必须进行解密。参见[图 7.5 的加密模块示例。\n\n![](img/00093.jpeg)\n\
  \n图 7.5 内部加密模块。\n\n\n\n\n\n图 7.5 显示了位于受操作系统控制的计算机系统内存中的内部加密模块。算法在加密模块的内存中执行。数据密钥以加密形式存储在系统存储器中。加密密钥从存储器获取并传输到加密模块，在模块中使用\
  \ `KEK` 进行解密。明文 `KEK` 和明文数据密钥永远离开模块内存。现在，明文数据密钥可以使用算法进行操作。\n\n图 7.5 还显示了进入和离开算法的数据输入输出。输入数据从系统内存移动到模块内存，以便算法和数据密钥对其处理，输出数据则从模块内存移动到系统内存。例如，输入数据可能是明文，通过算法和密钥进行加密，使得输出数据变为密文。相反，输入数据可能是密文，通过算法和密钥进行解密，使得输出数据变为明文。\n\
  \n如果加密模块是基于软件的，则模块内存与系统内存相同，这意味着明文 `KEK` 和明文数据密钥容易受到攻击。然而，如果加密模块是基于硬件的，则模块内存与系统内存分离，这意味着\
  \ `KEK` 和数据密钥永远不会暴露在加密模块之外。通常，加密硬件模块的设计旨在保护密钥，并仅允许输入和输出明文数据。\n\n图 7.6 显示了一个连接到网络的外部加密硬件模块，通常被称为\
  \ `HSM` 或安全加密设备 (`SCD`)。与内部模块类似，算法在加密边界内执行。加密数据密钥传输到模块，在模块中使用明文 `KEK` 进行解密。明文 `KEK`\
  \ 和明文数据密钥永远离开加密边界。图中显示的数据输入和输出也以类似的方式进行传输，通常通过应用程序系统与加密模块之间的安全网络连接进行。安全网络连接通常使用传输层安全协议\
  \ (`TLS`) 或等效加密协议。`HSM` 通常有自己的公钥基础设施，使得加密模块作为根证书机构 (`CA`)，向自己颁发 `TLS` 服务器证书向应用程序系统颁发\
  \ `TLS` 客户端证书。\n\n![](img/00094.jpeg)\n\n图 7.6 外部加密模块。\n\nNIST [80]] 将加密模块定义为实现批准的安全功能（包括加密算法和密钥生成）并包含加密边界内的硬件、软件和/或固件集合。NIST\
  \ 进一步将加密边界定义为明确定义的连续边界，它建立了加密模块的物理边界，并包含了加密模块的所有硬件、软件和/或固件组件。NIST 标准定义了 11 个安全区域的要求，并分为四种不同的安全级别，总结在\
  \ 表 7.1 中。\n\n### 安全级别 1\n**安全级别 1** 是最低的安全级别，允许在通用计算系统上使用未经评估的操作系统执行加密模块的软件（或固件）组件。然而，其优势之一是包含了经过批准的算法（或安全功能）。批准意味着算法已通过评估，根据相应的标准正确实现，例如对称算法高级加密标准\
  \ (`AES`) [81]]。因此，可以避免由于算法薄弱或软件漏洞导致的漏洞问题。\n\n### 安全级别 2\n**安全级别 2** 通过防篡改机制、基于角色的认证\
  \ (`RBA`) 和经过评估的操作系统对级别 1 进行增强。硬件防篡改机制包括可见涂层、可观察封条、防钻锁和可拆卸盖。软件完整性机制可能包括用于代码签名的 `MAC`、`HMAC`\
  \ 或数字签名。`RBA` 意味着加密模块验证操作员的权限以承担特定角色（例如终端用户、密钥管理器、管理员）并执行相应的服务集。经过评估的操作系统意味着它已使用通用标准\
  \ [82]] 保护配置文件 (`PP`) 在评估保证等级二 (`EAL2`) 下通过评估。\n\n### 安全级别 3\n**安全级别 3** 通过增加防篡检测和防改响应机制、基于身份的认证、专用输入/输出端口以及经过评估的\
  \ `EAL3`（或更高）操作系统对级别 2 进行增强。对未经授权物理访问的识别会触发密钥清零；一旦检测到，模块将擦除加密密钥。认证验证所识别的操作员有权访问特定角色并执行相应的服务集。专用端口要求明文关键安全参数\
  \ (`CSPs`)（如密钥组件）的导入或导出在物理或逻辑上与其他端口分离。操作系统需要根据通用标准 [82]] `PP` 在 `EAL3` 进行评估。\n\n\
  表 7.1 NIST 安全要求摘要\n\n![images](img/00095.jpeg)\n\n![images](img/00096.jpeg)\n\n\
  ### 安全级别 4\n**安全级别 4** 是最高的安全级别，通过要求更强的防篡改机制、环境传感器和经过评估的 `EAL4`（或更高）对级别 3 进行增强。任何物理渗透的检测都会触发密钥清零。环境传感器验证模块是否在其正常运行范围（例如电压、温度、振动）内使用，以防止攻击。操作系统需要使用通用标准\
  \ [82]] `PP` 在 `EAL4` 进行评估。\n\n表 7.1 显示了每个安全级别增加的要求，但某些区域适用于多个级别。例如，安全区域 (1) `加密模块规范`\
  \ 对四个级别都有相同的文档要求。相反，安全区域 (2) `加密模块端口` 对级别 1 和 2 要求相同，但对级别 3 和 4 分离了 `CSPs` 数据端口。另一个例子是安全区域\
  \ (5) `物理安全` 为每个安全级别增加了要求。图 7.7 提供了表 7.1](#part0012.html#tab7_1) 要求的图形总结。\n\nNIST\
  \ 标准还翻译成了国际标准 [83]]，美国国家标准协会 (`ANSI`) [84]] 将 `SCD` 定义为提供物理和逻辑保护的加密和服务存储的设备，例如密码\
  \ (`PIN`) 输入设备或 `HSM`。然而，只有 NIST 为其认可的算法提供了加密模块验证计划^(\\*) 和加密算法验证计划^(\\*)。国家信息保障伙伴^†\
  \ (`NIAP`) 是 NIST 与国家安全局之间的伙伴，旨在支持通用标准评估与验证方案。通用标准 [82]] 提供了一种定义产品评估安全要求的方法。要求以独立标准组织发布的\
  \ `PP` 或通常由产品制造商提供的安全目标的形式发布。NIAP 维护一份批准的 `PP` 列表^‡；值得注意的是，目前还没有加密模块的 `PP`。\n\n\n\
  \n\n从加密架构的角度来看，基于标准的加密方法优于专有解决方案。然而，不同的算法和其他加密需求在全球范围内各不相同，某些国家会强制要求某些算法。此外，优选经过独立权威机构（例如\
  \ `NIST`）评估的加密模块。具有 `NIST` 认证的模块对加密算法进行了评估（至少是经过 `NIST` 批准的算法），并提供了安全配置文件。安全配置文件识别了所有的加密算法、密钥长度、哈希长度和安全协议；它是准确可靠加密信息的价值来源。下一层“密钥管理”讨论了密钥生命周期。\n\
  \n### 7.4 密钥管理\n\n加密密钥（包括对称密钥、非对称密钥对和相关的加密材料）在整个生命周期内都需要安全地管理。密钥生命周期阶段在不同标准和组织之间存在差异，对于本书，提供了图\
  \ 7.8 中的 `ANSI X9.79` [85] 密钥生命周期。共认有六个阶段：(1) 密钥生成，(2) 密钥分，(3) 密钥使用，(4) 密钥撤销，(5)\
  \ 密钥终止，和 (6) 密钥存档。如果没有适当的控制，密钥在任何生命周期阶段都面临泄露的风险。\n\n![](img/00098.jpeg)\n\n图 7.8\
  \ 密钥管理生命周期。\n\n![](img/00002.jpeg)对称密钥可能泄露，导致加密数据被破解或数据被修改或替换。\n\n![](img/00002.jpeg)非对称私钥可能泄露，导致加密的加密材料被破解或创建伪造数字签名。\n\
  \n![](img/00002.jpeg)非对称公钥可能被替换，导致各种中间人攻击 (MITM)。数字签名可能被类似的替换，或者加密的密钥材料被破解。\n\n\
  文中讨论了每个密钥管理生命周期阶段的相对风险。虽然某些风险比其他风险更具理论性，但也审查了实际现实世界的攻击。对于某些案例研究，提供了风险场景，但名称保持匿名。\n\
  \n**密钥生成**发生在创建密钥时。对称密钥使用随机数生成器 (`RNGs`) [86] 和 [89] 或伪随机数生成器 (`PRNGs`) [88] 生成。`RNG`\
  \ 需要一个良好的熵源 [87] 以确保随机性是真实的。否则，如果熵源受到影响，对称密钥或其某些位可能是可预测的。攻击者可以利用这种预测性减少穷举攻击的可能密钥空间，例如常见漏洞披露\
  \ (`CVE-2017-15361`) 中定义的 Coppersmith 攻击。同样，`PRNG` 依赖于 `RNG` 的随机输入。或者，`PRNG` 可能使用相同的密钥材料在一次或不同位置建立相同的密钥。\n\
  \n非对称密钥成对生成，即私钥和公钥，不仅依赖随机数，还依赖素数生成器 (`PNGs`) [90]。随机数可以使用概率测试进行素性测试，或者素数可以构造出来。然而，素数也需要随机生成。如果\
  \ `PNG` 是可预测的，攻击者就可以利用该缺陷攻击非对称密钥生成方案。\n\n非对称公钥应封装在数字证书 [45] 中。正如附录 X.509 证书快速参考所述，自签名在没有额外安全控制的情况下不可靠。创建并提交证书签名请求\
  \ [91] 给注册机构 (`RA`) 是密钥生成阶段的一部分。`RA` 验证并授权提交者，`CA` 生成并签名，`RA` 将其返回给请求实体。如果 `RA`\
  \ 验证提交者失败可能会颁发伪造证书。\n\n表 7.2 加密强度\n\n![images](img/009.jpeg)\n\n更糟糕，如果 `RA` 没有按照适当的安全控制运行，就会颁发伪造证书，例如\
  \ DigiNotor](#part0012.html#fn7_6) 或 Comodo](#part0012.html#fn7_7)。发了伪造的代码签名证书，使得攻击者伪装成合法软件供应商并分发恶意软件。\n\
  \n**密钥分发**当密钥从生成点传输到使用点时（如果它们不同）是必要的。当密钥在同一设备或位置生成并使用时，可能不需要分发。因此，密钥分发是一个条件阶段。然而，密钥分发包括对称、非对称私钥和非对称公钥的移动。当使用合法证书（例如\
  \ `CA` 签名证书）分发公钥时，完整性和真实性更高。然而，对称和非对称私钥需要机密性。\n\n对称和非对称私钥的机密性通常使用先建立的 `KEK` 完成。`KEK`\
  \ 可能是非对称公钥。`KEK` 需要具有与密钥交换或更高的加密强度，否则弱的 `KEK` 可能会破解密钥。参见表 7.2 的加密强度。该表是 `NIST` 算法和等效长度的摘要\
  \ [92]。`NIST` 计算了使用各种攻击进行破解的工作因子，但不是用时间来表示（因为时间随计算机的数量和大小而异），强度用密钥搜索的位数来表示。\n\n\
  例如，`3DES-2K` 使用两个 56 位密钥的三重 DES 算法（使用第一个密钥加密，使用第二个密钥解密，然后使用第一个密钥加密）具有 112 位密钥，但仅有\
  \ 80 位强度。然而，具有 128 位密钥的 `AES-128` 具有 128 位强度。相反，具有 2048 位密钥的 `RSA-2048` 由于已知的缺陷和攻击，只有\
  \ 112 位强度。因此，`RSA-2048` 足够加密 `3DES-2K`，因为它们都有 112 位强度，但不足以加密 `AES-128`。因此，应使用 `RSA-3072`\
  \ 来加密 `AES-128` 密钥。该表仅包含 `NIST` 批准的对称、非对称和哈希算法，因为其他算法尚未公开评估。\n\n对于这个案例研究，支付处理器的\
  \ `HSM` 遇到硬件故障，导致加密密钥丢失。故障转移没有按预期发生，因为备份 `HSM` 在几个月前也同样故障了，但运营团队忘记更换单元。存储在离线保险箱中的备份密钥没有帮助，因为硬件芯片是空的。密钥的丢失导致支付处理的中断。因此，所有银行的密钥都必须在周末发送给支付处理器，而忙更换密钥组件遇到了许多问题。密钥和密钥组件以明文值传真，密钥组件由个人交付或接收，密钥组件散落在六个人可以接触的会议室桌上。密钥泄露的可能性非常大。\n\
  \n\n\n\n## 密钥用法\n\n`Key Usage` 在密钥生成并可能分发后发生。在本章关于加密模块的讨论中所提到的，密钥可能存储并使用在软件或硬件中。因此，加密密钥所提供的保护取决于加密模块的安全级别以及应用与运行环境的结合。应用和运行控制已在“设施安全”和“系统安全”章节中讨论过。请参见图\
  \ 7.9 关于业务安全目标与安全控制的图形化解释。x 轴代表四个加密模块安全级别，y 轴代表由应用和运行环境提供的额外安全控制。从理论上讲，业务线（LOB）可以通过将加密模块与额外的应用及运行控制相结合来实现其安全目标。\n\
  \n![](img/00100.jpeg)\n\n图 7.9 信息安全级别。\n\n在此示例中，五个不同的业务线以不同的方式实现了其安全目标。两家企业选择了高（5\
  \ 级）安全环境，但其中一个选择了 1 级加密模块，而另一个选择了第 4 级加密模块。前者业务线需要实施强的环境安全控制来补偿 1 级模块，而后者业务线可以依靠第\
  \ 4 级模块以及较少的环境安全控制。相反，另一个业务线同样选择了 1 级加密模块，但安全环境要低得多（2 级）。另外两家企业选择了中等安全环境，但使用了不同的加密模块：中等（3\
  \ 级）使用 2 级模块，中等（4 级）使用 3 级模块。每个业务线都需要根据相对于其加密模块的安全策略以及各种环境提供的补偿安全控制来使用其加密密钥。\n\n\
  另一个重要的密钥用法控制是密钥用于其预期用途，也称为密钥分离（key separation）。密钥分离超了第 2 章中讨论的加密功能：加密、MAC 和 HMAC\
  \ 以及数字签名。相反，密钥用法还需要涵盖受保护的数据类型、应用环境以及支持的业务逻辑。这通过示例得到最好的说明。\n\n![](img/00002.jpeg)符合\
  \ X9.8 \\[73]，持卡者 PIN 在输入点加密，并在传输到发行机构验证的过程中保持加密状态。虽然可以使用第 3 章中讨论的各种密钥管理方法建立 PIN\
  \ 密钥（PEKs），但 PEK 且 PEK 应仅用于保护 PIN。加密模块的设计是为了执行 PIN 翻译，使得加密的 PIN 使用一个 PEK 解密并使用另一个\
  \ PEK 重新加密，以便 PIN 可以从一个网络域发送到另一个网络域而永远不会变成明文。然而，数据加密密钥（DEKs）旨在加密和解密其他类型的数据，使得明文进入加密模块并输出密文，或者密文进入并输出明文。因此，`DEK`\
  \ 不能代替 `PEK`，因为明文 PIN 会泄露。\n\n![](img/00002.jpeg)符合 X9.31 \\[10]，RSA 密钥对不应同时用于数据加密和数字签名。RSA\
  \ 签名是通过使用私钥加密哈希值生成的，验证则需要使用相应的公钥解密哈希值以恢复哈希。然而，加密模块可以通过提交密文作为签名来被伪造；模块会尽职地解密该“签名”，但返回的不是解密后的哈希，而是揭示了解密后的密文。当依赖方加密加密材料（如\
  \ TLS 中的共享密钥）时，共享密钥会被泄露；或者当 PIN 被加密时，PIN 会泄露。注意的是，大多数 TLS 证书都同时具有支持服务器的密钥加密位和支持客户端的数字签名位，前提是\
  \ TLS 软件是唯一用户。\n\n![](img/00002.jpeg)另一个示例是将最初为 TLS 生成的 RSA 密钥对重用于密码加密。如所述，大多数 TLS\
  \ 证书都同时具有支持服务器的密钥加密位和支持客户端的数字签名位。但 TLS 证书通常没有设置数据加密位。将 TLS 密钥对用于密码违反了证书密钥用法位。允许密码进程重用\
  \ TLS 密钥会导致 TLS 进程能够解密密码，且密码进程能够解密 TLS 共享密钥。因此，密码和 TLS 会话密钥都会泄露。\n\n与重用密钥相关的风险有很多，只需为每个特定用途生成独立的密钥要容易得多且更好。尝试分析每种密钥重用情况的各种风险和信息泄露是有问题且耗费的。将密钥分离作为一种安全控制是一种有效的策略和价值的密钥管理实践。\n\
  \n密钥用的另一个重要方面是密钥的备份和恢复。在许多合法场景下，加密密钥可能会丢失。加密模块可能会断电、灾难性故障，数据中心可能会洪水，设施可能会起火，或者整个区域可能遭受地震。无论如何，密钥副本可以重新加载到恢复或替换的加密硬件或软件模块中。然而，不安全的恢复过程（如密钥分发中描述的案例所示）会显著增加风险。\n\
  \n`Key Revocation`（密钥吊销）是在密钥过期前的意外终止。所有密钥都需要有效期；密钥不能永久使用。可能最为人知的吊销机制是证书吊销列表（CRL）\
  \ \\[47]，但在线证书状态协议（OCSP） \\[93]\\]正越来越流行。CRL 基本上是公钥证书的负列表，并延伸相关的私密钥，这些证书由于各种原因被颁发\
  \ CA 吊销。OCSP 最初被认为是颁发 CA 所有有效证书的正向文件，但现在已退变为负向文件，使用 CRL 作为输入来维护 OCSP 数据库。对依赖方的优势是，可以将特定证书提交给\
  \ OCSP 响应器以获取当前状态。否则，依赖方需要下载当前的 CRL 并检查整个列表。\n\n对称密钥吊销没有通用的行业机制。当对称密钥被吊销时，通常的过程只是简单更换密钥。然而，通常情况下由新密钥保护的新数据是不够的；还需要考虑由旧密钥保护的老数据。例如，当数据库加密密钥（DBEK）更改时，使用之前的\
  \ `DBEK` 加密的数据需要从旧 `DBEK` 翻译到新的 `DBEK`。另一个例子是，如果更改了 `DEK`，则任何使用旧 `DEK` 加密的数据可能需要翻译到新的\
  \ `DEK` 或删除。考虑日志加密密钥（LEK）；旧日志可能会被删除，但如果日志需要保留更久，它们可能需要翻译到新的 `LEK`。允许数据以旧密钥加密存储的相对风险需要进行评估，因为被吊销的密钥可能仍然泄露或被彻底破解。使用旧密钥加密的旧数据副本应迁移到新密钥或直接删除。\n\
  \n\n\n\n\n某些安全策略考虑了在密钥泄露这种极罕见情况下的撤销；然而，有许多合法的业务和运营原因会导致提前终止加密密钥。例如，当员工离职或被解雇时，雇主提供的任何加密密钥都需要撤销；禁用员工账户是必要的，但并不充分，因为攻击者可能会重新使用这些密钥。另一个例子是，当在线网络服务停用时，发放给该服务的`TLS`密钥需要撤销。一个遗憾的场景是为去世客户撤销加密密钥。\n\
  \n### 密钥终止 (Key Termination)\n`Key Termination` 是预期的密钥过期。如所述，所有密钥都必须有有效期；密钥不能永久使用。不幸的是，安全专业人员发现已使用十年或更久的密钥并不罕见。数字证书\
  \ [13]\\]中公钥中最为人知的有效期是 `not-before` 和 `not-after` 有效日期；参见附录：X.509 证书快速参考以获取数字证书概述。常见的假设是证书的有效期同样适用于相应的私钥，但情况并非如此。例如，用于验证数字签名的公钥生命周期可能比用于生成数字签名的私钥更长。这一点可以参考代码签名证书：如果软件上的签名日期在证书的\
  \ `not-after` 有效日期之前，即使证书已过期，签名通常仍被认为是有效的。相关的风险是系统钟可以调整到更早的时间以反映更早的软件签名。\n\n当对称密钥或异步私钥过期时，正确的做法是销毁所有副本以防止滥用。数据无法使用过期的密钥加密，之前加密的数据无法解密。无法使用过期的私钥生成数字签名。然而，数字签名可能仍然可以验证，因为公钥证书是公开的，可能每一份副本都未被纳入范围。与密钥终止相关的风险是忽略了过期的密钥。此外，当密钥用于身份验证和完整性（如\
  \ `MAC`、`HMAC` 或数字签名）时，可能存在业务或运营需求，在超出运行周期后保留密钥。\n\n### 密钥归档 (Key Archive)\n`Key\
  \ Archive` 是在密钥超出运行周期后将其保留。归档密钥不允许存在于生产环境中，否则可能会被滥用。相反，归档密钥存储在隔离环境中，仅用于验证旧的受加密保护的数据（例如\
  \ `HAC`、`HMAC`、数字签名），以应对欺诈调查、传票、诉讼或其他法律争议等事件。用于数字签名的私钥绝不应归档，以避免任何伪签名可能。在实践中，加密密钥很少被归档。归档密钥相关的主要风险将其重新安装到生产环境中。\n\
  \n### 7.5 数据管理\n与加密密钥类似，数据也有自己的生命周期。虽然有许多数据管理模型，但图 7.10 提供了一个基于本章讨论的密钥管理生命周期的数据生命周期状态转换图。数据生命周期阶段类似于密钥生命周期阶段：(1)\
  \ 数据创建，(2) 数据传输，(3) 带备份和恢复的数据使用，(4) 数据删除以及(4) 数据保留。\n\n#### 数据创建 (Data creation)\n\
  `Data creation` 是信息首次提供的过程。例如，分配账号、分配密码、分配社会安全号、保存电子表格、撰写电子邮件、发布文档、输入推文、创建卡片账号、与持卡人共享\
  \ `PAN`、与商户共享 `PAN` 以及对 `PAN` 进行去令牌化。如第 2 章所述，保护信息的方法之一是 `detokenization`。\n\n####\
  \ 数据传输 (Data transfer)\n`Data transfer` 是发送或接收信息的过程。通过公共网络（如互联网）、私有网络（如 `MPLS`）或专用连接（如租线）进行数据加密变得越来越常见。`TLS`\
  \ 和 `IPsec` 等加密解决方案在第 5 章中进行了讨论，但如第 3 章所述，有很多可用的管理方法。本章还讨论了影响加密的密钥管理生命周期相对风险。\n\n\
  ![](img/0101.jpeg)\n\n图 7.10 数据管理。\n\n然而，加密架构中需要考虑的另一个常见安全控制是对传输中加密数据的监控。企业级监控在第\
  \ 3 章中讨论过，并在图 7.11 中再次展示，显示浏览器通过 `TLS` 连接到服务器。`TLS` 连接从浏览器出发，通过互联网连接到位于 DMZ 内的服务器。服务器拥有一个\
  \ `TLS` 非对称公私钥对，其证书与浏览器共享。TLS 非对称密钥对被复制到位于企业内部的监控系统中。TLS 流量在 DMZ 内被捕获并同样复制到监控系统中。监控系统可以重放\
  \ TLS 握手，从而重新计算会话密钥并解密。\n\n然而，如果使用了临时密钥，监控系统无法重新计算会话密钥，因为临时密钥寿命很短且在服务器外部不可用。3](#part0008.html#ch03)，`TLS\
  \ v1.3` 已在第 5 章中讨论过。`TLS v1.3` 强制使用临时密钥以实现后安全性，并弃用了用 `RSA` 进行密钥建立。基于目前的设计，监控系统可能无法转发\
  \ TLS 握手；监控系统需要访问临时密钥。\n\n另一种基于浏览器的监控方法使用 `MITM` 证书，如图 7.12 所示。企业网络内部的浏览器通过 `TLS`\
  \ 连接到互联网上的服务器。在这种情况下，企业需要监控入站流量以发现可能的恶意软件，并监控出站流量以防止数据泄露。监控由位于 DMZ 的代理服务器完成，该服务器干预浏览器和服务器之间；代理服务器也是一个颁发\
  \ `MITM` 证书的证书机构 (CA)。`MITM` 证书适用于任何包含临时密钥的 `TLS` 密码套件。\n\n\n\n\n\n# HTTPS 与 MITM\
  \ 拦截\n\n从浏览器到服务器的 HTTPS 调用被重定向到代理服务器，该服务器拦截服务器的 TLS 证书。代理 CA 通过复制 TLS 证书、将服务器公钥替换为代理公钥，并使用代理\
  \ CA 密钥对 MITM 证书进行签名，颁发 MITM 证书。浏览器识别代理 CA，因此使用 MITM 证书与代理建立 TLS 连接。代理使用 TLS 证书与服务器建立\
  \ TLS 连接。服务器认为代理是浏览器，因此代理充当 TLS 客户端。浏览器认为代理是服务器，因此代理也充当 TLS 服务器。MITM 证书保留了服务器的主体名称（subject\
  \ name），因此浏览器不会产生名称不匹配；然而，服务器并不知道已经以其名义使用伪造公钥发了一个 MITM 证书。\n\n![](img/00102.jpeg)\n\
  图 7.11 企业监控。\n\n![](img/00103.jpeg)\n图 7.12 MITM 监控。\n\n# 数据使用与监控\n\n`Data usage`（数据使用）是指信息被存储并随后被读取或写入。读取访问和写入访问是基本的访问控制机制。针对网络、系统、应用程序、数据库和其他非易失性存储设备的逻辑访问控制限制了授权用户和管理员访问数据。然而，如果访问控制可以被绕过或欺骗，信息可能会泄露给未经授权的攻击者。绕过包括对存储设备的物理访问，这避开了网络控制。本地控制台访问可能会绕过系统、应用程序或数据库访问控制。身份盗窃、密码破解、伪凭据、社会工程和系统攻击可以欺骗访问控制。因此，数据监控和数据库加密已演变为信息安全控制。\n\
  \n`Data monitoring`（数据监控）在系统、文件、记录或字段级别观察信息对象的各种类型访问。监控工具通常不验证或授权访问，而是将操作与`security\
  \ policy`（安全策略）进行对比。例如，如果个人具有读取权限，但管理员启用了写入权限，监控系统将触发报警。另一个例子是，如果通过违反安全策略意外协议或端口访问数据库，监控系统将触发另一个报警。\n\
  \n# 数据库加密\n\n`Database encryption`（数据库加密）使信息在磁盘上保持加密状态，仅在需要时在内存中进行解密。加密可以在数据库表、数据库列、系统文件、记录或字段级别进行管理。数据库加密的密钥管理方法在第\
  \ 3 章中讨论。如果访问控制被绕过或物理磁盘被盗，信息是加密的，理论上是不可访问的。当然，如果有足够的时间和资源，任何加密密钥都可能被破解。\n\n# 数据删除与保留\n\
  \n`Data deletion`（数据删除）是指从存储器中擦除信息。然而，与所有所有实例加密密钥不同，数据删除可能分阶段进行。在一个系统中过期的信息在另一个系统中可能没有相同的过期时间。备份副本有时作为数据保留的一部分被保留。另一个考虑是信息位于云端的情况。第三方数据删除通常很难管理、验证和审计。通常第三方服务提供商（包括云提供商）不允许对存储系统进行审计。\n\
  \n另一个误区是加密数据可以通过简单销毁加密密钥来逻辑逻辑删除；然而，这种情况现在已不再适用。正如在数据使用中提到的，如果有足够的时间和资源，任何加密密钥都可能被破解。如果数据的价值持续超过破解密钥所需的时间，那么详尽的密钥攻击总是可行的。\n\
  \n`Data retention`（数据保留）用于长期信息存储。正如数据删除中提到的，备份副本有时为了数据保留而被保留。数据保留因行业（如医疗保健与金融服务）、业务类型（如汽车贷款与抵押贷款）或公司政策而异。然而，如果保留期超过密钥寿命，则需要对加密进行转换\
  \ [94]\\]，可能从一个密钥转换为另一个密钥、更长的密钥，甚至是另一种算法。\n\n例如，1980 年使用`RSA 512-bit`密钥签署的文档在 1990\
  \ 年将是不安全的，而 1990 年使用的`RSA 1024-bit`密钥在 2010 年也被认为是不安全的。保留证据链的正确方法是通过重新对已签名文档进行签名来保留每个签名，如图\
  \ 7.13 所示。使用 `RSA-512` 密钥签名的原始文档随后使用 `RSA-1024` 密钥签名，再次使用 `RSA-2048` 密钥签名，最终使用 `ECDSA`\
  \ 签名。\n\n\n\n\n\n安全专业人员的角色包括信息安全咨询。咨询包括确定已实施哪些安全控制措施、识别控制缺口、协助业务部门（LOB）评估风险以及建议解决方案。然而，确定控制措施往往会产生问题。正如第\
  \ 1 章所讨论的，知识通常分散在各个团队中，如应用程序组、网络组、数据库组、管理员以及各种开发人员。收集和整合信息是任何安全专业人员的一项技能；如图 8.1\
  \ 所示，这包括筛选文档、进行访谈、测试、执行分析并最终生成报告。\n\n在评估开始时，安全专业人员对于问题、产品、应用程序、环境或业务可能掌握的很少或完全没有信息。收集信息往往是困难的。评估者可能是企业外部人员（以进行独立评估），也可能是员工（以进行内部评估）。企业的规模、复杂性和组织结构可能会阻碍知识共享。个人或小组可能由于内部政治、个人意图或推卸责任而保留相关信息。产品制造商和服务提供商有时不愿分享细节，或由于知识流失而无法分享。合并、收购、产品周期结束和重品牌都会影响信息。唐纳德·拉姆斯菲尔在\
  \ 2002 年向北大西洋条约组织的报告中引用了 \\[96\\]，描述了其中已知和未知的情况。\n\n现在这里传达的信息是什么？信息就是没有所谓的“已知”。我们有自己自己知道的事。有“已知的未知”。也就是说，我们现在知道自己不知道某些事。但还有“未知的未知”。即我们不知道自己不知道某些事。所以，当我们尽所努力并将所有信息整合在一起，然后说“好吧，这基本上是我们对形势的看法”，那实际上仅仅是“已知的已知”和“已知的未知”。而每年我们都会发现更多此类的“未知的未知”。\n\
  \n**唐纳德·拉姆斯菲尔**\n\n![](img/00106.jpeg)\n\n图 8.1 评估流程。\n\n评估也存在类似的问题。在加密方面，有已知的、误解的已知（本应真实但实际上为假的事）、已知的未知，当然还有未知的未知。还有信息、错误信息（虚假或错误的信息），甚至是误导信息（故意传播的欺骗性虚假信息）。某些项目可能是对抗性的，一个或多个小组可能不想要评估，而另一些则可能欢迎这种评估。评估者必须克服所有障碍，以确定何时通过文档、访谈和测试收集了足够的信息来执行分析并编写报告。\n\
  \n### 8.1 文档](#part0003.html#Rsec8_1)\n\n文档是任何评估的基石。虽然走廊对话、电子邮件、聊天会和电话都是收集信息的接受方法，但说到底，只有官方文档是可靠的。基本上，如果没有记录，它就不存在。官方文档应使用公司抬头纸或等效信纸。企业政策、标准、实践和程序需要记录。供应商服务、产品手册、用户指南和技术规范需要记录。请参阅图\
  \ 8.1 文档输入的概述。\n\n在交换任何文档、进行任何访谈或执行任何测试之前，应召开启动会议，讨论项目范围、预期、时间表、业务部门、资源、应用程序、产品和供应商。资源包括可用和所需的文档、联系信息、受访者名单以及包括生产和测试系统在内的相关环境。\n\
  \n理想情况下，在安排任何访谈或测试之前，所有相关文档都会提供给评估者。评估者需要足够的时间审查文档以准备访谈，否则受访者提供的信息将无法证实。同样，评估者需要充足的时间来阅读文档。根据文档的量，可能需要几天或几周来处理这些材料。企业文档可能包括政策、标准、实践或程序。\n\
  \n![](img/00102.jpeg) **企业政策**通常定义高层责任（谁）和要求（什么）。责任可以由管理层定义，并识别哪些组织小组负责这些。\n\n![](img/00102.jpeg)\
  \ **企业标准**通常定义中层责任（谁）和要求（什么），特点是扩展安全政策，有时提供高层的“如何”。要求更为明确，并参考具体的法规、法律和行业标准。\n\n\
  ![](img/00102.jpeg) **企业实践**通常定义低层规范（如何）和理由（为什么），通常按安全标准组织。实践规定了产品、工具、资源和命名的程序。例如，证书政策和证书实践文件是运营证书机构的不可组成部分。理由识别了安全实践提供的相关风险和应对措施。\n\
  \n![](img/00102.jpeg) **企业程序**提供详细说明（如何），有时提供位置信息（哪里）和特定角色（谁）。程序是根据角色分配（例如安全官）在指定位置使用产品和工具执行逐步任务。执行程序通常包括签到表、清单以及各种系统和应用程序日志。\n\
  \n外部评估者可能不熟悉企业文档，因此可能需要更多时间阅读材料。然而，虽然政策可能是公开的，但详细的程序需要保护，这通常在保密协议（NDA）下进行。相反，内部评估者会熟悉大多数企业文档，员工不需要\
  \ NDA，但仍需要时间审查各种文档。相关的企业文档需要阅读或审查，但确定哪些文档是相关的可能会产生问题。启动会议有助于确定企业文档和供应商文档，后者可能包括服务或产品手册、用户指南、技术规范或白皮书。\n\
  \n![](img/00102.jpeg) **服务手册**展示了第三方提供商提供的可用应用程序的高层概述。虽然包含的技术细节较少，但重要信息包括服务名称、缩写和网址。\n\
  \n![](img/00102.jpeg) **产品手册**提供了软件制造商提供的可用应用程序的高层概述。虽然包含的技术细节较少，但重要信息包括产品名称、缩写和网址。\n\
  \n\n\n\n\n关于供应商信息的一个重要问题是准确性。通常，应用团队通过供应商名称来指代产品，而不是服务或产品名称。此外，服务和产品名称可能会因营销而改变，但团队可能仍在使用旧名称。此外，合并与收购可能会改变公司名称、结束某些产品线并启动新的产品线。这些任何一个因素都会产生困惑，安全专业人员需要进行破译。\n\
  \n![](img/00002.jpeg) `用户指南`对于如何安装、配置、注册和使用服务或产品提供了详尽的说明，但截图传达的技术细节较少。评估人员通常需要“读言外之意”来获取具体信息。例如，可能会从图形化的下拉菜单中发现完整的加密算法列表。\n\
  \n![](img/00002.jpeg) `技术规范`可以提供评估人员所需的细节，但此类文档往往是无法获取的。由于各种原因，供应商可能不会记录此类信息。服务或产品的更新频率足够快，以至于细节无法完全记录。某些供应商倾向于不记录技术细节，而是将此类知识通过口头传授。其他供应商可能由于依赖承包商、使用加密库或员工流失而丢失知识。另一些供应商则无论任何协议，都拒绝共享技术规范。\n\
  \n![](img/00002.jpeg) 供应商编写的`白皮书`可能会提供一些技术细节。并非所有供应商都会发布白皮书。更多的是关于讨论供应商服务或产品优势的营销论文。营销论文很少提供任何重大的技术信息。此外，它们倾向于误用术语或对主张进行泛化处理，因此有时跳过营销论文是明智的。\n\
  \n关于供应商文档，作为道口信收集的信息是不证实的，因此是不可靠的。从本质上说，如果没有记录，它就不存在。此外，如果信息不是来自权威来源，即使是文档也是可疑的。供应商访谈有助于证实实供应商提供的文档，但来自独立来源的供应商相关文档更为佳。例如，如第\
  \ 7 章所讨论的，许多产品根据美国国家标准与技术研究所（NIST）加密算法验证计划（CAVP）和加密模块验证计划（CMVP）进行评估。相应的安全策略列出了联邦信息处理标准（FIPS）和非\
  \ FIPS 算法及密钥长度，并已通过 NIST 认证实验室的验证，这代表了独立且权威的评估。虽然全球有多种评估计划，但它们都基于各种行业标准。行业标准的重要性至关重要。行业文档可能包括标准、规范、指南、研究论文、文章或新闻稿。\n\
  \n![](img/00002.jpeg) `行业标准`涵盖了广泛的主，包括加密算法、密钥管理方案、第 4 章和第 5 章中讨论的安全协议，并指导安全管理策略和实践。传统的标准语言使用“应\
  \ (shall)”或“必须 (must)”陈述定义要求，使用“应该 (should)”句定义建议，使用“可以 (may)”观察定义选项。标准组织在第 1 章中进行了描述。\n\
  \n![](img/00002.jpeg) `行业规范`涉及广泛的安全协议。标准关注“是什么”和“为什么”，而规范则相应关注事情“如何”实现，特别是为了互操作性。然而，规范经常使用类似的“应\
  \ (shall)”和“应该 (should)”语言。供应商和服务产品可能通过开发通常基于加密库的软件来实现行业规范，或整合现有的加密工具。然而，如第 7 章所讨论的，实现与规范之间往往存在差距。\n\
  \n![](img/00002.jpeg) `行业指南`为实施标准和规范提供了建议和信息。指南有许多其他名称，包括技术报告、补充说明、建议等。虽然指南的地位不如标准或规范，但它们可以提供有关近期漏洞或配置建议的相关信息。指导可以源自任何来源，例如标准组织、监管机构、大学以及供应商。\n\
  \n![](img/00002.jpeg) `行业研究论文`可以提供关于算法、协议、加密库或产品的常见漏洞与披露**)（CVE）细节。研究论文还可以提供关于公告的观点。有些研究论文是公开的，分发范围有限，但通常会发布需要修复的已知漏洞。遗憾的是，零日攻击非常棘手。\n\
  \n![](img/00002.jpeg) `行业文章`提供了关于数据泄露、威胁、黑客攻击和新发布的 CVE 的新闻。文章还可以提供关于产品安全、可靠性的意见。某些文章提供了其他文章、行业研究论文或网站的链接。\n\
  \n![](img/00002.jpeg) `行业新闻稿`提供了关于合并、收购、剥离、破产和其他公告的新闻。新闻稿有助于澄清供应商名称、产品名称、产品发布甚至缩写。\n\
  \n企业、供应商和行业文档可以建立评估的基础知识库。没有记录的信息从本质上说是不可靠的。召开启动会议来讨论文档和其他问题是有帮助的。评估人员在访谈或测试之前需要时间审阅文档。遗憾的是，文档往往无法获取，或者在访谈期间才提供。\n\
  \n### 8.2 访谈](#part0003.html#Rsec8_2)\n\n访谈是证实文档的关键评估机制。请参考图 8.1](#part0013.html#fig8_1)了解访谈输入的概述。访谈包括企业内部和与供应商之间的对话。企业访谈涉及业务经理、应用经理、数据库经理、管理员、工程师、开发人员以及可能的承包商。供应商访谈可能涉及客户代表、产品经理或工程师。\n\
  \n某些评估可能具有对抗性。例如，外部评估人员可能由另一个法律机构指定，以进行必要但不受欢迎的评估。另一个例子是外部或内部评估人员可能由内部权威小组（如高层或内部审计）指定。相反，更具合作性的评估是项目团队请求安全专业人员进行评估。\n\
  \n\n\n\n出现不一致或冲突的答案可能有多种原因。受访者可能在无意中提供了错误信息。或者，受访者可能故意提供虚假信息。另一种可能性是实际流程不符合记录的政策、惯例或程序。发现以下任何一种情况并不罕见：显然，第四种情况是最理想的。\n\
  \n1. 流程不一致且没有记录。\n2. 流程一致但没有记录。\n3. 流程一致且有记录，但并非总是被遵守。\n4. 流程一致、有记录且被遵守。\n\n在事先没有可用文档的情况下，可以将问题排队并提前提交给受访者，以便其准备答案。然而，如果没有可靠的信息来作为提问依据，此类询问在性质上往往是通用的。同样，供应商提供的任何答案都可能需要保护，这通常在\
  \ `NDA` 下进行。在这些访谈期间，可以提供文档。\n\n即使事先已有可用文档，访谈也可能发现某些未提供的文档。因此，如图 8.1 中的虚线所示，评估人员应该预料索要额外的文档。自然地，额外的文档可能会导致额外的访谈。文档与访谈的循环有时被认为是一个无休止的循环；然而，评估人员最终将达到收益递减点，此时无法再发现任何实质性信息。有两种基本结果：要么没有更多信息可用且情况良好，要么情况糟糕到任何进一步的访谈（或文档）都无法使情况好转。\n\
  \n在访谈期间，会记录笔记。笔记应该打字字并共享，如果有多人在记录笔记，则应对它们进行合并。任何差异都需与受访者进行协调。然而，并不总是需要后续访谈，简单或容易的问题可以通过电子邮件、电话、短信或其他方法处理。但是，所有答案都需要记录。笔记会相应更新，并带有版本号或日期以指示更改。文档与受访者之间的差异应在访谈期间解决。如果问题在访谈期间无法解决，则应将其添加到问题列表中进行协调。\n\
  \n在所有访谈期间会维护并更新一个问题列表。随着每个问题的解决，列表将更新并与笔记进行交叉引用。某些问题可能被认为无关并可以解决，而另一些问题可能被事件（OBE）所覆盖。例如，一个\
  \ OBE 可能是旧版本软件的 Bug，该 Bug 已经修复。一个无关的问题可能是一个对安全没有影响的错误流程。问题列表和笔记可能在同一份或独立的文档中管理。\n\
  \n笔记包括日期和时间、会议地点（如电话会议或面对面会议地点）、参会人员列表、访谈者、受访者、问题、答案、问题以及相关文档列表。解决方案与问题列表进行交叉引用。笔记和问题列表可能在同一份或独立的文档中管理。\n\
  \n在访谈期间，由一名访谈员主导讨论。过多的参与者试图与受访者互动会导致混乱。访谈可以由较小的访谈员小组进行，但必须由一个人主导。单个受访者为优，但通常会组建小团队来涵盖各个主题。同样，必须由一个人主导受访过程，将问题引导给合适的人。此外，访谈通常有观察者，但同样必须有一人担任首席访谈员。无论如何，过多的参与者会增加干扰，无论是背景噪音、私下对话还是中断。参与人数应保持在最低，以减少复杂性。\n\
  \n### 8.3 测试\n\n测试可以是一种重要的评估技术，用于在正常处理未触发事件时验证正常处理或安全控制。对于正常处理的示例，考虑当用户因忘记密码而需要重置密码的情况。测试可以通过用户访问密码重置页面并按照指示操作完成。通过电子邮件发送给用户的临时密码将用于登录系统。每个正常测试用例也需要良好的定义。需要建立配置参数，记录预期结果，记录实际结果，并捕获证据。例如，测试用例\
  \ #12 是测试密码重置（表 8.1）。\n\n对于事件示例，考虑当用户输入正确密码且系统允许访问的情况。或者，在正常处理过程中没有发生处理登录尝试次数和临时密码超时的程序。可以为每种异常安排测试：超过登录尝试次数，以及在临时密码后尝试使用临时密码。每个测试都将有一个可以验证的预期结果；可能会捕捉截图或安全日志。当观察到意外的测试结果时，可能是测试配置无效、测试无效、控制错误，或者有时是控制本身无效。\n\
  \n表 8.1 测试用例：密码重置\n\n| 测试用例 #12 密码重置 |\n| --- |\n| 1. 访问密码重置页面并点击密码重置链接 aa。输入用户名（Sam\
  \ Test）和电子邮件地址 (sam.test@example.com)b. 验证系统日志和时间戳 |\n| 2. 打开带有临时密码的邮件 a. 验证邮件时间戳\
  \ |\n| 3. 使用用户名（Sam Test）和临时密码登录 a. 验证系统访问和时间戳 |\n\n![](img/00002.jpeg)如果测试配置无效，则需要修订配置并重复测试。\n\
  \n![](img/00002.jpeg)如果测试无效，则需要审查控制，修订测试配置并重复测试。\n\n![](img/00002.jpeg)如果控制存在错误，则可能需要修复控制，或者需要修订文档。\n\
  \n有时，控制本身可能是无效的。应用程序或系统可能无法检测事件，或者无法防止其发生。例如，政策可能规定员工绝不写下密码。然而，没有技术控制来执行此类政策。没有任何硬件或软件控制能够可行地确定员工是否将密码写在纸上。政策可能是有效的，程序性控制可能执行政策（例如员工手册中的声明和强制性培训），但没有技术控制可以进行测试。\n\
  \n每个事件测试用例也需要良好的定义。同样，需要建立配置参数，记录预期结果，记录实际结果，并捕获证据。例如，测试用例 #13 测试登录尝试次数，测试用例 #14\
  \ 是测试临时密码超时（表 8.2 和 8.3）。\n\n\n\n\n\n系统日志和电子邮件需要作为证据捕获。可能还需要捕取截图。测试完成后，需要停用测试账户。因此，每个测试用例都将包含执行前、执行和执行后任务。随着测试用例的完成，可能会出现需要后续访谈或额外文档的问题，如图\
  \ 8.1 中的虚线所示。然而，如前所述，后续访谈并非总是需要的，简单或容易的问题可以通过电子邮件、电话、短信或其他方法处理。此外，文档与访谈的循环、访谈与测试的循环最终会导致收益递减点。但是，所有答案都需要记录在案。最终，测试用例和结果以及访谈笔记和文档被输入分析阶段。\n\
  \n## 表格 8.2 测试用例：登录尝试\n\n| *测试用例 #13 超过登录尝试次数* |\n| --- |\n| 1\\. 分配具有用户名(`Sam Test`)和密码(`Test1234`)的测试账户\
  \ |\n| 2\\. 尝试使用用户名(`Sam Test`)和密码(`Test1111`)进行首次登录 a. 警告信息：登录失败，尝试 1/3b. 验证系统日志和时间戳\
  \ |\n| 3\\. 尝试使用用户名(`Sam Test`)和密码(`Test2222`)进行第二次登录 a. 警告信息：登录失败，尝试 2/3b. 验证系统日志和时间戳\
  \ |\n| 4\\. 尝试使用用户名(`Sam Test`)和密码(`Test3333`)进行第三次登录 a. 警告信息：登录失败尝试 3/3 – 点击密码重置链接\
  \ b. 验证系统日志和时间戳 |\n\n## 表格 8.3 测试用例：临时密码\n\n| *测试用例 #14 超过临时密码超时* |\n| --- |\n|\
  \ 1\\. 点击密码重置链接 a. 输入用户名(`Sam Test`)和电子邮件地址(`sam.test@example.com`)b. 验证系统日志和时间戳\
  \ |\n| 2\\. 打开包含临时密码的电子邮件 a. 验证邮件内容显示密码将在 15 分钟后过期 b. 验证邮件时间戳 c. 等待 15 分钟 5 秒使临时密码过期\
  \ |\n| 3\\. 尝试使用用户名(`Sam Test`)和临时密码进行登录 a. 警告信息：登录失败尝试 1/1 – 点击密码重置链接 b. 验证系统日志和时间戳\
  \ |\n\n### 8.4 分析\n\n分析是评估中一个必不可少的过程，它是文档、访谈笔记和测试结果的结晶。图 8.1 显示分析在逻辑上是在文档、访谈和测试之后顺序进行的；然而，分析实际上在文档审查期间或之后开始，并持续到报告阶段。当确认了足够的信息以确定加密架构时，分析结束。\n\
  \n分析过程实际上相当简单。事实被汇编起来，并与文档、访谈和测试进行交叉引用。每个事实可能有多个引用，某些事实可能具有几个共同引用（表格 8.4）。一致之处会被记录下来，但不一致之处则需要解决。例如，如果文档提供了加密算法列表，但访谈揭示了不同的列表，且测试无法证实这些差异，则需要解决这些问题。\n\
  \n表格 8.4 提供了一个分析工作表的示例，包含四个事实陈述、评分和引用。评分从 0 到 10 分，10 分最高，0 分最差。工作表中的引用与引用列表进行交叉引用。\n\
  \n![](img/00002.jpeg)事实 #1 显示产品“X”具有 FIPS 140-2 认证，得 10 分，有四个引用：产品技术规范、NIST 证书、相应的\
  \ FIPS 140-2 安全策略以及访谈 #1 的笔记。技术规范提了 FIPS 140-2 认证，证书号是在访谈中提供的。评估人员能够查找到该证书和相应的安全策略。\n\
  \n#### 表格 8.4 分析工作表\n\n| *事实* | *评分* | *引用* |\n| --- | --- | --- |\n| 1\\. 产品 X\
  \ 有 FIPS 140-2 认证 | 10 | a. 产品技术规范<br>b. NIST 证书<br>c. FIPS 140-2 安全策略<br>d. 访谈\
  \ #1 |\n| 2\\. 产品 X 支持 AES | 10 | a. 产品技术规范<br>b. NIST 证书<br>c. 安全策略<br>d. 访谈 #2\
  \ |\n| 3\\. 产品 X 支持 2K 和 3K | 6 | a. 产品技术规范<br>b. NIST 证书<br>c. 访谈 #2 |\n| 4\\.\
  \ 产品 X 支持 DES | 2 | a. 安全策略<br>b. 访谈 #2 |\n\n\n\n\n评估人员需要识别问题何时何时变得无关紧要。如果一个或多个问题代表相同的风险，那么进一步的研究就没有意义。例如，原始的单一\
  \ `DES` 算法采用 56 位密钥，按目前的标准来说太弱了，而 1992 年之前的可导出的 `DES` 被限制为 40 位密钥。然而，某些加密模块为了后兼容，保留了\
  \ `DES`（56 位）和可导出的 `DES`（40 位）。由于对 `DES` 的任何使用都是不可接受的风险，因此关于任何比 `DES` 更弱的细节都是无关紧要，尽管这些风险是相关的，需要纳入分析并总结在报告中。\n\
  \n某些事实是正面的，而另一些是负面的。例如，通过 NIST 加密算法 (`CAVP`) 和加密模块 (`CMVP`) 验证计划的加密模块是一个正面事实。此外，安全策略中\
  \ `FIPS` 批准的算法列表是另一个正面事实。相反，非 `FIPS` 算法列表可能是负面的。如果非 `FIPS` 算法列表包含 `DES` 和可导出的 `DES`，那么这些无疑是负面事实。怀疑或未经证实的意见不是事实；它们不能被视为事实处理，且不应体现在报告中。\n\
  \n分析过程可能是艰苦的，通常使用电子表格或在线工具完成；但对于规模较小的项目，可能会使用草案报告。对于每个事实项，应分配一个数值分，并引用相关的理由。该分数使用一系列值来反映优势优于劣势（例如，使用\
  \ 1–10 的分表，10 为优，0 为差）。此外，版本控制和修订跟踪至关重要。当涉及多个评估人员时（这在大型项目中很常见），跟踪行动事项、编辑和更新至关重要。此外，不应共享评估人员未经编辑的笔记和任何中间草稿，以管理预期。\n\
  \n### 8.5 报告\n\n报告是审查文档、进行访谈、执行测试和执行分析的结晶。无论评估人员是外部还是内部人员，企业都可能为评估人员提供一个模板并坚持使用它。或者，企业可能会提供一个模板作为示例，要求评估人员进行自定义。否则，企业可能期望评估人员提供报告格式。无论如何，报告都需要反映分析阶段确定的事实（`表\
  \ 8.5`）。\n\n示例报告分为四个部分：执行摘要、报告摘要、报告详情和报告引用。其结构基于这样一个前提：优势或劣势可以被评为重大的、重要的或有意义的。评级数量多或少都是可能的，但本示例使用了三个等级。分析中使用的数值评分也可以也应该用于确定报告中的文字评级。\n\
  \n![](img/00002.jpeg)**重大优势**是指那些提供最佳安全控制的项。例如，具有较大密钥的当前算法（例如 `AES-256`）比短密钥或旧算法（例如\
  \ `3DES`）更强。\n\n![](img/00002.jpeg)**重要优势**是指那些提供更好安全控制的项。例如，具有较短密钥的当前算法（例如 `AES-128`）比旧算法（例如\
  \ `2K-DES` 或 `3K-DES`）更好。\n\n![](img/00002.jpeg)**有意义的优势**是指那些提供良好安全控制的项。例如，旧算法（例如\
  \ `3K-DES`）比已废弃的算法（例如 `DES`）可以接受。\n\n#### 表 8.5 示例安全评估报告\n\n| 产品 X 的安全评估报告 |\n|\
  \ :--- |\n| 1. 执行摘要 1.1. 重大优势 1.2. 重大劣势 1.3. 重大建议 |\n| 2. 报告摘要 2.1. 重大和重要的优势列表 2.2.\
  \ 重大和重要的劣势列表 2.3. 重大和重要的建议列表 |\n| 3. 报告详情 3.1. 带交叉引用的优势讨论 3.2. 带交叉引用的劣势讨论 3.3. 相关建议讨论\
  \ |\n| 4. 报告引用 4.1. 文档列表 4.2. 访谈列表 4.3. 测试用例列表 |\n\n![](img/00002.jpeg)**重大劣势**是指最严重的漏洞。例如，存储或传输明文敏感数据。\n\
  \n![](img/00002.jpeg)**重要劣势**是指那些较严重的漏洞。例如，使用带有已知漏洞的旧加密软件。\n\n![](img/00002.jpeg)**有意义的劣势**是指那些糟糕的漏洞。例如，使用已废弃的算法（例如\
  \ `DES`）。\n\n执行摘要包含了重大的优劣势以及任何相关的建议。执行摘要是可选的，并非总是需要，但某些企业更倾向于使用。当包含执行摘要时，通常只处理更重要的问题。然而，在不提供建议的情况下识别重大劣势是不完整的报告。劣势应该通过修复或增强来补救，或者通过通过补偿措施来解决。补偿措施是可以施应用于被评估现有产品的额外限制。例如，如果产品在端口地址上使用了脆弱的协议，且该协议无法在产品内禁用，则可能阻止该端口地址以防止访问该协议。执行摘要应包含最终的接受或拒绝状态。注意，接受可能根据建议而带有条件。\n\
  \n报告摘要包含了重大的优劣势以及重要的优势和劣势。如果不包含执行摘要，则重大优劣势将在报告摘要中详细列出；然而，如果包含了执行摘要，则报告摘要可以使用重大优劣势的简版版本，并对执行摘要进行交叉引用。无论如何，报告摘要中都包含了对重大和重要劣势的建议讨论。如果没有提供执行摘要，则报告摘要应包含最终的接受或拒绝状态。注意，接受可能根据建议而带有条件。\n\
  \n报告详情包含了优势和劣势的所有重大、重要和有意义的项。每个项目都与各种文档、访谈和测试用例进行了交叉引用。此外，报告详情针对了解决劣势的所有相关建议。被认为无关紧要且不足以评为有意义的项可以在报告中忽略。分析工作表将包含所有问题并可以随时查看。\n\
  \n报告引用列出了文档、访谈和测试用例。文档列表包括企业、供应商和行业文档。常规引用包括文档名称、作者（适用）、来源和日期。访谈列表应包括日期、参与者、关联关系（例如公司名称、职位）和主题。测试用例应包括测试用例名称、编号和日期。除了引用列表外，报告可能包含一个或多个附录以提供更多细节。补充信息可能通过单独的演示材料提供。\n\
  \n\n\n\n### 9.1 假设的移动交易\n\n[图 9.1] 显示了处理移动交易的示例架构。从左到右读取该图，移动商店 (`mStore`) 为移动设备提供配置服务。该移动设备连接到\
  \ Web 服务器并发送消息。Web 服务器连接到应用服务器并转发消息进行处理。应用服务器连接到数据库 (`DB`) 服务器以获取设备配置文件。`DB` 服务器连接到密钥管理\
  \ (`KM`) 服务器以获取数据库加密密钥。\n\n该示例移动架构中的每个实体都使用加密密钥用于多种用途，包括传输层安全 (`TLS`)、安全外壳 (`SSH`)、数据库加密\
  \ (`DBE`) 和移动安全。以下加密密钥被部署在移动环境中。\n\n![](img/00002.jpeg)`mStore` 为每个移动设备生成一对唯一的非对称密钥对。公钥封装在由外部（商业）认证机构（`CA[1]``)\
  \ 颁发的 `X.509` 数字证书中。私钥和完整的证书链被安装在移动设备上，用于 `TLS` 连接。\n\n![](img/00002.jpeg)移动设备除了其\
  \ `TLS` 私钥和证书链外，可能由于各种原因使用一个或多个唯一的对称密钥。例如，对称密钥可能用于加密非对称私钥、认证数据（如密码）或其他敏感数据（如账号）。白盒加密可能被用于混淆对称密钥；各种密钥位通过仅移动设备已的伪随机模式分散在整个移动设备中。移动应用程序可能通过重排可执行代码进行进一步混淆，使得每个移动设备具有相对唯一的软件版本，从而使逆向工程变得困难。\n\
  \n![](img/00107.jpeg)\n\n图 9.1 示例移动交易。\n\n![](img/00002.jpeg)Web 服务器了自己的 `TLS` 私钥和证书链，这些证书由不同的外部（商业）`CA[2]`\
  \ 颁发。除了 `TLS` 静态密钥外，Web 服务器可能还会使用临时密钥（ephemeral keys）。`TLS` 握手与移动设备协商会话唯一的对称加密密钥和哈希消息认证码\
  \ (`HMAC`) 密钥。成功的 `TLS` 握手要求 Web 服务器识别 `CA[1]` 证书链，且移动设备识别 `CA[2]` 证书链。Web 服务器还拥有用于密钥协商的非对称\
  \ `SSH` 密钥，用于协商会话对称加密密钥以及与管理员进行数字签名认证。\n\n![](img/00002.jpeg)应用服务器了自己的 `TLS` 私钥和证书链，这些证书由内部（私有）`CA[3]`\
  \ 颁发。除了 `TLS` 静态密钥外，应用服务器可能还会使用临时密钥。`TLS` 握手与 Web 服务器协商会话唯一的对称加密密钥和 `HMAC` 密钥。成功的\
  \ `TLS` 握手要求应用服务器识别 `CA[2]` 证书链，Web 服务器识别 `CA[3]` 证书链。应用服务器还拥有用于密钥协商的非对称 `SSH` 密钥，用于协商会话对称加密密钥以及与管理员进行数字签名认证。\n\
  \n![](img/00002.jpeg)`DB` 服务器有了自己的 `TLS` 私钥和证书链，证书由与 `KM` 服务器相同的内部（私有）`CA[4]` 颁发。除了\
  \ `TLS` 静态密钥外，`DB` 服务器还有由 `KM` 服务器管理的 `DBE` 密钥。`DB` 服务器还拥有用于密钥协商的非对称 `SSH` 密钥，用于协商会话对称加密密钥以及与管理员进行数字签名认证。\n\
  \n![](img/00002.jpeg)`KM` 服务器有了自己的 `TLS` 私钥和证书链，证书由内部（私有）`CA[4]` 颁发。除了 `TLS` 静态密钥外，`KM`\
  \ 服务器可能还会使用临时密钥。`TLS` 握手与 `DB` 服务器协商会话唯一的对称加密密钥和 `HMAC` 密钥。成功的 `TLS` 握手要求 `DB` 服务器识别\
  \ `CA[4]` 证书链，`KM` 服务器识别 `CA[4]` 证书链。`KM` 服务器还拥有用于密钥协商的非对称 `SSH` 密钥，用于协商会话对称加密密钥以及与管理员进行数字签名认证。\n\
  \n某些密钥由外部管理。例如，`mStore` 是组织的外部实体，移动设备也是如此。由 `mStore` 生成并安装到移动设备中的加密密钥在没有法律或其他合同义务的情况下，基本上超出了组织的控制范围。此外，移动设备使用的证书由\
  \ `CA[1]` 颁发，这是另一个外部实体。同样，Web 应用程序使用的证书由 `CA[2]` 颁发，是另一个外部实体。Web 应用程序使用移动设备可识别的商业发行证书；移动设备并不一定能够信任来自私有\
  \ CA（例如 `CA[3]` 或 `CA[4]`）的证书。\n\n同一组织内的不同小组可能管理不同的密钥。例如，两个内部证书机构（例如 `CA[3]` 和 `CA[4]`）可能由企业公钥基础设施\
  \ (`PKI`) 组管理。或者，这两个证书机构可能由不同的小组管理；内部 `CA[3]` 可能由企业 `PKI` 组管理，而 `CA[4]` 可能专门用于另一个小组的\
  \ `KM` 服务器。`SSH` 管理员密钥可能由另一个小组管理，例如系统管理员。`DBE` 密钥可能由数据库管理员管理。因此，组织内部可能有多个小组管理各种密钥，但希望符合企业政策和标准。\n\
  \n### 9.2 EMV 支付卡\n\nEMV® 是三个卡支付品牌的缩写：EuroPay、MasterCard 和 Visa (EMV)，涵盖了支付技术。Mastercard\
  \ 在 2002 年与 Europay 合并成为一家私有股份公司，但 EMV 的名称和 EMVCo 公司继续运营。EMV® 技术涵盖了多种支付相关方法，包括集成芯片\
  \ (`ICC`) 接触和非接触规范、其移动规范、令牌支付规范、二维码规范以及其三域 (3-D) 安全规范。\n\nEMV 智能卡 (`ICC`) 支付卡是传统磁条\
  \ (`magstripe`) 支付卡的替代方案。EMV 支付“芯片和密码”卡规范早在 1994 年就可用，但由于几个原因，全球采用缓慢。首先，缺乏智能卡基础设施；销售点\
  \ (`POS`) 终端和自动取款机 (`ATMs`) 只有磁条读取器。其次，更换传统 `POS`、`ATM` 和 `magstripe` 卡的成本是另一个必须克服的障碍。因此，发行了具有传统\
  \ `magstripe` 和 `ICC` 的混合卡。[图 9.2] 展示了由发卡行、持卡人、商户、收单行和网络组成的混合支付卡生态系统的安全性和加密技术。\n\
  \n发卡行（通常是金融机构）向持卡人发送支付卡。持卡人在商户处使用密码使用卡片。对于在线授权，商户将授权请求消息发送给收单行（商户的金融机构）。收单行将请求转发给支付网络。网络将请求路由到发卡行。发卡行检查持卡人配置文件，并向网络、收单行和商户返回授权响应消息。在线密码验证遵循以下步骤。\n\
  \n\n\n\n\n# EMV 支付验证流程\n\n1. 发行机构使用 PIN 验证密钥 (`PVK`) 创建一个 PIN，并向持卡人发送 PIN 信封。PIN\
  \ 信封包含明文 PIN，以便持卡人记忆该 PIN。\n2. 发行机构在 PIN 信封之外，将支付卡单独发送给持卡人。\n3. 持卡人在商户处使用支付卡。持卡人在终端\
  \ PIN 键盘上输入 PIN，该 PIN 会立即使用终端 PIN 加密密钥 (`TPK`) 进行加密。交易数据和加密后的 PIN 被传输到商户系统。\n  \
  \ 注意 `TPK` 会使用密钥加密密钥 (`KEK`) 定期更换。\n4. 商户在硬件安全模块 (`HSM`) 内执行 PIN 翻译，使用 `TPK` 解密\
  \ PIN，并使用商户 PIN 加密密钥 (`MPK`) 对 PIN 重新加密。将带有加密后 PIN 的授权请求消息发送给收单行。\n   ![](img/00108.jpeg)\n\
  \   图 9.2 EMV 支付卡。\n\n5. 收单行在 `HSM` 内执行另一次 PIN 翻译，使用 `MPK` 解密 PIN，并使用网络 PIN 加密密钥\
  \ (`NPK`) 对 PIN 重新加密。授权请求被转发到支付网络。\n6. 网络在 `HSM` 内执行另一次 PIN 翻译，使用 `NPK` 解密 PIN，并使用发行机构\
  \ PIN 加密密钥对进行重新加密。网络将请求路由到发行机构进行授权。\n7. 发行机构使用 `PVK` 验证 PIN，检查持卡人资料，并向网络、收单行和商户返回授权响应消息。\n\
  \n无论支付是基于磁条还是基于 EMV，在线 PIN 验证都是相同的。在线 EMV 授权按照以下步骤运行：\n\n1. 发行机构使用发行主密钥 (`IMK`)\
  \ 结合卡片的主账号标识 (`PAN`) 导出唯一的卡片主密钥 (`CMK`)，并将 `CMK` 注入卡片中。\n2. 发行机构将 EMV 卡发送给持卡人。\n\
  3. 持卡人在商户处使用卡片。\n4. EMV 卡使用 `CMK` 结合应用交易计数器导出唯一的交易会话密钥 (`TSK`)，并使用 `TSK` 生成交易数据生成授权请求密文\
  \ (`ARQC`)。交易数据和 `ARQC` 被传输到商户系统。参见图 9.3。\n5. 带有 `ARQC` 的授权请求消息发送给收单行。\n6. 带有 `ARQC`\
  \ 的授权请求被转发到支付网络。\n   ![](img/00109.jpeg)\n   图 9.3 授权请求与响应。\n7. 网络将带有 `ARQC` 的授权请求路由到发行机构进行授权。\n\
  8. 发行机构使用 `IMK` 重新导出 `CMK`，然后使用 `CMK` 导出唯一的 `TSK`，用于验证 `ARQC`。随后 `TSK` 配合 `ARQC`\
  \ 复用以生成授权响应密文 (`ARPC`)。发行机构将带有 `ARPC` 的授权响应消息返回给网络、收单行和商户。参见图 9.3。\n\n除了在线授权外，EMV\
  \ 还支持线下授权。EMV 终端执行授权：商户、收单行、网络和发行机构不会接收在线授权消息。EMV 不使用 `X.509` 证书，而是采用专有的 PKI 凭据。线下\
  \ EMV 授权按照以下步骤运行：\n\n1. 发行机构生成一对 Rivest–Shamir–Adleman (`RSA`) 密钥，获得由品牌 (`B`) CA\
  \ 签名的凭据，并将发行机构 (`I`) 凭据安装到 ICC 卡中。\n2. 发行机构使用发行私钥对静态应用数据 (`SAD`) 对象进行签名，并将签名的静态应用数据\
  \ (`SSAD`) 安装到 ICC 卡中。参见图 9.4。\n3. 发行机构生成另一对 `RSA` 密钥，创建一个由其发行机构 (`I`) 私钥签名的 ICC\
  \ 凭据，并安装到 ICC 卡中。\n4. 发行机构将 EMV 卡发送给持卡人。\n5. 持卡人在商户处使用卡片。\n6. 可选地，终端使用静态数据认证 (`SDA`)\
  \ 验证 ICC 卡。发行机构 (`I`) 凭据和 `SSAD` 从 ICC 卡发送到终端。终端使用品牌 (`B`) 凭据验证发行机构 (`I`) 凭据，然后使用发行机构\
  \ (`I`) 凭据验证 `SSAD`。参见图 9.4。\n7. 或者，终端使用动态数据认证验证 ICC 卡。终端向 ICC 卡发送一个随机值。ICC 卡使用\
  \ ICC 私钥对动态应用数据（包含终端的随机值）进行签名，并将签名的动态应用数据 (`SDAD`) 发送到终端进行验证。终端使用品牌 (`B`) 凭据验证发行机构\
  \ (`I`) 凭据，使用发行机构 (`I`) 凭据验证 ICC 凭据，并使用 ICC 凭据验证 `SDAD`。参见图 9.5。\n   ![](img/00110.jpeg)\n\
  \   图 9.4 静态数据认证。\n8. 对于线下授权，终端使用静态数据认证 (`SDA`) 验证 ICC 卡。发行机构 (`I`) 凭据和 `SSAD` 从\
  \ ICC 卡发送到终端。终端使用品牌 (`B`) 凭据验证发行机构 (`I`) 凭据，然后使用发行机构 (`I`) 凭据验证 `SSAD`。参见图 9.4。\n\
  9. 对于线下授权，终端使用动态数据认证验证 ICC 卡。终端向 ICC 卡发送一个随机值。ICC 卡使用 ICC 私钥对动态应用数据（包含终端的随机值）进行签名，并将签名的动态应用数据\
  \ (`SDAD`) 发送到终端进行验证。终端使用品牌 (`B`) 凭据验证发行机构 (`I`) 凭据，使用发行机构 (`I`) 凭据验证 ICC 凭据，并使用\
  \ ICC 凭据验证 `SDAD`。参见图 9.5。\n   ![](img/00111.jpeg)\n   图 9.5 动态数据认证。\n\n\n\n\n\n\
  ### 9.3 安全电子交易 (SET)\n\n安全电子交易 (SET) 是 MasterCard 和 Visa 之间的一项合资项目，由技术规范和一个运营组织（SETCo）组成。20\
  \ 世纪 90 年代初，万维网向任何拥有浏览器（如 `Netscape`、`Mosaic`）和网络连接的人开放了互联网。SET 的主要业务动力是欺诈商户；欺骗者伪装成合法商户收集卡信息（例如\
  \ `PAN`、有效期、`CCV2`、`PIN`），用于随后的无卡交易（CNP）交易，或为在线或线下交易制作伪卡。SET 的设计旨在保护持卡人、收单行和发行免受商户欺诈，从而减少持卡人欺诈，使合法商户、收单行和发行行受益。\n\
  \nVisa 开始与微软合作创建一种名为“安全交易技术”的中心化模型。MasterCard 与 `IBM`、`Netscape`、`GTE` 等建立了一个财团，开发了一种名为“安全电子支付协议”的分布式规范。最终，Visa\
  \ 和 MasterCard 在其金融机构成员的压力下合并了努力，并将 SET 以三本书的形式出版：(1) 业务描述 [99]，(2) 程序员指南 [100]，以及\
  \ (3) 正式协议定义 [101]。\n\n这三本书均在 `GTE`、`IBM`、`Microsoft`、`Netscape`、`RSA`、科学应用国际公司\
  \ (SAIC)、`Terisa` 和 VeriSign 的建议和协助下开发的。参与 SET 制造或部署的其他公司（按字母顺序排列）包括 `American Express`、`CertCo`、`Digital\
  \ Signature Trust`、`Fisher International`、`KMPG LLP` 和 `Nortel`。Visa 和 MasterCard\
  \ 建立了 SETCo，这是一个专门用于管理 SET 参与者及其关系的法律实体，希望其他品牌（例如 `American Express`）能够加入；然而，没有其他品牌正式成为成员。在范围内运营六年后，SET\
  \ 于 2002 年退役。请参见 图 9.6。\n\nSET 方案包含三个处理环境：持卡人、商户和网关。交易源自持卡人，发送给商户，转发到网关，并传输到遗留支付网络。SET\
  \ 基于全球 PKI，SETCo 根 CA (SET) 在未公开的地点离线运行；其技术细节是严格保密的秘密。请参见 图 9.7。\n\n每个参与品牌（例如 `Visa`、`MasterCard`）都运营一个品牌\
  \ CA (BCA)，其证书由 SETCo 根 CA 签名。每个 BCA 在全球范围内设有区域 CA，包括日本、美国、丹麦和法国，其证书由相关的 BCA 签名。每个区域\
  \ CA 向持卡人 CA (CCA)、商户 CA (MCA) 和网关 CA (GCA) 发放证书。CCA 向持卡人发放证书，MCA 向商户发放证书，GCA 向网关发放证书。因此，持卡人、商户和网关对于每个品牌（`Visa`、`MasterCard`）都拥有独立的证书链。\
  \ SET 的加密工作原理如下：\n\n1. 持卡人使用其私钥对购买数据（例如红色毛衣 XL 码、价格 30 美元、客户姓名、客户地址、收货地址）签名，并使用商户证书对签名数据进行加密。\n\
  \n![](img/00112.jpeg)\n图 9.6 SET 加。\n\n![](img/00113.jpeg)\n图 9.7 SET 认证机构。\n\n\
  2. 持卡人使用其私钥对支付数据（例如 `PAN`、有效期、`CVV2`）签名，并使用网关证书对签名数据进行加密。\n3. 持卡人将签名并加密的支付数据发送给商户。\n\
  4. 商户使用其私钥解密购买数据，并使用持卡人证书验证签名。\n5. 商户使用其私钥解密加密的购买数据，并将双重签名的加密对象发送给网关。\n6. 网关使用商户证书验证签名，使用其私钥解密支付数据，并使用持卡人证书验证签名。\n\
  7. 网关使用支付数据向遗留支付网络发送授权请求，并接收授权响应。\n8. 网关使用其私钥对授权进行签名并返回给商户。\n9. 网关将结算信息发送给支付网络进行常规结算和结算。结算流程将资金从发行行（反之向持卡人收费）转移到收单行和商户账户。\n\
  或者，对于处理自身清结算的商户，网关使用其私钥对结算信息进行签名并发送给商户。\n10. 商户使用网关证书验证授权（以及可能的结算）签名。\n\n在 SET 开发和部署期间，Netscape\
  \ 开发的另一种名为安全套接字层 (SSL) 的技术也被应用于浏览器和服务器中。正如第 5 章 所述，SSL 是 TLS 的前身。SSL 最终由于三个重大问题超越了\
  \ SET：持卡人认证、商户认证和商户结算。\n\n![](img/00002.jpeg)\n持卡人认证缺失，因为 SET 很少发放持卡人证书。持卡人的关系在于发行行；对于\
  \ MasterCard 和 Visa 而言，发行行是金融机构。然而，银行并未准备好向任何依赖方（例如商户、网关、收单行、网络）提供客户的联邦身份。\n\n![](img/00002.jpeg)\n\
  商户认证可以通过其他方法。收单行和网关与其商户签有合同；审核商户是常规业务也是尽调的一部分。欺诈商户问题似乎没有想象的那么严重。然而，黑客攻击和数据泄露显然超过了欺诈商户的威胁。\n\
  \n![](img/00002.jpeg)\n商户结算实现了，因为 SET 通常允许网关将结算信息传回大型商户。大型商户更适合部署 SET，但通常处理自己的结算。因此，大型商户从结算信息中获取支付数据。\n\
  \n当消除持卡人签名时，到商户的连接仅为加密，基本上类似于 SSL 或 TLS。当商户签名被其他业务尽调抵消时，到网关的连接仅为加密，同样类似于 SSL 或 TLS。由于网关返回的结算信息为商户提供了支付数据，这基本上与持卡人使用\
  \ SSL 或 TLS 将卡片数据加密给商户的结果相同。因此，使用复杂且昂贵的 SET 基本上被简化为安全性等同但更简单廉价的 SSL 或 TLS。\n\n###\
  \ 9.4 ATM 远程密钥加载 (RKL)\n\n\n\n\n20 世纪 80 年代的 ATM（自动取款机）仅使用对称密钥；直到 20 世纪 90 年代，非对称密钥才出现。ATM\
  \ 有两个密钥，分别称为 `A-key` 和 `B-key`。`B-key` 被称为通信密钥，用于 PIN 加密。`A-key` 被称为终端主密钥，基本上是一个用于交换\
  \ `B-keys` 的 `KEK`（密钥密钥）。然而，此后的 ATM 已根据支付卡行业安全标准委员会（`PCI SSC`）的指令，使用加密密码键盘（`EPP`）进行了升级。\n\
  \n`PCI SSC` 由美国运通、Discover Financial Services、JCB 国际、万事达（MasterCard）和 Visa 于 2006\
  \ 年创立，旨在合作开展通用安全计划。在众多安全标准和程序之一是 `EPP 安全要求`。这些要求涵盖了设备特性（包括物理安全和逻辑安全），以及制造期间以及从制造到初始密钥加载之间的设备管理。`图\
  \ 9.8` 显示了 ATM 远程密钥加载（`RKL`）过程，以及针对三种类型交易的后续 PIN 处理：本行卡（on-us）、外地卡和外地 ATM。\n\n`图\
  \ 9.8` 中讨论的 `RKL` 包括主机将初始加密密钥加载到由密钥管理服务（`KMS`）提供的空 `EPP` 中。`KMS` 为新所有者（主机）提供 `EPP`\
  \ 密钥文件（`EKF`），以便可以将密钥初始化到安装在各种 ATM 中的多个 `EPPs` 中。`RKL` 包括以下步骤：\n\n1. 主机与 `KMS` 使用多种可能的方法（包括便携式介质或电子传输）交换公密钥。或者，两个实体交换\
  \ X.509 证书。\n2. 主机与 `KMS` 交换并验证每个公密钥的哈希值，以验证公密钥的完整性。不使用证书。或者，每个实体验证另一个实体证书。\n3.\
  \ `KMS` 为每个 `EPP` 生成唯一的非对称密钥，并创建一个包含 `EPP` 序列号和非对称密钥的 `EKF`。\n4. `KMS` 使用其私钥对 `EKF`\
  \ 签名，并使用主机公钥对签名后的 `EKF` 进行加密。加密后的签名 `EKF` 传输到主机。\n5. 主机使用其私钥解密 `EKF` 并使用 `KMS` 公钥验证签名。\n\
  ```\n![](img/00114.jpeg)\n```\n图 9.8 ATM 远程密钥加载。\n6. 主机使用 `EKF` 将每个 `EPP` 唯一的密钥加载到指定的\
  \ `EPP` 中，并将激活设备安装到各种 ATM 中以启用 PIN 加密。\n\n一旦每个 ATM 都拥有了激活的 `EPP`，它就可以通过 `EPP` 非对称密钥远程加载\
  \ `A-key`，然后使用 `A-key` 远程加载 `B-key`。随后 ATM 即可接受并加密持卡者的 PIN。对于运营 ATM 的发行机构来说，有三种不同类型的交易：本行卡交易、外地卡交易和外地\
  \ ATM 交易。`图 9.8` 显示了持卡人在发行机构（A）的 ATM 上使用卡片（A）时的本行卡交易。\n\n1. 主机生成一个对称 `A-key`，使用\
  \ `EPP` 公钥对其加密，并将加密后的 `A-key` 远程加载到 `EPP` 中。`EPP` 解密并安装 `A-key` 终端主密钥。\n2. 主机生成一个对称\
  \ `B-key`，使用 `A-key` 对其加密，并将加密后的 `B-key` 远程加载到 `EPP` 中。`EPP` 解密并安装 `B-key` 通信密钥。\n\
  3. 持卡者将卡片（A）插入 ATM 1 并输入 PIN。\n4. ATM 使用其 PIN 加密密钥（`PEK`）加密 PIN，并将 `PAN` 和其他交易数据发送到主机系统（发行机构\
  \ A）。\n5. 主机系统识别 `PAN`，解密 PIN 进行验证，并授权持卡者完成 ATM 交易。\n\n`图 9.8` 还描述了持卡人在发行机构（A）的\
  \ ATM 上使用卡片（B）的外地卡交易。该交易需要由相应的发行机构（B）授权。\n\n1. 持卡者将卡片（B）插入 ATM 2 并输入 PIN。\n2. ATM\
  \ 使用其 `PEK` 加密 PIN，并将 `PAN` 和其他交易数据发送到主机系统（发行机构 A）。\n3. 主机系统不识别 `PAN`，因此 PIN 从 ATM\
  \ 密钥转换为网络密钥，并向网络发送授权请求。\n4. 网络将 PIN 从与发行机构 A 共享的密钥转换为与发行机构 B 共享的密钥，并将请求路由到发行机构 B。\n\
  5. 发行机构 B 解密 PIN 进行验证，授权持卡者交易并返回授权响应。\n6. 网络将响应返回给发行机构 A 以完成 ATM 交易。\n\n`图 9.8`\
  \ 进一步显示了持卡人在发行机构（B）的 ATM 上使用卡片（A）的外地 ATM 交易。该交易需要由相应的发行机构（A）授权。\n\n1. 持卡者将卡片（A）插入\
  \ ATM X 并输入 PIN。\n2. ATM 使用其 `PEK` 加密 PIN，并将 `PAN` 和其他交易数据发送到主机系统（发行机构 B）。\n3. 主机系统（B）不识别\
  \ `PAN`，因此 PIN 从 ATM 密钥转换为网络密钥，并向网络发送授权请求。\n4. 网络将 PIN 从与发行机构 B 共享的密钥转换为与发行机构 A\
  \ 共享的密钥，并将请求路由到发行机构 A。\n5. 发行机构 A 解密 PIN 进行验证，授权持卡者交易并返回授权响应。\n6. 网络将响应返回给发行机构 B\
  \ 以完成 ATM 交易。\n\n本节讨论的交易用于在线 PIN 验证以及密钥加载到 `EPP` 的过程。一旦非对称密钥加载到 `EPP` 中，`A-key`\
  \ 和 `B-key` 就可以远程加载到 `EPP` 中。可以使用 `A-key` 根据需要频繁交换新的 `B-keys`。同样，可以使用 `EPP` 非对称密钥根据需要交换新的\
  \ `A-keys`。非对称密钥在 `EPP` 的整个生命周期内保持静态。\n\n### 9.5 数据库加密 (DBE)\n\nDBE 已成为一种数据保护机制，用于防止信息未经授权的泄露。被盗的介质仅包含加密数据，如果没有数据密钥（`DEK`）则无法解密。对存储介质的未经授权访问会导致下载加密数据，而这些数据再次无法在没有密钥的情况下解密。因此，DBE\
  \ 是保护网络、服务器、数据库的深度防御方法的一种层次。然而，`DEK` 可以使用软件和硬件加密的多种方法进行。`图 9.9` 展示了一个使用加密的数据库服务器、由\
  \ `KMS` 管理的数据库密钥以及使用 `HSM` 的 KMS 服务器。\n\n此外，如 `图 9.9` 所示，加密可以应用于多个级别：磁盘加密、数据库加密、表加密或列加密。\n\
  \n\n\n\n![](img/00002.jpeg) `表加密` 使用 `DEK` 对 `DB` 中的特定表进行加密，无论其列结构如何。该表最初被加密，根据需要会在内存中对部分区域进行解密，并根据需要重新加密到磁盘。这保护了表免受未经授权的访问。经过身份验证的访问会自动将表区域解密到内存中。\n\
  \n![](img/00002.jpeg) `列加密` 使用 `DEK` 对 `DB` 表中的特定列进行加密。该列最初被加密，根据需要会在内存中对部分区域进行解密，并根据需要重新加密到磁盘。这保护了列免受未经授权的访问。经过身份验证的访问会自动将列区域解密到内存中。\n\
  \n无论使用何种 `DBE` 方法，`DEK` 通常位于服务器的内存中。`DEK` 通常使用主密钥加密后存储在服务器上，这样 `DEK` 就可以被解密以便在内存中使用。然而，主密钥并不存储在\
  \ `DB` 服务器上；相反，主密钥是从 `KMS` 或可能的 `HSM` 提供给 `DB` 服务器的。传输主密钥到 `DB` 服务器的方法在不同的 `DB`\
  \ 供应商和第三方 `DBE` 供应商之间存在差异。许多此类密钥传输方法在第 3 章 中讨论过。\n\n![](img/00002.jpeg) `伪密钥 (Faux\
  \ key)` 将数据对象误用密码密钥。`DEK` 使用伪密钥加密。伪密钥使用仅存在于 `HSM` 中的主密钥加密。加密后的伪密钥和加密后的 `DEK` 存储在\
  \ `DB` 服务器上。\n\n在启动时，`DB` 通过 `TLS` 连接将加密的伪密钥发送给 `KMS`，`KMS` 通过另一条 `TLS` 连接将其发送给\
  \ `HSM`。`HSM` 使用主密钥解密伪密钥，而没有意识到数据对象被误用作伪密钥。`HSM` 将明文伪密钥返回给 `KMS`，`KMS` 将其返回给 `DB`\
  \ 服务器。`DB` 服务器在内存中使用伪密钥解密 `DEK`。\n\n![](img/00002.jpeg) `公钥密码标准 (PKCS)令牌` 使用基于密码的密钥派生函数来导出\
  \ `KEK`，该密钥用于加密主密钥。主密钥用于加密 `DEK`。主密钥存在于 `HSM` 中，加密后的 `DEK` 存储在 `DB` 服务器上。\n\n在启动时，`DB`\
  \ 向 `KMS` 发送请求，`KMS` 通过 `TLS` 连接将请求发送给 `HSM`。`HSM` 使用主密钥解密密文伪密钥。`HSM` 将明文伪密钥返回给\
  \ `KMS`，`KMS` 将其返回给 `DB` 服务器。`DB` 服务器在内存中使用伪密钥解密 `DEK`。\n\n![](img/00002.jpeg) `公钥密码标准\
