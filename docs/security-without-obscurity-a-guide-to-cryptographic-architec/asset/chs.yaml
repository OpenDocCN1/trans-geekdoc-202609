  \ 或 `1.3.133.16.840.9.73.0.1.1`\n\n每个 X9 标准都根据 ASC X9 弧 `1.3.133.16.840.9` 拥有自己的弧，使用其分配的数字作为下一个值，随后是其自己的\
  \ OID 结构。\n\n有几个在线 OID 注册表，但没有一个能包含所有注册的 OID，或者说没有中央仓库。此外，许多标准或规范并不使用 OID，而是使用私有编号系统或其他标识方案。在互联网上可以找到一些\
  \ OID 注册表：\n\n- [Alvestrand](https://alvestrand.no/objectid/) Alvestrand OID 注册表\n\
  - [GnuPG](https://gnupg.org/oids.html) GnuPG OID 注册表\n- [Info](https://oid-info.com/)\
  \ Info OID 注册表\n\n### ASN.1 模块\n\n本附录提供了一个抽象语法一 (ASN.1) 模块，用于定义第 6 章](#part001)\
  \ 中讨论的加密架构。此 ASN.1 模块适用于编程语言代码生成。此处提供的抽象模式可能填充数据库或创建加密模块的可视化解释。\n\n```\nCryptographicModule\
  \ ::= SEQUENCE {\n   version          INTEGER,\n   productInfo      ProductData,\n\
  \   cryptoInfo       CryptoData,\n\n   productCategory  ProductType,\n   hostInfo\
  \         HostData,\n   protocolInfo     ProtocolData\n}\n\nProductData ::= SEQUENCE\
  \ SIZE(1..MAX) OF ProductName\n\nProductName ::= SEQUENCE {\n   manufacturer  AnyLanguage,\n\
  \   make          AnyLanguage OPTIONAL,\n   model         AnyLanguage OPTIONAL,\n\
  \   number        AnyLanguage OPTIONAL,\n   nickname      AnyLanguage OPTIONAL\n\
  }\n\nAnyLanguage ::= UTF8String (SIZE(1..MAX))\n\nCryptoData ::= SEQUENCE SIZE(1..MAX)\
  \ OF CryptoName\n\nCryptoName ::= SEQUENCE {\n   algorithmID    AlgorithmIdentifier,\n\
  \   keySizeBits    INTEGER  OPTIONAL,\n   hashSizeBits   INTEGER  OPTIONAL,\n  \
  \ keyUse         KeyUsage,\n   keyLifecycle   CryptoDates\n}\nKeyUsage ::= SEQUENCE\
  \ SIZE(1..MAX) OF OBJECT IDENTIFIER\n\nCryptoDates ::= SEQUENCE {\n   generationDate\
  \  Time,\n   useDate         Time  OPTIONAL,\n   endDate         Time  OPTIONAL,\n\
  \   terminationDate  Time,\n   archiveDate     Time  OPTIONAL\n}\nTime ::= GeneralizedTime\n\
  \nProductType ::= SEQUENCE {\n   hardware  BOOLEAN,\n   firmware  BOOLEAN,\n   software\
  \   BOOLEAN,\n   compiled   BOOLEAN,\n   embedded  BOOLEAN,\n   bundled   BOOLEAN\n\
  }\n\nHostData ::= SEQUENCE SIZE(1..MAX) OF ProductName\n\nProtocolData ::= SEQUENCE\
  \ SIZE(1..MAX) OF ProtocolName\n\nProtocolName ::= SEQUENCE {\n   protocolName \
  \ AnyLanguage,\n   nickname      AnyLanguage OPTIONAL,\n   protocolID    INTEGER,\n\
  \   parameters    INTEGER\n}\n```\n\n### 鸣谢\n\n特别感谢 Phil Griffin 审查、更新和验证 ASN.1\
