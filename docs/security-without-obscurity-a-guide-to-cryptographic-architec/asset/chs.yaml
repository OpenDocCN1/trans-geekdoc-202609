  \ 160 多个国家的 423,000 多名成员。与本书相关的是安全与隐私技术委员会。\n\n# 认证标准委员会 X9 (ASC X9) ^\\¶ 是经 `ANSI`\
  \ 认证的 `SDO`、`ISO TC68` 的 `TAG` 以及 `TC68` 秘书处，拥有 112 个参与成员组织。`X9` 有五个活跃子委员会，并管理与\
  \ `TC68` 子委员会的若干 `TAG` 关系。与本书相关的是 `X9F` 信息安全子委员会及其三个活跃工作组：`X9F1` 密码学工具、`X9F4` 密码协议与应用安全以及\
  \ `X9F6` 持卡人认证与集成电路芯片 (`ICC`)。\n\n# 结构化信息标准促进组织 (OASIS) ^\\*\n`OASIS` 是经 `ANSI`\
  \ 认证的 `SDO`。`OASIS` 在 1993 年到 1998 年间名为 `XML`。与本书相关的是 `XML`、`PKCS` 和安全标记语言 (`SAML`)。\n\
  \n# 互联网工程任务组 (IETF) ^\\†\n`IETF` 是经 `ANSI` 认证的 `SDO`。`IETF` 免费提供其许多标准。^\\‡\n\n#\
  \ 美国注册会计师协会 (AICPA) ^\\§\n`AICPA` 是经 `ANSI` 认证的 `SDO`。`AICPA` 免费提供了其许多标准。\n\n\n\n\
