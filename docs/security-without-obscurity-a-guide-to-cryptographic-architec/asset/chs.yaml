  \ *ISSA Journal*，2006\n\nJeff 了多项标准的制定，并是许多会议的受认可演讲者。他曾在德克萨斯大学圣安东尼奥分校和圣路易斯大学任教。\n\
  \n# 引言\n\n密码学无处不在。虽然它通常被认为是复杂的数学，但它实际上被应用于许多日常场景，以保护数据和通信。在书中，我们将探索密码学的基本概念以及它们在现实世界中的应用。\n\
  \n## 基本概念\n\n要理解密码学，首先必须理解它的基本原理。本章涵盖了加密、认证、完整性、不可否认性和令牌化等关键功能。我们还将深入探讨密码学的数学基础，但侧重于实际应用。\n\
  \n## 加密架构\n\n设计加密架构是一项复杂的任务。本章将详细介绍各种加密系统的实现和维护。我们还将讨论与加密系统相关的挑战和风险，以及如何缓解这些风险。\n\
  \n\n\n\n# 第 6 章：比较各种架构之间的共同点和差异，并介绍了加密架构。之前章节提供的基础信息被整合到加密架构中。加密架构所需的信息及其特性和属性将得到探讨。\n\
  \n# 第 7 章：风险管理讨论了数据生命周期和密钥周期，以及加密硬件与加密软件之间的差异。相关风险得到了检查和分析。\n\n# 第 8 章：安全评估提供了如何对信息安全策略、标准和实践进行评估的指南。当评估者对通用加密和相关的密钥管理有深入理解时，可以更好地识别和管理风险。信息可能来自内部、外部或公开来源。本章还探讨了分析和报告。\n\
  \n# 第 9 章：插图通过考虑若干假设场景汇总了之前章节的内容。这些案例研究旨在演示之前章节介绍的内容。\n\n## 1.2 本书的适用性\n\n本书适用于系统架构师、经理、管理员、安全专家、审计师甚至律师。这些角色从支持人员到高层管理，包括首席信息官（CIO）、首席技术官（CTO）和首席安全官（CISO）。每个人都能从各个方面受益，涉及通用教育以及加密和密钥管理问题。\n\
  \n**系统架构师**负责通用研究、跟进技术、并协助他人（技术经理、审计师和安全专家）做出改进系统和运营的良好决策。\n\n**技术经理**负责决策管理员和安全专家等人员。对他们团队支持的技术越了解，他们就越能管理员工并做出卓越决策。\n\
  \n**管理员**负责安装、配置、运行、监控以及最终网络、系统和应用组件，包括硬件设备、固件模块和软件元素。管理员需要加密的基础知识来正确管理加密特性、功能和加密密钥。\n\
  \n**安全专家**负责支持运营团队、协助开发团队以及管理信息安全策略、标准和实践。但安全专家通常被认为拥有许多领域的通用知识，因此参考材料始终是宝贵的资源。\n\
  \n**审计师**负责验证对信息安全策略、标准和实践的合规性。当评估者对通用加密和相关的密钥管理有充分理解时，风险可以被更好地识别和管理。此外，合规不仅包括组织的内部安全需求，还包括法规、国际和法律以及合同责任等外部影响。\n\
  \n**公司律师**负责组织内部的法律实践和解释。因此，加密的基础知识可以增强他们对技术主张、运营风险甚至隐私问题提供建议的能力。\n\n显然，其他人也可以从本书受益。加密架构提供了一种方法，在应用程序和网络部署的范围内记录密钥在何时、在何地、为什么以及如何部署和管理。否则，这些细节通常会被忽略或未记录，而信息即使已知也往往会丢失。确定加密架构的和方法将在贯书中进行探讨。\n\
  \n## 1.3 网络示意图\n\n当给出一个应用程序解决方案时，业务经理或开发团队通常会提供一份高层设计文档；参见图 1.1。从左到右看图，客户通过互联网访问网站服务器，网站服务器从应用程序服务器获取服务，而应用程序服务器从数据库（DB）服务器获取数据。\n\
  \n从右到左查看同一张图，管理员登录到管理服务器（AS）来管理各种服务器，包括软件服务器（SS），由 SS 向其他各种服务器推送更新。更新可能包括系统软件、应用程序软件和配置数据。信息安全专家对数据流、数据存储、保护方法、身份验证、授权和日志有很多问题。基本问题是，这样的高层图基本上是一张“示意图”，传递的重要安全信息很少。\n\
  \n当被要求更多信息安全细节时，应用程序经理或开发者可能会提供另一份高层设计文档；参见图 1.2。从左到右遵循图形，客户访问位于去军事化区（DMZ）的网站服务器，网站服务器连接到位于内部网络的应用程序服务器（AS），AS\
  \ 从数据库服务器获取数据。此图的新点在于，网站服务器位于至少一个外部防火墙之后的 DMZ 中，并与位于内部网络的 AS 通信，这通常被一个或多个内部防火墙隔离。防火墙规则是一个新元素。\n\
  \n![](img/00003.jpeg)\n\n图 1.1 应用程序架构。\n\n![](img/00004.jpeg)\n\n图 1.2 访问架构。\n\n\
  从右到左追踪图形，管理员登录到 AS 来管理各种服务器，包括 SS，由 SS 向其他各种服务器推送更新。此图的新点在于，管理员对 AS 有网络访问，并通过远程访问服务器（RAS）进行远程访问。此外，位于内部网络的\
  \ AS 和 SS 都跨越内部防火墙与位于 DMZ 的网站服务器通信。\n\n当被要求提供更多信息安全细节时，网络团队可能会提供另一个高层图以包含一些网络信息；参见图\
  \ 1.3。从左到右看图，客户访问网站服务器，管理员连接到 RAS。这两台服务器都位于 DMZ 中，DMZ 被一对防火墙夹在互联网和内部网络之间。外部路由器（R）允许访问\
  \ DMZ，DMZ 内部的另一个路由器允许访问内部网络，而第三个路由器则管理内部网络。\n\n\n\n\n\nWeb 服务器通过实线所示的应用虚拟局域网（`VLAN`）与\
  \ `AS` 通信，`AS` 连接到 `DB server`。相反，`RAS` 通过虚线表示的独立管理 `VLAN` 与 `AS` 通信，`AS` 连接到 `SS`\
  \ 和服务器。此图的新之处在于 DMZ 和内部网络的网络拓扑结构，它展示了各种路由器、防火墙以及将应用程序与管理分离的两个 `VLAN`。然而，该图暗示了一个单一的网络实例，所有的路由器、防火墙和服务器都混合在同一物理位置，没有任何冗余、负载均衡或备份能力。因此，该网络架构又是另一个“卡通画”，提供了更多信息，但引发了更多问题。再次，信息安全专业人员需要进一步的澄清。\n\
  \n![](img/00005.jpeg)\n\n图 1.3 网络架构。\n\n在进一步访谈时，系统架构师透露了实际设计；参见图 1.4。网络架构在两个区域数据中心（西部和东部）复制的。两个外部路由器交叉连接，使得连接到西部外部路由器的连接可能会重定向到东部外部路由器，反然，连接到东部外部路由器的连接可能会重定向到西部外部路由器。这种交叉连接允许数据中心相互备份。无论选择哪个外部路径，外部防火墙会对连接进行检查。\n\
  \n另一个发现是业务门户（`BP`）服务器的存在，它支持应用程序直接连接。与仅提供用户访问的 Web 服务器相比，`BP` 服务器为高流量提供企业对企业的连接。与\
  \ Web 服务器类似，`BP` 服务器通过应用 `VLAN` 与 `AS` 通信，`AS` 连接到 `DB server`。此外，`SS` 和 `AS` 通过管理\
  \ `VLAN` 访问 `BP` 服务器。正如增强项目中常见的情况，对更新 Web 和 `ASs` 的关注忽略了 `BP` 服务器，因为在本例中，没有计划更改。\n\
  \n另一个区别是西部区域和东部区域内部网络路由器之间的交叉连接。这种连接允许区域服务器之间进行数据同步：`ASs`、`DB servers`、`SSs` 和 (`ASs`)。内部网络路由器的连接还允许系统、`DB`\
  \ 和应用程序管理员管理从一个区域推送到另一个区域的维护更改和修改。\n\n![](img/00006.jpeg)\n\n图 1.4 企业架构。\n\n本章讨论的示例提供了一个信息安全专业人员参与增强项目时的典型发现过程。信息不完整通常是常态，因为各个项目团队在信息安全问题和解决方案方面的经验有限。然而，维护网络拓扑图的重要性不应被忽视或低估。作为一个行业示例，考虑支付卡行业数据安全标准\
  \ `[24]` 的要求，它提到了当前的（准确的）网络图。\n\n![](img/00002.jpeg)1.1.2 现有网络图，识别了持卡人数据环境与其他网络之间的所有连接，包括任何无线网络。\n\
  \n![](img/00002.jpeg)1.1.3 显示所有持卡人数据流跨越系统和网络的当前图表。\n\n此外，作为另一个行业示例，X9-TR-39 PIN\
  \ 安全与密钥管理 `[28]` 在其合规控制目标中包含了记录的程序（包括网络图）。\n\n![](img/00002.jpeg)4.1.1 PIN 和密钥的安全环境\n\
  \n该安全环境在物理、逻辑和程序上受到访问控制或其他机制的保护，防止任何渗透，渗透会导致存储在环境内的任何或部分加密密钥和/或 PIN 的泄露。存在并遵循记录的程序，确保安全环境在所有密钥材料移除或销毁之前保持安全。\n\
  \n参考文献 X9.8-1—Section 6.3.3 `[29]`；X9.24-1—Sections 7.3 和 7.5.2 `[30]`；X9.24-2—Section\
  \ 7.3 `[31]`。\n\n因此，行业标准同样重要。然而，技术和安全标准充满了缩写、命名法和术语。因此，读者将获得加密词汇表和行业标准的概述。\n\n###\
  \ 1.4 加密词汇表 (#part0003.html#Rsec1_4)\n\n在前节中提到，少量的数学是不可避免的，但已降至最低。本节提供了简单的数学复习、常用符号和贯书中使用的惯用加密术语。信息按难度从小到大的顺序排列。\n\
