  \ 分配给 `ISO`、`IEC` 或 `ITU` 委员会。`ANSI` 目前已认证了 282 个 `SDO`，并分配了 584 个 `TAG` 到不同的 `ISO`\
  \ `TCs` 和子委员会。与本书相关的 `SDOs` 涉及：`美国标准与技术研究院` (`NIST`)、`信息技术标准国际委员会` (`INCITS`)、`认证标准委员会\
  \ X9` (`ASC X9`)、`结构化信息标准促进组织` (`OASIS`) 以及 `电气电子工程师学会` (`IEEE`)。\n\n# 美国标准与技术研究院\
