  \ Cobb, *ISSA Journal*，2011 年 7 月\n\n![Images](img/00002.jpeg)令牌化与其他持卡人安全的其他方法，Ralph\
  \ Poore, Jeff Stapleton *(ISC)² 信息安全期刊，2010\n\n![Images](img/00002.jpeg)PAN 加密：下一个演进步骤吗？Jeff\
