  \n[²]: [`philzimmermann.com/EN/background/index.html`](http://philzimmermann.com/EN/background/index.html)\n\
  \n# 第 6 章\n\n## 架构\n\n架构定义了构成完整系统的各种组件以及这些组件之间的交互。然而，架构可以具有不同视角的多个重点。本章将考虑应用架构、网络架构、信息架构以及密码架构之间的相似与差异。\n\
  \n### 6.1 应用架构\n\n应用架构为业务逻辑的实现提供了图形化描述，可以使用多种方法进行描述。正如 `Chapter 1` 中讨论，图表可能是简单的卡通画。但希望安全专业人员能够获得包含更多信息的架构图。`Figure\
  \ 6.1` 继续了第一章中引入的网络场景。某机构为个人提供 Web 服务，并为外部业务应用（BAs）提供业务门户（BP）。后端应用程序（`App`）和数据库（`DB`）服务器位于网络非军事化区（DMZ）的\
  \ Web 服务器和 BP 服务器。\n\n`Figure 6.1` 提供了应用流程视图。请求由 Web 服务器或 BP 服务器接收，并在通过身份验证后，传递给\
  \ `App` 服务器进行处理。`App` 服务器从 `DB` 服务器获取用户配置。某些请求处理过程将更新 `DB`。响应从 `App` 服务器返回到网络请求源（即\
  \ Web 服务器或 BP 服务器），然后返回到原始请求源（即外部 `BA` 或个人浏览器）。从安全的角度来看，`Figure 6.1` 包含了：\n\n```\n\
  Figure 6.1\n```\n\n```\nFigure 6.2\n```\n\n```\nFigure 6.3\n```\n\n\n\n\n\n应用流程、时序图和流程图的替代方案是图\
  \ 6.5 中所示的状态转换图。尽管存在各种服务器，系统一直处于空闲状态，直到有请求将其更改为验证状态。错误会将系统带回空闲状态以等待下一个请求。否则，获取（fetch）操作将系统切换到数据状态，以获取个人的个人资料记录。成功的获取将系统切换到处理状态。成功的响应将系统从处理状态或数据状态返回到空闲状态，或者可能由于错误会将系统从数据状态或处理状态返回空闲状态。状态转换图并没有广泛使用，但它们可以识别出其他应用程序图可能无意忽略的处理条件。此外，它们通常不用于确定信息安全（IS）控制。\n\
  \n记录应用程序处理的另一种方法是 RACI 矩阵。RACI 代表负责（Responsible）、应责（Accountable）、咨询（Consulted）和被知会（Informed）。RACI\
  \ 的目的是描述各种流程角色。角色可以是软件组件或硬件组件、手动流程、小组，甚至是个人。对于在表 6.1 中所示的场景，角色是个人以及各种服务器：`BA server`、`BP\
  \ server`、`Web server`、`App server` 和 `DB server`。这些角色映射到消息上：请求、响应和错误。\n\n![](img/00070.jpeg)\n\
  图 6.4 流程图。\n\n![](img/00071.jpeg)\n图 6.5 应用状态转换图。\n\n![](img/00002.jpeg)请求消息：个人负责发起请求；`BA`、`BP`\
  \ 和 `Web servers` 负责责处理请求；`App server` 负责处理请求；当需要更新时 `DB server` 被知会。\n\n![](img/00002.jpeg)响应消息：个人负责接受响应；`BA`、`BP`\
  \ 和 `Web servers` 负责责处理响应；`App server` 负责处理响应；当需要更新时 `DB server` 被知会。\n\n![](img/00002.jpeg)错误消息：发生错误时咨询个人；`BA`、`BP`、`Web`\
  \ 和 `App servers` 负责返回错误消息；当需要更新时 `DB` 被知会。\n\n除非刻意向矩阵中添加流程，否则 RACI 通常不传达 IS 控制。然而，RACI\
  \ 通常由其他应用程序计划构建，因此除非其他图表已纳入安全控制，否则不太会有任何控制被纳入 RACI 图表中。此外，使用基于应用程序的 RACI 来处理加密或密钥管理控制并不常见。但是，RACI\
  \ 已被用于记录有关加密密钥生命期的责任。参见第 3 章关于对称、非对称和证书的概述，以及第 7 章关于密钥管理生命期的讨论。\n\n表 6.1 应用 RACI\
  \ 图\n\n![images](img/00072.jpeg)\n\n认识到应用程序并非在真空中运行是重要的。软件运行在硬件上，硬件部署在数据中心，而数据中心连接到网络，网络反过来又依赖于运行其他软件或固件的其他硬件。因此，除了查看应用程序架构外，考虑网络架构同样重要。\n\
  \n### 6.2 网络架构\n\n网络架构传递了设备、位置和连接信息。设备包括主机、各种服务器和各种网络设备。服务器范围从专用的 `web servers`、`App\
  \ servers`、`DB servers`、`file servers` 以及运行虚拟化程序的 `virtual servers`（虚拟化程序在逻辑上将硬件服务器“切割”成多个实例）。网络设备包括\
  \ `routers`、`firewalls`（`FWs`）、负载均衡器、交换机、集线器和其他设备。其他设备具有特定功能性，例如 `DBs`、日志管理系统、流量监控系统，甚至甚至是加密硬件安全模块（`HSMs`）。后述这些设备有时被视为服务器，而有时被视为网络设备；这通常取决于网络工程师的文化和经验。参见图\
  \ 6.6 查看书中贯穿使用的场景的网络图，该图被划分为若干区域：外部互联网、DMZ 和内部网络。\n\n图 6.6 显示了 DMZ 中常见的服务器：`web\
  \ servers`、`BP servers` 和远程访问服务器（`RASs`）。该图还显示了网络区域中的其他服务器：`App servers`、`DB servers`、`software\
  \ server`（`SS`）和管理服务器（`ASs`）。除了服务器外，网络图还显示了位于互联网区域、DMZ 和网络区域的 `routers`（`R`）。`FWs`\
  \ 将 DMZ 与互联网以及网络区域隔离开。所有网络流量都通过 `FWs`，由 `FW rules` 控制允许的端口和协议。\n\n![](img/00073.jpeg)\n\
  图 6.6 网络图。\n\n未显示或未涉及的是多个 `FWs`、Web 应用防火墙（`WAFs`）、应用程序防火墙（`AFs`）或虚拟化。多个 `FWs` 通常用于防止黑客利用零日攻击、自动脚本攻击或由于滞后的安全配置。例如，互联网和\
  \ DMZ 之间的 `FW` 可能是两个不同的系统，在两个 `FW` 上出现相同漏洞的概率很低。旨在攻击一个系统的自动脚本对另一个系统的成功率较低。此外，对一个系统的延迟补丁对另一个系统的影响微乎其微。\n\
  \n`WAFs` 和 `AFs` 检查端口和协议 `FW rules` 的网络流量。`WAF` 或 `AF` 可能运行在传统的 `FWs`、专用服务器或功能性服务器（例如\
  \ Web、BP）上。虽然 `WAFs` 和 `AFs` 是有效的 IS 控制，但它们通常不包含加密；因此在书中不再进一步讨论。\n\n虚拟化指的是运行虚拟化程序的硬件服务器，以便在相同硬件上的应用程序实例之间共享资源。某些虚拟化服务器可以在硬件平台之间共享资源。虚拟化技术不实现也不依赖加密，而是运行虚拟环境中的应用程序可能会使用加密；因此书中不再进一步讨论虚拟化。\n\
  \n图 6.6 还显示了各种通信通道和虚拟局域网（`VLAN`）连接。来自互联网的入流量由外部路由器指向 DMZ 内的外部 `FW`。外部 `FW` 过滤消息，DMZ\
  \ 路由器将请求通过应用 `VLAN` 指向 `web servers` 或 `BP servers`，这通常被称为“应用轨道”（application rail），以统指其他类似的\
  \ VLAN。一旦请求被任一服务器识别，DMZ 路由器会将请求重定向到内部 `FW`。内部 `FW` 也过滤消息，网络路由器通过“应用轨道”将请求发送到 `App\
  \ server` 进行处理。此外，`App server` 通过同一应用轨道与 `DB server` 接口。\n\n\n\n\n\n![](img/00002.jpeg)对\
  \ Web 服务器的 HTTPS 访问尚未记录，且未指定 `TLS` 隧道端点。该隧道可能终止于 `DMZ` 中的外部 `FW`、`DMZ` 中的路由器或 `DMZ`\
  \ 中的 Web 服务器。\n\n![](img/00002.jpeg)对 `BP` 服务器的 `TLS` 访问尚未记录，且未指定 `TLS` 隧道端点。该隧道可能终止于\
  \ `DMZ` 中的外部 `FW`、`DMZ` 中的路由器或 `DMZ` 中的 Web 服务器。\n\n![](img/00002.jpeg)通过应用总线从 Web\
  \ 服务器到 `App` 服务器的 `TLS` 连接尚未记录，且未指定 `TLS` 隧道端点。该隧道可能始于 Web 服务器或内部 `FW`，并终止于 `App`\
  \ 服务器或某些中间网络设备（如负载均衡器）。\n\n![](img/00002.jpeg)通过应用总线从 `BP` 服务器到 `App` 服务器的 `TLS`\
  \ 连接尚未记录，且未指定 `TLS` 隧道端点。该隧道可能始于 Web 服务器或内部 `FW`，并终止于 `App` 服务器或某些中间网络设备（如负载均衡器）。\n\
  \n除了处理请求和响应消息外，图 6.6 还描绘了 `DMZ` 和网络区域内的“管理链路”。管理员使用 `AS` 管理 `SS` 以向其他服务器推送软件补丁。管理员还使用\
  \ `AS` 配置其他服务器。管理员在连接到网络区域时可以内部访问 `AS`，或通过 `RAS` 从外部访问。\n\n管理员通过互联网路由器、通过外部 `FW`\
  \ 以及通过 `DMZ` 路由器连接到 `RAS`。在通过身份验证和授权后，管理员通过 `DMZ` 路由器、通过内部 `FW` 并通过网络路由器连接到 `AS`。无论管理员是从外部还是内部连接，`AS`\
  \ 都会对管理员进行身份验证和授权。访问网络区域内的服务器（`App`、`DB`、`SS`）通过网络路由器。连接到 `DMZ` 内的服务器（`Web`、`DP`、`RAS`）通过网络路由器、通过内部\
  \ `FW` 并通过 `DMZ` 路由器。该网络图仅提供了单个数据中心的连接信息，并且未涉及管理链路的安全控制。\n\n![](img/00002.jpeg)对\
  \ `RAS` 的虚拟专用网络（`VPN`）访问尚未记录，且未指定 `TLS` 隧道端点。该隧道可能终止于 `DMZ` 中的外部 `FW`、`DMZ` 中的路由器或\
