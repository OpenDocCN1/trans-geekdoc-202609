- "# 无隐晦安全：密码架构指南\n\n\n\n\n\n![Images](img/00001.jpeg)\n\n\n\n\n\n\n\n\n\n## 序言\n\n\
  这是《非隐晦性安全》系列的第三本书。第一本是我独立完成的。在此之前，我为其他书籍编写过文章和章节，但还没有自己的著作。第二本书是因为我与 Clay Epstein\
  \ 的合作而产生的，当时我并没有编写第三本书的特别计划。这本书的诞生源于以下几点。\n\n首先，在我的职业生涯中，我多次需要挖掘产品、应用和网络的密码细节。从密码学的角度来看，理解“谁、什么、为什么、在哪里、何时以及如何”这些问题是信息安全的关键。很多信息难以确定；错误信息和虚假信息毫无帮助。例如，供应商或服务商可能不愿透露细节，开发者提供的数据不可靠，或者产品规格已经过时。\n\
  \n此外，供应商和服务提供商会进行合并。知识会在员工或承包商离开时流失。产品线可能会停产并运行过旧软件。\n\n其次，在不配合或对抗性的环境下进行安全评估需要一套只有通过经验才能获得的技能。但是可靠的流程可以提供一致的结果。多年来，要做和不该做什么已包含在教训中。这些流程在良好的情况下同样适用。书中有一整个章节专门讨论风险评估。\n\
  \n第三，我在 2017 年 7 月的《ISSA Journal》上发表了名为《密码架构：失踪》的文章。该文章位于期刊封面，并于 2018 年 1 月在《2017\
  \ 年最佳文章》中重新出版。然而，我有很多可以讨论的内容，但六页的文章提供的信息有限。我将文章交给了我的出版商，他同意这个主题可以写成另一本好书。\n\n\n\n\
  \n\n另外提一下，ISSA 的文章和本书将简单的应用程序或网络图称为“卡通（cartoons）”。我个人将此归于美国银行的前同事 Don Provencher^(\\\
  *)，他在描述简单图表时创造了“卡通”这一术语。Don 对网络架构非常精通，甚至能够教导我。我们都很想念你，Don。\n\n在第一本书中，我提到我对 `X9`\
  \ 标准的长期参与。我参与并担任 `X9F4` 工作组主席一直持续今天。`X9F4` 工作计划随着新标准和技术报告的出现而不断增长。与此同时，我依然在工作，研究\
  \ `X9` 标准并编写这本书。这一切都是在我妻子 Linda 以及所有人的喜爱支持下完成的，大家依然最喜欢她。\n\n^(\\*) [www.legacy.com/obituaries/timesunion-albany/obituary.aspx?pid=186270529](http://www.legacy.com/obituaries/timesunion-albany/obituary.aspx?pid=186270529)\n\
  \n## 作者 (#part0003.html#rch00_fm06_author)\n\n`J. J. Stapleton` 自 1989 年参加首次认证标准委员会\
  \ `X9` 工作组会议以来，一直从事密码学、公钥基础设施 (`PKI`）、密钥管理以及许多其他信息安全技术。他在多个雇主处继续保持 `X9` 成员身份，并自\
  \ 1998 年以来担任 `X9F4` 密码协议和应用安全工作组主席。\n\n![Images](img/00002.jpeg)Jeff 于 1982 年在 `Citi\
  \ Information Resources` 开始担任软件工程师，当时他仍在攻读密苏里大学圣路易斯分校 (`UMSL`) 的计算机科学学士学位。\n\n![Images](img/00002.jpeg)Jeff\
  \ 于 1984 年在 `MasterCard` 继续他的开发人员生涯，管理卡支付应用的开发人员，并开始攻读密苏里大学罗拉分校 (`UMR`，现更名为密苏里科学技术大学）的计算机科学硕士学位。他也开始了长期的\
  \ `X9` 关联。\n\nJeff 被分配为 `MasterCard` 网络 `Banknet` 设计和开发密钥管理服务 (`KMS`)。当 `KMS` 距离投入生产仅剩\
  \ 24 小时时，一项将当时的 `IBM Series/1` 微型计算机替换为待定平台的战略决策延迟了 `KMS` 项目。他能够通过撰写论文来利用这段经验：`大型分布式网络中的密钥管理`，`J.\
  \ J. Stapleton`，1992 年，这是一篇提交给 `UMR` 研究院学院的论文，由 Daniel C. St. Clair、Chaman L. Sabharwal\
  \ 和 James Hahn 批准。\n\n他积极参与了 `X9` 技术指南 `TG-3` 个人识别码 (`PIN`) 安全合规指南（重编号为技术报告 `TR-39`）的开发。该指南提供了基于行业标准\
  \ (`X9.8` 和 `X9.24`) 的评估标准，定义了处理 `PINs` 及相关密码密钥的安全要求。`TG-3` 被许多支付网络采用，用于每两年一次的互操作性评估。\n\
  \n另一项成就是他参与了安全电子交易 (`SET`)规范的开发，这是 `Visa` 和 `MasterCard` 用于在线信用卡支付的合资企业。作为 `SET`\
  \ 项目的一部分，他还与 `Netscape` 合作开发了 `安全套接层协议`。\n\n![Images](img/00002.jpeg)1996 年，当他在\
  \ `MasterCard` 的部门被卖给 `Global Payment Systems` 时，Jeff 加入了 `Security Dynamics`（更名为\
  \ `Rivest-Shamir-Adleman (RSA) Security`）。他成为了 `RSA Labs` 的一部分，继续他的 `X9` 标准关联，并成为了\
  \ `X9F4` 工作组主席。\n\n![Images](img/00002.jpeg)Jeff 在 1998 年加入审计公司 `KPMG` 时，继续担任 `X9F4`\
  \ 主席。`SET` 一直在演进，他领导 `KMPG` 团队在日本、美国和法国对 `SET` 品牌认证机构 (`CA`) 进行了全球安全评估。\n\n他积极参与了《美国国家标准\
  \ X9.79 PKI 政策与实践》的开发，并参与了美国注册会计师协会 (`AICPA`) 采纳 `X9.79`，这最终成为了 `Webtrust for CA`\
  \ 审计标准。他还帮助在 `KPMG` 建立了 `CA` 审计计划。\n\n他还协助一家大型金融机构建立了他们的第一套 `PKI`，包括其证书政策和证书实践声明\
  \ (`CPS`)。\n\n![Images](img/00002.jpeg)Jeff 是 2008 年 `密码保障服务服务 (CAS)` 的创始人之一，作为一家通过\
  \ `支付卡行业 (PCI)` 认证的公司，提供 `TG-3` 评估和 `合格安全评估师 (QSA)` 评估。他继续担任 `X9F4` 主席。\n\n除了执行大量的\
  \ `TG-3` 评估和 `QSA` 评估外，Jeff 还协助一家大型安全公司建立了他们的第一套 `PKI`，包括其证书政策和 `CPS`、密钥生成仪式程序，并完成了\
  \ `Webtrust for CA` 审计和 `Webtrust for Extended Validation` 审计。\n\n![Images](img/00002.jpeg)Jeff\
  \ 于 2010 年加入 `Bank of America`，最终 `CAS` 在合同完成后停止了业务。与此同时，他继续担任 `X9F4` 主席，并在 2014\
  \ 年出版了第一本 `Security without Obscurity`。\n\n![Images](img/00002.jpeg)Jeff 于 2015\
  \ 年加入 `Wells Fargo`，继续担任 `X9F4` 主席，并在 2016 年出版了第二本 `Security without Obscurity`。Jeff\
  \ 是多本其他讨论密码学的书籍的主要作者。\n\n\n\n\nJeff 已发表了多篇关于密码学的论文。\n\n![Images](img/00002.jpeg)加密演变，Jeff\
