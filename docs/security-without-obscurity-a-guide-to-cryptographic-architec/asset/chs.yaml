  ![images](img/00013.jpeg)\n![images](img/00014.jpeg)\n\n读者现在已经掌握了书中使用的足够的数学符号和加密术语。读者应该熟悉的另一个领域是行业标准和标准组织。\n\
  \n### 1.5 行业标准 (#part0003.html#Rsec1_5)\n\n阅读书籍、技术论文、期刊文章和博客可以是信息性的且具有指导性的，但了解行业标准和规范是一个宝库。加密算法、架构、协议和消息规范都在标准中定义。了解谁开发了标准也很。图\
  \ 1.5 显示了相关的标准组织，包括国家标准机构（NSB）和标准开发组织（SDO）。\n\n**国际标准组织** (\\*) (ISO) 基于 163 个成员国的共识开发了全球标准。ISO\
  \ 由数百个技术委员会（TC）组成，按行业划分，已发布超过 2 万份国际标准和相关文档。例如，`TC1` 是螺纹，`TC120` 是皮革，`TC215` 是健康信息，`TC307`\
  \ 是区块链和分布式账本技术。与本书相关的是金融服务的 `TC68`。\n\n![](img/00015.jpeg)\n\n图 1.5 标准组织。\n\nISO\
  \ [](#part0006.html#fn1_2) 成员是拥有 NSB 的国家；个人或公司不能成为 ISO 成员。ISO 为 100 多个国家提供三种成员类别（正式、特派和订阅），包括：\n\
  \n![](img/00002.jpeg)澳大利亚 NSB 是 Standards Australia † (SA)\n\n![](img/00002.jpeg)加拿大\
  \ NSB 是加拿大标准委员会 ‡ (SCC)\n\n![](img/00002.jpeg)法国 NSB 是法国标准协会协会 § (AFNOR)\n\n![](img/00002.jpeg)德国\
  \ NSB 是德国标准协会 ¶ (DIN)\n\n![](img/00002.jpeg)日本 NSB 是日本工业标准委员会 \\*\\*) (JISC)\n\n\
  ![](img/00002.jpeg)英国 NSB 是英国标准协会 †† (BSI)\n\n![](img/00002.jpeg)美国 NSB 是美国国家标准协会\
  \ (ANSI)\n\n\n\n\n\n# 国际电工委员会 (IEC) [#part0006.html#fn1_9]\n`IEC` 根据 83 个参与成员国和\
  \ 2000 多名行业专家的共识，制定电气、电子及相关技术（统称为“电电技术”）的全球标准。`IEC` 组织由 100 多个 `TCs` 组成，并通过联合委员会与\
  \ `ISO` 和 `国际电信联盟` (`ITU`) 合作。与本书相关的是负责信息技术标准的 `ISO/IEC 联合技术委员会一` (`JTC1` )。\n\n\
