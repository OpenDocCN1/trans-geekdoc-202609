  \ 根据其 176 个成员国的共识制定全球标准（称为 `ITU-T 建议书`）。`ITU-T` 由 11 个活跃研究小组组成。与本书相关的是负责安全的 `ITU-T`\
  \ 研究小组 `SG17`。\n\n请注意，`ITU-T` 免费提供了其许多标准 #¶¶。\n\n`ISO`、`IEC` 和 `ITU-T` 基本上是国际标准化的三大柱。成员身份是国家级的，每个国家都有一个指定的\
  \ `NSB`。每个国家的 `NSB` 负责担任技术咨询小组 (`TAG`)，但这可以委托给经 `NSB` 认证为 `SDO` 的其他小组。\n\n# 美国国家标准协会\
