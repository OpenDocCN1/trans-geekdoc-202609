  \n# 第 2 章\n\n## 密码学基础\n\n密码学家是专门从事密码学或密码分析的数学家。从本质上，密码分析是破解保护机制，而密码学是构建保护机制。所有的密码学家都是数学家，但并非所有的数学家都是密码学家。本书包含了一些数学内容，并讨论了一些密码学概念，但没有使用任何深奥数学。\n\
  \n![](img/00002.jpeg)密码学源于希腊语“kyrptós”，意为隐藏（或秘密），以及“graphein”，意为写作。\n\n##images/00002.jpeg)密码分析源于希腊语“kyrptós”，意为隐藏（或秘密），以及“analýein”，意为松开（或解开）。\n\
  \n密码学的最早已知用法是在古埃及 \\[6\\]，当时祭司用秘密符号代替常见的象形文字来隐藏他们的真实含义。政府和军事千年来一直使用密码学进行秘密通信。现代密码学和密码分析始于第二次世界期间，当时臭名昭著的德国恩格玛^(\\\
  *)机器和日本的紫色密码。金融服务行业几十一直在使用密码学来保护自动取款机（ATM）和销售点终端的个人识别码。信息技术使用各种类型的密码学来保护通信、密码、文件、数据库等。\n\
  \n出于本书的目的，密码学将作为对称与非对称方法进行讨论，并组织成加密、完整性与认证、不可否认性和令牌化服务。书中涉及许多相关主题，如随机数、质数、异或（XOR）、哈希以及许多其他函数，但仅限于它们与密码学架构的相关。本章使用的某些符号包括以下缩写和首字母词。\n\
  \n![images](img/00016.jpeg)\n\n密码学像数学一样，是一门不断演变的科学。今天被认为是安全或良好的做法可能会发生变化，变得过时或脆弱。曾经被认为足够用于密码用途的数学问题已经并将将继续被解决，因此总是需要更好、更强大的算法。物理学和量子计算机的科学研究将继续提高计算能力，使得强算法最终变得弱小并需要替换。同时，本书中的基本原理仍然有效并继续具有价值。\n\
  \n### 2.1 加密\n\n加密提供了数据机密性，无论是在存储中还是在传输过程中。通常情况下，加密过程使用密码密钥将数据从明文转换为密文，使得任何没有密钥访问的方无法逆转该过程。然而，加密不提供数据完整性，因为密文仍然可以被修改，导致解密后的数据毫无用。请参见第\
  \ 2.3 节关于数据完整性和认证的讨论。\n\n对称加密在图 2.1 中所示，显示明文转换为密文并还原回明文。加密和解密使用同一个密钥，因此称为“对称”密码学，有时也称为“密钥”密码，以区分对称密钥和非对称密钥。沿着图\
  \ 2.1 中从左到右的数据路径，明文和密钥输入到 `encrypt` 函数，产生密文。密文和相同的密钥输入到 `decrypt` 函数，恢复明文。\n\n![](img/00017.jpeg)图\
  \ 2.1 对称加密\n\n当涉及发送和接收方时（如虚线框所示），发送者加密明文并将密文发送给接收者。接收者使用相同的密钥解密密文。这种情况下，试图访问传输数据的第三方只能“看到”密文而无法读取明文。因此，只有拥有密钥的发送和接收者可以访问明文。然而，如果发送者或接收者共享密钥，系统的整体安全性将被削弱。详情请参见第\
  \ 3 章，密钥管理问题请参见第 7 章。\n\n非对称加密在图 2.2 中所示，显示明文转换为密文并还原回明文，但使用不同的密钥进行加密和解密。非对称密钥总是成对出现，其中一个被称为公钥，另一个是私钥。从左到右的数据路径，明文和公钥输入到\
  \ `encrypt` 函数产生密文。密文和私钥输入到 `decrypt` 函数恢复原始明文。使用公钥加密的明文无法使用公钥解密，只有对应的私钥有效。\n\n\
  当涉及发送和接收方时（如虚线框所示），发送者使用接收者的公钥加密明文并将密文发送给接收者。接收者使用相应的私钥解密密文以恢复明文。因此，只有拥有私钥的接收者才能解密数据。发送者已经可以访问明文。通常，任何拥有公钥的人都可以加密数据，但只有拥有私钥的接收者才能解密数据。非对称密钥对所有者都不应共享私钥，尽管由于法律或合同要求，密钥可能会进行备份或托管。详情请参见第\
  \ 3 章，密钥管理问题请参见第 7 章。\n\n![](img/00018.jpeg)图 2.2 非对称加密\n\n由于加密只能提供数据机密性，还需要其他密码服务来解决数据完整性和认证。然而，由于许多完整性和认证技术使用哈希函数，哈希在第\
  \ 2.2 节中讨论。\n\n### 2.2 哈希函数\n\n哈希函数如图 2.3 所示，但注意哈希并不一定是加密函数；哈希函数不使用密钥。相反，许多密码方法采用了哈希函数。但并非所有的哈希函数都足够用于密码方法；足够强大的哈希被称为密码哈希。基本的哈希过程是将明文输入到哈希函数，其输出是一个哈希值，通常称为哈希。我们将哈希函数表示为\
  \ `H(C) = h`，其中大写 `H` 是哈希函数，大写 `C` 是输入明文，小写 `h` 是输出。任何哈希函数输入任意长度的明文但输出固定长度的哈希。\n\
  \n\n\n\n\n哈希（Hash）也被称为“单向”函数，因为给定一个哈希值，函数无法还原以恢复明文；哈希是不可逆的。哈希的目的是对明文进行相对唯一的表示，有时被称为指纹。哈希之所以是“相对”唯一的，是因为所有可能的输入（变长明文）的总数远大于可能的输出（固定长度哈希）的数量。这简单意味着多个明文输入可能会相同的哈希值。因此，对于某组不同的明文（`Ci`、`Cj`、`Ck`\
  \ 或更多），相同的哈希函数产生相同的哈希值：即 `H(Ci) = H(Cj) = H(Ck) = h`。这被称为哈希碰撞，是任何哈希函数的特征。然而，某些哈希函数的碰撞率太高；这就是加密哈希算法存在的根本原因。\n\
  \n加密哈希算法具有三个基本特性。\n\n![](img/00019.jpeg)\n\n图 2.3 哈希函数。\n\n![](img/00002.jpeg)\n\
  \n**抗原像性**：给定一个哈希值（`h`），很难找到任何满足 `H(Ci) = h` 的明文（`Ci`）。这一特性是单向函数的基础。\n\n![](img/00002.jpeg)\n\
  \n**抗二原像性**：给定一个输入明文（`Ci`），很难找到另一个满足 `H(Ci) = H(Cj)` 的明文（`Cj`）。\n\n![](img/00002.jpeg)\n\
  \n**抗碰撞性**：很难找到任意两个明文（`Cj`）和（`Ck`）使得 `H(Cj) = H(Ck)`。这对（`Cj`）和（`Ck`）被称为加密哈希碰撞。\n\
  \n旧的哈希函数如 `MD4` 和 `MD5`（以消息摘要，即哈希值的另一个术语命名）具有 128 位哈希值，不再被认为是加密安全的。联邦信息处理标准（FIPS）\
  \ 180-4 [28]）定义了具有 160 位哈希的安全哈希算法 `SHA-1`，作为较早消息摘要算法的替代方案；具有 224 位、256 位、384 位和\
  \ 512 位哈希的 `SHA-2` 族作为 `SHA-1` 的替代。FIPS 202 [29] 引入了另一种 `SHA-3` 族，具有 224 位、256 位、384\
  \ 位和 512 位哈希，作为 `SHA-2` 的未来替代。由于 `SHA-2` 是一族哈希算法，它们通常被称为 `SHA-256` 或 `SHA-512`；然而，由于\
  \ `SHA-2` 和 `SHA-3` 具有相同的大小，哈希算法可能会引起混淆。\n\n哈希算法用于保护存储的密码、作为一种非加密校验和，或与节 2.3 节中讨论的加密密钥配合。然而，哈希函数容易受到穷举攻击。一旦知道使用的哈希算法，任何人都可以根据可能的明文创建一个可能的哈希值列表，通常称为彩虹表。例如，哈希算法可以用于从明文生成哈希值，但在计算上逆转该过程是不可行的。\n\
  \n\n\n\n数据机密性通过加密提供保障。数据完整性和身份验证通过 `MAC` 或 `HMAC` 提供，且两者均具有良好的信誉。数字签名提供具有强效身份验证的数据完整性保护，并在适当的控制下，可能提供不可否认性。然而，任何对加密密钥的使用都必须以安全的方式管理密钥，以防止误用、未经授权的访问，并泛泛避免密钥泄露。有关密钥管理生命期的更多信息，请参阅第\
  \ 3 章。\n\n### 2.4 不可否认性\n\n不可否认性是防止抵认的一系列必要控制，抵认是指一方拒绝承认另一方所称的协议。正如在*不不隐蔽的安全性：机密性、身份验证与完整性指南*[4]\
  \ 中讨论的，这涉及技术、加密、操作和法律方面的考量。技术方面的考量包括两个主要的行业元素。\n\n![](img/00002.jpeg)扩展验证（EV）证书；参见\
  \ CA/浏览器论坛的《扩展验证证书指南》[16]。EV 证书要求由注册机构（RA）和认证机构（CA）执行额外的主体身份验证和授权程序。EV 证书的历史起源是为了解决证书无效这一行业挑战。CA（及\
  \ RA）需根据 EV 标准进行审计，并被认可颁发 EV 证书而非普通证书。指定 EV 的 CA 不能颁发普通证书，正如普通 CA 不能颁发 EV 证书。然而，EV\
  \ 证书并不能神奇地提供具有不可否认性属性的数字签名。\n\n![](img/00002.jpeg)证书密钥用途“不可否认性”标志，已重命名为“内容承诺”以避免混淆；请参见附录：X.509\
  \ 证书快速参考。然而，该标志的存在并不会神奇地表现出不可否认性。\n\n相反，公钥基础设施（PKI）的每个参与者都需要提供适当的加密、操作和法律控制。加密方面的考量始于数字签名算法。基于非对称算法的数字签名算法有许多。有些算法以发明者的名字命名，而另一些则是缩写。\n\
  \n![](img/00002.jpeg)`RSA` 以其发明者 Ron Rivest,^(\\*)、Adi Shamir,^† 和 Leonard Adleman^‡\
  \ 命名，基于其开创性的 1978 年论文 [9] 并在美国国家标准协会（ANSI）标准中编码 [10]。\n\n![](img/00002.jpeg)`DSA`\
  \ 被命名为在 NIST 标准中编码的数字签名算法 [11]。\n\n![](img/00002.jpeg)`ECDSA` 被命名为在 ANSI 标准中编码的椭圆曲线数字签名算法\
  \ [12]。\n\n非对称数字签名如图图 2.6 所示，显示了用于创建数字签名的明文和私钥（在第 2.3 节 中称为 ICV），该签名可以使用封装在数字证书中的关联公钥进行验证\
  \ [13]。只有私钥可以生成数字签名，只有关联的公钥可以验证签名。从右到左遵循数据路径，明文和私钥是 `sign` 函数的输入，产生数字签名。相同的明文和关联公钥是\
  \ `verify` 函数的输入。如果数字签名通过验证，则明文和私钥具有数据完整性，且数字签名提供了强效身份验证。\n\n```\n![](img/00022.jpeg)图\
  \ 2.6 数字签名\n```\n\n数字证书（有时称为公钥证书）是一种身份凭证，包含了公钥、颁发证书的认证机构（CA）名称以及其他重要信息。PKI 需要证书来支持，然而，关于管理加密密钥的更多信息请参见\
  \ 5]。\n\n当发送方和接收方参与时（如虚线框所示），发送方使用明文和私钥生成数字签名。接收方使用相同的明文和关联公钥证书验证数字签名。验证过程取决于所使用的数字签名算法（`RSA`、`DSA`\
  \ 和 `ECDSA`）。\n\n当数字签名验证通过时，接收方知道明文具有完整性，发送方已通过验证，且由于只有发送方控制相应的私钥，接收方拥有不可否认性的基础。然而，仅仅验证签名是不够的，还需要证书验证。图\
  \ 2.7 展示了任何 PKI 内部的基本证书链，从左侧的主体证书开始，到右侧的信任根结束。主体证书链接到颁发 CA 证书，其链接到子 CA 证书，最后链接到根\
  \ CA（信任根）证书。有些 PKI 的证书较少，有些则更多，但颁发主体证书的三层 PKI 并不常见。\n\n```\n![](img/00023.jpeg)图\
  \ 2.7 公钥基础设施\n```\n\n证书链验证涉及一系列技术和加密步骤，任何一步失败都会导致整个流程失效。每个证书都需要单独验证，这取决于所有其他证书。证书格式参见附录：X.509\
  \ 证书快速参考，证书验证请参见第 3 章。一旦证书链验证成功，被签名的信息具有数据完整性，数字签名提供了强效身份验证，且由于只有签名者拥有私钥，其完整性和身份验证可以向第三方证明。然而，除了已讨论的技术和加密步骤外，真正的不可否认服务还需要操作和法律控制。\n\
  \n操作控制由每个 PKI 参与者按照约定的规则执行以建立信任。任何 PKI 内部包含以下参与者：\n\n![](img/00002.jpeg)主体是将公钥和通用名称封装在证书中的实体，并安全地管理相应的私钥。主体对其系统组件进行信息安全控制，确保实施访问控制并保持系统补丁更新，以避免已知漏洞的风险。\n\
  \n![](img/00002.jpeg)RA 是负责验证和授权主体的实体，但 RA 不颁发或撤销证书。RA 对其系统和人员进行信息安全控制，确保只有授权的流程或个人可以访问数据和组织资源。\n\
  \n\n\n\n![](img/00002.jpeg)`CA`（证书颁发机构）是一个受信任发布和撤销证书的实体，取决于 `RA`（注册机构）对主体进行身份验证和授权。`CA`\
  \ 对系统和人员维持信息安全控制，确保只有授权的过程或个人才能访问数据和组织资源。\n\n![](img/00002.jpeg)`Relying Party`（信方）是主体证书的使用实体，因此依赖\
  \ `RA` 对主体进行身份验证和授权，依赖 `CA` 发布和撤销证书，并依赖主体安全地管理其相应的私钥。\n\n如果每个 PKI 参与者都能符合预期，特别是当主体安全地管理其私钥且信方执行了证书验证时，那么主体的数字签名就可以在加密和操作上提供不可否认性。法律控制包括两个主要领域：纠纷解决和证据链。美国律师协会^(\\\
  *) 发布了《数字签名指南》（`DSG`） \\[14\\]和《PKI 保证指南》（`PAG`） \\[15\\]，这些指南将不可否认性定义为并非技术机制的自动结果，而是诉诸法院或仲裁员等可用纠纷机制后才能确定的属性。`PAG`\
  \ 还讨论了数字签名交易或通信产生的证据提议者可能如何根据既定的证据规则在审判或其他程序中寻求其证据的采纳。基本上，所有的加密和操作控制都需要向独立的第三方提供证明。\n\
  \n确保 `RA` 和 `CA` 按照行业标准运行的一种方法是由信息安全专业人员进行的独立审计。此类审计的评估标准由 `Webtrust for CA` \\\
  [17\\] 展示，该标准被许多 `CA/Browser Forum` 成员的 `CA` 和浏览器制造商认可。^(\\*)最初的 `Webtrust for CA`\
  \ `v1.0` 基于 `X9.79` \\[19\\]，该标准后来国际化为 `ISO 21188` \\[20\\]。此外，之前的 `PKI Forum`（现并入“结构化信息标准身份与可信任基础设施推进组织”^†\
  \ (`IDtrust`) 部门）在其 `CA Trust` \\[18\\]白皮书中也支持了 `Webtrust` 审计。`Webtrust for CA`\
  \ `v2.0` 审计标准目前组织为七个领域：\n\n1. `CA 业务实践披露`，预计在 `CA` 证书策略或证书实践声明中记录。\n2. `CA 业务实践管理`，即提供有效控制，以确保\
  \ `CA` 按照其证书策略或证书实践声明运行。\n3. `CA 环境控制`，即针对资产、人员、物理和逻辑访问控制、由于开发、维护、监控和安全日志的控制。\n\
  4. `CA 密钥生命周期管理控制`，涉及密钥生成、密钥存储、密钥备份与恢复、公钥分发、密钥使用、密钥存档、密钥销、密钥泄露、加密硬件安全模块和密钥托管。\n\
  5. `订阅者密钥生命周期管理控制`，涉及 `CA` 为订阅者提供的管理用户加密密钥的服务。\n6. `证书生命周期管理控制`，涉及订阅者注册、证书续期、证书更换、证书发放、证书分发、证书撤销、吊吊和证书验证。关于订阅者注册，请参考之前讨论过的\
  \ `EV` 证书 \\[16\\]历史起源。\n7. `从属 CA 证书生命周期管理控制`，涉及对 `PKI` 内部运行的一个或多个从属 `CA` 的控制。\n\
  \n每个领域都包含了用于衡量合规性的控制目标和作为示例的说明控制，但 `Webtrust for CA` 对于技术或解决方案既不是强制性的，也不是禁止性的。同样，行业标准\
  \ \\[20\\]定义了要求但没有指定技术。因此，读者获得的是指导而非具体的规格说明。关于 `PKI` 操作的更深入的讨论，请参阅 `Ref.` \\[5\\\
  ]，关于本书对这些领域的描述，请参阅第 7 章。\n\n关于数字签名与电子签名的最后一点是：2000 年的《全球和国家商业电子签名法》^(\\*) (`ESIGN`)\
  \ \\[21\\]将电子签名定义为电子声音、符号或过程，附属于合同或其他记录或与之逻辑关联，并由具有签署记录意图的人执行或采用。因此，由于数字签名是表示签署记录意图的加密过程，它适用于电子签名。然而，如果没有加密、操作和法律控制，电子签名无法提供\
  \ `DSG` 和 `PAG` 中描述的不可否认性服务。\n\n### 2.5 令牌化（Tokenization）\n\n令牌化是将敏感数据替换为无害数据的过程。什么是敏感数据（也称为底层敏感值\
  \ `USV`）取决于业务应用。通常对于支付应用，账号号是敏感的。\n\n例如，《支付卡行业数据安全标准》（`PCI DSS`）令牌化指南 \\[26\\]提供了特定应用的描述：*令牌化是将主账号（PAN）替换为称为“令牌”的替代值的过程。解令牌是将令牌兑换为相关\
  \ PAN 值的逆过程。单个令牌的安全性主要取决于仅通过替代值无法推断出原始 PAN*。\n\nEupay Mastercard-Visa（EMV）支付令牌化规范\
  \ \\[27\\]提供了类似的描述：*支付令牌是支付生态系统中替代 PAN 的替代值。支付令牌可用于支付交易，而非支付令牌可用于辅助过程，如忠诚度跟踪。*\n\
  \n对于医疗保健，患者姓名或诊断代码可能被认为是敏感的。关于隐私，任何个人身份信息如邮寄地址或 `SSN` 可能是需要保护的敏感 (`USV`) 数据。\n\n\
  什么是无害数据取决于令牌化方法。`X9.119-1` \\[22\\] 定义了使用加密方法保护敏感支付卡数据的要求，而 `X9.119-2` \\[23\\]\
  \ 则涉及令牌化方法。`X9.119-2` 提供了类似的令牌化定义：*将明文值（即 USV）映射到现有或新生成的替代值（即令牌）的过程*，并识别了四种令牌化方法。\n\
  \n\n\n\n\n图 2.8 展示了令牌化加密方法。令牌化过程是通过对称密钥对 USV（用户敏感值）进行加密并生成令牌。去令牌化过程是使用相同的对称密钥对令牌进行解密，从而恢复\
  \ USV。由于可以直接从令牌中恢复 USV，因此不需要 USV 数据库（也称为令牌库，token vault）。然而，加密密钥（称为令牌密钥）必须安全管理，否则一旦密钥泄露，任何生成的令牌都可以被解密。此外，对去令牌化服务的未授权访问将允许从令牌中恢复任何\
  \ USV，而对令牌化服务的无限访问则允许其被滥用，以创建所有可能的 USV 和令牌的穷尽列表（有时称为彩虹表）。\n\n图 2.9 显示了令牌化 MAC 方法。令牌化过程是将\
  \ USV 作为输入，使用对称密钥通过 `MAC` 或 `HMAC` 函数处理生成令牌。去令牌化过程只能通过包含 USV 到令牌映射关系的令牌库来完成。或者，可以使用特定令牌验证\
  \ USV。同样，令牌密钥必须安全管理，否则一旦密钥泄露，就会用于创建所有可能的 USV 和令牌的彩虹表。此外，对去令牌化服务（如果启用了库）的未授权访问将允许从令牌中恢复任何\
  \ USV，而对令牌化或验证服务的无限访问则允许滥用，以创建所有可能的 USV 和令牌的字典表。\n\n![](img/00024.jpeg)\n图 2.8 令牌化加密方法。\n\
  \n![](img/00025.jpeg)\n图 2.9 令牌化 MAC 方法。\n\n图 2.10 阐述了令牌化随机方法。令牌化过程是随机数生成器（`RNG`）用随机值替换\
  \ USV。`RNG` 的熵源独立于 USV 输入，因此令牌与 USV 之间没有关联。因此，去令牌化过程只能通过包含 USV 到令牌映射关系的令牌库来完成。此外，由于随机方法没有加密密钥，因此不存在密钥泄露风险；但\
  \ `RNG` 可能会受到影响而产生偏差而非随机值。此外，对去令牌化库的未授权访问将允许从令牌中恢复任何 USV，而对令牌化服务的无限访问则允许其滥用，以创建所有可能的\
  \ USV 和令牌的字典表。\n\n图 2.11 显示了令牌化表格方法。令牌化过程是将 USV 替换为源自伪随机数表的值。该表生成一次，使用 `RNG` 为伪随机数生成器（`PRNG`）种子并用于填充表。一旦生成，该表在所有的令牌化和去令牌化过程中保持静态。去令牌化过程是将令牌替换为从相同表中派生的\
  \ USV；本质上，令牌化是查找，而去令牌化是反向查找。因此，不需要令牌库。此外，由于表格方法没有使用加密密钥，因此不存在密钥泄露风险；但 `RNG` 或 `PRNG`\
  \ 可能会受到影响而对表格产生不利影响。此外，一旦生成，需要安全管理表格，否则一旦表格泄露，任何生成的令牌都可以被解密。此外，对去令牌化服务的未授权访问将允许从令牌中恢复任何\
  \ USV，而对令牌化服务的无限访问则允许其滥用，以创建所有可能的 USV 和令牌的彩虹表。\n\n![](img/00026.jpeg)\n图 2.10 令牌化随机方法。\n\
  \n![](img/00027.jpeg)\n图 2.11 令牌化表格方法。\n\n图 2.12 提供了令牌化环境的概述。从令牌化的角度来看，实体分为授权实体（包括与令牌化系统接口的用户和业务应用程序）和不接口的未授权实体。因此，企业由令牌化环境和非令牌化环境组成。授权实体通过令牌化请求（`TRI`）进行令牌化、去令牌化以及可能的验证或其他相关身份验证。`TRI`\
  \ 与授权实体之间的通信也应是安全的；详情请参阅第 4 章和第 5 章。令牌化服务可能包含令牌库，但它仅与有效的 `TRI` 交互，并仅对合法请求做出响应。\n\
  \n![](img/00028.jpeg)\n图 2.12 令牌化环境。\n\n无论令牌化服务提供什么种方法（尽管可能只支持单一方法），对令牌化的无限访问都允许其被滥用以创建所有可能的\
  \ USV 和令牌的字典表。同样，对去令牌化（或验证）的未授权访问允许从令牌中恢复任何 USV。因此，令牌化环境应与其他服务及未授权实体保持隔离。\n\n- `www.bbc.co.uk/history/topics/enigma`\n\
  - `people.csail.mit.edu/rivest/`\n- `amturing.acm.org/award_winners/shamir_2327856.cfm`\n\
  - `www.cs.usc.edu/people/faculty/tenured-tenure-faculty/adleman-leonard`\n- `www.americanbar.org`\n\
  - `https://cabforum.org/`\n- `www.oasis-idtrust.org/`\n- `www.gpo.gov/fdsys/pkg/PLAW-106publ229/pdf/PLAW-106publ229.pdf`\n\
  \n## 第 3 章 (#part0003.html#rch03)\n\n## 加密密钥 (#part0003.html#rch03)\n\n本章基于之前章节的信息，并提供了关于对称密钥、非对称密钥对和公钥证书的更多细节。这里介绍的信息在很大程度上与算法无关，但在需要时引用了某些特定算法。尽管这里讨论了某些公钥基础设施（`PKI`）组件，但本章未涉及操作方面；请参见\
  \ *Security without Obscurity: A Guide to PKI Operations*[5]。\n\n![](img/00002.jpeg)\n\
  第 1 章 (#part0006.html#ch01) 提供了密码学词汇表，包含数学回顾、常用符号和传统的密码学术语。\n\n![](img/00002.jpeg)\n\
  第 2 章 (#part0007.html#ch02) 提供了对称和非对称加密的概述，包括加密、哈希、完整性与身份验证、不可否认性和令牌化。\n\n本章讨论的密钥管理方法用于各种协议，这些协议在第\
  \ 4 章 (#part0009.html#ch04) 和第 5 章 (#part0010.html#ch05) 中介绍。本章讨论的密钥管理方案涵盖了发送者和接收者之间传输的数据，也涵盖了数据库环境等存储中的数据。虽然本章介绍了密钥管理方案，但密钥生命周期和加密模块将在第\
  \ 7 章 (#part0012.html#ch07) 中讨论。\n\n### 3.1 对称密钥 (#part0003.html#Rsec3_1)\n\n\n\n\
  \n\n本节讨论了用于建立对称密钥的各种基于加密加密方案，而下一节将讨论用于建立对称密钥的基于非对称加密方案。密钥建立方案包括：\n\n![](img/00002.jpeg)初始密钥\
  \ (Initial key)\n![](img/00002.jpeg)固定密钥 (Fixed key)\n![](img/00002.jpeg)主密钥/会话密钥\
  \ (Master/Session key)\n![](img/00002.jpeg)交易唯一密钥 (DUKPT)\n\n本节讨论的密钥交付方案包括：\n\n\
  ![](img/00002.jpeg)伪密钥 (Faux key)\n![](img/00002.jpeg)PKCS 令牌\n![](img/00002.jpeg)数据库加密密钥管理\
  \ (DBEKM)\n\n如第 2 章所示，同一个对称密钥用于加密或解密、消息认证码（MAC）或密钥哈希消息认证码（HMAC）以生成或验证完整性检查值（ICV)，或者用于某些令牌化方法。当涉及发送者和接收者时，双方实体必须共享同一个密钥。然而，建立初始密钥（IK）是有困难的。在没有密钥加密密钥（KEK）保护其他密钥的情况下，IK\
  \ 需要以某种方式安全地交换。在历史上，这是通过使用密钥分量实现的；参见图 3.1。密钥分量的术语定义在 X9.24-1 标准中 \\[30\\]。\n\n`Key\
  \ Component`：至少两个参数之一，其格式为加密密钥，通过与一个或多个类似的参数进行模 2 异或/加法运算形成一个加密密钥。分量的长度与生成的密钥长度相等\
  \ \\[30\\]。\n\n注意，异或（等同于异或运算结果）在第 1 章中也有定义，附录：XOR 快速参考提供了十六进制和二进制格式的 XOR 值的完整列表。图\
  \ 3.1 展示了两个实体（发送者和接收者）交换密钥分量以建立对称密钥的示例。在这种情况下，发送者生成一个 128 位的对称密钥并创建两个 128 位的密钥分量，将两个分量安全地发送给接收者，接收者重新组合分量以安装对称密钥。实际操作将取决于两个参与者的能力和专业知识，有多种可行的方案。\n\
  \n![](img/00029.jpeg)\n\n图 3.1 对称 IK。\n\n![](img/00002.jpeg)发送者生成两个随机数作为密钥分量，将每个分量分配给不同的持有者，然后每个分量持有者将他们的分量手递给接收端的两个独立分量所有者。或者，发送者持有者可以通过信函将分量分别发送给接收持有者。\n\
  \n![](img/00002.jpeg)发送者生成一个随机密钥和一个随机数作为第一个密钥分量，并将密钥与该分量异或以推导出第二个分量。发送者将每个分量分配给不同的持有者，然后这些持有者通过手递、信函或可能的安全电子邮件将每个分量安全地传输给不同的接收持有者。\n\
  \n或者（未在图 3.1 中显示），发送者生成一个随机数作为第一个分量，接收者生成一个随机数作为第二个分量。发送者分配一个分量持有者，其将第一个分量安全地传输给特定的接收持有者。同样，接收者分配一个持有者，其将第二个分量安全地传输给另一个发送持有者。双方随后将其原始分量和交付的分量结合以重建对称密钥。\n\
  \n其他密钥分量操作也是可能的。然而，一旦分量交换并建立了对称密钥，分量就可以用于备份和恢复。图 3.2 展示了对称密钥恢复的示例。发送者可以将密钥分量保留在安全存储设施中，并在由于某些技术故障需要恢复密钥时维持分量持有者的责任。同样，接收者可以将密钥分量保留在安全存储设施中，并在需要恢复密钥时维持分量持有者的责任。通过这种方式，除非要分发新密钥，否则分量不需要重新交换。X9.24-1\
  \ 提供了处理密钥分量的要求和建议 \\[30\\]。\n\n一旦建立了对称密钥，有两种基本操作方法：固定密钥或主密钥（MK)/会话密钥（SK）。图 3.3 展示了使用密钥分量建立初始对称密钥的固定密钥方法示例。IK\
  \ 被发送者用于加密明文，被接收者用于解密密。一旦固定密钥达到生命周期结束，将通过再次交换新分量来替换。因此，一旦使用手动程序通过密钥分量建立了 IK，它将保持“固定”，直到使用相同的手动程序进行替换。X9.24-1\
  \ 为固定密钥方法提供了要求和建议 \\[30\\]。\n\n![](img/00030.jpeg)\n\n图 3.2 对称密钥恢复。\n\n![](img/00031.jpeg)\n\
  \n图 3.3 对称固定密钥。\n\n某些系统可能会重用当前的固定密钥交换新密钥；然而，这违反了基本的密钥管理原则：密钥是生成并用于预期用途的。固定密钥生命周期旨在通过不过度使用加密密钥来保护数据。在密钥生命周期结束时将数据加密密钥（DEK）重新用作\
  \ KEK 会增加新密钥泄露的风险，从而导致数据泄露。\n\n图 3.4 展示了使用密钥分量建立初始对称密钥的 MK/SK 方法示例。IK 被用作 MK 来交换一个或多个\
  \ SK。发送者使用 MK 加密一个随机 SK 并将密文发送给接收者，接收者解密密文以恢复 SK。一旦建立了 SK，发送者使用 SK 加密明文，接收者使用 SK\
  \ 解密密文。X9.24-1 为 MK/SK 方法提供了要求和建议 \\[30\\]。\n\n当 SK 达到生命周期结束时，通过使用 MK 交换另一个 SK 来替换。当\
  \ MK 达到生命周期结束时，将通过再次交换新分量来替换。重做分量的替代方案是使用当前 MK 交换新的 MK；然而，只有在当前 MK 未被泄露时这种方法才是有效的。MK\
  \ 是用于交换 DEK 的 KEK，因此重用它交换另一个 KEK 符合其预期用途，并符合基本的密钥管理原则：密钥是生成并用于预期用途的。\n\n![](img/00032.jpeg)\n\
  \n图 3.4 对称 MK/SK。\n\n的是，固定密钥和 MK/SK 存在一个共同问题。行业标准 \\[30\\]要求通信双方使用的任何密钥都是唯一的（随机情况除外）。这意味着与成百上千甚至数百万终端设备通信的主机系统需要为每个终端管理单独的密钥。使用固定密钥或\
  \ MK/SK 方法将需要密钥数据库。或者，DUKPT（读作“duck putt”）允许主机使用单个派生密钥（BDK）管理许多终端的唯一密钥。X9.24-1 为\
  \ DUKPT 方法提供了要求和建议 \\[30\\]。\n\nDUKPT 是主机系统与许多终端之间的密钥管理方案，尽管它也可以用于许多其他场景。\n\n![](img/00002.jpeg)图\
  \ 3.5 展示了主机如何使用派生密钥（BDK）生成并向终端注入 IK。\n\n\n\n\n\n![](img/00002.jpeg)图 3.6 显示了终端如何使用\
  \ `IK` 生成派生密钥（`DKs`），向主机发送加密交易。\n\n![](img/00002.jpeg)图 3.7 显示了主机如何接收并处理来自仅具有基派生密钥（`BDK`）的终端的加密交易。\n\
  \n图 3.5 显示了主机如何向终端注入唯一的 `IK`。主机加密终端标识符（`TID`）以生成 `IK`，并将其通过电子方式注入终端中。`TID` 对于每个终端都是唯一的；因此，每个\
  \ `IK` 对于每个终端都是唯一的。密钥注入通常在专门为密钥加载设计和管理的密钥注入设施（`KIF`）中进行。`KIF` 具有物理安全、逻辑访问控制和监控功能。一旦终端加载了唯一的\
  \ `TID` 和 `IK`，它们就会被加入库存系统中，并最终发送到指定的位置进行物理安装。\n\n![](img/00033.jpeg)\n\n图 3.5 \
  \ DUKPT IK。\n\n图 3.6 显示了终端如何使用 `IK` 为每笔交易生成 `DKs` 以加密个人密码（`PINs`）。终端使用交易计数器（`TC`）和\
  \ `IK` 仅一次生成第一个 `DK`。随后 `IK` 被销毁，不再留在终端内。如果终端被攻破，终端内仅残留一个未使用的 `DK`。当用户输入 `PIN` 时，使用\
  \ `DK` 加密 `PIN` 以生成加密密码（`EP`）。`EP`、`TC` 和 `TID` 被发送到仅拥有 `BDK` 的主机上。终端递增 `TC` 并使用\
  \ `DK` 生成下一个 `DK`。再次，如果终端被攻破，终端内仅残留一个未使用的 `DK`。每当使用一次 `DK` 时，都会将当前的 `EP`、`TC` 和\
  \ `TID` 发送到主机，并递增 `TC` 以生成下一个 `DK`。\n\n图 3.7 显示了主机如何处理来自仅具有 `BDK` 终端的交易。交易包含 `EP`、`TC`\
  \ 和 `TID`。首先，主机使用 `BDK` 加密 `TID` 以重建终端唯一的 `IK`。其次，主机使用 `IK` 结合 `TC` 循环通过派生算法以确定当前的\
  \ `DK`。第三，主机使用 `DK` 解密 `EP` 并恢复 `PIN`。一旦 `PIN` 被解密，`IK` 和 `DK` 将被擦除，主机仅保留 `BDK`。注意，相同的\
  \ `DK` 可能会在不同的时间被不同的终端无意中生成，但总的来说，每个 `DK` 对于每个终端都是相对唯一的。\n\n这里讨论的 DUKPT 示例用于从终端到主机安全地传输\
  \ `PIN`。\n\n![](img/00034.jpeg)\n\n图 3.6  DUKPT 终端密钥。\n\n![](img/00035.jpeg)\n\n\
  图 3.7  DUKPT 主机密钥。\n\n![](img/00002.jpeg)`PIN` 在输入时由终端进行加密\n\n![](img/00002.jpeg)`EP`\
  \ 从终端传输到主机\n\n![](img/00002.jpeg)`PIN` 由主机解密以进行验证\n\n主机可能会验证 `PIN`，或者可能对 `PIN` 重新加密，以便进一步传输到另一个网络或主机进行验证。然而，DUKPT\
  \ 方法可用于为任何类型的数据或加密函数建立加密密钥，而不仅仅是 `PIN` 加密。这些方法中的任何一种（固定密钥、`MK/SK` 和 DUKPT）都可以用于在通信双方（例如发送者和接收者）之间建立密钥。\n\
  \n## 伪密钥方法 (Faux Key Method)\n\n可以使用其他方法将 `DEKs` 从密钥管理系统交付到数据存储系统（如或其他信息库）。某些密钥交付方法对密钥的保护优于其他方法，而另一些则挑战了基本的密码学行业实践。图\
  \ 3.8 说明了一种名为“伪密钥”的方法，显示左侧的数据库通过安全通道（`TLS`）与右侧的密钥管理器通信。传输安全层（`TLS`将将在第 5 章中讨论。这种方法被称为伪密钥，是因为数据库通过加密和解密用作\
  \ `DEK` 的特殊数据元素来伪造密钥管理器。加密硬件安全模块与软件模块的对比将在第 7 章中讨论。\n\n数据库在启动时执行密钥初始化，使用某种随机数生成方法在系统内存中生成\
  \ `DEK`。数据库使用内存中的明文 `DEK` 对本地数据进行加密和解密。明文密钥通过安全连接（`TLS`）发送到密钥管理器。密钥在功能上并不知道数据加密请求实际上是为了加密密钥，它尽职地加密\
  \ `DEK` 并将其返回给数据库。数据库将加密后的 `DEK` 存储在磁盘上供后续重启。当系统或数据库重启时，数据库将加密的密钥发送到密钥管理器进行解密。再次，密钥管理器不知道数据解密请求是为了加密密钥，它顺从地解密\
  \ `DEK` 并将其返回给数据库。数据库使用内存中的明文 `DEK` 对本地数据进行加密和解密。\n\n![](img/00036.jpeg)\n\n图 3.8\
  \  伪密钥交付。\n\n密钥管理器使用通常称为“主”密钥来加密和解密 `DEK`，通常假设 `MK` 是一个 `KEK`。然而，`DEK` 实际上是一个数据元素，而不是加密密钥；主”密钥实际上是另一个\
  \ `DEK` 而不是 `KEK`。在处理密钥管理控制时，这种区别非常重要，因为加密模块的设计目的是保护密钥，而不是在加密边界之外泄露加密材料。密钥管理生命周期将在第\
  \ 7 章中讨论。伪密钥方法是专有的，且未定义在任何行业标准或规范中。\n\n## PKCS 令牌方法 (PKCS Token Method)\n\n图 3.9\
  \ 显示了另一种名为 PKCS 令牌的密钥交付方法。令牌通过使用 `DK` 加密 `DEK` 创建，其中 `DK` 是使用基于密码的派生函数（`PBKDF`）生成的。底层函数是使用哈希算法（例如\
  \ `SHA-1` 或 `SHA-2`）的 `HMAC`，将在第 2 章中讨论。`HMAC` 根据迭代次数重复多次。初始 HMAC 输入密码和盐（`salt`）。盐是一个非秘密值，通过增加工作量和使\
  \ `DK` 相对唯一来防止彩虹表攻击。随后的每次 `HMAC` 输入上一次的结果，并根据迭代次数复用密码。迭代次数基于处理能力和相对风险。较大的迭代次数增加工作量以降低风险，而较小的迭代次数会增加风险。`PBKDF`\
  \ 在 PKCS#5 [33] 中定义，其建议至少迭代 1000 次，而 NIST 特殊出版 800-132 [39] 对于关键密钥或强大的系统建议超过 1000\
  \ 万次迭代。\n\n图 3.10 显示了 PKCS 令牌方法的密钥交付。密钥管理器使用密码和盐生成 `DK`，并用其加密随机生成的 `DEK` 以创建 PKCS\
  \ 令牌。密码、盐和 PKCS 令牌从密钥管理器发送到数据库并存储在磁盘上。数据库使用密码（和盐）解锁 PKCS 令牌，允许恢复的 `DEK` 安装到内存中用于后续的数据加密解密。然而，在本地存储所有三个组件（密码、盐和\
  \ PKCS 令牌）基本上等同于存储明文 `DEK`，因为访问 `DEK` 需要的所有信息均可用。或者，密钥管理器可以按需提供 PKCS 令牌或密码，这样数据库无需本地存储两者。另一种方案是数据库管理员在数据库启动期间手动输入密码。PKCS\
  \ 令牌在 PKCS#12 [38] 中定义。\n\n\n\n\n\n![](img/00037.jpeg)\n图 3.9 PKCS token PBKDF。\n\
  \n![](img/00038.jpeg)\n图 3.10 PKCS token 交付。\n\n图 3.11 显示了另一种名为 DBEKM 的密钥交付方法。密钥管理器生成两个密钥：一个作为\
  \ `KEK` 的实际 `MK` 以及一个 HMAC 密钥（`HK`）。`HK` 使用 `MK` 加密并发送到数据库。随后擦除 `HK`，因此密钥管理器仅保留\
  \ `MK`。数据库将加密后的 `HK` 存储在磁盘，并生成一个对于数据库相对唯一的标识符（`ID`）。`ID` 同样是无害的，可能指代区域、数据中心、服务器，或特定的数据库卷、文件或列。\n\
  \n图 3.12 显示了 DBEKM 方法的密钥交付。数据库通过安全通信将加密的 `HK` 和明文 `ID` 发送给密钥管理器。密钥管理器使用 `MK` 解密\
  \ `HK`，然后将 `HK` 和 `ID` 作为 `HMAC` 的输入生成一个种子值。种子值返回给数据库，随后擦除 `HK` 和种子值，以便密钥管理器仅保留\
  \ `MK`。数据库将种子值作为输入通过 `KDF`，在系统内存中生成 `DEK`。请注意，密钥管理器并不包含 `KDF`，因此无法生成 `DEK`。密钥管理器没有违反其加密边界，并始终保护密钥。此外，数据库服务器在磁盘上仅存储无害数据，且仅在系统内存中使用密钥。\n\
  \n![](img/00039.jpeg)\n图 3.11 DBEKM 设置。\n\n![](img/00040.jpeg)\n图 3.12 DBEKM 密钥交付。\n\
  \n本节讨论了几种基于对称的密钥建立方案和交付方案，下一节将讨论基于非对称的加密方案。\n\n### 3.2 非对称密钥](#part0003.html#Rsec3_2)\n\
  \n本节讨论了用于建立对称密钥的各种基于非对称的加密方案，而上一节讨论的是用于建立对称密钥的基于对称的加密方案。与基本上是随机或伪随机二进制位字符串的对称密钥不同，非对称密钥使用数学方程构建。此外，非对称密钥总是成对构建，即私钥和公钥。通常情况下，公钥是从私钥派生的，但私钥无法从公钥派生。因此，公钥可以安全地分发供许多人使用，而没有确定私钥的风险。\n\
  \n根据非对称算法的不同，非对称密钥可用于完整性和真实性、数据机密性或密钥管理。\n\n1. 对于数据完整性和真实性，私钥可能用于生成数字签名，相应的公钥可用于验证数字签名。用于数字签名的非对称算法可以是可逆或不可逆的。\n\
  2. 对于数据机密性，公钥可能用于数据加密，相应的私钥可用于数据解密。然而，为了使解密可行，非对称算法必须是可逆的。\n3. 对于密钥管理，公钥可能用于密钥加密，相应的私钥可用于密钥解密。当对称密钥在某处使用公钥加密并在另一处使用私钥解密时，这被称为非对称密钥传输。然而，为了使解密可行，非对称算法必须是可逆的。\n\
  4. 对于密钥管理，公钥和私钥可能与另一组非对称密钥配合使用，通过数学计算出一个共享密钥，然后用其派生出共享对称密钥。当双方交换公钥并使用它们自身的非对称密钥计算共享密钥时，这被称为非对称密钥协商；对称密钥不会在双方之间物理传输。用于密钥建立的非对称算法可以是可逆或不可逆的。\n\
  \n数据完整性和身份认证（A）以及数据机密性（B）的加密方法已在第 2 章中讨论。本节涉及密钥建立，这是密钥传输（C）和密钥协商（D）方法的通术。使用多种非对称加密方案来建立对称密钥，这些密钥转而用于保护数据。图\
  \ 3.13 说明了使用 X9.44 \\[42\\] 中定义的 \\[9\\] Rivest–Shamir–Adleman (`RSA`) 算法进行的密钥传输。发送方（Alice）使用接收方的公钥加密一个\
  \ `SK`，只有接收方（Bob）可以解密。加密后的对称密钥从发送方到接收方的传输在双方之间建立了 `SK`。`RSA` 算法是可逆的，因此密钥可以加密和解密，但不可逆算法不能用于密钥传输。\n\
  \n![](img/00041.jpeg)\n图 3.13 RSA 密钥传输。\n\n密钥传输有多种方案。例如，发送方可能加密随机数并发送给接收方以作为 `SK`。另一个例子是发送方可能加密随机数并发送给接收方以作为\
  \ `MK`。这些方案都是有效的密钥传输方法。\n\n注意，发送方使用的是数字证书而非“裸”公钥。因此，发送方（Alice）使用接收方（Bob）的数字证书，包含了\
  \ Bob 的公钥。数字证书在第 2 章中引入，并在本书的后续章节中进行了详细讨论。参见附录：X.509 证书快速参考。\n\n图 3.14 展示了使用 X9.42\
  \ \\[41\\] 定义 Diffie–Hellman (`DH`) 算法 \\[40\\] 进行的密钥协商。为了使密钥协商在数学上可行，第一步是双方（发送方\
  \ Alice 和接收方 Bob）以数字证书的形式交换公钥。第二步（忽略底层代数原理）是每个伙伴使用其非对称密钥对和对方的公钥计算相同的共享密钥。\n\n![](img/00002.jpeg)\n\
  Alice 使用她的公钥、私钥以及 Bob 的公钥。\n\n![](img/00002.jpeg)\nBob 使用他的公钥、私钥以及 Alice 的公钥。\n\n\
  第三步是每个伙伴使用共同的 `KDF` 从共享密钥派生对称密钥。`KDF` 允许 Alice 和 Bob 从共享密钥派生相同的对称密钥。对称密钥的长度由预期的对称算法及其选项决定，例如高级加密标准\
  \ (`AES`) 支持 128 位、192 位和 256 位密钥，而共享密钥的长度取决于 `DH` 域参数和 `DH` 密钥长度，因此 `KDF` 允许从共享密钥派生密钥大小。\n\
  \n![](img/00042.jpeg)\n图 3.14 DH 或 ECDH 密钥协商。\n\n图 3.14 也代表了 X9.83 \\[43\\] 定义的椭圆曲线\
  \ Diffie–Hellman (`ECDH`) 算法，它是 X9.42 \\[41\\] 中 `DH` 密钥协商机制的椭圆曲线对应物。因此，用于 DH 密钥协商的非对称密钥可能是\
  \ `DH` 密钥或 `ECDH` 密钥，有趣的是，封装公钥的数字证书使用的是完全不同的算法（例如 `RSA` 或 `ECDSA`）签名。\n\n\n\n\n\n\
  使用密钥传输或密钥协商方案建立的会话密钥（SKs）不对称私钥泄露，将会受到威胁。例如，获取了私钥并拥有网络流量记录的攻击者，可以在几小时、几天、几个月甚至几年后重新建立\
  \ SKs 并解密数据。图 3.15 显示了针对这种易感性的加密应对措施，即被称为使用临时密钥（ephemeral keys）的“前向安全性”。\n\n根据定义，临时密钥是短寿命的，与长期静态密钥相反。Alice\
  \ 和 Bob 都拥有一个由私钥和数字证书组成的长期密钥。此外，其中一个（或双方）拥有由私钥和公钥组成的临时密钥。为了本文的讨论，假设双方都拥有临时密钥。临时公密钥不封装在证书中，因为临时密钥的寿命只有几秒或更短。生成临时密钥，交换公密钥，并将临时密钥作为计算共享密钥的第二步的一部分。\n\
  \n![](img/00043.jpeg)\n\n图 3.15 临时密钥协商。\n\n![](img/00002.jpeg)Alice 使用 Bob 的静态和临时公密钥，以及自己的非对称静态临时密钥对计算她的共享密钥。在生成\
  \ SKs 后，Alice 销毁了所有临时密钥。\n\n![](img/00002.jpeg)Bob 使用 Alice 的静态和临时公密钥，以及自己的非对称静态临时密钥对计算他的共享密钥。在生成\
  \ SKs 后，Bob 销毁了所有临时密钥。\n\n一旦临时密钥被删除，攻击者就无法确定 SKs，因为临时私钥已不存在。这假设生成临时密钥的系统在其短暂寿命内没有被破坏。因此，前向安全性得以保留。然而，某些监控系统依赖于访问服务器非对称密钥，而临时密钥干涉了这种访问。图\
  \ 3.16 说明了如何复制服务器静态密钥，以便监控系统能够复制密钥建立过程。可以说，监控系统由于业务和运营的需要是合法的；然而，一些安全传统主义者持不同意见。企业需要分析客户交互，运营需要排排除网络问题。取决于网络架构和网络组件（例如路由器、防火墙、负载均衡器），情况会有所不同。\n\
  \n服务器非对称公私静态密钥通常通过手动过程复制到监控系统。数据分路捕获所有网络流量；每个数据包都会复制，包括密钥建立包和随后的加密数据包。数据包按会话 ID\
  \ 组织并记录到磁盘。监控系统可以访问从客户端发送到服务器的任何证书或公密钥，并在访问服务器静态密钥的情况下，重复密钥建立过程以产生 SKs。随后加密数据包就可以被解密。\n\
  \n然而，有了前向安全性，服务器临时私密钥缺失了。监控系统无法再次完成密钥建立过程，无法再次访问 SKs，因此无法再次解密加密数据包。前向设计的目的是防止服务器私钥泄露时加密数据被记录并解密。讽刺的是，前向安全性也禁用了完全依赖复制服务器密钥来重建密钥的监控系统。\n\
  \n![](img/00044.jpeg)\n\n图 3.16 密钥建立监控。\n\n### 3.3 证书与 PKI\n\n证书和 PKI 在第 2 章 讨论不可否认性时引入。有多种类型的\
  \ PKI 凭证，例如 OpenPGP [44] 消息格式、用于私钥信息的 PKCS#8 [35]，以及用于包括私钥或公钥在内的个人信息交换 PKCS#12 [38]。本书重点关注仅包含公密钥的\
  \ `X.509` 证书。`X.509` 标准 [45,46] 和 [47] 中定义的数字证书包含五个主要部分：\n\n1. 公钥，\n2. 公钥所有者的信息，\n\
  3. 公私密钥对信息，\n4. 颁发机构（CA）的信息，以及\n5. 对前四个组件的 CA 数字签名。\n\n详情请参见附录：`X.509` 证书快速参考。公钥在数学上与其私钥相关，因此数字证书代表了密钥对和密钥所有者的信息。最重要的是，证书签名\
  \ (5) 在公钥 (1) 和所有者信息 (2) 之间提供了加密绑定。这种绑定本质上是 CA 对密钥对属于所有者的证明。此外，CA 签名还加密地将 CA 信息\
  \ (4) 和密钥对信息 (3) 绑定到所有者信息 (2) 和公钥 (1)。图 3.17 将额外的证书细节与常见 PKI 层次结构的证书链相关起来。\n\n与主体相关的信息包括其主名称、公钥和相关算法标识、密钥用途指示以及任何主体备用名称\
  \ (`SANs`)）。密钥用途可能是主体在提交给注册机构 (`RA`) 的证书签名请求 (`CSR`) 中显式请求，或者根据主体选择的 `RA` 隐式。任何备用名称都可以在\
  \ `CSR` 中显式请求，或通过带外通道提供给 `RA`。\n\n![](img/00045.jpeg)\n\n图 3.17 证书与 PKI。\n\n与颁发者相关的信息包括其名称、其证书策略和实践，以及证书状态可用性，例如证书吊销列表\
  \ (`CRL`) 位置或在线证书状态协议 (`OCSP`) 响应器。\n\n由颁发者提供的信息包括主体的公钥有效期和证书上的 CA 签名。证书的有效期基于 CA\
  \ 策略和证书实践声明。证书签名由 CA 使用其安全的私钥生成，并使用 CA 的公钥进行验证。CA 公钥封装在颁发 CA 证书中。每个证书的签名都使用证书链中下一个证书的公钥进行验证。\n\
  \n![](img/00002.jpeg)主体证书的签名使用颁发 CA 证书进行验证。\n\n![](img/00002.jpeg)颁发 CA 证书的签名使用从属\
  \ CA 证书进行验证。\n\n![](img/00002.jpeg)从 CA 证书的签名使用根 CA 证书进行验证。\n\n![](img/00002.jpeg)根\
  \ CA 证书的签名使用自身的公钥进行验证。\n\n\n\n\n\n证书验证是一个复杂的过程，涉及对多个证书的多个 `X.509` 数据字段进行验证。第一步是确定从端用户证书到根\
  \ CA 证书的完整证书链，如果缺少任何证书，验证将失败并停止处理。否则，对每个证书检查以下各项内容：\n\n1. 验证证书名称\n2. 验证证书的有效期期限\n\
  3. 验证算法和密钥用途\n4. 验证证书签名\n5. 验证证书状态\n6. 验证关键扩展项\n\n如果任何证书的任何某一项验证失败，则验证将失败并停止处理。否则，只有当所有证书的所有项目都通过验证时，才能根据密钥用途声明使用该主体公钥。然而，除了证书验证之外，依赖应用程序可能还有额外的限制。例如，根据白名单，可能需要特定的端用户证书或\
  \ CA 证书。另一个例子是，处理可能需要特定的 `X.509` 扩展。如果缺失或无效任何所需的证书信息，应用程序可能也会停止处理。验证细节讨论如下。\n\n\
  ### 1. 验证证书名称。\n\n- 主体证书名称与主体名称匹配。\n- 发行者 CA 证书名称与发行者 CA 名称匹配。\n- 中间 CA 证书名称与中间\
  \ CA 名称匹配。\n- 根 CA 证书与根（信任锚点）CA 名称匹配。\n\n如果名称不匹配，验证将失败。例如，浏览器以因统一资源定位符与服务器通用名称不匹配时的名称不匹配错误而闻名，但许多浏览器仍允许用户接受无效证书。例如，用户可能输入\
  \ [www.one.example.com](http://www.one.example.com)，但证书主体名称可能不同，例如 [www.example.com](http://www.example.com)\
  \ 或其他名称。\n\n然而，证书有两个身份字段：基础 `Subject` 字段和 `SAN` 扩展。`SAN` 可能会包含其他身份，如 [www.one.example.com](http://www.one.example.com)\
  \ 和 [www.two.example.com](http://www.two.example.com)，因此任何匹配均视为通过名称验证。但是，链中任何证书的任何单一名称不匹配都会导致证书验证失败。\n\
  \n### 2. 验证证书的有效期期限。\n\n如果当前日期和时间不在证书的 `not-before` 和 `not-after` 时间范围内，则该证书是无效的。每个证书的有效期必须是合法的，否则链将通过证书验证。过期的证书不应被使用，因为其有效期是风险的，将公钥与私钥的加密周期相关联。\n\
  \n### 3. 验证密钥用途。\n\n如果提供的证书与预期的加密功能不兼容，则不应误用公钥。例如，密钥管理密钥不应用于数字签名，`DEKs` 不应用于密钥管理，数字签名密钥不应用于数据加密或密钥管理。\n\
  \n密钥用途定义在两个扩展中：`key usage`（密钥用途）和 `extended key usage`（扩展密钥用途）。前者指示加密功能，如数字签名、密钥传输或密钥协商或数据加密。后者识别应用程序用途，如服务器身份验证、客户端身份验证或代码签名。第一个扩展是完全定义的位图，因此没有空间留给其他指标。第二个扩展使用对象标识符（`OIDs`），因此具有无限的可扩展性。\n\
  \n### 4. 验证证书签名。\n\n每个证书的签名都使用证书链中下一个证书的公钥进行验证。主体证书使用发行者 CA 证书验证，发行者 CA 证书使用下一层\
  \ CA 证书（如中间 CA 证书）验证，最后的中间 CA 证书使用根 CA 证书验证。根 CA 证书是自签名的并用于验证自身；但它预安装在信任存储中。\n\n\
  任何验证失败的证书签名都会导致证书链无效，从而主体证书无法使用。失败可能是由于构建链错误，或者其中一个证书被篡改。无论如何，无效的链意味着主体证书无效。\n\n\
  ### 5. 验证证书状态。\n\n主体证书应包含指向状态服务的访问信息。`CRL Distribution Points`（CRL 分发点）扩展引用 `CRL`。或者，`Authority\
  \ Information Access`（授权信息访问）扩展可能提供 `OCSP` 响应器的位置。然而，`CRL` 下载可能会失败，`OCSP` 可能没有，或者\
  \ `CRL` 或 `OCSP` 签名可能无效。\n\n如果无法验证证书状态，则必须在承担适当风险的情况下假设其有效，或者拒绝主体证书。根据业务风险和应用程序环境，需要评估相对风险。例如，如果某个某一点无法验证主体证书状态，可能会在稍后时间进行验证。但如果是针对实时交易的验证，那么其状态就是至关重要的。\n\
  \n### 6. 验证关键扩展项。\n\n`X.509` 扩展使用 `OIDs` 标记，并标记为关键或非关键。如果任何扩展被标记为关键但验证过程无法识别该 `OID`，则证书验证失败且主体证书无效。标记为非关键的扩展如果无法识别则可以忽略，否则应该被处理。\n\
  \n除了证书验证外，数字签名指南（`DSG`）[14] 和 PKI 保证指南（`PAG`）[15] 承认为了实现真正的不可否认服务，需要建立操作和法律控制。操作控制由每个\
  \ PKI 参与者（主体、`RA`、`CA`、依赖方）根据约定的规则集执行以建立信任。\n\n\n\n\n域名系统（DNS）是一组分布式数据库，包含了各种各种类型的资源记录（RRs），用于管理互联网域名名。基本上，DNS\
  \ 将诸如 [www.example.com](http://www.example.com) 这样的域名翻译为网协议（IP）地址（`198.51.100.0`）。DNS\
  \ 还提供反向查询；即将 IP 地址翻译为对应的域名名。最右侧的名称（例如 `.com`）被称为顶级域名（TLD）名称。其他顶级域名还包括用于商业实体的 `.com`、主要用于非营利组织的\
  \ `.org`、用于高等教育机构的 `.edu`、用于美国政府机构的 `.gov`、用于美国军方的 `.mil`，以及基于 ISO 3166-1 的两位国家代码\
  \ [48]\\]，例如代表澳大利亚的 `.au`、日本的 `.jp`、俄罗斯联邦的 `.ru` 以及美国的 `.us`。ISO 还提供了一个在线浏览平台^(\\\
  *)。\n\n![](img/00046.jpeg)\n\n图 4.1 DNS 示例。\n\n二级域名（例如 [www.example.com](http://www.example.com)）通过点号与顶级域名分隔，无限数量的低层级（例如三级、四级）同样通过点号分隔。前缀\
  \ `www` 表示万维网服务器，而 `ftp` 是文件传输协议服务器，`mail` 用于邮件服务器。互联网名称与数字分配机构（IANA）^† 管理顶级域名和许多其他唯一标识符。图\
  \ 4.1 给出了两个简单的 DNS 示例：一次成功查询和一次失败。对于第一个示例，服务器 `Bob` 使用名称 [www.example.com](http://www.example.com)\
  \ 连接到服务器 `Alice`。`Bob` 将该名称提交给 DNS 服务器，该服务器可能会与其它 DNS 服务通信，然后将翻译后的 IPv4 地址 `198.51.100.0`\
  \ 返回给 `Bob`，允许其连接到 `Alice`。对于第二个示例，`Bob` 获取名称 [bob.net](http://bob.net) 时报错，因此由于没有\
  \ IP 地址，连接失败。\n\n然而，如果任何 DNS 资源记录是伪造的，`Alice` 可能会连接到错误的服务器（而不是 `Bob`），但无法察觉这种不诚实的连接。存在三种基本的\
  \ DNS 协议攻击 [50]。DNS 缓存投毒是将错误的记录信息注入到 DNS 服务器中。DNS 欺骗是非法服务器拦截有效的 DNS 请求并返回无效的 DNS\
  \ 响应。DNS ID 破解是非法服务器伪装成合法的 DNS 服务器并提供不准确的资源记录。域名系统安全扩展（DNSSEC）是一种旨在缓解此类 DNS 攻击的认证方案。\n\
  \n图 4.2 提供了 DNSSEC 密码学的概述。DNSSEC 使用公钥加密对资源记录进行签名和认证，但并不使用公钥基础设施（PKI）或数字证书。数字签名请参见\
  \ 第 2 章，数字证书和 PKI 考虑请参见 第 3 章。相反，公钥存储在 `DNSKEY` 资源记录中，相应的私钥由权威 DNS 签名者存储。数字签名存储在\
  \ `RRSIG` 资源记录中。`DNSKEY` 资源记录的摘要（哈希）存储在 `DS` 资源记录中。此外，DNSSEC 不提供机密性。\n\n![](img/00047.jpeg)\n\
  \n图 4.2 DNSSEC 密码学。\n\n域名密钥（`DNSKEY`）资源记录包含所有者名称、算法标识符和公钥值。公钥采用 Base64 编码。RFC 4034\
  \ [49]\\] 要求使用带有安全哈希算法（`SHA-1`）哈希的里斯特-沙米尔-阿德曼（`RSA`）数字签名，并包含带有 `SHA-1` 的数字签名算法（`DSA`），但不再推荐消息摘要\
  \ 5（`MD5`）哈希。\n\n\n\nAlice 向 Bob 发送了一封邮件。签名者在邮件中添加了 `DKIM` 头部，该头部包含数字签名、对 `DNS RR`\
  \ 的引用、哪些消息元素已哈希处理用于签名列表，以及其他相关的 `DKIM` 信息。在这个示例中，`Header 2` 和 `Body` 文本被哈希处理用于签名；因此\
  \ `Header 1` 和 `Header 3` 未被签名。`DNS` 记录包含了签名者的 `Public Key`（公钥），验证者可以使用该 `Public\
  \ Key` 来验证 `DKIM` 头部中的数字签名。签名者使用相应的私钥生成数字签名。\n\n一种常见的 `DKIM` 实现方式是让签名者和验证者都是同一个组织的邮件系统。Alice\
  \ 从她的工作站发送邮件，她的组织邮件系统对消息进行签名。Bob 的组织邮件系统验证签名并将 Alice 的消息投送给 Bob 的工作站。Alice 和 Bob\
  \ 都不需要加密密钥。Alice 的组织邮件系统管理一个私钥并在 `DNS RR` 中提供相应的 `Public Key`。Bob 的组织邮件系统不管理加密密钥，而是从\
  \ `DKIM` 头部中引用的 `DNS` 记录获取 Alice 的 `Public Key`。\n\n![](img/00049.jpeg)\n\n图 4.4\
  \ DKIM 加密架构。\n\n### 4.3 安全断言标记语言 (SAML)\n\n安全断言标记语言 (`SAML`) 是由结构化信息标准促进组织 (`OASIS`)\
  \ 安全服务技术委员会开发的身份验证和授权方案。该方案还支持机密性。`SAML` 是一种基于扩展标记语言 (`XML`) 的框架，用于通信身份验证、权限和和属性信息。[图\
  \ 4.5] 提供了 `SAML` 的高级概述。`SAML` 框架内有许多逻辑实体，但为了本书的需要，只介绍了三种：`SAML` 用户、启用 `SAML` 的服务提供者\
  \ (`SP`) 以及 `SAML` 身份提供者 (`IdP`)。`SAML` 框架支持许多可以通过消息路径描述的场景。\n\n其中一种场景是用户简单访问启用\
  \ `SAML` 的 `SP`，其中 `SP` 从 `IdP` 获取 `SAML` 令牌，`path = (1, 2, 2, 1)`。\n\n路径 (1) 用户请求访问启用\
  \ `SAML` 的 `SP`。访问请求通常包含用户的身份（例如，`name`）和身份凭据（例如，`password`、数字签名、移动设备信息）。\n\n路径\
  \ (2) `SP` 向 `SAML` `IdP` 发送一个 `SAML` 请求。`SAML` 请求包含用户身份和身份验证请求。\n\n路径 (2) `SAML`\
  \ `IdP` 向 `SP` 返回一个 `SAML` 响应（也称为 `SAML` 令牌）。`SAML` 响应包含用户身份验证通过信息和授权属性。\n\n路径 (1)\
  \ `SP` 根据 `SAML` 令牌中的身份验证通过信息和授权属性允许（或拒绝）用户访问。\n\n类似的场景是用户访问启用 `SAML` 的 `SP`，其中\
  \ `SP` 将用户重定向到 `IdP` 以获取 `SAML` 令牌，`path = (1, 2, 2, 1)`。\n\n路径 (1) 用户请求访问启用 `SAML`\
  \ 的 `SP`。访问请求通常包含用户的身份（例如，`name`）和身份凭据（例如，`password`、数字签名、移动设备信息）。\n\n路径 (2) `SP`\
  \ 向 `SAML` `IdP` 发送一个 `SAML` 请求。`SAML` 请求包含用户身份和身份验证请求。\n\n路径 (2) `SAML` `IdP` 向\
  \ `SP` 返回一个 `SAML` 响应（也称为 `SAML` 令牌）。`SAML` 响应包含用户身份验证通过信息和授权属性。\n\n路径 (1) `SP`\
  \ 根据 `SAML` 令牌中的身份验证通过信息和授权属性允许（或拒绝）用户访问。\n\n路径 (1) 用户请求访问启用 `SAML` 的 `SP`。访问请求通常包含用户的身份（例如，`name`）和身份凭据（例如，`password`、数字签名、移动设备信息）。\n\
  \n路径 (2) `SP` 向 `SAML` `IdP` 发送一个 `SAML` 请求。`SAML` 请求包含用户身份和身份验证请求。\n\n路径 (2) `SAML`\
  \ `IdP` 向 `SP` 返回一个 `SAML` 响应（也称为 `SAML` 令牌）。`SAML` 响应包含用户身份验证通过信息和授权属性。\n\n路径 (1)\
  \ `SP` 根据 `SAML` 令牌中的身份验证通过信息和授权属性允许（或拒绝）用户访问。\n\n类似的场景是用户访问启用 `SAML` 的 `SP`，其中\
  \ `SP` 将用户重定向到 `IdP` 以获取 `SAML` 令牌，`path = (1, 2, 1)`。\n\n![](img/0050.jpeg)\n\n\
  图 4.5 SAML 概述。\n\n路径 (1) 用户请求访问启用 `SAML` 的 `SP`。访问请求通常包含用户的身份（例如，`name`）和身份凭据（例如，`password`、数字签名、移动设备信息）。\n\
  \n路径 (2) `SP` 向 `SAML` `IdP` 发送一个 `SAML` 请求。`SAML` 请求包含用户身份和身份验证请求。\n\n路径 (2) `SAML`\
  \ `IdP` 向 `SP` 返回一个 `SAML` 响应（也称为 `SAML` 令牌）。`SAML` 响应包含用户身份验证通过信息和授权属性。\n\n路径 (1)\
  \ `SP` 根据 `SAML` 令牌中的身份验证通过信息和授权属性允许（或拒绝）用户访问。\n\n路径 (1) 用户请求访问启用 `SAML` 的 `SP`。访问请求通常包含用户的身份（例如，`name`）和身份凭据（例如，`password`、数字签名、移动设备信息）。\n\
  \n路径 (2) `SP` 向 `SAML` `IdP` 发送一个 `SAML` 请求。`SAML` 请求包含用户身份和身份验证请求。\n\n路径 (2) `SAML`\
  \ `IdP` 向 `SP` 返回一个 `SAML` 响应（也称为 `SAML` 令牌）。`SAML` 响应包含用户身份验证通过信息和授权属性。\n\n路径 (1)\
  \ `SP` 根据 `SAML` 令牌中的身份验证通过信息和授权属性允许（或拒绝）用户访问。\n\n另一种场景是用户访问启用 `SAML` 的 `SP`，其中\
  \ `SP` 将用户重定向到 `IdP` 以获取 `SAML` 令牌，`path = (2a, 2b, 1)`。\n\n路径 (1) 用户请求访问启用 `SAML`\
  \ 的 `SP`。访问请求通常包含用户的身份（例如，`name`）和身份凭据（例如，`password`、数字签名、移动设备信息）。\n\n路径 (2a) `SP`\
  \ 向 `SAML` `IdP` 发送一个 `SAML` 请求。`SAML` 请求包含用户身份和身份验证请求。\n\n路径 (2b) `SAML` `IdP`\
  \ 向 `SP` 返回一个 `SAML` 响应（也称为 `SAML` 令牌）。`SAML` 响应包含用户身份验证通过信息和授权属性。\n\n路径 (1) `SP`\
  \ 根据 `SAML` 令牌中的身份验证通过信息和授权属性允许（或拒绝）用户访问。\n\n对于最后一种场景，`SP` 和 `IdP` 可能是签发 `SAML`\
  \ 令牌的同一个组织。每个 `SAML` 令牌都有生存时间 (`TTL`)，使得过期的令牌无效。因此，用户需要定期刷新其 `SAML` 令牌。\n\n还有许多其他可能的路径对应于\
  \ `SAML` 请求-响应消息交换，这些路径被称为 `SAML` 绑定（或简称 `bindings`），例如简单对象访问协议 (`Simple Object\
  \ Access Protocol`) 和超文本传输协议 (`HTTP`)。无论如何，`SAML` 消息预计将在安全套接层 (`SSL`) 或传输层安全协议 (`TLS`)\
  \ 上进行交换。\n\n\n\n\n任何 SAML 消息都可能包含使用 `Encrypted ID` 选项加密的数据。同样，认证断言或授权属性也可能使用 `Encrypted\
  \ Assertion` 或 `Encrypted Attribute` 选项加密。所有三个加密选项都包含 `Encrypted Data` 和 `Encrypted\
  \ Key` 字段。SAML `Encrypted Key` 字段并没有定义自己的密钥管理方案，而是使用 XML 加密方案 [54]。XML 加密方案包含一个用于定义加密算法的\
  \ `Encryption Method` 字段、一个用于定义密钥建立方法的 `Key Info` 字段以及一个 `Cipher Data` 字段。根据密钥建立方法，发送者和接收者将拥有额外的密钥（参见图\
  \ 4.8）。\n\n例如，图 4.8 中的 SAML 消息包含一个 `Encrypted ID`，其 `XML Key Info` 字段使用了基于 Diffie–Hellman\
  \ (DH) 密钥建立方案的 `Encrypted Key`。除了 SSL 私钥外，SAML 服务器 (SS) 还拥有另一个带有私钥的证书以及 RP 证书副本。同样，除了\
  \ SSL 证书外，RP 也拥有另一个带有私钥的证书以及 SS 证书副本。SAML 服务器使用这两个 DH 证书和其 DH 私钥来计算共享密钥，并为 `Encrypted\
  \ Data` 派生对称密钥。同样，RP 使用这两个 DH 证书和其 DH 私钥计算相同的共享密钥，并为 `Encrypted Data` 派生相同的对称密钥。\n\
  \n![](img/00052.jpeg)\n\n图 4.7  SAML 机密性。\n\n![](img/00053.jpeg)\n\n图 4.8  SAML\
  \ 加密架构。\n\n### 4.4 开放授权 (OAUTH)\n\n开放授权^(\\*) (OAUTH) 是一种用于为 Web、移动和桌面应用程序启用授权（而不一定是认证）的开放标准。更具体地说，OAuth\
  \ 2.0 授权框架^† 允许第三方应用程序获取对 HTTP 服务的有限访问权限。OAUTH 不应与开放认证倡议^‡ (OATH) 框架混淆。图 4.9 显示了基本的\
  \ OAUTH 协议 [55]，它包含了服务器（客户端、服务、授权和所有者）和消息（授权请求、授权许可、访问令牌、受保护资源）。\n\n![](img/00054.jpeg)\n\
  \n图 4.9  OAUTH 加密架构。\n\n消息流由 OAUTH 客户端与 OAUTH 所有者之间的 (a) 授权请求和 (b) 授权响应消息启动。OAUTH\
  \ 所有者授予（或拒绝）客户端访问请求服务的权限。如果获得授权，消息流通过 OAUTH 客户端与 OAUTH 授权 (OA) 服务之间的 (c) 授权许可和 (d)\
  \ 访问令牌消息继续。OA 服务（其可能与 OAUTH 所有者是同一实体）提供访问令牌。消息流通过 OAUTH 客户端与 OAUTH 服务 (OS) 之间的 (e)\
  \ 访问令牌和 (f) 受保护资源消息完成。访问令牌允许 OAUTH 客户端获取 OS 的资源。\n\nOAUTH 预计运行在最新的 TLS 之上。因此，每个服务器都将向\
  \ OATH 客户端提供其公钥证书并管理其对应的私钥。OAUTH 所有者 (OO) 服务器将其证书发送给 OAUTH 客户端以建立第一个 TLS 会话，OA 服务器将其证书发送给\
  \ OAUTH 客户端以建立独立的 TLS 会话，而 OS 将其证书发送给 OAUTH 客户端以建立另一个 TLS 会话。因此，OAUTH 客户端可能拥有多种证书。\n\
  \n### 4.5 密码与 PIN 验证\n\n知识认证是“你所知道的”的方法，包括密码和识别码 (PIN)。密码与 PIN 的传输方法非常不同，密码和 PIN\
  \ 在传输过程中是加密的（参见第 5 章](#part0010.html#ch05)），而图 4.10 显示了密码哈验证。\n\n密码验证基本上是将输入的密码与存储的密码进行匹配。输入的密码安全地传输（参见第\
  \ 5 章](#part0010.html#ch05)）从用户端到密码验证过程。密码验证过程从可能包含数百、数千或百万密码的用户数据库中获取存储的密码。因此，验证过程需要一个用户标识符来定位正确的用户配置。密码也以安全方式存储。可能，存储的密码与传输的密码格式不同；验证过程需要将格式转换为通用格式以便比较这两个密码。比较结果（匹配或不匹配）提供给应用服务。应用服务做出授予或拒绝访问的最终决定，因为它可能在使用密码验证之外还使用了其他认证方法，例如挑战答题。\n\
  \n![](img/00055.jpeg)\n\n图 4.10  密码与 PIN 验证。\n\n密码存储方法极少保留明文；对用户数据库的未经授权访问将导致所有密码泄漏。此外，拥有访问权限的管理员可能被强制披露密码，因此完全避免存储密码更好。存储的密码可以使用加密密钥加密，但由于密码验证通常使用软件执行，保护密钥是个问题。因此，大多数密码存储使用哈希算法。然而，如所述，哈希算法容易受到字典攻击，通常称为彩虹表。所有可能的密码都可以进行哈希处理，使得能够访问用户数据库的攻击者只需在彩虹表中查找哈希即可确定密码。密码哈希使用两种额外机制来防御字典攻击：密码盐和迭代次数\
  \ [39]。如图 4.11 所示，密码加盐在哈希处理之前向密码添加一个随机值，使得生成的哈希值因盐的添加而改变。盐并不是为了保密；秘密盐类比地称为加调 (peppering)。相反，盐增加了创建彩虹表的工作量。考虑一个允许大小写字母、数字和特殊字符的\
  \ 8 字符密码的工作量。\n\n![](img/00056.jpeg)\n\n图 4.11  密码验证。\n\n![](img/00002.jpeg)\n\n\
  密码字母表：26 小写 + 26 大写 + 10 个数字 + 8 特殊字符 = 70 种可能字符\n\n![](img/00002.jpeg)\n\n可能的 8\
  \ 字符密码：70⁸ 或约 576 万亿种可能的密码\n\n\n\n\n因此，一个针对无盐（或无胡椒）且经过一次迭代的彩虹表将包含五千亿条目。但是，现代计算机对现代哈希算法（例如\
  \ `SHA-512`）的处理速度达到每秒百万次或以上，因此使用一千台计算机进行的 57.6 万亿次哈希计算可以在两个月左右完成。考虑到云计算的可用性，这种攻击是可行的，且成本是现实。为每个密码添加随机盐会使每个密码的工作因子倍增，因此一个拥有一千个密码的用户端数据库将使总工作量从两个月增加到\
  \ 166 年。当然，增加计算机计算能力可以缩短时间因素，但攻击者并不对破解所有密码感兴趣，只需要管理员的密码。因此，如果攻击者知道哪个终端用户配置是管理员，工作因子在实践上就减少到了单个密码。\n\
  \n密码迭代次数是指用于存储时对密码（及盐）应用哈希函数的次数。迭代次数仅仅会增加工作因子，但可能会延迟密码验证，影响终端用户的体验。NIST 建议至少迭代一千次，但对于性能更强的服务器，在计算基于密码的密钥衍生函数时，1000\
  \ 万次的迭代可能是合适的 [39]。无论盐和迭代次数如何，密码验证过程都需要获取传输的明文密码以进行哈希处理，以便以便其与存储的哈希密码进行比较。\n\n支付卡的\
  \ PIN 验证与密码验证非常不同。PIN 是 ISO 9564 中定义的 4 到 12 位数字 [56]，并与卡片的主账户号码 (PAN) 关联。PAN 是\
  \ ISO/IEC 7812 中定义的 12 到 19 位数字 [57]。与密码不同，PIN 可能是银行颁发的，也可能是客户选择的。银行生成的 PIN 可能直接派自\
  \ PAN 或随机数，类似于客户选择的 PIN。\n\n如图 4.12 所示，IBM 3624 PIN 验证^(\\*) 基于 PIN 偏移量 (oPIN)。oPIN\
  \ 是通过从中间 PIN 值 (iPIN) 中去客户选择的 PIN 生成的。iPIN 是通过 PIN 验证密钥 (3K-3DES) 加密验证数据 (vData)，然后使用十进制表替换密文字符生成的。oPIN\
  \ 存储在终端用户数据库中。通过将 oPIN 加到 iPIN 上恢复 PIN，然后将其与客户输入的 PIN 进行比较。如果客户输入的 PIN 与恢复的 PIN\
  \ 匹配，则用户通过身份验证。\n\nIBM 的 oPIN 方法允许在不更改 PAN 的情况下更改 PIN。其他 PIN 验证方法使用 `DES` 或三重 DES\
  \ (`3DES`) 密钥从 PAN 派生 PIN，但更改 PIN 需要更改 PAN。从密码体系的角度来看，密码验证方案通常使用无密钥哈希；然而，PIN 验证方法使用\
  \ `DES` 或 `3DES` 加密密钥。使用 `AES` 的新型 PIN 验证方案正在开发中；草案 X9.132 [58]。\n\n![](img/00057.jpeg)\n\
  \n图 4.12 IBM 3624 PIN 验证。\n\n### 4.6 一次密码 (OTP)\n\n一次性密码 (OTP) 是短寿命的身份验证凭，不应与加密方法的一次性扇\
  \ (OTP) 混淆。加密 OTP 是一种密钥管理方法，为每条消息使用不同的加密密钥。认证 OTP 使用具有有限 TTL（生存时间）的密码，用时钟图标表示。图\
  \ 4.13 展示了 OTP 架构。\n\n\n\n![](img/00002.jpeg)SSL v3.0 于 1996 年 11 月发布，并于后期 2011\
  \ 年 8 月作为历史性请求意见文档（`RFC 6101`）\\[60\\]编码。\n\n![](img/00002.jpeg)基于 SSL v3.0 的 TLS\
  \ v1.0 于 1999 年 1 月发布为 `RFC 2246` \\[61\\]。\n\n![](img/00002.jpeg)TLS v1.1 于 2006\
  \ 年 4 月发布为 `RFC 4346` \\[62\\]。\n\n![](img/00002.jpeg)TLS v1.2 于 2008 年 8 月发布为 `RFC\
  \ 5246` \\[63\\]。\n\n![](img/00002.jpeg)TLS v1.3 自 2014 年 4 月起一直在开发中。\n\n各种 TLS\
  \ v1.3 草草案对 v1.2 进行了协议更改，包括强制使用临时密钥（ephemeral keys）以实现后安全性，并废弃了里斯特-沙米尔-阿德曼（`RSA`），因为它不支持临时密钥。临时密钥在第\
  \ 3 章中被讨论过。TLS v1.2 由两个层组成：TLS 握手协议和 TLS 记录协议。TLS 握手交换静态的 X.509 \\[45\\]证书以建立一个共享密钥，并在此推导出两个密钥：加密密钥和哈希消息认证码（`HMAC`）密钥。图\
  \ 5.1 显示了传输层安全协议（TLS）客户端与 TLS 服务器之间的一条虚线，代表传输密钥。会话密钥（`SKs`）（加密和 HMAC）可能通过密钥传输（例如，`RSA`）或密钥协商（例如，Diffie–Hellman\
  \ [`DH\\]）建立；而密钥协商可能会使用临时密钥来实现后安全性。\n\n一旦 TLS 握手协议建立了 `SKs`，TLS 记录协议就会加密 SSL 客户端与\
  \ SSL 服务器之间的每条消息。TLS 密文记录显示了四种元素：内容类型（Content Type）、协议版本（Protocol Version）、长度字段（Length\
  \ field）和通用加密字段（Generic Cipher field）。通用加密字段包括明文数据的 HMAC 和加密数据。通用加密三种加密选项：流密码加密、块密码加密以及带附加数据的认证加密（AEAD）。TLS\
  \ 握手协议协商密码套，该密码套定义了用于 `SK` 的密钥建立方案、加密选项、加密算法以及用于 HMAC 的哈希算法。从加密架构的角度来看，TLS 协议具有以下密钥：\n\
  \n![](img/00002.jpeg)TLS 客户端拥有其公钥和私钥传输密钥、SSL 服务器 X.509 证书以及两个派生的 `SKs`：加密密钥和 HMAC\
  \ 密钥。\n\n![](img/00002.jpeg)TLS 服务器拥有其公钥和私钥传输密钥、SSL 客户端 X.509 证书以及两个派生的 `SKs`：加密密钥和\
  \ HMAC 密钥。\n\n![](img/00059.jpeg)\n\n图 5.1   TLS 加密架构。\n\n某些密钥建立方案（如 `RSA` 密钥传输）不需要客户端传输密钥，只需要服务器传输密钥。TLS\
  \ 客户端使用 TLS 服务器密钥加密随机数，双方使用这些密钥来派生 `SKs`。如果使用了临时密钥，那么除了静态 TLS 客户端和主机传输密钥外，一个或两个实体将拥有另一对异步密钥，并与另一个实体共享公钥（`PK`）。由于密钥对生命周期很短（通常为几毫秒），临时\
  \ `PKs` 不封装在 X.509 证书中。然而，如所述，`RSA` 不支持临时密钥。\n\n### 5.2 Internet Protocol Security\
  \ (IPsec)\n\n网协议安全（IPsec） \\[64\\] 是一种用于互联网协议（IPv4 和 IPv5）数据包的加密和认证协议。IPsec 提供了两个独立的安全机制：封装安全载荷（`ESP`）。TLS\
  \ 握手协议协商密码套，该密码套定义了用于 `SK` 的密钥建立方案、加密选项、加密算法以及用于 HMAC 的哈希算法。\n\n\n\n\n![](img/00002.jpeg)对于\
  \ SSH 传输，SSH 客户端拥有其 DH 公钥和私钥、SSH 主机 PK（最好封装在 X.509 证书中），以及两个派生的 SK：加密密钥和 HMAC 密钥。\n\
  \n![](img/00002.jpeg)对于 SSH 身份认证，SSH 客户端可能还拥有其数字签名（例如 RSA）私钥。\n\n![](img/00002.jpeg)对于\
  \ SSH 传输，SSH 主机拥有其 DH 公钥和私钥、SSH 客户端 PK（最好封装在 X.509 证书中），以及两个派生的 SK：加密密钥和 HMAC 密钥。\n\
  \n![](img/00002.jpeg)对于 SSH 身份认证，SSH 主机可能还拥有客户端的数字签名 PK（最好封装在 X.509 证书中）。\n\n如果使用了临时密钥（ephemeral\
  \ keys），除了静态的 SSH 客户端和主机的 DH 公私钥外，一个或两个实体将另一对 DH 密钥并与另一个实体共享 PK。由于密钥对生命周期很短（通常只有几毫秒），临时\
  \ PK 不封装在 X.509 证书中。\n\n不支持临时密钥的 RSA 密钥传输在同年晚些时候被添加到 SSH RFC 4432 [71]。对于 RSA 密钥传输，只有\
  \ SSH 主机需要密钥对。SSH 客户端使用 SSH 主机 PK 加密随机数，SSH 主机解密该随机数，双方派生 SK（加密和 HMAC）。除了 SSH 主机外，SSH\
  \ 客户端可能还有自己的 RSA 密钥对来数字签名挑战，以便 SSH 主机认证 SSH 客户端。\n\n![](img/00063.jpeg)\n\n图 5.5\
  \ SSH 加密架构。\n\n### 5.4 良好的隐私保护 (OpenPGP)\n\nOpenPGP [72] 是一种基于 Pretty Good Privacy®\
  \ (PGP) 的标准安全协议，由 Philip R. Zimmermann^(\\*) 于 1991 年开发。PGP® 是一组提供加密、数字签名和密钥管理的软件功能。OpenPGP\
  \ 消息由由数字标识的各种包组成。图 5.6 提供了两个从 Alice 发给 Bob 和 Chuck 的消息示例，其中一个使用非对称密钥加密，另一个使用对称密钥加密。两条消息都使用对称数据加密保证机密性，并使用哈希保证数据完整性。\n\
  \n从密码学的角度来看，每个参与者都有一个包含其公私钥以及其他人 PK 的密钥环。任何对称密钥都封装在消息内部，而不是参与者的密钥环中。\n\n![](img/00002.jpeg)Alice\
  \ 的密钥环：包含她的公私钥、Bob 的 PK 和 Chuck 的 PK。\n\n![](img/00002.jpeg)Bob 的密钥环：包含他的公私钥、Alice\
  \ 的 PK 和 Chuck 的 PK。\n\n![](img/00002.jpeg)Chuck 的密钥环：包含他的公私钥、Alice 的 PK 和 Bob 的\
  \ PK。\n\n![](img/00064.jpeg)\n\n图 5.6 OpenPGP 加密架构。\n\n第一条消息（左侧）由四个包组成：两个 Tag 1\
  \ 包、一个 Tag 9 包和一个 Tag 19 包。两个 Tag 1 包是公钥加密的会话密钥包。这些包包含使用接收者 PK 加密的 SK。单个 Tag 9 包是对称密钥加密的会话密钥包。该包包含使用对称\
  \ SK 加密的数据。最后的 Tag 19 包是篡改检测码包，包含数据的哈希值。\n\n![](img/00002.jpeg)Bob 仅可以使用其私钥解密其中一个\
  \ Tag 1 包，得到用于解密 Tag 9 包的 SK，从而得到数据。Bob 使用 Tag 19 包来验证解密数据的完整性。\n\n![](img/00002.jpeg)Chuck\
  \ 仅可以使用其私钥解密另一个 Tag 1 包，得到用于解密 Tag 9 包的 SK，从而得到数据。Chuck 使用 Tag 19 包来验证解密数据的完整性。\n\
  \n第二条消息（右侧）同样由四个包组成：两个 Tag 1 包、一个 Tag 9 包和一个 Tag 19 包。两个 Tag 1 包是公钥加密的会话密钥包。这些包包含使用接收者\
  \ PK 加密的 SK。单个 Tag 9 包是对称密钥加密的会话密钥包。该包包含使用对称 SK 加密的数据。最后的 Tag 19 包是篡改检测码包，包含数据的哈希值。\n\
  \n### 5.5 密码与个人识别码\n\n知识因素认证是“你所知道”的方法，包括密码和个人识别码（PIN）。传输密码与 PIN 的方法非常不同，验证密码与 PIN\
  \ 的方法也不同。密码和 PIN 的验证在第 4 章中讨论过，而图 5.7 显示了密码与 PIN 加密的对比。图的上部分显示用户输入密码进行密码验证；下半部分显示用户输入\
  \ PIN 进行 PIN 验证。无论何种知识因素，密码（或 PIN）都需要从输入点传输到验证点。用户标识符（例如名称）被验证过程用于从数据库中获取用户配置。\n\
  \n密码流（上图）包括用户输入并加密密码、将加密后的密码传输到验证系统，以及在验证时解密密码。很少有加密密钥专门用于加密密码。相反，如果加密了密码，通常是在 TLS\
  \ 连接中。因此，从加密架构的角度来看，用户系统拥有验证系统的 PK（最好是 X.509 证书）。验证系统拥有其公私钥对。加密和 HMAC SK 在 TLS 握手期间协商，密码在\
  \ TLS 数据包内传输。加密后的密码从用户传输到验证系统。\n\nPIN 流（下图）包括用户输入 PIN，但由专门进程执行 PIN 加密。加密 PIN 块从一个系统传输到另一个系统，从一个对称密钥转换为另一个。随着加密\
  \ PIN 块跨越多个网络到达 PIN 验证系统，PIN 转换次数会有变化。PIN 验证系统解密加密 PIN 块并按照第 4 章所述的方法验证 PIN。图 5.8\
  \ 提供了一个 PIN 支付过程的示例。\n\n\n\n\n\n发行机构通过不同的交付方式（例如两封不同的信）向持卡人提供支付卡和 `PIN`。持卡人在商户处进行购买时，提交支付卡并在销售点（POS）终端上输入\
  \ `PIN`。该终端使用对称 PIN 加密密钥（`PEK`）对 `PIN` 进行加密。第一个 `PEK` 与为商户提供支付服务的收单行系统共享。收单行将 `PIN`\
  \ 从与 POS 终端共享的 `PEK` 转换为与为收单行提供支付服务的`network A`共享的另一个 `PEK`。`Network A` 将 `PIN`\
  \ 从与收单行共享的 `PEK` 转换为与为发行机构提供支付服务的`network B`共享的另一个 `PEK`。`Network B` 将 `PIN` 从其与\
  \ `network A` 共享的 `PEK` 转换为与发行机构共享的 `PEK`。发行机构解密 `PIN`，以便使用 PIN 验证密钥对 `PIN` 进行验证。\n\
  \n![](img/00065.jpeg)\n\n图 5.7 密码和 PIN 加密。\n\n![](img/00066.jpeg)\n\n图 5.8 PIN 支付流程。\n\
