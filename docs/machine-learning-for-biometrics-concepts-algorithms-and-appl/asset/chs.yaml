  表 4\" /></p></div>\n\n### 10：总结\n\n在这项工作中，从预处理后的输入图像集中提取了两组特征。一组特征提取是通过迁移学习方法，另一组是通过浅层\
  \ CNN。LDP 图像是在预处理后由人脸图像构建的。LDP 特征图像被组织为 `220*170` 的尺寸。此外，可以训练更大的模型，训练时间也会减少。因此，从特征图像中使用微调的预训练\
  \ AlexNet/GoogLeNet 和浅层 CNN 提取特征。特征融合使用 CCA/DCA 完成。然后，将融合特征集作为输入提供给 SVM 分类器以识别给定图像的性别。这种集成提高了预测准确率，并形成了一个稳定的性别识别系统。在\
  \ MC-DLF 方法中，原始图像及其对应的 LDP 图像（特征图像）被用于提取特征。从结果可以推断，当使用特征图像作为输入时，系统表现更好。由于建议的方法使用了执行边缘分析的特征图像，它通过去除非基于边缘特征引起的歧义，实现了最佳的性别识别。由于\
  \ LDP 特征图像对边缘和形状进行了建模，它们能更好地表征分类任务。通过将 LDP 特征图像作为输入提供给建议的方法，提取了显著的学习特征。因此，这些学习到的特征更有利于有效分类。\n\
  \n### 参考文献\n\n## 第 7 章：从面部视频实现心脏信号的生物识别认证\n\nM. Kavitha; R. Jai Ganesh  ^() K. Ramakrishnan\
  \ 技术学院，印度特里奇\n\n### 摘要\n\n利用生物特征进行人体个体认证是一个常被研究的评估领域，旨在允许安全框架、可量化评估以及医疗报告的保存和检查。对于个人认证，在各种生物特征信用虹膜图像中，存在着异常雕刻、表情、真实渲染的身份、面部图像、手部数学特征、手指静脉模式和视网膜版本。然而，这些生物特征特征中的大部分在准确性、欺骗和细微差别方面显示出数百种差异。不同的生物特征属性，如表情或来自心电图\
  \ (ECG) 的心跳信号，被广泛应用于人体个体认证。基于面部镜头的有氧生物学截止因素的完整评估不断改进。像其他用于个人声明的生物特征标记一样，本章介绍了来自面部视频的心跳信号\
  \ (HSFV)，从无到我们所能清楚认识的极致。通过在模拟 HSFV 的方向版本上进行 Radon 变换，从 HSFV 中进行亮点提取。建议的生物特征 HSFV\
  \ 用于个人身份识别的限制似乎基于公开可用的证据。\n\n#### 关键词\n\n心跳信号；生物识别认证；面部视频；ECG；MAHNOB-HCI 统计数据；RGB\
  \ 摄像头；ROI 提取\n\n### 1：引言\n\n术语“生物特征”涉及利用个体的有机、物理或社会特征来识别或确认其身份。生物特征被定义为“生命测量”，生物特征创新利用通过摄像头和过滤图像捕获的人体部位图像。多模态生物特征涉及至少两种生物特征模态的组合\
  \ ¹⁴⁸\n\n### 心电图生物特征个人识别工具\n\n这项工作管理心电图 (ECG) 生理信号的可靠性，以协助人体识别。在一个计划的定义证明基础上，专注于布局对齐和灵活量化，测试了一个由来自\
  \ Physionet 的 50 个受试者的 ECG 组成的 250 个 ECG 记录的测试集合。存在随时间变化的各种生物信号发生短期变化的不必要风险，这也可能威胁生物特征保护。由于发展，外部框架上的心血管能力信息倾向于有争议。无论如何，即使没有干扰，就某种早先建立的生物特征布局而言，ECG\
  \ 信号也可能变得不稳定。其背后的解释是身体生理学以及大脑科学对心脏功能的快速影响。沿着这些相同的线路，对受试者内部变异性范例的评估是 ECG 生物特征研究的关键部分。\n\
  \nLacewell 等 ¹⁴⁹ 的相关工作\n\nGemma Piella 等 ¹⁵⁰ 的相关工作\n\n远距离估计生理活动可以给临床和情感处理应用带来显著优势。最近的探索提出了各种程序，利用人脸记录进行脉搏（心率，或\
  \ HR）的不显眼识别。这些方法依赖于由于心血管活动引起的面部不显眼的遮盖变化或发展，这些对人眼不可见，但可以被机械化摄像头识别。提出了一些理论，如信号准备和人工智能\
  \ (AI)。无论如何，这些系统是针对特定数据集进行区分的，因此在方法执行方面没有共识。在本文中，我们描述并评估了书面记录中的几种方法。在每个阶段，根据其使用公共数据库的表现，对估计值进行剖析和调查。\n\
  \n\n\n\n几个世纪以来，人们一直利用身体特征来相互辨识，如面部、语音和步态。19 世纪时，德里警察总部刑事识别科主管阿方斯·贝蒂永建立并制定了利用不同身体测量值来识别罪犯的方法。同样，随着他的思想普及，在\
  \ 19 世纪末，它被指纹独特性这一无疑更伟大、更可行的发现所掩盖。不久后，几个重要的立法部门理解了首先“交换”罪犯指纹并将其存入数据库的概念。此后，可在犯罪现场“提取”额外的指纹，并与数据库中的指纹同步以识别个人身份。鉴于生物识别技术源于其在执法领域识别罪犯的广泛应用，如今它越来越多地用于众多非执法应用中以实现个体识别。所提系统使用基本的视频采集网络摄像头，并利用信号处理方案调整面部图像的颜色，这可在心跳辅助下执行，以便后续改进。建议的生物识别技术无需任何重要传感器即可工作。它完整且持续，独特地体现了任何活人的心脏运作方式。且极难伪造；与其传统对应物相比，在标准上将具有超稳定性。本文提出了一种利用这一新型生物识别技术进行个体验证的方法，该方法采用充分的信号处理程序和以分类为主的选择系统\
  \ ¹⁵¹。\n\n### 2: 基于面部视频的生物识别系统\n\n基于面部视频的心脏信号用于人体识别的建议框图如 图 1 所示。步骤讨论如下。\n\n![图\
  \ 1 建议的框图系统。](img/f07-01-9780323852098.jpg)\n\n图 1 建议的框图系统。\n\n#### 2.1: 人脸检测与视频采集\n\
  \n建议的方法要求利用红、绿、蓝 (RGB) 摄像头获取面部视频。由于主要基于心跳信号分析的面部视频无限框架主要使用直接网络摄像头进行视频获取，因此此处该方法选择基于网络摄像头的视频获取方法\
  \ ¹⁵²。\n\n![图 2 从 RGB 轨迹获得的含噪心跳信号。](img/f07-02-9780323852098.jpg)\n\n图 2 从 RGB 轨迹获得的含噪心跳信号。\n\
  \n#### 2.2: 特征提取\n\n我们从 Radon 图像中提取特征，因为这些快照在基于 ECG 的游戏计划中已被证实能带来适当的结果。要制作此类图像，我们需要一条路径图，该图可通过从面部视频获取的重复心跳信号创建。复制的数量相当于视频中投影的数量\
  \ ¹⁵³。\n\n```\n[*f*(*a*,*b*)] = ∫[−∞]^∞ *f*(*a*′cos cos *Ɵ* − *b*′sin sin *Ɵ*,*a*′sin\
  \ sin *Ɵ* − *b*′cos cos *Ɵ*)*d**y*′………\n```\n\n![si1_e](img/si1_e.png)  (1)\n\n\
  其中 *Ɵ* 是 Radon 空间中一条线从线心与主轴的距离向量所形成的点，且：\n\n```\n[*a*′*b*′] = [*Ɵ*−sin sin *Ɵ* sin\
  \ sin *Ɵ* cos cos *Ɵ*] [*a* *b*]\n```\n\n![si2_e](img/si2_e.png)  (2)\n\n我们利用著名的闵可夫斯基距离度量来计算\
  \ Radon 图像 *R* 的 *m* × *n* 像素的成对距离：\n\n```\n$d_{\\mathit{st}} = \\sqrt[p]{\\sum_{i\
  \ = 1}^{n} \\mid \\mathit{Rsi} - \\mathit{Rti} \\mid}p$\n```\n\n![si3_e](img/si3_e.png)\
  \  (3)\n\n其中 *R[s]* 和 *R[t]* 是代表 *R* 的每个行向量的行向量。\n\n#### 2.3: 识别\n\n我们使用基于决策树的框架进行识别。这是一种流程图状的结构，包含三种区域：(i)\
  \ 内部节点倾向于对一个属性进行测试；(ii) 分支代表测试的结果；(iii) 叶节点倾向于一个类别标签，这是通过在内部节点隔离所有特征而得出的决定。在使用树（试验阶段）之前，必须对其进行训练。在训练阶段，使用训练数据的特征向量来构建节点并生成决策树。在试验阶段，试验数据的特征向量经历内部节点中的测试，最终获得一个类别名称，其中一个类别代表一个待识别的主体。数据的训练/试验划分在初步结果中说明。\n\
  \n#### 2.4: 实现算法\n\n*   步骤 1 输入数据：`EEG_data`；\n*   步骤 2 输出数据：`model result`、`features\
  \ result`；\n*   步骤 3 设置参数 `No of Populations`、`No of Generations` 和 `threshold`；\n\
  *   步骤 4 `Model Selections`（模型选择）；\n*   步骤 5 使用 `Epochs`、`lstm cells`、`Activation`、`Dropout`、`Optimize`\
  \ 随机生成模型种群，并重复此步骤直到达到 `No of Populations`；\n*   步骤 6 使用输入数据在 `lstm` 中学习模型种群，然后仅保留前\
  \ 20% 的顶级结果供下一代使用，并重复此步骤直到达到 `No of Generations`；\n*   步骤 7 `If (result RMSE > threshold)\
  \ {`；\n*   步骤 8 `Crossovers()`（交叉）；\n*   步骤 9 `Mutate()`（变异）；\n*   步骤 10 `Repeat\
  \ GA-Model Selection`（重复 GA-模型选择）；\n*   步骤 11 `}`；\n*   步骤 12 `Else`；\n*   步骤 13\
  \ `Save model result`（保存模型结果）；\n*   步骤 14 `Feature Selections:`（特征选择：）；\n*   步骤\
  \ 15 使用 `Input data` 随机生成特征种群；\n*   步骤 16 使用输入数据和 `model result` 学习特征种群，并仅保留前 20%\
  \ 的顶级结果供下一代使用，重复此步骤直到达到 `No of Generations`；\n*   步骤 17 `If (result RMSE > threshold)\
  \ {`；\n*   步骤 18 `Crossovers()`；\n*   步骤 19 `Mutate()`；\n*   步骤 20 `}`；\n*   步骤\
  \ 21 `Else`；\n*   步骤 22 `Save features result`（保存特征结果）。\n\n### 3: 结果与讨论\n\n####\
  \ 3.1: 实验环境\n\n为测试框架的性能，我们使用了公开可访问的 `MAHNOB-HCI` 数据库。该数据库已收集完成，包含由连接到 PC 的简单摄像机（如网络摄像头）捕获的面部记录。该数据库包含两类数据：`Feeling\
  \ Elicitation Experiment (EEE)`（情绪诱发实验）和 `Verifiable Tagging Experiment (ITE)`（可验证标注实验）。其中，来自\
  \ `EEE` 的视频片段为正面人脸视频统计数据，适合我们的试验。因此，我们从 `MAHNOB-HCI` 数据库中选择了 `EEE` 视频片段作为我们的生物识别识别结构的面部记录。图\
  \ 3 中展示了来自 `MAHNOB-HCI` 数据库的一些视频片段的描述。该数据库从 30 个受试者中产生了 3810 个面部记录。然而，并非所有这些记录都适合我们的试验，原因是时长短、文件缺失以及某些记录中面部被遮挡（额头）。因此，我们选择了\
  \ 351 个适合我们研究的记录。这些记录来自 18 个受试者（每个受试者 16-20 个记录）。我们在新颖的重叠测试中，使用每个视频的前 20 秒进行测试，并用\
  \ 80% 的数据进行规划。\n\n![图 3 面部视频片段的面部捕捉。](img/f07-03-9780323852098.jpg)\n\n\n\n\n####\
  \ 3.2 性能评估\n\n在利用关联数据生成选择树之后，我们利用试验数据进行了确认效果分析。每个测试的功能源自面部视频心跳信号（HSFV），已在选择树中通过定位方案集中的最佳匹配来实现远程处理。所提\
  \ HSFV 生物特征识别的性能通过判据指标进行了评估，这些指标包括误正识别率（FPIR）和误负识别率。FPIR 表示测试被误判为某一主体的概率。在评估中，若在\
  \ N 个基础样本中存在真正例、真负例、假正例和假负例 ID。\n\n从结果中可以指出一个重要因素：TPIR 和准确率在特性上存在显著差异。这是因为真正例和真负例的开端与胜出在数量上基本占优，且系统实现了高真负批准速度，这通过特异性和灵敏度估算得以体现。这表明，除提供高性能外，所提生物特征识别可能还需要在特征提取和组织评分计算这两个阶段进行改进。尽管基于接触的\
  \ ECG 和 PCG 生物特征识别在某些本地数据库上获得了 90% 以上的精度，但我们认为它们与我们系统的简短对比对其公平性而言是不均衡的，因为它们使用实质性的接触式传感器，可提供心跳信号的细致评估；而我们使用非接触式传感器（网络摄像头），仅能获得通过接触式传感器获取的那些心跳信号的估值。这表明，至少在其意外发展的这一初期阶段，我们的非接触式系统未能超越那些基于接触的系统，这似乎是合理的。\n\
  \n#### 3.3 用于情绪识别的生理数据集比较\n\n在实验设置过程中，情绪的引入看起来非常困难，而生物信号数据可以与 EEG 信号结合进行处理。由此提议了一种获取数据的替代来源。此处使用了开放数据集。表\
  \ 1 根据研究数据列出了数据集清单。另一方面，未清理的实验数据旨在创建一个包含在 MAHNOB-HCI 中的数据集。此处 MAHNOB-HCI 数据集被用作带有观察者标记效价的开放数据集，用于连续情绪识别。\n\
  \n##### 表 1：不同数据集编号下的情绪识别比较\n\n| 数据库编号 | 部分编号 | 自然/诱发 | 声音 | 视频 | 外周 | EEG | 标签\
  \ |\n| :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n| MIT | 17 | 自然\
  \ | 否 | 否 | 是 | 否 | 否 |\n| VAM | 19 | 自然 | 是 | 是 | 否 | 否 | 否 |\n| SEMAINE | 20 |\
  \ 诱发 | 是 | 是 | 是 | 否 | 否 |\n| DEEP | 32 | 诱发 | 否 | 是 | 是 | 是 | 否 |\n| MAHNOB-HCI\
  \ | 28 | 诱发 | 是 | 是 | 是 | 是 | 效价 |\n\nMAHNOB-HCI 数据集包含 20 个用于诱发持久情绪的视频。参与者在初步分析中通过自我评估记录感受，协助了视频采集。摘录中的\
  \ 20 个源视频包含厌恶、大笑、兴奋、恐惧、悲伤和中性情绪。每个视频片段持续约 34–117 秒。研究中有 27 名稳定参与者：13 名男性和 16 名女性。EEG\
  \ 信号采用 32 个激活电极采集，电极位置符合 Biosemi Active II 和 10-20 国际系统要求。参与者面部以 720 × 580 分辨率、60\
  \ 帧/秒的速度拍摄，并与 EEG 信号同步。数据集输出详细列于表 2。共制作了 239 条记录，每条记录均有自己的标签和详细信息。图 4 提供了使用 MAHNOB-HCI\
  \ 数据集的标注标记测试结果示例。实线描绘了目标效价随时间的变化，虚线描绘了 GA-LSTM 预测的效价。标注标记阈值范围为 0.1 到 0.1。图 5A 描绘了正效价随时间的变化，而图\
  \ 5B 描绘了负效价随时间的变化。GA-LSTM 结果与目标结果通常相同。不寻常的是，GA-LSTM 效价在正或负效价陈述后，趋向于比目标效价更快地向中性值移动。其解释是标注数据不平衡。由于乐观标注多于消极标注，模型受前者影响更大，导致负效价或唤醒度无法正确回归。此外，良好情绪几乎不可能通过面部表情标记，而消极情绪因个体差异大而难以标记。因此，面部表情标记过程对情绪的消极表达敏感。\n\
  \n##### 表 2：MAHNOB-HCI 数据集\n\n| 测试人数 | 共 27 人：男 15；女 12 |\n| :--- | :--- |\n| 记录值\
  \ | 32 通道 EEG、外周生理信号、使用 6 个摄像头采集的面部和身体视频、眼动和音频 |\n| 报告 | 刺激、激动、优越性和可预测性、情绪关键词 |\n\
