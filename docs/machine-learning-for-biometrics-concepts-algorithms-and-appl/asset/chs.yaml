  \n**图 4** 基于 HSFV 生物特征的认证系统性能。\n\n![图 5 MAHNOB-HCI 测试结果。(A) 正效价和 (B) 负效价。](img/f07-05-9780323852098.jpg)\n\
  \n**图 5** MAHNOB-HCI 测试结果。(A) 正效价和 (B) 负效价。\n\n### 4 结论与未来工作\n\n本章提出面部视频心跳信号作为一种新的生物特征用于人员验证。利用变换矩阵在复现\
  \ HSFV 的瀑布方法论上提取特征。从 Radon 图像中推导双边闵可夫斯基距离作为特征。采用基于决策树的监督方法进行认证。所提生物特征及其认证机制证明了其生物特征识别能力。然而，在该生物特征应用于实际系统之前，仍需调查和解决若干问题。例如，在实际场景中，需要确定可用于认证的视频有效长度。通过管理面部欺骗，将面部与\
  \ HSFV 结合可能产生有趣的结果。处理时间、为减少准确率与接受率之间差异而进行的特征优化、以及尝试用于计算匹配得分的替代度量，这些都是必须探讨的事项。这些均可作为拓展现有研究的潜在未来方向。\n\
  \n### 参考文献\n\n\n\n\n\n## 第 8 章：利用人体生物特征情绪强度实时追踪学生情感投入度\n\nSumitav Acharya^a; Motahar\
  \ Reza^b  \n^a 计算机科学与工程系，国家科学技术学院，贝拉姆普尔，印度  \n^b 数学系，GITAM 视同大学，海得拉巴，印度\n\n### 摘要\n\
  \n本章阐述了利用人类情绪强度追踪学生在课堂中的情感投入度的实用性，这属于行为生物特征识别的一部分。行为生物特征识别处理人类活动的模式。它包括物理和情感生物特征，这些特征标志着一种用于识别行为的特质。在课堂上，学生分心是行为生物特征识别的因素之一。其程度和持续时间各不相同。学生投入度常被视为解决表现低下、冷漠、脱离及高不及格率等问题的信号之一。情绪与我们的面部表情交织在一起，由\
  \ 43 块面部肌肉调节，而这些肌肉本身又由两条面神经管理。利用 `FAU`（面部动作单元）考察了课堂上呈现心不在焉面容的主要特征。这涵盖了追踪的多个方面，范围从学生进入教室时捕获第一帧开始，然后在其留在课堂期间对相应结构进行区分。在我们的方法中，最初通过标注分心面部数据集来识别面部关键点。随后，利用负责的像素值和标签对其进行训练，以帮助机器识别分心/未分心面部的相关特征。处理完数据集后，我们串联了两个模型来训练分心数据集，一个是基于卷积神经网络的自定义深度情绪网络，另一个是用于保持对称性的\
  \ `Reversed-NN`。因此，在输出层，我们将两者的输出串联起来，以识别面部是否分心/未分心。该流程支持在实时摄像头中部署模型，以追踪学生的行为生物特征。在数据库上进行的实验强化了可用于生物特征识别目的的“拟议特征”。\n\
  \n#### 关键词\n\n行为生物特征识别；机器学习；`FAU`（面部动作单元）；计算机视觉；深度情绪-CNN；`Reversed-NN`（神经网络）；生物特征识别\n\
  \n### 1：引言\n\n了解人类举止是判断力的象征，它展示了面部动作或表情的视觉证据。人类情绪强度 ¹⁵⁴\n\n本章从我们自制的“分心”数据集的多张图像中衍生出行为属性，该数据集利用了来自\
  \ `FACS` ¹⁵⁵ 的理解\n\n尽管存在多种专注于学生投入度追踪的方法，但它们基于基于部分的方法，即分析面部的不同运动。我们的主要目标是利用动作单元关联面部的显著特征，找出那些导致分心面容的特征，并据此进行分类。我们模型的多功能方法论支持与学生注意力相关的各种新兴关注点\
  \ ¹⁵⁶\n\n### 2：相关工作\n\n众所周知，行为生物特征识别涉及基于独特行为特质识别个体。它开启了一个特质的新视野，正如我们在日常认证策略中所见，范围涵盖从语音识别、击键动力学到手写签名识别。这些策略主要装备于许多现代应用中，以追踪其用户的行为。但在这里，我们通过面部情绪识别来追踪个体的情绪行为。因此，通过情绪追踪学生的投入度是我们发现的一种此类应用。现有的技术方法代表了投入度检测的流程，主要分为三大类：自动、半自动和手动。一般来说，基于机器的系统提升了观察力，即通过瞳孔运动、面部情绪特征可以提取特征以识别课堂上投入的学生。现在投入度检测更多地关注面部表情、基于部分的方法（阐述通过不同动作单元分析面部的技术，也称为\
  \ `FACS`）和基于外观的方法。\n\nZewe Serpell 和 Yi-Ching Lin 进行的研究 ¹⁵⁷\n\n### 3：方法论\n\n我们的工作流围绕三个层次的阶段展开。初始阶段处理图像数据获取与预处理\
  \ ¹⁵⁸\n\n![图 1 解释方法论的框图。](img/f08-01-9780323852098.jpg)\n\n图 1 解释方法论的框图。\n\n####\
  \ 3.1：初始数据集准备的预处理步骤\n\n预处理是图像的增强过程，旨在抑制不必要的损伤，进一步增加进一步处理所需的图像特征 ¹⁵⁹\n\n该算法指出，不完美的像素通常被替换为附近像素值的平均值。鉴于存在多种预处理受损图像的技术，范围从高斯模糊技术、傅里叶变换（主要用于图像滤波、压缩和重建）到几何变换（改变像素的位置）等。\n\
  \n我们的数据集包含多张基于输入图像的 364*321 分辨率图像，我们执行了各种预处理步骤，即调整大小、归一化、高斯模糊技术等。\n\n1.  **1** 每张输入图像均调整大小至\
  \ 48*48，以在模型中保持一致性。特定阈值下的背景对象被视为第二阶段预处理的输入。\n2.  **2** 然后我们对图像执行归一化，改变像素强度值的范围。\n\
  3.  **3** 然后应用高斯模糊技术以去除不需要的噪声。\n\n#### 3.2：特征提取技术\n\n在我们的工作中，我们使用了提升型 `LBP`（局部二值模式）作为特征提取技术，因为与标准\
  \ `LBP` 方法相比，它所需的计算时间更少。在此方法中，两张面部图像对应 `LBP` 之间的卡方距离主要用于分类。该技术在我的数据集上达到了 96.72%\
  \ 的准确率。\n\n#### 3.3：解读 FACS 数据库\n\n面部动作编码系统是一种基于部分的方法技术，通过考虑面部部分来分析人类情绪。首先，该标准由解剖学家\
  \ Carl-Herman Hjortsjö 揭示，后来被 Ekman 和 Wallace V. Friesen 采纳并于 1978 年发布 ¹⁶⁰\n\n该编码系统还帮助面试官在与候选人交流时分析面部行为。使用\
  \ `FACS` ¹⁶¹\n\n让我们探索数据库中的一些内容：\n\n现在对于分心数据集，我们使用了以下主要描述分心面容的动作单元（图 2 和图 3）。\n\n\
  ![图 2 FACS 数据库示例。](img/f08-02-9780323852098.jpg)\n\n图 2 FACS 数据库示例。\n\n![图 3 分心数据集示例。](img/f08-03-9780323852098.jpg)\n\
  \n图 3 分心数据集示例。\n\n#### 3.4：分步算法\n\n1.  **1.** 准备数据集\n    1.  **1.1** 初始预处理\n   \
  \ 2.  **1.2** `data[]` <- 从带标签的 csv 加载\n\n\n\n\n\n#### 3.5：训练与实时分类\n\n从数据集中提取瓶颈特征后，我们根据像素值训练标签。因此，从某种意义上说，像素值表示主要标志特定行为特征（分心/未分心）的区域。对我们自制数据集中的图像进行编码。提取了三列，一列是标签，第二列是字符串（像素值），并伴有预测信息。你只需处理该数据集进行训练，然后在给定数据集上进行测试。模型架构见图\
  \ 4。\n\n![图 4 模型架构。](img/f08-04-9780323852098.jpg)\n\n图 4 模型架构。\n\n除此之外，还做了一件事：训练了两个模型，一个基于正常图像，采用相同架构；另一个基于反转图像，以保持对称性。当实时设置的输入不稳定时，这变得非常有帮助。将其与主模型拼接后，在两个类别上进行预测。\n\
  \n就训练目的而言，我们设定批次大小为 64，各训练 25 个周期。而最后将两个模型拼接的阶段，批次大小为 32，各训练 3 个周期。\n\n正如图 4 中的模型通过拼接镜像和正常图像来促进对称性，每张图像都会经过后续的卷积层\
  \ ¹⁶²\n\n#### 3.6：该方法的优缺点\n\n首先列出我们策略的优点：\n\n*   在本章中，我们拼接了两层模型以提高准确率。一个是自定义深度情感网络，另一个是反转神经网络（Reversed-NN），用于考虑现实场景中的对称性处理。\n\
  *   我们的模型在真实课堂环境中对分心面部进行分类，平均准确率达到 95.7%，超越了现有模型。\n\n不足之处：\n\n*   我认为我们模型的劣势在于数据集的异质性。对于未来的工作，我们必须考虑涵盖不同地区人脸的多种多样的数据集，并在此基础上提取其面部特征。\n\
  *   在多样化数据集之上弄清模型准确率。\n\n### 4：结果与讨论\n\n工作流程使用 `Python-3.7.9` 实现，利用了 `OpenCV`、`Tensorflow`\
  \ 和 `Keras` 等各种计算机视觉库。整个工作在 `Intel Core i5 4th Gen 4210U` 处理器上完成并进行了检验。对于实时预测，模型已与\
  \ GUI 连接。流程如下：打开应用程序，提示启动摄像头，随后实时预测随之进行。GUI 作为一个独立应用程序，利用情感强度触发模型对学生行为进行实时跟踪。图 5\
  \ 和 图 6 解释了 GUI 结果。\n\n![图 5 实时分心图像的 GUI 结果。](img/f08-05-9780323852098.jpg)\n\n\
  图 5 实时分心图像的 GUI 结果。\n\n![图 6 实时未分心图像的 GUI 结果。](img/f08-06-9780323852098.jpg)\n\n\
  图 6 实时未分心图像的 GUI 结果。\n\n### 5：结论\n\n提出了一种适当的解决方案，用于跟踪学生在课堂学习时的行为属性。该解决方案开启了多种应用，范围涵盖从学生身份验证和表现记录、增强培训能力到减少失败措施。通过这项研究，我们不仅旨在通过自定义深度情感网络提高性能，而且计算时间的降低也十分显著。研究的大部分集中于利用\
  \ FACS 数据库提取面部的主导特征，然后通过实施模型将其与行为生物识别技术映射，以区分指定类别。采用的技术显示出利用情感强度对分心面部进行分类的近乎同等良好的效果，并在模型性能上获得了显著提升。我们的方法在考虑多样化数据集以实现全流程自动化方面有所欠缺，对我们的模型和该领域的进一步改进将有利于跟踪课堂上的学生参与度。\n\
  \n### 参考文献\n\n## 第 9 章：基于面部识别表情的考勤监控与情绪检测——一种深度 CNN 方法\n\nPriyanshu Sarmah^(a)；Rupam\
  \ Das^(a)；Sachit Dhamija^(a)；Saurabh Bilgaiyan^(b)；Bhabani Shankar Prasad Mishra^(b)\
  \ ^a 电子工程学院，KIIT，视同大学，布巴内斯瓦尔，印度\n\n^b 计算机工程学院，KIIT 视同大学，布巴内斯瓦尔，印度\n\n### 摘要\n\n\
  由于 COVID-19 大流行，教育部门受到巨大影响，各机构转向在线学习以继续授课。视频会议软件在课堂上的大规模采用带来了诸如在线课堂学生考勤、确定学生对讲座的理解程度、以及传统上在实体教室使用的教学辅助工具等障碍。教师难以标记关闭视频的学生的出勤情况。学生可能在新的在线课堂环境中觉得主题难以理解，或因不可靠的网络连接而错过讲座。教师需要对讲座有一些反馈，以衡量学生的情绪。因此，作者提出了一个框架，该框架使用定向梯度直方图（HOG）和\
  \ VGG-16 神经网络，在讲座期间按预定间隔拍摄学生照片。如果在多个间隔内检测并识别出学生，该框架将标记其为出席，并根据面部表情识别在每个间隔检测其情绪。该系统将“主要”情绪作为反馈提供给教师，作为教学辅助工具。教师随后可以选择重复某个主题，以帮助学生理解。\n\
  \n#### 关键词\n\n面部识别；CNN；机器学习；情绪检测；面部表情检测；深度学习；序列模型；HOG\n\n### 1：引言\n\n\n\n\n\nCOVID-19\
  \ 大流行影响了全球人民的健康，并给教育领域带来了挑战。为遵守社交距离规范，全球各地的教育机构均已关闭。各机构尝试将课程转移到线上，以维持课程和讲座的连续性，从而缓解这一问题。许多供师生进行视频会议的软件可供教育机构用于开展在线课程。虽然此类举措促进了在线学习，但线上课程也带来了自身的一系列问题。本章旨在阐述解决部分关键挑战的技术框架。\n\
  \n教师在传统课堂教学中采用的一种教学方法是根据学生反馈调整教学策略。在实体课堂环境中，教师可以通过学生的回答和面部表情，判断他们对某个概念的理解程度。这些来自学生的“反应”为教师提供了信息，教师利用这些信息调整讲座的进度或结构，以更好地了解学生。自然地，这一过程无法在需要正常运行的计算机硬件和快速网络连接的在线讲座中有效进行。Webcam\
  \ 和麦克风故障，以及不可靠的网络接入，都会阻碍这一过程。在线讲座期间，视频流因网络连接不良而出现像素化、抖动或保持关闭状态的情况很常见。学生可能会选择不告知教师自己没听懂某个概念，而不是主动说出来。在这种情况下，教师无法从学生的表情中获得任何反馈，以判断是最好再讲解一遍该概念，还是继续讲课。为解决这一问题，检测面部表情的技术可提供关于学生反应的一些基本信息，以辅助教师进行在线讲座。\n\
  \n情绪识别是一种可以检测人情绪的技术。虽然心理层面难以通过技术手段理解，但基本的情绪识别可以通过检测和分类面部表情来实现。情绪检测算法中公认并使用了六种基本面部表情——愤怒、快乐、悲伤、惊讶、厌恶和恐惧。这些表情具有不同且独特的特征和外观形象，分类正是基于这些特征进行的\
  \ ¹⁶³。\n\n在线课程中出现的另一个问题是学生考勤记录。中小学及高校将考勤作为教育的一部分，并以此授予学分。在实体课堂上，教师可以将到场的学生标记为“出席”。真正遭遇硬件故障或网络连接不可靠的学生，也可能关闭\
  \ Webcam 以至少能参加在线讲座。教师无法准确区分这些情况，以便在在线讲座中将部分学生标记为出席、其他学生标记为缺席。应对这一挑战的解决方案是使用面部识别方法正确识别学生身份，而不依赖教师人工操作。\n\
  \n面部识别是一种生物特征身份认证技术。得益于图像处理算法的快速改进，该技术持续呈指数级提升 ¹⁶⁴。\n\n本章阐述了使用面部识别技术进行身份识别的有效模型，包括基于定向梯度直方图（`HOG`）的方法，以及基于卷积神经网络（`CNN`）的面部表情情绪检测方法。\n\
  \n作者提出了一个利用 `HOG` 和 `CNN` 模型的框架，旨在改善在线教育体验，帮助教师和学生专注于学业，而不是在大规模采用电子学习设施的过程中解决技术问题。\n\
  \n### 2：相关工作\n\n通过面部识别记录考勤是一种经过验证的做法。Budi 等人 ¹⁶⁵ 的工作即为一个恰当的例子。\n\nAllagwail 和 Elbkosh\
  \ ¹⁶⁶。\n\n多项研究、实验和算法被用于从静态图像、视频流、视频与音频的组合以及涉及肢体语言的数据中检测人们的情绪。Jaiswal 和 Nandi ¹⁶⁷。\n\
  \nHappy 等人 ¹⁶⁸。\n\n近年来，基于深度学习的实现变得流行。Fatima 等人 ¹⁶⁹。\n\n### 3：拟议工作\n\n#### 3.1：面部识别\n\
  \n实施拟议框架需要使用学生的 Webcam 捕获学生图像，以便在讲座课程期间进行考勤登记。面部识别考勤登记的一种切实可行的实施方式是在学生的计算机上安装软件，使其在在线讲座期间运行。该软件能够在预定义的时间间隔内检查学生的出席情况。该软件不要求通过互联网连接传输学生的面部图像。在初始设置阶段，学生必须通过\
  \ Webcam 扫描面部，供软件作为未来参考。每堂课开始时，学生需要登录。在课程进行期间，Webcam 会按预定义间隔拍摄学生照片。被算法成功识别的学生将被标记为该讲座“出席”。这将反映在该特定讲座对应学生的数据库记录中。任何基于图像的考勤系统都可遵循考勤的基本原则设计。我们的框架实现了该过程的自动化，由于无需通过互联网传输图像，仅显示结果，因此更加高效且不繁琐。\n\
  \n讲座结束后，讲师需要确认最终考勤。要求学生在讲座的大部分时间里都在屏幕前。教师可以设置拍照的时间间隔，且不向学生透露。假设 Webcam 拍摄的照片数量为\
  \ 10 张。要求学生在其中至少 75% 的照片中被检测到在场。如果满足此标准，则该学生将被标记为出席。此处，针对偶发的误检测情况，例如检测到假阳性（即误将物体识别为人脸的错误）或假阴性（即无法检测到人脸）。通常，假阳性对学生的考勤登记无害，除非学生投诉面部识别错误或物体被误判为人脸。不过，建议讲师核实每堂课的识别面部名单。\n\
  \n##### 3.1.1：面部获取、处理与识别\n\n该流水线过程的第一步是在区分、分类和识别之前，从图像中定位所有人脸。我们找到图像/视频中的位置，然后将其传递给流程的下一步。在此过程中，我们实施\
  \ `HOG`。\n\n`HOG` 算法背后的关键概念是：计算机视觉算法可以轻松识别物体的外观，特别是基于区域内强度梯度分布的形状表征。它不需要了解相应的边缘或梯度强度位置\
  \ ¹⁷⁰。\n\n为了在给定图像中定位人脸，我们将图像转换为灰度图，因为彩色数据对于定位人脸是不必要的。图 1 演示了这一步骤。\n\n\n\n\n\n#####\
  \ 3.1.2：评估\n\n为了评估所用质量估计与我们提出框架的对比情况，我们使用了扩展 Yale 数据库 B ¹⁷¹。\n\n其次，为评估所提亮度度量如何反映图像亮度的变化，我们引入了光照偏差。模型性能的一个关键因素是图像亮度。图像应有适当的照明，以保持高光、中间调和阴影之间的可区分性。\n\
  \n为测试模型性能，我们人为引入了图像亮度强度的一些变化。`Gamma parameter` 是我们调整光照强度所依据的关键概念。若 `γ < 1`，映射趋向更高亮度，反之亦然。为评估性能如何受聚焦、锐度、模糊度变化的影响，我们在不同层级上操控了图像的平滑处理。\n\
  \n当通过 `Gamma parameter` 将图像对比度设定在 0.4 左右时，可获得最佳结果。对于亮度，度量值在 0.5 左右时效果最佳。当 `gamma\
  \ value` 设定在 0.1 到 0.2 之间时，聚焦度量处于最佳。图像锐度应保持在 0.7 左右，光照在 0.6 左右以获得最佳结果。因此，我们可以得出结论：人脸识别模型的性能依赖于输入图像的各种外部条件。条件最优时，我们可获得约\
  \ 97.2% 的准确率。然而，平均准确率为 95.3%。在现实世界中，该框架极可能遇到光照一般的室内场景。因此采集了如 图 8 所示的测试图像以复现此类场景。若环境光照过暗且\
  \ `HOG algorithm` 无法确定对比度梯度，框架准确率将降至 75%–85%。若人脸背后有强逆光，准确率也会显著下降。网络摄像头在此类情况下会自动调整曝光，导致人脸变暗，使框架无法识别人脸。表\
  \ 1 将所提框架与其他一些 HOG 实现进行了对比。\n\n###### 表 1：部分 HOG 实现性能对比\n\n| 序号 | 方法 | 准确率 (%) |\n\
  | :--- | :--- | :--- |\n| 1. | Allagwail 和 Elbkosh ¹⁷² | 96.0 |\n| 2. | Rahmad 等\
  \ ¹⁷³ | 79.0 |\n| 3. | 提出的框架 | 97.2 |\n\n\n\n\n\n#### 3.2：情绪识别\n\n情绪检测的过程是通过识别面部表情来进行的，因为这是在线课堂期间监控的一个便利方面。情绪检测的一个实际实现是在学生的计算机上安装此类软件，该软件将在在线讲座期间运行。该软件会在预定义的时间间隔内检查学生的面部表情，并将学生可能感受到的心情或情绪传达给教师。以这种方式，该软件不要求通过互联网连接传输学生面部的图像。相反，软件在学生的计算机上本地运行算法，以获得检测到的面部表情的概率值。概率值提供了学生基于其表情感受某种情绪的可能性。这些数字通过互联网连接发送到教师的计算机。它还为教师提供“主要”面部表情，即学生最可能感受到的情绪，以及计算出的最高概率所对应的情绪。通过采取这一措施，框架可以在不需要占用大量带宽的情况下执行其预期功能，而带宽可能是不可靠的互联网连接。这使得教师即使无法看到学生，也能继续接收哪怕是基本形式的学生反馈，以改进他们的讲座。\n\
  \n该实现假设有七种基本情绪，算法可将检测到的面部表情分类到这七种情绪中。这些情绪是——愤怒、恐惧、厌恶、中性、快乐、悲伤和惊讶。为了检测面部表情并将其归类为七种情绪类别之一，学生的图像需要经过预处理。这涉及人脸检测、调整大小和裁剪。人脸检测由`Haar\
  \ cascade classifiers`（Haar 级联分类器）执行，这是 Viola 和 Jones 在其 2003 年的论文中提出的 ¹⁷⁴。\n\n\
  由于训练自定义神经网络是一个计算密集型过程，该实现采用了迁移学习。`Bottleneck features`（瓶颈特征）是从预训练的 `VGG-16` 卷积神经网络（`CNN`）创建的。该网络包含在\
  \ `ImageNet` 数据库上训练的权重。我们的序贯模型使用这些 `bottleneck features` 在提供的数据集上进行训练。\n\n#####\
  \ 3.2.1：图像收集与预处理\n\n用于检测面部表情的数据集是由 Aaron Courville 和 Pierre-Luc Carrier 创建的 `FER-2013`（面部表情识别）人脸数据库\
  \ ¹⁷⁵。\n\n预处理期间执行了以下步骤：\n\n*   将输入的 3 通道 `RGB` 图像转换为 1 通道灰度图像（如适用）。这样做是为了在训练期间不存在偏差，即彩色图像混杂在一些灰度图像中。此外，模型的结果不依赖于图像的颜色。\n\
  *   在每张图像中，通过实现来自 `OpenCV` 库的级联分类器来检测人脸，这些分类器基于 `Haar-like features`（类 Haar 特征）。级联分类器使用若干正样本（包含人脸或物体的图像）和任意负样本（不包含人脸或物体的图像）进行训练。`OpenCV`\
  \ 包含若干预训练的级联分类器，用于图像处理以检测人脸的正面视图和上半身。\n*   图像被裁剪为 `Haar cascade classifiers` 检测到的人脸区域。\n\
  *   图像被调整为 224 × 224 像素的分辨率，这是 `VGG-16` 模型所需的分辨率。\n*   最后，为了符合 `VGG-16` 的 3 通道规范，将\
  \ 1 通道（灰度）图像转换为 3 通道图像，以使用预训练模型的权重。然后，将图像保存到磁盘。\n\n##### 3.2.2：Haar 级联分类器\n\n`Haar-like\
  \ features` 是图像中可用于识别人脸的特征。Viola 和 Jones 通过改编 `Haar wavelets`（Haar 小波）的概念，在使用级联分类器为其模型开发人脸检测器时开发了这些特征\
  \ ¹⁷⁶。\n\n![Fig. 9 用于提取类 Haar 特征的相邻矩形。](img/f09-09-9780323852098.jpg)\n\n**图 9 用于提取类\
  \ Haar 特征的相邻矩形。**\n\n我们利用 `Haar features` 识别人脸的属性有：\n\n1.  **鼻梁和眼睛**：鼻梁区域和眼睛的相邻矩形可以产生一个\
  \ `Haar feature`，因为通常鼻梁区域比较暗的眼睛要亮，如图 10 所示；\n    ![Fig. 10 阴影矩形如何对应鼻部区域。](img/f09-10-9780323852098.jpg)\n\
  \    **图 10 阴影矩形如何对应鼻部区域。**\n2.  **眼部区域比上颊暗**：眼部区域和位置较低的上颊的相邻矩形被用于另一个 `Haar feature`。\n\
  \n图像区域位于黑白相邻矩形之下。位于白色矩形下的像素密度之和减去位于灰色矩形下的像素密度之和。在图 9 的 C 中，鼻梁区域可占据中央灰色矩形，而眼部区域占据相邻的白色矩形。该滤波器有三个矩形，其中侧向位置的白色矩形中的像素密度之和从中央位置的灰色矩形中减去。D\
  \ 中使用的滤波器可以减去对角线位置区域之间的像素密度 ¹⁷⁷。\n\n##### 3.2.3：VGG-16 网络与建模\n\n`VGG-16` 网络结构由 Simonyan\
  \ 和 Zisserman 开发，并提交至 `ILSVRC—2014` 竞赛，在 `ImageNet` 数据集上达到了 92.7% 的准确率 ¹⁷⁸。\n\n\
  网络架构由 13 个卷积层、3 个全连接层和 5 个池化层组成 ¹⁷⁹。\n\n![Fig. 11 VGG-16 神经网络的示意架构。](img/f09-11-9780323852098.jpg)\n\
  \n**图 11 VGG-16 神经网络的示意架构。**\n\n池化层将图像调整为 112 × 112 像素。第二部分包含两个卷积层，每层有 128 个卷积核。一个池化层将图像调整为\
  \ 56 × 56 像素。下一部分包含一组三个卷积层，后跟一个池化层。卷积层将卷积核数量增加到 256，其后的池化层将图像尺寸减小到 28 × 28 像素。第四组三个卷积层将深度增加到\
  \ 512 个卷积核，一个池化层将图像调整为 14 × 14 像素。第五组也有三个深度为 512 的卷积层。其后的最后一个池化层将图像调整为 7 × 7。最后，我们有两个全连接层，每层有\
  \ 4096 个节点。输出层使用一个 1000 单元的 `Softmax` 分类层作为其配置中的最后一层，代表 `ImageNet` 数据集中的 1000 个类别。\n\
  \n由于训练 `CNN` 涉及的硬件限制，采用了迁移学习。迁移学习利用带有 `ImageNet` 权重的预训练 `VGG-16` 模型层来配合新数据集进行训练。但是，它不更新层的权重以生成所需的\
  \ `bottleneck features`。为了创建 `bottleneck features`，仅使用了前五组卷积层和池化层，即从 `VGG-16` 架构中排除了全连接层和分类层。`bottleneck\
  \ features` 存储在 `NumPy` 数组中。\n\n\n\n\n\n##### 3.2.4：测试与结果\n\n用于训练的序贯模型包含五个全连接层、一个用于调整过拟合的\
  \ Dropout 层以及一个批量归一化层。前四个全连接层分别包含 512、256、128 和 64 个 ReLU 激活单元。ReLU 是一种非线性激活函数，可表示如下：\n\
  \n$$a = \\mathit{ReLU}\\left( b \\right) = \\left\\{ \\begin{matrix} {b;\\mspace{27mu}\\\
  text{if}\\ b \\geq 0} \\\\ {0;\\mspace{27mu}\\text{if}\\ b < 0} \\\\ \\end{matrix}\
  \ \\right.$$\n\n![si1_e](img/si1_e.png) (1)\n\n此处，“a” 和 “b” 分别代表输出信号和输入信号 ¹⁸⁰。\n\
  \n测试数据集从原始的 30,000 张图像池中获取，按 90:10 的比例划分训练集和测试集。每张图像都按前述顺序进行了预处理：转换为灰度图，随后进行人脸检测、裁剪和调整大小。\n\
  \nDropout 率降低至 0.7 以保持较低的训练损失；例如，较低的 Dropout 率（0.4）会显著增加最后几个周期的训练损失，同时也会降低测试准确率。当批量归一化层放在第三个全连接层之后时，效果最好。该序贯模型在训练数据集上达到了\
  \ 89.58% 的准确率，在测试数据集上达到了 89.2% 的准确率。训练期间，学习率设置为 0.001。使用的损失函数是带有 Adam 优化器的分类交叉熵损失。\n\
  \n图 12 和 图 13 分别展示了在序贯模型的训练和测试验证过程中，准确率和分类交叉熵损失随周期变化的图表。结果发现，在第 13 个周期之后，测试验证损失开始增加，而相应的准确率没有显著提高。这暗示发生了过拟合，因为训练准确率在第\
  \ 13 个周期后仍在持续提高。\n\n![图 12 显示训练和验证每个周期准确率的图表。](img/f09-12-9780323852098.jpg)\n\n\
  图 12 显示训练和验证每个周期准确率的图表。\n\n![图 13 显示训练和验证每个周期损失的图表。](img/f09-13-9780323852098.jpg)\n\
  \n图 13 显示训练和验证每个周期损失的图表。\n\n表 2 和 表 3 分别显示了模型在测试时的召回率矩阵和精确率矩阵。召回率，也称为灵敏度，可定义为模型预测的正确正样本数量与训练时定义的正样本总数之比。召回率矩阵表中的每个数字代表这一比率。召回率意味着该比率定义了模型能预测多少正确的值。精确率可定义为正确预测的正样本数量与模型预测的正样本总数之比。它本质上是定义预测有多正确的比率。精确率矩阵表中的每个数字代表这一比率。\n\
  \n###### 表 2：召回率矩阵——检测到的情绪分类为 7 个类别\n\n| 期望/真实面部表情 | 检测到的面部表情 |\n| --- | --- |\n\
  | | 愤怒 | 厌恶 | 恐惧 | 开心 | 中性 | 悲伤 | 惊讶 |\n| 愤怒 | 91.7 | 4.2 | 0.0 | 0.0 | 2.5 | 0.0\
  \ | 1.7 |\n| 厌恶 | 7.2 | 84.1 | 0.0 | 0.0 | 5.3 | 0.0 | 3.8 |\n| 恐惧 | 2.0 | 0.0 |\
  \ 87.3 | 0.0 | 4.1 | 6.6 | 0.0 |\n| 开心 | 0.0 | 0.0 | 4.9 | 89.0 | 3.7 | 2.4 | 0.0\
  \ |\n| 中性 | 0.0 | 17.9 | 0.0 | 2.8 | 79.3 | 0.0 | 0.0 |\n| 悲伤 | 0.0 | 14.6 | 0.0\
  \ | 0.0 | 1.1 | 83.0 | 1.3 |\n| 惊讶 | 1.4 | 0.7 | 6.3 | 3.1 | 0.0 | 0.0 | 88.5 |\n\
  \n<div class=\"small_device\"> <p class=\"table_fig\"><img src=\"images/B9780323852098000018/t0015.png\"\
  \ alt=\"表 2\" /></p></div>\n\n###### 表 3：精确率矩阵——检测到的情绪分类为 7 个类别\n\n| 期望/真实面部表情 |\
  \ 检测到的面部表情 |\n| --- | --- |\n| | 愤怒 | 厌恶 | 恐惧 | 开心 | 中性 | 悲伤 | 惊讶 |\n| 愤怒 | 93.0\
  \ | 0.0 | 0.0 | 4.8 | 2.2 | 0.0 | 0.0 |\n| 厌恶 | 7.5 | 89.4 | 0.0 | 0.0 | 0.0 | 3.1\
  \ | 0.0 |\n| 恐惧 | 0.0 | 4.7 | 92.1 | 1.3 | 0.0 | 0.0 | 1.9 |\n| 开心 | 0.0 | 1.8 |\
  \ 0.0 | 88.7 | 3.7 | 0.0 | 5.8 |\n| 中性 | 6.2 | 0.0 | 0.0 | 3.4 | 80.6 | 2.3 | 7.5\
  \ |\n| 悲伤 | 3.9 | 0.0 | 8.2 | 0.0 | 10.1 | 77.8 | 0.0 |\n| 惊讶 | 2.7 | 5.8 | 1.0\
  \ | 0.0 | 0.0 | 0.0 | 90.5 |\n\n<div class=\"small_device\"> <p class=\"table_fig\"\
  ><img src=\"images/B9780323852098000018/t0020.png\" alt=\"表 3\" /></p></div>\n\n\
  召回率矩阵显示，某些情绪类别略微偏向“厌恶”情绪类别。来自“悲伤”和“中性”情绪类别的多张图像被归类为“厌恶”情绪。其原因可能归因于训练数据集中标记为“悲伤”或“中性”的图像数量相对较少，少于标记为“厌恶”的图像数量。这一后果进一步体现在标记为“中性”的图像的召回率值上，即\
  \ 79.3，这是所有检测到的情绪类别中最低的值。另一方面，“愤怒”情绪类别具有最高的召回率 91.4，这可能是因为训练数据集中标记为“愤怒”的图像数量是所有情绪类别中最多的。\n\
  \n精确率矩阵中的数值表明，“愤怒”情绪类别中有更多的图像被正确分类。这可能归因于该类别训练图像数量较多，且“愤怒”图像面部特征与其他类别差异显著。然而，“悲伤”情绪类别记录了最低的精确率值\
  \ 77.8，表明被正确分类的预测“悲伤”图像数量较少。\n\n该序贯模型在执行 7 类分类问题时实现了高准确率，该问题涉及将检测到的面部表情分类为 7 个类别之一——愤怒、厌恶、恐惧、开心、中性、悲伤和惊讶。模型及其权重已保存到磁盘，以便对任意拍摄的照片实施情绪检测。\n\
  \n\n\n\n为了进行真实世界的测试，在低分辨率相机设置和 1280 × 720 像素分辨率（这是大多数笔记本电脑的标准配置）的笔记本网络摄像头上，拍摄了少量受试者的多张照片。这些照片的受试者是坐在书桌前、距离屏幕舒适、在自然室内光照下的人员。这样做是为了模拟在线课堂场景，即学生坐在椅子上，网络摄像头固定在书桌高度的电脑上。摄像头或笔记本电脑与受试者面部的距离在\
  \ 75 到 90 厘米之间。在图像 1280 × 720 像素的分辨率下，这个距离在人脸检测后能提供良好的图像裁剪，得到模型所需的 224 × 224 像素分辨率，同时保留图像中足够的细节。这些图像中的每一张都经过了预处理并生成了瓶颈特征，然后被输入到序列模型中。序列模型的输出为七个情绪类别中的每一个提供了一组概率列表。结果发现，当受试者的面部光照良好，或光照足以辨别基本面部特征时，模型能达到高准确率并正确分类面部表情。对于光线昏暗的受试者，模型对检测到的情绪获得的准确率较低。在搭载英特尔酷睿\
  \ i5-7200U 处理器（集成显卡）和 8GB 内存的笔记本电脑上生成的预测主导概率在 87% 到 79% 之间。从图像预处理到输出，这些结果始终能在 45\
  \ 秒内稳定获得（图 14）。\n\n![图 14 描述情绪检测过程的流程图。](img/f09-14-9780323852098.jpg)\n\n图 14 描述情绪检测过程的流程图。\n\
  \n在将我们的框架与其他合适的实现（如 Minaee 等人 ¹⁸¹ 基于注意力的卷积网络）进行比较时……\n\n### 4：结论与未来工作\n\n本章利用人脸识别和情绪检测技术，提出了解决疫情期间在线课程广泛采用所带来挑战的方案。\n\
  \n基于人脸识别的考勤登记使用 `HOG` 实现，在光照良好的最佳条件下识别人脸的准确率达到 97.2%。该模型在人脸识别方面极为有效，这对于在线课堂中的用户至关重要。这降低了在登记考勤时出现假阴性和假阳性的几率。在远程教学中，自动化这一过程将解除教师对考勤的担忧。未来的工作范围涉及将框架应用于实时考勤监控以进行增强，但这计算成本高昂且需要强大的硬件。\n\
  \n情绪检测通过使用 `Haar 级联分类器` 检测面部表情、`VGG-16` 神经网络的预训练权重以及自定义序列模型来执行。由于训练限制，使用带有预训练权重的卷积神经网络\
  \ `VGG-16` 来为图像创建瓶颈特征。这些特征随后被送入使用 `ReLU` 激活函数、`dropout` 和 `batch normalization`\
  \ 层（学习率为 0.001）的序列模型中。因此，模型将预处理后的图像中的面部表情分类为七个情绪类别之一——愤怒、厌恶、恐惧、快乐、中性、悲伤和惊讶。模型在测试数据集上测试时达到\
  \ 89.2% 的准确率。在真实条件下测试时，模型准确率在 87%–79% 左右，这对于本框架的意图是有效的。未来，在性能改进以将准确率提高到 90% 以上方面存在空间。将检测到的学生主导情绪提供给教师，可作为一种基本的“学生反馈”形式，以辅助教师的教学过程。然而，在远程学习和不可靠的网络连接时代，开发计算量不大的优化模型是一项挑战。未来，能够执行类似功能的实时情绪监控系统将在类似的教育场景（如教室）中提供更大的效用，并造福教育。能够在本地机器上运行而不需要高带宽互联网和强大计算机的实时情绪检测模型，将有利于在线学习。\n\
  \n### 参考文献\n\n## 第 10 章：机器学习和深度学习技术在网络安全中有效性的当代综述\n\nP. Suresh^(a)；K. Logeswaran^(a)；P.\
  \ Keerthika^(b)；R. Manjula Devi^(b)；K. Sentamilselvan^(a)；G.K. Kamalam^(a)；H. Muthukrishnan^(a)\
  \ ^a 信息技术系，Kongu Engineering College，Erode，Tamil Nadu，India\n\n^b 计算机科学与工程系，Kongu\
  \ Engineering College，Erode，Tamil Nadu，India\n\n### 摘要\n\n机器学习（`ML`）和深度学习（`DL`）技术应用于广泛的应用领域，在这些领域中证明了其相对于其他方法的优势。`ML`\
  \ 和 `DL` 技术可以与网络安全系统有效集成，以改善组织内的安全措施。大多数 `ML` 和 `DL` 应用适用于营销、销售和金融等领域，用于保护业务或产品免受恶意软件和黑客攻击。高效的入侵检测、恶意代码分析和取证识别策略至关重要，因为网络犯罪在保护和隐私方面持续构成日益严重的担忧。本章讨论了机器学习和深度学习方法如何用于推进网络安全目标，如识别、建模、跟踪和分析，以及保护敏感数据和安全系统免受各种威胁。然后，根据所使用的方法论，总结并分析了一些近期的相关研究论文。最后，提出了未来的研究课题范围，其中包括可以使用\
  \ `ML` 和 `DL` 方法解决的各种网络安全问题。\n\n#### 关键词\n\n网络安全；网络攻击；机器学习；入侵检测；深度学习；生物识别；分类\n\n\
  ### 1：引言\n\n如今，许多组织要求员工远程工作和/或限制出差。此外，黑客利用这一点加强了他们的行动。随着越来越多的员工继续在家工作，维持和保持严格的安全控制可能会更加困难。由于支持互联网的设备增加，攻击面也随之扩大，这导致风险增加。此外，攻击者变得更加先进，创造出绕过安全措施的零日漏洞和恶意软件，使它们能够长时间不被发现。零日漏洞是以前未曾观察到的威胁，但也是成熟攻击手法的变体\
  \ ¹⁸²\n\n由于全球互联和利用云存储来存储个人信息和其他数据，网络安全风险正在增长。由于云应用程序/服务缺乏配置，组织遭受日益复杂的网络犯罪分子的网络攻击。网络威胁能够在公司的任何阶段产生。网络诈骗（如网络钓鱼和勒索软件）会损害敏感数据\
  \ ¹⁸³\n\n\n\n如今，无论是个人、小型企业还是大型公司，都在所有方面依赖计算机。当计算机与云计算相结合时，云安全、移动电话和物联网中的风险会因网络安全风险而影响到每个人。由于攻击者日益高明以及黑客可利用的工具增多，网络安全已成为当今最具挑战性的领域之一。它是算法、技术和策略的集合，这些要素协同工作，通过保护网络、资源、应用程序和数据的隐私性、机密性和可用性来保障其安全。恶意软件、数据泄露、社会工程学、网络钓鱼、SQL\
  \ 注入、内部威胁、拒绝服务攻击和高级持续性威胁都是常见的网络安全威胁 ¹⁸⁴\n\n本章涵盖了机器学习和深度学习技术在网络安全中的各种应用。它还探讨了机器学习和深度学习技术在网络安全系统的设计、运行和发展中的应用，以及该领域未来的研究与开发前景。增强网络安全系统功能的各类生物识别应用也在本章中有所介绍。本章讨论了机器学习和深度学习技术如何应用于危害系统、网络、应用程序和数据的各类攻击。它还提供了利用机器学习和深度学习方法识别网络攻击的深入分析。此外，它还论述了机器学习和深度学习技术在网络安全架构中的应用，以及各类新应用的训练过程。\n\
  \n#### 1.1：网络攻击的类别\n\n犯罪分子的手段日益复杂，以下是每天影响众多社区的几种攻击。网络威胁包括勒索软件攻击，它劫持关键业务工具以勒索赎金解锁；也包括秘密行动，黑客入侵系统以窃取宝贵数据。\n\
  \n##### 1.1.1：恶意软件\n\n恶意软件一词指代勒索软件、病毒和间谍软件等恶意程序。它通常通过利用系统缺陷渗透网络，例如点击电子邮件中的可疑链接或下载危险程序。一旦进入网络，恶意软件可窃取机密信息、在系统内生成更多恶意软件，甚至阻断对关键网络组件的访问\
  \ ¹⁸⁵\n\n##### 1.1.2：网络钓鱼\n\n网络钓鱼是指发送看似来自知名、可信来源的恶意消息。为消除疑虑并诱使受害者点击危险链接，这些消息会使用与企业相同的徽标、名称等。点击钓鱼链接后，网络犯罪分子便能获取登录凭证和信用卡号等机密数据\
  \ ¹⁸⁶\n\n##### 1.1.3：社会工程学\n\n社会工程学是通过心理操纵诱导人们泄露机密数据的手段。网络钓鱼是其一种形式，犯罪分子利用人们天生的好奇心或信任感牟利。语音操纵是社会工程学的典型例子，犯罪分子获取个人语音并加以篡改，致电其亲友索要个人或机密数据\
  \ ¹⁸⁷\n\n##### 1.1.4：中间人攻击\n\n当攻击者拦截双方之间的信息流动时，就会发生中间人攻击。例如，犯罪分子可能将自己置于公共 Wi-Fi\
  \ 网络与用户计算机之间。如果受害者未使用安全的 Wi-Fi 连接，网络犯罪分子还可能在不被发现的情况下窃取受害者的所有详细信息 ¹⁸⁸\n\n##### 1.1.5：零日攻击\n\
  \n此类攻击日益普遍。此类攻击发生在网络漏洞披露与补丁方案应用之间的时间窗口内。大多数组织会出于公开和安全的原则宣布发现其网络安全存在问题，但黑客会利用这个机会在组织发布安全修复前发动攻击\
  \ ¹⁸⁹\n\n### 2：生物识别技术在网络安全中的应用\n\n生物识别技术是未来数据保护和网络安全的理想选择。为获得对受保护设备的访问权限，生物识别保护使用特定的身体特征。生物识别保护采用人脸、虹膜和指纹识别等方法来验证个人身份并监控对机密数据的访问，而非使用可能被泄露或窃取的密码。生物识别扫描仪是采集数据以验证个人身份的专用硬件设备\
  \ ¹⁹⁰\n\n![Fig. 1 Taxonomy of biometrics.](img/f10-01-9780323852098.jpg)\n\n图 1\
  \ 生物识别技术分类。\n\n然而，在一个日益无纸化的世界中，不得不开发出更复杂的方法来识别和认证个人。鉴于全球恐怖主义、网络黑客攻击和复杂有组织犯罪手段的风险日益上升，这一点尤为真实。生物识别安全已确立为认证、识别和验证方面最先进的可用技术。生物识别认证的基本原理是每个人都是独特的，并可通过内在或行为特征来界定。生物识别技术可基于特定面部特征、指纹、签名、DNA\
  \ 识别个人，从而提供一种安全便捷的认证方法 ¹⁹¹\n\n生物识别学是通过测量和统计分析研究个人身体和行为特征的学科。生物识别是基于一个或多个生理或行为特征来区分个人的手段。该信息用于识别用户并授予访问权限。用户青睐生物识别系统，因为信息载体始终随身携带，不会丢失或被伪造\
  \ ¹⁹²\n\n#### 2.1：指纹扫描\n\n人类指纹由手指表面的脊和谷组成，因人而异，可用于识别个人。手指表皮上层段称为脊，下层段称为谷。脊和沟的各种模式、细节特征点决定了指纹的唯一性\
  \ ¹⁹³\n\n![Fig. 2 Fingerprint identification process.](img/f10-02-9780323852098.jpg)\n\
  \n图 2 指纹识别过程。\n\n光学和超声波等新技术正在开发中，用于在用户识别过程中采集指纹以进行认证。识别指纹使用两种关键算法：细节特征匹配和模式匹配。细节特征匹配通过匹配提取的细节特征来寻找一位用户指纹与另一位用户指纹的差异。用户向设备注册时，可采集其手指表面的细节特征位置和方向。指纹识别设备通过比较显示的细节特征图像与访问时提供的图像来验证用户身份。模式匹配不是比较某个特定点，而是比较手指的所有表面。它关注手指表面的厚度、密度和曲率。采用此方法时，手指表面图像将包括细节特征点周围区域、低曲率半径区域和异常脊组合\
  \ ¹⁹⁴\n\n\n\n使用指纹识别设备具有广泛的优势。该系统易于运行和设置。它需要低成本设备且功耗低。然而，该系统也存在一些缺点。如果手指表面有损伤和标记，识别会变得更加困难。设备通常要求用户手指表面具有特征点或细节以进行图像匹配。这将成为算法安全性的绊脚石。指纹认证系统通常用于广泛的应用，如手机、笔记本电脑和其他设备。这类系统主要用于法律系统，以记录用户详细信息并核实其身份¹⁹⁵\n\
  \n#### 2.2：语音识别\n\n图 3 展示了语音识别方法的流程图。在语音识别中，将口语短语与数字原型进行比较。它用于安全系统，如门禁控制和考勤监控，以识别和认证用户。设备生成的数字模板极有可能被正确解读。一个人的语音的生理和行为特征是独特的。喉咙、口腔、鼻腔、喉部的大小和形状以及体重影响生理方面。语言、教育水平和居住地都影响行为特征，可能导致独特的语调、口音和方言¹⁹⁶\n\
  \n![图 3 语音识别方法](img/f10-03-9780323852098.jpg)\n\n图 3 语音识别方法。\n\n通常有两个关键参数区分个人的语音。首先是称为声道的生理部分。另一方面，语音口音是行为方面。在大多数情况下，当所有这些变量结合时，无法准确模仿另一个人的声音。生物识别技术利用这些特征开发了仅使用个人声音来验证其身份的语音识别系统。由于声道是生理特征的一个特殊特征，语音识别将主要关注它。它在用户物理访问控制方面表现良好。\n\
  \n语音识别系统易于设置，所需设备极少。麦克风、电话麦克风甚至电脑麦克风都是此类设备的例子。然而，仍有一些变量可能影响系统效率。首先，用户录制语音到数据库时的表现至关重要。因此，会要求人员重复说一段简短的短语和/或句子；因此，机器可以更可靠地分析他们的声音。未经授权的用户能够录制授权用户的声音并通过认证过程以获得设备访问控制。为了防止通过录音设备非法访问，语音识别系统将在认证期间要求人员重复设备生成的随机句子/单词¹⁹⁷\n\
  \n##### 2.2.1：语音说话人识别\n\n确定匿名说话人身份的过程称为识别。在说话人识别中，语音将与 N 个模式进行 1:N（多对一）匹配。说话人识别系统还可用于对话中的说话人分类，并在用户不知情的情况下检查用户是否已在系统中注册等。在取证应用中，通常从说话人识别方法开始生成最佳匹配列表，然后经过一系列验证步骤以找到确定的模式。\n\
  \n##### 2.2.2：语音说话人验证\n\n它是利用语音作为评估说话人身份以进行访问控制的手段。这里，当用户的语音与称为声纹或语音模型的单个原型匹配时，会发生\
  \ 1:1 匹配。说话人认证常用于允许访问电话银行等系统。这些系统在用户知情的情况下工作，通常需要他们的参与。\n\n#### 2.3：人脸识别\n\n它使用面部特征进行人员身份的识别和验证。这里，使用高分辨率摄像头捕获面部的二维或三维图像。计算眉毛、眼睛、鼻子、下巴、嘴唇、耳朵的轮廓及其之间的距离，并可根据面部旋转、倾斜、面部表情等修改图像。一个人的面部图像存储在数据库中，这是比较不同人员照片所必需的¹⁹⁸\n\
  \n人脸是生物识别安全系统中用于识别用户的最简单特征之一。这项技术常用是因为它不涉及用户与计算机之间的物理交互。对于认证，摄像头检查用户的面部并将其与数据库进行比较。它也易于设置，不需要任何昂贵的硬件。面部扫描软件常用于许多安全系统，包括物理访问控制和设备用户账户。然而，它不如其同类（如视网膜、虹膜或\
  \ DNA）独特。因此，它通常与其他机器特征结合使用¹⁹⁹\n\n#### 2.4：签名识别\n\n它是通过分析笔迹风格（特别是签名）来验证个人身份的过程。使用一支笔和一个连接到计算机的特殊设备来匹配和验证模式。高质量设备可以记录签名速度、压力和时间等行为特征。个人必须在平板上多次书写以收集数据。签名识别算法提取时间、压力、速度、笔画方向、签名路径和大小。算法给这些点分配不同的权重。静态和动态数字手写签名认证是两种主要风格²⁰⁰\n\
  \n#### 2.5：虹膜扫描与识别\n\n它是扫描虹膜图案的过程。虹膜因其独特性被转换为数字代码。由于虹膜上可能出现老年斑和变色，因此使用黑白图像。人眼的虹膜是眼中一个细长的圆形结构，调节瞳孔的大小和直径。它还调节到达视网膜的光量，以保护眼睛的视网膜。虹膜颜色是因人而异的变量，由遗传决定。一个人的虹膜颜色决定了其眼睛的颜色²⁰¹\n\
  \n![图 4 虹膜扫描与识别](img/f10-04-9780323852098.jpg)\n\n图 4 虹膜扫描与识别。\n\n虹膜有多种颜色，包括棕色（最常见）、灰色、蓝色、灰色、琥珀色、紫罗兰色和粉色。虹膜有其自己的图案，这造就了每个人的独特性。虹膜识别系统使用多种方法扫描虹膜。将检查虹膜上的约\
  \ 200 个点，如环纹、沟纹、雀斑和其他特征。每个人的信息存储在数据库中，当用户想要访问系统时进行比较。\n\n虹膜识别系统是当今广泛使用的安全系统。它独特且能快速识别用户。尽管设备需要昂贵的设备，但它也是识别客户最简单、最快捷的方式。在验证过程中，用户与设备之间不应有物理接触²⁰²\n\
  \n#### 2.6：静脉识别\n\n\n\n\n该技术采用模式识别技术，基于在手指皮下部分发现的人类静脉样本照片。由于静脉模型位于皮肤表面之下，因此无法伪造。指静脉识别通过捕获指静脉样本并利用红外线将其与模型进行匹配来工作。图\
  \ 5 展示了指静脉扫描和识别系统。\n\n![图 5 静脉扫描和识别。](img/f10-05-9780323852098.jpg)\n\n图 5 静脉扫描和识别。\n\
  \n静脉识别设备是一种相对较新的生物识别技术。将血液输送回心脏的血管称为静脉。每个人静脉的物理和行为特征都是独特的。生物识别技术利用这一特点，通过静脉的独特特征来区分身份。用户手部的静脉是静脉识别系统的主要研究对象。每个人的手指都有直接连接心脏的静脉，并拥有其自身的物理特征。用户的静脉位于人体内部，这与其他生物识别系统不同。因此，识别系统将利用光透射来捕获用户指尖内部静脉图案的图像。该方法涉及让近红外光穿过手指以获取更多细节，并用相机记录静脉图案\
  \ ²⁰³。\n\n专家们更加关注静脉识别系统，因为它们拥有许多其他生物识别技术所缺乏的附加功能。它具有更高级别的防护，能够更好地保障信息安全和访问控制 ²⁰⁴。\n\
  \n#### 2.7：DNA 生物识别系统\n\n图 6 说明了 DNA 匹配过程。生物识别认证最可靠的方法是使用一个人的 DNA 密码。它基于人类脱氧核糖核酸链的特殊序列。该过程从\
  \ DNA 样本的制备开始，如口腔拭子、唾液、精液、血液和其他组织。对样本进行分析，建立 DNA 概况，并通过与另一个样本比较来验证身份。由于每个人的 DNA\
  \ 都不同，因此很难模仿这一特征。每个人的 DNA 都携带从父母那里遗传来的遗传特征。这种 DNA 在人体的每个细胞中都被复制。DNA 分析可以计算出在多个不同位点重复的变异数目串联重复（VNTR）的数量。一个人的\
  \ DNA 概况由 VNTR 的数量组成。该系统需要时间，因为它有更复杂的步骤来从每个人身上采集 DNA。首先，它必须采集每个人提供的物理样本中的 DNA。然后，必须将样本分解成包含\
  \ VNTR 的微小片段。随后，计算并排列每个 DNA 片段的大小，然后与其他样本进行匹配 ²⁰⁵。\n\n![图 6 DNA 匹配。](img/f10-06-9780323852098.jpg)\n\
  \n图 6 DNA 匹配。\n\nDNA 生物识别系统具有高度唯一性，超过一个人拥有相似 DNA 概况的可能性极小，且该技术仍相对较新，很少在公共场合使用。它需要使用大量昂贵的设备，以有效地分解\
  \ DNA 并分析 DNA 的特定特征来建立 DNA 概况。为了采集用户的 DNA 数据，系统可能还需要从他们那里获取物理样本（头发、血液等）。导致该系统使用不足的另一个因素是时间。系统完成建立和检查每个人\
  \ DNA 概况的所有过程需要相当长的时间。由于这些缺点和障碍，与其他生物识别系统不同，它没有被广泛使用。未来，这种独特且改进的生物识别技术将用于日常生活 ²⁰⁶。\n\
  \n### 3：网络攻击与机器学习\n\n机器学习擅长某些任务，例如轻松扫描海量数据并利用统计学进行分析。网络安全系统产生海量数据，因此该技术如此有用也就不足为奇了。机器学习已成为网络安全的关键组成部分。机器学习通过模式识别、实时网络犯罪可视化和彻底的渗透测试，主动预防网络威胁并增强安全基础设施。在海量数据和网络安全专业知识稀缺的时代，机器学习似乎是唯一的选择。图\
  \ 7 展示了使用 ML/DL 方法的网络安全系统框图 ²⁰⁷。\n\n![图 7 采用 ML 的网络安全系统框图。](img/f10-07-9780323852098.jpg)\n\
  \n图 7 采用 ML 的网络安全系统框图。\n\n深度学习方法能够识别高度复杂的威胁，且不依赖于记忆已知的签名和标准攻击模式。相反，此类策略可以将可疑行为与其他常见活动区分开来，从而识别恶意软件或安全攻击者。DL\
  \ 是 ML 技术的一个子集，属于 AI 范畴。DL 是一组实现 ML 的技术，用于识别模式，如图像识别。系统主要对物体的边缘、结构、物体类型进行分类，然后识别物体本身。这些算法可以通过强化学习（如\
  \ Q-learning）得到改进以学习模式。由于恶意软件攻击在数量和种类上都在增加，使用传统方法进行防御非常困难。DL 方法提供了创建更高级模型的能力，以自主检测和识别恶意软件。它将针对使用现有恶意软件的小规模攻击者，以及使用新型恶意软件针对组织或个人的大规模攻击者提供防护\
  \ ²⁰⁸。\n\n深度学习技术可应用于各种目的，如入侵检测和防御系统、恶意软件检测、垃圾邮件检测、网络流量监控、网站篡改检测和用户行为分析。在这些领域，DL\
  \ 相比其他方法显示出了重大进展。通常，深度学习方法分为两大类，即监督深度学习和无监督深度学习方法。监督 DL 算法包括全连接前馈深度神经网络（FNN）、卷积前馈深度神经网络（CNN）和循环深度神经网络（RNN）。无监督\
  \ DL 算法包括深度置信网络（DBN）和堆叠自编码器（SAE） ²⁰⁹。\n\n### 4：ML 和 DL 在网络安全中的应用\n\n网络安全系统 ML 模型的分类法如图\
  \ 8 所示。机器学习已成为网络安全的关键组成部分。通过模式识别、实时网络犯罪可视化和彻底的渗透测试，机器学习主动消除网络威胁并增强安全基础设施。以下是可用于执行网络安全任务的各种方法\
  \ ²¹⁰。\n\n![图 8 网络安全 ML 模型分类法。](img/f10-08-9780323852098.jpg)\n\n图 8 网络安全 ML 模型分类法。\n\
  \n#### 4.1：回归\n\n\n\n\n它也被称为预测。利用当前的数据信息以获取对新数据的感知。它被用于网络安全中的欺诈检测。特征（如可疑交易总额、位置等）决定了欺诈行为的可能性。当涉及回归的技术方面时，有两大类需要考虑：机器学习和深度学习。\n\
  \n#### 4.2：分类\n\n分类过程也很简单。假设你有两堆照片，每堆按形式分类（例如，狗和猫）。垃圾邮件过滤器将垃圾邮件与其他邮件分开，可被视为网络安全方面的一个例子。垃圾邮件过滤器绝对是应用于网络安全任务的第一个机器学习解决方案。在特定组别的示例已知的情况下，监督学习技术常用于分类。一开始，所有类别都应被指定。当数据量更大时，深度学习方法表现更好。然而，它们消耗更多能源，特别是如果它们用于生产环境并定期重新训练系统的话\
  \ ²¹¹\n\n#### 4.3：聚类\n\n聚类和分组有些相似，但有一个巨大的区别。没有关于数据分组的详细信息。无法知道这些信息是否可以被分类。这被称为无监督学习。取证分析被认为是聚类的最佳任务。事件的原因、路径和后果都是未知的。为了发现异常，必须对所有行为进行分类。它可用于在恶意软件检测解决方案中区分合法文件与异常值（例如，恶意软件安全或受保护的电子邮件网关）。用户活动分析是另一个可以使用聚类的有趣领域。在这种情况下，程序用户聚集在一起，以确定他们是否被分配到特定组别。通常，聚类通常不用于解决特定的网络安全任务，因为它只是流水线中的一个子任务\
  \ ²¹²\n\n#### 4.4：关联规则学习\n\n它是一种基于规则的机器学习方法，可用于发现关系。该理论可专门用于网络安全中的事件响应。如果一个组织经历了一波事件并提供了不同类型的响应，系统会学习针对特定事件的一种响应形式。如果风险评估软件根据漏洞的定义为新漏洞分配风险值，它也可能是有利的。该系统利用历史漏洞数据库的数据来发现漏洞关联规律，并将其应用于漏洞风险评估。该系统将基于历史数据库定义攻击规则，并可应用于检测系统中的攻击\
  \ ²¹³\n\n#### 4.5：降维\n\n它是极其重要的过程之一，网络安全系统高度需要它，以减少分类特征并提高预测模型的准确性。它可以帮助应对并消除不必要的功能\
  \ ²¹⁴\n\n#### 4.6：生成模型\n\n生成模型的角色与前面描述的那些不同。这些模型将基于先前的决策模拟真实数据，而某些任务处理当前的知识和相关决策。进攻性网络防护的基本任务是创建一个输入参数列表，以评估特定应用程序的注入漏洞。它是一种无监督学习方法，可以通过考虑大量现有样本来针对某种现象进行训练，然后生成新样本。此类的最佳例子是生成对抗网络、深度自回归网络和变分自编码器\
  \ ²¹⁵\n\n### 5：基于机器学习的网络安全系统\n\n#### 5.1：使用机器学习的网络防护系统\n\n网络安全是一组专注于特定协议的解决方案，例如以太网、无线网络和虚拟网络（如\
  \ SDN）。入侵检测系统（IDS）解决方案通常被称为网络安全 ²¹⁶\n\n#### 5.2：用于端点防护的机器学习\n\n端点检测与响应（EDR）是最新一代杀毒软件。最好从进程的行为中学习属性/特征。机器学习解决方案将根据端点类型（如服务器、工作站和物联网设备）而有所不同。端点有其自身的特征集，但有些任务是通用的，例如回归以预测可执行进程的下一个设备调用并将其与实际调用进行比较，分类将应用程序/程序分类为恶意软件和间谍软件等类别，以及用于稳定电子邮件网关上的恶意软件安全的聚类\
  \ ²¹⁷\n\n#### 5.3：用于应用安全的机器学习\n\n机器学习算法可应用于各种应用程序，如 Web 应用程序、数据库和云应用程序，以提供安全性。在不久的将来，无法开发出一种能高效应对所有威胁的通用机器学习模型\
  \ ²¹⁸\n\n#### 5.4：用于用户行为的机器学习\n\n用户与实体行为分析（UEBA）利用海量数据集来建模网络中人类和机器的典型与非典型行为。它通过识别此类基线，用于识别可疑活动、潜在风险和常规杀毒程序无法检测到的攻击。由于它分析不同的行为趋势，它可以检测非恶意软件攻击\
  \ ²¹⁹\n\n用户行为是一种动态层和无监督学习问题，专注于通用攻击和训练分类器的能力。在大多数情况下，没有标记数据集或关于要寻找什么的指示。因此，为所有用户设计一个通用算法是用户行为行业的一项艰巨任务。回归和分组可用于识别用户行为中的异常（例如，在异常时间登录），聚类可用于隔离用户群体并检测异常值，而分类可用于识别不同用户\
  \ ²²⁰\n\n#### 5.5：用于进程行为的机器学习\n\n最后但同样重要的是进程领域。为了发现异常，在处理业务流程时最好先了解它。业务流程可能差异很大，因为欺诈可能发生在银行和零售系统中，也可能发生在制造工厂的车间里。两者截然不同，且需要大量的领域知识。要在机器学习中取得成果，需要特征工程。同样，每种方法都有其自身的特征集。一般来说，进程领域的活动包括回归，它预测下一个用户行为并检测信用卡欺诈等异常值；分类检测已识别形式的欺诈；聚类比较业务流程并检测异常值\
  \ ²²¹\n\n### 6：基于深度学习的网络安全系统\n\n#### 6.1：入侵检测/入侵防御（ID/IP）系统\n\nID/IP 系统检测网络中的恶意活动，防止入侵者访问网络，并提醒用户。公认的签名和常见攻击形式常被用于识别它们。这在数据泄露等风险情况下很有用。通常，机器学习算法最初被用于执行此任务。然而，这些方法导致系统产生大量误报，使防护团队的工作更加困难并导致过度疲劳\
  \ ²²²\n\n\n\n\n# 用于入侵检测与防御的深度学习\n\n深度学习（DL）、卷积神经网络（CNN）和循环神经网络（RNN）可用于构建更先进的 ID/IP\
  \ 系统，通过更准确地评估流量并区分恶意与非恶意网络活动。令人印象深刻的解决方案包括下一代防火墙（NGFW）、Web 应用防火墙（WAF）和 UEBA。为了识别已知威胁，ID/IP\
  \ 系统使用基于规则和基于特征的控制。对手可以通过更改恶意软件特征轻松绕过传统的网络 ID/IP 系统。基于深度神经网络的系统已被用于解决传统安全用例，如恶意软件和间谍软件检测\
  \ ²²³\n\n#### 6.2：恶意软件检测\n\n标准防火墙通过基于特征的检测方案来检测恶意软件。公司维护一个已识别威胁的数据库，并定期更新以纳入新近出现的威胁。虽然该策略对这类威胁效果良好，但难以应对更复杂的威胁。DL\
  \ 算法无需调用现有特征或攻击样本即可检测更复杂的威胁。相反，它们学习网络行为，并能发现可能预示着不良行为者或恶意软件存在的可疑活动 ²²⁴\n\n#### 6.3：社会工程学与垃圾邮件检测\n\
  \n社会工程学攻击通常需要心理操纵，以说服毫无戒备的消费者或员工泄露机密或敏感信息。通常，社会工程学包含一封电子邮件或其他联系方式，在受害者心中灌输紧迫感、恐惧或其他相关情绪，导致受害者泄露机密信息或点击恶意链接\
  \ ²²⁵\n\n#### 6.4：网络流量分析\n\n在分析 HTTPS 流量以搜索恶意行为时，深度学习算法显示出了良好的效果。这在应对各类网络威胁（如 SQL\
  \ 注入和 DoS 攻击）方面极为有用 ²²⁶\n\nAlice 与目标服务器之间的通信过程如图 9 所示。Alice 通过请求通往服务器的路由发起联系。AES\
  \ 加密路径由 TOR 网络提供。该路径在 TOR 网络内随机生成。数据包的加密路径以红色高亮显示。简单数据包被传递给服务器，直到到达出口节点，即 TOR 网络的边缘节点。在每个接收阶段，数据包均使用密钥解密。解密后会暴露下一个目标中继地址。此过程持续直到到达\
  \ TOR 网络的出口节点，此时数据包的加密终止，并将一个简单的 HTTP 数据包转发给目标服务器 ²²⁷\n\n![图 9 TOR 网络中的客户端-服务器通信。](img/f10-09-9780323852098.jpg)\n\
  \n**图 9** TOR 网络中的客户端-服务器通信。\n\nTOR 的创建旨在保护用户隐私。企业网络通过不允许安装 TOR 客户端或阻断入口节点 IP 地址来封锁\
  \ TOR 流量。然而，对手和恶意软件有多种方式接入 TOR 网络并利用其发送数据和信息。封锁 IP 地址并非明智之举。对手可能生成不同的 IP 来进行通信。可通过分析流量数据包来检测\
  \ TOR 流量。此项检测可在 TOR 节点上进行，也可在客户端与入口节点之间进行。每个流由源地址、源端口、目的地址和目的端口组成的元组构成。\n\n#####\
  \ 6.4.1：实验数据\n\n数据研究所用数据获自新不伦瑞克大学。其数据由对大学互联网流量回顾分析所得特征组成。表 1 显示了从数据中提取的元数据。除这些之外，还使用了其他基于流的参数。图\
  \ 10 描绘了数据集中的一个代表性示例。\n\n**表 1** 元信息参数说明。\n\n| 元信息参数 | 参数解释 |\n| --- | --- |\n|\
  \ FIAT | 前向包间到达时间，指前向发送的两个数据包之间的时间间隔（均值、最小值、最大值、标准差）。 |\n| BIAT | 后向包间到达时间，指后向发送的两个数据包之间的时间间隔（均值、最小值、最大值、标准差）。\
  \ |\n| FLOWIAT | 流包间到达时间，指任一方向发送的两个数据包之间的时间间隔（均值、最小值、最大值、标准差）。 |\n| ACTIVE | 流在变为空闲前保持活动状态的时间量（均值、最小值、最大值、标准差）。\
  \ |\n| IDLE | 流在变为活动前保持空闲状态的时间量（均值、最小值、最大值、标准差） |\n| FB PSEC | 流字节每秒。流数据包每秒。时长：流的持续时间。\
  \ |\n\n![图 10 数据集实例。](img/f10-10-9780323852098.jpg)\n\n**图 10** 数据集实例。\n\n实例中已删除协议字段、源\
  \ IP/端口和目的 IP/端口。使用具有 N 个隐藏层的深度前馈神经网络处理所有其他特征。神经网络架构如图 11 所述。\n\n![图 11 使用 DL 网络进行流量检测。](img/f10-11-9780323852098.jpg)\n\
  \n**图 11** 使用 DL 网络进行流量检测。\n\n隐藏层数量从 2 到 10 不等。N = 5 被认为是最佳数量。所有隐藏层均使用 ReLU 作为激活函数。隐藏层默认为稠密层，维度为\
  \ 100。输出节点由 Sigmoid 函数激活。DL 模块在后端使用 Keras 和 TensorFlow 进行训练。FFN 使用二元交叉熵损失进行优化。模型使用不同的轮数进行训练。图\
  \ 12 描绘了一次训练模拟，随着轮数增加，效率提升且损失值最小化。\n\n![图 12 网络训练过程统计。](img/f10-12-9780323852098.jpg)\n\
  \n**图 12** 网络训练过程统计。\n\n将 DL 系统的结果与其他估计器进行比较。使用召回率、精确率和 F-Score 等标准分类指标衡量估计器的效率。所提出的基于\
  \ DL 的框架在检测 TOR 类别方面表现良好。对于非 TOR 类别样本，基于 DL 的方法显示出了最小化误报案例的效果 ²²⁸\n\n**表 2** 用于流量检测的\
  \ ML 和 DL 模型性能。\n\n| 使用的分类器 | 精确率 | 召回率 | F-Score |\n| --- | --- | --- | --- |\n\
  | 逻辑回归 | 0.86 | 0.86 | 0.86 |\n| SVM | 0.91 | 0.91 | 0.91 |\n| 朴素贝叶斯 | 0.92 | 0.62\
