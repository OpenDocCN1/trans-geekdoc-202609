  \ alt=\"表 2\" /></p></div>\n\n\n\n\n在各种分类器中，随机森林（RF）和基于深度学习（DL）的方法表现优于其他方法。该性能基于\
  \ 55,000 个训练场景。与传统的基于 DL 的系统相反，本实验使用的数据集相对有限。随着训练数据的增长，基于 DL 和 RF 的分类器输出均有所改善。另一方面，对于大型数据集，基于\
  \ DL 的分类器通常优于其他分类器，并且可推广至同类应用。例如，若需要某分类器检测 TOR 所使用的应用，仅需重新训练输出层，而其他层将保持不变。\n\n#####\
  \ 6.5：网站篡改检测\n\n篡改攻击会改变网站的内容，从而修改网站的外观。这是对企业、机构和政府网站及 Web 应用程序最重大的威胁之一。基于深度学习的解决方案可通过利用正常和被篡改的网页作为训练数据来构建检测配置文件，从而执行检测\
  \ ²²⁹\n\n### 7：结论与未来展望\n\n一方面，机器学习在保护计算机系统方面并非**灵丹妙药**。毫无疑问，存在许多可解释性问题，尤其是在深度学习算法的情况下。然而，随着数据量的增加和专家数量的减少，机器学习是唯一的解决方案。它当前行之有效，在不久的将来也将被需要。最好立即着手开始。另一个值得注意的要点是，黑客越来越多地在攻击中使用机器学习。\n\
  \n随着 AI 和网络空间安全的快速发展，AI 与网络空间安全的融合将呈现越来越多的应用场景。未来，针对集成网络防护和 AI 技术，存在一系列令人振奋且开放的课题。未来的研究应考虑攻击生命周期中恶意活动的级联关系，如入侵、篡改和数据窃取。有各种指标用于评估\
  \ DL 在网络安全任务中的成功程度。然而，由于训练和研究使用了不同的数据集，无法对所有不同方法进行公平评估。因此，基准数据集对于推动深度学习在网络安全领域的发展至关重要。因此，本综述的目的是创建一份有用的成果，使研究人员能够推进网络安全系统中\
  \ ML 和 DL 的最新技术水平。\n\n### 参考文献\n\n## 第 11 章：基于加密方案的可逆数据隐藏技术在智能环境中的安全生物特征认证系统\n\n\
  V.M. Manikandan ^()计算机科学与工程，SRM 大学-AP，阿马拉瓦蒂，安得拉邦，印度\n\n### 摘要\n\n生物特征认证在所有智能环境中均发挥了其最大潜能。人脸识别和指纹识别是生物特征认证最流行的两种方法。在需要更高安全级别的场所，可配备人脸识别和指纹识别相结合的方式。通常，从客户端收集生物特征数据（使用摄像头和指纹扫描仪），并将该信息传输给云服务提供商以执行复杂任务，如人脸识别和指纹识别。在此类情况下，人脸图像和指纹从客户端传输到服务器是一个主要顾虑，因为入侵者可能试图窃取该信息，随后利用该信息控制认证系统。在本章中，我们将讨论一种通过加密方案利用可逆数据隐藏（RDH）安全发送人脸图像和指纹的机制。RDH\
  \ 是一种利用载体隐藏某些数据的过程，使得后续能够提取隐藏消息并恢复原始图像。在基于加密的 RDH 方案中，RDH 过程和图像加密过程将合并为单一任务，以在图像中隐藏秘密消息。在本章中，我们提出一种新模型，其中将压缩后的指纹数据作为秘密消息，通过基于加密的可逆数据隐藏方案嵌入人脸图像中。经过基于加密的\
  \ RDH 处理后获得的加密图像将被传输给云服务提供商以进行进一步处理。\n\n#### 关键词\n\n可逆数据隐藏；生物特征认证；云计算；信息安全；图像加密\n\
  \n### 1：引言\n\n过去几年来，基于人脸识别的认证系统被部署在各种场所，以确保授权人员进入受限区域。即使在今天，物联网（IoT）控制的智能家庭中基于人脸识别的认证也非常普遍\
  \ ²³⁰\n\n1.  使用数码相机捕捉人员图像\n2.  从人员图像中检测人脸区域\n3.  将检测到的人脸特征与数据库中的特征进行比对并识别人员。\n\n\
  请注意，已认证人员的人脸图像特征也应安全存储，由于资源有限，在客户端存储将比较困难。这些问题通过一项称为云计算的关键技术得以解决。目前有许多云服务提供商可提供充足的存储和计算设施。因此，如今大多数人或公司都使用云存储来保存生物特征数据，如人脸图像\
  \ ²³¹\n\n在人脸检测和人脸识别等领域有大量研究正在进行。人脸识别的主要挑战包括从低光照图像中识别人脸、人脸某部分可能被其他物体遮挡、戴眼镜或帽子的人脸识别等\
  \ ²³²\n\n与人脸识别系统类似，指纹识别是一种被普遍接受的生物特征认证方案，用于办公室考勤或为受限区域提供访问权限 ²³³\n\n指纹和人脸识别的结合可用于需要提供更高安全级别的场所\
  \ ²³⁴\n\n在过去三十年里，数据隐藏是安全数据传输领域广泛研究的课题。在该方案中，秘密消息将使用载体进行隐藏，载体可以是任何数字数据，如图像、音频和视频。\n\
  \n在本章中，我们提出一种新模型，用于通过基于加密的 RDH 方案安全传输人脸图像和指纹 ²³⁵\n\n![Fig. 1 The proposed framework.](img/f11-01-9780323852098.jpg)\n\
  \n图 1 拟议框架。\n\n拟议方案的创新点列举如下：\n\n*   在生物特征安全领域引入了 RDH 方案。\n*   拟议方案在加密过程中将压缩的指纹细节嵌入人脸图像中。这确保了指纹的安全通信并保护了人脸图像的机密性。\n\
  *   我们引入了游程编码和 Elias gamma 编码过程用于指纹压缩。\n\n\n\n\nThe rest of this chapter is organized\
  \ as follows: Section 2 discusses the literature review in detail; Section 3 details\
  \ the proposed scheme; Section 4 gives the illustrative description; Section 5 details\
  \ the experimental study and result analysis; Section 6 concludes the chapter.\n\
  \n### 2 Literature Review\n\nRDH is an active area of research in the field of information\
  \ security. RDH schemes allow us to hide some secret messages in digital content\
  \ for secure transmission. At the receiving end, the original cover content can\
  \ be recovered while extracting the hidden message. Existing RDH schemes are mainly\
  \ used for the following two applications:\n\n1.  **Medical image transmission**:\
  \ In medical image transmission, RDH schemes are used to transmit patient records\
  \ along with the medical image [[236]](#fn236).\n2.  **Cloud service providers**:\
  \ Cloud service providers use RDH schemes to hide some additional metadata information\
  \ in the digital content uploaded by users to the cloud. Since the data uploaded\
  \ by users should be returned to the cloud user as it is, the cloud service provider\
  \ should not make any permanent changes to the uploaded data. In this case, the\
  \ cloud service provider can use RDH schemes [[237]](#fn237).\n\nExisting RDH schemes\
  \ can be broadly classified into three categories:\n\n1.  **RDH on natural images**:\
  \ In the data hiding process, the data hider will change the original pixel values.\
  \ Famous RDH schemes based on natural images are based on the concepts of histogram\
  \ shifting, difference expansion, etc. Some other schemes are also available [[238]](#fn238).\n\
  2.  **RDH on encrypted images**: In this scheme, the data hider will get an encrypted\
  \ image and will modify the encrypted pixels in the RDH process. There are mainly\
  \ two methods of RDH on encrypted images: vacating room before encryption and vacating\
  \ room after encryption [[239]](#fn239).\n3.  **RDH through encryption**: In this\
  \ scheme, RDH will take place in the process of encryption of the image. The RDH\
  \ process will be fine-tuned so that data hiding in the encryption process is possible\
  \ [[240]](#fn240).\n\nIn our proposed scheme, we have adopted the RDH through encryption\
  \ scheme, where the face image captured by the camera is treated as the original\
  \ image and the compressed fingerprint data is treated as the data. By using the\
  \ RDH through encryption scheme, the fingerprint data will be embedded in the face\
  \ image. Finally, we will get an encrypted image with a hidden message.\n\nRDH through\
  \ encryption was introduced in 2018. An overview of existing RDH through encryption\
  \ schemes is given in Table 1.\n\n**Table 1** Overview of existing RDH through encryption\
  \ schemes.\n\n| Scheme | Basic Method |\n| :--- | :--- |\n| Scheme [[241]](#fn241)\
  \ | • Uses three different encryption and/or decryption keys.<br>• Can embed a single\
  \ bit in a block of size B × B pixels.<br>• Entropy is used as a key metric for\
  \ image recovery. |\n| Scheme [[242]](#fn242) | • Uses three different encryption\
  \ and/or decryption keys.<br>• Can embed a single bit in a block of size B × B pixels.<br>•\
  \ Uses a trained Support Vector Machine model (SVM) for data extraction and image\
  \ recovery. |\n| Scheme [[243]](#fn243) | • Uses three different encryption and/or\
  \ decryption keys.<br>• Can embed three bits in a block of size B × B pixels.<br>•\
  \ Ensures 0 bit error rate in image recovery.<br>• Uses a trained Support Vector\
  \ Machine model (SVM) for data extraction and image recovery. |\n\n<div class=\"\
  small_device\"> <p class=\"table_fig\"><img src=\"images/B978032385209800002X/t0010.png\"\
  \ alt=\"Table 1\" /></p></div>\n\n### 3 Proposed Scheme\n\nThis section details\
  \ the proposed scheme. The scheme will be used for a biometric authentication system\
  \ in which we use a cloud service provider to store the details of authenticated\
  \ personnel. The proposed scheme adopts a two-level authentication scheme using\
  \ face recognition and fingerprint recognition for authentication. During enrollment\
  \ and authentication, the user's face image and fingerprint must be transmitted\
  \ to cloud storage. To securely transmit biometric details such as face images and\
  \ fingerprints, we have used the RDH through encryption process scheme. The proposed\
  \ scheme uses an RDH through encryption scheme, which is very similar to the scheme\
  \ reported in reference [[244]](#fn244).\n\n| Step 1 | Capture a color face image\
  \ using a camera |\n| :--- | :--- |\n| Step 2 | Capture a fingerprint using a fingerprint\
  \ scanner |\n| Step 3 | Convert the fingerprint image (grayscale) to its corresponding\
  \ binary image |\n| Step 4 | Apply run-length encoding to the binary fingerprint\
  \ |\n| Step 5 | Encode the run-length sequence using the Elias gamma coding process\
  \ |\n| Step 6 | Hide the compressed fingerprint details in the face image with the\
  \ help of RDH through encryption to obtain an encrypted image with hidden data |\n\
  | Step 7 | Transmit the encrypted face image with fingerprint details to the cloud\
  \ service provider |\n\nOne of the limitations of the RDH scheme is the low embedding\
  \ rate. The fingerprint data is compressed to ensure that the RDH scheme does not\
  \ face any difficulty in embedding the details in the face image. All three color\
  \ planes (i.e., R, G, and B) are extracted separately from the face image, and each\
  \ plane is processed separately while embedding the fingerprint data. Each color\
  \ plane will be divided into non-overlapping blocks, and one bit of data from the\
  \ compressed fingerprint details will be embedded in each block. The output of the\
  \ data hiding phase will finally result in an encrypted image. The encrypted image\
  \ can be securely transmitted to the cloud service provider for storage or authentication\
  \ purposes. The cloud will process the received data and send an authentication\
  \ control message back to the client to activate certain hardware modules, allowing\
  \ the user to enter the restricted area. The sequence of operations at the sender\
  \ side is given in Algorithm 1.\n\n**Algorithm 1: Proposed Algorithm for Hiding\
  \ Fingerprint Data in Face Image**\n\n| Input | Face image F (RGB format), Fingerprint\
  \ image P, and Encryption keys K[1] and K[2] |\n| :--- | :--- |\n| Output | Encrypted\
  \ face image E with embedded compressed version of P |\n\n| 1 | Convert P to its\
  \ corresponding binary image by thresholding and retain in P. |\n| 2 | Find the\
  \ run-length encoding sequence L from the binary fingerprint image P. |\n| 3 | Encode\
  \ the run-length sequence L using the Elias gamma coding scheme to obtain P^c. |\n\
  | 4 | Find all three color planes R, G, and B from the given face image F. Let these\
  \ three color planes be represented as F^R, F^G, F^B. |\n| 5 | Generate two pseudo-random\
  \ integer matrices M⁰ and M¹ based on encryption keys K[1] and K[2]. |\n\n\n\n\n\
  \n#### 算法描述\n\n| 步骤 | 描述 |\n| :--- | :--- |\n| 6 | 将图像颜色平面 $F^R, F^G, F^B$ 划分为大小为\
  \ $B \\times B$ 像素的非重叠块。假设 $F^K[x,y]$ 表示图像块，其中 $1 \\le x \\le \\lfloor R/B \\rfloor$\
  \ 且 $1 \\le y \\le \\lfloor C/B \\rfloor$ 且 $K \\in \\{R, G, B\\}$。每个颜色平面将有 $N$\
  \ 个块，其中 $N = \\lfloor R/B \\rfloor \\times \\lfloor C/B \\rfloor$。人脸图像中的总块数将为 $3N$。\
  \ |\n| 7 | $S = (F^R, F^G, F^B)$ |\n| 8 | $K = 1$ |\n| 9 | While $L \\neq \\phi$\
  \ do |\n| 10 | 从列表 $S$ 中移除第一个颜色平面 $F^K$ 并将其保存在 $G$ 中 |\n| 11 | While $x \\le R-B$\
  \ do |\n| 12 | While $y \\le C-B$ do |\n| 13 | $b = P^c[K]$ // 从 $P^c$ 访问第 $K$ 位\
  \ |\n| 14 | If $b == 0$ then |\n| 15 | 使用 $M⁰[x,y]$ 通过逐像素 XOR 运算加密图像块 $G[x,y]$ |\n\
  | 16 | ElseIf $b == 1$ then |\n| 17 | 使用 $M¹[x,y]$ 通过逐像素 XOR 运算加密图像块 $G[x,y]$ |\n\
  | 18 | EndIf |\n| 19 | $y = y + 1$ |\n| 20 | EndWhile |\n| 21 | $x = x + 1$ |\n\
  | 22 | EndWhile |\n| 23 | 将 $G[x, y]$ 保留在 $F^K$ 的对应位置 |\n| 24 | $K = K + 1$ |\n\
  | 25 | EndWhile |\n| 26 | 组合所有更新后的 $F^K$ 以获得最终加密图像 $E$ |\n| 27 | Output $E$ |\n\n\
  <div class=\"small_device\"> <p class=\"table_fig\"><img src=\"images/B978032385209800002X/t0020.png\"\
  \ alt=\"Unlabelled Table\" /></p></div>\n\n在 Fig. 2 中给出了所提方案的说明性示例。输入将是彩色人脸图像和指纹图像，输出将是包含压缩指纹数据的加密人脸图像。\n\
  \n![Fig. 2 Illustrative example of the proposed scheme.](img/f11-02-9780323852098.jpg)\n\
  \n**Fig. 2** 所提方案的说明性示例。\n\n在所提方案中，用户和云服务提供商应就两个通用的加密和/或解密密钥达成一致，假设为 `K[1]` 和 `K[2]`。一旦云服务提供商接收到包含隐藏数据（隐藏数据基本上是压缩指纹）的加密图像，应执行以下操作序列：\n\
  \n| 步骤 | 描述 |\n| :--- | :--- |\n| Step 1 | 从加密图像中分离出每个颜色平面 |\n| Step 2 | 一次考虑一个平面，并将该平面划分为大小为\
  \ $B \\times B$ 像素的非重叠块 |\n| Step 3 | 按行优先线性顺序访问块，一次考虑一个图像块 |\n| Step 4 | 尝试使用加密密钥\
  \ `K[1]` 和 `K[2]` 生成的伪随机矩阵解密选定的图像块，以获得两个不同的块 `B[1]` 和 `B[2]` |\n| Step 5 | 使用 Algorithm\
  \ 2 中定义的算法计算 `B[1]` 和 `B[2]` 中相邻像素之间的相关性。假设 `M[1]` 和 `M[2]` 是由 Algorithm 2 获得的度量值\
  \ |\n| Step 6 | 相关性值最小的块将被视为正确恢复的块。如果 `B[1]` 是正确恢复的块，我们将从该块中提取 0；如果 `B[2]` 是正确恢复的块，则提取\
  \ 1 |\n| Step 7 | 从所有三个不同的颜色平面恢复所有块（重复 Step 1 到 Step 6）并提取所有隐藏细节。假设提取的位保存在 `M'`\
  \ 中，恢复的彩色图像为 `F` |\n| Step 8 | 应用 Elias gamma 解码过程以获取游程长度数据 |\n| Step 9 | 应用游程长度解码过程以获取实际指纹数据\
  \ `P` |\n| Step 10 | 输出恢复的人脸图像 `F` 和提取的指纹数据 `P` 以供进一步处理 |\n\n提取的指纹和恢复的人脸图像将用于进一步的人脸识别和指纹识别。云服务提供商可以使用任何高效算法进行人脸识别或指纹识别。这些方案的讨论超出了本研究范围。\n\
  \n##### Algorithm 2: Finding the adjacency relationship between pixels\n\n| 项目 |\
  \ 描述 |\n| :--- | :--- |\n| **Input** | 大小为 $B \\times B$ 的图像块 `C` |\n| **Output**\
  \ | `C` 中像素邻接属性的度量值，记为 `M` |\n| Step 1 | 对图像块 `C` 应用量化以获得 `C^Q`，其值范围为 0 到 64 |\n\
  | Step 2 | 从 `C^Q` 中找到直方图 `H` |\n| Step 3 | 在直方图 `H` 中找到峰值并返回峰值的高度，记为 `M` |\n| Step\
  \ 4 | Return `M` |\n\n我们用来区分正确恢复的图像块和错误解密块的关键思想是分析量化后的块。量化过程会将接近的像素值归入同一个桶中。在自然图像（人脸图像）块中，图像块中的像素将非常接近，因此直方图的峰值将很高。但在错误恢复的图像块中，像素将呈随机分布。\n\
  \n### 4: Illustrative examples\n\n为了更好地理解使用游程长度编码和 Elias gamma 编码过程组合进行指纹压缩，此处讨论一个说明性示例。\n\
  \n| 步骤 | 描述 |\n| :--- | :--- |\n| Step 1 | 假设指纹 `F` 是一个大小为 $16 \\times 16$ 位的小图像，如下所示：<br>![t11-01-9780323852098](img/t11-01-9780323852098.jpg)\
  \ |\n| Step 2 | 假设游程长度编码过程将按列优先线性顺序考虑 `F` 的像素值。基本上，第一个位值作为参考，然后游程长度编码过程识别连续 1 或\
  \ 0 的数量。游程长度编码序列如下：<br>![t11-02-9780323852098](img/t11-02-9780323852098.jpg) |\n\
  | Step 3 | 游程长度序列将使用 Elias gamma 编码过程进行编码。要编码一个需要 `N` 位的数字 `P`，我们将在该数字前添加 `(N -\
  \ 1)` 个 0 作为前缀。表示一个 `N` 位二进制数需要 `2·N - 1` 个位。<br>![t11-03-9780323852098](img/t11-03-9780323852098.jpg)\
  \ |\n\n在上述示例中，原始指纹图像的位数为 $16 \\times 16 = 256$ 位。最终 Elias gamma 编码序列的位数为 185，压缩比为\
  \ 1.38。我们可以考虑为实时应用使用其他更好的二值图像压缩技术。\n\n### 5: Experimental study and result analysis\n\
  \n在本文中，我们提出了一种通过加密实现 RDH 方案的应用，用于从用户端到云服务提供商的生物特征数据安全传输。所提算法使用 `Matlab 2020b` 实现，并使用了\
  \ `SOCOFing` 指纹数据集和 `UTKFace` 数据集 ²⁴⁵。\n\n作为实验研究的一部分，我们分析了以下参数：\n\n1.  **Compressed\
  \ ratio (CR)**：压缩比定义如下：\n\n\n\n\n$$\\\\mathit{CR} = \\\\frac{\\\\textit{原始指纹图像中的总比特数}}{\\\
  \\textit{压缩后指纹图像中的比特数}}$$\n\n![si1_e](img/si1_e.png)\n\n#### 2. 安全性分析\n加密图像的随机性通过熵和直方图分析进行评估。\n\
  \n#### 3. 基于直方图度量的原始图像块与错误解密块分类分析\n\n#### A. 压缩比分析\n\n在所提方案中，我们使用了游程编码序列和 Elias\
  \ gamma 编码过程来压缩二值指纹图像。SOCOFing 数据集中指纹图像的尺寸为 103 × 96，在原始二值表示中需要 9888 位。游程编码过程利用了相邻比特中的冗余。对于随机选取的\
  \ 100 张图像，压缩后获得的压缩比在 图 3 中以图形方式展示。\n\n#### B. 安全性分析\n\n![图 3 从 100 张指纹图像获得的压缩比。](img/f11-03-9780323852098.jpg)\n\
  \n**图 3** 从 100 张指纹图像获得的压缩比。\n\n根据所提方案，我们可以使用任何随机流生成器用于加密目的。为了仿真目的，我们使用了 `RC4` 随机流生成器。所提方案可使用任何安全的随机流生成器用于加密目的。为了分析加密过程的安全性，我们使用了直方图分析和熵。\n\
  \n四幅样本人脸图像及其所有直方图如 图 4 所示。为了表明我们在 RDH 过程后获得的最终加密图像在像素分布上具有足够的随机性，我们绘制了加密图像的直方图，如\
  \ 图 5 所示。\n\n![图 4 原始人脸图像及其直方图。](img/f11-04-9780323852098.jpg)\n\n**图 4** 原始人脸图像及其直方图。\n\
  \n![图 5 通过加密过程进行 RDH 后获得的人脸图像及其对应的直方图。](img/f11-05-9780323852098.jpg)\n\n**图 5**\
  \ 通过加密过程进行 RDH 后获得的人脸图像及其对应的直方图。\n\n从随机选取的 50 张人脸图像在数据隐藏过程后获得的熵度量如 图 6 所示。可以看出，对于所有这些图像，加密过程后的熵值均为最大值（非常接近\
  \ 8），而与原始图像的熵无关。`E1` 度量表示原始人脸图像的熵，`E2` 表示通过加密过程进行数据隐藏后获得的熵。\n\n#### C. 新直方图度量分析\n\
  \n![图 6 原始图像和加密图像熵度量的分析。](img/f11-06-9780323852098.jpg)\n\n**图 6** 原始图像和加密图像熵度量的分析。\n\
  \n我们用于数据提取和图像恢复的关键思想是一种基于直方图的度量。利用直方图的峰值来区分原始图像块和错误恢复的块。请注意，在云服务提供商端，他们知道用户在数据隐藏和图像加密过程中使用了两个不同的密钥。但他们不知道选定块使用了哪种流密码进行加密。因此，他们将尝试解密过程后获得的两个块分别创建直方图，并分析新获得块的直方图。在人脸图像中，一个块内的像素极有可能高度相近。为了描绘使用基于直方图的度量来恢复图像块的原因，我们绘制了从正确恢复的图像块\
  \ (`OM`) 和错误恢复的图像块 (`WM`) 中观察到的峰值。\n\n从 图 7 可以观察到，正确恢复块的度量值始终高于错误恢复块。\n\n![图 7 图像恢复过程中获得的基于直方图的度量。](img/f11-07-9780323852098.jpg)\n\
  \n**图 7** 图像恢复过程中获得的基于直方图的度量。\n\n实验研究中的关键观察结果列举如下：\n\n*   结合 Elias gamma 编码过程使用游程编码可确保指纹数据获得非常好的压缩效果。\n\
  *   所提方案中使用了一种新的直方图度量，用于在接收端识别正确恢复的块。该度量工作高效，实验研究表明该度量能够将自然图像块与错误恢复的解密块区分开来。\n*\
  \   由于通过加密的 RDH 方案将指纹细节嵌入人脸图像是本章首次引入，因此省略了所提方案的比较研究。\n\n### 6: 结论\n\n在本章中，我们提出了一个安全框架，可用于双层生物特征认证过程，其中云服务提供商可能负责验证任务。通过网络从客户端向云服务提供商发送生物特征数据（如人脸图像或指纹）是不安全的。因此，所提方案利用通过加密过程的\
  \ RDH 方案将压缩的指纹数据隐藏在人脸图像中。主要优势在于传输给客户端的最终图像将以加密图像的形式呈现，且指纹细节已隐藏其中。所提方案还结合使用了游程编码方案和\
  \ Elias gamma 编码过程来压缩指纹数据。所提方案可用于需要安全多生物特征验证的领域。\n\n### 参考文献\n\n## 第 12 章：面向基于云的医疗系统的高效且不可追踪的认证协议\n\
  \n**Suryakanta Panda; Samrat Mondal** ^() 印度理工学院巴特那分校计算机科学与工程系，比哈，印度\n\n### 摘要\n\
  \n远程医疗信息系统 (TMIS) 将医疗服务延伸至偏远地区，患者无需亲自去医院即可咨询医生。由于通信信道不安全，TMIS 中患者医疗数据的安全性和隐私保护是一个主要关注点。已设计出多种协议以确保患者的安全性和隐私。然而，这些协议大多存在各种安全漏洞，不适合实际使用。为克服这些安全漏洞，我们利用生物特征哈希为\
  \ TMIS 提出了一种新的安全增强型协议，具有较低的计算开销。安全性分析和性能分析表明，我们的协议实现了所有必需的安全属性，且比其他相关协议更高效。\n\n\
  #### 关键词\n\nTMIS; WBAN; 远程医疗; 认证; 生物特征哈希\n\n### 1: 引言\n\n\n\n\n医疗行业中信息和通信技术的实现通过互联网提供远程和自我监测医疗服务。特别是无线体域网（WBAN）和云计算的指数级增长增强了远程医疗服务，同时也降低了患者的医疗支出和时间。WBAN\
  \ 是一种围绕人体的低功耗无线个人域网，由各种可穿戴医疗传感器和一个个人移动设备组成 [²⁴⁶]。\n\n各种慢性病居家护理服务需求的增加导致医疗数据极快增长\
  \ [²⁴⁷]。\n\n由于患者的 WBAN 设备天然受限于计算能力、通信带宽、存储和电池电量，因此无法应用强加密操作来执行患者和医生之间的安全通信。因此，需要一种轻量级、高效的相互认证和密钥协商协议来维护通信过程中的安全性\
  \ [²⁴⁸]。\n\n虽然轻量级认证和密钥协商协议确保了传输过程中数据的隐私，但患者移动设备上的数据丢失风险始终存在。移动设备可能被对手窃取，除非移动设备完全安全，否则对手将从该移动设备获取患者的生理信息和诊断报告。因此，有必要保护患者移动设备中存储的数据，使得对手在窃取患者移动设备后无法获得任何优势。\n\
  \n认证是一种有前景的加密解决方案，可为存储在移动设备中的机密信息提供安全访问。所有认证技术至少依赖以下方法之一。\n\n*   **用户拥有的东西**：也称为基于令牌的认证。在此机制中，每个用户（需要被认证者）拥有某个物理识别对象，可唯一标识该用户，例如智能卡。\n\
  *   **用户知道的东西**：也称为基于知识的认证。在此机制中，用户必须记住密码或 PIN 以进行认证过程。\n*   **用户本身的东西**：也称为基于生物特征的认证。这包括指纹扫描、虹膜扫描等机制。\n\
  \n由于简单易部署，基于密码的认证是最广泛的用户认证技术。不幸的是，由于人类记忆的有限认知能力，密码容易受到某些安全威胁 [²⁴⁹]。\n\n因此，在远程医疗信息系统（TMIS）中，需要一种使用生物特征哈希的轻量级认证和密钥协商协议。\n\
  \n#### 1.1 贡献\n\n为满足 TMIS 中的安全需求，我们提出了一种用于云环境中医疗数据交换的改进型轻量级认证协议。本工作的主要研究贡献如下。\n\n\
  *   所提协议在通信双方（即患者和医生）之间建立相互认证。\n*   使用生物特征哈希，我们确保了患者移动设备的安全性，也确保了医生设备的安全性。\n*  \
  \ 我们使用形式分析和非形式分析方法对协议进行了检验，发现该协议实现了所需的安全属性，并能抵抗各种已知攻击。\n*   会话密钥仅使用哈希运算和异或运算建立，因此计算开销小、重量轻。\n\
  *   性能分析表明，与其他现有协议相比，所提协议更高效。\n\n### 2 相关工作\n\n认证和密钥协商方案领域的研究人员提出了许多认证协议，以向基于云的医疗数据提供完整性和机密性。2014\
  \ 年，Chen 等人 [²⁵⁰]...\n\n上述文献研究表明，TMIS 中的认证和密钥协商协议应提供相互认证、患者隐私、医疗数据的完整性和机密性。就我们所知，现有文献中的轻量级密钥协商协议没有同时满足所有必需属性。\n\
  \n*   Chen 等人的协议 [²⁵¹]\n*   Chen 等人的协议 [²⁵²]\n*   Chiou 等人的协议 [²⁵³]\n*   Mohit 等人的协议\
  \ [²⁵⁴]\n*   Li 等人的协议 [²⁵⁵]\n*   Kumar 等人的协议 [²⁵⁶]\n*   Chandrakar 等人的协议 [²⁵⁷]\n\
  \n### 3 系统模型和安全目标\n\n本节简要讨论所提认证协议的网络模型、威胁模型和安全目标。\n\n#### 3.1 网络模型\n\n我们基于云的医疗系统网络模型如\
  \ 图 1 所示。该模型包含五个主要实体：(1) 可穿戴传感器节点，(2) 移动设备，(3) 云服务器，(4) 医生，(5) 认证服务器。患者的生理信息由移动设备通过可穿戴传感器收集并传输到云服务器（CS）。然后，医生从云服务器获取生理信息。所有患者和医生都需要在受信任的认证服务器（AS）注册，以便在它们之间执行安全通信。\n\
  \n![图 1 网络模型](img/f12-01-9780323852098.jpg)\n\n图 1 网络模型。\n\n#### 3.2 威胁模型\n\n在本工作中，我们遵循广泛使用的\
  \ Dolev-Yao 威胁模型 [²⁵⁸]。\n\n#### 3.3 安全目标\n\n*   **认证**：在接受任何消息之前，所有参与者都应能够验证发送者的声称身份。它可防止冒充攻击、中间人攻击等安全协议攻击。\n\
  *   **报告机密性**：在 TMIS 中，保护患者健康信息的机密性至关重要。除指定医疗专业人员外，任何内部人员和外部人员都不应能获取秘密报告。\n*   **报告完整性**：关键医疗数据的任何未经授权修改都可能危及患者生命\
  \ [²⁵⁹]。\n*   **患者匿名性**：应隐藏患者的真实身份，即窃听传输消息后，任何对手都无法将消息与特定患者关联，也无法判断两条消息是否来自同一患者。\n\
  *   **患者不可链接性**：患者与其医生之间的关联或关系应保密。否则，会危及患者的隐私和匿名性。\n\n#### 3.4 生物特征哈希\n\n\n\n生物特征模板对每个人来说都是永久且唯一的。因此，一旦泄露，就无法为同一个人生成新的模板。因此，有必要保护生物特征模板免受对手的攻击。生物特征哈希是一种通过将生物特征数据转换为二进制字符串来确保生物特征模板安全的方法。因此，它存储的是生物特征数据的转换或修改版本，并泄露较少的原始生物特征数据信息。它使用密钥和不可逆函数来转换或随机化生物特征数据。使用密钥的优势在于，可以通过更改密钥来撤销或修改转换后的生物特征数据\
  \ ²⁶⁰。\n\n从生物特征数据获取生物特征哈希的步骤如下。\n\n1.  (i) 使用特征提取过程从生物特征数据中获取特征向量。\n2.  (ii) 利用用户提供的密钥生成一组伪随机向量。\n\
  3.  (iii) 应用 Gram-Schmidt 过程使生成的伪随机向量正交归一化。\n4.  (iv) 计算生物特征特征向量与正交归一化向量之间的内积。\n\
  5.  (v) 使用预定阈值计算生物哈希位串。如果得到的内积大于预定阈值，则设置位为 1，否则设置位为 0。\n\n### 4: 提出的协议\n\n在本节中，我们提出了一种利用云计算进行医疗数据交换的新型安全增强协议。表\
  \ 1 解释了本章中使用的所有符号。我们提出的协议由四个阶段组成，具体描述如下。\n\n#### 表 1：所用符号的解释\n\n| 符号 | 描述 |\n| ---\
  \ | --- |\n| `HC` | 医疗中心 |\n| `CS` | 云服务器 |\n| `AS` | 可信认证服务器 |\n| `ID[H]` | 医疗中心的身份标识\
  \ |\n| `ID[P]` | 患者的身份标识 |\n| `SID[P]` | 患者的伪身份标识 |\n| `ID[D]` | 医生的身份标识 |\n| `∥`\
  \ | 连接操作 |\n| `{m}[k]` | 使用密钥 k 对消息 m 进行对称加密 |\n| `h()` | 单向哈希函数 |\n| `⊕` | 异或操作\
  \ |\n| `TS[i]` | 时刻 i 的时间戳 |\n\n#### 4.1: 注册阶段\n\n在该阶段，所有参与者向可信 `AS` 注册。注册阶段可分为医生注册和患者注册。\n\
  \n##### 4.1.1: 医生注册\n\n*   **步骤 1：** 医生通过安全方式将其唯一身份标识 `ID[D]` 和注册请求发送给 `AS`。\n*\
  \   **步骤 2：** `AS` 接受医生的注册请求后，计算 `A[1] = h(ID[D]∥α)`，其中 `α` 是 `AS` 的密钥。然后，`AS` 通过安全信道将\
  \ `A[1]` 发送给医生，并存储医生的 `ID[D]`。\n*   **步骤 3：** 医生收到 `A[1]` 后，提取其生物特征哈希 (`R[D]`) 并选择一个密码\
  \ (`PW[D]`)。然后，计算 `DP[1] = h(PW[D]∥R[D])`，`DP[2] = A[1] ⊕ DP[1]`。最后，医生在其设备中存储 `h(DP[1])`、`DP[2]`。\n\
  \n##### 4.1.2: 患者注册\n\n*   **步骤 1：** 患者通过安全信道将唯一伪身份标识 `SID[P]` 和医生的身份标识 `ID[D]`\
  \ 连同注册请求一起发送给 `AS`。\n*   **步骤 2：** `AS` 收到患者的注册请求后，检索与 `ID[D]` 对应的 `A[1]`，并计算 `A[2]\
  \ = h(SID[P]∥A[1])`，`A[3] = h(r∥A[1])`，其中 `r` 是一个随机数。最后，`AS` 通过安全信道将 `A[2]`、`A[3]`、`r`\
  \ 发送给患者。\n*   **步骤 3：** 患者收到 `A[2]`、`A[3]`、`r` 后，提取其生物特征哈希 (`R[U]`) 并选择一个密码 (`PW`)。然后，计算\
  \ `P[1] = h(PW∥R[U])`，`P[2] = A[2] ⊕ P[1]`，`P[3] = A[3] ⊕ P[1]`。最后，患者在其移动设备中存储 `h(P[1])`、`P[2]`、`P[3]`、`r`。\n\
  \n#### 4.2: 患者数据上传阶段 (PUP)\n\n该阶段执行以下步骤，在建立相互认证后将加密的传感器信息上传到云端，并将密钥传达给医生以进行解密。\n\
  \n*   **步骤 1：** 首先，患者收集所有传感器信息，记为 `M[B]`。然后，选择一个随机密钥 `kp`。计算 `E[B] = {M[B]}[kp]`，`P[4]\
  \ = h(M[B]∥R[1]∥ID[D]∥SID[P])`，其中 `R[1]` 是一个随机数。然后，将 `M[0] = {E[B], SID[P], P[4]}`\
  \ 上传到 `CS`。\n    之后，当医生在线可用时，患者将密码和生物特征哈希输入移动设备。然后，移动设备计算 `h(PW∥R[U])` 并将其与 `P[1]`\
  \ 进行验证。如果验证通过，移动设备检索 `A[3] = P[1] ⊕ P[3]`。接着，计算 `P[5] = A[3] ⊕ R[1]`，`P[6] = h(R[1])\
  \ ⊕ SID[P]`，`P[7] = h(SID[P]∥ID[D]∥r∥R[1]∥TS[0])`。最后，发送 `M[1] = {P[5], P[6], P[7],\
  \ r, TS[0]}` 给医生。\n*   **步骤 2：** 医生收到消息 `M[1]` 后，验证时间戳 `TS[0]`。然后，将其密码 (`PW[D]`)\
  \ 和生物特征哈希 (`R[D]`) 输入其设备。然后，设备计算 `h(PW[D]∥R[D])` 并将其与存储的 `DP[1]` 进行验证。如果验证通过，设备检索\
  \ `A[1] = DP[1] ⊕ DP[2]`。接着，医生提取 `R[1] = P[5] ⊕ h(r∥A[1])`，`SID[P] = P[6] ⊕ h(R[1])`\
  \ 并验证 `P[7]`。验证成功后，生成两个随机数 `r′` 和 `R[2]`。然后，计算 `D[1] = h(r′∥A[1])`，`D[2] = h(h(SID[P]∥A[1])∥R[1])\
  \ ⊕ R[2]`，`D[3] = h(R[2]) ⊕ D[1]`，`D[4] = h(h(SID[P]∥A[1])) ⊕ r′ ⊕ R[2]`，`D[5] =\
  \ h(R[1]∥R[2]∥r′∥TS[1])`，`SK = h(R[1]∥R[2])`。最后，医生发送消息 `M[2] = {D[2], D[3], D[4],\
  \ D[5], TS[1]}` 给患者。\n*   **步骤 3：** 患者收到消息 `M[2]` 后，验证 `TS[1]` 并提取 `R[2] = h(A[2]∥R[1])\
  \ ⊕ D[2]`，`D[1] = h(R[2]) ⊕ D[3]`，`r′ = h(A[2]) ⊕ R[2] ⊕ D[4]`。然后，计算并验证 `D[5]`。如果验证通过，则计算\
  \ `SK = h(R[1]∥R[2])`，`P[3]′ = D[1] ⊕ P[1]`。最后，用 `P[3]′` 替换 `P[3]`，用 `r′` 替换 `r`。\n\
  *   **步骤 4：** 在认证医生并建立会话密钥后，患者使用会话密钥 `SK` 加密 `kp` 并将其发送给医生。最后，患者计算 `PK[i] = A[2]\
  \ ⊕ kp` 并存储 `PK[i]`。\n\n图 2 展示了该阶段的所有步骤。\n\n![图 2 患者数据上传阶段。](img/f12-02-9780323852098.jpg)\n\
  \n图 2 患者数据上传阶段。\n\n#### 4.3: 治疗阶段 (TP)\n\n*   **步骤 1：** 医生向 `CS` 发送其身份标识 `ID[D]`、患者的伪身份标识\
  \ `SID[P]` 以及请求。\n*   **步骤 2：** `CS` 收到医生的请求后，将患者的数据 `M[3] = {E[B], P[4], TS[2]}`\
  \ 发送给医生。\n*   **步骤 3：** 医生收到 `M[3]` 后，验证时间戳 `TS[2]` 并解密 `E[B]`。然后，验证 `P[4]`。如果验证通过，医生查阅患者的报告\
  \ `M[B]` 并准备诊断报告 `M[D]`。然后，将 `M[D]` 加密为 `E[D] = {M[D]}[kp]` 并计算 `D[6] = h(M[D]∥ID[D]∥R[2]∥SID[P])`。之后，医生将\
  \ `E[D]` 和 `D[6]` 上传到 `CS`。\n\n#### 4.4: 复查阶段 (CP)\n\n*   **步骤 1：** 患者向 `CS` 发送下载请求及其伪身份标识\
  \ `SID[P]` 以获取诊断报告。\n*   **步骤 2：** `CS` 收到请求后，将 `E[D]`、`D[6]` 发送给患者。\n\n\n\n\n*\
  \   步骤 3：患者向移动设备输入其密码和生物特征哈希值。然后，移动设备计算 `h(PW∥R[U])` 并将其与 `P[1]` 进行验证。如果验证通过，移动设备检索\
  \ `A[2] = P[1] ⊕ P[2]`、`kp = PK[i] ⊕ A[2]`。然后，患者使用密钥 `kp` 从接收到的 `E[D]` 中检索 `M[D]`。接着，验证\
  \ `D[6]`。如果验证通过，患者信任来自医生的接收诊断报告 `M[D]`。然后，计算 `P[8] = h(M[D]∥PW∥SID[P])`。最后，将 `P[8]`\
  \ 与相应的 `E[D]` 一起存储在 CS 中以备将来参考。\n\n### 5: 安全分析\n\n本节同时采用形式化安全分析和非形式化安全分析，证明我们提出的协议是安全的，并能抵御各种已知攻击。\n\
  \n#### 5.1: 基于真实-随机模型的形式化安全分析\n\n本节应用广泛接受的真实-随机（ROR）模型 [[261]](#fn261)，展示我们协议的形式化安全分析。\n\
  \n##### 5.1.1: 安全模型\n\n本节描述 ROR 安全模型。根据该安全模型，定义了各种查询和预言机，如下所示：\n\n*   **参与者**：设\
  \ `Π` 为所有参与者的集合，`D` 为所有医生的集合，`C` 为所有云服务器的集合，`H` 为所有医疗中心的集合。符号 `Π^i` 表示参与者 `Π` 的第\
  \ i 个实例。参与者的任何实例称为一个预言机。\n*   **伙伴关系**：伙伴关系由参与通信的参与者的唯一会话 ID 表示。如果两个实例 `Π^i` 和 `Π^j`\
  \ 在一个会话中拥有相同的会话 ID，则它们是伙伴关系。\n*   **攻击者**：在该模型中，假设攻击者 `A` 在多项式时间内运行。`A` 完全控制网络，可以窃听、阻塞、篡改和重放消息。`A`\
  \ 的能力由此处讨论的查询定义：\n    *   **Execute(Π^i, Π^j)**：响应此查询时，攻击者 `A` 获取两个授权参与者 `Π^i` 和\
  \ `Π^j` 之间通信的所有消息。它模拟 `A` 的窃听攻击。\n    *   **Send(Π^i, msg)**：通过此查询，`A` 可向授权参与者实例\
  \ `Π^i` 发送消息 `msg`，并从参与者接收相应的回复。它模拟重放攻击、冒充攻击和篡改攻击。\n    *   **CorruptMD(P)**：通过此查询，攻击者\
  \ `A` 提取存储在患者移动设备中的信息。它模拟移动设备丢失攻击。\n    *   **Test(Π^i)**：此查询表示参与者 `Π^i` 建立的会话密钥的语义安全性。`Π^i`\
  \ 在此测试查询中的响应取决于一次无偏硬币翻转 `c` 的结果。`A` 不知道翻转结果 `c`。如果 `c = 1`，`Π^i` 向攻击者 `A` 返回实际会话密钥；否则如果\
  \ `c = 0`，`Π^i` 返回同一域中的一个随机数。\n*   **Hash(x, k)**：哈希预言机表示哈希运算 `h()`，当查询输入 `x` 时提供输出\
  \ `k = h(x)`。当有人查询 `h(x)` 时，它在表 `(x, k)` 中搜索，如果 `x` 出现在表中则返回 `k`。否则，它返回一个均匀随机字符串\
  \ `k` 并将 `(x, k)` 插入表中。\n*   **Biohash(x, k′)**：生物哈希预言机表示生物哈希运算 `h_Bio()`，对于输入 `x`\
  \ 提供输出 `k′ = h_Bio(x)`。当有人查询 `h_Bio(x)` 时，如果 `x` 与阈值内的现有值匹配，则返回 `k′`。否则，它返回一个均匀随机字符串\
  \ `k′` 并将 `(x, k′)` 插入表中。\n\n会话密钥的语义安全性：提供前面讨论的查询，攻击者 `A` 面临的挑战是确定翻转结果 `c` 的值，即会话密钥是真实的还是随机的。如果\
  \ `A` 成功区分真实密钥和随机密钥，则协议无法提供语义安全性。设 `Succ` 表示 `A` 获胜的事件，即正确区分真实密钥和随机密钥。`A` 破解协议 `P`\
  \ 语义安全性的优势为 `Adv_P^(ake) = |2 ⋅ Pr[Succ] − 1|`。如果 `Adv_P^(ake)` 可忽略不计，则协议 `P` 在\
  \ ROR 模型中是安全的。\n\n**定理 1。**\n\n在随机预言机模型中，攻击者 `A` 在多项式时间 `t` 内针对我们的协议 `P` 发起攻击。设\
  \ `A` 执行 `q_h` 次哈希查询、`q_s` 次发送查询、`q_b` 次生物哈希查询和 `q_e` 次执行查询以破坏 `P`。则 `A` 破坏协议 `P`\
  \ 安全性的优势如下：\n\n```\nAdv_P^ake(A) ≤ q_b² / H_1 + q_h² / H_2 + 2q_s / |D_1 ∥ D_2|\n\
  ```\n\n其中 `|H_1|`、`|H_2|`、`|D_1|` 和 `|D_2|` 分别表示生物哈希函数的值域空间、哈希函数的值域空间、均匀分布密码字典的大小和均匀分布生物特征模板的大小。\n\
  \n**证明。**\n\n为证明定义了一系列从 `G_0` 到 `G_3` 的游戏。在每个游戏 `G_i` 中，攻击者 `A` 尝试预测 `c` 的正确值。设\
  \ `Succ_i` 表示该事件，`Pr[Succ_i]` 表示相应的概率。\n\n*   **游戏 G_0**：它模拟攻击者 `A` 对我们协议 `P` 的实际攻击。最初，比特\
  \ `c` 随机选择。因此，根据定义我们有\n    ```\n    Adv_P^ake = 2 ⋅ Pr[Succ_0] - 1.\n    ```\n*\
  \   **游戏 G_1**：为了提高获胜优势，攻击者 `A` 使用 `Execute(Π^i, Π^j)` 查询发起窃听攻击。然后，在 `Test(Π^i)`\
  \ 预言机中，`A` 必须确定 `c` 的值。由于 `SK` 由 `R_1` 和 `R_2` 计算得出，`A` 试图从 `M_1`、`M_2` 中检索 `R_1`\
  \ 和 `R_2`。我们知道 `R_1 = P_5 ⊕ A_3`。因此，要提取 `R_1`，`A` 需要患者的密码和生物特征以及移动设备。没有 `R_1` 无法提取\
  \ `R_2`。因此，窃听攻击不会提高获胜优势，我们有\n    ```\n    Pr[Succ_1] = Pr[Succ_0].\n    ```\n* \
  \  **游戏 G_2**：在该游戏中，攻击者 `A` 试图借助 `Send()`、`Hash` 预言机和 `Biohash` 预言机误导参与者实例接受伪造消息。它考虑了\
  \ `P` 中可能出现的所有碰撞。由于每条消息都包含时间戳、随机数等随机因素，攻击者将无法找到任何碰撞。因此，根据生日悖论，我们得到\n    ```\n  \
  \  |Pr[Succ_2] - Pr[Succ_1]| ≤ q_b² / (2|H_1|) + q_b² / (2|H_2|).\n    ```\n*  \
  \ **游戏 G_3**：该游戏模拟与患者移动设备丢失相关的风险。通过查询 `CorruptMD()` 预言机，`A` 检索存储的凭证，如 `P_1`、`P_2`、`P_3`。然后，`A`\
  \ 尝试猜测密码和生物特征哈希。由于密码字典和生物特征模板的大小分别为 `|D_1|` 和 `|D_2|`，我们有\n    ```\n    |Pr[Succ_3]\
  \ - Pr[Succ_2]| ≤ q_s / (|D_1||D_2|).\n    ```\n\n\n\n\n完成所有游戏后，A 在猜测 c 时没有获得任何优势。因此，我们有\n\
  \n$$\n\\begin{array}{r} {Pr\\lbrack{Succ}\\_{3}\\rbrack = \\frac{1}{2}.} \\\\ \\\
  end{array}\n$$\n\n![si10_e](img/si10_e.png) (6)\n\n因此，通过结合公式 (2)–(6)，我们得到\n\n$$\n\
  \\begin{array}{r} {{Adv}\\_{P}^{ake}(A) \\leq \\frac{q\\_{b}^{2}}{H\\_{1}} + \\\
  frac{q\\_{h}^{2}}{H\\_{2}} + \\frac{2q\\_{s}}{|D\\_{1} \\parallel D\\_{2}|}.} \\\
  \\ \\end{array}\n$$\n\n![si11_e](img/si11_e.png) (7)\n\n▪\n\n因此，攻击者无法获得非微不足道的优势，我们的协议实现了语义安全。\n\
  \n#### 5.2：非正式安全分析\n\n在本节中，我们将非正式地探讨我们提出的协议如何抵抗各种已知攻击。\n\n##### 5.2.1：提供患者隐私\n\n\
  患者的传感器报告 `M[B]` 和诊断报告 `M[D]` 使用密钥 `kp` 加密并存储在 CS 中。密钥 `kp` 仅在患者和医生之间共享，因此任何第三方（包括\
  \ CS 的特权内部人员）都无法解密患者的机密报告。此外，患者的伪身份 `SID[P]` 不是固定的，并且可以因医生而异。因此，攻击者无法从 `SID[P]`\
  \ 获取患者的真实身份，从而保障了患者的社会生活安全。\n\n##### 5.2.2：抵抗健康报告伪造攻击\n\n在治疗阶段，医生通过计算和验证 `P[4]`\
  \ 来检查患者传感器报告 `M[B]` 的完整性。要伪造 `P[4]`，攻击者需要 `R[1]`，而 `R[1]` 仅在医生和患者之间秘密共享。因此，攻击者无法在没有\
  \ `R[1]` 的情况下创建伪造的传感器报告 `M[B]'`。同样，在检查阶段，患者通过计算和验证 `D[6]` 来检查诊断报告 `M[D]` 的完整性。要伪造\
  \ `D[6]`，攻击者需要 `R[2]`，而 `R[2]` 仅在医生和患者之间秘密共享。因此，攻击者无法在没有 `R[2]` 的情况下创建伪造的诊断报告。因此，所提出的协议能抵抗健康报告伪造攻击。\n\
  \n##### 5.2.3：抵抗中间人攻击\n\n在我们协议的每个阶段中，接收方在接受消息前都会检查消息的真实性。在真实性检查中，使用了一个与发送方身份相关联的秘密变量。例如，在患者数据上传阶段，`R[1]`\
  \ 与患者的伪身份相关联，而 `R[2]` 与医生的身份相关联。由于哈希函数的不可逆特性，攻击者无法分离现有的秘密变量并创建一个新的。因此，我们的协议能抵抗中间人攻击和冒充攻击。\n\
  \n##### 5.2.4：抵抗重放攻击\n\n在我们的协议中，我们使用随机数和时间戳在每个会话中生成不同的通信消息。消息的接收方可以在完整性检查期间验证时间戳。由于在不可逆哈希操作中使用了秘密值，攻击者无法伪造\
  \ `P[7]` 和 `D[5]` 中使用的时间戳。因此，我们的协议能抵抗重放攻击。\n\n##### 5.2.5：抵抗移动设备被盗攻击\n\n存储在患者手机中的患者凭证使用密码和生物特征进行加密。此外，在检查阶段，患者接收加密的诊断报告。要解密加密的诊断报告，患者需要\
  \ `kp`，而 `kp` 受患者密码和生物特征信息保护。因此，移动设备被盗不会给攻击者带来任何优势。\n\n##### 5.2.6：提供不可否认性\n\n接收到消息\
  \ `M[2]` 后，如果 `D[5]` 的验证成功，医生无法否认其参与。因为只有指定医生能从消息 `M[1]` 中检索 `R[1]`。同样，如果会话密钥 `SK`\
  \ 建立成功，患者无法否认其参与。因为只有患者能从 `M[2]` 中检索 `R[2]`。在治疗阶段，可以通过验证 `P[4]` 来确保患者的参与。同样，在结账阶段，可以通过验证\
  \ `D[6]` 来确保医生的参与。因此，我们的协议提供了不可否认性属性，并使一方确信另一方的参与。\n\n#### 5.3：协议仿真\n\n我们协议中的会话密钥协商过程以及患者和医生之间的认证是使用\
  \ AVISPA（一种协议仿真工具）[[262]](#fn262) 进行仿真的。\n\n![Fig. 3 Result of AVISPA tool.](img/f12-03-9780323852098.jpg)\n\
