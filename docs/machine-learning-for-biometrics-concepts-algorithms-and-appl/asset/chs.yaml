  \ 和 97.54%）和 EER（1.67% 和 2.45%）。在实验中，与各单一模态相比，将耳部模态与侧脸结合使用特征层面融合和得分层面融合可获得令人鼓舞的识别性能。此外，还观察到，与特征层面融合的准确率（98.47%\
  \ 和 98.24%）及 EER（1.59% 和 1.75%）相比，所提方法使用得分层面融合在 UND-E 和 UND-J2 数据集上分别提供了显著更高的准确率（99.98%\
  \ 和 99.97%）和 EER（0.01% 和 0.04%）。此外，在三种不同的特征提取器组合中，直方图描述符 `SPT-LPQ` 和 `SPT-BSIF`\
  \ 的性能优于 `STP-LDP`，且基于 `SPT-BSIF` 特征描述符的所提方法优于所有其他特征描述符。所提识别方法在 UND-E 和 UND-J2 数据集上的\
