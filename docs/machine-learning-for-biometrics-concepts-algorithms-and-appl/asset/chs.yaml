  \ Panda\n\nSubhashree Mishra\n\nBhabani Shankar Prasad Mishra\n\nBanshidhar Majhi\n\
  \n\n\n\n\n### Machine Learning Approaches in Biometric Systems: Research Advances\
  \ and Applications\n\nBiometric systems automatically recognize identities by utilizing\
  \ human physiological and behavioral characteristics. Advances in sensor technology\
  \ have attracted the attention of numerous researchers, driving the introduction\
  \ of a large number of novel biometric traits, providing privacy and security guarantees\
  \ for various application systems ranging from industry to healthcare. Over the\
  \ past few decades, to improve recognition performance, a large number of machine\
  \ learning algorithms have been applied to various biometric scenarios. The core\
  \ significance of machine learning algorithms lies in determining individual identities\
  \ by associating biometric patterns with corresponding enrolled users. However,\
  \ in high-security applications, security and recognition accuracy are the primary\
  \ concerns, which can be addressed by designing multimodal biometric systems. As\
  \ the name suggests, multimodal biometrics fuse two or more different biometric\
  \ traits (e.g., fingerprint, iris, face, palmprint, etc.), and their working principle\
  \ is similar to unimodal biometrics, with only an added information fusion module.\
  \ Given the increasing number of biometric systems and their applications, the field\
  \ still requires extensive in-depth research and development.\n\nCurrently, a large\
  \ number of biometric systems exhibit limited recognition rates or accuracy in unconstrained\
  \ scenarios due to poor image acquisition quality, including low contrast, large\
  \ illumination variations, and insufficient user cooperation. These challenges have\
  \ prompted many researchers to work in multiple sub-fields, such as extracting discriminative\
  \ features, adopting efficient classifiers, and performing information fusion at\
  \ different stages of multimodal biometric systems. Additionally, another research\
  \ direction is to provide security guarantees for biometric information systems\
  \ to address security requirements in online identification modes in many applications.\
  \ This book covers the latest research advances in the field of biometrics, aiming\
  \ to improve recognition performance in various applications and solve security\
  \ issues, such as online transactions, e-commerce, access control, law enforcement,\
  \ border security, healthcare, etc.\n\nThis book specifically explores current research\
  \ advances in the field of biometrics and biometric-based applications, aiming to\
  \ improve personal identification performance. The book consists of 12 chapters,\
  \ each elaborating on the concepts and fundamentals of recent hot topics in biometrics,\
  \ reviewing the latest methodologies, revealing experimental results, and comparing\
  \ them with state-of-the-art technologies to highlight their effectiveness in recognition\
  \ and future directions. Furthermore, the content of this book is organized according\
  \ to recognized biometric traits and a few novel traits, combined with biometric\
  \ security and latest applications, making each chapter independently readable.\
  \ The content of each chapter is briefly introduced below.\n\n#### Chapter “Machine\
  \ Learning Approach for longitudinal face recognition of children”\n\nThis chapter\
  \ introduces a novel application utilizing face biometrics for children's identity\
  \ recognition. Face recognition for children under 6 years old helps provide them\
  \ with medical services and assists in finding missing children. The authors constructed\
  \ a new face database, collecting individuals' face images over a period of time\
  \ (specifically intervals of several months), named the Longitudinal Face Database.\
  \ Experiments extensively used various machine learning classifiers, such as Support\
  \ Vector Machines (`SVM`), K-Nearest Neighbors (`KNN`), Logistic Regression (`LR`),\
  \ Decision Trees, Gaussian Naive Bayes, and Convolutional Neural Networks (`CNN`).\
  \ Comparative experimental results demonstrated the effectiveness and superiority\
  \ of the proposed `CNN`-based method in improving accuracy. Finally, the authors\
  \ suggest expanding the database scale and improving the model as possible future\
  \ research directions.\n\n#### Chapter “TBFR: Thermal Biometric Face Recognition—A\
  \ Noncontact Face Biometry”\n\nThis chapter proposes a novel thermal face recognition\
  \ method aimed at eliminating the effects of illumination intensity variations,\
  \ pose, accessories, aging, and other factors present in existing face biometric\
  \ systems. The authors fused facial geometric features with pre-trained `ResNet-50`\
  \ features to improve recognition performance. Experimental results show that this\
  \ method is more robust compared to existing methods.\n\n#### Chapter “Multimodal\
  \ Biometric Recognition using Human Ear and Profile Face: An Improved Approach”\n\
  \nThis chapter explores an improved ear biometric method based on handcrafted features\
  \ of the ear and profile face under feature-level fusion and score-level fusion\
  \ schemes. Recently, Convolutional Neural Network models for ear biometrics have\
  \ been proposed, with experimental results showing performance comparable to state-of-the-art\
  \ methods. However, deep learning-based biometric applications require a large number\
  \ of training images, massive memory for data processing, and huge computational\
  \ complexity, at the cost of improved recognition rates. The authors of this chapter\
  \ focus on a multimodal approach based on the ear and profile face, aiming to improve\
  \ recognition performance by reducing processing complexity. The effectiveness and\
  \ superiority of the method were verified through multiple sets of comparative experiments.\n\
  \n#### Chapter “Statistical Measures for Palmprint Image Enhancement”\n\nThis chapter\
  \ reviews image enhancement methods in palmprint images and their quality assessment\
  \ metrics. The databases most commonly used in palmprint image enhancement techniques\
  \ are discussed in detail. Image enhancement plays a key role in the preprocessing\
  \ step of biometric systems, providing better recognition performance for improving\
  \ accuracy and recognition rates.\n\n#### Chapter “Retina Biometrics for Personal\
  \ Authentication”\n\nThis chapter attempts to explore retina biometrics using the\
  \ `ANFIS` model. It focuses on discussing the `ANFIS`-based Retina Biometric Authentication\
  \ System (`ARBAS`) and its significance. Additionally, this chapter provides readers\
  \ with the knowledge base required to select appropriate feature sets and sufficient\
  \ techniques to conduct robust research in this field.\n\n#### Chapter “Gender Recognition\
  \ from facial Images using Multi-Channel Deep Learning Framework”\n\nThis chapter\
  \ demonstrates a multi-channel deep learning framework based on an automated gender\
  \ recognition method. The authors attempt to extract discriminative features from\
  \ raw face images of `GoogleNet`. They fused feature vectors from two sources: one\
  \ obtained from feature images generated by `LDP` filters, and the other obtained\
  \ directly from raw face images, both fed as input into `GoogleNet`. Finally, `CCA/DCA`\
  \ is used to merge the feature sets as input to the `SVM` classifier to achieve\
  \ gender recognition for given input images. The book conducts a series of experiments\
  \ and provides a comprehensive and detailed explanation of the experimental results.\n\
  \n#### Chapter “Implementation of Cardiac Signal for Biometric Recognition from\
  \ Facial Video”\n\nThis chapter explores the Heartbeat Signal from Facial Video\
  \ (`HSFV`) as biological evidence for recognizing individual identities. This chapter\
  \ provides motivation and knowledge support for researchers to open up novel research\
  \ directions in the field of biometrics.\n\n\n\n\n\n### 基于人体生物特征情绪强度的学生实时情绪投入度跟踪\n\
  \n章节“基于人体生物特征情绪强度的学生实时情绪投入度跟踪”描述了一种利用 `FAU`（面部动作单元）检测课堂上走神面孔的自动方法。此外，本章涵盖了跟踪的多个方面，范围从学生进入教室开始。作者呈现的实验结果可为学生面部图像的情绪检测和识别取得优异结果。\n\
  \n### 基于面部识别表情的考勤监控与情绪检测——深度 CNN 方法\n\n章节“基于面部识别表情的考勤监控与情绪检测——深度 CNN 方法”探讨了在新的在线课堂环境中考勤统计和评估学生情绪的挑战。在本章中，借助先进的机器学习方法，作者介绍了一种基于生物特征的自动考勤和面部表情识别系统。\n\
  \n### 机器学习和深度学习技术在网络安全中有效性的当代综述\n\n章节“机器学习和深度学习技术在网络安全中有效性的当代综述”基于高效的机器学习和深度学习技术，回顾了生物识别技术在网络安全中的实用性。本综述的目的是让读者掌握利用不同机器学习技术进行网络安全系统生物特征认证和识别的基本概念。\n\
  \n### 基于加密方案的可逆数据隐藏技术在智能环境中的安全生物特征认证系统\n\n章节“基于加密方案的可逆数据隐藏技术在智能环境中的安全生物特征认证系统”引入了可逆数据隐藏（`RDH`）方案的概念，以实现安全的在线生物特征数据通信。在基于\
  \ `RDH` 的加密方案中，通过在图像中隐藏重要信息对生物特征图像进行加密。在本章中，作者提出了一种新模型，其中压缩指纹数据被用作秘密消息，并通过基于可逆数据隐藏的加密方案嵌入面部图像中。为了保持通信安全，`RDH`\
  \ 方案后获得的加密图像将以安全方式传输给云服务提供商。\n\n### 面向云基础医疗系统的高效且不可追踪认证协议\n\n章节“面向云基础医疗系统的高效且不可追踪认证协议”提供了\
  \ `Telecare Medical Information System (TMIS)`，这在大流行情况下（例如 Covid-19）非常重要。在该技术中，患者的移动设备在与医生通信中起主要作用。此外，需要相互认证和密钥协商方案，以保护重要信息免受不安全通信通道中对手的任何恶意活动侵害。在本章中，作者提出了一种生物特征哈希技术，为患者和医生之间的通信提供安全认证和密钥协商。\n\
  \n最后，我们希望包括研究生、研究学者、青年研究人员、学者和行业专业人士在内的读者能发现本书贡献的章节发人深省，并希望这项工作能激励未来的研究突破，进一步推进基于机器学习的生物识别应用。\n\
  \n### 致谢\n\n编辑衷心感谢所有贡献者的持续努力和及时提交章节。没有章节作者的合作，本书无法完成。所有章节均经过多轮审阅，以促进最终章节的入选。审稿人宝贵的建议和指导帮助作者完善了各个章节。同时也感谢审稿人提升了本书章节的质量。\n\
  \n编辑想向 Elsevier 的 Sonnini Ruiz Yura 表示感谢，感谢她多年来的鼓励。我们要衷心感谢 Elsevier 的 Andrae Akeh\
  \ 和 Judith Clarisse Punzalan 在本书筹备过程中的耐心。此外，我们要感谢 Elsevier 的 Swapna Srinivasan 在本书最终筹备阶段的真诚帮助和耐心。最后，我们要向我们的家人和朋友表示感激，感谢他们所有的支持。\n\
  \n## 第 1 章：儿童纵向面部识别的机器学习方法\n\nVaishali H. Kamble^(a)；Manisha P. Dale^(b)  \n^a AISSMS\
  \ IOIT，Savitribai Phule Pune University，Pune，India  \n^b MES College of Engineering，Savitribai\
  \ Phule Pune University，Pune，India\n\n### 摘要\n\n个人的面部是一种流行且被广泛接受的生物特征，可用于执行成人和儿童的身份识别。儿童是社会中**最宝贵且最脆弱**的群体；他们应持续处于监督之下。根据印度的一项调查，6\
  \ 岁以下儿童占总人口的 13.12%。儿童的安全和医疗保健是所有国家的重要方面。儿童自动面部识别是帮助识别失踪儿童的有用调查工具。尽管儿童面部发育从母体子宫内\
  \ 3 个月开始，但它与身体其他部位的发育**不成比例**。因此，6 岁以下儿童的识别仍是一个开放的研究问题。在本章中，对儿童识别的机器学习和深度学习技术进行了比较。同一时段数据库的最高识别准确率达到\
  \ 97%，跨时段数据库达到 94%。\n\n#### 关键词\n\n生物识别；儿童识别；`CNN`；面部；机器学习\n\n### 1：引言\n\n个人的面部是一种流行且被广泛接受的生物特征，可用于执行成人和儿童的身份识别。儿童是社会中**最宝贵且最脆弱**的群体；因此他们应持续处于监督之下。所有国家都重视儿童的安全和医疗保健\
  \ ¹\n\nSahar Siddique 利用扩展新生儿数据库和儿童多模态生物特征数据库研究了纵向面部识别。在两个数据库上使用 `CNN` 达到的识别准确率分别为\
  \ 62.7% 和 85.1% ²\n\n本章提出了一种用于儿童面部识别的机器学习和深度学习方法。根据文献综述，利用面部模态进行儿童识别的研究始于 2010 年的印度\
  \ ³\n\n拟议工作的主要贡献如下。\n\n1.  由于缺乏 6 岁以下儿童的参考数据库，收集儿童面部纵向数据库本身就是一项巨大挑战。在拟议工作中，我们在征得父母同意的情况下，使用分辨率为\
  \ 20 MP 的手机摄像头采集了幼儿面部图像，分两个时段进行。两个时段间隔 2 个月至 1 年。在同一时段，采集了 81 名幼儿的 730 张图像。在第二时段，采集了\
  \ 48 名幼儿的 485 张图像。\n\n2.  在本章中，我们提出在面部图像上使用 `PCA`、`LDA` 和 `CNN` 方法进行特征提取及其比较研究。在\
  \ `PCA` 和 `LDA` 方法中，我们应用了不同的机器学习技术对受试者进行分类，如支持向量机（`SVM`）、逻辑回归（`LR`）、高斯朴素贝叶斯、K-近邻（`KNN`）、决策树和随机森林。在\
  \ `CNN` 中，特征提取由卷积层完成，分类由密集层完成。\n\n3.  在本工作中，我们从基础层面到优化层面实现了 `CNN`。首先，针对同一时段和跨时段采用三层卷积层的\
  \ `CNN`。进一步，通过数据增强对 `CNN` 进行修改，并采用带有 `L2` 核正则化和批量归一化的六层卷积模型以提高准确率。\n\n\n\n\n## 4.\
  \ 我们比较了不同特征提取和分类技术在识别模式下的有效性。此外，我们针对儿童数据库优化了 CNN 以提高准确率。我们将所提 CNN 的识别性能与使用分类技术的传统基于\
  \ PCA 和 LDA 的方法进行了比较。\n\n### 2: 儿童人脸识别的人脸模态\n\n人类可以通过其固有生物特征的分析和测量来识别。利用生物特征识别人类的科学称为生物识别。\n\
  \n生物识别基于人类的两个显著特征：\n\n1.  **生理特征**：人脸、指纹、虹膜、掌纹、足迹、掌静脉、耳朵、DNA 等。\n2.  **行为特征**：声音、步态、签名等。\n\
  \n图 Fig. 1 显示了 2019 年印度生物识别市场调查中不同生物识别模态使用情况的图表。\n\n\n\n\n![Fig. 1 Indian biometric\
  \ market share in US million](img/Fig.1)\n\n根据生物识别市场情况，指纹被广泛用于人员识别。儿童的指纹很小，不易采集。使用量第二大的生物识别模态是人脸。人脸图像易于采集，在寻找失踪儿童的情况下很有用。因此，我们使用人脸生物识别技术进行儿童识别。我们数据库中儿童不同生物特征的示例如图\
  \ 2 所示。\n\n![Fig. 2 Different biometrics for recognition of children](img/Fig.2)\n\
  \n人脸是一个 3D 模型，我们可以通过其特征（如眼睛、脸型和肤色）来识别它。自动人脸识别基于一个人的 2D 照片。1964 年和 1965 年，Woody Bledsoe\
  \ 与 Helen Chan 和 Charles Bisson 一起，首次利用计算机识别人脸。如今，成人人脸识别的准确率已达到 99.63% 的极高水平。\n\n\
  ##### 表 1\n\n| 受试者 | FNIR | FPIR |\n| :--- | :--- | :--- |\n| 婴儿 | 0.7 | 0.2 |\n\
  | 幼童 | 0.4 | 介于 0.2 和 0.05 之间 |\n| 青春期前 | 0.29 | 0.05 |\n\n儿童面部发育：Farkas 等人的论文研究表明，在儿童面部发育的前\
  \ 2 年，嘴宽增加而嘴高减小。嘴型从“花蕾状”变为更成人的类型。面部特征的生长在第一年非常快，第二年减缓。从 3 岁到 9 岁，后续变化缓慢且不规律。\n\n\
  儿童识别还有其他困难，例如他们通常处于玩耍心情，这会导致表情和姿态变化。尽管成人监督和激励有助于提高数据采集质量，但幼儿的注意力持续时间非常有限。正面人脸采集过程中仅允许表情变化。如果通过目视检查采集到的图像发现姿态、光照或模糊等其他变化，则需要重新采集图像。\n\
  \n因此，数据采集过程中保持平静极为推荐。数据采集所需时间也比成人数据采集更长。由于这些障碍，公开可用的儿童数据库很少。\n\n### 3: 儿童人脸数据库\n\
  \n本节讨论各种模态的儿童数据库。大多数数据库包含两个或更多会话。但出于安全原因，大多数不用于研究目的。\n\n#### 3.1: 新生儿人脸数据库\n\n新生儿人脸数据库是由\
  \ Bharadwaj 等人采集的首个用于新生儿人脸识别的纵向数据库。\n\n#### 3.2: 新生儿、婴儿和幼儿纵向人脸数据库 (NITL)\n\n该数据库由\
  \ Best-Rowden 等人采集，对象为印度儿童。\n\n#### 3.3: 儿童多模态生物识别数据库 (CMBD)\n\n该数据库属于 IIIT Delhi，由\
  \ Basak 等人采集。\n\n#### 3.4: 扩展新生儿人脸数据库\n\nSiddiqui 等人在印度采集了该数据库。\n\n其他数据库如 CFA、CLF、UTKFace\
  \ 和 VADANA 均为私有。大多数并不专注于儿童人脸识别研究。CFA 的年龄范围为 2 岁至 20 岁。CLF 的年龄范围为 2-20 岁，VADANA 的年龄范围为\
  \ 0-18 岁。UTKFace 的年龄范围为 0-32 岁。公开可用的人脸数据库有 ITWCC、ITWCC-D1、Adience 和 FG-NET。\n\n\
