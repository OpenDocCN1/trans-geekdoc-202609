  \ 4: 儿童人脸识别\n\n通用人脸识别系统以人脸图像为输入。后续阶段为预处理，使人脸图像适合不同的机器学习算法。特征提取是分类前的关键步骤。通用人脸识别系统如图\
  \ 7 所示。\n\n![Fig. 7 Block diagram of face recognition of children](img/Fig.7)\n\n\
  在本研究中，我们比较了所采集的同会话和跨会话数据的人脸识别准确率。详细研究了 PCA 和 LDA 两种特征提取技术。为保证识别算法的鲁棒性，还采用了五折交叉验证和留一法验证。分类采用不同的机器学习分类器，如支持向量机、线性判别分析、高斯朴素贝叶斯、K-近邻、决策树、逻辑回归和随机森林。\n\
  \n本章用于儿童人脸识别的各种方法如图 8 所示。\n\n![Fig. 8 Longitudinal face recognition methods’ study](img/Fig.8)\n\
  \n#### 4.1: 数据库预处理\n\n根据儿童人脸识别文献研究，预处理是手动进行的。\n\n预处理步骤包括人脸归一化、统一图像尺寸、基于眼睛对齐以及强度归一化。根据特征提取算法的需求，人脸图像被手动裁剪为不同尺寸。图\
  \ 9 显示了手动裁剪图像的样本。在本研究中，PCA 和 LDA 算法进行灰度转换，而 CNN 使用 RGB 图像。每个受试者的裁剪图像（5-10 张）单独存放在一个文件夹中。最后，所有受试者文件夹放在一个数据库文件夹中。\n\
  \n![Fig. 9 Preprocessed images](img/Fig.9)\n\n根据研究观察，手动裁剪的图像效果较好。因此，我们手动裁剪所有图像，使其尺寸一致。PCA\
  \ 和 LDA 特征提取算法中进行 RGB 到灰度的转换。CNN 使用 RGB 图像。\n\n#### 4.2: COTS——商用现成人脸匹配器\n\n它是包含特征提取的完整解决方案。大多数儿童人脸识别研究都是使用\
  \ COTS 匹配器进行的。\n\n### 5: 特征提取技术\n\n特征提取是一个过程，其主要目标是从数据库图像中减少特征数量。系统仅凭这些特征即可识别不同人员的人脸图像。特征可以是一条线、两眼之间的距离、一个点、嘴唇与眼睛之间的距离等。此外，它还能从现有特征中创建新特征。新创建的特征数量较少，有助于降低计算复杂度。特征提取技术的性能取决于其利用这些减少后的特征识别原始图像的效果。此处，我们总结了用于儿童人脸识别的机器学习特征提取算法。这些算法的性能完全依赖于特征提取。\n\
  \n#### 5.1: PCA——主成分分析\n\nPCA 是一种简单且广泛使用的基于外观的算法。它是一种无监督学习算法，意味着 PCA 在其算法中不使用类别标签。在新生儿人脸识别的初步研究中，Bharadwaj\
  \ 等人指出，降低图像分辨率可以提高 PCA 的性能。\n\n在用于人脸识别的 PCA 中，通过预处理图像来准备人脸图像数据库。\n\n```\nS = {Γ₁,\
  \ Γ₂, Γ₃, … Γₘ}\n```\n(si1_e (1))\n\n设每张图像大小为 224 × 224 像素。将其转换为 M × N 维的向量。现在图像向量大小为\
  \ 50,176。计算平均人脸。平均人脸向量 (Ψ) 需使用公式 (2) 计算。\n\n```\nΨ = (1/M) Σₙ₌₁ᴹ Γₙ\n```\n(si2_e\
  \ (2))\n\n儿童的平均人脸图像如图 10 所示。\n\n![Fig. 10 Average face image of the child](img/Fig.10)\n\
  \n从原始人脸中减去平均人脸向量，结果存储在变量中，\n\n```\nφᵢ = Γᵢ - Ψ\n```\n(si3_e (3))\n\n然后，协方差矩阵 C 通过以下方式获得，\n\
  \n\n\n\n$$\nC = \\frac{1}{M}\\sum_{n = 1}^{M}\\varphi_{n}\\ \\varphi_{n}^{T}\n$$\n\
  \n$$\nC = AA^{T}\\quad N^{2} \\times N^{2}\\ \\text{matrix},\n$$\n\n\n\n\n## 5.1:\
  \ PCA—主成分分析\n\n进入`/path/to/xxx`目录，找到`xxx.json`。\n\n在表达式`cvar = avar + bvar`中，加法运算符（`+`）将`avar`与`bvar`相加，得到它们的和`cvar`。\n\
  \n在`List.of(arg0, arg1, arg2)`中，`List`接口的工厂方法`of()`接受一系列的元素，返回包含它们的只读列表。\n\n之后我们这样调用`cmd`命令：`cmd\
  \ arg0 arg1 arg2`。\n\n```\nif (condVar > someVal) {console.log(\"xxx\")}\n```\n\n\
  其中 $A = [\\varphi_1, \\varphi_2, \\varphi_3, \\varphi_4, \\dots, \\varphi_M]$ 为\
  \ $N² \\times M$ 矩阵。\n\n进一步计算协方差矩阵的特征向量和特征值。公式 (4) 中的协方差矩阵 $C$ 维度极高。对于 $224 \\times\
  \ 224$ 的图像，必须计算 $50,176 \\times 50,176$ 的矩阵并得到 50,176 个特征脸。从计算角度看，这效率不高，因为大多数特征脸对任务无用。\n\
  \n因此，我们转而考虑矩阵 $L = AA^T$（$M \\times M$ 矩阵）。\n\n```\nNow compute eigenvectors v_i\
  \ of L = AA^T\n```\n(si5_e  (5))\n\n$L$ 的 $M$ 个特征向量用于求出 $C$ 的 $M$ 个特征向量，它们构成特征脸基，某儿童的\
  \ 90 个特征脸如图 11 所示。\n\n$$u_i = \\sum_{i=1}^{M} v_i \\varphi_i$$\n(si6_e  (6))\n\n\
  **图 11 特征脸示例。**\n\n仅保留 $K$ 个特征向量（对应 $K$ 个最大特征值），特征值较小的其他特征脸可省略，因为它们仅解释面部特征的一小部分。图\
  \ 12 展示了儿童人脸的 PCA 投影。\n\n**图 12 儿童的 PCA 投影。**\n\n接着绘制特征值谱图（图 13）以确定主成分数量。分析图表可知，90\
  \ 个分量后方差几乎恒定。因此，研究采用前 90 个主成分。\n\n**图 13 特征值与主成分关系图。**\n\nPCA 降低数据维度，在小型数据库上效果更好。因未使用类别标签信息（无监督学习），同类与异类样本处理方式相同。\n\
  \n混淆矩阵可作为性能指标，反映预测准确率与实际准确率。同一会话下 PCA 特征提取配合 SVM 分类准确率为 76%，其混淆矩阵如图 14 所示。\n\n**图\
  \ 14 同一会话数据库的混淆矩阵。**\n\n## 5.2: LDA—线性判别算法\n\nLDA 是有监督学习算法，即使用类别标签。LDA 是 PCA 的增强版，最适合类别分离。它利用类内散度矩阵和类间散度矩阵。Tiwari\
  \ 等人将 FLDA 用于婴儿人脸识别，在 10 个类别上用 $l_2$-norm 取得良好准确率。\n\n假设有 $C$ 个类别，$\\mu_i$ 为第 $i$\
  \ 类均值向量（$i=1,2,3,\\dots,C$），$M_i$ 为第 $i$ 类样本数（$i=1,2,3,\\dots,C$）。\n\n设 $M = \\\
  sum_{i=0}^C M_i$ 为总样本数。\n\n散度矩阵通过类内矩阵与类间矩阵计算得出。\n\n$$S_w = \\sum_{i=1}^{C}\\sum_{j=1}^{M}\
  \ (X_j - \\mu_i)(X_j - \\mu_i)^T$$\n(si7_e  (7))\n\n$$\\mathbf{S}_b = \\sum_{i=1}^{C}\
  \ (\\mu_i - \\mu)(\\mu_i - \\mu)^T$$\n(si8_e  (8))\n\n其中 $\\mu = \\frac{1}{C}\\\
  sum_{i=1}^{C}\\mu_i$ 为整个数据集的均值。\n(si9_e)\n\n数据投影公式 (9) 为：\n\n$$y = U^T x$$\n(si10_e\
  \  (9))\n\n其中 $U^T$ 为投影矩阵。\n\nLDA 计算使类间散度最大化、类内散度最小化的变换：\n\n$$\\max \\frac{|U^T\
  \ S_b U|}{|U^T S_w U|} = \\max \\frac{|\\tilde{S}_b|}{|\\tilde{S}_w|} \\quad \\\
  text{Products of eigenvalues}$$\n(si11_e  (10))\n\n$\\tilde{S}_b$, $\\tilde{S}_w$：投影数据\
  \ $y$ 的散度矩阵。\n(si12_e, si13_e)\n\nLDA 在大型数据库上效果最佳。因使用标签，类间分类效果好。但对小型数据库结果非最优。\n\n\
  LDA 特征提取配合线性回归分类器，在跨会话数据库上准确率达 84%。其混淆矩阵如图 15 所示。\n\n**图 15 跨会话数据库的混淆矩阵。**\n\n###\
  \ 6: 机器学习分类方法\n\n机器学习分类指对数据的自动分类或归类。本研究针对多类别儿童识别，详述多分类技术。图 16 展示不同分类技术。\n\n**图 16\
  \ 不同分类技术。**\n\n#### 6.1: 逻辑回归\n\n逻辑回归是主要用于二分类的统计方法，通过 Sigmoid 函数由线性回归推导而来。\n\n线性回归方程：\n\
  \n$$y = \\beta_0 + \\beta_1 X_1 + \\beta_2 X_2 + \\dots + \\beta_n X_n$$\n(si14_e\
  \  (11))\n\n其中 $y$ 为因变量，$X_1, X_2, \\dots, X_n$ 为自变量。\n\nSigmoid 函数：\n\n$$S(x) =\
  \ \\frac{1}{1 + e^{-x}}$$\n(si15_e  (12))\n\n在线性回归上应用 Sigmoid 函数得到逻辑回归方程：\n\n$$S(x)\
  \ = \\frac{1}{1 + e^{-(\\beta_0 + \\beta_1 X_1 + \\beta_2 X_2 + \\dots + \\beta_n\
  \ X_n)}}$$\n(si16_e  (13))\n\n输出始终在 0 到 1 之间。多项式逻辑回归可用于多分类，利用 Softmax 函数实现。\n\n\
  $$\\hat{y} = \\text{softmax}(xW + b)$$\n(si17_e  (14))\n\n### 6.2: K-近邻算法\n\nKNN\
  \ 是有监督学习算法，不使用概率分类，而是基于距离度量。KNN 通过搜索特征相似性工作，认为相似特征彼此临近。$K$ 为最近邻数量，由用户决定，通常取奇数，多为\
  \ $\\sqrt{n}$。KNN 使用的距离度量包括 Minkowski、Manhattan 和 Euclidean 距离。\n\nMinkowski 距离为通用公式，可推导出\
  \ Manhattan 和 Euclidean 距离。\n\n$$d(x,y) = \\left( \\sum_{i=1}^{n} |x_i - y_i|^p\
  \ \\right)^{\\frac{1}{p}}$$\n(si18_e  (15))\n\n$p=1$ 时为 Manhattan 距离，$p=2$ 为 Euclidean\
  \ 距离，$p=\\infty$ 为 Chebyshev 距离。\n\n#### 6.3: 决策树\n\n决策树是有监督学习算法。数据不断分裂成更小部分直到达到类别。使用节点、边、叶节点等术语。分类时先计算数据库熵，反映不确定性；熵越小分类效果越好。计算每个特征的信息增益，衡量分裂后不确定性降低程度。选择信息增益最高的特征分裂数据库，重复直到所有节点处理完毕。图\
  \ 17 给出决策树分类器基本结构及实现。\n\n**图 17 决策树基本结构与实现。**\n\n#### 6.4: 支持向量机\n\nSVM 是有监督学习算法，用于图像分类。目标是寻找正确超平面分隔特征。正确超平面使两类或多类数据点间隔最大。图\
  \ 18 给出三个超平面 A、B、C，超平面 B 到两类数据点边距最大，故为正确分类超平面。多分类使用多类 SVM。\n\n**图 18 支持向量机分类器。**\n\
  \n#### 6.5: 高斯朴素贝叶斯\n\n朴素贝叶斯分类器基于贝叶斯定理，假设图像特征间强独立。属概率分类器，实现简单，广泛用于机器学习分类。贝叶斯定理如公式\
  \ (16) 所示。\n\n$$P(A|B) = \\frac{P(B|A)P(A)}{P(B)}$$\n(si19_e  (16))\n\n高斯朴素贝叶斯是朴素贝叶斯的一种分类模型。连续数据服从正态（高斯）分布，故用高斯朴素贝叶斯分类连续数据。高斯模式下从训练库计算均值和标准差更容易。\n\
  \n### 7: 深度学习方法\n\n深度学习是机器学习分支，融合特征提取与分类。在大数据集上优于传统机器学习算法。儿童人脸识别采用 CNN。CNN 第一层学习线条、边缘等低级特征；层数加深则学习高级特征，故深度学习擅长高级特征提取。\n\
  \n本研究从基础到优化实现 CNN。初始 3 个卷积层，后增至 6 层，适用于同会话和跨会话数据库。激活函数用 ReLU，稠密层用 Softmax。损失函数为稀疏分类交叉熵。训练集\
  \ 70%，测试集 30%。CNN 架构如图 19 所示。\n\n**图 19 优化 CNN 模型架构。**\n\n### 8: 结果\n\n表 2 测试不同机器学习分类技术在儿童人脸\
  \ PCA 与 LDA 特征上的表现。数据库按 7:3 划分，70% 训练，30% 测试。同会话：训练 357 张，测试 153 张，共 510 张。跨会话：训练\
  \ 339 张，测试 146 张，共 485 张。跨会话准确率见表 3。\n\n**表 2**\n\n**同会话下 PCA 与 LDA 特征提取配合机器学习分类技术。**\n\
  \n**分类器** (images/B9780323852098000110/f01-01-9780323852098.jpg)\n\n\n\n\n## 图 1\
  \ 印度生物识别市场份额（单位：百万美元）⁴\n\n根据生物识别市场情况，指纹被广泛用于人员识别。儿童的指纹很小，不易采集。第二大使用的生物识别模态是人脸。人脸图像易于采集，且在寻找失踪儿童的情况下非常有用。因此，我们使用人脸生物识别技术进行儿童识别。我们数据库中儿童不同生物特征的示例见图\
  \ 2。\n\n![图 2 用于儿童识别的不同生物特征。](img/f01-02-9780323852098.jpg \"fig:\")\n\n人脸是一个 3D\
  \ 模型，我们可以通过其特征（如眼睛、脸型和肤色）来识别它。自动人脸识别基于人物的 2D 照片。1964 年和 1965 年，Woody Bledsoe 与 Helen\
  \ Chan 和 Charles Bisson 一起首次利用计算机识别人脸。如今，成人人脸识别的准确率已达到 99.63% 的极高水平 ⁵\n\n##### 表\
  \ 1\n\n| 受试者 | FNIR | FPIR |\n| :--- | :--- | :--- |\n| 婴儿 | 0.7 | 0.2 |\n| 儿童 |\
  \ 0.4 | 介于 0.2 和 0.05 之间 |\n\n\n\n\n\n# 学龄前儿童 0.29 0.05\n\n## 儿童面部发育\n\nFarkas 等人的论文研究表明，在儿童面部发育的前\
  \ 2 年中，嘴宽增加而嘴高减小。嘴部形状从“花蕾状”转变为更成人的类型。面部特征在第一年生长非常迅速，第二年增长速度减缓。从 3 岁到 9 岁，后续变化缓慢且不规则\
  \ ⁶。\n\n儿童识别还有其他困难，例如他们通常处于玩耍心情，这会导致表情和姿态变化。虽然成人监督和激励有助于提高数据采集质量，但幼儿的注意力持续时间非常有限。正面人脸采集过程中仅允许表情变化。如果通过目视检查采集的图像发现姿态、光照或模糊等其他变化，则需要重新采集图像\
  \ ⁷。\n\n因此，数据采集过程中保持冷静是非常推荐的。数据采集所需时间也比成人数据采集更长。由于这些障碍，公开可用的儿童数据库很少。\n\n## 3：儿童人脸数据库\n\
  \n本节讨论各种模态的儿童数据库。大多数数据库包含两个或更多会话。但出于安全原因，大多数不可用于研究目的。\n\n### 3.1：新生儿人脸数据库\n\n新生儿人脸数据库是由\
  \ Bharadwaj 等人收集的首个用于新生儿人脸识别的纵向数据库 ⁸。\n\n### 3.2：新生儿、婴儿和幼儿纵向人脸数据库 (NITL)\n\n由 Best-Rowden\
  \ 等人收集的数据库包含印度儿童 ⁹。\n\n### 3.3：儿童多模态生物识别数据库 (CMBD)\n\n该数据库来自 IIIT Delhi，由 Basak\
  \ 等人收集 ¹⁰。\n\n### 3.4：扩展新生儿人脸数据库\n\nSiddiqui 等人从印度收集了该数据库 ¹¹。\n\n其他数据库如 CFA、CLF、UTKFace\
  \ 和 VADANA 均为私有。大多数并非专注于儿童人脸识别研究。CFA 年龄跨度为 2 岁至 20 岁。CLF 年龄跨度为 2–20 岁，VADANA 年龄跨度为\
  \ 0–18 岁。UTKFace 年龄跨度为 0–32 岁。公开可用的人脸数据库有 ITWCC、ITWCC-D1、Adience 和 FG-NET。\n\n在公开可用的数据库中，FG-NET\
  \ 有 82 个受试者。总人脸图像 1002 张，年龄跨度 0–69 岁。它包含儿童人脸图像，但每个特定年龄仅有一张图像。我们需要同一特定年龄的多张图像来训练模型。FG-NET\
  \ 数据库的部分图像如 图 3 所示。\n\n![图 3 FG-NET 数据库中两名儿童随时间跨度的样本图像（按行排列）。](img/f01-03-9780323852098.jpg\
  \ \"fig:\")\n\n研究儿童人脸识别的主要障碍是缺乏公开数据库。我们收集了自己的数据库。我们大部分儿童人脸图像从学前学校收集，部分来自邻里。我们已获得学前学校的图像采集许可。同时也获得了家长关于将其孩子的生物识别细节用于研究目的的同意。儿童图像使用分辨率大于\
  \ 2000 万像素的手机相机采集。数据库分两个会话采集。首次采集的所有图像称为同会话数据库。二次采集的所有图像称为跨会话数据库。同一人采集图像的时间跨度为 2\
  \ 至 8 个月。数据库中儿童年龄范围为 2 个月至 5 岁。每个会话中，每个受试者约采集 6 张图像。为使图像尺寸一致，我们使用了 224 × 224 的图像尺寸。我们数据库的样本图像如\
  \ 图 4 所示。\n\n![图 4 自建数据库中两名儿童随时间跨度的样本图像（按行排列）。](img/f01-04-9780323852098.jpg \"\
  fig:\")\n\n人脸同会话数据库共 81 个受试者，年龄组 0–5 岁。\n\n`\\Face\\same-session`：包含 510 张 .jpg\
  \ 格式人脸，对应 81 个受试者（81 个受试者 * 6（平均）人脸 * 6，总计 ≈ 486）。\n\n人脸跨会话数据库共 48 个受试者，年龄组 0–5\
  \ 岁。\n\n`\\Face\\cross-session`：包含 485 张 .jpg 格式人脸，对应 48 个受试者（48 个受试者 * 10（平均）人脸\
  \ * 10，总计 ≈ 485）。\n\n此处，图 5 显示了同会话下每个受试者的图像分布。\n\n![图 5 儿童同会话人脸图像数据库。](img/f01-05-9780323852098.jpg\
  \ \"fig:\")\n\n此处，图 6 显示了跨会话下每个受试者的图像分布。\n\n![图 6 儿童跨会话人脸图像数据库。](img/f01-06-9780323852098.jpg\
  \ \"fig:\")\n\n## 4：儿童人脸识别\n\n通用人脸识别系统以人脸图像为输入。后续阶段为预处理，使人脸图像适合不同的机器学习算法。特征提取是分类前的关键步骤。通用人脸识别系统如\
  \ 图 7 所示。\n\n![图 7 儿童人脸识别框图。](img/f01-07-9780323852098.jpg \"fig:\")\n\n本研究比较了所采集同会话和跨会话数据的人脸识别准确率。详细研究了\
  \ PCA 和 LDA 两种特征提取技术。为保证识别算法的鲁棒性，还采用了五折交叉验证和留一法验证。分类采用不同的机器学习分类器，如支持向量机、线性判别分析、高斯朴素贝叶斯、K-近邻、决策树、逻辑回归和随机森林。\n\
  \n本章用于儿童人脸识别的各种方法如 图 8 所示。\n\n![图 8 纵向人脸识别方法研究。](img/f01-08-9780323852098.jpg \"\
  fig:\")\n\n### 4.1：数据库预处理\n\n根据儿童人脸识别文献研究，预处理是手动进行的 ¹²。\n\n预处理步骤包括人脸归一化、统一图像尺寸、基于眼睛对齐以及强度归一化。根据特征提取算法的需要，人脸图像被手动裁剪为不同尺寸。图\
  \ 9 显示了手动裁剪图像的样本。本研究中，为 PCA 和 LDA 算法进行灰度转换，CNN 使用 RGB 图像。每个受试者的裁剪图像（5–10 张）存放在单独文件夹中。最后，所有受试者文件夹放在一个数据库文件夹中。\n\
  \n![图 9 预处理后的图像。](img/f01-09-9780323852098.jpg \"fig:\")\n\n根据研究观察，手动裁剪图像效果较好。因此，我们手动裁剪所有图像，使其尺寸一致。PCA\
  \ 和 LDA 特征提取算法中进行 RGB 转灰度处理。CNN 使用 RGB 图像。\n\n### 4.2：COTS——商用现成人脸匹配器\n\n它是包含特征提取的完整解决方案。大多数儿童人脸识别研究使用\
  \ COTS 匹配器 ¹³。\n\n## 5：特征提取技术\n\n特征提取是一个过程，其主要目标是从数据库图像中减少特征数量。系统仅凭这些特征即可识别不同人员的人脸图像。特征可以是线条、双眼距离、点、唇眼距离等。它还能从现有特征创建新特征。新创建的特征数量较少，有助于降低计算复杂度。特征提取技术的性能取决于其利用这些简化特征识别原始图像的效果。此处总结了用于儿童人脸识别的机器学习特征提取算法。这些算法的性能完全依赖于特征提取。\n\
  \n### 5.1：PCA——主成分分析\n\nPCA 是一种简单且广泛使用的基于外观的算法。它是一种无监督学习算法，即 PCA 算法中不使用类标签。在新生儿人脸识别的初步研究中，Bharadwaj\
  \ 等人指出，降低图像分辨率可提高 PCA 性能 ¹⁴。\n\nPCA 用于人脸识别时，通过预处理图像准备人脸图像数据库。\n\n`S = {Γ[1], Γ[2],\
  \ Γ[3], … Γ[M]}`\n\n![si1_e](img/si1_e.png) (1)\n\n设每张图像大小为 224 × 224 像素。将其转换为 M\
  \ × N 维向量。此时图像向量大小为 50,176。计算平均人脸。平均人脸向量 (Ψ) 通过公式 (2) 计算。\n\n```\nΨ = (1/M) Σ_{n=1}^{M}\
  \ Γ_n\n```\n\n![si2_e](img/si2_e.png) (2)\n\n儿童平均人脸图像如 图 10 所示。\n\n![图 10 儿童平均人脸图像。](img/f01-10-9780323852098.jpg\
  \ \"fig:\")\n\n从原始人脸中减去平均人脸向量，结果存储在变量中，\n\n`φ[i] = Γ[i] − Ψ`\n\n![si3_e](img/si3_e.png)\
  \ (3)\n\n然后，协方差矩阵 C 通过以下方式获得，\n\n```\nC = (1/M) Σ_{n=1}^{M} φ_n φ_n^T\nC = A A^T\
  \  N² × N² 矩阵，\n```\n\n![si4_e](img/si4_e.png) (4)\n\n其中 `A = [φ[1], φ[2], φ[3],\
  \ φ[4], … φ[M]]` N² × M 矩阵。\n\n进一步计算协方差矩阵的特征向量和特征值。公式 (4) 中的协方差矩阵 C 维度很高。对于 224\
  \ × 224 图像，必须计算 50,176 × 50,176 矩阵并得出 50,176 个特征脸。从计算角度看这效率不高，因为大多数特征脸对我们的任务无用。\n\
  \n因此，我们考虑矩阵（M × M 矩阵）。\n\n`现在计算 L = A A^T 的特征向量 v[i]，`\n\n![si5_e](img/si5_e.png)\
  \ (5)\n\nL 的 M 个特征向量用于求出 C 的 M 个特征向量，它们构成特征脸基，儿童的 90 个特征脸如 图 11 所示。\n\n```\nu_i\
  \ = Σ_{i=1}^{M} v_i φ_i\n```\n\n![si6_e](img/si6_e.png) (6)\n\n![图 11 特征脸示例。](img/f01-11-9780323852098.jpg\
  \ \"fig:\"\")\n\n仅保留 K 个特征向量（对应 K 个最大特征值），特征值低的其他特征脸可省略，因为它们仅解释人脸特征的一小部分。图 12 显示了儿童人脸的\
  \ PCA 投影。\n\n![图 12 儿童的 PCA 投影。](img/f01-12-9780323852098.jpg \"fig:\")\n\n然后绘制特征值谱图（图\
  \ 13）以确定主成分数量。分析图表后发现，90 个分量后方差几乎恒定。因此，研究使用前 90 个主成分。\n\n![图 13 特征值与主成分关系图。](img/f01-13-9780323852098.jpg\
  \ \"fig:\")\n\nPCA 降低数据维度，对小型数据库效果较好。因未使用类别成员信息（无监督学习），同类和异类样本处理方式相同。\n\n混淆矩阵可作为性能参数。它显示预测准确率与实际准确率。同会话\
  \ PCA 特征提取结合 SVM 分类准确率为 76%。其混淆矩阵如下 图 14 所示。\n\n![图 14 同会话数据库混淆矩阵。](img/f01-14-9780323852098.jpg\
  \ \"fig:\")\n\n### 5.2：LDA——线性判别分析\n\nLDA 是一种有监督学习算法，即使用类标签。LDA 是对 PCA 方法的改进。它最适合类别分离。它使用类内散度矩阵和类间散度矩阵。Tiwari\
  \ 等人将 FLDA 用于婴儿人脸识别，在 10 个类别下使用 l² − 范数获得了良好准确率 ¹⁵。\n\n假设有 C 个类别，μ[i] 为第 i 类的均值向量，i\
  \ = 1,2,3, …, C。M[i] 为第 i 类内的样本数，i = 1,2,3, …, C。\n\n设 M = Σ[i=0]^C M[i] 为总样本数。\n\
  \n现在，散度矩阵通过类内矩阵与类间矩阵计算。\n\n```\nS_w = Σ_{i=1}^{C} Σ_{j=1}^{M} (Xj - μ_i) (Xj - μ_i)^T\n\
  ```\n\n![si7_e](img/si7_e.png) (7)\n\n```\nS_b = Σ_{i=1}^{C} (μ_i - μ) (μ_i - μ)^T\n\
  ```\n\n![si8_e](img/si8_e.png) (8)\n\n其中 `μ = (1/C) Σ_{i=1}^{C} μ_i` ![si9_e](img/si9_e.png)\
  \ 为整个数据集的均值。\n\n数据投影由公式 (9) 给出，\n\n`y = U^T x`\n\n![si10_e](img/si10_e.png) (9)\n\
  \n其中 `U^T` 为投影矩阵。\n\nLDA 计算使类间散度最大化且类内散度最小化的变换\n\n```\nmax |U^T S_b U| / |U^T S_w\
  \ U| = max |S̃_b| / |S̃_w|  特征值乘积\n```\n\n![si11_e](img/si11_e.png) (10)\n\n`S̃_b,`\
  \ ![si12_e](img/si12_e.png) `S̃_w` ![si13_e](img/si13_e.png)：投影数据 y 的散度矩阵。\n\nLDA\
  \ 对大型数据库效果最佳。因使用标签，类间分类效果好。LDA 结果对小型数据库非最优。\n\nLDA 特征提取结合线性回归分类器，跨会话数据库准确率达 84%。其混淆矩阵如下\
  \ 图 15 所示。\n\n![图 15 跨会话数据库混淆矩阵。](img/f01-15-9780323852098.jpg \"fig:\")\n\n## 6：机器学习分类方法\n\
  \n机器学习分类指数据的自动分类或归类。本研究执行多类别儿童识别。因此详细介绍多分类技术。不同分类技术如 图 16 所示。\n\n![图 16 不同分类技术。](img/f01-16-9780323852098.jpg\
  \ \"fig:\")\n\n### 6.1：逻辑回归\n\n逻辑回归是一种统计方法，主要用于二分类。它通过 Sigmoid 函数从线性回归推导而来。\n\n\
  线性回归方程。\n\n`y = β0 + β1 X1 + β2 X2 + … + βn Xn`\n\n![si14_e](img/si14_e.png) (11)\n\
  \n其中 y 为因变量，X1, X2, … Xn 为自变量。\n\nSigmoid 函数：\n\n```\nS(x) = 1 / (1 + e^{-x})\n\
  ```\n\n![si15_e](img/si15_e.png) (12)\n\n将 Sigmoid 函数应用于线性回归得到逻辑回归方程。\n\n```\nS(x)\
  \ = 1 / (1 + e^{-β0 + β1 X1 + β2 X2 + … + βn Xn})\n```\n\n![si16_e](img/si16_e.png)\
  \ (13)\n\n该方程输出始终在 0 和 1 之间。多项逻辑回归可用于多分类。它使用 Softmax 函数进行多分类。\n\n```\nŷ = softmax(xW\
  \ + b)\n```\n\n![si17_e](img/si17_e.png) (14)\n\n### 6.2：K-近邻\n\n它是一种有监督学习算法，分类不使用概率，而是使用距离度量。KNN\
  \ 算法基于特征相似性搜索。它认为相似特征总是彼此靠近。KNN 算法中，K 为最近邻数量。K 的选择由用户决定；通常为奇数。K 值多为 n 的平方根。KNN 使用的距离度量有闵可夫斯基距离、曼哈顿距离和欧氏距离。\n\
  \n闵可夫斯基距离方程为通式，可推导出曼哈顿和欧氏距离。\n\n```\nd(x,y) = (Σ_{i=1}^{n} |x_i - y_i|^p)^{1/p}\n\
  ```\n\n![si18_e](img/si18_e.png) (15)\n\n`p = 1`，曼哈顿距离；`p = 2`，欧氏距离；`p = ∞`，切比雪夫距离。\n\
  \n### 6.3：决策树\n\n它是一种有监督学习算法。该算法持续将数据分割成更小部分直到达到其类别。它使用节点、边和叶节点等术语。决策树分类器中，首先计算数据库的熵。它告诉我们数据库的不确定性程度。不确定性值越小，分类结果越好。计算每个特征的信息增益。这表明分割数据库后不确定性减少了多少。最后计算所有特征的信息增益，按信息增益最高的特征分割数据库。过程重复直到所有节点清晰。决策树分类器的基本结构及实现如\
  \ 图 17 所示。\n\n![图 17 决策树基本结构与实现。](img/f01-17-9780323852098.jpg \"fig:\")\n\n###\
  \ 6.4：支持向量机\n\n它是一种有监督学习算法。我们将其用于图像分类。SVM 旨在为数据库特征找到正确的超平面。正确超平面是使两个或更多数据点间间隔最大化的超平面。借助这些超平面，我们能分类不同数据点。图\
  \ 18 给出了分离数据点的三个超平面 A、B 和 C。超平面 B 到两个数据点的间隔最大。因此，B 是分离这两类的正确超平面。分类两类以上使用多类 SVM ¹⁶。\n\
  \n![图 18 支持向量机分类器。](img/f01-18-9780323852098.jpg \"fig:\")\n\n### 6.5：高斯朴素贝叶斯\n\n\
  朴素贝叶斯分类器基于贝叶斯定理。它提供图像特征间的强独立性假设。它们属于概率分类器范畴。这些分类器易于实现，因此在机器学习分类中广泛使用。贝叶斯定理如公式 (16)\
  \ 所示。\n\n```\nP(A | B) = P(B | A) P(A) / P(B)\n```\n\n![si19_e](img/si19_e.png)\
  \ (16)\n\n高斯朴素贝叶斯是朴素贝叶斯的一种分类模型。连续数据服从正态（高斯）分布。因此，我们使用高斯朴素贝叶斯对连续数据分类。在高斯模式下，从训练数据库计算均值和标准差更容易。\n\
  \n## 7：深度学习方法\n\n深度学习是机器学习的一个分支，结合了特征提取和分类过程。在大数据集上表现优于机器学习算法。儿童人脸识别使用 CNN。CNN 第一层学习人脸图像的低级特征，如线条和边缘。随着\
  \ CNN 层数增加，学习高级特征。因此，深度学习方法擅长高级特征。\n\n本研究从基础到优化级实现了 CNN。首先 CNN 有 3 个卷积层，随后为同会话和跨会话数据库增加到\
  \ 6 层。激活函数用 ReLU，全连接层用 Softmax。损失函数为稀疏分类交叉熵损失。训练集 70%，测试集 30%。CNN 架构如 图 19 所示。\n\
  \n![图 19 CNN 优化模型架构。](img/f01-19-9780323852098.jpg \"fig:\")\n\n## 8：结果\n\n表 2 中，针对儿童人脸图像的\
  \ PCA 和 LDA 特征测试了不同的机器学习分类技术。数据库按 70% 和 30% 划分。即 70% 人脸图像用于训练，30% 用于测试。同会话中，357\
  \ 张图像用于训练，153 张用于测试，总计 510 张。跨会话中，339 张用于训练，146 张用于测试，总计 485 张。跨会话准确率见 表 3。\n\n\
  #### 表 2\n\n\n\n\n\n# 利用机器学习分类技术进行 PCA 和 LDA 特征提取以实现同一会话识别\n\n| 特征提取 | 分类器 | 验证准确率\
  \ |\n| --- | --- | --- |\n| 三个卷积层，随后是最大池化和 softmax 激活函数 | 全连接层 | 0.76 |\n\n![图 21\
  \ 基础 CNN 人脸识别在跨会话下的模型准确率和损失。](img/f01-21-9780323852098.jpg)\n\n**图 21** 基础 CNN 人脸识别在跨会话下的模型准确率和损失。\n\
  \n为进一步提升结果，采用了数据增强技术。数据增强是一种在不收集新数据的情况下增加数据库多样性的技术。裁剪、填充和翻转是数据增强中使用的技术。训练图像数量越多，模型准确率越高。采用了六层卷积模型，配合\
  \ `L2` 核正则化和批量归一化。定制 CNN 在同一会话下的验证准确率见 **表 10** 并展示在 **图 22** 中，跨会话下的验证准确率见 **表\
  \ 11** 和 **图 23**。\n\n## 表 10：定制 CNN 在同一会话下的准确率\n\n| 特征提取 | 分类器 | 验证准确率 |\n| ---\
  \ | --- | --- |\n| 六个卷积层、最大池化，然后是 softmax 激活函数 | 全连接层 | 0.86 |\n\n![图 22 定制 CNN\
  \ 人脸识别在同一会话下的模型准确率和损失。](img/f01-22-9780323852098.jpg)\n\n**图 22** 定制 CNN 人脸识别在同一会话下的模型准确率和损失。\n\
  \n## 表 11：定制 CNN 在跨会话下的准确率\n\n| 特征提取 | 分类器 | 验证准确率 |\n| --- | --- | --- |\n| 六个卷积层、最大池化，然后是\
  \ softmax 激活函数 | 全连接层 | 0.94 |\n\n![图 23 定制 CNN 人脸识别在跨会话下的模型准确率和损失。](img/f01-23-9780323852098.jpg)\n\
  \n**图 23** 定制 CNN 人脸识别在跨会话下的模型准确率和损失。\n\n所提出方法的优势如下所示：\n\n1.  **收集了约 81 位受试者同一会话和\
  \ 48 位受试者跨会话的纵向数据库，此类数据库并不容易获取。** 大多数数据库均为同一会话数据。\n2.  **该算法用于识别模式，而文献中的大多数工作使用验证模式。**\n\
  3.  **本文实现的最大跨会话识别准确率为 95%，与文献报道相当。**\n\n## 9：讨论与结论\n\n儿童的健康与安全是任何国家的重要议题。稳健的儿童人脸识别系统是当务之急。利用人脸识别进行儿童生物特征识别，有助于关注儿童健康以及寻找失踪儿童。人脸识别系统应能应对儿童自然活动引起的各种变化。此外，算法应足够强大，以追踪儿童面部的纵向变化。在本章中，我们提出了一种基于机器学习和深度学习的儿童人脸识别方法。\n\
  \n构建人脸识别系统的主要障碍是数据库收集。正如本章所讨论的，网上有许多人脸图像数据库可用，但大多包含成人面部图像，儿童面部图像很少。此外，儿童图像数量很少，且多在单一会话中拍摄。为了对儿童面部进行实时研究，我们需要儿童的纵向数据集。这表明数据集应在一段时间内收集（间隔几个月），以记录面部变化并相应调整识别系统。因此，我们收集了自己的纵向数据集。该数据集包含\
  \ 81 位同一会话受试者和 48 位跨会话受试者，后者为同 48 位受试者在几个月后拍摄的面部图像。两次会话间的间隔为 3-6 个月。\n\n获取的数据集需要预处理，以提高人脸识别算法后续步骤的性能。主要任务是从每张图像中所有其他背景中仅提取人脸区域。此处，我们采用了人工裁剪人脸图像的方式，因为大多数研究者也使用相同技术。所有裁剪后的人脸图像均调整为相同尺寸。\n\
  \n预处理之后是特征提取步骤。特征提取通过降低原始数据的维度，使其易于处理，同时使识别过程在计算上更高效。此处，我们主要采用基于 `PCA` 和 `LDA` 的方法进行特征提取，这些方法更常用于成人人脸识别。提取特征后，我们使用了基于机器学习的多类分类技术。本研究对\
  \ `支持向量机 (SVM)`、`K-近邻 (KNN)`、`逻辑回归 (LR)`、`决策树` 和 `高斯朴素贝叶斯` 进行了比较研究和评估。采用 `LDA` 特征和\
  \ `逻辑回归` 获得的结果最为理想。众所周知，`LDA` 是 `PCA` 的改进，最适合类别分离。`逻辑回归` 是一种借助 softmax 函数进行多类分类的统计方法。在基于机器学习的分类器层面，虽然有许多算法可供比较，但对于我们的儿童人脸数据库，`LDA`\
  \ 和 `LR` 表现最为理想。\n\n为进一步提升性能，特别是针对跨会话人脸图像识别，我们实施了深度学习方法。深度学习是利用人工神经网络的机器学习分支。`CNN`\
  \ 是深度学习的方法之一。`CNN` 主要用于图像识别和分类。`CNN` 不需要复杂的预处理算法，能自行检测显著特征。我们首先实现了基础 `CNN`，然后对其进行优化以适应儿童人脸数据库。在层数为\
  \ 6、激活函数为 `Relu` 的优化 `CNN` 中，跨会话准确率从 86% 提升至 94%。\n\n此处我们展示了机器学习和深度学习可用于追踪童年期的面部变化，并能给出良好的识别准确率。本文工作的主要亮点在于：收集了跨会话面部图像（数据库）、采用了识别模式（而大多数文献讨论验证模式）、以及机器学习方法获得的准确率与其他研究者报道的相当。未来需要利用更大的数据库和增强数据进行进一步研究，以训练网络并获得更好的结果。\n\
  \n### 参考文献\n\n## 第 2 章：热成像生物特征人脸识别 (TBFR)：一种非接触式面部生物测量技术\n\n**Chirag Kyal**[^a]；**Harsh\
  \ Poddar**[^a]；**Motahar Reza**[^b]  \n[^a]: 计算机科学与工程系，国家科学技术学院，Berhampur，印度  \n\
  [^b]: 数学系，GITAM 视同大学，海得拉巴，印度\n\n### 摘要\n\n\n\n\n\n个人面部是一种重要的生物特征，可用于实时基于计算机的生物特征授权。为了创建此类系统，会采集各个领域中的人脸数据作为输入：可获取或生成可见光、热成像、素描或融合图像。这些领域各有优缺点。就可见光图像而言，系统主要受困于光照强度变化、姿态、配饰、衰老等问题。另一方面，热成像领域对光照不敏感，使其在这些问题上占据优势。正因如此，它不仅吸引了计算机科学家或研究人员，还吸引了心理学家和神经科学家投身于这一研发领域。在本工作中，提出了一种用于热红外图像的新型人脸识别算法。因其在非接触式人脸生物识别技术中的适应性，该系统被命名为热生物特征人脸识别（`TBFR`）系统。热人脸识别需要基于标准坐标借助基准地标进行人脸预对齐，这是一个非常关键的步骤。热图像的低分辨率、低对比度以及包含的纹理信息稀少，给检测图像对齐所需的基准地标带来了严峻挑战。为克服这一问题，在\
  \ `NVIE` 数据集图像上手动标注了 73 个生物特征地标点。这些地标信息随后被用于训练基于深度学习的地标检测架构，以实现自动人脸和地标预测。选择 `UCH\
  \ Thermal Temporal Face`（`UCH-TTF`）和 `PUCV Thermal Temporal Face`（`PUCV-TTF`）数据库作为探针集，`NVIE`\
  \ 数据库作为图库图像语料库。接着，将标注后的人脸图像裁剪为若干四边形块，并使用深度卷积神经网络从每个四边形切割中提取特征向量。最后，引入子空间几何和多种聚类算法，根据生物特征区分这些特征向量。实验结果证明，`TBFR`\
  \ 的性能和准确优于最先进方法。\n\n#### 关键词\n\n热成像；人脸识别；生物识别；基准地标；面部几何；深度学习；子空间聚类；特征空间\n\n### 1：引言\n\
  \n目前，人们在涉及自身保护和安全的问题上非常警惕。传统的验证方法，如密码和个人识别码（`PINs`），通常不够安全且不可靠。此外，生物特征没有这些缺点，现已在与安全和认证系统相关的多项开发活动中得到认可。而且，人类拥有各种生理特性，如不可绕过性、永久性、唯一性和可接受性\
  \ [[17]](#fn17)。\n\n#### 1.1：问题目的与目标大纲\n\n本章的主要贡献如下：\n\n*   我们提出了一种用于热红外图像的新型人脸识别算法。我们将其命名为热生物特征人脸识别（`TBFR`）。为了拥有能够解决此问题的算法，首先检测热红外人脸，然后基于标准坐标借助\
  \ 73 个基准地标点对热人脸进行对齐。\n*   利用这些标注图像，训练了一个基于深度学习的模型以专门处理标注任务。随后，标注图像被用于提取与人脸几何相关的附加信息，这些信息稍后与从\
  \ `ResNet-50` 层获得的特征向量融合。这些信息的融合在准确分类个人方面占据优势，从而构成了一种最先进的算法。\n*   我们提出的方法相比其他方法获得了更好的人脸识别性能。利用热成像的人脸识别实验在多个公开现有数据库上进行验证，以证明所提出的特征提取、特征融合和人员识别算法的有效性。\n\
  \n#### 1.2：章节组织\n\n本章其余部分分为以下几节：第 2 节 讨论人脸识别的现有方法。在 第 3 节 中，详细解释了提出的 `TBFR` 方法。第\
  \ 4 节 展示实验结果并与其他方法比较。第 5 节 讨论结论。\n\n### 2：现有方法\n\n使用 `RGB` 图像的人脸识别极易受环境光照影响，从而降低生物识别安全性。许多积极从事生物识别研究的科学家和研究人员都已承认人类数据去识别化的这一问题。在大多数人脸生物识别最先进算法中，机器学习和深度学习已证明具有显著性能，特别是卷积神经网络（`CNN`）在图像学习方面取得了优异结果。见\
  \ [[18]](#fn18)。\n\n在他们的工作中，Jian 等人 [[19]](#fn19)。\n\n一些科学家还发现，通过结合热图像和 `RGB` 图像可以改进人脸识别。Cao\
  \ 等人 [[20]](#fn20)。\n\n### 3：提出的工作\n\n在本章中，我们提出了一种新型人脸识别算法，可高效处理红外光谱范围内获取的图像。在该系统中，我们将深度学习的优势与浅层学习模型的技术相结合，以提供一种具有最先进特性的算法。\n\
  \n个人图像被输入系统，系统输出与该人身份相关的标签。输入图像首先被送入一个能够在热图像中检测人脸的算法。随后，利用我们之前工作 [[21]](#fn21) 中提出的现有训练好的基于深度学习的模型进行标注。\n\
  \n![Fig. 1 Schematic representation of the proposed algorithm.](img/f02-01-9780323852098.jpg)\n\
  \n图 1 提出算法的示意图。\n\n#### 3.1：热人脸检测\n\n通过在可见光领域检测人脸，解决了各种问题。但这并非完美解决方案，因此无法解决某些问题，例如：\n\
  \n1.  在光照不足的场所检测人脸；\n2.  区分真实人脸和打印图像的能力 [[22]](#fn22)；\n3.  识别图像中的各种压力和情绪类型 [[23]](#fn23)。\n\
  \n与可见光图像不同，热成像相机具备检测物体发出的热辐射的能力。图 2 描绘了我们之前工作 [[24]](#fn24) 中提出的热人脸检测的详细实现。\n\n\
  ![Fig. 2](img/f02-02-9780323852098.jpg)\n\n图 2 热人脸检测工作流程 [[25]](#fn25)。\n\n在此过程中，输入热图像通过阈值处理、开运算和闭运算等操作进行预处理，以获取人脸的物体边界。通过特征点计算和直方图绘制，检测出四个坐标点，即头顶点、左耳点、右耳点和颈部点。最后，通过在图像上创建矩形框来检测人脸。\n\
  \n#### 3.2：人脸地标标注\n\n借助现代基于深度学习的方法，可以解决热成像领域捕获的人脸图像相关的各种问题。目前，几种类型的卷积神经网络主导着研究领域。\n\
  \n对于面部地标定位任务，有三个数据集，即 `USTC-NVIE` [[26]](#fn26)。\n\n\n\n\n\n![Fig. 3 Seventy-three\
  \ landmark points with their coordinate in the face.](img/f02-03-9780323852098.jpg)\n\
  \n图 3 面部七十三个关键点及其坐标。\n\n#### 3.3 特征提取\n\n特征提取是从图像中提取有价值信息，然后利用这些信息完成工作的关键过程。它也是降维过程的一部分。大型数据集的一个重要特征是拥有大量变量，因此处理它们需要大量计算资源。因此，特征提取基本上是从这些数据集中提取有价值信息，然后利用这些信息完成工作的关键过程。\n\
  \n图像处理是应用特征提取过程以缩小输入图像并从中提取有价值信息的领域之一，从而降低了系统对存储和计算能力的高需求。有几种定义好的方法或算法可执行特征提取任务。其中一种方法涉及使用预训练模型，如\
  \ `VGG-16` [²⁷]。\n\n`残差网络` 或 `ResNet` 是一种传统神经网络，除了是 ImageNet Challenge（2015）的获胜者外，还广泛用于解决与计算机视觉相关的各种任务。使用它的最大优势在于能够在没有任何约束的情况下训练极深的神经网络。在此之前，由于梯度消失的存在，实现相同任务是一个繁琐的过程。`ResNet`\
  \ 通过引入“跳跃连接”概念（如 图 4 所示）实现了这一点。它在卷积层之间堆叠了带有跳跃连接（由弯曲箭头表示）的层。这些跳跃连接（图 5）允许权重在前向传播中直接传递给其他层，并允许更新在反向传播中传递到这些深层。`ResNet-50`\
  \ 中的 `50` 指的是具有权重的层数。\n\n![Fig. 4 Architecture of ResNet-50.](img/f02-04-9780323852098.jpg)\n\
  \n图 4 ResNet-50 架构。\n\n![Fig. 5 Pictorial representation of skip connection in ResNet-50\
  \ where x-identity branch is our skip connection.](img/f02-05-9780323852098.jpg)\n\
  \n图 5 ResNet-50 中跳跃连接的图示，其中 x-identity 分支即为我们的跳跃连接。\n\n除 `ResNet` [²⁸] 外。\n\n####\
  \ 3.4 面部几何生物识别与特征融合\n\n`ResNet-50` 输出一个 `2048` 维度的特征向量。该向量可作为光学视觉领域问题的有用特征向量。然而，在热成像领域，仅直接将此向量作为输入送入生物识别系统是不够的。因此，我们可以将特征向量与人的面部几何信息相结合。这两类信息的结合在热成像领域的人物识别中已显示出显著效果。\n\
  \n世界上每个人都是独一无二的。基于这一信念，我们将眼睛大小、眼距、面部宽度和长度、眼睛到嘴巴的距离视为与人面部几何相关的信息。使用 `欧拉距离` ([`en.wikipedia.org/wiki/Euclidean_distance`](https://en.wikipedia.org/wiki/Euclidean_distance))\
  \ 指标从面部获取此类信息。\n\n图 6A 中的线段 `AB` 和 `CD` 分别代表眼睛之间的最近距离和最远距离。这些距离分别测量自基准点（`22`、`23`）和（`18`、`27`）。它用于计算人的眼睛大小及眼距。图\
  \ 6A 中的线段 `EF` 代表眼睛到嘴巴的距离。这是通过图像上标记为 `28` 和 `63` 的点的坐标测量得出的。\n\n![Fig. 6 Annotated\
  \ image with facial geometry shown as lines.](img/f02-06-9780323852098.jpg)\n\n\
  图 6 标注了面部几何线条的图像。\n\n在 图 6B 中，线段 `AB` 代表基准点 `9` 和 `71` 之间的距离，进而代表一个人的面部长度。同一图像中的线段\
  \ `CD` 代表基准点 `1` 和 `17` 之间的距离，进而代表一个人的面部宽度。\n\n这五个距离与从 `ResNet-50` 获取的特征向量相结合，使其在后续操作中更加突出。\n\
  \n#### 3.5 用于生物识别的深度子空间聚类\n\n为了执行最终的生物识别步骤，我们采用了基于深度神经网络架构的子空间聚类方法 [²⁹]。\n\n\n\n\
  \n\n#### 3.6 最终生物特征聚类人脸\n\n为了考虑人脸识别的挑战和困难，这些挑战和困难包含面部表情变化、光照变化、不同角度的旋转、尺度变化等，基于深度神经网络架构的子空间聚类技术已被应用于\
  \ `UCH-TTF`、`PUCV-TTF` 和 `USTC-NVIE` 数据集。如图 8 所示，已以高精度达成良好的一致性。\n\n![Fig. 8 Clustered\
  \ thermal faces for each subject, different color of the box representing different\
  \ face cluster.](img/f02-08-9780323852098.jpg)\n\n### 4 实验结果\n\n本节详细阐述了所提方法的实现分析。实验在配备\
  \ 3.2 GHz 主频、32 GB 内存和 2 GB NVIDIA GeForce 940MX 显卡的 Windows PC 基础设施上实施。选择搭配 `Tensorflow-1.13.0`\
  \ 的 Python 作为实现工作的基础编程框架。\n\n#### 4.1 数据库的选择\n\n热成像人脸数据库的选择在 TBFR 模型的训练和测试评估中起着重要作用。数据集因各种原因而有所不同，例如记录距离、热成像相机质量、红外波段、面部表情、记录环境和姿态。我们在三个标准热成像数据集上进行了所提的生物特征识别。所有三个数据集的样本如图\
  \ 9 所示。我们在以下部分展示数据集的详细信息：\n\n*   **UCH 热成像时序人脸 (UCH-TTF) 数据库**\n*   **PUCV 热成像时序人脸\
  \ (PUCV-TTF) 数据库**\n*   **USTC-NVIE 数据库**\n\n![Fig. 9 Samples of (A) UCH-TTF database,\
  \ (B) PUCV-TTF database, and (C) USTC-NVIE database.](img/f02-09-9780323852098.jpg)\n\
