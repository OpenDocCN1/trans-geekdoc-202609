  \n### 5: 结论\n\n掌纹图像包含大量相关的特征和信息。本章讨论了各种掌纹图像增强方法，这些方法被实施以提高掌纹图像的质量。图像质量统计度量决定了掌纹图像的质量。图像调整和去相关扩展了相应的直方图部分。一幅图像是低对比度还是良好对比度，取决于人类的感知，因为基于人类观察的增强评估是主观测量。客观质量测量用于评估最佳的掌纹图像增强技术。本章讨论了不同的图像增强技术。为了提高掌纹图像质量并评估图像质量，本章介绍并讨论了常用的统计度量。由于主观分析因人而异，且取决于他们对图像的解读基础，因此难以依赖主观分析。这往往会成为一个耗时且有偏见的过程。\n\
  \n### 参考文献\n\n## 第 5 章：用于个人认证的视网膜生物识别\n\nR. Manjula Devi^(a)；P. Keerthika^(a)；P.\
  \ Suresh^(b)；Partha Pratim Sarangi^(c)；M. Sangeetha^(a)；C. Sagana^(a)；K. Devendran^(a)\
  \ ^a 计算机科学与工程系，Kongu Engineering College，Erode，Tamil Nadu，India\n\n^b 信息技术系，Kongu\
  \ Engineering College，Erode，Tamil Nadu，India\n\n^c 计算机工程学院，KIIT Deemed to be University，Bhubaneswar，India\n\
  \n### 摘要\n\n生物识别认证是基于生物识别度量对每个个体的身份进行认证的过程。在所有可用的生物识别度量中，视网膜生物识别被视为一种安全的方法，因为它为每个人提供独特的模板，且在人的一生中不会改变。在这项工作中，提出了一种基于\
  \ ANFIS 的视网膜生物识别认证系统 (ARBAS) 的高效生物识别视网膜识别方法，用于个人认证，并在名为 VARIA 数据库的实时数据集上进行了验证，该数据库包含在不同时间从不同人员收集的视网膜图像样本。使用视网膜的认证过程经历两个阶段：注册阶段和认证阶段。在注册阶段，扫描各人的视网膜；基于视网膜的提取特征导出生物识别模式，并将模板存储在数据库中以供将来使用。在认证阶段，扫描人的视网膜；从中提取生物识别模式，并将提取的模式与数据库中存储的模式进行关联。如果模式匹配，则将用户认证为授权用户。ARBAS\
  \ 在 VARIA 数据库上分别实现了 2.78% 和 2.94% 的 FRR 和 FAR。\n\n#### 关键词\n\n视网膜生物识别；生物识别认证；ANFIS；VARIA\
  \ 数据集；ARBAS\n\n### 1: 引言\n\n\n\n如今，互联网已成为全球日常生活中至关重要且不可避免的一部分，这使其面临更多威胁和不安全因素。互联网使用量的增加以及计算机/移动设备融入我们的日常生活，取决于个人需求和目标。随着计算机和互联网对日常生活的融合度不断加深，大量敏感和个人数据已通过互联网以数字化方式共享。与此同时，对提升安全级别和认证系统以识别人员身份的需求持续增长，并在采购、机密私人数据监管、电子支付、股票获取、银行业务和进入企业大楼等众多医疗和金融领域引发了极大兴趣。因此，有必要保护敏感和个人数据/系统，防止未经授权的人员访问。\n\
  \n为了保障在线数据安全，防止未经授权的人员访问，安全的认证系统至关重要。该系统的主要目的是验证用户访问认证系统的权利，并防御身份欺诈和盗窃。传统上，识别个人权利的认证系统是通过密码、带外认证、知识因素、回答秘密问题等方式完成的。然而，由于信息丢失、欺诈行为、无法持续记忆或复现等原因，这些传统方法遭遇了诸多质疑。为了克服这些弊端，且生物特征识别因子具有个体唯一性且在验证身份方面更可靠，生物特征认证系统被推荐作为上述用于认证的传统系统的解决方案。\n\
  \n“生物特征识别”一词源自两个词汇：“Bio”和“Metrics”。Bio 意为生命，Metrics 意为度量。生物特征识别的定义是：用于校准人类特征以以极其独特的方式识别或认证个人的度量标准。基于特征，生物特征识别大致分为生理特征和行为特征。生理特征是源自个体身体特征的特征，如耳朵、虹膜、面部、掌纹、指纹、视网膜和静脉。行为特征是源自个人行为模式的特征，如声音、签名、击键动力学和步态。\n\
  \n生物特征认证是基于生物特征度量对每个个体的身份进行认证的过程。生物特征的类别如图 1 所示。与其他传统认证方法相比，生物特征认证提供了高安全性、唯一性、便捷性、易用性、防伪造和速度等特性。\n\
  \n![图 1 生物特征的类别。](img/f05-01-9780323852098.jpg)\n\n图 1 生物特征的类别。\n\n生物特征认证系统也可通过筛选以下生物特征来获取生物特征识别因子加以应用：指纹\
  \ ⁹⁹\n\n近年来，基于各种生物特征的众多认证系统已被开发出来，如虹膜、手指、掌纹、面部和耳朵。在不同的生物特征中，视网膜是本文考虑用于个人认证的生物特征之一，因为它具有唯一性和稳定性。由于视网膜无法伪造且位于眼球内部，因此被视为识别个人非常安全且稳定的来源。通过在认证方法中提取视网膜血管网络以进行个体识别，实现了模式匹配。视网膜血管网络不存在完全的遗传决定性，因为同卵双胞胎也不存在相似模式。即使在基因上无法区分的双胞胎中，从视网膜提取的特征也能有效区分个体，因为视网膜模式具有高度独特的特性。对每个人而言，眼球后部的血管都具有特定模式。利用各种图像处理技术，对血管网络进行分割，随后利用分割组件对视网膜图像进行识别。\n\
  \n### 2：基于生物特征的认证系统框架\n\n基于生物特征的认证系统工作流程经历两个阶段：注册阶段和认证阶段。在图 2 所示的注册阶段，从各个个体采集的生物特征数据经过预处理以提取特征。根据提取的特征生成模板，并将提取的特征累积存储在数据库中，以供未来进一步处理时用于认证目的。\n\
  \n![图 2 注册阶段。](img/f05-02-9780323852098.jpg)\n\n图 2 注册阶段。\n\n在图 3 所示的认证阶段，从个体提取生物特征数据；利用图像处理技术从中提取生物特征模式，并将提取的模式与数据库中存储的模式进行关联比对。如果生物特征模式与数据库中累积的模板匹配，则该用户被视为合法用户。如果生物特征模式与数据库中存储的模板不匹配，则该用户被视为非法用户。\n\
  \n![图 3 认证阶段。](img/f05-03-9780323852098.jpg)\n\n图 3 认证阶段。\n\n### 3：相关工作\n\n生物特征模式识别问题的标准流程包含以下一系列不同阶段：采集、图像质量评估、预处理、感兴趣区域确定（模板）、特征提取和生物特征比对。\n\
  \n文献中可找到各种形式的生物特征认证系统，包括指纹识别、眼部视网膜/虹膜识别、耳朵识别、气味识别、静脉识别、人脸识别、步态识别、打字识别、语音/说话人认证、手部几何识别、签名识别等。\n\
  \n#### 3.1：人脸认证\n\n人脸认证系统采集一个人的面部图像并从中提取面部特征，这些特征将用于认证过程。有人提出了一种专门用于活体检测的面部认证方法，该方法结合特征描述子使用基于模糊的\
  \ SVM 分类器，允许从整个物体中选择特定区域，并从特定物体区域提取特征，从而减少处理时间和特征提取的复杂性 ¹⁰⁰\n\n#### 3.2：虹膜认证\n\n\
  虹膜认证系统使用虹膜扫描仪从人眼采集虹膜图像，并基于虹膜边缘、瞳孔位置及其边缘提取虹膜的独特模式。NeuroBiometric 是一种基于眨眼的高效生物特征认证系统，采用基于事件的神经形态视觉传感器。该视觉传感器基于瞬态眨眼信号引入，利用从眨眼数据构建的生物特征特征，如能量特征、速度特征、持续时间特征、频率特征和比率特征。NeuroBiometric\
  \ 已被证明具有鲁棒性和安全性，且具有极低的误报率 ¹⁰¹\n\n#### 3.3：掌纹认证\n\n\n\n# 掌纹认证\n\n掌纹认证是基于手掌表面的主要纹线、沟谷、皱纹和脊线等独特特征进行的。通过结合基于掌部几何和掌静脉匹配的掌静脉认证与掌部几何识别方法，并利用直觉模糊评价，构建了生物特征认证系统的广义网模型\
  \ ¹⁰²。\n\n#### 3.4：指纹认证\n\n指纹识别系统通过检查按压在光滑表面上的手指来工作。系统会扫描手指的脊线和沟谷，脊线和沟谷终止或交汇处的一系列独特点被称为细节点。这些细节点是指纹识别系统用于比对的关键点。为了识别个人身份，系统会利用人手指尖表面的沟谷（细节点）和脊线。\n\
  \n得益于传感器技术的飞速发展，一种用于手持电子设备的新型生物特征认证系统应运而生，该系统具有鲁棒性。该系统通过智能融合手指的三维运动与大脑活动，利用新一代传感器消费电子（CE）设备以及\
  \ `Random Forest (RF)`（随机森林）和 `Hidden Markov Model (HMM)`（隐马尔可夫模型）等分类器来验证签名 ¹⁰³。\n\
  \n#### 3.5：耳部\n\n耳廓的形状和组织结构对每个人来说都是独特的。耳部识别方法侧重于匹配耳廓显著点到耳部基准位置的距离。一种基于融合的多模态生物特征认证系统已被提出，该系统利用指纹和耳部图像，通过\
  \ `Binary Robust Invariant Scalable Keypoints (BRISK)`（二进制鲁棒不变可缩放关键点）和 `Speed Up\
  \ Robust Features (SURF)`（加速鲁棒特征）等特征提取技术对图像进行预处理和增强 ¹⁰⁴。\n\n#### 3.6：语音\n\n语音也是一种生理特征，因为每个人的音调不同，但语音识别通常被归类为行为生物特征，主要研究一个人说话的方式。一种面向应用的认证系统已被开发出来，它分为训练阶段和识别阶段两个阶段，利用说话人语音验证进行认证\
  \ ¹⁰⁵。\n\n#### 3.7：签名\n\n签名认证检查用户签署签名的方式。除了签名静态形状的特征外，签名过程中的其他特征也被用于验证，如速度、压力和笔速。一种基于区块链的新型安全认证技术被提出，旨在加强对极其敏感的医疗数据的保护，这些数据在医院和患者之间传输。为了在基于云服务器的环境中结合医疗物联网网络实现敏感医疗数据的安全传输，采用了\
  \ `Lamport Merkle Digital Signature (LMDS)`（兰波特-默克尔数字签名）来执行签名的创建和认证 ¹⁰⁶。\n\n####\
  \ 3.8：击键动力学\n\n击键动力学是一种生物特征，用于通过打字节奏验证个人身份，它既能应对专业打字员，也能应对新手的双指打字法。个人击键操作难以模仿，可用于身份认证。此外，在不干扰用户舒适度的前提下，对击键动力学的研究极大地提高了计算机系统使用的安全等级，通过分类器的技能选择，显著增强了用户识别能力\
  \ ¹⁰⁷。\n\n#### 3.9：步态\n\n一个人行走的基本方式即步态生物特征，它是一种复杂的时空生物特征。然而，步态并不旨在具有高度独特性，但适用于某些低安全性应用场景中的验证。利用循环、前馈和混合神经网络架构构建分类器模型，基于对行走方式（步态）的监控进行用户认证，该模型使用加速度计和陀螺仪数据执行步态验证，并研究监控用户步态的时间长度如何影响预测准确性\
  \ ¹⁰⁸。\n\n### 4：视网膜解剖\n\n在本章中，视网膜作为最独特且最安全的模态之一，被建议用于生物特征认证系统，因为它受到人眼内部的严密保护 ¹⁰⁹。\n\
  \n![Fig. 4 Structure of retina.](img/f05-04-9780323852098.jpg)\n\n**图 4 视网膜结构。**\n\
  \n视网膜包含以下视网膜成分：中央凹、黄斑、视盘、静脉和动脉。黄斑位于视网膜的中心。黄斑呈椭圆形，具有色素区，其直径为 5.5 毫米（0.22 英寸）。当黄斑受损时，视力会变得模糊。它负责高分辨率的中央色觉，这在良好的光照条件下也是可行的。视网膜的下一个重要成分是中央凹，它位于黄斑区的正中央。中央凹负责提供敏锐的中央视力。敏锐的中央视力也被称为中央凹视力。这种视力对于人类的主要活动至关重要，如与用眼相关的阅读和驾驶。接下来，视神经是将人眼与大脑连接起来的神经，由超过\
  \ 100 万根神经纤维组成。它用于传递光线照射视网膜产生的信号。青光眼是由高眼压引起的疾病，会损害视神经。\n\n在视盘处，所有中央视网膜血管从其中心发出。它们越过边缘并向外辐射，为视网膜提供光照。视网膜中央动脉穿过视盘延伸向视网膜。它为形成视神经的所有神经纤维供血。视网膜中央静脉是一条穿过视神经的静脉。约一半的视神经纤维传递来自中央凹的信息，而视神经中另一半神经纤维传递来自视网膜其余部分的信息。在科学技术进步的帮助下，视网膜采集设备已得到开发，这对视网膜生物特征认证系统的生产做出了重大贡献。\n\
  \n### 5：基于 ANFIS 的视网膜生物特征认证系统 (ARBAS)\n\n`ANFIS` 代表自适应网络模糊推理系统 ¹¹⁰。\n\n`ANFIS` 是一种本质上非常基础的数据学习技术。`ANFIS`\
  \ 利用模糊逻辑，通过高度互联的神经网络处理元素转换输入，以获得所需的输出。权重被分配给这些连接，以将数值输入映射到相应的输出。`ANFIS` 网络已成功应用于模式识别、基于规则的过程控制、分类任务以及上述类似问题等研究领域。通过应用神经网络的学习方法来调整模糊推理系统（FIS）的参数。整个\
  \ `ARBAS` 框架经历两个阶段：训练阶段和测试阶段。\n\n#### 5.1：训练阶段\n\n\n\n\n# 眼底相机与 ANFIS 架构\n\n眼底相机也称为视网膜相机。它配备了一台连接在精密低倍显微镜上的相机，用于拍摄眼球内表面。视网膜血管、黄斑、后极（也称为眼底）、视盘和视网膜构成了眼球的内表面。基于间接检眼镜，使用眼底相机进行光学设计。视角是用于描述眼底相机的透镜的光学接受角。\n\
  \n在眼底相机中，广角视角的视角在 45 到 140 度之间，标准视角的视角为 30 度，窄角视角的视角为 20 度或更小。标准视角用于创建放大 2.5 倍的胶片图像。广角视角提供的视网膜放大倍数成比例地较小。图\
  \ 5A–C 分别显示了 20、40 和 60 度等不同视角下的视网膜不同视图。\n\n![图 5 不同视角下的视网膜不同视图。](img/f05-05-9780323852098.jpg)\n\
  \n**图 5** 不同视角下的视网膜不同视图。\n\n在 图 6 所示的训练阶段中，眼底相机被用于从一组人眼中捕捉视网膜眼底图像。在图像预处理中，人眼视网膜图像中的血管使用基于数学形态学的边缘检测进行分割。使用\
  \ Canny 边缘检测技术，提取了中央凹的边缘。一旦提取了边缘，就测量了中央凹的直径。同样，提取了其他特征并作为数据集存储。（参见 图 7。）\n\n![图\
  \ 6 使用 Canny 边缘检测进行中央凹提取。](img/f05-06-9780323852098.jpg)\n\n**图 6** 使用 Canny 边缘检测进行中央凹提取。\n\
  \n![图 7 ARBAS 训练阶段。](img/f05-07-9780323852098.jpg)\n\n**图 7** ARBAS 训练阶段。\n\n然后，将分割后的图像作为输入提供给特征提取技术的过程，以从分割特征中提取特征来执行训练过程。\n\
  \n一旦提取了特征，它就会被转换为数据集以供进一步处理。一旦使用足够的视网膜图像完成了数据集的创建，它就会作为输入提供给 `ANFIS` 进行训练。一旦训练完成，`ANFIS`\
  \ 训练模型就准备好进行评估了。\n\n为了演示 `ANFIS` 架构的工作过程，网络结构如 图 8 所示。基于一阶 Sugeno 模型，定义了以下两条模糊 IF-THEN\
  \ 规则：\n\n$$\n\\begin{array}{l}\n\\text{规则}_{(1)}:\\mspace{9mu}\\mathbf{IF}\\mspace{2mu}\
  \ x\\mspace{2mu}\\text{是}\\mspace{2mu} A_{1}\\mspace{2mu}\\mathbf{AND}\\mspace{2mu}\
  \ y\\mspace{2mu}\\text{是}\\mspace{2mu} B_{1},\\mathbf{THEN} \\\\\n\\mspace{104mu}\
  \ f_{1} = p_{1}x + q_{1}y + r_{1} \\\\\n\\text{规则}_{(2)}:\\mspace{9mu}\\mathbf{IF}\\\
  mspace{2mu} x\\mspace{2mu}\\text{是}\\mspace{2mu} A_{2}\\mspace{2mu}\\mathbf{AND}\\\
  mspace{2mu} y\\mspace{2mu}\\text{是}\\mspace{2mu} B_{2},\\mathbf{THEN} \\\\\n\\mspace{104mu}\
  \ f_{2} = p_{2}x + q_{2}y + r_{2}\n\\end{array}\n$$\n\n其中\n\n*   `x` 和 `y` 是作为输入给定的变量，\n\
  *   `f[1]` 和 `f[2]` 是产生输出的一阶多项式，\n*   `A` 和 `B` 是 IF-THEN 规则前件部分中可用的模糊集合，以及\n* \
  \  `p[1]`、`q[1]`、`p[2]` 和 `q[2]` 是在训练阶段确定的作为设计参数的常数。\n\n![图 8 ANFIS 网络结构。](img/f05-08-9780323852098.jpg)\n\
  \n**图 8** ANFIS 网络结构。\n\n`ANFIS` 结构中每个单独层所涉及的分步过程在以下步骤中详细说明：\n\n##### 步骤 1：模糊化层\n\
  \n该层中的每个节点都包含一个自适应性质的隶属函数。模糊化层是第一层，用于对输入进行模糊化；即它产生给定输入的隶属值作为该层的输出。与该层中每个节点 `i` 相关的隶属函数在公式\
  \ (1) 中描述。\n\n$$O_{i}^{1} = \\mu_{A_{i}}(x)$$\n\n![si2_e](img/si2_e.png) (1)\n\n\
  其中\n\n*   `x` 是作为输入提供给节点 `i` 的输入变量，\n*   `\\mu[Ai]` 是变量 `A[i]` 的模糊隶属函数，以及\n*   `A[i]`\
  \ 是与该节点函数相关的语言变量。\n\n确定钟形隶属函数 `\\mu[A[i]](x)` 的公式如公式 (2) 或公式 (3) 所示\n\n$$\\mu_{A_{i}}\\\
  left( x \\right) = \\frac{1}{1 + \\left\\lbrack \\left( \\frac{x - c_{i}}{a_{i}}\
  \ \\right)^{2} \\right\\rbrack^{b_{i}}},\\mspace{22mu} i = 1,2$$\n\n![si3_e](img/si3_e.png)\
  \ (2)\n\n或\n\n$$\\mu_{A_{i}}\\left( x \\right) = \\exp\\left\\{ {- \\left( \\frac{x\
  \ - c_{i}}{a_{i}} \\right)^{2}} \\right\\}\\mspace{342mu}$$\n\n![si4_e](img/si4_e.png)\
  \ (3)\n\n其中\n\n*   `x` 是作为输入给定的变量，以及\n*   `{a[i], b[i], c[i]}` 是待调整的隶属函数参数集。\n\n\
  ##### 步骤 2：蕴含层\n\n在该层中，所有节点均为固定节点，并标记为代表乘法器的符号 \"M\"。每条规则的模糊触发强度 `w[i]` 通过使用模糊 AND\
  \ 运算符相乘传入信号来确定，并使用公式 (4) 为所有节点产生乘积值作为输出\n\n$$O_{i}^{2} = w_{i} = \\mu_{A_{i}}(x)\
  \ \\times \\mu_{B_{i}}(y),\\quad i = 1,2$$\n\n![si5_e](img/si5_e.png) (4)\n\n#####\
  \ 步骤 3：归一化层\n\n在该层中，所有节点均为固定节点，并标记为代表归一化过程的符号 \"N\"。对于每个节点，使用该节点的规则触发强度除以所有规则触发强度之和的公式来计算规则的归一化模糊触发强度。以下公式\
  \ (5) 用于确定该节点的输出，即归一化的模糊触发强度\n\n$$O_{i}^{3} = \\overline{w_{i}} = \\frac{w_{i}}{w_{1}\
  \ + w_{2}},\\mspace{22mu} i = 1,2$$\n\n![si6_e](img/si6_e.png) (5)\n\n##### 步骤 4：去模糊化层\n\
  \n该层中的所有节点均为自适应节点。该层的输出（即加权后件值）使用由公式 (6) 给出的节点函数来确定\n\n$$O_{i}^{4} = \\overline{w_{i}}f_{i}\
  \ = \\overline{w_{i}}\\left( {p_{i}x + q_{i}y + r_{i}} \\right),\\mspace{22mu} i\
  \ = 1,2$$\n\n![si7_e](img/si7_e.png) (6)\n\n其中\n\n*   `{p[i], q[i], r[i]}` 是待调整的隶属函数参数集，以及\n\
  *   `w[i]` 是第 3 层的输出\n\n在该层中，待调整的参数称为后件参数。\n\n##### 步骤 5：综合层\n\n\n\n\n本层中仅有一个固定节点。通过使用公式(7)\
  \ 对所有输入信号求和，在本层计算总体输出。\n\n```\n$O\\_{i}^{5} = \\\\sum\\\\limits\\_{i}\\\\overline{w\\\
  _{i}}f\\_{i} = \\\\frac{\\\\sum\\_{i}w\\_{i}f\\_{f}}{\\\\sum\\_{i}w\\_{i}}$\n```\n\
  \n![si8\\_e](img/si8_e.png) (7)\n\n#### 5.2：测试阶段\n\n在图 9 所示的测试阶段中，使用眼底相机从人眼中提取视网膜眼底图像。然后，利用基于数学形态学的边缘检测对人眼视网膜图像中的血管进行分割。接着，从分割后的图像中提取特征以执行测试。将提取的特征输入\
  \ ANFIS 训练模型，以判断给定图像是合法用户还是非法用户。\n\n![图 9 ARBAS 测试阶段。](img/f05-09-9780323852098.jpg)\n\
  \n图 9 ARBAS 测试阶段。\n\n#### 5.3：认证系统的性能指标\n\n为了衡量生物识别认证系统的性能，准确率是衡量该系统成败最重要的因素之一。准确率是衡量系统准确匹配个体生物特征信息并避免错误匹配不同人员生物特征信息能力的指标。\n\
  \n为了评估使用生物识别技术的认证系统的性能并计算生物识别认证准确率，使用以下性能指标：\n\n*   **真接受率**\n\n    真接受率缩写为 `TAR`。也称为真匹配率（`TMR`）。它衡量生物识别认证系统正确接受授权用户访问尝试的概率。它表示授权人员实例被认证系统正确识别的百分比。为了使认证系统更成功，该指标必须最大化，计算方法见公式(8)。\n\
  \n```\n$\\\\mathit{TAR} = \\\\frac{\\\\mathit{Number}\\\\mspace{6mu}\\\\mathit{of}\\\
  \\mspace{6mu}\\\\mathit{authorized}\\\\mspace{6mu}\\\\mathit{user}\\\\mspace{6mu}\\\
  \\mathit{instance}\\\\mspace{6mu}\\\\mathit{that}\\\\mspace{6mu}\\\\mathit{is}\\\
  \\mspace{6mu}\\\\mathit{correctly}\\\\mspace{6mu}\\\\mathit{accepted}}{\\\\mathit{Total}\\\
  \\mspace{6mu}\\\\mathit{number}\\\\mspace{6mu}\\\\mathit{of}\\\\mspace{6mu}\\\\\
  mathit{authorised}\\\\mspace{6mu}\\\\mathit{user}\\\\mspace{6mu}\\\\mathit{instance}}$\n\
  ```\n\n![si9\\_e](img/si9_e.png) (8)\n\n*   **真拒绝率**\n\n    真拒绝率缩写为 `TRR`。也称为真非匹配率（`TNMR`）。它衡量生物识别认证系统正确拒绝未授权用户访问尝试的可能性。它表示未授权用户实例被认证系统正确拒绝的百分比。为了使认证系统更成功，该指标必须最大化，计算方法见公式(9)。\n\
  \n```\n$\\\\mathit{TRR} = \\\\frac{\\\\mathit{Number}\\\\mspace{6mu}\\\\mathit{of}\\\
  \\mspace{6mu}\\\\mathit{unauthorized}\\\\mspace{9mu}\\\\mathit{user}\\\\mspace{6mu}\\\
  \\mathit{instance}\\\\mspace{6mu}\\\\mathit{that}\\\\mspace{6mu}\\\\mathit{is}\\\
  \\mspace{6mu}\\\\mathit{correctly}\\\\mspace{6mu}\\\\mathit{rejected}}{\\\\mathit{Total}\\\
  \\mspace{6mu}\\\\mathit{number}\\\\mspace{6mu}\\\\mathit{of}\\\\mspace{6mu}\\\\\
  mathit{unauthorised}\\\\mspace{6mu}\\\\mathit{user}\\\\mspace{6mu}\\\\mathit{instance}}\\\
  \\qquad$\n```\n\n![si10\\_e](img/si10_e.png) (9)\n\n*   **假接受率**\n\n    `FAR` 是假接受率的缩写。也称为欺诈率、假匹配率或第二类错误。它衡量生物识别认证系统错误接受未授权用户访问尝试的可能性。它表示未授权用户实例被认证系统错误接受的百分比。为了使认证系统更成功，该指标必须最小化。计算\
  \ `FAR` 的公式见公式(10)。\n\n```\n$\\\\mathit{FAR} = \\\\frac{\\\\mathit{Number}\\\\mspace{6mu}\\\
  \\mathit{of}\\\\mspace{6mu}\\\\mathit{unauthorized}\\\\mspace{6mu}\\\\mathit{user}\\\
  \\mspace{6mu}\\\\mathit{instance}\\\\mspace{6mu}\\\\mathit{that}\\\\mspace{6mu}\\\
  \\mathit{is}\\\\mspace{6mu}\\\\mathit{incorrectly}\\\\mspace{6mu}\\\\mathit{accepted}}{\\\
  \\mathit{Total}\\\\mspace{6mu}\\\\mathit{number}\\\\mspace{6mu}\\\\mathit{of}\\\\\
  mspace{6mu}\\\\mathit{unauthorised}\\\\mspace{6mu}\\\\mathit{user}\\\\mspace{6mu}\\\
  \\mathit{instance}}\\\\mspace{9mu}$\n```\n\n![si11\\_e](img/si11_e.png) (10)\n\n\
  *   **假拒绝率**\n\n    `FRR` 是假拒绝率的缩写。也称为冒犯率、假非匹配率（`FNMR`）或第一类错误。它衡量生物识别认证系统错误拒绝授权用户访问尝试的概率。它表示授权用户实例被认证系统错误拒绝的百分比。为了使认证系统更成功，该指标必须最小化。计算\
  \ `FRR` 的公式见公式(11)。\n\n```\n$\\\\mathit{FRR} = \\\\frac{\\\\mathit{Number}\\\\mspace{6mu}\\\
  \\mathit{of}\\\\mspace{6mu}\\\\mathit{authorized}\\\\mspace{6mu}\\\\mathit{user}\\\
  \\mspace{6mu}\\\\mathit{instance}\\\\mspace{6mu}\\\\mathit{that}\\\\mspace{6mu}\\\
  \\mathit{is}\\\\mspace{6mu}\\\\mathit{incorrectly}\\\\mspace{6mu}\\\\mathit{rejected}}{\\\
  \\mathit{Total}\\\\mspace{6mu}\\\\mathit{number}\\\\mspace{6mu}\\\\mathit{of}\\\\\
  mspace{6mu}\\\\mathit{authorised}\\\\mspace{6mu}\\\\mathit{user}\\\\mspace{6mu}\\\
  \\mathit{instance}}\\\\mspace{45mu}$\n```\n\n![si12\\_e](img/si12_e.png) (11)\n\n\
  *   **等错误率**\n\n    `EER` 是等错误率的缩写。它代表使用生物识别技术的认证系统的总体准确性。`EER` 值越低，使用生物识别技术的认证系统的准确性越高。当\
  \ `EER` 值与 `FRR` 和 `FAR` 相关联时，它们由 `FAR` 和 `FRR` 数值相等的点决定。也称为交叉错误率（`CER`）。\n\n* \
  \  **FAR 和 FRR 如何相互影响？**\n\n    图 10 所示的图表展示了 `FAR` 和 `FRR` 如何相互影响。`FRR` 与 `FAR`\
  \ 成反比，反之亦然。这可以通过一个称为置信阈值（有时称为灵敏度）的参数来控制。随着生物识别认证系统灵敏度值的增加（标记在图表的 X 轴上），`FAR` 将下降，同时\
  \ `FRR` 将上升。相反，当灵敏度值降低时，`FAR` 将上升，同时 `FRR` 将下降。`CER` 是图表中 `FAR` 曲线和 `FRR` 曲线相交的点，给出了使用生物识别技术的认证系统的总体准确性。为了提高使用生物识别技术的认证系统的准确性，可以增加灵敏度。\n\
  \n![图 10 FAR 与 FRR 对比。](img/f05-10-9780323852098.jpg)\n\n图 10 FAR 与 FRR 对比。\n\n\
  #### 5.4：实验设置\n\n\n\n为了使用视网膜生物特征进行个人身份认证，可以使用 VARIA 数据库。它包含 233 张视网膜图像，这些图像是为认证目的而收集的。这些图像来自\
  \ 139 位不同的个体。借助拓普康 TRC-NW100 非散瞳眼底照相机采集了视网膜图像。以视神经乳头为中心的分辨率设置为 768 × 584。VARIA 数据库文件夹包含一个目录和一个文本文件。该目录包含所有采集到的视网膜图像。名为\
