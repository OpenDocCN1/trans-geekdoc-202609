  \ 和 `SPT-BSIF`。最后，在特征层面或得分层面执行融合，以提高识别性能。\n\n#### 5.3 结果\n\n所提方法的识别性能在单模态生物识别（使用耳部和侧脸）以及基于特征层面融合和得分层面融合的多模态生物识别方面进行了评估。在实验中，使用\
