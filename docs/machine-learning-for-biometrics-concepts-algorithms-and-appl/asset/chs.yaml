  **粗体数值表示最佳性能。**\n\n#### 5.5 讨论\n\n\n\n\n我们工作的主要目标是融合耳部和侧脸模态，以提高识别性能。其基本原理如下：（1）虽然已有许多利用耳部模态的多模态方法被研究，但基于耳部和侧脸的多模态生物识别研究尚显不足。（2）耳部和侧脸模态具有兼容的特征向量，适合进行特征级和分数级融合。（3）生物特征模态通过使用单一传感器同时采集，从而降低了传感器成本和注册时间。\n\
  \n### 6：结论\n\n在本章中，我们提出了一种基于 SPT 和局部纹理描述符的改进型多模态耳部和侧脸生物识别身份认证方法。对三种局部描述符 LDP、LPQ\
  \ 和 BSIF 的有效性进行了比较。最后，利用两种独立的融合技术——特征级融合和分数级融合——整合了耳部和侧脸的特征向量。实验结果表明，所提出的多模态识别方法在非受控环境下取得了优于单一耳部和侧脸生物识别的性能。采用\
  \ BSIF 特征描述符的提出方法获得了与最先进的多模态生物识别技术相比极具前景的识别准确率。未来，通过探索各种非手工设计特征以及其他有效的融合方案，可以设计出更高效的多模态生物识别系统。\n\
  \n### 参考文献\n\n## 第 4 章：掌纹图像增强的统计度量\n\nGaurav Yadav^(a)；Dilip Kumar Yadav^(a)；P.V.S.S.R.\
  \ Chandra Mouli^(b) ^a 计算机应用系，国家理工学院，贾姆谢德布尔，印度\n\n^b 计算机科学系，泰米尔纳德中央大学，蒂鲁瓦鲁尔，印度\n\
  \n### 摘要\n\n图像增强旨在处理图像，使结果图像的质量比原始图像更优。特别关注各种滤波和统计技术，本文重点探讨掌纹图像增强的统计度量。可通过图像质量测量的统计分析来评估改进图像的质量。作为一种预处理技术，掌纹图像增强对于生物识别系统变得非常相关且极具挑战性。掌纹图像增强的最终目标是生成一幅质量更好的图像。在高空间分辨率掌纹识别系统的质量中，掌纹图像的一致性是一个重要因素。此外，专门针对掌纹图像增强技术的工作量也有限。本章讨论了各类掌纹图像增强技术的统计分析。主要基于图像质量测量，包括主观和客观两方面。本章重点关注基于统计分析的客观质量测量。例如归一化互相关（NK）、均方误差（MSE）、平均差值（AD）、峰值信噪比（PSNR）、最大差值（MD）和结构内容（SC）。此类研究将有助于理解最适合掌纹图像增强评估的统计度量。文中呈现了比较分析。\n\
  \n#### 关键词\n\n掌纹；生物识别；增强；图像质量；统计度量\n\n### 1：引言\n\n从本质上讲，图像的视觉改善增强了用户对图像的分析和可解释性。在数字图像处理中，它发挥着不可或缺的作用。在日常生活中，总是需要精确识别和验证物体，且要求高准确性，在此背景下，图像增强变得至关重要。图像增强旨在改变图像的特性，以便为特定观察者实现特定的期望目的\
  \ ⁶⁵\n\n大约三千年前，掌纹被用来预测一个人的命运，但 ⁶⁶\n\n**端点**—脊线终止的位置。\n\n**分叉**—脊线分裂成两条不同脊线的位置。\n\
  \n**二值化**—将灰度图像转换为二值图像。\n\n**细化**—将每条脊线的宽度缩减至单个像素的方法。\n\n**端点角**—脊线水平方向与其路径之间的角度。\n\
  \n**分叉角**—分叉方向与水平方向之间形成的角度，终止于谷线。\n\n**匹配分数**—在给定输入和原型数据之间确定。\n\n**拒真率**—设备拒绝授权人员进入的可能性。\n\
  \n在日常生活中，经常需要正确识别和验证个人身份；显然，识别过程中需要高精度 ⁶⁷\n\n### 2：掌纹图像增强\n\n在数字图像处理中 ⁶⁸\n\n执行图像增强的原因主要是突出图像中的感兴趣特征，消除现有噪声\
  \ ⁶⁹\n\n传统的直方图均衡化（HE）方法可以获得极端的对比度增强。这会使处理后的图像呈现人工外观并导致视觉伪影 ⁷⁰\n\n利用遗传算法（GA）和 HE\
  \ 过程，基于熵优化的掌纹增强（EOPE）使用遗传算法来优化增强算法参数以达到最大熵值。在输入图像中，基于曲波变换的增强可减少噪声。因此，输入图像中噪声的存在不会影响掌纹特征。这使得自动化系统的平均性能更高\
  \ ⁷¹\n\n掌纹图像的特征：\n\n包含脊线模式和谷线。特征包括主线、皱纹和基准点。易于通过低分辨率扫描仪获取。\n\n一些问题如噪声数据、普适性、类间差异和攻击（欺骗）可以被研究。与手指相比，掌部区域大得多。更具独特性。离线掌纹图像不需要单独的图像增强技术。\n\
  \n#### 2.1：基于空间域的增强\n\n直接处理图像像素以进行增强的方法称为基于空间域的增强。基于空间域的增强是通过直接操作图像的像素来实现的。\n\n\
  ```\ng(m,n) = T[F(m,n)]\n```\n\n![si9_e](img/si9_e.png) (1)\n\n空间域图像增强技术如下：\n\n\
  ##### 2.1.1：幂律变换\n\n在幂律变换中 ⁷²\n\n```\ns = c^(γ)\n```\n\n![si10_e](img/si10_e.png)\
  \ (2)\n\n其中 c 为正常数，s 为输出，γ为正常数。\n\n##### 2.1.2：负像素\n\n负像素 ⁷³\n\n```\ns = L - 1\n\
  ```\n\n![si11_e](img/si11_e.png) (3)\n\n##### 2.1.3：对数变换\n\n为了将有限范围的低输入灰度值映射到更宽范围的值，采用对数或\
  \ log 变换 ⁷⁴\n\n```\ns = c log(r+1)\n```\n\n![si12_e](img/si12_e.png) (4)\n\n\n\n\
  其中 `c` 为常数；`s` 为输出图像；`r` 为像素值。因此，1 被应用于输入图像的每个像素。因为，如果输入图像的像素强度为 0，则 `log (0) =\
  \ 无穷大`。负变换和对数变换获得低对比度直方图分量。由于直方图分量偏向灰度等级的中间，图像质量显得较差。幂律变换产生较暗的图像。\n\n#### 2.2：基于频域的增强\n\
  \n基于图像正交变换的操作称为频域技术 ⁷⁵\n\n`G(m,n) = H(m,n) * F(m,n)`\n\n![si13_e](img/si13_e.png)\
  \  (5)\n\n已知有四种频域图像增强方法，如下所示。\n\n##### 2.2.1：高斯低通滤波器 (GLPF)\n\n高斯低通滤波器的常见用途是消除噪声和平滑图像。在高斯低通滤波器中，频率系数不会被突然切断，而是采用更平滑的截止过程\
  \ ⁷⁶\n\n`H(m,n) = e^(-D²(m, n)/2D[0]²)`\n\n![si14_e](img/si14_e.png)  (6)\n\n#####\
  \ 2.2.2：高斯高通滤波器 (GHPF)\n\n下面给出的方程表示 GHPF 的传递函数。其定义如下：\n\n`H(m,n) = 1 - e^(-D²(m,\
  \ n)/2D[0]²)`\n\n![si15_e](img/si15_e.png)  (7)\n\n##### 2.2.3：巴特沃斯低通滤波器 (BLPF)\n\
  \nBLPF 用于频域中的图像平滑。它去除数字图像中的高频噪声并保留低频分量。巴特沃斯滤波器是一种在通带区域频率响应平坦的滤波器。BLPF 的传递函数见公式 (8)。其定义如下：\n\
  \n$H\\left( {m,n} \\right) = \\frac{1}{1 + \\left\\lbrack {D\\left( {m,n} \\right)/D_{0}}\
  \ \\right\\rbrack^{2r}}$\n\n![si16_e](img/si16_e.png)  (8)\n\n其中 `r` 代表阶数，`D[0]`\
  \ 为具有截止频率的原点距离。\n\n##### 2.2.4：巴特沃斯高通滤波器 (BHPF)\n\n为了在频域中锐化图像，使用了 BHPF。锐化技术用于增强数字图像中的精细细节和突出边缘。此方法保留高频分量并去除输入图像的低频分量。BLPF\
  \ 是 BHPF 的反向操作。BHPF 的传递函数见公式 (9)。其定义如下：\n\n$H\\left( {m,n} \\right) = \\frac{1}{1\
  \ + \\left\\lbrack {D_{0}/D\\left( {m,n} \\right)} \\right\\rbrack^{2r}}$\n\n![si17_e](img/si17_e.png)\
  \  (9)\n\n#### 2.3：图像复原\n\n它通过减少噪声和恢复丢失的分辨率来改变图像的外观，有助于使用不同的图像校正方法更好地可视化图像 ⁷⁷\n\n\
  ##### 2.3.1：中值滤波器 (MF)\n\nMF 被称为一种非线性数字滤波方法。MF 用于从输入图像或信号中去除噪声。在 MF 中，特定像素被其邻域像素的中值所替代\
  \ ⁷⁸\n\n##### 2.3.2：对比度受限自适应直方图均衡化 (CLAHE)\n\nCLAHE 是自适应直方图均衡化的推广 ⁷⁹\n\n##### 2.3.3：去相关拉伸\
  \ (DS)\n\nDS 具有逐像素和线性的功能。此外，逐像素过程的特定因子取决于真实图像数据和目标图像数据对应值的对应值。向量 `a` 属于 `A`。`a`\
  \ 表示 `A` 每个波段中给定的像素值。这里，`A` 是输入图像。然后，它被转换为像素 `b`，其中 `b` 对应输出图像 `B` 中的值。\n\n`b =\
  \ T * (a - m) + m_target`\n\n![si18_e](img/si18_e.png)  (10)\n\n##### 2.3.4：二维自适应滤波器\n\
  \n自适应滤波器 ⁸⁰\n\n`e2 = E{(f - f̂,)2}`\n\n![si19_e](img/si19_e.png)  (11)\n\n#####\
  \ 2.3.5：二维序统计滤波器\n\n序统计滤波器 (OSF) 利用序统计的线性组合来估计数据的均值。长期以来，统计学家已将序统计滤波器视为估计器，但后来由\
  \ Bovik 等人重新命名并应用于图像处理问题的分析中 ⁸¹\n\n##### 2.3.6：调整后的图像\n\n图像调整映射图像强度值。亮度调整被视为基本图像处理操作。期望的亮度变化被添加到每个颜色分量中。映射值使得\
  \ 1% 的值在高和低输入图像强度处饱和。通过此过程增加输出图像的对比度。\n\n### 3：统计度量\n\n对于大多数图像处理应用，图像特征计算很重要，它是图像的一种特征，用于测试图像相对于理想或完美图像的感知退化。需要对增强图像的内容进行评估以及统计质量度量。指标可以是定性的，也可以是定量的。由于人眼视觉的局限性，通常使用定性测试来直观地增加图像的可解释性。\n\
  \n然而，在统计建模中，客观度量更受青睐。开发了许多图像质量度量来说明对增强图像进行质量评估的必要性。图片质量通过基于人眼观察的直方图，利用主观质量度量来衡量。使用定量质量度量的测量取决于数学标准。由于主观内容评估，图像质量的定量评估更受青睐。然而，它更耗时、繁琐、昂贵，且因人而异。\n\
  \n通过实施“图像质量度量”来评估多种图像增强技术的质量。图像质量评估分为两类：客观图像质量测量和主观图像质量测量。在主观质量测量中，图像质量通过取决于人眼观察的直方图来衡量。质量（客观）参数基于统计质量度量。主观内容计算是一个耗时、繁琐、昂贵、不适合实际应用且因人而异的过程。因此，有必要使用客观图像质量测量。七种与质量相关的度量指标用于计算客观图像质量\
  \ ⁸²\n\n表 1\n\n图像质量的不同参数集。\n\n| 序号 | 图像质量度量 | 图像质量 |\n| --- | --- | --- |\n| 1 |\
  \ 均方误差 (MSE) | 较低值代表较低质量 |\n| 2 | 峰值信噪比 (PSNR) | 较高值代表较高质量 |\n| 3 | 平均差值 (AD) |\
  \ 较高值代表较低质量 |\n| 4 | 归一化互相关 (NCC) | 范围在 1 内的得分值代表较高质量 |\n| 5 | 结构内容 (SC) | 较低值代表较高质量\
  \ |\n| 6 | 归一化绝对误差 (NAE) | 较大值代表较低质量 |\n| 7 | 最大差值 (MD) | 较高值代表较高质量 |\n\n\n\n在本文中，我们讨论了利用空域和频域增强技术、以最小误差进行掌纹图像质量评估的优良度量。这使其更适合特定任务。多种定量图像质量度量\
  \ [⁸³]\n\n#### 表 2：图像质量统计度量\n\n| 序号 | 质量度量 | 数学公式 | 说明/最优值 |\n| --- | --- | ---\
  \ | --- |\n| 1 | 对比度度量 | `CM = (1/N) * Σ (Var_j(processed) / Var_j(original))` |\
  \ 其中 `Var[j]` 表示 16 × 16 补丁尺寸的强度值的方差。`Varj` 是在原始图像上计算的方差，`Varj` 表示在处理后图像上计算的方差。`N`\
  \ 代表补丁的数量。 |\n| 2 | 峰值信噪比 (PSNR) | `PSNR = 20 * log10(L² / ((1/(M*N)) * ΣΣ (I_m(i,j)\
  \ - I_g(i,j))²))` | 其中 `L` 表示图像中存在的灰度级数。PSNR 用于量化信号最大功率与影响其表示可靠性的噪声干扰功率之间的关系。PSNR\
  \ 的最优值对应越高越好。 |\n| 3 | 平均绝对偏差 (MAD) | `MAD = (Σ |A_i - F_i|) / n` | 其中 `A[i]` 和\
  \ `F[i]` 分别代表原始图像和增强图像的像素值，`n` 代表总观测数。MAD 用于评估增强版图像中存在的标准误差。最优值对应数值越低质量越好。 |\n|\
  \ 4 | 相关系数 (CC) | `C_c = (Σ (x_i - x̄)(y_i - ȳ)) / (√(Σ (x_i - x̄)²) * √(Σ (y_i\
  \ - ȳ)²))` | 其中 `x[i]`、`y[i]` 代表同源像素的灰度值。相关系数用于评估增强图像与原始图像之间的关系。`C[c] = 1` 表示相应图像绝对相似，为最佳值。`C[c]\
  \ = 0` 表示两幅图像完全不相关。`C[c] = -1` 表示两幅图像完全负相关。 |\n| 5 | 熵 | `Entropy = Σ p_i * log(p_i)`\
  \ | 符号 `p[i]` 表示在不同强度值数量（8 位图像为 256）中具有强度 i 的像素。特定图像可获得的熵极值取决于现有灰度级的总数。 |\n| 6 |\
  \ 归一化最小二乘误差 (NLSE) | `NLSE = (ΣΣ (f(x,y) - r(x,y))²) / (ΣΣ (r(x,y))²)` | NLSE 用于指示图像增强版与原始图像之间的归一化差异。NLSE\
  \ 值越小代表质量越好。 |\n| 7 | 标准差 (SD) | `σ = √((1/N) * Σ (x_i - x̄)²)` | 符号 `x[i]` 代表数据向量；均值用\
  \ `x̄` 表示。SD 用于表示图像增强版中的对比度。高质量图像具有较小的 SD 值。 |\n| 8 | 平均绝对百分比误差 (MAPE) | `MAPE =\
  \ (Σ |(A_t - F_t) / A_t| / n) * 100` | `n`：总观测数。高质量图像具有较小的 MAPE 值。 |\n\n<div class=\"\
  small_device\"> <p class=\"table_fig\"><img src=\"images/B9780323852098000109/t0015.png\"\
  \ alt=\"表 2\" /></p></div>\n\n#### 3.1 主观图像质量评估\n\n主观图像质量评估是人类专家就图像性质提供观点的产物。但结果可能因人而异。在使用直方图的任意计算中，确定图像的准确性。直方图易于测量，且常适用于基于硬件的经济型实现，因此可有效用于图像增强目的。这使得直方图成为实时处理图像的常用方法。直方图是以图形形式表示图像的示意图，横坐标为\
  \ 0–255 范围内的灰度值，纵坐标为频率。直方图按灰度级分为四个基本特征：亮、暗、高对比度 [⁸⁴]\n\n对于暗图像，直方图的分量集中在现有灰度级的低侧（即接近\
  \ 0 值）。同理，亮图像直方图的元素偏向灰度级的高端。高对比度图像的直方图覆盖了灰度级的宽频谱。像素分布不太远离。高质量多见于高对比度图像。\n\n####\
  \ 3.2 客观图像质量评估\n\n对于数学算法，执行客观计算。可以将客观图像质量度量 (IQM) 指标分为相应的三类：（i）全参考 (FR)；（ii）降低参考；以及（iii）无参考\
  \ [⁸⁵]\n\n### 4 讨论与分析\n\n讨论了多种用于掌纹增强的现有方法和统计度量。近年来提出了相当数量的掌纹数据集。表 3 包含掌纹图像数据集库中的一些最新贡献。表\
