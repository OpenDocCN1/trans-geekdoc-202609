  \ 图像具有大的光照变化，UND-J2 图像分辨率较低，识别个体具有挑战性。实验结果表明，基于得分层面融合的识别准确率高于耳部和侧脸生物识别的特征层面融合。在所有实验中，我们使用了两张图库（训练）图像和一张探针（测试）图像。实践表明，每个受试者更多的图库图像可以提高识别准确率。根据表\
