  ### 3：基础知识\n\n#### 3.1：深度学习\n\n尖端技术对生活各方面的影响不容忽视。深度学习和机器学习是这一影响的核心两大技术。`AGI`（通用人工智能）是深度学习的终极技术。这些变革的发起者正在改变人类生存和交流的环境，如工业革命、网络安全和监控。它们处于中间阶段；正逐步进入我们的日常生活，如医疗进步、气候变化监测、农业增产、智能设备和电网建设。\n\
  \n机器学习是人工智能拼图中的一块，其算法用于基于训练数据构建数学模型，以便对未来的测试数据集做出决策。我们常将 `ML` 视为单一技术，但它将支撑许多不同的事物；我们往往在不知不觉中使用它们，因为底层\
  \ `ML` 是一个简单的概念：复杂系统随时间推移会变得更好，并更紧密地贴合其目标。\n\n深度学习是机器学习方法的一个子领域，如图 1 所示，基于人工神经网络（`ANN`）。`ANN`\
  \ 是一种模仿生物大脑结构的网络。`ANN` 由相互连接的人工神经元组成。这些神经元按层排列。输入数据在分层架构中传播，可能多次通过各层。各层借助激活函数将给定输入转换为各种形式。\n\
  \n![图 1 深度学习。](img/f06-01-9780323852098.jpg)\n\n**图 1 深度学习。**\n\n深度学习是一种利用人工神经网络进行机器学习的过程，该网络由三个按层级排列的主要层组成。网络输入通过输入层，数据在隐藏层（也称为计算层）中转换和激活，期望的输出通过输出层演化而出。该过程在层级结构的每一层中持续进行，从给定的训练数据构建更复杂的信息。这是一种对许多现实应用非常有用的学习方法，如股票预测、多分类等。\n\
  \n架构中用于数据转换的隐藏层数量被称为“深度”。此类学习架构通常采用贪婪逐层方法构建。各种深度学习架构，如反卷积网络、深度卷积神经网络、深度信念网络和 `RNN`。生成对抗网络、深度残差网络和神经调谐机被用于各个领域。这些架构利用多层提取更多显著特征。\n\
  \n\n\n\n\n# CNN：一种流行的 ANN 类型\n\nCNN 是 ANN 的流行类型之一。普通 ANN 用于处理高度结构化数值数据的应用，而 CNN\
  \ 则处理图像。它是一种深度前馈网络。前馈网络优于感知机。典型的 CNN 通常包含约 10 个卷积、线性整流激活和子采样三元组层 (CRS)，后接 2 个全连接\
  \ (FC) 层。CNN 主要用于图像相关的识别和分类。与其他图像处理算法相比，CNN 需要的预处理较少。\n\n在深度学习中，每一层通过自主学习信息，将输入转换为更抽象和融合的表示。每一层上的神经元使这种抽象成为可能。神经网络上有各种单元。它们包括输入单元、含噪与反馈输入单元、输出单元、匹配输入/输出单元、循环单元、记忆单元、卷积单元、隐藏单元和概率隐藏单元。它能学习如何在各个层级中放置特征。\n\
  \n#### 3.2：预训练网络\n\n深度神经网络 (DNN) 是分析任务的有效途径，因为它们能将低层级的简单特征转化为高层级的稠密特征。尽管 DNN 在将低层级特征转化为高层级特征方面优于浅层神经网络，但存在一个限制：需要估算许多网络因子或超参数。借助预训练的、现成的深度\
  \ CNN 模型，可以消除这一限制。这些预训练的、现成的深度 CNN 模型保持了用于识别问题的最佳泛化能力。对于识别任务，最好使用经过微调的预训练模型，即一种迁移学习方法。\n\
  \n借助多样且大规模的数据集，CNN 在预训练期间学习如何提取特征。迁移学习使用已经在大型数据集上训练好的网络层，这些层可针对新数据集进行微调。通过迁移学习，可对预训练网络进行精细调整。随机初始化的权重被用于从头训练一个全新的网络。前者比后者更容易、更快，收敛快得多，训练更快，并能给出准确且更好的预测结果。利用这一点，学到的特征可以轻松迁移到仅有少量训练图像的新任务中。这种技术在现实中效果很好，因为它允许网络使用预先学到的特征，以新颖的组合对它们进行混合匹配，并用于对新图像集进行分类。事实上，普遍认为现在不应再从头训练\
  \ CNN。\n\n我们将预训练网络用作特征提取器，其中层激活值被用作特征。这些作为特征提取的激活值被输入到 SVM（另一种领先的学习分类器模型）中。\n\n\
  文献中现成存在各种预训练网络，如 ZFNet、VGGNet、GoogLeNet、AlexNet 和 ResNet，可用于执行识别任务。通过对预训练网络进行微调以获得更高的成功率，可以提取各种与表达相关的特征。本研究使用了\
  \ GoogLeNet 和 AlexNet。在使用这两个网络学习详细信息时，最终分类器层的学习率设为 0.01。\n\n#### 3.3：AlexNet\n\n\
  AlexNet 是首个在大型数据集 ImageNet ¹⁴⁰ 上取得成功的 CNN。\n\n$$\nf\\left( x \\right) = \\tanh\\\
  left( x \\right) = 2 \\ast \\frac{1}{1 + e^{- 2x}} - 1\n$$\n\n![si1_e](img/si1_e.png)\
  \ (1)\n\n![图 2 AlexNet 架构。](img/f06-02-9780323852098.jpg)\n\n**图 2 AlexNet 架构。**\n\
  \n这种 tanh 函数是一种饱和非线性函数，由于指数函数计算代价高昂，因此训练速度较慢。因此，AlexNet 使用了如公式 (2) 所示的非饱和非线性函数 ReLU，其训练更快且计算效率更高。\n\
  \n$$\nf(x) = \\text{ReLU}(x) = \\max(0, x)\n$$\n\n![si2_e](img/si2_e.png) (2)\n\n\
  据称 ReLU 的速度快六倍，且不需要输入归一化来防止饱和。但为了实现泛化，会进行一种称为亮度归一化的局部响应归一化。局部响应归一化 (LRN) 是 ConvNets\
  \ 中特征图的一种对比度增强过程。根据实现细节，它也可以仅是亮度归一化，这对具有无界输出的 ReLU 单元尤为重要。这种归一化导致一种侧向抑制形式，这在真实神经元中也能发现。AlexNet\
  \ 使用 ReLU 代替 tanh 来增加非线性，从而在相同精度水平下提升了速度。为解决过拟合问题，它使用了 Dropout。为减少过拟合并学习鲁棒特征，每个隐藏神经元的输出初始以\
  \ 0.5 的概率被固定为零。LRN 操作受真实生物神经网络中侧向抑制过程的启发，这种过程在较小的局部邻域内产生神经元间某种形式的竞争。Dropout 操作仅应用于\
  \ AlexNet 架构的前两个全连接层，因为每次应用所需的收敛迭代次数都会增加两倍。被丢弃的神经元将不参与前向传播，因此也不参与反向传播。因此，它减少了神经元的共适应，因为每个神经元都无法依赖其他神经元。池化层用于汇总同一核映射中相邻神经元的输出。为减小网络规模，它采用重叠池化层。观察\
  \ AlexNet 系统时，初始层具有 11 × 11 的滤波器，后续层具有 5 × 5 的滤波器。每个卷积层后都有最大池化。\n\nAlexNet 模型使用随机梯度下降进行训练，该方法以特定的动量值和权重衰减值最小化交叉熵损失函数。所有层的学习率初始设为\
  \ 0.01，当验证错误率不再随当前学习率改善时，再手动调整。\n\n#### 3.4：GoogLeNet\n\n在 2015 年 ImageNet 大规模视觉识别挑战赛中，GoogLeNet\
  \ ¹⁴¹\n\n![图 3 GoogLeNet 架构。](img/f06-03-9780323852098.jpg)\n\n**图 3 GoogLeNet 架构。**\n\
  \n预训练的 GoogLeNet 增加了具有更多非线性的 Inception 模块。该 Inception 模块用作区域分类器。它通过将多框预测与选择性搜索方法相结合，改进了区域建议步骤。中间有一些\
  \ SoftMax 层用于训练目的，提供正则化，并缓解梯度消失问题。这些被用作辅助分类器。GoogLeNet 旨在捕捉特征图堆栈中的稀疏相关模式并提供计算效率。它通过批量归一化正则化训练，从而降低了辅助分类器的重要性。在降低空间分辨率的同时，它增加了特征图的数量。\n\
  \n\n\n\n它是探索 CNN 中使用的层不必按顺序排列这一概念的模型之一。通过使用 Inception 模块，它证明了不同的层结构可以带来特征提取的性能和计算优势。网络中的集体参数为\
  \ 679.77 万，其中大部分参数归因于网络的 Inception 模块。事实上，这个数字相当庞大，这反过来使 GoogLeNet 成为一个非常复杂且高容量的深度网络。作为末端全连接层的替代方案，GoogLeNet\
  \ 使用全局平均池化，因此它不太容易过拟合，并节省了大量参数。与最大池化层类似，GAP 层用于减小 3D 张量的空间维度。然而，GAP 层实现了一种更极端的降维形式，即维度为\
  \ `h × w × d` 的张量被缩减为维度为 `1 × 1 × d` 的大小。为了将每个 `h × w` 特征图减少为单个数字，GAP 层计算每个 `hw`\
  \ 个值的平均值。\n\n### 4: 提出的系统\n\n图 4 展示了提出的多通道深度学习框架 (MC-DLF) 的轮廓。预处理后，从人脸图像构建 LDP 图像。LDP\
  \ 特征图像被组织为 `220*170` 的尺寸。利用特征图像，通过微调的预训练 AlexNet/GoogLeNet 和一个浅层 CNN 进行特征提取。使用 CCA/DCA\
  \ 进行特征融合。然后，将融合的特征集作为输入提供给 SVM 分类器，以识别给定图像的性别。\n\n![Fig. 4 Proposed Framework.](img/f06-04-9780323852098.jpg)\n\
  \n图 4 提出的框架。\n\n#### 4.1: 步骤\n\n我们提出的框架所涉及的步骤如下所示。\n\n| 算法步骤 |\n| --- |\n| (a) 预处理后，从人脸图像构建\
  \ LDP 图像。(b) 图像被组织为 `220*170` 的尺寸。(c) 从预处理图像中提取两组特征。一组特征提取通过迁移学习方法完成，另一组通过浅层 CNN\
  \ 完成，即使用微调的预训练 AlexNet/GoogLeNet 和一个浅层 CNN 提取特征。(d) 使用 CCA/DCA 进行特征融合。(e) 然后，将融合的特征集作为输入提供给\
  \ SVM 分类器，以识别给定图像的性别。 |\n\n<div class=\"small_device\"> <p class=\"table_fig\"><img\
  \ src=\"images/B9780323852098000092/t0030.png\" alt=\"Unlabelled Table\" /></p></div>\n\
  \n#### 4.2: 特征图像形成\n\n不使用原始人脸图像来学习人脸特征，而是使用特征图像，因为它们在初始层面代表了一些显著特征。特征图像形成的过程在后续章节中解释。\n\
  \n#### 4.3: 局部方向模式 (LDP) 图像形成\n\n##### 4.3.1: 边缘方向幅度计算\n\n对于输入人脸图像中的每个像素，使用 图 5\
  \ 中所示的八个不同罗盘方向上的 Kirsch 掩模 `K[ij]^z` 计算边缘方向幅度。在所有八个罗盘方向上应用 Kirsch 掩模后获得的结果如 图 6\
  \ 所示。每个方向代表边缘幅度。图 7 说明了输入图像及其对应的 LDP 图像。\n\n![Fig. 5 Kirsch edge masks that are\
  \ used in different compass directions.](img/f06-05-9780323852098.jpg)\n\n图 5 用于不同罗盘方向的\
  \ Kirsch 边缘掩模。\n\n![Fig. 6 Kirsch edge responses obtained in eight compass directions.](img/f06-06-9780323852098.jpg)\n\
  \n图 6 在八个罗盘方向上获得的 Kirsch 边缘响应。\n\n![Fig. 7 Image and its corresponding LDP image.](img/f06-07-9780323852098.jpg)\n\
  \n图 7 图像及其对应的 LDP 图像。\n\n##### 4.3.2: 最高边缘方向幅度识别\n\n从尺寸为 `n * p` 的输入图像 `I` 中计算最大边缘方向幅度\
  \ `E`，使用公式 (3)。\n\n```\n$E_{i,j} = \\max_{z = 1,2,\\ldots,8}\\sum\\limits_{l = -\
  \ 1}^{1}\\sum\\limits_{k = - 1}^{1}K_{ij}^{z} * I_{l + i,k + j}$\n```\n\n![si3_e](img/si3_e.png)\
  \  (3)\n\n其中 `i` 和 `j` 分别从 2 到 `n − 1` 和 2 到 `p − 1`。它是基于所有罗盘方向上的八个 Kirsch 核系列 `k`\
  \ 计算的。它取决于产生最重要边缘幅度的掩模。\n\n##### 4.3.3: LDP 图像计算\n\n设 `Kirsch[i]` 为应用所有八个 Kirsch\
  \ 核 `K[i]` (`i = 1, 2 … 8`) 后得到的响应。设最高边缘幅度表示为 `Kirsch[max]`。所有像素的 LDP 值使用公式 (4)\
  \ 计算。\n\n```\n$\\begin{matrix} {\\mathit{LDP} = \\sum\\limits_{i = 0}^{7}b\\left(\
  \ {\\mathit{Kirsch}_{i} - \\mathit{Kirsch}_{\\max}} \\right) * 2^{i}} \\\\ {\\text{where}\\\
  mspace{9mu} b\\left( x \\right) = \\left\\{ \\begin{array}{l} {1;\\mspace{9mu} x\
  \ > 0} \\\\ {0;\\mspace{9mu}\\text{otherwise}} \\\\ \\end{array} \\right\\}} \\\\\
  \ \\end{matrix}$\n```\n\n![si4_e](img/si4_e.png)  (4)\n\n由于图像是通过考虑所有八个方向生成的，因此产生了一个鲁棒的特征图像。\n\
  \n### 5: 浅层 CNN\n\n本工作中采用的浅层 CNN 结构如 图 8 所示。CNN 包含三个卷积层以及三个池化层。在 表 1 中，列举了每个 CNN\
  \ 层采用的参数。为了将特征图像集转换为可学习的 3D 滤波器集，采用了卷积层。为了减小特征图的维度并消除冗余细节，采用池化层来完成下采样。\n\n![Fig.\
  \ 8 Architecture of shallow CNN.](img/f06-08-9780323852098.jpg)\n\n图 8 浅层 CNN 架构。\n\
  \n**表 1**\n\n浅层 CNN 中使用的参数。\n\n| 参数 | | Conv1 | | Pool1 | | Conv2 | | Pool2 | |\
  \ Conv3 | | Pool3 |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- | ---\
  \ | --- | --- | --- |\n| 滤波器尺寸 | | `3*3` | | `2*2` | | `3*3` | | `2*2` | | `3*3`\
  \ | | `2*2` |\n| 滤波器数量 | | 16 | | | | 32 | | | | 64 | | |\n| 步长 | | 1 | | 2 | |\
  \ 1 | | 2 | | 1 | | 2 |\n| 填充 | | 1 | | 0 | | 1 | | 0 | | 1 | | 0 |\n\n<div class=\"\
  small_device\"> <p class=\"table_fig\"><img src=\"images/B9780323852098000092/t0010.png\"\
  \ alt=\"Table 1\" /></p></div>\n\n这些层最小化了所用参数的空间复杂度，并且还消除了过拟合问题。这些层的使用方式使它们能够自适应地学习更具判别力和最优的特征。卷积层中使用的滤波器组处理输入的局部部分。这些滤波器在处理人脸的某些部分时产生强烈响应，同时抑制其他部分，从而产生关键的局部结构。在卷积层中经过几次这样的滤波后，在最大池化层中对滤波结果进行下采样，使其对位置变化具有鲁棒性。\n\
  \n归一化层被用在中间，以改进训练过程并减少网络对初始化的依赖。它对流经网络的梯度值进行归一化。\n\n### 6: 特征融合\n\n\n\n在识别系统中，融合可以发生在特征层面或分类器层面。由于特征向量包含关于输入图像的丰富信息，因此特征层面的融合被认为优于分类器层面的融合。\n\
  \n此特征融合步骤旨在将不同的特征向量关联成一个具有更强判别能力的独特特征向量。特征层面的融合可以通过变换后的特征向量集的求和或拼接来实现。此处采用求和法，因为它降低了维数，从而减少了处理时间。\n\
  \n我们使用了两种特征融合技术，即典型相关分析（CCA）和判别相关分析（DCA）。这两种技术均在特征层面运行。\n\n#### 6.1 典型相关分析（CCA）\n\
  \n其旨在找出两个不同特征集之间的关联 ¹⁴²\n\n$$\nS = \\begin{pmatrix} \\operatorname{var}(x) & \\\
  operatorname{cov}(x,y) \\\\ \\operatorname{cov}(y,x) & \\operatorname{var}(y) \\\
  end{pmatrix} = \\begin{pmatrix} S_{xx} & S_{xy} \\\\ S_{yx} & S_{yy} \\end{pmatrix}\n\
  $$\n\n![si5_e](img/si5_e.png)  (5)\n\n然后，使用公式 (6) 计算非零特征值 `G[1]` 和 `G[2]`。\n\n$$\n\
  G_{1} = S_{xx}^{-\\frac{1}{2}}S_{xy}S_{yy}^{-1}S_{yx}S_{xx}^{-\\frac{1}{2}} \\quad\
  \ G_{2} = S_{yy}^{-\\frac{1}{2}}S_{yx}S_{xx}^{-1}S_{xy}S_{yy}^{-\\frac{1}{2}}\n\
  $$\n\n![si6_e](img/si6_e.png)  (6)\n\n然后，求出投影矩阵 `W[x]` 和 `W[y]`，它们代表与非零特征值对应的排列特征向量。最后，为了增加两个特征向量之间的成对关联，使用公式\
  \ (7) 求出变换后特征向量的线性组合。\n\n$$\nX^{*} = W[x]^{T}X \\quad Y^{*} = W[y]^{T}Y\n$$\n\n\
  ![si7_e](img/si7_e.png)  (7)\n\n因此，CCA 的目标函数是在 `a^T∑[X]a = 1` 和 `b^T∑[Y]b = 1` 的约束下最大化\
  \ `Corr(Xa, Xb)`。\n\n#### 6.2 判别相关分析（DCA）\n\n相关分析旨在融合不同领域特征向量捕获的判别信息。其目的是找到增加两个特征集之间成对关联的变换\
  \ ¹⁴³\n\n设 `n` 为总样本数，`c` 为类别数，`p` 和 `q` 分别为特征向量 `X` 和 `Y` 中的特征数。`n` 个数据矩阵列必须分成 `c`\
  \ 个不同的类，其中 `n[i]` 列属于第 `i` 类，如公式 (8) 所示。\n\n$$\nn = \\sum_{i=1}^{c}n_{i}\n$$\n\n\
  ![si8_e](img/si8_e.png)  (8)\n\n设 `x[ij]` 为 `X` 中第 `i` 类第 `j` 个样本的特征向量。设 $\\overline{x_{i}}$![si9_e](img/si9_e.png)\
  \ 和 $\\overline{x}$![si10_e](img/si10_e.png) 分别为第 `i` 类中 `x[ij]` 特征向量的均值和整个特征集的均值。然后，求出类间散度矩阵\
  \ `S[bx]`，由公式 (9) 定义。\n\n$$\nS_{bx}(p \\times p) = \\phi_{bx}\\phi_{bx}^{T}\n$$\n\
  \n![si11_e](img/si11_e.png)  (9)\n\n其中\n\n$$\n\\phi_{bx(p \\times c)} = \\left[\
  \ {\\sqrt{n_{1}}(\\overline{x_{1}} - \\overline{x}), \\sqrt{n_{2}}(\\overline{x_{2}}\
  \ - \\overline{x}), \\ldots, \\sqrt{n_{c}}(\\overline{x_{c}} - \\overline{x})} \\\
  right]\n$$\n\n![si12_e](img/si12_e.png)\n\n为了对类间散度矩阵 `S[bx]` 进行对角化，并将数据矩阵 `X` 的大小从\
  \ `p` 降至 `r`，使用公式 (10) 求出变换矩阵 `W[bx]`。\n\n$$\nW[bx]^{T}S[bx]W[bx] = I\n$$\n\n![si13_e](img/si13_e.png)\
  \  (10)\n\n其中 `I` 为单位矩阵。\n\n变换后的特征向量由公式 (11) 给出。\n\n$$\nX' = W[bx]^{T}X\n$$\n\n\
  ![si14_e](img/si14_e.png)  (11)\n\n其中 `X` 的大小为 `p × n`，结果 `X'` 的大小为 `r × n`。类似地，使用上述方法为第二个特征集\
  \ `Y` 求出变换后的特征向量 `Y'`，即使用变换 `W[by]` 对类间散度矩阵 `S[by]` 进行对角化，并将数据矩阵 `Y` 的大小从 `q` 降至\
  \ `r`。\n\n为了使一组特征与另一组中的等效特征具有非零关联，对变换后的特征向量 `X'` 和 `Y'` 的类间协方差矩阵进行对角化。\n\n变换后的特征向量\
  \ `X'` 和 `Y'` 之间的集间协方差矩阵由公式 (12) 给出。\n\n$$\nS_{xy}' = X'Y'^{T}\n$$\n\n![si15_e](img/si15_e.png)\
  \  (12)\n\n为了对角化 `S'[xy]`，使用奇异值分解求出变换 `W[cx]` 和 `W[cy]`。因此，最终变换后的特征集使用公式 (13) 求出。\n\
  \n$$\n\\tilde{X} = W[cx]^{T}X' \\quad \\text{and} \\quad \\tilde{Y} = Y'\n$$\n\n\
  ![si16_e](img/si16_e.png)  (13)\n\n### 7 实验结果与讨论\n\n以下描述了所使用的数据集以及使用我们提出的方法获得的实验结果的讨论。首先，为\
  \ Adience 基准数据集中所有可用的面部图像形成特征 LDP 图像数据库。然后，使用 CNN、AlexNet 和 GoogLeNet 从输入图像中进行特征提取。然后，使用\
  \ CCA/DCA 进行特征融合。数据库构建、特征提取和特征融合均使用 Matlab 完成。使用 CNN 提取的特征总数为 36,288。使用微调后的 GoogLeNet\
  \ 和 AlexNet 提取的特征数为 1000。然后，将融合后的特征作为输入提供给使用 Weka 工具的 SVM 分类器以获得结果。\n\n#### 7.1\
  \ Adience 数据集\n\n2014 年，Eidinger 等人 ¹⁴⁴ 引入了 Adience 数据集。\n\n### 8 单通道方法\n\n最初，实验的进行方式是将每张面部图像及其对应的\
  \ LDP 特征图像单独输入到三个网络中，即 GoogLeNet、AlexNet 和浅层 CNN。\n\n图 9 显示了使用单通道方法获得的准确率。从结果推断，将\
  \ LDP 图像输入 GoogLeNet 的表现优于其他方法。\n\n![图 9 使用单通道方法获得的准确率（百分比）。](img/f06-09-9780323852098.jpg)\n\
  \n图 9 使用单通道方法获得的准确率（百分比）。\n\n### 9 提出的 MC-DLF 方法\n\n表 2 和 图 10 说明了使用提出的 MC-DLF 方法时达到的准确率，其中原始图像及其等效的\
  \ LDP 特征图像作为输入。从结果推断，浅层 CNN 和 GoogLeNet 结合 CCA 产生更好的结果。\n\n表 2\n\n使用我们的 MC-DLF 方法获得的准确率（百分比）。\n\
