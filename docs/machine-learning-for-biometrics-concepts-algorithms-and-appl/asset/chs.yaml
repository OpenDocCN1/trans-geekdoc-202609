  \n### 5: 结论\n\n热传感器对光照变化的鲁棒性已吸引了全球研究人员和商业团体的关注，将其作为可见光谱安全系统的替代方案。它们能够在黑暗环境中运行。此外，研究表明红外相机能够捕捉新的解剖和生理人脸信息，如面部血管网络、热特征和血管结构。这些特征可能因人而异，因此有潜力作为生物特征识别特征。遵循相同的理念，本章提出了一种基于热成像的生物特征人脸识别系统。深度学习和特征融合的概念被广泛用于为所提系统提供更强的鲁棒性。为了应对不同人员具有相似热特征的情况，将与个人面部几何相关的附加信息与从\
  \ `ResNet-50` 模型获得的特征向量进行了融合。实验获得的结果令人满意，因此优于现有的最先进算法。\n\n### 参考文献\n\n## 第 3 章：利用人耳和侧脸的多模态生物特征识别：一种改进方法\n\
  \nPartha Pratim Sarangi^(a)；Madhumita Panda^(b)；Subhashree Mishra^(a)；Bhabani Shankar\
  \ Prasad Mishra^(a) ^a 计算机工程学院，KIIT 视同大学，布巴内斯瓦尔，印度\n\n^b 计算机应用硕士，Seemanta 工程学院，Jharpokharia，印度\n\
  \n### 摘要\n\n多模态生物特征系统近来在非受控场景下的人体身份识别方面受到广泛关注。本章提出了一种通过融合耳部和侧脸生物特征的改进多模态生物特征识别方法。首先，利用可控金字塔变换将两种模态分别分解为预定义数量的尺度和方向，然后使用基于直方图的局部描述符从每个子带中提取纹理特征。采用了三种流行的局部描述符——局部方向模式、二值统计图像特征和局部相位量化，并比较它们的有效性以探索最具判别力的纹理描述符。最后，利用\
  \ kNN 分类器，在特征级和得分级上融合两种模态的局部描述符以实现个体识别。在两个标准数据集——Notre Dame 大学 E 集 (UND-E) 和 J2\
  \ 集 (UND-J2) 上进行了多组实验，结果表明，采用得分级融合的多模态方法优于特征级融合。此外，其准确率高于单模态耳部识别和最先进的多模态生物特征识别。\n\
  \n#### 关键词\n\n生物特征识别；多模态生物特征识别；耳部和侧脸；可控金字塔变换；特征级融合；得分级融合\n\n### 1: 引言\n\n近年来，生物特征识别已成为各种安全和取证应用中人体身份识别的替代程序。指纹、人脸、虹膜、掌纹、耳部、指静脉模式、语音、签名和步态等生物特征模态是个体身份识别和隐私保护中最流行、应用最广泛的生物特征模态\
  \ [⁴¹]\n\n为了提高所提方法的判别能力，本章对耳部和侧脸图像使用了可控金字塔变换 (SPT) 滤波器组。这些 SPT 滤波器将两幅图像分别分解为预定义数量的不同尺度和方向的子带。随后，将所有子带划分为若干个不重叠的块，并在每个块上分别提取局部特征（如局部二值模式\
  \ (LDP)、局部相位量化 (LPQ) 和二值统计图像特征 (BSIF)）以生成直方图。这些直方图经过归一化并拼接以表示图像。然后，利用卡方相似度度量探索了特征级和得分级融合以提高识别性能。所提方法的主要贡献概述如下：\n\
  \n1.  (i) 我们提出了一种多模态生物特征识别系统，以耳部和侧脸图像作为输入，与单模态耳部生物特征识别相比获得了改进的识别结果。\n2.  (ii) 应用\
  \ SPT 将耳部和侧脸图像分别分解为沿不同尺度和方向的一组子带。每个子带进一步划分为若干个块，并计算每个块的局部纹理描述符以统一表示特征向量。\n3.  (iii)\
  \ 我们探索了三种基于直方图的局部纹理描述符 LDP、LPQ 和 BSIF 的有效性，以提取更具判别力的方向信息并得出其中最优者。为获得更好的识别性能，我们还研究了特征级和得分级融合方案。\n\
  4.  (iv) 在两个基准数据集 UND-E 和 UND-J2 上进行了大量实验，以评估所提方法的有效性。采用得分级融合获得的结果优于基于耳部的单模态和最先进的多模态生物特征识别。\n\
  \n本章其余部分组织如下：第 2 节 介绍相关工作。第 3 节 简要描述用于特征提取的 SPT 和三种局部纹理描述符。第 4 节 详细描述所提多模态识别方法。第\
  \ 5 节 讨论实验和结果，最后在第 6 节 得出结论。\n\n### 2: 相关工作\n\n关于耳部生物特征识别最近结构最完善、最全面的综述由文献 [⁴²]\
  \ 发表\n\nYuan 等人 [⁴³]\n\nXu 和 Mu [⁴⁴]\n\nXu 和 Mu [⁴⁵]\n\nXu 等人 [⁴⁶]\n\nPan 等人 [⁴⁷]\n\
  \nRathore 等人 [⁴⁸]\n\nYoussef 等人 [⁴⁹]\n\nSarangi 等人 [⁵⁰]\n\nSarangi 和 Panda [⁵¹]\n\
  \n早期方法达到的识别准确率仍有潜在提升空间。所提基于耳部和侧脸的多模态框架显著提高了识别性能。\n\n### 3: 背景\n\n在本工作中，我们使用 Sarangi\
  \ 等人 [⁵²] 的方法从侧脸图像中定位耳部区域\n\n\n\n\n![Fig. 1 A sample side face image with extracted\
  \ ear and profile face images from UND-J2 dataset.](img/f03-01-9780323852098.jpg)\n\
  \n图 1 来自 UND-J2 数据集的样本侧面图像，包含提取的耳部和侧脸图像。\n\n#### 3.1 可操纵金字塔变换\n\nSPT [⁵³]\n\n![Fig.\
  \ 2 Decomposition of an ear image using SPT with three scales and four orientations.](img/f03-02-9780323852098.jpg)\n\
  \n图 2 使用具有三个尺度和四个方向的 SPT 对耳部图像进行分解。\n\n#### 3.2 局部纹理描述符\n\n在基于 SPT 的耳部和侧脸图像分解之后，局部纹理描述符在非受控条件下从子带中提取判别信息更为稳健。文献中\
  \ [⁵⁴]\n\n### 4 提出的多模态生物识别\n\n所提出的方法包含五个阶段：预处理、局部特征提取、多模态融合和人员识别，这些在算法 1 中进行了解释，所提出的流程如图\
  \ 3 所示。\n\n#### 算法 1\n\n所提出的多模态生物识别。\n\n**输入：** 给定分割后的耳部和侧脸图像的训练集和测试集\n\n**输出：**\
  \ 识别出的身份\n\n1. 使用公式 (1) 对每幅耳部和侧脸图像应用高斯滤波器进行平滑处理。\n2. 采用可操纵金字塔滤波器组生成训练和测试样本的多尺度和多方向子带。\n\
  3. 对训练和测试图像的每个子带应用基于块的局部纹理描述符。\n4. 连接分块直方图以获取训练和测试特征向量集。\n5. 对每个耳部测试特征向量执行\n6.       使用公式\
  \ (2) 通过卡方度量计算测试特征向量与所有训练特征向量之间的匹配得分。\n7.       基于匹配得分使用 kNN 分类器确定耳部测试样本的识别身份。\n\
  8. 结束循环\n9. 对每个侧脸测试特征向量执行\n10.       使用公式 (2) 通过卡方度量计算测试特征向量与所有训练特征向量之间的匹配得分。\n\
  11.       基于匹配得分使用 kNN 分类器确定侧脸测试样本的识别身份。\n12. 结束循环\n13. 计算耳部和侧脸生物识别模态的准确率和 EER。\n\
  14. 对每个耳部和侧脸匹配得分执行\n15.       使用公式 (5) 基于加权求和规则的得分级融合计算融合匹配得分。\n16.       基于融合匹配得分使用\
  \ kNN 分类器确定每个样本的识别身份\n17. 结束循环\n18. 评估所提出识别方法的总体准确率 (%) 和 EER (%)。\n\n![Fig. 3 Pipeline\
  \ of the proposed method.](img/f03-03-9780323852098.jpg)\n\n图 3 所提出方法的流程图。\n\n####\
  \ 4.1 预处理\n\n为平滑输入侧面图像中存在的噪声，采用了高斯低通滤波器。在高斯核 (`G`) 和侧面图像 (`I`) 之间执行卷积运算，以获得平滑后的输入图像\
  \ (`I'`)，如下所示：\n\n```\nI' = I * G(u, v, σ)\nG(u, v, σ) = 1 / (√(2π) σ) * exp(- (u²\
  \ - v²) / (2σ²))\n```\n\n![si2_e](img/si2_e.png)  (1)\n\n其中 `σ` 为高斯核的标准差。\n\n####\
  \ 4.2 基于分块 SPT-BSIF 描述符的特征提取\n\n在本工作中，我们在耳部和侧脸图像上采用三尺度六方向的可操纵金字塔滤波器组，将图像分解为 18 个不同尺度和方向的子带。然后，将所有子带划分为若干个不重叠的块，并对所有块应用\
  \ BSIF 特征提取器。所有块的归一化直方图纹理描述符被连接以形成 (`SPT-BSIF`) 特征向量。最后，我们分别获得了耳部和侧脸的两个归一化特征向量 `F[Ear]`\
  \ 和 `F[PF]`。\n\n#### 4.3 匹配与分类\n\n在执行分类之前，通过两个步骤计算所有探针样本的匹配得分：(1) 使用公式 (2) 中给出的卡方度量，将每个探针图像与所有图库图像进行比较以生成一组匹配得分；(2)\
  \ 使用 kNN 分类器为每个探针样本获得单个匹配得分。\n\n```\nχ(F₁, F₂) = Σₖ₌₁ᴺ (f₁,ₖ - f₂,ₖ)² / (f₁,ₖ +\
  \ f₂,ₖ)\n```\n\n![si3_e](img/si3_e.png)  (2)\n\n在本章中，我们以验证模式使用了所提出的方法。在这种情况下，将探针图像与图库图像进行匹配以验证个体声称的身份。最后，使用公式\
  \ (3) 利用探针样本的匹配得分计算误接纳率 (`FAR`) 和误拒率 (`FRR`)，以评估所提出方法的识别准确率 (%)。另一个公认的性能度量是等错误率\
  \ (`EER`)，即 `FAR` 和 `FRR` 相等时的比率 [⁵⁵]\n\n```\nAccuracy = 100 - (FAR + FRR) / 2\n\
  ```\n\n![si4_e](img/si4_e.png)  (3)\n\n#### 4.4 多模态融合\n\n在本工作中，同时考察了特征级融合和得分级融合，以确定所提出方法的更高识别性能。\n\
  \n#### 4.5 特征级融合\n\n在特征级融合中，耳部特征 `F[Ear]` 和侧脸特征 `F[PF]` 被合并为单个特征向量 `F[Fused]`，如下所示：\n\
  \n```\nF_Fused = F_Ear ∪ F_PF\n```\n\n![si5_e](img/si5_e.png)  (4)\n\n#### 4.6 得分级融合\n\
  \n在得分级融合中，耳部匹配得分 `S[Ear]` 和侧脸匹配得分 `S[PF]` 分别使用卡方距离度量计算，并基于公式 (5) 进行融合，以获得用于通过 kNN\
  \ 分类器识别个体的融合得分。\n\n```\nS_Fused = (A_Ear × S_Ear + A_PF × S_PF) / (A_Ear + A_PF)\n\
  ```\n\n![si6_e](img/si6_e.png)  (5)\n\n其中 `A[Ear]` 和 `A[PF]` 分别为耳部和侧脸模态的识别准确率。\n\
  \n### 5 实验与结果\n\n在本节中，我们展示各种实验以证明所提出方法的有效性。首先，我们讨论实验中使用的 UND-E 和 UND-J2 数据集，以及调整可操纵金字塔滤波器组和局部特征提取器（即\
