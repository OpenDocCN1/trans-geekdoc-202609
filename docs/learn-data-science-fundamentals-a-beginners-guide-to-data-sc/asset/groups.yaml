    \n- 无法证明原假设为真\n- 可能犯第一类错误（在 $H_0$ 为真时拒绝它）或第二类错误（在 $H_0$ 为假时未能拒绝 $H_0$）\n- 结论取决于所选择的显著性水平\n\
    \n# 假设检验的重要性\n\n假设检验广泛应用于医学、社会科学和商业等领域，用于根据样本数据做出明智决策。它允许研究人员量化反对原假设的证据强度，并为得出总体参数的结论提供框架。\n\
    \n# 4.2 相关分析与回归分析\n\n相关分析和回归分析是用于检查变量之间关系的本质统计技术。虽然两种方法都评估两个或多个变量之间的关联，但它们的目的不同，提供不同类型的信息。理解这些差异对于在数据分析中有效应用这些技术至关重要。\n\
