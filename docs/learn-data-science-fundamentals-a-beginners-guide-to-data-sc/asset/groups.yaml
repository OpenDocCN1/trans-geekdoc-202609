    time. For example, examining the monthly sales of a product to identify trends
    and seasonal patterns.


    +   2. Multivariate Time Series Analysis: This approach examines the relationships
    between two or more variables over time. It is useful for understanding how multiple
    factors influence a particular outcome, such as the impact of advertising spend
    and pricing on sales.


    +   3. Decomposition: This method breaks down a time series into its constituent
    components: trend, seasonality, and residuals (noise).'
