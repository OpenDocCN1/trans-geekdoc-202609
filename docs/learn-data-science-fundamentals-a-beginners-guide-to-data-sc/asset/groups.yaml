    # 3. DBSCAN (Density-Based Spatial Clustering of Applications with Noise)


    DBSCAN is a density-based clustering algorithm that groups data points that are
    close to each other based on density. It can identify clusters of arbitrary shape
    and size and is robust to outliers. DBSCAN requires two parameters: the minimum
    number of points required to form a dense region (MinPts) and the maximum distance
    between two points to be considered part of the same neighborhood (ε). DBSCAN
    is effective in handling clusters of different sizes and densities and can identify
    noise points. However, it may struggle with datasets that have varying densities
    or when the optimal values for MinPts and ε are not known.


    # 4. Gaussian Mixture Models (GMM)


    Gaussian Mixture Models assume that the data is generated from a mixture of Gaussian
    distributions. The algorithm estimates the parameters of these Gaussian components,
    such as means and covariances, and assigns points to the cluster with the highest
    probability. GMM can handle overlapping clusters and provides a probabilistic
    framework for clustering. GMM is suitable for datasets with elliptical clusters
    and can automatically determine the number of clusters using techniques like the
    Bayesian Information Criterion (BIC). However, it assumes that the clusters follow
    a Gaussian distribution, which may not be the case in real-world datasets.


    # 5. Spectral Clustering


    Spectral clustering is a graph-based method that uses the eigenvalues of the similarity
    matrix of the data to perform dimensionality reduction and then applies K-Means
    on the reduced space. It can identify clusters of arbitrary shape and is effective
    in handling non-convex or complex-shaped clusters.'
