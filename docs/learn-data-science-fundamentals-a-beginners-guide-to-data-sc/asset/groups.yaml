    # 11.2 Markov Decision Processes and Dynamic Programming


    A Markov Decision Process (MDP) is a mathematical framework used to model decision-making
    problems where outcomes are partially random and partly under the control of a
    decision-maker (agent). MDPs are widely used in reinforcement learning and provide
    a structured way to evaluate and optimize sequential decision-making in uncertain
    environments.


    # **Components of an MDP**


    An MDP is typically defined by the following components:


    +   1. **States (S):** A finite set of states that represent all possible situations
    the agent can be in. Each state provides a snapshot of the environment at a given
    time.


    +   2. **Actions (A):** A finite set of actions available to the agent. The choice
    of action will influence the transition from one state to another.


    +   3. **Transition Function (T):** This function defines the dynamics of the
    environment. It specifies the probability of moving from one state to another
    given a particular action. Formally, it can be'
