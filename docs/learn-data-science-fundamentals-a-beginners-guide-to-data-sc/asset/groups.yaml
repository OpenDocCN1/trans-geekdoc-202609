    # 1. Measures of Central Tendency


    Measures of central tendency describe the center or typical value of a dataset.
    The most common measures are:


    +   - **Mean:** The average of all values in the dataset, calculated by summing
    all the values and dividing by the number of observations. The mean is sensitive
    to outliers, which can skew the result.

    - **Median:** The middle value when the dataset is ordered from least to greatest.
    If there is an even number of observations, the median is the average of the two
    middle values. The median is less affected by outliers and provides a better measure
    of central tendency for skewed distributions.

    - **Mode:** The value that appears most frequently in the dataset. A dataset can
    have no mode, one mode, or multiple modes (bimodal or multimodal) if multiple
    values occur with the same highest frequency.


    # 2. Measures of Variability


    Measures of variability provide insights into the spread or dispersion of the
    data. They help to understand how much the values differ from the central tendency.
    Key measures include:


    +   - **Range:** The difference between the maximum and minimum values in the
    dataset. The range provides a simple measure of variability but does not account
    for how data points are distributed between the extremes.

    - **Variance:** The average of the squared deviations from the mean. Variance
    quantifies the degree of spread in the dataset. A higher variance indicates that
    the data points are more spread out from the mean.'
