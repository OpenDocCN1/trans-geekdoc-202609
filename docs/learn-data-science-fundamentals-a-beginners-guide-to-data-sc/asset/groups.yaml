    3. Temporal Difference Learning: Q-learning uses temporal difference (TD) learning
    to update the Q-values based on the rewards received and the estimated future
    rewards. The update rule is given by:


    ```

    Q(s,a) ← Q(s,a) + α [r + \gamma max_{a''} Q(s'',a'') - Q(s,a)]

    ```


    where:


    +   - αα is the learning rate,

    - rr is the immediate reward received after taking action aa,

    - γγ is the discount factor,

    - s''s is the new state after the action.


    # Advantages of Q-Learning


    +   - Model-Free: Q-learning does not require a model of the environment, making
    it applicable in situations where the dynamics are complex or unknown.

    - Off-Policy Learning: The algorithm can learn the value of the optimal policy
    independently of the agent''s actions, allowing for flexibility in learning from
    exploratory actions.

    - Convergence Guarantees: Under certain conditions (e.g., sufficient exploration),
    Q-learning is guaranteed to converge to the optimal policy.


    # Limitations of Q-Learning


    +   - Scalability: Traditional Q-learning relies on a Q-table to store values
    for each state-action pair. This approach becomes impractical in environments
    with large or continuous state spaces due to the curse of dimensionality.'
