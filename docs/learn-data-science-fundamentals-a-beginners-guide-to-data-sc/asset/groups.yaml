    # Chapter 4: Statistical Analysis


    # 4.1 Hypothesis Testing


    Hypothesis testing is a fundamental concept in statistical inference that allows
    researchers to make decisions about a population parameter based on sample data.
    It involves formulating two hypotheses, a null hypothesis (H0) and an alternative
    hypothesis (H1), and then using statistical methods to determine whether the sample
    data provides sufficient evidence to reject the null hypothesis in favor of the
    alternative hypothesis.


    Steps in Hypothesis Testing


    The typical steps involved in hypothesis testing:


    +   1. State the null hypothesis (H0) and the alternative hypothesis (H1). The
    null hypothesis is the statement that is assumed to be true unless there is strong
    evidence against it. The alternative hypothesis is the statement that is accepted
    if there is sufficient evidence against the null hypothesis.


    +   2. Determine the test statistic and its sampling distribution under the assumption
    that H0 is true. The test statistic is a value calculated from the sample data
    that is used to assess the plausibility of the null hypothesis.


    +   3. Set the significance level (α), which is the probability of rejecting H0
    when it is true. Common choices for α are 0.05 (5%), 0.01 (1%), and 0.10 (10%).


    +   4. Calculate the p-value, which is the probability of obtaining a test statistic
    at least as extreme as the one observed, assuming H0 is true. The p-value is compared
    to the significance level to determine whether to reject or fail to reject H0.


    +   5. Make a decision: If the p-value is less than or equal to the significance
    level, reject H0 and conclude that the data provides sufficient evidence to support
    H1. If the p-value is greater than the significance level, fail to reject H0 and
    conclude that the data does not provide sufficient evidence to support H1.'
