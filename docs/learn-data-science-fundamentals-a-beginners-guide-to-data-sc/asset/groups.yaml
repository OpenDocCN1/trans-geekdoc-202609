    # 3.2 Descriptive Statistics


    Descriptive statistics play a crucial role in summarizing and interpreting the
    characteristics of a dataset. They provide essential insights into the data by
    offering a concise overview of its main features. Descriptive statistics can be
    divided into three primary categories: measures of central tendency,'
