    and changes in a dataset over a period.


    # 3. Bar Charts


    Bar charts are used to compare values across different categories. They consist
    of rectangular bars whose lengths are proportional to the values being represented.
    Bar charts can be oriented vertically or horizontally and are useful for visualizing
    comparisons, rankings, and proportions.


