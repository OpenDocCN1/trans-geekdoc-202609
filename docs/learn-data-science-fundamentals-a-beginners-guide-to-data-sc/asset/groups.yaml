    # 1. K-Means Clustering


    K-Means is one of the most popular and widely used clustering algorithms. It is
    a partitioning method that divides the data into K clusters based on their similarity.
    The algorithm works by iteratively assigning data points to the nearest cluster
    centroid and then updating the centroid positions until convergence. The number
    of clusters (K) is specified by the user and can significantly impact the clustering
    results. K-Means is efficient, easy to implement, and can handle large datasets.
    However, it has some limitations, such as being sensitive to outliers and struggling
    with non-convex or unequal-sized clusters.


    # 2. Hierarchical Clustering


    Hierarchical clustering is a family of algorithms that build nested clusters by
    merging or splitting them successively. It creates a hierarchy of clusters, which
    can be visualized using a dendrogram. There are two main types of hierarchical
