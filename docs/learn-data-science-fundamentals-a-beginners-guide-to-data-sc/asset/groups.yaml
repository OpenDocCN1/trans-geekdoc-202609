    | Aspect | Correlation | Regression |

    | --- | --- | --- |

    | Purpose | Measures the strength and direction of a relationship between two
    variables. | Models the relationship between a dependent variable and one more
    independent variables. |

    | Output | A single coefficient (r). | A regression equation that can be used
    for prediction. |

    | Direction of Relationship | Indicates whether the relationship is positive,
