    interquartile range (IQR), and potential outliers. Box plots are useful for comparing
    distributions across different groups or categories.


    # 6. Heatmaps


    Heatmaps use color intensity to represent the magnitude of values in a matrix
    format. They are commonly used to visualize correlations between variables, where
    the color of each cell corresponds to the strength of the correlation between
    the corresponding variables.


    # 7. Treemaps


    Treemaps are used to visualize hierarchical data structures. They represent nested
    categories as a set of rectangles, where the size of each rectangle is proportional
    to a specified dimension (e.g., value or frequency). Treemaps are effective in
    displaying large amounts of hierarchical data in a compact and intuitive manner.


    # 8. Bubble Charts


    Bubble charts enhance scatter plots by introducing a third dimension through varying
    bubble sizes. This additional dimension can reveal insights about a third variable,
    such as the frequency or importance of data points.


    # 9. Area Charts


    Area charts are similar to line plots but with the area under the line filled.
    They are useful for visualizing cumulative data patterns, such as the total sales
    over time or the growth of a variable.


    # 10. Pie Charts


    Pie charts are used to visualize the proportional sizes of different categories.
    They are divided into slices, with each slice representing a category. While pie
