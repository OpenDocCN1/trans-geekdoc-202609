    \ (No Correlation)**：接近 0 的相关表明两个变量之间没有线性关系。\n\n皮尔逊相关系数的公式为：\n\n```\n$r = \\frac{n(\\\
    sum xy) - (\\sum x)(\\sum y)}{\\sqrt{[n\\sum x^2 - (\\sum x)^2][n\\sum y^2 - (\\\
    sum y)^2]}}$\n```\n\n其中：\n\n- n 是数据点的数量，\n- x 和 y 是分析两个变量。\n\n相关分析对于识别变量之间的关系有用，但并不意味着因果关系。例如，冰淇淋销量与溺水事故之间的强相关并不意味着一个导致了另一个；两者都可能受到第三变量（如温度）的影响。\n\
    \n# 回归分析\n\n回归分析更进一步，对因变量（响应变量）与一个或多个自变量（预测变量）之间的关系进行建模。回归的主要目标是根据自变量的值预测因变量的值。\n\
    \n# 回归类型\n\n- **简单线性回归 (Simple Linear Regression)**：这涉及一个因变量和一个自变量。该关系使用形式如下的线性方程建模：\n\
    \n```\n$y = b_0 + b_1x + \\epsilon$\n```\n\n其中：\n\n- y 是因变量，\n- x 是自变量，\n- b0\
    \ 是 y 截距，\n- b1 是直线斜率，\n- $\\epsilon$ 是误差项。\n\n**多元线性回归 (Multiple Linear Regression)**：这涉及一个因变量和多个自变量。模型表示为：\n\
    \n```\ny = b_0 + b_1x_1 + b_2x_2 + ... + b_kx_k + \\epsilon\n```\n\n其中 $x_1, x_2,\
    \ ..., x_k$ 是自变量。\n\n# 相关性与回归的主要区别\n\n| Aspect性 | 相关性 | 回归 |\n| --- | --- | ---\
    \ |\n| 目的 | 衡量两个变量之间关系的强度和方向。 | 对因变量与一个或多个自变量之间的关系进行建模。 |\n| 输出 | 单个系数 (r)。 |\
    \ 可用于预测的回归方程。 |\n| 关系方向 | 表明关系是正的、负还是不存在。 | 提供带有斜率和截距的预测模型。 |\n| 因果关系 | 不意味着因果关系。\
    \ | 如果模型设定恰当且满足假设，可以暗示因果关系。 |\n| 变量 | 不区分因变量和自变量。 | 明确定义因变量和自变量。 |\n\n# 回归分析中的假设\n\
    \n回归分析依赖于几个关键假设：\n\n- 1. **线性线性 (Linearity)**：自变量和因变量之间的关系应该是线性的。\n- 2. **独立性\
    \ (Independence)**：残差（误差）应该是相互独立的。\n- 3. **同方差性 (Homoscedasticity)**：残差在自变量的所有水平上应具有恒定的方差。\n\
    - 4. **正态性 (Normality)**：残差应近似从正态分布，特别是对于假设检验而言。\n\n# 评估回归模型\n\n为了评估回归模型的性能，可以使用几种指标：\n\
    \n- **R方 ($R^2$)**：表示由自变量解释的因变量变异比例。\n- **调整后R方 (Adjusted R-squared)**：根据预测变量的数量调整\
    \ $R^2$ 值，范围从0到1，值越高表示拟合得越好。\n- **均方根误差 (RMSE)**：衡量预测值与观测值之间误差的平均幅度。值越小表示性能越好。\n\
    - **p值**：用于确定回归模型系数的统计显著性。小于0.05 表示预测变量与响应变量相关。\n\n# 4.3 时间序列分析\n\n时间序列分析是一种用于分析随时间收集的数据序列的统计技术。它涉及检查数据中的底层结构和模式以提取见解并进行预测。时间序列数据的特征是有时间顺序，这与其他类型的数据不同。\n\
    \n# 时间序列分析的核心概念\n\n- 1. **时间序列数据 (Time Series Data)**：指特定间隔记录的观测值。示例包括每日股价、每月销售额和年度降雨量。\n\
    - 2. **趋势 (Trend)**：趋势代表数据的长期移动，表明数值是增加、减少还是保持稳定。识别趋势对于理解数据的整体方向至关重要。\n- 3. **季节性\
    \ (Seasonality)**：季节性是指在特定间隔发生的、可预测的模式，例如假日期间销售额的或全年温度的变化。识别季节模式有助于预测。\n- 4. **周期性\
    \ (Cyclic Patterns)**：与季节性不同，周期性发生在不规则间隔内，通常受到经济或业务周期的影响。这些模式可能持续多年，较难识别。\n- 5.\
    \ **噪声 (Noise)**：噪声是指数据中不遵循任何模式的随机波动。它可能会掩盖趋势和季节性，因此为了准确分析过滤噪声至关重要。\n\n# 时间序列分析的类型\n\
    \n时间序列分析可以分为多种方法和途径，每种适用于不同的数据类型和目标：\n\n- 1. **单变量时间序列分析 (Univariate Time Series\
    \ Analysis)**：分析随时间变化的单个变量。例如检查产品的每月销售额以识别趋势和季节模式。\n- 2. **多元时间序列分析 (Multivariate\
    \ Time Series Analysis)**：检查随时间变化的变量之间的关系。它有助于理解多个因素如何影响特定结果，例如广告支出和定价对销售的影响。\n\
    - 3. **分解 (Decomposition)**：该方法将时间序列分解为其组成部分：趋势、季节性和残差（噪声）。\n\n"
