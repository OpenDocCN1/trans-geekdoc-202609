    # 4.2 Correlation and Regression Analysis


    Correlation and regression analysis are essential statistical techniques used
    to examine the relationships between variables. While both methods assess the
    association between two or more variables, they serve different purposes and provide
    different types of information. Understanding these differences is crucial for
    effectively applying these techniques in data analysis.


    # Correlation Analysis


    Correlation analysis quantifies the strength and direction of the linear relationship
    between two continuous variables. The most commonly used measure of correlation
    is the Pearson correlation coefficient, denoted as rr. This coefficient ranges
    from -1 to +1:


    +   - Positive Correlation: A correlation close to +1 indicates a strong positive
    relationship, meaning that as one variable increases, the other variable tends
    to increase as well.


    +   - Negative Correlation: A correlation close to -1 indicates a strong negative
    relationship, meaning that as one variable increases, the other variable tends
    to decrease.


    +   - No Correlation: A correlation near 0 suggests no linear relationship between
    the two variables.'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'The formula for calculating the Pearson correlation coefficient is:


    ```

    $r = \frac{n(\sum xy) - (\sum x)(\sum y)}{\sqrt{[n\sum x^2 - (\sum x)^2][n\sum
    y^2 - (\sum y)^2]}}$

    ```


    Where:


    +   - n is the number of data points,

    - x and y are the two variables being analyzed.


    Correlation analysis is useful for identifying relationships between variables
    but does not imply that one causes causation. For example, a strong correlation
    between ice cream sales and drowning incidents does not mean that one causes the
    other; both may be influenced by a third variable, such as temperature.


    # Regression Analysis


    Regression analysis goes a step further by modeling the relationship between a
    dependent variable (response) and one or more independent variables (predictors).
    The primary goal of regression is to predict the value of the dependent variable
    based on the values of the independent variables.


    # Types of Regression


    +   - Simple Linear Regression: This involves one dependent variable and one independent
    variable. The relationship is modeled using a linear equation of the form:


    ```

    $y = b_0 + b_1x + \epsilon$$

    ```


    Where:


    +   - y is the dependent variable,

    - x is the independent variable,

    - b0 is the y-intercept,

    - b1 is the slope of the line,'
  merge: -1
  img_proc: true
- pgno: 62
  md: '+   - €€ is the error term.


    **Multiple Linear Regression:** This involves one dependent variable and multiple
    independent variables. The model is expressed as:


    ```

    y = b_0 + b_1x_1 + b_2x_2 + ... + b_kx_k + \epsilon

    ```


    Where x1,x2,...xk1,x2,...xk are the independent variables.


    # **Key Differences Between Correlation and Regression


    | Aspect | Correlation | Regression |

    | --- | --- | --- |

    | Purpose | Measures the strength and direction of a relationship between two
    variables. | Models the relationship between a dependent variable and one more
    independent variables. |

    | Output | A single coefficient (r). | A regression equation that can be used
    for prediction. |

    | Direction of Relationship | Indicates whether the relationship is positive,
    negative, or nonexistent. | Provides a predictive model with a slope and intercept.
    |

    | Causation | Does not imply causation. | Can suggest causation if the model is
    properly specified and assumptions are met. |

    | Variables | Does not differentiate between dependent and independent variables.
    | Clearly defines dependent and independent variables. |


    # **Assumptions in Regression Analysis**


    Regression analysis relies on several key assumptions:


    +   1. **Linearity:** The relationship between the independent and dependent variables
    should be linear.


    +   2. **Independence:** The residuals (errors) should be independent of each
    other.'
  merge: -1
  img_proc: true
- pgno: 63
  md: '+   3. Homoscedasticity: The residuals should have constant variance across
    all levels of the independent variable(s).


    +   4. Normality: The residuals should be approximately normally distributed,
