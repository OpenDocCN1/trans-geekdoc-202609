    # Evaluating Regression Models


    To assess the performance of a regression model, several metrics can be used:


    +   - R-squared (R2R2): Indicates the proportion of variance in the dependent
    variable that can be explained by the independent variable(s). Values range from
    0 to 1, with higher values indicating a better fit.


    +   - Adjusted R-squared: Adjusts the R2R2 value for the number of predictors
    in the model, providing a more accurate measure when multiple predictors are used.


    +   - Root Mean Square Error (RMSE): Measures the average magnitude of the errors
    between predicted and observed values. Lower RMSE values indicate better model
    performance.


    +   - p-values: Used to determine the statistical significance of the coefficients
    in the regression model. A p-value less than the significance level (commonly
    0.05) suggests that the predictor is significantly associated with the response
    variable.


