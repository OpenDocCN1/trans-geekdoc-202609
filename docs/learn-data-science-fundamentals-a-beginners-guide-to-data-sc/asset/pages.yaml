  md: 'PCA, which is unsupervised, LDA takes class labels into account, making it
    suitable for classification tasks.


    +   - Kernel PCA: An extension of PCA, kernel PCA applies kernel methods to project
    data into higher-dimensional spaces before performing PCA. This technique is useful
    for capturing nonlinear relationships in the data.


    +   - t-Distributed Stochastic Neighbor Embedding (t-SNE): t-SNE is a nonlinear
    dimensionality reduction technique primarily used for visualizing high-dimensional
    data in two or three dimensions. It focuses on preserving local structures in
