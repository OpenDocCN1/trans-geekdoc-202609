    # 11.4 Policy Gradient Methods and Actor-Critic Architectures


    Policy gradient methods are a class of reinforcement learning algorithms that
    optimize a parameterized policy directly by maximizing the expected reward (cumulative
    reward). Unlike value-based methods, which estimate the value of state-action
    pairs, policy gradient methods focus on learning the value of the policy itself,
    making them particularly effective for problems with high-dimensional action spaces
    and continuous action domains.


    # Key Features of Policy Gradient Methods


    +   Direct Policy Optimization: Policy gradient methods optimize the policy parameters
    using gradient ascent. The policy is represented as a function that maps states
    to a probability distribution over actions, allowing the agent to select actions
    stochastically.


    +   Handling Continuous Actions: These methods are well-suited for environments
    with continuous action spaces, where traditional Q-learning approaches may struggle
    due to the need to discretize actions.


    +   Convergence: Policy gradient methods are guaranteed to converge to a local
    optimum under certain conditions, making them more robust in complex environments
    compared to some value-based methods.


    +   On-Policy Learning: Most policy gradient algorithms are on-policy, meaning
    they learn from the actions taken by the current policy. This can lead to high
    variance in updates, which is a challenge that needs to be managed.


    # Common Policy Gradient Algorithms'
  merge: -1
  img_proc: true
- pgno: 160
  md: '+   1. REINFORCE: This algorithm uses Monte Carlo methods to estimate the gradient
    of the expected return. It updates the policy parameters based on the total reward
    received after an episode, which can lead to high variance in updates.


    +   2. Natural Policy Gradient: This method modifies the standard policy gradient
    by incorporating information about the geometry of the policy space, leading to
    more efficient updates and improved convergence properties.


    +   3. Trust Region Policy Optimization (TRPO): TRPO constrains the policy updates
    to ensure that they remain within a "trust region," preventing large, destabilizing
    updates. This approach improves stability and performance.


    +   4. Proximal Policy Optimization (PPO): PPO simplifies TRPO by using a clipped
    objective function that limits the extent of policy updates, balancing exploration
    and exploitation while maintaining stability.


    # Actor-Critic Architectures


    Actor-Critic methods combine the benefits of both policy gradient and value-based
    approaches. They consist of two main components:


    +   1. Actor: The actor is responsible for selecting actions based on the current
    policy. It updates the policy parameters in the direction that increases the expected
    return.


    +   2. Critic: The critic evaluates the actions taken by the actor by estimating
    the value function (either state-value or action-value). This evaluation provides
    feedback to the actor, allowing it to improve its policy based on the estimated
    returns.


    # Advantages of Actor-Critic Methods


    +   * Reduced Variance: By using the critic''s value estimates, actor-critic methods
    can reduce the variance of policy updates compared to pure policy gradient methods,
    leading to more stable learning.'
  merge: -1
