    +   - Decision Trees: This algorithm splits the data into subsets based on feature
    values, creating a tree-like model of decisions. Decision trees are interpretable
    and can handle both categorical and numerical data.


    +   - Random Forest: An ensemble method that builds multiple decision trees and
