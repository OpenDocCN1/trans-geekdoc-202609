    # 7. Density-Based Methods


    +   - Description: Density-based methods, such as the Local Outlier Factor (LOF),
    identify anomalies by measuring the density of data points in the vicinity of
    a given point.

    - Application: Points that reside in regions of significantly lower density compared
    to their neighbors are flagged as anomalies. This method is particularly useful
