    | Characteristic | Descriptive Statistics | Inferential Statistics |

    | --- | --- | --- |

    | Purpose | Summarizes and describes features of a dataset | Makes inferences
    or generalizations about population |

    | Scope | Focuses on specific sample data | Extends findings to a larger population
    |

    | Objective | Describes characteristics of data | Generalizes findings from sample
    to population |

    | Examples | Mean, median, mode, range, variance | Hypothesis testing, regression
    analysis, confidence intervals |

    | Data Analysis | Provides summary and visualization of data | Draws conclusions,
    hypotheses, and makes predictions |

    | Population Representation | Represents features within the sample only | Represents
    features of the larger population |

    | Statistical Techniques | Histograms, box plots, summary statistics | Hypothesis
    testing, regression analysis |


