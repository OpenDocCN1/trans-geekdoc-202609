    the instantaneous risk of the event occurring at a specific time, given that the
    individual has survived up to that time. It is defined as


    ```

    $$\lambda(t) = \lim_{\Delta t\to0} \frac{P(t < T \leq t + \Delta t|T \geq t)}{\Delta
