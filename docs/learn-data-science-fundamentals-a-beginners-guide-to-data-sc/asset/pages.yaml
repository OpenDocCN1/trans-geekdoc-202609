    # 11.2 Markov Decision Processes and Dynamic Programming


    A Markov Decision Process (MDP) is a mathematical framework used to model decision-making
    problems where outcomes are partially random and partly under the control of a
    decision-maker (agent). MDPs are widely used in reinforcement learning and provide
    a structured way to evaluate and optimize sequential decision-making in uncertain
    environments.


    # **Components of an MDP**


    An MDP is typically defined by the following components:


    +   1. **States (S):** A finite set of states that represent all possible situations
    the agent can be in. Each state provides a snapshot of the environment at a given
    time.


    +   2. **Actions (A):** A finite set of actions available to the agent. The choice
    of action will influence the transition from one state to another.


    +   3. **Transition Function (T):** This function defines the dynamics of the
    environment. It specifies the probability of moving from one state to another
    given a particular action. Formally, it can be'
  merge: -1
  img_proc: true
- pgno: 155
  md: 'represented as P(s'' | s,a)P(s'' | s,a), which denotes the probability of reaching
    state s''s from state ss after taking action aa.


    +   4. **Reward Function (R):** The reward function assigns a numerical value
    to each state-action pair, indicating the immediate reward received after performing
    an action in a given state. It is typically represented as R(s,a)R(s,a).


    +   5. **Discount Factor (γ):** A value between 0 and 1 that determines the importance
    of future rewards. A discount factor close to 0 makes the agent focus on immediate
    rewards, while a value close to 1 encourages consideration of long-term rewards.


    # The Markov Property


    The Markov property states that the future state of the process depends on the
    current state and the action taken, not on the sequence of events that preceded
    it. This memoryless property simplifies the modeling of decision-problems.


    # Dynamic Programming in MDPs


    Dynamic programming (DP) techniques are commonly used to solve MDPs by breaking
    down the problem into simpler subproblems. The two primary DP methods for solving
    MDPs are:


    +   **Value Iteration:** This algorithm iteratively updates the value of each
    state based on the expected rewards of taking each action and transitioning to
    subsequent states. The process continues until the values converge to a stable
    solution. The Bellman equation is central to this method, as it expresses the
    relationship between the value of a state and the values of its successor states.


    ```

    V(s) = max_{a} (R(s,a) + γ ∑ P(s''|s,a)V(s''))

    ```


    +   **Policy Iteration:** This method involves two main steps: policy evaluation
    and policy improvement. Initially, a random policy is selected, and the value
    of each state under this policy is computed. The policy is then updated based
    on the current value'
