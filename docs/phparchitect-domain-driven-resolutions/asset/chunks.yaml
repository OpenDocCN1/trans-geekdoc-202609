  trans: "\n\n![来自 Pi 的干燥机已关闭的短信](img/file1.png)\n\n来自 Pi 的干燥机已关闭短信\n\n# 核心组件列表\n\n\
    我可以在此项目使用的最小树莓派是 `Raspberry Pi Zero W`：\n\n![Raspberry Pi Zero W](img/file2.jpg)\n\
    \nRaspberry Pi Zero W\n\n如果你使用 `Raspberry Pi Zero W`，请记住它只支持 2.4GHz 无线。因此，如果你的无线路由器只支持\
    \ 5GHz，你可能想使用其他型号的树莓派。`Pi 3 B+` 和 `4 B` 支持 2.4 和 5GHz 无线以太网。使用 `Pi 3 B+` 或 `4\
    \ B` 的优点是你可以不需要进行任何焊接。\n\n### 我真的需要学习焊接吗？\n\n> 焊铁对电容器说了什么？“去你的焊吧（Go flux yourself）！”\n\
    \n所有的树莓派都有一个通用输入/输出 (`GPIO`) 总线，这是一个双排 40 针母插针，用于将传感器和其他设备连接到树莓派：\n\n![树莓派 40\
    \ 针插座](img/file3.jpg)\n\n树莓派 40 针插座\n\n稍后我们将加速度传感器连接到树莓派的 `GPIO` 总线。由于我使用的是 `Pi\
    \ Zero W`，我必须在电路板上焊接一个双排 40 针母插座以暴露 `GPIO` 总线引脚，因为 `Pi Zero W` 板没有预装该插座。\n\n这里是我在树莓派上焊接插座以及在一个版本的加速度传感器上焊接\
    \ 6 个引脚的一些照片：\n\n![在 Pi Zero W 上焊接引脚](img/file4.png)\n\n在 Pi Zero W 上焊接引脚\n\n\
    ![已焊接的 40 针插座](img/file5.png)\n\n已焊接的 40 针插座\n\n![在加速度上焊接引脚](img/file6.png)\n\n\
    在加速度上焊接引脚\n\n![将 Pi Zero W 放入外壳](img/file7.png)\n\n将 Pi Zero W 放入外壳\n\n再次，你可以使用任何树莓派，但我觉得使用一个只有信用卡一半大小的树莓派会非常酷。我建议你使用内置无线以太网的树莓派，因为这将是我在这里要记录的配置。\n\
    \n![双排 40 针母插座](img/file8.jpg)\n\n双排 40 针母插座\n\n![40 针排线](img/file9.jpg)\n\n40\
    \ 针排线\n\n![图 1. 来自 Sparkfun 的 MMA8452](img/file10.jpg)\n\n图 1. 来自 Sparkfun 的 MMA8452\n\
    \n![图 2. 来自 eBay 的 Keyes MMA8452Q](img/file11.jpg)\n\n图 2. 来自 eBay 的 Keyes MMA8452Q\n\
    \n好了，让我们列出所需的五件物品：\n\n1. **你的电脑**\n   你需要一台连接到互联网的电脑来下载树莓派操作系统。理想情况下，你希望通过电脑通过\
    \ `SSH` 连接到树莓派。我假设你正在运行某种类 Unix 系统（Ubuntu, MacOS 等）。但是，如果你有一台 Windows PC，互联网上有大量关于如何与你的树莓派通信的信息。\n\
    \n2. **你的家用无线路由器**\n   我不会详细介绍如何配置它，因为每个人的情况都不同。我假设你有一个，并介绍连接到它的通用方法。\n\n3. **树莓派**\n\
    \   我建议购买一个包含外壳、电源和 SD 卡的套件。我从 [CanaKit](https://www.canakit.com) 买的，但你也可以从 Amazon\
    \ 或任何其他树莓派经销商处购买。\n   以下是你可能想要拥有的与你的树莓派相关的物品列表：\n   * 双排 40 针插座（如果你购买了 `Pi Zero\
    \ W`）。你可以从 [Amazon](https://phpa.me/amazon-40pin-duel) 获取。\n   * 烙铁和焊锡（如果你购买了\
    \ `Pi Zero W`）\n   * 外壳\n   * 树莓派电源\n   * 至少 8GB 的 SD 卡。（小于 16GB 可能不划值。我建议购买额定为\
    \ `UHS-1` 或更好的卡。大多数都是都是。）\n   * SD 卡阅读器。许多树莓派套件都带有一个插入电脑 `USB` 端口的阅读器。\n   * HDMI\
    \ 线（如果你想用键盘和显示器配置你的树莓派）\n   * 键盘（如果你想用键盘和显示器配置你的树莓派）\n   * 显示器（如果你想用键盘和显示器配置你的树莓派）\n\
    \n4. **加速度传感器**\n   有很多不同的加速度传感器可用。我在这个项目中想要一个使用 `I2C` 总线的传感器——稍后会详细介绍。我们将使用一个小型\
    \ C 程序，它与 `MMA8452Q` 三轴加速度计通信。有两种略有不同的板类型：\n   * 图 1 所示的 `MMA8452` 可以从 [Sparkfun](https://www.sparkfun.com/products/13926)\
    \ 购买。\n   * 以及 Keyes 的 `MMA8452Q`，可以从 [eBay](https://phpa.me/ebay-accelerometer)\
    \ 购买。见图 2。\n   Keyes 版本的优点是它预焊了 6 个引脚。\n\n5. **连接加速度传感器到树莓派的母母 4 针排线**\n   这些通常以\
    \ 40 针排线的形式提供，剥下 4 根线将加速度传感器连接到树莓派的 `GPIO` 总线。你可以从 [Amazon](https://phpa.me/amazon-fem-jumper-40)\
    \ 购买。\n\n# 配置你的树莓派\n\n现在我们已经有了所有的核心设备和组件，我们需要安装操作系统并配置我们的树莓派。\n\n### 下载树莓派 OS\
    \ 镜像\n\n首先，我们需要获取一个树莓派操作系统 (OS) 镜像并将其放置到 SD 卡中。最好的方法是下载 [Raspberry Pi Imager](https://www.raspberrypi.com/software/)。该页面上有提供适用于\
    \ MacOS、Windows 或 Ubuntu 的写入器下载链接。你甚至可以在 UNIX 终端窗口中使用 `apt` 包管理器来安装 `Raspberry\
    \ Pi Imager`。在下载了适用于你操作系统的写入器包后，按照安装说明进行。\n\n将你的 SD 卡阅读器插入电脑，并插入你将用于树莓派的 SD 卡。\n\
    \n启动 `Raspberry Pi Imager`，你应该看到它的主界面：\n\n![media/file8.png] -> *注：此处原文逻辑对应图片应为\
    \ file12* \n（修正：应该是 `Raspberry Pi Imager` 的主界面：\n\n![media/file12.png]\n\n启动 `Raspberry\
    \ Pi Imager`，你应该看到它的主界面：\n\n![media/file12.png]\n\n选择 `CHOOSE STORAGE`，将弹出 `Storage`\
    \ 对话框：\n\n![media/file13.png]\n\n选择你的 SD 卡——通常显示为 `Generic MassStorage Media`\
    \ 以及其大小。\n\n现在选择 `CHOOSE OS`，将弹出 `Operating System` 对话框：\n\n![media/file14.png]\n\
    \n选择 `Raspberry Pi OS (other)`，将显示一组可选的树莓派操作系统：\n\n![media/file15.png]\n\n选择 `Raspberry\
    \ Pi OS Lite (32-bit)`——这是一个 Linux 服务器安装，由于我们不需要完整的桌面安装，它可以减少 CPU 占用。你现在将返回 `Raspberry\
    \ Pi Imager` 的主界面：\n\n现在选择 `WRITE` 将镜像写入你的 SD 卡。你现在会看到一个 `Warning` 对话框，告知你 SD\
    \ 卡上的现有数据将被删除，并确保你想要继续。选择 `YES`。\n\n通常会弹出一个 `Permissions` 对话框，要求你输入电脑管理员密码以便写入\
    \ SD 卡。\n\n输入凭据后，`Raspberry Pi Imager` 开始将 OS 写入 SD 卡。当写入操作完成后，将显示 `Write Successful`\
    \ 对话框。选择 `CONTINUE` 并退出 `Raspberry Pi Imager` 应用程序。你现在可以从 SD 卡阅读器中取出 SD 卡。\n\n\
    现在我们需要配置我们的树莓派。你有两种方法可以实现：\n\n* 无头配置 (Headless configuration)\n* 直接配置 (Direct\
    \ configuration)\n\n我将首先展示无头配置，因为我觉得它是最简单的。然后我将展示直接配置。\n\n"
