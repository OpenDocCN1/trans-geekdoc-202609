- raw: "I am a Freelancer providing services mainly around PHP, its core, and ecosystem.\
    \ I am currently working on Blackfire’s PHP extension and as an IT architect for\
    \ a Belgian company in the public sector. Previously I was a core developer of\
    \ eZ Publish/eZ Platform CMS (now Ibexa).\n\nHow much PHP coding do you do?\n\n\
    It is pretty even between PHP and C, about 50% of each.\n\nHow long have you been\
    \ involved with PHPInternals?\n\nProbably something like 15 years when I started\
    \ discussing on the #internals PHP mailing list. My first real practical involvement\
    \ was in 2009, and this is when I got access (called internally “karma”) to PHP’s\
    \ source code to contribute to PHPT tests that are part of PHP’s unit test suite.\
    \ Later, I contributed with a patch to have “Array to string conversion” notices\
    \ (now warnings) before PHP 5.4: that was silently converting it to string “array,”\
    \ pretty useless and hiding a lot of possible bugs.\n\nWhat is it like being a\
    \ release manager for PHP? What are the responsibilities?\n\nI would summarize\
    \ it as watching the CI, preparing tag/tarballs/versions, and then announcing\
    \ them.\n\nHow has it been working with Joe Watkins through this process?\n\n\
    Joe helped us with the questions that Ben or myself had, but another great resource\
    \ that previous managers have contributed to is the various wiki pages about release\
    \ management. This is the first time there have been 2 “new” release managers.\n\
    \nWhat challenges do you see for PHP in the coming years?\n\nThe desire, by some,\
    \ of PHP being a stricter language, by some others, of being enriched with new\
    \ features, and by yet others of keeping backward compatibility as much as possible\
    \ is quite tough and often leads to passionate discussions. On the other side,\
    \ the engine keeps getting more and more complex as new features get in. We are\
    \ very lucky to have Nikita Popov and Dmitry Stogov aboard. Unfortunately, the\
    \ number of people able to understand all the parts of the engine does not scale\
    \ as much as its complexity.\n\nWhat tools do you use in your daily development\
    \ workflow today?\n\n*   IDE: Vim and JetBrains (PHPStorm & CLion)\n\n*   OS:\
    \ Gentoo Linux\n\n*   Shell: bash\n\n*   Debugging tools: xdebug, gdb, strace/ltrace,\
    \ Wireshark, inotify tools\n\n*   Static analyzer: Phan\n\n*   VCS: git\n\nWhat\
    \ are some of your proudest accomplishments or achievements?\n\nGetting the trust\
    \ of PHP internals to be one of the Release Managers is quite a big thing for\
    \ me. I am quite proud of it.\n\nWho, in any development community, do you look\
    \ up to or inspire you, and why?\n\nRasmus Lerdorf, Nikita Popov, Derick Rethans\
    \ & Sara Golemon for their brilliant minds.\n\nDo you have any opinions about\
    \ PHP Frameworks, and are there any you are interested in using or do use?\n\n\
    PHP Frameworks are a bit incomparable to other languages “Web Frameworks.” With\
    \ general-purpose languages such as C#, C/C++, Java, Python, Ruby, … there is\
    \ no native “web” support at the level of the language itself. It usually relies\
    \ on Web Frameworks for that. While some will advocate that PHP can be considered\
    \ general-purpose, it is most famous and tailored towards web development.\n\n\
    When dealing with the “web,” there are many different aspects:\n\nFirst, the HTTP\
    \ protocol, when a **request** comes, it is a message that contains an HTTP method,\
    \ a target, an HTTP version, many possible headers (including cookies/session\
    \ info), and possibly a body.\n\nWhatever webserver you are working with, PHP\
    \ abstracts those concepts and makes the information available in a standardized\
    \ way (`$_GET`, `$_POST`, `$_COOKIE`, `$_FILES`, `$_SESSION`). All of those superglobals\
    \ are lazy-loaded until you have to deal with one of them; PHP won’t spend the\
    \ time to interpret that part of the request.\n\nWhen it comes to answering a\
    \ request, PHP abstracts the complexity of generating the HTTP **response**. That\
    \ response will be composed of a protocol version, a status code/text, headers,\
    \ and, most of the time, a body.\n\nIn order to deal with the complexity of combining\
    \ all those ingredients, PHP provides a full suite of functions to control the\
    \ outcome: `header()`, `set_cookie()`, `sessions_start()`, `http_response_code()`,\
    \ … and writing in the body is as simple as using echo or having content outside\
    \ of “… ?”.\n\nWhile the body has to appear after all the headers, PHP provides\
    \ output buffering so that you may not have to deal with the order of operations.\n\
    \nSecondly, the web is also about formats, while HTML can be just considered as\
    \ simple text, PHP natively provides ways to interact (both reading and writing)\
    \ with the most popular formats on the web: XML (with SimpleXML, DOM, XMLReader,\
    \ XMLWriter), XSL, JSON, images (with GD, ImageMagick, exif),…\n\nFinally, it\
    \ is also common to interact with 3rd parties HTTP-enabled services. This is also\
    \ natively available and made easy thanks to the awesome bundled curl library\
    \ or through SOAPClient/SOAPServer.\n\nThis makes PHP already closer to many other\
    \ languages’ Web Framework in terms of features.\n\nFor a quality project, this\
    \ one should respect and use many best practices/principles: coding standard,\
    \ version control, clean routing mechanism, design/architectural patterns, separation\
    \ of concerns (MVC), inversion of control (dependency injection), SOLID, YAGNI,\
    \ KISS, DRY, security, static analysis, testing (unit, functional, BDD)…\n\nMany\
    \ (PHP) frameworks will promote and advocate those concepts and often guide their\
    \ users to achieve them. [PHP.net](http://php.net) and its documentation does\
    \ not really guide newcomers much and, I wish it could. However, as there are\
    \ many different ways and opinions to reach those best practices, it may be hard\
    \ to keep neutrality.\n\nAs a veteran PHP developer, I do not feel the need to\
    \ use a PHP Framework as all of the patterns or best practices I mentioned above\
    \ can be achieved without, nor would it help me. That does not mean I am reinventing\
    \ the wheel, nor that I do not include libraries. My personal projects use the\
    \ following skeleton: “vanilla” PHP + composer + phan. Not using another framework\
    \ other than PHP, my projects are usually simpler to keep up-to-date as PHP evolves\
    \ with a strong backward compatible policy. Over more than ten years, very few\
    \ things had to be changed while upgrading PHP.\n\nWhen I work on a project that\
    \ includes a major PHP Framework, it is Symfony.\n\nNext month, we speak with\
    \ the other first-time release manager Ben Ramsey.\n\n![Figure 1.](media/file36.png)\n\
    \nFigure 1.\n\n![Figure 2.](media/file37.jpg)\n\nFigure 2.\n\n> ### Biography\n\
    \n> \n\n> ![Eric Van Johnson](media/file38.jpg)Eric Van Johnson is the CTO of\
    \ DiegoDev Group, LLC. An organizer of San Diego PHP (SDPHP) and podcaster with\
    \ php\\[podcast\\], PHPUgly, and PHPRoundtable. A husband, father, and enjoyer\
    \ of scotch and baseball. [@shocm](https://twitter.com/shocm)\n\n# finally{}:\
    \ Experts or Out-of-touch?\n\n###### By Beth Tucker Long\n\n> After talking to\
    \ someone about ideas for new security education, I popped over to check out the\
    \ latest OWASP Top Ten list. A quote on their homepage stood out to me:\n\n> This\
    \ category represents the scenario where the security community members are telling\
    \ us this is important, even though it’s not illustrated in the data at this time.\
    \ [https://owasp.org/www-project-top-ten/](https://owasp.org/www-project-top-ten/)\n\
    \nThe experts in their community were telling them that a specific issue was critical\
    \ and widespread enough to warrant a place in the top ten, but the data they collected\
    \ from codebases and users didn’t reflect this at all. Is this because the issue\
    \ is too up-and-coming to be reflected in the current boots-on-the-ground numbers,\
    \ but we need to act now because it will soon be a huge issue? Or is this a situation\
    \ where the experts work on a level so different from the standard developer that\
    \ the security risk is only applicable to them and not in everyday circumstances?"
