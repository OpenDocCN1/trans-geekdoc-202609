- raw: 'In fact, what I described *is* the simplification. We tossed out a feature
    that added another complex variable to the mix. This brought me down to 43 distinct
    “happy path” scenarios for the single web page where our athlete chooses what
    disciplines to compete in and whether or not to include a donation to the League.


    More importantly, this exercise allowed me to lay out a short set of business
    rules to be discussed with our stakeholders. Rather than having a bunch of “magic”
    under the covers, we have well-structured business rules written out that any
    relevant person can easily understand. We also have those 43 scenarios running
    via `behat`, showing in detail how we fulfill each of those different paths through
    the code.


    It took me the better part of a day to boil that “simple” invitation page down
    to a coherent, small set of business rules that make sense. That was time well
    spent. Getting that unexpected complexity under control was crucial.


    Let’s write some production code.


    ## The First Workflow


    The first workflow, creating a new account, is not difficult. We have many years
    of experience doing exactly this at the USA Clay Target League. We’re spreading
    the workflow across several web pages. (The reasons are outside the scope of this
    article, but they’re based on previous years’ experience with this functionality.)
    This is a data-collection application with “Next” buttons at the bottom of each
    screen.


    It made the most sense to us to put the entire workflow in a single Controller
    class. Each web page becomes a method in that Controller. We created what Fowler
    in *Patterns of Enterprise Application Architecture* (PoEAA), page 110, calls
    a "Transaction Script:


    > Organizes business logic by procedures where each procedure handles a single
    request from the presentation".


    As it happens, that is the very first pattern cataloged in PoEAA, so it seems
    a good starting point. Fowler explains when to use it:


    > The glory of Transaction Script is its simplicity. Organizing logic this way
    is natural for applications with only a small amount of logic, and it involves
    very little overhead either in performance or understanding.


    That fits our situation exactly!


    Except that it doesn’t. There’s a problem. That one Controller class became far
    longer than 1,000 lines long. Business logic became deeply nested if blocks. The
    code works, which is good. Yet Fowler notes in *Refactoring: Improving the Design
    of Existing Code, 2nd Edition*, page 73 (“Long Function”):


    > Since the early days of programming, people have realized that the longer a
    function is, the more difficult it is to understand.


    True, our Transaction Script (the Controller class) is not complex, but we greatly
    added to the *mental* complexity, often called the cognitive load.


    Furthermore, Fowler (PoEAA, pp. 111-112) notes that a Transaction Script pattern
    quickly reaches its limit:


    > As the business logic gets more complicated, however, it gets progressively
    harder to keep it in a well-designed state… more complex business domains need
    to build a Domain Model… It’s hard to quantify the cutover level, especially when
    you’re more familiar with one pattern than the other. You can refactor a Transaction
    Script design to a Domain Model design, but it’s a harder change than it otherwise
    needs to be. Therefore, an early shot is often the best way to move forward.


    A funny thing happened! Looking at that 1,500-line Controller class, I decided
    I was going to refactor it right now, even though it wasn’t a good time. I had
    already built comprehensive test coverage, so I felt my risk of breaking something
    was pretty low. Only just now, as I type up this walkthrough, did I pull Fowler
    off the shelf and discover he included the exact same advice with his first pattern
    in the book.


    Fowler completes his advice thus:


    > However much of an object bigot you become, don’t rule out Transaction Script.
    There are a lot of simple problems out there, and a simple solution will get you
    up and running much faster.


    Within our PHP ecosystem, that remains *extremely* good advice!


    ## Refactor


    At this point, the first workflow, in its entirety, sits within one large Controller
    class. Each controller method handles one specific webpage within that workflow.
    At this point, the code is absolutely typical.


    Each method represents a single-use case, feature, or ability. I had created ten
    feature files covering both “happy paths” and edge cases, including various kinds
    of invalid input.


    Why am I making a point about the feature files? Because they guide the refactoring.
    They are part of the Dragon Wrangling Pattern for this reason.


    We’ll be aligning our software according to the use case. At this point, “controller
    method,” “use case,” and “feature file” mean pretty much the same thing. That
    makes it easy to refactor and restructure. We have a comprehensive set of tests
    in place, ensuring we don’t break any existing feature code.


    For each controller method, then, we’ll be creating two new classes:


    *   The use case handler


    *   The use case handler’s Repository


    Instead of thinking of the controller method as a web page handler, think of it
    as a use case handler. It’s basically the same thing, but now we’re thinking in
    terms of functionality or business need rather than visual presentation.


    Our first step will be to move any business logic out of the controller method
    and into the use case handler. If we have six controller methods handling the
    six steps in the workflow, that means we’ll now have six separate use case handlers—that
    is, six new classes, with each use case handler being its own PHP class.


    It’s oft been said that the two most difficult problems in Computer Science are
    cache invalidation, naming things, and off-by-one errors. Our problem of the moment
    is naming things.


    “Use case handler,” forsooth. Scott Millett, in \*Patterns, Principles, and Practices
    of Domain-Driven Design" (p. 108), calls the use case handler an Application Service:


    > The application service layer represents the use cases and behavior of the application.
    Use cases are implemented as application services that contain application logic
    to coordinate the fulfillment of a use case by delegating to the domain and infrastructural
    layers.


    Scott got it right. We’ll call this “thing” an Application Service from here on
    out.


    What’s the Repository? At this point, it’s simply a wrapper for reaching the application’s
    MySQL database. However, it is very specific and not generalized in any way. It
    fulfills the Application Service’s specific needs *and no more*. It’s that restriction
    that makes the Repository design so powerful, but the reasons why are outside
    the scope for now.


    ## Application Service


    Here is one of the Application Services from that first workflow. You will immediately
    note that there’s basically nothing there! That’s powerful, it turns out, and
    matches Millet’s statement that the application service layer coordinates the
    use case by delegating.


    **Listing 1.**


    ```


    ```


    The Application Service contains three methods and each of those methods delegates
    to the Repository method of the same name. This Application Service class is simply
    a pass-through.


    The corresponding Repository looks like this:


    **Listing 2.**


    ```


    ```


    The final method, with the `try` / `catch` surrounding a manual database transaction,
    matches the pattern explained with Listing 3 of “Designing for MySQL Transaction
    Failures” in December 2021 php[architect].


    You might have noticed that we reloaded the database row to be updated. We load
    it once, and then, inside the MySQL transaction, we load it again. That’s to ensure
    we don’t accidentally store stale data by “stepping on” some other process that
    was simultaneously making the same mistake. There are other solutions to this
    problem, such as locking the row for update when reading the row, but either way,
    it’s an important practice to follow.'
