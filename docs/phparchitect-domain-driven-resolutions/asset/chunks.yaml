    \ %>s %O \\\"%{Referer}i\\\" \\\"%{User-Agent}i\\\"\" combined\nLogFormat \"%h\
    \ %l %u %t \\\"%r\\\" %>s %O\" common\nLogFormat \"%{Referer}i -> %U\" referer\n\
    LogFormat \"%{User-agent}i\" agent\nIncludeOptional conf-enabled/*.conf\nIncludeOptional\
    \ sites-enabled/*.conf\n```\n\n## Default Host Configuration\n\nWe can see there\
    \ are two sites enabled by default `000-default.conf` and `default-ssl.conf`.\
    \ Together these files contain the directives to serve a basic site from the path\
    \ `/var/www/html`. The virtual host configurations will inherit the entire Apache\
    \ configuration by default. Virtual hosts are specific configurations for websites\
    \ and applications being served from Apache. We can use `sudo vim /var/www/html/info.php`\
    \ to create a new PHP file and paste `<? phpinfo();`. Saving the file (`:wq` or\
    \ `:x`) and visiting `http://localhost/info.php` shows you something similar to\
    \ the PHP Version 7.4.3 info page.\n\n![php-info-page.png](media/file31.png)\n\
    \nphp-info-page.png\n\nPHP Info Page\n\nWhile PHP 7.4 is a fine release, in 2021\
    \ it’s somewhat old. We should use [Ondřej Surý’s](https://deb.sury.org) Private\
    \ Package Archive (PPA) to install more recent versions of PHP. To add the PPA,\
    \ we’ll run `sudo add-apt-repository ppa:ondrej/php`, which adds Ondřej’s repository\
    \ on our system. To install PHP 8.1 in our current configuration we can run `sudo\
    \ apt install -y libapache2-mod-php8.1 php8.1-xml` . With our new PHP version\
    \ enabled, we can use `sudo a2dismod php7.4` to disable PHP 7.4 from Apache and\
    \ use `sudo a2enmod php8.1` to enable PHP 8.1 for use with Apache. To apply our\
    \ PHP version changes, run `sudo service apache2 restart`, and we can refresh\
    \ our `http://localhost/info.php` browser window to see we’re now running PHP\
    \ 8.1.0. An important note: we’re leveraging [mod\\_php](https://stackoverflow.com/questions/2712825),\
    \ an Apache module, to run PHP; this means we can only have one PHP version running\
    \ at a time. To run multiple PHP versions with Apache, we’d want to install and\
    \ configure [PHP-FPM](https://www.php.net/install.fpm), which we’ll cover in a\
    \ future installment. Using `mod_php`, we’re wrapping PHP inside Apache. FPM,\
    \ for example, is an external (to Apache) service typically connected via sockets\
    \ or TCP.\n\nTo create a self signed SSL certificate for our local development\
    \ site we can use `sudo openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout\
    \ /etc/ssl/private/apache-selfsigned.key -out /etc/ssl/certs/apache-selfsigned.crt`.\
    \ For usage across networks (i.e., once you’re not on your local machine), you’ll\
    \ want to use [Let’s Encrypt](https://letsencrypt.org) to create functional SSL\
    \ certificates that browsers will trust because they’re signed by a proper Certificate\
    \ Authority, unlike our self-signed certificate.\n\nNow with a fresh PHP 8.1 working\
    \ with Apache, we’re ready to create our first virtual host which will serve as\
    \ our development environment for our project. We’ll create a fresh application\
    \ located at `/var/www/fresh` and use `sudo chown -R www-data:www-data /var/www/fresh`\
    \ to ensure our `www-data` user owns the files and will be able to run them via\
    \ Apache. Create a new file at `/etc/apache2/sites-available/fresh.test.conf`\
    \ containing the Virtual host directives as shown in Listing 3.\n\n**Listing 3.**\n\
    \n```\n<VirtualHost *:80>\n    ServerName fresh.test\n    DocumentRoot /var/www/fresh/public\n\
    \    ErrorLog ${APACHE_LOG_DIR}/fresh-error.log\n    CustomLog ${APACHE_LOG_DIR}/fresh-access.log\
    \ combined\n</VirtualHost>\n<VirtualHost *:443>\n    ServerName fresh.test\n \
    \   DocumentRoot /var/www/fresh/public\n    SSLEngine on\n        SSLCertificateFile\
    \ /etc/ssl/certs/apache-selfsigned.crt\n    SSLCertificateKeyFile /etc/ssl/private/apache-selfsigned.key\n\
    </VirtualHost>\n```\n\nOur `fresh.test` Virtual host will listen on any network\
    \ address to port 80 for incoming requests: `<VirtualHost *:80>`. We’ll use `ServerName\
    \ fresh.test` to instruct Apache to serve requests at our development URL. The\
    \ `DocumentRoot` directive instructs Apache to use the path as the webroot to\
    \ serve `fresh.test` from `/var/www/fresh/public/` path. The next two log directives\
    \ configure the `ErrorLog` to contain all site errors and a `CustomLog` to log\
    \ all the requests accessed of this server. Once the server has sent the request\
    \ to the PHP process the application’s logging configuration may utilize these\
    \ same log locations. Although, they will often use their own such as `storage/logs/laravel.log`\
    \ is the default for a Laravel application log location.\n\nWith our Virtual host\
    \ configuration complete, we need to enable our site with `sudo a2ensite fresh.test.conf`\
    \ then reload Apache with `sudo service apache2 reload`. Before we test our configuration\
    \ in the browser, we need to ensure our system’s host file contains a mapping\
    \ for our `fresh.test` domain since it’s not a real registered domain name. We’ll\
    \ want to add `127.0.0.1 fresh.test` to `/etc/hosts` on Linux, Unix, macOS systems\
    \ while Windows users will find this file at `C:\\Windows\\system32\\drivers\\\
    etc\\hosts`.\n\nBecause we’re using a self-signed certificate, web browsers may\
    \ show warnings when we visit `[https://fresh.test](https://fresh.test)` such\
    \ as Firefox’s “Firefox detected a potential security threat and did not continue\
    \ to fresh.test” We know this is our development site, so we can click “Advanced”\
    \ and “Accept the Risk and Continue” to proceed to our site, which is now serving\
    \ our fresh Laravel application.\n\n![default-page.png](media/file32.png)\n\n\
    default-page.png\n\ndefault page\n\nUltimately there is not much to Apache. When\
    \ software has been around this long, it’s reassuring to know the investment spent\
    \ learning it is still useful today and carries over to all aspects of web development,\
    \ not just PHP. The fundamentals Apache teaches us will apply to every back-end\
    \ programming language, whether PHP, Ruby, or Python. The biggest thing I appreciate\
    \ about the Ubuntu ecosystem is how numerous mundane tasks such as: creating paths,\
    \ shortcuts to configuration files, and auto wiring up PHP & Apache via `mod_php`;\
    \ are automatic. Alternatively, on Debian or Red Hat systems, you will be responsible\
    \ for creating and copying a lot of these files and configuration paths manually.\
    \ Another benefit of Apache is that so much content exists on every level; from\
    \ complete new users to grizzled veterans, there’s always something new to learn.\n\
    \nThanks for joining a trip down memory lane and learning about the Apache and\
    \ PHP basics. I hope you’re empowered to start hacking on your instances of Apache\
    \ and exploring what the most popular web server on the internet has to offer.\
    \ Next month we’ll be diving into FPM configuration and demonstrating how to use\
    \ [Nginx](https://www.nginx.com) to provide more secure and isolated applications.\n\
    \n> ### Biography\n\n> "
