  trans: '


    事实上，我所描述的*就是*简化。我们舍弃了一个会为组合中增加另一个复杂变量的功能。这让我在单个网页上减少到了 43 个不同的“快乐路径”（happy path）场景，在该页面上，运动员可以选择参加哪些项目，以及是否要向联盟捐款。


    更重要的是，这次练习允许我列出一套简短的业务规则，以便与利益相关者讨论。我们不再在底层堆砌一堆“魔法”，而是写出了结构良好的业务规则，任何相关人员都能轻松理解。我们还通过
    `behat` 运行了那 43 个场景，详细展示了我们如何通过代码实现每条不同的路径。


    我花了大半半一天的时间才将那个“简单”的邀请页面提炼为一组连贯、合理的业务规则。这段时间花得很值。控制这种意外之外的复杂性至关重要。


    让我们开始编写生产代码。


    ## 第一个工作流


    第一个工作流——创建新账户并不困难。我们在美国粘靶联盟（USA Clay Target League）处理这方面有着多年经验。我们将工作流分布在几个网页上。（原因超出了本文的范围，但是基于多年处理该功能的经验。）这是一个数据收集应用，每个屏幕底部都有“下一页”按钮。


    对我们来说，将整个工作流放在一个 `Controller` 类中是最合理的。每个网页都变成该 `Controller` 中的一个方法。我们创建了 Fowler
    在《企业级应用架构模式》（*Patterns of Enterprise Application Architecture*, PoEAA）第 110 页中所说的“事务脚本”（Transaction
    Script）：


    > 通过过程来组织业务逻辑，每个过程处理一个来自表示层的单个请求。


    恰巧的是，这是 PoEAA 中收录的第一个模式，因此它看起来是一个很好的切入点。Fowler 解释了在什么情况下使用它：


    > 事务脚本的辉煌之处在于它的简单性。对于逻辑较少的应用程序，以这种方式组织逻辑是自然做法，而且在性能或理解上它的开销都非常小。


    这完全符合我们的情况！


    但事实并非如此。问题出现了。那个单一的 `Controller` 类变得长度远超过了 1,000 行。业务逻辑变成了深度嵌套的 `if` 块。代码可以运行，这是好事。然而，Fowler
    在《重构：改善既有代码的设计》（*Refactoring: Improving the Design of Existing Code, 2nd Edition*）第
    73 页（“长函数”）中提到：


    > 从编程早期开始，人们就意识到函数越长，就越难以理解。


    确实，我们的事务脚本（`Controller` 类）并不复杂，但我们极大地增加了*心理*上的复杂度，这通常被称为认知负荷。


    此外，Fowler (PoEAA, pp. 111-112) 指出事务脚本模式很快就会达到它的局限：


    > 然而，随着业务逻辑变得越来越复杂，保持其良好的设计会变得越来越困难……复杂的业务领域需要构建领域模型（Domain Model）……很难量化切换点，特别是当你对一种模式比另一种熟悉时。你可以将事务脚本设计重构为领域模型设计，但这比原本需要的要困难。因此，尽早尝试通常是向前发展的最好方法。


    发生了一个趣事！看着那个 1,500 行的 `Controller` 类，我决定现在就重构它，尽管现在并不是个好时机。我已经建立了全面的测试覆盖，所以我觉得自己破坏某些东西的风险很低。直到现在我写这篇指南时，我才从书架上拿出
    Fowler 的书，发现他在书中第一个模式中包含了完全相同的建议。


    Fowler 这样完成了他的建议：


    > 无论你成为多么的“对象偏执者”，都不要排除事务脚本。现实中有很多简单的问题，一个简单的解决方案会让你更快速地投入运行。


    在我们的 PHP 生态系统中，这仍然是*极其*极好的建议！


    ## 重构


    此时，第一个工作流的整体位于一个大型的 `Controller` 类中。每个 `controller` 方法处理该工作流中的一个特定网页。到目前为止，代码完全是典型的。


    每个方法代表一个单一的用例、特性或能力。我之前创建了十个特性文件（feature files），涵盖了“快乐路径”和边界情况，包括各种类型的无效输入。


    我为什么要强调特性文件呢？因为它们引导了重构。由于这个原因，它们是“驯龙模式”（Dragon Wrangling Pattern）的一部分。


    我们将根据用例来对齐我们的软件。此时，“控制器方法”、“用例”和“特性文件”几乎意味着同一种东西。这使得重构和重组变得容易。我们已经有一套完整的测试，确保我们不会破坏任何现有的特性代码。


    因此，对于每个 `controller` 方法，我们将创建两个类：


    *   用例处理器（use case handler）

    *   用例处理器的 `Repository`


    不要把 `controller` 方法看作网页处理器，而要把它看作用例处理器。这基本上是一回事，但现在我们是从功能或业务需求的角度来考虑，而不是视觉呈现。


    我们的第一步是将任何业务逻辑从 `controller` 方法移动到用例处理器中。如果有六个 `controller` 方法处理工作流中的六步，这意味着我们现在将六个独立的用例处理器——即六个新类，每个用例处理器都是自己的
    `PHP` 类。


    人们常说，计算机科学中最难的三个问题是缓存失效、命名和差一错误。我们目前的问题是命名。


    所谓的“用例处理器”，诚然如此。Scott Millett 在《领域驱动设计的模式、原则和实践》（*Patterns, Principles, and Practices
    of Domain-Driven Design*）第 108 页中将用例处理器称为应用服务（Application Service）：


    > 应用服务层代表应用程序的用例和行为。用例被实现为应用服务，通过委托给领域层和基础设施层，包含应用逻辑来协调用例的实现。


    Scott 说得对。从现在起，我们将这个“东西”称为 `Application Service`。


    什么是 `Repository`？在此时，它仅仅是访问应用程序 `MySQL` 数据库的包装器。然而，它是非常具体的，没有以任何方式泛化。它满足了 `Application
    Service` 的特定需求*且不再多此*。正是这种限制使得 `Repository` 设计如此强大，但其原因目前超出了范围。


    ## 应用服务


    这是来自第一个工作流的 `Application Services` 之一。你会立即注意到那里基本上什么都没有！事实证明，这强大，并且符合 Millet 的陈述：应用服务层通过委托来协调用例。


    **Listing 1.**


    ```


    ```


    `Application Service` 包含三个方法，每个每个方法都委托给同名的 `Repository` 方法。这个 `Application Service`
    类仅仅是一个透传。


    对应的 `Repository` 看起来如下：


    **Listing 2.**


    ```


    ```


    最后一个方法带有 `try` / `catch` 包围的手动数据库事务，这与 2021 年 12 月在 php[architect] 的“为 MySQL 事务失败设计”中
    Listing 3 所解释的模式相。


    你可能注意到我们重新加载了要更新的数据库行。我们先加载一次，然后在 `MySQL` 事务内部再次加载。这是为了确保我们不会无意中存储过时数据，被另一个同时在犯相同错误的进程所“覆盖”。这个问题还有其他解决方案，例如在读取行时对该行进行锁定，但无论如何，这是一个重要的实践。


