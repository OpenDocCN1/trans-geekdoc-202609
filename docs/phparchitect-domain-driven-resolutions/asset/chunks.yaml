    I am a Freelancer providing services mainly around `PHP`, its core, and ecosystem.
    I am currently working on `Blackfire`’s `PHP` extension and as an IT architect
    for a Belgian company in the public sector. Previously I was a core developer
    of `eZ Publish/eZ Platform CMS` (now `Ibexa`).


    ## How much `PHP` coding do you do?


    It is pretty even between `PHP` and `C`, about 50% of each.


    ## How long have you been involved with `PHPInternals`?


    Probably something like 15 years when I started discussing on the `#internals`
    `PHP` mailing list. My first real practical involvement was in 2009, and this
    is when I got access (called internally “karma”) to `PHP`’s source code to contribute
    to `PHPT` tests that are part of `PHP`’s unit unit test suite. Later, I contributed
    with a patch to have “Array to string conversion” notices (now warnings) before
    `PHP` 5.4: that was silently converting it to string “array,” pretty useless and
    hiding a lot of possible bugs.


    ## What is it like being a release manager for `PHP`? What are the responsibilities?


    I would summarize it as watching the `CI`, preparing tag/tarballs/versions, and
    then announcing them.


    ## How has it been working with `Joe Watkins` through this process?


    `Joe` helped us with the questions that `Ben` or myself had, but another great
    resource that previous managers have contributed to is the various wiki pages
    about release management. This is the first time there have been 2 “new” release
    managers.


    ## What challenges do you see for `PHP` in the coming years?


    The desire, by some, of `PHP` being a stricter language, by some others, of being
    enriched with new features, and by yet others of keeping backward compatibility
    as much as possible is quite tough and often leads to passionate discussions.
    On the other side, the engine keeps getting more and more complex as new features
    get in. We are very lucky to have `Nikita Popov` and `Dmitry Stogov` aboard. Unfortunately,
    the number of people able to understand all the parts of the engine does not scale
    as much as its complexity.


    ## What tools do you use in your daily development workflow today?


    *   IDE: `Vim` and `JetBrains` (`PHPStorm` & `CLion`)

    *   OS: `Gentoo Linux`

    *   Shell: `bash`

    *   Debugging tools: `xdebug`, `gdb`, `strace/ltrace`, `Wireshark`, `inotify`
    tools

    *   Static analyzer: `Phan`

    *   VCS: `git`


    ## What are some of your proudest accomplishments or achievements?


    Getting the trust of `PHP internals` to be one of the Release Managers is quite
    a big thing for me. I am quite proud of it.


    ## Who, in any development community, do you look up to or inspire you, and why?


    `Rasmus Lerdorf`, `Nikita Popov`, `Derick Rethans` & `Sara Golemon` for their
    brilliant minds.


    ## Do you have any opinions about `PHP Frameworks`, and are there any you are
    interested in using or do use?


    `PHP Frameworks` are a bit incomparable to other languages “Web Frameworks.” With
    general-purpose languages such as `C#`, `C/C++`, `Java`, `Python`, `Ruby`, … there
    is no native “web” support at the level of the language itself. It usually relies
    on Web Frameworks for that. While some will advocate that `PHP` can be considered
    general-purpose, it is most famous and tailored towards web development.


    When dealing with the “web,” there are many different aspects:


    First, the `HTTP` protocol, when a `request` comes, `PHP` natively provides `$_GET`,
    `$_POST`, `$_COOKIE`, `$_FILES`, `$_SESSION`. While `PHP` can be considered general-purpose,
    it is most famous and tailored towards web development.


