    \ to provide more secure and isolated applications.\n"
  trans: "\n\n*   `KeepAliveTimeout` 的全局值（等待同一客户端在同一连接上发送另一个请求的秒数）\n*   Apache 运行的\
    \ Linux 用户和组（默认为 `www-data`）\n\n虽然 `apache2.conf` 看起来非常复杂，但当你查看没有大量注释块的默认配置时，它看起来并不那么令畏。参见列表\
    \ 2。\n\n**列表 2。**\n\n```\nDefaultRuntimeDir ${APACHE_RUN_DIR}\nPidFile ${APACHE_PID_FILE}\n\
    Timeout 300\nKeepAlive On\nMaxKeepAliveRequests 100\nKeepAliveTimeout 5\nUser\
    \ ${APACHE_RUN_USER}\nGroup ${APACHE_RUN_GROUP}\nHostnameLookups Off\nErrorLog\
    \ ${APACHE_LOG_DIR}/error.log\nLogLevel warn\nIncludeOptional mods-enabled/*.load\n\
    IncludeOptional mods-enabled/*.conf\nInclude ports.conf\n<Directory />\n    Options\
    \ FollowSymLinks\n    AllowOverride None\n    Require all denied\n</Directory>\n\
    \n<Directory /usr/share>\n    AllowOverride None\n    Require all granted\n</Directory>\n\
    \n<Directory /var/www/>\n    Options Indexes FollowSymLinks\n    AllowOverride\
    \ None\n    Require all granted\n</Directory>\n\nAccessFileName .htaccess\n<FilesMatch\
    \ \"^\\.ht\">\n    Require all denied\n</FilesMatch>\nLogFormat \"%v:%p %h %l\
    \ %u %t \\\"%r\\\" %>s %O \\\"%{Referer}i\\\" \\\"%{User-Agent}i\\\"\" vhost_combined\n\
    LogFormat \"%h %l %u %t \\\"%r\\\" %>s %O \\\"%{Referer}i\\\" \\\"%{User-Agent}i\\\
    \"\" combined\nLogFormat \"%h %l %u %t \\\"%r\\\" %>s %O\" common\nLogFormat \"\
    %{Referer}i -> %U\" referer\nLogFormat \"%{User-agent}i\" agent\nIncludeOptional\
    \ conf-enabled/*.conf\nIncludeOptional sites-enabled/*.conf\n```\n\n## 默认主机配置\n\
    \n我们可以看到，默认启用了两个站点：`000-default.conf` 和 `default-ssl.conf`。这些文件共同包含了从 `/var/www/html`\
    \ 路径提供基础站点的指令。虚拟主机配置默认将继承整个 Apache 配置。虚拟主机是针对从 Apache 服务的网站和应用的特定配置。我们可以使用 `sudo\
    \ vim /var/www/html/info.php` 创建一个新的 PHP 文件并粘贴 `<? phpinfoinfo();`。保存文件（`:wq`\
    \ 或 `:x`）并访问 `http://localhost/info.php`，你将看到类似于 PHP 版本 7.4.3 信息页的内容。\n\n![php-info-page.png](img/file31.png)\n\
    \nphp-info-page.png\n\nPHP 信息页\n\n虽然 PHP 7.4 是一个很好的发行版本，但在 2021 年它已经有些旧了。我们应该使用\
    \ [Ondřej Surý 的](https://deb.sury.org) 私有包存档 (PPA) 来安装更高版本的 PHP。要添加该 PPA，我们将运行\
    \ `sudo add-apt-repository ppa:ondrej/php`，这会将 Ondřej 的仓库添加到我们的系统中。要在当前配置中安装 PHP\
    \ 8.1，我们可以运行 `sudo apt install -y php8.1 libapache2-mod-php8.1 php8.1-xml`。在启用新的\
    \ PHP 版本后，我们可以使用 `sudo a2mod php7.4` 禁用 Apache 中的 PHP 7.4，并使用 `sudo a2enmod php8.1`\
    \ 为 Apache 启用 PHP 8.1。要应用 PHP 更改，运行 `sudo service apache2 restart`，我们可以刷新浏览器窗口中的\
    \ `http://localhost/info.php` 来看到我们现在正在运行 PHP 8.1。重要提示：我们正在利用 Apache 模块 `mod_php_2725`\
    \ 来运行 PHP；这意味着我们一次只能运行一个 PHP 版本。要让 Apache 运行多个 PHP 版本，我们需要安装并配置 [PHP-FPM](https://www.php.net/manual/fpm)，我们将在将来介绍。使用\
    \ `mod_php` 时，我们将 PHP 封装在 Apache 内部。例如，FPM 是一个外部（相对于 Apache）的服务，通常通过 socket 连接。要为我们的本地开发站点创建一个自签名证书，我们使用\
    \ `sudo openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout /etc/ssl/private/apachesigned.key\
    \ -out /etc/ssl/certs/apachesigned.crt`。为了跨网络使用（即一旦你不在本地机器上），你将希望使用 [Let’s Encrypt](https://www.letsencrypt.org)。\n\
    \n"
