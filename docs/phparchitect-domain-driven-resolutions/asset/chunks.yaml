    Morris Worm took down the Internet, November 1988. He was teaching CRAY-1 supercomputer
    operating system internals to analysts as they were being directly hit by the
    Worm. It was a busy week! Ed continues to indulge his interests in computer security
    and teaching software concepts to others. [@ewbarnard](https://twitter.com/ewbarnard)


    # Security Corner: The Terrifying Scale of a Security Bug


    ### By Eric Mann


    > A remote code execution vulnerability discovered in the widely used Log4J library
    exposed billions of machines to malicious actors in December. Unfortunately, fixing
    this bug was not straightforward and left much of the Internet exposed to bad
    actors for over a week.


    In mid-November, a security researcher with [Alibaba’s Cloud Security team](https://www.mcafee.com/blogs/?p=133000)
    identified a flaw in the popular Log4J library, a tool used by most Java developers
    to implement logging in their application. The bug itself allowed an attacker
    to inject a string of their own choosing into the Java Naming and Directory Interface
    (JNDI) component of the Java runtime. This interface will attempt to resolve the
    string passed in, in some cases looking up additional information over DNS or
    by executing code provided as part of the input string.


    Said more simply—any application logging web requests with a vulnerable version
    of Log4J allowed a remote, unauthenticated attacker to execute whatever commands
    they wanted on the application server. The worst possible outcome of any bug.
    Or, in the words of Amit Yoran, CEO of cybersecurity company Tenable,


    > It is by far the single biggest, most critical vulnerability ever.


    Injection attacks are very common in modern software. They’re so common in fact
    that the Open Web Application Security Project (OWASP) [considers them the third
    most frequently seen](https://owasp.org/Top10/A03_2021-Injection/) category of
    application security risks in the market. An injection vulnerability occurs any
    time untrusted user input is passed directly to a critical component of an application—like
    to the data layer (SQL) or to business logic that attempts to resolve a system
    name (JNDI).


    ## The Scope of the Incident


    [The initial security report](https://nvd.nist.gov/vuln/detail/CVE-2021-44228)
    included all versions of Log4J through version 2.14.1. Given the trivial nature
    of the exploit itself—attackers were able to remotely execute code on Minecraft
    servers by pasting a string in the-game chat](https://twitter.com/MalwareTechBlog/status/1469290238702874625)—the
    community moved rapidly to patch the issue.


    Perhaps too rapidly.


    [Log4J 2.15.0 rolled out](https://us-cert.cisa.gov/node/17179) the same day the
    original exploit was documented publicly. It was a Friday afternoon, but many
    engineers worked late into the evening (or through the weekend) to patch their
    applications.


    Unfortunately, the fix was incomplete. Just days later, researchers [discovered
    another (related) vulnerability](https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2021-45046).
    Many non-default configurations would allow for further exploitation of the underlying
    bug. This could still allow for information leaks (the exfiltration of environment
    secrets), remote code execution, or even denial of service attacks. The engineers,
    just as quickly, launched Log4J 2.17.0](https://phpa.me/techtarget-log4J), containing
    all the previous fixes, and is thought to be secure as of this writing.

