  trans: "\n\n> ![Joe Ferguson](img/file33.jpg)Joe Ferguson 是一位 PHP 开发者和社区组织者。他参与了孟菲斯许多与技术相关的倡议，包括孟菲斯\
    \ PHP 用户组。他与非常支持他且极其迷人的妻子已经结婚多年，是妻子把他变成了一个狂热猫奴。他们和他们的两只猫住在孟菲斯的郊区。[@JoePFerguson](https://twitter.com/JoePFerguson)\n\
    \n# 此处有巨龙：转向领域驱动设计\n\n### 作者：Edward Barnard\n\n> 我们将从简单的重构开始对领域驱动设计进行实现。我们将仔细观察预期的实现中可能隐藏着何种复杂性。这种观察将指导我们向领域驱动设计方向进行重构。\n\
    \n## 实现“驯服巨龙”模式（Dragon Wrangling Pattern）\n\n为什么要在你的 PHP 项目中转向领域驱动设计？对于现有的代码库，当代码变得脆弱到无法触碰、更改成本太高时，是时候问问这个问题了。我把这称为“撞墙”，因为继续前进已变得异常困难。在此时，我们作为\
    \ PHP 开发者，我们需要同时解决两个问题：\n\n1. 由于添加或更改功能的困难和危险性，我们不愿触碰代码。在此过程中破坏某些东西的风险实在太高了。\n\
    2. 我们需要引入新开发者，而对项目不熟悉的人员并不知道深埋在复杂代码库中的陷阱。\n\n我在 2021 年 10 月的 php[architect] 中建议了一个解决方案，即“驯服巨龙模式”。现在是时候在实际项目中开始实现该模式了。这篇文章假设你能够回溯并查看该模式背后的逻辑和动机。\n\
    \n## 运动员注册\n\n我们的项目将实现两个涉及高中中运动员的具体工作流：\n\n* 创建在线账户\n* 注册参加特定赛季的比赛\n\n我的公司美国胶靶射击联盟（USA\
    \ Clay Target League）是一家非营利机构，促进与散弹枪向胶靶射击相关的运动（陷形 Trap、飞靶 Skeet、五点 5-Stand 和运动胶靶）。我们创建了一种机制，让队伍在赛季期间无需面对面即可进行竞争。\n\
    \n你可以这样考虑：想象一个在自己的主保龄球场进行比赛的保龄球联赛。另一个队伍在不同的地点进行比赛，他们都提交分数。我们假设任何特定的保龄球道与任何其他保龄球道设置都是相同的。例如，某人得\
    \ 90 分应该和在另一个地点得 90 分的人是一致的。在比较或合并分数时，可以说我们是在进行“苹果与苹果的比较”。\n\n胶靶射击也是如此。每个靶场都有相同的设置和布局。我们假设一个地点的得分等同于另一个地点的得分。我们忽略了风和天气在一天之间会产生重大影响的事实。那是乐趣的一部分！\n\
    \n评分非常简单——就像保龄球一样。在保龄球中，每个木瓶要么还立着，要么被击倒。不需要考虑“难度系数”或“艺术表现”。在陷形射击中，一枪要么击碎胶靶，要么没有击碎。\n\
    \n机制非常简单。这应该让它们很容易实现，对吧？遗憾的是，没那么简单！\n\n事实证明，我们实际上无法忽略天气。冬末的风暴可能意味着靶场仍然需要清理并恢复运行。在更南方，热带风暴可能会阻止某个队伍在该周参加比赛。事实上，我们有业务规则来延迟某个州赛季的开始，同时允许受不可抗力（如飓风）影响的个人队伍进行补赛。\n\
    \n换句话说，即使是操作性的评分系统也包含了足够的复杂性，以至于我们应该考虑领域驱动设计。\n\n然而，在比赛之前，我们首先需要组建队伍。我们将以此为关注上述两个工作流（创建账户和赛季注册）。\n\
    \n我将向你展示一个极其简单的模式，以至于它看起来可能是无意义且浪费精力的。但我们也将看到它的力量。它是有效的！\n\n让我们花时间理解我们正在试图解决的问题。让我想起那个老笑话：“我们刚接了一个新项目！你们两个开始写代码吧，我去去找需求。”不要采取那种方法！随着我们对问题的了解，我们将仔细记录复杂性可能隐藏在何处。\n\
    \n 创建在线账户\n\n对于美国胶靶射击联盟，每位运动员都必须创建一个在线账户。此外，每个运动员账户必须绑定到一个队伍。但是，运动员必须先拥有账户，队伍才能邀请该运动员。我们面临“鸡生蛋还是蛋生鸡”的问题。我们的解决方案是：\n\
    \n1. 队伍必须存在。\n2. 队伍邀请运动员使用该队伍的“密钥”创建账户。该“密钥”就像一个优惠码。它可以通过纸质发放，也可以通过电子邮件发送。\n3.\
    \ 运动员创建账户。\n4. 队伍（即：教练）随后邀请运动员参加一个或多个特定项目（陷形、飞靶等）的赛季。\n5. 运动员接受邀请并注册（以及支付）赛季费用。\n\
    \n上述第 3 步（创建账户）的工作流看起来非常简单。\n\n1. 输入密钥、姓名和出生日期。我们的许多业务规则是基于年龄的，因此我们立即需要出生日期。\n\
    2. 设置登录，包括用户名和密码。根据年龄（18 岁以下、13 岁以下等），我们可能需要或不需要电子邮件地址。\n3. 收集监护人信息（如果运动员 18 岁或以上）和紧急联系人。\n\
    \n这是一个简单的工作流，但某些要求的选择取决于年龄和某些其他因素。因此，我们有一些必须处理的复杂性。但到目前为止，这看起来还没有复杂到足以让我们走向领域驱动设计。\n\
    \n 赛季注册\n\n赛季注册的大部分是一个简单的工作流。输入人口统计信息，例如年级、枪支安全证书编号和完成日期等。\n\n突然，实现变得复杂了。哎！问题在哪里？我们可以简化它吗？\n\
    \n这里是变量：\n\n* 我们是一家非营利机构，我们允许运动员在赛季注册期间包含捐款。\n* 赛季费用可以是“运动员支付”或“队伍支付”。对于队伍支付，一旦注册关闭，学校队伍根据实际注册情况支付一张发票。对于运动员支付，运动员在赛季注册期间支付费用。\n\
    * 运动员可能被邀请参加一个或最多四个四个项目。每个项目的费用相同。如上所述，费用由队伍或运动员支付。\n* 运动员不需要一次性选择所有邀请。例如，如果被邀请参加陷形和飞靶，运动员可以现在注册飞靶，以后再回来注册陷形。\n\
    \n因此，我们的用例数量是（运动员支付或队伍支付）乘以（有或无捐款）乘以（接受零到最多四个邀请）乘以（可能多次进入赛季注册）。\n\n"
