    ## 结论


    在本文中，你学习了集合、通用的迭代器（Iterators），特别是 FilterIterators。


    虽然在 PHP 中使用集合以及通来说的高级数据结构并不是非常常见的做法，但有很多新颖有趣的工具可供你利用，特别是当你保持 PHP 版本更新时。


