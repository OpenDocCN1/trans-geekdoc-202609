    通常情况下，PHP 数组就能胜任，这一点无需置疑。但如果你想让代码更轻松地反映你的思路，依赖专门的结构将非常有帮助。


    这篇文章将向你展示我为了简单起见实现的 `Collection`。或者，从 PHP 7 版本开始，PHP 通过其 [DS 扩展](https://www.php.net/book.ds)
    提供了一个非常好的实现。如果你还不熟悉它，我建议你查看一下。


    ## 什么是迭代器 (Iterator)？


    `Iterator` 是一个 `Object`，其唯一职责是通过特定的算法遍历 `Collection` 中包含的元素。`Iterator` 不应该修改底层
    `Collection`，而是仅仅作为一个观察者对其操作。在 PHP 中，`Iterators` 是作为 [SPL 扩展](https://www.php.net/spl.iterators)
    的一部分，我将在下面的代码示例中使用它。


    ## 为什么需要迭代器？


    我们使用 `Iterators` 是为了将存储与元素的迭代分离开。从某种意义上说，这是尝试遵守单一职责原则（[SOLID](https://www.thinktocode.com/?p=47)
    中的 `S`）。


    想象一个复杂的 `Collection`，例如树或图。在这种类结构中，有很多方法可以遍历元素。例如，你可以有一个方法以广度优先搜索的方式返回 `Collection`
    的下一个元素，然后另一个方法以深度优先搜索的方式返回。接着，稍后，你可能需要按数字升序遍历元素，而且既然都做在这里了，为什么不再实现另一个按创建顺序遍历集合的器呢？


    如果你遵循这条路径，你很快就会发现自己经常频繁地修改 `Collection` 类。如果你想保持 Bug 数量在低水平，这绝对不是一个好主意。


    这正是 `Iterators` 要解决的问题：它们提供了一种整洁的方式来创建新的循环机制，而无需更改处理内存组织等代码。


    当需要新的迭代标准时，你只需要组合一个全新的 `Iterator` 类，你的应用程序的其他部分就可以保持不变。


    如果你想更深入地了解这些概念，我建议阅读这篇关于 [Iterators](https://phpa.me/refactoring-guru-iterator)
    的优秀文章。


    ## 不同类型的迭代器


    对于给定的 `Collection`，可以创建[许多类型的迭代器](https://www.php.net/spl.iterators)。让我们快速看看其中一些：


    *   [AppendIterator](https://www.php.net/class.appenditerator)。该类允许以顺序方式组合 `Iterators`（当一个
    `Iterator` 到达底层集合的末尾时，循环将继续到下一个，直到所有迭代器都被消耗完毕）。

    *   [InfiniteIterator](https://www.php.net/class.infiniteiterator)。该类用于产生循环迭代：当到达循环末尾时，`Iterator`
    会自动回回，因此始终有下一个元素。

    *   [LimitIterator](https://www.php.net/class.limititerator)。该类用于遍历 `Collection`
    元素的某个固定子集。


    所有这些都是 `Iterators` 的示例，它们可以与其他器组合，从而构建复杂的迭代逻辑。特定的 `Iterators` 专为文件系统设计，例如 [DirectoryIterator](https://www.php.net/class.directoryiterator)
    及其家族。


    除了这些之外，如果你发现需要组合更具体的迭代算法，也可以创建自己的迭代器。


    ### 过滤迭代器 (Filteriterators)


    一种特别有的 `Iterator` 类型是 [FilterIterator](https://www.php.net/class.filteriterator)。


    该类设计用于遍历 `Collection` 元素的子集。然而，与 `LimitIterator` 不同，子集不是固定的而是动态的。`LimitIterator`
    元素是通过对每个元素应用过滤函数并保留结果为 true 的元素来选择的。


    `FilterIterator` 不直接作用于集合。相反，它利用一个预存在的 `Iterator` 来访问元素，它是另一个组合 `Iterator`。


    回到我们的图示例，假设你已经实现了一个广度优先搜索 `Iterator`，现在你想处理这些节点中的特定集合。实现这一点的良好方法是设计一个 `FilterIterator`
    然后将其与图一起使用。


    ## 一个真实的应用案例


    最近，我从一个我指导的程序员那里收到了这封邮件：


    > 嗨 Mauro，

    >

    > 好久不见，希望你一切都好？

    >

    > 我有一个需要用 SOLID 原则解决的 PHP 编程挑战，而且我觉得这涉及到 PHP 的 `Iterator` 类，我不熟悉它。你能帮帮我吗？

    >

    > 希望你能帮帮我。我真的需要理解解决这个问题的最佳方法。


    要解决的问题描述如下：


    > 你的任务是创建一个 CLI 脚本，通过 HTTP 从特定端点读取基于 JSON 的数据。该脚本将包含几个子命令，用于过滤和输出加载的数据。命令应为：

    >

    > 按价格范围查找对象（给定 `price_from` 和 `price_to` 作为参数）。按特定的子对象定义查找对象。所有给定的子命令应只输出库存中的数量。

    >

    > 技术要求：

    >

    > 为获取 JSON HTTP 端点实现 `ReaderInterface`，从而在加载的数据上与 `OfferCollectionInterface` 和
    `OfferInterface` 一工作。


    列表 1 显示了我为了解决这个问题并帮助我的学生理解底层概念而编写的[一个小脚本](https://github.com/mchojrin/HTTPJsonFilter)。


    我将介绍它的主要部分，以向你展示如何在 PHP 中实现 `FilterIterator`。让我们从主脚本开始，即列表 1 所示的 `run.php` 文件。


    **列表 1。**


    ```

    ```

    ```


    在这里你可以看到脚本如何：


    1.  通过调用 `spl_autoload_register` 引入了一个非常简单的自动加载函数。这样做目的是为了防止在代码的其他部分显式要求支持类。

    2.  通过 `HTTPReader` 实例创建一个 `Product` 集合。`HTTPReader` 的目标是从从外部端点收集的文本应用 `json_decode`
    的结果创建一个新的 `Collection`。

    3.  通过调用函数 [iterator_count](https://www.php.net/function.iterator-count) 并向其传递
    `Iterator`，输出符合命令行参数指定的 `Collection` 中的元素数量。


    最后一点是我希望你关注的重点。注意根据指定的子命令，在原始 `Iterator` 之上使用了特定的 `FilterIterator` 子类。


    列表 2 显示了 `PriceFilterIterator` 的代码。


    **列表 2。**


    ```

    ```


    该类有两个方法：


    *   构造函数

    *   `accept`


    `accept` 是该类最重要的部分，因为它是存储实际过滤逻辑的地方。在特定情况下，判断产品是否应属于迭代的方法是检查其价格是否在既定边界内。


    这些边界是在创建 `Iterator` 实例时定义的。它们是构造方法的参数。


    每个 `FilterIterator` 的工作方式如下：对底层 `Iterator` 生成的每个元素调用 `accept` 方法，如果评估结果为布尔 `true`，则该元素将被视为循环的一部分；否则，将被跳过。


    现在看列表 3 所示的 `VendorIdFilterIterator` 类。


    **列表 3。**


    ```

    ```


    结构几乎相同。唯一的显著区别是 `accept` 方法的定义，在这种情况下，它将供应商 ID 与构造时建立固定值进行比对。


    由于这只是一个模拟，这个概念验证项目包含一个名为 `output_json.php` 的脚本（列表 4），它将产生另一端预期的 JSON 输出。


