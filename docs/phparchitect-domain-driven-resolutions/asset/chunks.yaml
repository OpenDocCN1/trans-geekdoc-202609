- raw: "Here’s an example of why this matters: I once went into a conversation with\
    \ a mentor on a day when we were scheduled to discuss an upcoming project. My\
    \ mentee started by saying, “I’m sure you’re excited about the new project!” I\
    \ was actually terrified about it, and then I felt that because my mentee assumed\
    \ that I should have been excited, I was hesitant to share my true feelings about\
    \ the project with her. On the other hand, if the conversation had started by\
    \ giving me the opportunity to share my feelings first, I most likely would have\
    \ felt comfortable enough to tell her about my anxiety around the project.\n\n\
    Sentence starters to use in the clarifying phase of communication include:\n\n\
    *   “What do you mean by…?”\n\n*   “Can you tell me more about…?”\n\n*   “How\
    \ do you feel about…?”\n\n**Strategy #4: Give your mentee feedback that is specific\
    \ and actionable.**\n\nWhen I was completing my teacher residency program, I had\
    \ to participate in daily debrief sessions with my mentor and coach. We would\
    \ review the lessons that I had taught, discuss what went well and what could\
    \ have gone better, and determine areas to focus on for the future. Over the course\
    \ of the school year, I built a great rapport with my mentor and coach and truly\
    \ came to value the feedback that they shared with me.\n\nHowever, during one\
    \ phase of the program, I was temporarily assigned to another school, where I\
    \ had to debrief with a different coach. Her role in mentoring me was intended\
    \ to be the same as the others, but unfortunately, her feedback was nowhere near\
    \ as helpful. I’ll never forget the feedback she gave to me one afternoon, which\
    \ was the most unhelpful and unactionable feedback that I have ever received in\
    \ my career: “Olivia, you need to fix your face.”\n\nAfter I got past my initial\
    \ shock and asked the coach to explain what she meant by that, she told me that\
    \ in her opinion, I wasn’t looking happy while teaching my lesson that day, and\
    \ so she felt that I needed to smile more. The real takeaway that I got from this\
    \ had nothing to do with my facial expressions and everything to do with actually\
    \ how to give helpful advice to a mentee.\n\nFirst, you want to ensure that your\
    \ feedback is specific. The “fix your face” advice that I described above is an\
    \ example of vague advice that was overwhelmingly vague and discouraging. However,\
    \ even positive and encouraging feedback can still be vague and unhelpful. For\
    \ instance, if you have ever been given feedback along the lines of “Good job!”\
    \ or “Keep up the great work!”, you might have felt good about yourself at the\
    \ moment, but then later wondered what exactly it was that you did in the past\
    \ that you should apparently still be doing. Thus, making your feedback specific\
    \ can help your mentee precisely understand what they should be doing.\n\nNext,\
    \ providing actionable feedback can help your mentee comprehend why they should\
    \ do something in a certain way. Doing so provides reinforcement for them to reflect\
    \ back on the rationale for taking the actions that you are suggesting.\n\nSuppose\
    \ that you and your mentee are working on a code review, and you need to give\
    \ them feedback. An example of unspecific and unactionable feedback might be:\
    \ “Good job, this looks really great.” By comparison, an example of specific and\
    \ actionable feedback could be:\n\n*   “You did well at \\_\\_\\_\\_. This is\
    \ great to keep doing because…”\n\n*   “In the future, consider doing \\_\\_\\\
    _\\_\\_ because…”\n\nBy receiving feedback in this format, you empower your mentee\
    \ to improve in the areas that you have suggested and continue coming back to\
    \ you for additional recommendations.\n\n**Strategy #5: Teach your mentee how\
    \ to take ownership of the mentoring relationship.**\n\nAs a mentor, it’s a natural\
    \ feeling to want to go above and beyond for your mentees and to do all that you\
    \ can to help them succeed. Knowing when to step back and allow my mentees to\
    \ take more of the reins was actually one of the areas that I most struggled with\
    \ in my earliest years of mentoring. I didn’t realize at the time that as much\
    \ as I was working with my mentees to improve their technical, leadership, and\
    \ overall career skills, I also had the valuable opportunity to teach them how\
    \ to become a mentor someday themselves.\n\nDetermining exactly how to give your\
    \ mentee more chances for ownership can vary, depending on the particular setup\
    \ of your mentoring relationship and their individual work experience. For example,\
    \ when I have mentored employees who were at the beginning of their careers working\
    \ in their first full-time job, part of giving them more ownership involved tasking\
    \ them with creating the calendar invitations for our meetings, setting the meeting\
    \ agendas, etc. For more seasoned employees, I challenged them to identify the\
    \ metrics that they wanted to associate with their short-term and long-term mentoring\
    \ goals.\n\nAs part of this strategy, you should also make sure to provide specific\
    \ and actionable feedback as your mentee learns how to take on more responsibilities,\
    \ even for the smallest tasks. Leading by example and providing ongoing feedback\
    \ can help enable you to become a more effective mentor and also show your mentee\
    \ how to do the same thing themselves.\n\nWhen I reflect back on the phone call\
    \ in which the residency program director invited me to pursue a path towards\
    \ mentoring, I wonder how differently things might have gone if I had been given\
    \ the tools to help me feel equipped to take on such a momentous task. Although\
    \ I was afraid to become a mentor at the time, I eventually went on to become\
    \ the chairperson for my teacher residency program’s alumni network. In this role,\
    \ I’ve advocated for opportunities for my fellow alumni to give back and share\
    \ their knowledge, particularly through mentoring.\n\nPerhaps the most important\
    \ thing that I’ve learned about becoming an effective mentor is that this sort\
    \ of transformation doesn’t happen overnight. It’s a lifelong journey, filled\
    \ with endless chances to learn more, improve over time, and help make a positive\
    \ impact on others.\n\n> ### Biography\n\n> \n\n> ![Olivia Liddell](media/file26.jpg)Olivia\
    \ Liddell is a Technical Curriculum Developer at Amazon Web Services. Over the\
    \ course of her career, she has created innovative teaching and technical training\
    \ solutions for learners from diverse backgrounds and skill levels.\n\nA Certified\
    \ Ethical Hacker, Olivia frequently speaks on topics such as social engineering\
    \ and security awareness. In her spare time, she enjoys distance running, studying\
    \ linguistic anthropology, and developing web applications for Arabic language\
    \ learners. [@oliravi](https://twitter.com/oliravi)\n\n# Introducing FilterIterators\n\
    \n###### By Mauro Chojrin\n\n> Iterators over collections provide a clean separation\
    \ of concerns. Filter Iterators are a great way to abstract the logic of your\
    \ selecting sub-sets of Collections elements.\n\n## Introduction\n\nThis article\
    \ will provide an overview of what Collections are and why you should prefer them\
    \ to plain PHP arrays. Then I’ll focus on one particular aspect of working with\
    \ Collections: filtering elements. You’ll have the opportunity to see an implementation\
    \ of the concepts discussed in the context of a coding challenge issued as part\
    \ of an actual technical interview. By reading this article, you’ll learn how\
    \ to structure your code to better prepare for eventual requirement changes.\n\
    \n## Setting the Ground\n\nBefore jumping into the details, it makes sense to\
    \ take a moment to explore some basic concepts, namely Collections and Iterators.\n\
    \n### What is a Collection?\n\nA Collection is basically a set of objects stored\
    \ together in memory. The simplest form of a Collection is an Array or a LinkedList.\
    \ These are simple in the sense that elements are stored in a linear sequence,\
    \ thus making the iteration over them trivial: when you’re processing an element\
    \ there’s no doubt about which one comes next."
  fmt: '

    Here’s an example of why this matters: I once went into a conversation with a
    mentor on a day when we were scheduled to discuss an upcoming project. My mentee
    started by saying, “I’m sure you’re excited about the new project!” I was actually
    terrified about it, and then I felt that because my mentee assumed that I should
    have been excited, I was hesitant to share my true feelings about the project
    with her. On the other hand, if the conversation had started by giving me the
    opportunity to share my feelings first, I most likely would have felt comfortable
    enough to tell her about my anxiety around the project.


    Sentence starters to use in the clarifying phase of communication include:


    * “What do you mean by…?”

    * “Can you tell me more about…?”

    * “How do you feel about…?”


    ### Strategy #4: Give your mentee feedback that is specific and actionable.


    When I was completing my teacher residency program, I had to participate in daily
    debrief sessions with my mentor and coach. We would review the lessons that I
    had taught, discuss what went well and what could have gone better, and determine
    areas to focus on for the future. Over the course of the school year, I built
    a great rapport with my mentor and coach and truly came to value the feedback
    that they shared with me.


    However, during one phase of the program, I was temporarily assigned to another
    school, where I had to debrief with a different coach. Her role in mentoring me
    was intended to be the same as the others, but unfortunately, her feedback was
    nowhere near as helpful. I’ll never forget the feedback she gave to me one afternoon,
    which was the most unhelpful and unactionable feedback that I have ever received
    in my career: “Olivia, you need to fix your face.”


    After I got past my initial shock and asked the coach to explain what she meant
    by that, she told me that in her opinion, I wasn’t looking happy while teaching
    my lesson that day, and so she felt that I needed to smile more. The real takeaway
    that I got from this had nothing to do with my facial expressions and everything
    to do with actually how to give helpful advice to a mentee.


    First, you want to ensure that your feedback is specific. The `fix your face`
    advice that I described above is an example of vague advice that was overwhelmingly
    vague and discouraging. However, even positive and encouraging feedback can still
    be vague and unhelpful. For instance, if you have ever been given feedback along
    the lines of “Good job!” or “Keep up the great work!”, you might have felt good
    about yourself at the moment, but then later wondered what exactly it was that
    you did in the past that you should apparently still be doing. Thus, making your
    feedback specific can help your mentee precisely understand what they should be
    doing.


    Next, providing actionable feedback can help your mentee comprehend why they should
    do something in a certain way. Doing so provides reinforcement for them to reflect
    back on the rationale for taking the actions that you are suggesting.


    Suppose that you and your mentee are working on a code review, and you need to
    give them feedback. An example of unspecific and unactionable feedback might be:
    “Good job, this looks really great.” By comparison, an example of specific and
    actionable feedback could be:


    * “You did well at \_\_\_\_. This is great to keep doing because…”

    * “In the future, consider doing \_\_\_\_\_ because…”


    By receiving feedback in this format, you empower your mentee to improve in the
    areas that you have suggested and continue coming back to you for additional recommendations.


    ### Strategy #5: Teach your mentee how to take ownership of the mentoring relationship.


    As a mentor, it’s a natural feeling to want to go above and beyond for your mentees
    and to do all that you can to help them succeed. Knowing when to step back and
    allow my mentees to take more of the reins was actually one of the areas that
    I most struggled with in my earliest years of mentoring. I didn’t realize at the
    time that as much as I was working with my mentees to improve their technical,
    leadership, and overall career skills, I also had the valuable opportunity to
    teach them how to become a mentor someday themselves.


    Determining exactly how to give your mentee more chances for ownership can vary,
    depending on the particular setup of your mentoring relationship and their individual
    work experience. For example, when I have mentored employees who were at the beginning
    of their careers working in their first full-time job, part of giving them more
    ownership involved tasking them with creating the calendar invitations for our
    meetings, setting the meeting agendas, etc. For more seasoned employees, I challenged
    them to identify the metrics that they wanted to associate with their short-term
    and long-term mentoring goals.


    As part of this strategy, you should also make sure to provide specific and actionable
    feedback as your mentee learns how to take on more responsibilities, even for
    the smallest tasks. Leading by example and providing ongoing feedback can help
    enable you to become a more effective mentor.

    '
  trans: '

    这是一个说明为什么这重要的例子：有一次，我要和一位导师进行对话，那天我们计划讨论一个即将开展的项目。我的教徒一开头就说：“我确定你对这个新项目很兴奋吧！”实际上我对它感到非常恐惧，接着我觉得，因为我的教徒假设我应该很兴奋，导致我犹豫于向她分享我对该项目的真实感受。另一方面，如果对话开始时是先让我有机会分享自己的感受，我很可能会感到足够放松，从而告诉她我对该项目的焦虑。


    在沟通的澄清阶段可以使用的句开头包括：


    * “你说的……是什么意思？”

    * “你能多告诉我关于……的信息吗？”

    * “你对……感觉如何？”


    ### 策略 #4：为你的教徒提供具体且可操作的反馈。


    当我完成教师驻留计划时，我必须与导师和教练参加每日的总结会议。我们会回顾我教的课程，讨论哪些地方做得好，哪些地方可以做得更好，并确定未来需要关注的领域。在整个学年里，我与导师和教练建立了良好的关系，并真正开始重视他们和我分享的反馈。


    然而，在计划的一个阶段，我被临时分配到另一所学校，在那里我与一位不同的教练进行总结。她指导我的角色本应和其他人一样，但遗憾的是，她的反馈远没有那么有帮助。我永远不会忘记某个下午她给我的反馈，那是我职业生涯中收到的最没用且不可操作的反馈：“奥莉维亚，你得修一下你的脸表情。”


    在平复了最初的震惊并要求教练解释她的意思后，她告诉我，在她看来，我那天教课时看起来并不开心，所以她觉得我需要多微笑。我从中从中获得的真正启示与我的面部表情无关，而与实际上如何向教徒提供有帮助的建议有关。


    首先，你想要确保你的反馈是具体的。我上面描述的 `fix your face`（修一下你的脸）建议就是一个极其模糊且令人沮丧的模糊建议示例。然而，即使是积极和鼓励性的反馈也仍然可能是模糊且无用的。例如，如果你收到过诸如“干得好！”或“继续保持良好！”之类的反馈，你可能在那一刻感觉很良好，但随后又会怀疑自己过去到底做对了什么现在显然应该继续做。因此，让你的反馈变得具体可以帮助你的教徒精确地理解他们应该做什么。


    接下来，提供可操作的反馈可以帮助你的教徒理解他们为什么要以某种特定的方式做某事。这样做可以强化他们去反思你所建议采取这些行动的逻辑。


    假设你和你的教徒正在进行代码审查，你需要给他们提供反馈。一个不具体且不可操作的反馈示例可能是：“干得好，这看起来真的很棒了。”相比之下，一个具体且可操作的反馈示例可以是：


    * “你在 \_\_\_\_ 方面做得很好。这非常值得保持，因为……”

    * “在将来，考虑做 \_\_\_\_\_\_ ，因为……”


    通过接收这种格式的反馈，你赋予了教徒在你所建议的领域进行改进的能力，并让他们继续向你寻求额外的建议。


    ### 策略 #5：教你的教徒如何承担导师关系的主导。


    作为导师，想要为你的教徒付出额外努力并尽一切努力帮助他们成功是一种自然的感觉。知道何时退后并让我的教徒承担更多的主导权，实际上是我在指导生涯早期几年中最努力挣扎的领域之一。我当时没有意识到，当我努力帮助教徒提高他们的技术、领导力和整体职业技能时，我也拥有一个宝贵的机会，教他们将来如何自己成为导师。


    具体确定如何给你的教徒更多承担主导机会会有所不同，取决于你们导师关系的特定设置以及他们的个人工作经验。例如，当我指导那些处于职业生涯初期、从事第一份全职工作的员工时，给予他们更多主导权的一部分包括要求他们创建会议的日历邀请、设定会议议程等。对于更有经验的员工，我会挑战他们去识别他们想要与短期和长期指导目标相关的衡量指标。


    作为这一策略的一部分，当你的教徒学习如何承担更多责任时，你也应该确保提供具体且可操作的反馈，即使对于最小的任务也是如此。以身作则并提供持续的反馈可以帮助你成为更有效的导师。

    '
