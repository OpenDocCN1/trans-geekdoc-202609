- raw: '> ![Joe Ferguson](media/file33.jpg)Joe Ferguson is a PHP developer and community
    organizer. He is involved with many different technology related initiatives in
    Memphis including the Memphis PHP User group. He’s been married to his extremely
    supportive and amazing wife for a really long time and she turned him into a crazy
    cat man. They live in the Memphis suburbs with their two cats. [@JoePFerguson](https://twitter.com/JoePFerguson)


    # Here Be Dragons: Turning to Domain-Driven Design


    ###### By Edward Barnard


    > We begin our implementation of Domain-Driven Design with simple refactoring.
    We’ll take a close look at what complexity might be hidden within the expected
    implementation. That observation will guide us in refactoring toward Domain-Driven
    Design.


    ## Implementing the Dragon Wrangling Pattern


    Why turn to Domain-Driven Design in your PHP project? With an existing codebase,
    it’s time to ask that question when the code has become too fragile to touch and
    too costly to change. I call this “hitting the wall” because it has become so
    difficult to move forward. At this point, we, as PHP developers, need to solve
    two problems simultaneously:


    1.  We are reluctant to touch the code at all because of the difficulty and danger
    of adding or changing features. The risk of breaking something along the way is
    simply too high.


    2.  We need to onboard newer developers or persons new to the project are unaware
    of the pitfalls buried in the complex codebase.


    I suggested a solution, the Dragon Wrangling Pattern, in the October 2021 php\[architect\].
    It’s time to begin implementing that pattern in an actual project. This article
    assumes you’re able to go back and review the reasoning and motivations behind
    this pattern.


    ## Athlete Registration


    Our project will be implementing two specific workflows involving high school
    athletes:


    *   Create an online account


    *   Register to compete during a particular season


    My company, the USA Clay Target League, is a non-profit corporation that facilitates
    sports related to shooting at clay targets with a shotgun (Trap, Skeet, 5-Stand,
    and Sporting Clays). We have created a means for teams to compete against each
    other without ever coming face-to-face during the season.


    Think about it this way. Consider a bowling league that competes at their home
    Bowling Lanes competition. A second team competes at a different location, and
    they both put up their scores. We assume any particular bowling lane is identical
    to any other Bowling Lanes setup. Someone scoring 90, for example, should be identical
    to someone else scoring 90 at the other location. In comparing or combining scores,
    we are “comparing apples to apples,” so to speak.


    So it is with clay target shooting. Each gun range has the same setup and layout.
    We assume the score at one location is equivalent to that at another location.
    We ignore the fact that wind and weather will have a significant impact from one
    day to the next. That’s part of the fun!


    Scoring is quite simple—just like with bowling. In bowling, each pin is either
    still standing or is knocked over. There’s no “degree of difficulty” or “artistic
    impression” to consider. With trap shooting, a shot either breaks the clay target
    or does not.


    The mechanics are simple. That should make them easy to implement, right? Unfortunately,
    it’s not that simple!


    It turns out we can’t actually ignore the weather. A late winter storm could mean
    the gun ranges still need to be dug out and made operational. Further south, a
    tropical storm could prevent a team from competing that week. We do, in fact,
    have business rules for delaying the season’s start for one state while allowing
    a make-up week for an individual team affected by something outside their control
    (such as a hurricane).


    In other words, even the operational scoring system carries enough complexity
    that we should be considering Domain-Driven Design.


    Before a competition, however, we first need to assemble the team. We’ll focus
    on the above two workflows (create an account and season registration) with that
    end in mind.


    I’ll be showing you a pattern that’s so trivial that it may appear as pointless
    and wasted effort. But we’ll also be seeing its power. It works!


    Let’s take the time to understand the problem we’re trying to solve. I’m reminded
    of the old joke that runs, “We just got a new project! You two start coding while
    I go find out the requirements.” Don’t take that approach! As we learn about the
    problem, we’ll be taking careful note of where complexity may lay hidden.


    ## Create Online Account


    With the USA Clay Target League, every athlete must create an online account.
    Furthermore, every athlete account must be tied to a team. But, the athlete must
    already have an account for the team to invite the athlete. We have a “which came
    first, the chicken or the egg?” problem. Our solution is this sequence:


    1.  The team must exist.


    2.  The team invites the athlete to create an account using that team’s “team
    key.” The “team key” is like a coupon code. It’s permanent and specific to that
    team. It can be handed out on a piece of paper, sent via email, etc.


    3.  The athlete creates an account.


    4.  The team (i.e., the team’s coach) then invites the athlete to compete in one
    or more specific disciplines (Trap, Skeet, etc.) for the upcoming season.


    5.  The athlete accepts the invitation(s) registering for (and optionally paying
    the fees for) the competition season.


    The workflow for Step 3 above, creating an account, is deceptively simple.


    1.  Enter the team key, first and last name, and date of birth. Many of our business
    rules are based on age, and thus we need the date of birth right away.


    2.  Set up the login, including username and password. Depending on age (different
    requirements apply when under age 18, under age 13, etc.), we may or may not require
    an email address.


    3.  Collect guardian information (optional if the athlete is age 18 or older)
    and emergency contact.


    That’s a simple workflow, but the question of whether something is required or
    optional depends on age and certain other considerations. Thus, we have a bit
    of complexity that must be handled somewhere. Thus far, however, this doesn’t
    look like anything complex enough to push us in the direction of Domain-Driven
    Design.


    ## Season Registration


    Most of the season registration is a simple workflow. Enter demographics such
    as what school grade you’re in, firearm safety certificate number and completion
    date, and so on.


    Then, suddenly, implementation becomes complex. Oops! What’s the problem? Can
    we simplify it?


    Here are the variables.


    *   We are a non-profit corporation, and we allow the athlete to include a donation
    during season registration.


    *   Season fees can be either “Athlete Pay” or “Team Pay.” With Team Pay, once
    registration closes, the school team pays a single invoice based on the actual
    registrations. With Athlete Pay, the athlete pays the fee during season registration
    (i.e., right now).


    *   The athlete could be invited to one, or up to all four, of the disciplines.
    Each discipline has the same fee. The fee, as noted above, is payable by either
    the team or the athlete.


    *   The athlete need not select all invitations at once. For example, if invited
    to both Trap and Skeet, the athlete could register for Skeet now, optionally coming
    back to register for Trap later.


    *   All registrations with Athlete Pay, and all registrations with a donation,
    proceed to the payment screen.


    Thus our number of use cases is (Athlete Pay or Team Pay) times (with or without
    donation) times (accepting zero through up to four invites) times, possibly multiple
    trips through season registration.


    ## Can We Simplify?'
