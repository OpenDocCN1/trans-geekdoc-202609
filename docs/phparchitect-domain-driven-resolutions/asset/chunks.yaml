    # PHP 谜题：臭名昭彰的 Fizz Buzz


    ###### 作者 Oscar Merida


    > 让我们从一个经典的面试题——Fizz Buzz 开始新年。它被误用来筛选申请人，可能并没有测试它认为认为测试的内容。尽管如此，如果你遇到它，做好准备并没有坏。我们将观察解决它的各种方法。


    ## 回顾


    编写一个 PHP 脚本，打印从 1 到某个 `$maximum` 的整数。


    1. 对于 3 的倍数，输出“Fizz”而不是数字

    2. 对于 5 的倍数，打印“Buzz”而不是数字

    3. 对于 3 和 5 的公倍数，打印“FizzBuzz”而不是数字


    ## 为什么？


    在[为什么程序员不会写程序](https://phpa.me/codinghorror-why-cant)中，Jeff Atwood 普及了使用 Fizz
    Buzz 以及类似的编程挑战。聘佣程序员是一项挑战性工作。教育和认证只能带你走多远。这类测试旨在评估候选人是否能在合理的时间内像“真正的程序员”一样思考。但我们的日常工作在知道需要写什么代码之前，涉及到发现、调查和试错。


    现实世界中的问题很少像 Fizz Buzz 那样定义明确。在糟糕的面试中，你可能只有几分钟的时间展示解决方案，甚至对你的第一个方案进行迭代。它还排除了那些测试不好或没有记住晦僻编程知识的人。正如
    Justin Falcone 所解释的，“大多数程序员不会写程序”这个观点本身可能不是真的。


    ## 秘诀


    模运算（modulus operator）是任何解决方案的核心。许多程序员（特别是新手）忘记了它的存在。它通过提供余数来补充除法运算符。


    ```

    echo 32 / 6; // 5.333333333333

    echo 32 % 6; // 2

    ```


    ## 循环解决方案


    一个直接的初始解决方案是循环给定的范围以产生我们的输出。


    **Listing 1.**


    ```

    ```

    ```


    该循环产生了以下内容：


    ```

    1 2 Fizz 4 Buzz Fizz 7 8 Fizz Buzz 11

    Fizz 13 14 FizzBuzz 16 17 Fizz 19 Buzz

    Fizz 22 23 Fizz Buzz 26 Fizz 28 29

    FizzBuzz 31 32 Fizz 34 Buzz 37 38 Fizz

    ```


    ## 改进循环


    我们可以对解决方案所做的一个改进是将打印内容的逻辑放入一个函数中。我不喜欢直接 echo 值的函数。这样做是一种无意的副作用，并且假设了你想将结果显示在 `STDOUT`
    上。相反，我更倾向于返回字符串，并让调用代码决定如何处理它。


    **Listing 2.**


    ```

    ```

    ```


    这里的另一个常见错误是 `if` 表达式的顺序错误。确保包含一个处理既是 3 倍数又是 5 倍倍数的整数。我添加的一个微小优化是检查数字是否能被 15 整除，而不是进行两次
    3 和 5 的整除检查。


    ## 无循环


    我们可以在不使用循环的情况下完成这吗？当然！我们可以使用我们的 `FizzBuzzResult()` 函数和 PHP 原生的数组函数，采用一种更……怎么说，函数式的方法。


