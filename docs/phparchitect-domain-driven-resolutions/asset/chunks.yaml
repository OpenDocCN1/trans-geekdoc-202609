    This difference got me thinking about how `PHP` has evolved over the last ten
    years. I used to closely follow `PHP Internals` and even got involved in a few
    of the discussions. I felt like it was important for me to be involved as much
    as I could. After all, these decisions were affecting my livelihood and my community.
    After about a year, I started feeling like I didn’t have much to contribute to
    the discussion. The people making the decisions worked in such a drastically different
    environment than me, and neither of us could truly relate to the other’s point
    of view. Not to mention, my point of view was not the exciting, academic, cutting
    edge side of things, so that didn’t help either.


    I stopped making comments and just watched the discussions—keeping informed while
    lurking. Slowly, though, I faded further and further from the discussions until
    I found I was months behind on reading the posts and just unsubscribed. I felt
    a bit bad about giving up on being involved in internals, but I didn’t have anything
    to say about `closures` or `scalar type hints` or `inheritance by anonymous classes`.
    Honestly, most of the projects that I was working on were companies just starting
    to upgrade to `5.4`. `PHP 5.6` was still out of reach for many of my customers
    when `7` was being prepped for release. Many of my projects were short-term or
    light enough usage that a full-blown, properly abstracted system was unnecessary
    and would create a painful complexity without providing any needed benefits.


    The thing I most needed the core internals team to do was to avoid any breaking
    changes so I could get my clients to upgrade. Needless to say, that was not their
    top priority, and rightfully so. I needed consistency to decrease costs for my
    customers. The core internals team needed to modernize the language and add features
    and constructs to match what other popular languages offer. I was concerned about
    ease of debugging while they were concerned about ensuring that `PHP` enforced
    strict standards to remove ambiguity in coding and encourage best practices.


    Who was wrong? Who was out of touch? Was I too entrenched in old code and projects
    on a tight budget to realize the importance of these features which I couldn’t
    imagine ever using? Were the core devs too focused on academic theory and too
    isolated within huge corporate infrastructures to understand what devs like me
    needed?


    The changes made to `PHP` from version `7` and beyond have skyrocketed the language
    into maturity, sped things up considerably, and helped `PHP` gain some of the
    professional respect it truly deserves. These are all great things. While they
    were streamlining things and enforcing best practices, they made things more difficult
    for developers like me who work with small businesses, ancient codebases, and
    hosting companies unwilling to upgrade. In making things more advanced to appeal
    to senior programmers and large organizations, they upped the difficulty for anyone
    trying to learn `PHP` or debug unfamiliar code.


    There is always give and take, a bit of pain with each step forward. Change is
    hard. However, the beauty of our community is that we are so diverse. We have
    a strong group with people who push us forward and other people that keep us grounded.
    Thanks to this, `PHP` supports a vast range of organization sizes and project
    complexities. From small shops that just need a contact form to companies supplying
    content and services to millions of users, `PHP` is out there solving problems
    of all shapes and sizes. When we encounter differences, remember: we are experts
    in our own experiences, and because those experiences are so different, there’s
    a lot we can learn from each other.


    ### Biography


    ![Beth Tucker Long](media/file39.jpg) Beth Tucker Long is a developer and owner
    at [Treeline Design](http://www.treelinedesign.com), a web development company,
    and runs [Exploricon](http://www.exploricon.com), a gaming convention, along with
    her husband, Chris. She leads the [Madison Web Design & Development](http://madwebdev.com)
    and [Full Stack Madison](http://www.fullstackmadison.com) user groups. You can
    find her on her blog (http://www.alittleofboth.com) or on Twitter [@e3BethT](https://twitter.com/e3BethT).

    '
  trans: '


    这种差异让我开始思考 `PHP` 在过去十年里是如何演变的。我曾紧密关注 `PHP Internals`，甚至参与了其中几次讨论。我觉得尽可能地参与其中对我来说是非常重要的。毕竟，这些决策影响着我的生计和我所在的社区。大约一年后，我开始觉得自己对讨论没有太大贡献了。做出决策的人所处的环境与我截然不同，我们都无法真正认同对方的观点。更不用说，我的观点并非那种令人兴奋、学术化且前沿的领域，这无济于事。


    我停止了发表评论，只是观察讨论——在潜水的同时保持信息同步。然而，缓慢地，我逐渐离讨论变得越来越远，直到我发现自己阅读帖子已经落后了几个月，于是取消了订阅。对于放弃参与内部机制我感到有些抱歉，但对于
    `closures`（包）、`scalar type hints`（量类型提示）或 `inheritance by anonymous classes`（匿名类的继承），我无话可说。坦诚地说，我当时的大多数项目都是刚开始升级到
    `5.4` 的公司。当 `7` 正在准备发布时，对于我的许多客户来说，`PHP 5.6` 仍然遥不可及。我的许多项目是短期的，或者使用量很轻，一个完整的、经过良好抽象的系统并没有必要，而且会在不提供任何必要收益的情况下产生痛苦的复杂性。


    我最需要核心内部团队做的是避免任何破坏破坏性的更改（breaking changes），这样我才能让客户升级。不用说，这并不是他们的首要任务，而且理所应当。我需要一致性来降低客户的成本。核心内部团队需要让语言现代化，并添加功能和结构以匹配其他流行语言提供的特性。我关注的是调试的便利性，而他们关注的是确保
    `PHP` 执行严格标准，以消除编码中的歧义并鼓励最佳实践。


    谁错了？谁又脱离了现实？我是不是太深陷于旧代码和预算紧张的项目中，以至于意识到这些我甚至无法想象自己会用到的功能具有重要性？还是核心开发人员过于关注学术理论，并且在庞大的企业基础设施中过于孤立，导致无法理解像我这样的开发者需要什么？


    从 `7` 版本及以后对 `PHP` 进行的改进让这门语言跃升到了成熟阶段，大大提高了速度，并帮助 `PHP` 获得了它真正应得的专业尊重。这些都是好事。当他们在简化流程并执行最佳实践时，他们让像这样与小微企业、旧代码库以及不愿升级的托管公司工作的开发者面临了更多困难。为了吸引高级程序员和大型组织而使事情变得先进，他们增加了任何尝试学习
    `PHP` 或调试不熟悉代码的人的难度。


    有得，每向前一步都伴随着一丝痛苦。改变是困难的。然而，我们社区的魅力之处在于我们是如此多元。我们有一群推动我们前行的强大群体，也有其他让我们脚踏实地的人。得益于此，`PHP`
    支持各种组织规模和项目复杂度。从只需要联系表单的小店，到为数百万用户提供内容和服务的公司，`PHP` 正在解决各种问题。当我们遇到差异时，请记住：我们都是自己经验的专家，正因为这些经验如此不同，我们可以从彼此身上学到很多。


    ### 个人简介


    ![Beth Tucker Long](img/file39.jpg) Beth Tucker Long 是 [Treeline Design](http://www.treelinedesign.com)
    一家 Web 开发公司的开发者兼所有者，并与丈夫 Chris 一同运营 [Exploricon](http://www.exploricon.com) 游戏展。她领导着
    [Madison Web Design & Development](http://madwebdev.com) 和 [Full Stack Madison](http://www.fullstackmadison.com)
    用户组。你可以在她的博客 (http://www.alittleofboth.com) 或推特 [@e3BethT](https://twitter.com/e3BethT)
    上找到她。


    '
