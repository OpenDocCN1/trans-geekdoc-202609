    这类细微的时序问题可能罕见且棘手。从一开始就避免它们会更容易。


    下一部分同样属于“驯龙模式”（Dragon Wrangling Pattern），是一个独立的 `Factory`，用于将每个 `Application Service`
    连接到其对应的 `Repository`（存储库）。以下是部分列表，为了节省空间进行了压缩：


    **列表 3。**


    ```


    ```


    ```


    每个 `Application Service` 都有自己的类。正如我们所看到的，“添加医疗信息”页面获得了类 `AddMedicalInfo`。我采用了一种命名约定，在配套的
    `Repository` 前加上前缀“R”，创建了类 `RAddMedicalInfo` 作为 `Repository`。


    由于我们的工作流处理网页表单数据，我将控制器和请求传递到 `factory`。“添加医疗信息”控制器方法的第一行是：


    ```


    ```


    最后，我发现我可能需要能够从任何地方向用户传回错误消息，无论是在 `Application Service Layer`、`Repository` 还是其他地方。我创建了
    `ReportError` 类来处理将消息传回给 `Controller`。


    `Factory` 确保了错误报告器拥有指向 `Controller` 对象的链接。其他所有内容（`Application Service` 和 `Repository`）都包含
    `Error Reporter` 的链接。错误报告器有两个基础流水线：一个是返回给用户的错误通知，另一个是向数据库报告更全面的失败信息。存储库列表显示在 `catch()`
    块中使用了这两个流水线（`flashError()` 和 `logError()` 方法）。


    ## 益处


    在完成第一次重构并通过所有测试后，我发现实现下一个工作流的速度要快得多，无论复杂性如何。第一个工作流的 `application services` 大多是空的。但它为我提供了一个模式，让我处理更复杂的第二个工作流时可以更快地遵循。


    事实证明这是一个非常有用的“分而治”策略策略。我可以更容易地一次专注于某一个用例。这使得将额外的逻辑或额外的概念提取到独立的类中变得更容易。这些独立的类由于很少或没有依赖，单元测试变得变得容易得多。


    将对象创建分离到 `factory method` 中也被证明是有用的，尽管这几乎不是必须。集中的日志记录和错误报告配合通往 `Controller`（因此是通用户）的热路径，使得错误处理的编写变得简单得多。


    事实上，事实证明如此；为每个决策或交互包含错误处理变得非常容易。最终结果可能是应用程序更具韧性，同时保持了较低的复杂性。


    最后，自从实现了前两个工作流以来，我们意识到需要在仪表板上添加通知。可能存在某一种需要解决的错误状态（例如缺少认证）、待处理的邀请、锦标赛资格或任何情况。我们可能在工作流进行过程中意识到需要添加通知。


    但看！基础设施已经存在了。得益于 `Factory` 方法，所有对象都可以访问集中的错误报告器。该错误报告器可以轻松扩展以包含发布仪表板通知。代码将与“为
    MySQL 事务失败设计”中的列表 4、5、6 类似。


    ## 总结


    我们所做的解释比编写代码多得多。这是一件好事，因为我们能够简化代码库。现在它变得更容易理解了，因为我们组织它使其能够一次只看到一个用例。我们引入了“驯龙模式”的几个方面：


    *   `behat` 测试套件（特性文件）引导我们根据用例重构代码。

    *   为每个用例或功能提供一个独立的 `Application Service` 类，我们就有了一种实用的“分而治”方法。

    *   我们没有怎么谈论 `Repository`，但它通常很小，并且局限于直接满足 `Application Service` 的需求。

    *   `Factory` 为我们提供了一种一致的方法来连接每个用例的组件，鼓励我们在一个用例到另一个用例遵循类似的实践。


    > ### 简介

    > ![Edward Barnard](img/file34.jpg)Ed Barnard 在 1988 年 11 月莫里斯虫瘫痪互联网时处于第一线。当时，当病毒直接冲击分析师时，他正在向他们讲解
    CRAY-1 超级计算机操作系统的内部原理。那是忙碌的一周！Ed 继续投入他对计算机安全的兴趣，并向他人教授软件概念。[ewbarnard](https://twitter.com/ewbarnard)


    # 安全角：：安全漏洞的恐怖规模


    ### 作者：Eric Mann


    > 12 月在广泛使用的 Log4J 库中发现的一个远程代码执行漏洞导致数十亿机器暴露在恶意攻击者面前。不幸的是，修复此漏洞并非易事，导致互联网大部分在恶意攻击者面前暴露了一多周。


    11 月月中，来自 [阿里巴巴云安全团队](https://www.mcafee.com/blogs/?p=133000) 的安全研究人员发现了流行的 Log4J
    库中的一个漏洞，该工具是大多数 Java 开发者用于在应用程序中实现日志记录。漏洞本身允许攻击者向 Java 运行时 Java 命名和目录接口 (JNDI)
    组件注入其自行选择的字符串。此接口将尝试解析传入的字符串，在某些情况下通过 DNS 查找额外信息，或通过执行作为输入字符串一部分的代码。


    通俗地说——任何使用受漏洞版本 Log4J 记录 Web 请求的应用程序都允许远程未身份验证的攻击者在应用程序服务器上执行他们想要的任何命令。这是任何漏洞最糟糕的结果。或者正如安全公司
    Tenable 执行官 Amit Yoran 所说：


    > 这是迄今为止规模最大、最关键的漏洞。


    注入攻击在现代软件中非常常见。事实上，它们如此常见以以开放 Web 应用安全项目 (OWASP) [将其视为市场上出现频率第三的](https://owasp.org/Top10/A03_2021-Injection/)
    应用程序安全风险类别。当不受信的用户输入直接传递到应用程序的关键组件时（例如传递到数据层 (SQL) 或尝试解析系统名的业务逻辑 (JNDI)），就会发生注入漏洞。


    ## 事件范围


    [初始安全报告](https://nvd.nist.gov/vuln/detail/CVE-2021-44228) 包含了通过版本 2.14.1 的所有 Log4J
    版本。考虑到漏洞本身的轻而易举——攻击者可以通过在游戏内聊天中粘贴字符串，从而在 Minecraft 服务器上远程执行代码](https://twitter.com/MalwareTechBlog/status/1469290238702874625)——社区迅速行动修复了该问题。


    也许太快了。


    [Log4J 2.15.0 在](https://us-cert.cisa.gov/node/17179) 原始漏洞被公开记录的同一天发布了。虽然那是周五的下午，但许多工程师工作到了深夜（或贯穿了整个周末）来修复他们的应用程序。


    不幸的是，修复是不完全的。几天后，研究人员 [发现了另一个（相关的）漏洞](https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2021-45046)。许多非默认配置会允许进一步利用底层漏洞。这可能导致信息泄露（环境密钥的外泄）、远程代码执行，甚至是拒绝服务攻击。工程师们很快发布了
    Log4J 2.17.0](https://phpa.me/techtarget-log4J)，其中包含了之前所有的修复，并且在本文写作时认为是安全的。


