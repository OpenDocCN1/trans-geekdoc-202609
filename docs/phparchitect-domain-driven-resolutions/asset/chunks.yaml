    # Community Corner: Interview with PHP 8.1 Release Manager Patrick Allaert


    ###### By Eric Van Johnson


    > PHP `8.1` is now the current version of PHP, and there is a new team behind
    managing the releases of PHP. For this release of PHP, the Internals groups decide
    to do something different. There is still a veteran release manager for PHP `8.1`,
    namely, Joe Watkins (`@krakjoe`). But instead of only having one new release manager,
    “rookie,” they elected two additional people to manage the release. This month
    we speak to one of those rookie release managers, Patrick Allaert.


    How did you get started with coding, and what got you interested in PHP?


    In the late ’90s, I ran a website about song lyrics. `PHP 3` helped me build a
    fast-evolving website. Later on, in 2002, as part of my thesis, I had to develop
    an ultra-fast custom TCP protocol communication between a website (made in `PHP
    4`) and a proprietary 3D engine: this was the first time I discovered PHP’s source
    code.


    What do you do professionally?'
  trans: '

    总而言之，原始问题不仅需要通过一次，而是通过三个独立的阶段才能完全修复缺陷代码并保持我们的系统补丁。鉴于团队为了纠正该问题行动得如此快，始终存在一种可能性，即最新版本仍然不完整，未来可能还需要更多工作。


    ## 事件规模


    开源库 `Log4J` 由 Apache 基金会发布，并被你可能熟悉的大多数基于 Java 的软件使用。`Minecraft` 使用它进行日志记录，`Jenkins`
    也是如此。即使是 iCloud、Spotify 和 Oracle（甲骨文）也使用了它。特斯拉汽车在其控制接口中运行着嵌入式 Java 版本，而该版本使用了
    `Log4J`。亚马逊也利用它来驱动[大多数 AWS 基础设施背后的控制平面](https://aws.amazon.com/security/security-bulletins/AWS-2021-006/)。


    虽然此次特定问题受影响的是 Java 而非 PHP，但 Java 有多种方式可以影响我们的生活或应用程序。了解到 AWS 堆栈的大部分运行在 Java 上，意味着在亚马逊修补其库之前，`任何`应用程序都可能受到影响。任何将
    `Jenkins` 作为任务运行器或 CI/CD 平台的用户都可能面临风险。`Elasticsearch`、`Couchbase`、`Okta` 甚至 Debian
    [都受到了此漏洞的影响](https://heimdalsecurity.com/blog/?p=39256)。即使你的代码是 100% 安全的，你的堆栈中另一个组件不安全的概率也很大，这需要你跟踪所有这些变化环节，以保持你的应用程序的稳定。


    事实上，仅在过去的四个月里，[`Log4J` 的下载量已超过 2800 万次](https://blog.sonatype.com/why-did-log4shell-set-the-internet-on-fire)，使其在流行度和使用量方面处于
    Java 模块的前 0.003%。作为对比，在同样的四个月内，PHP 的 Monyog 日志库[仅被下载了 100 万次](https://packagist.org/packages/monolog/monolog/stats)。


    截至 12 月 20 日（即公开披露仅十天后），社区终于能够识别出该事件的巨大规模。估计有 [93% 的云环境](https://phpa.me/darkreading-log4j-flaw)
    受到 `Log4J` 问题的影响——虽然并非所有这些环境都暴露在公共互联网上，但有足够多的环境是这样，以这确实是我们社区迄今面临的最严重的漏洞。


    ## 我们接后的去路


    开发社区中的一些人经常批评 PHP 的不安全声誉。事实上，任何语言的安全性都取决于使用该语言的开发者所采用的编码实践。更多情况下，是不安全的代码由于无意的失误而漏掉，直到某个包、库或程序获得意想不到的知名度和关注时才被发现。


    我在本杂志的[11 月刊中写过我曾针对一个 WordPress 插件接收到类似末日级安全通知的经历](https://www.phparch.com/article/security-corner-no-bug-too-small/)。我怀疑，Apache
    团队的一些人将在相当长一段时间内撰写他们处理 `Log4J` 的经历。


    在此期间，我们能做的最好就是确保我们始终遵循最佳实践并保持项目安全。


    *   跟踪 OWASP 前十（OWASP Top Ten）。

    *   进行严格的代码审查。

    *   对你的应用程序进行内部和外部渗透测试。

    *   更新你使用的每个库或组件（无论是与 PHP 相关的还是其他的），以确保像 `Log4J` 中发现的那种关键漏洞不会溜。


    换句话说，我们继续做我们最擅长的事，并清醒地认识到这种 bug 可能会在我们任何一个人身上、任何时间、我们的任何应用程序中发生。


    > ### 传记


    > ![Eric Mann](img/file35.jpg)Eric 是一位丰富的 Web 开发者，拥有多种语言和平台。他使用 PHP 已十多年，精力专注于帮助开发者入门并使用他们所选的技术学习新技能。你可以通过
    Twitter 直接与他联系：[@EricMann](https://twitter.com/EricMann)


