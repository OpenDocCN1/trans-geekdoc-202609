    这种设置存在一些缺点。第一个是它无法运行多个工作进程（workers）。没有有效的方法可以知道队列中的项何时被取走。你可以为队列表添加一个 `locked`
    列，但由于在执行 `SELECT` 获取行到执行 `UPDATE` 标记消息为锁定之间存在时间差，始终存在两个工作进程可能取到同一条消息的可能性。


    第二个是卡住的消息。如果某行被标记为锁定但工作进程崩溃了，那么在没有人工干预的情况下，没有简单的方法来解锁该行。自动化检测队列项是否卡住可能会很复杂，因为某些外部系统需要判断它是真的卡住了，还是仅仅运行时间较长。


    你可以为消息添加一个 TTL（生存时间）并为锁定添加时间戳。如果时间戳过期，就解锁该行！但现在你又有了另一个程序专门监控需要解锁的行。归根结底，有更好的方法来处理队列。


    快进到后后的任务。我们有多个报告需要运行，而且有些报告依赖于其他报告。这不再仅仅是简单的“请求报告”了——我们启动了夜间处理，每晚会生成数百份报告。


    我之前使用的简单数据库后端队列已经不够用了。我们需要同时同时运行几十个工作进程。坦率说，现在有很多队列系统与 PHP 配合得非常好。其中最简单的一个是 [beanstalkd](https://beanstalkd.github.io/)。


    beanstalkd 是一个轻量级的作业队列，处理了之前数据库系统的所有缺陷。消息在分发给工作进程时会自动锁定，如果工作进程消耗的时间超过预期，则会被解锁。它可以将消息刷新到磁盘，以帮助避免队列本身崩溃导致的问题。如果出现问题，有人可以直接
    `telnet` 连接到 beanstalkd 实例并查看或刷新消息。


    设置 beanstalkd 非常简单。它存在于[大多数包管理器](https://beanstalkd.github.io/download.html)中（尽管基于
    Redhat 和 CentOS 的系统需要启用 EPEL 库）。一旦启动 beanstalkd，它就准备就绪开始接收消息了。它几乎没有什么需要配置的。默认情况下，beanstalkd
    监听 11300 端口。


    虽然该协议是一个简单的文本协议，但我建议使用 `pda/pheanstalk`。它是 beanstalkd 协议的纯用户态实现，既提供了向队列添加消息的能力，也提供了创建使用这些队列的工作进程的能力。你可以使用
    `composer` 安装它。


    ```

    $ composer require pda/pheanstalk:⁴.0

    ```


    Pheanstalk 4（我将将其用于示例代码）需要安装 `mbstring` 扩展以及 PHP 7.3 或更高版本。如果你没有安装 `mbstring`
    或使用的是旧版本的 PHP，将必须使用 Pheanstalk 3。总的来说，思路是相同的，只是语法不同。我很兴地告诉你它在 PHP 8.1 上运行良好。


    beanstalkd 的工作原理是你的应用程序将消息（或简单的文本块）提交到一个“管道”（tube），管道就是这些消息的队列。工作进程会从队列中“预留”（reserve）或请求消息。beanstalkd
    会获取最旧的消息，将其锁定并交付给工作进程。任务结束时，工作进程将请求删除该消息或将其“释放”（release）回队列以供他人处理（例如，如果任务遇到错误无法完成）。


    向队列添加消息非常简单。我们需要创建一个到 beanstalkd 实例的连接。然后我们选择一个要使用的管道并向其提交消息。参见列表 2。


    **列表 2。**


    ```


    ```


    在这里我们连接到本地机器上的 beanstalkd 实例。你可以连接到远程机器，但要小心使用类似 SSH 连接的工具对传输进行加密。beanstalkd 是纯文本协议，所以你需要非常小心机器间的通信。


    一旦创建了连接，我们使用 `->useTube(''reports'')` 选择一个管道。beanstalkd 会在请求时自动创建管道，因此我们不需要预先初始化或配置管道。当我们第一次请求某个管道时，它会被创建。如果你想查看现有管道的列表，可以使用
    `->listTubes()`。


    有了管道，我们就可以通过 `->put()` 向队列中添加消息。在这种情况下，我们使用 JSON，但任何文本格式都可以。。你可以提交 XML、YAML、普通的文本字符串或你想要的任何基于文本的内容。唯一重要的是工作进程必须理解如何解码该消息。beanstalkd
    不在乎消息是什么，也不强制执行任何形式的结构。


    这段代码可以作为普通 Web 应用后端的一部分。向队列中放入消息是一个快速的过程，不会为 Web 请求的实际执行增加多少时间。我们将耗时较长的工作交给工作进程，它是运行在服务器上的第二个脚本。


    消费消息正如列表 3 所示同样简单。我们连接到 beanstalkd，监控一个管道并等待预留消息。


    **列表 3。**


    ```


    ```


    在这里我们连接到 beanstalkd 实例，就像发送消息时一样。这次我们使用 `->watch(''reports'')` 监控管道，一旦有消息就立即调用
    `reserve()` 来获取消息。如果没有消息，工作进程将会等待。


    一旦消息被预留，我们就可以获取它。由于我们预计管道中的消息是 JSON 字符串，我们对其解码。执行所需的报告，然后使用 `->delete($job)` 从队列中删除任务。如果我们遇到任何错误，则使用
    `->release($job)` 将任务释放回队列，以便以后再次尝试。


    ### 保持工作进程运行


    这种逻辑封装在一个 `while (true) {}` 循环中，一旦我们的工作进程完成任务，它将尝试获取另一条消息。这样做会将脚本变成守护进程或长时间运行的进程。它会尝试预留消息，直到崩溃（如果发生的话）或被中断。


    使用 `while()` 循环很容易，但在内存使用方面并非最佳。PHP 的垃圾回收机制（引擎用于清理未使用变量和数据的内部进程）自 PHP 5.3 以来有了巨大的改进。尽管如此，取决于你的工作脚本的结构，可能会出现垃圾回收无法清理所有预期内容的情况，这会导致内存占用随时间增加。


    停止这种情况的最简单方法是允许你的工作进程运行若干任务后就停止。例如，我们可以将 `while()` 循环替换为 `for()` 循环，并在处理 100 个任务后停止（列表
    4）。


    **列表 4。**


    ```


    ```


    我们可以做什么来保持进程运行？一种方法是，如果你安装了 [pcntl 扩展](https://www.php.net/manual/en/book.pcntl.php)，可以注册一个重启脚本的关闭函数。我们可以在脚本结束之前使用当前进程信息调用
    `pcntl_exec()` 来生成第二个进程。参见列表 5。


    **列表 5。**


    ```


    ```


    `$_SERVER[''_'']` 包含了执行的程序，通常是 PHP 自身的路径。`$argv` 包含了传递命令的所有参数，如脚本名称和任何额外参数。由于我们正在重新启动任务，只需重用所有提供的信息来重启进程。

