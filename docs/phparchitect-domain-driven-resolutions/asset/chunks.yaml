    *   PHP `8.0.14`（错误修复发布）：[`www.php.net/archive/2021.php#2021-12-17-1`](https://www.php.net/archive2021.php#2021-12-17-1)

    *   PHP `7.4.27`（错误修复发布）：[`www.php.net/archive/2021.php#2021-12-16-1`](https://www.php.net/archive2021.php#2021-12-16-1)

    *   PHP `7.3`：已结束生命周期，是时候升级了。[`www.php.net/supported-versions.php`](https://www.php.net/supported-versions.php)


