    \ request from the same client on the same connection)\n\n*   the Linux user and\
    \ group Apache runs as (`www-data` by default)\n\nWhile `apache2.conf` looks extensive,\
    \ it appears a bit less daunting when you look at the default configuration without\
    \ the large comment blocks. See Listing 2.\n\n**Listing 2.**\n\n```\nDefaultRuntimeDir\
