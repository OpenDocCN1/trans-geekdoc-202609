    These sorts of subtle timing problems can be rare and nasty. It’s easier to avoid
    them in the first place.


    The next piece, again part of the Dragon Wrangling Pattern, is a separate `Factory`
    to connect each `Application Service` to its `Repository`. Here is a partial listing,
    condensed for space:


    **Listing 3.**


    ```


    ```


    Each `Application Service` gets its own class. As we saw, the “add medical information”
    page gets class `AddMedicalInfo`. I adopted the convention of prefixing the companion
    `Repository` with “R” to create class `RAddMedicalInfo` as the `Repository`.


    Since our workflow processes webpage form data, I pass the controller and the
    request into the `factory`. The first line of the “add medical information” controller
    method is:


    ```


    ```


    Finally, I discovered that I needed to be able to pass error messages back to
    the user from anywhere, whether it be the `Application Service Layer`, the `Repository`,
    or whatever. I created the `ReportError` class to handle passing messages back
    to the `Controller`.


    The `Factory` ensures that the error reporter has a link to the `Controller` object.
    Everything else (`Application Service` and `Repository`) contains a link to the
    `Error Reporter`. The error reporter has two basic pipelines. One is error notifications
    going back to the user, and the other reports more comprehensive failure information
    to the database. The repository listing shows both pipelines in use within the
    `catch()` block (methods `flashError()` and `logError()`).


    ## Benefits


    After completing that first refactoring, with all tests passing, I found that
    implementing the next workflow went a lot faster, complexity and all. The first
    workflow’s `application services` were mostly empty. But that provided me a pattern
    I could follow far more rapidly with the more-complex second workflow.


    This turned out to be a useful “divide and conquer” strategy. I could more easily
    focus on each use case one at a time. That made it easier to extract extra logic,
    or extra concepts, into separate classes. Those separate classes, with few or
    no dependencies, became far easier to unit test.


    Separating object creation into a `factory method` proved useful as well, even
    though it was barely necessary. The centralized logging and error reporting, with
    a hot path back to the `Controller` (and therefore the user), made error handling
    far easier to write.


    In fact, it turned out; it became quite easy to include error handling for every
    decision or interaction. The net result will likely be a more resilient application
    while keeping the complexity lower.


    Finally, since implementing the first two workflows, we’ve realized the need for
    adding notifications to a dashboard. There might be an error condition requiring
    resolution (such as missing certification), a pending invitation, a tournament
    qualification, or whatever. We might realize we need to add the notification while
    in the middle of a workflow.


    But look! The infrastructure already exists. Thanks to the `Factory` approach,
    all objects have access to the centralized error reporter. That error reporter
    can be easily expanded to include posting dashboard notifications. The code would
    be similar to Listings 4, 5, 6 in “Designing for MySQL Transaction Failures.”


    ## Summary


    We did a lot more explaining than coding. That’s a good thing because we were
    able to simplify our codebase. It’s now far easier to understand because we organized
    it to be seen one use case at a time. We introduced several aspects of the Dragon
    Wrangling Pattern:


    * The `behat` test suite (the feature files) guided us in restructuring the code
    according to the use case.

    * With one separate `Application Service` class for each use case or feature,
    we have a useful way to “divide and conquer.”

    * We didn’t say much about the `Repository`, but it’s generally small and limited
    to directly fulfilling the `Application Service`’s needs.

    * The `Factory` provided us a consistent way of connecting up the pieces for each
    use case, encouraging us to follow similar practices from use case to use case.


