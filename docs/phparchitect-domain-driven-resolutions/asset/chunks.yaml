    \ expanded to include posting dashboard notifications. The code would be similar\
    \ to Listings 4, 5, 6 in “Designing for MySQL Transaction Failures.”\n\n## Summary\n\
    \nWe did a lot more explaining than coding. That’s a good thing because we were\
    \ able to simplify our codebase. It’s now far easier to understand because we\
    \ organized it to be seen one use case at a time. We introduced several aspects\
    \ of the Dragon Wrangling Pattern:\n\n*   The `behat` test suite (the feature\
