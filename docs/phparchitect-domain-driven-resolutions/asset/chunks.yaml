    \ procedural language. Meaning that when a request comes in, the engine starts\
    \ at the beginning of a script and processes it line-by-line. The engine does\
    \ not move on to the next line until the current line is finished. For most workloads,\
    \ like rendering a JSON or HTML response, this is fine.\n\n```php\necho 'This\
    \ line prints first' . PHP_EOL;\nsleep(1);\necho 'This line prints after one second'\
    \ . PHP_EOL;\necho 'Then this line prints last' . PHP_EOL;\n```\n\nIn other scenarios,\
    \ this may present a problem. Since the engine processes the scripts line-by-line,\
    \ this leads to a situation known as “blocking code,” which means that the engine\
    \ can get into situations where long-running code, like a `sleep()` call, will\
    \ “block” execution of further code until that line finishes. The system is not\
    \ hung; it is just doing one thing at a time.\n\n## Queues and Workers\n\nOne\
    \ of my earliest jobs was working for an insurance company. There were a lot of\
    \ reports that needed to be built and, while we did have a back-office system,\
    \ sometimes we needed a better way to make those reports available via the website.\
    \ That often meant running the reports directly and waiting for the output.\n\n\
    When an agent requested a larger report, the website would regularly time out.\
    \ The issue was just due to the amount of data gathered from various sources,\
    \ and it took longer than the server would wait. The agents would then e-mail\
    \ in and say things were broken.\n\nWhat we decided to do was implement a queueing\
    \ system. When the agent would request a report, we would create a request for\
    \ the report and put it into a queue system or a program that stores messages.\
    \ A second program, called a worker, running on the servers that generated the\
    \ reports, would take that request and run it. The output of the report would\
    \ then be saved to a place on disk, and the agent alerted that the report was\
    \ ready.\n\nAs this was one of my first times doing this, I used MySQL as the\
    \ “queue.” I would insert a row to the database to a table named `report_queue`,\
    \ and the worker program would just constantly “`SELECT * FROM report_queue LIMIT\
    \ 1`”, do the work, then run the query again. The worker itself, shown in Listing\
    \ 1, was just a small script that ran forever.\n\n**Listing 1.**\n\n```\n```\n\
    \nThis simple solution worked, but only because we had a single worker. Demand\
    \ was never high enough for us to ever queue up more than a few reports at any\
    \ one time. Agents were happy because the website would instantly confirm their\
    \ request for the report, and the report would be ready shortly after.\n"
