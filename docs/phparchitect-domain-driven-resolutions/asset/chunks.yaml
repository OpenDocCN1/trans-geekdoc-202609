    # 新年快乐


    ### John Congdon


    > 来自 PHP Architect 全体成员祝大家新年快乐。我们衷心希望你度过了一个奇的假期，并准备好在 2022 年大做一场。我们也希望我们为让你的 2022
    年变得美好尽了一力。


    随着 2021 年从我们的记忆中消失，我们希望你们有几人在假期期间收到了极佳的极客礼物。希望这些极客礼物中包含树莓派。在接下来的几个月里，我们将用树莓派构建一个项目，并希望能激发你为自己创造有用的东西。


    这也是制定一些有助于你职业生涯决定的绝佳时机。你今年想完成什么？持续学习永远是一个伟大的目标，也是我们 PHP Architect 致力于提供的。我们不断学习如何改进我们的流程，我们的新年愿望之一是让每月交付更加及时。我们知道这还需要几个月的时间，但这是我们的目标。现在，我想花时间请你个忙。你是否曾想成为一名“已发表的作家”？也许你还需要一个新年愿望。我们会帮你实现的
    😉 作为作为我们社区的杂志，我们依靠社区成员为我们撰写文章。更棒的是，我们还会为你发布的内容付费。所以，请花点时间问自己几个问题：“我最近学到了什么对我有帮助的新知识吗？”“我想学习一项新技能并与他人分享吗？”有时，文章截止日期会帮助你专注于并学习那项技能。老实，这一点帮助我写了所有的文章和会议演讲。如果你感兴趣，请发送邮件到
    `write@phparch.com` 并附上你的想法，我们将帮助你把主意变成一篇可以发表的文章。


    本期杂志从 Mauro Chojrin 的“介绍过滤器迭代器”开始。这篇专题文章将带你以全新的视角来审视你的项目。我们的第二个专题是 Kenneth Marks
    编写的系列之首，“如何用树莓派黑入你的家”。我一直对树莓派非常着迷，但一直很畏惧它们。Ken 正在为我开辟眼界，现在我想到处使用它们。


    我们的专栏作家也同样努力。Joe Ferguson 的《工作坊》为较新的开发者提供了一门“Apache 与 PHP - 回归基础”的课程。每个开发者都应该更深入地了解在
    PHP 代码启动并处理请求之前发生了什么。在《教育站》中，Chris Tankersly 正在讨论“后台队列”以提高应用程序的性能。Eric Mann 在本月的《安全角落》中带我们了解“安全漏洞的恐怖规模”。如果你正在找工作，确保你理解
    Oscar Merida 在本期《PHP 谜题》中“臭名昭彰的 Fizz Buzz”的基础知识。然后 Eric Van Johnson 对 Patrick
    Allaert（你的 PHP 8.1 发布经理之一）进行了一次出色的采访。


    最后，`finally{}`，Beth Tucker-Long 讨论了“专家还是脱节了？”，她在其中分享了自己 PHP 内部的一些经历。


    一如既往，感谢订阅 PHP Architect。我们对 2022 年有宏大的计划，希望你也是。


    # 如何用树莓派黑入你的家 - 第一 - 安装操作系统和配置树莓派


    ### 作者：Ken Marks


    > 在 2017 年 9 月，我在麦迪逊 PHP 大会（Madison PHP Conference）上做了一场名为“用树莓派黑入你的家”的演讲。那是一个期半天的教程，引导参与者完成配置树莓派、在上面安装
    LAMP 栈、连接传感器并最终让它向手机发送短信的过程。


    从那时起，我一直在我当地社区学院麦迪逊学院（Madison College）教授的高级 PHP 课程中将其作为一个实验室运行。


    我提供这个教程的主要原因之一是消除“物联网（IoT）很难”的迷思。有时人们会畏惧编写编写与小型嵌入式设备通信的代码（例如连接到树莓派或 Arduino 板板的传感器）。我的目标是向你展示创建一个并可以在网络上获取传感器数据的设备是多么简单。在此过程中，你会发现将应用程序部署到树莓派与部署到任何基于
    Linux 的 LAMP 栈一样简单！[我应该说，它就像用 Pi 一样简单 :-)]


    这篇文章是系列文章中的第一篇。我知道 `phparchitect` 杂志是一本致力于 PHP 开发的出版物，但我希望这不会让你感到畏缩，因为你将部署/使用的代码将是
    PHP。除了 `PHP`（以及 `SQL`），我们还将使用 `C/C++` 和 `JavaScript`。我们还将创建几个 UNIX 服务。所以，请跟我一起开启这段旅程，看看如何用树莓派黑入你的家！


    整个系列（我们可以称之为项目吗？）的目标是：


    * 安装树莓派操作系统

    * 配置树莓派

    * 在树莓派上安装 `LAMP Stack`

    * 将加速度传感器连接到树莓派

    * 将加速度数据记录到数据库

    * 在树莓派上创建并安装 `Unix Service`

    * 构建查询加速度数据的 Web 服务

    * 构建绘图应用程序来显示加速度数据

    * 使用 `SendMail` 向手机发送短信


    哇！这是一个相当大的列表，这就是为什么需要几篇文章来涵盖。


    在这篇文章中，我将涵盖：


    * 安装树莓派操作系统

    * 配置树莓派


    ## 它始于一个故事……


    我对这个系列的最初想法和动力始于关于我们旧干机的故事——它某天停止工作了。我被要求更换它。一切顺利，我也因为买了一台不错的干机而受到了赞誉。然而，这台新干机有一个讨厌的缺陷。我们在地下室洗衣服，而这台新干机在衣服烘好后会非常安静地提醒我们。我们的旧干机在干燥周期结束时会疯狂作响，我发誓你在街上都能听到它。当然，作为一个极有远见的鲁布·盖尔伯格式的人，我心想：“我可以为此创建一个应用！”所以，由于我对树莓派相当熟悉，并且总在寻找购买新极客玩具的借口，我将目标锁定在使用市场上最小的树莓派来进行我的项目。


    ![New Samsung Dryer with Pi](img/file0.png)


    New Samsung Dryer with Pi


