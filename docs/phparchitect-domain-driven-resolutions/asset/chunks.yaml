    # Happy New Year


    ###### John Congdon


    > Happy New Year from everyone at PHP Architect. We genuinely hope you had a wonderful
    holiday season and are ready to do great things in 2022. We also hope that we
    have a small part in making 2022 great for you.


    As 2021 fades from our memories, we hope that a few of you received fantastic
    geeky gifts during the holidays. Hopefully, some of those geeky gifts included
    Raspberry Pis. Over the next few months, we will build a project with one and
    hopefully inspire you to create something useful for yourself.


    This is also a great time to establish some resolutions to aid in your coding
    career. What do you want to accomplish this year? Continuing education is always
    a great goal and something that we here at PHP Architect strive to provide. We
    are constantly learning how to improve our process, and one of our New Year’s
    Resolutions is to be more prompt in our monthly delivery. We know this will take
    another few months, but it is our goal. Now I want to take a moment to ask you
    for a favor. Have you ever wanted to be a “published writer”? Maybe you still
    need a New Years Resolution. We’ll help you keep it 😉 As a magazine for our community,
    we rely on community members to write articles for us. And better yet, we pay
    for your content to be published. So take a moment and ask yourself a few questions.
    “Have I learned anything new recently that helped me?” “Do I want to learn a new
    skill to share with other people? Sometimes having an article deadline will help
    you focus and learn that skill. Honestly, this point has helped me write all of
    my articles and conference talks. If you are interested, please send an email
    to [write@phparch.com](mailto:write@phparch.com) with your ideas, and we will
    help you turn your idea into a publishable article.


    This month’s issue gets started with “Introducing FilterIterators” by Mauro Chojrin.
    This feature article will get you looking at your projects in a whole new way.
    Our second feature is the first in a series called “How to Hack your Home with
    a Raspberry Pi” by Kenneth Marks. I’ve always been fascinated by the Raspberry
    Pi but have always been intimidated by them. Ken is opening my eyes, and now I
    want to use them everywhere.


    Our columnists have been hard at work too. Joe Ferguson’s, The Workshop, is giving
    newer developers a course on “Apache and PHP - Back to Basics.” Every developer
    should have more of an understanding of what happens even before their PHP code
    fires up and starts handling a request. In Education Station, Chris Tankersly
    is talking about “Background Queues” to improve performance for our applications.
    Eric Mann brings us “The Terrifying Scale of a Security Bug” in this month’s Security
    Corner. If you’re out on the hunt for a job, make sure you understand the basics
    of the “Infamous Fizz Buzz” in this month’s PHP Puzzles by Oscar Merida. Then
    Eric Van Johnson does a great interview with Patrick Allaert, one of your PHP
    8.1 Release Managers.


    And finally{}, Beth Tucker-Long talks “Experts or Out-of-touch?” where she shares
    some of her past with PHP Internals.


    As always, thank you for subscribing to PHP Architect. We have big plans for 2022,
    and we hope you do too.


    # How to Hack your Home with a Raspberry Pi - Part 1 - Installing the OS and Configuring
    the Pi


    ###### By Ken Marks


    > In September of 2017, I gave a talk called: ‘Hack your Home with a Raspberry
    Pi’ at the Madison PHP Conference. It was a half-day tutorial, walking participants
    through the process of configuring a Raspberry Pi, installing a LAMP stack on
    it, connecting a sensor, and ultimately having it send a text message to their
    phone.


    Since then, I have been running this as a lab for my Advanced PHP class I teach
    at our local community college, Madison College.


    One of the main reasons I gave this tutorial was to dispel the myth of the Internet
    of Things (IoT) being difficult. Sometimes people get scared away from writing
    code that talks to small embedded devices (i.e., sensors connected to Raspberry
    Pis or Arduino boards). My goal is to show you how easy it is to create a device
    that reports sensor data that you can get on a network. Along the way, you will
    see that deploying an application to a Raspberry Pi is just as simple as deploying
    to any Linux-based LAMP stack! \[should I say, it’s as easy as Pi :-)\]


    This article is the first of several in a series. I know php\[architect\] Magazine
    is a publication dedicated to PHP development, but I hope it doesn’t scare you
    that not all the code you will be deploying/using in this series will be PHP 😱.
    In addition to PHP (and SQL), we will be using C/C++ and JavaScript. We will be
    creating a couple of UNIX services as well. So come along on this journey with
    me as I show you how to hack your home with a Raspberry Pi!


    The goals for the whole series (can we call it a project?) are:


    *   Installing the Raspberry Pi operating system


    *   Configuring your Pi


    *   Installing a LAMP Stack on your Pi


    *   Connecting an accelerometer sensor to your Pi


    *   Logging data from an accelerometer to a database


    *   Creating and installing a Unix Service on your Pi


    *   Building a Web Service for querying the accelerometer data


    *   Building a plotting application to display the accelerometer data


    *   Sending a text message to your phone using SendMail


    Wow! That’s a pretty big list which is why it will take several articles to cover.


    In this article, I will cover:


    *   Installing the Raspberry Pi operating system


    *   Configuring your Pi


    ## It starts with a story…


    My initial idea and motivation for this series (project?) starts with a story
    about our old clothes dryer, which quit working one day. I was tasked with replacing
    it. Everything was great, and I got kudos for getting a decent dryer. However,
    there was one annoying flaw with this new dryer. We do our laundry in the basement,
    and this new dryer chimes at us — very quietly — when the clothes are done. Our
    old dryer buzzed its bloody head off when the dry cycle was complete, and I swear
    you could hear it from the street. Of course, being the forward-thinking Rube
    Goldberg kind of person I am, I said, “I can create an App for that!” So, since
    I was fairly familiar with Raspberry Pis and am always looking for an excuse to
    buy new geek toys, I set my sights on using the smallest Raspberry Pi on the market
    for my project.


    ![New Samsung Dryer with Pi](media/file0.png)


