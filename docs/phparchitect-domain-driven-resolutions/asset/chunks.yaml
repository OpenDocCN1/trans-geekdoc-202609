    > ![Eric Mann](media/file35.jpg)Eric is a seasoned web developer experienced with
    multiple languages and platforms. He’s been working with PHP for more than a decade
    and focuses his time in helping developers get started and learn new skills with
    their tech of choice. You can reach out to him directly via Twitter: [@EricMann](https://twitter.com/EricMann)


