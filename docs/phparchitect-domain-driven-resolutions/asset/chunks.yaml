- raw: 'There are a few shortcomings with this setup. The first is its inability to
    run multiple workers. There is no efficient way to know when a queue item has
    been picked up. You could add a `locked` column to the queue table, but there
    is always a chance two workers could grab the same message as there is some time
    between doing the `SELECT` to get the row and the `UPDATE` to flag the message
    as locked.


    The second is stuck messages. If a row gets flagged as locked but the worker crashes,
    there is no clean way to unlock the row without manual intervention. Automating
    that a queue item is stuck can be tricky since some external system would have
    to know when something is stuck versus just taking a long time.


    You could add a TTL (Time to Live) on the message and a timestamp for the locking.
    If the timestamp expires, unlock the row! Except now you have another program
    that just watches for rows that need to be unlocked. At the end of the day, there
    are better ways to handle queueing.


    Fast forward to a later job. We had multiple reports that needed to be run and
    reports that depended on other reports. It was not just a simple “request a report”
    anymore—we kicked off nightly processing and would generate hundreds of reports
    a night.


    The simple database-backed queue I had used before would not cut it. We would
    need to run dozens of workers at the same time. Thankfully there are queueing
    systems out there that work very nicely with PHP. One of the simplest is [beanstalkd](https://beanstalkd.github.io/).


    beanstalkd is a lightweight job queue that handles all the deficiencies of the
    previous database system. Messages are automatically locked when handed out to
    workers and unlocked if a worker takes longer than expected. It can flush its
    messages to the disk to help avoid issues with the queue itself crashing. If there
    are problems, someone can just telnet into the beanstalkd instance and view or
    flush messages.


    Setting up beanstalkd is simple. It should exist in [most package managers](https://beanstalkd.github.io/download.html)
    (though Redhat and CentOS-based systems will need to enable the EPEL library).
    Once beanstalkd is started, it is all set to start receiving messages. There is
    almost nothing to configure. By default, beanstalkd listens on port 11300.


    While the protocol is a simple text protocol, I recommend using `pda/pheanstalk`.
    It is a pure userland implementation of the beanstalkd protocol and provides you
    with both the ability to add messages to queues and create workers that use those
    queues. You can install it using composer.


    ```

    $ composer require pda/pheanstalk:^4.0

    ```


    Pheanstalk 4, which I will be using for the sample code, requires the `mbstring`
    extension to be installed and PHP 7.3 or higher. If you do not have `mbstring`
    installed or are on an older PHP version, you will have to use Pheanstalk 3. Overall
    the ideas will be the same only the syntax will be different. I am happy to say
    it works fine with PHP 8.1.


    The way beanstalkd works is by your application submitting a message, or a simple
    block of text, to a “tube,” which is a queue of those messages. A worker process
    will “reserve” or ask for a message from the queue. beanstalkd will take the oldest
    message, lock it, and hand it off to the worker. At the end of the job, the worker
    will request that either the message be deleted or “release” it back to the queue
    to be processed by someone else (for example, if the job hits an error and cannot
    be completed).


    Adding a message to a queue is fairly simple. We need to create a connection to
    a beanstalkd instance. We then select a tube to use and submit a message to it.
    See Listing 2.


    **Listing 2.**


    ```


    ```


    Here we connect to a beanstalkd instance on the local machine. You can connect
    to a remote machine, but be careful to encrypt the transfer using something like
    an SSH connection. beanstalkd is a plain-text protocol, so you need to be very
    careful about inter-machine communication.


    Once we have the connection created, we select a tube with `->useTube(''reports'')`.
    beanstalkd will automatically create tubes when requested, so we do not have to
    initialize or configure the tube beforehand. The first time we request a tube,
    it will be created. If you want to see a list of existing tubes, you can use `->listTubes()`.


    Once we have the tube, we can add a message to the queue with `->put()`. In this
    case, we are using JSON, but any text format can work. You can submit XML, YAML,
    a normal string of text, or anything text-based you want. All that matters is
    that the worker understands how to decode the message. beanstalkd does not care
    what the message was nor enforces any sort of structure.


    This code can be a part of a normal web application backend. Putting a message
    into a queue is a quick process and will not add much time to the actual execution
    of the web request. We leave the longer-running work to the worker, which will
    be a second script running on the server.


    Consuming messages is just as easy as shown in Listing 3. We connect to beanstalkd,
    watch for a message to come across a tube, and wait to reserve a message.


    **Listing 3.**


    ```


    ```


    Here we connect to the local beanstalkd instance just like with the message sender.
    This time we use `->watch(''reports'')` to use a tube as we will watch that tube
    for any new messages that come in. Once we are watching a tube, we immediately
    call `->reserve()` to try and get a message to use. The worker will hang on this
    command until a message is available to process. If there are no messages, the
    worker will hang until there is one.


    Once a message is reserved, we can get the message. Since we expect messages in
    this tube to be a JSON string, we decode it. We do whatever is needed to run the
    report and then use `->delete($job)` to delete the job from the queue. If we encounter
    any errors, we instead use `->release($job)` to release the job back to the queue
    so another worker can try again in the future.


    ### Keeping the worker running


    This logic is wrapped in a `while (true) {}` loop, and once our worker is finished
    with a job, it will attempt to grab another message. Doing so turns our script
    into a daemon or long-running process. It will try to reserve messages until it
    crashes (if it ever does) or is otherwise interrupted.


    Using a `while()` loop is easy but not the best when it comes to memory usage.
    PHP’s garbage collector, an internal process the engine uses to clean up memory
    from unused variables and data, has gotten vastly better since PHP 5.3. Still,
    depending on how your worker script is structured, there may be situations where
    the garbage collector cannot clean up everything you expect, and this can cause
    memory usage to rise over time.


    The easiest way to stop this is to allow your worker to run on only so many tasks
    before it dies. For example, we may swap out the `while()` loop for a `for()`
    loop and only process 100 jobs before we stop (Listing 4).


    **Listing 4.**


    ```


    ```


    What can we do to keep the process running? One option, if you have the `[pcntl`
    extension](https://www.php.net/manual/en/book.pcntl.php) installed, is to register
    a shutdown function that restarts the script. We can call `pcntl_exec()` with
    the current process information to spawn a second process right before our script
    ends. See Listing 5.


    **Listing 5.**


    ```


    ```


    `$_SERVER[''_'']` contains the program that was executed, which is normally the
    path to PHP itself. `$argv` contains all of the arguments supplied to the command,
    like the script name and any additional arguments. Since we are restarting the
    job, we can just re-use all the supplied information to restart the process.'
