  trans: "\n\n1. **选择 3-5 位受访者并向他们寻求反馈。** 具体来说，这些受访者将就他们何时看到你处于最佳提供见解。理想情况下，你希望选择那些在你职业生涯不同阶段都认识你的人，以增加获得多样化回答的可能性。\n\
    2. **识别他们回答中的模式。** 当我第一次完成这个练习时，我发现了一个共同的主题——人们认为我擅长公开演讲。在当时，公开演讲的想法让我非常恐惧，但知道其他人将其视为一种优势，有助于我采取有意识的步骤，开始更多地关注这一领域。\n\
    3. **撰写你的自画像。** 这一步旨在撰写一份关于你如何看待自己以及潜力的书面自画像，但如果你很有艺术天赋，也可以尝试创作视觉自画像！在练习的这一步中，你正在整合他人分享关于你的信息，并利用这些反馈创建一个你对未来规划的愿景。\n\
    \n## 策略 #2：确定你想从事的导师类型。\n\n在我职业生涯早期，当我害怕成为导师时，我的抵触情绪之一是因为我并不了解可能参与的不同类型的导师指导。从我的角度来看，我当时认为导师必须对引导受导师（mentee）的整个职业生涯完全负责。导师指导似乎是一项极其艰巨的任务，由于不想可能毁掉他人的职业，我决定这不适合我。\n\
    \n我早该就知道导师指导可以以多种形式存在。在今天我作为导师的经验中，我与受导师是以正式身份合作了几个月，而另一些则是根据需要、以更非正式的方式建立了伙伴关系。\n\
    \n在你确定了自己的优势之后，在投入开始指导某人之前，确定哪种类型的导师指导最适合你至关重要。我在本文中重点关注的两种类型是非正式导师和正式导师。\n\n\
    ### 非正式导师指导\n在非正式导师指导中，目标通常是不指定的。导师和受导师通常是相互选择的，且结果通常不会被跟踪或衡量。你可能会通过技术聚会小组、部门社交活动，甚至仅仅通过在休息室与同事聊天来找到一位非正式受导师。\n\
    \n在非正式导师关系中，你和受导师在寻求连接机会时保持主动是至关重要的。虽然你可能没有与受导师正式建立目标或跟踪他们的进度，但寻找连接和扩展关系的机会可以帮助你确保他们仍然能从与你互动的时间中受益。\n\
    \n当你在非正式背景下与受导师合作时，向他们提供关于利用与你关系的最佳建议将很有帮助。例如，我通常建议我的非正式受导师带着具体问题联系我，并概述他们为解决某个问题已经采取的步骤。这样，无论是通过面对面会议还是邮件交流，我们都能充分利用我们共处的时间。\n\
    \n### 正式导师指导\n在正式导师指导中，导师和受导师通常根据某种兼容性进行配对。目标是建立的，且结果会被跟踪和衡量。正式导师关系可能通过人力资源部门领导的公司级倡议建立。例如，公司可能会为其实习生提供一项计划，让他们在实习期间正式与员工配对建立导师指导关系。\n\
    \n如果你正在考虑参与正式导师指导，关键的第一步是定义目的和时间表。从这个问题上反推：“当这段导师指导关系结束时，受导师应该能够做什么？”例如，你将专注于帮助你的受导师提高技术技能，还是为新的领导职位做准备？你将与他们合作\
    \ 6 个月还是一整年？你对这些问题的回答可以帮助你确定如何最好地构建导师关系，并为所有参与者建立清晰的预期。\n\n接下来，你应该确定具体如何衡量导师指导计划的有效性。这些指标可能包括能力评估、员工留存率、工作绩效提升率等。在正式导师指导计划中加入指标可以帮助你获得数据，显示计划的哪些部分最有效，如果你可能需要随着时间的推移增长和扩大计划，这将特别有用。\n\
    \n确定你导师方法的参数可以帮助你成为更有效的导师，因为这能让你更清晰地理解你试图与受导师完成什么。与其试图为受导师做任何事情，从一开始就设定清晰的焦点是帮助自己通向成功的绝佳方法。\n\
    \n## 策略 #3：在与受导师沟通时，专注于积极倾听。\n\n作为一名受导师，我有很多时候觉得我的导师并没有真正在听我的话。有时看起来，他们进入对话时，强调的是他们想告诉我的内容，而不是先听听我想分享的内容。我利用这些经历来提醒自己，作为一名导师，我最重要的责任之一就是倾听我的受导师的话。\n\
    \n积极倾听的一个方面是与你的受导师保持全神投入。虽然很容易想要多任务处理并将注意力同时分散到几个领域，但考虑这样做对你的受导师可能产生的影响是非常重要的。对于许多刚入职场且第一次与导师合作的受导师来说，仅仅是考虑为了个人利益而占用别人的时间就可能让他们感到不知所措。因此，全神投入并与你的受导师互动有助于提醒他们，你选择了花时间与他们一起工作，并在他们的职业旅程中指导他们。\n\
    \n你可以与受导师一起使用的另一种积极倾听策略是转述（paraphrasing）。有时当我与受导师交谈时，我可能在第一次并没有完全理解他们想告诉我的什么。例如，他们可能以非常宽泛或模糊的方式描述一个问题，但仍在寻求一个特定的结果。我并没有假设自己完全理解了所说的话，而是停下来转述我听他们说的信息。转述涉及用你自己的话重述他人的信息。我经常使用方便的句首来帮助我开始转述，例如：\n\
    \n* “我听你说的是……” \n* “根据我的理解，你觉得……” \n* “听起来你是在说……” \n\n转述让你在进入提供建议和反馈的下一步之前，获得与受导师达成共识的机会。\n\
    \n然而，即使有转述，有时也可能出现你对某些细节不清楚，需要在继续之前进行澄清的情况。作为导师，提问澄清性问题实际上是件好事。虽然提问可能会面临表现得不感兴趣或不投入的风险，似乎令人令畏，但澄清信息的过程可以向受导师证明，你正在积极倾听他们，并且需要更多了解他们提到的某些特定领域。\n\
    \n"
