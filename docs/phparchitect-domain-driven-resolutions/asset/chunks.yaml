    这种方法的主要“问题”在于它不符合挑战的特定要求，因此它并不真正构成所分析案例的有效答案。


    在更具真实的场景中，这可能是获取你所寻找的答案的方法。你可以看到，这种实现甚至更简洁，在某些情况下可能更受青。


    我对此有两个主要的顾虑：


    1. 代码组织没有像前者那样良好。

    2. 它需要引入一个*临时*（ad hoc）的 `toArray` 方法来匹配 `array_filter` 函数的签名，这使得使用 Collection
    失去了意义。


    在我看来，`array_filter` 函数强制第一个参数为数组而不是可迭代对象，是语言的一个缺陷。谁知道呢，也许未来会改变，但目前，这就是现实。


    解决此问题的第三种方法是为 Collection 提供一种自过滤的方法。这可能是有趣的，特别是如果这种过滤方法接收回调函数作为参数，从而赋予它极大的灵活性：


