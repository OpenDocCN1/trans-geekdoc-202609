  fmt: '

    In all, the original issue required not just one, but three separate passes to
    fully remediate the flawed code and keep our systems patched. Given how rapidly
    the team had to move to correct the issue, there’s always the potential that this
    latest version is still incomplete and will require more work down the road.


    ## The Scale of the Incident


    The open-source `Log4J` library is distributed by the Apache Foundation and used
    by most Java-based software you are probably familiar with. `Minecraft` uses it
    for logging, as does `Jenkins`. Even iCloud, Spotify and Oracle use it. Tesla
    vehicles run an embedded version of Java as part of their control interface that
    uses `Log4J`. Amazon uses it to power the [control planes behind most of AWS’
    infrastructure](https://aws.amazon.com/security/security-bulletins/AWS-2021-006/)
    as well.


    While this particular issue impacted Java and not PHP, there are several ways
    in which Java could impact our lives or our applications. Knowing that much of
    the AWS stack runs on Java means `any` application could have been impacted prior
    to Amazon patching their libraries. Anyone who uses `Jenkins` as a task runner
    or CI/CD platform could potentially be exposed. `Elasticsearch`, `Couchbase`,
    `Okta`, and even Debian [were all impacted by this vulnerability](https://heimdalsecurity.com/blog/?p=39256).
    Even if your code is 100% secure, there is a significant chance another component
    of your stack is not, and it’s up to you to keep track of all of those moving
    pieces to keep your application stable.


    In fact, over the last four months alone, [`Log4J` has been downloaded over 28
    million times](https://blog.sonatype.com/why-did-log4shell-set-the-internet-on-fire),
    placing it on the top 0.003% of Java modules in terms of popularity and usage.
    To put things in perspective, the PHP Monyog logging library [was downloaded just
    1 million times](https://packagist.org/packages/monolog/monolog/stats) over the
    same four-month period.


    As of December 20th, just ten days after public disclosure, the community was
    finally able to identify the sheer scale of the incident. An estimated [93% of
    cloud environments](https://phpa.me/darkreading-log4j-flaw) were vulnerable to
    the issues in `Log4J`—while not all of those environments are exposed to the public
    Internet, enough of them are that this is indeed the most critical vulnerability
    our community has faced to date.


    ## Where We Go From Here


    Some in the development community often criticize PHP for its reputation of being
    insecure. In reality, any language is only as secure as the coding practices leveraged
    by the developers who wield that language. It’s more often that insecure code
    slips through due to innocent mistakes only to be discovered when a package, library,
    or program receives unexpected popularity and attention.


    I wrote about my own experience on the receiving end of a similar apocalyptic
    security notice with a WordPress plugin [in the November issue](https://www.phparch.com/article/security-corner-no-bug-too-small/)
    of this magazine. I have no doubt some of the Apache team will be writing about
    their experience with `Log4J` for quite a while.


    In the meantime, the best we can do is ensure we always follow best practices
    and keep our projects secure.


    *   Track the OWASP Top Ten.

    *   Conduct rigorous code reviews.

    *   Perform both internal and external penetration tests against your applications.

    *   Update every library or component you use (whether they’re PHP-related or
    otherwise) to ensure a critical vulnerability like that found in `Log4J` doesn’t
    slip by.


    In other words, we keep doing what we do best with the sober understanding that
    this kind of bug could happen to any of us, at any time, in any of our applications.


