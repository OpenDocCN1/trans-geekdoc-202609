- raw: "To test this code—first, spin up a server that can act as a remote endpoint.\
    \ A simple way to do that is by running `php -S localhost:8000 output_json.php`.\
    \ Then, if you issue the command `OFFERS_ENDPOINT=http://localhost:8000 php run.php\
    \ count_by_price_range 200 500`, you’ll get `2` as a response and, if you use\
    \ `OFFERS_ENDPOINT=http://localhost:8000 php run.php count_by_vendor_id 84` you’ll\
    \ get `1`.\n\nTo filter results by any other criteria, such as Product Title,\
    \ you would have to:\n\n1.  Create a new `FilterIterator` class\n\n2.  Add a new\
    \ entry to `$subcommand2FilterMapping`\n\nThe first point will end with you having\
    \ a class such as Listing 5.\n\n**Listing 5.**\n\n```\n\n```\n\nAnd a mapping\
    \ defined like Listing 6.\n\n**Listing 6.**\n\n```\n\n```\n\nFinally, to test\
    \ it, run `OFFERS_ENDPOINT=http://localhost:8000 php run.php count_by_title_prefix\
    \ Ch` and you should get `1` as a result.\n\nOf course, the use of these filters\
    \ is by no means limited to counting elements. Once the sub-set is computed, you\
    \ can do whatever you need with them. In fact, you can use these filters as a\
    \ basis for the application of others if that makes sense for the problem you’re\
    \ looking to solve.\n\nAnother approach to getting these results would be to rely\
    \ on array filtering functions instead of FilterIterators, like Listing 7.\n\n\
    **Listing 7.**\n\n```\n\n```\n\nThe main “problem” with this is that it doesn’t\
    \ comply with the specific requirement of the challenge, so it doesn’t really\
    \ constitute a valid answer for the case under analysis.\n\nIn a more realistic\
    \ scenario, this could be a way to get the answers you’re looking for. You can\
    \ see how it is even a less verbose implementation, which could be preferred in\
    \ some situations.\n\nI have two main concerns about this:\n\n1.  The code is\
    \ not as well organized as the former.\n\n2.  It requires the introduction of\
    \ an *ad hoc* `toArray` method to match the `array_filter` function signature,\
    \ which makes using a Collection pointless.\n\nThe fact that the `array_filter`\
    \ function forces the first argument to be an array instead of something that\
    \ can be iterated over is, in my opinion, a language shortcoming. Who knows, perhaps\
    \ this will be changed in the future, but for the time being, this is the reality.\n\
    \nA third way to tackle this issue would be to provide a way for the Collection\
    \ to filter itself. That could be interesting, especially if this filtering method\
    \ got a callback as an argument, thus giving it a lot of flexibility:\n\n```\n\
    \n```\n\nI’d still be a bit skeptical about such an implementation in terms of\
    \ how that would play out in the long run, though. It seems like we might be putting\
    \ a little too much responsibility in the Collection class.\n\n## Conclusion\n\
    \nIn this article, you learned about Collections, Iterators in general, and FilterIterators\
    \ in particular.\n\nWhile the usage of Collections and, in general, advanced data\
    \ structures is not a very common practice when it comes to PHP, many new and\
    \ interesting tools are available to use to your advantage, especially if you’re\
    \ up-to-date with your PHP version.\n\nI hope I was able to poke your curiosity\
    \ and show you a bit of how you can structure your code to make it easier to read\
    \ and maintain over time.\n\n> ### Biography\n\n> \n\n> ![Mauro Chojrin](media/file27.jpg)Mauro\
    \ Chojrin is a PHP Trainer and Consultant. He has been involved in the IT Industry\
    \ since 1997 in a wide array of positions, including technical support, development,\
    \ team leadership, IT management, and teaching. He also maintains [his blog](https://academy.leewayweb.com)\
    \ and [YouTube channel](https://phpa.me/youtube-leeway) where he shares his knowledge\
    \ with the world.\n\n# PHP Puzzles: Infamous Fizz Buzz\n\n###### By Oscar Merida\n\
    \n> Let’s start the year looking at a classic interview question—Fizz Buzz. It’s\
    \ misused to screen applicants and may not be testing for what it thinks it is.\
    \ Nonetheless, it doesn’t hurt to be prepared if you encounter it. We’ll look\
    \ at various approaches to solve it.\n\n## Recap\n\nWrite a PHP script that prints\
    \ integers from 1 to some `$maximum`.\n\n1.  For multiples of 3, output “Fizz”\
    \ instead of the number\n\n2.  For multiples of 5, print “Buzz” instead of the\
    \ number\n\n3.  For multiples of both 3 and 5, print “FizzBuzz” instead of the\
    \ number\n\n## Why?\n\nIn [Why Can’t Programmers Program](https://phpa.me/codinghorror-why-cant),\
    \ Jeff Atwood popularized using Fizz Buzz and coding challenges like it. Hiring\
    \ programmers is challenging. Education and certifications can get you only so\
    \ far. Tests like these are designed to assess if a candidate thinks like a “real\
    \ programmer” in a reasonably short amount of time. But our daily work involves\
    \ discovery, investigation, and trial-and-error before we know what code we need\
    \ to write.\n\nReal-world problems are rarely as well defined as Fizz Buzz. In\
    \ a poor interview, you may not be given more than a couple of minutes to show\
    \ a solution or even iterate on your first one. It also excludes people who don’t\
    \ test well or don’t have esoteric programming knowledge memorized. The idea that\
    \ “most programmers can’t program” may not be true in the first place, as explained\
    \ by Justin Falcone in *[FizzBuzz and Folklore](https://phpa.me/medium-fizzbuzz)*.\n\
    \nCoding challenges are not going away from the interview process. If asked to\
    \ do one, ask yourself if the organization is a good fit. Why are they still using\
    \ it, and would you be happy at that job? If you do want that position, it can’t\
    \ hurt to be prepared.\n\n> For a deep-dive into the issue with screening applicants\
    \ this way, see Ed Barnards’ book The Fizz Buzz Fix: [Secrets to Thinking Like\
    \ an Experienced Software Developer](https://www.phparch.com/books/the-fizz-buzz-fix/).\n\
    \n## The Secret Sauce\n\nThe modulus operator is at the heart of any solution.\
    \ PHP uses `%` as the modulus operator. It’s a handy but seldom used operator.\
    \ Many programmers, particularly novices, may forget it exists. It complements\
    \ the division operator for integers by giving us the “remainder,” or what’s leftover\
    \ from long division.\n\nSix goes into 32 five times with a remainder of two.\n\
    \n```\necho  32 / 6; // 5.3333333333333\necho  32 % 6; // 2\n```\n\n## The Loop\
    \ Solution\n\nA straightforward initial solution is to loop through the given\
    \ range to produce our output.\n\n**Listing 1.**\n\n```\n\n```\n\nThat loop produces\
    \ the following output:\n\n```\n1 2 Fizz 4 Buzz Fizz 7 8 Fizz Buzz 11\nFizz 13\
    \ 14 FizzBuzz 16 17 Fizz 19 Buzz\nFizz 22 23 Fizz Buzz 26 Fizz 28 29\nFizzBuzz\
    \ 31 32 Fizz 34 Buzz Fizz 37 38\nFizz Buzz 41 Fizz 43 44 FizzBuzz 46 47\nFizz\
    \ 49 Buzz\n```\n\nAnother frequent mistake here is in getting the `if` expressions\
    \ in the wrong order. Make sure you include a case for integers that are multiples\
    \ of both 3 and 5.\n\n## Improving the Loop\n\nOne improvement we can make to\
    \ our solution is to put the `if` logic for what to print out into a function.\
    \ I’m not a fan of functions that echo values. Doing so is an unintended side\
    \ effect and assumes you want to display the result to `STDOUT`. Instead, I prefer\
    \ to return the string and let the calling code decide how to handle it.\n\n**Listing\
    \ 2.**\n\n```\n\n```\n\nThe output is identical in both cases. However, we’ve\
    \ taken a big step in maintainability. The loop code isn’t mingled with the logic\
    \ for figuring out what string to output. More so, we’ve documented our function\
    \ by using type hints for arguments and our function’s return value. Another developer\
    \ who reads the signature knows to pass an integer value and can expect to get\
    \ some a string value. I try to avoid long chains of `if-else` statements in my\
    \ code. Reading code with nested `if`s is challenging. Here, I opted to return\
    \ a value as soon as possible, so I don’t need to chain a bunch of `elseif` clauses.\
    \ One minor optimization I added was to check if a number is divisible by 15 instead\
    \ of doing two checks for divisibility by 3 and 5.\n\n## No Loop\n\nCan we do\
    \ this without a loop? Of course! We can use our `FizzBuzzResult()` function and\
    \ PHP’s native array functions for a more, well, functional approach.\n\n```\n\
    \n```"
