    \ your terminal window on your host computer. You will need to use your new password\
    \ now to log in.\n\n## Conclusion\n\nYou now have a Raspberry Pi that is fully\
    \ configured! This concludes our first installment of *How to Hack your Home with\
    \ a Raspberry Pi*. In the next installment, we will install a full LAMP stack.\
    \ Until next month, I hope you have fun playing around with your Pi!\n\n> ###\
    \ Biography\n\n> \n\n> ![Ken Marks](media/file25.jpg)Ken Marks has been working\
    \ in his dream job as a Programming Instructor at Madison College in Madison,\
    \ Wisconsin, teaching PHP web development using MySQL since 2012. Prior to teaching,\
    \ Ken worked as a software engineer for more than 20 years, mainly developing\
    \ medical device software. Ken is actively involved in the PHP community, speaking\
    \ and teaching at conferences. [@FlibertiGiblets](https://twitter.com/FlibertiGiblets)\n\
    \n# Five Strategies for Becoming an Effective Mentor\n\n###### By Olivia Liddell\n\
    \n> One of the most pivotal moments in my career happened about ten years ago.\
    \ I was a few weeks away from finishing the teacher residency program that I had\
    \ been a part of for the past year. As part of the final phase of the program,\
    \ the director gave me a call to inform me of my permanent classroom placement\
    \ for the following year.\n\nI was hoping to get placed at a school with all of\
    \ my friends who had been in my residency cohort so that we could continue to\
    \ support each other in our first steps as full-time Chicago Public Schools teachers.\
    \ However, I soon realized that the director had different plans for me. As we\
    \ spoke on the phone, he explained that while the rest of my friends would be\
    \ together in a cluster of schools, I was being assigned to a different school\
    \ where I didn’t yet know anyone. He decided to place me there because he and\
    \ the other residency program leaders saw a lot of potential in me to succeed\
    \ not only as a teacher but also as a mentor. They assigned me to that school\
    \ so that they could fast-track me on the path to start mentoring new teacher\
    \ trainees within a couple of years.\n\nAt that point in my career, I had had\
    \ several mentors (both formal and informal), but I had never really mentored\
    \ anyone myself. As the program director continued to describe how excited he\
    \ was for me to go down this path, all I could do was nod my head, try not to\
    \ panic, and begin figuring a way to get out of it.\n\nI’d love to be able to\
    \ say that what happened next was that I faced my fears head-on, went to my assigned\
    \ school with an open mind, and fully embraced the challenge of becoming a mentor.\
    \ But that didn’t happen. Over the next month, I found an opening at a different\
    \ school in the network that was actually a better fit for my teaching interests\
    \ (middle school Arabic) and got permission to transfer there.\n\nHowever, the\
    \ topic of mentoring continued to linger in my mind for years to come. As I looked\
    \ back on that conversation with my program director, I eventually came to realize\
    \ that part of my reluctance to step into the role of a mentor came from the fact\
    \ that I didn’t know how to mentor anyone. I didn’t want to take on the task of\
    \ mentoring someone else and trying to help them shape their career when I actually\
    \ had no idea how to do that.\n\nBut then, as I reflected back on the mentors\
    \ that I’ve had over the years, I started taking small steps to identify specific\
    \ strategies that were most helpful for me as a mentee and also approaches that\
    \ I felt were ineffective and could have been better. I used this as the basis\
    \ of learning about mentoring and continued to take training and do more research\
    \ to improve my skills. Mentoring has become something that I am incredibly passionate\
    \ about because of how much potential it has to help others discover new ideas\
    \ and make advancements in their careers.\n\nSo, how do you become an effective\
    \ mentor? This article explores five key strategies to help you get started with\
    \ mentoring or improve your already existing mentoring practice. As you read this\
    \ article, I encourage you to reflect on your past experiences with mentoring\
    \ (both as a mentor and as a mentee) and think about which strategies most resonate\
    \ with you.\n\n**Strategy #1: Identify your strengths.**\n\nOne of the most common\
    \ misconceptions that I have heard from people who are interested in mentoring\
    \ but afraid to get started is that they feel they don’t have anything to offer\
    \ to anyone else. To me, one of the best things about mentoring is the opportunity\
    \ for you to choose exactly which parts of yourself you want to highlight when\
    \ you are choosing to help someone else. In other words, you don’t have to be\
    \ an expert in everything to be able to provide value to others.\n\nTake a moment\
    \ to think about some of the places where you might have seen mentoring in pop\
    \ culture. Two of the best examples of this that come to mind are the reality\
    \ TV shows *Shark Tank* and *The Voice*. On both of these shows, contestants get\
    \ to choose which panelists they want as mentors—for investing in their business\
    \ or coaching them to win the singing competition. This choice is typically based\
    \ on some level of compatibility between the contestants’ interests and panelists’\
    \ areas of expertise. For instance, someone launching a sports-themed business\
    \ on *Shark Tank* would most likely choose to be mentored by Mark Cuban (owner\
    \ of the Dallas Mavericks basketball team) over other panelists whose business\
    \ interests are in other areas.\n\nWhich leads to the question: What are some\
    \ of the reasons why someone might choose *you* to be their mentor? Uncovering\
    \ your strengths can help you determine which of your strengths and skills might\
    \ be the most useful for you to put forward and offer to potential mentees.\n\n\
    I have found a lot of value throughout my career in focusing on specific areas\
    \ that I can help mentees with, rather than casting a much broader net. To give\
    \ you an idea of how this might look for you, some of the areas that I’ve focused\
    \ on recently with mentees include public speaking, transitioning from classroom\
    \ teaching into other careers, and developing strategies to help prepare for certification\
    \ exams.\n\nIf you find yourself getting stuck with identifying your strengths,\
    \ consider taking some time to complete the Reflected Best Self Exercise. This\
    \ exercise is a tool to help you uncover and reflect on the times when you were\
    \ at your best, based on the feedback that you receive from people who know you\
    \ best."
