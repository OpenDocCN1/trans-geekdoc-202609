- raw: "So, let’s say you have your Raspberry Pi, and you don’t have a keyboard or\
    \ extra monitor laying about, or like me, you forgot all of that (and the magic\
    \ HDMI dongle that came with your Raspberry Pi Zero W kit)! Your only option at\
    \ this point is to perform a headless configuration on your Pi. That’s a good\
    \ thing because it’s usually the easiest option.\n\nTo create a headless configuration,\
    \ we need to modify the contents of the SD card so that when the Raspberry Pi\
    \ boots, it will:\n\n*   Allow us to SSH into the Raspberry Pi\n\n*   Connect\
    \ the Pi to our Wi-Fi router\n\nRe-insert your SD card back into your SD card\
    \ reader.\n\nOpen up a terminal window and navigate to the root folder of your\
    \ SD card. I’m on a Mac and will go to `/Volumes/boot`:\n\nTo enable SSH, we need\
    \ to create an empty file called `ssh` in the `boot` folder of the SD card. Type\
    \ the following command in the terminal window:\n\n```\n\n```\n\nNext, we need\
    \ to add our Wi-Fi network information. For that, we need to create a file called\
    \ `wpa_supplicant.conf` and put it in the `boot` folder of the SD card. Type the\
    \ following command in the terminal window to create the `wpa_supplicant.conf`\
    \ file:\n\n```\n\n```\n\nNext, we need to edit the `wpa_supplicant.conf` file\
    \ and add our Wi-Fi network SSID and password. Paste the following into the editor,\
    \ and update the country code as needed, and your network SSID and password:\n\
    \n```\ncountry=US\nctrl_interface=DIR=/var/run/wpa_supplicant GROUP=netdev\nupdate_config=1\n\
    \nnetwork={\n    ssid=\"NETWORK-NAME\"\n    psk=\"NETWORK-PASSWORD\"\n}\n```\n\
    \nSave the file and exit your editor.\n\nEject the SD card and insert it into\
    \ the Raspberry Pi\n\n* * *\n\nMitch Allen has a [complete set of instructions](https://phpa.me/desertbot-pi-wifi-setup)\
    \ for how to create a headless configuration for your Raspberry Pi that covers\
    \ all the major operating systems of your host computer.\n\n### Direct configuration\n\
    \nDirect configuration requires connecting a USB keyboard and HDMI monitor up\
    \ to your Pi. Some Raspberry Pis require dongles to connect a standard HDMI cable\
    \ and USB keyboard. The Pi Zero even comes with a USB dongle.\n\nInsert the SD\
    \ card into your Raspberry Pi\n\nConnect your Pi to a monitor and a keyboard.\n\
    \nConnect your power supply to your Pi and plug the power supply into a mains\
    \ A/C wall socket.\n\nAfter the Raspberry Pi boots up, log in with the user `pi`\
    \ and the default password of `raspberry`.\n\nNext, we need to add our Wi-Fi network\
    \ information. For that, we need to create a file called `wpa_supplicant.conf`\
    \ and put it into the `/etc/wpa_supplicant/` folder. We will be using the built-in\
    \ `nano` editor to create the `wpa_supplicant.conf` file. Since this file requires\
    \ `root` access, we have to create this file as *superuser*. Type the following\
    \ command in the command-line terminal:\n\n```\n\n```\n\nNow let’s edit the `wpa_supplicant.conf`\
    \ file and add our Wi-Fi network SSID and password. Paste the following into the\
    \ editor, and update the country code as needed, and your network SSID and password:\n\
    \n```\ncountry=US\nctrl_interface=DIR=/var/run/wpa_supplicant GROUP=netdev\nupdate_config=1\n\
    \nnetwork={\n    ssid=\"NETWORK-NAME\"\n    psk=\"NETWORK-PASSWORD\"\n}\n```\n\
    \nType `^O` to write out the file and `^X` to exit the `nano` editor.\n\nNext,\
    \ we’re going to run the `raspi-config` tool so that your Pi will allow SSH connections.\
    \ Run the following command as *superuser* to display the main screen of the `raspi-config`\
    \ tool.\n\n```\n\n```\n\n![Main Screen: Select Interface Options](media/file17.png)\n\
    \nMain Screen: Select Interface Options\n\nUsing the *arrow* keys, highlight `3\
    \ Interface Options` and press `Enter`, and the *Interface Options* screen will\
    \ be displayed:\n\n![Interface Options: Select SSH](media/file18.png)\n\nInterface\
    \ Options: Select SSH\n\nUsing the *arrow* keys, highlight `I2 SSH` and press\
    \ `Enter`, and a dialog asking, “Would you like the SSH server to be enabled?”\
    \ will pop up. Select `Yes` and press `Enter`.\n\nPress `Enter` after the dialog,\
    \ “The SSH server is enabled” pops up, and you will be returned to the *main*\
    \ screen of the `raspi-config` tool. Using the tab key, select `<Finish>` and\
    \ press `Enter`.\n\nType the following into the command-line terminal to shut\
    \ down the Raspberry Pi:\n\n```\n\n```\n\n### SSH into your Pi\n\nNow connect\
    \ the power supply to your Raspberry Pi and plug it into A/C mains.\n\nAfter a\
    \ few minutes, type the following into a terminal to remove any previous SSH keys\
    \ generated for the host `raspberrypi.local`:\n\n```\n\n```\n\nIf you receive\
    \ a *host not found* error, that’s okay. That just means you didn’t have any previous\
    \ SSH keys generated for `raspberrypi.local`.\n\nNext, SSH into your Pi with the\
    \ user `pi` by typing the following command into the terminal:\n\n```\n\n```\n\
    \nType in the default password of `raspberry`. If all goes well, you should be\
    \ logged in to your Raspberry Pi.\n\n### Run `raspi-config`\n\nAt this point,\
    \ you want to configure your Raspberry Pi for your locale settings, along with\
    \ changing the password. To do this, we will run the `raspi-config` program as\
    \ *superuser.*\n\nAssuming you are logged into your Pi using SSH, type the following\
    \ command into the terminal:\n\n```\n\n```\n\nYou should see the *raspi-config*\
    \ main screen displayed again.\n\nWe first need to make sure we have the latest\
    \ version of the `raspi-config` tool. Use the *arrow* keys to highlight `8 Update`\
    \ and tab over to the `<Select>` option and press `Enter`.\n\n`raspi-config` will\
    \ be updated to the latest version, and the *raspi-config* main screen will be\
    \ redisplayed with the *System Options* highlighted. Tab over to the `<Select>`\
    \ option and press `Enter`. The following *System Options* will be displayed,\
    \ allowing you to change your password:\n\n![System Options: Select Password](media/file19.png)\n\
    \nSystem Options: Select Password\n\nUse the *arrow* keys to highlight `S3 Password`\
    \ and tab over to the `<Select>` option and press `Enter`. Follow the instructions\
    \ to enter your new password. For purposes of this series, I’ll set mine to `pizerow`.\n\
    \nAfter changing your password, you will be taken back to the main screen of the\
    \ `raspi-config` tool. Next, we need to modify the *Interface Options* to allow\
    \ our Pi to use the GPIO bus and talk to our accelerometer sensor we will be connecting\
    \ to it later on. Use the *arrow* keys to highlight `3 Interface Options` and\
    \ tab over to the `<Select>` option and press `Enter`.\n\nWe specifically want\
    \ to enable the *I2C* bus, as that is the protocol our accelerometer will use\
    \ to communicate with the Pi. Use the *arrow* keys to highlight `I5 I2C` and tab\
    \ over to the `<Select>` option and press `Enter`.\n\nWhen you see this screen\
    \ asking, “Would you like the ARM I2C interface to be enabled?”, tab over to `<Yes>`\
    \ and press `Enter`.\n\nThen select `<Ok>`, and you will be taken back to the\
    \ main menu of the `raspi-config` tool.\n\nFinally, we will change our localization\
    \ options. Select 5 Localisation Options in the Main Screen.\n\nWe need to configure\
    \ our *Locale*, *Timezone*, and *WLAN Country*:\n\n![Raspi-config Localization\
    \ Options: Select Locale](media/file20.png)\n\nRaspi-config Localization Options:\
    \ Select Locale\n\nFirst the *Locale.*\n\nUsing the *arrow* keys, I will scroll\
    \ down until I find the selection of `en_GB.UTF-8 UTF-8`. Since I am not in the\
    \ United Kingdom, I will disable `en_GB.UTF-8 UTF-8` by pressing the *spacebar*:\n\
    \n![Configuring Locales: Disable en\\_GB.UTF-8](media/file21.png)\n\nConfiguring\
    \ Locales: Disable en\\_GB.UTF-8\n\nWhich will make the selection (denoted by\
    \ the asterisk) disappear. Then I will continue to use the *arrow* keys until\
    \ I find my locale. I’ll again use the *spacebar* to select my locale, which is\
    \ `en_US.UTF-8 UTF-8` since I live in the US.\n\nThen I’ll tab over, and select\
    \ `<Ok>` and I should see a screen asking me to pick the default locale for the\
    \ system:\n\n![Configuring Locales: Select en\\_US.UTF-8 as Default](media/file22.png)\n\
    \nConfiguring Locales: Select en\\_US.UTF-8 as Default\n\nUse the *arrow* keys\
    \ to select the *locale* you just added, tab over to `<Ok>`, and press `Enter`."
