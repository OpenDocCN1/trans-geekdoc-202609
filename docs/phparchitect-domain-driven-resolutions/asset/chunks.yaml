    # How to Hack your Home with a Raspberry Pi - Part 1 - Installing the OS and Configuring
    the Pi


    ### By Ken Marks


    > In September of 2017, I gave a talk called: ‘Hack your Home with a Raspberry
    Pi’ at the Madison PHP Conference. It was a half-day tutorial, walking participants
    through the process of configuring a Raspberry Pi, installing a LAMP stack on
    it, connecting a sensor, and ultimately having it send a text message to their
    phone.


    Since then, I have been running this as a lab for my Advanced PHP class I teach
    at our local community college, Madison College.


    One of the main reasons I gave this tutorial was to dispel the myth of the Internet
    of Things (IoT) being difficult. Sometimes people get scared away from writing
    code that talks to small embedded devices (i.e., sensors connected to Raspberry
    Pis or Arduino boards). My goal is to show you how easy it is to create a device
    that reports sensor data that you can get on a network. Along the way, you will
    see that deploying an application to a Raspberry Pi is just as simple as deploying
    to any Linux-based LAMP stack! \[should I say, it’s as easy as Pi :-)\]


    This article is the first of several in a series. I know `phparchitect` Magazine
    is a publication dedicated to PHP development, but I hope it doesn’t scare you
    that not the code you will be deploying/using in series will be PHP. In addition
    to `PHP` (and `SQL`), we will be using `C/C++` and `JavaScript`. We will be creating
    a couple of `UNIX` services as well. So come along on this journey with me as
    I show you how to hack your home with a Raspberry Pi!


    The goals for the whole series (can we call it a project?) are:


    * Installing the Raspberry Pi operating system

    * Configuring your Pi

    * Installing a `LAMP Stack` on your Pi

    * Connecting an accelerometer sensor to your Pi

    * Logging data from an accelerometer to a database

    * Creating and installing a `Unix Service` on your Pi

    * Building a Web Service for querying the accelerometer data

    * Building a plotting application to display the accelerometer data

    * Sending a text message to your phone using `SendMail`


    Wow! That’s a pretty big list which is why it will take several articles to cover.


    In this article, I will cover:


    * Installing the Raspberry Pi operating system

    * Configuring your Pi


    ## It starts with a story…


    My initial idea and motivation for this series ( starts with a story about our
    old clothes dryer, which quit working one day. I was tasked with replacing it.
    Everything was great, and I got kudos for getting a decent dryer. However, there
    was one annoying flaw with this new dryer. We do our laundry in the basement,
    and this new dryer chimes at us — very quietly — when the clothes are done. Our
