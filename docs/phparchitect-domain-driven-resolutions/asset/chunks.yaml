    # 工作坊：Apache 和 PHP - 回归基础


    ### 作者：Joe Ferguson


    > 这个月，我们将深入研究 [Apache](https://httpd.apache.org) 和 PHP 配置，以更好地理解 Web（HTTP）服务器与我们应用程序之间的关系。在开始学习
    PHP 时，教程和指南跳过 Web 服务器而更多地关注语言方面是非常常见的。PHP 开发者需要深刻地理解 Web 服务器是如何执行他们的代码的。因为服务器处理的请求和响应是
    Web 应用程序的主要目的。我们将安装 Apache、PHP 并审查配置，以确保我们的应用程序不仅运行良好，还能利用虚拟主机（Virtual Hosts）来提供多个应用程序。


    ![logo](img/file30.png)

    logo


    Apache 是一个于 1995 年发布的开源 HTTP 服务器，自 1996 年以来一直一直是互联网上最流行的 Web 服务器。我最早的 Apache 体验可以追溯到
    1998 年，在 Debian 和 Red Hat Linux 发行版上使用 PHP 和 Perl [通用网关接口](https://w.wiki/3QZ7)
    应用。在 1998 年能够在互联网上构建自己的 Web 服务器感觉是极具赋能感的。如今，静态网站托管在 S3 存储桶中或由热门的初创公司托管，开发者很容易忘记
    Web 服务器。


    我们将使用 Ubuntu 20.04 作为示例，但 Apache 几乎运行在任何你想要使用的 Linux 发行版上。这些示例在 Ubuntu 类发行版中均适用，但请务必参考你自己的发行版文档。在
    Red Hat、Centos 和类似的系统中，Apache 软件包被命名为 `httpd` 而不是 `apache2`；然而，配置选项是相同的。


    在 Ubuntu 上使用 `apt` 安装 Apache 和 PHP 将安装并配置几乎所有将 PHP 连接到 apache 的所需部分，这是通过 `libapache2-mod-php`
    包实现的，赋予了 Apache 运行我们 PHP 应用程序的能力。


    ```

    sudo apt install apache2 php libapache2-mod-php

    ```


    ## 配置与指令


    Apache 通过放置在特定文件夹结构中的纯文本指令进行配置。主配置文件是 `apache2.conf`。其余配置文件 `ports.conf` 以及 `conf-enabled`、`mods-enabled`
    和 `sites-enabled` 中的文件都被合并为 Apache 配置。结合了要监听的端口、通用语句或片段，以及启用了哪些服务器模块。最后包括哪些 HTTP
    服务在哪些设备上运行。虚拟主机是你告诉 Apache 如何运行我们应用程序的方式。


    PHP 配置在 Debian 派系统中位于 `/etc/php/`。Apache 的 PHP 配置将位于 `/etc/php/7.4/apache2/php.ini`。这种文件夹结构对于安装的每个
    PHP 版本遵循类似的模式。


    在 Ubuntu 系统上，我们将看到 `/etc/apache2` 的内容，我们的虚拟主机将放在 `sites-available` 中。我们可以使用 `a2ensite`
    命令选择性地启用站点，这将创建一个从 `/etc/apache/sites-available/our-virtualhost.conf` 到 `/etc/apache/sites-enabled/our-virtualhost.conf`
    的符号链接，允许我们轻松开启或关闭站点。在尝试特定站点的配置选项时，切换站点的功能非常有帮助。通过关闭不需要的站点或其他配置选项，可以更容易隔离运行配置。参见列表
    1。


    **列表 1.**


    ```

    /etc/apache2# tree -L 1

    .

    ├── apache2.conf├── conf-available

    ├── conf-enabled

    ├── envvars

    ├── magic

    ├── mods-available

    ├── mods-enabled

    ├── ports.conf

    ├── sites-available

    └── sites-enabled

    ```


    我们将保留 `apache2.conf` 的大部分默认设置，尽管它是用于更改或调整以下内容的文件：


    *   Apache 日志的格式，你可以在那里找到 `LogFormat` 定义

    *   日志的存储位置


