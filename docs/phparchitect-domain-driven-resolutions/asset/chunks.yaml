- raw: "![Text Message from Pi that Dryer is Off](media/file1.png)\n\nText Message\
    \ from Pi that Dryer is Off\n\n## List of essential components\n\nThe smallest\
    \ Raspberry Pi I can use for this project is the *Raspberry Pi Zero W*:\n\n![Raspberry\
    \ Pi Zero W](media/file2.jpg)\n\nRaspberry Pi Zero W\n\nIf you use a *Raspberry\
    \ Pi Zero W*, keep in mind that it only supports 2.4GHz wireless. So, if your\
    \ wireless router only supports 5GHz, you might want to use another model of the\
    \ Pi. The Pi 3 B+ and 4 B support 2.4 and 5GHz wireless ethernet. The upside of\
    \ using the Pi 3 B+ or 4 B is that you won’t have to do any soldering.\n\n###\
    \ Do I really need to learn how to solder?\n\n> What did the soldering iron say\
    \ to the capacitor? Go flux yourself!\n\nAll Raspberry Pis have a General Purpose\
    \ Input Output (GPIO) bus which is a duel-row male 40 pin header used to connect\
    \ sensors and other devices to the Pi:\n\n![Raspberry Pi 40pin header](media/file3.jpg)\n\
    \nRaspberry Pi 40pin header\n\nLater on, we’ll be connecting an accelerometer\
    \ sensor to the GPIO bus of the Pi. Because I’m using the Pi Zero W, I’ll have\
    \ to solder on a duel-row male 40 pin header onto the board to expose the GPIO\
    \ bus pins since the Pi Zero W board does not come with it pre-populated.\n\n\
    Here are a few photos of me soldering the header onto the Pi and 6 pins onto one\
    \ version of the accelerometer sensor:\n\n![Soldering Pins on Pi Zero W](media/file4.png)\n\
    \nSoldering Pins on Pi Zero W\n\n![40 Pin Header Soldered](media/file5.png)\n\n\
    40 Pin Header Soldered\n\n![Soldering Pins on Accelerometer](media/file6.png)\n\
    \nSoldering Pins on Accelerometer\n\n![Inserting Pi Zero W in Case](media/file7.png)\n\
    \nInserting Pi Zero W in Case\n\nAgain, you can use any Raspberry Pi, but I thought\
    \ it would be really cool to use a Raspberry Pi half the size of a credit card.\
    \ I recommend you use a Raspberry Pi with wireless ethernet built-in since that\
    \ will be the configuration I will document here.\n\n![Duel row 40 pin Male Header](media/file8.jpg)\n\
    \nDuel row 40 pin Male Header\n\n![40 Pin Ribbon Cable](media/file9.jpg)\n\n40\
    \ Pin Ribbon Cable\n\n![Figure 1. MMA8452 from Sparkfun](media/file10.jpg)\n\n\
    Figure 1. MMA8452 from Sparkfun\n\n![Figure 2. Keyes MMA8452Q from eBay](media/file11.jpg)\n\
    \nFigure 2. Keyes MMA8452Q from eBay\n\nOkay, let’s start a numbered list of the\
    \ five items we will need:\n\n1.  **Your computer**\n\n    You will need to have\
    \ a computer connected to the internet to download the Raspberry Pi Operating\
    \ System. Ideally, you will want to connect to your Pi via SSH from your computer.\
    \ I’m going to assume you are running some flavor of Unix (Ubuntu, MacOS, etc.).\
    \ However, there is plenty of information on the internet for communicating with\
    \ your Raspberry Pi if you have a Windows PC.\n\n2.  **Your home wireless router**\n\
    \n    I’m not going to go into how you configure this, as everyone is different.\
    \ I will assume you have one and go through a generic method for connecting to\
    \ it.\n\n3.  **Raspberry Pi**\n\n    I recommend getting a kit that includes a\
    \ case, a power supply, and an SD card. I get mine from [CanaKit](https://www.canakit.com),\
    \ but you can get one from Amazon or any other Raspberry Pi reseller).\n\n   \
    \ Here is a list of things associated with your Pi you might want to have\n\n\
    \    *   duel row 40 pin header (if you buy a Pi Zero W). You can get this from\
    \ [Amazon](https://phpa.me/amazon-40pin-duel).\n\n    *   soldering iron and solder\
    \ (if you buy a Pi Zero W)\n\n    *   case\n\n    *   power supply for Pi\n\n\
    \    *   SD card at least 8GB. (It’s probably not worth getting one less than\
    \ 16GB. I would recommend getting a card rated at UHS-1 or better. Most are).\n\
    \n    *   SD card reader. Many Raspberry Pi kits come with one that plugs into\
    \ the USB port of your computer.\n\n    *   HDMI cable (if you want to configure\
    \ your Pi with a keyboard and monitor)\n\n    *   keyboard (if you want to configure\
    \ your Pi with a keyboard and monitor)\n\n    *   monitor (if you want to configure\
    \ your Pi with a keyboard and monitor)\n\n4.  **Accelerometer**\n\n    There are\
    \ a lot of different accelerometer sensors available. I wanted one that uses the\
    \ I2C bus for this project — more on that later. There is a small C program we\
    \ will be using that communicates with an *MMA8452Q* triple-axis accelerometer.\
    \ There are two slightly different board types:\n\n    *   The MMA8452 shown in\
    \ Figure 1 can be purchased from [Sparkfun](https://www.sparkfun.com/products/13926).\n\
    \n    *   And the Keyes MMA8452Q, which can be purchased from [eBay](https://phpa.me/ebay-accelerometer).\
    \ See Figure 2.\n\n    The nice thing about the Keyes version is that it comes\
    \ pre-populated with the 6 pins already soldered in\n\n5.  **female to female\
    \ 4 pin ribbon cable to connect the accelerometer to Pi**\n\n    These typically\
    \ come as a 40 pin ribbon cable, and you peel off 4 wires to connect the accelerometer\
    \ to the GPIO bus of the Pi. You can purchase this from [Amazon](https://phpa.me/amazon-fem-jumper-40).\n\
    \n## Configuring your Raspberry Pi\n\nNow that we have all of our essential equipment\
    \ and components, we need to install an operating system and configure our Raspberry\
    \ Pi.\n\n### Downloading the Raspberry Pi OS image\n\nFirst, we need to get an\
    \ image of the Raspberry Pi Operating System (OS) and get it onto our SD card.\
    \ The best way to do that is to download the [*Raspberry Pi Imager*](https://www.raspberrypi.com/software/).\
    \ There are links to download the imager for MacOS, Windows, or Ubuntu on the\
    \ page. You can even use the *apt* package manager within a UNIX terminal window\
    \ to install the *Raspberry Pi Imager*. After downloading the Imager package for\
    \ your OS, follow the installation instructions.\n\nPlug your SD card reader into\
    \ your computer and insert the SD card you will be using for your Raspberry Pi.\n\
    \nLaunch the Raspberry Pi Imager, and you should see the main screen of the *Raspberry\
    \ Pi Imager*:\n\n![Main Screen of Raspberry Pi Imager: CHOOSE STORAGE](media/file12.png)\n\
    \nMain Screen of Raspberry Pi Imager: CHOOSE STORAGE\n\nSelect *CHOOSE STORAGE,*\
    \ and a *Storage* dialog should be displayed:\n\n![Raspberry Pi Imager Storage\
    \ Dialog](media/file13.png)\n\nRaspberry Pi Imager Storage Dialog\n\nSelect your\
    \ SD card - typically listed as *Generic MassStorageClass Media* and its size.\n\
    \nNow select *CHOOSE OS,* and the *Operating System* dialog should be displayed:\n\
    \n![Imager OS Dialog: Choose Raspberry Pi OS (other)](media/file14.png)\n\nImager\
    \ OS Dialog: Choose Raspberry Pi OS (other)\n\nSelect *Raspberry Pi OS (other),*\
    \ and the *Operating System* dialog will display a list of Raspberry Pi operating\
    \ systems to choose from:\n\n![Imager OS Dialog: Choose Raspberry Pi OS Lite (32-bit)](media/file15.png)\n\
    \nImager OS Dialog: Choose Raspberry Pi OS Lite (32-bit)\n\nSelect *Raspberry\
    \ Pi OS Lite (32-bit)* - a Linux server installation that will minimize the amount\
    \ of CPU utilization since we’re not doing a full desktop installation. You will\
    \ now be returned to the main screen of the *Raspberry Pi Imager*:\n\n![Main Screen\
    \ of Raspberry Pi Imager: WRITE](media/file16.png)\n\nMain Screen of Raspberry\
    \ Pi Imager: WRITE\n\nNow select *WRITE* to write the image to the SD card. You\
    \ will now see a *Warning* dialog, letting you know all existing data on your\
    \ SD card will be erased and ensure you want to continue. Select *YES*.\n\nYou\
    \ will usually see a *Permissions* dialog pop up asking you to enter your admin\
    \ password for your computer before you can write to your SD card.\n\nAfter entering\
    \ your credentials, the Raspberry Pi Imager will start writing the OS to your\
    \ SD card. When the write operation is complete, a *Write Successful* dialog should\
    \ be displayed. Select *CONTINUE,* and quit the *Raspberry Pi Imager* application.\
    \ You can now remove your SD card from your SD card reader.\n\nNow we need to\
    \ configure our Raspberry Pi. There are two ways you can do this:\n\n*   Headless\
    \ configuration\n\n*   Direct configuration\n\nI will first show you the headless\
    \ configuration as I find it’s the simplest. Then I will show you the direct configuration.\n\
    \n### Headless configuration"
