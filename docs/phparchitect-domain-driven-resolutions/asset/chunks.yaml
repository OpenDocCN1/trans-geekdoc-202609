    \ Or, in the words of Amit Yoran, CEO of cybersecurity company Tenable,\n\n> It\
    \ is by far the single biggest, most critical vulnerability ever.\n\nInjection\
    \ attacks are very common in modern software. They’re so common in fact that the\
    \ Open Web Application Security Project (OWASP) [considers them the third most\
    \ frequently seen](https://owasp.org/Top10/A03_2021-Injection/) category of application\
    \ security risks in the market. An injection vulnerability occurs any time untrusted\
    \ user input is passed directly to a critical component of an application—like\
    \ to the data layer (SQL) or to business logic that attempts to resolve a system\
    \ name (JNDI).\n\n## The Scope of the Incident\n\n[The initial security report](https://nvd.nist.gov/vuln/detail/CVE-2021-44228)\
    \ included all versions of Log4J through version 2.14.1. Given the trivial nature\
    \ of the exploit itself—attackers were able to remotely execute code on [Minecraft\
    \ servers by pasting a string in the in-game chat](https://twitter.com/MalwareTechBlog/status/1469290238702874625)—the\
    \ community moved rapidly to patch the issue.\n\nPerhaps too rapidly.\n\n[Log4J\
    \ 2.15.0 rolled out](https://us-cert.cisa.gov/node/17179) the same day the original\
    \ exploit was documented publicly. It was a Friday afternoon, but many engineers\
    \ worked late into the evening (or through the weekend) to patch their applications.\n\
    \nUnfortunately, the fix was incomplete. Just days later, researchers [discovered\
    \ another (related) vulnerability](https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2021-45046).\
    \ Many non-default configurations would allow for further exploitation of the\
    \ underlying bug. This could still allow for information leaks (the exfiltration\
    \ of environment secrets), remote code execution, or even denial of service attacks.\
