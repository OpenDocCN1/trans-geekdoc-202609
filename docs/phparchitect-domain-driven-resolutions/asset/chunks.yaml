    The other alternative is to use an external program like [supervisord](http://supervisord.org)
    to restart the process when it finishes. `supervisord` is a process monitor and
    makes sure that certain processes are always running. While we want our worker
    to always be running, we also need it to restart. Using a `for()` loop to stop
    after so many executions and letting the script end will force `supervisord` to
    restart the script, much like our `pcntl` option above.


    I use the `pcntl` option most of the time. Using `pcntl` requires an extension
    not normally installed on most hosts, but using `supervisord` requires the ability
    to install your own apps. Both options require some manual setup, so choose whichever
    works for you.


    ## Why Queues over Async/Multi-threading?


    I would argue the traditional multi-threaded paradigm would be better suited for
    background tasks compared to what is now called “async” programming. I would still
    recommend a queue-based system overall, though. You get the benefits of multi-threaded
    scaling without the headaches of writing a multi-threaded application.


    The main draw to async programming is that it avoids blocking processes and speeds
    up execution. In theory, using async programming will allow our report to process
    in the background while other things continue to run, like server web requests.
    In the real world, I find that is not what happens.


    Async programming does not resolve the blocking issue fully, no matter the language.
    It is very easy to write blocking code accidentally, and the additional effort
    it takes to write correct async code for very long tasks can be quite involved.
    Breaking down a procedural process into small async blocks can require refactoring
    quite a bit of code. That time could be better spent just writing workers, which
    will be easier for more developers to understand and maintain.


    That is on top of the fact that most PHP code is written to be blocking, and no
    amount of refactoring will change that. For example, you cannot use any of the
    normal `PDO` drivers for databases in async programming since the drivers are
    blocking. You have to use special database drivers that are async aware, which
    means your code is now coupled to the async driver. You also lose out on libraries
    like `Doctrine`, which, while they technically would work fine, the drivers they
    use (i.e., the `PDO` ones) are all blocking.


    Multi-threaded applications can get around the blocking issue to an extent. One
    thread will only block itself, so any other spawned threads will continue to work
    normally. The issue with multi-threading applications is that they can be harder
    to build and maintain, and there is a lot of boilerplate code just to spawn, watch,
    and make sure child threads are working.


    Writing a general worker usually requires very little change to how most PHP developers
    think about programming. Workers take a job off the queue, work on it procedurally,
    and then do it all over again in a simple loop. Scaling workers is as simple as
    just starting more workers.


    ## Queue up that work


    This article should give you a good base to start adding background workers to
    your application. The traditional worker-queue setup is robust enough for many
    workloads. There are many ways to scale, like more feature-rich queues or expanding
    your workers to be containerized or functions.


    So take a look and see if adding a queue system to your app can help speed things
    up or make things better for your users.


