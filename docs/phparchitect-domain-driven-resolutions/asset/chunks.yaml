  trans: "\n\n假设你已经有一台树莓派（Raspberry Pi），但手头没有键盘或额外的显示器，或者像我一样，把这些忘了（还有树莓派 Zero W 套件附带的魔法\
    \ HDMI 转接器）！此时你唯一的选择是对你的派进行无头配置（headless configuration）。这是一件好事，因为这通常是最简单的选项。\n\
    \n要创建无头配置，我们需要修改 SD 卡的内容，以便树莓派在启动时：\n\n* 允许我们 SSH 登录树莓派\n* 将派连接到我们的 Wi-Fi 路由器\n\
    \n将 SD 卡插回读卡器。\n\n打开终端窗口并进入 SD 卡的根目录。我使用的是 Mac，将进入 `/Volumes/boot`：\n\n要启用 SSH，我们需要在\
    \ SD 卡的 `boot` 文件夹中创建一个名为 `ssh` 的空文件。在终端窗口中输入以下命令：\n\n```\n\n```\n\n接下来，我们需要添加\
    \ Wi-Fi 网络信息。为此，我们需要创建一个名为 `wpa_supplicant.conf` 的文件，并将其放在 `boot` 文件夹中。在终端窗口中输入以下命令创建\
    \ `wpa_supplicant.conf` 文件：\n\n```\n\n```\n\n接下来，我们需要编辑 `wpa_supplicant.conf`\
    \ 文件并添加我们的 Wi-Fi 网络 SSID 和密码。将以下内容粘贴到编辑器中，根据需要更新国家代码以及你的网络 SSID 和密码：\n\n```\n\
    country=US\nctrl_interface=DIR=/var/run/wpa_supplicant GROUP=netdev\nupdate_config=1\n\
    \nnetwork={\n    ssid=\"NETWORK-NAME\"\n    psk=\"NETWORK-PASSWORD\"\n}\n```\n\
    \n保存文件并退出编辑器。\n\n弹出 SD 卡并将其插入树莓派。\n\n***\n\nMitch Allen 提供了一套[完整的操作说明](https://phpa.me/desertbot-pi-wifi-setup)\
    \ 教教你如何为你的树莓派创建无头配置，涵盖了你主机电脑的所有主流操作系统。\n\n## 直接配置\n\n直接配置需要将 USB 键盘和 HDMI 显示器连接到你的派（Pi）上。某些树莓派需要转接器来连接标准的\
    \ HDMI 线缆和 USB 键盘。Pi Zero 甚至附带了一个 USB 转接器。\n\n将 SD 卡插入你的树莓派。\n\n将你的派连接到显示器和键盘。\n\
    \n将电源连接到你的派，并将电源插上交流电墙插座。\n\n在树莓派启动后，使用用户 `pi` 和默认密码 `raspberry` 登录。\n\n接下来，我们需要添加我们的\
    \ Wi-Fi 网络信息。为此，我们需要创建一个名为 `wpa_supplicant.conf` 的文件，并将其放入 `/etc/wpa_supplicant/`\
    \ 文件夹。我们将使用内置的 `nano` 编辑器创建 `wpa_supplicant.conf` 文件。由于此文件需要 `root` 权限，我们必须以超级用户（superuser）身份创建此文件。在命令行终端中输入以下命令：\n\
    \n```\n\n```\n\n现在让我们来编辑 `wpa_supplicant.conf` 文件并添加我们的 Wi-Fi 网络 SSID 和密码。将以下内容粘贴到编辑器中，根据需要更新国家代码以及你的网络\
    \ SSID 和密码：\n\n```\ncountry=US\nctrl_interface=DIR=/var/run/wpa_supplicant GROUP=netdev\n\
    update_config=1\n\nnetwork={\n    ssid=\"NETWORK-NAME\"\n    psk=\"NETWORK-PASSWORD\"\
    \n}\n```\n\n输入 `^O` 保存文件，输入 `^X` 退出 `nano` 编辑器。\n\n接下来，我们将运行 `raspi-config` 工具，以便你的派允许\
    \ SSH 连接。以超级用户身份运行以下命令，以显示 `raspi-config` 工具的主界面。\n\n```\n\n```\n\n![主界面：选择接口选项](img/file17.png)\n\
    \n主界面：选择接口选项\n\n使用 `arrow` 键高亮 `3 Interface Options` 并按 `Enter`，将显示 `Interface\
    \ Options` ：\n\n![接口选项：选择 SSH](img/file18.png)\n\n接口选项：选择 SSH\n\n使用 `arrow` 键高亮\
    \ `I2 SSH` 并按 `Enter`，会弹出一个对话框询问：“你想要启用 SSH 服务器吗？”。选择 `Yes` 并按 `Enter`。\n\n在弹出“The\
    \ SSH server is enabled”对话框后按 `Enter`，你将返回 `raspi-config` 工具的 `main` 主界面。使用 Tab\
    \ 键选择 `<Finish>` 并按 `Enter`。\n\n在命令行终端中输入以下命令关闭树莓派：\n\n```\n\n```\n\n## SSH 登录你的派\n\
    \n现在将电源连接到你的树莓派并插上交流电。\n\n几分钟后，在终端中输入以下命令以删除为主机 `raspberrypi.local` 生成的任何之前的 SSH\
    \ 密钥：\n\n```\n\n```\n\n如果你收到 `host not found` 错误也没关系。这意味着你之前没有为 `raspberrypi.local`\
    \ 生成过任何 SSH 密钥。\n\n接下来，在终端中输入以下命令，使用用户 `pi` SSH 登录你的派：\n\n```\n\n```\n\n输入默认密码\
    \ `raspberry`。如果一切顺利，你应该已经登录到了你的树莓派。\n\n## 运行 `raspi-config`\n\n此时，你想要为你的树莓派配置本地区域设置，并更改密码。为此，我们将以超级用户身份运行\
    \ `raspi-config` 程序。\n\n假设你已经通过 SSH 登录了派，在终端中输入以下命令：\n\n```\n\n```\n\n你应该会再次看到\
    \ `raspi-config` 的主界面。\n\n首先，我们需要确保我们拥有最新版本的 `raspi-config` 工具。使用 `arrow` 键高亮\
    \ `8 Update`，并切换到 `<Select>` 选项并按 `Enter`。\n\n`raspi-config` 将更新到最新版本，并重新显示 `raspi-config`\
    \ 主界面，同时高亮 `System Options`。切换到 `<Select>` 选项并按 `Enter`。将显示以下 `System Options`，允许你更改密码：\n\
    \n![系统选项：选择密码](img/file19.png)\n\n系统选项：选择密码\n\n使用 `arrow` 键高亮 `S3 Password`，并切换到\
    \ `<Select>` 选项并按 `Enter`。按照指令输入你的新密码。为了本系列教程，我会将我的设置为。\n\n更改密码后，你将回到 `raspi-config`\
    \ 的主界面。接下来，我们需要修改 `Interface Options`，以便你的派允许通过 GPIO 与连接的传感器。使用 `arrow` 键高亮 `3\
    \ Interface Options` 并切换到 `<Select>` 选项并按 `Enter`。\n\n我们特别想要启用 `I2C` 总线，因为这是传感器通信的协议。使用\
    \ `arrow` 键高亮 `I5 I2C` 并切换到 `<Select>` 选项并按 `Enter`。\n\n当你看到“Would you like the\
    \ I2C interface to be enabled?” 屏幕时，切换到 `<Yes>` 并按 `Enter`。\n\n然后选择 `<Ok>`，你将回到\
    \ `raspi-config` 的主菜单。\n\n最后，我们将更改本地化选项。在主界面选择 5 Localisation Options。\n\n我们需要配置\
    \ `Locale`、`Timezone` 和 `WLAN Country`：\n\n![Raspi-config 本地化选项：选择语言](img/file20.png)\n\
    \nRaspi-config 本地化选项：选择语言\n\n首先是 `Locale.`\n\n使用 `arrow` 键向下滚动直到找到 `en_GB.UTF-8\
    \ UTF-8`。由于我不在英国，我将通过按下 `spacebar` 禁用 `en_GB.UTF-8 UTF-8`：\n\n![配置语言：禁用 en_GB.UTF-8](img/file21.png)\n\
    \n配置语言：禁用 en_GB.UTF-8\n\n这将选择（由星号表示）消失。然后我将继续使用 `arrow` 键直到找到我的语言。我将再次使用 `spacebar`\
    \ 选择我的语言，即 `en_US.UTF-8 UTF-8`，因为我住在美国。\n\n然后我切换并选择 `<Ok>`，我应该看到一个要求选择系统默认语言的屏幕：\n\
    \n![配置语言：选择 en_US.UTF-8 为默认](img/file22.png)\n\n配置语言：选择 en_US.UTF-8 为默认\n\n使用\
    \ `arrow` 键选择你刚刚添加的 `locale`，切换到 `<Ok>` 并按 `Enter`。\n\n"
