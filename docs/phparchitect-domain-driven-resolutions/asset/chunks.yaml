- raw: "In all, the original issue required not just one, but three separate passes\
    \ to fully remediate the flawed code and keep our systems patched. Given how rapidly\
    \ the team had to move to correct the issue, there’s always the potential that\
    \ this latest version is still incomplete and will require more work down the\
    \ road.\n\n## The Scale of the Incident\n\nThe open-source Log4J library is distributed\
    \ by the Apache Foundation and used by most Java-based software you are probably\
    \ familiar with. Minecraft uses it for logging, as does Jenkins. Even iCloud,\
    \ Spotify and Oracle use it. Tesla vehicles run an embedded version of Java as\
    \ part of their control interface that uses Log4J. Amazon uses it to power the\
    \ [control planes behind most of AWS’ infrastructure](https://aws.amazon.com/security/security-bulletins/AWS-2021-006/)\
    \ as well.\n\nWhile this particular issue impacted Java and not PHP, there are\
    \ several ways in which Java could impact our lives or our applications. Knowing\
    \ that much of the AWS stack runs on Java means *any* application could have been\
    \ impacted prior to Amazon patching their libraries. Anyone who uses Jenkins as\
    \ a task runner or CI/CD platform could potentially be exposed. Elasticsearch,\
    \ Couchbase, Okta, and even Debian [were all impacted by this vulnerability](https://heimdalsecurity.com/blog/?p=39256).\
    \ Even if your code is 100% secure, there is a significant chance another component\
    \ of your stack is not, and it’s up to you to keep track of all of those moving\
    \ pieces to keep your application stable.\n\nIn fact, over the last four months\
    \ alone, [Log4J has been downloaded over 28 million times](https://blog.sonatype.com/why-did-log4shell-set-the-internet-on-fire),\
    \ placing it on the top 0.003% of Java modules in terms of popularity and usage.\
    \ To put things in perspective, the PHP Monyog logging library [was downloaded\
    \ just 1 million times](https://packagist.org/packages/monolog/monolog/stats)\
