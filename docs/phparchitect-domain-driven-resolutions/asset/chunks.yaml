- raw: "Look, Ma! No loop. I use [range()](https://php.net/range) to initialize an\
    \ array with the numbers 1 to 50. Then, [array\\_map()](https://php.net/array_map)\
    \ does the hard work. It passes every element in our `$numbers` array to `FizzBuzzResult()`\
    \ and returns an array with the result for each. If you peek at this array before\
    \ we echo it, it looks like the `var_dump()` below. Keep in mind that arrays are\
    \ zero-indexed. The first element in our original array was the integer value\
    \ `1` at index `0`:\n\n**Listing 3.**\n\n```\nphp > var_dump($numbers);\narray(50)\
    \ {\n  [0]=>\n  string(1) \"1\"\n  [1]=>\n  string(1) \"2\"\n  [2]=>\n  string(4)\
    \ \"Fizz\"\n  [3]=>\n  string(1) \"4\"\n  [4]=>\n  string(4) \"Buzz\"\n  [5]=>\n\
    \  string(4) \"Fizz\"\n  [6]=>\n  string(1) \"7\"\n  [7]=>\n  string(1) \"8\"\n\
    \  [8]=>\n  string(4) \"Fizz\"\n  [9]=>\n  string(4) \"Buzz\"\n  [10]=>\n  string(2)\
    \ \"11\"\n  [11]=>\n  string(4) \"Fizz\"\n  [12]=>\n  string(2) \"13\"\n  [13]=>\n\
    \  string(2) \"14\"\n  [14]=>\n  string(8) \"FizzBuzz\"\n  [15]=>\n```\n\nOtherwise,\
    \ the output from [join()](https://php.net/join) is identical to our earlier solutions.\
    \ For very large number ranges, this solution uses more memory since we’re using\
    \ arrays. But the functional approach means there are no unintended side effects\
    \ from each step. Once you’re familiar with PHP’s specialized array functions,\
    \ you can use them to operate on arrays without constantly writing loops. This\
    \ approach would be well suited to doing something else with `$numbers` after\
    \ it’s run through `array_map()`, like if we’d been asked to count the occurrences\
    \ of `Fizz`, `Buzz`, and `FizzBuzz` in a given range.\n\n## Idiomatic Php\n\n\
    Type hints and functions are all well and good, but what would a solution that\
    \ leverages PHP’s type coercion and built-in operators look like? It might venture\
    \ close into the realm of too-clever code that you’d hate to maintain. It should\
    \ look something like this:\n\n```\n\n```\n\nShort and … sweet? I use the ternary\
    \ operator to append either FizzBuzz, Fizz, Buzz, or nothing to `$result`. When\
    \ I go to output the value, if `$result` is empty PHP displays the initial number.\
    \ It works, but it takes brainpower to understand what’s going on and it needs\
    \ effort to extend.\n\n### Integer Factors\n\nFor next month’s puzzle, given a\
    \ positive integer, write a PHP script that finds and outputs the pairs of positive\
    \ integers that can be multiplied, in any order, to equal that integer.\n\nFor\
    \ example, given the integer 24, your script should output:\n\n```\n1,24\n2,12\n\
    3,8\n4,6\n```\n\n**Bonus:** For any positive or negative integer, output the pairs\
    \ of integers that can be multiplied to equal that integer.\n\n> Some Guidelines\
    \ And Tips\n\n> \n\n> *   The puzzles can be solved with pure PHP. No frameworks\
    \ or libraries are required.\n\n> *   Each solution is encapsulated in a function\
    \ or a class, and I’ll give sample output to test your solution against.\n\n>\
    \ *   You’re encouraged to make your first attempt at solving the problem without\
    \ using the web for clues.\n\n> *   Refactoring is encouraged.\n\n> *   I’m not\
    \ looking for speed, cleverness, or elegance in the solutions. I’m looking for\
    \ solutions that work.\n\n> *   Go ahead and try many solutions if you like.\n\
    \n> *   PHP’s interactive shell (`php -a` at the command line) or 3rd party tools\
    \ like [PsySH](https://psysh.org) can be helpful when working on your solution.\n\
    \n> *   To keep solutions brief, we’ll omit the handling of out-of-range inputs\
    \ or exception checking.\n\n> ### Biography\n\n> \n\n> ![Oscar Merida](media/file28.jpg)Oscar\
    \ Merida has been working with PHP since version 4 was released and is constantly\
    \ learning new things about it and still remembers installing an early version\
    \ on Apache. When not coding or writing, he enjoys RPGs, soccer, and drawing.\
    \ [@omerida](https://twitter.com/omerida)\n\n# Education Station: Background Queues\n\
    \n###### By Chris Tankersley\n\n> Web developers, especially PHP developers, have\
    \ it easy. We write applications that take a web request, do some work, and return\
    \ some sort of response. When we do our job properly, we return that request as\
    \ fast as possible. According to [HubSpot](https://blog.hubspot.com/marketing/page-load-time-conversion-rates),\
    \ the first four seconds of a page load are the most important. After that, conversion\
    \ rates start to drop off rapidly. Older stats show that users would begin to\
    \ leave at the three-second mark.\n\nWhile much of this goes into the full page\
    \ render, nothing happens until we return that base response. These days there\
    \ is even increased pressure as the web turns increasingly toward delivering APIs.\
    \ Humans may wait up to three seconds for a page to render, but many applications\
    \ would never wait more than a few seconds on an API. Our applications need to\
    \ return right away.\n\nWhat happens when you need to do a large amount of work,\
    \ though? If a user uploads a video, they still expect as immediate a response\
    \ as the website can give. If a page or process is a multi-second, or even a multi-minute\
    \ or multi-hour process, how do we handle that?\n\nPHP is traditionally a single-threaded,\
    \ procedural language. Meaning that when a request comes in, the engine starts\
    \ at the beginning of a script and processes it line-by-line. The engine does\
    \ not move on to the next line until the current line is finished. For most workloads,\
    \ like rendering a JSON or HTML response, this is fine.\n\n```\necho 'This line\
    \ prints first' . PHP_EOL;\nsleep(1);\necho 'This line prints after one second'\
    \ . PHP_EOL;\necho 'Then this line prints last' . PHP_EOL;\n```\n\nIn other scenarios,\
    \ this may present a problem. Since the engine processes the scripts line-by-line,\
    \ this leads to a situation known as “blocking code,” which means that the engine\
    \ can get into situations where long-running code, like a `sleep()` call, will\
    \ “block” execution of further code until that line has finished. The system is\
    \ not hung; it is just busy doing one thing at a time.\n\n## Queues and Workers\n\
    \nOne of my earliest jobs was working for an insurance company. There were a lot\
    \ of reports that needed to be built and, while we did have a back-office system,\
    \ sometimes we needed a better way to make those reports available via the website.\
    \ That often meant running the reports directly and waiting for the output.\n\n\
    When an agent requested a larger report, the website would regularly time out.\
    \ The issue was just due to the amount of data gathered from various sources,\
    \ and it took longer than the server would wait. The agents would then e-mail\
    \ in and say things were broken.\n\nWhat we decided to do was implement a queueing\
    \ system. When the agent would request a report, we would create a request for\
    \ a report and put it into a queue system or a program that stores messages. A\
    \ second program, called a worker, running on the servers that generated the reports,\
    \ would take that request and run it. The output of the report would then be saved\
    \ to a place on disk, and the agent alerted that the report was ready.\n\nAs this\
    \ was one of my first times doing this, I used MySQL as the “queue.” I would insert\
    \ a row to the database to a table named `report_queue`, and the worker program\
    \ would just constantly “`SELECT * FROM report_queue LIMIT 1`”, do the work, then\
    \ run the query again. The worker itself, shown in Listing 1, was just a small\
    \ script that ran forever.\n\n**Listing 1.**\n\n```\n\n```\n\nThis simple solution\
    \ worked, but only because we had a single worker. Demand was never high enough\
    \ for us to ever really queue up more than a few reports at any one time. Agents\
    \ were happy because the website would instantly confirm their request for the\
    \ report, and the report would be ready shortly after. No more support requests\
    \ that the site was broken."
