    # The Workshop: Apache and PHP - Back to Basics


    ### By Joe Ferguson


    > This month we’re diving into [Apache](https://httpd.apache.org) and PHP configuration
    to better understand the relationship between the web (HTTP) server and our application.
    When getting started with PHP, it’s quite common for tutorials and guides to skip
    over the webserver and focus more on the language aspects. PHP developers need
    to have a strong understanding of how the webserver executes their code. As requests
    and responses being handled by a server are the primary purpose of web applications.
    We’re going to install Apache, PHP, and review configuration for ensuring our
    application not only functions well but leverages Virtual Hosts to serve multiple
    applications.


    ![logo](media/file30.png)

    logo


    Apache is an open-source HTTP server launched in 1995 and has been the most popular
    web server on the internet since 1996. My earliest experience with Apache goes
    back to 1998 with PHP and Perl [Common Gateway Interface](https://w.wiki/3QZ7)
    applications on Debian and Red Hat Linux distributions. The ability to build your
    web server on the internet in 1998 felt incredibly empowering. These days of static
    sites being hosted in S3 storage buckets or being hosted by the hot new startup,
    it’s easy for developers to forget about the webserver.


    We’ll be using Ubuntu 20.04 for our examples, but Apache runs on just about every
    Linux distribution you’d like to use. These examples will hold in Ubuntu-like
    distributions but always refer to your distribution documentation. In Red Hat,
    Centos, and similar the Apache package is named `httpd` instead of `apache2`;
    however, the configuration options will be the same.


    Installing Apache and PHP using `apt` on Ubuntu will install and configure nearly
    all of the required parts to wire PHP to apache, which is done via the `libapache2-mod-php`
    package giving Apache the ability to run our PHP applications.


    ```

    sudo apt install apache2 php libapache2-mod-php php-xml

    ```


    ## Configuration and Directives


    Apache is configured by plain text directives placed in a specific folder structure.
    The primary configuration file is `apache2.conf`. The rest of the configuration
    files `ports.conf`, and files in `conf-enabled`, `mods-enabled`, and `sites-enabled`
    are all combined together as the Apache configuration. Combining what ports to
    listen on, generic statements or snippets, then what server mods have been enabled.
    Finally including what HTTP services are running and listening on specific devices,
    or virtual hosts. Virtual hosts are how you tell Apache how to run our application.


    PHP configuration is where you would expect it on a Debian derivative located
    at `/etc/php/`. The PHP configuration for Apache will be in the folder `/etc/php/7.4/apache2/php.ini`.
    This folder structure follows a similar pattern for each version of PHP we install.


    On Ubuntu systems, we’ll see the contents of `/etc/apache2` where our virtual
    hosts will be placed in `sites-available`. We can selectively enable specific
    sites using the `a2ensite` command, which will create a symbolic link from `/etc/apache/sites-available/our-virtualhost.conf`
    to `/etc/apache/sites-enabled/our-virtualhost.conf`, allowing us to easily turn
    sites on or off. The ability to toggle sites on and off is immensely helpful when
    experimenting with configuration options for a specific site. It is easier to
    isolate the running configuration by turning off sites or other configuration
    options you may not need. See Listing 1.


    **Listing 1.**


    ```

    /etc/apache2# tree -L 1

    .

    ├── apache2.conf├── conf-available

    ├── conf-enabled

    ├── envvars

    ├── magic

    ├── mods-available

    ├── mods-enabled

    ├── ports.conf

    ├── sites-available

    └── sites-enabled

    ```


    We’re going to leave most of `apache2.conf` as the defaults, although it is the
    file to edit to change or adjust:


    *   the log formatting of Apaches log, you can find the `LogFormat` definitions

    *   where the logs are stored

