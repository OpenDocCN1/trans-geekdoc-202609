    1. **Select 3-5 respondents and ask them for feedback.** Specifically, these respondents
    will be providing insights on when they have seen you at your best. Ideally, you’ll
    want to choose people who have known you throughout different stages of your career
    to increase the likelihood of receiving diverse responses.

    2. **Identify patterns in their responses.** When I first completed this exercise,
    I saw a common theme—people believed I was excellent at public speaking. At the
    time, the idea of public speaking terrified me very much but knowing that other
    people saw it as a strength helped encourage me to take intentional steps to begin
    focusing more on it.

    3. **Compose your self-portrait.** This step is intended to be a written self-portrait
    about how you view yourself and your potential, but if you are artistic, feel
    free to do a visual self-portrait as well! In this step of the exercise, you are
    taking what others have shared about you and using the feedback to create a vision
    of where you see yourself going next.


    ## Strategy #2: Determine the type of mentoring that you want to do.


    Earlier in my career, when I was afraid to become a mentor, part of my resistance
    was due to the fact that I was unaware of the different types of mentoring that
    I could potentially get involved with. From my perspective, I saw a mentor as
    someone who was completely responsible for guiding their mentee throughout their
    career journey. Mentoring seemed like an incredibly daunting task, and not wanting
    to possibly ruin someone else’s career, I decided that it wasn’t for me.


    I wish I had known that mentoring could occur in a wide variety of forms. Today
    in my experience as a mentor, there are some mentees that I have worked with,
    in a formal capacity over several months, and others that I have partnered with,
    more informally, on an as-needed basis.


    After you have identified your strengths, and before you jump in to start mentoring
    someone, it’s essential to identify which type of mentoring might be the best
    fit for you. The two types that I’ll focus on in this article are informal and
    formal mentoring.


    ### Informal Mentoring

    With informal mentoring, goals are typically unspecified. Mentors and mentees
    usually self-select each other, and outcomes are generally not tracked or measured.
    You might find an informal mentee through a tech meetup group, a department social
    hour, or even just by chatting with colleagues in the break room.


    In an informal mentoring relationship, it is essential for you and your mentee
    to be proactive when seeking opportunities to connect. Although you might not
    be officially establishing goals with your mentee or tracking their progress,
    finding opportunities to connect and extend the relationship can help you ensure
    that they can still benefit from the time they spend interacting with you.


    As you work with mentees in an informal context, it can be helpful to advise them
    on the best ways to leverage their relationship with you. For example, I typically
    advise my informal mentees to reach out to me with specific questions and an overview
    of the steps they have already taken to solve a problem. This way, we can make
    the most of the time that we spend together, whether through a live meeting or
    through email exchanges.


    ### Formal Mentoring

    With formal mentoring, mentors and mentees are often paired based on some type
    of compatibility. Goals are established, and outcomes are tracked and measured.
    Formal mentoring relationships might be developed through company-wide initiatives
    led by Human Resources. For example, a company might sponsor a program for their
    interns to formally be paired with staff members for a mentoring relationship
    throughout the duration of the internship.


    If you are considering getting involved with formal mentoring, a key first step
    is defining the purpose and timeline. Work backward from the question, “By the
    end of this mentoring relationship, what should the mentees be able to do?” For
    example, will you focus on helping your mentee improve their technical skills
    or prepare for a new leadership position? Will you be working with them for a
    period of 6 months or an entire year? Your answers to these questions can help
    you determine how to best structure the mentoring relationship and also establish
    clear expectations for everyone involved.


    Next, you should determine exactly how the effectiveness of the mentoring program
    will be measured. Metrics for this might include competency assessments, employee
    retention rates, improved job performance rates, etc. Including metrics in a formal
    mentoring program can help you obtain data to show which parts of the program
    were most effective, which can be particularly useful to know if you need to grow
    and scale the program over time, potentially.


    Determining your mentoring approach’s parameters can help you become a more effective
    mentor because it allows you to more clearly understand what you are attempting
    to accomplish with your mentee. Rather than trying to do anything and everything
    for your mentee, setting a clear focus from the outset is a great way to help
    set yourself up for success.


    ## Strategy #3: When communicating with your mentee, focus on active listening.


    As a mentee, there have been many times when I felt that my mentor wasn’t truly
    listening to me. It sometimes seemed as though they had come into the conversation,
    emphasizing what they wanted to tell me rather than hearing what I wanted to share
    first. I used these experiences to help remind myself that as a mentor, one of
    my most important responsibilities is to listen to my mentee.


    One aspect of active listening involves being fully present with your mentee.
    Although it can be easy to want to multi-task and divide your attention across
    several areas at once, it’s important to consider the impact that doing this could
    potentially have on your mentee. For many mentees who are new to the workforce
    and working with a mentor for the first time, it can already seem overwhelming
    to think about taking up someone else’s time for their own personal benefit. Thus,
    being fully present and engaged with your mentee helps to remind them that you
    have chosen to spend your time working with them and coaching them along their
    career journey.


    Another active listening strategy that you can use with your mentee is paraphrasing.
    Sometimes when I’m in conversations with my mentees, I might not understand exactly
    what they’re trying to tell me the first time. For example, they might be describing
    a problem in a very broad or vague manner but are still seeking a specific outcome.
    Rather than assuming that I fully understand what was said, I pause to paraphrase
    the information that I heard them say. Paraphrasing involves restating someone
    else’s message in your own words. I often use handy sentence starters to help
    me launch into paraphrasing, such as:


    * “What I hear you saying is… ”

    * “As I understand it, you’re feeling… ”

    * “It sounds like you’re saying that… ”


    Paraphrasing gives you the opportunity to get on the same page as your mentee
    before you move into the next step of offering suggestions and feedback.


    Even with paraphrasing, however, there might also be times when you are unclear
    about a few details and need to clarify them before moving forward. As a mentor,
    asking clarifying questions is actually a good thing. Although it may seem daunting
    to ask questions at the risk of coming across as uninterested or unengaged, the
    process of clarifying information can demonstrate to your mentee that you are
    actively listening to them and need to know more about some of the specific areas
    that they mentioned.

