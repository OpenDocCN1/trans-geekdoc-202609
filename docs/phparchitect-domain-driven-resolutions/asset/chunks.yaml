    \ where he shares his knowledge with the world.\n\n# PHP Puzzles: Infamous Fizz\
    \ Buzz\n\n###### By Oscar Merida\n\n> Let’s start the year looking at a classic\
    \ interview question—Fizz Buzz. It’s misused to screen applicants and may not\
    \ be testing for what it thinks it is. Nonetheless, it doesn’t hurt to be prepared\
    \ if you encounter it. We’ll look at various approaches to solve it.\n\n## Recap\n\
    \nWrite a PHP script that prints integers from 1 to some `$maximum`.\n\n1. For\
    \ multiples of 3, output “Fizz” instead of the number\n2. For multiples of 5,\
    \ print “Buzz” instead of the number\n3. For multiples of both 3 and 5, print\
    \ “FizzBuzz” instead of the number\n\n## Why?\n\nIn [Why Can’t Programmers Program](https://phpa.me/codinghorror-why-cant),\
    \ Jeff Atwood popularized using Fizz Buzz and coding challenges like it. Hiring\
    \ programmers is challenging. Education and certifications can get you only so\
    \ far. Tests like these are designed to assess if a candidate thinks like a “real\
    \ programmer” in a reasonably short amount of time. But our daily work involves\
    \ discovery, investigation, and trial-and-error before we know what code we need\
    \ to write.\n\nReal-world problems are rarely as well defined as Fizz Buzz. In\
    \ a poor interview, you may not be given more than a couple of minutes to show\
    \ a solution or even iterate on your first one. It also excludes people who don’t\
    \ test well or don’t have esoteric programming knowledge memorized. The idea that\
    \ “most programmers can’t program” may not be true in the first place, as explained\
    \ by Justin Falcone.\n\n## The Secret Sauce\n\nThe modulus operator is at the\
    \ heart of any solution. Many programmers, particularly novices, forget it exists.\
    \ It complements the division operator by giving us the remainder.\n\n```\necho\
    \ 32 / 6; // 5.333333333333\necho 32 % 6; // 2\n```\n\n## The Loop Solution\n\n\
    A straightforward initial solution is to loop through the given range to produce\
    \ our output.\n\n**Listing 1.**\n\n```\n```\n```\n\nThat loop produces the following:\n\
    \n```\n1 2 Fizz 4 Buzz Fizz 7 8 Fizz Buzz 11\nFizz 13 14 FizzBuzz 16 17 Fizz 19\
    \ Buzz\nFizz 22 23 Fizz Buzz 26 Fizz 28 29\nFizzBuzz 31 32 Fizz 34 Buzz 37 38\
    \ Fizz\n```\n\n## Improving the Loop\n\nOne improvement we can make to our solution\
    \ is to put the logic for what to print out into a function. I’m not a fan of\
    \ functions that echo values. Doing so is an unintended side effect and assumes\
    \ you want to display the result to `STDOUT`. Instead, I prefer to return the\
    \ string and let the calling code decide how to handle it.\n\n**Listing 2.**\n\
    \n```\n```\n```\n\nAnother frequent mistake here is in getting the `if` expressions\
    \ in the wrong order. Make sure you include a case for integers that are multiples\
    \ of both 3 and 5. One minor optimization I added was to check if a number is\
    \ divisible by 15 instead of doing two checks for divisibility by 3 and 5.\n\n\
    ## No Loop\n\nCan we do this without a loop? Of course! We can use our `FizzBuzzResult()`\
    \ function and PHP’s native array functions for a more, well, functional approach.\n\
    \n```\n```\n```\n"
