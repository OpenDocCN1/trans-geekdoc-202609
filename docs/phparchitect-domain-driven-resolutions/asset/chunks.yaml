    \nThis class is designed to loop through a subset of the elements of a `Collection`.\
    \ Yet, unlike the `LimitIterator`, the subset is not fixed but dynamic. `LimitIterator`\
    \ elements are selected via applying a filtering function to each one and retaining\
    \ those for which the result is true.\n\nA `FilterIterator` won’t work directly\
    \ on the collection. Instead, it leverages a pre-existing `Iterator` to access\
    \ the elements and is another composite `Iterator`.\n\nGoing back to our graph\
    \ example, say you have a breadth-first-search `Iterator` implemented, and now\
    \ you want to process a particular set of those nodes. A nice way to accomplish\
    \ that would be to design a `FilterIterator` and then use it together with the\
    \ graph.\n\n## A Somewhat Real Use Case\n\nRecently I got this email from a programmer\
    \ I’ve been coaching:\n\n> Hi Mauro,\n>\n> It’s been a while, hope you are doing\
    \ great?\n>\n> I have a PHP coding challenge that needs to be solved using solid\
    \ principles, and also I think it involves using the PHP `Iterator` class, which\
    \ I’m not familiar with. Can you help me out with it?\n>\n> I hope you can help\
    \ me out. I really need to understand the best way to solve this.\n\nThe problem\
    \ to be solved was expressed like this:\n\n> Your task is to create a CLI script\
    \ that will read JSON-based data from a specific endpoint via HTTP. The script\
    \ will contain several sub-commands to filter and output the loaded data. The\
    \ commands should be:\n>\n> Find objects by price range (given `price_from` and\
    \ `price_to` as arguments). Find objects by a certain sub-object definition. All\
    \ given sub-commands should only output the number of objects in stock.\n>\n>\
    \ Technical Requirements:\n>\n> Implement the `ReaderInterface` for fetching the\
    \ JSON HTTP endpoint and thus work with the `OfferCollectionInterface` and `OfferInterface`\
    \ on the loaded data.\n\nListing 1 shows [a little script](https://github.com/mchojrin/HTTPJsonFilter)\
    \ I put together to solve the problem and help my student understand the underlying\
    \ concepts.\n\nI’ll go over its main parts to show how the `FilterIterator` can\
    \ be implemented in PHP. Let’s start with the main script, the file `run.php`\
    \ shown in Listing 1.\n\n**Listing 1.**\n\n```\n```\n\nHere you can see how the\
    \ script:\n\n1.  Incorporates a very simple autoloading function by calling `spl_autoload_register`.\
    \ Doing so is meant to prevent the explicit requirement of supporting classes\
    \ over the rest of the code.\n2.  Creates a `Product` Collection through an `HTTPReader`\
    \ instance. The `HTTPReader`’s goal is to create a new `Collection` from the results\
    \ of applying `json_decode` to the text gathered from the external endpoint.\n\
    3.  Outputs the number of elements in the `Collection` that match the criteria\
    \ specified by a command-line argument by calling the function [iterator_count](https://www.php.net/function.iterator-count)\
    \ and feeding it with the appropriate `Iterator`.\n\nThe last point is where I\
    \ want you to focus your attention. Note how, depending on the specified sub-command,\
    \ a particular `FilterIterator` sub-class is used on top of the original `Iterator`.\n\
    \nListing 2 shows the code for `PriceFilterIterator`.\n\n**Listing 2.**\n\n```\n\
    ```\n\nThis class has two methods:\n\n*   The constructor\n*   `accept`\n\n`accept`\
    \ is the most important part of the class, as it’s where the actual filtering\
    \ logic is stored. In this particular case, the way to determine whether a product\
    \ should be part of the iteration is checking that its price is within established\
    \ boundaries.\n\nThese boundaries are defined when creating the `Iterator`s instance.\
    \ They are the arguments to the constructor method.\n\nEvery `FilterIterator`\
    \ works this way: the `accept` method is called upon each element yielded by the\
    \ underlying `Iterator` and, if the evaluation results in a boolean `true`, the\
    \ element will be considered part of the loop; otherwise, it will be skipped.\n\
    \nNow look at the `VendorIdFilterIterator` class shown in Listing 3.\n\n**Listing\
    \ 3.**\n\n```\n```\n\nThe structure is pretty much the same. The only significant\
    \ difference is the definition of the `accept` method, which, in this case, checks\
    \ the vendor Id against a fixed value established at construction time.\n\nSince\
    \ this is just a simulation, this Proof Of Concept project includes a script named\
    \ `output_json.php` (Listing 4) that will produce the JSON output expected at\
    \ the other end.\n\n**Listing 4.**\n\n```\n```\n"
