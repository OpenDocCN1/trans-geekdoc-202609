  ```\n该查询按 `product_id` 对销售记录进行分组，并计算每个产品的总销售额。`HAVING` 子句过滤结果，仅包含总销售额大于 1000 的产品。\n\
  \n## 结合聚合函数的 HAVING\n### 结合聚合函数的 HAVING 示例：\n让我们找到订单数量超过三个的客户：\n\n```sql\nSELECT\
