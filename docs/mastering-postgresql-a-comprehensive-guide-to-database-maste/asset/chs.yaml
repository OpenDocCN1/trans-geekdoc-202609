  \n在 PostgreSQL 中，`FULL JOIN`（也称为 `FULL OUTER JOIN`）是一种 SQL 操作，用于根据指定的连接条件从两个或多个表中检索数据。与\
  \ `INNER JOIN`、`LEFT JOIN` 或 `RIGHT JOIN` 不同，`FULL JOIN` 会检索两个表中的所有行，并根据指定条件进行行匹配。本全方位指南涵盖了\
  \ PostgreSQL 中 `FULL JOIN` 的语法、用法、示例、解释、场景、优势和最佳实践。\n\n## 目录\n\n1. FULL JOIN 简介\n\
