  \ JOIN 简介\n\nPostgreSQL 中的 `INNER JOIN` 用于根据具有匹配值的相关列或多列从多个表中检索行。它通过仅选择指定列中具有匹配值的行来合并两个表的数据。\n\
  \n## INNER JOIN 的基本语法\n\nPostgreSQL `INNER JOIN` 的基本语法涉及指定要连接的表以及匹配这些表中的行的条件。\n\n\
  ```sql\nSELECT columns\nFROM table1\nINNER JOIN table2 ON table1.column = table2.column;\n\
  ```\n\n* `SELECT columns`：指定要检索的列。\n* `FROM table1`：指定第一个表。\n* `INNER JOIN table2`：指定第二个表。\n\
  * `ON table1.column = table2.column`：定义基于相关列连接表的条件。\n\n## 使用 INNER JOIN\n\n`INNER\
  \ JOIN` 从两个表中检索满足 `ON` 子句中指定的连接条件的行。它仅包含在两个表中指定列中具有匹配值的行。\n\n## INNER JOIN 示例\n\n\
  ### INNER JOIN 示例：\n\n考虑两个表：employees（员工表）和 departments（部门表），它们基于 `department_id`\
  \ 字段进行连接：\n\n```sql\nSELECT employees.employee_id, employees.first_name, departments.department_name\n\
  FROM employees\nINNER JOIN departments ON employees.department_id = departments.department_id;\n\
  ```\n\n该查询从 `employees` 表中检索 `employee_id` 和 `first_name`，从 `departments` 表中检索 `department_name`，匹配两个表之间\
  \ `department_id` 值相同的记录。\n\n## 多表 INNER JOIN\n\n### 三表 INNER JOIN 示例：\n\n```sql\n\
  SELECT t1.column1, t2.column2, t3.column3\nFROM table1 AS t1\nINNER JOIN table2\
  \ AS t2 ON t1.id = t2.id\nINNER JOIN table3 AS t3 ON t2.id = t3.id;\n```\n\n## 带有别名的\
