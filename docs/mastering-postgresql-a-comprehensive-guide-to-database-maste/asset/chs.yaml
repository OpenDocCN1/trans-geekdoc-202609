  HAVING COUNT(order_id) > 3;\n```\n该查询按 `customer_id` 对订单分组，并统计每个客户下过的订单数量。`HAVING`\
  \ 子句过滤结果，仅包含订单超过三个的客户。\n\n## HAVING 与 WHERE\n### HAVING 与 WHERE 示例：\n`WHERE` 子句用于分组之前，而\
