  \ `WHERE` 子句，但它专门设计用于过滤由 `GROUP BY` 子句使用的聚合函数产生的行。\n\n## HAVING 的基本语法\nPostgreSQL\
  \ 中 `HAVING` 子句的基本语法应用在 `GROUP BY` 子句之后：\n\n```sql\nSELECT column1, aggregate_function(column2)\n\
  FROM table_name\nGROUP BY column1\nHAVING condition;\n```\n\n- `SELECT column1,\
  \ aggregate_function(column2)`：指定要检索数据的列和聚合函数。\n- `FROM table_name`：指定从哪个表检索数据。\n\
  - `GROUP BY column1`：指定用于分组的列。\n- `HAVING condition`：指定过滤分组行的条件。\n\n## 使用 HAVING\n\
  `HAVING` 子句根据指定的条件（特别是聚合值）过滤由 `GROUP BY` 子句产生的结果集。\n\n## HAVING 示例\n### HAVING 示例：\n\
  假设我们要找到每个产品的总销售额，且总销售额大于 1000 美元：\n\n```sql\nSELECT product_id, SUM(sale_amount)\
