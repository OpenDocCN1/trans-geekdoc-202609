  \ 列匹配指定的字符串中的任意：'Electronics'、'Clothing' 或 'Accessories'。\n\n## 配合子查询使用 IN 运算符\n\
  \n`IN` 运算符可以与子查询配合，允许根据嵌套查询的结果进行更动态的过滤。\n\n#### 使用子查询使用 IN 运算符\n\n```sql\nSELECT\
  \ *\nFROM orders\nWHERE customer_id IN (SELECT id FROM customers WHERE age > 30);\n\
