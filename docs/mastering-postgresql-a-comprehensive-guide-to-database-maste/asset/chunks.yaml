    sql code


    SELECT employee\_id, first\_name, last\_name


    FROM employees


    WHERE job\_title \= ANY (ARRAY\[''Manager'', ''Engineer'', ''Analyst''\]);


    This query retrieves employee\_id, first\_name, and last\_name from the employees
    table where the job title matches any value in the provided array.


