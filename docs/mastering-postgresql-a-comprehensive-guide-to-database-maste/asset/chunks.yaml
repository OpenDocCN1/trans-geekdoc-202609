    ## 带有 GROUP BY 的 COUNT


    `COUNT` 函数可以与 `GROUP BY` 结合，统计列中不同分组的数量。


    ### 计算每个部门的数量


    ```sql

    SELECT department_id, COUNT(*)

    FROM employees

    GROUP BY department_id;

    ```


    此查询使用 `GROUP BY` 计算每个部门的人数。


