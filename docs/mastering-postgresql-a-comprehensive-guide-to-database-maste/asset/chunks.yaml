    ## `DROP COLUMN` 语句简介


    PostgreSQL 中的 `DROP COLUMN` 语句允许用户从现有表中删除一个或多个列。通过消除不再需要或冗余的列，该命令有助于简化表结构、优化存储并增强数据库内部的数据管理。


    ## `DROP COLUMN` 语法


    PostgreSQL 中 `DROP COLUMN` 语句的通用语法如下：


    ```sql

