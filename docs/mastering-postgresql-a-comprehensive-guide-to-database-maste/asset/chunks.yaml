    # PostgreSQL UPDATE Statement: Comprehensive Guide


    The UPDATE statement in PostgreSQL is essential for modifying existing records
    within a table. It allows users to update specific columns or rows with new values
    based on defined conditions, ensuring data accuracy and consistency. This comprehensive
    guide covers the syntax, usage, variations, constraints, and examples related
    to the UPDATE statement in PostgreSQL.


    ## Table of Contents


    1.  Introduction to UPDATE Statement


    2.  Syntax of UPDATE


    3.  Updating Data in Tables


    4.  Basic UPDATE Statement with Examples


    5.  Updating Data with Conditions


    6.  Applying Constraints with UPDATE


    7.  Conclusion


    ## Introduction to UPDATE Statement


    The UPDATE statement in PostgreSQL is used to modify existing records in a table
    by changing the values of specified columns. It provides a powerful mechanism
    for updating data based on specific criteria, ensuring accuracy and reflecting
    changes in the database.


    ## Syntax of UPDATE


    The general syntax of the UPDATE statement in PostgreSQL is as follows:


    sql code


    UPDATE table\_name


    SET column1 \= value1, column2 \= value2, ...


    \[WHERE condition\];


    *   table\_name: Name of the table to be updated.


    *   SET column1 \= value1, column2 \= value2, ...: Specifies columns to be updated
    along with their new values.


    *   \[WHERE condition\]: Optional condition specifying rows to be updated based
    on certain criteria.


    ## Updating Data in Tables


    ### Updating Specific Columns in a Table


    sql code


    UPDATE employees


    SET salary \= 60000, department \= ''Sales''


    WHERE employee\_id \= 101;


    Explanation:


    *   Changes the salary to 60000 and department to ''Sales'' for the employee with
    employee\_id 101 in the employees table.


    ### Updating Columns Using Calculated Values


    sql code


    UPDATE products


    SET unit\_price \= unit\_price \* 1.1


    WHERE category\_id \= 3;


    Explanation:


    *   Increases the unit\_price by 10% for products in the category with category\_id
    3 in the products table.


    ## Basic UPDATE Statement with Examples


    ### Updating a Single Column for All Rows


    sql code


    UPDATE customers


    SET status \= ''Inactive'';


    Explanation:


    *   Sets the status column to ''Inactive'' for all rows in the customers table.


    ### Updating Multiple Columns in a Single Statement


    sql code


    UPDATE orders


    SET discount \= 0.1, order\_status \= ''Pending''


    WHERE order\_date > ''2023-01-01'';


    Explanation:


    *   Assigns a discount of 10% (0.1) and updates order\_status to ''Pending'' for
    orders placed after January 1, 2023, in the orders table.


    ## Updating Data with Conditions


    ### Updating Based on Multiple Conditions


    sql code


    UPDATE employees


    SET department \= ''HR''


    WHERE department \= ''Admin'' AND hire\_date < ''2022-01-01'';


    Explanation:


    *   Changes the department to ''HR'' for employees currently in the ''Admin''
    department hired before January 1, 2022, in the employees table.


    ### Updating Using Subqueries


    sql code


    UPDATE products


    SET stock\_quantity \= stock\_quantity \- (


    SELECT SUM(quantity) FROM order\_details WHERE product\_id \= products.product\_id


    )


    WHERE product\_id IN (SELECT product\_id FROM order\_details);


    Explanation:


    *   Updates the stock\_quantity in the products table by subtracting the total
    quantity of products sold from the order\_details table based on the matching
    product\_id.


    ## Applying Constraints with UPDATE


    ### Updating Columns with Constraints


    sql code


    UPDATE employees


    SET salary \= salary \* 1.05


    WHERE salary <\= 50000;


    Explanation:


    *   Increases the salary by 5% for employees with a salary less than or equal
    to 50000 in the employees table.


    ### Updating Columns with NULL Values


    sql code


    UPDATE customers


    SET email \= ''noemail@example.com''


    WHERE email IS NULL;


    Explanation:


    *   Assigns the email address ''noemail@example.com'' to customers with NULL values
    in the email column in the customers table.


    ## Conclusion


    The UPDATE statement in PostgreSQL enables users to modify existing records within
    tables based on specified conditions or criteria. This guide has covered the syntax,
    usage, and examples of the UPDATE statement, including scenarios involving updating
    specific columns, applying conditions using WHERE clauses, altering multiple rows,
    and utilizing subqueries to update data. Understanding the capabilities and variations
    of the UPDATE statement empowers database administrators and developers to manage
    and modify data effectively within PostgreSQL databases, ensuring accurate and
    up-to-date information based on evolving requirements and business logic.


    # PostgreSQL ALTER COLUMN: Comprehensive Guide


    In PostgreSQL, the ALTER COLUMN statement is a powerful command used to modify
    the attributes or properties of existing columns within a table. This operation
    allows users to change column data types, add constraints, rename columns, set
    default values, and perform various other modifications. This comprehensive guide
    covers the syntax, usage, examples, constraints, and variations related to the
    ALTER COLUMN statement in PostgreSQL.


    ## Table of Contents


    1.  Introduction to ALTER COLUMN Statement


    2.  Syntax of ALTER COLUMN


    3.  Modifying Columns in Tables


    4.  Basic ALTER COLUMN Statement with Examples


    5.  Changing Data Type of Columns


    6.  Applying Constraints with ALTER COLUMN


    7.  Renaming Columns


    8.  Conclusion


    ## Introduction to ALTER COLUMN Statement


    The ALTER COLUMN statement in PostgreSQL allows users to modify the properties
    or attributes of an existing column within a table. It provides flexibility in
    altering column definitions, enabling changes to data types, constraints, default
    values, and other column-specific settings without affecting the entire table
    structure.


    ## Syntax of ALTER COLUMN


    The general syntax of the ALTER COLUMN statement in PostgreSQL is as follows:


    sql code


    ALTER TABLE table\_name


    ALTER COLUMN column\_name action;


    *   ALTER TABLE table\_name: Specifies the table containing the column to be modified.


    *   ALTER COLUMN column\_name: Indicates the column to be altered.


    *   action: Specifies the modification to be performed on the column, such as
    changing the data type, adding constraints, setting default values, etc.


    ## Modifying Columns in Tables


    ### Modifying Column Data Types


    sql code


    ALTER TABLE employees


    ALTER COLUMN salary TYPE NUMERIC(10, 2);


    Explanation:


    *   Changes the data type of the salary column in the employees table to NUMERIC
    with precision 10 and scale 2.


    ### Adding Constraints to Columns


    sql code


    ALTER TABLE products


    ALTER COLUMN unit\_price SET NOT NULL;


    Explanation:


    *   Adds a NOT NULL constraint to the unit\_price column in the products table,
    disallowing NULL values in this column.


    ## Basic ALTER COLUMN Statement with Examples


    ### Setting Default Values for Columns


    sql code


    ALTER TABLE customers


    ALTER COLUMN status SET DEFAULT ''Active'';


    Explanation:


    *   Sets a default value of ''Active'' for the status column in the customers
    table.


    ### Removing Default Values from Columns


    sql code


    ALTER TABLE orders


    ALTER COLUMN order\_status DROP DEFAULT;


    Explanation:


    *   Removes the default value constraint from the order\_status column in the
    orders table.


    ## Changing Data Type of Columns


    ### Modifying Column Data Type


    sql code


    ALTER TABLE employees


    ALTER COLUMN hire\_date TYPE DATE;


