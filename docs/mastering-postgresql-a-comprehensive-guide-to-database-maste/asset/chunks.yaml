    ## Introduction to ORDER BY Clause


    The ORDER BY clause in PostgreSQL is used within SELECT statements to sort result
    sets in ascending or descending order based on specified columns. It allows users
    to arrange query results according to particular column values, enhancing the
    presentation and analysis of retrieved data.


    ## Basic Syntax of ORDER BY Clause


    The basic syntax of the ORDER BY clause in PostgreSQL is as follows:


    sql code


    SELECT column1, column2, ...


    FROM table\_name


    ORDER BY column\_name \[ASC | DESC\];


    *   SELECT: Specifies the columns to retrieve.


    *   column1, column2, ...: Specifies the columns to retrieve data from.


    *   FROM table\_name: Specifies the table from which data is retrieved.


    *   ORDER BY column\_name: Specifies the column(s) to sort by.


    *   \[ASC | DESC\]: Specifies the sorting order as ascending (default) or descending.


    ## Using ORDER BY Clause


    The ORDER BY clause is utilized to sort query results based on one or multiple
    columns in ascending or descending order. It is often employed in SELECT statements
    to arrange data for better readability or to present results in a specific order.


    ## Examples of ORDER BY Clause


    ### Sorting Results in Ascending Order


    sql code


    SELECT \* FROM products ORDER BY product\_name;


    This query retrieves all columns from the products table and sorts the result
    in ascending order based on the product\_name column.


    ### Sorting Results in Descending Order


    sql code


    SELECT \* FROM employees ORDER BY hire\_date DESC;'
