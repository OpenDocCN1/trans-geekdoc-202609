    The `AS` keyword in PostgreSQL is utilized to provide alternative names, known
    as aliases, to columns or tables in SQL queries. It improves query readability,
    simplifies manipulation of column names, and allows for more descriptive or concise
    presentations of data.


    ## Basic Syntax of AS Keyword


    ### AS Keyword for Column Aliases:


    ```sql

    SELECT column_name AS alias_name

    FROM table_name;

    ```


    ### AS Keyword for Table Aliases:


    ```sql

    SELECT t.column_name

    FROM table_name AS t;

    ```


    *   `column_name AS alias_name`: Specifies the column to retrieve with an assigned
    alias.

    *   `table_name AS alias_name`: Provides an alternative name for a table.


    ## Using AS Keyword for Column Aliases


    The `AS` keyword can be used to assign aliases to columns in queries. It helps
    in providing more descriptive or readable names for retrieved columns.


    ## Using AS Keyword for Table Aliases


    The `AS` keyword also allows users to assign aliases to tables within SQL queries.
    It simplifies the process of referencing tables in complex queries or when joining
    multiple tables.


    ## Examples of AS Keyword


    ### Column Alias Example:


    ```sql

    SELECT first_name AS "First", last_name AS "Last"

    FROM employees;

    ```


    This query retrieves the `first_name` column with an alias `"First"` and the `last_name`
    column with an alias `"Last"` from the `employees` table.


    ### Table Alias Example:


    ```sql

    SELECT e.first_name, d.department_name

    FROM employees AS e

    JOIN departments AS d ON e.department_id = d.department_id;

    ```


    Here, `e` and `d` are aliases for the `employees` and `departments` tables, respectively,
    simplifying the query by shortening table names.


    ## AS Keyword in Calculated Columns


    ### Using AS in Calculated Columns:


    ```sql

    SELECT column1, column2, (column1 * column2) AS "product"

    FROM table_name;

    ```


    In this example, the `AS` keyword assigns the alias `"product"` to the calculated
    column resulting from the multiplication of `column1` and `column2`.


    ## Advantages of AS Keyword


    1.  **Readability**: Enhances query readability by providing more descriptive
    or readable column or table names.

    2.  **Column Manipulation**: Facilitates the manipulation of column names in query
    results or calculations.

    3.  **Table References**: Simplifies references to tables in complex queries by
    assigning aliases.


    ## Best Practices for AS Keyword


    1.  **Use Descriptive Aliases**: Choose clear and descriptive aliases for columns
    or tables to enhance query understanding.

    2.  **Consistent Usage**: Maintain consistency in alias usage throughout queries
    for better readability.

    3.  **Quote Identifiers**: Enclose aliases containing spaces or special characters
    in double quotes for clarity.


    ## Conclusion


    The `AS` keyword in PostgreSQL is a valuable tool for assigning aliases to columns
    or tables within SQL queries, improving query readability and enabling more effective
    data manipulation and presentation. This guide covered the syntax, usage, examples,
    advantages, and best practices related to the `AS` keyword. Understanding the
    functionalities and best practices of the `AS` keyword empowers users to write
    clearer, more concise, and more readable SQL queries in PostgreSQL for various
    data retrieval and manipulation purposes.


