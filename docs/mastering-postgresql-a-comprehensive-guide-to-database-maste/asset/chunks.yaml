    ## Introduction to FULL JOIN


    The `FULL JOIN` in PostgreSQL retrieves all rows from both tables regardless of
    whether there is a match between them based on a specified join condition. It
    combines data from two tables, including matched rows and rows without matches,
    where `NULL` values represent unmatched columns.


    ## Basic Syntax of FULL JOIN


    The basic syntax of the `FULL JOIN` in PostgreSQL involves specifying the tables
    to join and the condition to match rows from these tables.


    ```sql

    SELECT columns

    FROM table1

    FULL JOIN table2 ON table1.column \= table2.column;

    ```


    *   `SELECT columns`: Specifies the columns to retrieve.

    *   `FROM table1`: Specifies the first table.

    *   `FULL JOIN table2`: Specifies the second table.

    *   `ON table1.column \= table2.column`: Defines the condition for joining the
    tables based on related columns.


    ## Using FULL JOIN


    The `FULL JOIN` retrieves all rows from both tables, including matched rows and
    unmatched rows. It combines data based on the specified join condition.


    ## Examples of FULL JOIN


    ### Example of FULL JOIN:


    Consider two tables, `employees` and `departments`, joined based on the `department_id`
    column:


    ```sql

    SELECT employees.employee_id, employees.first_name, departments.department_name

    FROM employees

    FULL JOIN departments ON employees.department_id \= departments.department_id;

    ```


    This query retrieves the `employee_id` and `first_name` from the `employees` table
    and `department_name` from the `departments` table. It includes all rows from
    both tables, combining matching rows based on the `department_id` column and including
    unmatched rows with `NULL` values for non-matching columns.


    ## FULL JOIN with Multiple Tables


    ### Example of FULL JOIN with Three Tables:


    ```sql

    SELECT t1.column1, t2.column2, t3.column3

    FROM table1 AS t1

    FULL JOIN table2 AS t2 ON t1.id \= t2.id

    FULL JOIN table3 AS t3 ON t2.id \= t3.id;

    ```


    This query demonstrates joining three tables (`table1`, `table2`, and `table3`)
    based on their related columns `id`. It retrieves `column1`, `column2`, and `column3`
    from each table, respectively. The `FULL JOIN` includes all rows from all tables,
    combining matching rows based on the specified join conditions and including unmatched
    rows with `NULL` values.


    ## FULL JOIN with Aliases


    ### Example of FULL JOIN with Table Aliases:


    ```sql

    SELECT e.first_name, e.last_name, d.department_name

    FROM employees AS e

    FULL JOIN departments AS d ON e.department_id \= d.department_id;

    ```


    This query uses table aliases (`e` for `employees` and `d` for `departments`)
    to retrieve `first_name` and `last_name` from the `employees` table and `department_name`
    from the `departments` table. It includes all rows from both tables, combining
    matching rows based on the `department_id` column and including unmatched rows
    with `NULL` values.


