    # PostgreSQL INSERT INTO Statement: Comprehensive Guide


    The INSERT INTO statement in PostgreSQL is fundamental for adding new records
    into a table. It allows users to insert data into specific columns or all columns
    of a table, providing flexibility in managing data within the database. This comprehensive
    guide covers the syntax, usage, variations, constraints, and examples related
    to the INSERT INTO statement in PostgreSQL.


    ## Table of Contents


    1.  Introduction to INSERT INTO Statement


    2.  Syntax of INSERT INTO


    3.  Inserting Data into Tables


    4.  Using INSERT INTO with Examples


    5.  Bulk Insertion and Variations


    6.  Constraints and Inserting Data


    7.  Conclusion


    ## Introduction to INSERT INTO Statement


    The INSERT INTO statement in PostgreSQL is used to add new rows or records into
    a table. It allows users to specify the table name and either provide values directly
    or use the results of a query to insert data. This statement is crucial for populating
    tables with initial or ongoing data.


    ## Syntax of INSERT INTO


    The general syntax of the INSERT INTO statement in PostgreSQL is as follows:


    sql code


    INSERT INTO table\_name \[(column1, column2, ...)\]


    VALUES (value1, value2, ...);


    *   table\_name: Name of the table where data will be inserted.


    *   (column1, column2, ...): Optional list of specific columns if values are inserted
    selectively.


    *   VALUES (value1, value2, ...): Values to be inserted into the specified columns.


    ## Inserting Data into Tables


    ### Inserting Data into Specific Columns


    sql code


    INSERT INTO employees (first\_name, last\_name, age)


    VALUES (''John'', ''Doe'', 30);


    Explanation:


    *   employees: Table name.


    *   first\_name, last\_name, age: Columns where data is inserted.


    *   ''John'', ''Doe'', 30: Values corresponding to the respective columns.


    ### Inserting Data into All Columns


    sql code


    INSERT INTO customers


    VALUES (101, ''Alice'', ''Smith'', ''alice@example.com'');


    Explanation:


    *   customers: Table name.


    *   If the values align with the order of columns in the table, they can be inserted
    without explicitly naming columns.


    ## Using INSERT INTO with Examples


    ### Inserting Multiple Rows in a Single Statement


    sql code


    INSERT INTO orders (order\_id, customer\_id, order\_date)


    VALUES (1, 101, ''2023-01-15''),


    (2, 102, ''2023-01-16''),


    (3, 103, ''2023-01-17'');


    Explanation:


    *   orders: Table name.


    *   Multiple sets of values specified within parentheses, separated by commas.


    ### Inserting Data from a SELECT Query


    sql code


    INSERT INTO new\_employees (first\_name, last\_name, department)


    SELECT first\_name, last\_name, department


    FROM old\_employees


    WHERE hired\_year \= 2023;


    Explanation:


    *   new\_employees: Destination table name.


    *   old\_employees: Source table name.


    *   SELECT query retrieves data from the source table and inserts it into the
    destination table.


    ## Bulk Insertion and Variations


    ### Bulk Insertion using INSERT INTO ... SELECT


    sql code


    INSERT INTO new\_orders (order\_id, customer\_id, order\_date)


    SELECT order\_id, customer\_id, CURRENT\_DATE


    FROM pending\_orders


    WHERE order\_date <\= ''2023-12-31'';


    Explanation:


    *   new\_orders: Destination table name.


    *   pending\_orders: Source table name.


    *   SELECT retrieves data meeting specific conditions and inserts it into the
    destination table.


    ### Copy Command for Bulk Insertion


    The COPY command is used to bulk load data from a file into a table.


    sql code


    COPY customers FROM ''/path/to/customers.csv'' DELIMITER '','' CSV HEADER;


    Explanation:


    *   customers: Table name.


    *   ''/path/to/customers.csv'': Path to the CSV file containing data to be loaded.


    *   DELIMITER '','' CSV HEADER: Specifies the file format with a comma delimiter
    and includes a header row.


    ## Constraints and Inserting Data


    When inserting data into tables with constraints, ensure that inserted values
    adhere to the defined constraints. For instance:


    sql code


    CREATE TABLE products (


    product\_id SERIAL PRIMARY KEY,


    product\_name VARCHAR(100) NOT NULL,


    price NUMERIC(10, 2) CHECK (price > 0)


    );


    INSERT INTO products (product\_name, price)


    VALUES (''Laptop'', \-1500); \-- Error: violates CHECK constraint


    Explanation:


    *   Attempting to insert a negative price violates the CHECK constraint, resulting
    in an error.


    ## Conclusion


    The INSERT INTO statement in PostgreSQL is a pivotal command for adding data into
    tables within a database. Understanding its syntax, variations, and constraints
    ensures efficient insertion of data while maintaining data integrity and consistency.
    Whether inserting single or multiple rows, using direct values or query results,
    the INSERT INTO statement provides flexibility in managing and populating tables.
    Incorporating these principles and examples will facilitate effective data insertion
    and manipulation within PostgreSQL databases.


