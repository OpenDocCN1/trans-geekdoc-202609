  trans: "\n\n# 3. 使用 pgAdmin 4 连接到 PostgreSQL\n# 4. 探索 pgAdmin 4 界面\n# 5. 管理 PostgreSQL\
    \ 数据库\n# 6. 使用 pgAdmin 4 查询数据\n# 7. pgAdmin 4 的高级功能\n# 8. 结论（注：上述标题是文档结构的一部分）\n\
    \n## pgAdmin 4 简介\n\n`pgAdmin 4` 是一个用于处理 `PostgreSQL` 数据库的 Web 管理工具。它为数据库管理员、开发者和用户提供了一个直观的图形化界面，用于执行创建数据库、查询、修改模式、数据操纵等各种任务。`pgAdmin\
    \ 4` 通过提供具有丰富功能的用户友好界面，简化了数据库管理流程。\n\n## pgAdmin 4 的安装\n\n### 1. 独立版安装\n\n- 访问\
    \ pgAdmin 官方网站，下载适用于你操作系统的相应安装程序。\n- 运行安装程序并按照屏幕上的说明完成安装过程。\n\n### 2. Docker 安装\n\
    \n如果你倾向于使用 `Docker`，可以使用官方的 `Docker` 镜像安装 `pgAdmin 4`：\n\n```bash\ndocker pull\
    \ dpage/pgadmin4\ndocker run -p 80:80 -e 'PGADMIN_DEFAULT_EMAIL=user@example.com'\
    \ -e 'PGADMIN_DEFAULT_PASSWORD=SuperSecret' dpage/pgadmin4\n```\n\n将 `user@example.com`\
    \ 和 `SuperSecret` 替换为你用于登录 `pgAdmin 4` 的邮箱和密码。\n\n## 使用 pgAdmin 4 连接到 PostgreSQL\n\
    \n安装完成后，按照以下步骤将 `pgAdmin 4` 连接到你的 `PostgreSQL` 服务器：\n\n1. 启动 `pgAdmin 4`：打开浏览器并输入\
    \ `pgAdmin 4` 托管的 URL（通常为 `http://localhost:5050` 或 `http://127.0.0.1:5050`）。\n\
    2. 登录：使用安装期间设置的凭据或默认登录（如果是 `Docker`，邮箱：`user@example.com`，密码：`SuperSecret`）。\n\
    3. 添加 PostgreSQL 服务器：点击“Add New Server”（新建服务器）按钮，输入服务器详细信息（如名称、主机、端口、用户名、密码），并保存连接。\n\
    \n## 探索 pgAdmin 4 界面\n\n### 仪表板 (Dashboard)\n\n`pgAdmin 4` 仪表板提供了连接服务器、最近活动和系统信息的概览。\n\
    \n### 导航面板 (Navigation Panel)\n\n左侧导航面板包含多个部分，如 `Servers`服务器、`Databases`数据库、`Roles`角色、`Schemas`模式、`Query\
    \ Tool`查询工具等等。\n\n### 对象浏览器 (Object Browser)\n\n`Object Browser` 显示数据库、模式、表、视图、`functions`（函数）等的层级结构。\n\
    \n## 管理 PostgreSQL 数据库\n\n### 创建数据库\n\n1. 在目标服务器下的“Databases”节点上点击右键。\n2. 选择“Create”（创建）\
    \ > “Database”（数据库）。\n3. 输入数据库名称，根据需要配置其他选项。\n\n### 创建表\n\n1. 导航到目标数据库。\n2. 右键点击“Tables”（表）并选择“Create”\
    \ > “Table”（表）。\n3. 定义表列、数据类型、约束并保存表。\n\n### 管理用户和角色\n\n1. 在“Roles”（角色）部分下，右键点击并选择“Create”\
    \ > “Login/Group Role”（登录/组角色）。\n2. 输入角色详细信息，设置权限并将角色分配给用户。\n\n## 使用 pgAdmin 4\
    \ 查询数据\n\n### 使用查询工具 (Query Tool)\n\n1. 选择目标数据库。\n2. 点击“Tools”（工具）菜单并选择“Query\
    \ Tool”（查询工具）。\n3. 在编辑器中编写 SQL 查询并执行。\n\n### 查询生成器 (Query Builder)\n\n`pgAdmin\
    \ 4` 提供了一个可视化查询生成器，无需编写 SQL 代码即可创建查询。\n\n## pgAdmin 4 的高级功能\n\n### 导入/导出数据\n\n\
    - 使用“Import/Export”功能将数据从 `CSV`、`JSON` 或文件格式导入表。\n- 将查询结果或表导出到各种文件格式。\n\n### 备份与恢复\n\
    \n- 使用 `pgAdmin 4` 的备份和恢复功能执行数据库备份和恢复。\n- 为数据库设置周期性的自动备份。\n\n### 计划任务\n\n- 使用\
    \ `pgAdmin 4` 集成的 `pgAgent` 工具调度周期性任务，如备份、数据清理或维护。\n\n### 服务器配置\n\n- 通过界面调整服务器配置，包括内存分配、连接设置和日志参数。\n\
    \n## 结论\n\n`pgAdmin 4` 是管理 `PostgreSQL` 数据库不可不可少的工具，为数据库管理、开发和维护提供了丰富的功能集。本指南概述了安装、连接\
    \ `PostgreSQL`、导航界面、管理数据库、查询数据以及利用 `pgAdmin 4` 内的高级功能。在继续探索时，请利用 `pgAdmin 4` 的多样功能来简化你的\
    \ `PostgreSQL` 数据库管理任务并提高效率。\n\n# PostgreSQL CREATE TABLE：深度指南\n\n在 `PostgreSQL`\
    \ 数据库中创建表是数据库管理的基础方面。`PostgreSQL` 中的 `CREATE TABLE` 语句允许用户定义表、指定列、设置约束并建立关系。本全面指南将涵盖\
    \ `PostgreSQL` 中 `CREATE TABLE` 的语法、用法、各种选项、约束和示例。\n\n## 目录\n\n1. `CREATE TABLE`\
    \ 语句简介\n2. `CREATE TABLE` 语法\n3. 列定义\n4. 定义约束\n5. 创建示例表\n6. 高级功能与选项\n7. 结论\n\n\
    ## CREATE TABLE 语句简介\n\n`PostgreSQL` 中的 `CREATE TABLE` 语句用于在数据库中创建新表。它允许用户通过指定列、数据类型、约束和默认值来定义表结构。该语句对于以结构化方式存储数据至关重要。\n\
    \n## CREATE TABLE 语法\n\n`PostgreSQL` 中 `CREATE TABLE` 的通用语法如下：\n\n```sql\nCREATE\
    \ TABLE table_name (\n    column1 datatype [constraint],\n    column2 datatype\
    \ [constraint],\n    ...\n    [table_constraints]\n);\n```\n\n- `table_name`：要创建的表名。\n\
    - `column1`, `column2` 等：表中的定义。\n- `datatype`：指定数据类型。\n- `[constraint]`：可选约束，如\
    \ `NOT NULL`、`UNIQUE`、`PRIMARY KEY` 等。\n- `[table_constraints]`：可选的表级约束，如 `FOREIGN\
    \ KEY` 等。\n\n## 列定义\n\n创建表时，需要为每列定义名称和数据类型。此外，还可以为列指定各种属性：\n\n- **列名**：表中列名称。\n\
    - **数据类型**：列可以存储的数据类型（例如整数、文本、日期）。\n- **NOT NULL 约束**：确保该列不包含空值。\n- **DEFAULT\
    \ 约束**：在未指定值时为列分配默认值。\n- **UNIQUE 约束**：确保列值在所有行中唯一的。\n\n## 定义约束\n\n约束对列实施规则或条件，以维护表的数据完整性和一致性。`PostgreSQL`\
    \ 支持多种约束：\n\n- **PRIMARY KEY 约束**：指定每行的唯一标识符并确保不为空。\n- **FOREIGN KEY 约束**：根据每个表中列的值建立表之间的链接。\n\
    - **CHECK 约束**：实施列必须满足的特定条件。\n- **UNIQUE 约束**：确保列或列组的值在行之间是唯一的。\n\n## 创建示例表\n\n\
    ### 示例 1：基础表创建\n\n```sql\nCREATE TABLE employees (\n    employee_id SERIAL PRIMARY\
    \ KEY,\n    first_name VARCHAR(50) NOT NULL,\n    last_name VARCHAR(50) NOT NULL,\n\
    \    email VARCHAR(100) UNIQUE,\n    hire_date DATE DEFAULT CURRENT_DATE\n);\n\
    ```\n\n- `employees`：表名。\n- `employee_id`：作为主键的数字列，带有自动递增序列 (`SERIAL`)。\n- `first_name`\
    \ 和 `last_name`：存储员工名的列，设置为 `NOT NULL`。\n- `email`：存储电子邮件地址的列，强制执行 `UNIQUE` 约束。\n\
    - `hire_date`：日期列，默认值为 `CURRENT_DATE`。\n\n"
- fmt: "\n- `hire_date`: Column representing the date of employment, defaults to the\
    \ current date if not specified.\n\n### Example 2: Table with Constraints\n\n\
    ```sql\nCREATE TABLE products (\n  product_id SERIAL PRIMARY KEY,\n  product_name\
    \ VARCHAR(100) NOT NULL,\n  price NUMERIC(10, 2) CHECK (price > 0),\n  category_id\
    \ INTEGER REFERENCES categories(category_id)\n);\n```\n\nExplanation:\n- `products`:\
    \ Table for storing product information.\n- `product_id`: Primary key column for\
    \ unique identification of each product.\n- `product_name`: Column storing the\
    \ name of the product, set as NOT NULL.\n- `price`: Column representing the price\
    \ of the product, with a `CHECK` constraint ensuring the price is greater than\
    \ 0.\n- `category_id`: Column referencing the `category_id` column in the `categories`\
    \ table to establish a foreign key relationship.\n\n## Advanced Features and Options\n\
    \n### Temporary Tables\n\nTemporary tables are created and exist for the duration\
    \ of a session. They are automatically dropped at the end of the session.\n\n\
    ```sql\nCREATE TEMPORARY TABLE temp_table (\n  -- Column definitions\n);\n```\n\
    \n### Table Inheritance\n\nPostgreSQL supports table inheritance where one table\
    \ inherits the structure and columns from another table.\n\n```sql\nCREATE TABLE\
    \ parent_table (\n  -- Column definitions\n);\n\nCREATE TABLE child_table (\n\
    \  -- Column definitions\n) INHERITS (parent_table);\n```\n\n### Tablespaces\n\
    \nTablespaces allow users to specify the physical location for storing the data\
    \ of a table.\n\n```sql\nCREATE TABLE table_with_space (\n  -- Column definitions\n\
    ) TABLESPACE space_name;\n```\n\n## Conclusion\n\nThe `CREATE TABLE` statement\
    \ in PostgreSQL is a fundamental command for defining the structure of tables\
    \ within a database. It allows users to specify columns, data types, constraints,\
    \ and other attributes essential for organizing and managing data efficiently.\
    \ Understanding the syntax and various options available within the `CREATE TABLE`\
    \ statement empowers database administrators and developers to design and create\
    \ tables tailored to their specific requirements, ensuring data integrity and\
    \ consistency within the database system.\n\n# PostgreSQL INSERT INTO Statement:\
    \ Comprehensive Guide\n\nThe `INSERT INTO` statement in PostgreSQL is fundamental\
    \ for adding new records into a table. It allows users to insert data into specific\
    \ columns or all columns of a table, providing flexibility in managing data within\
    \ the database. This comprehensive guide covers the syntax, usage, variations,\
    \ constraints, and examples related to the `INSERT INTO` statement in PostgreSQL.\n\
    \n## Table of Contents\n\n1. Introduction to `INSERT INTO` Statement\n2. Syntax\
    \ of `INSERT INTO`\n3. Inserting Data into Tables\n4. Using `INSERT INTO` with\
    \ Examples\n5. Bulk Insertion and Variations\n6. Constraints and Inserting Data\n\
    7. Conclusion\n\n## Introduction to `INSERT INTO` Statement\n\nThe `INSERT INTO`\
    \ statement in PostgreSQL is used to add new rows or records into a table. It\
    \ allows users to specify the table name and either provide values directly or\
    \ use the results of a query to insert data. This statement is crucial for populating\
    \ tables with initial or ongoing data.\n\n## Syntax of `INSERT INTO`\n\nThe general\
    \ syntax of the `INSERT INTO` statement in PostgreSQL is as follows:\n\n```sql\n\
    INSERT INTO table_name [(column1, column2, ...)]\nVALUES (value1, value2, ...);\n\
    ```\n\n- `table_name`: Name of the table where data will be inserted.\n- `(column1,\
    \ column2, ...)`: Optional list of specific columns if values are inserted selectively.\n\
    - `VALUES (value1, value2, ...)`: Values to be inserted into the specified columns.\n\
    \n## Inserting Data into Tables\n\n### Inserting Data into Specific Columns\n\n\
    ```sql\nINSERT INTO employees (first_name, last_name, age)\nVALUES ('John', 'Doe',\
    \ 30);\n```\n\nExplanation:\n- `employees`: Table name.\n- `first_name`, `last_name`,\
    \ `age`: Columns where data is inserted.\n- `'John'`, `'Doe'`, `30`: Values corresponding\
    \ to the respective columns.\n\n### Inserting Data into All Columns\n\n```sql\n\
    INSERT INTO customers\nVALUES (101, 'Alice', 'Smith', 'alice@example.com');\n\
    ```\n\nExplanation:\n- `customers`: Table name.\n- If the values align with the\
    \ order of columns in the table, they can be inserted without explicitly naming\
    \ columns.\n\n## Using `INSERT INTO` with Examples\n\n### Inserting Multiple Rows\
    \ in a Single Statement\n\n```sql\nINSERT INTO orders (order_id, customer_id,\
