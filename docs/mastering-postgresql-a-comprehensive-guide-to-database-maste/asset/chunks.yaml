    ## Introduction to UNION


    The UNION operator in PostgreSQL is used to combine the result sets of multiple
    SELECT queries into a single result set. It removes duplicate rows from the combined
    result set by default.


    ## Basic Syntax of UNION


    The basic syntax of the UNION operator in PostgreSQL involves combining the results
    of two or more SELECT statements:


    sql code


    SELECT column1, column2, ...


    FROM table1


    UNION


    SELECT column1, column2, ...


    FROM table2;


    *   SELECT column1, column2, ...: Specifies the columns to retrieve.


    *   FROM table1: Specifies the first table for the first SELECT statement.


    *   UNION: Combines the result set with the result set of the subsequent SELECT
    statement(s).


    *   SELECT column1, column2, ...: Specifies columns from another table for subsequent
    SELECT statement(s).


    ## Using UNION


    The UNION operator in PostgreSQL combines the result sets of multiple SELECT statements
    into one result set, removing duplicate rows from the final result set.


    ## Examples of UNION


    ### Example of UNION:


    Consider two tables, employees and managers, retrieving the names of employees
    and managers:


    sql code


    SELECT employee\_name


    FROM employees


    UNION


    SELECT manager\_name


    FROM managers;


    This query combines the names of employees and managers into a single list, removing
    duplicate names and displaying a unique list of names.


    ## UNION ALL


    ### UNION ALL Example:


    If you want to include all rows, including duplicates, you can use UNION ALL:


    sql code


    SELECT employee\_name


    FROM employees


    UNION ALL


    SELECT manager\_name


    FROM managers;


    This query combines all rows from both employees and managers tables, including
    duplicates if present.


    ## Performance Considerations


    *   Data Volume: Be cautious with UNION when dealing with large datasets as it
    involves sorting and removing duplicates.


    *   Index Usage: Ensure appropriate indexing on columns involved in UNION operations
    for performance optimization.


