    ## Introduction to GROUP BY


    The `GROUP BY` clause in PostgreSQL is used to group rows based on the values
    of one or more columns and aggregate data to generate summaries or insights from
    the grouped data.


    ## Basic Syntax of GROUP BY


    The basic syntax of the `GROUP BY` clause in PostgreSQL involves specifying the
    columns to group by in the `SELECT` statement:


    ```sql

    SELECT column1, aggregate_function(column2)

    FROM table_name

    GROUP BY column1;

    ```


    - `SELECT column1, aggregate_function(column2)`: Specifies columns and aggregate
    functions to retrieve data.

    - `FROM table_name`: Specifies the table from which to retrieve data.

    - `GROUP BY column1`: Specifies the column(s) to group by.


    ## Using GROUP BY


    The `GROUP BY` clause in PostgreSQL groups rows that have the same values in the
    specified column(s) and applies aggregate functions to generate summary data for
    each group.


    ## Examples of GROUP BY


    ### Example of GROUP BY:


    Consider a `sales` table, and we want to calculate the total sales amount for
    each product:


    ```sql

    SELECT product_id, SUM(sale_amount) AS total_sales

    FROM sales

    GROUP BY product_id;

    ```


    This query groups the sales records by `product_id` and calculates the total sales
    amount for each product.


    ## GROUP BY with Aggregate Functions


    ### Example of GROUP BY with Aggregate Functions:


    Let''s find the number of orders placed by each customer:


    ```sql

    SELECT customer_id, COUNT(order_id) AS total_orders

    FROM orders

    GROUP BY customer_id;

    ```


    This query groups the orders by `customer_id` and counts the number of orders
    placed by each customer.


    ## GROUP BY with HAVING Clause


    ### Example of GROUP BY with HAVING Clause:


    Suppose we want to find customers who have placed more than five orders:


    ```sql

    SELECT customer_id, COUNT(order_id) AS total_orders

    FROM orders

    GROUP BY customer_id

    HAVING COUNT(order_id) > 5;

    ```

