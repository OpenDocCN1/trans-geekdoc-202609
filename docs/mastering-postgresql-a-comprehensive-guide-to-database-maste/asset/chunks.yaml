    FROM products

    WHERE unit_price < ANY (

    SELECT unit_price

    FROM products

    WHERE category_id = 2

    ORDER BY unit_price

    LIMIT 1

    );

    ```

    该查询从 `products` 表中检索 `product_name` 和 `unit_price`，其中价格低于类别 2 中的最低价格。


