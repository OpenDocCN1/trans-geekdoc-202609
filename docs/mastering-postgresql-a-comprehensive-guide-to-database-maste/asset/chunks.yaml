  trans: "\n\n## 2. 创建新数据库\n\n在 `psql` 中使用 SQL：\n\n```sql\nCREATE DATABASE demo_database;\n\
    ```\n\n此 `SQL` 命令创建了一个名为 `demo_database` 的新数据库。\n\n## 3. 连接到新数据库\n\n```bash\n\\\
    c demo_database\n```\n\n此命令在 CLI 中连接到新创建的 `demo_database`。\n\n## 4. 创建表\n\n在 `demo_database`\
    \ 中创建表来表示你的数据实体。这里创建一个 `users` 表的示例：\n\n```sql\nCREATE TABLE users (\n  user_id\
    \ SERIAL PRIMARY KEY,\n  username VARCHAR(50) UNIQUE NOT NULL,\n  email VARCHAR(100)\
    \ UNIQUE NOT NULL,\n  created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP\n);\n```\n\
    \n此 `SQL` 命令创建一个包含 `user_id`、`username`、`email` 和 `created_at` 列的 `users` 表。\n\
    \n## 5. 插入示例数据\n\n使用 `INSERT` 语句向表中填充示例数据：\n\n```sql\nINSERT INTO users (username,\
    \ email) VALUES\n('john_doe', 'john@example.com'),\n('jane_smith', 'jane@example.com');\n\
    ```\n\n此 `SQL` 命令将示例用户数据插入到 `users` 表中。\n\n## 6. 建立（可选）\n\n使用外键在表之间建立关系：\n\n```sql\n\
    ALTER TABLE other_table\nADD COLUMN user_id INTEGER REFERENCES users(user_id);\n\
    ```\n\n将 `other_table` 替换为你想与 `users` 表建立关系的表名。\n\n## 7. 验证并查询数据\n\n运行 `SQL` 查询以验证数据库架构并检索数据：\n\
    \n```sql\nSELECT * FROM users;\n```\n\n此 `SQL` 查询从 `users` 表中获取所有记录。\n\n## 8.\
    \ 执行清理（可选）\n\n如果需要，删除 `demo_database`：\n\n```sql\nDROP DATABASE demo_database;\n\
    ```\n\n## 创建演示数据库的最佳实践\n\n1. **使用描述性名称**：为表、列和关系命名具有意义的名称，以便于更好地理解。\n2. **包含示例数据**：向表中填充真实的示例数据，以演示真实世界的场景。\n\
    3. **文档化架构**：对表、列和约束进行注释，以解释它们的用途和功能。\n4. **练习分离**：使用单独演示数据库来展示不同的功能或场景。\n5. **安全性考量**：对敏感数据要谨慎；避免使用实际的用户凭据或个人信息。\n\
    \n## 结论\n\n在 PostgreSQL 中创建演示数据库对于测试、开发和演示目的至关重要。本指南带你介绍了创建演示数据库的过程，包括创建数据库、定义表、插入示例数据、建立关系和查询信息的步骤。通过遵循最佳实践并利用演示数据库，开发者和数据库管理员可以在部署到生产数据库之前，在受控环境中有效地展示、测试和原型化应用程序及功能。\n\
    \n## PostgreSQL 语法简介\n\nPostgreSQL 是一种强大的开源关系型数据库管理系统，以其可靠性、扩展性和对 SQL 标准的遵循而闻名。理解\
    \ PostgreSQL 的语法对于有效地创建、管理和查询数据库至关重要。本综合指南涵盖了与各种 PostgreSQL 命令和语句相关的语法、规则和示例。\n\
    \n### PostgreSQL 命令的基本结构\n\nPostgreSQL 命令使用 `SQL`（结构化查询语言）编写，并分为不同的类别，包括数据定义语言\
    \ (DDL)、数据操作语言 (DML)、数据控制语言 (DCL) 和事务控制语言 (TCL)。\n\n- **DDL**：用于定义和管理数据库结构，如表、索引、约束。\n\
    - **DML**：涉及操作表内的数据（例如 `INSERT`、`UPDATE`、`DELETE`）。\n- **DCL**：管理数据库中对象的访问权限和许可。\n\
    - **TCL**：控制数据库内的事务。\n\n### PostgreSQL 基本语法元素\n\n#### 注释\n\n```sql\n-- 单行注释\n\
    /* 多行注释 */\n```\n\nPostgreSQL 中的注释用于文档说明和 `SQL` 代码解释。\n\n#### 关键字\n\nPostgreSQL\
    \ 具有各种用途的保留关键字。关键字不能作为标识符（例如表或列名），除非用双引号括起来。\n\n```sql\nSELECT * FROM \"order\"\
    ;\n```\n\n#### 标识符\n\n标识符是数据库对象的名称，如表、列或别名。\n\n###  数据定义语言 (DDL)\n\n#### CREATE\
    \ TABLE 语句\n\n```sql\nCREATE TABLE employees (\n  employee_id SERIAL PRIMARY KEY,\n\
    \  name VARCHAR(100),\n  department VARCHAR(50)\n);\n```\n\n此语句创建一个名为 `employees`\
    \ 的表，具有 `employee_id`、`name` 和 `department` 列。\n\n#### ALTER TABLE 语句\n\n```sql\n\
    ALTER TABLE employees\nADD COLUMN salary NUMERIC(10, 2);\n```\n\n此命令为 `employees`\
    \ 表添加了 `salary` 列。\n\n#### DROP TABLE 语句\n\n```sql\nDROP TABLE employees;\n```\n\
    \n此语句从数据库中删除 `employees` 表及其数据。\n\n### 数据操作语言 (DML)\n\n#### INSERT INTO 语句\n\n\
    ```sql\nINSERT INTO employees (name, department)\nVALUES ('John Doe', 'IT');\n\
    ```\n\n此命令向 `employees` 表插入一条记录。\n\n#### UPDATE 语句\n\n```sql\nUPDATE employees\n\
    SET salary = 60000\nWHERE employee_id = 101;\n```\n\n此语句更新 `employee_id` 为 101\
    \ 的员工工资。\n\n#### DELETE FROM 语句\n\n```sql\nDELETE FROM employees\nWHERE department\
    \ = 'HR';\n```\n\n此命令删除 `employees` 表中部门为 'HR' 的所有记录。\n\n### 使用 SELECT 查询数据\n\n\
    #### SELECT 语句\n\n```sql\nSELECT * FROM employees;\n```\n\n此查询从 `employees` 表中检索所有列和记录。\n\
    \n#### WHERE 子句\n\n```sql\nSELECT * FROM employees\nWHERE department = 'IT';\n\
    ```\n\n此查询过滤出仅部门为 'IT' 的记录。\n\n#### JOIN 子句\n\n```sql\nSELECT e.name, d.department_name\n\
    FROM employees e\nJOIN departments d e.department_id = d.department_id;\n```\n\
    \n此查询根据 `department_id` 对 `employees` 表和 `departments` 表执行内连接。\n\n### 事务控制语言 (TCL)\n\
    \n#### COMMIT 语句\n\n```sql\nCOMMIT;\n```\n\n此语句提交当前事务以使更改永久。\n\n#### ROLLBACK\
    \ 语句\n\n```sql\nROLLBACK;\n```\n\n此命令回滚当前事务，取消自上次提交以来的所有更改。\n\n### 数据控制语言 (DCL)\n\
    \n#### GRANT 语句\n\n```sql\nGRANT SELECT ON employees TO my_user;\n```\n\n此语句授予用户\
    \ `my_user` 对 `employees` 表的 `SELECT` 权限。\n\n#### REVOKE 语句\n\n```sql\nREVOKE\
    \ INSERT ON employees FROM my_user;\n```\n\n此命令从用户 `my_user` 撤销对 `employees` 表的\
    \ `INSERT` 权限。\n\n"
- fmt: "\n# 3. Comparison Operators\n# 4. Logical Operators\n# 5. String Operators\n\
    # 6. Bitwise Operators\n# 7. Other Operators\n# 8. Conclusion\n\n## Introduction\
    \ to PostgreSQL Operators\n\nOperators in PostgreSQL are symbols or keywords that\
    \ perform specific operations on operands, which can be constants, variables,\
    \ or expressions. They are used in SQL queries to perform calculations, comparisons,\
    \ logical operations, and manipulations on data stored in the database.\n\n###\
    \ Operator Categories in PostgreSQL\n\n1. Arithmetic Operators: Perform mathematical\
    \ calculations.\n2. Comparison Operators: Compare values to determine relationships.\n\
    3. Logical Operators: Evaluate conditions and logical expressions.\n4. String\
    \ Operators: Manipulate and compare strings.\n5. Bitwise Operators: Perform bitwise\
    \ operations on binary data.\n6. Other Operators: Specialized operators for specific\
    \ tasks.\n\nLet's delve into each category of operators with explanations and\
    \ examples.\n\n## Arithmetic Operators\n\nArithmetic operators are used for performing\
    \ mathematical calculations on numeric data types.\n\n### Examples of Arithmetic\
    \ Operators:\n\n* Addition (`+`): Adds two values together.\n\n```sql\nSELECT\
    \ 10 + 5; -- Result: 15\n```\n* Subtraction (`-`): Subtracts one value from another.\n\
    \n```sql\nSELECT 20 - 8; -- Result: 12\n```\n* Multiplication (`*`): Multiplies\
    \ two values.\n\n```sql\nSELECT 6 * 4; -- Result: 24\n```\n* Division (`/`): Divides\
    \ one value by another.\n\n```sql\nSELECT 50 / 10; -- Result: 5\n```\n* Modulus\
    \ (`%`): Returns the remainder of a division.\n\n```sql\nSELECT 17 % 5; -- Result:\
    \ 2\n```\n\n## Comparison Operators\n\nComparison operators are used to compare\
    \ values and determine the relationship between them.\n\n### Examples of Comparison\
    \ Operators:\n\n* Equal to (`=`): Checks if two values are equal.\n\n```sql\n\
    SELECT 10 = 5; -- Result: false (0)\n```\n* Not equal to (`<>` or `!=`): Checks\
    \ if two values are not equal.\n\n```sql\nSELECT 10 <> 5; -- Result: true (1)\n\
    ```\n* Greater than (`>`): Checks if one value is greater than another.\n\n```sql\n\
    SELECT 15 > 8; -- Result: true (1)\n```\n* Less than (`<`): Checks if one value\
    \ is less than another.\n\n```sql\nSELECT 12 < 6; -- Result: false (0)\n```\n\
    * Greater than or equal to (`>=`): Checks if one value is greater than or equal\
    \ to another.\n\n```sql\nSELECT 20 >= 20; -- Result: true (1)\n```\n* Less than\
    \ or equal to (`<=`): Checks if one value is less than or equal to another.\n\n\
    ```sql\nSELECT 30 <= 25; -- Result: false (0)\n```\n\n## Logical Operators\n\n\
    Logical operators are used to perform logical operations on expressions that result\
    \ in true or false.\n\n### Examples of Logical Operators:\n\n* AND (`AND`): Returns\
    \ true if both conditions are true.\n\n```sql\nSELECT (5 > 3) AND (10 < 15); --\
    \ Result: true (1)\n```\n* OR (`OR`): Returns true if at least one condition is\
    \ true.\n\n```sql\nSELECT (7 < 4) OR (12 = 12); -- Result: true (1)\n```\n* NOT\
    \ (`NOT`): Negates the result of a condition.\n\n```sql\nSELECT NOT (10 >= 15);\
    \ -- Result: true (1)\n```\n\n## String Operators\n\nString operators are used\
    \ for manipulating and comparing strings.\n\n### Examples of String Operators:\n\
    \n* Concatenation (`||`): Concatenates two strings.\n\n```sql\nSELECT 'Hello '\
    \ || 'World'; -- Result: 'Hello World'\n```\n* Pattern Matching (`LIKE`): Matches\
    \ a pattern within a string.\n\n```sql\nSELECT 'Database' LIKE '%base%'; -- Result:\
    \ true (1)\n```\n\n## Bitwise Operators\n\nBitwise operators perform operations\
    \ at the bit level on binary data.\n\n### Examples of Bitwise Operators:\n\n*\
    \ Bitwise AND (`&`): Performs a bitwise AND operation.\n\n```sql\nSELECT 7 & 3;\
    \ -- Result: 3\n```\n* Bitwise OR (`|`): Performs a bitwise OR operation.\n\n\
    ```sql\nSELECT 5 | 3; -- Result: 7\n```\n* Bitwise XOR (`#` or `^`): Performs\
    \ a bitwise XOR operation.\n\n```sql\nSELECT 5 ^ 3; -- Result: 6\n```\n\n## Other\
