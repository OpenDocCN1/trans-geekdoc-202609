    ## 升序与降序排序


    ### 升序（默认）


    ```sql

    SELECT * FROM customers ORDER BY customer_id ASC;

    ```


    此查询根据 `customer_id` 列对结果进行升序排序，如果不显式指定，这是默认行为。


    ### 降序


    ```sql

    SELECT * FROM orders ORDER BY order_date DESC;

    ```


