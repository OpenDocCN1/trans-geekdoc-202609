    ## Introduction to `SUM` Function


    The `SUM` function in PostgreSQL is an aggregate function designed to calculate
    the total sum of values in a specified column or expression. It facilitates the
    computation of cumulative totals, allowing users to perform mathematical operations
    and generate aggregated results for numerical data.


    ## Basic Syntax of `SUM` Function


    The basic syntax of the `SUM` function in PostgreSQL is as follows:


    ```

    SELECT SUM(column_name) AS total_sum

    FROM table_name;

    ```


    * `SELECT SUM(column_name)`: Specifies the `SUM` function to calculate the total
    sum of values in the specified column.

    * `AS total_sum`: Assigns an alias to the calculated sum.

    * `FROM table_name`: Specifies the table from which the sum will be calculated.


    ## Using `SUM` Function


    The `SUM` function is used to compute the total sum of numeric values within a
    column. It is commonly applied in various scenarios, such as calculating total
    sales, revenue, quantities, or any other numerical data.


    ## Examples of `SUM` Function


    ### Calculating Total Sales Amount


    ```sql

    SELECT SUM(amount) AS total_sales

    FROM sales;

    ```


    This query computes the total sales amount by summing up the values in the `amount`
    column from the `sales` table.


    ### Determining Total Quantity Sold


    ```sql

    SELECT SUM(quantity) AS total_quantity_sold

    FROM inventory;

    ```


    This query calculates the total quantity sold by summing up the values in the
    `quantity` column from the `inventory` table.


    ## `SUM` with `DISTINCT`


    The `SUM` function can be combined with `DISTINCT` to calculate the sum of distinct
    or unique values within a column.


    ### Calculating Sum of Distinct Prices


    ```sql

    SELECT SUM(DISTINCT price) AS total_distinct_price

    FROM products;

    ```


    This query computes the sum of distinct price values from the `products` table.


    ## Handling NULL Values with `SUM`


    The `SUM` function treats NULL values differently:


    * Ignores NULL values when calculating the sum.


    ### Handling NULL Values with `SUM`


    ```sql

    SELECT SUM(salary) AS total_salary

    FROM employees;

    ```


    In this query, the `SUM` function calculates the total salary, excluding any rows
    where the `salary` column contains NULL values.


    ## `SUM` with `GROUP BY`


    The `SUM` function can be used with `GROUP BY` to calculate sums for different
    groups within a column.


    ```sql

    SELECT product_category, SUM(revenue) AS total_revenue

    FROM sales_data

    GROUP BY product_category;

    ```


    This query calculates the total revenue for each product category using `GROUP
    BY`.


    ## Performance Considerations


    * Index Usage: Utilize indexes on columns used with `SUM` for improved query performance.

    * Optimize Queries: Analyze query execution plans using `EXPLAIN` to optimize
    queries involving `SUM` for better performance.


