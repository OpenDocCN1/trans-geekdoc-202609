    1. Retrieving All Records: Fetching all rows from both tables, including matched
    and unmatched rows.

    2. Data Comparison: Comparing datasets from two tables.


    ## Best Practices for FULL JOIN


    1. Index Usage: Utilize indexes on join columns.

    2. Optimize Queries: Analyze query execution plans using `EXPLAIN` to optimize
    queries.

    3. Handling NULL Values: Understand and handle `NULL` values appropriately.


