    - `DROP COLUMN column_name`: 指定要从表中删除的列。

    - `[CASCADE | RESTRICT]`: 可选。指定依赖对象的行为。`CASCADE` 会同时删除依赖对象，而 `RESTRICT` 在存在依赖对象时会限制删除操作。


