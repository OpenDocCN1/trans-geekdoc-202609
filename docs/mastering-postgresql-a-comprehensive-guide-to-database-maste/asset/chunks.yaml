    ## 4. Updating Data


    ### Updating Salary for a Specific Employee:


    ```sql

    UPDATE employees SET salary = 62000 WHERE employee_id = 2;

    ```


    ## 5. Deleting Data


    ### Deleting Records from the Employees Table:


    ```sql

    DELETE FROM employees WHERE employee_id = 1;

    ```


    ## 6. Aggregation Functions


    ### Calculating Average Salary:


    ```sql

    SELECT AVG(salary) AS avg_salary FROM employees;

    ```


    ### Finding Maximum Salary:


    ```sql

    SELECT MAX(salary) AS max_salary FROM employees;

    ```


    ## 7. Joins


    ### Performing INNER JOIN:


    ```sql

    SELECT employees.employee_id, employees.first_name, departments.department_name

    FROM employees

    INNER JOIN departments ON employees.department_id = departments.department_id;

    ```


    ## 8. Subqueries


    ### Using Subqueries to Retrieve Data:


    ```sql

    SELECT employee_id, first_name, last_name

    FROM employees

    WHERE department_id IN (SELECT department_id FROM departments WHERE location =
    ''New York'');

    ```


    ## 9. CASE Statements


    ### Implementing CASE for Categorization:


    ```sql

    SELECT employee_id,

    CASE

    WHEN salary >= 60000 THEN ''High''

    WHEN salary >= 50000 THEN ''Medium''

    ELSE ''Low''

    END AS salary_category

    FROM employees;

    ```


    ## 10. Views


    ### Creating a View to Simplify Complex Queries:


    ```sql

    CREATE VIEW high_salary_employees AS

    SELECT * FROM employees WHERE salary > 60000;

    ```


    ## 11. Indexes


    ### Creating an Index on a Column:


    ```sql

    CREATE INDEX salary_index ON employees(salary);

    ```


    ## 12. Transactions


    ### Beginning a Transaction:


    ```sql

    BEGIN;

    -- Perform multiple SQL operations

    COMMIT; -- Commit the transaction

    ```


    ## 13. Constraints


    ### Implementing Constraints for Data Integrity:


    ```sql

    ALTER TABLE employees

    ADD CONSTRAINT salary_check CHECK (salary > 0);

    ```


    ## 14. Triggers


    ### Creating a Trigger for Automated Actions:


    ```sql

    CREATE TRIGGER audit_trigger

    AFTER INSERT OR UPDATE OR DELETE ON employees

    FOR EACH ROW

    EXECUTE FUNCTION audit_log();

    ```


    ## 15. JSON Functions


    ### Working with JSON Data:


    ```sql

    SELECT employee_id, first_name, last_name, contact_info->''email'' AS email

    FROM employees

    WHERE contact_info->''phone'' = ''123-456-7890'';

    ```


    ## Conclusion


    PostgreSQL offers a wide range of functionalities and capabilities, as demonstrated
    by these examples. From basic operations like data manipulation to advanced features
    like views, triggers, and JSON functions, PostgreSQL provides a robust platform
    for managing and querying data efficiently. These examples showcase only a fraction
    of PostgreSQL''s capabilities, illustrating its versatility and suitability for
    diverse database needs across various industries.

