    ## Introduction to LIKE Operator


    The `LIKE` operator in PostgreSQL is used in `SELECT` statements to perform pattern
    matching against character strings within columns. It is particularly useful for
    searching text data based on user-defined patterns using wildcard characters,
    enabling flexible and customizable searches within database tables.


    ## Basic Syntax of LIKE Operator


    The basic syntax of the `LIKE` operator in PostgreSQL is as follows:


    ```sql

    SELECT column_name(s)

    FROM table_name

    WHERE column_name LIKE pattern;

    ```


    - `SELECT column_name(s)`: Specifies the columns to retrieve.

    - `FROM table_name`: Specifies the table from which data is retrieved.

    - `WHERE column_name LIKE pattern`: Defines the pattern to match within the specified
    column.


    ## Using LIKE Operator


    The `LIKE` operator is utilized to perform pattern matching within string data.
    It assists in searching for specific patterns or substrings within text columns,
    allowing users to filter results based on defined patterns.


    ## Wildcard Characters in LIKE Operator


    Wildcard characters used in the `LIKE` operator enable users to create flexible
    patterns for matching text. The two primary wildcard characters are:


    - `%` (percent sign): Represents zero, one, or multiple characters.

    - `_` (underscore): Represents a single character.


    These wildcard characters, when combined with text, enable the creation of custom
    patterns to match against strings.


    ## Examples of LIKE Operator


    ### Finding Names Starting with "J"


    ```sql

    SELECT *

    FROM employees

    WHERE first_name LIKE ''J%'';

    ```

    This query retrieves records from `employees` where `first_name` starts with "J".


    ### Locating Names Ending with "son"


    ```sql

    SELECT *

    FROM customers

    WHERE last_name LIKE ''%son'';

    ```

    This query fetches records from `customers` where `last_name` ends with "son".


    ## Combining Wildcards in LIKE Operator


    ### Searching Names with "a" as the Second Letter


    ```sql

    SELECT *

    FROM contacts

    WHERE first_name LIKE ''_a%'';

    ```

    This query retrieves records from `contacts` where `first_name` has "a" as the
    second letter.


    ### Finding Names with "o" as the Third Letter


    ```sql

    SELECT *

    FROM users

    WHERE username LIKE ''__o%'';

    ```

    This query fetches records from `users` where `username` has "o" as the third
    letter.


    ## Performance Considerations


    - Index Usage: Utilize indexes on columns used with `LIKE` for improved query
    performance, especially for patterns at the beginning of strings.

    - Optimize Queries: Leading wildcards (`%`) can make it challenging for indexes
    to optimize queries.


    ## Best Practices for LIKE Operator


    1. Index Utilization: Employ indexes on columns used with `LIKE` for improved
    query performance.

    2. Optimize Queries: Avoid leading wildcards (`%`) when possible.


