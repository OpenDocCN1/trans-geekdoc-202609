    The `SELECT OFFSET` clause skips a specified number of rows before returning the
    result set.


    ```sql

    SELECT * FROM products OFFSET 5;

    ```

    This query retrieves all columns from the `products` table, skipping the first
    5 rows.


    ### SELECT GROUP BY

    The `SELECT GROUP BY` clause groups rows that have the same values into summary
    rows.


    ```sql

    SELECT department_id, COUNT(*) FROM employees GROUP BY department_id;

    ```

    This query counts the number of employees in each department by grouping the results
    based on the `department_id`.


    ### SELECT HAVING

    The `SELECT HAVING` clause filters rows after grouping has been applied.


    ```sql

    SELECT department_id, COUNT(*) FROM employees GROUP BY department_id HAVING COUNT(*)
    > 5;

    ```

    This query counts the number of employees in each department and retrieves only
    those departments with more than 5 employees.


    ### SELECT JOIN

    The `SELECT JOIN` clause combines rows from two or more tables based on a related
    column between them.


    ```sql

    SELECT employees.first_name, employees.last_name, departments.department_name

    FROM employees

    INNER JOIN departments ON employees.department_id = departments.department_id;

    ```

    This query retrieves employee names and their corresponding department names by
    joining the `employees` and `departments` tables based on the `department_id`.


    ## Aggregate Functions with SELECT

    Aggregate functions perform calculations on a set of values and return a single
    value.


    ### Examples of Aggregate Functions:

    * `COUNT`: Counts the number of rows.

    * `SUM`: Calculates the sum of values.

    * `AVG`: Calculates the average of values.

    * `MIN`: Retrieves the minimum value.

    * `MAX`: Retrieves the maximum value.


    ```sql

    SELECT COUNT(*), SUM(salary), AVG(salary), MIN(salary), MAX(salary) FROM employees;

    ```

    This query computes various aggregate functions on the `salary` column of the
    `employees` table.


    ## Advanced SELECT Queries

    ### Subqueries

    Subqueries are nested queries within another query.


    ```sql

    SELECT * FROM employees WHERE department_id IN (SELECT department_id FROM departments
    WHERE location = ''New York'');

    ```

    This query retrieves employees from departments located in ''New York''.


    ### UNION

    The `UNION` operator combines the result sets of two or more `SELECT` statements.


    ```sql

    SELECT employee_id, first_name FROM employees

    UNION

    SELECT customer_id, customer_name FROM customers;

    ```

    This query retrieves employee IDs and names along with customer IDs and names.


    ## Best Practices for SELECT

    1. Use Aliases: Employ aliases for column names and tables to improve readability.

    2. Avoid `SELECT *`: Specify column names explicitly rather than using `SELECT
    *`.

