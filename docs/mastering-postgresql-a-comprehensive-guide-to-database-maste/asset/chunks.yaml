    # PostgreSQL UNION 综合指南


    在 PostgreSQL 中，`UNION` 运算符用于将两个或多个 `SELECT` 语句的结果集合并为一个单一结果集。它默认移除重复行，并根据位置对齐列。本综合指南涵盖了与
    PostgreSQL 中 `UNION` 运算符相关的语法、用法、示例、解释、场景、优势和最佳实践。


    ## 目录


    1. UNION 简介

    2. UNION 的基础语法

    3. 使用 UNION

    4. UNION 示例

    5. UNION ALL

    6. 性能考虑

    7. 使用 UNION 的场景

    8. UNION 的最佳实践

