    \ `NOT NULL`、`DEFAULT`、`UNIQUE`、`FOREIGN KEY` 等约束，以及使用 `ALTER TABLE` 命令修改现有列。理解\
    \ `ADD COLUMN` 的功能和变体，允许数据库管理员和开发人员高效地修改 PostgreSQL 数据库中的表结构，确保数据的灵活性并适应不断变化的应用程序需求。\n\
    \n# PostgreSQL UPDATE 语句：全面指南\n\nPostgreSQL 中的 `UPDATE` 语句对于修改表中的现有记录至关重要。它允许用户根据定义的条件用新值更新特定的列或行，确保数据的准确性和一致性。本全面指南涵盖了与\
    \ PostgreSQL `UPDATE` 语句相关的语法、用法、变体、约束和示例。\n\n## 目录\n\n1. `UPDATE` 语句简介\n2. `UPDATE`\
    \ 语法\n3. 更新表中的数据\n4. 带有示例的基础 `UPDATE` 语句\n5. 带条件的数据更新\n6. 使用 `UPDATE` 应用约束\n7.\
    \ 结论\n\n## `UPDATE` 语句简介\n\nPostgreSQL 中的 `UPDATE` 语句用于通过更改指定列的值来修改表中的现有记录。它提供了一种根据特定标准更新数据的强大机制，确保了准确性并反映了数据库的变化。\n\
    \n## `UPDATE` 语法\n\nPostgreSQL 中 `UPDATE` 语句的一般语法如下：\n\n```sql\nUPDATE table_name\n\
    SET column1 = value1, column2 = value2, ...\n[WHERE condition];\n```\n\n* `table_name`:\
    \ 要更新的表名。\n* `SET column1 = value1, column2 = value2, ...`: 指定要更新的列及其对应的新值。\n\
    * `[WHERE condition]`: 可选条件，根据某些标准指定要更新的行。\n\n## 更新表中的数据\n\n### 更新表中的特定列\n\n```sql\n\
    UPDATE employees\nSET salary = 60000, department = 'Sales'\nWHERE employee_id\
    \ = 101;\n```\n\n解释：\n\n* 将 `employees` 表中 `employee_id` 为 `101` 的员工的 `salary`\
    \ 改为 `60000`，将 `department` 改为 `'Sales'`。\n\n### 使用计算值更新列\n\n```sql\nUPDATE products\n\
    SET unit_price = unit_price * 1.1\nWHERE category_id = 3;\n```\n\n解释：\n\n* 将 `products`\
    \ 表中 `category_id` 为 `3` 的类别产品的 `unit_price` 提高 `10%`。\n\n## 带有示例的基础 `UPDATE`\
    \ 语句\n\n### 更新所有行的单列\n\n```sql\nUPDATE customers\nSET status = 'Inactive';\n```\n\
    \n解释：\n\n* 将 `customers` 表中所有行的 `status` 列设为 `'Inactive'`。\n\n### 在单条语句中更新多个列\n\
    \n```sql\nUPDATE orders\nSET discount = 0.1, order_status = 'Pending'\nWHERE order_date\
    \ > '2023-01-01';\n```\n\n解释：\n\n* 为 `orders` 表中 2023 年 1 月 1 日之后下达订单分配 `10%`\
    \ (`0.1`) 的 `discount`，并将 `order_status` 更新为 `'Pending'`。\n\n## 带条件的数据更新\n\n###\
    \ 基于多个条件更新\n\n```sql\nUPDATE employees\nSET department = 'HR'\nWHERE department\
    \ = 'Admin' AND hire_date < '2022-01-01';\n```\n\n解释：\n\n* 将 `employees` 表中在 2022\
    \ 年 1 月 1 日之前入职且目前处于 `'Admin'` 部门的员工 `department` 改为 `'HR'`。\n\n### 使用子查询更新\n\n\
    ```sql\nUPDATE products\nSET stock_quantity = stock_quantity - (\n  SELECT SUM(quantity)\
    \ FROM order_details WHERE product_id = products.product_id\n)\nWHERE product_id\
    \ IN (SELECT product_id FROM order_details);\n```\n\n解释：\n\n* 根据匹配的 `product_id`\
    \ 从 `order_details` 表中减去产品总量，从而更新 `products` 表中的 `stock_quantity`。\n\n## 使用 `UPDATE`\
    \ 应用约束\n\n### 更新带有约束的列\n\n```sql\nUPDATE employees\nSET salary = salary * 1.05\n\
    WHERE salary <= 50000;\n```\n\n解释：\n\n* 将 `employees` 表中 `salary` 小于或等于 `50000`\
    \ 的员工 `salary` 提高 `5%`。\n\n### 更新带有 NULL 值的列\n\n```sql\nUPDATE customers\nSET\
    \ email = NULL;\n```\n\n解释：\n\n* 将 `customers` 表的 `email` 设为 `NULL`。\n\n## 结论\n\
    \nPostgreSQL 中的 `UPDATE` 语句允许用户通过更改指定列的值来修改现有记录。本指南涵盖了向现有表添加列的语法、用法和示例，包括涉及单列或多列的场景、应用\
    \ `NOT NULL`、`DEFAULT`、`UNIQUE`、`FOREIGN KEY` 等约束，以及使用 `ALTER TABLE` 命令修改现有列。理解\
    \ `ADD COLUMN` 的功能和变体，允许数据库管理员和开发人员高效地修改 PostgreSQL 数据库中的表结构，确保数据的灵活性并适应不断变化的应用程序需求。\n\
