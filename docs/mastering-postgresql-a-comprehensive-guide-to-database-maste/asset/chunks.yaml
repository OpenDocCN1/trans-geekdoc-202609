    # Comprehensive Guide to PostgreSQL GROUP BY


    In PostgreSQL, the `GROUP BY` clause is used in conjunction with aggregate functions
    to group rows that have the same values in specified columns into summary rows.
    This comprehensive guide covers the syntax, usage, examples, explanations, scenarios,
    advantages, and best practices related to the `GROUP BY` clause in PostgreSQL.


    ## Table of Contents


    1. Introduction to GROUP BY

    2. Basic Syntax of GROUP BY

