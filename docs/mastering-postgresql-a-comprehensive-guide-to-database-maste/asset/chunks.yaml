    DELETE FROM orders\nWHERE order_date < '2023-01-01'\nAND order_status = 'Cancelled';\n\
    ```\nExplanation:\n- Deletes orders from the `orders` table where the `order_date`\
    \ is before January 1, 2023, and the `order_status` is 'Cancelled'.\n\n## Conclusion\n\
    \nThe `DELETE` statement in PostgreSQL offers a powerful tool for managing data\
    \ by selectively removing rows from tables based on specified criteria or conditions.\
    \ This guide has covered the syntax, usage, and examples of the `DELETE` statement,\
    \ including scenarios involving deleting specific rows, removing all records,\
    \ applying constraints, utilizing joins and subqueries for conditional deletions,\
    \ and using the `TRUNCATE` command for faster removal of all rows from a table.\
    \ Understanding and leveraging the capabilities of the `DELETE` statement enable\
    \ database administrators and developers to efficiently manage data within PostgreSQL\
    \ databases, ensuring data consistency and accuracy based on defined criteria\
    \ or conditions.\n\n# PostgreSQL DROP TABLE: Comprehensive Guide\n\nThe `DROP\
    \ TABLE` statement in PostgreSQL is a powerful command used to remove an existing\
    \ table from the database schema. This operation allows users to delete tables\
    \ that are no longer needed, helping in database maintenance, data cleanup, and\
    \ schema management. This comprehensive guide covers the syntax, usage, examples,\
    \ constraints, and considerations related to the `DROP TABLE` statement in PostgreSQL.\n\
    \n## Table of Contents\n\n1. Introduction to DROP TABLE Statement\n2. Syntax of\
    \ DROP TABLE\n3. Dropping Tables in PostgreSQL\n4. Basic DROP TABLE Statement\
    \ with Examples\n5. Constraints and Considerations\n6. Dropping Multiple Tables\n\
    7. Conclusion\n\n## Introduction to DROP TABLE Statement\n\nThe `DROP TABLE` statement\
    \ in PostgreSQL is used to permanently remove an entire table, including its structure,\
    \ data, and associated indexes, triggers, and constraints, from the database schema.\
    \ This command is irreversible and should be used with caution as it deletes all\
    \ data within the table and cannot be undone without a backup.\n\n## Syntax of\
    \ DROP TABLE\n\nThe general syntax of the `DROP TABLE` statement in PostgreSQL\
    \ is as follows:\n\n```sql\nDROP TABLE [IF EXISTS] table_name [CASCADE | RESTRICT];\n\
    ```\n\n- `DROP TABLE`: Specifies the intention to delete the specified table.\n\
    - `IF EXISTS`: Optional. Prevents an error from occurring if the table does not\
    \ exist.\n- `table_name`: Name of the table to be dropped.\n- `[CASCADE | RESTRICT]`:\
    \ Optional. Specifies the behavior when the table being dropped is referenced\
    \ by other database objects. `CASCADE` automatically removes dependent objects,\
    \ while `RESTRICT` prevents the drop operation if dependencies exist.\n\n## Dropping\
    \ Tables in PostgreSQL\n\n### Dropping a Single Table\n\n```sql\nDROP TABLE employees;\n\
    ```\nExplanation:\n- Deletes the `employees` table from the database schema.\n\
    \n### Dropping a Table If It Exists\n\n```sql\nDROP TABLE IF EXISTS customers;\n\
    ```\nExplanation:\n- Removes the `customers` table if it exists. If the table\
    \ does not exist, no error is thrown.\n\n## Basic DROP TABLE Statement with Examples\n\
    \n### Dropping a Table with CASCADE\n\n```sql\nDROP TABLE orders CASCADE;\n```\n\
    Explanation:\n- Deletes the `orders` table and automatically removes dependent\
    \ objects, such as indexes or constraints, linked to this table due to the `CASCADE`\
    \ option.\n\n### Dropping a Table with RESTRICT\n\n```sql\nDROP TABLE products\
    \ RESTRICT;\n```\nExplanation:\n- Attempts to delete the `products` table. If\
    \ any dependent objects are linked to this table, the `RESTRICT` option prevents\
    \ the drop operation.\n\n## Constraints and Considerations\n\n### Dropping a Table\
    \ with Foreign Key Constraints\n\n```sql\nDROP TABLE departments;\n```\nExplanation:\n\
    - Tries to delete the `departments` table. If the table has foreign key constraints\
    \ referencing it from other tables, dropping the table will fail due to existing\
    \ dependencies.\n\n### Dropping a Table with CASCADE to Remove Dependencies\n\n\
    ```sql\nDROP TABLE departments CASCADE;\n```\nExplanation:\n- Drops the `departments`\
    \ table and automatically removes dependent objects, such as foreign key constraints,\
    \ linked to this table due to the `CASCADE` option.\n\n## Dropping Multiple Tables\n\
    \n### Dropping Multiple Tables\n\n```sql\nDROP TABLE IF EXISTS orders, customers,\
    \ products;\n```\nExplanation:\n- Removes multiple tables (`orders`, `customers`,\
    \ `products`) if they exist. If any table does not exist, no error is generated.\n\
    \n## Conclusion\n\nThe `DROP TABLE` statement in PostgreSQL is a critical command\
    \ for removing tables from the database schema. This guide has covered the syntax,\
    \ usage, examples, constraints, and considerations related to dropping tables,\
    \ including scenarios involving dropping single or multiple tables, using options\
    \ like `IF EXISTS` to prevent errors, and using `CASCADE` or `RESTRICT` for handling\
    \ dependencies. Understanding the implications and proper usage of the `DROP TABLE`\
    \ statement is crucial as it permanently removes tables and associated data from\
    \ the database, ensuring cautious and deliberate actions in database management\
    \ and schema modifications within PostgreSQL databases.\n\n## Introduction to\
    \ Creating a Demo Database\n\nA demo database serves as a sandbox environment\
    \ for experimenting with database structures, performing tests, showcasing functionalities,\
    \ and demonstrating database-related applications. It typically contains sample\
    \ data, tables, relationships, and constraints to mimic a real-world scenario.\n\
    \n## Setting Up PostgreSQL\n\nBefore creating a demo database, ensure that PostgreSQL\
    \ is installed on your system. If not, download and install PostgreSQL from the\
    \ official website or use a containerized environment like Docker to run a PostgreSQL\
    \ instance.\n\n## Accessing PostgreSQL\n\nTo interact with PostgreSQL, use the\
    \ command-line interface (CLI) tool `psql` or graphical user interface (GUI) tools\
    \ like pgAdmin or DBeaver. Access PostgreSQL by running `psql` in the terminal\
    \ or launching the GUI tool and connecting to the PostgreSQL server.\n\n## Steps\
    \ to Create a Demo Database in PostgreSQL\n\n### 1. Connect to PostgreSQL\n\n\
    Using the CLI:\n\n```bash\npsql -U username -d postgres\n```\nReplace `username`\
    \ with your PostgreSQL username.\n\nUsing GUI:\n- Open pgAdmin or DBeaver.\n-\
    \ Create a new connection to your PostgreSQL server and log in with your credentials.\n"
