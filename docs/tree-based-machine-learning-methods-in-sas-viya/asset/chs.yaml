  \ | --- | --- | --- | --- |\n\nChapter 4: Decision Trees: Strengths, Weaknesses,\
  \ and Uses\n\nMissing Values in Decision Trees\n\nYou might have to contend with\
  \ missing values among the inputs as shown by question marks in Figure 4.1. Decision\
  \ trees accommodate missing values very well compared to other modeling methods.\
  \ Decision trees that split on one input at a time are more tolerant to missing\
  \ data than models such as regression that combine several inputs. In regression\
  \ models, an observation missing any input value is discarded (complete case analysis).\n\
  \nFor the simplest of tree algorithms, only observations that need to be excluded\
  \ are those missing the input currently being considered to split on. They can be\
  \ included when considering splitting on a different input (for example, tree algorithms\
  \ that treat missing observations as a special value use all the observations).\
  \ Trees, therefore, might be the best modeling tool for imputing missing values\
  \ because of their tolerance to missing data, their acceptance of different data\
  \ types, and their robustness to assumptions about the input distributions.\n\n\
  Some of the important points to note about missing values in decision trees include\
  \ the following:\n\n* missing values do not prevent splitting the data for building\
  \ a decision tree\n\n* missing values can affect the choice of the splitting criteria\n\
  \n* missingness can also be present in the scoring data along with the training\
  \ data\n\nFigure 4.1: Missing Values\n\n![image](img/f0117-01.jpg)\n\nCompared with\
  \ other regression and classification methods, decision trees have the advantage\
  \ that they are easy to interpret and visualize, especially when the tree is small.\
  \ Tree-based methods scale well to large data, and they offer various methods of\
  \ handling missing values, including surrogate splits. Surrogate splitting rules\
  \ enable you to use the values of other input variables to perform a split for observations\
  \ with missing values. You can specify how to handle missing values of predictor\
  \ variables during training and how to handle missing values and unknown levels\
  \ of predictor variables (after all surrogate rules have been applied) during scoring.\
  \ An unknown level of a categorical predictor variable is a level that does not\
  \ exist in the training data but is encountered during scoring. During scoring,\
  \ unknown levels are treated as missing values.\n\nThere are four separate ways\
  \ of handling missing values in decision trees in SAS Visual Data Mining and Machine\
  \ Learning shown in Figure 4.2.\n\n1. The most trivial way is to exclude observations\
  \ with a missing value from training.\n\n2. Another approach is to somehow distribute\
  \ observations with missing values. It first creates a rule without the observations\
  \ with missing values, and then the program uses the missing values to decide which\
  \ branch the rule should put them in. That rule is then used during scoring.\n\n\
  3. A more computationally intensive approach includes using data points with missing\
  \ values in the evaluation of a split.\n\n4. Use surrogate rules as backup splitting\
  \ rules before assigning the observation to the branch for missing values. This\
  \ is a more practical approach.\n\n[/content]\n\n\n\nConsider a simple example of\
  \ data collected on people in a city park in the vicinity of a hotdog and ice cream\
  \ stand. The owner of the concession stand wants to know what predisposes people\
  \ to buy ice cream with the help of attributes like maximum temperature of the day,\
  \ whether they have some extra money to spend, and whether they really crave the\
  \ ice cream. The data is shown in Table 4.1.\n\nFigure 4.2: Handling Missing Values\
  \ in Decision Trees\n\n![image](img/f0118-01.jpg)\n\nTable 4.1: Ice Cream Data\n\
  \n| Case || DayTemp || Crave || Extra Money || Buy Ice cream |\n| --- | --- | ---\
  \ | --- | --- |\n| 1 || 25 ||   || No || Yes |\n| 2 || 28 || Yes || Yes || Yes |\n\
  | 3 || . || No || No || No |\n| 4 || 20 || Yes || Yes || Yes |\n| 5 || 18 ||   ||\
  \ Yes || No |\n| 6 || 10 || Yes || No || No |\n| 7 || 12 || No || Yes || No |\n\
  | 8 || . || Yes ||   || Yes |\n\nObserve that there are five missing values. In\
  \ general, there is no best, universal method of handling missing values. It would\
  \ be interesting to explore these methods using this example data.\n\nIgnore\n\n\
  During the training phase, the Ignore option excludes any observation that has a\
  \ missing value for any predictor variable. In the scoring phase, if an observation\
  \ has a missing value or an unknown level for a predictor variable, then the observation\
  \ is assigned to the child node that contains the most training observations.\n\n\
  A decision tree on the ice cream data with ignored cases is shown in Figure 4.3.\
  \ Note that the root node has only 4 observations.\n\nIn both the training and the\
  \ scoring phases, missing values in continuous predictor variables are treated as\
  \ the smallest possible value.\n\nFigure 4.3: Ignore Option\n\n![image](img/f0119-02.jpg)\n\
  \nAll cases with missing attribute values are deleted from the data set. It is also\
  \ called listwise deletion (or casewise deletion, or complete case analysis) in\
  \ statistics. Obviously, a lot of information is missing in the constructed tree\
  \ (only four observations). However, there might be some reasons to consider it\
  \ a good method, which is shown in Allison (2002) and Little and Rubin (2002).\n\
  \n| The Ignore option in Model Studio is equivalent to the ASSIGNMISSING=NONE option\
  \ in the TREESPLIT procedure. |\n\n| --- |\n\nBecause maximum day temperature was\
  \ the only important variable in the decision tree, for simplicity let us ignore\
  \ other predictors and re-create the decision tree with DayTemp as the sole input\
  \ variable. Observe in Figure 4.4 that the count of the root node has changed from\
  \ 4 to 6.\n\nFor brevity and triviality, we will consider DayTemp as the only input\
  \ in the decision tree to explore remaining options for handling missing values.\n\
  \nLargest Branch\n\nDuring the training phase, the Largest branch option assigns\
  \ any observation that has a missing value in the predictor variable to the child\
  \ node that has the most training observations. In the scoring phase, if an observation\
  \ has a missing value or an unknown level for a predictor variable, then the observation\
  \ is assigned to the child node that contains the most training observations.\n\n\
  Before allocation, both the branches have an equal number of training observations,\
  \ that is, three each. Therefore, missing values can be assigned on either branch.\
  \ Figure 4.5 shows that the missing values are assigned to the left branch, so the\
  \ leaf size becomes 5 as against the right branch with leaf size of 3.\n\nFigure\
  \ 4.4: Ignore Option with Reduced Columns\n\n![image](img/f0120-01.jpg)\n\nFigure\
  \ 4.5: Largest Branch Option\n\n![image](img/f0121-01.jpg)\n\n| The Largest branch\
  \ option in Model Studio is the equivalent of the ASSIGNMISSING=POPULAR option in\
  \ the TREESPLIT procedure. |\n\n| --- |\n\nMost Correlated Branch\n\nDuring the\
  \ training phase, the Most correlated branch option assigns any observation that\
  \ has a missing value in the predictor variable to the child node whose observations\
  \ are most like it. This similarity is determined using the chi-square criterion\
  \ for categorical responses or the F test criterion for continuous responses. If\
  \ all observations have nonmissing values for a predictor variable, then no branch\
  \ is selected to contain observations with missing values. In the scoring phase,\
  \ if an observation has a missing value for a predictor variable and no branch is\
  \ selected to contain observations with missing values, or if an observation has\
  \ an unknown level for a predictor variable, then the observation is assigned to\
  \ the child node that contains the most training observations.\n\nFigure 4.6: Most\
  \ Correlated Branch Option\n\n![image](img/f0121-02.jpg)\n\nFigure 4.7: Competing\
  \ Tests for Missing Values Assignment\n\n![image](img/f0122-01.jpg)\n\nIn the ice\
  \ cream data example shown in Figure 4.6, why are the missing values assigned to\
  \ the left branch? In fact, chi-square tests were used to evaluate, as shown in\
  \ Figure 4.7.\n\nThe top and bottom 2×2 contingency tables both have equal p‑values\
  \ of 0.1429 (Fisher’s exact c2 test). So, there is a tie. Otherwise, missing values\
  \ are assigned to the branch that has smaller p‑value. Here, missing values are\
  \ assigned to the left branch.\n\n| The Most correlated branch option in Model Studio\
  \ is the equivalent of the ASSIGNMISSING=SIMILAR option in the TREESPLIT procedure.\
  \ |\n\n| --- |\n\nSeparate Branch\n\nDuring the training phase, the Separate branch\
  \ option assigns any observation that has a missing value for the predictor variable\
  \ to a specially created child node (branch), provided you have set up enough maximum\
  \ number of branches, or else there might be no splits at all.\n\nIn the ice cream\
  \ data example, note in Figure 4.8 that all the missing values are assigned in a\
  \ separate branch.\n\nIf all observations have nonmissing values for a predictor\
  \ variable, then no branch is created to contain observations with missing values.\
  \ In the scoring phase, if an observation has a missing value for a predictor variable\
  \ and no special branch was created to contain observations with missing values,\
  \ or if an observation has an unknown level for a predictor variable, then the observation\
  \ is assigned to the child node that contains the most training observations.\n\n\
  | The Separate branch option in Model Studio is the equivalent of the ASSIGNMISSING=BRANCH\
  \ option in the TREESPLIT procedure. |\n\n| --- |\n\nFigure 4.8: Separate Branch\
  \ Option\n\n![image](img/f0123-01.jpg)\n\nUse as Machine Smallest\n\nDuring the\
  \ training phase, the Use as machine smallest option treats a missing value in a\
  \ categorical predictor variable as a separate, legitimate value. If all observations\
  \ have nonmissing values for a categorical predictor variable, then no branch is\
  \ selected to contain observations with missing values. In the scoring phase, if\
  \ an observation has a missing value for a categorical predictor variable and no\
  \ branch is selected to contain observations with missing values, or if an observation\
  \ has an unknown level for a predictor variable, then the observation is assigned\
  \ to the child node that contains the most training observations.\n\nIn both the\
  \ training and the scoring phases, missing values in continuous predictor variables\
  \ are treated as the smallest possible value.\n\nIn the ice cream data example as\
  \ shown in Figure 4.9, the two missing values were included in the split search\
  \ evaluation by considering them as the smallest values of DayTemp and therefore\
  \ assigned to the right branch (<18.6).\n\nFigure 4.9: Use as Machine Smallest Option\n\
  \n![image](img/f0123-02.jpg)\n\n| The Use as machine smallest option in Model Studio\
  \ is the equivalent of the ASSIGNMISSING=MACSMALL option in the TREESPLIT procedure.\
  \ |\n\n| --- |\n\nUse in Search\n\n\n\n另一个简单的策略是将缺失值视为一种特殊的非缺失值。对于名值输入，缺失值仅仅构成一个新的类别值。对于输入值有序的情况，每个缺失值都构成一种特殊值，并被赋予在排序中能够产生最佳分割的位置。这个位置在树的不同节点中通常是不同的。\n\
  \n当缺失值能够预测特定的目标值时，这种策略是有益的。例如，收入较大的人可能比收入普通的人更不愿意透露自己的收入。如果收入能够预测目标值，那么缺失的收入值就能够预测目标值，缺失值会被视为一种特殊的高收入值。当缺失值的分布与目标值无相关性时，这种策略看似无害，因为无论选择哪个分支，都无法预测目标值。线性回归可以通过添加二元指示变量来使用相同的策略，以标记值是否缺失。\n\
  \n在训练阶段，使用搜索选项（Use in search）将预测变量中的缺失值视为一个独立的、合法的值。如果所有观测值对预测变量都有非缺失值，则不会选择包含缺失值观测的分支。在评分阶段，如果观测值对预测变量有缺失值，且没有选择包含缺失值观测的分支，或者观测值对预测变量的水平是未知的，则该观测值会被分配到包含训练观测数量最多的子节点中。\n\
  \n您可以通过使用搜索政策（use in search policy）指定使用的观测数量最小值。额外的“最小缺失使用在搜索”选项指定在分割搜索中使用缺失值的阈值。如果有缺失值的观测数量大于或等于您指定的数量，则只有决策树节点会使用缺失值的搜索政策。默认情况下，最小缺失使用在搜索=1。\n\
  \n使用搜索选项的冰淇淋数据示例在图 4.10 中显示。请注意，与使用“最小节点”选项不同，会构建一个不同的树。两者的区别在于决策树模型保存的数据表。\\_MissingOnNode_\
  \ 列存在于 USEINSEARCH outmodel 表中，但不存在于 MACSMALL outmodel 表中。您可以使用 TREESPLIT 程序的 OUTMODEL=选项获取\
  \ outmodel 表。缺失 DayTemp 的两条观测被包含在分割搜索中；生成的规则将缺失值分配到左分支（>=18.6）。在评分时，该规则保持不变（分配到左分支）。\n\
  \n[Table]\nThe Use in search option in Model Studio is the equivalent of the ASSIGNMISSING=USEINSEARCH\
  \ option in the TREESPLIT procedure.\nFigure 4.10: Use in Search Option\n![image](img/f0125-01.jpg)\n\
  \nSurrogate Splits\n\nSurrogate splits can be used to handle missing values (BFOS\
  \ 1984). A surrogate split is a partition using a different input that mimics the\
  \ selected split. A perfect surrogate maps all the cases that are in the same node\
  \ of the primary split to the same node of the surrogate split. The agreement between\
  \ two splits can be measured as the proportion of cases that are sent to the same\
  \ branch. The split with the greatest agreement is taken as the best surrogate.\n\
  \nA surrogate splitting rule is a backup to the primary splitting rule. For example,\
  \ the primary splitting rule might use COUNTY as input, and the surrogate might\
  \ use REGION. If the COUNTY is unknown and the REGION is known, the surrogate is\
  \ used. If several surrogate rules exist, each surrogate is considered in sequence\
  \ until one can be applied to the observation. If none can be applied, the primary\
  \ rule assigns the observation to the branch that is designated for missing values.\n\
  \nFigure 4.11: Surrogate Rules on Handwritten Digits Example\n\nConsider the handwriting\
  \ example that was discussed earlier, with inputs X1 (on the Y axis) and X10 (on\
  \ the X axis). In this example (illustrated in Figure 4.11), let us say that the\
  \ main splitting rule is based on X1, and the surrogate is based on X10. The plot\
  \ above shows both splits. For the X1 input and a fixed split point (38.5, as shown\
  \ in the plot above), two groups are generated. Cases with input values less than\
  \ 38.5 are said to branch bottom. Cases with input values greater than 38.5 are\
  \ said to branch top. However, if X1 is an unknown value and X10 is known, then\
  \ the surrogate rule is used. When the surrogate rule is used, cases with X10 less\
  \ than the split point 41.5 are said to branch left, and cases with input values\
  \ greater than 41.5 are said to branch right. In this example, 76% of the decisions\
  \ made by the surrogate rule agree with the decisions that the original rule would\
  \ have made. The higher the agreement percentage, the better the surrogate rule\
  \ is.\n\nThe surrogates are considered in the order of their agreement with the\
  \ primary splitting rule. The agreement is measured as the proportion of training\
  \ observations that the surrogate rule and the primary rule assign to the same branch.\
  \ The measure excludes the observations to which the primary rule cannot be applied.\
  \ Among the remaining observations, those on which the surrogate rule cannot be\
  \ applied count as observations that are not assigned to the same branch. Thus,\
  \ an observation that has used a missing value on the input in the surrogate rule\
  \ but not the input in the primary rule counts against the surrogate.\n\nWhen surrogate\
  \ rules are requested and if a new case has a missing value on the splitting variable,\
  \ then the best surrogate is used to classify the case. If the surrogate variable\
  \ is missing as well, then the second-best surrogate is used. If the new case has\
  \ a missing value on all the surrogates, it is sent to the branch that contains\
  \ the missing values of the training data.\n\nThe Surrogate rules property specifies\
  \ the number of surrogate rules. The default value is 0. You can determine the number\
  \ of surrogates that are sought. A surrogate is discarded if its agreement is less\
  \ than or equal to the largest proportion of observations in any branch. Consequently,\
  \ a node might have fewer surrogates specified than the number in the Surrogate\
  \ rules property.\n\nMissing Values in Ordinal Inputs\n\nAn ordinal input with missing\
  \ values requires modifications of the split search strategy and the Bonferroni\
  \ adjustment. The missing values cannot usually be placed in order among the input\
  \ levels. The missing value acts as a nominal level. Consequently, the split search\
  \ should not place any restrictions on the branch that contains the missing level.\
  \ It might be in a branch by itself or mixed in with the adjacent ordinal levels.\
  \ This increases the number of splits to consider from\n\n$\\\\left( \\\\begin{array}{l}\
  \ {L - 1} \\\\\\\\ {B - 1} \\\\\\\\ \\\\end{array} \\\\right)to{~B}\\\\left( \\\\\
  begin{array}{l} {L - 1} \\\\\\\\ {B - 1} \\\\\\\\ \\\\end{array} \\\\right) + \\\
  \\left( \\\\begin{array}{l} {L - 1} \\\\\\\\ {B - 2} \\\\\\\\ \\\\end{array} \\\\\
  right).$\n\nFigure 4.12: Splits to Consider for a Three-Level Input with Missing\
  \ Values\n![image](img/f0127-01.jpg)\n\nFor example, as shown in Figure 4.12, a\
  \ three-level input with missing values has five binary splits, five three-way splits,\
  \ and one four-way split. The total number of splits increased from 2L-1 – 1 to\
  \ $- 1{~t}{o~}{\\\\sum\\\\limits\\_{i = 2}^{L}{\\\\left( {i\\\\left( \\\\begin{array}{l}\
  \ {L - 1} \\\\\\\\ {i - 1} \\\\\\\\ \\\\end{array} \\\\right) + \\\\left( \\\\begin{array}{l}\
  \ {L - 1} \\\\\\\\ {i - 2} \\\\\\\\ \\\\end{array} \\\\right)} \\\\right) = 2^{L\
  \ - 2}\\\\left( {L + 3} \\\\right) - 1}}$.\n\nVariable Importance\n\n\n\n变量的重要性是模型成功的贡献。对于决策树，或者说任何预测模型，成功意味着预测准确。预测通常依赖于少数变量。一个良好的重要性度量能揭示这些变量。预测越好，模型就越接近现实，且重要变量代表预测的真实原因的可能性越大。有些人偏好简单模型以便理解，但简单模型通常会牺牲现实的细节。有时先找到一个良好的模型，再询问哪些变量重要，优于先询问哪个模型适合变量重要性，然后再训练该模型。\n\
  \n分析数据通常包含许多预测变量，其中一些对预测目标有用，另一些则没有。变量重要性指示哪些预测变量最有助于预测响应变量。最重要的变量不一定是树顶部的变量。决策树节点实现了多种计算变量重要性的方法。\n\
  \n<sup>BFOS (1984)</sup> 为树木制定了一种变量重要性的度量。它对于树的解释特别有用。\n\nFigure 4.13: Variable\
  \ Importance in Decision Trees\n\n![image](img/f0128-01.jpg)\n\n设 s(xj,t) 为第 t 个内部节点使用第\
  \ j 个输入的代理分割（包括主分割）。重要性是所有内部节点中使用第 j 个输入的代理分割的杂质减少量的加权平均。权重为节点大小。\n\n${Im}\\\\text{por}\\\
  \\text{tan}\\\\text{ce}(x\\_{j}) = {\\\\sum\\\\limits\\_{t = 1}^{T}{\\\\frac{n\\\
  _{t}}{n}\\\\text{Δ}\\\\left( i \\\\right)}}\\\\left( {s\\\\left( x\\_{j} \\\\right),t}\
  \ \\\\right),$\n\n在此定义中，Δ(i) 表示基于残差平方和 (RSS) 的杂质减少。如图 4.13 所示，例如，输入 x1 在节点 1（根节点）作为主分割变量使用。然而，向下树，它在节点\
  \ 3 和节点 2 中分别作为第一个和第二个代理分割变量被使用。\n\n用于计算变量重要性的方法\n\nSAS Viya 实现了多种计算决策树中变量重要性的方法，包括：\n\
  \n*   基于计数的重要性\n\n*   残差平方和 (RSS) 重要性\n\n*   相对变量重要性\n\n*   随机分支分配 (RBA) 重要性\n\n\
  默认情况下，SAS Viya 决策树模型使用三种方法（基于计数、变化的残差平方和、相对重要性）计算变量重要性，并将结果写入包含“有效重要性”、“重要性标准差”、“相对重要性”和“计数”列的变量重要性表中。\n\
  \n您可以通过指定 RBAIMP 选项，要求 TREESPLIT 过程也使用随机分支分配 (RBA) 计算变量重要性。但是，该选项在 Model Studio\
  \ 的决策树节点中不可用。请参见 SAS Visual Statistics 8.5: Procedures 文档以获取更多详情。\n\n基于计数的变量重要性\n\
  \n基于计数的变量重要性简单统计树中变量用于分割的次数。如果 Surrogate 规则的值被设置为非 0，则基于计数的变量重要性也统计变量在代理分割规则中被使用的次数。\n\
  \n相对变量重要性\n\n相对变量重要性基于节点发现分割时的残差平方和 (RSS) 的变化来衡量变量重要性。它是一个介于 0 和 1 之间的数值，计算为该变量的基于\
  \ RSS 的重要性除以所有变量中最大的基于 RSS 的重要性。RSS 和相对重要性是基于验证数据计算的。如果不存在验证数据，则它们是基于训练数据计算的。\n\n\
  因此，讨论基于 RSS 的变量重要性很重要。\n\n残差平方和 (RSS) 重要性\n\n残差平方和 (RSS) 是一种统计技术，用于测量数据集中未被 (回归)\
  \ 模型本身解释的方差。它估计残差（或误差项）中的方差。更准确地说，它是数据与估计模型之间的差异度量。小 RSS 表示模型对数据的拟合紧密。回归树的残差平方和定义在\
  \ <sup>Figure 4.14</sup>。RSS 通过从叶节点的观测值中减去模型预测值，平方这些差异，然后在叶节点中所有数据点上取平均来估计。\n\n\
  | 请参阅 SAS Visual Statistics 8.5: Procedures 文档，获取分类树的残差平方和的定义。 |\n\n| --- |\n\n\
  Figure 4.14: Residual Sum of Squares (RSS)\n\n![image](img/f0129-01.jpg)\n\n变量重要性是通过在节点上对感兴趣的变量进行分割，导致的残差平方和\
  \ (RSS) 减少量来衡量的，并取所有变量被分割的节点的平均值。这类似于多元线性回归中基于 RSS 的方法，并且适用于所有树基方法。这种变量重要性度量也被称为节点纯度，见\
  \ <sup>Liaw and Wiener (2002)</sup>。\n\nRSS 重要性是基于节点上发现分割时的 RSS 变化来衡量变量重要性。变量的变化\
  \ RSS 是节点被视为叶节点时的 RSS 与分割后节点的 RSS 之差。如果变化 RSS 为负（在验证集上测量时可能发生），则将其设置为 0。\n\n变量 u\
  \ 的变化为：\n\n*Δ*[*d*]^(*v*) = *R**S**S*[*d*] − ∑[*i*]*R**S**S*[*i*]^(*d*)\n\n其中 d\
  \ 表示节点，i 表示该节点包含的子节点索引，RSSd 是节点作为叶节点时的 RSS，RSSdi 是分割后节点的 RSS。如图 <sup>Figure 4.15</sup>\
  \ 所示，这通过一个简单的例子说明，该例子包括对右节点进行两种可能的二元分割。\n\n| 如果启用代理规则，它们也会以比例分配节点间 RSS 变化的份额。份额与主分割和代理分割规则在节点之间的一致程度成比例。请参阅\
  \ SAS Visual Statistics 8.3: Procedures 文档以获取更多详情。 |\n\n| --- |\n\n随机分支分配 (RBA)\
  \ 重要性\n\n计算变量 u 的重要性时，随机化涉及变量 u 中的分支分配规则，然后将随机模型应用于数据并计算拟合优度度量。随机规则是指随机将观测值分配到分支，概率与分支中的观测值数量成比例。例如，如图\
  \ <sup>Figure 4.16</sup> 所示，假设一个包含 100 个训练观测值的节点通过变量 u 分裂为两个节点：一个包含 25 个观测值，另一个包含\
  \ 75 个观测值。在评估 u 的重要性时，到达节点的观测值会以概率 0.25 随机分配到较小的分支。\n\nFigure 4.15: Change in RSS\n\
  \n![image](img/f0130-01.jpg)\n\nFigure 4.16: Random Branch Assignment Example\n\n\
  ![image](img/f0131-01.jpg)\n\nNeville 和 Tan (2014) 声称 RBA 满足 Breiman 和 Strobl 等人的方法目标。其目的是通过对\
  \ u 的值进行置换，打破响应变量与 u 之间的任何关系，而不改变 u 的单变量分布。\n\n\n\n\nThe random branch assignment\
  \ (RBA) method computes the importance of an input variable u by comparing how well\
  \ the data fit the predictions before and after they are modified. To modify the\
  \ predictions, all splitting rules that use variable u are replaced by a rule that\
  \ randomly assigns an observation to a branch. The probability of assigning an observation\
  \ to a branch is proportional to the number of observations that are assigned to\
  \ the branch in the current data. The current data are the training data when RBA\
  \ is computed during training. Otherwise, the current data are those being scored\
  \ on an existing model.\n\nThe importance of a variable is proportional to the randomized\
  \ fit minus the fit without randomization, illustrated in Figure 4.17. The RBA importance\
  \ can be expressed mathematically as:\n\n$$I_{\\text{RBA}}(v) \\propto \\sum_{i=1}^{n}\
  \ \\text{Loss}\\left(y_i, \\hat{y}_i\\right) - \\sum_{i=1}^{n} \\text{Loss}\\left(y_i,\
  \ \\tilde{y}_i\\right)$$\n\nwhere $\\tilde{y}_i$ is the modified prediction for\
  \ observation i and $\\hat{y}_i$ is the standard prediction.\n\nFigure 4.17: RBA-Based\
  \ Importance\n\n![image](img/f0132-01.jpg)\n\nIntroducing the TREESPLIT Procedure\n\
  \nThe TREESPLIT procedure builds tree-based statistical models for classification\
  \ and regression in SAS Viya. It is a programmatic equivalent of the Decision Tree\
  \ node in Model Studio.\n\nPROC TREESPLIT <options>;\n\nCLASS variables;\n\nGROW\
  \ criterion <options>;\n\nMODEL response = variable...;\n\nOUTPUT OUT=CAS-libref.data-table\
  \ output-options;\n\nPARTITION <partition-options>;\n\nPRUNE prune-method <(prune-options)>;\n\
  \nWEIGHT variable;\n\nThe PROC TREESPLIT statement invokes the procedure.\n\nThe\
  \ CLASS statement causes the specified variables to be treated as categorical variables\
  \ in the analysis.\n\nThe GROW statement specifies the criterion by which to split\
  \ a parent node into child nodes.\n\nThe MODEL statement causes PROC TREESPLIT to\
  \ create a tree model by using response as the response variable and one or more\
  \ variables as predictors.\n\nThe OUTPUT statement creates an output data table\
  \ that contains the results of PROC TREESPLIT.\n\nThe PARTITION statement specifies\
  \ how observations in the input data set are logically partitioned into disjoint\
  \ subsets for model training, validation, and testing.\n\nThe PRUNE statement specifies\
  \ the pruning method and related options.\n\nThe variable in the WEIGHT statement\
  \ is used as a weight to perform a weighted analysis of the data.\n\n![image](img/Demo.jpg)\
  \ Demo 4.1: Handling Missing Values and Determining Important Variables\n\nThis\
  \ demonstration builds further on the previous demonstration on the insurance_part\
  \ data. You will experiment by changing the missing value methods and determine\
  \ the variable importance. A SAS Code node is used to compute RBA-based variable\
  \ importance.\n\n1. Ensure that the Insurance_ClassTree project is open in Model\
  \ Studio and that you are on the Pipelines tab.  \n2. Select the Decision Tree node.\
  \ Under Splitting Options, observe that Missing values is set to Use in Search,\
  \ which is the default.  \n3. Open the Results of the Decision Tree node. Maximize\
  \ the Variable Importance table.\n\n![image](img/f0133-01.jpg)\n\nRecall that the\
  \ Variable Importance table provides insight into the importance of inputs in the\
  \ decision tree.\n\nThe Validation Importance column shows the maximum RSS-based\
  \ variable importance.\n\nThe Relative Importance column measures variable importance\
  \ based on the change of residual sum of squares (RSS) when a split is found at\
  \ a node. It is a number between 0 and 1, which is calculated as the RSS-based importance\
  \ of this variable divided by the maximum RSS-based importance among all the variables\
  \ (for example, 218.9077 / 218.9077 = 1; 137.1400 / 218.9077 = 0.6265 and so on).\
  \ The magnitude of the relative importance statistic relates to the amount of variability\
  \ in the target explained by the corresponding input relative to the input at the\
  \ top of the table (for example, DDABAL explains 62.65% of the variability explained\
  \ by SAVBAL). The RSS and relative importance are calculated from the validation\
  \ data. If no validation data exist, they are calculated instead from the training\
  \ data.\n\nNotice that the input IRA has a negative validation importance. If the\
  \ change in RSS is negative (which is possible when you measure it on the validation\
  \ set), then the change is set to 0.\n\nThe Importance Standard Deviation column\
  \ shows the dispersion of the importance taken over partially independent several\
  \ trees. That is the reason it has all zero values for a single tree. The numbers\
  \ would be nonzero for forest and gradient boosting, ensemble models discussed later\
  \ in chapters 4 and 5. You can conveniently ignore this column here in a decision\
  \ tree model.\n\nThe Count column shows how many times a variable is used in splitting\
  \ in the decision tree. The BRANCH input seems to be the most important per count-based\
  \ importance method.\n\n4. Close the Variable Importance table and close the results\
  \ of the Decision Tree node.\n\n5. To identify the inputs with missing values, click\
  \ the Data tab.\n\n6. Click the Missing column heading twice.\n\n![image](img/f0134-01.jpg)\n\
  \nThe variables have been sorted by percentage of missing values. Quite a few variables\
  \ have missing values. Focus on those variables that have missing values as well,\
  \ as they appear in the variable importance table. For example, two of these variables,\
  \ ACCTAGE and INV, were also important variables in the Variable Importance table,\
  \ each used once and twice respectively in splitting. They have around 6% and 13%\
  \ missing values, respectively.\n\n7. Return to the Pipelines tab and reopen the\
  \ Results of the Decision Tree node.\n\n8. Maximize the Tree Diagram and adjust\
  \ the view (zoom-in) to focus on the splits containing missing observations of the\
  \ two variables.\n\nWhy are missing values assigned to the left branch of ACCTAGE\
  \ and not to the right branch?\n\n![image](img/f0135-01.jpg)\n\nThe use in search\
  \ policy uses missing values in the calculation of the worth of a splitting rule.\
  \ This consequently produces a splitting rule that assigns the missing values to\
  \ the branch that maximized the worth of the split.\n\nNote that the bin ordering\
  \ is ignored because the k‑means fast search algorithm was enabled.\n\nRegarding\
  \ missing values as a special value in search is sometimes inappropriate. If a substantial\
  \ proportion of values is missing, then they can unduly influence the creation of\
  \ the split. Evaluating a split using only known information improves credibility.\n\
  \n![image](img/f0135-02.jpg)\n\nThe simple strategy is to regard a missing value\
  \ as a special nonmissing value. For a nominal input, like INV, a missing value\
  \ simply constitutes a new categorical value.\n\nUse in search is a desirable policy\
  \ when the existence of a missing value is predictive of a target value. If not,\
  \ you can want to exclude the missing values from the split search, and a new policy\
  \ is needed for assigning missing observations to branches. One policy is to use\
  \ missing values in a separate branch.\n\nNote: Unique missing value indicators\
  \ were created (using an Imputation node) for these three variables and then pushed\
  \ in a logistic regression model (using a Logistic Regression node). None of them\
  \ significantly predicted the target. Close the Tree Diagram and then close the\
  \ Results.\n\n9. Keep the Decision Tree node selected and change the Missing values\
  \ from Use in Search to Separate branch.\n\n10. Click the Run Pipeline button.\n\
  \n11. Open the Results of the Decision Tree node and maximize the Variable Important\
  \ table.\n\n![image](img/f0136-01.jpg)\n\nThe top few important variables are the\
  \ same as what you had in a decision tree with the Use in search option. However,\
  \ the two variables with missing values (ACCTAGE and INV) did not appear as important\
  \ variables.\n\n\n\n-   [将所有缺失值的观测分配到单一分支是会降低分支的纯度，从而降低分割的质量。如果不可避免，将最大的分支分配会导致节点纯度的最小稀释。]\n\
  \n12. 关闭变量重要性表，关闭决策树节点的结果。\n\n13. 打开模型比较节点的结果，并最大化模型比较表。\n\n![image](img/f0136-02.jpg)\n\
  \n二叉树的平均平方误差（ASE）和误分类率（MISC）略微恶化，从 0.1808 变为 0.1815，从 0.2616 变为 0.2633。\n\n14. 关闭模型比较表。\n\
  \n15. 关闭模型比较节点的结果。\n\n16. 前往步骤 27。\n\n注意：步骤 18-26 为探索替代规则提供可选步骤。\n\n17. 保持决策树节点选中。在分割选项中，将替代规则从\
  \ 0 更改为 1。\n\n![image](img/f0137-01.jpg)\n\n使用替代分割规则是另一种在希望在分割搜索中排除缺失值时，将缺失观测分配到分支的政策。替代分割规则模拟常规分割规则。将其用于选择更多变量是一种后起之秀。替代变量通常与主分割变量相关，因此被选中的变量会产生一定的冗余。然而，替代规则能更好地利用数据。\n\
  \n18. 运行决策树节点。\n\n19. 打开结果，最大化变量重要性表。\n\n![image](img/f0137-02.jpg)\n\n观察到多出一个“Times\
  \ Used as a Surrogate”列，变量重要性顺序发生了变化。由于替代规则，部分变量出现在表中并非真正用于分割。例如，SAV 变量（列表第二）在替代规则中使用一次，但在决策树分割中未实际参与分割。替代规则在主规则无法处理观测时用于替代主规则。一个良好的替代规则即使不定义良好分割，也能非常好地模仿主规则。\n\
  \n例如，主规则可能基于房屋价值（HMVAL）进行分割，替代规则则基于货币市场余额（MMBAL）。替代规则适用于 HMVAL 未知、MMBAL 已知的观测。由于\
  \ MMBAL 的信息粒度粗于 HMVAL，替代规则作为主分割规则可能效果不佳。该政策依赖于冗余输入。若不存在合适的替代规则，还需要其他政策。\n\n20. 关闭变量重要性表。\n\
  \n21. 点击评估选项卡，最大化拟合统计表。\n\n![image](img/f0138-01.jpg)\n\n这是一个更小的树。然而，性能已下降。ASE 与\
  \ MISC 从 0.1841 增加到 0.1900，从 0.2636 增加到 0.2862。这是为了选择更多变量并更好地处理缺失值而付出的代价。\n\n22.\
  \ 最小化拟合统计表，关闭结果。\n\n23. 由于该决策树的主要目标是预测而非变量选择，请将替代规则属性恢复为 0。\n\n24. 再次运行决策树节点。\n\n\
  25. 如果已关闭结果，请重新打开决策树节点的结果，向下滚动并最大化训练代码窗口。\n\n26. 向下滚动，复制（Ctrl+C）组件代码到剪贴板。\n\n![image](img/f0138-02.jpg)\n\
  \n27. 关闭训练代码窗口，关闭结果。\n\n28. 右键单击数据节点，选择添加子节点 ![image](img/Arrow.jpg) Miscellaneous\
