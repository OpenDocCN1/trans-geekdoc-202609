  \n\n\n15\\. 关闭结果窗口。\n\n![image](img/EndOfDemo.jpg)\n\n回归树\n\n现在考虑目标变量为区间的情况。回归树是决策树的另一种变体，用于逼近实值函数，而不是用于分类方法。\n\
  \n图 2.7：波士顿住房数据集（2 维）\n\n![image](img/f0045-01.jpg)\n\n图 2.8：波士顿住房数据集（3 维）\n\n![image](img/f0045-02.jpg)\n\
  \n回归树是一种预测模型，其中目标变量不是固定的或连续的。随后使用决策树算法来预测目标变量的值。回归树的一个例子是预测住宅房屋的售价。\n\n图 2.9：回归树\n\
  \n![image](img/f0046-01.jpg)\n\n图 2.10：回归树的叶节点作为布尔规则\n\n![image](img/f0046-02.jpg)\n\
  \n我将使用波士顿住房数据（可从 UCI 存储库获得，见 Blake et al. 1998），该数据包含 506 个波士顿人口普查区。目标是中位房价（MEDV）。下面展示了\
  \ 13 个输入变量中的两个：\n\n*   平均房间数（RM）\n\n*   空气中氮氧化物浓度（NOX）\n\n数据在图 2.7（Figure 2.7）中以二维气泡图显示，气泡半径与中位房价（MEDV）成正比。\n\
  \n同一数据在图 2.8（Figure 2.8）中以三维散点图呈现。\n\n图 2.11：划分的输入空间\n\n![image](img/f0047-01.jpg)\n\
  \n图 2.12：多变量阶梯函数\n\n![image](img/f0047-02.jpg)\n\n当目标是连续值时，模型称为回归树。回归树是分段常数模型，能够简洁地总结预测器如何决定预测结果，通常比线性回归模型更易解释。基于波士顿住房数据构建的回归树示例见图\
  \ 2.9（Figure 2.9）。\n\n预测值与划分的输入空间\n\n回归树的叶节点给出连续目标的预测值。所有到达特定叶节点的案例都被赋予相同的预测值，参见\
  \ Figure 2.10。\n\n回归树中通往每个叶节点的路径可以用布尔规则表示，形式如下：\n\n如果输入属于 {输入空间的某个区域}，则预测值 = 值。\n\
  \n输入空间的区域由分割值决定。对于区间尺度的输入，区域的边界垂直于分割变量。因此，区域是由单个分割变量定义的子空间的交集，如图 2.11（Figure 2.11）所示。\n\
  \n决策树的叶节点将输入空间划分为轴对齐的区域。划分方式使得响应值相似的观测被归入同一组。划分完成后，在每个区域内预测一个常数的响应变量。因此，拟合的回归树模型是一个多变量阶梯函数，如图\
  \ 2.12（Figure 2.12）所示。\n\n由于回归树将预测空间划分为若干区域并在每个区域内拟合常数值，它们有时被称为分段常数回归模型。树基回归模型的一个重要特点是，它们能够以命题逻辑的形式（树形）表示这些区域。树根到每个叶节点的每条路径对应一个区域。\n\
  \n该表面是分段常数的，在边界处不连续。阶梯函数高度灵活，能够建模非线性趋势。因此，决策树被称为万能逼近器。\n\n![image](img/Demo.jpg)Demo\
  \ 2.3：使用 SAS Visual Statistics 构建回归树管道\n\n本演示使用波士顿住房数据，通过 SAS Visual Analytics 界面创建回归树模型，检查残差，并在\
