  \ Ensemble of Trees: Bagging, Boosting, and Forest | | | |\n| “Small changes in\
  \ the training data can cause large changes in the topology of the tree. However,\
  \ the overall performance of the tree remains stable.” | | | |\n| – Breiman et al.\
  \ (1984) | | | |\n| ## Instability in a Decision Tree | | | |\n| Decision trees\
  \ are among the simplest, yet most powerful, forms of models, both conceptually\
  \ and in their interpretation, with the entire data set of observations being recursively\
  \ partitioned into subsets along different branches so that similar observations\
  \ get grouped together at the terminal leaves of the decision tree. However, the\
  \ methods of constructing decision trees from data suffer from a major problem of\
  \ instability. The symptoms of instability include variations in the predictive\
  \ accuracy of the model and in the model topology. Instability can be revealed not\
  \ only by using disjoint sets of data, but even by replacing a small portion of\
  \ training cases, like in the cross-validation procedure. If an algorithm is unstable,\
  \ the cross-validation results become estimators with high variance, which means\
  \ that an algorithm fails to make a clear distinction between persistent and random\
  \ patterns in the data. The instability problem of decision tree classification\
  \ algorithms is that minor changes in input training samples can cause dramatically\
  \ large changes in output classification rules. | | | |\n| Decision trees are unstable\
  \ models. That is, minor changes in the training data can cause large changes in\
  \ the topology of the tree. However, the overall performance of the tree remains\
  \ stable (Breiman et al. 1984). For example, Figure 6.1 shows a scatter plot of\
  \ two inputs and a binary target with the two outcomes green and gold. The plot\
  \ also contains lines showing the results of recursive partitioning. This tree has\
  \ an accuracy of 81%. Changing the outcome of one case from green to gold results\
  \ in a completely different tree, as shown by the change in the results of recursive\
  \ partitioning. However, the accuracy is almost identical: 80%. | | | |\n| The instability\
  \ results from the substantial number of univariate splits that are considered and\
  \ the fragmentation of the data. At each split, there are typically several splits\
  \ on the same and different inputs that give similar performance (competitor splits)\
  \ as represented in Figure 6.2. This plot shows the logworth for all values of two\
  \ input variables, `X1` and `X2`, which are candidates for a single split. The input\
  \ range is on the `X` axis and logworth is on the `Y` axis. A slight change in the\
  \ data can easily result in a different split being chosen. This produces different\
  \ subsets in the child nodes. The changes in the data are larger in the child nodes.\
  \ The changes continue to cascade down the tree. | | | |\n| Figure 6.1: Instability\
  \ Illustration | | | |\n| ![image](img/f0188-01.jpg) | | | |\n| Figure 6.2: Competitor\
  \ Splits | | | |\n| ![image](img/f0188-02.jpg) | | | |\n| ## Perturb and Combine\
  \ (P&C) | | | |\n| Methods were devised to take advantage of the instability of\
  \ trees to create models that are more powerful. Perturb and combine (P&C) methods\
  \ generate multiple models by manipulating the distribution of the data or altering\
  \ the construction method, such as changing the tree settings, and then averaging\
  \ the results (Breiman 1998). Any unstable modeling method can be used, but trees\
  \ are most often chosen because of their speed and flexibility. | | | |\n| Perturb\
  \ and combine methods are used to create ensemble models in two steps. | | | |\n\
  | ### Step 1: Perturb | | | |\n| The perturb step creates different models by manipulating\
  \ the distribution of the data or altering the construction method. | | | |\n| The\
  \ three pairs of plots shown in Figure 6.3 represent three different trees created\
  \ during the perturb step. These trees are based on data shown earlier, which has\
  \ a binary target (with green and gold outcomes) and two inputs. For each tree,\
  \ the top plot is a scatterplot of the data with lines showing the splits. The bottom\
  \ plot shows the decision predictions from the tree. Notice that the data points\
  \ are identical in all three scatterplots. From this, we can infer that the perturb\
  \ method in this example involves altering the construction method, such as changing\
  \ the splitting criterion, instead of manipulating the data distribution. | | |\
  \ |\n| Some common perturbation methods include: | | | |\n| *   `resample` | | |\
  \ |\n| *   `subsample` | | | |\n| *   `add noise` | | | |\n| *   `adaptively reweight`\
  \ | | | |\n| *   `randomly choose from the competitor splits`. | | | |\n| ### Step\
  \ 2: Combine | | | |\n| The combine step then uses the predictions of the models\
  \ built in the perturb step to create a single prediction. Different models then\
  \ can be combined to create a unison model, a concept typically called ensembling.\
  \ An ensemble model is the combination of multiple models. The combinations can\
  \ be formed with the following methods: | | | |\n| *   voting on the classifications\
  \ | | | |\n| *   weighted voting where some models have more weight | | | |\n| *\
  \   averaging (weighted or unweighted) the predicted values | | | |\n| Figure 6.3:\
  \ Perturb Step | | | |\n| ![image](img/f0189-01.jpg) | | | |\n| Figure 6.4: Combine\
  \ Step | | | |\n| ![image](img/f0190-01.jpg) | | | |\n| Perturb and combine methods\
  \ can be used with any unstable algorithm but they are mostly used with trees. |\
  \ | | |\n| Figure 6.4 contains a graph of the ensemble model for the considered\
  \ example. Graphical representations show that ensembles of trees have decision\
  \ boundaries of much finer resolution than would be possible with a single tree.\
  \ The decision boundaries of a single tree can be viewed as step functions. The\
  \ benefit of ensembling many trees together is that, by adding more steps, the steps\
  \ themselves are smoothed out. | | | |\n| Ensemble methods are a very active area\
  \ of research in the fields of machine learning and statistics. Many other P&C methods\
  \ were devised. | | | |\n| The attractiveness of P&C methods is their improved performance\
  \ over single models. Bauer and Kohavi (1999) demonstrated the superiority of P&C\
  \ methods with extensive experimentation. One reason why simple P&C methods give\
  \ improved performance is variance reduction. If the base models have low bias and\
  \ high variance, then averaging decreases the variance. In contrast, combining stable\
  \ models can negatively affect performance. The reasons why adaptive P&C methods\
  \ work go beyond simple variance reduction. They are the topic of much research\
  \ (for example, see Breiman 1998). Graphical explanations show that ensembles of\
  \ trees have decision boundaries of much finer resolution than would be possible\
  \ with a single tree (Rao and Potts 1997). | | | |\n| A new case is scored by running\
  \ it down the multiple trees and averaging the results. If the predictions are estimates,\
  \ the results are averaged. If the predictions are decisions, results can be combined\
  \ by voting or averaging the posterior probabilities as the basis for the final\
  \ decision. Multiple models need to be stored and processed. The simple interpretation\
  \ of a single tree is lost. | | | |\n| “Bagging goes a long way towards making a\
  \ silk purse out of a sow’s ear, especially if the sow’s ear is twitchy. …What one\
  \ loses, with the trees, is a simple and interpretable structure. What one gains\
  \ is increased accuracy.” | | | |\n| – Breiman (1996) | | | |\n| ## Ensemble Models\
  \ | | | |\n| The ensemble approach relies on combining many relatively weak simple\
  \ models to obtain a stronger ensemble prediction. Ensembling creates a new model\
  \ by combining the predictions from multiple models to improve accuracy, reduce\
  \ bias and variance, and provide robust models in the presence of new data. For\
  \ prediction estimates and rankings, this is usually done by averaging. When the\
  \ predictions are decisions, this is done by voting. | | | |\n\n\n\n-   [集成学习](https://wiki.example.org/feynmans_learning_method)实际上是由多个模型组成的聚合，最终预测是组件模型预测的组合。集成模型生成一个单一的共识预测，如图\
  \ 6.5 所示，由一条粗黑线表示，而许多组件模型则用细灰线表示，给出的点为观测点。\n\n-   集成模型的常见优势是组合模型优于构成它的单个模型。需要注意的是，只有当单个模型相互不一致时，集成模型才能比单个模型更准确。\n\
  \n-   装袋（Bagging）和提升（Boosting）是常见的集成方法。\n\n### 装袋（Bagging）\n\n装袋包括为训练模型（例如决策树）并行创建多个样本，然后将它们的预测概率组合，如图\
  \ 6.6 所示。核心思想是通过平均化许多噪声但无偏的模型，降低估计预测函数的方差。\n\n**Figure 6.5: Ensemble Model**\n\n\
  ![image](img/f0191-01.jpg)\n\n**Figure 6.6: Parallel Ensemble Approach**\n\n![image](img/f0192-01.jpg)\n\
  \n装袋的名字暗示了它使用带有放回的重复无权重样本来构建模型并将它们组合。把你的观测想象成一袋野米的颗粒。你的目标是识别黑色颗粒，因为单独出售时它们的转售价格是\
  \ 10 倍。\n\n1.  从袋中取一勺米。\n\n2.  使用这勺米根据颗粒特征构建模型，但排除颜色特征。\n\n3.  记录模型的分类逻辑和拟合统计。\n\
  \n4.  将勺子的米倒回袋中。\n\n5.  好好摇晃袋子，然后重复。\n\n勺子的大小与袋子的大小，以及取样的次数，会因行业和情境而异，但可以使用 25–30%的数据，取\
  \ 7–10 个样本。这使得每个观测在模型中出现 1–2 次的可能性较高。\n\n(上述米的例子改编自 SAS 博客“集成模型帮助做出更好预测”，作者 Jared\
  \ Dean，[`blogs.sas.com/content/subconsciousmusings/2014/05/01/how-ensemble-models-help-make-better-predictions/`](https://blogs.sas.com/content/subconsciousmusings/2014/05/01/how-ensemble-models-help-make-better-predictions/))\n\
  \n| Bagging stands for “bootstrap aggregating.” |\n\n| --- |\n\nBootstrapping 是一种统计重新采样技术，通过有放回的随机抽样数据集实现。它常用于量化机器学习模型相关的不确定性。\n\
  \n装袋（bootstrap aggregation）是原始的保险和金融方法（Breiman 1996）。\n\n1.  取 K 个 bootstrap 样本。\n\
  \n    bootstrap 样本是从样本大小 n 的经验分布中随机抽取的大小 n 的样本。也就是说，训练数据被放回抽样。样本中有些案例被遗漏，有些案例出现多次。\n\
  \n2.  在每个 bootstrap 样本上构建树。\n\n    剪枝可能是有害的（Bauer and Kohavi 1999）。大树具有低偏差和高方差，是理想的。\n\
  \n3.  通过投票或平均组合预测。\n\n    对于分类问题，取后验概率的平均值或取预测类别的多数票。Bauer and Kohavi (1999) 发现，平均后验概率的表现略优于投票。对于回归问题，取预测值的平均。Breiman\
  \ (1996) 为分类使用了 50 个 bootstrap 复制，为回归使用了 25 个，并对后验概率进行平均。Bauer and Kohavi (1999)\
  \ 为投票和平均都使用了 25 个复制。\n\n**Figure 6.7: Bagging (Bootstrap Aggregation) Example**\n\
  \n![image](img/f0193-01.jpg)\n\n简单的例子在图 6.7 中展示。从包含六个案例的训练数据集开始，第一步是取四个 bootstrap\
  \ 样本。每个样本包含六个案例。装袋通过有放回的抽样生成样本，这意味着某些案例可能被遗漏，某些案例可能出现多次。例如，在第一个 bootstrap 样本中，案例\
  \ 3 和 5 出现两次，案例 1 和 6 出现一次，案例 2 和 4 根本没有出现。\n\n接下来，在每个 bootstrap 样本上构建树。在装袋方法中，树独立生长，可以并行构建，例如在\
  \ SAS Viya 分布式计算环境中实现，这使得装袋比其他 P&C 方法更快。最后，将每棵树的预测通过投票或平均组合。\n\n### 提升（Boosting）\n\
  \n创建决策树的最大挑战之一是确定树的最佳大小，尤其是在数据稀缺或目标事件罕见时。提升的思想是按顺序迭代多个决策树，无需剪枝。该算法基于这样的前提：树不需要是强预测者，因为被错误分类的观测会在迭代中用于训练后续模型，模型学会捕捉这些错误分类的观测。分类树、回归树或其他任何预测模型，如果其性能较差（即准确率略高于随机猜测），则被称为“弱”学习者。多个弱学习者通过提升（以及装袋等方法）汇聚，形成“强”集成模型。\n\
  \n**Figure 6.8: Sequential Ensemble Approach**\n\n![image](img/f0194-01.jpg)\n\n\
  提升与装袋的主要区别在于样本中的观测现在被加权。以之前的米的例子为例，在步骤 3 之后，你会把错误分类的米粒（例如，把黑色颗粒误认为非黑色，或把非黑色颗粒误认为黑色）拿出来放在一旁。然后从袋中取一勺米，并留出空间放入那些错误分类的米粒。通过以更高的比例包括先前误分类的米粒，算法更有机会识别正确分类的特征。这与给予未掌握的闪卡更多复习时间相同。\n\
  \n我们通常在预测问题中使用装袋模型，在分类问题中使用提升。通过取多个数据样本并迭代建模，我们允许那些原本较弱的因素被探索。这提供了更稳定且更具泛化性的解决方案。当模型准确率是最重要的考虑因素时，集成模型将是你的最佳选择。\n\
  \n| Boosting stands for an approximation of the sequential bootstrap aggregation.\
  \ |\n\n| --- |\n\n“Boosting is a machine learning ensemble meta-algorithm for primarily\
  \ reducing bias, and also variance.”\n\n– Breiman (1996)\n\n“The term boosting refers\
  \ to a family of algorithms that are able to convert weak learners to strong learners.”\n\
  \n– Zhou (2012)\n\n**Figure 6.9: Boosting (Arcing) Example**\n\n![image](img/f0195-01.jpg)\n\
  \n弯曲（adaptive resampling and combining）方法是提升的例子。它们会根据前一个模型的结果对训练数据进行逐步扰动。那些被错误分类的案例在后续模型中会获得更大的权重。Arc-x4（Breiman\
  \ 1998）是 AdaBoost（自适应提升，也称为 Arc-fs）算法（Freund and Schapire (1996)）的简化版本。两者性能相似（Breiman\
  \ 1998, Bauer and Kohavi 1999）。\n\n\n\n\n在 k 步时，使用每个案例的权重拟合一个模型（决策树）。对于第 i 个案例，Arc-x4\
  \ 权重（即选择概率）为  \n\n[ \\\\( p(i) = \\\\frac{1 + m{(i)}^{4}}{\\\\sum\\\\left( {1 +\
  \ m{(i)}^{4}} \\\\right)}, \\\\) ]\n\n其中 0 ≤ m(i) ≤ k 是前序步骤中第 i 个案例被错误分类的次数。与 bagging\
  \ 不同，剪枝单棵树能提升性能（Bauer and Kohavi 1999）。\n\n每个 boosting 创建的树都依赖于上一轮的树。跨迭代，如 Figure\
  \ 6.9 所示，算法会累计误分类次数。每个案例的权重取决于是否在当前迭代中误分类次数增加：误分类次数增加则权重上升，误分类次数不变则权重下降。权重影响下一迭代中该案例被选入样本的概率。\n\
  \n权重可以通过加权分析或通过抽样使第 i 个案例被选中的概率为 p(i) 来纳入模型。为便利，权重可乘以样本量 n 进行归一化为频率。Bauer and Kohavi\
  \ (1999) 发现，对 arc-x4 采用抽样比加权表现更好，但对 AdaBoost 的性能没有改变。AdaBoost 使用更复杂的 p(i) 公式。两种公式都更倾向于给予误分类频繁的案例更大权重。\n\
  \n该过程重复 K 次，最终的 K 个模型通过投票或后验概率的平均结合。AdaBoost 采用加权投票，误分类较少的模型（尤其是难以分类的案例）获得更大权重。Breiman\
  \ (1998) 采用 K=50，Bauer and Kohavi (1999) 采用 K=25。\n\n与 bagging 相比，Arcing 能显著提升性能，但改进的稳定性不如\
  \ bagging（Breiman 1998，Bauer and Kohavi 1999）。\n\n树基模型比较\n\n将三种树基模型的准确率进行比较颇具兴趣：单个决策树、基于\
  \ bagging 的树基集合模型以及基于 boosting 的树基集合模型。如 Figure 6.10 所示，这三张图基于包含两个输入的数据集。单个决策树模型通过递归分割生成，所有树基模型都使用阶梯函数划分输入空间。单棵树的图示表明步数较少且步长较大，导致分类时步数不足，从而可能降低准确率。\n\
  \n两个集合模型的图示步数更多且步长更小。由于分类时使用的步数更多，准确率相较于单棵树有所提升。\n\n请注意，boosting 在平滑预测面方面优于 bagging，因为\
  \ boosting 在训练时更强调误分类案例。\n\nBagging 与 boosting 都能降低单一估计的方差，因为它们结合了多个模型的估计结果，从而可能得到更稳健的模型。通常建议在降低决策树分类器方差时使用\
  \ bagging，而 boosting 用于构建预测器集合。Table 6.1 对 bagging 与 boosting 的特性进行了对比。\n\n图 6.10：单树、Bagged\
  \ 树和 Boosted 树\n\n![image](img/f0196-01.jpg)\n\n| 表 6.1：Bagging 与 Boosting 对比 |\n\
  | --- |\n|  | Bagging | Boosting |\n| 抽样 | 随机选取无权重的案例 | 对误分类案例赋予更高权重 |\n| 目标 | 最小化方差\
  \ | 提高准确率 |\n| 所用方法 | 随机子空间 | 梯度下降 |\n| 组合模型 | 加权平均 | 加权多数投票 |\n| 示例算法 | 森林（Random\
  \ Forest） | 梯度提升 |\n\n如果单个模型表现非常差，bagging 很少能获得低偏差；但 boosting 可能生成误差更小的组合模型，因为它在利用单模型的优势并减少其缺陷。相反，如果单模型的难点是过拟合，那么\
  \ bagging 是最佳选择。boosting 可能无法避免过拟合，事实上，boosting 本身也面临过拟合问题。\n\n| Bagging 与 boosting\
  \ 都是随机算法，因此实际结果可能与下文 章节 6 至 9 的演示结果不同。 |\n\n| --- |\n| 森林模型 |\n![image](img/f0197-01.jpg)\
  \ |\n\nLeo Breiman (2011) 对如何利用 bootstrap 样本（bagging）对分类和回归树进行集成的研究作出了贡献，这部分工作在一定程度上帮助了统计学与计算机科学在机器学习之间的桥梁建设。\n\
  \n森林模型本质上是一个 bagging 算法，它通过构建多个分类或回归树的集合来生成预测模型。森林模型是一种集成学习方法，用于分类和回归任务，在训练时构建大量决策树，最终预测为各棵树的多数类（分类）或各棵树预测值的平均（回归）。\n\
  \n在发现 bagging 算法会导致树之间相关性较高后，对随机森林模型的需求出现。假设数据集中存在一个极强的预测变量以及其他中等强度的预测变量。在 bagging\
  \ 中，每棵树在根节点都会考虑该极强预测变量，导致树木之间高度相似。对多个高度相关树的平均并不能显著降低方差。\n\n随机森林与 bagging 的主要区别在于，随机森林在划分时只考虑一子集的预测变量，从而引入更大的树间变异。这使得各棵树的顶层分割使用不同的变量，树木之间不相关，平均输出更可靠。\n\
  \n在森林中组合树木\n\n调制森林是建模过程中重要的一步，以获得最准确、有用且泛化的模型。Model Studio 中的 Forest 节点或 SAS Viya\
  \ 的 FOREST 过程提供了多种调参选项。SAS 默认设置这些选项为在大多数情况下最有效的值，但进一步微调通常能进一步提升模型准确性。因此，本小贴士的核心在于：如何最有效地调参随机森林？如\
  \ Figure 6.11 所示，最重要的两个特征是：\n\n第一，森林是由大量决策树组成的集合，因此树的数量对模型准确性有显著影响。树的数量增加会正向提升模型准确性，使模型更准确、更通用。`Number\
  \ of trees` 属性指定森林中的树的数量，默认值为 100。\n\n第二，计算名义目标的预测概率时，需要确定预测类别的最高概率对应的类别。该选项影响森林模型的评分和统计指标。`Class\
  \ target voting method` 属性指定计算类别预测概率的方法，可选值为 `probability`（默认）和 `majority`。\n\n\
  图 6.11：森林中树的组合的重要特征\n\n![image](img/f0198-01.jpg)\n\n\n\nThe Probability option\
  \ specifies that the predicted probability of each target level is equal to the\
  \ probability of that level averaged over each tree in the forest.\n\nThe Majority\
  \ option specifies that the predicted probability of each target level is equal\
  \ to the number of trees in the forest that predicted that level as the target,\
  \ divided by the total number of trees in the forest.\n\nPerturbing Trees in a Forest\n\
  \nRecall that bagging takes bootstrap samples of the rows of training data. All\
  \ columns are considered for splitting at every step. The forest algorithm samples\
  \ the rows and the columns at each step. The difference in trees in a forest model\
  \ is illustrated in Figure 6.12. The forest algorithm perturbs the training data\
  \ more than the bagging algorithm. This increased variation among the trees in the\
  \ ensemble often leads to improved predictive accuracy.\n\nThe decision trees in\
  \ a random forest are overtrained by letting them grow to a large depth and small\
  \ leaf size. The theory behind this approach is that averaging the predicted probabilities\
  \ of many overtrained trees is more robust than using a single fine-tuned decision\
  \ tree.\n\nThe data used to train each tree is a random sample of the complete data\
  \ set (with replacement). The input variables that are considered for splitting\
  \ each node are a random subset of all variables (as opposed to all variables being\
  \ candidates for defining the splitting rule), reducing bias toward the most influential\
  \ factors and allowing secondary factors to play a role in the model.\n\nThe variation\
  \ among the trees can be controlled by properties like the ones described in Figure\
  \ 6.13.\n\nFigure 6.12: Difference in Trees\n\n![image](img/f0199-01.jpg)\n\nFigure\
  \ 6.13: Important Characteristics for Perturbing Trees in a Forest\n\n![image](img/f0200-01.jpg)\n\
  \nThe In-bag sample proportion property specifies the fraction of the random bootstrap\
  \ sample of the training data to be used for growing each tree in the forest, where\
  \ the number is a value between 0 and 1. The default value is 0.6.\n\nThe Use default\
  \ number of inputs to consider per split property specifies whether to use the default\
  \ number of inputs to consider per split, that is, the square root of the number\
  \ of inputs. By default, this option is selected.\n\nThe Number of inputs to consider\
  \ per split property specifies the number of input variables that are randomly sampled\
  \ to use per split. This option is available only if you deselect Use default number\
  \ of inputs to consider per split. The default value is 100.\n\nThe Number of inputs\
  \ to subset with Loh’s method property specifies the number of input variables to\
  \ further sample using the Loh’s method. When set to 0, no further sampling of inputs\
  \ is performed. The default value is 0.\n\nThe Seed property specifies the seed\
  \ for generating random numbers. This option is used to select training observations\
  \ for each tree and to select candidate variables in each node to split on. The\
  \ default value is 12345.\n\nReducing Correlation of the Predictions of the Trees\n\
  \nA decision tree in a forest trains on new training data that are derived from\
  \ the original training data. Using different data to train different trees reduces\
  \ the correlation of the predictions of the trees, which in turn should improve\
  \ the predictions of the forest.\n\nAs illustrated in Figure 6.14, the Forest node\
  \ samples the original data with replacement to create the training data for an\
  \ individual tree. The convention of sampling with replacement originated with Leo\
  \ Breiman’s bagging algorithm (Breiman 1996, 2001). The word bagging stems from\
  \ “bootstrap aggregating,” where “bootstrap” refers to a process that uses sampling\
  \ with replacement. Breiman refers to the observations that are excluded from the\
  \ sample as out-of-bag (OOB) observations. Therefore, observations in the training\
  \ sample are called the bagged observations, and the training data for a specific\
  \ decision tree are called the bagged data.\n\nFigure 6.14: In-Bag and Out-Of-Bag\
  \ Samples\n\n![image](img/f0201-01.jpg)\n\nEstimating the goodness of fit of the\
  \ model by using the training data is usually too optimistic; the fit of the model\
  \ to new data is usually worse than the fit to the training data. Estimating the\
  \ goodness of fit by using the out-of-bag data is usually too pessimistic at first.\
  \ With enough trees, the out-of-bag estimates are an unbiased estimate of the generalization\
  \ fit. Some model assessments such as the iteration plots are computed using the\
  \ out-of-bag sample as well as all the training and validation data.\n\nLoh’s Method\n\
  \nThe Forest node trains a decision tree by splitting the bagged data, then splitting\
  \ each of the resulting segments, and so on recursively until some constraint is\
  \ met.\n\nSplitting involves the following subtasks:\n\n1.  selecting candidate\
  \ inputs\n\n2.  computing the association of each input with the target\n\n3.  searching\
  \ for the best split that uses the most highly associated inputs\n\nFigure 6.15\
  \ represents this process. For example, if you have j input variables in the training\
  \ data, the Forest node randomly selects m candidate input variables independently\
  \ in every node, where m is the value of the Number of inputs to consider per split\
  \ property. If you specify L as the value of the Number of inputs to subset with\
  \ Loh’s method property and L < m, then the node chooses the best L input variables\
  \ from the m variables according to the criterion described by Loh in a series of\
  \ papers (Loh and Shih 1997; Loh 2002, 2009). This method selects the number of\
  \ variables that have the smallest p-value of a chi-square test of association in\
  \ a contingency table. These variables are selected from the m randomly selected\
  \ variables that are chosen for a single decision tree in the forest.\n\nFigure\
  \ 6.15: Loh’s Method\n\n![image](img/f0202-01.jpg)\n\nA split search is performed\
  \ on all L or m variables, and the best rule is kept to split the node. The reason\
  \ for searching fewer input variables for a splitting rule instead of searching\
  \ all inputs and choosing the best split is to improve the prediction on new data.\
  \ An input that offers more splitting possibilities provides the search routine\
  \ more chances to find a spurious split. Loh and Shih (1997) demonstrate the bias\
  \ toward spurious splits that result. They also demonstrate that preselecting the\
  \ input variable and then searching only on that one input reduces the bias. You\
  \ can choose to preselect a few input variables by using the Number of inputs to\
  \ subset with Loh’s method option.\n\nThe split search seeks to maximize the reduction\
  \ in the gain for a nominal target and the reduction in variance of an interval\
  \ target.\n\nSplitting Options You Already Know\n\nBy now you are already familiar\
  \ with the splitting options for individual trees. They have been discussed in Chapter\
  \ 3. Here is a quick discussion of such options in the context of forest models.\n\
  \nSplitting Criteria\n\nFigure 6.16 represents splitting criteria options in the\
  \ Forest node in Model Studio. Visibly, many of the tree splitting options in the\
  \ Forest node are similar to that of the Decision Tree node. You already know the\
  \ following tree split options.\n\nClass target criterion and Interval target criterion\
  \ specify the splitting criterion to use for determining the best splits on inputs\
  \ given a class/interval target. Exactly the same options are available that you\
  \ have seen in decision tree, that is, CHAID, Chi-square, Entropy, Gini, and Information\
  \ gain ratio for a class target and CHAID, F test, and Variance for an interval\
  \ target.\n\nFigure 6.16: Class and Interval Target Criteria\n\n![image](img/f0203-01.jpg)\n\
  \nBranches and Depth\n\n\n\nFigure 6.17 表示在 Model Studio 中 Forest 节点的分支数量和深度选项。\n\
  \nMaximum number of branches 指定在每个节点分割树时考虑的最大分支数量。可能的取值范围是 2 到 5。默认值为 2。\n\nMaximum\
  \ depth 指定为每个生成的树在森林中的最大深度。可能的取值范围是 1 到 50。默认值为 20。\n\nLeaf Size\n\n森林中另一个重要的调参参数是最小叶节点大小，它指定决策树中节点可以拥有的最小观测数。如果分割规则导致子节点的观测数少于该数值，则该节点不进行分割。在\
  \ Decision Tree 节点中，你通过指定最小叶节点大小来控制它。这里在森林中，可以通过设置绝对值或节点被分割时总观测数的百分比来控制。该参数在 Figure\
  \ 6.18 中表示。\n\nFigure 6.17: Number of Branches and Depth Options\n\n![image](img/f0203-02.jpg)\n\
  \nFigure 6.18: Leaf Size Options\n\n![image](img/f0204-01.jpg)\n\nLeaf-size specification\
  \ 指定确定最小叶节点大小的方法。可能的取值为 Count 和 Proportion。默认值为 Count。\n\nMinimum leaf count 指定新分支可以拥有的最小训练观测数。该数值以可用观测数的计数形式表示。仅在\
  \ Leaf-size specification 设置为 Count 时可用。可能的取值范围是 1 到 64。默认值为 5。\n\nMinimum leaf\
  \ proportion 指定新分支可以拥有的最小训练观测数。该数值以非缺失目标值的观测数的比例形式表示。仅在 Leaf-size specification\
  \ 设置为 Proportion 时可用。默认值为 0.00005。\n\nMissing Values\n\n缺失值在森林模型的每棵树中处理方式与单棵决策树相似。然而，这里缺失观测不能被分配到单独、最大或最相关的分支中。\
  \ Figure 6.19 表示可用的选项。\n\nFigure 6.19: Missing Values Options\n\n![image](img/f0204-02.jpg)\n\
  \nMissing values 指定当存在缺失值时应采取的操作。森林的缺失值处理选项相较于决策树较少。你可以指定 Ignore、Use as machine\
  \ smallest 或 Use in search。默认值为 Use in search。\n\nMinimum missing use in search\
  \ 指定在分割搜索中使用缺失值的阈值。默认值为 1。\n\nInterval Binning\n\n区间输入的相同分箱选项在 Forest 节点中与 Decision\
  \ Tree 节点中所见相同。 Figure 6.20 表示这些选项。\n\nNumber of interval bins 指定用于区间输入的 bins 数量。Bin\
  \ size 为 (maximum value – minimum value)/(Number of interval bins)。默认值为 50。\n\n\
  The interval bin method 指定用于对区间输入变量进行分箱的方法。选择 Bucket 表示根据最大值和最小值的差值将输入变量均匀分箱。选择\
  \ Quantile 表示将输入变量分成大约相等大小的组。默认值为 Quantile。\n\nMeasuring Variable Importance\n\n\
  变量的重要性是它对模型成功的贡献。变量重要性也用于选择后续模型的变量。选定变量之间的比较重要性不重要。研究人员通常希望第一个模型快速且简洁，后续模型则追求准确性。尽管存在这种倾向，森林模型在需要变量间交互时通常比简单的回归更有用，因为变量通过交互作用为森林模型贡献。\n\
  \n多位作者已证明，先使用森林选择变量，然后仅在后续森林中使用这些变量，可以得到比仅在单一森林中训练时预测效果更好的最终森林。\n\n如 Figure 6.21\
  \ 所示，森林的变量重要性是所有树在森林模型中变量重要性的平均值。SAS Viya 中的森林模型实现了三种计算变量重要性的方法，如 Chapter 4 所述。默认情况下，变量重要性使用残差平方和的变化来计算。你可以通过指定\
  \ RBAIMP 选项在 FOREST 过程式中使用随机分支分配 (RBA) 方法计算变量重要性。\n\nFigure 6.20: Binning Options\n\
