  \nModel Scoring\n\nAfter building a decision tree model, or for that matter any\
  \ other model, we put the model to use by scoring new data. The scoring process\
  \ is sometimes referred to as model deployment, model production, or model implementation.\
  \ All tasks performed earlier in the analytics life cycle lead to this task: generating\
  \ predictions through scoring. An organization gets value from the model when it\
  \ is in production. To maximize that value, it is necessary to monitor model performance\
  \ over time and update the model as needed.\n\nFor scoring, the model is first translated\
  \ into another format (typically, score code). In the SAS Viya environment, score\
  \ code is a SAS program that you can easily run on a scoring data set. Then the\
  \ model is applied to the scoring data set to obtain predicted outcomes. Based on\
  \ the predictions from the model, the enterprise makes business decisions and takes\
  \ action.\n\nAfter you download the score code, there are several model deployment\
  \ options in SAS Viya:\n\n* The Score Data node in Model Studio enables you to score\
  \ a data table with the score code that was generated by the predecessor nodes in\
  \ the pipeline. The scored table is saved to a caslib. By default, the scored table\
  \ is temporary, exists only for the duration of the run of a node, and has local\
  \ session scope. The Score Data node enables you to save the scored table to disk\
  \ in the location that is associated with the specified output library. After it\
  \ is saved to disk, this table can be used by other applications for further analysis\
  \ or reporting.  \n\n    Note: This approach is shown in this book.\n\n* Models\
  \ that create ASTORE code can be scored in SAS Studio using the ASTORE procedure.\n\
  \n* You can also run a scoring test in SAS Model Manager.\n\n* Model Studio creates\
  \ API for score code to be called from SAS or Python or through a REST API. Within\
  \ a project in Model Studio, you can go to the Pipeline Comparison tab and click\
  \ the Project pipeline menu (three vertical dots) in the upper right and select\
  \ Download score API. The code that it provides can be used directly in other applications.\
  \ (You just need to modify the CAS server and port that you are calling, the data\
  \ source that you want to score, and the name of the output caslib and scored output\
  \ table.) Even when you call the score code through the API from a Python program,\
  \ the score code runs in CAS, not in Python.\n\n* Score code can also be published\
  \ to Micro Analytics Services (web service) and to SAS Event Stream Processing.\n\
  \n![image](img/Demo.jpg)Demo 2.2: Scoring a Decision Tree Model in Model Studio\n\
  \nThis demonstration builds on the Insurance\\_ClassTree project on the insurance\\\
