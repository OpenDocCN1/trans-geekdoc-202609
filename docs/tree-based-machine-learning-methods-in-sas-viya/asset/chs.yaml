  \n创建良好的决策树模型或其他基于树的模型时，需要做出许多参数选择。通常的做法是通过试错方法寻找最佳的属性组合。数据科学家常根据实践经验和个人偏好选择算法，这很合理，因为通常没有唯一且相关的解决方案来构建一个优秀的树模型。已开发出许多算法来自动化机器学习管道中手动且繁琐的步骤。然而，构建一个可信且可靠的机器学习模型仍需大量时间和精力。\n\
  \n大量手动工作集中在为所选模型算法找到最佳超参数集上。超参数是用于在数据集上自动提取信息的模型所定义的参数。\n\nAutotuning 是两步过程（如图 5.22\
  \ 所示）。首先，在 Model Studio 的 `Decision Tree` 节点（以及 `Forest` 和 `Gradient Boosting` 节点）中启用\
  \ `Perform Autotuning` 属性并确定需要调节的超参数。随后，选择搜索方法。Autotuning 通过使用搜索方法，在选定的目标函数（通常是模型误差度量）上最小化或最大化该函数。SAS\
  \ Viya 提供多种搜索选项。\n\nSAS Visual Data Mining and Machine Learning 的自动调参功能利用本地搜索优化（LSO）框架，提供灵活且有效的混合搜索策略。默认搜索策略先使用拉丁超立方抽样（LHS），其在超参数空间上的抽样更均匀，优于网格或随机搜索。LHS\
  \ 的最佳样本随后用于启动遗传算法（GA），在迭代过程中对最佳样本进行交叉和变异。每次迭代生成新的模型配置人口。重要的是，SAS Viya 可以并行评估 LHS\
  \ 样本，且 GA 在每次迭代中的人口也可以并行评估。其他搜索方法包括单一 LHS、纯随机抽样、网格搜索以及贝叶斯搜索方法。\n\n图 5.22：自动调参决策树模型\n\
