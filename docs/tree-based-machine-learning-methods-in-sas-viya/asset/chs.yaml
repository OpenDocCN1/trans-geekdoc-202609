  \n与其他回归和分类方法相比，树模型的优势在于它们易于解释和可视化，尤其是当树较小时。基于树的方法能够很好地处理大数据集，并且提供多种处理缺失值的方法，包括代理分割。然而，树模型也有局限性。回归树模型在预测空间的矩形区域上是恒定的，因此往往缺乏捕捉预测变量与响应之间平滑关系所需的灵活性。另一个局限是，数据的微小变化可能导致非常不同的分割，这削弱了模型的可解释性。\n\
  \n31. 点击 ![image](img/Box-Dot.jpg)(Menu) ![image](img/Arrow.jpg) Save as 在右上角。将此报告保存为\
  \ Housing\\_RegTree，位置在 My Folder。\n\n32. 返回 RegTree 页面。点击 Create pipeline ![image](img/Arrow.jpg)\
  \ Add to new project。![image](img/f0056-01.jpg) 观察到 ASE 为 13.2237。\n\n探索两棵决策树（一棵使用\
  \ MEDV 目标，另一棵使用 Log\\_MEDV 目标）的过程很有趣。您可以将其中任意一棵推入 Model Studio 进行进一步优化。\n\n决策树的目的在于确定一系列\
  \ if-then 规则，以实现对案例的准确预测或分类。因此，决策树并不隐含假设目标与输入之间的关系是线性的、遵循特定的非线性链接函数，或者即使是单调的。这鼓励我们使用原始目标的决策树。\n\
