  \n![image](img/EndOfDemo.jpg)\n\n图 7.4：异常检测常见示例\n\n![image](img/f0238-01.jpg)\n\n\
  **Isolation Forest 模型**\n\n在数据挖掘和机器学习中，异常检测是识别那些与大多数项目、事件或观测显著不同的罕见项目、事件或观测的过程。通常，这些异常项目有潜力转化为诸如网络入侵、结构缺陷、错误、传感器网络中的事件检测、生态系统扰动、在\
  \ MRI（磁共振成像）扫描中发现恶性肿瘤，或欺诈检测等问题。Figure 7.4 展示了一些异常检测的应用场景。\n\n| 异常检测是指识别不符合预期模式或数据集中其他项目的项目或事件。\
  \ |\n\n| --- |\n\n异常检测通常用于预处理，以便从数据集中移除异常数据。在 Model Studio 中，异常检测节点是数据挖掘预处理节点，使用支持向量数据描述（SVDD）识别并排除异常（观测）。但这超出本书的范围。\n\
  \n**使用树基方法进行欺诈检测**\n\n欺诈是全球公司日益关注的问题。欺诈检测方法旨在检测或阻止涉及金融交易的非法活动。欺诈是故意进行的误导行为以获取财务利益。异常检测是检测欺诈的一种方式。您需要预测偶尔发生的事件，并识别数据中不符合预期行为的模式，例如信用卡上出现异常高额购买。\n\
  \n在机器学习中，识别欺诈时通常使用两种方法。它们简要说明于 Figure 7.5。第一种方法基于受监督的机器学习方法。该方法使用包含历史数据的数据集，数据集中已包含用户正在寻找的欺诈类型的示例。算法可以通过使用欺诈案例和非欺诈案例进行模型训练来检测欺诈事件。用于此类欺诈检测的典型建模方法包括逻辑回归、决策树、随机森林、梯度提升、神经网络以及其他分类模型。\n\
  \n图 7.5：树基方法在欺诈检测中的应用\n\n![image](img/f0239-01.jpg)\n\n除了受监督的方法外，还存在无监督方法，这些方法也被用于检测欺诈案件。这些方法之所以被称为“无监督”，是因为没有使用包含欺诈案例的历史信息来训练模型。受监督模型的训练数据集会包含一个指示欺诈/非欺诈的变量，而无监督模型的数据集则不包含此类变量。相反，无监督方法通过在数据集中找到与其他高密度区域相隔的观测来识别异常。通过相互分析客户或交易，我们能够发现异常观测。这些观测可能表明欺诈，通过识别它们，我们可以检查正在发生的情况以及其是否具有欺诈性质。\n\
  \n\n\n\n假设背后的假设是，欺诈行为通常会在数据集中表现为异常。需要注意的是，仅仅因为一个观测是异常，并不意味着它是欺诈行为或对用户有兴趣。同样，欺诈行为也可以伪装成更常规的行为类型来隐藏。然而，在没有标记训练数据的情况下，无监督学习是一个良好的方法，用于初步识别异常账户或交易。\n\
  \n使用无监督方法而不是监督方法的原因有几个。如前所述，用户可能没有历史上关于正在检测的欺诈类型的示例。没有标记的观测，监督学习的选项有限。\n\n另一个使用无监督方法而不是监督方法，或在监督方法之外的原因，是尝试发现历史数据中可能未被捕获的新型欺诈行为。欺诈模式可以演变或改变，因此需要不断寻找尽早识别这些新模式的方法。如果仅依赖于基于历史数据构建的监督模型，这些新模式可能会被漏掉。然而，由于无监督方法不受历史数据中存在的模式的限制，它们有潜力在出现异常或不寻常行为时识别这些新模式。\n\
  \n用于识别异常的一个无监督方法是隔离森林（Isolation Forest）。\n\n什么是隔离森林？\n\n隔离森林是一个算法，用于在多维空间中识别离群点，其原理与森林算法类似。隔离森林（Liu,\
  \ Ting, and Zhou 2008）是一种专门构建的森林，用于异常检测而非目标预测。\n\n隔离森林明确识别异常，而不是对正常数据点进行描述。像任何树集方法一样，隔离森林是基于决策树构建的。对于隔离森林中的每个分割，随机选择一个输入变量。如果该变量是连续变量，则在该节点中观测值的最大值和最小值之间的随机值进行划分。如果该变量是类别变量，则为每个变量的水平分配到随机分支上。通过这种构建方式，异常观测更有可能在从根节点到叶节点的路径上更短，而非异常观测则路径更长。\n\
  \n无监督方法如何检测异常？\n\n异常观测比正常观测更少见，并且在数值上与正常观测不同（它们在特征空间中距离正常观测更远）。因此，通过使用这种随机分区，异常观测应该更靠近树的根节点（平均路径更短，即观测从根节点到叶节点所经过的边数更少），并且需要更少的分割。这一点在\
  \ Figure 7.6 中描述。\n\n可以通过视觉检查（如 Gillespie 2019 所提供）来理解最短路径将观测隔离的含义。在 Figure 7.7\
  \ 中，你可以看到一个二维数据集，其中有两个被高亮的异常观测，一个是红色，一个是橙色。通过观察需要对 X1 和 X2 变量进行多少次划分来隔离每个观测，我们可以大致了解该观测被认为有多异常。\n\
  \nFigure 7.6: Isolating Anomalies in a Completely Random Tree\n\n![image](img/f0240-01.jpg)\n\
  \nFigure 7.7: 2-D Space with Two Highlighted Observations\n\n![image](img/f0241-01.jpg)\n\
  \n观察红色标记的观测，你可以看到需要两次划分将其与数据集中的其他记录隔离。参见 Figure 7.8。\n\n然而，当你尝试隔离橙色观测时，你会发现需要三次划分。参见\
  \ Figure 7.9。\n\n非异常观测需要的分割比异常观测更多。基于两次划分，我们可以说红色观测比橙色观测（需要三次划分）更异常。这是隔离森林的核心思想。然而，在算法的实现过程中，它是作为一系列决策树的平均路径长度来应用的，这些决策树用于构建隔离森林，如\
  \ Figure 7.10 所示。\n\nFigure 7.9: 2-D Space with the Orange Observation Isolated\n\
  \n![image](img/f0242-01.jpg)\n\nFigure 7.10: Creating a Forest\n\n![image](img/f0242-02.jpg)\n\
  \n测量异常\n\n该算法会为每个观测返回一个异常分数，基于该观测在构建的树中的路径长度。异常分数计算如下：\n\n$\\\\text{Anomaly~Score}\
  \ = 2^{- {(\\\\frac{\\\\text{Average~path~length~for~observation}}{\\\\text{Average~length~of~all~paths}})}$\n\
  \n指数中的数量是所有树中观测的平均路径长度与所有路径的平均长度的比值。\n\n异常分数始终在 0 到 1 之间，值越接近 1，观测被异常的可能性越大。通过这个异常分数，你可以分析罕见观测的异常可能性（例如，欺诈行为）。\n\
  \nFigure 7.11: Detecting Anomalous Observations\n\n![image](img/f0243-01.jpg)\n\n\
  当使用 FOREST 过程创建隔离森林时，它会在得分数据表中写入异常分数。\n\n分数接近 1 表示异常。分数远小于 0.5 表示正常观测。如果所有分数都接近\
  \ 0.5，则整个样本似乎没有明显的、区分开的异常。\n\n验证隔离森林有效性的一种方法是将其与包含标记欺诈观测的数据集进行测试。\n\n使用 FOREST 过程进行隔离森林\n\
  \nISOLATION 是 PROC FOREST 语句中的一个选项，用于生成隔离森林用于异常检测，而不是用于目标预测。\n\nISOLATION < (SAMPLEN=number)\
  \ >\n\nISOLATION < (SAMPLEN=number) > 用于创建隔离森林用于异常检测，而不是创建用于目标预测的森林。\n\n可以指定以下子选项：\n\
  \nSAMPLEN=number 指定在隔离森林的每棵树中使用的、不放回抽样的观测数量。默认情况下，SAMPLEN=100。\n\n当指定了 ISOLATION\
  \ 选项时，GROW 和 TARGET 语句被忽略，并且 PROC FOREST 语句中的 BINMETHOD、INBAGFRACTION、RBAIMP、VARS_TO_TRY\
  \ 和 VII 选项也被忽略。不计算拟合统计量。\n\n欺诈示例\n\n![image](img/f0244-01.jpg)\n\nPaySim 是一个用于欺诈检测的模拟金融数据集，包含基于从非洲移动金融服务的一个月金融日志中提取的真实交易样本。原始日志由一家跨国公司提供，该公司是目前在世界各地超过\
  \ 14 个国家运营移动金融服务的提供商。这个合成数据集是将原始数据集缩小到原来的四分之一，包含数值型和类别型特征，如交易类型、转账金额、发送方账户号码和接收方账户号码。\n\
  \n你将在接下来的演示中使用 SAS Studio 接口在该数据上实现隔离森林。作为替代接口，你也可以使用 Model Studio 管道中的 SAS Code\
  \ 节点。\n\n\n\n\n# Table 7.1: PaySim 数据字典\n\n| 变量 | 描述 | 角色 | 级别 |\n| --- | --- |\
  \ --- | --- |\n| amount | 交易金额（美元） | 输入 | 区间 |\n| isFlaggedFraud | 当单笔交易中超过 200,000\
  \ 美元从一个账户转到另一个账户时，标记非法尝试 | 拒绝 | 二元 |\n| isFraud | 指示交易是否由欺诈代理人进行 | 目标 | 二元 |\n|\
  \ nameDest | 受款人姓名 | 拒绝 | 名义 |\n| nameOrig | 发送人姓名 | ID | 名义 |\n| newbalanceDest\
  \ | 交易后受款人账户余额 | 输入 | 区间 |\n| newbalanceOrig | 交易后发送人账户余额 | 输入 | 区间 |\n| oldbalanceDest\
  \ | 交易前受款人账户余额 | 输入 | 区间 |\n| oldbalanceOrig | 交易前发送人账户余额 | 输入 | 区间 |\n| step |\
  \ 映射时间单位（1 步 = 1 小时） | 拒绝 | 区间 |\n| type | 交易类型（现金入金 / 现金出金 / 借记 / 付款 / 转账） | 拒绝\
  \ | 名义 |\n\n数据来源由 E. A. Lopez-Rojas、A. Elmir 和 S. Axelsson 提供。“PaySim: A financial\
  \ mobile money simulator for fraud detection.” 第 28 届欧洲建模与模拟研讨会-EMSS，拉纳卡，塞浦路斯，2016。\n\
  \n![image](img/Demo.jpg)Demo 7.2: 使用隔离森林在 SAS Studio 中检测欺诈\n\n在本演示中，您将创建一个隔离森林，以检测包含移动支付合成交易的数据集（即\
  \ PaySim 数据）中的欺诈行为。为了便于比较，我们将使用 `isFraud` 变量来检查我们无监督模型检测欺诈观测的能力。\n\n1\\. 前往左上角的“应用程序”菜单（![image](img/Line.jpg)）。\n\
  \n2\\. 在应用程序快捷方式区域点击“开发 SAS 代码”。这将启动 SAS Studio。您可以在此处使用预定义任务生成 SAS 代码，或自行编写新任务。\n\
  \n![image](img/f0245-01.jpg)\n\n3\\. 在左侧窗格点击“片段”图标。在“我的片段” ![image](img/Arrow.jpg)VBBF\
  \ 下，双击或拖放“隔离森林代码”到画布上。\n\n![image](img/f0245-02.jpg)\n\n程序会在代码编辑器窗口中打开。首先，启动一个 cas\
  \ 会话并为所有默认库分配。\n\ncas;\n\ncaslib \\_all\\_ assign;\n\n4\\. 运行这部分代码。查看右侧的日志面板。\n\n\
  ![image](img/f026-01.jpg)\n\n5\\. 返回代码面板。\n\n接下来，程序加载 PaySim 数据 CSV 文件到 CAS，并通过目标变量对数据进行探索。\n\
  \nproc casutil;\n\nload file=\"/home/student/casuser/VBBF/PaySimData.csv\"\n\nimportoptions=(filetype=\"\
  csv\")\n\noutcaslib= \"public\" casout=\"PaySimData\"; \\*promote;\n\nrun;\n\nproc\
  \ freq data=public.PaySimData;\n\ntables isFraud isFraud\\*type;\n\nrun;\n\n6\\\
  . 运行这部分代码。结果标签页将打开。\n\n![image](img/f026-02.jpg)\n\n数据集包含约六百万笔交易，其中 8213 笔被标记为欺诈。欺诈交易占比仅为\
  \ 0.13%。\n\n![image](img/f026-03.jpg)\n\n数据集包含五类交易，分别为 CASH_IN、CASH_OUT、DEBIT、PAYMENT\
  \ 和 TRANSFER。接下来，我们仅关注 CASH_OUT 和 TRANSFER 这两类，因为它们包含欺诈观测。将数据集限制在这两类中，总观测数减少为 2,770,409。\n\
  \n7\\. 返回代码面板。\n\n接下来，使用 FOREST 过程的 ISOLATION 选项创建隔离森林模型，并展示得分数据的样本。\n\nproc forest\
  \ data=public.PaySimData (where=(type='CASH\\_OUT' or type='TRANSFER'))\n\n       isolation\
  \ outmodel=public.PaySimIsoForest seed=8844\n\n       ntrees=50 numbin=32 minleafsize=1\
  \ maxdepth=8 vars\\_to\\_try=3;\n\ninput amount oldbalanceOrg newbalanceOrig oldbalanceDest\
  \ newbalanceDest / level = interval;\n\ntarget isFraud / level = nominal;\n\nid\
  \ nameOrig;\n\noutput out=public.PaySimScore copyvars=(\\_ALL\\_);\n\nrun;\n\nproc\
  \ print data=public.PaySimScore (obs=10);\n\nvar nameOrig amount oldbalanceOrg newbalanceOrig\
  \ oldbalanceDest  newbalanceDest isFraud \\_Anomaly\\_;\n\nrun;\n\n这段代码运行 FOREST\
  \ 过程，生成包含 50 棵树的隔离森林。OUTPUT 语句对训练数据进行评分，并将结果保存到名为 PaySimScore 的新表中，该表包含每条记录的异常分数。为了便于比较，我们将使用\
  \ isFraud 变量来检查无监督模型检测欺诈观测的能力。然而，作为模型输入，我们仅使用 amount、oldbalanceOrg、newbalanceOrig、oldbalanceDest\
  \ 和 newbalanceDest 这五个变量。\n\n> **注意**：FOREST 过程要求指定目标变量。使用 ISOLATION 选项时，目标变量被忽略。目标可以是常数或随机值。关键是必须指定一个目标，且不能将其作为输入。\n\
  \n8\\. 运行这部分代码。\n\n9\\. 隔离森林模型已创建，包含 50 棵树。\n\n![image](img/f028-01.jpg)\n\n> **注意**：隔离森林模型不会提供变量重要性表。\n\
  \n隔离森林得分通常包含每条记录的异常分数（_Anomaly_）。下图展示了前 10 条记录的样本。\n\n![image](img/f028-02.jpg)\n\
  \n分数越高，观测值越异常。\n\n10\\. 返回代码面板。\n\n最后，程序对得分表进行缩减，以便快速评估，生成可解释的图表，包括在两个输入变量之间的异常分数散点图，以及按实际欺诈情况分组的异常分数直方图。\n\
  \nproc partition data=public.PaySimScore samppct=7 seed=8844 partind nthreads=3;\n\
  \n  by isFraud;\n\n  output out=public.SampledScore copyvars=(\\_ALL\\_);\n\nrun;\n\
  \nproc template;\n\n    define statgraph anomalyPlot;\n\n        begingraph;\n\n\
                layout overlay;\n\n              scatterplot y=amount x=newbalanceDest\
  \ /\n\n                  name='color'\n\n                  markerattrs=(symbol=circlefilled)\n\
  \n                  colormodel=(cyan ligr red)\n\n                  colorresponse=\\\
  _Anomaly\\_;\n\n                  continuouslegend 'color'/ title='\\_Anomaly\\\
  _';\n\n              endlayout;\n\n      endgraph;\n\n  end;\n\nrun;\n\nods graphics\
  \ on;\n\nproc sgrender data=public.SampledScore (where=(\\_PartInd\\_=1)) template=anomalyPlot;\n\
  \nrun;\n\nproc sgplot data=public.SampledScore (where=(\\_PartInd\\_=1));\n\n       histogram\
  \ \\_Anomaly\\_ / group=isFraud;\n\n       yaxis grid;\n\nrun;\n\nods graphics /\
  \ reset;\n\n该图表使用从青色到红色的色阶根据异常分数绘图。异常分数最高的观测值呈红色。\n\n11\\. 现在运行这最后部分代码。\n\n![image](img/f050-01.jpg)\n\
  \n大多数异常观测值具有较高的交易金额和交易后受款人账户余额。在将此结果推广之前，请注意，这基于仅对得分数据的 7% 样本得出。在实际情况下，您可能没有目标标签来与之比较。\n\
  \n![image](img/f050-02.jpg)\n\n直方图显示，相当一部分欺诈（橙色）观测值的异常分数较高（仅显示异常分数高于 0.5 的部分）。然而，在实际情境中，您可能没有目标标签来进行比较。\n\
  \n\n\n\n在欺诈或其他罕见事件检测中，公司可能也受限于可以调查或评估的事件数量。因此，孤立森林也通过查看捕获在 1,000 观测值（例如）中 anomaly\
  \ score 最高的事件数量来进行评估。其思路是：如果公司只能查看有限数量的观测值，他们会希望在这些受限的范围内最大化真阳数。\n\n12\\. 从 Applications\
  \ 菜单中选择 **Build Models** 以关闭 SAS Studio 并回到 Model Studio。（![image](img/Line.jpg)）\n\
  \n![image](img/EndOfDemo.jpg)\n\nIntroduction to Deep Forest Models\n\n![image](img/f0251-01.jpg)\n\
  \n2017 年，Zhi-Hua Zhou 和 Ji Feng 在论文 “Deep Forest: Towards an Alternative to Deep\
  \ Neural Networks” 中引入了一种新的深度学习框架，作为深度神经网络（DNNs）的替代方案。该框架常被称为 **deep forest**，也称为\
  \ **gcForest**（多粒度级联森林），它将多种集成学习方法（包括随机森林和堆叠）组合成一种结构类似多层神经网络的模型，但每一层由随机森林取代神经元。\n\
  \n当前的深度学习模型大多基于神经网络，即由多层可训练的参数化可微分非线性模块组成，可通过反向传播进行训练。深度森林算法则基于不可微分的模块构建深模型。深度神经网络的成功很大程度上取决于三个特征：层层处理、模型内部特征转换以及足够的模型复杂度。深度森林具备相同的特征。它是一种基于决策树集合的方法，超参数数量少于深度神经网络，且模型复杂度可以在数据依赖的方式下自动确定。\n\
  \n由于超参数数量少，**deep forest** 训练简单，不使用反向传播，并且在训练数据规模较小时表现优于许多知名方法，包括深度神经网络。\n\n受深度神经网络启发，**deep\
  \ forest** 采用多层级联结构，但每一层包含许多随机森林而非神经元。deep forest 包含如 Figure 7.12 所示的两个集成组件。第一个组件是\
  \ **多粒度扫描**（multi-grained scanning），采用滑动窗口结构在高维空间中扫描局部上下文，以不同的随机森林学习输入数据的表示；在原始输入维度较高时可选用该组件。第二个组件是\
  \ **级联森林**（cascade forest），在每一层的输入表示监督下学习更具歧视性的表示，从而通过随机森林集合获得更精确的预测。若不使用多粒度扫描，原始特征直接作为输入传递给级联森林，而非经多粒度扫描后得到的特征向量。\n\
  \n深度森林使用传统随机森林作为子程序，主要创新点在于加入深度和滑动窗口应用。\n\n如 Figure 7.13 所示，deep forest 采用级联结构，每一级的级联接收前一层处理后的特征信息并将处理结果传递给下一层。第一层森林的输入要么是特征向量，要么是原始数据（如果未进行多粒度扫描）。更深层的树的输入则是前一层森林的分类结果与原始数据的拼接。每一层都是决策树森林的集合，即“集合的集合”。\n\
  \n图 7.12: Deep Forest: High-Level View\n\n![image](img/f0252-01.jpg)\n\n图 7.13:\
  \ Cascade Structure\n\n![image](img/f0253-01.jpg)\n\n为鼓励多样性，deep forest 包含多种类型的森林，这是集成学习的关键。例如，使用两棵完全随机树森林和两棵随机森林。完全随机树森林的树在每个节点处随机选择一个特征进行划分。同样，每棵随机森林的树通过随机选择\
  \ $\\\\sqrt{d}$ 个特征作为候选（d 为输入特征数），并选择 Gini 值最佳的那个进行划分。\n\n森林直接训练以对其关联的目标进行分类，无论其在深度森林中的层级如何。然而，只有最末层的预测会被平均作为整体评估用的预测；这与大多数深度神经网络不同，后者只有最后一层负责分类，其他层通过反向传播训练且难以解释。\n\
  \n由于每一级级联的特征表示的关键元素是每个随机森林的概率类向量，这些向量通过对该随机森林中所有树的决策树类向量取平均得到。可以通过控制权重来指定损失函数，利用训练数据对这些权重进行训练，并计算树类向量的加权平均，从而得到加权的类向量。这些特征本质上是经过训练的随机森林的预测结果，使用最终类标签进行堆叠。\n\
  \n在 DNNs 中，级联森林的表征学习主要依赖于层层处理原始特征。受此启发，deep forest 通过如 Figure 7.14 所示的多粒度扫描程序来利用这一思想。滑动窗口用于扫描原始特征。\n\
  \n图 7.14: Multi-Grained Scanning\n\n![image](img/f0254-01.jpg)\n\n例如，假设原始输入包含 400\
  \ 个原始特征，并使用 100、200、300 三种窗口大小进行多粒度扫描。对于序列数据，滑动窗口每移动一个特征就会生成一个 100 维特征向量，总共产生 301\
  \ 个特征向量。对于 n 个训练示例，窗口大小为 100 的滑动窗口会生成 301×n 个 100 维训练样本，这些样本用于训练一棵完全随机树森林和一棵随机森林，每棵包含约\
  \ 500 棵树。\n\n在二分类任务中，最终特征向量维度为 1,204 维 [(301+301)+(301+301)]。所有从滑动窗口提取的特征向量都被视为实例，并用于生成类向量。这些类向量随后被拼接为转换后的特征。滑动窗口提取的实例直接获得原始训练示例的标签。\n\
  \n转换后的训练集随后用于训练级联森林的第一层。在测试实例上，它会经历多粒度扫描得到对应的转换特征表示，然后依次通过级联直到最后一层。最终预测通过聚合最后一层的四个三维类向量并取最大值对应的类别得到。\n\
  \nDeep Forest Actions in SAS Viya\n\n\n\nSAS Viya 具备训练和评分深度森林模型的能力。深度森林算法包含在 decisionTree\
  \ 动作集中。请参见 Figure 7.15。你可以专注于两个动作。deepForestTrain 动作用于训练深度森林模型，deepForestScore 动作用于使用深度森林对表格进行评分。这两个动作目前均被隐藏。tuneDeepForest\
  \ 是即将推出的另一个动作，用于调节深度森林模型的超参数。在每一层中，森林数量和每个森林中的树木数量是实际调参的超参数。\n\n目前这些动作处于实验阶段，因此被隐藏。深度森林演示在此不包括。\n\
  \nFigure 7.15: Deep Forest Actions in the decisionTree Action Set\n\n![image](img/f0255-01.jpg)\n\
  \nQuiz\n\n1\\. 哪项陈述关于隔离森林模型是 TRUE 的？\n\na. 它基于隔离异常的原理，而不是常规的对正常点进行描述的方法。\n\nb. 它是受监督学习算法。\n\
  \nc. 它用于特征提取。\n\nd. 以上全部\n\nAnswers\n\n| 1. a |\n\n| --- |\n\nChapter 8: Tree-Based\
  \ Gradient Boosting Machines\n\nGradient Boosting Models\n\n![image](img/f0257-01.jpg)\n\
  \n梯度提升是一种迭代方法，在训练数据上创建多个模型，通常是决策树。基于树的梯度提升机本质上是一种 boosting 算法，它按顺序创建一系列分类或回归树。boosting\
  \ 在每次迭代中添加新的决策树到集合中。在每次特定迭代时，新的弱模型（base-learner）会基于已训练至今的整体集合的错误进行训练。\n\n梯度提升模型通过最小化指定的损失函数（如平均平方误差）来提升其预测。第一步创建一个基准树。随后的每棵树都拟合前一棵树的残差，并最小化损失函数。该过程重复指定的次数。最终模型是一个单一函数，它是一系列树的聚合，可用于预测新观测的目标值。\n\
  \n允许树木从训练数据子样本中贪婪地构建，是集成方法（bagging）和森林模型的重大突破。这一优势也可以用于在梯度提升模型中降低树序之间的相关性。随机梯度提升（Stochastic\
  \ gradient boosting）是此类提升的名称。\n\n随机梯度提升指的是基于数据子样本训练每棵新树。这通常会导致更好的模型。对于梯度提升模型，每个新观测会经过一系列为预测该观测目标值而创建的树进行输入。\n\
  \nFigure 8.1: Stochastic Gradient Boosting\n\n![image](img/f0258-01.jpg)\n\n梯度提升的关键组件\n\
  \n梯度提升通常包含四个 imperative（强制性）组件，如 Figure 8.2 所示。第一，一个弱模型用于做出预测（例如，决策树模型）。第二，一个损失函数用于衡量观测目标与预测目标值之间的差异（例如，平均平方误差）。第三，一个数值优化方法用于优化损失函数（例如，梯度下降）。第四，一个加\
  \ itive ensemble 模型用于叠加多个弱模型（例如，boosting 算法）。梯度提升的名称来源于后两个元素——梯度下降和提升。\n\n接下来将分别讨论这四个组件及其在\
  \ SAS Viya 中的相关属性。\n\nFigure 8.2: Components of a Gradient Boosting Model\n\n![image](img/f0258-02.jpg)\n\
  \n弱模型（Weak Learner Model）\n\n boosting 的核心思想是每个连续模型构建一个简单的弱模型，以改进剩余错误。弱模型是其错误率略高于随机猜测的模型。梯度提升几乎总是使用决策树作为弱模型，因为在许多实际应用中，小树和树桩（一种只有一个分割的特殊决策树，即只有两个端点的树）能够提供相当准确的结果（Wenxin\
  \ 2002）。\n\n每一次迭代中，每棵树都被视为弱模型，并在后续迭代中得到改进。许多弱模型组合在一起形成强预测模型。关于决策树，浅树（仅有 1 到 6 个分割）被视为弱模型。常见的做法是通过限制分支数、最大深度、叶子大小等方式对弱模型进行约束。\n\
  \n树分割选项（You Already Know）\n\n你已经熟悉个别树（作为梯度提升中的弱模型）的分割选项，这些在 Chapter 3 中已有讨论。以下是在此梯度提升语境下的快速回顾。\n\
  \n树结构和复杂度\n\nSAS Viya 中的梯度提升提供了如 Figure 8.3 所示的选项，用于控制弱模型（决策树）的结构和复杂度。\n\n- **Maximum\
  \ number of branches**（最大分支数）：指定在训练节点分割时可考虑的最大分支数。取值范围 2~5，默认值为 2。\n- **Maximum\
  \ depth**（最大深度）：指定节点生成的最大代数层数。原始节点为第 0 代（根节点），其子节点为第 1 代。取值范围 1~50，默认值为 4。\n\nMinimum\
  \ leaf size（最小叶子大小）指定一个叶子能容纳的最小训练观测数。默认值为 5。\n\n缺失值（Missing Values）\n\n树基模型会使用包含缺失输入值的观测。如果目标变量缺失，该观测会被排除在训练和评估之外。SAS\
  \ Viya 的梯度提升在处理缺失值方面提供的策略与森林模型几乎相同。Figure 8.4 展示了可用的选项。\n\n- **Missing values**（缺失值处理）：指定在输入变量缺失时的操作。可选值为\
  \ Ignore（忽略）、Use as machine smallest（使用机器最小值）或 Use in search（在搜索中使用）。默认值为 Use in\
  \ search。\n- **Minimum missing use in search**（在搜索中使用缺失值的阈值）：指定在分裂搜索中使用缺失值的阈值。默认值为\
  \ 1。\n\n区间二分（Interval Binning）\n\n你已经熟悉树基模型中对区间变量的二分（binning）。Figure 8.5 展示了相关选项。\n\
  \n- **Number of interval bins**（区间 bins 数量）：决定对区间输入变量进行二分的 bin 数。bin 大小 = (最大值 -\
  \ 最小值) / Number of interval bins。默认值为 50。\n\nFigure 8.4: Missing Values Options\n\
  \n![image](img/f0260-01.jpg)\n\nFigure 8.5: Interval Binning Options\n\n![image](img/f0260-02.jpg)\n\
  \n区间二分方法（Interval bin method）指定用于二分区间输入变量的方法。选择 **Bucket** 表示根据最大值与最小值的差值将变量均匀划分为区间；选择\
  \ **Quantile** 表示将变量划分为约等量大小的组。默认值为 Quantile。\n\nNumber of Inputs for Split（划分时的输入变量数）\n\
  \n梯度提升在 SAS Viya 中通过对子样本数据进行划分，然后递归地对每个得到的片段进行划分，直到满足某些约束为止。划分过程会在每个节点独立选择若干候选输入变量，然后在所有选定变量上进行搜索，找到最佳的划分规则并将节点划分。关于划分时输入变量数的属性如\
  \ Figure 8.6 所示。\n\n\n\n\nThe split search seeks to maximize the reduction in the\
  \ gain for a nominal target and the reduction in variance of an interval target.\n\
  \nUse default number of inputs to consider per split specifies whether to use the\
  \ default number of inputs to consider per split. By default, this option is selected.\n\
  \nNumber of inputs to consider per split specifies the number of input variables\
  \ randomly sampled to use per split. This option is not available if Use default\
  \ number of inputs to consider per split is selected. The default value is 100.\n\
  \nLoss Function\n\nLoss function measures the difference between the observed target\
  \ and the predicted value of the target. Loss function is a method of evaluating\
  \ how well your algorithm models your data set. If your predictions are totally\
  \ off, obviously, the loss function will result in a higher number. If they’re pretty\
  \ good, it will yield a lower number. The objective is to minimize this loss function\
  \ in every iteration of the gradient boosting model.\n\nThe loss function used depends\
  \ on the type of target. The gradient boosting in SAS Viya uses one of the following\
  \ three loss functions:\n\n*   For the continuous target, the loss function is the\
  \ L2 loss, also known as squared error loss, which is the sum of all the squared\
  \ differences between the true value and the predicted value.\n\n*   For the binary\
  \ target, the loss function is the logistic loss.\n\n*   For the nominal target,\
  \ the loss function is the multiclass logistic loss.\n\nFigure 8.6: Number of Inputs\
  \ Options\n\n![image](img/f0261-01.jpg)\n\nYou do not have a choice of changing\
  \ them, and it is not required either.\n\nNumerical Optimization Method\n\nThe whole\
  \ point of gradient boosting is to find the function that best approximates the\
  \ data, and therefore, it is primarily an optimization problem. Here the objective\
  \ is to minimize the cost function, which is the average of the loss functions for\
  \ all the training examples represented in Figure 8.7.\n\nA cost function (or the\
  \ loss function) evaluates the performance of your model. The loss function computes\
  \ the error for a single training example, and the cost function is the average\
  \ of the loss functions for all the training examples. Henceforth, these terms will\
  \ be used interchangeably in the book.\n\nA tree ensemble that seeks to predict\
  \ an observed target, yi, by using the input, xi, can be written as\n\n${\\\\hat{y}}\\\
  _{i} = F\\\\left( x\\_{i} \\\\right) = {\\\\sum\\_{m = 1}^{M}{f\\_{m}(x\\_{i})}}$\n\
  \nwhere fm is the functional representation of the mth tree.\n\nThe Gradient Boosting\
  \ node (or GRADBOOST procedure) seeks to minimize the regularized objective function\
  \ shown above where l(ŷi, yi) is the loss function that measures the difference\
  \ between the observed target, yi, and the predicted value of the target, ŷi.\n\n\
  You use gradient descent to update the parameters of your model. The concept of\
  \ gradients is more general and useful than the concept of residuals. This enables\
  \ you to consider other loss functions and derive the corresponding algorithms in\
  \ the same way.\n\nFigure 8.7: Objective Function in Gradient Boosting\n\n![image](img/f0262-01.jpg)\n\
  \nGradient Descent\n\nGradient descent is one of the most generic optimization algorithms\
  \ capable of finding optimal solutions to a wide range of problems. The general\
  \ idea of gradient descent is to modify parameters iteratively in order to minimize\
  \ a cost function. It measures the local gradient of the error function with regard\
  \ to the parameter vector ϑ, and it goes in the direction of descending gradient.\
  \ Once the gradient is zero, you have reached a minimum! You start by filling ϑ\
  \ with random values (this is called random initialization), and then you improve\
  \ it gradually, taking one baby step at a time, each step attempting to decrease\
  \ the cost function, until the algorithm converges to a minimum.\n\nThe gradient\
  \ descent optimization method minimizes a cost function by iteratively moving in\
  \ the direction of steepest descent as defined by the negative of the gradient.\
  \ This is graphically illustrated in Figure 8.8.\n\nGradient means steepness of\
  \ a slope (incline or decline) that is commonly measured as a ratio of the vertical\
  \ distance to the actual distance along the slope, that is, sine of the slope angle\
  \ or a ratio of the vertical distance (elevation) to the horizontal distance, that\
  \ is, tangent of the slope angle. One of the most trivial examples includes steepness\
  \ of a straight line, and therefore, in a simple linear regression case, slope of\
  \ the line is going to be the gradient. Gradient boosting essentially involves minimizing\
  \ some loss function such as a squared error loss function. This is directly related\
  \ to gradient descent, which is an optimization method for minimizing an objective\
  \ function that is written as a sum of differentiable functions. Gradient descent\
  \ is based on the observation that if the multi-variable function F(xij) is defined\
  \ and differentiable in a neighborhood of a point a, then F(xij) decreases fastest\
  \ if one goes from a in the direction of the negative gradient of F at (a, – ∇F(a)).\n\
  \nSuppose we have a loss function L(yi,F(xij)) = (yi – F(xij))2/2 that you want\
  \ to minimize. Because F(xij) are only some numbers, we can treat F(xij) as parameters\
  \ and take derivatives:\n\n$\\\\frac{\\\\partial J}{\\\\partial F\\\\left( x\\_{ij}\
  \ \\\\right)} = \\\\frac{\\\\partial{\\\\sum\\_{i}{L\\\\left( {y\\_{i},F\\\\left(\
  \ x\\_{ij} \\\\right)} \\\\right)}}}{\\\\partial F\\\\left( x\\_{ij} \\\\right)}\
  \ = \\\\frac{\\\\partial L\\\\left( {y\\_{i},F\\\\left( x\\_{ij} \\\\right)} \\\\\
  right)}{\\\\partial F\\\\left( x\\_{ij} \\\\right)} = F\\\\left( x\\_{ij} \\\\right)\
  \ - y\\_{i}$\n\nFigure 8.8: Gradient Descent Illustrated\n\n![image](img/f0263-01.jpg)\n\
  \nTo find a local minimum of a function using gradient descent, one takes steps\
  \ proportional to the negative of the gradient (or of the approximate gradient)\
  \ of the function at the current point.\n\n$y\\_{i} - F\\\\left( x\\_{ij} \\\\right)\
  \ = - \\\\frac{\\\\partial J}{\\\\left. \\\\partial \\\\middle| F\\\\left( x\\_{ij}\
  \ \\\\right) \\\\right.}.$\n\nIf G(xij) is an additional model that is added to\
  \ compensate the shortcoming of the existing model, then\n\n$\\\\begin{array}{lll}\
  \ {F\\\\left( x\\_{ij} \\\\right):} & = & {F\\\\left( x\\_{ij} \\\\right) + G\\\\\
  left( x\\_{ij} \\\\right)} \\\\\\\\ & = & {F\\\\left( x\\_{ij} \\\\right) + y\\\
  _{i} - F\\\\left( x\\_{ij} \\\\right)} \\\\\\\\ & = & {F\\\\left( x\\_{ij} \\\\\
  right) - 1\\\\frac{\\\\partial J}{\\\\partial F\\\\left( x\\_{ij} \\\\right)}} \\\
  \\\\\\ \\\\end{array}$\n\nTherefore, residuals can be interpreted as negative gradients.\n\
  \n$\\\\theta\\_{i}: = \\\\theta\\_{i} - \\\\rho\\\\frac{\\\\partial J}{\\\\partial\\\
  \\theta\\_{i}}$\n\nA gradient is a vector pointing at the greatest increase of a\
  \ function, and a negative gradient is a vector pointing at the greatest decrease\
  \ of a function. Therefore, we can minimize a function by iteratively moving a little\
  \ bit in the direction of negative gradient.\n\nGradient Descent Characteristics\n\
  \nBecause gradient is a vector, it has characteristics like direction and magnitude.\
  \ If you compute the derivative of a function, you know in which direction to proceed\
  \ to minimize it. The gradient always points in the direction of steepest increase\
  \ in the cost. The gradient descent algorithm takes a step in the direction of the\
  \ negative gradient in order to rapidly reduce the loss. These features and associated\
  \ properties are represented in Figure 8.9.\n\nFigure 8.9: Optimization Properties\n\
  \n![image](img/f0264-01.jpg)\n\nTo determine the next point along the cost function\
  \ curve, the gradient descent algorithm adds some fraction of the gradient’s magnitude\
  \ to the starting point and then repeats this process, edging ever closer to the\
  \ minimum. The size of these steps is called the learning rate.\n\nLearning rate\
  \ specifies the step size for gradient descent optimization. The default value is\
  \ 0.1.\n\n\n\n学习率控制每棵树对结果的贡献，并决定算法在梯度下降（学习）时的进度快慢。该超参数也称为收缩率。\n\n如果学习率过小（左图），则算法需要进行大量迭代才能收敛。你可以自信地沿负梯度方向移动，因为你频繁地重新计算它。学习率低更精确，但计算梯度耗时，因此到达最低点会耗时较长。（参见\
  \ Figure 8.10 左侧的图）\n\n相反，如果学习率过高（右图），你可能会跨过谷底，落在另一侧，甚至比之前更高。这可能导致算法发散，数值变大，无法找到良好解。每一步走得更远，但因为坡度不断变化，你有可能跳过最低点。（参见\
  \ Figure 8.10 右侧的图）\n\n# Additive Ensemble Model\n\n梯度下降用于最小化一组参数，例如回归方程中的系数或神经网络中的权重。计算误差或损失后，权重会被更新以最小化该误差。这里的参数是弱学习者决策树。计算损失后，为了执行梯度下降，算法会向集成模型中添加一棵树，以降低损失。这通过参数化树并修改其参数、沿正确方向（即沿梯度）进行实现，这种方法称为功能梯度下降或带函数的梯度下降。\n\
  \nFigure 8.10: Learning Rate\n\n![image](img/f0265-01.jpg)\n\nFigure 8.11: Boosting\n\
  \n![image](img/f0266-01.jpg)\n\n梯度提升算法是一种加 itive ensemble model，它会添加多个弱学习者。它是 (β1...βM)\
  \ 的加权线性组合，通常由简单的决策树 (T1...TM) 组成（Friedman 2001）。如 Figure 8.11 所示。\n\nSAS Viya 中的\
  \ Gradient Boosting 节点（或 GRADBOOST 过程）会创建一系列树，它们共同构成一个单一的预测模型。树会逐一添加，已有的树不会被修改。每棵树使用数据的子样本。树的序列及其对后续树的影响在\
  \ Hastie, Tibshirani, and Friedman (2001)、Friedman (2001)以及 Chen and Guestrin (2016)中讨论。\n\
  \nGradient Boosting 节点运行随机梯度提升，类似于标准提升，但每次迭代的目标是前一个决策树模型的残差。残差定义为损失函数的导数。使用梯度下降程序在添加树时最小化损失。每次使用数据生长树时，会计算树的准确性。后续样本会根据前一模型的准确性进行调整，每个后续样本的权重由前一模型的准确性决定。\n\
  \n从初始 guess F0 开始，按阶段方式依次拟合后续的 (m) 棵树模型，拟合“伪”残差 (ŷim)。残差由目标值 (yi) 与上一迭代预测 (Fm‑1(xi))\
  \ 计算得出。函数 Fm(x) 通过在 Fm‑1(x) 上加入拟合模型 vβmTm(x) 来更新。\n\n收缩参数 v(0<v<1) 控制算法的学习率。Friedman\
  \ (2001) 发现，小值（≤0.1）有助于更好地推广。\n\n在回归树（目标为区间）且使用最小平方损失的情况下，“伪”残差 ŷim 与初始 guess F0\
  \ 定义如下：\n\nŷim = yi−Fm‑1(xi)\n\nF0 = ŷ\n\n在二分类树（目标 y ∈ {–1,1}）且使用二项对数似然损失的情况下，“伪”残差和\
  \ F0 定义如下：\n\nŷim = 2yi/(1 + exp(2yiFm‑1(xi)))\n\n$F\\_{0} = \\\\frac{1}{2}log(\\\
  \\frac{1 + \\\\overline{y}}{1 - \\\\overline{y}}).$\n\n对 Boston housing 数据集（目标为区间，MEDV）拟合的梯度提升树示例在\
  \ Figure 8.12 中给出。这里迭代次数为两（M=2），最大树深度为一。模型由两棵决策树（T1 和 T2）组成，每棵树有两个叶节点。22.275 是数据的均值\
  \ MEDV（F0），P\\_MEDV 为预测值。例如，LSTAT=6 且 RM=5 的观测值，其 P\\_MEDV 为 22.275 + 0.95 – 0.17。\n\
  \n# Perturbing and Combining Boosted Trees\n\n在梯度提升模型中扰动和组合树时，有两个重要特征：树的总数量以及通过随机化样本来避免陷入损失函数梯度的局部极小值或平坦区。这些特征及其属性在\
  \ Figure 8.13 中表示。\n\n梯度提升通常需要大量树。与随机森林不同，梯度提升容易过拟合，因此目标是找到能最小化损失函数的最优树数量。\n\nFigure\
  \ 8.12: Simple Example of Gradient Boosting\n\n![image](img/f0267-01.jpg)\n\nFigure\
  \ 8.13: Perturb and Combine Properties\n\n![image](img/f0268-01.jpg)\n\n树的数量属性指定了提升系列中的迭代次数。对于区间和二元目标，迭代次数等于树的数量；对于名义目标，每个迭代会为每个目标类别创建一个单独的树。默认值为\
  \ 100。\n\n子采样（Subsampling）主要提高模型的泛化性能，同时降低计算开销（Sutton 2005）。其思想是引入随机性到学习过程。每次迭代只使用一部分随机抽取的训练数据来拟合弱学习者决策树。训练数据在抽样时不放回，你可以指定随机抽样的比例。\n\
  \n子采样率属性指定用于训练单棵树的训练观测比例。每个迭代使用不同的训练样本。同一迭代中训练的树使用相同的训练数据。默认值为 0.5。\n\n子采样的另一个优势是，它自然适应大数据集，无需一次性使用所有可能巨大的数据量。\n\
  \n为了演示梯度提升，Natekin and Knoll (2013) 使用了人工生成的数据集。该数据集来源于 sinc(x) 函数，并加入了两种人工模拟噪声：高斯噪声\
  \ ε ~ N(0, σ2) 和冲击性噪声 ξ ~ Bern(p)。实验中使用了 L2 损失。输入维度为 1，因此选择了树桩（tree‑stumps）。得到的拟合模型在\
  \ Figure 8.14 中展示。为展示拟合过程的进展，迭代次数 nTrees 被从 1 变化到 500。随着 nTrees 增加，连续改进的准确性表现出相似的趋势。然而，迭代次数过多容易导致模型过拟合。\n\
  \nFigure 8.14: Different Number of Boosts\n\n![image](img/f0268-02.jpg)\n\nImage\
  \ source:  \n\nNatekin and Knoll (2013). Gradient boosting machines, a tutorial.\
  \ Front. Neurorobot. 7:21. doi: 10.3389/fnbot.2013.00021\n\n# Avoiding Overfitting\
  \ in Gradient Boosting\n\n\n\n\n-   关于构建像梯度提升（gradient boosting）这样的机器学习模型，最重要的顾虑之一是模型的泛化能力。你可以轻易想象一种情况，即在集合中不断添加新的弱学习者树，直到数据被完全过拟合。\n\
  \n-   梯度提升具有许多超参数，它们的用途会有所重叠。树的复杂度可以通过最大深度、最小叶子大小或最大分支数来控制。这些参数的任何组合可能都是某些问题的最优解。过拟合也可以通过学习率与树的数量（以及早停）之间的权衡、抽样率以及各种正则化惩罚来应对。\n\
  \n-   这些不同的方法都有助于约束拟合过程，从而平衡模型的预测性能（Sutton 2005，Zhang and Yu 2005，Zou and Hastie\
  \ 2005）。\n\n-   正则化和早停是 SAS Viya 中两种重要的后剪枝方法，如图 8.15（Figure 8.15）所示。\n\n-   正则化限制了树叶权重（或影响）在树中的极端程度。\n\
  \n-   另一种对梯度提升过拟合的对策是早停，它会在验证数据上某个误差指标满足时停止梯度提升过程。早停的另一个优势是，当满足停止条件时，训练时间会显著缩短，而不必等到达到预设的最大迭代次数。\n\
  \n```\nFigure 8.15: Post‑Pruning Ways to Avoid Overfitting\n```\n\n![image](img/f0269-01.jpg)\n\
  \n-   正则化实际上是通过对树叶得分进行正则化来间接降低树的深度，而不是像回归模型那样直接对特征进行正则化。因此，它倾向于削弱那些对预测贡献较小的特征，但效果不如在回归模型中直接删除特征那么显著。\n\
  \n-   客观函数中的 Ω(fₘ) 是正则化项，它对模型复杂度起惩罚作用。衰减参数 Ω 可取 0 ~ 1 之间，控制惩罚项的相对重要性。正则化项及其属性如图 8.16（Figure 8.16）所示。\n\
  \n-   可以指定两个正则化参数。L1 正则化与 L2 正则化类似，两者都会对目标函数中大的集合权重进行惩罚。不同之处在于，L2 正则化的惩罚量随权重大小线性变化，而\
  \ L1 的惩罚量相对固定，与权重的变化无关。这意味着在权重较大时，L2 会比 L1 更强烈地惩罚大权重；而在权重较小时，L2 的惩罚力度则小于 L1。\n\n\
  -   L1 正则化参数通过 GRADBOOST 过程的 LASSO= 选项指定，默认值为 0。\n\n-   L2 正则化参数通过 GRADBOOST 过程的\
  \ RIDGE= 选项指定，默认值为 1。\n\n-   早停（Early Stopping）利用了提升是迭代过程的事实，即可以在每一次迭代后用验证数据测量预测误差。当验证数据上的误差达到指定阈值时，梯度提升过程会停止，从而得到一个相对不过拟合的模型。若没有验证数据，早停通常无效。\n\
  \n-   误差度量分别为均方误差（区间目标）、误分类率（二元目标）和对数损失（名义目标）。误差在验证数据上计算。\n\n```\nFigure 8.17: Early\
  \ Stopping and Related Options\n```\n\n![image](img/f0271-01.jpg)\n\n-   “Perform\
  \ Early Stopping” 属性决定是否在模型开始过拟合时停止训练。Gradient Boosting 节点（或 GRADBOOST 过程）使用两种早停方法：\n\
  \n  1. **停滞（Stagnation）方法**：在连续迭代之间的验证误差相对变化满足停滞、容差（Tolerance）和从最小误差（Start from\
  \ minimum error）属性设定的条件时停止。\n\n  2. **阈值（Threshold）方法**：在验证误差超过基于阈值（Threshold）和阈值迭代（Threshold\
  \ iterations）属性设定的阈值时停止。\n\n-   当连续 N 次迭代的相对误差小于阈值 Tolerance 时，训练停止。若没有验证数据分区，早停无法使用。默认情况下，此选项被选中。可用的选项包括：\n\
  \n  - **Early stopping method**：指定使用哪种早停方法。\n\n  - **Stagnation**：表示用于停滞方法的连续迭代次数 N，默认值为\
  \ 5。\n\n  - **Tolerance**：表示停滞方法中验证误差的相对变化阈值，默认值为 0。\n\n  - **Start from minimum\
  \ error**：指示在停滞方法中是否从验证误差最小的迭代开始计数。\n\n  - **Threshold**：指定阈值方法的误差阈值，误差等于或超过该值时训练停止。\n\
  \n  - **Threshold iterations**：指定在比较验证误差之前必须运行的最小训练迭代次数。\n\n| 早停不会在没有验证分区时进行。启用早停且存在验证分区时，若选择自动调整树的数量，则不会进行自动调整。\
