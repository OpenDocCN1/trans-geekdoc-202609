  \nQuiz\n\n1. 关于决策树的以下说法哪项是正确的？\n\na. 通过应用一系列简单规则划分数据，因此它是一个无监督技术\n\nb. 可以用于分类观测，但不能用于估计响应\n\
  \nc. 一个类似流程图的结构，内部节点表示对输入的测试，每条支路代表测试的结果，每个叶节点表示类标签或区间估计\n\nd. 以上全部\n\nAnswers\n\
  \n| 1. c |\n\n\n\n一个简单的算法首先将整个数据集，根节点，分成至少两个节点。每个节点随后被分成更多节点，以此类推。每个节点随后被单独考虑。查找分割的过程不考虑其他节点如何分割。这个过程被称为递归分区，大多数树算法都使用它。\n\
  \n该算法将父节点分割成两个或多个子节点，使得响应变量在每个子区域中的值（或水平）尽可能相似。分割过程随后对每个子节点重复，递归继续，直到满足停止标准为止。此时，树已完全构建（生长）。在每一步中，分割是通过在父节点分割到的子节点中找到最佳预测变量和最佳分割值来优化响应变量的指定标准来确定的。\n\
  \n递归分区是近视的（Neville 1999）。它专注于优化单个分割，而不关注整个树的质量。虽然非递归分区的替代方法尚未流行，但它们实现困难且运行时间较长。此外，递归分区通常已经能提供足够的结果。\n\
  \n图 3.1：递归分区过程\n\n![image](img/f0059-01.jpg)\n\n递归分区包含三个主要组成部分：\n\n*   选择分割测试（分割搜索）的方法\n\
  \n*   确定树节点何时为终端（停止规则）的规则\n\n*   为每个终端节点分配值的规则（分割规则）\n\n我们将在本章后面讨论这些组成部分。\n\n根节点分割与一层空间\n\
  \n递归分区是一种自上而下、贪婪的算法。从根节点开始，会检查几个涉及单一输入的分割。对于区间输入，分割是输入值的不相交范围；对于名义输入，分割是输入类别的不相交子集。可以使用多种分割搜索策略来确定候选分割集合。分割标准用于选择分割，该标准衡量目标分布在子节点中的变异性减少量。目标是减少变异，从而增加子节点的纯净度。根节点中的案例随后根据选定的分割进行划分。\n\
  \n贪婪算法在每一步都做出局部最优选择。图 3.2（[Chapter03.xhtml#ch03fig02]）展示了前一章中所示的分类树的根节点。分析目标是预测手写数字是否为\
  \ 1、7 或 9。\n\n根节点表示每个数字的案例数量。从根节点开始，递归分区使用迭代过程选择节点的最佳分割。这个过程称为分割搜索。首先，递归分区根据分割标准为每个输入变量找出所有可能分割中最佳的分割。这些是候选分割。随后选择整体最佳分割（即基于单一输入的分割）。该分割表示为\
  \ IF-THEN-ELSE 规则。根节点中的案例随后根据选定的分割进行划分。在这棵树中，最优分割是：当 X1 小于 38.5 时向左分支，当 X1 大于或等于\
  \ 38.5 时向右分支。根节点中的 1064 个观测值被划分，其中 698 个遵循左分支规则，366 个遵循右分支规则。\n\n图 3.2：根节点分割在手写数字识别示例中\n\
  \n![image](img/f0060-01.jpg)\n\n图 3.3：一层空间在手写数字识别示例中\n\n![image](img/f0061-01.jpg)\n\
  \n根节点分割对应于输入空间的一个分区，其边界垂直于图 3.3（[Chapter03.xhtml#ch03fig03]）中所示的一个输入维度。\n\n深度为二和两层空间\n\
  \n分割过程在每个子节点中重复，如同该节点是新树的根节点一样。节点的分割完全取决于该局部输入空间中的案例。随着分割搜索向更深的树层深入，数据变得更加碎片化。分割标准和其他停止规则决定过程的结束以及最终树的深度。\n\
  \n在第二次分割搜索迭代后，生成的树深度为二，即两层空间。结果分割如图 3.4（[Chapter03.xhtml#ch03fig04]）所示。\n\n这个节点分割对应于输入空间的一个分区，其边界垂直于图\
  \ 3.5（[Chapter03.xhtml#ch03fig05]）中所示的另一个输入维度。\n\n过程重复进行。深度由停止规则控制，这些规则在第 5 章中讨论。\n\
  \n递归分区本质上是一种简单的非参数方法，用于分类和回归任务。预测技术是非参数的，因为它不依赖于目标变量与输入之间的依赖关系的任何特定假设。当以标准方式使用时，递归分区提供了树形结构，展示了从输入到预测所需遵循的规则序列。这种简单的可视化解释了该方法在许多学科中的吸引力。\n\
  \n图 3.4：深度为二的分割在手写数字识别示例中\n\n![image](img/f0062-01.jpg)\n\n递归分区的替代方案\n\n直观地认为，这种贪婪算法可以通过引入某种前瞻或回溯来得到改进。除了计算负担外，使用有限前瞻的树木并未显示出改进。在许多情况下，它们产生劣质树木（Murthy\
  \ and Salzberg 1995）。\n\n另一种变体是斜向分割。标准决策树使用与输入坐标平行的边界进行分割，如图 3.6（[Chapter03.xhtml#ch03fig06]）所示，该图展示了递归分区停止前发生的所有分割。这些基于坐标轴的分割使决策树易于解释，并能抵御维度诅咒。\n\
  \n图 3.5：两层空间在手写数字识别示例中\n\n![image](img/f0062-02.jpg)\n\n图 3.6：与输入坐标平行的决策边界\n\n斜向分割使用输入的线性组合来创建边界。已开发出多种算法用于诱导斜向决策树（BFOS\
  \ 1984，Murthy et al 1994，Loh and Shih 1997）。斜向决策树不被 SAS Viya 支持，且缺乏强有力的证据表明该方法始终能产生更强的模型。\n\
  \n交互式构建决策树\n\nSAS Visual Statistics 中的 Decision Tree 对象允许您基于名义、有序和连续变量对数据库进行多路分割。该对象支持自动和交互式训练。运行\
  \ Decision Tree 对象的自动模式时，它会自动对输入变量根据其对树的贡献强度进行排名。此排名可用于选择后续建模的变量。您可以覆盖任何自动步骤，并显式剪枝子树。交互式训练使您在开发树木时能够探索和评估大量树木。\n\
  \n![image](img/Demo.jpg) 图 3.1：在 SAS Visual Statistics 中交互式构建回归树\n\n此演示使用波士顿住房数据，通过\
  \ SAS Visual Analytics 界面交互创建回归树模型，并基于前一份演示中的 Housing_RegTree 报告。\n\n1\\. 前往左上角的\
  \ Applications 菜单（![image](img/Line.jpg)）。\n\n\n\n\n2\\. 单击应用快捷方式区域中的 `Explore`\
  \ 和 `Visualize`。SAS Visual Analytics 窗口出现。\n\n3\\. 从左侧窗格中选择 `My Folder`。\n\n4\\\
  . 双击 `Housing_RegTree` 报表砖块以打开它。\n\n![image](img/f0064-01.jpg)\n\n5\\. 确保 `RegTree`\
  \ 页面已打开。右键单击画布并选择 `Enter interactive mode`。\n\n**Note:** 你可以通过右键单击节点，直接在 `Tree`\
  \ 窗口中对决策树进行修改。\n\n![image](img/f0064-02.jpg)\n\n观察 ASE 为 `13.2237`。我们将尝试改进它。可以通过进入交互模式，手动训练和剪枝节点来进行修改。进入交互模式后，增长属性被锁定。对预测器的某些修改是允许的，例如将度量转换为类别。当你在交互模式下修改预测器时，决策树仍保持交互模式，但使用相同的规则尝试重新生成分割和剪枝。\n\
  \n6\\. 请记住默认叶节点大小为 `5`，即叶节点（终端节点）至少需要五条观测。因此，选择足够大的叶节点，例如在最大深度的叶节点中最右侧的第一片叶子。右键单击并选择\
  \ `Split best` 从节点。\n\n![image](img/f0065-01.jpg)\n\n`Split best` 从节点选项根据信息增益比最佳的变量对节点进行拆分。\n\
  \n![image](img/f0065-02.jpg)\n\n7\\. 现在选择另一个更大的叶节点，例如在最大深度的叶节点中最左侧的第一片叶子。右键单击并选择\
  \ `Split` 从节点。\n\n![image](img/f0066-01.jpg)\n\n`Split` 从节点选项打开拆分节点窗口。你可以选择用于拆分节点的变量。\n\
  \n8\\. 选择 `Age` 然后点击 `OK`。\n\n![image](img/f0066-02.jpg)\n\n变量按它们的 `logworth`（logworth\
  \ 表示变量将数据划分得多好）降序排列。`NOX` 的 `logworth` 最高。不过，你可能有强有力的业务原因选择 `AGE`。\n\n手动训练的决策树已在画布上构建并可用。\n\
  \n![image](img/f0067-01.jpg)\n\n观察决策树两侧的手动修改的分割。ASE 从 `13.2237` 降至 `12.7290`。这已是一个好兆头！你可以进一步尝试修改该树。\n\
  \n但在使用与模型拟合时相同的数据对模型进行评估通常会导致乐观偏差（overfitting）。最简单的纠正乐观偏差的策略是使用保留样本（holdout sample）进行经验验证，或进行交叉验证（cross\
  \ validation）。本例中的交叉验证在章节 5 中演示。\n\n9\\. 虽然我们在第 5 章讨论剪枝，但请选择根节点，右键单击，然后选择 `Prune`\
  \ 到节点。\n\n![image](img/f0067-02.jpg)\n\n`Prune` 到节点选项删除选定节点下的所有子节点，并将该节点转换为叶节点。\n\
  \n10\\. 选择根节点，右键单击，然后选择 `Train` 从节点。\n\n![image](img/f0068-01.jpg)\n\n`Train` 从节点选项在叶节点（此例为根节点，因为树已剪枝至根节点）以上训练多于一层。该节点的变量仍按\
  \ `logworth` 降序排列。\n\n11\\. `Train` 节点窗口默认显示所有变量。取消选中列表中最后四个变量，使仅考虑前六个 `logworth`\
  \ 最高的变量用于分割。将子树的 `Maximum depth` 从 `6` 增加到 `10`，然后点击 `OK`。\n\n![image](img/f0068-02.jpg)\n\
  \n显然，会创建更深的树。\n\n![image](img/f0069-01.jpg)\n\nASE 进一步降至 `11.6002`。\n\n树是通过将源数据（根节点）划分为子集（子节点）形成的，拆分依据分类特征的规则（Shai\
  \ and Shai 2014）。该过程在每个派生子集上递归进行。递归在以下两种情况下结束：节点子集的目标变量值全部相同，或进一步拆分不再增加预测价值。上述自上而下的决策树构建过程（Quinlan\
  \ 1986）是一种贪心算法，它在每个节点上通过做出局部最优选择来实现全局近似最优解。通过这些局部最优选择，最终达到了近似全局最优解。\n\n12\\. 在不退出交互模式的情况下，点击\
  \ `Create Pipeline` 并选择 `Add to existing project`。\n\n![image](img/f0069-02.jpg)\n\
  \n**Note:** 要退出交互模式，右键单击 `Tree` 窗口并选择 `Exit interactive mode`。退出交互模式后，你将失去所有更改。\n\
  \n13\\. 在 Model Studio 中选择 `Housing_RegTree` 项目，然后选择 `Add pipeline`。\n\n14\\. 一个新管道被添加，自动命名为\
  \ `Interactive-Model Pipeline`。点击 `Run Pipeline` 按钮。\n\n![image](img/f0070-01.jpg)\n\
  \n15\\. 点击 `Pipeline Comparison` 标签以比较两棵回归树。勾选两棵树的复选框，然后点击 `Compare` 按钮。\n\n![image](img/f0070-02.jpg)\n\
  \n交互式创建的回归树似乎优于另一棵回归树。但它可能是过拟合模型。你可以修改属性并重新训练该树以进一步改进。\n\n16\\. 关闭 `Compare` 窗口。\n\
  \n17\\. 返回 `Pipelines` 标签页。\n\n![image](img/EndOfDemo.jpg)\n\n**Feature Selection\
  \ Using Split Search**\n\n在选择有用输入时，决策树使用分割搜索算法。决策树通过忽略无关输入来克服维度诅咒。\n\n| Curiously,\
  \ trees have no built-in method for ignoring redundant inputs. Because trees can\
  \ be trained quickly and have a simple structure, this is usually not an issue for\
  \ model creation. However, it can be an issue for model deployment, in that trees\
  \ might arbitrarily select from a set of correlated inputs. To avoid this problem,\
  \ you should use an algorithm that is external to the tree to manage input redundancy.\
  \ |\n| --- |\n| 很有趣的是，树没有内置方法来忽略冗余输入。由于树可以快速训练且结构简单，这在模型创建时通常不是问题。但在模型部署时可能会成为问题，因为树可能会随意从相关输入集合中选择。为了避免此问题，你应该使用一个位于树之外的算法来管理输入冗余。\
  \ |\n\n| 考虑一个简单的预测问题，如图 3.7 所示，包含两个输入 `x1` 和 `x2` 以及二元目标。 |\n| Figure 3.7: Simple\
  \ Prediction Illustration |\n| ![image](img/f0071-01.jpg) |\n| 输入 `x1` 和 `x2` 将案例定位在单位正方形中。目标结果以颜色表示；黄色为主要类别，蓝色为次要类别。分析目标是根据单位正方形中的位置预测结果。\
  \ |\n| 为了预测案例，决策树使用基于输入变量值的规则，如图 3.8 所示。 |\n| 规则以层次结构排列，形成树状结构，节点之间用线连接。节点代表决策规则，线条表示规则顺序。树的最底层（顶部）的第一条规则称为根节点。随后的规则称为内部节点。只有一条连接的节点称为叶节点。\
  \ |\n| Figure 3.8: Decision Tree Prediction Rules |\n| ![image](img/f0071-02.jpg)\
  \ |\n| 为评分新案例，检查其输入值并应用决策树中定义的规则。 |\n| 新案例的输入值最终会指向树中的单个叶节点，如图 3.9 所示。叶节点提供一个决策（例如，归类为黄色）以及一个估计（例如，主要目标的比例）。\
  \ |\n| 理解分割搜索算法有助于更好地使用 SAS Viya 中的决策树并解读结果。这里假设目标是二元的，但针对区间目标的算法类似。 |\n\n\n\n-\
  \   [分割搜索](https://example.org)首先选择用于分割训练数据的输入。如果所选输入的测量尺度是区间、分箱或聚类值，则这些值可作为潜在的分割点。如果输入是类别型的，则在每个类别输入水平内取目标值的平均值。这些平均值在随后讨论中充当分箱或聚类区间输入值的角色。\n\
  \n对于选定的输入和固定的分割点，会生成两个组。输入值小于分割点的情况称为“左分支”，输入值大于分割点的情况称为“右分支”。结合目标结果，这两个组构成如下 `Figure\
  \ 3.10` 所示的 2×2  contingency 表。列指示分支方向（左或右），行指示目标值（0 或 1）。\n\n基于根节点熵和每个分割分区的数据熵的信息增益统计量可以用来量化表格列中计数的分离程度。增益值越大，说明左分支中\
  \ 0 与 1 的比例与右分支不同。目标比例差异越大，说明分割效果越好。\n\n针对预测器的最佳分割是产生最高信息增益的那个分割。假设总共有 100 条观测，训练数据中黄色/蓝色呈\
  \ 50/50 划分。 additionally，左侧有 52 条观测，右侧有 48 条观测。基于此以及 `Figure 3.11` 中表格的数值，增益可计算如下：\n\
  \n```\nFigure 3.9: Scoring A New Case Using Decision Tree\n```\n\n![image](img/f0072-01.jpg)\n\
  \n![image](img/f0073-01.jpg)\n\n| Entropy Total || : || ‒ 0.5 × log2(0.5) ‒ 0.5\
  \ × log2(0.5) = 1 |\n\n| --- | --- | --- |\n\n| Entropy Left || : || ‒ 0.53 × log2(0.53)\
  \ ‒ 0.47 × log2(0.47) = 0.997 |\n\n| Entropy Right || : || ‒ 0.42 × log2(0.42) ‒\
  \ 0.58 × log2(0.58) = 0.98 |\n\n| Gain || : || 1 ‒ (52/100) × 0.997 ‒ (48/100) ×\
  \ 0.98 = 0.0112 |\n\n熵在本章后面会有更详细的讨论。\n\n分割过程会对训练数据中的每个输入重复进行。再次，输入的最佳分割是使增益函数达到最大值的那个，如\
  \ `Figure 3.12` 所示。\n\n![image](img/f0073-03.jpg)\n\n![image](img/f0074-01.jpg)\n\
  \nFigure 3.11: Selecting Partition with the Maximum Gain\n\n![image](img/f0074-02.jpg)\n\
  \nFigure 3.12: Selecting Partition with the Maximum Gain on Input X2\n\n![image](img/f0075-01.jpg)\n\
  \n确定每个输入的最佳分割后，树算法会比较每个最佳分割对应的增益。增益最高的分割被视为最佳。在此示例中，输入 x2 的最大增益（0.0273）大于输入 x1 的最大增益（0.0112），因此\
  \ x2 将用于分割，如 `Figure 3.13` 所示。\n\n最佳分割规则用于对数据进行分区。该过程在树的每个子集中重复，如 `Figures 3.14`\
  \ 到 `3.18` 所示。\n\n在每个新叶节点内，分割搜索会重复进行，增益统计量也如前述进行比较。\n\n得到的预测器变量空间的划分称为最大树。最大树的构建完全基于增益对数据的划分准则。SAS\
  \ Visual Data Mining and Machine Learning 提供多种划分准则。\n\n![image](img/f0074-02.jpg)\n\
  \n![image](img/f0075-01.jpg)\n\n![image](img/f0075-02.jpg)\n\n![image](img/f0075-03.jpg)\n\
  \n![image](img/f0076-01.jpg)\n\n![image](img/f0076-02.jpg)\n\n![image](img/f0076-03.jpg)\n\
  \n## 分割点\n\n分割搜索是决策树算法的第一部分。分割搜索首先选择用于划分训练数据的输入。潜在的分割点取决于所选输入的测量尺度。\n\n决策树对名义和有序测量尺度的输入进行划分时会有所不同。\n\
  \n### 对名义输入进行划分\n\n对名义输入的划分不受限制。对于具有 L 个不同水平的名义输入，会划分为 B 个分支，分支数为 S(L,B)，其中 S(L,B)\
  \ 为第二类斯特林数。总的分割数是 L 级数的贝尔数减 1，\n\n$\\\\begin{matrix} B\\_{L} & = & {\\\\sum\\\\\
  limits\\_{i = 0}^{L}{S(L,i).}} \\\\\\\\ \\\\end{matrix}$\n\n| 组合论中，第二类斯特林数是将 L 个对象划分为\
  \ B 个非空子集的方式数。$S(L,B) = \\\\frac{1}{B!}{\\\\sum\\\\limits\\_{j = 0}^{B}{( - 1)}^{j}}{\\\
  \\ \\\\left( \\\\begin{array}{l} B \\\\\\\\ j \\\\\\\\ \\\\end{array} \\\\right)}{(B\
  \ - j)}^{2}$ |\n\n| --- |\n\n图示了名义输入级数增加时分割数量的增长，如 `Figure 3.20` 所示。分割数计算公式为 S(L,B)\
  \ = B.S(L – 1,B)+S(L – 1,B – 1)。\n\n下图右侧展示了一个四级名义变量的示例及其可能的分割，在 `Figure 3.20` 中也有说明。总共有\
  \ 14 种可能的分割：七个两向分割、六个三向分割和一个四向分割。\n\n### 名义变量的编码方式\n\n在幕后，名义变量会被编码。对于给定的名义变量，首先使用格式化值进行唯一的连续索引映射，这一过程通常称为\
  \ levelization（例如，变量 C 包含 C1、C2、C3、C4，并被 levelized 为四个水平）。默认采用基于哈希的顺序，而不是字母顺序。因此，生成的映射可能如下：\n\
  \n| 格式化值 || 索引 |\n\n| --- | --- |\n\n| C1 || 1 |\n\n| C2 || 0 |\n\n| C3 || 3 |\n\
  \n| C4 || 2 |\n\nFigure 3.20: Number of Partitions Illustrated with Increasing Number\
  \ of Nominal Levels \n\n![image](img/f0078-01.jpg)\n\n数值未按顺序排列，因为 SAS Viya 通常使用决策树对高基数变量进行划分。排序会花费较高的计算成本。您无需关心排序，这些映射都是内部的。如果变量级数过多，排序可能导致不同的分割点。为了构建良好模型，建议对高基数变量进行预处理（合并水平数）。\n\
  \n如果二元目标变量 Y 仅包含 0 或 1，则必须将其加入名义列表以训练二元分类模型。由于水平未排序，内部索引可能如下：\n\n| Y 的格式化值 || 索引\
  \ |\n\n| --- | --- |\n\n| 0 || 1 |\n\n| 1 || 0 |\n\n您不应依赖任何内部索引，而应仅使用格式化值（例如，用于评估模型性能）。\n\
  \n### 对有序输入进行划分\n\n\n\n\n-   基于序数输入的分割受限于保持顺序。只对相邻值进行分组。随着序数输入的级别数增加，分区数量以示例图 3.21（章节 03.xhtml #ch03fig21）中的级别数递增而呈现。对于具有 L 个不同级别的序数输入，会产生 B 个分支的分区数为 $\\\
  \\left( \\\\begin{array}{l} {L - 1} \\\\\\\\ {B - 1} \\\\\\\\ \\\\end{array} \\\\\
  right) = \\\\frac{\\\\left( {L - 1} \\\\right)!}{\\\\left( {B - 1} \\\\right)!\\\
  \\left( {L - B} \\\\right)!}$。对单个序数输入，可能的分割组合数为 $\\\\sum\\_{l = 2}^{L}{\\\\left(\
  \ \\\\begin{array}{l} {L - 1} \\\\\\\\ {l - 1} \\\\\\\\ \\\\end{array} \\\\right)\
  \ = 2^{L - 1} - 1$。\n\nFigure 3.21: 使用递增序数级别数的分区数示意\n\n![image 序数变量的示例（四级）及其可能的分区在\
  \ Figure 3.21 右侧所示。总计有七种可能的分区：三种两分法、三种三分法以及一种四分法。### 关于区间输入的分割如果所选输入的测量尺度为区间尺度，则每个唯一值都可作为数据的潜在分割点。这是所谓的**穷尽搜索**（exhaustive\
  \ search）分割方法，如 Figure 3.22 所示。第一个表格展示了一个小数据集。假设 X 是区间变量，目标 Y 为二元（Yes/No）。需要收集的统计量是第二个表格中每个唯一的 X 与 Y 组合的交叉表计数。假设二分法（仅生成两个子树），则精确方法是枚举 X 所有可能的分组，并为每个组合计算分割收益。收益最大的组合胜出（后续章节讨论）。Figure 3.22:\
  \ 穷尽搜索示意![image](img/f0079-02.jpg)\n\n右侧展示了所有可能的分组。对于二分法，可能的组合总数为 (2n‑1 – 1)，其中 n 为 X 的不同取值数。在上述示例中，会有七种组合。穷尽搜索把区间变量视作名义变量，并在所有可能的分割点上搜索最优点。\n\
  \n在 SAS Viya 中，如果不希望使用贪心搜索，可采用基于 k‑means 聚类的分割搜索（后文讨论）。当输入变量的取值数小于 16 时使用穷尽搜索；取值数更大时，先对级别进行排序。在提升（boosting）中，级别按平均梯度排序；在其他情况下，级别按频率排序。梯度和频率仅取决于当前分裂节点的数据。\n\
  \n穷尽搜索算法会在树的每个节点对所有输入进行完整的分区枚举。当区间输入的不同取值数目增长迅速时，可能的组合数量呈指数级增长，导致穷尽搜索成本高昂，几乎无法找到全局最优的分割点（即产生最大分割收益的点）。常用的近似方法包括：\n\
  \n-   **排序**（ranking）  \n-   **分箱**（binning）  \n-   **k‑means 聚类**  \n-   **多路分割**（multi‑way\
  \ splits）\n\nSAS Viya 决策树采用一种复杂的分割搜索策略，根据所需的分支数量和变量的不同取值数来决定使用贪心搜索还是穷尽搜索。只要计算成本可接受，贪心和穷尽搜索都会被应用。此外，还有一种独特的 k‑means 聚类方法，用于在组合数量极大时将数值聚合为不同的组。SAS Viya 树的另一独特特性是支持**二分**以及**最多\
  \ 10 条分支**的任意分割。\n\n### 排名（Ranking）\n\n为了降低可能的分割点数量，常用的近似方法是假设变量值有一定顺序。例如，若 X 为数值型，可直接按升序排序，只进行 (n‑1) 种分区（如\
  \ Figure 3.23 所示），从而将组合数降至 O(n)。为更明显地观察数据模式并降低变异，还可在排序前对数值取自然对数。此方法同样适用于名义变量。\n\n\
  对于基于 Gini 和 entropy 的分裂标准（后文讨论）以及区间或序数输入，决策树的分割仅取决于级别的顺序，这使得模型对输入空间中的离群值具有鲁棒性。对区间变量应用排名或任何单调变换不会改变拟合的树结构。\n\
  \nFigure 3.23: 排名近似\n\n![image](img/f0081-01.jpg)\n\n然而，对于依赖 p‑value 的分裂标准（即 ProbChisq 和 ProbF ，见下文），单调变换的不变性不一定成立。为避免过于严重的 Bonferroni 校正，区间变量的取值可以进行分箱。变换可能影响分箱过程，进而影响分割选择。下文后续章节会讨论 Bonferroni 校正，它是多重统计检验校正方法，用于同时进行多个依赖或独立的统计检验。\n\
  \n### 分箱（Binning）\n\n当数值变量拥有数百万取值时，分割点的数量会导致计算成本高昂，尤其在数据分布在多个线程和 worker 之间时，收集所有统计量更是费时费力。因此需要进行近似。最流行的近似方法是**对数值变量进行分箱**，仅在每个箱中收集足够的统计量。分箱可采用**量位基**（quantile‑based）或**等宽度**（equal‑width）方法，如\
  \ Figure 3.24 所示。当数据高度偏斜时，量位基分箱更有帮助。箱数也是一个关键参数。\n\nFigure 3.24: 分箱近似\n\n![image](img/f0081-02.jpg)\n\
  \n随着箱数增加，通常能更准确地找到最优分割点，但计算时间也会相应增长。更多箱意味着需要更大的内存来存储交叉表计数，并且在多线程/多 worker 之间聚合最终统计时也需要更多时间。若数值变量和箱数都很大，内存需求可能轻易达到数百\
  \ GB。因此，箱数在**速度**与**精度**之间取得平衡。若某个数值变量只有少量不同取值，将其视为名义变量更合适，因为分箱会浪费大量内存。\n\n| 决策树在 SAS Viya 中对数值变量的分箱仅在训练数据的整体阶段进行一次，分箱信息（最小值、最大值）在后续将数据划分为不同树节点时不会更新。这可能导致决策树或随机森林的准确性出现问题。然而，提升（gradient\
  \ boosting）可以通过在每构建新树时更新目标信息来缓解此问题。增加箱数有助于提升准确性。森林和提升模型是后续章节讨论的树的集合。 |\n\n| ---\
  \ |\n\n模型 Studio 中关于决策树节点的分箱近似属性在 Figure 3.25 中所示。\n\n**区间 bins 数量** 属性指定区间输入使用的分箱数。箱大小为 (最大值 – 最小值) / 区间\
  \ bins。默认值为 50。\n\n\n\n\n-   区间 bin 方法属性 指定用于对输入变量进行分箱的方法。选择 **Bucket** 可以根据最大值和最小值之间的差异将输入分成等距区间。选择\
  \ **Quantile** 可以将输入分成大约等大小的组。默认值是 **Bucket**。\n\n# k-Means 聚类\n\n在输入变量进行分箱后，你可以通过对每个输入变量进行聚类，然后选择能够优化所选标准的分割变量来确定每个节点的分割点。最常用的聚类方法是\
  \ **k-means** 算法。它是一种简单的算法，能够很好地扩展到大规模数据集。如果你认为区间输入变量可以进一步细分，可以使用 **Perform clustering-based\
  \ split search** 属性，该属性指定在为每个树节点确定最佳分割时，使用基于聚类的搜索算法，而不是 exhaustive search（逐个枚举搜索）。选择该选项后，区间输入的分箱顺序将被忽略。默认情况下此选项处于未选中状态。\n\
  \n## Figure 3.25: Binning Approximation Properties\n\n![image](img/f0082-01.jpg)\n\
  \n## Figure 3.26: Two-Means Clustering\n\n![image](img/f0083-01.jpg)\n\n一个集群分割会写入\
  \ **k** 个聚类（2 ≤ k ≤ 最大分支数），它最小化了以下各项的总和（在各聚类内）：\n\n*   `y` for `y` 区间\n\n*   类内比例用于分类目标\n\
  \n*   增益的平均梯度\n\nFigure 3.26 是一个两均值聚类的示例。聚类内的平方和是观测值在每个聚类内部的变异量的度量。对于分类目标，聚类内的平方和等于\
  \ C 类中观测值在各分箱和类别中的比例与类比例之差的平方之和。\n\n## 多路分割\n\n在理论上，多路分割并不比二路分割更具灵活性，只要允许足够的二路分割即可。因此，树可以保持浅层且拥有多个分支（≥2），模型体积也可以很小，如\
  \ Figure 3.27 所示。多路分割的树倾向于更宽且更矮，而二路分割的树则相反。然而，研究表明多路分割的树并不一定优于二路分割的树。\n\n`Maximum\
  \ number of branches`（最大分支数）属性指定分割规则能产生的最大分支数。默认值为 2，导致二路分割。可能的取值范围是 2 到 10。\n\n\
  ## Figure 3.27: Binary Split Versus Multi-Way Split\n\n![image](img/f0084-01.jpg)\n\
  \n你通常关心的是根据属性对实例分类的贡献程度进行排序。可以通过从根节点开始追踪实例的分类，并收集被测试的属性来读取这种排序。当属性值形成全序集（例如数值属性）且在根到叶子路径中同一属性很少出现多次时，多路分割的决策树比传统的二路树更易理解，因为属性通常只在一条路径中出现一次。因此，多路分割往往产生更具可解释性的树，因为分割变量的使用次数较少。当仅有一个输入变量时，它们更受青睐；而二路分割因为需要考虑的分割数量较少且完整搜索更可行，通常也被偏好。此外，多路分割会在数据耗尽时导致更深层节点的统计量不足，从而削弱后续对其他变量的搜索。\n\
  \n![image](img/Demo.jpg)Demo 3.2: Exploring Split Search Tree Growth Options\n\n\
  在本次演示中，你将回到之前在 **insurance_part** 数据集上创建的分类树，并尝试一些分割搜索选项。\n\n1. 点击 **View all projects**\
  \ 图标，返回 **Insurance_ClassTree** 项目。\n\n![image](img/f0084-02.jpg)\n\n2. 双击 **Insurance_ClassTree**\
  \ 图标，打开项目。\n\n![image](img/f0084-03.jpg)\n\n3. 点击 **Pipelines** 选项卡，访问之前创建的管道。\n\
  \n4. 右键 **Data** 节点，选择 **Add child node** ![image](img/Arrow.jpg) **Supervised Learning**\
  \ ![image](img/Arrow.jpg) **Decision Tree**。\n\n5. 右键新添加的 **Decision Tree** 节点，选择\
  \ **Rename**，在 **Name** 字段中输入 **DT Multiway Splits** 以获得更明确的名称。\n\n6. 在 **Splitting\
  \ Options** 下，将 **Maximum number of branches** 设置为 4（拖动滑块或直接输入）。\n\n![image](img/f0085-01.jpg)\n\
  \n你可以始终通过二路分割将节点分成两个分支，以避免决定合适的分支数量。但这种简便做法可能不能恰当地传达数据的结构，因为数据更自然地倾向于分成更多分支。\n\n\
  多路分割始终可以通过对同一输入变量进行二路分割的序列实现。执行二路步的算法能够在单一步骤中考虑更多多步分区，而单步多路分割则只能考虑有限的组合。额外的分支会在树的更深层次耗尽数据，削弱深层节点的统计量和分割质量。\n\
  \n7. 点击 **Run Pipeline** 按钮。\n\n![image](img/f0085-02.jpg)\n\n8. 右键 **Decision Tree**\
  \ 节点，选择 **Log** 以查看处理时间。\n\n![image](img/f0085-03.jpg)\n\n二路分割的 **TREESPLIT** 过程耗时\
  \ **0.72 秒**。\n\n（可使用 **Ctrl+F** 查找 “treesplit” 以加速定位。）\n\n9. 关闭日志，重复上述步骤，针对 **DT\
  \ Multiway Splits** 节点。\n\n![image](img/f0086-01.jpg)\n\n多路分割的 **TREESPLIT** 过程耗时更长（本例中为\
  \ **1.73 秒**）。\n\n树算法通常会通过限制搜索范围为二路分割来取 shortcut，而多路分割则需要对所有 n-路分割的候选组合进行更多评估（例如，四路分割会评估所有二路、三路和四路分割的候选）。\n\
  \n10. 关闭日志，打开 **DT Multiway Splits** 节点的结果，查看多路分割是否带来收益。\n\n11. 最大化树状图。\n\n![image](img/f0086-02.jpg)\n\
  \n令人惊讶的是，所有分割都不超过二路分割。\n\n12. 关闭树状图，观察 **Output** 窗口。\n\n![image](img/f0087-01.jpg)\n\
