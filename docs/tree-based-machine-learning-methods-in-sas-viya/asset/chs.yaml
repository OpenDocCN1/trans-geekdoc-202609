  \n1.  运用费曼技巧，你只需花上`20 min`就能深入理解知识点，而且记忆深刻，*难以遗忘*。\n\n```\nif (condVar > someVal)\
  \ {console.log(\"xxx\")}\n```\n[/content]\n\n## 以下是需要翻译的文本\n\n[content]\n\nThis\
  \ tree (`with a\\=0.01`) has lesser number of leaves (207 as compared to 415 leaves\
  \ in the previous tree with a\\=0.20).\n\n![image](img/f0112-03.jpg)\n\nChanging\
  \ the logworth threshold changes the minimum logworth required for a split to be\
  \ considered by the tree algorithm. The higher the value of chi-square, the higher\
  \ the statistical significance of differences between child and parent node.\n\n\
  ![image](img/f0113-01.jpg)\n\n8.`Close` the Results and once again get back to the\
  \ properties panel.\n\n9.`Keep` the DT Multiway Split node selected. Under Splitting\
  \ Options ![image](img/Arrow.jpg) Grow Criterion, check the Bonferroni box.\n\n\
  ![image](img/f0113-02.jpg)\n\nThe Bonferroni method will adjust significance values\
  \ based on the number of tests, which directly relates to the number of categories\
  \ and measurement level of a predictor. This is generally desirable because it better\
  \ controls the false-positive error rate. Disabling this option will increase the\
  \ power of your analysis to find true differences, but at the cost of an increased\
  \ false-positive rate. Disabling this option can be recommended for small samples.\
  \ If you want big trees and insist on using the chi-squared split-worth criterion,\
  \ deactivate the Bonferroni adjustment.\n\n10.`Click` the Run Pipeline button.\n\
  \n11.`Open` the Results of the DT Multiway Split node.\n\n![image](img/f0114-01.jpg)\n\
  \nThe tree with p-values adjusted is a much simpler tree with 28 leaves, originally\
  \ grown up to 49 leaves.\n\nCareful examination of the variable importance table\
  \ below reveals some finer observations. For example, CD becomes a more important\
  \ input displacing the CDBAL. There was only one possible split on this binary input.\
  \ Because you had adjusted the p-values, the maximum worth of CDBAL did not tend\
  \ to become large enough. Similarly, the MMBAL variable is now turned out to be\
  \ an unimportant variable. The bottom line is other input variables with a larger\
  \ number of plausible splits were not favored after adjusting the p-values.\n\n\
  ![image](img/f0114-02.jpg)\n\n12.`Close` the Results of the DT Multiway Split node.\n\
  \n13.`Open` the Results of the Model Comparison node. Maximize the Model Comparison\
  \ table.\n\n![image](img/f0115-01.jpg)\n\nThe Average Squared Error (ASE) of the\
  \ multi-way split tree has improved from 0.1882 (without Bonferroni) to 0.1797 and\
  \ the misclassification rate has improved from 0.2903 (without Bonferroni) to 0.2654.\
  \ Consequently, this model is certainly better than the two-way split decision tree\
  \ and stands as champion so far.\n\n14.`Close` the Model Comparison table.\n\n15.`Close`\
  \ the Results of the Model Comparison node.\n\n![image](img/EndOfDemo.jpg)\n\nQuiz\n\
