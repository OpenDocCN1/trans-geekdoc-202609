  . 最大化变量重要性表。\n\n![image](img/f0089-01.jpg)\n\n决策树算法对所有输入逐一搜索最佳分割点，然后选择分割最佳的输入。对每个变量进行显著分割会使选择倾向于类别众多的名义变量。本数据中有两个名义变量：分行（BRANCH）和区域分类（RES），分别有\
  \ 19 与 3 个类别。BRANCH 只用于一次分割，RES 甚至未使用。\n\n注意：您可以考虑对每个输入进行分割搜索，然后通过调整 p‑值来惩罚易产生偏差的分割。本章后面将讨论此点。\n\
  \n现在专注于最重要的变量。\n\n前四个变量为存储余额（SAVBAL）、货币市场（MM）、证书存款余额（CDBAL）和活期存款余额（DDABAL）。货币市场是二元输入，其余三个为区间变量，分别拥有\
  \ 8552、554 和 15269 个不同取值。（您可以在 SAS Visual Analytics 中进行探索。）\n\n为什么 DDABAL 虽然拥有最多不同取值，却重要性较低？\n\
  \n exhaustive search 方法存在两个问题：一是计算复杂度，二是变量选择偏差，后者可能是树结构解释方面的更根本性问题。无限制搜索倾向于选择拥有更多分割的变量。这使得从树结构中得出可靠结论变得困难。区间变量通过分箱来限制这种现象。请回顾区间变量的分箱数为\
  \ 50；因此，每个区间输入实际上有 49 个可能的分割点。值得注意的是，它们的重要性几乎与其对目标的相关性相匹配。\n\n22\\. 关闭变量重要性表并关闭决策树节点的结果。\n\
  \n23\\. 保持决策树节点选中，在 Splitting Options 下将最小叶子大小从 5 改为 20，并将区间桶数从 50 改为 100。\n\n![image](img/f0090-01.jpg)\n\
  \n桶数越多，越能更准确地找到最优分割点。但桶数越多，处理时间越长。增大最小叶子大小可避免生成更小的叶子，可能在一定程度上弥补树的复杂度。\n\n24\\. 运行决策树节点并打开结果。\n\
  \n![image](img/f0090-02.jpg)\n\n该树已生长至 67 叶子节点。\n\n最终树是更简化的树，叶子节点为 14 个（相较于默认设置时的\
  \ 31 个）。前几个变量的重要性顺序未变，但许多分割点已改变（例如，SAVBAL 的新分割点为 51845.51，而默认树中的分割点为 9553.75）。\n\
  \n![image](img/f0091-01.jpg)\n\n25\\. 点击 Assessment 标签，向下滚动并最大化 Fit Statistics 表。\n\
  \n![image](img/f0091-02.jpg)\n\n模型性能几乎没有改善。ASE 为 0.1897（默认树的 0.1852），MISC 为 0.2676（默认树的\
  \ 0.2678）。\n\n通常，用于区间输入的聚类算法能够提升准确性并减小树的大小。\n\n26\\. 关闭决策树节点的结果，返回右侧的节点选项。\n\n27\\\
  . 将区间桶数改为 10，并勾选 Perform clustering-based split search 框。\n\n![image](img/f0091-03.jpg)\n\
  \n由于这是二叉分割的决策树，聚类分割会对 INS（比例）类进行两均值聚类，最小化这两个聚类之间的内部加权平方距离之和。\n\n区间输入的分箱与聚类分割搜索的方式相同。对已执行聚类分割搜索的数值输入，区间桶数即为初始聚类数。很多桶会产生大量可能的分割点，这可能不切实际。因此，您可以通过适当降低桶数来加以控制。\n\
  \n注意：启用 k‑means 快速搜索算法会忽略桶的顺序。如果您想使用贪心搜索方法并尊重桶顺序，请禁用此选项。\n\n28\\. 再次运行决策树节点。\n\n\
  29\\. 右键单击决策树节点并打开结果。\n\n30\\. 最大化 Tree Diagram 并集中观察根节点及其下一层节点。\n\n![image](img/f0092-01.jpg)\n\
  \n使用聚类分割搜索的树叶节点数增至 172（相较于桶数设为 100 时的 67 叶子）。最终树略复杂，叶子节点为 18（相较于桶数设为 100 时的 14 个）。\n\
  \nSAVBAL 和 DDABAL 仍在树的早期被使用，但其分割点已完全不同。CDBAL 已成为不重要的变量。然而，名义输入 BRANCH 现在在树的早期被使用。\n\
  \n31\\. 关闭 Tree Diagram 并最大化变量重要性表。\n\n![image](img/f0092-02.jpg)\n\n前几个变量的重要性出现了一些变化。\n\
  \n32\\. 关闭变量重要性表，并在 Assessment 标签下最大化 Fit Statistics 表。\n\n![image](img/f0093-01.jpg)\n\
  \nASE 从 0.1897 略微提升至 0.1808，MISC 从 0.2676 提升至 0.2616。\n\n33\\. 关闭 Fit Statistics\
  \ 表并关闭结果。\n\n![image](img/EndOfDemo.jpg)\n\n**分割准则**\n\n树模型的预测变量可以是类别型或连续型。模型基于将预测空间（所有预测变量的全组合）划分为不相交的段，这些段对应于树的终端节点（叶子）。划分从根节点开始，根节点包含全部数据，直到满足停止准则为止。每一步，父节点通过选择一个预测变量及其分割值来划分为子节点，该分割值使得根据指定的度量在子节点中的响应变量变异最小。无论是\
  \ exhaustive search 还是对可能分割点的近似，我们都会枚举所有 X 值的可能分组，并为每种组合计算分割收益。收益最大的组合获胜。Figure\
  \ 3.28 展示了以星级形式表示的分割收益，易于理解。可用于评估每个节点候选分割的度量包括 Gini 指数、熵和残差平方和等。\n\nFigure 3.28:\
  \ Splitting Gain\n\n![image](img/f0093-02.jpg)\n\nFigure 3.29: Splitting Criteria\
  \ and Type of Decision Tree\n\n![image](img/f0094-01.jpg)\n\n分裂父节点的两类准则：一类最大化节点不纯度（由不纯度函数定义），另一类由统计检验定义。准则的选择也取决于您希望构建的决策树类型。分裂准则在\
  \ Figure 3.29 中以连线形式展示，显示准则类型与树的类型之间的对应关系。\n\nModel Studio 的 Grow criterion 属性指定了父节点划分为子节点的准则。可用的选项包括：\n\
  \n\n\n\n# 类目标标准属性\n\n`Class` 目标标准属性指定用于在给定类目标的输入中确定最佳分割的准则。可能的值在 Figure 3.30 中显示。默认值是\
  \ `信息增益比`。\n\n# 区间目标标准属性\n\n`Interval` 目标标准属性指定用于在给定区间目标的输入中确定最佳分割的准则。可能的值在 Figure\
  \ 3.30 中显示。默认值是 `方差`。\n\n## Figure 3.30: Splitting Criteria in Model Studio\n\n\
  ![image](img/f0094-02.jpg)\n\n你可以在树算法的分割搜索阶段更改分割的评估方式。对于类别目标，从卡方准则改为其他准则通常会在各输入的不同级别数相似的情况下产生相似的分割。如果不同，其他分割方法倾向于倾向于级别更多的输入，因为存在多重比较问题，后文将讨论。你也可以通过关闭\
  \ Bonferroni 调整，使卡方方法倾向于倾向于级别更多的输入。由于 Gini 减少和熵减少准则缺乏卡方准则的显著性阈值特征，它们倾向于生成巨大的树。\n\
  \n## Figure 3.31: Impurity Reduction\n\n![image](img/f0095-01.jpg)\n\n## 基于杂质的分割标准\n\
  \n父节点的杂质是一个非负数，等于 0 表示纯节点（所有观测的响应变量值相同）。观测值响应变量差异很大的节点杂质较大。\n\n令 `i(.)` 为某些节点内杂质的度量，令\
  \ `Δi` 表示整棵树的杂质整体下降。Figure 3.31 展示了从父节点到多个子节点的杂质下降。许多分割标准（包括 Gini 和熵）是基于节点杂质（即由分割诱导的节点内部变异的下降）的。\n\
  \n熵、Gini 指数和方差（RSS – 残差平方和）准则降低杂质。父节点 `τ` 的杂质定义为 `i(τ)`。算法选择最佳分割变量和最佳分割值，以实现杂质下降最高：\n\
  \n$$\\Delta i(s,\\\\tau) = i(\\\\tau) - \\\\sum_{b=1}^{B} p(\\\\tau_b|\\\\tau) i(\\\
  \\tau_b)$$\n\n其中 `τb` 表示第 b 个子节点，`p(τb|τ)` 是被分配到 `τb` 的观测在 `τ` 中所占的比例，`B` 是分割 `τ`\
  \ 后的分支数。\n\n## Figure 3.32: Gini Impurity Example\n\n![image](img/f0096-01.jpg)\n\
  \n## 分类树的杂质减少准则\n\n### Gini 指数准则\n\n该准则定义 `i(τ)` 为对应于类响应平均平方误差的 Gini 指数，公式为：\n\n\
  $$i(\\\\tau) = -\\\\sum_{j=1}^{j} p_j²$$\n\n其中 `pj` 是拥有第 j 类响应值的观测比例。\n\n这也可以表示为\
  \ Gini 不纯度或 Gini 多样性指数：`Pr(interspecific encounter) = 1 - Gini Index`。\n\nGini 指数是分类数据的变异度量（由著名的意大利统计学家\
  \ Corrado Gini 在 1912 年提出）。它可以作为节点杂质的度量，其中 `p1, p2, …, pr` 是节点中各目标类的比例。Breiman 等人（BFOS\
  \ 1984）提出了 ∆Gini 分割准则。\n\nGini 指数可以解释为从多重集中随机（有放回）选取两个元素不同的概率。Figure 3.32 给出了一个例子，其中不同类型的动物代表节点中多样性及相应的纯度。纯节点的\
  \ Gini 指数为 0。随着类别的均匀分布增加，Gini 指数趋近于 1。更多信息请参见 Hastie, Tibshirani, and Friedman (2009)。\n\
  \n在数学生态学中，Gini 指数称为 Simpson 多样性指数。在密码分析中，它是 1 减去重复率（Patil and Taillie 1982）。\n\n\
  ## Figure 3.33: Entropy Example\n\n![image](img/f0097-01.jpg)\n\n### 熵准则\n\n节点 `t`\
  \ 的熵杂质定义为：\n\n$$\\begin{matrix} i(\\\\tau) = -\\\\sum_{j=1}^{j} p_j \\\\log_2(p_j)\
  \ \\\\end{matrix}$$\n\n熵使用信息增益或熵的减少来分裂每个变量，然后确定分割。可以指定最小的熵减少或信息增益比的增加。\n\nFigure\
  \ 3.33 将不同动物的例子扩展到熵准则。熵可以视为纯度的度量。熵值越高，纯度越低。\n\n熵与 Gini 指数一样，是分类数据的变异度量。考虑 `r` 个互斥事件，概率为\
  \ `p1, p2, …, pr`。特定结果的罕见程度可以表示为 `-log2(pi)`。熵是平均罕见度，因此衡量结果的不确定性。在通信（信息）理论中，熵用于衡量传输消息的不确定性，单位为比特（Shannon\
  \ 1948）。熵具有以下 desirable 属性：\n\n$$\\\\begin{matrix} 0 \\\\leq H(p_1,p_2,...,p_r)\
  \ \\\\leq H(\\\\frac{1}{r},\\\\frac{1}{r},...,\\\\frac{1}{r}) \\\\\\\\ H(\\\\frac{1}{r},\\\
  \\frac{1}{r},...,\\\\frac{1}{r}) = log_2(r) \\\\\\\\ H(1,0,...,0) = 0 \\\\\\\\ \\\
  \\end{matrix}$$\n\n∆entropy 分割准则由 Quinlan (1993) 提出。该准则等价于使用似然比卡方检验统计量来衡量分支与目标类之间的关联（Ripley\
  \ 1996）。Quinlan (1993) 更倾向于使用 gain ratio，这是对 ∆entropy 的修正，能够降低其对分支数和属性值多的偏见。\n\n\
  ## Figure 3.34: Relationship of Entropy and Gini Functions\n\n![image](img/f0098-01.jpg)\n\
  \n这两个杂质度量通常产生相似的结果。Figure 3.34 的图表显示 Gini 指数和熵相似，作为杂质准则。熵的计算可能稍慢，因为它使用对数。\n\n| 对于二分类树，Breiman\
  \ (1996) 表明，∆Gini 准则倾向于在一个分支中孤立最大的目标类，而 ∆entropy 准则倾向于平衡分割。 |\n| --- |\n\n### 信息增益准则\n\
  \n信息增益方法选择基于哪个属性带来最大的信息增益来进行分割。增益以比特为单位衡量。虽然该方法效果良好，但它倾向于对属性值多的变量进行分割。信息增益比率方法通过考虑分割的值来确定信息增益的有价值比例。信息增益比率最大的分割被选中。\n\
  \nFigure 3.35 展示了根据动物颜色（有两个级别：棕色和灰色）分割节点时的信息增益。\n\n信息增益的计算首先确定训练数据的信息。响应值 `r` 的信息计算如下：\n\
  \n$$- log_2(\\\\frac{freq(r,T)}{|T|})$$\n\n`T` 表示训练数据，`|T|` 是观测数。为了得到训练数据的期望信息，对所有可能的响应值求和：\n\
  \n$$\\\\begin{matrix} \\\\begin{matrix} I(T) & = \\\\\\\\ \\\\end{matrix} & -\\\\\
  sum_{i=1}^{n}\\\\frac{freq(r_i,T)}{|T|} \\\\\\\\ \\\\end{matrix} \\\\times log_2(\\\
  \\frac{freq(r_i,T)}{|T|})$$\n\n\n\n\n图 3.35：按动物颜色的信息增益\n\n![image](img/f0099-01.jpg)\n\
  \n在此，n 是响应值的总数。该值也被称为训练数据的熵。\n\n接下来，考虑在变量 X 上的一个分割 S，该变量有 m 种可能的属性。该分割提供的预期信息由以下公式计算：\n\
  \n$I\\_{s}\\\\left( T \\\\right) = - {\\\\sum\\_{j = 1}^{m}\\\\frac{\\\\left| T\\\
  _{j} \\\\right|}{\\\\left| T \\\\right|}} \\\\times I\\\\left( T\\_{j} \\\\right)$\n\
  \n在此公式中，Tj 表示包含第 j 个属性的观测集合。\n\n分割 S 的信息增益由以下公式计算：\n\nG(S) = I(T) − IS(I)\n\n信息增益比通过引入分割信息值来修正信息增益计算。分割信息由以下公式计算：\n\
  \n$SI(S) = - \\\\sum\\\\limits\\_{j = 1}^{m}\\\\frac{\\\\left| T\\_{j} \\\\right|}{\\\
  \\left| T \\\\right|} \\\\times log\\_{2}(\\\\frac{\\\\left| T\\_{j} \\\\right|}{\\\
  \\left| T \\\\right|})$\n\n顾名思义，信息增益比是信息增益与分割信息的比值：\n\n$GR(S) = \\\\frac{G(S)}{SI(S)}$\n\
  \n如 图 3.36 所示，这是基于动物大小（小、大、巨大）三个层次对节点进行拆分时的信息增益。由于基于大小的信息增益高于基于颜色的信息增益，第一次拆分应在大小上进行。属性层数越多，通常占主导地位。\n\
  \n图 3.36：按动物大小的信息增益\n\n![image](img/f0100-01.jpg)\n\n现在，回顾上一章节中提到的基于笔迹识别手写数字的例子，该例子中案例为在压力敏感平板上书写的数字。图\
  \ 3.37 展示了该分类树中 Gini 和熵准则的数值。\n\n在确定一组候选分割后，使用分割准则来确定最佳分割。在某些情况下，分割的价值显而易见。如果目标分布在子节点中的分布与父节点相同，则未进行改进，分割是无用的。相反，如果分割产生纯子节点，则该分割是最佳的。\n\
  \n图 3.37：分类树 – Gini 和熵准则\n\n![image](img/f0100-02.jpg)\n\n在分类树中，最知名的三种分割准则基于吉尼指数（BFOS\
  \ 1984）、熵（Quinlan 1993）和卡方检验（Kass 1980）。与这三种准则相关的著名算法和软件产品包括 CART（分类和回归树）；C5.0（由机器学习研究者昆兰开发）；以及\
  \ CHAID 算法（卡方自动交互检测）。\n\n图 3.38：方差示例\n\n![image](img/f0101-01.jpg)\n\n回归树的不纯度减少准则\n\
  \n方差\n\n回归树只有一种不纯度减少准则，即方差，也称为方差分析（ANOVA）准则或残差平方和（RSS）准则。该准则定义了 i(τ) 为残差平方和：\n\n\
  $i\\\\left( \\\\tau \\\\right) = \\\\frac{1}{N(\\\\tau)}{\\\\sum\\_{i = 1}^{N(\\\
  \\tau)}\\\\left( {Y\\_{i} - \\\\overline{Y}} \\\\right)^{2}}$\n\n其中 N(τ) 是 τ 中的观测数量，Yi\
  \ 是观测 i 的响应值，Ῡ 是 τ 中观测的平均响应值。\n\n节点的方差减少被定义为由于在该节点处的分割而导致目标变量方差的总减少。该方法使用标准方差公式选择最佳分割。方差计算是一个两步过程：首先计算每个节点的方差，然后计算每个分割的方差为各节点方差的加权平均。选择方差最小的分割作为分割标准。图\
  \ 3.38 展示了分散性（多样性）以及随之而来的纯度以及方差值。\n\n回顾上一课中提到的波士顿住房数据示例，该示例的案例为波士顿 506 个普查区。目标是中位房价（MEDV），其中一个输入变量是空气中的氮氧化物浓度（NOX）。\n\
  \n图 3.39：回归树 – 方差减少准则\n\n![image](img/f0102-01.jpg)\n\n回归树试图将输入空间划分为目标值相似的段，即每个段或节点具有低变异性，如\
  \ 图 3.39 所示。在纯节点中，所有目标值相等。换句话说，纯节点内的目标变量方差为零。\n\n其他更稳健的传播度量，如最小绝对偏差（LAD），已被提出（BFOS\
  \ 1984）。\n\n基于统计检验的分割准则\n\n卡方、F 检验和 CHAID 准则由统计检验定义。这些准则通过在分割定义的分支中检查响应变量的显著差异来计算分割的价值。\n\
  \n这是一个三步过程：\n\n步骤 1：计算每个输入变量分区的价值。\n\n步骤 2：选择价值最大的分区。\n\n步骤 3：对所有其他输入变量重复。\n\n价值定义为\
  \ -log(p)，其中 p 是检验的 p 值。在模型工作室中，显著性水平属性指定了 CHAID、卡方和 F 检验的显著性水平。默认值为 0.2。\n\n分类树的统计检验准则\n\
  \n任何分类树中的分割都可以用列联表表示。行代表子节点，列代表类别。每个单元格包含该类别在该子节点中的案例频数。\n\n图 3.40：分类树 – 卡方准则\n\n\
  ![image](img/f0103-01.jpg)\n\n卡方检验\n\nPearson 卡方检验可用于判断分割的价值。它检验列分布（类别比例）在每行（子节点）中是否相同。检验统计量衡量观测单元格计数与若行和列（子节点和目标类）相互独立时预期的计数之间的差异。在手写数字识别示例中，观测频数、预期频数和卡方统计量的计算如\
  \ 图 3.40 所示。\n\n检验的统计显著性与卡方统计量的大小并不呈单调关系。检验的自由度为 (r – 1)(B – 1)，其中 r（目标级数）和 B（分支数）是表格的维度。与\
  \ v 个自由度的卡方统计量的期望值等于 v。因此，分支数越多（表格越大），卡方统计量自然越大。p 值是观测卡方统计量至少与所观测值相等的概率，前提是行和列之间不存在关联。（目标分布在各分支中相同。）\n\
  \n在分类变量的卡方准则中，价值基于 Pearson 卡方检验的 p 值，该检验比较各分支中响应级别的频数。\n\n| 卡方分割准则使用卡方检验的 p 值（Kass\
  \ 1980）。当 p 值非常小时，使用 logworth = –log10(p‑value) 更为便利，该值随 p 值的减小而增大。∆Gini 和 ∆entropy\
  \ 分割准则也随分支数增加而增大，但它们缺乏类似的自由度调整。因此，它们倾向于偏好多分支且 B 较大的多分支。 |\n\n\n\n\n# 统计检验标准用于回归树\n\
  \n基本回归树将数据集分割为更小的子组，然后为子组中的每个观测值拟合一个简单的常数。F 检验可以类似于卡方检验用于回归树。\n\n## F 检验\n\n节点上的分割可以被视为单因素方差分析，其中\
  \ B 条支是 B 个处理。设 ${\\\\overline{y}}\\_{i.}= \\\\frac{1}{n\\_{i}}{\\\\sum\\\\limits\\\
  _{j = 1}^{ni}y\\_{ij}}$ 为每个节点的目标均值，${\\\\overline{y}}\\_{\\\\times \\\\times}$ 为根节点的均值（总体均值）。\n\
  \n如 Figure 3.41 所示，节点间平方和（SSbetween）衡量节点均值与总体均值之间的距离，节点内平方和（SSwthin）衡量节点内的变异。F 统计量值越大，表明节点均值不相等的原假设越可能被驳斥。当目标值在输入条件下独立、服从正态分布且方差恒定时，F\
  \ 统计量服从自由度为 B‑1 与 n‑B 的 F 分布。检验的 p‑值与分类树的卡方检验的 p‑值使用方式相同。\n\n总平方和（SStotal）在比较节点分割时可以视为固定的。因此，由\
  \ ANOVA 身份得出：\n\nSStotal = SSbetween + SSwithin\n\nFigure 3.42: 异方差性\n\n![image](img/f0105-01.jpg)\n\
  \nF 统计量可以被视为要么最大化节点均值之间的差异，要么最小化节点内的方差。后一种解释表明 F 统计量与减少杂质（方差）分割标准之间的等价性。\n\nΔvariance\
  \ = (SStotal / n) - Σ (n_i / n) * (SS_i / n_i) = (1 / n) * (SStotal - SSwithin)\
  \ = SSbetween / n\n\n因此，使用 Δvariance 与不调整 F 统计量的自由度（分支数）是等价的。\n\n当目标（条件于输入）的分布独立、正态且方差恒定时，F\
  \ 检验具有许多最优性质。F 检验对正态性假设的偏离相对稳健。然而，如 Figure 3.42 所示，方差异质性（异方差）可能产生灾难性影响（Scheffe 1959）。\n\
  \n例如，当小节点的方差较大时，F 检验会过于宽松（高估效应的显著性）。常见的非负目标方差随均值增加而增大的情形下，使用 F 检验作为分割标准倾向于偏好小分割的最大值。这意味着偏好大的分割值，导致叶子节点观测数很少。\n\
  \n决策树通常被视为稳健且非参数化，这意味着它们对输入空间中的离群值通常具有鲁棒性。然而，回归树对目标区间的离群值或异方差不具鲁棒性。与经典回归模型一样，对目标进行合适的方差稳定变换可以改善模型。\n\
  \nFigure 3.43: CHAID 中确定分支数量\n\n![image](img/f0106-01.jpg)\n\n| To summarize, although\
  \ decision trees are generally robust to outliers in the input space, regression\
  \ trees are not robust to outliers in the target. |\n\n| --- |\n\n## 分类树和回归树的统计准则\n\
  \nCHAID 适用于分类和连续响应变量，它把每一次可能的分割都视为一次检验。\n\n### CHAID\n\nCHAID 检验节点分支之间的响应（目标）变量值是否存在关联。\n\
  \nCHAID 递归地将数据划分（例如，使用多路分割对名义和有序输入变量）。只有在名义目标值与节点分支之间的独立性卡方检验达到显著性阈值时，才会进行分割；否则节点保持不变。CHAID\
  \ 通常对输入变量的类别数使用 Bonferroni 校正（下文讨论），从而削弱类别值较多的输入变量的偏向。\n\nCHAID 还利用显著性检验确定分支的数量，如\
  \ Figure 3.43 所示。对给定输入的分割搜索过程如下。首先，为输入的每个值分配一个分支。对每一对分支，构建目标值与分支的二维计数表。找到卡方独立性度量最小的一对分支。如果显著性水平低于阈值，则合并分支并重复；否则，考虑重新分割包含三个或更多输入值的分支。如果在二元分割上找到超过阈值显著性的情况，则将分支二分并回到合并分支的步骤。\n\
  \n搜索在不再出现显著的合并或重新分割时结束。最后一次对输入的分割被视为该输入的候选分割。注意，这通常不是在检查过程中最显著的分割。\n\n对于类别型预测变量，CHAID\
  \ 使用卡方统计量（分类树）或 F 统计量（回归树）来合并相似的预测变量水平，直到拟议分割的子节点数量达到“最大分支数”选项所指定的数量。最终分割的 p‑值决定在哪个变量上进行分割。\n\
  \n对于连续预测变量，CHAID 在满足“最大分支数”选项的子节点数量之前，选择单一的最佳分割。\n\n当应用 CHAID 时的一个普遍问题是最终树可能会非常庞大。实际中，当输入数据复杂且包含众多分类标签（分类问题）或众多潜在预测变量（分类任务）时，生成的树会变得很大。您将在下一节学习修剪策略来解决这一问题。\n\
  \n### 用于基于统计检验的分割标准的 Bonferroni 校正\n\n在检验列联表中列的类别是否独立时，即使分支之间的真实比例没有差异，也可能得到显著（较大）的卡方统计量。换句话说，如果有很多方式来划分标记行的变量（从而产生很多卡方表和检验），那么即使变量没有真实效应，也很可能出现至少一个\
  \ p‑值极小的情况。随着可能的分割点数量增加，获得显著值的可能性也随之上升。因此，拥有大量唯一输入值的变量更有可能偶然出现较大的统计量，而不是只有少量不同取值的变量。\n\
  \n\n\n\n统计学家在结合多个统计检验的结果时会面临类似的问题。随着检验数量的增加，假阳性结果的概率也随之上升。为了保持整体置信度，统计学家会将每个检验的\
  \ p 值乘以正在进行的检验数量，从而使 p 值膨胀。若膨胀后的 p 值显示出显著结果，则整体结果的显著性即可得到保证。这种 p 值调整方式称为 Bonferroni\
  \ 校正。\n\n当你控制比较误差率（CER）时，你为单次比较固定了 α 水平，而不考虑你正在进行的所有两两比较。实验误差率（EER）则使用一个考虑了所有两两比较的\
  \ α。假设不存在差异，考虑到所有可能的比较后，错误地得出至少有一个差异的概率会显著升高，如图 3.44（链接至 Chapter03.xhtml#ch03fig44）所示。若想确保整个比较集的错误率为\
  \ 0.05，请使用类似 Bonferroni 调整的方法，使实验误差率保持在 0.05。\n\n图 3.44：CER、EER 与 Bonferroni 调整\n\
  \n![image](img/f0108-01.jpg)\n\n每个分割点对应一个统计检验，Bonferroni 校正会自动应用于输入的 worth 计算。这些校正会通过减去等于不同输入值数量的对数的量来惩罚包含许多分割点的输入，这与\
  \ Bonferroni 校正等价，因为从 worth 中减去该常数相当于将对应的卡方 p 值乘以分割点的数量。该调整使得在 split‑search 算法中，拥有许多级别但层次较少的输入能够得到更公平的比较。\n\
  \n| 统计学家之间对是否以及如何控制实验误差率存在分歧。 |\n| --- |\n\nBonferroni 属性决定是否对 CHAID、卡方检验和 F 检验的顶层\
  \ p 值应用 Bonferroni 调整。默认情况下该选项未被选中。\n\n使用分裂准则可以看作是一个两步过程：首先在每个输入变量上选出最佳分割，然后在上述分割中选出最佳者。这两步都可能需要调整，以防止因检查了大量分割而产生的伪关联。\n\
  \n*   **在同一输入变量上比较分割**：卡方检验统计量（以及 Gini、熵）倾向于将分割分成更多分支的情形。p 值（或 worth）通过自由度进行校正以纠正这种偏见。对于二分分割，无需额外调整。\n\
  \n*   **在不同输入变量之间比较分割**：每个输入变量的最佳分割都是从其所有可能分割中选出的。输入变量级数越多，可选分割的数量也越多。\n\n    例如，图\
  \ 3.45（链接至 Chapter03.xhtml#ch03fig45）显示二元输入只有一种可能的分割。χ² 的自由度用 υ 表示，公式为（行数‑1）×（列数‑1）。随着分割点数\
  \ m 的增大，最大 worth 倾向于变大。因此，级数较多的输入变量更受青睐。名义输入相较于有序输入（级数相同）更受青睐。在测量尺度相同的输入中，级数更多的输入更受青睐。\n\
  \n图 3.45：分类树 – p 值调整\n\n![image](img/f0109-01.jpg)\n\nBonferroni 调整的 p 值用于纠正上述偏见。令\
  \ a 为每次检验的 Type I 错误概率（即错误发现关联的概率）。对于 m 次检验，Bonferroni 不等式给出至少出现一次 Type I 错误的保守上界为\
  \ m a。因此，Bonferroni 调整将 p 值乘以 m（等价于从 worth 中减去 log₁₀(m)）。对于有序输入，乘数 m 为 \\\\(\\\\\
  left( \\\\begin{array}{l} {L - 1} \\\\\\\\ {B - 1} \\\\\\\\ \\\\end{array} \\\\\
  right)\\\\)；对于名义输入，则为 S(L,B)。\n\n一些附加因素使得分割搜索变得稍加复杂。树算法的设置会禁止某些数据分区。例如，最小观测数设置要求每个分割必须包含至少一定数量的案例，这会限制每个输入在分割搜索中的潜在分区数量。其他属性，如图\
  \ 3.46（链接至 Chapter03.xhtml#ch03fig46）所示的最大深度和仅使用一次输入，也会影响树的生长。\n\n在构建树时，你最常修改的调整规则是限制树的生长规则。降低叶子的最小观测数可防止创建只有少量案例的叶子；提高最大深度则允许更大的树，从而更敏感于复杂的输入‑目标关联。\n\
  \n图 3.46：其他树生长选项\n\n![image](img/f0110-01.jpg)\n\n最大深度属性指定节点的最大生成层数。根节点为第 0 层，其子节点为第一代。取值范围为\
  \ 1 到 50，默认值为 10。\n\n最小叶子大小属性指定叶子能拥有的最小训练观测数。默认值为 5。\n\n仅使用一次输入属性表示在祖先节点的分割规则中已使用的输入变量不会再作为分割依据。默认情况下该选项未被选中。\n\
  \n![image](img/Demo.jpg)Demo 3.3：尝试分裂准则\n\n此演示基于保险数据集 Insurance_ClassTree 项目进行。你可以通过修改分裂准则和其他树生长选项来进行实验。\n\
  \n1. 确保在 Model Studio 中打开 Insurance_ClassTree 项目，并在 Pipelines 标签页上。\n\n2. 选中 DT\
  \ Multiway Split 节点。\n\n3. 在 Splitting Options ![image](img/Arrow.jpg)Grow Criterion\
  \ 下，将 Class 目标准则从 Information gain ratio 改为 Chi‑square，将 Minimum leaf size 从 5 改为\
  \ 20，将 Number of interval bins 从 50 改为 100。\n\n![image](img/f0111-01.jpg)\n\n在大多数情况下，分裂准则的选择对树的性能影响不大。每种准则在某些情形下表现更好，在其他情形下则较差，这符合“没有免费午餐”定理。但你仍需进行实验。\n\
  \n*   信息增益和 Gini 指数主要偏向多值属性，而信息增益比倾向于偏向极不平衡的分割（一侧分区远小于另一侧）。Gini 指数在类别数较多时也会出现困难，倾向于产生等大且纯净的分区。\n\
  \n*   增大最小叶子大小可避免孤立节点。对于大数据集，增大叶子数量可获得更高的模型分辨率。\n\n4. 运行 DT Multiway Split 节点并打开结果。\n\
  \n![image](img/f0111-02.jpg)\n\n该树已生成最高 415 个叶子，选定的树叶数为 244，主要包含以下重要变量。\n\n![image](img/f0112-01.jpg)\n\
  \n5. 关闭结果并返回右侧的属性面板。\n\n6. 继续在 DT Multiway Split 节点上操作。在 Splitting Options ![image](img/Arrow.jpg)Grow\
  \ Criterion 下，将显著性水平从 0.20 改为 0.01。\n\n![image](img/f0112-02.jpg)\n\n较低的显著性水平（α）倾向于产生节点更少的树。\n\
  \n7. 重新运行 DT Multiway Split 节点并打开结果。\n\n\n\n\n假设你是一个高级文档工程师和翻译员，请参考下面的注意事项了解 Markdown\
