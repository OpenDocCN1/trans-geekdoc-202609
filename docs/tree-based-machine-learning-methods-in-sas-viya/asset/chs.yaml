  \ Model Studio\n\nDemo 1.1: Model Studio Introductory Flow\n\nQuiz\n前言\n\n决策树是流行的机器学习模型。它们直观自然，因为在某种程度上，它们模仿了我们在日常生活中做决定的方式。多个决策树可以组合成集合模型，从而获得比单个决策树更好的预测性能。决策树和树基集合模型是监督学习模型，用于分类和回归问题。它们主要用于预测，但也在建模过程及其\
  \ beyond 中具有其他用途。\n\n为什么使用树基预测建模？树基模型在处理类别变量时不需要你创建哑变量。树基模型在决定分割时直接考虑类别级别。树基模型还可以处理存在缺失值的观测，而不必忽略该观测或强制插补缺失值。树可以将缺失值分配到其分支中。这种策略也可以用于在评分时出现的未知类别，这些类别在训练时未见过。树基模型还能够检测非线性关系。单个决策树可以解释为一组规则，也可以轻松在树形图中可视化。\n\
  \nSAS Visual Data Mining and Machine Learning 软件在 SAS Viya 上有三种树基预测建模技术——决策树、森林和梯度提升树。决策树直观且高度可解释。森林模型是树的装袋集合，预测能力高但比单个树更难解释。梯度提升模型是提升集合的树，难以解释但预测能力强。在\
  \ SAS Visual Data Mining and Machine Learning 中，很容易从一种树基模型开始构建，再转换为构建另一种模型。输出类似，因此你可以更容易地从一种模型过渡到另一种模型来理解结果。\n\
  \n这三种树基预测建模技术的分析可以在 SAS Viya 的 Decision Tree Action Set 中找到。这些技术可以通过 SAS Visual\
  \ Data Mining and Machine Learning 的编程接口使用 TREESPLIT、FOREST 或 GRADBOOST 过程来访问。你可以通过\
  \ SAS Studio HTML 客户端访问这些过程。SAS Studio 还提供任务，帮助你生成代码。SAS Visual Analytics 提供对象，帮助你使用点击式界面交互式创建这些模型。SAS\
  \ Viya 的操作也可以通过其他客户端（如 SAS Visual Analytics 客户端、Java 或 Python）来调用。本书主要考虑点击式可视界面，主要包括\
  \ Model Studio 中的管道，以及 SAS Studio 和 SAS Visual Statistics 的部分内容。同时也介绍了一些在 SAS 编程接口中调用\
  \ SAS Viya 操作的内容。\n\n\n\n\n这本书包括对树结构预测模型的讨论以及生长、修剪和评估决策树、森林和梯度提升树的方法。你不仅能学习如何使用树模型进行分类和回归，以及它们的某些局限性，还能了解构成它们的相应算法的工作原理。每个示例都会引入新的数据问题，然后指导你调整建模方法、修改属性、更改超参数，从而构建出合适的树模型。在此过程中，你将获得构建能够为你工作的决策树、森林和梯度提升树的经验。\n\
  \n这本书还解释了隔离森林（一种用于异常检测的无监督学习算法）、深度森林（神经网络深度学习的替代方案）以及泊松和特维梯度提升回归树。此外，还对树的多种辅助用途进行了考察，例如探索性数据分析、维度降低和缺失值填补，并展示了在\
  \ SAS 和开源 SAS 中运行的开源实现。\n\n## 这本书涵盖了什么？\n\n这本书涵盖了从使用单棵树到更高级的装袋和提升集成方法的所有内容，适用于 SAS\
  \ Viya。\n\nChapter 1 提供树结构模型的介绍以及 SAS Viya 中可用的模型。决策树是强大的预测和解释建模工具，它们的灵活性使其能够处理区间、有序、名义和二元目标，并能够容纳非线性和交互作用。它们易于理解和展示。本章还介绍了\
  \ Model Studio。\n\nChapter 2 讨论决策树的类型。树可以是分类树，用于建模分类目标；也可以是回归树，用于建模连续目标。模型以 if-then\
  \ 语句的序列形式表达。对于每棵树，需要指定目标（因变量）变量以及一个或多个输入（自变量）变量。输入变量可以是类别型或连续型。根节点是初始节点，叶节点是终端节点。分区从根节点开始，根节点包含全部数据，随后反复划分直到满足停止条件。每一步，父节点通过选择输入变量和该变量的分割值来划分为两个或多个子节点。与其他建模工具一样，决策树模型会生成评分代码，并可通过\
  \ Model Studio 中的 Score 节点在新数据上生成预测。\n\nChapter 3 说明如何生长决策树。递归分区是树从根节点向最大尺寸生长的方法。分裂标准用于评估和比较输入之间的分裂。这些标准衡量子节点相对于父节点的变异减少。目标是降低变异从而提高纯度。可以使用的指标包括\
  \ Gini 指数、熵以及残差平方和。构建决策树的过程是先生长一个大的完整树，完整树可能过拟合训练数据，导致模型在新数据上泛化不足。 exhaustive split\
  \ searches（逐项分裂搜索）在计算上开销很大。决策树算法通过以下方式减少分裂搜索：限制子节点数量（例如 CART 树的二分）或使用聚类（如 CHAID）。\n\
  \n对于区间目标的决策树建模，与分类目标类似，分裂搜索的考虑因素保持不变，并使用相似或等价的分裂标准。回归和 ANOVA 中的方差相等假设如果被违反，可能导致决策树出现错误的分裂选择。目标转换（如取对数）可能改善分裂选择。SAS\
  \ Viya 的交互式训练设施允许用户选择变量和分割点进行建模；用户可以自行构建完整模型，或先定义初始分裂，其余分裂则由树算法自动完成。\n\nChapter\
  \ 4 介绍决策树的常见优缺点以及一些突出的次要用途。决策树可以直接处理缺失值，无需进行填补。常见的做法包括将缺失值放入能够最大程度提升纯度的子节点，或放入案例最多的节点；也可以利用与主要分裂变量高度一致的输入来为子节点分配案例。\n\
  \n变量重要性可以通过输入对纯度减少的贡献度量，或通过比较包含输入与不包含输入的树在统计指标（如平均平方误差）上的表现来计算。与其他回归和分类方法相比，决策树的优势在于易于解释和可视化，尤其是树较小时；它们在大数据规模上表现良好，并且提供多种处理缺失值的方法，包括\
  \ surrogate splits（替代分裂）。但决策树也有局限：回归树在预测空间的矩形区域上保持常数，缺乏捕捉平滑关系的灵活性；小数据变化会导致截然不同的分裂，削弱模型可解释性。随机森林模型在一定程度上缓解了这些问题。\n\
  \n决策树还有许多其他用途。它们是多元数据探索的有力工具，因为其可解释的可视化输出和对输入预处理需求低；在某些情况下，它们可以帮助识别回归模型中应加入的交互项。树可以用于选择后续模型（如回归、神经网络）的重要变量，因为它们对维度诅咒具有抵抗力，并且能够计算变量重要性；它们还能通过将类别输入的水平合并来降低后续模型的维度——水平平均目标值相似的水平被归入同一叶子；树可以将区间输入离散化，以帮助后续模型解释或捕捉输入与目标之间的非线性模式；它们还能帮助识别在其中可以拟合回归模型的广泛\
  \ segment。树还可用于缺失值 imputation，缺失值会基于预测树模型进行填补，其中缺失变量被视为目标，其他变量作为模型输入。树填补在 Imputation\
  \ node 中可用。\n\n\n\n\nChapter 5 描述了如何调整决策树。可以通过使用顶向下或底向上标准来找到“合适大小”的树。顶向下标准限制树的生长。CHAID\
  \ 算法倾向于使用此类标准，并依赖统计检验、α 值以及 p 值调整（Bonferroni），以限制最大树的大小。在底向上剪枝中，先生长一个大树，然后使用某些模型评估标准在后向方式剪除分支。该策略最初由\
  \ CART 决策树使用的成本复杂性剪枝提出。模型选择标准包括根据目标变量类型的准确率和平均平方误差，并应用于验证数据。在底向上剪枝时，树模型根据验证数据选择，如果存在验证数据。交叉验证是一种更经济的模型验证方法，它使用所有数据同时进行训练和验证。交叉验证在\
  \ Model Studio 的决策树节点中可用。\n\n当拟合多个决策树时，您可以参考 CART 和 CHAID 方法来指导树属性设置的选择。如果您不确定在构建决策树时应使用哪些超参数的值，建议使用\
  \ SAS `Vi​a` `autotuning` 功能。\n\nChapter 6 描述了树的集合并重点介绍森林模型。基于决策树的集合模型利用决策树固有的不稳定性，即小幅度的训练数据变化会导致大量竞争分裂，从而产生树结构的大幅变化。扰动并组合方法通过操纵数据分布或改变构建方法生成多个模型，然后取平均结果。Bagging\
  \ 在训练数据上进行抽样（有放回）并为每个样本拟合模型。Boosting 通过重新加权后续样本（基于前一步样本在目标分类中出现的错误）来自适应地调整样本。集合模型可以平滑个别树模型生成的预测表面，从而提升模型性能。\n\
  \n森林模型就是字面意思。它是一组随机选取子集数据的决策树，全部合并为一个结果。使用森林可以解决单个决策树固有的过拟合问题。SAS Viya 中的森林模型使用数百棵决策树构建随机森林。森林由多棵决策树组成，它们在两方面不同：第一，树的训练数据是从所有可用观测中有放回抽取的样本；第二，用于节点分裂的输入变量是从所有可用输入中随机选取的。在这些随机选取的变量中，最常与目标关联的输入变量用于划分规则。其余方面，树的训练方式与标准树相同。单棵树的训练数据会排除用于评估模型拟合的部分可用数据。\n\
  \nSAS Viya 的森林模型接受区间型和类别型目标变量。对于区间型目标，单棵树叶节点的预测等于该叶节点中包含的 bagged 训练观测的目标值的平均值。对于类别型目标，单棵树叶节点的目标类别的后验概率等于该类别在该叶节点的\
  \ bagged 训练观测中的比例。将所有树的预测或后验概率取平均，预测的依赖性会因不同训练样本而降低。增加树的数量既不会增加过拟合的风险，还可能降低它。但如果不同树的预测相关，则增加树的数量几乎没有改进。\n\
  \nChapter 7 涵盖了额外的森林模型。隔离森林（isolation forest）是一种专门构建的森林，用于异常检测而非目标预测。创建隔离森林时，它会在得分数据表中写入异常分数。\n\
  \n最近提出的深森林（deep forest），也称为 gcForest（多粒度级联森林），是一种新型的决策树集合方法。该方法生成具有级联结构的深森林集合，能够进行表示学习，通过端到端训练找出更好的特征。其表示学习能力可以通过多粒度扫描进一步增强，特别是在输入维度很高时，可能使\
  \ gcForest 具备上下文感知或结构感知能力。深森林的性能声称比深度神经网络（DNN）更具竞争力。\n\nChapters 8 解释了基于树的梯度提升模型。梯度提升树创建一个弱决策树的集合，以分阶段、迭代、顺序的方式构建。每棵树使用数据子集进行训练。梯度提升算法将弱学习者转化为强学习者。梯度提升的一个优势是它能够降低监督学习中的偏差和方差。所有点最初权重相同，分类正确的点赋予更低权重，分类错误的点赋予更高权重。模型随后专注于高权重点并使其分类正确，而之前正确分类的点现在可能被误分类。此过程会重复多次迭代。最终，所有模型根据其准确性赋予权重，模型结果合并为一个综合结果。\n\
  \n梯度提升模型可以通过 SAS Viya 的多种方式进行拟合，包括 Model Studio 中的 Gradient Boosting 节点、GRADBOOST\
  \ 过程等。梯度提升模型中的决策树在新的训练数据上训练，这些数据来源于原始训练数据。在提升过程中使用不同的数据训练不同的树，能够降低树的预测相关性，从而提升整体模型的预测效果。\n\
  \n算法会在不放回的情况下对原始数据进行采样，生成单棵树的训练数据。整个运行过程中会多次采样，每个生成的训练数据集合称为子样本。在某些情况下，梯度提升模型可能出现过拟合，导致在验证或测试数据上表现不佳。对抗式过拟合的方法是提前停止（early\
  \ stopping）。提前停止的另一个优势是，当停止准则在达到之前就满足时，可显著缩短训练时间。\n\nChapter 9 探讨了额外的梯度提升模型。梯度提升可以用于转移学习。通过辅助数据增加训练样本数量。为防止模型过度偏向辅助数据，梯度提升算法会下调与训练观测差异大的辅助观测的权重。\n\
  \n您可以在梯度提升模型中指定目标函数的分布。默认分布为区间型、二元型或多类型目标的高斯、二元或多类分布；Poisson 分布适用于计数数据；Tweedie 分布适用于保险中总损失的建模。\n\
  \n\n超参数调优在三种基于树的模型——决策树、随机森林和梯度提升——中均可使用，以便为各种选项找到最佳值。这些选项包括决策树中的分割准则、最大深度以及决策树中的桶数；随机森林中的训练数据抽样比例、最大树深度、树的数量以及每次分裂时需考虑的变量数；梯度提升中的\
  \ L1 和 L2 正则化参数、学习率、训练数据抽样比例以及每次分裂时需考虑的变量数。优化算法可从多种目标函数中选择，同时搜索方法包括基于遗传算法的方法。\n\n\
  在最后，提供了一个实践案例研究。\n\n# Is This Book for You?\n\n构建能够在新数据上表现良好的代表性树基机器学习模型需要对用于训练模型的数据以及各种树基算法的假设进行仔细考虑。选择适当的选项和最佳超参数值对于所建模的数据以及面对的业务问题至关重要。\n\
  \n如果您想了解树基模型以及决策树、随机森林和梯度提升树的所有细节，那么这本书就是为您准备的！讨论将帮助您从中级到高级水平快速从树基模型中获益。本书最适合希望使用\
  \ SAS Visual Data Mining and Machine Learning 在 SAS Viya 中构建决策树及决策树集的预测建模者和数据分析师。\n\
  \n# What Should You Know about the Examples?\n![image](img/f0031-01.jpg)\n\n**注**：Model\
  \ Studio 中有一个 Score Data 节点，可在管道的任意位置收集或累积计分代码。\n\n最后，Output 窗口显示最终决策树模型参数、变量重要性表以及削减迭代。\n\
  \n![image](img/f0031-02.jpg)\n\nTREESPLIT 过程用于创建包含 31 个叶节点的决策树。信息增益比是默认分裂准则，成本复杂度削减是默认削减方法。相关知识将在课程第\
  \ 3 课和第 5 课中讲解。\n\n10\\. 点击 **Assessment** 标签。\n\n![image](img/f0032-01.jpg)\n\n\
  第一个图表是 **Lift Reports**，显示模型深度随累计提升的关系。累计提升针对每个数据角色给出。若要查看其他随深度变化的统计量，请使用右上角的下拉菜单。其他统计量包括提升、收益、捕获响应百分比、累计捕获响应百分比、响应百分比和累计响应百分比。仅当目标为类变量时才显示此结果。\n\
  \n![image](img/f0032-02.jpg)\n\n**ROC Reports** 显示模型的 ROC（受体特征）图，给出灵敏度随 1‑specificity\
  \ 的变化。灵敏度针对每个数据角色给出。使用右上角的下拉菜单可查看其他统计量，如准确率和 F1 分数。仅当目标为类变量时才显示此结果。\n\n![image](img/f0033-01.jpg)\n\
  \n为帮助确定评分数据的最佳截断点，KS Cutoff 参考线会在 1‑specificity 取得最大灵敏度‑1‑specificity 差值的位置绘制。KS\
  \ Cutoff 线在 0.2 处绘制，此时 1‑specificity 为 0.293，灵敏度为 0.714（移动鼠标可查看）。\n\nFit Statistics\
  \ 输出显示按数据角色划分的模型拟合统计量表，最大化窗口即可看到完整内容。\n\n![image](img/f0033-02.jpg)\n\nFit Statistics\
  \ 表显示在 VALIDATE 分区上的平均平方误差为 0.1852，误分类率为 0.2678。\n\n最后，Event Classification 图展示了不同截断值下的混淆矩阵。\n\
  \n![image](img/f0034-01.jpg)\n\nEvent Classification 图是混淆矩阵在多个截断值下的可视化，使用的默认截断值为\
  \ 0.5，以及 TRAIN 分区的 KS 值 0.35 和 VALIDATE 分区的 KS 值 0.2。\n\n混淆矩阵包含真阳性（正确预测的事件）、假阳性（非事件被错误预测为事件）、假阴性（实际事件被错误预测为非事件）以及真阴性（正确预测的非事件）。使用下拉菜单可将图表信息以百分比或计数形式查看，也可查看汇总表格。仅当目标为二元变量时才显示此结果。\n\
  \n从 Event Classification 图可以直观看出，在我们的示例数据和模型中，几乎所有支持低偏差模型假设的分区都有大量正确（蓝色）预测。\n\n\
