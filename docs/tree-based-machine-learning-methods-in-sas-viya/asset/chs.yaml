  \n![image](img/EndOfDemo.jpg)\n\nCross Validation\n\nData partitioning is a simple\
  \ but costly approach to model validation. When the holdout set is small, performance\
  \ measures can be unreliable. You can choose not to split and build a CHAID‑type\
  \ tree using the p‑value associated with the chi‑square or F statistics as a forward\
  \ stopping (stunting) rule.\n\nAlternatively, you can split more efficiently using\
  \ k‑fold cross validation (BFOS 1984; Ripley 1996; Hand 1997). In five‑fold cross\
  \ validation, for example, the data are split into five equal sets. The model is\
  \ refit on each four‑fifths of the data using the remaining one‑fifth for assessment.\
  \ The five assessments are averaged. In this way, all the data are used for both\
  \ training and assessment. A five‑fold cross validation along with relevant properties\
  \ in Model Studio is illustrated Figure 5.20. In Model Studio, the TREESPLIT procedure\
  \ computes cross validation estimates of a fit statistic for each subtree in the\
  \ subtree sequence. It then uses those estimates to select the best subtree as the\
  \ final model.\n\nThe final estimate of the fit statistic is the weighted average\
  \ of the fit statistic computed for all k trees. Typically, the weights are the\
  \ number of observations in the validation data.\n\nBFOS (1984) proposed 10‑fold\
  \ cross validation for decision trees. This is a feature of CART methodology. The\
  \ complexity parameter, α, is used to map the optimal cross validated subtree to\
  \ the final subtree fit to the entire data set.\n\nThe Cross validation folds property\
  \ specifies the number of cross validation folds to use for cost‑complexity pruning\
  \ when there is no validation data. Values range from 2 to 20. The default value\
  \ is 10.\n\nThe 1–SE rule property specifies whether to perform the one standard\
  \ error rule when performing cross validated cost‑complexity pruning. By default,\
  \ this is deselected.\n\nFigure 5.21 is the plot of unpartitioned insurance data\
  \ on cross validation cost‑complexity. This plot is displayed only when cross validation\
  \ cost‑complexity pruning is performed. INS is the target variable, which is categorical\
  \ and therefore the plot displays the misclassification rate. For an interval target,\
  \ this plot displays ASE as a function of the number of leaves in a subtree. Error\
  \ bars are also given, indicating the average error rate plus or minus one standard\
  \ error. A vertical reference line is drawn to indicate which subtree was selected\
  \ as the final model. A horizontal reference line is drawn to represent the “1‑SE\
  \ Rule” even if it is not used for subtree selection.\n\nFigure 5.20: Five‑Fold\
  \ Cross Validation\n\n![image](img/f0173-01.jpg)\n\nFigure 5.21: Cross Validation\
  \ Cost‑Complexity Pruning with the 1‑SE Rule\n\n![image](img/f0174-01.jpg)\n\nThe\
  \ example shows that the minimum average misclassification rate, which is obtained\
  \ by 10‑fold cross validation, is 0.317. On the plot, this value is indicated by\
  \ a filled‑in circle. Information about the 1‑SE misclassification rate is also\
  \ included.\n\nBreiman’s 1‑SE rule chooses the parameter that corresponds to the\
  \ smallest subtree for which the misclassification rate is less than one standard\
  \ error above the minimum misclassification rate (Breiman et al. 1984). The parameter\
  \ value that corresponds to the 1‑SE rule is indicated by a star. The value 0.0028\
  \ corresponds to a tree that has only six leaves. The dotted vertical line indicates\
  \ the chosen tree.\n\nThe following code is used to produce the plot shown in Figure\
  \ 5.21:\n\nlibname mycas cas;\n\nlibname local ‘/home/student/casuser/VBBF’;\n\n\
  data mycas.insurance;\n\n   set local.insurance;\n\nrun;\n\nods graphics on;\n\n\
  proc treesplit data=mycas.insurance;\n\nclass ins inv loc mm mtg moved nsf res sdb\
  \ sav atm branch cc cd dda dirdep hmown ils ira inarea;\n\nmodel ins = age acctage\
  \ atmamt cashbk ccbal ccpurc atm branch cc cd cdbal crscore checks dda ddabal dep\
  \ depamt dirdep hmown hmval ils ilsbal ira irabal inarea income inv invbal loc locbal\
  \ lores mm mmbal mmcred mtg mtgbal moved nsf nsfamt pos posamt phone res sdb sav\
  \ savbal teller;\n\ngrow igr;\n\nprune costcomplexity(leaves=SE);\n\nrun;\n\nNotice\
  \ that the entire data set (without partition) is used for creating the decision\
  \ tree. Therefore, cross validation is automatically performed. Observe that the\
  \ LEAVES=SE suboption was specified.\n\n![image](img/Demo.jpg)Demo 5.2: Performing\
