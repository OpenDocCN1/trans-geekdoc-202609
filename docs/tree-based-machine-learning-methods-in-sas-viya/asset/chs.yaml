  \n12\\. 点击 ![image](img/Arrow1.jpg) 以展开 Tree Diagram，检查生成的决策树。移动鼠标指针至树节点时，会弹出包含节点信息的文本框，也可以滚动缩放查看细节。\n\
  \n13\\. 点击决策树顶层（根节点）的第一次分割后的左节点，向下滚动并缩放，查看该分区观测的特征。\n\n![image](img/f0035-01.jpg)\n\
  \n决策树会发现输入之间的交互关系。例如，保险年金（INS）与存单余额（CDBAL）可能不相关，除非储蓄余额（SAVBAL）小于 9553.75。树结构同时捕获了这两个输入，CDBAL\
  \ 的分裂点为 15300。\n\n此外，决策树会剔除冗余输入。储蓄余额（SAVBAL）和钱市余额（MMBAL）与保险年金（INS）高度相关，但树只需要其中一个输入——这里使用的是储蓄余额。相关性不等于冗余性。当\
  \ SAVBAL 与 MMBAL 相互相关时，它们是 **冗余** 的。决策树没有内置方法忽略冗余输入，可能会随意从相关输入集合中选择。因此，建议在使用决策树前先降低冗余度。\n\
  \n\n\n\nFinally, trees treat nominal and ordinal inputs on a par with interval ones.\
  \ Instead of the categorical area classification (RES) input, the split could be\
  \ at home value (HMVAL), an interval input.\n\nA tree gives an impression that certain\
  \ inputs uniquely explain the variations in the target. A completely different set\
  \ of inputs might give a different explanation that is just as good.\n\nBy default,\
  \ the growth process continues until the tree reaches a maximum depth of 10 (you\
  \ can specify a different limit by using the Maximum depth property). The result\
  \ is often a large tree that overfits the data and is likely to perform poorly in\
  \ predicting future data. A recommended strategy for avoiding this problem is to\
  \ prune the tree to a smaller subtree that minimizes prediction error, the concept\
  \ discussed in lesson 5.\n\nNote: The zoom functionality centers the diagram on\
  \ your cursor. A good tip is to position the mouse pointer on the part of the tree\
  \ that you are interested in investigating before zooming.\n\nYou can use a SAS\
  \ Code node with the following code to compute the correlation coefficients.\n\n\
