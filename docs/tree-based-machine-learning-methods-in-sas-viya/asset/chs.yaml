  \nRBAIMP 选项创建了使用随机分支分配（RBA）方法的变量重要性表。该表在正常变量重要性表（基于残差平方和 RSS 错误）之外生成。\n\n观察到两种方法的变量重要性有中等差异（例如，检查余额（DDABAL）和银行分支（BRANCH）输入在基于\
  \ RBA 的重要性中更为重要）。\n\n注意：由于随机化，RBA 变量重要性值可能与上述所示略有不同。\n\n37. 关闭输出窗口，关闭 SAS 代码节点的结果。\n\
  \n![image](img/EndOfDemo.jpg)\n\n## 决策树的优势与劣势\n\n决策树用于解决分类和回归问题。然而，决策树的主要缺点之一是会导致数据过拟合，这将在下一章节中讨论。Figure\
  \ 4.18 总结了决策树的主要优势和劣势。\n\n决策树的优势在于实现简单，直观易懂。事实上，模型结果对非技术人员极易解释。决策树可以快速拟合，并且能够轻松为新客户评分。\n\
  \nFigure 4.18: Strengths and Weaknesses of Decision Trees\n\n![image](img/f0141-01.jpg)\n\
  \n与线性模型（如线性回归和逻辑回归）不同，决策树能够在不指定关系形式的情况下处理目标变量与预测变量之间的非线性关系。\n\n缺失值的处理方式是将其纳入预测规则中（例如，若收入缺失，客户可被置于其自身输入空间而非从分析中删除）。\n\
  \n决策树对预测器变量的离群值具有鲁棒性，并且能够发现变量间的交互作用。交互作用是指当另一个预测变量的水平改变时，目标与预测变量之间的关系发生变化（例如，目标与收入的关系在男性与女性之间不同，决策树能够发现这一点）。应注意，交互作用属于非线性关系。\n\
  \n然而，像任何模型一样，决策树也有多项劣势。它们是不稳定的模型，即训练数据集的微小变化会导致树结构发生重大变化。\n\n决策树通过忽略无关预测变量来应对维度诅咒，但缺乏内置方法忽略冗余预测器。由于决策树可快速拟合且结构简单，这通常不是创建模型的问题。但在部署模型时，决策树可能会随意从相关预测变量集合中选择，这可能导致问题。为避免此问题，建议在拟合决策树前先减少冗余。\n\
  \n大型决策树可继续生长直至每个节点尽可能纯净。此类树称为最大树，通常会对数据进行过拟合。\n\n## 决策树的次要用途\n\n决策树可用于除预测建模之外的多种分析任务。Figure\
  \ 4.19 总结了决策树的重要次要用途。\n\n\n\n# 初步数据分析（IDA）和探索性数据分析（EDA）\n\n经验丰富的建模者在尝试拟合最终模型之前，会使用各种方法对数据进行探索和检查。初步数据分析（IDA）可能会发现输入或目标中的问题，如在第一个演示中（在\
  \ 第 2 章 所示）的时间失真。IDA 有助于获得数据的预测能力的初步印象。性能极度不足或极度优异都可能表明数据存在问题。\n\n图 4.19：决策树在决策树之外的用途\n\
  \n![image](img/f0142-01.jpg)\n\n决策树非常适合用于探索性数据分析（EDA）。在使用探索树时，需要关注二分或多路分割的问题以及确定树的适当大小。通常有用构建多种树的变体，并使用不同的设置。\n\
  \n决策树适合用于 IDA 和 EDA，原因如下：\n\n*   `interpretability`\n*   `no strict assumptions\
  \ about the functional form of the model`\n*   `resistant to the curse of dimensionality`\n\
  *   `robust to outliers in the input space`\n*   `no need for dummy variables for\
  \ nominal inputs`\n*   `no need to impute missing values`\n*   `computationally\
  \ fast (usually)`\n\n树木对罕见目标事件不强。如果不小心处理非常不平衡的样本，结果往往是没有树——只有根节点。\n\n许多预测建模者对树木作为最终模型感到不安。通常，树木被用作构建更熟悉模型（如逻辑回归）的辅助工具。标准回归模型受限于线性和加性（在链接尺度上）。它们需要更多的数据准备步骤，例如缺失值插补和名值变量的哑编码。当存在大量无关和冗余的输入变量时，其统计和计算效率可能会受到严重影响。\n\
  \n## 交互检测\n\nCHAID 中的 AID 代表自动交互检测。树木常被宣传为有助于检测交互作用。检测到交互作用后，可以将相应的交互项（或项）纳入回归模型，例如\
  \ logit(E(y)) = β0 + β1x1 + β2x2 + β3x3 + β13x1x3。\n\n树木如图 4.20 所示，通过输入的交互关系发现关系。例如，目标区间可能与输入\
  \ x2 不相关，除非 x1 小于 8。树木同时注意到了这两个输入。x2 在 2 处有分割。\n\nAID 是夸张的。树木并不像 ANOVA 表那样直接产生严谨测试交互效应的表格。仅凭树状图很难判断交互作用的强度。树木可以更准确地描述为自动交互容纳器。定性（\
  \ crossover）交互作用（效果逆转）在树中同一输入在不同区域的分割上更容易通过扫描检测。量化（ magnitude）交互作用很少能够检测。\n\n图 4.20：决策树中注意到的输入交互\n\
  \n![image](img/f0144-01.jpg)\n\n## 识别重要变量\n\n直观上，树中使用的变量具有不同程度的重要性。变量重要的关键在于其影响的强度以及影响的案例数量。\n\
  \n下面的公式捕捉了这种直观（Neville 1999）：\n\n1.  测量模型预测个体的重要性。具体来说，个体的重要性等于预测值（或收益）在有模型和没有模型的情况下的差值的绝对值。\n\
  \n2.  将个体的重要性在用于预测该个体的变量之间进行分配，然后\n\n3.  对所有个体的变量重要性进行平均。\n\n变量重要性表在本章前面已讨论。\n\n\
  ## 模型解释\n\n对机器学习模型（例如神经网络、梯度提升等灵活模型）的常见批评是难以理解预测。\n\n这种批评源于模型中复杂的参数化。虽然通过分析模型的实际参数很难获得深入的洞察，但通过分析得到的预测决策可以获得很多有价值的信息。\n\
  \n树木有时用于帮助理解其他模型的结果。熵或其他用于生成决策阈值的机制定义了输入空间中与主要决策相对应的区域。你可以用决策树代理模型来近似不可理解模型的预测。代理模型的思想是构建一个易于理解的模型，以描述该区域，如图\
  \ 4.21 所示。通过这种方式，即使神经网络模型本身无法理解，也可以通过它所使用的特征来理解其主要决策。\n\n图 4.21：决策树代理模型\n\n![image](img/f0145-01.jpg)\n\
  \n## 变量选择\n\n树木的另一种流行辅助用途是修改潜在输入变量集合。决策树选出的变量子集可以作为其他建模方法（尤其是非线性或非加性模型，如神经网络）的有前景的输入。对树木重要的变量不一定具有强线性加性效应。因此，使用树木进行输入选择在概念上更适合用于其他灵活模型，如神经网络。\n\
  \n你可以始终使用默认设置的决策树节点来选择输入。但这通常会导致为后续模型选择过少的输入。通过包含 surrogate 规则和创建最大树，可以选取更多输入。当你使用树木为灵活模型选择输入时，最好多选一些而不是少选。模型的复杂度优化方法通常可以弥补额外输入的影响。\n\
  \n改变 surrogate 的数量可以在变量选择过程中纳入 surrogate 分割。 surrogate 输入通常与选定的分割输入相关联。虽然通常不建议在预测模型中包含冗余输入，但许多灵活模型对一定程度的输入冗余容忍度较高。将\
  \ surrogate 纳入变量选择的优势在于，它可以让那些在树中没有显式出现但仍然是目标预测的重要指标的输入得以被选入。\n\n将 Subtree 方法改为\
  \ Largest 会导致树算法不剪枝。与在变量选择过程中添加 surrogate 分割类似，这会倾向于添加（可能无关）的输入到选择列表。\n\n图 4.22：树木的输入选择\n\
  \n![image](img/f0146-01.jpg)\n\n变量重要性表随后包括树木选出的所有变量的完整列表，如图 4.22 所示。只有 Importance\
  \ 值为非零的变量是决策树选出的变量。该列表包括在树中未显现但仍是目标预测的重要指标的 surrogate 变量。\n\n## 名值级别合并\n\n类别输入对参数化预测模型（如回归和神经网络）构成重大问题。可以通过为每个类别水平使用二元指示器（哑变量）将名值输入纳入回归或神经网络模型。由于每个类别水平都需要一个指示变量，单个输入可以占用比其他所有输入加在一起还要多的模型参数。当名值输入拥有大量水平（例如\
  \ ZIP 代码）时，这种做法会导致维度急剧增加。\n\n\n\n\n-   决策树在处理类别输入时表现出色。它们可以轻松地将类别变量的不同水平聚合在一起，并产生良好的预测。\n\
  \nFigure 4.23:`通过树木合并水平`\n\n![image](img/f0146-02.jpg)\n\n可以使用决策树来合并类别输入的水平。你只需使用感兴趣的类别变量作为唯一建模输入来构建决策树。如果树是仅使用一个名义输入来拟合的，叶节点代表输入水平的子集。分割搜索算法随后会将具有相似主要结果比例的输入水平进行分组。叶节点的\
  \ ID 替换输入的原始水平。任何类型的树都可以，但深度为一且具有多路径分割的树更易于直观理解。参见 Figure 4.23。\n\n| 根据专业考虑合并水平通常优于任何数据驱动方法。然而，在许多情况下，关于可能重要输入的知识是缺乏的。\
  \ |\n\n| --- |\n\n二进制化区间输入\n\n树也用于对区间输入的水平进行二进制化，以考虑线性模型中的非线性。原始输入随后被每个 bin 对应的哑变量所取代。这种方法可能不必要地膨胀维度，应谨慎使用（例如，在强烈的线性趋势下，树会产生许多叶节点，导致自由度的无谓增加），如\
  \ Figure 4.24 所示。对区间输入的二进制化通常应与诊断图（例如经验对数比图）一起进行。\n\n resulting model is a primitive\
  \ spline function with discontinuous constant segments between the split values\
  \ (knots). More sophisticated regression splines using higher order polynomials\
  \ joined smoothly at the knots might be preferable.\n\n缺失值插补\n\n为了避免因完整案例分析（complete-case\
  \ analysis）而在回归和神经网络中丢失数据，缺失值需要进行插补。回归插补（条件均值插补）是备受认可的方法。在回归插补中，缺失输入的值会作为其他输入的函数被预测。通常使用（广义）线性模型，其中目标是要插补的输入，预测者是其他输入。模型在非缺失案例上进行拟合。然后用拟合模型预测缺失案例的值。\n\
  \nFigure 4.24:`通过树对区间输入进行二进制化`\n\n![image](img/f0147-01.jpg)\n\nFigure 4.25:`通过树插补缺失值`\n\
  \n![image](img/f0148-01.jpg)\n\n当存在多个存在缺失值的输入时，如 Figure 4.25 所示，该方法需要拟合并保存多个回归模型。一个严重的缺点是缺失值对其他输入的影响：用于在回归模型中插补某一输入的其他输入本身也需要先进行插补，以避免完整案例分析。\n\
  \n树非常适合用于回归插补。它们可以在线性模型的位置使用回归树预测非缺失案例。它们不要求其他输入先行插补。此外，它们对插补模型的功能形式不作任何假设。当要插补的输入是区间型时，使用回归树；否则，使用分类树。\n\
  \n分层建模\n\n准备回归模型的分析师在数据代表两个亚群时还会面临另一个隐藏的陷阱：不同亚群之间输入与目标之间的关系可能存在差异。\n\n分析师的问题是认识到需要进行两次回归而不是一次。为此，一些分析师首先创建一个小决策树，然后在每个叶节点上分别运行一次回归，如\
  \ Figure 4.26 所示。这称为分层回归。不幸的是，树通常不会以分析师希望的方式将数据分割。\n\nFigure 4.26:`分层回归模型`\n\n![image](img/f0149-01.jpg)\n\
  \n交互式培训\n\n决策树是一种基本模型，它从数据出发，自动将数据分割成子集，以尝试将其分割成纯净子集以便预测目标。因此，它自然地构建出一套规则。然而，你经常需要能够在训练决策树时注入业务规则或域知识，而决策树本身并不了解这些信息。此时，你希望在训练过程中进行干预。这可以通过交互式训练决策树来实现。SAS\
  \ Viya 中的交互式决策树在机器学习算法的自动化和人工输入之间取得了平衡。交互式决策树通过提问引导你走向合适的决策路径，形成一种用户友好的流程图。\n\n\
  运行 Decision Tree 节点后，你可以在打开决策树时修改节点的分割和修剪逻辑。你可以根据输入是类型变量还是区间变量来修改分割逻辑。无论输入类型如何，你可以在分割节点时指定以下内容：\n\
  \n*   **变量** — 指定用于分割选定节点的变量。变量按对数 worth 排序。对数 worth 用于判断变量划分数据的效果。\n\n*   **分支**\
  \ — 指定从节点发出的每个分支的分割标准。你还可以添加分支并为每个分支指定分割标准。\n\n*   **缺失值** — 指定在分割节点时如何处理缺失值。\n\n\
  SAS Model Studio pipeline 根据手头数据和指定的分割与修剪设置，拟合一个“最优”树（见 Chapters 2 和 3）。有时用户希望根据业务规则和经验对该模型进行修改，以简化实现并提高可解释性。SAS\
  \ Visual Statistics 中的交互式培训使用户能够部分或完全规避自动、算法驱动的树增长和修剪。\n\n测验\n\n1\\. 你可以使用 SAS 代码节点执行哪些任务？（多选）\n\
  \na.   将新的或现有的 SAS 代码纳入 Model Studio pipeline。\n\nb.   编写独立的训练代码和 DS1 评分代码。\n\n\
  c.   使其他 SAS 程序可用于你的数据挖掘分析。\n\nd.   编写 SAS DATA 步骤，以创建定制的评分代码、有条件处理数据或操作现有数据集。\n\
  \n答案\n\n| 1. a, b, c, and d. |\n\n| --- |\n\n第 5 章：调整决策树\n\n模型复杂度与泛化\n\n如果你运行机器学习算法并不如预期工作，几乎所有情况下都是因为存在高偏差问题或高方差问题。了解你是存在偏差、方差或两者兼有至关重要。\n\
  \n拟合模型到数据需要在可能的模型空间中搜索。构建泛化良好的模型需要选择适当的复杂度。选择模型复杂度涉及偏差与方差之间的权衡，如 Figure 5.1 所示。复杂度不足的模型可能不够灵活，导致欠拟合。欠拟合系统性地漏掉信号（高偏差）。偏差是模型的平均预测值与实际值之间的差异。偏差高的模型对训练数据关注很少，过度简化模型。它在训练数据和验证数据上始终导致高错误。\n\
  \n\n\n\n-   一个天真模型化者可能会假设最复杂的模型始终能够战胜其他模型，但这并非事实。过于复杂的模型可能过于灵活，导致过拟合。过拟合是模型为了适应样本中的随机噪声（高方差）而进行的过度适应。方差是模型对给定数据点或值的预测变异性，反映了数据的离散程度。方差高的模型会过度关注训练数据，无法在未见过的数据上进行推广。因此，这类模型在训练数据上表现很好，但在验证数据上错误率很高。\n\
  \nFigure 5.1: Bias-Variance Trade-Off\n\n![image-   当模型无法捕捉数据的底层模式时，就会出现欠拟合。这类模型通常具有高偏差和低方差。\
  \  -   当模型同时捕捉噪声和底层模式时，就会出现过拟合。这类模型具有低偏差和高方差。  -   具有适度灵活性的模型能够实现最佳的泛化效果。-   一个大的决策树可以一直生长，直到每个节点尽可能纯净。如果至少有两条观测在输入变量上取相同的值但目标值不同，则无法实现完美的纯净度。在训练数据上纯净度最高的树即为最大分类树，如\
  \ Figure 5.2 所示。-   最大树是过拟合的结果。它同时适应目标的系统性变化（信号）和随机变化（噪声），但通常在新（噪声）数据上泛化能力差，如 Figure\
  \ 5.3 所示。-   一个只有少数分支的小树可能会欠拟合数据，导致未能充分适应信号，进而产生泛化效果差。Figure 5.2: Maximal Tree![image](img/f0152-01.jpg)\n\
  \nFigure 5.3: Overfitting\n\n![image](img/f0152-02.jpg)\n\nFigure 5.4: Underfitting\n\
  \n![image](img/f0153-01.jpg)\n\n-   树的复杂度是叶子数量、分裂数量以及树深度的函数。对于灵活模型（如决策树），确定复杂度至关重要。一个恰当拟合的树具有低偏差（适应信号）和低方差（不适应噪声）。模型复杂度的评估通常涉及偏差与方差之间的权衡。欠拟合的树（复杂度不足）具有高偏差和低方差，见\
  \ Figure 5.4；而过拟合的树具有低偏差和高方差。\n\n-   **Pruning: Getting the Right-Sized Tree** \
  \ \n    你可以先按照前面章节的描述生长决策树，这通常会产生一个对训练数据拟合良好的大树。但这类大树容易过拟合，因为它可能过度针对训练数据，难以在新数据上泛化。解决办法是找到一个更小的子树，使其在未见实例上的错误率更低。剪枝（pruning）指的是选择树复杂度的各种方法，主要分为**预剪枝（pre‑pruning）**和**后剪枝（post‑pruning）**，如\
  \ Figure 5.5 所示。你可以使用任意一种或两种策略来得到合适大小的树。\n\nFigure 5.5: Pruning Strategies\n\n![image](img/f0153-02.jpg)\n\
  \n-   **预剪枝** 防止在生长过程中生成无意义的分支。它通过设定终止条件，在树生成过程中提前停止某些分支。构建树时可以使用一些衡量分裂好坏的指标。预剪枝也称为**前向剪枝**或**自顶向下停止**。许多实践者认为停止规则无法奏效，其根本错误在于假设可以在不\
  \ deeply 理解数据的前提下设定合适的阈值。\n\n-   **后剪枝** 的另一种做法是先生成一个大的决策树，然后剔除无意义的分支。后剪枝即在生成最大树后，对其进行调整以提升在未见实例上的分类准确率。后剪枝也称为**后向剪枝**或**自底向上剪枝**。所有从大树中剪枝出的子树在同一时间可供比较，这为回溯剪枝提供了相对于只能逐个节点考虑的停止规则的优势。剪枝过程可以评估整个子树而非单个分裂点。选择的评估指标可以更贴合树的实际用途，而非分裂准则。常用的指标是误分类比例（Neville,\
  \ 1999）。\n\n-   **停止/剪枝的必要性**：为了避免过拟合，需要进行停止或剪枝。顶向下剪枝类似于回归中的前向变量选择；底向上剪枝类似于后向变量选择。剪枝后的理想树应表现出低偏差和低方差。\n\
  \n-   评估所有子树的错误是非常昂贵的。更实用的做法是关注一系列嵌套的树，它们是通过依次剪枝叶子而得到的。例如，图中展示了剪除节点 3 的叶子（终端节点 4\
  \ 与 5）来形成嵌套子树的过程。在嵌套子树中，节点 3 变为叶子，包含之前位于节点 4 与 5 的所有观测。此过程可重复，直到只剩根节点。也可以通过不让树在节点 3\
  \ 之上继续生长（即停止或预剪枝）来实现相同效果。\n\n-   **Pre‑Pruning Options**  \n    树的大小可能是决定质量的最重要因素，往往比单个良好分裂更关键。树过小无法描述数据；树过大导致叶子数据量不足，难以在新样本上做出可靠预测。深层分裂若基于数据量过少，则不可靠。\n\
  \n    前向停止规则可以基于以下条件：  \n    1. 限制树的最大深度；  \n    2. 限制数据的碎片化程度；  \n    3. 统计显著性（如卡方或\
  \ F 检验），如 Figure 5.6 所直观展示。\n\n-   **Top‑down pruning options in Model Studio**：\
  \  \n    *   默认的显著性水平为 0.2（logworth=0.7），可通过“显著性水平”选项进行修改。  \n    *   决策树节点的默认最大深度为\
  \ 10，可通过“最大深度”选项调整。  \n    *   “最小叶子大小”选项规定每个分裂后子节点必须包含的最小观测数，低于该数值的分裂将被视为不显著。\n\
  \n-   若只希望进行预剪枝，可将 **Subtree Method** 设为 **Cost complexity** 或 **Reduced-error**，并将\
  \ **Selection method** 设为 **Largest**。\n\nFigure 5.6: Top‑Down Stopping Rules (Pre‑Pruning)\n\
  \n![image](img/f0155-01.jpg)\n\n![image](img/f0155-02.jpg)\n\n1. 该属性组合将不会执行任何后剪枝。\n\
  \n   例如，若在满足某阈值以下的情况下不再对节点进行拆分，则可视为一种停止规则。若使用卡方或 F 检验作为分裂准则，则 p‑value 本身即为自然的停止条件，即当不存在统计显著的分裂时停止生长。此方法在\
  \ Figure 5.7 中示意，其中 m 为分裂数量。其缺点是多次选择会破坏检验的分布理论，导致 p‑value 过小。\n\n   Kass (1980)\
  \ 提出的 **Bonferroni 调整** 有两大用途：  \n   * 使得不同输入的潜在分裂数量之间的分裂选择保持一致。\n\n\n\n\nto correct\
  \ the p‑values for the effects of multiple selection\n\nFigure 5.7: Top-Down Pruning\
  \ Example\n\n![image](img/f0156-01.jpg)\n\nThe Bonferroni adjustments are only useful\
  \ approximations that are applied because the exact statistical distributions of\
  \ the tests are intractable. (With trees, they are not necessarily conservative\
  \ approximations.)\n\nEven if you could determine the correct p‑value, there is\
  \ no rational method for deciding what value is significant enough. In scientific\
  \ applications of statistical inference, the custom is to use significance levels\
  \ of 0.05 (logworth = 1.3) or 0.01 (logworth = 2).\n\nPost-Pruning Options\n\nIn\
  \ bottom-up (post) pruning, a large tree is grown and then branches are removed\
  \ in a backward fashion using some model selection criterion. The bottom-up strategy\
  \ of intentionally creating more nodes than can be used is also called retrospective\
  \ pruning.\n\nOne of the simplest forms of pruning is reduced error pruning. Two\
  \ other commonly used pruning algorithms for error minimization are C4.5’s error-based\
  \ pruning (Quinlan 1993) and CART’s cost-complexity pruning (Breiman et al. 1984).\
  \ Figure 5.8 summarizes their salient features along with relevant property options\
  \ in the Decision Tree node in Model Studio.\n\nThis post-order traversal of the\
  \ tree replaces a subtree by a single leaf node when the estimated error of the\
  \ leaf replacing the subtree is lower than that of the subtree. This involves finding\
  \ an honest estimate of error, which is defined as one that is not exceedingly optimistic\
  \ for a tree that was built to minimize errors in the first place. The resubstitution\
  \ error (error rate on the training set) usually does not provide a suitable estimate\
  \ since a leaf node replacing a subtree will never have fewer errors on the training\
  \ set than the subtree.\n\nCost-Complexity Pruning\n\nCost-complexity pruning is\
  \ a widely used pruning method that was originally proposed by Breiman et al. (1984).\
  \ You can request cost-complexity pruning for either a categorical or continuous\
  \ target.\n\nFigure 5.8: Bottom-Up Selection Criteria (Post-Pruning)\n\n![image](img/f0157-01.jpg)\n\
  \nThe cost-complexity pruning method helps prevent overfitting by making a trade-off\
  \ between the complexity (size) of a tree and the error rate. Thus, large trees\
  \ with a low error rate are penalized in favor of smaller trees. The cost complexity\
  \ of a tree T is defined in Figure 5.9. It is also known as the CART pruning method.\n\
  \nFor a categorical response variable, the misclassification rate is used for the\
  \ error rate; for a continuous response variable, the residual sum of squares (RSS),\
  \ also called the sum of square errors (SSE), is used for the error rate. Only the\
  \ training data are used to evaluate cost complexity.\n\nBreiman et al. (1984) show\
  \ that for each value of a, there is a subtree of T that minimizes cost complexity.\
  \ When α\\=0, this is the full tree, T0. As α increases, the corresponding subtree\
  \ becomes progressively smaller, and the subtrees are in fact nested. Then, at some\
  \ value of α, the root node has the minimal cost complexity for any α greater than\
  \ or equal to that value. Optimal α is represented in Figure 5.10. Because there\
  \ are a finite number of subtrees, each subtree corresponds to an interval of values\
  \ of α; that is,\n\n\\0, α1) = interval where T0 (the full tree) has minimal cost\
  \ complexity  \n\n\\[α1, α2) = interval where T1 has minimal cost complexity  \n\
  \n     :::                        :::                        :::  \n\n\\[αm, ∞)\
  \ = interval where Tm (the root node) has minimal cost complexity\n\nFigure 5.9:\
  \ Cost-Complexity of a Tree\n\n![imageFigure 5.10: Cost-Complexity Parameter![image](img/f0158-01.jpg)\n\
  \nThe decision tree in SAS Viya uses weakest-link pruning, as described by Breiman\
  \ et al. (1984), to create the sequence of α1, α2, …, αm values and the corresponding\
  \ sequence of nested subtrees, T1, T2, …, Tm.\n\nFinding the optimal subtree from\
  \ this sequence is then a question of determining the optimal value of the complexity\
  \ parameter α. This is performed either by using the validation partition or by\
  \ using cross validation. In the first case, the subtree in the pruning sequence\
  \ that has the lowest validation error rate is selected as the final tree. When\
  \ there is no validation partition, k-fold cross validation can be applied to cost-complexity\
  \ pruning to select a subtree that generalizes well and does not overfit the training\
  \ data (Breiman et al. 1984; Zhang and Singer 2010).\n\nC4.5 Pruning\n\nQuinlan\
  \ (1987) first introduced pessimistic pruning as a method of pruning classification\
  \ trees. In this method, the estimate of the true error rate is increased by using\
  \ a statistical correction to prevent overfitting. C4.5 pruning (Quinlan 1993) evolved\
  \ from pessimistic pruning to use an even more pessimistic (that is, higher) estimate\
  \ of the true error rate. An advantage of methods such as pessimistic and C4.5 pruning\
  \ is that they enable you to use all the data for training instead of requiring\
  \ a holdout sample.\n\nIn C4.5 pruning, the upper confidence limit of the true error\
  \ rate based on the binomial distribution was used to estimate the error rate. (See\
  \ Figure 5.11.) Decision trees in SAS Viya implement a C4.5 algorithm variant that\
  \ uses the beta distribution in place of the binomial distribution to estimate the\
  \ upper confidence limit.\n\n| The C4.5 pruning method is available only for categorical\
  \ response variables, and it uses only training data for tree pruning. |\n\n| ---\
  \ |\n\nFigure 5.11: Pessimistic Pruning in C4.5\n\n![image](img/f0159-01.jpg)\n\n\
  Figure 5.12: Simplified Illustration of Steps Involved in C4.5 Pruning\n\n![image](img/f0159-02.jpg)\n\
  \nThe C4.5 pruning method follows these steps:\n\n1.  Grow a tree from the training\
  \ data table, and call this full, unpruned tree T0.\n\n2.  Set i = 0, and do the\
  \ following until Ti is only the root node:\n\n    a. For each leaf (terminal node)\
  \ in the tree Ti, solve the following equation for pl (which is the adjusted prediction\
  \ error rate for leaf l):  \n\n       $\\\\alpha = 1 - \\\\frac{\\\\Gamma\\\\left(\
  \ {N\\_{l} + 1} \\\\right)}{\\\\Gamma\\\\left( {F\\_{l} + 1} \\\\right)\\\\Gamma\\\
  \\left( {N\\_{l} - F\\_{l}} \\\\right)}{\\\\int\\_{0}^{pl}{v^{F\\_{l}}\\\\left(\
  \ {1 - v} \\\\right)^{N\\_{l} - F\\_{l} + 1}dv}}$  \n\n     Here the confidence\
  \ level α is the value of the confidence level, Fl is the number of failures (misclassified\
  \ observations) at leaf l, Nl is the number of observations at leaf l, and the function\
  \ Γ(x) is defined as  \n\n       *Γ*(*x*) = ∫[0]^∞*v*^(*x* − 1)*e*^( − *v*)*d**v*\
  \  \n\n    b. Given these values of pl, use the following formula for the prediction\
  \ error Ei of tree Ti  \n\n    $E\\_{i} = {\\\\sum\\\\limits\\_{l \\\\in T\\_{i}}N\\\
  _{l}}p\\_{l}$  \n\n    c. For each node in tree Ti that has only leaves as children,\
  \ create a candidate subtree by pruning those leaves.\n\n    d. For each candidate\
  \ subtree, use the equations from steps 2 and 3 to calculate its prediction error.\
  \ Then select the candidate subtree that has the largest decrease (or smallest increase)\
  \ in prediction error, Ei. Let this be the next subtree in the sequence, Ti+1.\n\
  \n    e. Set i = i+1.\n\n3.  Calculate the change in error between each pair of\
  \ consecutive subtrees, Δi = Ei \\- Ei‑1 for each i =1, …, m.\n\n4.  Find the smallest\
  \ integer j such that Δj > 0.\n\n5.  Select the subtree Tj‑1 as the final subtree.\n\
  \n\n\n\n在每个节点中，假设一个服从β分布的误分类数据数量，估计误分类数据的上限置信度。该置信度随后作为未来数据的误差率估计。剪枝树通过最小化叶节点上限之和来实现最小化。\n\
  \n减误差剪枝\n\nQuinlan 的减误差剪枝（1987）基于在验证分区的误差率最小化来进行剪枝和子树选择，随后在整个子树序列中进行。误差率基于分类响应变量的误分类率，以及连续响应的\
  \ ASE。\n\n对于在 1 到 n 个叶节点的树中生长的任何子树 T，定义其复杂度或大小（叶节点数）为 L，并定义 R(L) 为验证集的误分类成本。\n\n\
  在模型工作室中，剪枝过程从拥有 L 个叶节点的最大树 Tmax 开始。最大树记为 TL。减误差剪枝从最大树 T0 创建子树序列，一直到根节点 Tm。构建一系列越来越小的树\
  \ TL、TL-1、TL-2 …、T1，满足以下条件：\n\n图 5.13：减误差剪枝的步骤 1 和 2\n\n![image](img/f0161-01.jpg)\n\
  \n对于所有 Hi，其中 1≤Hi≤L，考虑所有大小为 Hi 的子树类 THi。从序列中选择能最小化 R(THi) 的子树。这些步骤在 Figure 5.13\
  \ 中图形化表示。\n\n随后，选择验证误差最小的子树作为最终子树，如 Figure 5.14 中的虚线所示。剪枝可以在验证数据上出现误差开始上升时立即停止，正如\
  \ Quinlan 原先描述的那样；继续剪枝以回到根节点生成子树序列，则可让你选择一个仍保持可接受误差率的更小树。\n\n顶向下（预）剪枝通常更快，但被认为不如自底向上（后）剪枝有效。Breiman\
  \ 和 Friedman 在批评 FACT 算法时（Loh and Vanichsetakul 1988），讨论了在 CART 方法开发过程中对停止规则的实验：\n\
  \n图 5.14：减误差剪枝的步骤 3\n\n![image](img/f0161-02.jpg)\n\n“每个停止规则都在数百个结构不同的模拟数据集上进行了测试。每个新的停止规则都在某些数据集上失败。直到我们构建了一个非常大的树并通过交叉验证控制剪枝程度，再对其进行剪枝，才观察到一致的效果。”\n\
  \n剪枝要求\n\n剪枝通过移除无法预测或分类实例的树部分来减小决策树的大小。自底向上（后）剪枝有两个要求：\n\n* 真实衡量性能的方法  \n\n    树基模型的目的是概括性，即对新数据的预测性能。在用于拟合模型的数据上评估模型通常会导致乐观偏差。真实评估，与偏差-变异权衡高度相关，需要在未在训练过程中使用的数据上计算误差指标。\n\
  \n* 相关的模型选择标准  \n\n    比较多个模型时，必须选择合适的拟合统计量（或统计量）。这些统计量通常基于未在训练过程中使用的数据。对于一系列模型（可能由自动选择流程生成），可以绘制拟合度量与复杂度指标的关系图。对于决策树模型，该指标等价于模型中的叶节点数。\n\
  \n真实评估\n\n最简单的纠正乐观偏差的策略是数据分割，其中一部分数据用于拟合模型，其余数据保留用于经验验证。你可以直接将数据划分为训练集和验证集（或可选地加入测试集）。验证数据用于模型比较。当数据量较小时，数据分割效率低。从训练集中移除数据会降低拟合质量。此外，仅基于单个验证集评估性能可能导致结果不精确。\n\
  \n一种更高效但计算成本更高的 remedy 是 k 折交叉验证。在 k 折交叉验证中，性能指标在 k 个模型上取平均。每个模型使用 (k–1)/k 的数据进行拟合，并在剩余的\
  \ 1/k 数据上进行评估。k 个保留集的平均值用于真实估计在完整数据集上拟合模型的性能。（交叉验证在本章后面进一步讨论。）\n\n模型选择标准\n\n模型性能通常呈现出相对直观的趋势。随着复杂度增加（即在树中增加叶节点数），训练数据上的拟合效果变好。到一定程度，拟合可能停滞，但在训练数据上，模型复杂度越高，拟合越好。这部分改进归因于模型捕捉到相关趋势，而捕捉趋势正是建模的目标。然而，部分改进是由于模型识别训练数据中的噪声。这种行为被称为过拟合。由于这些噪声不太可能在验证数据或未来观测中重复出现，合理的做法是消除这些模型。因此，对不同复杂度的模型在验证数据上的拟合也要绘制图表。验证拟合曲线的典型行为是随着模型复杂度增加而上升（更复杂的模型能够捕捉更多有用模式），随后出现平台，最终可能出现性能下降，如\
  \ Figure 5.14 所示。性能下降是由于过拟合。平台表示那些没有基于拟合论据的更复杂模型。合理的规则是选择验证拟合统计量最高的模型所对应的复杂度。\n\n\
  将训练结果和验证结果一起绘制，可进一步评估模型的泛化能力。通常，从训练数据到验证数据的性能会下降，这种现象有时被称为收缩（shrinkage），一些建模者使用它来衡量所选模型的泛化能力。例如，选择模型的规则可能是：“在训练结果到验证结果的收缩不超过\
  \ 10% 的前提下，选择验证拟合度量最高的最简单模型。”\n\n对于分类问题，最合适的泛化度量取决于正确和错误分类的数量及其后果。\n\n图 5.15：子树选择\n\
  \n![image](img/f0163-01.jpg)\n\n对于许多目的，包括区间目标的分析，平均平方误差被发现是选择验证数据上子树的非常有效的通用方法。Figure\
  \ 5.15 展示了二元目标的子树选择。决策树算法可能会选择两叶子子树或四叶子子树，因为两叶子子树的误分类率最低，而四叶子子树在验证数据上的平均平方误差最小。\n\
  \n如果有验证数据，树模型会基于验证数据进行选择。常用的选择标准是区间目标的平均平方误差或分类目标的误分类率。\n\n用户指定的子树\n\n\n\n\n-  \
  \ 使用 cost‑complexity 或 reduced‑error pruning 创建子树序列时，可能需要从默认选中的树中选择另一棵树。例如，您可能有一棵叶子数稍少、错误稍大但更为简洁的子树，而它的错误小于\
  \ reduced‑error pruning 所确定的最小误差子树。您可以覆盖已选子树，转而选择由 cost‑complexity 或 reduced‑error\
  \ pruning 生成且拥有 n 个叶子的子树，其中 n 在设置 Selection method 为 N 时通过 Number of leaves 属性指定。此外，若使用\
  \ cost‑complexity pruning，还可以通过 Cost‑complexity alpha 属性覆盖已选子树。这些属性选项在 Figure 5.16\
  \ 中显示。\n\n-   或者，您可能希望选择由 Selection method 属性设置为 Largest 创建的最大树。即使最终选择了未剪枝的最大树，您仍可查看依据指定剪枝误差度量创建的子树序列的统计信息。\n\
  \n**Confusion Matrix**\n\n混淆矩阵是实际类别与预测类别的交叉表，左侧的 Figure 5.17 显示了四个计数：真阳性（nTP）、真阴性（nTN）、假阳性（nFP）和假阴性（nFN）。真阳性（TP）是已知的主要结果且被预测为主要结果的情况；真阴性（TN）是已知的次要结果且被预测为次要结果的情况；假阳性（FP）是被预测为主要结果但实际上是次要结果的情况；假阴性（FN）是被预测为次要结果但实际上是主要结果的情况。\n\
  \n混淆矩阵假设一个分配（决策）规则。最原始的规则将案例分配到后验概率最大的类别。二元目标情况下，这相当于对后验概率设定 50% 的置信度阈值。\n\nModel Studio\
  \ 会自动根据这种偏差调整评估指标、评估图表和预测估计。运行管道后，您可以查看评分代码。评分代码包含标题为 “Adjust Posterior Probabilities”\
  \ 的章节，该代码块通过将后验概率乘以上述实际概率与基于事件抽样值的比值来修正后验概率。\n\n**Tree Accuracy**\n\n树的准确率可以作为每片叶子准确率的加权平均值计算，权重为节点大小，如\
  \ Figure 5.18 所示。\n\n准确率等于每片叶子中观测值的比例乘以该叶子中正确分类的比例。\n\n例如，计算图中所示树的训练准确率（参考 Figure 5.19）：\n\
  \n- 左支出 42% 的观测落入左支，全部被归类为 1，其中 85% 被正确分类。左支的准确率为 (0.42)(0.85)。\n- 右支 58% 的观测落入右支，全部被归类为\
  \ 0，其中 91% 被正确分类。右支的准确率为 (0.58)(0.91)。\n\n训练准确率 = (0.42)(0.85) + (0.58)(0.91) =\
  \ 0.88。验证准确率的计算方式相同。\n\n**Figure 5.18:** 决策树中的准确率  \n![image](img/f0166-01.jpg)\n\
  \n**Figure 5.19:** 最大化准确率  \n![image](img/f0166-02.jpg)\n\n- 根据后验概率的最大值进行分类并不总是合理，尤其是在罕见目标事件中（例如，所有案例可能全部被归为同一类）。\n\
  \n- 单纯累加正确分类数并未考虑某些正确分类的价值更高，或某些误分类代价更高的情况。\n\n这两点相互关联。如果能够指定合适的收益和损失，统计决策理论可用于确定能最大化收益或最小化损失的最优决策规则。\n\
