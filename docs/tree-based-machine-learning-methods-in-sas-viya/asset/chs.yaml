  \ c and d || 3. a and c || 4. c || 5. True |\n\n-   **Chapter 7: Additional Forest\
  \ Models**\n\n-   **Open-Source Random Forest Models**\n\n-   近年来，许多数据科学家使用 SAS\
  \ 软件、Python、R 和其他开源或供应商特定的工具来混合匹配分析生命周期的各种任务。SAS 可以将开源功能纳入其分析生态系统并扩展其能力。您可以通过将 SAS\
  \ 与开源技术结合，充分利用两者的优势。术语“开放”表明 SAS 构建和部署分析的能力可以通过多种编程语言访问——不仅仅是 SAS，还包括 Python、R、Lua、Java\
  \ 或 RESTful API。将 SAS 与开源技术集成通常有两种主要优势：\n\n-   1.  程序化访问 SAS 使用开源软件\n\n-   2.  将开源模型引入\
  \ SAS 进行并列比较。\n\n-   这引出了 SAS Viya 中两种开放性的类型：第一种是 SAS 在开源中的应用，第二种是开源在 SAS 中的应用。如\
  \ Figure 7.1 所示。\n\n-   **SAS to Open-Source Languages and Interfaces (SAS in Open\
  \ Source)**\n\n-   您可以使用多种开源语言管理数据并创建分析模型。多个 SAS 接口可用于连接 CAS，包括 SAS Studio、Model\
  \ Studio、SAS Visual Analytics、SAS Enterprise Guide、SAS Display Manager 等。除了 SAS，您还可以使用\
  \ Java、Lua、Python 或 R 连接 CAS。\n\n-   **Figure 7.1: SAS Viya Integration with Open-Source\
  \ Software**\n\n-   ![image](img/f0227-01.jpg)\n\n-   SAS 在开源中的应用将在 Chapter 9 中讨论。\n\
  \n-   **Open Source to SAS Language and Interfaces (Open-Source in SAS)**\n\n- \
  \  有时，将开源技术组件纳入 Model Studio 可能很有好处。SAS Viya 的开源支持 Python 和 R 语言，需要 Python 或 R 及必要的包在与\
  \ SAS 计算服务器相同的机器上安装。它从 SAS Cloud Analytic Services 下载数据样本用于 Python 或 R 代码，并通过 Base\
  \ SAS Java Object 使用数据框或 CSV 文件传输数据。\n\n-   开源在 SAS 是本章的主要关注点。\n\n-   [“SAS® and\
  \ Open Source: Two Integrated Worlds” is a great paper for more information. ([`www.sas.com/content/dam/SAS/support/en/sas-global-forum-proceedings/2019/3415-2019.pdf`](https://www.sas.com/content/dam/SAS/support/en/sas-global-forum-proceedings/2019/3415-2019.pdf))\
  \ ]\n\n\n\n\n-   [开源代码节点](https://communities.sas.com/t5/SAS-Communities-Library/How-to-execute-Python-or-R-models-using-the-Open-Source-Code/ta-p/499463)\
  \ 使得用户能够原型化可能存在于开源语言但尚未被纳入 Model Studio 作为直接节点的机器学习算法。随后，如果需要评估并将 Python 或 R 模型纳入模型比较，该节点可以移动到监督学习组。该节点可在任何版本的\
  \ Python 或 R 软件中执行。\n\nFigure 7.2: Salient Features of Open Source Code Node\n\n\
  ![image](img/f0228-01.jpg)\n\nFigure 7.3: Code Editor\n\n![image](img/f0229-01.jpg)\n\
  \n选择 Python 或 R 语言（在属性中）后，点击 Figure 7.3 中所示的 **Open Code Editor** 按钮，在编辑器中输入相应代码。由于该代码不会在\
  \ CAS 中执行，默认会生成并下载一个数据样本（10,000 条观测），以避免大数据的移动。使用 **Data Sample** 属性控制样本大小和方法。请谨慎使用，不要在输入数据量大时指定全部数据或过大的样本。在与其他监督学习节点进行模型比较时，请注意该节点可能并未使用全部数据。\n\
