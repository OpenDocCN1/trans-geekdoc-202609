  \ Subtrees of this large tree are then examined using the cost‑complexity criterion.\
  \ In this case, the 21‑leaf subtree is selected because it has the smallest misclassification\
  \ rate.\n\n![image](img/f0170-01.jpg)\n\n8\\. Close the Results of the DT Multiway\
  \ Split node.\n\n9\\. Select the Decision Tree node now.\n\n10\\. Open the Results\
  \ of the Decision Tree node.\n\n![image](img/f0171-01.jpg)\n\nRecall that the subtrees\
