  \ Learning 和自动调优**\n-   您可以对已训练好的梯度提升模型进行自动调优。\n-   本样本程序使用 SAS 提供的 `Sampsio` 库中的\
  \ `HMEQ` 数据集，该数据集包含 5,960 名抵押贷款申请人的观测。变量 `Bad` 表示客户是否偿还贷款或违约。\n-   默认情况下，自动调优从模型训练动作的默认超参数设置开始，除非显式设置。这些默认值作为基准模型，用于后续比较。可以通过直接设置参数值，或在调用\
  \ `tune` 动作时使用 `tuningParameters initValue` 选项来实现。\n-   proc `cas noqueue;`\n- \
  \  `autotune.tuneGradientBoostTree result=r /`\n-   `trainOptions={`\n-   `table={name='HMEQ',\
  \ vars={'CLAGE', 'DEBTINC', 'LOAN',`\n-   `'MORTDUE', 'VALUE', 'REASON', 'JOB',\
  \ 'bad'}}`,\n-   `inputs={'CLAGE', 'DEBTINC', 'LOAN', 'MORTDUE',`\n-   `'VALUE',\
  \ 'REASON', 'JOB'}`,\n-   `target='bad',`\n-   `nominals={'REASON', 'JOB', 'bad'}`,\n\
  -   `casOut={name='gbt\\_hmeq\\_model', replace=true}`\n-   `nbins=55`\n-   `}`\n\
  -   `tunerOptions={seed=3791538}`\n-   `;`\n-   `print r;`\n-   `run;`\n-   `quit;`\n\
  -   另一种写法：\n-   proc `cas noqueue;`\n-   `autotune.tuneGradientBoostTree result=r\
  \ /`\n-   `trainOptions={`\n-   `table={name='HMEQ', vars={'CLAGE', 'DEBTINC', 'LOAN',`\n\
  -   `'MORTDUE', 'VALUE', 'REASON', 'JOB', 'bad'}}`,\n-   `inputs={'CLAGE', 'DEBTINC',\
  \ 'LOAN', 'MORTDUE', 'VALUE',\n-   'REASON', 'JOB'}`,\n-   `target='bad',`\n-  \
  \ `nominals={'REASON', 'JOB', 'bad'}`,\n-   `casOut={name='gbt\\_hmeq\\_model',\
  \ replace=true}`\n-   `}`\n-   `tunerOptions={seed=3791538}`\n-   `tuningParameters\
  \ = {`\n-   `{name=”nBins”, initValue=55}`\n-   `};`\n-   `;`\n-   `print r;`\n\
  -   `run;`\n-   `quit;`\n-   还有 `historyTable` 和 `lookupTable` 选项：\n-   `historyTable={history\\\
  _table}` 指定 `autotune` 动作创建的 CAS 表，其中包含所有评估历史数据点。\n-   `lookupTable={lookup\\_table}`\
  \ 指定 `autotune` 动作用于评估查找的 CAS 表。\n-   `lookupTable` 确保不重复配置，并允许从 `lookupTable` 选择之前调优作业的最佳模型作为初始模型，避免重新训练。\n\
  -   **梯度提升泊松和 Tweedie 回归树**\n-   在 SAS Viya 梯度提升算法中，目标函数的默认分布为二元目标的 `BINARY`、类别目标的\
  \ `MULTINOMIAL`、区间目标的 `GAUSSIAN`。但在实际操作中，并非所有区间目标都服从正态分布。当观测的分布属于指数家族时，可以使用相应的广义线性模型分布函数。此外，还可以使用非正态分布构建梯度提升回归模型。图\
  \ 9.9 展示了除正态分布之外常用的分布。\n-   区间目标的属性（或 `GRADBOOST` 语句中的 `DISTRIBUTION=` 选项）决定在寻找节点划分时优化的目标度量。可能的取值为\
  \ `Normal`、`Poisson` 和 `Tweedie`。二元或类别目标的分布分别为二元或多项，相应地。\n-   梯度提升可以视为具有相同底层分布的广义线性模型的扩展，但能够实现更好的预测。更多细节请参见\
  \ Friedman, 2001。\n\n\n\n-   波伊森分布常用于分析计数数据，其中因变量为非负整数（0、1、2、3 等）。在许多方面，波伊森分布是计数数据的基准分布，就像正态分布是连续数据的基准分布一样。波伊森分布也可用于建模事件的速率或发生频率。此类结果在医学、生物学、社会科学、农业、工程和商业等领域中普遍存在。OFFSET=\
  \ 选项可用于对给定暴露度调整后的速率进行建模。保险建模者通常会分别构建频率和严重性模型，然后将两者结合。很多时候，计数数据的零值过多，无法使用标准波伊森分布，此时必须使用零膨胀波伊森分布或\
  \ Tweedie 分布。\n\nFigure 9.9: Objective Function Distribution\n\n![image](img/f0308-01.jpg)\n\
  \nTweedie 分布族并不像指数族中的某些分布那样广为人知，尽管它们在保险、微生物学和基因组学等许多领域中被广泛使用。Tweedie 分布是指数分散族的一个特例，其方差等于\
  \ φμ^p，其中 μ 是均值，φ 是分散参数，p 是在 Tweedie (1984) 中发现的指数参数（参考链接 Tweedie (1984)）。当 p 在\
  \ 0 到 1 之间时，该分布未定义。Tweedie 分布可简化为许多其他著名分布。例如：\n\n- 当 p 为 0 时，分布为正态分布；\n- 当 p 为 1\
  \ 时，分布为泊松分布；\n- 当 p 为 2 时，分布为伽玛分布；\n- 当 p 为 3 时，分布为倒高斯分布；\n- 当 1 < p < 2 时，分布为复合泊松-伽玛混合分布，可定义伽玛尺度参数；\n\
  - 当 p > 1 时，均值为正值。\n\n最有趣的范围是 1 到 2 之间，在此范围内 Tweedie 分布逐渐失去 0 的质量，随着从泊松分布向伽玛分布转变。此情况下，Tweedie\
  \ 随机变量可从复合泊松分布（参考链接 Smyth 1996）生成。这是在 PROC GRADBOOST 中的 TWEEDIE 分布，默认 POWER=p 为\
  \ 1.5。在 Model Studio 中，Tweedie 功率参数指定在选择 Tweedie 作为区间目标分布时使用的功率参数。\n\n| Gradient\
  \ boosting is a primary predictive modeling algorithm for tree-based models. If\
  \ you want to specify some uncommon distributions to build a single regression tree,\
  \ you can build a gradient boosting model with ntree\\=1 and DISTRIBUTION= option.\
  \ |\n\n| --- |\n\n![image](img/Demo.jpg) Demo 9.2: Building a Gradient Tree-Boosted\
  \ Tweedie Compound Poisson Model\n\n此演示使用 DISTRIBUTION 选项在 bigPVA 数据上运行 PROC GRADBOOST，构建一个针对美国退伍军人协会慈善捐赠数据的梯度提升\
  \ Tweedie 复合泊松模型。该数据反映了邮寄募捐活动的结果。\n\n**注意**：您也可以在 Model Studio 中使用梯度提升节点（区间目标分布属性）和\
  \ GLM 节点（目标概率分布和链接函数属性）运行本演示。\n\n1\\. 确保您在 SAS Studio – Develop SAS Code 应用程序中。\n\
  \n2\\. 单击左侧窗格中的 Snippets 图标。在 My Snippets ![image](img/Arrow.jpg)VBBF 下，双击或拖放 Tweedie\
  \ Gradient Boosting Code 到画布上。\n\n![image](img/f0310-01.jpg)\n\n程序打开在代码编辑器窗口中。\n\
  \n首先，创建名为 mycas 的 caslib。随后创建名为 local 的本地库。然后使用 DATA 步骤创建新数据集并将其保存在内存中。\n\n/\\*\
  \ 定义库并加载数据 \\*/\n\nlibname mycas cas;\n\nlibname local ‘/home/student/casuser/VBBF’;\n\
  \ndata mycas.bigpva;\n\n        set local.bigpva;\n\nrun;\n\n3\\. 运行程序的这部分。\n\n\
  4\\. 继续在 Code 标签页上执行代码。\n\n接下来的程序部分列出所有变量、为区间和名义输入创建宏变量，并通过绘图探索目标分布。\n\n/\\* 列出变量\
  \ \\*/\n\nproc contents data=mycas.bigpva out=contents(keep=name type);\n\nrun;\n\
  \n/\\* 为区间输入创建宏变量 \\*/\n\nproc sql; select name into: interval separated by \" \"\
  \n\nfrom work.contents\n\nwhere type=1 and name not in(\"TARGET\\_B\" \"TARGET\\\
  _D\" \"TARGET\\_D\\_with0\" \"StatusCatStarAll\");\n\nquit; %put &interval;\n\n\
  /\\* 为名义输入创建宏变量 \\*/\n\nproc sql; select name into: nominal separated by \" \"\n\
  \nfrom work.contents\n\nwhere (type=2 or name = \"StatusCatStarAll\") and name ne\
  \ \"ID\";\n\nquit;\n\n%put &nominal;\n\n/\\* 探索数据 \\*/\n\nproc univariate data=mycas.bigpva;\n\
  \n            var Target\\_D Target\\_D\\_with0;\n\n            histogram Target\\\
  _D Target\\_D\\_with0;\n\nrun;\n\n运行这部分后，Results 标签页会打开。\n\n数据表包含 100,000 行以上、29\
  \ 列。表中包含三个可能的目标变量（一种二元和两个区间变量）、一个 ID 变量以及 25 个潜在输入变量，这些变量涵盖受访者的 PVA 促销、历史和人口学数据。TARGET\\\
  _B 是二元标志位，用于指示受访者是否响应呼吁，而 TARGET\\_D 则表示捐赠金额。TARGET\\_D 与 TARGET\\_Dwith0 的区别在于两者的正值相等；在\
  \ TARGET\\_D 中，0 值被替换为缺失（.），演示中使用该变量。两个候选输入变量包含缺失值，但树基模型能够很好地处理缺失值。\n\n**注意**：尝试在\
  \ GiftCntAll 变量上使用 DISTRIBUTION=POISSON 建立梯度提升模型也很有趣。\n\n![image](img/f0312-01.jpg)\n\
  \n![image](img/f0312-02.jpg)\n\nTarget\\_D 没有 0 值，而是缺失值。数据呈右偏分布。在传统回归建模中，常用对数变换来\
  \ regularize（平稳）右偏数据。\n\n![image](img/f0313-01.jpg)\n\n![image](img/f0313-02.jpg)\n\
  \nTarget\\_D\\_with0 包含 0 值而非缺失值。其分布更右偏，可能呈零膨胀。使用高斯分布目标的提升模型在这类数据上表现不佳，因为在寻找节点分裂时会遇到困难。\n\
  \n5\\. 返回 Code 标签页。\n\n接下来的程序部分运行一个使用 Tweedie 分布的提升模型，以及一个使用 Tweedie 分布的传统广义线性模型。\n\
  \n/\\* 提升模型与 Tweedie 分布 \\*/\n\nods noproctitle;\n\nproc gradboost data=mycas.bigpva\
  \ distribution=tweedie;\n\n        target Target\\_D\\_with0 / level=interval;\n\
  \n        input &interval / level=interval;\n\n        input &nominal / level=nominal;\n\
  \n        ods output FitStatistics=Work.\\_Gradboost\\_FitStats\\_;\n\n        score\
  \ out=mycas.GB\\_Tweedie copyvars=(\\_all\\_);\n\nrun;\n\n/\\* 广义线性模型与 Tweedie 分布\
  \ \\*/\n\nods noproctitle;\n\nods graphics / imagemap=on;\n\nproc genmod data=MYCAS.BIGPVA;\n\
  \n        class &nominal / param=glm;\n\n        model Target\\_D\\_with0= &interval\
  \ &nominal /\n\n                dist=tweedie(p=1.5) link=log;\n\n        ods output\
  \ FitStatistics=Work.\\_GenMod\\_FitStats\\_;\n\n        output out=work.Genmod\\\
  _Tweedie pred=pred\\_ resraw=r\\_;\n\nrun;\n\n/\\* 使 GenMod  residuals 与 GradBoost\
  \ residuals 可比较 \\*/\n\ndata GenMod\\_Tweedie;\n\nset Genmod\\_Tweedie;\n\nr\\_=-r\\\
  _;\n\nrun;\n\n\n\n\nThe `GENMOD` 程序适用于多种统计模型。采用 Tweedie 分布和 `log` 链接函数的广义线性模型用于比较梯度提升模型。Tweedie\
  \ 功率参数 `p` 设置为 `1.5` 以使模型可比较。Tweedie 分布的支持范围为非负值，并且可以在零处有离散质量，这使其适用于模拟零值与正值混合的响应。Tweedie\
  \ 分布属于指数族，因而便于在广义线性模型框架中使用。\n\n7\\. 运行本程序部分。不要查看结果。\n\n8\\. 保持在 `Code` 选项卡上运行程序。\n\
  \n程序的下一部分用于绘制两个模型的残差对实际值的图。\n\n/\\* 为两个模型绘制残差对实际值的图 \\*/\n\nods graphics / reset\
  \ width=6.4in height=4.8in imagemap;\n\ntitle ‘Plot of Residuals by Actuals: Gradient\
  \ Boosting Distribution=Tweedie’;\n\nproc sgplot data=mycas.GB_tweedie;\n\n          scatter\
  \ x=Target_D_with0 y=\\_Residual\\_ /;\n\n          xaxis grid;\n\n          yaxis\
  \ grid;\n\nrun;\n\ntitle ‘Plot of Residuals by Actuals: Generalized Linear Model\
  \ Distribution=Tweedie’;\n\nproc sgplot data=work.GenMod_Tweedie;\n\n          scatter\
  \ x=Target_D_with0 y=r_;\n\n          xaxis grid;\n\n          yaxis grid;\n\nrun;\n\
  \n9\\. 运行本程序部分。结果选项卡会打开。\n\n![image](img/f0315-01.jpg)\n\n![image](img/f0315-02.jpg)\n\
  \n已为两个模型生成残差对实际值的图。Tweedie 回归模型中存在若干异常大的残差，尤其是在捐赠金额较小且接近零时。两个模型均低估了目标值，尤其是在捐赠金额较大时。\n\
  \n10\\. 点击 `Code` 选项卡返回程序。\n\n下一部分用于绘制两个模型的预测值对实际值的图。\n\n/\\* 为两个模型绘制预测值对实际值的图 \\\
  */\n\ntitle ‘Plot of Predicted by Actuals to plot by Actuals: Gradient Boosting\
  \ Distribution=Tweedie’;\n\nproc sgplot data=mycas.GB_tweedie;\n\n          scatter\
  \ x=Target_D_with0 y=P_Target_D_with0 /;\n\n          series x=Target_D_with0 y=Target_D_with0\
  \ /\n\n                         lineattrs=(color=red); \\*reference line;\n\n          xaxis\
  \ grid;\n\n          yaxis grid;\n\nrun;\n\ntitle ‘Plot of Predicted by Actuals:\
  \ Generalized Linear Model Distribution=Tweedie’;\n\nproc sgplot data=work.GenMod_Tweedie;\n\
  \n          where pred_ between 0 and 200;\n\n          scatter x=Target_D_with0\
  \ y=pred_ /;\n\n          series x=Target_D_with0 y=Target_D_with0 /\n\n                         lineattrs=(color=red);\
  \ \\*reference line;\n\n          xaxis grid;\n\n          yaxis grid;\n\nrun;\n\
  \nods graphics / reset;\n\n11\\. 运行本程序部分。结果选项卡会打开。\n\n![image](img/f0316-01.jpg)\n\
  \n![image](img/f0317-01.jpg)\n\n梯度提升模型的拟合优度优于广义线性模型。这可能是因为树基模型相对于参数模型具有明显的优势。\n\n\
  当捐赠金额较低时，梯度提升模型的残差较小；但在捐赠金额较高时，残差更分散。相反，广义线性模型在捐赠金额较低和较高时的残差均较高。\n\n12\\. 点击 `Code`\
  \ 选项卡返回程序的最后一部分，用于计算平均平方误差以比较模型。\n\n/\\* 评估模型拟合 \\*/\n\ntitle \"ASE\";\n\nproc sql;\n\
  \nselect sum(\\_Residual\\_\\*\\*2)/count(\\*) as GradBoost_Tweedie\n\n                     from\
  \ mycas.GB_Tweedie;\n\n        select sum(r_\\*\\*2)/count(\\*) as GenMod_Tweedie\n\
  \n                     from work.GenMod_Tweedie;\n\nquit;\n\ntitle;\n\n13\\. 运行本程序部分。结果选项卡会打开。\n\
  \n![image](img/f0317-02.jpg)\n\n梯度提升模型（使用 Tweedie 分布）的平均平方误差优于广义线性模型（使用 Tweedie\
  \ 分布）。\n\n调整 Tweedie 的功率参数可以进一步提升模型。\n\n14\\. 关闭 Tweedie 梯度提升 `Code` 选项卡。\n\n15\\\
  . 从应用程序菜单中选择 `Build Models` 以关闭 SAS Studio 并返回模型工作区。\n\n![image](img/EndOfDemo.jpg)\n\
  \nSAS 梯度提升使用开源技术\n\n在本书 earlier，您看到过 SAS Viya 的 Python 与 R 集成（参见 第 7 章）。“开放”一词在\
  \ 图 9.10 中表示 SAS 的分析能力可以通过多种编程语言访问——不仅限于 SAS，还包括 Python、R、Lua、Java 或 RESTful API。这种集成使得各种背景和经验的分析团队能够协作，以新颖方式解决复杂问题。\n\
  \n本节讨论在开源语言中以编程方式访问并执行 SAS 分析的示例。为保持一致性，主要聚焦于通过 Python（流行的通用脚本语言）通过 API 调用 SAS。SAS\
  \ 提供基础开源包 SWAT（Scripting Wrapper for Analytics Transfer），该包可在 GitHub 上获取，用于与 SAS\
  \ Viya 进行交互。SWAT 包提供与 SAS Viya 的接口。\n\n基础 SAS 提供一个 Java 对象，可用于将多种外部语言（包括 Python）集成。这使得\
  \ SAS 过程可以从开源工具中调用。SAS Jupyter 核心为 SAS 数据处理和分析能力带入 Jupyter Notebook，使得用户能够在 Notebook\
  \ 中利用 SAS 的数据处理与分析能力。通过开源方式使用 SAS，可简化未曾使用 SAS 的用户的迁移。通过存储过程或 API 从其他编程接口调用 SAS，是开源程序员访问\
  \ SAS 的简便方式。\n\n图 9.10: SAS Viya 与开源软件的集成\n\n![image](img/f0318-01.jpg)\n\n这种开放性使得数据科学家能够在其选择的语言和界面中编写代码，同时使\
  \ SAS 能够将开源应用扩展为高生产力并能够处理任意数据量。\n\n![image](img/Demo.jpg) 演示 9.3：使用 Python 训练和评分\
  \ SAS 梯度提升模型\n\n本演示在 Jupyter Notebook 中使用 Python 脚本运行 SAS 梯度提升模型。`gbtreeTrain` 和\
  \ `gbTreeScore` 动作集中的决策树动作用于保险数据上，用于训练和评分梯度提升模型。\n\n1\\. 最小化 SAS Viya 选项卡。\n\n2\\\
  . 在 Windows 操作系统中：启动 ![image](img/Arrow.jpg)Anaconda3（64 位） ![image](img/Arrow.jpg)Jupyter\
  \ Notebook（Anaconda3）。\n\n3\\. Jupyter Notebook 启动。请确保处于 Files 选项卡，并且已上传一个笔记本文件。\n\
  \n![image](img/f0319-01.jpg)\n\n4\\. 双击 `SAS_GradBoost_Py_Jupyter.ipynb` 打开用于在 SAS\
  \ Viya 中执行梯度提升分析的 Python 脚本。\n\n![image](img/f0319-02.jpg)\n\n或者，选择 New 然后选择 Python\
  \ 3。\n\n![image](img/f0319-03.jpg)\n\n从数据文件夹中复制 `SAS_GradBoost` Python 脚本文件的内容。\n\
