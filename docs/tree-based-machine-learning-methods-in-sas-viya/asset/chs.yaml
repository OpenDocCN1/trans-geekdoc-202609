  \ `构建模型` 返回到模型工作室。\n\n![image](img/EndOfDemo.jpg)\n\n**梯度提升决策树与其他基于树模型的比较**\n\n\
  梯度提升算法类似于标准提升，但在每次迭代时，目标是前一个决策树模型的残差。\n\n每次迭代计算树的准确率。\n\n后续样本会根据之前的不准确性进行调整。\n\n\
  模型是（通常）简单树的加权线性组合。\n\n核心思想是构建新的基学习器，使其与整个集成的负梯度函数的负梯度最大化相关。\n\n梯度提升可以表示为：\n\n**梯度提升\
  \ = 梯度下降 + 提升**\n\n下面的表格 8.1（第 8 章）是三种树基模型的快速比较。每种模型都有优缺点。总体而言，集成学习非常强大，没有哪种模型在所有情况下都最佳。\n\
  \n**调优梯度提升模型**\n\n\n\n\n你需要调整多个参数，以便正确地训练你的梯度提升模型。\n\nTable 8.1: Comparison of Tree-Based\
  \ Models\n\n| Models || Advantages || Disadvantages |\n\n| --- | --- | --- |\n\n\
  | Decision Tree || Easy to understand, interpret, and implement, extremely fast\
  \ to train || Highly unstable, not powerful enough to handle complex data |\n\n\
  | --- | --- | --- |\n\n| Forest || More stable and robust because of \"wisdom of\
  \ the crowd“ approach, fast to train, easier to tune, highly generalizable model,\
  \ less prone to overfit || Very difficult in model interpretability and explanability\
  \ |\n\n| Gradient Boosting || High performing, effectively capture complex nonlinear\
  \ function dependencies, solves interval target distributions other than normal\
  \ || Slow to train due to sequential nature, a small change in the feature set or\
  \ training set can create drastic changes in the model, not easy to understand predictions\
  \ |\n\nFigure 8.18: Tree-Splitting Options for Tuning a Gradient Boosting Model\n\
  \n![image](img/f0281-01.jpg)\n\nThere are a few tree-specific parameters that affect\
  \ each individual tree in the model and are represented in Figure 8.18. This includes\
  \ tree-splitting options like maximum number of branches, maximum depth, minimum\
  \ leaf size, number of inputs to consider per split, and so on. You are already\
  \ familiar with all of them. (See the discussion in the previous chapters.)\n\n\
  For example, a larger number of inputs to consider per split can lead to overfitting.\
  \ Few other options are related to tree complexity, which controls whether interactions\
  \ are fitted: a tree complexity of one (single decision stump; two terminal nodes)\
  \ fits an additive model, a tree complexity of two fits a model with up to two-way\
  \ interactions, and so on.\n\nThe sequential model-fitting process builds on trees\
  \ fitted previously, and increasingly focuses on the hardest observations to predict.\
  \ Accordingly, there are several boosting parameters that affect the boosting operation\
  \ in a gradient boosting model such as the number of trees, the learning rate, the\
  \ subsample rate, L1 and L2 regularizations, and so on. They are represented in\
  \ Figure 8.19.\n\nOur primary focus of discussion in this section revolves around\
  \ the boosting hyperparameters.\n\nFigure 8.19: Boosting Options for Tuning a Gradient\
  \ Boosting Model\n\n![image](img/f0281-02.jpg)\n\nTuning Parameters Manually\n\n\
  Hyperparameter tuning is choosing a set of optimal hyperparameters for a learning\
  \ algorithm. A hyperparameter is a model argument whose value is set before the\
  \ learning process begins. Experienced modelers prefer to tune these hyperparameters\
  \ manually. Another option is to use the SAS Viya autotuning feature that is discussed\
  \ later.\n\nNumber of Trees\n\nThe number of trees represents the number of sequential\
  \ trees to be modeled in gradient boosting. Most implementations of gradient boosting\
  \ are configured by default with a relatively moderate number of trees, such as\
  \ hundreds or thousands, although this number is data dependent. Usually, the higher\
  \ the number of trees, the better to learn the data. However, adding a lot of trees\
  \ can slow down the training process considerably.\n\nGradient boosting is fairly\
  \ robust at a higher number of trees, but it can still overfit at a point. Recall\
  \ that each new tree attempts to model and correct for the errors made by the sequence\
  \ of previous trees, and therefore, the model reaches a point of diminishing returns.\
  \ Hence, this should be tuned using a validation data for a particular learning\
  \ rate (discussed ahead). In order to find the optimal number of trees, you can\
  \ also use early stopping.\n\nParameter tuning of the number of trees in a forest\
  \ is summarized in Figure 8.20.\n\nLearning Rate\n\nThe learning rate scales the\
  \ contribution of each tree. Gradient boosting starts with an initial estimate,\
  \ which is updated using the output of each subsequent tree. The learning parameter\
  \ controls the magnitude of this change in the estimates.\n\nLower values of the\
  \ learning rate generally make the model robust to the specific characteristics\
  \ of the tree and thus allow it to generalize well. A low learning rate would require\
  \ more trees to model all the relations. A low learning rate is more precise, but\
  \ calculating the gradient is time-consuming, so it is computationally expensive.\n\
  \nFigure 8.20: Tuning the Number of Trees\n\n![image](img/f0282-01.jpg)\n\nFigure\
  \ 8.21: Tuning the Learning Rate\n\n![image](img/f0283-01.jpg)\n\nFigure 8.22: A\
  \ Good Learning Rate!\n\n![image](img/f0283-02.jpg)\n\nLearning rate tuning in a\
  \ gradient boosting model is summarized in Figure 8.21. Figure 8.22 further explains\
  \ the trade-off between setting a high and low learning rate.\n\nSetting the learning\
  \ rate too high yields great progress in decreasing the error function in the first\
  \ few iterations, but at a risk of diverging later in the training process. On the\
  \ other hand, setting the learning rate too small can result in very long training\
  \ times. A “good” learning rate is a balance between the two and is problem specific.\n\
  \nTrade-off Between Learning Rate and Number of Trees\n\nBy now you are aware that\
  \ the learning rate shrinks the contribution of each tree as it is added to the\
  \ model. Decreasing (slowing) the learning rate increases the number of trees required,\
  \ and in general a smaller learning rate (and larger number of tress) is therefore\
  \ preferred. The usual approach is to estimate the optimal number of trees and the\
  \ learning rate with an independent test set or with cross validation, using reduction\
  \ in the loss function as the measure of success. The trade-off between learning\
  \ rate and number of trees is illustrated in Figure 8.23.\n\nFigure 8.23: Learning\
  \ Rate Versus Number of Trees\n\n![image](img/f0284-01.jpg)\n\nFriedman (1999) commented\
  \ on the trade-off between the number of trees (M) and the learning rate (λ):\n\n\
  “The λ‑M trade-off is clearly evident; smaller values of l give rise to larger optimal\
  \ M-values. They also provide higher accuracy, with a diminishing return for λ <\
  \ 0.125. The misclassification error rate is very flat for M > 200, so that optimal\
  \ M-values for it are unstable. … the qualitative nature of these results is fairly\
  \ universal.”\n\n– Friedman 1999\n\nHe suggests to first set a large value for the\
  \ number of trees, and then tune the shrinkage parameter to achieve the best results.\
  \ Studies in the paper preferred a shrinkage value of 0.1, a number of trees in\
  \ the range 100 to 500, and the number of terminal nodes in a tree between 2 and\
  \ 8.\n\nHow does the shrinkage (learning rate) affect overfitting?\n\nPresented\
  \ in Figure 8.24 are the learning error curves for gradient boosting models with\
  \ different shrinkage (λ) parameters using the sinc(x) data referred previously.\
  \ The left graph shows the performance on the training data, whereas the right graph\
  \ shows the performance on the validation data.\n\nObserve that the training set\
  \ error is substantially dropping, but the speed of this improvement heavily depends\
  \ on the shrinkage parameter λ. The validation-error hyperparameter M, corresponding\
  \ to the error minima of each of the models, is highlighted with circles. You can\
  \ see that increasing the shrinkage leads to both finding a better hyperparameter\
  \ M minima and to improving the generalization of the model. The latter corresponds\
  \ to the fact that shrunk models have a flatter plateau beyond their error minima,\
  \ and it takes them many more iterations to initiate overfitting. Yet, it also means\
  \ that these models naturally take longer to learn. Hence, a high learning rate\
  \ commonly results in overfitting (Natekin and Knoll 2013).\n\nFigure 8.24: Effect\
  \ of Learning Rate on Overfitting\n\n![image](img/f0285-01.jpg)\n\nImage source:\n\
  \n\n\n-Natekin and Knoll (2013)的梯度提升机器，一个综述。Front. Neurorobot. 7:21. doi: 10.3389/fnbot.2013.00021\n\
  \n- Subsample Rate\n- Subsample rate 设置用于通过随机抽样对拟合单个基学习者所使用的样本分数。Friedman (1999)\
  \ 发现几乎所有子抽样百分比都优于所谓的确定性提升（子抽样率=1）：\n\n“… 最佳采样分数 … 大约是 40%（f=0.4） … 然而，仅在每次迭代中对 30%\
  \ 或甚至 20% 的数据进行抽样，就会相对于不抽样数据带来显著改进，相应的计算速度加快 3 倍和 5 倍。”\n\n- Friedman 1999\n\n-\
  \ 当数据量（以数据点 N 的数量）不在实际考虑范围内时，将默认值设置为 0.5 会给出合理的结果。如果对最佳子抽样率感兴趣，可以通过比较不同参数值下的预测性能来估计它。\n\
  \n- 较小的子抽样率通常会产生更多样化的树木，从而形成更强健且更通用的集成模型。但也应考虑减小样本量对模型估计的影响。如果子抽样率过低，可能会因自由度不足而导致模型拟合不佳。\n\
  \n- **Figure 8.25: 调整子抽样率**\n\n- ![image](img/f0286-01.jpg)\n\n- 总体而言，用于拟合基学习者的数据越多，估计会更准确，前提是使用了足够的数据。因此，当有大量数据可用时，可能需要在每个基学习者使用的观测数量与其准确性提升之间进行权衡。\n\
  \n- 有时，使用更多基学习者、每个使用较小的子抽样率来达到所需准确度，可能比使用较少但更精心拟合的基学习者（子抽样率较高）更高效。\n\n- 梯度提升的子抽样率调参总结在\
  \ Figure 8.25。\n\n- **L1 和 L2 正则化**\n\n- 衰减参数控制惩罚项的相对重要性。惩罚项过大会导致模型欠拟合数据。\n\n- 两个正则化项对权重的影响不同：L2\
  \ 正则化鼓励权重较小，而 L1 正则化鼓励稀疏性，即使权重趋于 0。这在回归模型中有帮助，因为需要进行特征选择；但在决策树中，特征在树构建时已被选择，将其权重置\
  \ 0 可能并无帮助。因此，可以设置高 L2 与低（或 0）L1。L1 正则化可视为对不具预测性特征更具攻击性，但也可能考虑同时使用两者：一些 L1 用于惩罚不具预测性特征，L2\
  \ 用于进一步惩罚大叶子得分而不至于过于严苛。\n\n- 梯度提升的 L1 和 L2 正则化调参总结在 Figure 8.26。\n\n- **Figure 8.26:\
  \ 调整 L1 和 L2 正则化**\n\n- ![image](img/f0287-01.jpg)\n\n- **自动调参 (Autotuning)**\n\n\
  - 自动调参指定是否对梯度提升的任何参数进行自动调参。自动调参会自动选择超参数的最优值。你可以决定对哪些超参数进行调参。Figure 8.27 列出了可自动调参的梯度提升超参数。\n\
  \n- 如果选择 **Perform Autotuning**，则可用的选项如下：\n\n  - L1 正则化：指定是否对 L1 正则化进行自动调参。\n  -\
  \ L2 正则化：指定是否对 L2 正则化进行自动调参。\n  - Learning Rate：指定是否对学习率进行自动调参。\n  - Maximum Depth：指定是否对最大树深度（即节点生成代数）进行自动调参。\n\
  \  - Minimum Leaf Size：指定是否对最小叶子大小进行自动调参。\n\n- **Figure 8.27: 梯度提升的可自动调参数**\n\n\
  - ![image](img/f0287-02.jpg)\n\n- **Interval Bins 数量**：指定是否对区间桶的数量进行自动调参。\n\n- **Inputs\
  \ per Split 数量**：指定是否对每次分割的输入数量进行自动调参。\n\n- **Number of Trees**：指定是否对增强序列中的树木数量进行自动调参。\n\
  \n  | 当启用早停止且存在验证分区时，若选中 **Number of Trees**，则不会进行自动调参。 |\n\n- ![image](img/Demo.jpg)\
