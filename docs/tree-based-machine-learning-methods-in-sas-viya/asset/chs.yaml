  \n该表格包含 19,357 条观测数据和 50 个变量。\n\n\n\n-   [费曼学习法](https://wiki.example.org/feynmans_learning_method)的灵感源于诺贝尔物理奖获得者**Richard\
  \ Feynman**。\n\n1.  运用费曼技巧，你只需花上`20 min`就能深入理解知识点，而且记忆深刻，*难以遗忘*。\n\n```\nif (condVar\
  \ > someVal) {console.log(\"xxx\")}\n```\n\n\n\n2.  b) 配置数据，确保不因即使有更高比例的缺失值也拒绝任何输入。确保任何具有四个或更多水平的数值变量仍然被定义为区间级别。\n\
  \n3.  c) 将数据分成两部分。保留 70% 用于训练，剩余部分用于验证。\n\n4.  d) 分配目标变量。你是否有任何变量被排除在分析之外？\n\n2.\
  \  Assaying the Data \n\n    1.  a) 你的项目中的数据是否已经分区？如果没有，请执行数据分割。\n\n    2.  b) 探索分析数据，利用图形和数值方法获取变量知识。选择一子集变量，提供数据的代表性快照。\n\
  \n        *  提示：在分析中添加一个数据探索节点。\n\n    3.  c) 哪个变量最重要？该最重要变量是否与母亲健康有关？\n\n     \
  \   *  提示：查看重要输入图表。\n\n    4.  d) 在这组数据中，低体重儿占多少比例？\n\n        *  提示：查看类别变量分布图。\n\
  \n    5.  e) 母亲和父亲的平均年龄是多少？\n\n        *  提示：查看区间变量时刻表。\n\n    6.  f) 这些数据中是否有变量存在缺失值？哪个变量的缺失比例最高？虽然决策树能很好地处理缺失值，但你认为缺失比例最高的变量是否应该从分析中排除？为什么？\n\
  \n        *  提示：查看输出窗口中的缺失值表，然后查看目标与输入交叉分表。\n\n    7.  g) 父母种族与低体重儿之间是否存在关联？这些变量是否应该从分析中排除？\n\
  \n        *  提示：查看目标与输入交叉分表。\n\n3.  创建决策树模型 \n\n    1.  a) 使用模型工作室的默认设置创建决策树模型。\n\
  \n    2.  b) 模型有多少个叶节点？原始树上最多生长了多少个叶节点？\n\n        *  提示：查看输出窗口中的模型信息表。\n\n    3.\
  \  c) 定义概率最高和最低的低体重儿的段的规则是什么？\n\n        *  提示：查看树状图，识别最暗和最亮的节点 ID，然后在树图中定位它们以查看规则。\n\
  \n    4.  d) 在预测低体重儿时，最重要的输入变量有哪些？\n\n        *  提示：查看变量重要性表。\n\n4.  决策树模型的时序测试\
  \ \n\n    1.  a) 你使用 2000 年的出生数据构建模型，并进行了时序验证，未进行测试。使用 2001 年的数据对决策树模型进行时序测试。\n\n\
  \        *  提示：使用评分数据节点。\n\n    2.  b) 模型的时序性能的 ASE 和 MISC 指标是什么？你在时序测试中是否获得可比的结果？\n\
  \n        *  提示：查看评分数据节点和决策树节点的拟合统计表。\n\n    3.  c) 这种方法的优势和劣势是什么？\n\n    4.  d)\
  \ 如果你的时序测试性能与时序验证性能差异很大，你能做什么？\n\n5.  通过修改特定树增长选项改进决策树模型 \n\n    1.  a) 在管道中添加一个决策树，并将其重命名为调制后的\
  \ DT。\n\n    2.  b) 更改特定树增长选项以改进决策树模型。你认为增加树深度、叶节点大小和区间桶数量会对改进决策树模型有帮助吗？\n\n   \
  \     *  提示：将最大深度设置为 18，最小叶节点大小设置为 70，区间桶数量设置为 85。尝试其他超参数组合，保持实验精神！\n\n    3.  c)\
  \ 手动调制的决策树在与默认树的比较中表现如何？\n\n6.  尝试剪枝策略 \n\n    1.  a) 剪枝后，决策树模型有多少个叶节点？为什么选择了这么多叶节点？\n\
  \n    2.  b) 通过剪枝降低 Tuned DT 的树复杂度，使叶节点数减少约 10 个，是否可接受？在模型工作室中有哪两种方法可以实现这一点？请应用其中任意一种方法运行管道。\n\
  \n        *  提示：你可以在决策树中明确指定想要的叶节点数，或者提供成本复杂度 α 值。\n\n    3.  c) 与前一个树相比，叶节点数减少的树在准确率上表现如何？降低树复杂度是否值得？\n\
  \n        *  提示：查看剪枝误差图。\n\n    4.  d) 手动调制的树与默认设置树相比如何？\n\n        *  提示：查看模型比较节点的结果。\n\
  \n7.  创建默认森林模型 \n\n    1.  a) 使用默认设置创建森林模型。\n\n    2.  b) 构建森林模型时使用了多少棵树？森林的袋外样本比例是多少？该模型的袋外误分类率是多少？\n\
  \n        *  提示：查看输出窗口中的模型信息表。\n\n    3.  c) 你认为构建包含一百棵树的森林是否合适？增加或减少树的数量是否是个好主意？\n\
  \n        *  提示：查看剪枝误差图。\n\n    4.  d) 哪个输入变量是低体重儿的最重要预测指标？\n\n        *  提示：查看变量重要性表。\n\
  \n    5.  e) 在重要输入变量中，哪些变量在所有树中保持一致？\n\n        *  提示：查看变量重要性表，并使用适当列的排序和添加到排序功能进行排序。\n\
