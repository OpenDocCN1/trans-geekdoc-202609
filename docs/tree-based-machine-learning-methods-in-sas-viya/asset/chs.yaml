  \n30. 在训练代码窗口中粘贴（Ctrl+P）组件代码。\n\n31. 添加 ODS GRAPHICS ON 语句，将 ASSIGNMISSING 改为 POPULAR，并在\
  \ PROC TREESPLIT 语句中添加 RBAIMP 选项。\n\n![image](img/f0139-02.jpg)\n\n这会创建一个不同的树，缺失值被分配到最大分支，并生成使用随机分支分配（RBA）方法的变量重要性表。\n\
  \n32. 点击关闭，选择保存以保存 SAS 代码节点的更改。\n\n33. 右键单击 SAS 代码节点 ![image](img/Arrow.jpg) 移动\
