  \nTuning a Forest Model\n\nKey differentiators in tree<unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk>\
  \  tree-based models are the splitting rules. The forest algorithm involves several\
  \ hyperparameters controlling the structure of each individual tree (for example,\
  \ minimum leaf size or maximum depth) and<unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk>\
  \  the size of the forest (for example, the number of trees) as well as its level\
  \ of randomness (for example, number of inputs to consider per split or in-bag sample\
  \ proportion). They are listed in Figure 6.22. The values of these tuning parameters\
  \ must be optimized carefully because the optimal values are dependent on the data\
  \ set at hand. Optimality here refers to a certain performance measure (for example,\
  \ misclassification rate, average squared error, loss function) that must be chosen\
  \ beforehand and evaluated on an out-of-bag sample to avoid overfitting.\n\nApart\
  \ from the tuning parameters mentioned above, binning of interval variables is also\
  \ one of the important tuners. Here are some recommendations:\n\n*   Using quantile\
  \ bins instead of bins of equal width often results in a better fit, especially\
  \ when some inputs have outliers.\n\n*   Using more bins sometimes improves and\
  \ rarely degrades accuracy. However,<unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk>\
  \  training takes longer with more bins, and often much longer with many more bins.\n\
  \nFigure 6.22: How to Tune a Forest?\n\n![image](img/f0211-01.jpg)\n\nIt is well\
  \ known that in most cases, a forest works reasonably well with the default values\
  \ of the hyperparameters specified in SAS Viya. Nonetheless, tuning the hyperparameters\
  \ can improve the performance of your forest model.\n\n“Hyperparameters and Tuning\
  \ Strategies for Random Forest,” by Probst et al. (2019) is a good read for a detailed\
  \ discussion on forest parameter tuning.\n\nTuning Parameters Manually\n\nNumber\
  \ of Trees\n\nThe number of trees in a forest is a parameter that is not tunable\
  \ in the classical sense but should be set sufficiently high (Díaz-Uriarte and De\
  \ Andres 2006; Oshiro et al. 2012; Probst and Boulesteix 2017).\n\nThe number of\
  \ trees needed to obtain optimal performance depends on the characteristics of the\
  \ data set at hand. Using many data sets, Oshiro et al. (2012) and Probst and Boulesteix\
  \ (2017) empirically showed that the biggest performance gain can often be achieved\
  \ when growing the first 100 trees. The convergence behavior can be investigated\
  \ by inspecting the out-of-bag curves showing the<unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk>\
  \  performance for a growing number of trees in a forest.\n\nThe forest attains\
  \ a lower out-of-bag or validation error<unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk>\
  \  only by<unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk>\
  \  variance reduction. Therefore, increasing the number of trees in the ensemble\
  \ will not have any effect on the bias of your model. A higher number of trees will\
  \ reduce only the variance of your model. You can achieve a higher variance reduction\
  \ by reducing the correlation between trees in the ensemble. Note that the convergence\
  \ rate of forest not only depends on the data set’s characteristics but also on\
  \ other hyperparameters that are discussed ahead.\n\nParameter tuning of number\
  \ of trees in forest is summarized in Figure 6.23.\n\nFigure 6.23: Tuning Number\
  \ of Trees\n\n![image](img/f0212-01.jpg)\n\nIn-Bag Sample Proportion\n\nDecreasing\
  \ the in-bag sample proportion leads to more diverse trees and thereby lower correlation\
  \ between the trees, which has a positive effect on the prediction accuracy when\
  \ aggregating the trees. However, the<unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk>\
  \  accuracy of the single trees decreases, because fewer observations are used for\
  \ training. Therefore, the choice of the in-bag sample proportion is a trade-off\
  \ between stability and accuracy of the trees. The optimal value is problem dependent\
  \ and can be estimated with the out-of-bag predictions. It is generally observed\
  \ that setting it to lower values gives better results and reduces the runtime (MARTINI-Uriarte\
  \ and Suarez<unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk>\
  \  2010.\n\n[/content]\n\n\n\n\n-   在袋内样本比例的调参对每棵树的总结在 [`Figure 6.24`。\n\n### 考虑每次分割的输入数量\n\
  \n考虑每次分割的输入数量是森林中最重要的调参参数之一。较小的值会产生更多不同、较不相关的树，聚合这些多样的树后能产生更稳定的模型。较小的输入数量也更有利于利用对目标有中等影响的输入，而不是被对目标影响强的输入所掩盖。然而，较小的输入数量也会导致单棵树的表现变差，因为它们是基于随机抽取的候选变量的子集（可能是非重要变量）来构建的：非重要变量可能会被选中。你必须在单棵树的稳定性和准确性之间取得权衡（`Probst\
  \ et al. 2019`）。\n\n### 图 6.24：调参在袋内样本比例\n\n![image](img/f0212-02.jpg)\n\n最优的输入数量受实际相关输入变量的数量影响很大。如果有许多相关预测变量，输入数量应设为小，这样不仅最具影响力的变量会被选入分割，还会选入影响较小但仍有意义的变量，从而获得小但显著的性能提升。相反，如果相关变量很少，输入数量应设为大，以便算法能够找到这些相关变量（`Goldstein\
  \ et al. 2011`）。\n\n计算时间大约与输入数量成反比（`Wright and Ziegler 2017`），因为森林的大部分计算时间都用于选择分割变量。\n\
  \n-   在袋内样本比例的树内调参在 `Figure 6.25`。\n\n### 最小叶节点大小（计数或比例）\n\n最小叶节点大小调参指定终端节点的最小观测次数。将其设为较小值会导致树的深度增加，即在终端节点之前会进行更多的分割。如果数据中存在较多的噪声变量，则需要设置更高的最小叶节点大小（`Segal\
  \ 2004`）。\n\n### 图 6.25：调参输入数量\n\n![image](img/f0213-01.jpg)\n\n最小叶节点大小的影响颇为有趣。如果让树分裂到只包含单个观测的叶节点，通常会得到最准确的随机森林模型。但更小的叶节点意味着更大（更深）的树，准确性又以计算时间和内存为代价。更小的叶节点通常会使模型更容易捕获训练数据中的噪声。\n\
  \n计算时间随最小叶节点大小的增加大约呈指数下降（`Probst et al. 2019`）。在大样本数据集中，将该参数设置为大于默认值可能有所帮助，因为它能显著降低运行时间，同时对预测性能的损失通常不大（`Segal\
  \ 2004`）。\n\n请注意，除了最小叶节点大小之外，其他超参数也可以用来控制树的大小（例如，密切相关的超参数是树的最大深度，即直到终端节点的最大分割次数）。\n\
  \n-   最小叶节点大小在树内的调参在 `Figure 6.26`。\n\n### 最大深度\n\n树越深，分割次数越多，能够捕获更多关于数据的信息。但也可能导致单棵树的过拟合。如果选择较小的最小叶节点大小，则建议使用更大的最大深度，以便树能够更深地生长；反之亦然。树的深度较低时，甚至可能无法识别数据中的有用信号。更深的树通常运行时间更长。\n\
  \n-   最大深度在树内的调参在 `Figure 6.27`。\n\n### 图 6.26：调参最小叶节点大小（计数或比例）\n\n![image](img/f0214-01.jpg)\n\
  \n### 图 6.27：调参最大深度\n\n![image](img/f0215-01.jpg)\n\n### 自动调参超参数\n\n自动调参指定是否对森林的任何参数进行自动调参。你可以确定要调参的超参数。`Figure\
  \ 6.28` 列出了可以自动调参的森林超参数。\n\n如果选择 **执行自动调参**，则可用的选项如下：\n\n-   **最大深度**：是否对最大深度参数进行自动调参。\n\
  -   **最小叶节点大小**：是否对最小叶节点大小参数进行自动调参。\n-   **区间桶数**：是否对区间桶数参数进行自动调参。\n-   **树的数量**：是否对树的数量参数进行自动调参。\n\
  -   **在袋内样本比例**：是否对在袋内样本比例参数进行自动调参。\n\n-   [输入数量 per 分割是否需要自动调参。]\n\n如果上述任意选项被选中，则可用的选项如下：\n\
  \n-   **初始值**：为自动调参设定的该超参数的初始值。默认值即为该超参数的默认值。使用 **From** 和 **To** 选项可以指定范围。默认的 From\
  \ 值和 To 值即为该超参数的默认范围。\n\n| 执行自动调参会显著增加运行时间。 |\n| --- |\n\n你可以在 **执行自动调参** 的 **常规选项**\
  \ 中进行交叉验证。但如果你的数据已经被分区，则该分区会被使用，其他所有选项都会被忽略：验证方法、验证数据比例、交叉验证折数。如果未分区，则在 **自动调参**\
  \ 选项中可以选择 **K 折交叉验证**，并指定分区折数。\n\n### FOREST 过程\n\n`PROC FOREST < options > ;`\n\
  \n`CROSSVALIDATION < options > ;`\n\n`GROW criterion ;`\n\n`ID variables ;`\n\n\
  `INPUT variables < / LEVEL=NOMINAL | INTERVAL > ;`\n\n`OUTPUT OUT=CAS-libref.data-table\
  \ < option > ;`\n\n`PARTITION partition-option ;`\n\n`TARGET variable < / LEVEL=NOMINAL\
  \ | INTERVAL > ;`\n\n-   `PROC FOREST` 语句用于启动该过程。\n\n-   `CROSSVALIDATION` 语句用于进行\
  \ k 折交叉验证，以获得平均估计的验证误差。如果同时指定 `AUTOTUNE` 语句或 `PARTITION` 语句，则不能使用此语句。\n\n-   `GROW`\
  \ 语句指定用于将父节点分割为子节点的准则。随着树的生长，`PROC FOREST` 会对每个预测变量计算指定的准则，并选择能够优化该准则的变量进行分割。\n\n\
  -   `ID` 语句列出要从输入数据表复制到输出数据表（在 `OUT=` 选项和 `SAVESTATE` 语句的 `RSTORE=` 选项中）的变量。\n\n\
  -   `INPUT` 语句用于命名共享同一选项的输入变量。可以多次使用 `INPUT` 语句。\n\n-   `OUTPUT` 语句用于创建包含 `PROC\
  \ FOREST` 结果的输出数据表。\n\n-   `PARTITION` 语句指定如何在输入数据集中逻辑地将观测值划分为用于模型训练、验证和测试的不相交子集。\n\
  \n-   `TARGET` 语句命名目标变量，即 `PROC FOREST` 试图预测的变量。\n\n![image](img/Demo.jpg)Demo 6.2：调参随机森林模型\n\
  \n\n\n-   [在本演示中，您正在通过调整特定参数来改进先前创建的默认森林模型。您继续使用保险数据集，并尝试森林节点中的一些选项。](https://wiki.example.org/feynmans_learning_method)\n\
  \n1. 确保在 Model Studio 中打开 Insurance_ClassTree 项目，并在 Forest Models pipeline 上进行操作。\n\
  \n2. 展开 Tree-splitting Options 属性，观察到 Use default number of inputs to consider per\
  \ split 已被默认勾选。\n\n![image](img/f0217-01.jpg)\n\nNumber of inputs to consider per\
  \ split 是森林的关键方面之一，因为它通常会影响对最具影响变量的偏向程度。因此，问题在于在每个节点应考虑多少变量？此选项仅在取消 Use default\
  \ number of inputs to consider per split 后可用。\n\n与手动在多次训练运行中更改此选项不同，我们将使用程序化方法来研究修改该选项的影响。\n\
  \n3. 右键单击 Data 节点，选择添加子节点 ![image](img/Arrow.jpg)Miscellaneous ![image](img/Arrow.jpg)SAS\
  \ Code。重命名 SAS 代码为 #Inputs Evaluation。您的管道应如下所示。\n\n![image](img/f0217-02.jpg)\n\
  \n4. 当 #Inputs Evaluations 节点被选中时，单击左侧的 Open Code Editor 按钮。\n\n5. 确保光标位于 Training\
  \ code 窗口，点击最左侧的 Load source code file 图标，并导航到 D:\\\\Workshop\\\\Winsas\\\\VBBF。\n\
  \n![image](img/f0218-01.jpg)\n\n6. 选择包含以下代码的 Forest_Var_Tries_Evaluation.sas 文件：\n\
  \n```sas\n%macro forestStudy (nVarsList=10,maxTrees=200);\n\n%let nTries = %sysfunc(countw(&nVarsList.));\n\
  \n/* 循环遍历指定的变量尝试数 */\n\n%do i = 1 %to &nTries.;\n\n%let thisTry = %sysfunc(scan(&nVarsList.,&i));\n\
  \n%put &nTries.;\n\n/* 为该变量数运行森林 */\n\nproc forest data=&dm_data ntrees=&maxTrees.\
  \ vars_to_try=&thisTry.;\n\npartition rolevar='_PartInd_'n (TRAIN='1' VALIDATE='0');\n\
  \ntarget 'INS'n / level=nominal;\n\ninput %dm_interval_input / level=interval;\n\
  \ninput %dm_binary_input %dm_nominal_input %dm_ordinal_input %dm_unary_input / level=nominal;\n\
  \nid 'IDNUM'n;\n\nods output FitStatistics=&dm_lib..fitstats_vars&thisTry.;\n\n\
  run;\n\n/* 将 varsToTry 的值添加到这些拟合统计中 */\n\ndata &dm_lib..fitstats_vars&thisTry.;\n\
  \nlength varsToTry $ 8;\n\nset &dm_lib..fitstats_vars&thisTry.;\n\nvarsToTry = \"\
  &thisTry.\";\n\nrun;\n\n/* 将结果追加到单一累积拟合统计表中 */\n\nproc append base=&dm_lib..fitStats1\n\
  \ndata=&dm_lib..fitstats_vars&thisTry. force;\n\nrun;\n\n%end;\n\n%mend forestStudy;\n\
  \n%forestStudy(nVarsList= 3 7 10 15 25 47, maxTrees=100);\n\ndata &dm_data_outfit;\n\
  \nset &dm_lib..fitstats1;\n\nrun;\n\n%dmcas_report(reportType=table,dataSet=&dm_lib..fitStats1);\n\
  \n%dmcas_report(reportType=Seriesplot,dataSet=&dm_lib..fitStats1,  \n\nx=Trees,y=miscOob,group=varsToTry,description=Out\
  \ of Bag Misclassification Rate);\n\n该宏用于接收变量尝试数列表 (nVarsList) 和训练树木数量 (maxTrees)，遍历列表中的每个数值，分别调用\
  \ PROC FOREST（针对不同的变量尝试数）并收集拟合统计结果。所有 PROC FOREST 模型的拟合统计保存到数据集中，供后续可视化模型性能之用。\n\
  \n7. 点击打开以加载程序。\n\n8. 点击关闭按钮关闭编辑器，然后点击保存。\n\n9. 运行 #Inputs Evaluation 节点并打开结果。\n\
  \n10. 关注 Out of Bag Misclassification Rate 图表。\n\n![image](img/f0219-01.jpg)\n\n\
  更改每次分割时使用的变量数量的影响不如变量树木数量的影响直观。图表表明，对于较小的树木数量（当然，这不推荐用于森林），可能需要考虑更多的输入。这很合理，因为在树木较少时，需要确保最具影响的变量被考虑在内。对于较大的树木数量，图表显示中等数量的输入将提供最佳模型；数值过低会增加遗漏最具影响变量的风险，数值过高则会导致最具影响变量占主导，从而忽略重要的次要因素，降低模型的泛化能力。\n\
  \n尽管可以说中等数量的变量尝试值可能是最有效的，但实际值/范围取决于数据，因为特征数量和相对影响会有所不同。请注意，Breiman 建议使用变量数量的平方根作为良好默认值；本示例使用的数据集包含\
  \ 47 个输入，因此建议从七个变量开始考虑。\n\n11. 关闭结果。\n\n12. 将 Forest 节点重命名为 Forest Default。\n\n\
  13. 右键单击 Data 节点，选择添加子节点 ![image](img/Arrow.jpg)Supervised Learning ![image](img/Arrow.jpg)Forest。将此\
  \ Forest 节点重命名为 Forest Tuned。您的管道应如下所示。\n\n![image](img/f0220-01.jpg)\n\n14. 将树木数量从\
  \ 100 更改为 500。\n\n![image](img/f0220-02.jpg)\n\n森林模型的收敛不仅取决于数据，还可能取决于其他超参数。降低在袋样本比例、提高最小叶子大小以及减小每次分割时考虑的输入数量，会使树木之间的相关性降低。这些树木更加不同，预期能提供更不同的预测。因此，需要更多的树木才能为每个观测提供准确预测。\n\
  \n让我们尝试在类似思路上校准模型。\n\n15. 展开 Tree-splitting Options，将类别目标标准从 Information gain ratio\
  \ 更改为 Entropy，最大深度从 20 更改为 30，最小叶子大小从 5 更改为 20，在袋样本比例从 0.60 更改为 0.40。\n\n![image](img/f0221-01.jpg)\n\
  \n16. 取消 Use default number of inputs to consider per split 并输入 5 作为 Number of inputs\
  \ to consider per split。\n\n![image](img/f0221-02.jpg)\n\n较小的每次分割时考虑的输入数量会降低 ensemble\
  \ 的方差，但会增加单棵树的偏差。让我们看看这会产生什么效果。\n\n17. 点击 Run Pipeline 按钮运行管道。\n\n18. 打开 Forest\
  \ Tuned 节点的结果，最大化 Error Plot，并将 View Chart 更改为 Misclassification Rate。\n\n![image](img/f0222-01.jpg)\n\
  \n创建 500 棵树是一个保守的选择。从效率角度看，较小的树木数量是可接受的。\n\n19. 将树木数量从 500 更改为 200。\n\n20. 再次点击\
  \ Run Pipeline 按钮，运行包含更少树木的管道。\n\n21. 打开 Model Comparison 节点的结果。\n\n![image](img/f0222-02.jpg)\n\
  \n两个模型性能相当。然而，Forest Tuned 模型的 KS (Youden) 统计值略高于 Forest Default 模型。观察其他性能指标也很有趣。\n\
  \n您可以进一步修改某些属性以寻找更大的性能提升。相反，我们将使用 SAS Viya 的自动调优功能。\n\n22. 关闭 Model Comparison 节点的结果。\n\
  \n23. 右键单击 Data 节点，选择添加子节点 ![image](img/Arrow.jpg)Supervised Learning ![image](img/Arrow.jpg)Forest。将此\
  \ Forest 节点重命名为 Forest Autotuned。您的管道应如下所示。\n\n![image](img/f0223-01.jpg)\n\n24.\
  \ 展开 Perform Autotuning 属性，将其设置为 On 并使用滑块按钮。\n\n![image](img/f0223-02.jpg)\n\n\n\
