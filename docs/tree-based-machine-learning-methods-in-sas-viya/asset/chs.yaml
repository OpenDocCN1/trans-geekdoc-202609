  \nd. 以上都不是\n\nAnswers\n\n| 1. b || 2. c || 3. True || 4. True || 5. a || 6. b, c,\
  \ and d || 7. e || 8. c |\n\n\n\n\n考虑一种情况，你拥有有限量的目标人群标记数据。然而，你拥有来自相似人群或旧领域的大量标记数据，如`Figure\
  \ 9.2` (`#Chapter09.xhtml#ch09fig02`) 所示。显然，输入和目标定义在两组数据中是相同的。\n\n转移学习通过添加辅助数据来增强训练数据，并尝试降低那些与原始训练数据不具代表性的观测的影响。原始训练数据通常来自目标人群，从而难以获取。\n\
  \n在辅助人群中的一些观测与目标人群相似，因此可以用于训练。但那些与目标人群不同的观测则与建模无关，因此需要识别它们并减少其影响。\n\n为了简化，你可以将与目标人群相似的辅助观测称为“朋友”，将其他辅助观测称为“外星人”。`Figure\
  \ 9.3` (`#Chapter09.xhtml#ch09fig03`) 将它们表现为朋友和外星人。\n\n梯度提升（Gradient boosting）试图识别并降低外星人的影响。一部分原始训练数据被保留为测试数据，用于公正评估。\n\
  \nFigure 9.2: Transfer Learning\n\n![image](img/f0298-01.jpg)\n\nFigure 9.3: Friends\
  \ and Aliens\n\n![image](img/f0298-02.jpg)\n\nFigure 9.4: Identify and Down-Weight\
  \ Aliens\n\n![image](img/f0299-01.jpg)\n\nTransfer Learning Using the GRADBOOST\
  \ Procedure\n\nPROC GRADBOOST 试图识别并降低外星人的影响。TRANSFERLEARN 语句允许你使用辅助数据（添加到训练数据中）来训练梯度提升模型。为防止模型过度偏向辅助数据，GRADBOOST\
  \ 过程会对与训练数据不相似的辅助观测进行下权重。\n\nPROC GRADBOOST < options >;\n\nCROSSVALIDATION < options\
  \ >;\n\nID variables;\n\nINPUT variables< / options >;\n\nOUTPUT OUT=CAS-libref.data-table<\
  \ option>;\n\nPARTITION partition-option;\n\nTARGET variable< / LEVEL=NOMINAL |\
  \ INTERVAL >;\n\nTRANSFERLEARN variable< / options >;\n\nThe PROC GRADBOOST statement\
  \ invokes the procedure.\n\nCROSSVALIDATION 语句执行 k 折交叉验证，以求得平均估计验证误差。如果指定了 AUTOTUNE\
  \ 语句或 PARTITION 语句，则不能指定此语句。\n\nID 语句列出一个或多个变量，这些变量将从输入数据表复制到由 OUT= 选项指定的输出数据表，以及\
  \ SAVESTATE 语句中的 RSTORE= 选项指定的数据表。\n\nINPUT 语句命名输入变量，这些变量具有共同选项。可以多次指定 INPUT 语句。\n\
  \nOUTPUT 语句创建一个输出数据表，包含 PROC GRADBOOST 运行的结果。\n\nPARTITION 语句指定如何将输入数据集逻辑性地划分为用于模型训练、验证和测试的不相交子集。\n\
  \nTARGET 语句命名 PROC GRADBOOST 预测的变量。\n\nTRANSFERLEARN 语句命名一个变量，其值指示观测是属于训练数据还是辅助数据。值在\
  \ 0 到 1 之间表示训练数据，值大于等于 1 表示辅助数据。值为缺失或负数的观测将被忽略。\n\n可以指定以下选项：\n\n*   BURN=number\
  \  \n\n    指定在对辅助数据中的任何观测进行下权重之前创建的树木数量。默认情况下，BURN=0。\n\n*   SHRINKAGE=number  \n\
  \n    指定应用于对辅助数据进行下权重的加权因子的数值，该数值必须在 0 和 1 之间（不包括边界）。默认情况下，SHRINKAGE=0.9。\n\n* \
  \  TRIMMING=number  \n\n    指定在训练数据的梯度分布中，超过该数值的部分之后，辅助观测将被下权重的分数。该数值必须大于 0 且小于等于\
  \ 1/2。默认情况下，TRIMMING=0.01。\n\n| 要在 GRADBOOST 过程中使用转移学习，你必须将训练数据和辅助数据拼接起来，并在 PROC\
  \ GRADBOOST 语句的 DATA= 选项中指定拼接后的数据表。为了区分两类数据，你必须创建一个指示变量。 |\n\n| --- |\n\n演示场景\n\n\
  模拟数据用于展示使用 GRADBOOST 过程实现转移学习的应用。DATA 步骤生成了三个数据集：一个包含训练数据（朋友和外星人都包含）的数据集，一个不包含外星人的数据集，以及一个第三个数据集，其中测试观测从训练数据中被保留出来。Train、Test\
  \ 和 NoAlien 三个数据集分别包含 6000、1000 和 4000 个观测，它们都包含以下列：\n\n*   X1 || (正态分布输入变量) |\n\
  \n*   X2 || (正态分布输入变量) |\n\n*   Y || (二元目标变量，编码为 1 或 -1) |\n\n*   constantZero ||\
  \ (单元变量，所有值均为 0) |\n\n*   dataRole || (数据角色指示器，编码为 -1、0、1 或 2，分别表示测试数据、目标人群、朋友和外星人)\
  \ |\n\n想法是运行三次梯度提升。请记住，TRANSFERLEARN 语句指定标识辅助观测的变量。\n\n这三个数据集在 `Figure 9.5` (`#Chapter09.xhtml#ch09fig05`)\
  \ 中以图示形式呈现。\n\n第一个梯度提升模型在包含目标人群训练数据以及辅助数据（朋友和外星人都包含）的训练数据上运行，如 `Figure 9.6` (`#Chapter09.xhtml#ch09fig06`)\
  \ 所示。TRANSFERLEARN 语句指定 dataRole 为指示观测是属于训练数据（dataRole=0）还是辅助数据（dataRole=1,2）的变量。\n\
  \n第二个梯度提升模型在包含目标人群训练数据以及朋友和外星人都包含的辅助数据上的训练数据上运行，如 `Figure 9.7` (`#Chapter09.xhtml#ch09fig07`)\
  \ 所示。TRANSFERLEARN 语句指定 constantZero 为变量。当该变量在所有观测中均为 0 时，不进行转移学习。此处不使用 dataRole\
  \ 变量。\n\n第三个梯度提升模型在 NoAlien 数据集上运行，该数据集包含目标人群和仅包含朋友的辅助数据，如 `Figure 9.8` (`#Chapter09.xhtml#ch09fig08`)\
  \ 所示。TRANSFERLEARN 语句指定 constantZero 为变量，其值（constantZero=0）不指示观测是属于训练数据还是辅助数据。此处也不使用\
  \ dataRole 变量。\n\n即将进行的演示将实现这三个模型。\n\n![image](img/Demo.jpg)Demo 9.1: Transfer Learning\
  \ Using Gradient Boosting\n\n此演示两次运行 PROC GRADBOOST，均不使用转移学习：一次使用所有数据，一次不使用外星人。所有模型均使用未包含在训练数据中的目标人群数据进行评估。包含转移学习的模型应提供比不包含转移学习的模型更好的拟合，但不如移除外星人人口的模型效果好。\n\
