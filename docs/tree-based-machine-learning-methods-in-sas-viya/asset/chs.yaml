  \nThe growth process continues until the tree reaches a maximum depth of 20. The\
  \ purpose of a liberal p‑value of 0.2 for the chi-square and F tests is to grow\
  \ a tree that is sufficient for pruning but not as computationally burdensome as\
  \ the maximal tree. Smaller node size further helps in creating a larger tree. The\
  \ result is often a large tree that overfits the data and is likely to perform poorly\
  \ in predicting future data. A recommended strategy for avoiding this problem is\
  \ to prune the tree to a smaller subtree that minimizes prediction error.\n\n7\\\
  . Run the DT Multiway Split node and open the Results.\n\n![image](img/f0169-02.jpg)\n\
  \nA smaller, but not maximal, tree is selected. In this case, the pre‑pruning resulted\
