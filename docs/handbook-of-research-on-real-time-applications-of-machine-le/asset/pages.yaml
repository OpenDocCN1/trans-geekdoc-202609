  md: '# INTRODUCTION


    This chapter aims to design a protected structure for Cyber Physical System(CPS).
    CPS is necessary for the succeeding generations smart Physical systems, constructed
    as a network of relation between substantial and virtual model. Its functioning
    hangs on the concrete process along with feedback loops. Revelation of new concepts
    revamped the Information Technology every day and one such mandated system is
    CPS, introduced in 2006. In late 2006 US National Foundation recognized CPS as
    a cue field for research and funded for numerous workshop related to CPS. Initially
    CPS is used in the infrastructure of power grids, home automation system and later
    in almost all fields. Security challenges of CPS and its security control systems
    were analysed during 2006 to 2009 (Jairo Giraldo, Esha Sarkar, Alvaro A. Cardenas
    Michali Maniatakos and Murat Kantarcioglu, 2017). In the succeeding years, CPS
    transmogrified as a sophisticated domain with countless attributes such as complex
    systems (Vegh and Miclea, 2014) and acquire data from sensor device machine to
    carry over in network with or without machine and human interaction (Bhabad and
    Scholar, 2015). Several security challenges arise, including securing protocols
    and initialization of certainty among CPS subsystems (Lu et al., 2013). Subsequently
    safety liability of CPS was investigated and its safety measures were initiated
    for confidentiality (Jacub Wrm, Yier Jin, Yang Lice and Shiyan Hu, 2016).


    Cryptography and Steganagraphy is merged to arrive a new solution for data security,
    moreover hierarchical approach is employed to the information for universal security
    (L. Vegh and L. Miclea, 2014). Cryptography is applied to frame secured physical
    unclonable function using Fuzzy extractors to overwhelm security obstacles, but
    still it retains the challenges in feedback protocols (Jin C, Herder L, Nguyen
    P.H, Fuller B, Devadas and Van Dijk M, 2017). To protect the information in sensor
    communication channel, an event-based cryptographic encryption function is established
    using non deterministic automation (Publio M. Lima, Lilian K. Carvalho, Marcos
    V. Moreira, 2020). To reduce the encryption time, a new encryption algorithm is
    proposed, to separate the sensitive information to be secured in CPS and encrypt
    it instead of encrypting all communications (Xiaogang Zhu, Gautam Srivastara and
    Reza M. Parizi, 2019). An advanced cryptographic method is employed to perform
    the operations directly on encrypted values without decrypting the text, but it
    occupies more memory space (Junsoo Kim, Chanhwa Lee, Hyungbo Shim, Jung Hee Cheon,
    Andrey Kim, Miran Kim and Yongsoo Song, 2016). In addition, to enhance security
