  md: '# i) Input and Hidden Layers


    The input layer consists of 41 neurons. The outputs of input layer are served
    into the hidden layers. A hidden layer uses ReLU as the non-linear activation
    function. Rectified Linear Unit is most popular activation function because of
    its simplicity and fastness. During training, weights are adjusted and fed into
    the next upcoming layer. Reducing the count of neurons from first layer to last,
    results in output with high accuracy.


    # ii) Regularization


    To regularize the neural network, dropout is used in DNN. Dropout is also called
    as dilution. Dilution used in neural network to avoid over-fitting problem. To
    make the whole process efficient and time-saving, Dropout (0.01) is used. Accuracy
    of neural network increased gradually when dropout value is less.


    # iii) Output Layer and Classification


    The output layer is the last layer in neural network. It involves only two neurons
    namely: Compromised and Uncompromised since it make use of binary classification.
    The hidden layer has 1024 neurons and its output fed into output layer. The mapping
    from hidden layer to last layer done by, a sigmoid activation function. The value
    of sigmoid function lies within the range 0 to 1.


    # iv) Prediction Phase


    In this phase, the data is fed into the proposed system to forecast the input
    data whether it is an attack or not. The system relates the input data and the
    weights with the expected output, and makes the prediction. At this phase, the
    accuracy, precision and recall of the system is considered for benchmarking purposes.


    # Performance Evaluation


    Neural network gets trained and then tested. After training and test phase, three
    DNN were associated in term of accuracy and confusion matrix. Accuracy is the
    percentage of correctly categorized data and all categorized data. Confusion matrix
    is used to identify normal and abnormal data. Correctly classified data is called
    as True Positive (TP). Correctly classified normal data is called as True Negative
    (TN). Wrongly identified abnormal data is called as False Positive (FP). Wrongly
    identified normal data is called as False Negative (FN).'
