    HMI techniques.


    # Business Level Maintenance Policies


    The process of maintenance is a continuous activity that involves maintaining
    the working condition of the equipment at optimal thresholds. Maintenance management
    involves sequence of related processes by utilizing the resources in an efficient
    and regulated fashion complying with performance standards. Every company has
    its own, unique maintenance policy that are dictum to be followed by the workforce
    at all levels. The salient features of these policies are:


    +   - To assure the reliability of equipment and safety of workers.

    +   - Maintain the equipment in proper calibration to avoid unexpected and frequent
    failures

    +   - Proper adherence to maintenance policies reduces the likelihood of loss
    in inventory and equipment

    +   - Negligence to maintenance policies may result in devastating effects such
    as:

    +   - Underutilization of equipment

    +   - Surge in the maintenance cost and labor costs

    +   - Increase in the cost of procurement of industrial spare parts

    +   - Occupational hazard


    Framing business level maintenance policy presupposes detailed planning. Proper
    planning and scheduling of maintenance activity on demand without any disruption
    of services and production is an important criterion for any maintenance planning
    board. It is to be concluded that every manufacturing company is entitled to possess
    customized, effective and robust maintenance policy in compliance with their business
    goals.


    # Implementation of Proposed Solution in Real Time Industrial Scenario


    The intermingling of physical world and cyber/ digital world is the most distinguishing
    feature of CPS. The real time deployment of the proposed framework necessitates
    the usage of variety of computing technologies along with comprehensive data handling
    mechanisms.


    +   - **Data Acquisition:** This is generally done by installing homogeneous or
    heterogeneous sensors at the site. Recent years have witnessed many digital'
  merge: -1
  img_proc: true
- pgno: 289
  md: 'sensors that reduces human interventions in measuring the physical world data.


    +   • **Knowledge extraction:** This is a quintessential phase for any CPS. The
    real-world data are processed and useful information are extracted from the underlying
    raw data. Data mining tools like Rapid miner, Oracle data miner can be explored
    to gain insights to the data. Alternatively feature extraction algorithms and
    Deep Learning algorithms are some of the potential candidates that combines the
    knowledge extraction and decision making.


    +   • **Maintenance and visualization solutions:** The CPS based maintenance solutions
    are assisted by AI, ML and DL algorithms that effectively diagnosis and prognosis
    the faults from the historic data. Visualizing the data and outcomes of the prediction
    is an easier way to convey the machine’s health status to the maintenance teams.
    Tableau, Zoho analytics, Sisence are some of the tools that can be considered
    for visualizing the inner details.


