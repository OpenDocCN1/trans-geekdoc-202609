    # ABSTRACT


    Data types and amounts in human society are growing at an amazing speed, which
    is caused by emerging new services such as cloud computing and internet of things
    (IoT). As data has been a fundamental resource, research on big data has attracted
    much attention. An optimized cluster storage method for big data in IoT is proposed.
    First, weights of data blocks in each historical accessing period are calculated
    by temporal locality of data access, and the access frequencies of the data block
    in next period are predicted by the weights. Second, the hot spot of a data block
    is determined with a threshold that is calculated by previous data access. In
    this work, big data is'
  merge: -1
  img_proc: true
- pgno: 226
  md: 'divided into multiple segments based on semantic connectivity-based convolutional
    neural networks. Each segment will be stored in the different nodes by adapting
    the blockchain distributed-based local regenerative code technology called BCDLR.
    Experimental results demonstrate the efficiency of the proposed model in terms
    of packet delivery ratio, end-to-end delay, energy consumption, and throughput.


    # 1. INTRODUCTION


    IoTs have grown more popular in the development of corporate applications. Since
    these dispersed sensors have generated massive volumes of data, gathering, integrating,
    storing, processing, and utilizing this data has become a critical issue for businesses.
    Bothe researchers and engineers are faced with the challenge of processing this
    voluminous heterogeneous data stored in widely distributed systems like CCSs (Sezer
    et al., 2017). IoT-based Data Storage Systems in CCSs is attempting to balance
    distributed executions on three parameters namely unified infrastructure resource
    managements, multi-tenant storages with isolated performances, and flexible scalability
    of systems (Ding, Z. et al, 2013)


    Transfers, processes, and integrations of IoTs are demanded massive, real-time,
    and unstructured data processes with hierarchical levels like data storage and
    analysis (Borthakur, D, et al, 2017). These issues are addressed in traditional
    data storage systems by fault-tolerant mechanisms (data copies) resulting in redundancy
    owing to poor utilization and increased data storage costs though only certain
    portions of information are accessed (Zhang, Q., et al, 2017 and Zhang, Q., et
    al, 2013).


    Current researches have proposed effective cluster storage solutions for these
    voluminous data from IoTs which are based on temporal localization of data accesses
    and establishment of weights for data blocks based on access histories and anticipated/forecasted
    weights of the block’s access frequencies (Barik, R.K., et al., 2018). Subsequently,
    threshold values determined from previous data accesses identify a data block’s
    hot (Marjani, M., et al, 2017 and Jan, B., et al, 2019).


    Data balances are maintained by altering copies of data blocks and storing them
    as distinct groups in high-performing low load nodes for improving access efficiencies
    and resource utilizations while lowering storage costs (Kumari, A., et al, 2018).
    Clustering techniques adapted to store data reliably and storing copies of frequently
    accessed data in multiple nodes ensures data availability at all times. However,
    storage overheads become very high when duplicate data is more (Ding, Z., et al,
    2013).


    To overcome those issues, an improved framework is introduced in this chapter.
    The main goal of the proposed work is to ensure optimal and reliable data storage
    with reduced storage overhead and ensured data integrity. In this work, big data
    is'
  merge: -1
  img_proc: true
- pgno: 227
  md: 'divided into multiple segments based on semantic connectivity-based convolutional
    neural networks. Each segment will be stored in the different nodes by adapting
    the blockchain distributed-based local regenerative code technology. This work
    ensures data integrity and as well as ensures data recovery by adapting the regenerative
    code technology.


    Section I of this research work examines the significance of big data storage
    in IOT networks, Section II provides an overview of the classical approaches used
    for big data storage, Section III compares research strategies and their benefits
    and drawbacks, and Section IV discusses simulation results. Section V discusses
    the conclusion and future direction for work.


    # 2. LITERATURE REVIEW


    This section reviews methods used for secure storage of IOTs in big data. Ding
    (Ding et al, 2013) proposed generic Statistical Database Clustering for Big Data
    Analysis in IOTs data. The study used statistical functions within DBMS kernels
    where complex statistical queries were transformed into conventional SQL queries.
    Moreover, statistics based analyses using distributed/parallel servers, resulted
    in increased performances in experimentations.


    Tripathi (Tripathi et al, 2020) suggested metaheuristic-based clustering for handling
    massive data based on the power of MapReduce. The study’s suggested approach used
    the searching power of military dog squads to identify the best centroids where
    MapReduce handled voluminous data. The study tested their proposed schema against
    17 benchmark functions for their efficiency in optimizations while comparing experimental
    results with 5 contemporary algorithms namely BOAs (bat optimization algorithms),
    PSOs (particle swarm optimizations), ABCs (Artificial Bee Colonies), MVOs (Multi-Verse
    Optimizations) and WOAs (Whale Optimization Algorithms). Moreover, the study’s
    parallel version used MapReduce [MapReduce-based MDBO (MR-MDBO)] for clustering
    large datasets of industrial IoTs.


    Hosseini (Hosseini et al., 2017) suggested in their study, a new method for predicting
    and pinpointing epileptic episodes followed by the use of deep learning structures
    including Stacked Auto-encoders, CNNs, enhanced optimizations based on PCAs (Principal
    Component Analyses), ICAs (Independent Component Analyse), and DSAs (Differential
    Search Algorithms). The study’s CCS solution for IoTs established recommended
    architectures for real-time processes, autonomous computations, and massive data
    storages.


    Wu (Wu et al., 2019) suggested a log fusion approach for tuning logs of components
    into structured data by removing noises, adding timestamps, and labeling data.
    The study introduced prediction models for voluminous data and improved sequence-'
