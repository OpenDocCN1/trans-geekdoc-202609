    # Decision Tree


    Decision tree is one of the supervised machine learning techniques. It is constructed
    based on ID3 algorithm (He & Runjing, 2017). In ID3 algorithm, for every single
    attribute Entropy and Information Gain will be considered as given in (1) and
    (2) respectively. Entropy calculates the disorder in target feature. Entropy value
    will either 0 or 1 since binary classification is used in our proposed model.
    Information Gain measures the features which properly classifies the target classes.
    The feature which has high information gain is designated as best result (Ahmed,
    Leandro, Mohamed, Makhlouf & Helge, 2019)


    ```

    Entropy(S) = - â p_i * log2(p_i)

    ```


    where i = 1 to n, n is the total number of classes in the target output and p_i
    is the probability of class ‘i’


    ```

    IG(S, A) = Entropy(S) - â((|S_v| / |S|) * Entropy(S_v))

    ```


    where S_v is the set of rows in S, |S_v| is the number of rows in S_v and |S|
    is the number of rows in S.'
