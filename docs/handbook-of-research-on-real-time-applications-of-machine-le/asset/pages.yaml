    # # CICIDS


    CICIDS is a series of intrusion datasets released by the Canadian Institute of
    Cybersecurity. As of this writing, there are three versions of the CICIDS that
    have been introduced which are known as version 2012, 2017, and 2018.


    The first version CICIDS 2012 (Shiravi et al., 2012) is collected as the network
    activity in seven days in 2010 with a total size of 84.4 GB. The dataset consists
    of several attack types such as HTTP DoS and DDoS using an IRC Botnet, as well
    as the normal activity.


    The second version CICIDS 2017 (Sharafaldin et al., 2018) is introduced to fix
    some limitations of version 2012. The CICIDS 2017 is collected in five days with
    a total size of 48GB.


    The CICIDS 2018 is the latest intrusion attack dataset as of this writing. The
    dataset can be considered as an improvement the version 2017.'
