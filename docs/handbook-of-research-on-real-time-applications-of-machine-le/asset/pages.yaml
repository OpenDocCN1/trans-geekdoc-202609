- pgno: 168
  md: "Cyber security can be achieved by a sound structured of information and specialized\
    \ experts in the field of cyber physical system (Gupta et al., 2020). In this\
    \ unit we describe vulnerabilities of cyber physical system in Industry4.0 by\
    \ classifying attacks according to following two target categories:\n\n+   1.\
    \ Vulnerabilities in Physical Devices and\n+   2. Vulnerabilities in intermediate\
    \ Network.\n\n# Vulnerabilities in Physical Devices\n\nCyber-physical system integrated\
    \ with serval physical devices with computation and communication. Physical devices\
    \ includes robotic arm, wireless sensors, robotic vehicles, automated machine,\
    \ monitoring devices etc. Several types of internal or external attacks could\
    \ be affected these physical devices such as:\n\n+   1. Physical attack: In a\
    \ **physical attack**, an unauthorized employer gain physical access in physical\
    \ devices to attack its structure in order to steal information or destroy all\
    \ infrastructure.\n+   \n+   2. Data injection attack: A malicious program is\
    \ injected in computer network by an attacker which corrupt all the device information\
    \ or send the confidential information to attacker through network. This type\
    \ of attacks are major problem of security in cyber physical system.\n+   \n+\
    \   3. Side-Channel attacks (SCAs): Side-Channel attacks steal the confidential\
    \ information from integrated circuit (ICs) or devices through analyzing the physical\
    \ parameter such as processing time, apply voltage, current flow etc.\n+   \n\
    +   4. Time Delay attack: A Time Delay separate the two event occurrence in mechanical\
    \ and electronic devices. The Time Delay attack is identification of vulnerabilities\
    \ in the physical devices by analyzing how long it takes the system to respond\
    \ to different inputs.\n+   \n+   5. Application layer attacks: Application layer\
    \ attacks also called DDoS attack (Distributed Denial of Service Attacks). This\
    \ type of attack are specially designed to break the services of application so\
    \ a particular device application not being able to deliver it services to the\
    \ user.\n+   \n+   6. Zero-day attacks: Zero day attack is a software related\
    \ vulnerabilities that recently exposed by an attacker to exploits a fault in\
    \ system which was unknown by developer. The name is derived from the number of\
    \ days that a software developer has been aware of the issue."
  merge: -1
  img_proc: true
- pgno: 169
  md: '# # Vulnerabilities in Intermediate Network


    Cyber-physical system also integrate the communication network capabilities to
    connect the cyberspace with physical space. The vulnerabilities also affected
    the manufacturing industries (You et al., 2020). It also increase the vulnerabilities
    in communication network. Generally network attacks are classify in to two categories:
    Active attacks and passive attack. In Active attack, the attacker modify, encrypt
    or damaging the information in communication channel. In passive attack, the attacker
    only access the unauthorized network and steal the personal information. The attacker
    not change the original information flow in network in passive attack.

    Types of Network Attacks:


    +   1. Man-in-the-Middle Attacks: As a name, this type of attacks are access information
    between any communication networks to access the private keys. A person or attacker
    who stands in between two communicating parties are known as man in middle. Middle
    attacker read, monitor or access the controls of communication and can change
    the flow of information between any two parties. Man in the middle attacks is
    hard to identify. It is a type of Active attacks in network.


    +   2. IP spoofing: In IP spoofing, an attacker change the source address in the
    Internet Protocol (IP) header packet to make a user think the packet is from a
    trusted source. Using IP spoofing, thousands of computers send message using same
    source IP address to a large numbers of destination. IP Spoofing is normally a
    type of Denial-of-Service (DoS) attacks, which increase the network traffic. IP
    spoofing also known as Packet modification attacks.


    +   3. Eavesdropping: Generally Eavesdropping is the act of listening to the personal
    conversation of others without their consent. In eavesdropping attacks, the attacker
    monito the network packets and steal the personal information in weak network.


    +   4. Jamming attack: In Jamming attack, attacker send the several radio signals
    in wireless network to disrupt the communication by minimizing the Signal-to-Inference-plus-Noise
    ratio. Wireless signal jamming devices are most often used to interfere with wireless
    networks, a type of denial of service (DoS) attack.


    +   5. Collision attack: In Collision attack, the attacker change the checksum
    bit in sent packet and retransmitted this modify packet to receiver.


    +   6. Wormhole attack: In wormhole attack, two attackers locate strategically
    in the network and keep track the network and record wireless information.


    +   7. Sinkhole attack: In Sinkhole attack, a compromised node attract the network
    traffic by sending it fake information to its neighbors.'
