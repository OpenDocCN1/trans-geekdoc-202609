    # K-Means Algorithm in Hospital Clustering


    +   1. Select k number of clusters.

    +   2. Select k number of centroids at random from the data set of hospitals.

    +   3. Calculate proximity to each of these centroids from the hospital by determining
    the Euclidean distance d between them.


    ```

    d=√((s₁-s₂)²+(l₁-l₂)²+(t₁-t₂)²+(a₁-a₂)²+(c₁-c₂)²+(f₁-f₂)²+(r₁-r₂)²)   (1)

    ```


    Here the subscripts (1) represent the values of the centroid and subscript (2)
    represents the value of attributes for the data point that is the hospital to
    be clustered.


    +   s = Specialization (categorical variable)

    +   l = Location

    +   t = Threshold Rating

    +   a = Average cost of treatment

    +   c = Capacity

    +   f = Fatalities'
  merge: -1
  img_proc: true
- pgno: 253
  md: 'r = Recovery rate


    +   4. Group the hospitals into k sets based on the minimum distance d calculated
    around the given centroids.

    +   5. Calculate the average of each attribute within each cluster formed around
    these centroids.

    +   6. Updated centroids have their attribute value as an average calculated for
    hospitals assigned to its cluster.

    +   7. Continue performing steps 3, 6 till these centroids cease to update.

    +   8. Obtain the final clusters.


    Initially, the centroids are selected in a randomized manner. It ensures that
    the process of clustering executes quickly. The proposed algorithm has the time
    complexity of O(n^2), where n is the number of hospitals to be clustered.


    If a new hospital enters the CluniacChain system, it gets classified using the
    K-Means algorithm described above into a cluster in which other hospitals with
    similar attributes are grouped.


    CluniacChain then re-clusters the hospital when the ratio of the number of clustered
    hospitals to the number of unclustered hospitals is severely disturbed from the
    preset threshold. For the ratio calculation, the system fetches the value of the
    number of hospitals clustered since the previous iteration and the number of the
    new additions/removals of hospitals since the last clustering from the hospital
    cluster table defined. Once re-clustered, a more accurate cluster is formed with
    the updated assignment of new hospitals. Now the system reinitializes the number
    of additions/removals of unclustered hospitals.


    The cluster allocation by CluniacChain''s recommender system for a new patient
    is done by calculating the Euclidean distance d as shown in Eq. (1) of the query
    with details from Table 1. These details are sent to the recommender system and
    compared to each k centroids to form the clusters. After cluster allocation, a
    list is presented to the patient, ranking hospitals with the lowest Euclidean
    distance of the selected cluster. In the following sections, the blockchain specification
    and schema for databases are explained to store and share the EHR records by the
    CluniacChain system.


    # Blockchain Specifications


    Consortium blockchain, also known as a federated blockchain, is the blockchain
    type used in our system. Here the hospital clusters act as the federated entities
    responsible for pushing data onto the blockchain. The patient needs to provide
    their consent for the access of medical records by the hospital. Keep the Electronic
    Health Records'
  merge: -1
  img_proc: true
- pgno: 254
  md: 'in the cluster''s database and create pointers to the medical records. Only
    push these pointers to the blockchain network as Smart Contracts between the hospital
    and the patient. Because medical records are very data expensive, storing them
    on the blockchain would make the whole blockchain network very data inefficient.
    The pointer-based approach helps in overcoming this. Thus, healthcare records
    will be kept in the cluster''s database.


    Data stored on the cluster''s database is in encrypted form so that in case of
    a data breach, this ensures that the data can''t be misused. The encryption is
    done based on the attributes issued by the attribute issuers. When the data is
    encrypted and signed by the patient, enter it into the cluster database. The application''s
    database is managed using firebase, which is a NoSQL cloud-hosted database. It
    can scale up as per the requirements. It is a platform developed by Google for
    providing database support to mobile and web applications. Firebase provides CRUD
    APIs for seamless integration with the application. Since the patient records
    consist of sensitive data, therefore it is encrypted before being pushed to firebase.
    The encryption algorithm used is AES, and the secret key used for encryption and
    decryption of data is the user''s document key provided by firebase. The subsequent
    sections discuss Attribute-based encryption and signing in detail.


    Since the system comprises a consortium blockchain, the consensus algorithm used
    is Proof of Stake (PoS). Due to the prior authorization of the hospital clusters
    to push data onto the blockchain, using Proof of Work (PoW) consensus would be
    a waste of computing power and resources (Cao et al., 2020, p. 480-485). For the
    verification of a block, choose another hospital cluster. It is done based on
    an age factor of the Hospital Cluster. The older the age, the greater the chance
    of being selected. After a Hospital Cluster has done its verification task, reset
    its age to zero to avoid starvation. The hospital that will push fraudulent transactions
    onto the blockchain would be given a low priority in the recommender system, one
    of the factors responsible for recommending the hospital. Since no hospital would
    want its reputation to go down, it ensures that it constantly pushes correct data
    to the chain. Keep a counter for each hospital that would increase every time
    a fraudulent transaction is encountered from that hospital. Upon crossing the
    threshold of fraudulent transactions, that hospital would be removed from the
    system. Therefore, the CluniacChain penalty system prioritizes valid transactions
    and incentivizes the hospitals to push correct data to the chain.


    Figure 6 shows the performance of the CluniacChain prototype with PoW implementation.
    It shows how PoW is a time-consuming mechanism. The block size was fixed at 1
    KB, and the mathematical puzzle involved finding a number q such that hash(pq)
    contained leading five zeroes, where p is the previous proof, and q is the new
    proof. The prototype was tested on Intel(R) Core (TM) i5-7300HQ CPU @ 2.50GHz,
    2496 Mhz, 4 Core(s), 4 Logical Processor(s) using Python 3.8.10.'
