  md: '# # INTRODUCTION


    Cardiovascular diseases (CVDs) are a severe menace to people. They are also the
    cause of rising global mortality rates. Among all fatalities worldwide, CVDs is
    the reason of 31% fatalities (Sahoo et al., 2019). The main causes of CVDs include
    hypertension, unhealthy diet, smoking, unhealthy lifestyle.


    According to World Health Organization (WHO) statistics, heart attacks claimed
    the lives of 17.9 million people in 2019, with the majority of these deaths occur
    in countries with a low to average income (Gupta, 2016; “CVDs,” 2021). The death
    rate from cardiovascular diseases is approximately 0.27% in India (Prabhakaran
    et al., 2016). It is suggested that adopting a healthy lifestyle can prevent 90%
    of CVDs (McGill et al., 2008).


    This paper proposes a model based on deep learning to classify different arrhythmias
    on the electrocardiogram (ECG). The organization of paper is as follows. Section
    2 describes the background of the field. Section 3 presents the state-of-the-art.
    Proposed approach including classification, model configuration, and dataset used
    is described in Section 4. Section 5 describes the experimental results. Finally,
    Section 6 shows the findings of our proposed model.


    # # BACKGROUND


