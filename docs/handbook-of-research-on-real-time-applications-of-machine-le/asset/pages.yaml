- pgno: 64
  md: '# CYBER-PHYSICAL SYSTEMS FOR AGRICULTRE DOMAIN


    In agriculture, mechanization is widespread. However, advances in robotics and
    autonomous systems will propel agriculture forward as a result of artificial intelligence
    and embodied systems applications (Tyagi, S.K.S., et al.2020). A drone is a flying
    robot in and of itself, but when a generation of embedded intelligent CPS robotics
    systems is deployed, a substantial evolution will occur (Huo & Chaudhry, 2021;
    Rakesh Kumar Birda & Manish Dadhich, 2019) These systems can be interconnected,
    interdependent, collaborative, autonomous, and provide computing, communication,
    checking, and control of physical components and processes in various applications.
    In other words, by observing how these systems communicate with the physical world
    (including human users), Typically intended as intelligent sensor networks of
    (autonomous) systems with unique detecting and actuation capabilities, they play
    a key role in acquiring data (Jimenez et al., 2020). The cyber and physical worlds
    cannot be considered separate entities, yet they are inextricably linked with
    sensor/ actuator integration in so-called cyber systems. By providing real-time
    control coming from conventional cyber systems, cyber systems became responsive
    to the physical environment. As a result, the concept of a CPS was born. The “assimilation
    of computation with physical processes” is what a CPS is. Sensors and actuators,
    for example, are used to connect computational systems to the real environment.
    CPS presented significant hurdles, especially because the physical components
    of such systems introduced safety and dependability; as a result, typical computing
    abstractions must be altered to meet qualitatively different requirements than
    those in general-purpose computing (Liao et al., 2021).


    Furthermore, physical components differ fundamentally from object-oriented software
    components, yet concurrency is both inherent. It was a significant advancement
    in state of the art in computers (Malathi & Padmaja, 2021). The interaction of
    the “cyber” and “physical” aspects is crucial in CPSs; computation, control, sensing,
    and networking can be extensively interwoven into every component, and component
    and system behavior must be safe and interoperable (Myllyaho et al., 2021; Shalendra
    Singh Rao, n.d.)7, CPSs have been on the model of engineering research agenda
    in the United States, and since 2010, the European academic and industry community
    has focused on CPSs as paradigms for the future of systems. The industry as a
    whole has shown a lot of interest. This is evident when considering that embedded
    systems, wireless sensor networks, IoT, communication protocols, and their interactions
    are the most important elements and pillars in CPS (Hiran & Henten, 2020; N. Sharma
    & Dadhich, 2014) To move forward with CPS’s difficulties and prospects, there
    must be widespread agreement on fundamental principles and shared knowledge of
    the features and technology that are unique to CPS.'
  merge: -1
  img_proc: true
