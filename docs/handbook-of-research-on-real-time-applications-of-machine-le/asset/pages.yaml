  md: '# Active Learning


    Active learning (Dang, 2020) is a method to actively select the next instance
    to the training set. By using active learning we can start the training process
    with a small subset of the training data then select the next instance from the
    pool that likely improves the performance of the model. The core idea is that
    we select some unlabeled data points that we expect if they are labeled and added
    to the training set, the predictive performance will increase significantly. Some
    common metrics to determine the data points are entropy or the predictive scores.
    Then we can ask some experts to manually label these data points. By doing so,
    we reduce the required effort of the manual labeling task which is expensive.


    (Dang, 2020) showed that by using active learning, the computational power is
    reduced but the predictive performance is maintained.


    # OPEN PROBLEMS AND FUTURE RESEARCH DIRECTIONS


    In recent years, machine learning-based intrusion detection systems have achieved
    a lot of success. However, there are open problems in the field that we will discuss
    here.


    +   How to generate a large realistic labeled dataset? As we discussed in the
    previous section, many attack datasets have been introduced in recent years. However,
    most of them are created using a simulated environment. We can use these datasets
    for educational purposes, but indeed there is a need for the dataset from real-world
    attacks. However, how to generate the real attacks is not a trivial question.
    Probably we need cooperation from some retired black-hat hackers.


    +   How to deal with zero attacks? Dealing with zero attacks is still a crucial
    challenge for researchers. Even high-performance classifiers like xgboost will
    fail if it needs to deal with unknown attacks. Reinforcement learning algorithms
    have a lot of potentials but the state-of-the-art performance does not catch up
    with other supervised learning techniques. A hybrid method might be a solution:
    while a supervised learning model deals with known attacks, we train a reinforcement
    learning algorithm simultaneously to catch the attacks that the first model missed.


    +   How to train the model using low-power devices? The state-of-the-art models
    used in the intrusion detection problems are all complicated models, hence requiring
    a lot of computational power. It is not suitable to put them in low-powered devices
    such as home routers or IoT devices, particularly if we need'
  merge: -1
  img_proc: true
- pgno: 139
  md: 'to update the models lively. Distributed learning might be a solution: we distribute
    the training process to multiple devices in the network.


    +   • How to forget the outdated training point? In many cases, if we detect some
    training data points are outdated or not useful anymore, we need to remove these
    data points from the training dataset. The naïve approach is to retrain everything
    from scratch. However, it is not a practical approach (Dang, 2021).


    # CONCLUSION


    In this chapter, we review the intrusion detection problem. The intrusion detection
    problem is a core problem of many cybersecurity systems today. In this paper,
    we describe and formulate the problem as the classification task. We review the
    machine learning algorithms that have been studied for intrusion detection in
    the literature. We address the open challenges and draw some potential research
    ideas to solve these challenges.


