    # CYCLIC FRAMEWORK OF CPS BASED PREDICTIVE MAINTENANCE


    It is evident that CPS transforms the technologies by interfacing the physical
    and cyber world (Baheti, 2011). The surge in the computational capabilities and
    affordability of sensors has made the cutting edge technologies like Big Data,
    AI and IoT recent buzzwords in Industry 4.0. The CPS are physically engineered
    systems that are integrated with communication and high tech computing technologies
    (Rajkumar, 2010) . The new modalities of these systems involves amalgamation of
    multitude of technologies to monitor, assess, control and coordinate various physical
    processes by means of computations. The smooth handover of physical space to the
    cyber world for intelligent decisions making and enforcing those decisions back
    into the physical world is the crux of the CPS.


    The era of predictive maintenance has seen a rampant surge after the multidisciplinary
    researches focused on building intelligent solutions to solve maintenance issues.
    PHM and predictive maintenance has emerged as a potential candidate to implement
    many CPS frameworks. As CPS is still in its embryonic stage, there is definitely
    space for developing new frameworks to aid the deployment of'
  merge: -1
  img_proc: true
- pgno: 284
  md: 'predictive maintenance solutions in manufacturing systems. The detailed framework
    is presented in Figure 8.


    # Figure 8. Cyclic framework for CPS based Predictive Maintenance


    ![](img/0e5ed5b85e46b41ac1e84d52eda7fb86_284_0.png)


    It is apparent that implementation of predictive maintenance solutions in smart
    manufacturing involves physical condition monitoring of equipment for isolating
    operational profiles. Not all operational profiles are fruitful in detecting the
    presence of faults. It is extremely necessary to delineate the fault profiles
    that could effectively characterize the health condition of the equipment. Thus
    learning important trends and patterns from the degrading signals are termed as
    feature extraction. These trends and patterns are then subjected to decision support
    systems, where learning algorithms are deployed to diagnose or predict the occurrence
    of faults. As the world is swiftly moving into the era of visualization, the results
    and detailed analysis are'
  merge: -1
  img_proc: true
- pgno: 285
  md: 'converted to visuals for effective understanding. The maintenance decisions
    are made of the top management regarding the maintenance activities, which are
    again consigned into the physical world. A more granular view of the proposed
    framework is explained here.


    # Data Acquisition


    Data acquisition from sensors is the primary means of collecting the physical
    properties and its related events in the environment. Predictive maintenance involves
    the usage of heterogeneous types of sensors like vibration, temperature, oil analysis,
    flow rate, pressure etc. The observations from the sensors can be any one of the
    following types:


    +   • Structured data: They are clearly defined in some fixed pattern or format.
    These data can be readily processed by higher levels.


    +   • Unstructured data: These data are not organized or could be fitted in some
    specified format. They are naïve data with large quantities of noise. These data
    have to undergo intensive preprocessing to convert them into usable forms.


    +   • Semi structured data: They are the data elements which are not in specific
    pattern but carry some inherent organizational structure. Minimum to moderate
    amount of data cleaning is required to process this data.


    # Knowledge Representation


    The data that is sourced by the sensors is actually a warehouse of information.
    The process of knowledge representation delves on the raw data to extricate the
    judgments and beliefs suitable to be processed by intelligent environments. The
    condition monitored data are transformed into maintenance knowledge space to enable
    business level knowledge sharing (Guo Jian-wen, 2010). Alternatively ontology
    based knowledge representation is also done. Apart from these, logical and unambiguous
    rule representation, semantic network representation, predicate and first order
    logic, Fuzzy rules, attribute based frame representation and conditional rules
    are some of the other popular structured knowledge representation forms. The choice
    of knowledge representation depends on the industrial use case.


    Any form of representation must adhere to the following important properties:


    +   • Accurate representation: The representation strategy must be capable of
    characterizing and representing versatile and heterogeneous knowledge with adequate
    accuracy.'
  merge: -1
  img_proc: true
- pgno: 286
  md: '+   - **Inferential Adequacy**: This refers to the trait of dynamically forming
    new representational structures from already existing ones.

    +   - **Efficient inferences**: The knowledge representation form must be simple
    and effective such that drawing inferences from them is easy.

    +   - **Acquisitional efficiency**: This is the ability to automatically attain
    higher knowledge levels.


    # Decision Support Systems


    Engineering predictive maintenance is strongly supported by decision making algorithms
    and models. The knowledge obtained from the symbolic reasoning in the previous
    phase is utilized by learning algorithms and AI based methodologies to diagnose
    the faults based on the condition monitored data. These algorithms reduce the
    degree of uncertainty that is widely prevalent in conventional condition based
    maintenance systems. The intelligent predictive maintenance decision support system
    complements the conventional maintenance process by including intelligence with
    a greater amount of predictive prowess based on the degradation trends and patterns.
    The primal goals of intelligent decision support systems are listed below:


    +   - Identification of loopholes in conventional maintenance systems

    +   - Finding new ventures for innovations

    +   - Assigning priority based maintenance tasks

    +   - Upgrading the maintenance skill set

    +   - Integrating production and maintenance activities


    The decision support systems are generally implemented by amalgamating the techniques
    like big data, fuzzy logic, machine learning models and tools, deep learning techniques,
    Internet of Things and predictive analytics. Lot of algorithms, frameworks, tools
    and models are currently surging in as a result of research. The results of decision
    support systems comes in four flavors:


    +   - Intelligent condition monitoring

    +   - Fault diagnosis

    +   - Fault prognostics

    +   - Prediction of Remaining Useful Life of the equipment


    These results can be broadly placed into two categories namely reactive maintenance
    strategies and proactive maintenance strategies. The maintenance activities that
    are carried out after the occurrence of faults are termed as reactive strategies.
    Fault diagnosis is a reactive strategy while fault prognosis is proactive'
  merge: -1
  img_proc: true
- pgno: 287
  md: 'strategy, where faults are predicted from the early warning signs. Prognosis
    can be either a classifying mechanism which labels the equipment to be in faulty
    or healthy state; or a regressive algorithm that predicts the time at which the
    equipment fails completely (RUL).


    # # Data Visualization


    Graphical representations of data, information, intermediate results, exploratory
    data analysis, signal representation are easy ways to understand inherent patterns,
    trends and even outliers. The visualization helps to extract latent correlations
    between various physical entities. Visualizations in predictive maintenance serves
    the following purposes:


    +   • Deeper insights about the various physical quantities can be obtained by
    drilling into the data

    +   • Higher degree of dynamicity

    +   • Visualizations can effectively portray the results of various pre-processing,
    signal extraction and predictive models.

    +   • They are time saving approach and are effective communication tools about
    predictive maintenance


    Another notable area that draws attention is Human–machine interaction (HMI),
    which is actually the communication between a human and a machine through a user
    interface and is shown in Figure 9. The stages in this interaction process are
    intention, selection, execution and evaluation [28]. The workflow manager is responsible
    for the data exchanges and communication between Machine to Machine and Machine
    to Human in the production process (Ziqiu Kang, 2012).


    Figure 9. sequence of HMI


    ![](img/0e5ed5b85e46b41ac1e84d52eda7fb86_287_0.png)


    The visualization tools are able to process dynamic scenarios such as prediction
    of RUL in aircraft engines, health state of nuclear and thermal power plants (Scheifele,
    2014). Human machine cooperation is an advanced form of HMI that addresses the
    new issues emerging in human machine association. Portable and handheld devices,'
  merge: -1
