  md: '# Machine Learning Algorithms


    Machine learning centers on the improvement of computer programs that can get
    to information and utilize it to memorize for themselves.Machine learning has
    played an essential role in big data systems due to its ability to efficiently
    discover hidden information and valuable knowledge. Appreciations to the advanced
    technology of machine learning and medical imaging for the rapid development of
    undergone computerized healthcare. Machine Learning is a data analysis of application
    belongs to build a model that desired predicted output for available data by predictive
    and statistical features.


    # Classification Using Machine Learning Algorithms


    The classifiers are used in extracting the features from the data values of EEG
    signals. Among the various machine learning algorithms, Random Forest, Gradient
    Boosting and Decision tree is implied in the recognizing the variation from the
    extracted data values. Random forest is a learning algorithm that is supervised.
    It makes a “forest” out of an gathering of decision trees, which are commonly
    prepared using the “bagging” method. The bagging method’s basic premise is that
    combining several learning models improves the overall result. Mainly, the feature
    is concerned with time frequency and wavelet transformations. Since random forest
    is supervised learning algorithm concerned, it proves to be the better suited
    and also reduces the complexity. Random Forest is a tree-based machine learning
    system that leverages by combining the control of several decision trees. A random
    amount of trained data is used for classification purpose. D represents the dimension
    of extracted input features. The dimension of the subset features which are selected
    is represented as d. The d value is seen to be leaser than D. Among the three
    classifiers, performance proves to be given better for Random Forest (RF). The
    error rate is found on two aspects. One, the correlation between the tress formed
    form extracting the valuable feature set from EEG dataset in constructing the
    forest. Other, is the strength of the particular tree in the selected forest.
    When the strength is increased, the error rate is highly reduced. The another
    algorithm which is taken is gradient boosting technique. In machine learning algorithm
    faults can be partitioned into two categories: bias error and variance error.
    Gradient boosting is one of the boosting strategies that is used to reduce the
    model’s bias error.For classification and regression, Decision Trees (DTs) are
    a non-parametric supervised learning method. The decision tree algorithm can be
    used for solving regression and classification problems; the goal is to learn
    simple decision rules from data attributes to develop a model that predicts the
    value of a target variable. Random forest is very effective in classification
    that helps in constructed at the training time and the output of the class can
    be either classification'
