    # CONCLUSION


    The proposed system incorporates blockchain technology to store medical records
    to harness its potential advantages in the medical sector. The system uses the
    Attribute-based encryption method to sign the EHR of the user such that only authorized
    personnel can retrieve the EHR using the designated attribute keys they possess,
    ensuring that the EHRs are secure and no unauthorized access is allowed.'
