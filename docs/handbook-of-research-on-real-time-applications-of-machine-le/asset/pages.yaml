  md: 'Communicating with customers through live chat interfaces has become an increasingly
    popular means to provide real-time customer service in e-commerce and medical
    services domains. Customers use these chat services to obtain information, seek
    assistance, or consult for reservations. The real-time nature of chat services
    has transformed customer service into two-way communication (Mero, J., 2018).
    The addition of a chatbot to gather user inputs can further enhance the proposed
    system.


    At least four different structures are the basis of the functioning of a chatbot
    (Davenport, T., & Kalakota, R., 2019):


    +   - Natural language processing: To make sense of the demands.

    +   - Knowledge management: To process the relevant details and provide an answer.

    +   - Deep learning helps the chatbot improve its response to each interaction.

    +   - Sentiment analysis: To detect the frustration and transfer them to a human.


    The idea is that the user enters their symptoms as the input in the input section
    of the chatbot. Then the chatbot finds the keywords from the given text and updates
    the state of the dialogue using the state tracking system (Noroozi, V., Zhang,
    Y., Bakhturina, E., & Kornuta, T., 2020). After the user has provided all their
    inputs, the chatbot converts the results into a natural language and gives the
    output back in a form that the user (human) can understand.


    Section 2 of the paper explores existing blockchain-based Healthcare Systems available
    in the literature. Description of the proposed architecture of the system CluniacChain
    is in Section 3. Section 4 provides the implementation, and Section 5 provides
    the conclusion, highlighting the benefits of CluniacChain. The blueprint of the
    database used by the described system is present in the appendix.


    # LITERATURE SURVEY


    Blockchain application extends to pharmaceutical traceability, data sharing, clinical
    trials, and device tracking (Bell, L., Buchanan, W. J., Cameron, J., & Lo, O.
    2018). Passing healthcare data through third parties, insurance, and healthcare
    providers puts it at substantially high risk. Thus, healthcare data interchange
    is a problem. Data sharing and interoperability can work together only if the
    proposed system takes care of privacy. Our system will allow nationwide interoperability
    by implementing Electronic Health Records (EHRs) (Reisman, & Miriam., 2017) securely.


    With the increasing internet usage, people started using it to browse related
    symptoms out of curiosity which led to the development of Natural language-based
    chatbots and prediction systems. Based on the text provided, these systems utilize'
  merge: -1
  img_proc: true
- pgno: 246
  md: 'various NLP algorithms to engage with the user and predict the user’s disease.
    The features from the text that are symptoms, in this case, are extracted and
    analyzed to predict the output (Rajput, A.E., 2019).


    However, only a limited number of applications exist that combine these prediction
    systems with blockchain technology. Many barriers stand in the way of blockchain
    technology emerging in the field of healthcare. One of the prominent barriers
    is the inherent resistance to change the current practices and move to blockchain.
    Our system will help remove this reluctance by keeping the patient at the center
    and taking care of their privacy. A sublime way of storing data between the patient
    and the hospital on a consortium blockchain is smart contracts. Prior application
    of smart contracts in healthcare is limited. Thus, the data storage techniques
    on the permissions authorities need to be analyzed further.


    Some services (HealthCoin, 2019) have expanded their vision towards building a
    system to construct a global electronic health record system. Other initiatives
    are combining AI/ML to improve healthcare services. There are existing systems
    that issue a smartcard to link EHR data with blockchain-based identity. Others
    manage the permission and authorization for the data in a decentralized manner.
    These systems (BurstIQ., 2017) see the future of healthcare in blockchain technology
    because they believe that it keeps the patient at the center.


    There is extensive research available on blockchain security and challenges. Some
    of these research works (Park, J., & Park, J., 2017) proposed contracts through
    a multi-signature technique ensuring secure transactions. Such a system discards
    transactions with improper configurations. Additional data security is possible
    by using encryption algorithms such as AES (Uthayashangar et al., 2021). Systems
    can combine AES with Attribute-based encryption to store encrypted data securely
    in untrusted cloud servers (Yadav et al., 2020, p. 2321 - 2336). Healthcare systems
    can benefit from this and allow secure storage and sharing of patients’ data.


    Further, combining chatbots with the healthcare system can enhance the application
