  md: '# ROLE OF CYBER PHYSICAL SYSTEMS IN PREDICTIVE MAINTENANCE


    The Industry 4.0, swarming sensor deployment, data analytic tools, developments
    in predictive analytics and BDA has collectively conferred to achieve excellence
    in the field of smart manufacturing (Saeed, 2019). The notion of Cyber physical
    Systems (CPS) appears to be an amalgamation of computing entities that connects
    the physical world with the digital world (Monostori, 2014). Cyber physical systems
    operate on 3C''s namely Connect, Communicate and Control. This makes them best
    suited for use cases like industrial automation. CPS redesign the outlook of the
    entire manufacturing sector by transforming the industries into a complete cognitive
    enterprise. The three major pillars that foster the growth of CPS in industries
    are:


    +   - Interconnection between various edge devices

    +   - Analytics and visualization of industrial Big Data

    +   - Smart decision systems


    Figure 2. CPS connecting the physical and digital world


    ![](img/0e5ed5b85e46b41ac1e84d52eda7fb86_271_0.png)


    Figure 2 depicts the interconnection of the physical and digital world through
    CPS. The raw data from the physical entities are recorded through sensors. The
    actuators operate in reverse direction which realizes the physical process from
    the sensor values. These data are cached in a storage medium. All these activities
    ensure that the physical world data is decoded and further processed by the virtual'
  merge: -1
  img_proc: true
- pgno: 272
  md: 'computing systems. The cyber world comprises innumerous advanced technologies
    for intelligent data analytics such as predictive analytics, Edge AI, Machine
    Learning, Deep Learning, fog computing etc. The data from the physical world floats
    in the cyber world through multiple interconnection mediums such as WAN, LAN,
    Low range communication and wireless medium. The general perspective of CPS is
    given in Figure 3.


    # Figure 3. Various perspectives of CPS in the context of Industry 4.0 (Lee, 2015)


    ![](img/0e5ed5b85e46b41ac1e84d52eda7fb86_272_0.png)


    +   * **Smart Connections at More Granular Level:** Various networking technologies
    like LAN, WAN, Fibre optic cables and wireless medium are deployed to collect
    data from the edge devices installed at various geographic locations. Appropriate
    sensors, actuators, data transfer protocols, data security measures are the key
    components of the CPS. Inappropriate selection of these entities will heavily
    penalize the final performance of the CPS system.

    +   * **Decoding data:** The data collected from various sensors actually represent
    the physical processes. Proper analysis will transform these data into useful'
  merge: -1
  img_proc: true
- pgno: 273
  md: 'information, which escalates as higher level knowledge. Visualizations and
    exploring interdependencies among the data will give a detailed understanding
    on the domain. These results are later converted into valuable business insights.


    +   * **Virtual level:** This is a more complex and advanced level where the acquired
    information reaches a central repository. CPS systems are built at this level
    only after extracting useful information from the free floating data. Some of
    the common ways of uprooting information are similarity analysis, anomaly detection,
    surprise event detection etc. These form the key constituent of the advanced decision
    support systems that are built in any CPS.


    +   * **Cognitive level:** After acquiring detailed knowledge, the intelligent
    decision making is done on site or in remote mode of control. Cognitive data analysis,
    insights drawn from data, exploration of the domain and diagnostic procedures
    are considered for achieving higher level knowledge to build the decision support
    systems.


    +   * **Configuration:** This level holds the supervisory control of the entire
    CPS. The feedback obtained from the cyber space is used to make the CPS more adaptive,
    reliable, self-configurable and self-optimized. The implications drawn from the
    cognitive level are applied to take real time corrective, preventive and predictive
    decisions.


    # Failure Mode and Effect Analysis


    Failure Modes and Effect Analysis (FMEA) is a traditional failure prognostic tool
    that is widely adapted in industries. This strategy enumerates all possible failure
    modes in which an equipment could operate along with the recovery actions (Okoh,
    2014). Apart from isolating the failure modes, FMEA also focuses on the effects
    of faults and the degree of severity of the faults. The severity of failure is
    gauged based on three primary variables namely damage severity, iteration of its
    occurrence and delineating the faulty component. All these three factors are integrated
    to form Risk Priority Number (RPN) as mentioned in equation 1.1.


    RPN = Severity x Occurrence x Isolation (1.1)


    The RPN score is considered as an important metric to assess the impact of a specific
    fault or failure. The value of RPN is a predominant factor in evaluating the impact
    of the risk. The risks are higher, when the score is high. The historic data and
    heuristics are also involved in determining the extent of risk occurrence. The
    complete FMEA chart is given in Figure 4.'
  merge: -1
  img_proc: true
- pgno: 274
  md: '# Figure 4. Failure Modes and Effect Analysis


    ![](img/0e5ed5b85e46b41ac1e84d52eda7fb86_274_0.png)


    The continuous condition monitoring of the equipment under investigation will
    help in the process of fault identification. The cause of effect analysis of the
    fault is done to determine the reason behind the failure. The risk priority is
    estimated based on the RPN, which holds a primary role in carrying out the maintenance
    activity. This will greatly reduce the effect of faults and equipment failure
    in industries. The two common types of FMEA that is widely adopted by manufacturing
    industries are:


    +   - **Design Failure Mode and Effect Analysis (DFMEA):** This mainly probes
    into the system to detect design-related failure and its controls. Malfunctioning
    of finished products, reliability and safety in the context of the product design
    is assessed by DFMEA. This is very desirable, since the failures are controlled
    at the design level without causing much damage to assets.

    +   - **Process Failure Mode and Effect Analysis (PFMEA):** This mainly focuses
    on the faults and failures that are likely to occur in various manufacturing processes
    of equipment such as assembling, fabricating and mounting. This analysis is very
    much useful in identifying missing parts, misalignment, inappropriate dimensioning
    etc.'
  merge: -1
  img_proc: true
- pgno: 275
  md: 'FMEA is the classical maintenance solution that is widely adopted in manufacturing
    industries. Though it is very simple but effective, FMEA depends on expert''s
    decision. The rudimentary faults and failures can easily be identified and isolated.
    This is a more economical predictive fault diagnosis procedure with intensive
    human activity.


    # # Advantages and Disadvantages of FMEA Analysis


    FMEA is a well-structured and logical way of identifying the faults in a cost
    effective way. This is a proven methodology that highlights the key performance
    areas that require attention. The benefits and limitations of FMEA are analyzed
    here:


    # ## Advantages of FMEA Analysis


    +   - Early identification of faults and failures

    +   - Easily highlight the system interfacing problems

    +   - Keeps track of product and process failures, whose knowledge will be immensely
    helpful to improve in the lagging areas.

    +   - Helps the architect or designer about the pitfalls in the product at the
    design stage

    +   - Proper documentation of failure modes and its mitigation strategies

    +   - Easily designed either through hand drafted sheets or computer software

    +   - Recovery actions can be planned according to the RPN score


    # ## Limitations of FMEA Analysis


    +   - One of the traditional methods that requires tedious and human intensive
    tracking activities.

    +   - When the FMEA is not done on proper time, then it does not serve its purpose

    +   - Detection of multiple failures and propagation of failures to different
    points is often disregarded

    +   - It is a complete subjective analysis

    +   - FMEA should be built as a dynamic system, where frequent analysis and updates
    should happen

    +   - Uncertainty in assessing the failure and recovery rates


    # ## Rationale of CPS in Predictive Maintenance


    Industry 4.0 mainly focuses on imparting smartness at every feasible locale in
    its spectrum. One of the most lucrative areas is predictive maintenance, where
    the'
  merge: -1
  img_proc: true
- pgno: 276
  md: 'failure time of the equipment is predicted from the early warning signs. Predictive
    maintenance is one of the features of Prognostics and Health Management (PHM).
    ML and DL algorithms used to predict the health state of any equipment by quantitatively
    monitoring its critical health parameters like dissipated heat/ temperature, process
    efficiency, auditory signals, pressure, vibration, flow rate of any liquid, and
    humidity (Shankar Sankararaman, 2015). Any deviation from the normal operational
    profile of the equipment under study will be considered as an anomaly. This is
    an early symptom of fault or equipment failure. Literature suggests many instances
    of deploying CPS in maintenance systems. Some of the notable works are discussed
    here.


    Maxim Shcherbakov proposed a concept based CPS model for proactive maintenance
    that optimizes the downtime of the equipment (Scherbakov, 2020) . Two approaches
    are proposed in this work. The first work focuses on predicting the failure before
    its onset while the latter aids in automating the decision making process. This
    acts as an excellent platform for building a CPS system for predictive maintenance.
    Integration of multiple computing technologies like BDA, IoT and cloud computing
    for developing a CPS for predictive maintenance is proposed by Fang-Ning Yang
    (Yang, 2019). The critical variables from the mechanical big data are processed
    by offline association rules to implement predictive maintenance. The salient
    feature of this work is that it considers interrelation between various factors
    that causes faults and equipment failures in industries.


    Intense research has been done in positioning the COS in its right place in the
    industrial maintenance. A holistic and well-structured process with various stages
    in development of CPS in the perspective of the organization (Sascha Julian Oks,
    2018). This framework will greatly help the small and medium scale industries
    to adapt to setting a CPS. An integrated work that intertwines the modelling and
    simulation of the physical systems into CPS is proposed under the notion cyber
    physical modelling and simulation (Sascha Julian Oks, 2019). The reference architecture
    in the proposed work delineates guidelines and structure for the industrial activities
    that could mimic the CPS. This system provides a greater degree of scalability,
    robustness and modularity. This work can be extended to any specific industrial
    case study, which is a real success for the proposed work.


    A tight coupling of CPS with the maintenance principles is described by Santiago
    Ruiz-Arenas (Santiago Ruiz-Arenas, 2014). This work details that some of the features
    of CPS cannot be connected with the physical world and some will be partially
    connected. Some features will be strongly connected with CPS. These principles
    are implemented with practical examples that provide more detailed insights to
    develop a complete maintenance advisory system. A complete deployable framework
    is proposed by Olivier that explores CPS for enabling intelligent decision making
    (Olivier Sénéchal, 2019). The key constituents are Sustainable Condition based
    maintenance that guides in the evaluation of Remaining sustainable life or'
