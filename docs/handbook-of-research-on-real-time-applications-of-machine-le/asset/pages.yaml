- pgno: 12
  md: '# Chapter 4

    Differential Privacy Techniques-Based Information Security for Cyber Physical
    System Applications: An Overview ....................52


    +   A. Kanagaraj, Nallamuthu Gounder Mahalingam College, India

    +   S. Sharmila, Nallamuthu Gounder Mahalingam College, India

    +   A. Finny Belwin, Angappa College of Arts and Science, India

    +   A. Linda Sherin, A. M. Jain College, India

    +   Antony Selvadoss Thanamani, Nallamuthu Gounder Mahalingam College, India


    A cyber physical system (CPS) is a mechanism that monitors and controls entire
    devices which are connected together. Secured data transmission in CPS systems
    is a major problem. To provide information security for CPS applications, certain
    privacy preservation strategies need to be followed. Encryption and anonymization
    are existing traditional privacy preservation techniques which are not suitable
    to provide information security for advanced systems called CPS. Differential
    techniques is an emerging privacy technique where a required amount of noise is
    added using various mathematical algorithms with data while sharing information
    between devices in CPSs. The process of adding noise with data is called data
    perturbation. There are three major data perturbations mechanisms followed to
    provide information security. They are exponential mechanism, Laplace mechanism,
    and Gaussian mechanism. This chapter presents a detailed review about applications
    of CPSs, significance of implementing differential privacy techniques, challenges,
    and future research directions of CPSs.


    # Chapter 5

    Machine Learning in Cyber Physical Systems for Healthcare: Brain Tumor Classification
    From MRI Using Transfer Learning Framework ....................65


    +   Jayaraj Ramasamy, Azteca University, Mexico

    +   Ruchi Doshi, Azteca University, Mexico


    Brain tumors are prevalent and aggressive disease, with a relatively short life
    expectancy in their most severe form. Thus, treatment planning is an important
    element in improving patient quality of life. In general, image techniques such
    as computed tomography (CT), magnetic resonance imaging (MRI), and ultrasound
    imaging are used to examine tumors in the brain, lung, liver, and breast. MRI
    scans are used in this study to diagnose brain tumors. As a result, a reliable
    and automated classification technique is required to prevent death. Automatic
    brain tumor detection using convolutional neural networks (CNN) classification
    is proposed in this chapter. Small kernels are used to conduct the deeper architectural
    design. In machine learning, brain tumor classification is done by using a binary
    classifier to detect brain tumors from MRI scan images. In this chapter, transfer
    learning is used to build the classifier, achieving a good accuracy and visualizing
    the model''s overall performance.'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# Chapter 6

    Application of Odd-Even Congruence Graph Labeling in Secured Cyber Physical Systems................77

    Kanakambika K., Vellalar College for Women, India

    Thamizhendhi G., Sri Vasavi College, India


    Technological advancement in the recent decades enhanced the calibre of human
    life. Contemporary research in machine learning (ML) exhibits a mock-up to make
    decisions on its own and is applied in various fields including medical diagnosis,
    email filtering, banking, computer vision, financial marketing, image processing,
    cyber security. The systems inter-connected across the world via internet are
    attacked by hackers, and it is prevented by cyber security. The optimum solution
    for cyber-attacks is attained by collaborating ML techniques with cyber security
    and envisioned issues are designed by cyber machine learning models. In this chapter,
    an algorithm is proposed to defend data by encoding the text to an unintelligent
    text and decoding it to original text by applying graph labelling in cryptography.
    Symmetric key is designed based on the edge label of an odd-even congruence graph
    to achieve secured communication in CPS. In addition, a program is suggested using
    Python programming to attain cipher text and its converse.


    # Chapter 7

    Machine Learning for Intrusion Detection Systems: Recent Developments and Future
    Challenges................93

    Quang-Vinh Dang, Industrial University of Ho Chi Minh City, Vietnam


    The growth of the internet and network-based services bring to us a lot of new
    opportunities but also pose many new security threats. The intrusion detection
    system (IDS) has been studied and developed over the years to cope with external
    attacks from the internet. The task of an IDS is to classify and stop the malicious
    traffic from outside to enter the computer system. In recent years, machine learning-based
    IDS has attracted a lot of attention from the industry and academia. The IDS based
    on state-of-the-art machine learning algorithms usually achieves a very high predictive
    performance than traditional approaches. On the other hand, several open datasets
    have been introduced for the researchers to evaluate and compare their algorithms.
    This chapter reviews the classification techniques used in IDS, mostly the machine
    learning algorithms and the published datasets. The authors discuss the achievements
    and some open problems and suggest a few research directions in the future.'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# # Chapter 8

    Estimating the Efficiency of Machine Learning Algorithms in Predicting Seizure
    With Convolutional Neural Network Architecture: Classification of Machine Learning
    Algorithms....................119

    *Jamunadevi C., Kongu Engineering College, Perundurai, India*

    *Arul P., Government Arts College (Trichy), Bharathidasan University, India*


    The reason trends in prevalent detection of EEG seizure help in analyzing the
    various features of EEG signals to customize and to remove visual inspection in
    reading the EEG signals. Epilepsy is a disorder and is identified by baseless
    seizures that have been associated with unexpected improper neural discharges
    which result in various health issues and also result in death. One of the most
    common methods in detecting contraction seizures is an electroencephalogram. By
    using machine learning methods, it is easy to extract the features of EEG signals
    that help in detecting seizures. Convolutional neural network (CNN) includes both
    inputs as well as output layers that help in training the data acquired since
    it helps in analyzing the large set of high dimensional data. The performance
    analysis is done under multiple classifiers such as random forest, gradient boosting,
    and decision tree, which are used in feature extraction. Among them, random forest
    proves to be the best classifier in achieving a high degree of accuracy.


    # # Chapter 9

    Crop Protection Using Cyber Physical Systems and Machine Learning for Smart Agriculture
    ....................134

    *Manish Choubisa, Poornima College of Engineering, Jaipur, India*

    *Ruchi Doshi, Azteca University, Mexico*


    Currently the world is experiencing the global digital transformation of the fourth
    generation revolution for industry in the field of cyber physical systems (CPS)
    and artificial intelligence. Moreover, by utilizing artificial intelligence, cyber
    physical systems will be able to perform more proficiently, collaboratively, and
    spiritedly. Agriculture crop control is a process to protect the crop as much
    as possible so the crop is not infected by the different kinds of pests. Pests
    are any living organisms including insects, animals, the weeds, pathogens, and
    other creatures that can harm the agriculture crop. Pests and other diseases cause
    an average of 20-30% global potential loss of crop production in every year. So,
    crop protection is required to reduce these losses. This chapter explores CPS
    concept to improve crop production to protect the crop from wild animals using
    machine learning and cyber physical systems. The smart agriculture process under
    CPS includes crop suggestion, irrigation and fertilization automation, crop protection,
    plant monitoring, and harvesting.'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# Chapter 10


    # Arrhythmia Classification Using Deep Learning Architecture........................148


    Kuldeep Singh Chouhan, Engineering College Ajmer, India

    Jyoti Gajrani, Engineering College Ajmer, India

    Bhavna Sharma, JECRC University, Jaipur, India

    Satya Narayan Tazi, Engineering College Ajmer, India


    As cardiovascular diseases (CVDs) are a serious concern to modern medical science
    to diagnose at an early stage, it is vital to build a classification model that
    can effectively reduce mortality rates by treating millions of people in a timely
    manner. An electrocardiogram (ECG) is a specialized instrument that measures the
    heart’s physiological responses. To accurately diagnose a patient’s acute and
    chronic heart problems, an in-depth examination of these ECG signals is essential.
    The proposed model consists of a convolutional neural network having three convolutional,
    two pooling, and two dense layers. The proposed model is trained and evaluated
    on the MIT-BIH arrhythmia and PTB diagnostic datasets. The classification accuracy
    is 99.16%, which is higher than state-of-the-art studies on similar arrhythmias.
    Recall, precision, and F1 score of the proposed model are 96.53%, 95.15%, and
    99.17%, respectively. The proposed model can aid doctors explicitly for the detection
    and classification of arrhythmias.


    # Chapter 11


    # Comparing Machine Learning Algorithms and DNN for Anomaly Detection .173


    Apinaya Prethi K. N., Department of CSE, Coimbatore Institute of

    Technology, India

    Sangeetha M., Coimbatore Institute of Technology, India

    Nithya S., Coimbatore Institute of Technology, India


    Cyber space became inevitable in today’s world. It needs a security technology
    to safeguard the whole system from outsiders. An intrusion detection system acts
    as a strong barrier and screens the vulnerability. There is an upgraded amount
    of network attacks such as DoS (denial of service), R2L (remote to local) attack,
    U2R (user to root), and probe attack. These network attacks lead to prohibited
    usage of data from various applications like medical, bank, car maintenance, and
    achieve activities. This will result in financial gain and prevent authorized
    persons from accessing the network. Intrusion detection systems were implemented
    in systems where security is desirable. The conventional system makes use of machine
    learning techniques such as random forest and decision trees that entail many
    computational resources and higher time complexity. To overcome this, a DNN-based
    intrusion detection system is proposed. This IDS not only detects the abnormalities
    but also results in higher accuracy compared to existing systems. This also improves
    the speed, accuracy, and stability of the system.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# Chapter 12

    Vascular Disease Prediction Using Retinal Image Acquisition Algorithm .....185

    Deepa S., Kongu Engineering College, India

    Suguna R., Bannari Amman Institute of Technology, India

    Sathishkumar P., Bannari Amman Institute of Technology, India

    Vivek D., SRM Institute of Science and Technology, India

    Arunkumar M. S., Veltech Rangarajan Dr. Sagunthala R&D Institute of Science and
    Technology, India


    The people are affected by retinal vascular disease. This research automates the
    prediction of such disease using retinal image acquisition. The condition of the
    retinal blood vessels is manifested as the mirror of the vascular disease of the
    human body. Human retinal images of the eye give extensive data on diagnostic
    changes caused by local optical sickness that reveal some of the vascular diseases
    such as diabetes, cardiovascular disease, hypertension, vascular irritation, and
    stroke. The infinite perimeter active contour with hybrid region information (IPACHI)
    model is used to segment and calculate perimeter of the blood vessels. The next
    stage is classification of affected retinal vessels by using support vector model
    (SVM) and artificial neural network (ANN) models. After classification, the arterio
    venous ratio (ANR) is computed to identify the exact type of retinal disease.
    The work is done in MATLAB software, and it proves the accuracy of 95% in prediction
    of the retinal disease.


    # Chapter 13

    Convolutional Neural Network-Based Secured Data Storage Mechanism for Big Data
    Environments ....................200

    Balamurugan Easwaran, University of Africa, Toru-Orua, Nigeria

    Sangeetha Krishnan, University of Africa, Toru-Orua, Nigeria

    Anitha P. T., Wollega University, Ethiopia

    Jackson Akpojaro, University of Africa, Toru-Orua, Nigeria

    Kirubanand V. B., CHRIST University (Deemed), India


    Data types and amounts in human society are growing at an amazing speed, which
    is caused by emerging new services such as cloud computing and internet of things
    (IoT). As data has been a fundamental resource, research on big data has attracted
    much attention. An optimized cluster storage method for big data in IoT is proposed.
    First, weights of data blocks in each historical accessing period are calculated
    by temporal locality of data access, and the access frequencies of the data block
    in next period are predicted by the weights. Second, the hot spot of a data block
    is determined with a threshold that is calculated by previous data access. In
    this work, big data is divided into multiple segments based on semantic connectivity-based
    convolutional neural networks. Each segment will be stored in the different nodes
    by adapting the.

    blockchain distributed-based local regenerative code technology called BCDLR.'
