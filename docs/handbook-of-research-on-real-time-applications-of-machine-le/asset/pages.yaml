  md: '# # Congruence Graph Labelling


    Labelling of graphs has been introduced by A. Rosa in 1966. Assignment of natural
    numbers to vertices and/or integers is referred as graph labelling. Inspired by
    the ample application of graph labelling technique in real life problems, multifarious
    labelling strategy was adopted and investigated by many researchers. Congruence
    Graph Labelling is an allocation of natural numbers as labels for the edges and
    vertices of a graph based on modular arithmetic property. Odd-even congruence
    labelling is an allocation of odd integers to vertices and even integers to edges
    in addition to congruence graph labelling. Congruence Graph labelling performs
    significant role in numerous sectors and can be implemented in multitudinous discipline
    including coding theory, X-ray, Psychology, crystallography, circuit design, communication
    networks, astronomy, radar, data security, secret sharing and data base management.
    Besides these applications, the labelling technique acts as succour to realm other
    areas of mathematics. In the recent years all the documents are digitalized and
    shared via net primarily based on virtual network and at high risk. In order to
    increase the security, Odd-even congruence labelling technique is applied to generate
    a powerful and secured key from the edge label value to encrypt and decrypt the
    content.


    # # Odd-Even Congruence Labelling


    Suppose G = (V,E) be a graph with |V| = p and |E| = q is stated as an odd-even
    congruence graph, if there exist a vertex labelling function f: V → {1,3.....2k+1}
    for every vi in V and induces edge labelling g: E → {2,4,6,....2k} such that f(v_i)
    ≡ f(v_j) mod g(e_i) for every e_i = v_i v_j, where k = min{2|VI,2|E|}.


    A graph which admits odd even congruence labelling is stated as odd even congruence
    graph.


    # # 3. APPLICATION OF ODD-EVEN CONGRUENCE GRAPH IN SECURED CYBER PHYSICAL SYSTEM


    Two major threats in CPS are data security and control security, it is essential
    to guard data during collection, storage, process and transmission. The most crucial
    one is data security which is gained by encryption. This chapter is devoted to
    establish data security by fusing cryptography and graph labelling.'
