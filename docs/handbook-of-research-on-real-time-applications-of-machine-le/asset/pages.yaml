- pgno: 230
  md: '(Pandey, A. and Wang, D., 2019). ReLUs are well-suited for deep learning techniques
    and avoid information losses by zero padding of convolution layers (Nguyen, K.,
    et al., 2017 and Biswas, A. and Chandrakasan, A.P., 2018)


    +   **Residual Separable Bottleneck:** To achieve faster processing and preserving
    receptive fields, principal building blocks of networks are based on residual
    connections, bottlenecks, and separating convolutions where parameters of corresponding
    layers of [5 x 5] convolutions with 16 kernels are reduced from 6 to 896 for designs
    (Zhang, Q., et al, 2020)


    +   **Unpooling with Shared Indexes:** These procedures in decoders share pooling
    indices of symmetrical pooling operations of encoders and thus enable networks
    to keep track of maximal activation spatial placements on encoders without transposed
    convolutions and are costly(Kim, T.Y. and Cho, S.B., 2019). As a result, unpooling
    operations produce sparse feature maps that subsequent convolutions use for learning
    and increasing densities. Pooling layers are [2 x 2] convolutions with stride
    2.


    +   **Output:** The last layer uses linear operations followed by softmax activations
    that predict pseudo probability vectors and where elements represent likelihood
    of features belonging to classes for divisions into segments.


