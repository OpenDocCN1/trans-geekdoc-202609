  md: '# 1. BACKGROUND


    The way humans think and absorb information has changed dramatically as they progressed
    from Dryopithecus to Homo Sapiens. New technologies and revolutionary ideas opened
    the path for social and economic progress. The first industrial revolution occurred
    in the eighteenth century when agrarian civilizations became more industrialized.
    Electricity, railroads and a slew of other technologies shifted society’s outlook
    dramatically. The three main drivers of the first industrial revolution were land,
    capital, and labor. Machines, metals, and richer fuels all contributed to the
    first revolution, which enabled humans to expand their output of agricultural
    products, textiles, and machinery, among other things. Water, coal, and steam
    were used as power sources during this time.


    The Second Industrial Revolution built on the first, but it was more concerned
    with minimizing human labour and increasing automation. Electricity and petroleum
    were the primary sources of energy for this revolution. In 1947, the third industrial
    revolution began as a digital revolution, with new technologies such as computers,
    mobile phones, the internet, renewable energy, and a few other forms of technology
    establishing the groundwork. When studying the history of the industrial revolution,
    it is evident that these advancements arose from the need to increase automation
    and production.


    Figure 1. Evolution of Industrial Revolution and its major power source


    ![](img/0e5ed5b85e46b41ac1e84d52eda7fb86_27_0.png)


    Since Prof. Klaus Schwab, the creator of the World Economic Forum popularized
    the term “fourth industrial revolution,” there has been a rising interest among
    scholars, academics, and business leaders in learning more about it. Humankind
    is now surrounded by technological advancements. Everything around us is undergoing
    a digital revolution, from the alarm clock to automated coolers/heaters, computerized
    kitchen appliances, and automated automobiles. These digital devices not only
    save time and effort for humans, but they also capture a massive quantity of data
    on each individual.'
