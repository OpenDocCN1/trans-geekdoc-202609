    # EXPERIMENT


    # Dataset and Tools


    Real-time soil moisture and temperature observations for 15 locations in Karnataka
    were used in this investigation. The network assesses soil moisture in the unsaturated
    zone for diverse soil textures and land coverings in the area. The five sensors
    are placed at 5 cm, 10 cm, 20 cm, 40 cm, and 80 cm depths. The time interval for
    logging is set to 15 minutes.


    # Prior Knowledge


    The researchers used the water sprinkle monitoring system as an example to create
    the machine learning model. We set a previous knowledge with numerous attributes
    connected to our dataset to forecast the precise action of the water, sprinkle
    monitoring system in real-time. Every feature is stored in our knowledge base
    as an attribute. We use four variables to calculate the likelihood of rain: air
    temperature, wind speed, air pressure, and air humidity. The rainfall attributes
    will then be determined as a class attribute. The four qualities are light rain,
    moderate rain, heavy rain, and no rain. After discovering all the classes, we
    use rainfall likelihood as an input characteristic'
