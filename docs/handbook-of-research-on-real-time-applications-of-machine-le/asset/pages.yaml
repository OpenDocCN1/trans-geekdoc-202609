    # METRICS


    In this section, we discuss the popular metrics used to evaluate intrusion detection
    algorithms.


    The first set of popular metrics is based on the confusion matrix as shown below.'
  merge: -1
  img_proc: true
- pgno: 126
  md: '# Table 5. Confusion matrix


    | | | Prediction |

    |---|---|---|

    | | | Positive | Negative |

    | True Labels | Positive | TP | FN |

    | | Negative | FP | TN |


    The accuracy is calculated as the number of correct predictions divided by the
    total number of predictions.


    ```

    accuracy = \frac{TP + TN}{TP + FP + FN + TN}

    ```


    The precision metric is calculated as the number of true positive predictions
    divided by the total number of positive predictions.


    ```

    precision = \frac{TP}{TP + FP}

    ```


    The recall metric is calculated as the number of true positive predictions divided
    by the total number is calculated positives. The recall is also known as the true
    positive rate (TPR).


    ```

    recall = \frac{TP}{TP + FN}

    ```


    The false-positive rate (FPR) is calculated as:


    ```

    FPR = \frac{FP}{FP + TN}

    ```


    If the accuracy is high, it means that we can correctly predict what traffic is
    malicious and what is benign. If the precision is high, it means that if we predict
    traffic is malicious, it is likely that the prediction is correct. If the recall
    is high, it means that we are unlikely to miss malicious traffic. However, we
    often need to trade-off between the precision and recall metric: when we try to
    improve one metric, another metric will be decreased.'
  merge: -1
  img_proc: true
- pgno: 127
  md: 'Furthermore, to calculate the accuracy, precision, and recall, we need to define
    the decision threshold. It will limit the flexibility of our model to adapt to
    the different scenarios. Furthermore, the accuracy is claimed to be biased in
    the case of an imbalanced dataset: if there is 95% of the traffic is benign, a
    naïve predictor just needs to predict everything as benign and will achieve an
    accuracy of 95%. To overcome the limitation of the hard decision threshold metric,
    the ROC AUC score is introduced (Fawcett, 2006).


    # Figure 5. The ROC AUC


    ![](img/0e5ed5b85e46b41ac1e84d52eda7fb86_127_0.png)


    The ROC AUC score is visualized in Figure 4. We draw a line of FPR (False Positive
    Rate) and TPR (False Negative Rate). When we change the decision threshold, both
    FPR and TPR will change and they will a curve as we see in Figure 4. The area
    under the curve (AUC) is considered as the ROC AUC score. For instance, in Figure
    4 we can see two ROC of two algorithms A and B, and algorithm A is considered
    better than algorithm B. From the chart, we can know that, if we accept the FPR
    of 20% with algorithm A, we can achieve the TPR of around 90%. However, if we
    accept the FPR of 10% only, the TPR is only about 70%. Hence, the ROC AUC score
    and ROC line will tell us not only the overall performance but also the detailed
    performance at each decision threshold.'
  merge: -1
  img_proc: true
- pgno: 128
  md: '# MACHINE LEARNING ALGORITHMS FOR IDS


    # k-NN


    The algorithm k-nearest neighbors (k-NN) is probably one of the most simple classification
    algorithms. The idea of k-NN is to classify one data point into a class based
    on its k nearest neighbors. When a new data point is introduced, we find the most
    k nearest neighbors of this data point from a labeled dataset, then based on the
    majority of the neighbors we will decide the class of the new data point.


    Figure 6. The visualization of k-NN algorithm. The value of k can be optimized
    by the hyper-parameter tuning technique.


    ![](img/0e5ed5b85e46b41ac1e84d52eda7fb86_128_0.png)


    The k-NN algorithm is studied in several early research works (Liao and Vemuri,
    2002) with some additions. The pseudo-code proposed by (Liao and Vemuri, 2002)
    is presented in Figure 5.'
  merge: -1
  img_proc: true
- pgno: 129
  md: '# Figure 7. The pseudo-code of kNN for the intrusion detection

    (Liao and Vemuri, 2002)


    ```

    build the training normal data set D;

    for each process X in the test data do

    if X has an unknown system call then

    X is abnormal;

    else then

    for each process Dj in training data do

    calculate sim(X, Dj);

    if sim(X, Dj) equals 1.0 then

    X is normal; exit;

    find k biggest scores of sim(X, D);

    calculate sim_avg for k-nearest neighbors;

    if sim_avg is greater than threshold then

    X is normal;

    else then

    X is abnormal;

    ```


    An issue of the k-NN is the slow processing speed because, for every new data
    point that needed to be classified, we need to calculate the distance from this
    data point to every data point in the training set. Hence, the processing time
    will be correlated with the training data size. (Rao and Swathi, 2017) proposed
    to use two improved versions of k-NN which are Indexed Partial Distance Search
    k-Nearest Neighbor (IKPDS), Partial Distance Search k-Nearest Neighbor (KPDS)
    to speed up the algorithm.


    # Clustering Algorithms


    Clustering algorithms are unsupervised machine learning algorithms that try to
    group similar items into one group. The clustering algorithms can be divided into
    two categories: hard-clustering like k-means or fuzzy (Wang et al., 2010) clustering
    like FCC (Wang and Megalooikonomou, 2005).'
  merge: -1
  img_proc: true
- pgno: 130
  md: "# Figure 8. Hard and soft clustering\n\n![](img/0e5ed5b85e46b41ac1e84d52eda7fb86_130_0.png)\n\
    \nThe hard and soft clustering algorithms are visualized in Figure 6. In the hard\
    \ clustering algorithm, one data point belongs to a single cluster. On the other\
    \ hand, the soft clustering algorithms allow a data point that belongs to multiple\
    \ clusters with a weight or belongingness.\n\n# Figure 9. The pseudo-code of k-means\n\
    \n```\n1. Initialize cluster centroids \\(\\mu_1, \\mu_2, \\dots, \\mu_k \\in\
    \ \\mathbb{R}^n\\) randomly.\n\n2. Repeat until convergence: {\n\n    For every\
    \ \\(i\\), set\n    \n    \\(c^{(i)} := \\arg\\min_j \\|x^{(i)} - \\mu_j\\|^2.\\\
    )\n\n    For each \\(j\\), set\n    \n    \\(\\mu_j := \\frac{\\sum_{i=1}^m 1\\\
    {c^{(i)} = j\\}x^{(i)}}{\\sum_{i=1}^m 1\\{c^{(i)} = j\\}}.\\)\n\n}\n```\n\nThe\
    \ pseudo-code of the k-means algorithm is displayed in Figure 7. We would like\
    \ to cluster the data into k-clusters. To do that, we first initialize randomly\
    \ k centroids, then iteratively assign each data points to the closet centroids,\
    \ then we recompute the centroids as the center points of all the points of a\
    \ cluster. The algorithm stops when it reaches convergence."
  merge: -1
