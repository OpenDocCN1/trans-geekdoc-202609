    the metrics used to judge chatbots (Radziwill, & Benton, 2017). Healthcare systems
    can utilize the chatbots tuned according to these parameters for interactively
    gathering the patient’s data.


    Finally, the Healthcare systems can incorporate clustering techniques for grouping
