  md: '# # LITERATURE SURVEY


    Various researchers have proposed a methodology in combining the handcrafted features
    using Support Vector Machine (SVM) classifier (C. Cortes, 2015) or Neural Networks
    (Y.-H. Shih, 2012) (NN) in building a multi-stage seizure detection system. Numerous
    highlights have been recognized within the time space that experiences the stage
    (B. Erem, 2015), statistical measures (Q. Lin, 2016) and entropy (H. R. Mohseni,
    2016). Wavelet transform (V. Srinivasan, 2014) and Fourier transform (P. E. McSharry,
    2003) could be consider for feature extraction purpose. There may be some growing
    trends in stating the time frequency descriptors mainly concerning the image in
    detecting seizure from EEG signals along with this precision and recall can be
    added for accuracy (A. S, engur, 2016). EEG system consists of multi electrode
    channels along with the growing features with increasing number of channels (N.
    D. Truong, 2017). To remove this dimensionality problem, a lot number of feature
    selection mechanisms have been identified in eradicating the irrelevant and redundant
    features before the classifier has been trained, so that effective prediction
    of epilepsy will be predicted. Enormous methods have been keep on exploiting the
    ideology that has been imposed on the detection of multi-channel EEG seizure detection
    that includes PCA (Principal Component Analysis) (U. R. Acharya, 2012), ICA (Individual
    Component Analysis) (Y.H. Shih, 2012) and Laplacian Eigen maps (B. Erem, 2015).
    Also, many stacked auto-encoders have been proved to be better methodology in
    feature extraction than handcrafted extraction (Q. Lin, 2016). The above literature
    review identifies the limitations that''s are


    +   - The existing classifiers found multiple local minimum rather than finding
    a distinct global minimum.

    +   - Requires more training time.

    +   - Keeps the number of features extracted EEG signals to be small.

    +   - Requires concentrated computing and may not be supported for real time seizure
    detecting system.

    +   - Very less in accuracy

    +   - Number of parameters taken to estimate the efficiency is very less in number.

    +   - Predicting of inter ictal stage in epileptic seizure is quite complicated.


