  md: '# ## DATASETS


    In this section, we review some of the most popular published intrusion datasets.
    These datasets can be used by researchers to train and test intrusion detection
    algorithms.


    # ## DARPA


    The dataset DARPA 98/99 (McHugh, 2000) is one of the first intrusion datasets
    that has been introduced (Ring et al., 2019). The dataset carries two parts: one
    is for offline evaluation and one is for online evaluation. The dataset is created
    using an emulated network system. Version 1998 contains seven weeks of data while
    version 1999 contains the five weeks of data. The data is criticized as containing
    too much redundancy (McHugh, 2000).


    # ## KDD''99


    The KDD''99 dataset (Stolfo et al., 2000) is probably the most popular intrusion
    dataset used in the literature to date. The KDD''99 and its extended version NSL-KDD
    have been used extensively in the research. The data includes four types of attacks
    (Table 1).


    Table 1. Attack types in NSL-KDD dataset


    | Attack Type | Description |

    |---|---|

    | DOS | denial-of-service, e.g. syn flood |

    | R2L | unauthorized access from a remote machine, e.g. guessing password; |

    | U2R | unauthorized access to local superuser (root) privileges, e.g., various
    `~buffer overflow~` attacks; |

    | Probing | surveillance and another probing, e.g., port scanning. |


    While the KDD''99 is somehow an out-of-date dataset today (Dang, 2019), the importance
    of the dataset for cybersecurity research is undeniable. Furthermore, the'
  merge: -1
  img_proc: true
- pgno: 122
  md: 'features designed by the KDD''99 dataset are the fundamentals for many intrusion

    datasets later on, including the recent CICIDS and InSDN datasets.


