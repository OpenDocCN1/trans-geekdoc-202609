    # ABSTRACT


    The reason trends in prevalent detection of EEG seizure help in analyzing the
    various features of EEG signals to customize and to remove visual inspection in
    reading the EEG signals. Epilepsy is a disorder and is identified by baseless
    seizures that have been associated with unexpected improper neural discharges
    which result in various health issues and also result in death. One of the most
    common methods in detecting contraction seizures is an electroencephalogram. By
    using machine learning methods, it is easy to extract the features of EEG signals
    that help in detecting seizures. Convolutional neural network (CNN) includes both
    inputs as well as output layers that help in training the data acquired since
    it helps in analyzing'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'the large set of high dimensional data. The performance analysis is done under
    multiple classifiers such as random forest, gradient boosting, and decision tree,
    which are used in feature extraction. Among them, random forest proves to be the
    best classifier in achieving a high degree of accuracy.


    # INTRODUCTION


    Epilepsy is neural disorder that occurs in the brain which is characterized by
    the baseless seizures. More than 50 million people around the world are severely
    affected by this neurological disorder. These patients suffer from neurobiological
    disorders including the social and psychological impairments. If it is identified
    in earlier stage it could save the patient’s life. EEG signals include two kinds
    of activities stated, interictal and ictal. The time gap between the EEG seizures
    is termed as interictal. The time gap between the EEG seizure offset and onset
    is termed as ictal. But, most of the common studies in seizure detection states
    to use the scalp EEG because it is easily obtained from non-invasive methods (T.
    N. Alotaiby, 2014). The visual review of EEG reading is really a time consuming
    process and also results in trained physicians in identifying the characteristic
    features of EEG seizures from the multi-channels (L. J. Greenfield, 2012). The
    hand-crafted features in detecting the EEG signals fall into two broad classifications:
    they include temporal and spectral features (M. Ahmad, 2016). Recently, many deep
    learning techniques has given a best results in signal processing due to increasing
    level in accuracy (Y. Bengio, 2013).The features extracted using Convolution Neural
    Network (CNN) proved to be the best in detection evaluation where the layers in
    CNN which support for accurate classification and prediction (Z. Mei, 2018). Despite,
    the results which are stated by the existing deep learning techniques in seizure
    detection, there are a few numerous challenges required to be spotted. One among
    them is presence of irrelevant channels and multiple information due to the extraction
    of features from multi-channels (A. Temko, 2012), (E. Keogh, 2011).To handle these
    challenges in the existing methodology (Y. Yuan, 2017), deep learning model is
    designed to concern the abnormalities in the brain that has been associated with
    EEG seizures. The demonstration of this proposed model is evaluated under various
    classification methods in governing the performance of the models. Electroencephalography
    (EEG) plays major parts in observing the brain movement of patients with epilepsy
    and makes a difference to analyze epilepsy.'
  merge: -1
  img_proc: true
