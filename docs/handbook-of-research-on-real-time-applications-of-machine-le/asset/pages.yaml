  md: '# RELATED WORKS


    (Nerurkar et al., 2018) studied the technologies based on cyber-physical systems
    (CPS) created to monitor terrain parameters and make them available on a platform
    that multiple users can access. (Priyadarshini et al., 2021) studied that CPS
    can monitor entire agricultural areas and thanks to cellular telephony gateways
    and information monitoring systems that can display data on a web application.
    Other options include-Applying and implementing the new and helpful concept of
    Cyber-Physical Systems (CPSs) in the agriculture industry, which consists of a
    Zigbee-based network with nodes that function below the ground surface.


    (Raza et al., 2018) assessed the mobile devices used in some of the most recent
    projects, which are advanced, comprehensive systems that monitor environmental
    factors and employ a closed-cycle control system in which actuators are controlled
    based on sensor data (Hiran, K. K., 2021) . While it is only a theoretical solution,
    it still lacks a functional human-machine interaction sub-system. Several studies
    (Dadhich, Purohit, et al., 2021; Dinesh Setha, Minah Ahemad A.Rehman, 2018; Shen
    et al., 2020) developed Drone-based solutions to obtain picture data at various
    wavelengths to provide a continual overview of the terrain''s physical and chemical
    state. Different types of camera-equipped drones are already on the market (for
    example, from Precision Hawk, senseFly, and Agribotix) that take medium-high resolution
    photographs (up to 20 MP) in various electromagnetic spectrums regions, usually
    in the visible and Near Infrared (NIR) fields (M. Dadhich, M. S. Pahwa, 2021;
    Restrepo et al., 2021). Different types of camera-equipped drones are already
    on the market that take medium-high resolution photographs (up to 20 MP) in various
    electromagnetic spectrums regions, usually in the visible. The Spanish startup
    Agroptima is working on another unique system (Kumar Naresh, Dadhich Manish, 2014).
    This system does not use hardware such as sensors or actuators. Still, it does
    provide a stunning graphic interface for field cataloguing and management, as
    well as irrigation and fertilization planning. (R. Sharma et al., 2020) studied
    agrodron used for parasite control and made it ideal for spraying activities on
    crops.


    # PROPOSED FRAMEWORK


    Data preprocessing, forecasting, and classifying are the three primary processes
    in machine learning-based architecture (Manish Dadhich, Manvinder Singh Pahwa,
    Vipin Jain, 2021; Shubham Tripathi and Manish Gupta, 2021). The data will then
    be measured using a forecasting algorithm to avoid data shortages or inaccurate
    data collection for the following sensing cycle. The data classifier uses a Nave
    Bayes classifier to predict a real-time event using a discretized fusion of forecasted
    data'
