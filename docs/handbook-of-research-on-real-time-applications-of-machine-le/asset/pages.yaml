    # ## ABSTRACT


    The people are affected by retinal vascular disease. This research automates the
    prediction of such disease using retinal image acquisition. The condition of the
    retinal blood vessels is manifested as the mirror of the vascular disease of the
    human body. Human retinal images of the eye give extensive data on diagnostic
    changes caused by local optical sickness that reveal some of the vascular diseases
    such as diabetes, cardiovascular disease, hypertension, vascular irritation, and
    stroke. The infinite perimeter active contour with hybrid region information (IPACHI)
    model is used to segment and calculate perimeter of the blood vessels. The next
    stage is classification of affected retinal vessels by using support vector model
    (SVM) and artificial neural network (ANN) models. After classification, the arterio
    venous ratio (ANR) is computed to identify the exact type of retinal disease.
    The work is done in MATLAB software, and it proves the accuracy of 95% in prediction
    of the retinal disease.


