  md: 'The following algorithm is exploited for encryption and decryption.


    # Encryption Algorithm


    +   - **Step 1:** Consider any graph G.

    +   - **Step 2:** Label the vertices and edges of G using the definition stated
    in 2.5

    +   - **Step 3:** The edge weights of G is assigned to alphabets and they are
    interchanged, for example the first edge in G has 12 as its edge weight then it
    will be assigned to A, then A is replaced by the 12th alphabet L. Since each edge
    are labeled distinctly, all the alphabets will be interchanged distinctly.

    +   - **Step 4:** Special characters also encrypted by extending the edges in
    G.


    # Decryption Algorithm


    +   - **Step 1:** The graph used in encryption is identified.

    +   - **Step 2:** Using the edge labelling function, edge weights are reckoned
    and employed to swap the alphabets.

    +   - **Step 3:** Cipher text is interpreted to acquire the earliest text.


    # Illustration


    Consider a graph G, let it be a Comb graph with 28 vertices and 27 edges and it
    is labeled using odd-even congruence labelling technique. Its edge weights are
    utilized to allocate dissimilar order for the alphabets to generate cypher text.


    # Encryption


    +   - **Step 1:** Consider a comb graph G(V, E) = P_n OK_1, n = 14.

    +   - **Step 2:** Assess the edge weight of G using odd-even congruence labelling
    function


    ```

    g(e_i) = 4(n-i), i = 1 to n-1

    g(s_j) = 4(n-i) + 2, j = 1 to n

    ```


    where e_i (i = 1, 2, ....,13) are the edges of P_n and s_i (j = 1, 2, .....,14)
    are edges adjacent to P_n and K_1, it is given in figure - 2.'
