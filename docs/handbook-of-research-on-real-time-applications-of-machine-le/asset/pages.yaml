- pgno: 51
  md: '# In Virtual Reality


    In the context of virtual reality which is technically called Claytronics also
    an important name in applications of the Cyber-Physical System. IT combines nano
    scale robots and computer theory is able in making nanometer-scale systems called
    claytronic atoms/catoms and such offers 3D structure. With claytronic 3 dimensions
    is easy to create and develop. Here two type of algorithms are being used. Here
    Cyber-Physical System specially the localization algorithm enables the positioning
    of catoms in the ensemble.


    # In Smarter and Enhanced Learning Systems


    Cyber-Physical System is important in applications of Advanced and smarter educational
    Systems and that can be used in gathering data on physical systems and environments,
    converting measured data, online educational systems, advanced and prompt services
    for the students, staffs and educational institutions. Cyber-Physical System is
    helpful in building and developing smart learning environmental systems (SLE).


    # MOBILE CYBER PHYSICAL SYSTEMS: OVERVIEW


    Mobile Cyber-Physical System is a part of Cyber-Physical System where physical
    system play an important role in which further mobility considered as valuable.
    Mobile robotics, electronics transported systems are considered as mobile physical
    systems. The growing mobile uses lead the rise of Cyber-Physical Systems and better
    to say various Smartphone and allied platforms helps in making of ideal mobile
    cyber-physical systems for different causes viz.


    +   • Important and Significant computational resources including local storage.

    +   • Various sensor devices which include touch screens, cameras, GPS, speakers,
    various microphones.

    +   • Various communication platforms like WiFi,G, Bluetooth run by the internet
    and similar devices.

    +   • Different kind of apps/ applications/ software distribution mechanism like
    App Store of the Apple or Google.


    Network connectivity which links with the mobile systems including server or cloud
    connectivity is responsible for the enhancing Mobile Cyber Physical Systems (Krämer,
    B. J., 2014; Törngren, M. et.al, 2017).'
