  md: '# Preface


    Cyber-Physical Systems (CPS) are the intelligent system that combines hardware
    and software in today’s digital age. They are connected through a network as the
    physical world merges with the virtual world into cyberspace. Applications of
    CPS are penetrating every domain and reaching their limits. CPS can change and
    improve lives and address many critical challenges.


    One of the most exciting tools entered in recent years is Machine and deep learning.
    There are several real-time applications of the machine and deep learning in healthcare,
    manufacturing, marketing, finance, and particularly for making predictions; machine
    and deep learning algorithms are used in many places in exciting ways. This collection
    of statistical methods and the availability of large datasets combined with the
    improvement in algorithms has already proved to be capable of considerably speeding
    up both fundamental and applied research and led to an unprecedented surge of
    interest in the topic of machine learning. Machine Learning paradigms are defined
    in two types, namely supervised learning (SL) and unsupervised learning (UL).
    In Supervised Learning, objects in each collection are classified using a set
    of attributes or features. The classification process is a set of rules that prescribe
    assignments or allocations of things to unique classes based on values of elements.
    Supervised learning aims to design a reliable system that can precisely predict
    the class group membership of new objects based on the available attributes or
    features. Whereas in unsupervised learning (UL), all the data are unlabeled, and
    the learning process consists of defining the labels and associating objects with
    them. Deep learning paradigms are defined in different ways of apprehension. Deep
    learning is an advanced technique for classifying data patterns with higher-order
    multiple layers neural networks.


    This book aims to introduce a relevant theoretical framework and the most recent
    empirical findings on the various real-time applications of machine learning in
    cyber-physical systems. In particular, the book investigates the use of Machine
    Learning techniques and Artificial Intelligence to model different technical solutions
    on real-time CPS.'
  merge: -1
  img_proc: true
