  md: '# Chapter 9


    # Crop Protection Using Cyber Physical Systems and Machine Learning for Smart
    Agriculture


    Manish Choubisa

    Poornima College of Engineering, Jaipur, India


    Ruchi Doshi

    Azteca University, Mexico


    # ABSTRACT


    Currently the world is experiencing the global digital transformation of the fourth
    generation revolution for industry in the field of cyber physical systems (CPS)
    and artificial intelligence. Moreover, by utilizing artificial intelligence, cyber
    physical systems will be able to perform more proficiently, collaboratively, and
    spiritedly. Agriculture crop control is a process to protect the crop as much
    as possible so the crop is not infected by the different kinds of pests. Pests
    are any living organisms including insects, animals, weeds, pathogens, and other
    creatures that can harm the agriculture crop. Pests and other diseases cause an
    average of 20-30% global potential loss of crop production in every year. So,
    crop protection is required to reduce these losses. This chapter explores CPS
    concept to improve crop production to protect the crop from wild animals using
    machine learning and cyber physical systems. The smart agriculture process under
    CPS includes crop suggestion, irrigation and fertilization automation, crop protection,
    plant monitoring, and harvesting.'
  merge: -1
  img_proc: true
- pgno: 160
  md: '# INTRODUCTION


    In this digital era, embedding the biotechnology, informational technology and
    physical space has directed to the 4th revolution in industry i.e. industry 4.0.
    These revolution in industry has change the life style of human being. The main
    feature of revolution is transition from semi-adapted fabrication to mass, fully-adapted
    manufacturing. The emerging technologies for such revolution are embedded system,
    Internet of Things (IoT), Artificial Intelligence and Machine Learning and many
    cloud services with next generation internet technology. In basic level of the
    production line, actuators, sensors devices armed with wired or wireless communication
    networks are combined and convert the designing of embedded system in to CPS.
    The major processing units used to monitor and control the CPS in physical space.


    The crop protection method are presented in terms of (i) brief introduction new
    resolution in industry 4.0 and cyber physical system (ii) Smart Agriculture process
    (iii) prototype designing for crop protection using Machine learning and (iv)
    pest identification using different sensor techniques.


    This chapter explore the brief introduction to new resolution in industry 4.0
    and application of cyber physical systems in technology. In order to introduces
    Cyber Physical system applications in Smart Agriculture, definitions and characteristics
    of Cyber Physical System (CPS) are explained and define with model architecture
    for system. In CPS, mostly embeded system and computer network control over all
    processing environment to protect the crop production in real time. Implementing
    this type of CPS system, requires the knowledge of network, software, embeded
    system and physical process. Advance Research and applications are outlined to
    highlight the latest advancement in the field.


    Lastly the crop production will improve by applying the right amount of resources
    in the accurate period at the exact location.


    In this section the brief introduction of industry 4.0 and cyber physical system
    are presented.


    # Industry 4.0


    The term industrial revolution is define as the process of changing from handcraft
    to machine manufacturing. The new industrial revolution is called Industry 4.0.
    In industry 4.0 the automation and information exchange in manufacturing industries
    using emerging trends such as Cyber Physical System (CPS) (Gil et al., 2019),
    smart agriculture (Tyagi, Sumarga Kumar Sah, et al.2020), Internet of Things (Lakhwani,
    Kamlesh, et al., 2020), Machine Learning (Hiran, Kamal Kant, et al.2021), Cloud
    Computing, Artificial Intelligence, Block chain technology and many more.'
  merge: -1
  img_proc: true
- pgno: 161
  md: 'When we talk about the first industrial revolution, it used the steam engine
    power and mechanical installation. This was followed by the electricity for mass
    manufacturing and assembly line in second categories industrial insurrection.
    Third time industrial revolution lead by the electronic chip and information technology.
    Now the Industry 4.0 is associated with CPS.


    Industry 4.0 introduces new principles for manufacture industries including:


    +   - Virtualization of assembling methods by connecting sensor generated signal
    with virtual plant and recreation models.

    +   - Expanded interoperability between assembling through expanded availability.

    +   - Distributed and smart decision-making plan.

    +   - Real-time data collection.


    # Cyber-Physical Systems


    Cyber-Physical system integrated two word “Cyber” and “Physical”, the term cyber
    is used to describe a person or thing as part of the computer and Physical refers
    to the physical devices. So the Cyber Physical Devices combine cyber capabilities
    with physical capabilities.


    Helen Gill, first introduce the word Cyber-Physical Systems (CPS) in 2006, at
    US (National Science Foundation). The word CPS are older and related with embedded
    system design. The Designing the computerized control algorithms is more challenging
    due to their tight coupling behavior with physical system and need to work properly
    in real time system. CPS also related with latest advance technology like Industry
    4.0, IoT, Wireless Sensor Network (WSN) Automation, and the cloud computing (Hiran,
    K. K., et al., 2019). The autonomous automobile system, health monitoring system,
    smart agriculture system, robotics manufacturing etc. are the example of CPS (Feeney
    et al., 2017).'
