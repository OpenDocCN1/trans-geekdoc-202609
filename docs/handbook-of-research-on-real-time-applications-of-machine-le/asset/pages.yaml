  md: '+   1. Physical resource layer: This is the bottom layer that include all the
    physical devices used for industry like robotic arms, automatic vehicles, sensors,
    unmanned aerial vehicle (UAV) etc.


    +   2. Network layer: Network layer is worked above the physical resources layer
    and it includes all types of networking devices that used for the transfer information
    between physical resource layer and cloud application layer. These networking
    devices include the high speed internet i.e. 5G technology (Ordonez-Lucena et
    al., 2019).


    +   3. Cloud application layer: Cloud application layer used to improve its above
    layer i.e. the terminal layer using data mining and analysis technology. This
    layer also shows the cloud services domain for controlling the data base services
    (Yeboah, T.,et al., 2015).


    +   4. Terminal layer: All the advance industrial services for improving the manufacturing
    production and design are included in this layer.


