  md: 'The characteristics of a normal ECG signal are depicted in Figure 2. Where
    the P-wave and QRS-complex represent depolarization/contraction of the atrium
    and ventricles, respectively, while the T-wave represents ventricle repolarization.
    The ECG signal is derived from an electrocardiogram (ECG), a device that records
    the heart’s physiological activities for a time interval. ECG data is used to
    diagnose various cardiovascular abnormalities, such as premature atrial contractions
    (PAC), myocardial infarction (MI), atrial fibrillation (AF), premature ventricular
    contractions (PVC), congestive heart failure (CHF) and supraventricular tachycardias
    (SVT). A rapid development of portable devices such as Holter monitor (Nikolic
    et al., 1982), Apple watch etc., are developed to detect the ECG signal in recent
    years, which resulted in a big datasets for the researchers and human cardiologists
    to analyse the ECG data more accurately. As a consequence, automatically and reliably
    analysing ECG data has become a popular research topic. ECG data can also be used
    in innovative ways such as sleep staging and biometric human identification. To
    manage the large datasets, we need an efficient approach for the analysis. As
    a result, the datasets are subjected to machine and deep learning algorithms (Hiran,
    K. K.et al.2021). Figures 3 and 4 shows the basics of machine and deep learning
    approaches respectively (Xia et al., 2018). Traditional machine learning approach
    requires experts (human cardiologists) to extract characteristics from raw data
    and then generate final outputs using machine learning models or decision rules,
    whereas deep learning uses deep neural networks and extracts features automatically
    (Mahrishi, M.,et al.,2020). Here, expert features are a) Statistical features
    (heart rate variability, density histograms, sample entropy etc.), b) Frequency-domain
    features (Romero et al., 2001), c) Medical features (P, Q, R, S, and T wave parameters).


    # Figure 3. Traditional machine learning.


