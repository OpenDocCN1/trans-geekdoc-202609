    # RESULTS AND DISCUSSION


    This research concluded new approaches based on the EEG signals detecting the
    epileptic seizure. Electrical activity is a brain EEG, this paper is used to analyze
    brain detects seizure problems. The spatial representing of electrodes the wavelet
    signals of EEG data utilize for analyzing seizure.The trained model is analyzed
    under various performance metrics. The measures chosen in evaluating the model
    are accuracy, average precision, support, recall, confusion metrics and F1 score.
    The random forest chooses features randomly during the training process. Therefore,
    it does not depend highly on any specific set of features. This is a special characteristic
    of random forest over bagging trees. When comparing the trained and validated
    data values under the implied classification algorithm, Random Forest (RF) gives
    the best accuracy when compared to Decision tree and Gradient Boosting. Specificity
    determines the ratio of classified seizure activity that has been captured accurately
    to the total count of labeled data values. The parameters taken for evaluation
    are accuracy,precision, recall, F1score and specificity which support accurate
    prediction of epileptic seizure detection.


