    # 5. CONCLUSION AND FUTURE WORK


    With the evolution of technology in data collecting and retrieval, the number
    of available data in the context of big data and the Internet of Things grows
    by the minute. As a result, a new data-management architecture is required. In
    this work, first big data is divided into multiple segments based on semantic
    connectivity based convolutional neural network. Each segment will be stored in
    the different nodes by adapting the block chain distributed based local regenerative
    code technology. This work ensures the data integrity and as well as ensures the
    data recovery by adapting the regenerative code technology. Experimental results
    shows that the proposed model provides better results in terms of data access
    speed, Data utilization, Cost and Storage overhead than other state of art models.
    However, deep learning increases computational difficulties, necessitating the
    employment of another machine learning model for data segmentation in the future.


