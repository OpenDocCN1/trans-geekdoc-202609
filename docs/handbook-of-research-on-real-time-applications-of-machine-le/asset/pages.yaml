  md: '# ORGANIZATION OF THE BOOK


    The book is organized into 15 chapters contributed by researchers, scholars, and
    professors from prestigious laboratories and educational institutions across the
    globe. A brief description of each of the chapters in this section is given below.


    Chapter 1, “A Survey on Automotive Cyber-Physical Systems: A Machine Learning-Based
    Approach,” briefs a survey about automotive CPS in various domains especially
    in the development of autonomous cars with different sensors. Further, briefs
    about the role of machine learning models in the construction of CPS.


    Chapter 2, “Cyber Physical Systems Emergence With Reference to Manpower Development:
    An International Scenario With Indian Potentialities,” describes CPS and its role
    in building human capacity through different levels of the degree program from
    graduate to research. A comparison of the Indian system with international scenario.


    Chapter 3, “Machine Learning in Cyber Physical Systems for Agriculture: Crop Yield
    Prediction Using Cyber Physical System and Machine Learning,” describes CPS and
    its role in building human capacity through different levels of the degree program
    from graduate to research. A comparison of the Indian system with the international
    scenario.


    Chapter 4, “Differential Privacy Techniques-Based Information Security for Cyber
    Physical System Applications: A Overview,” aims to introduce various security
    and privacy issues in CPS and how differential privacy techniques enable to secure
    information. Different asymmetric and symmetric crypto models were discussed to
    secure CPS from different level of threats.


    Chapter 5, “Machine Learning in Cyber Physical Systems for Healthcare: Brain Tumor
    Classification From MRI Using Transfer Learning Framework (TLF),” presents Convolution
    Neural Network (CNN) model for classification of MRI images using TLF for the
    prediction of early stage brain tumor with improved results. Segmentation is done
    using Fuzzy c means, texture and shape feature extraction using Support Vector
    Machines and DNN.


    Chapter 6, “Application of Odd-Even Congruence Graph Labeling in Secured Cyber
    Physical System,” aims to address data and control security issues in sensors
    with cryptography using odd-even congruence graph labeling method. Proposed algorithm
    is implemented using python programming.


    Chapter 7, “Machine Learning for Intrusion Detection Systems: Recent Developments
    and Future Challenges,” presents a review on Intrusion Detection System (IDS)
    and discussed various machine learning models like K-Nearest neighborhood, Clustering,
    Logistic Regression, Support Vector Machines, Naïve base, Decision Tree and Random
    Forest for IDS.'
