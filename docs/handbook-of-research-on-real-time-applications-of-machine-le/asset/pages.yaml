    # PROPOSED SYSTEM


    This method’s main stages are data collection, pre-processing, and detection via
    neural network. In general, accurate semi-automatic and automatic detection methods
    are required. As a result of these factors, a fully automatic segmentation system
    based on CNN is used.


    # Data Collection


    We acquired our data as MRI pictures because our method is primarily focused on
    the detection of brain tumors. The dataset obtained included 159 photos with tumors
    and 99 images without tumors.


    # Pre-processing


    The primary goal is to boost image highlights, which are required for further
    processing. The input image is transformed to grayscale for the remainder of the
    preprocessing steps. The image is then thresholded, and the thresholded image
    is'
  merge: -1
  img_proc: true
- pgno: 95
  md: 'subjected to more erosion and dilation. The contours and extreme points are
    extracted from this image.


    # Convolutional Neural Network


    CNN is used to improve results. Previous layers are linked together by kernel
    weights. Back propagation calculation is used to improve the quality of an information
    image. Since feature maps of all kernel-shared units. It will aid in reducing
    overfitting. Kernels are used to collect all of the data in the neighborhood.
    Kernel is a significant source of context information. The activation function
    is applied to the neural network output.


    The human brain is represented via neural network architecture and execution.
    Vector quantization, approximation, data clustering, pattern matching, optimization
    functions, and classification algorithms are all common uses for neural networks
    (Hiran, K. K., et al, 2021). The interconnections of a neural network split it
    into three categories. There are three types of neural networks: feedback, feed
    forward, and recurrent. The Feed Forward Neural Network is separated into two
    types: single layer and multilayer. The hidden layer is not visible in a single
    layer network (Kim,2020). However, it simply has an input and output layer. The
    multilayer, on the other hand, is made up of three layers: input, hidden, and
    output (Liu,2017). The recurrent network is a closed loop based feedback network.
    Image scalability is not possible in a traditional neural network. However, with
    a convolution neural network, the picture may be scaled (that is, it can go from
    a 3D input volume to a 3D output volume) (length, width, height). The input layer,
    convolution layer, Rectified Linear Unit (ReLU) layer, pooling layer, and fully
    connected layer make up the Convolution Neural Network (CNN).


    The provided input image is divided into tiny areas in the convolution layer.
    The ReLU layer performs element-by-element activation. The use of a pooling layer
    is optional. We have the option of using or skipping(Pereira,2016). The pooling
    layer, on the other hand, is mostly utilized for down sampling. The class score
    or label score value is generated in the last layer (i.e. fully connected layer)
    based on the likelihood between 0 and 1.


    Figure 1 and Figure 2 shows a block schematic of a convolution neural network-based
    brain tumor classification system (Pellakuri,2016). The training and testing phases
    of the CNN-based brain tumor categorization are separated. The number of pictures
    is split into several categories using labels such as tumor and non-tumor brain
    imaging and so on. To create a prediction model, preprocessing, feature extraction,
    and classification using the Loss function are conducted in the training phase.
    Label the training picture set first. Image resizing is used in preprocessing
    to modify the image’s size. Finally, a convolutional neural network is utilized
    to'
