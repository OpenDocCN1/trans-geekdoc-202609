- pgno: 199
  md: '# INTRODUCTION


    Intrusion Detection system is used to protect systems from intruders. It is a
    modern security technology to prevent exploitation. In Internet, security can
    be compromised through numerous ways. More IoT network, Internet usage and data
    transfer leads to more anomaly problems. Thus researchers need to focus on self-adaptive
    intrusion detection systems without any human interaction (Jabez & Muthukumar,
    2015). IDS monitor, detect any malicious activity and policy violation in the
    network. Security systems like firewall, an anti-virus software, etc are also
    used to protect the system. When an enterprise grows larger, existing security
    measures is not enough to protect the entire system from intruder. Many times
    anti-virus software’s also gets cooperated by the invaders and leads to false
    alarm (Aung & Min, 2017). A secured network has Intrusion Management System (IMS)
    which consists of Intrusion Detection System (IDS) and Intrusion Prevention System
    (IPS). An IDS detects the malicious activity whereas IPS prevents the network
    from any malicious activity. Intrusion Detection system will monitor the regular
    activities in network and classify the normal and abnormal events. It will not
    make any changes in the event occurred. The difficult part is to identify the
    malicious event which is very similar to normal activity (Mustafa, Jae, Muhammad
    & Sugwon, 2021). Intrusion Prevention System controls the entire system and stops
    the packet proactively if it is a risky. It finds and drops the hazardous packet
    before it reaches the target. If any malicious activity detected, then IDS sends
    the alarm to the administrator. Then administrator takes necessary actions depends
    on the anomaly detected in the system. Anyway a human intervention is needed in
    IDS to prevent the entire system from any type of hazard. After the evolution
    of modern technologies like machine learning algorithms, human intervention is
    not essential in IDS interaction (Jabez & Muthukumar, 2015). Machine Learning
    algorithms detect the anomaly in the system and take the essential actions based
    on the database it have. In the database, all types of anomaly and its behavior
    are stored. By comparing the activities of the system with the database, IDS senses
    the anomaly if any and proceeds the required actions which make the system secure.


    # Types of IDS


    There are two types of IDS namely: Network Intrusion Detection System (NIDS) and
    Host Intrusion Detection System (HIDS). NIDS works at network level. It’s installed
    at strategic points of network to monitor threats or anomaly. NIDS analyze whether
    large amount of traffic happens in the network. If traffic occurs, then the chance
    of attack also will be high. For an example, Firewall configured at network to
    find good and bad sender. HIDS installed in all network devices with internet'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'connectivity. This intrusion detection system works as a second line in defense
    against the malicious attack. HIDS role comes into performance only when NIDS
    failed to detect the attack in the network. When attacker enters the network NIDS
    should able to detect it, otherwise intruder intrudes into network devices. Then
    HIDS installed in devices must detect the attack to provide security. For example,
    monitors the local system and alerts the administrator if any unauthorized person
    attempts to make any changes in the local file system or about missing files (Cuelogic
    Technologies,2019).


    # Cloud Computing and Edge Computing


    Cloud computing handles big data and suffers due to security issues. In cloud
    computing, all data stored at centralized cloud data center and sent to requester
    when needed. This centralized data center always under a threat and have a chance
    of compromise. To overcome this, edge computing were introduced, in which data
    are distributed and stored at small data center located nearer to the user. Edge
    computing lies between cloud and the user. Edge computing can also be called as
    Fog Computing. A small distributed and localized data center is called Edge devices.
    Edge devices can be gateway, router and any network devices. For example, Amazon
    Prime Video uses edge computing technology in which data centers are placed at
    different localized zone nearer to the consumer. When a user requests a page,
    request sent to nearer data center and processed. If it is found, video started
    playing on the requester screen. If it is not found in nearer data center, then
    request is forwarded to centralized i.e cloud data center. From centralized cloud,
    requested video copied to user’s nearest data center and started playing on the
    requester screen. When you play most popular videos, streaming of data will be
    less comparatively because popular videos are distributed to all small data centers
    in order to avoid buffering. All videos cannot be stored in edge data center due
    to limitations in size.


