    # ABSTRACT


    Blockchain technology generally is associated with financial applications where
    it serves the role of maintaining records. However, such a tamper-resistant distributed
    ledger can be used for fashioning applications in the healthcare domain. Harnessing
    the potential of blockchain as a data store for health records would ensure that
    they would be secure as multiple copies of them are preserved in a decentralized
    manner to ensure data redundancy and security. With this technology in effect,
    the medical sector could leverage blockchain tech to allow any authorized hospitals
    to securely communicate, share information/records independent from a central
    figure. Information shared would only contain relevant data related to the query
    between stakeholders with appropriate permission attached to their roles. This
    chapter delineates the architecture of such a system explaining its benefits and
    limitations as a medical data-storage architecture.'
