  md: '# PROPOSED APPROACH


    This section comprises Section 4.1 which describes the data transformation process
    from raw ECG signals. Section 4.2 describes the necessary modification on the
    input data to increase the model performance. Section 4.3 describes the architecture
    of the proposed model. Section 4.4 describes activation function used in proposed
    model. Section 4.5 describes a technique to optimize the model. Section 4.6 describes
    a technique to overcome over-fitting of the model which yield improved accuracy
    as compared to state of the art. Finally, Section 4.7 describes a detailed overview
    of the datasets used by our model.


    In broad, the proposed model consists of following four steps as depicted in Figure
    5.


    +   - **Step 1:** Data transformation step in which ECG beats are extracted from
    raw ECG signals.

    +   - **Step 2:** After the Data Transformation step, the signals are further
    pre-processed.

    +   - **Step 3:** After Pre-processing step, the data is sent as input to the
    Proposed Model (CNN in this research work). Here, training and validation set
    are provided to the fit the model according to the input data and finally, our
    model is trained on the given input data and is ready to be tested.

    +   - **Step 4:** Finally, the developed model is used for the classification
    of six types of arrhythmias, and a fresh set of dataset i.e., Test Set is provided
    to the model for the classification process.


    Figure 5. Classification procedure of an ECG signal by proposed model.


    ![](img/0e5ed5b85e46b41ac1e84d52eda7fb86_179_0.png)'
