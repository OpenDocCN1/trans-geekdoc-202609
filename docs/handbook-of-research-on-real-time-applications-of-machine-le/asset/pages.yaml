  md: '# IMPLEMENTATION


    To use the services offered by CluniacChain, a new user should register first
    before unlocking all the services like Disease predictor, medicine prescription,
    saving their medical reports safely in the Cluniac database, and requesting appointments
    with a doctor based on the severity of the disease.


    After the user registers, they have to submit their blood group, Date of Birth,
    Email ID, name, and address which are stored and mapped to a generated unique
    ID. Let''s assume the user wants to identify a particular disease they are suffering
    from by providing symptoms like headaches, nausea, and sensitivity to light. The
    CluniacChain Recommender System predicts migraine and prescribes ibuprofen to
    the user. If the user is satisfied with the medication, their medical record would
    be stored in CluniacChain through the Record Reading and Adding operation. Otherwise,
    they can go ahead and book an appointment with a doctor.


    For booking an appointment, CluniacChain uses the user''s address at the time
    of registration. The system will search for the nearby hospital clusters containing
    a list of hospitals and assign a hospital based on the patient''s requirements.
    In this case, the user is assigned to a Neurology hospital in Hospital Cluster
    A to diagnose migraine further. Then the appointment request is sent to the reservation
    queue, and the hospital administrator handles them. After the appointment confirmation,
    the doctor will prescribe medicines and the patient''s EHR update occurs through
    the Record Update operation. Figure 11 shows the described example in a stepwise
    manner.'
