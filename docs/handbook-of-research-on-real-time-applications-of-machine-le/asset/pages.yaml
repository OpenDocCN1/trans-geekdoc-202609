  md: 'architecture, port interception are the main components in the construction
    of secured CPS.


    # Challenges of CPS


    The spiffy CPS comprises of compound structure attracts young researchers and
    industry for its accomplishment. Since its components are tethered with internet
    receives threat and it has no literal solution for these attacks, (Teixeira et
    al, 2012). At the same time, the attackers develop and feed the signals to CPS
    repeatedly to track the structure of the system to acquire the input and output
    data. So the security level of CPS is upgraded by encrypting the feedback loop
    to protect the communication (Junsoo Kim, Chanhwa Lee, Hyungbo Shim, Jung Hee
    Cheon, Andrey Kim, Miran Kim and Yongsoo Song, 2016). The encrypted data has to
    be decrypted to operate on the inputs, so the secret key is retained in the interior
    of the controller and it can be pinched by attacks. Hence the key must be strong
    and unbreakable to quash the attacks, so it is desired to design a key using edge
    labels of an odd-even congruence graph.


    # Cryptography


    The fundamental principle of cryptography is to transform the information confidentially
    by compressing the data to an unintelligent sentence and it can be read only after
    decoding the compressed one. The cryptographic protection framework resists attacks
    and mischievous penetration depending on the robustness of the secret key, coherent
    mechanisms and protocols cognate with the keys. The Major component of cryptographic
    algorithm is secret key and often large keys are employed to attain improved algorithm.
    This algorithm alters the data and constructs it as a complicated unreadable text
    which can be recognized after applying the secret key. This algorithm is implemented
    to accomplish data confidentiality and message authentication services. The process
    of transforming the plain text to incomprehensible text is referred as encryption
    (Sarita Kumari, 2017). Encrypted incomprehensible text is stated as cipher text.
    The procedure of transforming the incomprehensible text to original text is referred
    as decryption. A key employed to both encryption and decryption process is identified
    as symmetric key (Ayushi, 2010). Encryption furnishes confidentiality of data
    by modifying the ordinary text into cipher text and decryption revamps the cipher
    text to original text. Cryptography is one of the leading efficient technologies
    to sustain the recent developed society of internet communications. The cryptography
    algorithms are assessed as powerful tool based on the secret key, the key will
    be strong if it is arrived using graph labelling.'
