    Network (DNN) is used to classify brain tumors with great accuracy. This methodology
    is compared to the classification techniques KNN, Linear Discriminate Analysis
    (LDA), and Sequential Minimal Optimization (SMO).


    Bauer,S et al.(2015) For brain tumor segmentation and classification, the fuzzy
    based control theory is employed. The Fuzzy Interference System (FIS) is a unique
