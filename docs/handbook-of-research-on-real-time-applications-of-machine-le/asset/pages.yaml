- pgno: 131
  md: '# # Logistic Regression


    Logistic Regression is a linear classification algorithm, hence it is suitable
    for the intrusion detection problem (Subba et al., 2015). Logistic regression
    is a predictive function in the form as:


    ```

    f(x) = θ(w^T x)

    ```


    Where in the X are the input feature matrix and w is the weight vector. The activation
    function θ can be chosen from several activation families. The most popular activation
    function is the sigmoid function, defined as:


    ```

    σ(s) = \frac{1}{1 + e^{-s}}

    ```


    The logistic regression uses the log-likelihood loss function, defined as:


    The logistic regression model can be trained using a stochastic gradient descent
    algorithm. Today, the logistic regression algorithm is supported by most of the
    popular data analysis languages. However, the logistic regression algorithm cannot
    cope with the missing values, hence it is not very useful in practice.


    # # SVM


    Support Vector Machine (SVM) is a well-known classification algorithm for intrusion
    detection (Chen et al., 2005). The idea of the SVM is visualized in Figure 8.
    In general, the SVM tries to find a hyperplane that separates two classes of data
    in the way that the margin is maximized. The SVM differs from the logistic regression
    in that the SVM does care only about the data points that are at the border of
    the classes, while the logistic regression does care about all the data points
    in a class.'
  merge: -1
  img_proc: true
- pgno: 132
  md: '# Figure 10. Binary classification with SVM (Chen et al., 2005)


    ![](img/0e5ed5b85e46b41ac1e84d52eda7fb86_132_0.png)


    We display the pseudo-code of SVM in Figure 9.


    # Figure 11. The pseudo-code of SVM (Chen et al., 2005)


    ```

    Support vector machine

    Problem def:

    For a classification problem, we try to estimate a function \( f : \Re^n \mapsto
    \{\pm 1\} \)

    using training data. So, let us denote two classes - A and B. The class A with
    \( x \in A, y = 1 \) and the class B with \( x \in B, y = -1 \). \( (x, y)_i \in
    \Re^n \times \{\pm 1\} \). If the

    training data are linearly separable then there exists a pair (w,b) \(\in \Re^n
    \times R \)

    such that \( y_i(w^t x + b) \ge 1, \) for all \( x \in A \cup B \).

    1. SVM belongs to the type of maximal margin classifier, in which the

    classification problem can be represented as an optimization problem


    Minimize \( \Phi(w) = \frac{1}{2} \|w\|^2 \quad s.t. \quad y(w^t x + b) \ge 1
    \)


    2. The dual of the optimization problem: find multipliers \( \lambda_i \) which
    maximize


    \( W(\Lambda) = \sum_{i=1}^l \lambda_i - \frac{1}{2} \|w\|^2 = \sum_{i=1}^l \lambda_i
    - \frac{1}{2} \sum_{i=1}^l \sum_{j=1}^l \lambda_i \lambda_j y_i y_j x_i^T x_j,
    \)


    and by the Karush-Kuhn-Tucker (KKT) complementary conditions


    \( \lambda_i [y_i(w^T x_i + b) - 1] = 0, \quad i = 1, ...., l, \)

    ```'
  merge: -1
  img_proc: true
- pgno: 133
  md: 'In their work, (Chen et al., 2005) achieved an attack detection rate of 99.6%
    with the false positive rate of 2.87% as the best result using the SVM algorithm.


    # Naïve Bayes


    The Naïve Bayes algorithm is a classification algorithm based on the Bayes rule
    in probability.


    The Bayes rule stated that:


    P(A|B) = \frac{P(B|A)P(A)}{P(B)}


    By using the Naïve Bayes classification, we assume the independence of the features.
    Then we have:


    P(y | x_1, ..., x_n) = \frac{P(y) \prod_{i=1}^n P(x_i | y)}{\prod_{i=1}^n P(x_i)}


    The advantage of the Naïve Bayes algorithm is that its computation is very fast
    and suitable for a low-power device. The Naïve Bayes algorithm has been studied
    for the problem of intrusion detection in the work of (Panda and Patra, 2007).
    Today, the Naïve Bayes algorithm is considered a weak classification algorithm
    against the modern dataset and usually is used as a benchmark algorithm (Dang,
    2020).


    # Decision Tree


    The decision tree algorithm is one of the most important algorithms in machine
    learning. The goal of the decision tree algorithm is to build a list of if-else
    rules automatically, then classify a new data point into a group by applying the
    rules consequentially. By its nature, the decision tree is suitable for the intrusion
    detection problem (Amor et al., 2005).'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'Figure 12. An example of a decision tree implemented in an intrusion detection
    system (Botes et al., 2017)


    ![](img/0e5ed5b85e46b41ac1e84d52eda7fb86_134_0.png)


    Another advantage of the decision tree is that it is very very easy to understand.
    For instance, Figure 9 shows us an example of a decision tree that is designed
    for the intrusion detection problem. A typical user can immediately understand
    the workflow of the tree without any further knowledge.


    Similar to the Naïve Bayes algorithm, today the decision tree is considered a
    weak classifier (Dang, 2019). However, the decision tree is the fundamental block
    to build more complicated algorithms that are bagging and boosting trees that
    we will discuss next. These algorithms usually are chosen as the best algorithms
    in machine learning competitions organized by Kaggle.


    # Random Forest


    Even the decision tree is considered a weak algorithm, ensembling them can make
    a different story. There are two approaches to ensemble the decision trees: bagging
    and boosting.


    Random forest (Breiman, 2001) is a bagging algorithm. The idea of the random forest
    is to create multiple decision trees, each differs from the others on the feature
    and the training data a little. Then the prediction can be treated as a vote between
    these trees.'
  merge: -1
  img_proc: true
- pgno: 135
  md: '# Figure 13. The random forest algorithm


    ![](img/0e5ed5b85e46b41ac1e84d52eda7fb86_135_0.png)


    The random forest is visualized in Figure 11. The random forest is used extensively
    in the literature for the problem of intrusion detection (Resende and Drummond,
    2018). However, according to (Dang, 2019), the random forest is outperformed by
    boosting machines algorithms like xgboost.


    # Boosting Machines


    Boosting is another approach to improve the performance of the decision tree.
    While in the bagging approach, multiple trees are built simultaneously and independently,
    the boosting models build multiple decision trees in sequence. The core idea is
    to let the following tree recover the prediction error made by the previous one.


    # Figure 14. The boosting trees


    ![](img/0e5ed5b85e46b41ac1e84d52eda7fb86_135_1.png)'
  merge: -1
  img_proc: true
- pgno: 136
  md: 'In recent years, several boosting models have been introduced and achieved
    a lot of success. To name a few of them, we have xgboost (Chen and Guestrin, 2016),
    lightgbm (Ke et al., 2017), and catboost (Dorogoush et al., 2018). The xgboost
    model achieved a near-perfect predictive performance in the modern intrusion dataset
    (Dang, 2019). In recent works (Dang, 2021), the researchers show that catboost
    might achieve an approximate result as xgboost but with much shorter training
    and inference time. In some experiments, the catboost algorithm might run faster
    than xgboost about ten times while the difference in the predictive performance
    is less than 0.0001%.


    # Isolation Forest


    Isolation Forest (Liu et al., 2008) is an unsupervised machine learning based
    on the idea of the random forest.


    Figure 15. The Isolation Forest


    ![](img/0e5ed5b85e46b41ac1e84d52eda7fb86_136_0.png)


    (a) Anomaly


    (b) Nominal


    The idea of the isolation forest is that we will use the random forest to classify
    each data point from all other data points. The deeper the tree we need to classify
    a single data point, the more normal it is. Hence, by applying the isolation forest
    on all the data points we can measure the abnormality of each data point and remove
    them from the data. The isolation forest can be used to clean data or to detect
    the intrusion directly (Dang, 2018).'
  merge: -1
  img_proc: true
- pgno: 137
  md: 'One of the main disadvantages of the Isolation Forest algorithm is its slow
    processing speed. Furthermore, the algorithm does not support null values which
    is very popular in practice.


    # Deep Learning


    Deep learning (Goodfellow et al., 2016) is an active research field today with
    a lot of achievements in recent years. It is no surprise that deep learning techniques
    are applied for intrusion detection systems. (Vinayakumar et al., 2017) studied
    multiple convolutional neural networks and their variants to detect the intrusion
    using the KDD-99 dataset. However, as most of the intrusion datasets are presented
    in the tabular data, the deep learning techniques do not show any improvement
    compared to the ensembled learning (Dang, 2021).


    # Reinforcement Learning


    Reinforcement learning (Dang and Vo, 2021) is a branch of machine learning that
    can be considered a middle point between supervised and unsupervised machine learning.


    Instead of requiring a labeled dataset like supervised machine learning algorithms,
    the reinforcement learning algorithms interact with the environment and observe
    the response to adapt its policy.


    However, as pointed out by many other research studies, reinforcement learning
    requires the algorithm to learn by trial and error, hence at the beginning of
    the learning phase, the model must let some malicious packages enter the system.
    It might not be possible in a real-world cyber system.


