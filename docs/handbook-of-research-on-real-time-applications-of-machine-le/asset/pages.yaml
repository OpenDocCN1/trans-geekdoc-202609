  md: '# Chapter 15


    # A Cyber Physical System Framework for Industrial Predictive Maintenance Using
    Machine Learning


    Sharanya S.


    SRM Institute of Science and Technology, India


    # ABSTRACT


    The rampant developments in the field of predictive analytics, artificial intelligence,
    big data, along with information and communication technologies have opened new
    ventures in cyber physical systems (CPS). The wide range of opportunities presented
    by CPS facilitated massive transformation of industrial processes that converged
    to building smart systems under the umbrella of Industry 4.0. The manufacturing
    and energy sector are now shifting their focus on predictive maintenance to pre
    plan their maintenance activities to reduce the downtime at optimized costs. This
    proactive maintenance planning involves the integration of multiple technologies
    like big data analytics, machine learning, and internet of things to build a complete,
    comprehensive framework that predicts the onset of failure from the early warning
    signs. The primal focus of this work is to develop a generic CPS framework for
    predictive maintenance (PdM) in industries from the condition monitored data.'
  merge: -1
  img_proc: true
- pgno: 267
  md: '# A BRIEF OVERVIEW OF CONDITION MONITORING AND INDUSTRY 4.0


    Condition Monitoring (CM) is the latest buzzword in the manufacturing sector.
    CM is defined as the uninterrupted process of monitoring a system, in the context
    of diagnosing a fault or failure. This process can be fractionated into a sequence
    of activities such as monitoring, detection of faults, diagnosing the cause of
    fault and fault prognostics. CM involves closely monitoring the critical parameters
    that can effectively characterize the health state of the system or equipment
    under study. Not all the parameters contribute to CM which is followed by fault
    detection. The domain experts have to delineate the critical variables or parameters
    whose deviated values can be a direct implication of the occurrence of faults.


    CM is broadly bifurcated into reactive and proactive CM. The former diagnoses
    the causes of the fault after its occurrence while the latter strives to foresee
    the fault before its occurrence. It is very evident that the world is moving deeper
    into the era of Artificial Intelligence (AI) and its cognate technologies. The
    maintenance sector in industries also harness its benefits by embracing Machine
    Learning (ML), Big Data Analytics (BDA) and Deep Learning (DL) in CM and failure
    prediction of equipment. Fault prognostics is an integral part of smart manufacturing,
    which is the pivotal objective of Industry 4.0. Predicting the fault from the
    early signs offers many fold advantages to the industries:


    +   - Demean the overall equipment maintenance time and downtime

    +   - Accelerate the productivity rate

    +   - Increase the working time

    +   - Mitigate the maintenance costs

    +   - Ensure safety


    CM is an effective tool in fault prognostics, since it can avoid mitigating the
    frequency of unplanned maintenance activities. Predicting the failures has become
    an inevitable part of any smart infrastructure. The advent of technologies like
    Internet of Things (IoT), Cloud computing, Digital twins, Edge computing and Edge
    AI has accelerated the advancements in industries, facilitating the evolution
    of Industry 4.0.


    # Evolution of Industry 4.0


    The smart transformation of the industries towards embedding intelligence and
    empowering the workers by using modern control systems is the primary motto of
    Industry 4.0. The conviction of Industry 4.0 is perceived to achieve the following
    traits:'
  merge: -1
  img_proc: true
- pgno: 268
  md: '+   - Integrate the physical and digital world

    +   - Secure data transfer

    +   - Intelligent automation

    +   - Increased degree of product customization

    +   - Smart assemble line

    +   - More tightly coupled industry value chain


    The metamorphosis to Industry 4.0 is realized as a result of numerous advancements
    that happened over the years, which are compartmentalized into various generations.
    Each generation will evolve as a progression in which the legacy systems will
    be replaced with more powerful modern rendition. The changes in each generation
    are gradual and incremental. The salient features of each industrial revolution
    are discussed below.


    # Industry 1.0


    Eighteenth century witnessed the era of the first industrial revolution, which
    was triggered by steam power. The production line was mechanized thereby capable
    of producing large volumes of goods. Power looms and steam powered locomotives
    came into reality. This brought a massive change in human lifestyle and industrial
    activity. Ford assembly line is a well-known example for mass production with
    increased productivity.


    # Industry 2.0


    The great breakthrough in the second generation was the generation of electricity.
    1870’s envisioned massive industrial production driven by electrical energy. This
    led to stupendous employment of the human workforce. Mammoth conveyor belts and
    large assembly lines can exist.


    # Industry 3.0


    The third generation was mainly characterized by the advent of electronic products
    and computers. Usage of computers and data exchange was further increased by the
    deployment of ARPANET, which is the brainchild of today’s internet. These developments
    further automated the production lines in the manufacturing industries with high
    end technologies. The memory programmable controls reduced the requirement of
    human assistance.'
  merge: -1
  img_proc: true
- pgno: 269
  md: '# Industry 4.0


    The main plug of the fourth industrial revolution is the debut of Information
    and Communication Technologies (ICT), which constitutes the cyber world. This
    era is actually a constellation of array of technologies like AI, digital twins,
    3D printing, additive manufacturing, cloud computing, edge computing, IoT etc.
    Industry 4.0 is a lattice of all these technologies built with the aim of achieving
    smart factories, in which the communication between components, systems and people
    is completely networked (Ricardo, 2018). The projected production line is nearly
    autonomous with minimal human control. The elementary hallmarks of this era are
    wholesomeness, speed and pervasive nature. One of the pivotal application areas
    is predictive maintenance, where the maintenance activities are scheduled by foreseeing
    the failures. Thus the modern day industries are transiting to become smarter
    by imparting the futuristic and state of art technologies to increase the production
    at declined maintenance and manufacturing costs.


    # Condition Monitoring


    The main goal of CM is to control the adverse effects of equipment failure, thereby
    reducing its downtime. The term availability focus on the duration of time the
    machine can operate to its promised performance. This is analogous to the operational
    time. The maintenance policies of the industries is designed based on the CM strategies
    adopted by them. There are two types of maintenance policies namely reactive and
    proactive maintenance. The reactive maintenance policies come into effect after
    the occurrence of fault in the system. This is relatively cheap. The proactive
    maintenance policies predicts the occurrence of fault from its early warning signs.
    Hence these strategies has wider scope to be deployed in smart industries. Proactive
    strategies are classified into preventive and predictive maintenance. The taxonomy
    of the maintenance activity is shown in Figure 1.


    # Preventive Maintenance


    This policy plans the maintenance activity in regular time intervals. Maintenance
    team does their routine checks periodically based on the operational hours or
    time. The usage or operational based maintenance activities are carried out after
    the equipment crosses a threshold running time. Time based maintenance is done
    after a pre-specified amount of time. Both these methods are widely applied in
    manufacturing industries to save time and costs. The major limitation here is
    the maintenance activity will be invoked irrespective of the health condition
    of the machine.'
  merge: -1
  img_proc: true
- pgno: 270
  md: '# # Predictive Maintenance


    This proactive maintenance strategy predicts the lifetime of the equipment by
    analyzing the trends and patterns from the critical variables values. This deploys
    condition monitoring as a tool to detect the abnormal patterns from the data (Thyago,
    2019). This increases the magnitude of proactive nature, thus reducing the frequency
    of maintenance activity. The ambit of predictive maintenance is further widened
    by predictive analytics, AI based techniques and IoT.


    # # Differences Between Preventive and Predictive Maintenance


    Though both predictive and preventive maintenance fall under the canopy of proactive
    maintenance strategies, they possess some inherent differences. Preventive maintenance
    involves periodic inspection of the equipment irrespective of the need. On the
    other hand predictive maintenance is done only when there is need for maintenance
    activity. Preventive maintenance does not necessarily require any condition monitoring
    activity, since they are done periodically without any inspection. Hence they
    do not incur any additional investment to develop the infrastructure. But predictive
    maintenance is an on demand strategy which requires initial investments in infrastructure
    and skill training. Preventive maintenance is bounded on the average lifespan
    of an equipment whereas predictive maintenance is determined on predetermined
    health conditions of the machinery. In short preventive maintenance appears to
    be more economical and simple but the long term benefits of predictive maintenance
    outmatch the former.


