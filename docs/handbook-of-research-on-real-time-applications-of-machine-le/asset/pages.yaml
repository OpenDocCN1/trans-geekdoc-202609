- pgno: 164
  md: '# # Cyber-Physical System Architecture


    AI-Ali introduces a layered architecture for the cyber physical system. This architecture
    be made up of 5 layers namely, physical layer, network layer, data storage layer,
    process - analytic layer and last application layers.


    +   1. Physical layer: Physical layer consists all the physical system component
    including sensors, actuators, System on Chip (SOC), tracking devices (GPS and
    RFID) and microcontroller computing elements. Sensors capture all the real date
    and send to the cloud service for further processing.


    +   2. Network layer: The Network Layer consists all the networking devices and
    protocol for communication with cloud services including protocols such as Wireless
    Fidelity (IEEE 802.11), Worldwide Interoperability for Microwave Access (IEEE
    802.16), General Packet Radio Service and 5G technology. These protocol are differentiate
    according to their properties according to scalability, bandwidth, speed, reliability,
    latency and security. Cyber physical system used these protocol in many applications
    such as hydropower plant monitoring system, Health monitoring system, smart agriculture,
    smart cities, driverless car, and wind power plant.


    +   3. Data storage layer: The physical layer collect lot of data from the physical
    objects and this data may be stored in a cloud domain of CPS. Data Storage layer
    consists the data management services in cloud domain such as Hadoop and the replica
    of stored data are distributed in different slave machines that are manage by
    replica management techniques.


    +   4. Processing and Analytic Layer: In this fourth layer different simulation
    model use processing on stored information with the help of dimensional modeling
    algorithms. Machine learning approaches for supervised and unsupervised learning
    including classification, clustering, and regression models are implemented to
    predict the final output value (Mahrishi, Mehul, et al.,2020).


    +   5. Application layer: Application layer consists of all the consumers level
    interface used in smart agriculture, green building, Intelligent Transportation
    Systems, health monitoring and robotics field.


    # # CHARACTERISTICS OF CYBER PHYSICAL SYSTEM


    Cyber-physical system have several characteristics for its quick decision making
    process for empower the manufacturing techniques to increase flexibility and efficiency.
    Cyber-physical systems should likewise be synchronized with the outer'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'world to share data and trigger activities. Different characteristics of CPS
    are listed in following Table 1.


    # Table 1. Cyber Physical System Characteristics


    | S. No. | Characteristics | Description |

    | :--- | :--- | :--- |

    | 1 | Complexity | CPSs are complex because all the used elements are different
    in nature |

    | 2 | Interoperability | Interoperability allows CPSs to interchange intelligible
    data. |

    | 3 | Networking Capability | CPSs should to be made out of interconnected groups
    of handling components and physical components in enormous scope wired and remote
    organizations through an assortment of sensors and actuators, targeting developing
    insight across various fields. |

    | 4 | Service orientation | CPSs used service oriented model to provide digital
    services. |

    | 5 | Modularity | CPSs components may be separated and recombined for achieving
    the modularity so that CPS to be flexibly as per consumer requirement. |

    | 6 | Autonomy | CPSs Autonomy is the capacity of individually learn and adjust
    to the system environment. |

    | 7 | decentralization | It is the transfer of control command and decision rule
    in CPS so that it work as independent entity. |

    | 8 | Integration | CPSs integrated all the new advance technologies so that the
    design process is faster and accurate. |

    | 9 | Virtualization | Virtualization in manufacturing consists a copy of actual
    physical manufacturing process application. |

    | 10 | real-time capability | CPSs have capabilities to work in a real time environment
    with sophisticated performance in good predictable manners. |

    | 11 | Computational capability | CPSs have various numerical computation capability
    and provide robust accuracy for real-world physical computation. |

    | 12 | Intelligence | CPSs are able to incorporation intelligent functionalities
    for fault tolerance, sensing behavior identification and decision making capabilities.
    |


    # LATEST ADVANCEMENT APPLICATION OF CYBER PHYSICAL SYSTEMS


    In this section the latest advancement application of CPS are presented.


