  md: 'The proposed deep learning model outperformed the competition in terms of average
    accuracy, precision, recall, and F1 score i.e., 99.16%, 95.15%, 96.53%, and 99.17%
    respectively in six class classification types of ECG signals; normal beats (N),
    unclassified beats (Q), fusion beats (F), ventricular ectopic beats (V), supraventricular
    ecotpic beats (S), and myocardial infarction (M) performed on 1,23,998 ECG beats
    than the others. Our approach has the inclusion of Stochastic Gradient Descent
    optimizer and Early Stopping technique which improves the performance of the proposed
    approach. Stochastic Gradient Descent optimizer allows deep neural networks to
    be trained more efficiently by letting each layer of the network to learn more
    independently. On the other hand, Early Stopping technique used to prevent over-fitting.
    Our proposed model can aid doctors explicitly for the detection and classification
    of arrhythmias.


    # CONCLUSION


    This research work proposes a CNN-based classification model for automatic categorization
    of arrhythmias using ECG signals. Two-dimensional images are taken as input from
    the MIT-BIH and PTB dataset. This model classifies six types of ECG with 99.16%
    classification accuracy that is higher than state-of-the-art studies on similar
    arrhythmias. This research resulted in a more efficient way for ECG arrhythmias
    classification with CNN deep learning method. This would aid doctors to better
    diagnose cardiovascular disease and eventually improves the rate of detection
    and identification of symptoms at early stage.


