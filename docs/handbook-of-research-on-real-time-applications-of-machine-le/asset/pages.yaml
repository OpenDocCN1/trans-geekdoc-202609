- pgno: 263
  md: 'Users can enter their location, filter hospitals based on ratings and budget.
    The proposed system will then match them with the best possible Hospital Cluster,
    and then the user can choose any hospital as per their liking from the list of
    hospitals. Hospitals trying to access the EHR must be permitted by the user through
    the sharing of attribute keys. If the user doesn''t want to visit the hospital,
    they can use the chatbot to describe their symptoms. The system will then give
    the possible disease based on the input using the BERT algorithm. The specialized
    doctors are suggested to the user based on the prediction. If the user is not
    satisfied, they can book an appointment to visit the nearest specialized doctor.


    The penalty system implemented in the architecture ensures that the privileges
    are not misused. A penalty score keeps track of the misconduct. If it exceeds
    a preset threshold value, then that hospital would be banned from using this system.
    Also, for keeping track of the different clusters, this system uses a Global Cluster
    Connector. Data security through blockchain is the main advantage of this system.
    The data stays protected with less possibility of a breach.


