    # The Operations


    The Electronic Medical Records (EMRs) of a patient are combined with additional
    information to provide a holistic picture as Electronic Health Records (EHRs).
    Storing the EHRs after encryption would ensure the security of the data. Similarly,
    a digital signature will ensure the integrity of the EHR. For future enhancement,
    a sign-encrypt-sign approach would be ideal.


    As discussed in the previous sections, encryption and signing are part of a multistage
    process. The Hospital Cluster (HC) would act as the attribute issuing authority
    in the process. It would be responsible for issuing the secret key for the patient.
    The user authorizes the hospital for specific permissions such as Read, Write,
    Update and Delete in the next step. Based on the allowed attributes, the Hospital
    Cluster issues corresponding attribute keys. The four operations, Read, Write,
    Update and Delete, applied on the EHR are synchronized to the blockchain.'
  merge: -1
  img_proc: true
- pgno: 260
  md: '# Record Reading and Adding (Read and Write)


    The EHR reading and adding operation requires the two attributes Read and Write.
    In the first step, the patient’s secret key encrypts the EHR. Signing the encrypted
    text by the patient in the next step ensures data integrity. Using a mutually
    agreed set of attribute keys between the hospital and the patient, the patient’s
    secret key encryption happens simultaneously. In the next step, the user uploads
    the encrypted EHR to the server. The server sends the information regarding the
    encrypted data to the blockchain as a Smart Contract. After verification, the
    addition of the new block into the blockchain occurs. Finally, storing encrypted
    data in the database happens and the patient receives information added notification.


    If another hospital wants to read the encrypted data, the patient needs to grant
    the read permission to the hospital through the Hospital Cluster. The creation
    of a smart contract for information retrieval happens. Then the block for this
    transaction is verified and added to the chain. Because of the patient’s read
    permission grant, the hospital can use the read attribute key to get the secret
    key for decrypting the encrypted EHR.


    # Record Update (Update)


    If patients want to update their EHR for a particular hospital, they need the
    update attribute key. After the permission is granted, the patient can upload
    their modified EHR to the server. Encryption of the EHR using the patient’s secret
    key and signing by the patient occurs just like the Record Reading and Writing
    operation. Once again, the server sends information regarding the encrypted EHR
    to the blockchain as a Smart Contract. After verification, the addition of the
    new block to the blockchain occurs. Replacement of old EHR with the new EHR occurs
    through unlinking followed by linking. Finally, deletion of old EHR and addition
    of new EHR in the database happens. Once successful, the patient receives an information
    update notification.


    # Record Deletion (Delete)


    If the patient wants to delete their EHR, they need the delete attribute key.
    After the permission authorization between the patient and hospital to delete
    the EHR, the delete attribute key comes into the picture. The patient then needs
    to confirm the deletion operation on the EHR. Then, the server sends information
    regarding the deletion of the EHR to the blockchain as a Smart Contract. After
    verification, the addition of the new block to the blockchain occurs. The EHR
    is then unlinked and deleted from the database. Once successful, the patient receives
    an information deletion notification.'
  merge: -1
  img_proc: true
