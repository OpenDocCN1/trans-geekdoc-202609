  img_proc: true
- pgno: 244
  md: '# INTRODUCTION


    In the present scenario, bulk Electronic Medical Records (EMRs) handling is dependent
    on the Health Information Systems (HISs) (Haux,R.,2006). These systems are centralized
    and provide multiple functionalities such as patient scheduling, admission/discharge/transfer
    logs, and billing information. The principal disadvantage of this centralized
    infrastructure is the lack of transparency, increased risk of data leaks, and
    subsequently higher repair costs (Menachemi, N., & Collum, 2011). The HIS usually
    handles Electronic Medical Records (EMRs) from a single hospital. It means that
    the patient’s cumulative report from multiple hospitals and doctors is not part
    of the EMR. This information can be pivotal for providing detailed insight in
    identifying symptoms and envisaging responses for the patient. An Electronic Health
    Record (EHR) is, therefore, a better alternative. EHRs give a holistic, long-term
    view of the patient’s health (Heart, T., Ben-Assuli, O., & Shabtai, I. 2017).


    The word blockchain seems quite self-explanatory since one would initially think
    of it as a collection of blocks linked together linearly. But in the real world,
    blockchains can be intricate. On the ground level, it is just a database storing
    information. But the structure and the concepts used in this database make it
    so unique (Pilkington, M., 2016). With the advent of cryptocurrencies in the last
    decade, blockchain has gained much popularity. It forms the heart of any cryptocurrency
    or a decentralized system (Eyal, I. 2017). Talking about decentralization, it
    is the process by which activities of a system are distributed and are not in
    direct control of a centralized authority.


    Our work proposes a Consortium Blockchain (Hasselgren, A., Kralevska, K., Gligoroski,
    D., Pedersen, S. A., & Faxvaag, A., 2020) to support transparent Electronic Health
    Records (EHRs) and enhance the disease prediction system. The proposed architecture
    ensures transparency while maintaining anonymity by utilizing the principle of
    Smart Contracts. Some key highlights of the proposal include organizing multiple
    hospitals under Hospital Clusters (HCs). The Hospital Clusters (HCs) aggregate
    multiple hospitals according to seven parameters. These parameters are specialization,
    location, threshold rating, average cost of treatment, capacity, fatalities, and
    recovery rate. The combination of these HCs forms a decentralized network that
    shares the consortium blockchain. A chatbot tuned according to each Hospital Cluster
    (HC) is then entwined with the user interface. The architecture encapsulates the
    following primary objectives:


    +   • Channelized rule-based patient information gathering.

    +   • Transparent and perspicacious Electronic Health Records maintenance.

    +   • Secure storage of appropriate information on the ledger.'
  merge: -1
  img_proc: true
