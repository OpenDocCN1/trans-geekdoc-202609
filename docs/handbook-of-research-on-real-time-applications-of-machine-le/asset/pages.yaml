    # SECURITY ISSUES OF CYBER PHYSICAL SYSTEM


    In digital transformation of industries revolution, a major challenge is security
    which is face by the cyber physical system and the most important element in this
    digital era is the modern cyber space. CPS security system need to balance the
    three characteristics named confidentiality, availability and integrity. The primary
    goal of confidentiality is to protect data by preventing information from being
    improperly disclosed. Availability is the contention that an authentic system
    is accessible by an authorized computer user at whatever time. Integrity is the
    protection of system data from unauthorized modification of information (Bakirtzis
    et al., 2021).'
