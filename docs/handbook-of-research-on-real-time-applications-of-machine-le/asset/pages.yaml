    # CONCLUSION


    The primary objective of this study is to develop an efficient automated brain
    tumor classification system with high accuracy, speed, and simplicity. Using Fuzzy
    C Means (FCM) based segmentation, texture and shape feature extraction, and SVM
    and DNN based classification, traditional brain tumor classification is carried
    out. To minimize the calculation time, Convolution neural network based classification
    is incorporated. For categorization, an image net database is employed. It’s one
    of the models that have already been trained. As a result, just the last layer
    gets trained. CNN also extracts raw pixel values with depth, width, and height
    feature values. Finally, to obtain high precision, the Gradient descent based
    loss function is used. The validation accuracy, validation loss, and training
    accuracy are all computed. The accuracy of the training is 97.5 percent. In the
    same way, validation accuracy is high and validation loss is minimal.'
