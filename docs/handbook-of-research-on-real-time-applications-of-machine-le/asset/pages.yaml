  md: 'Figure 10 enumerates some of the prominent challenges arrayed under three umbrellas.
    Besides these, CPS based predictive maintenance in real world industrial scenarios
    possess some inherent complexities as:


    +   - Integrating the highly volatile customer demands and unsatisfied design
    dictate frequent modifications in the functional requirements of the maintenance
    systems.


    +   - Instilling smartness in the factory floors requires a clear and long term
    business perspective. The acquaintance of CPS based predictive maintenance systems
    could be realised only in the long run.


    +   - The transition from the classical manual maintenance systems to CPS based
    systems occurs at a swift pace. This also necessities high initial investments.
    Hence the top level administrators must integrate the maintenance systems as a
    part of their strategic business plans.


    +   - Acquiring and mining the right data in its right context is an eventful
    hurdle in the design of maintenance systems.


    +   - Inseminating smartness in the control and monitoring of equipment warrants
    the coalescence of a multitude of technologies, which in turn demands upskilling
    the workforce. Proper training and awareness must be habituated to the skilled
    workforce, so as to cope up with a highly dynamic environment.


    +   - Security concerns, HCI and M2M interactions are not verifiable by the existing
    formal methods.


    +   - Availability of run-to-failure data of any equipment is very rare. This
    makes training and developing predictive maintenance models a difficult task.


    +   - Unpredictable failure modes of fresh products challenges the reliability
    of the maintenance systems.


    +   - Scaping ambiguous system behaviour and cause-effect analysis requires extensive
    domain knowledge.


    Though the CPS based predictive maintenance systems drop in with a lot of challenges,
    they are actually perceived as a blessing in disguise. These are some of the elementary
    research areas that is currently drawing attention.


