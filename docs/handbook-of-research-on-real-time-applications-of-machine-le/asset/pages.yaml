  md: '# Detailed Table of Contents


    +   Foreword .................................................... xix


    +   Preface....................................................... xxi


    +   Acknowledgment ........................................................ xxiv


    # Chapter 1


    +   A Survey on Automotive Cyber-Physical Systems: A Machine Learning-Based Approach
    .................................................... 1


    Sujith Jayaprakash, NIIT, Ghana

    Shanmugapriya N., Dr. S. N. S. Rajalakshmi College of Arts and Science, India

    Chitra K., Rathnavel Subramanian College of Arts and Science, India

    Kathiresan V., Dr. S. N. S. Rajalakshmi College of Arts and Science, India


    The cyber-physical system encompasses physics and cyber systems, which are highly
    interconnected and networked. Considered to be one of the fascinating inventions
    of today''s world, CPS applications include autonomous vehicles, industrial control
    systems, medical monitoring, automatic pilot avionics, etc. Autonomous or semi-autonomous
    vehicles, also known as self-driving or driverless vehicles, are automobiles that
    require less or no human intervention for operating or controlling them. CPS has
    brought in several advancements in the automobile industry by providing a seamless
    human interaction with physical and cyber systems, which includes IoT, artificial
    intelligence, machine learning, etc. Machine learning algorithms play a major
    role in enhancing autonomous vehicle models. This chapter focuses on the various
    machine learning algorithms that are used commonly in building robust autonomous
    vehicles. This chapter also focuses on the evolution of autonomous vehicles and
    the backed cyber advancements.'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# # Chapter 2

    Cyber Physical Systems Emergence With Reference to Manpower Development: An International
    Scenario With Indian Potentialities....................16

    Prantosh Kumar Paul, Raiganj University, India


    Cyber-physical systems, in short CPS, is a the term coined by Ellen Gill in the
    year 2006. It is a kind of embedded system. It is a kind of next generation computing
    systems that comprises the interacting digital, analog, physical components by
    integrated physics and logic. This CPS is associated and allied with other technologies
    and concepts such as big data analytics, cloud computing, internet of things (IoT).
    Furthermore, cyber-physical systems is making smart things by enabling smart grid,
    smart cities, and other intelligent and smart things, for example, cars, buildings,
    homes, manufacturing, hospitals, appliances. This chapter discusses the aspects
    of cyber-physical systems including its basics, features, functions, and emerging
    and possible roles. Moreover, this chapter also discusses the current trends on
    educational programs, training programs in the areas of cyber-physical systems
    internationally with potentiality in Indian context, and it depicts many opportunities
    in the contemporary scenario.


    # # Chapter 3

    Machine Learning in Cyber Physical Systems for Agriculture: Crop Yield Prediction
    Using Cyber Physical Systems and Machine Learning ................37

    Vinay Kumar Yadav, Sir Padampat Singhania University, India

    Manish Dadhich, Sir Padampat Singhania University, India


    The agriculture science system is facing lots of problems from environmental change.
    Machine learning (ML) and cyber physical systems (CPS) are the best approaches
    to overcome the problems by building good and effective solutions. Crop yield
    prediction includes prediction of yield for the crop by analysing the existing
    data by considering several parameters like weather, soil, water, and temperature.
    This project addresses and defines the predicting yield of the crop based on the
    previous year''s data using a linear regression algorithm into which you can type
    your own text.'
