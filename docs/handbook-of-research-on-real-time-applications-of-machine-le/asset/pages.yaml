    One of the most optimal solutions to overcome these privacy hazards is preserving
    data by noise addition using differential privacy perturbation mechanisms. In
    this case users can control level of privacy. This data perturbation has the direct
    effect with data accuracy. Adding more noise provides more security but less accuracy,
    where as adding less noise provides low security but more accuracy. So, therefore
    user needs to concentrate both accuracy as well as security. This technique has
    the capability to preserve huge amount of data on both real-time and databases.
    The major objective of this technique is not to provide enough information about
    any individuals in query output. Exponential mechanism, Laplace mechanism and
    Gaussian mechanism are the three major data perturbation mechanisms which will
    provide more information security for CPSs. This chapter presented a detailed
    and up-to-date survey of CPSs applications security threats, attacks, solutions
    and recommendations. This chapter concluded the survey article by highlighting
