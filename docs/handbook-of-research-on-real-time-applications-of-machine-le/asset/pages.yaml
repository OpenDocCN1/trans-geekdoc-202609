    # CHALLENGES OF CPS AND CRYPTOGRAPHY


    # Cyber-physical System


    Cyber-physical system is a unique network which communicates cyber and physical
    world. It comprises of sensors, controllers and actuators. Sensors will transfer
    the physical world data to the cyber world by estimating the existing physical
    quantities and furnish the estimated facts to controllers. Controllers allocate
    the commands to actuators depending on the statistics delivered by sensors and
    the actuators execute the commands. The actuator revamps the cyber solution back
    to physical solution and transfers it to the sensors. The technology behind the
    controller is supervisory control and data acquisition system comprises of human
    interfaces, networking device and workstations.


    CPS altered the human life and the substantial world which includes smart grid,
    transportation, energy system, water supply system, sensor, robotics, traffic
    control, automobile systems and different fields of worldwide economy. CPS is
    a methodology employed to combine the sensor tools and the power system. In this
    procedure information security is essential, since CPS is large complex system,
    reliability and security is required. The main challenging characteristics of
    CPS are data confidentiality that is the capacity to securing records during dispatch
    and storage, to prevent the information from the unaccredited group.


    CPS concentrates on the existing mechanism in all fields by accentuating on the
    lively feedback of the campaign management and interface. The network layer involves
    many diversified network, various techniques are applied to hold out against safety
    threat in contrasting ways, so the system has to be constructed to overcome the
    security threats with network layer compatibility and consistency. To improve
    the safety, the system is constructed in two ways such as point to point safety
    and end to end safety. The consistent technique incorporates mutual reliable communication
    between nodes in end to end reliable communication with concealed confidential
    key. Confidential key handling mechanism, cryptographic algorithm, hierarchical'
  merge: -1
  img_proc: true
