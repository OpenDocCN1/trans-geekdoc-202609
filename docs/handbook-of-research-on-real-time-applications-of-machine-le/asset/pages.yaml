    # 6. SENSORS IN AUTONOMOUS CARS


    Sensors are used in autonomous cars. It’s difficult to conceive self-driving cars
    without sensors. They enable the car to see and sense everything on the road,
    as well as collect the data required for safe driving. This data is collected
    and evaluated in order to create a pathway from one location to another and deliver
    the necessary steering, acceleration, and braking commands to the automobile.


    The information gathered by sensors in autonomous vehicles, such as the real path,
    traffic congestion, and any road impediments, may also be exchanged between automobiles
    linked via M2M technology. Vehicle-to-vehicle communication is what it’s called,
    and it may be a huge assist when it comes to driving automation.


    The majority of today’s automotive manufacturers most commonly use the following
    three types of sensors in autonomous vehicles


    +   - Cameras,

    +   - Radars, and

    +   - Lidars.


    # a. Camera Sensors


    Video cameras and sensors are commonly used in autonomous vehicles to detect and
    interpret things on the road, just like human drivers do with their eyes. By equipping
    automobiles with these cameras from every angle, they would be able to retain
    a 360° view of their exterior surroundings, giving them a more comprehensive image
    of traffic situations. 3D cameras are now available and may be used to display
    very detailed and lifelike visuals. These image sensors detect, categorize, and
    calculate distances between objects and the vehicle automatically. Other automobiles,
    pedestrians, bicycles, traffic signs and signals, road markings, bridges, and
    guardrails, for example, are all easily identifiable by the cameras.'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# b. Radar Sensors


    Radar (Radio Detection and Ranging) sensors are critical to autonomous driving’s
    general function: they send out radio waves that detect objects and calculate
    their distance and speed in real-time in relation to the vehicle. Short- and long-range
    radar sensors are often distributed throughout the vehicle, each with its own
    set of tasks. While short-range (24 GHz) radar applications allow for blind-spot
    monitoring, optimum lane-keeping assistance, and parking aids, long-range (77
    GHz) radar sensors are responsible for automated distance control and braking
    assistance. Radar devices, unlike camera sensors, generally have no problem detecting
    objects in fog or rain.


    # c. Lidar Sensors


    Lidar (Light Detection and Ranging) sensors function similarly to radar systems,
    with the exception that instead of radio waves, they utilize lasers. Lidar can
    create 3D pictures of identified items and map the surroundings in addition to
    measuring distances to various things on the route. Furthermore, rather than relying
    on a restricted field of vision, lidar may be set to produce a full 360-degree
    map surrounding the vehicle. Lidar systems are preferred by autonomous car makers
    such as Google, Uber, and Toyota because of these two benefits.


    # d. ADAS (Advanced Driver Assistance Systems)


    The majority of car collisions are caused by human mistakes, which may be reduced
    or eliminated using Advanced Driver Assistance Systems (ADAS). The goal of ADAS
    is to reduce the frequency of automobile accidents and the severity of those that
    cannot be prevented, thereby preventing fatalities and injuries.


