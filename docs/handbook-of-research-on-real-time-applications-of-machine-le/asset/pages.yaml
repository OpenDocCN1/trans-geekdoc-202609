    the Apriori method is utilized to find the causal link between numerous variables.
    The crash severity is assessed using the support vector machine (SVM), classification
    and regression tree (CART), and eXtreme Gradient Boosting (XGBoost) methods.


    Because pedestrian identification has been regarded as one of the most essential
