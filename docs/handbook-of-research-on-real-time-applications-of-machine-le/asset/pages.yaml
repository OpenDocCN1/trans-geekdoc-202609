  md: '# 3.2. Block Chain Distributed Based Local Regenerative Code Technology for
    Data Storage in Different Nodes


    After the data is divided, it must be stored in a safe location, such as separate
    nodes. This is accomplished through the use of Block chain distributed based local
    regenerative code technology.


    The distributed storage fault-tolerant structure of industrial blockchain consists
    of high fault-tolerant local code block namespaces, index records, and mappings
    from code blocks to storage nodes. Perception modules assess storage node’s loss
    of data and communicate the loss to metadata information management modules. When
    clients read files, they first acquire file encoding block’s offset information
    from storage servers. Original terminal data is then retrieved directly from block
    chain storage nodes by using system’s local codes which are high fault-tolerant
    local codes. To improve the overall reliability and resilience of industrial block
    chain storage systems, cache servers are configured for storage servers and fault-tolerant
    local code encoded data are transmitted and cached on storage servers. Cache servers
    are in charge of file backup caches and when storage servers are physically destroyed,
    cache servers assume control and begin operation thus reducing latency overheads
    of data file reconstructions but by increasing the storage overhead (Sajjad, M.,
    et al., 2019).


    # Fault-Tolerant Distributed Storage Algorithm


    Because of the massive number of nodes in block chain cloud storage systems, many
    storage nodes are destroyed and local codes that can effectively repair failed
    nodes need to be created (Md. Shahidul Hasan, et al, 2020). This study selects
    appropriate values of n and k based on the number of cloud storage system nodes
    in block chains to construct a local code with locality of (n, k). The usage of
    vector codes in development of single local codes with localities (n, k) is investigated
    as vector codes include n discrete repair groups and numerous failing nodes can
    be patched concurrently from k discrete local repair groups. The number of local
    repair groups specifies the number of failed nodes that may be fixed concurrently,
    whereas the number of nodes in the repair group determines the repair locality.
    Using Cauchy matrix and multidimensional linear vector codes, a local code with
    the locality of (n, k) may be created (Balamurugan E et al, 2020).


    First, the source file M is divided into n data blocks {X1, X2, ... , Xn} and
    stored in nodes in which each node contains three blocks. The first block is a
    data block Xi, the second block is a check block Yi = XiAi1 + XiAi2 + ... · XkAim,
    and the third block is a timestamp block Ti, combined as a coding vector Bi =
    {Xi, Yi, Ti}, 1 ≤ i ≤ n, so that fault-tolerant local regeneration code is constructed.
    Whenever one node'
  merge: -1
  img_proc: true
- pgno: 232
