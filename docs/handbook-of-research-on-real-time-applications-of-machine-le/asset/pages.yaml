  md: 'classify brain tumors automatically. Image net provided the brain image dataset.
    One of the pre-trained models is the image net. If you wish to train from the
    first layer, you must train the full layer (all the way to the finish).


    As a result, there is a significant amount of time spent. It will have an impact
    on the outcome. To overcome this issue, classification stages are performed using
    a pre-trained model based on a brain dataset. Only the final layer of the proposed
    CNN will be trained in Python. We don''t want to train all of the layers at the
