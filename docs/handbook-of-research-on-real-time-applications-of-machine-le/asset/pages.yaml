  md: '# Figure 3. ML Models


    Supervised learning is defined as the use of labelled datasets to train the algorithms
    that consistently categorize data or predict outcomes.


    Unsupervised machine learning uses machine learning algorithms to analyze and
    cluster unlabeled datasets.


    During training, semi-supervised learning uses a smaller labelled data set to
    assist classification and feature extraction from a larger, unlabeled dataset.


    Reinforcement machine learning is a type of behavioral machine learning in which
    the model learns by making mistakes.


    # 3. ROLE OF MACHINE LEARNING IN CPS


    Machine learning algorithms have revolutionized almost every field (Hiran, Khazanchhi,
    Vyas et al, 2021). Businesses all across the globe have increased their efficiency
    by predicting future occurrences or forecasting based on historical data. The
    use of machine learning algorithms is growing in every sector of business. Industry
    4.0 will concentrate on a wide range of digital applications, such as intelligent
    control of automated and semi-automated vehicles, health monitoring, analytics,
    and process optimization. By allowing self-learning and decision-making applications,
    machine learning algorithms will play a crucial role in achieving the goals of
    Industry 4.0. The backbone of autonomous or semi-automated cars is machine learning
    algorithms. To conduct futuristic actions, the models acquire data from various
    cameras and sensors. Typically, these models are created to improve security,
    efficiently manoeuvre, or predict road objects. Several researchers and academics
    have collaborated on and proposed models to improve the capabilities of self-driving
    or autonomous cars. Here are a few publications that focus on machine learning
    methods for autonomous cars. N. Motamedeidehkordi et al. (Motamedeidehkordi et
    al., 2017) presented a model to analyze human drivers’ tactical behaviour during
    lane-changing manoeuvres. Vehicle ID, Frame ID, Lane ID, Local X, Local Y, Mean
    Speed, Mean Acceleration, Vehicle Class ID, Vehicle length, Follower ID, and Leader
    ID are the recognized features used to mimic driving behaviour. Naive Bayes, Support
    Vector Machine, Linear Regression, KNearestNeighbourhood, Decision Tree, and Random
    Forest were used to create several models. Decision tree classifiers beat the
    rest of the models in the study. F. Remmenet.al.,(Remmen et al., 2018) recommended
    a model to predict the cut-in manoeuvre of a vehicle based on fixed parameters.
    Truck platooning is gaining more and more interest and thanks to the benefits
    of improved traffic efficiency, reduced fuel consumption and emissions. In this
    paper, the researchers have tried to predict the cut-in manoeuvur of the vehicle
    based on fixed parameters like Longitudinal distance to host vehicle,'
