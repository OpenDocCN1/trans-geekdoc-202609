  md: '# KEY TERMS AND DEFINITIONS


    **Cipher Text:** It is an unreadable output of an encoding algorithm.


    **Congruence Labelling:** Suppose G = (V,E) be a graph with |V| = p and |E| =
    q is referred as a congruence graph, if there exist a vertex labelling function
    f: V →{1,2,....k} for every vᵢ in V and induces edge labelling g: E→{1,2,3,...,k}
    such that f(vᵢ) ≡ f(vⱼ) mod g(eᵢ) for every eᵢ = vᵢvⱼ, where k = min{2|V|,2|E|}.


    **Cryptography:** Cryptography is a method of protecting information and communications
    in computer systems through the use of codes.


    **Encoding:** The process of converting data from one form to another form is
    referred as encoding.


    **Graph:** The graph comprises of vertices and edges to represent the mathematical
    structures to model pairwise relations between objects.


    **Graph Labelling:** Graph labelling is the assignment of integers to vertices
    and edges.'
