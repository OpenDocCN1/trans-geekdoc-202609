    # a. Challenges


    The camera sensors, unfortunately, are still far from ideal. Rain, fog, or snow
    can obscure the obstructions in the road, increasing the risk of an accident.
    In addition, there are times when the pictures from the cameras are just insufficient
    for a computer to make an informed judgement on what the automobile should do.
    The driving algorithms may fail in circumstances where the colors of objects are
    very similar to those of the backdrop or when the contrast between them is minimal.


    The pedestrian detection algorithm is in desperate need of improvement, given
    that today’s automobile radar sensors only accurately identify between 90 and
    95 percent of pedestrians, which is insufficient to assure road safety. Furthermore,
    because the sensors only scan horizontally, 2D radars cannot correctly detect
    an object’s height, which can pose a number of issues while driving beneath bridges
    or road signs. To address these difficulties, a broader range of 3D radar sensors
    is now being developed. Lidar sensors are significantly costlier than radar sensors
    used in autonomous vehicles because rare earth metals are required to build sufficient
    lidar sensors. The equipment needed for autonomous driving may cost well over
    $10,000, with Google and Uber’s top sensor costing up to $80,000. Another issue
    is that snow or fog can occasionally obstruct lidar sensors, making it difficult
    for them to detect things in the road.


    # b. Opportunities


    In automated driving, autonomous sensors are critical because they allow automobiles
    to monitor their surroundings, identify approaching hazards, and plan their routes
    safely. They will eventually let the automation system to assume full control
    of the vehicle, saving drivers a considerable amount of time by doing duties in
    a far more efficient and safe manner. Imagine how beneficial autonomous vehicles
    may be in the fast-paced society we live in, given that the average driver spends
    about 50 minutes each day in a car. While autonomous car technology looks to be
    progressing at a rapid rate, no commercially available vehicles have yet achieved
    the level 4 rating necessary for road-safe autonomous vehicles. There is still
    a significant amount of technological advancement that manufacturers must consider
    in order to assure autonomous car safety on the roads.'
