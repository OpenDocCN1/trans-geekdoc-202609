  md: 'CNN-based classification algorithm:


    +   * Step 1. In the first layer, apply a convolution filter.

    +   * Step 2. Smoothing the convolution filter (i.e. sub sampling) reduces the
    sensitivity of the filter.

    +   * Step 3. The activation layer regulates signal transmission from one layer
    to the next.

    +   * Step 4. Use a rectified linear unit to shorten the training duration (RELU)

    +   * Step 5. Every neuron in the previous layer is linked to every neuron in
    the following layer.

    +   * Step 6. A loss layer is added at the conclusion of the training process
    to provide feedback to the neural network.


    # RESULTS AND DISCUSSION


    Our Dataset contains tumor and non tumor MRI images and collected from different
    online resources. In this work, efficient automatic brain tumor detection is performed
    by using convolution neural network. Simulation is performed by using python language.
    The accuracy is calculated and compared with the all other state of arts methods.
    To determine the efficacy of the proposed brain tumor classification method, the
    training accuracy, validation accuracy, and validation loss are computed. Support
    Vector Machine (SVM)-based categorization is used in the current approach to detect
    brain tumors. It necessitates the output of feature extraction. The classification
    output is created and accuracy is determined based on feature value. In SVM-based
    tumor and non-tumor identification, the calculation time is long and the accuracy
    is low. The suggested CNN-based categorization does not need separate feature
    extraction processes. CNN is used to calculate the feature value. Figure 3 & 4
    shows the loss and accuracy of brain tumor categorization. As a result, the complexity
    and calculation time are minimal, yet the accuracy is good..'
