    # # Deep Learning


    Deep Learning is one of the machine learning and it uses programmable neural networks.
    It learns from processing the training dataset and uses it to learn the characteristics
    of test dataset. Deep Learning uses multi - layered structure of Artificial Neural
    network as architecture, which is called as Deep Neural Network. DNN develops
    a self-adaptive system with better analysis and pattern matching. This network
    helps to achieve artificial intelligence by implementing machine learning algorithms.
    Languages like Python, R are mostly used to develop a neural network. Deep Learning
    is used in many real time applications like Driverless car, Medical field, Recommendation
    systems etc. It is believed that deep learning, an advancement of ML will rule
    the future world.DNN can be classified into three types based on its architecture
    namely: Feed Forward Neural Network (FFNN), Recurrent Neural Network (RNN) and
    Convolutional Neural Network (CNN).


    # ## i) Feed Forward Neural Network


    Generally DNN is a Feed Forward Neural Network (FFNN) in which data is unidirectional
    from input to output layer. Link connects the neurons in all layers in a forward
    direction. Supervised learning in FFNN uses back propagation to end up with best
    accuracy.


    # ## ii) Recurrent Neural Network


    RNN looks like a directed graph, information flows to next layer and next layer
    to previous layer also. It has memory in internal state to remember the information.
    In RNN, data flows forward and backward of the layer to work depending on the
    current input and past output values. RNN became smarter by using Long Short Term
    Memory (LSTM), which is a special kind of RNN. LSTM has one input gate, forget
    gate and output gate.'
  merge: -1
  img_proc: true
- pgno: 204
  md: '# iii) Convolutional Neural Network


    Convolutional Neural Network commonly applied to visual applications like object
    detection, image classification and natural language processing. CNN takes images
    as input whereas DNN and RNN have values as input. CNN also uses LSTM to achieve
    good performance. Output of CNN will be extraction of particular region of an
    image. Region exhibits the desired feature which is called feature map. To overcome
    this problem, DNN based intrusion detection system is built. IDS are experimented
    by evaluating DNN in terms of different number of hidden layers to obtain high
    accuracy for dataset KDD-99.


    # DNN Architecture


    DNN is a collection of neurons and it contains one input layer, hidden layers
    and one output layer. Input layer has neurons to get input and forward it into
    hidden layer. Neurons in hidden layer get activated based on the activation function.
    Activated neurons forward the information to the following layer. This continues
    and reaches the output layer. In output layer, neurons exists depends on the type
    of input. If it''s a binary classification, then output layer will have only two
    neurons one for true and one for false. Propagation function plays an important
    role in neural network to achieve high exactness. Forward and Back propagation
    are two types of propagation function used in neural network. Forward propagation
    will deliver “predicted value” whereas back propagation delivers “error rate”.
    Neural network groups the unlabeled data based on its similarities and label the
    training data based on it. It mechanically adjusts to changing input and results
    in best output. This technique of adjusting the weight of neurons according to
    the error value helps DNN to achieve high precision than ML Algorithms. Adjusting
    the weight of neurons quickly or slowly defined as learning rate of a model. Irrespective
    of neural network types whether FFNN or RNN, back propagation used as problem
    solving method. This makes neural network more applicable for speech recognition,
    text classification, language processing, intrusion detection system and semantic
    analyzing. In this proposal, DNN with various hidden layers were built and trained.
    Training and testing of dataset can be split as 80% and 20% or 70% and 30% respectively.
    In this proposal, 80% of dataset used for training and 20% of input dataset used
    for test set. Three different DNN with single layer perceptron and multi-layer
    perceptron (one hidden layer, two hidden layers, and three hidden layers) are
    trained (80% of dataset) and tested (20% of dataset). After training, test data
    given as input for all three DNN and results were compared. Performances of all
    three DNN were analyzed using accuracy, precision, recall and F1-score. It should
    be noted that this module of predicting the possibility of attack'
