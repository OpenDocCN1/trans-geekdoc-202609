    # EEG Data Set


    The data is obtained from Kaggle repository. The EEG signals of various patients
    are collected as data values. The original data file extracted from the open source
    contains 5 set of different folders. Each file contains the recording of the activities
    of the brain for 23.6 seconds. The supporting time series data is sampled to 4097
    points of data. Further, the data points are partitioned into 23 chunks that includes
    178 data points that accounts for a second. The explanatory variable values x1,
    x2, x3...x178 that represents the 178 dimensional input values. And more importantly,'
  merge: -1
  img_proc: true
- pgno: 149
  md: 'y represents the operation of the eye in certain amount of time. It has represented
    in class {1, 2, 3, 4, 5} where 5 means eye has been opened, 4 means eyes has been
    closed, 3 represents the identification of tumor region, 2 represents the location
    where the tumor is spotted and 1 means the recording of the activities of the
    seizures. Class 1 falls under the epileptic seizure category and all the other
    classes fall under non-epileptic seizure category.


    # Data Preprocessing


    The pre-processing method involves various steps that includes identifying the
    individual trail set from the extracted dataset. Then, it is followed by filtering
    and rejection of artifacts. The identification is done using trigger signal. The
    dataset is referenced to an averaged channel. Filtering is supposed to do in removing
    the unwanted frequencies. The rejection of artifacts such as blinking of eyes
    is done using Multiple Artifact Rejection Algorithm and the signal power is checked
    proceeded with saving the changes in the same csv file.


    # Implementation of Convolution Neural Network (CNN)


    CNN is a Deep Neural Network that can recognize and classify particular aspects
    in images, and they’re commonly employed for image analysis. CNN architecture
    is computationally efficient which involves special convolution, pooling operations
    and perform parameter sharing. Image, video recognition, medical image analysis
    and classification, computer vision, natural language processing are only a few
    of their uses. The wavelet feature extracted was trained in order to detect any
    epileptic transients in the data values of EEG signals. The CNN is employed for
    training the dataset values especially for the wavelet features concerned. The
    Convolution Neural Network (CNN) was developed from tensor flow. The parameters
    supposed to be implemented are used in optimizing the model and prevents over-fitting
    that includes dropout, 1 dimensional layer, balanced training, batch processing
    and cross-validation in determining the stopping criteria. In dropout layer, the
    percentage concerned for the fully connected layer has been dropped out to prevent
    data values over-fitting. The trained dataset value is further evaluated using
    Decision tree and Support Vector Machine (SVM). The dataset is classified into
    trained, tested, overall trained value and validation. The input feature provided
    for SVM and decision tree is given as the output that has been extracted from
    the spike detection based on CNN. The metrics obtained for the model are Accuracy,
    confusion matrix, average precision, recall, support and F1 score.'
