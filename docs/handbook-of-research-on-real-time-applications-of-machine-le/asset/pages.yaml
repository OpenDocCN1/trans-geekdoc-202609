  md: '![](img/0e5ed5b85e46b41ac1e84d52eda7fb86_207_0.png)


    Figure 3 shows the evaluation of the accuracy, precision, recall, f1 score of
    DNN with different number of layers. Accuracy can be found in the context of total
    number of correct prediction to the total number of dataset. Precision can be
    found in the context of total number of correct positive prediction to total number
    of positive prediction. Recall can be found in the context of total number of
    correctly classified positive prediction to the total number of correctly classified
    data. F1-score provides the degree of incorrectly classified data. This proposed
    model was executed using Tensor flow and Python programming. The outcome of proposed
    model was measured using accuracy, precision, recall and f1-score as given in
    (3), (4), (5) and (6) respectively.


    ```

    Accuracy= (TP+TN) / (TP+TN+FP+FN) (3)

    ```


    ```

    Precision = (TP) / (TP+FP) (4)

    ```


    ```

    Recall = (TP) / (TP + FN) (5)

    ```


    ```

    F1-score = 2*((Precision * Recall) / (Precision + Recall)) (6)

    ```'
