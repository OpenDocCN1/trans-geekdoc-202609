    To ensure that only patient-authorized entities are allowed access to their data,
    encrypt it and sign it, providing data authenticity. For understanding the generation
    of attribute keys, it is required to define the additional terms.


    Generate a secret key to encrypt the patient data. This step involves the AES
    (Daor et al., 1999) algorithm for encrypting the EHR belonging to the patient
    and ABE (Attribute-based encryption) to encrypt the secret key.


    Let the private key of the patient be denoted as K1 and the public key as K2.
    Let the key-issuer be denoted by KI (KI is the Hospital Cluster in this system).
    The cluster generates different keys (Read/Write/Update/Delete) based on permissions
    granted.


    Let the Secret Key be denoted by Skey. Let the Attribute Key Set be denoted by
    AKS which can be called the secret key of the secret key Skey. Let the Electronic
    Health Record of the patient be denoted by EHR. Let the Final Signature generated
    after applying the hashing algorithm BLAKE2b (Aumasson et al., 2013) on the ciphertexts
    be ζ.


    Now, generating the ciphertexts:


    ```

    T = AES (Skey, EHR)

    ```


    Suppose the user has multiple attribute keys issued by some key issuer KI, then
    the ciphertext would be represented by:


    ```

    U = { ABE (AKS_r, Skey), ABE (AKS_r, Skey) ..., ABE (AKS_r, Skey) }

    ```


    Where AKS1 might be the secret key for the user''s read permission, AKS2 for the
    user''s write permission, and so on.


    Now before storing it into the database, hash these ciphertexts by using an appropriate
    hashing algorithm. Based on the advantages discussed earlier, the BLAKE2b algorithm
