  md: '# RESULTS AND ANALYSIS


    The experimental approach and results of the experiment are described in this
    section. The experimental data for the proposed model derives from the MIT-BIH
    and PTB diagnostic databases, which are international standard ECG databases.
    It is frequently utilised for the development of cardiac arrhythmia research areas
    as it contains accurate and descriptive expert annotations. The experiment used
    64% of the dataset for the training, 16% for validation, and 20% for testing i.e.,
    79357, 19842, 24799 respectively. In the final model, there were 50 epochs for
    training. The dataset was split into 32 batches during each epoch.


    Two dimensional images were resize to 64x64 grayscale images for the input to
    CNN model. The proposed CNN model was implemented using Tensorflow (Abadi et al.,
    2016), a Python package. Hardware specifications for the execution of our models
    are GPU TITAN XP. Training process took a total of 31448.33 sec.


    The optimization parameters of the proposed model are the number of convolution
    layers, pooling layers, and early stopping technique (a regularization technique
    to overcome over-fitting (Ying, 2019)). As the proposed model uses a large dataset,
    more number of convolution operations required to extract features from the training
    dataset by the proposed model to perform better on the test dataset. Based on
    the number of convolutional layers and pooling layers present in the model, we
    evaluated two experimental approaches and performed experimental verification.
    In Experiment CNN-A, we used a CNN model of five layers with one convolutional,
    one pooling layer with SGD optimizer having learning rate, momentum, batch size,
    epochs 0.01, 0.9, 32, and 30 respectively. In Experiment CNN-B, we used a CNN
    model of eight layers with three convolutional, two pooling layers with SGD optimizer
    having learning rate, momentum, batch size, epochs 0.01, 0.9, 32, and 50 respectively.
    The average accuracy improves from 98.04% in CNN-A to 99.16%


    Figure 9. Accuracies of two training models CNN-A and CNN-B.


