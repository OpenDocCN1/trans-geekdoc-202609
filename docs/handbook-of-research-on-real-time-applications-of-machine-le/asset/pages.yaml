    # 3.1. Dividing Big Data Into Multiple Blocks Using Semantic Segmentation Based
    CNN


    Big data create storage overhead to reduce this problem it requires dividing into
    small segments. This work using semantic connectivity based segmentation using
    CNN (Eggert, C., et al, 2017).


    +   * **Input:** It accepts large amounts of data as input. Perform a normalization
    before passing information to the first convolution layers.

    +   * **Convolution Layer:** Convolution layers (Abbas, S.M. and Singh, S.N.,
    2018) are composite convolutions followed by batch normalizations for non-linearity
    with ReLUs (Rectified Linear Units) and where normalizations eliminate covariance,
    allow quicker learning rates with improved generalizations'
  merge: -1
