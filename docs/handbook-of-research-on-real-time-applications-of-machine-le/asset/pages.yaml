    raw image pixel is mapped to class scores. The loss function is used to assess
    the quality of a collection of parameters. It is determined by how closely the
    induced scores matched the training data''s ground truth labels. To increase accuracy,
    the loss function calculation is crucial. When the precision is low and the loss
    function is large. Similarly, when the loss function is low, the accuracy is high.
    To compute the gradient descent algorithm, the gradient value is determined for
    the loss function (Auzias,2015). To compute the gradient of the loss function,
    evaluate the gradient value several times.


