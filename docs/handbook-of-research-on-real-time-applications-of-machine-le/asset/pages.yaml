- pgno: 180
  md: '# Data Transformation


    Data transformation is the first step in which raw ECG signals are being transformed
    to ECG images to extract relevant features as shown below in Figure 6. It improves
    the data by suppressing undesired distortions and enhancing some aspects that
    are required for the model to train accurately. The input ECG image dataset taken
    from the kaggle open-source dataset, which was converted by (Kachuee et al., 2018)
    from raw ECG signals to two-dimensional RGB images of size 432x288 pixels. Some
    research works used time series data as input to the model; however, the proposed
    approach uses two-dimensional images as input as machine learning approaches are
    outperformed by deep learning methods. Machine learning approaches are designed
    to work with one-dimensional vector data, which requires stretching the image
    matrices to one-dimensional vectors, which leads to loss of adjoining information
    in images and the omission of some crucial features. Therefore, instead of using
    one-dimensional signals, we use images for better performance with convolutional
    neural networks. It can be used with real-time arrhythmia classification, which
    can aid doctors (Ying, 2019), as well as smart devices and medical devices to
    automatically classify arrhythmias by providing image data as input to the device.


    Figure 6. ECG beat extraction from an ECG signal.


    ![](img/0e5ed5b85e46b41ac1e84d52eda7fb86_180_0.png)


    Following steps are performed for the extraction of ECG beats from ECG signal:


    +   1. A split of 10s is performed on continuous ECG signals.

    +   2. Amplitude of ECG signal is normalized to zero and one range.

    +   3. All local maximums are determined through zero-crossings of first derivative.

    +   4. Using a 0.9 criterion on the normalised local maximum value, set of ECG
    R-peak values are calculated.'
  merge: -1
  img_proc: true
- pgno: 181
  md: '+   5. The nominal heartbeat of the relevant window is calculated using the
    median values of R-R intervals (T).


    +   6. A signal component with a length of 1.2T for each R-peak is selected.


    +   7. According to a preset fixed length, the corresponding selected part padded
    with zeroes.


    The proposed beat extraction approach is easy and efficient in performing the
    extraction of R-R intervals from ECG signals with various morphologies. Furthermore,
    all of the retrieved beats have the same length, which is necessary for them to
    be utilised as inputs to the following processing steps.


    # Pre-Processing


    The model’s performance has to be improved, thus ECG images were further pre-processed
    in the proposed approach. Using ImageDataGenerator library (“IDP,” 2021), pre-processing
    is performed by implementing firstly, rescale = 1./255. Rescale is a multiplier
    that will be applied to the data before any additional processing. Since the original
    images include RGB coefficients in the range of 0-255, but such values would be
    too high for the model to handle (given a normal learning rate), we scale using
    a 1./255 factor to target values between 0 and 1.


    Secondly, shear-range = 0.2, which shears the image by 20% and we added zoom-range
    = 0.2, which implies 20% zoom-in and zoom-out. Further, color mode = “grayscale”
    converts the input image to a grayscale image of 64x64 pixels. As (Kachuee et
    al., 2018) transformed ECG waveforms from raw ECG signals to coloured images,
    we have to convert RGB (coloured images) to grayscale images for the CNN model''s
    input (Hiran, K. K., et al., 2013), as colour is not a significant feature in
    distinguishing arrhythmia kinds from the images in this work.


    ImageDataGenerator also has the advantage of utilising less memory. This is because
    we would load all of the images at once if we didn’t utilise this class. However,
    when we use it, we load the images in batches, saving a significant memory space.
    When trained on new, slightly changed images, the model becomes more resilient.


    # Model Architecture


    Deep learning (Deng et al., 2013) is a relatively recent method in the domain
    of artificial intelligence and pattern identification that has quickly proved
    popular. A novel approach for identifying six different forms of ECG signal arrhythmias
    is created in this work. Our proposed CNN model comprises of three convolutional,
    two pooling, a flatten and two dense layers as shown in Figure 7, to automatically
    classify the arrhythmia into six different categories using the MITBIH and PTB'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'arrhythmia diagnostic records. The ECG dataset used includes labels that identify
    the type of arrhythmia. Expert cardiologists are the ones who assign these labels.
    The weights of the model are statistically initialised with kernel initializers.
    This will create and distribute the weights, and it may be used as a starting
    point. The extracted beats are utilised as inputs, as indicated in Section 4.1.
    All convolution layers use 2-D convolution and contain 32 kernels of size 3 with
    kernel initializer = ‘he-uniform,’ where he-uniform is a variance scaling initializer,
    which selects values from the range of [-limit, limit], where limit equals sqrt(6/fan-in),
    and fan-in is the weight tensor’s input unit count. As we are working with ReLU
    activation function he-uniform performs better with ReLU activation function as
    compared to other kernel-initializers i.e., Glorot/Xavier initializer etc. (“LWI,”
    2021). All the three convolution layers and the second last fully-connected layer
    uses ReLU activation function. ReLU is used in our model as it is more computationally
    efficient as compared to sigmoid and tanh functions because it only activates
    a limited number of neurons and sets all negative values to zero.


    # Figure 7. Architecture of proposed approach.


    ![](img/0e5ed5b85e46b41ac1e84d52eda7fb86_182_0.png)


    In addition, we employ max pooling layers of size 2 and stride 2. Finally, the
    last convolution layer is used to represent the input beats. For classification,
    this representation is fed into a network of two fully linked layers with 100
    and 6 neurons on each layer. As it performs multi-class classification, the final
    fully linked layer employs the Softmax activation function.'
  merge: -1
  img_proc: true
- pgno: 183
  md: 'By adjusting the optimizer and learning rate, the model''s training phases
    may be enhanced. Therefore, We used a 0.01 learning rate and optimised with SGD
    (Stochastic Gradient Optimizer) with momentum value equal to 0.9. Further, Early
    Stopping technique used to prevent over-fitting of the model. An in-depth look
    of proposed architecture is given in Table 1.


    # Table 1. An in-depth look of the proposed approach.


    | Layer | Type | Activation Function | Output Shapes | No. of Filters | Parameters
    |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | 0 | Input | - | 64x64x1 | - | - |

    | 1 | Convolution (Conv2D) | ReLU | 62x62x32 | 32 | 320 |

    | 2 | Max-pooling | - | 31x31x32 | - | 0 |

    | 3 | Convolution (Conv2D) | ReLU | 29x29x64 | 64 | 18496 |

    | 4 | Convolution (Conv2D) | ReLU | 27x27x64 | 64 | 36928 |

    | 5 | Max-pooling | - | 13x13x64 | - | 0 |

    | 6 | Flatten | - | 10816 | - | 0 |

    | 7 | Fully-connected | ReLU | 100 | 100 | 1081700 |

    | 8 | Fully-connected | Softmax | 6 | 6 | 606 |


    # Activation Function (AF)


    Our model employs the ReLU activation function in three convolution layers and
    one fully-connected layer and Softmax function in the final fully-connected layer
    as indicated in Section 4.3.


    # Softmax Function


    The Softmax function has application in computing the probability distribution
    of a set of real numbers (Goodfellow et al., 2016). The Softmax function generates
    a set of values ranging from 0 to 1, with a probability total of 1. In a multi-class
    model, Softmax algorithm returns the probabilities of each class with highest
    probability value corresponds to target class. Almost all deep learning systems
    employ the Softmax function in their output layers. The two activation function
    Sigmoid and Softmax are used for binary and multivariate classification respectively.'
  merge: -1
  img_proc: true
- pgno: 184
  md: 'The standard Softmax function \(\sigma\): \(\mathbb{R}^K \to [0,1]^K\) is defin
    by following equation:


    \(\sigma(z)_i = \frac{e^{z_i}}{\sum_{j=1}^K e^{z_j}} \text{ for i=1, ..., K and
    } z = (z_1, ..., z_K) \in \mathbb{R}^K\) (1)


    Where z is the input vector.


    # Rectified Linear Unit Function


    Nair and Hinton created rectified linear unit (ReLU) activation function in 2010
    (Nair et al., 2010). In terms of performance and generalisation, it leads the
    Sigmoid and Tanh activation functions in deep learning. As it is a faster learning
    activation function it is the most widely utilised function. The ReLU resembles
    to a linear function, keeping the characteristics of linear models that make gradient-descent
    optimization straightforward.


    y = f(x) = max(0,x) (2)


    Where x represents the input to the ReLU and y is the corresponding output value.


    It removes the vanishing gradient problem occurring in the previous activation
    function by driving the negative input value to zero. Advantage of implementing
    ReLU units is they results in faster calculations as they don''t compute divisions
    or exponentials which improves overall computation performance.


    The ReLU also compresses the values between zero and maximum, resulting in sparsity
    in the hidden units. Because of its simplicity and dependability, ReLU has been
    employed in several architectures.


    # Cost function


    The cost function is used to calculate the difference between the estimated and
    true value of the CNN model''s error (Ullah et al., 2020). The error function
    is minimized using an optimizer function. In neural network theory, various cost
    functions have been used. We employed the cross-entropy function using the equation
    as follows:


    C = - \frac{1}{n} \sum_{i=1}^{y} (y_i * ln(a_i) + (1-y_i) * ln(1-a_i)) (3)'
  merge: -1
  img_proc: true
- pgno: 185
  md: 'Where C, y, N, c, a, and n denotes the cost to be reduced, target value, total
    number of classes, class index, actual value, and number of training points respectively.


    The findings are optimised using a gradient descent approach. In our model, we
    make use of SGD optimizer with 0.9 momentum and 0.01 learning rate. SGD updates
    the parameters (weights) of each layer using the computed gradient after passing
    one training sample through the neural network at a time. As a result, a single
    training sample is sent through the network at a time, and the loss associated
    with it is calculated. Following each training sample, the parameters of all the
    network layers are updated. As the network only processes one training sample,
    it is easier to memorise. It is computationally fast as only one sample is processed
    at a time. Equation is given by:


    ```

    w = w - \eta \nabla Q(w) = w - \frac{\eta}{n} \sum_{i=1}^{n} \nabla Q_i(w)

    ```


    Where


    ```

    Q(w) = \frac{1}{n} \sum_{i=1}^{n} Q_i(w)

    ```


    Where \eta is the learning rate, Q is a loss function and w is the network parameter.


    In comparison to similar methods like Batch Gradient Descent and Mini Batch Gradient
    Descent, it can converge faster for bigger datasets since it causes more frequent
    parameter updates (Bottou et al., 2012).


    # Early Stopping (Ying, 2019)


    This technique is used to prevent the “learning speed slowdown” problem. Because
    of noise-learning, algorithm accuracy stops increasing or worsens beyond a certain
    point.


    As a result, the goal is to determine the precise point at which training should
    be discontinued. We were able to get the ideal balance of under-fitting and over-fitting
    in this manner. The learning process for artificial neural networks aims to identify
    the ideal weights and biases. Learning process and learning speed of neurons depends
    on values of the partial derivatives of the cost function i.e., \frac{\partial
    C}{\partial w} and \frac{\partial C}{\partial b} as described below in equation
    6 and 7


    respectively:'
  merge: -1
  img_proc: true
- pgno: 186
  md: '```

    \frac{\partial C}{\partial W_j} = \frac{1}{n} \sum_{x_j} X_j (\sigma(z) - y)

    ```


    Where C is the cost, W_j is the jth weight, Xj is the jth input, b is the bias,
    a is output when inputs values are 1 and y is the output (Ying, 2019).


    # Dataset Details


    ECG image signals derived from publicly accessible MIT-BIH arrhythmia (Moody &
    Mark, 2001) and PTB diagnostic (Kachuee et al., 2018) datasets. The MIT-BIH arrhythmia
    dataset has 48 records, each lasting around 30 minutes from ambulatory ECG records
    obtained between 1975 and 1979 on two channels. 23 records were chosen at random
    from a set of 4000 24-hour ambulatory ECG recordings with indoor patients accounting
    for 60% and outdoor patients accounting for 40%.


    Remaining twenty-five recordings were selected from a similar collection. The
    selected ECG recordings were digitised at 360 samples per second with an 11-bit
    resolution over a 10mV range for each channel. Two or more cardiologists independently
    analysed each record, providing relevant solutions to the concerns in order to
    provide a computer-readable result. In addition, this dataset contains approximately
    110,000 explanations.


    The PTB Diagnostics dataset contains ECG records from 290 people, with 148 of
    them having been diagnosed with MI, 52 with a healthy heart, and the remaining
    with seven other diseases. ECG signals from 12 leads were captured at 1000Hz in
    each record.


    The dataset contains six types of ECG signals; namely, normal beats (N), ventricular
    ectopic beats (V), fusion beats (F), unclassified beats (Q), supraventricular
    ectopic beats (S), and myocardial infarction (M). Table 2, shows a breakdown of
    ECG beats.'
