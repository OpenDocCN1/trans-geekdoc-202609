    data is not studied. S. S. Udmale. et al proposed application of ELMs using the
    features

    extracted through spectral kurtosis of vibration signals (S. S. Udmale, 2019).
    The

    hyperparameter tuning of hidden nodes is done by modified bidirectional search,

    which is the main reason for the development of more concise ELM for bearing

    fault classification. This method offers the scope for analysis of more evolutionary

    algorithms for fault classification.


    Literature reveals that implementing CPS based frameworks that integrate sensors,

    actuators and intelligence in predictive maintenance has a long history. Though
    it is

    very evident that the benefits of CPS based solutions outweigh the challenges,
    it is

    quintessential to develop a comprehensive framework that could be readily deployed

    in real world industrial scenarios.


    # PROGNOSTICS AND HEALTH MANAGEMENT TRIANGLE


    CPS technology is actually a complex amalgamation of heterogeneous active and

    passive elements that are capable of defining the dynamic environment. The CPS

    needs to adapt autonomously to the changing environment in both internal and external

    aspects. The failures, faults and threats need to be diagnosed and recovery actions

    must be scheduled to avoid catastrophic disasters. Building CPS based Prognostics

    and Health Management (PHM) frameworks must inherently inculcate resilience as

    a vital element. The pivotal elements in CPS are sensors, actuators and intelligent

    elements. This can be perceived as instilling smartness or intelligent elements
    in a'
  merge: -1
  img_proc: true
- pgno: 280
  md: 'mechatronics system. A very primitive architecture that uses a legacy network
    to transfer data is shown in Figure 5. The sensors and actuators are connected
    through a legacy network, which already exists in the industry.


    # Figure 5. Primitive CPS connected through legacy network


    ![](img/0e5ed5b85e46b41ac1e84d52eda7fb86_280_0.png)


    The PHM focuses on degradation of equipment due to fatigue, erosion, wear and
    tear to manage the maintenance activities by assessing equipment health. The advancements
    in PHM has triggered the industry to shift its focus to predict the Remaining
    Useful Life (RUL) of the equipment from the run-to-failure data. RUL of any component
    is the time duration during which it gives its maximum performance (Shankar Sankararaman,
    2015) . RUL prediction plays a key role in planning maintenance activity and mitigating
    the negative effects of faults with complete cause and effect analysis. Though
    there are various strategies for predictive maintenance under the umbrella of
    PHM such as analytical models and physical models, data driven models take precedence
    over the others (Okoh, 2014) . The real challenge confronted by the PHM domain
    is the availability of run to failure data, which is very scarce. The PHM in industries
    is realizable in two flavors:


    +   • Prognostics, which is the prediction process that models the degradation
    rate by assessing the present health status for prognosis of future health. This
    also includes estimation of risks'
  merge: -1
  img_proc: true
- pgno: 281
  md: '+   Health management, which is scheduling maintenance activities and recovery
    actions based on the prognostic results.


    The definition of prognostics presented by the International Organization for
    Standardization states that the prognosis process in any domain is the actual
    estimation of risk along with time to failure in one or more fault modes (Tobon-Mejia,
    2012). Figure 6 shows a detailed view of the processes happening under the canopy
    of PHM.


    # Figure 6. PHM Process in industry


    ![](img/0e5ed5b85e46b41ac1e84d52eda7fb86_281_0.png)


    The PHM process envelopes a series of activities that can be grouped under three
    main categories namely data collection, intelligent decision making and interactions
    with the outside world. The connectivity between these entities is brought about
    by recent communication protocols depending on the industrial requirements and
    standards. The PHM triangle is quintessential to understand the magnitude of activities
    that is involved in the success of predictive maintenance. Also, the expertise
    and other associated resources that are required to implant PHM strategy in any
    industrial sector, can be planned and organized from the PHM triangle.


    # BUSINESS PROCESSES IN IMPLANTING CPS BASED PHM


    All the changes incorporated in the industries has a long lineage of business
    processes and high-level decisions taken by top management. Determining the right
    time and'
  merge: -1
  img_proc: true
- pgno: 282
  md: 'right context to introduce PHM in smart manufacturing is very crucial for advanced
    health monitoring. The considerations and rationale in framing best practices
    in industrial maintenance demands a strategic business purpose to reduce, access
    and tract the faults. The domain of PHM uncovers the errors and faults even in
    smaller subsystems, thus enhancing the performance of the entire manufacturing
    process in terms of Overall Equipment Effectiveness (OEE). This term is a gold
    standard and distinct business metric that is set by the manufacturing industries
    to improve productivity. This metric plays a significant role in isolating losses
    and tracking the progress of faults. This OEE is governed by three factors namely
    availability (A), performance (P) and quality (Q). The computation of OEE is done
    according to Equation 1. This forms a benchmark in estimating the equipment''s
    reliability in operation to achieve the desired quality metrics.


    OEE=A x P x Q


    This metric is a gold standard for assessing the lifetime and performance of the
    maintenance tool process or strategy. The cost benefit analysis of the equipment''s
    performance and maintenance measures can be carried out based on the OEE. Incorporating
    PHM into manufacturing involves decisions taken at various managerial levels.
    These strategic decisions mainly focus on:


    +   • Isolating the areas with room for improvement in terms of OEE

    +   • Delineating operational profiles and mapping them to costs, environment
    and safety considerations

    +   • Establishing benchmarks for maintenance practices

    +   • Deploying cost effective condition monitoring strategies

    +   • Drafting top management level maintenance policies


    # Business Processes in PHM Based CPS


    Major changes in the manufacturing industries happen by collaborative effort made
    by top level management and the skilled workforce. Realizing PHM in industries
    involves two main phases namely conception phase, which mostly involves top and
    middle level management personnel. They are responsible for making strategic decisions
    in the maintenance context. The decision making process is iterative and the decisions
    are assessed based on the room for optimization and cost benefits. These decisions
    are accomplished in real time scenarios by the skilled workforce which comprises
    maintenance engineers. Figure 7 gives a detailed overview.'
