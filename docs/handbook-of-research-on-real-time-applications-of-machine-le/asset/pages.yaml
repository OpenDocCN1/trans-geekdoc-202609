    # RELATED WORK


    The ECG signals are produced by the human heart''s potential difference. It additionally
    carries noise and baseline float which have to be removed with the aid of using
    smoothing and baseline elimination (Caroubalos et al., 1988). Various functions
    (inclusive of QRS interval, RR interval, and Beats in step with minutes) from
    the ECG sign are extracted to categorise diverse arrhythmias with the aid of feature
    extraction strategies inclusive of Principal Component Analysis (PCA) (Caroubalos
    et al., 1988) and Discrete Wavelet Transform (DWT) (Caroubalos et al., 1988).
    DWT computes the spectral power of the sign, and generates functions and PCA is
    used to suppress the undesirable functions. Machine learning algorithms are used
    to categorise the features after they have been extracted. Various classifiers
    inclusive of Support Vector Machine (SVM), Least Square Support Vector Machine
    (LS-SVM), Convolutional Neural Network (CNN), Artificial Neural Network (ANN),
    Recurring Neural Network (RNN) have been applied for the classification.'
  merge: -1
  img_proc: true
