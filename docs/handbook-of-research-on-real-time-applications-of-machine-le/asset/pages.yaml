  md: '# Configuration


    The configuration become an important and worthy tool in managing and deploying

    the systems as machine can amend their operation based on the malfunctions and

    workloads (Altbach, P. G., 1993).


    # In Water Distribution and Management Systems


    As far as water distributed systems are concerned Cyber-Physical System is worthy

    and increasing rapidly. In some of the things it is worthy such as reservoirs,
    tanks,

    pumps, well, pipes, water tanks etc. Cyber-Physical System is helpful in monitoring

    activity viz. sensors for detecting the water level, overflow level, pressure
    of the

    water from the pipeline. Moreover the programmable logic controls can automatically

    open valves, supervision, etc. (Kim, K. D., & Kumar, P. R., 2013; Sanislav, T.,
    &

    Miclea, L., 2012)


    # In Agricultural and Promoting Smarter Greenhouse Systems


    Cyber-Physical System or CPS is important in enhancing the agriculture systems

    and it improves the advanced productivity and prevents starvation. And the CPS

    here is important in healthy temperature, humidity, irrigation system bringing.
    Here

    specific computer programs can be used supported by the CPS that may be ensuring

    better growth and these are helping in greenhouse. Here the feedback and similar

    systems can be managed using network service using the sensors to collect the

    data on temperature and humidity, soil moisture as well as light sensors. Therefore,

    Cyber-Physical System is beneficial in the following—


    +   • To save the money of the farmers and agriculturist including time and effort.

    +   • To offer healthy and better environment including the productivity.

    +   • To control and supply automated water and allied logistics (Paul, P.K.,
    2017b;

    +   Sedjelmaci, H., 2020).


    # In Health Care and Medical Systems


    Cyber-Physical System is basically useful in concerned and different kind of medical

    and healthcare systems viz. in collecting real time data including in monitoring
    the

    patient. Moreover CPS is helpful in gathering data by remote sensing systems and

    also physical conditions which helps to the patients. Therefore it improves and
    helps

    in enhancing healthy and improved treatments for the general patient including
    for

    the disabled and elderly patients. As such system will deal with the network closed'
