    # In Smarter Transportation


    As far as advanced and smarter communication is concerned Cyber-Physical System
    is important in collecting real time information of different traffic and transportation
    related affairs such as traffic systems, location management, and therefore CPS
    here worthy in the following—


    +   * Location and Time Management

    +   * In preventing accident and improving the safety.

    +   * In reduction of the carbon emission also indirectly Cyber-Physical System
    is worthy.


    The developing countries along with the developed countries are now moving towards
    advanced and intelligent Cyber-Physical System (CPS) in the transportation systems.


    # In Buildings


    Regarding the building management and allied construction related activities as
    well Cyber-Physical System is important. In smart building developing and advancing
    CPS is important and this is helpful in improving energy efficiency and also in
    decreasing energy consumption and that ultimately greenhouse gas emissions. Here
    Cyber-Physical System is helpful in gathering data related to the temperature,
    humidity etc. (Baheti, R., & Gill, H., 2011; Serpanos, D., 2018).


    # In Aeronautic Applications


    The applications and utilizations of the Cyber-Physical System in aeronautics
    and allied activities can be considered as valuable and among the applications
    few important are flight test instrumentation, pilot crew communications, healthy
    and structured healthcare monitoring. Moreover in flight related entertainment,
    wireless cabin systems, landing of the flights etc. too Cyber-Physical System
    is important and increasing rapidly.'
