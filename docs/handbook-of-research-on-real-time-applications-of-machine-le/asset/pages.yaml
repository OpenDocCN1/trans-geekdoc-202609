    # Table 1. Levels of Automation


    | Level | Name of the Level | Explanation |

    |---|---|---|

    | 0 | No Automation | The driver is solely responsible for the vehicle’s control,
    including steering, braking, accelerating, and slowing down. Backup cameras, blind-spot
    alerts, and collision warnings are all available on Level 0 cars. |

    | 1 | Driver Assistance | The automated systems start to take control of the vehicle
    in specific situations but do not fully take over. An example of Level 1 automation
    is adaptive cruise control, which controls acceleration and braking, typically
    in highway driving. |

    | 2 | Partial Automation | Because of its increased awareness of its environment,
    the vehicle can execute more complicated activities that combine steering (lateral
    control) with accelerating and braking (longitudinal control). |

    | 3 | Conditional Automation | Drivers can detach from the task of driving in
    certain circumstances. Certain vehicle speeds, road types, and weather circumstances
    may be restricted. Nevertheless, the driver is expected to take over when the
    system requests it. |

    | 4 | High Automation | The autonomous driving system of the vehicle is completely
    capable of monitoring the driving environment and performing all driving operations
    for routine routes and circumstances described within its operational design scope
    (ODD). If there is an environmental situation that demands human management, such
    as thick snow, the vehicle may notify the driver that it is approaching its operating
    limits. If the driver does not reply, the car will be automatically secured. |

    | 5 | Full Automation | Vehicles are completely self-contained. There is no requirement
    for a driver to be present behind the wheel. In fact, Level 5 cars may lack a
    steering wheel as well as gas and brake pedals. Passengers in Level 5 cars may
    be able to use voice commands to select a location or control interior settings
    such as temperature and media selection. |'
