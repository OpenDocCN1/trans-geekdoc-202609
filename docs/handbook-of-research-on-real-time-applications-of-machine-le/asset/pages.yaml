    activities it includes the self monitoring of the operations and productions including
    control. The manufacturing process become easy with Cyber-Physical System applications,
    it is due to the possible data sharing between machines, supply chain, suppliers,
    customers, middle mans etc. In smart manufacturing Cyber-Physical System is important
    in supply chain management and ultimately it helps in traceability and security
    of goods. The applications of the IoT (Internet of Things) and Big Data Analytics/
    Management are important in healthy, sophisticated and advanced manufacturing
    systems. Here sensors are basically predicted with the equipment wear and diagnose
    faults and hence here ultimately it is the reason for less maintenance and advanced
    cost and enhancing operation performance (Marwedel, P., et.al., 2020; Paul, P.K.,
    et.al., 2017a) [25]. As we know that manufacturing is lies on five level of architecture
    therefore the Cyber-Physical System helps in the following—


    # Connection


    The Cyber-Physical System is helps in building and keeping the connections such
    as machines, tools as well as the products.


    # Conversion


    This is simply the use of the algorithm that covers the data to information and
    here is the role of the Cyber-Physical System (Sadiku, M. N., 2017).


    # Cyber


    The sophisticated manufacturing industry lies on sophisticated and advanced manufacturing
    methods and therefore here deep learning and similar algorithms are play a leading
    role.


    # Cognition


    The potential problem can be indentified while sending data from different devices
    and further it helps in monitoring and diagnoses the potential problems and issue.'
