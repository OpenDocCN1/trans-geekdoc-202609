  \n## 24. 我们如何通过更聪明的习惯共同对抗网络犯罪\n\nARUN VISHWANATH\n\n黑客通过利用我们网络行为中的弱点来获取计算机和网络的访问权限。许多攻击使用简单的钓鱼骗术——黑客发送一封看似来自可信来源的电子邮件，鼓励收件者点击看似无害的链接或附件。点击将启动恶意软件并打开后门，这些后门可用于恶意活动：访问公司网络，或作为虚拟“僵尸”对其他计算机和服务器发动攻击。\n\
  \n没有人能从此类攻击中幸免。包括像 `Apple` 和 `Yahoo` 这样处于技术前沿的公司，它们的安全漏洞最近被利用了。即使是复杂的国家网络也并非万无一；例如，以色列的网络曾被一次钓鱼攻击攻破，当时是一封据称来自以色列内部安全机构\
  \ `Shin Bet` 的邮件，其附带了一个伪造的 `PDF` 附件，让黑客获取了其防御网络的远程访问权限。\n\n为了弄清楚我们为什么会落入黑客的圈阱，我自己亲自尝试，看看哪些类型的攻击是成功的，以及对谁有效。在研究中，我通过向研究对象发送不同类型的垃圾邮件、社交媒体好友请求以及指向伪造网站的链接来模拟真实攻击。然后，我使用多种直接、认知和心理措施，以及非侵入的行为测量来理解个人为何成为此类攻击的受害者。\n\
  \n在多次模拟中显而易见的是，那些技巧性极低的看似简单的攻击，竟然达到了惊人的受害率。作为一个例子，仅仅在钓鱼邮件中加入大学 Logo 和一些品牌标记，就导致近\
  \ 70% 的研究对象中计计上当。最终，我研究的目标是找出如何教导公众在日常生活中遇到此类网络攻击时最好地进行防范。\n\n### 不经思考就点击\n\n我们许多人落入这种圈骗，是因为我们误解了在线操作的风险。我将这些称为我们的网络风险信念；而且我发现，人们的风险信念往往是不准确的。例如，个人错误地将自己无法操作\
  \ `PDF` 文档等同于其固有的安全性，并迅速打开此类附件。类似的错误信念导致个人在移动设备或某些操作系统上草率地打开网页和附件。\n\n加剧这些信念的还有人们的电子邮件和社交媒体习惯。习惯是大脑自动重复执行、可预测行为的方式。随着时间的推移，频繁检查电子邮件、社交媒体动态和消息变成了一种例行公事。人们不再意识到自己是在何时（有时又是为何）执行这些操作的。因此，当进入状态时，人们往往在没有经过太多深思的情况下就点击链接或打开附件。事实上，我发现某些\
  \ `Facebook` 习惯——例如反复查看新闻动态、频繁发布状态更新，以及维持庞大的 `Facebook` 好人网络——是预测他们是否会接受陌生人的好友请求以及是否会向该陌生人透露个人信息的最大指标。\n\
  \n这种习惯性反应被我们大多数人使用的智能手机和平板电脑进一步催化。这些设备通过小组件、应用程序和推送通知促使人们做出快速且反应性的响应。不仅智能手机屏幕尺寸和压缩的应用布局减少了可见的详细信息量，而且我们许多人在途中也会使用此类设备，这种分心会进一步削弱我们检测欺骗性邮件的能力。\n\
  \n这些自动化的网络惯例和反应性响应在我看来，是为什么目前培训人们警惕可疑邮件的方法在很大程度上不起作用的原因。改变人们的媒体习惯是降低网络攻击成功的关键——其中也包含了我们所有人提供帮助的机会。\n\
  \n### 利用习惯对抗网络犯罪\n\n新兴研究表明，纠正习惯的最佳方法是将其替换为另一种，即作家查尔斯·杜比格（Charles Duhigg）所谓的“核心习惯”（Keystone\
  \ Habit）。这是一种可以替换现有模式的简单积极行动。例如，想要减肥的人被要求：运动、减少糖分摄入、阅读食品标签和计算热量。持续完成这些许多挑战性任务是令人生畏的，人们往往由于压力太大而不敢开始。许多人发现，如果专注于一个关键的可行行动，例如每天步行半英里，会获得更大的成功。重复完成这个简单的目标感觉良好，能建立信心并鼓励更多的认知评估——这些过程会迅速滚雪产生巨大的变化。\n\
  \n我们可以应用同样的原理来改进网络安全，将报告可疑邮件成为一种核心习惯。毕竟，许多人都会收到此类邮件。有些人不经意地落了，而许多产生怀疑的人并没有。显然，如果我们有更多的人报告自己的怀疑，就能在许多违规行为扩散之前发现并中和它们。我们可以将点击可疑内容的冲动转化为一种新习惯：报告可疑邮件。\n\
  \n我们需要一个集中的国家级处理中心——可能是一个类似于 `911` 紧急系统的电子邮件地址或电话号码——任何对网络威胁产生怀疑的人都可以快速轻松地进行报告。这些信息可以在地区进行汇总并在中央进行追踪，就像卫生部门追踪公共卫生和疾病爆发的方式一样。\n\
  \n\n\n\n\n当然，我们还需要让报告可疑的网络入侵行为变得具有成就感，让人们感到有参与感并获得回报。与其像许多对抗网络威胁的机构那样简单地收集电子邮件，不如让提交的内容由一个中心化的网络安全团队进行审核，该团队在解决威胁的同时，还会公布某人的报告如何帮助挫败了攻击。报告网络入侵可以变得简单、有趣，并成为我们所有人都能做的事情。更重要的是，习惯性报告怀疑对象的行为本身，久而久之可能会提高我们所有人的网络安全意识。\n\
  \n*最初发表于 Arun Vishwanath 的文章“How We Can Each Fight Cybercrime with Smarter Habits,”\
  \ *The Conversation*, 2015 年 1 月 26 日. 经经许可转印。*\n\n## 25. 在线安全的简单步骤\n\nALAN SHARK\n\
  \n10 月被定为网络安全意识月，美国国土安全部发布了一系列五个每周主题。在这一周的“在线安全简单步骤”的主题中，全美县级协会（NACo）与公共技术研究所（PTI）合作，开发了一系列专门针对公共管理者的实用清单和评论。\n\
  \n网络安全泄露事件去年增长了约 26%，勒索软件攻击持续上升。地方政府一直是极具吸引力的目标，因为它们收集并存储了如此大量的个人信息。随着移动设备和社交媒体应用的增加，作恶的入口比以往任何时候都多。\n\
  \n根据 Egress Software Technologies 的研究，地方政府的大多数数据泄露事件是由人为错误造成的。人们可以采取一些非常简单直接的步骤来保护自己，因为网络安全意识大多数始于个人。重要的是记住，还有另一群人在观察着我们——我们的员工。我们必须通过自己遵守关键最佳实践来树立榜样。如果我们自己都免除，绝不能指望员工能遵守最佳实践来缓解网络威胁。在这里，我们必须以身作则。\n\
  \n> • **密码仍然很重要**。使用不同的密码，且应包含至少 8 个字符，并数字和符号。尝试想出一个你也能记住的公式。例如，你可以使用一个旧地址作为开头，或将字母替换为数字或符号。密码不应以大写字母开头，下划线是分隔一组数字的好方法。\n\
  \n> • **使用多个密码**。通过为不同的账户使用多个密码，你可以分散风险，防止一个账户的泄露导致你在所有有登录账户的地方都暴露。密码太多记不住？考虑使用诸如\
  \ LastPass 或 Dashlane 这样的“密码管理器”。大多数工具都提供可以尝试的免费版本。虽然这些系统需要复杂的主密码，但密码管理器会完成其余工作。你可以选择让它们分配复杂的随机密码，大多数工具都具有自动填充功能，可以自动填写必要的字段。另一个优势是，如果你选择需要，大多数密码管理器会在你的所有设备上记住并调回密码和支付信息。这包括电脑、笔记本电脑以及你所有的移动设备。\n\
  \n> • **点击前先思考**。勒索软件和钓鱼攻击在过去两年急剧增加。这些攻击中的许多可以追溯到员工点击并打开附件。在打开附件之前，你确定它确实来自他们所称的个人或实体吗？你是否看到了可疑的迹象，如拼写错误、使用“亲爱的客户”而不是你的名字作为称呼、返回\
  \ URL/地址与发件者不同？例如，如果你收到似乎来自你的银行的邮件，URL 是将你带到银行，还是将你引向其他地方？无论这些邮件看起来多么真实，最好不要点击此类邮件。相反，直接访问公司网站查看是否有任何你需要解决的实际问题。最后，如果有疑问，始终联系你的\
  \ IT 人员，他们有办法在不危及他的情况下检查真实性。\n\n> • **限制通讯录条目**。令人震惊的是，竟然有这么多专业使用移动设备的通讯录存储信用卡号、密码、家庭社会安全号码和生日。尽管这很诱人，但不要将你的移动设备目录作为你的个人信息数据库！大多数网络泄露都会攻击你的通讯录，是的，这些恶意软件程序被设计为在搜索所有联系人的之外搜索这类信息。记住，坏人的目标是利用他们可以获取的每一个信息，并用它造成进一步的破坏，可能导致身份盗窃、使用密码进入系统以获取可能更重要的信息。\n\
  \n> • **更新你的设备**。计算机和移动设备制造商定期更新其操作系统，以提高性能并积极解决已知的安全漏洞。不言而喻，确保你不仅拥有最好的病毒和恶意软件防护——而且是实时更新以获得最大的保护。\n\
  \n> • **避免公共 Wi-Fi**。对于经常奔波的人来说，每看到 Wi-Fi 热点就想连接总是很有诱惑力的。机场、火车、咖啡馆、酒店和会议中心有大量的选择。不幸的是，公共\
  \ Wi-Fi（无论是否免费）很容易被坏人利用，他们不需要费太大力气就能“看到”你正在登录的内容，并获取你的密码。永远不要在提供需要密码的公共 Wi-Fi 地进行业务，这可能包括登录你的办公室或银行。考虑使用所有无线运营商提供的自助移动热点。尽管你仍然通过\
  \ Wi-Fi 连接，但窥探起来要困难得多，而且数据通常经过了加密，并最终转换为更安全的手机频率。\n\n### 职场网络安全是每个人的事\n\n10 月被定为网络安全意识月，美国国土安全部发布了一系列五个每周主题。本周的主题是“职场网络安全是每个人的事”。NACo\
  \ 与与公共技术研究所（PTI）合作开发了一系列为县级领导创建的实用清单和评论。\n\n在第一周（刊于 10 月 3 日出版的 *CN Now*），我们关注的是个人可以做什么来提高安全性。本周我们关注关注组织可以和必须做什么。\n\
  \n许多县要求网络安全意识培训，而另一些则提供可选培训。我们的经验显示，许多计划是不够的，原因如下，包括：\n\n> 培训每年只需要一次。\n\n\n\n\n\n\
  -   培训可能技术性过强。\n-   培训可能会让某些员工感到害怕，并营造怨恨或恐惧惩罚的环境。\n-   培训可能缺乏现实案例，且往往过时。\n\n虽然数字基础设施的大部分实际保护工作由技术专家负责，但县级选举领导人可以也应该扮演两个至关重要的角色。第一个是公职人员要做出良好的表率。这意味着要遵守规则，例如设置和更改复杂密码。\n\
  \n第二个角色是确保网络环境的安全与可靠。其中的关键部分是建立一个稳健的网络安全意识计划。今天在线或面对提供的许多计划在质量和方法上参不相同。许多公职人员问，我应该关注什么？一个健全的网络安全意识计划包含哪些元素？以下是一份供参考的列表：\n\
  \n-   指定一名高级职员负责。此人可以是首席信息官、首席信息安全官或其他兼具技术能力且以人人为本的指定人员。高级管理人员或人力资源专业人士也可以担任这一角色。\n\
  -   最好的计划是持续性的，而不仅仅是每年一次、几个小时的培训活动。\n-   实践计划中的要素并进行演练，以确保每个人都理解并遵守。\n-   确保对于疏忽行为有明确的后果，具体取决于违规的严重程度。\n\
  -   在确保遵守既定政策和程序的同时，你还希望确保营造一个积极的氛围，鼓励员工在认为自己可能遇到某些问题时立即报告。事实上，对于任何不立即报告事件的人都应该产生后果。\n\
  -   开展定期的、针对性的会议，旨在探索各种类型的网络攻击。这将有助于展示组织对维护系统安全的承诺，并让该话题处于员工关注的核心。\n-   考虑通过角色扮演来帮助演示犯罪分子如何利用电话或社交媒体操纵员工提供宝贵数据，导致这些数据落入不法之手。\n\
  -   应培训员工识别攻击；不仅要知道攻击长什么样，还要知道给谁打电话以及何时报告攻击。\n-   始终鼓励员工主动反映任何觉得看起来不对或感觉不对劲的情况。曾有许多案例，警觉的员工在事件发生过程中报告了情况，结果成功地减少了损害和损失。\n\
  -   总的来说，培训必须具有相关性且应该是有趣的——就像像玩侦探游戏或在视频游戏中守护“宫殿”一样。\n\n有许多数字渠道可以寻求更多信息和帮助。\n\n在\
  \ `www.countynews.org` 在线查看这篇文章可以获得一些非常有用的资源。其中一些技术性较强——如果你觉得有用，只需将其转给你的技术人员——这显示了你的关注。记住，网络安全意识的关键在于意识。\n\
  \n最后，确保你的组织是 `MS-ISAC` 的成员，它是 NACo 和 PTI 的合作伙伴；会员是免费的，并由国土安全部（DHS）资助。\n\n*最初发表于\
  \ Alan Shark，“在线安全的简单步骤”，《NACo County News》*，2017 年 10 月 3 日和 16 日。经出版者许可转载。*\n\n\
  ## 26. 在社交网络网站上保持安全\n\n美国计算机应急准备小组\n\n### 什么是社交网络网站？\n\n社交网络网站有时被称为“朋友的朋友”网站，它们建立在传统社交网络的概念之上，你通过已经认识的人结识新的人。某些网络网站的目的可能纯粹是为了社交，允许用户建立友谊或浪漫关系，而另一些网站则可能侧重于建立业务联系。\n\
  \n尽管社交网络网站的功能各异，但它们都允许你提供自己的信息，并提供某种通信机制（论坛、聊天室、电子邮件、即时通讯工具），让你能够与其他用户建立联系。在某些网站上，你可以根据特定标准浏览人物，而另一些网站则要求你通过共同的联系被“介绍”给新的人。许多网站拥有基于特定兴趣的社区或子小组。\n\
  \n### 这些网站带来了哪些安全影响？\n\n社交网络网站依赖于联系和通信，因此它们鼓励你提供一定量的个人信息。在决定透露多少信息时，人们可能不会像面对面见到某人时那样同样谨慎，因为：\n\
  \n-   互联网提供了一种匿名感\n-   缺乏物理互动提供了虚假的安全感\n-   他们为朋友的阅读定制了信息，忘记了其他人也可能看到\n-   他们想通过提供见解来给潜在的朋友或伙伴留下深刻印象\n\
  \n虽然使用这些网站的大多数人并不构成威胁，但恶意分子可能会因为其易于访问和可用个人信息量大而被吸引。恶意分子掌握的关于你的信息越多，他们就越容易利用你。捕食者可能在在线上建立关系，然后说服毫无防备的个人与他们见面。这可能导致危险的情况。个人信息还可用于进行社会工程攻击。利用你提供的关于位置、爱好、兴趣和朋友的信息，恶意分子可以冒充成信赖的朋友，或说服你他们有权访问其他个人或财务数据。\n\
  \n此外，由于这些网站的流行，攻击者可能会利用它们分发恶意代码。提供第三方开发的应用程序的网站特别容易受到攻击。攻击者可能创建看似无害的定制应用程序，同时在感染你的电脑或在你的不知情的情况下共享你的信息。\n\
  \n### 你可以如何保护自己？\n\n-   限制你发布的个人信息量——不要发布会让你变得脆弱的信息，例如你的地址或关于你的日程或日常习惯的信息。如果你的联系人发布了关于你的信息，请确保整合后的信息不超过你愿意让陌生人知道的范围。在发布关于联系人的信息（包括照片）时也要考虑到他人。\n\
  -   记住互联网是一个公共资源——只发布你乐意任何人看到的信息。这包括个人资料中以及博客和其他论坛中的信息和照片。此外，一旦你在网上发布了信息，你就无法撤回。即使你从网站上删除了信息，保存或缓存的版本可能仍然存在他人的机器上。\n\
  -   警惕陌生人——互联网让人们伪造身份和动机变得容易。考虑限制允许在这些网站上联系你的人。如果你与你不认识的人互动，对于你透露的信息量或同意与他们见面要保持谨慎。\n\
  -   保持怀疑态度——不要相信你在网上读到的所有内容。人们可能会就各种的话题（包括他们自己的身份）发布虚假或误导性信息。这并非出于恶意；可能是无意的、夸张的或玩笑。尽管如此，要采取适当的预防措施，并在采取任何行动之前尝试验证任何信息的真实性。\n\
  \n\n\n\n\n-   评估您的设置——利用网站的隐私设置。某些网站的默认设置可能允许任何人查看您的资料，但您可以自定义设置，将访问权限限制为某些特定人员。尽管有这些限制，隐私信息仍有泄露的风险，因此不要发布任何你不希望公众看到的内容。网站可能会定期更改选项，因此请定期检查您的安全和隐私设置，以确保您的选择仍然合适。\n\
  -   警惕第三方应用程序——第三方应用程序可能提供娱乐或功能，但在决定启用哪些应用程序时要谨慎。避免使用看起来可疑的应用，并修改您的设置以限制应用程序可以访问的信息量。\n\
  -   使用强密码——使用不易被破解的密码来保护您的账户。如果您的密码泄露，其他人可能会访问您的账户并冒充您的身份。\n-   检查隐私政策——某些网站可能会与其他公司共享电子邮件地址或用户偏好等信息。这可能导致垃圾邮件增加。此外，请尝试查找处理推荐的政策，以确保您不会无意中让您的朋友订阅垃圾邮件。某些网站会继续向您推荐的任何人发送电子邮件，直到他们加入。\n\
  -   保持软件（特别是您的网络浏览器）更新更新——安装软件更新，以防攻击者利用已知问题或漏洞。许多操作系统提供自动更新。如果可以使用此选项，您应该启用它。\n\
  -   使用并维护反病毒软件——反病毒软件帮助保护计算机免受已知病毒的侵害，因此您可以在病毒造成任何之前检测并删除它。由于攻击者不断编写新病毒，保持病毒库定义更新至关重要。\n\
  \n儿童特别容易受到社交网络网站带来的威胁。尽管其中许多网站都有年龄限制，但儿童可能会虚报年龄以便加入。通过教导儿童网络安全、关注他们的在线习惯并引导他们访问合适的网站，父母可以确保孩子们成为安全且负责任的用户。\n\
  \n*公共文档，最初发布于美国计算机应急响应小组，““Staying Safe on Social Networking Sites”，`https://www.us-cert.gov/ncas/tips/ST06-003`\
  \ (2015 年 6 月 5 日)。*\n\n# 27 强化您网络安全文化的七个关键\n\nDANIEL J. LOHRMANN\n\n2017 年 8 月\
  \ 17 日（周四）上午，当我在跑步机上跑步时，我正在看 CNBC 的 `Squawk Box`，当时 YUM Brands 联合创始人兼前 CEO David\
  \ Novak 以嘉宾身份了节目。\n\n他被问及如何如此成功地发展出这样一个拥有比萨饼饼、塔可乐、汉堡王等知名品牌的强大全球 YUM Brands 集团。他的回答让我慢下跑步机开始散步，并仔细倾听。\n\
  \n他说了几点，但他清晰的核心信息集中在通过一套核心价值观和员工认可建立伟大的文化。以下是令我印象深刻的内容（转述）：\n\n成功完全取决于文化。优秀的领导者知道你的核心价值观并忠实于它们。你向员工传递了什么信息？你是否在认可和奖励你的员工？\n\
  \n*顺带提一下：David Novak 在去年的这早期文章和视频中进一步阐述了认可主题。他挑战我们所有人更频繁地对员工和生活中的每个人说“谢谢”。他甚至写了这本关于认可十项原则的趣味书籍，书名为\
  \ `O Great One!: A Little Story About the Awesome Power of Recognition`。*\n\n在 `Squawk\
  \ Box` 采访接近尾时，讨论了针对几个全球网络安全问题应采取哪些行动。Becky Quick 询问 Novak，特朗普政府如何应对中国通过计算机黑客攻击窃取我们的知识产权。\n\
  \nNovak 说，我们需要对两国都有效的双赢答案。尽管存在需要艰难谈判的严重问题，但我们在方法上需要积极，同时执行法律并在已有国际共识的领域采取行动。\n\n\
  ## 问题一：回归安全文化\n\n管理大师彼得·德鲁克（Peter Drucker）被认为说过过那句名言：“文化吃掉策略。” 尽管有数百本书和数千篇文章关于建立伟大的工作文化，但关于创建强调职场网络安全的积极企业文化的文章远少于此。\n\
  \n那么，我们如何引导一场既以人为中心、又以安全为中心的数字转型呢？以下是过去几年里，我在互联网上看到的一些常见答案：\n\n-   Tripwire: 3 Tips\
  \ on How to Create a Cyber Security Culture at Work\n-   Huffington Post: 6 Tips\
  \ to Build a Cyber-Security Culture at Work\n-   Security Intelligence: Building\
  \ a Cybersecurity Culture Around Layer 8\n\n多年以来，典型的答案包括：集中关注对所有员工进行有效的安全意识培训，以及需要管理层的支持和业务领导对网络安全的投入。\n\
  \n尽管如此，进一步挖掘一下，在我看来，这是构建能够超越个人安全事件和员工流失的持久安全文化的七个关键。\n\n### 1. 真正的高层优先和支持\n我们都知道，孩子观察（并通常遵循）父母所做什么，而不仅仅是他们说什么。同样，员工也是从高层的行动中学习真正的优先级。经理们是否言行一致？是否有资源支持高层的备忘录？\n\
  \n例如，当我担任密歇根州政府首席安全官（CSO）时，Rick Snyder 州长是州乃至国家网络安全的真正冠军，他在内阁会议上经常讨论网络行动并身作则。如果缺乏这种高层的关注，长期来看将难以成功。考虑这些建议来建立对网络安全的管理支持。\n\
  \n### 2. 诚实的风险评估以衡量当前安全\n目前的安全状况如何？安全审计发现是如何处理的？真正的技术和安全优先级是什么？是否有衡量进展的指标和仪表板？\n\
  \n此外，德勤的这篇优秀文章展示了如何从信念、行为和结果的角度来评估您的文化。\n\n### 3. 对您希望安全文化所在的状态有清晰愿景\n关于网络安全的基准测试和遵循最佳实践的文章有很多。一个重要的问题是，你是否知道自己正向哪里去。您的安全和技术团队对成功的愿景是什么？\n\
  \n考虑访问您的行业同仁，并从其他运作良好的公共和私部门组织中学习。看看国家州首席信息官协会（NASCIO）的获奖者、NGA 的最佳实践以及您所在地区的州和当地合作伙伴。考虑进行公路旅行以向他人学习并进行进度基准比较。\n\
  \n例如，在 2011-2012 年，俄亥俄州的 CIO Stu Davis 带领一个团队来到密歇根州，查看我们是如何构建安全架构和治理的。俄亥俄州政府利用那次访问和随后的对话建立了一个出色的网络安全计划。\n\
  \n### 4. 你有网络计划吗？\n许多州政府已经发布了网络安全计划，清楚地描述了他们的目标、参与者以及对各个小组的预期。示例包括密歇根州、特拉华州、密苏里州、北卡罗来纳州等。\n\
  \n关于这个网络安全规划主题，我们将在接下来的博客中提供更多细节。\n\n\n\n\n\n## 5. 向大众传播清晰的网络安全信息\n太好了，你已经有了计划和具体的行动步骤。但有人知道正在发生什么吗？电梯演讲的内容是什么？这些信息的接收效果如何？沟通是否是双向的？你是否收到了反馈？\n\
  \n传播网络安全信息是一项持续的挑战，在过去的一年中，没有哪个领导做得比弗吉尼亚州州长特里·麦考尔菲（Terry McAuliffe）更好——他在担任国家协会（NGA）领导期间，将网络安全列为首要话题。\n\
  \n## 6. 为所有人提供终端安全意识培训。包括经理、系统管理员和其他特定角色\n如上文多次提到的，文化的改变确实涉及向整个企业提供有趣、相关、更新、及时的培训，且这些培训应该是简短、频繁且重点突出的。\n\
  \n虽然这是安全文化改变中讨论频率最高的领域，但它只是其中的组成部分。尽管如此，这不能仅仅是一项“勾选式”的任务就能成功。在最近对 MicroAgility 首席执行官\
  \ Sajid Khan 的采访中，我更详细地描述了这一有效的网络培训领域。\n\n## 7. 用食物和乐趣庆祝成功。\n了解安全是否是业务基因的一部分？你如何知道人们在参与什么？答案：看他们庆祝什么。他们的食物和家人什么时候出现在颁奖仪式上？\n\
  \n向你的组织提出这个问题：你们在什么时候庆祝成功？假设这确实在发生，人们在安全方面做了正确的事会得到奖励吗？对于出色的网络礼仪是否有奖金，或者做了正确的事是否有奖励？\n\
  \n这里是一些值得深思的具体示例。这里是在安全培训中应避免的文化性错误。\n\n### 结语\n总之，建立健康的安全文化不是一个一次性的项目或期一年的重点。就像在阿拉西巴马大学等学校建立伟大的大学橄榄计划一样，这是一项持续的挑战，必须随着组织的变化不断重复。\n\
  \n关于更多细节，我非常喜欢 ISSA 的系列 CISO 导师演讲，这些演讲为安全领导者提供了来自在不同行业获得成功的 CISO 们提供的许多实用建议。遵循他们的建议是增强你网络安全文化的绝佳方法。\n\
  \n最后，我想用 David Novak 关于今天领导者面临的最大挑战的这段话作为结束。\n\n“美国十名员工中有七名没有参与感。他们去上班，却等不及要回家，”他说。\n\
  \nNovak 说，伟大的公司创造了一个让每个人都受到重视和有价值的环境。\n\n这就是为什么你的企业或政府文化对组织的成功如此关重要的原因。\n\n安全是你文化改变努力的一部分吗？\n\
  \n*最初发表于 Daniel J. Lohrmann，《加强你网络安全文化的七个关键》，政府技术（Government Technology），2017 年\
  \ 8 月 20 日。经出版者许可。*\n\n## 28. 组计算机应急响应小组（CERT）的三个点建议\nKELSEY BREWER\n\n在过去的 10 年里，技术与地方政府职的整合呈指数级增长。随着城市继续将智能技术整合到地方政府的日常功能中，建立针对攻击的强大防御对于维护系统完整性至关重要。\n\
  \n关于地方政府网络安全的讨论大部分集中在从源上避免攻击。正如 2017 年 12 月份的《LGR：地方政府评论》（由 TownCloud 提供支持）中讨论的建议，通常包括进行威胁评估、投资持续监控系统，以及培训员工以避免黑客经常用于操纵其进入敏感系统的社会工程策略。当然，在考虑如何保护敏感信息免受网络攻击时，这些都是非常有价值的投资和步骤。\n\
  \n但是，尽管做了所有完美的计划和预防措施，如果网络攻击成功会发生什么？\n\n美国几乎每个城市都有社区应急响应小组。这些计划帮助志愿者学习灾害响应技能，如火灾安全、搜索与救援以及基础急救，它们的创建是为了应对物理和自然灾害，在这些灾害中，尽管做了最好的准备，紧急情况仍需要快速高效的响应。随着网络攻击变得越来越复杂，经历应急级攻击的可能性也会增加。正如城市应该对物理灾害的应急响应进行投资一样，也应该对数字世界的应急响应进行投资。\n\
  \n微软在其白皮书《开发城市网络安全战略：地方政府七步指南》中介绍了地方政府计算机应急响应小组（Computer CERT）的概念。这些小组由私营部门、政府和学术界的专家组成，旨在在发生网络事件时协助公共响应。计算机\
  \ CERT 利用城市在网络安全前端所投入的资金（威胁评估、持续监控等），并利用从这些领域收集的信息帮助公共和私营部门在紧急情况下做出反应。\n\n城市进行的威胁评估将显示系统内部存在哪些漏洞、攻击者最可能想要什么信息，以及在发生攻击时什么应该构成高优先级，什么应该构成低优先级。\n\
  \n计算机 CERT 然后利用这些信息帮助评估可信的威胁，并在发生攻击时主导引导城市的响应。在加利福尼亚州，洛杉矶市通过他们的“网络入侵指挥中心”体现了计算机\
  \ CERT 的理念。成员定期会面讨论共同威胁和可能的破解方法。但即使是较小的实体也可以采用相同的方法。加利福尼亚州橙县的 OC 情报评估中心有一个专门的团队，其角色不仅是评估网络威胁，还担任事后缓解的领导，协调来自公共部门和私营部门的必要响应。\n\
  \n随着网络攻击变得越来越普遍，普通公众对政府已准备好做出反应的预期只会增加。在过去，声称缺乏经验和不熟悉可能是对网络攻击应急响应乏淡的合理解释。但随着城市及其居民继续将越来越多的技术整合到日常功能中，为不可避免的事件制定计划已变得迫不眉缓。任何非热忱准备的行为都是对潜伏在键盘下的数字灾难的疏忽。\n\
  \n### 组建计算机应急响应小组的三个建议\n\n#### 1. 审慎考虑计算机 CERT 的成员构成\n在组建计算机 CERT 成员时，有几点需要考虑。首先是确保你城市提供或签约的所有关键服务在团队中都有代表。这些小组的代表将确保在讨论如何保护这些服务免受攻击以及在遭到破坏后如何恢复在线时，进行更稳健的对话。城市在开发计算机\
  \ CERT 时还应考虑地理因素。你们是否通过联合权力机构与其他城市共享关键资源？你城市依赖的电网控制中心是否位于另一个管辖区？如果是，这些外部实体应该是你计算机\
  \ CERT 成员的一部分。\n\n#### 2. 创建外部事件分类\n\n\n\n\n让您的计算机应急响应小组（ERT）创建事件分类，以确保资源的快速和恰当流动。这些分类将决定何时宜通知城市发生事件，或者在作为对攻击总体响应的一部分时，城市向外部实体提供资源何时何重要。虽然某些计算机\
  \ ERT 可能关注攻击何时损害了由地方政府控制的功能或资产，但攻击也可能针对非政府控制的资源，从而影响市政当局的运行能力。例如，某些城市没有运营自己的水务，但对当地水路网络的威胁无疑会影响城市的运营能力。将此类攻击分类为计算机\
  \ ERT 的“值得响应”，将有助于必要时简化资源。\n\n### 3. 运行测试演习\n\n与灾备备一样，运行响应系统的测试演习对于评估当前网络攻击响应的有效性至关重要。测试演习应定期进行，并评估计算机\
  \ ERT 的响应以及快速有效地进行内外协调的能力。\n\n*最初发表于 Kelsey Brewer，《形成计算机应急响应小组的三个技巧》，ICMA 博客，国际城市/县管理协会（2008\
  \ 年 1 月 17 日）。经出版者许可转载。*\n\n## 29. 政府需要的网络安全策略\n\nGUS “IRA” HUNT 和 LALIT AHLUWALIA\n\
  \n如果对政府、企业和个人更好地加强防御网络威胁的紧迫性还有任何疑虑，Petya 应该消除这些疑虑。几周前使用该名称勒索软件的攻击造成了全球性的混乱，感染了包括美国在\
  \ 65 多个国家的计算机和网络。\n\nPetya 的爆发在几周后引发了范围更广泛的 WannaCry 勒索软件攻击。这些重大事件证明，保护敏感数据以及利用正确的系统来检测、预防和修复安全漏洞，对许多组织来说仍然是一个挑战。\n\
  \n政府机构的担忧尤为高。作为我们一些最敏感的公民和公共员工数据的守护者，它们是网络攻击的有力目标。根据安哲信对安全高管的一项最新调查，政府组织每年面临数十次针对性的定向攻击，其中三分之一导致了成功的安全破口。\n\
  \n为了加强对我们资产的保护，政府机构必须采取现代、主动、敏捷的策略，帮助他们快速识别和应对数字安全风险。然而，目前还不清楚他们现在多大程度上应用了正确的资源来应对这一挑战。\n\
  \n安哲信最近一份基于美国 150 位政府高管调查的报告显示，大多数机构没有配备足够的技术。只有 13% 的受访者认为他们现有的技术对于应对网络安全漏洞是有效的，只有三分之一的人表示对他们监控、识别和衡量这些漏洞的能力有信心。几乎一半的州和地方政府受访者表示，识别复杂的漏洞可能需要几个月的时间。对于填补空白所需的技术，受访者经常列出的是端点/网络安全（58%）、加密（56%）、威胁情报（54%）和网络威胁分析（51%）。\n\
  \n公共服务组织需要通过采用全面的端到端数字安全方法，将网络防御深度整合到其组织中。作为第一步，机构应对其网络安全能力进行彻底评估，同时对其防御进行“压力测试”，以确定其是否能抵御定向攻击。他们还需要识别并尽可能地减少其网络暴露，并专注于保护重点资产。以下网络安全领域应被视为投资和加强领导关注的重点：\n\
  \n- **治理**：关注问责制以培养网络安全意识的文化，衡量并报告网络安全性能，为员工制定具有吸引力的网络安全激励措施，并建立清晰的网络安全指挥链。领导者需要将网络安全的成功重新定义为不仅仅是实现合规目标。获得适当的可见性和权威对于及时发现应对威胁至关重要。\n\
  - **机构暴露**：评估网络安全事件场景，了解哪些可能对组织产生重大影响。识别关键因素、决策点以及开发修复和转型策略障碍。\n- **战略威胁背景**：推动组织探索特定的网络安全威胁（包括地缘政治风险分析），并识别类似组织正在进行和部署哪些网络安全活动和技术。这些步骤将确保机构的安全计划与其整体战略保持。\n\
  - **网络韧性**：评估组织在面对破坏性网络对手时提供卓越运营的能力，并使用“为韧性设计”的技术来限制攻击的影响。\n- **网络响应就绪**：建立稳健的响应计划，提供有效的网络事件升级路径，并确保所有机构职能都有利益相关者的参与。测试团队成员在危机管理事件期间合作的能力。\n\
  - **投资效率**：开发内部专业知识以驱动智能网络安全投资以及资金和资源的有效配置。将组织的投资与基准、组织目标和网络安全趋势进行比较。资产管理对政府组织来说可能困难，但这是任何安全行动的关键组成部分。\n\
  \n政府机构应该以组织化的思维对待网络安全——一种能够不断进化和适应不断变化的威胁的思维。先进的网络安全不仅需要创新和培训方面的投资，还需要领导者坚定的承诺。\n\
  \n*最初发表于 Gus “Ira” Hunt 和 Lalit Ahluwalia，《政府需要的网络安全策略》，Governing，2017 年 8 月 3 日。经出版者许可转载。*\n\
  \n## 30. 安全专家需要导师\n\n### 原因以及如何做\n\nDANIEL J. LOHRMANN\n\n寻找和留住网络人才是公私部门组织全球关注的焦点。\n\
  \n同时，安全专业人员理解需要建立人脉、从案例研究中学习，并与相似背景或行业的网络安全专家和经验领导者进行更深层次的专业互动。\n\n但在政府，吸引、开发和增强安全专业人员的职业效率已成为一个危机级的挑战。\n\
  \n那么，正在采取哪些措施？新的安全领导者如何增强他们的职业生涯并从先者身上学习？对于可能没有与私营部门同等财务资源的地方和州政府安全专业人士，有哪些替代方案？丰富的\
  \ `CISOs` 和其他领导者如何在回馈社区并留下积极遗产的同时，扩大自己的视野？\n\n简短的回答是：导师制。\n\n具体来说：寻找一位导师。\n\n或者成为一名导师。\n\
  \n或者两者兼顾。\n\n\n\n\n一项优秀的导师计划已在全国州和地方政府中运行了近六年。以下是它能取得如此成功并成为国家级最佳实践的原因，并辅以个人故事展示了其对职业发展和组织管理所带来的巨大益处。\n\
  \n### 多州信息共享与分析中心（MS-ISAC）导师计划背景\n\n我曾写过许多关于积极参与所在行业的信息共享与分析中心（ISAC）的发展及其益处的文章。你可以在此处了解更多关于行业\
  \ ISAC 的信息，特别是关于 `MS-ISAC`，可以参考[此处][此处]和[此处]。\n\n`MS-ISAC` 导师计划始于 2012 年，本文描述了该计划的早期启动情况，目前该计划对参与者仍然免费。*注：政府机构加入\
  \ `MS-ISAC` 也是免费的。*\n\n我与 `MS-ISAC` 的朋友兼长期领导 Mike Aliperti 探讨了当前的导师计划。Mike 是互联网安全中心（CIS）多州信息共享与分析中心（`MS-ISAC`）的利益相关者互动副总裁`CIS`\
  \ 是一家非营利组织，其使命是为国家的州、地方、领地和部落（SLTT）政府以及私营部门提供网络威胁预防、保护、响应和恢复。\n\n我与 `MS-ISAC` 的朋友兼长期领导\
  \ Mike Aliperti 探讨了当前的导师计划。Mike 是互联网安全中心（CIS）多州信息共享与分析中心（`MS-ISAC`）的利益相关者互动副总裁。`CIS`\
  \ 是一家非营利组织，其使命是为国家的州、地方、领地和部落（SLTT）政府以及私营部门提供网络威胁预防、保护、响应和恢复。我与 `MS-ISAC` 的朋友兼长期领导\
  \ Mike Aliperti 探讨了当前的导师计划。Mike 是互联网安全中心（CIS）多州信息共享与分析中心（`MS-ISAC`）的利益相关者互动副总裁。`CIS`\
  \ 是一家非营利组织，其使命是为国家的州、地方、领地和部落（SLTT）政府以及私营部门提供网络威胁预防、保护、响应和恢复。我与 `MS-ISAC` 的朋友兼长期领导\
  \ Mike Aliperti 探讨了当前的导师计划。Mike 是互联网安全中心（CIS）多州信息共享与分析中心（`MS-ISAC`）的利益相关者互动副总裁。`CIS`\
  \ 是一家非营利组织，其使命是为国家的州、地方、领地和部落（SLTT）政府以及私营部门提供网络威胁预防、保护、响应和恢复。我与 `MS-ISAC` 的朋友兼长期领导\
  \ Mike Aliperti 探讨了当前的导师计划。Mike 是互联网安全中心（CIS）多州信息共享与分析中心（`MS-ISAC`）的利益相关者互动副总裁。`CIS`\
  \ 是一家非营利组织，其使命是为国家的州、地方、领地和部落（SLTT）政府以及私营部门提供网络威胁预防、保护、响应和恢复。\n\n（注：由于原文中存在大量重复段落，译文已根据“不要重复输出原文”的原则进行去重处理，保留核心逻辑翻译）\n\
  \n*纠正说明：在提供的原始文本中，关于 Mike Aliperti 的介绍和 CIS 的定义的段落出现了多次重复。为了确保译文的质量和可读性，我将按照逻辑流进行了整合翻译。*\n\
  \n我与 `MS-ISAC` 的朋友兼长期领导 Mike Aliperti 探讨了当前的导师计划。Mike 是互联网安全中心（CIS）多州信息共享与分析中心（`MS-ISAC`）的利益相关者互动副总裁。`CIS`\
  \ 是一家非营利组织，其使命是为国家的州、地方、领地和部落（SLTT）政府以及私营部门提供网络威胁预防、保护、响应和恢复。\n\nMike 在 `CIS` 工作已七多年，负责\
  \ `MS-ISAC` 的指导工作。该计划促进了州、地方政府与私营行业之间的联系，通过信息分享，让 `MS-ISAC` 的成员受益。这种互动让参与者受益浅。\n\
  \n以下是访谈内容：\n\n**Dan Lohrmann (DL):** 你能简要描述一下 2018 年的 `MS-ISAC` 导师计划包含哪些内容？\n\n\
  **Mike Aliperti (MA):** `MS-ISAC` 导师计划的目标是让管理岗人员（包括首席安全官）能够通过导师关系学习经验。这种关系是非正式的，通过季度通话进行沟通。这种模式为导师生提供了问题解决、职业指导以及方面的洞察。我们鼓励大家在年度会议上进行面对面的交流以建立联系。\n\
  \n**DL:** 你认为这种导师计划的益处是什么？\n\n**MA:** 我们发现，导师和导师生都能从中受益：\n-   拥有一个可以请教特定安全问题的人。\n\
  -   从这些关系中学习成功与失败的经验。\n-   为导师生提供教育机会。\n-   对参与者的整体安全计划做出贡献。\n-   与职责相似的人结交流知识。\n\
  -   为进入信息安全领域的人提供帮助。\n-   提供了一个建立同伴联系的场所。\n- 了解其他安全计划以及解决方案。\n\n**DL:** 目前有多少人参与？它如何帮助你的成员提升能力？\n\
  \n**MA:** 多年来参与人数一直在增长。如你所知，我们从 8 组开始，目前（2018 年）已有 29 组，可能还有 6 组。我认为最大的益处是导师生发现那里有有意义的帮助。许多导师生后来成为了导师。他们参与得越深，就越了解\
  \ `MS-ISAC` 为他们提供的服务。许多导师年年参加该计划。\n\n**DL:** 自成立以来，导师计划在过去五年里是如何演变的？\n\n**MA:**\
  \ 我们总是遇到一些导师生希望从导师那里获得更多技术支持，但该计划是一个安全领导力导师计划。\n-   如果匹配不佳，我们创建了“重新匹配”的机制。\n-  \
  \ 制定了《导师计划指南》，以帮助双方创建和维护导师关系，如下：\n    - 建立匹配。匹配本地人员。匹配时间。\n    - 在年度会议上进行面对面的介绍。\n\
  \n**DL:** 你为什么认为这个计划正在增长？\n\n**MA:** `MS-ISAC` 的成员人数从 200 人增加到了 1,950 人。参与者正在向其他人推荐加入\
  \ `MS_ISAC`。\n\n### 结语\n\n在一次 BrightTalk 网络直播中，我主持了一场关于行业领袖讨论吸引和留住网络人才的会议。此外，信息系统安全协会（ISSA）也提供此类导师系列。在我看来，寻找导师或成为导师是职业中无法替代的。虽然我们我们生活的某些阶段可能无法顾及，但请尽量将其作为首要任务。你会发现这样做是正确的。我也认为这种导师计划是政府以外其他领域的典范，其他\
  \ ISAC 或专业组织可以考虑这种 `MS-ISAC` 的最佳实践方法。我希望这篇（诚然很长的）博客能说服你加入，要么寻找一名导师，要么成为一名导师，或者两者兼顾。\n\
  \n\n\n\n# 梅克伦堡县勒索软件攻击响应\n\n梅克伦堡县并不孤单。联邦调查局（FBI）表示，在最新的 2017 年第一季度，已有 745 名勒索软件受害者，向网络黑客损失了超过\
  \ 512,000 美元，损失的工作工时更为巨大。按照这个速度，FBI 预计今年的的受害者人数将超过去年，去年有 2,673 人向该反犯罪执法机构报告了勒索软件攻击。\n\
  \n## 全国关注与决策\n\n该县不支付赎金的决定在《纽约时报》发表的一篇报道中引起了全国关注：“在一个被黑客、网络喷子和各种在线作恶者震动的世界里，互联网上的好人们长期以来寻找一个不退缩的英雄。终于，有人说：够了。而这个人就是北卡罗来纳州的梅克伦堡县政府。”\n\
  \nDiorio 表示，该县在与几位第三方网络安全专家讨论该问题后决定不支付赎金，这些专家告诉他们，修复系统和对黑客花费的时间大约相同。\n\n她说：“支付赎金后修复系统所需的时间，几乎和自己修复的时间一样长。而且无法保证付给犯罪分子就能稳妥地解决问题。”\n\
  \n## 决策后的挑战\n\nFuller 说，在县政府宣布不支付赎金后，黑客曾多次尝试入侵县系统。“到目前为止，我们一直在击退他们。这是一个非常奇怪的处境。你在新闻中听到这些事，但亲身经历的感觉是这样的……”\n\
  \nDiorio 在给县员工的邮件中写道：“由于我们决定不支付赎金，信息技术服务部（ITS）报告，网络犯罪分子正加倍努力渗透县系统，主要通过包含欺诈附件的电子邮件进行，这些病毒可能会进一步损害我们的系统。”\n\
  \n该县暂时禁用了从`Dropbox`或`Google Docs`等文件服务打开附件的能力。在邮件中，Diorio 直接向员工说明了该事件：“我还想重申，县政府是这种情况的受害者，任何个人员工都不应该对这一事件感到负责。”\n\
  \n## 攻击细节与恢复\n\nDiorio 在新闻发布会上指出，最初攻击发生在员工打开邮件并点击附件之后，这触发了一个名为`LockCrypt`的程序，该程序将全县\
  \ 500 台服务器中的 48 台加密了加密数据。该县关闭了其他服务器以保护它们。黑客留的一条信息写道：“您的信息已被锁定，”并指示了县政府如何支付 23,000\
  \ 美元或两枚比特币的赎金。\n\n该县通过新闻发布会（在县政府的`Facebook`页面上直播）、社交媒体和当地电台采访向公众告知了黑客攻击的情况。Diorio\
  \ 周三的新闻发布会共有所有部门负责人，他们负责解答有关受攻击影响的服务的任何问题。\n\n县政府办公室保持开放为公众提供服务，县政府表示将使用备份数据重建受影响的应用程序。首要任务是健康与人类服务、法院系统、土地利用和环境服务。受勒索软件攻击影响的其他县办公室包括税务局、契据登记、估价局、公园与休闲、儿童抚养执法和财务部门。\n\
  \n该县要求员工和居民在所有系统恢复运行期间保持耐心。该县请居民如果与县政府有业务往来请提前致电。\n\n\n\n她还注意到，消费者强烈希望参与新闻的塑造，而不仅仅是被动的受众。本着这种精神，她欢迎图书馆员提供建议和反馈，以探讨如何最好实现“信任项目”（Trust\
  \ Project）的目标。\n\n与新闻记者的直接合作是提高媒体素养的另一种途径。例如，达拉斯公共图书馆（DPL）将为高中生举办一个为期八周的社区新闻培训课程。其“无国界故事讲述者”项目是\
  \ 2016 年骑士新闻挑战赛的获奖者之一，包含了专业图书馆员以及来自《达拉斯晨报》（`Dallas Morning News`）记者的监督。\n\n学生将在三个代表该市社会经济和文化多样性的\
  \ DPL 分馆之间轮换。记者将指导学生如何提问有针对性的问题，而图书馆员则将描述如何使用研究数据库来寻找准确信息。图书馆工作人员还将提供有关如何使用多媒体编辑工具的指导。2017\
  \ 年 4 月，这些初露头角的数字记者将凭借他们提供可信且引人入胜内容的新技能，在达拉斯图书节上展示他们的成果。\n\n### 图书馆的信息素养\n\n“信任项目”和“无国界故事讲述者”都是高关注的努力，但任何图书馆都可以开展关于媒体素养性的教育计划。\n\
  \n正如 SHEG 研究揭出的，这种培训应该从学生开始，并一直持续到大学。全国的图书馆都可以获得从免费的 `LibGuides`到加强学校课程的各种资源。\n\n\
  位于里士文的印第安纳大学东分校的图书馆员开发了一个关于如何识别虚假新闻的 `LibGuide`，并配有详细的图片，说明在浏览网站时应该问哪些问题。“新闻素养项目”由前《洛杉矶时报》（`Los\
  \ Angeles Times`）记者艾兰·米勒（Alan Miller）创立，为初中和高中生提供课堂、课后和电子学习项目的全面课程；石尼布鲁克大学（纽约）的新闻素养中心也为大学生提供类似的资源。\n\
  \n尽管提高媒体素养的需求显而易见，但一个风险是这个话题可能一直被认为是可选的——了解就好，并非必不可。怀恩堡（Wineburg）认为这种观点是误的。他说：“网络公民素养是一项核心技能，应该尽可能渗透到教育的经纬之中。”在《学院与研究图书馆新闻》（`College\
  \ & Research Libraries News`）的一篇论文中，信息素养图书馆员布莱恩·T·苏利万和阿尔弗雷大学（纽约）社会学教授凯伦·L·波特规划了如何将那些一次性的信息素养培训转化为具有嵌入图书馆员的完整计划。\n\
  \n图书馆员在帮助任何年龄的人成为具有批判性和反思性的新闻消费者方面发挥着至关重要的作用。当前对虚假新闻热议的一个积极可能是，针对媒体和其他类型内容的信息素养最终被认为是数字时代的核心技能。\n\
  \n*最初发表于 Marcus Banks 的《对抗虚假新闻》，`American Libraries`，2016 年 12 月 27 日。经出版者许可转载。*\n\
  \n## 33. 航空事故调查如何提高网络安全\n\nSCOTT SHACKELFORD\n\n当一些国家仍在安全问题上挣扎时，美国的航空旅行近期取得了卓越的安全记录。事实上，从\
  \ 2014 年到 2017 年，美国没有发生过商业航空公司空难性事故。\n\n但那几年充满了其他问题：安全泄露和电子间谍活动影响了美国的几乎每个成年人，以及乌克兰的电网和\
  \ 2016 年的美国……（注：由于原文存在大量重复段落，此处已去重处理）。\n\n\n\n\n更多国家和地区——包括欧盟——正对遭受数据泄露的实体实施严苛要求，包括在\
  \ 72 小时内强制报告网络攻击，以及采取更严厉的预防措施。全球范围内的企业、政府和学者正致力于如何提高数据安全。如果他们能够齐起来支持全球网络安全防护委员会网络，他们的努力将为个人和机构促进网络和平。\n\
  \n这一切所需的是行动的意愿、对实验新型网络安全治理模式的渴望，以及对我们应该从历史中学习的认识。正如富兰克林·D·罗斯福总统的名言所说：“采用一种方法并尝试它是常识的：如果失败了，就坦诚地承认并尝试另一种方法。但最重要的是，要去尝试。”\n\
  \n*最初发表于 Scott Shackelford，《飞机空难调查如何改进网络安全》，《*The Conversation*》，2018 年 2 月 21 日。经出版者许可转载。*\n\
  \n## B. 技术防护\n\n***\n\n## 34. 国家网络安全人才框架\n\n美国国土安全部\n\n### 概述\n网络安全是一项国家优先事项，对于所有组织的良好福祉至关重要。随着技术变得日益复杂，对经验丰富且合格的人才的需求前所未有。公共和私营部门的大型小型组织都在创建新的网络工作，并聘用数千名网络专业人士来保护网络和信息系统。\n\
  \n组织必须配备合适的网络人员来保护其业务。国土安全部（`DHS`）致力于加强人才建设，以确保组织拥有保护业务和应对未来挑战所需的信息和工具。\n\nDHS 拥有计划和能力帮助您的组织构建世界级网络安全队伍：\n\
  \n> 识别并量化您的网络安全人才\n> 了解人才需求和技能缺口\n> 为明确定义的职位招聘合适的人\n> 通过培训和职业发展提升员工技能\n> 创建计划和体验以留住顶级人才\n\
  \n国家网络安全教育倡议（`NICE`）网络安全人才框架提供了一个蓝图，将网络安全工作分类、组织并描述为类别（Categories）、专业领域（Specialty\
  \ Areas）、工作角色（Work Roles）、任务以及知识、技能和能力（KSAs）。`NICE` 框架提供了一种讨论网络角色和工作的通用语言，并帮助定义网络安全领域的个人要求。\n\
  \n### 类别、专业领域和工作角色\n在 `NICE` 框架内，共有七个类别，每个类别包含多个专业领域。此外，在每个专业领域内有一组工作角色。每个工作角色都有该角色所需的知识、技能和能力（KSAs），以及该角色执行的任务。这种组织结构基于广泛的职位分析，无视职位名称或其他职业术语，将具有共同主要职能的工作和人员归类。\n\
  \n### 1. 分析 (Analyze)\n对汇入的网络安全信息进行高度专业化的审查和评估，以确定其对情报的效用。\n\n* *全源分析 (All-Source\
  \ Analysis)。 分析来自情报界内多个来源、学科和机构的威胁信息。综合并将情报信息置于语境中；就可能产生的影响得出见解。\n* *利用分析 (Exploitation\
  \ Analysis)。 分析收集的信息，以识别漏洞和潜在的利用空间。\n* *语言分析 (Language Analysis)。 应用语言、文化和技术专业知识来支持信息收集、分析和其他网络安全活动。\n\
  * *目标 (Targets)。 应用对一个或多个地区、国家、非国家实体和/或技术的现有知识。\n* *威胁分析 (Threat Analysis)。 识别并评估网络安全犯罪分子或外国情报实体的能力和活动；产生结果以帮助启动或支持执法及反间谍调查或活动。\n\
  \n#### 2. 收集与执行 (Collect and Operate)\n提供专业的否认和欺骗行动，以及可能用于开发情报的网络安全信息收集。\n\n* *收集行动\
  \ (Collection Operations)。 使用适当的策略并在通过收集管理过程确立的优先级范围内执行收集。\n* *网络行动规划 (Cyber Operational\
  \ Planning)。 执行深度的联合目标和网络安全规划流程。收集信息并制定详细的`Operational Plans`（行动计划）和`Orders`（命令）以支持需求。针对集成信息和网络空间操作的全范围进行战略级和战术级规划。\n\
  * *网络行动 (Cyber Operations)。 执行活动以收集有关犯罪或外国情报实体的证据，以减轻可能或实时的威胁，防止间谍活动或内部威胁、外国破坏、国际恐怖主义活动，或支持其他情报活动。\n\
  \n### 3. 调查 (Investigate)\n对与信息技术（`IT`）系统、网络和数字证据相关的网络安全事件或犯罪进行调查。\n\n* *网络调查 (Cyber\
  \ Investigation)。 应用全范围调查工具和程序的战术、技术和程序，包括但不限于访谈和审讯技术、监控和监控侦测，并恰当平衡诉讼利益与情报收集之间的关系。\n\
  * *数字取证 (Digital Forensics)。 收集、处理、保存、分析和展示与计算机相关的证据，以支持网络漏洞缓解和/或刑事、欺诈、反间谍调查。\n\n\
  #### 4. 运行与维护 (Operate and Maintain)\n提供必要的支持、管理和维护，以确保信息技术（`IT`）系统性能的安全高效。\n\n\
  * *客户服务与技术支持 (Customer Service and Technical Support)。 处理问题；根据客户需求或查询进行安装、配置、故障排除，并提供维护和培训。通常为事件响应（`IR`）专业领域提供初始信息。\n\
  * *数据管理 (Data Administration)。 开发和管理数据库和/数据管理系统，允许对数据进行存储、查询、保护和利用。\n* *知识管理 (Knowledge\
  \ Management)。 管理和维护使组织能够识别、记录和访问知识资本及内容的流程和工具。\n* *网络服务 (Network Services)。 安装、配置、测试、运行、维护和管理及其防火墙，包括硬件（例如集线器、桥器、交换机、多路复用器、路由器、电缆、代理服务器和分配系统）和软件，允许所有频谱信息的共享和传输以支持信息和信息系统的安全。\n\
  * *系统管理 (Systems Administration)。 安装、配置、故障排除和维护服务器配置（硬件和软件）以确保其机密性、完整性和可用性。管理账户、防火墙和补丁。负责访问控制、密码以及创建的管理。\n\
  * *系统分析 (Systems Analysis)。 研究组织当前的计算机系统和程序，设计信息系统解决方案以帮助组织更安全、高效、有效地运行。通过理解业务和信息技术的需求和限制将两者结合。\n\
  \n#### 5. 监督与治理 (Oversee and Govern)\n提供领导力、管理、指导或开发与倡导，使组织能够有效地开展网络安全工作。\n\n\n\n\
  \n\n# 网络安全管理。\n\n监督信息系统或网络的网络安全计划，包括管理组织、特定计划或其他职责范围内的信息安全影响，涵盖战略、人员、基础设施、需求、政策执行、应急预案、安全意识及其他资源。\n\
  \n## 高层网络领导力。监督、管理和/或领导执行网络及网络相关和/或网络运营工作的任务和人员。\n\n## 法律建议与倡导。针对相关领域内的各种相关主题向领导层和员工提供法律上合理的建议和指导。倡导法律和政策的变更，并通过广泛的书面和口头工作成果（包括法律简报和诉讼）代表客户进行辩护。\n\
  \n## 程序/项目管理与采购。运用数据、信息、流程、组织间交互、技能和分析专业知识，以及系统、网络和信息交换能力来管理采购计划。执行管理硬件、软件和信息系统采购计划和其他计划管理的政策。为使用信息技术\
  \ (IT)（包括国家安全系统）的采购提供直接支持，应用 IT 相关的法律和政策，并在整个采购生命周期内提供 IT 相关的指导。\n\n## 战略规划与政策。制定政策和计划，并/或倡导政策变更，以支持组织的网络空间倡议或所需的变更/增强。\n\
  \n## 培训、教育与意识。对相关领域的人员进行培训。根据需要开发、计划、协调、交付和/或评估培训课程、方法和技术。\n\n## 6. 保护与防御\n\n识别、分析并缓解对内部信息技术\
  \ (IT) 系统和/网络的威胁。\n\n### 网络防御分析。利用防御措施和从各种来源收集的信息，识别、分析并报告网络内发生或可能发生的事件，保护信息、信息系统和网络免受威胁。\n\
  \n### 网络防御基础设施支持。测试、实施、部署、维护、审查和管理有效管理计算机网络防御服务提供网络和资源所需的设施硬件和软件。监控网络以积极修复未经授权的活动。\n\
  \n### 事件响应。响应相关领域内的危机或紧急情况以缓解眼前和潜在威胁。根据需要使用缓解、准备、响应和恢复方法，最大限度地确保生命安全、财产保护和信息安全。调查并分析所有相关的响应活动。\n\
  \n### 漏洞评估与管理。对威胁和漏洞进行评估；确定偏离接受配置、企业或当地政策的偏差；评估风险水平；并在运行和非运行情况下开发和/或建议适当的缓解措施。\n\
  \n## 7. 安全供应\n\n概念化、设计、采购和/或构建安全信息技术 (IT) 系统，负责系统和/网络开发的方面工作。\n\n### 风险管理。监督、评估并支持必要的文档、验证、评估和授权流程，以确保现有和新的信息技术\
  \ (IT) 系统符合组织的网络安全风险需求。从内部和外部角度确保风险的适当处理、合规性和保证。\n\n### 软件开发。遵循软件保证最佳实践，开发并编写/编码新的（或修改现有的）应用程序、软件或专用实用程序。\n\
  \n### 系统架构。开发系统概念并系统开发生命周期中的能力阶段；将技术和环境条件（例如法律和法规）转化为系统和安全设计。\n\n### 系统开发。负责系统开发生命周期中的能力阶段。\n\
  \n### 系统需求规划。与客户咨询以收集和评估需求，将其转化为技术解决方案。\n\n### 技术研发。开展技术评估和集成流程；提供并支持原型能力并评估其效用。\n\
  \n### 测试与评估。开发并进行系统测试，通过应用原理和方法评估其对规格和要求的遵循情况。\n\n最初发布于美国国土安全部的公共文件，《网络安全框架》，`https://www.dhs.gov/national-cybersecurity-workforce-framework/`。\n\
  \n## 消除网络盲点与防止入侵\n\n每年，政府系统和网络中发现的关键网络安全事件越来越多。大多数事件是在遭受重大损害且关键、机密或个人身份数据被泄露或外泄后才报告的。此外，勒索攻击大幅增加，正如今年公开的案例\
  \ `WannaCry` 和 `NotPetya` 所证明的那样。\n\n随着攻击数量的增加，其复杂性也在增加，这使得确保关键数据和系统可用性的同时让网络获得安全变得困难。对于政府机构来说，这是一个挑战性的平衡，但在保护网络、系统和信息的同时持续向公众提供基本服务是可以实现的。\n\
  \n虽然可以达成这种平衡，但考虑到政府网络面临的各种安全威胁至关重要，并记住它们包含高度机密、敏感或专有信息。随着政府机构日益转向云端，其网络变得更加复杂和脆弱，第三方连接和物联网设备极大地增加了攻击面。现在，联邦政府使用无人机执行灾害救援、执法、边境安全、军事训练等任务，威胁向量和表面变得更加宽泛。\n\
  \n\n\n\n\n以近期在乌克兰发生的 NotPetya 网络攻击为例，该攻击基本上瘫痪了该国家的计算机系统。攻击者利用软件漏洞作为入口，向乌克兰政府计算机感染了勒索软件。缺乏终端和网络的可视性、上下文，以及无法理解网络上攻击者活动的能力，表明了简单的操作系统漏洞如何导致灾难性的后果，并能在政府网络中极快地传播。\n\
  \n实施网络态势感知\n\n实时网络态势感知能力对于确保政府和关键基础设施运行的稳定性至关重要。它结合了对当前网络安全运营的深度评估（以识别潜在薄弱环节或漏洞）与检测和缓解威胁的计划。\n\
  \n通过网络态势感知，机构可以：\n\n> • 发现网络分段和终端、未知的非法设备和影子 IT 基础设施。\n> • 识别攻击者可能用于探索网络漏洞和访问敏感数据的潜在泄露路径。\n\
  > • 检测向外部服务器发起的未经授权通信尝试，其目的是安装额外的恶意软件或尝试对内部系统进行命令和控制。\n> • 发现可能导致风险或易受攻击的配置错误或网络分段问题。\n\
  > • 发现新插入的、可能是非法的有线或无线基础设施设备、防火墙、路由器或其他网络功能（例如虚拟化的）数据包转发器。\n> • 检测任何从网络到恶意软件服务器的数据外泄。\n\
  \n政府网络安全领域的领导者日益承认，依赖边界防御和以终端为中心的保护是不够的——到目前为止一直如此。他们假设恶意行为者将突破边界。复杂的安全团队不再采取掩鸵筑龟的方式寄希望终端防御能充分保护组织，而是转向检测网络基础设施本身上的恶意、异常行为。他们理解，实时检测和主动修复将提供更好的结果。\n\
  \n公民依赖并信任政府机构来保护国家基础设施和关键任务信息。一旦威胁访问网络，一切就太迟了，损害已经造成。使用网络态势感知的机构拥有适当保护网络和保持我们基础设施安全所需的实时且准确的可视性。\n\
  \n*最初于 Reggie Best 的《消除网络盲点和防止入侵》，载 `GCN Magazine`，2017 年 8 月 10 日。经出版社许可转载。*\n\n\
  ## 36. 云与企业网络安全\n\n营造公平竞争环境\n\n微软\n\n在不断变化的企业网络威胁世界中，智能安全是我们所有人努力的目标。现状已无法跟上威胁在全球范围内演变和复制的速度。在许多情况下，“坏人”比他们针对的机构拥有更充足的资金和更具网络专业知识的人员。另一个日益增长的担忧是，发起这些全球攻击的网络几乎总是比它们试图攻破的网络规模更大、更具韧性。\n\
  \n首席信息安全官（CISO）应该怎么办？当传统的网络安全方法失效或自身容易受到侵害时，企业的希望何在？答案是？企业必须在全球范围内投入努力，不仅要进行防御，还要进行反击。\n\
  \n组织是否能够在数据点的噪声中找到信号？这一点我们知道：攻击者不会等待安全软件追上进度。行业报告显示，高级网络攻击可能潜伏约 200 天而不被发现。使用实时检测和主动修复将提供更好的结果。\n\
  \n## 作战模式：进行中的高级攻击\n\n当发生入侵时，通常已经太迟了。损害已经造成。使用网络态势感知的机构拥有适当保护网络和保持我们基础设施安全所需的实时且准确的可视性。\n\
  \n部署高级漏洞的攻击者是小型机构或大型企业持续关注的焦点，攻击的影响远超入侵的初始成本。这些犯罪者技术高超、资金充足且不断演变，其动机从盗窃、工业间谍活动到全面的国家级攻击不等。\n\
  \n风险比以往任何时候都要高\n\n首先是财务担忧。今天，许多利用高级攻击的恶意行为者和作者正试图从他们的努力获利。\n\n对 `200 days` 的恐惧已成为\
  \ `CISOs`、`CSOs` 甚至 `CEOs` 的统计数据。为了做到，组织需要更智能的方法来尽早检测威胁，并扭转对抗复杂网络攻击的局面。\n\n\n\n\n\
  \n其他攻击的动机并非出于财务利益，而是为了获取敏感信息。例如，`STRONTIUM`。`STRONTIUM` 是一个知名的活跃组织，其目标包括政府机构、外交机构、记者和军事力量。\n\
  \n它并不追求金钱，也不在乎目标的大小。它追求的是它能找到的最敏感数据。同样，2013 年被发现的 `Red October` 攻击小组被发现已渗透政府和外交机构至少五年久。\n\
  \n尽管这听起来像是间谍小说里的情节，但它是一个真实存在的问题。安全泄露带来的不可见成本，即使在二十年前听起来也像科幻故事的情节。由于风险巨大，预算不断增加并不意外，公司也渴望新的解决方案来应对日益严峻的高网络攻击问题。\n\
  \n近 80% 的网络攻击始于老式的骗局，利用具有诱惑力诡计的鱼叉式网络钓鱼诱使用户泄露信息。但正如安全提供商 `McAfee` 指出的，更复杂的攻击正在增加，包括新的完整性攻击，这些攻击可以修改内部流程并在数据流经网络时对其进行重路由。\n\
  \n这就是在那起 10 亿美元银行抢劫案中使用的技术。攻击者通过新型恶意软件不断不断进化，这些软件可以更好地躲避检测或完全自我删除。攻击向量也在发生变化：攻击者不再满足于针对位于公司总部的\
  \ PC 和服务器，而是转向入侵卫星办公室；员工的家庭电脑；甚至是手机、可穿戴设备和汽车内部的软件。\n\n### 网络杀伤链：基础理解\n\n泄露通常涉及六个清晰阶段，在安全情报社区中被称为\
  \ `Cyber Kill Chain®`（网络杀伤链），该短语由 `Lockheed Martin` 注册了商标。这些阶段可以按顺序、并行或完全不同的顺序发生，而且每个阶段都提供了获取情报以击败攻击者的机会。\n\
  \n### 主动安全模型：领先一步\n\n由于高级攻击的隐蔽性，公司必须转向更具主动性的安全模型，侧重于提高嗅探攻击者并将其拦截在路上的能力。\n\n传统的企业安全模型始于保护网络边界，而专家现在建议采用一种更主动的方法，这种方法从强大的安全分析赋能的检测开始。\n\
  \n这种模型促进了一个不断改进的循环，因为泄露前的防御会根据泄露后检测和响应的新情报不断不断改进。\n\n在过去的几年里，`CISOs` 和 `CSOs` 一直致力于通过实施安全情报措施来实现这一转变，利用数据和分析来试图快速检测下次攻击并提高整体防御。这包括以下步骤：\n\
  \n*   投资先进的安全软件和安全硬件\n*   对员工进行安全要务和风险培训\n*   部署安全信息事件管理 (`SIEM`) 解决方案\n*   订阅（通常是多个）威胁情报馈送\n\
  *   开发关联威胁数据的流程，甚至聘佣数据科学家进行分析。\n\n到目前为止，这些工具和流程构成了行业应对高级攻击的主体。像科技行业中的许多早期努力一样，它们的结果参差不齐。\n\
  \n并不是说它们无效。`Mandiant` 2016 年的 `M-Trends` 报告显示，当公司成功时，它们可以缩短攻击者在网络中停留的时间。但数据实在太多了。为了跟上高级攻击，组织应该继续投资\
  \ `SIEM`。只有云才能提供提供这些保护所需的规模。\n\n### 改进检测：清晰信号的重要性\n\n缩短检测攻击的时间为企业带来了新的困境：拥有太多数据，却没有足够的信息来区分信号。这里的挑战不仅在于体量，还在于分离。许多攻击指标本身看起来是无害的，或者被不同的时间跨度隔开。如果没有对整个数据集有清晰的洞察，早期检测将变成一场机缘游戏。\n\
  \n*   真实的威胁情报需要比大多数组织所能获取的多得数据。\n*   在巨大的数据池中发现模式并变得更智能需要机器学习等先进技术以及巨大的计算能力。\n*\
  \   最终，应用新情报需要理解数据在说什么并采取行动的人类专家。\n\n这正是 `Microsoft` 努力扭转的地方。作为一家平台和服务公司，`Microsoft`\
  \ 的威胁和活动数据来自技术链的各个点，涵盖全球每个垂直行业。`Microsoft` 的安全产品和云技术旨在协同工作，在问题发生时报告威胁数据。这提供了一个飞行数据记录器，使我们能够诊断攻击、逆向工程高级技术，并将情报应用于整个平台。\n\
  \n先进的机器学习和情报收集技术与传统的安全方法相结合，提供了整体、动态、灵活且易于管理的企业态势。这种方法利用了云技术，而客户无法在本地复制实现价值所需的规模。\n\
  \n### 从几个月到几分钟：应用分析与持续改进\n\n近二十年来，`Microsoft` 一直将威胁转化为有用情报，以帮助加强其平台并保护客户。从由于早期蠕虫攻击（如\
  \ `Blaster`、`Code Red` 和 `Slammer`）的安全开发生命周期，到织入平台和服务的现代安全服务，公司不断建立流程、技术和专业知识，以检测、保护和响应不断演变的威胁。\n\
  \n#### 注\n\n[1] McAfee 安全，`McAfee Labs 2017 Threats Predictions November 2016` `https://www.mcafee.com/us/resources/\
  \ reports/rp-threats-predictions-2017.pdf`\n\n\n\n\n最初以微软之名发布，《云与企业网络安全：平等的竞争环境》，选自《网络安全：保护地方政府数字资源》第四章（华盛顿特特区：ICMA\
  \ 与微软，2017 年）。经出版者许可转载。\n\n# 37. 云端中的政府数据\n\n## 提供者与用户的责任\n\nSUBRATA CHAKRABARTI\n\
  \n`IRS`、人事管理局、证券交易委员会和国务院的数据泄露事件凸显了在黑客攻击日益增加的情况下，政府机构面临的风险。最近的一项研究表明，预算紧张可能是问题所在之一。联邦机构一直在努力争取资金以确保数据安全，尽管援助可能在路上了。随着现代化资金的到位，政府\
  \ IT 领导者需要对安全问题做出决策。\n\n云服务提供商（`CSPs`）也在重新审视保护数据的方法，因为当前的数据泄露潮不太可能减缓。事实上，许多网络安全专家预计\
  \ 2018 年将创下各类机构信息泄露的新记录。为了保护数据，`CSPs` 和用户都必须拥抱各自在防止未经授权访问敏感信息方面的责任。\n\n#### CSP\
  \ 对其服务的组织应尽责任\n\n政府 IT 管理人员应该能够信任他们用于处理敏感数据的软件服务（SaaS）供应商，而云提供商必须通过部署最有效的安全措施来赢得政府用户的信任。这不是一项一次性的责任，因为黑客正在积极开发新的利用手段，包括将人工智能武器化、创建勒索软件以及对物联网终端进行漏洞测试。\n\
  \n如今，负责任的 `CSPs` 提供了复杂的入侵和利用检测流程，并会进行定期的第三方扫描并实施其他标准安全功能。但最具前瞻性的提供者正在超越标准措施，使用诸如“深度防御”等技术来保护数据。\n\
  \n深度防御也被称为“堡垒法”，它部署了多项安全机制，以便当某一层防线失效时，另一层防线会自动接替工作。`CSPs` 可以通过为处理敏感信息的系统部署许多保护层来应用这一原则，确保硬件、软件和流程的安全，而不是集中在单一方面。在面对来自四面方的威胁时，像深度防御这样的全方位方法是合理的。\n\
  \n#### 政府组织需要了解 CSP 的哪些\n\n政府 IT 专业人员应该能够信任 `CSPs`，但在黑客攻击频繁发生的环境中，他们有责任主动确保其提供商使用最新的技术和手段来保护数据。云服务用户应该寻找能够应对今日关键威胁的特定\
  \ SaaS 安全功能。\n\n多重认证选项是云平台必不可少的功能，包括安全断言标记语言（Security Assertion Markup Language）等工具，这种授权协议允许机构管理员控制身份验证，而无需\
  \ `CSP` 存储用户密码。另一个必不可少的工具是访问控制，它允许组织管理员维护职责分离。\n\n同时，“自备密钥”解决方案（`BYOK`）对于具有最严苛的安全和合规需求的机构来说，可能是一个很好的选择。通过\
  \ `BYOK`，组织可以管理自己的加密密钥。这意味着它们可以加密和解密工作区，保持对云端数据的唯一访问权。使用 `BYOK` 期间对所有加密活动的详细审计日志为组织提供了对系统完整性的全面验证。\n\
  \n为了确保 `CSPs` 对敏感数据采取必要的预防措施，政府 IT 专业人员应确认提供者定期进行第三方渗透测试，并能够提供符合广泛接受标准的证据，例如来自国际标准化组织（ISO）或服务组织控制（SOC）的认证。拥有这些认证的\
  \ `CSPs` 已通过严格的独立审计。\n\n#### 数据安全是双向的\n\n随着终端的激增和威胁的倍增，`CSPs` 和使用云服务的组织都必须主动拥抱其维护数据安全的责任。云提供者可以通过持续评估其安全态势，并确保其采取的措施为客户（无论是商业还是政府）提供严格保护来尽其职责。\n\
  \n负责云服务的政府 IT 专业人员可以通过主动确保其云解决方案符合安全标准，为保护数据、资产及其服务的社区贡献力量。黑客威胁没有尽头，但通过了解当前的安全趋势和创新，专业人员可以做出正确的决策。\n\
  \n最初由 Subrata Chakrabarti 发表，《云端政府数据：提供者与用户的责任》，GCN 杂志，2018 年 5 月 16 日。经出版者许可转载。\n\
  \n# 38. 使用区块链保护“物联网”\n\nNIR SHETRI\n\n世界充满了连接设备，而且数量还在增加。2017 年，估计有 84 亿台联网温控器、摄像头、路灯和其他电子设备。到\
  \ 2020 年，这一数字可能会超过 200 亿，到 2030 年可能达到 5000 亿。因为它们一直在线，每一台设备——无论是语音识别助手、手机支付停车表，还是工业机器人内部的温度传感器——都会面临网络攻击的风险，并可能成为攻击的一部分。\n\
  \n如今，许多“智能”联网设备由知名品牌公司制造，如 `Google`、`Apple`、`Microsoft` 和 `Samsung`，这些公司拥有技术系统，也有营销上的动力来快速解决安全问题。但在日益拥挤的小型联网设备世界（如灯泡、门铃，甚至是\
  \ `UPS` 运输的包裹），情况并非如此。这些设备及其数字大脑通常由发展中国的小公司制造，缺乏资金或能力加入强大的安全功能。\n\n不安全的“物联网”设备已经导致了重大网络灾难，例如\
  \ 2016 年 10 月针对互联网路由公司 `Dyn` 的网络攻击，该攻击导致 80 多个热门网站崩溃并影响了全范围的互联网流量。作为物联网技术、区块链系统和网络安全的学者，我认为解决这一问题的可能是利用区块链进行跟踪和分发安全软件更新的新方法。\n\
  \n\n\n除了跟踪问题和创建修复方案的人力外，这些努力还需要巨大的投入。它需要软件来响应自动化查询，需要存储新版本的软件空间，以及需要将所有内容快速发送给数百万用户的网络带宽。这就是为什么人们的\
  \ iPhone、PlayStation 和 Microsoft Word 副本都能保持近乎无缝的安全补丁更新状态。\n\n在下一代互联网设备设备制造商那里，这一切都没有发生。例如，总部位于中国上海附近的杭州雄迈科技。雄迈以自己的品牌制造连接网络的摄像头和配件，并向其他供应商出售零件。\n\
  \n它的许多产品——以及许多其他相似公司的产品——都包含在工厂设置的管理密码，且这些密码很难或无法更改。这为黑客连接到雄迈制造的设备留了机会，输入预设密码即可控制摄像头或其他设备，并产生海量的恶意网络流量。\n\
  \n当问题（及其全球范围）显而易见时，雄迈和其他制造商几乎无能为力来更新他们的设备。防止未来网络攻击的能力，取决于这些公司是否能以快速、方便且廉价的方式向客户发布软件更新。\n\
  \n### 一个潜在的解决方案\n\n简单来说，区块链是一个记录交易的计算机数据库，同时存储在多个地方。从某种意义上说，它就像人们可以发布交易公告的公告板。每条发布都带有数字签名，并且永远无法更改或删除。\n\
  \n我并不是唯一建议使用区块链系统提高设备安全性的人。2017 年 1 月，包括美国网络巨头 Cisco、德国工程公司 Bosch、纽约梅隆银行、台湾电子制造商\
  \ Foxconn、荷兰网络安全公司 Gemalto 在内的许多区块链初创公司成立了。\n\n这种系统将可以供设备制造商使用，以取代科技巨头拥有的软件更新基础设施。这些较小的公司必须定期与区块链系统同步，以检查是否有新软件。然后他们在开发出更新时安全地将其上传。每个设备都将有一个加密身份，以确保制造商与正确的设备通信。结果，设备制造商及其客户将知道设备如何保持安全更新。\n\
  \n这类系统必须在内存和处理能力有限的设备上易于运行。现有的区块链包括 `Bitcoin SPV` 和 `Ethereum Light Protocol` 看起来很有前景。区块链创新者将继续寻找更好的方法，让数十亿“物联网”设备自动同步并更新安全性。\n\
  \n### 外部压力的重要性\n\n仅仅开发能够保护“物联网”设备的区块链系统是不够的。如果设备制造商实际上不使用这些系统，每个人的安全仍然面临风险。利润率较低的公司在没有外部帮助和支持的情况下，不会添加这些保护层。他们需要技术援助、政府监管以及消费者预期来改变现状。\n\
  \n如果他们的产品如果不更安全就卖不出去，物联网制造商就会提高，让用户和整个互联网变得安全。\n\n最初发表于 Nir Kshetri，《使用区块链保护物联网》，《The\
  \ Conversation》，2018 年 3 月 7 日。经许可转载。\n\n## 39. 如何保护读者的数字隐私\n\nANNE FORD\n\n四月，特朗普签署了一项取消奥巴马时代宽带隐私规则的措施。这些尚未生效的规则本要求互联网服务提供商（ISP）在将信息出售给第三方之前获得客户的许可——这些信息包括浏览历史、位置数据和其他高度敏感的内容。\n\
  \n“图书馆员行业非常关注公众的隐私权，这是一个非常严重的侵害，”Alison Macrina 说。Macrina 是 `Library Freedom Project`\
  \ 的主管，这是一个向图书馆员普及隐私相关权利和工具的组织。“这意味着我们在图书馆使用的任何 ISP 现在都能了解读者的浏览习惯。这意味着第三方能够对我们社区成员的数据变货币。”\n\
  \n她补充道，好消息是，在她看来，“我们可能有这些问题的解决方案，即使它们只是过渡的技术方案。我担心人们在理解这些问题的严重性后，会决定什么都不做，但做点什么真的很重要。可以让牙膏回到管子里。”\n\
  \n但怎么做呢？Macrina 和其他隐私倡导者为图书馆提供了几项建议，供它们决定如何最好保护读者的数字隐私。\n\n### 确保你的图书馆网站使用 HTTPS\
  \ 协议\n\n你的图书馆网站 URL 是以 `HTTPS` 开头的，不仅仅是 `HTTP` 或 `WWW` 吗？很好。这意味着网站与读者电脑之间的通信是加密的。\n\
  \n“如果读者[在家里]使用图书馆的在线目录，例如，这些通信包括他们在浏览器中输入的查询、他们选择的内容，以及在某些情况下，他们点击下载和阅读的内容，”Marshall\
  \ Breeding 说，他是 `Library Technology Guides` 的创始人、`ALA TechSource`  {《Smart Libraries》的编辑，以及包括《Cloud\
  \ Computing for Libraries》（`ALA Tech Source`, 2012）在内的几本书的作者。“如果没有那种 `HTTPS` 加密，任何人都可以看到往返的内容。这意味着\
  \ ISP 在从网络的一部分窥视到另一部分时，可以捕获这些流量并将其出售。”有了 `HTTPS`，ISP 可以看到读者访问了图书馆网站，但不知道他们访问的页面或查阅的书籍。\n\
  \n现在，Breeding 发现，他查询的图书馆中，少于 50% 的网站使用了 `HTTPS`，少于 30% 的在线目录流量使用了它。“这些数字并不理想，”他指出，“我担心图书馆的实践远未达到我们保护读者隐私的价值观。”\n\
  \n对于实施 `HTTPS` 协议的帮助，图书馆可以咨询 `Electronic Frontier Foundation` 或 `Let’s Encrypt`。\n\
  \n### 与你的 ISP 谈判\n\n“图书馆与个人消费者不同，它们有地位与他们的 ISP 进行谈判，使其同意在用户使用图书馆网络连接时不跟踪用户，或者至少不出售用户数据，”Mike\
  \ Robinson 说，他是图书馆科学教授，阿拉斯加安克雷大学和阿拉斯加太平洋大学联合图书馆系统部门主管。“如果一家全国 ISP 不做任何例外，你可能会卷入其中。但很多\
  \ ISP 为机构服务，我不认为图书馆是唯一不想被跟踪的。”\n\n### 考虑在图书馆电脑上安装 Tor 浏览器\n\n\n\n\n\n“Tor 是一款免费开源的网络浏览器，它可以隐藏你在使用普通网络浏览器时泄露的大信息，”Macrina\
  \ 解释道，“它隐藏了你的位置信息，并让你的互联网服务提供商（ISP）无法看到浏览历史。如果你使用 Tor，ISP 就没有东西可以卖了。”\n\n尽管如此，使用\
  \ Tor 通常意味着网页的下载速度会变慢。用户可能发现自己在访问某些网站时被要求输入验证码（CAPTCHA）。\n\n### 教导读者了解虚拟专用网络 (VPN)\n\
  \nVPN 是一种向你的 ISP 隐藏你在线活动的方法。“它基本上是为你的 Wi-Fi 流量创建了一个加密通道，”Macrina 说道。ISP 可以看到你连接到了\
  \ VPN，但无法看到你实际上在网上做什么。\n\n遗憾的是，VPN 很难在图书馆环境中大规模使用。“你必须以某种方式对用户进行很大程度的控制，而这在图书馆是做不到的，”她说。相反，“当我们教导计算机课程及此类活动时，我们可以建议读者在家里自行使用\
  \ VPN。” 图书还可以向读者介绍其他隐私保护工具的价值，例如 Disconnect 和 HTTPS Everywhere 浏览器扩展。\n\n### 向立法者游说以加强在线隐私保护\n\
  \n“所有这些都是技术解决方案，但我们需要政治解决方案，”Macrina 说道，“图书馆需要代表隐私立法进行游说，”例如在伊利诺伊州和明尼苏达州正在进行的宽带隐私法案。“我们需要向那些在这些问题上投票表现糟糕的立法者请愿，并让他们对他们从电信行业获得的巨额资金感到羞愧。我们需要联系那些对隐私问题表示同情的立法者，并要求他们采取行动扭转这一局面。拥有这样一个互联网是可能的：我们不需要为了获得基本服务而牺牲所有这些信息。”\n\
  \n*最初发表于 Anne Ford，《如何保护读者的数字隐私》，《美国图书馆》（*American Libraries*），2017 年 4 月 21 日。经出版商许可转载。*\n\
  \n## 40. 监控员工对公司电脑和互联网的使用\n\n德克萨斯劳动力委员会 (TEXAS WORKFORCE COMMISSION)\n\n过去几年中，与业务相关的互联网使用飞猛增长。与此同时，越来越多的员工在工作中至少部分或全部时间必须使用计算机。总之，这种对技术使用的增加促进了州和国家经济前所未有的扩张。然而，在带来收益的同时，雇主也面临着若干风险。本文将审查一些基本问题，并为关注这些相关风险的企业主提供一些解决方案。首先，让我们看看电子革命带来的一些风险。\n\
  \n### 电子邮件\n\n电子邮件（或称 e-mail）已成为许多员工和企业的首选通信媒介。没有人怀疑其节省时间的益处，但雇主也必须考虑其危险性：\n\n>\
  \ • 雇主可能对员工滥用公司电子邮件承担责任\n> • 性骚扰、种族和其他形式的骚扰可以通过电子邮件实施\n> • 通过电子邮件进行暴力威胁\n> • 通过电子邮件窃取或未经授权披露公司信息\n\
  > • 电子邮件非常擅长传播病毒\n\n### 互联网\n\n互联网像一个超级网络，连接着世界范围内无数其他计算机网络。字面上有数以百万计的计算机连接在这个巨大的资源上。只要知道在何处如何搜索，互联网上可以获得任何想象得到的类型的信息。和任何资源一样，它也有好坏之分。这并不意外的是，雇主在员工使用互联网方面遇到了一些问题：\n\
  \n> • 未经授权访问付费网站\n> • 因在某些网站上显示色情或淫秽材料而面临性骚扰指控\n> • 因不当使用或传播由第三方拥有的材料而产生的商标和版权侵权问题\n\
  > • 在浏览万维网上浪费了太多时间\n> • 从网站下载软件和其他材料时带入病毒\n\n### 公司电脑\n\n即使对于没有连接到互联网的公司电脑，雇主也发现员工滥用在工作中使用电脑的特权存在问题：\n\
  \n> • 软件盗版——员工对公司提供的软件进行未经授权的复制\n> • 未经授权访问公司数据库\n> • 在公司电脑上使用来自非授权软件\n> • 破坏公司文件和记录\n\
  > • 在电脑游戏上花费了过多时间\n> • 员工利用公司电脑为自己的个人业务或私用制作材料\n\n许多雇主想知道他们可以做什么来保护自己免受此类风险，并确保公司电脑和网络用于其预期用途。幸运的是，德克萨斯州和联邦法律在这方面都非常灵活。通过适当的政策，雇主有权监控员工工作期间对电子邮件、互联网和公司电脑的使用。要成功这样做，既需要良好的政策，也需要了解计算机和互联网的工作原理。\n\
  \n### 政策问题\n\n监控员工对公司电脑、电子邮件和互联网的使用涉及的基本问题，与在工作中进行常规搜索、电话监控和视频监控产生的问题相同。这些基本问题围绕着让员工知道：就工作而言，他们对使用公司场所、设施或资源没有隐私预期，并且随时都受到监控。自然地，理智和常识提供了一些可以理解的限制，例如，在员工洗手间不安装摄像机，不强制搜查某人的衣物或身体，但除此之外，在搜索领域几乎任何都是可能的。让我们来看看某些具体细节。\n\
  \n每位雇主都需要有一份关于使用公司电脑以及通过电脑访问资源（如电子邮件、互联网和公司内网，如果存在的话）的详细政策。每位员工必须签署该政策——这可以作为继续雇佣的条件。政策应涵盖某些内容：\n\
  \n> • 尽可能广泛地定义计算机、电子邮件、互联网等，给出具体说明，但但不限于这些细节\n> • 尽可能广泛地定义禁止的行为，给出具体说明，但但不限于这些行为\n\
  > • 提醒员工，某些行为不仅会导致失去工作，还可能导致民事责任和刑事起诉（非法色情内容、参与垃圾邮件操作或其他诈骗、参与计算机黑客攻击（参见 `18 U.S.C.\
  \ § 1030` 等其他法律））\n> • 公司需要保留随时监控所有计算机使用情况以符合政策的权利\n> • 有权随时检查员工的电脑、`HD`、软盘和其他介质\n\
  > • 必要时权撤回对电脑、互联网、电子邮件的访问权限\n> • 考虑禁止摄像手机（也称为手机摄像头）；此类手机已卷入严重侵犯其他员工隐私和盗取公司机密的行为\n\
  > • 确保员工知道在使用公司电子资源时没有合理的隐私预期，因为这些资源都是公司财产，且仅用于与工作相关的用途\n\n#### 如何监控合规性\n\n\n\n\n\
  作为雇主，你必须至少了解关于计算机和互联网的几点。自然，你将把许多技术细节交给员工中某些值得信赖的计算机专家，或者你可以与外部的众多任何一家私人计算机服务公司签约。然而，你应该具备一些技术知识，以便能够更好地利用专家的时间，并能够判断你的努力是否取得了成效。\n\
  \n让你的信息技术部门或计算机人员设置软件监控功能。某些软件只能检测网络上使用了了哪台计算机，而无法检测是谁在使用这些计算机。另一种方法是设置一个“代理服务器”——用户必须使用自己的用户名和密码登录。在互联网方面，可以通过网站地址和关键词屏蔽特定网站。某些软件可以分析网络上每台计算机的硬盘，从而确定谁的计算机上可能存在未经授权的软件或文件。\n\
  \n## 在哪里寻找未经授权的计算机和互联网活动？\n\n在 PC 上，请在 `C:\\Windows\\` 中查找以下文件夹：\n\n* `Cookies`——包含员工在访问网站期间留在其计算机上的“cookies”——cookie\
  \ 是小文件，让网站知道某人之前是否访问过该网站\n* `History`——这记录了员工访问过的每个网站的名称和 Web 地址\n* `Temporary Internet\
  \ Files`——此文件夹包含员工访问的每个 Web 页面、图形图像、按钮和脚本文件的副本\n* `Start Menu`：“Documents”（文档）：这显示了用户“Recent”（最近）文件夹中的内容（最近打开或最近使用的文件）\n\
  \n在 Macintosh 计算机上，请查看 ISP（互联网服务提供商）文件夹，然后查看 Web 浏览器文件夹，最后查看“Cache f”或上述名称中的某一个，取决于员工使用的是哪种浏览器。Mac\
  \ 上的“Apple”菜单也有一个“Recent”文件夹，显示了员工最近处理过的文件。\n\n通过在上述文件夹中找到的文件，可以重建员工的整个 Web 浏览会话。\n\
  \n### 计算机上的其他地方可能提供线索。\n\n在 PC 上，查看“Recycle Bin”（回收站）——有些人在删除文件时忘记清空该文件夹。使用你在计算机上找到任何图形应用程序，点击“File”（文件）并查看最近使用的文件——你可能会对员工过的图像感到惊讶。在\
  \ Mac 上，查看“Recent Documents”（最近文档）或双击“Trash”（垃圾桶）图标以查看已删除的文件。\n\n### 计算机滥用有一些预警信号：\n\
  \n* 员工在网上花费大量时间，超过了工作的合理需要，但异常地没有产出\n* 当你靠近时，你会听到很多急促的点击声，员工脸红地向你打招呼\n* `Temporary\
  \ Internet Files` 文件夹已满\n* 员工的计算机崩溃次数比任何人的计算机都多——病毒和对 `RAM` 的过度需求\n* 员工发送的垃圾邮件增加，他们将自己的地址散落在互联网各处（“垃圾邮件”是未经请求的商业电子邮件）。\n\
  \n## 为什么公司应该引起关注\n\n滥用公司计算机、网络和互联网可能会使公司面临员工错误行为引发的真实风险。如果提起了雇佣索赔或诉讼，原告律师和行政机构要求检查计算机记录是标准做法。删除计算机文件并不能完全擦除文件——用户计算机上留下了许多痕迹，法医计算机专家可以轻松找到这些痕迹并利用它们来对公司。虽然存在工具可以使数据无法检索，但并没有人意识到此类工具或如何使用它们。\n\
  \n几年前，一家大型半导体制造公司的一名员工因涉及非法儿童照片的指控被捕，此前同事通知了公司经理，经理随后通知了执法部门。经过仔细检查，发现他的办公室计算机硬盘上存储了数百张非法图像。公司的果断行动可能防止了雇主本身可能面临的法律问题。在德克萨斯州中部的一个县，\
  \ sheriff 部门的一名员工被解雇，因为在其办公室计算机上发现了许多色情图像。该部门对搜索其计算机没有意见，因为他们有关于计算机使用的良好规定。公司的果断行动可能防止了雇主本身可能面临的法律问题。\n\
  \n在没有明确相反政策的情况下，雇主可以许可搜索员工的计算机。工作场所电子系统中的隐私预期即使在刑事司法背景下也是重要的。在 `U.S. v. Ziegler,\
  \ 474 F.3d 118` 案中，第九上诉法院发现，尽管存在隐私预期，雇主可以许可搜索，因此计算机上发现的非法图像是可以采用的。在非常类似的案件 `U.S.\
  \ v. Barrows, 481 F.3d 1246` 中，第十巡法院认为结果相同，即使计算机是被告的个人财产（重要事实：被告将计算机带到办公室且未采取措施保护其内容）。\n\
  \n## 关注电子邮件\n\n完善的电子邮件政策会让员工知道，公司的电子邮件系统仅供业务目的使用，任何非法、骚扰或其他不受欢迎的邮件使用都可能导致严重后果。让员工知道监控将出于目的。如果检测到未经授权的个人使用，记录该事件并像处理任何其他违规行为一样处理。无论你做什么，不要让好奇或爱管闲事的员工传播个人电子邮件。这种做法可能会导致诽谤和侵犯隐私诉讼。让你的计算机专家在所有发出的公司电子邮件中附加免责声明，警告公司的监控政策，让可能的意外接收者知道可能包含机密信息，并不对个人误用或非官方使用承担责任。\n\
  \n### 重要信息\n\n互联网通信是不安全的，因此公司不对此消息的内容承担法律责任。然而，公司保留监控此消息传输的权利，并对电子邮件系统或其他网络组件的任何误用或滥用采取纠正措施。\n\
  \n此电子邮件包含的信息是机密的，并可能受法律保护。它仅供收件人使用。如果你不是预期接收者，任何披露、复制、分发或根据此信息采取的任何行动或克制都是禁止的，并可能是非法的。此电子邮件中表达的任何观点均为发送者的个人观点，除非发送者特别说明其\
  \ ABC 公司或任何关联公司或子公司的观点。\n\n注意：根据 NLRB 的裁决，员工有权在非工作时间使用公司电子邮件系统与同事讨论他们的雇佣条款和条件。\n\
  \n\n\n\n电子邮件领域的一项重大诉例是 `McLaren v. Microsoft Corp.` (No. 05–97–00824-CV, 1999 WL\
  \ 339015 (Tex.App.—Dallas 1999, no pet))。在该案中，达拉斯的一州上诉法院裁定，雇主对员工电子邮件进行审查和分发的行为并不构成侵犯隐私的诉赔理由。法院指出，拥有密码并不意味着员工对隐私有合理的预期；由于电子邮件系统属于公司且其目的是帮助员工工作，因此这些邮件信息并非员工的个人财产。此外，法院观察到，员工不应该对公司查看其邮件信息感到意外，因为他已经告诉雇主其某些邮件与一项正在进行的调查有关。\n\
  \n另一家法院在 2001 年裁定，雇主调取员工通过公司电脑发送给竞争对手的电子邮件（其目的是鼓励竞争对手去争夺雇主的客户），并未违反名为《1986 年电子通信隐私法》（2001\
  \ 年经《美国爱国者法案》修订）的联邦法律 (`Fraser v. Nationwide Mutual Insurance Co.`, 135 F. Supp.\
  \ 2d 623 (E.D. Pa. 2001))。该员工发送了邮件，竞争公司的接收方也收到了邮件，因此雇主在邮件发送过程中并未拦截邮件，而拦截邮件是 ECPA\
  \ 唯一保护的内容。2003 年 12 月 10 日，第三巡回上诉法院维持了联邦地区法院判决的部分内容 (352 F.3d 107)。\n\n新泽西州最高法院在\
  \ 2010 年 3 月发布的一项裁决，说明了公司电子邮件政策在判断员工对电子邮件通信是否具有合理隐私预期，以及雇主在阅读或监控此类通信时是否越界是有多重要。在\
  \ `Stengart v. Loving Care Agency`, 990 A.2d 650 (New Jersey 2010) 一案中，前员工使用公司笔记本电脑通过一个基于网页的电子邮件系统与其律师联系，该系统中有一个受密码保护的个人账号；她没有将密码存储在电脑上。在她离开公司后，雇主聘请了一位计算机取证专家对硬盘进行了镜像复制。硬盘检查发现了这些电子邮件，公司及其律师在应对员工诉讼的过程中阅读并使用了这些邮件，尽管这些邮件显然是前员工与其律师之间的通信，且邮件中还包含了一份标准的免责声明，规定未经授权的接收者有义务销毁信息而非审阅，并向发送者报告错误。公司拥有一相当广泛的计算机使用政策，但并未定义哪些类型的邮件可能被涵盖，允许员工“偶尔”个人使用公司电脑，而未告知任何此类使用将受到监控，并且未警告员工在电脑上发送、接收或查看的信息将由电脑软件存储在硬盘上。基于该政策的歧义性，并考虑到维护律师-客户特权原则的重要性，法院裁定该公司的行为侵犯了员工的隐私，且公司的律师可能根据有关律师行为的规则受到纪律处分。类似案例请参见\
  \ `Pure Power Boot Camp, Inc. et al, v. Warrior Fitness Boot Camp, L.L.C., et al.`,\
  \ 759 F.Supp.2d 417 (S.D.N.Y. 2010)。\n\n这里有一个重要的注意事项：只要雇主已通知员工，他们对公司电脑、电子邮件和互联网系统的使用不具有隐私预期，所有此类系统的使用都可能在随时（无论是否通知）受到监控，且通过公司电脑、电子邮件和互联网系统发送、中继或接收的所有消息、文件和其他信息都是公司的财产，存储在一个或多台公司电脑上，并可能随时接受公司的审查，那么雇主就可以对公司电脑发送和接收的电子邮件进行任何操作，包括在传输或接收过程中进行拦截。所有员工都可能需要这样做。\n\
  \n#### 违规行为证据\n如果员工因计算机或互联网问题受到纪分或解雇，请让您的计算机专家收集包含信息的任何电子邮件的数字副本和打印副本。这些证据随后可以用于防御各种主张和诉讼。\n\
  \n## 结论\n对于所有主来说，技术让事情变得更容易也变得更难。每家公司都必须确保其电子资源得到适当使用且不被滥用。作为雇主，你对计算机和互联网的了解越多，你的公司就会越好、越安全。\n\
  \n*公共文件最初发表于德克萨斯劳动力委员会，“监控员工对计算机和互联网的使用”，http://www.twc.state.tx.us/news/efte/monitoring_computers.html*\n\
  \n## 技术灾难恢复\n\n### 最佳实践\n政府财务官员 (GOVERNMENT FINANCE OFFICERS)\n\n政府为其公民提供许多基本服务。灾害发生后这些服务的中断可能会对政府服务对象造成重大伤害或不便。州和地方政府有责任确保在灾害发生后将基本服务的中断降至最低。今天，公共部门与私营部门一样，严重依赖计算机和其他先进技术来开展业务。因此，灾难恢复计划为了有效，必须专门针对在灾害发生后计算机或其他先进技术失效时，减少政府运营中断的政策和程序。\n\
  \n#### 建议\nGFOA 建议每个政府应正式建立书面政策和程序，以减少灾害发生后计算机或其他先进技术故障导致的干扰。这些书面政策和程序应每年进行评估，并定期更新（至少三年更新一次）。政府计算机灾难恢复政策和程序至少应包含以下内容：\n\
  \n- 正式为每个机构或部门指定灾难恢复协调员以组成灾难恢复小组。团队成员的职责应当予以定义，并维护一份最新的成员名单及其电话号码。政府还应建立在灾害发生时集合小组的程序。\n\
  - 要求创建并保护备份数据。政府在这方面的程序应涵盖计算机数据的定期和及时备份（带有妥善记录），以及备份数据的异地运输和存储（带有妥善记录）。政府还应确保备份数据在异地运输和异地存储期间的安全。\n\
  \n\n\n\n\n-   为灾难后的替代数据处理做好准备。政府应签署一份灾难后替代数据处理的合同。政府必须密切监控软件升级，以确保任何此类替代处理地仍具备处理政府数据的能力。如果需要使用替代处理地，政府还应建立处理优先级。此外，在符合联邦紧急援助条件的情况下，政府必须能够按照联邦紧急事务管理局（FEMA）规定的格式向联邦政府提供信息。\n\
  \n-   为恢复磁盘文件提供详细说明。\n\n-   建立灾难发生后立即采取指南。具体而言，政府的计算机灾难恢复计划应为宣布灾难、发布新闻稿和处理媒体、恢复通信网络以及评估损失提供指南：\n\
  \    -   政府正式计算机灾难恢复政策和程序的副本应保存在异地，以确保在灾难发生时可用；\n    -   每个政府都应每年测试其计算机灾难恢复计划，包括灾难恢复团队内部的通信，并采取立即行动纠补测试发现的缺陷。此类测试必须涵盖政府数据的恢复及处理，这一点至关重要；\n\
  \    -   政府还要应对对外服务灾难恢复计划的充分性。\n\n委员会：会计、审计与财务报告\n\n### 注释\n\n此最佳实践之前的标题为“技术灾难恢复规划”。\n\
  \n由 GFOA 执行会批准：2007 年 3 月\n\n\\*最初发表于政府财务官员协会（GFOA）的《技术灾难恢复：最佳实践》，http://www.gfoa.org/disaster-recovery-technology。经出版者许可转载。\n\
  \n### C. 利用合作伙伴关系与网络\n\n## 42. 网络安全合作伙伴\n\n### 数量的力量\n\nSUSAN MILLER\n\n当公共部门努力于改善网络安全时，一些机构正在汇集力量并建立合作伙伴关系，以便更好地共享威胁信息并为\
  \ IT 员工提供战术性网络安全培训。\n\n在北罗来纳州，公共安全部正与信息技术部合作，建立信息共享与分析中心。`ISSAC` 位于该州的调查局，将促进网络意识和信息共享，为私营和公共部门伙伴以及公民提供可操作的网络安全情报。\n\
  \n`ISSAC` 将与多个联邦、州和地方合作伙伴合作，包括北罗来纳州国民卫队、国土安全部、FBI、美国特勤局、多州信息共享与分析中心、州调查局等。\n\n州官员表示，近期发生的勒索软件攻击（如\
  \ 2017 年 12 月梅克伦堡县的以及今年 2 月戴维森县的攻击）凸显了对此类威胁进行协调应对的必要性。\n\n北罗来纳州信息技术部部长 Eric Boyette\
  \ 表示：“这项努力将帮助我们更好地防御网络威胁，增加跨州实体和边界的威胁向量及网络攻击者行为的信息共享。随着协调和信息共享的增加，我们检测、识别和恢复网络事件的速度也将提高。”\n\
  \n### 安全校园企业\n\n随着 `OmniSOC` 的启动，大学企业网络之间的网络安全信息共享将变得更容易。这是一个网络安全运营中心，将为其五个成员大学提供实时情报共享和威胁分析。根据一份公告，作为印第安纳大学、西北大学、普渡大学、罗格斯大学和内布拉加大学于林肯分校的联合计划，`OmniSOC`\
  \ 的目标是“帮助高等教育机构缩短从任何地方发现网络安全威胁到所有成员处实现缓解的时间”。\n\n官员表示，`OmniSOC` 在印第安纳大学运营，它将其成员校园的实时安全数据馈与政府及企业安全订阅相结合，并利用这些信息识别可疑和恶意活动。随后，它根据人工分析和机器学习提供快速的事件响应。\n\
  \n`OmniSOC` 使用 `Elastic Stack` 安全分析平台，这是一个用于摄取、关联和分析海量信息以检测网络威胁的系统。\n\n`OmniSOC`\
  \ 创始执行董事兼首席信息安全官 Tom Davis 在一份声明中表示：“拥有数万学生、教师和员工，大学校园真的就像小城市，拥有网络犯罪分子垂涎的敏感数据和强大的计算系统。虽然逐校园的方法至关重要，但对于现代网络风险的复杂性，这些方法是不够的。”\n\
  \n普渡大学首席信息安全官 Greg Hedrick 说：“高等教育在很大是一个开放的环境，因此我们经常能看到别人没有发现的网络犯罪。通过允许我们在整个高等教育领域进行监控，`OmniSOC`\
  \ 有帮助提高识别并更快反应这些坏分子的能力。我希望这些信息可以与我们社区之外的人共享，以保护整个生态系统。”\n\n`OmniSOC` 计划扩大服务并将成员范围扩展到其他大学。\n\
  \n### 提高网络意识\n\n为了应对培训和教育问题，佛罗里达西海岸大学网络安全中心正与佛罗里达州技术局合作，以更好地让州人员准备并防御新兴网络威胁。该计划将通过面对面、在线和远程交付提供实操性培训和教育课程，并提供基于能力的认证，为州人员从事核心网络安全工作做好准备。\n\
  \nIT 员工的初步培训于 3 月 20 日在佛罗里达税务局开始，重点关注网络安全意识和基础知识，并将涵盖网络安全事件管理、网络防御、操作系统加固、风险管理、云安全和其他新兴话题。\n\
  \n`Florida Cyber Range` 和 `UWF Cybersecurity for All` 项目将用于提供培训。网络空间是一个高保真环境，可以模拟互联网、复制网站、整合社交媒体并支持漏洞的动态注入。该计划通过在线学习环境、自定义模块和实操活动提供新兴话题的培训。\n\
  \nAST 执行董事兼州 CIO Eric Larson 说：“随着威胁的演变，我们必须继续培训我们的信息安全和技术资源。我们希望与 `UWF` 的合作能为其他州树范，不仅提供先进的网络培训，还为州员工提供持续的教育机会。”\n\
  \n*Rhea Kelly 是 GCN 兄弟网站 Campus Technology 的执行编辑，为本文做出了贡献。*\n\n\\*最初发表于 Susan Miller\
  \ 的《网络安全合作伙伴：数量的力量》，*GCN*，2018 年 3 月 22 日。经出版者许可转载。\n\n## 43. 跨部门简报\n\n### 网络安全中的跨部门协作\n\
  \nINTERSECTOR PROJECT\n\n\n\n\n在 2016 年，网络安全、隐私和黑客攻击似乎频繁出现在新闻中，从对选举相关黑客攻击的激烈讨论，到\
  \ 2013 年 12 月雅虎遭受攻击导致数亿消费者个人信息泄露的揭露。私人信息对网络威胁的脆弱性是一个跨越私营和公共部门的问题，不仅影响着我们的联邦、州和地方政府，还影响全国范围内的小企业、大型跨国企业以及个人。\n\
  \n网络安全是一个复杂的问题，不仅影响跨部门的利益相关者，而且必须涉及跨部门协作，以降低美国受网络攻击的风险。这份《跨部门简报》（Intersector Briefing）关注了网络安全领域的公私部门合作，从加强政府各级部门之间的通信和信息交流以停止攻击，到建立伙伴关系以加强网络安全教育。\n\
  \n### 立法者对联邦与私营部门网络合作的评估冷淡\n\n这篇来自《山点》（*The Hill*）的文章讨论了在本月早些时候国会听证会之后，公共与私营部门在网络安全方面的协调。行业专家的总体观点是，国土安全部（`DHS`）需要与私营组织更快速地分享更多关于网络威胁的信息。\n\
  \n“通过政府和私营部门共同努力，我们对抗这些威胁的集体能力将是我们这一代具有定义性的公共政策挑战之一，”国土安全委员会网络安全小组主席约翰·拉特克利夫（John\
  \ Ratcliffe，共和党，德州州）在开场证词中表示。听证会在特朗普总统发布网络安全行政命令之前举行，行业领导者将此次听证会视为机会，分享他们希望看到的情况，即新政府将“改进\
  \ `DHS` 与私营公司之间伙伴关系的执行”。\n\n### 亚马逊与州合作建立新的网络安全教育培养体系\n\n虽然公私部门之间合作来应对直接的网络威胁至关重要，但跨部门协作还有其他方式可以加强美国的网络安全。例如，网络安全专家阿尔吉德·皮皮卡凯伊特（Algirde\
  \ Pipikaite）在《山点》的一篇评论中解释道，存在“关键的网络安全专家短缺”。与其他劳动力开发或 STEM 教育计划一样，公共和私营部门都发挥着作用。\n\
  \n在改善网络安全教育的尝试中，亚马逊云服务（Amazon Web Services）正与弗吉尼亚网络空间（Virginia Cyber Range，弗吉尼亚州的一项倡议）合作，加强该州高中、学院和大学的网络安全教育。弗吉尼亚州长特里·麦考尔夫（Terry\
  \ McAuliffe）解释道：“在弗吉尼亚州乃至全范围内，企业、政府和个人正受到日益增长的网络攻击威胁。我们需要一支理解这些快速变化的威胁、并准备好对其进行敏捷防御的高能力劳动力。”\n\
  \n### 网络安全伙伴关系：公私合作的新时代\n\n这份由纽约大学法学院法律与安全中心（Center on Law and Security）发布的 2014\
  \ 年报告承认了网络安全领域公私合作的必要性，但也认识了其复杂性。作者写道：“法律、战略和务实的障碍往往阻碍了有效的公私部门合作，监管和民事责任风险加剧了这些问题。不同的政府机构具有竞争性的角色和利益，政府兼具合作伙伴和执法者的双重角色，影响了面临网络威胁的公司如何看待公共权威。”该报告接着探讨了为什么公私合作对于应对网络安全挑战具有价值、阻碍它的障碍、针对这些努力的跨部门协作最佳方法等。\n\
  \n### 新白宫网络安全顾问面临的挑战\n\n《福布斯》（*Forbes*）3 月的一篇文章称，特朗普总统准备选择罗布·乔伊斯（Rob Joyce，现任国家安全局定制化访问操作主管）担任他的网络安全沙皇。“自爱德华·斯诺登（Edward\
  \ Snowden）揭露大范围的政府监控计划以来，该机构与公民之间的隐私和信任问题一直存在疑虑，”托尼·布拉德利（Tony Bradley）报告道，并指出这种不信任可能会回波到本届政府。\n\
  \n在网络安全领域需要加强协作的时期，这可能是有害的。巴拉库达（Barracuda）高级工程高级副总裁弗莱明·史（Fleming Shi）表示：“美国网络安全沙皇的角色比任何时候都更重要。建立真正的伙伴关系对我们的国家安全至关重要。”\n\
  \n### 圣地戈网络安全负责人分享防御城市的方法\n\n在接受《州快报》（*State Scoop*）采访时，圣地戈首席信息安全官加里·海斯利普（Gary Hayslip）分享了城市防御攻击的策略。在国防部工作后，海斯利普必须适应在城市工作的现实，意识到“这座城市实际上是一个拥有\
  \ 130 万客户和多个部门的 40 亿美元业务”。他强调了城市部门与私营部门之间伙伴关系的重要性，他在圣地戈的工作成果之一是增加了网络安全团队与初创公司之间的协调，以“共享保护公民数据的网络安全路线图愿景”。\n\
  \n*最初发表于《跨部门项目：跨部门简报：网络安全领域的跨部门协作》，宾州时报（PA Times），2017 年 4 月 25 日。经出版者许可转载。*\n\n\
  ## 44. 奥巴的安全计划\n\n弗兰克·J·西尔卢夫（FRANK J. CILLUFFO）和莎伦·L·卡德（SHARON L. CARD）\n\n总统启动的网络安全计划的核心是鼓励私营部门共享信息，以更好地防御网络攻击。\n\
  \n然而，长期以来，美国公司对于与竞争对手及政府讨论其网络安全工作持谨慎态度，这很有理由。许多企业担心共享威胁相关信息可能会让他们面临法律责任和诉讼，损害股东或消费者的信心，并可能导致机密信息的泄露。\n\
  \n\n\n\n该行政命令授权国土安全部部长“强烈鼓励开发和形成信息共享与分析组织”（ISAOs），这些组织是“基于部门、子部门、地区或其他任何关联性建立的，包括针对特定的新兴威胁或漏洞”。这些\
  \ ISAO 旨在“成为私营部门内部以及私营部门与政府之间网络安全信息共享与协作的焦点”。\n\n此外，在行政命令发布的三天前，白宫宣布成立了国家网络威胁情报集成中心（CTIIC）。CTIIC\
  \ 类似于国家反恐主义中心，其工作致力于“将针对该国家的各种网络威胁联系起来，以便相关部门和机构能够尽可能实时地感知到这些威胁”。其最终目标是“促进并支持政府应对外国网络威胁的努力”。\n\
  \n该行政命令及配套措施的理念是，让网络犯罪分子更难实现其其目标——无论是利润、知识产权、国家秘密还是地缘战略优势——并让他们付出更大的代价。长期以来，有太多的因素一直有利于网络攻击者。\n\
  \n尽管该行政命令缺乏法律效力（例如，只有国会可以引入责任保护），但私营部门公司可能会选择合作。而且企业合规虽然是自愿的，但却至关重要，因为美国 80% 以上的关键基础设施由私营部门拥有和运营。每一个此类部门本身对美国的国家和经济安全都是至关重要的。\n\
  \n## 合作模式\n\n保持企业的运行变得更加重要，因为它们的运营可能相互交织。因此，攻破一个部门（例如电网）可能会导致其他部门瘫痪，从而给国家带来连锁反应和潜在的灾难性影响。好消息是，私营实体之间的协作已经在进行中，而且不需要一刀切。\n\
  \n例如，金融服务信息共享与分析中心（FS-ISAC），它促进了全行业关于网络相关威胁及其修复的交换。或者考虑微软的网络犯罪中心，它与全球范围内的执法部门和其他伙伴合作，传播信息并阻止犯罪分子。这些只是企业行为者发起倡议的例子，这些倡议早于该行政命令，并兼顾了公共和私人利益。\n\
  \n让“百花齐放”或鼓励行业与政府之间的信息流动——似乎像是一种混乱的方法，但现有的努力已经取得了一些真正的成功。随着网络威胁生态系统的不断演变，更多根据情况定制的此类实际上可能会证明是具有建设性的。\n\
  \n例如，一组美国公司（包括迈菲和赛信科技）正汇聚建立一个“网络威胁联盟”，其目标是“向所有成员组织分发高级对手的威胁情报，以提高整体态势感知水平，从而更好地保护……组织及其客户”。毕竟，通常是公司自身保护其资产有最大的动力。然而，公司需要理解并尊重构成合法防御和响应的界限，并与政府的道路规则保持一致，诚然，这些规则充其其量只是处于完善中。\n\
  \n其他国家也在努力解决有效保护私营和公共系统及网络的问题。领先者是爱沙尼亚，它是网络攻击的早期目标（2007 年），也是电子治理（在线提供的政府服务）的早期采用者，并对创新和数字安全保持持续承诺。该国最新的倡议大胆且雄心勃勃：在全球范围内建立数字大使馆并提供数字公民。\n\
  \n## 国家必要性与个人责任\n\n爱沙尼亚的方法可能并不适用于其他国家——至少在整体上不是。该国在国土和人口方面规模较小，而且在 1991 年从苏联统治下恢复独立时，不必应对遗留问题。但爱沙尼亚的原则无疑具有指导意义。\n\
  \n这包括一种全社会的网络安全方法，将该门学科纳入教育体系和课程中，从一年级开始一直持续到大学。结果是产生了一种主流的文化和心态，将网络安全视为既是国家必要任务也是个人责任。当美国寻求以最符合其规模、经济和情况的方式提升其网络安全态势时，用一系列其他措施来补充私营部门的信息共享努力将是至关重要的。\n\
  \n这些包括建立一支规模足够大且熟练的网络人才队伍。这意味着设计和工程安全的系统和架构。它还包括在政府和企业中培养一种运营文化，从起初就将网络安全视为优先事项，而不是事后补救。在这方面的失败将对美国国家和经济安全产生负面影响。\n\
  \n本月的行政命令是启动进程的催化剂，但坦率地说，政府在该领域所能（也应该）做的事情是有限的。各界都需要改变态度和行为，一直到家庭和个人。\n\n*最初发表于\
  \ Frank J. Cilluffo 和 Sharon Cardash 的《奥巴马的网络安全倡议》，*The Conversation*，2015 年 2 月\
  \ 24 日。经出版者许可转载。*\n\n## 45. 特朗普新的网络安全行政命令\n\nDANIEL J. LOHMANN\n\n在对网络做出承诺后，经过数月关于互联网安全计划的强硬表、大量的期待以及错过了\
  \ 90 天交付网络安全报告的截止日期，唐纳德·特朗普总统本周签署了一项关于网络安全的行政命令（EO）。\n\n关于加强联邦网络和关键基础设施网络安全的总统行政命令包含三个部分，特朗普的国土安全顾问汤姆·塞尔（Tom\
  \ Bossert）表示这些部分是按优先级排序的：\n\n> 第一部分：联邦网络的网络安全\n\n> \n\n> 第二部分：关键基础设施的网络安全\n\n> \n\
  \n> 第三部分：国家级网络安全\n\n新闻媒体和整个网络行业对该行政命令的反应主要是积极的。\n\n## 网络行政命令详情\n\n该行政命令开头明确了这样政策：“总统将要求各部门和机构负责人（机构负责人）负责管理其企业的网络安全风险。”\n\
  \n接下来，调查结果概述了联邦机构网络防御的不足，也明确了现状将不被容忍。一个例子：“行政部门长期以来一直接受陈旧且难以防御的 IT。”此外，“有效的风险管理需要机构负责人领导由\
  \ IT、安全、预算、采购、法律、隐私和人力资源领域专家的高级主管组成的集成团队。”\n\n\n\n\n\n具体而言，“即刻起，各机构负责人应使用由美国标准与技术研究所开发的《改进关键基础设施网络安全框架》（简称《框架》）或任何后续文件，来管理该机构的网络安全风险。各机构负责人应在本命令发布之日起\
  \ 90 天内，向国土安全部长和管理和预算局（OMB）主任提交风险管理报告。”\n\n尽管包括前白宫网络安全协调员迈克尔·丹尼尔（Michael Daniel）在内的少数专家认为这项行政命令（EO）只是“一个计划的计划”，但这些指令对于机构来说，要在三个月内完成是非常的风险管理报告。\n\
  \n关键基础设施部分建立在奥马政府期间成就的基础上。该行政命令以这项政策开头：“行政部门的政策是利用其权力和能力，适当支持国家关键基础设施所有者和运营商（根据《美国法典》第\
  \ 42 卷第 5195c(e) 节定义的关键基础设施实体）的网络安全风险管理工作。”\n\n总统随后概述了该保护工作将如何进行以及哪些人参与。\n\n另一份报告将于\
  \ 90 天内提交，关于“关键基础设施实体网络安全风险管理实践的适当市场透明度”。\n\n240 天内，将提交一份关于我们“针对僵尸网络和其他自动化、分布式威胁的韧性”的报告。\n\
  \n电网被特别提到，要求进行“电力中断事件响应能力评估”（也就是说，我们是否准备好应对针对电网的攻击？）。这份报告也将在 90 天内提交。\n\n最后，另一份于\
  \ 90 天内提交的报告将涉及国防工业基础（包括其供应链）以及美国军事平台、系统、网络和能力的网络安全风险，以及减轻这些风险的建议。\n\n在“国家网络安全”领域，该政策重申了我们的优先级，即“开放、互通、可靠且安全的互联网，促进效率、创新、交流和经济繁荣，同时尊重隐私并防止干扰、欺诈和盗窃”。还有一个培养具备网络安全技能的下一代人才的目标。\n\
  \n### 我的观点\n\n在许多方面，这项行政命令制定了未来四年网络空间高优先级行动的关键议程。它提供了多样化的不同主题和话题，从关键基础设施到网络安全劳动力。\n\
  \n我认为这只是特朗普政府网络空间计划的开始。虽然有些人可能说，在此之前的言论和行为实际上是开场表演，但大多数陈述并没有通过发布指导各小组采取行动的行政命令来支持。\n\
  \n这些报告和其他交付物将是至关重要的基石，未来会有更多内容。这是一份关于网络安全的基础性行政命令，延续了奥马政府建立的势头，但也增加了许多联邦机构负责人的问责制。这是一好事，因为每个网络安全专家都知道，管理层的认可和支持是成功的关键因素。\n\
  \n我听到目前幕后还有更多这项行政命令尚未揭的内容。例如，国家情报总监（DNI）表示，鲁迪·朱利尼（Rudy Giuliani）正在帮助制定网络战略，但细节寥少。我也认为这项网络安全行政命令中的国际合作部分至关重要。该行政命令指示：\n\
  \n> 在命令发布之日起 45 天内，国务卿、财政部长、国防部长、商务部长和国土安全部长应与总检察长和联邦调查局主任协调，向总统提交一份关于网络安全优先事项报告，包括国际合作、响应、能力建设和参与，并涵盖本小节列出的机构负责人。\n\
  \n### 结语\n\n这项网络安全话题的重要性在周五得到了强调，当时爆发了一场名为“WannaCry”的新全球攻击，它影响了 100 个国家并关闭了许多医院。\n\
  \n我们都需要被提醒，我们的在线和离线问题并没有消失。特朗普网络安全计划的第二章将在今年晚些时候那些报告和行动截止时开始。与此同时，我们的网络战仍在继续。\n\n\
  ## 46. 联邦政府网络威胁指标和防御措施的共享\n\n### 国家情报总监办公室及其他机构\n\n《2015 年网络安全共享法案》（Pub. L. 114–113,\
  \ 129.694 (2015)）第 103 节指示国家情报总监、国土安全部长、国防部长和总检察长在与第 1.1 小节列出的适当联邦实体负责人协商后，共同制定并发布程序，以促进：\n\
  \n1. 将联邦政府拥有的机密网络威胁指标（CTIs）和防御措施（DMs）与具有适当安全审查权限的相关联邦实体和非联邦实体代表进行及时共享；\n2. 与相关联邦实体和非联邦实体及时共享联邦政府拥有的、可能解密并在非密级别共享的非机密网络威胁指标、防御措施以及与本标题相关的网络安全威胁或授权使用相关的信息；\n\
  3. 与相关联邦实体和非联邦实体，或在适当的情况下向公众及时共享联邦政府拥有的非机密（包括受控非机密）网络威胁指标和防御措施；\n4. 在适当的情况下，与联邦实体和非联邦实体及时共享联邦政府拥有的关于此类实体面临的网络安全威胁的与本标题相关或授权使用相关的信息，以防止或减轻此类网络安全威胁的负面影响；\n\
  5. 通过出版和针对性的外展，定期共享根据联邦政府对网络威胁指标、防御措施以及与本标题相关的网络安全威胁或授权使用信息进行持续分析后开发的网络安全最佳实践，并关注小微企业（根据《小型企业法》第\
  \ 3 节定义，见《美国法典》第 15 卷第 632 节）面临的访问和实施挑战。\n\n\n\n\n\n本文档概述的程序描述了当前的机制，即根据 `Section\
  \ 102(3)` 中指定的适当联邦实体如何与非联邦实体共享信息。\n\n非联邦实体的示例包括私营部门实体，以及州、地方、部落和领土（SLTT）政府，包括私营和公共关键基础设施的所有者和运营商。这些程序目前通过一系列计划实施，下文描述了这些计划，并构成了适当联邦实体网络安全信息共享能力的基础。这些计划是动态的，预计将随着时间的推移而增长或演变。尽管如此，某些计划可能会停止，新计划可能会启动。此外，这些程序共同工作，识别通过其独特信息源提供的可用信息，并将这些信息与其各自的伙伴共享。在可能的情况下，适当的联邦实体通过这些程序进行相互协调，以确保其共享的信息是及时的、可操作的且独特的。\n\
  \n鼓励联邦实体尽可能广泛、、快捷地共享 `CTIs` 和 `DMs`。无论 `CTIs` 和 `DMs` 是机密的、解密的还是非机密的，联邦实体都应持续识别并实施相关计划，与其他实体以及非联邦实体共享此类\
  \ `CTIs` 和 `DMs`。\n\n参与由 `CISA` 授权活动（包括本文中提到的活动）的联邦实体，应完全遵守美国宪法及所有其他适用法律、行政命令和其他行政部门指令、法规、政策和程序、法院命令以及所有其他法律、政策和监督要求。\n\
  \n为了进一步这种广泛和快速共享的总体鼓励，联邦实体应建立并维护相关程序；并根据这些程序维护以下计划：\n\n1. 促进将联邦政府拥有的机密 `CTIs` 和\
  \ `DMs` 及时共享给相关联邦实体的代表，以及具有适当安全许可的非联邦实体。\n2. 与其他相关的联邦实体和非联邦实体共享其拥有的 `CTIs`、`DMs`\
  \ 以及与网络安全威胁的信息，这些信息可能被解密并在非机密水平上共享。此类共享符合总统和国家情报局长强调的、即确保 `CTIs` 和 `DMs` 及时高效地流向适当的联邦和非联邦实体的需求，并应根据所有适用的行政命令和指令进行。\n\
  3. 支持将联邦政府拥有的非机密（包括受控非机密）`CTIs` 和 `DMs` 及时共享给相关联邦实体和非联邦实体，或在适当情况下向公众。\n4. 在适当情况下，支持将联邦政府拥有的有关此类实体的网络安全威胁或在\
  \ `CISA` 下授权用途的信息及时共享给联邦实体和非联邦实体，以防止或缓解此类网络安全威胁造成的负面影响。\n5. 支持通过发布和针对性的外展，定期共享网络安全最佳实践。这些实践是基于对联邦政府拥有的\
  \ `CTIs`、`DMs` 以及与本标题下的网络安全威胁或授权用途相关的信息进行持续分析而开发的，并关注小型企业所面临的可访问性和实施挑战。\n\n本文档制定了相关程序，或引用了实施了此类程序的示例活动。此外，本文档规定联邦实体将通过相互共享，作为与非联邦实体进行更广泛共享的手段，因为许多联邦实体与国家的不同领域保持着独特的关系，例如关键基础设施部门、受监管行业或州和地方政府。最后，本文档承认，联邦实体内部组件的广泛共享与联邦实体之间的广泛共享同样重要。\n\
  \n美国政府的政策是尽一切合理努力“确保及时产生识别特定目标实体的美国本土网络威胁非机密报告”。\n\n然而，机密网络威胁信息的共享取决于接收方的安全许可级别，必须根据对情报源、方法、行动和调查的适用政策和保护要求执行，这些要求不受本文档限制。任何共享机密信息的联邦实体必须继续符合现有的分类标准，并在确定哪些信息可以与实体共享时，遵守处理限制，如“制定者控制”（ORCON）标记或对降级信息的特定制定者指令。\n\
  \n在适当的情况下，机构负责人预计继续使用根据 `32 CFR 2001.52`（根据行政命令 13526《机密国家安全信息》授予的应急权限），在存在生命立即威胁或保卫国土的紧急情况下分发和传输机密信息。\n\
  \n以下计划是一系列非详尽的示例，通过当前程序将联邦政府拥有的 `CTIs` 和 `DMs` 共享给相关联邦实体的代表以及具有适当安全许可的非联邦实体。\n\n\
  ### 国土安全部 (DHS) 增强网络安全服务 (ECS) 计划——http://www.dhs.gov/enhancedcybersecurity-services\n\
  \n### 美国国防部 (DoD) 工业基础 (DIB) 网络安全 (CS) 计划——32 CFR Part 236, http://dibnet.dod.mil/\n\
  \nDHS ECS 计划是一项自愿信息共享计划，协助美国的公共和私营实体改进其计算机系统防御未经授权访问、利用或数据泄露的能力。DHS 与联邦政府各的安全组织合作，获取广泛的敏感和机密网络威胁信息。DHS\
  \ 基于这些信息开发 `CTIs` 并将其共享给合格的商业服务提供商 (`CSPs`)，使其能够更好地保护客户。ECS 增强但不取代实体现有的网络安全能力。\n\
  \n2013 年 2 月，行政命令 13636《改进关键基础设施网络安全》将 ECS 扩展到 16 个关键基础设施的每个部门。由于全国对网络安全保护的需求和需要增加，ECS\
  \ 计划随后进一步扩大，现在允许批准的 `CSPs` 将 ECS 客户群扩大到所有美国公共和私营实体。\n\n\n\n\n国防工业基础（DIB）网络安全计划于\
  \ 2007 年启动，并于 2013 年根据《联邦法规第 32 卷第 236 部分》成为国防部的一项永久计划，旨在增强和补充 DIB 参与者保护存储在或通过 DIB\
  \ 非密网络或信息系统传输的国防信息的能力。在自愿性的 `DIB CS` 计划下，国防部与 DIB 参与者共享网络威胁信息，以增强非密 DIB 网络的整体安全性，减少对关键计划的损害，并提高国防部和\
  \ DIB 的网络态势感知。\n\n国防网络犯罪中心（`DC3`）作为 DIB CS 计划的运营重点，在加密和非密级别实时与 DIB 参与者共享网络威胁信息。参与公司接收分析支持、事件响应、缓解和修复策略、恶意软件分析以及其他网络安全最佳实践。\n\
  \nDIB CS 计划下国防部与 DIB 之间的共享加强了国家对不断增长的网络威胁的了解，提高了缓解风险的有效性，并实现了政府和国防部加强自愿性政府与私营部门网络威胁信息共享的战略目标。\n\
  \n### 国土安全部信息共享与协作计划 (CISCP)—http://www.dhs.gov/ciscp\n\n网络信息共享与协作计划（`CISCP`）是国土安全部公私部门信息共享的旗舰计划，补充了国土安全部持续的信息共享工作。在\
  \ `CISCP` 中，国土安全部与参与公司共享有关网络威胁、事件和漏洞的信息。要加入 `CISCP`，公司需要签署合作研究开发协议（`CRADA`）。除了管理\
  \ `CISCP` 的参与外，签署的 `CRADA` 可能允许访问国家网络安全与通信集成中心（`NCCIC`）的监控室，并使公司人员有资格获得安全审查以查看机密威胁信息。\n\
  \n### 国家网络调查联合任务队 (NCIJTF)\n\n`NCIJTF` 是一个经总统授权的多机构网络中心，负责协调、整合和共享与网络威胁调查及行动相关的信息。`NCIJTF`\
  \ 目前已与约 24 个成员机构代表签署了谅解备录（`MOUs`），允许在 `NCIJTF` 共享网络威胁信息——包括机密网络威胁情报（CTIs）。根据`第 102(3)条`确定的适当联邦实体是已签署\
  \ `MOUs` 的 `NCIJTF` 现成员。\n\n`NCIJTF` 拥有多种现有机制，作为 `NCIJTF` 成员向适当的联邦实体共享机密 CTIs。`NCIJTF`\
  \ 的 24/7 监控室 `CyWatch` 是与 `NCIJTF` 成员联邦实体共享机密 CTIs 的主要机制。此外，`NCIJTF` 的威胁办公室（`Office\
  \ of Threat Pursuit`）分析收集的网络威胁数据，并提供有关泄露数据的报告，并与成员机构共享。最后，行动协调办公室（`Office of Campaign\
  \ Coordination`）促进在参与机构之间共享机密 CTIs 以及与行动任务相关的 `DMs`。\n\n`NCIJTF` 还向向联邦实体和非联邦实体（包括经过审查的私营部门代表）提供机密威胁简报。简报根据具体情况决定。\n\
  \n除了通过 `NCIJTF` 共享，联邦调查局（`FBI`）还利用现场简报向行业和适当的私营部门实体共享机密指标和防御措施。通过与其其他政府机构伙伴协调，`FBI`\
  \ 为潜在或已知的受害者实体提供临时安全审查，以便他们访问机密信息。\n\n\n\n合作伙伴关系也有助于信息的流动。政府与私营部门之间存在着令人遗憾的信息鸿沟历史问题，这可能为网络犯罪分子提供了机会。例如，在\
  \ 2014 年，`Google` 发现了一个严重的国家安全漏洞，该漏洞“允许攻击者窃取加密信息，包括密码、cookie 和数据”。后来获悉，这一漏洞几年前就已被国家安全局（`NSA`）发现，但\
  \ `Google` 却对此无所不知，因为双方没有进行合作。\n\n目前正在进行许多令人兴奋的合作伙伴关系，以应对网络犯罪威胁。科罗拉多州美国检察官办公室刑事部近期成立了新的网络犯罪与国家安全处，旨在与私营行业合作共同预防网络犯罪。美国国土安全部、国防部和空军最近都在硅谷设立了办事机构，以促进与科技公司开展网络安全合作。\n\
  \n虽然这些联盟具有许多益处，但也面临着挑战。组织政治、文化和官僚主义一直是过去合作努力的障碍。\n\n硅谷和联邦政府就是面临此类挑战的联盟之一。他们的文化格格入。硅谷的组织结构精简且高效，而联邦政府规模相对大且缓慢。尽管如此，虽然硅谷科技公司敏锐地意识到“联邦官僚主义的负担”，但他们通常“淡化这些担忧”。他们认为“政府工作是为网络空间保卫美国的一种令人兴奋且充实的方式”。他们的积极经验可能会激励其他私营公司加入同样的战斗。\n\
  \n专家还建议通过激励私营部门与政府建立伙伴关系。例如，退休的 `NSA` 长基思·亚历山大（Keith Alexander）建议向私营公司提供税收激励，鼓励其开发稳健的网络安全计划并与政府分享他们的发现。\n\
  \n总体而言，无论是否有激励，显而易见的是，公私部门正在形成成功的战略伙伴关系。这是一个值得关注的趋势，有望继续繁荣，并为全球网络犯罪调查增加价值。\n\n*最初发表于\
  \ Chelsea Binns，《执法伙伴关系加强网络安全调查》，刊于 *PA Times*，2017 年 4 月 4 日。经经出版者和作者许可转载。*\n\n\
  ## 48. 各州竞抢从网络安全热潮中获利*\n\nELAINE S. POVICH\n\n随着数据搜网和信息泄露主导新闻，各州正争相通过向保护敏感信息免受外部攻击的机构提供税收激励，从这一快速扩张的业务领域中获利。\n\
  \n当普通美国人怀疑他们的私人电话和电子邮件是否被政府监控时，企业则担心所有权和敏感业务信息可能被竞争对手（包括国内和海外）窃取。州和地方政府也在努力加强保护，以防止外部人员入侵其信息系统。\n\
  \n“这是一个新的全球威胁，不仅对我们的州和国家，而且对整个世界，”马里兰州商务和经济发展部项目经理马克·A·沃尔肯（Mark A. Vulcan）说。\n\n\
  马里兰州正在开辟局面，提供总计 300 万美元的税收减免，分配给已在该州内或同意在该州落户的网络安全初创公司。虽然许多州将网络安全公司纳入针对高科技企业的整体税收激励中，但由马里兰州州长马丁·奥马利（Martin\
  \ O’Malley）提议并于 5 月签署的立法似乎是独特的。\n\n沃尔肯表示，另一个马里兰州与其他州不同的不同点是，这项税收抵免直接面向公司，而不是该实体的“天使”投资者，而许多其他州是这样做。\n\
  \n分析师表示，这种抵免可能预示着各州试图从网络安全热潮中获利的新一波行动。根据投资者网站 `Entrepreneur.com` 显示，价值 2070 亿美元的网络安全行业预计在未来五年内表现出“令人印象深刻的增长”。\n\
  \n华盛顿特区的 Berkeley Research Group, LLC 顾问哈维埃尔·西尔沃（Javier Siervo）表示，马里兰州可能是唯一专门为网络安全提供税收抵免的州，但\
  \ `D.C.` 为在该地区设有办公室且“大部分收入源于技术相关活动”的公司提供激励。邻的弗吉尼亚州阿灵格顿县增加了技术区，以鼓励科技企业将业务迁至该县。\n\n\
  根据弗吉尼亚州技术助理秘书长卡梅隆·基尔格（Cameron Kilberg）的说法，该州为科技公司提供资本利得税免税的全州计划将涵盖网络安全公司以及其他高科技项目。在该激励措施下，该州不对已被联邦政府作为长期资本利得征过税的收入征税。\n\
  \n基尔格说，该计划始于 2010 年，并将持续到 2015 年，超过了其原定的 2013 年终止日期，因为该州希望更多时间来评估该计划是否有效。\n\n###\
  \ 网络安全公司\n\n`Aronson LLC` 的州和地方税务专家迈克尔·科拉维托（Michael Colavito）表示，华盛顿地区拥有许多政府承包商，并吸引了规模巨大的网络安全行业。他为私营企业提供如何利用州税收激励的建议。他说，“由于这么多黑客”，安全需求必须加强，马里兰州正试图定位自己以利用这一局面。\n\
  \n美国一些最大的国防和安全公司位全球网络安全业务前 20 名，包括 `Booz Allen Hamilton Inc.`（爱德华·斯诺登所在的公司，他泄露了国家安全局的数据搜网计划）、`General\
  \ Dynamics`、`Intel`、`Lockheed Martin`、`Northrop Grumman` 和 `Raytheon` 等。\n\n激励网络安全行业的很大努力很大程度上源于总统巴拉克·奥巴马在\
  \ 2 月 12 日签署的一项行政命令，该命令指示联邦机构为私营行业制定自愿的网络安全标准，并在必要时提出新的指令。其目的是帮助州和地方政府保护由基于技术的控制的关键基础设施。\n\
  \n过去几年中广泛报道的数据泄露事件推动了政府的努力。这些包括：\n\n> • 2012 年 3 月，`NASA` 关闭了一个大型数据库并向员工发出警告，因为一台从汽车上被的笔记本电脑被破解，泄露了人员数据以及技术\n\
  \n> • 2012 年，黑客进入了`美国海军`的人员变动系统，泄露了 20 万士兵及其家属的私人数据。\n\n> • 2012 年，华盛顿州的一个网站被破解，泄露了数十万居民的社会保障号码和驾照号码。\n\
  \n### 税收减免\n\n贸易团体 `Council for Community and Economic Research` 跟踪全美 50 个州的税收激励措施，并为企业提供激励比较。该集团网站指出，全国各州和地方赞助的激励计划超过\
  \ 1600 项，网络安全激励只是其中之一。\n\n税务专家科拉维托指出，纽约州和新泽西州正在竞争业务——这次是在金融领域，“各州都非常激进，”他说。\n\n\
  他还指出，尽管对在马里兰州的投资有税收优惠，但如果公司成功，该州仍然受益，因为公司将缴纳州税。然而，这种减免是“可退还抵免”，因此即使公司不盈利也适用。\n\n\
  \n\n\nO’Malley 和密歇根州州 Rick Snyder 领导了美国州长协会（NGA）的网络安全资源中心，并在 2 月的 NGA 冬季会议上推广了这一主题。\n\
  \n州投资回报是否盈利仍是一个悬而未决的问题。根据皮尤基金（The Pew Charitable Trusts）2012 年 4 月的一项研究，各州在追踪经济发展税收激励措施结果方面参差不齐。虽然每个州都有某种类型的税收激励，且许多州拥有多项措施，但并非所有州都能成功确定其结果。\n\
  \n皮尤组织 *Stateline* 的母机构对各州和哥伦比亚特区衡量其税收激励经济效益和成本的能力进行了评分。13 个州被评为“领先”，“12 个州为“结果不一”，26\
  \ 个州则“落后”。\n\n*最初发表于 Elaine S. Povich 的《各州竞相把握网络安全热潮》，载于 *Governing*，2013 年 6 月\
  \ 17 日。经出版者许可转载。*\n\n## 49. 国民卫队是如何保护网络安全的*\n\nCOLIN WOOD\n\n保护基础设施免受网络攻击的年度业务额达\
  \ 460 亿美元，主要围绕联邦政府展开。但在过去一年里，人们正努力将联邦级网络安全工具和资源引入州和地方政府——而国民卫队可能是推动这种合作的平台。\n\n\
  美国州长协会（NGA）国土安全与公共安全委员会主任 Heather Hogsett 表示，联邦多年来一直试图独自解决网络安全问题，但他们终于开始将州和地方政府纳入其中。去年，NGA\
  \ 支持一项名为`2013 年网络战士法`的法案，该法案本指示国防部在各州建立由国民卫队成员组成的“网络与计算机网络事件响应”小组。\n\n尽管该措施在去年未能通过，但它引起了对该问题的关注。州层面的努力——例如华盛顿州国民卫队的网络团队——继续扩大卫队在网络保护的角色。\n\
  \n国会正在听取下级政府对网络问题的意见。去年 9 月，密歇根州州 Rick Snyder 向国会简报了 NGA 在网络安全方面的工作，强调了州政府日益增长的角色的重要性。在活动期间，Snyder\
  \ 发布了一份名为`行动与调整：州长网络安全行动号召`的文件，这是一份六页文档，概述了对希望提高网络安全的州的建议。Snyder 还发布了一款软件（目前正在密歇根州和马里兰州测试），该软件允许州长查看其州网络安全环境的概述。\n\
  \n“州长非常关注网络安全，我们 NGA 正试图为他们提供任何可用工具和资源，帮助他们更好地保护州内的关键光纤基础设施和资产，”Hogsett 说。她说，让全国州长进入网络安全领域对州和联邦政府互利互利，让国民卫队承担这一角色是合理的。\n\
  \n“国民卫队的独特之处在于它可以同时为州长和总统服务。它是唯一可以做到的军兵种，”她说，“联邦政府和各州都广泛表示，缺乏接受过培训的合格的人员来协助执行网络安全功能。”国民卫队正处于招聘私营部门专业人士协助政府进行网络安全的理想位置。有担忧的\
  \ IT 专业人员不需要……（注：后续段落将遵循相同的逻辑）。\n\n\n\n休斯表示，通过中央机构协调政府工作的优势在于提高了意识并共享了资源。这还为他们提供了与\
  \ `FBI` 和州级融合中心合作的机会，以便他们接触其他可能受到攻击影响但并不知情的组织。\n\n休斯说，过去几年里，华盛顿州国民卫队在 `DHS`的技术帮助下一直在进行网络演习，但去年秋，该州计划在没有联邦机构参与的情况下测试其网络安全事件响应计划。“我们将与一组来自州、地方，理想情况下还有一些地方私营部门的政策人员一起测试该计划，以说明：‘如果我们真的发生了[事件]，我们该如何应对？带上你们的人脉录。在我们不得不请求别人来帮忙之前，我们能通过自己的手机打给多少个聪明人？’”\n\
  \n华盛顿州首席信息官 `Michael Cockrill` 表示，国民卫队是一个极佳的合作伙伴。“安全是我整体上的首要关注点，”他说，“通常当有人问我我最重要的三个关注点是什么时，我会说安全、安全还是安全。然后我们才讨论第\
  \ 4 点和第 5 点。……全球范围的安全格局变化之快，需要不断努力才能跟上节奏，而保持公民数据安全必须是该州的首要任务。”\n\n`Cockrill` 说，利用国民卫队进行网络安全测试是非常棒的，不仅是因为它可以获得联邦资源并提供更集中的指挥结构，而且这对州来说节省了成本。使用外部机构进行此类测试将成本高昂且安全性更低。“我们可以将所有工作保持在内部完成，在进行这种至关重要的渗透测试时，流程将更加高效。”\n\
  \n在密歇根州，国民卫队申请资金以建立一个跨州的网络演练设施网络，使公共部门和私营部门能够在不需要安全许可的情况下参加联合演习。密歇根州国民卫队的 `Michael\
  \ Stone` 少将表示，现有的联邦项目，如国防高级研究计划计划（`DARPA`）耗资 1.1 亿美元的国家网络范围是有帮助的，但仅适用于那些拥有最高安全密级的人员。跨州的网络演练设施网络将为州和地方关键基础设施的运营者提供关于网络漏洞的价值研究和分析。\n\
  \n`Stone` 说：“在联邦层面工作的政策制定者中有人认为网络领域完全属于联邦政府。问题在于，这需要联邦政府拥有完美的资源和完美的执行力。而联邦政府的执行力怎么能一直是完美的呢？”\n\
  \n`Stone` 说，让联邦机构负责电网和水坝等关键基础设施是没有意义的，因为那些并不是由他们运营的。他说：“所有关键基础设施的 80%是私有的。而且所有运营关键基础设施网络的人中，85%是平民，而非联邦政府。”\n\
  \n然而，并不是所有人都支持更多的地方控制。Gartner 分析师 `Lawrence Pingree` 表示，这种以联邦为中心的模型具有某些优势。“我不认为州级和市级是正确的方法，因为支出应该更加集中，并以类似的方式管理以支持资本的高效部署，“此外，政府面临的一个大问题是往往不愿意支付安全从业人员在私营部门可以要求的适当薪资，这大大限制了他们在培养人才后执行或留才的能力。”\n\
  \n但并不是所有人都支持更多的地方控制。根据 `Lawrence Pingree` 的说法，以联邦为中心的模型具有某些优势。虽然他不认为州级和市级是正确的方法，因为支出应该更加集中，并以类似的方式管理以支持资本的高效部署，但政府面临的一个大问题是往往不愿意支付安全从业人员在私营部门可以要求的适当薪资，这大大限制了他们在培养人才后执行或留才的能力。\n\
  \n在密歇根州，国民卫队申请资金以建立一个跨州的网络演练设施网络，使公共部门和私营部门能够在不需要安全许可的情况下参加联合演习。密歇根州国民卫队的 `Michael\
  \ Stone` 少将表示，现有的联邦项目，如国防高级研究计划计划（`DARPA`）耗资 1.1 亿美元的国家网络范围是有帮助的，但仅适用于那些拥有最高安全密级的人员。跨州的网络演练设施网络将为州和地方关键基础设施的运营者提供关于网络漏洞的价值研究和分析。\n\
  \n`Stone` 说：“在联邦层面工作的政策制定者中有人认为网络领域完全属于联邦政府。问题在于，这需要联邦政府拥有完美的资源和完美的执行力。而联邦政府的执行力怎么能一直是完美的呢？”\n\
  \n`Stone` 说，让联邦机构负责电网和水坝等关键基础设施是没有意义的，因为那些并不是由他们运营的。他说：“所有关键基础设施的 80%是私有的。而且所有运营关键基础设施网络的人中，85%是平民，而非联邦政府。”\n\
  \n\n\n\n为了服务我们的社区，奥古斯塔大学（Augusta University）的 MPA（公共管理硕士）致力于帮助当地非营利组织和公共机构准备并利用奥古斯塔成为全球网络安全之都潜力。我们意识到，`MPA`\
  \ 和其他公共事务计划应当在帮助地方政府提供有效安全的电子政府服务方面发挥作用。这些计划可以通过关注以下方面来实现：\n\n*   通过资助写作协助确保资金到位；\n\
  *   为当地合作伙伴开展关于电子政府服务效能的应用研究；以及\n*   提供如何提供有效且安全的电子政府服务的培训。\n\n### 资金\n公共管理计划可以为地方政府提供资助写作协助，以帮助他们获得电子政府服务的资金。计划可以与州政府和联邦机构合作以识别资金来源。`MPA`\
  \ 的教师、学生和职员工还可以帮助地方政府评估私营承包商提供的网站和电子政府服务。\n\n### 应用研究\n提供活跃的应用研究可能是公共事务计划在加强地方政府电子政府能力方面能提供的最重要的援助。应用研究可以包括各种主题和项目，例如展示在线支付账单的效能、社交媒体网站的用处以及在网络上推广社区资产的价值。\n\
  \n奥古斯塔大学的 `MPA` 项目是应用研究项目的合作伙伴，这些项目正在帮助建立社区的电子政府能力。我们与奥古斯塔大学网络研究所合作，识别奥古斯塔大区网络相关职业的供需。研究包括对劳动力统计数据的分析，以及对当地雇主（企业、非营利组织和公共机构）的调查，让他们确定未来的网络相关就业需求，以及未来员工在这些职位上具有竞争力所需的教育类型。此外，我们正在了解当地机构的网络需求，以便在社区拓展中更好地服务他们。\n\
  \n### 培训\n公共事务计划可以通过提供实用的培训计划来帮助建立电子政府的行政能力。在奥古斯塔大学，由于网络研究所的资金支持，我们的项目为公共机构提供免费的电子政府在线培训。包括三个模块：\n\
  \n*   电子政府服务的概述和定义\n*   地方政府如何使用电子政府服务\n*   如何保持电子政府的安全\n\n我们希望这项培训能帮助公共机构提供有效安全的电子政府服务。\n\
  \n由于 `Facebook` 拥有近 2 亿活跃用户，且许多人通过社交媒体获取大部分新闻，公共管理需要更好地帮助社区提供电子政府服务并提供电子治理。自从互联网出现以来，私营公司在提供在线服务方面更具创新。然而，地方政府正在取得进展，特别是大城市和经理-议会形式的政府。我们的领域需要更积极地帮助中等规模和农村社区通过互联网技术提供服务。我们可以通过帮助社区获得资金、开展应用研究和提供培训来实现这一点。\n\
  \n*最初发表于 William Hatcher，《美国网络安全与地方政府》，`PA Times`，2017 年 5 月 9 日。经出版商和作者许可转载。*\n\
  \n## 第四部分：未来\n\n***\n\n## 51. 2018 年 18 大安全预测\n\nDANIEL J. LOHRMANN\n\n亚伯拉罕·林肯曾说：“最好的方法是寻找最坏的情况并希望最好的结果。”\n\
  \n温斯顿·丘吉曾说：“如果你正身处地狱，请继续走下去。”\n\n### 2018 年什么是热点且可能发生的？\n去年我们的开场白是：“你还未见过呢！”\n\n\
  毫无疑问，过去几年遗留了一些（非常相似的）预测。还有每年一次的合唱：“今年会是发生网络珍珠港或网络 9/11 事件的一年吗，从而导致国家某地区的关键基础设施瘫痪？”\n\
  \n\n\n\n\n为了全面了解安全行业预测列表和预测的广度和深度，我建议回溯过去，回顾一下 2015 年、2016 年和 2017 年之前的安全预测总结，以帮助对预测者进行打分。自我们开始以来，我们的分析流程没有发生太大变化，所有决策都是独立于公司或杂志影响的。\n\
  \n欲需更多详情，我鼓励您通过点击超链接报告查看预测详情，和或访问特定网站并下载完整的白皮书，以获取有关这些安全趋势和 2018 年预测列表的更多细节。其中许多预测对为什么会发生这种情况有更详细的解释（并有更多数据共享）。请注意，某些供应商可能要求您注册（通常是免费的）以获取其完整预测报告。\n\
  \n现在，我们准备好进入 2018 年最佳（最完整）的安全预测列表，该列表根据我的厂商中立评分系统从 1 到 18 进行了排名，并附带了荣誉提及和后期发布的预测列表。\n\
  \n## 按来源划分详细预测报告\n\n### 1. 趋势科技 (Trend Micro)\n凭借再次提供了一套令人印象深刻、全面的预测而荣得桂。趋势科技的主题是“你准备好应对范式转移了吗？”，以下是他们的顶级预测：\n\
  \n* • 在 2018 年，数字勒索将成为大多数网络犯罪分子业务模式的核心，并将推动他们进入其他计划，以获取巨额的回报。\n* • 勒索软件业务模式仍将是 2018\
  \ 年网络犯罪的主流，而其他形式的数字勒索将占据更多地。\n* • 网络分子将探索新方法来滥用 IoT 设备以牟利。\n* • 2018 年，商务电子邮件诈骗（Business\
  \ Email Compromise） 造成的全球损失将超过 90 亿美元。\n* • 网络宣传活动将利用过去垃圾邮件活动中经过多次测试的技术进行完善。\n*\
  \ • 威胁者将利用机器学习和区块链技术来扩展他们的规避技术。\n* 许多公司只有在第一起备受关注的诉讼提起时，会对《通用数据保护条例》（`GDPR`）采取明确行动。\n\
  * 企业级应用和平台将面临操纵和漏洞的风险。\n\n### 2. 赛门石 (Symantec)\n对 2018 年的广泛主题提供了另一组卓越的预测：\n\n*\
  \ • 区块链将在加密货币之外找到用途，但网络分子将专注于硬币和交易所\n* • 网络分子将利用人工智能（`AI`）和机器学习（`ML`）进行攻击\n* • 供应链攻击将成为主流\n\
  * • 无文件和轻文件恶意软件将爆发\n* • 组织仍将在软件即服务（`SaaS`）安全方面挣扎\n* • 组织仍将在基础设施即服务（`IaaS`）安全方面挣扎——由于错误、妥协和设计导致更多泄露事件\n\
  * • 金融木马造成的损失仍将超过勒索软件\n* • 昂贵的家庭设备将面临勒索\n* • IoT 设备将被劫持并用于 DDoS 攻击\n* • IoT 设备将为家庭网络提供持久访问\n\
  \n### 3. Watchguard 技术公司 (Watchguard Technologies)\n我再次喜欢 Watchguard 对预测的呈现方式！事实上，我认为他们的在线视频和信息图可能是我今年最喜欢的。然而，他们的实际预测似乎相当主流，没有提供巨大的惊喜。不过，这是一份非常扎实的列表：\n\
  \n* • 加密货币崩盘\n* • Wi-Fi 破解\n* • 企业网络保险采用率增加\n* • IoT 尸网迫使新法规\n* • Linux 攻击将翻倍\n\
  * • 多因素身份验证\n* • 黑客攻击机器\n\n### 4. 麦菲 (McAfee)\n麦菲预测了对抗性机器学习、勒索软件、无服务器应用、连接家居隐私以及儿童生成内容隐私的发展。以下是一些细节：\n\
  \n* • 麦菲实验室预测攻击者和防御者之间将发生对抗性机器学习“军备竞赛”\n* • 勒索软件将从传统的 PC 勒索演变为针对 IoT、高净值用户和企业干扰\n\
  * 无服务器应用将产生针对权限、应用依赖和数据传输的攻击机会\n* 连接家居设备将把消费者隐私让给企业营销人员\n* • 消费者应用程序收集儿童内容将带来长期声誉风险\n\
  \n### 5. 火眼 (FireEye)\n提供了卓越的预测，但需要您注册完整报告（免费）。尽管如此，这次对火眼执行领导层（包括其 CEO Kevin Mandia）的访谈，对于\
  \ 2018 年的预测是非常大开眼界的：\n\n在印太地区，火眼表示，中国和邻国仍在继续政治争端，特别是与印度、韩国、日本、菲律宾、越南和其他东南亚国家。\n\n\
  该公司警告说：“因此，作为对这些国家内部及外部政治局势的回应，组织的‘黑客行动’（hacktivism）攻击预计在新的一年里将继续并可能上升。”\n\n根据火眼的数据，他们观察到\
  \ 2017 年非中国和非俄罗斯的 APT 组增加，并预计在 2018 年发现更多。勒索软件预计在 2018 年增加，特别是管理员补丁和更新系统的速度缓慢。\n\
  \n其他在 2018 年继续使用的流行技术包括策略性网站破坏（SRC）和鱼叉式网络钓鱼，特别是在针对性攻击中。这家网络安全公司指出，我们还预计看到更多破坏性的蠕病毒和擦除器。\n\
  \n### 6. 卡巴斯基 (Kaspersky)\n在每个主要领域都提供详细的网络威胁预测。例如，他们的金融预测包括：\n\n* • 加密货币——在网络分子世界中风靡\n\
  * • 速度增加危险\n* • 欺诈服务\n* 其他卡巴斯基关于汽车、连接健康工业安全和加密货币的预测可以在这个优秀的 SlideShare 上找到。\n\n\
  ### 7. 圣地网络 (Palo Alto Networks)\n根据 Palo Alto Networks 表示，人类安全和安全将增加到机密性、完整性和可用性。\n\
  \n### 8. Forcepoint\n提供了未来一年的八个关注领域以及 2018 年的五项预测。\n\n* • 越来越多的恶意软件将具备中间人攻击（`Man\
  \ in the Middle`）意识。\n* • IoT 不会被勒索，而是成为大规模干扰的目标。\n* • 攻击者将针对实施区块链技术的系统漏洞。\n* •\
  \ 一家数据聚合将在将在 2018 年使用多种攻击方法被攻破。\n\n### 9. Imperva\n提供了 IT 专业人员需要考虑的排 5 大趋势：\n\n\
  * • 大规模云数据泄露\n* • 加密货币挖掘\n* • 恶意利用 AI/欺骗 AI 系统\n* • 网络勒索针对业务中断\n* 内部泄密\n\n### 10.\
  \ Forrester\n一如既往，Forrester 为 2018 年提供了一些独特且发人深心的预测：\n\n* • 政府不再是可靠、经过验证身份的唯一提供者\n\
  * • 更多的 IoT 攻击动机是财务收益而非混乱\n* • 网络分子将使用勒索软件关闭销售点系统\n* • 网络分子将试图破坏美国 2018 年中期选举的完整性\n\
  * • 区块链在风险投资资金和安全厂商路线图方面将超过人工智能\n* • 过于激进地搜寻内部威胁的机构将面临诉讼和 GDPR 罚款\n\n### 11. Webroot\n\
