  \n### 18. White Hat Security\n去年，Ryan O’Leary 说：“一切都不会改变。公司将继续因为简单的漏洞而被攻破。”不幸的是，我的预测是正确的，但这并不意外。这对于\
  \ 2018 年仍然是一个很好的预测。今年的新增是：“……越来越多的公司开始采用 `DevSecOps` 流程，将开发、安全和运营团队整合在一起。我们已经在公司中证明了这种方法的有效性，我们了解漏洞的数量以及修复这些漏洞的时间。通过建立以快速、安全和稳定代码为目标的单一团队，我们确保这些团队不再有冲突的优先级。”\n\
  \n## 总结\n我在这些预测和展望报告中没有看到太多缺失，但韩国冬奥会和俄罗斯世界杯世界杯（足球）明显缺失了。虽然很多人预测关键基础设施将会中断，但还没有人真正站出来说重大关键系统故障（例如戏剧性的区域或全国性停电，或医院系统故障导致的人员死亡）很可能是由于黑客攻击。尽管如此，我同意\
  \ Bruce Schneier 的观点，有人明确因网络攻击死亡时，`IoT` 将迎来监管。2018 年会这一年吗？也许吧。\n\n总之，这里还有另一句亚伯拉罕·林肯的名言，在我们迈向\
  \ 2018 年之初依然适用：\n\n“预测未来的最好方式就是创造它。”\n\n\n\n\n这并不意味着机器人将在主街上游行。相反，人工智能将使现有的网络攻击手段——如身份盗窃、拒绝服务攻击和密码破解——变得更强大、更高效。这已经足够危险了——这种黑客行为可以窃取金钱、造成情感伤害，甚至导致人员受伤或死亡。大规模的攻击可能会切断数十万人的电力，关闭医院，甚至影响国家安全。\n\
  \n作为一名研究 AI 决策的学者，我可以告诉你，对于 AI 来说，解释人类行为仍然非常困难，而且人类并不真正信任 AI 系统来做出重大决策。因此，与电影中不同，AI\
  \ 为网络攻击（以及网络防御）带来的能力不太可能立即涉及计算机自主选择目标并对其进行攻击。人们仍然需要创建攻击 AI 系统，并将其指向特定的目标。但尽管如此，将\
  \ AI 引入当今的网络犯罪和网络安全世界，将加剧攻击者与防御者之间本就已在快速变化的军备竞赛。\n\n## 更快的攻击\n\n除了计算机不需要食物和睡眠（这些需求限制了人类黑客的努力，即使是团队工作也是如此）之外，自动化可以使复杂的攻击变得更快、更有效。\n\
  \n到为止，自动化的影响是有限的。几十年来，非常基础的类 AI 能力已让病毒程序了自我复制的能力，在没有特定人类指令的情况下从一台计算机传播到另一台计算机。此外，程序员利用他们的技能将黑客攻击的不同元素自动化。例如，分布式攻击涉及在几台计算机或设备上触发远程程序以淹没服务器。2016\
  \ 年 10 月关闭互联网大部分区域的攻击就使用了这种方法。在某些情况下，常见的攻击以脚本的形式提供，允许不精通的用户选择目标并对其发起攻击。\n\n然而，AI\
  \ 可以帮助人类网络罪犯定制攻击。例如，鱼叉式网络钓鱼攻击要求攻击者拥有潜在目标的个人信息，细节如他们在何家银行开户或使用哪家医疗保险公司。AI 系统可以帮助收集、组织和处理大型数据库以关联身份信息，使这类攻击的执行变得更容易、更快速。这种工作量的减少可能会促使窃盗发起大量较小的攻击，由于其影响有限，这些攻击在很长一段时间内不会被察觉——如果能被检测到的话。\n\
  \nAI 系统甚至可以用于从多个来源汇总信息，以识别出特别容易受到攻击的人。例如，住院或在养老院的人可能在窃贼逃脱后很久之后才注意到账户里的钱丢了。\n\n##\
  \ 改进的适应性\n\n启用 AI 的攻击者在遇到阻力，或当网络安全专家修复了此前允许未经授权访问的漏洞时，反应速度也会快得多。AI 可能能够利用另一个漏洞，或者开始扫描进入系统的新方法——而无需等待人类指令。\n\
  \n这可能意味着人类响应者和防御者会发现自己无法跟上入侵攻击的速度。这可能导致编程和技术领域的军备竞赛，防御者将开发 AI 助手来识别和防御攻击——或者甚至开发具有报复攻击能力的\
  \ AI。\n\n## 避免危险\n\n自主运行可能导致 AI 系统攻击不应攻击的系统，或造成意外损害。例如，由攻击者启动的仅意图窃钱的软件可能会决定目标一个医院计算机，并导致人员受伤或死亡。无人机自主运行的潜力引发了类似的问题，即是否需要人类对目标做出决策。\n\
  \n后果和影响是巨大的，但当第一次 AI 攻击爆发时，大多数人不会注意到大变化。对于大多数受影响的人来说，结果与人类触发的攻击相同。但随着我们继续向家里、工厂、办公室和道路填充连接互联网的机器人系统，人工智能攻击的潜在影响只会增加。\n\
  \n*最初发表于 Jeremy Straub，“人工智能网络攻击正在来临——但这意味着什么？，”刊于 *The Conversation*，2017 年 8 月\
  \ 27 日。经出版者许可转载。*\n\n## 53. FCC 小组关于 5G 部署缺乏当地意见\n\nMARY ANN BARTON\n\n一些由 FCC 任命、研究加速\
  \ 5G 电信服务部署的委员会成员表示，如果没有更多来自地方政府的投入，他们的小组构成将“无济于事”。\n\n`FCC` 宽带部署咨询委员会的成立是为了提出建议（该建议将于\
  \ 11 月份提交），内容涉及如何简化地方政府关于小基站和铁塔选址的规定，以加速下一代电信服务的推出。\n\n虽然 5G 移动网络尚无标准，但电信行业成员表示，预计其速度将比目前的\
  \ 4G 网络快 10 倍。\n\n根据公共诚信中心的数据，该委员会已公开过两次，主要由电信行业高管和保守派智库的成员组成。超过 60 名地方政府官员申请加入这个\
  \ 30 人的委员会，最初只有两人被 `FCC` 选中，后来又增加了两个。\n\n该委员会地方政府代表性的匮乏引起了其内部的批评。\n\n“这目前是一项严重风险——我们有很多团体担心他们没有参与决策，如果他们觉得没有被包含在内……这些是我们想要采纳模型代码的团体，”委员会成员、`Comcast`\
  \ 监管政策副总裁 David Don 在委员会的第二次公开会议上说。“我认为，到最后，如果我们提交了一份模型代码……而他们觉得自己的投入不足，那将无济于事……。无论如何，我们都需要他们的认同。”\n\
  \n“如果[地方政府]不认同，这将会失败，我们都白浪费了时间，”宾夕法尼亚大学法学院教授兼委员会成员 Christopher Yoo 在会议上说。\n\n`FCC`\
  \ 委员会已识别出宽带部署的 189 个地方政府“障碍”，但一名 `FCC` 发言人表示，在小组报告于 11 月公布之前，无法共享这些信息。\n\n加利福尼亚州圣何塞首席创新官\
  \ Shireen Santosham 告诉该小组，地方政府有几点担忧，包括对重新分配以帮助服务不足地区电信服务的费用的限制。\n\n马里兰州蒙哥米县议员 Hans\
  \ Riemer 表示，他申请加入了 `BDAC` 委员会，尽管未被录取，但他受邀参加了 8 月 29 日市政模型代码工作小组的闭门会议；`FCC` 表示，小组正致力于“为使用公共资产制定公平合理的准则，以确保所有居民获得最佳整体结果”。该小组负责起草一份市政模型代码，以加速宽带部署，并在\
  \ 10 月或 11 月的公开会议上由委员会全体成员投票。\n\n“我真的试图向他们传达，我们需要一种协作选址的方法，”Riemer 说。“如果我们被强行推进，整个努力将陷入停滞。”\n\
  \n“没有人比地方政府更同意我们想要为居民提供更好的服务了，”他说。“但让政府让让路并不是解决方案。”\n\n\n\n与该小组的工作并行，联邦通信委员会（FCC）在春季宣布了两项规则制定程序，调查\
  \ 5G 部署问题；但该机构告诉委员会，其建议可能对这些规则制定产生任何影响，FCC 委员米克尔·奥里尔利上个月在弗吉尼亚州向观众表示，这些规则制定“旨在加速州或地方政府对铁塔选址申请的决策，并方便使用用电杆”。\n\
  \n虽然美国县协会（NACo）支持下一代电信，但反对对地方权威的预占，也反对在无线通信设施选址中预占县级职能。\n\n公众可以通过 FCC 的电子意见提交系统\
  \ `www.fcc.gov/ecfs` 向 `BDAC` 提交意见。对 `BDAC` 的意见应提交至 `GN Docket No. 17–83`。\n\n##\
  \ 与此同时，各州首府的当地分区和许可法规正遭受威胁\n\n**亚利桑那州：** `HB 2365` 于 4 月通过并于 8 月 9 日生效。它要求县级为无线供应商在路权内的用电杆上进行安装、修改或替换制定费率、费用和条款；以及在路权内小型无线设施的共用以及县级用电杆上小型无线设施的共用。\n\
  \n马里库帕县交通部（`MCDOT`）发言人尼科尔·姆恩最近告诉《北凤凰城新闻》，该部门现在允许在其交通信号灯杆上安装“小型无线设施”。这些装置的尺寸不超过端几几的大小。小型设备箱通常将安装在电线杆上或附近。\n\
  \n**加利福尼亚州：** 各县正在敦促杰里·布朗州长签署于 9 月 14 日通过的 `SB 649`。加州州县协会估计，由于费用减少，每年将损失 1 亿美元。`CSAC`\
  \ 表示“……地方将无法要求提供实物公共服务（如 Wi-Fi 访问或将市政设施连接到光纤）来交换这些公用结构的使用。缺乏证据表明该法案是必要的，因为全州的司法辖区已经与供应商合作，在公用杆子上安装了类似的天线。”\n\
  \n`CSAC` 在《萨克拉门托公报》发表的专文中称当时的拟议立法是“一场三重剥削：社区失去了解决视觉破败现象的灵活性，纳税人因租赁收入受限而亏损，居民仍需为无线服务支付同样的高昂价格。同时，这些供应商仍然不会服务加利福尼亚州的许多弱势社区。”\n\
  \n**特拉华州：** 约翰·卡尼州长（民主党）上个月签署了 `HB 189`；新法允许运营商及其合作伙伴直接通过州交通部申请在公共路权内放置小型微基站。\n\n\
  **佛罗里达州：** 里克·斯科特州长（共和党）于 6 月 23 日签署了新法 `HB 687`，将附件费用限制在 150 美元；根据某些估计，佛罗里达州各县每年将损失高达\
  \ 1.45 亿美元的费用。六个县已发布了设备放置禁令。佛塞米诺尔县委员会主席约翰·霍兰最近告诉《奥兰多哨报》：“这确实剥夺了我们在路权内监管手机设施的能力。这些都在路权内。它们属于公众，而这些是使用路权的私人手机公司。”各县必须在\
  \ 2018 年 1 月 1 日或自其首次申请起三个月内制定符合新法的地方性条例。\n\n**纽约州：** `SB 6687` 指示公共服务委员会在某些情况下禁止在现有用电杆上安装无线设备。\n\
  \n**弗吉尼亚州：** 特里·麦考尔利夫州长（民主党）签署了 `SB 1282`，允许电信公司在铁塔、建筑、用电杆、灯杆、旗杆、标志牌和水塔上安装“小型微基站设施”。根据新法，公司在许可申请中为最多五个小型微基站支付\
  \ 100 美元。新法还禁止地方政府对考虑分区申请采取禁令。\n\n明尼苏达州、北卡罗来纳州、俄亥州和德克萨斯州也签署了新的小型微基站无线立法，这些城市拥有电信选址权。\n\
  \n原文发表于 Mary Ann Barton，“FCC Group on 5G Deployment Short on Local Input,” *NACo\
  \ County News*, 2017 年 9 月 18 日。经出版者许可转载。*\n\n## 54. 在网络领域进行战略思考\n\n约翰·奥布莱恩\n\n\
  十年前，参议员汤姆·科伯（共和党–俄拉荷马州）观察到“美国人有一个疯狂的想法，即使钱是政府花掉，他们也应该从中获得回报。这是一个简单的概念，在政策术语中我们称之为基于绩效的预算。我知道我是议院的新人，但我对华盛顿通过衡量绩效来追究责任的阻力之大感到惊讶。”\n\
  \n通过衡量绩效来追究责任已几乎成为公共管理人员的日常工作内容，并已嵌入联邦组织的业务流程和政策中[参考特朗普总统的行政命令，该要求联邦机构负责人提交重组计划，以提高其机构的效率、有效性和问责制]。尽管如此，科伯前参议员对通过衡量绩效来追究责任的阻力的观察仍然是我们文化中一个有效的一部分。这一点在网络空间领域尤为明显，在该领域，基于结果的绩效概念——*网络绩效管理*在很大程度上还没有定义。\n\
  \n### 网络绩效管理\n\n网络空间通常被定义为以信息为中心的领域，其特征是用于存储、修改和交换信息的电子媒体；比传统的后台信息技术（IT）服务更多，网络空间还包括网络安全、网络犯罪和网络战争。联邦机构已围绕网络空间开发了组织结构，包括国务院网络问题协调员办公室和国土安全部网络基础设施与韧性政策办公室。\n\
  \n网络绩效管理可以定义为：通过基于结果的绩效衡量来实现结果证明的概念，这正如 1993 年《政府绩效与结果法案》(GPRA）和 2010 年《GPRA 现代化法案》所传达的。虽然许多网络组织在理论上认可绩效管理概念，但挑战在于将绩效计划付诸实践，真正关注组织的效率、有效性和问责制。网络组织经常退回到基于\
  \ IT 服务的传统绩效衡量，这些可能无法解决战略层面的组织问题。\n\n### 网络中的战略目标与任务\n\n《GPRA 现代化法案》规定，公共部门组织应制定战略计划，将使命/愿景声明、战略目标、战略任务、绩效衡量和战略计划联系起来，这些应是基于结果的证明性证据。网络组织通常没有这样做。人们可以从“*做什么-如何做*”模型的角度来思考此，机构的战略目标和战略任务是预期的结果（“*做什么*”），而战略计划和资源是实现结果的方法（“*如何做*”\\\
  ]。\n\n\n\n\n\n战略目标是实现组织使命和愿景的第一道防线。它们定义了行动方案和/或状态，如果这些状态得以完成或实现，将使组织能够更好地支持其`mission`\
  \ 并向其`vision`进。根据定义，战略目标在本质上具有“战略性”；也就是说，它们的范围很大，涉及与组织成功战略相关的高级问题（例如：`创新领导力、卓越运营、客户亲密性`）。战略目标应该意味着组织希望实现的内容方面应进行某种形式的`change`（例如：`改进、增强、增加/减少`）。\n\
  \n战略目标是对战略目标的详细阐述，是对目标的“拆解”。\n\n每个战略目标都应该为贵组织努力实现的战略目标提供更具体的细节说明。战略目标的表述方式应便于未来评估目标是否已经或正在被实现，并确保其是直接可衡量的，且以结果/产出为导向的。考虑战略目标的一种常用方法是使用“SMART”准则：\n\
  \n- **S: Specific（具体的）**——目标应该指明你想实现什么。例如，一个军事医疗指挥部希望在 12 个月内实现 93% 的患者满意度。\n- **M:\
  \ Measureable（可衡量的）**——你应该能够衡量自己是否达到了目标。例如，这 12 个月内 93% 的患者满意度评分意味着每个月的患者满意度都可以根据特定目标进行衡量。\n\
  - **A: Achievable（可实现的）**——你设定的目标确实是可以达到的。例如，12 个月内实现 93% 的目标是可行的吗？\n- **R: Realistic（现实的）**——在考虑到所有其他限制的情况下，你能现实地实现这些目标吗？例如，考虑到指挥部的技能和资源，12\
  \ 个月内 93% 的目标是的吗？\n- **T: Timely or Time-Bound（及时的或时间限制的）**——关键在于目标必须明确你想何时实现该目标。例如，指挥部设定了\
  \ 12 个月的期限来达到 93% 的市场份额目标。\n\n### 需要什么\n\n网络安全组织需要一种网络性能管理方法，该方法应包含以组织为宏观战略层面重点的战略目标和任务。战略目标的编写方式应该清晰地显示网络安全责任向整个组织的转移。战略目标应该是可衡量的，并包含基于结果的网络性能指标。以下是三个说明平衡良好的战略方法的目标示例：(1)\
  \ 满足客户的网络安全需求；(2) 缩短网络安全系统升级的周期；(3) 提高网络安全员工的熟练程度。\n\n*最初发表于 John O’Brien，“网络领域的战略性思维”，*PA\
  \ Times*，2017 年 10 月 3 日。经出版者许可转载。*\n\n## 55. 互联网、电子邮件和计算机使用政策\n\n德克萨斯州劳动力委员会\n\n\
  ### 政策声明\n\n使用`XYZ Company`（公司）的电子系统（包括计算机、传真机和所有形式的互联网/内部网访问）仅限用于公司业务和授权用途。对电子邮件系统或互联网的简短和偶尔个人使用是可以接受的，只要这种使用不过度或不当、发生在个人时间（午餐或其他休息时间），并且没有给公司带来费用或损害，或以其他方式违反本政策。\n\
  \n如果使用干扰了正常工作职责、响应能力或执行日常工作活动的能力，则定义为“过度”使用。电子通信不应推销或销售与公司业务无关的产品或服务；不应分散、恐吓或骚扰同事或第三方；或干扰工作场所。\n\
  \n使用公司计算机、网络和互联网访问是管理层授予的特权，并可能因为在这些系统上的不当行为而随时撤销，包括但不限于：\n\n- 发送连环信，或以任何方式参与与公司合法目的无关的未经请求商业电子邮件（`spam`）的创建或传输；\n\
  - 参与私人或个人业务活动，包括过度使用即时消息和聊天室（见下文）；\n- 访问未获得有权授权的人员访问或授权的网络、服务器、驱动器、文件夹或文件；\n- 未经授权复制公司文件或其他公司数据；\n\
  - 销毁、删除、擦除或隐藏公司文件或其他公司数据，或以其他方式使此类文件或数据对公司或公司系统的其他授权用户无法或无法访问；\n- 误充自己或公司；\n- 以任何方式违反美国或任何其他国家或州、市、省份或其他当地司法管辖区的法律法规；\n\
  - 参与非法或恶意活动；\n- 故意传播任何病毒、蠕虫、木马、后门程序代码或其他旨在干扰、禁用、损害或以其他方式伤害公司网络或系统或其他任何个人或实体的代码或文件；\n\
  - 在公共或私人消息中使用攻击性的、亵俗的、威胁性的、种歧视、性别歧视或其他令人反感的语言；\n- 发送、接收或访问色情材料；\n- 参与政派政治；\n- 导致公司网络或系统的拥堵、中断、禁用、更改或损坏；\n\
  - 维护、组织或参与与工作无关的网页日志（`blogs`）、网络日志、“聊天室”或私人/个人/即时消息；\n- 在离开你分配的任何安全、受控访问的计算机或其他形式的电子数据系统时，未能注销（log\
  \ off）；\n- 使用娱乐性游戏；和/或\n- 绕过或尝试破解公司系统和应用程序的安全限制。\n\n*重要例外：*根据联邦法律，你可以使用公司的电子系统与其他员工讨论你及同事的雇佣条款和条件。然而，任何此类讨论应在非值班时间进行，且不应干扰你或同事的分配职责。你必须遵守同事提出的不参与此类讨论的请求。\n\
  \n严禁使用公司电子系统访问、创建、查看、传输或接收种族歧视、性别歧视、威胁性或其他反感或非法的材料（定义为任何视觉、文本或听觉实体、文件或数据）。此类材料违反了公司的反骚扰政策，负责员工将面临纪律处分。利用公司资源进行非法活动可能导致纪律处分，最高包括解雇和刑事`prosecution`。公司将遵守执法和监管机构对个人互联网活动、电子邮件使用和/或计算机使用的日志、日记、存档或文件的合理请求。\n\
  \n除非本政策明确授予，否则明确禁止对公司电子系统的任何非业务用途。\n\n如果你违反了这些政策，可能会面临纪律处分，最高包括解雇。\n\n\n\n\n\n#\
  \ 电子邮件、互联网访问及计算机文件的所有权与访问；无隐私预期\n\n公司对其使用的任何计算机、网络或其他信息系统中的所有数据和文件拥有所有权，并对使用任何公司系统或通过公司访问任何计算机网络发送或接收的所有数据和文件拥有所有权，前提是这些权利未被与知识产权相关的法律所取代。公司还保留监控电子邮件（包括个人/私密/即时消息系统）及其内容的权利，以及员工对互联网以及用于创建、查看或访问电子邮件和互联网内容的计算机设备的所有使用监控。员工必须意识到，使用公司设备或公司提供的互联网访问发送和接收的电子邮件（包括在使用此类系统或访问时使用的网页消息系统）并非私密，并且随时受到公司官员的查看、下载、检查、发布和存档。公司有权检查存储在网络私区域或个人计算机或存储介质上的任何及所有文件，以确保符合公司政策以及州和联邦法律。未经相关员工或适当公司官员的事许可，任何员工均不得访问另一员工的计算机、计算机文件或电子邮件。\n\
  \n公司在其电子信息系统中使用的软件允许授权人员进行监控，并会创建和存储在这些系统中输入、接收、发送或查看的任何消息、文件或其他信息的副本。对于在公司设备或通过互联网访问进行、发送、执行或查看的任何信息或活动，不存在隐私预期。因此，员工应假设他们在公司电子信息系统上进行的任何操作、输入、输入、发送、接收和查看的内容都以电子方式存储，并可能随时接受检查、监控、评估和公司使用。此外，使用公司系统和互联网访问发送或接收本应受任何保密或披露豁权限制的文件或其他数据的员工，特此放弃其可能拥有的主此类保密或豁权的任何权利。希望维护其保密权或披露豁权的员工必须使用公司系统或公司提供的互联网访问以外的手段发送或接收此类信息。\n\
  \n公司已许可出于业务目的使用某些商业软件应用程序。第三方保留此类软件的所有权和发行权。任何员工均不得创建、使用或发行不符合软件许可协议的此类软件。违反本政策可能导致纪律处分，最高可解雇。\n\
  \n# 电子邮件的机密性\n\n如上述，电子邮件随时受到监控，特定信息的发布受适用的州和联邦法律以及公司关于保密的规则、政策和程序的限制。现有的管理机密信息共享的规则、政策和程序也适用于通过商业软件共享信息。由于任何消息都有在未经你许可或知情的情况下被共享，因此在使用电子邮件处理非工作相关信息时，应遵循的规则是：决定你是否会将带有你签名的信息发布在办公室公告板上。\n\
  \n任何员工（包括系统管理员和主管）访问电子邮件和计算机系统文件以满足对他事务好奇均为违反公司政策，除非此类访问与该员工的工作职责直接相关。被发现从事此类活动的员工将受到纪律处分。\n\
  \n# 电子邮件篡改\n\n接收到的电子邮件消息在未经发送者许可的情况下不得更改；也不应更改电子邮件并转发给其他用户。\n\n# 互联网政策声明\n\n互联网旨在推进公司的使命，为公司的客户和员工提供最高质量的有效服务。主管应与员工合作，确定使用各种互联网/内网访问模式的适当性，这些模式作为业务工具提供给可能将其用于研究和职业发展的员工。对互联网资源有限的个人使用是对禁止个人使用计算机设备的一般禁止的特殊例外。员工对因违反公司安全政策、版权和许可协议而造成的任何及所有损害承担个人责任。所有公司政策和程序均适用于员工在互联网上的行为，特别但不限于涉及知识产权、保密、公司信息发布、行为标准、滥用资源、反骚扰以及信息和数据安全。\n\
  \n# 个人电子设备\n\n公司禁止在工作场所使用任何类型的摄像手机、手机摄像头、数码相机、摄影摄像机或其他录像设备记录他人的图像或其他个人信息，如果此类使用构成对保护个人免受骚扰或侵犯隐私权的民事或刑事法律的违反。员工可以在非工作时间内不违反此类民事或刑事法律的方式进行拍照和录像。公司保留对此类设备的非法使用向适当执法部门报告的权利。\n\
  \n由于任何未经授权的访问可能导致数据丢失或中断，从而对公司电子资源造成重大损害或数据丢失，员工不应将个人计算机或数据存储设备（如软盘、CD/DVD、外硬盘、USB/闪存盘、“智能”手机、iPod/iPad/iTouch\
  \ 或类似设备、笔记本电脑或其他移动计算设备，或其他数据存储介质）带到工作场所并连接到公司电子系统，除非公司明确允许。\n\n\n\n\n违反本政策，或在本文政策涵盖的情况下，未允许对任何设备进行检查，将导致纪律处分，根据违规行为的严重程度和重复性，处分最高可达并可能包括立即终止劳动关系。此外，员工可能面临来自公司、执法部门或因违规行为受损的个人所承担的民事和刑事责任。\n\
  \n*公共文件，最初发布于德克萨斯州劳工委员会，“互联网、电子邮件和计算机使用政策”，http://www.twc.state.tx.us/news/efte/internetpolicy.html。\n\
  \n## 56. 冻结信用报告的消费者\n\nJULIE APPLEBY\n\n在今年信誉评级机构富盛（Equifax）发生大规模数据泄露事件后，一些冻结了信用报告的美国人如果尝试在联邦医疗法市场购买保险，可能会可能会大吃一惊。这种冻结可能会导致申请过程的延迟。\n\
  \n在网上注册市场计划，需要消费者（尤其是首次参保者）通过回答与其信用历史相关的问题来证明自己的身份。这会同时影响寻求补贴的人和不寻求补贴的人。\n\n但问题在于：俄亥俄州都柏林经纪公司\
  \ Spiralight Group 的创始人马修·伯恩（Matthew Byrne）表示，阻止访问信用报告的消费者往往“无法通过身份验证部分”。\n\n这带来了问题，因为《平等医疗法案》健康保障的开放注册季节时间正在流逝，该季节在大多数州将于周五结束。\n\
  \n“您的身份未通过验证，”`healthcare.gov` 警告道。根据经纪人发给 KHN 的截图，页面建议申请人拨打“帮助热线”，由另一家与市场合作的信用报告公司安信（Experian）运营，或者拨打\
  \ `healthcare.gov` 服务中心。\n\n如果申请人能够成功回答该公司提出的问题，拨打安信电话有时可以解决问题。根据预算和政策优先中心 2016\
  \ 年的一份报告，这些问题可能包括关于以前地址、拥有的车辆或当前抵押贷款人的查询。\n\n但并不总是如此。Geoff Dellapenna 说，在他和他的经纪人在在线申请表上输入部分信息后不久，屏幕显示了其身份无法通过验证的警告。他们需要先拨打另一个电话。\n\
  \n“我直接停了，”46 岁的来自乔治亚州坎顿的 Dellapenna 说，“我对整个过程的繁琐感到非常沮丧，我无法进行下去了。”\n\n他现在正与经纪人合作，看看是否可以为公司购买小团体保险——完全避开\
  \ `healthcare.gov` 网站。\n\n消费者也有解决办法：申请人可能需要上传或邮寄文件。一些经纪人建议客户在加入 ACA 之前，通过拨打三大信用评级机构（富盛\
  \ Equifax、安信 Experian 和 TransUnion）的电话来“解冻”他们的信用报告。注册后可以恢复冻结。\n\n但这些选择可能需要时间。随着\
  \ 12 月 15 日截止日的快速临近，经纪人说，如果人们等到最后一刻，他们会感到非常不悦。\n\n“这一切并不简单，”德克萨斯州威奇塔瀑尔斯市的经纪人 Kelly\
  \ Fristoe 说。\n\nFristoe 表示，关于信用冻结和身份验证的话题今年在经纪人论坛上频繁出现。此外，他补充说，注册过程一直很顺利。卫生与人类服务部的一位发言人表示，使用服务三个州的\
  \ `healthcare.gov` 的消费者在申请时不需要解冻信用，“我们也不建议为了身份证明采取那一步。”她说，上传或邮寄信息通常是有效的。\n\n根据该政策报告，大多数运行自己的\
  \ ACA 注册市场的州也使用安信系统进行身份验证，尽管至少有两个州——纽约州和加利福尼亚州——修改了流程以帮助避免某些延迟。\n\n例如，纽约州在使用安信之外，还使用了州机动记录和其他数据——并有一个专门的认证协助中心来帮助申请人通过身份验证。加利福尼亚州也使用了协助人员来帮助避免某些延迟，报告称。\n\
  \n在富盛披露黑客窃取了 1300 万美国人的信息后，冻结限制了身份窃用者利用被盗信息开设新账户。伯恩表示，信用冻结并不是申请人面临延迟的唯一原因。\n\n有时，他们因为身份窃用而在账户上设置了欺诈。或者他们很年轻，没有信用历史。\n\
  \n但在所有情况下，只要申请人在开放注册结束前提交申请，他们就可以获得特殊注册期，”预算和政策优先中心的高级分析师 Shelby Gonzales 表示。“在这种情况下，她的建议是拨打\
  \ `healthcare.gov` 服务中心，告诉他们你通过了身份证明，他们应该能够帮助你激活注册。”\n\n*最初发布于 Julie Appleby，“Consumers\
  \ Who Froze Their Reports，”*Kaiser Health News*,2017 年 12 月 13 日。经转载。\n\n## 附录 A\
  \ 术语表\n\nJOAQUIN JAY GONZALEZ III\n\n**访问:** 与系统通信或其他交互的能力，使用系统资源处理信息，获取系统中信息的知识或控制系统组件和功能的能力。\n\
  \n**访问控制**: 检测并拒绝未经授权访问并允许授权访问信息系统或物理设施的过程。\n\n**访问控制机制**: 设计用于检测并拒绝未经授权访问并允许授权访问系统或物理设施的安全措施。\n\
  \n**活动攻击**: 由蓄意威胁源实施的实际攻击，试图更改系统、资源、数据或操作。\n\n**活动内容**: 能够在无用户显式干预的情况下自动执行或触发操作的软件。\n\
  \n**高级持续性威胁 (APT)**：拥有高水平专业知识和大量资源的对手，能够通过多种攻击向量（例如网络、物理和欺骗）创造机会实现其目标。\n\n\n\n\n\
  - `antivirus software`: 一种监控计算机或网络的程序，用于检测或识别主要类型的恶意代码，并防止或控制恶意软件事件，包括删除或中和恶意代码。\n\
  - `attack`: 尝试未经授权地访问系统服务、资源或信息，或试图破坏系统完整性的尝试。\n- `attack method`: 攻击者在对信息或信息系统进行攻击时可能使用的方式、技术或手段。\n\
  - `attack path`: 攻击者为了计划、准备和执行攻击而采取或可能采取的步骤。\n- `attack pattern`: 类似的网络事件或行为，可能表明攻击已经发生或正在发生，导致安全违规或潜在的安全违规。\n\
  - `attack signature`: 一种可以被搜索的或用于与先先识别的攻击进行匹配的特征或独有模式。\n- `attack surface`: 攻击者可以进入系统并可能造成损害的一系列方式。\n\
  - `authentication`: 验证实体（用户、进程或设备）的身份或其他属性的过程。\n- `authenticity`: 一种通过加密方法实现的属性，即真实性且且可验证、可信赖，从而对传输、信息或消息的有效性，或信息或消息的发送者产生信任。\n\
  - `authorization`: 通过评估适用的访问控制信息，确定主体是否允许对特定资源具有指定类型的访问的过程。\n- `behavior monitoring`:\
  \ 观察用户、信息系统和进程的活动，并根据组织策略和规则、正常活动基准、阈值和趋势对活动进行衡量。\n- `blacklist`: 一个被阻止或被拒绝权限或访问的实体列表。\n\
  - `Blue Team`: 在模拟攻击者（即 `Red Team`，红队）攻击时负责防御企业信息系统的小组，通常是根据由中立小组（即 `White Team`，白队）建立并监控的规则所进行的实战演习的一部分。\n\
  - `bot`: 一台连接到互联网的计算机，被秘密植入恶意逻辑，在远程管理员的命令和控制下执行活动。\n- `bot master`: 僵尸网络的控制者，从远程位置为僵尸网络中的受感染计算机提供方向指导。\n\
  - `botnet`: 被恶意代码感染并在跨网络控制的计算机集合。\n- `bug`: 信息系统或设备中意料之外且较小的缺陷、故障、漏洞或不完美之处。\n- `ciphertext`:\
  \ 以加密形式存在的数据或信息。\n- `cloud computing`: 一种模型，允许按需对共享的可配置计算能力或资源池（例如网络、服务器、存储、应用程序和服务）进行网络访问，且这些资源可以以最少的管理努力或服务提供商交互进行快速配置和释放。\n\
  - `computer network defense`: 为防御计算机网络内部未经授权的活动而采取的。\n- `Computer Network Defense\
  \ Analysis`: 网络防御安全工作，相关人员：利用防御措施和从各种来源收集的信息，识别、分析并报告网络内发生或可能发生的事件，以保护信息、信息系统和网络免受威胁。\n\
  - `Computer Network Defense Infrastructure Support`: 网络防御安全工作，相关人员：测试、实施、部署、维护、审查和管理所需的底层硬件和软件，以有效管理计算机网络防御服务提供商的网络和资源；监控网络以积极修复未经授权的活动。\n\
  - `Continuity of Operations Plan`: 一份规定核心能力和关键业务持续执行程序的文件。\n- `critical infrastructure`:\
  \ 系统和资产（无论是物理还是虚拟），对社会至关重要，以至于其故障或破坏可能对经济、公共健康或安全产生破坏性影响。\n- `cryptanalysis`: 在击败信息的加密保护时执行的操作。\n\
  - `cryptography`: 使用数学技术提供安全服务，如机密性、数据完整性和实体身份验证。\n- `Customer Service and Technical\
  \ Support`: 网络安全工作，相关人员：解决问题、安装、配置、故障排除并提供维护。\n- `cyber exercise`: 一项计划活动，通过模拟网络中断来开发或测试能力。\n\
  - `cyber infrastructure`: 电子信息通信系统及其包含的信息。\n- `Cyber Operations`: 网络安全工作，相关人员：执行活动收集犯罪或外国情报，以缓解可能或真实的威胁。\n\
  - `Cyber Threat Indicator`: 用于描述或识别恶意侦察所需的异常通信模式。\n- `cybersecurity`: 一种活动或过程、能力或状态，使信息和通信系统及其包含的信息免受损害、未经授权的使用或修改或利用。\n\
  - `cybersecurity threat`: 一种不受美国宪法第一修正案保护的、通过或对信息系统进行的、可能对存储、处理或传输的信息系统或信息的可用性、机密性或完整性产生不利影响的行动。\n\
  - `cyberspace`: 相互依赖的信息技术基础设施，包括互联网、电信网络、计算机系统以及嵌入式处理器和控制器。\n- `data breach`: 敏感信息未经授权地移动或披露给组织外的、未经授权拥有或查看信息的方。\n\
  - `data integrity`: 数据完整、完好且可靠，且未以未经授权或意外的方式修改或破坏的属性。\n- `data loss`: 意中或意外删除数据、忘记存储位置或暴露给未经授权方的结果。\n\
  - `data loss prevention`: 防止敏感数据离开安全边界的一系列程序和机制。\n- `data mining`: 分析现有大数据集以发现此前未揭示的模式或相关性的过程或技术。\n\
  - `data theft`: 故意或蓄意窃取行为。\n- `decipher`: 使用加密系统将密文转换为明文。\n- `decode`: 使用代码将编码文本转换为明文。\n\
  - `decryption`: 将密文转换为原始明文的过程。\n\n\n\n\n\n- **防御性措施 (Defensive Measure)**：应用于信息系统或存储在信息系统上、由信息系统处理或通过信息系统传输信息的行动、设备、程序、签名、技术或其他措施，用于检测、预防或缓解已知或怀疑的网络安全威胁或安全漏洞。\n\
  - **拒绝服务 (Denial of Service, Dos)**：一种阻止或损害信息系统资源或服务的被授权使用的攻击。\n- **数字取证 (digital\
  \ forensics)**：为了调查目的，用于收集、保留和分析系统相关数据（数字证据）的流程和专门技术。\n- **数字签名 (digital signature)**：使用私钥通过加密过程计算出的值，并附加到数据对象，从而对数据进行数字签名。\n\
  - **中断 (disruption)**：导致操作或功能发生不可接受长度的非计划中断的事件。\n- **分布式拒绝服务 (DDoS)**：一种利用大量系统同时执行攻击的拒绝服务技术。\n\
  - **动态攻击面 (dynamic attack surface)**：信息系统特征的自动化、即时变化，以阻止攻击者的行动。\n- **电子签名 (electronic\
  \ signature)**：与电子文档关联的任何电子形式的标记，旨在签署该文档。\n- **加密 (encipher)**：通过加密系统将明文转换为密文。\n\
  - **编码 (encode)**：通过代码将明文转换为密文。\n- **加密 (encrypt)**：涵盖“加密(encipher)”和“编码(encode)”的通用术语。\n\
  - **加密过程 (encryption)**：将明文转换为密文的过程。\n- **企业风险管理 (enterprise risk management)**：一种全面的风险管理方法，通过涉及组织内的人员、流程和系统，提高管理可能阻碍组织实现目标的风险的决策质量。\n\
  - **数据外泄 (exfiltration)**：从信息系统向外未经授权传输信息。\n- **漏洞利用 (exploit)**：一种违反安全策略、突破网络或信息系统安全的技术。\n\
  - **利用分析 (Exploitation Analysis)**：网络安全工作，由人员执行：分析收集的信息以识别漏洞和潜在的利用可能。\n- **暴露 (exposure)**：处于不受保护的状态，从而允许攻击者访问其可用于进入系统或网络的信息或能力。\n\
  - **故障 (failure)**：系统或组件无法在指定的性能要求内执行其所需的功能。\n- **联邦实体 (federal entity)**：美国部门或机构或此类部门或机构的任何组成。\n\
  - **防火墙 (firewall)**：限制网络与/或信息系统之间流量的能力。\n- **黑客 (hacker)**：尝试或获得信息系统访问权限的授权用户。\n\
  - **哈希值 (hash value)**：对文件等一组数据应用数学算法后得出的数值。\n- **哈希处理 (hashing)**：对一组数据应用数学算法以产生代表该数据的数值（“哈希值”）的过程。\n\
  - **ICT 供应链威胁 (ICT supply chain threat)**：通过利用信息和通信技术（ICT）系统的供应链（包括获取过程）而实现的人为威胁。\n\
  - **身份和访问管理 (identity and access management)**：用于管理主体及其访问特定对象的身份验证和授权的方法和流程。\n-\
  \ **事件 (incident)**：实际或可能导致对信息系统或系统处理、存储或传输的信息产生不利后果的发生，并可能需要采取响应行动来缓解后果。\n- **事件管理\
  \ (incident management)**：对可能对信息或信息系统产生不利后果的实际或潜在发生事件的相关活动进行管理和协调。\n- **事件响应 (incident\
  \ response)**：处理事件短期直接影响的活动，并可能支持短期恢复。\n- **事件响应计划 (incident response plan)**：一组预定的且记录在案的程序，用于检测和响应网络事件。\n\
  - **信息通信技术 (Information and Communications Technology)**：任何处理、传输、接收或交换数据或信息的信息技术、设备或互连系统或子系统。\n\
  - **信息保证合规 (Information Assurance Compliance)**：网络安全工作，由人员执行：监督、评估和支持必要的文档、验证和认证过程，以确保新的\
  \ IT 系统满足组织的信息保证和安全要求。\n- **信息安全策略 (information security policy)**：规定组织如何管理、保护和分配信息的指令、法规、规则和实践集合。\n\
  - **信息共享**：交换数据、信息和/或知识以管理风险或响应事件。\n- **信息系统 (Information System)**：工业控制系统，例如监控控制数据采集系统（SCADA）、分布式控制系统（DCS）和可编程逻辑控制器（PLC）。\n\
  - **信息系统安全运营 (Information Systems Security Operations)**：网络安全工作，由人员执行：监督网络环境内外信息系统的信息保证计划；可能包括采购职责（例如信息系统安全官）。\n\
  - **互操作性 (interoperability)**：两个或多个系统或组件交换信息并使用已交换信息的能力。\n- **入侵 (intrusion)**：绕过网络或信息系统安全机制的非法行为。\n\
  - **入侵检测 (intrusion detection)**：分析来自网络和信息系统的信息以确定是否发生了安全违规或安全违反的过程和方法。\n- **密钥\
  \ (key)**：用于控制加密操作（如解密、加密、签名生成或签名验证）的数值。\n- **密钥对 (key pair)**：公钥及其对应的私钥。\n- **键盘记录器\
  \ (keylogger)**：跟踪击键和键盘事件的软件或硬件（通常是秘密进行的），用于监控信息系统用户的操作。\n- **宏病毒 (macro virus)**：一种恶意代码，附着于文档，并利用文档应用程序的宏编程功能执行、复制并传播或扩散自身。\n\
  - **恶意小程序 (malicious applet)**：一种自动下载并执行的小型应用程序，用于在信息系统上执行未经授权的功能。\n- **恶意代码 (malicious\
  \ code)**：旨在执行未经授权的功能或过程的程序代码，该过程将对信息系统的机密性、完整性可用性产生不利影响。\n- **恶意网络命令控制 (malicious\
  \ cyber command and control)**：一种未经授权远程识别、访问或使用信息系统或存储在、处理自或通过信息系统传输的信息的方法。\n- **恶意逻辑\
  \ (malicious logic)**：故意包含或插入系统的硬件、固件或软件，用于执行对信息系统的机密性、完整性和可用性产生不利影响的未经授权的功能或过程。\n\
  - **恶意侦察 (malicious reconnaissance)**：一种主动探测或被动监控信息系统的方法，旨在识别系统的漏洞，如果这种方法与已知或怀疑的网络安全威胁相关。\n\
  - **恶意软件 (malware)**：通过执行未经授权的功能或过程损害系统运行的软件。\n- **缓解 (mitigation)**：应用一种或多种措施来减少意外发生的概率和/或减轻其后果。\n\
  - **移动目标防御 (moving target defense)**：呈现动态攻击面，增加攻击者探测、攻击或在网络目标中维持存在所需的工作量。\n\n\n\n\
  \n\n`network resilience`: 网络弹性：网络具备的能力：(1) 提供持续运行的能力（即对中断具有高度抵抗力，并在损坏后以后降级模式运行）；(2)\
  \ 在发生时能够有效恢复；(3) 扩展以满足快速或不可预测的需求。\n\n`non-federal entity`: 非联邦实体：指任何私有实体、非联邦政府机构或部门，或州、部落或地方政府（包括其政治划分区域、部门或组成部分）。\n\
  \n`operational exercise`: 业务演练：基于行动的演练，人员对事件场景的反应进行演练，基于他们对计划、程序、角色和职责的理解。\n\n`passive\
  \ attack`: 被动攻击：由蓄意的威胁源实施的实际攻击，试图从系统中学习或利用信息，但并不尝试更改系统、其资源、数据或其操作。\n\n`penetration\
  \ testing`: 渗透测试：一种评估方法，评估人员从中寻找漏洞并尝试绕过网络和/或信息系统的安全功能。\n\n`Personal Identifying\
  \ Information`: 个人识别信息：允许直接或间接推断出个人身份的信息。\n\n`phishing`: 钓鱼攻击：一种数字形式的社会工程学，旨在欺骗个人提供敏感信息。\n\
  \n`privacy`: 隐私：确保实体的某些信息的机密性和访问受到保护。\n\n`private entity`: 私有实体：任何个人或私有团体、组织、所有制、合伙、信托、合作社、公司或其他商业或非盈利实体，包括其官员、员工或代理。\n\
  \n`ransomware`: 勒索软件：这种网络攻击感染软件并锁定对数据的访问，直到支付赎金。\n\n`recovery`: 恢复：事件或事件发生后的活动，旨在在短期和中期恢复基本服务和服务，并在长期内完全恢复所有能力。\n\
  \n`Red Team`: 红队：一个获得授权并组织的团体，用于模拟潜在对手对企业网络安全态势的攻击或剥利用能力。\n\n`Red Team exercise`:\
  \ 红队演练：一种反映真实情况的演练，以模拟对手尝试攻击或利用企业信息系统漏洞的方式进行。\n\n`rootkit`: 根部包：一组安装在信息系统中且具有管理员级访问权限的软件工具，设计用于隐藏工具的存在、维持访问权限并掩盖工具所执行的活动。\n\
  \n`secret key`: 密钥：一种同时用于加密和解密的密码学密钥，实现对称密钥加密方案的运行。\n\n`security automation`: 安全自动化：利用信息技术代替手动流程进行网络事件响应和管理。\n\
  \n`security control`: 安全控制：用于防止未经授权的努力不利影响信息系统或其信息的机密性、完整性和可用性的采用的管理、运营和技术控制。\n\n\
  `security policy`: 安全策略：一条或一组规则，规定组织信息和服务的接受使用达到可接受的风险水平，以及保护组织信息资产的手段。\n\n`security\
  \ vulnerability`: 安全漏洞——硬件、软件、过程或程序的任何属性都可能导致或促进安全控制的失效。\n\n`situational awareness`:\
  \ 态感知：基于收集的信息、观察和分析以及知识或经验，理解有关当前和发展的安全态势及风险的信息。\n\n`Software Assurance and Security\
  \ Engineering`: 软件保障与安全工程：网络安全工作，其中人员：按照软件保障最佳实践开发并编写/编码新的（或修改现有的）应用程序、软件或专用实用程序。\n\
  \n`spam`: 垃圾邮件：滥用电子信息系统无差别地发送未经请求的批量信息。\n\n`spoofing`: 伪装：伪造传输的发送地址，以非法[未经授权]进入安全系统。\n\
  \n`spyware`: 间谍软件：在系统用户或所有者不知情的情况下，秘密或偷偷安装在信息系统中的软件。\n\n`Structured Threat Information\
  \ Expression (STIX)`: 一种标准化的描述网络威胁信息的语言，旨在方便机器阅读而非人类阅读。\n\n`System Administration`:\
  \ 系统管理：网络安全工作，其中人员：安装、配置、故障排除和维护服务器配置（硬件和软件）以确保其机密性、完整性和可用性；还管理账户、防火墙和补丁；负责访问控制、密码和账户创建与管理。\n\
  \n`system integrity`: 系统完整性：信息系统不受损害地执行预期功能，免受故意或无意操纵的属性。\n\n`Systems Security Analysis`:\
  \ 系统安全分析：网络安全工作，其中人员：执行系统的集成/测试、操作和维护。\n\n`Systems Security Architecture`: 系统安全架构：一种工作，其中人员：开发系统概念并将技术和环境（例如法律和法规）转化为系统和安全设计。\n\
  \n`tabletop exercise`: 桌面演练：一种基于讨论的演练，人员在教室环境或小组中会面，并给定一个场景以验证计划、程序、政策、协议或其他信息的内容。\n\
  \n`tailored trustworthy space`: 定制可信空间：一种网络空间环境，通过自动机制确定安全状况并根据不断变化的威胁调整安全水平。\n\n\
  `targets`: 目标：网络安全工作，其中人员：应用对一个多个地区、国家、非国家实体和/或技术的现有知识。\n\n`threat`: 威胁：一种可能利用漏洞并不利影响组织运营、组织资产（包括信息和信息系统）、个人、其他组织或社会的状况或事件。\n\
  \n`threat agent`: 威胁实施或意图实施有害活动的个人、团体、组织或政府。\n\n`threat assessment`: 威胁评估：识别或评估实体、行动或事件，其具有或表明可能伤害生命、信息、操作或财产的产品或过程。\n\
  \n`ticket`: 访问控制：验证客户端或服务身份的数据，并与临时加密密钥（会话密钥）组成凭据。\n\n`trojan horse`: 特马：一种看似具有有用功能的计算机程序，但也具有隐藏的潜在恶意功能，有时通过利用调用程序的系统实体的合法授权来规避安全机制。\n\
  \n`Trusted Automated Exchange of Indicator Information (TAXII)`: 一种以可靠方式交换结构化网络威胁信息的标准。TAXII\
  \ 定义了服务、协议和消息，用于交换检测、预防和缓解网络威胁的信息。\n\n`virus`: 一种能够自我复制、未经用户许可或不知情感染计算机，然后传播到另一台计算机的计算机程序。\n\
  \n`vulnerability`: 漏洞：使组织或资产（如信息或信息系统）受到特定威胁利用或易受特定危害影响的特性或特定弱点。\n\n\n\n\n\n# 漏洞评估与管理\n\
  对威胁和漏洞进行评估，确定其与可接受配置、企业或当地政策的偏差，评估风险水平，并在运行和非运行情况下制定和/建议适当的缓解措施。\n\n**弱点 (weakness)**：软件代码、设计、架构或部署中的缺陷或不完善之处，在适当条件下，可能变成漏洞或导致漏洞的引入。\n\
  \n**白队 (White Team)**：负责仲裁模拟攻击者团队（红队）与信息系统实际者团队（蓝队）之间对抗的小组。\n\n**白名单 (whitelist)**：被认为可信并授予访问权限或权利的实体列表。\n\
  \n**蠕虫 (worm)**：一种自我复制、自我传播、自包含的程序，利用网络机制进行扩散。\n\n## 参考文献\n\n`niccs.us-cert.gov/glossary`\n\
  - 美国商务部\n- 美国国土安全部\n\n## 附录 B。关于加强联邦网络和关键基础设施网络安全的总统行政命令\n\n`https://www.whitehouse.gov/presidential-actions/presidential-executive-order-strengthening-cybersecurity-federal-networks-critical-infrastructure/`\n\
  \n根据美国宪法和美国法律赋予我作为总统的权力，为了保护美国的创新和价值观，特此命令如下：\n\n### 第 1 节联邦网络的网络安全。\n\n(a) 政策。行政分支代表美国人民运行其信息技术（IT）。应当利用所有美国政府的能力负责任地确保\
  \ IT 和数据的安全。总统将要求各行政部门和机构负责人（机构负责人）负责管理其企业的网络安全风险。此外，由于机构负责人做出的风险管理决策可能会影响整个行政部门的风险以及国家安全，将行政部门作为企业进行网络安全风险也是美国的政策。\n\
  \n(b) 发现。 \n(i) 网络安全风险管理涵盖了保护 IT 和数据免受未经授权的访问和其他网络威胁的全部活动、保持对网络威胁的感知、检测对 IT 和数据产生不利影响的异常和事件，以及缓解事件影响、响应事件并从事件中恢复。信息共享促进并支持所有这些活动。\n\
  (ii) 行政分支长期以来一直接受过陈旧且难以防御的 IT 系统。\n(iii) 有效的风险管理不仅涉及保护现有的 IT 和数据，还需要进行规划，以确保维护、改进和现代化能够以协调的方式和适当的频率进行。\n\
  (iv) 已知但尚未缓解的漏洞是行政部门和机构（机构）面临的最高网络安全风险。已知漏洞包括使用超出供应商支持周期的操作系统或硬件、拒绝实施供应商的安全补丁，或未能执行特定的安全配置指导意见。\n\
  (v) 有效的风险管理要求机构负责人领导集成团队，团队成员应在 IT、安全、预算、采购、法律、隐私和人力资源方面具有专家的高级管理人员。\n\n(c) 风险管理。\n\
  (i) 总统将要求机构负责人实施风险管理措施，这些措施与未经授权访问、使用、披露、中断、修改或破坏 IT 和数据可能导致的风险和损害程度相适应。总统还将要求机构负责人确保网络安全风险管理流程根据《美国法典》第\
  \ 44 卷第 35 章第 II 亚章的规定，与战略、运营和预算规划流程保持一致。\n(ii) 立刻生效，每个机构负责人应使用美国国家标准与技术研究院（NIST）开发的《改进关键基础设施网络安全框架》（以下简称“框架”）或任何后续文件来管理该机构的网络安全风险。每个机构负责人应在本命令发布之日起\
  \ 90 天内向国土安全部长和管理和预算局（OMB）主任提交一份风险管理报告。该风险管理报告应：\n(A) 记录截至本命令发布日期每个机构负责人做的风险缓解和接受选择，包括：\n\
  (1) 形成这些选择的战略、运营和预算考量；\n(2) 任何已接受的风险；\n(B) 描述机构实施该框架的行动计划。\n(iii) 国土安全部长管理和预算局主任根据《美国法典》第\
  \ 44 卷第 35 章第 II 亚章的规定，共同评估每个机构的风险管理报告，以确定报告中的风险缓解和接受选择是否适用于管理整个行政部门的风险（简称“判定”）。\n\
  (iv) 管理和预算局主任在与国土安全部长协调，并在商务部长和总务管理局适当的支持下，在收到本节 (c)(ii)所述的风险管理报告后 60 天内，向总统安全及反恐事务助理提交以下内容：\n\
  (A) 判定；\n(B) 一项计划：\n(1) 如果判定发现不足，则能够充分保护行政部门；\n(2) 解决管理行政部门所需的紧迫未满足预算；\n(3) 建立定期流程以重新评估并在必要时重新发布判定，并解决管理行政部门所需的未来经常发生的未满足预算；\n\
  (4) 澄清、协调并在必要且法律允许范围内重新发布任何机构为了《美国法典》第 44 卷第 35 章第 II 亚章而发布的政策、标准和指导意见，并在必要且法律允许范围内发布执行本命令的政策、标准和指导意见；以及\n\
  (5) 将这些政策、标准和指导意见与框架对接。\n(v) 本节 (c)(ii)所述的风险管理报告以及本节 (c)(iii)和(iv)所述的判定和计划可以根据情况部分分类。\n\
  (vi) 立刻生效，行政分支的政策是建立和维护一个现代化、安全且更有韧性的行政部门 IT 架构。\n(A) 机构负责人在法律允许范围内，采购时应优先考虑共享 IT\
  \ 服务，包括电子邮件、云和网络安全服务。\n(B) 美国技术委员会主任应协调国土安全部长、管理和预算局主任和总务管理局长（并在适当咨询商务部长）向总统提交一份关于联邦\
  \ IT 现代化的报告。该报告应：\n(1) 在命令发布之日起 90 天内完成。\n\n\n\n\n(2) 描述与所有机构或部分机构转型至以下内容相关的法律、政策和预算考量，以及技术可行性和成本效益（包括时间表和里程碑）：）：\n\
  \n(aa) 一个或多个整合网络架构；以及\n\n(bb) 共享 IT 服务，包括电子邮件、云和网络安全服务。\n\n(C) 本节第 `(c)(vi)(B)`\
  \ 小节规定的报告应评估将所有机构或部分机构转型至共享 IT 服务对网络安全的影响，包括提出建议以确保符合《国土安全法案》（`Homeland Security\
  \ Act`）第 `227` 节（`6 U.S.C. 148`），并遵守根据美国法典第 `44` 卷第 `3553` 节发布的政策和实践。所有机构负责人应提供有关其当前\
  \ IT 架构和计划的必要信息，以按时完成本报告。\n\n(vii) 对于根据美国法典第 `44` 卷第 `3552(b)(6)` 节定义的任何国家安全系统，由国防部长和国家情报局长而非国土安全部长和管理与预算局（OMB）局长在可行和适当的最大范围内执行本命令。国防部长和国家情报局长应在本命令发布后\
  \ 150 天内向总统国家安全事务助理和总统国土安全与反恐助理提交报告，说明他们对本节第 `(c)` 小节的执行情况。本小节规定的报告应包括对偏离第 `(c)`\
  \ 小节要求的说明，并可根据情况全部或部分保密。\n\n## 第 2 条：关键基础设施的网络安全\n\n(a) 政策。行政部门的政策是根据情况利用其权限和能力支持国家关键基础设施所有和运营商（根据美国法典第\
  \ `42` 卷第 `5195c(e)` 节定义，关键基础设施实体）的网络安全风险管理工作。\n\n(b) 对高风险关键基础设施的支持。国土安全部长应协调国防部长、总检察长、国家情报局长、联邦调查局局长、根据\
  \ 2013 年 2 月 12 日总统政策指令 `21`（关键基础设施安全与韧性）定义的适当特定部门机构负责人（特定部门机构负责人）以及国土安全部长确定的所有其他适当机构负责人，执行：\n\
  \n(i) 识别机构可以利用的权限和能力以支持根据 2013 年 2 月 12 日行政命令 `13636`（改进关键基础设施网络安全）第 `9` 节确定的关键基础设施实体网络安全工作，这些实体最面临可能对公共健康或安全、经济安全或国家安全产生灾难性区域或国家影响的攻击（第\
  \ `9` 节实体）；\n\n(ii) 与第 `9` 节实体接触并在适当情况下征求意见，以评估根据本节第 `(b)(i)` 小节识别的权限和能力可能如何用于支持风险管理以及实施此类工作的任何障碍；\n\
  \n(iii) 在本命令发布后 180 天内，通过总统国土安全与反恐助理向总统提交报告（报告可根据情况全部或部分保密），报告包含以下内容：\n(A) 根据本节第\
  \ `(b)(i)` 小节识别的权限和能力；\n(B) 根据本节第 `(b)(ii)` 小节进行接触和裁定的结果；\n(C) 关于更好地支持第 `9` 节实体风险管理工作的发现和建议；以及\n\
  (iv) 此后每年向总统提交一份更新的报告。\n\n(c) 支持市场透明度。国土安全部长应协调商务部长，在本命令发布后 90 天内，通过总统国土安全与反恐助理向总统提交报告，审查现有的联邦政策和实践在促进关键基础设施实体市场透明度方面的充分性，重点关注上市的关键基础设施实体。\n\
  \n(d) 抗僵尸网络和其他自动化分布式威胁的韧性。商务部长和国土安全部长应共同领导一个开放透明的过程，识别并促进相关利益相关者采取行动，以提高互联网和通信生态系统的韧性，目标是大幅减少由自动化分布式攻击（例如僵尸网络）造成的威胁。商务部长和国土安全部长在执行本小节时，应与国防部长、总检察长、联邦调查局局长、联邦通信委员会和联邦贸易委员会主席、其他机构负责人以及相关利益相关者进行协商。在本命令发布后\
  \ 240 天内，商务部长和国土安全部长应公布此项工作的初步报告。在本命令发布后 1 年内，部长们应提交该报告的最终版本。\n\n(e) 电力中断事件能力评估。能源部长和国土安全部长在咨询国家情报局长，并与州、地方、部落和领地政府以及其他相关部门后，应评估：\n\
  (i) 根据 2016 年 7 月 26 日总统政策指令 `41`（美国网络事件协调）定义的重大网络事件，其与美国电力子部门相关的可能导致长时间停电的潜在范围和持续时间；\n\
  (ii) 美国管理此类事件后果的准备情况；以及\n(iii) 在缓解此类事件后果所需的资产或能力方面可能存在的任何缺口或不足。\n\n评估结果应在本命令发布后\
  \ 90 天内，通过总统国土安全与反恐助理提交给总统，并可根据情况全部或部分保密。\n\n(f) 国防部战斗能力与工业基础。在本命令发布后 90 天内，国防部长、国土安全部长和联邦调查局局长应协调国家情报局长，向总统国家安全事务助理和总统国土安全与反恐助理提交一份关于国防工业基础（包括其供应链）以及美国军事平台、系统、网络和能力面临的网络安全风险的报告，以及减轻这些风险的建议。报告可根据情况全部或部分保密。\n\
  \n## 第 3 条：国家网络安全。\n\n\n\n\n\n### (a) 政策\n为了确保互联网对后世代代继续保持价值，行政部门的政策是促进一个开放、互操作、可靠且安全的互联网，以促进效率、创新、通信和经济繁荣，同时尊重隐私并防范干扰、欺诈和盗窃。此外，美国寻求支持在网络安全及相关领域具备技能的人才的增长和持续发展，以此作为实现我们在网络空间中目标的基础。\n\
  \n### (b) 威慑与保护\n在本命令发布之日起 90 日内，国务卿、财政部长、国防部长、司法部长长、商务部长、国土安全部长以及美国贸易代表，应在国家情报总监的配合下，通过国家安全事务总统助理以及国土安全与反恐事务总统助理，向总统提交一份关于国家在威慑对手和更好地保护美国民众免受网络威胁方面的战略选择报告。\n\
  \n### (c) 国际合作\n作为一个高度连接的国家，美国特别依赖全球安全且具有韧性的互联网，必须与盟友和其他伙伴共同维护本节规定的政策。在本命令发布之日起\
  \ 45 日内，国务卿、财政部长、国防部长、商务部长和国土安全部长，应在司法部长和联邦调查局局长的配合下，向总统提交关于其国际网络安全优先事项的报告，包括涉及调查、溯源、网络威胁信息共享、响应、能力建设和合作的内容。在报告提交后\
  \ 90 日内，国务卿应在本小节列出的机构负责人以及任何其他相关机构负责人的配合下，通过国土安全与反恐事务总统助理，向总统提供一份报告，说明网络网络安全国际合作的参与战略。\n\
  \n### (d) 人才培养\n为了确保美国保持长期的网络安全优势：\n\n#### (i) 商务部长和国土安全部长在咨询国防部长、劳工部长、教育部长、人事管理局局长以及商务部长和国土安全部长共同确定的机构后，应当：\n\
  \n* (A) 共同评估教育和培训未来美国网络安全人才的努力范围和充分性，包括从小学到高等教育的网络安全相关教育课程、培训和学徒计划；以及\n* (B) 在命令发布之日起\
  \ 120 日内，通过国土安全与反恐事务总统助理，向总统提交一份关于如何支持公共部门和私营部门国家网络安全人才增长和持续发展的发现和建议报告。\n\n####\
  \ (ii) 国家情报总监在咨询国家情报总监确定的其他机构负责人后，应当：\n\n* (A) 审查潜在外国网络竞争对手的人才培养工作，以帮助识别可能影响美国长期网络安全竞争力的外国人才培养实践；以及\n\
  * (B) 在命令发布之日起 60 日内，通过国土安全与反恐事务总统助理，向总统提交关于根据本节第 `(d)(ii)(A)` 小款开展审查的发现报告。\n\n\
  #### (iii) 国防部长在商务部长、国土安全部长和国家情报总监的配合下，应当：\n\n* (A) 评估美国在确保保持或增加其在国家安全相关网络能力优势方面的努力范围和充分性；以及\n\
  * (B) 在命令发布之日起 150 日内，通过国土安全与反恐事务总统助理，向总统提交关于根据本节第 `(d)(iii)` 小款开展评估的发现和建议报告。本小节描述的报告可以全全或部分保密。\n\
  \n### 4. 定义\n就本命令而言：\n\n(a) `适当的利益相关者` 一术语指任何参与本命令第 `2(d)` 条的非行政部门个人或实体。\n\n(b)\
  \ `信息技术` (`IT`) 一术语含义具有《美国法典》第 40 章第 1101(6) 条赋予的含义，并进一步包括监控和控制物理设备的机构的硬件和软件系统。\n\
  \n(c) `IT 架构` 指机构内部 `IT` 的集成和实施。\n\n(d) `网络架构` 指实现或促进两个或多个之间通信的 `IT 架构` 要素。\n\n\
  ### 5. 一般规定\n(a) 本命令中的任何内容均不应解释为损害或以影响：\n(i) 法律授予行政部门或机构或其负责人的权力；或\n(ii) 预算管理局（OMB）局长与预算、行政或立法提案有关。\n\
  \n(b) 本命令的实施应符合适用法律，并取决于拨款可用情况。\n\n(c) 根据本命令采取的所有行动均应与保护情报和执法来源及方法的要求和权限一致。本命令中的任何内容都不应被解释为根据法律授权建立的、旨在直接支持执法行动的特定活动的安全和完整性措施的替代。\n\
  \n(d) 本命令并非意图且未创建任何美国、其部门、机构或实体、其官员、员工或代理人或其他个人在法律或公平法上可执行的实质性或程序性权利或利益。\n\n## 附录\
  \ C. 旧山山市和县网络安全政策\nCOIT 网络安全政策为整个市的网络安全计划奠定了基础，并展示了执行层对该计划的支持。全市的网络安全运行处于不同的阶段。网络安全政策将帮助构建市的网络安全计划以便：\n\
  \n* 保护我们连接的关键基础设施\n* 保护受托付的敏感信息\n* 管理风险\n* 持续提高我们检测网络安全事件的能力\n* 遏制并消除入侵，将信息资源恢复到安全运行状态\n\
  \n\n\n\n\n- 确保风险处理充分，并与信息资源的关键性相适应。\n- 在网络安全背景下，提高对我们运营风险的意识。\n\n本政策中确定的要求适用于由旧金山市及县及其下属部门和委员会运营（或为其运营）的所有信息资源。代表旧金山市及县工作的民职选任官员、员工、顾问和供应商均须遵守本政策。\n\
  \n## 政策声明\n\n网络安全政策为旧金山市及县整体的网络安全计划奠定了基础，并展示了执行层对该计划的支持。\n\n`COIT` 网络安全政策要求所有部门：\n\
  \n> 1. 采用一个网络安全框架作为构建其网络安全计划的基础。市建议采用美国国家标准与技术研究院（`NIST`）网络安全框架作为保护信息资源的方法。\n> 2.\
  \ 提供管理层支持以开展网络安全业务。\n> 3. 指定网络安全官或安全联络员来协调网络安全工作。\n> 4. 参加全市网络安全圆桌会议。\n\n这些要求将支持市网络安全业务的运行。\n\
  \n## 框架要求\n\n网络安全政策要求所有部门采用网络安全框架来指导其业务。\n\n为了充分保护信息资源、系统和数据，必须根据信息的敏感性和对业务的关键性进行适当分类。基于风险的方法可以标准化安全架构，在系统和基础设施互联时，建立对共享或转移风险的共同理解，并使系统和数据的安全工作变得更加简单。\n\
  \n`NIST` 框架为网络安全计划提供以下五个要素：\n\n- 识别 (Identify)：建立组织理解，以管理系统、资产、数据和能力的网络安全风险。\n-\
  \ 保护 (Protect)：开发并实施适当的安全措施以确保基础设施服务的交付。\n- 检测 (Detect)：开发并实施适当活动以识别网络安全事件的发生。\n\
  - 响应 (Respond)：开发并实施适当活动以响应网络安全事件。\n- 恢复 (Recover)：开发并实施适当活动以维护弹性计划，并恢复任何受网络安全事件损害的能力或服务。\n\
  \n部门在咨询市首席信息安全官（`CISO`）后可以选择 `NIST` 网络安全框架的替代方案，但所有部门应根据各自框架实施或使用中央标准和服务，例如访问控制与管理、风险评估与管理、意识与培训以及数据分类。\n\
  \n为了确保其安全计划符合网络安全框架和基于风险的方法，市服务审计师将进行就绪评估以衡量实施情况。\n\n就绪评估将与 `NIST` 框架保持一致，使部门能够确定当前的网络安全能力，为目标状态设定个人目标，并制定改进和维护网络安全计划的方案。就绪评估还将协助技术部和审计长高效、有效地规划网络安全活动。\n\
  \n## 角色与职责\n\n1. 部门负责人应当：\n    a. 促进网络安全意识和对市网络安全政策遵守的文化。部门负责人必须提醒其部门的员工和承包商市的网络安全政策、标准、程序、指南和最佳实践。\n\
  \    b. 在可能范围内，为其所属部门采购、运营或承包的系统配置网络安全职能的预算和人员，并在风险适当时告知 `CISO`。\n    c. 对于规模较小的部门，指定网络安全官或联络员。\n\
  \    d. 在适当的情况下，在收集新系统需求时咨询 `CISO` 办公室。\n\n2. 部门网络安全官 / 联络员应当：\n    a. 通过通过对系统类别/分类进行基于风险的评估，确保信息资源得到适当保护。\n\
  \    b. 当发生损害系统或数据机密性、完整性可用性的事件时，告知 `CISO`。\n    c. 参加全市圆桌会议。\n\n3. 首席信息安全官（`CISO`）应当：\n\
  \    a. 定期向市领导报告 CCSF 剩余风险状况。\n    b. 开发并维护一个中心化的事件响应计划，能够处理 CCSF 信息资源的重大泄露。\n \
  \   c. 建立并维护安全运营中心，具备识别、保护、检测、响应和恢复针对信息资源攻击的能力。\n    d. 组织市圆桌会议。\n\n4. `COIT` 和市预算办公室应当：\n\
  \    a. 充分支持网络安全业务。\n\n5. 首席数据官应当：\n    a. 与 `CISO` 合作开发和维护信息分类系统，并支持部门的数据分类工作。\n\
  \n6. 市服务审计师应当：\n    a. 通过定期就绪评估支持网络安全工作，并协助开发和演练网络安全审计措施。\n\n7. CCSF 员工、承包商和供应商应当：\n\
  \    a. 遵守网络安全规范和《可接受使用协议》，并及时向相关官员报告任何事件。\n\n## 合规\n\n在资源允许范围内：\n\n1. 部门负责人负责确保其所属部门或委员会采购、运营或承包的系统符合系统风险类别/分类所需的适当安全保护，此外符合任何法规要求。\n\
  2. 员工、顾问和供应商应确保在获得授权访问的情况下，根据《可接受使用政策》适当且安全地利用、管理和运行信息资源。\n\n## 异常\n\n本政策不批准任何豁免。\n\
  \n## 授权\n\n市行政法典第 22A.3 条规定：“`COIT` 应审查并批准市 CIO 对 ICT 标准、政策和程序的建议，以实现市 ICT 成功的开发、运营、维护和支持。”\n\
  \n## 参考文献\n\n`NIST` 网络安全框架网站—http://www.nist.gov/cyberframework/\n\n## 定义\n\n\n\n\
  \n\n有关定义的列表请参阅：\n\nhttp://nvlpubs.nist.gov/nistpubs/ir/2013/NIST.IR.7298r2.pdf\n\
  \n## 附录 D. 印第安州拉波特县 IT 计算机安全政策\n\nhttp://www.laportecounty.org/InformationTechnology/ComputerSecurity/\
  \ (2018 年 4 月 23 日)\n\n### 目标\n拉波特县政府几乎所有的业务和行政职能都涉及计算机或电信技术的使用。信息在小型计算机和微型计算机系统中海量地处理和存储。每一位拉波特县政府员工和合同工都有责任保护这些系统的信息和物理资产。计算机安全程序旨在减少或消除对计算机计算机系统和电子信息的威胁。这些威胁许多并非源于恶意，而是源于基本的人为失误。谨慎和意识是最重要的保护措施。所有员工和合同人员必须了解访问和使用计算机系统及设备的允许行为和禁止行为。\n\
  \n### 1.1 通用安全指南\n拉波特县政府将制定并维护政策和控制措施，以确保计算和电信设备的安全、存放这些设备的物理场所以及在设备上使用、存储或产生的数据的安全。这些政策和控制措施将获得拉波特县数据委员会和拉波特县委员会的批准。信息技术部门代表政府制定并维护这些政策。拉波特县政府部门可以制定补充政策和控制措施以满足特定需求。这些政策可能损害政府的政策和控制措施。\n\
  \n**角色与职责：**\n拉波特县信息技术部门负责在组织范围内实施和执行充分的计算机安全政策。拉波特县信息技术部门负责确保所有内部处理或外部存储的数据都有充分的安全备份。拉波特县信息技术部门确保其所有的自动化流程都经过设计、开发和测试，以便其准确高效地运行。拉波特县信息技术部门确保所有人员（无论是受雇于拉波特县政府还是与部门签约）都了解适当的安全政策和程序，并了解遵守这些政策和程序的责任。拉波特县信息技术部门确保所有处理拉波特县政府信息的计算设施都符合拉波特县政府的安全规范。拉波特县信息技术部门确保所有员工都接受履行工作所需硬件软件的充分培训。拉波特县信息技术部门确保安装在拉波特县政府计算机上的所有软件都经过适当的许可和授权。每个部门负责人被授予责任和权力，在自己的部门内实施和执行这些政策，并在其控制范围内的任何地方和时候遵循《人事政策手册》中的拉波特县\
  \ `DISCIPLINARY WARNING PROCEDURE`。\n\n### 1.2 安全意识政策\n信息技术部门和拉波特县政府部门负责人负责沟通计算机安全政策和程序，并促进和监控它们的使用。\n\
  \n**标准与程序：**\n信息技术部门将制定并维护计算机安全政策和程序。信息技术部门将每年审查一次计算机安全政策和程序。信息技术部门将为每个拉波特县政府部门提供一份计算机安全政策和程序的副本。部门负责人将确保其部门内的所有员工和合同工都了解并获取计算机安全政策和程序。信息技术系统部门将与内部审计合作，定期向部门负责人报告计算机安全政策和程序的遵守执行情况。\n\
  \n### 1.3 物理安全政策\n信息技术部门将制定并遵守标准和程序，以确保物理场所和计算设备的安全。\n\n**局限性：**\n个人电脑、打印机、调制解调器等在信息技术部门物理控制之外维护的设备安全，由该设备所在的拉波特县政府部门负责。\n\
  \n**标准与程序：**\n计算机和服务器房的访问将仅限于因正常工作需要需要访问的人员。存放设备的办公室在非工作时间必须锁。存放在开放区域的设备应尽可能通过安全线固定在不可移动的物体上。应根据需要使用能够抑制浪涌、减少静电并在停电时提供电池备份的电力保护设备。每天或偶尔从拉波特县政府财产中移除的设备必须获得部门负责人和信息技术部门的批准。\n\
  \n### 1.4 网络安全政策\n信息技术部门将制定并遵守标准和程序，维护其所有计算机网络的安全，以保护拉波特县政府的数据以及对拉波特县政府计算机系统的访问。\n\
  \n**标准与程序：**\n信息技术部门将确保其管理的网络上实施的软件安装正确并运行正常。信息技术部门将定期监控网络安全。记录有关网络流量和活动的充分信息，以确保能够检测到网络安全漏洞。信息技术部门将实施并维护相关程序，为防止外部入侵拉波特县政府计算机系统提供充分保护。任何包含敏感数据的计算机都将通过网络级安全程序防止未经授权的访问。任何连接到网络的计算机，其磁盘或内存中都不能存储允许访问网络其他部分的信息。例如，用于访问远程主机的脚本可能不包含密码。\n\
  \n\n\n\n# 1.5 数据安全策略\n\n信息技术部门将制定并遵守标准和程序，以确保技术和用户数据的安全性。\n\n**局限性：** 存储在计算机系统数据的安全性必须由数据所有者决定。应遵守本文中的标准和程序。\n\
  \n**密码：** 每个用户都应分配并对其唯一的用户 ID 和密码负责。密码应仅由该 ID 和密码的授权用户已知。密码应被视为机密，不应将其写下或与其他用户共享。用户应选择符合标准（如长度和使用的字符）且无法被其他用户轻易猜到的密码。用户访问权限也应限制在其授权执行的功能范围内。机密数据应通过仅授权人员的密码进行保护。密码将定期更换以维持安全性。部门主管必须向信息技术部门通知离职、终止雇用或被分配其他职责的人员。信息技术部门将根据新部门主管的指示删除该用户\
  \ ID 或调整访问权限。\n\n**标准和程序：** 在存储高度机密信息时，应使用数据加密技术。如果部门主管认为加密加密，请联系信息技术系统寻求协助。当数据移动或复制到另一个系统时，必须保留由所有者确定的所需数据安全级别。机密文件必须在文档页眉或页脚注明该文件为机密。例如：拉波特县巡回法院文件（LAPORTE\
  \ COUNTY CIRCUIT COURT CONFIDENTIAL）。包含机密数据的打印报告必须妥善存储和丢弃。机密性的由所属部门决定。用户离开终端时必须注销。\n\
  \n# 1.6 个人电脑安全策略\n\n信息技术部门将制定并遵守标准和程序，以确保个人电脑及其存储的应用程序和数据的足够安全性。\n\n# 关于贡献者\n\n\
