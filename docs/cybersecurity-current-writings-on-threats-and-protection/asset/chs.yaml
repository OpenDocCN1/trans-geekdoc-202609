  \ 前言\n\n\n\n\n\n\n\n\n\n\n\n\n## III. C. 利用合作伙伴关系与网络\n\n### 42. 网络安全合作伙伴关系：人多力量大\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n### 作者简介\n\n### 名称与术语列表\n\n## 前言\n\n我们生活在一个网络时代。万物互联（`IoE`）已经到来并正在不断增长。大数据变得越来越庞大。数十亿的人通过跨越城市和国家的数十亿台设备连接在一起。无论是在步行或驾驶，还是在家里或办公室，无论何时何地，个人和职业信息都在接收和传输。通过手机、平板电脑和笔记本向数百万客户销售并提供大众公共服务现在已轻而易举。然而，这种广泛的访问是以巨大的代价换来的。黑客攻击网络犯罪已成为威胁。我们的企业和政府正面临围困，我们的隐私和民主也是如此。在这个复杂的网络世界中，如何恢复安全呢？\n\
  \n本书及时出版，其初衷是为这一重要问题提供答案。我们从不断演变且充满动态的网络安全领域汇编了最佳实践和经验。我们的贡献者来自不同的职业和背景，他们报告了当前和新兴的威胁与风险，以及现有的预防措施和保护手段。这些实用、易读的网络安全课程和建议是面向个人、组织和社区的。\n\
  \n为了方便阅读和参考，我们将本书分为四个主要部分，并在下文中突出显示，以向读者提供有关本网络安全参考书内容的详细信息。\n\n### 第一部分——概述\n\n\
  我们从本书从对我们所生活和工作的数字困境进行总体概述开始。我们的贡献者和我们认为，这种快速演变的背景既是好的源源，也是坏的根源，因此需要网络安全。\n\n万物互联了人类、设备、流程和数据，它带来了许多益处，但也带来了许多代价。第\
  \ 1 至第 5 章描述了我们电子世界的负面方面。作为公民信息的巨型数据库，政府（尤其是市级）不断受到攻击，有时甚至自己都无于情。负面影响（尤其是网络犯罪）也在增加。但显然，收益远大于这些风险和成本。毕竟，正如第\
  \ 6 至第 9 章所示，转向数字交易和运营使公共和私营服务更加敏捷、更开放、更透明。此外，先进的性能和数据分析增强了我们处理如今具有前所未有的容量、速度、真实性和多样性的网络世界的能力。\n\
  \n### 第二部分——威胁与风险\n\n第二部分详述了“坏面”的细节——直接关系个人、组织、社会和全球网络安全的许多威胁和风险。本书这一部分包含了十多个章节（第\
  \ 10 至第 22 章），研究了难以管理的物联网（`IoT`）行业威胁以及囤积零日软件漏洞的风险。\n\n我们同意贡献者的观点，他们强调了这些威胁和风险的数量和质量。几个章节深入探讨了数据库泄露、国内和国际黑客攻击、秘密间谍活动、拒绝服务攻击、网络钓鱼、间谍软件、勒索软件以及社交媒体脆弱防御的基础和经验。更深层次，第\
  \ 15 章区分了不同类型的黑客和攻击手段。第二部分还包含了法院、医疗保健、信用报告、公用事业、交通和县组织的网络安全失误典型案例。\n\n### 第三部分——预防、保护、伙伴\n\
  \n第三部分是本书的核心：3 个 P——预防、保护、伙伴。书中展示了近 30 章内容丰富的章节，提供了创新的预防、保护和伙伴课程。我们鼓励读者借鉴他们认为可以导致适当纠正措施的方法——使他们、他们的组织和社区更安全、更健康。利用这些方法来降低风险并对抗威胁。\n\
  \nA 部分是 11 个实用预防措施章节的汇集（第 23 至 33 章），制定了一个坚实的网络安全计划、如何应对负面网络安全问题、提供在线安全和安全措施的步骤，以及如何在社交网络网站上保持安全。其他章节包括了增强网络安全实践时应采取的步骤、如何建立计算机响应小组，以及必须及时检查、处理和妥善应对的网络安全威胁示例。\n\
  \n\n\n\nB 部分涉及技术保护，首先从第 34 章开始，介绍了国家当前的优先事项和应对措施，通过“国家网络安全人才框架”，该框架引导您的组织构建世界级的网络安全人才。随后，第\
  \ 35 至 41 章继续讨论了相关的网络安全实践，例如消除网络“盲点”、建议的计算机用户责任，以及如何为个人和组织的计算机硬件及软件系统用户制定健全的网络安全实践。此外还调查了灾难恢复网络安全的最佳实践。\n\
  \nC 部分是第三部分的第三部分也是最后部分，包含第 42 至 50 章，探讨了 `cybersecurity` 实践。这涉及 `cybersecurity`\
  \ 实践，并且在 `cybersecurity` 实践中，`cybersecurity` 实践、`cybersecurity` 实践、`cybersecurity`\
  \ 实践、`cybersecurity` 实践以及 `cybersecurity` 实践。\n\n### 第四部分—未来\n第四部分的第四部分也是最后部分深入探讨了未来。这包括\
  \ `cybersecurity` 实践（51 至 56 章）、`cybersecurity` 实践、`cybersecurity` 实践以及 `cybersecurity`\
  \ 实践。\n\n### 附录\n附录包含了 `cybersecurity` 实践、`cybersecurity` 实践以及 `cybersecurity` 实践。\n\
  \n\n\n据了解，员工通过点击钓鱼邮件导致了黑客攻击。入侵发生后，美国邮政局（USPS）监察长（IG）了一项测试，以确定员工行为是如何导致黑客攻击的。USPS\
  \ 监察长向 3125 名邮政服务员工发送了包含虚假链接的电子邮件。根据政策，大多数员工（93%）没有报告这些邮件。此外，25%的员工点击了欺诈邮件，且其中大多数员工（90%）没有向监察长报告这一事实。\n\
  \n这些案例说明了政府员工防止机构数据泄露的机遇。敦促员工在处理机构邮件时要保持极度谨慎。\n\n为此，政府员工还应该参加其机构的培训课程，学习如何最好地处理机构数据。员工培训可能会防止美国邮政局数据泄露的发生。在测试之后，USPS\
  \ 监察长发现，大多数“失败”测试的员工没有完成必要的信息安全培训。\n\n如所示，政府员工面临的网络威胁是严峻的，并且正变得日益严重。最近的案例表明，数据窃取者能够从那些意识不到风险和或在处理机构数据时未采取谨慎措施的员工手中窃取政府信息。很清楚，员工可以通过采取简单的预防措施来降低风险。\n\
  \n*最初发表于 Chelsea Binns，《政府员工未意识到自己是网络犯罪受害者》，宾州时报》，2015 年 12 月 15 日。经出版商和作者许可转印。*\n\
  \n## 2. 网络安全与美国政府\n\nROGER L. KEMP\n\n网络安全涉及计算机安全，以及对组织计算机硬件和软件系统的保护。“网络安全”描述了一种动态且不断演变的努力，旨在保护机构的硬件和软件免受病毒、漏洞、蠕虫、窃听、欺骗、钓鱼、点击劫持、社会工程学等的侵害。随着该领域的发展以及计算机系统及其软件变得日益复杂，这些病毒载体结合在一起，形成了“网络安全”这一新的通用名称。该术语还涉及对组织计算机系统内信息的保护。计算机黑客可以窃取存储在机构计算机上的敏感机密信息，如姓名和地址、信用卡信息和医疗信息。\n\
  \n计算机在近年来发生了进化。虽然每个组织都有一个中央主机计算机，但现在每个工作站都有一台台式电脑，每位员工通常都有一台笔记本电脑，以及一台手持设备（手机或平板电脑）。多年来，计算机硬件变得更小、更复杂、更廉价且更易用。另一方面，软件已出现在更多领域，变得更复杂、更易用，而培训员工操作新购软件提供的计算机应用程序（或应用）已成为所有政府机构的惯常做法，无论其规模如何。\n\
  \n网络风险是对所有政府机构的主要威胁，包括市、县、州以及我们的联邦政府。在许多没有资源建立信息技术部门或类似部门的机构中，风险很高。计算机遭受黑客攻击后补偿损失的过程既繁琐又昂贵，会导致大量的诉讼，因此，所有公共机构都需要针对其员工以及其服务的公众妥善应对网络风险，以受到此类费用的影响。\n\
  \n数据泄露和网络勒索行为日益频繁发生，保护公共计算机及其数据至关重要。地方、州和联邦政府组织需要采取控制措施并关注：\n\n- `了解你拥有的资产`\n- `加密数据和设备`\n\
  - `建立并定期审查网络保险政策，以确保你有充足的覆盖`\n\n“网络安全”这一术语是动态且不断演变的，其实施（或缺乏实施）影响着政府的所有层级。我们国家的专业会员组织应为其尖端努力表示祝贺，这些努力在动态演变的网络安全领域中为全国的政府公共官员带来了最新的最佳实践。\n\
  \n此前，数据处理主要在财务部和公共工程部完成（后者通常有一个工程处）。随着时间的推移，越来越多的部门拥有了计算机和程序。最终，一些较大的政府成立了计算机相关的部门。这些部门的名称一直在演变，一些政府管理者对向用户部门提供的服务有不同的名称。近年来，该部门的名称发生了演变，以下列了一些更常见的名称：\n\
  \n- `信息与通信技术 (ICT)`\n- `信息技术 (IT)`\n- `信息资源管理 (IRS)`\n- `信息系统 (IS)`\n- `企业技术 (ET)`\n\
  - `管理信息服务 (MIS)`\n\n## 3. NACo 成员聚焦网络安全与技术安全\n\nARIEL COHEN\n\n最近几个月来，网络安全已成为国家和国际影响的话题，但地方政府也受到在线黑客的影响。县领导最近在\
  \ 2017 年 Naco 立法会议上讨论了应对此类攻击的准备工作以及如何更新他们的系统。\n\n\n\n赛门信克政府事务总监兼高级顾问会议演讲者比尔·莱特（Bill\
  \ Wright）表示，现今所有数据的 90%都是 2010 年以后生成的，而且大部分数据没有得到妥善保护。他指出，公共部门面临网络犯罪的风险尤其，因为在去年报告的网络攻击中，政府网站位列第四。\n\
  \n“你不能期望完美。作为一名县级官员，你必须说‘当我们被攻击时’而不是‘如果我们被攻击’，”AT&T 安全与安全策略总监史蒂夫·赫斯特（Steve Hurst）说道。他补充道：“想清楚你将采取的步骤，这样一旦发生漏洞，你可以立即进入数据恢复计划。”\n\
  \n赫斯特与宾夕法尼亚州县长协会首席信息官里塔·雷诺兹（Rita Reynolds）一起，帮助县领导层制定了一项应对可能的网络威胁的计划。雷诺兹强调，无论你感知的风险水平如何，每个县都应该准备好一份随时可用的计划。如果你的当地政府不确定如何制定计划，大多数州都有县可以遵循的模板。\n\
  \n> • 专家建议，在进行任何其他操作之前，县领导层应该确定哪个部门拥有最有价值的数据，并优先对其保护。虽然每个部门都会辩称自己的数据最重要，但要确定保护你们公民的安全最重要的是什么。\n\
  \n> • 赫斯特和雷诺兹建议，聘请第三方对县的技术系统和数据进行风险评估，可以帮助你们完成需求排序的艰巨工作。\n\n> • 地方官员还应该关注加密勒索软件日益增长的主导地位。赛门信克的托马斯·麦克拉兰（Thomas\
  \ MacLellan）鼓励各县更多地关注作为“物联网”组成设备的网络安全，例如高科技冰箱、烤面包机，甚至自动驾驶汽车。“目前，我将网络安全视为一种基础设施，”麦克拉兰说，“它和道路没有区别，和学校没有区别，而且需要花费资金。我们必须克服这一点。”\n\
  \n“勒索软件已经从一种困扰演变成了严重的威胁，”莱特补充道，“如果你看到类似‘点击这里观看贾斯汀·比伯脸被打挨一拳’这样的提示，你不能点。尽管这对我这样的人来说也很有诱惑力，你也绝不能点击。”\n\
  \n虽然县可以努力保护自己免受黑客攻击，但地方政府无法完全保护其成员免受攻击。在全美国县协会（NACo）开幕全体会议的演讲中，参院参议员情报委员会副主席马克·华纳（Mark\
  \ Warner）警告县官员要警惕俄罗斯黑客对其地区可能产生的媒体影响。\n\n“如果你搜索‘选举黑客攻击’，你找不到福克斯新闻、NBC 或 CNN；你得到的——前五个故事——全是俄罗斯宣传……你会看到关于希拉里·克林顿生病的报道，”华纳说，“如果我们不掌握这个问题，只会变得糟糕。”\n\
  \n信息的快速传播可能非常有用，但使用不当将是灾难性的。\n\nStateScoop 战略计划经理杰克·威廉（Jake Williams）解释说，在社交媒体上传播误导信息或“假新闻”已经变得太容易了，县应当明智监控网络上有关他们社区的信息。\n\
  \n许多县对自己的社交媒体存在关注不够，或者没有足够的预算来监控网络传播的有关他们社区的信息。许多县对自己的社交媒体存在关注不够，或者没有足够的预算来监控网络传播的有关他们社区的信息。许多县对自己的社交媒体存在关注不够，或者没有足够的预算来监控网络传播的有关他们社区的信息。许多县对自己的社交媒体存在关注不够，或者没有足够的预算来监控网络传播的有关他们社区的信息。许多县对自己的社交媒体存在关注不够，或者没有足够的预算来监控网络传播的有关他们社区的信息。许多县对自己的社交媒体存在关注不够，或者没有足够的预算来监控网络传播的有关他们社区的信息。\n\
  \n## 4. 网络犯罪对地方政府日益的影响\n\n杰尔德·克里夫（GERALD CLIFF）\n\n对技术日益增加的依赖直接导致是各级政府正变得依赖这些。这种依赖的负面影响是放大了数据漏洞的风险。来自钓鱼、黑客和内部威胁的数据漏洞正在增加，并在密封漏洞和应对潜在损害方面造成了巨大的成本。这些漏洞可能导致居民姓名、出生日期和安全号码的`PII`泄露。以下是示例：\n\
  \n2015 年 4 月，佛罗里达州儿童与家庭部（DCF）遭受了数据漏洞，一名州员工利用工作相关的访问权限获取了数千名佛罗里达人的个人信息。根据经济机会部（DEO）的消息，其一名员工访问了`Florida\
  \ ACCESS`系统。他随后获取了超过 20 万人的姓名和安全号码。2015 年 3 月，该 DEO 员工被捕并被指控未经授权使用`PII`。\n\n2016\
  \ 年 5 月，超过 100 名洛杉矶县员工落入钓鱼诈骗，导致用户名和密码泄露，这些信息随后用于泄露约 75.6 万个人的信息。\n\n《2016 IBM 数据漏洞成本报告》发现数据漏洞的平均综合总成本从\
  \ 380 万美元增长到 400 万美元。该研究还报告，每个敏感机密信息的丢失或被盗记录的平均成本从每条 154 美元增加到 158 美元。\n\n### 勒索软件正在上升\n\
  \n加密勒索攻击——即加密受害者数据并向受害者出售解密密钥的软件正在上升，已经瘫痪了医院、警察局、教育系统、关键市政基础设施以及公共部门的其他重要基石。示例包括：\n\
  \n> • 2016 年 4 月，针对密歇根州兰辛市电气委员会的勒索软件攻击瘫痪了该机构内部及与客户通信的能力，最终导致该市公用事业在技术支持和设备升级安全方面花费了约\
  \ 200 万美元。\n\n> • 2016 年 6 月，阿拉拉巴马州科林斯维尔警察局拒绝支付赎金，并失去了对入照数据库的访问权限。\n\n\n\n\n> •\
  \ 德克萨斯州科克雷尔山（Cockrell Hill）警察局在 2016 年 12 月遭到袭击。该部门本认为可以恢复文件；然而，文件并未经过妥善备份，导致部门丢失了八年的数字证据，包括一些文档、电子表格、执法记录和车载摄像头的视频、照片以及监控视频。\n\
  >\n> • 2017 年 2 月，伊利诺伊州罗克纳（Roxana）警察局成为勒索软件攻击的受害者。尽管该部门拒绝支付赎金，但该事件仍耗费了市大量的时间和资金。部门没有支付赎金，而是被迫“清除系统”。虽然部门拥有所有重要信息的备份，但要以可行的方式恢复这些备份需要大量的人力。\n\
  \n在 2016 年的一份关于勒索软件主题的白皮书中，Osterman 研究公司指出，“钓鱼攻击和加密勒索软件正以每季度几百倍的速度增长，预计这一趋势在至少的未来\
  \ 18 到 24 个月内将持续。”报告随后指出，“FBI 估计，仅勒索软件在 2016 年三个月内就让机构损失了 2.09 亿美元。”\n\n根据美国联邦调查局局长詹姆斯·科米（James\
  \ Comey）的话，“网络犯罪正成为所有犯罪的核心。再次，由于人们将整个生活都连接到了互联网，那里就是那些想要偷钱、伤害孩子或诈骗的人去的地方。”\n\n众所周知，中国、俄罗斯和朝鲜等各种外国实体从事黑客活动。但也有数以百万计的个人通过在暗网购买黑客工具进行独立运营。\n\
  \n根据`2015 年 Trustwave 全球安全报告`，攻击者的投资回报率估计为 1,425%（每投入 5,900 美元软件和工具，即可获得 84,100\
  \ 美元的净收入）。得益于互联网的相对匿名性以及可购买的黑客工具（也称为“恶意软件即服务”方案），网络犯罪变得更容易实施且更安全。\n\n这意味着从字面意思来说，任何拥有计算机和互联网连接的人都可以成为黑客，因为编程和网络技能不再是必要条件。\n\
  \n## 法律责任\n\n泄露造成的直接损害只是冰山一角。由于当地政府在线缴费系统导致信用卡信息泄露的居民发起的集体诉讼会造成伤害，但他们中很少有人遭受了直接的、未报销的损失。他们的损失通常由其银行和保险公司承担了。\n\
  \n对于那些由于州政府或地方政府的行为（或不作为）导致其`PII`和`PHI`暴露给身份窃取者的选民，你该告诉他们什么？你如何处理随此类事件发生的公共信任危机？\n\
  \n作为这些机信息的持有者，有责任采取适当预防措施来保护它们。违反这一责任可能会导致后果。\n\n思考一下你的组织收集和处理的信息可能被用于实施犯罪：\n\n\
  > • `PII`可能被用于实施身份盗窃。\n>\n> • 关于儿童、证人、举报人、犯罪受害者和其他脆弱群体的个人信息可能被用于侵犯他们的隐私或便利针对他们实施犯罪。\n\
  >\n> • 受监管业务的信息可能被竞争对手利用。\n>\n> • 关于政府、承包或经济发展的信息可能被用于竞争优势。\n>\n> • 关于活跃的、刑事或行政案件的信息可能被使用。\n\
  \n关于政府的信息可能被使用。\n\n## 保险漏洞\n\n泄露造成的直接损害只是冰山一角。由于当地政府在线缴费系统导致信用卡信息泄露的居民发起的集体诉讼会造成伤害，但他们中很少有人遭受了直接的、未报销的损失。\n\
  \n泄露造成的直接损害只是冰山一角。保险单可能提供保护，但在未满足安全要求的情况下面对数据，保险人可能会拒绝赔付。\n\n在所有行业中，过去 10 年内因网络入侵或黑客攻击导致的数据泄露仅占隐私权利清除中心（Privacy\
  \ Rights Clearinghouse）报告的 5,000 多次数据泄露的不足 30%。\n\n泄露造成的直接损害只是冰山一角。由于当地政府在线缴费系统导致信用卡信息泄露的居民发起的集体诉讼会造成伤害，但他们中很少有人遭受了直接的、未报销的损失。\n\
  \n在一个似乎具有里程碑意义的案例中，Cottage Health 遭受了损失，30,000 条包含`PII`的记录暴露。\n\n泄露造成的直接损害只是冰山一角。由于当地政府在线缴费系统导致信用卡信息泄露的居民发起的集体诉讼会造成伤害，但他们中很少有人遭受了直接的、未报销的损失。\n\
  \n泄露造成的直接损害只是冰山一角。由于当地政府在线缴费系统导致信用卡信息泄露的居民发起的集体诉讼会造成伤害，但他们中很少有人遭受了直接的、未报销的损失。\n\n\
  泄露造成的直接损害只是冰山一角。由于当地政府在线缴费系统导致信用卡信息泄露的居民发起的集体诉讼会造成伤害，但他们中很少有人遭受了直接的、未报销的损失。\n\n\
  泄露造成的直接损害只是冰山一角。由于当地政府在线缴费系统导致信用卡信息泄露的居民发起的集体诉讼会造成伤害，但他们中很少有人遭受了直接的、未报销的损失。\n\n\
  泄露造成的直接损害只是冰山一角。由于当地政府在线缴费系统导致信用卡信息泄露的居民发起的集体诉讼会造成伤害，但他们中很少有人遭受了直接的、未报销的损失。\n\n\
  由于由于政府的在线缴费系统导致信用卡信息泄露的居民发起的集体诉讼会造成伤害，但他们中很少有人遭受了直接的、未报销的损失。\n\n泄露造成的直接损害只是冰山一角。由于当地政府在线缴费系统导致信用卡信息泄露的居民发起的集体诉讼会造成伤害，但他们中很少有人遭受了直接的、未报销的损失。\n\
  \n## 数据分析\n\n为了有效缓解数据泄露和网络犯罪涉及的危险，尽可能了解这类攻击是非常重要的。为了更好地了解这些犯罪对州、地方、领地和部落政府的影响，国家白领犯罪中心（NW3C）多年来利用广泛来源的公开数据汇集了一个事件数据集。\n\
  \n截至 2017 年 1 月 1 日，NW3C 关于州和地方实体报告的数据泄露数据集总数略超过 1,900 起。该机构对这些信息的分析指出了私部门部门之间的一些重要差异。\n\
  \n记住，数据泄露并不需要网络入侵；它可能涉及丢失纸质文件或处理不当的数字内存电子设备导致的机密信息暴露。\n\n网络入侵也不一定涉及数据泄露。从技术上讲，黑客主义是指黑客非法访问计算机网络以破坏或或其他方式干扰该网络，这属于网络入侵，但不涉及机密`PII`和`PHI`的泄露。\n\
  \n\n\n\n\n内部人员在政府数据泄露中扮演的角色似乎比在其他常见追踪的部门中更为显著。无论公职人员似乎更容易导致数据泄露的原因何在，我们研究结果的重要性在于，它有助于识别潜在的解决方案，这些解决方案可能帮助减少数据泄露事件的发生。\n\
  \n## 降低风险\n\n由于空间限制，且可用于缓解数据泄露和网络入侵事件的补救措施清单详尽，在本文允许的篇幅无法涵盖一个全面的计划。然而，我们可以概述几个基本步骤，这些步骤可以作为一项全面计划的起点，合理地预期该计划能够降低机构的风险敞口。\n\
  \nIT 协调员可以选择多种技术工具来帮助确保网络安全；然而，除了这些工具外，经理还应该考虑与人员相关的方面。以下是一些基本步骤。\n\n1. 制定有关互联网使用的详尽且彻底的政策。对电子邮件和其他包含敏感或机密内容进行加密。执行有关工作期间访问个人社交媒体账户的规则。指示\
  \ IT 协调员负责监控所有通信中是否存在恶意软件。控制能够访问公司资源的个人设备的使用。\n2. 实施用户行为的最佳实践。员工必须选择与其数据资产的敏感性和风险相匹配的密码。员工密码不仅必须符合某些强度方面的标准，还必须定期更改。IT\
  \ 部门应保持软件和操作系统为最新版本，以尽可能地减少恶意软件问题。员工应接受关于钓鱼和其他安全风险的详尽培训，并应定期进行测试以确定其防钓鱼培训是否有效。职责涉及外地互联网访问的员工，应接受远程连接的最佳实践培训，包括公共\
  \ Wi-Fi 热点的危险。\n3. 对您的关键系统进行及时且完整的备份。\n4. 定期练习从这些备份中恢复系统。重要的一点是，某些勒索软件变种可以被程序设定为延迟激活，因此备份可能会包含潜伏的勒索软件程序。谨慎的经理需要意识到，除非备份经过彻底检查并确定是安全的，否则仅靠备份可能是无效的。\n\
  5. 国家国家安全联盟（`INSA 2013`）的做法建议，风险降低计划应包含内部威胁组件，至少涵盖：\n    - 全组织范围的参与。\n    - 对计划合规性和有效性的监督。\n\
  \    - 报告内部事件的机密报告机制和程序。\n    - 内部威胁事件响应计划。\n    - 内部威胁事件的沟通。\n    - 对员工公民自由和权利的保护。\n\
  \    - 支持内部威胁计划的政策、程序和实践。\n    - 数据收集和分析技术与实践。\n    - 内部威胁培训和意识。\n    - 预防、检测和响应基础设施。\n\
  \    - 与信任业务伙伴相关的内部威胁实践。\n    - 内部威胁与企业风险管理的整合。\n\n有关法律责任问题以及你可以采取什么措施来限制网络犯罪威胁敞口的更多信息，请参阅\
  \ NW3C 白皮书《网络入侵与数据泄露》，该文档可以在 `http://www.nw3c.org/research` 找到。\n\n*最初发表于 Gerald\
  \ Cliff，“网络犯罪对地方政府的影响日益增长，”《公共管理》杂志（`PM`），2017 年 6 月刊。经经出版者许可转载。*\n\n## 5. 网络安全\n\
  \n### 你的风险是什么？\n\n国际城市/县管理协会\n\n“网络安全是一个冰山话题：最大的部分是你看不见的部分——而那部分正是可能导致组织沉没的部分，”科罗拉多州奥罗拉的内部审计经理、ICMA\
  \ 前行政与财务总监 Wayne Sommer 写道。Sommer 是为 ICMA 博客撰写的，他的建议非常好，以至于我们正在为那些没看到博客文章的人重复这些内容。\n\
  \nSommer 在奥罗拉的职责之一是从“风险”的视角来看待他的组织，即可能发生某种事件或状态，这种状态将影响组织实现其战略目标的能力。考虑到这一点，他与奥罗拉的信息安全官\
  \ Tim McCain 合作，列出了一份经理在应对网络中断风险时应该问的问题清单。\n\n“在奥罗拉，我们正眼睁睁看着网络安全冰山在我们面前变得越来越大，但我们并没有坐视不管或忽视它，”McCain\
  \ 写道，“我们正在审视水面下的复杂问题，并以战略性、持续且符合我们手头资源的方式逐一攻克。这不是一项轻易的任务。它是一块巨大的冰山。我们没有选择，你也没有。”\n\
  \n网络安全影响着每一个人。大的？中等的？还是小的？无论你的组织规模如何，你都是一个潜在的目标。电子邮件诈骗、网络攻击和勒索软件只是外面对寻找脆弱目标的三种掠食者。城市利用技术使内部运营和服务交付更加高效有效。“物联网”让城市能够以以前所未想象的方式使用互联网，为混乱制造提供了指数级增长的机会。\n\
  \n经理可以将问题交给 IT 部门并处理其他，但问题和解决方案超出了 IT 的范畴。网络安全是一个组织问题，恰好从技术大门进入。解决这一问题需要从顶层开始，并涉及组织内的每个人。\n\
  \n经理每天都会处理风险，无论他们是否意识到。网络安全是一个需要有意识方法的风险挑战。以下是经理可以作为入门框架的六个问题。\n\n1. 可能会发生什么问题？进行脑暴。任何可能性都不被排除在外。房间里来自每个职位和每一代人的声音越多，你就越可能收集出一份全面的可能性清单。\n\
  2. 早期警报信号是什么？你如何知道某些不对劲？你的员工是否注意到收件箱中出现了更多神秘的电子邮件？你的 IT 部门是否发现报告中出现了异常？你的行政人员是否收到了任何奇怪的电话？尽可能多地识别警报信号，并尝试理解你是否有能力监控这些信号并在其发生时提醒相关人员。\n\
  3. 此事件或状态发生的概率有多大？这在某种程度上是主观的，但请让你的员工考虑现有的防御、硬件和软件状态，甚至你们的计算机使用政策。你知道吗，任何坐在显示器和键盘前的员工都是你最大的脆弱点？打开一个错误的邮件附件就会……嗯吧，情况很快就会变得非常糟糕。评估你的威胁意识和准备情况将帮助你估计事件发生的概率。没有人是免疫的。问题不再是你“是否”会遭到黑客攻击，而是“何时”。\n\
  \n\n\n\n\n### 4. 如果真的发生了，会产生什么影响？\n首先想到的通常是财务上的损失，这确实是一个可能；但不要忘记考虑对内部运营、外部服务交付，特别是声誉的潜在影响。谁想在一个不能保护员工个人信息不泄露公共领域的机构工作呢？\n\
  \n### 5. 如果真的发生了，你将如何应对？\n这至关重要。一旦事件发生，你的应对方式会影响影响的程度。你的反应还可能在公众眼中提升或进一步摧毁贵组织的声誉。识别出所需的响应资源——时间、金钱和人员，并在事故发生之前就对此做好计划。\n\
  \n### 6. 你现在正在做什么，以在这一风险或状况发生时将影响或可能性降至最低？\n你可以通过你的工作确定组织目前的准备水平，来回答这个问题。\n\nSommer\
  \ 和 McCain 建议召集跨部门的运营代表，开始回答这些与网络安全相关的问题。这是一个很好的起点，可以帮助你评估自己的准备情况，识别出最脆弱的环节，并为制定行动计划以开始解决这一关键问题提供基础。“现在开始，”Sommer\
  \ 说，“那座冰山正向你走来。”\n\n联系人：Wayne C. Sommer，内部审计经理，科罗拉多州奥罗亥 (wsommer@auroragov.org);\
  \ Tim McCain，信息安全官，科罗拉多州奥罗亥 (tmccain@auroragov.org)。\n\n*最初发表于国际城市/县管理协会，“网络安全：你的风险在哪里？”，ICMA\
  \ 网站，2016 年 8 月 9 日。经出版者许可转载。*\n\n## 6. 绩效与数据分析\n\n### 辛辛提的故事\nHARRY BLACK\n\n在我的整个职业生涯，我一直致力于证明政府可以进行高性能的运行。政府机构在绩效水平和整体效率方面各不相同，某些地方政府对性能的优化优于其他地区。为什么呢？准备本案例研究就是为了对这个问题提供见解。\n\
  \n政府的本质设计初并不是为了高效、快速或敏捷。要真正优化性能，必须克服几个固有的挑战。文员制度已经过时了，而且大多数地方政府还必须应对劳动合同带来的挑战。此外，政府机构在能够向劳动力提供的绩效激励方面也是有限的。\n\
  \n这些挑战是现实。然而，挑战在于如何引导地方政府管理层参与，通过整合健全的劳动管理原则和实践来克服这些问题。通过绩效和数据分析，这是可以实现的。\n\n在物联网和大数据的时代，时间对地方政府至关重要。一个基本问题是“政府会被颠覆吗？”答案是“肯定的”，而且它将会发生。无人驾驶汽车、无人机、大数据驱动的算法和机器人将成为这种颠覆的来源。我们目前在政府开展业务的方式将改变。它需要更少的人员、更少的设施和更少的设备。\n\
  \n颠覆可以降至最低和/或避免，但是政府积极审查自己做什么以及如何做。它必须每天自问几个基本问题：“我们正在创造改变吗？”“我们是否正在维持并超越客户的预期？”“我们是否正在优化创新？”“我们正在做的有影响的事情具有可持续性吗？”\n\
  \n通过绩效和数据分析优化地方政府管理可以加强地方政府，同时增强其相关性。\n\n### 辛辛提的经历\n2014 年，当我正把杂食品装上车时，电话响了。是一个高级猎头打来的电话，讨论俄亥州辛辛提市市经理的空缺。当时我对于追求这个机会还有些犹豫。我对自己目前的工作很满意——担任巴尔的摩市的首席财务官。然而，由于成为市经理一直是我的职业目标，我决定抓住这次机会。说出“好”开启了\
  \ le 经历过最艰辛但也最充实的招聘过程。\n\n我往辛辛提跑了三次返返，并与 150 多位商界、社区和宗教领袖会了面。这些讨论非常有启发性，各种主题开始引起我的共鸣。我见到的每一个人都渴望拥有一个有效、高效且响应迅速的城市政府，这个政府能够：\n\
  \n* 改进客户服务；\n* 更具响应性；\n* 提高经济包容性；\n* 克服基础设施挑战；\n* 重新设计城市的许可流程；以及\n* 增强城市安全。\n\n\
  很显然，辛辛提已经准备好进行绩效和数据分析。在与市长和市会议员的面试期间，我开始引入这个话题，并令我高兴的是他们都非常接受。我知道如果我被选中，我将积极追求建立一项全面的绩效和数据分析计划。这是我过去在其他城市担任高级管理职务时尝试过的，但成功有限。在那些城市里，我的角色虽然重要，但没有市经理的角色那么重要。\n\
  \n当高级猎头打电话告诉我我被选中时，我将拥有独特的机会证明辛辛提可以反击对政府的主流观点和认知。\n\n政府并不非以平庸、缓慢和客户服务不力等术语为特征。地方政府管理可以是创新的、协作的、互动、透明且高性能的。我们可以为儿童和家庭的生活创造巨大的改变，同时发展当地经济。\n\
  \n我相信绩效和数据分析可以迅速帮助地方政府优化整体绩效，产生大量的节约和效率，以及运营上的突破。\n\n未来，本文将关注辛辛提利用绩效和数据分析使政府更加敏捷、有战略、响应和透明的经验。简而言之，绩效和数据分析让辛辛提能够为其公民的生活带来改变。我还将分享我们迄为止取得的一些成就。\n\
  \n辛辛提拥有一个支持 30 万居民人口的地方政府。它拥有 6400 名员工，跨 25 多个部门和办公室，拥有 14 亿美元的预算。辛辛提提供全方市政服务，包括警察和消防保护、公园和游乐、公路/街道、垃圾收集、健康和人文服务、文化、规划和分区以及水务/污水服务。\n\
  \n我们在辛辛提努力实现的是一种全面的综合方法，系统地整合几个关键要素，包括：\n\n* 一页战略计划\n* 绩效管理协议\n* CincyStat\n* 绩效预算\n\
  * 创新实验室\n* 开放数据\n\n我在 2014 年 9 月就任市经理，我的首要任务是为市长和市议会准备业务计划书，申请资金建立现在的市绩效和数据分析办公室。市议会在\
  \ 2014 年 10 月批准了建立该办公室的资金。设立了首席绩效官和首席数据官的职位，并在 2014 年 10 月到 2015 年 5 月期间，我们建成了一座独立的、先进的设施，即绩效和数据分析办公室\
  \ (OPDA)。\n\n\n\n\n\n该计划于 2015 年 5 月正式启动。通过将计划的核心放在 OPDA–CincyStat、创新实验室（Innovation\
  \ Lab）和开放数据部门，我们能够最大化协作效率。这是一个独特的方法，因为其他城市很少将这些功能结合。我们开展这些倡议的目标是通过更有效、更快、更智能地利用我们的资源，将辛辛那提成为美国管理最好的城市。\n\
  \nOPDA 产生了累计影响，随着时间的推移其回报巨大：\n\n* • 提高客户服务质量并缩短周转时间\n* • 直接降低/规避成本\n* • 增加收入\n*\
  \ • 良好声誉\n\nOPDA 的作用五个：\n\n* • 促进透明度和问责制\n* • 理解城市运营\n* • 创造性和战略性地解决问题\n* • 优化绩效\n\
  * • 寻找改进机会\n* • 培养全方位协作\n\n自成立以来，该计划已取得若干里程碑。设立 DA 的目的是开发和领导绩效倡议。我们采用了“一页纸战略计划”，并支持行政优先事项的设定。我们与每个部门负责人设计、开发并部署了“绩效管理协议”，以设定优先事项和预期。建立并运营了一个创新实验室，用于流程精简（类似于精益管理和六西格玛）。我们每两周举办一次\
  \ CincyStat 绩效管理会议。我们正在利用开放数据以传统格式以及可视化仪表板格式向公众发布市政数据集。我们甚至尝试了预测性分析，应用数据科学工具来提高有效性。\n\
  \n### 一页纸战略计划 (One Page Strategic Plan)\n\n尽管并不广为人知，但辛辛那提是多家财富 500 强企业和财富 1000 强企业的总部所在地。这意味着我们拥有着充足的人才和知识资源。在这次招聘过程中，我遇到的人之一是位退休的宝华高管，他现在与全国各地的组织合作制定战略计划。他使用一页纸解决方案\
  \ `OGSP` 工具，带领我和我的领导团队进行了一次一页纸战略计划流程。一页纸解决方案的战略强调清晰和目标，帮助我们确定了成功的标准。更重要的是，它帮助避免了制定出那种在书架上落灰的典型三环活夹计划。一页纸战略计划分为五个部分：\n\
  \n1. 使命：简洁阐述我们存在的意义或我们所做的工作。\n2. 目标：成功的标准是什么？\n3. 任务：用于跟踪与目标相比的进展的指标。\n4. 策略：如何做。\n\
  5. 计划：定义每项策略最重要的项目/行动。\n\n通过这一过程，我们确立了五个优先目标：\n\n1. 创新政府\n2. 财政可持续性与战略再投资\n3. 繁荣与健康的社区\n\
  4. 安全的街道\n5. 增长的经济\n\n该计划是我上职前 100 天的目标之一，我们有一个良好的开始。我一直深信，开始的方式通常决定结束的方式。你的前 100\
  \ 天通常决定了你第一年的可能走向，而你的第一年通常决定了你整个任期的整体走向。\n\n### 绩效管理协议 (Performance Management Agreements)\n\
  \n我非常渴望尝试的一点是创建由市经理和各部门负责人签署的绩效管理协议。这在很大程度上是一个新概念，因为我只知道有一两个其他市政采取过类似的措施。\n\n这些协议直接挂钩我们的“一页纸战略计划”，整合到城市的预算流程、员工年度考核中并公示。自引入这些协议以来，我们已经建立了\
  \ 100 项部门级的优先倡议。此外，市政部门已确定了超过 1500 个数据点用于定期收集和报告，确保所有船只始终朝着同一个方向航行。\n\n### 创新实验室\
  \ (Innovation Lab)\n\n我们的创新实验室 (`I-Lab`）是一个协作设施，帮助重新设计和精简市政流程，以提供更好、更快、更经济且更智能的服务。我们的团队会在\
  \ I-Lab 活动之前识别并界定项目范围。协调员帮助应用精益管理和六西格玛原则来优化效率和效能。在 I-Lab 中，所有人都是平等的，寻求所有的观点。`ILab`\
  \ 的体验可以焕发活力，并往往能激发热情，这有利于团队建设和情谊。\n\n得益 I-Lab，我们取得了许多成功，其中最大的之一是精简了建筑许可审查和批准流程，将市审批时间缩短了一半，从\
  \ 10.5 周减少到 3 到 5 周。我们还进行了许可费分析，以确保费用具有竞争力，并针对复杂项目设定费用增长目标，以增加资源用于精简机构间的协调。\n\n\
  另一个成功涉及消除了公用事业单的滞纳金。一度，市每月收到近 300 份公用事业账单。然而，由于我们总是延迟付款，因为没有建立相应的管理流程，我们每年会产生约 133,000\
  \ 的滞纳金。I-Lab 揭示了流程的问题。我们不再支付滞纳金，并且由于不需要让 300 个人支付这些账单而实现了生产力的提高。\n\n### CincyStat\n\
  \nCincyStat 是我们推动绩效和战略成果的主要工具。它是一项领导战略，旨在动员市政机构产生特定结果。首席绩效官领导市经理、领导团队以及每个部门的领导举行一系列定期的、常规的会议。会议使用数据分析过去的表现，设定新的绩效目标并审查整体绩效策略。\n\
  \nStat 程序具有以下四个特征的四大原则（Tenets）：\n\n1. 所有人共享准确且及时的信息。\n2. 有效的战术和策略。\n3. 资源的快速部署。\n\
  4. 不断跟进。\n\n在我看来，第四原则是最重要的。\n\n传统的 Stat 会室由一个讲台组成，供机构负责人和工作人员回答小组小组的问题。小组由市经理、助理市经理、首席绩效官以及预算、财务、GIS、人力资源、法律和\
  \ IT 部门的负责人组成。有两个投影仪投影特定 Stat 备忘录中的图表和其他信息，供所有人查看。我们的数据来源是各种数据库、客户服务系统和地理信息系统。软件应用程序帮助我们组织数据，并协助我们进行数据可视化。每场会议，我们都会准备一份详尽的执行简报，作为讨论的焦点。它提供了经常运营、短期和长期项目的状态更新。它还允许我们使用关键绩效指标监控核心业务。我们通过背景信息、分析、图表和问题深入探讨特定问题，以寻找改进机会。\n\
  \n部门 Stat 会结束后，我们的绩效分析师会为部门准备一份跟进备忘录，总结会议内容并确定下次 Stat 会议要处理的跟进事项。\n\n\n\n\n\n自 OPDA\
  \ 成立以来，辛辛那地的绩效管理计划对改善服务交付和整体效率产生了深远影响。该市已经消除了与交通、工程及公共服务部门相关的客户服务请求积压。通过对超过 1,400\
  \ 份已完成调查的反馈，我们成功使平均客户满意度初步提升了 7%。\n\n## 开放数据\n\n辛辛那市于 2017 年初推出了新的 CincyInsights\
  \ 网站，该网站为广泛的交互式公共仪表提供了展示平台。这些仪表板为可以使用互联网的人提供了通过用户友好的可视化查看市数据的机会。这些仪表板提取了辛辛提开放数据（Open\
  \ Data Cincinnati）门户中现有的市数据，并将其内容转换为图形化的热图和图表。用户可以使用社区位置、日期、活动类型等过滤器对映射数据进行交互和轻松分析。\n\
  \n目前，CincyInsights 网站拥有超过 15 个包含各种数据集的仪表板。仪表板涵盖的内容从实时铲雪车跟踪信息到进行中的道路项目，再到海洛过量用。每个仪表板都是根据我们的五个战略优先事项组织的。随着时间的推移，还将添加更多的可视化内容。\n\
  \n向普通公众提供这一工具，鼓励了个人和团体开发创新的方式来参与、改进和服务社区。CincyInsights 项目是辛辛那提市对透明度和数据驱动政府创新的整体承诺的延伸。\n\
  \n也许实现这一点的最强大工具是该市的地理信息系统（CAGIS）。它是一个企业级信息系统，为决策支持提供实时数据访问，从而提高了公共服务的协调、效率和质量。该系统将现有的业务规则和信息资源管理直接嵌入部门工作流中，而这一切是通过地理信息系统（GIS）技术与自动化业务流程软件的创新整合得以实现的。\n\
  \n辛辛那提在全市范围内部署的数据战略，通过频繁发布高质量数据供公众消费，确保了透明并增强了客户服务，同时提升了绩效管理。\n\n## 结论\n\n通过这些基于绩效和数据分析原则的倡议，该市已经能够并很好地定位继续通过信息共享增强客户服务交付、增加问责制并刺激经济活动。\n\
  \n这完全得益于强大的执行领导力，从市长和市会开始，他们从第一天起接受了这种方法。此外，数千名开发和实施这些变化方面做出巨大贡献的员工是真正的英雄，值得表扬。\n\
  \nOPDA 产生了 7 比 1 的投资回报率，并加强了财政监控和财务监督。\n\n正如辛辛那提已使用这些方法优化管理有效性一样，其他政府也可以这样做。它是有效的。它正在帮助我们满足并超过居民以及所有在辛辛那提生活、工作和娱乐的人的预期。\n\
  \n*最初发表于 Harry Black，“Optimizing Local Government Management Through Performance\
  \ and Data Analytics: The Cincinnati Story,” *Government Finance Review*, 2017 年\
  \ 6 月。经出版者许可转载。*\n\n## 7. 数字化解决方案\n\nSHAUN MULHOLLAND\n\n*PM*, 2015 年 10 月 13 日\n\
  \n2013 年，新罕布什尔州的艾伦斯敦（人口 4,300 人）开始将其所有的纸质文件数字化并简化小镇的行政流程。在此之前，文工作和流程是陈旧且低效的。\n\n\
  小镇最初关注其应付账款流程。他们成立了一个 LEAN 团队——LEAN 流程由丰田公司开发，旨在通过消除浪费的时间和流程来提高效率——用于研究现有的应付账款流程并在需要的地方开发新流程。换句话说，就是用更少的小镇资源为居民创造更多价值。随后，他们处理了公共记录的数字化，包括会议纪要、财产文件以及对小镇各个委员会议程包的公共开放访问。\n\
  \nLEAN 分析指出了几个限制因素。纸质文档的使用导致了时间和资源的浪费，而且员工和官员无法及时获取纸质文档也增加了完成流程所需的时间。纸张、复印、归档、邮寄、支票处理和文件运输等成本正在为小镇不断累积。\n\
  \n最经济且高效的解决方案是无纸化系统；然而，这需要对员工来说是全新的数字化流程。需要向艾伦斯敦不断增长的 IT 基础设施添加技术解决方案，以实现预期的效率。\n\
  \n小镇为所有部门实施了虚拟私有云。他们为这一过程选择了一个供应商，允许所有部门在一个通用平台上协作工作。\n\n在此之前，各部门在位于各自建筑内的独立计算机服务器上运行。当程序和数据传输到云端时，这些系统被消除了。\n\
  \n## 电子签名\n\n另一个影响效率的主要因素是各种文件需要签名。小镇通过实施电子签名流程解决了这个问题，该流程依赖于两个供应商。\n\nRightSignature\
  \ 是用于电子签名文档的主要基于 Web 的工具。SeamlessGov 是另一个用于创建电子签名应用程序文件的解决方案。\n\n国会于 2000 年 6 月\
  \ 30 日通过的全球和国家商业电子签名法（ESIGN）允许在商业和政府活动中使用电子签名。\n\n然而在某些关键文件中，一方可以要求墨迹，包括合同。在考虑实施电子签名流程时，建议审查\
  \ `15 U.S.C. 7001`（美国法典，2006 年版，补充第 4，第 15 标题——商业与贸易）。\n\n## 数字签名\n\n艾伦斯敦官员执行的大多数文件是通过电子签名完成的。这允许多个签署人从各自的所在地同时审查文件。\n\
  \n选民委员会成员可以使用小镇发放的计算机平板电脑远程签署文件。以纸质形式起源的文件在扫描为纯数字文档后，适用于电子签名流程。\n\n电子签名提供了诸如安全功能，例如检测数字错误或数字指纹的校验和。可以说，这些数字安全措施比墨迹更有效。校验和提供了签署文件的日期和时间以及签名设备的\
  \ IP 地址。\n\n人们通常认为墨迹签名更容易验证。事实却截然不同。基于手写体分析证明伪造案件并非完美的科学。手写体专家也很难寻找。这对于大多数依赖州级法医实验室进行分析的州来说尤为如此。\n\
  \n应付账款的第二个问题是小镇接收发票和支付发票的方法。发票是以纸质形式通过邮件接收的。然后开具支票并寄给供应商。\n\n\n\n\n为了改变这一流程，小镇创建了一个专门的电子邮件账户来接收供应商的发票，并还实施了电子资金转账来向他们付款。通过这种方法，我们能够在七天或更短的时间内收到发票并付款。在此之前，供应商的平均付款时间为\
  \ 30 天内。\n\n我们还与供应商协商，同意他们向小镇发送电子发票，并通过电子资金转账将付款汇入他们的银行账户。大多数供应商都同意参与这一流程，因为这让他们更快地收到付款。\n\
  \n我们现在使用的应付账流程仅由数字文件记录。该流程耗时大约七个月实施。过程分为几个阶段：识别问题、分析解决方案、测试解决方案、人员培训以及实际实施。\n\n\
  尽管过程有些详尽且冗长，我们在实施后仍然遇到了一些需要解决的问题；幸运的是，这些问题相对较小。其中一个问题是文档命名规范至关重要，便于搜索。\n\n另一个问题是需要\
  \ `Adobe Acrobat Professional` 软件，它具有合并文档的功能。例如，将一份扫描的发票和一份 `Word` 或扫描的采购订单合并成一个文档。我建议在进行这种重大转型之前，建立一套详细的流程。\n\
  \n### 物产文件的数字化\n\n在简化应付账款流程的同时，小镇与 `Ricoh` 签约将所有物产文件数字化。这包括规划、分区和建筑文件。`Ricoh` 从市政厅取走了艾伦斯塔镇的文件，并将其运到他们的办公设施。\n\
  \n他们将文件扫描成 `PDF` 文档，然后进行索引并传输到我们的云端。这一步只需要员工对文件和文档进行极少处理，这些处理是供应商无法解读的。\n\n现在所有部门都可以访问物产文件；在此之前，这些文件只能以纸质格式保存在市政厅。这种可用性对于外现场的消防员、警察和公共工程部门的人员特别有用，因为他们可以\
  \ 24/7 访问这些文件。\n\n文件的数字化还让市政厅以及现场以及其他小镇设施的人员能够立即访问。这种访问减少了员工的时间，并能够更快地获取信息，从而做出更快的决策。\n\
  \n我们经常收到公众对这些文档的请求。以前，工作人员必须手动在各种质质文件中搜索请求的文档。这花费了时间，而且通常需要工作人员复制文档提供给请求方。\n\n###\
  \ 快速搜索\n\n员工现在可以按地址、地图和地号或关键词搜索文件，并快速将文档通过电子邮件发送给请求者。这些文件启用了光学字符识别（`OCR`）功能，这意味着输入、手写或打印的文本被转换为机器编码文本，允许在\
  \ `PDF` 文档中搜索关键词。\n\n员工搜索并向请求者提供这些文档的速度为小镇节省了资金，并让个人更快地获得所需信息。这最棒的一点是，它还提高了商业交易的速度。\n\
  \n公共文档流程的下一阶段仍在评审中。下一步将通过我们网站上的 `Web` 门户网站让普通公众 24/7 访问文件，这将允许公众在他们需要时访问文档，而无需小镇工作人员的帮助。\n\
  \n我们目前正在研究两种解决方案。`Documall` 和 `SeamlessGov` 具有用于此目的的 `Web` 。`Documall` 有一个已使用一段时间的解决方案，而\
  \ `SeamlessGov` 正在新泽西州 Jersey 市（Jersey City, New Jersey）开展试点计划。\n\n我们仍处于分析的探索阶段，在实施我们这项效率项目的下一阶段之前，我们需要仔细研究成本效益差异——即价格变化与服务提供的价值增加之间的比率。\n\
  \n艾伦斯塔镇创建的系统并不是软件或 `Web` 应用。它只是列在我们云端某个硬盘上物产文件夹下的系列文件夹。系统通过地址、地图和地号识别。小镇内的每个物产都有自己的文件夹。每个物产的适用文档位于个人文件夹中。\n\
  \n这是一种相对低技术的解决方案，而且实施和维护成本较低。许多社区都有文档管理应用程序。我们的方案对于预算有限的小管辖区很有吸引力。\n\n我们在应付账中使用了类似的流程，因为以前使用的会计软件无法存储数字文档。我们创建的电子文件夹系统效率得多，并实现了成本节约。\n\
  \n我们之前的会计系统无法实现流程中的电子签名。我们后来转向了 Tyler Technologies 的 `Infinite` 软件。它为会计应用程序提供了电子签名流程以及发票、账单等文档的存储。\n\
  \n\n\n\n工作人员在几个案例中发现，尽管新的技术解决方案可能会提高效率，但在特定时期实施这些可能并非成本效益最高。\n\n*最初发表于 Shaun Mulholland\
  \ 的《数字解决方案》，刊载于《公共管理 (PM) 杂志》，2015 年 11 月刊。经出版商许可转印。*\n\n## 8. 数字壁纸开启大门\n\nCAITLIN\
  \ COWART\n\n各大图书馆正在采用独特的方法，让读者在图书馆之外也能获取数字收藏品。作为“数字图书馆社区项目”的一部分，圣安东奥公共图书馆（SAPL）创建了数字壁纸——这是一种虚拟书架，读者只需用智能手机扫描二维码即可访问电子书，这些壁纸可以放置在社区的各个角落。SAPL\
  \ 社区与公共关系经理 Caitlin Cowart 解释了图书馆是如何开发出这一系统的。\n\nSAPL 早于 2014 年启动了“数字图书馆社区项目”，旨在提高意识，并在社区的各个物理空间创建通往\
  \ SAPL 数字收藏的入口。\n\n第一个启动的项目是数字图书馆壁纸，这是一种类似于书架的二维贴纸，可以临时贴在墙上而不会造成损坏。从营销角度来看，这些壁纸是互动工具，可以作为材料的介绍和入口，同时增加了人们对\
  \ SAPL 的认知。每本精选书籍都有一个二维码，链接到我们 OverDrive 收藏中的标题，以及公有领域的标题。\n\n壁纸上展示了长期受欢迎的书籍——例如唐纳·塔特的*《金丝雀》*、约翰·格肖姆的*《勒索者》*以及吉莉安·弗莱明的*《消失的女孩》*》。我们还包含了当地学校阅读单上的书籍、西班牙语选书以及如《小屁孩日记》之类的儿童读。访问\
  \ OverDrive 收藏需要 SAPL 图书卡；无持卡者只能访问公有领域的作品。\n\n壁纸设计由 SAPL 的平面设计团队创作，灵感来自手机公司沃达丰（Vodafone），该公司曾在罗马尼亚的一项宣传活动中在其手机上提供电子书，以展示手机的功能。SAPL\
  \ 的原始设计完成后，平面设计团队与图书馆的内部数字服务部门合作，创建了链接到收藏中特定标题的二维码。我们还与收藏开发部门合作，购买了更多壁纸上展示的书目副本，以避免或减少候读情况。最后一步是与当地公司合作打印并安装壁纸，平均每幅成本约为\
  \ 900 美元。圣安东奥公共图书馆基金会和圣安东奥公共图书馆之友资助了该项目。\n\n首批展示壁纸的合作伙伴包括当地 YMCA、老年活动中心和社区中心、圣安东奥市中心的\
  \ Haven for Hope 流浪者收容所，以及我们自己的中央图书馆。现在已有三处地点设有壁纸，包括 Henry B. González 会议中心、DoSeum（一个儿童博物馆）以及许多公共公园设施。\n\
  \n“数字图书馆社区项目”是一种有效且具有视觉吸引力的营销方式。自启动以来，数字图书馆的使用量增加了 50%。2016 年，SAPL 通过 OverDrive\
  \ 的借阅次数超过了 100 万次。该项目对于尚未使用技术和应用程序的人来说，也是一种发现工具和入口。作为图书馆，我们的责任之一是引导方向。我们社区存在数字鸿沟。根据美国人口普查和皮尤研究中心的数据，39%\
  \ 的圣安东奥居民家里没有宽带网络接入，24% 的完全没有互联网连接。“数字图书馆社区项目”是我们用来帮助解决该问题的许多工具之一。\n\n*最初发表于 Caitlin\
  \ Cowart 的《数字壁纸开启大门》，刊于《美国图书馆》，2017 年 3 月 1 日刊。经出版商许可转印。*\n\n## 9. 随着 Google 和 Facebook\
  \ 同意政策引发“虚幻世界”，个人隐私正在侵蚀\n\nFRED H. CATE\n\n我们生活在一个日益由个人数据主导的世界里。\n\n其中一些数据是我们主动选择披露的，例如通过社交媒体、电子邮件以及我们每天发布的数十亿——是的，数十亿——信息、照片和推文。\n\
  \n另一些数据需要政府计划收集，这些计划适用于旅行、银行、就业以及私营部门提供的其他服务。所有这些都受到政府数据收集和报告要求的限制。\n\n我们的许多活动产生了我们甚至没有意识到其存在的数据，更不用说它们被记录了。2013\
  \ 年，公众携带了 68 亿部手机。这些手机不仅产生数字通信、照片和视频录制，还会不断向电信服务供应商报告用户的位置。智能手机应用程序也经常访问位置数据并通过互联网共享它们。\n\
  \n此外，还有视频和音频监控、Cookie 以及其他观察在线行为的技术，以及嵌入在护照、衣服和其他物品中的 RFID 芯片——这是一堆在我们不知情的情况下被收集的数据。\n\
  \n### 每年数万亿次的交易\n\n这些数据中的大部分由我们从未听过的第三方聚合，而我们与他们只有有限或没有直接的往来。根据《纽约时报》，其中一家名为 Acxiom\
  \ 的公司每年就进行 50 万亿次数据交易，几乎没有是直接从个人那里收集的。\n\n这些被称为“信息中介”，他们根据人口统计学信息（如收入水平、教育程度、性别）、人口普查表以及过去的行为（如人购买了什么衣服和食物）来计算或推断信息。这可以产生极具启发性的数据画像，并用于确定信用评分、营销预测以及其他量化我们的方法。\n\
  \n随着个人数据量、重要性以及价值的扩大，保护这些信息免受有害或不当使用的紧迫性也随之增加。但正如我们所知，这很容易。\n\n美国及其他地区的大多数数据保护法通过所谓的“通知与同意”机制，将保护隐私的部分或全部责任置于个人主体身上。\n\
  \n例如，1998 年，美国联邦贸易委员会在审查了美国、加拿大和欧洲的“公平信息实践规范”后，向国会报告，保护隐私的“最基本”原则是“通知”和“消费者选择或同意”。\n\
  \n美国的法律法规往往与 FTC 关于通知和选择的规则及建议并行。所有美国金融机构都要求每年向每位客户发送隐私通知，医生、医院和药房在每次访问时提供类似的通知。\n\
  \n对通知和同意的关注不仅限于美国。欧盟《通用数据保护条例》草案中“同意”一词出现了 100 多次，并强调了它的重要性。\n\n全球各地的人在线上花费越来越多的时间，在此过程中交出了数十亿份带有个人数据的文档。\n\
  \n### 都是我们的错\n\n事实是，通知与同意法对保护隐私的起很小，通常只是将保护隐私的责任从数据使用者转移到了数据主体身上——也就是我们。毕竟，如果出了任何问题，那是我们的错，因为我们同意了——往往是在没有意识到的情况下。\n\
  \n\n\n\n过度依赖“通知与选择”不仅无法保护隐私，还可能干扰并增加有益数据使用的成本，例如医疗研究以及创新产品和服务。（特别是当个人信息被与个人没有直接关系的关联方使用，或由传感器生成、由第三方推断时，情况尤为如此。）\n\
  \n## “虚幻世界”\n\n在 2014 年 5 月的一份报告中，美国总统科学技术顾问委员会将“通知与同意框架”描述为“作为政策的有效基础是行不可行的”。该报告强调，“只有在某些虚幻的世界里，用户才会在点击表示同意之前实际上阅读这些通知并理解其含义。”\n\
  \n有更好的替代方案。例如，通过制定法律对高风险或有害的数据使用施加实质性限制。另一种方法是加强政府和自我监管机构的审查力度，这可能禁止第三方对个人数据进行某些特定用途。\n\
  \n许多隐私倡导者指出，美国是唯一一个在联邦政府中没有专门隐私办公室的工业化国家。建立这样一个机构可能有助于确保隐私得到更多关注。\n\n其他努力也在进行中，旨在将“通知与选择”限制在必要且有意义的时刻，并使其变得更加简单清晰。\n\
  \n另一种有前景的方法是确保企业对其个人数据的使用负责，让它们对所造成的合理可见损害承担法律责任，而不是允许它们利用“通知与同意”继续将责任推卸给我们。\n\n\
  至少，个人数据的大型用户应被要求评估并记录这些使用行为带来的风险，以及他们为降低这些风险所采取的步骤。一种更正式的管理隐私风险的方法可以更好地保护隐私，随着时间的推移带来更高的一性和可预测性，并在风险可以降低的情况下允许数据用户对数据进行高效利用。\n\
  \n而另一种方案将是继续依赖那些无人阅读的通知、无人理解的选择，以及隐私法已变成的那个虚幻世界中的其他无效工具。\n\n原文最初发表于 Fred H. Cate,\
  \ “Personal Privacy Is Eroding as Consent Policies of Google and Facebook Evoke\
  \ ‘Fantasy World,’” *The Conversation*, 2014 年 12 月 15 日。经出版许可再印。\n\n## 第二部分。威胁与风险\n\
  \n## 10. 物联网正在改变网络安全行业\n\nLARRY KARISNY\n\n奇怪的是，物联网（IoT）行业——一个在网络安全漏洞方面记录惨淡的行业——竟然是推动网络安全发展的行业，但这正是正在发生的事情。随着监管的临近以及近期漏洞事件带来的负面报道，已经没有选择了：更好的物联网安全是必经之路。我本月将在奥兰多举物联网演变博览会上就这一主题发表演讲，我想先让大家预览一下部分内容。\n\
  \n### 物联网安全得了不及格的分\n\n如果我没记错，50 分是不及格分，然而，近 50%的物联网公司在近期记忆中报告了某种类型的安全漏洞。这一令人震惊的现实证实，必须采取行动来提高物联网的网络防御——而且要快。我涵盖了网络安全领域的许多领域，没有见过哪个行业的漏洞记录像这这样糟糕。尽管这些黑客攻击暴露了数据，但并非所有数据都有价值。有时，物联网攻击获得的是无用数据，无法为利用程序、拒绝服务攻击或机器控制攻击提供任何可用情报。更好的消息是，终于有能够满足稳固物联网安全需求的网络防御产品正在进入市场。\n\
  \n### 物联网需要新的网络防御技术\n\n物联网与众不同，具有改变一切的潜力。它是新的扩展边缘，能够以巨大的经济效益和准确性实现前所未有的应用和智能。这些微型设备是物理人工智能（AI）的下一步。我强调“物理”。它们存在于现实世界中，告诉人类和机器需要知道什么、需要做什么。如果被黑客，它们可能会操纵或破坏物理实体，其影响可能延伸到整个经济体，甚至可能造成生命损失。物联网不仅仅是一个数据库。物联网是物理世界中的精算师，必须经过认证、验证和保护，否则将面临非常真实的危险风险。\n\
  \n### 深度物联网需要深度安全\n\n在物联网中，没有空间运行标准的加密文件大小，甚至是简单的处理器更新补丁。这些微型设备是围绕极短的电池寿命而构建的，需要极微的低功耗处理器和极小的闪存内存。这种局限性迫使整个网络安全行业重新思考我们目前如何保护所有数字技术。我们今天开始看到这些新安全技术的成功部署。如果我们要在人工智能和物联网中实现深度学习，那么我们也需要“深度安全”。物联网正推动新的安全技术走向实现这一目标。\n\
  \n### 增强型区块链物联网安全的契合点\n\n如今的中心化安全模型需要与中心化云、大型服务器群和网络设备相关的高基础设施和维护成本。当物联网设备增长到数十亿时，必须处理的海量通信数据将产生瓶颈和可能中断整个网络的故障点。去中心化的区块链技术可以解决这些局限性，尽管区块链本身并不是一个完整的解决方案。作为一家增强型区块链安全公司的合伙人，我意识到区块链本身是有前景的，但它不是终极答案。就像目前的分层安全架构一样，我们在区块链中需要的是一个安全的安全的物联网，其中隐私得到了保护。增强型区块链分层安全技术可以提供这一点。\n\
  \n### 变革还是监管\n\n自我监管总是是好的，我希望物联网行业能获得自行寻找安全解决方案的机会。在与网络安全创业者合作时，我发现合规和监管似乎永远跟不上网络防御技术的发展速度。数十资金被投入到智能电网的安全合规中。虽然这些安全指南具有价值，但归根结底，合规并不意味着你是安全的。黑客每天都在变化，而合规建议可能需要几年。网络防御需要更具主动性，成熟的运行技术也是如此。\n\
  \n### 迎接后量子时代\n\n量子计算和物联网有非常光明的未来。我强调“未来”，是因为在量子计算和物联网协同工作之前还有许多问题需要解决。然而，短期内，量子计算将拥有破解任何静态加密算法的计算能力。更复杂的加密算法和更大文件大小解决方案将适用于物联网或任何其他行业。在我的上一篇文章《网络安全加密准备好崩溃了吗》中，我讨论了寻找新的低开销加密技术的重要性。\n\
  \n### 物联网安全的机遇\n\n\n\n\n拥有未来的 IoT 供应商将是那些投入产品安全性的供应商。即使是风险投资初创公司也清楚，他们需要保护其 IoT\
  \ 应用的安全。如果不这样做，他们可能会失去客户，在监管问题上花费资金，或者更糟，还会面临法律诉讼。聪明的 IoT 供应商会非常重视安全性并对其进行宣传，即使这涉及到溢价。他们开始发现客户愿意支付这笔溢价。甚至有\
  \ IoT 企业、托管服务和云计算公司也加入了这一竞争，并提供自己的解决方案。IoT 安全不再是一个选择，而是一项要求。\n\n*最初发表于 Larry Karisny，“IoT\
  \ Is Changing the Cybersecurity Industry,”*Government Technology*, 2018 年 1 月 16\
  \ 日。经出版者许可转载。*\n\n## 11. Equifax 泄露事件提醒了社会更广泛的网络安全问题\n\nRICHARD FORNO\n\nEquifax\
  \ 数据泄露事件又一次涉及从大型公司窃取大量个人数据的网络安全事件。此外，它再次提醒我们，现代世界依赖于关键系统、网络和数据存储，而这些系统的安全性并没有它们应有的那么高。它表明，在整个社会（行业、政府和个人用户）能够客观评估并改进网络安全程序之前，这些数据泄露事件将持续下去。\n\
  \n尽管这一特定事件仍在调查中，但此类泄露事件已经发生多年且规模不断扩大的事实为网络安全研究人员提供了另一个机会来研究为什么这些事件会不断发生。不幸的是，每个人都有很大责任。\n\
  \n在人们生活在一个真正安全的社会之前，需要解决几个主要问题：例如，公司必须找到并雇用合适的人来实际解决整体问题，并进行创新性思考，而不仅仅是修复日常问题。必须让公司认真对待网络安全——而在许多公司甚至有财务动机不去这样做的时期。在此之前，重大泄露事件将继续发生，并可能变得更加糟糕。\n\
  \n### 寻找合适的人\n\n数据泄露现在已是常态，并具有广泛的影响。Equifax 泄露事件影响了超过 1.43 亿人——远超 2013 年 Target\
  \ 的 1.1 亿受害者、2007 年受影响的 450 万 TJX 客户，也显著多于 2015 年美国人事管理局事件中约 2000 万的现任和前政府员工。雅虎\
  \ 2016 年丢失的用户记录据称有 10 亿受害者，可能创下了单次事件受害者最多的争议记录。\n\n在某种程度上，网络安全事件的发生是因为公司（以及政府）配置网络安全运营的方式。通常，他们试图通过外包信息技术管理（包括安全）来省钱。这意味着关于网络和计算机系统如何运作的大量见解和知识并不由公司内部掌握。在某些情况下，外包此类服务在短期内可能节省资金，但也会导致对公司长期运作方式缺乏机构性知识。\n\
  \n总的来说，关键的网络安全职能应该分配给内部员工而非外部承包商——而且这些人是谁也非常重要。根据我的经验，企业招聘人员通常侧重于通过检查正式教育和培训以及先前的相关工作经验来识别候选人——自动化简历扫描让这变得很容易。然而，网络安全既涉及技术技能，也需要大量的创意来应对和从数据泄露等安全事件中恢复。例如，据报道\
  \ Equifax 的保单金额超过 1 亿美元；索尼影视娱乐在 2014 年泄露后制定了 6000 万美元的保单来帮助支付费用。\n\n### 这种业务安排——仅仅将财务风险从一家公司转移到另一家公司——并没有解决任何潜在的安全问题。由于它只留下了某些负面宣传的风险，公司主动解决问题的紧迫感可能会降低。此外，它并没有解决安全事件发生时对个人造成的伤害——例如那些整个财务历史都存储在\
  \ Equifax 那里的人。\n\n网络安全问题并不非仅仅是人们在使用互联网时必须接受的另一个风险。但这些问题并不能通过另一个国家计划、政府计划或对继续遵循几十年前的基础性网络安全指南的公开埋怨来解决。\n\
  \n相反，科技行业必须在设计新产品和管理系统时绝不能走捷径：有效的安全指南和实践——例如控制对共享资源的访问，以及不要在我们的“物联网”设备中让密码变得无法更改——也必须成为产品设计过程的基本部分。而且，网络安全专业人员必须利用公共场所和会议来驱动创新思维和行动，以帮助从根本上解决我们持续的网络安全困扰，而不仅仅是销售更多产品和服务。\n\
  \n### 让漏洞变得无利可\n\n许多公司、政府和普通人仍然不遵循几十年来确定的基本网络安全实践。因此，得知 2015 年情报机构正在利用 20 世纪 70\
  \ 年代就预测的安全漏洞并不意外。推测犯罪集团和其他在线攻击者也是如此。\n\n\n\n\n因此，商业主义的出现是可以理解的——它既是一个机会也是一个风险。目前，当网络安全问题发生时，许多公司开始提供所谓的解决方案：一位行业业内人士将此比作计算机领域的“追逐救护车”。例如，在\
  \ Equifax 泄露事件公开后不到 36 小时内，该公司的竞争对手和其他公司就增加了对安全和身份保护服务的广告力度。但这些公司本身可能并不安全。\n\n确实有一些产品和服务——例如身份盗用监控——如果如果实施得当，可以帮助在问题发生时为消费者提供安慰。但当公司发现，向安全性受侵犯的客户推销产品，比花钱保护数据安全更赚钱时，他们就会意识到，保持脆弱状态是有利润的。\n\
  \n对于像 `Equifax` 这样的信用报告公司，问题被进一步放大了。消费者并没有要求他们的数据被大量采集，但现在数据已经泄露了，他们不得不承担后果和成本。（请记住，公司有那种保险单来限制其成本。）\n\
  \n政府监管机构在这里发挥着重要作用。像 `Equifax` 这样的公司经常游说立法者，以减少或消除对数据安全和其他保护的要求，寻求在仅最低度遵守规则的情况下免受潜在诉讼的法律责任，甚至可能试图欺骗消费者放弃诉讼权利。适当的监督将保护客户免受这些企业行为的影响。\n\
  \n### 做出承诺\n\n我过去曾主张，持有关键或敏感信息的公司和政府组织应该愿意投入资金和人员时间来确保其数据和系统的安全性和完整性。如果他们失败了，他们才是该事件的真正负责者——而不是攻击者。\n\
  \n美国国家标准与技术研究院（NIST）的一位研究员最近发言时阐明了这一原则，他承认自己多年前帮助设计的复杂密码要求实际上并没有提高提高安全性。换句话说，当情况发生变化或出现新事实时，我们必须根据需要随之做出改变。\n\
  \n许多此类问题确实是可以预防的。但只有当网络安全行业以及整个社会都遵循那位 `NIST` 研究员的做法时，这一点才成立。我们都必须现实地审视网络安全的现状，承认已经发生的错误并改变我们。\n\
  \n联邦司法机构将网络安全列为他们的首要行政任务。正如美国司法会议主席 Julia Gibbons 法官所说：“司法系统已经并将继续成为攻击目标，就像各地的政府和商业实体一样。”司法部门存在大量的网络攻击或数据入侵的入口点，包括信息系统、网络（包括\
  \ `WiFi`）、员工个人设备（包括智能手机）以及一系列法院技术。除了干扰法庭运营的破坏性后果外，黑客还针对司法系统中的大量封存信息。这些数据样本包括：\n\n\
  * 个人标识符——包括社会安全号码、信用卡和银行账户\n* 刑事案件中的机密证人姓名和搜查令\n* 涉及儿童和家庭的案件记录，包括收养\n* 涉及商业和企业的民事案件中的贸易秘密\n\
  * 家庭暴力和性侵犯案件中的受害者数据\n* 陪审团等级记录和证词\n* 医疗和心理报告\n\n### 网络攻击类型\n\n联邦调查局（`FBI`）将网络事件定义为“过去过去、正在进行或受到威胁的入侵、中断或其他事件，这些事件损害了或可能损害电子信息、信息系统、服务或网络的机密性、完整性或可用性。”四种网络攻击令法庭官员感到特别担忧：\n\
  \n* **拒绝服务 (DoS) 攻击**——这种类型的网络攻击阻止合法用户访问网络服务。`DoS` 攻击最常见的实现方式是通过向特定网站发送流量来阻塞服务器。\n\
  * **钓鱼攻击**——这种攻击利用社会工程学从毫无防备的用户那里索取个人信息。钓鱼邮件看起来是法的，要求用户输入用户名或密码等项目以破解账户。\n* **勒索软件**——这种类型的网络攻击感染软件并锁定数据访问，直到支付赎金为止。通过钓鱼邮件、路过下载和未修补的漏洞，黑客试图通过加密数据来勒索用户，直到满足预设条件。\n\
  * **间谍软件**——这种网络攻击也被称为广告软件，通过产生弹出窗广告、重定向浏览器和监控用户的互联网活动来感染计算机。\n\n### 预防网络攻击\n\n\
  预防网络攻击是法院安全规划的关键组成。有效的网络事件响应计划可以帮助执法部门定位并捕获犯罪犯。法庭官员必须识别法院数据资产和漏洞。一旦识别，IT 人员就可以建立必要的保护层和管理系统的记录协议。定期测试网络攻击防护计划至关重要，并要针对新兴威胁调整系统。IT\
  \ 人员必须关注病毒检测软件更新和新技术。除了规划之外，持续的员工培训是避免遭受损害活动的关键。\n\n跟上网络犯罪的速度需要处于安全技术的前沿。在安全方面的投入可以节省大量恢复资产的资金。因此，立法分支也发挥着重要作用，因为网络安全日益成为资金的重点。在公共预算面临挑战的时代，法院必须仔细制定他们的预算请求。\n\
  \n根据最近的国会证词记录，美国法院有计划地提交了 8500 万元的请求以涵盖网络安全活动。在 2018–2019 年的预算请求中，明尼苏州司法分支申请了 196.8\
  \ 万美元，以扩大其减轻数据泄露、数据损坏、系统停机、文档/数据丢失和网络攻击风险的努力。\n\n\n\n\n\n# 网络攻击响应\n\n妥善应对网络攻击需要即时且具有战略性的行动。在规划过程中，应当建立网络安全事件响应小组。关键的首要步骤包括确定入侵区域和攻击范围。完成评估后，应向至少一个执法机构报告攻击，并向公众解释情况。\n\
  \n行政部门的执法机构是应对网络攻击响应中至关重要的组成部分。美国司法部为响应和报告网络攻击事件提供了最佳实践建议。`FBI` 为网络攻击事件报告制定了清晰的指南。明尼苏达州官员在遭受\
  \ `DoS` 攻击后，曾与 `FBI Cyber Task Force` 合作进行处理。在国土安全部内部，美国计算机应急响应小组（`U.S.-CERT`）为联邦部门、机构以及州和地方政府开发及时且可操作的网络安全信息。\n\
  \n## 总结\n\n法院系统是个人和组织敏感数据的守护者。但他们不能单自履行这一责任。在网络攻击的预防和响应中，司法部门需要政府其他部门的资源，才能有效保护数据资产。\n\
  \n*本章代表作者的个人观点，不代表新泽西州司法部。*\n\n\\*最初发表于 Brian McLaughlin 的《网络安全：保护法院数据》，*PA Times*，2017\
  \ 年 5 月 26 日。经出版者许可转载。*\n\n## 13. 医疗保健行业日益面临网络安全泄露\n\nMARGARET STEEN\n\n这些场景令人不寒而栗：繁忙的医院突然无法使用任何电子病历或其他计算机系统。作为`ransomware`勒索软件攻击的受害者，如果不向锁定记录的人支付费用，该医院将无法重新获得访问权限——如果还能获得的话的话。\n\
  \n在另一家医院，黑客找到了连接到控制`IV pumps`软件的方法，更改了其设置，使其不再输送正确的药物剂量。\n\n网络安全专家表示，在考虑医疗保健行业时，这些是他们所担心的情况之一——该行业由于对技术的依赖和拥有大量数据，正日益成为网络犯罪的目标。\n\
  \n“近年来，我们看到网络威胁对医疗保健组织构成的风险正在升级，”美国卫生与人类服务部助理秘书准备与响应办公室应急管理处 `韧性部门` 主监斯蒂夫·库伦（Steve\
  \ Curren）表示，“自 2014 年以来，我们发生了 10 起不同的医疗保健组织数据泄露事件，这些泄露导致超过 100 万份患者记录受损。”\n\n从 2016\
  \ 年开始，攻击者加强了针对医疗保健系统的`ransomware`勒索软件攻击。“这极具破坏性，”库伦说，这有时迫使医院实施应急程序。\n\n`Ransomware`勒索软件攻击“直接影响了医疗保健，”企业软件公司\
  \ `Splunk` 安全研究负责人蒙齐·梅尔扎（Monzy Merza）表示，“有几报告显示英国的医院无法进行 X 光检查。连接到`X-ray machines`的计算机设备遭到`ransomware`的破坏和攻击，导致在一段时间内无法运行。”\n\
  \n专家表示，风险增加有许多原因——而且在缓解风险方面也面临诸多挑战，其中一些是医疗保健行业特有的。\n\n“网络安全在某种程度上是一门新兴学科，”梅尔扎说，“我们仍在学习。制造商正在学习如何在这个新世界中运作。这些技术的运营者和所有也是如此，他们也在学习什么是最佳实践以及如何管理它们。”\n\
  \n## 医疗保健行业成为网络犯罪吸引目标的原因\n\n**大量数据。** 菲利斯·A·斯内克（Phyllis A. Schneck）表示，人们发起网络攻击有多种原因。她是\
  \ IBM 旗下`Promontory Financial Group`的`cybersolutions`执行董事兼全球负责人，并曾任`FBI InfraGard`计划的国家董事会主席。有些人纯粹是为了好玩；另一些人则蓄意试图破坏基础设施。\n\
  \n但一个共同原因是为了经济利益而盗取知识产权或个人信息。由于医疗保健提供者存储了大量信息：家族史、病史、财务信息，医疗保健行业对于寻求信息的人来说是一个“资源丰富的环境”。\n\
  \n“个人信息有市场价值，而医疗保健行业是信息的绝佳来源，”斯内克说。商业秘密也可以出售获利。\n\n库伦说，医疗保健组织还拥有大量信息，对于那些想要医疗保险欺骗、医疗补助欺诈或身份盗窃的人来说非常有价值。\n\
  \n`Ransomware`勒索软件攻击是另一种赚钱方式。\n\n“最具性价比的方式在于锁定系统：发送恶意软件冻结医院里所有的电脑，然后说：‘如果你给我钱，我就把解锁代码发给你’，”德德波拉·A·利维（Deborah\
  \ A. Levy）说，她是`美国公共卫生服务部`的退休上尉，现任内布拉斯加大学医学中心公共卫生学院流行病学系教授兼主任。随着向电子健康记录的发展，该行业已成为更大的目标。\n\
  \n如果个人医疗记录包含有关名人的敏感信息，那么它们也可能具有吸引力，尽管通常情况下这类信息的市场较小。\n\n**不同组织之间的连接。** 梅尔扎说，“我们现在看到更多此类现象的原因是因为网络和设备到网络的连接性。连接设备具有明显的优势——自动化、信息共享、知识丰富、情境化。但由于有了这种网络连接性，你就让自己暴露在攻击之下了。”\n\
  \n医疗保健行业内的组织还需要相互通信，因此即使一家大型保险公司或医院能够保护其数据，当它们与资源较少的小型组织共享连接时，可能仍然非常脆弱。\n\n“我们拥有一个非常多元化的行业，”库伦说，从资源丰富的保险机构到非常小的诊所都有。\n\
  \n**开放的文化。** “医疗保健具有开放、共享的文化——这对于支持其首要任务是恰当的——但这种文化增加了安全隐私问题，”美国卫生与人类服务部医疗行业网络安全任务小组在\
  \ 2017 年 6 月发布的《医疗行业网络安全改进报告》中指出。\n\n这意味着医疗保健组织保护其数据比其他某些行业更困难。\n\n“他们没有真正好的安全技术和隐私政策，”尼姆·雅拉基（Niam\
  \ Yaraghi）说，他是布鲁金斯学会技术创新中心的非驻研究员，也是康涅契格大学商学院的运营和信息管理助理教授，“他们就像是富人区里唯一一家没有安保系统的房子。”\n\
  \n“每个医疗保健组织首要和核心的任务是治愈病人和帮助患者，”雅拉基说，“当你被送进急诊室时，你脑子里的第一件事是：‘希望这家医院的医生真的是非常好的医生。’他们是否会对你的血压和药物过敏史保密——这不是你最关心的事。他们的业务是为患者提供医疗服务；而不是技术业务。”\n\
  \n## 关注解决方案\n\n\n\n\n\n对于医疗保健行业的每一个人来说——医院、诊所、研究人员和患者——数据泄露的结果可能从令人恼恼到灾难性不等。\n\n\
  患者可能会受到伤害甚至死亡。系统宕机会导致许多人（包括患者和医疗保健工作者）感到不便。在消费者拥有选择权的地区，负面声誉可能会损害诊所和医院。\n\n“这是一项竞争激烈的业务——如果一家机构遭受了攻击，可能会影响公众选择的去向，”Levy\
  \ 说。\n\n预防是最好的解决方案——但它也面临着挑战。专家们提供了这些建议，以加强安全防护，防止或减轻攻击：\n\n### 教育与意识\n“过去，实施网络安全功能要挑战性得多，因为人们并不认为它是必不可少的，”`Trustifi\
  \ LLC` 首席执行官 Idan Edry 说，“他们会说：‘我没被黑过，也没有人偷过任何信息，所以我没问题。’今天，使用安全系统的一线人员（包括患者和医疗专业人员）更加意识到其重要性。持续的教育将有助于确保需要这些系统的人能够跟上。”\n\
  \n### 简单性\n系统越复杂，更新以防范网络攻击就越困难。“保持简单：不要有太多的东西，以至于你更新其中一个时就会导致全部崩溃，”Schneck 说，“你拥有的新设备越多，你的漏洞就越多。”\n\
  \n### 备份系统\n当系统未能防止攻击时，良好的备份可以让情况变得更容易。“在勒索软件的情况下，拥有非常好的备份很重要，这样当某些东西被破坏时，你能够恢复运行，”Merza\
  \ 说。\n\n### 应急计划\n网络安全可能是一项新兴挑战，但应急管理者可以使用他们应对其他情况的策略来解决它。“如果一家医院受到网络事件的干扰，这和被水龙风或其他任何其他因素干扰是一样的，”Curren\
  \ 说。\n\n### 持续警惕\n设备的制造商和所有者在防止攻击方面都承担着责任。用户和操作者应该准备好遵循安装和测试更新的最佳实践。“从基础知识开始，”Merza\
  \ 说。制造商应该不断评估设备的漏洞，并与所有者共享这些信息。“制造商能多快地识别问题、提出修复方案并将方案分发给用户？”\n\n### 现实的监管\n网络安全计划需要考虑到医疗保健行业的使命和文化。例如，说所有操作者都应该立即安装补丁是很容易的。但\
  \ Merza 说，“由于许多原因，这有时是不可行的。”监管系统的政府机构审批可能很慢。目前的监管环境无法应对不断演变的威胁以及技术发展的速度。现在监管机构有了一个机会，与操作者和制造商合作以理解需求，以便人们能以合理的方式实施这些需求。”\n\
  \n### 对风险的健康态度\n很容易指责医生不愿学习新的电子记录系统，或不愿更新他们的电脑。“医生们因对网络安全不细心而闻名，”Schneck 说。但对于负责的人来说，记住所有使用系统的人的目标很重要。研究人员需要能够共享信息并生产新药。医疗保健提供者需要能够交换患者信息。某些安全措施可能会让医疗专业人员难以工作。Schneck\
  \ 说，关键是从风险管理的视角来考虑网络安全。“这不是医生的错，因为他太忙了，认为自己没有时间记住一个无法被破解的复杂密码；也不是护士的错，因为她压力太大，无法仔细阅读每一封邮件并发现那是一封钓鱼邮件，”Yaraghi\
  \ 说，“我完全不责怪医生和医疗保健行业的人。”\n\n### 合作\n医疗系统中的许多参与者都是相互连接的——例如，医院与医生办公室、药房和保险公司通信——因此，对一个安全性较弱的实体的攻击可能会威胁到其他实体。“医疗行业正在形成一种强烈的感，即我们必须共同努力，并且必须致力于相互共享信息以使这一工作运作，”Curren\
  \ 说。例如，医院需要相互通知尝试性攻击，以便其他医院能够防止这些攻击。\n\n此外，Merza 说，长期解决方案是设备制造商“开发难以被破坏的产品和服务。“政府、设备制造商和这些设备的操作者都真的必须为了公共医疗保健人群的利益共同努力。”\n\
  \n最初发表于 Margaret Steen 的文章《医疗保健行业日益面临网络安全泄露，《政府科技》（Government Technology），2017 年\
  \ 10 月 25 日。经出版者许可转载。\n\n## 14. 就在邮件中\n\n### Aetna 同意支付 1700 万美元解决 HIV 隐私泄露案\n\n\
  ELANA GORDON\n\nAetna 周三达成了一项金额 1700 万美元的诉讼和解，涉及 2017 年夏天发生的一起数据泄露。Aetna 保保的多达 12,000\
  \ 名患者的隐私通过一种非常低技术的方式遭到了破坏：他们正在服用 HIV 药物的事实通过信封的透明窗被泄露了。\n\n“我很震惊了，”Sam 说，他清楚地记得\
  \ 8 月份收到通知的那一天。（Kaiser Health News 和 NPR 同意不使用他的全名，因为他担心公开自己的 HIV 状态可能会影响他的工作。）这封信寄到了他在新泽西州一个公寓楼的邮箱里。他没有直接参与诉讼，但说这封信触及了他以前从未感受过的脆弱性。\n\
  \n“我还没有向我的父母透露过我的 HIV 状态，”36 岁的 Sam 说，他是一名民权律师。“假设那封信被转寄到了他们家里，有人恰好打开了邮件。这些都是我脑子里闪过的想法。”\n\
  \nAetna 在一份声明中写道：“通过我们的外活动、即时救助计划以及这次和解，我们一直在努力解决这一不幸事件对成员造成的潜在影响。”\n\n该保险公司还表示，正在“实施相关措施以确保此类事件不再发生，这是我们对保护敏感健康信息最佳实践承诺的一部分。”\n\
  \n讽刺的是，这些信是为了回应之前对隐私侵犯担忧而发送的。Aetna 要求成员通过邮寄药房获取 HIV 药物。受影响的人服用的是用于治疗 HIV 或降低感染病毒风险的药物，这种方法被称为\
  \ PrEP，即暴露前预防。\n\n2014 年和 2015 年提起的诉讼指控该政策具有歧视性，阻止了服用 HIV 药物的患者从药剂师处接受面对面的咨询，并危及了成员的隐私。\n\
  \nAetna 与个人原告达成和解，并更改了政策，允许成员在零售药房面对面取用 HIV 处方，反过来向任何开过 HIV 处方的人发送了通知信。\n\n正是这些通知信上的大信封透明窗泄露了敏感的\
  \ HIV 信息。\n\n\n\n\n\n虽然围绕艾滋病（HIV）的污名可能不像以前那样严重，而且治疗手段有了很大进步，但宾夕法尼亚艾滋病法律项目（AIDS Law\
  \ Project of Pennsylvania）主任 Ronda Goldfein 表示，现实情况是严重的歧视仍然存在。这意味着保护患者隐私对于确保人们在接受医疗服务时感到安全至关重要。\n\
  \n随着数百封收到 `Aetna` 信件的人的电话不断打入 Goldfein 的办公室以及全国其他地区，她了解了更多令人心碎和毁灭性的经历。她说，她听到一个男人的遭遇，当邻居看到信件后，他的门上被涂满了同性恋歧视言论。\n\
  \n其他信件接收者觉得需要搬出社区。Goldfein 说，对于其中一位状况在紧密的移民社区中被公开的女性来说，“她无法正常生活，无法去上班，并丢了工作。”\n\n\
  `宾夕法尼亚艾滋病法律项目`和 `Legal Action Center`最初在 8 月底发出了一封要求函，要求保险公司停止邮寄。该公司做出了回应，为受影响的人设立了救助基金并表示道歉。“这家医疗保险公司说：这种错误是不可接受的，我们正在对我们的流程进行全面审查，以确保此类事件不再发生。”\n\
  \nGoldfein 和其他人很快发现，邮寄的范围比最初想象的要广泛：多达 12,000 人收到了信件。她的机构、`Legal Action Center` 和\
  \ `Berger & Montague PC` 提诉并寻求集体诉讼地位。\n\n拟议的和解中概述的隐私泄露包含两个方面：`Aetna` 在未获得适当授权的情况下向其法律顾问和供应商发布了\
  \ 13,480 人的姓名。其中，有 11,875 人收到了信件，信件暴露了他们正在服用艾滋病毒药物。\n\n拟议的和解正在等待联邦法院的批准，但在协议中 `Aetna`\
  \ 同意支付 1700 万美元，并建立新的“最佳实践”以防止此类事件再次发生。\n\nGoldfein 说，作为赔付的一部分，这些律师事务所将留出至少 1200\
  \ 万美元，向估计的 11,875 名可能收过泄露此类信息信件的人支付每人至少 500 美元的费用，并承认“伤害在于身份被泄露”。此外，人们将不再需要提交额外的文件并处理更多与其艾滋病毒药物相关的邮寄。\n\
  \n将为那些经历了额外财务或情感痛苦的人设立一项基金。个人可以申领最高 20,000 美元。剩余资金将用于法律费用和开支。\n\n明尼苏达大学隐私法和数据泄露专家\
  \ William McGeveran 表示：“这笔和解金额比普通的身份盗窃场景要大得多。在普通的身份盗窃中，通常是在线数据库被破解，人们声称的主要伤害是他们可能成为身份盗窃的受害者，财务信息可能被泄露。”\n\
  \n这一金额可能并不寻常，但 McGeveran 也说，这种低级别的泄露并不寻常。公司可能过度关注 IT 安全，而忽略了隐私被泄露的其他方式。\n\n“它们比人们意识的要常见，”McGeveran\
  \ 说，“人们对网络安全非常关注，这是完全正确的，但许多医疗隐私问题比网络安全要模拟得多。这些问题关乎信息被偷听、关于纸质记录，而在本中，它是关于纸质邮寄。”\n\
  \n除了赔付本身，她希望这项诉讼有助于改变公司在关注度方面的文化。\n\n## 什么是黑客？\n\n那么，黑客和他们的方法到底是什么样的？以下是一些术语表。\n\
  \n### 黑客类型\n\n### 电话黑客 (Phreakers)\n也许是最老老的计算机黑客类型，电话黑客发现电话系统的工作原理，并利用这些知识拨打免费电话。过去，电话黑客曾使用我们现在认为的黑客技术来访问大型机和可编程电话交换机，以获取信息、更改记录。著名的（现已退休的）电话黑客包括\
  \ `Kevin Mitnick` 和 `Kevin Poulsen`。\n\n### 破解者 (Crackers)\n这些人绕过专有软件、DVD、电脑游戏以及受数字权利管理（`DRM`）保护的媒体的安全控制措施。破解者交易、分享和发布游戏破解版、补丁、序列号和密钥生成器（keygens）。他们还在其破解版和补丁中嵌入恶意软件，形成木马，以阻止外部人员（主要是脚本小子）使用他们的代码。那些经常使用其破解版的毫无防备的人通常会发现自己感染了病毒。\n\
  \n### 黑帽黑客 (Black Hat Hackers)\n这些是出于邪目的积极开发恶意软件、侵入技术和工具的破解者。犯罪组织、外国政府和间谍机构会为最新的零日漏洞（公众未知的漏洞）支付巨额报酬。\n\
  \n### 白帽黑客 (White Hat Hackers)\n这些是好人。白帽也被称为“伦理黑客”和“渗透测试员”，是安全研究人员。他们通过进行渗透测试和安全审计（通常使用黑帽相同的工具，但在法律范围内进行）来测试系统，为不想被黑客攻击的企业和组织提供服务。\n\
  \n### 灰帽黑客 (Grey Hat Hackers)\n灰帽通常在法律范围内工作，但可能会发布漏洞和利用程序，或者在不询问太多问题的情况下将漏洞出售给未知买家。\n\
  \n\n\n\n他们也可能匿名向软件供应商报告漏洞，以避免受到起诉。不幸的是，某些供应商反对其缺陷代码被发现，并阻碍对他们产品进行安全研究。\n\n`脚本小子（Script\
  \ kiddies）：` 也称为“skiddies”，这是一群日益增多的业余黑帽，他们无法开发自己的代码，但能够调整他人的利用程序并使用黑客工具攻击组织和彼此。\n\
  \n脚本小子认为这个术语具有冒犯性，众所周知他们会对贬低他们或其技能的人发起网络攻击。\n\n与在线抗议组织“匿名者”（Anonymous）相关的许多“黑客”很可能是脚本小子。\n\
  \n`网络部队、网络士兵（Cyber-troops, cyber-soldiers）：` 这些是受过黑客技术的国家支持军事人员，他们恶意软件和黑客技术进行间谍、收集情报、盗取知识产权以及破坏敌系统。\n\
  \n`垃圾邮件发送者和钓鱼者（Spammers and Phishers）：` 垃圾邮件发送者使用程序——垃圾邮件机器人（spambots），自动向产品的潜在买家发送电子邮件、短信、即时消息和推文。\n\
  \n钓鱼者使用相同的技术（以及虚假的“钓鱼”网站）诱骗受害者点击链接（并输入用户名和密码）并下载安装恶意软件。《垃圾邮件之王》（Spam Kings）一书记录了许多垃圾邮件发送者的早期历史。\n\
  \n### 攻击类型\n\n既然我们已经知道坏人是谁了，让我们来看看他们做什么，以及他们的行为可能如何影响人们。\n\n`脚本注入（SQL, JavaScript）攻击：`\
  \ 大多数网站都连接到数据库。通过结构化查询语言（`SQL）注入），攻击者在这些数据库上运行自己的代码，允许他们更改记录、删除数据并提取私人信息，如信用卡号、密码或密码哈希值。\n\
  \nJavaScript 注入发生在公共可写的网站上，如 Facebook、Twitter 以及带有论坛和讨论板的网站。如果不进行妥当过滤，攻击者可以上传脚本从访问该网站的人那里提取私人信息。\n\
  \n脚本可以绕过防火墙以提取用户凭据、跟踪用户活动、安装恶意软件，甚至打开摄像头和麦克风。防止此类攻击的最简单方法是在您的浏览器中关闭脚本功能。\n\nFirefox\
  \ 的 NoScript 插件是实现此点的一种简单方法。\n\n`密码破解（Password cracking）：` 简单来说，如果攻击者能猜到你的密码，他或她就可以接管你的计算机。大多数计算机用户被必须记住的帐户名和密码数量所困，因此他们倾向于重复使用。\n\
  \n攻击者可以使用 `SQL injection` 从安全性较差的网站上恢复密码或密码哈希值，然后尝试使用相同的用户名和密码登录银行账户等高价值网站。\n\n\
  限制密码长度的网站和电子邮件系统最容易受到攻击。\n\n`暴力破解（Brute force attacks）：` 这些攻击使用自动化工具猜测密码或重新创建密码哈希。\n\
  \n防止这种攻击最有效的方法是：(a) 使用长密码，以及 (b) 使用不同的密码。\n\n`DoS/DDoS：` （分布式）拒绝服务攻击通常针对组织发起，其服务器会被大量的“损坏的”网络通信淹没，导致服务器变慢甚至崩溃。\n\
  \n依赖在线交易的公司如果发生这种情况，将损失大量资金（和声誉），并通常会付给攻击者以停止攻击。\n\n`病毒、蠕虫和木马（Viruses, worms and\
  \ Trojans）：` 这些是用于传播恶意软件的载体。病毒通过优存盘传播，蠕虫通过互联网传播，而木马由毫无防备的用户下载。\n\n防病毒软件会阻止大部分此类活动，但无法阻止最新的（或零日）恶意软件攻击。\n\
  \n`犯罪软件、劫持者和勒索软件（Crimeware, hijackers and ransomware）：` 黑帽攻击已成熟为一个行业。黑客可以花费几千美元购买犯罪软件包，开始经营分恶意软件的业务，接受付款并洗钱。\n\
  \n劫持者接管你的网络浏览器并将你重定向到广告网站。勒索软件感染你的计算机并提示你拨打一个免费电话，在那里你可以付费让你的计算机被远程“消毒”。\n\n浏览器内恶意软件（如\
  \ `Zeus`）可以拦截你浏览器和手机中的在线网银行会话，通过向攻击者发送资金来排空你的账户。\n\n`机器人和僵尸网络（Bots and bot-nets）：`\
  \ 机器人模拟人类用户。一旦机器人感染了你的计算机，你就被“占有”了。你的计算机（现在是一个僵尸）由机器人僵尸主（bot herder）远程控制，他可以使用它以及数十万个其他僵尸发起\
  \ DDoS 攻击、破解密码、发送垃圾邮件并托管非法内容。\n\n### 保护你自己\n\n我们只能尽量降低风险，但这些风险是众为人知的。关闭脚本，维护你的防病毒软件，不要阅读未经请求的电子邮件，使用长密码，使用不同的密码，不要下载你没有寻找过的程序，保持怀疑……最后：学习计算机安全（以发现你还可以做些什么）。\n\
  \n不需要偏执。只需留心。白帽黑客的存在是为了通过暴露风险和测试系统来提供帮助。信任他们。他们是好人。\n\n*最初于 James H. Hamlyn-Harris\
  \ 的《Explainer: What Is Hacking?》，刊载于 *The Conversation*，2013 年 4 月 1 日。经出版者许可转载。*\n\
  \n## 16. 中国网络威胁是如何演变的\n\nDOROTHY DENNING\n\n在其 14 亿人口中，超过一半的人已在线，这个世界上人口最多的国家汇聚了大量的网络间谍和黑客。事实上，中国从企业和政府处窃取的秘密可能比任何其他国家都多。\n\
  \n隐性间谍活动是对美国主要的中国网络威胁。虽然破坏性网络攻击偶尔来自中国，但那些造成公开损害（如破坏数据或导致停电）的攻击更多地来自其他顶级国家威胁，即俄罗斯、伊朗和朝鲜。\n\
  \n但中国对美国的网络侵略一直在演变。在他们的间谍活动成为严重威胁之前，中国黑客曾对美国和其他国家进行破坏性网络攻击。\n\n### 黑客结盟\n\n中国黑客是首批为防御国家而团结在一起的人。他们针对美国的首次行动发生在\
  \ 1999 年科索沃冲突期间，当时美国误炸了位于贝尔格莱的中国大使馆，导致三名中国记者死亡。爱国黑客在几个美国政府网站上张贴了谴责“北残暴行动”的信息。\n\n\
  中国黑客在 2001 年再次袭击美国，当时一架中国战斗机与一架美国侦察机相撞。导致中国飞行员死亡，美国机组被迫迫降并扣留。中美两国黑客都以破坏性网络攻击作为回应，中国黑客篡改了数千个美国网站，包括白宫网站。\n\
  \n然而，这次事件特别重要的是随后发生的事情。中国共产党的官方报纸《人民日报》发表了一篇谴责攻击白宫的社论。该报将这次攻击以及其他攻击称为“网络恐怖主义”和“违反法的不可原谅的行为”。2002\
  \ 年在该事件发生周年之际，政府要求中国黑客放弃针对美国网站的进一步攻击。他们遵守了。\n\n这是中国爱国黑客对美国的最后一次大规模网络攻击。虽然俄罗斯似乎纵容、甚至公开鼓励或资助其爱国黑客，但中国已对这类活动采取立场，至少针对美国网站是如此。\n\
  \n### 目标在在国内\n\n\n\n\n除了收紧其爱国主义黑客之外，中国似乎已经克制了对其他国家关键基础设施造成显性损害的网络攻击，就像俄罗斯对乌克兰电网所做的那样。然而，它确实利用了破坏性网络攻击来帮助在其境内执行审查政策。\n\
  \n中国政府的“大防火城”阻止了中国互联网用户访问被审查的外国网站，例如那些主张西藏自治的网站。用户的流量根据域名、互联网地址和网页地址中的关键词进行过滤。\n\
  \n中国黑客还利用拒绝服务攻击（DoS 攻击）临时封锁政府想要屏蔽的网站。这些攻击通过大量的活动使目标服务器过载，阻止他人使用这些网站，并通常会导致服务器离线。\n\
  \n回到 1999 年，政府针对与法功相关的外国网站发起了`DoS`攻击，法功是一种在中国被禁止的精神运动。随后在 2011 年，中国的一档军事电视节目展示了用于用于对美国法功网站进行可能（网络攻击）的软件工具。这些工具是由中国电力工程大学的武装力量——解放军开发的。\n\
  \n最近，在 2015 年，美国及其他外国用户在访问由中国搜索引擎提供商百度运行分析软件的网站时，无意中感染了恶意软件。这些恶意代码被注入到由大防火城同地设备传回用户的流量中。随后，该恶意软件对`GreatFire.org`（一个帮助中国用户规避审查的网站）以及《纽约时报》中文版发起了`DDoS`攻击。\n\
  \n### 间谍活动处于前\n\n到 2003 年，中国对网络间谍活动的兴趣已显而易见：一系列被美国调查人员代号为“泰坦雨”（Titan Rain）的网络入侵被追溯到中国南方的计算机。这些黑客被某些人认为是中国军队，他们入侵并盗取了属于美国国防部、国防承包商和其他政府机构计算机的敏感数据。\n\
  \n“泰坦雨”之后出现了一系列源自中国的间谍事件，并被赋予了“拜占庭哈德”（Byzantine Hades）、“幽灵网”（GhostNet）和“极光”（Aurora）等代号。窃取者的目标是广泛的数据。\n\
  \n他们偷了知识产权，包括谷歌的源代码和武器系统设计。他们获取了政府机密，包括用户名和密码。他们还破解了与中国人权活动人士相关的数据，包括他们的电子邮件信息。通常，这些入侵始于叉式钓鱼攻击。\n\
  \n2013 年，美国网络情报公司`Mandiant`（现为`FireEye`的一部分）针对一个命名为“高级持续性威胁 1”（APT1）的中国间谍组织发布了一份具有里程碑意义的报告。根据报告，`APT1`自\
  \ 2006 以来从至少 141 个组织盗取了数百 TB 的数据。\n\n`Mandiant`的报告详细说明了行动细节，并提供了将这些盗窃行为与解放军`61398\
  \ 部队`联系起来的证据，并点出了该部队的五名军官。这是任何安全公司首次公开将针对美国的网络行动与外国政府联系起来。2014 年，美国起诉了这五名中国军官，控控计算机黑客和经济间谍罪。\n\
  \n`Mandiant`将`APT1`描述为“源自中国的 20 多个 APT 组织之一”。其中许多组织被认为与政府有关。来自非营利机构“关键基础设施技术研究所”（ICIT）的一份报告描述了\
  \ 15 个国家资助的高级持续性威胁组织，包括`APT1`和另外两个与解放军部队相关的组织。报告未指明其余组织的资助者。\n\n### 十五规划\n\n根据该研究所的说法，中国的间谍活动支持该国的“十三五规划”（涵盖\
  \ 2016 年至 2020 年），该规划号召技术创新和社会经济改革。目标是“创新的、协调的、绿色、开放和包容性增长”。`ICIT`报告表示，实现该计划所需的大多数技术可能会通过偷取其他国家的商业秘密来获得。\n\
  \n在《*2015 全球威胁报告*》中，美国网络情报公司`CrowdStrike`识别出数十个针对“十二五规划”中关键业务领域的中国对手。它发现仅有 28 个小组专门针对国防和执法系统。在全球范围内遭受受害的其他部门还包括能源、交通、政府、技术、医疗保健、金融、电信、媒体、制造业和农业。\n\
  \n中国对军事和贸易秘密的窃取如此猖獗，以至于漫画家杰夫·帕克（Jeff Parker）和戴夫·格兰隆德（Dave Granlund）将其描绘为“中国外卖”（Chinese\
  \ takeout）。\n\n### 中美协议\n\n2015 年 9 月，奥巴马总统与中国主席习近平会面，解决影响两国的一问题。在经济间谍活动方面，他们同意各自政府都不会开展或故意支持基于技术的商业秘密窃取，以向其商业部门提供竞争优势。他们并未同意限制政府间谍活动，这种做法被各国认为是可以接受的范围。\n\
  \n2016 年 6 月，`FireEye`报告称，自 2014 年以来，来自 72 个疑似位于中国的组织的网络间谍活动大幅减少。`FireEye`将这种减少归于几个“因素，包括习近平主席的军事和政治举措、中国网络行动的广泛暴露以及美国政府日益增长的压力”。`ICIT`认为，中国可能还对其人员实施了更大的控制，并专注于未指定的高优先级目标。\n\
  \n中美协议还要求两国合作打击网络犯罪。在协议签署后几周，中国宣布已逮捕与 2015 年入侵美国人事管理局数据库相关的黑客。这些入侵泄露了约 2200 万名寻求安全审查的联邦员工的高度敏感个人和财务数据。《华盛顿邮报》观察到，这些逮捕可能“标志着被描述为美国历史上最具破坏性的数据泄露之一的行为的首次项问责措施”。\n\
  \n\n\n\n\n州级和联邦层面的监管使得公用企业与监管机构难以合作完成这项工作。\n\n公用企业向客户收取的费用只能涵盖其合理支出。监管机构必须通过接受公众监督的程序来批准其费率。\n\
  \n例如，假设某电力公司正在建设一座变电站。公用企业将披露其在建设方面的支出，证明其选择承包商是负责任的，并解释这一新增容量如何增强其服务。随后，监管机构在听取了所有利益方的意见后，必须决定何种费率上涨（如果有的话）是合理的。\n\
  \n在网络防御支出方面，遵循这一常规变得更加困难。由于安全考虑，公用企业很难说明他们对这笔资金的具体用途，这几乎是困难甚至是不可能的。因此，监管机构很难判断公用企业的支出是过多还是过少，甚至可能在不必要的支出上浪费了资金。\n\
  \n如果监管机构盲目批准这些费率上涨，可能是对职责的放弃。如果他们拒绝，公用企业就会因为加强安全措施而受到惩罚，并失去继续做正确事的动力。\n\n## **人非失**\n\
  \n尽管公用企业监管的特殊性使得网络防御问题变得比其他情况下更为复杂，但仍有管理此类风险的工具。\n\n例如，为了减轻人为错误在应对恶意攻击时造成的损害，可能不需要额外的支出，只需培训公用企业及其承包商的员工，让他们盲目打开危险的邮件附件即可——而黑客在\
  \ 2015 年乌克兰攻击以及政府近期披露的系统泄露事件中，正是通过这种途径进入电力系统的。\n\n事实上，2016 年几乎 94% 的恶意软件都是通过电子邮件系统投送的。显然，更广泛地提高警惕钓鱼攻击的意识将有助于保障基础设施的安全。\n\
  \n监管机构一直在研究可能增强网络安全的策略。美国、加拿大和墨西哥部分地区已经制定了相关标准，供公用企业评估其预防或检测网络攻击的能力。\n\n预防措施可以包括州政府采取新法规来保护公用企业的机密信息，并投入更多精力培训公用企业员工，以识别并应对网络安全威胁。\n\
  \n监管机构意识到系统安全是一个持续的过程同样重要。它永远不会真正结束，因为随着系统安全措施的不断，黑客会设计出新的方法来绕过它们。\n\n## **电网韧性**\n\
  \n电网韧性策略可以帮助无论停电来源如何都能维持服务。例如，许多公用企业已经投资了“自愈”系统，这些系统可以隔离电网中的故障并在停电期间快速恢复服务。\n\n\
  以下是其工作原理的示例。2016 年飓太马修袭击佛罗里达州期间，佛罗里达电力电力公司（Florida Power and Light）识别出一处受威胁的变电站并将其与电网的其他部分隔离。这一措施保护了其客户，确保该变电站的停电不会扩散到其他地方。\n\
  \n公用企业还可以创建微电网，即在发生攻击时可以与系统其余部分隔离的区域。大多数系统的设计目的是为了提高自然灾害和风暴事件期间的韧性。但它们也能帮助电网抵御网络攻击。\n\
  \n公众对电网安全的担忧比以往任何时候都更有理。但我相信，将灾难性基础设施攻击的风险降至最低是可以实现的。只需要公用企业对其员工进行系统安全教育，同时政府更新其规则和做法——并且所有相关人员继续尽所努力防止各种停电，并在尽管做出了努力仍发生停电时尽快恢复电力。\n\
  \n*最初发表于 Theodore J. Kury，“既然俄罗斯显然已经黑入美国电网，加强安全比以往任何时候都重要”，The Conversation，2018\
  \ 年 4 月 11 日。经出版商许可转载。*\n\n## **18. 勒索软件受害者被敦促向联邦执法部门报告感染情况**\n\n### 联邦调查局\n\nFBI\
  \ 敦促受害者向联邦执法部门报告勒索软件事件，以帮助我们更全面地了解当前的威胁及其对美国受害者的影响。\n\n### 什么是勒索软件？\n\n勒索软件是一种安装在计算机或服务器上的恶意软件，它会加密文件，在支付指定的赎金之前这些文件将无法访问。勒索软件通常在用户点击恶意链接、打开包含安装恶意软件的邮件附件，或通过受损的网站进行“路过下载”（无需用户手动启动）时被安装。\n\
  \n### 为什么我们需要你的帮助\n\n新的勒索软件变种不断涌现。网络安全公司报告称，2016 年的前几个月里，全球勒索软件感染量处于历史高位。在发布后的前几周内，一种特定的勒索软件变种每天导致估计约\
  \ 10 万台计算机受害。\n\n勒索软件感染无论规模或行业如何，都会影响个人用户和企业，导致服务中断、财务损失，在某些情况下导致珍贵数据的永久丢失。虽然勒索软件感染统计数据经常受到媒体和计算机安全公司关注，但对\
  \ FBI 来说，确定勒索软件受害者的真实数量一直面临挑战，因为许多感染病例未向执法部门报告。\n\n受害者可能出于多种原因未向执法部门报告，包括：不知道应该向哪里或向谁报告；觉得自己的损失不值得执法部门关注；对隐私、业务声誉或监管性数据泄露报告要求的担忧；或感到羞愧。此外，那些通过内部支付赎金或从备份中恢复文件来内部解决问题的人，可能觉得没有必要联系执法部门。\n\
  \nFBI 敦促受害者无论结果如何都报告勒索软件事件。受害者的报告让执法部门对威胁有更深入的了解，为勒索软件调查提供了依据，并为正在进行的勒索软件案件贡献了相关信息。更多地了解受害者及其与勒索软件的经历，将帮助\
  \ FBI 确定谁是幕后黑手，以及他们是如何识别或针对受害者的。\n\n### 对害用户的威胁\n\n所有勒索软件变种对个人用户和企业都构成威胁。近期的变种针对并入侵了脆弱的业务服务器（而非个人用户）以识别并锁定主机，从而成倍增加了网络上潜在受感染服务器和设备数量。采用这种针对策略的攻击者还会根据感染的主机（或服务器）数量索要赎金。此外，近期被此类勒索软件变种感染的受害者在支付赎金后，并未获得所有文件的解密密钥，某些人还被勒索了更多资金。\n\
  \n这种近期针对主机服务器和系统的技术可能导致受害者为了获得解密密钥支付更多费用、恢复时间延长，并可能导致用户无法获得文件的完全解密。\n\n### 应向执法部门报告的内容\n\
  \nFBI 请求受害者联系其当地 FBI 办公室，和/或通过网络犯罪投诉中心 `www.IC3.gov` 提交投诉，并提供以下勒索软件感染细节（如适用）：\n\n\
  1. `感染日期`\n2. `勒索软件变种`（通过赎金页面或加密文件的扩展名识别）\n\n\n\n\n\n### 3. 受害者公司信息（行业类型、业务规模等）\n\
  \n### 4. 感染发生方式（邮件中的链接、浏览网页等）\n\n### 5. 索要赎金金额\n\n### 6. 攻击者的比特币钱包地址（可能列在勒索页面上）\n\
  \n### 7. 已支付的赎金金额（如有）\n\n### 8. 与勒索软件感染相关的总损失（包括赎金金额）\n\n### 9. 受害者影响声明\n\n### 赎金\n\
  联邦调查局（FBI）不支持向攻击者支付赎金。支付赎金并不能保证受害者能够重新访问其数据；事实上，某些个人或组织在支付赎金后永远无法获得解密密钥。支付赎金会助长攻击者针对其他受害者进行牟利，并可能激励其他犯罪分子参与类似的非法活动以取财财。虽然\
  \ FBI 不支持支付赎金，但它承认管理层在面临业务无法运行的问题时，会评估所有选项以保护其股东、员工和客户。\n\n### 防御\nFBI 建议用户考虑实施以下预防和连续性措施，以降低勒索软件攻击成功的风险。\n\
  \n- 定期备份数据并验证这些备份的完整性。备份在勒索软件事件中至关重要；如果您被感染，备份可能是恢复您关键数据的最佳方式。\n- 保护您的备份。确保备份未连接到其正在备份的计算机和网络。例如，将备份存储在云端或通过物理方式离线存储。需要注意的是，某些勒索软件实例具有在系统持续实时备份（也称为持久同步）时锁定云端备份的能力。\n\
  - 仔细检查邮件中包含的链接，不要打开包含在未请求邮件中的附件。\n- 仅从您认识并信任的网站下载软件——尤其是免费软件。可能的情况下，在执行之前通过数字签名验证软件的完整性。\n\
  - 确保操作系统、软件和固件的应用程序补丁已更新，，包括 Adobe Flash、Java、Web 浏览器等。\n- 确保防病毒和反恶意软件解决方案设置为自动更新，并定期进行扫描。\n\
  - 禁用通过电子邮件传输的文件中的宏脚本。考虑使用 Office Viewer 软件打开通过电子邮件传输的 Microsoft Office 文件，而不是使用完整的\
  \ Office 套件应用程序。\n- 实施软件限制或其他控制，防止在常见的勒索软件位置执行程序，例如支持流行 浏览器的临时文件夹，或压缩/解压缩程序，包括位于\
  \ `AppData/LocalAppData` 文件夹中的程序。\n\n企业的其他考虑因素包括：\n\n- 关注意识和培训。由于终端用户经常成为目标，应让员工意识到勒索软件的威胁、其递送方式，并接受信息安全原则和技术方面的培训。\n\
  - 在发现漏洞时，修补所有终端设备的操作系统、软件和固件。通过集中补丁管理系统可以使这种预防变得更容易。\n- 通过实施最小权限原则管理特权账户。除非绝对需要，否则不应为用户分配管理员权限。需要管理员账户的人应仅在必要时使用；在其他所有时间应使用标准用户账户操作。\n\
  - 根据最小权限原则配置访问控制。如果用户只需要读取特定文件，他不应具有对这些文件、目录或共享的写入权限。\n- 使用虚拟化环境来执行操作系统环境或特定程序。\n\
  - 根据组织价值对数据进行分类，并对不同的组织单元实施网络和数据的物理/逻辑隔离。例如，敏感的研究或业务数据不应与组织的电子邮件环境处于同一服务器和/或网络分段。\n\
  - 对于与网络代理或防火墙未分类的网站通信的终端用户应用程序，要求用户交互。例如，当系统与未分类的网站通信时，要求用户输入信息或输入密码。\n- 实施应用程序白名单。仅允许系统执行安全策略已知并许可的程序。\n\
  \n公共文档最初发布于联邦调查局（Federal Bureau of Investigation），“敦勒索软件受害者向联邦执法机构报告感染”，https://www.ic3.gov/media/2016/160915.aspx（2016\
  \ 年 9 月 15 日）。\n\n## 19. 勒索软件攻击说明了地方政府实体面临的漏洞\n\nMARY SCOTT NABERS\n\n近期，媒体关注了与选举系统相关的网络攻击。然而，许多个人、公共官员和公司高管也同样担心勒索软件攻击。\n\
  \n勒索软件攻击通过病毒感染计算机网络，该病毒会使计算机或网络完全关机。它阻止了访问并要求付款以释放和恢复机器或网络上的数据。最近的勒索软件攻击用说明说明了政府实体面临的漏洞。赎金成本高得离谱，而数据丢失或服务中断的风险则令人恐惧。\n\
  \n特朗普总统提出的 2018 年预算增加了多个关键机构的网络安全人员，如果通过，它将把国土安全部（`DHS`）的网络安全部门预算增加到近 33 亿美元。这些都很好，但大多数最近的勒索软件攻击发生在政府地方层面，而联邦政府没有提供此类资金。根据最近的一份报告，各州将其\
  \ IT 预算的 0% 到 2% 用于网络安全——而所有的最佳实践都建议，这项支出应占组织预算的 10% 到 15%。\n\n4 月，一名黑客感染了新泽西州纽瓦市（Newark）的计算机。病毒导致所有机器无法使用。该市网络遭到破坏，并中断了数字服务。黑客索要\
  \ 30,000 美元的比特币，这是一种难以追踪的互联网货币。大多数勒索软件会加密常见的计算机文件，并需要密码解锁。\n\n去年 11 月，运营 `MUNI`\
  \ 轻轨系统的旧金山交通局（`SFMTA`）也遭了勒索软件的攻击。虽然勒索软件没有渗透该机构的网络，但它确实关闭了自动售票机。黑客索要 70,000 美元的比特币。为了防止服务中断，`SF\
  \ Muni` 提供免费乘车直到售票机恢复运行。该机构没有支付赎金，但这次攻击代价高昂。\n\n2016 年 8 月，佛罗里达州的萨拉索塔市（Sarasota）遭遇了勒索软件攻击，该攻击通过发送给一名员工的病毒进入该市系统并关闭了其计算机系统。尽管黑客提出了索要，该市没有支付赎金，并最终能够恢复其文件。然而，资源成本、生产力损失和无法提供服务的代价是非常高的。\n\
  \n去年 2 月，洛杉矶市集成安全运营中心（`ISOC`）识别了五个市部门的 16 次勒索软件攻击。这些攻击被隔离了，没有数据丢失，也没有支付赎金。但是，分析师现在最大的担心是勒索软件，他们难以在这些攻击面前快出两步。洛杉矶市拟议的\
  \ 2018 财年预算包含了 225 万美元用于支持网络安全倡议的资金。\n\n\n\n\n纽约州拟议的 2018 年预算将资助创建一个一个新的网络事件响应小组，该小组不仅将支持州机构，还将支持地方政府、全州的关键基础设施和学校。该小组将提供外服务和协调演练，并作为报告的网络事件的首要响应者。\n\
  \n许多州和地方政府领导者致力于在内部培养经过培训的人员，使网络攻击不再成为如今普遍的威胁。这需要时间、资源和资金，而大多数人在未来的预算中并未计划这些投入。世界已变成一个更加可怕的地方，政府网络是黑客、网络侦探人员和专业人士的青睐目标。纳税人最终将支付大部分甚至全部保护政府数据免受网络攻击侵害的费用。这并不是一个乐观的想法，但更不乐观的现实是，个人同样脆弱，因为个人计算机系统也是勒索软件攻击的主要目标。保护是可行的，但对公民和政府来说都是高昂的。\n\
  \n*最初发表于 Mary Scott Nabers，“勒索软件攻击说明了地方政府实体面临的脆弱性”，ICMA 博客，国际城市/县管理协会（2017 年 7 月\
  \ 12 日）。经出版者许可转载。*\n\n## 20. 2017 年勒索软件攻击呈上升趋势\n\nMARY ANN BARTON\n\n面对数据丢失，阿拉拉巴马州蒙哥马利县的官员上周授权拨款，向黑客支付赎金，以使其政府恢复运行。在该县的计算机系统于\
  \ 9 月 19 日遭到勒索软件攻击后，其选择之一是在数据被毁之前的七天内支付赎金。县委员会主席埃尔顿·迪恩（Elton Dean）在新闻发布会上表示，该县最终支付了\
  \ 40,000 美元至 50,000 美元获得 9 个比特币来支付赎金。迪恩表示，文件的丢失将给该县造成约 500 万美元的损失。\n\n该县约有 23 万居民，在此期间无法发放车辆牌照或注册，也无法处理业务或婚姻许可申请。该县首席\
  \ IT 官员路·伊拉奇（Lou Ialacci）表示，县的所有部门都受了影响。\n\n蒙哥马利县并非孤单。今年已有数百名勒索软件受害者，联邦调查局（FBI）表示这种做法正在增加。总部位于纽约的\
  \ FBI 网络行动部门主管罗恩·雅伍德（Ron Yearwood）表示，勒索软件“是一个非常大的问题，目前还没有缓解”。当发生重大勒索软件攻击时，FBI 不为人知的网络行动小组（Cyber\
  \ Action Team）就会介入。雅伍德说：“他们被认为是入侵调查员中的精英。”\n\nFBI 表示，根据最新的可用数据，在 2017 年第一季度，已有 745\
  \ 名勒索软件受害者，向网络黑客损失了超过 51.2 万美元，此外在工作时长等方面也损失了更多。按照这个速度，FBI 看到的受害者可能比去年更多，去年有 2,673\
  \ 人向该打击犯罪的机构通报了勒索软件攻击。而这些只是 FBI 知知的攻击。雅伍德说：“通常情况下，我们看到漏报的情况。”\n\n虽然大多数县级 IT 官员可能意识到勒索软件攻击通常通过垃圾邮件或针对特定个人的“鱼叉式网络钓鱼邮件”投送，但在较新的勒索软件案例中，一些网络罪犯……（注：原文在此处中断，翻译亦随之停止）\n\
  \n\n\n\n那么，FBI 建议你采取什么措施来防止勒索软件攻击？随着勒索软件技术和恶意软件的不断演变——而且在太晚之前很难检测到勒索软件的入侵——各县应重点关注：\n\
  \n- 员工意识培训。\n- 强有的技术预防措施。\n- 在发生勒索软件攻击时制定稳健的业务连续性计划。\n- 确保员工了解勒索软件以及他们在保护组织数据方面的关键作用。\n\
  - 补丁数字设备上的操作系统、软件和固件（通过中心化的补丁管理系统可能会变得简单）。\n- 确保杀病毒和反恶意软件解决方案设置为自动更新并进行定期扫描。\n-\
  \ 管理特账户的使用——除非绝对必要，否则不应为任何用户分配管理员权限——仅在必要时使用管理员账户。\n- 适当配置访问控制，包括文件、目录和网络共享权限。如果用户只需要读取特定信息，则不需要对那些文件或目录的写入权限。\n\
  - 禁用通过电子邮件传输的 Office 文件宏脚本。\n- 实施软件限制策略或其他控制，防止程序从常见的勒索软件位置执行（例如，支持流行网络浏览器的临时文件夹、压缩解压缩程序）。\n\
  - 定期备份数据并定期验证这些备份的完整性。\n- 保护你的备份。确保它们没有连接到正在备份的计算机和网络。\n\n*最初发表于 Mary Ann Barton\
  \ 的《2017 年勒索软件攻击日益增加》，刊于 *NACo County News*，2017 年 10 月 2 日。经出版者许可转载.*\n\n## 21.\
  \ 社交媒体的双重面孔\n\nMARTHA PEREGO\n\n社交媒体渗透我们的个人生活和工作场所，正为地方政府组织带来了一些有趣的伦理问题。组织一直对控制谁代表组织发言以及代表组织说什么持有首要利益并有有预期。社交媒体网络现在可以实现与指数级增长的受众进行快速交流，但往往缺乏个人观点与官方立场之间清晰的界限。你很可能会遇到其中一种情况。\n\
  \n**Q：** 市经理得知一名图书馆员工建立了一个 Facebook 页面，推广为城市建立一座新图书馆的想法。这一消息是在一名议会成员被要求成为该页面的“粉丝”后浮出的。经理检查了该网站，发现该员工确实被列为该页面的管理员。从发布的信息中尚不清楚该员工是否获得了图书馆委员会的指示或批准来建立该网站。经理对于城市实体或员工在未与市议会沟通的情况下推广新设施的建设感到不适，并寻求关于如何处理的建议。他是否应该命令该员工撤掉网站？\n\
  \n**A：** 无论是通过博客、Facebook 还是现在看来已经过时的给编辑的信，所有员工都有根据《第一修正案》的权利，在下班后使用自己的设备对城市事务发表评论论。尽管这可能会让领导层感到不适，但这种活动不能被完全禁止。\n\
  \n一个明智的方法可能是与员工谈论员工在项目中与领导层协作工作的重要性，而不是单打独斗，这正是该案例中经理所采取的。如果那名图书馆工作人员真的有兴趣帮助这项事业，她可能愿意撤掉网站并重新考虑她的策略。\n\
  \n在反思并与经理交流后，该员工决定将管理网站的任务交给当地“图书馆之友”的一位成员是最好的，特别是因为这项工作将要求她在工作期间时刻关注网站。她仍然是新图书馆的支持者，但在她自己的时间里这么做。\n\
  \n如果涉案的员工是图书馆馆长，经理会采取不同的策略吗？肯定的。管理人员代表组织，当他们发言时，他们的评论应该反映机构的官方立场。图书馆馆长推广一个未经过市经理和管理机构审核的概念是不恰当的。\n\
  \n社交媒体网站在标有城市徽标或由员工撰写时，是地方政府信息的延伸。因此，组织有兴趣确保所呈现的信息代表其官方立场。\n\n**Q：** 人事资源（HR）总监收到了一份来自匿名来源的信息包，其中据称由助理经理撰写的博客文章。作者使用一个亮眼的昵名，对从外国政策到文化问题的各种文章发表了评论。这些帖子都没有与城市事务有关。\n\
  \n在阅读这些条目时，HR 总监对该个人直率、直接且至少在她看来很粗鲁的评论感到震惊。如果这些文章确实是助理经理的作品，且他的身份被暴露，将对城市产生不利影响。但由于这些帖子都与城市事务无关，HR\
  \ 总监应该处理这件事吗？\n\n**A：** ICMA 职业行为委员会最近有机会讨论了类似的这种情况。委员会指出，《ICMA 伦理守则》第七条赋予了成员对政策问题或当下问题发表意见的自由。如果政策问题涉及\
  \ ICMA 成员的工作场所，该成员应该仔细考虑表达个人意见的影响，尽管成员仍然可以这样做。\n\n关于就非雇主的情况撰写博客，委员会为成员提供了以下指导：\n\
  \n- 使用昵称是可以的，但要意识到匿名性永远无法保证。\n- 使用市政网络表达个人观点是不恰当的。\n- 不要利用你的职位或你的头衔。\n- 仔细考虑评论或观点可能对你的工作能力、组织、职业和专业素养产生影响。\n\
  - 考虑《ICMA 伦理守则》第三条的原则，该原则鼓励成员在所有职业和个人事务中的行事都能增强公众对该职业的信任。\n\n\n\n\n“零日漏洞”（Zero-days）是软件中软件制造商或用户尚未感知的严重漏洞。之所以有此名，是因为开发者在漏洞被利用的那天才发现该安全漏洞，因此他们只有“零天”的时间来修复它。\n\
  \n这些漏洞可能存在于商业市场上应用最广泛的一些软件和平台中：`Adobe Flash`、`Internet Explorer`、社交网络（例如 `Facebook`\
  \ 和 `LinkedIn`）以及无数其他软件。\n\n近期 `Hacking Team` 泄露的邮件为政府参与国际零日漏洞市场的程度提供了新线索。政府机构并没有向软件制造商披露这些漏洞以供其进行修复，而是购买并囤积零日漏洞。\n\
  \n这种做法以及允许这种行为的政策，使数以亿计的网络和软件用户暴露在严重且不必要的网络安全风险之中。针对这个问题有许多解决方案，但在之前，让我们先来看看零日市场。\n\
  \n## 日益增长的零日漏洞市场\n\n了解零日漏洞的存在对于犯罪分子和情报机构来说都是极具价值的。他们花费巨资来了解这些漏洞，然后开发利用程序（或直接购买利用程序）来绕过目标的信息安全防护。\n\
  \n在其他技术中，攻入 `Sony Pictures Entertainment` 和 `人事管理局 (OPM)` 的黑客就利用零日漏洞完成了这些大规模的黑客攻击。\n\
  \n这已成为一门严肃的生意。国际零日漏洞买卖市场由三个重叠的市场组成：“黑市”、“灰色市”和“白市”。\n\n黑市的卖家包括自由职业黑客和组织。买家包括犯罪分子和犯罪组织。鉴于该市场的地下性质，无法知晓黑市有多少漏洞被买卖。`荷兰国防学院``Netherlands\
  \ Defence Academy`）的研究员 `Roy Lindelauf` 认为，目前超过一半的出售利用程序是从正规公司购买的，而非自由职业黑客，这表明黑市并不是这三个关联市场中最大的。\n\
  \n第二个市场之所以被称为“灰色市”，是因为它是合法的，尽管是非官方且不受监管的。历史上，主权国家在灰色市场中处于垄断地位。它们包括`巴西`、`印度`、`以色列`、`马来西亚`、`朝鲜`、`俄罗斯`、`新加坡`、`英国`、`美国`等许多国家。如\
  \ `Northrupp Grumann` 和 `Raytheon` 等国防承包商也被认为是买家和/或卖家。\n\n很难对灰色市场的规模做出准确估计。根据 `WikiLeaks`\
  \ 索引的一封 `Hacking Team` 邮件，`美国`的`国家安全局 (NSA)` 被认为是“最优秀、最可靠的零日漏洞获取者……实际上，是一个贪得无厌的家伙”。它在\
  \ 2013 年花费了`2500 万美元`从私人恶意软件供应商处采购“软件漏洞”。一个来源显示，零日漏洞的平均价格在 `$40,000` 到 `$160,000`\
  \ 之间。\n\n同样合法的“白市”中的买家包括 `Facebook`、`Google`、`Microsoft` 和 `LinkedIn` 等软件制造商。软件制造商会向任何发现并向他们披露漏洞存在的人提供一笔资金，这有时被称为“漏洞赏金”。\n\
  \n此外，还有连接数十软件制造商与安全研究人员及专家的平台。他们承诺向通过平台向软件制造商披露漏洞的人支付佣金。`iDefense` 和 `TippingPoint`\
  \ 是该领域的早期早期公司。新公司也已加入其中，例如 `HackerOne`，它最近筹了`2500 万美元`的风险投资。\n\n漏洞赏金是解决零日漏洞问题的一种新方案：付钱让人们不要攻击系统。相反，付钱让这些人利用他们的技能发现并披露漏洞，以便软件制造商可以修复它们，从而提高整体网络安全。\n\
  \n通过漏洞赏金计划支付的金额可能是非常巨大的。在所有市场中，价格往往由漏洞类型和潜在的攻击利用价值决定。然而，白市的价格通常不像黑市那么高，而且价格也远低于零日漏洞攻击受害者所遭受的损失。\n\
  \n## 政府囤积的风险\n\n虽然许多政府机构是全球零日灰色市场的买家，但几乎没有哪个国家对他们如何处理购买的漏洞有明确的政策立场。\n\n在`美国`，关于零日漏洞披露的官方政策的一些细节已经公开。前\
  \ `NSA` 局长 `Keith Alexander` 表示，该机构使用零日漏洞是为了“防御，而不是……攻击目的”。根据他的顾问的话，总统 `Barack Obama`\
  \ 的观点是，“当国家安全局发现网络安全中存在重大缺陷时”，它“在大多数情况下应该披露它们……而不是保持沉默以防这些缺陷被利用”。然而，对于明确的国家安全或执法需求，存在一个宽泛的例外。\n\
  \n考虑到“国家安全”一词的使用很奇怪，因为扣留任何零日漏洞的政策实际上让所有软件用户的安全性——在当今世界中，这包括公司、政府机构和个人——面临了额外的被攻击风险。\n\
  \n值得的是，`美国`在解释其零日漏洞披露政策方面比所有其他政府都做得更好。`澳大利亚`、`中国`、`俄罗斯`和`英国`完全没有公开他们对零日漏洞的立场。\n\n\
  这种做法以及允许这种行为的往往模糊的政策是严重的。当零日漏洞知识被政府机构购买并囤积时，无法保证另一个恶意个人或组织不会发现（或购买）并利用同一个漏洞。\n\n\
  通过扣留零日漏洞知识，政府机构使所有软件用户处于风险之中。这种风险的范围是全球性的，因为涉及的软件和平台被数十使用。\n\n## 有哪些替代方案？\n\n除了囤积零日漏洞政策以及该政策带来的风险外，可能的替代政策？\n\
  \n强制披露，或对零日漏洞的发现或购买加强监管，是国内明显的替代方案。在国际范围内，“通过《瓦森纳协定》对零日漏洞出口进行自愿集体行动”被视为另一种可能的方向，特别是考虑到该协议目前正在审查中。该协议旨在控制具有潜在军事用途的武器和技术的出口。计算机安全分析师和风险管理专家\
  \ Dan Geer 提议，美国政府应该比国际零日市场上任何其他买家出十倍，只要漏洞是“稀疏而非密集”（即相关软件漏洞很少而非很多）。\n\n如果 `NSA`\
  \ 每年花费`2500 万美元`购买零日漏洞，根据 Geer 的计划，这将增加到至少`2500 万美元`。`NSA`的预算每年至少`100 亿美元`，2013\
  \ 年花费了`12 亿美元`用于攻击性能力。\n\n考虑到这些预算规模，Geer 的建议在财务上是可行的，但需要官方政策发生重大变化，从强制向软件制造商披露所有漏洞以便进行修复开始。\n\
  \n## 追根溯源\n\n如果政府真的认真解决零日漏洞问题，他们可能会考虑从根源入手：让软件制造商对漏洞代码承担责任。\n\n\n\n\n自 20 世纪 80\
  \ 年代以来，软件制造商的一种通用做法被称为“补丁并祈祷”（patch and pray）。简而言之，软件制造商急于发布产品，选择在稍后发布漏洞补丁，而不是在发布前投入时间和资源对漏洞（包括零日漏洞）进行额外的测试和修补。\n\
  \n其经济逻辑很简单：发货等于销售和收入。延迟发布以测试和修复漏洞会增加成本。鉴于软件故障造成的损失由用户承担而非软件制造商，因此软件制造商在发货前修复漏洞的动力很小。当你不需要为最终损坏的东西买单时，“快速行动并打破常规”（move\
  \ fast and break things）要容易得多。\n\n更糟糕的是，用户并不总是及时更新他们的软件，而这实际上是他们唯一的防御。因此，漏洞在被发现并提供补丁后，可能会持续多年。\n\
  \n让软件制造商对其故障软件所造成的损失承担法律责任，将完全改变这些激励机制。可以研究多种方法，试图找到一种既能最小化漏洞并保护用户，又不会扼杀创新的平衡方案。\n\
  \n让软件制造商对其缺陷产品承担任何形式的法律责任需要巨大的政治意愿，特别是在当前提议正朝着相反方向发展的氛围下。然而，如果操作得当，这将产生使软件制造商采取更严谨措施以减少软件中漏洞数量的强大动力。这将为数十亿软件用户的网络安全提供实质性的提升。\n\
  \n### 网络安全政策的悖论持续\n\n政府官员声称正在尽一切努力增强网络安全。零日漏洞对个人、政府机构和企业的网络安全构成严重威胁。\n\n然而，政府机构是零日漏洞最大的买家。如果他们真的重视网络安全，为什么这些政府机构要隐藏他们发现或购买的某些零日漏洞呢？\n\
  \n这是当前网络安全政策悖论的另一个例子：负责增强网络安全的政府机构所进行的活动却导致了相反的结果。\n\n明确的公开所有已发现或购买的零日漏洞的政策将是加强国际网络安全的一大步。更好的是从根源解决问题的政策，通过让软件制造商对其故障软件相关的相关的损失承担部分责任。\n\
  \n在集结政治意愿来解决包括零日漏洞在内的故障软件问题之前，遗憾的是，软件用户保护自己所能做的最好就是遵循软件制造商的做法：打补丁并祈祷。\n\n*最初发表于\
  \ Benjamin Dean，《对话》（The Conversation），“‘零日’囤积让我们所有人面临风险”，2015 年 8 月 4 日。经出版者许可转载。*\n\
  \n# 第三部分：预防、保护与伙伴\n\n## A. 实用预防措施\n\n### 23. 网络安全计划\n### CORY FLEMING\n\n### 关注问题\n\
  \n计算机系统是所有地方政府的关键基础设施。当计算机系统宕机时，员工很难完成工作。重建在网络攻击中被盗或丢失的数据是非常耗时且耗人力的。随着关于网络安全攻击、安全泄露和信息泄露的新闻几乎每天出现在新闻中，地方政府经理有理由担心其计算机系统可能受到攻击，以及攻击可能造成的混乱。\n\
  \n所有组织——无论大小——都容易受到攻击。建立网络安全计划和程序有点像保险：你希望即使从不遇到攻击，也做好了准备。地方政府需要了解自己的网络漏洞，以及缓解这些风险需要什么条件。\n\
  \n所有组织——无论大小——都容易受到攻击。建立网络安全计划和程序有点像保险：你希望即使从不遇到攻击，也做好了准备。地方政府需要了解自己的网络漏洞，以及缓解这些风险需要什么条件。\n\
  \n### 挑战\n\n### 员工队伍\n\n多项研究发现，公共部门缺乏技能人才是一个严重问题。私营部门的高薪使得吸引人才变得困难。进一步加剧这种情况的是，公共部门的领导层正在老龄化。“一场缓慢但持续的人力资源流失迫在眉睫，许多州报告，其\
  \ IT 员工的 20%到 60%接近或已退休年龄，”Deltek 的 Derek Johnson 所示。\n\n可用的人才根本不存在。“根据 ISACA 发布的《2015\
  \ 年网络安全状况：对其的影响》报告，35%的组织拥有无法填充的安全空缺，53%的人表示填补一个职位可能需要长达六，”IBM Security 的 van Zadelhoff\
  \ 报道。\n\n### 预算\n\n对于许多可能没有足够资金或资源来保护计算机系统的社区来说，网络安全是一个关键问题。虽然 Noelle Knell 在《政府科技》中报道道，“预计\
  \ 2017 年城市将在 IT 方面花费 309 亿美元……而县级将花费 220 亿美元，”但 iSheriff 首席执行官 Paul Lipman 指，“典型的州或地方政府机构将其\
  \ IT 预算的不到 5% 用于网络安全，而典型的商业企业这一比例超过 10%。”\n\n### 计划要素\n\n### 研究与需求评估\n\n对当前的技术解决方案进行研究，对于了解广泛的产品以及这些产品随时间推的预期性能至关重要。地方政府应避免权宜之计和一次性的解决方案。相反，员工应该研究如何将产品与现有系统整合以获得更好的结果。\n\
  \n需求评估可以帮助 IT 专业人员确定他们对技术解决方案的需求。需求评估从清单当前使用的遗留系统开始，并识别可能存在的安全漏洞。例如，信用卡支付系统是否免受试图从市网站进入的黑客攻击？\n\
  \n\n\n\n\n# 政策与程序\n地方政府需要制定书面政策和程序，规定组织将如何保护其计算机系统。仅购买软件解决方案或电子设备并不能保护系统。员工必须理解，人为错误在许多安全违规事件中起着重要作用。点击电子邮件中的可疑链接，或在离开电脑时未使用安全密码锁定电脑屏幕，都会使组织的系统暴露于不必要的风险之中。虽然人难免会犯错，但通过对组织政策和程序的常规提醒，可以使安全措施处于员工关注的前沿。\n\
  \n## 角色与职责\n从网络攻击或其他涉及地方政府计算机系统的安全事件中成功恢复，与从自然灾害和人为灾害中恢复一样，需要规划和准备。当员工在事故发生前就知道谁负责哪些任务以及哪些行动将是首要任务时，响应将更加顺利和快速。在事件发生之前建立良好的合作关系，对于确定可用资源以及哪些员工具备响应所需的技能组合非常有帮助。\n\
  \n## 培训与教育计划\n如前所述，网络安全领域的空缺职位远超胜任这些职位的培训专业人员。这种 IT 人才的普遍匮乏使得地方政府必须对现有员工进行培训和教育。不同个人所需的培训水平有所异，但团队成员需要意识到系统漏洞、他们应该在何时何何地寻找潜在风险，以及用于保护系统的可用工具。至少，所有员工都应该了解并遵循建议的安全标准。\n\
  \n## 系统集成\n计算机系统、设备和其他技术解决方案需要协同工作以实现最大保护。然而，员工往往会购买一种旨在解决特定问题的单一解决方案，但该解决方案无法处理相关问题。考虑身份保护\
  \ App 与防盗 App 之间的关系。这两种解决方案都提供某种程度的保护，但如果这些这些集成，保护水平将大大提高。根据联邦金融机构检查委员会，“网络安全需要作为企业级治理流程、信息安全、业务连续性和第三方风险管理的一部分，整合到整个机构中。”^([5)]\n\
  \n## 安全审计\n所有地方政府都需要定期进行安全审计，以确定哪些数据可能面临风险，并让员工理解系统中的存在哪些威胁和漏洞。IT 的内部控制经常被忽视，例如：限制访问业务运营数据的人员数量、为员工建立安全隐私政策，或在系统内维护受密码保护的位置。遵守这些简单的安全实践可以确保数据完整性，并通过限制违规机会来保护组织系统。通过识别组织维护的数据资产并对这些数据的重要性进行分类，IT\
  \ 可以采取行动防止此类风险。安全审计还为开展支持网络安全计划开发的的需求提供了一个良好的起点。需求评估定义了应该发生的任务和活动，使地方政府从“准备好维持现状”转向“准备好应对未知”。\n\
  \n## 监控\n由于传感器、物联网 (`IoT`)、佩戴式摄像机和其他新技术，地方政府每年都在采集和维护日益增长的数据。新数据地方政府专业人员能够分析数据并根据数据做出更好的管理和政策决策。地方政府组织内部外部数据共享的增加代表了采用智能社区管理实践的新机会，包括更智能地部署人员等。\n\
  \n## 业务连续性\n公共安全官员已惯常制定一旦灾害发生时的业务连续性计划。发生数字攻击时采取的备份计划，对于维持社区运行与灾害计划同样重要。\n\n## 通信\n\
  当任何紧急情况或灾害发生时，通信至关重要。地方政府经理需要准备好使用不同的渠道进行通信。在网络攻击期间，访问多种形式的通信的需求尤为相关。电子邮件、短信、即时消息和其他电子通道可能会被关闭。除了能够在组织内部进行物理通信和协调外，地方政府还需要准备好向选举官员、新闻媒体和公众通报发生了什么、如何遏制，以及是否遭受了任何损害。事件发生后清晰、简洁且负责任的信息将有助于利益相关者相信他们的个人数据得到了保护。\n\
  \n## 响应违规\n\n### 设定系统恢复的优先级\n每个社区对系统恢复会有不同的优先级。但对于几乎所有社区来说，提供关键服务的系统——如健康（县立医院）或安全（警察通信）将处于已确定优先事项的首位。警察、消防和急救医疗人员需要能够通信并访问其数据。\n\
  \n### 备份数据\n大多数地方政府组织例行备份系统中的数据，但员工通常不备份本地驱动器，以防遭受攻击时丢失程序。使用手机和平板电脑等移动技术的现场小组应定期进行备份，保存数据以及程序文件。使用笔记本电脑的员工也应该每天对其机器进行全备份。\n\
  \n### 共享资源\n与必须应对商业竞争的私营部门不同，地方政府和其他公共机构也可以也应该合作。无论是分享领先实践还是分摊购买必要软件的费用，地方政府都有企业没有的选择。\n\
