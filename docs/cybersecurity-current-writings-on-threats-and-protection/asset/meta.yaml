  - 这种业务安排——仅仅将财务风险从一家公司转移到另一家公司——并没有解决任何潜在的安全问题。由于它只留下了某些负面宣传的风险，公司主动解决问题的紧迫感可能会降低。此外，它并没有解决安全事件发生时对个人造成的伤害——例如那些整个财务历史都存储在
