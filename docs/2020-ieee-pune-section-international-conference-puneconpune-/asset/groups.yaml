  mdcn: "\n\n# 机器学习模型卡片透明度\n\n# 模型卡片工具包的使用\n\nAbhishek Wadhwani\n技术学院\nOriental College\
    \ of Technology\nBhopal Madhya Pradesh, 印度\nabhishekwadhwani@gmail.com\n\nPriyank\
    \ Jain\n计算机科学与工程系\nMANIT Bhopal\nMadhya Pradesh, 印度\npriyankain1984@gmail.com\n\
    \n**摘要—**在日常生活中，我们依赖制造者提供的信息来做出正确选择，例如食物的营养成分、药品警告、建筑道路的衡量标准等；但当涉及到 AI 时，目前缺乏关于机器学习模型的提供信息。这些模型在发布时，人们并未充分了解其工作原理、在何种条件下表现最佳、是否公平或存在偏见，以及它们溯源于何处。\n\
    \n开发者可以使用这些工具来设计应用程序，强调模型的优势，同时避免或告知终端用户其局限性。像用户一样，分析师和记者也可能提供见解，使某些技术更容易向普通大众解释，并帮助倡议团体更好地理解\
    \ AI 对社会的影响。\n\n模型卡片（Model cards）是必要的工具，也是研究的热点。在机器学习（ML）中，模型卡片的透明度具有相关性，因为它涵盖了从健康到金融、职业等广泛领域。本研究展示了模型卡片和透明度的重要。\n\
    \n模型卡片工具包（MCT）提供了一个 JSON 架构，展示了图中所示的模型细节：\n\n- 1. 模型溯源信息存储在机器学习元数据（MLMD）中，并以 JSON\
    \ 格式填充相关信息。还提供了一个反向过程的 API，用于获取存储的信息并以卡片语法的形式进行可视化，该语法为\n\n- 2. 模型卡片创建者可以选择在最终卡片中显示的图表和指标，还可以创建局限性、权衡、预期使用场景等信息。这对于开发者进行选择至关重要。MCT\
    \ 包含了标准的用户界面（UI）模板，但用户也可以用 HTML 创建模板，以帮助信息密度视觉化。\n\n*索引术语-* 模型描述、分层评估、AI 公平性、机器学习评估、数据集。\n\
    \n目前，MCT 已作为开源软件提供 TensorFlow 扩展用户，同时未使用 TensorFlow 的 Google 云平台用户也可以通过模板引擎生成模型卡片。\n\
    \n# I. 引言\n\n模型卡片是研究领域中提出的一种方案，旨在以结构化的方式处理机器学习的本质事实。\n\n在机器学习中，卡片透明度非常重要，因为它影响了从健康到就业的广泛领域。下游用户所需的信息可以轻松使用，且往往超过了所用模型的意图。如果通过建立模型的基本事实来保持透明度，用户就可以选择合适的模型进行使用。\n\
    \n大多数成熟的行业已经开发了在各种条件下对许多系统进行基准测试的标准方法。例如，如 [1] 所示，硬件行业使用数据集以及组件在各种条件下的性能。相比之下，由于机器学习模型广泛的应用和影响力，目前不存在针对机器学习模型的标准化测试。\n\
    \n多年来，模型卡片的使用日益增加，例如创建计算机视觉模型状态的 MediaPipe 已经在其仓库中包含了模型卡片。这些卡片集包含了大量的时间和精力，通常需要对性能进行详细分析，这可能是一项枯燥的任务。模型创建者可能希望以用户更容易理解的方式说明模型的局限性或用例。\n\
    \n为了简化这些模型卡片的创建，引入了共享卡片工具包（MCT），它是一系列帮助开发者收集模型卡片可能所需信息的工具集 [15]。\n\n提高机器学习模型的透明度可以使专家和非专家共同受益。\n\
    \n# II. 背景\n\n专家已经提出了归一化结构，用于对应 AI 中的归属数据集 [2,1,3]，以帮助客户理解数据集创建时的设置。我们提出了一种归一化技术，重点关注：\n\
    \n### 模型卡片\n\n- 模型细节。关于模型的基本信息。\n- 开发模型的个人或组织\n- 模型版本\n- 模型类型\n- 关于训练算法、参数、公平性约束或其他应用方法及特征的信息\n\
    - 用于获取更多信息的论文或其他资源\n- 引用详情\n- 许可协议\n- 关于模型的提问或意见的反馈接收处\n- 预期用途。开发期间使用的的用例：\n \
    \   - 主要预期用途\n    - 次要预期用途\n    - 范围之外的用途\n- 因素。考虑人口统计或表型群体、环境条件、技术属性或其他的因素\n\
    \    - 因素列表\n- 评估因素\n- 指标。选择的指标应反映真实性能\n    - 模型性能\n    - 决策阈值\n- 评估数据。可能的情况下，此部分应包含所用数据集的数据\n\
    \    - 定量分析\n    - 预处理\n    - 伦理考量\n    - 建议\n    - 交叉分析结果\n\n![](img/9567735caf3d92b11c61fa056ac42_1_0.png)\n\
    \n# III. 动机\n\n随着机器学习技术的快速增长，那些希望在特定场景下使用机器学习模型的人之间，存在着日益扩大的鸿沟。\n\n模型卡片首次是为了规范伦理实践，并让用户-利益相关者在模型部署到特定用途之前对其进行沟通。这是为了确保决策的安全，并帮助用户在\
    \ AI 市场中找到适合自己的模型。以确保模型卡片的输出准确且无歧义。\n\n"
