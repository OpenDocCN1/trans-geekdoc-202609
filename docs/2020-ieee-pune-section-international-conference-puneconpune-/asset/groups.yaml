    评估两组评估集至关重要：一组协调工作环境-人口，另一组则包含对模型可能更有意义的人（例如，年轻人、老年人以及工作环境之外的人员）。这可能包含在正常测试中显而易见的目标。针对不同类型的利益相关者，我们可能有：


    通过关于准备信息的逐点数据。例如，这些信息可能是排他的或不相关的安排。在这些情况下，我们主张考虑信息中聚集分散的根本性见解，无论其他人可能对他们可能编码的分类包含所解决的负面划分。


    - 1) AI 和 ML 从业者可以更好地理解模型如何运行，并在各种用例中监控其执行情况。

    - 2) 系统开发人员可以将实验结果与相同领域的其他模型进行比较，并决定是否训练它们。

    - 3) 负责管理的软件工程师应该利用模型预期来决定他们的计划和用法。

    - 4) 政策制定者应该看到 AI 模型在许多不同实例中的证明或失败。

    - 5) 公司将评估有关引入 AI 的新的执行情况。

    - 6) ML 精通者可以简要说明选择模型、微调或额外的差异，并帮助在没有专业知识的情况下为预期用例改进模型。

    - 7) 体验模型影响的个人可以帮助澄清我们如何为了护理或评估模型。


    这种方法不仅增强了稳健性并有助于为相关利益相关者简化决策流程，还促进了前性的模型方法。例如，将数据切分为不同的类别可能会揭示可能出现在个体频率中的问题，这与其他正义的概念相符（因为经常出现在图
    1 的模型卡中）。社区监控过程允许成员在特定环境中评估 ML 算法，应用报告是一种开放的方法，这还导致 ML 训练输入和小组可能也包含关于为什么的信息，并将未来的关注点放在上述哪些版本适用于他们的特定目的。通过监控模型，利益相关者可以充分了解各种模型。此外，运行独立数据集的发现可能使潜在消费者受益，使用评估数据集进行测试和研究可能涉及开发可靠的评估数据库和协议，以确保我们所建议的评估质量，这在本例中，通过确保个人无法通过其特征被唯一识别的方法。理想情况下，模型卡关于准备信息的数据应与评估信息一样多。尽管如此，仍可能出现无法提供这一点的情况。


    这项工作将模型卡类型分为两类：基于图像的分类系统和基于……的评分系统。


    ## IV. 模型卡类型


    ### A. 微笑分类器


    为了展示图像分类研究的模型卡示例，我们使用公开的 CeleA 数据集来分析跨年龄和性别的“分类”成功率。发现表明，文本和图像在老年人中的披露也比其他类别高得多。这意味着模型是正确或不准确的，即使它们并非如此。另一方面（总体）文本负面偏偏表明参与中许多真正微笑的人被错误地识别为没有结果。这些分析的结果为模型提供了关于其不佳之处的概述。该方程代表用于分类的线性回归方法。


    ```

    f(x) = \sum m_i x + b

    ```


    这可能不被推荐，例如应用于广泛的社区，并且在检测单个文本相关的强度时比任何其他事物都最有效（例如在一个识别适当“正面时刻”的应用中）。例如，额外使用人的照片有助于在类别之间建立更多代表性。


    ### B. 毒性评分


    第二个插图给出了 Perspective API 层，用于识别图 3 中文本和图像中的“毒性”。模型使用了 [12] 中开源的、合成生成的身份短语模板集合。这项工作展示了模型的毒性的两个版本：原始版本，另一个是最新版本的
