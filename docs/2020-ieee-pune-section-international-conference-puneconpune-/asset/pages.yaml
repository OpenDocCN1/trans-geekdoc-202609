    **Abstract—**In our daily lives, we rely on information that is provided by makers
    to make right choices such as the nutritional content of food, warnings in medicines,
    measures for a constructed road, but when it comes to AI there has been no provided
    information about machine learning models distributed without a proper understanding
    of how they function, under what conditions it would perform the best, and whether
    it is fair or biased, and so, from where they are.


    Developers may use this in designing applications that emphasize a model''s strengths
    while avoiding or informing end-users of its weaknesses. Like users, analysts
    and journalists might provide insights to make some technology easier to explain
    to a general audience and also advocacy groups to better understand AI''s impact
    on society.


    Model cards are a necessity and hot topic of research. In Machine Learning (ML),
    transparency with model cards is relevant as it adds wide range of domains, from
    health to finance and jobs. This research presents the importance of model cards
    and transparency.


    The model card toolkit (MCT) provides a schema in JSON with the details of model
    shown in figure


