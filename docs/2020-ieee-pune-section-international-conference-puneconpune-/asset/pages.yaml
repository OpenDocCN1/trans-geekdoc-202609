    # V. CONCLUSIONS


    This research addresses major issues of model cards and their transparency. Transparency
    in itself brings challenges such as the one of imperfect property. There is a
    need to deliver models without exposing sensitive information, privacy or data
    secrets. The model creators must be adapted to federation or differential access
    to video. Also, model cards express qualitative information which presents challenges
    such as the type of input, limitations and etc.


    +   Ethical Considerations

    - The Perspective API uses a set of labels to guide their work. In various communities,
    transparency is a key mechanism to reconcile conflicts of interest.

    - Ethical considerations include privacy concerns, the model does not take into
    account user history when making judgments.


