    is automatically populated in JSON with the relevant information. An API for the
    reverse process is also provided that it fetches the stored information and visualizes
    it in the form of a card syntax which is


    +   2. The model card creator can choose what graphs and metrics to display in
    the final card and also create information such as limitations, tradeoffs, intended
    use case. This is crucial for the developers to choose from. Standard User Interface
    (UI) templates are included in the MCT but a user can also create them in HTML
    to help visualize the information density.


    *Index Terms-*Model description, disaggregated evaluation, fairness in AI, Machine
    Learning evaluation, datasets.


    At present MCT is available to TensorFlow extended


