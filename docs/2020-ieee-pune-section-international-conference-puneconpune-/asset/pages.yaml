    # I. INTRODUCTION


    Model Cards are a proposal going by in research that addresses these essential
    facts about ML in a structured manner.


    In ML, Card transparency is important because it affects a wide range of domains
    from health to employment. The information needed by the downstream users can
    easily use and often more than was intended by the model used. If transparency
    is maintained by establishing essential facts of the model the user can choose
    the appropriate one for use.


    Standardized methods for benchmarking numerous systems under various conditions
    have been developed by most mature industries. An example, as mentioned in [1],
    the hardware industry uses datasets along with the performance of the components
    under various conditions. Contrastingly, with the wide reach and influence of
    machine learning models, there exists no standardized test tests for machine learning
    models.


    Over the years cards are becoming more and more in use as the MediaPipe which
    create state of models on computer vision has included model cards in their repositories.
    These sets of cards contain substantial time and effort and often require detailed
    analysis of the performance which can be a tedious task. Model creators may want
    to specify the model''s limitations or use cases in a more understandable to the
    users.


    In order to streamline the creation of these model cards goes a shared card toolkit
    (MCT) which is a collection of tools that helps developers in gathering the information
    that the model card can [15].


    Increased transparency for a machine learning model can benefit experts and non-experts
    alike.


