    # 26 数字图像水印


    噪声在保持透明度和安全性的同时，对于复制控制、交易追踪和图像所有权证明是必须的。三十年来，研究人员和开发人员一直在该领域开发算法、架构和系统，以获得最佳结果。


    本章讨论了各种传统的和基于机器学习（ML）的数字图像水印算法，并对比了近期的一些工作，以定义未来研究中需要考虑的挑战。本章从基于空间域的水印方法开始，接着是变换域技术，最后以基于
    ML 算法概念的进阶水印技术结束。


    ## 2.1 引言


    在当今的电子时代（主要包括电子商务、电子银行、电子健康和在线学习），信息可以在不经所有者许可的情况下被有效下载。偶尔，这些情况会产生问题，例如版权安全和所有者验证。在这些情况下，在高级信息通过开源传输介质进行交换之前，需要对其进行保保证和验证。为了解决这些问题，分析人员提出了不同的信息隐藏策略：密码学、隐形术和水印术。水印主要用于信息的保保证和验证。这种方法通过将水印嵌入到宿主内容中，使得即使是基础客户端也找不到隐藏的水印，从而克服了隐形术的限制（Borra
    and Lakshmi, 2015）。如第1章所述，水印框架包含三个部分：水印嵌入器；对应信道（可能是有线或无线的）；以及水印提取器。水印嵌入器将水印嵌入宿主图像中以生成带水印图像，而水印提取器则从测试图像中提取水印，测试图像可以是受攻击或未受攻击的水印图像。


    在此回顾了数字图像水印的主要要求：


    - 1. 鲁棒性（Robustness）：水印技术必须保护所有者数据免受任何操纵，并且必须具有鲁棒性。

    - 2. 不可感知性（Imperceptibility）：将水印插入宿主数据后，宿主数据的视觉质量不应受到很大影响；也就是说，水印不应该是可察觉的。

    - 3. 嵌入容量（Embedding capacity）：水印技术应该允许隐藏大型水印（Banerjee, 2015）。


    水印技术主要在两个处理领域开发：空间域和变换域（Borra and Lakshmi, 2015）。空间域技术易于实现，但由于宿主图像像素被直接修改，提供的不可感知性较低。变换域水印较为复杂，但提供了比空间域水印更强的鲁棒性。在所有变换域技术中，在嵌入水印之前，使用各种离散余弦变换（DCT）和离散小波变换（DWT）将宿主图像转换为频率域（Dey
    et al., 2012），随后对图像进行逆变换。传统数字图像水印方案的框架如图2.1所示。在空间域水印中，通过改变最有效位（LSBs）或添加各种噪声序列直接修改宿主图像。在变换域水印中，水印被嵌入到选定的域系数中（Hartung
    and Kutter, 1999; Bender et al., 1996; Surekha and Swamy, 2011; Ashour and Dey,
    2017; Thanki and Kothari, 2017）。


    在嵌入水印之前对宿主图像进行预处理有助于我们提取更好的特征用于水印嵌入，并获得更好的性能。


    ![](img/2aafc43f8e3a22e17b338f7ddcb87be4_42_0.png)


    图 2.1 传统数字图像水印框架。


    归一化、分割和特征提取是常见的预处理技术。图像归一化可以提高对光照变化和尺度变数的鲁棒性。分割和特征提取可以实现对故意攻击（如几何形变）的高鲁棒性。诸如高斯混合模型（GMM）、期望极大算法（EM）、均值漂移分割、墨西哥波尺度交互、尺度不变特征变换（SIFT）和差分高斯（DoG）等技术可以抵抗旋转、平移、缩放、低通滤波、中值滤波、高斯噪声、JPEG压缩等攻击。水印术可以用于对所有者的身份验证。


    ## 2.2 空间域水印


    这些技术主要指在空间域中开发的水技术。空间域技术支持嵌入高容量水印。本节讨论了多种技术。


    ### 2.2.1 最有效位替换技术


    LSB 替换技术是一种基础水印技术，通过修改位来实现（Lee and Chen 2000; Chen, 2004; Ramalingam, 2011）。在
    8 位图像中，最有效位（位 7）包含大部分信息，而最有效位（位 0）不包含视觉信息。因此，选择最有效位用于水印目的。例如，在彩色图像中嵌入水印时，将位分组。第一组插入
    R 通道 G 通道的 LSB，第二组插入 B 通道，组合这些通道生成带水印图像。该技术的主要优势是嵌入水印后宿主数据的视觉质量不会受到影响；普通人无法观察到这些修改。该技术的局限性是这样嵌入的水印是脆弱的。


    ### 2.2.2 Patch 技术


    Patchwork（Bender et al., 1996）利用某些统计数据生成随机模式并将其嵌入图像中（Durvey and Stayarthi, 2014;
    Soman, 2010），以对丢性压缩和添加噪声具有鲁棒性。该技术只能在图像中嵌入小型水印。对于每个水印位，考虑一组块。为了隐藏 1，增加一个块的强度并按固定因子
    α减少另一个块的强度。如果水印位为 0，则不更改任何块。块的位置取决于密钥。检测水印时，计算块对之间的平均差和并与阈值比较。块的位置被保密，假设图像数据具有某些属性，通过平均两个子集之间的差异可以轻松定位水印。


    ### 2.2.3 纹理映射编码技术


    该技术用于富纹理信息的图像版权保护（Datta and Nath, 2014）。首先将宿主图像分割为两个区域：纹理区域和非纹理区域。随后，使用任何空间域水印嵌入程序修改纹理区域的像素，然后与宿主图像的非纹理区域组合获取带水印图像。在提取过程中，首先将带水印图像分为非纹理区域和纹理区域。然后，通过反转操作，从水印纹理区域恢复水印。


