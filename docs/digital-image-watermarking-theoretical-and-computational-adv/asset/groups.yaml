    # Authors


    Sureskha Borra is currently a professor in the Department of Electronics and Communication
    Engineering and chief research coordinator of K. S. Institute of Technology, Bangalore,
    India. She earned the doctorate in the copyright protection of images from Jawaharlal
    Nehru Technological University, Hyderabad, India. Her current research interests
    are image and video analytics, machine learning, biometrics, biomedical signal,
    and remote sensing. She has filed 1 Indian patent; published 6 books, 12 book
    chapters; and several research papers in refereed and indexed journals; She has
    received several research grants and awards from professional bodies and the Karnataka
    state government of India. She has received the Young Woman Achiever Award for
    her contribution to the copyright protection of images, the Distinguished Educator
    & Scholar Award for her contributions to teaching and scholarly activities, and
    the Woman Achiever''s Award from the Institution of Engineers (India) for her
    prominent research and innovative contributions.


    Rohit Thanki earned his PhD in multimetric system security using the compressive
    sensing theory and watermarking from C. U. Shah University, Wadhwan City, Gujarat,
    India, in 2017. His areas of research are digital watermarking, the biometrics
    system, security, compressive sensing, pattern recognition, and image processing.
    He has published 5 books, 7 book chapters, and more'
  - '[PAGE 12]


    than 25 research papers in refere and indexed journals, and has participated in
    conferences at the international and national level. His international recognition
