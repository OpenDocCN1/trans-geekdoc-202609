    ## 126 数字图像水印


    所有权。在变换域水印中，宿主图像的变换系数通过水印进行修改。该技术的硬件级实现比空域技术更复杂，因为它需要额外的硬件模块和资源来实现正向和反向变换；而这种实现最适合并行、流水线架构。还有一些方法是将变换/反向/提取操作在
    MATLAB 中完成，而算法的其他步骤由 FPGA 硬件完成。目前还有许多用于安全相机的数字图像水印原型，其主要组件包括图像传感器、模数转换器（A/D）、水印单元、临时内存、闪存、控制器单元和液晶显示器（LCD）面板。


    ## 4.4 挑战与未来方向


    基于硬件的实现仅针对少数加性水印技术开发，例如 LSB 替换、SS 技术以及使用 FPGA 板或或 DSP 套件的 DCT/DWT 基于的技术。许多基于通道编码算法、相位一致性、奇异值分解、曲线波变换、轮廓波变换、脊线波变换、混合组合、机器学习和生物启发算法的先进软件水印技术尚无硬件级实现。因此，这些类型的先进水印技术需要新的硬件实现方法。还需要开发高效的硬件水印架构，这些架构能够在更高频率下运行，涉及更少的资源和计算，同时保持良好的不可感知性和针对不同类型攻击的鲁棒性。使用
    XSG 设计数字图像水印原型需要对时间、面积和成本进行降低，以及资源利用和延迟的优化，所有这些都要便于设备的集成和配置。


    127 硬件实现


    某些基于硬件的水印实现是软硬协同设计的以节省功耗和时间。某些高性能操作在硬件中设计，而计算密集型操作则在软件中实现。这些设计在硬件和软件实现之间取得了平衡，未来可以进一步改进。


