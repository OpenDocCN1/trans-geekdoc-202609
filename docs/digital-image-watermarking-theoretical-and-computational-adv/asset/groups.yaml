    ## 2.8 SCHUR DECOMPOSITION–BASED WATERMARKING


    Schur decomposition (Van Loan, 1996), when applied on a real matrix $A$, results
    in two matrices $U$ and $D$ such that $A = U \times D \times U^T$, where $U$ is
    a unitary matrix and $D$ is an upper triangular matrix. The $D$ matrix has real
    eigenvalues on the diagonal. This decomposition requires about $8n^{3/2}$ computational
    operations, which is less than those required for SVD decomposition (about $11n^3$).
    The $U$ matrix has the characteristic that all the elements of the first two columns
    have the same sign and values. This property of the $U$ matrix is used in the
    watermark embedding process. Thus, the blind watermarking approach can be easily
    designed using this decomposition. Schur decomposition–based watermarking (Li
    et al., 2017; Rajab et al., 2015; Meenakshi et al., 2014; Razaafindradina et al.,
    2013; Gunjan et al., 2012; Mohammad, 2012; Su et al., 2012; Chaudhary et al.,
    2012; Mohan et al., 2011; Mohan and Swamy, 2010; Seddik et al., 2009) provides
    high transparency compared with all other watermarking approaches, but it is more
    complex to implement.


    ## 2.9 HESSENBERG MATRIX FACTORIZATION IN WATERMARKING


    The Hessenberg decomposition (Van Loan, 1996) is a matrix decomposition method.
    A matrix $B$ is decomposed into a unitary matrix $U$ and a Hessenberg matrix $H$
    such that $U \times H \times U^T = B$, where $U^T$ is the conjugate transpose
    of the unitary matrix. This decomposition requires about $14n^{3/3}$ computational
    operations that are higher than the computational operations required in the Schur
    decomposition but less than those of SVD decomposition. Hessenberg matrix factorization
    is used in watermarking to ensure that the randomization process is perfectly
    invertible (Su and Chen, 2017; Singh et al., 2017; Su, 2016; Bhatnagar and Wu,
    2013; Bhatnagar et al., 2010). Watermarking using this decomposition is more complex
    to implement and is less explored by researchers.


    ## 2.10 VISIBLE AND REVERSIBLE WATERMARKING


    Visible watermarking is a common watermarking approach that is mainly used for
    content authentication or ownership identification. In this approach, the watermark
    is visibly overlaid on some portion of the host medium (Biswas et al., 2013).
    Two sample visible watermarked images generated using existing techniques (Thanki
    et al., 2011, 2017) are shown in Figure 2.4. The disadvantage of visible watermarks
    is that they introduce degradation into the host image.


    Reversible watermarking is a special case of watermarking. The original host medium
    is recovered completely at the receiver side, which is not possible in conventional
    watermarking. In general, any reversible watermarking is implemented in three
    steps: watermark embedding, watermark extraction, and host medium recovery (Lakshmi
    and Surekha, 2016; Chakraborty et al., 2014; Pal et al., 2013). All these processes
    require a secret key to achieve security of the watermark. A block diagram of
    reversible watermarking is shown in Figure 2.5. Note that after watermark extraction,
    there is one more step, called original image recovery. The input to this algorithm
    is the watermarked image, secret key, and original watermark, while the output
    is the extracted original host.


    ![](img/2aafc43f8e3a22e17b338f7ddcb87be4_57_0.png)

    FIGURE 2.4 Sample visible watermarked images.


    ![](img/2aafc43f8e3a22e17b338f7ddcb87be4_57_1.png)

    FIGURE 2.5 Block diagram of reversible watermarking.


