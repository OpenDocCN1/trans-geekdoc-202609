    # 138 ■ Digital Image Watermarking


    Satellite images are mostly acquired in multiple spectra by specially designed
    sensors, which are very expensive and involve complex installation procedures
    and post-processing. Multispectral images are part of big data. Satellite images
    and aerial imagery are rich sources of information and may contain confidential
    data related to military and war fields, apart from commercial data. Information
    hiding in remote sensing should be handled extremely carefully, the data is very
    sensitive. These highly sensitive images are prone to leakage and are to be protected
    with greater levels of confidentiality and security. It takes more time to encrypt
    these images and the key management is so tedious. Hence, it is very important
    to protect acquired images from misuse, illegal access, and usage, as well as
    protecting the copyrights. Secure storage, maintenance, archiving, and transmission
    of these remotely sensed images from unauthorized personnel is a challenging task.
    Traditional watermarking techniques developed for images acquired in the visible
    band cannot be directly applied to satellite images as they are multispectral
    and hyperspectral images and can even have a raster data structure. Hence, a crypto
    watermarking technique is most suitable for these images.


    The crucial requirements of watermarking techniques when applied to satellite
    images are imperceptibility, lossless embedding, the capacity to extract the watermark
    blindly, the ability to watermark region of interest and integrity of data. Robustness
    to compression, noise, and filtering is sufficient in most of the applications.
    It is important that the watermark embedding should not affect the image''s classification,
    accuracy, matching, and measurements. The watermark should be able to be detected
    at multiple resolutions. The reversible watermarking schemes are widely used in
    military applications where copyright protection or ownership authentication is
    required. The watermark and the original image are extracted from the watermarked
    image.'
