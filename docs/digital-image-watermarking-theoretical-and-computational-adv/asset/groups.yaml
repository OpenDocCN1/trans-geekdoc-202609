    ### 4.2.1 使用 DSP 板板进行水印的硬件实现


    各种 DSP（数字信号处理器），如 TMS320C5410、TMS320C670 等，被用于水印的硬件级实现。这些处理器的选择取决于所采用的水印技术类型、涉及的多媒体文件类型以及处理时间。使用
    DSP 平台进行水印处理的基本硬件级实现流程如图 4.1 所示。在此流程中，应用软件（如 MATLAB 仿真工具、Visual CV）被用于在 PC 上实现水印算法。算法代码通过主机-端口接口（HPI）总线和工业标准架构（ISA）总线传输到
    DSP 板板。同步信号被用于同步 PC 和 DSP 板板。DSP 板板可以在两种模式下运行：(1) 离线数据生成和 (2) 实时数据生成。在这两种模式下，主机
    PC 均通过 HPI 电缆直接读写到 DSP 板板内部内存中的数据。


    - 离线数据生成：将多媒体文件传输到 DSP 板板，使用 DSP 板板上的代码对多媒体文件进行水印处理。这些数据可以传回主机 PC 并在那里显示。


