    和加权 PSNR (WPSNR) (Wang, 1999)；归一化相关 (NC) 和 SSIM 是衡量原始水印与提取水印之间相似性的常用指标。这些指标反映了提取水印的质量，还有助于分析水印技术在攻击存在下的鲁棒性
