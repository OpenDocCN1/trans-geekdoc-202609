  - '[PAGE 23]


    Blind watermarking techniques do not require either the original host or the watermark
    for watermark extraction, and are flexible for use in many applications, including
    image authentication, copyright protection, covert communication, and electronic
    voting systems. Semiblind techniques do not require the original host but require
    the original watermark or some additional information for watermark extraction.
    Content privacy, image authentication, and copyright protection are a few applications
    of semiblind techniques. Non-blind techniques require the original host image
    for watermark extraction, which may be difficult to produce, and so are limited
    in application.


    Watermarking systems are classified into spatial and transform-categories (Qasim
    et al., 2018) depending on the watermark embedding domain. These techniques are
    designed to insert the watermark directly into significant portions of the pixels/transform-components
    of the original host image if it is gray, or into the luminance or respective
    color components. While some watermarking techniques follow one-to-one mapping,
    many existing techniques are block processed to insert one bit of watermark over
    many pixels or transform coefficients randomly. In contrast to substitution techniques,
    some watermarking techniques add scaled watermark information to the host image
    pixels/transformed coefficients while minimizing noticeable distortions. Machine
    learning or optimization techniques are now in use to determine the optimum and
    adaptable scale factors appropriate for the host image.


    The transform domain schemes are computationally complex but robust for signal
    processing attacks and are the right choice for resolving ownership issues. Transforms
    such as discrete cosine transform (DCT), discrete wavelet transform (DWT), and
    singular value decomposition (SVD) are widely employed due to their adaption in
    framing compression standards and their relative perceptual properties of frequency
    bands (Thankanki et al., 2017). In hybrid techniques, watermark bits are inserted
    into'
  - '[PAGE 24]


    hybrid coefficients of the host image, obtained by combining two or more transforms.
    The sparse domain techniques, on the other hand, insert a watermark into sparse
    measurements of the host image obtained from the compressive sensing (CS) theory.


    In traditional watermarking schemes, the watermark is inserted into specified
    pixels or frequency coefficients of the host image using simple logical or mathematical
    equations that involve addition and multiplication. In additive watermarking,
    the watermark is inserted into the host image with the help of a gain factor,
    as in Equation 1.1.


    $$WC = C+k\timesw$$


    In multiplicative watermarking, the watermark is inserted using a constant and
    weighted factor, which in turn is multiplied by the pixel information or frequency
    coefficients of the host image to get the watermarked image, as in Equation 1.2.


    $$WC = C*(1+k\timesw)$$


    Intelligent watermarking schemes, on the other hand, use various intelligent techniques,
    such as machine learning, deep learning, optimization techniques, and bio-inspired
    algorithms, to improve the results of traditional watermarking (Dey et al., 2014).
    The machine learning and optimization algorithms are widely used in watermark
    embedding and/or the extraction process. The bio-inspired and optimization techniques,
    on the other hand, are used for the optimum selection of pixels or frequency coefficients
    of the host image for watermark embedding. These algorithms are also used for
    automatically finding the optimized scaling factors during watermark embedding.
    This is in contrast to traditional watermarking, where watermark bits are inserted
    into the host image using user-defined locations/scaling factors.'
