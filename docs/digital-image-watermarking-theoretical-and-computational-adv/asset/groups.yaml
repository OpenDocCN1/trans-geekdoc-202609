    # 4 Digital Image Watermarking


    confidentiality, steganography ensures that nobody has knowledge that entities
    are communicating in secret, and hence it is suitable for copyright marking. In
    contrast, watermarking has been part of one-to-many communications and is used
    to verify the owner of a multimedia file (Vellasques et al., 2010).


    While the objective of steganography is to protect the hidden message, the objective
    of watermarking is to protect the host file from ownership/copy conflicts. The
    watermark represents the author/owner/buyer of the file (Dew and Santhi, 2017;
    Borra et al., 2017, 2018). In contrast to appending the signature at the end of
    the file, as in the case of a digital signature to ensure authorship, watermarking
    embeds water in the file itself, guaranteeing authorship and data integrity (Sherekar
    et al., 1999). While the cryptography objective is to secure the file (confidentiality)
    watermarking tries to secure ownership (authenticity) of the digital file. While
    encryption cannot copy control once the data is decrypted, watermarking can protect
    and copy control data even after decryption (Borda, 2005; Sherekar et al., 1999).


    # 1.2 DIGITAL IMAGE WATERMARKING


    Images are often susceptible to theft and copyright infringement. There are many
    occasions where images have been stolen from websites for usage/fame/financial
    gain and justice did not prevail, leading to losses for the owners/inventors.
    Mechanisms for identifying and protecting their owners from adversaries (Vellasques
    et al., 2010) are thus needed. Before the digital era, painters/photographers/organizations
    usually signed their art/photographs/designs with their signature, initials, or
    pseudonyms/print stamps to help identify themselves as the owners of the images,
    especially if the IP were to be shared. Watermarking is another way for an owner
    to sign or her image and ruin the efforts of attackers. A watermark is a superimposed
    image/logo/text placed over an image with the intention of identifying the owner
    of the image. Analog watermarks that are'
