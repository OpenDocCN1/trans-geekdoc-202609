    盲水印技术在提取水印时既不需要原始宿主图像也不需要水印，在许多应用中都非常灵活，包括图像认证、版权保护、隐蔽通信和电子投票系统。半盲技术不需要原始宿主图像，但在提取水印时需要原始水印或某些额外信息。内容隐私、图像认证和版权保护是半盲技术的若干应用。非盲技术在提取水印时需要原始宿主图像，而这种图像可能难以获取，因此在应用上受到限制。


    根据水印嵌入的域，水印系统可分为空间域和变换域（Qasim et al., 2018）。这些技术旨在将水印直接插入到原始宿主图像的像素/变换分量的显著部分（如果该图像是灰度图），或者插入到亮度或相应的颜色分量中。虽然某些水印技术遵循一一映射，但许多现有技术采用块处理方式，在许多像素或变换系数上随机插入
    1 比特水印。与替换技术相比，某些水印技术向宿主图像像素/变换系数添加缩放后的水印信息，同时最大限度地减少肉眼可见的失真。目前已采用机器学习或优化技术来确定适用于宿主图像的最佳且自适应缩放因子。


    变换域方案计算较为复杂，但对信号处理攻击具有鲁棒性，是解决所有问题的正确选择。离散余弦变换（DCT）、离散小波变换（DWT）和奇异值分解（SVD）等变换由于在帧压缩标准中的应用以及频带的相对感知特性而被广泛采用（Thankanki
    et al., 2017）。在混合技术中，水印位被插入到通过两个或多个变换组合得到的宿主图像混合系数。另一方面，稀疏域技术将水印插入到从压缩感知（CS）理论获得的宿主图像稀疏测量中。


    在传统水印方案中，使用涉及加法乘法的简单逻辑或数学方程将水印插入宿主图像指定的像素或频率系数中。在加法水印中，通过增益因子辅助插入宿主图像，如公式 1.1
    所示。


    $$WC = C+k\timesw$$


    在乘法水印中，使用常数和权重因子插入水印，该因子再乘以宿主图像的像素信息或频率系数以获得水印图像，如公式 1.2 所示。


    $$WC = C*(1+k\timesw)$$


    另一方面，智能水印方案使用各种智能技术，如机器学习、深度学习、优化技术和生物启发算法，改进传统水印的结果（Dey et al., 2014）。机器学习和优化算法被广泛用于水印嵌入和/或提取过程。另一方面，生物启发和优化技术用于为水印嵌入选择宿主图像的最佳像素或频率系数。这些算法还用于在水印嵌入过程中自动寻找优化缩放因子。这与传统水印形成对比，传统水印使用用户定义的位置/缩放因子将水印位插入宿主图像中。


    # 1.4 数字水印的通用框架


