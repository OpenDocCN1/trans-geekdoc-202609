    constraints. The penalty function has to satisfy two requirements:

    (1) it is progressive, and (2) the factor of this function is the summarized value
    of all the loss due to constraints violation.


    GA uses a population of classes that gives optimal solutions. GA is naturally
    used for solving maximization problems. This algorithm is robust, flexible, and
    efficient on various types of problems. GA is not a simple random search optimization
    method, but it utilizes knowledge of previous iteration and generates new optimal
    solution. There are six steps in this algorithm:

    (1) problem identification, (2) initialization of class, (3) evaluation of fitness
    function, (4) constraint handling, (5) generation of new class, and (6) stopping
    criteria. The first step in applying GA is encoding, which sets its window limitation
    for use in the system. In GA, the information is represented by multiple chromosomes/genes,
    which are represented as a string of variables. The variables can be binary or
    real numbers and their length is determined by the problem specification. The
    two parameters, class and process, are initialized next. Each class is evaluated
    based on some fitness function measurement in the process of obtaining optimal
    solutions. The GA generates multiple class points with predefined size. This makes
    GA to search multiple different probabilities of the problem space and results
    in global optimal solution. After initialization of class, GA uses the survival
    principle of nature to search process and uses the fitness information as input
    information to determine the space for problem. The generation of new class is
    done using different operators such as selection, crossover, and mutation. The
    first step involves selection of a class from multiple classes according to the
    fitness function with respect to a given optimization problem. Once the selection
    process is over, the crossover, which is a recombination operator that combines
    information of two main chromosomes to produce new information, is applied. The
    mutation and crossover operators generate a large amount of data strings that
