    ## Hardware-Based Implementation $\blacksquare 111


    ### 4.2.1 Hardware-Based Implementation of Watermarking Using DSP Boards


    Various DSPs, such as TMS320C5410, TMS320C670, etc. are used for hardware-based
    implementations of watermarking. The choice of these processors depends on the
    type of watermarking technique employed, type of multimedia files involved, and
    the processing time. The basic hardware-based implementation flow for watermarking
    using a DSP platform is shown in Figure 4.1. In this flow, the application software,
    such as MATLAB simulation tool, Visual CV, is used for implementing watermarking
    algorithms on a PC. The code of the algorithm is transferred to the DSP board
    using a Host-Port Interface (HPI) bus and Industry Standard Architecture (ISA)
    bus. The synchronization signals are used to synchronize the PC and DSP board.
    The DSP board can operate in two modes: (1) Offline data generation and (2) Live
    data generation. In both modes, the host-pc reads and writes data directly into
    the internal memory of a DSP board using the HPI cable.


    - Offline data generation, the multimedia file is transferred to the DSP board,
    to watermark the multimedia files using codes on the DSP board. This data can
    be sent back to the host-PC where it can be displayed.


    ![](img/2aafc43f8e3a22e17b338f7ddcb87be4_125_0.png)


    FIGURE 4.1 Implementation of watermarking using DSP platform.


    - In live data generation, the multimedia file from the PC is transferred to the
    DSP board and this data can be directly displayed on a monitor or projector using
    the Video Graphics Array (VGA) mode of the DSP board. The monitor or projector
    can be connected using a High-Definition Multimedia Interface (HDMI) cable. In
    this mode, synchronization between PC and DSP board is required.


    ### 4.2.2 Hardware-Based Implementation of Watermarking Using FPGA/ASIC Chip


    A FPGA generally contains a large number of simple processors for parallel processing
    (Khan et al., 2015). The FPGA is an integrated circuit (IC) composed of flip flops,
    Random Access Memory (RAM), programmable switches and interconnecting lines, and
    a large number of programmable logic blocks which are often called as Look Up
    Tables (LUTs) (Pemmaraju et al., 2017). Programming an FPGA includes specifying
    the logic function of each logic cell and the interconnections. Low-Power Very
    Large Scale Integration (VLSI) features, such as clock gating, dynamic, and multiple
    supply voltages, can be used (Ghosh et al., 2014). While GPUs and DSPs are designed
    for a general set of functions, FPGA provides reconfigurable solutions and offer
    higher throughputs and data rates over DSP processors.


    For an application that involves multiple operations which can be implemented
    in parallel, performance gain can be achieved with FPGAs as they exploit inherent
    temporal and spatial parallelism. An application must be designed to maximize
    the utilization of the FPGA on chip resources, as on-board memories (SRAM, SDRAM,
    etc.), DSP units, and Block RAM, to maximally exploit the inherent parallelism
    of an FPGA. Note that simply porting an algorithm onto an FPGA is inefficient
    as most image processing algorithms have already been optimized for execution
    on a serial processor. Though FPGAs provide throughput advantages over DSPs, for
    applications that demand high accuracy and floating-point operations, floating-point
    DSPs may be chosen for better chip area advantages over FPGAs.


    FPGA boards and ASIC chips, such as Virtex, Cyclone, Altera, Xilinx, and Customized
    IC with various µm CMOS technology, etc., are used for hardware implementation.
    The choice of these boards or chips depends on the type of watermarking technique,
    application, and multimedia files that are being used, as well as processing time
    requirements. As a common practice, hardware-based implementations of watermarking
    are designed and tested on a FPGA board before the watermarking chip is made on
    an ASIC. In the designing process, various VLSI simulation tools such as Quartus
    II, Xilinx ISE design, etc. are used for coding of watermark embedding and extraction
    algorithms. These designs also use the MATLAB to read and write the multimedia
    files and store the generated watermarked files on the host-PC. Two simulation
    tools are used to design watermarking algorithms:(1) VLSI tools and (2) DSP tools.
    The DSP simulation reads the multimedia file, converts it into the digital format,
    and feeds it to the VLSI simulation tool, where the watermark embedding and extraction
    algorithms are designed and implemented, using either VHDL or Verilog. These codes
    are then converted into a hex file which can be loaded onto an FPGA board to test
    the algorithms. After successful testing, a CMOS schematic circuit of an algorithm
    can be generated by the RTL view, using CMOS layout tools, and this is again verified
    for its performance. Finally, the watermarking IC is built on the designed CMOS
    layout. The limitation of this design flow is that once the IC is built no one
    can change any parameters of the IC. The basic structure of watermarking chips
    is shown in Figure 4.2. The design flow for watermarking using ASIC is shown in
    Figure 4.3.


    ### 4.2.3 Hardware–Software Co-Simulation


    The XSG (Lin et al., 2009) is a useful tool for the development and implementation
    of real-time image/video/computer vision-based algorithms. Implementation of such
    algorithms on FPGAs is the best choice for prototyping, as they are composed of
    large memories and embedded multipliers, which can process the binary and fixed-point
    operations at a very high rate, exploiting spatial and temporal parallelism. This
    section presents the design and implementation flow of hardware–software co-simulation
    processes using prototype tools such as XSG and MATLAB-Simulink (Madanayake and
    Len, 2008).


    ![](img/2aafc43f8e3a22e17b338f7ddcb87be4_128_0.png)


    FIGURE 4.2 Basic pins of watermarking chip.


    The XSG Simulink Blockset for several built-in hardware operations that could
    be implemented on various Xinx FPGAs. The MATLAB Simulink is used to program and
    simulate the model. High-level languages and compilers are capable of automatically
    extracting the parallelism from the code are not directly compatible with hardware.
    The XSG automatically generates a HDL test bench from Simulink models and supports
    design verification and implementation on DSP/FPGA platforms (Karthigaikumar and
    Baskaran, 2012).


    HDL coders are used to generate VHDL/Verilog code from Simulink models/MATLAB
    code. ModelSim is used to test the RTL. The XSG has an integrated design flow
    to transfer the configuration into FPGA by using hardware-simulation tools. The
    blocks of XSG only process fixed-point/Boolean values in contrast to the Simulink
    blocks, which can process double-precision floating-point numbers. The gateway
    blocks are often used for interconnecting Simulink blocks and XSG blocks. The
    built-in synthesizer of XSG allows the conversion of HDL code into a gate-level
    netlist and generates a synthesis report, which indicates run time, area, and
    power (Rahimunnisa et al., 2012). The FPGA configuration files can then be generated
    by a compilation script (Que et al., 2010). The bit streams are then transferred
    from the PC to FPGA board by using Universal Asynchronous Receiver/Transmitter
    (UART) serial communication, a JTAG platform, and Universal Serial Bus (USB) cable.


    ![](img/2aafc43f8e3a22e17b338f7ddcb87be4_129_0.png)


    FIGURE 4.3 Watermarking chip generation using ASIC technology.


    After specified processing, the result can be transferred back to a PC for display
    and validation. Finally, resource utilization and timing reports can be viewed.
    The target devices can be Spartan/Virtex/Altera boards (Rahimunnissa et al., 2012).
    The block diagram of simple hardware implementation for digital watermarking is
    shown in Figure 4.4.


    ![](img/2aafc43f8e3a22e17b338f7ddcb87be4_130_0.png)


    FIGURE 4.4 Simple hardware implementation block diagram of digital watermarking
    technique.


    ## 4.3 PERFORMANCE OF HARDWARE-BASED IMPLEMENTATION


    In this section, various hardware watermarking implementation approaches using
    FPGA, DSP, and ASIC boards in spatial, transform, and hybrid domains are compared.
    There are several approaches for watermarking in the spatial domain. These watermarking
    techniques may be by the Least Significant Bit (LSB) substitution, additive watermarking,
    Spread Spectrum (SS)-based watermarking, and reversible watermarking technique.

