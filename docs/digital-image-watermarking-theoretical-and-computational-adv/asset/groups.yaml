    | Ali 等 (2014a) | DCT + SVD | 盲检测与系数对比 | NC | | $f = \frac{1}{N} \sum_{i=1}^{N}
    NC(w_i, w''_i)$ |

    | Aslantas (2009) | SVD | 非盲检测 | Corr | | $F_i = \frac{1}{L} \sum_{i=1}^{L} \text{corr}(w_i,
    w''_i)$, $f_i = \frac{1}{F_i}$ |


    其中，$f$ 为适应度函数；NC 为归一化交叉相关；corr 为相关；BER 为比特错误率；$w$ 为原始水印图像；$w^*$ 为恢复的 $WI$；原始宿主图像；$I$
    为水印图像。


    这些算法被称为轨迹跟踪算法，由五个基本原理描述（Waleed 等，2014）：


    - 邻近性：该类应具有简单的搜索空间和计算时间

    - 质量性：该类应能响应工作空间内的质量因素

    - 多样化响应：该类在不同的工作空间内应具有相同的性能

    - 稳定性：如果工作空间发生变化，该类的行为应保持不变

    - 自适应性：该类应根据算法的计算时间改变其工作行为


    文献中存在多种类型的群智能算法（Venter, 2010; Binitha and Sivas Sathya, 2012）。这些算法包括：


    - 蚁群优化 (ACO)

    - 细菌觅食算法 (BF)

    - 蜜蜂算法 (BA)

    - 猫群群优化算法 (CSO)

    - 杜鸟搜索算法 (CSA)

    - 火萤虫算法 (FA)

    - 粒子群优化算法 (PSO)


    在图像水印中，所有这些算法都用于缩放因子的优化。


    ## 84 数字图像水印


    ### 3.4.1 使用蚁群和蜂群的图像水印

    蚁群优化 (ACO) 是最广泛使用且性能最好的群智能算法（Dorigo 等，1996），基于丛林中蚂蚁的运动。它指的是自组织系统内部通过每个个体修改其环境来实现的间接通信方法。通过建模和模拟蚂蚁的各种行为（如觅食、幼虫分类、筑巢等），这些算法解决了复杂的优化问题。ACO
    有三个主要执行功能：(1) 通过标准转换规则让人工蚂蚁穿过问题空间的相邻状态来构建求解过程；(2) 更新信息素以更新一个完整的最优解；(3) 关于全局视角的一些额外操作。ACO
    的优点是它具有固有的并行性和快速的求解能力，并且有许多动态应用。该算法的局限性是难以对大规模蚁群进行理论分析，且通过迭代函数概率分布的变化难以预测。目前开发的基于
    ACO 算法和变换（如快速傅里叶变换 FFT 和离散小波变换 DWT）的水印技术非常少（Loukhaouka 等，2011; Al-Qaheri 等，2010）。现有基于
    ACO 的水印技术实现的平均 PSNR 在 35 到 54dB 之间。文献中未提到这些现有技术的计算时间。现有技术的负载容量较低。


    蜜蜂算法 (BA) 灵感来自蜜蜂的不同特征，如自然界蜜蜂的运动或舞蹈（觅食行为）。在虚拟蜜蜂算法（Yang, 2005）中，信息素浓度直接与优化问题函数相关。人工蜂群算法（ABC）（Karaboga,
    2005）考虑了三种蜜蜂：跟随蜂（观察者蜂）、工蜂（觅食蜂）和侦察蜂，它们在群中都存在。该算法利用蜜蜂的传递能力来寻找最优位置或路径。优化问题与寻找最优路线和路径有关，通过蚁算法和蜜蜂算法的来解决。


    ### 3.4.2 使用杜鸟搜索的图像水印

    数字水印中，CSA 主要用于寻找缩放因子。水印涉及的步骤如下（Dey 等，2013）：


    1. 随机选择一组称为“巢”的解，每个解在特定范围内具有个别值。


