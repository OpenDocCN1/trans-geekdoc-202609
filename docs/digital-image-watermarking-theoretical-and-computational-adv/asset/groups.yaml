    ## 2.12 CHALLENGES


    Watermarking schemes embed watermarks for copyright protection of multimedia data,
    medical data, or biometric data. These schemes explore the various properties
    of signal processing transform to generate watermarked data. Every watermarking
    scheme has its own advantages and disadvantages, and its performance may vary
    with different types of host data. SVD-based watermarking schemes in combination
    with DWT are widely used and provide more transparency and robustness than all
    other watermarking schemes. Most of the watermarking in the literature is done
    by blind watermark extraction of the binary watermark. The lower robustness, less
    security, less transparency, and less acceptability in practical applications
    are seen as weaknesses in many watermarking schemes. There are no benchmarking
    schemes available in the literature. Also, the higher computational time of some
    existing watermarking schemes is a limitation. Many simulation works are available
    for watermarking, but less work is done for hardware implementation of transform
    watermarking. Future research work can focus on these topics. The development
    of algorithms that deal with more general affine and geometric distortions needs
    to be addressed. Finding transformation-invariant domains for watermarking embedding
    is required.


