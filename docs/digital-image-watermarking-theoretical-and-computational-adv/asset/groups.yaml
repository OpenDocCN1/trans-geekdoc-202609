    ### 3.4.3 使用粒子群优化的图像水印

    粒子群优化 (PSO) 算法基于鱼群/鸟群的社会行为。最初随机生成一类粒子，然后使用迭代搜索方法计算最优值。在每次迭代中计算每个粒子的速度向量和位置向量，随后计算局部最佳适应度值和全局最佳值。所有局部最佳粒子中的最佳粒子给出全局最优粒子。PSO
    算法的基本步骤如下（Chakraborty 等，2013）：


    1. 在特定范围内随机生成 N 个初始粒子位置。

    2. 通过将粒子的初始值应用于图像水印并提取原始图像，寻找每个粒子的局部最佳解。


