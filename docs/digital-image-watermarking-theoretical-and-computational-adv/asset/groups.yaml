    ## 3.3 IMAGE WATERMARKING USING DIFFERENTIAL EVOLUTION


    Differential evolution (DE) is based on stochastic population (Storn and Price,
    1997) with differences in class. Only two parameters, mutation factor and probability
    of crossover, are required to tune. A few features of DE are as follows:


    - 1. DE is rarely used for local optimization as it searches multiple areas within
    space.

    - 2. DE is mainly used for non-smooth input functions.

    - 3. DE allows for floating-point data.

    - 4. DE uses arithmetic operation.

    - 5. DE is not usable for.


    In DE, the weighted difference between two parent strings is added with a third
    string to generate the trial string, followed by a crossover operation with the
    optimal solution. Then, a selection operation is applied to compare the fitness
    value of target and trail solution to decide which solution is to carry forward
    in the next stage. The basic DE algorithm has four steps: (1) initialization of
    class, (2) crossover operation, and (4) selection operation. The main advantages
    of DE are that it is easy to implement, requires fewer parameters, and has faster
    convergence compared to GA. The main limitation of this algorithm is that its
    performance may be affected by noise due to its greedy nature. The watermarking
    approaches based on DE are mainly implemented singular value decomposition (SVD)
    in transform domain (Ali et al., 2014a; Aslantas, 2009). The performance of each
    watermarking technique depends on the nature of the host image, the SVD-based
    embedding process, the extraction process, and the number of iterations performed
    in DE. The imperceptibility parameter (PSNR) values achieved with such watermarking
    techniques varies between 32 to 50dB, while normalized correlation (NC) is between
    0.95 and 1. The existing techniques are defined only for grayscale images. The
    computational time of the existing techniques is not mentioned in the literature.
    The lack of recorded data is one of the limitations of watermarking using DE.
