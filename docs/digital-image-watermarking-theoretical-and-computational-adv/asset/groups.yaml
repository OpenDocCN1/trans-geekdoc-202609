    FPGA 通常包含大量用于并行处理的简单处理器（Khan 等，2015）。FPGA 是一种由触发器、随机存取存储器（RAM）、可编程开关和互连线，以及大量通常称为查找表（LUTs）的可编程逻辑块构成的集成电路（IC）（Pemmaraju
    等，2017）。编程 FPGA 包括指定每个逻辑单元的逻辑函数和互连关系。可以使用低功耗超大规模集成（VLSI）特性，如时钟门控、动态和多供电压（Ghosh
    等，2014）。虽然 GPU 和 DSP 设计用于一组通用功能，但 FPGA 提供了可重构解决方案，并比 DSP 处理器提供更高的吞吐量和数据速率。


    对于涉及多个可并行操作的应用，通过 FPGA 可以实现性能提升，因为它们利用了固有的时间和空间并行性。应用程序的设计必须能够最大化地利用 FPGA 芯片上的资源，如板载内存（SRAM、SDRAM
