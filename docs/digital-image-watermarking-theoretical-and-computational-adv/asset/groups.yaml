    - 涉及方程的性质：线性、非线性、几何和二次

    - 设计变量的性质：最优控制和非最优控制问题

    - 设计变量的允许值：整数和实值

    - 目标函数数量：单目标和多目标

    - 问题性质：确定性优化和随机优化问题


    除了梯度下降外，许多寻找最小值（局部/全局）的方法：（1) 近似方法（多项式插值），(2) 搜索方法（二分法、斐波那契法、黄金分割法），(3) 组合方法（Davies,
