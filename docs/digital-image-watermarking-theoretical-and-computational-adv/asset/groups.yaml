    IC with various µµm CMOS technology, etc., are used for hardware implementation.
    The choice of these boards or chips depends on the type of watermarking technique,
    application, and multimedia files that are being used, as well as processing time
    requirements. As a common practice, hardware-based implementations of watermarking
    are designed and tested on a FPGA board before the watermarking chip is made on
