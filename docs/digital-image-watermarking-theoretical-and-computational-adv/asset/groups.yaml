    # Introduction ■ 7


    Based on human perceptibility, copyright marks can be invisible/visible/dual.
    Visible watermarks, as logos, are embeddedly at image corners, warning of copyrights
    and ownership for content protection (Qasim et al., 2018). Placing visible watermarks
    at the center of an image protects against cropping but affects the quality and
    will not be pleasing to the viewer. Today, visible watermarks can also be placed
    intelligently on the host image without affecting the quality using machine learning
    techniques. Invisible marks are mainly designed for forensic/investigation purposes
    as they are placed invisibly and randomly at any pixel positions or frequency
    coefficients of the image based on a secret key. They can be recovered accordingly
    when required for authentication, ownership verification, or data integrity validation
    purposes. Some applications embed invisible and visible watermarks for improved
    security. There are four types of invisible marks: robust, semifragile, fragile,
    and hybrid techniques (Qasim et al., 2018).


    Fragile marking embeds marks in imperceptible portions of an image that the marks
    are destroyed in case of modification of the image. A simple way to implement
    fragile marking is to ensure that the host image is not tampered and that data
    integrity and authentication are maintained. Fragile marks can be easily implemented
    and removed, and are not suitable for proving ownership, but they are useful as
    evidence that an image was modified. The semifragile methods are limited in robustness
    and are designed to survive authorized/specific levels of image processing operations,
    such as compression. As these methods differentiate some sets of operations/attacks,
    they are also used for checking integrity and authentication. The hybrid approaches,
    on the other hand, are a combination of robust and fragile methods to achieve
    a greater level of security, as they achieve ownership protection, data integrity,
    and authentication in parallel (Qasim et al., 2018).'
  - '[PAGE 22]


    # Digital Image Watermarking


    Robust marking is preferred in cases of security applications, such as copy control,
    broadcast monitoring, and copyright protection as these marks survive a wide range
    of attacks (Qasim et al., 2018). Robust marking embeds marks in significant portions
    of an image that the marks are not destroyed in cases of modifications/distortions
    to the image, such as compression, rescaling, resampling, analog-to-digital (A/D)
    and digital-to-analog (D/A) conversion, additive noise, linear and nonlinear filtering,
    shifting, cropping, and rotations, to name a few. The design of robust marking
    techniques is complex and challenging due to the trade-off among the conflicting
    requirements, such as hiding capacity, transparency, and robustness. Though the
    degree of survival depends on the application, the ideal objective is to design
    the marking system such that the mark can be removed only by destroying the host
    image, which is very useful in protecting sensitive images related to the medical
    field and defense (Dey et al., 2017; Biswas et al., 2013). There are two main
    types of robust marking based on the entity to be protected. While watermarking
    identifies the copyright owner of the file, fingerprinting identifies the authorized
    customer who allows/distributes/makes illegal copies of the host image, and/or
    violates the license agreements. Robust watermarking unless specified, is irreversible.
    A special category reversible watermarking is designed to be lossless as these
    marks are invertible and the original watermark can be restored and/or recovered.
    Zero watermarking, on the other hand, does not affect the quality of the host
    image in the process of watermark hiding.


    The watermark detection itself is a function of many inputs, such as the test
    image, private or public key, original watermark, and original host image. Asymmetric/public
    key watermarking allows extraction of the watermark by anyone apart from the owner
    by limiting access to remove it. On the other hand, to prove ownership of images,
    private watermarks are used as they can be detected only by a secret key (Mohanty
    et al., 2017).'
