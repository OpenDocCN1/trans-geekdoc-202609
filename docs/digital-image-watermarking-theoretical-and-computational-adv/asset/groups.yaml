    ## 1.6 METRICS


    The performance of image watermarking schemes in terms of imperceptibility and
    robustness can be measured by various measures. To measure the similarity between
    the original and watermarked image for perceptual distortions, imperceptibility
    metrics such as PSNR and weighted PSNR (WPSNR) (Wang, 1999); Normalized correlation
