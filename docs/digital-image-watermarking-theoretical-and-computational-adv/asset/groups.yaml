  md: "\n# TABLE 3.7 Comparison of FA-Based Digital Image Watermarking Algorithms\n\
    \n| Reference Paper | Domain + Techniques Used | Type of Detection | Similarity\
    \ Measures Used | Fitness Function |\n| --- | --- | --- | --- | --- |\n| Mishra\
    \ et al. (2014) | Transform (DWT + SVD) | Non-blind | NC | $f = PSNR + \\lambda\
    \ \\cdot \\sum_{i=1}^{N} NC(w', w_i)$ |\n| Dixit et al. (2016) | Transform (DWT\
    \ + Schur) | Blind and comparison of coefficients | NC | Not reported |\n| Guo\
    \ et al. (2017) | Transform (DWT + QR) | Blind and comparison of coefficients\
    \ | BER and SSIM | $f = [1 - SSIM(I, WT)] + \\lambda \\cdot \\sum_{i=1}^{N} BER(w',\
    \ w_i)$ |\n| Swaraja et al. (2016) | Transform (DWT + SVD + Schur) | Blind and\
    \ comparison of coefficients | NC | Not reported |\n| Imamoglu et al. (2017) |\
    \ Spatial | Blind | Not reported | Not reported |\n\n*Where $f$: fitness function;\
    \ $NC$: normalized cross-correlation; $corr$: correlation; $BER$: bit error rate;\
    \ $N$: number of attacks; $\\lambda$: constant value; $w^*$: recovered watermark\
    \ image; $I$: original cover image; $w$:marked image.\n\nFA is mainly used for\
    \ the calculation of the optimal scaling factor and the selection of the best\
    \ frequency coefficients of a host image for watermark embedding.\n\n## 3.5 IMAGE\
    \ WATERMARKING USING SIMULATED ANNEALING (SA)\n\nSimulated annealing (SA) is a\
    \ local search optimization algorithm (Aarts et al., 2003; Van Laarhoven et al.,\
    \ 1987) and is based on annealing phenomena, which are thermal processes that\
    \ find low energy states of an atom in a heat environment. The process contains\
    \ two steps; (1) increase the temperature of the heat environment to a maximum\
    \ value at which the atom melts; (2) decrease the temperature of heat environment\
    \ carefully until the particles arrange themselves into the ground state condition\
    \ of the atom, which has the minimum energy state of the atom. The value of this\
    \ state can be obtained only if the maximum temperature is high enough and if\
    \ the cooling is done slowly. The connection between annealing processes and optimal\
    \ minimization was established by M. Pincus in 1970 (Pincus, 1970). The annealing\
    \ process as an optimization technique was proposed by S. Kirkpatrick in 1983\
    \ (Kirkpatrick et al., 1983) for a combinational problem. The SA-based optimization\
    \ process can be performed using the metropolis algorithm (Metropolis et al.,\
    \ 1953) which is based on the Monte Carlo method. The metropolis algorithm generates\
    \ an optimal solution to combinational optimization problems by assuming an analogy\
    \ between the input function and many-particle systems with the following assumptions:\
    \ (1) the solution of the problem is equivalent to the states of a physical system\
    \ and (2) the value of a solution is equivalent to the “energy” of a state. For\
    \ the implementation of SA, two functions are required: (1) a successor function\
    \ that returns a “close” neighboring solution, given the actual optimal value\
    \ (this function works as a distributive function for the particles of the system)\
    \ and (2) a target function to optimize, depending on the current state of the\
    \ system. This function works as the energy of the system. The main advantage\
    \ of SA is that it avoids being trapped at local minima (Metropolis et al., 1953).\
    \ The algorithm uses a random search method which accepts both changes in input\
    \ function f. The probability of optimal value for this algorithm is given as:\n\
    \n```\n$p = \\exp\\left(-\\frac{\\delta f}{T}\\right) \\quad (3.4)$\n```\n\nWhere,\
    \ $\\delta f$ is the change in input function and $T$ is a control parameter,\
    \ which is the analogy by temperature. \n\nThe implementation of SA is very easy\
    \ (Aarts et al., 2003; Van Laarhoven et al., 1987). The input parameters of SA\
    \ are the possible solutions, the generation of random changes in solutions, a\
    \ mean value of evaluating the problem functions, an initial temperature, and\
    \ a method or rules for decreasing it in the search process. Only one image watermarking\
    \ technique is available in the literature (Lin et al., 2010) which used SA for\
    \ calculation of the optimal scaling factor.\n\n## 3.6 IMAGE WATERMARKING USING\
    \ TABU SEARCH\n\nThe tabu search (TS) algorithm is based on the process designed\
    \ to cross boundaries of feasibility or local optimality instead of treating them\
    \ as barriers (Glover and Laguna, 1998). This algorithm relies on three main strategies\
    \ (Pham and Karaboga, 2012); (1) a forbidding strategy which controls values in\
    \ the tabu list, (2) a freezing strategy which controls what the output list of\
    \ tabu is and when it exists, and (3) a short-term strategy which manages interplay\
    \ between the other strategies to select best trail solutions. The restriction\
    \ of tabu is one of the important exceptions in this algorithm. When a tabu has\
    \ a sufficient evaluation value for attraction where the best optimal result can\
    \ be achieved, then classification of tabu may be overridden. This condition is\
    \ called aspiration criterion (Huang et al., 2011).\n\nIn this algorithm, first\
    \ an initial solution is chosen from the tabu list. Then, subsets of solutions\
    \ are generated such that the solution violates tabu conditions or at least one\
    \ of the aspiration conditions have to choose a best solution in subset. If the\
    \ fitness value of the set is less than fitness value of subset, then tabu and\
    \ aspiration conditions are updated. If a stopping condition is met, the algorithm\
    \ is terminated. Various image watermarking techniques based on TS are proposed\
    \ in the literature (Latif, 2013; Wang and Niu, 2013; Huang et al., 2003) based\
    \ on DCT, Hadamard transform and methods like vector quantization. The TS algorithm\
    \ is mainly used for selection of the best frequency coefficients of host image\
    \ for watermark embedding. These techniques have less imperceptibility and robustness\
    \ against attacks.\n\n## REFERENCES\n\n- Aarts, E. H., J. H. Korst, and M. A.\
    \ Arbib. “Simulated annealing and Boltzmann machines.” In Handbook of Neural Networks,\
    \ Theory, (2nd ed) pp. 1039–1044, 2003.\n- Ali, Musrat, and Chang Wo. “An optimal\
    \ image watermarking approach through cuckoo search in wavelet domain.” International\
    \ Journal of System Assurance and Management 9(3): 602–611, 2018.\n- Ali, Musrat,\
    \ Chang Wo and Millie Pant. “A robust image watermarking technique using SVD and\
    \ differential evolution in DCT.” International Journal for Light and Optics 125(4):\
    \ 428–434, 2014.\n- Ali, Musrat, Chang Wo, and Millie Pant. “Cuckoo search for\
    \ selection of optimal scaling factors in watermarking.” In Proceedings of the\
    \ Third International Conference on Soft Computing for Problem Solving, pp. 413–425,\
    \ 2014.\n- Al-Qaheri, Hameed, Abhijit Mustafa, and Soumya Banerjee. “Digital watermarking\
    \ using colony optimization in fractional domain.” Journal of Information Hiding\
    \ and Multimedia Signal Processing 3(3): 179–189, 2010.\n- Antonius, Andreas,\
    \ and Wu-Cheng Lu. “Optimization.” Springer, 2007.\n- Aslantas, Veysel, A. Latif\
    \ Dogan, and Serkan Ozturk. “DWT-based image watermarking using particle swarm\
    \ optimizer.” In IEEE International Conference on Multimedia and Expo, pp. 241–244,\
