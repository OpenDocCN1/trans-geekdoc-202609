    - 数据身份验证与完整性/篡改检测


    数据篡改非常容易，特别是在数字取证应用中应当被检测出来。签名/头部/元数据无法指示对图像所做的更改。脆弱性水印（即当数据被修改时水印会消失）的鲁棒性极低，更适用于识别数据是否保持完整。在处理涉及医疗、军事和卫星图像的应用时，篡改检测至关重要。


    - 广播监控


    水印可以用于监控图像的广播，作为版版税和营销问题的解决方案。


    - 交易跟踪


    不可见水印可以插入到图像中，以跟踪电子商务应用程序中的交易。这是分发过程中的一种远程触发。


    - 内容存档/过滤/分类/电子商务


    可以在图像中插入唯一的数字水印，以便于为了分类和存档目的对其进行快速识别。


    - 身份安全


    身份证和证件经常被攻击者盗窃、复制、伪造、更改或重新生成。可以扫描身份证以检测水印，用于身份验证、欺诈检测、取证分析和跟踪。


    ## 136 数字图像水印


    ## 5.2 远程医疗中的水印


    互联网和通信技术的快速增长以及数字图像存档与通信系统（PACS）、医院信息系统（HIS）和放射信息系统（RIS）的部署，使得远程医疗成为可能。这包括在多个实体之间共享和交换经验、放射图像和电子患者记录（EPR）（Thanki
    and Borra，2018）。


    EPR 和医疗媒体是数字生成的，并在开放网络上传输，作为远程诊断、远程咨询、远程手术、家庭监控、急救和医学教育的一部分。这些文档具有很强的个人属性，包含了有关患者、医院、诊断中心、医生的关键信息，需要对其进行数字身份验证和确认，以确保机密性、真实性和数据完整性。随着今天技术的进步，拦截、复制、跟踪和修改医疗数据变得非常容易。因此，数据的安全传输对于发挥远程医疗的优势至关重要（Thanki
    and Borra, 2018; Dey et al., 2016; Bose et al., 2014; Chowdhury et al., 2014）。


    医学数字影像通信（DICOM）标准推荐了加密技术，如加密、数字签名和哈希函数，以提供身份和真实性（Thanki et al., 2018）。由于安全加密在解密后无法提供保护，因此建议使用数据隐藏和水印方法，特别是针对身份验证、隐私考量和所有权验证。存储在
    DICOM 图像头部的数字签名可以被对手轻易移除或修改，从而影响其真实性和完整性。这是由于 DICOM 将其建议限制在头部的机密性，但没有提供任何关于确保头部真实性或完整性的建议。除了鲁棒水印外，脆弱水印可用于篡改检测和数据完整性。混合方法（如加密水印）解决了大部分安全问题，并确保交换的医疗图像属于正确的个人和组织，确保数据未被操纵，且数据由授权人员访问。


    文献中定义的大多数医学图像水印算法都是不可逆的，本质上是有损的，并且在嵌入水印的同时会永久性损害对诊断有用的内容（Borra et al., 2018; Chatterjee
    et al., 2018; Dey et al., 2012, 2017a; Banerjee et al., 2015; Biswas et al., 2013;
    Pal et al., 2013）。为了克服这些局限性，开发了基于非感兴趣区域（RONI）的水印技术和可以恢复丢失数据的可逆水印技术（Dey et al.,
    2017b）。从医学图像的感兴趣区域（ROI）计算出的哈希函数也可以作为额外水印嵌入。在医学图像中嵌入多个水印可以增强安全性和活性，允许检测篡改，并减少对带宽和存储的需求。然而，在单幅医学图像中嵌入多个水印会降低质量，并影响图像抵御攻击的能力。


    ## 5.3 水印在遥感军事中的作用


    现代遥感和空间技术使得每秒获取大量图像成为可能。地球观测卫星从地球远程收集数据并将其传输到地球站，然后在数据库中进行处理和维护，以便进行存档、查看和购买。这些图像可以进一步被分析和解释，以用于各种科学或商业应用中的决策，例如天气监测、区域观测、数字高程模型、土地覆盖、植被、土壤湿度、防御等。


    ## 138 数字图像水印


    卫星图像大多通过专门设计的传感器以多种光谱获取，这些传感器非常贵，且涉及复杂的安装程序和后处理。多光谱图像是大数据的一部分。卫星图像和航空图像是丰富的信息源，除了商业数据外，可能包含与军事和战争相关的机密数据。遥感中的信息隐藏必须极其小心，数据非常敏感。这些高度敏感的图像容易泄露，需要更高级别的机密性和安全性来保护。加密这些图像需要更多时间，密钥管理也非常繁琐。因此，保护获取的图像免受误用、非法访问和使用非常重要。防止未经授权的人员获取遥感图像是一项挑战。为可见光开发的传统水印技术无法直接应用于卫星图像，因为它们是多光谱和高光谱的。因此，需要最合适的水印技术。


    当水印应用于卫星图像时的关键要求是不可感知性、无损嵌入、盲检测提取水印的能力以及数据的完整性。在大多数应用中，对压缩、噪声和过滤的鲁棒性就足够了。重要的是水印嵌入不应影响图像的分类、准确性和测量。水印能够在多个分辨率下被检测到。可逆水印方案广泛应用于需要版权保护或所有权验证的军事领域。水印和原始图像从带水印的图像中提取。


    ## 5.4 工业及其他应用


    产品设计和数字媒体是知识产权（IP）的形式，是价值努力的成果。因此，保护知识产权生产者和所有者权利的机制需求巨大并受到极大关注。涉及路由和布局的物理布局设计非常敏感，必须能够抗干扰，因为对它们进行的任何更改都会对设计生产力和市场产生不利影响。水印通过追踪未经授权的使用、复制和跟踪来解决知识产权保护问题。


    人们经常在保存和携带之前扫描个人文件和身份证，并制作数字副本。身份窃取者不断试图滥用个人数据。防止此类攻击的准备活动包括加密、数字签名、访问控制以及颁发身份证的公司的水印技术。


    应用于知识产权和身份证保护的水印技术需要具有不可见性、持久性、数据完整性、鲁棒性、强制性和安全性等特征。此外，水印过程应该在最小开销成本下保持功能正确性和组件保护。


    ## 5.5 未来展望

