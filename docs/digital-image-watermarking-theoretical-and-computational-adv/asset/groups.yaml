    # 2.2.5 Additive Watermarking Technique


    The traditional method of watermarking is to employ M sequences/pseudorandom PN
    sequences to sequentially or randomly modify the blocks of host images. Usage
    of PN sequences allows blind detection of watermarks due to their excellent correlation
    properties. These approaches utilize PN sequences in embedding the scaled watermarks
    in an additive fashion to the host image (Langelaar et al., 2000; Arena et al.,
    2000; Shoemaker, 2002). These sequences are preferred as they can affect the pixel
    values in an imperceptible way due to their low magnitudes. The random sequences
    are generated using a seed when required, which acts as a secret key. One sequence
    is used for insertion of watermark bit 0, and the other is used for watermark
    bit 1. The watermark is inserted into the host image using the following steps:


    +   1. Take the host image and divide it into blocks. The size of the blocks depends
    on the size of watermark and host image.

    2. Generate two highly uncorrelated noise sequences using the secret key.

    3. Create a watermark mask using these noise sequences and the watermark as follows:


    +   * If the watermark bit is zero, then fill the mask with one type of noise
    sequence; otherwise, fill the mask with another noise sequence.


    +   * Repeat this procedure for all blocks of the host image.'
