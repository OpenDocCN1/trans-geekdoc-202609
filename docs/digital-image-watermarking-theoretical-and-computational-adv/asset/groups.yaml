    # 1.4 GENERAL FRAMEWORK OF DIGITAL WATERMARKING


    Digital copyright watermarking enables us to bring copyright violators to court,
    the embedded copyright mark in any legally published/sold image is retained and
    can be extracted in any copies. Digital image watermarking is a process of embedding
    a watermark into the image so to extract it at a later stage to detect ownership
    identity. Figure 1.2 shows a generalized block diagram of robust invisible image
    watermarking. The host is the digital image that has to be protected by inserting
    the watermark. The watermark can be a message/logo/statistical pattern inserted
    into the host that has some relevance to the host. The general framework of digital
    image watermarking and the copyright authentication process is composed of three
    major components: (1) the embedder,


    ![](img/2aafc43f8e3a22e17b338f7ddcb87be4_25_0.png)


    FIGURE 1.2 Generalized block diagram of digital image watermarking.'
  - '[PAGE 26]


    # 12 Digital Image Watermarking


    (2) the extractor, and (3) the correlator. The watermark may be encrypted before
    its insertion into the host image. In such cases, the extracted watermark has
    to be decrypted before it is compared to the original to make an assertion about
    ownership. All the components may be hardware units or software programs.


    The embedder (E) is a function of the host image (C), secret key (K), and one
    or more watermarks (W). The watermark W may be a random sequence or a meaningful
    message or image, as logo or copyright information. The embedder outputs a watermarked
    image (WC) such that WC=E (C, K, W). The produced watermarked image (WC) can be
    stored, transmitted, or published. The owner must extract the watermark in order
    to prove ownership. The watermark extraction process may may not be the inverse
    of embedding. The extractor function (D) accepts a secret key (K), test image
    (T), and/or the original nonwatermarked image (C) and original watermark (W) to
    detect the watermark (W'') that W''=D (K, T, C, W). The test image can be the
    watermarked image (WC), an attacked image (AC), a nonwatermarked image (C), or
    some other unauthorized image. The detected watermark (W'') is correlated with
    the original to obtain a similarity score if the similarity exceeds a predefined
    threshold indicating that the watermark is verified and it is authenticated. A
    public/private key is used in the embedding and extraction process to achieve
    confidentiality. The process involved in embedder/extractor and the inputs/outputs
    to these components vary depending on the type of watermarking and application.


