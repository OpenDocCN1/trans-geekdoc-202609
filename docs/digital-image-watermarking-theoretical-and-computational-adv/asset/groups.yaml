    ## Applied Examples and Future Prospectives


    WATERMARKS ARE MOST visible and found on currency, postal stamps, passports, bank
    notes, paper documents, etc. In the early days of invention, digital watermarking
    was limited to proving the copyright owner. Later, with the rapid use of the Internet,
    digital watermarking found its employability in a wide range of applications,
    such as e-advertising, e-delivery, e-governance, e-education, e-voting, military,
    covert communication, telemedicine, web publishing, digital forensics, digital
    library, robotics, hardware/chip protection, device control, legacy enhancement,
    media file archiving, computer programs, real-time audio/video, etc.


    Digital watermarking protects information and is capable of detecting illegal
    use of proprietary data. A robust invisible watermark is imperceptible information
    hidden intentionally by the owner into the host image so that the extraction of
    information at a later stage helps for various purposes, such as copyright protection,
    authentication, ownership proof, copy and usage control, fingerprinting, tamper
    detection/evidence, transaction tracking, and broadcast monitoring (Suresha and
    Swamy, 2012; Suresh et al., 2012, 2016).


