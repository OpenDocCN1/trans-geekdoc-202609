    $a_i(Y) \geq 0, \quad j = 1, 2, & , n;\nb_j(Y) = 0, \quad j = n+1, n+2, & , m
    \quad (3.1)$

    ```


    where:


    $Y$ is the vector of decision variables\na(Y) are the inequality constraints\nb(Y)
    are the equality constraints


    The optimization techniques are classified (Antoniou and Wu, 2007; Venter, 2010)
    based on:


    +   - Type of constraints: Constrained and unconstrained optimization problems

    - Nature of the equations involved: Linear, nonlinear, geometric, and quadratic

    - Nature of design variables: Optimal control and non-optimal control problems'
