    where Q is an orthogonal matrix (i.e., $Q^TQ=I$) and R is an upper triangular
    matrix. If A is nonsingular, this decomposition is unique. There are two important
    characteristics of a matrix obtained by QR decomposition (Wang et al., 2016):


    +   The value of the first row of elements of the R matrix is larger than that
    of the elements of another row, indicating that the first row has more energy
    and hence the R matrix determines the nature of the original image.'
