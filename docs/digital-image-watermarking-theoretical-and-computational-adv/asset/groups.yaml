    +   * Utilization of properties of RDWT and PSO to overcome some limitations of
    standard watermarking procedure such as manual selection of gain factor.


    +   * Decomposition of images of size $M \times N$ into its wavelet bands of each
    size $M \times N$. This allows embedding of large watermark in contrast to Thakkar
    scheme (Thakkar and Srivastava, 2017). The RDWT also eliminates the sampling process
    and overcomes limitations of DWT, including time shift variance.


    +   * Blind extraction of a watermark image (Fakhari et al., 2011; Run et al.,
    2012; Golshan and Mohammadi, 2013; Verma et al., 2016; Sanku et al., 2018).


    +   * The scheme is robust in nature and performs better than existing Thakkar
    scheme (Thakkar and Srivastava, 2017) in terms of imperceptibility and payload
    capacity.'
