    that are employed by digital image watermarking for optimum selection of parameters
    are discussed.


    # 3.1 OPTIMIZATION AND ITS APPLICATION TO DIGITAL IMAGE WATERMARKING


    Optimization is the science of identifying or choosing the best number among possible
    alternatives, after evaluating a number of possible solutions meeting one or more
    objective functions and associated assumptions (Powell, 1970). An optimization
    model can be defined as in Equation 3.1 (Venter, 2010):


    Objective function: minimize or maximize f(X)


