    Dr. Dey has authored or edited more than 40 books with Elsevier, Wiley, CRC Press,
    Springer, and others, and has published more than 300 research articles. He is
    the editor-in-chief of the International Journal of Ambient Computing and Intelligence
    (IGI Global). Dr. Dey is the series co-editor of Springer Tracts in Nature-Inspired
    Computing (Springer Nature), Advances in Ubiquitous Sensing Applications for Healthcare
    (Elsevier), and Intelligent Signal Processing and Data Analysis (CRC Press). He
    is an associate editor of IEEE Access.


    Dr. Dey’s main research interests include medical imaging, machine learning, data
    mining, etc. He was recently awarded one of India’s top 10 most published and
    cited academics in the field of computer science for the period 2015–2017.


