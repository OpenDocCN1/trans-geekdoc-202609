    # Watermarking Using Bio-Inspired Algorithms


    MACHINE LEARNING (ML) ALGORITHMS, such as support vector regression (SVR), support
    vector machines (SVM), fuzzy logic, neural networks, and deep learning, are widely
    used in digital image watermarking for watermark embedding or extraction purposes.
    These techniques provide computational intelligence in identifying optimum intensities/locations
    of the host image to be modified and optimal scaling factors to be used during
    watermark embedding. Though the selection of ML algorithms partially depends on
    the type and size of images and the required output, there is no one machine learning
    algorithm to fit all requirements of applications related to sensitive image watermarking;
    therefore, finding the right ML algorithm is just a trial-and-error method. The
    performance of invisible, robust digital image watermarking depends on the imperceptibility
    and robustness, which in turn depends on factors such as watermark size and gain
    factors/scaling factors/features/locations chosen for watermark embedding.'
