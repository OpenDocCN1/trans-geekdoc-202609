    2007; Ganic and Eskğlu, 2004）。对大小为 $M \times N$ 的数据应用 SVD 会得到三个矩阵：$U, V$ 和 $S$。$U$
    和 $V$ 是称为矩阵，大小为 $M \times N$；$S$ 是对角矩阵，大小为 $M \times N$。奇异矩阵在水印中起着重要作用，其元素按顺序排列，奇异值非常稳定。文献中存在多种基于
    SVD 的混合水印方法。在这些方法中，根据 DCT修改宿图像的奇异值。在鲁水印方法中，根据增益因子修改宿图像的奇异值。使用 SWT 时，对互不重叠的块进行修改以嵌入水印。在提取端，可以根据嵌入类型，使用秘密密钥和缩放因子以盲目或非盲的方式提取水印。基于
    SVD 的方法的局限性是它们仅适用于高对比度图像。


    ## 2.7 压缩感知与分解方法


    2005 年，人员引入了一种基于信号稀疏性的信号处理理论。该理论被称为压缩感知（CS）（Dono, 2006; Candes, 2006; Baraniuk,
    2007），其在水印中的应用通过为传统水印方法增加两个过程——基于 CS 的加密和解密来提供安全性。压缩感知应用于图像的必要条件是图像在其所在域内是稀疏的。因此，首先使用图像变换（如
    DFT、DCT、DWT 和 SVD）将水印转换为稀疏系数，以生成水印的稀疏系数。在嵌入前加密水印的缺点增加了计算时间。该技术主要用于多媒体数据的所有权认证和检测（Sheikh
    and Baraniuk, 2007; Valenzise et al., 2011; Zhang et al., 2009; Raval et al.,
    2011; Fakhr, 2012; Tiesheng et al., 2013; Thanki et al., 2017, 2018）。压缩感知理论可以在嵌入水印之前用于加密宿图像。


    QR 分解将矩阵分解为正交矩阵和一个三角矩阵。实数方矩阵 A 的 QR 分解表示为 $A = QR$，其中 Q 是正交矩阵（即 $Q^TQ=I$），R 是上三角矩阵。如果
    A 是非奇异的，则这种分解是唯一的。通过 QR 分解获得的矩阵具有以下两个重要特征（Wang et al., 2016）：


    - R 矩阵第一行元素的值大于其他行元素的值，表明第一行具有更高的能量，因此 R 矩阵决定了原始图像的性质。

