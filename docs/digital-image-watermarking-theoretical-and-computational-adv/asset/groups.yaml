    # 表 3.7 基于 FA 的数字图像水印算法对比


    | 参考文献论文 | 领域 + 采用的技术 | 检测类型 | 使用的相似性度量 | 适应度函数 |

    | --- | --- | --- | --- | --- |

    | Mishra 等人 (2014) | 变换 (DWT + SVD) | 非盲检测 | NC | $f = PSNR + \lambda \cdot \sum_{i=1}^{N}
    NC(w'', w_i)$ |

    | Dixit 等人 (2016) | 变换 (DWT + Schur) | 盲检测与系数比较 | NC | 未报告 |

    | Guo 等人 (2017) | 变换 (DWT + QR) | 盲检测与系数比较 | BER 和 SSIM | $f = [1 - SSIM(I, WT)]
    + \lambda \cdot \sum_{i=1}^{N} BER(w'', w_i)$ |

    | Swaraja 等人 (2016) | 变换 (DWT + SVD + Schur) | 盲检测与系数比较 | NC | 未报告 |

    | Imamoglu 等人 (2017) | 空间 | 盲检测 | 未报告 | 未报告 |


    *其中 $f$：适应度函数；$NC$：归一化相关；$corr$：相关；$BER$：比特错误率；$N$：攻击次数；$\lambda$：常数；$w^*$：恢复的水印图像；$I$：原始载图像；$w$：标记图像。


    FA 主要用于计算最佳缩放因子以及选择用于水印嵌入的最佳频率系数。


    ## 3.5 使用模拟退火算法 (SA) 的图像水印


    模拟退火 (SA) 是一种局部搜索优化算法 (Aarts 等，2003；Van Laarhoven 等，1987)，它基于退火现象，即退火是一种在热环境中寻找原子低能量状态的热力过程。该过程包含两个步骤：(1)
    提高热环境的温度到原子熔化的最大值；(2) 仔细降低热环境的温度，直到粒子排列成原子的基态条件，即原子的最小能量状态。只有当温度足够高且冷却足够缓慢时，才能获得该状态的值。M.
    Pincus 在 1970 年建立了退火过程与最优最小化之间的联系 (Pincus, 1970)。S. Kirkpatrick 在 1983 年针对组合问题提出了将退火过程作为一种优化技术
    (Kirkpatrick 等，1983)。基于 SA 的优化过程可以使用梅特洛夫算法 (Metropolis 等，1953) 来执行，该算法基于蒙特卡洛方法。梅特洛夫算法通过假设输入函数与多粒子系统之间存在类比来生成组合优化问题的最优解，其假设如下：(1)
    问题的求解等同于物理系统的状态；(2) 解的值等同于状态的“能量”。实现 SA 需要两个函数：(1) 一个在给定实际最优值时返回“接近”的邻域解的后继函数（该函数作为系统粒子的分布函数）以及
    (2) 一个用于优化的目标函数，取决于系统的当前状态。该函数作为系统的能量。SA 的主要优点是它可以避免陷入局部最优解 (Metropolis 等，1953)。该算法使用随机搜索方法，同时接受输入函数
    $f$ 的变化。该算法的最优值概率给出：


    ```

    $p = \exp\left(-\frac{\delta f}{T}\right) \quad (3.4)$

    ```


    其中，$\delta f$ 是输入函数的变化，$T$ 是控制参数，其类比于温度。


    SA 的实现非常简单 (Aarts 等，2003；Van Laarhoven 等，1987)。SA 的输入参数是可能的解、解的随机变化生成、评估问题函数的平均值、初始温度以及在搜索过程中降低温度的方法或规则。文献中仅有一项图像水印技术
    (Lin 等，2010) 可用，使用了 SA 来计算最佳缩放因子。


    ## 3.6 使用禁忌搜索 (TABU SEARCH) 的图像水印


    禁忌搜索 (TS) 算法基于一种旨在跨越可行性或局部最优边界的过程，而不是将其视为障碍 (Glover and Laguna, 1998)。该算法依赖于三个主要策略
    (Pham and Karaboga, 2012)；(1) 控制禁忌列表中值的禁止策略；(2) 控制禁忌输出列表的内容及其何时存在的冻结策略；(3) 管理其他策略之间相互作用以选择最佳轨迹解的短期策略。禁忌的限制是该算法中重要的例外之一。当一个禁忌具有足够的吸引力评估值，可以获得最佳最优结果时，禁忌的分类可能会被覆盖。这种条件称为愿望准则
    (Huang 等，2011)。


    在该算法中，首先从禁忌列表中选择一个初始解。然后生成解的子集，使得解违反禁忌条件，或至少满足一个愿望条件，并必须从子集中选择一个最优解。如果集合的适应度值小于子集的适应度值，则更新禁忌和愿望条件。如果满足停止条件，则算法终止。基于
    TS 的各种水印技术在文献中提出，在空间域中。


