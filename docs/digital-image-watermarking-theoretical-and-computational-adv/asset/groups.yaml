    presence of attacks (Wang, 2017).


    The PSNR given in Equation 1.3 is measured in decibels and depends on the mean
    square error (MSE), which is error between the original and watermarked image.
    The MSE is calculated using Equation 1.4:


    $$PSNR = 10 \times \log_{10} \left(\frac{255^2}{MSE}\right)$$


    $$MSE = \frac{1}{M \times N} \sum_{x=0}^{M-1} \sum_{y=0}^{N-1} (C(x,y) - WC(x,y))^2$$


