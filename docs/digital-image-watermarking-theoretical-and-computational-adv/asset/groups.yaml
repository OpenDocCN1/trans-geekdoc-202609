    # 作者


    Sureskha Borra 目前是印度班加罗尔 K. S. 学院的电子与通信工程系教授以及该学院首席研究协调员。她在印度海得拉巴德的贾瓦哈拉尔·内赫尔鲁技术大学获得图像版权保护领域的博士学位。她目前的研究兴趣包括图像和视频分析、机器学习、生物识别、生物医学信号和遥感感知。她已申请了
    1 项印度专利；出版了 6 本书籍、12 章书籍章节；并在同行评审和索引期刊上发表了多篇研究论文。她曾获得专业机构和印度卡纳塔克邦政府颁发的多项研究资助和奖励。她因在图像版权保护方面的贡献获得了“青年女性成就奖”，因在教学和学术活动方面的贡献获得了“卓越教育者与学者奖”，并因其卓越的研究和创新贡献获得了印度工程师协会（印度）颁颁的“女性成就奖”。


