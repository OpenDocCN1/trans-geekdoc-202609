    # 60 数字图像水印 ■ 74


    该率被称为接收者工作特征（ROC）曲线，用于视觉化二分类分类器的性能。


    ## 2.12 挑战


    水印方案为了保护多媒体数据、医学数据或生物识别数据的版权而嵌入水印。这些方案通过探索信号处理变换的各种属性来生成水印数据。每种水印方案都有其优缺点，且其性能可能随着不同宿主数据类型而变化。基于
    SVD 的水印方案结合 DWT 被广泛应用，并且比所有其他水印方案具有更高的透明度和鲁棒性。文献中的大多数水印都是对二进制水印进行盲提取完成的。鲁棒性低、安全性差、透明度不足以及在实际应用中接受度低被认为是许多水印方案的缺点。文献中缺乏可用的基准方案。此外，某些现有水印方案计算时间较长也是一个限制。关于水印有很多仿真工作，但关于变换水印的硬件实现工作较少。未来的研究工作可以关注这些主题。需要解决处理更通用的仿射变换和几何畸变的算法开发。需要寻找用于水印嵌入的变换不变域。


