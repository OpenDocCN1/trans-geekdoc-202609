    ## 2.8 基于 SCHUR 分解的水印


    Schur分解（Van Loan, 1996）当应用于实矩阵 $A$ 时，会产生两个矩阵 $U$ 和 $D$，使得 $A = U \times D \times
    U^T$，其中 $U$ 是正交矩阵，$D$ 是上三角矩阵。$D$ 矩阵对角线上有实特征值。这种分解大约需要 $8n^{3/2}$ 次计算操作，少于SVD分解所需的计算（约
    $11n^3$）。$U$ 矩阵的特征是前两列的所有元素具有相同的符号和数值。$U$ 矩阵的这一属性被用于水印的嵌入过程。因此，可以使用这种分解轻松设计盲水印方法。基于Schur分解的水印（Li
    et al., 2017; Rajab et al., 2015; Meenakshi et al., 2014; Razaafindradina et al.,
    2013; Gunjan et al., 2012; Mohammad, 2012; Su et al., 2012; Chaudhary et al.,
    2012; Mohan et al., 2011; Mohan and Swamy, 2010; Seddik et al., 2009）与所有其他水印方法相比具有较高的透明度，但实现起来更为复杂。


    ## 2.9 水印中的 HESSENBERG 矩阵因子


    Hessenberg分解（Van Loan, 1996）是一种矩阵分解方法。矩阵 $B$ 被分解为正交矩阵 $U$ 和Hessenberg矩阵 $H$，使得
    $U \times H \times U^T = B$，其中 $U^T$ 是正交矩阵的共轭转置。这种分解大约需要 $14n^{3/3}$ 次计算操作，高于Schur分解所需的计算操作，但少于SVD分解。Hessenberg矩阵因子用于水印是为了确保随机化过程是完全可逆的（Su
    and Chen, 2017; Singh et al., 2017; Su, 2016; Bhatnagar and Wu, 2013; Bhatnagar
    et al., 2010）。使用这种分解的水印实现较为复杂，研究人员探索也较少。


    ## 2.10 可见与不可逆水印


    可见水印是一种常用的水印方法，主要用于内容认证或所有权识别。在这种方法中，水印可见地叠加在宿主介质的部分区域（Biswas et al., 2013）。图2.4展示了使用现有技术生成的两个可见水印图像（Thanki
    et al., 2011, 2017）。可见水印的缺点是它们会给宿主图像带来退化。


    不可逆水印是水印的一种特殊情况。在接收端可以完全恢复原始宿主介质，这在传统水印中是不可能的。一般而言，任何不可逆水印都分三步实现：水印嵌入、水印提取和宿主介质恢复Lakshmi
    and Surekha, 2016; Chakraborty et al., 2014; Pal et al., 2013）。所有这些过程都需要密钥来确保水印的安全。图2.5显示了不可逆水印的框图。注意，在提取水印后，还有最后一步，即图像恢复。该算法的输入是水印图像，输出是原始水印。


    ![](img/2aaf43f8e3a2217b338457_0.png)

    图2.4 可见水印图像。


    ![](img/2aaf43f8e3a2217b338457_1.png)

    图2.5 不可逆水印的框图。


    ## 2.11 基于机器学习的图像水印


    传统水印的主要挑战是在感知性、鲁棒性、容量和安全性之间取得平衡。机器学习与水印相结合时，可以为权衡问题找到最优解。机器学习通过不同的分类和模式识别算法从输入数据中自动预测输出值，否则这是一个耗时的过程。机器学习从经验中学习来完成任务。


    监督学习模型基于已知输入输出预测未来输出。它们使用分类和回归方法来开发预测模型。常见的监督机器学习算法有决策树、支持向量机（SVM）、神经网络、朴素贝叶和线性回归。分类方法通常用于离散数据的预测，而回归方法用于模拟数据。无监督学习算法使用聚类方法对数据进行分类。


    人工神经网络（ANN）训练系统记忆特定场景，并根据所学内容对新输入产生输出。ANN基于人工神经元的连接和层（输入层、输出层以及多个隐藏层）来解决问题。基于神经网络的技术训练缓慢且容易导致过拟合，精度限于最小二乘误差。因此，更先进的机器学习算法如极速学习（ELM）、支持向量回归（SVR）和SVM被用于智能水印。这些算法克服了过拟合问题，性能优于基于梯度的学习算法。SVM和SVR通过将问题视为凸优化问题来估计高精度非线性函数，从而避免陷入局部最优解。


    最近机器学习的大部分工作转向使用概率神经网络（PNN），它由四层节点组成：输入层、模式层、求和层和输出层。PNN的训练通过生成模式节点、将其连接到目标类别的求和节点并将输入向量赋予权重向量来实现。PNN是一种监督学习网络，使用径向基函数和贝叶斯方法进行分类。

