    \n其中 Modified_LH、Modified_HL 和 Modified_HH 代表修改后的小波子带系数；LH、HL 和 HH 代表小波子带的原始系数；k1、k2\
    \ 和 k3 是优化的增益因子；Noise_Seq0 和 Noise_Seq1 分别对应于水印位 0 和 1 的噪声序列。\n\n- * 对宿图像的所有块重复该过程，以隐藏所有水印位。\n\
    \n- 6. 对修改后的小波子带同原始近似近似带一起进行单级逆 RDWT 变换，以获得带水印的图像 WA。\n\n## 6.2 提取算法\n\n水印提取的过程如下：\n\
    \n- 1. 将带水印图像/测试图像 WA 分解为 RDWT 小波子带：近似子带 LL 和细节子带（如 LH、HL 和 HH）。\n\n- 2. 将细节小波子带\
    \ LH、HL 和 HH 分为互不重叠的块。\n\n- 3. 考虑嵌入算法期间生成的互不相关的噪声序列，这些序列由图像所有者秘密保存。\n\n- 4. 根据公式\
    \ 6.3 和 6.4 定义的以下条件，从细节小波系数恢复水印位：\n\n```\nSeqA=corr2(Modified_LH,Noise_Seq0)\n\
    SeqB=corr2(Modified_HL,Noise_Seq0)\nSeqC=corr2(Modified_HH,Noise_Seq0)\nSeq0=(SeqA+SeqB+SeqC)/3\n\
    ```\n\n```\nSeqX=corr2(Modified_LH,Noise_Seq1)\nSeqY=corr2(Modified_HL,Noise_Seq1)\n\
    SeqZ=corr2(Modified_HH,Noise_Seq1)\nSeq1=(SeqX+SeqY+SeqZ)/3\n```\n\n- 5. 如果 Seq0>Seq1\
    \ 则将水印设置为 0，否则设为 1。\n\n- 6. 将提取的序列重构为矩阵形式以检测水印 w'\n\n## 6.3 仿真结果\n\n任何不可见水印方案的性能主要取决于增益因子的值。较大的增益因子会降低带水印图像的不可见性，但会提高恢复水印的质量，反之亦然。该算法使用的适应度函数是\
    \ PSNR 和 NC 值的函数，由公式（6.5）给出：\n\n```\nfitness = PSNR(C, WA)+(100*NC(w,w'))\n```\n\
    \n其中 PSNR 和 NC 分别代表峰值信噪比归一化相关。变量 $C$ 和 WA 表示宿图像和带水印图像，所提水印方案使用 PSO 算法获得的优化增益因子\
    \ $(k1, k2, k3)$ 如表 6.1 所示。所提方案的实验和对比分析考虑了三张灰度宿图像 Lena 和 Goldhill，尺寸均为 $512 \\\
    times 512$ 像素（图 6.2 a–c），并将一个 $64 \\times 64$ 像素的单色标志作为水印（图 6.2 d）。RDWT 子带被分为\
    \ 4096 个大小为 $8 \\times 8$ 的互不重叠块。插入宿图像的最大最大水印位数使用以下方程计算：\n\n```\n$Maximum\\Watermark\
    \ = \\frac{M \\times N}{Blocks^2} (6.6)$\n```\n\n其中 $M$ 和 $N$ 分别是宿图像的行数和列数。\n\n\
    所提方案可以嵌入 $64 \\times 64$ 像素的最大水印。对于给定的宿图像集，所提方案的最大负载是宿图像每 64 个像素 1 位。使用所提优化增益因子进行水印嵌入和提取的结果如如图\
