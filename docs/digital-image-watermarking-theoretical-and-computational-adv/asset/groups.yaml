    # 5.4 INDUSTRIAL AND MISCELLANEOUS APPLICATIONS


    Product designs and digital media are forms of intellectual property (IP) and
    are a result of valuable effort. Hence, mechanisms that protect the rights of
    IP producers and owners are in considerable demand and are of great interest.
    Physical layout designs that involve routing and placement, are very sensitive,
    and must be resistant to tampering, as any changes made to them lead to adverse
    effects on design productivity and on the market. Watermarking addresses IP protection
    by tracing unauthorized use, duplication, and tracking.


    Very often people scan their personal documents and identity cards and make digital
    copies before saving and carrying. Identity thieves constantly try to misuse personal
    data. Preparatory activities to thwart such attacks include encryption, digital
    signatures, access controls, and watermarking by companies issuing the identity
    cards.


    It is necessary that watermarking techniques applied to IP and identity card protection
    include features such as, invisibility, persistence, data integrity, robustness,
    enforceability, and security. Furthermore, the watermarking process should retain
    functional correctness and component protection with a minimal overhead cost.


