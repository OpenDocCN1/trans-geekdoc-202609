    # 3.2 IMAGE WATERMARKING USING GENETIC ALGORITHM (GA) AND GENETIC PROGRAMMING


    The genetic algorithm (GA) (Baranowski and Eugene, 2018; Dey et al., 2015; Chatterjee
    et al., 2018), which evolved from Darwin’s theory of natural evolution, is a direct
    search method and has the following advantages compared to traditional optimization
    methods:


    +   - GA works on multiple point searches, while the traditional methods work
    on single point search.

    - GA improves the global optimal value and provides more robustness.

    - GA does not use any auxiliary value of problem parameters.

    - GA is applicable to continuous or discrete optimization problems.

    - GA uses probabilistic transfer function while traditional optimization methods
    use deterministic transfer function.


    GA is suitable for unconstrained optimization problems but most of the problems
    are constrained in nature. As a first step, a constrained problem is converted
    into an unconstrained problem by adding an additional penalty function to the
    optimization problem based on the distance from the flexible region and number
    of'
