    嵌入器 (E) 是宿主图像 (C)、密钥 (K) 和一个或多个水印 (W) 的函数。水印 W 可能是一个随机序列，或有意义的消息或图像（如标志或版权信息）。嵌入器输出水印图像
    (WC)，使得 WC=E (C, K, W)。生成的水印图像 (WC) 可以存储、传输或发布。所有者必须提取水印以证明所有权。水印提取过程可能并不是嵌入的逆过程。提取器函数
