    \ 序列的使用由于其优异的相关性，允许对水印进行盲检测。这些方法利用 PN 序列将缩放后的水印以加法方式嵌入宿图像中（Langelaar et al., 2000;\
    \ Arena et al., 2000; Shoemaker, 2002）。由于这些序列的幅度较小，它们以一种不可感知的方式影响像素值。在需要时，使用种子生成随机序列，该种子作为密钥。一个序列用于插入水印位\
    \ 0，另一个用于水印位 1。通过以下步骤将水印插入宿图像中：\n\n- 1. 提取宿图像并将其划分为块。块的大小取决于水印和宿图像的大小。\n- 2. 使用密钥生成两个高度不相关的噪声序列。\n\
    - 3. 使用这些噪声序列和水印创建水印掩码，如下：\n  - 如果水印位为零，则用一种噪声序列填充掩码；否则，用另一种噪声序列填充掩码。\n  - 对宿图像的所有块重复此过程。\n\
