    2. 使用每个解执行水印并计算相应的适应度值。

    3. 将具有最佳适应度的解集存储为缩放因子的最优解。

    4. 通过莱维飞行获取新的杜鸟并与现有解进行比较。如果当前的杜鸟比之前的更好，则保留并更新最佳适应度值。

    5. 放弃一定比例 (Pa) 的劣解并产生新解。保留最优解并更新最佳适应度值。

