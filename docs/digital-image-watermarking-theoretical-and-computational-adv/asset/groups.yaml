    $$NVF = \text{NORM} \left( \frac{1}{1+\delta} \right)$$


    $\delta$ is luminance variance of the computed blocks. High values of PSNR and
    WPSNR indicate more imperceptibility. The robustness of any image watermarking
    scheme is high if NC and SSIM values are close to 1 (Wang, 2017). The NC and SSIM
    are calculated using Equations 1.7 and 1.8, respectively. While NC measures the
    correlation between original and extracted watermarks, SSIM measures the structural
    similarity between them.


    $$NC = \frac{\sum_{x=1}^{M}\sum_{y=1}^{N} w(x,y)\times w^*(x,y)}{\sum_{x=1}^{M}\sum_{y=1}^{N}
    w^2(x,y)}$$


    $$SSIM = \frac{(2\mu_{w}\mu_{w^*} + C_1)(2\sigma_{ww^*} + C_2)}{(\mu_{w}^2 + \mu_{w^*}^2
    + C_1)(\sigma_{w}^2 + \sigma_{w^*}^2 + C_2)}$$


    $C_1$ and $C_2$ are constants, $w$ and $w^*$ are the original and extracted watermarks,
    $\mu_w$ and $\mu_{w^*}$ are the means of the original and extracted watermarks,
    $\sigma_{ww}$ and $\sigma_{ww^*}$ represent the covariance of the original and
    extracted watermarks, and $N$ represents the number of windows.


    ## 1.7 ATTACKS ON WATERMARKS


    Although there are plenty of watermarking algorithms and tools available online,
    watermarking is still a challenging task when dealing with attacks (Wang, 1999).
    An attack, in watermarking terminology, aims to remove traces of the watermark
    to thwart authentication goals. Knowing the attack types and their analysis assists
    in identifying the best tool for a particular application in competing environments.
    Checkmark, Optark, and StirMark are some of the software that assess the robustness
    of developed watermarking tools (Borra et al., 2017). The attacks are generally
    categorized into removal, geometrical, cryptographic, protocol, and security attacks.


    - Removal attacks aim to remove watermarks from a watermarked image by intentionally
    performing image operations, such as quantization, lossy compression, averaging,
    modulation, demodulation, collision attacks, block replacement attacks, denoising,
    and filtering. It has been observed that to perform a modulation attack, the attacker
    first has to forecast the watermark using a variety of filters (median, high pass,
    and Wiener), then subtract it from the watermarked image, and finally add the
    Gaussian noise to it. This is commonly referred to as a collision attack. However,
    as a mosaic attack, the attacker splits the watermarked image into small portions
    and tries to reassemble it using a table, with the intention of removing the inserted
    watermark.


    - Geometrical attacks aim to distort the watermark rather than remove it by creating
    nonsynchronization among the extracted and original watermarks. The attackers
    try to crop the image from its sides or delete/edit/shift some rows or columns
    of pixels randomly with the intention of distorting the watermark. This creates
    synchronization problems while extracting the watermarks. It is common to apply
    a combination of attacks rather than a single attack. The common geometrical attacks
    are rotation, shearing, translation, affine transformation, scaling, aspect ratio
    changes, cropping, column/line removals, jitter, and random bending. Note that
    these attacks can be applied either locally or globally and in a systematic or
    random way.


    - Protocol attacks aim to create ambiguity of ownership by attacking the watermarking
    application itself, using the concept of invertible watermarks. Protocol attacks
    set another requirement for the design of watermarking tools: watermark extraction
    must be impossible from any images that are in fact not marked. Said another way,
    the false-positive rate must be a minimum. Also, protocol attacks take advantage
    of loopholes in the management or implementation process of watermarking.


    - Copy attacks aim to predict a watermark and replicate it on other data without
    knowledge of the secret keys involved. Also, development of image-dependent watermarks
    is the best solution to thwart these kinds of attacks.


    - Legal attacks attempt to create doubt in the technical evidence on watermarks
    while proving ownership in courts.


    - Cryptographic attacks envisage finding the secret keys by exhaustive searches.


    - Oracle attacks aim to generate the original image from watermarked image using
    watermark detector.


    - Disable attacks aim to break the relationship between the watermark and host
    without affecting the existence of the watermark.


    - Ambiguity attacks embed multiple watermarks in order to mislead the detector.
    In such cases, the order in which watermarks are inserted is ambiguous.

