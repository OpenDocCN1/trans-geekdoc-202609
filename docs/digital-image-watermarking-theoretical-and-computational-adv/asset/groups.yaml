    # Introduction


    AVARIETY OF DIGITAL INFORMATION, for example, pictures, recordings, melodies,
    and essential archives, is being published or exchanged between people, organizations,
    and associations every second. The digital content and online transmission of
    data are fast, less expensive, and easy to store and process, and result in high-quality
    transmission and distribution. On the flip side, new security-related problems
    have arisen, such as how to trust, identify, or authenticate the right owner/creator/correspondent,
    and how to confidentially and reliably protect the multimedia information/intellectual
    property (IP). With the illegal downloads, distributions, copying, and use of
    a variety of data, such as multimedia, web-published data, broadcast information,
    IP, and commercial designs, the creators/producers/authors/editors/distributors
    are experiencing great losses, and digital rights have become the need of the
    hour.


    This chapter discusses the importance of digital rights management (DRM) and copyrighting
    images, and reviews the techniques defined in DRM for securing the image data
    and corresponding owners. Also explained are the differences in the concepts of
    encryption, steganography, and digital image'
  - '[PAGE 16]


    # 2 ■ Digital Image Watermarking


    watermarking. The broad classification of copyright marking methods, the generalized
    digital image watermarking framework, its performance criteria and metrics, and
    image watermarking tools are presented.


    # 1.1 DIGITAL RIGHTS MANAGEMENT


    To reduce the losses caused by piracy, and to limit, prevent, identify, manage,
    use, manipulate, distribute, deliver, and measure the illegal actions as well
    as technological solutions, at every stage of online communication, from rules,
    data generation to consumption, a standardized set of rules, methods, and techniques
    are defined by the DRM systems globally. The DRM mainly deals with licensing agreements,
    data viewing, data access, copy protection, copy prevention, copy control, and
    technical protection when multimedia is stored or transferred across a variety
    of devices and networks. Many copyright laws and acts related to DRM, such as
    the Digital Millennium Copyright Act (DMCA), World Intellectual Property Organization
    Copyright Treaty (WCT), and European directive on copyright, are defined for control
    of copyrighted works, which are not globally accepted (Vellasquez et al., 2010;
    Surekh and Swamy, 2014). The DRM defines an open standard that discusses the issues
    and requirements related to universal multimedia access (UMA), such as access
    control, which include user identification, level of access, copy control, the
    creation of unauthorized copies, the detection of illegal distribution and tracking,
    the prevention of users from modifying the content, secure storage and transmission
    using algorithms and protocols, renewability, and interoperability.


    The DRM aims to prevent unauthorized access, copying, and redistribution of digital
    media by encrypting the data and not making it directly accessible (Mohanty et
    al., 2017). The DRM can be referred to as the extension to digital media copyright,
    though both have different objectives and regulations. The DRM recommends key-based
    encryption and watermarking algorithms, along with some security protocols for
    ensuring'
  - '[PAGE 17]


    # Introduction ■ 3


    confidentiality, authentication, copy control, and data integrity. The key management
    plays a crucial role and has a challenging task in providing security as the working
    of algorithms is made open (Borda, 2005). Key generation, verification, secure
    storage and transfer, revocation, and key escrow are all of key management. The
    usage of biometrics as secret keys helps in overcoming key exchange problems.


    Cryptographic techniques are used to make the content unintelligible using encryption
    keys and algorithms, before its storage/publication/distribution (Thanki and Kothari,
    2017). The person/device having knowledge of the decryption key is allowed to
    access and decrypt completely or partially the protected data upon checking his
    or her authorization and user rights. Encryption, which comes first in DRM, ensures
    access control and authentication of users or content. A limitation of encryption
    is the fragility of ciphertext, implying that it is impossible to decrypt content
    if the ciphertext is modified even partially. Random access of scalable/multiresolution
    data is also not possible when data is encrypted. Further, once the data is converted
    back to its original form authorized for users, the cryptographic techniques fail
    to protect the ownership claims, creating an analog hole. In addition, high computational
    costs for encryption and decryption majorly limit its application in real time.


    A digital signature, on the other hand, is a message-dependent data string that
    is appended to the original message using encryption techniques. The objective
    is to guarantee the data integrity and overcome attacks related to nonrepudiation.
    A digital signature can easily be removed and can be made invalid by changing
    the file content (Petrovic et al., 2006). Steganography and watermarking techniques
    address these problems (Langelaar et al., 2000; Thanki and Kothari, 2017; Thanki
    et al., 2017, 2018). Steganography is a kind of one-to-one secret communication
    technique that modifies a multimedia file to hide and detect the secret message,
    by authorized personnel only (Hartung and Kutter, 1999; Langelaar et al., 2000).
    While both steganography and encryption ensure'
