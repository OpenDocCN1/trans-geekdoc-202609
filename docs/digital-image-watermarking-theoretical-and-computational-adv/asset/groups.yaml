    +   - Permissible value of the design variables: Integer and real-valued


    +   - Number of objective functions: Single-objective and multi-objective


    +   - Nature of problem: Deterministic and Stochastic Optimization problems


    There are many approaches to find minima (local/global) other than gradient descent:
    (1) approximation methods (polynomial interpolation), (2) search methods (Dichotomous,
    Fibonacci, Golden-Section), (3) combination of (Davies, Swann, and Campe Algorithm),
    etc. The performance of the optimization algorithms is verified by collecting
    the mathematical convergence proofs and by testing over the benchmark problems.
    such as random jumps, random walks, and simulated annealing, are quite inefficient,
    but can be used in initial stage to find the promising starting point and local
    minima and can be applicable to even non-differentiable functions; however, the
    results of random search methods are not repeatable. Other methods such as Nelder
    and Mead simplex method (Nelder and Mead, 1965), Powell''s conjugate direction
    method (Powell, 1970) and cyclic coordinate search can be used as alternatives.
    The trend now is to use biologically inspired methods to get better accuracy in
    finding global minima, though they are complex. The algorithms covered in this
    chapter are:


    +   - Genetic algorithm (GA)


    +   - Genetic programming (GP)


    +   - Ant colony optimization (ACO)


    +   - Differential evolution (DE)


