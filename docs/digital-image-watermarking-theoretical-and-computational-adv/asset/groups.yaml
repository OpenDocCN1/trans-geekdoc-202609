    \ W(x,y) \\quad (2.1)$$\n```\n\n其中 $WI(x, y)$ 代表水印图像，$I(x, y)$ 代表宿图像，$k$ 代表增益因子，$W(x,\
    \ y)$ 代表水印掩码。\n\n使用以下步骤从带水印的数据中提取加法水印：\n\n- 1. 将带水印的数据划分为块，保持块的大小与 PN 序列的大小相同。\n\
    - 2. 计算带水印数据的每个块与每个噪声序列之间的相关性。\n- 3. 使用以下两个条件提取水印：\n  - 如果对应噪声序列 1 的相关性结果高于对应噪声序列\
    \ 0 的相关性结果，则将水印设为 1。\n  - 否则，将水印位设为 0。\n- 4. 对带水印图像的所有块重复此过程以提取水印。\n\n## 2.2.6\
    \ 其他空间域水印技术\n\n在加法水印技术中，水印块被顺序选择以隐藏水印位，因此对许多攻击不具健壮性。在基于扩展谱的水印技术中，水印位是随机分布的，甚至可以反复嵌入整个宿图像中，以增加安全性和对攻击的健壮性。基于局部二值模式（LBP）的水印长于抵抗光照变化和对比度变化。宿图像被分为不重叠的区域。区域内的每个像素都与中心像素进行比较，产生一个二值矩阵，该矩阵进一步用于水印嵌入。由于基于\
    \ LBP 的方法只能抵抗少数攻击，其应用仅限于脆弱性水印。水印甚至可以通过修改或移动图像的局部或全局直方图来隐藏，而不影响其形状。然而，这些方法仅支持较小的水印。\n\
