    ## 4 数字图像水印


    隐写术确保了没有人知晓实体正在进行秘密通信，因此它适用于版权标记。相比之下，水印一直是一对多通信的一部分，被用于验证多媒体文件的所有者（Vellasques
    et al., 2010）。


    虽然隐写术的目的是保护隐藏信息，但水印的目的是保护宿文件免受所有权/复制冲突。水印代表了文件的作者/所有者/购买者（Dew and Santhi, 2017;
    Borra et al., 2017, 2018）。与在文件末尾添加签名以确保作者身份（数字签名）不同，水印是将水印嵌入文件本身，从而保证了作者身份和数据完整性（Sherekar
    et al., 1999）。加密的目的是为了保护文件（机密性），而水印则试图保护数字文件的所有权（真实性）。一旦数据被解密，加密就无法进行复制控制，而水印即使在解密后仍能保护并控制复制控制数据（Borda,
    2005; Sherekar et al., 1999）。


    ## 1.2 数字图像水印


    图像往往容易被盗窃和版权侵权。在许多情况下，图像从网站被盗用用于用途/名声/财务利益，而正义未能伸张，导致所有者/发明者的损失。因此，需要识别并保护其所有者免受对手侵害的机制（Vellasques
    et al., 2010）。在数字时代之前，画家/摄影师/组织通常用签名、缩写或假名/印章对他们的艺术品/照片/设计签名，以帮助识别自己为图像的所有者，特别是在知识产权需要共享的情况下。水印是所有者对其图像进行签名并破坏攻击者努力的另一种方法。水印是放置在图像上的叠加图像/标志/文本，旨在识别图像的所有者。可见且相对容易复制的模拟水印已存在几个世纪。这些水印最早用于造纸厂，后来出现在货币和邮票上。


    作为数字版权管理（DRM）系统的一部分，数字水印提供了在图像中表示/记录/隐藏版权所有者/分销者/分销链/购买者的机制，旨在为版权保护和法律执法案件提供证据（Mohanty
    et al., 2017）。存储/编辑/传输过程中的某些操作可能会扭曲、删除或以其他方式干扰水印。只有在水印技术达到令人满意的成熟程度，并通过标准化保证最低质量水平以及可证明的鲁棒性和安全水平后，通用接受和部署才成为可能。考虑到这一点，显而易见，我们正处于采用水印技术的中间阶段，致力于构建有效水印系统。


    ## 1.3 版权分类


    数字图像版权标记技术可以分为许多类，如图1.1所示。分类时考虑了多种参数，例如要保护的图像类型、版权标记类型、嵌入域、标记的可感知性、原始文档的可逆性、版权标记的目的/应用、其用途以及版权验证时所需的密钥和数据类型。根据应用，要保护的宿图像可以是二值/半色图像、灰度/彩色图像、医学图像或高光谱图像。水印可以是随机二进制模式、信用卡号、图片、所有者的签名-标志、宿图像源或内容相关数据，所有这些都可以识别所有者/公司的版权信息。指示性水印通常是具有平滑/尖锐细节的二值。它们还可能包含一些文本信息。统计水印是通过不同的噪声生成的，例如伪随机噪声（PN）和白高斯噪声（WGN）。从这些噪声生成的二进制随机序列通常与水印相乘以生成统计水印。生成统计水印模式的另一种方法是使用补丁法，其中通过假设检验将宿图像中的像素差异与参考值进行比较。


    ![](img/2aafc43f8e3a22e17b338f7ddcb87be4_20_0.png)


    图 1.1 数字图像版权标记技术的分类。


    根据人类感知性，版权标记可以是不可见的/可见的/双重性的。可见水印作为标志嵌入在图像角处，警告内容的版权和所有权以进行内容保护（Qasim et al.,
    2018）。在图像中心放置可见水印可以防止剪裁，但会影响质量且不会让观众感到愉悦。今天，也可以使用机器学习技术将可见水印智能地放置在宿图像上，而不影响质量。不可见标记主要为法医/调查目的而设计，因为它们根据秘密密钥不可见且随机地放置在图像的任何像素位置或频率系数上。当需要身份验证、所有权验证或数据完整性校验时，可以相应地恢复它们。某些应用嵌入了不可见和可见水印以提高安全性。不可见标记有四种类型：鲁棒、半脆弱、脆弱和混合技术（Qasim
    et al., 2018）。


    脆弱性标记将标记嵌入图像中不可察觉的部分，如果图像发生修改，标记将被破坏。实现脆弱性标记的简单方法是确保宿图像未被篡改并维护数据完整性。脆弱标记可以很容易实施和移除，不适用于证明所有权，但它们作为图像被修改的证据有用。半脆弱方法在鲁棒性方面受到限制，设计用于在授权的操作生存（如压缩）。由于这些方法区分了某些操作set，它们也被用于检查完整性。另一方面，混合方法是鲁棒和脆弱方法的结合，以实现更高水平的安全性，因为它们并行地实现所有权保护、数据完整性和身份验证（Qasim
    et al., 2018）。


    鲁棒标记在安全应用中更受青睐，例如复制控制、广播监控和版权保护，因为这些标记能够抵抗广泛的攻击（Qasim et al., 2018）。鲁棒标记将标记嵌入在图像的重要部分，即使在图像发生修改/扭曲时，标记也不会被破坏，例如压缩、缩放、重采样、模拟转数字（A/D）和数字转模拟（D/A）转换、加性噪声、线性及非线性滤波、平移、剪裁和旋转等。由于相互冲突的需求（如隐藏能力、透明度和鲁棒性）之间的权衡，鲁棒标记技术的设计非常复杂且具有挑战性。尽管生存程度取决于应用，但理想目标是设计一种标记系统，使得只有通过破坏宿图像才能移除标记，这对于保护医学领域和国防相关的敏感图像非常有用（Dey
    et al., 2017; Biswas et al., 2013）。根据要保护的实体，鲁棒标记主要有两种类型。水印识别文件的版权所有者，而指纹识别识别允许/分发/非法复制宿图像的授权客户和/或违反许可协议。除非另说明，鲁棒水印是不可逆的。一种特殊类别可逆水印被设计为无损，因为这些标记是可逆的，原始水印可以恢复和或提取。另一方面，零水印在水印隐藏过程中不会影响宿图像的质量。


    水印检测本身是许多输入的函数，例如测试图像、私钥或公钥、原始水印和原始宿图像。非对称/公钥水印允许所有者之外的任何人提取水印，通过限制移除水印的权限。另一方面，为了证明图像的所有权，使用私有水印，因为它们只能通过密钥进行检测（Mohanty
    et al., 2017）。


