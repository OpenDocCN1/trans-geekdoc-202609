    private key using the additive watermarking approach. After modified DFT coefficients
    are obtained, inverse DFT is applied to obtain the watermarked image. In the extraction
    process, the inverse process of watermark embedding is followed to recover the
    watermark from the watermarked image. This approach can be designed to be non-blind
    and can use encryption techniques, such as Arnold scrambling, for securing the
    watermark.


    An alternative approach to using DFT is to divide the host image into nonoverlapping
    blocks. Then DFT is applied on blocks of the host image to obtain DFT coefficients,
    which are modified according to PN sequences and watermark bits. The inverse DFT
    is applied on modified blocks of the host image to obtain the watermarked image.
    At extraction, correlation between PN sequences and DFT coefficients of blocks
    of the watermarked image is performed to extract the watermark. This is a blind
    approach and provides better robustness than the first approach. Many watermarking
    approaches that combine DFT with other transforms, such as DCT and DWT, have been
    developed to improve the imperceptibility and robustness of watermarking (Ansari
    et al., 2012). DFT-based watermarking is robust to geometric attacks such as RST.
    The drawback is that the data is represented in a complex form and hence provides
    fewer transients for watermarked data.


