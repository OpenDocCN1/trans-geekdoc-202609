  mdcn: "\n\n# 硬件实现 117\n\nLSB 替换技术的硬件实现包括在 PC 上的仿真、使用仿真工具以及在硬件板上进行水印嵌入和提取。仿真用于图像的读取、存储和显示。硬件板负责将水印插入主图像中，并输出带水印的图像以供\
    \ PC 显示或存储。目前已有使用各种硬件板和技术对这些技术实现的实现（Vinh and Koo, 2017; Shet et al., 2017; Rajagopalan\
    \ et al., 2014; Samanta et al., 2008; Nelson et al., 2005; Garimella et al., 2004;\
    \ Garimella et al., 2003），并在表 4.1 至 4.8 中根据使用的板卡和平台、时钟频率、功耗、实现的最大 PSNR (dB) 以及支持的主图像类型对其进行了比较。\n\
    \n加性水印方法在利用线性反馈移位寄存器（LFSR）将缩放后的水印以加法方式嵌入主图像时，利用了伪随机噪声（PN）序列（Shih, 2017）。这些序列由于幅度较小，能够以一种不可察觉的方式影响像素值，因此被首选。这些随机序列使用种子生成，种子作为密钥。加性水印技术在不可忽略性和鲁棒性方面表现良好。如果噪声强度增加，提取出的水印的视觉质量就会下降。此外，该技术的载荷容量较小，无法为彩色水印获得满意的工厂结果。\n\
    \n在加性水印技术中，水印块被顺序选择用于隐藏水印位，因此它们不受攻击。在基于扩频（SS）的水印技术中，水印位随机分布在整个主图像中，以增加载荷容量并提高抗攻击的鲁棒性。SS\
    \ 技术是安全、不可见且鲁棒的。然而，当增益因子增加时，水印数据的视觉质量会下降。\n\n可逆水印技术为在不丢失主数据的情况下提取数据提供了一种解决方案，除了认证\n\
