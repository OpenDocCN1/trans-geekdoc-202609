    # 26 Digital Image Watermarking


    noise, while maintaining transparency and security is required for copy control,
    transaction tracking, and proof of image ownership. For three decades researchers
    and developers have been developing algorithms, architectures, and systems in
    this area to gain the best results.


    This chapter discusses various conventional and machine learning (ML)–based digital
    image watermarking algorithms and compares some recent works to define the challenges
    to be considered for future research. The chapter starts with spatial domain-based
    watermarking approaches, followed by transform domain techniques, and ends with
    advanced watermarking techniques that rely on the concept of ML algorithms.


    ## 2.1 INTRODUCTION


    In today’s e-era, which mainly includes e-commerce, e-banking, e-health, and e-learning,
    information can be effectively downloaded without authorization from the proprietor.
    Once in a while, these circumstances create issues, for example, copyright security
    and proprietor verification. In such cases, assurance and verification of advanced
    information is required before it is exchanged over an open-source transmission
    medium. To address these issues, analysts have proposed different information-concealing
    strategies: cryptography, steganography, and watermarking. Watermarking is primarily
    utilized for the assurance and validation of information. This method beats the
    constraints of steganography by embedding a watermark into host content such that
    even the basic client cannot find the hidden watermark (Borra and Lakshmi, 2015).
    As discussed in Chapter 1, the watermarking framework has three components: a
    watermark embedder; a correspondence channel, which might be wired or wireless;
    and a watermark extractor. The watermark embedder embeds a watermark into host
    images to generate a watermarked image, while the watermark extractor extracts
    the watermark from the test image, which can be the watermarked image with without
    attacks.


    The major requirements of digital image watermarking are recalled here:


    - 1. Robustness: The watermarking technique must protect owners'' data against
    any manipulations and has to be robust.

    - 2. Imperceptibility: After insertion of the watermark into host data, the visual
    quality of the host data should not be affected much; that is, the watermark should
    not be perceptible.

    - 3. Embedding capacity: The watermarking technique should allow hiding of large
    watermarks (Banerjee, 2015).


    The watermarking techniques are major developed in two processing domains: the
    spatial domain and transform domain (Borra and Lakshmi, 2015). The spatial domain
    techniques are easy to implement but provide less imperceptibility as the host
    image pixels are directly modified. Transform domain watermarking is complex but
    provides more robustness than spatial domain watermarking. In all the transform
    domain techniques, the host image is converted into the frequency domain using
    various discrete cosine transform (DCT), and discrete wavelet transform (DWT)
    (Dey et al., 2012), before watermark embedding, and later the image is inverse
    transformed. The framework for conventional digital image watermarking schemes
    is shown in Figure 2.1. In spatial domain watermarking, the host image is modified
    directly by changing the least significant bits (LSBs) or adding various noise
    sequences. In transform domain watermarking, the watermarks are embedded into
    either selected domain coefficients (Hartung and Kutter, 1999; Bender et al.,
    1996; Surekha and Swamy, 2011; Ashour and Dey, 2017; Thanki and Kothari, 2017).


    The preprocessing of host images before watermark embedding helps us extract better
    features for watermark embedding and results in better performance.


    ![](img/2aafc43f8e3a22e17b338f7ddcb87be4_42_0.png)


    FIGURE 2.1 Framework of conventional digital image watermarking.


    Normalization, segmentation, and feature extraction are common preprocessing techniques.
    Normalization of an image leads to robustness to illumination changes and scale
    variances. Segmentation and feature extraction result in achieving high robustness
    to intentional attacks, such as geometric variations. Techniques such as Gaussian
    mixture model (GMM), expectation maximization (EM), mean-shift segmentation, Mexican
    wavelet scale interaction, scale-invariant feature transform (SIFT), and difference
    of Gaussians (DoG), can be employed to resist attacks, which include rotation,
    translation, scaling, low-pass filtering, median filtering, Gaussian noise, aspect
    ratio changes, and JPEG compression. The detection and/or verification of a watermark
    refers to the process of making a binary decision (presence/absence of a particular
    watermark) at the correlator about the authentication of the rightful owner.


    ## 2.2 WATERMARKING IN THE SPATIAL DOMAIN


    Spatial domain techniques support embedding high-capacity watermarks. This section
    discusses a variety of techniques.


    ### 2.2.1 Least-Significant-Bit Substitution Technique


    The LSB substitution technique is a basic watermarking technique where bits of
    host data are modified (Lee and Chen, 2000; Chan and Chen, 2004; Ramalingam, 2011).
    In any 8-bit image, the most significant plane (i.e., bit plane 7) contains the
    most information, while the least significant plane (i.e., bit plane 0) contains
    no visual information. Therefore, the least significant plane is chosen for watermarking
    purposes. For example, to embed 8-bit watermark into color image, the watermark
    bits are divided into groups. The first group is inserted into the LSBs of R channel
    and G channel, the second group into the B channel. Then, these channels are combined
    to generate the watermarked image. The main advantage of this technique is that
    after watermark embedding, the visual quality of host data is not affected; an
    average individual cannot see or observe the modifications. The limitation of
    this technique is that watermarks embedded this way are fragile.


    ### 2.2.2 Patchwork Technique


    Patchwork (Bender et al., 1996) uses some statistics to generate random patterns,
    which are embedded into the host image (Durvey and Stayarthi, 2014; Soman, 2010)
