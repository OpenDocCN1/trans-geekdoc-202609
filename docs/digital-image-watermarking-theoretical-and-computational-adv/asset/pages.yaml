  md: '# Advanced Watermarking Techniques ■ 29


    (Sureskha and Swamy, 2012a,b). This section discusses a variety of spatial domain
    watermarking techniques.


    # 2.2.1 Least-Significant-Bit Substitution Technique


    The LSB substitution technique is a basic watermarking technique where less important
    information or bits of host data are modified by the watermark. In the LSB technique,
    most significant bits of the watermark are substituted in the LSBs of the host
    data (Lee and Chen, 2000; Chan and Chen, 2004; Ramalingam, 2011). In any 8-bit
    image, the most significant bit plane (i.e., bit plane 7) contains the most important
    visual information, while the least or significant bit plane (i.e., bit plane
    0) contains no visual information. All other bit planes contribute to various
    levels of information related to the image. Therefore, the least significant bit
    plane of the image is chosen for watermarking purposes. For example, to embed
    an 8-bit gray watermark into a color image, the gray watermark bits are divided
    into groups of 3 bits, 3 bits, and 2 bits. The first two group''s bits can be
    inserted into the three LSB bits of the R channel and G channel. The group of
    2 bits can be inserted into the two LSB bits of the B channel. Then, these three
    channels are combined to generate a watermarked color image. The main advantage
    of this technique is that after the watermark embedding process, the visual quality
    of the host data is not much affected by the watermark. Hence, under normal conditions,
    an average individual cannot see or observe the modifications in the host image
    where the watermark is inserted. The payload capacity of this technique is almost
    100%. This technique is mainly used for copyright authentication of multimedia
    data. The limitation of this technique is that watermarks embedded in this way
    are fragile in nature.


    # 2.2.2 Patchwork Technique


    Patchwork (Bender et al., 1996) uses some statistics to generate random patterns,
    which are embedded into the host image (Durvey and Stayarthi, 2014; Soman, 2010)
    to provide robustness'
  merge: -1
  img_proc: true
