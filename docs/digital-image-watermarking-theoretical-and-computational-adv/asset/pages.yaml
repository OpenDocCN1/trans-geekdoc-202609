- pgno: 53
  md: '# Advanced Watermarking Techniques ■ 39


    Mansouri et al., 2009; Santhi and Thangavelu, 2009; Rajab et al., 2008; Dili and
    Mwangi, 2007; Ganic and Eskicioğlu, 2004) is a numerical technique based on linear
    algebra and is used to diagonalize matrices in numerical analysis. There are several
    areas where SVD finds application. The application of SVD to digital data of size
    $M\times N$ results in three matrices: $U, V,$ and $S$. The $U$ and $V$ matrices
    are called unitary matrices and have size $M\times N$. The $S$ matrix is called
    a singular or diagonal matrix and has size $M\times N$. The singular matrix plays
    an important role in watermarking; entries in this matrix are arranged diagonally
    and in ascending order. The singular values are very stable; hence, if a small
    change is made in the value of host data, its singular values do not undergo any
    significant change.


    Various types of SVD-based watermarking methods are available in the literature.
    In these methods, selected singular values of the host image are modified by watermarking
    using a gain factor. In direct modification of the singular values method, SVD
    is applied to nonoverlapping blocks of the host image to obtain a set of singular
    values that can further be modified using methods similar to DCT/DWT watermarking.
    This method is widely used by researchers as it allows embedding of any type of
    watermark, such as binary, grayscale, and color. This method shows robustness
    to many attacks and, when used with DWT, provides higher transparency.


    Another distinct approach is to make use of the second and third rows of the first
    column of the $U$ matrix, which are close in value, for watermark embedding (Thakkar
    and Srivastava, 2017; Su et al., 2013). In this approach, the two values of the
    $U$ matrix are modified according to a gain factor and watermark bits to blindly
    extract the watermark by just comparing them. If the comparison results of these
    two values are higher than the predefined threshold, then the watermark bit is
    set to 1; otherwise, it is set to 0. This method is robust to many attacks and
    is a blind approach. The limitation of this method is that it can embed binary
    watermarks. The drawback of SVD-based methods is that they are applicable only
    to symmetric data or high-contrast host images.'
