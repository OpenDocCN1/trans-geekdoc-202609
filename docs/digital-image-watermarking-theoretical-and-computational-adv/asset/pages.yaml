    # 3.4.3 Image Watermarking Using Particle Swarm Optimization


    Particle swarm optimization (PSO) algorithm is based on the social behavior of
    the schooling of fish/flocking of birds. Initially, a class of particles is generated
    randomly and then the optimal value is calculated using an iterative search method.
    A velocity vector as well as position vector is calculated for each particle at
    every iteration followed by local best fitness value and global best calculations.
    The best particle from all the local best particles gives the global optimal particle.
    The basic steps of PSO algorithm are listed as follows (Chakraborty et al., 2013):


    +   1. Generate N number of initial particle positions randomly within a specific
    range.


    +   2. Find the local best solution of each particle by applying the initial value
    of the particle to watermark the image and extract the original image.'
