    # 3.3 IMAGE WATERMARKING USING DIFFERENTIAL EVOLUTION (DE)


    Differential evolution (DE) is based on stochastic population (Storn and Price,
    1997) and follows the basic flow of genetic algorithm with some difference in
    mutation and selection operations. Only two parameters, mutation factor and probability
    of crossover, are required to tune the algorithm. DE selects random vectors and
    then takes difference of the vectors. The mean of the vectors'' difference is
    taken as parent vector with a special operator in searching space. The main difference
    between DE and GA is that mutation operation automatically takes increments to
    the best optimal value based on the evolutionary process stage. A few features
    of DE are as follows:


    +   1. DE is rarely used for solution of local optimization as it searches for
    the global optimal solution by manipulating a class of objective functions and
    searches multiple areas within the search space.


    +   2. DE is mainly used for solving optimization problems with non-smooth input
    functions.


    +   3. DE allows for floating-point input data, manipulated data, and output data.


    +   4. DE uses arithmetic operation for searching of space.


    +   5. DE is not usable for large sized data.


    In DE, the optimal solutions are represented in terms of floating-point numbers.
    The mutation operation is also different from GA. The weighted difference between
    two parent strings is added with a third string to generate the optimal solution,
    followed by a crossover operation to combine the optimal solution of the mutation'
  merge: -1
  img_proc: true
- pgno: 95
  md: '# Watermarking Using Bio-Inspired Algorithms ■ 81


    operation with the optimal target solution. Then, a selection operation is applied
    to compare the fitness function value of operations, the target solution, and
    the trail solution to decide which solution is to carry forward in the next stage.
    The basic DE algorithm has four steps: (1) initialization of class, (2) crossover
    operation, and (4) selection operation. The main advantages of DE are that it
    is easy to implement, requires fewer parameters, and has faster convergence compared
    to GA or GP. The main limitation of this algorithm is that its performance may
    be affected by noise due to its greedy nature. Table 3.2 compares various DE-based
    digital image watermarking techniques with respect to their fitness functions,
    embedding domain, and type of watermark detection.


    The watermarking approaches based on DE are mainly implemented singular value
    decomposition (SVD) in transform domain (Ali et al., 2014a; Aslantas, 2009). The
    performance of each watermarking technique depends on the nature of the host image,
