- pgno: 131
  md: '# Hardware-Based Implementation ■ 117


    The hardware implementation of the LSB substitution technique includes a simulation
    on a PC, using simulation tools and watermark embedding and extraction on a hardware
    board. The simulation is used for reading, storing, and displaying images. The
    hardware board performs watermark insertion into the host image and outputs watermarked
    images for display or storage on a PC. Implementation of these techniques using
    various hardware boards and technology is available (Vinh and Koo, 2017; Shet
    et al., 2017; Rajagopalan et al., 2014; Samanta et al., 2008; Nelson et al., 2005;
    Garimella et al., 2004; Garimella et al., 2003), and they are compared in Tables
    4.1 through 4.8, in terms of board and platform used, clock frequency, power consumption,
    maximum PSNR (dB) achieved, and type of host image supported.


    Additive watermarking approaches exploit the usage of the Pseudo-Random Noise
    (PN) sequences when embedding the scaled watermarks in an additive fashion using
    Linear Feedback Shift Registers (LFSR) to the host image (Shih, 2017). These sequences
    are preferred as they can affect the pixel values in an imperceptible way due
    to their low magnitudes. These random sequences are generated using a seed, which
    acts as a secret key. The additive watermarking techniques are good at imperceptibility
    and robustness. If the strength of noise increases, the visual quality of the
    extracted watermark decreases. Furthermore, the payload capacity of this technique
    is less and cannot obtain satisfactory factory results for color watermarks.


    In additive watermarking techniques, the watermark blocks are selected sequentially
    for hiding watermark bits, and hence, they are not secure from attacks. In SS-based
    watermarking techniques, the watermark bits are randomly scattered throughout
    the host image in order to increase the payload capacity and improve their robustness
    against attacks. SS techniques are secure, imperceptible, and robust. However,
    the visual quality of watermarked data degrades when the gain factor increases.


    Reversible watermarking techniques provides a solution for the extraction of host
    data without a loss besides the authenticating'
