- pgno: 9
  md: '# Preface


    IN THE ERA OF THE INTERNET, copyright protection of digital images plays an important
    role in web publishing, videos, online advertising, online repositories, libraries,
    and so forth. Digital watermarking techniques have proved to be an effective way
    to resolve rightful ownership by embedding a watermark visibly or invisibly in
    the image, in such a way that the owner is able to detect and extract it using
    a secret key. While there are various spatial and frequency domain watermarking
    techniques that have been developed in the past three decades, optimization is
    a commonly encountered mathematical problem in all engineering disciplines, including
    data security. The research on new embedding implementations, machine learning,
    and bio-inspired algorithms for image watermarking is on the rise. This book presents
    advanced designs and developments in image watermarking algorithms and hardware
    implementations with a special focus on optimizing methods.


    This book introduces state-of-the-art watermarking techniques that have been developed
    in various domains, along with their optimization techniques and hardware implementations.
    The book also presents comparative analysis of more than a hundred watermarking
    techniques. Further, it covers the applications, difficulties, and challenges
    faced by such algorithms, as well as future directions for research.'
  merge: -1
  img_proc: true
- pgno: 10
  md: 'The book is composed of six chapters, which accomplish the following:


    +   - Provide a broad background of image watermarking

    - Provide an overview of newly developed machine learning-based watermarking techniques
    in various independent and hybrid domains

    - Provide an overview of optimization problems and solutions in watermarking with
    a special focus on bio-inspired algorithms

    - Cover the hardware implementation of watermarking

    - Highlight recent innovations, designs, developments, and topics of interest
    in existing image watermarking techniques for intellectual property (IP) protection

    - Outline different applications of digital image watermarking


    Surekha Borra

    Rohit Thankani

