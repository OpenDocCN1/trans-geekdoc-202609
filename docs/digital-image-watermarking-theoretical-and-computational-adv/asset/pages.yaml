- pgno: 15
  md: '# Introduction


    AVARIETY OF DIGITAL INFORMATION, for example, pictures, recordings, melodies,
    and essential archives, is being published or exchanged between people, organizations,
    and associations every second. The digital content and online transmission of
    data are fast, less expensive, and easy to store and process, and result in high-quality
    transmission and distribution. On the flip side, new security-related problems
    have arisen, such as how to trust, identify, or authenticate the right owner/creator/correspondent,
    and how to confidentially and reliably protect the multimedia information/intellectual
    property (IP). With the illegal downloads, distributions, copying, and use of
    a variety of data, such as multimedia, web-published data, broadcast information,
    IP, and commercial designs, the creators/producers/authors/editors/distributors
    are experiencing great losses, and digital rights have become the need of the
    hour.


    This chapter discusses the importance of digital rights management (DRM) and copyrighting
    images, and reviews the techniques defined in DRM for securing the image data
    and corresponding owners. Also explained are the differences in the concepts of
    encryption, steganography, and digital image'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# 2 ■ Digital Image Watermarking


    watermarking. The broad classification of copyright marking methods, the generalized
    digital image watermarking framework, its performance criteria and metrics, and
    image watermarking tools are presented.


    # 1.1 DIGITAL RIGHTS MANAGEMENT


    To reduce the losses caused by piracy, and to limit, prevent, identify, manage,
    use, manipulate, distribute, deliver, and measure the illegal actions as well
    as technological solutions, at every stage of online communication, from rules,
    data generation to consumption, a standardized set of rules, methods, and techniques
    are defined by the DRM systems globally. The DRM mainly deals with licensing agreements,
    data viewing, data access, copy protection, copy prevention, copy control, and
    technical protection when multimedia is stored or transferred across a variety
    of devices and networks. Many copyright laws and acts related to DRM, such as
    the Digital Millennium Copyright Act (DMCA), World Intellectual Property Organization
    Copyright Treaty (WCT), and European directive on copyright, are defined for control
    of copyrighted works, which are not globally accepted (Vellasquez et al., 2010;
    Surekh and Swamy, 2014). The DRM defines an open standard that discusses the issues
    and requirements related to universal multimedia access (UMA), such as access
    control, which include user identification, level of access, copy control, the
    creation of unauthorized copies, the detection of illegal distribution and tracking,
    the prevention of users from modifying the content, secure storage and transmission
    using algorithms and protocols, renewability, and interoperability.


    The DRM aims to prevent unauthorized access, copying, and redistribution of digital
    media by encrypting the data and not making it directly accessible (Mohanty et
    al., 2017). The DRM can be referred to as the extension to digital media copyright,
    though both have different objectives and regulations. The DRM recommends key-based
    encryption and watermarking algorithms, along with some security protocols for
    ensuring'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# Introduction ■ 3


    confidentiality, authentication, copy control, and data integrity. The key management
    plays a crucial role and has a challenging task in providing security as the working
    of algorithms is made open (Borda, 2005). Key generation, verification, secure
    storage and transfer, revocation, and key escrow are all of key management. The
    usage of biometrics as secret keys helps in overcoming key exchange problems.


    Cryptographic techniques are used to make the content unintelligible using encryption
    keys and algorithms, before its storage/publication/distribution (Thanki and Kothari,
    2017). The person/device having knowledge of the decryption key is allowed to
    access and decrypt completely or partially the protected data upon checking his
    or her authorization and user rights. Encryption, which comes first in DRM, ensures
    access control and authentication of users or content. A limitation of encryption
    is the fragility of ciphertext, implying that it is impossible to decrypt content
    if the ciphertext is modified even partially. Random access of scalable/multiresolution
    data is also not possible when data is encrypted. Further, once the data is converted
    back to its original form authorized for users, the cryptographic techniques fail
    to protect the ownership claims, creating an analog hole. In addition, high computational
    costs for encryption and decryption majorly limit its application in real time.


    A digital signature, on the other hand, is a message-dependent data string that
    is appended to the original message using encryption techniques. The objective
    is to guarantee the data integrity and overcome attacks related to nonrepudiation.
    A digital signature can easily be removed and can be made invalid by changing
    the file content (Petrovic et al., 2006). Steganography and watermarking techniques
    address these problems (Langelaar et al., 2000; Thanki and Kothari, 2017; Thanki
    et al., 2017, 2018). Steganography is a kind of one-to-one secret communication
    technique that modifies a multimedia file to hide and detect the secret message,
    by authorized personnel only (Hartung and Kutter, 1999; Langelaar et al., 2000).
    While both steganography and encryption ensure'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# 4 Digital Image Watermarking


    confidentiality, steganography ensures that nobody has knowledge that entities
    are communicating in secret, and hence it is suitable for copyright marking. In
    contrast, watermarking has been part of one-to-many communications and is used
    to verify the owner of a multimedia file (Vellasques et al., 2010).


    While the objective of steganography is to protect the hidden message, the objective
    of watermarking is to protect the host file from ownership/copy conflicts. The
    watermark represents the author/owner/buyer of the file (Dew and Santhi, 2017;
    Borra et al., 2017, 2018). In contrast to appending the signature at the end of
    the file, as in the case of a digital signature to ensure authorship, watermarking
    embeds water in the file itself, guaranteeing authorship and data integrity (Sherekar
    et al., 1999). While the cryptography objective is to secure the file (confidentiality)
    watermarking tries to secure ownership (authenticity) of the digital file. While
    encryption cannot copy control once the data is decrypted, watermarking can protect
    and copy control data even after decryption (Borda, 2005; Sherekar et al., 1999).


    # 1.2 DIGITAL IMAGE WATERMARKING


    Images are often susceptible to theft and copyright infringement. There are many
    occasions where images have been stolen from websites for usage/fame/financial
    gain and justice did not prevail, leading to losses for the owners/inventors.
    Mechanisms for identifying and protecting their owners from adversaries (Vellasques
    et al., 2010) are thus needed. Before the digital era, painters/photographers/organizations
    usually signed their art/photographs/designs with their signature, initials, or
    pseudonyms/print stamps to help identify themselves as the owners of the images,
    especially if the IP were to be shared. Watermarking is another way for an owner
    to sign or her image and ruin the efforts of attackers. A watermark is a superimposed
    image/logo/text placed over an image with the intention of identifying the owner
    of the image. Analog watermarks that are'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# Introduction ■ 5


    visible and relatively easy to replicate have existed for centuries. These watermarks
    were first used in paper mills and later seen on currency notes and postal stamps.


    Digital watermarking as part of the DRM system provides mechanisms to represent/record/hide
    the copyright owner/distributor/distribution chain/purchaser in the images for
    the purpose of providing evidence in cases of copyright protection and copyright
    law enforcement (Mohanty et al., 2017). Some operations in storing/editing/transmitting
    may distort, delete, or otherwise interfere with watermarks. Universal acceptance
    and the deployment of watermark technology will only be possible after it reaches
    a satisfactory degree of maturity and after its standardization guaranteeing a
    minimum level of quality with provable robustness and security levels. Considering
    this, it is evident that we are in the middle stage of the process of adopting
    watermark technology, working to construct effective watermarking systems.


    # 1.3 CLASSIFICATION OF COPYRIGHT


    Digital image copyright marking techniques can be classified into many categories,
    as shown in Figure 1.1. The classification is made considering a variety of parameters,
    such as the type of image to be protected, the type of copyright mark, the embedding
    domain, the perceptibility of the mark, the reversibility of the original document,
    the purpose/application of the copyright marking, its use, and the type of keys
    and data required at the time of copyright verification. The host image to be
    protected can be a binary/halftone image, gray/color image, medical image, or
    hyperspectral image based on the application. The watermark can be a random binary
    pattern, credit card number, picture, signature-logo of the owner, host image
    source, or content-related data, all of which can identify the copyright information
    of the owner/company. Logo-indicating watermarks are usually binary with smooth/sharp
    details. They may also include some text information. Statistical watermarks are
    generated using different noises, such as pseudorandom noise (PN) and white Gaussian'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# 6 Digital Image Watermarking


    noise (WGN). The binary random sequences generated from these noises are often
    multiplied with watermarks to generate statistical watermarks. An alternative
    way to generate statistical watermark patterns is to use the patchwork method,
    in which the differences between pixels in the host image are compared with the
    reference value using a hypothesis test.


    ![](img/2aafc43f8e3a22e17b338f7ddcb87be4_20_0.png)


    FIGURE 1.1 Classification of digital image copyright marking techniques.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# Introduction ■ 7


    Based on human perceptibility, copyright marks can be invisible/visible/dual.
    Visible watermarks, as logos, are embeddedly at image corners, warning of copyrights
    and ownership for content protection (Qasim et al., 2018). Placing visible watermarks
    at the center of an image protects against cropping but affects the quality and
    will not be pleasing to the viewer. Today, visible watermarks can also be placed
    intelligently on the host image without affecting the quality using machine learning
    techniques. Invisible marks are mainly designed for forensic/investigation purposes
    as they are placed invisibly and randomly at any pixel positions or frequency
    coefficients of the image based on a secret key. They can be recovered accordingly
    when required for authentication, ownership verification, or data integrity validation
    purposes. Some applications embed invisible and visible watermarks for improved
    security. There are four types of invisible marks: robust, semifragile, fragile,
    and hybrid techniques (Qasim et al., 2018).


    Fragile marking embeds marks in imperceptible portions of an image that the marks
    are destroyed in case of modification of the image. A simple way to implement
    fragile marking is to ensure that the host image is not tampered and that data
    integrity and authentication are maintained. Fragile marks can be easily implemented
    and removed, and are not suitable for proving ownership, but they are useful as
    evidence that an image was modified. The semifragile methods are limited in robustness
    and are designed to survive authorized/specific levels of image processing operations,
    such as compression. As these methods differentiate some sets of operations/attacks,
    they are also used for checking integrity and authentication. The hybrid approaches,
    on the other hand, are a combination of robust and fragile methods to achieve
    a greater level of security, as they achieve ownership protection, data integrity,
    and authentication in parallel (Qasim et al., 2018).'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# Digital Image Watermarking


    Robust marking is preferred in cases of security applications, such as copy control,
    broadcast monitoring, and copyright protection as these marks survive a wide range
    of attacks (Qasim et al., 2018). Robust marking embeds marks in significant portions
    of an image that the marks are not destroyed in cases of modifications/distortions
    to the image, such as compression, rescaling, resampling, analog-to-digital (A/D)
    and digital-to-analog (D/A) conversion, additive noise, linear and nonlinear filtering,
    shifting, cropping, and rotations, to name a few. The design of robust marking
    techniques is complex and challenging due to the trade-off among the conflicting
    requirements, such as hiding capacity, transparency, and robustness. Though the
    degree of survival depends on the application, the ideal objective is to design
    the marking system such that the mark can be removed only by destroying the host
    image, which is very useful in protecting sensitive images related to the medical
    field and defense (Dey et al., 2017; Biswas et al., 2013). There are two main
    types of robust marking based on the entity to be protected. While watermarking
    identifies the copyright owner of the file, fingerprinting identifies the authorized
    customer who allows/distributes/makes illegal copies of the host image, and/or
    violates the license agreements. Robust watermarking unless specified, is irreversible.
    A special category reversible watermarking is designed to be lossless as these
    marks are invertible and the original watermark can be restored and/or recovered.
    Zero watermarking, on the other hand, does not affect the quality of the host
    image in the process of watermark hiding.


    The watermark detection itself is a function of many inputs, such as the test
    image, private or public key, original watermark, and original host image. Asymmetric/public
    key watermarking allows extraction of the watermark by anyone apart from the owner
    by limiting access to remove it. On the other hand, to prove ownership of images,
    private watermarks are used as they can be detected only by a secret key (Mohanty
    et al., 2017).'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'Blind watermarking techniques do not require either the original host or the
    watermark for watermark extraction, and are flexible for use in many applications,
    including image authentication, copyright protection, covert communication, and
    electronic voting systems. Semiblind techniques do not require the original host
    but require the original watermark or some additional information for watermark
    extraction. Content privacy, image authentication, and copyright protection are
    a few applications of semiblind techniques. Non-blind techniques require the original
    host image for watermark extraction, which may be difficult to produce, and so
    are limited in application.


    Watermarking systems are classified into spatial and transform-categories (Qasim
    et al., 2018) depending on the watermark embedding domain. These techniques are
    designed to insert the watermark directly into significant portions of the pixels/transform-components
    of the original host image if it is gray, or into the luminance or respective
    color components. While some watermarking techniques follow one-to-one mapping,
    many existing techniques are block processed to insert one bit of watermark over
    many pixels or transform coefficients randomly. In contrast to substitution techniques,
    some watermarking techniques add scaled watermark information to the host image
    pixels/transformed coefficients while minimizing noticeable distortions. Machine
    learning or optimization techniques are now in use to determine the optimum and
    adaptable scale factors appropriate for the host image.


    The transform domain schemes are computationally complex but robust for signal
    processing attacks and are the right choice for resolving ownership issues. Transforms
    such as discrete cosine transform (DCT), discrete wavelet transform (DWT), and
    singular value decomposition (SVD) are widely employed due to their adaption in
    framing compression standards and their relative perceptual properties of frequency
    bands (Thankanki et al., 2017). In hybrid techniques, watermark bits are inserted
    into'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'hybrid coefficients of the host image, obtained by combining two or more transforms.
    The sparse domain techniques, on the other hand, insert a watermark into sparse
    measurements of the host image obtained from the compressive sensing (CS) theory.


    In traditional watermarking schemes, the watermark is inserted into specified
    pixels or frequency coefficients of the host image using simple logical or mathematical
    equations that involve addition and multiplication. In additive watermarking,
    the watermark is inserted into the host image with the help of a gain factor,
    as in Equation 1.1.


    $$WC = C+k\timesw$$


    In multiplicative watermarking, the watermark is inserted using a constant and
    weighted factor, which in turn is multiplied by the pixel information or frequency
    coefficients of the host image to get the watermarked image, as in Equation 1.2.


    $$WC = C*(1+k\timesw)$$


    Intelligent watermarking schemes, on the other hand, use various intelligent techniques,
    such as machine learning, deep learning, optimization techniques, and bio-inspired
    algorithms, to improve the results of traditional watermarking (Dey et al., 2014).
    The machine learning and optimization algorithms are widely used in watermark
    embedding and/or the extraction process. The bio-inspired and optimization techniques,
    on the other hand, are used for the optimum selection of pixels or frequency coefficients
    of the host image for watermark embedding. These algorithms are also used for
    automatically finding the optimized scaling factors during watermark embedding.
    This is in contrast to traditional watermarking, where watermark bits are inserted
    into the host image using user-defined locations/scaling factors.'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# 1.4 GENERAL FRAMEWORK OF DIGITAL WATERMARKING


    Digital copyright watermarking enables us to bring copyright violators to court,
    the embedded copyright mark in any legally published/sold image is retained and
    can be extracted in any copies. Digital image watermarking is a process of embedding
    a watermark into the image so to extract it at a later stage to detect ownership
    identity. Figure 1.2 shows a generalized block diagram of robust invisible image
    watermarking. The host is the digital image that has to be protected by inserting
    the watermark. The watermark can be a message/logo/statistical pattern inserted
    into the host that has some relevance to the host. The general framework of digital
    image watermarking and the copyright authentication process is composed of three
    major components: (1) the embedder,


    ![](img/2aafc43f8e3a22e17b338f7ddcb87be4_25_0.png)


    FIGURE 1.2 Generalized block diagram of digital image watermarking.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# 12 Digital Image Watermarking


    (2) the extractor, and (3) the correlator. The watermark may be encrypted before
    its insertion into the host image. In such cases, the extracted watermark has
    to be decrypted before it is compared to the original to make an assertion about
    ownership. All the components may be hardware units or software programs.


    The embedder (E) is a function of the host image (C), secret key (K), and one
    or more watermarks (W). The watermark W may be a random sequence or a meaningful
    message or image, as logo or copyright information. The embedder outputs a watermarked
    image (WC) such that WC=E (C, K, W). The produced watermarked image (WC) can be
    stored, transmitted, or published. The owner must extract the watermark in order
    to prove ownership. The watermark extraction process may may not be the inverse
    of embedding. The extractor function (D) accepts a secret key (K), test image
    (T), and/or the original nonwatermarked image (C) and original watermark (W) to
    detect the watermark (W'') that W''=D (K, T, C, W). The test image can be the
    watermarked image (WC), an attacked image (AC), a nonwatermarked image (C), or
    some other unauthorized image. The detected watermark (W'') is correlated with
    the original to obtain a similarity score if the similarity exceeds a predefined
    threshold indicating that the watermark is verified and it is authenticated. A
    public/private key is used in the embedding and extraction process to achieve
    confidentiality. The process involved in embedder/extractor and the inputs/outputs
    to these components vary depending on the type of watermarking and application.


    # 1.5 PERFORMANCE CRITERIA


    The performance of image watermarking and its evaluation depend on several factors,
    such as the type of host image and application. The subjective and objective analysis
    helps in identifying how well the watermark is hidden in the host image without
    being perceived by the human eye. The general performance criteria and essential
    requirements of any invisible robust'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'watermarking technique are given below (Mohanty et al., 2017; Qasim et al.,
    2018):


    +   - Imperceptibility/fidelity: The watermark, once inserted into the host image,
    must be perceptually indiscernible. Imperceptibility is a measure of the perceptual
    transparency of a watermark and is an important requirement of invisible watermarking.
    It is required that the watermarked image statistically similar to its original.
    Imperceptibility often conflicts with watermark size and robustness. The similarity
    of the watermarked and original/attacked images is usually calculated by metrics
    such as the structural similarity index (SSIM) and peak signal-to-noise ratio
    (PSNR) (Kutter and Peticolas, 1999; Wang and Bovik 2002). In some specific applications,
    it is required that there be no degradation of quality of the host image, which
    makes the design of a digital watermark extremely difficult.


    +   - Security: This refers to the detectability and key restrictions. The watermarking
    scheme must be secure against the unauthorized detection and modification of the
    embedded watermark by attackers or imposters who have knowledge of embedding and
    extracting algorithms. A digital watermark must be secure enough. It should be
    difficult for the adversary to remove even partial information of watermark without
    destroying the cover image.


    +   - Robustness: A watermarked image undergoes unintentional transformations,
    such as compression during storing and transmission, and intentional attacks,
    such as cryptographic, removal, resampling, cropping, geometric, and scaling attacks.
    The resistance of a digital watermark to unforeseen and designated attacks is
    crucial in watermarking and is mainly dependent on the embedding domain and selection
    of pixels/coefficients. In practice, watermarking algorithms'
  merge: -1
  img_proc: true
- pgno: 28
  md: '+   - Reversibility: In specific applications such as the medical field, slight
    modifications to images could lead to disaster, which may include legal implications.
    In such cases, it is necessary to strictly retrieve the original host image when
    required. These applications demand the development of lossless or reversible
    watermarking techniques, where recovery of the original image is possible after
    proving ownership.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# 1.6 PERFORMANCE METRICS


    The performance of image watermarking schemes in terms of imperceptibility and
    robustness can be measured by various quality measures. To measure the similarity
    between the original and watermarked image for perceptual distortions, imperceptibility
    metrics such as PSNR and weighted PSNR (WPSNR) (Kutter and Peticolas, 1999; Thanki
    et al., 2018). The normalized correlation (NC) and SSIM are commonly used metrics
    for the measurement of similarity between the original and extracted watermarks
    at the correlator. These measures indicate the quality of the extracted watermark
    and also help analyze the robustness of the watermarking technique in the presence
    of attacks (Thanki et al., 2017).


    The PSNR given in Equation 1.3 is measured in decibels and depends on the mean
    square error (MSE), which is an error between the original and watermarked image.
    The MSE is calculated using Equation 1.4:


    ```

    $PSNR = 10 \times \log_{10} \left(\frac{255^2}{MSE}\right) \quad (1.3)$

    ```


    ```

    $MSE = \frac{1}{M \times N} \sum_{x=0}^{M-1} \sum_{y=0}^{N-1} (C(x,y) - WC(x,y))^2
    \quad (1.4)$

    ```


    where $C$ is the original host image and $WC$ is the watermarked image, respectively.


    The WPSNR is a new approach for calculating the imperceptibility of watermarked
    images and is shown in Equation 1.5:


    ```

    $WPSNR = 10 \times \log_{10} \left(\frac{255^2}{NVF \times MSE}\right) \quad (1.5)$

    ```


    where NVF is the noise visibility function, which represents the texture information
    of an image based on the Gaussian model. The value of NVF lies in the interval
    [0, 1]. The NVF value is 0 for'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# 16 Digital Image Watermarking


    the texture region and 1 for the flat region. The NVF is calculated using Equation
    1.6:


    ```

    $$NVF = \text{NORM} \left\ \frac{1}{1+\delta_{block}} \right\}$ (1.6)$

    ```


    $\delta$ is luminance variance of the computed blocks.


    High values of PSNR and WPSNR indicate more imperceptibility. The robustness of
    any image watermarking scheme is high if the NC and SSIM values are close to 1
    (Thanki et al., 2017).


    The NC and SSIM are calculated using Equations 1.7 and 1.8, respectively. While
    NC measures the correlation between original and extracted watermarks, SSIM measures
    the structural similarity between them.


    ```

    $$NC = \frac{\sum_{x=1}^{M}\sum_{y=1}^{N} w(x,y)\times w^*(x,y)}{\sum_{x=1}^{M}\sum_{y=1}^{N}
    w^2(x,y)}$ (1.7)$

    ```


    ```

    $$SSIM = \frac{(2\mu_{w}\mu_{w^*} + C_1)(2\sigma_{ww^*} + C_2)}{(\mu_{w}^2 + \mu_{w^*}^2
    + C_1)(\sigma_{w}^2 + \sigma_{w^*}^2 + C_2)}$ (1.8)$

    ```


    $C_1$ and $C_2$ are constants, $w$ and $w^*$ are the original and extracted watermarks,
    $\mu_w$ and $\mu_{w^*}$ are the means of the original and extracted watermarks,
    $\sigma_{ww}$ and $\sigma_{ww^*}$ represent the covariance of the original and
    extracted watermarks, and $N$ represents the number of windows.


    # 1.7 ATTACKS ON WATERMARKS


    Although there are plenty of watermarking algorithms and tools available online,
    watermarking is still a challenging task when dealing with attacks (Wolfgang et
    al., 1999). An attack, in'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'watermarking terminology, aims to remove traces of the watermark to thwart
    authentication goals. Knowing the attack types and their analysis assists in identifying
    the best tool for a particular application in competing environments. Checkmark,
    Optimark, and StirMark are some of the software that assess the robustness of
    developed watermarking tools (Borra et al., 2017). The attacks are generally categorized
    into removal, geometrical, cryptographic, oracle, protocol, and security attacks.


    +   Removal attacks aim to remove watermarks from a watermarked image by intentionally
    performing image operations, such as quantization, lossy compression, averaging,
    remodulation, demodulation, collision attacks, block replacement attacks, denoising,
    and filtering. It has been observed to perform a remodulation attack, the attacker
    first has to forecast the watermark using a variety of filters (median, high pass,
    and Wiener), then subtract it from the watermarked image, and finally add the
    Gaussian noise to it. This is commonly referred to as a collision attack. However,
    as a mosaic attack, the attacker splits the watermarked image into small portions
    and tries to reassemble it using an HTML table, with the intention of removing
    the inserted watermark.


    +   Geometrical attacks aim to distort the watermark rather remove it by creating
    nonsynchronization among the extracted and original watermarks. The attackers
    try to crop the image from its sides or delete/edit/shift some rows or columns
    of pixels randomly with the intention of distorting the watermark. This creates
    synchronization problems, while extracting the watermarks. It is common to apply
    a combination of attacks rather than a single attack. The common geometrical attacks
    are rotation, shearing, translation, affine transformation, scaling, aspect ratio
    changes, cropping, column/line removals, jitter, and random bending. Note that'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# Digital Image Watermarking


    these attacks can be applied either locally or globally and in a systematic or
    random way.


    +   - Protocol attacks aim to create ambiguity of ownership by attacking the watermarking
    application itself, using the concept of invertible watermarks. Protocol attacks
    set another requirement for the design of watermarking tools: watermark extraction
    must be impossible from any images that are in fact not marked. Said another way,
    the false-positive rate must be a minimum. Also, protocol attacks take advantage
    of loopholes in the management or implementation process of watermarking.


    +   - Copy attacks aim to predict a watermark and replicate it on other data without
    knowledge of the secret keys involved. Also, development of image-dependent watermarks
    is the best solution to thwart these kinds of attacks.


    +   - Legal attacks attempt to create doubt in the technical evidence on watermarks
    and watermarking schemes, while proving ownership in the courts.


    +   - Cryptographic attacks envisage finding the lengthy secret keys by exhaustive
    searches.


    +   - Oracle attacks aim to generate the original host image from the watermarked
    image using a watermark detector algorithm.


    +   - Disable detection attacks aim to break the relationship between the watermark
    and host, which carries it without affecting the existence of the watermark.


    +   - Ambiguity attacks embed multiple fake watermarks in order to mislead the
    detector. Ambiguity attacks occur in systems with multiple watermarks. In such
    cases, times the order in which the watermarks are inserted is ambiguous.'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# 1.8 DIGITAL IMAGE WATERMARKING TOOLS


    Piracy has been a serious concern, as illegally distributed copies leading to
    a huge loss to IP owners due to the rapid uploading of multimedia files over the
    Internet. Watermarking tools are employed as a way to protect IP rights and prevent
    illegal forgery and piracy. variety of image watermarking tools are available
    online for watermark creation, embedding, and extraction (Borra et al., 2017).
    While some tools restrict the watermarks to only those available in their database,
    other tools allow the creation of one''s own watermark. Table 1.1 lists the web
    links of 26 image watermarking tools and 3 robustness verification tools presently
    available online.


    After analyzing the case studies of customers using the aforementioned watermarking
    tools, it was noticed that most professional artists/photographers still employ
    visible watermarks to protect their artworks/photos at multiple scales, and the
    challenging task of resolving the trade-off between robustness and invisibility
    is unsolved.


    With invisible watermarks, their purpose is served only if they robustly survive
    in the host image irrespective of a variety of defined and undefined attacks.
    The development of intelligent image watermarking techniques based on advanced
    machine learning, neural networks, artificial intelligence, and bio-inspired algorithms
    in conjunction with a variety of transforms is required for better trade-off among
    several requirements of watermarking. The algorithms for finding optimal parameters
    (locations/intensities/coefficients/subbands) based on image characteristics are
    the focus of research. Reducing the computational time and complexity of intelligent
    algorithms and dealing with issues related to the local optimum are also challenging
    research problems. The extended requirements of watermarking tools may include
    real-time processing, mathematical formulations and support to multiple resolutions,
    multiple formats, and multimedia. Furthermore, automated techniques and benchmarks
    for the proper and simple assessment of watermarking tools for a particular application
    need to be developed.'
  merge: -1
  img_proc: true
