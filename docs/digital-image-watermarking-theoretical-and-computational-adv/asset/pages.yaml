    # 2.6 WATERMARKING USING SINGULAR VALUE DECOMPOSITION


    Singular value decomposition (SVD) (Thakkar and Srivastava, 2017; Su et al., 2013;
    Kamlakar et al., 2012; Gupta and Raval, 2012;'
