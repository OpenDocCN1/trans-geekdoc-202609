  md: '# 126 ■ Digital Image Watermarking


    ownership. In transform domain watermarking, the transform coefficients of host
    images are modified by the watermark. The hardware-based implementation of this
    technique is more complex than the spatial domain technique as it requires additional
    hardware blocks and resources for the implementation of forward and inverse transforms;
    where in the parallel, pipelined architectures suit best. There are also approaches
    in finding complex operations as transform/inverse/extraction is done in MATLAB,
    while other steps of the algorithm are done by FPGA hardware. Many prototypes
    of digital image watermarking for secure digital cameras are also available, with
    major components being the image sensor, Analog-to-Digital (A/D) converter, watermarking
    unit, temporary memory, flash memory, controller unit, and Liquid Crystal Display
    (LCD) panel.


    # 4.4 CHALLENGES AND FUTURE DIRECTIONS


    Hardware-based implementations are developed for only a few additive watermarking
    techniques, such as LSB substitution, SS, technique, and DCT/DWT-based techniques
    using either FPGA boards or DSP kits. Many advanced software watermarking techniques
    based on channel coding algorithms, phase congruence, singular value decomposition,
    curvelet transform, contourlet transform, ridgelet transform, hybrid combinations,
    machine learning, and bio-inspired algorithms are available without hardware-based
    implementations. Thus, new hardware-based implementation approaches are required
    for these types of advanced watermarking techniques. There is also a requirement
    for the development of efficient hardware-based watermarking architectures that
    operate at a higher frequency and involve fewer resources and computations, while
    maintaining good imperceptibility and robustness against different types of attacks.
    The design of prototypes for digital image watermarking using XSG demands for
    time, area, and cost reduction, and optimization in resource utilization and latency,
    all with an ease in the compatibility of integrating and configuring the devices.'
  merge: -1
  img_proc: true
- pgno: 141
  md: '# Hardware-Based Implementation ■ 127


    Some hardware-based watermarking implementations are hardware–software co-designed
    to save power consumption and time. Some operations which demand high performance
    are designed in hardware, while the ones which are computationally expensive are
    implemented in software. These kinds of designs result in a trade-off between
    hardware and software-based implementations, which can be improved in future.


