  md: '# 30 Digital Image Watermarking


    against lossy compression and various image processing manipulations, such as
    filtering and the addition of noise. The technique can embed only small watermarks
    into the host image. Embedding of large watermarks into host images is by processing.
    For every bit of watermark, a pair of blocks is considered. To hide bit 1, the
    intensity of one block is increased and the intensity of another block in the
    pair is decreased by a fixed factor α. No blocks are altered if the watermark
    bit is 0. The positions of pairs of blocks depend on the secret key. To detect
    the watermark the mean sum of differences between the pair of blocks is calculated
    and compared with a threshold. The location of the blocks is kept secret, and
    assuming certain properties for image data, the watermark is easily located by
    averaging the difference between the values in the two subsets. It is assumed
    that, on average, without the watermark, this value goes down to zero for image
    data.


    # 2.2.3 Texture Mapping Coding Technique


    This technique is used for the copyright protection of images that are rich in
    texture information (Datta and Nath, 2014). A host image is first segmented into
    two regions: texture and nontexture regions. Later, the pixels in the texture
    region are modified by a watermark using any of the spatial domain watermark embedding
    procedures, followed by combination with a nontexture region of the host image
    to obtain the watermarked image. In the extraction process, first the watermarked
    image is divided into a nontexture region and texture region. Then, by reversing
    the procedure, the watermark is recovered from the watermark texture region. This
    technique is mainly used for the copyright protection of images related to medical
    science and defense.


    # 2.2.4 Predictive Coding Technique


    This technique was designed and implemented by Matsui and Tanaka for grayscale
    images (Matsui, 1998). In this technique, the correlation between adjacent pixels
    is calculated. A watermark is generated by a set of pixels that are embedded,
    and every other'
  merge: -1
  img_proc: true
