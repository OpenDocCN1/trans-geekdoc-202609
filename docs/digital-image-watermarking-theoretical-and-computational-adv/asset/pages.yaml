  md: '# Hardware-Based Implementation of Watermarking


    SOFTWARE-BASED IMPLEMENTATION OF WATERMARKING is easy to use and flexible, as
    it can be easily modified and upgraded. Most of the efficient and robust watermarking
    algorithms embed watermarks in transform domains and include forward and inverse
    transform operations, which are complex and computationally expensive. However,
    their speed is limited, and they are vulnerable to offline attacks. The speed
    of these algorithms depends on the processor. Implementing real-time watermarking
    algorithms on serial processors involves lots of computations due to their high
    resolutions (AIAli et al., 2013), and they have some additional constraints related
    to peripheral devices and memory. Hence, there is a requirement for dedicated
    and customized hardware to support'
  merge: -1
  img_proc: true
- pgno: 122
  md: 'image watermarking in real time. The advantages of custom-ized hardware realization
    of watermarking include:


    +   - Low cost

    - Lower power consumption

    - Less execution time

    - Reduced chip area

    - Reliability

    - Supports real-time processing

    - Supports stand-alone implementation without using a personal computer (PC)


    This chapter discusses the hardware design technologies that enable digital image
    watermarking for Digital Signal Processors (DSPs), Field Programmable Gate Arrays
    (FPGAs), and Application-Specific Integrated Circuits (ASIC) chips along with
    the hardware-software co-design in Xilinx System Generator (XSG). Various hardware
    watermarking approaches that use FPGAs, DSPs, and ASIC boards in spatial, transform,
    and hybrid domains are compared. This comparison is done in terms of the board
    and platform used, clock frequency, power consumption, maximum peak signal to
    noise ratio (PSNR) (dB) achieved, and the type of host image support provided.


    # 4.1 INTRODUCTION


    There are two types of hardware design technologies: (1) ASIC, which are full
    custom, and (2) Programmable/reconfigurable devices such as DSPs and FPGAs, which
    are semi-custom. The parameters to be considered while selecting the design technology
    are cost, complexity, flexibility, design time, reconfigurability, performance,
    and application. ASIC offers the highest performance due to pipelining, concurrency,
    parallelism, and clubbing'
  merge: -1
  img_proc: true
- pgno: 123
  md: '# Hardware-Based Implementation ■ 109


    of single clock operations. On the flip side, ASICs are not flexible and reconfigurable.
    Furthermore, a single error in the fabrication process makes the chip useless.
    DSPs perform extremely well when processing process complex images. The design
    complexity and performance of DSP processors are between those of a PC and ASIC.
    The DSPs may be programmed using their own assembly language, or in C using associated
    C compilers.


    FPGAs are reconfigurable devices that exhibit the benefits of general-purpose
    processors while demonstrating performance levels that are close to ASICs. The
    FPGAs are reliable, low power, run at low clock frequency, support parallelism
    and pipelining techniques, simplifies debugging and verification, minimizes time
    to market, allows rapid prototyping and design reuse, supports upgradations, and
    performs reconfiguration at low cost and in less time. Parallel execution of multiple
    Multiply and Accumulate (MAC) operations is possible with FPGA. Because of these
    functional advantages, and due to improvements in architectures and size, the
    FPGAs have become widely used devices for image and video processing applications
    (AIAli et al., 2013).


    # 4.2 HARDWARE-BASED IMPLEMENTATION OF DIGITAL IMAGE WATERMARKING


    Development of real-time watermarking includes two steps: (1) algorithm development
    and simulation and (2) hardware implementation and testing. In the process of
    designing hardware systems using hardware description language (HDL). The HDL
    codes represent synthesizable register-transfer level (RTL) models of the design
    and can be simulated by tools such as ModelSim. The principal languages used for
    configuring FPGAs are Very High Speed Integrated Circuits Hardware Description
    Language (VHDL) and Verilog HDL (Verilog). Many C-based hardware description languages,
    such as System C, have been developed. However, the synthesis processes of such
    languages are not automated and include human interaction. To overcome this problem,
    Handel-C and the'
  merge: -1
  img_proc: true
- pgno: 124
  md: '# 110 ■ Digital Image Watermarking


    associated compilers are developed by Celoxia Ltd. for direct hard-ware implementation
    from C-based language description.


    The system hardware programming languages are hardware specific and demand the
    designers to have enough knowledge of hardware and its related implementation.
    Hence, there is a need to translate high-level languages into hardware descriptions.
    For example, if the program is written in MATLAB®, then behavioral synthesis tools,
    such as MATCH compilers, are used to automatically generate synthesizable RTL
    models in VHDL/Verilog. The hardware implementation of watermarking using FPGA/DSP
    boards, using behavioral modeling of XSG architecture and MATLAB Simulink, is
    a very common practice in image watermarking. In developing the watermark model,
    the Video and Image Processing Blockset along with the signal processing tool
    of MATLAB are widely used.


    In the last two decades, many simulation and hardware implementations of watermarking
    have been developed (Joshi et al., 2012; Lakshmi et al., 2017) based on different
    domains: Discrete Fourier Transform (DFT), Discrete Cosine Transform (DCT), and
    Discrete Wavelet Transform (DWT) (Kothari et al., 2018). While the hardware-based
    implementations of watermarking, it is preferred to use FPGA in general as they
    require less power and area compared to DSP boards. Also, ASIC and FPGAAs are
    easily compatible with simulation programs in which coding and watermarking are
    done smoothly. On the other hand, DSPs have high storage memory compared to the
    other two boards. Thus, DSPs are better suited for watermarking big media files,
    such as video. Many hardware-based implementations of watermarking systems use
    Xilinx Integrated Synthesis Environment (ISE) and ModelSim in combination with
    MATLAB to synthesize and process the HDL algorithms on FPGA, as they are less
    expensive in time and cost. Designers can design and simulate a model-based system
    using Simulink/Xilinx library. A HDL Coder tool automatically generates synthesizable
    HDL code mapped to Xilinx pre-optimized algorithms.'
