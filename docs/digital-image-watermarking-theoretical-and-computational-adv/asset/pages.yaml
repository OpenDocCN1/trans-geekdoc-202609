- pgno: 157
  md: '# Case Study


    WATERMARKING TECHNIQUES ARE MAINLY used for copyright protection or the authentication
    of multimedia data, such as images, video, and audio (Borra et al., 2018; Lakshmi
    and Surekha, 2016; Surekha and Swamy, 2012, 2016) However, the parameters chosen
    for optimization depend on the methodology involved in watermark embedding, extraction,
    and its application. The major requirements of watermarking are imperceptibility,
    robustness, and security against different kinds of attacks, in which the selection
    of the gain factor plays a crucial role. Many researchers have used gain factors
    by a trial-and-error method to meet their transparency requirements of a watermarked
    image. The manual selection of the gain factor is a time-consuming process and
    is not a standard approach. The value of the gain factor is also kept constant
    in many existing schemes in the literature and is not adaptable to various kinds
    of images and applications (Borra et al., 2018; Thanki et al., 2017). Thus, to
    make the watermarking scheme application dependent and to support and adjust the
    gain factors automatically for different host images, some adaptive schemes are
    required. In this case study, therefore, a popular optimization algorithm, particle'
  merge: -1
  img_proc: true
- pgno: 158
  md: '# 144 ■ Digital Image Watermarking


    swarm optimization (PSO), is combined with a block redundant wavelet transform
    (RDWT)-based watermarking scheme to obtain optimized gain factors. The flow chart
    and working of the PSO algorithm is given in Chapter 3. Optimization algorithms,
    which were discussed in Chapter 3, are used in finding optimized gain factors
    to give the best results for a particular application. Out of all of these algorithms,
    PSO algorithm is broadly used for optimization of gain factors in digital image
    watermarking due to its ease of understanding, ease of implementation, and less
    computational time compared to other algorithms.


    In this chapter an optimized and blind robust watermarking scheme is developed
    based on block redundant wavelet transform (RDWT) and PSO (Thanki et al., 2017)
    to overcome some limitations of the existing techniques. The RDWT domain coefficients
    are modified for watermark insertion based on watermark bits using noise sequences.
    The usage of the RDWT provides better imperceptibility and payload capacity to
    watermarking compared to existing simple wavelet transform-based schemes. Employing
    PSO improves imperceptibility and robustness. The experimental results and comparative
    analysis with an existing technique in the literature are given to show that the
    presented bio-inspired watermarking technique performs well in terms of imperceptibility
    and payload capacity.


    # 6.1 EMBEDDING ALGORITHM


    The proposed scheme is based on block RDWT and PSO, in which the monochrome watermark
    image is inserted directly into detail wavelet subbands like LH, HL, and HH of
    the image. Each wavelet subband is divided into nonoverlapping blocks. For the
    embedding of watermark, two uncorrected noise sequences for watermark bits “0”
    and “1” are generated. Each noise sequence modifies the coefficients of the corresponding
    subband of the host image with the help of the optimized gain factor obtained
    using the PSO algorithm. The simplified block diagram of the proposed digital
    image watermarking scheme is shown in Figure 6.1. The'
  merge: -1
  img_proc: true
- pgno: 159
  md: 'steps involved in the watermark embedding process are given below:


    +   1. Decompose the host image C into RDWT wavelet subbands: LL, LH, HL, and
    HH.

    2. Convert the monochrome image w into a binary sequence.

    3. Divide the detail wavelet subbands, LH, HL, and HH, into nonoverlapping blocks.

    4. Generate two uncorrelated noise sequences using a noise generator, each of
    an equal size to the nonoverlapping block.


    ![](img/2aafc43f8e3a22e17b338f7ddcb87be4_159_0.png)


    FIGURE 6.1 Block diagram of proposed optimized watermarking scheme.'
  merge: -1
  img_proc: true
- pgno: 160
  md: '146 ■ Digital Image Watermarking


    +   5. Modify the coefficients of detail wavelet subbands of the host image based
    on watermark bits and gain factors obtained from the PSO search algorithm using
    Equations.6.1 and 6.2:


    +   * If watermark bit== 0 then

    Modified_LH=LH + k1*Noise_Seq0

    Modified_HL=HL + k2*Noise_Seq0 (6.1)

    Modified_HH=HH+k3*Noise_Seq0

    * else if watermark bit== 1 then

    Modified_LH=LH + k1*Noise_Seq1

    Modified_HL=HL + k2*Noise_Seq1 (6.2)

    Modified_HH=LH + k3*Noise_Seq1


    Where Modified_LH, Modified_HL, and Modified_HH represent the modified coefficients
    of wavelet subbands; LH, HL, and HH represents original coefficients of wavelet
    subbands; k1, k2, and k3 are optimized gain factors; and Noise_Seq0 and Noise_Seq1
    are noise sequences corresponding to watermark bit 0 and 1.


    +   * Repeat the procedure for all blocks of the host image, to hide all watermark
    bits.


    +   6. Apply single-level inverse RDWT on the modified wavelet subbands along
    with original approximation band to get the watermarked image WA.


    # 6.2 EXTRACTION ALGORITHM


    The process of watermark extraction is given below:


    +   1. Decompose the watermarked image/test image WA into RDWT wavelet subbands:
    approximation subband LL and detail subbands, such as LH, HL, and HH.'
  merge: -1
  img_proc: true
- pgno: 161
  md: '2. Divide the detail wavelet subbands, LH, HL, and HH, into nonoverlapped blocks.


    3. Consider uncorrelated noise sequences, which are generated during the embedding
    algorithm, which are maintained in secret by the owner of the image.


    4. Recover the watermark bit from the detail wavelet coefficients based on the
    following conditions defined by Equations 6.3 and 6.4:


    ```

    SeqA=corr2(Modified_LH,Noise_Seq0)

    SeqB=corr2(Modified_HL,Noise_Seq0)

    SeqC=corr2(Modified_HH,Noise_Seq0)

    Seq0=(SeqA+SeqB+SeqC)/3

    ```


    ```

    SeqX=corr2(Modified_LH,Noise_Seq1)

    SeqY=corr2(Modified_HL,Noise_Seq1)

    SeqZ=corr2(Modified_HH,Noise_Seq1)

    Seq1=(SeqX+SeqY+SeqZ)/3

    ```


    5. If Seq0>Seq1 then set watermark as 0, else as 1.


    6. Reshape the extracted sequence into a matrix form to detect the watermark w''


    # 6.3 SIMULATION RESULTS


    The performance of any invisible watermarking scheme mostly depends on the value
    of the gain factor. Larger gain factors degrade the imperceptibility of the watermarked
    image but improve the quality of the recovered watermark and vice-versa. The fitness
    function used in this algorithm is a function of PSNR and NC values and is given
    by Equation (6.5):


    ```

    fitness = PSNR(C, WA)+(100*NC(w,w''))

    ```'
  merge: -1
  img_proc: true
