  md: '# 44 ■ Digital Image Watermarking


    # 2.11 MACHINE LEARNING–BASED IMAGE WATERMARKING


    The major challenge of conventional image watermarking techniques is to reduce
    the trade-off among imperceptibility, robustness, capacity, and security. ML,
    when combined with watermarking, finds optimum solutions for the problem of tradeoff
    minimization. ML techniques automatically predict output values from input data
    with high accuracy and efficiency by means of different classification and pattern
    recognition algorithms, which otherwise would be a time-consuming process. ML
    trains the machine to do the tasks while learning from experience. ML algorithms
    use various computational and statistical methods to “learn” information directly
    from data without depending on a predetermined equation or model. The’ performance
    improves with input samples available for learning. ML algorithms determine natural
    patterns in input information for decision making. ML algorithms are used in many
    real-world applications, such as big data analysis, image processing, computer
    vision, pattern recognition, object detection in industry, computational biology,
    natural language processing, and automation in watermarking.


    The models in supervised learning algorithms are based on known input and output
    information to predict future outputs. The supervised learning algorithms use
    classification and regression approaches to develop predictive models. While classification
    approaches are typically used for the predication of discrete data, regression
    approaches are used for the predication of analog data. The common supervised
    ML algorithms are decision trees, support vector machines (SVMs), neural networks,
    neighbour, naïve Bayes, and linear regression. Unsupervised learning algorithms
    use clustering approaches for the predication of a category of data for analysis.
    The common ML algorithms under the unsupervised category are k-means clustering
    and association rules.'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# Advanced Watermarking Techniques ■ 45


    Artificial neural networks (ANNs) train a system to remember a particular scenario
    and produce outputs for new inputs based on what it learned. An ANN solves problems
    based on connections of artificial neurons and layers (input, output, and one
    or multiple hidden layers), into which the learning is divided. Neural network-based
    watermarking techniques are slow at training and lead to overfitting problems,
    and their precision is limited to least squares error. Thus, more advanced ML
    algorithms, such as extreme learning machine (ELM), support vector regression
    (SVR), and SVM, are employed for intelligent image watermarking. These algorithms
    overcome the overfitting problems and perform better than gradient-based learning
    algorithms. SVM and SVRs estimate high-precision nonlinear functions, treating
    them as convex optimization problems, and avoid locking at the local optimal solution.
    SVM-based techniques work well for small training datasets and high-dimensional
    data and have proven to be robust against desynchronization attacks.


    Most of the ML efforts have recently been directed toward the use of probabilistic
    neural networks (PNN), which are composed of four layers of nodes: the input,
    pattern, summation, and output layers. The training of a PNN is performed by generating
    a pattern node, connecting it to the summation node of the target class, and assigning
    the input vector as the weight vector. The PNN is a supervised learning network
    that uses radial basis functions and the Bayes approach for classification. In
    contrast to back-propagation networks, a PNN works without feedback, but is fast
    due to parallelism. The fuzzy logic inference system (FIS) closely resembles human
    reasoning and is employed in digital image watermarking to solve optimization/embedding
    problems in a flexible way using fuzzifier and defuzzifier with an inference engine
    and knowledge base, resisting imprecise data.


    Recently, researchers introduced application of the convolutional neural network
    (CNN) algorithm for the security of images using watermarking. The architecture
    of a CNN is'
  merge: -1
  img_proc: true
- pgno: 60
  md: '# 46 Digital Image Watermarking


    composed of feature detection and classification hidden layers. The feature detection
    layers perform three types of operations on input data: convolution, pooling,
    and rectified linear unit (ReLU). The convolution puts the input data through
    a set of convolutional filters, where each filter works on certain features of
    input data. The pooling process simplifies the output value by performing nonlinear
    downsampling. This process reduces the number of output values that the network
    needs to learn about it. ReLU is used for mapping negative values to zero and
    only allows positive values. These three operations are repeated over many layers,
    with each layer learning to extract different features from input data. After
    feature extraction, classification layers follow where one is fully connected
    and gives an output vector of k dimensions, where k represents the number of input
    classes that the network predicts. The vector has probabilities for each input
    class being classified. The final layer of the CNN architecture uses a classification
    function to produce a classification output.


    All the above-mentioned ML algorithms and others help improve the performance
    of conventional watermarking techniques by improving the imperceptibility and
    robustness using four different approaches:


    Type I: In this approach, ML algorithms are used to optimize values, with the
    objective of maintaining the invisibility and quality of the watermarked image
    by selecting the best positions or intensities or scaling factors for watermark
    embedding. The generalized block diagram of this approach is shown in Figure 2.6.


    Type II: In this approach, an ML algorithm such as an SVM is modeled as a binary
    classifier after performing watermark embedding as shown in Figure 2.7. The objective
    is to memorize the relationship between the watermark and the corresponding watermarked
    image so as to detect the watermark bits blindly from the test image whenever
    required, thereby improving the performance of traditional watermarking.'
  merge: -1
  img_proc: true
