    # 3.5 IMAGE WATERMARKING USING SIMULATED ANNEALING (SA)


    Simulated annealing (SA) is a local search optimization algorithm (Aarts et al.,
    2003; Van Laarhoven et al., 1987) and is based on annealing phenomena, which are
    thermal processes that find low energy states of an atom in a heat environment.
    The process contains two steps; (1) increase the temperature of the heat environment
    to a maximum value at which the atom melts; (2) decrease the temperature of heat
    environment carefully until the particles arrange themselves into the ground state
    condition of the atom, which has the minimum energy state of the atom. The value
    of this state can be obtained only if the maximum temperature is high enough and
    if the cooling is done slowly. The connection between annealing processes and
    optimal minimization was established by M. Pincus in 1970 (Pincus, 1970). The
    annealing process as an optimization technique was proposed by S. Kirkpatrick
    in 1983 (Kirkpatrick et al., 1983) for a combinational problem. The SA-based optimization
    process can be performed using the metropolis algorithm (Metropolis et al., 1953)
    which is based on the Monte Carlo method. The metropolis algorithm generates an
    optimal solution to combinational optimization problems by assuming an analogy
    between the input function and many-particle systems with the following assumptions:
    (1) the solution of the problem is equivalent to the states of a physical system
    and (2) the value of a solution is equivalent to the “energy” of a state. For
    the implementation of SA, two functions are required: (1) a successor function
    that returns a “close” neighboring solution, given the actual optimal value (this
    function works as a distributive function for the particles of the system) and
    (2) a target function to optimize, depending on the current state of the system.
    This function works as the energy of the system. The main advantage'
  merge: -1
  img_proc: true
- pgno: 112
  md: '# Digital Image Watermarking


    of SA is that it avoids being trapped at local minima (Metropolis et al., 1953).
    The algorithm uses a random search method which accepts both changes in input
    function f. The probability of optimal value for this algorithm is given as:


    ```

    $p = \exp\left(-\frac{\delta f}{T}\right) \quad (3.4)$

    ```


    Where, $\delta f$ is the change in input function and $T$ is a control parameter,
    which is the analogy by temperature.


    The implementation of SA is very easy (Aarts et al., 2003; Van Laarhoven et al.,
    1987). The input parameters of SA are the possible solutions, the generation of
    random changes in solutions, a mean value of evaluating the problem functions,
    an initial temperature, and a method or rules for decreasing it in the search
    process. Only one image watermarking technique is available in the literature
    (Lin et al., 2010) which used SA for calculation of the optimal scaling factor.


    # 3.6 IMAGE WATERMARKING USING TABU SEARCH


    The tabu search (TS) algorithm is based on the process designed to cross boundaries
    of feasibility or local optimality instead of treating them as barriers (Glover
    and Laguna, 1998). This algorithm relies on three main strategies (Pham and Karaboga,
    2012); (1) a forbidding strategy which controls values in the tabu list, (2) a
    freezing strategy which controls what the output list of tabu is and when it exists,
    and (3) a short-term strategy which manages interplay between the other strategies
    to select best trail solutions. The restriction of tabu is one of the important
    exceptions in this algorithm. When a tabu has a sufficient evaluation value for
    attraction where the best optimal result can be achieved, then classification
    of tabu may be overridden. This condition is called aspiration criterion (Huang
    et al., 2011).


    In this algorithm, first an initial solution is chosen from the tabu list. Then,
    subsets of solutions are generated such that the solution'
  merge: -1
  img_proc: true
- pgno: 113
  md: '# Watermarking Using Bio-Inspired Algorithms ■ 99


    violates tabu conditions or at least one of the aspiration conditions have to
    choose a best solution in the subset. If the fitness value of the set is less
    than fitness value of subset, then tabu and aspiration conditions are updated.
    If a stopping condition is met, the algorithm is terminated. Various image watermarking
    techniques based on TS are proposed in the literature (Latif, 2013; Wang and Niu,
    2013; Huang et al., 2011; Huang et al., 2003) based on DCT, Hadamard transform
    and methods like vector quantization. The TS algorithm is mainly used for the
    selection of the best frequency coefficients of a host image for watermark embedding.
    These techniques have less imperceptibility and less robustness against attacks.


