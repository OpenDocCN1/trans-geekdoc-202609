  md: "# Watermarking Using Bio-Inspired Algorithms ■ 95\n\nWhere, $Y_0$ is the attractiveness\
    \ value at $n=0$.\n\nThe movement of a firefly $a$ toward another brighter firefly\
    \ $b$ is calculated as:\n\n```\n$x_a^{t+1} = x_a^t + e^{-\tau_{ab}}(x_b^t - x_a^t)\
    \ + \\alpha_t \\in \\epsilon_a^t$ (3.3)\n```\n\nWhere, the second term appears\
    \ due to the attraction, the third term is the randomization parameter, and $\\\
    epsilon_t$ is a random number vector generated using uniform distribution at time\
    \ $t$. If $\\gamma=0$, it reduces to a variance of the particle swarm optimization.\n\
    \nBased on these three rules, the basic steps in FA are explained as follows (Dey\
    \ et al., 2014):\n\n+   1. Randomly place a set of N fireflies in the search space\
    \ within a specific range.\n2. Perform watermarking and its corresponding fitness\
    \ function value for a possible solution for each firefly.\n3. Store the solution\
    \ with the best fitness function as the best scaling factors.\n4. Adjust the position\
    \ of the other fireflies according to the best-fit solution, starting with the\
    \ firefly having highest light intensity.\n5. Update the new firefly position\
    \ and find the best solution.\n6. Repeat steps 2 to 4, $N$ times.\n\nVarious image\
    \ watermarking techniques based on FA are proposed in combination with image processing\
    \ transforms such as DCT, DWT, SVD, and QR image decomposition (Dey et al., 2014);\
    \ Mishra et al. 2014; Dixit et al., 2016; Swaraja et al., 2016; Guo et al., 2017;\
