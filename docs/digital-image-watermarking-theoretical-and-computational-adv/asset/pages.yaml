    Type III: In this approach, the ML algorithm is used for watermark embedding and/or
    extraction algorithms as in Figure 2.8.

    Type IV: In this approach, ML algorithms are used for the intelligent enhancement
    of a watermark’s quality after its detection by a conventional extraction algorithm
    (Tables 2.1 through 2.3).


    Recently, deep learning-based watermarking models, whose design flow is similar
    to that of the CNN, were also introduced. Deep learning is a type of ML approach
    that learns to perform application tasks directly from input data. A deep learning
    algorithm algorithm combines multiple nonlinear processing layers using simple
    elements operated in parallel that are inspired by the human nervous system. Each
    layer is interconnected via nodes or neurons, where each hidden layer generates
    results based on outputs generated by the previous layer. In contrast to conventional
    ML'
