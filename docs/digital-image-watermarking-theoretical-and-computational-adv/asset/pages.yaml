  md: '# Advanced Watermarking Techniques


    WHEN TRANSMITTING IMAGES OVER an open communication channel, different threats
    are encountered related to confidentiality, authenticity, and integrity. Different
    kinds of digital watermarking approaches can be considered to warn, prevent, limit,
    and control access, apart from proving ownership. Recent developments of digital
    media, which has replaced paper, are facing issues related to piracy, security,
    and copyrights. Digital watermarching techniques are developed with the intention
    of protecting digital multimedia over such threats, by integrating a watermark
    either visibly or invisibly in a robust manner before publishing or storing the
    media. Images are often impaired unintentionally while storing, transmitting,
    retrieving, converting, and viewing. When designing robust watermarking systems,
    the watermarks are preferably embedded in the most perceptually significant parts
    of an image to ensure its robustness even to intentional distortions, such as
    translation, scaling, rotation, and affine transformations. Being able to resist
    such attacks, apart from general'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# 26 Digital Image Watermarking


    noise, while maintaining transparency and security is required for copy control,
    transaction tracking, and proof of image ownership. For three decades researchers
    and developers have been developing algorithms, architectures, and systems in
    this area to gain the best results.


    This chapter discusses various conventional and machine learning (ML)–based digital
    image watermarking algorithms and compares some recent works to define the challenges
    to be considered for future research. The chapter starts with spatial domain-based
    watermarking approaches, followed by transform domain techniques, and ends with
    advanced watermarking techniques that rely on the concept of ML algorithms.


    # 2.1 INTRODUCTION


    In today’s e-era, which mainly includes e-commerce, e-banking, e-health, and e-learning,
    information can be effectively downloaded without authorization from the proprietor.
    Once in a while, these circumstances create issues, for example, copyright security
    and proprietor verification. In such cases, assurance and verification of advanced
    information is required before it is exchanged over an open-source transmission
    medium. To address these issues, analysts have proposed different information-concealing
    strategies: cryptography, steganography, and watermarking. Watermarking is primarily
    utilized for the assurance and validation of information. This method beats the
    constraints of steganography by embedding a watermark into host content such that
    even the basic client cannot find the hidden watermark (Borra and Lakshmi, 2015).
    As discussed in Chapter 1, the watermarking framework has three components: a
    watermark embedder; a correspondence channel, which might be wired or wireless;
    and a watermark extractor. The watermark embedder embeds a watermark into host
    images to generate a watermarked image, while the watermark extractor extracts
    the watermark from the test image, which can be the watermarked image with without'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# Advanced Watermarking Techniques ■ 27


    attacks. The major requirements of digital image watermarking are recalled here:


    +   1. Robustness: The watermarking technique must protect owners'' data against
    any manipulations and has to be robust.


    +   2. Imperceptibility: After insertion of the watermark into host data, the
    visual quality of the host data should not be affected much; that is, the watermark
    should not be perceptible.


    +   3. Embedding capacity: The watermarking technique should allow hiding of large
    watermarks (Banerjee, 2015).


    The watermarking techniques are major developed in two processing domains: the
    spatial domain and transform domain (Borra and Lakshmi, 2015). The spatial domain
    techniques are easy to implement but provide less imperceptibility as the host
    image pixels are directly modified. Transform domain watermarking is complex but
    provides more robustness than spatial domain watermarking. In all the transform
    domain techniques, the host image is converted into the frequency domain using
    various discrete cosine transform (DCT), and discrete wavelet transform (DWT)
