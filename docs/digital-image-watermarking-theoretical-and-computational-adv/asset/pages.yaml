    # 2.7 COMPRESSIVE SENSING AND QR

    DECOMPOSITION METHODS


    Around 2005, researchers introduced a new signal processing theory based on the
    sparsity property of a signal. This theory is known as compressive sensing (CS)
    (Donono, 2006; Candes, 2006; Baraniuk, 2007) and its application to watermarking
    was introduced by Sheikh and Baraniuk in 2007. This theory was used to provide
    security by adding two processes—CS-based encryption and CS-based decryption—to
    the conventional watermarking approaches. The necessary condition for the CS theory
    to an image is that the image must be sparse in its own domain. Thus, first the
    watermark is converted into its sparse coefficients using image transforms, such
    as DFT, DCT, DWT, and SVD, for the generation of sparse coefficients of the watermark.
    The drawback with encrypting a watermark before its embedding is that the computational
    time is increased. This technique is mainly used for copyright authentication
    and detection using identification of multimedia data (Sheikh and Baraniuk, 2007;
    Valenzise et al., 2011; Zhang et al., 2009; Raval et al., 2011; Fakhr, 2012; Tiesheng
    et al., 2013; Thanki et al., 2017, 2018). The CS theory can be used to encrypt
    a host image before the watermark is embedded into it.


    QR decomposition decomposes a matrix into an orthogonal matrix and a triangular
    matrix. QR decomposition of a real square matrix A is represented as $A = QR$,
    where Q is an orthogonal matrix (i.e., $Q^TQ=I$) and R is an upper triangular
    matrix. If A is nonsingular, this decomposition is unique. There are two important
    characteristics of a matrix obtained by QR decomposition (Wang et al., 2016):


    +   The value of the first row of elements of the R matrix is larger than that
    of the elements of another row, indicating that the first row has more energy
    and hence the R matrix determines the nature of the original image.'
  merge: -1
  img_proc: true
