    3.4.1 Image Watermarking Using Ant Colony and Bee Colony

    Ant colony optimization (ACO) is the most widely used and best swarm algorithm
    (Dorigo et al., 1996) and is based on the movements of ants in the jungle. It
    refers to indirect communication approach within self-organization system via
    each class modifying their own environment. By modeling and simulating various
    behavior of ants, such as foraging, brood sorting, nest building, etc., these
    algorithms solve complex optimization problems. ACO have three main functions
    to perform: (1) construction of solution process by moving artificial ants through
    adjacent states of problem space using standard transition rules: (2) updating
    of pheromones which update one complete optimal solution: (3) some additional
    actions with regard to global perspective. The advantages of ACO are that it provides
    inherent parallelism and rapid solution and that has many dynamic applications.
    The limitations of this algorithm are that it is difficult for theoretical analysis
    of large scale of ant populations and probability distribution of function changes
    by iteration. Very few watermarking techniques based on ACO algorithm and transforms,
    such as fast Fourier transform (FFT) and discrete wavelet transform (DWT), are
    developed (Loukhaouka et al., 2011; Al-Qaheri et al., 2010). The average PSNR
    achieved with existing ACO-based watermarking techniques is around 35 to 54dB.
    The computational time of these existing techniques is not mentioned in the literature.
    The payload capacity of these existing techniques is less.


    Bee algorithm (BA) is inspired by different characteristics of honey bees, as
    movement or dancing (foraging behavior) of honey bees in nature. In virtual bee
    algorithm (Yang, 2005) pheromone concentrations are linked directly with optimization
    problem function. The artificial bee colony (ABC) algorithm Karaboga, 2005) considers
    three types of honey bees: onlooker bees (observer bees), employed bees (forager
    bees), and scouts, all of which are available in the colony. This algorithm uses
    the transmission ability of a bee in order to find optimum locations or paths.
    paths and The optimization problem is related to finding optimal routes and paths
    and is solved by a combination of ant and bee'
