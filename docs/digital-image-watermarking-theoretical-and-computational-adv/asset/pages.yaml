  md: '# 56 Digital Image Watermarking


    algorithms, where the extraction of input features and training of the model is
    done manually, deep learning does everything automatically. While ML models can
    be easily run over low-performance graphics processing units (GPUs), deep learning
    models demand high-performance GPUs for their operation. ML provides good results
    for small datasets, while deep learning techniques are good at dealing with very
    large datasets. The accuracy of the ML model is limited, while that of the deep
    learning model is broader.


    The performance of classifiers designed using ML algorithms is measured by quality
    parameters such as accuracy, specificity, and sensitivity. The accuracy gives
    the probability that the classification test is correctly performed. The specificity
    gives the probability that the classification test has a negative value. The sensitivity
    gives the probability that the classification test has a positive value. The equations
    for these three parameters are given


    ```

    Sensitivity=\frac{True\_Positive}{True\_Positive+False\_Negative} (2.7)

    ```


    ```

    Specificity=\frac{True\_Negative}{True\_Negative+False\_Negative} (2.8)

    ```


    Accuracy


    ```

    =\frac{True\_Positive+True\_Negative}{True\_Positive+True\_Negative+False\_Positive+False\_Negative}
    (2.9)

    ```


    Where False\_Negative gives incorrectly classified negative values, False\_Positive
    gives incorrectly classified positive values, True\_Positive gives correctly classified
    positive values, and True\_Negative gives correctly classified negative values.


    The margins allowed for positives and negatives depend on the application. For
    example, in e-commerce applications, achieving zero false-positive rates is more
    important than achieving higher false-negatives rates. Plots of false-positive
    rate versus true-positive'
  merge: -1
  img_proc: true
