- pgno: 147
  md: '# Applied Examples and Future Prospectives


    NAL WATERMARKS ARE MOST visible and found on currency, postal stamps, passports,
    bank notes, paper documents, etc. In the early days of invention, digital watermarking
    was limited to proving the copyright owner of intellectual property. Later, with
    the rapid use of the Internet, digital watermarking found its employability in
    a wide range of applications, such as e-advertising, e-delivery, e-governance,
    e-education, e-voting, military, covert communication, telemedicine, web publishing,
    digital forensics, digital library, robotics, hardware/chip protection, device
    control, legacy enhancement, media file archiving, computer programs, real-time
    audio/video, etc.


    Digital watermarking protects information and is capable of detecting illegal
    use of proprietary data. A robust invisible digital watermark is imperceptible
    information hidden intentionally by the owner of the image into the host image
    so that the extraction of information at a later stage helps for various purposes,
    such'
  merge: -1
  img_proc: true
- pgno: 148
  md: '# 134 ■ Digital Image Watermarking


    as copyright protection, authentication, ownership proof, copy and usage control,
    fingerprinting, tamper detection/evidence, transaction tracking, and broadcast
    monitoring (Suresha and Swamy, 2012; Suresh et al., 2012, 2016). The requirements
    of any watermarking system depend on the type of application. This chapter discusses
    various applications and possible requirements of watermarking in the areas of
    telemedicine, remote sensing, military, and industry.


    # 5.1 APPLICATIONS OF WATERMARKING


    A DRM system recommended watermarking for various applications with variable levels
    of robustness and other requirements. A few applications of digital watermarking
    are discussed in this section.


    +   - Owner identification


    Proof of ownership is achieved by embedding watermarks on the images published
    on the Web, which probably conveys information about the author and/or source
    of the image to convey the ownership and to claim/resolve the ownership rights.
    This application requires the watermark to be robust, unambiguous, and resistant
    to the addition of additional watermarks by adversaries. Ex: Digimarc System.


    +   - Copy protection


    Illegal copying/downloading of images over networks can be prevented by the application
    of copy never/copy once watermarking. Ex: DVD system.


    +   - Fingerprinting/Copy or usage control


    Copy protection is extremely difficult in open and distributive systems. Illegal
    violation of licence agreements/copying/usage/redistribution of images by the
    authorized users over open networks can be prevented or identified by'
  merge: -1
  img_proc: true
- pgno: 149
  md: 'fingerprinting each image copy with a unique identifier. The main requirement
    of fingerprinting is robustness to collusion attacks. Ex: Divx System, theater
    identification from pirated copy.


    +   - Data authentication and integrity/Tamper detection


    Data tampering is very easy and should be detected particularly for digital forensic
    applications. The signatures/header/metadata does not indicate the changes done
    to the images. Fragile watermarking, where the watermark disappears when data
    is modified, exhibits very low robustness and is preferred in identifying if the
    data is intact. Tamper detection is crucial when dealing with applications involving
    medical, military, and satellite imagery.


    +   - Broadcast monitoring


    Watermarking can be used to monitor the broadcasting of images as a solution to
    royalty and marketing issues.


    +   - Transaction tracking


    The invisible watermarks can be inserted into images to keep track of transactions
    in e-commerce applications. It is a type of remote triggering during distribution.


    +   - Content archiving/Filtering/Classification/E-commerce


    A unique digital watermark can be inserted into images so as to get them identified
    easily for classification and archiving purpose.


    +   - ID security


    Identity cards and documents are often stolen, copied, counterfeited, altered,
    or regenerated by attackers. Identity cards can be scanned to detect watermarks
    for authentication, detection of fraud, forensic analysis, and tracking.'
  merge: -1
  img_proc: true
- pgno: 150
  md: '# 136 ■ Digital Image Watermarking


    # 5.2 WATERMARKING IN TELEMEDICINE


    Rapid growth in Internet and communication technologies and the deployment of
    digital picture archiving and communication systems (PACS), hospital information
    systems (HIS), and radiology information systems (RIS), allowed the invention
    of telemedicine, which includes sharing and exchange of expertise, radiological
    images, and electronic patient records (EPR), among several entities (Thanki and
    Borra, 2018).


    EPRs and medical media are digitally generated and transmitted over open networks
    as part of telediagnosis, teleconsulting, telesurgery, home monitoring, emergency
    treatment, and medical education. These documents are very personal and include
    crucial information about patients, hospitals, diagnostic centers, doctors, which
    are to be digitally authenticated and verified for assuring confidentiality, authentication,
    and data integrity. With present-day technological advancements, it is very easy
    to intercept, copy, track, and modify the medical data. Hence the secure transfer
    of data plays a crucial role in facilitating the benefits of the telemedicine
    (Thanki and Borra, 2018; Dey et al., 2016; Bose et al., 2014; Chowdhury et al.,
    2014).


    The digital imaging and communications in medicine (DICOM) standard recommended
    recommended cryptographic techniques, such as encryption, digital signatures,
    and hashing functions, for providing identity and authenticity (Thanki et al.,
    2018). Since secure cryptography cannot provide protection after decryption, data
    hiding and watermarking methods are suggested, particularly for identity authentication,
    privacy concerns, and ownership verification. The digital signature stored in
    the header of the DICOM image can be easily removed or modified by adversaries,
    thereby affecting its authenticity and integrity. This is due to the fact that
    DICOM has limited its recommendations to the confidentiality of the header but
    does not recommend any for ensuring the authenticity or integrity of the header.
    Apart from robust watermarks, fragile watermarks can be used for tamper detection
    and data'
  merge: -1
  img_proc: true
- pgno: 151
  md: 'integrity. Hybrid methods, such as crypto-watermarks, address most of the security
    issues and ensure that the exchanged medical images belong to the right person
    and organization, that the data is not manipulated, and that the data is accessed
    by authorized people.


    Most of the medical image watermarking algorithms defined in the literature are
    irreversible, lossy in nature, and permanently degrade the crucial content useful
    for diagnosis while embedding the watermarks (Borra et al., 2018; Chatterjee et
    al., 2018; Dey et al., 2012, 2017a; Banerjee et al., 2015; Biswas et al., 2013;
    Pal et al., 2013; To overcome these limitations, region of non-interest (RONI)–based
    watermarking techniques and reversible watermarking techniques, which can restore
    the lost data, are developed (Dey et al., 2017b). Hash functions calculated from
    the region of interest (ROI) of medical images can also be embedded as an additional
    watermark. Embedding multiple watermarks in medical images enhances security and
    flexibility, allows detection of tampering, and reduces the bandwidth and storage
    requirements. However, embedding of multiple watermarks in a single medical image
    degrades the quality and affects the image''s ability to survive against attacks.


    # 5.3 ROLE OF WATERMARKING IN nREMOTE-SENSING MILITARY


    Modern remote sensing and space technologies made it possible to acquire lots
    and lots of images per second. The Earth observation satellites collect data from
    Earth remotely and transmit the data to an Earth station, which is then processed
    and maintained in a database for archiving, viewing, and purchasing. These images
    may further be analyzed and interpreted for decision making in various scientific
    or commercial applications, such as weather monitoring, area observations, digital
    elevation models, land cover, vegetation, soil moisturizer, defense and so on.'
  merge: -1
  img_proc: true
- pgno: 152
  md: '# 138 ■ Digital Image Watermarking


    Satellite images are mostly acquired in multiple spectra by specially designed
    sensors, which are very expensive and involve complex installation procedures
    and post-processing. Multispectral images are part of big data. Satellite images
    and aerial imagery are rich sources of information and may contain confidential
    data related to military and war fields, apart from commercial data. Information
    hiding in remote sensing should be handled extremely carefully, the data is very
    sensitive. These highly sensitive images are prone to leakage and are to be protected
    with greater levels of confidentiality and security. It takes more time to encrypt
    these images and the key management is so tedious. Hence, it is very important
    to protect acquired images from misuse, illegal access, and usage, as well as
    protecting the copyrights. Secure storage, maintenance, archiving, and transmission
    of these remotely sensed images from unauthorized personnel is a challenging task.
    Traditional watermarking techniques developed for images acquired in the visible
    band cannot be directly applied to satellite images as they are multispectral
    and hyperspectral images and can even have a raster data structure. Hence, a crypto
    watermarking technique is most suitable for these images.


    The crucial requirements of watermarking techniques when applied to satellite
    images are imperceptibility, lossless embedding, the capacity to extract the watermark
    blindly, the ability to watermark region of interest and integrity of data. Robustness
    to compression, noise, and filtering is sufficient in most of the applications.
    It is important that the watermark embedding should not affect the image''s classification,
    accuracy, matching, and measurements. The watermark should be able to be detected
    at multiple resolutions. The reversible watermarking schemes are widely used in
    military applications where copyright protection or ownership authentication is
    required. The watermark and the original image are extracted from the watermarked
    image.'
  merge: -1
  img_proc: true
- pgno: 153
  md: '# 5.4 INDUSTRIAL AND MISCELLANEOUS APPLICATIONS


    Product designs and digital media are forms of intellectual property (IP) and
    are a result of valuable effort. Hence, mechanisms that protect the rights of
    IP producers and owners are in considerable demand and are of great interest.
    Physical layout designs that involve routing and placement, are very sensitive,
    and must be resistant to tampering, as any changes made to them lead to adverse
    effects on design productivity and on the market. Watermarking addresses IP protection
    by tracing unauthorized use, duplication, and tracking.


    Very often people scan their personal documents and identity cards and make digital
    copies before saving and carrying. Identity thieves constantly try to misuse personal
    data. Preparatory activities to thwart such attacks include encryption, digital
    signatures, access controls, and watermarking by companies issuing the identity
    cards.


    It is necessary that watermarking techniques applied to IP and identity card protection
    include features such as, invisibility, persistence, data integrity, robustness,
    enforceability, and security. Furthermore, the watermarking process should retain
    functional correctness and component protection with a minimal overhead cost.


    # 5.5 FUTURE PROSPECTIVES


    A lot of research has been done in the area of digital image watermarking and
    its application areas in the last twenty years, a major focusing on copyright
    protection and ownership authentication of proprietary images, digital photographs,
    digital artworks, industrial designs, product models, medical images, remotely
    sensed images, etc. The development of intelligent watermarking, is adaptable
    and involves less manual intensive-ness. However, some problems still persist
    and will need to be addressed in the future. These issues are listed below:


    +   - In traditional watermarking methods, which are irreversible, the main challenge
    is to avoid compromising robustness, capacity, and imperceptibility.'
  merge: -1
  img_proc: true
- pgno: 154
  md: '+   Watermarking methods that can simultaneously ensure integrity, confidentiality,
    and authenticity are of great interest.


    +   The techniques that involve segmentation of an image into region of non-interest
    (RONI) and region of interest (ROI) have limitations with respect to the choice
    of region for watermark embedding. If watermarks are embedded in ROI, the crucial
    information gets degraded. On the other hand, the watermark size should be very
    small if they are to be embedded in RONI.


    +   Although reversible watermarking maintains the original quality of images,
    it has limitations related to payload capacity, computational complexity, and
    time.


    +   Standard encryption algorithms cannot be utilized for multi-spectral images
    due to their sensitiveness and characteristics. Due to the high-volume of demand,
    watermarking satellite images is complex in terms of time and key management.


    +   Watermarking physical designs which are composed of complex structures, such
    as routing, placement, vertex ordering, and graph coloring is a very challenging
    task as even a slight change can lead to design failure.


    +   High-speed real-time watermarking with less computational complexity would
    be both timely and useful.


    +   The development of standard databases for testing the performance of image
    watermarking is required.


    +   Standardization of digital watermarking is required.


    +   The development of intelligent watermarking techniques is needed.


    +   The applicability of deep learning to watermarking needs to be explored.'
  merge: -1
  img_proc: true
