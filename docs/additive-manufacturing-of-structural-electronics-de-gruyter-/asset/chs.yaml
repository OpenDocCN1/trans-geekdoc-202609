- "# 结构电子设备的增材制造 (De Gruyter STEM)\n\n\n\n\n\n\n\n\n\n# 概述\n\n\n\n# 前言\n\n亲爱的读者：\n\
  \n本书介绍了迄为止广义电子增材制造领域的重大进展，涵盖了各种功能性材料和技术。书中介绍的元素按照工作流组织：从增材制造方法开始，介绍有趣的且快速发展的打印电子技术、结构电路的替代制造方法、各种增材制造材料的适应与应用，最后以挑战和展望结束。\n\
  \n编写此类书籍的意图是提供一份主题明确且描述详尽的作品，而非正式的百科全书式描述，同时基于大量的科学资源，供读者进一步探索。在这里，我重点介绍了许多代表性的科学文献报告，以及选定的工业研发方法，以尽可能地描绘出该领域的现状。由于已有许多针对增材制造定制的材料和结构的电学和机械性能的研究，包括大量的纳米材料，我特别强调了那些细节较少但从实用角度来看更有趣的话题，即在电子及相关领域的潜在应用，例如生物医学应用、新材料或最终的“4D\
  \ 打印”。\n\n\n\n\n本书的主要目标是分析增材制造、电子技术以及打印电子技术的发展，这些领域在一个被称为`3D 打印结构化电子设备`的新研发方向上产生了协同效应。所有这些领域对现代技术和工业的发展具有重大影响。因此，在详细介绍电子增材制造的终极目标之前，向读者介绍所有这些主题至关重要。对增材结构化电子主题的需求，源于在关于`3D\
  \ 打印`、纳米材料或打印电子技术的实际或潜在应用的报告浪潮中，观察到的巨大且日益增长的兴趣。虽然这实际上与利用新材料卓越的电子、机械、热学或光学性能的高可能性有关，但大部分信息与发表在阶段的研究有关，随后由媒体传播，这些研究暗示了几乎无限的应用可能，激发了对可能彻底改变我们技术或科学世界的应用的想象。读者需要意识到，当我们试图将科学研究中提出的这些独特特性常规地应用于工业的大规模应用中时，将会遇到许多问题。毕竟，随着文明的发展，我们已经学会了引入合成材料、选择其属性、构建结构化且可预测的宏观结构的新技术，并学会了为了大规模工业解决方案而扩大工艺规模。增材结构化电子也将如此，但所需的时间比媒体所呈现的要长。除了现有的研究方向和应用外，书的最后一部分介绍了与增材制造相关的最新研究成果，激发了\
  \ 3D 打印结构化电子在新兴技术中的潜在应用。通过这种方式，我希望展示未来电子应用和其他工业实施分支的发展，并阐述我们可以寻找新发现和突破的研究及技术领域。\n\
  \n本书不仅应该让具有数学、物理、化学和材料工程知识的研究生能够读懂，而且对于那些来自机械、电子或材料工程其他研究领域的科研人员也应该很有用，他们正在寻找跨学科的灵感，以促进其领域新研究方向的发展。如果读者在读完本书后，改变了对增材制造的认知，将其视为一个涉及现代世界所有研究方面的领域，那么这一目标就能实现。虽然这里描述的主题是一个新的范式转变，但仍处于初始开发阶段，本书旨在对这一感兴趣领域提供一些启发，并介绍其起源、可用工具和探索方向。这一切都是科学文献中描述的当前先进成就的元素，以及进入市场的公司的新兴解决方案或概况，包含了所有相关的挑战和前景。熟悉电子技术的读者将看到发展的新方向，而熟悉打印电子方法的读者将看到增材制造的更广图景和可能的新进展方法，而增材制造领域的专家将有机会探索其成熟技术的新可能方向。这一目标并不一定在“从封面到封底”阅读这本书的过程中实现。各个章节的编写经过设计，可以有选择地阅读，并作为该主题进一步研究的参考。在这方面，它也可以被教学人员用作新电子技术课程的教材，或作为材料工程应用于增材制造的案例。在文中，我包含了对许多文献研究的引用，这些研究更深入地涉及了涵盖的主题，对于希望学习比本研究所包含的更多细节的读者推荐。这是由于我深信，不可能包含满足所有读者的描述。这与所述研究领域的特殊性也有关，这些在研究方面是开放的章节，而且在本书开发和出版期间产出的许多最新研究未包含在书中。本研究基于我在过去十年在增材制造、纳米材料和打印电子领域研究中积累的经验。\n\
  \n# 致谢\n\n这项工作得到了波兰科学基金会的支持，项目为“用于结构化电子的功能性异相材料”（First TEAM/2016-1/7），由欧盟根据欧洲区域发展基金共同资助；并得到了华沙理工大学机电学院计量学与生物医学工程学院的支持。\n\
  \n# 1 引言\n\n如今电子设备无处不在，作为处理信息的辅助系统，是我们日常生活中不可或缺的元素。它们已成为现代社会生活的必需品之一，从娱乐到医疗保健，从军事设备到玩具，从家用电器到太空船。在过去的几十年里，计算机和智能手机等电子设备改变了我们日常协作、通信、游戏甚至生活的方式。与这些快速发展的技术集成在一起的，是对材料、组件、系统以及更新、更复杂且高效的制造工艺持续发展的需求。最初，电子主要用于军事和医疗系统，后来引入家庭和娱乐领域。随着时间的推移，人们非常重视处理日益增加的信息。为了满足几十来的这些需求，电子发展的主要方向集中在提高组件和电路的性能上。在早期的\
  \ 60 年代，电子发展的先驱格雷登·摩尔提出了一种定律，预测通过集成电路上晶体管数量的指数级增长来实现电子性能的持续提升，被称为`摩尔定律``[1]`。在过去的十年里，我们反复接近这一原则的极限，目前重要的限制是达到了微型化的物理极限（原子尺寸）以及集成电路产生的热量耗散日益严重的问题`[2]`。这在今天特别相关，因为我们可以在各种产品中找到电子设备。它不再仅仅是电视、计算机或电话等多媒体和通信设备，而是存在于大多数新家电、汽车甚至自行车中的整个电子模块。鉴于这些现象，电子领域开发研究的建议方向是开发新型的电子设备，以便它们能够更容易地应用于日益要求的应用中。这项研究的结果是出现了一系列新的电子分支，例如弹性、打印、有机电子或最终的\
  \ 3D 打印结构化电子设备。但让我们从头开始。\n\n\n\n\n传统的电子学方法，即我们周围的大多数电子设备，是由所谓的传统电子制造方法制造的电气和电子元件及电路组成的。这些制造方法的程序非常复杂，由一系列减法（极少使用加法）工艺组成。最常用的方法包括光刻、刻蚀、掩膜、物理气沉积和化学气相沉积或激光烧蚀\
  \ [3], [4]。此类生产程序通常涉及昂贵的无尘室和受控的条件。\n\n几乎所有电子设备最基础的元件是`印刷电路板 (PCB)`。它是任何电子设备或系统中最核心的组件之一，作为相应的电路，它被焊接或其他连接方式（粘粘剂、键合等）作为安装和连接所有其他电气元件的基础元素。导电路径由高导电金属制成，通常是层压在电缘基板上的铜箔，该基板通常由复合材料制成，如`环氧玻璃纤维\
  \ (FR-4)`或`酚醛纸 (FR-2)`，由于其成本低、机械、电气和热性能良好，它们是最常用的`PCB`基材。由于在电缘基板上具有导电路径，我们可以根据导电路径的数量和方向区分电路的主要类型：单层、双层和多层`PCB`。随着`PCB\
  \ 电路`层数的增加，我们可以显著提高电气元件的封装密度，从而在相同的体积空间内增加系统的功能性。当然，这是以多层`PCB`更高的价格为代价的。一个由`PCB`和贴装元件组成的典型电子电路板如图图\
  \ 1.1 所示。\n\n\n图 1.1 贴装电子元件的 PCB 电路。\n\n本书侧重于 3D 打印结构电子学主题，同时也涉及打印电子技术。在这里，我们处理`印刷电路板`这一术语，当它与上述加法技术并列时，非常有误导性。在`PCB`的制造过程中，尽管“打印”一词出现在这些电路的名字中，但并没有使用打印或加法技术作为制造的关键要素。例如，双层`PCB`的一般制造过程描述如下步骤所示：\n\
  \n*   在电缘基板上进行`铜箔压合`，\n*   最终 PCB 的`形状切割`以及孔和过孔的钻孔（加工工艺），\n*   导电过孔的`额外电镀`，\n* \
  \  路径和其他元件（焊盘、天线等）的`光刻图案化`，\n*   电路的`化学刻蚀`。\n\n此外，还有阻焊图案化和信息元素的打印（`PCB`唯一的打印工艺），在整个过程的中间还有额外的清洗、预处理和表面处理步骤。正如我们所看到的，只有标记、元件放置及其名称等信息与实际的打印过程有关，但这与主要的电路目的关系很小。更复杂的半导体集成电路（IC）制造过程也涉及许多类似的步骤，如掩膜、显影或刻蚀。少数加法工艺涉及导电路径或电缘层的真空沉积，但这与本书后几节描述的选择性加法制造相去径庭。关于`PCB`和`IC`制造的详细信息，建议读者参考前文提到的手册或涵盖电子技术制造基础的相关手稿。\n\
  \n但我们来这里不是为了详细阐述传统的电子技术。虽然这一技术领域随着越来越多令人瞩目的成就而不断发展，但科技世界继续进步，其中一个显示出巨大增长和创新潜力的领域是替代性电子制造领域。在这里，加法技术在创新中起着关键作用，能够在柔性基板、非平面表面或嵌入结构元件中实现新的制造格式，为新的设计理念开辟了可能性，简化了生产流程并引入了个性化能力。在这些创新方法中，全\
  \ 3D 打印电子是最有前景的技术，它允许将电子电路完全集成到设备结构中。在实践中，这将允许设备制造的新方法，并开发出一种同时产生电子和机械部件的系统，这对于目前的方法来说几乎是不可能的。但公平地说，需要提到的是，对于具有无源和有源元件的`PCB`，也在探索嵌入或埋入元件的想法。\n\
  \n# 2 增材制造\n\n## 2.1 概述 概述\n\n增材制造（AM）通常被用作伞术语，描述各种能够制造空间对象的新型制造技术。虽然它通常指的是三维物体，因此得出了流行的名称“3D\
  \ 打印”，但它同样适用于二维对象的制造程序。在两种情况下，这都是一种基于层的方法，结合了材料连接而非减法。美国材料试验协会（`ASTM`）在`ISO/ASTM\
  \ 52900:2015`中的定义指出，这是“通过连接材料从 3D 模型数据制造物体的过程，通常是逐层” [5]。这个定义结合了三维对象的计算机辅助设计（`CAD`模型）以及根据生成的切片代码进行计算机控制制造，导致材料沿`Z\
  \ 轴`的顺序沉积 [6]。虽然计算机辅助制造（`CAM`）以减法技术而闻名，但 3D 打印吸收了计算机数控（`CNC`）自动减法工艺的成就，通过添加材料而非移除材料来构建元件。增材制造使用的设备统称为`3D\
  \ 打印机`。尽管各种 3D 打印的工艺细节和参数存在许多差异，但获得最终产品的流程通常非常相似。所有加法技术的一个重要方面是数字打印方法，这在打印行业也以各种喷墨打印而闻名。\n\
  \n\n\n\n在大多数关于增材制造历史的资料中，其起源可以追溯到 1984 年，查尔斯·哈勒（Charles Hull）申请了一种“生成三维对象的系统”专利，并将其命名为“光固化”（`SLA`）[7]]。查尔斯后来创立了第一家\
  \ 3D 打印制造公司——3D Systems，该公司持续制造 3D 打印设备。我们可以争论，这究竟是增材制造的黎明，还是 3D 打印历史上最重要的一步。最广为人知的\
  \ 3D 打印技术可能是由斯科特·克鲁姆（Scott Crump）于 1988 年开发的熔融沉积建模（`FDM`），这是他公司 Stratasys 的基石，而该公司是增材技术领域的市场领导者[8]]。此外，德克萨斯大学的学生卡尔·德卡德（Carl\
  \ Deckard）在 1986 年开发的选择性激光烧结（`SLS`）技术[9]为 3D 打印的工业应用建立了里程碑，例如选择性激光熔化（`SLM`）、直接金属激光烧结（`DMLS`）或电子束熔化（`EBM`），这些都是制造高质量可靠金属部件的核心技术，性能有时优于其他已知生产方法。但在查克·哈勒之前，就存在增材制造的发明者或远见家，例如岛田英彦（Hideo\
  \ Kodama）在 1981 年描述了一种激光束固化过程[10]；大卫·琼斯（David Jones）在 1974 年的短篇中描述了一个类似 SLA 的过程[11]；约翰斯·戈特瓦德（Johannes\
  \ Gottwald）在 1971 年申请了液体金属挤出机的专利[12]；斯坦斯瓦夫·莱姆（Stanisław Lem）在 1955 年的一部科幻小说中描述了\
  \ 3D 打印过程[13]；或者其他科幻作家默里·莱因特（Murray Leinster）在 1945 年描述了一个可以根据图片制作塑料对象的机械臂[14]。最后，在实现三维空间打印之前，打印技术已经使用了几个世纪，它们提供书籍、报纸，或者最近在面对文本数字化的背景下重点关注物流包装。这些在印刷行业中使用的打印技术（将在后续章节中详细描述）也为货物制造提供了一种增材方法。\n\
  \n最初，增材技术是作为一种快速原型方法开发的。本世纪初，随着低成本桌面 3D 打印机的爆炸式增长，3D 打印变得日益普及，从而受到了关注[15]。这增加了人们对增材制造领域的关注，为各种新型打印技术的发展提供了更多动力[16]，[17]，[18]，[19]。得益于此，机械工程中出现了航空航天或汽车等新的专业应用领域[20]，[21]，[22]，[23]，[24]，[25]，但也蔓蔓到了行业之外，进入医学领域用于个性化植入物和假体制造[26]，[27]，[28]；药物[29]，[30]，[31]，[32]；再生支架[33]，[34]，[35]；以及来自活细胞的生物组织和器官[36]，[37]，[38]，[39]。\n\
  \n尽管增材制造仍然是一种相对新的技术方法，但预计它将凭借相对于传统制造方法的优势，彻底改变制造业行业，并在市场建立建立稳定地位[40]，[41]，[42]，[43]。增材制造全球市场的预测增长率为\
  \ 15%（复合年增长率，2015–2025 年在 2021 年超过了 100 亿美元[44]。市场上最大的参与者是北美（42.2%），其次是欧洲（36.5%）和亚太地区（11.5%），应用涉及汽车（40.5%）、航空航天（23.3%）、医学（18.2%）、消费品（13.6%）和其他领域（4.3%）[45]，但新的应用领域正在迅速出现。这是由于增材制造相对于传统制造技术的主要优点，包括：快速原型化降低了产品开发成本和创新的上市时间；无需额外模具或准备即可快速引入修改和新设计；更低的库存成本或更短的供应链；针对个人客户的大规模定制；小批量制造更具成本效益；以及几乎无限几何形状和复杂结构的制造，通过减少零件和组装程序显著提高了集成度，对减轻重量降低生产成本的影响最大。\n\
  \n得益于计算机制造系统的发展，新的直接打印方法成为可能。这种无掩模技术通常被称为数字打印，因为它们不需要制造额外的掩模（如印刷版、丝网或模板）或其他任何特定工具。设计可以直接在`CNC`设备上打印，允许几乎立即应用各种设计，只需应用特定材料（如印刷行业的墨水）。这种直接/数字打印技术凭借其高度的适应性允许增材制造的出现。根据`ISO/ASTM\
  \ 52900:2015`标准，AM 过程可以分为七大类：粘结喷射、直接能量沉积、材料挤出、材料喷射、粉末床融合、片层层和和槽光固化，总结并展示在图 2.1。\n\
  \n\n图 2.1 根据 ISO/ASTM 52900:2021 的增材制造工艺分类[46]。\n\n\n\n\n\n在多年发展中，市场上出现了许多 3D 打印技术，它们的主要区别在于工作原理、使用材料、制造速度或其他优势或在行业中的特定最终应用。目前，我们面临着两种基本的\
  \ 3D 打印技术：喷嘴沉积法（聚合物、墨水）和经过微小改进的批量固化法（液体、粉末，即将粘结剂喷射到粉末上）。在后续章节中，将根据逐层沉积方法和所用材料进行详细的细分类。本文介绍的技术将不会进行详述，尽管这并非本书的主要范围。读者可以通过涵盖该技术领域的综述性论文和书籍的海量资源，熟悉所有增材制造技术的细节。\n\
  \n## 2.1 熔融沉积建模\n\n熔融沉积建模（FDM，是 Stratasys 公司的品牌名称），也称为熔融丝材制造或丝材自由形制造（FFF 项用于开放设计平台），是目前最流行、应用最广泛的增材技术。它属于一组针对熔融材料的选择性沉积技术。该技术的主要原理相当简单，将热熔融或半固体材料通过标准直径的喷嘴挤出，形成单层固化的冷却材料，并将喷嘴在\
  \ `Z-axis` 方向上移动一步以重复该过程生成第二层 [47], [48], [49], [50]。打印机的主要元件是 `3D-axis` 运动系统（有时为\
  \ 4 轴或 5 轴）[51], [52]、打印平台（通常带加热功能）以及由挤出机和加热器组成的打印头 [53]。`CNC` 微控制器用于控制运动机构的移动，主要是\
  \ `XY plane` 中的挤出机头和 `Z-axis` 上的打印平台，并控制其他打印参数，如喷嘴温度、打印平台温度、材料进料速率、冷却因子等。所有这些基础参数（以及许多其他参数）也需要精确的同步。\n\
  \nFDM 过程的详尽描述更为复杂，但与后续所有技术一样，此处将不再进行全面介绍，建议读者查阅文献以获取更多信息。需要考虑的最重要方面是材料沉积（图 2.2(a–d))）。在\
  \ FDM 过程中，丝材（通常是热塑性材料）从线轴输送到电热的挤出机并熔化，从固态变为高粘度态。熔化的丝材在压力下机械地推过喷嘴，压力来自连接步进电进料辊传输的新材料。挤出的热塑性材料在沉积后，通过环境温度或位于喷嘴尖附近的额外风扇进行冷却。通过这种方式，材料逐渐附着在先固化的层上，第一层则附着在打印平台上。打印头的运动、加热器的温度、滚轮处的丝材进料速率或冷却速度是同步的\
  \ [54], [55]。这是一个非常稳健的原理，允许生产标准厚度的层且层间粘合良好，对基底不规则具有很强的抵抗力，但如果控制不当，存在整个层或元件从基底脱层的高风险，导致零件缺陷。它允许制造中等复杂的部件，直到大型组件（图\
  \ 2.2(e,f))）。\n\n\n图 2.2 熔融沉积建模增材制造的不同方法：(a) 基于丝材的，(b) 基于螺杆的，(c) 基于活塞的。(d) 增材制造过程中熔融聚合物的沉积\
  \ [53]。转自 Springer Nature，遵循 Creative Commons CC BY 许可协议，版权所有 2023。(e) 使用 FDM 技术从聚合物原料打印的小尺寸、高复杂度零件。(f)\
  \ 使用大面积增材制造打印的 3D 打印力涡轮叶片 [63]。经 Solid Freeform Symposium 同许许可。\n\nFDM 打印机的 `XYZ`\
  \ 运动学与 `CNC` 铣床并不相似。加热喷嘴位于 `XY plane` 中以执行预设轨迹，与铣床相同。同样的方式定义工艺分辨率：Z 分辨率和 XY 分率，以及额外的最小特征尺寸\
  \ [56]。`Z-axis` 上的分辨率直接与最小层高有关，不应被视为制造精度的主要因素。在大多数 3D 打印技术（如 FDM，或后述的直写喷墨、光固、粉末床和喷射技术）中，该值与驱动打印喷嘴或打印平台的电机和齿轮分辨率相关。这同样适用于决定喷嘴最小水平移动的\
  \ `XY 分辨率`。该参数决定了允许打印的最小水平特征——即最小特征尺寸。此外，这与喷嘴直径决定的特征尺寸直接相关 [18]，在 DM 制造精度时应考虑这两个因素。对于市场上大多数\
  \ FDM 设备，聚合物的最小特征尺寸在 100 µm 范围内，但对于复合材料，由于塑料复合材料的高粘度，可能超过 200 µm [54]。打印速度参数在此由通过喷嘴挤出的丝材长度定义，通常为\
  \ 1–10 m/min [57], [58], [59]。\n\n\n\n\n\n根据定义，该技术使用的主要材料是各种热塑性聚合物，这些材料易发生热熔融 [59],\
  \ [60]。在大多数情况下，热塑性丝胶必须预先通过其他挤出工艺制备，并具有适用于打印机头和加热器的标准直径；但市场上也有相应的 FDM 打印机，它们配备了注塑成型中常见的料斗和螺杆挤出机，允许直接挤出热熔融的聚合物颗粒\
  \ [[[61], [62], [63]]。FDM 加工所需的聚合物种类几乎是无限的。最受欢迎的材料群是丙腈丁二烯苯乙共聚物（ABS）、聚乳酸（PLA）、聚氨酯（PU）、聚酰胺（PA）、聚苯醚砜、聚醚醚酮（PEEK）和聚醚酰胺\
  \ [59], [64]。虽然该技术最初是为了用于从聚合物材料中快速制造原型，但在发展过程中，也引入了聚合物基复合材料，用于制造碳或金属复合材料制成的导电结构\
  \ [65], [66]。\n\nFDM 技术的主要优势是设备结构简单且易于控制，这是引入廉价 3D 打印机（成本仅需数百美元）的主要驱动力；此外，在增材制造技术中，它具有廉价且易于获取的聚合物丝胶以及较高的制造速度\
  \ [15], [59], [67]。一些缺点包括：需要为悬空模型制造支撑结构（这在某些粉末床系统中是不需要的）、如果想将其用于精密电子设备的生产，则打印分辨率较低，且高粘度材料导致喷嘴堵塞的概率较高。然而，该方法在电子领域最大的优势是易于集成多材料打印\
  \ [48], [68]。此外，在许多情况下，适配市用设备会很容易。\n\n## 2.2 直接墨水书写\n\n另一种基于挤出的增材技术是直接墨水书写（DIW）。这种技术与上述的\
  \ FDM 打印非常相似，并包含了许多通用解决方案。它涉及从紧贴表面的喷嘴连续挤出材料，并在层上方沉积。这里的主要区别在于打印材料是粘性墨水而非固体丝胶。这消除了对热熔的需求。储存在容器中（通常为注射器形式）的功能性墨水通过气压力通过针状喷嘴挤出，从而在基底或前一个层上沉积\
  \ [69], [70], [71], [72]。\n\n\n图 2.3 直接书写增材制造的不同方法：(a) 插件式、(b) 气动式、(c) 螺杆式。(d) 凝胶溶液在挤出过程中的固化\
  \ [[72]。经 Springer Nature 许可，版权所有 2018。(e) DIW 打印的压电纳米发电机示例 [[74]。经 John Wiley and\
  \ Sons 许可，版权所有 2019。(f) 使用 DIW 将粘弹性材料沉积到凝胶基质中的嵌入 3D 打印 [[88]。经 American Chemical\
  \ Society 许可，版权所有 2018。\n\n\n\n\n同样，对于 FDM 而言，DIW 打印机由 CNC 控制的 `XYZ` 运动机构组成。其工作原理也非常相似，喷嘴置于\
  \ `XY` 平面上以执行预设的轮廓轨迹，这与 FDM 中的挤出器相同。这些技术之间的主要区别在于，该系统包含了墨水箱和喷嘴（玻璃、金属或聚合物毛细管），用于挤出粘性墨水。这种设置与\
  \ FDM 类似，需要对气压进行精确的控制和关联，即从喷嘴挤出的墨水量与 `XYZ` 运动的位置和速度相对应。压力通常通过气泵或电机驱动的螺杆在活塞上产生。这种组合能够形成高分辨率的复杂且精细的图案\
  \ [73], [74]。[图 2.3] 展示了 DIW 分配系统的示意图和 3D 打印元件示例。这里需要更多的解释，而这种 DIW 系统的描述对于用于膏料、密封剂或粘胶沉积的设备是为人知的，这些材料几乎总是沉积在平面或最多曲面基底上，而不是构建空间三维对象。在经典的\
  \ 2D 沉积中，挤出的胶体在喷嘴尖端形成液面，并通过与基底相互作用润湿使墨水局部附着。在润湿充分的情况下，通过在 `XY` 平面上移动喷嘴并控制施加在墨水压力以及基底与喷嘴之间的距离来完成打印。这种方法足以在基底上进行单层沉积。\n\
  \n挑战在于在曲面基底上打印时保持适当的接触，这通过测量喷嘴与基底之间的距离（光学或接触式测量）或向设备提供精确的基底拓扑输入来实现 [75]。更进一步，使用\
  \ DIW 打印自由形状三维 结构，除了精确控制喷嘴位置和分配参数外，还需要墨水的特殊配方，使其在墨水挤出喷嘴后，在没有支撑基底的情况下仍保持其结构。对于此类尝试，应使用能够在环境空气中保持结构的墨水，通过热、紫外或化学方式活化，或通过溶剂蒸发固化，甚至通过激光烧结。\n\
  \n### 工艺参数与分辨率\n\n与 `XY` 和 `Z` 轴分辨率相关的主要的工艺参数与 FDM 技术相似，这是由于上述运动机构结构上的相似性。标准的 DIW\
  \ 设备能够打印范围非常宽的 500 m 甚至 1 m 的最小特征尺寸 [76]，而且通过混合技术可以实现宽高比高达 ×1000 的高宽比结构 [77]。除了喷嘴直径外，该参数很大程度上取决于墨水\
  \ [71], [78], [79]。线宽主要取决于喷嘴的内径，但也可以通过控制其他参数（如材料挤出率、喷嘴移动速度和喷嘴到基底的距离）来修改 [80], [81]。\n\
  \n此外，随着喷嘴尺寸的减小，单层厚度也随之减小，这为保持喷嘴与基底之间的适当距离带来了挑战，该距离的变化不应超过喷嘴内径的 0.5。这里的打印速度由挤出胶体的体积定义，通常在\
  \ 100–1000 mL/h 范围内 [71], [82], [83]。\n\n### 材料灵活性与挑战\n\n该方法的灵活性在于可应用材料的广泛性。这也比\
  \ FDM 技术在打印特征尺寸上提供了更多机会。用于 DIW 的材料呈悬浮液形式。为了实现极细的线条，重要的是所涂覆材料必须具有正确的流变学。通过调节该参数，墨水将轻松地通过喷嘴，或者需要比喷嘴内径大\
  \ 10–100 倍的尺寸以防止堵塞 [84]。为了保持打印结构，墨水的粘度应该经过精确控制 [85], [86]。在使用低粘度墨水时，通常使用紫外等后处理来固化材料\
  \ [18], [71]，或者引入高粘度凝胶作为支撑基质 [87], [88]。\n\n通常，DIW 在应用材料方面非常多功能且易于制备。粘度值范围很大（10²–10⁸\
  \ cP） [71], [89], [90], [91]。直接墨水打印技术提供了许多优势，包括室温打印以及悬浮液、剪切稀流体、泡沫、复合混合物甚至带有细胞的生物墨水，便于制造自支撑结构\
  \ [92], [93], [94], [95], [96], [97], [98]。对于极精细结构（达到微米级），由于复杂的墨水配方观察到了一些缺点。与 FDM\
  \ 类似，DIW 在 3D 打印电子方面也具有主要优势，即通过多个喷嘴和墨水箱简单实现多材料打印，允许将各种功能集成到一种 3D 打印格式中 [99], [100],\
  \ [101]。\n\n\n\n\n喷墨打印是一种成熟的打印技术，在过去的几十年中被广泛应用于许多领域。毫无疑问，它在人们考虑到 3D 打印之前就已经开发了，但如前所述，所有的打印技术都是增材技术，因此，像喷墨打印这样成熟的技术在这里与其他\
  \ 3D 打印技术一起被介绍。喷墨打印最广为人知的是家庭和办公台式式打印机，这是在纸质基底上对图像和文本进行数字打印最主要的应用。在印刷行业和包装应用中，喷墨打印占了直接打印市场的约\
  \ 60% [102]。这与该技术的主要工作原理有关，其原理相当简单，与之前提到的 DIW（直接挤写）技术非常相似。喷墨打印涉及位于材料正方的打印头形成并沉积微小液滴。通过移动打印头，使液滴重叠并形成一致且均匀的形状，从而创建所需的图案\
  \ [103], [104], [105], [106], [107]。由于形成的是微小液滴，因此需要低粘度的墨水，这些墨水通常含有颜料颗粒、聚合物粘结剂和打印后蒸发的溶剂，从而在基底上留下一层薄的材料。图\
  \ 2.4 展示了 Multijet 3D 打印技术的原理以及用这种方法制造的元件示例。\n\n\n图 2.4 直接喷墨增材制造的各种方法：(a) 热喷墨打印，(b)\
  \ 压电喷墨打印，(c) 连续式喷墨打印。(d) 喷墨沉积过程中液滴形成的代表性光子序列 [115]。经美国化学学会许可转载，版权所有 2009 (e) 用于电感感应应的喷墨打印多层导电线圈\
  \ [122]。经 Springer Nature 许可转载，版权所有 2017。(f) 用 Polyjet 增材技术制造的血管解剖模型。经 Stratasys\
  \ LTD 许可从 [www.stratasys.com](http://www.stratasys.com) 转载。\n\n喷墨技术的详细原理要复杂得多，主要由于多种液滴形成方法和沉积方式。喷墨打印的两种主要沉积方法是连续式喷墨打印（CIJ）和按需打印（DoD）喷墨打印\
  \ [108], [109]。连续法因其高吞吐量和低质量打印而流行，但在增材制造和打印电子领域很少受到关注。在这里，喷嘴喷出恒流的墨水液滴，通过电场时带电液滴被偏向基底以创建打印结果。剩余的液滴被收集槽捕捉并送回墨水容器重复使用\
  \ [108], [109], [110], [111]。更流行的按需打印方法仅在需要时从喷嘴喷出墨水液滴。在这里，还根据打印头中的执行器系统介绍了几种液滴形成技术。最流行和最传统的是热力和和压电系统\
  \ [108], [112]。对于热力和压电两种技术，其主要工作原理相似，因为驱动机构产生压力，将墨水液滴从喷嘴中推出 [108], [109], [113],\
  \ [114], [115]。热打印机在微秒内加热墨水，产生墨水的热膨胀，而压电打印机对压电膜施电压，改变墨水室内的压力。在这两种情况下，这都会从喷嘴推进并排出液滴。液滴的形状和大小可以使用脉冲参数（例如`速率、持续时间、频率`）来改变。\n\
  \n在这里，Multijet 或 Polyjet 技术进入了 3D 打印阶段。乍一看，喷墨方法（在基底上喷射微小液滴并形成薄墨水层）并不是制造自由立空间 3D\
  \ 结构的自然技术。然而，通过打印头在工作平台上涂布树脂并使用紫外光源瞬间固化沉积材料，我们能够轻松地获得一个完成的 2D 层，这引入了 3D 打印的起源。只需要平台下降的下一步，该过程就会重复\
  \ [116], [117]。唯一需要修改的是额外的打印头，用于沉积与主材料不同的支撑材料，该材料稍后可以移除（溶解）。\n\n\n\n\n喷墨技术需要极低粘度的墨水，通常小于\
  \ 0.25 Pa·s [116], [118], [119] 以获得高质量的打印结果并防止喷嘴堵塞 [120]，但通过含有纳米材料的墨水，通过沉积功能性和导电性材料，可以很容易地制造打印电子元件\
  \ [109], [121], [122]。在这些技术中，液滴厚度决定了打印元件的 Z 轴分辨率。可以沉积小至 2–12 pL 的墨滴，产生几微米层或甚至亚米级的尺寸\
  \ [117], [123]。与 FDM 和 DIW 技术一样，XY 分辨率对应于打印头的移动，此外还由沉积墨滴的足迹决定，导致分辨率在 5–100 µm 范围内\
  \ [18], [116], [124]。打印速度由沉积墨水的体积定义，范围在 100–1000 mL/h 之间 [116]。\n\n喷墨技术的主要优势可以使用各种基材、浪费少、低粘度墨水易于适应，以及与其他技术相比具有较高的打印分辨率，这对于高集成电子设备至关重要。最初，数电打印打印（DoD\
  \ printing）最大的缺点是效率低，但这个问题通过增加单个喷头的喷嘴数量得到了解决，多达数千个喷嘴（使用微机电系统技术 MEMS 制造），能够以 1200\
  \ dpi 或更高的分辨率进行打印 [113], [125]。最大的缺点是高载量墨水存在很高的喷嘴堵塞风险。喷墨技术的严重缺点之一是使用低粘度墨水以避免喷嘴堵塞\
  \ [120]，[126]。对于图形打印，这不是一个主要问题，但在电子领域，多个喷嘴连续工作是不可接受的，这会导致信号恶化。另一个问题是保持喷嘴与基材之间的距离，这种距离会影响能量，可能会导致“咖啡环”效应\
  \ [127], [128]。与 FDM 和 DIW 技术类似，喷墨打印在电子应用中非常广泛，得益于对多材料的易于适应 [116], [119]。\n\n##\
  \ 2.4 气胶打印\n\n最后提到的直接打印技术是气胶打印（AJP）。这同样是一种基于墨水的技术，但与喷墨相比，AJP 是一种较新的技术，是为了响应喷墨在某些基材上打印的缺点。它与之前提到的直接写技术有很多相似之处，但材料沉积依赖于气胶而非定义的液滴。气胶形成系统是\
  \ AJP 打印的核心。通常，低粘度墨水被转化为气胶流，并高速从喷嘴中喷出 [129], [130]。首先，在雾化器中形成气胶。该过程可以通过两种方法实现：气动雾化或超声波雾化。前者对于高粘度墨水更有效，后者对于低粘度墨水更有效。\n\
  \n图 2.5 (a) 气胶过程的示意图。(b) AJP 打印的功能墨水（P3HT, ZnO, 离子胶）和五级环的照片。\n\n气胶打印也是基于墨水的技术，因此需要低粘度墨水，允许打印粘度在\
  \ 1 到 1000 cp 之间的溶液和分散液 [130], [131]。在这里，我们在材料选择上比喷墨打印具有更大的灵活性，由于对两种雾化方法（气动或超声）的有效利用：前者对于高粘度墨水更有效，后者对于低粘度墨水更有效\
  \ [130], [132]。更多墨水配方的选择使得可以使用广泛的功能性材料，例如金属纳米颗粒 [133]、碳纳米材料 [134]、陶瓷 [135] 甚至是生物材料\
  \ [136]。\n\n\n\nXY 分辨率由运动学结构决定，通常与 FDM 或 DIW 技术的定位系统相似，尽管非常流行的 AJP 改进方案包含了基底的 6\
  \ 轴定位。最小线密度和宽度（特征尺寸）是空气动力学聚焦流的直径——低至 10 µm。层厚度（Z 分辨率）与喷墨打印相当，仅为几百纳米 [130], [137]。定义为沉积体积的打印速度高达\
  \ 1200 mL/h [138]]。\n\nAJP 结合了上述直接沉积技术的许多优点。其一是使用材料的多样性，甚至比喷墨打印技术更多，并消除了喷墨打印中常见的喷嘴堵塞和咖啡环效应，且适用于各种基底几何形状，同时保持了打印的高分辨率。系统的复杂性是一个主要缺点，导致实施成本高。此外，打印线的形貌（宽度、厚度和粗糙度）高度取决于对工艺参数的精确控制，例如雾化设置、鞘气和载气体的流速\
  \ [131], [137]。但 AJP 在 3D 打印电子应用范围内最强大的优势（其他其他技术均无法实现的）在复杂非平面表面上打印的能力，这是由于喷嘴与基底之间具有较高的间隙（高达\
  \ 5 mm），能够容忍表面的任何不均匀性 [130], [133], [137], [139]。此外，该技术具有在所有方向（包括向上）以及复杂表面上打印的独特能力，例如立方体的正侧或高尔夫球\
  \ [137] 或 [140]。\n\n## 2.5 槽聚聚合 (Vat polymerization)\n\n制造 3D 元素的另一种方法基于材料的选择性固化或结合，而不是选择性沉积。如前所述，市场上第一种增材制造技术是光固化立体，它利用激光对特殊的液层进行逐层光固化。大量的光固化增材技术被称为槽聚聚合（Vat\
  \ polymerization），因为它们在槽或其他容器中使用液态树脂。槽技术通常不用于 3D 电子制造，这主要与导电材料的使用存在问题有关。但这项技术是增材制造市场的关键参与者之一，因此在这里需要提到。此外，近期光固化技术在制造导电结构的应用方面出现了新的观点，这将在后面的章节中简要介绍。\n\
  \n通常情况下，光聚化使用液体单体/低聚物，这些物质在暴露于特定波长的光源时可以固化/聚合。该反应需要一种称为光引发剂的材料，它在光照射下产生自由基，并与单体/低聚物反应引发聚合物链的生长\
  \ [141]。光固化常用的光源是紫外线（<400 nm），但不受限于其他波长，可以根据树脂中特定的引发剂进行选择。这是对槽聚聚合增材制造中所利用反应的通用描述，但每种技术因光分布的使用或额外工艺参数的不同而异。无论本节描述的差异如何，在本书的后续章节中，我将整类光固化树脂基技术统称为\
  \ `VAT` 或 `SLA`，以简化描述。\n\n\n\n\n光引发聚合（VAT）添加剂技术的两种最常用方法是光固化（SLA）和数字光投影光固化（DLP），后者也被改进为液晶显示光固化（LCD）。\n\
  \n### 光固化 (SLA)\nSLA 利用激光束作为光源，通过聚焦系统扫描材料当前层中相应的的横截面面积来使树脂固化。在单层层面上，这一过程与用于制造电子印刷制板（PCBs）的光刻程序几乎相同。接下来，平台移动一个层的高度（即\
  \ `Z` 步进），然后重复该过程。整个层由逐个创建的体元素（`voxel`）组成 [7], [142]。\n\n此外，为了高效地制造固化的 3D 模型，还需要支撑结构，这在打印完成后需要进行额外的修剪支撑后处理操作。由于需要用光学系统扫描整个层面积，耗费了大量时间，SLA\
  \ 的打印效率相对较低。光束聚焦的质量也会影响打印的精度和精确。这些关于速度和聚焦的问题在 SLA 技术的改进型——DLP 中得到了消除 [143], [144],\
  \ [145]。\n\n### 数字光投影 (DLP)\n这是一个非常相似的技术，但 SLA 每次只照射一个 `voxel` 或一条线，而在 DLP 技术中，聚合物是通过投影仪同时照射整个层来固化的\
  \ [146]。数字光处理单元（因此缩写为 `DLP`）是一个由微型镜子组成的矩阵，允许每个像素照射聚合物表面上指定的 `voxel`。该技术的改进版使用了 `LCD`\
  \ 投影仪或掩模，降低了设备成本，并能够获得相相当的结果 [147]。\n\n### 连续液界面生产 (CLIP)\n光引发聚合技术的另一种重大改进是连续液界面生产（CLIP）\
  \ [148], [149]，它也利用了 DLP 方法，但最大的区别在于，模型从树脂中凸出的过程中，树脂聚合是一个连续的过程，而不是步步进阶的逐层制造。\n\n\
  这是通过引入一个透氧窗口实现的，使得窗口和部件之间存在一个微米尺级的未固化树脂层（即 `dead zone`）。沿着连续投影的图像（类似于视频而不是一组幻灯片），部件是稳定地绘制出来的而不是分层生成的，打印速度比传统的\
  \ DLP 快了 100 倍以上 [149]。\n\n### 双光子聚合 (2PP)\nSLA 的另一种改进允许制造亚微米级体元素的微米级组件，即双光子聚合（2PP）\
  \ [150], [151], [152]。该技术也使用激光源——超短红外（IR）飞秒脉冲，聚焦在树脂池中的某一点。这允许在树脂内部而非表面固化极小的 `voxel`，从而实现\
  \ 100 nm 的特征尺寸，但同时受限于极低的 1 cm³ 体积 [16]。\n\n### 体积光引发聚合\n最后提到的是体积光引发聚合，它也利用了与 DLP\
  \ 打印类似的原理，但在这里，照射光在旋转料槽的同时创建一个 3D 对象 [153], [154]。这种方法有时被比作反断层扫描，投影仪将一组图像显示在透明树脂容器中，这样重构的对象就会出现在固化的树脂中。这是目前为止最快的\
  \ 3D 打印技术，宏观物体可以在几分钟内完成 [155]。\n\n\n\n\nSLA 的材料选择非常有限，因为它们都必须是光固化树脂。这种限制在结构元件制造或纯演示模型制作时并不明显，而在光固化树脂内部，我们可以找到许多具有不同物理性能的各种材料，特别是具有定制机械力学性能或广泛颜色的材料。光聚合物的粘度也应该很低（<5 Pa·s），这限制了高填料复合材料的应用\
  \ \\[141\\], \\[157\\]]。同时，由于光固化树脂的化学特性，导电材料或生物活性材料的制造非常困难，有时无法实现，特别是使用紫外线激活的光引发剂\
  \ \\[158\\]]。市场上和文献中出现了越来越多的新复合材料 \\[159\\]]。\n\n最后，与 FDM 或粉床技术相比，VAT 技术在表面平整度上有许多优势，具有更高的特征分辨率和高生产吞吐量，并且可以使用相对成本的设备实现\
  \ \\[149\\], \\[160\\]]。但遗憾的是，SLA 和类似技术结合了增材制造中两个最重要的缺点，这些缺点限制了 3D 打印器件的应用。首先是局限于单一材料打印，在该领域取得突破的观点非常少（某些观点将在随后的章节中介绍），此外，仅基于光固化树脂的材料限制了导电组件的制造。\n\
  \n## 2.6 粉末床技术\n\n除了 VAT 聚合技术外，增材制造市场的另一个重要参与者是粉末类技术，它们也位于选择性材料固化或结合区域，而不是像 FDM\
  \ 那样的选择性沉积。今天，它们在 3D 打印电子元件制造中的应用非常有限。它们具有巨大的潜力，这已经通过它们在汽车和航空航天领域的广泛应用或生物医学医学应用得到了确认。与\
  \ VAT 不同，粉末技术利用固体材料（粉末）。对材料类型几乎没有限制，因为它们可以是任何功能材料组，如聚合物、陶瓷、金属，甚至是更奇特的沙子或糖。粉末床技术与之前提到的\
  \ VAT 聚合技术有许多相似之处，在某些解决方案中，这种改进只需将树脂替换为粉末，并使用更强大的激光进行烧结而非固化。除了激光外，还有其他粉末选择性固化的技术，例如电子束或打印粘剂。所有粉末技术共享一个基本原理：每一层沉积的粉末层都被转换为连续的固体图案，这通过选择性激光烧结（SLS）、选择性激光熔化（SLM）、直接金属激光烧结（DMLS）、电子束熔化（EBM）或在粉末上打印粘剂（粘剂喷射）来实现，偶尔在多喷射熔融技术（MJF）中使用红外灯进行烧结\
  \ \\[161\\], \\[162\\], \\[163\\], \\[164\\], \\[165\\], \\[166\\]]。这些技术技术需要在炉中进行单独的后处理以烧结结合金属粉末，例如\
  \ Metal-Jet 技术 \\[167\\], \\[168\\]]。通用描述（一种 SLS 技术的示例）是：床/台面上的一层聚合物、陶瓷或金属粉末用激光烧结\
  \ \\[165\\], \\[166\\]，之后床回缩；通过滚筒沉积新的粉末层，然后重复该过程。对于某些技术（SLS, MJF），粉末通常支持 3D 结构，不需要额外的支撑结构——它们主要用于\
  \ FDM、SLA 或多喷射技术。在这里，分辨率限制与粉末颗粒的大小以及能量束或墨滴的大小有关，实现的特征尺寸为 50–100 m \\[165\\], \\\
  [166\\]]。与 FDM、SLA 或喷墨类似，XY 和 Z 分辨也与运动学有关（平台的运动、扫描分辨率和光学聚焦，或喷嘴打印图案分辨率）。一方面，粉末组最大的优势之一是材料供应充足，也包括粉末形式的导电金属或其他功能材料。机械性能可比甚至超过铣削或模型技术（SLM,\
  \ DMLS, EBM）。另一方面，某些缺点与打印部件的高孔隙率有关，对于高温激光或电子束工艺必须考虑热应力 \\[162\\], \\[166\\], \\\
  [169\\]]。同样，与 VAT 技术类似，电子器件的缺点是“一次一种粉末”的方法，因此多材料制造的某些尝试将在后续章节中介绍。\n\n## 2.7 其他技术\n\
  \n\n\n\n增材制造家族涵盖了许多用于制造 3D 组件的不同技术。最广知的技术之一是层叠制造（LOM），材料以片材形式存在，通过粘胶剂、压力或热等外部因素将层粘在一起，并用激光或刀具切割图案\
  \ [[170]], [171]], [172]]。这里使用的主要材料是纸张或聚合物箔，因此金属或陶瓷箔也是可能的。LOM 是该技术的示例，证明了与层厚度相关的\
  \ Z 轴分辨率不应被视为决定分辨率的最终因素，尽管这不会直接影响元件的细节。LOM 在电子领域的应用非常有限，因此在带有打印导电元件的单片格式下，它将是打印电子的纯粹示例。\n\
  \n其他值得关注的新兴增材技术包括用于房屋建筑的混凝土挤出[173]], [174]]，它们与 DIW 技术有许多相似之处，只是尺寸大得多；大面积增材制造（BAAM）是是非常大规模的熔融沉积建模（FDM）[175]],\
  \ [176]], [177]]，以及电弧增材制造（WAAM），它结合了电弧焊和 6 轴机器人手臂[178]], [179]]，是一种用于金属制造而非聚合物制造的极大规模的\
  \ FDM。\n\n直接能量沉积（DED）涉及用高功率激光束或等离子弧熔化金属粉末，并将其高速喷射到打印板上[180]]，这听起来与 AJP 技术非常相似，只不过是在更大的尺度上并且应用了高温和熔融金属。最后，液体和熔融金属喷墨、FDM\
  \ 和 DIW 技术[73]], [181]], [182]], [183]], [184]]或混合技术，如复合材料增材制造（CBAM），涵盖了 LOM、粉末床、烧结、喷墨和减材技术[185]]，这证明了增材制造的创新几乎是无限的，我们预计未来几年会有更多突破。\n\
  \n# 3 打印电子\n\n“打印电子”一术是指使用打印技术生产的功能性电子、光电或机电结构和电路[186]], [187]]。它将印刷行业中为人知的经济性批量生产方法与新类功能性材料（包括纳米材料和导电聚合物）的应用相结合。由于材料在基底上的应用性质，打印技术也是一种增材制造方法的一部分。通过这种方法，可以制造几乎任何被动或主动电子元件，如电阻器、电容、电感或二极管和晶体管。通过使用膏料和墨水形式的专用材料，可以在卷筒式应用的薄膜、纸张或织物等柔性基底上制造元件。\n\
  \n打印电子是一个全新的技术领域，但凭借其提供的广泛应用能力，它将在电路制造中发挥日益日益重要的作用。经过几十年的发展，它在研究和实际应用中引起了巨大的兴趣，并成功推动了材料科学和技术的发展。近年来打印电子的发展是由于比传统技术更低成本生产电路的预期，这使得制造轻量化、柔性、薄型、光学透明或一次性的电子元件成为可能。虽然打印电子和打印电路板（PCB）在名称中都带有“打印”一词，但后者与打印技术的共同点很少。\n\
  \n目前对全球电子市场的分析显示，打印电子正在成为更重要的技术之一，并是全球许多研究中心的研究课题[121]], [186]], [187]]。各种预测和分析表明，全球打印电子市场预计将以\
  \ 3.6%的复合年增长率（CAGR）增长，并在 2022 年达到了 266 亿美元[188]]。这种快速增长受到消费品行业、医疗保健、物流、电信、电子、多媒体或能源领域的推动。\n\
  \n用更廉价的替代品取代某些经典电子元件，用具有更高机械韧性的柔性解决方案，为创建全新产品、增加现有电子解决方案的功能以及简化工艺开辟了新途径。然而，使用打印电子的主要目的并不是完全取代目前的打印电路技术或电子活性元件（包括硅半导体结构），而是提供一种与现有技术的互补替代方案。目前打印电路的性能低于半导体结构。在高频运行的集成电路中，硅半导体芯片在需要大规模集成和高性能的高级电子解决方案中仍将发挥重要作用。\n\
  \n打印电子技术可以为低产量和高产量柔性电路、原型系列、一次性电子设备（例如生物化学传感器）、智能服装或小批量生产提供替代方案，且无需模具设备。该技术最适用于生产性能仅为次要参数的电路，并且快速交付时间和低制造成本（无论是单件还是批量生产）起着重要作用[189]]。\n\
  \n\n\n\n\n# 打印电子\n\n顾其名，简而言之，打印电子是印刷技术的应用，通过使用特殊适配的功能性墨水和浆料来制造电子设备。因此，它基于印刷行业中成熟的印刷技术，这些技术通常用于书籍、报纸、包装、图形等的生产。\n\
  \n为了生产打印电子的元件和电路，使用了许多定制的印刷技术，例如：\n\n- 丝网印刷 \\[190], \\[191], \\[192], \\[193\\\
  ]\n- 喷墨打印 \\[194], \\[195], \\[196], \\[197], \\[198\\], 属于幅幅印刷组。\n- 胶印 \\[199],\
  \ \\[200\\]\n- 柔版印刷 \\[201\\], \\[202\\]\n- 凹雕印刷 \\[203\\], \\[204\\], \\[205\\\
  ]], 属于卷筒印刷组。\n\n另一类分类法涵盖了传统印刷技术和上述的数字打印技术 \\[206\\], \\[207\\]。\n\n## 传统印刷技术\n\n\
  传统技术需要物理掩模、版材或模板来通过掩模将材料转移到基底上。这些技术还需要制造图案掩模，通常会引入高昂的设置成本和较长的准备时间。典型的例子是丝网印刷。\n\n\
  ## 数字打印技术\n\n数字打印（已在喷墨打印或 AJP 技术 \\[126\\], \\[133\\], \\[134\\], \\[208\\]中描述过）通过点射/喷射材料滴，在喷嘴不与基底直接接触的情况下从数字数据制造图案。\n\
  \n虽然直接打印意味着通过机械力、流体学张力、电场、辐射等将材料转移到基底表面来产生图案，几十或几个世纪以来已经开发了许多技术解决方案用于生产文本或图形 \\\
  [209\\]。但尽管历史悠久，由于对打印质量的要求更高，印刷并没有很容易转移到电子生产中。图形可以由形成所需图案的点组成，且并不一定需要线条或胶片才能被人眼解读。遗憾的是，电子领域并非如此，必须确保电流的严格物理接触，即使是肉眼无法的打印缺陷会导致断路。这需要定制打印参数并开发新材料，以同时提供更高的打印质量和电性能。值得注意的是，虽然打印电子术语通常也涵盖旋涂、喷涂、浸涂、狭缝涂布、刀刮和棒涂，但它们被用于处理透明电极或大规模光伏电池，易于扩大规模并适应大规模卷筒生产。但在本书中，我们将仅关注用于元件和电路选择性图案化的数字打印技术，这由于选定的\
  \ 2D 打印技术被用于电子 3D 打印而非常重要。\n\n\n\n\n在拥有打印技术的基础上，打印电子技术的第二个要素是呈膏状或墨水形式的材料，通常是有机载体和功能相的复合混合物。导电聚合物溶液可以作为替代方案，它们不包含粉末填充物，因为整个载体体积也充当了功能相。在打印技术（包括打印电子）中使用的主要材料形式是具有各种粘度和流变学特性的液体。液体形式能够高效地在基底上打印或转移材料[207],\
  \ [209]。由功能材料制备的不同层相互打印并重叠，以制造复杂的打印电子器件。这些功能材料可以是有机的或无机的，作为导体、绝缘体、电电质或半导体或其他功能元件（发光、传感等）工作[85],\
  \ [210], [211]。通过适当的材料组合和组件设计，打印电子甚至可以是变形的，这有助于未来未来穿戴电子设备和人体嵌入设备保持舒适性和无形性[80], [212],\
  \ [213], [214]。\n\n可以可以说，几乎所有的电子元件都需要导电电极。在这里，可用材料的范围是最广的[215], [216], [217]。这一切始于大规模的丝网印刷技术，该技术几十年来一直用于生产金属填充物的导电层、带有碳填充物的电阻器以及电电质层[218],\
  \ [219], [220]。\n\n现在，大多数导电材料是由银、铜、金或其他金属合成的纳米颗粒（NPs）和纳米线（NWs）[221], [222], [223],\
  \ [224], [225], [226], [227], [228]，碳纳米管（CNTs）[229], [230], [231], [232], [233],\
  \ [234], [235]，石墨烯片（GNPs）[207], [236], [237], [238], [239], [240]，导电聚合物[241], [242],\
  \ [243]，透明氧化物（TCOs）[244], [245], [246]，纳米材料[85], [247], [248], [249]，以及金属化合物[250],\
  \ [251], [252], [253], [254]。光子器件，如显示器或有机光电极管（OLEDs）和光伏电池（OPVs）[255], [256], [257]，以及纳米材料分散液或共轭聚合物溶液（也用于打印晶体管）[258],\
  \ [259], [260]，更不用说用于一次性电子设备的环保材料[261], [262], [263], [264]或可贴的材料[265], [266]以及可摄入生物电子设备[30],\
  \ [267]。\n\n在大多数情况下，电子产品的最终功能与墨水的物理性质（导电性、光学透明度、弯曲、扭转和拉伸的机械稳定性等）有关。\n\n\n\n\n印刷电子的应用范围广泛，从需要导电层的简单路径、电极或天线[268],\
  \ [269]到复杂的晶体管和集成电路[134], [270]、能量设备[271], [272], [273], [274]以及可穿戴设备[275], [276],\
  \ [277]。常见的应用之一是使用金属浆料打印的射频识别（RFID）电子标签[278], [279]。此外，用于制造光伏电池的印刷电子电路也备受关注。最初，使用丝网印刷在硅基底上制作导电路径，因为作为唯一的接触式印刷技术，它允许在不对基底施加压力的情况下打印，从而减少了硅基底的损坏[280]。但网印也常用于大规模打印使用无机\
  \ `ZnS:Cu` 粉末的电发光结构[281], [282]、带有 OLED 聚合物二极管的发发光显示器[255], [283], [284]、温度和压力传感器[285],\
  \ [286]以及用于化学和生物分析的各种传感器[287], [288]。打印技术也用于光活性导电聚合物的光伏器件制造[289], [290], [291]，即称为\
  \ Grätzel 电池（Grätzel cells）的光电化学电池[292]，以及 `Cu-In-Ga-Se (CIGS)` 层，其特征是具有光伏材料中最高的能量产出率之一[293],\
  \ [294]。目前还有尝试制造印刷有机效应晶体管（`OFETs`）[295]，甚至是印刷非易性随机访问存储器（`NVRAMs`）[296]以及印刷储能设备如电池和电容器[297],\
  \ [298]。使用印刷电子制造的电子元件和电路示例见图 3.1。\n\n![图 3.1 使用印刷电子制造的电子结构示例：(a) 用银浆打印的 RFID 天线，(b)\
  \ 带有碳电极的生化传感器，(c) 柔性基底上的键盘电极，(d) 用于 ROM 结构的印刷电极，(e) 带有 ITO 的 PET 基底上的丝网印刷电发光结构（插图\
  \ a–e 来自[302]），(f) 刚性和柔性基底上的全打印 SWCNT TFT 阵列](graphic/converted/b9783110793604-003_fig_001)\n\
  \n印刷电子技术的优势包括能够制造大面积结构和连续电路、多层电路、与材料柔性相关的机械强度增强、可以在任何类型的基底（包括柔性基底）上进行打印，以及环境方面（如易于加工或制造可生物降解和一次性电路）。最重要的优点之一是传统电子元件的低成本替代方案，也适用于小批量和定制化生产[189]。同时，这也是通过卷对卷（R2R）印刷技术进行大规模制造以及大面积处理（如太阳能电池板或信息显示器）的一种高效方法[121],\
  \ [186], [299]。可以使用广泛的基底，包括刚性和柔性的。最后，材料浪费的减少促进了更环保的电子技术发展方法[300]。同时也存在一些缺点，例如与传统电子技术（PCB\
  \ 或 IC）相比，打印分辨率较低，且相对较高的表面粗糙度和厚度波动会影响性能[[301]。\n\n\n\n\n\n电子发展的历史可以用一个词来概括——集成。电子技术生产链中实现的所有几乎所有发明都集中在尽可能在更小的组件和设备中集成多种功能上。其目标是将更多的组件和更多的功能集成到单一实用设备中，使结构更简单、更高效，同时又不会损害最终应用的其他方面。将电子功能嵌入在封闭部件中具有许多优势：部件和连接更少、组装最少化、重量减轻、对可持续性产生积极影响，并且组件供应链更简单。\n\
  \n不断将更多功能集成到一个设备中的终极示例之一是智能手机。在内部，它基于一台“普通”计算机来运行各种信息工具，如即时通讯、地图、游戏、相机、备忘录、日历，感谢之之还有电话功能，因此得名。事实上，除了更快、更强大的计算机外，智能手机还配备了一整套额外组件，如摄像头组件、传感器、导航系统、额外通信（蓝牙、WiFi）、充电器和电池、有时还有立体声音频、超大显示屏、内存卡/耳机或\
  \ USB 接口等。几十年前，电话还是一个带有拨号盘、听筒和外壳放在桌上的设备。现在，智能手机更加强大，能够执行的操作比指挥中心运行阿波罗任务的 NASA 计算机还要多\
  \ [303]。这一切都是得益于组件集成到单一实用设备中，而这一切又得益于电子的小型化和封装技术的。\n\n但尽管如此，这仍然是将单个组件或专用集成系统安装在“主板”上，并在框架、底盘、外壳或其他任何形式的附加结构部件中。电子学的下一个范式转移是引入新形式，这驱动了依赖新材料的新制造方法的发明。这些将在本书的后续章节中介绍。一些技术进步已经在我们手中，但对于我们的日常生活应用或专门的工作和任务，我们需要新的电子概念。在这里，新形式电子的想法应运而生。让我们问一个问题：如果我们跳过电子技术生产链中的组装步骤，消除昂贵的\
  \ PCB 制造和数百个组件的封装程序，并重新组织生产过程，使设备所需的功能集成到物体本身中，会怎样？这就是“结构化电子”的世界，在这里，机械部件和电气系统之间的界限重叠甚至模糊，日常生活组件内部都集成了电子功能。\n\
  \n### 结构化电子\n\n结构化电子是一个术语，描述电气和电子组件及电路，它们作为结构元件、外壳或其他类型的保护性无功能结构（如车身），嵌入在元件体积内部或共形地放置在表面\
  \ [304], [305]。这种方法减少了制造的重量和复杂性，允许提供更灵活的设计选择，并在不需要时消除刚性 PCB。由于具有增强产品功能、降低生产成本或提供制造定制化设备可能性，结构化电子是航空航天和军事应用、家电器、消费电子产品、汽车工业和土木工程领域一个非常有趣的新技术分支。\n\
  \n结构化电子的实现形式主要通过：将标准几何组件放入机器的剩余空间、剪裁传统组件的形状以适应剩余空间、并在现有元件（传感器、光伏电池）表面添加共形涂层——一种“智能皮肤”、模内成型多层电子（家电外壳或汽车音频），或最后作为承重元件形成（桥梁、房屋、汽车）。通过使用打印和弹性电子可以实现通过添加“智能皮肤”或弹性形状元件来增强功能，但承重或结构元件需要更复杂的解决方案，如层压、模内成型、注塑、铸造或最后的\
  \ 3D 打印（图 4.1(a)）。这不仅是电子产品，而且大多数周围物体、家具线甚至房屋设计和生产的完整范式转移。尽管直到今天，这一具有巨大创新潜力的宏伟愿景在新制造技术和新材料领域仍需要大量的研发工作，本书涵盖了这些内容。\n\
  \n\n\n### 历史与演变\n\n在进入细节之前，让我们回顾此类实现的历史。结构化电子的起源可以追溯到 20 世纪 90 年代末，当时美国国防研究计划署（DARPA）宣布了固态自由形制造计划，并在几年后启动了微纳集成共形电子（MICE）计划，旨在头盔或其他设备的非平面表面生产电子设备、传感器或天线\
  \ [306]。在这个项目中，开发了直接写入平台，允许使用分配打印和气溶喷打印等技术将电子材料应用于复杂的几何形状上 [307]。\n\nMICE 项目背后的辅助目标是响应当时另一个正在发展的概念——物联网（IoT）。这一概念涉及为普通物体添加新功能，以便通过网络相互收集、处理和传输数据。这不仅将使日常生活变得更加便利，还能更好地管理工业生产、城市或进一步促进医学的发展\
  \ [308], [309]。建立了结构化电子电路应遵循的主要指南：\n\n- 集成标准电子组件；\n- 使用聚合物既作为电子电路的基底又作为设备的外壳；\n\n\
  \n\n\n\n-   采用不超过 100 °C 的制造工艺，允许使用常用的聚合物；\n-   以 3D 方式设计电路布局，以便更好地利用设备空间；\n\nMICE\
  \ 计划的一个非常重要的方面是开发出一种技术，该技术能够根据定制设计，在几小时内通过单一工艺生产出成品电路——这种方法源自快速原型技术。在当时，将这一想法应用到电子电路是具有挑战性的，因为需要多种材料，并且需要同时完成电路制造、电子元件安装、连接以及外壳构建的组合方法。该计划还假设制造系统能够应用不同类型的材料，用于制造无源元件（电阻、电容、天线、连接器）和有源元件（光伏电池和燃料电池、电池、传感器）。通过流程的全自动化和消除额外的焊接，预计结构化开发的设备将表现出更高的可靠性\
  \ [306]。此外，这种开发低温固化材料的尝试将允许在几乎任何类型的基底上生产电子电路：聚合物、金属、玻璃、陶瓷、纸张等。该计划提供了许多价值理念和衍生公司，这些将在后续章节中详细介绍。最重要的是，它为开发新形式电子设备以及我们日常生活中实用工具的新功能开启了完全新的路径。嵌入导电迹线和元件的结构化电子电路的适配机会在图\
  \ 4.1(b, c, d)中所示。\n\n但结构化电子不仅像 MICE 计划那样是制造电子设备的增制造方法。通常，这是电子设备与周围所有其他“物品”终极集成的概念。识别结构化电子实现的主要需求源于应用。为组件添加新功能通常是大多数应用的首要需求。然而，其他属性并不总是通用的。虽然在土木工程中减轻重量并不十分关键，在建筑或船只中节省空间并不关键，但这些因素在航天和汽车工业或移动电子领域将发挥主要作用。现在，我们应该问：哪些组件最适合在结构化电子中制造和实现？简单的导电元件、天线、互连、执行器和光伏电池很容易适配到结构元件的体积/表面、移动部件、狭窄空间或弯曲形状上。更大的问题在于功率元件，如超级电容器、电池、燃料电池和电动机。这些元件无法作为表面涂层制造（电容和电池除外），通常它们会占据大量的体积。回答这个问题将引导我们应用结构化电子，甚至定义我们周围哪些元件内部嵌入了电子设备。结构化电子在实践中一个引人注目且并不显而易见的例子是美国明尼苏达州的新的圣安东尼瀑布大桥，被称为“美国最聪明的桥”[313]。旧桥在\
  \ 2007 年坍塌了，因此新桥布满了监测状况的传感器。在汽车行业中，福特和沃尔沃有两个恰当的例子。福特锐（Fusion）顶置控制簇采用模内电子制造，节省了高达\
  \ 40 % 的重量/空间/成本并提高了了可靠性 [314]。沃尔沃和伦敦帝国学院实现的项目是以车身覆盖制造超级电容器，以节省电动汽车中的空间 [315]。\n\
  \n结构化电子的发展催生了许多制造技术。最常见的划分基于电子电路的几何形状（主要是导电路径）及其与基底的关系，并分为共形电子（路径和元件位于设备表面）和全三维结构化电子（导电路径和元件可以隐藏在设备的承载部件或外壳内部）。第一种方法需要为电子设备制造单独的基底，而在全三维技术中，可以通过单一工艺制造出几乎成品的设备。共形方法的一个示例是激光直接结构化（LDS），多年来用于将电气特征集成到\
  \ 3D 表面[316]，所示于图 4.2(a)。通过激光在注塑塑料零件表面激活特定图案，并随后使用无化学电镀进行金属化，这使得每年能够创造数亿个设备，其中天线是最显著的例子。共形和\
  \ 3D 成型的另一种非常好的替代方案是称为模内电子（IME）的中间技术 [317], [318], [319]，它采用两阶段制造工艺：在平坦的可热成型基底上形成电子系统并使用导电胶水贴装元件，然后当设备获得最终形状时进行塑料成型（真空成型或注塑）（图\
  \ 4.2(b-d)）。\n\n\n\n\n结构化电子在提供新功能、使用更少材料以及减少组装成本方面具有巨大优势，但也面临着许多技术困难。最显著的困难是为特定技术（如高温注塑、高载量功能填料的复合材料加工等）定制导电材料和功能性材料。这同样适用于离散元件的集成，例如电阻器或`ICs`\
  \ [310], [311], [312]。需要解决高效且可靠的连接方法，这与特殊材料的使用有关。对于`IME`，整体生产良率至关重要，同时纯粹的装饰质量必须极高，电子电路的制造也必须可靠——如果工艺步骤中的任何一个环节出现问题，整个零件都必须报弃。最终证明，集成既带来了益处，也带来了挑战，我们对组件的期望可能会更高，即既要具有装饰性的吸引力，又要提供电子本身的高效功能。\n\
  \n# 5 打印和结构化电子的材料\n\n推动结构化电子发展的关键方面是功能材料。除了新型和改进的增材技术外，功能材料的进展是最大的驱动力之一，它为单次打印中集成功能性电子元件开启了新的可能性。这在打印电子的发展中尤为明显，当时打印技术已经就绪，但只有新的电子墨水和浆料才是革命的起点。在这里，我们面临着同样的情况。这就是为什么材料是全球科学和工业中心的焦点。\n\
  \n无论采用传统技术还是增材技术，电子电路都需要具有合适属性的材料，主要是导电和绝缘材料，还具有其他功能（即半导体）。在`PCB`中，作为导电材料最常用的是高导电率金属，如`铜`、`银`、镍镍和锡。绝缘体通常是基底，通常由纸质或玻璃纤维层压层而成，并用环氧树脂或酚树脂粘合（例如`FR4`、`FR2`）。电子制造还使用了具有磁性、电致光或半导体属性的功能材料，主要用于单个电子元件。打印电子技术同样如此，其导电材料通常是聚合物复合材料，活性相形式为金属粉末（`银`、镍或铜）以及`石墨`纤维和片材。厚膜聚合物电阻由填充了`碳黑`或石墨的复合材料制成，其中含有细的`碳黑`或石墨粉末，而电质材料是含陶瓷粉末的复合材料（即`BaTiO[3]`）。用于制造特殊结构的材料还包括导热或绝热胶膏、光伏或发光层以及固体电解质等。结构化电子（尤其是\
  \ 3D 打印）在使用`FDM`、`inkjet`、`AJP`或`DIW`时，导电、绝缘和功能墨水、浆料和复合材料也将形成最终解决方案 [321], [322],\
  \ [323], [324], [325]。对于打印电子的材料，除了对其功能电子特性（导体、电电质、半导体等）的要求外，还需要将它们加工成理想的形式，如液体溶液或悬浮液，粘度适应打印技术。材料类型（有机或无机）是次要考虑因素——通常无机材料呈悬浮液（异相组合）的形式，有机材料呈溶液的形式。悬浮液的示例是含有`银`、金、铜等微米和纳米级颗粒的金属墨水和浆料，但可能包含另一种功能相，例如`碳`填料。问题在于，在大多数情况下（除`inkjet`和`AJP`技术外），如果不进行重大修改（如用于`DIW`的丝网印刷浆料）或开发全新的组（用于`FDM`的复合材料），很难将材料从打印电子直接转移到结构化电子制造中。图\
  \ 5.1 显示了适用于 3D 打印结构化电子的功能材料分类。\n\n\n图 5.1 适用于 3D 打印结构化电子的功能材料分类。\n\n## 5.1 导体\n\
  \n\n\n到目前为止，最有利于电子制造的发达的增材制造技术是 `FDM`，它拥有最多样化的材料组合。这种技术利用易于适应的热塑性聚合物和复合材料，因此今天大部分的工作集中在导电复合材料的制造上是理所当然的。这类材料以各种形式已为人一个多世纪，但其通用工作原理和组成保持相似\
  \ [[326]], [327]]。功能相中的导电包体实现了电子导电性，而聚合物（通常是绝缘体）则作为悬浮导电填料的基体。对于`FDM`（可以适配为 `SLS`\
  \ 的复合粉末）等技术，常用的导电填料是金属粉末和各种碳形式，如碳黑、石墨、碳纳米管或石墨烯。使用最广泛且最易适配的材料是含有不同种类碳的复合材料，包括碳纳米材料\
  \ [[99]], [328]], [329]], [330]]。研究正在致力于铜基复合材料的应用，其电阻率可以达到比碳材料低得多的 [[66]]。由于高活性的铜在接触空气时会迅速氧化形成电电质氧化物，因此还考虑了其他材料，如镍或铁/钢颗粒\
  \ [[331]], [332]]。打印电子中最常用的导导体是以墨水和膏剂形式存在的银粉，其价格昂贵，无法用于高负载的聚合物复合材料。这就是为什么它在研究中没有被探索也没有应用于市场。金的情况也是如此，它比银还贵。最受欢迎的导导体之一铝，一种丰富且廉价的材料，在导电复合材料的应用中是最困难的材料之一，因为它表现出与铜类似的活性性质，而且\
  \ `Al[2]O[3]` 是今天电子学中使用的最好的电电质之一。为了在绝缘聚合物中提供导电性，需要达到导电填料的最小要求浓度，这被称为渗透阈值，在本章稍后会详细描述\
  \ [[333]]。导电复合材料相对廉价，并提供了更多样的材料选择，但它们的导电性中等，且高度取决于颗粒的类型、形态和浓度，也会影响打印能力。以导电丝材品牌命名的新复合材料虽然获得了更多关注，但对于消费类电子产品并未提供满意的性能，更不用说特殊应用了。主要的障碍是高电阻率，但在许多情况下，降低电阻率并不能解决所有问题，不用说高效电子设备所需的更高电流密度、更噪声和更高可靠性。\n\
  \n除了固体金属和复合材料外，另一大类是液态的复合膏剂和墨水。大多数金属在室温下是固体，但打印技术要求材料呈液态以便高效应用，而实现这一点最简单的方法是制备分散液。几十年来，电子浆料用于厚膜技术制造电极、电阻和其他组件。最初，此类浆料用于高温工艺（含有玻璃，在\
  \ `800 C` 以上进行烧结层），或作为热敏基底的聚合物浆料或粘粘剂，在应用后通过蒸发溶剂或聚合物交联进行固化 [[218]], [334]]。纳米技术的出现导致了结合上述两种浆料优势的材料的发展。含有金属纳米粉末的材料在`250–300 C`左右的相对低温下进行烧结，这导致了导电率达到纯银\
  \ `60 %` 以上的浆料的发展，它们可以使用在柔性聚合物基底 [[335]], [336]]。或者，除了金属，也有碳基膏。最初，碳黑或石墨材料因为成本低被用作低成本导电层或简单的加热器。随着碳纳米材料的发现，更多关注被放在了这些材料上，它们表现出高导电性、光学透明度和机械强度\
  \ [[285]], [286]], [337]], [339]]。浆料需要聚聚粘粘剂或有机溶剂来保持其粘度。墨水以粘性分散液的形式存在 `DIW` [[085]],\
  \ [086]]。金属的源通常是盐或有机化合物，这就是为什么此类材料通常被称为 `MOD` 墨水 [[340]], [341]]。沉积后，在`200 C` 下进行热烧结以使配合物分解为气体，产生\
  \ `10⁶–10⁷ S/m` 的导电率。这些墨水可以包含广泛的金属：铝[342]], [343]], 镍[344]], 银[345]], [346]], 金[347]],\
  \ 和铂[341]]。最有前景的是铜[349]], [350]], [351]], [352]]。`MOD` 材料表现出低成本，且它们比金属纳米粉便宜几个数量级，这使得它们有利于作为低成本增材制造的材料。\n\
  \n\n\n考虑到材料的粘度特性，最后一组打印技术将使用低粘度墨水，正如喷墨打印和 AJP 技术一样。通常，主要的区别在于侧重于墨水流变学的组成，因此其粘度低于上述浆料。复合墨水通常基于相似的功能性材料，包括金属纳米粉、碳纳米材料或\
  \ MODs [130], [211], [353], [354]。低粘度墨水的使用在某种程度上限制了其在电子应用中的范围，而需要高功能负载的高导电材料（即使是基于纳米颗粒的）也会导致喷嘴堵塞\
  \ [120]。同时，与纳米颗粒墨水相比，MOD 墨水不含颗粒且保质期更长，因此不易发生喷嘴堵。\n\n## 5.2 半导体\n\n半导体材料用于制造活性电气元件，如二极管和晶体管（场效应管\
  \ `FETs`；薄膜晶体管 `TFTs`），也用于传感或光伏能量转换。打印活性元件要求墨水具有半导体特性，如带隙、开关比例和迁移率。半导体墨水的两种主要类型是金属氧化物或纳米材料的无机分散液，以及基于共轭聚合物的有机溶液或分散液。\n\
  \n第一组无机分散液与导电复合材料、浆料和墨水有许多相似之处。这里使用的不是金属粉末或纳米颗粒，而是金属氧化物、半金属或化合物（即 III–V 或 II–VI\
  \ 族）[355], [356]，但它们在碳纳米材料的应用方面与之前描述的组别几乎完全相同[357], [358]。这里的新组材料还包括量子点或 MXenes，它们为电子和光子器件引入了新的应用可能性\
  \ [359], [360]。此类材料表现出较高的环境稳定性和电子传输性能，但通常在沉积后需要热处理。因此，并非所有材料都适用于在温度敏感基底上制造活性电气器件。最常用的无机氧化物半导体来自氧化铟\
  \ (`In[2]O[3]`)、氧化锡 (`ITO`)、氧化铟锌 (`IZO`)、IG `IGZO` 和氧化锡锌 (`ZTO`) 组，还包括一氧化锡 (`SnO`)、氧化铜\
  \ (`CuO`)、氧化亚铜 (`Cu[2]O`) 和氧化锌 (`ZnO`) [356]。除了可以以微粉末或纳米粉末形式存在的无机金属氧化物外，还可以使用广泛的纳米材料，如碳纳米管、石墨烯和其他二维半导体材料，包括二硫化钨\
  \ (`WS2`)、二硒化钨 (`WSe[2]`) 和二硫化钼 (`MoS[2]`) [361]。每种功能材料的各种特性特征、常用材料和应用列于表 2。\n\n\
  另一种，一组导电聚合物可用于制备活性元件，如有机发光二极管 (`OLEDs`) [283]、有机场效应晶体管 (`OFET`) 或有机薄膜晶体管 (`OTFT`)\
  \ [362], [363], [364]、有机光伏电池 (`OPVs`) [291], [365], [366], [367], [368], [369],\
  \ [370]。这些聚合物中最常见的导电机制是 `π`-共轭骨架中离域电子的出现。最常用的是 `PEDOT`、聚乙烯、聚苯乙、聚芴吩、聚苯胺、聚吡咯、聚苯乙烯\
  \ (`PPV`) 和聚(3-己基噻吩) (`P3HT`)。只有少数导电聚合物容易溶解，例如 `PEDOT:PSS` [371], [372]。\n\n在此需要明确说明，本节描述的大多数材料适用于基于墨水的沉积（`inkjet`\
  \ 或 `AJP`），或至少适用于 `DIW` 技术。目前还没有将具有半导体特性的固体复合材料引入 `FDM` 的代表性报告。\n\n## 5.3 电介质\n\n\
  最后一组主要材料是电介质和绝缘体，其主要目标是表现出绝缘性能。简单的方法是将增制造常用的聚合物作为“非功能”相，而其本质上表现出的电介特性适用于大多数电子应用，如电路的多层绝缘或电容器和晶体管中的电介层\
  \ [373]。除了常规有机聚合物形式，电介质还可以是 `FDM` 的无机复合材料或墨水打印的微纳米材料悬浮液。电介质最常用的有机聚合物包括丙烯腈丁二烯系 (`ABS`)、聚乳酸\
  \ (`PLA`)、聚碳酸酯 (`PC`)、聚甲基丙烯酸酯 (`PMMA`)、聚酰亚胺 (`PI`)、聚苯乙烯 (`PS`)、聚氟乙烯 (`PVDF`)、聚吡咯烷酮\
  \ (`PVP`) 或聚乙醇 (`PVA`)。通常，电介质还应表现出适应沉积工艺的其他特性，例如低温工艺性（可以通过复合材料进行调整）、用于封装的高光学透明度，且最好成本低廉\
  \ [186]。它们的特定属性应适用于最终应用，如晶体管或电容器，其中介电常数会影响打印元件的最终性能。例如，电容器需要通过高介电常数和低损耗提供高电容密度的电介质墨水，此时无机复合材料优于有机电介质，具有更高的介电常数、更高的器件稳定性和更低的磁滞\
  \ [186], [374]。\n\n## 5.4 分散\n\n\n\n\n虽然这里描述的大多数专为增材制造设计的材料是聚合物复合材料，但需要考虑的一个重要方面是功能相在聚合物基体中的分散情况。我所说的“分散”，既是指关于功能相体积分布特征的复合材料结构形貌，也是指用于制备复合材料的实施工艺。\n\
  \n有效制造这些材料的主要问题在于选择合适的工艺，以获得粉末在聚合物基体中的均匀分散。这一点至关重要，因为增材技术中使用了多种类型的复合材料（用于 FDM 的固体、用于\
  \ DIW 的粘性糊料或用于喷墨打印和 AJP 的液体墨水）。每种材料都需要专门且定制的工艺来制备最终的混合物。\n\n此外，无论复合材料的状态（固体或液体），都需要考虑到所用功能相的类型：微粉末、纳米材料、片层、球形、纤维等。这在纳米材料的应用中尤为明显，因为纳米材料以粉末形式存在，倾向于形成结合力很强的聚聚，且难以破碎\
  \ [375]。基体中微颗粒与纳米颗粒的分散结构对比可视化见图 5.2(a)。通常，对于宏观和微观颗粒，很容易获得均匀的分散，因为可以确保充分的分离。然而，相同体积的纳米材料会产生由于静电引力和范德华力引起的团聚倾向相关的问题\
  \ [376]。\n\n聚合物基体的结构受颗粒分散的影响会发生变化，特别是当引入了尺寸接近聚合物链近程距离的成网颗粒时。由于包杂物活性表面的开发，变化发生在聚合物链的分子间相互作用水平，导致基体转变相的形成（图\
  \ 5.2(b)），其化学、流变和力学性能发生了改变 [377], [378]。对于纤维填充物，这种影响范围为几微米 [379], [380]，而对于纳米材料，则为数百纳米纳米\
  \ [381]，从而显著影响了均匀分散。\n\n颗粒均匀分散（尤其是纳米颗粒）的另一个问题是，它们以粉末形式存在时倾向于形成高键合团聚，如图 5.2(c–e)所示。正如预测基体中均匀分散的模型所期的，将团聚结构留在复合材料中会导致电学、光学和力学性能的低化\
  \ [378], [381], [382]。这表明均匀分散问题不仅与颗粒尺寸及其在基体中的分散有关，还与团聚的破碎和再团聚的抑制。最后，颗粒的分散对于有效性（低电阻率）至关重要，而且为了避免分散不良的团聚体像大颗粒一样堵塞打印喷嘴（无论使用何种增材技术）并危害打印过程。\n\
  \n```\n\n图 5.2 (a) 聚合物基体中相同体积分下宏观、微观和纳米颗粒的分散可视化：（从左到）片层或球形粉末、微纤维、纳米管。(b) 聚合物复合材料中碳纳米管相互连接的可视化，纳米颗粒表面可见的转变相。团聚碳纳米颗粒的扫描电子显微镜图像：(c)\
  \ 双壁纳米管束，(d) 多壁纳米管团聚体 (e) 石墨烯片层团聚体。图 a–e 来自 [302]。\n\n文献中有很多用于制备复合材料（包括纳米复合材料）的技术。这里介绍的混合技术不是唯一的，但它们是最广泛使用的，而且能够实现\
  \ 3D 打印结构电子固体复合材料、墨水和糊料的高产量。两种常用的方法是基于溶剂的方法创建微级或纳米级分散 [383] 以及高温熔融并混合打印材料（例如热塑性塑料）\
  \ [384]。\n\n\n\n\n在溶液和悬浮液混合颗粒是生产复合材料的最常用方法 [385], [386], [387]，非常适用于墨水和浆料。典型的悬浮液混合过程遵循几个步骤，其中两个始终存在：在溶剂中分散材料（例如超声法）以及作为中低粘度液体的聚合物基体进行混合（例如剪切混合或搅拌）。此外，可能会引入活性剂。\n\
  \n超声搅拌涉及通过超声振动（范围为 20-60 kHz）传递机械能，通常使用超声清洗器或超声探头等设备。超声波通过介质（例如溶剂）并激发颗粒振动，并在空化效应的增强下导致颗粒团聚分离\
  \ [388]。对于在水、醇或有机溶剂等低粘度液体中混合和脱聚纳米颗粒是一种特别有效的方法 [389], [390], [391], [392], [393],\
  \ [394], [395]。对于聚合物溶液，需要大量的稀释以获得低粘度溶液——这可以在后期通过蒸发过量的溶剂来增加。然而，高混合能可能会导致颗粒结构的损坏 [397],\
  \ [398]。在极端情况下，甚至石墨烯片和碳纳米管也会变成无形碳 [399]。\n\n剪切混合是在称为三辊磨的机器上进行的过程，其中三个相邻的辊以逐渐增加的速度旋转，导致材料均匀化\
  \ [400], [401], [402]。它通常用于中粘度材料，用于在印刷墨水、清漆和化妆品中颜料的分散，以及电子设备中的厚膜技术。通过控制由于辊速度差和辊间间隙（范围在微米级）产生的剪切速率，我们能够控制材料在基体中的分散程度。可以重复多次过程以获得更高的均匀性，但重复次数过多会导致颗粒损坏\
  \ [400]。\n\n叶片式、磁力或桨式搅拌器也是用于液体聚合物基体中颗粒分散的技术之一。通过控制搅拌器的尺寸和形状、工艺速度和时间，可以获得具有高度均匀性的悬浮液\
  \ [403]。还观察到，特征尺寸较大的颗粒可以获得更好的分散，但颗粒也具有高得多的再团聚倾向 [404], [405]。\n\n用于制备固体复合材料的最常用技术是球磨\
  \ [406], [407], [408], [409], [410]。\n\n## 5.5 渗透\n\n与分散密切相关的是导电路径的形成，这导致了高导电率。复合材料的电性能主要取决于填充料的量。描述电性能随含量变化的函数的基本关系之一是渗透阈值，它允许复合材料从绝缘体转变为导导体\
  \ [404], [414]。当颗粒在整个基体中形成接触点时，即可达到渗透阈值。所有提到的参数（基体的介电性能、颗粒分散、类型和形貌）都会影响渗透阈值。该现象的数学基础由\
  \ Broadbent 和 Hammersley 在 1957 年定义 [415]。\n\n通常情况下，渗透概率 `P(p)` 被定义为：与在给定介质的任何区域内，元素相互连接的程度（足以启动流动）的概率相关。该模型假设流通过通过连接\
  \ `n` 维网络最近节点的键（例如颗粒）发生。网络节点以随机方式填充导电颗粒。颗粒的数量或体积用 `x` 表示，对于较小的 `x` 值，概率 `P(p)` 同样接近零。这意味着网络节点上的颗粒相互隔离，整个系统表现出绝缘体特性。随着颗粒数量的增加，它们开始聚集，一旦超过临界值\
  \ `x`（记作 `x[c]`），它们就会形成一个无限大小（相对于周围环境）的簇，整个系统获得导电特性。可以得出系统中正在发生“绝缘体-导体”的转变。二维网络中导电路径形成过程的示意图如图\
  \ 5.3 所示。三维和 n 系统的属性以类似的方式确定。\n\n通用渗透模型假设渗透概率可以表示如下 (5.1)：\n\nP(p) ~ (x - x_c)^b\n\
  \n\n\n\n其中临界浓度 `x`[`c]` 被称为渗透阈值，`b` 是取决于网络维度的临界指数。使用基本的渗透方程，Kirkpatric 提出了一种异质性系统电导率的描述\
  \ [333]，该系统由填充了导电颗粒的绝缘物质混合物组成 (5.2)：\n\n(5.2)\\\\begin{matrix} {\\\\mathit{R} \\\
  sim \\\\mathit{R}\\_{0}{(\\\\mathit{V} - \\\\mathit{V}\\_{\\mathit{c}})}^{\\\\mathit{t}}}\
  \ \\\\\\\\ \\\\end{matrix}$\n\n其中 `R[0]` 是等于导电相电阻值的常数，`V`[`c]` 是阈值点导电相的临界体积分，`t`\
  \ 是 `V` > `V`[`c]` 时电导的临界指数。`V`[`c]` 的值取决于描述路径拓扑的参数，包括颗粒的分布、取向、尺寸和形状。针对相关的实验数据寻求一组的\
  \ `V`[`c]` 和 `t`。结论是，复合材料导电性的性质并非添加到聚合物基体中的颗粒数量的线性函数，许多因素都会影响最终的电性能。更不用说，所有这些现象与原料以及后的沉积技术（特别是热挤出）有关，并且会进一步改变沉积材料的性能，从而影响最终的\
  \ 3D 打印结构。\n\n\n图 5.3 二维网络中导通路形成过程的示意图。\n\n# 6.3 3D 打印结构电子\n\n之前的章节专注于增材制造、打印电子、结构电子概念和创新电子材料，这些为电子技术的发展提供了新方向。增材制造的一个显而易见的优势在于制造复杂几何形状和适应多功能结构方面克服了传统制造方法（如减材加工或成型铸造）的许多局限性。此外，打印电子作为另一种制造电子的增材方法，其成就证明了开发新制造格式的必要性，并为比平面打印电路更进一步的发展提供了可能的方向。结构电子概念将各种材料和元件集成到多功能结构中的新视角使得创建独特的电子设备成为可能。这种功能性材料、自由形式数字设计、新设备和定制后处理技术的结合，可以成为制造具有电、机械、光子或生物特性的活性结构的基础(Figure\
  \ 6.1)。事实上，由于我们掌握了如此高潜力的技术，在打印电子成就的基础上，利用增材制造技术制造电子技术中的元件和电路只是时间问题了。在本节中，我们将更密切地观察电子与增材制造协同集成领域的当前成就，以制造\
  \ 3D 打印结构电子。\n\n\n图 6.1 结构电子增材制造的关键工艺。\n\n成熟的打印电子技术的明显缺点是应用了专门用于形成 2D 导电迹迹的图案化方法。除了制造工艺的进步外，最终产品在功能上与基于\
  \ PCB 的传统电子几乎相同。电子器件的进一步微型化和高集成水平将依赖于导电和功能结构的自由形式制造。这得益于设备几何的定制、分级几何的集成、个性化结构和原型，将成为可能的。这正是\
  \ 3D 打印电子出现的地方。增材制造结构电子的外壳或结构元件嵌入结构体电路的总概念非常容易理解。3D 多层电路通过对每层选择性地应用导电和绝缘（以及结构）材料制造而成，并带有额外的导电层间连接，以及可选的不可打印离散电子元件或小型子系统\
  \ IC 的安装 [305], [310], [311], [312], [416)。与打印电子一样，3D 打印结构电子预计不会完全超越传统的制造方法，而是打破当前制造技术的局限，促进更高集成，并培养电子的新格式以及周围物品的新功能。全\
  \ 3D 打印电子的制造速度比早期描述的模内电子系统慢，但凭借无与伦比的定制可能性，它具有更大的潜力来制造优化功能的定制形状和特征。\n\n\n\n\n文献中介绍了许多制造\
  \ 3D 打印电子元件和器件的成功尝试，展示了增材制造的潜力。其中大多数研究描述了制造导电路径、电极、电路、被无源元件或天线的尝试，有大量的实验致力于传感器，但同时，对更先进的有源元件或光子器件和能量设备的关注较少。\n\
  \n在这里，需要提醒读者，由于“3D 打印”这一术语在文献中被过度使用，用于描述平面打印技术，即使是在纸张、聚合物膜和纺织品等柔性基底上使用丝网印刷或其他平版掩模技术进行打印。通常，“增材制造”被用作一个广泛的术语，涵盖了几乎所有用于制造电子元件的打印技术。事实上，打印电子实际上也是一种增材方法，这在前面的章节中已经解释过。因此，这可能是误解的根源。此外，需要注意的是，对于单层结构，结构电子中导电路径的制造与打印电子非常相似。然而，本书书中描述了尽可能制造空间\
  \ 3D 对象（根据上述 `ASTM` 定义）的打印技术，其具有垂直互连、体载承结构或空间组件，或者至少是在 3D 基底上的共形打印，以及 2D 打印电子技术的成就示例，这些技术在电子\
  \ 3D 打印中具有巨大的潜力（如适用于 `PolyJet` 的喷墨打印）。\n\n作为文献中引入的最革命性概念展望，有必要提到全 3D 打印扬声器`[417]],\
  \ [418]`，这是市场上最完整的 3D 电子打印机之一，利用具有接近体银电阻的低温固化银墨`[419]], [420]`。以及用于制造压阻式和电容传感器的\
  \ 3D 打印复合材料`[66]], [329]`、大型复合材料磁体`[176]` 以及高载量电电质复合材料`[421]`，以及一系列 3D 打印的电阻、电感器和电容，以及用于牛奶包装的无线“智能帽”`[422]`。\n\
  \n制造功能性电路的早期尝试之一，例如基于 `555 定时器`的系统、电子游戏骰子、嵌入头盔的一组传感器`[304]], [423]], [424]`或低轨道卫星电子`[425]`，它们利用了基于\
  \ `SLA` 打印机、导电迹的 `DIW` 沉积、`CNC` 铣床和 6 轴机械臂的多工艺方法来实现高效制造`[425]], [426]`。\n\n## 技术方面与优势\n\
  \n关于增材制造的技术方面和优势，对于大多数电子元件（单体元件），有两个关键工艺：打印工艺（沉积）和可选的固化/烧结工艺。后者对于不同类型的墨水基材料是强制性的（即为了溶剂的蒸发），而对于固体复合材料通常不需要。与通过光刻、电镀或真空沉积制造的位于刚性基底上的传统平面电子器件相比，这是一种要简单得多的制造工艺（`图\
  \ 6.2`）。\n\n在传统方法中，减材制造方法通常是平面的，阻碍了复杂几何、空腔、悬垂或 3D 结构的制造。此外，这些方法每个处理步骤只处理一种材料，限制了具有多功能属性的电子产品的生产。得益于无掩模的增材方法，3D\
  \ 打印电子还可以由于较低的资本支出而享受成本节省`[214]`。\n\n3D 打印电子的其他最显著优势包括：\n- 内部制造 PCB 原型，消除了 PCB 原型需要数周制作的瓶颈。\n\
  - 保护知识产权。\n- 在预制塑料外壳上打印共形表面，为天线和传感器等更纤薄的设计优化了空间。\n- 减材工艺的材料浪费通常较高。\n- 通过在单个制造过程中共同制造电子元件，高效优化了产品开发。\n\
  - 无需额外模具或准备工作即可实现设计的大规模定制化`[121]], [353]], [427]`。\n\n得益于所引入的优势，电子增材制造是一个快速扩展的领域。电子领域的增材制造产生了约\
  \ 10 亿美元的收入，占增材制造行业总收入的 13%，3D 打印电子市场预计到 2032 年将超过 35 亿美元`[428]`。这里最大的驱动力是电子和航空航天行业，他们致力于制造共形功能天线和传感器，以减轻重量并提高燃油效率和飞机性能，或缩小电子器件的足迹以实现更高集成`[121]],\
  \ [429]`。\n\n\n图 6.2 传统减材制造印制电路板与增材制造创新方法的对比`[228]`。\n\n## 6.1 导体和无无源元件\n\n导电路径是任何电子电路中最重要的部分。在增材制造的导电材料领域，最可见的是开发用于\
  \ `FDM` 的丝材复合材料（含有金属粉末、碳黑、纳米管和石墨烯）、用于`直接书写`的金属浆料（主要是银）以及用于`气溶喷墨打印`和喷墨技术的金属墨水（也主要是银）。单独的报告涉及基于粉末的技术（金属粉末）和紫外固化材料，但大量文献描述了一种混合方法，用于制造具有通过各种技术沉积的导电元件的空间\
  \ 3D 对象（有时并非打印的）。\n\n\n\n\n\n![图 6.3 (a) 阻性“国际象棋车”形状的 Carbomorph（炭黑复合材料）演示器 [329]。转自\
  \ Public Library of Science，遵循 Creative Commons CC BY 4.0 许可，版权 2012。(b) 用于打印导电图案的导电\
  \ ABS/Ni 复合材料丝 [331]。经 Springer Nature 许可转载，版权 2020。(c) 使用高导电性铜填充复合材料通过 FDM 打印的人机接口\
  \ (HID) [66]。转自 Springer Nature，遵循 Creative Commons CC BY 许可，版权 2018。(d) 使用基于炭黑和\
  \ PLA (Protopasta) 的导电复合材料丝打印的温度传感器模块立方体 [436]。经 IOP Publishing 许可转载，版权 2021。](graphic/converted/b_9783110793604-006_fig_003.jpg)\n\
  \n图 6.3 (a) 阻性“国际象棋车”形状的 Carbomorph（炭黑复合材料）演示器 [329]。转自 Public Library of Science，遵循\
  \ Creative Commons CC BY 4.0 许可，版权 2012。(b) 用于打印导电图案的导电 ABS/Ni 复合材料丝 [331]。经 Springer\
  \ Nature 许可转载，版权 2020。(c) 使用高导电性铜填充复合材料通过 FDM 打印的人机接口 (HID) [66]。转自 Springer Nature，遵循\
  \ Creative Commons CC BY 许可，版权 2018。(d) 使用基于炭黑和 PLA (Protopasta) 的导电复合材料丝打印的温度传感器模块立方体\
  \ [436]。经 IOP Publishing 许可转载，版权 2021。\n\n关于 3D 打印电子研究的出版物最多集中在最高且最流行的 FDM（熔融沉积）技术的电导性和阻性复合材料领域（图\
  \ 6.3]）。由于获得渗透阈值所需的负载较低，因此具有制造高负载复合材料的可能性，最有前景且研究最充分的是纳米复合材料，特别是含有碳纳米材料的复合材料。含有碳纳米管的热合物热塑性复合材料丝\
  \ [430], [431]、石墨烯 [432], [433] 和炭黑 [329], [434] 通常具有很高的电阻率。碳基复合材料丝和 FDM 打印元件在负载高达\
  \ 10 wt.% 的情况下，其电导率值处于 10^(−3) S/m 到 10 S/m [329], [432], [435], [436]，这比金属甚至金属填充复合材料的数值高出几个数量级。这些值对于制造电阻和其他功能性结构（如传感器或静电和电磁屏蔽）是可以接受的，但并不适用于高效率电路。因此，研究人员还探索了结合金属填料的其他方法。最早的文献报告之一描述了由铜微鳞片和\
  \ ABS 聚合物基体组成的高导电性 FDM 复合材料，其电导率比碳基复合材料高出几个数量级（10⁴ S/m） [66]。此外，还研究了在 ABS 聚合物中加入镍微粉，材料表现出的电导率在\
  \ 10² S/m 范围内 [331]。这种电导率值是金属添加剂的聚合物复合材料的典型值，此类复合材料的报道值为 10³–10 S/m [437], [438]。除了尽管可以制造大截面路径但电阻率较高外，该技术的另一个局限也是载流能力低。高负载\
  \ FDM 复合材料的问题在于它们通常很脆，难以用典型的市售打印机进行加工。尽管如此，由于商业复合材料丝可用以及定制功能填料的制造方法较为简单，此类材料非常受欢迎。因此，文献中展示了许多功能演示器的示例。FDM\
  \ 技术的一个应用示例涉及一系列由碳基聚合物复合材料制成的传感器，包括嵌入 3D 打印手套中感知手部弯曲的压阻传感器、用于检测智能容器内液量的嵌入电容传感器，以及电容感应人机接口\
  \ (HID) 触摸板 [329]。后期这种材料被商业化为“Carbomorph”材料——一种含有 15 wt.% 无定形炭黑相的聚内酯复合材料。还演示了连接到\
  \ `Arduino` 微控制器的 Cu-ABS 复合材料触摸板 [66]。\n\n\n\n\n虽然为 `FDM` 打印定制的导电复合材料通常表现出较高的电阻值，不适用于大多数高效电子设备，但也在评估其他方案以制造导电性与块体金属匹配的路径和元件。对于\
  \ `FDM` 复合材料，占据主导地位的是具有高粘度的聚合物介电质，而其理念是用粘度更低、密度更小的载体取代聚合物基质，并在其中加入大量的导电颗粒。通过对沉积技术进行较少修改，可以使用\
  \ `direct ink write`（直接墨水打印）以及相应的浆料和墨水来实现这种方法。通过应用基于金属或碳微纳米颗粒的导电浆料，可以制造导电/电阻元件（图\
  \ 6.4）。这种方法被称为平面打印技术以及粘粘剂和密封剂的沉积，它不是复合材料的热熔融，而是在室温过程中从喷嘴中挤出浆料，并通过溶剂蒸发进一步固化。\n\n\
  与 `FDM` 复合材料类似，这里也经常展示负载高达 `40–60 wt.%` 的 `GNPs` 或 `CNTs` 导电组合，其电电率值高达 `10³ S/m`，与\
  \ `FDM` 聚合物复合丝丝相比，导电率高出近五个数量级 [[[99]], [439]], [440]], [441]], [442]]。但 `DIW` 技术具有更多优势，特别是在使用金属粉作为墨水和浆料导电填充物方面。制造\
  \ 3D 打印电子电路的早期尝试之一是沉积在 `SLA` 3D 结构上的导电银浆，其电电率值高达 `10⁵ S/m` [304]], [424]]，这与在平板基底上通过丝网印刷技术制造的系统相当\
  \ [443]]。这种解决方案很容易适用于制造具有相对低电阻的基础导电路径。为了获得更好的电学性能，我们需要准备尽可能多的金属材料，而不是复合浆料，而金属纳米粉在这里是关键解决方案。与碳纳米材料的使用类似，金属纳米粉可以获得高负载的纳米颗粒，但它们需要额外的热烧结来获得几乎实体的金属线。幸运的是，这种烧结过程可以在相对低温度（甚至低于\
  \ `200 °C`）下进行，允许在聚合物基底上制造。通过使用银 `NPs` 和高达 `60–80 wt.%` 的负载，可以实现 `10⁷ S/m` 的电电率\
  \ [78]], [444]], [445]], [446]], [447]]，与块体银或铜的数值相当。\n\n通过 `DIW` 技术，还可以利用其他材料，例如\
  \ `MXenes`、导电聚合物或多功能相组合。利用 `MXenes` 制备了各种用于微电子、射频、传感和生物墨水，用于 `DIW` 打印电子结构，其电电率高达\
  \ `200 S/m` [448]], [449]], [450]], [451]], [452]]。`PEDOT:PSS` 水凝胶墨水允许制造电电率达到 `10⁴ S/m`\
  \ 的导电路径 [453]]，并且 `Fe[3]O[4]` 纳米颗粒功能化的 `GNPs` 混合物在额外热退火后，显示出 `580 S/m` 的电电率，以及饱和磁值为\
  \ `15.8 emu/g` [454]]。\n\n一种不寻常尝试是加热溶剂蒸发的相反过程——冷冻干燥，用于 3D 打印导电银 `NW`、石墨烯气胶甚至液态金属\
  \ [98]], [453]], [455]], [456]], [457]]。其他技术采用了 3D 打印 [330]]。虽然大多数 `DIW` 应用致力于在聚合物基底上制造导电线，但使用细径玻璃毛细管对共晶\
  \ `GaIn` 进行高分辨率 3D 打印，用于制造最小线宽为 `1.9 µm` 的特征 [76]]。此外，还制备了 `PEDOT:PSS` 高长径比微结构，允许打印直径为\
  \ `7 µm`、高度为 `5000 µm` 的柱结构 [77]]。具有 `20 µm` 特征的真正 3D 打印导电结构通过银纳米颗粒墨水 `DIW` 打印并由激光烧结（`SLS`\
  \ 的形式）展示了金属线圈和互连的示例，以及其他形式的自支撑螺旋结构，如弹簧和蝴蝶形状 [459]]。\n\n\n\n\n\n图 6.4 (a) 使用 SLA（左）和\
  \ FDM（右）技术、CNC 铣和 DIW 制造的 3D 打印立方卫星模块 [425]。经 Springer Nature 许可转载，版权 2014。(b) SLA\
  \ 和 DIW 打印的游戏骰子，内部嵌入了微控制器和加速度计，表面有 LED [460]。经 Springer Nature 许可转载，版权 2012。(c)\
  \ 使用 SLA 和 DIW 制造的三个代三轴磁通量传感器系统 [423]。经 Solid Freeform Fabrication Symposium 许可转载。(d)\
  \ 加速度计系统头盔内衬 [423]。经 Solid Freeform Fabrication Symposium 许可转载。(e) 结合 FDM 和 DIW\
  \ 技术的功能性 3D 打印扬声器（作者 Jason Koski，经康奈尔大学摄影许可转载）[417]。(f) 激光辅助 DIW 制造的 3D 金属架构 [459]。经美国科学院许可转载。\n\
  \n\n图 6.5 通过改进的喷墨打印制造的金属纳米颗粒各种 3D 微结构，例如：(a) 微迷字形，(b) 金属微桥互连器 [475]（经 IOP Publishing\
  \ 许可转载，版权 2010）和 (c) 高径比结构 [477]。经 John Wiley and Sons 许可转载，版权 2014。(d) 在橙子上用 AJP\
  \ 打印的导电标志 [471]。经美国化学学会许可转载，版权 2021。(e) 用 AJP 打印在电质柱壁上的垂直金属线 [472]。经 IOP Publishing\
  \ 许可转载，版权 2015。(f) AJP 3D 打印的微架构 [481]（经 Elsevier 许可转载，版权 2021）和 (g) 微结构 [478]。经\
  \ AccScience Publishing 根据知识共享署名许可协议 4.0 国际许可协议转录，版权 2023。\n\n\n\n\n\n下一组增材技术涵盖了基于墨水的打印，例如适用于\
  \ `Multijet` 的 `AJP` 或 `inkjet`（喷墨）。虽然基于墨水的方法无论生产结构的类型如何，通常被归类为 3D 打印，但有必要精确的是，即使对于空间\
  \ 3D 对象（特别是电子元件和电路），它们实际上仍然是在制造平面薄层。尽管如此，基于墨水技术在电子设备 3D 打印中的适配性和引入程度——即使是直接从印刷电子领域的成果转化而来——对于\
  \ `inkjet` 和 `AJP` 等最流行的数字墨水技术来说是巨大的（图 6.5）。\n\n这就是为什么这里特意展示了使用这些技术制造的电子元件示例（即使是\
  \ 2D 格式），考虑到由于使用的材料相似，这种转换比将丝网印刷转换为 `DIW`（直接性喷写）所需的努力要少得多。这些技术最显著的优点是能够使用金属纳米粉并通过烧结工艺制造低电阻元件，这在\
  \ `FDM` 过程中是不可能的。此外，由于缺乏 `FDM` 过程甚至 `DIW` 所必需的过度聚合物基质，可以获得更高含量的碳纳米材料。通过这两种基于墨水的技术，从金属纳米颗粒打印并在高温下烧结的导电线可以用较少的努力实现接近体金属的电率值\
  \ [131], 133], 462], 463]。\n\n基于碳纳米材料的墨水可以制造出电率仅低几个数量级的电极（高达 10⁴ S/m），这是碳纳米材料制成的宏观结构的预测极限\
  \ [127], 211], 354], 464], 465], 466]。关于基于墨水技术用于印刷导电线的适配的内容就到此，而该主题在文献中关于印刷电子的应用有广泛描述。远离印刷电子，墨水技术能够在对工艺进行微小修改的情况下制造多层、非平面电路\
  \ [140], 467], 468]。这种尝试已由 `Nano` 公司通过其用于结构电子的 `Multijet` 系统商业化 [469]。此外，`AJP` 技术从开始就针对非平面基底的制造进行了优化，诸如\
  \ `Optome` 提供的商业设备通常能够进行具有自由度的打印 [470]。这为在几家公司用于外壳内打印 `LTE`、`GPS`、`WLAN` 和 `BT`\
  \ 天线中的各种元件提供了可能，其性能与在蛋壳上打印的其他生产方法相当 [471], 472]。\n\n最有趣的部分是准备由金属基墨水（银或金）配制的各种导电喷墨打印\
  \ 3D 微结构（桥、柱状阵列、锯字形），其电率达到 10⁶ S/m [473], 474], 475], 476], 477]，同样适用于使用 `AJP` 技术制造\
  \ 3D 微点阵 [479], 480], 481]。\n\n说到墨水技术的低粘度材料，该领域内一个被探索的区域是无颗粒的金属有机分解墨水（`MODs`）。如前所述，这些材料解决了纳米颗粒聚集和可能的喷嘴堵塞问题。这些墨水可以用于金属化触点、电容器电极或印刷电路的方法与其他墨水相同\
  \ [340], 348], 351], 482]。此外，这些墨水可以成功使用在增材制造的低成本聚合物基底上 [483]。所得层的质量非常好，这从其用于制造天线\
  \ [346]、高频电路线圈 [484] 或薄膜晶体管电极 [485] 的应用得到了证明。\n\n\n\n\n\n另一种用于 3D 打印电子制造的奇特增材制造技术是\
  \ `SLS`，这是一种粉末床方法。对于使用 `SLS`（或 `SLM`）技术打印的电子元件，其与制造承载元件的方法几乎相同，因为用于这些技术的大多数材料是形成电导性金属元件的金属粉末。一个很好的例子是使用\
  \ `SLM` 制造铜和铝合金喇形天线，其参数与类似的实体金属天线相当（图 6.6(a))）[486]。同样的铝合金方法也被引入用于 `DMLS` 技术制造具有集成\
  \ Ku 波段集电馈电网络的宽带多层波导器阵列 \\[487]。此外，通过金属粉末激光烧结，在保持波导结构电学性能的同时实现了减重 \\[488]。对于更精确的微型制造，使用了银和铜纳米颗粒代替微粉末，获得了\
  \ 10⁶ S/m 的电导率，但由于纳米粉末的严重聚集，无法以粉末床的方式将其沉积，需要引入诸如 `DIW` 等技术 \\[459]。\n\n使用 `SLS`\
  \ 技术还可以处理导电复合粉末。基于 `CNTs/TPU`（柔性热塑性聚氨酯）的导电 3D 物表现出良好的柔性和 0.1 S/m 的电导率 \\[489]，一种类似的复合材料被引入制造\
  \ 3D 柔性压阻传感器 \\[490]。带有氧化铁纳米颗粒涂层聚酰胺粉末（`PA12`）的复合粉末用于打印磁性部件 \\[491]，还通过 `SLS` 制备了填充有微米级\
  \ `Nd-Fe-B` 磁性颗粒的 `TPU` 粉末磁场激活夹爪器 \\[492]。\n\n![图 6.6 (a) 金属 SLM 3D 打印 k 波段阶梯式双槽正方形喇形天线\
  \ [486]。转自瑞士巴塞尔 MDPI，根据知识共享署名 4.0 许可，版权所有 2027。(b) 用于快速检测液体食品质量的 3D 打印“智能盖”，具有无线读取功能\
  \ [422]。转自 Springer Nature，根据知识共享 CC BY 4.0 许可，版权所有 2015。(c) 使用涂有银浆的 3D 打印聚酰胺材料的电小球形螺旋天线\
  \ [500]。经 John Wiley and Sons 许可，版权所有 2016。(d) 用于射频振荡器和发射器应用的 DIW 千赫兹级电磁结构 [501]。经\
  \ John Wiley and Sons 许可，版权所有 2017。](graphic/converted/b_9783110793604-006_fig_006.jpg)\n\
  \n图 6.6 (a) 金属 `SLM` 3D 打印 k 波段阶梯式双槽正方形喇形天线 \\[486]。转自瑞士巴塞尔 MDPI，根据知识共享署名 4.0 许可，版权所有\
  \ 2027。(b) 用于快速检测液体食品质量的 3D 打印“智能盖”，具有无线读取功能 \\[422]。转自 Springer Nature，根据知识共享 CC\
  \ BY 4.0 许可，版权所有 2015。(c) 使用涂有银浆的 3D 打印聚酰胺材料的电小球形螺旋天线 \\[500]。经 John Wiley and Sons\
  \ 许可，版权所有 2016。(d) 用于射频振荡器和发射器应用的 `DIW` 千赫兹级电磁结构 \\[501]。经 John Wiley and Sons 许可，版权所有\
  \ 2017。\n\n由于制造导电电极具有巨大可能性，我们能够专注于另一种无源元件——电容器的。在许多报告中，展示了使用平面喷墨技术从银和金纳米颗粒墨水制作的全打印电容器\
  \ \\[212]， \\[493]，以及自然地使用 `FDM` 碳纳米材料导电丝 \\[494]，电容值分别为 3.1 nF cm^(−2)、314 pF 和\
  \ 150 pF。尽管 `inkjet` 非常接近 `Multijet`，但通过喷墨打印 `AgNP` 墨水还制备了多层电容器和电感器 \\[495]。虽然增材制造和纳米材料应用的特殊关注集中在超级电容器上，但它们将在储能器件章节中详细描述。\n\
  \n\n\n\n导电结构也是制造其他无源元件——电感和天线——的起点，这些元件是智能包装、医疗保健、防伪保护和公共安全领域各种系统的关键组件（图 6.6(b)）。与传统的天线制造方法相比，3D\
  \ 打印引入了更多材料选择，并允许复杂的结构设计。由 CNT-PLA 复合材料制成的 3D 打印独立导电结构形成了 3D 螺旋（电感）[496]。其他尝试集中在用于无线充电应用的\
  \ FDM 打印电感[494] 以及用于射频识别识别（RFID）标签的打印天线[497]。含有纳米材料的导电复合材料也足以用于 PLA/石墨烯的轻质电磁干扰（EMI）屏蔽，其在\
  \ X 波频段内具有 16 dB 的反射率[498]。FDM 还被用于打印 PLA 喇形天线，随后用商业导电喷雾进行金属化处理[499]，这与用 SLS 从 PA12\
  \ 制成并涂银浆的球形螺旋天线相同（图 6.6(c)）[500]。Tu 构建了书中此前描述的 3D 打印扬声器以及需要用 DIW 技术和银导电胶制制的导电线圈[417]。同样通过\
  \ DIW，微米级线条（1.9 µm）允许打印具有 3D 互连的 2D 方形线圈[76]。用 DIW 和银纳米颗粒打印的无源 RF 自由形状结构被制成电电（LC）谐振器，由一个\
  \ 32 匝环形电感和平行板电容器组成，线宽为 10 µm，显示出 6.5 GHz 的谐振频率（图 6.6(d)）[501]。用 DIW 和银纳米线墨水打印的\
  \ 3D 螺旋天线打印在半球面上，在 2.48 GHz 处产生谐振[458]。电小型天线也通过喷墨打印完全打印，包括塑料 UV 固化支撑体和银导体[467]。获得的贴片天线在\
  \ 2.4 GHz 下表现出 8 dBi 的增益值和 81% 的辐射效率，与固体基底天线的性能匹配。另一种电小型天线用银纳米颗粒墨水 3D 打印，形式为凸和凹半球面上约\
  \ 100 µm 的弯折蛇形线，在 1.73 GHz 下工作，效率为 71%[502]。在微米尺度，通过气胶打印金纳米颗粒制备了形成垂直分裂环谐振器（SRRs）的等离激元结构列[503]。此类精细结构（线宽低于\
  \ 2 µm）在 19.5 µm 波长处显示谐振，证明了作为天线的可能性。最后，用铜铝合金通过 SLM 打印了全 3D 打印喇形天线，其机械性能与固体元件匹配。两者在整个\
  \ K 波段内具有阻抗带宽，并分别在 25 GHz 处显示出 13.23 dBi 和 24 GHz 处显示出 13.5 dBi 的增益参数，证明它们可以取代传统天线[486]。文献中还介绍了许多其他\
  \ 3D 打印天线的尝试，也作为全电质天线、聚合物透镜、偏振器或波导存在[504]。\n\n## 6.2 有源元件\n\n目前技术中呈现的大多数报告关注导电电元件是自然趋势，因为它是所有电子系统的基础构建块，因此前一节的内容量巨大。在接下来的章节中，将简要介绍材料和增材技术的其他电子应用。\n\
  \n\n\n\n二极管和晶体管等有器件是现代先进电子电路的关键组件。特别是对于晶体管，这类有器件通常是多层结构的，由半导体、导体和电缘体等材料制成。简单的晶体管由一个半导体通道、电极（漏极、源极、栅极）和隔离电缘体（图\
  \ 6.7(a)）。\n\n在大规模范围内，其结构更为复杂，特别是对于使用硅晶圆技术制造的高性能有器件。然而，至少二十年来打印电子的研究一直专注于大批量制造打印二极管[[279]]、晶体管[[493\\\
  ], [505\\], [506]] 甚至整个微芯片[[274\\], [507]]。\n\n对于 3D 打印电子，从打印电子成就的过渡并非简单直接。技巧在于此类晶体管的结构，而其主要工作原理基于薄层结构，目前没有任何一种真正的\
  \ 3D 打印技术能够制造如此精细的特征（微米级），而这并不是大规模工艺的目标。当然，同样用于 3D 结构制造的喷墨（inkjet）、直接写写（DIW）和气溶喷打印（AJP）技术能够打印此类精细结构。由于晶体管的平面特性，喷墨和\
  \ AJP 技术在其制造中起着重要作用，而高效有源电路的制造需要将 FDM、SLA 或 SLS 等 3D 打印技术与打印电子中成熟的墨水基技术相结合。\n\n\
  此外，从 3D 打印应用于电子的早期，技术和市场分析表明，现代电子最重要的元素——3D 打印晶体管——可能在几十年内无法完全实现[[508]]。今天这些预测仍然有效，因此在文献中我们可以找到标题包含“3D\
  \ 打印晶体管”或类似表述的报告。它们大多利用喷墨、DIW 或 AJP 技术沉积通道和电极材料[[367\\], [509]]，甚至指示 TFT（薄膜晶体管）是在类似于打印电子的柔性基底上制造的，这种偶尔且清晰呈现的方法是一种涉及喷墨打印的混合工艺[[510]]。\n\
  \n另一方面，单独报告涉及使用 SLA 制造基于 PEDOT 的复合材料（而非整个晶体管结构）[[511]]，并且使用 FDM 打印半导体材料没有技术限制，即使在微观尺度范围内也是如此[[512]]，但此类方法在制造\
  \ 3D 打印晶体管方面并没有获得许多关注。这并不令人意外，因为没有客观理由使用增材制造构建宏观晶体管结构，特别是当研究结果表明晶体管的性能（如开关比参数）会因通道几何尺寸增大而降低时[[367]]。\n\
  \n有趣的是，值得提到纳米级技术的高性能硅芯片也向 3D 结构方向发展，通道被栅极电缘体包围，例如 Fin-FET 或全绕栅极效应管（GAA FET）（图 6.7(b)）[[513]]。但在这种情况下，读者需要意识到这些结构仍然是基于光刻的硅技术制造的，而不是通过增材制造方法[[514\\\
  ], [515]]。\n\n\n\n\n如前所述，由于此类结构的特殊性，目前还没有 3D 打印晶体管的直接示例，但一些结合了适用于 3D 打印技术的最新成果非常值得关注。用于制造打印晶体管的最广泛探索材料包括半导体聚合物、无机半导体氧化物和纳米材料（图\
  \ 6.7(c, d)）。最基础的方法是使用最流行的材料`PEDOT:PSS`，其载流子迁移率`μ`值达到 0.437 cm² V^(−1) s^(−1) [516]，与高性能硅晶体管相比，这个数值看起来并不尽人意。通过其他有机材料，可以将该值提高一个数量级，例如使用`dinaphtho[2,3-b:2’,3’-f]thieno[3,2-b]thiophene`(`DNTT`)或`2,8-difluoro-5,11-bis(triethylsilylethynyl)\
  \ anthradithiophene`(`diF-TES-ADT`)，分别实现了 1.1 cm² V^(−1) s^(−1)和 6.7 cm² V^(−1)\
  \ s^(−1) [517], [518]。将材料更换无机半导体氧化物可以显著提高打印晶体管的性能，达到 19 cm² V^(−1) s^(−1) [519]，对于\
  \ ITO 打印墨水，甚至可以达到 230 cm² V^(−1) s^(−1) [520]。基于半导体氧化物的墨水允许通过`DIW`技术制造 3D 打印拱型、圆柱形结构，分别使用`Bi[0.5]Sb[1.5]Te[3.0]`和`Bi[2.0]Te[2.7]Se[0.3]`作为\
  \ p 型和 n 型电极，因此它们不是作为晶体管而是作为热电器使用的[521]。类似的方法也被用于制造具有双极结的 3D 热电结构（图 6.7(e))） [522]。\n\
  \n纳米材料也被广泛作为晶体管沟道材料进行评估。碳纳米材料在此起着重要作用，它们允许通过更简单的工艺轻松获得与有机半导体相当的性能。打印石墨烯和碳纳米管晶体管示例的迁移率值在\
  \ 0.23 到 30 cm² V^(−1) s^(−1)范围内 [505], [523], [524], [525], [526]。此外，引入`MXene`墨水允许制造出载流子值为\
  \ 0.5 到 2.61 cm² V^(−1) s^(−1)的 TFT [527]。无论用于制造晶体管的是什么材料，打印技术都允许制造更活跃的结构，如逻辑门或内存块[363],\
  \ [528], [529]。最后，值得提到`PlasticARM`，这是一个由`Arm Ltd`和剑的`Pragmatic Semiconductor Ltd`合作制造的全功能\
  \ 32 位`arm`微处理器，基于`Cortex-M`处理器、`RAM`和`ROM`构建[530]。虽然这不是打印结构，而是使用传统的半导体工艺设备在 200\
  \ 毫米直径的聚酰胺晶圆上用 n 型`IGZO`制造的，但它仍然是一个令人深刻且深受启的成就，为塑料电子制造设定了方向。\n\n\n\n\n\n用于发光层打印的大量材料是半导体聚合物，用它们制备的器件称为有机发光二极管（OLED）或有机光伏电池（OPV）。此类组件通常由多个层堆叠组成，包括背部电极、电子传输层、活性层、空穴传输层和透明电极，因此这种组合可能会有所不同\
  \ [531], [532], [533]。\n\n此外，除了制造 OLED 时常用的涂层技术和真空沉积法外，最常用的技术是喷墨打印，即使是用于制造 8K 55\
  \ 英显示器也是如此 [533], [534]。另一方面，喷墨技术可以用于制造发光设备的精密接触电极或透明电极 [535]。此外，还引入了许多种混合方法来制造\
  \ OLED，例如通过 AJP 和 DIW 技术打印 Ag NPs 和 PEDOT:PSS（图 6.8(b))） [325]。\n\n除了有机材料外，量子点（QDs）也被用作直接发光层或荧光团。在这里，喷墨打印也用于各种材料，如\
  \ CdZnSe/ZnS 壳层量子点 [536]、PbS-CdS 壳层量子点 [537] 或 CsPbBr[3] 钙钛矿量子点 [538]。利用 DIW 技术已知的方法之一是一篇报告，描述了在隐形眼镜上打印了一个\
  \ 5 层 LED，其发光层由量子点材料制成，其发光强度与平坦基底上打印的 LED 相当（100 cd/m²）（图 6.8(a)） [323]。\n\nDIW\
  \ 的应用消除了“咖啡环效应”的发生，这是喷墨打印的主要问题之一，该效应对于金属导电路径并不是大问题，但会显著影响打印 LED 的效率，并在打印层中引入高表面粗糙度\
  \ [539]。此外，还有尝试打印钙钛矿材料（包括钙钛矿量子点），甚至用于打印激光的应用，这对于构建天然共振腔和放大自发辐射是有益的 [540], [541]。\n\
  \n多喷嘴 DIW 打印允许制造集成发光和探测 3D 结构，其中发光/探测部分通过多个独立喷嘴同时打印多种金属、电质和半导体墨水制成，随后用于检查模型飞机机翼的结构缺陷\
  \ [542]。一种 DIW 打印的量子点光子墨水还被用于制造成 3D 纳米柱结构的显示器 RGB 像素，为高分辨率显示设备提高了亮度 [543]。\n\n与\
  \ LED 相反的结构是光伏电池和光探测器。对于薄膜 OPV，其结构通常与 OLED 相似。在这里也使用喷墨打印进行制造，并将钙钛矿用于打印光伏电池 [544],\
  \ [545], [546], [547]。一些报告显示打印的太阳能电池可能优于旋涂的电池 [545]。此外，3D 打印对钙钛矿的结晶行为提供了控制，这是其性能的一个关键参数\
  \ [548], [549]。卤化物钙钛矿溶液甚至被用于通过 AJP 打印 3D X 射线探测器 [550]。AJP 也成功用于打印太阳能电池和光探测器 [551],\
  \ [552], [553], [554]。\n\n增材制造最大的潜力之一是荧光团和闪烁材料的 3D 制造（图 6.8(c, d)） [555], [556]。这里的关键在于量子点在胶体溶液中的加工性，为准备兼容\
  \ Multijet 和 DIW 3D 打印制造提供了可能 [557], [558]。文献中提到的几乎所有用于喷墨打印的量子点墨水都可以用于 Multijet\
  \ 3D 打印，无需或仅需少量成分修改。虽然荧光复合材料不需要导电，但适应 SLA 来构建光学层和结构是有前景的。VAT 技术已用于演示多种光电结构，例如用于可调折射率的二氧化钛纳米颗粒复合材料\
  \ [559], [560], CdSe-ZnS 荧光量子点复合材料 [561] 以及用 3D 打印塑料闪烁器制造的低成本 PET 扫描仪 [556]。\n\n\
  \n\n\n\n图 6.8 (a) 弯形眼镜片上的 3D 打印量子点发光极管，并嵌入在立方结构中`[323]`。经美国化学学会许可，版权所有 2014。(b)\
  \ 3D 打印柔性 OLED 显示器，展示了不同弯曲方向的组合以及结构截面`[325]`。由美国科学促进协会根据知识共享署名许可协议 4.0 (CC BY) 转录，版权所有\
  \ 2022。(c) 3D 打印无机多晶体闪光体`[555]`。经英国皇家学会许可，版权所有 2017。(d) 用于剂量学应用的 DLP 3D 打印塑料闪光体`[556]`。经爱思唯出版社许可，版权所有\
  \ 2022。\n\n光子应用的最后一个领域是超表面和超结构的制造。一种改进的 AJP 技术被用于制造 3D 自由形状等离激元结构，例如由金纳米颗粒墨水制成的垂直分裂环谐振器`[503]`。使用溶剂基\
  \ `DIW` 墨水在加热的硅衬底上打印复杂的光子图案`[562]`。此外，利用 `DIW` 打印钙钛矿纳米线，以制造具有数字可编程偏振异向性的光子器件，从而允许光电器件（如\
  \ RGB 显示器、光应变传感器和光信息存储设备）的编程`[563]`。微图案化包括光子超结构中最令人印象深刻的结果是通过双光光刻技术获得的，该技术能够制造聚合物和金属的微纳米结构，以及微光学结构，如棱镜、菲涅尔透镜和光栅`[564]`。虽然这种技术具有局限性，且可打印的最大物体与最小特征尺寸之间往往存在权衡，但这项工作正朝着同时实现精细微结构架构（1\
  \ µm）和大型空间尺寸（达厘米级）的目标进行`[565]`。\n\n最后，虽然不是直接的光子器件，但增材制造的光的光电器件中还包含了导电组件。被动元件和导电组件的结合导致了精确微结构的制造，例如用于\
  \ `DIW` 结合 `AJP` 用于发光显示器`[566]`或柔性阵列`[479]`。\n\n## 6.4 能量存储\n\n先进电子设备发展的另一个重要方向是高性能能量存储领域。一方面，组件基于电化学反应（电池），另一方面基于电荷积累（电容器）。这两种组件在结构上具有相似之处，主要由电极（阳极和阴极）和隔膜组成。在过去的几十年里，石墨烯和碳纳米管等纳米材料被广泛应用于储能器件的制造`[567]`、`[568]`，以及`[569]`，我们已经知道纳米材料对于增材制造具有巨大潜力。在大多数应用中，储能形状被标准化为圆形或矩形结构。随着物联网（IoT）的出现，电池或电容器预计变得更小，不再占据大部分体积，而是作为自适应自由形状更有效地利用空间。同样，从\
  \ 2D 到 3D 结构的转变允许制造更小的能量设备，通过增加电极的体积利用率来保持或增加能量密度`[155]`、`[570]`以及`[571]`。此外，通过\
  \ 3D 打印可以优化电池生产周期，减少组装过程、使用更材料并缩短制造时间，从而降低工艺成本`[572]`。最后，通过 3D 打印结合几何形状和电极集成可以在更小的足迹内提高面积能量密度`[573]`。虽然增材制造的能量产生、存储和转换器件范围比电池和电容器广泛得多，包括上述的光伏，还包括燃料电池以及各种固态发电机和能量收集器（热电、射频、摩擦电和压电）`[574]`、`[575]`、`[576]`以及`[577]`，此处仅将涵盖为\
  \ IoT 设备供电的小电池或用于信号处理电路的电容器的应用。\n\n\n\n\n\n一个 3D 打印电池成功制造的示例是自立式锂离子电池，其所有组件均采用 `DIW`\
  \ 技术打印，使用水基氧化石墨烯浆料作为电池电极，并使用含有 `Al[2]O[3]` 纳米颗粒的固体电解质，其容量高达 170 mAh/g [578]。\n\n\
  `DIW` 技术在电池和超级电容器的制造过程中具有许多优势，它能够使用含有各种导电材料、支撑材料或电解质的高填充率浆料。通过使用水基钛酸锂 `Li[4]Ti[5]O[12]`\
  \ (`LTO`) 和磷磷酸铁锂 `LiFePO[4]` (`LFP`) 纳米颗粒，纳米材料负载量高达 60 wt.%，并利用 `DIW` 打印了 3D 交错型微电池结构，实现了\
  \ 3D 电极的高径横比几何形状（1:10）（图 6.9(a)） [579]。\n\n添加标准液电解质 (`LiClO[4]`) 使得能量密度和功率密度分别达到\
  \ 9.7 J/cm² 和 2.7 mW/cm²。锂基 3D 打印电池是 3D 打印能量元件制造的热趋势。将 `LFP` 和 `LTO` 纤维结合 `PVDF`\
  \ 打印电极，并溶解在凝胶聚合物电解质 `NMP` 中的 `CNT`，表现出高比放电容量和优异的柔韧性 [580]。\n\n此外，含有纤维素纳米纤维 (`CNF`)\
  \ 的 `DIW` `LFP` 浆料 [581] 以及带有 `Li-S` 的冷冻硫/碳复合材料 [582] 被用于 3D 打印电池的制造。另一方面，还展示了一种微型锌离子电池\
  \ [583]。随着 3D 打印的应用，制造了具有自由形状结构的电池——环形、大字母 H 形和 U 形。这种水基 `Zn`-离子电池使用锌离子 (`Zn^(2+))`)\
  \ 作为电荷载体而非锂离子，减少了由于锂离子电池导致的火灾风险，从而使其对大气水分更安全、更稳定。由于相同的原因，钠离子电池也通过 `DIW` 技术进行了 3D\
  \ 打印 [584]。\n\n`DIW` 被广泛用于制造具有高负载纳米材料的电极，例如用于超级电容器的石墨烯水凝胶-聚胺纳米复合材料 [585]。基于石墨烯的气凝胶浆料和墨水用于混合\
  \ `DIW` 和 `inkjet` 打印具有周期性宏观孔的电极，以制造倍率性能达到 10 A/g 的超级电容器，能够为红色 LED 供电几分钟，并为一个小风扇供电几秒\
  \ [586]。\n\n在文献中还可以找到许多其他适用于 3D 打印电极制造的 `DIW` 打印报告，例如填充石墨烯和铜的热响应墨水，用于制造高径横比电极并进行额外烧结，用于（图\
  \ 6.9(b)） [587]、用于微超级电容器的 `CNT`-基电极 [573] 或用于钠离子电池多孔电极的二硫化钼 (`MoS[2]`) 石墨烯混合气凝胶\
  \ [584]。此外，`MXenes` 也通过 `DIW` 和 `inkjet` 技术打印以制造自立式超级电容器 [588], 589]。\n\n通过 `DIW`\
  \ 和 `inkjet` 技术打印 `MXenes` 用于制造自立式超级电容器。3D 打印的应用还允许在电极中引入受控的孔隙率，增加了电极的有效表面积。这种结构通常具有从宏观到纳米级的分布孔隙，通过增强离子的传输和扩散来提高器件性能\
  \ [590]。例如，高表面积纳米孔石墨烯基材料用于制造孔径从 4–25 nm 到 500 µm 的电池（电极） [591]。基于具有周期性宏观孔的分级石墨烯气凝胶的超级电容器，通过\
  \ `DIW` 打印实现了优于碳基电极的倍率性能 [586]。此外，上述钠离子电池负极具有纳米孔（平均尺寸为 300–800 nm） [584]，以及 `DIW`\
  \ 打印的纳米孔石墨烯基正极相比 2D 薄膜具有更高的活性位利用率和容量 [591]。\n\n金属多孔电极还通过 `AJP` 打印技术制造，采用银纳米颗粒微晶格\
  \ 3D 结构形式，用于锂离子电池 [480]。微晶格不仅通过较大的表面积（增加了 4 倍）增强了电学性能，还增强了在频繁充放电循环下的机械应变耐受性。\n\n\
  除了广泛使用的 `DIW` 技术外，用于 `FDM` 的石墨烯基 `PLA` 复合丝胶被用于制造电容器电极 [592]，或含有亚微米石墨烯的 `PLA` 复合材料用于电化学器件电极的\
  \ 3D 打印 [593] 以及用于固体超级电容器类似的复合材料 [594]。此类示例如图 6.9(c, d)所示。\n\n此外，`VAT` 技术也得到了利用。含有银纳米颗粒（NP）装饰钛锆锂粉末\
  \ (`PZT`) 的聚合物材料与紫外固化树脂混合，以制造 3D 打印电容器。由于能够赋予高极化效应，该聚合物纳米材料的介电常数比类似的热塑性复合材料增加了 30\
  \ 倍，从而增强了比电容（高达 63 F g^(−1)） [595]。聚乙胺涂层碳纤维正极和固体锌负极，结合 `SLA` 打印的多孔隔膜膜，被用于制造可充电水基锌离子电池\
  \ [583]。\n\n\n\n\n\n\n\n增材制造应用中需要提到的一个特殊优点是能够 3D 打印固态材料的能力。固态电解质具有限制流体对应物泄漏或燃烧的优势。`DIW`\
  \ 被用于打印包含 `Li[7]La[3]O[12]` (`LLZ`) 石石石结构的多固体电解质，允许制造各种自由形状结构 [596]。锂离子电池的所有组件都已准备就，包括具有最佳粘度的高浓度氧化石墨烯的水基浆料\
  \ [578]。使用基于 `PVDF-co-HFP` 的含离子液体电解质浆料通过高温 `DIW` 制造混合固态电解质 [597]（图 6.9(e)）。通过打印包含作为电极的\
  \ `LFP` 和 `LTO` 的复合浆料以及固态胶聚合物电解质，使用 `DIW` 制造了一个全组件 3D 打印锂离子电池 [578]。\n\n### 6.4.1\
  \ 传感器\n\n环境参数的测量以及社会成员的生命参数日益受到关注，特别是在 `IoT`、工业维护和个人电子（可穿戴设备）出现的时代，它们将各种传感器集成在一个网络中，以持续监测建筑应变、人体和设施温度、以及环境及人体内的化学物质和生物标志物浓度\
  \ [598], [599], [600]。几乎到处应用传感器的需求增长迫使传感器结构适应不同的环境或物体几何形状。在这里，结构电子学方法是一个关键因素，增材制造可以很容易地用于形成自适应传感器或将其嵌入\
  \ 3D 结构中。由于传感器材料和结构适应的多样性（电阻式、电化学、复合型、共形等），2D 和 3D 打印电子学领域探索最广泛的研究领域之一是传感器应用。\n\n\
  \n\n\n\n文献中关于 3D 打印传感器制造最常见的组合方式是将导电材料（主要是纳米材料）与`DIW`和`FDM`技术相结合。利用`graphene`或`nanotubes`制备浆体，是是将这些纳米材料应用于\
  \ 3D 打印传感器的最简单的方法之一（图 6.10(d))）[601], [602]，以及使用蛋蛋的有机凝胶[603]。\n\n使用`DIW`从`graphene-PDMS`浆料打印的应变传感器是通过多次打印制成的网格形式[604]。随后用`silica\
  \ nanoparticles`对该材料进行改性，以增强其机械和热性能[605]。最先进的演示器之一是以多层支架形式 3D 打印的，其中蜘蛛形和海星形物体是用水性的`MWCNT-chitosan`组分制成的，并且在部分断裂后还表现出自修复性能（图\
  \ 6.10(e))）[606]。\n\n具有各种形状的自修复应变传感器还通过`MXene`和`cellulose nanofibers`混合物通过`DIW`以平面形式制备，并能易于适应地打印\
  \ 3D 结构[448]。一种用软材料压阻式传感器由`carbon black-polyurethane`复合材料制备，该材料饱和了`NaCl`，随后用水去除，创建了具有分级多隙率的过度多隙结构，展示了称量小物体、测量机器动态振动、监测手腕脉搏、吞咽和眨眼动作以及说话期间的能力[607]。\n\
  \n此外，还使用了碳纳米材料和金属基浆料，例如分散在高度可伸的`silicone elastomer`中的亚微米级`silver particles`，以形成直接打印在人体皮肤上的\
  \ 3D 打印柔性触觉传感器，用于检测湿度、脉搏和手指运动[608]，以及带有`cellulose nanocrystal`组分的`silver NW`，用于化学离子传感的环保一次性无线传感器系统[458]。之前实验中的`Silver\
  \ NW`和`DIW`也经过微调，用于打印共形沉积在猪肺表面的变形传感器，以便通过电阻层层扫描法测量的变形进行空间映射[609]。\n\n在传感器制造的低粘度墨水领域，也有报道关于用于`AJP`打印用于免疫传感的`graphene\
  \ sensors`[610]，或用于脑动脉瘤监测的`silver NP-based sensors`[611]，但与所有低粘度墨水技术一样，它们在制造真正的\
  \ 3D 打印元件方面仍有局限性。\n\n\n图 6.10 (a) 用于检测机翼结构缺陷的双功能光检测和发光结构的 3D 打印结构化多材料丝[542]。转载自\
  \ Springer Nature，采用 Creative Commons CC BY 许可，版权所有 2019。(b) 在用`CNT–TPU`丝材制造的`FDM`打印结构上的\
  \ 3D 立方体交叉多轴力传感器[430]。经 Elsevier 许可转载，版权所有 2017。(c) 3D 打印的电化学传感器，用于同时监测血清素溢出和环形肌收缩[615]。经美国化学\
  \ Society 许可转载，版权所有 2019。(d) `DIW`打印的纳米管和`graphene composite`应变传感器，用于检测具有不同弯曲角度的机器人手指运动[601]。经\
  \ Royal Society of Chemistry 许可转载，版权所有 2017。(e) 用于传感器的`Chitosan–CNT`溶剂复合材料，展示了作为蜘蛛形和海星形结构的\
  \ 3D 打印支架[606]。经 Royal Society of Chemistry 许可转载，版权所有 2018。(f) 通过嵌入 3D 打印并由多个软传感器支配的柔性体感受执行器，以及具有体感受反馈的柔性机器人夹爪[628]。经\
  \ John Wiley and Sons 许可转载，版权所有 2018。\n\n\n\n\n\n虽然对于大多数传感器而言，高电导率并非强制性，但如果电阻处于\
  \ 10–10⁶ 欧姆范围内，对测量系统会更好；而巨大的潜力在于复合材料中，特别是对于 FDM（熔融沉积建模）技术，它最适合制造嵌入传感器的块体结构。商业复合丝材（如“carbomorph”和“blackmagic”）是\
  \ FDM 制造电子设备最常用的材料之一，其他基于 PLA、ABS 或任何其他热塑胶的碳微纳和纳米材料的复合材料 [329], [612], [613]。生物医学传感系统也可以由\
  \ PLA 基质和碳纳米材料构建的 FDM 打印复合材料制造，且此类材料的生物相容性是一个重要因素 [614]。在其他报告中，一种由碳-PLA 复合材料打印成锥形的简单电极被用作猪肠组织监测监测的离体传感器，能够测量血清素水平和肌肉收缩情况（图\
  \ 6.10(c))） [615]。许多其他方法描述了石墨烯-PLA 电极，用于 H[2]O[2] 检测 [616]、真菌毒素 [617]、生物标本中的金属离子\
  \ [618]、葡萄糖 [619] 以及为病毒检测定制的免疫生物传感器 [620]。石墨烯-ABS 复合材料也被用于通过 FDM 3D 打印心电图（ECG）传感器电极，并额外涂有金属（钛和金）以限制腐蚀和氧化\
  \ [621]。柔性热塑性基质允许制备 MWCNT-聚聚氨酯弹性应变传感器，通过电阻效应测量监测材料属性的变化 [622]，其他含有 MXene 和 MWCNTs\
  \ 的聚氨酯复合材料也被用于弹性应变传感器和电磁屏蔽结构 [623]。对于传感应用的功能相类型没有限制，只要它允许测量属性的变化即可，因此，ABS 中的磁铁矿纳米颗粒（Fe[3]O[4]\
  \ NP）被用于 FDM 打印葡萄糖传感器 [624]，或固定在打印的 PLA/石墨烯电化学传感器表面的金纳米颗粒（Au NPs） [625]。\n\n由于之前提到的关于导电结构的原因，文献中很少描述利用\
  \ VAT（光固化）技术制造复合传感器。一个简单的示例展示了使用含有 MWCNTs 的紫外线固化树脂制造应变传感器阵列，该阵列也适用于湿度和温度检测 [626]。一项复杂的研究涉及复杂\
  \ 3D 形状中机械和电气的集成。在这里，紫外固化树脂中的石墨烯纳米片通过 SLA（光固化）技术打印，同时通过电场进行对齐，从而能够通过电阻变化感知损伤发生的\
  \ 3D 打印轻型智能装甲 [627]。\n\n## 6.5 微机电系统\n\n\n\n\n\n通过增材制造制造的执行器已应用于纸质 2D 打印电子领域[629]，因此将材料和技术适配于\
  \ 3D 打印执行器甚至微机电系统，是发展的发展的必然趋势。前提到的 3D 打印扬声器是这种最流行的电机械执行器形式之一的良好示例，它完全采用增材技术（`FDM`和`DIW`）制造[417]。另一种实现交互式扬声器自由形状制造的方法是基于静电的方法，这种方法比常见的电磁扬声器更容易构建[630]。\n\
  \n执行器最基础且多功能的工作原理是通过电流流引起的热应力导致几何形状变化。使用石墨烯浆水通过`DIW`技术，一种集传感/执行于一体的柔性弹性结构在连接电压时表现出弯曲[236]。这种方法在文献中非常流行，`DIW`打印离子胶也被用于制造具有触觉、本体感受和热感知能力的柔性执行器[628]。\n\
  \n集成了触觉和温度传感的全打印机器人夹爪是通过`DIW`打印铂金固化硅胶弹性体以及填充有烟粉硅颗粒的有机离子液体完成的，这允许通过对离子液体基传感器的电阻变化测量，选择性地检测被抓取物体不同的纹理（图\
  \ 6.10(f))）[628]。其他结果展示了具有高粒子取向的`DIW`3D 打印纤维素纳米晶石复合结构[631]。这些受自然启发的结构沿规定方向表现出可编程的增强，并对施加的机械载荷产生定制的响应。\n\
  \n纳米材料分布和取向的空间变化也会影响 3D 打印执行器的形状改变能力。氧化铝片片的取向允许制造具有可编程形状变形的形状改变结构（图 6.11(c))）[632]。研究人员提出了一种制造微机电继电器开关器件的有趣方法，在三维悬臂结构上结合喷墨打印的金属纳米颗粒墨水，表现出极低的导态电阻（10 Ω）和极低的断态漏电（图\
  \ 6.11(a))）[633]。\n\n硅胶和蜡材料的混合物还制备了一种用于制造执行器的热活性结构，以制造电机械机器[634,635]。有趣的是，这些电机械和体相非易失性系统被评估为类脑硬件系统的构建模块[636]。\n\
  \n几个小组研究了光固（VAT）聚合方法。例如，受外磁场限制在`SLA`打印结构内的铁磁性铁纳米颗粒表现出磁剩的区域差异，这对于远程操作、旋转、平移和变形非常有用[637]。类似的`SLA`打印方法也被用于制造一种由温度触发的执行器，展示了电路中简单的开/开关（图\
  \ 6.11(d))）[638]。\n\n利用双光子聚合技术，`Fe`O3 被用于制造微机器人[639]。虽然`SLA`技术允许制造高质量的精细结构，微流控器件是用这种方式带有活性磁颗粒打印的[640]。\n\
  \n精确的 3D 打印技术（也是基于树脂的双光子聚合技术`2PP`）被用于在微型笼内制造仿生静脉瓣，用于捕捉运动细菌以提高基于石墨烯生物传感器的灵敏度[646]。利用多种\
  \ 2D 和 3D 打印技术的混合方法也被用于制造具有压阻性、高导性和生物相容性柔性材料墨水的监测心脏生理设备，这能够在心脏组织微结构中集成柔性传感器，进一步应用于研究药物反应[641]。\n\
  \n\n\n\n\n\n\n# 7 挑战\n\n与 3D 打印电子元件和器件的制造相关的若干挑战，此类工艺需要考虑相互影响的各个方面，包括功能性材料、打印工艺参数、额外的后处理以及组件和电路设计的新方法。尽管有许多包括导体、半导体和电缘体在内的材料类型，但并非所有材料都适用于电子器件的结构化打印，因此它们适用于平面打印电子设备。并非所有材料都适用于不同的沉积和后处理参数。不适用于体体元件的材料会导致层厚不受控，从而给空间对象的制造带来挑战，这也会影响结构化电子器件的良率。虽然这主要影响组件的生产和可扩展性，但也会对\
  \ 3D 打印电子组件的效率和最终应用领域产生重大影响。短路、导电性差、层厚不均匀以及打印路径和元件的质量问题，或任何其他缺陷都会负面影响此类电子系统的效率和可靠性。最后，离散组件的集成以及互连的高效制造也是一种具有挑战性的方法。这些技术障碍如果得到妥解决，将成为\
  \ 3D 结构化电子在日常生活中广泛应用的关键要素。当然，如果我们采用能够满足这种方法要求的有效设计算法不同于目前使用的平面 PCB 设计 CAE 工具），我们将从结构化电子的发展中受益。\n\
  \n## 7.1 效率\n\n现代电子设备最重要的目标之一是系统的高运行效率。这归功于高处理速度、高能效、低信噪比、大运行内存等。在 3D 打印电子发展的这一阶段，最具挑战性且也最微不足道的参数之一是高导电率。微不足道是因为对于今天大多数电子设备来说，这是一个很少考虑的因素，而电路和元件中所有的所有的组件（路径、电极、连接器等）都是由体金属（主要是铜或铝）制造的，在不需要任何额外修改或后处理的情况下实现了这些材料的体导电率。虽然大多数\
  \ 3D 打印沉积元件是由复合材料或经过额外后处理的复合墨水制造的，但此类材料在导电率或电流负载方面的效率有限。打印电子中为人知的一个效率限制经典案例（也归因于结构化电子）是晶体管在迁移迁移率上的表现。尽管使用\
  \ `CVD` 技术合成的致密碳纳米管阵列（用于制造打印 TFT）允许载子迁移率值达到 `1000 cm²V^(−1)s^(−1)`，接近单晶硅并优于非晶硅 TFT，但该值在复合打印结构中会下降几个数量级。答案是使用净化的纳米管，并引入更高均匀性的纳米管墨水，或适应尽可能长的\
  \ CNT，最终表现出比短纳米管网络高得多的载子迁移率，消除与纳米管之间接触电阻带来的损失 [647], [648]。电路性能还与基底和打印结构之间的相互作用有关。用于\
  \ 3D 打印基底的常用聚合物需要对其对电路性能的负面影响进行更广泛的评估。同样适用于用作复合材料基质的聚合物、改善分散性的表面活性剂以及影响复合电子电路性能的其他化学添加剂\
  \ [649]。\n\n## 7.2 小型化\n\n与电子设备更高效率固有相关的是组件的小型化。基于 `PCBs` 和 `ICs` 的传统电子设备也是如此，这并不一定属于广义的打印和结构化电子。由于集成到宏观结构中（有时是桌子、汽车或建筑尺寸），小型化并不总是导电电路、天线、传感器、电阻、电容器或能量器件的关键因素。当我们尝试集成打印活性元件或整个集成电路（如晶体管或微处理器）时，情况会发生巨大变化。虽然整个活性结构的几何形状不受许多限制，但构建模块受到电阻、载子迁移率等物理限制；在这里，对于高性能电子设备，需要\
  \ 3D 可打印结构的小型化 [650]。3D 打印技术具有许多技术限制，如之前提到的关于喷嘴对齐决定打印结构尺寸的限制。因此，我们也发现为了为了高分辨率 3D\
  \ 打印克服这些限制的研究。\n\n\n\n\n\n其中一个示例是针对高频运行电路的优化，这直接涉及到产生短沟道长度晶体体的能力。通常，对于大多数打印和沉积技术，`10 µm`\
  \ 的分辨率是一项技术障碍。早在十多年前已知这些局限性，人们就已经开始打印亚微米沟道长度的晶体[651]，最近报告表明可以实现 `250 nm` 的分辨率[652]。其他报告介绍了一种纳米直写喷墨（DIW）打印的改进，使用直径为\
  \ `630 ± 70 nm` 的玻璃纳米吸管嘴来打印用于 RGB 显示的量子点 3D 纳米柱结构[543]。通过控制柱体高度，在不改变像素空间分辨率的情况下实现了像素亮度的提升。使用带有外部电场的改进墨水打印技术制造了具有亚微米尺寸的高长宽比墙[653]。另一种类似的电流动力学打印方法允许将打印层垂直堆叠，实现了线宽从\
  \ `80` 到 `500 nm`、高度从 `200 nm` 到 `1.5 µm` 的银或金金属壁[654]。此类结构可以作为晶体的 3D 通道或电极。许多其他报告展示了通过高分辨率电流动力学墨水打印，将金属（银、铜、钴）沉积形成柱体、墙和桥状结构的亚微米尺度材料沉积[523]，或者通过静电辅助气溶胶喷射打印钯纳米柱阵列形成\
  \ `300 nm` 的 3D 金属结构[503]。即使是基础的墨水打印改进，也能利用银纳米颗粒墨水制造高长宽比的金属柱，逐层沉积的最大柱高可达 `10 mm`，长宽比为\
  \ `50:1`，随后用于垂直互连[655]。尽管 3D 打印技术的分分辨率已达到亚微米级，但不应直接与基于光刻的最先进电子设备相提，不过预计 3D 打印分辨率将进一步增强。\n\
  \n## 7.3 连接与嵌入式元件\n\n有效制造高效 3D 打印电子设备需要考虑的另一个因素是离散元件的集成和封装，这可能是大规模制造的主要瓶颈。尽管引入结构化电子具有许多优点，但其主要缺点仍然被提及——与传统的固态电子设备相比，其电气性能较差且集成程度较低。为了满足高电学性能的要求，一种方案是将传统电子元件与增材制造的元件相结合。这种混合方法在打印电子设备等其他技术中已为人熟知，它也是在导电电路路上集成离散元件的\
  \ PCB 的构建基石。对这种混合方法的兴趣源于它能够引入自由形状和新的应用格式，同时仍通过固态电子设备的离散元件提供高电学性能。这需要高效制造电子电路的另一个非常重要的元素：元件连接和互连。在电子电路中，元件引脚连接到导电路径上（PCB\
  \ 中的铜线）。这种连接既实现了电气连接，又机械地将元件固定在原位[656]。在传统电子设备中，使用特定材料如焊锡合金或导电胶水来制造连接。在结构化电子设备中，可以使用制造导电路径的相同材料。例如，最常用的银纳米粉墨水和胶料之一，其电阻值可以与传统焊点的表现相当[657]，[658]。使用复合材料会导致电阻增加，但对于大多数应用来说可能已经足够。在\
  \ 3D 结构化方法中，电子元件通常被结构材料完全包围，因此机械强度对于连接并非至关重要。无论使用何种材料，一个用于电子 3D 打印和集成离散元件的集成系统都必须包含几个部分，包括基底的\
  \ 3D 打印、导电路径和其他功能元件的多材料沉积、精密元件放置、连接的制造（如果不是安装在沉积的路径材料上）以及额外的封装和密封，并配备用于质量评估的检测系统（见图\
  \ 7.1(a)）。\n\n带有嵌入式离散元件的混合 3D 打印可能会为材料和安装的元件创造一个异常环境，即它们并非为此设计的运行条件（散热限制、热机械应力等），这些条件在其他嵌入式系统中已是。什么会负面影响此类设备的可靠性[659]，[660]，[661]，[662]？在这里，带有已安装元件的材料\
  \ 3D 沉积可能对热管理有益。可以沉积额外的材料以形成直接打印并固化在离散元件上的散热器，从而消除额外的界面材料和散热器组件，并整体减少热界面的数量。尽管如此，此类嵌入式系统中的温度波动会在材料界面产生热胀和应力，最终导致疲劳和失效。失效机制的评估对于传统电子系统非常重要，特别是对于负责了近\
  \ `40 %` 电子电路故障的互连可靠性[663]。通常，疲劳被定义为材料对反复加载载荷的响应，导致循环变形和失效。疲劳失效始于微观结构的变化，形成的微裂纹在连续循环载荷下扩展，直到物体结构受损[664]。\n\
  \n\n\n\n\n如图 7.1 所示，混合电路增材制造的通用概念包括负载形成、材料沉积、组件组装和封装几个阶段。嵌入式组件的此类难以呈现，这里最重要的部分是评估连接制造的可能方法。因此，这里提到的示例涵盖了在聚合物基板上安装离散元件的连接制造，这些方法适用于\
  \ 3D 打印的电子设备。源自 PCB 技术的最直接方法是使用锡合金将组件安装在`FDM`打印的导电复合材料上`[665]`。这引发了挑战，因为锡合金是为铜基底定制的，而不是用于含有聚合物的复合材料，因此会出现润湿性和附着力问题，而且焊接过程中还会导致复合材料的热熔化。另一种尝试结合了用于热固化或选择性烧结的`DIW`打印浆料，最大限地减少了工艺对聚合物基底的负面热影响`[447]`。例如，`DIW`被用于通过微头制造类似于键合的连接，并通过电沉积形成选择性金属结构，实现了直径为\
  \ 800 nm 的`Cu`线键合`[666]`。`DIW`还用于最小宽度为 2 µm 的银微电极自由形状打印，作为镓基 SMD LED 阵列的互连`[667]`。液态金属的直接打印实现了最小宽度为\
  \ 1.9 µm 的线条`[76]`，用于 LED 的连接，随后被用于微 LED 阵列的互连。此外，用于打印熔融金属的改进`FDM`技术（`FDMm`）允许同时制造路径和连接，消除了额外工艺的需求`[182]`。这是一个很好的例子，说明与形成互连的传统方法不同，自支撑\
  \ 3D 互连可以形成具有更少（甚至没有）中间连接的单一路径，而在常规 PCB 中，这些连接会增加额外的接触电阻，并往往降低整个电路的可靠性。\n\n![图 7.1\
  \ (a) 带有封装的路径、关节和连接的增材制造工艺步骤示意图。(b) 用于`DIW`打印的立方体卫星系统中连接的银浆成分[425]。经 Solid Freeform\
  \ Fabrication Symposium 许可转载。(c) 嵌入在 3D 打印样本中的与导电迹连接的集成被动 SMD 组件的横截图像[662]。经 Taylor\
  \ and Francis 许可，版权所有 2018。(d) 示例结构性电子连接的制造步骤（基板打印、组件组装、路径打印和封装）[312]。经 MDPI，瑞士巴塞尔，根据\
  \ Creative Commons Attribution 4.0 许可，版权所有 2022。(e) 使用电铁和`SnPb`锡合金在`PS/Cu`导电基板上焊接\
  \ LED 的 3D 打印演示器[665]。经 MDPI，瑞士巴塞尔，根据 Creative Commons Attribution 4.0 许可，版权所有 2021。(f)\
  \ 使用熔融合金路径和连接（`SnAgCu`）制造的 3D 打印多振荡电路[182]。经 MDPI，瑞士巴塞尔，根据 Creative Commons Attribution\
  \ 4.0 许可，版权所有 2022。](graphic/converted/b_9783110793604-007_fig_001.jpg)\n\n图 7.1\
