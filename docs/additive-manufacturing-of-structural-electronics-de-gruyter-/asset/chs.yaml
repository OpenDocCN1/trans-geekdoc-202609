  \ Attribution 4.0 许可，版权所有 2022。\n\n## 7.4 多材料打印\n\n对于诸如`FDM`、`DIW`、`inkjet`或`AJP`等选择性沉积技术，多材料打印主要是增加额外的喷嘴来沉积新材料（例如聚合物基底和导电路径）的问题。这些技术大多数在运动系统方面也易于互换，因为它们都依赖于`XYZ`组可更换喷嘴。例如，这允许制造带有`DIW`路径和`inkjet`打印晶体管或其他活性组件的`FDM`基底。一些其他尝试利用单个喷嘴进行多材料打印，例如对于商用`FDM`打印机使用丝料回抽和加载新材料。还引入了一种用于单喷嘴多材料`DIW`打印的有趣方法。在能够沉积多达八种材料的喷嘴阵列中在不同材料之间快速切换（高达\
  \ 50 Hz），实现了使用两种不同硬度的不同硅橡胶打印的软机器人腿的形成`[668]`。然而，利用材料选择性固化或粘合而非选择性沉积的技术进行多材料 3D 打印，由于交换料槽中的液体材料或床上的粉末存在困难，一直具有挑战性。“一次一种材料”是`SLA`或`SLS`技术的一个根本性限制。这种限制通常通过分别打印聚合物基底和沉积不同材料层来绕过`[669]`，`[670]`。这种方法显著减慢了工艺速度并增加了总制造时间。其他尝试引入了各种材料替换技术，通常提供带有树脂的独立料槽或带有不同粉末的料斗，并且每层重复该过程，制造的是多层结构而非真正的多材料`[671]`，`[672]`，`[673]`，`[674]`，`[675]`。除了在打印程序中引入额外的步骤并显著减慢整个过程之外外，它们还带来了材料之间交叉污染的风险，对于数百层频繁更换材料的情况，这种风险更为重要。\n\
  \n\n\n\n\n在真正的多材料打印方面，树脂和粉末基技术中最具前景的两种方法是基于快速材料交换，且对固化过程本身没有引入许多修改。最近的光固聚合（VAT polymerization）技术示例是基于快速多材料投影微光固化，该技术通过对集成流体单元内的多种液体光敏聚合物进行动态流体控制\
  \ [676]。通过这种方法，料槽内 95% 以上的材料可以在几秒内完成交换，不同材料之间的交叉污染程度有限，与常规 SLA 技术中层与层之间的停留时间相当。通过这种活性材料交换过程，制造了高度复杂的多材料\
  \ 3D 微结构，还包括嵌入了金属（铜）和陶瓷（氧化铝）纳米颗粒的多颗粒负载结构，展示了热响应和电活性水凝胶双层梁的制造。另一种粉末床技术的应用尝试使用了类似的腔体粉末交换方法，即通过真空提取粉末并沉积新的一层粉末来实现\
  \ [677]。\n\n此外，这些技术在 UV 可固化树脂的适配（应用于多喷射技术，也适用于光固聚合）方面存在局限性。由于上述制造高导电 UV 固化复合材料的限制，只能获得电质、光子、磁性或高电阻材料，这严重限制了这些技术的应用。在将\
  \ VAT 技术用于 3D 打印电子方面，已经观察到许多问题，例如高浓度金属或陶瓷和氧化物纳米颗粒对聚化过程的负面影响 [559], [560], [678]，对于基于墨水的技术，为了获得含有银\
  \ NP 的导电结构，需要额外的烧结步骤 [679], [680]。VAT 技术和体素沉积（voxelated deposition）的多材料打印示例已在图 7.2\
  \ 中给出。\n\n\n图 7.2 (a) MultiMaterial-PμSL 整体流程和材料交换过程的示意图，以及 (b) 使用 MM-PμSL 制造的包含两种或三种不同材料的多材料微\
  \ 3D 结构，还包括负载了铜和氧化铝纳米颗粒的树脂 [676]。经 Elsevier 许可转载，版权所有 2019。(c) 阐明基于 PμSL 制造多材料结构和料槽交换的工作流\
  \ [672]。从 Springer Nature 转载，采用 Creative Commons CC BY 许可，版权所有 2016。(d) 多材料 3D 打印头操作示意图，用电压波形控制挤出压力，以及使用\
  \ 4×4 喷嘴四材料打印头通过 MM3D 打印产生的体素 [668]。经 Springer Nature 许可转载，版权所有 2019。\n\n## 7.5\
  \ 可扩展性\n\n在 3D 打印电子大规模引入的拼图中，除了效率、小型型化或多材料打印外，另一个重要因素是以最高效的方式集成所有工艺组件，以实现大规模生产和大规模定制的可扩展性，这正是增材制造所预期的。今天\
  \ 3D 结构器件的根本性挑战源于制造方法和材料的随机组合，而这些组合最初并非为它们而设计 [662], [681]。生产优化的最明显的原因是降低成本，以便与基于\
  \ PCB 的电子产品直接竞争。但当技术处于婴儿阶段时，从何处开始成本优化并不明显。大多数 3D 打印工艺在速度上落后于传统生产，因此打印速度缓慢限制了它们在需要量产的行业的应用。对于对于额外\
  \ 3D 打印工艺的预制大规模定制方法，这可能不是主要问题。但如果我们想制造具有复杂架构的全集成电子设备，我们需要提高 3D 打印速度，以保持生产效率水平。速度的提高不仅与沉积技术有关。几乎所有\
  \ 3D 打印组件都需要某种后处理，以去除支撑、提高机械性能或精度，最后提供视觉效果。我们已经知道对于快速原型制作使用人工劳动是高效的，但对于成千上万个 3D\
  \ 打印零件的大规模生产，清洁、磨光和后处理的自动化是必要的。一个很好的例子是成熟的粉末床技术，如 `SLM` 或 `EBM`，它们已经在行业内广泛引入，打印零件从板取出后需要额外的热处理以消除冷却过程中可能导致变形的积累余热。我们在\
  \ 3D 打印电子的研究中也有例子，涉及解决一种既快速又不会损坏（即使是部分）低温度聚合物基底的合适固化工艺 [447], [682]。对于 3D 打印电子，我们在这方面还没有任何指南，但根据更成熟增材技术的经验，我们应该对整个工作流的优化做好准备，而不仅仅关注材料、打印参数或最终组件的效率，因为这不足以将\
  \ 3D 打印电子成功推向市场。\n\n## 7.6 设计过程\n\n\n\n\n最后，在拥有了所有必需的功能性材料、将所有打印参数优化到极致，并引入了专门用于电子领域的高效\
  \ 3D 打印技术后，我们需要回到原点并问一个核心问题：如何设计 3D 打印电子电路？从根本上说，这种设计对于所有技术和材料类型都是通用的。利用相对于传统 PCB\
  \ 优势的所有基本设计规则，设计出真正的 3D 打印电子设备的能力可能极具挑战性，并可能成为最独特的瓶颈 [683]。虽然今天用于 PCB 设计的电子设计自动化（EDA）软件能够设计具有近乎无限层数不同板框轮廓的多层电路，但这在制造上仍然是一种\
  \ 2D 方法，这种方法对于嵌入在平板桌面上的微控制器设计可能足够高效，但对于飞机部件内部的先进电路或适配良好的可穿戴设备则不然。此外，此类软件还应该考虑工艺限制。共形打印或\
  \ 3D 打印比在平坦基底上打印更复杂，具有更多的设计和制造考虑因素。除了电路拓扑结构外，还需要考虑打印头对 3D 结构表面的可性，这需要打印头与 3D 部件对齐的工具路径规划\
  \ [684]。目前已经有一些尝试来解决这些问题，并且关于促进电子 3D 建模软件的研究正在进行中，例如 FDM 打印物体中电导的拓扑感知路由 [683]、针对空间\
  \ DIW 打印对象的选择性激光烧结算法 [459]，或带有嵌入组件的层层制造的指南和工艺规划考虑因素 [685]。更进一步的是配备了目标表面运动闭环跟踪系统的\
  \ DIW 系统，它不仅引入了电路的共形打印，还允许在动态表面上进行 3D 打印，例如在手部移动过程中打印的湿度传感器，或猪肺表面上共形打印的形变传感器 [609],\
  \ [686]。\n\n# 电子增材制造的 8 个视角\n\n上一章重点关注 3D 打印电子设备在当前发展阶段面临的挑战，而本章介绍了促进新技术和材料研究领域进展的新方向，同时也介绍了市场上新兴的新产品和系统。增材制造的进展如此之快，以至于在本书准备的最后几个月里也出现了新的技术和应用。此外，这里仅介绍了少数热门的\
  \ 3D 打印技术和材料，还有几十甚至上百种适用于结构化电子制造的其他技术和混合方法。书中将介绍通过新材料和改进来优化 3D 打印电路参数的工作。本章还将涵盖结合电子与生物医学的跨学科方法，更不用说自修复材料或冰点以下打印等更奇特的领域了。最后，三维电路将进一步发展为增材技术产生的“四维”结构化电子设备（4D\
  \ 打印）。\n\n## 8.1 市场发展\n\n\n\n\n如前所述，市场对 3D 打印电子器件的预期是在未来十年内将快速增长。对于所有工业应用而言，除了新材料、技术和已确定应用的开发外，还需要以现成生产解决方案的形式向市场提供适当的技术背景。因此，如今的批量产\
  \ 3D 打印电子器件听起来仍像是一段遥远的科幻小说，但已有许多公司正致力于实际应用，重点是开发为这种电子制造方法定制的设备。\n\n结构化电子器件的先驱之一是\
  \ Eric MacDonald。他创建了一个制造系统，由两台 3D 打印机组成：一个`DIW`工作站和一个由六轴机器人手臂操作的`CNC`机床[426]。他还报告报道了一种功能性\
  \ 3D 打印电子器件的商业化应用，即作为`CubeSat`卫星模块[424]。美国哈佛大学的团队也开发了类似的概念，催生了衍生公司`Voxel8`，其拥有一套完整的系统，并作为世界上首个通用\
  \ 3D 电子打印机投入市场，能够生产出全空间电子电路。该设备结合了`FDM`喷头和`DIW`模块。该开发的核心是基于`AgC[2]H[3]O[2]`的无颗粒、低粘度反应性银墨水，墨水在\
  \ 90 C 下可固化，电导率大于 10⁴ S/cm[420]。该公司展示了打印的电磁铁和四旋翼器等功能性器件。离散电子元件需要在打印过程中暂停手动放置。最终，在出售公司后，`Voxel8`改变了其经营领域，该打印机已不再市场上销售。\n\
  \nVoltera 公司通过`V-One`电路板打印机展示了类似的`DIW`方法[461]。使用导电墨水和绝缘墨水，`V-One`允许打印双层电路板。一些公司已经意识到对生产全打印结构化电子器件设备的需求日益增长。在过去的几年里，他们决定开发复杂的设备，由多个用于导电材料应用和固化的模块，以及用于基材增材打印的模块组成。此外，经常还会出现自动放置电子元件的模块。\n\
  \n提供 3D 电子器件生产专业设备的公司之一是`nScrypt`，它在`MICE`计划期间建立，现在开发了一系列`nScrypt 3Dn`设备，具备微量加注`DIW`、`FDM`、微铣和钻孔、离散元件拾放放置、激光处理、烧结、加热、`UV`和光子固化、等离子体笔甚至实时过程查看功能[687]。其他使用混合`DIW`方法的公司还包括`M4\
  \ 3D Printer`[688]或`Neotech AMT 15x BT`[689]。`DIW`方法是最广受欢迎的方法之一，因为它在电子市场上已作为一种应用锡膏、粘粘剂、密封剂或其他高粘度材料的技术而成熟，而且这种技术已被`Cellink`、`Allevi`、`BioAssemblyBot`或`RegenHu`等公司在生物打印机市场中进行了深入探索。\n\
  \n结构化电子的另一种稍有不同的方法是美国`Optomec`的`Aerosol Jet Print`[470]。该平台不创建结构部件，而是用于在现有的 3D 基材上进行共形涂层。`Optomec`与德国的`Neotech\
  \ GmbH`合作开发了一个配备`光束烧结 (LBS)`的系统，这是一种用于聚合物等低温度基材的非接触光子烧结技术。这种方法对于用于移动设备的共形天线非常流行，包括`LTE`、`NFC`、`GPS`、`Wifi`、`WLAN`和`BT`，其测量性能与其他生产方法相当。\n\
  \n另一种基于墨水的方法由`Nano Dimension`通过`DragonFly 3D`打印机开发，通过对电质和导电材料进行多喷嘴打印来实现多层 PCB 的增材制造[469]。它可以产生高电导线（5.73 ×\
  \ 10^(−8) Ωm，约为铜的 30%）并可以打印垂直孔，但主要限于薄型 2.5D PCB。正如此处提到的，这些系统并不代表成熟技术，因为它们只是专业工具。制造商并不在材料选择和技术参数方面提供支持，这使得确定最终结果变得非常困难。\n\
  \n\n\n\n\n导电纳米颗粒墨水、浆料和复合材料是金属纳米颗粒的分散体，广泛作为液体介质墨水用于制造 3D 打印电子设备的导电图案。由于纳米材料特性，我们观察到纳米颗粒之间强烈的范德华力作用会导致严重的聚集，从而引起分散性差或喷嘴堵塞，大多数情况下，每个金属纳米颗粒都被有机添加剂包裹以避免聚集。然而，这些相同的有机添加剂阻碍了金属纳米颗粒之间的接触，限制了电子传输和电流流，因此初始不导电的纳米颗粒墨水需要通过烧结工艺来分解有机添加剂。有机添加剂还能防止纳米颗粒产生的高度活性（主要是氧化），因此它们是纳米颗粒墨水的关键成分之一。单元素金属纳米颗粒（`Ag`、`Au`、`Cu`）广泛用于配制墨水和浆料，其中银纳米颗粒因具有所有金属中最高的导电性和优良的氧化稳定性而被首优用于制造导电图案。此外，金纳米颗粒也具有良好的导电性和氧化稳定性，但由于市场黄金的价格，其成本高得多。因此，人们的关注点集中在铜墨水上，`Cu`的成本远低于银和金，且导电性与银相当。然而，作为昂贵银纳米颗粒墨水的替代品，铜纳米颗粒墨水的实现可能并不容易，因为铜纳米颗粒在环境中高度活性，在高温烧结过程中容易氧化为氧化铜（半导体或电缘体）[690],\
  \ [691]。在这里，一种新型双金属壳结构纳米颗粒墨水出现了，目前仍处于研究阶段，试图进入市场。壳结构纳米颗粒由两种不同的材料组成，外壳通常是氧化稳定的（`Ag`、`Au`、`Ni`），以防止内芯（即\
  \ `Cu`、`Al`）发生氧化和腐蚀[692], [693]。除了对主体芯材料的环境影响有限外，壳结构纳米颗粒通过调节芯与壳材料的比例，在实现所需的电学、光学或化学性能方面具有多种优势。此外，经济方面也起着重要作用，因为很容易减少昂贵材料的负载。铜银（`CuNP@Ag`）壳结构双金属纳米颗粒就是一个例子，其中薄银壳保护铜芯免氧化[692],\
  \ [694]。这些纳米颗粒在电子墨水和复合材料的制造中正获得越来越多的关注，同时显著减少了昂贵银的负载，保持了卓越的电性能[695]。其他壳结构双金属纳米颗粒墨水也被开发出来，例如镍涂层的[696]或锡涂覆的[697]。\n\
  \n## 8.3 可控组织与图案化\n\n通过选择材料、调整技术、优化打印和固化参数，并通过元件的设计，可以获得 3D 打印结构的特定性能。另一种不常用的选择是在打印过程中修改材料的属性。这可以导致\
  \ 3D 打印材料中微观结构的受控形成或填料相的空间组织，从而增强 3D 打印电子元件和器件的功能性或最终性能。可控组织和微观结构的形成可以在宏观、微观和纳米尺度上实现。一种方法是在材料打印期间，通过颗粒的组织和形成来诱导各向异性，这主要应用于`DIW`和`FDM`技术。在这里，喷嘴中的剪切力使纳米颗粒能够对齐[236],\
  \ [698], [699]。喷嘴处的受控蒸发和冷却也促进了纳米颗粒在打印期间的自组装（图 8.1(b))）[97]。分散在介质中的颗粒（例如纳米纤维、纳米线或纳米片）承受剪切应，使其主轴与层流方向重新对齐。这种现象可以用于设定\
  \ 3D 打印结构中的各向异性应力-应变行为，并响应外部刺激的形状变形（图 8.1(a))）[700], [701], [702]。流体剪切图案化还允许通过纳米颗粒产生的应切变稀打印自支撑结构[703]。此外，颗粒的取向对于需要低浓度填料以防止喷嘴堵塞的情况是有益的，但其最终机械刚度应高于随机排列的填料颗粒[631]。偶尔，打印时较高的剪切速率可以调节电性能，增强具有取向纳米颗粒（例如石墨烯或纳米管）复合材料的导电性[99]。这种方法也被用于锂电池电极的制造，其中纳米颗粒（`GO`）沿挤出方向对齐，提高了整个电极的导电性[704]。此外，通过在陶瓷纳米晶-聚合物杂化材料中诱导取向半晶结构，可以增强压电性能，并将取向调整到受应力的方向[705]。\n\
  \n\n\n\n类似于 LCD 显示器的工作原理，流体剪切图案化也可以通过定向纳米颗粒并诱导其对极振光的光学响应来赋予光功能属性 [563]。沉积后最常用的自组装现象是喷墨打印技术中的溶剂蒸发，其产生的毛细作用促进打印颗粒（如石墨烯片或纳米管）的自组装，并在简单的干燥过程中将它们组织成平面各向异性结构\
  \ [706]。\n\n通过溶剂蒸发进行图案化和组装还允许直写打印（DIW）或基于墨水的技术生成所需的微结构，例如各种独立的 3D 结构 [707]、纳米拱 [97]、纳米柱和圆顶结构\
  \ [708]，[709]。\n\n虽然对于沉积技术，剪切和蒸发组装及图案化占据主导地位，但在光聚合固化（VAT）应用中难以实现。在这里，一种方法是声学图案化（也称为声学镊），利用声波与周围固体、液体或气体媒介之间的相互作用来移动或聚集颗粒\
  \ [710]，[711]。这种图案化已用于 VAT 技术打印形状为曲线和交叉图案的纳米颗粒-聚合物复合材料，并创建作为导电微结构的平行线（图 8.1(d))）\
  \ [712]，[713]，[714]。\n\n在单向电场下对导电颗粒进行电场图案化对齐已用于基于 VAT 树脂的技术制造具有图案化和组织的结构。在这里，通过场诱导颗粒取取来打印石墨烯片和碳纳米管，以增强机械性能并强制受控的裂纹扩展，或选择性地对颗粒和打印区域进行对齐，以构建类似母片的对齐石墨烯纳米片结构，这不仅通过抵抗裂纹扩展增强了复合材料的强度，还引入了电学特性，能够通过电阻变化感知损伤\
  \ [627]，[715]，[716]，[717]。\n\n磁场也可以以类似于电场的方式引入 VAT 技术。这里的磁性图案化是指通过外部方向性磁场对磁活性颗粒（铁磁性）进行对齐和分布，从而调节打印结构的磁性，或通过控制增强纳米材料的取向和位置来调节机械性能\
  \ [138]。使用带有五个正交电磁铁并填充有磁性纳米材料的紫外固化树脂的 SLA 打印机改变了复合材料中的剩余磁通密度 [718]。此外，可编程磁性用于外部磁场的远程驱动，在具有垂直纤维对齐的悬臂梁上执行，并定制了磁性纳米材料的局部浓度（图\
  \ 8.1(c))）。这种方法还允许制造复杂的结构，例如磁驱动叶轮或轮 [637]。\n\n\n图 8.1 (a) 直接墨水写入 3D 打印过程中流体剪切力诱导的纳米颗粒对齐\
  \ 702]。经 Springer Nature 许可转载，版权 2016。(b) 通过吸取含有水性石墨烯的微吸管制造石墨烯纳米线的示意图，以及使用两个石墨烯拱组装的悬浮石墨烯接头结构\
  \ [97]。经 Wiley and Sons 许可转载，版权 2014。(c) SLA 技术的磁辅助 3D 打印复合材料 [632]。根据 Creative\
  \ Commons BY 协议许可，2015。(d) 光聚合固化技术中嵌入导电线的声学图案化，具有嵌入导电纳米颗粒的锯字形缝线图案 [714]。经 IOP Publishing\
  \ 许可转载，版权 2017。\n\n\n\n\n增材制造在生物医学工程中已具有稳定的地位，特别是在定制植入物的生产方面。此外，打印技术在生物医学传感器或前文提到的\
  \ 3D 打印实验室芯片微系统领域也得到了广泛探索。一个明显的进步是将 3D 打印电子设备与植入物相结合，应用于生物医学领域 [719], [720], [721]。其中一个有趣的方面是通过嵌入式电子系统来增强生物医学应用的功能。这里的挑战在于用于\
  \ 3D 打印生物电子学的材料的生物相容性，以确保设备能够成功植入组织 [722], [723]。人们极大的兴趣在于无需移除的生物可吸收材料 [724], [725]。对碳基纳米材料生物医学应用的研究表明，它们具有良好的生物相容性，这可能促进\
  \ 3D 打印生物电子学的发展 [726]。打印电子技术已经探索了多种使用生物相容材料的策略，包括：在小鼠体内植入 6 周的超低电压体内神经刺激电极（由 `PEDOT:PSS`\
  \ 凝胶材料制成，性能优于传统铂电极 10 倍） [727]、由丝胶蛋白制成的用于实时脑监测共形生物电子系统 [728]、生物可吸收传感器、换能器和脑压无线监测系统（包括可降解的\
  \ `poly(l-lactic acid)` 压电纳米纤维 [729]）以及一种用于非接触无线监测动脉血流的柔性可降解脉冲传感器 [730]。\n\n目前已有若干尝试将增材制造改造用于制造具有生物医学应用的\
  \ 3D 组件。一种方法是使用 `DIW` 技术打印基于碳纳米材料的导电且具有机械柔性的支架，用于体内电刺激细胞增殖的实验 [99]。在实验 30 天后，支架与宿主组织整合，新的毛细血管生长植入物中，过滤器官中没有出现炎症迹象或石墨烯积累。最令人印象目的成就之一是使用\
  \ `DIW` 打印了一对仿生耳，能够增强射频接收和音乐听觉感知（图 8.2(a, b))） [731], [732]。\n\n研究人员打印了一个带有活软骨细胞的耳朵形状再生支架，并在耳朵内共打印了由银纳米颗粒浆料通过\
  \ `DIW` 打印的线形天线。在弯曲基底（此处直接在人体皮肤上）上共形打印的触觉传感器同样是用银纳米复合浆料通过 `DIW` 打印，用于检测脉冲、手指运动和湿度（图\
  \ 8.2(d))） [608], [686]。随后，该系统配备目标表面跟踪系统在猪肺表面沉积应变传感器电极，并通过电阻抗断层法测量变形 [609]。\n\n\n\
  \n电子产品的极大普及导致了其快速更替，引发了日益严重的电子垃圾问题。这个问题正通过瞬态技术（transient technology）得到解决，这是一个新兴领域，要求材料、器件和系统在运行一段时间后消失，仅留下不可追踪的残留[734]。\n\
  \n近年来，这一趋势已扩展到电子系统，并将显著影响先进电子设备的发展[735], [736], [737]。\n\n在增材制造中，生态材料非常流行（例如 `PLA`、`PCL`、`PHA/B`），其性能与流行的聚合物匹配[738],\
  \ [739]。快速的文献分析显示，各种生物聚合物（`PLA`、`PDLLA`、`PCL`、`PHA/B`、`shellac` 和纤维素）也应用于电子领域[740],\
  \ [741], [742], [743], [744]；水基聚合物和绿色溶剂[243], [362], [745], [746]；面向生物降解的碳纳米材料[747],\
  \ [748]；以及近期关于生物降解电子设备的 `Zn` 和 `Mg` 颗粒的研究[744], [749], [750], [751], [752]。\n\n\
  瞬态电子学还涉及前文提到的医学领域，即用于植入物的生物吸收电子设备[720], [737], [753]，甚至是新奇的食用电子设备[754], [755]。大多数此类材料非常适应\
  \ 3D 打印[756], [757], [758]。使用生态材料的电子设备的效率、性能或可靠性将显著影响生物降解 3D 打印电子设备的普及[734]。\n\n\
  结构性电子设备制造领域的先进成就展示了几个示例，涉及新型环保材料，例如使用水基石墨烯氧化复合糊料通过 `DIW` 技术制造的锂离子电池[578] 以及一个 3D\
  \ 打印的微型水基锌离子电池[583]。尽管其他组件不那么环保，例如高浓度氧化石墨烯固体电解质以及作为正负极的 `LFP/LTO`，但这种水基材料的应用是制造领域中的一种流行趋势。\n\
  \n图 8.3 (a) 一个全“生物”OFET，利用焦糖基底、具有腺嘌呤/鸟嘌酸电电质的 `Al` 栅电极以及无毒纺织染料靛黄作为半导体，制造在胶质胶囊上[755]。经\
  \ John Wiley and Sons 许可，版权所有 2010。(b) 瞬态射频系统：在丝绸基底上用 `Mg` 构建的天线展示了在去离子水中 2 小时内的溶解过程[751]。经\
  \ John Wiley and Sons 许可，版权所有 2013。(c) 由四个 `Mg`-`Mo` 电池串联组成的电池包，并可视化展示了电池的溶解过程[752]。经\
  \ John Wiley and Sons 许可，版权所有 2014。(d) 由完全食用材料制成的变色温度传感器，腔体由蜡制成，放置在块猪皮上[754]。转自美国化学学会，根据知识共享署名-非商用性使用许可协议\
  \ CC BY 4.0 许可，版权所有 2022。\n\n\n\n如今研究最充分的材料群是导电热塑性丝胶、导电墨水和浆料，它们用于 `FDM`、`DIW`、`inkjet`\
  \ 或 `AJP`。标记为“导电丝胶”或“导电浆料”材料的主要障碍是高电阻（比块体金属低几个数量级）。另一方面，用于 `inkjet` 和 `AJP` 的高导电墨水不足以制造宏观整体结构。低电阻电路的另一种方法是直接沉积液态金属。几十年来，金属一直以粉末形式（钛、钢等）被用于增材制造，并在高温工艺中通过高功率激光或电子束进行烧结或熔化。另一方面，低熔点金属和合金也被用于增材制造。研究人员利用类似于\
  \ `inkjet` 的技术沉积熔融金属滴，制成了锡基材料的 3D 结构（图 8.4(a)） [181]。由于挤出温度与聚合物相似，焊料合金也被用于消费消费级\
  \ `FDM` 打印机中。多个团队展示了通过这种方式制造的结构元件（图 8.4(c)） [759], [760], [761], [762]。因此，使用熔融金属制造通过\
  \ `FDM` 技术制造的电路的想法应运而生。2009 年，巴斯斯大学通过使用 `RepRap` 打印机在平坦的 ABS 基上上沉积简单形式的 `FDM` 打印电子电路，测试了这种方法\
  \ [763]。4 年后展示了该概念的另一个证明，但仅以“电路图案”的形式呈现，而非完全功能的电子电路（图 8.4(d)） [764]，随后还尝试通过 `FDM`\
  \ 打印熔融合金路径来制造一个完全功能的双稳多谐振器 [182]。此外，还评估了使用铋基合金浆料形式通过 `DIW` 打印制造双层 PCB 的方法 [765]。铋合金也被用于电流体动力打印，为带有电池和\
  \ LED 的增材制造双层电路形成垂直连接孔（VIAs） [766]。利用 `StarJet` 还展示了熔融合金喷墨打印的全功能系统，该设备能够打印焊料合金，也能打印熔融铝\
  \ [767]。\n\n另一种方法是使用室温下保持液态的金属合金，例如共晶镓��合金，它们仍然表现出高导电性、易变形且具有自修复能力（图 8.4(b)） [75],\
  \ [768], [769], [770], [771]。有趣的是，大多数液态合金和金属在 3D 固化后仍保持其导电性 [772], [773]。另一种方法是在凝固点以下使用\
  \ `DIW` 进行 3D 打印 [455]。不同的方法包括制造复合浆料或凝胶，它们为机电传感器形成导电网络 [775], [776]。\n\n![图 8.4\
  \ (a) 圆管 [181]。 (b) 增材制造液态金属 [768]。 (c) 高导电 3D 打印 [759]。 (d) 熔融丝胶 [761]。](graphic/converted/b_9783110793604-008_fig_004.jpg)\n\
  \n\n\n\n4D 比 3D 更进了一步，尽管我们无法实现宇宙的几何限制。文献中描述的 4D 打印仍然 3D 打印（有时甚至是 2D）方法，它结合了时间上的几何修改[777]。其形状或物理属性随时间变化，以响应外部刺激（温度、化学剂、光等）[777],\
  \ [778], [779], [780], [781], [782]。常用的刺激之一是光，这是一种吸引人的刺激方法，能够通过强度和波长的调节实现高精度。通过\
  \ 3D 打印制造了一种光响应药物递送设备，它表现出在近红外（NIR）光照射下通过光热加热激活的形状变化[783], [784]。利用精确的 `2PP` 技术，打印了带有金纳米线和液晶基质的微型结构，这些结构在光刺激下会迅速改变形状[785]。使用水胶复合胶料通过\
  \ `DIW` 技术和剪切诱导对齐打印了架构，这些架构在放入水中时可以折叠和扭转[702]。这种花形结构表现出变异性的溶胀行为，在湿润时模拟花朵的折叠[702]。此外，利用磁性纳米颗粒聚合物复合材料打印了磁响应响应型结构，该结构在交变磁场下改变形状并诱导温度升高[786]。磁刺激还用于控制用\
  \ `DIW` 技术从填充有铁纳米颗粒的 `PDMS` 打印的软机器人，具有快速的动作速度（一秒内）[787]。基于含有铁氧化物的 `PLA` 基混合物的复合胶被用于打印在磁刺激下显示形状恢复的结构，并应用于制造血管内支架，该支架在磁加热时会收缩，在植入后冷却时扩张[788]。形状变化的增材制造“4D\
  \ 打印”元件示例见图 8.5。\n\n\n# 9 结论\n\n我们生活在一个新技术飞速发展的时代，例如纳米技术、人工智能、工业 4.0 以及这里提到的增材制造，预计这将成为许多技术领域新进展的关键增长动力。增材制造的许多当前应用基于探索最充分的技术，例如熔融沉积建模或激光烧结和熔化金属粉末。这些技术已经开发了几十年，并且针对组件的大规模生产进行了了优化。然而，这种方法仅对某些特定行业是有效的，例如汽车、生物医学、建筑施工或定制化、快速原型或或服务。尽管增材制造在上述许多领域占有一席之地，但它仍然是一个不断增长的市场，每年都会开发侧重于新材料、替代打印方法或专用软件和设计方法的新方法。这一切都是为了让增材制造更容易被工业界采用。最终目标是促进\
  \ 3D 打印方法用于制造最终产品，而不是目前最常见的原型和演示机。3D 打印提供的能力允许引入新的设计技术，这除了产生组件的新形状外，还能实现最期待的能量和材料减少、生产流程的简化（可以节省时间和金钱），并减少废弃物的产生。3D\
  \ 打印的未来在于生产组装阶段的简化，以及整个生产过程的高度自动化，最终允许更高程度的集成，这是提高效率、减轻重量以及先进设备新应用的关键因素，同时也让这些设备环绕我们的日常产品和电器。一旦这些挑战得到解决，3D\
  \ 打印这项令人兴奋的新技术将解决社会最重要的挑战，并简化普通人的日常生活。\n\n\n\n\n\n增材制造的一个日益增长且重要的方向是电子设备制造的新水平。为了充分利用增材制造在电子技术（特别是商业应用）中的潜力，有必要调整现有的工艺技术，或者为功能性电子材料开发新的方案。这为适应高效的大规模生产技术带来了特殊挑战。在大规模生产导电电路和组件（如导电路径、电感器、天线或传感器）方面的初步尝试，为微观和宏观世界研究成果与实际应用之间的差距铺了道路。尽管进展缓慢，但我们需要记住，目前金属粉末选择性激光熔化技术的专业应用花费了二十多年的时间，才成为航空航天或医疗领域专业制造高可靠组件的工业级应用。实验室实验结果（通常具有卓越的性能）与更大规模生产或更高技术就绪水平下获得的结果之间存在显著差异（例如导电性、导热性、半导体特性或机械强度等方面），这种相关的明显应用障碍需要更详细的探索。如本书所示，实验结果和实际应用演示表明，增材制造方法在结构化电子大规模生产中的新兴应用前景广阔。这需要随着时间的推移，实现实验室、大学与大型生产规模设施之间的协同和知识转移，以充分利用这些具有前景的特性。针对功能材料的电、光、力或化学性能，以及为了适应制造技术以高效利用这些卓越特性的开发程序，已经有了大量的科学研究。\n\
  \n3D 打印结构化电子的探索领域非常广阔。我们可以深入研究此处未提到的领域，例如纳米材料在 3D 打印中的应用、基底材料调制和表面活化、微纳米结构化、混合方法（如选择性电化学沉积使\
  \ 3D 打印低电阻复合材料实现金属导电性）、用于 SLA 或直接喷墨技术的树脂基 UV 固化材料制造导电结构、高频无线电路的精密制造、更广泛的医疗、军事或救援应用、航天器和行星探索等。书中提到的所有内容都展示了电子\
  \ 3D 打印领域的突破进展和小成功，旨在成为跳跃思维的催化剂，允许我们重新想象和重新设计电子制造方法。如果我们想象正处于新发现和新技术实现的边缘，例如用于材料制备的人工智能和生成式设计，随着工业自动化和机器人化水平的提高，并缓慢而持续地步入环境中立和高效能社会的下一次工业革命，电子以及我们周围大多数商品的增材制造，使它们配备越来越多智能解决方案的方法，最终将成为一种日常的普通制造方法，成为社会增长的新常态和实用解决方案。\n\
