    information in the token that is necessary to ensure total ordering and virtual
    synchrony. Once the commit token rotates back to the representative of the logical
    ring, the representative node would have compiled sufficient information to proceed
    to the Recovery state. Likewise, when a non-representative node receives the commit
    token the second time, it receives the information necessary to perform recovery.
    Hence, the receiving of the commit the second time is the event that triggers
    a node to transit from the Commit state to the Recovery state.


    A node would perform the following actions collectively referred to as the Shift-to-Recovery()
    function:'
