  md: '# 10


    # Blockchain Applications


    The blockchain technology has attained huge interest in the last several years.
    In an early book on blockchain applications published in 2015 [60], which has
    been cited nearly 3,000 according to Google Scholar, Swan painted a rosy future
    for blockchain. She regarded blockchain systems that offer cryptocurrency as the
    main functionality (such as Bitcoin) as blockchain 1.0, blockchain systems that
    offer smart contract (such as Ethereum), as blockchain 2.0. She envisaged a new
    type of systems that take advantages of the many intrinsic properties of the blockchain
    technology, which she terms as blockchain 3.0. She further divided blockchain
    3.0 into two types of applications, one she terms as justice applications, and
    the other as efficiency & coordination applications. The former primarily includes
    organizational or governmental services, such as a decentralized domain name system,
    digital identity verification and document attestation, and blockchain-based governments.
    The latter spans any applications that could exploit the blockchain technology
    for higher efficiency and more reliable coordination (with smart contract). Indeed,
    from the economic point of view, any technology that can be used to reduce transaction
    cost could potentially'
  merge: -1
  img_proc: true
- pgno: 409
  md: 'play a big role in the society. A great example for such technology is the
    Internet and World Wide Web. In the book, Swan placed great emphasis on the value
    of decentralization. While decentralization is attractive, not everyone agrees
    with such a view considering how our societies are organized. By all means, we
    do need many services and protections from the governments. Digitally technology,
    not matter how trustworthy it can bestow on a system, cannot be extended to physical
    activities in our everyday life that require trust on governments or trusted third
    parties. In a recent paper authored by Xu and Zou [68], they provided an excellent
    discussion on the value and potential of the blockchain technology from the economic
    point of view, particularly regarding decentralization and the trust outside the
    blockchain platform.


    In this chapter, we first introduce our insight on the value of the blockchain
    technology in terms of different levels of benefits it can bring to applications.
    Second, we review the existing proposals on various blockchain applications for
    cyber-physical systems (CPS). With the permeation of the digital and Internet
    technologies in our society, more and more physical operations are cyber-enabled.
    We are using Internet of Things (IoT) to collect data and to control various home
    and industrial devices [50]. Hence, most of the applications can be regarded as
    some form of CPS [83]. Third, we summarize the work on addressing the limited
    blockchain throughput issue using various means. Finally, introduce the work by
    Xu and Zou [68] on their view of what blockchain can and cannot do and their opinion
    on the balance between decentralization and the trust on third parties.


    # 10.1 The Value of Blockchain


    The value of blockchain is reflected from the benefits that it could bring to
    applications. Instead of itemizing all of the benefits in a monolithic manner
    like most of the published literature did, we create a structure on the numerous
    benefits, as shown in Fig. 10.1. First, we differentiate between non-functional
    and functional benefits. By non-functional benefits, we mean the properties that
    describe the quality of services of a system, and such properties are independent
    from the functionality of the system. The most well-known non-functional properties
    are security and dependability. By functional benefits, we mean the benefits that
    can be'
