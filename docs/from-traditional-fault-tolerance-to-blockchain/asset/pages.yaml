    in the form of an N-element array. We refer to the nodes in the system in terms
    of their indices, from 0 to N-1. For node i, the corresponding element in its
    vector clock, $VC_i[i]$, represents the number of events that have happened locally
    to node i. It learns the values for other elements from the timestamps piggybacked
    with the messages sent by other nodes to node i.


    For data replication, the rules for using the vector clock by a system consisting
    of N master sites for an operation-transfer system are defined as follows:


    +   - On submission of a new operation $O$ at site $i$, where $i$ ranges from
    0 to $N-1$, the element $i$ of the vector clock at site $i$ is incremented by
    1, i.e., $VC_i[i] = VC_i[i] + 1$.

    +   - Then, the operation is assigned the current $VC_i$ value as the timestamp
    of the operation, i.e., $O.vc = VC_i$.

    +   - When propagating the operation to other replicas, the assigned timestamp
    is piggybacked with the operation.

    +   - On receiving an operation $O$ at site $j$, the site $j$ updates its vector
    clock in the following way:

    +     - For each element $k \neq j$ in the vector clock, $VC_j[k] = max(VC_j[k],
    O.vc[k])$


    Note that on receiving an operation from site $i$, site $j$ might advance its
    vector clock at an element $k$ other than $i$ if site $i$ receives an operation
    ahead of $j$. Site $j$ might want to request a retransmission for that operation.
    If the communication channel between $i$ and $j$ does not ensure the first-in-first-out
