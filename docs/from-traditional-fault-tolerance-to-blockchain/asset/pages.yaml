    So far we have only considered static membership without failures. We now discuss
    how to adapt the vector clock based causal ordering protocol when the membership
    changes. We define additional mechanisms to cope with the addition of new nodes
    in the membership, and to cope with the failures of nodes in the current membership.
    The mechanisms assume the availability of a first-in-first-out (FIFO) reliable
    communication channel for broadcast messages among the nodes in the system. Although
    physical broadcast such as UDP broadcast or IP multicast does not ensure FIFO
    reliable delivery of broadcast messages, it is relatively easy to implement such
    service.'
