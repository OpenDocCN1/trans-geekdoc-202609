    # ## 4.1 Service Replication


    In service replication, the client-server interaction model is typically used
    where one or more clients issue requests to the replicated server and wait for
    the corresponding responses synchronously. Multi-tiered interaction can be supported
    by super-imposing the client-server models. Service replication algorithms are
    often designed to operate in an asynchronous distributed computing environment,
    where there is no bound on processing time, no bound on message delays, and no
    bound on clock skews. Algorithms designed for asynchronous environment are more
    robust because their correctness does not depend on timing.


    In service replication, each server replica is run as an application process.
    The server must export a set of interfaces for the clients to invoke remotely
