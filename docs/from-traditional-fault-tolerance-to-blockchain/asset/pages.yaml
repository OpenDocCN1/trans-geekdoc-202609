- pgno: 130
  md: 'To increase the chance of delivery during replay, the bounce message is deferred.


    On the IMAP side, the consistency test is based on the comparison of the externalized
    state as the result of a verb. The externalized state includes the following:


    +   - The email message itself (the text and the attachments, if any) if one is
    fetched.

    +   - The list of email headers, such as To, From, Cc, and Subject, for verbs
    that involve listing of emails.

    +   - The list of folders for verbs that requested them.

