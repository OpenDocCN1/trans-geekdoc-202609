  md: '# 7.2.7 Optimizations


    Reducing the cost of cryptographic operations. The most significant optimization
    in PBFT is to replace digital signatures by message authentication code for all
    control messages except the checkpoint, view-change and new-view messages. According
    to [4], message authentication code (MAC) based authentication can be more than
    two orders of magnitude faster than that using digital signatures with similar
    strength of security.


    The main reason that MAC-based authentication is much faster than that digital
    signature based authentication is that MACs use symmetric cryptography while digital
    signatures are based on public-key cryptography. To use MAC, two communication
    parties would need to establish a shared secret session key (or a pair of keys,
    one for each communication direction). A MAC is computed by applying a secure
    hash function on the message to be sent and the shared secret key. Then the computed
    MAC is appended to the message. The receiver would then authenticate the message
    by recompute the MAC based on the received message and its secret key and compare
    with the received MAC. The message is authenticated if the recomputed MAC is identical
    to the received MAC.


    For a message to be physically multicast (using UDP or IP multicast) to several
    receivers, a vector of MACs is attached to the message. The vector of MACs is
    referred to as an authenticator. In an authenticator, there is one MAC for each
    intended receiver.


    The purpose of using digital signatures in pre-prepare, prepare, and commit messages
    is to prevent spoofing. Using MACs instead of digital signatures could achieve
    the same objective. To see why, consider the following example. Replica i is faulty,
    and Replicas j and k are not faulty. We show that replica i cannot forge a message
    sent to replica j preventing that replica j sent it. Even though replica i has
    a shared secret key with replica j, it does not know the shared secret key between
    replica j and replica k. Therefore, if replica i were to forge a message from
    replica j to replica k, the MAC cannot be possibly correct and replica k would
    deem the message invalid. Therefore, during normal operation, the pre-prepare,
    prepare, and commit messages can be protected by MACs instead of digital signatures
    without any other changes to the PBFT algorithm.'
  merge: -1
  img_proc: true
- pgno: 305
  md: 'For the checkpoint message, even though it is possible to use MACs instead
    of digital signatures during normal operation, when the proof for a stable checkpoint
    is needed, a new control message, called check-sign message, which is protected
    by a digital signature, must be exchange among the replicas to assemble the proof.
    Considering that checkpoints are taken periodically (say one for every 100 requests
    executed), it is more beneficial to use digital signatures in the first place
    for simplicity of the algorithm and faster recovery (because the proof is needed
    during view changes and when to recover a slow replica).


