  img_proc: true
- pgno: 410
  md: '![](img/7320b1480d74f1d65f74659cab456782_410_0.png)


    Figure 10.1 Main benefits of blockchain for applications.


    employed to implement the functionality of the system. In other words, the functional
    perspective refers to what the system does (_i.e._, services), and the non-functional
    perspective refers to how well the system does its job (_i.e._, the quality of
    services).


    # 10.1.1 Non-functional benefits


    The non-functional benefits can be roughly divided into three levels. At the bottom
    level are the most obvious benefits of blockchain: security and dependability.
    At the middle level are privacy and immutability. At the highest level is trust.


    A closer look at what blockchain can provide regarding security and dependability
    reveals that the benefits at the bottom level are availability and integrity.
    As we have elaborated in Chapter 1 of this book, availability and integrity are
    properties of both a secure system and a dependable system. However, the interpretations
    for these two terms are actually slightly different. In the context of dependability,
    availability refers to the probability of the system is ready to serve its clients
    at any given time, and the integrity largely refers to the correctness of the
    services a system provides. Due to the massive degree of replication (there are
    around 10,000 miners in the Bitcoin network, for example) and the various verifications
    (the most relevant being the cryptographic hash of the block header) ensure that
    each copy of the blockchain has not been tampered with. The availability and integrity
    of the system, if it is enabled by blockchain, are guaranteed this way.'
