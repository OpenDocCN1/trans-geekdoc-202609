- pgno: 413
  md: '# 10.1.2 Functional Benefits


    In addition to non-functional benefits, blockchain could also facilitate the design
    and implementation of core functions in a blockchain-enabled application. We first
    group functional benefits into two: (1) data-related, and (2) processing-related.
    Then, there is another benefit that span both data and processing. The data-related
    benefit primarily refers to data provenance. Data provenance [57], or end-to-end
    traceability [8], refers to the property that the chronology of the ownership,
    custody and/or location of a data item can be fully established and attested.
    Data provenance can be implemented based on immutability. Blockchain records the
    original owner of a data item and the timestamp when the item is placed in the
    blockchain. What is more, blockchain essentially totally orders all data items
    (i.e., the transactions). Hence, the chronology can be easily established. The
    transfer of cryptocurrency ownership can be tracked and the records cannot be
    changed. Hence, the custody of data items (i.e., if the data can be encoded via
    cryptocurrency) can be unambiguously tracked. Hence, data provenance is an essential
    functionality for regulatory applications (e.g., to meet governmental regulations)
    and accounting applications.


    In addition to the protection of data, an application can use smart contract to
    ensure atomic execution of code as defined in the contract. Previously, fault
    tolerant processing has attracted tremendous amount of research and development,
    as can be seen in chapters 3-7 in this book. Unfortunately, few practical systems
    that ensures fault tolerant processing are available to the public. One reason
    is that general purpose computing (via programming languages and operating systems)
    supports multithreading (i.e., concurrent processing) and many forms of asynchronous
    interactions that render the processing of a program nondeterministic, and as
    such, it is incredibly difficult to replicate such processes and still ensure
    consistency among the replicas [17, 18, 19, 20, 73, 75, 77, 81, 82, 84, 85, 86,
    90]. Ethereum can be viewed as the first platform that supports secure and fault
    tolerant large-scale processing. Indeed, the design goal for Ethereum is to run
    as a world-wide computer under decentralized consensus and storage that supports
    arbitrary state and is capable of executing code of arbitrary and unbounded complexity.
    A key design choice is to ensure deterministic processing where transactions and
    smart contracts are executed via an Ethereum Virtual Machine (EVM)'
