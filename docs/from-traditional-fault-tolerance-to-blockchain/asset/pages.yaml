    # 10.4.1 Blockchain Technology from the Economic View


    From the economic point of view, blockchain created a new token paradigm, where
    the token could be cryptocurrency or the digital presentation of some assets.
    Public blockchains all share three key features:


    +   - Blockchain consensus is about agreeing on the state change due to token
    transfer between different addresses. The consensus ensures that token transactions
    inside blockchain are not subject to the traditional settlement risk. The settlement
    risk occurs because a traditional transfer of fund between two accounts happens
    in two distinct steps, one withdrawal and another deposit, and if the deposit
    step does not occur as expected, the settlement of the transfer fails. Transactions
    in blockchain are executed atomically in a single step. Hence, the settlement
    risk is avoided.

    +   - Smart contracts and tokens are inseparable. First, some form of token (_i.e.,_
    gas in Ethereum) is used to ensure that no smart contract would run indefinitely
    (_i.e.,_ a potential risk of enabling Turing-complete computation). Second, higher
    level tokens in tokenization-based applications rely on a smart contract to create
    and manage tokens.

    +   - Information that is not related to tokens in a transaction is not protected
    by the consensus algorithm in blockchain. Actually, what concerns Xu and Zou is
    not consistency of such information across different miner (because all miner
    would see exactly the same transaction content even for information unrelated
    to token transfer). They are concerned about the integrity and validity of the
    token-unrelated information placed in a transaction. Such information could be
    fake and it requires an oracle mechanism to ensure fake information is never accepted
    into a transaction. That is, they hope that such information is validated to'
