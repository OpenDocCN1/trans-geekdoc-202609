    If n1 and n2 are not consecutive proposals, any intermediate proposals must also
    select v1 as the value according to the above argument. This concludes the proof
    of correctness for the safety property S1.


    The liveness of the Paxos algorithm cannot be guaranteed when two or more proposers
    propose concurrently. Consider the scenario illustrated in Figure 6.2. Assume
    that there are two competing proposers P1 and P2. P1 first completes the prepare
    phase and'
