- pgno: 276
  md: '# 7


    # Byzantine Fault Tolerance


    The fault tolerance approaches we have discussed in previous chapters all adopt
    a non-malicious fault model. In many cases, tolerating non-malicious faults, such
    as those caused by power outages and node failures, are sufficient for the dependability
    required for a system. However, it is reasonable to expect an increasing demand
    for systems that can tolerate both non-malicious faults as well as malicious faults
    for two reasons:


    +   - Our dependency on services provided via distributed systems (often referred
    to as cloud services, Web services, or Internet services) has increased to the
    extent that such services have become essential necessities of our everyday life.


    +   - Unfortunately, cyber attacks and cyber espionage activities have also been
    increasing rapidly and they may inject malicious faults into a system which may
    disrupt the services in a number of ways:


    +   - Denial of service. Some or all clients are prevented from accessing the
    service.'
  merge: -1
  img_proc: true
- pgno: 277
  md: '+   - Compromise the integrity of the service. A client’s request might not
    be executed as it should be and the response generated might not be correct.


    +   - The leak of confidential information (either confidential to the client,
    or confidential to the business owner).


    An arbitrary (encompassing both malicious and non-malicious) fault is often referred
    to as a Byzantine fault. The term Byzantine fault is first coined in [26] by Lamport
    et al. It highlights the following specific malicious faulty behavior:


    +   A faulty process might disseminate conflicting information to other processes.
    For example, a Byzantine faulty client might send different requests to different
    server replicas, and a faulty primary replica might propose different orders for
    a request to other replicas.


    Because a Byzantine faulty process can choose to behave as a non-malicious fault
    such as a crash fault, we can refer an arbitrary fault as a Byzantine fault. In
    the presence of Byzantine faults, the problem of reaching a consensus by a group
    of processes is referred to as Byzantine agreement [26].


    Byzantine agreement and Byzantine fault tolerance have been studied over the past
    three decades [26, 25, 5, 6]. Early generations of algorithms for reaching Byzantine
    agreement and Byzantine fault tolerance are very expensive in that they incur
    prohibitively high runtime overhead. In 1999, Castro and Liskov published a seminal
    paper on a practical Byzantine fault tolerance (PBFT) algorithm [5]. PBFT significantly
    reduced the runtime overhead during normal operation (when the primary is not
    faulty). Their work revitalized this research area and we have seen (at least)
    hundreds of papers published subsequently.


    # 7.1 The Byzantine Generals Problem


    In [26], Lamport et al. pointed out the need to cope with faulty components that
    disseminate inconsistent information to different parts of the system. For example,
    in a distributed system that requires periodic clock synchronization, one of the
    processes, process k, is faulty in the following ways:


    +   When process i queries k for the current time at local time 2:40pm, process
    k reports 2:50pm.'
  merge: -1
  img_proc: true
- pgno: 278
  md: '+   - Concurrently process $j$ queries $k$ at local time 2:30pm, process $k$
    reports 2:20pm.


    If process $i$ and process $j$ were to adjust their local clocks based on the
    information provided by the faulty process $k$, their clocks would diverge even
    further (e.g., 2:45pm for process $i$ and 2:25pm for process $j$).


    # 7.1.1 System Model


    The distributed consensus problem in the presence of this type of faults is framed
    as a Byzantine generals problem in which a group of generals of the Byzantine
    army encircles an enemy city and decides whether to attack the city together or
    withdraw. One or more generals may be traitors. The only way for the Byzantine
    army to win the battle and conquer the enemy city is for all the loyal generals
    and their troops attack the enemy city together. Otherwise, the army would lose.


    The generals communicate with each other by using messengers. The messengers are
    trustworthy in that they will deliver a command issued by a general in a timely
    manner and without any alteration. In a computer system, each general is modeled
    as a process, and the processes communicate via plain messages that satisfy the
    following requirements:


    +   - A message sent is delivered reliably and promptly.

    +   - The message carries the identifier of its sender and the identifier cannot
    be forged or altered by the network or any other processes.

    +   - A process can detect the missing of a message that is supposed to be sent
    by another process.


    To tolerate $f$ number of traitorous generals, $3f + 1$ total generals are needed,
    one of which is a commander, and the remaining generals are lieutenants. The commander
    observes the enemy city and makes a decision regarding whether to attack or retreat.
    To make the problem and its solution more general, we expand the scope of the
    command issued by the commander process to contain an arbitrary value proposed
    by the commander (i.e., the value is not restricted to attack or retreat). A solution
    of the Byzantine generals problem should ensure the following interactive consistency
    requirements:'
  merge: -1
  img_proc: true
- pgno: 279
  md: 'IC1 All non-faulty processes (*i.e.*, loyal generals) agree on the same value
    (*i.e.*, decision).


    IC2 If the commander process is not faulty, then the value proposed by the commander
    must be the value that has been agreed upon by non-faulty processes.


    Intuitively, a solution to the Byzantine generals problem would contain the following
    steps:


    +   - The commander issues a command to all its lieutenants.

    +   - The lieutenants exchange the commands they have received with each other.

    +   - Each applies a deterministic function, such as the majority function, on
    the commands it has collected to derive a final decision.


    A big concern for the solution is that the set of commands collected by different
    loyal generals might not be the same for two reasons:


    +   - The commander may send different commands to different lieutenants.

    +   - A traitorous general might lie about the command it has received from the
    commander.


    A solution to the Byzantine generals problem must ensure that the set of commands
    received by loyal lieutenants be the same. Apparently the total number of generals
    needed to tolerate f traitorous generals has to be greater than 2f + 1 because
    a lieutenant could not know which decision is the right one if f commands are
    “Attack” and the other f commands it has collected are “Retreat”. Defaulting to
    “Retreat” or “Attack” in this case might result in loyal generals making different
    decisions, as shown in the following example.


    # EXAMPLE 7.1


    Assume that there are three generals, G0, G1, and G2, and one of them might be
    traitorous. We consider two scenarios. In the first scenario, lieutenant 2, G2,
