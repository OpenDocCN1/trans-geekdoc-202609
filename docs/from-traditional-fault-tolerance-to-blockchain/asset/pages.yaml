    Once a conflict is detected, the next step is to reconcile the conflict. It is
    obvious that not all conflicts can be reconciled automatically in a generic manner
    because conflict reconciliation is inevitably application specific. Nevertheless,
    in some cases, conflicts can be reconciled automatically by exploiting application
    semantics. It has been reported in a number of systems that the majority of conflicts
    can in fact be reconciled automatically [16, 31]. For example, it is possible
    for two or more replicas to modify the same file in exactly the same way. Even
    though the version vectors for the updates at different replicas would report
    conflicts, the file'
