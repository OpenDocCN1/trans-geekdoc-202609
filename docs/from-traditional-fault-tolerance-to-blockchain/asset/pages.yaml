    When the representative of the new logical ring receives the commit token the
    first time in the `Recovery` state, it converts the commit token to the regular
    token. Furthermore, it sets the `retrans_flg` field in the token to `true` if
    its `retrans_msg_queue` is not empty. Otherwise, it sets the `retrans_flg` field
    to `false`.


