    # ## 2.1.3 Piecewise Deterministic Assumption


    Checkpoint-based protocols only ensure to recover the system up to the most recent
    consistent global state that has been recorded and all executions happened afterwards,
    if any, are lost. Logging can be used to recover the system to the state right
    before the failure, provided that all events (that could potentially change the
    state of the processes) are logged and the log is available upon recovery. This
    is what is referred to as the piecewise deterministic assumption [21]. According
    to this assumption, all nondeterministic events can be identified and sufficient
    information (referred to as a determinant [1]) must be logged for each event.
    The most obvious example of nondeterministic events is the receiving of a message.
    Other examples include system calls, timeouts, and the receipt of interrupts.
    In this chapter, we typically assume that the only nondeterministic events are
    the receiving of a message. Note that the sending of a message is not a deterministic
    event, i.e., it is determined by a nondeterministic event or the initial state
    of the process [7].


    # ## 2.1.4 Output Commit


    A distributed system usually receives message from, and sends message to, the
    outside world, such as the clients of the services provided by the distributed
    system. Once a message is sent to the outside world, the state of the distributed
    system may be exposed to the outside world. If a failure occurs, the outside world
    cannot'
