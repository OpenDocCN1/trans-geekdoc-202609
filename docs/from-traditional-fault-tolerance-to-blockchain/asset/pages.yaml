  md: 'Such tokens represent some specific value in a restricted environment. Blockchain
    systems such as Bitcoin typically refer to their cryptocurrency some kind of coin,
    and the coins essentially carries exactly the same role of the physical tokens
    in these cases. Blockchain tokens are meaningful only in their own designated
    platform. Although blockchain tokens are originally designed to be a form of cryptocurrency
    (as is the case for Bitcoin), their meaning can be expanded to represent the right
    to some asset in the digital or physical world. This token-asset association is
    referred to as tokenization. The digital form of tokenization could open the door
    for many more application of the blockchain technology [5].


    There are two types of assets represented by tokens in blockchains [23]: (1) digital
    assets that can be entirely represented and used in the blockchain platform; and
    (2) other assets that corresponds to assets in the real world. The former is referred
    to as intrinsic to the blockchain, while the latter is extrinsic to the blockchain.
    An example of the former could be a token used for game playing in a Dapp. There
    are many more examples for the latter. For example, the blockchain token can be
    used to facilitate voting when a token represents the voting right in an organization,
    to facilitate identity management when a token is used to represent an individual,
    to enable attestation services when a token represents a certificate for an academic
    degree or marriage certificate etc. Interestingly, a particular form of tokenization
    is to use a token to peg with a real-world currency such that the exchange rate
    is always one-to-one, which could solve the issue of wide fluctuation in cryptocurrency
    prices.


    We should note that tokenization for extrinsic assets necessitates the involvement
    of trusted third parties to guarantee the bond between the token and the real-world
    asset. This is to mitigate the counterparty risk. If a transaction is trading
    some tokens representing some physical asset, there is a risk that the owner of
    the physical asset would not honor the trade described in the transaction. This
    is why a trusted third party would be needed to counter the risk.


    Except the built-in coin in a blockchain (e.g., Satoshi in Bitcoin, and Ether
    in Ethereum), all other blockchain tokens must be programmed explicitly. In Ethereum,
    these blockchain tokens are created and handled by smart contracts. To facilitate
    the development of Dapps that use such tokens, Ethereum introduced a standard,
    initially proposed by Fabian Vogelsteller in November'
  merge: -1
  img_proc: true
