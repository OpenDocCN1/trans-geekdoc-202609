    Chapter 6 discusses the consensus problem and describes several Paxos algorithms,
    including the Classic Paxos, Dynamic Paxos, Cheap Paxos, and Fast Paxos. While
    it is easy for a group of processes to agree on the same value if all processes
    can communicate with each other promptly and if none of them fails, distributed
    consensus is an incredibly hard problem when processes might fail and there might
    be extended delay to send or receive a message. The classical Paxos algorithm
    solves the consensus problem (under the non-malicious fault model) in a very elegant
    and efficient manner by separating the safety concern and the liveness concern
    [9]. Additional Paxos algorithm are developed to minimize the resources required,
    and to reduce the latency for achieving consensus by using a higher redundancy
    level [10, 18].


    Chapter 7 introduces the problem of Byzantine fault tolerance. A Byzantine fault
    is synonymous with a malicious fault. Because a malicious faulty component may
    choose to behave like any of the non-malicious faults, the Byzantine fault model
    encompasses any arbitrary fault. The distributed consensus problem under the Byzantine
    fault model was first studied several decades ago by Lamport, Shostak, and Pease
    [11]. A much more efficient algorithm for achieving fault tolerance under the
    Byzantine fault model (referred to as Practical Byzantine fault tolerance) was
    proposed by Castro and Liskov in 1999 [5]. Since then, the research on Byzantine
