    is responsible to handle clients’ requests according to the application logic.
    As such, the application server at the middle-tier maintains only session state,
    which typically consists of temporary state that lasts only for the session (e.g.,
    between when a user logs in and when the user logs out). Examples of the session
    state include the user’s shopping cart and the list of products that the user
