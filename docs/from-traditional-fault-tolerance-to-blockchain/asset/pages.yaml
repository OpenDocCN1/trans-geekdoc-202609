    # 4.3.5 Update Commitment


    As we mentioned earlier in this section, an additional step is necessary in both
    state transfer and operation transfer systems. The'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'primary objective for this step is to determine which update has been propagated
    to all replicas so that:


    +   - Records regarding an update can be garbage collected once every replica
    has received and applied the update.

    +   - The effect of the update to the system is now stable and the users can be
    assured that this update will not be altered due to conflict reconciliation. This
    is because:

    +     - Once the update has reached all replicas, all concurrent updates that
    might be in conflict with this update must have been reconciled.

    +     - This update would happen before any subsequently issued update by any
    replica, and the later update would bear a timestamp larger than the current update.
    Therefore, no later update could conflict with this update.


    A number of algorithms and mechanisms have been developed to help determine if
    an update has been stabilized (i.e., if all replicas have received and applied
    the update) for operation transfer systems. However, they should apply to state
    transfer systems else. Here we describe two of them. The first one is based on
    explicit acknowledgement, and the second one is based on timestamp matrices, which
    we have introduced in the context of operation propagation.


    For state transfer systems, there is an additional challenge - to determine when
    deleted objects can be safely removed from the system. This is important because
    if the deleted objects cannot be removed from the system, sooner or later they
    would saturate the storage (in the context of replicated file systems, for example).
    Typically, a two-phase commit algorithm is used to ensure an object is garbage
    collected only after all replicas have agreed to delete the object [15, 24]. In
    the first phase, all replicas are queried regarding the deletion. If all replicas
    agree, the object is finally removed from the system in the second phase. The
    algorithm is complicated by the possible delete/update conflict and its reconciliation.
    The detailed description of the algorithm is outside the scope of this book.


