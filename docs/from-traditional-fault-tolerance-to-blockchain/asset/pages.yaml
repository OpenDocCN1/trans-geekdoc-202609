    # 6.3.1 Checkpointing and Garbage Collection


    The Paxos algorithm is open-ended in that it never terminates – a proposer is
    allowed to initiate a new proposal even if every acceptor has accepted a proposal.
    As such, an acceptor must remember the latest proposal that it has accepted and
    the latest proposal number it has acknowledged. Because the Multi-Paxos is derived
    from Paxos, all server replicas must remember such information for every instance
    of the Paxos algorithm that it has participated in, even after it has long executed
    the request chosen by this instance. This would require infinite amount of memory
    space, which is obviously not desirable for practical systems.


