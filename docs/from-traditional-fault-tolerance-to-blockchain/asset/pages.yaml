    # 9.3.2 Using Computing as Resource


    Primecoin [15] proposed a puzzle design on the search for three types of prime
    number chains (_i.e._, the Cunningham chain of the first and the second kind,
    and the bi-twin chain). Unfortunately, the puzzle design suffered from two major
    issues [30]: (1) the puzzle does not follow a random distribution on leader election;
    (2) the verification violates the soundness requirement.


    Proof of exercise proposed a puzzle design on finding solutions for some matrix
    product problems offered by clients [28]. Unfortunately, the computing tasks are
    not guaranteed to have the same complexity level and hence the puzzle-solving
    process is not a stochastic process. Furthermore, the puzzle design failed to
    provide an efficient verification scheme.


    The useful proof of work (uPoW) [2] is a very promising puzzle design that rivals
    the PoW algorithms used in Bitcoin and Ethereum. It aims to find specific mathematical
    problems that are both useful and fulfill the puzzle design requirements for a
    noninteractive ZKP scheme as we have laid out previously. The k-Orthogonal Vectors
