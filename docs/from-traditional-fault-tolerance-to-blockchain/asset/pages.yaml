  img_proc: true
- pgno: 128
  md: '+   - Rename. It is used to rename an IMAP folder (or subfolder).


    +   - Delete. It is used to delete an IMAP folder (or subfolder).


    In [6], all 13 verbs are implemented in Java that conforms to a common Verb interface.


    To facilitate consistent replay after an undo and repair, a verb must also implement
    two interfaces, one is related to user-interaction timeline management, and the
    other is related to consistent management:


    +   - Sequencing interface. This interface includes three test methods and they
    all take another verb as the only argument:


    +   - Commutativity test. The test returns true if the two verbs are commutative
    (i.e., the outcome of the execution of either verb is independent of their relative
    ordering in execution).


    +   - Independence test. The test returns true if the two verbs can be executed
    concurrently (e.g., no race condition will be resulted in the concurrent execution
    of the two verbs).


    +   - Preferred-order test. If the two verbs are not commutative, this test returns
    the preferred execution order of the two verbs.


    These tests are necessary because the Undo Proxy does not control the execution
    order when the end-user requests are first executed at the application server,
    and the order in which the verbs are logged might not match that of the execution.
    During the replay, the Undo Manager can reinforce a semantically correct execution
    order with the same degree of concurrency level as that of the original execution.


    +   - Consistency-management interface. This interface also includes three methods
    used to handle externally visitable inconstancy:


    +   - Consistency test. This test compares the external output of the original
    execution of the verb and that of the replay. A straightforward test would be
    to compare the hash valued of the two outputs. However, such tests might produce
    unnecessary false positives because of cosmetic differences in the outputs. That
    is why the'
  merge: -1
