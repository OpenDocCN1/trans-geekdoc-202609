    Figure 8.6 also shows how the Merkle root is computed. Using an 8-transaction
    block as an example, the transaction ids (i.e., recall that the transaction id
    means the hash of a transaction) are lined up as the leaves of the tree at the
    bottom. The transaction ids are pair-wise hashed twice using SHA256. Then, the
    intermediate hash values are again pair-wise hashed to produce a higher-level
    node. This process will go on until the top node is produced, which is the root
    of the Merkle tree. The root node contains the information of all the leaf nodes.
    Any alternation of individual transactions in the block, the reordering of any
    transaction, deleting or inserting a transaction would all produce a completely
    different Merkle root. That is why when the blocks are chained together using
    the previous block hash field, the change of any transaction in a block would
    invalidate all later blocks that are chained to that block. This forms the foundation
    for the immutability of the ledger.


    The Merkle tree computation requires that the number of transactions is power
    of 2 so that the tree is balanced at each step in the computation. What if the
    number of transactions in a block is not power of two? The last component is duplicated
