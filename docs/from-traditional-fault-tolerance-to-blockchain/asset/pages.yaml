    # 8.4 Attacks on Blockchain


    In this section, we go over several possible attacks on the blockchain system.
    The most well-known attack is the double-spending attack. For physical cash or
    gold, once someone spent the money, the person would no longer have possession
    of the money. However, because cryptocurrency exists in a digital form only, one
    could still possess a copy of the digital money even after it has been spent.
    This imposes a grave concern that one could spend the money again, which is referred
    to as the double-spending attack. How to prevent the doublespending attack is
    therefore the primary concern on designing a cryptocurrency. The solution adopted
    by the blockchain-based cryptocurrency systems is to maintain a secure distributed
    ledger for all transactions that have ever taken place. The goal is to ensure
    that everyone has exactly the same copy and the ledger is append-only, i.e., more
    transactions can be added to the ledger, and once a transaction is recorded on
    the ledger, it becomes immutable.


    ![](img/7320b1480d74f1d65f74659cab456782_373_0.png)


    Figure 8.20 The double-spending attack steps.


    For Bitcoin, the only way to successfully launch a double-spending attack is to
    own more than half of the hashing power of the entire Bitcoin network. The attacking
    steps are illustrated in Figure 8.20. First, let''s assume that the attacker spend
    some cryptocurrency in a transaction Tx. Presumably that is a large-value'
  merge: -1
  img_proc: true
- pgno: 374
  md: 'transaction. Otherwise, it will not be economical for the attacker to commission
    such huge computing resources (i.e., more than half of the hashing power of entire
    network) for the attack. For the transaction to be successful, the transaction
    must have been confirmed, i.e., it has been included in a block that is newly
    mined and is (temporarily) added to the blockchain. Let this block be A. and its
    parent block be T. It is conceivable that the vendor who accepted the large quantity
    of cryptocurrency would wait at least for one confirmation to deliver the goods
    or services in exchange. If the vendor insisted for more confirmations, such as
    six as normally recommended for large-value transactions in Bitcoin, the cost
    for the double-spending attack would no longer make any economical sense. This
    is the first step.


    As soon as the attacker has received the goods or the services corresponding to
    the transaction Tx, the person would instruct its partners that collectively control
    more than half of the hashing power to mine a new block, and the miners will be
    informed to not include the transaction from which the attacker received goods/services.
    The attacker could opt to create a transaction that uses exactly the same set
    of transaction inputs as the ones used in the original transaction Tx to hide
    its trace, and asks the miners that it has control over to include this new transaction
    instead of Tx. This new transaction would have one or more transaction outputs
    that bear addresses belonging to the attacker (i.e., this new transaction would
    pay to the attacker itself). This new block B would choose A''s parent block T
    as the parent too. The presence of B forced a fork in the system because both
    block A and block B point to the same parent T. The miners would have to choose
    either A or B as the parent block. This is step 2. At this point, the decision
    can be arbitrary because both branches would have equal cumulative difficulty.


    Because the attacker has control over more than half of the hashing power, it
    will ask its miners to continue mining for one more block that uses B as the parent.
    Chances are that a new block C that uses B has the parent will be created before
    those miners that are not controlled by the attacker could mine a new block. If
    this is the case, then the attacker will have succeeded in launching a double
    spending attack because the C – B – T branch will be favored over the A – T brach
    due to containing more cumulative difficulty. This is the last step of the double-spending
    attack.'
  merge: -1
  img_proc: true
- pgno: 375
  md: 'The double-spending attack is also referred to as 51% attack to emphasize that
    it requires the attacker to have control over more than half of total hashing
    power. Once an attacker has this much hashing power, it can launch other forms
    of attacks. One of them is sustained denial of service attack against some users.
    The attacker could intentionally exclude all transactions that come from one or
    more users. If by any chance some of the transactions are included in a block
    created by a miner that is not controlled by the attacker, the attacker could
    create a fork and abandon that block, just like the way it does the double-spending
    attack.


    Of course, an attacker could attempt to double spend by literally creating two
    or more transactions using the same transaction input within a short period of
    time. Each cryptocurrency system has its own way of detecting such fraudulent
    behaviors. In Bitcoin, each mining node maintains a UTXO pool containing all transactions
    outputs that have not been spent yet. Once an output is spent, it is removed from
    the UTXO pool. Therefore, except the very first transaction, all later arrived
    transactions from the double-spending attack would be deemed invalid. It is possible
    that different miners would select different transactions in the new block, but
    no miner would include two or more conflicting transactions in the same block.


    Selfish mining [18] is a more subtle (and less damaging) attack. The goal of selfish
    mining is to increase an unfair share of block reward by colluding with a group
    of miners. Such miners would first mine a new block but reveal it only among themselves
    instead of publicly announcing the new block to the entire network. When they
    have successfully mined more blocks (the blocks that they have mined would form
    a chain), they could decide to reveal them all at once to the public network.
    To be more profitable than honest miners, the selfish miners must possess a significant
    fraction of the total mining power. Obviously, if they possess over half of the
    hashing power, they could effectively take all the block rewards of the system.
    The open question is whether or not if exists a threshold that is lower than 50%
    for the selfish miner to be profitable.


    In [12], the authors analyzed how the traditional eclipse attack can be used to
    attack the Bitcoin networks. In an eclipse attack, the attacker aims to control
    the connections of the victim node with the rest of the world to effectively isolate
    the node. After all, the blockchain systems run on top of the Internet. In addition
    to denying the services to the victim node, the eclipse attack could impose a'
  merge: -1
  img_proc: true
- pgno: 376
  md: number of damages to the blockchain network, including causing forks, splitting
    hashing power, facilitating selfish mining, or even helping on double-spending
    attacks.
