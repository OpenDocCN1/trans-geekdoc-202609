- pgno: 58
  md: 'be relied upon for recovery. Therefore, to ensure that the recovered state
    is consistent with the external view, sufficient recovery information must be
    logged prior to the sending of a message to the outside world. This is what so
    called the output commit problem [21].


    # 2.1.5 Stable Storage


    An essential requirement for logging and checkpointing protocols is the availability
    of stable storage. Stable storage can survive process failures in that upon recovery,
    the information stored in the stable storage is readily available to the recovering
    process. As such, all checkpoints and messages logged must be stored in stable
    storage.


    There are various forms of stable storage. To tolerate only process failures,
    it is sufficient to use local disks as stable storage. To tolerate disk failures,
    redundant disks (such as RAID-1 or RAID-5 [14]) could be used as stable storage.
    Replicated file systems, such as the Google File Systems [9], can be used as more
    robust stable storage.


    # 2.2 Checkpoint-Based Protocols


    Checkpoint-based protocols do not rely on the piecewise deterministic assumption,
    hence, they are simpler to implement and less restrictive (because the developers
    do not have to identify all forms of nondeterministic events and log them properly).
    However, a tradeoff is that the distributed systems that choose to use checkpoint-based
    protocols must be willing to tolerate loss of execution unless a checkpoint is
    taken prior to every event, which is normally not realistic.


