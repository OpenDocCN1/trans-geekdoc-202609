  md: '# Consensus Algorithms for Blockchain


    Distributed consensus is the most fundamental issue in distributed computing.
    There has been a strong interest on distributed consensus since early 1980s [31].
    Milestones in this line of research are many. We can easily name of few: the logical
    timestamp concept proposed by Lamport [18], the Byzantine generals problem and
    the earliest algorithms also proposed by Lamport [21], the impossibility result
    for asynchronous distributed systems by Fischer, Lynch, and Paterson [11], the
    group communication systems by Birman [6], Moser, and Melliari-Smith et al. [23],
    the practical Byzantine fault tolerance algorithm (PBFT) by Castro and Liskov
    [7], and the Paxos-family of algorithms by Lamport [19, 20].


    To remove trivial solutions to the distributed consensus problem, such as everyone
    always decided on a particular value, it requires that the value chosen by a member
    must have been proposed by someone in the system. If there is only a single member
    that always proposes some value, then the solution to the distributed consensus
    problem is also trivial. However, such assumption is obviously not'
  merge: -1
  img_proc: true
- pgno: 381
  md: 'fault tolerant, i.e., if that member fails, the system stops operating. Hence,
    at least a subset of the members must share the responsibility to propose values
    dynamically. Once we allow more than one member to propose, we are risking of
    different members in the system choose values proposed by different ones. Hence,
    the distributed consensus is a complex problem. In an asynchronous system where
    there is no bound on networking delay, no bound on processing time, and no restriction
    on the clocks used by different members (e.g., the clocks can be different and
    there is no bound on the clock drift rate), the famous FLP impossibility result
    stated that a distributed consensus is impossible because one cannot differentiate
    a slow member from a crashed one. To bypass this impossibility result, there are
    two approaches. One is to use an unreliable failure detector to remove a member
    from the current membership when necessary [8]. The other is to use a randomized
    algorithm that does not use time in any way in the operation of the algorithm
    [3]. The failure detector could mistakenly remove a running member that is temporarily
    slow from the system, and that member might not even know that it has been removed
    from the system, which significantly complicates the task of reaching consensus.
    The latter algorithm is probabilistic, in that it may run many rounds and there
    is no consensus reached if the system is very asynchronous, which is expected
    due to the FLP impossibility result.


    Classical solutions to the problem of distributed consensus all require a concept
    of membership where a member would know: (1) who else is in the membership; (2)
    its own role; (3) the roles of other members; and (4) how to connect to other
    members. Usually, one of the members would carry additional role, which is typically
    referred to as the primary, coordinator, or leader. As such, there must be a leader
    election algorithm defined. If a system allows dynamic membership, a membership
    protocol must also be defined. All these membership related algorithms/protocols
    are by themselves consensus problems.


    The PoW-based consensus algorithms (used in Bitcoin and Ethereum, for example),
    are completely different from the classical solution. The reason can be easily
    understood. The membership required by classical algorithms inevitably make the
    system tightly-coupled and can be easily attacked if deployed on the Internet,
    and the algorithms are not scalable due to the use of multiple-rounds of message
    exchanges. The PoW-based consensus algorithms do not use any notion of membership.
    Instead, they run on a peer-to-peer'
  merge: -1
  img_proc: true
- pgno: 382
  md: 'network where every mining node is equal in responsibility, and there is no
    additional message exchange just for the sake of reaching consensus (other than
    relaying valid transactions and blocks received, and propagating the blocks it
    has mined). This sounds rather unbelievable. How can a system magically achieve
    consensus without a membership and without making multiple rounds of message exchanges
    to ensure that all members agree on the same value?


    In blockchain, the consensus is established probabilistically by converting the
    consensus problem into a stochastic process similar to winning a lottery. Everyone
    is allowed to participate the competition by investing on hardware, installing
    the blockchain software, and running the protocol. The PoW algorithm would use
    a carefully designed hard puzzle where it is impossible to cheat other than using
    a computer that has more computing power to gain some advantage over other nodes
    (the higher hashing rate and higher memory bandwidth, the better chance of winning
    the puzzle competition). Furthermore, the puzzle is designed so that the puzzle
    solving process is a stochastic process in that no one can predict what kind of
    input would lead to an output that meets the difficulty target. The only way for
    a node to solve the puzzle is to try out different nonce (and some other parameters
    allowed). The security, fairness, and the randomness of the puzzle solving process
    are protected by the use of cryptographic hash functions such as SHA2 or SHA3.


    Of course, there is always a tradeoff. The PoW-based consensus algorithm is probabilistic
    in that it does not always produce a single winner in each round. It could happen
    that two or more blocks are mined almost at the same time. In this case, the system
    would have inconsistency in that some nodes in the system might choose one of
    the competing blocks, and other nodes would choose some other blocks at the same
    block height. This situation is actually not new to the research community on
    distributed systems. Optimistic replication has been extensively studied [26].
    The key idea is to resolve the inconsistency when it occurs, which is often called
    a fork illustrating the fact that the single chain started to have two or more
    branches, using some conflict resolution mechanisms. In Bitcoin, this is achieved
    by using a simple rule: whichever branch that has the most cumulative difficulty
    should be chosen as the main blockchain. In Ethereum, a variation of a more sophisticated'
  merge: -1
  img_proc: true
- pgno: 383
  md: 'protocol (called GHOST) [29] is used where the total computation of each subtree
    is compared to select a winning block.


    Another tradeoff is that no one would know for certain that when a consensus is
    definitively achieved in PoW-based algorithms, which is also because the consensus
    achieved is probabilistic. Theoretically, if someone has possession of an overwhelming
    computing power, the person could create a branch right after the genesis block
    and essentially render all existing transaction records obsolete. Fortunately,
    in reality, this is virtually impossible because the cost of doing so could very
    well be a lot greater than the financial gain anyone could obtain. It is also
    foreseeable that someone, some organization, or certain state would want to demolish
    a blockchain platform. In this case, there are much cheaper means to achieve the
    goal, such as shutting down the Internet connection to all mining nodes or disable
    the DNS system for these nodes.


    Yet, another tradeoff is the energy consumption. If there are 1,000 mining nodes
    competing to create the next block, then 999 of them will waste their computation
    in Bitcoin. This effectively creates 99.9% waste (or only 0.1% energy efficiency)
    for reaching consensus. To address this energy consumption issue, many alternative
    consensus algorithms have been proposed [30]. Including PoW, these algorithms
    can be divided into two approaches: one is based on proof of resources, the other
    is referred to as virtual mining [30]. There are also hybrid algorithms that span
    the two approaches. Unfortunately, many of these are not well documented, and
    some are pure theoretical work without an implementation. We are also aware of
    a lot of proposals on using traditional consensus protocol such as Paxos or PBFT.
    They might be fine working in a private blockchain that has very small number
    of nodes. However, one would question the value of using such a private blockchain.
    The well-touted benefit of the immutability of blockchain is made possible with
    a large scale public blockchain where it is virtually impossible to subvert the
    consensus established by the many mining nodes (with huge amount of energy devoted
    to computation). The small-scale private blockchain would only resemble a public
    blockchain in data structure itself, without the true benefits of the public blockchain.


    In this chapter, we first introduce a set of requirements for blockchain consensus
    algorithms. Then we comment on PoW and a few better documented alternative blockchain
    consensus algorithms. We also provide a detailed description of the PoS algorithm'
  merge: -1
  img_proc: true
- pgno: 384
  md: 'implemented in PeerCoin. The PeerCoin is in fact the very first PoS-based consensus
    algorithm proposed although it is far less well-known than the PoS algorithm proposed
    by Ethereum, which has been touted as their future consensus algorithm. Our description
    of the PeerCoin PoS algorithm is based on the latest source code of PeerCoin.
    In our opinion, the PeerCoin PoS algorithm ought to be better recognized being
    a self-contained PoS algorithm not only having been implemented, but having gone
    through revisions and the tests of being part of a practical system.


    # 9.1 Model on Blockchain Consensus


    To support a public blockchain, the consensus algorithm must work with an open
    dynamic and large system where any node could join or leave at any time. Currently,
    the Bitcoin network has over 10,000 mining nodes as reported by https://bitnodes.io/dashboard/,
    and the Ethereum network has over 5,000 mining nodes as reported by https://etherscan.io/nodetracker.
    No classical consensus algorithm can operate in a network of this scale.


    ![](img/7320b1480d74f1d65f74659cab456782_384_0.png)


    Figure 9.1 A model for public blockchain consensus.


    Figure 9.1 presents the model for public blockchain consensus. We recognize that
    there are two corner stones for the consensus algorithm: (1) a puzzle design;
    and (2) a conflict resolution mechanism. The puzzle design is what makes it possible
    to use a puzzle-solving competition to replace traditional voting-based solutions.
    Because the puzzle-solving competition is inevitably probabilistic, consensus
    is not guaranteed. When inconsistency'
  merge: -1
  img_proc: true
- pgno: 385
  md: 'occurs, an additional mechanism must exist to select only one of the proposed
    values. In PoW, the puzzle is based on computation. Bitcoin uses pure hashing,
    and Ethereum uses a combination of hashing and a memory-bandwidth-limited operation.
    As we will see later, researchers have investigated other forms of puzzles. The
    essence is the proof of possession on some valuable resources. In [30], these
    algorithms are referred to as Proof-of-Resources or Proof-of-Concepts. Regardless
    how it is designed, the puzzle must exhibit a set of characteristics, which we
    enumerate and explain below.


    # 9.1.1 Requirements on Puzzle Design


    Unpredictability. The most fundamental requirement on the puzzle design is that
    the puzzle solving process must be stochastic. More specifically, the puzzle must
    define a rule on how it is considered solved. In PoW, a difficulty target is defined
    and a miner would have to find a right nonce so that the hash of the new block
    header is smaller than the target difficulty. Unpredictability means that given
    the puzzle-solving objective, one cannot predict what input would meet the objective.
    The only way to solve the puzzle is to try out many different inputs.


    Freshness. While this requirement might have been implicitly covered by the unpredictability
    requirement, it is worthwhile to single this requirement out to emphasize that
    no one should be able to start solving a puzzle much sooner than others. If some
    miners could start working a puzzle ahead of others, then the consensus process
    is no longer fair, which eventually will lead to the destruction of the system.
    For blockchain, freshness means that the input must include information about
    the new block. After all, the consensus is about which block should be the next
    block. In essence, the freshness requirement means that one cannot reuse any resource
    that it has already used to mine a previous block.


    Noninvertibility. This refers to the requirement that the puzzle must be very
    difficult to solve while very easy to verify. On the one hand, the difficulty
    level should be so difficult that statistically it takes a block-interval amount
    of time to solve among the miners (thousands or more of them). Otherwise, the
    network would fork easily and as a result, many stale blocks would be produced
    [1]. Ultimately, this is detrimental to the security of the network [12]. On the
    other hand, a new block would be verified'
  merge: -1
  img_proc: true
- pgno: 386
  md: 'by thousands of nodes. It is important that the verification must be efficient.
    Otherwise, the miners would be disincentivized to verify new blocks.


    Noninteractive verification. Considering the scale of the network, and the nature
    of the problem where there is one puzzle solver and thousands of verifiers for
    each new block, the verification of the solution presented by the solver must
    be noninteractive. Otherwise, the solver would be bombarded with messages, essentially
    killing the scalability of the system.


    Soundness. This requires that if a mining node claimed falsely that it has solved
    the puzzle with a wrong solution, the proposed solution can be detected as wrong
    and therefore will be rejected during the verification process.


    Completeness. This requires that if a node has presented a valid solution to the
    puzzle, then the solution will be accepted by all verifying nodes.


    Resistant to outsourcing. This is a rather subtle one. Unlike previous requirements,
    the violation of any of which would immediately render the puzzle design unacceptable
    for practical use, the violation of this requirement will not. This requirement
    should be considered desirable and but not absolutely a must. In fact, the PoW
    algorithm used by Bitcoin does violate this requirement. By outsourcing, we mean
    that to solve the puzzle, one can divide the solution space into multiple partitions,
    and assign the tasks on checking for solution in each partition to other nodes.
    This is the basis for forming mining pools in Bitcoin. This is indeed a concern
    because pooling of resources could lead to centralization, which is exactly what
    Bitcoin and the like wanted to avoid.


    # 9.1.2 Zero-Knowledge Proof


    The puzzle design in blockchain can be regarded as a form of non-interactive Zero-Knowledge
    Proof (ZKP) [25]. ZKP was originally designed as an interactive system that consists
    of a prover and a verifier [13]. The prover would somehow present some evidence
    for the possession of certain secrete without revealing it, and the verifier can
    be certain based on the presented evidence whether or not the prover indeed has
    possession of the secrete. Note that the prover must not simply reveal the secrete
    (i.e., the knowledge of the secrete), which is why this scheme is called zero-knowledge
    proof. According to the original scheme, ZKP would inevitably require an'
  merge: -1
  img_proc: true
- pgno: 387
  md: 'interactive session, where the verifier would provide a challenge to the prover
    so that the prover could respond accordingly.


    In context of blockchain, the prover in ZKP must prove the possession or consumption
    of some minimum amount of digital resources. If it is to prove possession, there
    must exist a mechanism such that the resources used to prove for possession cannot
    be reused. Classical ZKP systems typically require the existence of a trusted
    third party to generate random seeds or keys that will then used to derive a common
    reference string at both the prover and the verifier. In blockchain, the need
    for a trusted third party is replaced by a random oracle model where the random
    oracle would respond to a unique query with a random response uniformly selected
    from the output space. An ideal cryptographic hash function would serve as the
    purpose of the random oracle. Strong cryptographic hash functions such as SHA2
    and SHA3 (including Keccak) would be used to approximate the ideal hash function.


    # 9.2 Proof of Work


    The puzzle design for PoW in Bitcoin is entirely based on the cryptographic hash
    function. The theoretical foundation is that for an ideal cryptographic hash function
    that produces an L-bit string, the search for a preimage of a given hash value
    cannot be more efficient than exhaustively trying out all combinations of the
    bit patterns in the L-bit space [30]. In contrast, the verification of a solution
    to a puzzle takes only a single hash operation. The Ethereum PoW added an additional
    step in random memory access, but the puzzle design still follows the same principle
