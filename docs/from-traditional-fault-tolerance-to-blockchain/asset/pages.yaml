    # 10.3.2 Off-Chain Approach


    The essence of all off-chain approaches is to use a small set of transactions
    recorded on the main blockchain to ensure the security of transactions stored
    off-chain. The most well-known and mature approach is state channel [49]. It is
    also referred to as payment channel because the channel''s primary functionality
    is to facilitate payment between two-parties. The state of the channel is the
    balance of the cryptocurrency specific to the blockchain and it changes during
    the operation of the channel. The security of the state channel is protected by
    two transactions recorded on the main blockchain. One transaction is used to create
    the channel, which is referred to as the anchor or funding transaction. The other
    is a transaction created at the termination of the channel to settle the payments
    between the two parties involved in the channel, which is referred to as the settlement
    transaction.


    Figure 10.8 shows the steps and usage of the state (payment) channel. The state
    channel is actually a one-way channel in that one party (with symbol A) would
    pay the other party (with symbol B) for certain service provided by B with the
    cryptocurrency. For trustless operation, A and B would have to agree on a special'
