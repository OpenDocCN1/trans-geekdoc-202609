- pgno: 238
  md: 'To ensure consensus, the most simple and intuitive approach is to designate
    a single acceptor as the decision maker. If a proposer proposes a value, it has
    to send its proposal containing the value to that acceptor for approval. A consensus
    can be ensured if we mandate that the acceptor must choose the value contained
    in the *first* proposal it receives. Apparently, this solution is not fault tolerant
    - the system would cease operating when the acceptor fails.


    Therefore, we should use a group of acceptors instead of a single one. To tolerate
    up to *f* number of faulty acceptors, we need to use a set of at least 2*f* +
    1 acceptors. Now with a group of acceptors, an acceptor is not allowed to *choose*
    the value for the system (*i.e.*, decides on the value for consensus) unilaterally
    anymore because different acceptors may choose different values. Hence, an acceptor
    may only *accept* a value initially. Then an additional mechanism is needed for
    the system to find out if a value can be chosen. It is easy to see that as long
    as an acceptor can accept at most one value, all we need is a simple majority
    of the acceptors to accept the same value for the system to reach a consensus
    on that value. Therefore, it is intuitive to enact the following requirement:


    +   **P1** An acceptor accepts and only accepts the first proposal that it receives.


    Unfortunately the requirement P1 is too restrictive. It is safe to ensure that
    at most one value is chosen by the group of acceptors (*i.e.*, when the majority
    of them have accepted the same value). Unfortunately, in the presence of multiple
    proposals, different subsets of the acceptors may accept different proposals and
    none of the subsets forms the majority of the acceptors, which would prevent a
    value from being chosen.


    Therefore, P1 must be modified such that an acceptor should be allowed to accept
    another proposal if it is newer than the one it has accepted. For an acceptor
    to tell if a proposal is newer, each proposal must be assigned a monotonically
    increasing proposal number. The acceptor may accept a proposal if its proposal
    number is greater than the one that the acceptor has accepted. Obviously, for
    the scheme to work, different proposers should try to find out the highest proposal
    number that has been used and use a larger one for its next proposal. Using an
    obsolete proposal number would lead to the rejection of the proposal by the acceptors.


    Once we open the door for an acceptor to accept multiple proposals, we cannot
    avoid the possibility for multiple proposals to be'
  merge: -1
  img_proc: true
- pgno: 239
  md: 'chosen by the system because as long as the majority of acceptors accept a
    proposal (and its value), that proposal is chosen. This is not necessarily a problem
    if we ensure that the proposals that are chosen contain the same value. Therefore,
    we need to add the following requirement:


    +   P2 After the first proposal (with value _v_) is chosen, then all newer proposals
    (with higher proposal numbers) that are chosen must have the same value _v_.


    To satisfy requirement P2, it is sufficient to ensure that all higher-numbered
    proposals contain the same value that has been chosen earlier:


    +   P2a After the first proposal (with value _v_) is chosen, then all higher numbered
    proposals must contain the same value _v_.


    Our next task is to reason about how to satisfy requirement P2a. It is apparent
    that allowing an arbitrary value to be included in a proposal each time a proposer
    disseminates a new proposal would endanger the requirement P2a. Hence, we must
