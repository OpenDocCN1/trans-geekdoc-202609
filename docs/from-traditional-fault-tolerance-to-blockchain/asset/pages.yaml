    says it is virtually impossible to find a preimage of a hash. It is easy to understand
    that if P is much longer than Hash(P) in size, this requirement can be easily
    satisfied because information must have been lost during the hash processing.
    However, even if P is shorter than Hash(P), the requirement must still hold.

