    internal construction of a system. In the context of blockchain, we prefer the
    latter. From the algorithm perspective, blockchain offers unprecedented level
    of security and dependability transparently. Furthermore, considering that the
    purpose of public blockchains is to enable cryptocurrency, the implementation
    must be nearly impeccable. Indeed, in over ten year''s operation, the Bitcoin
    network experienced no major incidents thanks to its ultra-conservative design.
    Ethereum had to do a major hard fork to overcome a significant issue due to a
    vulnerability in its early smart contract design [10], it has been getting much
    more reliable since. Hence, a blockchain-enabled application that relies on an
    established public blockchain would have a great foundation to offer good trust
