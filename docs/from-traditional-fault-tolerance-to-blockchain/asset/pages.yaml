    incentivized to maintain the ledger correctly to ensure future profit. Unfortunately,
    a centralized solution would limit competition because it essentially has monopoly
    power over the records it is keeping (e.g., by using proprietary format) and the
    barrier to create a similar system is high, which is not in the best interest
    of users of the system.


    While using a decentralized public ledger would significantly lower the barrier
    to entry, the solution requires a sound and robust consensus algorithm so that
    all copies of the ledger are the same. The dominating way of achieving the consensus
    is via proof of work, which inevitably wastes on energy. From the economic point
    of view, A decentralized ledger replaces the risk of having users to pay rents
    disproportionally with wasteful cost on energy.


    However, as we have shown in Chapter 9, there are two promising works that address
    the cost efficiency issue, one is to make'
  merge: -1
  img_proc: true
- pgno: 447
  md: 'the proof of work to actually do useful work, and the other is to do virtual
    mining, especially PoS based consensus algorithm. Although it takes more work
    to analyze the cost efficiency of PoS-based blockchains (such as PeerCoin and
    perhaps a future version of Ethereum), we believe that PoS-based blockchain could
    become a ledger that satisfy all three properties, thereby, solving the impossibility
    trinity problem.


    ![](img/7320b1480d74f1d65f74659cab456782_447_0.png)


    Because PoW-based consensus is virtually the de-facto standard in blockchain systems,
    its impacts have been well studied, including on the energy cost (the energy cost
    is proportional to the number of miners instead of the PoW difficulty) and on
    the transaction fees (the larger the blockchain network becomes, the higher the
    average transaction fees). The low throughput is necessary for Bitcoin (and similar
    PoW-based blockchains) to guarantee operational sustainability.


    # 10.4.3 Blockchain as a Financial Infrastructure


    For blockchain to be used as a financial infrastructure, tokens are representing
    off-chain assets such as fiat money and financial securities. This way, the tokens
    will have intrinsic values because the value would be derived from off-chain assets
    they are linked to. This linkage must be protected legally and economically. Hence,
    a centralized trusted institution (such as a central bank) is essential for this
    type of blockchains. The blockchain as a financial infrastructure (BaaFI) has
    the following features:'
  merge: -1
  img_proc: true
- pgno: 448
  md: '+   - Account-based balance tracking (on the number of tokens owned) is used,
    similar to that in Ethereum (and different from the UTXO model used in Bitcoin).

    +   - Tokens can be transferred between different accounts.

    +   - Unlike fiat money, tokens can be used across the borders of different sovereign
    countries.

    +   - The security of the blockchain is ensured by consensus algorithms like PoW.


    The most well-known example for BaaFI perhaps is Libra proposed by Facebook. Libra
    is managed by Libra Association, and will consists of 100 verification nodes (one
    node from each member of the Libra Association) and aims to support 1,000 transactions
    per second. Hence, Libra is intended to run as a consortium blockchain and adopts
    some PoS consensus algorithm. As such, we are concerned on the immutability of
    the blockchain used in Libra. It certainly will not be the same as that for Bitcoin.'
  merge: -1
  img_proc: true
