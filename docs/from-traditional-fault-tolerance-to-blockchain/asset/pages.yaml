    c, and each replica takes a checkpoint whenever it has executed a request with
    a sequence number that is multiple of c. A replica i multicasts a checkpoint message
    once it has taken a checkpoint. The checkpoint message has the form <checkpoint,
    s, d, i>σ, where s must be multiple of c, and d is the digest of the checkpoint.
