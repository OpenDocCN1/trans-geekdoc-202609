    # 3.1 System Model


    An important step in failure recovery is to reconstruct the state of the recovering
    component or process so that it is consistent with other parts of the system and
    ready to provide services to its clients. For faster recovery, the best practice
    is to separate data management from application logic. The three-tier architecture
    [30], which is pervasively used in Internet-based applications, is a good example
    of this strategy.


    ![](img/7320b1480d74f1d65f74659cab456782_96_0.png)


    Figure 3.1 The three-tier architecture.


