  md: '# 9.3 Proof of Resources


    There has been many attempts of using other means of digital resources to replace
    the computing resource used in the PoW algorithm. The general objectives are not
    just make the puzzle consumes less energy, but also to make the puzzle-solving
    competition to do useful work such as for distributed file storage or computing
    some hard problems which can be useful for research. We categorize the approaches
    on proof of resources into two camps, one relying on data storage, and the other
    relying on computing. As we will see in this section, the proposed algorithms
    relying on data storage consist of various deficiencies. The other direction is
    to still rely on the computing resource, but computing something useful in some
    ways instead of using hashing, which would waste the computing resource. The latter
    is actually quite promising and deserves a lot more further research.


    # 9.3.1 Using Storage as Resource


    The proof of space [10] asks the prover (i.e., the miner) to present evidence
    that it has indeed dedicated the required amount of disk space to store the information
    as requested by the verifier. Unfortunately, this uses an interactive ZKP design
    involving an initialization phase to ensure that both the prover and the verifier
    could deploy the data structure (typically a hard-to-pebble graph), and a challenge-response
    phase where the verifier would challenge the prover on the accessibility of certain
    information in the graph. Hence, this scheme is simply impractical for use in
    the public blockchain, where noninteractive verification is a prerequisite. It
    is also unclear how easy it is to ensure the freshness needed to mine each new
    block.


    Miller et al. proposed a scheme called Permacoin, based on the proof-of-retrievability
    (PoR) concept that involves distributed storage [22]. PoR grew out of the idea
    of proof of storage designed for secure file systems where a client could verify
    indeed its files are reliably stored remotely at the server prior to the creation
    of Bitcoin [9, 27]. In [22], the authors attempted to adapt the PoR concept for
    consensus in blockchain in the form of a noninteractive ZKP scheme. In this scheme,
    there exists a trusted file dealer that would divide the files into a sequence
    of segments and somehow publishes these segments for provers to store at their
    sites. For'
  merge: -1
  img_proc: true
- pgno: 389
  md: 'easy retrieval and verification, the segments would be constructed into a Merkle
    tree and the root hash would also be made public and immutable. A verifier could
    then verify whether or not the prover has stored the required segments by checking
    the Merkle proof presented by the prover. The scheme also assumes the existence
    of a publicly known, non-precomputable puzzle ID that is somehow a function of
    the block height. Furthermore, a client would have a fixed number of random challenges
    for the oracle.


    It is apparent that Permacoin is incompatible to the requirements for public blockchain
    consensus. Even though the design is a noninteractive ZKP, it is not a full stochastic
    process [30]. Besides the intrinsic limitation on the puzzle design, the assumptions
    made in the scheme is not practical for a system that aims to achieve decentralization.
    The assumption of a trusted file dealer for file distribution is a contraction
    to the design principle of public blockchains. Furthermore, how to produce a non-precomputable
    puzzle ID is by itself a problem on par with the consensus problem. We should
    note that there is no publicly-known implementation of Permacoin for blockchain.


    KopperCoin [17] is a follow-up work by addressing several deficiencies of Permacoin.
    The main extension in KopperCoin is to make the ZKP scheme a full stochastic process.
    First, it introduced a distance metric between the index of a locally stored segment
    and a publicly-known random challenge. Second, it introduced a mechanism to generate
    public and unpredictable random challenge by hashing the header of the most recent
    block.


    FileCoin [4] is a practically deployed system designed for secure storage of files.
    It has built-in mechanisms for a client to challenge a storage server to make
    sure that the client''s files are indeed stored at the site and the files are
    indeed replicated for fault tolerance and reliability. It introduced the concepts
    of proof of replication and proof of space time. However, we note that these concepts
    are designed for a client to challenge the storage server. They are not used to
    achieve consensus, which is a sharp contract to Permacoin and KopperCoin. Instead,
    what the FileCoin white paper [4] is advocating is a consensus scheme rather similar
    to the proof-of-stake. Different from PoS, which uses the amount of coin as the
    stake for a cryptocurrency system, FileCoin uses the file storage power as the
    stake.


    In FileCoin, the power of a mining node is defined as the sum of the miner''s
    storage assignments. The election for the miner that is'
