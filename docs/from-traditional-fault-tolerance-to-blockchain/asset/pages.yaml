  img_proc: true
- pgno: 168
  md: 'The proof of the CAP theorem is straightforward [11] because in the presence
    of network partitions, replicas in different partitions could not communicate
    with each other. If the designer of a system favors replica consistency, then
    the availability may have to be sacrificed. Similarly, if the designer chooses
    to ensure high availability, there is no way strong consistency among the replicas
    in different partitions can be achieved - the replicas cannot communicate!


    # EXAMPLE 4.8


    Similar to [11], we consider a network with only two nodes N1, N2. Assume that
    a network partitioning fault occurs and it isolates node N1 from node N2. We further
    assume that we are going to ensure P and A, which means the following could happen:


    +   - A client that could reach N1 issues an update W1. The update is immediately
    applied at N1. Due to the network partitioning fault, N2 is not aware of the update
    W1 at N1.


    +   - Another client that could reach N2 also issues an update W2. The update
    is immediately applied at N2. Due to the network partitioning fault, N1 is not
    aware of the update W2 at N2.


    +   - It is apparent that the states of N1 and N2 have become inconsistent from
    now on.


    Note that the states of the two nodes would become inconsistent only after different
    updates have applied at them. If one is an update operation W and the other is
    a read-only operation R, we cannot conclude that the states have become inconsistent.
    Indeed, even if the operation R on N2 is issued significantly after the operation
    W on N1 in real time, it does not necessarily mean that R is causally related
    to W and we should expect R to read the value written by W. Without some out-of-band
    channel that links the two operations, it is perfectly legal for R to read a value
    prior to the update operation W. If the system is repaired from the network partitioning
    fault, N1 and N2 could easily merge their history so that all operations are serializable
    (e.g., R would be ordered prior to W after N1 transfers its state or operations
    to N2).'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'Since its inception, the CAP theorem has attracted extensive attentions and
    debates [1, 4, 7, 12, 23]. The CAP theorem highlighted the need to strike a good
    balance between consistency and availability in the presence of network partitioning
    faults when designing practical systems because many systems might face network
    partitioning faults [7]. Much debates lie on the reason for the use of reduced
    consistency models in favor of highly availability. As we have seen in the previous
    section on optimistic replication and rightly pointed out by a number of researchers
    [1], the adoption of reduced consistency models is often not due to concerns of
    network partitioning faults, but for better performance for applications running
    over wide-area networks.


    Furthermore, the definitions of C, A, and P are quite unclear. For example, does
    requiring C means that all non-faulty replicas must be in sync all the time? On
    the other hand, if a quorum-based consensus algorithm (such as Paxos [18]) is
    used to coordinate the replicas, the system would make progress as long as the
    majority of the replicas agree with each and it is possible that the minority
    of replicas lag significantly behind or are in a confused state depending on the
    fault model used in the system. Can we call such a system as guaranteeing C? We
    probably should say that it does guarantee C based on common sense.


    Whether or not a system guaranteeing A depends on the fault model used. For example,
    a system that provides high availability with a crash-fault-only model might not
    be able to ensure high availability in the presence of network partitioning faults
    or malicious faults. Without clarifying the fault model used, the scopes of availability
    and partition-tolerance would appear to overlap with each other:


    +   Partition tolerance implies that the system could ensure liveness in the presence
    of network partition faults.


    +   High availability, on the other hand, would require the tolerance of all types
    of faults, including network partition faults, *without specific qualification
    on the fault model used*.


    In addition, the definition of A is vague. If the data is said to be available
    for a user, how long does the user has to wait for its request to be serviced?
    What is the relationship between A and the end-to-end latency (L) as experienced
    by a user? A is not absolute and neither is L. In [1], A and L are treated as
    different properties of a system, and thus, a PACELC model is proposed to replace
    CAP in system design:'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'If there is a network partition fault, how to balance the availability and
    consistency (A and C); else (E), during normal operation with a fully-connected
    network, how to balance the requirements on latency (L) and consistency (C)?


    The meaning of partition tolerance is also unclear. First, what is considered
    as a network partitioning fault can be confusing. A straightforward interpretation
    of a network partitioning fault is that the network is partitioned into several
    disjoint partitions due to a fault at a router/switch or a communication link.
    However, normally there is no way for a replica to have such global knowledge
    and different replicas may have completely different views regarding whether or
    not the network has partitioned. If a replica could reach every node that it needs
    to communicate, then to its view, there is no network partitioning fault, even
    though the network has already been partitioned and that replica together with
    all other nodes it communicates with reside in one of the partitions. Further,
    a replica could only detect a network partitioning fault by using a timeout when
    communicating with other nodes. To a replica, a network partitioning fault has
    happened if it has timed out a request issued on another node. That is why a network
    partitioning fault is often modeled as a message loss [11]. Obviously, if a network
    partitions and quickly recovers before the timeout, the partitioning fault might
    have no impact on the system.


    # 4.4.1 2 out 3


    The CAP theorem dictates that at the best, we could design a system that achieve
    2 out of 3 properties, that is, a system that either ensures CA, CP, or PA, but
    not all three CAP, as shown in Figure 4.17.


    ![](img/7320b1480d74f1d65f74659cab456782_170_0.png)


    Figure 4.17 An illustration of the CAP theorem.'
  merge: -1
  img_proc: true
- pgno: 171
  md: '# 4.4.1.1 CA System


    A CA system sacrifices partition tolerance for consistency and availability. This
    implies that the network partitioning fault is excluded from the fault model used
    in the system design. This type of systems can only be used in an environment
    that the network partitioning fault rarely happens, for example, a local area
    network or as big as a data center. Systems designed to achieve pessimistic replication
    are often CA systems.


    # 4.4.1.2 CP System


    Based on our previous argument, we cannot build a system that ensures strong consistency
    while tolerating all forms of network partitioning faults because it is bound
    that some replicas would not be able to reach other replicas by the definition
    of network partitioning. However, a CP system is possible under the following
    conditions:


    +   - Consistency is achieved by a quorum-based algorithm. That is, as long as
    the majority of the replicas agree with each other, the system is considered consistent.

    +   - The network partitioning fault results in a partition that consists of the
    majority of the replicas in the system.


    In such a CP system, the replicas residing in the majority partition would proceed
    as usual (i.e., as if there is no network partitioning fault), while the replicas
    in the minor partition (or partitions) would stop operating, hence losing the
    availability property. A number of partition-tolerant group communication systems
    [3, 20] are CP systems.


    # 4.4.1.3 PA System


    Many new cloud computing systems [1, 23], as well as systems that employ optimistic
    replication [25], are designed to ensure PA. As we discussed in section 4.3, the
    loss of consistency is only temporary - the replica states will eventually converge
    when the network partitions merge and when the system is quiescent.


    # 4.4.2 Implications of Enabling Partition Tolerance


    For a PA system, it should strive to detect and reconcile any consistency because
    users do expect eventual consistency even if'
  merge: -1
  img_proc: true
- pgno: 172
  md: 'they could tolerate temporary inconsistent states during period of network
    partitioning. In the absence of network partitioning, the system would behave
    as a CA system. When a replica realizes that it has difficulty in communicating
    with another node, it enters the partition mode, as shown in Figure 4.18. During
    the partition mode, a replica would trade consistency for better availability.
    However, when the partitions are merged, the replicas would reconcile their inconsistencies,
    similar to conflict reconciliation we have described in section 4.3 in the context
    of optimistic replication. Well-known methods for conflict reconciliation include:


    ![](img/7320b1480d74f1d65f74659cab456782_172_0.png)


    Figure 4.18 Partition mode and partition recovery.


    +   - Compensation transactions/operations. In some systems, such as transaction
    processing systems, the effect of an operation can be reversed by applying a user-defined
    compensation operation [10]. Thus, the operations can be reordered as desired
    during the partition recovery.


    +   - Operational transformation. For collaborative editing systems, operational
    transformation is often used to reconcile conflicting edits to a shared document
    [28]. Given two conflicting operations Oi applied at site i, and Oj applied at
    site j. Oi is transformed to O''i, and Oj is transformed to O''j such that given
    the same state at the beginning, the final state by applying Oi followed by O''j
    at site i would be the same state by applying Oj followed by O''i at site j.'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'Commutative replicated data types (CRDTs). This approach was initially developed
    as an alternative solution to collaborative editing [22] and was recently expanded
    for use by potentially many other applications [27]. By using CRDTs to represent
    the state, all operations on the state are now commutative. Hence, concurrent
    operations are no longer in conflict with each other. A replica could apply an
    operation submitted locally immediately and propagates the update to other replicas
    asynchronously. A replica also orders deterministically a remote update sent by
    another replica as it is received *without* any inter-replica communication.


    Detailed discussion on these methods are beyond the scope of this book.


    To summarize this section, considering that the only way for a replica to detect
    that a network partitioning fault has happened is through a timeout and a user
    will have to wait a finite amount of time to see its request being serviced, what
    really matters are the following two parameters in system design:


    +   End-to-end latency. This parameter defines the end-to-end latency that a system
    can tolerate according to business requirement.


    +   Partition timeout value. This parameter defines the timeout value chosen by
    the system designer that a replica could use to enter the partition mode. Normally,
    the partition timeout value is significantly higher than the end-to-end latency.


    For a system to be deployed over a wide area network, if the round trip latency
    between two remote replicas comes close to the partition timeout value, then the
    system would be operating in the partition mode most of time and hence, the system
    will basically operate as a PA system. Otherwise, the system would operate as
    a CA system until a network partitioning fault has happened. According to this
    interpretation, the PACELC model does not appear to be necessary (because the
    difference between A and C is undefined in the model).'
  merge: -1
  img_proc: true
