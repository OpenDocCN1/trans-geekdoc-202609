    # 7.4.3 The Checkpointing Protocol


    The checkpointing protocol in Zyzzyva in virtually identical to that in PBFT,
    except the BFT infrastructure state is slightly different. A core piece of state
    maintained by each replica is the ordered history of requests that it has executed.
    The replica also keeps track of the maximum commit certificate, which is the commit
    certificate with the largest sequence number (maxCC) that it has received (if
    any). In the history of the requests, those that carry a sequence number smaller
    or equal to maxCC are part of the committed history, and those with a sequence
    number larger than maxCC are part of the speculative history. The history is truncated
