    log would grow indefinitely. This obviously is not practical. To limit the size
    of the message log, each replica periodically takes a checkpoint of its state
    (the application state as well as the fault tolerance infrastructure state) and
    informs other replicas about the checkpoint. If a replica learns that 2f + 1 replicas
    (including itself) have taken a checkpoint and the checkpoints are consistent,
    the checkpoint becomes stable and all previously'
