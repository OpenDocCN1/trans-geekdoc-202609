  md: '# ## 3.2.3 Inference-Based Fault Diagnosis


    In this method, a richer set of information, such as CPU utilization, memory usage,
    in addition to the messages exchanged, regarding the operation of each component
    in the system is captured. Each type of information is captured as a state variable
    for the component. The number of state variables varies for each component and
    it depends on the instrumentation framework used. For the Windows Performance
    Counter framework (http://msdn.microsoft.com/en-us/library/ms254503.aspx), it
    traces on average 35 variables for each component and the number of variables
    can go beyond 100 for components [20]. What is interesting is that the instrumentation
    framework can trace both generic state variables and application-specific variables
    (as long as the application exports them), and the fault diagnosis method would
    treat them equally without the need for their semantics.


    The inference-based fault diagnosis method consists of three steps: (1) log component
    states, (2) construct the dependency graph, and (3) rank likely root causes for
    the abnormality observed. The details of each step is provided below.


    # ### 3.2.3.1 Component States Logging.


    The state variables are exported by the operating systems and the applications,
    and they are logged via an instrumentation framework. The states of the following
    types of components are logged:


    +   - Node. For this type of components, the state variables consist of CPU utilization,
    memory usage, disk I/O, and network I/O.

    +   - Process. For this type of components, both generic states such as CPU utilization,
    memory usage, the amount of messages exchanged, and application-specific states,
    such as the number of requests handled for each type are logged.

    +   - Network path. For this type of components, the states are defined by the
    characteristics of the network path, such as loss rate and latency.

    +   - Configuration. This refers to the configuration of the node or the process,
    and it is represented by a single state variable.

    +   - Neighbor set. This is a virtual component that highlights the collective
    behavior of the communication peers of a'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'process, such as the total number of messages exchanged and the performance
    characteristics.


    The states for each component are logged periodically into a multivariable vector
    data structure. In [20], the logging frequency is set to be once per minute. To
    monitor short-lived faults, a higher frequency may have to be used.


    # 3.2.3.2 Dependency Graph Construction.


    Once sufficient history data is logged, a dependency graph is constructed based
    on a set of pre-defined templates with one template for each component type. The
    templates used in [20] are shown in Figure 3.8 with the firewall components for
    the network path component in [20] omitted.


    ![](img/7320b1480d74f1d65f74659cab456782_112_0.png)


    Figure 3.8 Dependency templates for nodes, processes, network paths, and the neighbor
    sets.


    As defined in the template for the node component, the state of the node depends
    on the node configuration (such as the Windows registry if the node runs the Windows
    operating system), and the set of application processes (P1 through Pn). Hence,
    the edges from the configuration and the processes point to the node.


    For the process component, its state depends on both the node configuration and
    the application configuration, the node at which it runs, and its neighbor set.


    For the network path component, its state depends on the messages sent to the
    path by the nodes (Node 1 through Node n)'
