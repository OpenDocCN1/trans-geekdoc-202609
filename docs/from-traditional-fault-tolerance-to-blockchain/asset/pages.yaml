    been a challenge due to the concern on trust. The blockchain technology could
    potentially alleviate the trust concern because it is designed to bring trust
    to computing and data. The closed-loop operations in a CPS, and interactions between
    two CPS must be made fault tolerant and secure while requiring timely delivery
