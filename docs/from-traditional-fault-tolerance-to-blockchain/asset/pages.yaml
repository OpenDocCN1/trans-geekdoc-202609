  md: 'As we can see from the above example, the problem is caused by the fact that
    conflicting operations are performed at difference replicas. A sound replication
    algorithm, therefore, must prevent this from happening. The quorum consensus replication
    algorithm [2] is one of such algorithms.


    The quorum consensus replication algorithm achieves robustness against replica
    faults by write to a write quorum of replicas for each data item. As long as non-faulty
    replicas can form a write quorum, the write operation will succeed without blocking.
    The quorum consensus algorithm ensures one-copy serializable execution by read
    from a read quorum of replicas for each item. The read and write quorums are defined
    such as that a given read quorum must intersect any write quorum in at least one
    replica, and similarly any two write quorums must intersect in at least one replica.


    Each replica is assigned a positive weight. A read quorum should have a minimum
    total weight of RT and a write quorum should have a minimum total weight of WT.
    Furthermore, RT + WT and 2WT must be greater than the total weight of all replicas
    for each data item. This ensures the intersection requirement outline above. It
    is important to define RT to be the sum of weight of at least two replicas. For
    example, if each replica is assigned a weight of 1, then RT = 2. This is to ensure
    that the write quorum does not have to include all replicas (otherwise, the quorum
    consensus algorithm would reduce to the write-all algorithm, which is not fault
    tolerant).


