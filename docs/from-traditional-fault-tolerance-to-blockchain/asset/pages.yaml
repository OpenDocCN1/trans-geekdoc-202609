- pgno: 121
  md: '# 3.3.1 Microrebootable System Design Guideline


    The main requirement for a microrebootable system include:


    +   - Component based. The system should be constructed using a set of well-defined
    components instead of using a monolithic structure. Each component should be designed
    to accomplish a specific task. The Java EE is a well-known platform supporting
    this design guideline and it is used in [11] as the platform of choice. In Java
    EE, the EJB is used to encapsulate application logic and a Web component is used
    to take care of the presentation task to the clients.

    +   - Separating of application logic execution and state management. Any important
    state that might be accessed by a component must be stored externally to the component
    in a database system or a dedicated state store [23]. This is necessary because
    otherwise the state kept in the component would be lost after a reboot.

    +   - Loose coupling. The components in the system must be loosely coupled to
    enable localized microreboot of some components. The goal of loose coupling is
    to reduce the dependency among the components. Ideally, a component should be
    self-contained and be able to complete its designated task without referencing
    any other components. When this is not possible, the referencing to another component
    should be mediated, for example, via a Java EE container or a directory service,
    instead of direct invocation on a particular instance of another component. The
    key is that any instance of the referenced component (class) should be able to
    get the job done so that when one instance of a component undergoes a microreboot,
    another instance of the same component class can provide the necessary service
    potentially needed by other components. The Java EE platform allows such mediation.


    The middleware platform that provides even greater degree of loose coupling is
    Web services [21]. In Web services, a document-style messaging is used as the
    basic means of interaction between different components. As such, a component
    simply sends the document to a particular endpoint for processing, without the
    need to know which component instance would handle the request (i.e., the document),
    and wait asynchronously for a response. Of'
  merge: -1
  img_proc: true
- pgno: 122
  md: 'course, the interface for the services provided by each component must be defined,
    and the request/response messages have to follow certain well-defined structure.


    +   - Resilient inter-component interactions. Strictly speaking, this should be
    part of the loose coupling requirement. When a component (instance) undergoes
    a microreboot, all ongoing invocations on this component would be interrupted
    as a result. The invoking components must be prepared to retry the same invocation
    again (possibly on a different component instance via a mediator service) before
    declaring a failure. This is crucial to localize the impact of microrebooting.


    On the other hand, some of the invocations issued by the rebooting component (on
    other components) might be reissued again after rebooting. Unless such invocations
    are idempotent, the invocations must carry sufficient information for the invokees
    to perform duplicate detection. Otherwise, rebooting a component might lead to
    the roll-back of all ongoing transactions in which the rebooting component is
    involved. In the worse case, compensating operations may have to be applied for
    transactions that have been committed before the rebooting. Obviously, this scenario
    should be avoided because it would significantly increase the cost of doing microrebooting.


    +   - Lease-based resource management. Resources should be leased to a component
    instance so that if the component hangs, the resources can be released for other
    components and the component is rebooted. Such resources include file descriptors,
    memory, or even CPU.


    # 3.3.2 Automatic Recovery with Microreboot


    Automatic recovery can be made possible for a distributed system by equipping
    it with a fault monitor and a recovery manager [8]. The fault monitor implements
    some of the fault detection and localization algorithms described in the previous
    section. The recovery manager is responsible to recover the system from the fault
    recursively by microrebooting first the identified faulty component, if the symptom
    does not disappear, a group of components according to a fault-dependency graph.
    If microrebooting does not work,'
  merge: -1
  img_proc: true
- pgno: 123
  md: 'the entire system is rebooted. The final resort is to notify a human operator.


    The fault-dependency graph (referred to as f-map in [10]) consists of components
    as nodes and the fault-propagation paths as edges. The f-map can be obtained by
    a technique called automatic failure-path inference (AFPI) [10]. In AFPI, an initial
    f-map of the system is constructed by observing the system’s behaviors when faults
    are injected into the system. The f-map is then refined during normal operation.
    Because it is possible for multiple components to have mutual dependencies, there
    may be cycles in the f-map, in which case, the f-map is reduced to an r-map by
    grouping the components forming a cycle as a single node, as shown in Figure 3.12.
    During the recovery, the entire group of components will be micrerebooted as a
    single unit.


    ![](img/7320b1480d74f1d65f74659cab456782_123_0.png)


    Figure 3.12 The components that form a cycle in the f-map are reduced to a single
    unit in the r-map for recursive recovery.


    Upon detecting a faulty component, it is micrerebooted by the recovery manager.
    A conservative approach is to micrereboot both the reported faulty component and
    all the components that are immediately downstream from the component, as done
    in [9]. If the faulty symptom persists, it is reasonable to assume that the root
    cause of the fault observed must have come from the upstream component. Therefore,
    the upstream component in the r-map is also micrerebooted. The recovery is carried
    out recursively in this fashion until the entire system is rebooted.


    # 3.3.3 Implications of the Micrerebooting Technique


    Micrerebooting has the following positive implications to dependable system design
    and fault management.'
  merge: -1
  img_proc: true
- pgno: 124
  md: '+   - Microboot faulty components before node-level failover. Suspected faulty
    components should be rebooted first because it is a much faster way of repairing
    the system, as shown in [11]. Node-level failover should be attempted only if
    microbooting suspected faulty components does not fix the problem.


    +   - Tolerating more false positives. Because the cost of rebooting a suspected
    faulty component is so insignificant, the impact of false positives (_i.e._, a
    normal component is labeled as faulty) in fault detection is minimized. Hence,
    the fault detection algorithm can be tuned to be more aggressive in suspecting
    faulty components. As a result, the false negative (_i.e._, a faulty component
    is not detected) rate can be reduced and the overall dependability of the system
    is improved.


    +   - Proactive microboot for software rejuvenation. Proactive application-level
    reboot has been used as a way to reclaim leaked resources and to eliminate undetected
    transient errors in the system. This process is referred to as software rejuvenation.
    For microboot-friendly applications, individual components can be periodically
    rebooted to achieve similar effect while causing minimum disruptions to the clients.


    +   - Enhanced fault transparency for end-users. Process-level and node-level
    reboot would inevitably be visible to end-users because the reboot typically takes
    10 or more seconds to complete. However, the reboot of an individual component
    usually takes less than a second in Java EE applications [11]. The fast recovery
    makes it possible to hide the microboot from end-users with the facility provided
    by HTTP 1.1. A request that is disrupted by the microboot would result in an HTTP
    response message with a status code 503, indicating that the server is temporarily
    unavailable, and a Retry-After header line, instructing the Web browser to retry
    after certain period of time.


    # ## 3.4 Overcoming Operator Errors


    Most sophisticated software systems require human operators to configure, upgrade,
    and sometimes manually recover from failures.'
  merge: -1
  img_proc: true
- pgno: 125
  md: 'Unfortunately, human errors are inevitable and in many cases, the system dependability
    is significantly reduced because of human errors [4]. To overcome operator errors,
    the checkpointing and logging techniques introduced in Chapter 2 will be essential
    tools. However, these techniques alone are not sufficient because the side-effect
    of the operator errors might not be limited to the application itself. Furthermore,
    traditional checkpointing and logging techniques do not address the need for the
    state repair and selective replay issues. In this section, we describe the operator-undo
    approach [5, 6] in overcoming operator errors.


    It is worth noting that there are numerous works that aim to prevent operator
    errors by automating tasks [31, 33], to reduce the likelihood of operator errors
    by providing operator guidance [1, 3], to contain operator errors (so that an
    error does not propagate to other parts of the system) by validation testing [26,
    27] and by early detection based on machine learning [28]. These approaches are
    complementary to the operator-undo approach.


    # 3.4.1 The Operator Undo Model


    The objective of the operator undo model is to allow an operator to correct any
    mistake that was made by rolling back the system-wide state to a known correct
    point, replaying the intended modification to the application (and/or the operating
    system), and then rolling forward again by replaying the logged operations. The
    model consists of three main steps:


    +   - Rewind. Upon detecting a mistake, an operator can restore the system to
    a known correct state by applying a system-wide checkpoint that includes both
    the state of the application and the operating system. This is different from
    the rollback facility provided by modern operating system, which allows one to
    rollback only the operating system state to a previous restoration point.


    +   - Repair. Once the system-wide state is rolled back, the operator can then
    attempt to reapply the intended changes to the application or the operating system,
    for example, installing the correct patches or reconfiguring the application in
    a correct way. The repair step also potentially involves the modification of the
    logged interactions so that the end-user’s intention is preserved and externalized
    results are'
  merge: -1
  img_proc: true
- pgno: 126
  md: 'consistent with what the user has seen prior to the undo during replay.


    +   - Replay. Subsequently, all the logged end-user interactions, often in the
    form of request messages, are replayed to roll forward the state.


    The main challenge of this model is how to ensure consistent replay of end-user
    interactions. For example, in an email application, the change of the spam filter
    could lead to previously reviewed messages to be removed from the inbox (and moved
    to the spam folder instead). Obviously, how to address the inconsistencies is
    highly application-dependent.


    # 3.4.2 The Operator Undo Framework


    The implementation of the operator undo model requires several key steps:


    +   - Mediating end-user interactions. The operator undo framework must be able
    to intercept all end-user requests to the application, and be able to control
    the responses sent to the users.

    +   - Application and operating system checkpointing.

    +   - Logging of end-user interactions.


    ![](img/7320b1480d74f1d65f74659cab456782_126_0.png)


    Figure 3.13 The architecture of an Operator Undo framework [5, 6].


    Figure 3.13 shows the architecture of an operator undo framework implemented in
    [5, 6]. The main components of the framework include the Undo Proxy, which is
    used to mediate the end-user interactions and for replay, the Undo Manager, which
    is responsible to log the user interactions, and facilitate undo and replay as
    requested by the operator, and two storage facilities for'
  merge: -1
  img_proc: true
- pgno: 127
  md: 'state checkpoints and end-user interactions. The Undo Manager is also responsible
    to facilitate periodic system-wide checkpointing.


    To help separate the application-dependent and the generic implementation of the
    framework, a key construct, called “verb” is introduced in [5, 6]. A verb assumes
    a generic data structure and its content encapsulates the logical intent of an
    end-user interaction with the application server. Hence, verbs are application-specific.
    However, the generic data structure of the verbs makes it possible to implement
    the Undo Manager and the log storage components in an application-independent
    fashion.


    # EXAMPLE 3.11


    In [6], 13 verbs are defined an email system. These verbs captures the common
    operations for email transfer (SMTP protocol) and for end-user access of emails
    (IMAP protocol). Among these verbs, only 4 of them would cause externally visible
    changes:


    +   - Fetch. It is used for an end-user to retrieve headers, flags, or the entire
    emails from a designated folder.

    +   - Store. It is used for an end-user to set flags on emails, such as read or
    deleted.

    +   - List. It is used to retrieve the list of IMAP folders.

    +   - Expunge. It is used to purge all emails that have been flagged as deleted.


    Other verbs defined include:


    +   - Deliver. The only verb for SMTP to deliver an email to the mail store.

    +   - Append. It is used to append an email to a designated IMAP folder.

    +   - Copy. It is used to copy emails to another folder.

    +   - Status. It is used to retrieve the folder state such as the message count
    of the folder.

    +   - Select. It is used to open an IMAP folder.

    +   - Close. It is used to deselect an IMAP folder. The emails flagged as deleted
    in the folder will be purged automatically.

    +   - Create. It is used to create a new IMAP folder (or a subfolder under another
    IMAP folder).'
