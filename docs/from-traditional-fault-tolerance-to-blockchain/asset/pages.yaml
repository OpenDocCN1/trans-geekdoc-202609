  md: 'to create the next block is determined by the following procedure. Given a
    miner $i$ at round $t$ (which is referred to as epoch in FileCoin and each epoch
    has a maximum fixed duration) with power $P_i(t)$, the miner $i$ would be given
    permission to create the block for the round if $Hash(< t||rand(t) >_{Sig})^{2L}
    \le (P_i(t)/\sum_j P_j(t))$, where it is assumed that the cryptographic hash function
    produces an L-bit string. As can be seen, a mining node has no opportunity to
    try out different schemes hoping to win the lottery. Each mining node could only
    try once and if the condition is met, then it would proceed creating the block
    for round $t$. Otherwise, it waits for the next round. Apparently, this scheme
    could lead to multiple miners to be given the permission to create a block, or
    no miner is given the permission. The while paper stated that in case no miner
