    \ variables. Some of the state variables exported by the instrumentation framework\
    \ are in fact aggregate of individual variables. For example, the CPU usage reported\
    \ at the node-level is the sum of the CPU usage of all processes. Such aggregate\
    \ relationships can be detected easily using the name of the variables (such as\
    \ the CPU usage of node and processes) if the individual variables are time-synchronized.\
    \ Even if they are not strictly synchronized, the relationship may be detected\
    \ by allowing some margin of error.\n+   \n+   Once the aggregate relationships\
    \ are established, the redundancy is removed from the edge weight calculation.\
    \ For example, when calculating the edge weight from a node to one of its processes,\
    \ the contribution from the process is omitted. More details for utilizing the\
    \ aggregate relationships can be found in [20].\n\n# ## 3.3 Microreboot\n\nRestarting\
    \ a fine-grained component can be a very efficient way to repair a system quickly.\
    \ However, in order for the approach to work, the system has to be designed according\
