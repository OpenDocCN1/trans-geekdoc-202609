  md: 'That is perhaps one reason why about 59% of Fortune 500 companies suffer from
    1.6 hours or more of downtime per week [2].


    All classical consensus algorithms rely on a concept referred to as membership,
    that is, every node would know how many nodes are in the current membership, the
    logical role of each node, and how to reach other nodes. Another important construct
    is voting via the sending of messages to each other. Typically, one of the members
    would assume a special role, which is referred to as the primary or the coordinator.
    The coordinator might fail or become compromised, in which case, a new coordinator
    would be elected through voting. As such, classical distributed consensus algorithms
    are expensive, highly complex, and not scalable due to the heavy use of multiple
    rounds of message exchanges among the members.


    In January 2009, the launch of the first practical cryptocurrency, Bitcoin [12],
    has completely changed the picture. The most essential prerequisite for a cryptocurrency
    is the assurance that it is virtually impossible for anyone to double-spend the
    money (i.e., cryptocurrency) one has. Bitcoin addressed this requirement by introducing
    an immutable distributed ledger in the form of a chain of blocks where each block
    aggregates hundreds or even thousands of transactions. This distributed ledger
    is often referred to as the blockchain. The immutability of the blockchain is
    achieved by several means: (1) cryptographic protection of the blockchain, such
    as digital signature, one-way hash function, and chaining of the blocks; (2) massive
    degree of replication of the blockchain across many nodes in the Bitcoin network;
    and (3) a novel probabilistic consensus algorithm that is completely different
    from classical consensus algorithms.


    The consensus algorithm used in Bitcoin does not involve any explicit form of
    voting, therefore, there is no extra message exchange among the nodes in the Bitcoin
    network for the purpose of reaching consensus. In Bitcoin, the consensus building
    process is converted into a lottery-like stochastic process where the winner of
    the lottery gets the right to create a new block of transactions and collects
    an award [22]. To ensure fairness and to ensure the process to be a stochastic
    process, every participating node would work on a Proof-of-Work (PoW) based puzzle,
    and the first one that finds a solution becomes the winner. The PoW puzzle has
    a predefined target difficulty, and a participating node would experiment with
    different ways of making the hash of the block header meet the target difficulty.
    This is a CPU-intensive process. Hence, the only way a node could gain advantage
    over other nodes is to invest in better hardware that can perform the hash operation
    faster. The Bitcoin consensus algorithm is referred to as PoW and sometimes as
    the Nakamoto algorithm, named after Bitcoin''s creator, which is apparently a
    pseudonym. This novel form of consensus'
