    creates external dependency and potential single point of failures.


    Blockchain can potentially enhance the level of security, dependability, and trust
    of CPS without resorting to the use of any trusted third party or centralized
    control. First, fault tolerance for both data and processing can be achieved via
    the blockchain’s massive redundancy and deterministic execution of smart contracts.
    The second challenge can be addressed by using smart contract at least partially.
    Atomicity of computing can be ensured via a smart contract, however, the timeliness
    of computing cannot be strictly guaranteed. For the third challenge, a CPS application
    can use blockchain as a trust platform where all transaction records will be made
    immutable in a decentralized manner, and all smart contracts will be executed
    atomically with their state reliably logged. Regarding the fourth challenge, a
    CPS application could adopt the blockchain-way of separating the identity management
    from secure communication by using a wallet-like component. In Blockchain, all
    communication is message-based instead of session-based. Therefore, every message
    is self-contained in that it must carry sufficient information for user authentication
    (typically via a public key) and it is processed without having to consult with
    other entities. For systems using the UTXO model, each transaction is associated
    with a unique pair of keys. Hence, this eliminates the need for checking on the
    validity of some public-key certificate, which would in turn eliminates the need
    for a PKI.


