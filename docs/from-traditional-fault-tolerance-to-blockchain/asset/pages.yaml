    # 6.2.4 Reasoning of the Paxos Algorithm


    Instead of describing the complete Paxos algorithm alone, in [10], Lamport provides
    a detailed reasoning on how the Paxos algorithm is derived starting with the most
    simple and intuitive idea. This is tremendously helpful in understanding the Paxos
    algorithm.'
