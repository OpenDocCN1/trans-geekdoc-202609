    to (1, 1, 1). At this point, site B can conclude that all replicas have received
    the first operation submitted at each site, because $min(1, 1, 1) = 1$. Therefore,
    site B can garbage collect these operations and the log has only two operations
    remaining: $O_{A2}$ and $O_{C2}$.


