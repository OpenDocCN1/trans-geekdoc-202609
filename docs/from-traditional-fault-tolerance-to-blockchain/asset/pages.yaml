    This book contains two parts. The first part consists of the first 7 chapters
    and it covers the most essential techniques for building dependable distributed
    systems. The last 3 chapters form the second part, which covers the blockchain
    technology.


    Chapter 1 introduces the basic concepts and terminologies of dependable distributed
    computing, as well as the primary means to achieve dependability.


    Chapter 2 describes the checkpointing and logging mechanisms, which are widely
    used in practice to achieve some form of fault tolerance. Checkpointing and logging
    enable the recoverability of the system but do not prevent service disruption.
    These mechanisms are relatively simple to implement and understand, and they incur
    minimum runtime overhead while demanding very moderate extra resources (only stable
    storage). Furthermore, checkpointing and logging also serve as the foundation
    for more sophisticated dependability techniques.


    Chapter 3 covers research works on recovery-oriented computing, including fault
    detection and diagnosis, microreboot, and system-level undo and redo. Recovery-oriented
    computing aims to facilitate faster recovery after a system failure and thereby
    improving the availability of the system. Similar to checkpointing and logging,
    the mechanisms for recovery-oriented computing do not prevent service disruption,
    hence, it is a promising approach for many e-commerce application, but not suitable
    for applications that require high reliability.


    Chapter 4 outlines the replication technique for data and service fault tolerance.
    This is the fundamental technique to ensure high reliability. Through active replication
    (i.e., the use of multiple redundant copies of the application processes), the
    system would be able to mask the failure of a replica and continue to process
    clients’ requests (this is actually not entirely true, as we will show in later
    chapters, some failures may cause extended period of unavailability of the system).
    With replication comes the complexity of consistency issue. Ideally, the replicas
    should always maintain consistency with each other. However, doing so might not
    incur too much runtime overhead to be acceptable for some applications, or may
    cause extended period of system unavailability. Hence, strict consistency may
    have to be compromised either for better performance [15] or for better availability
    [19].


    Chapter 5 explains the group communication systems, which can be used to implement
    active replication. A group communication system'
