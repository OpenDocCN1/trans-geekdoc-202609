  md: '# 3.2.3.3 Fault Diagnosis.


    Fault diagnosis involves three steps: (1) identifying components that are in abnormal
    states, (2) computing edge weights to facilitate finding the root cause of the
    fault, and (3) ranking likely faulty components as the root cause for the abnormal
    states observed.


    The current state of a component is assessed by comparing the current values of
    the state variables against the corresponding historical values. The abnormality
    of the component is determined to be the highest abnormality value of any of its
    state variables. The history does not have to be error-free. As long as it is
    sufficiently long (in [20], the minimum history duration for good results is 30
    minutes) and not dominated by the fault being diagnosed, the history will help
    produce reasonable good results.


    For a state variable with a current value $v$, its abnormality $A(v)$ is defined
    to be:


    ```

    $$A(v) = |erf(\frac{v - \mu}{\sigma\sqrt{2}})|$$

    ```


    where $\mu$ and $\sigma$ are the mean value and the standard deviation of the
    state variable in the history, and $erf()$ is the error function, as shown in
    Figure 3.10. The abnormality calculated using this formula ranges from 0 to 1.
    The higher the value, the more abnormal the current state variable is. In [20],
    a heuristic threshold value of 0.8 is used to determine if a component is abnormal.
    The rational for choosing a higher threshold value is that it reduces the likelihood
    of producing false negatives. It is less desirable to declare an abnormal component
    normal than mistaken a normal component as an abnormal one. As shown in Section
    3.3, the cost of false positives can be minimized using microreboot.


    # EXAMPLE 3.8


    Consider a state variable with a current value of 65. Assume the following 20
    values are logged in the history of the variable: 35, 41, 52, 37, 48, 51, 60,
    71, 52, 39, 43, 44, 53, 62, 55, 64, 71, 82, 36, 65 (the last being the current
    value).


    The mean of the variable is 53.05 and the standard deviation is 13.20. Hence,
    $A(65) = erf(0.64) = 0.63$. Using 0.8 as the abnormality threshold as shown in
    Figure 3.10 (pointed by the arrow), this state variable is considered normal.'
