    # 6.6.4 Limited Disk Space for Logging


    The Paxos algorithm did not provide any mechanism to truncate the logs. Because
    each acceptor must log its promises it has made and votes it has casted, the log
    might eventually saturate the disk without an appropriate log truncation mechanism.
    In Chubby, each replica periodically takes a snapshot (i.e., a checkpoint) of
    the application state and when the snapshot is fully recorded on local disk, the
    logged entries prior to the snapshot are truncated. The following mechanism is
    used so that the application layer and the fault tolerance framework layer are
    in sync when taking a snapshot:


    +   - A snapshot handle is used to record the Paxos-specific information regarding
    a snapshot. Hence, the snapshot handle is always stored together with the actual
    snapshot.

    +   - The application must first request a snapshot handle from the fault tolerance
    framework layer prior to taking a snapshot.

    +   - While the application is taking a snapshot, the system does not stop processing
    new requests. To accomplish this, Chubby uses a shadow data structure to track
    the changes to the application’s state to ensure the state recorded in the application
    snapshot corresponds to the framework state as reflected in the snapshot handle.

    +   - When the application finishes taking a snapshot, it informs the framework
    layer, using the snapshot handler as the identifier for the snapshot. The framework
    layer then can truncate the log according to the information contained in the
    handler.


    The truncation of logs could lead to the inability for a replica to supply a log
    entry for a slow replica, in which case, the slow replica must recover via a state
    transfer by using the latest snapshot of another replica in the leading quorum,
    as we have described in Section 6.3.1. After applying the snapshot, the slow replica
    must also obtain all entries logged since that the snapshot. If another snapshot
    is taken and the log is truncated accordingly while the slow replica is applying
    the snapshot, it would have to request a new state transfer.'
