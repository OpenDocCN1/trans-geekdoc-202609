- pgno: 227
  md: 'A key mechanism is the flushing mechanism. At the beginning of a new membership
    formation (i.e., a new view), every node in the membership broadcasts a flush
    message and waits to collect flush messages from every other node in the new membership.
    Before a node has collected a flush message from every other node, it cannot broadcast
    new messages, but is allowed to receive and deliver messages sent in the previous
    view. Because the communication channel is FIFO and reliable, when a node i receives
    the flush message from another node j, it is certain that it has received all
    messages sent previously by node j. Therefore, when a node has collected the flush
    message from every other node, it is certain that it has received all messages
    broadcast in the previous view.


    For addition of new nodes into the membership, the use of the flushing mechanism
    is straightforward. When a node has completed the flushing task, it expands its
    vector clock and can start broadcasting messages in the new view using a bigger
    sized vector timestamp. In the vector clock for the new view, the elements corresponding
    to the old nodes keep the old value at the end of the flushing. The elements corresponding
    to the new nodes are initialized to 0.


    The mechanisms to handle failures of nodes are more complicated and include the
    following steps:


    +   - When a node suspects that another node j has failed, it stops accepting
    regular messages from that node.

    +   - The node re-broadcasts all messages that belong to an unterminated broadcast
    that it has received. A broadcast is said to be unterminated when a node is not
    certain that all nodes have received that broadcast message. A node can determine
    the condition from the vector timestamps it has received.

    +   - The node then broadcasts a flush message.

    +   - When a node has collected a flush message from every other node except the
    one from the failed node, it checks to see if it has received all messages sent
