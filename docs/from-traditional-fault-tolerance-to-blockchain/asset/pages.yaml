- pgno: 154
  md: 'In a state transfer system, the replicas can become consistent with each other
    by applying the most up-to-date copy of the state assuming that no conflict is
    detected when different replicas synchronize with other each. This means that
    intermediate updates, if they exist, are effectively skipped at replicas other
    than those that have applied such updates. This property is often referred to
    as Thomas''s write rule [30]. This rule was introduced in a (pessimistically)
    replicated database system that aims to preserve strong replica consistency by
    using only a scalar logical timestamps for updates and a majority consensus algorithm
    to ensure sequential updates [30]. In optimistic replication, vector clocks or
    their extensions are much more desirable:


    +   - The use of vector clocks enables a replica to update its local copy regardless
    if it can communicates with other replicas, i.e., the data is always available.
    This is very different from [30], which requires the majority of the replicas
    to form an agreement before an update. A replica would not be able to perform
    update on its data if the network partitions and it belongs to a minority partition.


    +   - The vector clocks could be used to accurately capture the causality of different
    updates to the replicas for eventual replica consistency. The vector clocks also
    facilitates the detection of conflicting updates.


    # ### 4.3.3.1 Version Vectors


    The vector clocks used in this context are often referred to as version vectors
    (VV) [16] and discussed in the context replicated file systems. Each individual
    file (i.e., object) is associated with a version vector. In practice, the version
    vector is typically represented with the site id explicitly spelled out instead
    of the compact form we have used in the previous section. For example, if a file
    is replicated at site A, B, and C, the version vector for the file would take
    the form of (A : i, B : j, C : k), where i, j, and k, are the number of updates
    A, B, C, that have been applied to the file respectively. In fact, the version
    vector is represented as N number of (site-id, number-of-updates) pairs, where
    N is the number of replicas for the file. This format facilitates the addition
    of new replicas and the removal of existing replicas, i.e., the version vector
    can be variable length instead of fixed ones.'
  merge: -1
  img_proc: true
- pgno: 155
  md: 'Given two version vectors, $VV_i$ and $VV_j$, if either one dominates the other,
    it is said that the two version vectors are compatible because one can make the
    replicas consistent by applying the Thomas’s write rule. Otherwise, a conflict
    between the two replicas has been detected and it must be reconciled.


    The general rule for using the version vector is rather similar to that described
    in section 4.3.2. In particular, for each update to the file at a site, the site
    increments the version count for that site in the version vector. However, the
    following additional rules are needed to handle cases not considered in section
    4.3.2:


    +   - When a file is renamed, it is treated as an update to the file. Hence, the
    version count will be incremented at the corresponding site element in the version
    vector.


    +   - File deletion is also regarded as an update to the file. Furthermore, the
    file is not actually removed from the file system. Instead, the deletion operation
    would result in a version of the file with zero length (i.e., essentially only
    the meta data for the file is retained). This mechanism is necessary for the simple
    reason that a site should always be prepared to detect possible conflicts on the
    updates made by different sites and reconcile them. Intuitively, only when all
    replicas have agreed to delete the file, could the file be completely removed
    from the file system. The garbage collection of deleted files can be achieved
    by a two-phase algorithm [15].


    +   - After a conflict is detected and reconciled, it is important to assign a
    new version vector to the reconciled file at the site that initiated the reconciliation
    to ensure that the new version vector is compatible with all previous version
    vectors at all replicas of the file. To compute the new version vector, first,
    the version count for each element is set to the maximum of all its predecessors,
    then, the element that corresponds to the site that initiated the reconciliation
    is incremented by one.


    # EXAMPLE 4.3


    In this example, we show how the new version vector is determined after a conflict
    is resolved. Consider a file that is replicated at three sites, A, B, and C, respectively,
    as shown'
