    to a view change without any assurance that a view change will take place according
    to the PBFT view change protocol. The solution, therefore, is to ensure that a
    nonfaulty replica does not abandon the current view unless all other nonfaulty
    replicas would agree to move to a new view too. This is achieved by introducing
