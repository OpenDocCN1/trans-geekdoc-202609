    Each CPS would consists at least one close-loop component and one cyber logic
    unit that is in charge of making decisions on the closed loop as well as interacting
    with other partners, which could be a CPS in a different organization. The closed-loop
    unit consists of a physical plant, sensors and IoT devices for measuring the state
