  md: '# 7.4 Speculative Byzantine Fault Tolerance


    Because faults are rare, it is reasonable to expect that the performance of a
    Byzantine fault tolerance system can be improved by speculative execution. If
    a speculative execution is wrong due to the presence of faulty replicas, the speculative
    execution must be rolled back. Speculative execution in the context of state-machine
    Byzantine faulty tolerance is first introduced in PBFT [5] where replicas can
    tentatively execute a request as soon as it is prepared and all requests that
    are ordered before it have been delivered and executed. Server-side speculative
    execution is pushed to the limit in Zyzzyva [20] where replicas can speculatively
    execute a request as soon as a request is assigned a sequence number (by the primary).
    In [31], client-side speculative execution is introduced to primarily reduce the
    end-to-end latency of a remote method invocation, where the client speculatively
    accepts the first reply received and carries on with its operation.


    Client-side speculative execution is relatively straightforward. To avoid cascading
    rollbacks in case of wrong speculation, a client must not externalize its speculative
    state. A client that has speculatively accepted a reply keeps tracks of additional
    replies received. When a client has received sufficient number of matching replies,
    the speculative execution related to the request and reply will be labeled as
    stable.


    In this section, we focus on the server-side speculative execution as described
    in Zyzzyva [20]. Zyzzyva employs the following main mechanisms:


    +   - A replica speculatively executes a request as soon as it receives a valid
    pre-prepare message from the primary.

    +   - The commitment of a request is moved to the client. A request is said to
    have *completed* (instead of committed) at the issuing client if the corresponding
    reply can be safely delivered to the client application according to Zyzzyva.
    Zyzzyva ensures that if a request completes at a client, then the request will
    eventually be committed at the server replicas.

    +   - The all-to-all prepare and commit phases are reduced to a single phase.
    As a trade-off, an additional phase is introduced in view change.'
  merge: -1
  img_proc: true
