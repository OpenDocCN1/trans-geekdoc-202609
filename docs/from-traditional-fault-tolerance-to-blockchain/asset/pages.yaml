    notion of majority can be extended as a *quorum*. A quorum in a system is defined
    to be a set of processes such that any two quorums of the system intersect in
    at least one process. Obviously, a majority of replicas would form a quorum. Any
    two such quorums would always intersect in at least one replica. However, a quorum
    does not necessarily the majority of the replicas. Some quorum might consist of
    more than the majority, while some quorum might consist of less than the majority.
    In the extreme case, a single replica can constitute a quorum, in which case,
    all other quorums must include this replica as well. Hence, we can conclude that
    we have used a static quorum size (and quorum formation) in the algorithms described.
    As we will see later, in Cheap Paxos, dynamic quorum is used to further reduce
