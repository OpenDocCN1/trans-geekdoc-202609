    Robust software itself is normally insufficient to delivery high dependability
    because of the possibility of hardware failures. Unless a distributed system is
    strictly stateless, simply restarting the system after a failure would not automatically
    restore its state to what it had before the failure. Hence, fault tolerance techniques
    are essential to improve the dependability of distributed systems to the next
    level.


