- pgno: 24
  md: '# Preface


    Cloud services are playing an ever increasingly important role in all aspects
    of our society, governments, businesses, and individuals alike. We depend on these
    services on a daily basis, such as financial (e.g., online banking and stock trading),
    e-commerce (e.g., online shopping), civil infrastructure (e.g., electric power
    grid and traffic control), entertainment (e.g., online gaming and multimedia streaming),
    and personal data storage (e.g., various cloud services such as Dropbox, Google
    Drive, and OneDrive). Behind these cloud services is distributed computing, which
    addresses many critical issues in making the services dependable and trustworthy.
    The most important of all is to build consensus in its internal operations that
    span many different computing nodes.


    Distributed consensus has been studied for several decades, at least starting
    in 1970s. The reason why distributed consensus is important is that a distributed
    system would span over many computing nodes, and these nodes must maintain a common
    view on the system state so that each can operate as planned towards the objectives
    of the system. Prolonged inconsistency among different components of the system
    would damage the integrity of the system and ultimately would result in system-level
    failures that are visible to end users.


    The cost of system failures is enormous. If a data center is brought down by a
    system failure, the average cost for downtime may range from $42,000 to about
    $300,000 per hour [2, 6]. The cost can be estimated by summing up the wasted expenses
