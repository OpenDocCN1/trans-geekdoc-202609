    # ## 7.2 Practical Byzantine Fault Tolerance


    The Oral Message Algorithms solve the Byzantine consensus problem. Unfortunately
    the solution is not practical for primarily two reasons:


    +   - The Oral Message Algorithms only work in a synchronous environment where
    there is a predefined bound on message delivery and processing, and the clocks
    of different processors are synchronized as well. Practical systems often exhibit
    some degree of asynchrony caused by resource contentions. The use of a synchronous
    model is especially a concern in the presence of malicious faults because an adversary
    could break the synchrony assumptions, for example, by launching a denial of service
    attack on a nonfaulty process to delay message delivery.


    +   - Except for $f = 1$, the Oral Message Algorithms incur too much runtime overhead
    for reaching a Byzantine agreement.


    More efficient Byzantine fault tolerance protocols, such as SecureRing [16] and
    Rampart [30], were developed and they'
  merge: -1
  img_proc: true
- pgno: 293
  md: 'were designed to operate in asynchronous distributed systems. However, they
    rely on the use of timeout-based unreliable fault detectors to remove suspected
    processes from the membership, as a way to overcome the impossibility result.
    Because the correctness of such protocol rely on the dynamic formation of membership,
    which in turn depends on the synchrony of the system. This is particularly dangerous
    in the presence malicious adversaries, as pointed out in [5].


    In 1999, Castro and Liskov published a seminal paper on practical Byzantine fault
    tolerance (PBFT) [5] with an algorithm that is not only efficient, but does not
    depend on the synchrony for safety. The design of the PBFT algorithm is rather
    similar to that of the Paxos algorithm. Hence, the PBFT algorithm is sometimes
    referred to as Byzantine Paxos [23, 24].


    # 7.2.1 System Model


    The PBFT algorithm is designed to operate in an asynchronous distributed system
    connected by a network. Hence there is no bound on message delivery and processing
    time, and there is no requirement on clock synchronization. The PBFT algorithm
    tolerates Byzantine faults with certain restrictions and assumes that the faults
    happen independently.


    To ensure fault independence in the presence of malicious faults, replicas must
    be made diverse. One way to satisfy this requirement is via the N-version programming
    where different versions of a program with the same specification are developed
    [1]. However, the disadvantage for N-version programming is the high cost of software
    development as well as maintenance. It is also possible to utilize existing software
    packages that offer similar functionalities to achieve diversified replication,
    such as file systems and database systems [7, 30]. This approach requires the
    use of wrappers to encapsulate the differences in the implementations. A more
    promising approach to achieving diversity is via program transformation [2, 3,
    10, 11, 12, 16, 17, 19, 29, 32], for example, by randomizing the location of heap
    and stack memory [3, 16, 32].


    To ensure that a replica can authenticate a message sent by another replica, cryptographic
    techniques are employed. In the PBFT algorithm description, we assume that each
    message is protected by a public-key digital signature. Later in this section,
    we discuss an optimization by replacing the digital signature, which'
  merge: -1
  img_proc: true
- pgno: 294
  md: 'is computationally expensive, with a message authentication code (MAC) [4].
    The use of digital signatures or MACs also enables a replica to detect corrupted
    or altered messages.


    The restrictions assumed for an adversary is that it has limited computation power
    so that it cannot break the cryptography techniques used to spoof a message (i.e.,
    to produce a valid digital signature of a nonfaulty replica). It is also assumed
    that an adversary cannot delay a message delivery at a nonfaulty replica indefinitely.


    # ## 7.2.2 Overview of the PBFT Algorithm


    The PBFT algorithm is used to implement state machine replication where a client
    issues a request to the replicated server and blocks waiting for the corresponding
    reply. To tolerate f faulty replicas, 3f + 1 or more server replicas are needed.
    The PBFT algorithm has the following two properties:


    +   * Safety. Requests received by the replicated server are executed atomically
    in a sequential total order. More specifically, all nonfaulty server replicas
    execute the requests in the same total order.

    +   * Liveness. A client eventually receives the reply to its request provided
    that the message delivery delay does not grow faster than the time itself indefinitely.


    The minimal number of replicas, n = 3f + 1, to tolerate f faulty replicas are
    optimal for any asynchronous system that ensures the safety and liveness properties.
    Because up to f replicas may be faulty and not respond, a replica must proceed
    to the next step once it has collected n - f messages from different replicas.
    Among the n - f messages, up to f of them might actually be sent by faulty replicas.
    To have any hope of reaching an agreement among the nonfaulty replicas, the number
    of messages from nonfaulty replicas must be greater than f (i.e., among the n
    - f messages collected, the number of messages from nonfaulty replicas must be
    the majority). Hence, n - 2f > f, which means the optimal number of replicas n
    = 3f + 1.


    In the presence of faulty clients, the PBFT algorithm can only ensure the consistency
    of the state of nonfaulty replicas. Furthermore, the algorithm itself does not
    prevent the leaking of confidential information from the replicated server to
    an adversary.'
