    occurred and to localize the source of the fault (i.e., pinpoint the faulty component).
    To accomplish this, the distributed system is modeled, and sophisticated statistical
    tools are often used [3]. Some of the approaches in fault detection and diagnosis
    are introduced in Chapter 3.


