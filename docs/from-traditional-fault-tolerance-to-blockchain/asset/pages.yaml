- pgno: 411
  md: 'In the context of security, the availability means that information is accessible
    by authorized users, and integrity means two things: (1) the source of the data
    is legitimate, and (2) the data are not tampered with during transmission and
    while stored on the blockchain. In blockchain, both availability and integrity
    are protected by the use of digital signatures, and the data on the blockchain
    are additionally protected by cryptographic hash of the block header. Let’s use
    Bitcoin as an example, the input of a transaction must carries an unlocking script,
    which is a digital signature corresponds to the address of the fund to be spent
    as specified by the input. This ensures that only the user who has the corresponding
    private key can spend the fund and therefore, can create the transaction. In blockchain,
    the transaction is always the primary form of data. Even on blockchain platforms
    that support smart contract, such as Ethereum, the contract is created and invoked
    by transactions. By ensuring only legitimate user can generate transactions, the
    system would ensure that the source of data are genuine. When a node receives
    a transaction, the node will verify the transaction before it accepts and propagates
    the transaction. Similarly, a new block just created will be verified before it
    is accepted and propagated as well. These verifications would make sure the data
    are correct and are not tampered with during propogation. Once a block and all
    the transactions included in the block are placed on the blockchain, it can no
    longer be altered without being detected. A block might be rendered stale due
    to a fork, but it cannot be altered. Hence, the integrity is guaranteed by blockchain.


    As can be seen from Figure 10.1, blockchain does not offer any mechanism for confidentiality.
    Indeed, public blockchains such as Bitcoin and Ethereum do not encrypt the transaction
    and blocks. Hence, one can argue that blockchain does not protect the confidentiality
    of transaction data. Indeed, the transaction ledger (i.e., the blockchain) is
    designed to be a public ledger on purpose. However, with smart contract, confidential
    data may be encrypted. The lack of confidentiality on the transaction data does
    create concerns for the adoption of the blockchain technology in the financial
    sector.


    Sometimes privacy is considered a property of secure system, but we prefer to
    use the authoritative definition of security [12], which does not include privacy.
    The mechanism used to protect the privacy of a user is quite different from those
    that ensures the three fundamental properties of a secure system, i.e., confidentiality,'
  merge: -1
  img_proc: true
- pgno: 412
  md: 'integrity, and availability. Privacy does not equate to confidentiality, although
    it does relies on confidentiality. For example, Bitcoin uses the UTXO model for
