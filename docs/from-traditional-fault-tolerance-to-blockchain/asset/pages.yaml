    # 6.5.1 The Basic Steps


    The basic steps of the Fast Paxos algorithm are rather similar to those of the
    original Paxos (from now on referred to as Classic Paxos to differentiate it from
    other variants of the Paxos algorithms). Fast Paxos also operates in rounds (the
    round number corresponds to the proposal number in Classic Paxos) and each round
    has two phases. The first phase is a prepare phase to enable the coordinator (originally
    the proposer in Classic Paxos) to solicit the status and promises from the acceptors.
    The second phase is for the coordinator to select a value to be voted on by the
    acceptors. When an acceptor has responded to a phase 1a (P1a) message in a round
    i, it is said that the acceptor has participated in round i. When an acceptor
    has sent to the coordinator a phase 2b (P2b) message in response to the phase
    2a (P2a) message from the coordinator, it is said that the acceptor has casted
    its vote for that round.


    Fast Paxos has a number of differences from Classic Paxos:


    +   - In Fast Paxos, a round may be either a fast round or a classic round. A
    fast round may use a quorum of different size from that of a classic round. We
    refer to the quorum used in a fast round as fast quorum, and the quorum used in
    a classic round as classic quorum.

    +   - The value selection rule at the coordinator is different from that of the
    Classic Paxos due to the presence of the fast round.

    +   - In a classic round, the coordinator always selects the value to be voted
    on, similar to that of Classic Paxos.

    +   - In a fast round, if the new value selection rule allows the coordinator
    to select its own value, it may send a special phase 2a message to the acceptors
    without any value selected. This special phase 2a message (referred to as any
    message in [12]) enables an acceptor to select its own value (proposed by a client)
    to vote on.'
