    The beauty of using blockchain to facilitate data communication is that it can
    be made secure without relying on any centralized entity, such as PKI. Anyone
    that wanted to verify a transaction can retrieve the public key for verifying
    the digital signature in the transaction from the transaction itself. This is
    made possible because by design, blockchain removed the identity of the owner
