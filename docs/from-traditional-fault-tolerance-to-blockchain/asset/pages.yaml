    # 5.3.3 Recovery Protocol


    The Recovery Protocol dictates the actions taken while transitioning from the
    Commit state to the Recovery state, while in the Recovery state, and while transitioning
    from the Recovery state to the Operational state. During recovery, the nodes that
    belong to both the old view and the new view will try to deliver as many messages
    that were originated in the old view as possible according to the old view, then
    they will attempt to deliver messages that are not deliverable according to the
    old view, but deliverable according to the transitional configuration formed by
    only those nodes. Note that not all messages that were originated in the old view
    may be delivered. For example, if there is a gap in sequence number, the messages
    ordered after the gap cannot be delivered because doing so might violate causality.


    The Recovery Protocol uses a regular token with one additional field activated:


    +   - retrans_flg: A boolean variable indicating whether or not there are additional
    messages that were originated in the old view that must be retransmitted in the
    transitional'
  merge: -1
  img_proc: true
- pgno: 215
  md: 'configuration (consists of nodes that belong to both the old view and the new
    view).


    Furthermore, the protocol uses the following local variables at each node:


    +   - my_new_members: The set of ids for the nodes in the new view.

    +   - my_trans_members: The set of ids for the nodes that belong to both the old
    view and the new view.

    +   - low_ring_aru: The smallest my_aru value among the nodes in the my_trans_members
    list in the old view.

    +   - high_ring_delivered: The largest sequence number among the messages that
    have been delivered at some node that belongs to the transitional configuration
    (i.e., in the my_trans_members list).

    +   - my_install_seq: The largest sequence number among the messages that were
    sent in the old view and that were known to the new view.

    +   - retrans_msg_queue: A queue of regular messages sent in the old view that
    should be retransmitted such that all the nodes in the transitional configuration
    would receive the same set of messages.

    +   - my_retrans_count: The number of successive token visits in which the retrans_flg
    is false. It is initially set to 0.


    # 5.3.3.1 Event and actions on transition from Commit to Recovery state


