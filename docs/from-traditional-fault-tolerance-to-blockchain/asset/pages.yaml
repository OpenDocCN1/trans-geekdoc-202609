  md: '![](img/7320b1480d74f1d65f74659cab456782_115_0.png)


    # Figure 3.10 The error function.


    The next step is to calculate the weight of each edge in the dependency graph.
    The objective of computing the edge weights is to facilitate the root cause analysis.
    Consider an edge with the source component S and the destination component D.
    If either S or D is normal, a minimum weight of 0.1 is assigned to the edge because
    it is unlikely that S has negative impact on D. Here the use of 0.1 instead of
    0 as the weight is because the path weight calculation (needed for root cause
    predication) involves the multiplication of the edge weights along the path.


    If both S and D are abnormal, the edge weight is calculated based on the joint
    historical behavior of S and D. The history where both S and D are present is
    divided equally into N chunks, with each chunk containing at least one set of
    logged values for S and one for D. If a chunk k contains multiple set of values
    (which is usually the case), the set that represents a state, Sk, that is most
    similar to the current state, Snow, for the source component S, is selected. Empirically,
    a small N, such as 10, is sufficient for accurate fault diagnosis [20].


    The similarity of two states of a component C (except the configuration component)
    is calculated by computing their differences in the values of the component’s
    state variables:


    ```

    |C_k - C_{now}| = \sum_{n}^{i=1} \frac{|d^i|}{n} (3.4)

    ```'
