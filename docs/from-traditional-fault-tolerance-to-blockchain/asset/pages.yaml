    provides information to the proposer) must intersect in at least one acceptor,
    this acceptor would pass on the value it has accepted to the proposer to be included
    in the new proposal.


    Is it possible for different acceptors to accept proposals with different values?
    The answer is yes if the system has not chosen any proposal yet. Accepting different
    values at the acceptors prior to the chosen of the first proposal would not endanger
    the safety requirement for consensus. Nevertheless, an acceptor should inform
