  md: '# 5


    # Group Communication Systems


    The implementation of a state-machine based fault tolerance system can be made
    much easier with an underlying group communication system [3] that provides the
    following services:


    +   A totally ordered reliable multicast of messages. This ensures that all server
    replicas receive the same set of requests from clients in the same total order,
    which is essential to maintain replica consistency.


    +   A membership service. A fault tolerance system is designed to handle process
    and communication faults. When a replica is no longer reachable, the group communication
    system can automatically reconfigure the system. A membership service would inform
    the surviving server replicas and their clients about the configuration change
    and the list of members in the new configuration.


    +   A view synchrony service. To ensure replica consistency across different reconfigurations,
    a membership change'
  merge: -1
  img_proc: true
- pgno: 179
  md: 'notification must be totally ordered with respect to regular multicast messages
    before and after a reconfiguration change so that different replicas have consistent
    views regarding the configuration change and the messages that are multicast prior
    to and after the configuration change [4, 17]. Typically, the period between two
    consecutive reconfigurations are referred to as a view.


    Group communication systems had been under intense study in 1980s and 1990s, and
    there are numerous publications on this subject (for example [3, 1, 12, 13, 18,
    6]). We make no attempt to provide a survey on these publications. Instead, we
    focus on several group communication systems that are elegantly designed and are
    representatives of the respective approaches. Based on the mechanism used to achieve
    message total ordering, the most well-known approaches include [13]:


    +   Sequencer based. One of the nodes in the membership is designated the task
    of assigning a global sequence number (representing the total order) of each application
    message (may be multicast by any node in the membership). This special node acts
    as the sequencer for the entire system [12]. It is possible to stick to a particular
    node as the sequencer the entire time unless it becomes faulty, or to let the
    nodes in the membership to take turn to serve as the sequencer (often referred
    to as rotating sequencer). Regardless the strategies used, as long as the system
    allows only a single sequencer to operate at a time, message total ordering can
    be guaranteed.


    +   Sender based. If the system ensures that the nodes in the membership take
    turn to multicast, then all multicast messages are naturally totally ordered.
    The sender based approach also uses a global sequence number to represent the
    total order of each request sent. When a node takes its turn to multicast, it
    must know the global sequence number assigned to the last message sent. This requirement
    can be satisfied by passing a virtual token across different nodes [3, 18]. A
    node obtains the privilege to send when it receives the token, which carries the
    history information such as the sequence number of the last message sent. When
    a node is done sending, it completes its turn by passing the token to the next
    node in the membership list.'
  merge: -1
  img_proc: true
- pgno: 180
  md: '+   • Vector clock based. The causal relationship among different messages
    can be captured using vector clocks. In this approach, each message that is multicast
    is piggybacked with a vector timestamp. A receiver can deduce the causal relationship
    of the messages from the timestamps. A very efficient causally ordered reliable
    multicast service has been implemented using this approach [6]. It is possible
    to construct a totally ordered reliable multicast service using vector clocks.
    However, additional constraints must be imposed to the system so that a total
    order can be established, for example, a receiver must receive at least one message
    from each sender in the system before it can be certain of the total order of
    the messages it has received. Hence, in Isis [7], a dedicated sequencer node is
    used to establish the total order on top of the causally ordered multicast service.


    Since the publication of the Paxos consensus algorithm in late 1990s [15], attention
    has been switched to rely on the Paxos family of algorithms, which will be introduced
    in the next chapter, to ensure message total ordering via distributed consensus
    [2, 5, 8, 11, 10, 19]. In fact, regardless of the approaches used to achieve message
    total ordering, distributed consensus is needed for membership changes. As we
    will explain in details later in this chapter, the membership change (or reconfiguration)
    protocols introduced in older generations of group communication systems often
    contain weaknesses compared with the Paxos family of algorithms.


    # 5.1 System Model


    We assume an asynchronous system with N nodes that communicate with each other
    directly by sending and receiving messages. A node may become faulty and stop
    participating the group communication protocol (i.e., a fail-stop fault model
    is used). A failed node might recover. However, it must rejoin the system via
    a membership change protocol. Some protocols (such as Totem) requires the availability
    of stable storage that can survive crash failures.


    We assume that the N nodes in the system form a single broadcast domain. During
    normal operation, when a node in the current membership multicasts a message,
    the message is broadcast to all'
  merge: -1
  img_proc: true
- pgno: 181
  md: 'nodes in that membership. Hence, we use the terms multicast and broadcast interchangeably.
    Furthermore, a node ignores messages sent by nodes that do not belong to the current
    membership (often referred to as foreign messages), unless they are membership-change
    related messages (such as the rejoin request). This means that we assume a closed,
    single group system.


    A group communication system must define two protocols, one for normal operation
    when all nodes in the current membership can communicate with each other in a
    timely fashion, and the other for membership change when one or more nodes are
    suspected as failed, or when the failed nodes are restarted. These protocols work
    together to ensure the safety properties and the liveness property of the group
    communication system.


    We define two levels of safety properties for total ordering [13]:


    +   Uniform total ordering: Given any message that is broadcast, if it is delivered
    by a node according to some total order, then it is delivered in every node in
    the same total order unless the node has failed.


    +   Nonuniform total ordering: Given a set of messages that have been broadcast
    and totally ordered, no node delivers any of them out of the total order. However,
    there is no guarantee that if a node delivers a message, then all other nodes
    deliver the same message.


    Figure 5.1 highlights the differences between uniform total ordering and nonuniform
