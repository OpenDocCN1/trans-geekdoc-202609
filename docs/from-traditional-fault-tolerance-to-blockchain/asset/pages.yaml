  md: '# 3


    # Recovery-Oriented Computing


    Recovery-oriented computing was pioneered by a joint research project of Stanford
    University and the University of California, Berkerly [7] in early and mid 2000.
    The main focus of the research is to develop guidelines, methodologies, and tools
    to enable fast recovery for Internet-based servers. This research complements
    other research efforts that aim to extend the mean time to failure (MTTF) of the
    software systems, for example, by using replication to mask low-level failures.
    The rational is that, by reducing the mean time to recover (MTTR), the system
    availability can be improved as well due to the inverse relationship between the
    availability and the mean time to recover (i.e., Availability = MTTF / (MTTF+MTTR)).


    The first step in achieving fast recovery is quick fault detection and localization.
    Fault detection means to determine if some component of a system has failed, and
    it may not pinpoint exactly which component has failed. Fault localization, on
    the other hand, is to find the exact component that has failed. While low level'
  merge: -1
  img_proc: true
- pgno: 95
  md: 'fail-stop faults can be quickly detected using mechanisms such as timeouts,
    most application level faults are more subtle (at least revealed by their symptoms
    during early stages) and much harder to detect and in general, even harder to
    localize. As reported in [13, 14, 22], for some Internet service providers, up
    to 75% of the recovery time is spent on application-level fault detection.


    Although fault detection and localization have long been an active area of research
    [2, 12, 19, 29], the approaches employed in recovery-oriented computing are unique
    in that they target the application-level fault detection and localization based
    on application-agnostic machine-learning techniques. These approaches have several
    advantages: (1) they may be applied to many distributed systems with minimum development
    cost because they are not tied to any specific application and they do not depend
    on any specific application semantics, and (2) they can cope with unforeseen faults,
    which is very useful for large complex systems because it is impossible to develop
    fault models a priori for traditional fault diagnosis methods.


    Once a failed component is located, the cheapest method to recover the component
    is to restart it, which is referred to as microreboot [11]. Microreboot is different
    from regular reboot in that only the suspected component is restarted instead
    of the entire server application. As such, microreboot is much faster than typically
    reboot. According to [7, 11], restarting an Enterprise Javabean (EJB) typically
    takes less than 0.6 seconds, while restarting the entire application server would
    take about 20 seconds. Microreboot is best at handling transient software bugs
    (often referred to as Heisenbugs) and resource (such as memory and file descriptors)
    leaks.


    When microreboot is not capable of fixing the problem, such as in the presence
    of persistent software bugs and the corruption of persistent data, and in case
    of operator errors, more heavy-weight method must be used to recover the system.
    A system-level undo/redo methodology was developed to handle these difficult cases.
    Different from checkpointing and logging introduced in the previous chapter, the
    system-level undo/redo provides a more comprehensive recovery solution for several
    reasons: When resetting the state of a process (i.e., undo), the operating system
    state is also reset. This is especially useful to handle operator error because
    any persistent effect on the operating system (e.g., files modified, deleted,
    or created) due to the error must be reversed in order'
