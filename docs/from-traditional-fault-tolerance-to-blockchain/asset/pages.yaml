    # 4.3.3 State Transfer Systems


    After an operation is submitted and applied locally, the update to the state needs
    to be propagated to other replicas. As we mentioned before, there are two distinct
    approaches to the update propagation from the master site to other replicas. In
    this subsection, we focus on the state transfer systems where the update is disseminated
    to other replicas via state transfer. The update propagation, conflict detection
    and reconciliation in operation transfer systems will be discussed in next subsection.'
