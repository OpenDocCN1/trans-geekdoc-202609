  md: 'in fact would be identical. A simple mechanism to reconcile the reported conflicts
    in this case is to compare the different versions of the file. If they turn out
    to be the same, the conflicts are reconciled effectively with a no-op operation.


    As another example, in [31], conflicts on directories in a replicated file system
    are reconciled based on the fact that there are only two allowed operations: create
    a file or delete a file. As such, conflicts on directories can be reconciled by
    first merging all the files within the directory (from the conflicting replicas),
    and then by filtering out those that had been deleted.


    # 4.3.4 Operation Transfer System


    In an operation transfer system, each site must log the operations submitted as
    well as those received from other sites. The logged operations may be propagated
    to other sites via reliable multicast in a tightly-coupled system, or via point-to-point
    exchanges epidemically in loosely-coupled systems. In this subsection, we assume
    the latter approach is used because it might be more appearing to the Internet
    environment.


    # 4.3.4.1 Propagation Using Vector Clocks


    As we mentioned in section 4.3.2, operations must be properly timestamped so that
    the causality between different operations can be preserved when they are applied
    and vector clock is a powerful tool to enable this. For a vector clock $VC_i$
    maintained by site $i$:


    +   - $VC_i[i]$ represents the number of operations submitted at site $i$ locally.

    +   - $VC_i[j]$ ($i \neq j$) refers to what sites $i$ knows about the number of
    operations submitted at a remote site $j$.


    For two sites $i$ and $j$ to find out what operations are missing at each site,
    they exchange their vector clocks. Then, they propagate the operations needed
    by each other according to the following rules:


    +   - For $\forall k \neq j$, if $VC_i[k] > VC_j[k]$, site $i$ propagates all
    operations that were submitted originally at site $k$ and carry timestamps larger
    than $VC_j[k]$ to site $j$.

    +   - For $\forall k \neq i$, if $VC_j[k] > VC_i[k]$, site $j$ propagates all
    operations that were submitted originally at site $k$ and carry timestamps larger
    than $VC_j[k]$ to site $i$.'
