  md: '# 6.6 Implementations of the Paxos Family Algorithms


    The original Paxos algorithm and several of its derivative algorithms have been
    implemented in a number of open-source projects, including:


    +   libPaxos. This project consists the implementations for both the original
    Paxos and Fast Paxos in C/C++, and a Paxos algorithm simulator in Erlang. More
    information for the project can be found at: http://libpaxos.sourceforge.net/.


    +   Paxos for System Builders [1]. It is an implementation of the Paxos algorithm
    in C with a number of optimizations. More information for the project can be found
    at: http://www.dsn.jhu.edu/Paxos-SB.html.


    +   OpenReplica. OpenReplica is an implementation of the Paxos algorithm for state
    machine replication in Python. More information for the project can be found at:
    http://openreplica.org/.


    +   Plain Paxos. It is another implementation of the Paxos algorith in Python.
    More information for the project can be found at: https://github.com/cocagne/paxos.


    +   JPaxos. It is an implementation of the Paxos algorithm for state machine replication
    in Java. More information for the project can be found at: http://www.it-soa.eu/en/resp/jpaxos/.
    The source code is available for download at: https://github.com/JPaxos/JPaxos.


    +   Java-Paxos. It is another implementation of the Paxos algorithm in Java. More
    information for the project can be found at: http://java-paxos.sourceforge.net/.


    The Paxos algorithm has also been used in production systems. The most well known
    system perhaps is Chubby at Google [5]. Chubby provides a fault tolerant distributed
    locking service for various clients such as Google File Systems and Bigtable clients.
    In Chubby, an implementation of the Paxos algorithm (Multi-Paxos to be specific)
    is used to provide a fault tolerant logging service. In this section, we introduce
    a number of challenges that arise in the production system as reported in [5].'
  merge: -1
  img_proc: true
- pgno: 267
  md: '# ## 6.6.1 Hard Drive Failures


    Paxos assumes the availability of persistent storage locally to each acceptor
    so that if it makes a promise in the phase 1b message, it won’t forget about it
    after recovering from a crash failure. In Chubby, a replica logs its promise to
    the local hard drive for more robust crash recovery. Unfortunately, hard drive
    failures do occur and in particular, a disk may be corrupted and the log file
    may be accidentally deleted due to operator errors. When a replica recovers from
    a crash fault, it may not have access to the log file that recorded its promises
    prior to the crash fault, in which case, the safety property of Paxos might be
    violated.


    As we elaborated in the beginning of this chapter, one approach to handle this
    challenge is to require the recovering replica to rejoin the system instead of
    continuing as usual. To reinforce this policy in practice, there must be a way
    to preventing a recovering replica from continuing operating as if the crash did
    not occur. In Chubby, this is achieved by requiring a replica to register a marker
    file with the Google File System each time it starts/restarts. When a replica
    restarts after a crash fault, it is reminded that it should not participate in
    any Paxos instances in the system until it has gone through a catch-up procedure.
    Basically, the replica must observe a full instance of Paxos that is started after
    its recovery before it participates in voting again.


    In [5], there is also an discussion on skipping flushing the log (for the promises
    made and votes casted by a replica) synchronously to disk as an optimization,
    which is consistent with our argument on the need for writing to persistent storage
    in the beginning of this chapter.


    # ## 6.6.2 Multiple Coordinators


    When the current coordinator is disconnected or crashed, the system would elect
    a new coordinator. When the disconnected replica reconnects, or restarts after
    a crash, it may not realize that it is no longer serve as the coordinator role.
    Furthermore, some clients might not know that the coordinator has changed and
    they would still issue their requests to the old coordinator. In this case, the
    old coordinator would attempt to proceed to launch new instances of the Paxos
    algorithm. This might cause rapid changes of the coordinator in the system, which
    is apparently not desirable.'
  merge: -1
  img_proc: true
- pgno: 268
  md: 'To prevent this from happening, in Chubby, the coordinator periodically starts
    a new round of Paxos algorithm even if no client''s request is received. This
    mechanism can minimize the chance that a reconnected or restarted replica from
    successfully getting the coordinator role back. Implicitly, the coordinator is
    granted a master lease [7] each time it successfully runs an instance of the Paxos
    algorithm. As long as the coordinator has a valid master lease, it is guaranteed
    that it has the latest state of the system. When the coordinator receives read-only
    requests, it can execute them immediately without the need of totally ordering
    them.


    In Chubby, when a client issues a request to the coordinator for processing, if
    the replica has lost its coordinator role either at the time of submission of
    the request, or prior to the execution of the request, the request should be aborted.
    The most tricky scenario is when the coordinator fails and quickly restarted,
    in which case, the requests submitted before the crash but not yet fully executed
    should be aborted. To distinguish this scenario from normal operation, an epoch
    number is introduced such that requests received by the coordinator while it is
    continuously serving as the coordinator role are assigned the same epoch number.
    The epoch number is stored in the database for persistency.


    Even though the above mechanisms apparently work in Chubby (it is a product system),
    it is unclear why the more elegant approach, i.e., the view change mechanism [16,
    17], is not adopted. If the view change mechanism as we described in section 6.3.2
    is used, the reconnected or restarted replica cannot possibly run a successful
    instance of the Paxos because the instance would possess an obsolete view number.
    The use of view number also eliminates the need for the epoch number.


    # 6.6.3 Membership Changes


    The Paxos algorithm (and most of its variants) assumes a static membership on
    the acceptors. In Cheap Paxos [14], a mechanism is provided to cope with configuration
    changes. However, it was reported in [5] that handling membership changes is not
    straightforward, although the details were not provided. Hence, in this section,
    we discuss the caveat in handling membership changes as reported in [17]'
  merge: -1
  img_proc: true
- pgno: 269
  md: '# 6.6.3.1 Rejoin and Replacement


    Because processes fail over time, it is important to repair or replace replicas
    that have become faulty to ensure the long running of a fault tolerance system.
    As we have argued before, when a replica rejoins the system, it must first obtain
    the latest state of the system before it can participate in the Paxos algorithm
    again. This mechanism negates the need for logging Paxos-related information (promises
    and votes, etc.) on persistent storage. As reported in Chubby [5], local hard
    drives cannot be used as true persistent storage and hence, a rejoining replica
    is not allowed to immediately take part in the Paxos algorithm. A replacement
    replica would assume the replica id of the replaced one, and it joins the system
    by first requesting a state transfer, exactly the same as a rejoining replica.


    # 6.6.3.2 Membership Expansion


    When expanding the membership, two replicas should be added at a time. Assuming
    the current membership consists of 2f + 1 replicas, after adding the two replicas,
    the new membership would be able to tolerate f + 1 faulty replicas, thereby, increasing
    the failure resiliency of the system. To join the system, a replica multicasts
    a join request to all existing members of the system. The join request is totally
    ordered with respect to all other application requests. The execution of the join
    request is a membership change.


    ![](img/7320b1480d74f1d65f74659cab456782_269_0.png)


    Figure 6.15 Expansion of the membership by adding two replicas in method 1.


    Care must be taken on adding the first of the replicas. There can be two alternative
    approaches:'
