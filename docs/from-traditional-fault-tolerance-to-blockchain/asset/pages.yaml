  md: '# 8 Cryptocurrency and Blockchain


    This chapter provides an overview of cryptocurrency and the blockchain technology.
    We first introduce the history of cryptocurrency, then we describe the design
    principle and major components of the first cryptocurrency, Bitcoin [15]. Next,
    we outline the vision and key components of Ethereum [23], which was developed
    not aiming to compete directly with Bitcoin as a cryptocurrency, but instead,
    as a platform for developing decentralized applications based on its smart contract
    implementation, which is in turn powered by the blockchain technology. Finally,
    we present common attacks on the blockchain technology.


    # 8.1 History of Cryptocurrency


    A cryptocurrency that is powered by decentralized computer technology has long
    been a dream for some pioneers such as Nick Szabo. In his online post [21], Nick
    Szabo elaborated his idea of Bit Gold. He proposed to use a decentralized solution
    to replace a third'
  merge: -1
  img_proc: true
- pgno: 327
  md: 'party to establish trust in monetary transactions. He pointed out the issue
    of double-spending because unlike physical paper bills, digital money can be easily
    reproduced. Some publication claimed that Nick Szabo proposed the Bit God idea
    as early as 1998 [16]. Unfortunately, no hard evidence can be found. Nick Szabo’s
    blog has a timestamp of December 27, 2008. In the blog itself, Nick Szabo stated
    that he “hit upon the idea of bit gold” “a long time ago” without citing any evidence.


    Nick Szabo pointed out the value of precious metals such as gold. Gold was used
    historically as money “largely independent of any trusted third party.” However,
    it is too cumbersome to directly use gold in conventional transactions. In the
    Internet age, obviously gold cannot be used to as a form of payment for online
    transactions. Hence, he proposed a bit gold concept, where the bit gold is represented
    as a bit string. The bit string contains solution to a particular challenge string,
    which is periodically published. A client who wishes to to acquire bit gold would
    have to solve the puzzle by doing proof of work using a one-way function. The
    blog did not seem to explain how exactly to determine the value of a bit string,
    but it appears to be proportional to the work that is done to find the solution
    of the current puzzle. The envisaged bit gold system would depends on two sets
    of services: (1) a secure timestamp service, and (2) a distributed property title
    registry service. Apparently, the trustworthiness of these two services would
    determine the trustworthiness of the bit gold system. The bit gold concept, although
    quite visionary and indeed some of the characteristics of bit gold have passed
    on to Bitcoin, lacks too much details for anyone to implement this proposed system.
    As we will show a little later, Bitcoin provides a much more elegant method to
