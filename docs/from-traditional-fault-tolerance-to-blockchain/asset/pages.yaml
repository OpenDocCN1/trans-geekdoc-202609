    Ethereum uses the account model, the address is explicitly stated in the block
    header instead of as part of the CoinBase transaction like Bitcoin.


    The `stateRoot` is the root hash for the world state as explained earlier. In
    Ethereum, the state under each account is put as the leaf nodes in the tree and
    a hash tree is computed using what is referred to as the Merkle Patricia tree
    (also called trie). This tree is more reflexible that the classical Merkle tree
    and it does not require the tree being balanced. The `txsRoot` (short for `transactionsRoot`)
    is the root hash for the transactions, also organized as a Merkle Patricia tree.
    Similarly, the `receiptsRoot` is the root hash for the transaction receipts.


    As mentioned earlier, it is impossible for a frontend process that issues a transaction
    to communicate with a smart contract directly because the smart contract will
    be executed until the transaction is about to be placed on the blockchain. Ethereum
    solves this issue by providing a logging facility. Hence, the logs are important
    to retrieve informations. Recall that each transaction receipt has a `logsBloom`
    component. The `logsBloom` in the block header is a union (_i.e.,_ by using the
    binary OR operation) of all the `logsBloom` in the receipts of the transactions
    included in this block. This enable anyone to quickly search if the needed events
    are likely to be present in the block.


