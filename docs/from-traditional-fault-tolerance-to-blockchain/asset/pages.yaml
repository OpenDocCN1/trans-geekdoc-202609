  md: 'detecting fail-stop faults is straightforward compared with the challenge of
    detecting application-level faults. This is because many application-level faults
    exhibit symptoms initially only at the application-level, which is not detectable
    by lower-level fault detectors.


    Ideally, application-level faults can be detected by acceptance tests introduced
    in the recovery block approach for software fault tolerance [16]. Unfortunately,
    this approach would put undue burden on application developers to develop effective
    and efficient acceptance test routines. In general, it is regarded as impractical
    to monitor directly application-level functionality of Internet-based applications
    to see if it has deviated from its specification [22] because of their scale,
    complexity, and rapid rate of upgrades. Consequently, [14, 13, 22] propose to
    measure and monitor structural behaviors of an application as a way to detect
    application-level failures without _a priori_ knowledge of the inner workings
    of the application.


    This approach is based on the following insight. In component-based applications,
    each component typically implements a specific application function, _e.g._, a
    stateful session bean may be used to manage a user’s shopping cart and a set of
    singleton session beans are used to keep track of the inventory for each product
    that is on sale. Hence, the interaction patterns between different components
    would reflect the application-level functionality. This internal structural behavior
    then can be monitored to infer whether or not the application is functioning normally.
    To monitor structural behavior, it is necessary to log the runtime path of each
    end-user request, which entails to keeping track all internal events triggered
    by the request, _i.e._, all incoming messages to, and outgoing messages from,
    each component, and all direct interactions between different components (in terms
