    Ethereum follows the Greedy Heaviest Observed Subtree (GHOST) protocol for consensus
    [19]. The issue of allowing a faster confirmation time is a high stale rate, which
    refers to the fact that there will be many forks, i.e., many blocks will be created
    concurrently in each block height and only one can be placed on the main chain.
    Not only this would lead to a lot of waste in computing (and energy consumption),
    the presence of large number of stale blocks would be detrimental to the security
    and stability of the network. Sompolinsky and Zohar proposed to include the entire
    subtree when choosing the main chain. More specifically, the total computation
    of the blocks in the subtree is compared. Effectively, instead of comparing different
    branch chains, GHOST compares different subtrees. This way, all concurrently created
    blocks in the same subtree would contribute to the security of the system. A direct
    consequence of considering the entire subtree is that the new block must not only
    include the hash of the parent block, but the information of the subtree as well,
    which makes the block structure considerably more complex. In Ethereum white paper
    [5], the blocks in the subtree, but not on the main chain are referred to as ommer
    blocks (ommer is a gender-neutral term to mean sibling of parent). In online forums
    as well as the Ethereum source code, the ommer block is referred to as an uncle
    block. An ommer block is in fact a stale block, in that the transactions in the
    block are not confirmed because they are not on the main blockchain. Some online
    forums claimed that ommer blocks are orphan blocks, which is incorrect. An orphan
    block is a block without a parent (temporarily), which could happen when a block
    is arrived ahead of its parent block at a mining node.


