    # 10.3 On Blockchain Throughput


    The throughput limitation on public blockchain is intrinsic because of the PoW
    design. How many transactions the blockchain can handle is limited by the capability
    of creating new blocks per unit of time. In Bitcoin, interval between two blocks
    is targeted at 10 minutes. In Ethereum, the block interval is much shorter at
    12 seconds. If we take the medium transaction size of 275 bytes as we have mentioned
    in Chapter 8, one Bitcoin block could include 3,737 transactions. This would lead
    to a throughput of 6.62 transactions per second, which is fairly close to the
    widely publicized 7-transaction-per-second Bitcoin throughput limitation. Ethereum
    does not impose a hard limit on the block size. Instead, it allows the miner to
    set the maximum gas that can be included in a block provided that the the gas
    limit is within 1/1024 of the gas limit of the previous block. Currently, the
    average gas limit for each block is about 10,000,000 and the minimum transaction
    gas charge is 21,000. That would limit the maximum transactions per block to around
    476. Considering that the block interval is about 12 seconds, the maximum throughput
    for Ethereum is about 39.7 transactions'
  merge: -1
  img_proc: true
- pgno: 430
  md: 'per second. As can be seen, the transaction rates for Bitcoin and Ethereum
    are far below the credit card processing rate, which could reach 47,000 transactions
    per second [34].


    There has been a lot of efforts on increasing the throughput of blockchain. We
    can roughly divide the work into two camps: (1) On-chain approach: those that
    would literally increase the throughput by altering the block size, block interval,
    or even the consensus algorithm, and (2) off-chain approach: those that reduce
    the number of transactions that have to be placed on the blockchain and handle
    most transactions by other means.


    # ## 10.3.1 On-Chain Approach


    This is the most intuitive approach. There are two obvious parameters, block size
    and block interval, can be altered for better throughput. Some also proposed to
    use traditional consensus algorithms such as Paxos or PBFT in small-scale permissioned
    blockchain. Some projects, such as Hyperledger, even offer a pluggable interface
    for users to plug in their own consensus algorithm. Apparently, replacing the
    PoW consensus algorithm with a traditional consensus algorithm is a not viable
    solution for the limited throughput problem in public blockchain. Other than the
    scalability issue with traditional algorithms, they do not guarantee a latency
    bound as many would have expected. While during periods of strong synchrony, which
    is termed as “normal operation,” these algorithm might exhibit excellent latency
    and throughput [15, 82], the algorithm might not be able to terminate during periods
    of strong asynchrony or worse yet, in the presence of cyberattacks. One symptom
    would be continuous view changes. The view change algorithm is typically highly
    complex and expensive [15, 74, 91]. This fact is rarely acknowledged in the proposals
    for adopting traditional consensus algorithm for blockchain operation.


    Increasing the block size is the most intuitive and straightforward way of increasing
    the throughput because the larger the block size the more transactions could be
    confirmed in one block interval. Initially, Bitcoin did not impose a hard limit
    on the block size, and the maximum block size could reach 36MB. Due to a number
    of concerns, in 2010 Nakamoto imposed a 1MB hard limit on Bitcoin block size.
    In 2015, Gavin Andresen proposed the Bitcoin Improvement Proposal (BIP) 101 [9]
    with a plan to increase the block size as the network grows over time. The proposal
    was not'
  merge: -1
  img_proc: true
- pgno: 431
  md: 'adopted by Bitcoin and the status of the BIP shows that it has been withdrawn.
    There are several Bitcoin forks due to this type of disagreements, for example,
    Bitcoin Cash is a fork that imposes an 8MB limit. More stories on the Bitcoin
    block size dispute is available at https://blocksdecoded.com/what-bitcoin-block-size/.


    Another closely related parameter is the block interval, which is the target latency
    for solving the PoW puzzle. Obviously, the shorter the block interval, the higher
    the throughput. Ethereum uses a 12-second target block interval, Litecoin (a Bitcoin
    fork) uses a block interval of 2.5 minutes, and Dogecoin uses a block interval
    of 1 minute.


    The block size and the block interval cannot be arbitrary set because they together
    would determine how likely a fork would happen, i.e., two or more miners concurrently
    discover new blocks at the same block height. While the block interval will directly
    impact the probability of forking because a shorter target block interval would
    mean a lowered difficulty target, a larger block size could also increase the
    likelihood of forking because the transmission latency is proportional to the
    block size, and when it takes longer for a miner to receive a new block from another
    miner, it increases the chance for the miner to keep mining until it finds a solution
    to the puzzle at the same block height.


    Frequent forking could be exploited by adversaries to damage the security of the
    blockchain. Several papers presented the investigation results on the relationship
    between the system security and block generation rate [6, 28, 34]. The intuition
    is that when the block interval is approaching the time it takes for mining nodes
    to share with each other transactions and blocks, the system becomes more vulnerable
    to malicious attacks. A symptom when the block interval is too short is the presence
