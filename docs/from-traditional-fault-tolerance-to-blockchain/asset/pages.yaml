    # ## 4.1.1 Replication Styles


    As we mentioned before, the replicas must be coordinated in some way to ensure
    their consistency. There are a number of different schemes of coordinating the
    replicas. In the literature, we have seen the following replication styles being
    mentioned [36]:


    +   - Active replication. As shown in Figure 4.2, in active replication, every
    replica delivers the requests in the same total order and executes them. Each
    replica plays the same role. Because every non-faulty replica would send a reply
    to the client, the duplicate replies must be filtered out. For active replication,
    it is often assumed that a reliable totally ordered multicast service is available
    to ensure the reliability and total ordering of the requests. To tolerate some
    non-failstop faults at the replicas, it is necessary to perform voting on the
    reply messages sent by the replicas. If less than half of the replicas may exhibit
    non-failstop faults, a majority voting at the client can ensure the delivery of
    the reply sent by a non-faulty replica.


    +   - Passive replication. As shown in Figure 4.3, in passive replication, one
    of the replicas is designated as the primary and the remaining replicas as the
    backups. Only the primary executes the requests. Periodically, the primary transfers
    its state to the backups to bring them up to date. To ensure strong replica consistency,
    it is also necessary for the backups to receive and log incoming requests from
    the client.


