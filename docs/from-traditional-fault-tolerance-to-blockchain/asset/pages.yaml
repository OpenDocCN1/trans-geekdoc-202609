  md: '# 4.2 Data Replication


    Data replication is first studied extensively in the context of transaction processing
    systems [2, 14]. Transactional data replication is different from state-machine
    replication in that a transaction consists of a number of read and/or write operations
    on a set of data items while the granularity of operations in state-machine replication
    is on the replica in its entirety. While on the transaction-level, all transactions
    must be executed in a way that they appear to have been executed sequentially,
    similar to the sequential execution requirement of all requests on the server
    replicas in state-machine replication, the actually read/write operations (that
    may belong to different transactions) on different data items are always carried
    out concurrently. Hence, in transactional data replication, the replication algorithm
    not only has to ensure the consistency of the replicas, but also defines concurrency
    control as well.


    A transactional data replication algorithm should ensure that the replicated data
    appears to the clients as a single copy, in particular, the interleaving of the
    execution of the transactions be equivalent to a sequential execution of those
    transactions on a single copy of the data. Such an execution is often referred
    to as one-copy serializable.


    With data replication, in general, it is desirable to minimize the cost of read
    operations because (read-only) queries are much more prevalent than updates (transactions
    that consist of writes to some data items). We first highlight that it is nontrivial
    to design a sound data replication algorithm by examining two incorrect naive
    replications algorithms: write-all and write-all-available.


    In the write-all data replication algorithm, as shown in Figure 4.5, a read operation
    on a data item x can be mapped to any replica of x and each write operation on
    a data item x would be applied to all replicas of x. As long as the nodes that
    manage the replicas do not fail, this replication algorithm satisfies the one-copy
    serializable requirement. This is because in any execution of a sequence of transaction,
    if a transaction writes to a data item x, it writes into all replicas of x, and
    if another transaction later reads data item x, regardless which replica it reads
    from, it reads the same value written by the most recent transaction that writes
    into x.


