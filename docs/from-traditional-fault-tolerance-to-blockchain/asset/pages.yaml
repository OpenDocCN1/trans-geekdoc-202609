- pgno: 295
  md: 'We assume that the optimal number of replicas n = 3f + 1 are used, and each
    replica is referred to by an index number ranges from 0, 1, ..., up to 3f. One
    of the replicas is designated as the primary, and the remaining ones are backups.
    The primary is responsible to assign a sequence number to each request received
    and initiates a new round of protocol to establish the total ordering of the request
    at all nonfaulty replicas. The sequence number binds a request to its total order
    relative to all other requests. Initially, the replica 0 assumes the primary role.
    When replica 0 is suspected as failed, replica 1 will be elected as the new primary.
    Each primary change is referred to as a view change and each view is identified
    by a view number v (from 0 to 1, and so on). Hence, for a view v, replica p =
    vmodn would serve as the primary for that view.


    The PBFT algorithm works in the following steps:


    +   A client multicasts a request to all server replicas. A request has the form
    <REQUEST, o, t, c>σc, where o is the operation to be executed at the server replica,
    t is a timestamp, c is the identifier of the client, and σc is the client’s digital
    signature for the request. The client must ensure that a later request bears a
    larger timestamp. The timestamp t is used by the replicas to detect duplicates.
    If a duplicate request is detected, the replica would return the logged reply
    to the client instead of reordering them.


    +   The server replicas exchange control messages to establish and agree on the
    total order for the request. The complexity of the PBFT algorithm lies in this
    step.


    +   The server replicas execute the request according to the total order established
    and send the corresponding reply to the client. A replica may have to delay the
    execution of the request until all requests that are ordered ahead of the request
    have been executed.


    +   The client would not accept a reply until it has collected consistent replies
    to its request from f + 1 server replicas. This is to ensure that at least one
    of them comes from a nonfaulty replica. A reply has the form <REPLY, v, t, c,
    i, r>σi, where v is the current view number, t is the timestamp of the corresponding
    request, i is the replica identifier, and r is the application response as the
    result of the execution of the operation o. The client verifies consistency by
    comparing the r component in the reply message.'
  merge: -1
  img_proc: true
- pgno: 296
  md: '# 7.2.3 Normal Operation of PBFT


    During normal operation, i.e., when the primary is not faulty, the server replicas
    can establish and agree on the total order of each request in three phases (referred
    to as pre-prepare, prepare, and commit phases), as shown in Figure 7.4. PBFT also
    requires each replica to log both application messages (requests received and
    reply generated), and control messages that sent during the three phases to achieve
    Byzantine agreement on the total order of messages.


    ![](img/7320b1480d74f1d65f74659cab456782_296_0.png)


    Figure 7.4 Normal operation of the PBFT algorithm.


    During the first phase, i.e., the pre-prepare phase, when the primary receives
    a new request m, it assigns the next available sequence number s to the request
    and multicasts a pre-prepare message to the backups. The pre-prepare message has
    the form <PRE-PREPARE, v, s, d>_sigma_p, where d is the digest for the request
    m.


    A backup verifies a pre-prepare message in the following way before it accepts
    the message:


    +   - The pre-prepare message has a valid digital signature.

    +   - The backup is in view v and it has not accepted a pre-prepare message with
    sequence number s.

    +   - Furthermore, the sequence number is within the expected range bounded by
    a low water mark h and a high water mark H. This is to prevent a faulty primary
    to exhaust the address space of the sequence number (to avoid the sequence number
    wrap-around problem).'
  merge: -1
  img_proc: true
- pgno: 297
  md: 'The backup would need to search its message log for the request associated
    with the pre-prepare message based on the received message digest. If no request
    is found, the backup should ask the primary to retransmit that request. On accepting
    a pre-prepare message, the backup logs the pre-prepare message, creates a prepare
    message, saves a copy of the prepare message in its message log, and starts the
    second phase (i.e., the prepare phase) by multicasting the prepare message to
    all other replicas. The prepare message has the form <PREPARE, v, s, d, i>σi,
    where i is the identifier of the sending backup.


    A replica (the primary or a backup) accepts a prepare message and logs it if the
    message can pass the following checks:


    +   - The prepare message has a valid digital signature.

    +   - The replica is in the same view v as that in the prepare message.

    +   - The sequence number is within the expected range.


    A replica (the primary or the backup) enters the third (i.e., commit) phase by
    sending a commit message when the following condition is met:


    +   - The replica has collected 2f prepare messages from different replicas (including
    the one the replica has sent) and the matching pre-prepare message.


    When this condition is met at replica i, it is said that prepared(m, v, s, i)
    is true. The commit message has the form <COMMIT, v, s, d, i>σi.


    A replica verifies a commit message in the same way as for a prepare message.
    The replica accepts the commit message if the verification is successful and logs
    the message. When a replica i has sent a commit message and has collected 2f +
    1 commit messages (including the one it has sent) that match the pre-prepare message
    from different replicas, it is said that committed-local(m, v, s, i) is true.
    If prepared(m, v, s, i) is true for all replicas i in some set of f + 1 nonfaulty
    replicas, it is said that the predicate committed(m, v, s) is true. A replica
    i proceeds to execute the request m when committed-local(m, v, s, i) becomes true
    and if it has already executed all message ordered before m (i.e., requests that
    are assigned a smaller sequence number than s).


    The PBFT algorithm ensures the following two invariance.'
