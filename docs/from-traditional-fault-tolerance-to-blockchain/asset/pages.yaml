    # 4.3.1 System Models


    In optimistic data replication, we model the system as a set of objects that are
    replicated across N number of nodes, often referred to as sites [25]. The object
    is the smallest unit of replication and each object may define a set of operations
    for its local or remote clients to access the data encapsulated in the object.
    The operations may be as simple as read and write, but may be more sophisticated
    such as those defined using SQL [29].


    The replicas are not necessarily equal in terms of update privileges. Some nodes
    might be designated as the master sites that have the privilege to update the
    replicas they manage, while others are restricted to allow read-only access for
    their clients. The most common configurations are:


    +   Single-master replication. Only a single node is granted the update privilege.
    All update operations must go through this single master site. The updates will
    be propagated to other replicas asynchronously.


    +   Multi-master replication. Every node is granted the update privilege. The
    updates then will be propagated from one replica to all other replicas. This is
    the most common configuration for optimistic data replication because it offers
    the highest data availability and convenience for the users. However, as a tradeoff,
    we must tackle the challenges of scheduling, conflict resolution, and commitment
    issues, to be explained shortly. Unless stated otherwise, we assume that multi-master
