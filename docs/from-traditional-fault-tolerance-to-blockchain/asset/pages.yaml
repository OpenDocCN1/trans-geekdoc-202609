    generals is $3f + 1$.


    # 7.1.2 The Oral Message Algorithms


    A solution to the Byzantine generals problem is the Oral Message algorithms [26].
    The oral message algorithms are defined inductively. The solution starts by running
    an instance of the Oral Message algorithms $OM(f)$ with $n$ generals, where $f$
    is the number of traitors tolerated, and $n \ge 3f + 1$. One of the generals is
    designated as the commander and the remaining generals are lieutenants. Each general
    is assigned an integer id, with the commander assigned 0, and the lieutenants
    assigned $1,...,n-1$, respectively.


    $OM(f)$ would trigger $n-1$ instances of the $OM(f-1)$ algorithm (one per lieutenant),
    and each instance of the $OM(f-1)$ algorithm involves $n-1$ generals (i.e., all
    the lieutenants). Each instance of $OM(f-1)$ would in turn triggers $n-2$ instances
    of the $OM(f-2)$ algorithm (each involves $n-2$ generals), until the base case
    $OM(0)$ is reached (each $OM(0)$ instance involves $n-f$ generals).


    Because of the recursive nature of the Oral Message algorithms, a lieutenant for
    $OM(f)$ would serve as the commander for $OM(f-1)$, and so on. Each lieutenant
    $i$ uses a scalar variable $v_i$ to store the decision value received from the
    commander, where $i$ is an integer ranges from $1$ to $n-1$. Furthermore, a lieutenant
    also uses a variable $v_j$ to store the value received from lieutenant $j$ ($j
    \neq i$).


    # Algorithm $OM(0)$:


    +   1. The commander multicasts a message containing a decision (for wider applicability
    of the solution, the decision could be any value) to all the lieutenants in the
    current instance of the algorithm.

    +   2. For each $i$, lieutenant $i$ set $v_i$ to the value received from the commander.
