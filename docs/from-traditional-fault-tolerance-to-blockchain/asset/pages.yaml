    to define the range of sequence numbers that may be accepted. The low watermark
    h is set to the sequence number of the most recent stable checkpoint. The range
    of acceptable sequence numbers is specified in a constant k so that the high watermark
    H = h + k. As suggested in [5], k is often set to be 2c (twice the checkpoint
