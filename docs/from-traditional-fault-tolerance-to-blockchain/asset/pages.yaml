- pgno: 134
  md: '# 4


    # Data and Service Replication


    Different from checkpointing/logging and recovery-oriented computing, which focus
    on the recovery of an application should a fault occur, the replication technique
    offers another way of achieving high availability of a distributed service by
    masking various hardware and software faults. The goal of the replication technique
    is to extend the mean time to failure of a distributed service. As the name suggests,
    the replication technique resorts to the use of space redundancy, i.e., instead
    of running a single copy of the service, multiple copies are deployed across a
    group of physical nodes for fault isolation. For replication to work (i.e., to
    be able to mask individual faults), it is important to ensure that faults occur
    independently at different replicas.


    The most well-known approach to service replication is state-machine replication
    [26]. In this approach, each replica is modeled as a state machine that consists
    of a set of state variables and a set of interfaces accessible by the clients
    that operate on the state variables deterministically. With the presence of multiple
    copies of the state machine, the issue of consistency among the replicas becomes'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'important. It is apparent that the access to the replicas must be coordinated
    by a replication algorithm so that they remain consistent at the end of each operation.
    More specifically, a replication algorithm must ensure that a client’s request
    (that invokes on one of the interfaces defined by the state machine) reaches all
    non-faulty replicas, and all non-faulty replicas must deliver the requests (that
    potentially come from different clients) in exactly the same total order. It is
    important that the execution of a client’s request is deterministic, i.e., given
    the same request, the same response will be generated at all non-faulty replicas.
