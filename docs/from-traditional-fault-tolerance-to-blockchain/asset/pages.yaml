    # 5.3.4 The Flow Control Mechanism


    The objective of the flow control mechanism is to ensure that the transmission
    rate of broadcasting messages in the system does not exceed the rate at which
    the slowest node delivers the messages. To achieve this objective, Totem uses
    a windows based control'
  merge: -1
  img_proc: true
- pgno: 222
  md: 'mechanism resembles that used in TCP. The window size restricts the maximum
    number of messages that may be transmitted in one token rotation, which determines
    the rate of transmission of broadcasting messages. The windows size is initially
    determined heuristically and dynamically adjusted.


    The flow control mechanism introduces two additional fields in the regular token:


    +   - total_retrans_round: This field denotes the total number of messages retransmitted
    during the last token rotation. The total number of messages transmitted (i.e.,
    new messages plus retransmitted messages) during the last token rotation, referred
    to as fcc, can be calculated by summing up total_retrans_round and the difference
    in the seq field of the current token and the value in the last token visit.


    +   - total_backlog_round: This field denotes the sum of the number of messages
    waiting to be transmitted by each node when the token visits during the last token
    rotation on the logical ring.


    Each node maintains the following local variables for flow control:


    +   - windows_size: It defines the maximum number of messages that the nodes in
    the logical ring can broadcast during a token rotation (including both new messages
    and retransmitted messages).


    +   - max_msgs: It defines the maximum number of messages that any single node
    can broadcast for each token visit (including both new messages and retransmitted
    messages).


    +   - my_trc: It is short for my this rotation count. The variable denotes the
    number of messages the node may send during the current token visit.


    +   - my_pbl: It is short for my previous backlog. The variable denotes the number
    of new messages waiting to be transmitted (i.e., the size of the new_msg_queue)
    during the last token visit.


    +   - my_tbl: It is short for my this backlog. The variable denotes the number
    of new message waiting to be transmitted during the current token visit.'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'The flow control mechanism limits how many messages that a node can send during
    the current token visit (i.e., my_trc) in the following way:


    +   - my_trc <= max_msgs: The number of messages cannot exceed the predefined
    limit imposed by max_msgs for any single node. This is to prevent any single node
    from exhausting the quota for each token rotation.

    +   - my_trc <= windows_size - fcc: The number of messages cannot exceed the remaining
    quota for this token rotation.

    +   - my_trc <= window_size x my_tbl/(total_backlog_round + my_tbl - my_pbl):
    This is to ensure a node does not send more messages than its fair share [9].


    The window size is dynamically adjusted in the following way:


    +   - If token.total_retrans_round = 0 and fcc >= window_size/2, it implies we
    might have more room to send, hence, we increment the window size by 1, i.e.,
    window_size = window_size + 1.

    +   - If token.total_retrans_round = R is greater than 0, it means that the nodes
    sent R too many messages during the last token rotation, hence, the window size
    should be reduced by R, i.e., window_size = window_size - token.total_retrans_round.

    +   - For practicality, we want to send a minimum number of messages during each
    token rotation, window_size_min, hence, if window_size < window_size_min, we set
    window_size to window_size_min.


    # 5.4 Vector Clock Based Group Communication System


    Using a vector clock at each node in the system can track the causal relationship
    between different messages accurately [16]. As such, vector clocks have been used
    to achieve causal ordering in group communication system such as Isis [6]. The
    causal ordering protocol in Isis is referred to as CBAST. Similar to previous
    sections, we assume the system forms a single broadcast domain (i.e., we do not
    consider the multiple process group case as in [6]). The total ordering service
    is provided in Isis by using a sequencer based protocol similar to what is described
    in Section 5.2.'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'In CBAST, a node \(N_i\) maintains a \(N\)-element vector clock, \(VT(N_i)\),
    where each element is indexed by the node identifier (from 0 to \(N - 1\)). Initially,
    all elements of \(VT(N_i)\) are set to 0. The rule for broadcasting a message
    using the vector clock is defined below:


    +   When a node \(N_i\) broadcasts a message \(m\), it increments the \(i\)-th
    element of its vector clock, i.e., \(VT(N_i)[i] = VT(N_i)[i] + 1\), and piggyback
    a vector timestamp, referred to as \(VT(m)\), using the current value of \(VT(N_i)\)
    with \(m\).


    This rule ensures that given two broadcast events \(broadcast(m)\) and \(broadcast(m'')\),
    \(broadcast(m)\) happens before \(broadcast(m'')\), if and only if \(VT(m) < VT(m'')\),
    i.e., vector timestamps can be used to capture causality precisely. It is straightforward
    to compare two vector timestamps:


    +   \(VT(m) \le VT(m'')\) if and only if for any \(i\): \(VT(m)[i] \le VT(m'')[i]\)


    +   \(VT(m) < VT(m'')\) if \(VT(m) \le VT(m'')\) and there exists an \(i\) such
    that \(VT(m)[i] < VT(m'')[i]\)


    On receiving the message \(m\) broadcast by \(N_i\) containing a vector timestamp
    \(VT(m)\), node \(N_j \neq N_i\) can deliver the message provided the following
    condition is met:


    +   1. \(VT(m)[i] = VT(N_j)[i] + 1\)


    +   2. For any \(k \neq i\): \(VT(m)[k] \le VT(N_j)[k]\)


    The first condition means that node \(N_j\) has received all messages previously
    sent by node \(N_i\). The second condition means that node \(N_j\) has delivered
    all messages that node \(N_i\) has delivered. Note that a node does not update
    its vector clock until it is ready to deliver a message (i.e., it does not update
    its vector clock as soon as it receives a message). When a node \(N_j\) delivers
    the message \(m\) from \(N_i\) containing \(VT(m)\), it updates its vector clock
    in the following way:


    +   For any \(k\) in \([0, ..., N - 1]\): \(VT(N_j)[k] = max(VT(N_j)[k], VT(m)[k])\).


    The above rules ensure that all messages broadcast are delivered in causal order.
    For reliability, positive or negative feedbacks can be used to facilitate the
    retransmission of lost messages. Note that a node would block indefinitely if
    a lost message is not retransmitted.'
  merge: -1
  img_proc: true
