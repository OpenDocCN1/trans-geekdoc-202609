    the users of the application to interact with the application via a graphic user
    interface. Sometimes, the Web server, which interacts with the client software
    directly and is stateless, is regarded as part of the presentation tier.


    When an application server fails, only the session state is lost, which would
    impact the users of the active sessions this particular server was engaged in.
    To minimize the negative impact of a failed application server even further, the
    session state can be separated to a dedicated session state store, as did in [11].
    The recovery-oriented computing techniques would work best for applications using
    the three-tier architecture. This is especially the case for employing the microrebooting
    technique because the architecture enables the rebooting of components of an application
    server with minimum impact to the system performance and availability.


    As indicated in Figure 3.1, an application using the three-tier architecture is
    usually implemented using some middleware platform. The dominating platform for
    Internet-based applications is the Java Platform, Enterprise Edition (Java EE).
    Java EE facilitates component-based software development. A key component construct
    is the Enterprise Java Bean (EJB). An EJB implements a specific business function.
    Java EE also enables the separation of mechanisms and policies [32]. Mechanisms
    in accomplishing application logic are programmed in EJBs, while the policies
    on how they are used are specified in terms of Java annotations and/or descriptor
    files at deployment time.


    Java EE is still an evolving middleware platform. At the time when several of
    the seminal works in recovery-oriented computing [13, 22, 11] were published,
    the platform was referred to as J2EE and it was selected as the middleware platform
