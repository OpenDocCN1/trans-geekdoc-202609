    imposes a logical ring structure on the nodes in the membership and each node
    takes turn to serve in a privileged role. The difference between the two approaches
    is that in the rotating sequencer based approach, when a node becomes privileged,
    it determines the total order of a broadcast message and sends a sequencing message,
    while in the sender based approach, when a node becomes privileged, it is allowed
