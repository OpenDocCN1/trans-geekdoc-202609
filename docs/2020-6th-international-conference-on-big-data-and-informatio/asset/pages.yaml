    **Abstract**—Epilepsy treatment outcome prediction is valued for the treatment
    of children with tuberous sclerosis complex. In this paper, three common feature
    selection methods and machine learning models are used to predict drug treatment
    outcomes with multimodality data in children with tuberous sclerosis. The analysis
    of variable F regression with confidence interval of 0.812 (±0.005), shows the
    feasibility of using machine learning to predict the outcomes of drug treatments.
    Furthermore, the effectiveness of the methods in the feature analysis is maintained
    across different lesion quantity, location, and type. Our analysis results show
    that among them, lesion type is the most important factor in predicting drug treatment
    outcome.


    **Index Terms**—machine learning, multi-modality, outcome prediction, tuberous
    sclerosis complex


    Tuberous sclerosis complex (TSC) is an autosomal dominant disorder caused by mutations
    in the TSC1 or TSC2 genes [1], and is associated with the formation of hamartomas


    organs including the heart, brain, kidney, liver, and lungs [2]. Epilepsy occurs
    in 80%-90% of TSC patients, and almost two-thirds of them have their first seizure
    onset in the first year of life [3]. Many manifestations of TSC symptoms affect
    the quality of life. Epilepsy is one of the most severe. The main treatment for
    epilepsy is antiepileptic drugs (AEDs) [4]. However, most of the epileptic patients
    have an increased risk of mortality [4], which may take a long time to identify
    the seizures as drug-resistant. It is important to identify early which patients
    are resistant to the AEDs.


    An et al. [4] predicts drug-resistant epileptic patients at the time of first
    AED prescription, and achieved an area under curve of random forest. They work
    mainly on general epilepsy. However, epilepsy caused by TSC is different. It has
    many more imaging manifestations. In this study, we are mainly aimed at demonstrating
    the feasibility of predicting drug treatment outcomes caused by TSC.


    In this study, we compare 3 feature selection methods and 6 machine learning models
    predicting epilepsy drug treatment outcomes in TSC. The feature selection methods
    and machine learning models are the most common


