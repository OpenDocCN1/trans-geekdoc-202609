    # III. EXPERIMENT SETUP


    # A. Feature selection and models


    There are many features for feature selection, which is very important in the
    learning process, but we do not know which one is the best choice. So several
    methods were used, and were combined with models in pairs. The combination was
    evaluated and compared as a whole.


