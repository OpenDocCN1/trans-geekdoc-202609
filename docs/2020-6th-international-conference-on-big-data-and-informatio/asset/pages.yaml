    Fig. 1. The modality distribution of the 155 features.


    The target is drug treatment outcome, which was classified into two categories:
    controlled and uncontrolled.


    Specifically, analysis of variance (ANOVA) F-values, Chi-squared statistics, and
    mutual information were used for feature selection. In detail, the F-values, Chi-squared,
    and mutual information of the features are calculated. Then, the features are
    sorted by the calculated values in a descending order. The top k features are
    selected. For each of the three methods, k is a parameter that needs to be chosen.
    For comparison, there were three settings, with $k = 20, 35, 50$. For comparison,
    a baseline method that selects all features was set up.


