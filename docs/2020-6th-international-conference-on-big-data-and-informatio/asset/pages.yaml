    # B. Data selection


    All the data were from Shenzhen Children''s Hospital, and written consent was
    obtained from all subjects prior to study. The protocols were approved by the
    Institutional Review Board (ARB) of Shenzhen Institutes of Advanced Technology,
    Chinese Science. The data contained 103 patients with TSC. The ages of the children
    when they visited the hospital were between 50 days and 16 years, with a median
    of 3 years. All patients had epilepsy, and one had had resection surgery.


    The patients were confirmed with TSC, but not every patient had epilepsy. The
    patients with epilepsy were removed from the data.


    Data, date of birth, and other features that are personal information or irrelevant
    to the task used. The drug-resistance experience, which was not available at the
    first visit to the doctor, and the target value, epilepsy treatment outcome were
    also removed.


    The multi-modality data included clinical data, TSC1 and CT2 test results, magnetic
    resonance imaging (MRI), computerized tomography (CT), and electroencephalography
    (EEG). The clinical data were manually extracted from medical history data, including
    patient name, age, sex, the existence of several typical types of TSC, and examination
    results. The features of MRI, CT and EEG were also manually extracted. For MRI,
    the lesions were located and classified by type. For CT data, the subcortical
    lesions were classified by size. For EEG, the discharge features were recorded.
    In total, each patient has 155 features and 1 target. The pie chart in Fig. 1
    shows the modality distribution of the 155 features.


    There are two types of missing values in the data: the first is for example, number
    of lesions omitted if it is zero. The second is when value was unknown or the
    patient did not go the examination. For example, the CT-related features of the
    first type, they were simply filled with median. In the second type, the age of
    the first seizure were filled with median, and other missing values were filled
    with zero.


    # C. Normalization


    Before normalization, certain features such as the existence of epilepsy (all
    true) and the type of lesions that has no patent (all zero) were removed. All
    features were normalized to the range 0 and 1, using Eq. 1.


