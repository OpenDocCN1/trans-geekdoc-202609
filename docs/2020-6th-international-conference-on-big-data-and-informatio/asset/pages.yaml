    # V. CONCLUSIONS


    In sum, we evaluated common feature selection methods and 6 common machine learning
    methods for multi-modality TSC treatment outcome data. Using ANOVA F value and
    MLP achieved the best AUC (95% CI) performance of 0.82 (±0.005). It shows that
    it is feasible to use machine learning to predict the outcomes of drug treatments.
    Then, the effectiveness of quantity, location, and type information of MRI were
    evaluated, and we conclude that type information is the most important, followed
    by location information and quantity information. In the future, more features
    and models will be considered as case.


