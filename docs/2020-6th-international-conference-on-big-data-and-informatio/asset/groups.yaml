    ## III. 实验


    ### A. 特征选择与模型


    受者工作特征曲线 (ROC) 是一种说明二分类系统性能的图表。它通过在不同阈值设置下绘制真阳性率（敏感性）相对于假阳性率（1-特异性）来创建。曲线下面积 (AUC)
    提供了分类器整体性能的衡量。AUC 1.0 表示完美分类器，而 AUC 0.5 表示性能优于随机猜测的分类器。


    在研究中，我们使用了几种特征选择方法，包括：

    - 随机森林

    - 递归特征消除

    - 信息增益


    使用的机器学习模型为：

    - 支持向量机 (SVM)

    - 随机森林

    - 神经网络

    - 决策树

    - 逻辑回归

    - 梯度提升


    实验结果使用 10 折交叉验证进行评估。每个模型的性能通过 AUC 和 95% 置信区间进行测量。


