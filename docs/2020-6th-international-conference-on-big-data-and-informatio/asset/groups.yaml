    The receiver operating characteristic (ROC) is a graphical plot that illustrates
    the performance of a binary classifier system. It is created by plotting the true
    positive rate (sensitivity) against the false positive rate (1-specificity) at
    various threshold settings. The area under the curve (AUC) provides a measure
    of the overall performance of the classifier. An AUC of 1.0 indicates a perfect
    classifier, while an AUC of 0.5 indicates a classifier that performs no better
    than random guessing.


    In this study, we used several feature selection methods, including:

    - Random Forest

    - Recursive Feature Elimination

    - Information Gain


    The machine learning models used were:

    - Support Vector Machine (SVM)

    - Random Forest

    - Neural Network

    - Decision Tree--

    - Logistic Regression

    - Gradient Boosting


    The results of the experiments were evaluated using 10-fold cross-validation.
    The performance of each model was measured using the AUC and 95% confidence intervals.


