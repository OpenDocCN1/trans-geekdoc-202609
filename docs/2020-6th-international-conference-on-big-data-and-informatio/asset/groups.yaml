    所有数据均来自深圳儿童医院，研究前已获得所有受试者的书面同意。方案已获得中国科学院先进研究院审查委员会 (ARB) 的批准。数据包含103 名 TSC 患者。儿童就诊时的年龄在
    50 天到 16 岁之间，中位数为 3 岁。所有患者均患有癫痫，其中一人接受过切除手术。


    患者确诊为 TSC，但并非所有患者都有癫痫。癫痫患者已从数据中移除。


