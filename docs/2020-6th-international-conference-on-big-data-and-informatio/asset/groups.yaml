    ## V. 结论


    总而言之，我们针对多模态 TSC（结核性硬化）治疗结果数据评估了常用的特征选择方法和 6 种常用的机器学习方法。使用 ANOVA F 值和 MLP 达到了最佳
    AUC (95% CI)性能，结果为 0.82 (±0.005)。这表明使用机器学习来预测药物治疗结果是可行的。随后，我们评估了 MRI 数量、位置和类型信息的有效性，得出结论：类型信息最重要，其次是位置信息和数量信息。未来将根据情况考虑更多的特征和模型。


