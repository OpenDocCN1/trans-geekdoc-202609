    **摘要**—结节性硬化症儿童的癫痫治疗结果预测具有重要价值。在本文中，使用了三种常用的特征选择方法和机器学习模型，利用多模态数据预测结节性硬化症儿童的药物治疗结果。变量
    F 回归分析的置信区间为 0.812 (±0.005)，显示了使用机器学习预测药物治疗结果的可行性。此外，这些方法在特征分析中的有效性在不同的病变数量、位置和类型下均能保持稳定。我们的分析结果显示，其中，病变类型是预测药物治疗结果最重要的因素。


    **索引术**—机器学习，多模态，结果预测，结节性硬化症


    结节性硬化症 (TSC) 是一种由 TSC1 或 TSC2 基因突变引起的常染色体体显性遗传病 [1]，与心脏、大脑、肾脏、肝和肺等器官瘤的形成有关 [2]。80%-90%
    的 TSC 患者发生癫痫，其中几乎三分之二的人在出生后第一年发生首次大发作 [3]。TSC 症状的许多表现影响了生活质量，其中癫痫是最严重的之一。癫痫的主要治疗药物是抗癫痫药物
    (AEDs) [4]。然而，大多数癫痫患者的死亡风险增加 [4]，识别发作是否具有耐药性可能需要很长时间。及早识别哪些患者对 AEDs 不敏感非常重要。


    An 等人 [4] 在第一次开具抗癫痫药物时预测耐药性癫痫患者，并实现了随机森林的曲线下面积（AUC）。他们主要针对普通癫痫。然而，TSC 引起的癫痫不同，它具有更多的影像表现。在本研究中，我们主要旨在证明预测
    TSC 引起的药物治疗结果的可行性。


    在研究中，我们比较了 3 种特征选择方法和 6 种预测 TSC 癫痫药物治疗结果的机器学习模型。这些方法和模型都是机器学习领域中最常用的。结果显示，最佳模型实现的
    AUC (95% 置信区间 [CI]) 为 0.812 (±0.005)，证明了使用机器学习预测治疗结果的可行性。根据临床经验，磁共振成像（MRI）特征对预测结果很有用。因此，我们从数量、位置和类型三个重要维度评估了这些特征的有效性。我们的结果发现，其中，病变类型在结果预测中最重要。


    受控是指特征数量减少到少于至少一年观察时间的一半。未受控定义为相反。


