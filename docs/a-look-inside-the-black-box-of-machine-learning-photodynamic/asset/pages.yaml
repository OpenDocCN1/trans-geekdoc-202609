    # 1. INTRODUCTION


    Photochemistry is appealing because it harnesses renewable solar energy to synthesize
    chemical products⁴ and fuels⁵⁻⁸ under mild conditions with a high atomic conversion
    efficiency. Photochemical reactions occur via radiationless processes on an ultrashort
    time scale (10⁻¹⁵−10⁻¹² s). The mechanism studies rely on time-resolved experiments
    (i.e., attochemistry⁹) to probe the excited-state molecular vibrations and electronic
    structures. Comprehensive investigations are complemented with computational modeling
    to disentangle the elusive spectroscopic features and identify the critical excited-state
    structures. Quantum-chemical (QC) calculations for excited-state electronic structures
    are often costly. Therefore, machine learning (ML) techniques have been introduced
    to accelerate the calculations.


    ML models learn the relationship between molecular structures and associated properties
    (e.g., energies, ¹⁰⁻¹³ transition dipole moments, ¹⁰⁻¹³ and oscillator strengths¹⁴,¹⁵)
    from a large QC data set. The applications have succeeded in the discovery of
    new molecules¹⁶ and materials,¹⁷ predicting reaction barriers,¹⁸ finding transition
    states,¹⁹,²⁰ solving the Schrödinger equation,²¹,²² modeling wave functions,²³,²⁴
    optimizing density functionals,²⁵,²⁶ computing IR spectra,²⁷ UV−vis spectra,¹¹,¹³
    and NMR spectra,²⁸ and simulating excited-state dynamics¹²,²⁹ and complex photochemical
    reactions.¹⁻³ The energy prediction achieves chemical accuracy (1 kcal·mol⁻¹),
    which is required for realistic chemical prediction and comparison with experiments.


    costs are negligible compared with the same-level QC calculation.¹²,²⁹ Thus, many
    studies have used ML potentials as a prominent accelerator for nonadiabatic molecular
    dynamics (NAMD) simulations, for instance, multiconfigurational time-dependent
    Hartree (MCTDH)³⁰ and trajectory surface hopping (TSH)³¹ calculations. Several
    groups have developed ML mixed quantum–classical NAMD approaches (called ML photodynamics
    in this Account), such as MLAtom³² with Newton-X³³ and SchNarc³⁴ with SHARC.³⁵
    To study photochemical cycloaddition and electrocyclic reactions, our group developed
    the Python Rapid Artificial Intelligence Ab Initio Molecular Dynamics (PyRAI²MD)
    code.¹


    Training ML potentials is a challenging task. First, generating high-quality machine-learnable
    QC data requires expertise in computational chemistry and ML. The training data
    generation protocol often inherits human biases that require specific steps to
    remove. Second, the rapid development of ML models has made comparing the efficiencies
    and performances of these models rather challenging.³⁶ We begin with an overview
    of the fundamental background for ML photodynamics. We will then provide a short
    tutorial on building ML potentials and discuss the applications in our recent
    publications. Finally, we will summarize our findings and outlook on future method
    development.


    # 2. THE ML PHOTODYNAMICS APPROACH


    ML photodynamics methods generally contain three key components (Figure 1): the
    QC data set, the ML potential, and NAM D.


    # 2.1. Quantum-Chemical Data Set for Training


    Single-reference methods (e.g., time-dependent density functional theory) are
    used to compute vertical excitation energies with an errors ranging from 0.3 to
    0.5 eV.³⁷ However, they fail when there is strong coupling between electronic
    states (e.g., avoided crossings or conical intersections) because it violates
    the Born–Oppenheimer approximation. Single-reference methods may also predict
    incorrect branching-plane dimensionality at these crossing regions.³⁸,³⁹ Multiconfigurational
    self-consistent field (MCSCF) methods, such as complete active space self-consistent
    field (CASSCF), are more suitable for describing the electronic structures near
    the crossing regions. The term CASSCF(m,n) refers to an active space of m electrons
    and n orbitals. The CASSCF wave function is often limited to an active space of
    22 electrons and 22 orbitals with modern quantum-chemical software.⁴⁰ The selection
    of active orbitals is not trivial. Active spaces that are too small may cause
    high-lying state(s) to become relatively low-lying along the reaction coordinate,
    known as intruder state(s). Accounting for electron correlation significantly
    improves the energies, which can approach the experimental energies.'
