    # 3. TRAINING ML PHOTODYNAMICS MODELS


    # 3.1. Building an ML Potential


    We first determine an appropriate number of electronic states to construct an
    ML potential. It is recommended to first compute the absorption spectrum and compare
    with available experimental results to assess relevant states in the excitation
    (Figure 2a). The reaction coordinate diagram is also useful to characterize the
    selected states along with a possible reaction path (Figure 2b). A more rigorous
    justification requires analyzing the state populations during QC-NAMD simulations
    (Figure 2c). Because the model in Figure 2 shows a separate S₁ and higher states
    in the absorption spectrum and reaction diagram and the state population transfer
    mainly involves the S₁ and S₀ states, we can build an ML potential to learn the
    S₀ and S₁ energies and forces, which reduces the dataset size and training noise.


    Training an ML potential minimizes a mean-square-error loss function using gradient
    descent methods.^81 We split the training data into two parts (e.g., 9:1). The
    first part is used to train the model; the other part is for test or validation.
    The kernel methods and NNs may contain hyperparameters that need additional optimization,
    which can be done with grid search and random grid search.^82 With a limited amount
    of training data, k-fold cross-validation is an effective approach for hyperparameter
    optimization.^83 NN potentials are prone to overfitting, where the model fits
    the training data and noise generally leads to predictive failure outside the
    training set. Thus, we recommend overfitting prevention (e.g., early


    # 3.2. Initial Set Sampling


    Initial set sampling provides a baseline for learning the PESs. Structural sampling
    has been done in thermal reactions with MD-based methods (umbrella sampling,^85
    trajectory-guided sampling,^86 enhanced sampling,^87 and metadynamics^88), stochastic
    surface walk,^89 Wigner sampling,^90 and normal mode scans.^71,91 However, these
    techniques have limited efficacy for complex photochemical reactions. For instance,
    Wigner sampling for reactant or product geometries captures only accessible nonequilibrium
    geometries near local or global minima. Normal mode scans include many irrelevant
    molecular vibrations; ground-state MD simulations access different mechanistic
    pathways from excited-state processes. Excited-state MD becomes prohibitively
    expensive as the number of degrees of freedom increases. We recently reported
    a composite scheme that combines Wigner sampling and geometrical interpolation
    to generate a compact yet relevant initial set (Figure 3).


    Wigner sampling is commonly used to generate initial conditions for photodynamics
    and absorption spectra.^92 Learning the Wigner-sampled reactants helps reduce
    the undersampling of structures near the Franck–Condon (FC) region. Geometrical
    interpolation complements structural correlations between the reactants and products
    in the dataset. We use geodesic interpolation^93 to generate intermediate structures
    between the optimized reactant, product, and minimum-energy crossing point (MECP)
    geometries. We combine the Wigner-sampled geometrical displacements of reactants
    with the interpolated structures to broaden the sampled space (Figure 3). For
    sampling structures of larger systems in a complex environment, Wigner sampling
    needs to be combined with multiscale MD simulations to sample the environment.^94


    We train five models to demonstrate the effect of Wigner sampling and geometrical
    interpolation. Each model consists of two independently trained NNs. The hyperparameters
    and training results are available in the Supporting Information.'
