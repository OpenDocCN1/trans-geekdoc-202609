    # 3.3. Active Learning


    Active learning, which searches undersampled structures in the initial set, was
    initially introduced by Behler95 for ground-state MD simulations and then adapted
    for excited-state PESs by Marquetand and co-workers.71 Active learning uses a
    similarity measure to determine the uncertainty of predicted molecular properties
    during MD simulations. Kernel-based methods (e.g., Gaussian process regression)
    may provide the covariance of the predictions as an estimate of the prediction
    uncertainty. However, the NN potential needs a committee model of at least two
    independently trained NNs to evaluate uncertainties. The ML potential is first
    trained with the initial set and propagates an ensemble of trajectories to search
    undersampled structures. These trajectories are terminated if the predicted energies,
    forces, NACs, and SOCs of the current structures exceed predefined thresholds
    (e.g., 0.043 hartree and 0.25 hartree·bohr−1 for energy and force, respectively).1,2
    The


    uncertain structures are recomputed with QC calculations and added to retrain
    the ML potential. Our recent ML photodynamics simulations for octamethyl-[3]-ladderdiene
    (A) showed substantial efficacy of active learning in the automatic discovery
    of new reaction pathways.2 The initial training set contained only 4321 structures
    sampled from the interpolated reaction coordinate diagram for the [2 + 2] cycloaddition.
    The active learning propagated 125 trajectories from the S1 state in 1 ps (0.5
    fs time step). It completed in 51 iterations and found 4982 new structures from
    the σC–C cleavage and electrocyclic ring-opening pathways with five predicted
    intermediates or products (Figure 5a). In Figure 5b, we have plotted the number
    of collected structures and their distributions to visualize the learning progress
    in the reaction space. In the first three iterations, the trajectories searched
    around the FC region (A, r > 2.0 Å, d < 2.0 Å, and c < 2.0 Å). A broader exploration
    began at iteration 7 that learned the electrocyclic ring-opening pathways to D
    and E (r > 2.0 Å, d > 2.0 Å, and c < 2.0 Å), and the σC–C cleavage pathways to
    C (r > 2.0 Å, d < 2.0 Å, and c > 2.0 Å). The undersampled structures in the electrocyclic
    ring-opening pathway gradually decreased to a plateau at iterations 36–40. After
    that, the trajectories detected a new pathway toward F (r > 2.0 Å, d > 3.2 Å,
    and c < 2.0 Å).


