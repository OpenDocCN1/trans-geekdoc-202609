    # 2.2. Machine Learning Potentials


    Kernel methods and neural networks (NNs) are the two most common methods to train
    ML potentials. Various examples are high-dimensional neural network potential
    (HDNNP), SchNet, PhysNet, ANI, deep potential smooth edition (DeepPot-SE), gradient-domain
    machine learning (GDML), kernel ridge regression using RE descriptor and the Gaussian
    kernel (KREG), reproducing kernel Hilbert space (RKHS), and Gaussian approximation
    potential (GAP). Some packages of a collection of ML methods are MLatom and fast
    learning of atomic rare events (FLARE). A comparison of NN and kernel methods
    shows rather similar accuracies for ML photodynamics simulations. We refer readers
    to refs 12 and 32 for more information about the method benchmarks. Our following
    discussion will focus on the most basic architecture of NNs based on fully connected
    feed-forward multilayer perceptrons.


    ML potentials predict molecular properties using a numerical representation of
    the 3D molecular structure. Global descriptors contain complete molecular structural
    information, such as the so-called Coulomb matrix and inverse distance matrix.
    They are translation- and rotation-invariant and thus can distinguish molecular
    structures in arbitrary orientations and positions. However, global descriptors
    are not invariant to permuted chemically equivalent atoms. Specialized techniques
    (e.g., bag of bonds, randomly sorted Coulomb matrices, and permutation invariant
    polynomials) are introduced to enforce permutation invariance in global descriptors.
    However,


    these techniques may apply only to small molecules and result in discontinuous
    potential energy surfaces (PESs). On the other hand, local descriptors describe
    atomistic environments with a set of basis functions that are permutation invariant.
    However, they may introduce system-dependent hyperparameters (e.g., shape and
    size of the basis functions). Some examples are atom-centered symmetry functions
    (ACSFs), smooth overlap of atomic positions (SOAP), and Faber–Christensen–Huang–Lilienfeld
    (FCHL). In addition, Pozdnyakov and co-workers suggested that the inclusion of
    higher-order terms in descriptors is essential to further improve the model accuracy.
    The ML potentials are often trained for a specific molecule in ML photodynamics.
    Thus, we implemented global descriptors (e.g., inverse distance matrix) in PyRAI²MD
    for simplicity. We enable more efficient training through a data augmentation
    approach (see section 3.4).


    Many databases, such as GDB-13 and GDB-17 and their subsets QM7, QM7b, QM8, and
    QM9 as well as the VERDE materials database, are designed to learn molecular properties
    at equilibrium geometries. However, ML photodynamics relies on a more specialized
    dataset that contains the molecular properties at different geometries for a given
    molecule. Active learning is an efficient and practical strategy for this task.
    It allows models to sample undersampled data resembling an automatic reaction
    exploration. We will discuss the initial set generation in section 3.2 and active
    learning in section 3.3.


    # 2.3. Nonadiabatic Molecular Dynamics


    The ML photodynamics approach is based on mixed quantum–classical NAMD using TSH
    methods, such as Tully’s fewest switches surface hopping (FSSH). It computes the
    hopping probability between two states of the same spin multiplicity with the
    nonadiabatic couplings (NACs) and spin–orbit couplings (SOCs) for different spin
    multiplicities. It is more challenging to predict NACs than SOCs because NACs
    are vector properties. Marquet and co-workers suggested that fitting numerator
    components of NACs to the first-order-derivative of a virtual potential avoids
    the discontinuous data near state crossings. Recent work by our group and the
    Gómez-Bombarelli group showed that the NNs tend to underestimate NACs with increasing
    atom count because of the unavailability of training data for the unphysical virtual
    potential and/or low-accuracy predictions of energy gaps near crossing regions.
    A possible solution to the NAC prediction problem is to use the Baeck-An approximation
    based on the ML-predicted energies. The improvement of the energy gap is challenging
    and requires substantial'
