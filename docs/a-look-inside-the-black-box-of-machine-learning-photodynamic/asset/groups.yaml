    ## 4. APPLICATIONS OF ML PHOTODYNAMICS SIMULATIONS


    ### 4.1. Photo-torquoselective Isomerization of Norbornyl Cyclohexadiene


    Irradiation of norbornyl cyclohexadiene (NCHD) initiates a torquoselective 4π
    disrotatory electrocyclic ring-closing reaction to major (anti-NL) and minor (syn-NL)
    norbornyl ladderene (NL) products (Figure 7a).1 We performed QC and ML photodynamics
    simulations to uncover the origin of the photo-torquoselectivity. We computed
    240 QC trajectories of NCHD at the CASSCF(4,3)/ANO-S-VDZP level and 3954 ML trajectories
    with NNs trained at the same level in 1 ps. The QC trajectories required 17 days,
    whereas the ML trajectories only took 38 s on a single CPU. The final MD snapshots
    were optimized to intermediates and products (Figure 7b).


    The ML trajectories show excited-state dynamics and an S1 half-life consistent
    with those from the QC trajectories (Figure 7c). They predict a 0.2% quantum yield
    of syn-NL (Figure 7e), which is missing in the QC trajectories because of the
    limited number of trajectories (Figure 7d). The ML photodynamics simulations are
    consistent with our PES calculations and confirm that the syn pathway is steeper
    than the anti pathway, forming a higher ratio of Int-a. However, the anti pathway
    has a steeper energy descent at the S1/S0 crossing seam, favoring anti-NL. The
    984 1 ns ML trajectories reveal thermal conversions from the unexpected intermediates
    Int-a and Int-b to NCHD (Figure 7f), which explains their absence in the experiment.
    This work demonstrates the efficiency and accuracy of ML photodynamics simulations
    and emphasizes the importance of long-time-scale simulations.


