    ## 1. 引言


    光化学之所以引人入胜，是因为它利用可再生的太阳能，在温和条件下以高原子转化效率合成化学产品⁴和燃料⁵⁻⁸。光化学反应通过超短时间尺度（10⁻¹⁵−10⁻¹²
    s）上的无辐射过程发生。机理研究依赖于时间分辨实验（即阿托化学⁹）来探测激发态的分子振动和电子结构。综合研究辅以计算建模，以解开难以捉摸的光谱特征并识别关键的激发态结构。激发态电子结构的量子化学（QC）计算通常成本高昂。因此，引入了机器学习（ML）技术来加速计算。


    ML模型从大型QC数据集中学习分子结构与相关性质（例如能量¹⁰⁻¹³、跃迁偶极矩¹⁰⁻¹³和振子强度¹⁴,¹⁵）之间的关系。这些应用已成功发现新分子¹⁶和材料¹⁷、预测反应势垒¹⁸、寻找过渡态¹⁹,²⁰、求解薛定谔方程²¹,²²、建模波函数²³,²⁴、优化密度泛函²⁵,²⁶、计算红外光谱²⁷、紫外-可见光谱¹¹,¹³和核磁共振谱²⁸，以及模拟激发态动力学¹²,²⁹和复杂光化学反应。¹⁻³
    能量预测达到了化学精度（1 kcal·mol⁻¹），这是实现真实化学预测和与实验比较所必需的。


    与同级别的QC计算相比，计算成本可以忽略不计。¹²,²⁹ 因此，许多研究将ML势用作非绝热分子动力学（NAMD）模拟的突出加速器，例如多组态时间相关Hartree（MCTDH）³⁰和轨迹面跳跃（TSH）³¹计算。多个课题组开发了ML混合量子-经典NAMD方法（在本述评中称为ML光动力学），例如与Newton-X³³结合的MLAtom³²以及与SHARC³⁵结合的SchNarc³⁴。为了研究光环加成和电环化反应，我们课题组开发了Python快速人工智能从头算分子动力学（PyRAI²MD）代码。¹


    训练ML势是一项具有挑战性的任务。首先，生成高质量的可机器学习QC数据需要计算化学和ML方面的专业知识。训练数据生成协议常常带有需要特定步骤去除的人类偏见。其次，ML模型的快速发展使得比较这些模型的效率和性能变得相当困难。³⁶
    我们首先概述ML光动力学的基本背景。然后，我们将提供构建ML势的简短教程，并讨论我们近期出版物中的应用。最后，我们将总结我们的发现和对未来方法发展的展望。


    ## 2. 机器学习光动力学方法


    ML光动力学方法通常包含三个关键组成部分（图1）：QC数据集、ML势和NAMD。


    ### 2.1. 用于训练的量子化学数据集


    单参考方法（如含时密度泛函理论）用于计算垂直激发能，误差范围为0.3至0.5 eV。³⁷ 然而，当电子态之间存在强耦合（例如避免交叉或圆锥交叉）时，它们会失效，因为这违反了玻恩-奥本海默近似。单参考方法在这些交叉区域也可能预测错误的分支平面维数。³⁸,³⁹
    多组态自洽场（MCSCF）方法，如完全活性空间自洽场（CASSCF），更适合描述交叉区域附近的电子结构。术语CASSCF(m,n)指的是m个电子和n个轨道的活性空间。使用现代量子化学软件，CASSCF波函数通常被限制在22个电子和22个轨道的活性空间内。⁴⁰
    活性轨道的选择并非易事。太小的活性空间可能导致高能态沿反应坐标变得相对低能，称为入侵态。考虑电子相关能显著改善能量，可接近实验能量。


