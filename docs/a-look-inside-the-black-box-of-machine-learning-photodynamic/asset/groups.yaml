    ### 4.4. 关于ML光动力学模拟的评述


    长时间尺度的ML光动力学模拟广泛地积分牛顿运动方程。时间步长强烈依赖于所研究体系的振动频率。例如，小有机分子中C–H伸缩的典型振动周期约为10 fs，这表明最大时间步长应为1
    fs。过大的时间步长可能会在轨迹传播中累积大量误差。模拟还需要足够数量的轨迹，以满足所考虑性质（如时间常数和量子产率）的统计收敛。然而，由于计算成本，这些信息在QC-NAMD研究中通常不可用。在本小节中，我们使用ML光动力学模拟来探索积分时间步长和轨迹数量对光化学反应模拟的影响。模型体系为八环丙基[3]-梯形二烯（A''''）。


    轨迹从S1态传播1 ps。我们分别以0.1、0.25、0.5和1 fs的时间步长（Δt）收集了3266、3268、3271和3211条轨迹。图10a绘制了S1态布居随时间的变化。当Δt
