  - '[PAGE 9]


    identifying mechanistic pathways with active learning in photochemical reactions.
    We combined Wigner sampling and geometrical interpolation to simplify training
    data generation. The method trains effective ML potentials to predict qualitatively
    correct PESs and detect undersampled structures near crossing regions. Moreover,
    we discussed data augmentation with atomic permutations that mitigate the permutational
    variance in the inverse distance matrix representation; it substantially accelerates
    active learning for photochemical reactions of high-symmetry molecules.


    ML photodynamics enables highly efficient nanosecond NAMD simulations with the
    quality of CASSCF and XMS-CASPT2 for relatively large molecules. The training
    requires minimal prior knowledge of the intended photochemical reaction. The current
    limitations of ML photodynamics are unsatisfactory predictions of NACs and the
    energy gaps near the crossing regions. Current ML photodynamics simulations may
    employ NAC-free surface hopping methods such as the Zhu–Nakamura theory until
    a more suitable model for NAC predictions is developed. Overall, ML photodynamics
    simulations provide a valuable tool to study long-time-scale photochemical reactions.
    We expect this Account to contribute to a deeper understanding of the ML photodynamics
    approach and inspire future applications in simulating photochemistry in molecular
    solids and explicit solvation with further applications in chemical biology and
    materials chemistry, solid-state, explicit-solvent, and biological systems.


