    ### 4.2. Substituent Effects on the Photochemical Reactions of [3]-Ladderdiene


    The [2 + 2] cycloaddition of [3]-ladderdienes can access cubanes. The quantum
    yield of cubane increases in the [3]-ladderdienes octasubstituted with methyl
    (CH3), trifluoromethyl (CF3), and cyclopropyl (cPr) groups.2 We recently performed
    the first simulations for these molecules using ML photodynamics.2 The NNs were
    trained with CASSCF(8,7)/ANO-S-VDZP+ANO-S-MB (for substituents) calculations.
    The trajectories were propagated from the S1 FC region for 2 ps (0.5 fs time step).
    We collected 3835, 3259, and 3122 trajectories for octamethyl (A), octatrifluoromethyl
    (A′), and octacyclopropyl [3]-ladderdiene (A″) to analyze the excited-state dynamics.
    Figure 8a,b illustrates the observed pathways and S1 → S0 relaxation half-lives.
    The ML trajectories discovered four S1 relaxation pathways in the trajectories
    of octamethyl [3]-ladderdiene: (1) [2 + 2] cycloaddition, (2) 4π disrotatory electrocyclic
    ring opening, (3) σC–C cleavage, and (4) 6π conrotatory electrocyclic ring opening.
    The 4π and 6π ring-opening reactions have higher relaxation rates than the [2
    + 2] cycloaddition (Figure 8b). The closed-shell repulsion in CF3 blocks the 6π
    ring-opening pathway, enhancing the [2 + 2] cycloaddition. The steric effect of
    cPr also accelerates the [2 + 2] cycloaddition reaction to compete with the 4π
    disrotatory electrocyclic ring-opening reaction. Figure 8c shows a broad trajectory
    distribution toward five products, where the quantum yield of octamethyl cubane
    is 1%. As can be seen in Figure 8d,e, the steric clashes narrow the spatial distributions
    of the reaction paths and deactivate the side-reaction channels. These findings
    explain the increasing quantum yields of octatrifluoromethyl (14%) and octacyclopropyl
    cubane (15%). This work highlights the capability of ML photodynamics simulations
    to discover complex photochemical reactions.


