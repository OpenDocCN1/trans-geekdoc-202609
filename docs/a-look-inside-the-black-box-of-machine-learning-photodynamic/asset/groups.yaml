    # 4.3. Photocyclization of Hexafluorobenzenes


    Hexafluorination of benzene significantly enhances the chemoselectivity of the
    photochemical 4π disrotatory electrocyclization to strained Dewar-HFB (Figure
    9a).96 However, the long-lived nonradiative decay of HFB and low quantuam yield
    of Dewar-HFB prevent productive QC-NAMD simulations from understanding the mechanisms.96
    The ML photodynamics simulations enable us to model the excited-state dynamics
    of HFB in 4 ns at the XMS-CASPT2(6,7)/aug-cc-pVDZ level.3


    The ML photodynamics simulations show that most HFBs reform the reactant. Figure
    9b illustrates one of the HFB trajectories in the first 600 ps (0.6 ns). The snapshots
    display the pseudo-Jahn–Teller distortions breaking the planar structure with
    out-of-plane C–F bending. The nonradiative decay occurs at a surface hopping point
    involving a πC–C cis–trans isomerization, where the twisting angle α is 110° at
    0.29 ns. Figure 9c plots the distribution of the HFB hopping points. The hopping
    structures reveal a smooth twisting of the C–F bonds around the C1–C2 bond, indicating
    a continuous S1/S0 crossing seam. However, the structures leading to the 4π disrotatory
    electrocyclization are sparsely distributed along the seam without a particular
    clustering pattern (R = 2.58–2.87 Å). This implies that neither the πC–C twisting
    nor the 1,4-carbon distance directly determines the formation of Dewar-HFB. Thus,
    the 4π disrotatory electrocyclization of HFB could be attributed to the dynamical
    effects in the post-surface-hopping structures, with the nuclear momentum continuously
    populating the bond-forming vibration mode. Figure 9d shows a surface hopping
    point yielding Dewar-fluorobenzene. The predicted reaction quantum yield is 0.3%,
    in line with the experimental results (≤3%).97


    # 4.4. Remarks on ML Photodynamics Simulations


    Long-time-scale ML photodynamics simulations extensively integrate Newton''s equation
    of motion. The time step strongly depends on the vibrational frequency of the
    system under investigation.


    investigation. For instance, a typical vibrational period of C–H stretching in
    small organic molecules is about 10 fs, suggesting that the maximum time step
    should be 1 fs. A time step that is too large may accumulate substantial errors
    in trajectory propagations. The simulations also require a sufficient number of
    trajectories to meet the statistical convergence of the considered properties
    (e.g., time constants and quantum yields). However, this information is often
    unavailable in QC-NAMD studies because of the computational cost. In this subsection,
    we use ML photodynamics simulations to explore the influence of the integration
    time step and number of trajectories on simulation of photochemical reactions.
    The model system is octacyclopropyl [3]-ladderdiene (A'''').


    The trajectories were propagated from the S1 in 1 ps. We collected 3266, 3268,
    3271, and 3211 trajectories with time steps (Δt) of 0.1, 0.25, 0.5, and 1 fs,
    respectively. Figure 10a plots the time evolution of the S1 population. For Δt
    = 0.1 fs, the predicted S1 half-life is 165.6 fs. Increasing the step size to
    1 fs shortens the half-life to 80 fs. However, the product distributions are less
    sensitive than the state populations. Setting Δt from 0.1 to 1 fs lowers the yield
    of A'''' only from 0.54 to 0.50 and increases the yield of B'''' from 0.14 to
    0.16 and the yield of E'''' from 0.29 to 0.34 (Figure 10b). A recent benchmark
    by Baratti and co-workers reported that the random numerical noise of 10−5 hartree
    in energy calculations at Δt = 0.5 fs causes the total energy not to be conserved
    in NAMD simulations.98 As the NN potential is trained at chemical accuracy (1.6
    × 10−3 hartree), the choice of Δt needs extra carefulness. For Δt = 0.1 fs, the
    trajectories obtain reasonable energy conservation with an absolute energy drift
    of 5 × 10−5 hartree (Figure 10c). The energy drifts increase to 2 × 10−4 and 2
    × 10−3 hartree at Δt = 0.25 and 0.5 fs, respectively. However, Δt = 1 fs accumulates
    a tremendous energy drift approaching 0.1 hartree in 2 ps of simulation. Thus,
    we think that Δt = 0.5 fs is required for energy conservation in ML photodynamics.


    Figure 10d plots the predicted yields as functions of the number of trajectories
