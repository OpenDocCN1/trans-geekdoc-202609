    ## 3. 训练ML光动力学模型


    ### 3.1. 构建ML势


    我们首先确定构建ML势所需的合适电子态数量。建议首先计算吸收光谱并与可用的实验结果进行比较，以评估激发中涉及的相关态（图2a）。反应坐标图也有助于表征所选态以及可能的反应路径（图2b）。更严格的论证需要分析QC-NAMD模拟过程中的态布居（图2c）。由于图2中的模型在吸收光谱和反应图中显示出分离的S₁态和更高的态，并且态布居转移主要涉及S₁和S₀态，因此我们可以构建ML势来学习S₀和S₁的能量和力，从而减小数据集规模和训练噪声。


    训练ML势使用梯度下降方法最小化均方误差损失函数。^81 我们将训练数据分为两部分（例如9:1）。第一部分用于训练模型；另一部分用于测试或验证。核方法和神经网络可能包含需要额外优化的超参数，这可以通过网格搜索和随机搜索来完成。^82
    在训练数据量有限的情况下，k折交叉验证是超参数优化的有效方法。^83 神经网络势容易出现过拟合，即模型拟合训练数据和噪声，这通常会导致训练集之外的预测失败。因此，我们建议采取过拟合预防措施（例如早停、随机失活和权重衰减）。^82,84
    早停法在验证误差增加而训练误差减少时停止训练过程。随机失活随机忽略一些节点的输出，以防止层内节点复杂的共适应，从而使预测更稳健。权重衰减在损失函数中加入小的惩罚项以防止过拟合。


    ### 3.2. 初始集采样


    初始集采样为学习PES提供了基线。在热反应中，结构采样已通过基于MD的方法（伞形采样、^85 轨迹引导采样、^86 增强采样^87 和元动力学^88）、随机表面行走、^89
    Wigner采样^90 和简正模式扫描^71,91 完成。然而，这些技术对复杂光化学反应的效果有限。例如，对反应物或产物几何结构进行Wigner采样只能捕获局部或全局最小值附近可达到的非平衡几何结构。简正模式扫描包含许多不相关的分子振动；基态MD模拟所访问的机理路径与激发态过程不同。随着自由度数量的增加，激发态MD变得极其昂贵。我们最近报道了一种复合方案，该方案结合Wigner采样和几何插值，以生成紧凑而相关的初始集（图3）。


    ![](img/9524d5a086bf2a81667a6843d3391ba9_3_0.png)


    图3. 通过几何插值和Wigner采样生成初始集。彩色曲线表示插值点，灰色点表示Wigner采样的反应物和产物结构。


    Wigner采样通常用于生成光动力学和吸收光谱的初始条件。^92 学习Wigner采样的反应物有助于减少Franck–Condon（FC）区域附近结构的欠采样。几何插值补充了数据集中反应物和产物之间的结构相关性。我们使用测地线插值^93
    来生成优化的反应物、产物和最小能量交叉点（MECP）几何结构之间的中间结构。我们将反应物的Wigner采样几何位移与插值结构相结合，以拓宽采样空间（图3）。对于复杂环境中较大系统的结构采样，Wigner采样需要与多尺度MD模拟相结合来对环境进行采样。^94


    我们训练了五个模型以展示Wigner采样和几何插值的效果。每个模型由两个独立训练的神经网络组成。超参数和训练结果可在辅助信息中获取。


    我们使用预测标准差来估计预测不确定性。训练集基于两个不同比例的子集构建：Wigner采样集包含100个反应物和产物结构，几何插值集包含500个结构（25条路径×20个中间体）。测试集包含六氟苯（HFB）4π对旋电环化反应中的201个插值结构。


