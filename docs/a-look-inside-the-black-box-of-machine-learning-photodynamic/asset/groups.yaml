    ### 作者简介


    **李敬白**于2019年在伊利诺伊理工学院获得博士学位，师从Andrey Yu. Rogachev教授。他曾是东北大学的博士后研究员，与Steven A.
    Lopez教授合作，在Lopez课题组开发了PyRAI²MD。他目前是深圳职业技术学院霍夫曼先进材料研究院的副教授。他的研究专注于开发机器学习光动力学方法，以研究复杂环境中的光化学反应。


    **史蒂芬·A·洛佩斯**于2015年在加利福尼亚大学洛杉矶分校获得博士学位，师从Kendall N. Houk教授。他曾是美国能源部能源效率与可再生能源博士后研究员，在哈佛大学与Alán
    Aspuru-Guzik教授合作。他目前是东北大学化学与化学生物学系的助理教授。他的课题组专注于利用最先进的量子化学（QC）方法和机器学习技术理解有机分子和软材料中的光驱动过程。


