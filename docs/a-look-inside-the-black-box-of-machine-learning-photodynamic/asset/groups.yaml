    ### 3.3. 主动学习


    主动学习用于搜索初始集中的欠采样结构，最初由Behler^95 为基态MD模拟引入，随后由Marquetand及其同事^71 将其改进用于激发态PES。主动学习使用相似性度量来确定MD模拟过程中预测的分子性质的不确定性。基于核的方法（例如高斯过程回归）可以提供预测的协方差作为预测不确定性的估计。然而，神经网络势需要一个至少包含两个独立训练的神经网络的委员会模型来评估不确定性。ML势首先用初始集进行训练，并传播一组轨迹以搜索欠采样结构。如果当前结构的预测能量、力、NAC和SOC超过预定义阈值（例如，能量和力分别为0.043哈特里和0.25哈特里·玻尔−1），则这些轨迹终止。^1,2
    不确定的结构通过QC计算重新计算，并添加到ML势的再训练中。我们最近对八甲基-[3]-梯形二烯（A）的ML光动力学模拟显示，主动学习在自动发现新反应路径方面具有显著效果。^2
    初始训练集仅包含从[2 + 2]环加成的插值反应坐标图中采样的4321个结构。主动学习在1 ps（0.5 fs时间步长）内从S₁态传播了125条轨迹。它在51次迭代后完成，从σC–C断裂和电环开环路径中发现了4982个新结构，并预测出五个中间体或产物（图5a）。


