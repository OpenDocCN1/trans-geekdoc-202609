    \ uses a probabilistic model to find the optimal hyperparameters.\n\nIt builds\
    \ a surrogate model of the objective function and uses it to select the most promising\
    \ hyperparameters to evaluate.\n\n## 11.5 Model Selection\nChoosing the right\
    \ model involves comparing the performance of different models and selecting the\
