    这些过程将原始数据转换为机器学习算法可以有效使用的格式，这通常是区分平庸模型与高精度的模型的关键。


    本章涵盖了为准备数据和进行特征工程的核心技术和最佳实践，以提高模型性能。


    # 6.1 数据准备


    数据准备涉及对原始数据进行清洗并整理成适用于分析的格式。这一步至关重要，因为现实世界的数据通常是杂乱的，包含错误、缺失值和不一致之处。


    ## 6.1.1 数据清洗


    数据清洗解决缺失值、重复和异常值等问题。


    - **处理缺失值**：可以通过插补（用均值、中位数或众数替换缺失值）或在缺失值并非必要时删除相应的行/列来处理缺失数据。

    - **移除重复项**：重复记录可能会扭曲分析，应该识别并移除。

    - **异常值检测**：可以使用统计方法和可视化来检测异常值，然后通过删除或转换对其进行处理。


    ## 6.1.2 数据转换


    应用转换使数据更适用于分析和建模。


    - **归一化/标准化**：这些技术将数值特征缩放到标准范围或分布，这对于 `SVM` 和 `neural networks` 等算法特别重要。

    - **类别变量编码**：需要使用独热编码（one-hot encoding）或标签编码（label encoding）等方法将类别变量转换为数值格式。


    ## 6.1.3 数据划分


    将数据分为训练集、验证集和测试集可以确保在未见数据上评估模型，防止过拟合。


    - **训练集**：用于训练模型。

    - **验证集**：用于调整超参数并选择最佳模型。

    - **测试集**：用于评估模型的最终性能。


    # 6.2 特征工程


    特征工程涉及创建新特征或修改现有特征，以提高机器学习模型的性能。这是一个需要领域知识和创造力的关键步骤。


    ## 6.2.1 创建新特征


    - **交互特征**：结合两个或多个特征以捕捉它们的共同效应。

    - **多项式特征**：添加多项式项（例如 `( x², x³ )`）以捕捉非线性关系。

    - **聚合特征**：从多个特征中总结信息，例如计算相关特征的均值或和。


    ## 6.2.2 特征选择


    选择最相关的特征可以降低模型复杂度并提高性能。


    - **过滤方法**：基于相关性或卡方检验等统计量来选择特征。

    - **包装方法**：使用搜索算法根据模型性能评估特征子集（例如递归特征消除）。

    - **嵌入方法**：如 `Lasso`（`L1 regularization`）等算法在模型训练期间会执行特征选择。


    ## 6.2.3 特征提取


    特征提取涉及将数据转换为低维空间，同时保留重要信息。


    - **主成分分析 (PCA)**：通过将数据投影到主成分上来降低维度。

    - **独立成分分析 (ICA)**：将多变量信号分离为加性的、独立的分量。

    - **t-分布随机邻域嵌入 (t-SNE)**：通过将高维数据映射到低维空间来实现数据视觉化。


    # 6.3 处理不同数据类型


    不同类型的数据需要不同的预处理技术。


    ## 6.3.1 数值数据


    数值数据通常需要缩放、归一化或转换以提高模型性能。


    - **缩放**：调整数据范围，通常使用 `Min-Max Scaling` 或 `Standard Scaling`。

    - **归一化**：将数据转换为标准正态分布（`mean = 0`，`standard deviation = 1`）。


    ## 6.3.2 类别数据


    类别数据需要编码后用于机器学习算法。


    - **独热编码**：将类别变量转换为二进制矩阵，每个类别由一列表示。

    - **标签编码**：为每个类别分配一个唯一的整数。


    ## 6.3.3 文本数据


    文本数据需要特定的预处理技术将其转换为数值。


    - **分词**：将文本拆分为单词或标记。

    - **词干提取/词还原**：将单词还原为基础形式或根。

    - **向量化**：使用 `Bag of Words` (BoW)、`Term Frequency-Inverse Frequency` (TF-IDF)
    或词嵌入 (`Word2Vec`, `GloVe`) 等方法将文本转换为向量。


    # 6.4 数据准备与特征工程的最佳实践


    ## 6.4.1 数据质量


    在过程中处理缺失值、异常值和不一致性，以确保数据质量。


    ## 6.4.2 自动化


    使用流水线和自动化工具简化数据准备和特征工程，确保可重复性。


    ## 6.4.3 迭代过程


    数据准备和特征工程是迭代过程。根据模型性能和分析不断评估和改进特征。


    ## 6.4.4 领域知识


    利用领域知识创建捕捉底层模式和关系的特征。


    数据准备和特征工程是构建有效机器学习系统的基础。通过彻底清洗数据并工程特征，可以显著提升模型性能。


    # 第三部分：设计机器学习系统


    # 第七章系统需求与问题定义


    系统需求和问题定义为设计成功的机器学习解决方案奠定了基础。本章重点识别必要的设施、软件工具以及定义问题声明。


    # 7.1 理解系统需求


    系统需求包含了实现机器学习系统所需的技术和运行需求。


    ## 7.1.1 硬件需求


    指定训练和部署机器学习模型所需的硬件资源，如 `CPU`、`GPU`、`RAM` 和容量。


    ## 7.1.2 软件需求


    识别数据预处理、模型开发、评估和部署所需的软件工具和库。包括编程语言（`Python`、`R`）、机器学习框架（`TensorFlow`、`PyTorch`）以及数据处理工具（`Pandas`、`NumPy`）。


    ## 7.1.3 环境搭建


    搭建开发环境，确保所有所需软件组件的兼容性和功能。


    # 7.2 定义问题声明


    清晰的问题定义对于统一利益相关者的预期并引导机器学习解决方案至关重要。


    ## 7.2.1 问题识别


    识别并说明机器学习系统旨在解决的特定问题或挑战。这包括理解背景、利益相关者和限制条件。


    ## 7.2.2 问题建模


    将问题建模为机器学习任务，无论是分类、回归、聚类或其他类型的任务。定义输入数据、预期输出和评估指标。


    ## 7.2.3 数据需求


    指定数据需求，包括数据源、数据量、数据质量以及任何与数据使用相关的考虑。


    # 7.3 范围与可行性分析


    根据可用资源、时间线和问题的复杂度评估机器学习项目的范围和可行性。


    ## 7.3.1 项目范围


    定义项目的边界和目标，以确保结果聚焦且可实现。


    ## 7.3.2 可行性评估


    从技术能力、资源可用性和与业务目标的一致性评估项目的可行性。


