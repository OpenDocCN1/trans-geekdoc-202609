- raw: 'Note that tests are an enormous topic, and we don’t aim to learn about it.
    Unit tests, component tests, integration tests, smoke tests, mock, stub, fake,
    and spy are examples of terms and definitions in the testing ecosystem. We aim
    to learn about the adjustment to Go and the benefits of tests, particularly in
    Go. Also, we will learn what we need to test when building microservices’ architecture.


    Our perspective about testing in general goes like this:


    1.  Tests must be independent.


    2.  Flaky tests are any system’s disease — tests must be reproducible.


    3.  Tests are a great way to document our code.


    What are the steps to create a test in Go and where?


    1.  Create a file with a postfix of `_test.go`. The file can be near the tested
    file (see the example in this chapter’s code). We can create the file in a specific
    directory for tests.


    2.  In the test file, declare a function that her signature should be like that
    `func` `TestName(t *testing.T)`. Replace the `Name` with what you want to test.
    Usually, we test a function, and the `Name` is the function’s name. But, the `Test`
    prefix is necessary.


    3.  Use the Go CLI to run the test by running - `go test ./`


    We have a function called get bigger (`“``example.go``”`)


    `func GetBigger(a, b float64) float64 {`


    `return math.Max(a, b)`


    `}`


    And this is how the testing file should look like (`example_test.go`):


    `package main`


    `import “testing”`


    `func TestGetBigger(t *testing.T) {`


    `type args struct {`


    `a float64`


    `b float64`


    `}`


    `tests := []struct {`


    `name string`


    `args args`


    `want float64`


    `}{`


    `{`


    `name: “a is the bigger one”,`


    `args: args{`


    `a: 9,`


    `b: 6,`


    `},`


    `want: 9,`


    `},`


    `{`


    `name: “b is the bigger one”,`


    `args: args{`


    `a: 3,`


    `b: 7,`


    `},`


    `want: 7,`


    `},`


    `}`


    `for _, tt := range tests {`


    `t.Run(tt.name, func(t *testing.T) {`


    `if got := GetBigger(tt.args.a, tt.args.b); got != tt.want {`


    `t.Errorf(“GetBigger() = %v, want %v”, got, tt.want)`


    `}`


    `})`


    `}`


    `}`


    There are many utilities under the testing function that help us to perform more
    precise tests. There is a link to a more detailed article about the testing package
    in Go.


    # [Mocking](#toc.xhtml#s75a)


    This is a valuable tool that helps us set consts for our tests, something that
    is immutable. We can mock data, and we can mock a function. There are various
    ways to mock data; the most convenient way is using a `gofakeit` package. It is
    a very convenient package that helps us to mock data. Let’s discuss the mocking
    function.


    We can’t mock functions directly in Go. What we actually can `mock` is interfaces.
    Before mocking an interface, we must know how to mock a `struct`. To mock a `struct`
    in Go, we need the struct to be compatible with an interface, and then we can
    mock that interface. We will see in a second how to do it.


    Before that, we will mock a function. To mock a function, as you probably guessed,
    we need to assign a function to a struct. Here, we can leverage the existence
    of the empty struct (`struct{}`). Here is a use case where we have a function
    calling another two functions.


    `// Valid name is between 8 and 16 chars and doesn’t contain number`


    `func IsValidName(name string) bool {`


    `numbersValid := IsNumbersValid(name)`


    `lengthValid := IsLengthValid(name)`


    `return numbersValid && lengthValid`


    `}`


    `func IsNumbersValid(name string) bool {`


    `return !strings.ContainsAny(name, “0123456789”)`


    `}`


    `func IsLengthValid(name string) bool {`


    `length := len(name)`


    `return length >= 8 && length <= 16`


    `}`


    Let’s say that we want to create a test for `IsValidName` function, but we want
    to mock `IsNumbersValid` and `IsLengthValid` functions. The first step is to create
    an interface and empty `struct` as follows:


    `type ValidationClient struct{}`


    `type ValidationClientInter interface {`


    `IsNumbersValid(name string) bool`


    `IsLengthValid(name string) bool`


    `}`


    Then, assign the function that we want to mock to our `struct`.


    `func (c *ValidationClient) IsNumbersValid(name string) bool {`


    `return !strings.ContainsAny(name, “0123456789”)`


    `}`


    `func (c *ValidationClient) IsLengthValid(name string) bool {`


    `length := len(name)`


    `return length >= 8 && length <= 16`


    `}`


    After that, we should create an instance of the struct and use that instance to
    call the function that we want to mock.


    `var Client ValidationClientInter = &ValidationClient{}`


    `func IsValidName(name string) bool {`


    `numbersValid := Client.IsNumbersValid(name)`


    `lengthValid := Client.IsLengthValid(name)`


    `return numbersValid && lengthValid`


    `}`


    Following the example, now we have a function `IsValidName` calling another two
    functions through a struct client (`Client`)`,` which fulfills an interface.


    `ValidationClientInter.`


    Remember that we must have that interface. That is because, in Go, we can use
    composition to “`override`” an interface. After that, let’s use a tool called
    `mockery`. `mockery` helps us generate mocks by running a command. There is an
    alternative called `gomock`, which is also very popular in Go. To run `mockery`,
    use the following command:


    `mockery --all --inpackage`


    This will generate a separate file for each interface. When running this command,
    the tool will create this file - `mock_ValidationClientInter.go`. The only thing
    that remains now is to determine the behavior of the mocked function and then
    assign the `Client` to the mocked client we created before. By doing so, when
    running the test, it will use the mocked client and not the original client.


    `mockedClient := &MockValidationClientInter{}`


    `mockedClient.On(“IsNumbersValid”, mock.Anything).Return(true)`


    `mockedClient.On(“IsLengthValid”, mock.Anything).Return(true)`


    `Client = mockedClient`


    This functionality is happening within the test file.


    # [Fuzzy Testing](#toc.xhtml#s76a)


    Fuzz tests generate input for a function using supplied seed data. Fuzz testing
    proves to be an effective method for uncovering unforeseen behaviors within our
    code. It helps to find where the code could panic so we can handle this particular
    use case we didn’t think of.


    Fuzzing is a new capability in Go. Support fuzzing testing from version 1.18.
    Let’s look at a simple function parsing string into first and last names.


    `// ParseName parses a name into first and last.`


    `func ParseName(s string) (string, string, error) {`


    `parts := strings.Split(s, “ “)`


    `return parts[0], parts[1], nil`


    `}`


    We created a fuzz test for this function like this:


    `func FuzzParseName(f *testing.F) {`


    `f.Add(“John Adams”)`


    `f.Add(“George Washington”)`


    `f.Fuzz(func(t *testing.T, s string) {`


    `_, _, err := ParseName(s)`


    `if err != nil {`


    `t.Errorf(“%v”, err)`


    `}`


    `})`


    `}`


    Now, let’s run the fuzzing test with a timeout of 12 seconds. Note that fuzzing
    test timeout is infinite (because it always tries to find more use cases). We
    can run the fuzzing test by running the following command:


    `go test -fuzz FuzzParseName -fuzztime=12s`


    After running this command, we encountered a panic error:


    `panic: runtime error: index out of range [1] with length 1`


    Pretty straightforward, the reason for the panic is that we didn’t check a case
    of a string that is empty or doesn’t contain space. To solve it, we need to handle
    that use case. Also, ignore the new error type in the test.


    `var ErrInvalidName = errors.New(“invalid name”)`


    `// ParseName parses a name into first and last.`


    `func ParseName(s string) (string, string, error) {`


    `parts := strings.Split(s, “ “)`


    `if len(parts) != 2 {`


    `return “”, “”, ErrInvalidName`


    `}`


    `return parts[0], parts[1], nil`


    `}`


    `func FuzzParseName(f *testing.F) {`


    `f.Add(“John Adams”)`


    `f.Add(“George Washington”)`


    `f.Fuzz(func(t *testing.T, s string) {`


    `_, _, err := ParseName(s)`


    `if err != nil {`


    `if errors.Is(err, ErrInvalidName) {`


    `return`


    `}`


    `t.Errorf(“%v”, err)`


    `}`


    `})`


    `}`


    Note the fuzzing test must have the prefix of `Fuzz` in the test name.


    # [Microservices Testing](#toc.xhtml#s77a)'
  fmt: "\n注意：测试是一个庞大的主题，我们不旨在全面学习它。单元测试、组件测试、集成测试、冒烟测试，以及 Mock、Stub、Fake 和 Spy 等都是测试生态系统中的术语和定义示例。我们的目标是了解\
    \ Go 语言中的测试调整及其优势，特别是在 Go 中的优势。此外，我们还将学习在构建微服务架构时需要测试什么。\n\n我们对测试的总体看法如下：\n\n\
    1. 测试必须是独立的。\n2. 不稳定测试是任何系统的毒瘤 —— 测试必须是可复现的。\n3. 测试是记录代码的绝佳方式。\n\n在 Go 中创建测试的步骤是什么？测试文件放在哪里？\n\
    \n1. 创建一个以 `_test.go` 为后缀的文件。该文件可以放在被测试文件附近（请参阅本章代码中的示例）。我们也可以在专门的目录中创建测试文件。\n\
    2. 在测试文件中，声明一个签名为 `func TestName(t *testing.T)` 的函数。将 `Name` 替换为你想要测试的内容。通常我们测试一个函数，`Name`\
    \ 即为该函数的名称。但 `Test` 前缀是必须的。\n3. 使用 Go CLI 运行测试，执行命令 `go test ./...`。\n\n我们有一个名为\
    \ `GetBigger` 的函数（见 `example.go`）：\n\n```go\nfunc GetBigger(a, b float64) float64\
    \ {\n    return math.Max(a, b)\n}\n```\n\n测试文件应如下所示（`example_test.go`）：\n\n```go\n\
    package main\n\nimport \"testing\"\n\nfunc TestGetBigger(t *testing.T) {\n   \
    \ type args struct {\n        a float64\n        b float64\n    }\n    tests :=\
    \ []struct {\n        name string\n        args args\n        want float64\n \
    \   }{\n        {\n            name: \"a is the bigger one\",\n            args:\
    \ args{\n                a: 9,\n                b: 6,\n            },\n      \
    \      want: 9,\n        },\n        {\n            name: \"b is the bigger one\"\
    ,\n            args: args{\n                a: 3,\n                b: 7,\n   \
    \         },\n            want: 7,\n        },\n    }\n    for _, tt := range\
    \ tests {\n        t.Run(tt.name, func(t *testing.T) {\n            if got :=\
    \ GetBigger(tt.args.a, tt.args.b); got != tt.want {\n                t.Errorf(\"\
    GetBigger() = %v, want %v\", got, tt.want)\n            }\n        })\n    }\n\
    }\n```\n\n`testing` 包下有许多工具函数帮助我们执行更精确的测试。文中提供了一个指向 Go `testing` 包详细文章的链接。\n\n\
    # Mock\n\n这是一个宝贵的工具，帮助我们为测试设置常量（即不可变数据）。我们可以 Mock 数据，也可以 Mock 函数。Mock 数据的方式有很多；最方便的方式是使用\
    \ `gofakeit` 包。这是一个非常方便的包，帮助我们 Mock 数据。接下来我们讨论 Mock 函数。\n\n在 Go 中我们无法直接 Mock 函数。我们实际上能\
    \ `mock` 的是接口。在 Mock 接口之前，我们必须知道如何 Mock `struct`。要在 Go 中 Mock `struct`，我们需要该结构体兼容某个接口，然后我们就可以\
    \ Mock 该接口。稍后我们将看到如何操作。\n\n在此之前，我们先尝试 Mock 一个函数。要 Mock 一个函数，正如你可能猜到的，我们需要将函数赋值给一个结构体。在这里，我们可以利用空结构体（`struct{}`）的存在。以下是一个用例：一个函数调用了另外两个函数。\n\
    \n```go\n// Valid name is between 8 and 16 chars and doesn't contain number\n\
    func IsValidName(name string) bool {\n    numbersValid := IsNumbersValid(name)\n\
    \    lengthValid := IsLengthValid(name)\n    return numbersValid && lengthValid\n\
    }\n\nfunc IsNumbersValid(name string) bool {\n    return !strings.ContainsAny(name,\
    \ \"0123456789\")\n}\n\nfunc IsLengthValid(name string) bool {\n    length :=\
    \ len(name)\n    return length >= 8 && length <= 16\n}\n```\n\n假设我们要为 `IsValidName`\
    \ 函数创建测试，但想 Mock `IsNumbersValid` 和 `IsLengthValid` 函数。第一步是创建一个接口和空 `struct`，如下所示：\n\
    \n```go\ntype ValidationClient struct{}\n\ntype ValidationClientInter interface\
    \ {\n    IsNumbersValid(name string) bool\n    IsLengthValid(name string) bool\n\
    }\n```\n\n然后，将我们想要 Mock 的函数赋值给该 `struct`。\n\n```go\nfunc (c *ValidationClient)\
    \ IsNumbersValid(name string) bool {\n    return !strings.ContainsAny(name, \"\
    0123456789\")\n}\n\nfunc (c *ValidationClient) IsLengthValid(name string) bool\
    \ {\n    length := len(name)\n    return length >= 8 && length <= 16\n}\n```\n\
    \n之后，我们应该创建该结构体的实例，并使用该实例来调用我们想要 Mock 的函数。\n\n```go\nvar Client ValidationClientInter\
    \ = &ValidationClient{}\n\nfunc IsValidName(name string) bool {\n    numbersValid\
    \ := Client.IsNumbersValid(name)\n    lengthValid := Client.IsLengthValid(name)\n\
    \    return numbersValid && lengthValid\n}\n```\n\n按照示例，现在我们有一个函数 `IsValidName`\
    \ 通过结构体客户端（`Client`）调用另外两个函数，该客户端满足接口 `ValidationClientInter`。\n\n请记住，我们必须拥有该接口。因为在\
    \ Go 中，我们可以使用组合来“`override`”接口。之后，让我们使用一个名为 `mockery` 的工具。`mockery` 通过运行命令帮助我们生成\
    \ Mock。另一种选择是 `gomock`，它在 Go 中也非常流行。运行 `mockery` 的命令如下：\n\n```bash\nmockery --all\
    \ --inpackage\n```\n\n这将为每个接口生成一个单独的文件。运行此命令时，工具将创建文件 `mock_ValidationClientInter.go`。剩下的唯一工作就是确定\
    \ Mock 函数的行为，然后将 `Client` 赋值为我们之前创建的 Mock 客户端。这样做后，运行测试时将使用 Mock 客户端而不是原始客户端。\n\
    \n```go\nmockedClient := &MockValidationClientInter{}\nmockedClient.On(\"IsNumbersValid\"\
    , mock.Anything).Return(true)\nmockedClient.On(\"IsLengthValid\", mock.Anything).Return(true)\n\
    Client = mockedClient\n```\n\n此功能发生在测试文件中。\n\n# 模糊测试\n\n模糊测试使用提供的种子数据为函数生成输入。模糊测试被证明是发现代码中不可预见行为的有效方法。它有助于找出代码可能发生\
    \ panic 的位置，以便我们处理那些我们未曾想到的特定用例。\n\n模糊测试是 Go 的一项新功能。从 1.18 版本开始支持模糊测试。让我们看一个将字符串解析为名和姓的简单函数。\n\
    \n```go\n// ParseName parses a name into first and last.\nfunc ParseName(s string)\
    \ (string, string, error) {\n    parts := strings.Split(s, \" \")\n    return\
    \ parts[0], parts[1], nil\n}\n```\n\n我们为此函数创建了一个模糊测试，如下所示：\n\n```go\nfunc FuzzParseName(f\
    \ *testing.F) {\n    f.Add(\"John Adams\")\n    f.Add(\"George Washington\")\n\
    \    f.Fuzz(func(t *testing.T, s string) {\n        _, _, err := ParseName(s)\n\
    \        if err != nil {\n            t.Errorf(\"%v\", err)\n        }\n    })\n\
    }\n```\n\n现在，让我们用 12 秒的超时时间运行模糊测试。注意，模糊测试的超时时间是无限的（因为它总是尝试寻找更多用例）。我们可以通过运行以下命令来运行模糊测试：\n\
    \n```bash\ngo test -fuzz FuzzParseName -fuzztime=12s\n```\n\n运行此命令后，我们遇到了一个 panic\
    \ 错误：\n\n```text\npanic: runtime error: index out of range [1] with length 1\n\
    ```\n\n原因非常直接：panic 的原因是我们没有检查字符串为空或不包含空格的情况。为了解决它，我们需要处理该用例。同时在测试中忽略新的错误类型。\n\
    \n```go\nvar ErrInvalidName = errors.New(\"invalid name\")\n\n// ParseName parses\
    \ a name into first and last.\nfunc ParseName(s string) (string, string, error)\
    \ {\n    parts := strings.Split(s, \" \")\n    if len(parts) != 2 {\n        return\
    \ \"\", \"\", ErrInvalidName\n    }\n    return parts[0], parts[1], nil\n}\n\n\
    func FuzzParseName(f *testing.F) {\n    f.Add(\"John Adams\")\n    f.Add(\"George\
    \ Washington\")\n    f.Fuzz(func(t *testing.T, s string) {\n        _, _, err\
    \ := ParseName(s)\n        if err != nil {\n            if errors.Is(err, ErrInvalidName)\
    \ {\n                return\n            }\n            t.Errorf(\"%v\", err)\n\
    \        }\n    })\n}\n```\n\n注意：模糊测试函数名必须以 `Fuzz` 为前缀。\n\n# 微服务测试\n"
