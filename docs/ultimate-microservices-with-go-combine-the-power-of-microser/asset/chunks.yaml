    `go mod init github.com/nirsht/microservices-with-go`


    如果我们想要安装任何包，可以运行：


    `go install github.com/nirsht/myawesomepackage`


    有各种工具可以帮助我们管理包，如 `go mod tidy`、`go vet` 等。这些命令功能强大，让我们能够管理包。


    ## 编写代码


    项目设置完成并引入所有所需的包后，我们就可以开始编写代码了。我们可以选择 Visual Studio Code、Vim 或 GoLand（由 JetBrains
    开发）等集成开发环境（IDE）来高效地编写代码。这些 IDE（以及其他 IDE）依赖语言服务器协议（LSP）来实现其功能。


    微软对 LSP 给出了一个很好的定义：


    > “语言服务器协议（LSP）是开发工具与语言服务器进程之间交换消息的标准化产物。使用语言服务器或守护进程并非新颖概念。Vim 和 Emacs 等编辑器已经这样做了一段时间，以提供语义自动补全支持”


    对于许多编程语言，LSP 并非由语言的原作者提供。但在 Go 中情况不同。Go 的 LSP 是 `gopls`，由 Go 团队维护。此外，Go 团队还为 VS
    Code 提供了一个名为 `vscode-go` 的扩展。


    ## 故障排查


    与所有软件工程师一样，我们的代码有时能完美运行。我们的工作包括阅读代码、调试和排查烦人的 Bug。Go 团队深知这一点。他们开发了一款旨在协助开发者进行调试和故障排查的工具。例如，他们提供了官方
    Go 调试器 - `gdb`。此外，Go 团队还开发了一款名为 `pprof` 的优秀性能分析器，它支持对性能分析数据进行可视化和分析。


    ## 测试


    任何自尊的软件工程师都会编写测试。这是创建系统可维护性的行业标准。Go 也为我们提供了一个高效执行测试的工具。不需要外部库，只需 Go CLI。运行时：


    `go test.`


    它会遍历所有文件，找出具有 `_test` 后缀的文件，然后运行所有以 `Test` 为前缀的函数。


    Go 团队在 `go test` 命令中提供了多种配置。我最喜欢的是通过 Go CLI 使用以下命令测试竞态条件的选项：


    `go test -race`


    从 Go 1.18 开始，模糊测试可用。


    > “模糊测试是一种自动化测试，它持续操纵程序的输入以查找 Bug。”


    模糊测试是一个方便且强大的工具，用于验证我们的程序在获得错误输入时不会崩溃。


    ## 安全


    现在，我们想要发布代码用于生产环境。但有一个问题。我们需要检查包的依赖项中是否存在安全漏洞。


    自 Go 1.18 起，我们可以运行一个命令来检查所有漏洞 - `govulncheck`。Govulncheck 由 Go 团队维护的 Go 漏洞数据库提供支持。


    ## 构建


    剩下的唯一事情就是打包我们的代码。Go 有一个编译器，负责将我们的代码编译为所需的二进制架构和操作系统。这些可以通过环境变量轻松配置 - `GOARCH`
    用于架构，`GOOS` 用于操作系统。


    构建命令内置于 Go CLI 中，我们可以通过运行以下命令来使用它：


    `go build main.go`


    ## 其他


    在这趟旅程中，我们只介绍了 Go 工具链中的一小部分工具。为了保持一致性，Go 将几件事集中管理，如代码检查（检查代码错误等）和格式化（让代码整洁美观，这在
    Go 中至关重要）。我们认为 Go 团队选择了合适的包纳入语言，比如用于处理时间相关任务的 “time” 包。


    # Go 的生态系统 — 社区及更远


    如今，大多数编程语言都是 OSS（即开源软件）。Go 就是其中之一，并且从第一天起就是开源驱动的。


    如今，许多人都非常激动并渴望为 Go 或 Go 开发工具链中的许多其他项目做贡献。就包的数量而言，Go 是最流行的编程语言之一（正如我们在上一章所见）。


    ![](img/Figure-2.6.jpg)


    **图 2.6：** 主流开源编程语言的包数量


    要提升编程语言方面的技能、知识和个人表现，以某种方式参与生态系统至关重要。这可以通过为开源项目做贡献、加入社区，或参加线上或线下聚会来实现。你也可以加入 Slack
    或 Discord 社区。


    一个查看大多数此类机会的绝佳网站是 `gophersource`。


    # 总结


    在本章中，我们学习了构成 Go 的概念。通过 Google 的历史，我们看到了创建这门新语言的动机和原因——简洁性、速度、可维护性、无缝上手等。


    了解这些内容将为我们提供背景，让我们明白为什么 Golang 中的某些事物看起来是这样的。Go 中的错误处理就是一个绝佳的例子。许多 Go 新手都在努力理解为什么不存在
    `try-catch-finally`。但过一段时间后，他们就明白了。继承也是如此；许多新手最初会惊讶于继承的不存在，但过一段时间后，他们就会理解为什么组合是
    Go 的精准选择。


    在下一章中，我们将探索 Go 的语法和基础知识。在涵盖所有基础知识后，我们将深入更高级的主题。


    我们将更详细地讨论本章中提到的简洁性概念。此外，我们将深入探讨并发的实现，并解决在 Go 中使用并发时出现的挑战。我们的讨论将涵盖组合、封装、多态等各种主题。敬请期待！


