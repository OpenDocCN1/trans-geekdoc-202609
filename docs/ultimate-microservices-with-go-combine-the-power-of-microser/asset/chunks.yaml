- raw: "    `go mod init github.com/nirsht/microservices-with-go`\n\n    If we want\
    \ to install any package, we can run:\n\n    `go install github.com/nirsht/myawesomepackage`\n\
    \n    There are a variety of tools that help us manage packages like `go mod tidy`,\
    \ `go vet`, and so on. These commands are powerful and allow us to manage the\
    \ packages.\n\n4.  **Writing code**\n\n    Once the project is set up and all\
    \ the desired packages are incorporated, we can start writing code. We might opt\
    \ for an integrated development environment (IDE) such as Visual Studio Code,\
    \ Vim, or GoLand (developed by JetBrains) for efficient code composition. These\
    \ IDEs, among others, rely on the Language Server Protocol (LSP) for their functionality.\n\
    \n    Great definition of LSP by Microsoft:\n\n    *“The language server protocol\
    \ (LSP) is the product of standardizing the messages exchanged between a development\
    \ tool and a language server process. Using language servers or demons is not\
    \ a new or novel idea. Editors like Vim and Emacs have been doing this for some\
    \ time to provide semantic auto-completion support”*\n\n    For many programming\
    \ languages, the LSP is not provided by the same author of the language. In Go,\
    \ this is not the case. The LSP in Go is `gopls` and is maintained by the Go team.\
    \ Moreover, the Go team also provides an extension for VScode called `vscode-go`.\n\
    \n5.  **Troubleshoot**\n\n    Similar to all software engineers, our code sometimes\
    \ functions flawlessly. Our efforts involve reading code, debugging, and troubleshooting\
    \ annoying bugs. The Go team acknowledges this. They developed a tool intended\
    \ to assist developers in debugging and troubleshooting. For instance, they offer\
    \ the official Go debugger - `gdb`. Additionally, the Go team has developed an\
    \ excellent profiler known as `pprof`, which enables the visualization and analysis\
    \ of profiling data.\n\n6.  **Test**\n\n    Any software engineer who respects\
    \ himself will add tests. This is an industry standard for creating maintainability\
    \ of our system. Go also provides us with a tool to perform tests efficiently.\
    \ No external library is needed, just the Go CLI. While running:\n\n    `go test.`\n\
    \n    It will iterate over all the files and indicate the ones that have a postfix\
    \ of `_test`, and then it will run all the functions with a prefix of `Test`.\n\
    \n    The Go team provides several configurations within the `go test` command.\
    \ My favorite is the option for testing race conditions through the Go CLI by\
    \ running:\n\n    `go test -race`\n\n    From Go 1.18, fuzzy tests are available.\n\
    \n    *“Fuzzing is a type of automated testing which continuously manipulates\
    \ inputs to a program to find bugs.”*\n\n    Fuzzy tests are a handy and powerful\
    \ tool to verify that our program won’t panic when we get wrong inputs.\n\n7.\
    \  **Security**\n\n    Now, we want to release our code for production. But there\
    \ is a problem. We need to check that there are no security vulnerabilities in\
    \ our package’s dependencies.\n\n    Since Go 1.18, we can run a command to check\
    \ all our vulnerabilities - `govulncheck`. Govulncheck is powered by the Go vulnerability\
    \ database that is maintained by the Go team.\n\n8.  **Build**\n\n    The only\
    \ thing remaining is to package our code. Go has a compiler that is responsible\
    \ for compiling our code to the desired binary architect and OS. These can be\
    \ configured easily by environment variables - `GOARCH` for architect and `GOOS`\
    \ for OS.\n\n    The build command is built-in within the Go CLI, and we can use\
    \ it by running:\n\n    `go build main.go`\n\n9.  **Others**\n\n    We have only\
    \ covered a few tools of the Go toolchain on this journey. For keeping things\
    \ consistent, Go centralizes several things like linting (checking code for errors,\
    \ and more) and formatting (making code look neat, which is vital in Go). We believe\
    \ the Go team has chosen suitable packages to include in the language, like the\
    \ “time” package for handling time-related tasks.\n\n# [Go’s Ecosystem — The Communities\
    \ and Beyond](#toc.xhtml#s38a)\n\nMost of the programming languages today are\
    \ OSS (aka Open-Source Software). Go is one of them, and it is OSS driven from\
    \ its first days.\n\nNowadays, many people are thrilled and keen to contribute\
    \ to Go or the many other projects in the Go development toolchain. Go is one\
    \ of the most popular programming languages in terms of the number of packages\
    \ (as we saw in the previous chapter).\n\n![](OEBPS/images/Figure-2.6.jpg)\n\n\
    **Figure 2.6:** The number of packages for leading OSS programming languages\n\
    \nTo improve one’s skillset, knowledge, and personal performance in programming\
    \ languages, it is essential to be involved in the ecosystem somehow. This can\
    \ be by contributing to OSS projects, joining a community, or attending online\
    \ or physical meetups. You can also join the Slack or Discord community.\n\nA\
    \ great website to view most of these opportunities is `gophersource`.\n\n# [Conclusion](#toc.xhtml#s39a)\n\
    \nIn this chapter, we learned the concepts that compose Go. Throughout Google’s\
    \ history, we saw the motivation and reason for creating this new language—simplicity,\
    \ speed, maintainability, seamless onboarding, and so on.\n\nKnowing all that\
    \ stuff will give us the context that some things look like they look in Golang.\
    \ The error handling in Go is a great example. Many newcomers to Go are struggling\
    \ to understand why `try-catch-finally` doesn’t exist. But, after a while, they\
    \ understand why. The same goes for inheritance; many newcomers are initially\
    \ surprised that inheritance doesn’t exist, but after a while, they understand\
    \ why composition is the precise choice for Go.\n\nIn the next chapter, we will\
    \ explore the syntax and basics of Go. After we cover all the basics, we will\
    \ approach more advanced topics.\n\nWe will discuss the simplicity concepts discussed\
    \ in this chapter in more detail. Furthermore, we will delve into the implementation\
    \ of concurrency and address the challenges that arise when employing concurrency\
    \ in Go. Our discussions will encompass various topics, including composition,\
    \ encapsulation, polymorphism, and more. Stay tuned!\n\n# [References](#toc.xhtml#s40a)\n\
    \n*   [https://github.com/golang/go](https://github.com/golang/go)\n\n*   [https://github.com/golang](https://github.com/golang)\n\
    \n*   [https://go.dev/doc/effective\\_go](https://go.dev/doc/effective_go)\n\n\
    *   [https://github.com/golang/go/wiki/CodeReviewComments](https://github.com/golang/go/wiki/CodeReviewComments)\n\
    \n*   [https://go.dev/doc/faq#Is\\_Go\\_an\\_object-oriented\\_language](https://go.dev/doc/faq#Is_Go_an_object-oriented_language)\n\
    \n*   [https://github.com/e3b0c442/keywords](https://github.com/e3b0c442/keywords)\n\
    \n*   [https://go.dev/talks/2015/simplicity-is-complicated.slide](https://go.dev/talks/2015/simplicity-is-complicated.slide)\n\
    \n*   [https://go.dev/doc/go1compat](https://go.dev/doc/go1compat)\n\n*   [https://www.youtube.com/watch?v=v24wrd3RwGo](https://www.youtube.com/watch?v=v24wrd3RwGo)\n\
    \n*   [https://go.dev/play/](https://go.dev/play/)\n\n*   [https://github.com/golang/tools/tree/master/gopls](https://github.com/golang/tools/tree/master/gopls)\n\
    \n*   [https://go.dev/doc/gdb](https://go.dev/doc/gdb)\n\n*   [https://github.com/google/pprof](https://github.com/google/pprof)\n\
    \n*   [https://go.dev/security/fuzz/](https://go.dev/security/fuzz/)\n\n*   [https://gophersource.com/](https://gophersource.com/)\n\
    \n*   [https://learn.microsoft.com/en-us/visualstudio/extensibility/language-server-protocol?view=vs-2022](https://learn.microsoft.com/en-us/visualstudio/extensibility/language-server-protocol?view=vs-2022)\n\
    \n# [CHAPTER 3](#toc.xhtml#c03)\n\n# [Go Essentials](#toc.xhtml#c03)\n\n# [Introduction](#toc.xhtml#s41a)\n\
    \nThis chapter will delve into the fundamental aspects of Go, including its basic\
    \ syntax, patterns, conventions, styles, and everything essential for becoming\
    \ proficient in Go development. It will give newcomers and less experienced Go\
    \ developers the minimum required knowledge to read this book."
