    \ and `}` to close scope.\n\nThe `main()` function plays a crucial role as the\
    \ entry point of a Go program, where execution begins. It is not a normal function;\
    \ it is the running point to initiate the program’s processes, making it essential\
    \ for any Go application.\n\nThe last line:\n\n`fmt.Println(\"Hello World!\")`\n\
    \nThis line functionality is to print the string - `Hello World!`. We used the\
    \ function `Println`, which is a function inside the package `fmt`.\n\nAnother\
    \ essential and saved function (rather than `main`) is `init()`. This will run\
    \ at the program’s start; it is the only function that runs before `main()`.\n\
    \n# Variables\n\nWe have three ways to declare a variable in Go.\n\nThe first\
    \ way is as follows:\n\n`var emptyMessage string`\n\nHere, we declare the keyword\
    \ `var`, then the variable name - `emptyMessage`. In the example, the variable\
    \ is of type string.\n\nThere is also an option to give a value to that variable\
    \ while declaring it:\n\n`var message string = \"This is a message\"`\n\nNote\
    \ that if we don’t give it an initial value like in the first example, it will\
    \ give it a default value. There is a different value for each primitive data\
    \ type, `nil` for a pointer, and empty struct values for structs. We will elaborate\
    \ on the default values of primitive data types later in this chapter.\n\nThe\
    \ second way to declare a variable is to let the Go compiler infer the variable\
    \ type by itself.\n\n`var inferredMessage = \"This is an inferred message\"`\n\
    \nIn that example, we didn’t have to declare the `string`. The Go compiler inferred\
    \ it from the syntax.\n\nThe third way to declare a variable in Go is by using\
    \ `:=`.\n\n`alsoInferredMessage := \"This is also an inferred message\"`\n\nHere,\
    \ we didn’t have to declare the keyword `var` or `string`, just `:=`.\n\nIn Go,\
    \ variables can’t change their type in runtime because Go is a static programming\
    \ language, as we saw in *[Chapter 2, Usability of Go](#c02.xhtml)*.\n\nThe convention\
    \ for variables, functions, maps, structs, and everything we declare in Go is\
    \ camelCase unless we want them to be public, in which case they will be PascalCase.\
    \ We will discuss access modifiers in this chapter.\n\n# Primitive Data Types\n\
    \nLet’s have a look at this code block:\n\n```\npackage main\n\nimport \"fmt\"\
    \n\nfunc main() {\n    message := \"This is a message\"\n    fmt.Println(message)\n\
    \    var zero int\n    fmt.Println(zero)\n    number := 42\n    fmt.Println(number)\n\
    \    var pi float64 = 3.14\n    fmt.Println(pi)\n    var booleanVar bool\n   \
    \ fmt.Println(booleanVar)\n    trueBooleanVar := true\n    fmt.Println(trueBooleanVar)\n\
    }\n```\n\nThere are four primitive data types in Go - `string`, `boolean`, `float32`\
    \ (also `float64`), and `int` (also `int8`, `int16`, `int32`, `int64`, `uint`,\
    \ `uint8`, `uint16`, `uint32`, `uint64`).\n\n*   `string` is for text. The default\
    \ value is an empty text `\"\"`.\n*   `int` is for a whole number. The default\
    \ value is `0`.\n*   `float32` is for a floating point number. The default value\
    \ is `0`.\n*   `bool` is for `true` or `false`. The default value is `false`.\n\
    \nAs we saw before, we can declare a variable without declaring the type, but\
    \ the type will be inferred. Go will choose the most convenient type. For instance,\
    \ if we want the variable to be `int8` and not `int`, we must declare it. Otherwise,\
    \ the Go compiler will choose an `int`.\n\n# Comments\n\nThere are two types of\
    \ comments:\n\n*   single-line\n*   multiline\n\nHere is a single-line example:\n\
    \n```\nfunc main() {\n    // This is simple comment\n}\n```\n\nHere is a multiline\
    \ example:\n\n```\n/*\nThis is a multi-line comment\n*/\nfmt.Println(\"Hello World!\"\
    )\n```\n\nFor single-line comments, use `//` and for multiline, start with `/*`\
    \ and end with `*/`.\n\n# Operators\n\nLet’s put here an example for all the operators\
    \ in Go. The operators in Go are very similar to any other programming language.\n\
    \n```\npackage main\n\nfunc main() {\n    // Arithmetic Operators\n    x := 5\
    \ + 5  // 10\n    x = 5 - 5   // 0\n    x = 5 * 5   // 25\n    x = 5 / 5   //\
    \ 1\n    x = 5 % 5   // 0\n    x++         // 6\n    x--         // 5\n\n    //\
    \ Comparison Operators\n    y := 5 == 5 // true\n    y = 5 != 5  // false\n  \
    \  y = 5 > 5   // false\n    y = 5 < 5   // false\n    y = 5 >= 5  // true\n \
    \   y = 5 <= 5  // true\n\n    // Logical Operators\n    a := true && true  //\
    \ true\n    a = true && false  // false\n    a = true || true   // true\n    a\
    \ = true || false  // true\n    a = !true          // false\n    a = !false  \
    \       // true\n\n    // Bitwise Operators\n    b := 5 & 5  // 5\n    b = 5 |\
    \ 5   // 5\n    b = 5 ^ 5   // 0\n    b = 5 << 5  // 160\n    b = 5 >> 5  // 0\n\
    \n    // Assignment Operators\n    c := 5\n    c += 5  // 10\n    c -= 5  // 5\n\
    \    c *= 5  // 25\n    c /= 5  // 5\n}\n```\n\n# `If` statement\n\nLike other\
    \ languages, the keywords that exist are `if` and `else`. Also, their usage is\
    \ exactly the same.\n\n# Loops\n"
  trans: "\n\n# 结构\n\n在本章中，我们将讨论以下主题：\n\n*   Golang 基础概览\n*   打包 —— 包之间的访问\n*   项目结构\n\
