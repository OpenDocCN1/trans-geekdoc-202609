- raw: "`go tool pprof -web http://localhost:6060/debug/pprof/heap`\n\nThe `-web`\
    \ flag opens the memory in a nice UI. We don’t need to use it.\n\n![](OEBPS/images/Figure-10.8.jpg)\n\
    \n**Figure 10.8:** pprof heap usage\n\nAfter a few seconds, the memory heap glanced\
    \ differently.\n\n![](OEBPS/images/Figure-10.9.jpg)\n\n**Figure 10.9:** pprof\
    \ heap usage 2\n\nLet’s not focus on the data within the preceding two figures.\
    \ The purpose of bringing them is to illustrate the power of the `pprof` package\
    \ in Golang and how we can use it. Rather than seeing the memory distribution\
    \ among functions in runtime, we can also look at metrics like CPU and goroutines\
    \ execution. To look further into those options, look at - `https://pkg.go.dev/net/http/pprof`.\
    \ Using `pprof` is pretty straightforward when understanding the usage for one\
    \ metric (like the `heap` metric we presented in this section).\n\n# [PGO](#toc.xhtml#s233a)\n\
    \n**P**rofile-**G**uided **O**ptimization is a compiler optimization method that\
    \ uses the information from profiling to leverage it for optimizations. The compiler\
    \ will generate high-performance binary code using this profiling data (`pprof`\
    \ output). PGO is available in Golang from version 1.21. Whenever building Golang\
    \ code, it will seek for `default.pgo` file, which contains profiling information.\
    \ Another way is to specify a specific profiling file `go build -pgo=/tmp/foo.pprof`.\
    \ We won’t dive into the process of using PGO; our goal is to know about the existence\
    \ of this method.\n\n# [Performance Issues](#toc.xhtml#s234a)\n\nBefore jumping\
    \ to the next section, let’s look at some common performance issues we can resolve\
    \ using profiling:\n\n*   **CPU Throttling**: A scenario where CPU usage reaches\
    \ its limits. This is a standard Kubernetes scenario, once we reach a Pod’s CPU\
    \ limit. Once this scenario happens, it will negatively affect the application’s\
    \ performance and stability. Note that Kubernetes won’t restart the container.\
    \ \n\n    ![](OEBPS/images/Figure-10.10.jpg)\n\n    **Figure 10.10:** CPU Throttling\
    \ of Pod in Kubernetes\n\n*   **Memory Leak**: A scenario where the application\
    \ consistently consumes memory without releasing it. In Kubernetes, the Pod will\
    \ be restarted if the memory passes the limit threshold. \n\n    ![](OEBPS/images/Figure-10.11.jpg)\n\
    \n    **Figure 10.11:** Memory Leaks Types\n\n    The two left graphs show a scenario\
    \ where a memory leak can occur - if the application is consuming the memory and\
    \ never releases it or stabilized (top-left), don’t be confused from the bottom\
    \ right graph. In that graph, the application consumes an essential memory and\
    \ then stabilizes. There is much to discuss about memory leaks; however, this\
    \ book won’t discuss it more.\n\n*   **Goroutine Leak:** We already discussed\
    \ this topic in *[Chapter 5, Unlocking Go’s Concurrency Power](#c05.xhtml)*. The\
    \ `pprof` package also allows us to track the amount and distribution of goroutines\
    \ in Golang.\n\n# [Alerting](#toc.xhtml#s235a)\n\nWe deployed the services to\
    \ production and monitored our services’ performance and behavior; we also built\
    \ a neat dashboard that will give us observability regarding all the APIs and\
    \ their communication. All that is great. Unfortunately, we aren’t always near\
    \ computers, and sometimes AFK (aka for Away From Keyboard). However, a system\
    \ is a living creature that always operates; we must take care of it when we aren’t\
    \ nearby. To align with our desired performance, we must put an alert that will\
    \ notify us when needed.\n\nAn alert is a signal generated by an automated monitoring\
    \ system, determining thresholds that are supposed to provide information for\
    \ critical issues. This information is necessary to preserve a system’s health\
    \ and performance.\n\nPopular alerting systems are PagerDuty and Atlassian Opsgenie.\
    \ Those systems have advanced escalation functionality like sending messages via\
    \ Slack, email, SMS, or even phone calls. We can configure whom to direct the\
    \ alert to at a particular moment by specifying the OnCall schedule.\n\n# [Performance\
    \ Metrics](#toc.xhtml#s236a)\n\nThese are recommended performance metrics for\
    \ an RESTful API. We should monitor and alert if some threshold is being exceeded:\n\
    \n*   **Requests Success Rate**: The percentage of requests that didn’t experience\
    \ errors out of all the requests. For example, two requests failed out of 1000\
    \ requests - the success rate is 99.8%. In systems where each decimal point represents\
    \ a lot of users, it is common to measure performance with the number of 9s. For\
    \ example, a success rate of 99.9992% is five times 9s. Each request is classified\
    \ to a boolean parameter to determine if the request was a success or failure,\
    \ regardless of the latency. Usually, only 5XX errors are classified as failure.\
    \ This metric indicates how many users experienced bad journeys using your applications.\n\
    \n*   **P95 Latency**: P95 stands for the 95th percentile. This metric reveals\
    \ that 95% of the request duration was under this metric value. For example, if\
    \ P95 is 0.5 seconds, 95% of the requests’ latency was under 0.5 seconds.\n\n\
    *   **P99 Latency**: This is the same as the previous metric but for the 99th\
    \ percentile. Both metrics help ensure that the vast majority of the users are\
    \ experiencing a good journey using the APIs or applications. We don’t want to\
    \ measure the average because of average flooding anomalies that don’t reflect\
    \ the real user experience. Note that when measuring these metrics, we only consider\
    \ success requests.\n\n# [Conclusion](#toc.xhtml#s237a)\n\nThis final chapter\
    \ explored the crucial aspects of maintaining services in a production environment.\
    \ We emphasized that a stable service in production requires continuous attention\
    \ and maintenance to remain resilient.\n\nWe delved into the importance of observability\
    \ achieved through telemetry data like logs, metrics, and tracing. This observability\
    \ allows us to monitor our systems, detect anomalies, and troubleshoot issues\
    \ effectively. We also discussed various strategies for handling production troubleshooting,\
    \ including the power of theory, profiling, and using Profile-Guided Optimization\
    \ (PGO) for performance enhancements.\n\nFurthermore, we covered the significance\
    \ of alerting systems to notify us of critical issues when we are not actively\
    \ monitoring our services. Lastly, we outlined some recommended performance metrics\
    \ for RESTful APIs to ensure a positive user experience.\n\nWhat’s Next?\n\n*\
    \   **Deep Dive into Observability Tools:** Explore advanced features and capabilities\
    \ of observability tools like Prometheus, Grafana, and Jaeger.\n\n*   **Advanced\
    \ Troubleshooting Techniques:** Develop skills in advanced troubleshooting techniques,\
    \ including distributed tracing and chaos engineering, to proactively identify\
    \ and resolve potential problems.\n\n*   **Performance Optimization:** Focus on\
    \ performance optimization strategies, including profiling and tuning, to enhance\
    \ the efficiency and scalability of your services.\n\n*   **Security Best Practices:**\
    \ Delve into security best practices for microservices, including encryption,\
    \ access control, and regular security audits, to protect your services from threats\
    \ and vulnerabilities.\n\nBy mastering these areas, you can ensure the continued\
    \ reliability, performance, and security of your services in production, ultimately\
    \ leading to a more robust and resilient system.\n\n# [References](#toc.xhtml#s238a)\n\
    \n*   [https://www.comparitech.com/net-admin/solarwinds-npm-vs-datadog/](https://www.comparitech.com/net-admin/solarwinds-npm-vs-datadog/)\n\
    \n*   [https://blog.danslimmon.com/2019/05/03/no-observability-without-theory/](https://blog.danslimmon.com/2019/05/03/no-observability-without-theory/)\n\
    \n*   [https://levelup.gitconnected.com/prometheus-counter-metrics-d6c393d86076](https://levelup.gitconnected.com/prometheus-counter-metrics-d6c393d86076)\n\
    \n*   [https://grafana.com/docs/grafana/latest/fundamentals/intro-histograms/](https://grafana.com/docs/grafana/latest/fundamentals/intro-histograms/)"
