    # [Retries](#toc.xhtml#s203a)


    As discussed in the previous chapters, in microservices architecture, the common
    communication between services is through API calls. Eventually, API calls will
    fail, and we must handle these failures. A simple retry can often solve the issue
    and decrease the error rate significantly (unless this is a bug that will occur
    anyway). A good practice is to perform approximately two retries (in addition
    to the first try). The number of retries still depends on the use case, which
    can be 0 or more.


    Another good practice is to wait between each retry using an exponential backoff
    algorithm. The exponential backoff algorithm is a strategy used to gradually increase
    the delay between retry attempts in case of failures, reducing the load on the
    system and improving the chances of successful communication.


    For example, the waiting time between each retry is 1,2,4,8,16, and so on. Let’s
    see an example of exponential back-off retries in action in Golang.


    `func main() {`


    `err := Retry(3, time.Second, func() error {`


    `fmt.Println(“trying…”)`


    `return fmt.Errorf(“some error”)`


    `})`


    `if err != nil {`


    `fmt.Printf(“error: %s\n”, err)`


    `}`


    `}`


    `func Retry(attempts int, sleep time.Duration, f func() error) (err error) {`


    `currentAttempt := 1`


    `for {`


    `err = f()`


    `if err == nil {`


    `return nil`


    `}`


    `if currentAttempt >= attempts {`


    `return fmt.Errorf(“after %d attempts, last error: %w”, attempts, err)`


    `}`


    `time.Sleep(sleep)`


    `sleep *= 2`


    `currentAttempt++`


    `}`


    `}`


    `The output:`


    `trying…`


    `trying…`


    `trying…`


    `error: after 3 attempts, last error: some error`


    In the preceding example, there is a specific implementation of exponential back-off
    retries. We can implement retries in many other forms. For example, we can also
    write a specific retries mechanism for requests between services.


    # [Fallback](#toc.xhtml#s204a)


    In a scenario where we can experience a failure, we must handle that failure.
    We can try to perform retries like in the previous section. However, it can’t
    always solve the problem, and we need a fallback that we can trust. Fallback is
    a known function executed without any error or a previous functionality we can
    trust. In the worst case, a `fallback` will inform the user that something went
    wrong.


    `func main() {`


    `result, err := performOperation()`


    `if err != nil {`


    `// Fallback operation in case of an error`


    `result = fallbackOperation()`


    `}`


    `fmt.Println(“Result:”, result)`


    `}`


    `func performOperation() (string, error) {`


    `return “”, fmt.Errorf(“Operation failed”)`


    `}`


    `func fallbackOperation() string {`


    `return “Fallback result”`


    `}`


    In the preceding example, we showed a simple way to perform fallback. We try to
    use the `performOperation()` function. Still, unfortunately, it has an error,
    so we use a fallback function called `fallbackOperation()`, which has a constant
    result.


    # [Circuit Breaker](#toc.xhtml#s205a)


    A circuit breaker is a design pattern used to enhance the resilience and stability
    of distributed systems, in our case — microservices architecture. It helps prevent
    cascading failures (failure of one service causes many services to fail, like
    dominoes) by detecting and handling faults in a controlled manner.


    The circuit breaker monitors the availability of a service and, if it detects
    a certain threshold of failures, “*opens*” the circuit, preventing further calls
    to the failing service. This allows the system to gracefully handle failures,
    reduce load on the troubled service, and prevent degradation of the entire system.
    There are several ways to implement a circuit breaker, but using an existing library
    like [https://github.com/sony/gobreaker](https://github.com/sony/gobreaker) is
    recommended.


    Let’s dive deep into the logic and behavior of this pattern. There are three states
    that the circuit breaker can have: Closed, Open, and Half-Open.


    # [Closed](#toc.xhtml#s206a)


    This is also the initial state of the circuit breaker.


    ![](OEBPS/images/Figure-9.2.jpg)


    **Figure 9.2:** Circuit Breaker in Closed State


    In this state, the circuit breaker allows requests from service A to service B.
    While doing so, the circuit breaker monitors the number of failures by defined
    periods (10 failures per minute, for example). If the number of failures in a
    period exceeds the defined threshold, the state becomes Open.


    # [Open](#toc.xhtml#s207a)


    *[Figure 9.3](#c09.xhtml#fig9_3)* shows the open state:


    ![](OEBPS/images/Figure-9.3.jpg)


    **Figure 9.3:** Circuit Breaker in Open State


    In this state, the circuit breaker will block any request from service A and return
    an error response to service A. Meanwhile, service B won’t receive any requests.
    The circuit breaker will remain open until a defined timeout period ends. Then,
    it will go into Half-Open state.


    # [Half-Open](#toc.xhtml#s208a)


    *[Figure 9.4](#c09.xhtml#fig9_4)* depicts the half-open state:


    ![](OEBPS/images/Figure-9.4.jpg)


    **Figure 9.4:** Circuit Breaker in Half-Open State


    In this state, the circuit breaker will allow limited requests to go from service
    A to service B. If those limited number of requests are successful, the circuit
    breaker will switch again to a Closed state.


    # [Bulkhead](#toc.xhtml#s209a)


    Like the circuit breaker pattern, the bulkhead pattern aims to keep the system
    resilient and avoid cascading failures. This pattern is inspired by ship bulkheads
    that compartmentalize sections to avoid water leaks.


    ![](OEBPS/images/Figure-9.5.jpg)


    **Figure 9.5:** Ship bulkheads


    In software, bulkhead pattern isolates components or services, limiting the impact
    of failures in one service from affecting others. This pattern is instrumental
    in concurrent (at the service level) or distributed systems (at the system level),
    where it helps maintain system stability by isolating and controlling the failures
    within distinct services, minimizing the risk of cascading failures.


    We implement a bulkhead pattern at the system level by deploying multiple replicas
    per workload. It is essential to have as many truly isolated service instances
    as possible. Take cache as an example; we would prefer to have a separate cache
    per replica instead of a single cache for all replicas. Now, a problem caused
    by one replica will affect all the other replicas (through the cache).


    At the service level, we’ll want goroutines to operate with as minimal dependencies
    as possible between them. Moreover, we’ll often want to limit the number of concurrent
    goroutines to avoid a lot of load on the service, leading to its collapse. We
    have already seen the usage of waiting for concurrent goroutines to finish using
    `sync.WaitGroup`. However, we didn’t enforce a hard limit regarding the maximum
    number of concurrent goroutines. A good implementation for limiting the number
    of goroutines can be using a package called `sizedwaitgroup` - [https://github.com/remeh/sizedwaitgroup](https://github.com/remeh/sizedwaitgroup).
    Let’s see how to use it.


