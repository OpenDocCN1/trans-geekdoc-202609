    # [Brief History of Microservices](#toc.xhtml#s3a)


    Let’s start by saying that many people claim they have the right to invent the
    microservices architecture. According to Wikipedia, the first person who mentioned
    something similar to microservices was Fred George in 2004. He worked on architecture
    that he called “*Bayesian Principles*”. In 2005, Peter Rodgers introduced the
    term “Micro-Web services” at the Web Services Edge conference. Many individuals
    can claim that they invented it because there isn’t a clear definition of a microservices
    architecture. Since then, many people have presented things that look like or
    feel like microservices. It is important not to confuse between microservices
    and SOA, which we will later detail the difference between them. Since then, its
    popularity increased over the years and accelerated between 2014 and 2015 (*[Figure
    1.1](#c01.xhtml#fig1_1)*).


    ![](OEBPS/images/Figure-1.1.jpg)


    **Figure 1.1:** Microservices searches over the web by Google Trends


    A note on Google Analytics: This is a great free online tool. It can primarily
    be utilized for entertainment, as observing trends is fascinating. It is highly
    valued for exploring subjects and aggregating information.


    # [Monolithic, SOA, and Serverless](#toc.xhtml#s4a)


    It is helpful to know the other alternatives to some terms or technologies to
    have a clear understanding of them. The common architecture styles used for a
    while from the early days of the software industry are Monolithic, “*Service-Oriented
    Architects,”* aka SOA, and some other architecture we won’t elaborate on in this
    book.


    # [Monolithic](#toc.xhtml#s5a)


    “*Mono”* from ancient Greek means solo, single. As the name suggests, this architecture
    is structured as a single block of code deployed on a single platform. Usually,
    in a monolith architecture, there are three main parts - storage (DB), web app
    with client-side, and backend that acts as server-side, which contains all the
    business logic, data layer, and everything *([Figure 1.2](#c01.xhtml#fig1_2)).*


    ![](OEBPS/images/Figure-1.2.jpg)


    **Figure 1.2:** Simple Monolith Structure


    DAL is an acronym for Data Access Layer. This software middleware is responsible
    for giving software layers that have direct access to the DB and provide tools
    like retries, error handling, cache, and so on.


    As we can see from the simple diagram, this architecture is straightforward. However,
    all the components are strongly interdependent.


    In a nutshell, these are the pros and cons of a monolith:


    **Pros**


    *   Simple to develop and simple to deliver to production.


    *   Minimum amount of hops: No need to communicate between one service to another,
    and we can save a lot of time by decreasing the latency, which leads to better
    performance.


    *   Very easy to implement the DRY principle (don’t repeat yourself) — due to
    the single codebase.


    **Cons**


    *   **Spaghetti code**: As the codebase is extending, the code has more potential
    to be cumbersome.


    *   **Harder to troubleshoot and debug**: Navigating a large codebase can be challenging.
    Even harder to find a malicious bug that caused a side effect in a hidden function
    somewhere.


    *   **IDE**: The integrated development environment (IDE) is overwhelmed. Note
    that there is an approach for writing microservices in a Monorepo, a single repository
    for all the services.


    *   **Easy to gain legacy code and technologies**: We are afraid to change core
    functionalities, infrastructure, and technologies in a large codebase. These changes
    can dramatically affect the application because keeping old code and old technologies
    is convenient.


    Nowadays, microservices architecture is the most famous in the market, and people
    tend to reject monolith architecture because they think it is outdated. However,
    Monolith architecture can benefit in various use cases.


    # [SOA](#toc.xhtml#s6a)


    SOA stands for Service-Oriented Architecture. While the name might be misleading
    compared to microservices, they do have commonalities. However, there are a lot
    of differences between them. SOA is an architectural style that organizes software
    systems as a collection of loosely coupled and reusable services. In SOA architecture,
    there are two main parts - providers and consumers. The provider and consumer
    can be on the same deployable component/application/server. This is the significant
    difference between SOA and microservices. This approach was developed in the early
    90s. In those times, the operation part of software engineering was more intricate.
    We had specialized teams focused on infrastructure, security, databases, and so
    on.


    We would place the SOA architecture between the monolith architecture and the
    microservices architecture at the decomposition level. Monolithic architecture
    behaves as a single unit, while microservices architecture behaves as a fine-grained
    division.


    ![](OEBPS/images/Figure-1.3.jpg)


    **Figure 1.3:** Simple SOA Structure


    In a nutshell, these are the pros and cons of SOA:


    **Pros**


    *   **Reusability**: Reusability is the core of this approach. It allows us to
    separate concerns at the service/API level and reuse infrastructure, such as hardware,
    network, OS, and more.


    *   **Separation of concerns**: It isn’t fine-grained as microservices. Still,
    it allows us to parallel and deliver our service/API without depending on other
    teams.


    **Cons**


    *   **Side effects**: Issues in shared components can affect other components.
    For example, if the consumer or provider consumes too many resources, if some
    environment variables change, or any other side effects, all of these can easily
    affect all existing services.


    *   **Performance Overhead**: The additional layers of abstraction and communication
    protocols in SOA can introduce performance overhead. Service invocations across
    different components and networks may cause latency, potentially impacting response
    times, and overall system performance. The concerns of network issues are also
    the same concerns for DBs.


    *   **Complexity** : Implementing SOA can introduce complexity to our services.


    # [Serverless](#toc.xhtml#s7a)


    This architectural approach is the most modern architecture from the ones we presented
    here.


    Naturally, the cloud’s creation led to a serverless architect’s creation. The
    core of this approach is to extract infrastructure concerns and leave us with
    doing the things that matter - business logic. As the name implies, this is “server”
    + “less” - meaning no server exists. Of course, there is infrastructure and a
    server somewhere that runs the code. But we are not responsible for managing this
    server. The cloud vendor is responsible for all that work. Examples of such technologies
    are the Functions service of GCP or Lambda of AWS. And many more services/products
    aim to support the serverless architecture.


    Before examining the pros and cons of serverless architecture, we want to discuss
    two core concepts: FaaS and Bass.


    *   **FaaS**: Stands for functions as a service. We write our function/API endpoint
    and let the cloud do all the other work.


    *   **BaaS** : Stands for backend as a service. We can concentrate solely on developing
    and maintaining the clients and not on storage, database management, networking,
    and other infrastructure aspects.


    ![](OEBPS/images/Figure-1.4.jpg)


    **Figure 1.4:** Simple Serverless Structure


    As we can see from the diagram, we, as developers, only wrote the green blocks
    (Function), and the cloud vendor provided all the yellow blocks (third-party service/DB).


    **Pros**


    *   **Highly efficient development process**: The development process is highly
    efficient, with rapid initial development. Infrastructure concerns are no longer
    a burden, as the serverless architecture seamlessly manages them.'
