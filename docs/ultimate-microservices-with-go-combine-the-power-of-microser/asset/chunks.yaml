    # [CI/CD](#toc.xhtml#s200a)\n\nCI/CD, which stands for continuous integration\
    \ and continuous delivery (or continuous deployment), is not just a set of tools;\
    \ it’s a cultural shift that empowers teams to deliver better software faster\
    \ and more reliably.\n\nBefore the DevOps era, the application and software release\
    \ cycle was monthly, quarterly, annually, and even longer. In the DevOps era,\
    \ due to CI/CD culture, integrating a new code life cycle is much faster — it\
    \ can be a few releases in a single day or a few releases every hour. As developers,\
    \ as fast as we deliver our code and integrate it with the real world (production\
    \ environment), we can gain a faster feedback loop and, therefore, detect bugs,\
    \ fixes, and improvements faster.\n\n*   **Continuous Integration (CI):** Focuses\
    \ on frequent code integration and automated testing.\n\n*   **Continuous Delivery\
    \ (CD):** Adds automated packaging deployment to environments such as production\
    \ and staging.\n\n*   **Continuous Deployment (CD):** Releases changes directly\
    \ to production without manual intervention\n\n![](OEBPS/images/Figure-9.1.jpg)\n\
    \n**Figure 9.1:** CI/CD lifecycle\n\nThe preceding figure describes the CI/CD\
    \ pipeline’s lifecycle with the general steps included inside.\n\nIn particular,\
    \ CI refers to the process before the point of deploying the code to production.\
    \ The figure represents the blue colors (plan, code, build, and test). The CI’s\
    \ main job is to package and test the code. If the CI is adequately passed, it\
    \ will continue to the CD. CD refers to deploying the code into other environments\
    \ (mainly production). The CD process strives to be fully automated and without\
    \ any manual interaction.\n\nVarious market tools help create CI/CD pipelines,\
    \ such as Jenkins, GitHub actions, CircleCI, and more. As developers, we won’t\
    \ create these pipelines but must be aware of them and ensure our code is being\
    \ tested, built, and deployed as we want.\n\nUsing CI/CD pipelines is crucial\
    \ in a microservices architecture for two main reasons:\n\n*   **Maintaining Consistency:**\
    \ A consistent and automated deployment process ensures that all the services\
    \ can continue working together seamlessly.\n\n*   **Scalability:** As the system\
    \ grows, the number of services will increase. Usually, increasing the number\
    \ of services will increase the amount of work linearly. However, due to CI/CD,\
    \ the amount of work will be much less when more services are added.\n\n# [Design\
    \ of Failures](#toc.xhtml#s201a)\n\nWhen deploying an application into production,\
    \ there is fog and uncertainty regarding how it will act. Although our code passed\
    \ unit tests or even a smoke test, it is possible and common for our application\
    \ to encounter bugs and errors. We need to be prepared for those scenarios. We’ll\
    \ discover several valuable ways and design patterns to handle failures while\
    \ having RESTful API services in a microservices architecture.\n\n# [Timeouts](#toc.xhtml#s202a)\n\
    \nTimeouts are essential for any service that needs to send a request to another\
    \ service or if it needs bound execution time for some piece of software. We’ll\
    \ often use timeouts when sending a request from one service to another. Using\
    \ timeouts, we avoid unnecessary on-flight requests that can overload the services.\
    \ The timeout time differs between each service, usually between 10 and 60 seconds\
    \ with an average of 30 seconds, but it depends on the scenario and basically\
    \ can be any selected time limit. Let’s see an example of implementing timeouts\
    \ in Golang.\n\n*\\*\\* Disclaimer—The timeout is arbitrary, and the number I\
    \ gave is from my POV as an engineer. It can defer, be a maximum of 5 seconds,\
    \ or last a few minutes.*\n\nThe following examples illustrate how to implement\
    \ timeouts in Go using channels. In the first example, a timeout occurs, while\
    \ in the second example, it does not. We begin by creating a channel with a capacity\
    \ of 1, followed by a goroutine that simulates a delay and then sends a message\
    \ to the channel. After the goroutine is launched, we use a select statement to\
    \ either print the result from the channel if it arrives before the timeout or\
    \ print “`Timeout`” if the timeout is reached first:\n\n`// Example with timeout`\n\
    \n`resultCh := make(chan string, 1)`\n\n`go func() {`\n\n`time.Sleep(3 * time.Second)`\n\
    \n`resultCh <- “Received before timeout”`\n\n`}()`\n\n`select {`\n\n`case res\
    \ := <-resultCh:`\n\n`println(res)`\n\n`case <-time.After(2 * time.Second):`\n\
    \n`println(“Timeout”)`\n\n`}`\n\n`// Output: Timeout`\n\n`// Example without timeout`\n\
    \n`resultCh = make(chan string, 1)`\n\n`go func() {`"
