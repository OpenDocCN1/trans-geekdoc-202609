- raw: 'In a microservices architecture, the way for services to communicate between
    them, as we said, is through APIs. Whenever a service needs to send an API request,
    it must determine the targeted service’s network location (IP address and port).
    Each service may have several instances due to system requirements (each server
    has limitations to how many requests he can handle concurrently). Each service
    instance has a different network location (IP address and port). In the dynamic
    cloud environment, the network location of each service instance is temporary
    and changing urgently due to updates, scaling, failures, and so on. We need assistance
    identifying the existing service instances and their corresponding network locations.


    The solution for this problem is the service discovery. The service discovery
    pattern lets a service know the network location of the requested service instance.
    The requested service can start communicating with the desired service when he
    learns the service network location. There are two patterns for implementing service
    discovery, as follows:


    *   Client-side discovery


    *   Server-side discovery


    # [Client-Side Discovery](#toc.xhtml#s116a)


    The client determines the requested service’s instance network location using
    this pattern. The requesting service sends a request to a known storage that keeps
    each service’s network locations. The so-called `service registry` is the storage
    that owns the network locations of all service instances.


    ![](OEBPS/images/Figure-6.4.jpg)


    **Figure 6.4:** Service discovery via client-side discovery


    The `Requesting Service Instance` asks the service registry for the network locations
    of `ServiceA` instances via the HTTP request. The service registry has the network
    locations of the `ServiceA` instance. The service instances are responsible for
    sending their network locations to the service registry. After the `Requesting
    Service Instance` gets the network location, he can request every `ServiceA` instance
    he wishes. In the preceding figure, we request the instance with the address `1.2.3.4:5555`.


    The main drawback of this pattern is that we must implement a complex logic of
    load balancing and discovery logic on the client side, which means that we must
    duplicate the logic for each programming language.


    # [Server-Side Discovery](#toc.xhtml#s117a)


    This Server-Side Discovery pattern is the more prevalent of the two. In this pattern,
    all the “*problems*” are transferred to a load balancer, which counts as the “*Server*.”
    The client sends a request to the load balancer, and the load balancer acts like
    the client in the client-side discovery pattern.


    ![](OEBPS/images/Figure-6.5.jpg)


    **Figure 6.5:** Service discovery via server-side discovery


    All the functionality regarding load balancing is in the `Load Balancer` instead
    of the client. This pattern separates the discovery logic from the `Requesting
    Service Instance` to the `Load Balancer`, which is the main advantage of this
    pattern.


    NGINX, AWS ALB, and AWS ELB are popular load balancers that can act as server-side.
    In *[Chapter 8, Introduction to Kubernetes](#c08.xhtml)*, we will discuss Kubernetes,
    which has implemented a service discovery pattern using the server-side approach.


    # [Service Registry](#toc.xhtml#s118a)


    We already mentioned the service registry components while discussing client-side
    and server-side approaches. The service registry is a database containing all
    the service instances’ network locations. It exposes the ability of service instances
    to register/unregister their network locations and delegates the job of network
    location registration to the service instances.


    Moreover, the service registry requires them to send their heartbeat to determine
    if instances are still alive and can accept traffic. As we can see, there isn’t
    an explicit service registry in Kubernetes; instead, Kubernetes leverages existing
    storage - etcd. Kubernetes has an internal logic that registers instances’ network
    locations to etcd. Etcd is used for that purpose and has many other usages by
    Kubetenes. Etcd, in general, is a highly available, distributed, consistent key-value
    storage.


    # [Load Balancer](#toc.xhtml#s119a)


    A load balancer is a crucial component of any software architecture. On the one
    hand, we have various clients who wish to request a service from our system. On
    the other side, our dynamic and changing environment composes our services. Our
    environment can be highly dynamic due to version updates, failures, load, and
    many reasons. Between those two sides stands the load balancer, a policeman who
    routes the traffic.


    The load balancer is responsible for regulating and distributing the network traffic
    among the existing servers and doing it effectively. It should know which services
    are currently available and which aren’t. Understanding the services’ availability
    can direct new requests and redirect existing requests from a faulty service to
    an operating service. It ensures the availability and reliability of all services.


    As mentioned, the service discovery server can act as a load balancer, and the
    API gateway can serve as the service discovery. Therefore, the API gateway can
    be a load balancer. When talking about load balancers, the primary intention is
    the ability to distribute requests to available services. Request distribution
    can be highly complex, and we will give examples of different use cases and algorithms
    in a second.


    There are various types of load balancers. This section of the book mainly describes
    L7 load balancers. A trendy way to divide different groups of load balancers is
    by L4 and L7. L4 load balancers are for the transport layer and focus on network
    layers like IP addresses and ports, while L7 load balancers concentrate on the
    application layer. Nowadays, there is no need to write a load balancer. Various
    load balancers, such as NGINX, HAProxy, AWS ELB, and AWS ALB exist.


    This expansive subject could also fill an entire book with discussion. It is important
    to emphasize that load balancers are **necessary** and, luckily, easy to operate
    (usually). Unless we wish to write a load balancer or contribute to an existing
    project, we should focus on knowing only how to deploy, troubleshoot, and use
    it. The usage and configuration vary from one load balancer to another, and we
    can usually find an online guide that will walk us through how to deploy it.


    The next point to understand is the algorithm governing the load balancer. We
    can configure a load balancer to our specific needs and requirements. Each load
    balancer technology has a variety of algorithms. Eventually, selecting the appropriate
    load balancer algorithm is essential for meeting our system requirements. Here
    are some widely used algorithms for load balancing:


    *   **Round Robin:** The request is distributed sequentially, one after another,
    in a loop. Round Robin is the most common and straightforward algorithm.


    *   **Least Connections:** The server with the lowest number of connections gets
    the next request.


    *   **Least Time:** A formula that calculates a combination of the number of connections
    and response time; the server that is faster and has a lower number of connections
    gets the next request.


    *   **Hash:** A key definition for distributing the request. The key definition
    can be the URL path, encoding type, port, IP address, and so on.


    *   **Random with Two Choices:** Choose two servers using an algorithm (Least
    Connections, Least Time, or something else), and select one randomly.


    There are benefits and drawbacks to every algorithm. When choosing a load balancer
    algorithm, we should investigate and seek the best algorithm that suits our system.
    Other configurations can also benefit our system.


    # [Database per Service](#toc.xhtml#s120a)'
