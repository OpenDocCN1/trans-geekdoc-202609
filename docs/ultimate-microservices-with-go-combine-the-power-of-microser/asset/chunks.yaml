- raw: 'As we mentioned before, one of the significant disadvantages of using microservices
    architecture is the operations overhead that comes with it. In my opinion, this
    is the main reason why microservices weren’t prevalent before. The ROI (aka for
    range of investment) was not worth it! Cloud computing technologies have made
    our lives much more straightforward in many ways, but the major one is the operations
    area. So suddenly, building microservices architecture using cloud computing resources
    sounds like a good ROI.


    The next trend we want to look at is the Docker Engine.


    Generally, containerization was invented long before docker. Docker was a critical
    player that led us to use containerization; nowadays, it is so easy and accessible.
    Docker was launched in 2013 and was very popular right away. *[Figure 1.6](#c01.xhtml#fig1_6)*
    shows Docker searches trend by Google Trends:


    ![](OEBPS/images/Figure-1.6.jpg)


    **Figure 1.6:** Docker searches over the web by Google Trends


    One of the core benefits of microservices is that they can deliver independent
    workloads/deployment. Docker aims to deliver software as isolated containers.
    Microservices aim to deliver isolated software, and no matter how, running containers
    using the docker engine is perfect.


    The last trend we want to talk about is DevOps methodology. It is weird to call
    it methodology, but this is what it is. Nowadays, it has become a job title. There
    are also very similar jobs that do similar things, such as SRE, Production Engineer,
    and more. Again, as we mentioned before, the major drawback of microservices is
    the operations overhead. The DevOps methodology comes to solve it, or at least
    to decrease it.


    # [Popularity of Golang](#toc.xhtml#s19a)


    A metric we can follow to see the popularity of Go is the increase in Golang users—developers,
    or we should call them Gophers. The nickname for Golang developers is Gophers.
    The gopher is an animal that counts as the official mascot of the Golang programming
    language. Here is a friendly dashboard from StackOverflow insights where we can
    see the percentage of developers who want to learn Golang and become professional
    developers in Go.


    ![](OEBPS/images/Figure-1.7.jpg)


    **Figure 1.7:** Most wanted languages by StackOverflow insights


    Moreover, another metric we would love to follow is the number of packages written
    in Go. This number of packages written in Go has already passed 1 Million packages
    (the data from July 2023). We link to an excellent website that collects data
    regarding open-source insights in the references at the end of the chapter. We
    highly recommend taking a look at it. If we compare the age and amount of packages
    written in Go versus other languages like Java, Python, or C#, Go leads right
    after JavaScript. That is unbelievable. The crazy amount of packages writing in
    Go came from the strong Golang community.


    # [Conclusion](#toc.xhtml#s20a)


    In this chapter, we took a short trip around microservices. We observed its history
    and what were the trends (Agile, cloud computing, Docker, DevOps) that led microservices
    to be so popular nowadays. We learned about the alternatives for microservices
    such as SOA, Monolith, and serverless. There are other alternatives in the market,
    but these are the most popular ones. We compared microservices’ pros and cons
    and other architectures’ pros and cons.


    In the next chapter, we will talk about the usability of Golang. We will discuss
    the community and detail why we think and why the community thinks Go has become
    so popular in recent years. We will cover the ecosystem around Go and deep dive
    into why this language was invented in the first place. And what is the history
    from there until today? Finally, we will discuss the pros and cons of using Go.


    # [References](#toc.xhtml#s21a)


    *   [https://deps.dev/](https://deps.dev/)


    *   [https://insights.stackoverflow.com/survey/2021?\_ga=2.236209345.190202062.1628102352-126161871.1625855113#most-loved-dreaded-and-wanted-language-want](https://insights.stackoverflow.com/survey/2021?_ga=2.236209345.190202062.1628102352-126161871.1625855113#most-loved-dreaded-and-wanted-language-want)


    *   [https://trends.google.com/trends/explore?date=all&q=microservices&hl=en-GB](https://trends.google.com/trends/explore?date=all&q=microservices&hl=en-GB)


    *   [https://agilemanifesto.org/](https://agilemanifesto.org/)


    *   [https://trends.google.com/trends/explore?date=all&q=docker&hl=en-GB](https://trends.google.com/trends/explore?date=all&q=docker&hl=en-GB)


    # [CHAPTER 2](#toc.xhtml#c02)


    # [Usability of Go](#toc.xhtml#c02)


    # [Introduction](#toc.xhtml#s22a)


    In this chapter, we’ll delve into the incredible world of Go. We’ll delve into
    the fundamentals, examine the history, and understand why the inventors wanted
    to invent this language. What was the intention behind creating such language,
    and what was it aimed for?


    To understand Go, we aim to understand its core principles, paradigms, purposes,
    and so on. By understanding them, we will have the power to see the whole picture
    while writing code in Go. Many inexperienced Go developers start to write in Go
    and get annoyed by the error-handling technique. If they clearly understand the
    core principles, they will realize why Go’s current error-handling manner is the
    precise solution.


    We’ll elaborate on each one of the core principles, understand their intention,
    and profit from their advantages. Then, we will observe on top of the process
    of newcomers to the language, from their onboarding until they upload their code
    to production.


    Then, we will explore the Golang ecosystem. The ecosystem is a giant creature
    composed of many communities and Gophers. Since Golang is an open source maintained
    by Google, the adoption to join the community is enormous.


    There is no need for prior knowledge of Go. It is suggested to revisit this chapter
    after gaining more experience as a Go developer. Many of the points we’ll cover
    here may resonate better with you. A quote from “*Effective Go*” — “*In other
    words, to write Go well, it’s important to understand its properties and idioms.*”


    # [Structure](#toc.xhtml#s23a)


    In this chapter, we will discuss the following topics:


    *   Invention of Go


    *   Core Principles and Paradigms


    *   Simplicity and Minimalist Design Approach


    *   A Fast Language that is Suitable for the Cloud


    *   Maintainability of Go


    *   From Onboarding to Production


    *   Go’s Ecosystem — The Communities and Beyond


    # [Invention of Go](#toc.xhtml#s24a)


    So how was this language started? It all begins with Google. In 2007, three folks
    from Google decided to create a new language. The language was designed by Ken
    Thompson, Rob Pike, and Robert Griesemer, each bringing distinct yet related backgrounds
    to the table. They were involved in significant technological inventions such
    as UTF-8, Unix, C programming language, and so on. The full name of the language
    is Golang, which is a combination of “*go*” + “*lang*,” in which “*lang*” is a
    shortcut for language. Instead, they prefer to call it Go and not Golang to emphasize
    that the language intends to be simple and memorable. The word “*Go*” is a common
    English term that implies movement, progress, and efficiency, which aligns with
    the language’s purpose of providing a simple and efficient approach to software
    development. Also, “*Go*” are the first two letters of Google.


    After getting the green light from Google, they started developing the language.
    One of their core internal agreements is that they will only include programming
    principles they all agree on. Although this language was invented in 2007, it
    was influenced mainly by the C programming language, which was created in 1972,
    and not by newer languages like C++, Java, C#, and so forth. There are many similarities
    between Go and C programming languages. Indeed, some people refer to Go as the
    modern version of C.


    They started writing the programming language in Go, C++, and Assembly.'
