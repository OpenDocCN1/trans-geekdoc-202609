    # 微服务架构中的服务发现与负载均衡


    在微服务架构中，正如我们所说，服务之间的通信方式是通过 API。每当一个服务需要发送 API 请求时，它必须确定目标服务的网络位置（IP 地址和端口）。由于系统需求（每台服务器能并发处理的请求数有限），每个服务可能有多个实例。每个服务实例都有不同的网络位置（IP
    地址和端口）。在动态云环境中，由于更新、扩缩容、故障等原因，每个服务实例的网络位置是临时且频繁变化的。我们需要帮助来识别现有的服务实例及其对应的网络位置。


    解决此问题的方案是**服务发现**。服务发现模式让服务知道被请求服务实例的网络位置。当请求服务得知服务网络位置后，即可开始与目标服务通信。实现服务发现主要有两种模式：


    *   客户端发现

    *   服务端发现


    ## 客户端发现


    客户端使用此模式确定被请求服务实例的网络位置。请求服务向一个已知的存储发送请求，该存储保存着每个服务的网络位置。所谓的 `service registry`（服务注册表）即拥有所有服务实例网络位置的存储。


    ![图 6.4：通过客户端发现进行服务发现](img/Figure-6.4.jpg)


    **图 6.4：** 通过客户端发现进行服务发现


    `Requesting Service Instance`（请求服务实例）通过 HTTP 请求向服务注册表询问 `ServiceA` 实例的网络位置。服务注册表拥有
    `ServiceA` 实例的网络位置。服务实例负责将其网络位置发送给服务注册表。`Requesting Service Instance` 获取网络位置后，即可请求其想要的每个
    `ServiceA` 实例。在上图中，我们请求地址为 `1.2.3.4:5555` 的实例。


    该模式的主要缺点是我们必须在客户端实现复杂的负载均衡和发现逻辑，这意味着必须为每种编程语言复制一套逻辑。


    ## 服务端发现


    服务端发现模式是两者中更流行的一种。在此模式中，所有“问题”都转移给负载均衡器，它充当“服务端”的角色。客户端向负载均衡器发送请求，负载均衡器的行为类似于客户端发现模式中的客户端。


    ![图 6.5：通过服务端发现进行服务发现](img/Figure-6.5.jpg)


    **图 6.5：** 通过服务端发现进行服务发现


    所有关于负载均衡的功能都在 `Load Balancer`（负载均衡器）中，而非客户端。该模式将发现逻辑从 `Requesting Service Instance`（请求服务实例）分离到
    `Load Balancer`（负载均衡器），这是该模式的主要优势。


    `NGINX`、`AWS ALB` 和 `AWS ELB` 是常见的可充当服务端的负载均衡器。在*第 8 章 Kubernetes 简介*中，我们将讨论 Kubernetes，它使用服务端方法实现了服务发现模式。


