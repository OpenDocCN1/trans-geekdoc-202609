    # [简介](#toc.xhtml#s22a)


    在本章中，我们将深入探索 Go 的精彩世界。我们将深入研究基础知识，考察其历史，并理解发明者创建这门语言的初衷。创建这门语言的意图是什么？它旨在解决什么问题？


    为了理解 Go，我们旨在理解其核心原则、范式、目的等。通过理解它们，我们将拥有在编写 Go 代码时洞察全局的能力。许多缺乏经验的 Go 开发者开始编写 Go
    代码后，会对错误处理技术感到恼火。如果他们清楚地理解核心原则，就会意识到 Go 当前的错误处理方式才是精确的解决方案。


    我们将详细阐述每一条核心原则，理解其意图，并从中获益。然后，我们将观察新手接触该语言的过程，从入职到将代码部署到生产环境。


    接着，我们将探索 Golang 生态系统。生态系统是一个由众多社区和 Gophers 组成的庞大有机体。由于 Golang 是由 Google 维护的开源项目，加入社区的门槛非常低。


    无需具备 Go 的先验知识。建议在积累更多 Go 开发经验后重读本章。我们将涵盖的许多观点届时会与你产生更强的共鸣。引用自《Effective Go》：“*换句话说，要写好
    Go，理解其特性和习惯用法非常重要。*”


