- raw: '*   **Easy to scale**: The scaling process is very straightforward - the only
    things we should worry about are the resources a function uses.


    **Cons**


    *   **Vendor lock**: Once we use a specific vendor, all the configurations and
    settings are specifically for our services. Transferring to another vendor can
    be very painful.


    *   **Edge cases**: There are some scenarios when we want to do something but
    can’t due to the limitations of the vendor services that we use.


    *   **Monitoring**: Since we rely on the vendor to take care of the infrastructure,
    we also need to rely upon him to provide monitoring tools or integrate other SaaS/OSS
    monitoring tools.


    The cost of serverless architecture is controversial. In serverless architecture,
    we pay per usage, usually for CPU and memory. We have a lean billing model, and
    the method of using it is simple. More than that, it goes without saying that
    we save money on fewer DevOps, operations, and infrastructure engineers. However,
    other opinions say doing these things ourselves will save money, arguing that
    we don’t have the flexibility to utilize our specific architecture and operation.


    # [Benefits of Microservices](#toc.xhtml#s8a)


    The following figure generally describes how microservices look, and we already
    can see the difference between this architecture and the other architectures.


    ![](OEBPS/images/Figure-1.5.jpg)


    **Figure 1.5:** Simple Microservices Structure


    # [Independent Workloads](#toc.xhtml#s9a)


    By design, microservices architecture splits the architecture into separated services/
    APIs/ components. These services are delivered and packaged individually within
    self-contained deployable units. The self-contained units principle is one of
    the significant differences between SOA and microservices. The separation of many
    workloads decreases the size of the codebase, which leads to more minor services.


    Minor services mean lean binary, fast build, and so on. Another significant effect
    is that each workload doesn’t affect other workloads. We know the dependencies
    in advance, and this makes it effortless to deliver services as containers. Containerization
    is the best practice when it comes to microservices. Both of These concepts deliver
    the same goal—separation of concerns.


    Since the codebase is divided per service, there is no shared code (usually).
    Each team can work independently on its code without disrupting other teams. A
    separated codebase leads to breakneck initial development speed. Another effect
    is that each team can test its services without considering other teams’ services.


    # [Easy to Scale](#toc.xhtml#s10a)


    Let’s start by talking about vertical scale (scale up). Vertical scale means adding
    more resources (bigger machines). However, there isn’t always a direct correlation
    between resource consumption and the ability of the service to handle more load.
    Microservices architecture has become much more helpful when we want to perform
    horizontal scale (scale out). It is seamless to perform scale-out, just increasing
    the number of replicated machines/containers for the wanted machine.


    # [Plug and Play](#toc.xhtml#s11a)


    An exciting way to look at microservices is as a honeycomb structure. Each bee
    builds its cell. It is also elementary to replace one cell with another. The ability
    to replace a service with another service can become handy when we want to remodel
    our architecture, experiment with new technologies, or perform some tests in the
    current architecture. Also, the rollback/rollout processes become simple and easy.


    # [Fault Tolerance](#toc.xhtml#s12a)


    Failure is a typical scenario that always happens, and we should be prepared for
    this. We aren’t living in a perfect world where the code is perfect and the server
    has a 100% success rate. The microservices architecture made this preparation
    easier because of the loose coupling between the services. Each service can fail
    without affecting the other services. Also note that there are many other things
    to consider when talking about failure (retries, graceful shutdown, and more),
    and we will talk about that. But at least microservices set a ground base to handle
    failure properly without considering other services, making the work easier.


    # [Increase Agility](#toc.xhtml#s13a)


    In a nutshell, Agile - is the ability to work fast and to be flexible. There is
    a vast theory and techniques regarding how to be Agile, and we’ll discuss it further
    in this book.


    Each service has its codebase. A team can be responsible for one or more services
    without relying on or depending on other teams, which is a crucial capability
    for working with the Agile methodology. Also, when a new member joins the team,
    onboarding becomes effortless. They don’t need to learn all the service codes,
    only the services their team is responsible for.


    # [Drawbacks of Microservices](#toc.xhtml#s14a)


    Here are the drawbacks of microservices:


    # [Operations Overheads](#toc.xhtml#s15a)


    As we discussed before, the primary benefit of microservices is that each workload/deployment
    is independent and delivered separately from other services. We saw all the enormous
    advantages of this. But there is another side to the coin. To allow each service
    to deliver as a separate deployment, we need to support it from the operation
    side.


    There are many things to consider for each service — service configuration, packaging,
    separate tests, separate deliverable units, and so on. These examples emphasize
    that working with microservices requires much operation work compared to monolith
    or SOA.


    # [Complexity](#toc.xhtml#s16a)


    Naturally, with the increase in services and workloads comes the complexity of
    managing them all. The previous drawback of operation overhead is that it is just
    a specific use case of the complexity of microservices. Also, managing data and
    consistency becomes harder — the data is distributed among each service because
    each service has its database.


    Each team can write its services using its favorite or most relevant programming
    language. This ability has benefits and disadvantages. The operation must create,
    maintain, and tackle operations issues for all these programming languages.


    Moreover, switching developers between teams will be harder when each service
    is written in other programming languages.


    It isn’t a coincidence that we chose to write in this book about Kubernetes and
    how we will deploy the microservices architect on Kubernetes and not on other
    platform/s. The primary reason is that Kubernetes is coming to solve this complexity
    problem.


    # [Hard to Troubleshoot](#toc.xhtml#s17a)


    It is a continuation of the previous point. Due to the complexity of microservices,
    it is harder to gain visibility above it and create full observability. Many obstacles
    prevent us from reaching good visibility.


    # [Popularity of Microservices](#toc.xhtml#s18a)


    Various trends happened that led microservices to be so popular.


    The first and oldest of them is the Agile methodology. Although it is a pretty
    old methodology, Agile gained popularity merely when the Agile Manifesto was published
    (there is a link to it in the references). We highly recommend reading it; it
    exists in many languages and is very simple to read. Note that it doesn’t contain
    actual practices such as Scrum and Kanban. The Agile Manifesto is considered the
    doctrine of the Agile methodology.


    The Agile Manifesto makes us fast and flexible, so the microservices approach
    suits those reasons. It is easier and faster to deliver small software than one
    big piece, which the microservices architect allows us to do.


    The cloud computing industry is the second trend after the Agile Manifesto. The
    leading cloud vendor, AWS, launched in 2002. And from there, this is history;
    nowadays, using cloud computing is the go-to for many companies and projects.'
