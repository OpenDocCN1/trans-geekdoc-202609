- raw: "This section will cover the essentials of generics in Go and the points where\
    \ they differ from other languages. Generics exist for functions, structs, interfaces,\
    \ and maps. Generic behavior in Go is similar to other languages, but some differences\
    \ exist. We assume that the reader has a previous knowledge of Generics. By assuming\
    \ that, we won’t elaborate on the concept of Generics here.\n\nA good explanation\
    \ starts with the simplest example; here is a generic function:\n\n`func printIt[T\
    \ any](item T) {`\n\n`fmt.Println(item)`\n\n`}`\n\n`printIt(1)       // 1`\n\n\
    `printIt(“Hello”) // Hello`\n\nBy using `[` and `]` to declare the generic type\
    \ of the function, which in this case is `any` and represented by `T`. The only\
    \ thing that differs mainly from other languages with generics is `any` keyword.\
    \ Each generic representation (in the preceding example, `T`) must implement an\
    \ interface or constraints.\n\nFor constraints - there are two built-in constraints\
    \ - `any` and `comparable``.`\n\nFor interfaces - the Go team provided us with\
    \ a convenient package called `golang.org/x/exp/constraints``,` which gives us\
    \ common constraints interfaces for generics.\n\n1.  `Any`: Anything, meaning\
    \ each type, can fulfill this constraint.\n\n2.  `Comparable``:` Pertains to any\
    \ type, we can apply comparison operators such as `==` and `!=`. That map keys\
    \ must be comparable.\n\n3.  `Interfaces`: we can create our custom interface\
    \ as a constraint to our generic function; see the following example: \n\n   \
    \ `type Number interface {`\n\n    `int | float64`\n\n    `}`\n\n    `func bigger[T\
    \ Number, K any](a T, b T, prefix K) {`\n\n    `if a > b {`\n\n    `fmt.Println(prefix,\
    \ a)`\n\n    `return`\n\n    `}`\n\n    `fmt.Println(prefix, b)`\n\n    `}`\n\n\
    \    `bigger(1, 2, “The bigger integer is:”) // The bigger integer is: 2`\n\n\
    \    `bigger(3.0, 2.0, “The bigger float is:”) // The bigger float is: 3`\n\n\
    We declare a custom interface called `Number,` which includes two types using\
    \ the pipe symbol `|`. The other examples are similar to the first example.\n\n\
    We can also apply generic to structs. It can be advantageous to build a flexible\
    \ `struct` for many types. Let’s take an example of a storage `struct` that can\
    \ store an item and fetch that item.\n\n`type StorageInter[T any] interface {`\n\
    \n`GetItem() T`\n\n`StoreItem(T)`\n\n`}`\n\n`type Storage[T any] struct {`\n\n\
    `Item T`\n\n`}`\n\n`func (s *Storage[T]) GetItem() T {`\n\n`return s.Item`\n\n\
    `}`\n\n`func (s *Storage[T]) StoreItem(item T) {`\n\n`s.Item = item`\n\n`}`\n\n\
    The preceding code snippet has complex logic compared to the one we discussed\
    \ in the previous section. First, we declared a generic interface, which is possible\
    \ in Go. Then, we declared a simple generic struct with a property called `Item`\
    \ whose type is `T`, and the `T` constraint is `any`. Then, we implemented the\
    \ `StorageInter` interface functions signature. To make sure the struct implements\
    \ the interface, we declared the following line:\n\n`var _ StorageInter[int] =\
    \ &Storage[int]{}`\n\nIt is worth mentioning that this is a superb way in general\
    \ (regardless of Generics) to make sure that a struct fulfills an interface (declare\
    \ an empty variable - `“_”`). The usage of this function would look the same as\
    \ any usage of struct in Go. The only difference is that we need to instantiate\
    \ the type (`[int]`) because it is generics. To understand this in a better way,\
    \ let us discuss the following code examples:\n\n`var intStorage StorageInter[int]\
    \ = &Storage[int]{}`\n\n`intStorage.StoreItem(789)`\n\n`fmt.Println(intStorage.GetItem())`\n\
    \n`var stringStorage StorageInter[string] = &Storage[string]{}`\n\n`stringStorage.StoreItem(“This\
    \ is a string”)`\n\n`fmt.Println(stringStorage.GetItem())`\n\nIn the preceding\
    \ two examples, we illustrate how to use a generic `struct` in Golang. In the\
    \ first example, we apply the type of `int` to the `struct` `Storage`, and in\
    \ the second example, we apply the type of `string` to the `struct` `Storage`.\
    \ Because the signature of `StoreItem` function is `StoreItem(item T)`, we can\
    \ pass int the first example and pass string in the second example.\n\n# [Understanding\
    \ Context in Go](#toc.xhtml#s69a)\n\nIn Golang, Context is one of the Core pillars\
    \ that every Golang developer should know.\n\nThe Go team created a `Context`\
    \ package, which helps us manage context. It’s as simple as that. Behind the sense,\
    \ context is a struct. We can only observe its interface - `context.Context` (from\
    \ the `context` package), which looks like this:\n\n`type Context interface {`\n\
    \n`Deadline() (deadline time.Time, ok bool)`\n\n`Done() <-chan struct{}`\n\n`Err()\
    \ error`\n\n`Value(key any) any`\n\n`}`\n\nAn in-depth discussion of interface\
    \ signatures is beyond the scope of this chapter. In simple words, for understanding,\
    \ we can divide into three concepts:\n\n1.  **Manage key-value store**: In a second,\
    \ we can save and retrieve values from context by keys. We can get values from\
    \ context by a function in the `context` package - `Value(key any) any`.\n\n2.\
    \  **Handling concurrency**: In the next chapter, we’ll explore concurrency. The\
    \ context is an elementary tool that helps us leverage communication between goroutines.\n\
    \n3.  **Managing tasks:** Using `context`, we can ensure that related tasks can\
    \ gracefully stop when needed by passing values, cancellation signals, and deadlines\
    \ (timeout).\n\nTo start using `context`, let’s see how to create a `context`\
    \ from nothing using the function `context.Background()`\n\n`ctx := context.Background()`\n\
    \nWe should avoid using this function if unnecessary and strive to use the parent\
    \ `context`. We will see in a moment how to do it.\n\nAs we saw, one of the goals\
    \ of context is to serve key-value stores. Let’s examine an instance where we\
    \ aim to include the API key within the context.\n\n`func main() {`\n\n`ctx :=\
    \ context.Background()`\n\n`childContext := context.WithValue(ctx, “apiKey”, 123456)`\n\
    \n`printAPIKey(childContext)`\n\n`}`\n\n`func printAPIKey(ctx context.Context)\
    \ {`\n\n`apiKey := ctx.Value(“apiKey”)`\n\n`fmt.Println(“API Key:”, apiKey) //\
    \ API Key: 123456`\n\n`}`\n\nWe used the function of `context.WithValue``,` which\
    \ gets the parent context and key value. Note that these functions get `any` type\
    \ as a parameter (`any` is an alias to the empty interface - `interface{}`).\n\
    \nContext serves various purposes, such as task management, timeouts, environment\
    \ variables, and more. To illustrate context usage, consider a scenario in task\
    \ management where we must stop and gracefully terminate a task. The `Context`\
    \ package provides a solution through the `WithCancel` function, generating a\
    \ side function that cancels the context and adds an error. This allows us to\
    \ gracefully terminate tasks using the `WithCancel` function, and we can retrieve\
    \ an error using the `Err()` function. Let’s look at an example of canceling a\
    \ context for better understanding.\n\n`contextWithCancel, cancel := context.WithCancel(ctx)`\n\
    \n`cancel()`\n\n`fmt.Println(“What happened ?”, contextWithCancel.Err()) // What\
    \ happened ? context canceled`\n\nAnother way to conceal context is by using timeout.\
    \ As an illustration, we know tasks must adhere to a 30-second timeout, or it\
    \ could affect our DB. Let’s see an example of doing it while using the function\
    \ `context.WithTimeout(parent Context, timeout time.Duration) (Context, CancelFunc)``.`\n\
    \n`contextWithTimeout, _ := context.WithTimeout(ctx, 30*time.Second)`\n\n`fmt.Println(“What\
    \ happened ?”, contextWithTimeout.Err()) // What happened ? <nil>`\n\n`time.Sleep(35\
    \ * time.Second)`\n\n`fmt.Println(“What happened ?”, contextWithTimeout.Err())\
    \ // What happened ? context deadline exceeded`\n\nAnother useful function is\
    \ a `WithDeadline``.` This function lets us define a specific time when the context\
    \ is done. Note that the function `WithTimeout` uses the `WithDeadline` function\
    \ behind the senses.\n\n`func WithTimeout(parent Context, timeout time.Duration)\
    \ (Context, CancelFunc) {`\n\n`return WithDeadline(parent, time.Now().Add(timeout))`\n\
    \n`}`\n\nHere are the best practices when using context:"
