- raw: 'Goroutines and channels are the core concepts we use in Go to implement concurrency.
    In this section, we will explore code examples demonstrating the execution of
    Goroutines, examine the limitations of running Goroutines, and discuss the implications
    of Goroutine leaks.


    `func main() {`


    `go printHello() // Hello`


    `go func() {`


    `fmt.Println(“Hello from anonymous function”)`


    `}() // Hello from anonymous function`


    `time.Sleep(1 * time.Second)`


    `}`


    `func printHello() {`


    `fmt.Println(“Hello”)`


    `}`


    It is as simple as that just use the keyword `go` and then call a function. The
    function can be declared like `printHello` and can be an anonymous function. The
    Go scheduler will manage the Goroutines from the moment we execute them. The scheduler
    is responsible for allocating new goroutines, assigning them to a thread, executing
    them, pausing if needed, communicating between them, and deallocating goroutines.


    A prevalent question is the maximum amount of goroutines we can run in Go. The
    answer is that it depends. A reminder from *[Chapter 2, Usability of Go](#c02.xhtml)*
    - behind the senses, we have threads managed by the Go scheduler. The `GOMAXPROCS`
    configures the number of threads; the default and recommended value is the number
    of cores of the machine we are running on. Hypothetically, we can run as many
    goroutines as we want, but we must consider two factors - memory usage and garbage
    collection performance.


    Memory usage — Each goroutine uses 2KB, which means a 1GB memory machine can hold
    a maximum of ~250K goroutines. We need to calculate the maximum number of goroutines
    for every machine we are running on.


    GC performance - As many goroutines we have, garbage collection will become slower
    and slower.


    A rule of thumb for the maximum goroutines is between 1000 and 10,000.


    So, what is a goroutine leak? A goroutine leak is when garbage is never collected
    because it sends or waits to receive data over channels. Let’s discuss channels
    first and get real-life examples of goroutines leaks.


    # [Channels - Buffered vs. Unbuffered](#toc.xhtml#s85a)


    The best way to describe channels is that they are like queues. Their behavior
    is similar to queues — we can send and receive items into them. The difference
    between queues and channels is that channels aim to facilitate goroutine communication.
    Channels are how goroutines communicate and send and receive data between them.


    Here is an example where we create a channel, send data to that channel, and then
    receive the data in the main goroutines from the same channel:


    `func main() {`


    `messages := make(chan string)`


    `go func() {`


    `messages <- “ping”`


    `}()`


    `msg := <-messages`


    `println(msg)`


    `}`


    We use the `chan` keyword to declare a channel. Note that each channel has a type.
    In the example, the channel is of type `string`, which means we can only send
    items from `string` type to it. Using the syntax of `<-`, we send the `ping` string
    into the channel. We receive the data onto the channel using the assigning syntax
    `:=` and the `<-` syntax.


    In the preceding example, we used an unbuffered channel.


    There are two types of channels in Golang: buffered and unbuffered channels. Let’s
    examine the difference between them.


    `func main() {`


    `messages := make(chan string, 2)`


    `messages <- “ping”`


    `messages <- “pong”`


    `println(<-messages) // ping`


    `println(<-messages) // pong`


    `}`


    To declare a buffered channel, we should use the following syntax: `make(chan
    type, int)`. The `int` is the size of the channel. As we saw, channels are like
    queues. The size of the channel is the size of the queue, which means we can’t
    send more items into the channel than its size unless there is a receiver on the
    other side. Note that the output is like a queue order, not a stack order (FIFO,
    not LIFO).


    We will block the code if we try to send an item into a full channel. Unless there
    is a receiver goroutine - it will unblock the sender goroutine. If all other goroutines
    remain, we will enter a deadlock, and Go will notify us.


    `func main() {`


    `messages := make(chan string, 1)`


    `messages <- “ping”`


    `messages <- “pong”`


    `println(<-messages)`


    `println(<-messages)`


    `}`


    The only thing we changed is the size of the channel. However, if we try to run
    this code, we will get the following error:


    `fatal error: all goroutines are asleep - deadlock!`


    We got this error because we tried to send an item to the full channel while no
    goroutine ran a receiver that was supposed to unblock the main code. Now, let’s
    take an example of an unbuffered channel.


    `func main() {`


    `messages := make(chan string)`


    `go func() {`


    `messages <- “ping”`


    `}()`


    `msg := <-messages`


    `println(msg)`


    `}`


    The way to declare an unbuffered channel is exactly like a buffered channel, just
    without declaring the size. The difference between them is that the unbuffered
    channel has 0 length. While using unbuffered channels and buffered channels that
    are full, we can’t send items to the channel (`chan <-`) without having a corresponding
    receiver `(<- chan`).


    # [Closing a Channel](#toc.xhtml#s86a)


    When we create channels, they are, by default, open. We can use the `close(channel)`
    syntax to close a channel. Closing a channel means we can’t send data into the
    channel, but we can still receive data.


    `func main() {`


    `ch := make(chan int)`


    `close(ch)`


    `ch <- 1 // panic: send on closed channel`


    `}`


    The purpose of closing a channel is to notify the receiver that the sender has
    finished its work and won’t send any more items. Note that closing a channel must
    happen only from the sender side and not from the receiver side. We will discuss
    the principle of closing channels in more detail in the later section.


    # [Range Over a Channel](#toc.xhtml#s87a)


    We already saw the usage of the `range` syntax. We can use the same syntax for
    iterating over values from a channel, such as the receiver side.


    `func main() {`


    `ch := make(chan int, 3)`


    `for i := 0; i < 3; i++ {`


    `ch <- i`


    `}`


    `close(ch) // if you don’t close the channel, deadlock will occur`


    `for i := range ch {`


    `fmt.Printf(“%d “, i) // 0 1 2`


    `}`


    `}`


    In the example, we send three items to the channels and then iterate over the
    received values through the `range` syntax.


    Please note two things.


    First, we must close the channel; it will lead to deadlock! The `range-for-loop`
    will be stuck forever if we don’t close the channel. The sender doesn’t notify
    the receiver that he has finished sending items.


    Second, closing a channel prevents data from being sent to the channel. It doesn’t
    prevent receiving data from the channel like we did in the last three lines in
    the example.


    # [Selecting a Channel](#toc.xhtml#s88a)


    We already saw the usage of the `select` syntax. We can use the same syntax for
    receiving data from multiple channels.


    `func main() {`


    `c1 := make(chan int)`


    `c2 := make(chan int)`


    `go func() {`


    `c1 <- 1`


    `}()`


    `go func() {`


    `c2 <- 2`


    `}()`


    `go func() {`


    `for {`


    `select {`


    `case <-c1:`


    `println(“c1”)`


    `case <-c2:`


    `println(“c2”)`


    `}`


    `}`


    `}()`


    `time.Sleep(1 * time.Second)`


    `}`


    The two goroutines can send data over the respective channels anytime. We need
    a single mechanism on the other side that will know to receive data from multiple
    channels. The `select` syntax is the solution for that use case. We can see how
    to leverage it in the example.


    # [Channels Directions](#toc.xhtml#s89a)


    We can specify the channel direction while using channels as function parameters.


    `func main() {`


    `ch := make(chan int, 1)`


    `send(ch)`


    `recv(ch)`


    `}`


    `func send(ch chan<- int) {`


    `ch <- 1`


    `}`


    `func recv(ch <-chan int) {`


    `fmt.Println(<-ch) // 1`


    `}`


    We used the syntax of `chan<-` to specify that we can receive a channel as a parameter,
    but we can only send data onto that channel.


    # [Synchronization Between Goroutines](#toc.xhtml#s90a)'
