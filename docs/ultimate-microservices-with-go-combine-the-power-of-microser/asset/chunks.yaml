    \n通常，在其他编程语言中，许多错误信息会在大量的 `try-catch` 块中被“吞没”。Go 为我们提供了一种非常方便的多返回值方式，这使得我们能更轻松地正确返回错误。\n\
    \n## 错误是为了讲述一个故事\n\n在 *第二章，Go 的易用性* 中，我们讨论了在 Go 中使用错误来“*讲述一个故事*”。当我们在微服务的语境下交谈时，讲述故事成为一种力量倍增器。因为单个服务的故事可能很简单，但跨越多个服务的错误故事会复杂得多。我们可以通过服务间的追踪来解决它。我们将在\
    \ *第九章，部署到生产环境* 中更详细地讨论追踪。简而言之，追踪是服务间代码和错误的跟踪。\n\n## 惯例\n\n我们从 Uber-Go 惯例中获取了此惯例表，它非常好地描述了关于何时使用此错误和彼错误的指导惯例。\n\
    \n| **错误匹配？** | **错误消息** | **指导** | **描述** |\n| --- | --- | --- | --- |\n| 否 |\
    \ 静态 | `errors.New` | 使用给定消息创建新错误的函数。 |\n| 否 | 动态 | `fmt.Errorf` | 生成格式化错误消息的函数。\
    \ |\n| 是 | 静态 | 顶层变量配合 `errors.New` | 使用 `errors.New` 定义带有错误消息的顶层变量。 |\n| 是 |\
    \ 动态 | 自定义错误类型 | 定义自定义错误类型。 |\n\n**表 4.1：** 错误处理惯例\n\n# 测试 - 最佳实践、Mock 与模糊测试\n\
    \n我们非常喜欢 Go 的一点是 `testing` 包是由 Go 团队维护的核心包。我们在其他语言中遇到过许多情况，因测试框架太多且各有所短，而苦恼于寻找合适的测试框架。我们的建议是尽量避免使用外部测试框架。\n\
    \n本节将讨论 Go 中测试的样子、它们与其他语言的区别，以及 Go 测试的最佳实践。\n\n"
