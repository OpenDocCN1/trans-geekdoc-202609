    *   Abandoned receiver\n\n# Forgotten Sender\n\nThis is a scenario where a sender\
    \ goroutine is being “`forgotten`” and tries to send data via a channel. However,\
    \ there is no receiver on the other side.\n\n```go\nfunc forgottenSender(ch chan\
    \ int) {\n    data := 3\n    // This is blocked as no one is receiving the data\n\
    \    ch <- data\n}\n\nfunc main() {\n    ch := make(chan int)\n    go forgottenSender(ch)\n\
    \    println(runtime.NumGoroutine()) // 2 instead of 1\n}\n```\n\nThe `forgottenSender`\
    \ function will keep running within a goroutine forever. In this example, we must\
    \ use a buffered channel to avoid a goroutine leak so the `forgottenSender` could\
    \ finish its work.\n\n```go\nfunc forgottenSender(ch chan int) {\n    data :=\
    \ 3\n    // This is blocked as no one is receiving the data\n    ch <- data\n\
    }\n\nfunc main() {\n    ch := make(chan int, 1) // avoid goroutine leak by using\
    \ buffered channel\n    go forgottenSender(ch)\n}\n```\n\nIt isn’t always outward\
    \ that there is a goroutine leak. We can see many scenarios where error handling\
    \ can cause unintentional goroutine leaks.\n\n```go\nfunc networkCall() int {\n\
    \    return 1\n}\n\nfunc anotherAction() error {\n    return errors.New(“data\
    \ is invalid! Returning”)\n}\n\nfunc forgottenSender(ch chan int) {\n    data\
    \ := networkCall()\n    ch <- data\n}\n\nfunc handler() error {\n    ch := make(chan\
    \ int)\n    go forgottenSender(ch)\n    err := anotherAction()\n    if err !=\
    \ nil {\n        return err\n    }\n    data := <-ch\n    fmt.Println(data)\n\
    \    return nil\n}\n```\n\nEverything will be fine if we eliminate the section\
    \ where the `anotherAction` function is being called. Unfortunately, let’s assume\
    \ that this code block is necessary. We have a goroutine leak because the `forgottenSender`\
    \ function keeps running in the background while the handler function returns\
    \ an error, and now that function has done its work. To solve this situation,\
    \ we must run the receiver in a goroutine before calling the `anotherAction` function\
    \ or use a buffered channel.\n\nAkin to the error handling use case, it can also\
    \ happen when we use a select case for multiple channels.\n\n```go\nfunc networkCall()\
    \ int {\n    time.Sleep(3 * time.Second)\n    return 1\n}\n\nfunc forgottenSender(ch\
    \ chan int) {\n    data := networkCall()\n    ch <- data\n}\n\nfunc handler()\
    \ error {\n    ctx, cancel := context.WithTimeout(context.Background(), 10*time.Millisecond)\n\
    \    defer cancel()\n    ch := make(chan int)\n    go forgottenSender(ch)\n  \
    \  for {\n        select {\n        case data := <-ch:\n            fmt.Printf(“received\
    \ data! %d\\n”, data)\n            return nil\n        case <-ctx.Done():\n  \
    \          return errors.New(“timeout! Process canceled. Returning”)\n       \
    \ }\n    }\n}\n```\n\nWe have the same problem: the handler function finishes\
    \ its work before the network call is done (the timeout for 10 milliseconds is\
    \ lower than 3 seconds). The `forgottenSender` function is stuck and doesn’t have\
    \ a receiver on the other side, which leads to a goroutine leak. We can solve\
    \ this goroutine leak by using a buffered channel.\n\nWhen we use buffered channels,\
    \ it unblocks the goroutine, then the GC notices that no one is using the channel\
    \ `ch` and cleans it from memory.\n\n# Abandoned Receiver\n\nThis is a scenario\
    \ where a sender sends data, but the sender never notifies the receiver that he\
    \ needs to stop receiving data.\n\n```go\nfunc abandonedReceiver(ch chan string)\
    \ {\n    for data := range ch {\n        println(data)\n    }\n    println(“Worker\
    \ is done”)\n}\n\nfunc sender(ch chan string) {\n    for _, data := range []string{“one”,\
    \ “two”, “three”} {\n        ch <- data\n    }\n}\n\nfunc handler() {\n    ch\
    \ := make(chan string, 3)\n    sender(ch)\n    go abandonedReceiver(ch)\n}\n\n\
    func main() {\n    handler()\n    time.Sleep(1 * time.Second)\n    println(runtime.NumGoroutine())\
    \ // 2 instead of 1\n}\n```\n\nAs we can see, the `abandonedReceiver` function\
    \ will keep running forever. The output of the current program will look like\
    \ this:\n\n```\none\ntwo\nthree\n```\n\nThe line “`Worker is done”` will never\
    \ be printed because the `abandonedReceiver` is blocked on the range for a loop\
    \ — which causes a goroutine leak. To solve it, we need to close the channel after\
    \ the sender finishes his job, as we already saw in the section on closing a channel.\n\
    \n```go\nfunc sender(ch chan string) {\n    for _, data := range []string{“one”,\
    \ “two”, “three”} {\n        ch <- data\n    }\n    close(ch) // solve the goroutine\
    \ leak\n}\n```\n\n# Detecting Goroutine Leak\n"
  trans: "\n\n# 微服务架构中的发布/订阅模式\n\n发布/订阅是微服务架构中的一种模式。在构建微服务架构时，每个服务独立工作并相互解耦，这正是发布/订阅模式所要实现的目标。它允许在不更改发布者代码的情况下独立编写每个订阅者以获取其数据。订阅者只需将自己分配给一个现有的主题即可。微服务架构的诸多优势在此模式中得以体现。一个主要例子是使用发布/订阅时，服务的可扩展性变得无缝衔接。\n\
    \n更高级的发布/订阅用法允许更多功能，如计划进程、延迟、工作流等。以下是一些使用发布/订阅的实际案例：\n\n*   事件数据广播\n*   实时通知\n\
    *   分布式缓存\n*   实时位置追踪\n\n请注意，要在微服务架构中实现服务间的发布/订阅，我们需要使用第三方服务来管理主题、发布者和订阅者。常见的发布/订阅技术可在所有最大的云厂商服务或开源项目（如\
    \ `Redis`）中找到。\n\n许多人倾向于将发布/订阅与消息代理混淆。让我们简要了解一下它们的区别。\n\n| **PubSub** | **消息代理**\
    \ |\n| --- | --- |\n| 类似广播 - 单条消息复制给多个订阅者 | 单播 - 单条消息发给单个消费者 |\n| 发布者和订阅者 | 发布者和消费者\
    \ |\n| 适合广播 | 适合任务委派 |\n| 更容易丢失消息 | 更健壮，可靠性更好 |\n| 无 FIFO 能力 | 具备 FIFO 能力 - 保持顺序\
    \ |\n\n**表 5.1：** PubSub 与消息代理的对比\n\n我们将在 *第 7 章，构建 RESTful API* 中更详细地讨论消息代理。\n\
    \n# 通道关闭原则\n\n我们之前简要提到了通道关闭原则。然而，它非常重要，值得我们再次讨论。简单的原则是：如果是单个发送者，我们必须从发送者的 goroutine\
    \ 关闭通道。我们不应该从接收者一侧关闭通道，也不应在有多个发送者时从发送者一侧关闭通道。\n\n虽然原则如此，但也存在需要从多个发送者关闭通道的场景。在这种情况下，如果我们有多个发送者并需要关闭通道，必须执行优雅关闭。\n\
    \n```go\nfunc main() {\n    ch := make(chan int)\n    wg := &sync.WaitGroup{}\n\
    \    wg.Add(10)\n    for i := 0; i < 10; i++ {\n        go Sender(ch, wg, i)\n\
    \    }\n    go func() {\n        wg.Wait()\n        close(ch) // 优雅关闭\n    }()\n\
    \    // 接收者\n    for i := range ch {\n        println(i)\n    }\n}\n\nfunc Sender(ch\
    \ chan<- int, wg *sync.WaitGroup, i int) {\n    defer wg.Done()\n    ch <- i\n\
    }\n```\n\n在前面的示例中，我们可以观察到使用多个发送者 goroutine 实现优雅通道关闭的情况。\n\n# 避免 Goroutine 泄漏\n\
    \n到目前为止，我们已经体验了 goroutine 所提供的所有优势。不幸的是，goroutine 也有缺点 —— goroutine 泄漏！\n\n当发送者\
    \ goroutine 阻塞等待接收者到达通道，反之亦然时，就会发生 goroutine `泄漏`。同时，被阻塞的 goroutine 永远无法被解除阻塞。\n\
    \n```go\nfunc leak(ch chan int) {\n    data := <-ch\n    fmt.Println(data)\n}\n\
    \nfunc main() {\n    ch := make(chan int)\n    go leak(ch)\n}\n```\n\n让我们看看前面的示例；为什么这是泄漏？这是因为我们没有接收者！`leak`\
    \ 函数将永远卡住。\n\n导致 goroutine 泄漏的两种常见情况：\n\n*   被遗忘的发送者\n*   被遗弃的接收者\n\n# 被遗忘的发送者\n\
    \n这是一种发送者 goroutine 被“`遗忘`”并试图通过通道发送数据的场景。然而，另一侧没有接收者。\n\n```go\nfunc forgottenSender(ch\
    \ chan int) {\n    data := 3\n    // 因为没有人接收数据，这里会阻塞\n    ch <- data\n}\n\nfunc\
    \ main() {\n    ch := make(chan int)\n    go forgottenSender(ch)\n    println(runtime.NumGoroutine())\
    \ // 2 而不是 1\n}\n```\n\n`forgottenSender` 函数将在一个 goroutine 中永远运行下去。在该示例中，我们必须使用带缓冲通道来避免\
    \ goroutine 泄漏，这样 `forgottenSender` 才能完成其工作。\n\n```go\nfunc forgottenSender(ch\
    \ chan int) {\n    data := 3\n    // 因为没有人接收数据，这里会阻塞\n    ch <- data\n}\n\nfunc\
    \ main() {\n    ch := make(chan int, 1) // 通过使用带缓冲通道避免 goroutine 泄漏\n    go forgottenSender(ch)\n\
    }\n```\n\nGoroutine 泄漏并不总是显而易见的。我们可以看到许多错误处理导致无意 goroutine 泄漏的场景。\n\n```go\nfunc\
    \ networkCall() int {\n    return 1\n}\n\nfunc anotherAction() error {\n    return\
    \ errors.New(\"data is invalid! Returning\")\n}\n\nfunc forgottenSender(ch chan\
    \ int) {\n    data := networkCall()\n    ch <- data\n}\n\nfunc handler() error\
    \ {\n    ch := make(chan int)\n    go forgottenSender(ch)\n    err := anotherAction()\n\
    \    if err != nil {\n        return err\n    }\n    data := <-ch\n    fmt.Println(data)\n\
    \    return nil\n}\n```\n\n如果我们去掉调用 `anotherAction` 函数的部分，一切都会正常。不幸的是，假设该代码块是必要的。我们遇到了\
    \ goroutine 泄漏，因为 `forgottenSender` 函数在后台持续运行，而 `handler` 函数返回了错误，且该函数已完成工作。要解决这种情况，我们必须在调用\
    \ `anotherAction` 函数之前在 goroutine 中运行接收者，或者使用带缓冲通道。\n\n类似于错误处理用例，当我们对多个通道使用 select\
    \ case 时，也可能发生这种情况。\n\n```go\nfunc networkCall() int {\n    time.Sleep(3 * time.Second)\n\
    \    return 1\n}\n\nfunc forgottenSender(ch chan int) {\n    data := networkCall()\n\
    \    ch <- data\n}\n\nfunc handler() error {\n    ctx, cancel := context.WithTimeout(context.Background(),\
    \ 10*time.Millisecond)\n    defer cancel()\n    ch := make(chan int)\n    go forgottenSender(ch)\n\
    \    for {\n        select {\n        case data := <-ch:\n            fmt.Printf(\"\
    received data! %d\\n\", data)\n            return nil\n        case <-ctx.Done():\n\
    \            return errors.New(\"timeout! Process canceled. Returning\")\n   \
    \     }\n    }\n}\n```\n\n我们面临同样的问题：`handler` 函数在网络调用完成前就结束了工作（10 毫秒的超时低于 3 秒）。`forgottenSender`\
    \ 函数卡住了，另一侧没有接收者，从而导致 goroutine 泄漏。我们可以通过使用带缓冲通道来解决这个 goroutine 泄漏。\n\n当我们使用带缓冲通道时，它会解除\
    \ goroutine 的阻塞，随后 GC 会注意到没有人在使用通道 `ch` 并将其从内存中清理。\n\n# 被遗弃的接收者\n\n这是一种发送者发送了数据，但发送者从未通知接收者停止接收数据的场景。\n\
    \n```go\nfunc abandonedReceiver(ch chan string) {\n    for data := range ch {\n\
    \        println(data)\n    }\n    println(\"Worker is done\")\n}\n\nfunc sender(ch\
    \ chan string) {\n    for _, data := range []string{\"one\", \"two\", \"three\"\
    } {\n        ch <- data\n    }\n}\n\nfunc handler() {\n    ch := make(chan string,\
    \ 3)\n    sender(ch)\n    go abandonedReceiver(ch)\n}\n\nfunc main() {\n    handler()\n\
    \    time.Sleep(1 * time.Second)\n    println(runtime.NumGoroutine()) // 2 而不是\
    \ 1\n}\n```\n\n正如我们所见，`abandonedReceiver` 函数将永远运行下去。当前程序的输出如下所示：\n\n```\none\n\
    two\nthree\n```\n\n`\"Worker is done\"` 这一行永远不会被打印，因为 `abandonedReceiver` 在 range\
    \ 循环上被阻塞 —— 这导致了 goroutine 泄漏。要解决它，我们需要在发送者完成工作后关闭通道，正如我们在关闭通道一节中所见。\n\n```go\n\
    func sender(ch chan string) {\n    for _, data := range []string{\"one\", \"two\"\
    , \"three\"} {\n        ch <- data\n    }\n    close(ch) // 解决 goroutine 泄漏\n\
    }\n```\n\n# 检测 Goroutine 泄漏\n\n"
