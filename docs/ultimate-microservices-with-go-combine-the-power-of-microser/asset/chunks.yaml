- raw: "To create a new engine, we used `gin.New()`. While building the engine, we’ll\
    \ declare all the middlewares that apply to all endpoints in the server. In the\
    \ example, these include logger, recovery, and CORS (we’ll discuss them in the\
    \ next section). After declaring all the wanted middlewares, we’ll declare the\
    \ groups. Gin let us divide the server into groups. We won’t focus on it and assign\
    \ a single group for all the servers. Sometimes, developers assign a group to\
    \ a category and a subgroup to a subcategory. In the example, the group is just\
    \ `“/api”`. We’ll assign all the endpoints to the group by using the `RegisterRoutes`\
    \ function in the `routes_registrator.go` file.\n\n`func RegisterRoutes(routerGroup\
    \ *gin.RouterGroup) {`\n\n`apple.RegisterRoutes(routerGroup)`\n\n`}`\n\nUsing\
    \ multiple groups in this function, we can assign more relevant middleware to\
    \ that specific group. Now, let’s observe the internal of a single endpoint is\
    \ a single resource. This code is what we’ll find in the `routes.go` file:\n\n\
    `package apple`\n\n`import “github.com/gin-gonic/gin”`\n\n`var Path = “/fruits/apple”`\n\
    \n`func RegisterRoutes(group *gin.RouterGroup) {`\n\n`group.GET(Path, gin.HandlersChain{ProcessRequest}…)`\n\
    \n`}`\n\nAnd in the `controller.go` file:\n\n`package apple`\n\n`import “github.com/gin-gonic/gin”`\n\
    \n`func ProcessRequest(c *gin.Context) {`\n\n`c.JSON(200, gin.H{`\n\n`“color”:\
    \ “red”,`\n\n`“date”: “2023-12-11”,`\n\n`“taste”: “sweet”,`\n\n`})`\n\n`}`\n\n\
    The response, of course, is just mocked data; instead, we’ll need to execute a\
    \ business logic function in the `server.go` file, which almost always will query\
    \ the data from the `db.go` file.\n\n# [Chains of Responsibilities](#toc.xhtml#s148a)\n\
    \nIf we simplify it, chains of responsibility are a design pattern linking several\
    \ commands so one command will lead to another. This pattern helps us fulfill\
    \ the constraint of a layered system. The implementation of this pattern happens\
    \ through middleware.\n\nUsing the modularity we presented before, we can apply\
    \ relevant middleware to the entire API (in the `BuildEngine` function). We can\
    \ be more specific and apply middleware to a particular group (a category) in\
    \ the `RegisterRoutes` function. In even more detail, we can apply a particular\
    \ middleware at the resource level in `routes.go`.\n\n# [CORS](#toc.xhtml#s149a)\n\
    \nCORS, a browser security feature, stands for Cross-Origin Resource Sharing.\
    \ This feature aims to restrict unwanted HTTP requests. We must specify what origins\
    \ are acceptable for sending requests from a web browser to our RESTful API server.\
    \ Here is how to create gin middleware that can take care of that:\n\n`func CORS()\
    \ gin.HandlerFunc {`\n\n`return func(c *gin.Context) {`\n\n`c.Writer.Header().Set(“Access-Control-Allow-Origin”,\
    \ “*”)`\n\n`c.Writer.Header().Set(“Access-Control-Allow-Credentials”, “true”)`\n\
    \n`c.Writer.Header().Set(“Access-Control-Allow-Methods”, “POST, GET”)`\n\n`c.Next()`\n\
    \n`}`\n\n`}`\n\n# [API Capabilities](#toc.xhtml#s150a)\n\nAs mentioned, each API\
    \ needs to support capabilities that are derivatives of the product needs. Many\
    \ popular capabilities exist in almost every API, and some are not. We’ll elaborate\
    \ here about the popular ones. Each API capability will probably be used by more\
    \ than one API, at least the popular ones. The best practice is creating a configurable\
    \ shared infrastructure that is served as a package or under the `pkg` directory\
    \ if it is monorepo. For example, if one API uses a particular type of pagination,\
    \ the other services in the same company will probably need to use pagination\
    \ in the same manner.\n\n# [Pagination](#toc.xhtml#s151a)\n\nPagination is the\
    \ process of separating content into separate pages/parts. It is usually used\
    \ for navigation or to get data if it is massive. For example, if a user reads\
    \ an online book, we don’t need to get all the book content simultaneously. Instead,\
    \ we can ask for the next page whenever he swipes a page. Another example is when\
    \ we need all the users of a specific account, but there is an enormous number\
    \ of users, and it is impossible to get all of them as a single response; instead,\
    \ we can use pagination.\n\nThere are various pagination algorithms, and a portion\
    \ of the algorithm can be applied in the DB-level. For example, using limit and\
    \ offset in SQL for PostgreSQL. The popular pagination algorithms are:\n\n*  \
    \ **Page number:** The most straightforward and most unused algorithm. Choosing\
    \ const limit, then multiply the limit and the page number. \n\n    `GET /api/users?page=2`\n\
    \n*   **Offset and Limit:** Like the previous pagination algorithm. The difference\
    \ is that we must choose the limit size instead of the default limit. The client\
    \ needs to use an offset between each request, which complies with the client\
    \ interaction. This is the most used pagination algorithm. \n\n    `GET /api/users?limit=10`\n\
    \n    `GET /api/users?limit=10&offset=10`\n\n    `GET /api/users?limit=10&offset=20`\n\
    \n*   **Auto Incremental PK of the ID:** Also a ubiquitous algorithm. This algorithm\
    \ depends on some ID to arrange the data, and that ID is used as a cursor. \n\n\
    \    `GET /api/users?limit=10`\n\n    `GET /api/users?limit=10&cursor=<last_id_from_previous_request>`\n\
    \n    `GET /api/users?limit=10&cursor=<last_id_from_previous_request>`\n\n# [Rate\
    \ Limit](#toc.xhtml#s152a)\n\nA rate limit is a way to block the over-using amount\
    \ of users, bots, and requests. To keep the server up and functioning, we must\
    \ limit the number of requests going to the server. The rate limit is usually\
    \ a constant number of requests per interval, for example, 10,000 requests per\
    \ minute.\n\nWe’ll implement the rate limit as middleware in a shared package\
    \ and use this middleware in every service. It is unnecessary to implement rate\
    \ limits by ourselves. There are great packages that are suitable for gin to do\
    \ so. Finally, the HTTP status code returned when the number of requests passed\
    \ the limit of 429 (Too Many Requests).\n\n# [Panic Recovery](#toc.xhtml#s153a)\n\
    \nWe’ve already discussed error handling in Go and on `panic()` in a nutshell.\
    \ We can liken panic to raise/throw exceptions in other programming languages.\
    \ We use `panic()` when something unexpected happens, so we must crash the whole\
    \ application. When writing RESTful API, the `panic()` inside an endpoint is odd\
    \ because a single endpoint isn’t supposed to affect other endpoints.\n\nWe must\
    \ return the error status code if something terrible happened at that endpoint.\
    \ When writing RESTful APIs, we’ll probably `panic()` when the server goes up\
    \ or functionality related to the whole server crashes. Please also note to use\
    \ panic wisely because it will execute all the defer statements when a `panic()`\
    \ occurs.\n\nDevelopers often use `panic()` incorrectly and put it accidentally\
    \ within an endpoint or use a package that propagates a `panic()` to our program.\
    \ To tackle that scenario, we can create a middleware that can recover from panic.\
    \ We can use the default panic recovery middleware of gin:\n\n`engine.Use(gin.Recovery())`\n\
    \nOr we can craft custom panic recovery using the `recover()` function:\n\n`func\
    \ WithCustomRecovery() gin.HandlerFunc {`\n\n`return func(c *gin.Context) {`\n\
    \n`defer func() {`\n\n`if err := recover(); err != nil {`\n\n`_ = c.Error(fmt.Errorf(“[recovered]\
    \ panic: %v”, err))`\n\n`c.AbortWithStatusJSON(http.StatusInternalServerError,\
    \ gin.H{“Error”: “Internal Server Error”})`\n\n`}`\n\n`}()`\n\n`c.Next()`\n\n\
    `}`\n\n`}`\n\nIn the preceding example, we crafted a custom recovery and can put\
    \ any customized functionality we want. Not that this middleware will occur for\
    \ each on-flight request.\n\n# [Graceful Shutdown](#toc.xhtml#s154a)\n\nGraceful\
    \ shutdown is when a system or application is turned off or gets signals that\
    \ it needs to go down (rollout or any other reason). While receiving a signal\
    \ to go down, the application has on-flight tasks. Graceful shutdown gives the\
    \ application a grace period to finish its tasks."
  fmt: "\n# 创建引擎\n\n要创建一个新引擎，我们使用了 `gin.New()`。在构建引擎时，我们将声明所有适用于服务器中所有端点的中间件。在示例中，这些包括\
    \ logger、recovery 和 CORS（我们将在下一节讨论它们）。声明完所有需要的中间件后，我们将声明分组。Gin 允许我们将服务器划分为多个分组。我们不会重点关注这一点，而是为所有服务器分配单个分组。有时，开发人员会为一个类别分配一个分组，为一个子类别分配一个子分组。在示例中，分组仅为\
    \ `\"/api\"`。我们将通过 `routes_registrator.go` 文件中的 `RegisterRoutes` 函数将所有端点分配给该分组。\n\
    \n```go\nfunc RegisterRoutes(routerGroup *gin.RouterGroup) {\n    apple.RegisterRoutes(routerGroup)\n\
    }\n```\n\n使用此函数中的多个分组，我们可以将更相关的中间件分配给特定分组。现在，让我们观察单个端点即单个资源的内部结构。这是我们将在 `routes.go`\
    \ 文件中找到的代码：\n\n```go\npackage apple\n\nimport \"github.com/gin-gonic/gin\"\n\n\
    var Path = \"/fruits/apple\"\n\nfunc RegisterRoutes(group *gin.RouterGroup) {\n\
    \    group.GET(Path, gin.HandlersChain{ProcessRequest}...)\n}\n```\n\n而在 `controller.go`\
    \ 文件中：\n\n```go\npackage apple\n\nimport \"github.com/gin-gonic/gin\"\n\nfunc\
    \ ProcessRequest(c *gin.Context) {\n    c.JSON(200, gin.H{\n        \"color\"\
    : \"red\",\n        \"date\": \"2023-12-11\",\n        \"taste\": \"sweet\",\n\
    \    })\n}\n```\n\n当然，响应只是模拟数据；相反，我们需要在 `server.go` 文件中执行业务逻辑函数，该函数几乎总是会从 `db.go`\
    \ 文件查询数据。\n\n# 责任链\n\n如果简化来看，责任链是一种将多个命令链接在一起的设计模式，使得一个命令会引导至另一个命令。这种模式有助于我们满足分层系统的约束。该模式的实现通过中间件进行。\n\
    \n利用我们之前展示的模块化，我们可以将相关中间件应用于整个 API（在 `BuildEngine` 函数中）。我们可以更具体地将中间件应用于 `RegisterRoutes`\
    \ 函数中的特定分组（类别）。甚至更详细地，我们可以在 `routes.go` 的资源级别应用特定中间件。\n\n# CORS\n\nCORS 是一种浏览器安全功能，全称为跨源资源共享。此功能旨在限制不需要的\
    \ HTTP 请求。我们必须指定哪些源可以从 Web 浏览器向我们的 RESTful API 服务器发送请求。以下是创建可处理此问题的 Gin 中间件的方法：\n\
    \n```go\nfunc CORS() gin.HandlerFunc {\n    return func(c *gin.Context) {\n  \
    \      c.Writer.Header().Set(\"Access-Control-Allow-Origin\", \"*\")\n       \
    \ c.Writer.Header().Set(\"Access-Control-Allow-Credentials\", \"true\")\n    \
    \    c.Writer.Header().Set(\"Access-Control-Allow-Methods\", \"POST, GET\")\n\
    \        c.Next()\n    }\n}\n```\n\n# API 能力\n\n如前所述，每个 API 都需要支持作为产品需求衍生出的能力。许多流行的能力几乎存在于每个\
    \ API 中，也有一些则不然。我们将在此详述流行的能力。每个 API 能力很可能会被多个 API 使用，至少流行的那些是如此。最佳实践是创建一个可配置的共享基础设施，作为一个包提供服务，或者如果是单体仓库，则置于\
    \ `pkg` 目录下。例如，如果一个 API 使用特定类型的分页，同一公司的其他服务很可能也需要以相同方式使用分页。\n\n# 分页\n\n分页是将内容分离到单独页面/部分的过程。它通常用于导航或获取海量数据。例如，如果用户阅读在线书籍，我们不需要一次性获取所有书籍内容。相反，每当他翻页时，我们可以请求下一页。另一个例子是当我们需要特定账户的所有用户，但用户数量巨大，无法作为单个响应获取所有用户；此时我们可以使用分页。\n\
    \n存在各种分页算法，部分算法可应用于数据库层面。例如，在 PostgreSQL 的 SQL 中使用 limit 和 offset。流行的分页算法有：\n\n\
    *   **页码：** 最直接但最不常用的算法。选择固定 limit，然后将 limit 与页码相乘。\n    `GET /api/users?page=2`\n\
    *   **偏移量和限制：** 类似于上述分页算法。区别在于我们必须选择 limit 大小，而不是使用默认 limit。客户端需要在每次请求之间使用 offset，这符合客户端交互。这是最常用的分页算法。\n\
    \    `GET /api/users?limit=10`\n    `GET /api/users?limit=10&offset=10`\n    `GET\
    \ /api/users?limit=10&offset=20`\n*   **ID 的自增主键：** 也是一种普遍的算法。该算法依赖某个 ID 来排列数据，并将该\
    \ ID 用作游标。\n    `GET /api/users?limit=10`\n    `GET /api/users?limit=10&cursor=<last_id_from_previous_request>`\n\
    \    `GET /api/users?limit=10&cursor=<last_id_from_previous_request>`\n\n# 速率限制\n\
    \n速率限制是阻止用户、机器人和请求过度使用的一种方式。为保持服务器正常运行，我们必须限制发往服务器的请求数量。速率限制通常是每个时间间隔的恒定请求数，例如每分钟\
    \ 10,000 个请求。\n\n我们将在共享包中将速率限制作为中间件实现，并在每个服务中使用该中间件。没必要自己实现速率限制。有许多适合 Gin 的优秀包可以做到这一点。最后，当请求数量超过限制时，返回的\
    \ HTTP 状态码为 429（请求过多）。\n\n# Panic 恢复\n\n我们已经简要讨论了 Go 中的错误处理和 `panic()`。我们可以将 panic\
    \ 比作其他编程语言中的 raise/throw 异常。当发生意外情况时我们使用 `panic()`，因此必须使整个应用程序崩溃。编写 RESTful API\
    \ 时，端点内部的 `panic()` 很奇怪，因为单个端点不应影响其他端点。\n\n如果该端点发生严重问题，我们必须返回错误状态码。编写 RESTful\
    \ API 时，我们可能会在服务器启动时或与整个服务器崩溃相关的功能中使用 `panic()`。请也注意明智地使用 panic，因为发生 `panic()`\
    \ 时会执行所有 defer 语句。\n\n开发人员经常错误地使用 `panic()`，意外地将其放在端点内，或使用将 `panic()` 传播到我们程序的包。为应对这种情况，我们可以创建一个能从\
    \ panic 中恢复的中间件。我们可以使用 Gin 默认的 panic 恢复中间件：\n\n```go\nengine.Use(gin.Recovery())\n\
    ```\n\n或者我们可以使用 `recover()` 函数制作自定义 panic 恢复：\n\n```go\nfunc WithCustomRecovery()\
    \ gin.HandlerFunc {\n    return func(c *gin.Context) {\n        defer func() {\n\
    \            if err := recover(); err != nil {\n                _ = c.Error(fmt.Errorf(\"\
    [recovered] panic: %v\", err))\n                c.AbortWithStatusJSON(http.StatusInternalServerError,\
    \ gin.H{\"Error\": \"Internal Server Error\"})\n            }\n        }()\n \
    \       c.Next()\n    }\n}\n```\n\n在前面的示例中，我们制作了一个自定义恢复，并可以放入任何我们想要的自定义功能。注意，此中间件将针对每个在途请求发生。\n\
    \n# 优雅关闭\n\n优雅关闭是指系统或应用程序关闭或收到需要关闭的信号（发布或任何其他原因）时的行为。在接收到关闭信号时，应用程序有在途任务。优雅关闭给应用程序一个宽限期来完成其任务。\n"
