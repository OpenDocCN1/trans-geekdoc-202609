  trans: "\n`go tool pprof -web http://localhost:6060/debug/pprof/heap`\n\n`-web`\
    \ 标志会在一个友好的 UI 中打开内存分析数据。我们不需要使用它。\n\n![](img/Figure-10.8.jpg)\n\n**图 10.8：**\
    \ pprof 堆内存使用情况\n\n几秒钟后，内存堆的呈现方式发生了变化。\n\n![](img/Figure-10.9.jpg)\n\n**图 10.9：**\
    \ pprof 堆内存使用情况 2\n\n让我们不要关注前两个图表中的具体数据。引入它们的目的是为了展示 Golang 中 `pprof` 包的强大功能以及我们如何使用它。除了查看运行时函数间的内存分布，我们还可以查看\
    \ CPU 和 goroutine 执行等指标。要进一步了解这些选项，请参阅 - `https://pkg.go.dev/net/http/pprof`。一旦理解了某一指标（如本节展示的\
    \ `heap` 指标）的用法，使用 `pprof` 就非常简单直接。\n\n# PGO\n\n**P**rofile-**G**uided **O**ptimization（基于配置文件引导的优化）是一种编译器优化方法，它利用分析得到的信息来进行优化。编译器将使用这些分析数据（`pprof`\
    \ 输出）生成高性能的二进制代码。PGO 从 Golang 1.21 版本开始可用。每当构建 Golang 代码时，它都会寻找包含分析信息的 `default.pgo`\
    \ 文件。另一种方式是指定特定的分析文件 `go build -pgo=/tmp/foo.pprof`。我们不会深入探讨使用 PGO 的过程；我们的目标是了解这种方法的存在。\n\
    \n# 性能问题\n\n在进入下一节之前，让我们看看一些可以通过分析来解决的常见性能问题：\n\n*   **CPU 节流**：CPU 使用率达到极限的场景。这是一个标准的\
    \ Kubernetes 场景，一旦达到 Pod 的 CPU 限制。一旦发生这种情况，将对应用程序的性能和稳定性产生负面影响。请注意，Kubernetes\
    \ 不会重启容器。\n\n    ![](img/Figure-10.10.jpg)\n\n    **图 10.10：** Kubernetes 中 Pod\
    \ 的 CPU 节流\n\n*   **内存泄漏**：应用程序持续消耗内存而不释放的场景。在 Kubernetes 中，如果内存超过限制阈值，Pod 将会被重启。\n\
    \n    ![](img/Figure-10.11.jpg)\n\n    **图 10.11：** 内存泄漏类型\n\n    左侧的两个图表展示了可能发生内存泄漏的场景——如果应用程序消耗内存且从不释放或稳定下来（左上），不要被右下角的图表搞混。在那个图表中，应用程序消耗必要的内存然后趋于稳定。关于内存泄漏还有很多可讨论的内容；不过，本书不再深入讨论。\n\
    \n*   **Goroutine 泄漏：** 我们已经在 *第 5 章，释放 Go 的并发威力* 中讨论过这个主题。`pprof` 包还允许我们跟踪 Golang\
    \ 中 goroutine 的数量和分布。\n\n# 告警\n\n我们将服务部署到生产环境，并监控服务的性能和行为；我们还构建了一个整洁的仪表盘，让我们能够观测所有\
    \ API 及其通信情况。一切都很棒。遗憾的是，我们并不总是在电脑旁，有时会处于 AFK（Away From Keyboard，离开键盘）状态。然而，系统是一个始终在运行的“生命体”；当我们不在身边时，必须照顾好它。为了符合我们期望的性能，我们必须设置告警，以便在需要时通知我们。\n\
    \n告警是由自动化监控系统生成的信号，通过确定阈值来为关键问题提供信息。这些信息对于维护系统的健康和性能至关重要。\n\n流行的告警系统有 PagerDuty\
    \ 和 Atlassian Opsgenie。这些系统具有高级升级功能，如通过 Slack、电子邮件、短信甚至电话发送消息。我们可以通过指定 OnCall（值班）排班表来配置在特定时刻将告警发送给谁。\n\
    \n# 性能指标\n\n以下是 RESTful API 的推荐性能指标。我们应该监控这些指标，并在超过某个阈值时触发告警：\n\n*   **请求成功率**：未出现错误的请求占所有请求的百分比。例如，1000\
    \ 个请求中有 2 个失败——成功率为 99.8%。在每个小数点都代表大量用户的系统中，通常用“9 的个数”来衡量性能。例如，99.9992% 的成功率就是“五个\
    \ 9”。每个请求被归类为一个布尔参数，以判断请求是成功还是失败，而不考虑延迟。通常，只有 5XX 错误被归类为失败。该指标表明有多少用户在使用您的应用程序时经历了糟糕的体验。\n\
    \n*   **P95 延迟**：P95 代表第 95 百分位数。该指标表明 95% 的请求持续时间低于该指标值。例如，如果 P95 是 0.5 秒，则 95%\
    \ 的请求延迟低于 0.5 秒。\n\n*   **P99 延迟**：这与前一个指标相同，但针对第 99 百分位数。这两个指标都有助于确保绝大多数用户在使用\
    \ API 或应用程序时获得良好的体验。我们不想测量平均值，因为平均值会掩盖无法反映真实用户体验的异常。请注意，在测量这些指标时，我们只考虑成功的请求。\n\
    \n# 结论\n\n本最后一章探讨了在生产环境中维护服务的关键方面。我们强调，生产环境中的稳定服务需要持续的关注和维护才能保持弹性。\n\n我们深入探讨了通过遥测数据（如日志、指标和追踪）实现可观测性的重要性。这种可观测性使我们能够监控系统、检测异常并有效排查问题。我们还讨论了处理生产故障排查的各种策略，包括理论的力量、性能分析，以及使用基于配置文件引导的优化（PGO）来提升性能。\n\
    \n此外，我们介绍了告警系统的重要性，以便在我们不主动监控服务时通知我们关键问题。最后，我们列出了一些 RESTful API 的推荐性能指标，以确保良好的用户体验。\n\
    \n接下来是什么？\n\n*   **深入钻研可观测性工具：** 探索 Prometheus、Grafana 和 Jaeger 等可观测性工具的高级功能和能力。\n\
    \n*   **高级故障排查技术：** 培养高级故障排查技能，包括分布式追踪和混沌工程，以主动识别和解决潜在问题。\n\n*   **性能优化：** 专注于性能优化策略，包括性能分析和调优，以提高服务的效率和可扩展性。\n\
    \n*   **安全最佳实践：** 深入了解微服务的安全最佳实践，包括加密、访问控制和定期安全审计，以保护服务免受威胁和漏洞的影响。\n\n通过掌握这些领域，您可以确保服务在生产环境中的持续可靠性、性能和安全性，最终构建更加健壮和有弹性的系统。\n\
    \n# 参考资料\n\n*   [`www.comparitech.com/net-admin/solarwinds-npm-vs-datadog/`](https://www.comparitech.com/net-admin/solarwinds-npm-vs-datadog/)\n\
    \n*   [`blog.danslimmon.com/2019/05/03/no-observability-without-theory/`](https://blog.danslimmon.com/2019/05/03/no-observability-without-theory/)\n\
    \n*   [`levelup.gitconnected.com/prometheus-counter-metrics-d6c393d86076`](https://levelup.gitconnected.com/prometheus-counter-metrics-d6c393d86076)\n\
    \n*   [`grafana.com/docs/grafana/latest/fundamentals/intro-histograms/`](https://grafana.com/docs/grafana/latest/fundamentals/intro-histograms/)\n"
