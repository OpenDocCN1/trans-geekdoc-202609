- raw: "API is a commitment, and the documentation is a promise to the user. Developers\
    \ want to introduce new features or make breaking changes due to product/engineering\
    \ needs. Versioning the API comes in handy for achieving this goal. Versioning\
    \ allows developers to make a clear separation between one promise and another\
    \ (promise=version) without breaking existing clients.\n\n# [Versioning Strategies](#toc.xhtml#s161a)\n\
    \nLet’s take a look at the prevalent strategies for versioning the API.\n\n* \
    \  **URI Versioning:** The API version is included inside each endpoint. \n\n\
    \    `GET /api/v1/accounts`\n\n    `GET /api/v2/accounts`\n\n    This method is\
    \ trendy and very easy to implement. However, the REST approach desires to include\
    \ only the resource details in the URI, not the version.\n\n*   **Query Parameter\
    \ Versioning:** Like URI versioning, the version in the URI, but not as path parameter;\
    \ instead, it is included as a query parameter. \n\n    `GET /api/account?version=1`\n\
    \n    `GET /api/account?version=2`\n\n    It is the same as the previous, less\
    \ famous strategy but doesn’t require the client to change the URL, only the parameter.\n\
    \n*   **Header Versioning:** It includes a header that indicates the API version.\
    \ \n\n    `GET /api/accountsHeaders: { “X-API-version”: “1” }`\n\n    `GET /api/accountsHeaders:\
    \ { “X-API-version”: “2” }`\n\n    This approach is most suitable with the REST\
    \ approach. However, the version can be hidden from the user.\n\n# [Versioning\
    \ Best Practices](#toc.xhtml#s162a)\n\nLet’s explore some best practices:\n\n\
    *   **Utilize three-part versioning**: The best practice for the versioning schema\
    \ is as follows: `major.minor.patch`. For example, 1.3.2 - version major is 1,\
    \ minor is 3, and patch is 2:  \n\n    *   Major: To introduce breaking or massive\
    \ API changes.\n\n    *   Minor: Every time new capabilities and features that\
    \ are still backward-compatible are introduced,\n\n    *   Patch - bug fixes.\n\
    \n*   **Backward compatibility**: Always aim to support old features and capabilities\
    \ rather than break them. We use backward compatibility to reduce the effect on\
    \ the end client.\n\n*   **Communicate Changes**: Whenever we release a new version,\
    \ it is essential to reflect and elaborate on what was changed to the customer\
    \ and to do it well.\n\n# [Deprecation](#toc.xhtml#s163a)\n\nWe’ll do it gracefully\
    \ when it is necessary to deprecate old API versions. The grace period must be\
    \ very long, and we must frequently report changes to the customers. We must give\
    \ the users enough time to migrate to the new version. The documentation also\
    \ reflects the deprecation, and endpoints are marked as deprecated.\n\n# [Common\
    \ Pitfalls](#toc.xhtml#s164a)\n\nHere are some common pitfalls in REST:\n\n* \
    \  **Overusing POST HTTP method**: Developers tend to stick to POST operation\
    \ even when it isn’t the right choice. We must utilize all the other HTTP methods:\
    \ `DELETE`, `PATCH`, `PUT`, `GET`, and so on.\n\n*   **Not sticking to a convention\
    \ mentioned earlier:** The term resource can be confusing for REST newcomers,\
    \ leading to lousy resource naming.\n\n*   **Lack of versioning**: We must keep\
    \ the API versioning and deprecation as described in the previous section.\n\n\
    *   **Choosing inappropriate HTTP status codes**: Developers use 200, 400, and\
    \ 500 status codes all the time instead of using the appropriate HTTP status code.\n\
    \n*   **Messy and misinformation** in swagger documentation.\n\n*   **Overcomplicating:**\
    \ The biggest pitfall for developers is making the API cumbersome and confusing.\
    \ Keeping it simple isn’t easy, but we must do it.\n\n# [Conclusion](#toc.xhtml#s165a)\n\
    \nIn this chapter, we reviewed the concepts and constraints of RESTful APIs. We\
    \ learned what makes general APIs go from being just APIs into being RESTful APIs\
    \ - the REST constraints. We elaborated on those constraints and saw their implementation\
    \ during the chapter. We learned how to start an API — from the first step of\
    \ designing architecture well, building proper documentation in OpenAPI using\
    \ Swagger, and building the right structure for Go and RESTful API. Then, we started\
    \ crafting a gin-gonic server using Go and implemented several standard capabilities\
    \ for RESTful APIs, like pagination, filtering, rate limit, and so on. Finally,\
    \ we discussed conventions around RESTful APIs and how to version and deprecate\
    \ the API when needed. While doing so, we remind ourselves of the common pitfalls\
    \ that can happen when RESTful newcomers write APIs.\n\nIn the next chapter, we’ll\
    \ explore a crucial aspect of the service cycle in microservices architecture:\
    \ the deployment phase. We’ll explore the deployment phase while using the best\
    \ technology in the market for that - Kubernetes.\n\n# [References](#toc.xhtml#s166a)\n\
    \n*   [https://restfulapi.net/](https://restfulapi.net/)\n\n*   [https://ics.uci.edu/~fielding/pubs/dissertation/rest\\\
    _arch\\_style.htm](https://ics.uci.edu/~fielding/pubs/dissertation/rest_arch_style.htm)\n\
    \n*   [https://trends.google.com/trends/explore?date=all&q=REST&hl=en-GB](https://trends.google.com/trends/explore?date=all&q=REST&hl=en-GB)\n\
    \n*   [https://stripe.com/docs/api](https://stripe.com/docs/api)\n\n*   [https://www.twilio.com/docs/api](https://www.twilio.com/docs/api)\n\
    \n*   [https://www.baeldung.com/cs/uniform-resource-identifiers](https://www.baeldung.com/cs/uniform-resource-identifiers)\n\
    \n*   [https://swagger.io/](https://swagger.io/)\n\n*   [https://github.com/go-gorm/gorm](https://github.com/go-gorm/gorm)\n\
    \n*   [https://github.com/gin-gonic/gin](https://github.com/gin-gonic/gin)\n\n\
    *   [https://pkg.go.dev/net/http](https://pkg.go.dev/net/http)\n\n*   [https://go.dev/doc/tutorial/web-service-gin](https://go.dev/doc/tutorial/web-service-gin)\n\
    \n*   [https://medium.easyread.co/how-to-do-pagination-in-postgres-with-golang-in-4-common-ways-12365b9fb528](https://medium.easyread.co/how-to-do-pagination-in-postgres-with-golang-in-4-common-ways-12365b9fb528)\n\
    \n*   [https://www.atatus.com/blog/rest-api-design-filtering-sorting-and-pagination/](https://www.atatus.com/blog/rest-api-design-filtering-sorting-and-pagination/)\n\
    \n*   [https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Cache-Control](https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Cache-Control)\n\
    \n*   [https://medium.com/@nadinCodeHat/rest-api-naming-conventions-and-best-practices-1c4e781eb6a5](https://medium.com/@nadinCodeHat/rest-api-naming-conventions-and-best-practices-1c4e781eb6a5)\n\
    \n*   [https://readwrite.com/api-design-patterns-best-practices-for-building-resilient-apis/#:~:text=REST%20API%20Design%20Patterns&text=CRUD%20(Create%2C%20Read%2C%20Update,for%20resource%20discovery%20and%20navigation](https://readwrite.com/api-design-patterns-best-practices-for-building-resilient-apis/#:~:text=REST%20API%20Design%20Patterns&text=CRUD%20\\\
    (Create%2C%20Read%2C%20Update,for%20resource%20discovery%20and%20navigation)\n\
    \n*   [https://codedamn.com/news/backend/rest-api-versioning-best-practices](https://codedamn.com/news/backend/rest-api-versioning-best-practices)\n\
    \n# [CHAPTER 8](#toc.xhtml#c08)\n\n# [Introduction to Kubernetes](#toc.xhtml#c08)\n\
    \n# [Introduction](#toc.xhtml#s167a)\n\nBefore talking about Kubernetes, there\
    \ is a fundamental technology that needs to be explained first, which is Docker.\
    \ Docker is a platform that uses OS-level virtualization to operate packed software\
    \ called containers. These containers encapsulate an application and its dependencies,\
    \ ensuring consistency across various environments. As developers, we must get\
    \ familiar with the basic terms of containerization - image, container, and so\
    \ on. And learn the basic syntax of the Docker file: [https://docs.docker.com/engine/reference/builder/](https://docs.docker.com/engine/reference/builder/).\
    \ If you aren’t familiar with virtualization and containerization, it is recommended\
    \ reading about them in more detail."
  fmt: "\nAPI 是一种承诺，文档是对用户的承诺。开发人员希望因产品/工程需求引入新功能或进行破坏性更改。API 版本控制有助于实现这一目标。版本控制允许开发人员在不破坏现有客户端的情况下，在一个承诺与另一个承诺（承诺=版本）之间建立清晰的分离。\n\
    \n# 版本控制策略\n\n让我们看看 API 版本控制的主流策略。\n\n*   **URI 版本控制：** API 版本包含在每个端点中。\n\n  \
    \  `GET /api/v1/accounts`\n\n    `GET /api/v2/accounts`\n\n    这种方法很流行且非常容易实现。然而，REST\
    \ 方法希望 URI 中仅包含资源详细信息，而不包含版本。\n\n*   **查询参数版本控制：** 与 URI 版本控制类似，版本在 URI 中，但不是作为路径参数；而是作为查询参数包含在内。\n\
    \n    `GET /api/account?version=1`\n\n    `GET /api/account?version=2`\n\n   \
    \ 这与前一种策略相同，但不那么出名，且不要求客户端更改 URL，只需更改参数。\n\n*   **Header 版本控制：** 它包含一个指示 API 版本的\
    \ Header。\n\n    `GET /api/accounts Headers: { \"X-API-version\": \"1\" }`\n\n\
    \    `GET /api/accounts Headers: { \"X-API-version\": \"2\" }`\n\n    这种方法最符合\
    \ REST 方法。然而，版本可能对用户隐藏。\n\n# 版本控制最佳实践\n\n让我们探讨一些最佳实践：\n\n*   **采用三部分版本控制：** 版本控制模式的最佳实践如下：`major.minor.patch`。例如，1.3.2\
    \ - 主版本号为 1，次版本号为 3，补丁版本号为 2：\n\n    *   Major：用于引入破坏性或大规模 API 更改。\n    *   Minor：每当引入仍向后兼容的新功能和特性时。\n\
    \    *   Patch：用于错误修复。\n\n*   **向后兼容性：** 始终致力于支持旧功能和特性，而不是破坏它们。我们利用向后兼容性来减少对最终客户端的影响。\n\
    \n*   **沟通变更：** 每当发布新版本时，反映并详细说明变更内容并将其有效地传达给客户至关重要。\n\n# 弃用\n\n当必须弃用旧 API 版本时，我们将优雅地进行。宽限期必须非常长，并且我们必须频繁地向客户报告变更。我们必须给用户足够的时间迁移到新版本。文档也应反映弃用情况，并将端点标记为已弃用。\n\
    \n# 常见陷阱\n\n以下是 REST 中的一些常见陷阱：\n\n*   **过度使用 POST HTTP 方法：** 开发人员倾向于坚持使用 POST\
    \ 操作，即使这不是正确的选择。我们必须利用所有其他 HTTP 方法：`DELETE`、`PATCH`、`PUT`、`GET` 等。\n\n*   **不遵守前述约定：**\
    \ “资源”一词可能会让 REST 新手感到困惑，导致糟糕的资源命名。\n\n*   **缺乏版本控制：** 我们必须按照上一节所述保持 API 版本控制和弃用策略。\n\
    \n*   **选择不当的 HTTP 状态码：** 开发人员总是使用 200、400 和 500 状态码，而不是使用适当的 HTTP 状态码。\n\n* \
    \  **Swagger 文档混乱且包含错误信息。**\n\n*   **过度复杂化：** 开发人员最大的陷阱是使 API 变得繁琐和困惑。保持简单并不容易，但我们必须这样做。\n\
    \n# 结论\n\n在本章中，我们回顾了 RESTful API 的概念和约束。我们了解了是什么让通用 API 从仅仅是 API 变成了 RESTful API\
    \ —— 即 REST 约束。我们详细阐述了这些约束，并看到了它们在本章中的实现。我们学习了如何启动 API —— 从设计良好的架构第一步开始，使用 Swagger\
    \ 构建基于 OpenAPI 的适当文档，并为 Go 和 RESTful API 构建正确的结构。然后，我们开始使用 Go 编写 `gin-gonic` 服务器，并为\
    \ RESTful API 实现了分页、过滤、速率限制等几项标准功能。最后，我们讨论了 RESTful API 的相关约定，以及在需要时如何对 API 进行版本控制和弃用。在此过程中，我们提醒自己注意\
    \ RESTful 新手编写 API 时可能出现的常见陷阱。\n\n在下一章中，我们将探讨微服务架构中服务周期的一个关键方面：部署阶段。我们将使用市场上最适合此目的的最佳技术\
    \ —— Kubernetes 来探索部署阶段。\n\n# 参考资料\n\n*   [https://restfulapi.net/](https://restfulapi.net/)\n\
    *   [https://ics.uci.edu/~fielding/pubs/dissertation/rest_arch_style.htm](https://ics.uci.edu/~fielding/pubs/dissertation/rest_arch_style.htm)\n\
    *   [https://trends.google.com/trends/explore?date=all&q=REST&hl=en-GB](https://trends.google.com/trends/explore?date=all&q=REST&hl=en-GB)\n\
    *   [https://stripe.com/docs/api](https://stripe.com/docs/api)\n*   [https://www.twilio.com/docs/api](https://www.twilio.com/docs/api)\n\
    *   [https://www.baeldung.com/cs/uniform-resource-identifiers](https://www.baeldung.com/cs/uniform-resource-identifiers)\n\
    *   [https://swagger.io/](https://swagger.io/)\n*   [https://github.com/go-gorm/gorm](https://github.com/go-gorm/gorm)\n\
    *   [https://github.com/gin-gonic/gin](https://github.com/gin-gonic/gin)\n*  \
    \ [https://pkg.go.dev/net/http](https://pkg.go.dev/net/http)\n*   [https://go.dev/doc/tutorial/web-service-gin](https://go.dev/doc/tutorial/web-service-gin)\n\
    *   [https://medium.easyread.co/how-to-do-pagination-in-postgres-with-golang-in-4-common-ways-12365b9fb528](https://medium.easyread.co/how-to-do-pagination-in-postgres-with-golang-in-4-common-ways-12365b9fb528)\n\
    *   [https://www.atatus.com/blog/rest-api-design-filtering-sorting-and-pagination/](https://www.atatus.com/blog/rest-api-design-filtering-sorting-and-pagination/)\n\
    *   [https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Cache-Control](https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Cache-Control)\n\
    *   [https://medium.com/@nadinCodeHat/rest-api-naming-conventions-and-best-practices-1c4e781eb6a5](https://medium.com/@nadinCodeHat/rest-api-naming-conventions-and-best-practices-1c4e781eb6a5)\n\
    *   [https://readwrite.com/api-design-patterns-best-practices-for-building-resilient-apis/#:~:text=REST%20API%20Design%20Patterns&text=CRUD%20(Create%2C%20Read%2C%20Update,for%20resource%20discovery%20and%20navigation](https://readwrite.com/api-design-patterns-best-practices-for-building-resilient-apis/#:~:text=REST%20API%20Design%20Patterns&text=CRUD%20(Create%2C%20Read%2C%20Update,for%20resource%20discovery%20and%20navigation)\n\
    *   [https://codedamn.com/news/backend/rest-api-versioning-best-practices](https://codedamn.com/news/backend/rest-api-versioning-best-practices)\n\
    \n# 第 8 章\n\n# Kubernetes 简介\n\n# 简介\n\n在谈论 Kubernetes 之前，有一项需要首先解释的基础技术，即 Docker。Docker\
    \ 是一个使用操作系统级虚拟化来运行称为容器的打包软件的平台。这些容器封装了应用程序及其依赖项，确保跨各种环境的一致性。作为开发人员，我们必须熟悉容器化的基本术语\
    \ —— 镜像、容器等。并学习 Dockerfile 的基本语法：[https://docs.docker.com/engine/reference/builder/](https://docs.docker.com/engine/reference/builder/)。如果您不熟悉虚拟化和容器化，建议详细阅读相关内容。\n"
  trans: "\nAPI 是一种承诺，文档是对用户的承诺。开发人员希望因产品/工程需求引入新功能或进行破坏性更改。API 版本控制有助于实现这一目标。版本控制允许开发人员在不破坏现有客户端的情况下，在一个承诺与另一个承诺（承诺=版本）之间建立清晰的分离。\n\
    \n# 版本控制策略\n\n让我们看看 API 版本控制的主流策略。\n\n*   **URI 版本控制：** API 版本包含在每个端点中。\n\n  \
    \  `GET /api/v1/accounts`\n\n    `GET /api/v2/accounts`\n\n    这种方法很流行且非常容易实现。然而，REST\
    \ 方法希望 URI 中仅包含资源详细信息，而不包含版本。\n\n*   **查询参数版本控制：** 与 URI 版本控制类似，版本在 URI 中，但不是作为路径参数；而是作为查询参数包含在内。\n\
    \n    `GET /api/account?version=1`\n\n    `GET /api/account?version=2`\n\n   \
    \ 这与前一种策略相同，但不那么出名，且不要求客户端更改 URL，只需更改参数。\n\n*   **Header 版本控制：** 它包含一个指示 API 版本的\
    \ Header。\n\n    `GET /api/accounts Headers: { \"X-API-version\": \"1\" }`\n\n\
    \    `GET /api/accounts Headers: { \"X-API-version\": \"2\" }`\n\n    这种方法最符合\
    \ REST 方法。然而，版本可能对用户隐藏。\n\n# 版本控制最佳实践\n\n让我们探讨一些最佳实践：\n\n*   **采用三部分版本控制：** 版本控制模式的最佳实践如下：`major.minor.patch`。例如，1.3.2\
    \ - 主版本号为 1，次版本号为 3，补丁版本号为 2：\n\n    *   Major：用于引入破坏性或大规模 API 更改。\n    *   Minor：每当引入仍向后兼容的新功能和特性时。\n\
    \    *   Patch：用于错误修复。\n\n*   **向后兼容性：** 始终致力于支持旧功能和特性，而不是破坏它们。我们利用向后兼容性来减少对最终客户端的影响。\n\
    \n*   **沟通变更：** 每当发布新版本时，反映并详细说明变更内容并将其有效地传达给客户至关重要。\n\n# 弃用\n\n当必须弃用旧 API 版本时，我们将优雅地进行。宽限期必须非常长，并且我们必须频繁地向客户报告变更。我们必须给用户足够的时间迁移到新版本。文档也应反映弃用情况，并将端点标记为已弃用。\n\
    \n# 常见陷阱\n\n以下是 REST 中的一些常见陷阱：\n\n*   **过度使用 POST HTTP 方法：** 开发人员倾向于坚持使用 POST\
    \ 操作，即使这不是正确的选择。我们必须利用所有其他 HTTP 方法：`DELETE`、`PATCH`、`PUT`、`GET` 等。\n\n*   **不遵守前述约定：**\
    \ “资源”一词可能会让 REST 新手感到困惑，导致糟糕的资源命名。\n\n*   **缺乏版本控制：** 我们必须按照上一节所述保持 API 版本控制和弃用策略。\n\
    \n*   **选择不当的 HTTP 状态码：** 开发人员总是使用 200、400 和 500 状态码，而不是使用适当的 HTTP 状态码。\n\n* \
    \  **Swagger 文档混乱且包含错误信息。**\n\n*   **过度复杂化：** 开发人员最大的陷阱是使 API 变得繁琐和困惑。保持简单并不容易，但我们必须这样做。\n\
    \n# 结论\n\n在本章中，我们回顾了 RESTful API 的概念和约束。我们了解了是什么让通用 API 从仅仅是 API 变成了 RESTful API\
    \ —— 即 REST 约束。我们详细阐述了这些约束，并看到了它们在本章中的实现。我们学习了如何启动 API —— 从设计良好的架构第一步开始，使用 Swagger\
    \ 构建基于 OpenAPI 的适当文档，并为 Go 和 RESTful API 构建正确的结构。然后，我们开始使用 Go 编写 `gin-gonic` 服务器，并为\
    \ RESTful API 实现了分页、过滤、速率限制等几项标准功能。最后，我们讨论了 RESTful API 的相关约定，以及在需要时如何对 API 进行版本控制和弃用。在此过程中，我们提醒自己注意\
    \ RESTful 新手编写 API 时可能出现的常见陷阱。\n\n在下一章中，我们将探讨微服务架构中服务周期的一个关键方面：部署阶段。我们将使用市场上最适合此目的的最佳技术\
    \ —— Kubernetes 来探索部署阶段。\n\n# 参考资料\n\n*   [`restfulapi.net/`](https://restfulapi.net/)\n\
    *   [`ics.uci.edu/~fielding/pubs/dissertation/rest_arch_style.htm`](https://ics.uci.edu/~fielding/pubs/dissertation/rest_arch_style.htm)\n\
    *   [`trends.google.com/trends/explore?date=all&q=REST&hl=en-GB`](https://trends.google.com/trends/explore?date=all&q=REST&hl=en-GB)\n\
    *   [`stripe.com/docs/api`](https://stripe.com/docs/api)\n*   [`www.twilio.com/docs/api`](https://www.twilio.com/docs/api)\n\
    *   [`www.baeldung.com/cs/uniform-resource-identifiers`](https://www.baeldung.com/cs/uniform-resource-identifiers)\n\
    *   [`swagger.io/`](https://swagger.io/)\n*   [`github.com/go-gorm/gorm`](https://github.com/go-gorm/gorm)\n\
    *   [`github.com/gin-gonic/gin`](https://github.com/gin-gonic/gin)\n*   [`pkg.go.dev/net/http`](https://pkg.go.dev/net/http)\n\
    *   [`go.dev/doc/tutorial/web-service-gin`](https://go.dev/doc/tutorial/web-service-gin)\n\
    *   [`medium.easyread.co/how-to-do-pagination-in-postgres-with-golang-in-4-common-ways-12365b9fb528`](https://medium.easyread.co/how-to-do-pagination-in-postgres-with-golang-in-4-common-ways-12365b9fb528)\n\
    *   [`www.atatus.com/blog/rest-api-design-filtering-sorting-and-pagination/`](https://www.atatus.com/blog/rest-api-design-filtering-sorting-and-pagination/)\n\
    *   [`developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Cache-Control`](https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Cache-Control)\n\
    *   [`medium.com/@nadinCodeHat/rest-api-naming-conventions-and-best-practices-1c4e781eb6a5`](https://medium.com/@nadinCodeHat/rest-api-naming-conventions-and-best-practices-1c4e781eb6a5)\n\
    *   [`readwrite.com/api-design-patterns-best-practices-for-building-resilient-apis/#:~:text=REST%20API%20Design%20Patterns&text=CRUD%20(Create%2C%20Read%2C%20Update,for%20resource%20discovery%20and%20navigation`](https://readwrite.com/api-design-patterns-best-practices-for-building-resilient-apis/#:~:text=REST%20API%20Design%20Patterns&text=CRUD%20(Create%2C%20Read%2C%20Update,for%20resource%20discovery%20and%20navigation)\n\
    *   [`codedamn.com/news/backend/rest-api-versioning-best-practices`](https://codedamn.com/news/backend/rest-api-versioning-best-practices)\n\
    \n# 第 8 章\n\n# Kubernetes 简介\n\n# 简介\n\n在谈论 Kubernetes 之前，有一项需要首先解释的基础技术，即 Docker。Docker\
    \ 是一个使用操作系统级虚拟化来运行称为容器的打包软件的平台。这些容器封装了应用程序及其依赖项，确保跨各种环境的一致性。作为开发人员，我们必须熟悉容器化的基本术语\
    \ —— 镜像、容器等。并学习 Dockerfile 的基本语法：[`docs.docker.com/engine/reference/builder/`](https://docs.docker.com/engine/reference/builder/)。如果您不熟悉虚拟化和容器化，建议详细阅读相关内容。\n"
