    \ B logic here\n    } else {\n        fmt.Println(\"Feature B is not enabled.\"\
    )\n    }\n\n    // Rest of the application logic\n}\n\nfunc getEnvBool(flagName\
    \ string, defaultValue bool) bool {\n    value, exists := os.LookupEnv(flagName)\n\
    \    if !exists {\n        return defaultValue\n    }\n    result, err := strconv.ParseBool(value)\n\
    \    if err != nil {\n        fmt.Printf(\"Error parsing environment variable\
    \ %s: %v\\n\", flagName, err)\n        return defaultValue\n    }\n    return\
    \ result\n}\n```\n\nHere is an example of feature toggling in Golang. In the example,\
    \ we have two boolean flags — `feature-a` and `feature-b`. The function `getEnvBool`\
    \ dynamically checks the value of a flag using environment variables. The same\
    \ check can be made by an API request to a third-party service. In the `main`\
    \ function, we ask for the value of the flags and then determine whether to execute\
    \ the business logic.\n\nWe can create a feature toggling external service by\
    \ ourselves, or, more recommended is to use widely used SaaS like LaunchDarkly.\n\
    \n## Rollouts\n\nWhile deploying applications and services to production, the\
    \ friction point of switching between the previous and new versions is called\
    \ rollout. There are several techniques for performing a rollout, and all of them\
    \ can be implemented in Kubernetes by using its native utilities or external software\
    \ suitable for Kubernetes. Let's observe the different techniques.\n\n## Basic\
    \ Deployment\n"
  trans: "\n在前面的代码示例中，我们使用 `sizedwaitgroup` 包中的 `New` 函数设置了一个“特殊的 `WaitGroup`”，该函数接受最大\
    \ goroutine 数量作为数值参数。之后，我们使用一个遍历 0-99 的 for 循环。然后，像普通的 `WaitGroup` 一样，我们使用 `Add()`\
    \ 函数声明 goroutine 启动。\n\n在 goroutine 内部，我们执行 `logic` 函数，该函数打印数字并休眠一秒，然后使用 `Done()`\
    \ 函数表示 goroutine 完成了工作。最终结果是输出会每次以 5 个元素为一批打印所有数字，并在每批之间等待一秒。\n\n# 安全\n\n在本章中，我们将简要讨论围绕服务的安全性\
    \ —— 主要从开发者的角度出发，即认证和授权。部署安全的服务到生产环境以防止恶意威胁的访问至关重要 —— 但我们不会探讨作为运维一部分所需采取的安全措施。这主要是因为这是运维的责任，而非开发者。\n\
    \n在任何微服务系统中，我们都希望保证仅系统用户能够访问。\n\n此外，每个用户通常都有特定且不同的访问限制。要实现这两点，我们必须实施认证和授权。\n\n\
    ## 认证\n\n> “认证验证你就是你声称的那个人，或者你拥有的东西不是伪造品。它可能涉及验证文件、要求你提供输入，或两者兼有。”\n\n这是来自 Okta\
    \ 的一句很好地描述了认证的引言。\n\n在 Web 应用程序中实现认证有多种选择，范围从使用第三方服务到自行实现认证服务。以下是一些示例：\n\n###\
    \ 第三方服务\n\n*   **Auth0**：Auth0 提供认证和授权即服务。\n*   **Firebase Authentication**：Firebase\
    \ 提供一套用于构建 Web 和移动应用程序的服务，包括认证。\n\n### 自行实现的认证\n\n*   **JWT（即 JSON Web Token）**：我们可以使用\
    \ JWT 实现认证。JWT 是包含一组声明的编码令牌，可用于认证用户。\n*   **基于会话的认证**：我们可以使用会话和 Cookie 实现认证。当用户登录时，会在服务器上创建一个会话，会话\
    \ ID 存储在客户端的 Cookie 中。后续请求包含会话 ID，服务器用它来认证用户。\n\n### 库/框架\n\n*   **Passport.js**：Passport.js\
    \ 是 Node.js 流行的认证中间件。\n*   **Spring Security**：Spring Security 是一个强大且高度可定制的认证和访问控制框架，用于\
    \ Java 应用程序。\n\n## 授权\n\n> “在系统安全中，授权是给予用户访问特定资源或功能权限的过程。该术语常与访问控制或客户端特权互换使用。”\
    \ —— 另一句来自 Okta 的引言描述了授权。\n\n与认证不同，授权过程要求我们实现业务逻辑。只有当我们了解系统的资源和功能时，产品团队才会定义用户权限的样子。在微服务架构中，系统中的每个服务都必须在拥有授权系统时强制执行用户权限。\n\
    \n问题在于我们不想为每个服务实现单独的授权系统。通常，授权逻辑在整个系统中是相似的，我们希望利用这一点来创建一个中央授权服务或包含授权逻辑的共享代码。无论我们使用外部授权服务还是仅仅共享代码，我们都会使用中间件将用户权限注入到单个服务的上下文中。\n\
    \n正如我们在 *第 7 章，构建 RESTful API* 中提到的许多其他能力一样，中间件可以根据需要使用共享代码或集中式授权服务。我们需要通过代码手动强制执行用户权限，或在数据库层面更自动地执行。以下是使用授权的用例：\n\
    \n*   仅授予账户管理员访问端点 `POST /users` 的权限。\n*   授予所有用户访问端点 `GET /views` 的权限，仅授予管理员和经理访问\
    \ `UPDATE /views` 的权限，仅授予管理员访问 `DELETE /views` 的权限。\n\n## 功能开关\n\n在部署服务到生产环境时获得信心的另一种方法是使用功能开关。功能开关允许我们在服务中使用标志（所谓的功能标志）。标志是动态值，通常是布尔值，在服务运行时从其他服务注入。标志可以针对不同用户具有不同的配置。标志可用于多种目的：测试新功能、A/B\
    \ 测试、负载测试、因客户要求仅向特定用户开放功能等。\n\n以下是一些标志示例：\n\n*   一个名为 `show-billing-tab-ui` 的布尔标志决定名为\
    \ `billing` 的 UI 标签页是否打开。我们可以仅向公司内部的产品经理展示该功能（`billing` 标签页），以便他们在向所有客户发布前进行批准或完善。\n\
    *   一个名为 `pagination-size` 的数值标志决定 API 的分页大小，可用于测试最佳性能的最优分页大小。\n\n```\nfunc main()\
    \ {\n    if getEnvBool(\"feature-a\", false) {\n        fmt.Println(\"Feature\
    \ A is enabled. Performing Feature A logic.\")\n        // Include Feature A logic\
    \ here\n    } else {\n        fmt.Println(\"Feature A is not enabled.\")\n   \
    \ }\n\n    if getEnvBool(\"feature-b\", false) {\n        fmt.Println(\"Feature\
    \ B is enabled. Performing Feature B logic.\")\n        // Include Feature B logic\
    \ here\n    } else {\n        fmt.Println(\"Feature B is not enabled.\")\n   \
    \ }\n\n    // Rest of the application logic\n}\n\nfunc getEnvBool(flagName string,\
    \ defaultValue bool) bool {\n    value, exists := os.LookupEnv(flagName)\n   \
    \ if !exists {\n        return defaultValue\n    }\n    result, err := strconv.ParseBool(value)\n\
    \    if err != nil {\n        fmt.Printf(\"Error parsing environment variable\
    \ %s: %v\\n\", flagName, err)\n        return defaultValue\n    }\n    return\
    \ result\n}\n```\n\n这是一个 Golang 中功能开关的示例。在示例中，我们有两个布尔标志 —— `feature-a` 和 `feature-b`。函数\
    \ `getEnvBool` 使用环境变量动态检查标志的值。同样的检查也可以通过向第三方服务发起 API 请求来完成。在 `main` 函数中，我们请求标志的值，然后决定是否执行业务逻辑。\n\
    \n我们可以自行创建功能开关外部服务，或者更推荐使用广泛采用的 SaaS，如 LaunchDarkly。\n\n## 发布\n\n在将应用程序和服务部署到生产环境时，在旧版本和新版本之间切换的摩擦点称为发布。有多种执行发布的技术，所有这些技术都可以通过使用\
    \ Kubernetes 的原生工具或适用于 Kubernetes 的外部软件来实现。让我们观察一下不同的技术。\n\n## 基础部署\n"
