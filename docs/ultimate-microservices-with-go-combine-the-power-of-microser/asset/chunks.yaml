- raw: "    ![](OEBPS/images/Figure-10.2.jpg)\n\n    **Figure 10.2:** Counter Metric\
    \ example of “Job execution total”\n\n*   **Gauge:** A single number metric representing\
    \ an arbitrary value that can go up or down. Examples of gauge metrics include\
    \ temperature, CPU usage, memory usage, and the number of active users.\n\n* \
    \  **Histogram:** A metric that samples observations and counts the observations\
    \ in buckets. For example, a histogram can measure latency, request size, task\
    \ duration, and so on. \n\n    ![](OEBPS/images/Figure-10.3.jpg)\n\n    **Figure\
    \ 10.3:** Histogram Metric example of People’s Height (cm)\n\n# [Tracing](#toc.xhtml#s229a)\n\
    \nTrace is a newer telemetry than log and metric. It gives a much more comprehensive\
    \ view of the application. Trace’s goal is to follow the application’s flow, whether\
    \ data propagation or request flow, which is relevant for RESTful API services\
    \ in a microservices architecture due to the frequent request rate. Tracing allows\
    \ us to see the flow of functions from start to end, which function invokes which\
    \ function/s, the duration of each function, the parameters passed between them,\
    \ metadata about each step, and more. Each step is inside a trace called a span.\
    \ The entire trace can tell a user’s story and what happened to him along the\
    \ way.\n\n![](OEBPS/images/Figure-10.4.jpg)\n\n**Figure 10.4:** Tracing Example\n\
    \nIn the preceding figure, we can see an example of a trace. The trace aims to\
    \ track and endpoint `GET /api/v1/articles/:article_id`. In the trace, we can\
    \ see three spans - `authenticate``,` `get article:41348``,` `SELECT FROM articles\
    \ WHERE id`. For each span, we can see duration, the order of the spans, and other\
    \ data not shown in the figure. A more advanced tracing capability is to perform\
    \ distributed tracing. This involves performing a wide trace instead of a trace\
    \ inside a single application, a single trace across many services.\n\n# [Production\
    \ Troubleshooting](#toc.xhtml#s230a)\n\nProduction troubleshooting is a systematic\
    \ process of taking immediate action to remediate the issue to return the system\
    \ to a healthy state, performing RCA, and resolving the root cause to prevent\
    \ the same problem from occurring again. Let’s break this process of troubleshooting.\n\
    \n![](OEBPS/images/Figure-10.5.jpg)\n\n**Figure 10.5:** Troubleshooting Parts\n\
    \n**RCA,** which stands for **Root Cause Analysis**, is the process of identifying\
    \ the underlying reason for a bug. For example, a service has a metric that follows\
    \ its error rate for a month, and the value is between 0.1% and 0.2% all the time.\
    \ Immediately after a PR (Pull Request) named “*Changing the API configuration*”\
    \ was deployed to production, the error rate metric increased significantly to\
    \ 50%. We can confidently assume that the root cause is the PR mentioned.\n\n\
    There are various ways to perform RCA - looking at the services dashboard, putting\
    \ alerts on a service (we’ll discuss it later in this chapter), looking into problematic\
    \ logs, looking at the system metrics, Kubernetes cluster metrics, Kubernetes\
    \ logs, describing the service’ Pods in Kubernetes, CI/CD changes, downtime of\
    \ third-party service, anomaly detection, profiling (which we’ll discuss it further\
    \ in this chapter), and so on.\n\n**Remediation** refers to the process of preventing\
    \ a current bad state from occurring.\n\nUntil we have performed any remediation\
    \ action, our system isn’t working correctly or, worse, not working at all. Such\
    \ a situation is called P0. The Remediation process can be performed in several\
    \ ways: Rollback in Kubernetes, as described in *[Chapter 8, Introduction to Microservices](#c08.xhtml),*\
    \ reverting a PR, increasing replicas, updating expired configuration, and so\
    \ on.\n\nSometimes, we don’t have to perform full RCA to perform remediation,\
    \ which can be partial. For example, if we indicated a bad PR, the remediation\
    \ action is probably to revert it, although we don’t know what was inside the\
    \ PR that caused the bug.\n\n**Resolve** refers to the process of preventing the\
    \ lousy state from occurring again. By understanding the root cause of the issue,\
    \ we can take preventive actions. Examples of resolve actions- fixing a bug through\
    \ debugging, tweaking API/DB configuration, increasing replica amount, and so\
    \ on. Note that the remediation action is sometimes the same as the resolve action.\n\
    \n# [The Power of Theory](#toc.xhtml#s231a)\n\n**There is no theory without observability\
    \ and vice versa.**\n\nWe already discussed observability, but let’s discuss theory\
    \ and explain the preceding statement. A theory is an idea that explains the existing\
    \ data: why do the graphs look the way they are stacked and not the other way\
    \ around? For example, we can see a graph of ongoing increments in memory usage,\
    \ which can be explained by memory leaks.\n\nTo illustrate the relationship between\
    \ **theory** and **observability,** we’ll give an analogy from Reference number\
    \ 5.\n\nIs a doctor with extensive knowledge about the human body and always up\
    \ to date with the latest medical news a good doctor? The answer is no unless\
    \ the doctor can test the patient and get data about him. Without proper testing\
    \ of the patient, he won’t be able to serve the appropriate treatments, and every\
    \ treatment without data will be a guess.\n\nOn the other hand, you are an average\
    \ person without a fundamental understanding of the human body. Still, you have\
    \ the latest technology for testing patients and all the patient data. Are you\
    \ a good doctor? The answer is no unless you have fundamental knowledge about\
    \ the human body.\n\n![](OEBPS/images/Figure-10.6.jpg)\n\n**Figure 10.6:** Observability\
    \ and Theory\n\nThe analogy of a doctor is moral to a developer, the theory is\
    \ moral to the doctor’s knowledge, and data is moral to data. Without a rich theory\
    \ based on software knowledge and internal business knowledge on the one hand\
    \ and data on the other hand, we can’t gain observability.\n\nEach time we start\
    \ troubleshooting or performing RCA, we should keep some theory in mind regarding\
    \ the root cause and validate the theory against the data, or looking at the data\
    \ will lead us to consolidate another theory that we can validate.\n\n# [Profiling](#toc.xhtml#s232a)\n\
    \nProfiling analyzes a program in runtime to measure metrics like execution time,\
    \ CPU usage, memory usage, goroutines running, and more. Profiling allows us to\
    \ identify bottlenecks, improve performance, and optimize code efficiency. Usually,\
    \ using third-party tools like Grafana or DataDog will create a flame graph. Although\
    \ there are other ways to view profiling data.\n\n![](OEBPS/images/Figure-10.7.jpg)\n\
    \n**Figure 10.7:** CPU time profiling flame graph\n\nIn the preceding figure,\
    \ we can see an example of Golang application profiling of CPU time in Google\
    \ Cloud. However, we can use a native tool invented by the Golang team - `pprof`.\
    \ Let’s see how to use it:\n\n`package main`\n\n`import (`\n\n`“net/http”`\n\n\
    `_ “net/http/pprof”`\n\n`“sync”`\n\n`“time”`\n\n`)`\n\n`var leakSlice1 = []string{}`\n\
    \n`var leakSlice2 = []string{}`\n\n`var leakSlice3 = []string{}`\n\n`func main()\
    \ {`\n\n`// start pprof server`\n\n`go func() {`\n\n`http.ListenAndServe(“:6060”,\
    \ nil)`\n\n`}()`\n\n`wg := sync.WaitGroup{}`\n\n`wg.Add(1)`\n\n`go leak(&wg)`\n\
    \n`wg.Wait()`\n\n`}`\n\n`func leak(wg *sync.WaitGroup) {`\n\n`defer wg.Done()`\n\
    \n`for i := 0; i < 10_000_000; i++ {`\n\n`appendToLeakSlice1()`\n\n`if (i % 10_000)\
    \ == 0 {`\n\n`time.Sleep(100 * time.Millisecond)`\n\n`}`\n\n`}`\n\n`}`\n\n`func\
    \ appendToLeakSlice1() {`\n\n`leakSlice1 = append(leakSlice1, “a”)`\n\n`appendToLeakSlice2()`\n\
    \n`}`\n\n`func appendToLeakSlice2() {`\n\n`leakSlice2 = append(leakSlice2, “ab”)`\n\
    \n`appendToLeakSlice3()`\n\n`}`\n\n`func appendToLeakSlice3() {`\n\n`leakSlice3\
    \ = append(leakSlice3, “abc”)`\n\n`}`\n\nIn the preceding example, all we needed\
    \ to start the profile was:\n\n*   Importing the `pprof` package by declaring:\
    \ `_ “net/http/pprof”`.\n\n*   Start a goroutine in some port: \n\n    `go func()\
    \ {`\n\n    `http.ListenAndServe(“:6060”, nil)`\n\n    `}()`\n\nThe code after\
    \ that is there to demonstrate the memory usage of the program. To look at the\
    \ memory usage, we can use the Golang CLI:"
