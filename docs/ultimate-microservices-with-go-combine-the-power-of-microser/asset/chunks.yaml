    available on the GitHub repository of this book. While reading this chapter, you
    are welcome to stop reading, practice code examples, or delve into a specific
    topic. If you decided to code while reading this chapter, it is recommended to
    code using Go Playground or VSCode (Visual Studio Code). But, use any IDE you
    find most suitable for you. There is no correct answer. We won’t cover installation/environment
    setup instructions, which you are welcome to see in Go’s official documentation
    - Effective Go.


    Another thing worth mentioning here is that you already know how to program in
    another programming language. Based on this assumption, we won’t cover programming
    concepts. We will cover those concepts’ syntax, conventions, best practices, and
    semantics in Go.


    This chapter serves as a concise overview of the Go programming language, designed
    to provide a quick and insightful introduction. It equips you with the foundational
    knowledge needed to derive value from the rest of the book.


    # [Structure](#toc.xhtml#s42a)


    In this chapter, we will discuss the following topics:


    *   Basic Overview of Golang


    *   Packaging — Accessing Between Packages


    *   Project Structure


    *   Structs


    *   Composition


    *   Interfaces


    # [Basic Overview of Golang](#toc.xhtml#s43a)


    Let’s start exploring the basic syntax of Go!


    Any programming language has a wide variety of syntax, keywords, libraries, and
    so on. We won’t aim to cover them all. For that, you are welcome to read the Go
    documentation.


    We will concentrate on the essentials so you can proceed with this book without
    going to external sources.


    Regarding all the conventions and styles of Go, we recommend you read the Uber
    guide to styles and conventions in Go, which is very useful and easy to read.
    It is attached in the references. We aim to provide Go’s most essential and basic
    styles and conventions.


    # [Hello World](#toc.xhtml#s44a)


    We will start with the most basic code example - a “Hello World” program example
    in Golang.


    `package main`


    `import “fmt”`


    `func main() {`


    `fmt.Println(“Hello World!”)`


    `}`


    The command we used to run the program is:


    `go run Chapter-4/Hello-World/main.go`


    The first line:


    `package main`


    In Go, we use the saved keyword `package` and then use the package’s name; in
    this case, the package name is `main`. The entry point package must be `main`
    to start a Go program.


    After declaring the package, we’ll declare the imports using the keyword `import`
    and then declare the package we want to import. In this example, the package name
    we use is `fmt`.


    We can declare several packages in the same way:


    `import (`


    `“fmt”`


    `“os”`


    `)`


    After declaring the package and the imports, we can declare types, consts, methods,
    and functions. In the example, we declared a function called `main,` the program’s
    entry point in the `main` package.


    We declared a function by using the keyword `func`, then declaring the function
    name, the parameters, `“{“` to open scope and `“}”` to close scope.


    The `main()` function plays a crucial role as the entry point of a Go program,
    where execution begins. It is not a normal function; it is the running point to
    initiate the program’s processes, making it essential for any Go application.


    The last line:


    `fmt.Println(“Hello World!”)`


    This line functionality is to print the string - `Hello World!.` We used the function
    `Println`, which is a function inside the package `fmt`.


    Another essential and saved function (rather than `main`) is `init()`. This will
    run at the program’s start; it is the only function that runs before `main()`.


    # [Variables](#toc.xhtml#s45a)


    We have three ways to declare a variable in Go.


    The first way is as follows:


    `var emptyMessage string`


    Here, we declare the keyword `var`, then the variable name - `emptyMessage`. In
    the example, the variable is of type string.


    There is also an option to give a value to that variable while declaring it:


    `var message string = “This is a message”`


    Note that if we don’t give it an initial value like in the first example, it will
    give it a default value. There is a different value for each primitive data type,
    nil for a pointer, and empty struct values for structs. We will elaborate on the
    default values of primitive data types later in this chapter.


    The second way to declare a variable is to let the Go compiler infer the variable
    type by itself.


    `var inferredMessage = “This is an inferred message”`


    In that example, we didn’t have to declare the `string`. The Go compiler inferred
    it from the syntax.


    The third way to declare a variable in Go is by using `:=.`


    `alsoInferredMessage := “This is also an inferred message”`


    Here, we didn’t have to declare the keyword `var` or `string,` just `“:=”`.


    In Go, variables can’t change their type in runtime because Go is a static programming
    language, as we saw in *[Chapter 2, Usability of Go](#c02.xhtml)*.


    The convention for variables, functions, maps, structs, and everything we declare
    in Go is camelCase unless we want them to be public, in which case they will be
    PascalCase. We will discuss access modifiers in this chapter.


    # [Primitive Data Types](#toc.xhtml#s46a)


    Let’s have a look at this code block:


    `package main`


    `import “fmt”`


    `func main() {`


    `message := “This is a message”`


    `fmt.Println(message)`


    `var zero int`


    `fmt.Println(zero)`


    `number := 42`


    `fmt.Println(number)`


    `var pi float64 = 3.14`


    `fmt.Println(pi)`


    `var booleanVar bool`


    `fmt.Println(booleanVar)`


    `trueBooleanVar := true`


    `fmt.Println(trueBooleanVar)`


    `}`


    There are four primitive data types in Go - `string, boolean, float32 (also float64),`
    and `int` (also `int8`, `int 16`, `int32`, `int64`, `uint`, `unit8`, `unit16`,
    `unit32`, `unit64`).


    *   `string` is for text. The default value is an empty text `“”`.


    *   `int` is for a whole number. The default value is `0`.


    *   `float32` is for a floating point number. The default value is `0`.


    *   `bool` is for `true` or `false`. The default value is `false`.


    As we saw before, we can declare a variable without declaring the type, but the
    type will be inferred. Go will choose the most convenient type. For instance,
    if we want the variable to be `int8` and not `int,` we must declare it. Otherwise,
    the Go compiler will choose an `int`.


    # [Comments](#toc.xhtml#s47a)


    There are two types of comments:


    *   single-line


    *   multiline


    Here is a single-line example:


    `func main() {`


    `// This is simple comment`


    `}`


    Here is a multiline example:


    `/*`


    `This is a multi-line comment`


    `*/`


    `fmt.Println(“Hello World!”)`


    For single-line comments, use `//` and for multiline, start with `/*` and end
    with `*/`.


    # [Operators](#toc.xhtml#s48a)


    Let’s put here an example for all the operators in Go. The operators in Go are
    very similar to any other programming language.


    `package main`


    `func main() {`


    `// Arithmetic Operators`


    `x := 5 + 5 // 10`


    `x = 5 - 5  // 0`


    `x = 5 * 5  // 25`


    `x = 5 / 5  // 1`


    `x = 5 % 5  // 0`


    `x++        // 6`


    `x--        // 5`


    `// Comparison Operators`


    `y := 5 == 5 // true`


    `y = 5 != 5  // false`


    `y = 5 > 5   // false`


    `y = 5 < 5   // false`


    `y = 5 >= 5  // true`


    `y = 5 <= 5  // true`


    `// Logical Operators`


    `a := true && true // true`


    `a = true && false // false`


    `a = true || true  // true`


    `a = true || false // true`


    `a = !true         // false`


    `a = !false        // true`


    `// Bitwise Operators`


    `b := 5 & 5 // 5`


    `b = 5 | 5  // 5`


    `b = 5 ^ 5  // 0`


    `b = 5 << 5 // 160`


    `b = 5 >> 5 // 0`


    `// Assignment Operators`


    `c := 5`


    `c += 5  // 10`


    `c -= 5  // 5`


    `c *= 5  // 25`


    `c /= 5  // 5`


    `}`


    # [`If` statement](#toc.xhtml#s49a)


    Like other languages, the keywords that exist are `if and else`. Also, their usage
    is exactly the same.


    # [Loops](#toc.xhtml#s50a)'
