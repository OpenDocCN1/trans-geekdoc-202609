- raw: 'For example, the HTTP method like *DELETE + URI* to a specific resource (`DELETE`
    `https://domain:port/api/account/{accountId``}`) indicates that the client requests
    the API to delete an account that has `accoundId` Account ID. The developer must
    understand the URI easily without further documentation (at least most of the
    time).


    *   **Self-descriptive messages:** The message must contain all the “*instructions*”
    on the desired resource. The server should only have all the necessary information
    from the message without further questions or information.


    *   **Hypermedia As The Engine Of Application State (HATEOAS) :** Hypermedia refers
    to all forms of media such as movies, pictures, files, and more. When a client
    requests the RESTful API server to get data on a resource, it expects to get that
    resource’s data. A portion of the data can be hypermedia, and REST aims to provide
    links to the media data instead of the data in some form.


    # [Stateless](#toc.xhtml#s137a)


    Each request from the client to the server is isolated. The server must neither
    rely on previous requests in any manner nor on the local dynamic context of the
    server. Client requests must contain all the necessary data to execute the request
    as desired.


    # [Layered System](#toc.xhtml#s138a)


    Each request from the client to the server goes through layers. There is never
    a direct connection between the client and the business logic. These layers can
    be, for example, authentication, caching, load balancing, and more. This constraint
    encourages us to create separated layers between the client and the server, such
    as in microservices architecture. The client is agnostic to the different layers
    between him and the server. Most layers often exist in the API gateway — as described
    in the previous chapter.


    # [Cacheable](#toc.xhtml#s139a)


    This constraint forces the server to return a response, which includes data indicating
    whether the data is from the cache.


    # [Code on Demand](#toc.xhtml#s140a)


    This constraint isn’t frequent nor required. The server can provide the client
    with additional functionality by downloading applets or scripts. For example,
    the client wants to convert JPEG to PDF, so he requests from the server a script
    that does it. The client gets the script and executes it.


    # [Designing an API](#toc.xhtml#s141a)


    Before approaching writing a service, the first step is to understand the product
    requirements, engineering constraints, and anything that can impact decisions.
    Define what it will look like, what the necessary capabilities are, what isn’t,
    and how to implement it. Decide what the available resources are and their corresponding
    representations.


    # [Capabilities](#toc.xhtml#s142a)


    Standard capabilities across RESTful APIs are as follows:


    *   Documentation


    *   Authentication and Authorization (can be at the API gateway layer)


    *   RBAC (can be at the API gateway layer)


    *   Pagination


    *   Rate limit


    *   Caching


    *   Filtering


    *   Sorting


    *   Monitoring and Observability


    *   Feature toggling


    *   Alerting


    *   Error handling


    *   Auto code-client generated


    Each API probably doesn’t need all those capabilities and probably needs other
    capabilities we didn’t mention here. When building microservices architecture,
    each API will want to implement a portion or more of these capabilities, probably
    in the same shape as the other APIs. If we implement the same capabilities repeatedly
    for each API (even if we use a package for each capability), we will end up with
    tons of boilerplate code that differs slightly in each API.


    To solve this problem, we need to create a shared infrastructure. One way to implement
    shared infrastructure is through shared code (when using monorepo). In Go, this
    code will be in a directory called `pkg`. Another way to implement shared infrastructure
    is to use SDKs (when using `polyrepo`); each API will import and use this SDK
    for its own needs).


    # [Documentation: Swagger and OpenAPI](#toc.xhtml#s143a)


    The most crucial part of constructing an API is documenting the API specification.
    An industry standard to document the API specification is to use Swagger and OpenAPI.


    OpenAPI is the official name for a specification that standardizes API documentation.
    It has a unique syntax and can be written in JSON or YAML.


    Swagger is a set of tools that helps implement OpenAPI. Most Swagger tools are
    accessible in the OSS project; paying is an option for advanced tools.


    *   **Swagger Editor**: A tool allowing us to edit Swagger YAML online and view
    the changes.


    *   **Swagger UI**: A tool that generates UI for OpenAPI specification.


    *   **Swagger Codegen**: With OpenAPI specific, Swagger Codegen can generate various
    API clients and servers in many programming languages.


    *   Other tools that can help with various needs that we will not mention here.


    ![](OEBPS/images/Figure-7.4.jpg)


    **Figure 7.4:** Swagger editor ([https://editor.swagger.io/](https://editor.swagger.io/))


    Swagger is the most potent and widespread set of tools due to its simple syntax,
    but it has many options for describing APIs. The agreement between the client
    and the server is to use centralized documentation. Many times, the developers/teams
    that work on the API server vary from the developers/teams that work on the client.


    # [API Folder Structure](#toc.xhtml#s144a)


    In *[Chapter 3, Go Essentials](#c03.xhtml)*, we discussed Go’s folder structure.
    We’ll combine that folder structure with the API folder structure into a united
    structure. A well-designed folder structure will serve the developers’ needs.
    From onboarding — whether they know the project or not — the navigation will be
    without hesitation until writing code — where to find logic and where to add new
    resources or capabilities.


    Here, we’ll show two famous file structures, but first, let’s observe their commonalities.


    ![](OEBPS/images/Figure-7.5.jpg)


    **Figure 7.5:** The highest level of API structure


    The first folder is `cmd`, which we already discussed, but now we have another
    executable: the `docs`.


    ![](OEBPS/images/Figure-7.6.jpg)


    **Figure 7.6:** cmd structure in API


    The `docs` directory contains another `main.go`, which is the entry point like
    the server `main.go` but for deploying the documentation. We can use Swagger UI
    to generate UI on the `swagger.yaml`.


    The second directory name is `deploy`, which contains all the configurations for
    deploying the executables and other assets that are related to the server, such
    as networking, configuration, autoscaling, and more. The `pkg` and `scripts` directories
    have the same purpose as described in the third chapter - they contain shared
    code between servers and scripts, respectively. The files `go.mod, go.sum, README.md,`
    and `Dockerfile` will be in the leading directory.


    In the two examples of API structures, we’ll follow the structure of a grocery
    store. For simplicity, we’ll divide the products in the shop into two categories
    (so-called tags in OpenAPI) - **fruits** and **vegetables**.


    For the category of fruits, we have apples and bananas. For the category of vegetables,
    we have tomatoes and cucumbers. Each fruit (apple, banana) and each vegetable
    (tomato, cucumber) is a resource by the REST definition. We can buy more cucumbers
    (CREATE), see how many cucumbers we have (READ), sell some of them (DELETE), or
    update their new price today (UPDATE).


    ![](OEBPS/images/Figure-7.7.jpg)


    **Figure 7.7:** API internal file structure A


    The preceding figure presents the file structure for option A, which is the only
    difference between option B. Let’s go through the directories and files inside
    it.


    *   `common`: This directory includes boilerplate code used across all resources,
    shared functionality, utils, and abstraction that each resource needs to use.
    For example, a file called `query-params.go` helps to serialize all query parameters
    from the request.'
