- raw: 'Nevertheless, it is essential to note that this may not be the case for Go,
    as it deviates from this pattern of constant expansion.


    Upon examining the release notes of Go, it becomes evident that most updates primarily
    focus on compilation enhancements, performance improvements, and accuracy refinements.
    While there are certainly some introductions of new features and capabilities
    (a significant example is generics), they don’t make up the bulk of the changes.
    This emphasis on simplicity is what Go is aiming for. They want to keep Go **boring**.


    An example of Go’s simplicity and minimalism is the number of keywords in the
    language. Here is a graph showing the number of keywords.


    ![](OEBPS/images/Figure-2.1.jpg)


    **Figure 2.1:** Programming language by keyword count


    If a programming language has many keywords, it doesn’t necessarily mean it’s
    a bad language. Conversely, a language with a low number of keywords doesn’t automatically
    indicate that it’s a good programming language. The quality and effectiveness
    of a programming language depend on many factors beyond just the count of keywords
    it have.


    But it is sure to say that it is easier to remember and use fewer keywords. We
    can see that Go is one of the languages with the lowest keywords.


    **Hidden complexity**


    There are many concepts within the language, and a lot of effort was put into
    them to create a powerful programming language on the one hand and a simple language
    on the other.


    The concurrency approach is an excellent example of hidden complexity. We will
    talk in detail regarding the concurrency approach later in this chapter. It only
    requires three keystrokes to concurrency — ‘`g`,’ ‘`o`’, ‘ ‘ - that is amazing.


    Another example of extreme simplicity is access modifiers. There are two scenarios.
    The function/variable/const can be private or public. To make something public
    in Go, we just need to do two things:


    *   It needs to be declared in the highest scope.


    *   It needs to be capitalized.


    That’s it; no need for extra keywords.


    A few other simple things in Go:


    *   Garbage collection


    *   Consts


    *   Interfaces


    *   Packages


    All of these examples have huge complexity behind the senses.


    To summarize this section, Go doesn’t compete in features. “*As for Go 1.0, the
    language is fixed.*”


    # [A Fast Language Suitable for the Cloud](#toc.xhtml#s29a)


    *“Go is fast and fun and productive.”* - Ken Thompson.


    This was one of the core reasons why this language was invented: to provide fast
    language that can run concurrently on the cloud.


    We will elaborate on three things that make Go so fast:


    *   Fast compiling


    *   Bearing a resemblance to C


    *   Concurrency approach


    # [Fast Compiling](#toc.xhtml#s30a)


    Rather than Go’s intention to be fast in runtime, it also has a high intent to
    compile very fast, which is similar to the state of mind of the Agile methodology,
    where the release rate is significantly higher.


    So what makes it compile so fast? And the binary to be so lean? Here are the reasons:


    *   Avoiding cyclic dependency


    *   Compilation design


    *   Unused imports and usages


    *   Go simplicity


    **Avoiding Cyclic Dependency**


    If we ever try to import packages in a cyclic fashion, we will encounter a complication
    error. Go can’t compile if there are some cyclic dependencies. All the dependencies
    can be presented as a DAG (aka for Directed Acyclic Graph). Due to this package
    structure, each package can be compiled if all the packages in the tree are compiled
    before the package node.


    ![](OEBPS/images/2.2.jpg)


    **Figure 2.2:** Package dependencies DAG


    In this example, packages A and B were already compiled, and we can compile C,
    D, and E concurrently.


    **Compilation Design**


    A quote from Golang FAQ answering the question: “Why did you create a new language?”


    *“Finally, working with Go is intended to be fast: it should take at most a few
    seconds to build a large executable on a single computer. Meeting these goals
    required addressing a number of linguistic issues: an expressive but lightweight
    type system; concurrency and garbage collection; rigid dependency specification;
    and so on. These cannot be addressed well by libraries or tools; a new language
    was called for.”*


    As we can see, one of the main reasons for creating Go was to develop a fast language
    that is easy to work with. This state of mind is and has always been in the minds
    of the Go team.


    **Unused imports and usages**


    In Go, we can’t import a package that is not in use, and also, we can’t declare
    a variable that is not in use. Both scenarios will lead us to get a compile error.
    Go will compile only the necessary dependencies, which leads to precise compilation
    and not compiling unused dependencies.


    **Go Simplicity**


    As previously mentioned, Go is a language known for its simplicity. The fact that
    it consists of only around 25 keywords makes the compilation process much more
    straightforward. This simplicity significantly pays off in terms of compilation
    time.


    # [Bearing a Resemblance to C](#toc.xhtml#s31a)


    Some individuals might characterize Go as a modern version of C. While many other
    languages typically use classes and inheritance, Go takes a different approach
    by utilizing structs and interfaces with composition. Go inherits various elements
    from both C and C++, such as data structures, pointers, the ability to pass by
    reference or value, and more.


    C and C++ are renowned for their speed, and Go aims to achieve a similar level
    of performance. However, it also strives to be a modern and user-friendly language,
    making it easier to write code with enhanced productivity.


    # [Concurrency Approach](#toc.xhtml#s32a)


    Concurrency is a top priority in Go. Concurrent programming in Go is made simple
    and efficient through goroutines and channels. Goroutines are lightweight threads
    managed by the Go runtime, allowing multiple tasks to run independently. Channels
    are a way for goroutines to communicate with each other, enabling safe and synchronized
    data exchange, leading to faster and more scalable applications.


    Goroutines and channels are first-class citizens. Concurrency is one of the core
    concepts that Go aims to establish and do well. We will take a short journey into
    Go’s unique concurrency approach.


    Go is a multi-threaded language. However, Go is different from other languages
    because, as a developer, we don’t have direct access to the thread. That is implemented
    with the thought that threads are an asset of the OS. In Go, we should not care
    about threads. Of course, there are things to worry about, like access from different
    Goroutines to the same object (`sync` core library should help to tackle this
    concern through locks, unique objects, and so on).


    Another concern is Goroutine’s leak. Both of these concerns we will tackle in
    the following chapters.


    So, what is Goroutine? The Go team wrapped the traditional thread through goroutines.
    They are highly cost-effective regarding resource usage and initialization.


    Regarding memory footprint, initializing the Goroutine stack takes 2 KB, and the
    default thread stack is 8 KB. This is 4X more lightweight! The direct effect for
    Goroutines to be memory lightweight is that allocating and deallocating them is
    much faster than threads.


    Goroutines are revolutionary, managed entirely by the Go runtime rather than the
    OS. They have accessible communication between themselves, lightweight memory,
    fast initialization, and are not hardware-dependent.


    To explain how Goroutines works, let’s talk about Go Scheduler. It is a component
    within the runtime of Go that has direct access to the kernel and is responsible
    for managing every Goroutine we execute.


    Goroutines are scheduled on the thread themselves, and the Scheduler is responsible
    for allocating them on the thread.


    ![](OEBPS/images/2.3.jpg)


    **Figure 2.3:** Go scheduler'
