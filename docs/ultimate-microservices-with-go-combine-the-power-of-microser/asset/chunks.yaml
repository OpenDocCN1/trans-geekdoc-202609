    **图 1.7：** StackOverflow Insights 统计的最想学习语言排行


    此外，我们还想跟踪的另一个指标是用 Go 编写的包的数量。截至 2023 年 7 月，用 Go 编写的包数量已超过 100 万个（数据来源见本章末尾参考文献链接的优秀网站，该网站收集开源洞察数据，强烈建议查看）。如果我们将
    Go 的年龄和包数量与 Java、Python 或 C# 等其他语言进行比较，Go 紧随 JavaScript 之后排名第二。这令人难以置信。如此疯狂的 Go
    包数量源于强大的 Golang 社区。


    # [结论](#toc.xhtml#s20a)


    在本章中，我们简要游览了微服务领域。我们回顾了它的历史，以及促使微服务如今如此流行的趋势（敏捷、云计算、Docker、DevOps）。我们了解了微服务的替代方案，如
    SOA、单体架构和无服务器架构。市场上还有其他替代方案，但这些是最流行的。我们对比了微服务与其他架构的优缺点。


    在下一章中，我们将讨论 Golang 的易用性。我们将探讨社区情况，并详细说明为什么我们认为以及社区认为 Go 近年来变得如此流行。我们将涵盖 Go 的生态系统，并深入探讨这门语言最初发明的原因，以及从那时至今的历史。最后，我们将讨论使用
    Go 的优缺点。


