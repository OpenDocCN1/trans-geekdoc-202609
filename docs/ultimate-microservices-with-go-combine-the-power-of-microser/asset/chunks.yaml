    Engine 运行容器都是完美的选择。


    最后我们要讨论的趋势是 DevOps 方法论。称其为方法论很奇怪，但它确实如此。如今，它已成为一个职位名称。还有从事类似工作的非常相似的职位，如 SRE、生产工程师等。同样，正如我们之前提到的，微服务的主要缺点是运维开销。DevOps
    方法论旨在解决它，或者至少减少它。


