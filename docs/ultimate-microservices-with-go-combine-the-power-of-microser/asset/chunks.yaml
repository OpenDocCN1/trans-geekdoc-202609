- raw: 'By 2008, many people within Google wanted to join this project. Very fast,
    it gained positive momentum within Google.


    In 2009, Go was publicly announced as an open-source project via GitHub, and developers
    from everywhere could and wanted to contribute to the language. Also, the Gopher
    mascot we mentioned in the previous chapter was presented in 2009. There is a
    link to the project in the references.


    Note that many other repositories in the organization called Go are super relevant
    and part of the Golang ecosystem, which we will discuss later. The decision to
    open-source the language and make it accessible to the world has been pivotal
    to its current success.


    In 2012, the first version of Go 1.0 was published with the most extensive guarantee
    for simplicity and efficiency, which we will talk about later on in this chapter.
    From there, two versions of Go are being released yearly, except in 2012. Version
    1.5 was the most significant. In that version, the compiler toolchain has been
    converted to Go entirely. Another fundamental version is 1.18, where generics
    and fuzzy testing concepts were presented. The current version of Go, which we
    will follow for this book, is 1.20 (July 2023).


    # [Core Principles and Paradigms](#toc.xhtml#s25a)


    While designing the Go programming language, the inventors had a few principles
    they led. Until today all of these core principles are still implemented. We can
    see it in every release note of Go. We recommend looking at the Go release note
    every time a new version is released. These release notes are not long; reading
    and understanding them takes approximately an hour. Investing 2-3 hours each year
    to stay updated on the language’s latest developments is valuable. The release
    notes are clear, straightforward, and easily understandable.


    As observed in the previous chapter, this language is designed to be well-suited
    for deployment on cloud computing platforms, multi-core computers, handling large
    codebases, and more.


    Before delving into the specifics of each principle, it’s essential to mention
    the official Go documentation titled “*Effective Go*.” We recommend reading it;
    it’s lucidly explained and straightforward. Another resource we find valuable
    is the code review comment wiki from Go’s official GitHub organization – we recommend
    perusing and utilizing it.


    There are three core principles for Go:


    *   **Simplicity**: Go is designed to be straightforward and easy to understand,
    with a clean syntax that avoids unnecessary complexity. This makes it easier for
    developers to write, read, and maintain code.


    *   **Efficiency**: Go is known for its speed and performance. It compiles directly
    to machine code, making it as fast as languages like C or C++ but with the ease
    of a higher-level language.


    *   **Maintainability**: Go emphasizes clear, modular code structures and strong
    typing, which helps prevent errors and makes it easier to update and refactor
    code over time.


    *\*\* Disclaimer - These core principles are not officially declared in Go’s official
    documentation. I choose them.*


    # [Go Paradigms](#toc.xhtml#s26a)


    The Go programming language paradigms are officially declared in the documentation,
    including:


    *   Imperative


    *   Concurrent programming


    *   Object-Oriented


    **Imperative**


    Here’s a brief overview of imperative programming: Imperative programming is a
    software paradigm in which the code aims to solve a problem step by step, and
    each line is supposed to lead us to solve the problem. It focuses on **how** to
    solve the problem. Imperative programming contrasts with declarative programming,
    which focuses more on declaring **what** we want to get. Examples of declarative
    languages are HTML, SQL, CSS, and so on. Go is an imperative language. Capabilities
    that show that Go is an imperative programming language are statements, variables,
    loops, and so on.


    **Concurrent programming**


    Concurrent programming involves designing software to execute multiple tasks simultaneously,
    often leading to improved performance and responsiveness in applications that
    handle multiple operations. We’ll discuss in detail later how we can use Go concurrency.
    This paradigm is one of the core reasons for creating this language. Go can be
    multithreaded, multi-processing, and asynchronous, critical factors of a concurrent
    programming language.


    **Object-Oriented**


    “*Yes and no. Although Go has types and methods and allows an object-oriented
    style of programming, there is no type hierarchy. The concept of “interface” in
    Go provides a different approach that we believe is easy to use and, in some ways,
    more general. There are also ways to embed types in other types to provide something
    analogous—but not identical—to subclassing. Moreover, methods in Go are more general
    than in C++ or Java: they can be defined for any sort of data, even built-in types
    such as plain, “unboxed” integers. They are not restricted to structs (classes).*


    *Also, the lack of a type hierarchy makes “objects” in Go feel much more lightweight
    than in languages such as C++ or Java.*”


    This quote is taken from Golang FAQ. The quote explains the object-oriented concept
    in Go quite well. Of course, we will discuss more in detail about composition
    in Go, on structs, interface, and so on.


    **Supported OOP Principles in Go**:


    *   **Encapsulation**: Go supports encapsulation through packages and structs.
    We can define methods on structs to associate behavior with data, similar to methods
    in traditional OOP.


    *   **Composition**: Instead of classical inheritance, Go uses composition to
    build complex types from simpler ones, using a concept called embedding.


    **Not Supported OOP Principles in Go**:


    *   **Inheritance**: Go does not support inheritance in the traditional sense.
    There are no classes, so we cannot define class hierarchies. Go’s approach is
    to use interfaces and composition instead.


    *   **Polymorphism**: While Go does not support polymorphism through inheritance,
    it does support a form of polymorphism through interfaces. A single interface
    can be implemented by multiple types, and a function that takes an interface as
    an argument can accept any type that implements the interface.


    # [Go Properties](#toc.xhtml#s27a)


    Another two properties of language are dynamic or static and strong or weak. For
    Go, these properties are:


    *   Statically typed


    *   Strong typing


    **Statically typed**


    Once the variable type is set in Go, we can’t change it in runtime. We can’t declare
    a variable without declaring its type. Note that we can do something like this:


    ` x := 5`


    In that scenario, we don’t explicitly declare the type, but Go uses “*type inference*”
    to decide the variable type. The inference does not always work until we use the
    := operator.


    In that use case, the inference type is int, of course.


    **Strong typing**


    What differentiates a “*strong*” programming language from a “*weak*” one is that
    we can do certain operations on variable types. Let’s take this example:


    `myString := “name” + 2`


    This line will cause a compile error because we can’t add an integer to a string.


    # [Simplicity and Minimalist Design Approach](#toc.xhtml#s28a)


    Numerous programming languages are currently widely used. A prevailing trend among
    many of these languages is that they have become similar with each new release.
    This similarity is characterized by a growing similarity in their capabilities
    and features.


    Initially, each programming language was created with specific purposes in mind,
    and they had a limited set of capabilities and features. However, many enhancements
    occur with every subsequent version release of these languages. These updates
    include bug fixes, improvements, new features, extensions to core libraries, new
    libraries, new concepts, and so on.


    Most programming languages adopt a “*more is better*” approach, continuously expanding
    their capabilities, features, and libraries, enabling them to handle various tasks.'
