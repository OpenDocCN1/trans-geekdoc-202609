    \ 的 Go 风格与约定指南，它非常实用且易读。该指南已附在参考资料中。我们旨在提供 Go 最核心、最基础的风格和约定。\n\n# Hello World\n\
    \n我们将从最基础的代码示例开始 —— 一个 Golang 的 “Hello World” 程序示例。\n\n```\npackage main\n\nimport\
    \ \"fmt\"\n\nfunc main() {\n    fmt.Println(\"Hello World!\")\n}\n```\n\n我们用来运行程序的命令是：\n\
    \n`go run Chapter-4/Hello-World/main.go`\n\n第一行：\n\n`package main`\n\n在 Go 中，我们使用保留关键字\
    \ `package`，然后指定包名；在本例中，包名为 `main`。入口点包必须是 `main` 才能启动 Go 程序。\n\n声明包之后，我们将使用关键字\
    \ `import` 声明导入，并指定要导入的包。在本例中，我们使用的包名是 `fmt`。\n\n我们可以用同样的方式声明多个包：\n\n```\nimport\
    \ (\n    \"fmt\"\n    \"os\"\n)\n```\n\n声明完包和导入后，我们可以声明类型、常量、方法和函数。在示例中，我们在 `main`\
    \ 包中声明了一个名为 `main` 的函数，这是程序的入口点。\n\n我们通过使用关键字 `func` 来声明函数，然后指定函数名、参数，用 `{` 开启作用域，用\
    \ `}` 关闭作用域。\n\n`main()` 函数作为 Go 程序的入口点起着至关重要的作用，程序从此开始执行。它不是一个普通函数；它是启动程序进程的运行点，对任何\
    \ Go 应用程序都必不可少。\n\n最后一行：\n\n`fmt.Println(\"Hello World!\")`\n\n这行代码的功能是打印字符串 `Hello\
    \ World!`。我们使用了 `Println` 函数，它是 `fmt` 包内的一个函数。\n\n另一个重要且保留的函数（除了 `main`）是 `init()`。它会在程序启动时运行；它是唯一在\
    \ `main()` 之前运行的函数。\n\n# 变量\n\n在 Go 中有三种声明变量的方式。\n\n第一种方式如下：\n\n`var emptyMessage\
    \ string`\n\n这里，我们声明关键字 `var`，然后是变量名 `emptyMessage`。在示例中，该变量的类型为 string。\n\n也可以在声明时给变量赋值：\n\
    \n`var message string = \"This is a message\"`\n\n请注意，如果我们不像第一个示例那样给它一个初始值，它将获得一个默认值。每种基本数据类型都有不同的默认值，指针为\
    \ `nil`，结构体为空结构体值。我们将在本章后面详细说明基本数据类型的默认值。\n\n第二种声明变量的方式是让 Go 编译器自行推断变量类型。\n\n\
    `var inferredMessage = \"This is an inferred message\"`\n\n在该示例中，我们不必声明 `string`。Go\
    \ 编译器从语法中推断出了它。\n\n在 Go 中声明变量的第三种方式是使用 `:=`。\n\n`alsoInferredMessage := \"This\
    \ is also an inferred message\"`\n\n这里，我们不必声明关键字 `var` 或 `string`，只需 `:=` 即可。\n\
    \n在 Go 中，变量在运行时不能改变其类型，因为 Go 是一门静态编程语言，正如我们在 *第 2 章，Go 的可用性* 中所见。\n\n除非我们希望它们是公开的（此时为\
    \ PascalCase），否则 Go 中变量、函数、映射、结构体以及我们声明的所有内容的约定均为 camelCase。我们将在本章讨论访问修饰符。\n\n\
    # 基本数据类型\n\n让我们看看这段代码块：\n\n```\npackage main\n\nimport \"fmt\"\n\nfunc main()\
    \ {\n    message := \"This is a message\"\n    fmt.Println(message)\n    var zero\
    \ int\n    fmt.Println(zero)\n    number := 42\n    fmt.Println(number)\n    var\
    \ pi float64 = 3.14\n    fmt.Println(pi)\n    var booleanVar bool\n    fmt.Println(booleanVar)\n\
    \    trueBooleanVar := true\n    fmt.Println(trueBooleanVar)\n}\n```\n\nGo 中有四种基本数据类型\
    \ —— `string`、`boolean`、`float32`（也包括 `float64`）和 `int`（也包括 `int8`、`int16`、`int32`、`int64`、`uint`、`uint8`、`uint16`、`uint32`、`uint64`）。\n\
    \n*   `string` 用于文本。默认值为空文本 `\"\"`。\n*   `int` 用于整数。默认值为 `0`。\n*   `float32` 用于浮点数。默认值为\
    \ `0`。\n*   `bool` 用于 `true` 或 `false`。默认值为 `false`。\n\n正如我们之前所见，我们可以在不声明类型的情况下声明变量，但类型会被推断。Go\
    \ 会选择最方便的类型。例如，如果我们希望变量是 `int8` 而不是 `int`，我们必须显式声明。否则，Go 编译器会选择 `int`。\n\n# 注释\n\
    \n注释有两种类型：\n\n*   单行\n*   多行\n\n这是一个单行示例：\n\n```\nfunc main() {\n    // This is\
    \ simple comment\n}\n```\n\n这是一个多行示例：\n\n```\n/*\nThis is a multi-line comment\n\
    */\nfmt.Println(\"Hello World!\")\n```\n\n单行注释使用 `//`，多行注释以 `/*` 开始，以 `*/` 结束。\n\
    \n# 运算符\n\n让我们在这里列举 Go 中所有运算符的示例。Go 中的运算符与其他编程语言非常相似。\n\n```\npackage main\n\n\
    func main() {\n    // 算术运算符\n    x := 5 + 5  // 10\n    x = 5 - 5   // 0\n   \
    \ x = 5 * 5   // 25\n    x = 5 / 5   // 1\n    x = 5 % 5   // 0\n    x++     \
    \    // 6\n    x--         // 5\n\n    // 比较运算符\n    y := 5 == 5 // true\n   \
    \ y = 5 != 5  // false\n    y = 5 > 5   // false\n    y = 5 < 5   // false\n \
    \   y = 5 >= 5  // true\n    y = 5 <= 5  // true\n\n    // 逻辑运算符\n    a := true\
    \ && true  // true\n    a = true && false  // false\n    a = true || true   //\
    \ true\n    a = true || false  // true\n    a = !true          // false\n    a\
    \ = !false         // true\n\n    // 位运算符\n    b := 5 & 5  // 5\n    b = 5 | 5\
    \   // 5\n    b = 5 ^ 5   // 0\n    b = 5 << 5  // 160\n    b = 5 >> 5  // 0\n\
    \n    // 赋值运算符\n    c := 5\n    c += 5  // 10\n    c -= 5  // 5\n    c *= 5  //\
    \ 25\n    c /= 5  // 5\n}\n```\n\n# `If` 语句\n\n与其他语言一样，存在的关键字是 `if` 和 `else`。此外，它们的用法完全相同。\n\
    \n# 循环\n\n"
