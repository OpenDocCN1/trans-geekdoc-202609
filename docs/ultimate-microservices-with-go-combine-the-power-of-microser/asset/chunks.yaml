    \ userId: shouldRetry:false timeout:10000000000}\n\nclientV2 := NewShoppingClient(\"\
    https://api.shopping.com/v2\",\n    WithRetry(true),\n    WithUserId(\"my-user-id\"\
    ),\n)\nfmt.Printf(\"%+v\\n\", clientV2) // &{endpoint:https://api.shopping.com/v2\
    \ apiKey: userId:my-user-id shouldRetry:true timeout:0}\n```\n\n在示例中，我们创建了两个具有不同配置的客户端。我们在每个示例中仅应用了所需的配置，这就是该模式的优势。请记住这一重要的设计模式，因为它在本书后续内容中将变得非常实用。\n\
    \n# 泛型\n\n泛型是一项新特性，在 v1.18 版本中引入。Go 从 1.18 版本开始支持泛型。在语言的重大新增特性中，泛型作为一个突出的概念脱颖而出。\n\
    \n编程中的泛型让我们能够通过以更灵活的方式处理不同类型的数据，来编写灵活且可复用的代码。\n"
