- raw: 'One of the most useful use cases of channels is synchronization. We can synchronize
    between goroutines by notifying them about a process’s start and end through channels.
    A pervasive pattern to notify of work that is “`done`” between goroutines is to
    use a boolean channel of size 1.


    `func main() {`


    `done := make(chan bool, 1)`


    `go func() {`


    `println(“Start goroutine”)`


    `time.Sleep(1 * time.Second) // simulate work`


    `println(“End goroutine”)`


    `done <- true`


    `}()`


    `println(“Waiting goroutine”)`


    `<-done`


    `println(“All done”)`


    `}`


    # [Leveraging Channel Strength](#toc.xhtml#s91a)


    The usage of channels, as we saw, is communication between goroutines. There are
    several use cases for leveraging channel strength:


    *   Synchronization between goroutines


    *   Sending and receiving notification


    *   Accepting data from several goroutines using `select`


    *   Futures and promises `->` mimicking the process `async/await`


    *   Acting as queues


    *   Timeouts


    *   Handling a fatal


    *   Ticker


    *   Fan In Fan Out pattern


    These are a few leading examples of use cases. There are many more use cases and
    examples.


    When should we use buffered channels, and when should we use unbuffered channels?


    By default, we should opt for unbuffered channels. Buffered channels become necessary
    when the receiver lags behind the sender, or synchronization is required before
    data retrieval. These are the primary reasons for using buffered channels over
    unbuffered channels. Additionally, specific program requirements may also dictate
    the use of buffered/unbuffered channels.


    # [`Sync` Package](#toc.xhtml#s92a)


    The `sync` package is one of the core packages in Go. This package provides basic
    synchronization primitives. Most of the types in the package provide low-level
    routines. Higher-lever routines should be performed via channels.


    # [WaitGroups](#toc.xhtml#s93a)


    `WaitGroup` is a type in the `sync` package. `WaitGroup` provides a way to wait
    for multiple goroutines to finish their work. It is an immensely potent tool with
    widespread usage.


    `func main() {`


    `wg := sync.WaitGroup{}`


    `wg.Add(5)`


    `for i := 0; i < 5; i++ {`


    `go func(i int) {`


    `defer wg.Done()`


    `time.Sleep(1 * time.Second)`


    `println(i)`


    `}(i)`


    `}`


    `fmt.Println(“Waiting…”)`


    `wg.Wait()`


    `fmt.Println(“Done”)`


    `}`


    The output will look like this (the order of the numbers can change):


    `Waiting…`


    `2`


    `0`


    `1`


    `3`


    `4`


    `Done`


    `WaitGroup` type works as a counter. Behind the senses, the `WaitGroup` type holds
    a counter int type, and the initialized value is 0. All the goroutines blocked
    on the `Wait()` are released if the counter value becomes 0. We used the `Add(delta
    int)` function to increment the counter size. To decrease the counter’s value,
    we used the function `Done()` - which subtracts 1 from the counter. These are
    all the methods on the `WaitGroup` type - `Add, Done, Wait`.


    Note that a negative value in the `Add` function will lead to panic. Also, if
    we pass the `WaitGroup` instance between functions, we should do it by pointer.


    The biggest disadvantage of this technique is that there isn’t a conventional
    way to handle errors. There is a separate package called `errgroup`, which helps
    us to achieve that.


    # [Locks](#toc.xhtml#s94a)


    To access the same data across several goroutines, we need to protect access to
    the data from one goroutine while the other is accessing it. Such a scenario can
    cause faulty data or, even worse - fatal errors.


    `func main() {`


    `counter := 0`


    `wg := sync.WaitGroup{}`


    `wg.Add(10000)`


    `for i := 0; i < 10000; i++ {`


    `go func() {`


    `defer wg.Done()`


    `counter++`


    `}()`


    `}`


    `wg.Wait()`


    `fmt.Println(“counter:”, counter)`


    `}`


    In the preceding example, the output of the counter should be 10,000. Unfortunately,
    the counter is somewhere under it. The reason is that multiple goroutines try
    to access the counter variable; some fail because other goroutines lock the counter
    value and write to it. If we replace the counter with a map and try to write to
    the same key, we will get an even worse scenario - a `fatal error: concurrent
    map writes`. To avoid this situation, we need to use `mutex`. `Mutex` is a `sync`
    package type that helps us lock and unlock.


    `func main() {`


    `counter := 0`


    `wg := sync.WaitGroup{}`


    `mu := sync.Mutex{}`


    `wg.Add(10000)`


    `for i := 0; i < 10000; i++ {`


    `go func() {`


    `defer wg.Done()`


    `mu.Lock()`


    `counter++`


    `mu.Unlock()`


    `}()`


    `}`


    `wg.Wait()`


    `fmt.Println(“counter:”, counter)`


    `}`


    Now the output will be - `counter: 10000`, as expected. The `mutex` type lets
    us lock. For any other goroutine wanting to `Lock()` the mutex (`mu`), we must
    wait until another goroutine `Unlock()` the mutex (`mu`).


    # [Singleton in Golang - `Once.Do`](#toc.xhtml#s95a)


    Summing up the concept of a singleton - it’s among the most recognized design
    patterns for guaranteeing the creation of a single instance of a specific type.
    In many other programming languages, various patterns exist to achieve this while
    maintaining thread safety. In Go, it is super easy to implement this pattern while
    using the `Once` type from the `sync` package.


    `type cache struct{}`


    `var cacheSingleton *cache`


    `var once sync.Once`


    `func main() {`


    `GetCache()`


    `GetCache()`


    `GetCache()`


    `}`


    `func GetCache() *cache {`


    `once.Do(func() {`


    `println(“Creating singleton object”)`


    `cacheSingleton = &cache{}`


    `})`


    `return cacheSingleton`


    `}`


    The output of this program is - `Creating singleton object`. And that’s it (not
    three times).


    The `Do` function receives a function as a parameter. The `Do` function ensures
    that the function inside is executed exactly once, which we want to achieve when
    writing a singleton. `Do` is also the only function that exists on the `Once`
    type.


    # [Low-Level Routines](#toc.xhtml#s96a)


    There are other low-level routines we can use in the `sync` package that we won’t
    elaborate on in this chapter:


    1.  `sync.Map`: The same purpose as the normal map in Go but is safe for concurrent
    access across several goroutines.


    2.  `sync/atomic`: Managing shared counter state across several goroutines.


    3.  `sync.Pool`: Self-managed temporary retrieval object pool — this is to facilitate
    the Garbage Collector work.


    # [Pub/Sub](#toc.xhtml#s97a)


    Publish-subscribe is one of the most known patterns. Pub/Sub pattern is a messaging
    pattern that helps us to communicate between systems/services/objects. It broadcasts
    data/messages from what is called a publisher through a topic. Each subscriber
    is allocated to a specific topic, and every subscriber receives all the messages
    associated with the topic to which they are assigned.


    ![](OEBPS/images/Figure-5.4.jpg)


    **Figure 5.4:** Publish-Subscribe pattern


    `type PubSub struct {`


    `subscribers map[string][]chan interface{}`


    `}`


    `func NewPubSub() *PubSub {`


    `return &PubSub{`


    `subscribers: make(map[string][]chan interface{}),`


    `}`


    `}`


    `func (ps *PubSub) Publish(topic string, item interface{}) {`


    `for _, ch := range ps.subscribers[topic] {`


    `ch <- item`


    `}`


    `}`


    `func (ps *PubSub) Subscribe(topic string) <-chan interface{} {`


    `ch := make(chan interface{})`


    `ps.subscribers[topic] = append(ps.subscribers[topic], ch)`


    `return ch`


    `}`


    `func main() {`


    `ps := NewPubSub()`


    `ch := ps.Subscribe(“t1”)`


    `go ps.Publish(“t1”, “hello”)`


    `item := <-ch`


    `println(item.(string))`


    `}`


    This is a simple implementation of the publish-subscribe pattern in Go. Note that
    this example is imperfect - we don’t close the channels and do not handle concurrency
    properly. Utilizing existing libraries is the suggested approach when implementing
    this pattern.'
