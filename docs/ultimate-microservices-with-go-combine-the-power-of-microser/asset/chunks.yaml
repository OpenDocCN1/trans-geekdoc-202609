    *   从入职到生产

    *   Go 的生态系统——社区及更远


    # [Go 的发明](#toc.xhtml#s24a)


    那么这门语言是如何开始的？一切始于 Google。2007 年，Google 的三位工程师决定创建一门新语言。该语言由 Ken Thompson、Rob Pike
    和 Robert Griesemer 设计，他们各自带来了独特且相关的背景。他们参与了 UTF-8、Unix、C 编程语言等重大技术发明。该语言的全称是 Golang，由“go”+“lang”组合而成，其中“lang”是
    language 的缩写。不过，他们更倾向于称其为 Go 而非 Golang，以强调该语言旨在简单易记。“Go”是一个常见的英语单词，暗示着移动、进步和效率，这与该语言为软件开发提供简单高效方法的目的相一致。此外，“Go”也是
    Google 的前两个字母。


    在获得 Google 批准后，他们开始开发这门语言。他们的核心内部协议之一是：仅包含他们所有人都认同的编程原则。尽管这门语言发明于 2007 年，但它主要受
    C 编程语言（创建于 1972 年）影响，而非 C++、Java、C# 等较新语言。Go 和 C 编程语言有许多相似之处。确实，一些人将 Go 称为 C 语言的现代版本。


    他们开始使用 Go、C++ 和汇编语言编写这门编程语言。

