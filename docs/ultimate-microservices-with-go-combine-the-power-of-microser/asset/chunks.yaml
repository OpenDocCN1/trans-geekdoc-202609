    \ nodes --output json\n```\n\n![](img/Figure-8.3.jpg)\n\n**Figure 8.3:** kubectl\
    \ get pods 输出示例响应\n\n第一个示例展示如何以默认命名空间获取集群中所有的 Pod。第二个示例以 JSON 输出格式获取集群中所有的 Node。\n\
    \n创建新资源：\n\n```\nkubectl create -f pod.yaml\n```\n\n修改/创建资源：\n\n```\nkubectl apply\
    \ -f pod.yaml\n```\n\n删除名为 frontend 的 Pod：\n\n```\nkubectl delete pods/frontend\n\
    ```\n\n要查看 `kubectl` 所有的命令，可以运行：\n\n```\nkubectl help\nkubectl help <command-name>\n\
    ```\n\n## Kubectx\n\n`Kubectx` 是一个极简的 CLI 工具，帮助我们在集群间切换。当我们使用 `kubectl` 时，它会访问\
    \ `~/.kube` 目录中声明的集群 API。通过使用 `kubectx`，它只会将上下文切换到期望的集群。例如：\n\n```\nkubectx <cluster-name>\n\
    ```\n\n# Basic Resources\n\n以下三个资源在 Kubernetes 中被广泛使用。了解它们是什么对于理解 Kubernetes 至关重要。我们将在本章中反复提及它们。\n\
