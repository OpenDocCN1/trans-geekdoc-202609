- raw: 'In the next sections, we will cover different topics that weren’t covered
    in the earlier section, such as bytes, error, channels, goroutines, generics,
    structs, interfaces, libraries, pointers, the empty interface, type conversion,
    and more. We can always check the Go language specification.


    # [Packages](#toc.xhtml#s58a)


    A package in Go is a way to divide a program into smaller parts. The Go compiler
    comes with several standard packages that are widely common and popular. Those
    packages include `fmt, log, net, strconv, strings, sync, testing, os, math, errors`,
    and so on.


    We can explore all publicly available Go packages for use at [https://pkg.go.dev/](https://pkg.go.dev/).


    As mentioned in the Hello World introduction, we import a package using the `import`
    keyword at the beginning of our file. Additionally, we have the option to rename
    a package like this:


    `import (`


    `f “fmt”`


    `“math”`


    `)`


    We renamed `fmt` to `f`. The naming convention in Go for packages is short and
    mainly single words like nouns. The only available character except for a-z and
    numbers we can use in the package name is `_`.


    The naming in Go is critical for accessing or viewing things outside a package.
    It is determined by whether the first character of a variable is uppercase (the
    same goes for function, consts, struct, and more).


    `const myName = “jack” // not public`


    `const MyName = “jack” // public`


    To work on a project, we need to initialize a new module. To do so, we need to
    run this line, for instance:


    `go mod init githubple.com/nir/mymodule`


    It will create a new file called `go.mod`, which includes the module name, the
    Go version, the entire package, and the versions we use in that module.


    After we declare the modules we want to use, the `go.mod` file should look like
    this:


    `module github.com/OrangeAVA/Microservices-with-Go`


    `go 1.21.0`


    `require (`


    `github.com/gin-gonic/gin v1.9.0`


    `)`


    To download the package, we should run:


    `go mod download`


    It will create/update a file called `go.sum`, which maintains the checksums of
    the dependencies used in the project. The `go.sum` file ensures that the project
    uses the exact same versions of dependencies in subsequent builds, enhancing the
    reproducibility and security of the build process. We don’t need to change or
    edit this file, as it is auto-generated by the Go toolchain.


    Occasionally, we might encounter `// indirect` following a package requirement.
    This occurs when we don’t directly utilize the module in our project, but one
    of our dependencies relies on it.


    A convenient command that helps us to include only the imports that we need is:


    `go mod tidy`


    This command removes all the dependencies that we don’t use.


    # [Project Structure](#toc.xhtml#s59a)


    There are many practices regarding the project structure and many use cases. We
    will elaborate on the important ones. The more detailed file structure is in the
    references. Here is a tree of the Go project’s standard and the crucial files
    and directories.


    ![](OEBPS/images/Figure-3.1.jpg)


    **Figure 3.1:** Minimal file structure in Go


    As we saw before, we must have `go.mod` and `go.sum` files to start a Go project.
    Rather than those files, three crucial directories are - `cmd`, `internal`, and
    `pkg`.


    `“cmd”` directory - includes all the entry points of my code, and the directory
    name of each program should match the name of the binary.


    `“pkg”` directory - needs to include all the code that is fine to share with other
    services. This should consist of a common code that can be useful for other services.
    Note that there is usually a single pkg directory for all the services when we
    work with a mono repo, and there isn’t a pkg directory within each service.


    `“internal”` directory - private packages used internally for the service.


    # [Structs](#toc.xhtml#s60a)


    Go’s structs are typed collections of fields. The struct in Go is used to create
    records.


    Here is how we declare a struct in Go:


    `type user struct {`


    `name string`


    `email string`


    `}`


    While declaring a struct, we can only declare the struct fields. Another way to
    create structs is through embedded structs:


    `type admin struct {`


    `user`


    `level string`


    `}`


    Here, we embedded the user struct within the admin struct. To create a new instance
    of a struct, we need to declare it and include its parameters; if some parameter
    is missed, it will give it the parameter’s default value.


    `u1 := user{`


    `name: “john”,`


    `email: “john@gmail.com”,`


    `}`


    `fmt.Printf(“%+v\n”, u1) // {name:john email:john@gmail.com}`


    There isn’t a built-in constructor to create a struct in Go. The convention in
    Go for creating a struct is through a function, and the function should have a
    prefix of `new` or `New` if it is public, for instance:


    `func newUser(name string) user {`


    `return user{`


    `name: name,`


    `email: fmt.Sprintf(“%s@gmail.com”, name),`


    `}`


    `}`


    `u2 := newUser(“jack”)`


    `fmt.Printf(“%+v\n”, u2) // {name:jack email:jack@gmail.com}`


    We declared a function called `newUser`, which accepts only `name` and, from there,
    generates the email. We could use any functionality that we believe is the right
    one. Let’s see an example of declaring an embedded struct:


    `a := admin{`


    `user: user{`


    `name: “john”,`


    `email: “john@gmail.com”,`


    `},`


    `level: “super”,`


    `}`


    `fmt.Printf(“%+v\n”, a) // {user:{name:john email:john@gmail.com} level:super}`


    To access/modify a value of a struct instance, we can do it like this:


    `u3 := newUser(“amanda”)`


    `fmt.Printf(“%+v\n”, u3) // {name:amanda email:amanda@gmail.com}`


    `fmt.Println(u3.name)    // amanda - we access the field name of the struct user`


    `u3.name = “ruth”  // we change the value of the field name of the struct user`


    `fmt.Printf(“%+v\n”, u3) // {name:ruth email:amanda@gmail.com}`


    Go supports methods defined on struct types. It means we declare a function on
    the same scope as the struct and assign it to it. Let’s see an example:


    `func (u user) Print() {`


    `fmt.Printf(“Name: %s, Email: %s\n”, u.name, u.email)`


    `}`


    We declared the `Print` method in the same scope as the `user` struct. Note that
    this example is a struct method as a value receiver. We can also define a method
    to a struct as a pointer receiver so the method can mutate the struct fields.
    For instance:


    `func (u *user) ChangeEmail(email string) {`


    `u.email = email`


    `}`


    # [Composition](#toc.xhtml#s61a)


    Composition lets us create complex things by combining simpler parts, making our
    code more modular and flexible. The inheritance feature doesn’t exist in Go. Let’s
    observe an example of composition:


    `type Animal struct {`


    `Sound string`


    `}`


    `func (a *Animal) Speak() {`


    `println(a.Sound)`


    `}`


    `type Cat struct {`


    `Animal // Embedding`


    `}`


    `type Dog struct {`


    `Animal // Embedding`


    `}`


    `func main() {`


    `cat := Cat{Animal{“Meow”}}`


    `cat.Speak() // Meow`


    `dog := Dog{Animal{“Woof”}}`


    `dog.Speak() // Woof`


    `}`


    We implemented a struct called `Animal` with a `Speak` method. We also created
    two different structs called `Cat` and `Dog` that both embedded the `Animal` struct.
    By doing so, those structs inherit all the properties and methods of the `Animal`
    struct.


    # [Interfaces](#toc.xhtml#s62a)


    Interface in Go slightly differs from other languages. In Go, interfaces contain
    only method signatures and not fields. We can’t create an interface instance in
    Go, but we can declare a variable assigned to some type that fulfills the interface
    method signatures. Let’s take a look at the following example:


    `type Person struct {`


    `Name string`


    `}`


    `func (m Person) Print() {`


    `fmt.Println(m.Name)`


    `}`


    `type DogPerson struct {`


    `Name string`


    `}`


    `type PrintInterface interface {`


    `Print()`


    `}`


    `var PrintableObject PrintInterface = Person{}`


    `var PrintableObject2 PrintInterface = DogPerson{} // This will throw an error
    in compile time`'
