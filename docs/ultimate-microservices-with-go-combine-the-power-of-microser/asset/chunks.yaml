  trans: "\n\n# 构建 RESTful API\n\n## 简介\n\nREST 代表表述性状态转移，是一种架构风格。REST 定义了一组 API 应满足的约束，以符合\
    \ REST 风格的要求。RESTful 是形容词，指遵循 REST 约束的 API。在本章的第一节中，我们将详细阐述这些约束。\n\n在本章中，我们将深入探讨\
    \ REST 的约束，并通过一个 Go 语言服务进行演示。在上一章中，我们讨论了微服务架构中服务间的通信方式。通信的普遍模式是通过 API 调用，而 REST\
    \ 是 API 最广泛采用的架构风格。因此，我们的主要关注点将放在 REST 架构模式上。微服务架构天然贯穿了整个系统的 REST 约束，反之亦然。微服务与\
    \ REST 之间存在强关联。更广泛地说，微服务 <> Go <> REST <> Kubernetes 之间存在更强大的关联。\n\n![](img/Figure-7.1.jpg)\n\
    \n**图 7.1：** Google Trends 中的“REST”搜索词\n\n正如我们从 Google Trends 所见，REST 方法多年来变得非常流行。随着这种流行度，出现了许多\
    \ RESTful API，其中一些因其值得称道的 REST 实现而变得非常流行。在初学 REST 或刚编写新的 RESTful API 时，参考知名 API\
    \ 既愉快又有启发。这里列举两个例子：\n\n*   Stripe API\n*   Twilio API\n\n有三个主题我们不会在本章涉及，将在后续章节中涵盖，它们与\
    \ REST 相关：\n\n*   故障设计\n*   监控\n*   安全 - 认证、授权\n\n务必记住，REST 是一种架构风格，并没有单一的方式或“正确”的方式来实现\
    \ REST。有些做法适合 REST，有些则明显违背 REST。在任何设计 REST API 的会议室里，都会有被称为 RESTafarians（REST\
    \ 原教旨主义者）的严格派，也有人会偏离 REST 的硬性约束。我们有时可以偏离 REST 的约束，以简化/改进 API 或处理边缘情况。REST 风格不是布尔值、1\
    \ 或 0。它更抽象，API 可以是“*更 REST*”或“*不太 REST*”。\n\n## 结构\n\n在本章中，我们将讨论以下主题：\n\n*   RESTful\
    \ 方法简述\n    *   资源与表述\n    *   约束\n*   设计 API\n    *   能力\n    *   文档 - Swagger\
    \ 和 OpenAPI\n    *   API 文件夹结构\n    *   资源方法\n*   打造服务端\n    *   Gin Gonic 设置\n\
    \    *   责任链\n    *   CORS\n*   API 能力\n    *   分页\n    *   限流\n    *   恐慌恢复\n\
    \    *   优雅关闭\n    *   过滤与排序\n    *   缓存\n    *   约定\n    *   版本控制与弃用\n    * \
    \  常见陷阱\n\n## RESTful 方法简述\n\n正如我们在简介中提到的，REST 是一组约束，而 RESTful API 是满足 REST 约束的\
    \ API。让我们强调一下：REST 是一种风格，而不是像 HTTP 这样的协议。REST 和 HTTP 之间存在常见的混淆。Roy Fielding 允许使用任何首选协议来实现\
    \ REST。虽然此选项可用，但大多数 RESTful API 使用 HTTP 协议，这是 Roy 推荐的首选协议，但并非强制要求。其他类型的协议可以是 FTP、SMTP、IMAP\
    \ 等。流行的表述类型（REST 中的 RE）是 JSON（代表 JavaScript 对象表示法），同样，这也不是约束。RESTful API 可以使用其他表述，如\
    \ XML、HTML、CSV、纯文本、PDF 等。\n\n根据我们的选择、需求和业务约束，有多种方式来构建 RESTful API。最终，每个 RESTful\
    \ API 都满足 REST 约束，但方式各异。\n\n![](img/Figure-7.2.jpg)\n\n**图 7.2：** REST 约束\n\n\
    REST 有六个约束。最终，我们可以随心所欲地编写代码。REST 风格旨在指导我们构建更合理的系统。实施这些约束旨在提高客户端性能、服务端的稳定性和可扩展性。这些约束相结合，旨在解决和修复大多数系统已遇到并深受其害的常见熟悉问题。\n\
    \n### 资源与表述\n\n我们已经多次提到资源和表述。这两个术语是 REST 风格的核心。\n\n*   **资源：** 资源是一条信息，代表作为单一单元的功能性数据。例如，资源可以是一个对象（账户、用户、椅子）、对象集合、文档、图片等。我们可以通过所谓的资源方法来改变资源的状态，这些方法需要是统一的（作为统一接口约束的一部分）。例如，HTTP\
    \ 方法如 `GET`、`POST`、`PUT`、`DELETE` 等充当资源方法。\n*   **表述：** 资源表述指的是资源的状态，包括数据、元数据和超链接。\n\
    \n### 约束\n\n以下是六个约束。\n\n#### 客户端-服务端\n\n该约束也是微服务架构的核心原则。它鼓励我们保持客户端和服务端松耦合。客户端和服务端之间不得共享任何依赖。组件需要独立、分别开发；客户端仅知道服务端暴露的\
    \ URI。\n\n#### 统一接口\n\n这是最复杂的约束，由其他四个子约束组成。URI 代表统一资源标识符，是一串字符，Web 技术可识别并关联特定资源。\n\
    \n![](img/Figure-7.3.jpg)\n\n**图 7.3：** URI 组成\n\n与前面提到的协议和表述不同，URI 不是可选的。REST\
    \ 强制我们使用 URI 来确定资源的唯一性。在服务端和客户端之间存在一个接口。该约束旨在通过四个子约束创建统一性，同时建立该接口：\n\n*   **资源标识：**\
    \ 它涉及确保每个 URI 对特定资源都是唯一的。这种唯一性至关重要，可防止从不同接口操作同一资源。\n*   **通过表述操作资源：** 服务端需要暴露的表述是期望的修改。此表述需要尽可能明确。\n\
    \n"
