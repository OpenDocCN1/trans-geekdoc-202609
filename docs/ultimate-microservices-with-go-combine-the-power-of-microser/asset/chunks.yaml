- raw: 'Database per service is a typical pattern in microservice architecture. Every
    system with multiple services will likely need a persistent data storage system.
    Establishing robust data separation is paramount in fostering loose coupling among
    services within a microservices architecture. Keep in mind that different services
    have different data storage requirements. Rational databases will be a great option;
    sometimes, NoSQL and others are the best. But that isn’t the focus here.


    Data separation can occur internally in the database itself — the so-called shared
    database pattern. However, in this pattern, we’ll discuss the database per service.
    Let’s illustrate the difference between a shared database (rational database,
    for example) and a database per service in a microservices architecture.


    ![](OEBPS/images/Figure-6.6.jpg)


    **Figure 6.6:** Shared database in the rational database vs. database per service


    A shared database among various services can be through a single database and
    table or schema per service. Developers are often tempted to perform SQL joins
    or read another service data directory. To avoid this temptation, we can use the
    Database per Service pattern. The separation of databases per service gives us
    the highest level of separation, which manifests itself in several advantages:


    *   The services are loosely coupled - as we want!


    *   Each service can use a different database. As we mentioned, each database
    has other needs.


    *   Scaling limitation - many databases have limitations in terms of speed and
    size. When we have a separation of databases per service, it is easier to replicate
    and scale. We can manage each database independently, free from constraints imposed
    by other services.


    However, separating databases per service has a few disadvantages:


    *   The complexity significantly increases when creating and managing more databases.


    *   Aggregations and joins between services become much more complicated and challenging.
    SQL joins are between different databases. Therefore, we need an external service
    or tool to facilitate it.


    *   Implementing transactions across services becomes tricky and complex. Distributed
    transactions are challenging; however, using the Saga pattern mentioned earlier
    might help us resolve it.


    Imagine the pattern of database per service as another barrier between the services.
    Many companies usually use a shared database at the start because it is easy and
    fast. After a while, they realize they must separate the database per services/s.
    Still, the time-spending cost of separating the databases after a long time is
    very high compared to the scenario in which they would first separate a database
    per service.


    # [Backends for Frontends](#toc.xhtml#s121a)


    BFF, or Backends for Frontends, is a pattern that helps us improve client communication
    with our backend system. When building a system, we usually have different types
    of clients: web-based applications using HTML/JS, web frameworks like React, mobile
    clients for iOS or Android, desktop applications, direct API requests, or third-party
    applications. Each client will need data from a different variety of backend services
    in a different structure.


    Our problem is how all those clients can communicate with all the backend servers
    without overcalling the complexity and making it cumbersome. The solution is to
    use the API gateway pattern discussed earlier in this chapter but for each client.


    ![](OEBPS/images/Figure-6.7.jpg)


    **Figure 6.7:** Backends for frontends through API gateways


    This pattern’s main disadvantage is the same disadvantage of the API gateway we
    described: the need to maintain another service, another moving part, which adds
    complexity. Also, adding another service is another network hop that causes slower
    latency.


    On the other hand, using backends for frontends has the same advantages as API
    gateway. Backends for Frontends pattern is beneficial when creating optimal APIs
    for each client. The optimization of each client can vary from one client to another;
    for example, web-based applications probably need much more data than mobile applications.


    # [External Configuration](#toc.xhtml#s122a)


    While developing services in microservices architecture, we deploy the code we
    write into several environments, not one. Every environment is isolated from one
    another. The popular environment types are production, staging (sometimes called
    pre-production), QA, and development. Each service will need a different configuration
    in each environment. For example, each environment has a separate DB, connection
    configurations to third-party services are diverse, credentials, and many other
    differences. We don’t want to create a duplication of each service; as developers,
    we hate duplications (DRY). The problem is deploying all those services to different
    environments without creating code duplications.


    The solution is this pattern — make the configuration external to the service.
    When the service starts, it will pull a configuration from an external service/source
    via environment variables most of the time. Configuration injection can also be
    performed in other ways than environment variables. It is essential to be cautious.
    Confusion between environment configurations can be very painful, like switching
    the DB configuration of dev and production.


    In *[Chapter 8, Introduction to Kubernetes](#c08.xhtml)*, we will see how Kubernetes
    seamlessly helps in injecting configuration through the environment variables.
    A widespread tool, Helm, is a force multiplier above Kubernetes and provides a
    templating engine for even more seamless configuration.


    # [Service Mesh](#toc.xhtml#s123a)


    The best way to describe service mesh is as a dedicated infrastructure layer that
    handles communication between microservices. It usually provides tools in the
    network layer like elements described in this chapter - load balancers, service
    discovery, security, and monitoring (logging, metrics, and so on). Understanding
    that this technology exists and can help us a lot is essential. The main drawback
    of using service mesh is that it can be challenging to configure. When we reach
    some capability that our framework doesn’t exist, we often don’t have the flexibility
    to suit our needs.


    Three popular market technologies that provide service mesh are Istio (for Kubernetes),
    Linkerd, and Consul. It is recommended to thoroughly read about it; this section
    was just a summary.


    # [Event-Driven Architecture](#toc.xhtml#s124a)


    Event-driven architecture is a vast topic. We’ll discuss the collision of implementing
    event-driven architecture with microservices architecture. Event-driven architecture
    is a fascinating topic, and unfortunately, we won’t be able to discuss it properly
    in this book. Instead, a highly recommended book for this topic is “*Designing
    Event-Driven Systems*”.


    Before jumping into the interface of microservices with event-driven, let’s understand
    the basics of event-driven architecture.


    # [Event Versus Message](#toc.xhtml#s125a)


    A **message** is specific, and we send a message from a particular service to
    another. Both services, the sender and the receiver, are aware of the schema.
    The sender requests data, and he knows how to request it from the receiver (by
    the agreed schema). On the other hand, the receiver is expecting a request by
    the agreed schema by responding to the data as promised. The schema is unique
    for the sender and receiver, and the location is pre-determined.


    An **event** is something more general. An event will contain data, not requests
    or instructions. An event has no specific destination. It is emitted and broadcast
    to those who will listen and consume this event. The event also contains an ID
    to be unique. Events are immutable, and they can’t be changed.'
