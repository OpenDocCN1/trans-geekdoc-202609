- raw: "When building RESTful APIs, it is crucial to implement a graceful shutdown\
    \ at the server level. We want to let all on-flight requests finish their work\
    \ whenever something bad or a rollout occurs. Here is an example of a graceful\
    \ shutdown from the `main.go`:\n\n`func main() {`\n\n`port := 8080`\n\n`engine\
    \ := internal.BuildEngine()`\n\n`srv := &http.Server{`\n\n`Addr: fmt.Sprintf(“:%d”,\
    \ port),`\n\n`Handler: engine,`\n\n`}`\n\n`log.Printf(“Starting server on port\
    \ %d”, port)`\n\n`startHTTPServer(srv)`\n\n`}`\n\n`func startHTTPServer(srv *http.Server)\
    \ {`\n\n`// Create context that listens for the interrupt signal from the OS.`\n\
    \n`sigCtx, stopSig := signal.NotifyContext(context.Background(), syscall.SIGINT,\
    \ syscall.SIGTERM)`\n\n`defer stopSig()`\n\n`go func() {`\n\n`if err := srv.ListenAndServe();\
    \ err != nil && err != http.ErrServerClosed {`\n\n`log.Print(“error while running\
    \ API gin server”, “error”, err.Error())`\n\n`os.Exit(1)`\n\n`}`\n\n`}()`\n\n\
    `// Listen for the interrupt signal.`\n\n`<-sigCtx.Done()`\n\n`// Restore default\
    \ behavior on the interrupt signal and notify a user of a shutdown.`\n\n`stopSig()`\n\
    \n`// Requests are currently on-flight; wait 10 seconds for them to finish.`\n\
    \n`ctx, cancel := context.WithTimeout(context.Background(), 10*time.Second)`\n\
    \n`defer cancel()`\n\n`if err := srv.Shutdown(ctx); err != nil {`\n\n`log.Print(“server\
    \ forced to shutdown: “, “error”, err.Error())`\n\n`}`\n\n`}`\n\nThe function\
    \ that implements the graceful shutdown is `startHTTPServer.` First, we take the\
    \ background context and listen for interrupted signals from the system. Then,\
    \ we run the `ListenAndServe()` function in a goroutine. When some signal is received,\
    \ we give the system 10 seconds to finish its work using `context.WithTimeout`.\
    \ Note that this time is different between each server and depends on the server’s\
    \ internal functionality and the API purpose.\n\n# [Filter and Sort](#toc.xhtml#s155a)\n\
    \nThese two functionalities, filter and sort, are the most popular functionalities\
    \ we can implement in an endpoint. This is in addition to the pagination functionality\
    \ that we saw before.\n\n# [Filter](#toc.xhtml#s156a)\n\nThere are three significant\
    \ ways to implement filtering:\n\n*   **Path Parameters:** We’ve already mentioned\
    \ path parameters in this chapter. Filtering by path parameter is usually used\
    \ in specific use cases. \n\n    `GET /api/accounts/{category} -> GET /api/accounts/Enterprise`\n\
    \n    In this example, we filtered all accounts from the Enterprise category.\
    \ Of course, we’ll need to declare it in the OpenAPI and implement it in the server.\n\
    \n*   **Query Parameters:** These are the most popular way to perform filtering.\
    \ The URL is supposed to be pretty straightforward, mainly using `‘?’` and `‘&’`\
    \ keywords to separate between filtering parameters. Query parameters filtering\
    \ has URL constraints, and we’ll want to keep it as simple as possible. If it\
    \ becomes more complicated, we should consider the third option for filtering.\
    \ \n\n    `GET /api/accounts?category=Enterprise&size_gt=500`\n\n    In this example,\
    \ we want to get all enterprise accounts whose size is greater than 500. On the\
    \ same coin, we can use different filters like - `size_lt` (size it lower than),\
    \ `size=` (size it is equal to), `size_not` (size isn’t equal to), and `size_gte`\
    \ (size is greater than or equal to).\n\n*   **Request Body:** Occasionally, we\
    \ will need more complex filtering. Here, using body requests comes in handy.\
    \ \n\n    `POST /api/accounts`\n\n    `Content-Type: application/json`\n\n   \
    \ `{`\n\n    `“or”: {`\n\n    `“category”: “Enterprise”,`\n\n    `“size_gt”: 500,`\n\
    \n    `}`\n\n    `}`\n\n    In the preceding example, we used HTTP POST requests\
    \ with JSON and asked for all the accounts that are enterprise or whose size is\
    \ greater than 500.\n\n# [Sort](#toc.xhtml#s157a)\n\nSorting is the ability of\
    \ the API to arrange the responded data in a specific order, like the user requirements.\
    \ There are three significant ways to sort data:\n\n*   **Ascending:** This technique\
    \ is used to sort the data from the lowest value of a specific field to the highest\
    \ value of the same field. \n\n    `GET /api/accounts?sort=size&order=asc`\n\n\
    \    In the example, we sort all the accounts from a minor account to the biggest.\
    \ The convention is to use the sort and order as query parameters.\n\n*   **Descending**:\
    \ The same as ascending, but opposite. It returns the data from the highest value\
    \ to the lowest value. \n\n    `GET /api/accounts?sort=size&order=desc`\n\n  \
    \  The convention is to use asc for ascending and desc for descending.\n\n*  \
    \ **Multiple Sorting:** When a single field is insufficient, we can use more complex\
    \ sorting using multiple fields. \n\n    `GET /api/account?sort=effective_score,-size`\n\
    \n    In the preceding example, the field `effective_score` is a rank number between\
    \ 1 and 5 that determines how much to account for if effective. We want to retrieve\
    \ the accounts from the most effective account (ascending order) with the smallest\
    \ size (descending order due to `-` sign).\n\n# [Caching](#toc.xhtml#s158a)\n\n\
    Caching is the ability to store data that is frequently used. The location of\
    \ the cache can change depending on the situation. The place can be at the load\
    \ balancer or server level, and distributed cache is usually an option using Redis.\
    \ Let’s have a quick reminder of HTTP methods caching:\n\n*   `GET`: Are cached\
    \ by default unless a particular case occurs.\n\n*   `POST`: Aren’t cached by\
    \ default unless the request explicitly declares it wants cached data.\n\n*  \
    \ `PUT and DELETE` aren’t cachable at all.\n\nTo implement caching, we need to\
    \ leverage the power of middleware and implement a middleware. The caching functionality\
    \ relies upon TTL (Time-To-Live) and request header definitions:\n\n*   **Expires**:\
    \ This header specifies the absolute time when the cache expires. \n\n    `Expires:\
    \ Sun, 21 June 2023 16:27:59 GMT`\n\n*   **Cache-Control**: This header declares\
    \ directives, whether a response is cachable or not. Examples of directives are\
    \ - `max-age=3600, must-revalidate, no-cache`, and so on. They can be found at\
    \ [https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Cache-Control](https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Cache-Control).\n\
    \n*   **Last-Modified**: It determines when the last response was generated.\n\
    \nLastly, it is essential to remember that the purpose of a cache is to improve\
    \ latency and reduce server work while responding to the desired data. If the\
    \ cache doesn’t accomplish its original goal, we need to remove or fix the caching\
    \ layer.\n\n# [Conventions](#toc.xhtml#s159a)\n\nHere, we will detail all the\
    \ conventions and best practices related to RESTful API.\n\n*   A resource can\
    \ be a collection or singleton. For example: \n\n    `GET /api/accounts`: Collection\
    \ resource\n\n    `GET /api/accounts/{id}`: Singleton resource; when we wish to\
    \ retrieve a singleton resource, we will use `accounts` in “*plural*”.\n\n*  \
    \ Collection/Singleton resource can contain sub-collection, for example: \n\n\
    \    `GET /api/accounts/{id}/users - the users is the sub-collection resource.`\n\
    \n*   **Use a noun, not a verb**: URI aims to describe a resource as an entity\
    \ (noun) and not as an action (verb). Also, don’t include the operation name in\
    \ the URI. \n\n    `GET /api/deleteAccounts/{id} - bad`\n\n    `DELETE /api/accounts/{id}\
    \ - good`\n\n*   **Chars convention**:  \n\n    *   Use “-” to improve the readability\
    \ of URI: \n\n        `GET /api/user-management`\n\n    *   Don’t use trailing\
    \ flash: \n\n        `GET /api/account/ - bad`\n\n        `GET /api/account -\
    \ good`\n\n    *   Always use forward slack ‘/’ and not backward slash ‘\\\\’\n\
    \n    *   Avoid using file extension: \n\n        `GET /api/accounts/billing.json\
    \ - bad`\n\n        `GET /api/accounts/billing - good`\n\nIn a few scenarios,\
    \ the endpoint will become highly complicated, and we need to simplify it as much\
    \ as possible. We should consider splitting it into two or more endpoints if it\
    \ becomes overcomplicated.\n\n# [Versioning and Deprecation](#toc.xhtml#s160a)"
