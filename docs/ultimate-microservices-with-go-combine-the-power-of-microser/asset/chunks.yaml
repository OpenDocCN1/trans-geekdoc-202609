    # [Embarking on the Go Journey](#toc.xhtml#c04)


    # [Introduction](#toc.xhtml#s65a)


    This chapter delves further into the intricacies of coding in Go. Unlike the preceding
    chapter, all Go developers should read this chapter. Although we will still cover
    known topics in Go, we will discuss the connection between those topics and Microservices.
    We will cover design patterns that exist in Go.


    Design patterns are a great way to solve common problems that happen to us as
    developers, regardless of which language we write in. Almost all the known design
    patterns are common to each language and look similar. There is an excellent website
    called `https://refactoring.guru/design-patterns`, where we can look at and explore
    design patterns. It is very convenient and has excellent examples demonstrating
    each design pattern in various popular programming languages; as you probably
    guessed, one is Golang.


    While we won’t cover general coding principles like SOLID, YAGNI, KISS, and DRY,
    it’s important to mention Uncle Bob’s Clean Code when discussing coding concepts.
    This book is essential for every developer, and Uncle Bob also has a more entertaining
    YouTube version of the book.


    We will cover four crucial concepts in Go - generics, context, errors, and testing.
    If we master those things, we will make our code much more resilient, readable,
    and maintainable.


    # [Structure](#toc.xhtml#s66a)


    In this chapter, we will discuss the following topics:


    *   Functional Options Pattern


    *   Generics


    *   Understanding Context in Go


    *   Errors - Talking About Error Propagation


    *   Testing - Best Practices, Mocking, Fuzzy Tests


    *   Microservices Testing


    # [Functional Options Pattern](#toc.xhtml#s67a)


    The decision was made to focus specifically on this pattern and not on other design
    patterns for two reasons. The first reason is that this design pattern is relatively
    distinctive within the context of Go and is one of the most used design patterns
    we can think of (maybe Singleton or Adapter are more popular).


    This pattern helps to construct `structs` cleanly and precisely. This is because
    Go does not support overloading (overloading creates a function in the same name
    but with a different signature). Also, there aren’t optional parameters in functions
    in Go.


    Those two facts (overloading and optional parameters not supported) can make our
    life of building a `struct` very hard. Building a structure can become a mess
    with many configurations (usually expressed as optional parameters). The functional
    options pattern lets us create a single struct constructor that receives the required
    parameters and a list of optional parameters. The steps to use this pattern are:


    1.  Create your desired `struct``.`


    2.  Create a type which is the name of the start + postfix of `Option` (`{structName}Options`)
    that is equal to - `func(*{structName})`.


    3.  Create your constructor `New{structName}`, include the required parameters,
    and add `options …{structNameOptions}` and return `*{structName}``.`


    4.  Create a custom function for each option. The convention is to start each
    one of those functions with a prefix of `With`.


    Let’s illustrate those steps; we created a struct of shopping client that looks
    like this:


    `type ShoppingClient struct {`


    `endpoint string`


    `apiKey   string`


    `userId   string`


    `shouldRetry bool`


    `timeout     time.Duration`


    `}`


    The second step is to create the option type:


    `type ShoppingClientOption func(*ShoppingClient)`


    Now, we can make our constructor that should look like this:


    `func NewShoppingClient(endpoint string, options …ShoppingClientOption) *ShoppingClient
    {`


    `client := &ShoppingClient{`


    `endpoint: endpoint,`


    `}`


    `for _, option := range options {`


    `option(client)`


    `}`


    `return client`


    `}`


    Note that if we don’t give any option, the fields will get their default value,
    except `endpoint`, which is required field. All that is left is to create the
    option functions.


    `func WithApiKey(key string) ShoppingClientOption {`


    `return func(c *ShoppingClient) {`


    `c.apiKey = key`


    `}`


    `}`


    `func WithUserId(id string) ShoppingClientOption {`


    `return func(c *ShoppingClient) {`


    `c.userId = id`


    `}`


    `}`


    `func WithTimeout(timeout time.Duration) ShoppingClientOption {`


    `return func(c *ShoppingClient) {`


    `c.timeout = timeout`


    `}`


    `}`


    `func WithRetry(shouldRetry bool) ShoppingClientOption {`


    `return func(c *ShoppingClient) {`


    `c.shouldRetry = shouldRetry`


    `}`


    `}`


    Let’s demonstrate two usages of the pattern:


    `client := NewShoppingClient(“https://api.shopping.com/v1”,`


    `WithApiKey(“my-api-key”),`


    `WithTimeout(10*time.Second),`


    `)`


    `fmt.Printf(“%+v\n”, client) // &{endpoint:https://api.shopping.com/v1 apiKey:my-api-key
    userId: shouldRetry:false timeout:10000000000}`


    `clientV2 := NewShoppingClient(“https://api.shopping.com/v2”,`


    `WithRetry(true),`


    `WithUserId(“my-user-id”),`


    `)`


    `fmt.Printf(“%+v\n”, clientV2) // &{endpoint:https://api.shopping.com/v2 apiKey:
    userId:my-user-id shouldRetry:true timeout:0}`


    In the examples, we created two clients with different configurations. We applied
    only the configuration needed in each example, which is this pattern’s strength.
    Remember this important design pattern because it will become handy further in
    the book.


    # [Generics](#toc.xhtml#s68a)


    Generics is a new feature and was introduced in v1.18. Go have a support generics
    from version 1.18. Among the significant additions to the language, Generics stand
    out as a prominent concept.


    Generics in programming let us write flexible and reusable code by handling different
    types of data in a more adaptable way.'
