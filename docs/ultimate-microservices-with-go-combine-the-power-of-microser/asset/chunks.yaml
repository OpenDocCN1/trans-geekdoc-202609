- raw: 'We declared an interface called `PrintInterface` with a `Print()` signature.
    When we declared `PrintableObject`, it was okay because the `Person` struct implemented
    the `Print` method. On the other hand, when we try to declare `PrintableObject2`,
    it causes a compilation error because the `DogPerson` struct doesn’t satisfy the
    `PrintInterface` interface.


    A vital and widely used interface in Go is the “empty interface”. The “empty interface”
    is a type that specifies zero methods and looks like this - `interface{}`


    `var i interface{}`


    `Or`


    `var myName interface{}`


    The empty interface is unique because it can hold values of any type (every type
    implements at least 0 methods). Its primary usage is handling unknown situations,
    which we will encounter many times throughout the book.


    # [Conclusion](#toc.xhtml#s63a)


    We have addressed the foundational knowledge and syntax necessary for comprehending
    this book. We covered the basis of any programming language - variables, loops,
    operators, code style, arrays, maps, and comments. We also covered specific syntax
    related to Go, such as packages, structs, interfaces, and project structure. Feel
    free to explore the Go language specifications further through the references
    provided in this chapter.


    In the upcoming chapters, we will dive into more advanced Go topics, although
    it’s important to acknowledge that we will only cover a portion. If you are a
    newcomer to Go, you can continue your exploration of the Go language by yourself.


