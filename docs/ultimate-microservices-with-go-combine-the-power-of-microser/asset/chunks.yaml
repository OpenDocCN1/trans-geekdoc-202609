- raw: "*   **Branch** **Pattern**: Creates separated versions (branches) of the same\
    \ service. We can perform complex rollouts like blue-green or A/B testing.\n\n\
    *   **Service Orchestration**: We will cover this in *[Chapter 8, Introduction\
    \ to Kubernetes](#c08.xhtml)*.\n\n*   **Design of Failures**: We will cover this\
    \ in *[Chapter 9, Deploying to Production](#c09.xhtml)*.\n\n*   **Monitoring**:\
    \ We will cover this in *[Chapter 10, Next Steps in Production](#c10.xhtml)*.\n\
    \nA final note to acknowledge before starting this chapter is that most of the\
    \ patterns we will discuss in this chapter have an internal implementation in\
    \ Kubernetes. Nowadays, using Kubernetes when crafting microservices architecture\
    \ is an industry standard.\n\n# [Structure](#toc.xhtml#s109a)\n\nIn this chapter,\
    \ we will discuss the following topics:\n\n*   Communication Between Services\
    \  \n\n    *   API Calls\n\n    *   Message Brokers\n\n    *   gRPC\n\n*   API\
    \ Gateway\n\n*   Service Discovery\n\n*   Load Balancer\n\n*   Database per Service\n\
    \n*   Backends for Frontends (BFF)\n\n*   External Configuration\n\n*   Service\
    \ Mesh\n\n*   Event-Driven Architecture  \n\n    *   Event Sourcing\n\n    * \
    \  CQRS\n\n# [Communication Between Services](#toc.xhtml#s110a)\n\nAs we saw in\
    \ *[Chapter 1, Introduction to Microservices](#c01.xhtml)*, microservices architecture\
    \ comprises small, independent, and decoupled services. Each service intends to\
    \ fulfill a **single** purpose. However, the system wants to use all the services\
    \ to achieve bigger goals. In pursuit of these goals, the services need a means\
    \ of communication, enabling them to exchange data through sending and receiving.\
    \ This communication form has many faces due to its complexity.\n\nThere are many\
    \ aspects to consider — message type, message size, response manner, latency,\
    \ failures, documentation, packing of messages, and more. Following are the leading\
    \ forms for communicating in a microservices architecture:\n\n*   API Calls\n\n\
    *   Message Brokers\n\n*   gRPC\n\nWe won’t explore these forms in depth, as each\
    \ one is vast and requires thorough understanding. To use them correctly and precisely,\
    \ we must know how to build them correctly. We must also familiarize ourselves\
    \ with their advantages and disadvantages to make the best decision when choosing\
    \ between them. Moreover, several other factors, constraints, and assumptions\
    \ contribute to the situation’s complexity.\n\n# [API Calls](#toc.xhtml#s111a)\n\
    \nAPI stands for Application Programming Interface. API calls are composed of\
    \ requests from the service that sends the call and responses from the services\
    \ that receive the requests. Each request contains parameters that tell which\
    \ data is requested. We send API requests over layer 7 of the network, the application\
    \ layer.\n\nAPI calls are the most frequent communication approach between services\
    \ in the microservices architecture. Diverse API styles, such as REST, SOAP, and\
    \ GraphQL, warrant in-depth discussion. Among them, REST stands out as the most\
    \ widely adopted. Consequently, the next chapter (*[Chapter 7, Building RESTful\
    \ API](#c07.xhtml)*) will explore RESTful APIs.\n\n![](OEBPS/images/Figure-6.1.jpg)\n\
    \n**Figure 6.1:** API Call\n\n# [Message Brokers](#toc.xhtml#s112a)\n\nWe mentioned\
    \ message brokers in the previous chapter and compared them to the Pub/Sub design\
    \ pattern. A fitting description for message brokers is to characterize them as\
    \ an intermediary of messages between one service and another. Instead of sending\
    \ a request directly from one service to another, a service sends a message to\
    \ a broker. The message contains mainly data, configuration, and sometimes instructions.\
    \ The message broker is a separate service, often composing many services and\
    \ acting as an independent cluster. The broker’s goal is to receive the message\
    \ and notify another service/s about this message or store it until another service\
    \ pulls it. Message brokers have many additional capabilities like retries, store\
    \ DLQ (aka for Dead Letter Queue), monitoring, temporary storage, encryption,\
    \ controlling the pace of message mediation, and so on.\n\n![](OEBPS/images/Figure-6.2.jpg)\n\
    \n**Figure 6.2:** Message Broker\n\nIt is important to emphasize that building\
    \ a message broker from scratch is strenuous and not recommended. There are various\
    \ excellent and well-tested technologies in the market. Here are the leading ones:\n\
    \n*   Apache Kafka\n\n*   RabbitMQ\n\n*   Amazon MQ\n\n# [gRPC](#toc.xhtml#s113a)\n\
    \ngRPC is a modern, open-source Google Remote Procedure Call (RPC) **framework**.\
    \ gRPC allows language-agnostic API definitions to be defined using Protocol Buffers.\
    \ Protocol Buffers (protobuf) is a language-agnostic serialization format that\
    \ is efficient for structuring and serializing data. We can quickly create client\
    \ and server implementations using Protocol Buffers in various programming languages.\
    \ gRPC framework leverages HTTP/2 as the underlying protocol, allowing multiple\
    \ capabilities like bidirectional streaming and real-time communications. Behind\
    \ the scenes, it is just an API call, but it takes advantage of HTTP/2 capabilities,\
    \ which makes it very powerful. While simple APIs are straightforward, gRPC takes\
    \ little time to learn. Moreover, the gRPC framework doesn’t have support for\
    \ all programming languages.\n\n# [API Gateway](#toc.xhtml#s114a)\n\nThere are\
    \ various ways to communicate between services in a microservices architecture.\
    \ The standard way is via simple APIs, as we saw.\n\nAPI gateway is a service\
    \ that acts as an entrance (gateway) to the microservice architecture. The API\
    \ gateway accepts all the requests from all the clients and then directs the client\
    \ request to the desired service, also returns the response to the client. Having\
    \ a single entrance point to the system gives us complete **control** over what\
    \ is going in and out. We can implement a few capabilities categories using the\
    \ API gateway:\n\n*   **Security**: Each service can use authentication, authorization,\
    \ and encryption capabilities. Each service doesn’t have to force those security\
    \ requirements. Instead, most things can happen in the API gateway. Sometimes,\
    \ it isn’t feasible to do anything due to business logic constraints.\n\n*   **Observability**:\
    \ Each service Can use capabilities like metrics, logs, and traces. We can start\
    \ tracking all the requests from the API Gateway.\n\n*   **Routing**: Rate-limiting,\
    \ caching, failure handle, load balancing, rolling updates capabilities, and more.\
    \ All of those logics can be implemented inside the API gateway.\n\n![](OEBPS/images/Figure-6.3.jpg)\n\
    \n**Figure 6.3:** API gateway, clients sending requests to services\n\nIn the\
    \ preceding figure, we can see different clients sending requests to the API gateway.\
    \ The API knows how to direct each request to the desired service by the requested\
    \ path and domain. This example illustrates the API gateway routing capability,\
    \ among others we mentioned.\n\nThe most crucial thing to remember while building\
    \ architecture is prioritizing **simplicity**. The API gateway pattern is beneficial\
    \ and powerful because it helps us achieve simpler architecture. It centralizes\
    \ many worries - security, observability, load balancing, rate-limit, and so on.\
    \ When a problem occurs, we’ll know where to investigate the incident.\n\nNote\
    \ that each API gateway varies from one to another. Each architecture has different\
    \ requirements, leading to different API gateway approaches. *[Chapter 8, Introduction\
    \ to Kubernetes](#c08.xhtml)*, will discuss how Kubernetes independently implements\
    \ some API gateway pattern capabilities - using a resource called ingress.\n\n\
    # [Service Discovery](#toc.xhtml#s115a)"
  fmt: "\n# 结构\n\n在本章中，我们将讨论以下主题：\n\n*   服务间通信\n    *   API 调用\n    *   消息代理\n   \
    \ *   gRPC\n*   API 网关\n*   服务发现\n*   负载均衡器\n*   每服务一个数据库\n*   面向前端的后端 (BFF)\n\
    *   外部配置\n*   服务网格\n*   事件驱动架构\n    *   事件溯源\n    *   CQRS\n\n# 服务间通信\n\n正如我们在*[第\
    \ 1 章，微服务简介](#c01.xhtml)*中所见，微服务架构由小型、独立且解耦的服务组成。每个服务旨在实现**单一**目的。然而，系统需要利用所有服务来达成更大的目标。为追求这些目标，服务需要一种通信手段，通过发送和接收来交换数据。这种通信形式因其复杂性而呈现多种面貌。\n\
    \n需要考虑的方面很多——消息类型、消息大小、响应方式、延迟、故障、文档、消息打包等。以下是在微服务架构中通信的主要形式：\n\n*   API 调用\n\
    *   消息代理\n*   gRPC\n\n我们不会深入探讨这些形式，因为每一个都很庞大，需要透彻的理解。要正确、精确地使用它们，我们必须知道如何正确构建它们。我们还必须熟悉它们的优缺点，以便在选择时做出最佳决策。此外，还有其他几个因素、约束和假设增加了局势的复杂性。\n\
    \n# API 调用\n\nAPI 代表应用程序编程接口。API 调用由发送调用的服务发起的请求和接收请求的服务返回的响应组成。每个请求包含参数，指明请求的是哪些数据。我们通过网络的第\
    \ 7 层（应用层）发送 API 请求。\n\nAPI 调用是微服务架构中服务间最常用的通信方式。多样的 API 风格（如 REST、SOAP 和 GraphQL）值得深入讨论。其中，REST\
    \ 是采用最广泛的。因此，下一章（*[第 7 章，构建 RESTful API](#c07.xhtml)*）将探讨 RESTful API。\n\n![](OEBPS/images/Figure-6.1.jpg)\n\
    \n**图 6.1：** API 调用\n\n# 消息代理\n\n我们在上一章提到了消息代理，并将其与发布/订阅设计模式进行了比较。对消息代理的一个贴切描述是：将其定义为一项服务与另一项服务之间消息的中介。服务不直接向另一服务发送请求，而是将消息发送给代理。消息主要包含数据、配置，有时还包含指令。消息代理是一个独立的服务，通常由许多服务组成，并作为一个独立的集群运行。代理的目标是接收消息，并通知其他服务有关此消息，或将其存储直到另一服务拉取它。消息代理还有许多额外功能，如重试、存储\
    \ DLQ（即死信队列）、监控、临时存储、加密、控制消息中介的速度等。\n\n![](OEBPS/images/Figure-6.2.jpg)\n\n**图\
    \ 6.2：** 消息代理\n\n必须强调的是，从头构建消息代理非常艰巨，且不推荐这样做。市场上有各种优秀且经过充分测试的技术。以下是主要技术：\n\n*\
    \   Apache Kafka\n*   RabbitMQ\n*   Amazon MQ\n\n# gRPC\n\ngRPC 是一个现代的、开源的 Google\
    \ 远程过程调用（RPC）**框架**。gRPC 允许使用 Protocol Buffers 定义与语言无关的 API。Protocol Buffers（protobuf）是一种与语言无关的序列化格式，可高效地构建和序列化数据。我们可以使用\
    \ Protocol Buffers 在各种编程语言中快速创建客户端和服务端实现。gRPC 框架利用 HTTP/2 作为底层协议，支持双向流式传输和实时通信等多种能力。在幕后，它本质上只是一个\
    \ API 调用，但它利用了 HTTP/2 的能力，这使其非常强大。虽然简单的 API 很直观，但 gRPC 学习曲线平缓。此外，gRPC 框架并不支持所有编程语言。\n\
    \n# API 网关\n\n在微服务架构中，服务间通信有多种方式。标准方式是通过简单的 API，正如我们所见。\n\nAPI 网关是一项充当微服务架构入口（网关）的服务。API\
    \ 网关接受来自所有客户端的请求，然后将客户端请求导向目标服务，并将响应返回给客户端。拥有单一的系统入口点，使我们能完全**控制**进出的内容。我们可以使用\
    \ API 网关实现几类功能：\n\n*   **安全性**：每个服务可以使用身份验证、授权和加密功能。每个服务不必强制执行这些安全要求。相反，大多数事情可以在\
    \ API 网关中完成。有时，由于业务逻辑约束，无法执行任何操作。\n*   **可观测性**：每个服务可以使用指标、日志和追踪等功能。我们可以从 API\
    \ 网关开始追踪所有请求。\n*   **路由**：限流、缓存、故障处理、负载均衡、滚动更新功能等。所有这些逻辑都可以在 API 网关内部实现。\n\n![](OEBPS/images/Figure-6.3.jpg)\n\
    \n**图 6.3：** API 网关，客户端向服务发送请求\n\n在上图中，我们可以看到不同的客户端向 API 网关发送请求。API 网关根据请求的路径和域名知道如何将每个请求导向目标服务。此示例演示了我们提到的\
    \ API 网关路由功能等。\n\n构建架构时要记住的最重要一点是优先考虑**简洁性**。API 网关模式之所以有益且强大，是因为它帮助我们实现更简单的架构。它集中处理了许多关注点——安全性、可观测性、负载均衡、限流等。当问题发生时，我们会知道去哪里调查事故。\n\
    \n请注意，每个 API 网关各不相同。每个架构有不同的需求，导致不同的 API 网关方案。*[第 8 章，Kubernetes 简介](#c08.xhtml)*将讨论\
    \ Kubernetes 如何使用名为 ingress 的资源独立实现某些 API 网关模式功能。\n\n# 服务发现\n"
