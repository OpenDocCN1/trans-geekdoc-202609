    # 献给


    *我挚爱的母亲：*


    *Anat Shtein*


    *一路支持我的所有人*


    *亲爱的读者，感谢您让这段旅程变得有意义*


    # 作者简介


    **Nir Shtein** 是一位多才多艺的工程师、讲师、公开演讲者和作家，深耕开源软件 (OSS)、Kubernetes、Golang、DevOps 和后端工程领域。他通过讲座、文章和播客传授知识，曾担任学院讲师、技术负责人、团队负责人和软件工程师等多个领导职务。


    在职业生涯中，Nir 从大型企业转型至充满活力的早期初创公司，拥抱学术角色，并开发了独特的开源项目。他积极参与加速器项目，进一步丰富了自己的专业经验。


    多年来，Nir 在国际范围内发表演讲，并撰写了多篇触达全球受众的文章。他为众多开源项目做出贡献，其中最成功的项目用户超过 100,000 名。


    除了专业成就，Nir 还指导过许多人，帮助他们进入高科技行业并开启职业生涯。工作之余，他喜欢阅读、听播客、运动、烹饪和探索新地方，不断寻求新的体验和知识。


    # 技术审阅者简介


    **Noopur Tanwar** 是一名软件开发专业人士，专攻后端开发和移动应用开发，专注于微服务。她曾在汽车、电信、零售和运输等多个行业工作。凭借在 Java、Kotlin
    和 Golang 等语言方面的专业知识，Noopur 对其技术概念和地道编码实践有深刻理解。她的软件开发经验能为文学作品中技术的呈现提供见解。


    目前，Noopur 在 Quest Global 担任 Golang 高级后端开发工程师，致力于为 Jio App 开发 API。她的工作致力于使代码在整个组织中更具可读性、可维护性、可扩展性和可靠性。Noopur
    的热情在于编写不仅功能完善，而且能高效优雅地解决问题的代码。这种热情驱使她不断追求进步，严谨地打磨每一段代码，并探索新技术和方法论。


    **Gaurav Arora** 是微软 MVP 奖获得者。他担任 AIM NITI Aayog、印度政府的变革导师，以及 Business Blaster、德里国家首都辖区政府的商业教练。此外，他是印度计算机学会
    (CSI) 终身会员，并在 IndiaMentor 担任顾问成员和资深导师。Gaurav 获得认证 Scrum 培训师和教练、ITIL-F 认证、PRINCE-F
    和 PRINCE-P 认证。他也是一名开源开发者，为微软 TechNet 社区做贡献。Gaurav 撰写过涵盖各种技术的书籍，最近因撰写卓越技术书籍而被认定为世界纪录保持者。


    # 致谢


    编写《使用 Go 构建终极微服务》是一段不可思议的旅程，我衷心感谢为使本书成为现实而发挥关键作用的各位人士。如果没有这么多人坚定不移的支持、智慧和专业知识，这个项目就无法完成。


    首先，我要感谢所有以各种方式参与本书编写的人员。我曾与同事、员工、朋友和管理者讨论本书内容——这些人主要支持我分享知识并将其转化为本书。特别感谢技术审阅者，他们详尽的评估和宝贵的反馈显著提升了本书质量。他们的投入和知识对于润色内容、确保精准度至关重要。


    我感激家人的持续支持。特别致谢我的母亲 Anat Shtein，她的鼓励和理解让我在写作旅程中更加坚强。我还要衷心感谢我的父亲 Ron Shtein，感谢他对该项目坚定不移的支持。


    最后，感谢您——读者，选择本书作为您学习旅程的指南。


    # 前言


    欢迎踏上一段精彩旅程，探索使用 Go 编程语言的微服务架构世界。本书旨在面向希望拓宽理解、掌握微服务全貌的开发者。它强调整体理解胜过具体技术细节，尤其是在
    AI 能够自动化许多简单任务的时代。


    本书的目标是提供微服务架构及其实际应用的全景视角，而非深入每一个细节。本书旨在为您提供基础知识和技能，以便使用 Go 开发健壮的服务、设计可扩展的系统，并确保其成功部署到生产环境。


    全书将探索 Go 编程的基础知识，深入研究高级主题，并驾驭构建和部署微服务的复杂性。我们将重点阐述微服务、Go、RESTful API 和 Kubernetes
    之间的紧密联系，涵盖服务通信、API 设计、容器编排、安全性和可观测性等关键领域。


    读完本书后，您将牢固掌握使用 Go 架构和实现微服务的方法，做好准备应对将服务高效推向生产环境的挑战。本书不仅是一本指南，更是一块垫脚石，助您继续提升技能，在不断演变的软件开发世界中探索新天地。


