    \n# [Building RESTful API](#toc.xhtml#c07)\n\n# [Introduction](#toc.xhtml#s130a)\n\
    \nREST, which stands for REpresentational State Transfer, is an architectural\
    \ style. REST defines sets of constraints that API should fulfill to meet the\
    \ requirements of the REST style. RESTful is an adjective for an API that is ahead\
    \ of REST constraints. In this first section of this chapter, we’ll elaborate\
    \ on these constraints.\n\nIn this chapter, we’ll delve into the constraints of\
    \ REST and illustrate them through a service in Go. In the previous chapter, we\
    \ discussed the manner of communication between services in a microservices architecture.\
    \ The prevalent pattern for communication is through API calls, with REST being\
    \ the most widely adopted architectural style for APIs. Consequently, our primary\
    \ focus will be on the REST architectural pattern. The microservices architecture\
    \ inherently encompasses the REST constraints throughout the system and vice versa.\
    \ There is a powerful connection between microservices and REST. More widely,\
    \ there is an even more powerful connection between Microservices <> Go <> REST\
    \ <> Kubernetes.\n\n![](OEBPS/images/Figure-7.1.jpg)\n\n**Figure 7.1:** “REST”\
    \ search term by Google Trends\n\nThe REST approach has become very popular over\
    \ the years, as we can see by Google Trends. With that popularity, many RESTful\
    \ APIs exist, some of which became very popular due to their praiseworthy REST\
    \ implementation. When learning REST at the start or just writing a new RESTful\
    \ API, looking at famous APIs is pleasant and instructive. Here is an example\
    \ of two of them:\n\n*   Strip API\n\n*   Twilio API\n\nThere are three topics\
    \ that we won’t cover in this chapter and will cover in the next chapters that\
    \ are related to REST:\n\n*   Design of Failures\n\n*   Monitoring\n\n*   Security\
    \ - Authentication, Authorization\n\nIt is vital to remember that REST is an architectural\
    \ style, and there isn’t a single way or the right way to implement REST. Some\
    \ things are suitable for REST, and some are apparent and opposed to REST. In\
    \ any meeting room, when designing REST APIs, there will be the stricter REST\
    \ people called RESTafarians, and there are people who can deviate from REST’s\
    \ hard constraints. We sometimes can deviate from the constraints of REST to simplify/improve\
    \ the API or answer edge cases. REST style is not boolean, 1, or 0. It is more\
    \ abstract, and API can be “*more REST*” or “*less REST*”.\n\n# [Structure](#toc.xhtml#s131a)\n\
    \nIn this chapter, we will discuss the following topics:\n\n*   A Brief About\
    \ the RESTful Approach  \n\n    *   Resource and Representation\n\n    *   Constraints\n\
    \n*   Designing an API  \n\n    *   Capabilities\n\n    *   Documentation - Swagger\
    \ and OpenAPI\n\n    *   API Folder Structure\n\n    *   Resources Methods\n\n\
    *   Crafting a Server  \n\n    *   Gin Gonic Setup\n\n    *   Chains of Responsibilities\n\
    \n    *   CORS\n\n*   API Capabilities  \n\n    *   Pagination\n\n    *   Rate\
    \ Limit\n\n    *   Panic Recovery\n\n    *   Graceful Shutdown\n\n    *   Filter\
    \ and Sort\n\n    *   Caching\n\n    *   Conventions\n\n    *   Versioning and\
    \ Deprecation\n\n    *   Common Pitfalls\n\n# [A Brief About the RESTful Approach](#toc.xhtml#s132a)\n\
    \nAs we mentioned in the introduction, REST is a set of constraints, and RESTful\
    \ API is an API that meets the constraints of REST. Let’s emphasize that REST\
    \ is a style, not a Protocol like HTTP. There is a familiar mix-up between REST\
    \ and HTTP. Roy Fielding allows the use of any preferred protocol to implement\
    \ REST. Although this option is available, most RESTful APIs use HTTP protocol,\
    \ which Roy recommended as the preferred protocol, but it isn’t a mandate. Other\
    \ types of protocols can be FTP, SMTP, IMAP, and so on. The popular type of representation\
    \ (the RE from REST) is JSON (stands for JavaScript Object Notation), and again,\
    \ this isn’t a constraint. RESTful API can use other representations like XML,\
    \ HTML, CSV, plain text, PDF, and so on.\n\nThere are various ways to craft a\
    \ RESTful API, depending on our choices, needs, and business constraints. Eventually,\
    \ every RESTful API fulfills the REST constraints, but in different ways.\n\n\
    ![](OEBPS/images/Figure-7.2.jpg)\n\n**Figure 7.2:** REST constraints\n\nThere\
    \ are six constraints of REST. Eventually, we can do whatever we want with our\
    \ code. The REST style aims to guide us in building a more sensible system. Implementing\
    \ these constraints aims to improve the client’s performance, stability, and scalability\
    \ on the server side. These constraints are combined to solve and fix common and\
    \ familiar problems that most systems have already experienced and been burned\
    \ by.\n\n# [Resource and Representation](#toc.xhtml#s133a)\n\nWe have mentioned\
    \ resources and representation a few times. These two terms are the core of the\
    \ REST style.\n\n*   **Resource:** A resource is a piece of information representing\
    \ functional data as a single unit. For example, resources can be an object (account,\
    \ user, chair), collection of objects, document, picture, and so on. We can change\
    \ the state of resources by using so-called resource methods, which need to be\
    \ uniform (as the Uniform Interface constraint). For example, HTTP methods like\
    \ GET, POST, PUT, DELETE, and more behave as the resource methods.\n\n*   **Representation:**\
    \ Resource representation refers to the state of the resource, which includes\
    \ data, metadata, and hyperlinks.\n\n# [Constraints](#toc.xhtml#s134a)\n\nHere\
    \ are the six constraints.\n\n# [Client–Server](#toc.xhtml#s135a)\n\nThis constraint\
    \ is also the core principle of microservices architecture. It encourages us to\
    \ keep client and server loosely coupled. The client and the server must not share\
    \ any dependency between them. Components need to be developed independently and\
    \ separately; the client only knows the URIs that the server exposes.\n\n# [Uniform\
    \ Interface](#toc.xhtml#s136a)\n\nThis is the most complex constraint, composed\
    \ of four other sub-constraints. URI, which stands for Uniform Resource Identifier,\
    \ is a sequence of characters web technologies know to recognize and associate\
    \ specific resources.\n\n![](OEBPS/images/Figure-7.3.jpg)\n\n**Figure 7.3:** URI\
    \ composition\n\nUnlike the protocol and representation mentioned earlier, URIs\
    \ aren’t a choice. REST forces us to use URIs to determine the uniqueness of resources.\
    \ Between the server and the client, there is an interface. This constraint aims\
    \ to create solidarity while establishing that interface by the four sub-constraints:\n\
    \n*   **Identification of resources:** It involves ensuring that each URI is unique\
    \ to a specific resource. This uniqueness is crucial, preventing the manipulation\
    \ of the same resource from different interfaces.\n\n*   **Manipulation of resources\
    \ through representations:** The representation the server needs to expose is\
    \ the desired modification. This representation needs to be as explicit as possible."
