- raw: 'There are various ways to make loops in Go; all of them use the keywords `for`,
    and for break, use `break`, and to move to the next iteration, use `continue`
    -


    `func main() {`


    `// for loop with initialization, condition, and post`


    `for i := 0; i < 5; i++ {`


    `println(i)`


    `}`


    `// for loop with single condition, act as a “while”`


    `i := 0`


    `for i < 5 {`


    `println(i)`


    `i++`


    `}`


    `// for loop with no condition, act as a “while”`


    `i = 0`


    `for {`


    `println(i)`


    `i++`


    `if i >= 5 {`


    `break`


    `}`


    `}`


    `// for loop with continue`


    `for i := 0; i < 5; i++ {`


    `if i%2 == 0 {`


    `continue`


    `}`


    `println(i)`


    `}`


    `// for loop with range`


    `s := []int{1, 2, 3}`


    `for k, v := range s {`


    `println(k, v)`


    `}`


    `}`


    Note that there isn’t `while` keyword in Go. For a while loop, we just use `for`
    (with or without a condition).


    The last example of a for loop with range is unique to Go. The `range` keyword
    lets us iterate on iterable types such as array, slice, and map.


    # [Arrays](#toc.xhtml#s51a)


    There are two ways to declare an array in Go:


    `func main() {`


    `// declare an array of 5 integers`


    `var a = [5]int{1, 2, 3, 4, 5}`


    `// declare an array with inferred length`


    `var b = […]int{1, 2, 3}`


    `}`


    In the first example (`var a = [5]int{1, 2, 3, 4, 5}`), the length was set to
    5. In the second example (`var b = […]int{1, 2, 3}`), the length was inferred.
    Of course, we can declare an array without using the keyword `var` and just using
    `:=`.


    Arrays in Go can only store the same type, and the length of arrays is immutable.


    # [Slices](#toc.xhtml#s52a)


    Slices are very similar data type to an array, but slices are much more flexible.
    The length of the slice can change in the runtime. Slices are one of Go’s main
    strengths. Here is how we declare a slice in Go:


    `mySlice := []string{“nir”, “david”}`


    The declaration is almost the same syntax as arrays, but we don’t need to declare
    the size (or infer it by `“…”`). Another way to declare a slice in Go is by using
    the `make` keyword.


    `mySlice := make([]type, length, capacity)`


    The `length` is the number of elements the slice contains, whereas the `capacity`
    is the number of elements in the backing array, counting from the first element
    in the slice.


    The `capacity` will always be bigger than the `length`.


    Two functions that help us to determine arrays, slice length, and capacity are
    `len` (for measuring length) and `cap` (for measuring capacity).


    `slice := make([]int, 2, 5)`


    `fmt.Println(slice) // [0 0]`


    `fmt.Println(len(slice)) // 2`


    `fmt.Println(cap(slice)) // 5`


    A convenient operation we can do is split a slice/array into portions. Here is
    an example of doing so.


    `myArray := [5]int{1, 2, 3, 4, 5}`


    `slice = myArray[1:4] // from the 1st index to the 4th index (not included)`


    `fmt.Println(mySlice) // [2 3 4]`


    # [Functions](#toc.xhtml#s53a)


    In Go, a function can return several parameters with different data types:


    `func myFunction(amount int, prefix string) string {`


    `return fmt.Sprintf(“%s: %d”, prefix, amount)`


    `} // Input: 5, “nir” | Output: “nir: 5”`


    `func multipleReturns(prefix string, amount int) (string, int) {`


    `amount++`


    `return fmt.Sprintf(“%s: %d”, prefix, amount), amount`


    `} // Input: “nir”, 5 | Output: “nir: 6”, 6`


    `func namedReturnValues(prefix string, amount int) (result string, newAmount int)
    {`


    `amount++`


    `result = fmt.Sprintf(“%s: %d”, prefix, amount)`


    `newAmount = amount`


    `return`


    `} // Input: “nir”, 5 | Output: “nir: 6”, 6`


    In the first example (`myFunction`), we can see a simple function, using the `func`
    and `return` keywords. In the second example (`multipleReturns`), we see a function
    with multiple return values. In the third example (`namedReturnValues`), we see
    a function with multiple named return values (a single named return value is also
    valid).


    An instrumental ability to Go regarding functions is to use `defer`. The `defer`
    keyword is a function. This function gets executed after the parent function finishes
    its functionality. Here are two examples:


    `func functionWithDefer() {`


    `defer fmt.Println(“This will be printed last”)`


    `fmt.Println(“This will be printed first”)`


    `} // Output: This will be printed first`


    `//         This will be printed last`


    `func functionWithMultipleDefers() {`


    `defer func() {`


    `fmt.Println(“This will be printed last”)`


    `}()`


    `defer fmt.Println(“This will be printed second”)`


    `fmt.Println(“This will be printed first”)`


    `}`


    `// Output: This will be printed first`


    `//         This will be printed second`


    `//         This will be printed last`


    The examples are pretty straightforward and explain the purpose of the `“defer”`
    function.


    In Go, functions are first-class citizens, which can be passed as arguments to
    other functions, returned from functions, and assigned to variables. This feature
    enables the creation of higher-order functions and facilitates functional programming
    patterns.


    # [Maps](#toc.xhtml#s54a)


    Maps in Go are used to store key-value data. The default value of the `map` in
    Go is `nil`. Maps hold references to an underlying hash table. Here is how we
    declare a map and some common actions on `map`:


    `fruitsPrices := map[string]int{`


    `“orange”: 10,`


    `“apple”:  20,`


    `“banana”: 15,`


    `}`


    `fmt.Println(fruitsPrices) // Output: map[apple:20 banana:15 orange:10]`


    `// Add a new key-value pair`


    `fruitsPrices[“mango”] = 25`


    `fmt.Println(fruitsPrices) // Output: map[apple:20 banana:15 mango:25 orange:10]`


    `// Delete a key-value pair`


    `delete(fruitsPrices, “orange”)`


    `fmt.Println(fruitsPrices) // Output: map[apple:20 banana:15 mango:25]`


    `// Get a value from a map`


    `fmt.Println(fruitsPrices[“apple”]) // Output: 20`


    `// Get a value from a map that doesn’t exist`


    `fmt.Println(fruitsPrices[“grapes”]) // Output: 0 (the default value for int)`


    `// Check if a key exists in a map`


    `price, ok := fruitsPrices[“grapes”]`


    `fmt.Println(price, ok) // Output: 0 false`


    `// Iterate over a map`


    `for fruit, price := range fruitsPrices {`


    `fmt.Printf(“%s: %d\n”, fruit, price)`


    `} // Output: apple: 20 banana: 15 mango: 25 (order may vary)`


    `fmt.Println(len(fruitsPrices)) // Output: 3`


    `// Create an empty map`


    `emptyMap := make(map[string]int)`


    `fmt.Println(emptyMap) // Output: map[]`


    # [Switch](#toc.xhtml#s55a)


    Use the `switch` statement when selecting one of many code blocks. In Go, the
    keyword `break` is unnecessary; it breaks by `default` after every case. If you
    wish to go through the next switch case, use the `fallthrough` keyword. Here are
    typical examples:


    `func main() {`


    `printString(“b”) // b`


    `printString(“a”) // a b`


    `}`


    `func printString(str string) {`


    `switch str {`


    `case “a”:`


    `println(“a”)`


    `fallthrough`


    `case “b”:`


    `println(“b”)`


    `default:`


    `println(“default”)`


    `}`


    `}`


    If none of the expressions matches, it will go to the `default` statement.


    # [Consts](#toc.xhtml#s56a)


    We can declare consts in the same scopes as variables using the `const` keyword.
    During runtime, constants cannot be altered or manipulated. The available types
    for consts are numbers, characters (runes), strings, or booleans. (For more information
    about runes, check Reference number 5). Here are examples that demonstrate consts
    in Go:


    `const str string = “const string”`


    `const (`


    `_ = iota`


    `one`


    `two`


    `three`


    `)`


    `func main() {`


    `println(str)       // string`


    `str = “new string” // cannot assign to str, will fail in compilation`


    `println(one)   // 1`


    `println(two)   // 2`


    `println(three) // 3`


    `}`


    First, declaring a const string is pretty straightforward. Note that we used the
    keyword `string` in the example, which isn’t essential.


    Second, the example of `iota`. The `iota` identifier represents integer-based
    constants in Go and is a convenient way to declare a sequence of constants while
    keeping the code readable. The initial value of `iota` is 0.


    # [Other Language Specifications](#toc.xhtml#s57a)'
  fmt: "\n# Go 语言基础语法\n\n## 循环\n\nGo 语言中有多种循环方式；它们都使用 `for` 关键字。使用 `break` 跳出循环，使用\
    \ `continue` 进入下一次迭代。\n\n```go\nfunc main() {\n\t// for 循环：包含初始化、条件、后置语句\n\tfor\
    \ i := 0; i < 5; i++ {\n\t\tprintln(i)\n\t}\n\n\t// for 循环：仅包含条件，类似 \"while\"\n\
    \ti := 0\n\tfor i < 5 {\n\t\tprintln(i)\n\t\ti++\n\t}\n\n\t// for 循环：无条件，类似 \"\
    while true\"\n\ti = 0\n\tfor {\n\t\tprintln(i)\n\t\ti++\n\t\tif i >= 5 {\n\t\t\
    \tbreak\n\t\t}\n\t}\n\n\t// for 循环：配合 continue\n\tfor i := 0; i < 5; i++ {\n\t\
    \tif i%2 == 0 {\n\t\t\tcontinue\n\t\t}\n\t\tprintln(i)\n\t}\n\n\t// for 循环：配合\
    \ range\n\ts := []int{1, 2, 3}\n\tfor k, v := range s {\n\t\tprintln(k, v)\n\t\
    }\n}\n```\n\n注意 Go 中没有 `while` 关键字。实现 while 循环只需使用 `for`（带或不带条件）。\n\n最后一个 `range`\
    \ 示例是 Go 特有的。`range` 关键字让我们可以遍历数组、切片、映射等可迭代类型。\n\n## 数组\n\nGo 中声明数组有两种方式：\n\n\
    ```go\nfunc main() {\n\t// 声明一个包含 5 个整数的数组\n\tvar a = [5]int{1, 2, 3, 4, 5}\n\t\
    // 声明一个长度自动推断的数组\n\tvar b = [...]int{1, 2, 3}\n}\n```\n\n第一个示例（`var a = [5]int{1,\
    \ 2, 3, 4, 5}`）显式指定长度为 5。第二个示例（`var b = [...]int{1, 2, 3}`）由编译器推断长度。当然，也可以不使用\
    \ `var` 关键字，直接用 `:=` 简短声明。\n\nGo 数组只能存储同一类型元素，且长度不可变。\n\n## 切片\n\n切片与数组非常相似，但更加灵活。切片长度可在运行时动态改变，是\
    \ Go 的核心优势之一。声明切片的方式如下：\n\n```go\nmySlice := []string{\"nir\", \"david\"}\n```\n\
    \n语法与数组几乎相同，但无需声明大小（或用 `...` 推断）。另一种声明方式是使用 `make` 关键字：\n\n```go\nmySlice := make([]type,\
    \ length, capacity)\n```\n\n`length` 表示切片当前包含的元素数量，`capacity` 表示底层数组从切片第一个元素起的容量。`capacity`\
    \ 始终大于或等于 `length`。\n\n用于获取数组、切片长度和容量的两个内置函数是 `len`（长度）和 `cap`（容量）。\n\n```go\n\
    slice := make([]int, 2, 5)\nfmt.Println(slice)  // [0 0]\nfmt.Println(len(slice))\
    \  // 2\nfmt.Println(cap(slice))  // 5\n```\n\n切片/数组的一个便捷操作是切片截取。示例如下：\n\n```go\n\
    myArray := [5]int{1, 2, 3, 4, 5}\nslice = myArray[1:4] // 从索引 1 到 4（不包含 4）\nfmt.Println(slice)\
    \ // [2 3 4]\n```\n\n## 函数\n\nGo 函数支持返回多个不同类型的参数：\n\n```go\nfunc myFunction(amount\
    \ int, prefix string) string {\n\treturn fmt.Sprintf(\"%s: %d\", prefix, amount)\n\
    } // Input: 5, \"nir\" | Output: \"nir: 5\"\n\nfunc multipleReturns(prefix string,\
    \ amount int) (string, int) {\n\tamount++\n\treturn fmt.Sprintf(\"%s: %d\", prefix,\
    \ amount), amount\n} // Input: \"nir\", 5 | Output: \"nir: 6\", 6\n\nfunc namedReturnValues(prefix\
    \ string, amount int) (result string, newAmount int) {\n\tamount++\n\tresult =\
    \ fmt.Sprintf(\"%s: %d\", prefix, amount)\n\tnewAmount = amount\n\treturn\n} //\
    \ Input: \"nir\", 5 | Output: \"nir: 6\", 6\n```\n\n第一个示例（`myFunction`）展示了使用 `func`\
    \ 和 `return` 关键字的简单函数。第二个示例（`multipleReturns`）展示多返回值函数。第三个示例（`namedReturnValues`）展示具名返回值函数（单个具名返回值也合法）。\n\
    \nGo 函数的一个重要特性是 `defer`。`defer` 关键字注册的函数会在外层函数执行完毕后执行。示例如下：\n\n```go\nfunc functionWithDefer()\
    \ {\n\tdefer fmt.Println(\"This will be printed last\")\n\tfmt.Println(\"This\
    \ will be printed first\")\n} \n// Output: \n// This will be printed first\n//\
    \ This will be printed last\n\nfunc functionWithMultipleDefers() {\n\tdefer func()\
    \ {\n\t\tfmt.Println(\"This will be printed last\")\n\t}()\n\tdefer fmt.Println(\"\
    This will be printed second\")\n\tfmt.Println(\"This will be printed first\")\n\
    }\n// Output:\n// This will be printed first\n// This will be printed second\n\
    // This will be printed last\n```\n\n示例直观地说明了 `defer` 的执行顺序（后进先出）。\n\n在 Go 中，函数是一等公民，可作为参数传递、作为返回值返回、赋值给变量。这支持高阶函数和函数式编程模式。\n\
    \n## 映射\n\nGo 映射用于存储键值对数据。`map` 的零值是 `nil`。映射持有对底层哈希表的引用。声明映射及常用操作如下：\n\n```go\n\
    fruitsPrices := map[string]int{\n\t\"orange\": 10,\n\t\"apple\":  20,\n\t\"banana\"\
    : 15,\n}\n\nfmt.Println(fruitsPrices) // Output: map[apple:20 banana:15 orange:10]\n\
    \n// 添加键值对\nfruitsPrices[\"mango\"] = 25\nfmt.Println(fruitsPrices) // Output:\
    \ map[apple:20 banana:15 mango:25 orange:10]\n\n// 删除键值对\ndelete(fruitsPrices,\
    \ \"orange\")\nfmt.Println(fruitsPrices) // Output: map[apple:20 banana:15 mango:25]\n\
    \n// 获取值\nfmt.Println(fruitsPrices[\"apple\"]) // Output: 20\n\n// 获取不存在的键（返回类型零值）\n\
    fmt.Println(fruitsPrices[\"grapes\"]) // Output: 0 (int 的零值)\n\n// 检查键是否存在\nprice,\
    \ ok := fruitsPrices[\"grapes\"]\nfmt.Println(price, ok) // Output: 0 false\n\n\
    // 遍历映射\nfor fruit, price := range fruitsPrices {\n\tfmt.Printf(\"%s: %d\\n\"\
    , fruit, price)\n} // Output: apple: 20 banana: 15 mango: 25 (顺序不固定)\n\nfmt.Println(len(fruitsPrices))\
    \ // Output: 3\n\n// 创建空映射\nemptyMap := make(map[string]int)\nfmt.Println(emptyMap)\
    \ // Output: map[]\n```\n\n## Switch 语句\n\n使用 `switch` 语句从多个代码块中选择一个执行。Go 中不需要\
    \ `break` 关键字；每个 `case` 默认自动终止。若需穿透到下一个 `case`，使用 `fallthrough` 关键字。典型示例：\n\n\
    ```go\nfunc main() {\n\tprintString(\"b\") // b\n\tprintString(\"a\") // a b\n\
    }\n\nfunc printString(str string) {\n\tswitch str {\n\tcase \"a\":\n\t\tprintln(\"\
    a\")\n\t\tfallthrough\n\tcase \"b\":\n\t\tprintln(\"b\")\n\tdefault:\n\t\tprintln(\"\
    default\")\n\t}\n}\n```\n\n若无 `case` 匹配，则执行 `default` 分支。\n\n## 常量\n\n常量使用 `const`\
    \ 关键字声明，作用域与变量相同。运行时常量不可修改。常量类型包括数字、字符（rune）、字符串、布尔值。（关于 rune 详见参考资料 5）。示例：\n\n\
    ```go\nconst str string = \"const string\"\n\nconst (\n\t_ = iota\n\tone\n\ttwo\n\
    \tthree\n)\n\nfunc main() {\n\tprintln(str)       // string\n\t// str = \"new\
    \ string\" // 编译错误：cannot assign to str\n\tprintln(one)   // 1\n\tprintln(two)\
    \   // 2\n\tprintln(three) // 3\n}\n```\n\n首先，声明常量字符串很直观。示例中显式写了 `string` 类型，其实可省略。\n\
    \n其次是 `iota` 示例。`iota` 是 Go 中的常量生成器，初始值为 0，每行递增 1，常用于声明枚举常量，保持代码可读性。\n\n## 其他语言规范\n"
