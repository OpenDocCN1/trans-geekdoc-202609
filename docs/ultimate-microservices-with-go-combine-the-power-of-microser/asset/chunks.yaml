    \ from the `sync` package.\n\n```go\ntype cache struct{}\n\nvar cacheSingleton\
    \ *cache\nvar once sync.Once\n\nfunc main() {\n\tGetCache()\n\tGetCache()\n\t\
    GetCache()\n}\n\nfunc GetCache() *cache {\n\tonce.Do(func() {\n\t\tprintln(\"\
    Creating singleton object\")\n\t\tcacheSingleton = &cache{}\n\t})\n\treturn cacheSingleton\n\
    }\n```\n\nThe output of this program is - `Creating singleton object`. And that’s\
    \ it (not three times).\n\nThe `Do` function receives a function as a parameter.\
    \ The `Do` function ensures that the function inside is executed exactly once,\
    \ which we want to achieve when writing a singleton. `Do` is also the only function\
    \ that exists on the `Once` type.\n\n# Low-Level Routines\n\nThere are other low-level\
    \ routines we can use in the `sync` package that we won’t elaborate on in this\
    \ chapter:\n\n1.  `sync.Map`: The same purpose as the normal map in Go but is\
    \ safe for concurrent access across several goroutines.\n2.  `sync/atomic`: Managing\
    \ shared counter state across several goroutines.\n3.  `sync.Pool`: Self-managed\
    \ temporary retrieval object pool — this is to facilitate the Garbage Collector\
    \ work.\n\n# Pub/Sub\n\nPublish-subscribe is one of the most known patterns. Pub/Sub\
    \ pattern is a messaging pattern that helps us to communicate between systems/services/objects.\
    \ It broadcasts data/messages from what is called a publisher through a topic.\
    \ Each subscriber is allocated to a specific topic, and every subscriber receives\
    \ all the messages associated with the topic to which they are assigned.\n\n![Figure\
    \ 5.4: Publish-Subscribe pattern](OEBPS/images/Figure-5.4.jpg)\n\n```go\ntype\
    \ PubSub struct {\n\tsubscribers map[string][]chan interface{}\n}\n\nfunc NewPubSub()\
    \ *PubSub {\n\treturn &PubSub{\n\t\tsubscribers: make(map[string][]chan interface{}),\n\
    \t}\n}\n\nfunc (ps *PubSub) Publish(topic string, item interface{}) {\n\tfor _,\
    \ ch := range ps.subscribers[topic] {\n\t\tch <- item\n\t}\n}\n\nfunc (ps *PubSub)\
    \ Subscribe(topic string) <-chan interface{} {\n\tch := make(chan interface{})\n\
    \tps.subscribers[topic] = append(ps.subscribers[topic], ch)\n\treturn ch\n}\n\n\
    func main() {\n\tps := NewPubSub()\n\tch := ps.Subscribe(\"t1\")\n\tgo ps.Publish(\"\
    t1\", \"hello\")\n\titem := <-ch\n\tprintln(item.(string))\n}\n```\n\nThis is\
    \ a simple implementation of the publish-subscribe pattern in Go. Note that this\
    \ example is imperfect - we don’t close the channels and do not handle concurrency\
    \ properly. Utilizing existing libraries is the suggested approach when implementing\
    \ this pattern.\n"
  trans: "\n\n# 通道最有用的用例之一是同步\n\n我们可以通过通道通知 Goroutine 关于进程的开始和结束，从而在它们之间实现同步。在 Goroutine\
    \ 之间通知工作“`done`”的一种普遍模式是使用大小为 1 的布尔通道。\n\n```go\nfunc main() {\n\tdone := make(chan\
    \ bool, 1)\n\tgo func() {\n\t\tprintln(\"Start goroutine\")\n\t\ttime.Sleep(1\
    \ * time.Second) // simulate work\n\t\tprintln(\"End goroutine\")\n\t\tdone <-\
    \ true\n\t}()\n\tprintln(\"Waiting goroutine\")\n\t<-done\n\tprintln(\"All done\"\
    )\n}\n```\n\n# 发挥通道优势\n\n正如我们所见，通道的用法是 Goroutine 之间的通信。发挥通道优势有几个用例：\n\n*   Goroutine\
    \ 之间的同步\n*   发送和接收通知\n*   使用 `select` 从多个 Goroutine 接收数据\n*   Futures 和 promises\
    \ `->` 模拟 `async/await` 过程\n*   作为队列\n*   超时处理\n*   处理致命错误\n*   定时器\n*   Fan In\
    \ Fan Out 模式\n\n这些只是用例的几个主要示例。还有许多其他用例和示例。\n\n## 何时应使用带缓冲通道，何时应使用无缓冲通道？\n\n默认情况下，我们应该选择无缓冲通道。当接收方落后于发送方，或者在数据检索前需要同步时，带缓冲通道就变得必要了。这些是使用带缓冲通道而非无缓冲通道的主要原因。此外，特定的程序需求也可能决定使用带缓冲/无缓冲通道。\n\
    \n# `Sync` 包\n\n`sync` 包是 Go 语言的核心包之一。该包提供了基本的同步原语。包中的大多数类型提供了底层例程。高层例程应通过通道来执行。\n\
    \n# WaitGroups\n\n`WaitGroup` 是 `sync` 包中的一种类型。`WaitGroup` 提供了一种等待多个 Goroutine\
    \ 完成工作的方法。它是一个功能极其强大且用途广泛的工具。\n\n```go\nfunc main() {\n\twg := sync.WaitGroup{}\n\
    \twg.Add(5)\n\tfor i := 0; i < 5; i++ {\n\t\tgo func(i int) {\n\t\t\tdefer wg.Done()\n\
    \t\t\ttime.Sleep(1 * time.Second)\n\t\t\tprintln(i)\n\t\t}(i)\n\t}\n\tfmt.Println(\"\
    Waiting…\")\n\twg.Wait()\n\tfmt.Println(\"Done\")\n}\n```\n\n输出将如下所示（数字的顺序可能会变化）：\n\
    \n```\nWaiting…\n2\n0\n1\n3\n4\nDone\n```\n\n`WaitGroup` 类型作为一个计数器工作。在幕后，`WaitGroup`\
    \ 类型持有一个 `int` 类型的计数器，初始值为 0。如果计数器值变为 0，则所有阻塞在 `Wait()` 上的 Goroutine 都会被释放。我们使用\
    \ `Add(delta int)` 函数来增加计数器的大小。要减少计数器的值，我们使用 `Done()` 函数——它从计数器中减去 1。这些是 `WaitGroup`\
    \ 类型的所有方法——`Add`、`Done`、`Wait`。\n\n请注意，`Add` 函数中的负值会导致 panic。此外，如果我们在函数之间传递 `WaitGroup`\
    \ 实例，应该通过指针传递。\n\n这种技术最大的缺点是没有常规的方式来处理错误。有一个单独的包叫 `errgroup`，它可以帮助我们实现这一点。\n\n\
    # 锁\n\n为了在多个 Goroutine 之间访问相同的数据，我们需要在一个 Goroutine 访问数据时保护数据不被另一个 Goroutine 访问。这种情况可能导致数据错误，甚至更糟——致命错误。\n\
    \n```go\nfunc main() {\n\tcounter := 0\n\twg := sync.WaitGroup{}\n\twg.Add(10000)\n\
    \tfor i := 0; i < 10000; i++ {\n\t\tgo func() {\n\t\t\tdefer wg.Done()\n\t\t\t\
    counter++\n\t\t}()\n\t}\n\twg.Wait()\n\tfmt.Println(\"counter:\", counter)\n}\n\
    ```\n\n在前面的示例中，计数器的输出应该是 10,000。不幸的是，计数器的值远低于它。原因是多个 Goroutine 试图访问 `counter`\
    \ 变量；一些失败是因为其他 Goroutine 锁定了计数器值并写入它。如果我们用 map 替换计数器并尝试写入同一个键，我们将得到一个更糟的场景——`fatal\
    \ error: concurrent map writes`。为了避免这种情况，我们需要使用 `mutex`。`Mutex` 是 `sync` 包的一种类型，帮助我们加锁和解锁。\n\
    \n```go\nfunc main() {\n\tcounter := 0\n\twg := sync.WaitGroup{}\n\tmu := sync.Mutex{}\n\
    \twg.Add(10000)\n\tfor i := 0; i < 10000; i++ {\n\t\tgo func() {\n\t\t\tdefer\
    \ wg.Done()\n\t\t\tmu.Lock()\n\t\t\tcounter++\n\t\t\tmu.Unlock()\n\t\t}()\n\t\
    }\n\twg.Wait()\n\tfmt.Println(\"counter:\", counter)\n}\n```\n\n现在输出将是 - `counter:\
    \ 10000`，符合预期。`mutex` 类型让我们能够加锁。对于任何其他想要 `Lock()` 互斥锁 (`mu`) 的 Goroutine，我们必须等待直到另一个\
    \ Goroutine `Unlock()` 互斥锁 (`mu`)。\n\n# Go 语言中的单例模式 - `Once.Do`\n\n总结单例的概念——它是确保特定类型仅创建单个实例的最知名设计模式之一。在许多其他编程语言中，存在各种模式来实现这一点，同时保持线程安全。在\
    \ Go 中，利用 `sync` 包中的 `Once` 类型，实现此模式非常容易。\n\n```go\ntype cache struct{}\n\nvar\
    \ cacheSingleton *cache\nvar once sync.Once\n\nfunc main() {\n\tGetCache()\n\t\
    GetCache()\n\tGetCache()\n}\n\nfunc GetCache() *cache {\n\tonce.Do(func() {\n\t\
    \tprintln(\"Creating singleton object\")\n\t\tcacheSingleton = &cache{}\n\t})\n\
    \treturn cacheSingleton\n}\n```\n\n该程序的输出是 - `Creating singleton object`。仅此而已（不是三次）。\n\
    \n`Do` 函数接收一个函数作为参数。`Do` 函数确保内部函数**恰好执行一次**，这正是我们在编写单例时想要实现的。`Do` 也是 `Once` 类型上唯一存在的函数。\n\
    \n# 底层例程\n\n`sync` 包中还有其他我们可以使用的底层例程，本章不再详述：\n\n1.  `sync.Map`：与 Go 中的普通 map 目的相同，但可安全地跨多个\
    \ Goroutine 并发访问。\n2.  `sync/atomic`：管理跨多个 Goroutine 的共享计数器状态。\n3.  `sync.Pool`：自管理的临时对象池——这是为了辅助垃圾回收器的工作。\n\
    \n# 发布/订阅\n\n发布-订阅是最知名的模式之一。Pub/Sub 模式是一种消息传递模式，帮助我们在系统/服务/对象之间进行通信。它通过所谓的主题从发布者广播数据/消息。每个订阅者被分配到一个特定主题，并且每个订阅者都会接收到与其分配主题相关的所有消息。\n\
    \n![Figure 5.4: Publish-Subscribe pattern](img/Figure-5.4.jpg)\n\n```go\ntype\
    \ PubSub struct {\n\tsubscribers map[string][]chan interface{}\n}\n\nfunc NewPubSub()\
    \ *PubSub {\n\treturn &PubSub{\n\t\tsubscribers: make(map[string][]chan interface{}),\n\
    \t}\n}\n\nfunc (ps *PubSub) Publish(topic string, item interface{}) {\n\tfor _,\
    \ ch := range ps.subscribers[topic] {\n\t\tch <- item\n\t}\n}\n\nfunc (ps *PubSub)\
    \ Subscribe(topic string) <-chan interface{} {\n\tch := make(chan interface{})\n\
    \tps.subscribers[topic] = append(ps.subscribers[topic], ch)\n\treturn ch\n}\n\n\
    func main() {\n\tps := NewPubSub()\n\tch := ps.Subscribe(\"t1\")\n\tgo ps.Publish(\"\
    t1\", \"hello\")\n\titem := <-ch\n\tprintln(item.(string))\n}\n```\n\n这是 Go 语言中发布-订阅模式的一个简单实现。请注意，这个示例并不完美——我们没有关闭通道，也没有正确处理并发。实现此模式时，建议使用现有的库。\n\
    \n"
