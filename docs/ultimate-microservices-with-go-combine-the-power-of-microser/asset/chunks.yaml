- raw: 'Pub/Sub is a pattern in microservices architecture. When building microservices
    architecture, each service works independently and decouples from one another,
    which is precisely what the Pub/Sub pattern aims to do. It allows writing each
    subscriber independently without changing the publisher code to get his data.
    He just needs to assign himself to an existing topic. Numerous advantages of microservices
    architecture are reflected in this pattern. One major example is the scalability
    of the services that become seamless while using Pub/Sub.


    More advanced Pub/Sub usage allows several more capabilities such as scheduled
    processes, delays, workflows, and so on. Here are some real-life examples of using
    Pub/Sub:


    *   Broadcast of event data


    *   Real-time notifications


    *   Distributed caching


    *   Live location tracking


    Note that to use Pub/Sub between services in microservices architecture, we need
    to use a third service that manages the topics, publishers, and subscribers. Familiar
    technologies for Pub/Sub can be found as a service in all the biggest cloud vendors
    or open-source projects like Redis.


    Many people tend to confuse Pub/Sub to Message Broker. Let’s see the difference
    between them in a nutshell.


    | **PubSub** || **Message Broker** |


    | --- | --- |


    | Like broadcast - single message copies to many subscribers || Unicast - single
    message to a single consumer |


    | Publisher and Subscriber || Publisher and Consumer |


    | Ideal for broadcasting || Ideal for task delegation |


    | More susceptible to message loss || More resilient and have better reliability
    |


    | No FIFO capability || Have FIFO capability - to keep order |


    **Table 5.1:** Comparison between PubSub and Message Broker


    We will discuss message brokers more in detail in *[Chapter 7, Building RESTful
    API](#c07.xhtml)*.


    # [Channel Closing Principle](#toc.xhtml#s98a)


    We already mentioned the channel closing principle in a nutshell. However, it
    is so important that we need to discuss it again. The simple principle says we
    must close a channel from the sender goroutine if this is a single sender. We
    shouldn’t close channels from the receiver side and shouldn’t close channels from
    the sender side if we have several senders.


    Although the principle is there are scenarios where we need to close the channel
    from multiple senders. In that scenario, we must perform a graceful close if we
    have multiple senders and need to close the channel.


    `func main() {`


    `ch := make(chan int)`


    `wg := &sync.WaitGroup{}`


    `wg.Add(10)`


    `for i := 0; i < 10; i++ {`


    `go Sender(ch, wg, i)`


    `}`


    `go func() {`


    `wg.Wait()`


    `close(ch) // graceful close`


    `}()`


    `// receiver`


    `for i := range ch {`


    `println(i)`


    `}`


    `}`


    `func Sender(ch chan<- int, wg *sync.WaitGroup, i int) {`


    `defer wg.Done()`


    `ch <- i`


    `}`


    In the preceding example, we can observe a graceful channel close with multiple
    sender goroutines.


    # [Avoiding Goroutine Leak](#toc.xhtml#s99a)


    Until now, we have experienced all the good that goroutines offer. Unfortunately,
    there is a downside of goroutines - goroutine leak!


    A goroutine `leak` can happen when a sender goroutine is blocked until the receiver
    arrives at the channel and vice versa. Meanwhile, the blocked goroutine never
    gets unblocked.


    `func leak(ch chan int) {`


    `data := <-ch`


    `fmt.Println(data)`


    `}`


    `func main() {`


    `ch := make(chan int)`


    `go leak(ch)`


    `}`


    Let’s take a look at the preceding example; how is that a leak? It is a goroutine
    leak because we don’t have a receiver! The `leak` function is stuck forever.


    There are two common situations where goroutines can occur:


    *   Forgotten sender


    *   Abandoned receiver


    # [Forgotten Sender](#toc.xhtml#s100a)


    This is a scenario where a sender goroutine is being “`forgotten`” and tries to
    send data via a channel. However, there is no receiver on the other side.


    `func forgottenSender(ch chan int) {`


    `data := 3`


    `// This is blocked as no one is receiving the data`


    `ch <- data`


    `}`


    `func main() {`


    `ch := make(chan int)`


    `go forgottenSender(ch)`


    `println(runtime.NumGoroutine()) // 2 instead of 1`


    `}`


    The `forgottenSender` function will keep running within a goroutine forever. In
    this example, we must use a buffered channel to avoid a goroutine leak so the
    `forgottenSender` could finish its work.


    `func forgottenSender(ch chan int) {`


    `data := 3`


    `// This is blocked as no one is receiving the data`


    `ch <- data`


    `}`


    `func main() {`


    `ch := make(chan int, 1) // avoid goroutine leak by using buffered channel`


    `go forgottenSender(ch)`


    `}`


    It isn’t always outward that there is a goroutine leak. We can see many scenarios
    where error handling can cause unintentional goroutine leaks.


    `func networkCall() int {`


    `return 1`


    `}`


    `func anotherAction() error {`


    `return errors.New(“data is invalid! Returning”)`


    `}`


    `func forgottenSender(ch chan int) {`


    `data := networkCall()`


    `ch <- data`


    `}`


    `func handler() error {`


    `ch := make(chan int)`


    `go forgottenSender(ch)`


    `err := anotherAction()`


    `if err != nil {`


    `return err`


    `}`


    `data := <-ch`


    `fmt.Println(data)`


    `return nil`


    `}`


    Everything will be fine if we eliminate the section where the `anotherAction`
    function is being called. Unfortunately, let’s assume that this code block is
    necessary. We have a goroutine leak because the `forgottenSender` function keeps
    running in the background while the handler function returns an error, and now
    that function has done its work. To solve this situation, we must run the receiver
    in a goroutine before calling the `anotherAction` function or use a buffered channel.


    Akin to the error handling use case, it can also happen when we use a select case
    for multiple channels.


    `func networkCall() int {`


    `time.Sleep(3 * time.Second)`


    `return 1`


    `}`


    `func forgottenSender(ch chan int) {`


    `data := networkCall()`


    `ch <- data`


    `}`


    `func handler() error {`


    `ctx, cancel := context.WithTimeout(context.Background(), 10*time.Millisecond)`


    `defer cancel()`


    `ch := make(chan int)`


    `go forgottenSender(ch)`


    `for {`


    `select {`


    `case data := <-ch:`


    `fmt.Printf(“received data! %d\n”, data)`


    `return nil`


    `case <-ctx.Done():`


    `return errors.New(“timeout! Process canceled. Returning”)`


    `}`


    `}`


    `}`


    We have the same problem: the handler function finishes its work before the network
    call is done (the timeout for 10 milliseconds is lower than 3 seconds). The `forgottenSender`
    function is stuck and doesn’t have a receiver on the other side, which leads to
    a goroutine leak. We can solve this goroutine leak by using a buffered channel.


    When we use buffered channels, it unblocks the goroutine, then the GC notices
    that no one is using the channel `ch` and cleans it from memory.


    # [Abandoned Receiver](#toc.xhtml#s101a)


    This is a scenario where a sender sends data, but the sender never notifies the
    receiver that he needs to stop receiving data.


    `func abandonedReceiver(ch chan string) {`


    `for data := range ch {`


    `println(data)`


    `}`


    `println(“Worker is done”)`


    `}`


    `func sender(ch chan string) {`


    `for _, data := range []string{“one”, “two”, “three”} {`


    `ch <- data`


    `}`


    `}`


    `func handler() {`


    `ch := make(chan string, 3)`


    `sender(ch)`


    `go abandonedReceiver(ch)`


    `}`


    `func main() {`


    `handler()`


    `time.Sleep(1 * time.Second)`


    `println(runtime.NumGoroutine()) // 2 instead of 1`


    `}`


    As we can see, the `abandonedReceiver` function will keep running forever. The
    output of the current program will look like this:


    `one`


    `two`


    `three`


    The line “`Worker is done”` will never be printed because the `abandonedReceiver`
    is blocked on the range for a loop — which causes a goroutine leak. To solve it,
    we need to close the channel after the sender finishes his job, as we already
    saw in the section on closing a channel.


    `func sender(ch chan string) {`


    `for _, data := range []string{“one”, “two”, “three”} {`


    `ch <- data`


    `}`


    `close(ch) // solve the goroutine leak`


    `}`


    # [Detecting Goroutine Leak](#toc.xhtml#s102a)'
