    The preceding YAML example illustrates Deployment YAML using a readiness probe
    to check if the container is healthy and a liveness probe to check the status
    of the container if it is working as expected.


    There are various ways to define probes. It can be a request to a specific endpoint
    using HTTP, TCP socket, shell command, and so on. An HTTP GET request is the most
    common use case (like the example).


    Developers need to configure and write the probes themselves because we are the
    only ones who can determine when the application can accept traffic and when it
    needs to be restarted.


    # [Resources Allocations](#toc.xhtml#s190a)


    When specifying Pods in Kubernetes or Pods within workloads, we can optionally
    specify how many resources we can allocate to the container. The standard and
    frequent resources allocated are CPU and memory, but there are more. We can specify
    two parameters for resource allocation - `request` and `limit`.


    *   `Request`**:** When defining resource `requests`, the scheduler uses that
    to decide which node to place a Pod. The `request` is resource usage expectations.


    *   `Limit`**:** When defining resource limit, the `kubelet` (“node agent”) enforces
    the `limit` and doesn’t let the container pass those `limits`. If the CPU reaches
    the `limit`, the container will be throttled; if the memory reaches the `limit`,
    the Pod the container runs on will be killed and restarted.


    It is crucial to be on top of the resources we allocate. Without proper allocation,
    Pods can do whatever they want. For example, our application can have memory leaks
    and consume tons of memory, affecting the other Pods on the Node or the entire
    cluster. Another example from the other side is that small memory allocation can
    limit our application from operating correctly. As developers, we are responsible
    for determining the amount of resources our containers need.


    Here is an example of Pod YAML starting a container named `hello` with `requests`
    and `limits` of CPU and memory:


    `apiVersion: v1`


    `kind: Pod`


    `metadata:`


    `name: example`


    `spec:`


    `containers:`


    `- name: hello`


    `image: hello-world:latest`


    `resources:`


    `requests:`


    `memory: “128Mi”`


    `cpu: “250m”`


    `limits:`


    `memory: “256Mi”`


    `cpu: “1”`


    # [Kubernetes Best Practices](#toc.xhtml#s191a)


    The following four best practices are more relevant to Kubernetes developers.
    Several other best practices are more relevant to operations. A book recommended
    for more detailed best practices in Kubernetes is *Kubernetes Patterns*. There
    is a link to it in the references. These patterns aren’t taken from this book.


    # [Maintaining Good YAML Hygiene](#toc.xhtml#s192a)


    YAMLs are everything when it comes to Kubernetes. YAMLs are the desired state
    in Kubernetes. As users, we define them, and Kubernetes does all the other work
    for us. It strives to transform the current state to the desired state (the YAML
    file). With that understanding, the YAML must answer the following requirements:


    *   **Neat and Clean:** It doesn’t contain any configuration we don’t need or
    want. Also, we need to avoid declaring default configurations in YAML files.


    *   **Labels and Annotations:** Those two terms are metadata related to the YAML
    resource. Annotations are used for arbitrary metadata, and labels are used to
    identify resources in Kubernetes. This is a vast topic in Kubernetes, but we won’t
    discuss it here. We need to leverage the usage of those two metadata in each YAML
    file.


    *   **For Workloads**: Specify **liveness and readiness probes**, as we mentioned
    earlier.


    *   **ConfigMaps and Secrets Must be Adequately Configured:** Never redeclare
    a key value already declared in an existing ConfigMap or Secret.


    # [Logging — Specifically for Kubernetes](#toc.xhtml#s193a)


    There are slight differences in how we use logs in Kubernetes compared to how
    we use them in other systems. To avoid mistakes, we must tag and label logs properly
    by including:


    *   **Proper service name**: Not the Pod name! We must include the service name
    in the log so we’ll be able to correlate logs to the same service. A common mistake
    is that logs only include the instance name (Pod name in the case of Kubernetes)
    instead of the service name.


    *   **Version**: To determine when things changed in which version, we must specify
    the service version on each log. By doing so, we can see and observe the lifecycle
    of our service. For example, a log of errors started occurring only in version
    1.3.2, which means that a bug was started in this version.


    *   **Cluster environment information**: Any data that might affect the behavior
    of our application. Sometimes, our service isn’t guilty of having an issue or
    error. The cluster or Node might be responsible for that issue. For example, logging
    the Node name can be very useful.


    # [Environments Management](#toc.xhtml#s194a)


    In any system, we’ll have different environments for different reasons. Production
    environment, staging environment (sometimes called pre-production), testing environment,
    local environment, and so on. There are two approaches to separating environments
    in Kubernetes:


    *   **Different clusters for each environment**: The main advantage of this approach
    is that the environments are decoupled and don’t have dependencies between them.
    Its main disadvantage is that it takes much more effort to set up a different
    cluster for each environment and much more effort to maintain several clusters.


    *   **Different namespaces for each environment**: This approach has the opposite
    advantages and disadvantages of the previous approach. While there are dependencies
    between the environments (Pods from different environments can be allocated on
    the same Node, for example), it takes much less effort to set up and maintain.


    # [Proper Monitoring](#toc.xhtml#s195a)


    In addition to the regular monitoring we as developers tend to put on services,
    there is monitoring relevant for services running on Kubernetes. Here are three
    significant things to monitor:


    *   **Resources**: Monitor the usage of CPU, memory, and storage. It is essential
    to monitor these resources to optimize service performance, identify bottlenecks,
    and ensure efficient resource allocation.


    *   **Containers Status**: Monitor whether the containers are down/up/errors/probes/restart
    count, and so on. These metrics are essential to ensure reliability and the health
    of the services. Furthermore, they help detect issues, facilitate troubleshooting,
    and contribute to more stable and resilient services.


    *   **Kubernetes Events**: Kubernetes audits the actions he takes through events.
    Kubernetes events are drawing the history of the cluster. By monitoring Kubernetes
    events, we can detect trends, problems, and anomalies and gain many insights by
    looking at the events.


    # [Conclusion](#toc.xhtml#s196a)


    In this chapter, we went through the basics of Kubernetes and focused on the resources
    and actions more relevant to developers, not the operation side. We covered the
    three basic terms in Kubernetes - Node, Pod, and Namespace. These terms give the
    base for understanding other resources in Kubernetes. We learned about Kubernetes
    workloads - Deployment, DaemonSet, StatefulSet, Jon, and CronJob. As developers,
    we must choose the right workload resource for a service. After that, we covered
    common Kubernetes resources we’ll probably encounter while working with Kubernetes
    - ConfigMap, Secret, HPA, and Ingress.


    Then, we discussed two major Kubernetes concepts pertinent to developers. The
    first was readiness and liveness probes, which ensure our service is ready to
    work (accepting traffic) and running properly. The second is resource allocation
    — we learned what needs to be specified when working with workloads (mainly requests
    and limits for CPU and memory).'
