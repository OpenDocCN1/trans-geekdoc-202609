    # 第 5 章\n\n# 释放 Go 语言的并发威力\n\n# 简介\n\n上一章深入探讨了 Go 语言中的核心主题及其基本原则。本章将聚焦并深入探讨最显著的支柱\
    \ —— 并发。Go 语言开发的核心动机之一，是为开发者提供一种简单便捷的方式来编写并发运行的代码。我们将涵盖 Go 并发相关的所有主题 —— Goroutine、Channel、原则、设计模式、并发陷阱（如\
    \ Goroutine 泄漏）等。并发旨在提供最优性能。良好的性能是任何架构类型的关键指标，尤其是微服务。\n\n在《第 2 章 Go 的易用性》中，我们讨论了\
    \ goroutine 和调度器的工作原理。本章将在此基础上继续详述 goroutine。在深入 Go 并发之前，让我们先澄清三个容易混淆的术语：\n\n\
    *   并发\n*   并行\n*   异步\n\n**并发** 是指多个任务的执行被交错进行，而非按顺序依次执行。\n\n**并行** 是指这些任务实际上在同时执行。\n\
    \n![](OEBPS/images/Figure-5.1.jpg)\n\n**图 5.1：** 并发与并行对比\n\n**异步** 是一个独立的概念（尽管在某些语境下相关）。一个事件发生的时间可能与另一个事件不同步（非同步）。下图展示了同步执行与异步执行的区别，其中参与者可以对应其他线程、进程甚至服务器。\n\
    \n![](OEBPS/images/Figure-5.2.jpg)\n\n**图 5.2：** 同步过程\n\n![](OEBPS/images/Figure-5.3.jpg)\n\
    \n**图 5.3：** 异步过程\n\n必须注意这些区别，因为本章将讨论 Go 中的并发。\n\n# 结构\n\n本章将讨论以下主题：\n\n*   Goroutine\n\
    *   Channel —— 有缓冲 vs 无缓冲\n*   `Sync` 包\n*   发布/订阅\n*   Channel 关闭原则\n*   避免 Goroutine\
    \ 泄漏\n*   Fan In Fan Out 模式\n\n# Goroutine\n"
  trans: "\n微服务因其固有设计而具有简单、自包含的特点。遵循适配器设计模式，我们应通过封装 HTTP 客户端来实现服务间通信的封装。关于该设计模式的参考资料请见“参考文献”部分。\n\
    \n在创建与其他服务通信的自定义客户端（封装后的客户端）时，我们应尽量将这些客户端创建为结构体（`struct`）。这些结构体必须实现一个接口。关于在微服务中使用客户端接口，有两种最佳实践：\n\
    \n*   每个服务客户端拥有自己的接口 —— 灵活性更高，但工作量更大。\n*   所有服务共享一个通用接口 —— 灵活性较低，但工作量较少。\n\n无论选择哪种方案，引入接口的原因都是为了具备模拟客户端响应的能力，正如前文（“模拟”）所述。我们希望在单个服务的测试范围内模拟客户端响应。\n\
    \n一种更强大的测试类型是服务间测试。虽然它功能更强，但也需要投入大量时间和精力。关于此类服务间测试存在无数理论。核心在于正确设置这些测试的 `Setup`\
    \ 和 `Teardown`，同时确保测试的可复现性。通常，这类测试在敏捷性方面容易变得不稳定。我们应致力于使用本章介绍的 `Functional Options\
    \ Pattern`。在最佳场景下，`Setup` 函数应表现为定义多个 `Options`（基本上即配置）。\n\nGo 语言在构建微服务架构时提供了两个相关的高效工具：\n\
    \n*   性能基准测试\n*   竞态检测器\n\n# 性能基准测试\n\n基准测试是测试 CLI 的内置选项。它有助于我们测试函数的性能。基准测试是一种强大的方法论，帮助我们实现良好的性能。构建微服务时它甚至更强大，因为我们可以在特定端点变慢时进行调查。让我们看看如何执行基准测试。\n\
    \n```\nfunc Fib(n int) int {\n    if n < 2 {\n        return n\n    }\n    return\
    \ Fib(n-1) + Fib(n-2)\n}\n```\n\n我们想要查看该函数在大输入下的性能表现。我们需要创建一个以 `Benchmark` 为前缀、签名为\
    \ `(b *testing.B)` 的测试函数，测试代码如下：\n\n```\nfunc BenchmarkFib(b *testing.B) {\n \
    \   for n := 0; n < b.N; n++ {\n        Fib(20)\n    }\n}\n```\n\n运行基准测试需使用 Go\
    \ CLI，命令如下：\n\n`go test -bench=.`\n\n还有多种运行基准测试的配置可供探索。\n\n# 竞态检测器\n\nGo CLI 内置选项可用于检测竞态条件。竞态条件是微服务系统中常见的情况。此外，由于\
    \ Go 的并发模型，竞态条件很容易发生。竞态检测器可针对可执行程序或测试运行。让我们看一个针对简单情况运行竞态检测器的示例：\n\n```\nfunc main()\
    \ {\n    i := 0\n    go func() {\n        i++\n    }()\n    fmt.Println(i)\n}\n\
    ```\n\n在上述示例中，函数第二行启动了一个 goroutine。当我们打印 `i` 时，可能得到两种结果：`0` 或 `1`。原因是存在竞态条件。我们无法确定\
    \ goroutine 是否会在 `Println` 调用前执行完毕，因为它们是并行运行的。运行竞态检测器的命令为：\n\n`go run -race race-detector.go`\n\
    \n我们将得到如下警告：\n\n```\n==================\nWARNING: DATA RACE\nWrite at 0x00c00011a028\
    \ by goroutine 6:\nmain.main.func1()\n  /Users/nirshtein/Documents/GitHub/Microservices-with-Go/chapter-5/race-detector/race-detector.go:8\
    \ +0x3c\nPrevious read at 0x00c00011a028 by main goroutine:\nmain.main()\n  /Users/nirshtein/Documents/GitHub/Microservices-with-Go/chapter-5/race-detector/race-detector.go:10\
    \ +0xa8\nGoroutine 6 (running) created at:\nmain.main()\n  /Users/nirshtein/Documents/GitHub/Microservices-with-Go/chapter-5/race-detector/race-detector.go:7\
    \ +0x9c\n==================\nFound 1 data race(s)\nexit status 66\n```\n\n该警告明确无误。建议探索\
    \ Go 中检测竞态条件的各种配置。后续章节将讨论解决这些竞态条件的技术。\n\n# 总结\n\n本章讨论了语言的核心支柱。每个主题的深度远超我们的探讨范围。我们鼓励您继续深入探索这些支柱。本章的参考文献是极佳的起点。\n\
    \n下一章将讨论语言的主要支柱之一 —— 并发！\n\n# 参考文献\n\n*   [`refactoring.guru/design-patterns/go`](https://refactoring.guru/design-patterns/go)\n\
    *   [`go.dev/blog/errors-are-values`](https://go.dev/blog/errors-are-values)\n\
    *   [`github.com/brianvoe/gofakeit`](https://github.com/brianvoe/gofakeit)\n*\
    \   [`go.dev/security/fuzz/`](https://go.dev/security/fuzz/)\n*   [`refactoring.guru/design-patterns/adapter/go/example`](https://refactoring.guru/design-patterns/adapter/go/example)\n\
    *   [`pkg.go.dev/testing#hdr-Benchmarks`](https://pkg.go.dev/testing#hdr-Benchmarks)\n\
    *   [`go.dev/blog/race-detector`](https://go.dev/blog/race-detector)\n\n# 第 5\
    \ 章\n\n# 释放 Go 语言的并发威力\n\n# 简介\n\n上一章深入探讨了 Go 语言中的核心主题及其基本原则。本章将聚焦并深入探讨最显著的支柱\
    \ —— 并发。Go 语言开发的核心动机之一，是为开发者提供一种简单便捷的方式来编写并发运行的代码。我们将涵盖 Go 并发相关的所有主题 —— Goroutine、Channel、原则、设计模式、并发陷阱（如\
    \ Goroutine 泄漏）等。并发旨在提供最优性能。良好的性能是任何架构类型的关键指标，尤其是微服务。\n\n在《第 2 章 Go 的易用性》中，我们讨论了\
    \ goroutine 和调度器的工作原理。本章将在此基础上继续详述 goroutine。在深入 Go 并发之前，让我们先澄清三个容易混淆的术语：\n\n\
    *   并发\n*   并行\n*   异步\n\n**并发** 是指多个任务的执行被交错进行，而非按顺序依次执行。\n\n**并行** 是指这些任务实际上在同时执行。\n\
    \n![](img/Figure-5.1.jpg)\n\n**图 5.1：** 并发与并行对比\n\n**异步** 是一个独立的概念（尽管在某些语境下相关）。一个事件发生的时间可能与另一个事件不同步（非同步）。下图展示了同步执行与异步执行的区别，其中参与者可以对应其他线程、进程甚至服务器。\n\
    \n![](img/Figure-5.2.jpg)\n\n**图 5.2：** 同步过程\n\n![](img/Figure-5.3.jpg)\n\n**图\
    \ 5.3：** 异步过程\n\n必须注意这些区别，因为本章将讨论 Go 中的并发。\n\n# 结构\n\n本章将讨论以下主题：\n\n*   Goroutine\n\
    *   Channel —— 有缓冲 vs 无缓冲\n*   `Sync` 包\n*   发布/订阅\n*   Channel 关闭原则\n*   避免 Goroutine\
    \ 泄漏\n*   Fan In Fan Out 模式\n\n# Goroutine\n"
