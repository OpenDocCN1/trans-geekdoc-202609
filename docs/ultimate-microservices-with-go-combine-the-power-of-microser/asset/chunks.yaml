- raw: '*   **Avoid using** `Background()`: We should aim to start a new context from
    the parent context and not use the `context.Background()`. We don’t want to break
    the current lifecycle and start a new one. We usually use this function at the
    start of a program.


    *   **Concurrency best practices**: Will be discussed in the next chapters.


    *   **Pass context explicitly**: We should strive to pass it as an argument between
    functions and not use it as a global variable.


    *   **Prefer Cancel over Timeout**: We always strive to use manual cancellation
    rather than automatic cancellation. Manual vs. automatic cancellation is the difference
    between `context.WithCancel` and `context.WithTimeout`.


    All of these best practices lead us to perform propagation of context.


    Context propagation involves consistently transferring contextual information,
    typically through function arguments, to maintain relevant data throughout the
    execution of a program or system. Context propagation ensures the seamless flow
    of contextual details across different parts of the code.


    We must avoid global environment variables or repeatedly passing the same field
    or struct through many functions. Context propagation creates a hierarchy between
    the different logics in the code. For instance, if we process an event, this event
    triggers several other child events. The child events need all the key-value items
    from the parent context, but each child event requires a different timeout. This
    example proves that hierarchy is crucial.


    ![](OEBPS/images/Figure-4.1.jpg)


    **Figure 4.1:** Context propagation


    This hierarchy helps us to control the lifecycles error handling between goroutines.


    As discussed, the Go team invented the language intended to run on the cloud.
    With that thought in mind, context is critical here. When working in a cloud environment,
    communication between services is often. It becomes more often in Microservices’
    architecture.


    In Microservices architecture, each service relies upon dependencies from others
    or third-party services. Propagation of context is essential to transfer this
    information, which can be authentication and authorization data, observability
    data (tracing, logs), request metadata, and so on.


    # [Errors — Talking About Error Propagation](#toc.xhtml#s70a)


    Error handling is critical and essential to any programming language. This section
    will discuss the usage and implementation of error handling using Golang.


    Error handling in Go is essential, particularly when developing code within a
    microservices’ architecture. Why is that?


    When we encounter bugs (which will happen a lot), we must prepare and set the
    proper infrastructure to investigate the bug. The most annoying thing is to be
    blind when investigating a bug. The best preparation we can do while writing code
    is to perform satisfying error handling.


    Sometimes, an error can be propagated between many services — for example, a service
    calling an internal API that fails (because of its internal reason). At first
    look, the bug is in the service, but actually, the bug is the API. We can understand
    it quickly if the error handling is done right!


    The default error value in Go is `nil, error` is a type in Go. There are three
    ways to create an error type in Go:


    The first way is to use the `fmt` package like this:


    `err := fmt.Errorf(“a height of %0.2f is invalid”, -2.3333)`


    `fmt.Println(err.Error()) // a height of -2.33 is invalid`


    The example is straightforward. For struct to be an error type, it must include
    a method on the `error` type, which has a signature of - `Error().` This function
    returns the error as a string. Notice to use it only when you know the error isn’t
    nil. Otherwise, it will panic. The second way to create an error in Go is to use
    the `errors` package like this:


    `err = errors.New(“this is an invalid height”)`


    `fmt.Println(err.Error()) // this is an invalid height`


    It has the same effect as the first example but is leaner. There are sensations
    where it is a convention to use this style rather than the first one. We will
    elaborate on that convention in the following sections. The third way to create
    an error in Go is through a custom error type. We would need to declare a struct,
    and this struct should have a method called `Error()` that returns a string. Let’s
    observe an example:


    `type ApiError struct {`


    `Path       string`


    `StatusCode int`


    `}`


    `func (e *ApiError) Error() string {`


    `return fmt.Sprintf(“API error: %s returned a %d”, e.Path, e.StatusCode)`


    `}`


    `func main() {`


    `err = &ApiError{Path: “/api/users”, StatusCode: 500}`


    `fmt.Println(err.Error()) // API error: /api/users returned a 500`


    `}`


    Error handling is a vast topic, and we will not cover this topic in detail. Instead,
    we will focus on the following:


    *   Why error handling in Go differs from other languages


    *   Errors are here to tell a story


    *   Conventions


    If you want to explore error handling, there is an excellent article about Rob
    Pike about error handling, which is attached in the references.


    In the second chapter, Usability of Go, we elaborated on the mentioned sections.
    These sections are just a reminder. Note that we won’t talk here about panic and
    recovery; instead, we will talk about them in the following chapters.


    # [Error Handling: Difference between Go and Other Languages](#toc.xhtml#s71a)


    Error handling in Go is different. The Go team took a different approach regarding
    that. Most of the languages include `try-catch-finally`. Errors will eventually
    happen, as we all know. Sooner or later, we must consider how we will handle them.
    Due to excellent error handling, developers can’t forget to handle the error and
    return the precise error message.


    Usually, many error messages in other programming languages get swallowed between
    heaps of `try-catch`. Go gives us a very convenient way to do multi-value returns,
    which makes our lives easier to return errors properly.


    # [Errors are Here to Tell a Story](#toc.xhtml#s72a)


    In *[Chapter 2, Usability of Go](#c02.xhtml)*, we talked about “*telling a story*”
    using errors in Go. Telling a story becomes a force multiplier when we speak in
    the context of microservices. Because a story of a single service might be simple,
    but the story of an error across many services will be much more complex. We can
    resolve it by using tracing between services. We will talk more in detail about
    tracing in *[Chapter 9, Deploying to Production](#c09.xhtml)*. In short, tracing
    is the tracking code between services and errors in particular.


    # [Conventions](#toc.xhtml#s73a)


    We took this conventions table from the Uber-Go convention, and it describes very
    well the conventions around the guidance on when to use this error and another.


    | **Error matching?** || **Error Message** || **Guidance** || **Description**
    |


    | --- | --- | --- | --- |


    | No || Static || errors.New || A function that creates a new error with the given
    message. |


    | No || Dynamic || fmt.Errorf || A function that generates formatted error messages
    |


    | Yes || Static || Top-level var with errors.New || Defines top-level variable
    with error message using errors.New |


    | Yes || Dynamic || Custom error type || Defining a custom error type |


    **Table 4.1:** Error handling conventions


    # [Testing - Best Practices, Mocking, and Fuzzy Tests](#toc.xhtml#s74a)


    One of the things we significantly love about Go is that the `testing` package
    is a core package maintained by the Go team. We encountered many other situations
    in other languages where we were frustrated to find the proper testing framework
    because there were so many of them, and each missed something. Our recommendation
    is to try to avoid using an external testing framework.


    This section will discuss what tests look like in Go, how they differ from other
    languages, and Go tests’ best practices.'
