- raw: 'Pod resources are the smallest deployable unit in Kubernetes. A Pod is a set
    of containers with shared volumes, environment, and context. We’ll probably not
    need to deploy a Pod alone; a Pod is usually part of the running workload. However,
    most investigations will be around the pod, describing it, getting its logs, or
    getting basic data about the Pod.


    ![](OEBPS/images/Figure-8.5.jpg)


    **Figure 8.5:** get pods while using wide output


    Describe a pod:


    `kubectl describe pods/nginx-deployment8-6dcf8bbd4c-459fx`


    Describe a pod is a typical command; it gives us many details regarding the Pod
    and the last events of the Pod. We can also use the `describe` command for any
    other resource in the following format –


    `kubectl describe <resource-kind>/<resource-name>`


    See the logs:


    `kubectl logs pods/frontend2`


    Like the `describe` command, we can use the `logs` command for each resource,
    but it is less valuable.


    # [Workload Management](#toc.xhtml#s178a)


    A workload is an application running on Kubernetes. The workload is a service
    in a microservices architecture. As we have already seen, deploying and managing
    service (workload) is challenging, complicated, and requires much work. Kubernetes
    provides solutions for deploying and managing service through workload resources.
    Here, we’ll present and explain about the built-in workload resources.


    # [Deployment](#toc.xhtml#s179a)


    Deployment is the most common workload in Kubernetes. Deployment is used to manage
    stateless services. Pods that are being managed by Deployment are volatile. When
    a pod is terminated (whether an issue or rollout causes it), the Deployment resource
    creates another new pod with a different name. Deployment uses a resource called
    ReplicaSet to manage the pods. Each time we release a new version (just applying
    new YAML), a new ReplicaSet is being created and is replacing the old ReplicaSet
    and old pods.


    `apiVersion: apps/v1`


    `kind: Deployment`


    `metadata:`


    `name: random-deployment`


    `spec:`


    `replicas: 3`


    `selector:`


    `matchLabels:`


    `app: random-app`


    `template:`


    `metadata:`


    `labels:`


    `app: random-app`


    `spec:`


    `containers:`


    `- name: random-container`


    `image: nginx:latest`


    `ports:`


    `- containerPort: 80`


    The preceding YAML is an example of minimal Deployment YAML in Kubernetes.


    # [DaemonSet](#toc.xhtml#s180a)


    DaemonSet is a workload that is suitable for running pods on nodes. The goal of
    DaemonSet is to provide facilities that are relevant to local nodes. For example,
    DaemonSet with one replica will schedule one pod on each node in the cluster.
    Use cases can be storage daemons, network-related daemons, logs aggregators, telemetry
    daemons, and others.


    # [StatefulSet](#toc.xhtml#s181a)


    StatefulSet is a workload resource designed for pods that require persistent state
    or unique identities. Unlike Deployment resources, where pods are interchangeable
    and ephemeral, StatefulSets ensure that pods are recreated with the same name
    and state after termination. StatefulSet provides a consistent volume that the
    pods can attach to using other resources called PV (PersistentVolume) and PVC
    (PersistentVolumeClaim). Use cases for StatefulSet can be database services, messaging
    systems, and so on.


    # [Job](#toc.xhtml#s182a)


    Job resource allows us to define a task that can run until it is completed. It’s
    as simple as that. Jobs resources can be used, for example, for data processing.


    # [CronJob](#toc.xhtml#s183a)


    It is a way to run Job resource but with a cron scheduler wrapping it. Usage cases
    of CronJob resources can be maintenance tasks, scheduled backups, batch processing,
    and so on.


    `apiVersion: batch/v1beta1`


    `kind: CronJob`


    `metadata:`


    `name: random-cronjob`


    `spec:`


    `schedule: “*/5 * * * *” # Runs every 5 minutes`


    `jobTemplate:`


    `spec:`


    `template:`


    `metadata:`


    `labels:`


    `app: random-cronjob`


    `spec:`


    `containers:`


    `- name: random-container`


    `image: busybox`


    `command: [“echo”, “Hello from the cronjob!”]`


    `restartPolicy: OnFailure`


    In the preceding YAML example, we can see CronJob YAML; note that inside the CronJob
    YAML, we define a Job YAML and wrap it with a scheduler.


    # [Important Resources](#toc.xhtml#s184a)


    The following resources are common when using Kubernetes; we may encounter them
    as developers.


    # [ConfigMap](#toc.xhtml#s185a)


    ConfigMap is a resource that stores non-confidential data in key-value pairs.
    Pods can consume ConfigMap data through environment variables, arguments, or volumes.
    ConfigMap helps us achieve one of the elements of microservices: external configuration.
    Data that can be stored in ConfigMap includes app properties, connection strings,
    environment data, endpoints, and so on.


    `apiVersion: v1`


    `kind: ConfigMap`


    `metadata:`


    `name: random-configmap`


    `data:`


    `app_name: my-app`


    `database_url: “mongodb://localhost:27017”`


    The preceding YAML example describes ConfigMap.


    # [Secret](#toc.xhtml#s186a)


    Secret resources are just like ConfigMap resources, but store sensitive data instead
    of non-sensitive data. Data that can be stored in Secrets includes passwords,
    API keys, certificates, and so on.


    # [HPA](#toc.xhtml#s187a)


    HPA, which stands for Horizontal Pod Autoscaling, is a resource used to auto-scale
    workload resources (not suited for all workloads). Horizontal auto scaling means
    scaling is done by increasing or decreasing the number of replicas (Pods). The
    scaling is based on metrics (CPU or memory) and their desired values. In HPA configuration,
    there are minimum and maximum pod amounts. We will often use HPA for services
    on a dynamic scale and a load that occasionally differs.


    # [Ingress](#toc.xhtml#s188a)


    *“Ingress exposes HTTP and HTTPS routes from outside the cluster to services within
    the cluster. Traffic routing is controlled by rules defined on the Ingress resource.”*


    In the quote, the term “**services**” refers specifically to a Kubernetes resource
    named “**service**.” This resource is responsible for networking within the Kubernetes
    environment and should not be confused with the broader concept of services, especially
    in the context of microservices.


    ![](OEBPS/images/Figure-8.6.jpg)


    **Figure 8.6:** Ingress resource in Kubernetes


    This is the most complicated resource we’ll mention in this chapter. As developers,
    we’ll probably encounter Ingress only when we want to add a new route or change
    a route. Lastly, please note that the Ingress resource solves some of the significant
    concerns of API Gateway (core element in microservices architecture), such as
    load balancing, security, and high-level routing.


    # [Readiness and Liveness Probes](#toc.xhtml#s189a)


    In Kubernetes, a Pod receives traffic when all containers are running. Also, when
    Kubernetes detects that a Pod is crashing (due to exit code or other failures),
    it restarts it. These detections, whether a Pod is ready to receive traffic or
    needs to be restarted, are automatically resolved by Kubernetes. However, in some
    scenarios, we, as developers, will want to provide additional information for
    Kubernetes to perform those detections. For example, we can decide that a Pod
    can’t receive traffic until it establishes a connection to the DB. Another example
    can be when we wish to restart a pod if we figure that the Pod cache is invalid.
    The way to perform that manual detection is readiness and liveness probes.


    *   **Readiness probe**: Indicated whether the container is ready to accept traffic
    and requests.


    *   **Liveness probe**: Indicates whether the container is operated. If not, it
    needs to be killed and restarted.


    `apiVersion: apps/v1`


    `kind: Deployment`


    `metadata:`


    `name: web-app-deployment`


    `spec:`


    `replicas: 3`


    `selector:`


    `matchLabels:`


    `app: web-app`


    `template:`


    `metadata:`


    `labels:`


    `app: web-app`


    `spec:`


    `containers:`


    `- name: web-app-container`


    `image: nginx:latest`


    `ports:`


    `- containerPort: 80`


    `readinessProbe:`


    `httpGet:`


    `path: /healthz`


    `port: 80`


    `initialDelaySeconds: 5`


    `periodSeconds: 10`


    `livenessProbe:`'
