- raw: "This is the most straightforward way to perform rollout. It immediately kills\
    \ all the previous instances (Pods) and creates new instances (Pods) with the\
    \ new version. This technique is the fastest and most cost-effective way to perform\
    \ rollout, although it is highly vulnerable to outages and has the highest risk.\
    \ In Kubernetes, we can specify this technique to the workload by defining `.spec.strategy.type==Recreate`.\n\
    \n# [Rolling Update](#toc.xhtml#s216a)\n\nRolling Update allows the gradual rollout\
    \ of new versions. We control the transition dose between the old and the new\
    \ versions. Rolling Update starts new instances (Pods) of the new version and\
    \ transfers traffic to them before the old version is terminated.\n\n![](OEBPS/images/Figure-9.6.jpg)\n\
    \n**Figure 9.6:** Rolling Deployment\n\nTo implement this type of rollout in Kubernetes,\
    \ we need to specify the following configuration: `.spec.strategy.type==RollingUpdate`.\
    \ Things that can be adjusted while performing a rolling update supported in Kubernetes\
    \ can be:\n\n*   **Max Unavailable:** Maximum number of Pods that can be unavailable\
    \ during rollout. It can be an absolute number (5, for example) or a percentage\
    \ (70%).\n\n*   **Max Surge:** Maximum number of Pods that can be created above\
    \ the desired number (of Pods) defined in the workload. Like the previous configuration,\
    \ it can be an absolute number or percentage.\n\n# [Blue-Green Deployment](#toc.xhtml#s217a)\n\
    \nThis is the safest rollout technique, allowing the creation of the desired new\
    \ version with all the instances (Pods). By making a manual decision, the developer\
    \ can choose whether to route the network to the old version (blue in the following\
    \ figure) or the new version (green in the following figure).\n\n![](OEBPS/images/Figure-9.7.jpg)\n\
    \n**Figure 9.7:** Blue-Green Deployment\n\nThere aren’t built-in solutions to\
    \ run Blue-Green Deployment in Kubernetes. However, there are tools like ArgoCD\
    \ that allow us to do so. In general, Blue/Green Deployment refers to creating\
    \ all the desired software (even the entire system) and then deciding which version\
    \ to route all the network traffic. Although it is the safest way to perform rollout,\
    \ it is the least cost-effective technique and takes the maximum time.\n\n# [Multi-Service\
    \ Rollout](#toc.xhtml#s218a)\n\nThis rollout technique refers to rolling out from\
    \ the system point of view and not from a single service point of view. Using\
    \ Multi-Services Rollout, we’ll want to rollout several services together as a\
    \ single unit. We can use any technique that we mentioned before to perform Multi-Service\
    \ Rollout. Kubernetes doesn’t offer built-in capability to perform this technique.\
    \ However, Helm is one of the most popular native Kubernetes open-source tools\
    \ in the market, and it allows one to do so very quickly. Helm, an open-source\
    \ templating engine for Kubernetes used to manage charts, can aggregate several\
    \ Kubernetes resources and roll out all of them at once.\n\n# [Canary Deployment](#toc.xhtml#s219a)\n\
    \nCanary Deployment is a combination of Rolling Update and Blue-Green Deployment.\
    \ This technique allows us to perform a gradual rollout like the Rolling Update\
    \ technique, simultaneously routing traffic to both the old and the new versions.\
    \ Like the Blue-Green Deployment, the Canary Deployment allows us to observe the\
    \ two versions and manually decide whether to route all the traffic to the new\
    \ version or keep routing traffic to the previous version. Like Blue-Green Deployment,\
    \ it doesn’t have a built-in solution in Kubernetes, and we can use external tools\
    \ like ArgoCD.\n\n# [Rollbacks](#toc.xhtml#s220a)\n\nA new version often won’t\
    \ be as we expected and might cause several issues and failures. In such cases,\
    \ we wish to perform a Rollback. Rollback is reverting a system or application\
    \ to a previous state or version. In Kubernetes, there are two ways to perform\
    \ rollback:\n\n*   **Kubectl**: Each resource in Kubernetes has a revision, and\
    \ each time we roll out a new version, it creates a new revision. Here is how\
    \ we can perform rollback using `kubectl` for example: \n\n    `kubectl rollout\
    \ undo <kind>/<resource-name> --to-revision=<revision-number>`\n\n    `kubectl\
    \ rollout undo deployment/nginx-deployment --to-revision=2`\n\n*   **Helm**: Each\
    \ chart in Helm has reversion because it is a resource in Kubernetes. Here is\
    \ how we can perform rollback using Helm, for example: \n\n    `helm rollback\
    \ <RELEASE> [REVISION] [flags]`\n\n    `helm rollback frontend-services 13`\n\n\
    # [Conclusion](#toc.xhtml#s221a)\n\nIn this chapter, we explored the critical\
    \ steps necessary to prepare our applications and services for deployment to production.\
    \ From the initial code completion to ensuring that our service is production-ready,\
    \ we covered various topics, including CI/CD, design for failure, timeouts, retries,\
    \ fallback mechanisms, and security measures such as authentication and authorization.\n\
    \nWe delved into various deployment strategies, such as basic deployment, rolling\
    \ updates, blue-green deployment, canary deployment, and multi-service rollout,\
    \ each with its own advantages and considerations. Furthermore, we discussed the\
    \ importance of feature toggling as a technique to gradually introduce new features\
    \ and the concept of rollbacks to revert to a previous stable version in case\
    \ of unexpected issues.\n\nThrough practical examples, especially in the context\
    \ of Golang, we demonstrated how to implement these techniques effectively. By\
    \ understanding and applying these concepts, developers can ensure that their\
    \ services are delivered to production as anticipated and maintain their integrity\
    \ and reliability in the face of potential failures.\n\nAs we conclude this chapter,\
    \ it’s clear that deploying applications to production is a multifaceted process\
    \ that requires careful planning and execution. By adhering to best practices\
    \ and leveraging the tools and techniques discussed, developers can confidently\
    \ navigate the complexities of production deployment and ensure the success of\
    \ their services in the real world.\n\nIn *[Chapter 10, Next Steps in Production](#c10.xhtml)*,\
    \ we’ll cover what to consider while our application and service are already in\
    \ production.\n\n# [References](#toc.xhtml#s222a)\n\n*   [https://www.mabl.com/blog/what-is-cicd](https://www.mabl.com/blog/what-is-cicd)\n\
    \n*   [https://github.com/sony/gobreaker](https://github.com/sony/gobreaker)\n\
    \n*   [https://aws.amazon.com/blogs/containers/building-a-fault-tolerant-architecture-with-a-bulkhead-pattern-on-aws-app-mesh/](https://aws.amazon.com/blogs/containers/building-a-fault-tolerant-architecture-with-a-bulkhead-pattern-on-aws-app-mesh/)\n\
    \n*   [https://github.com/remeh/sizedwaitgroup](https://github.com/remeh/sizedwaitgroup)\n\
    \n*   [https://www.okta.com/identity-101/authentication/](https://www.okta.com/identity-101/authentication/)\n\
    \n*   [https://www.okta.com/identity-101/authentication-vs-authorization/](https://www.okta.com/identity-101/authentication-vs-authorization/)\n\
    \n*   [https://launchdarkly.com](https://launchdarkly.com)\n\n*   [https://codefresh.io/learn/software-deployment/](https://codefresh.io/learn/software-deployment/)\n\
    \n*   [https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#rolling-update-deployment](https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#rolling-update-deployment)\n\
    \n*   [https://argo-cd.readthedocs.io/en/stable/](https://argo-cd.readthedocs.io/en/stable/)\n\
    \n*   [https://github.com/helm/helm](https://github.com/helm/helm)\n\n# [CHAPTER\
    \ 10](#toc.xhtml#c10)\n\n# [Next Steps in Production](#toc.xhtml#c10)\n\n# [Introduction](#toc.xhtml#s223a)"
