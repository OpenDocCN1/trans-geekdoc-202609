    func generator(numbers []int) <-chan int {\n    out := make(chan int)\n    go\
    \ func() {\n        for _, num := range numbers {\n            out <- num\n  \
    \      }\n        close(out)\n    }()\n    return out\n}\n\nfunc businessLogic(num\
    \ int) int {\n    return num * 2\n}\n\nfunc main() {\n    data := []int{1, 2,\
    \ 3, 4, 5, 6}\n    var wg sync.WaitGroup\n    ch1 := generator(data[0:3])\n  \
    \  ch2 := generator(data[3:])\n    wg.Add(2)\n    go func() {\n        for num\
    \ := range ch1 {\n            println(businessLogic(num))\n        }\n       \
    \ wg.Done()\n    }()\n    go func() {\n        for num := range ch2 {\n      \
    \      println(businessLogic(num))\n        }\n        wg.Done()\n    }()\n  \
    \  wg.Wait()\n}\n```\n\nIn the preceding example, we have a `data` variable (the\
    \ source), but we want to parallelize the process of that data. We decided to\
    \ split the work among two workers. The first thing we did was to split the data\
    \ into two. Then, we called the `generator` function. The `generator` function’s\
    \ purpose is to accept input, send all the input into a channel called `out`,\
    \ and then return that channel. After calling the `generator` function twice,\
    \ we used `WaitGroup` to wait for all the workers to finish their work. Finally,\
    \ we executed two goroutines (workers). Each worker performed some business logic\
    \ and then finished.\n\n# Fan In\n\nWe should use the fan-in pattern to process\
    \ multiple inputs (sources) into a single function. We will do it by merging multiple\
    \ channels into one. The process of combining multiple channels into a single\
    \ channel is called multiplexing. The single channel will be closed only when\
    \ all the input channels will be closed. We will examine the multiplexing process\
    \ by a function called `merge`.\n\n```\nfunc merge(sourcesCh …<-chan int) <-chan\
    \ int {\n    var wg sync.WaitGroup\n    wg.Add(len(sourcesCh))\n    out := make(chan\
    \ int)\n    outputFunc := func(sourceCh <-chan int) {\n        for num := range\
    \ sourceCh {\n            out <- num\n        }\n        wg.Done()\n    }\n  \
    \  for _, sourceCh := range sourcesCh {\n        go outputFunc(sourceCh)\n   \
    \ }\n    go func() {\n        wg.Wait()\n        close(out)\n    }()\n    return\
    \ out\n}\n\nfunc generator(numbers []int) <-chan int {\n    out := make(chan int)\n\
    \    go func() {\n        for _, num := range numbers {\n            out <- num\n\
    \        }\n        close(out)\n    }()\n    return out\n}\n\nfunc main() {\n\
    \    data := []int{1, 2, 3, 4, 5, 6}\n    ch1 := generator(data[0:3])\n    ch2\
    \ := generator(data[3:])\n    ch := merge(ch1, ch2)\n    for num := range ch {\n\
    \        println(num)\n    }\n}\n```\n\nThe `generator` function is the same as\
    \ we saw in the example of the fan-out pattern. We first declare the single output\
    \ channel called `out` in the `merge` function. Second, we create a `WaitGroup`\
    \ to determine when all the multiple source channels are being closed. After they\
    \ are closed, we will use `Wait()` and close the output (`out`) channel. Then,\
    \ we created a function (`outputFunc`) that accepts the source channel and sends\
    \ all the data from that source channel to the output channel (`out`). Finally,\
    \ we iterate onto all the source channels and execute the goroutine, called the\
    \ `outputFunc`.\n\nWe now have a single channel to iterate safely in the `main`\
    \ function until the `merge` function closes the channel.\n\n# Conclusion\n\n\
    In this chapter, we talked in detail about concurrency in Go. It is one of the\
    \ most important topics in Go, and it is crucial to understand it well to write\
    \ code. In the previous two chapters, we discussed the Go basics topic to have\
    \ a deep knowledge of how Go works, which is imperative to build a microservices\
    \ architecture with Go. Throughout these chapters, we had a glimpse of how to\
    \ leverage Go knowledge into building microservices architecture.\n\nIn the next\
    \ chapter, we will go over the fundamentals elements for building microservices\
    \ architecture.\n\n# References\n\n*   [https://stackoverflow.com/questions/4844637/what-is-the-difference-between-concurrency-parallelism-and-asynchronous-methods#:~:text=Concurrency%20is%20when%20the%20execution,though%20related%20in%20some%20contexts](https://stackoverflow.com/questions/4844637/what-is-the-difference-between-concurrency-parallelism-and-asynchronous-methods#:~:text=Concurrency%20is%20when%20the%20execution,though%20related%20in%20some%20contexts)\n\
    *   [https://pkg.go.dev/sync](https://pkg.go.dev/sync)\n*   [https://pkg.go.dev/golang.org/x/sync/errgroup](https://pkg.go.dev/golang.org/x/sync/errgroup)\n\
    *   [https://www.uber.com/en-JO/blog/leakprof-featherlight-in-production-goroutine-leak-detection/#:~:text=A%20possible%20solution%20to%20prevent,a%20buffer%20size%20of%201](https://www.uber.com/en-JO/blog/leakprof-featherlight-in-production-goroutine-leak-detection/#:~:text=A%20possible%20solution%20to%20prevent,a%20buffer%20size%20of%201)\n\
    *   [https://github.com/uber-go/goleak](https://github.com/uber-go/goleak)\n\n\
    # CHAPTER 6\n\n# Core Elements of Microservices\n\n# Introduction\n\nAfter we\
    \ cover all the essential knowledge related to the Go programming language, we\
    \ will combine it with the core elements of microservices architecture. You are\
    \ probably asking yourself what are those “*core elements*”; microservices architecture\
    \ is an **approach**, not a destination. Therefore, the core elements are tech\
    \ industry methodologies, design patterns, and technologies. All of those elements\
    \ together will compose an entire system. There isn’t a recipe that tells us how\
    \ to physique out an architecture. There are many constraints, product requirements\
    \ (which can drag engineering requirements), and assumptions — each system has\
    \ its unique structure. However, all these systems have elements in common. This\
    \ chapter presents those elements, when they can become beneficial, their advantages/disadvantages,\
    \ and when to use/avoid them. We won’t be delving into every single element; instead,\
    \ the objective is to provide a framework outlining the boundaries of each element.\n\
    \nWe will not cover all the existing elements for microservices. Instead, we will\
    \ go through the leading ones. Here are elements we won’t cover in this chapter:\n\
    \n*   **Saga Pattern**: Allows us to manage distributed transactions in a microservices\
    \ architecture by breaking them into smaller, isolated steps, each with its compensating\
    \ transaction to handle potential failures.\n*   **Aggregator Pattern**: Reduces\
    \ data from multiple services to simplify the data for other services that wish\
    \ to pull it.\n*   **Decomposition Pattern**: Helps us break monolithic into microservices.\n"
  trans: "\n让我们强调这样一个事实：Goroutine 泄漏表现为内存泄漏。后台运行的 goroutine 持有变量，导致这些变量无法从内存中释放。检测\
    \ goroutine 泄漏主要有两种方法：\n\n*   **性能分析**：我们将在 *第 10 章，生产环境的下一步* 中更详细地讨论性能分析。通常，在进行性能分析和代码分析时，我们可以使用\
    \ Go 的 `pprof` 或 `gops` 来检查是否有未终止的 goroutine。\n\n*   **测试**：最好但也最费力的方法是编写能够揭示\
    \ goroutine 泄漏的单元测试。我们的目标是覆盖所有可能发生 goroutine 泄漏的场景。测试本质上会在测试结束时检查后台是否仍有 goroutine\
    \ 在运行。Go 允许我们使用 `runtime.NumGoroutine()` 查看后台运行了多少个 goroutine。我们也可以使用外部包，如 `uber-go/goleak`。\n\
    \n# Fan In Fan Out 模式\n\nFan In Fan Out 是一种流行的模式，它帮助我们将多个来源转换为单个流（fan-in），或将来自单个来源的输入流式传输到多个管道中（fan-out）。在\
    \ Go 中，如果我们需要多个函数从同一个通道读取数据直到该通道关闭 —— 即 fan-out。一个函数可以从多个输入（来源）读取数据，直到所有输入通道都关闭\
    \ —— 即 fan-in。\n\n# Fan Out\n\n当我们想要将工作分配给一组工作协程，以通过并行利用 CPU 和 I/O 等资源来进行优化时，应使用\
    \ fan-out 模式。\n\n```\nfunc generator(numbers []int) <-chan int {\n    out := make(chan\
    \ int)\n    go func() {\n        for _, num := range numbers {\n            out\
    \ <- num\n        }\n        close(out)\n    }()\n    return out\n}\n\nfunc businessLogic(num\
    \ int) int {\n    return num * 2\n}\n\nfunc main() {\n    data := []int{1, 2,\
    \ 3, 4, 5, 6}\n    var wg sync.WaitGroup\n    ch1 := generator(data[0:3])\n  \
    \  ch2 := generator(data[3:])\n    wg.Add(2)\n    go func() {\n        for num\
    \ := range ch1 {\n            println(businessLogic(num))\n        }\n       \
    \ wg.Done()\n    }()\n    go func() {\n        for num := range ch2 {\n      \
    \      println(businessLogic(num))\n        }\n        wg.Done()\n    }()\n  \
    \  wg.Wait()\n}\n```\n\n在前面的示例中，我们有一个 `data` 变量（来源），但我们想要并行化该数据的处理过程。我们决定将工作分配给两个工作协程。我们做的第一件事是将数据分成两份。然后，我们调用了\
    \ `generator` 函数。`generator` 函数的目的是接收输入，将所有输入发送到一个名为 `out` 的通道中，然后返回该通道。在两次调用\
    \ `generator` 函数后，我们使用了 `WaitGroup` 来等待所有工作协程完成工作。最后，我们启动了两个 goroutine（工作协程）。每个工作协程执行一些业务逻辑，然后结束。\n\
    \n# Fan In\n\n我们应该使用 fan-in 模式将多个输入（来源）处理汇总到单个函数中。我们将通过将多个通道合并为一个来实现这一点。将多个通道合并为单个通道的过程称为多路复用。只有当所有输入通道都关闭时，单个输出通道才会关闭。我们将通过一个名为\
    \ `merge` 的函数来研究多路复用过程。\n\n```\nfunc merge(sourcesCh …<-chan int) <-chan int {\n\
    \    var wg sync.WaitGroup\n    wg.Add(len(sourcesCh))\n    out := make(chan int)\n\
    \    outputFunc := func(sourceCh <-chan int) {\n        for num := range sourceCh\
    \ {\n            out <- num\n        }\n        wg.Done()\n    }\n    for _, sourceCh\
    \ := range sourcesCh {\n        go outputFunc(sourceCh)\n    }\n    go func()\
    \ {\n        wg.Wait()\n        close(out)\n    }()\n    return out\n}\n\nfunc\
    \ generator(numbers []int) <-chan int {\n    out := make(chan int)\n    go func()\
    \ {\n        for _, num := range numbers {\n            out <- num\n        }\n\
    \        close(out)\n    }()\n    return out\n}\n\nfunc main() {\n    data :=\
    \ []int{1, 2, 3, 4, 5, 6}\n    ch1 := generator(data[0:3])\n    ch2 := generator(data[3:])\n\
    \    ch := merge(ch1, ch2)\n    for num := range ch {\n        println(num)\n\
    \    }\n}\n```\n\n`generator` 函数与我们在 fan-out 模式示例中看到的相同。我们首先在 `merge` 函数中声明单个输出通道\
    \ `out`。其次，我们创建一个 `WaitGroup` 来确定何时所有源通道都已关闭。在它们关闭后，我们将使用 `Wait()` 并关闭输出（`out`）通道。然后，我们创建了一个函数（`outputFunc`），它接收源通道并将该源通道的所有数据发送到输出通道（`out`）。最后，我们遍历所有源通道并启动\
    \ goroutine 执行 `outputFunc`。\n\n现在我们在 `main` 函数中拥有了一个单一的通道，可以安全地迭代，直到 `merge`\
    \ 函数关闭该通道。\n\n# 总结\n\n在本章中，我们详细讨论了 Go 中的并发。这是 Go 中最重要的主题之一，深入理解它对于编写代码至关重要。在前两章中，我们讨论了\
    \ Go 基础主题，以深入了解 Go 的工作原理，这对于使用 Go 构建微服务架构是必不可少的。通过这些章节，我们一窥了如何利用 Go 知识构建微服务架构。\n\
    \n在下一章中，我们将介绍构建微服务架构的基本要素。\n\n# 参考资料\n\n*   [`stackoverflow.com/questions/4844637/what-is-the-difference-between-concurrency-parallelism-and-asynchronous-methods#:~:text=Concurrency%20is%20when%20the%20execution,though%20related%20in%20some%20contexts`](https://stackoverflow.com/questions/4844637/what-is-the-difference-between-concurrency-parallelism-and-asynchronous-methods#:~:text=Concurrency%20is%20when%20the%20execution,though%20related%20in%20some%20contexts)\n\
    *   [`pkg.go.dev/sync`](https://pkg.go.dev/sync)\n*   [`pkg.go.dev/golang.org/x/sync/errgroup`](https://pkg.go.dev/golang.org/x/sync/errgroup)\n\
    *   [`www.uber.com/en-JO/blog/leakprof-featherlight-in-production-goroutine-leak-detection/#:~:text=A%20possible%20solution%20to%20prevent,a%20buffer%20size%20of%201`](https://www.uber.com/en-JO/blog/leakprof-featherlight-in-production-goroutine-leak-detection/#:~:text=A%20possible%20solution%20to%20prevent,a%20buffer%20size%20of%201)\n\
    *   [`github.com/uber-go/goleak`](https://github.com/uber-go/goleak)\n\n# 第 6\
    \ 章\n\n# 微服务的核心要素\n\n# 简介\n\n在涵盖了与 Go 编程语言相关的所有基础知识后，我们将把它与微服务架构的核心要素相结合。你可能会问自己，什么是这些“**核心要素**”；微服务架构是一种**方法**，而非终点。因此，核心要素是技术行业的方法论、设计模式和技术。所有这些要素共同构成了一个完整的系统。没有一个配方能告诉我们如何构建出一个架构。存在许多约束、产品需求（可能会牵引出工程需求）和假设\
    \ —— 每个系统都有其独特的结构。然而，所有这些系统都有共同的要素。本章介绍这些要素，何时它们会变得有益，它们的优缺点，以及何时使用/避免它们。我们不会深入探讨每一个要素；相反，目标是提供一个框架，概述每个要素的边界。\n\
    \n我们不会涵盖微服务的所有现有要素。相反，我们将介绍主要的要素。以下是本章**不**涵盖的要素：\n\n*   **Saga 模式**：允许我们通过将分布式事务分解为更小、隔离的步骤来管理微服务架构中的分布式事务，每个步骤都有其补偿事务来处理潜在故障。\n\
    *   **Aggregator 模式**：从多个服务中聚合数据，以简化其他希望拉取该数据的服务的数据获取。\n*   **Decomposition 模式**：帮助我们将单体应用拆解为微服务。\n"
