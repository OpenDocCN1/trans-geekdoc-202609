- raw: 'Microservices, by their inherent design, are characterized as being straightforward
    and self-contained. Following the adapter design pattern, we should encapsulate
    inter-service communication by wrapping the HTTP client. There is a reference
    to this design pattern to read further in the References section.


    While creating the custom client (wrapped client) that communicates to the other
    services, we should strive to create those clients as structs. The structs must
    implement an interface. There are two best practices regarding using clients’
    interfaces in microservices:


    *   Each service client has its interface - higher flexibility and more work.


    *   All services have a common interface - lower flexibility and less work.


    The reason why we need an interface (regardless of the option we chose) is to
    have the ability to mock the clients’ responses, as we saw in the preceding sections
    (“*Mocking*”). We would like to mock the client response when writing tests in
    the scope of a single service.


    A more powerful kind of test is inter-services. Although it is much more powerful,
    it also takes a lot of time and effort to do it. There are endless theories regarding
    those kinds of inter-service tests. The main aspect is to set the `Setup` and
    `Teardown` of those tests properly while ensuring that those kinds of tests are
    reproducible. Commonly, those tests become flaky in nimbleness. We should aspire
    to use the `Functional Options Pattern` we saw in this chapter. In an optimal
    scenario, the `Setup` function should look like defining many `Options` (basically,
    configuration).


    Two relevant efficacious tools Golang brings when discussing building microservices
    architects in Go are:


    *   Performing benchmark


    *   Race Detector


    # [Performing Benchmark](#toc.xhtml#s78a)


    The benchmark is a built-in option in the test CLI. Benchmark helps us to test
    the performance of a function. Benchmarking is a powerful methodology that helps
    us to achieve good performance. Building microservices can be even more powerful
    because we can investigate specific endpoints when they become slow. Let’s see
    how we can perform a benchmark test.


    `func Fib(n int) int {`


    `if n < 2 {`


    `return n`


    `}`


    `return Fib(n-1) + Fib(n-2)`


    `}`


    And we want to see what the performance of this function for large inputs is.
    We need to create a test function with the prefix `Benchmark` and a signature
    that looks like that `(b *testing.B)`, then the test should look like this:


    `func BenchmarkFib(b *testing.B) {`


    `for n := 0; n < b.N; n++ {`


    `Fib(20)`


    `}`


    `}`


    To run the benchmark, we need to use the Go CLI as follows:


    `go test -bench=.`


    There are various configurations for running benchmark tests that can be explored.


    # [Race Detector](#toc.xhtml#s79a)


    In the Go CLI, a built-in option lets us detect race conditions. A race condition
    is a frequent situation that happens a lot in microservices systems. Furthermore,
    it can happen easily in Go due to their concurrency approach. The race detector
    can run against the executable program or the tests. Let’s see an example where
    we are running a race detector against a simple case:


    `func main() {`


    `i := 0`


    `go func() {`


    `i++`


    `}()`


    `fmt.Println(i)`


    `}`


    In the preceding example, a goroutine has been called in the second line of the
    function. When we print `i``,` we can get two options: `0` or `1`. The reason
    for that is a race condition. We don’t know if the goroutine will finish until
    the `Println` is called because they run in parallel. The command we can use to
    run the race detector is:


    `go run -race race-detector.go`


    We will accept a warning


    `==================`


    `WARNING: DATA RACE`


    `Write at 0x00c00011a028 by goroutine 6:`


    `main.main.func1()`


    `  /Users/nirshtein/Documents/GitHub/Microservices-with-Go/chapter-5/race-detector/race-detector.go:8
    +0x3c`


    `Previous read at 0x00c00011a028 by main goroutine:`


    `main.main()`


    `  /Users/nirshtein/Documents/GitHub/Microservices-with-Go/chapter-5/race-detector/race-detector.go:10
    +0xa8`


    `Goroutine 6 (running) created at:`


    `main.main()`


    `  /Users/nirshtein/Documents/GitHub/Microservices-with-Go/chapter-5/race-detector/race-detector.go:7
    +0x9c`


    `==================`


    `Found 1 data race(s)`


    `exit status 66`


    The warning is unequivocal. It is recommended to explore the variety of configurations
    to detect race conditions in Go. The next chapters will discuss techniques to
    resolve these race conditions.


    # [Conclusion](#toc.xhtml#s80a)


    In this chapter, we discussed the language’s core pillars. Each one of those topics
    is much bigger than the things we discussed. We encourage you to continue to explore
    each one of those pillars. The references in this chapter are a great starting
    point.


    The next chapter will discuss one of the main pillars of the language - Concurrency!


    # [References](#toc.xhtml#s81a)


    *   [https://refactoring.guru/design-patterns/go](https://refactoring.guru/design-patterns/go)


    *   [https://go.dev/blog/errors-are-values](https://go.dev/blog/errors-are-values)


    *   [https://github.com/brianvoe/gofakeit](https://github.com/brianvoe/gofakeit)


    *   [https://go.dev/security/fuzz/](https://go.dev/security/fuzz/)


    *   [https://refactoring.guru/design-patterns/adapter/go/example](https://refactoring.guru/design-patterns/adapter/go/example)


    *   [https://pkg.go.dev/testing#hdr-Benchmarks](https://pkg.go.dev/testing#hdr-Benchmarks)


    *   [https://go.dev/blog/race-detector](https://go.dev/blog/race-detector)


    # [CHAPTER 5](#toc.xhtml#c05)


    # [Unlocking Go’s Concurrency Power](#toc.xhtml#c05)


    # [Introduction](#toc.xhtml#s82a)


    In the previous chapter, we delved into essential topics within Go and this language’s
    basic principles. This chapter will focus on and delve into the most prominent
    pillar - Concurrency. One core motivation behind Go’s development is to give developers
    a straightforward and convenient way to write code that runs concurrently. We
    will cover all the Go-related topics in concurrency - Goroutines, channels, principles,
    design patterns, concurrency pitfalls like goroutine leaks, and more. Concurrency
    aims to deliver optimal performance. Good performance is a key indicator of any
    type of architecture, primarily for microservices.


    In *[Chapter 2, Usability of Go](#c02.xhtml)*, we discussed how goroutines and
    the scheduler work. We will continue from there and elaborate on goroutines in
    this chapter. Before we jump into concurrency in Golang, let’s address three potentially
    confusing terms:


    *   Concurrency


    *   Parallelism


    *   Asynchronism


    **Concurrency** is when the execution of multiple tasks is interleaved instead
    of each task being executed sequentially, one after another.


    **Parallelism** is when these tasks are actually being executed in parallel.


    ![](OEBPS/images/Figure-5.1.jpg)


    **Figure 5.1:** Concurrency and parallelism comparison


    **Asynchrony** is a separate concept (even though related in some contexts). One
    event might happen at a different time (not synchrony) to another. The following
    diagrams illustrate the difference between a synchronous and an asynchronous execution,
    where the actors can correspond to other threads, processes, or even servers.


    ![](OEBPS/images/Figure-5.2.jpg)


    **Figure 5.2:** Synchronous process


    ![](OEBPS/images/Figure-5.3.jpg)


    **Figure 5.3:** Asynchronous process


    It is essential to note the difference because, in this chapter, we will talk
    about concurrency in Go.


    # [Structure](#toc.xhtml#s83a)


    In this chapter, we will discuss the following topics:


    *   Goroutines


    *   Channels - Buffered vs. Unbuffered


    *   `Sync` Package


    *   Pub/Sub


    *   Channel Closing Principle


    *   Avoiding Goroutine Leak


    *   Fan In Fan Out Pattern


    # [Goroutines](#toc.xhtml#s84a)'
  fmt: "\n微服务因其固有设计而具有简单、自包含的特点。遵循适配器设计模式，我们应通过封装 HTTP 客户端来实现服务间通信的封装。关于该设计模式的参考资料请见“参考文献”部分。\n\
    \n在创建与其他服务通信的自定义客户端（封装后的客户端）时，我们应尽量将这些客户端创建为结构体（`struct`）。这些结构体必须实现一个接口。关于在微服务中使用客户端接口，有两种最佳实践：\n\
    \n*   每个服务客户端拥有自己的接口 —— 灵活性更高，但工作量更大。\n*   所有服务共享一个通用接口 —— 灵活性较低，但工作量较少。\n\n无论选择哪种方案，引入接口的原因都是为了具备模拟客户端响应的能力，正如前文（“模拟”）所述。我们希望在单个服务的测试范围内模拟客户端响应。\n\
    \n一种更强大的测试类型是服务间测试。虽然它功能更强，但也需要投入大量时间和精力。关于此类服务间测试存在无数理论。核心在于正确设置这些测试的 `Setup`\
    \ 和 `Teardown`，同时确保测试的可复现性。通常，这类测试在敏捷性方面容易变得不稳定。我们应致力于使用本章介绍的 `Functional Options\
    \ Pattern`。在最佳场景下，`Setup` 函数应表现为定义多个 `Options`（基本上即配置）。\n\nGo 语言在构建微服务架构时提供了两个相关的高效工具：\n\
    \n*   性能基准测试\n*   竞态检测器\n\n# 性能基准测试\n\n基准测试是测试 CLI 的内置选项。它有助于我们测试函数的性能。基准测试是一种强大的方法论，帮助我们实现良好的性能。构建微服务时它甚至更强大，因为我们可以在特定端点变慢时进行调查。让我们看看如何执行基准测试。\n\
    \n```\nfunc Fib(n int) int {\n    if n < 2 {\n        return n\n    }\n    return\
    \ Fib(n-1) + Fib(n-2)\n}\n```\n\n我们想要查看该函数在大输入下的性能表现。我们需要创建一个以 `Benchmark` 为前缀、签名为\
    \ `(b *testing.B)` 的测试函数，测试代码如下：\n\n```\nfunc BenchmarkFib(b *testing.B) {\n \
    \   for n := 0; n < b.N; n++ {\n        Fib(20)\n    }\n}\n```\n\n运行基准测试需使用 Go\
    \ CLI，命令如下：\n\n`go test -bench=.`\n\n还有多种运行基准测试的配置可供探索。\n\n# 竞态检测器\n\nGo CLI 内置选项可用于检测竞态条件。竞态条件是微服务系统中常见的情况。此外，由于\
    \ Go 的并发模型，竞态条件很容易发生。竞态检测器可针对可执行程序或测试运行。让我们看一个针对简单情况运行竞态检测器的示例：\n\n```\nfunc main()\
    \ {\n    i := 0\n    go func() {\n        i++\n    }()\n    fmt.Println(i)\n}\n\
    ```\n\n在上述示例中，函数第二行启动了一个 goroutine。当我们打印 `i` 时，可能得到两种结果：`0` 或 `1`。原因是存在竞态条件。我们无法确定\
    \ goroutine 是否会在 `Println` 调用前执行完毕，因为它们是并行运行的。运行竞态检测器的命令为：\n\n`go run -race race-detector.go`\n\
    \n我们将得到如下警告：\n\n```\n==================\nWARNING: DATA RACE\nWrite at 0x00c00011a028\
    \ by goroutine 6:\nmain.main.func1()\n  /Users/nirshtein/Documents/GitHub/Microservices-with-Go/chapter-5/race-detector/race-detector.go:8\
    \ +0x3c\nPrevious read at 0x00c00011a028 by main goroutine:\nmain.main()\n  /Users/nirshtein/Documents/GitHub/Microservices-with-Go/chapter-5/race-detector/race-detector.go:10\
    \ +0xa8\nGoroutine 6 (running) created at:\nmain.main()\n  /Users/nirshtein/Documents/GitHub/Microservices-with-Go/chapter-5/race-detector/race-detector.go:7\
    \ +0x9c\n==================\nFound 1 data race(s)\nexit status 66\n```\n\n该警告明确无误。建议探索\
