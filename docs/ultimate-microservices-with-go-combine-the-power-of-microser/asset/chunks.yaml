    \ entry point and the endpoint handler. Examples of middleware can be:  \n\n \
    \   *   Authentication and authorization\n\n    *   Caching\n\n    *   Request\
    \ parsing\n\n    *   Logging\n\n    *   Rate limit\n\n    *   Monitoring\n\n \
    \   *   Security\n\n    *   Caching\n\n    *   Adding context for business logic,\
    \ such as connection to cache or database\n\n*   `tests`: Contains all the service\
    \ tests. Here, we’ll elaborate on the internal structure of the tests.\n\n*  \
    \ `routes_registrator.go`: Each resource has several endpoints. This file aggregates\
    \ all the routes and registers them to the API so the `server.go` will know to\
    \ direct each request to the desired handler.\n\n*   `server.go`: Build the API\
    \ engine. It uses the `routes_registor.go`, uses the middleware, and sets the\
    \ portion of the configuration.\n\n*   **Directory for each category (tag)**:\
    \ There is a different directory for each tag - fruits, vegetables, and so on.\n\
    \n![](OEBPS/images/Figure-7.8.jpg)\n\n**Figure 7.8:** API structure option A for\
    \ each category\n\nThere is a different directory for each resource in each category\
    \ directory. Note that a single resource can contain several endpoints. For example,\
    \ `GET /api/fruits/apple/:id, POST /api/fruits/apple, UPDATE /api/fruits/apple/:id,\
    \ DELETE /api/fruits/apple/:id —` all of these four endpoints are related to the\
    \ same resource — apple. In each resource directory, there can be four files:\n\
    \n*   `controller.go`: This is the primary handler where the request starts after\
    \ all the middlewares. It parses the request, notifies the client of errors (4XX\
    \ status code), and returns the data by the OpenAPI commitment.\n\n*   `db.go:`\
    \ This is sometimes named as - `repository.go`. This file contains all the operations\
    \ against the database, whichever database it is. The power of this structure\
    \ is that we can switch databases, and all we need to take care of are the `db.go`\
    \ files. Note that this file shouldn’t contain the model/entity by itself. Usually,\
    \ there is a separate mechanism for managing the database, like ORM and migrations\
    \ tool (gorm is a standard and widely used tool for achieving ORM).\n\n*   `routes.go:`\
    \ Define all the endpoints for a resource. Note that a single resource can contain\
    \ several endpoints. This file will contain a function like this: \n\n    `func\
    \ RegisterRoutes(group *gin.RouterGroup) {`\n\n    `group.GET(“/fruits/apple/search”,gin.HandlersChain{ProcessRequestSearch}…)`\n\
    \n    `group.GET(“/fruits/apple/:id”, gin.HandlersChain{ProcessRequestID}…)`\n\
    \n    `}`\n\n*   `service.go:` It contains all the business logic.\n\nThe second\
    \ option for the file structure is similar. The main difference is in the order\
    \ of the files and directories.\n\n![](OEBPS/images/Figure-7.9.jpg)\n\n**Figure\
    \ 7.9:** API structure option B\n\nWe created four files for each resource in\
    \ a single directory in the previous structure.\n\nWe are creating four directories\
    \ in option B: `controllers`, `routes`, `repositories`, and `services`. In each\
    \ directory, we’ll find another group of directories as the number of categories\
    \ and, in each one, a single file for each resource.\n\n# [Resources Methods](#toc.xhtml#s145a)\n\
    \nAs mentioned, REST doesn’t force us to use specific protocols, but the HTTP\
    \ method currently dominates the market as the most used REST protocol. This section\
    \ will focus on HTTP; however, we can conduct the same behavior on other protocols.\n\
    \n*   `GET`: It is used to retrieve information only; it doesn’t change the state\
    \ in any way. This method represents the Read operation. Each time we use the\
    \ `GET` method, we should get the same result, unless another request by another\
    \ HTTP method modified the resource. Such types of requests can be cacheable and\
    \ have length restrictions. Examples: \n\n    `GET https://www.example.com/accounts`\n\
    \n    `GET https://www.example.com/accounts/search?name=john`\n\n    `GET https://www.example.com/accounts?page=5`\n\
    \n*   `POST`: It creates new data for a particular resource — a single row or\
    \ several rows. This type of request can’t be cacheable and has no length restriction.\
    \ Usually, data is sent in the request body and not in the URI. POST and GET methods\
    \ are the most widely used over HTTP methods. Examples: \n\n    `POST https://www.example.com/accounts`\n\
    \n    `POST https://www.example.com/accounts/myaccount_id/users`\n\n*   `PUT`:\
    \ It is usually used to update an existing resource state. However, it can also\
    \ create new data like the `POST` method. The main difference between `POST` and\
    \ `PUT` is that `PUT` is idempotent, and `POST` isn’t. This difference means that\
    \ calling the `PUT` method several times will give the same result, while `POST`\
    \ doesn’t promise that due to potential side effects. Example: \n\n    `PUT https://www.example.com/accounts/{myaccount_id}`\n\
    \n*   `DELETE`: It is used to delete specific resources.\n\n*   **Others**: `PATCH,\
    \ OPTIONS, HEAD, CONNECT,` and `TRACE` are other HTTP methods we can use but aren’t\
    \ as often as the preceding methods.\n\nLet’s briefly overview the standard HTTP\
    \ status codes (X refers to any number, and 1XX means 100-199):\n\n*   **1XX**:\
    \ Information responses. They aren’t used often.\n\n*   **2XX**: Successful responses,\
    \ the status code we’ll want to see.  \n\n    *   200 OK: Usually used by the\
    \ `GET` method to determine that the data is retrieved successfully.\n\n    *\
    \   201 Create: Usually used by `POST/PUT.`\n\n*   **3XX**: Redirection message,\
    \ usually used to redirect requests to other servers, endpoints, domains, and\
    \ so on.\n\n*   **4XX**: Client errors responses, meaning there is a problem with\
    \ the request, which is the client’s responsibility. These kinds of responses\
    \ are caught in the middleware or the controller.  \n\n    *   **400 Bad Request**:\
    \ The client didn’t give the correct/right information to process the request.\n\
    \n    *   **401 Unauthorized**: The server can’t identify the client.\n\n    *\
    \   **403 Forbidden**: The client is identified but cannot access the requested\
    \ data.\n\n    *   **404 Not Found**: It is among the most popular status codes,\
    \ indicating that the request is unrecognized.\n\n*   **5XX**: Server error responses,\
    \ meaning a problem with the server himself, and the users usually don’t have\
    \ much to do with that.  \n\n    *   **500 Internal server error**: The server\
    \ went into a scenario we don’t know how to handle.\n\n# [Crafting a Server](#toc.xhtml#s146a)\n\
    \nThis section will review the essentials of creating a RESTful API server in\
    \ Go. We’ll focus on setting up a server with Gin and what to notice. Go provide\
    \ us with a default package called http, which we’ll use and utilize.\n\n# [Gin\
    \ Gonic Setup](#toc.xhtml#s147a)\n\nGin is an HTTP web framework. First, we’ll\
    \ start from the `main.go`, where we declare and execute a server.\n\n`func main()\
    \ {`\n\n`port := 8080`\n\n`engine := internal.BuildEngine()`\n\n`srv := &http.Server{`\n\
    \n`Addr: fmt.Sprintf(“:%d”, port),`\n\n`Handler: engine,`\n\n`}`\n\n`log.Printf(“Starting\
    \ server on port %d”, port)`\n\n`if err := srv.ListenAndServe(); err != nil &&\
    \ err != http.ErrServerClosed {`\n\n`log.Print(“error while running API gin server”,\
    \ “error”, err.Error())`\n\n`os.Exit(1)`\n\n`}`\n\n`}`\n\nAfter declaring the\
    \ port and building the gin engine (we’ll see how in a second), we created an\
    \ instance of `http.Server` struct. After that, we started the server using the\
    \ `ListenAndServe()` function.\n\n`func BuildEngine() *gin.Engine {`\n\n`engine\
    \ := gin.New()`\n\n`engine.Use(gin.Logger())`\n\n`engine.Use(gin.Recovery())`\n\
    \n`engine.Use(CORS())`\n\n`group := engine.Group(“/api”)`\n\n`RegisterRoutes(group)`\n\
    \n`// engine.use(<any middleware you want>)`\n\n`return engine`\n\n`}`"
