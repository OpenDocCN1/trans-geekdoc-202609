- raw: "In a world where developers develop many services as part of bigger microservices\
    \ architecture, they usually package those services into deliverable units called\
    \ containers, which leads to a world where we need to manage enormous amounts\
    \ of containers. It is almost impossible to manage and operate this number of\
    \ containers while supporting each developer’s needs and specific requirements.\
    \ Fortunately, some folks at Google saw this coming problem and crafted a single\
    \ project to resolve it. This project is called Kubernetes.\n\nWhy should we learn\
    \ Kubernetes? “*I need to write my code and let the operation side (usually DevOps)\
    \ do all the other work for me*.” This answer would be acceptable in a perfect\
    \ world, but it isn’t the case. There is a coupling between the application and\
    \ the way it is deployed. As developers, we must ensure our functionality happens\
    \ as expected in production. There is a vast difference between the local and\
    \ production environments — different parameters, edge cases we didn’t think of,\
    \ scale issues, security concerns, and more. To mitigate problems in that difference,\
    \ we as developers need to know the basics about Kubernetes - common resources,\
    \ rollout procedure, troubleshooting, central best practices, monitoring, and\
    \ so on. In this chapter, we are going to explore those topics.\n\nWhat is the\
    \ relation between Kubernetes and microservices architecture?\n\nIn simple words,\
    \ Kubernetes is solving many issues and downsides of microservices architecture.\
    \ For example, using an external configuration in a microservices architecture\
    \ is recommended. Kubernetes solves it by providing ConfigMaps and Secrets (storage\
    \ resources) to inject data into the application containers. That is why the combination\
    \ of the two is powerful.\n\nAnother example is that routing capabilities can\
    \ be implemented efficiently using Ingress (Kubernetes resource).\n\nKubernetes\
    \ is an open-source container orchestration system. This system was invented by\
    \ Google in 2014 and is now maintained by the CNCF (Cloud Native Computing Foundation).\
    \ A shortcut for Kubernetes is K8s (due to the 8 letters between K and S).\n\n\
    ![](OEBPS/images/8.1.jpg)\n\n**Figure 8.1:** Microservices architecture uses Kubernetes\
    \ example\n\n# [Structure](#toc.xhtml#s168a)\n\nIn this chapter, we will discuss\
    \ the following topics:\n\n*   Kubernetes Adoption\n\n*   Kubernetes Essential\
    \ Tools - `kind, kubectl, kubectx`\n\n*   Basic Resources  \n\n    *   Node\n\n\
    \    *   Namespace\n\n    *   Pod\n\n*   Workloads Management  \n\n    *   Deployment\n\
    \n    *   DaemonSet\n\n    *   StatefulSet\n\n    *   Job\n\n    *   CronJob\n\
    \n*   Important Resources  \n\n    *   ConfigMap\n\n    *   Secret\n\n    *  \
    \ HPA\n\n    *   Ingress\n\n*   Readiness and Liveness Probes\n\n*   Resources\
    \ Allocations\n\n*   Kubernetes Best Practices  \n\n    *   Maintaining Good YAML\
    \ Hygiene\n\n    *   Logging - Specifically for Kubernetes\n\n    *   Environments\
    \ Management\n\n    *   Proper Monitoring\n\n# [Kubernetes Adoption](#toc.xhtml#s169a)\n\
    \nNowadays, Kubernetes is widely used, and most companies in the world use it.\
    \ The community of Kubernetes is enormous and keeps growing year after year. There\
    \ are a considerable number of conferences worldwide whose topic is only Kubernetes.\
    \ There are tons of open-source projects and tools that are related to Kubernetes.\n\
    \nFurthermore, some companies have products that are natively for Kubernetes.\
    \ It is already industry standard to use Kubernetes as the place to deploy our\
    \ services and workloads.\n\n![](OEBPS/images/Figure-8.2.jpg)\n\n**Figure 8.2:**\
    \ Kubernetes Adoption December 2022\n\nKubernetes aims to manage containerized\
    \ workloads and services. Moreover, the goal is to automate the complex procedure\
    \ of deployment. Kubernetes takes care of several aspects regarding the deployment\
    \ process - networking, configuration, rollout, and so on — and also takes care\
    \ of the management - storage, security, and so on.\n\nKubernetes composes several\
    \ tools and projects inside it and leverages the power of each one of them. For\
    \ example, Kubernetes uses Docker as the container runtime engine and doesn’t\
    \ have its own container runtime engine. Kubernetes comes as a single unit called\
    \ - **cluster**. We can create resources in that cluster by defining the desired\
    \ resources. We’ll configure the desired resource that we want using YAML. Kubernetes\
    \ will perform all the other work for us and strive to reach the desired state\
    \ we defined. Further in this chapter, we’ll elaborate on the different Kubernetes\
    \ resources relevant to software engineers.\n\n# [Kubernetes Essential Tools](#toc.xhtml#s170a)\n\
    \nLet’s discuss some necessary tools of Kubernetes:\n\n# [Kind](#toc.xhtml#s171a)\n\
    \nKind stands for Kubernetes IN Docker, a tool for running a Kubernetes cluster\
    \ as a Docker container. It is straightforward and usually used for local or testing\
    \ environments because it is lightweight and easy to use. Other tools that do\
    \ the same are Minikube and K3s. Here is how we can start a cluster using `kind`:\n\
    \n`kind create cluster --name example`\n\n# [Kubectl](#toc.xhtml#s172a)\n\nKubectl\
    \ is a tool that is part of the Kubernetes OSS project. It is a CLI that lets\
    \ us interact easily with Kubernetes API. Here are some common commands of `kubectl`:\n\
    \nGet resources:\n\n`kubectl get pods`\n\n`kubectl get nodes --output json`\n\n\
    ![](OEBPS/images/Figure-8.3.jpg)\n\n**Figure 8.3:** kubectl get pods output sample\
    \ response\n\nThe first example shows how to get all pods in the cluster in the\
    \ default namespace. The second example gets all the nodes in the cluster with\
    \ the output format of JSON.\n\nCreate a new resource:\n\n`kubectl create -f pod.yaml`\n\
    \nModify/Create a resource:\n\n`kubectl apply -f pod.yaml`\n\nDelete a pod called\
    \ frontend:\n\n`kubectl delete pods/frontend`\n\nTo see all the commands `kubectl`\
    \ has, we can run:\n\n`kubectl help`\n\n`kubectl help <command-name>`\n\n# [Kubectx](#toc.xhtml#s173a)\n\
    \nMinimalist CLI tool that helps us to switch between clusters. When we use `kubectl`,\
    \ it goes to the cluster API declared in the `~/.kube` directory. By using `kubectx`,\
    \ it just switches the context to the desired cluster. For example:\n\n`kubectx\
    \ <cluster-name>`\n\n# [Basic Resources](#toc.xhtml#s174a)\n\nThe following three\
    \ resources are widely used in Kubernetes. It is essential to know what they are\
    \ to understand Kubernetes. We’ll mention them repeatedly in this chapter.\n\n\
    # [Node](#toc.xhtml#s175a)\n\n*“A Node is a worker machine in Kubernetes and may\
    \ be either a virtual or a physical machine, depending on the cluster. Each Node\
    \ is managed by the control plane. A Node can have multiple pods, and the Kubernetes\
    \ control plane automatically handles scheduling the pods across the Nodes in\
    \ the cluster.”*\n\nThis is a quote from official Kubernetes documentation. This\
    \ quote explains pretty well what Node is. As developers, this is enough, and\
    \ we don’t need to operate them or tackle node issues. However, note that sometimes\
    \ our application will have a problem due to node issues. At the very least, we\
    \ need to understand that the issue is related to the node and transfer it to\
    \ the operation person to tackle it.\n\n# [Namespace](#toc.xhtml#s176a)\n\nNamespaces\
    \ in Kubernetes are a mechanism of separation and isolation between resources.\
    \ Some resources can be namespaced, and some are not. Each time we get resources\
    \ using `kubectl get`, it will bring us all the resources from the `default` namespace\
    \ unless we specify differently; by adding `-A`, we can get all resources in all\
    \ namespaces. Names of resources and kinds need to be unique inside a namespace.\
    \ To see which resources are namespaced and which aren’t, we can run:\n\n`kubectl\
    \ api-resources`\n\n![](OEBPS/images/Figure-8.4.jpg)\n\n**Figure 8.4:** kubectl\
    \ api-resources output\n\nNote the column “`NAMESPACED`”, which gives a boolean\
    \ answer if the resource kind is namespaced.\n\n# [Pod](#toc.xhtml#s177a)"
  fmt: "\n在开发者构建众多服务以组成更大的微服务架构的世界里，他们通常将这些服务打包为称为容器的可交付单元，这导致我们需要管理海量的容器。在支持每位开发者的需求和特定要求的同时，几乎不可能管理和运维如此数量的容器。幸运的是，Google\
    \ 的一些人预见到了这个问题，并打造了一个单一项目来解决它。这个项目叫做 Kubernetes。\n\n为什么我们要学习 Kubernetes？*“我只需要编写代码，让运维侧（通常是\
    \ DevOps）为我完成所有其他工作。”* 这个答案在完美的世界里是可以接受的，但现实并非如此。应用程序与其部署方式之间存在耦合。作为开发者，我们必须确保功能在生产环境中按预期运行。本地环境与生产环境之间存在巨大差异\
    \ —— 不同的参数、我们未曾考虑的边缘情况、扩展问题、安全顾虑等。为了缓解这些差异带来的问题，我们作为开发者需要了解 Kubernetes 的基础知识 ——\
    \ 常见资源、发布流程、故障排查、核心最佳实践、监控等。在本章中，我们将探讨这些主题。\n\nKubernetes 与微服务架构有什么关系？\n\n简单来说，Kubernetes\
    \ 解决了微服务架构的许多问题和缺点。例如，在微服务架构中建议使用外部配置。Kubernetes 通过提供 `ConfigMap` 和 `Secret`（存储资源）将数据注入应用容器来解决这个问题。这就是两者结合强大的原因。\n\
    \n另一个例子是，可以使用 `Ingress`（Kubernetes 资源）高效地实现路由能力。\n\nKubernetes 是一个开源的容器编排系统。该系统由\
    \ Google 于 2014 年发明，现由 CNCF（云原生计算基金会）维护。Kubernetes 的简写是 `K8s`（因 K 和 S 之间有 8 个字母）。\n\
    \n![](OEBPS/images/8.1.jpg)\n\n**Figure 8.1:** Microservices architecture uses\
    \ Kubernetes example\n\n# Structure\n\n在本章中，我们将讨论以下主题：\n\n*   Kubernetes Adoption\n\
    *   Kubernetes Essential Tools - `kind`、`kubectl`、`kubectx`\n*   Basic Resources\n\
    \    *   Node\n    *   Namespace\n    *   Pod\n*   Workloads Management\n    *\
    \   Deployment\n    *   DaemonSet\n    *   StatefulSet\n    *   Job\n    *   CronJob\n\
    *   Important Resources\n    *   ConfigMap\n    *   Secret\n    *   HPA\n    *\
    \   Ingress\n*   Readiness and Liveness Probes\n*   Resources Allocations\n* \
    \  Kubernetes Best Practices\n    *   Maintaining Good YAML Hygiene\n    *   Logging\
    \ - Specifically for Kubernetes\n    *   Environments Management\n    *   Proper\
    \ Monitoring\n\n# Kubernetes Adoption\n\n如今，Kubernetes 被广泛使用，世界上大多数公司都在使用它。Kubernetes\
    \ 社区庞大且逐年增长。全球有大量会议的主题仅围绕 Kubernetes。有大量与 Kubernetes 相关的开源项目和工具。\n\n此外，一些公司拥有原生面向\
    \ Kubernetes 的产品。使用 Kubernetes 作为部署服务和工作负载的场所已成为行业标准。\n\n![](OEBPS/images/Figure-8.2.jpg)\n\
    \n**Figure 8.2:** Kubernetes Adoption December 2022\n\nKubernetes 旨在管理容器化的工作负载和服务。此外，其目标是自动化复杂的部署流程。Kubernetes\
    \ 负责部署过程的多个方面 —— 网络、配置、发布等，也负责管理 —— 存储、安全等。\n\nKubernetes 在其内部组合了多个工具和项目，并利用它们各自的能力。例如，Kubernetes\
    \ 使用 Docker 作为容器运行时引擎，并没有自己的容器运行时引擎。Kubernetes 作为一个称为 **cluster** 的单一单元提供。我们可以通过定义期望的资源在该集群中创建资源。我们将使用\
    \ YAML 配置想要的期望资源。Kubernetes 将为我们完成所有其他工作，并努力达到我们定义的期望状态。在本章后续内容中，我们将详细阐述与软件工程师相关的不同\
    \ Kubernetes 资源。\n\n# Kubernetes Essential Tools\n\n让我们讨论一些 Kubernetes 的必要工具：\n\
    \n## Kind\n\n`Kind` 代表 Kubernetes IN Docker，是一个在 Docker 容器中运行 Kubernetes 集群的工具。它简单直接，通常用于本地或测试环境，因为它轻量且易于使用。其他实现相同功能的工具有\
    \ `Minikube` 和 `K3s`。以下是如何使用 `kind` 启动集群：\n\n```\nkind create cluster --name example\n\
    ```\n\n## Kubectl\n\n`Kubectl` 是 Kubernetes OSS 项目的一部分。它是一个 CLI，让我们能轻松与 Kubernetes\
    \ API 交互。以下是一些 `kubectl` 的常用命令：\n\n获取资源：\n\n```\nkubectl get pods\nkubectl get\
    \ nodes --output json\n```\n\n![](OEBPS/images/Figure-8.3.jpg)\n\n**Figure 8.3:**\
    \ kubectl get pods output sample response\n\n第一个示例展示如何以默认命名空间获取集群中所有的 Pod。第二个示例以\
    \ JSON 输出格式获取集群中所有的 Node。\n\n创建新资源：\n\n```\nkubectl create -f pod.yaml\n```\n\n\
    修改/创建资源：\n\n```\nkubectl apply -f pod.yaml\n```\n\n删除名为 frontend 的 Pod：\n\n```\n\
    kubectl delete pods/frontend\n```\n\n要查看 `kubectl` 所有的命令，可以运行：\n\n```\nkubectl\
    \ help\nkubectl help <command-name>\n```\n\n## Kubectx\n\n`Kubectx` 是一个极简的 CLI\
    \ 工具，帮助我们在集群间切换。当我们使用 `kubectl` 时，它会访问 `~/.kube` 目录中声明的集群 API。通过使用 `kubectx`，它只会将上下文切换到期望的集群。例如：\n\
    \n```\nkubectx <cluster-name>\n```\n\n# Basic Resources\n\n以下三个资源在 Kubernetes\
    \ 中被广泛使用。了解它们是什么对于理解 Kubernetes 至关重要。我们将在本章中反复提及它们。\n\n## Node\n\n> “Node 是 Kubernetes\
    \ 中的工作机器，可以是虚拟机也可以是物理机，取决于集群。每个 Node 由控制平面管理。一个 Node 可以运行多个 Pod，Kubernetes 控制平面会自动处理在集群中的\
    \ Node 间调度 Pod。”\n\n这是 Kubernetes 官方文档的引用。这段引用很好地解释了什么是 Node。作为开发者，这已足够，我们不需要操作它们或处理\
    \ Node 问题。但请注意，有时我们的应用程序会因 Node 问题而出现故障。至少，我们需要理解问题与 Node 相关，并将其移交给运维人员处理。\n\n\
    ## Namespace\n\nKubernetes 中的 Namespace 是资源间分离和隔离的机制。一些资源可以被命名空间化，一些则不能。每次我们使用\
    \ `kubectl get` 获取资源时，除非另行指定，否则它会带来 `default` 命名空间中的所有资源；通过添加 `-A`，我们可以获取所有命名空间中的所有资源。资源的名称和类型在命名空间内必须唯一。要查看哪些资源被命名空间化、哪些没有，可以运行：\n\
    \n```\nkubectl api-resources\n```\n\n![](OEBPS/images/Figure-8.4.jpg)\n\n**Figure\
    \ 8.4:** kubectl api-resources output\n\n请注意 “`NAMESPACED`” 列，它给出布尔答案，指示资源类型是否被命名空间化。\n\
    \n## Pod\n"
  trans: "\n在开发者构建众多服务以组成更大的微服务架构的世界里，他们通常将这些服务打包为称为容器的可交付单元，这导致我们需要管理海量的容器。在支持每位开发者的需求和特定要求的同时，几乎不可能管理和运维如此数量的容器。幸运的是，Google\
    \ 的一些人预见到了这个问题，并打造了一个单一项目来解决它。这个项目叫做 Kubernetes。\n\n为什么我们要学习 Kubernetes？*“我只需要编写代码，让运维侧（通常是\
    \ DevOps）为我完成所有其他工作。”* 这个答案在完美的世界里是可以接受的，但现实并非如此。应用程序与其部署方式之间存在耦合。作为开发者，我们必须确保功能在生产环境中按预期运行。本地环境与生产环境之间存在巨大差异\
    \ —— 不同的参数、我们未曾考虑的边缘情况、扩展问题、安全顾虑等。为了缓解这些差异带来的问题，我们作为开发者需要了解 Kubernetes 的基础知识 ——\
    \ 常见资源、发布流程、故障排查、核心最佳实践、监控等。在本章中，我们将探讨这些主题。\n\nKubernetes 与微服务架构有什么关系？\n\n简单来说，Kubernetes\
    \ 解决了微服务架构的许多问题和缺点。例如，在微服务架构中建议使用外部配置。Kubernetes 通过提供 `ConfigMap` 和 `Secret`（存储资源）将数据注入应用容器来解决这个问题。这就是两者结合强大的原因。\n\
    \n另一个例子是，可以使用 `Ingress`（Kubernetes 资源）高效地实现路由能力。\n\nKubernetes 是一个开源的容器编排系统。该系统由\
    \ Google 于 2014 年发明，现由 CNCF（云原生计算基金会）维护。Kubernetes 的简写是 `K8s`（因 K 和 S 之间有 8 个字母）。\n\
    \n![](img/8.1.jpg)\n\n**Figure 8.1:** 微服务架构使用 Kubernetes 示例\n\n# Structure\n\n\
    在本章中，我们将讨论以下主题：\n\n*   Kubernetes Adoption（Kubernetes 采用）\n*   Kubernetes Essential\
    \ Tools - `kind`、`kubectl`、`kubectx`\n*   Basic Resources（基础资源）\n    *   Node（节点）\n\
    \    *   Namespace（命名空间）\n    *   Pod（Pod）\n*   Workloads Management（工作负载管理）\n\
    \    *   Deployment（部署）\n    *   DaemonSet（守护进程集）\n    *   StatefulSet（有状态集）\n\
    \    *   Job（任务）\n    *   CronJob（定时任务）\n*   Important Resources（重要资源）\n    *\
    \   ConfigMap\n    *   Secret\n    *   HPA\n    *   Ingress\n*   Readiness and\
    \ Liveness Probes（就绪与存活探针）\n*   Resources Allocations（资源分配）\n*   Kubernetes Best\
    \ Practices（Kubernetes 最佳实践）\n    *   Maintaining Good YAML Hygiene（保持良好的 YAML\
    \ 规范）\n    *   Logging - Specifically for Kubernetes（日志记录 —— 专门针对 Kubernetes）\n\
    \    *   Environments Management（环境管理）\n    *   Proper Monitoring（合理的监控）\n\n#\
    \ Kubernetes Adoption\n\n如今，Kubernetes 被广泛使用，世界上大多数公司都在使用它。Kubernetes 社区庞大且逐年增长。全球有大量会议的主题仅围绕\
    \ Kubernetes。有大量与 Kubernetes 相关的开源项目和工具。\n\n此外，一些公司拥有原生面向 Kubernetes 的产品。使用 Kubernetes\
    \ 作为部署服务和工作负载的场所已成为行业标准。\n\n![](img/Figure-8.2.jpg)\n\n**Figure 8.2:** 2022 年\
