    \ code locks, communication between threads, allocating of threads, idle threads,\
    \ and so on.\n\n# Maintainability of Go\n\nSeveral reasons are why Go is easy\
    \ to maintain:\n\n*   Compatibility\n*   Go simplicity\n*   Error handling\n\n\
    # Compatibility\n\n> “It is intended that programs written to the Go 1 specification\
    \ will continue to compile and run correctly, unchanged, over the lifetime of\
    \ that specification. At some indefinite point, a Go 2 specification may arise,\
    \ but until that time, Go programs that work today should continue to work even\
    \ as future “point” releases of Go 1 arise (Go 1.1, Go 1.2, etc.).”\n\nIt is a\
    \ quote from the documentation of Go when the first version of Go was released.\
    \ There is an attachment to this documentation in the references. Note that later\
    \ in the documents, they set expectations and write that things can go wrong,\
    \ like bugs, security issues, structs literals, and more.\n\nWhen every version\
    \ of Go is released, there is an intention for backward and forward compatibility.\
    \ According to Russ Cox from GopherCon 2022, the Go team uses two main approaches\
    \ to keep it compatible:\n\n*   API Checking\n*   Testing\n\n## API Checking\n\
    \nIn order to prevent the breakage of previous versions of Go, we can’t remove\
    \ exported symbols, API methods, packages, and so on. Otherwise, the program will\
    \ fail. Go can’t remove libraries, structs, methods, and so on.\n\nThe Go team\
    \ uses a tool that contains all the exported API signatures for all Go versions.\
    \ Then, the Go team runs tests that compare the package API to the exported API\
    \ signatures and notify if something has changed. If something changes, they take\
    \ action to either prevent it or at least minimize its impact.\n\n## Testing\n\
    \nA colossal advantage that Google maintains in Go is that it can be tested within\
    \ Google. The development version of Go is being tested against all of Google’s\
    \ internal Go program tests. After all these tests pass, the Go development branch\
    \ is used in the Google production environment and toolchain.\n\nWith every release\
    \ of Go, they note if something got broken in the new version. Go also provides\
    \ a powerful tool called `GODEBUG` that helps us upgrade our version and verify\
    \ that our program doesn’t panic.\n\n# Go Simplicity\n\nAs we have seen before,\
    \ one of Go’s main goals is simplicity. This simplicity pays off when we examine\
    \ the program’s maintainability. One significant advantage of the Go team is that\
    \ they make all the rules. In the previous chapter, we talked about “*Effective\
    \ Go*,” which has all the conventions, best practices, and documentation for how\
    \ to do things. Unlike some other languages where conventions come from different\
    \ places, in Go, the Go team decides everything.\n\n# Error Handling\n\nGo is\
    \ different from other languages. In many other languages, we are expecting to\
    \ see a `try-catch-finally` idiom.\n\nThis is not the case with Go. In Go, we\
    \ will explicitly create an error and return it as a variable. Here is a quote\
    \ from Go FAQ.\n\n> “We believe that coupling exceptions to a control structure,\
    \ as in the `try-catch-finally` idiom, results in convoluted code. It also tends\
    \ to encourage programmers to label too many ordinary errors, such as failing\
    \ to open a file, as exceptional.”\n\nSometimes it can be frustrating to see code\
    \ like this:\n\n```\nif err != nil {\n    return err\n}\n```\n\nHowever, if we\
    \ understand its motive, we can accept it. Additionally, to Go FAQ, the error\
    \ handling in Go gives us a way to tell a story. Instead of just returning the\
    \ error, we can add context to it and, by that, create the story of the error,\
    \ for instance:\n\n```\nif err != nil {\n    return fmt.Errorf(\"connecting to\
    \ DB: %w\", err)\n}\n```\n\nNow we have the context that this error happened while\
    \ trying to connect to the DB. It was just one example to understand the hidden\
    \ power of error handling in Go.\n\n# From Onboarding to Production\n\nA programming\
    \ language doesn’t consist only of language components like compiler, syntax,\
    \ and so on. It also consists of several tools crucial to the toolchain, like\
    \ a package manager, documentation, formatter, linter, test tools, and so on.\n\
    \nGo aims to give the Go developer a holistic experience by providing the tools\
    \ in the toolchain. There are three reasons why the Go team wants to create the\
    \ toolchain.\n\nOne is that they don’t need to depend on anonymous contributors\
    \ to create a tool. The second and more important reason is that the Go team knows\
    \ the best way to build such a tool. The third reason is to achieve standardization.\n\
    \nWe don’t want to have two formatters that do very similar things but operate\
    \ differently, and we can see these patterns in other languages. The formatter\
    \ is just one example of standardization. It can be a linter, tests, time package,\
    \ and so on.\n\nWhat are the steps for the newcomer to the language until they\
    \ deploy it to production?\n\n1.  Getting Started\n2.  Plan\n3.  Package Management\n\
    4.  Writing code\n5.  Troubleshoot\n6.  Test\n7.  Security\n8.  Build\n9.  Others\n\
    \n## Getting Started\n\nA newcomer to the language doesn’t know how the language\
    \ syntax looks alike. The Go team created a playground, so developers who read\
    \ about the language can already be engaged and play with it. All the documentation\
    \ and playground exist in `go.dev`.\n\n## Plan\n\nThe newcomer fell in love with\
    \ the language. Now, they want to start a project. But before jumping into the\
    \ code, we want to plan. We want to understand how the project is going to look.\
    \ To do so, we must understand and explore the packages we aim to use. There is\
    \ a single artifact manager for all Go packages, and this manager, not surprisingly,\
    \ exists in `go.dev`, specifically in `pkg.go.dev`.\n\n## Package management\n\
    \nTo interact with various tools from the Go toolchain, we need to have the Go\
    \ CLI; that’s it. In the Go CLI, various tools help us to start the project. We\
    \ finished planning our project, and now we want to start. We will run the following\
    \ command to initial a project:\n"
  trans: "\n在这张图中，我们可以看到系统的核心。操作系统调度器管理着一层线程；在它之上，我们可以看到执行 Goroutine 的 Go 程序，而 Go\
    \ 调度器管理着这一切。\n\n让我们观察单核系统的行为。\n\n![](img/2.4.jpg)\n\n**图 2.4：** 单核操作系统分配一个 goroutine\n\
    \n这张图展示了一个单核操作系统，它执行一些被称为 G1 的 Goroutine。然后在最后执行另一个被称为 G2 的 Goroutine。\n\n但当我们拥有多核时会发生什么？当一个\
    \ Go 程序启动时，调度器会初始化一个线程；如果一些 goroutine 正在执行而之前的 goroutine 尚未完成，它会分配更多线程，直到达到最大线程数。配置中的最大线程数即为\
    \ Go，它被设置为一个名为 `GOMAXPROCS` 的环境变量。Go 团队通过基准测试得出的默认且推荐的值是核心数。例如，如果一台机器有 8 个核心，`GOMAXPROCS`\
    \ 的值就是 8，调度器不会调度超过 8 个线程。我们可以配置该环境变量，但这不推荐。\n\n当需要执行的 goroutine 多于可用线程时，调度器是如何工作的？\n\
    \n![](img/2.5.jpg)\n\n**图 2.5：** 由调度器管理的、带有队列的多线程\n\n每个线程都有一个专用队列，该队列知晓下一个应该在此线程上调度的\
    \ goroutine。每分配一个新线程，就会创建一个新队列。每个 goroutine 在某个线程上运行时被分配，并直接进入同一线程的队列。为了防止单个队列负载过重，调度器会在线程间执行工作窃取，并平衡它们之间的工作。\n\
    \n以上简要解释了 Go 调度器。调度器还会考虑许多其他因素，如系统锁、代码锁、线程间通信、线程分配、空闲线程等。\n\n# Go 的可维护性\n\nGo\
    \ 易于维护有几个原因：\n\n*   兼容性\n*   Go 的简洁性\n*   错误处理\n\n# 兼容性\n\n> “旨在让符合 Go 1 规范编写的程序在该规范的生命周期内持续能够正确编译和运行，且无需更改。在未来的某个不确定时间点，可能会出现\
    \ Go 2 规范，但在那之前，今天能工作的 Go 程序在未来 Go 1 的“点”版本发布（Go 1.1、Go 1.2 等）时应继续保持工作。”\n\n这是\
    \ Go 第一个版本发布时文档中的引述。参考资料中附有该文档。请注意，文档后续部分设定了预期，并指出事情可能会出错，例如 bug、安全问题、结构体字面量等。\n\
    \n每当发布一个 Go 版本时，都旨在保持向后和向前兼容性。根据 Russ Cox 在 GopherCon 2022 上的演讲，Go 团队使用两种主要方法来保持兼容性：\n\
    \n*   API 检查\n*   测试\n\n## API 检查\n\n为了防止破坏之前的 Go 版本，我们不能移除导出的符号、API 方法、包等。否则程序将无法运行。Go\
    \ 不能移除库、结构体、方法等。\n\nGo 团队使用一个包含所有 Go 版本所有导出 API 签名的工具。然后，Go 团队运行测试，将包的 API 与导出的\
    \ API 签名进行比较，如果有变化则发出通知。如果发生变化，他们会采取行动来阻止它，或者至少将其影响降到最低。\n\n## 测试\n\nGoogle 在\
    \ Go 维护中拥有的一个巨大优势是可以在 Google 内部对其进行测试。Go 的开发版本会针对 Google 所有内部 Go 程序的测试进行测试。所有这些测试通过后，Go\
    \ 开发分支会被用于 Google 的生产环境和工具链中。\n\n每次发布 Go 版本时，他们都会记录新版本中是否有东西被破坏。Go 还提供了一个名为 `GODEBUG`\
    \ 的强大工具，帮助我们升级版本并验证我们的程序不会 panic。\n\n# Go 的简洁性\n\n正如我们之前所见，Go 的主要目标之一是简洁性。当我们审视程序的可维护性时，这种简洁性就会得到回报。Go\
    \ 团队的一个显著优势是他们制定所有规则。在上一章中，我们讨论了“Effective Go”，其中包含了所有约定、最佳实践和文档，指导如何做事。与其他一些语言的约定来自不同地方不同，在\
    \ Go 中，Go 团队决定一切。\n\n# 错误处理\n\nGo 与其他语言不同。在许多其他语言中，我们期望看到 `try-catch-finally`\
    \ 惯用语。\n\nGo 并非如此。在 Go 中，我们会显式地创建一个错误并将其作为变量返回。这里引用一段 Go FAQ 的内容。\n\n> “我们认为将异常与控制结构耦合（如\
    \ `try-catch-finally` 惯用语）会导致代码复杂化。这也倾向于鼓励程序员将太多普通错误（如无法打开文件）标记为异常。”\n\n有时看到这样的代码会让人沮丧：\n\
    \n```\nif err != nil {\n    return err\n}\n```\n\n然而，如果我们理解其动机，就能接受它。此外，根据 Go\
    \ FAQ，Go 的错误处理给了我们一种讲述故事的方式。我们不只是返回错误，而是可以为其添加上下文，从而创建错误的“故事”，例如：\n\n```\nif err\
    \ != nil {\n    return fmt.Errorf(\"connecting to DB: %w\", err)\n}\n```\n\n现在我们有了上下文，知道这个错误是在尝试连接数据库时发生的。这只是一个理解\
    \ Go 中错误处理隐藏力量的例子。\n\n# 从入门到生产\n\n编程语言不仅仅由编译器、语法等语言组件组成。它还包含工具链中至关重要的几个工具，如包管理器、文档、格式化工具、静态分析工具、测试工具等。\n\
    \nGo 旨在通过在工具链中提供这些工具，给 Go 开发者一种整体体验。Go 团队想要创建工具链有三个原因。\n\n一是他们不需要依赖匿名贡献者来创建工具。第二个也是更重要的原因是\
    \ Go 团队最清楚构建此类工具的最佳方式。第三个原因是为了实现标准化。\n\n我们不想要两个做非常相似的事情但运作方式不同的格式化工具，我们可以在其他语言中看到这种模式。格式化工具只是标准化的一个例子。它可以是静态分析工具、测试、time\
    \ 包等。\n\n新手从接触语言到将其部署到生产环境需要哪些步骤？\n\n1.  入门\n2.  规划\n3.  包管理\n4.  编写代码\n5.  故障排查\n\
    6.  测试\n7.  安全\n8.  构建\n9.  其他\n\n## 入门\n\n语言新手不了解语言语法的样子。Go 团队创建了一个 playground（演练场），因此阅读过该语言介绍的开发者可以立即参与并上手练习。所有文档和\
    \ playground 都在 `go.dev` 中。\n\n## 规划\n\n新手爱上了这门语言。现在，他们想开始一个项目。但在跳进代码之前，我们要先规划。我们想了解项目将是什么样子。为此，我们必须了解并探索我们打算使用的包。所有\
    \ Go 包有一个单一的制品管理器，毫不意外，它存在于 `go.dev` 中，具体在 `pkg.go.dev`。\n\n## 包管理\n\n要与 Go 工具链中的各种工具交互，我们只需要拥有\
    \ Go CLI。在 Go CLI 中，各种工具帮助我们启动项目。我们完成了项目规划，现在想开始。我们将运行以下命令来初始化一个项目：\n"
