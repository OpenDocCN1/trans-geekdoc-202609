  trans: "\n\n# 生产维护\n\n本章将重点关注我们的服务在生产环境中运行时必须考虑的各个方面。一个当前稳定且运行在生产环境中的服务，并不意味着它将持续正确运行。无人维护的生产服务就像被忽视的花园\
    \ —— 会随时间枯萎。许多事情正在我们不知不觉中发生 —— 发现新漏洞、新客户带来我们未曾经历的新场景、扩缩容效应，等等。维护是韧性的生命线！\n\n维护不仅包含代码中的\
    \ Bug 和问题。它还包含文化。良好的文化能在不指责特定个人的前提下更快地解决问题。\n\n维护包括观察系统并通过遥测监控正在发生的事情。遥测数据可以是日志、指标和追踪。我们应致力于实现可观测性，这将使我们能够掌控系统。当我们观察到问题或\
    \ Bug 时，我们会想要解决它并寻找解决方案 —— 故障排查。本章将深入探讨故障排查流程及其包含的内容。\n\n在使用微服务系统时，分布式维护的力量至关重要，没有它，微服务架构的威力将大打折扣。\n\
    \n## 结构\n\n在本章中，我们将讨论以下主题：\n\n*   监控\n*   可观测性\n    *   日志\n    *   指标\n    *\
    \   追踪\n*   生产故障排查\n    *   理论的力量\n*   性能分析\n    *   PGO\n    *   性能问题\n*   告警\n\
    \    *   性能指标\n\n## 监控\n\n监控使利益相关者能够深入了解远程环境（如生产环境或预发布环境）的工作原理。它是持续观察、收集和分析系统性能、健康状况和行为数据的过程。这确保系统运行良好且符合预期。\n\
    \n监控**持续观察**并分析应用程序、基础设施和服务的性能、健康状况和可用性，以检测并响应实时问题，确保最佳运行。它涉及收集指标、日志和其他数据，以洞察系统行为并识别潜在问题或改进点。\n\
    \n监控帮助我们检测系统和服务中的趋势与异常。通过为我们关心的数据设置预定义的阈值和条件，我们可以基于监控定义告警或通知。\n\n通常，我们可以通过仪表盘查看监控输出，以了解正在发生的事情。\n\
    \n![](img/Figure-10.1.jpg)\n\n**图 10.1：** 监控仪表盘示例\n\n上图展示了一个监控仪表盘示例。\n\n监控和 APM\
    \ 是经常互换使用的概念。APM 代表应用性能监控，是监控的一个子集，用于跟踪特定应用程序的性能。APM 跟踪应用程序是否稳定可用，以及错误率、延迟等。监控是一个更广泛的主题，可以描述性能以外的事物，如趋势、付费客户数量、地理规格数据、SLO（服务等级目标）等。市场上知名的监控工具示例包括\
    \ `Prometheus`、`DataDog` 和 `NewRelic`。\n\n## 可观测性\n\n可观测性是衡量系统当前状态并将所有数据聚合为历史视图的能力。可观测性使用三种类型的遥测数据\
    \ —— 日志、指标和追踪。这也是它们被引入的历史顺序。\n\n我们可以将可观测性视为一种系统属性，类似于功能性或可测试性。\n\n可观测性让我们理解系统行为**为何**以及**如何**呈现当前状态，这与监控不同，监控通过分析让我们了解**发生了什么**。\n\
    \n我们将利用可观测性的力量来解决实际和潜在的问题。没有可观测性，我们就无法维护系统，也无法进行故障排查，后者将在本章后面讨论。\n\n区分监控和可观测性的一个好比喻是将我们的系统视为一名患者。监控就像查看患者的生命体征（心跳、血压、体温、伤情等）。而在另一端，要治愈患者，我们需要查看其历史病历，并调查关于他为何生病的具体理论。\n\
    \n部署微服务架构时，我们必须创建一个监控系统。在使用 `Kubernetes` 时创建监控系统包含三个部分：\n\n*   **集中式监控系统：** 一个从各种来源聚合数据的统一平台，提供查看和分析工具。我们可以使用开源工具如\
    \ `Prometheus` 和 `Grafana`，或 SaaS 工具如 `DataDog` 和 `NewRelic`。\n*   **代理：** 它们将所有遥测数据上报给集中式监控系统，通常是作为\
    \ `DaemonSet` 运行在每个节点上。\n*   **SDK：** 对于我们使用的每种语言，我们必须实现支持通过函数、中间件等上报遥测数据的逻辑。\n\
    \n让我们探讨这三种遥测数据类型。\n\n## 日志\n\n日志是软件应用程序或系统生成的事件、操作或消息的记录，用于故障排查、监控和分析。日志可用于提供信息和报告警告或错误。通过日志，我们可以了解**发生了什么以及何时发生**，就像在代码中留下面包屑。日志应采用人类可读的\
    \ JSON 格式编写，而不仅仅是纯文本，尽管纯文本也是一种选项。日志由元数据（日期、服务等）、日志级别和日志内容本身组成。通常，日志元数据是手动注入日志或在使用\
    \ SDK 过程中注入的。以下是常见的日志级别：\n\n*   **Info（信息）：** 有用的信息；通常我们不太关心它们。它通常是默认日志级别。\n*\
    \   **Debug（调试）：** 此日志旨在记录用于调试目的的详细信息。它将来会被删除。\n*   **Warning（警告）：** 系统中任何可能导致错误的情况。可以是延迟、高延迟等。这类日志从不需要立即补救。\n\
    *   **Error（错误）：** 此日志指示发生了严重问题，通常需要用户干预。它通常需要立即关注。\n*   **Fatal（致命）：** 导致服务宕机或重启的错误。这是一种极端情况，将需要即时响应。\n\
    \n以下是一些日志示例：\n\n*   `[INFO] User was logged into the system. { “name”: “John”,\
    \ “company”: “Nick”}`\n*   `[DEBUG] Query was executed. { “query”: “SELECT * FROM\
    \ accounts”, “execution_time”: “15s”}`\n*   `[WARNING] Event took a lot of time\
    \ to proceed. { “event_id”: “12345”, “time”: “30s”}`\n*   `[ERROR] Unable to connect\
    \ to the external API. Retrying in 2 seconds.`\n*   `[FATAL] Server got panic.\
    \ Shutting down the application`\n\nGolang 的核心包之一是 `log`，它包含日志功能。一个具有更高级选项的替代包是\
    \ `github.com/sirupsen/logrus`。\n\n## 指标\n\n指标是表示为数据点的定量测量。指标可以包含标签。标签代表指标上的元数据；示例包括账户名、用户名、环境、应用版本等。我们可以基于一段时间内的指标数据点，在任何监控系统中构建不同布局形式的图表。我们也可以使用指标标签和定义的指标聚合时间持续时间来创建分区图表。\n\
    \n指标类型多种多样。这里我们将提及三种主要类型。\n\n*   **Counter（计数器）：** 这是一种累积指标，代表一个可以增加或重置为零的值。计数器指标的示例可以是失败请求数、总请求数、使用系统的用户数量等。\n\
    \n"
