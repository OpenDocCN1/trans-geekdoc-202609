    在*第 3 章 Go 基础*中，我们讨论了 Go 的文件夹结构。我们将把该文件夹结构与 API 文件夹结构合并为一个统一的结构。设计良好的文件夹结构将满足开发人员的需求。从入职开始——无论他们是否了解该项目——导航都将毫不犹豫，直到编写代码——知道在哪里查找逻辑、在哪里添加新资源或能力。


    这里我们将展示两种著名的文件结构，但首先，让我们观察它们的共同点。


    ```

    ![](img/Figure-7.5.jpg)

    ```


    **图 7.5：** API 结构的最高层级


    第一个文件夹是 `cmd`，我们已经讨论过，但现在我们有了另一个可执行文件：`docs`。


    ```

    ![](img/Figure-7.6.jpg)

    ```


    **图 7.6：** API 中的 cmd 结构


    `docs` 目录包含另一个 `main.go`，它是入口点，类似于服务端的 `main.go`，但用于部署文档。我们可以使用 Swagger UI 基于
    `swagger.yaml` 生成 UI。


    第二个目录名是 `deploy`，它包含部署可执行文件及其他与服务端相关资产的所有配置，例如网络、配置、自动扩缩容等。`pkg` 和 `scripts` 目录的用途与第
    3 章所述相同——它们分别包含服务端间共享的代码和脚本。文件 `go.mod`、`go.sum`、`README.md` 和 `Dockerfile` 将位于主目录中。


    在两个 API 结构示例中，我们将遵循杂货店的结构。为简单起见，我们将商店中的产品分为两类（即 OpenAPI 中的标签）——**水果**和**蔬菜**。


    对于水果类别，我们有苹果和香蕉。对于蔬菜类别，我们有西红柿和黄瓜。每个水果（苹果、香蕉）和每个蔬菜（西红柿、黄瓜）根据 REST 定义都是一个资源。我们可以购买更多黄瓜（CREATE）、查看我们有多少黄瓜（READ）、卖掉一些（DELETE），或更新它们今天的新价格（UPDATE）。


    ```

    ![](img/Figure-7.7.jpg)

    ```


    **图 7.7：** API 内部文件结构 A


    上图展示了选项 A 的文件结构，这是选项 A 与选项 B 的唯一区别。让我们浏览一下其中的目录和文件。


    *   `common`：此目录包含所有资源共用的样板代码、共享功能、工具类以及每个资源所需的抽象。例如，名为 `query-params.go` 的文件有助于序列化请求中的所有查询参数。

