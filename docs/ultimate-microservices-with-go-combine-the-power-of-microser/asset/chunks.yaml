- raw: 'Event-driven architecture is based on the Pub/Sub pattern we learned in the
    previous chapters. We need three components to implement the event-driven architecture:
    publisher, event broker, and consumer, as discussed in the Pub/Sub pattern. Here
    are common usages of event-driven architecture:


    *   **Tracking another system’s events**: If we want to create a system that tracks
    another system with events, we will probably be forced to build event-driven architecture.


    *   **Auditing**.


    *   **Big Data processing**: The CRUD operation can create many collisions; moving
    to event-driven architecture can reduce that friction.


    *   **Backend processing**: Due to requirements of business logic.


    **Pros**


    *   **Decoupled Services**: Like microservices, event-driven architecture helps
    us even more to reduce the friction between services and turn them into loosely
    coupled.


    *   **Scalability**: For the same reason, Pub/Sub helps us scale. We can control
    the producer and consumers separately, scale them separately, handle failures,
    deploy new versions, and more.


    **Cons**


    *   **Data consistency**: The downside of segregating publishers and subscribers
    is that subscribers may experience delays in processing events, mainly when dealing
    with a high volume of messages. Maintaining consistency and processing events
    becomes challenging, especially when events involve logic correlated with others
    or interactions with third-party services.


    *   **Duplicate events**: Event-driven architecture works with breakpoints. If
    something terrible happens, we can always “*redrive*” events from the previous
    checkpoint. The problem is that we may already have processed some events until
    the failure, so we must process the same events again.


    *   **Complexity**: As mentioned a few times in this book - our system will become
    more complex when we add more components and services.


    # [Event Sourcing](#toc.xhtml#s126a)


    Event sourcing is a pattern that helps to leverage the benefits and characteristics
    of events. Due to the power of the events, we don’t have to expose `update` and
    `delete` operations. Instead, all the events will always be saved and aggregated
    when requested by a service. This is basically what event sourcing patterns do.
    Typically, services that use the API would like to perform CRUD (create, read,
    update, delete) operations on the data. Instead, the data would look like an aggregation
    of events into a state. The final result should be the same whether or not it
    is used in event sourcing.


    ![](OEBPS/images/Figure-6.8.jpg)


    **Figure 6.8:** Event sourcing vs. CRUD operations.


    Event sourcing “*shrinks*” the amount of CRUD operations. It “*disables*” the
    Update and Delete operation, “*enables*” only Create operation, and creates an
    alternative for the Read operation. This pattern has two advantages, including:


    *   **Immutability**: Everything is retained and updated. The original data is
    being saved, and we don’t have to guess what the original data was. We get powerful
    visibility without significant effort of what exactly happened.


    *   **Replayability**: Bugs and problems will occur, eventually. In other scenarios,
    we had nothing to do with that. But now, we have all the data (events) needed
    to stream the event from when the bug was introduced.


    The significant disadvantage of this pattern is that now we need to store much
    more data! Handling a large amount of data reveals many hidden problems. For example,
    we’ll have to manage data retention, indexing, and integrity; this is just the
    tip of the iceberg. We can achieve data retention only when we know that we don’t
    need those events at some point.


    Instead, the querying time can be prolonged because we need to perform aggregation
    in each request, but for that, we have CQRS.


    # [CQRS](#toc.xhtml#s127a)


    CQRS, which stands for Command and Query Responsibility Segregation, is a pattern
    that helps us perform updates and reads in independent processes. CQRS is based
    on an event sourcing pattern. CQRS pattern aims to create a segregation between
    writing and reading handlers. As we mentioned, the user eventually wants to retrieve
    data, but the data is saved as a group of events. Instead of calculating the aggregation
    on each read request, each time an event is handled (creation), it triggers an
    aggregation of all the events with some logic. Finally, it will save the aggregation
    as a state into a view. A handler will expose an API to read the data from the
    view.


    ![](OEBPS/images/Figure-6.9.jpg)


    **Figure 6.9:** CQRS standard usage


    The preceding figure shows three types of events - `EventA`, `EventB`, and `EventC`.
    All those event types are streaming events into the handlers (there is a Pub/Sub
    between them that we didn’t draw). Then, the handlers write all the events into
    the `Tables`. Each write triggers a logic that calculates a state and writes that
    state into the `View`. When the user in the figure (`Reader)` wishes to read the
    data, it requests the `View` (green arrow) and not the `Tables` (red arrow).


    The great advantage of CQRS is obvious - it gives us a fast read! Although the
    great advantage, there are two drawbacks to CQRS:


    *   We need to reduce all the events into a state, which sometimes can be a lot
    of data and consequently taking a long time to execute.


    *   The read is not available immediately after the write.


    # [Conclusion](#toc.xhtml#s128a)


    In this chapter, we briefly introduce the core elements of microservices architecture.
    Although we didn’t delve into each element and pattern, we got a clear, bounded
    understanding of the significant elements of microservices architecture. Often,
    we won’t use all the elements we described in this chapter in each microservices
    architecture. However, most of the patterns described in this chapter are implemented
    in various ways in most microservices architectures. Also, remember that we are
    developers, and the operations person (usually DevOps) will probably craft all
    those elements. They will set up all the necessary infrastructure to deploy our
    applications and services into production. As developers, we must understand how
    the entire system’s operations work. This knowledge will assist us in understanding
    the boundary between our singular service to other services and the whole system.


    All the elements we described don’t include the business logic of our business.
    The business logic influences the decisions and designs of the elements discussed
    in this chapter. We didn’t delve into the practices of writing a single service,
    which is the business logic. This is what we need to do in the next chapter. We
    will delve into the best practices and techniques for writing a specific service
    with Go in microservices architecture.


    # [References](#toc.xhtml#s129a)


    *   [https://www.thegeekyminds.com/post/how-microservices-communicate#:~:text=Message%20Brokers%20%2D%20Software%20tools%20called,an%20intermediate%20between%20various%20systems](https://www.thegeekyminds.com/post/how-microservices-communicate#:~:text=Message%20Brokers%20%2D%20Software%20tools%20called,an%20intermediate%20between%20various%20systems)


    *   [https://www.nginx.com/blog/service-discovery-in-a-microservices-architecture/](https://www.nginx.com/blog/service-discovery-in-a-microservices-architecture/)


    *   [https://www.nginx.com/learn/api-gateway/#:~:text=An%20API%20gateway%20is%20a%20data%2Dplane%20entry%20point%20for,%2C%20routing%2C%20and%20load%20balancing](https://www.nginx.com/learn/api-gateway/#:~:text=An%20API%20gateway%20is%20a%20data%2Dplane%20entry%20point%20for,%2C%20routing%2C%20and%20load%20balancing)


    *   [https://www.nginx.com/resources/glossary/load-balancing/](https://www.nginx.com/resources/glossary/load-balancing/)'
