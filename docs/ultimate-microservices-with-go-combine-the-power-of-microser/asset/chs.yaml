  \n\n\n\n\n\n\n\n\n\n\n\n## 献给\n\n*我挚爱的母亲：*\n\n*Anat Shtein*\n\n*一路支持我的所有人*\n\n*亲爱的读者，感谢您让这段旅程变得有意义*\n\
  \n## 作者简介\n\n**Nir Shtein** 是一位多才多艺的工程师、讲师、公开演讲者和作家，深耕开源软件 (OSS)、Kubernetes、Golang、DevOps\
