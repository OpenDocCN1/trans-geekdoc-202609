  \n## 第 3 章\n\n### Go 核心要点\n\n### 简介\n\n本章将深入探讨 Go 的基本方面，包括其基本语法、模式、惯例、风格，以及成为熟练\
  \ Go 开发人员所需的一切基本知识。它将为新手和经验较浅的 Go 开发人员提供阅读本书所需的最低限度知识。\n\n\n\n\n\n#### 结构\n\n在本章中，我们将讨论以下主题：\n\
  \n*   Golang 基础概览\n*   打包 —— 包之间的访问\n*   项目结构\n*   结构体\n*   组合\n*   接口\n\n### Golang\
  \ 基础概览\n\n让我们开始探索 Go 的基本语法吧！\n\n任何编程语言都有各种各样的语法、关键字、库等。我们的目的并非涵盖所有内容。为此，欢迎您阅读 Go\
  \ 官方文档。\n\n我们将专注于核心要点，以便您能够继续阅读本书，而无需查阅外部资料。\n\n关于 Go 的所有约定和风格，我们建议您阅读 Uber 的 Go\
  \ 风格与约定指南，它非常实用且易读。该指南已附在参考资料中。我们旨在提供 Go 最核心、最基础的风格和约定。\n\n### Hello World\n\n我们将从最基础的代码示例开始\
  \ —— 一个 Golang 的 “Hello World” 程序示例。\n\n```\npackage main\n\nimport \"fmt\"\n\n\
  func main() {\n    fmt.Println(\"Hello World!\")\n}\n```\n\n我们用来运行程序的命令是：\n\n`go\
  \ run Chapter-4/Hello-World/main.go`\n\n第一行：\n\n`package main`\n\n在 Go 中，我们使用保留关键字\
  \ `package`，然后指定包名；在本例中，包名为 `main`。入口点包必须是 `main` 才能启动 Go 程序。\n\n声明包之后，我们将使用关键字\
  \ `import` 声明导入，并指定要导入的包。在本例中，我们使用的包名是 `fmt`。\n\n我们可以用同样的方式声明多个包：\n\n```\nimport\
  \ (\n    \"fmt\"\n    \"os\"\n)\n```\n\n声明完包和导入后，我们可以声明类型、常量、方法和函数。在示例中，我们在 `main`\
  \ 包中声明了一个名为 `main` 的函数，这是程序的入口点。\n\n我们通过使用关键字 `func` 来声明函数，然后指定函数名、参数，用 `{` 开启作用域，用\
  \ `}` 关闭作用域。\n\n`main()` 函数作为 Go 程序的入口点起着至关重要的作用，程序从此开始执行。它不是一个普通函数；它是启动程序进程的运行点，对任何\
  \ Go 应用程序都必不可少。\n\n最后一行：\n\n`fmt.Println(\"Hello World!\")`\n\n这行代码的功能是打印字符串 `Hello\
  \ World!`。我们使用了 `Println` 函数，它是 `fmt` 包内的一个函数。\n\n另一个重要且保留的函数（除了 `main`）是 `init()`。它会在程序启动时运行；它是唯一在\
  \ `main()` 之前运行的函数。\n\n### 变量\n\n在 Go 中有三种声明变量的方式。\n\n第一种方式如下：\n\n`var emptyMessage\
  \ string`\n\n这里，我们声明关键字 `var`，然后是变量名 `emptyMessage`。在示例中，该变量的类型为 string。\n\n也可以在声明时给变量赋值：\n\
  \n`var message string = \"This is a message\"`\n\n请注意，如果我们不像第一个示例那样给它一个初始值，它将获得一个默认值。每种基本数据类型都有不同的默认值，指针为\
  \ `nil`，结构体为空结构体值。我们将在本章后面详细说明基本数据类型的默认值。\n\n第二种声明变量的方式是让 Go 编译器自行推断变量类型。\n\n`var\
  \ inferredMessage = \"This is an inferred message\"`\n\n在该示例中，我们不必声明 `string`。Go\
  \ 编译器从语法中推断出了它。\n\n在 Go 中声明变量的第三种方式是使用 `:=`。\n\n`alsoInferredMessage := \"This is\
  \ also an inferred message\"`\n\n这里，我们不必声明关键字 `var` 或 `string`，只需 `:=` 即可。\n\n在\
  \ Go 中，变量在运行时不能改变其类型，因为 Go 是一门静态编程语言，正如我们在 *第 2 章，Go 的可用性* 中所见。\n\n除非我们希望它们是公开的（此时为\
  \ PascalCase），否则 Go 中变量、函数、映射、结构体以及我们声明的所有内容的约定均为 camelCase。我们将在本章讨论访问修饰符。\n\n###\
  \ 基本数据类型\n\n让我们看看这段代码块：\n\n```\npackage main\n\nimport \"fmt\"\n\nfunc main() {\n\
  \    message := \"This is a message\"\n    fmt.Println(message)\n    var zero int\n\
  \    fmt.Println(zero)\n    number := 42\n    fmt.Println(number)\n    var pi float64\
  \ = 3.14\n    fmt.Println(pi)\n    var booleanVar bool\n    fmt.Println(booleanVar)\n\
  \    trueBooleanVar := true\n    fmt.Println(trueBooleanVar)\n}\n```\n\nGo 中有四种基本数据类型\
  \ —— `string`、`boolean`、`float32`（也包括 `float64`）和 `int`（也包括 `int8`、`int16`、`int32`、`int64`、`uint`、`uint8`、`uint16`、`uint32`、`uint64`）。\n\
  \n*   `string` 用于文本。默认值为空文本 `\"\"`。\n*   `int` 用于整数。默认值为 `0`。\n*   `float32` 用于浮点数。默认值为\
  \ `0`。\n*   `bool` 用于 `true` 或 `false`。默认值为 `false`。\n\n正如我们之前所见，我们可以在不声明类型的情况下声明变量，但类型会被推断。Go\
  \ 会选择最方便的类型。例如，如果我们希望变量是 `int8` 而不是 `int`，我们必须显式声明。否则，Go 编译器会选择 `int`。\n\n### 注释\n\
  \n注释有两种类型：\n\n*   单行\n*   多行\n\n这是一个单行示例：\n\n```\nfunc main() {\n    // This is\
  \ simple comment\n}\n```\n\n这是一个多行示例：\n\n```\n/*\nThis is a multi-line comment\n\
  */\nfmt.Println(\"Hello World!\")\n```\n\n单行注释使用 `//`，多行注释以 `/*` 开始，以 `*/` 结束。\n\
  \n### 运算符\n\n让我们在这里列举 Go 中所有运算符的示例。Go 中的运算符与其他编程语言非常相似。\n\n```\npackage main\n\n\
  func main() {\n    // 算术运算符\n    x := 5 + 5  // 10\n    x = 5 - 5   // 0\n    x\
  \ = 5 * 5   // 25\n    x = 5 / 5   // 1\n    x = 5 % 5   // 0\n    x++         //\
  \ 6\n    x--         // 5\n\n    // 比较运算符\n    y := 5 == 5 // true\n    y = 5 !=\
  \ 5  // false\n    y = 5 > 5   // false\n    y = 5 < 5   // false\n    y = 5 >=\
  \ 5  // true\n    y = 5 <= 5  // true\n\n    // 逻辑运算符\n    a := true && true  //\
  \ true\n    a = true && false  // false\n    a = true || true   // true\n    a =\
  \ true || false  // true\n    a = !true          // false\n    a = !false      \
  \   // true\n\n    // 位运算符\n    b := 5 & 5  // 5\n    b = 5 | 5   // 5\n    b =\
  \ 5 ^ 5   // 0\n    b = 5 << 5  // 160\n    b = 5 >> 5  // 0\n\n    // 赋值运算符\n \
  \   c := 5\n    c += 5  // 10\n    c -= 5  // 5\n    c *= 5  // 25\n    c /= 5 \
  \ // 5\n}\n```\n\n### `If` 语句\n\n与其他语言一样，存在的关键字是 `if` 和 `else`。此外，它们的用法完全相同。\n\n\
  #### 循环\n\n\n\n\n\n### Go 语言基础语法\n\n#### 循环\n\nGo 语言中有多种循环方式；它们都使用 `for` 关键字。使用\
  \ `break` 跳出循环，使用 `continue` 进入下一次迭代。\n\n```go\nfunc main() {\n\t// for 循环：包含初始化、条件、后置语句\n\
  \tfor i := 0; i < 5; i++ {\n\t\tprintln(i)\n\t}\n\n\t// for 循环：仅包含条件，类似 \"while\"\
  \n\ti := 0\n\tfor i < 5 {\n\t\tprintln(i)\n\t\ti++\n\t}\n\n\t// for 循环：无条件，类似 \"\
  while true\"\n\ti = 0\n\tfor {\n\t\tprintln(i)\n\t\ti++\n\t\tif i >= 5 {\n\t\t\t\
  break\n\t\t}\n\t}\n\n\t// for 循环：配合 continue\n\tfor i := 0; i < 5; i++ {\n\t\tif\
  \ i%2 == 0 {\n\t\t\tcontinue\n\t\t}\n\t\tprintln(i)\n\t}\n\n\t// for 循环：配合 range\n\
  \ts := []int{1, 2, 3}\n\tfor k, v := range s {\n\t\tprintln(k, v)\n\t}\n}\n```\n\
  \n注意 Go 中没有 `while` 关键字。实现 while 循环只需使用 `for`（带或不带条件）。\n\n最后一个 `range` 示例是 Go 特有的。`range`\
  \ 关键字让我们可以遍历数组、切片、映射等可迭代类型。\n\n#### 数组\n\nGo 中声明数组有两种方式：\n\n```go\nfunc main() {\n\
  \t// 声明一个包含 5 个整数的数组\n\tvar a = [5]int{1, 2, 3, 4, 5}\n\t// 声明一个长度自动推断的数组\n\tvar\
  \ b = [...]int{1, 2, 3}\n}\n```\n\n第一个示例（`var a = [5]int{1, 2, 3, 4, 5}`）显式指定长度为\
  \ 5。第二个示例（`var b = [...]int{1, 2, 3}`）由编译器推断长度。当然，也可以不使用 `var` 关键字，直接用 `:=` 简短声明。\n\
  \nGo 数组只能存储同一类型元素，且长度不可变。\n\n#### 切片\n\n切片与数组非常相似，但更加灵活。切片长度可在运行时动态改变，是 Go 的核心优势之一。声明切片的方式如下：\n\
  \n```go\nmySlice := []string{\"nir\", \"david\"}\n```\n\n语法与数组几乎相同，但无需声明大小（或用 `...`\
  \ 推断）。另一种声明方式是使用 `make` 关键字：\n\n```go\nmySlice := make([]type, length, capacity)\n\
  ```\n\n`length` 表示切片当前包含的元素数量，`capacity` 表示底层数组从切片第一个元素起的容量。`capacity` 始终大于或等于 `length`。\n\
  \n用于获取数组、切片长度和容量的两个内置函数是 `len`（长度）和 `cap`（容量）。\n\n```go\nslice := make([]int, 2,\
  \ 5)\nfmt.Println(slice)  // [0 0]\nfmt.Println(len(slice))  // 2\nfmt.Println(cap(slice))\
  \  // 5\n```\n\n切片/数组的一个便捷操作是切片截取。示例如下：\n\n```go\nmyArray := [5]int{1, 2, 3, 4,\
  \ 5}\nslice = myArray[1:4] // 从索引 1 到 4（不包含 4）\nfmt.Println(slice) // [2 3 4]\n\
  ```\n\n#### 函数\n\nGo 函数支持返回多个不同类型的参数：\n\n```go\nfunc myFunction(amount int, prefix\
  \ string) string {\n\treturn fmt.Sprintf(\"%s: %d\", prefix, amount)\n} // Input:\
  \ 5, \"nir\" | Output: \"nir: 5\"\n\nfunc multipleReturns(prefix string, amount\
  \ int) (string, int) {\n\tamount++\n\treturn fmt.Sprintf(\"%s: %d\", prefix, amount),\
  \ amount\n} // Input: \"nir\", 5 | Output: \"nir: 6\", 6\n\nfunc namedReturnValues(prefix\
  \ string, amount int) (result string, newAmount int) {\n\tamount++\n\tresult = fmt.Sprintf(\"\
  %s: %d\", prefix, amount)\n\tnewAmount = amount\n\treturn\n} // Input: \"nir\",\
  \ 5 | Output: \"nir: 6\", 6\n```\n\n第一个示例（`myFunction`）展示了使用 `func` 和 `return` 关键字的简单函数。第二个示例（`multipleReturns`）展示多返回值函数。第三个示例（`namedReturnValues`）展示具名返回值函数（单个具名返回值也合法）。\n\
  \nGo 函数的一个重要特性是 `defer`。`defer` 关键字注册的函数会在外层函数执行完毕后执行。示例如下：\n\n```go\nfunc functionWithDefer()\
  \ {\n\tdefer fmt.Println(\"This will be printed last\")\n\tfmt.Println(\"This will\
  \ be printed first\")\n} \n// Output: \n// This will be printed first\n// This will\
  \ be printed last\n\nfunc functionWithMultipleDefers() {\n\tdefer func() {\n\t\t\
  fmt.Println(\"This will be printed last\")\n\t}()\n\tdefer fmt.Println(\"This will\
  \ be printed second\")\n\tfmt.Println(\"This will be printed first\")\n}\n// Output:\n\
  // This will be printed first\n// This will be printed second\n// This will be printed\
  \ last\n```\n\n示例直观地说明了 `defer` 的执行顺序（后进先出）。\n\n在 Go 中，函数是一等公民，可作为参数传递、作为返回值返回、赋值给变量。这支持高阶函数和函数式编程模式。\n\
  \n#### 映射\n\nGo 映射用于存储键值对数据。`map` 的零值是 `nil`。映射持有对底层哈希表的引用。声明映射及常用操作如下：\n\n```go\n\
  fruitsPrices := map[string]int{\n\t\"orange\": 10,\n\t\"apple\":  20,\n\t\"banana\"\
  : 15,\n}\n\nfmt.Println(fruitsPrices) // Output: map[apple:20 banana:15 orange:10]\n\
  \n// 添加键值对\nfruitsPrices[\"mango\"] = 25\nfmt.Println(fruitsPrices) // Output: map[apple:20\
  \ banana:15 mango:25 orange:10]\n\n// 删除键值对\ndelete(fruitsPrices, \"orange\")\n\
  fmt.Println(fruitsPrices) // Output: map[apple:20 banana:15 mango:25]\n\n// 获取值\n\
  fmt.Println(fruitsPrices[\"apple\"]) // Output: 20\n\n// 获取不存在的键（返回类型零值）\nfmt.Println(fruitsPrices[\"\
  grapes\"]) // Output: 0 (int 的零值)\n\n// 检查键是否存在\nprice, ok := fruitsPrices[\"grapes\"\
  ]\nfmt.Println(price, ok) // Output: 0 false\n\n// 遍历映射\nfor fruit, price := range\
  \ fruitsPrices {\n\tfmt.Printf(\"%s: %d\\n\", fruit, price)\n} // Output: apple:\
  \ 20 banana: 15 mango: 25 (顺序不固定)\n\nfmt.Println(len(fruitsPrices)) // Output: 3\n\
  \n// 创建空映射\nemptyMap := make(map[string]int)\nfmt.Println(emptyMap) // Output: map[]\n\
  ```\n\n#### Switch 语句\n\n使用 `switch` 语句从多个代码块中选择一个执行。Go 中不需要 `break` 关键字；每个 `case`\
  \ 默认自动终止。若需穿透到下一个 `case`，使用 `fallthrough` 关键字。典型示例：\n\n```go\nfunc main() {\n\t\
  printString(\"b\") // b\n\tprintString(\"a\") // a b\n}\n\nfunc printString(str\
  \ string) {\n\tswitch str {\n\tcase \"a\":\n\t\tprintln(\"a\")\n\t\tfallthrough\n\
  \tcase \"b\":\n\t\tprintln(\"b\")\n\tdefault:\n\t\tprintln(\"default\")\n\t}\n}\n\
  ```\n\n若无 `case` 匹配，则执行 `default` 分支。\n\n#### 常量\n\n常量使用 `const` 关键字声明，作用域与变量相同。运行时常量不可修改。常量类型包括数字、字符（rune）、字符串、布尔值。（关于\
  \ rune 详见参考资料 5）。示例：\n\n```go\nconst str string = \"const string\"\n\nconst (\n\t\
  _ = iota\n\tone\n\ttwo\n\tthree\n)\n\nfunc main() {\n\tprintln(str)       // string\n\
  \t// str = \"new string\" // 编译错误：cannot assign to str\n\tprintln(one)   // 1\n\t\
  println(two)   // 2\n\tprintln(three) // 3\n}\n```\n\n首先，声明常量字符串很直观。示例中显式写了 `string`\
  \ 类型，其实可省略。\n\n其次是 `iota` 示例。`iota` 是 Go 中的常量生成器，初始值为 0，每行递增 1，常用于声明枚举常量，保持代码可读性。\n\
  \n#### 其他语言规范\n\n\n\n\n在接下来的章节中，我们将介绍前面章节未涵盖的不同主题，例如字节、错误、通道、Goroutine、泛型、结构体、接口、库、指针、空接口、类型转换等。我们始终可以查阅\
  \ Go 语言规范。\n\n### 包\n\nGo 中的包是将程序划分为较小部分的一种方式。Go 编译器附带了几个广泛通用且流行的标准包。这些包包括 `fmt`、`log`、`net`、`strconv`、`strings`、`sync`、`testing`、`os`、`math`、`errors`\
  \ 等。\n\n我们可以在 [`pkg.go.dev/`](https://pkg.go.dev/) 探索所有可公开使用的 Go 包。\n\n正如 Hello\
  \ World 简介中提到的，我们在文件开头使用 `import` 关键字导入包。此外，我们还可以选择重命名包，如下所示：\n\n```go\nimport (\n\
  \tf \"fmt\"\n\t\"math\"\n)\n```\n\n我们将 `fmt` 重命名为 `f`。Go 中包的命名约定是简短的，主要为单个单词（如名词）。除了\
  \ a-z 和数字外，包名称中唯一可用的字符是 `_`。\n\nGo 中的命名对于包外部的访问或查看至关重要。它由变量的首字符是否为大写决定（函数、常量、结构体等同理）。\n\
  \n```go\nconst myName = \"jack\" // 不公开\nconst MyName = \"jack\" // 公开\n```\n\n\
  要开展项目工作，我们需要初始化一个新模块。为此，我们需要运行类似以下的命令：\n\n```bash\ngo mod init github.com/nir/mymodule\n\
  ```\n\n它将创建一个名为 `go.mod` 的新文件，其中包含模块名称、Go 版本、整个包以及我们在该模块中使用的版本。\n\n在声明我们想要使用的模块后，`go.mod`\
  \ 文件应如下所示：\n\n```go\nmodule github.com/OrangeAVA/Microservices-with-Go\n\ngo 1.21.0\n\
  \nrequire (\n\tgithub.com/gin-gonic/gin v1.9.0\n)\n```\n\n要下载包，我们应该运行：\n\n```bash\n\
  go mod download\n```\n\n它将创建/更新一个名为 `go.sum` 的文件，该文件维护项目中使用的依赖项的校验和。`go.sum` 文件确保项目在后续构建中使用完全相同版本的依赖项，从而提高构建过程的可重现性和安全性。我们无需更改或编辑此文件，因为它由\
  \ Go 工具链自动生成。\n\n有时，我们可能会在包需求后遇到 `// indirect`。当我们在项目中不直接使用该模块，但我们的某个依赖项依赖它时，就会发生这种情况。\n\
  \n一个方便的命令可以帮助我们仅包含所需的导入：\n\n```bash\ngo mod tidy\n```\n\n此命令会移除所有我们未使用的依赖项。\n\n\
  ### 项目结构\n\n关于项目结构有许多实践和用例。我们将详细阐述重要的几种。更详细的文件结构见参考资料。以下是 Go 项目标准的关键文件和目录树。\n\n\
  ![图 3.1：Go 中的最小文件结构](img/Figure-3.1.jpg)\n\n正如我们之前所见，启动 Go 项目必须拥有 `go.mod` 和 `go.sum`\
  \ 文件。除了这些文件外，还有三个关键目录：`cmd`、`internal` 和 `pkg`。\n\n*   **`cmd` 目录** - 包含我所有代码的入口点，每个程序的目录名称应与二进制文件的名称匹配。\n\
  *   **`pkg` 目录** - 需要包含所有可以与其他服务共享的代码。这应包含对其他服务有用的通用代码。请注意，当我们使用单体仓库工作时，通常所有服务只有一个\
  \ `pkg` 目录，并且每个服务内部没有 `pkg` 目录。\n*   **`internal` 目录** - 服务内部使用的私有包。\n\n### 结构体\n\
  \nGo 的结构体是字段的类型化集合。Go 中的结构体用于创建记录。\n\n以下是我们在 Go 中声明结构体的方式：\n\n```go\ntype user struct\
  \ {\n\tname  string\n\temail string\n}\n```\n\n声明结构体时，我们只能声明结构体字段。创建结构体的另一种方式是通过嵌入结构体：\n\
  \n```go\ntype admin struct {\n\tuser\n\tlevel string\n}\n```\n\n这里，我们将 `user` 结构体嵌入到\
  \ `admin` 结构体中。要创建结构体的新实例，我们需要声明它并包含其参数；如果缺少某个参数，将赋予该参数的默认值。\n\n```go\nu1 := user{\n\
  \tname:  \"john\",\n\temail: \"john@gmail.com\",\n}\nfmt.Printf(\"%+v\\n\", u1)\
  \ // {name:john email:john@gmail.com}\n```\n\nGo 中没有用于创建结构体的内置构造函数。Go 中创建结构体的约定是通过函数，如果该函数是公开的，则应具有\
  \ `new` 或 `New` 前缀，例如：\n\n```go\nfunc newUser(name string) user {\n\treturn user{\n\
  \t\tname:  name,\n\t\temail: fmt.Sprintf(\"%s@gmail.com\", name),\n\t}\n}\n\nu2\
  \ := newUser(\"jack\")\nfmt.Printf(\"%+v\\n\", u2) // {name:jack email:jack@gmail.com}\n\
  ```\n\n我们声明了一个名为 `newUser` 的函数，它仅接受 `name`，并由此生成 email。我们可以使用任何我们认为合适的功能。让我们看一个声明嵌入结构体的示例：\n\
  \n```go\na := admin{\n\tuser: user{\n\t\tname:  \"john\",\n\t\temail: \"john@gmail.com\"\
  ,\n\t},\n\tlevel: \"super\",\n}\nfmt.Printf(\"%+v\\n\", a) // {user:{name:john email:john@gmail.com}\
  \ level:super}\n```\n\n要访问/修改结构体实例的值，我们可以这样做：\n\n```go\nu3 := newUser(\"amanda\"\
  )\nfmt.Printf(\"%+v\\n\", u3) // {name:amanda email:amanda@gmail.com}\nfmt.Println(u3.name)\
  \    // amanda - 我们访问 user 结构体的 name 字段\nu3.name = \"ruth\"        // 我们更改 user\
  \ 结构体 name 字段的值\nfmt.Printf(\"%+v\\n\", u3) // {name:ruth email:amanda@gmail.com}\n\
  ```\n\nGo 支持在结构体类型上定义方法。这意味着我们在与结构体相同的作用域内声明函数并将其分配给结构体。让我们看一个例子：\n\n```go\nfunc\
  \ (u user) Print() {\n\tfmt.Printf(\"Name: %s, Email: %s\\n\", u.name, u.email)\n\
  }\n```\n\n我们在与 `user` 结构体相同的作用域内声明了 `Print` 方法。请注意，此示例是作为值接收者的结构体方法。我们也可以将方法定义为结构体的指针接收者，以便该方法可以修改结构体字段。例如：\n\
  \n```go\nfunc (u *user) ChangeEmail(email string) {\n\tu.email = email\n}\n```\n\
  \n### 组合\n\n组合让我们通过组合更简单的部分来创建复杂的事物，使我们的代码更加模块化和灵活。Go 中不存在继承特性。让我们观察一个组合的例子：\n\n\
  ```go\ntype Animal struct {\n\tSound string\n}\n\nfunc (a *Animal) Speak() {\n\t\
  println(a.Sound)\n}\n\ntype Cat struct {\n\tAnimal // 嵌入\n}\n\ntype Dog struct {\n\
  \tAnimal // 嵌入\n}\n\nfunc main() {\n\tcat := Cat{Animal{\"Meow\"}}\n\tcat.Speak()\
  \ // Meow\n\tdog := Dog{Animal{\"Woof\"}}\n\tdog.Speak() // Woof\n}\n```\n\n我们实现了一个带有\
  \ `Speak` 方法的 `Animal` 结构体。我们还创建了两个不同的结构体 `Cat` 和 `Dog`，它们都嵌入了 `Animal` 结构体。通过这样做，这些结构体继承了\
  \ `Animal` 结构体的所有属性和方法。\n\n### 接口\n\nGo 中的接口与其他语言略有不同。在 Go 中，接口仅包含方法签名，不包含字段。我们无法在\
  \ Go 中创建接口实例，但可以声明一个变量，将其赋值为满足接口方法签名的某个类型。让我们看看下面的例子：\n\n```go\ntype Person struct\
  \ {\n\tName string\n}\n\nfunc (m Person) Print() {\n\tfmt.Println(m.Name)\n}\n\n\
  type DogPerson struct {\n\tName string\n}\n\ntype PrintInterface interface {\n\t\
  Print()\n}\n\nvar PrintableObject PrintInterface = Person{}\nvar PrintableObject2\
  \ PrintInterface = DogPerson{} // 这将在编译时抛出错误\n```\n\n\n\n我们声明了一个名为 `PrintInterface`\
  \ 的接口，包含 `Print()` 签名。当我们声明 `PrintableObject` 时，这是可行的，因为 `Person` 结构体实现了 `Print`\
  \ 方法。另一方面，当我们尝试声明 `PrintableObject2` 时，会导致编译错误，因为 `DogPerson` 结构体不满足 `PrintInterface`\
  \ 接口。\n\nGo 语言中一个至关重要且广泛使用的接口是“空接口”。“空接口”是一种指定零个方法的类型，如下所示：`interface{}`\n\n```go\n\
  var i interface{}\n```\n\n或者\n\n```go\nvar myName interface{}\n```\n\n空接口之所以独特，是因为它可以容纳任何类型的值（每种类型至少实现了\
  \ 0 个方法）。其主要用途是处理未知情况，我们将在本书中多次遇到此类情况。\n\n### 结论\n\n我们已经涵盖了理解本书所需的基础知识和语法。我们介绍了任何编程语言的基础——变量、循环、运算符、代码风格、数组、映射和注释。我们还介绍了与\
  \ Go 相关的特定语法，如包、结构体、接口和项目结构。请随时通过本章提供的参考资料进一步探索 Go 语言规范。\n\n在接下来的章节中，我们将深入探讨更高级的\
  \ Go 主题，尽管重要的是要承认我们将只涵盖其中的一部分。如果你是 Go 语言的新手，可以自行继续探索 Go 语言。\n\n### 参考资料\n\n*   [`github.com/uber-go/guide/blob/master/style.md`](https://github.com/uber-go/guide/blob/master/style.md)\n\
  *   [`go.dev/doc/effective_go#init`](https://go.dev/doc/effective_go#init)\n*  \
  \ [`go.dev/doc/install`](https://go.dev/doc/install)\n*   [`www.w3schools.com/go/go_variable_naming_rules.php`](https://www.w3schools.com/go/go_variable_naming_rules.php)\n\
  *   [`www.educative.io/answers/what-is-the-rune-type-in-golang`](https://www.educative.io/answers/what-is-the-rune-type-in-golang)\n\
  *   [`github.com/golang-standards/project-layout`](https://github.com/golang-standards/project-layout)\n\
  *   [`go.dev/ref/spec#Clear`](https://go.dev/ref/spec#Clear)\n\n## 第 4 章：踏上 Go 之旅\n\
  \n### 简介\n\n本章将进一步深入探讨 Go 语言编码的复杂性。与前一章不同，所有 Go 开发人员都应该阅读本章。虽然我们仍将涵盖 Go 中的已知主题，但我们将讨论这些主题与微服务之间的联系。我们将介绍\
  \ Go 中存在的设计模式。\n\n设计模式是解决我们作为开发人员遇到的常见问题的好方法，无论我们用哪种语言编写代码。几乎所有已知的设计模式对每种语言都是通用的，且外观相似。有一个名为\
  \ `https://refactoring.guru/design-patterns` 的优秀网站，我们可以在其中查看和探索设计模式。它非常方便，并提供了极佳的示例，演示了各种流行编程语言中的每种设计模式；正如你可能猜到的，其中一种就是\
  \ Golang。\n\n虽然我们不会涵盖 SOLID、YAGNI、KISS 和 DRY 等通用编码原则，但在讨论编码概念时，提及 Uncle Bob 的《Clean\
  \ Code》很重要。这本书是每个开发人员的必读书籍，Uncle Bob 在 YouTube 上也有该书更有趣的视频版本。\n\n我们将介绍 Go 语言中的四个关键概念——泛型、上下文、错误和测试。如果我们掌握了这些，我们的代码将变得更加健壮、可读和可维护。\n\
  \n#### 结构\n\n在本章中，我们将讨论以下主题：\n\n*   函数选项模式\n*   泛型\n*   理解 Go 中的 Context\n*   错误——谈论错误传播\n\
  *   测试——最佳实践、模拟、模糊测试\n*   微服务测试\n\n### 函数选项模式\n\n之所以决定专门关注此模式而非其他设计模式，主要有两个原因。第一个原因是，此设计模式在\
  \ Go 语言环境中相对独特，也是我们能想到的最常用的设计模式之一（也许单例模式或适配器模式更流行）。\n\n该模式有助于清晰、精确地构建 `struct`。这是因为\
  \ Go 不支持重载（重载会创建同名但签名不同的函数）。此外，Go 的函数中没有可选参数。\n\n这两个事实（不支持重载和可选参数）会使构建 `struct`\
  \ 变得非常困难。构建结构体时，如果有许多配置（通常表示为可选参数），代码会变得一团糟。函数选项模式允许我们创建一个单一的结构体构造函数，它接收必需参数和一个可选参数列表。使用此模式的步骤如下：\n\
  \n1.  创建你想要的 `struct`。\n2.  创建一个类型，其名称为结构体名称加上 `Option` 后缀（`{structName}Option`），定义为\
  \ `func(*{structName})`。\n3.  创建构造函数 `New{structName}`，包含必需参数，并添加 `options …{structName}Option`，返回\
  \ `*{structName}`。\n4.  为每个选项创建一个自定义函数。惯例是用 `With` 作为前缀命名这些函数。\n\n让我们通过示例说明这些步骤；我们创建了一个购物客户端结构体，如下所示：\n\
  \n```go\ntype ShoppingClient struct {\n    endpoint    string\n    apiKey      string\n\
  \    userId      string\n    shouldRetry bool\n    timeout     time.Duration\n}\n\
  ```\n\n第二步是创建选项类型：\n\n```go\ntype ShoppingClientOption func(*ShoppingClient)\n```\n\
  \n现在，我们可以编写构造函数，如下所示：\n\n```go\nfunc NewShoppingClient(endpoint string, options\
  \ ...ShoppingClientOption) *ShoppingClient {\n    client := &ShoppingClient{\n \
  \       endpoint: endpoint,\n    }\n    for _, option := range options {\n     \
  \   option(client)\n    }\n    return client\n}\n```\n\n请注意，如果我们不提供任何选项，字段将获得其默认值，除了\
  \ `endpoint`（这是必需字段）。剩下的就是创建选项函数。\n\n```go\nfunc WithApiKey(key string) ShoppingClientOption\
  \ {\n    return func(c *ShoppingClient) {\n        c.apiKey = key\n    }\n}\n\n\
  func WithUserId(id string) ShoppingClientOption {\n    return func(c *ShoppingClient)\
  \ {\n        c.userId = id\n    }\n}\n\nfunc WithTimeout(timeout time.Duration)\
  \ ShoppingClientOption {\n    return func(c *ShoppingClient) {\n        c.timeout\
  \ = timeout\n    }\n}\n\nfunc WithRetry(shouldRetry bool) ShoppingClientOption {\n\
  \    return func(c *ShoppingClient) {\n        c.shouldRetry = shouldRetry\n   \
  \ }\n}\n```\n\n让我们演示该模式的两种用法：\n\n```go\nclient := NewShoppingClient(\"https://api.shopping.com/v1\"\
  ,\n    WithApiKey(\"my-api-key\"),\n    WithTimeout(10*time.Second),\n)\nfmt.Printf(\"\
  %+v\\n\", client) // &{endpoint:https://api.shopping.com/v1 apiKey:my-api-key userId:\
  \ shouldRetry:false timeout:10000000000}\n\nclientV2 := NewShoppingClient(\"https://api.shopping.com/v2\"\
  ,\n    WithRetry(true),\n    WithUserId(\"my-user-id\"),\n)\nfmt.Printf(\"%+v\\\
  n\", clientV2) // &{endpoint:https://api.shopping.com/v2 apiKey: userId:my-user-id\
  \ shouldRetry:true timeout:0}\n```\n\n在示例中，我们创建了两个具有不同配置的客户端。我们在每个示例中仅应用了所需的配置，这就是该模式的优势。请记住这一重要的设计模式，因为它在本书后续内容中将变得非常实用。\n\
  \n### 泛型\n\n泛型是一项新特性，在 v1.18 版本中引入。Go 从 1.18 版本开始支持泛型。在语言的重大新增特性中，泛型作为一个突出的概念脱颖而出。\n\
  \n编程中的泛型让我们能够通过以更灵活的方式处理不同类型的数据，来编写灵活且可复用的代码。\n\n\n\n\n### Go 语言中的泛型\n\n本节将介绍 Go\
  \ 语言泛型的基础知识以及它们与其他语言的不同之处。泛型适用于函数、结构体、接口和映射。Go 语言中的泛型行为与其他语言相似，但存在一些差异。我们假设读者已具备泛型的相关知识。基于此假设，我们将不在此详述泛型的概念。\n\
  \n好的解释始于最简单的示例；以下是一个泛型函数：\n\n```go\nfunc printItT any {\n    fmt.Println(item)\n\
  }\n\nprintIt(1)       // 1\nprintIt(\"Hello\") // Hello\n```\n\n通过使用 `[` 和 `]` 来声明函数的泛型类型，在本例中为\
  \ `any`，用 `T` 表示。与其他拥有泛型的语言主要不同的只有 `any` 关键字。每个泛型表示（在前面的示例中为 `T`）都必须实现一个接口或约束。\n\
  \n对于约束，有两个内置约束：`any` 和 `comparable`。\n\n对于接口，Go 团队为我们提供了一个方便的包 `golang.org/x/exp/constraints`，它为泛型提供了常用的约束接口。\n\
  \n1.  **`Any`**：任意类型，意味着每种类型都能满足此约束。\n2.  **`Comparable`**：适用于可以应用比较运算符（如 `==` 和\
  \ `!=`）的任何类型。映射的键必须是可比较的。\n3.  **接口**：我们可以创建自定义接口作为泛型函数的约束；请见下例：\n\n```go\ntype\
  \ Number interface {\n    int | float64\n}\n\nfunc biggerT Number, K any {\n   \
  \ if a > b {\n        fmt.Println(prefix, a)\n        return\n    }\n    fmt.Println(prefix,\
  \ b)\n}\n\nbigger(1, 2, \"The bigger integer is:\") // The bigger integer is: 2\n\
  bigger(3.0, 2.0, \"The bigger float is:\") // The bigger float is: 3\n```\n\n我们声明了一个名为\
  \ `Number` 的自定义接口，它使用管道符号 `|` 包含两种类型。其他示例与第一个示例类似。\n\n我们也可以将泛型应用于结构体。为多种类型构建灵活的\
  \ `struct` 可能很有优势。让我们以一个存储 `struct` 为例，它可以存储一个项目并获取该项目。\n\n```go\ntype StorageInter[T\
  \ any] interface {\n    GetItem() T\n    StoreItem(T)\n}\n\ntype Storage[T any]\
  \ struct {\n    Item T\n}\n\nfunc (s *Storage[T]) GetItem() T {\n    return s.Item\n\
  }\n\nfunc (s *Storage[T]) StoreItem(item T) {\n    s.Item = item\n}\n```\n\n与上一节讨论的示例相比，前面的代码片段逻辑更复杂。首先，我们声明了一个泛型接口，这在\
  \ Go 中是可行的。然后，我们声明了一个简单的泛型结构体，带有一个名为 `Item` 的属性，其类型为 `T`，且 `T` 的约束为 `any`。接着，我们实现了\
  \ `StorageInter` 接口的函数签名。为了确保结构体实现了该接口，我们声明了以下行：\n\n```go\nvar _ StorageInter[int]\
  \ = &Storage[int]{}\n```\n\n值得一提的是，这是一种非常棒的通用做法（无论是否涉及泛型），用于确保结构体满足接口（声明一个空变量 -\
  \ `_`）。该函数的用法与 Go 中任何结构体的用法相同。唯一的区别是我们需要实例化类型（`[int]`），因为它是泛型。为了更好地理解这一点，让我们讨论以下代码示例：\n\
  \n```go\nvar intStorage StorageInter[int] = &Storage[int]{}\nintStorage.StoreItem(789)\n\
  fmt.Println(intStorage.GetItem())\n\nvar stringStorage StorageInter[string] = &Storage[string]{}\n\
  stringStorage.StoreItem(\"This is a string\")\nfmt.Println(stringStorage.GetItem())\n\
  ```\n\n在前面的两个示例中，我们演示了如何在 Go 中使用泛型 `struct`。在第一个示例中，我们将 `int` 类型应用于 `struct` `Storage`，在第二个示例中，我们将\
  \ `string` 类型应用于 `struct` `Storage`。因为 `StoreItem` 函数的签名是 `StoreItem(item T)`，所以我们在第一个示例中可以传递\
  \ `int`，在第二个示例中可以传递 `string`。\n\n### 理解 Go 语言中的 Context\n\n在 Go 语言中，Context 是每个\
  \ Go 开发者都应了解的核心支柱之一。\n\nGo 团队创建了一个 `Context` 包，帮助我们管理上下文。就这么简单。在幕后，context 是一个结构体。我们只能观察其接口\
  \ - `context.Context`（来自 `context` 包），其定义如下：\n\n```go\ntype Context interface {\n\
  \    Deadline() (deadline time.Time, ok bool)\n    Done() <-chan struct{}\n    Err()\
  \ error\n    Value(key any) any\n}\n```\n\n深入探讨接口签名超出了本章的范围。简单来说，为了理解，我们可以将其分为三个概念：\n\
  \n1.  **管理键值存储**：瞬间之间，我们可以通过键在 context 中保存和检索值。我们可以通过 `context` 包中的函数 `Value(key\
  \ any) any` 从 context 获取值。\n2.  **处理并发**：在下一章中，我们将探讨并发。Context 是一种基本工具，帮助我们利用 goroutine\
  \ 之间的通信。\n3.  **管理任务**：使用 `context`，我们可以通过传递值、取消信号和截止时间（超时）来确保相关任务在需要时能优雅地停止。\n\n\
  要开始使用 `context`，让我们看看如何使用函数 `context.Background()` 从无到有地创建一个 `context`：\n\n```go\n\
  ctx := context.Background()\n```\n\n如果非必要，我们应避免使用此函数，并努力使用父 `context`。稍后我们将看到如何做到这一点。\n\
  \n正如我们所见，context 的目标之一是充当键值存储。让我们看一个示例，旨在将 API 密钥包含在 context 中。\n\n```go\nfunc main()\
  \ {\n    ctx := context.Background()\n    childContext := context.WithValue(ctx,\
  \ \"apiKey\", 123456)\n    printAPIKey(childContext)\n}\n\nfunc printAPIKey(ctx\
  \ context.Context) {\n    apiKey := ctx.Value(\"apiKey\")\n    fmt.Println(\"API\
  \ Key:\", apiKey) // API Key: 123456\n}\n```\n\n我们使用了函数 `context.WithValue`，它接收父\
  \ context 和键值。注意这些函数接收 `any` 类型作为参数（`any` 是空接口 `interface{}` 的别名）。\n\nContext 服务于多种目的，如任务管理、超时、环境变量等。为了演示\
  \ context 的用法，考虑一个任务管理场景，我们必须停止并优雅地终止任务。`Context` 包通过 `WithCancel` 函数提供了解决方案，该函数生成一个用于取消\
  \ context 并添加错误的副函数。这使我们能够使用 `WithCancel` 函数优雅地终止任务，并可以使用 `Err()` 函数检索错误。让我们看一个取消\
  \ context 的示例以便更好地理解。\n\n```go\ncontextWithCancel, cancel := context.WithCancel(ctx)\n\
  cancel()\nfmt.Println(\"What happened ?\", contextWithCancel.Err()) // What happened\
  \ ? context canceled\n```\n\n控制 context 的另一种方式是使用超时。作为演示，我们知道任务必须遵守 30 秒的超时，否则可能会影响我们的数据库。让我们看一个使用函数\
  \ `context.WithTimeout(parent Context, timeout time.Duration) (Context, CancelFunc)`\
  \ 的示例。\n\n```go\ncontextWithTimeout, _ := context.WithTimeout(ctx, 30*time.Second)\n\
  fmt.Println(\"What happened ?\", contextWithTimeout.Err()) // What happened ? <nil>\n\
  time.Sleep(35 * time.Second)\nfmt.Println(\"What happened ?\", contextWithTimeout.Err())\
  \ // What happened ? context deadline exceeded\n```\n\n另一个有用的函数是 `WithDeadline`。该函数允许我们定义\
  \ context 完成的具体时间。注意 `WithTimeout` 函数在幕后使用了 `WithDeadline` 函数。\n\n```go\nfunc WithTimeout(parent\
  \ Context, timeout time.Duration) (Context, CancelFunc) {\n    return WithDeadline(parent,\
  \ time.Now().Add(timeout))\n}\n```\n\n以下是使用 context 时的最佳实践：\n\n\n\n\n\n### Context\
  \ 最佳实践\n\n*   **避免使用** `Background()`：我们应致力于从父 Context 启动一个新的 Context，而不使用 `context.Background()`。我们不想打破当前的生命周期并启动一个新的。我们通常在程序启动时使用此函数。\n\
  *   **并发最佳实践**：将在后续章节中讨论。\n*   **显式传递 Context**：我们应致力于将其作为参数在函数间传递，而不将其用作全局变量。\n\
  *   **优先使用 Cancel 而非 Timeout**：我们始终致力于使用手动取消而非自动取消。手动取消与自动取消的区别在于 `context.WithCancel`\
  \ 和 `context.WithTimeout` 之间的差异。\n\n所有这些最佳实践引导我们进行 Context 传播。\n\nContext 传播涉及持续地传递上下文信息（通常通过函数参数），以在程序或系统的执行过程中保持相关数据。Context\
  \ 传播确保上下文细节在代码的不同部分之间无缝流动。\n\n我们必须避免使用全局环境变量，或反复将同一字段或结构体通过许多函数传递。Context 传播在代码的不同逻辑之间创建了层级关系。例如，如果我们处理一个事件，该事件会触发其他几个子事件。子事件需要来自父\
  \ Context 的所有键值项，但每个子事件需要不同的超时时间。这个例子证明了层级关系至关重要。\n\n![](img/Figure-4.1.jpg)\n\n\
  **图 4.1：** Context 传播\n\n这种层级关系帮助我们控制 Goroutine 之间的生命周期和错误处理。\n\n正如所讨论的，Go 团队发明这门语言的初衷是为了在云端运行。怀揣这一想法，Context\
  \ 显得至关重要。在云环境中工作时，服务间的通信非常频繁。在微服务架构中，这种通信变得更加频繁。\n\n在微服务架构中，每个服务都依赖于其他服务或第三方服务的依赖。Context\
  \ 传播对于传输这些信息至关重要，这些信息可以是认证和授权数据、可观测性数据（追踪、日志）、请求元数据等。\n\n### 错误 —— 谈谈错误传播\n\n错误处理对任何编程语言都至关重要且必不可少。本节将讨论使用\
  \ Go 进行错误处理的用法和实现。\n\n错误处理在 Go 中至关重要，特别是在微服务架构中开发代码时。为什么呢？\n\n当我们遇到 Bug（这会大量发生）时，我们必须做好准备并建立适当的基础设施来调查\
  \ Bug。最令人恼火的是在调查 Bug 时“两眼一抹黑”。我们在编写代码时能做的最好准备，就是进行令人满意的错误处理。\n\n有时，错误可以在许多服务之间传播——例如，一个服务调用内部\
  \ API 失败（由于其内部原因）。乍一看，Bug 在该服务中，但实际上 Bug 在 API 中。如果错误处理做得正确，我们能迅速明白这一点！\n\nGo 中默认的错误值是\
  \ `nil`，`error` 是 Go 中的一种类型。在 Go 中有三种创建错误类型的方法：\n\n第一种方法是使用 `fmt` 包，如下所示：\n\n```\n\
  err := fmt.Errorf(\"a height of %0.2f is invalid\", -2.3333)\nfmt.Println(err.Error())\
  \ // a height of -2.33 is invalid\n```\n\n该示例非常直观。要使结构体成为错误类型，它必须包含 `error` 类型的方法，其签名为\
  \ - `Error()`。该函数将错误作为字符串返回。注意仅在你知道错误不为 nil 时使用它。否则，它会 panic。在 Go 中创建错误的第二种方法是使用\
  \ `errors` 包，如下所示：\n\n```\nerr = errors.New(\"this is an invalid height\")\nfmt.Println(err.Error())\
  \ // this is an invalid height\n```\n\n它的效果与第一个示例相同，但更简洁。在某些场合，按照惯例会使用这种风格而非第一种。我们将在后续章节详细阐述该惯例。在\
  \ Go 中创建错误的第三种方法是通过自定义错误类型。我们需要声明一个结构体，且该结构体应有一个名为 `Error()` 并返回字符串的方法。让我们观察一个示例：\n\
  \n```\ntype ApiError struct {\n    Path       string\n    StatusCode int\n}\n\n\
  func (e *ApiError) Error() string {\n    return fmt.Sprintf(\"API error: %s returned\
  \ a %d\", e.Path, e.StatusCode)\n}\n\nfunc main() {\n    err = &ApiError{Path: \"\
  /api/users\", StatusCode: 500}\n    fmt.Println(err.Error()) // API error: /api/users\
  \ returned a 500\n}\n```\n\n错误处理是一个广泛的话题，我们不会详细涵盖。相反，我们将重点关注以下内容：\n\n*   为什么 Go\
  \ 中的错误处理与其他语言不同\n*   错误是为了讲述一个故事\n*   惯例\n\n如果你想探索错误处理，有一篇关于 Rob Pike 谈论错误处理的优秀文章，已附在参考资料中。\n\
  \n在第二章《Go 的易用性》中，我们详细阐述了上述提到的章节。这些章节只是提醒。注意我们这里不会讨论 panic 和 recover；相反，我们将在后续章节中讨论它们。\n\
  \n#### 错误处理：Go 与其他语言的区别\n\nGo 中的错误处理是不同的。Go 团队在这方面采取了不同的方法。大多数语言包含 `try-catch-finally`。错误最终都会发生，正如我们所知。迟早，我们必须考虑如何处理它们。得益于优秀的错误处理，开发者无法忘记处理错误，并能返回精确的错误信息。\n\
  \n通常，在其他编程语言中，许多错误信息会在大量的 `try-catch` 块中被“吞没”。Go 为我们提供了一种非常方便的多返回值方式，这使得我们能更轻松地正确返回错误。\n\
  \n#### 错误是为了讲述一个故事\n\n在 *第二章，Go 的易用性* 中，我们讨论了在 Go 中使用错误来“*讲述一个故事*”。当我们在微服务的语境下交谈时，讲述故事成为一种力量倍增器。因为单个服务的故事可能很简单，但跨越多个服务的错误故事会复杂得多。我们可以通过服务间的追踪来解决它。我们将在\
  \ *第九章，部署到生产环境* 中更详细地讨论追踪。简而言之，追踪是服务间代码和错误的跟踪。\n\n#### 惯例\n\n我们从 Uber-Go 惯例中获取了此惯例表，它非常好地描述了关于何时使用此错误和彼错误的指导惯例。\n\
  \n| **错误匹配？** | **错误消息** | **指导** | **描述** |\n| --- | --- | --- | --- |\n| 否 | 静态\
  \ | `errors.New` | 使用给定消息创建新错误的函数。 |\n| 否 | 动态 | `fmt.Errorf` | 生成格式化错误消息的函数。 |\n\
  | 是 | 静态 | 顶层变量配合 `errors.New` | 使用 `errors.New` 定义带有错误消息的顶层变量。 |\n| 是 | 动态 | 自定义错误类型\
  \ | 定义自定义错误类型。 |\n\n**表 4.1：** 错误处理惯例\n\n### 测试 - 最佳实践、Mock 与模糊测试\n\n我们非常喜欢 Go 的一点是\
  \ `testing` 包是由 Go 团队维护的核心包。我们在其他语言中遇到过许多情况，因测试框架太多且各有所短，而苦恼于寻找合适的测试框架。我们的建议是尽量避免使用外部测试框架。\n\
  \n本节将讨论 Go 中测试的样子、它们与其他语言的区别，以及 Go 测试的最佳实践。\n\n\n\n\n注意：测试是一个庞大的主题，我们不旨在全面学习它。单元测试、组件测试、集成测试、冒烟测试，以及\
  \ Mock、Stub、Fake 和 Spy 等都是测试生态系统中的术语和定义示例。我们的目标是了解 Go 语言中的测试调整及其优势，特别是在 Go 中的优势。此外，我们还将学习在构建微服务架构时需要测试什么。\n\
  \n我们对测试的总体看法如下：\n\n1. 测试必须是独立的。\n2. 不稳定测试是任何系统的毒瘤 —— 测试必须是可复现的。\n3. 测试是记录代码的绝佳方式。\n\
  \n在 Go 中创建测试的步骤是什么？测试文件放在哪里？\n\n1. 创建一个以 `_test.go` 为后缀的文件。该文件可以放在被测试文件附近（请参阅本章代码中的示例）。我们也可以在专门的目录中创建测试文件。\n\
  2. 在测试文件中，声明一个签名为 `func TestName(t *testing.T)` 的函数。将 `Name` 替换为你想要测试的内容。通常我们测试一个函数，`Name`\
  \ 即为该函数的名称。但 `Test` 前缀是必须的。\n3. 使用 Go CLI 运行测试，执行命令 `go test ./...`。\n\n我们有一个名为\
  \ `GetBigger` 的函数（见 `example.go`）：\n\n```go\nfunc GetBigger(a, b float64) float64\
  \ {\n    return math.Max(a, b)\n}\n```\n\n测试文件应如下所示（`example_test.go`）：\n\n```go\n\
  package main\n\nimport \"testing\"\n\nfunc TestGetBigger(t *testing.T) {\n    type\
  \ args struct {\n        a float64\n        b float64\n    }\n    tests := []struct\
  \ {\n        name string\n        args args\n        want float64\n    }{\n    \
  \    {\n            name: \"a is the bigger one\",\n            args: args{\n  \
  \              a: 9,\n                b: 6,\n            },\n            want: 9,\n\
  \        },\n        {\n            name: \"b is the bigger one\",\n           \
  \ args: args{\n                a: 3,\n                b: 7,\n            },\n  \
  \          want: 7,\n        },\n    }\n    for _, tt := range tests {\n       \
  \ t.Run(tt.name, func(t *testing.T) {\n            if got := GetBigger(tt.args.a,\
  \ tt.args.b); got != tt.want {\n                t.Errorf(\"GetBigger() = %v, want\
  \ %v\", got, tt.want)\n            }\n        })\n    }\n}\n```\n\n`testing` 包下有许多工具函数帮助我们执行更精确的测试。文中提供了一个指向\
  \ Go `testing` 包详细文章的链接。\n\n#### Mock\n\n这是一个宝贵的工具，帮助我们为测试设置常量（即不可变数据）。我们可以 Mock\
  \ 数据，也可以 Mock 函数。Mock 数据的方式有很多；最方便的方式是使用 `gofakeit` 包。这是一个非常方便的包，帮助我们 Mock 数据。接下来我们讨论\
  \ Mock 函数。\n\n在 Go 中我们无法直接 Mock 函数。我们实际上能 `mock` 的是接口。在 Mock 接口之前，我们必须知道如何 Mock\
  \ `struct`。要在 Go 中 Mock `struct`，我们需要该结构体兼容某个接口，然后我们就可以 Mock 该接口。稍后我们将看到如何操作。\n\n\
  在此之前，我们先尝试 Mock 一个函数。要 Mock 一个函数，正如你可能猜到的，我们需要将函数赋值给一个结构体。在这里，我们可以利用空结构体（`struct{}`）的存在。以下是一个用例：一个函数调用了另外两个函数。\n\
  \n```go\n// Valid name is between 8 and 16 chars and doesn't contain number\nfunc\
  \ IsValidName(name string) bool {\n    numbersValid := IsNumbersValid(name)\n  \
  \  lengthValid := IsLengthValid(name)\n    return numbersValid && lengthValid\n\
  }\n\nfunc IsNumbersValid(name string) bool {\n    return !strings.ContainsAny(name,\
  \ \"0123456789\")\n}\n\nfunc IsLengthValid(name string) bool {\n    length := len(name)\n\
  \    return length >= 8 && length <= 16\n}\n```\n\n假设我们要为 `IsValidName` 函数创建测试，但想\
  \ Mock `IsNumbersValid` 和 `IsLengthValid` 函数。第一步是创建一个接口和空 `struct`，如下所示：\n\n```go\n\
  type ValidationClient struct{}\n\ntype ValidationClientInter interface {\n    IsNumbersValid(name\
  \ string) bool\n    IsLengthValid(name string) bool\n}\n```\n\n然后，将我们想要 Mock 的函数赋值给该\
  \ `struct`。\n\n```go\nfunc (c *ValidationClient) IsNumbersValid(name string) bool\
  \ {\n    return !strings.ContainsAny(name, \"0123456789\")\n}\n\nfunc (c *ValidationClient)\
  \ IsLengthValid(name string) bool {\n    length := len(name)\n    return length\
  \ >= 8 && length <= 16\n}\n```\n\n之后，我们应该创建该结构体的实例，并使用该实例来调用我们想要 Mock 的函数。\n\n```go\n\
  var Client ValidationClientInter = &ValidationClient{}\n\nfunc IsValidName(name\
  \ string) bool {\n    numbersValid := Client.IsNumbersValid(name)\n    lengthValid\
  \ := Client.IsLengthValid(name)\n    return numbersValid && lengthValid\n}\n```\n\
  \n按照示例，现在我们有一个函数 `IsValidName` 通过结构体客户端（`Client`）调用另外两个函数，该客户端满足接口 `ValidationClientInter`。\n\
  \n请记住，我们必须拥有该接口。因为在 Go 中，我们可以使用组合来“`override`”接口。之后，让我们使用一个名为 `mockery` 的工具。`mockery`\
  \ 通过运行命令帮助我们生成 Mock。另一种选择是 `gomock`，它在 Go 中也非常流行。运行 `mockery` 的命令如下：\n\n```bash\n\
  mockery --all --inpackage\n```\n\n这将为每个接口生成一个单独的文件。运行此命令时，工具将创建文件 `mock_ValidationClientInter.go`。剩下的唯一工作就是确定\
  \ Mock 函数的行为，然后将 `Client` 赋值为我们之前创建的 Mock 客户端。这样做后，运行测试时将使用 Mock 客户端而不是原始客户端。\n\n\
  ```go\nmockedClient := &MockValidationClientInter{}\nmockedClient.On(\"IsNumbersValid\"\
  , mock.Anything).Return(true)\nmockedClient.On(\"IsLengthValid\", mock.Anything).Return(true)\n\
  Client = mockedClient\n```\n\n此功能发生在测试文件中。\n\n#### 模糊测试\n\n模糊测试使用提供的种子数据为函数生成输入。模糊测试被证明是发现代码中不可预见行为的有效方法。它有助于找出代码可能发生\
  \ panic 的位置，以便我们处理那些我们未曾想到的特定用例。\n\n模糊测试是 Go 的一项新功能。从 1.18 版本开始支持模糊测试。让我们看一个将字符串解析为名和姓的简单函数。\n\
  \n```go\n// ParseName parses a name into first and last.\nfunc ParseName(s string)\
  \ (string, string, error) {\n    parts := strings.Split(s, \" \")\n    return parts[0],\
  \ parts[1], nil\n}\n```\n\n我们为此函数创建了一个模糊测试，如下所示：\n\n```go\nfunc FuzzParseName(f\
  \ *testing.F) {\n    f.Add(\"John Adams\")\n    f.Add(\"George Washington\")\n \
  \   f.Fuzz(func(t *testing.T, s string) {\n        _, _, err := ParseName(s)\n \
  \       if err != nil {\n            t.Errorf(\"%v\", err)\n        }\n    })\n\
  }\n```\n\n现在，让我们用 12 秒的超时时间运行模糊测试。注意，模糊测试的超时时间是无限的（因为它总是尝试寻找更多用例）。我们可以通过运行以下命令来运行模糊测试：\n\
  \n```bash\ngo test -fuzz FuzzParseName -fuzztime=12s\n```\n\n运行此命令后，我们遇到了一个 panic\
  \ 错误：\n\n```text\npanic: runtime error: index out of range [1] with length 1\n```\n\
  \n原因非常直接：panic 的原因是我们没有检查字符串为空或不包含空格的情况。为了解决它，我们需要处理该用例。同时在测试中忽略新的错误类型。\n\n```go\n\
  var ErrInvalidName = errors.New(\"invalid name\")\n\n// ParseName parses a name\
  \ into first and last.\nfunc ParseName(s string) (string, string, error) {\n   \
  \ parts := strings.Split(s, \" \")\n    if len(parts) != 2 {\n        return \"\"\
  , \"\", ErrInvalidName\n    }\n    return parts[0], parts[1], nil\n}\n\nfunc FuzzParseName(f\
  \ *testing.F) {\n    f.Add(\"John Adams\")\n    f.Add(\"George Washington\")\n \
  \   f.Fuzz(func(t *testing.T, s string) {\n        _, _, err := ParseName(s)\n \
  \       if err != nil {\n            if errors.Is(err, ErrInvalidName) {\n     \
  \           return\n            }\n            t.Errorf(\"%v\", err)\n        }\n\
  \    })\n}\n```\n\n注意：模糊测试函数名必须以 `Fuzz` 为前缀。\n\n### 微服务测试\n\n\n\n微服务因其固有设计而具有简单、自包含的特点。遵循适配器设计模式，我们应通过封装\
  \ HTTP 客户端来实现服务间通信的封装。关于该设计模式的参考资料请见“参考文献”部分。\n\n在创建与其他服务通信的自定义客户端（封装后的客户端）时，我们应尽量将这些客户端创建为结构体（`struct`）。这些结构体必须实现一个接口。关于在微服务中使用客户端接口，有两种最佳实践：\n\
  \n*   每个服务客户端拥有自己的接口 —— 灵活性更高，但工作量更大。\n*   所有服务共享一个通用接口 —— 灵活性较低，但工作量较少。\n\n无论选择哪种方案，引入接口的原因都是为了具备模拟客户端响应的能力，正如前文（“模拟”）所述。我们希望在单个服务的测试范围内模拟客户端响应。\n\
  \n一种更强大的测试类型是服务间测试。虽然它功能更强，但也需要投入大量时间和精力。关于此类服务间测试存在无数理论。核心在于正确设置这些测试的 `Setup` 和\
  \ `Teardown`，同时确保测试的可复现性。通常，这类测试在敏捷性方面容易变得不稳定。我们应致力于使用本章介绍的 `Functional Options\
  \ Pattern`。在最佳场景下，`Setup` 函数应表现为定义多个 `Options`（基本上即配置）。\n\nGo 语言在构建微服务架构时提供了两个相关的高效工具：\n\
  \n*   性能基准测试\n*   竞态检测器\n\n### 性能基准测试\n\n基准测试是测试 CLI 的内置选项。它有助于我们测试函数的性能。基准测试是一种强大的方法论，帮助我们实现良好的性能。构建微服务时它甚至更强大，因为我们可以在特定端点变慢时进行调查。让我们看看如何执行基准测试。\n\
  \n```\nfunc Fib(n int) int {\n    if n < 2 {\n        return n\n    }\n    return\
  \ Fib(n-1) + Fib(n-2)\n}\n```\n\n我们想要查看该函数在大输入下的性能表现。我们需要创建一个以 `Benchmark` 为前缀、签名为\
  \ `(b *testing.B)` 的测试函数，测试代码如下：\n\n```\nfunc BenchmarkFib(b *testing.B) {\n   \
  \ for n := 0; n < b.N; n++ {\n        Fib(20)\n    }\n}\n```\n\n运行基准测试需使用 Go CLI，命令如下：\n\
  \n`go test -bench=.`\n\n还有多种运行基准测试的配置可供探索。\n\n### 竞态检测器\n\nGo CLI 内置选项可用于检测竞态条件。竞态条件是微服务系统中常见的情况。此外，由于\
  \ Go 的并发模型，竞态条件很容易发生。竞态检测器可针对可执行程序或测试运行。让我们看一个针对简单情况运行竞态检测器的示例：\n\n```\nfunc main()\
  \ {\n    i := 0\n    go func() {\n        i++\n    }()\n    fmt.Println(i)\n}\n\
  ```\n\n在上述示例中，函数第二行启动了一个 goroutine。当我们打印 `i` 时，可能得到两种结果：`0` 或 `1`。原因是存在竞态条件。我们无法确定\
  \ goroutine 是否会在 `Println` 调用前执行完毕，因为它们是并行运行的。运行竞态检测器的命令为：\n\n`go run -race race-detector.go`\n\
  \n我们将得到如下警告：\n\n```\n==================\nWARNING: DATA RACE\nWrite at 0x00c00011a028\
  \ by goroutine 6:\nmain.main.func1()\n  /Users/nirshtein/Documents/GitHub/Microservices-with-Go/chapter-5/race-detector/race-detector.go:8\
  \ +0x3c\nPrevious read at 0x00c00011a028 by main goroutine:\nmain.main()\n  /Users/nirshtein/Documents/GitHub/Microservices-with-Go/chapter-5/race-detector/race-detector.go:10\
  \ +0xa8\nGoroutine 6 (running) created at:\nmain.main()\n  /Users/nirshtein/Documents/GitHub/Microservices-with-Go/chapter-5/race-detector/race-detector.go:7\
  \ +0x9c\n==================\nFound 1 data race(s)\nexit status 66\n```\n\n该警告明确无误。建议探索\
  \ Go 中检测竞态条件的各种配置。后续章节将讨论解决这些竞态条件的技术。\n\n### 总结\n\n本章讨论了语言的核心支柱。每个主题的深度远超我们的探讨范围。我们鼓励您继续深入探索这些支柱。本章的参考文献是极佳的起点。\n\
  \n下一章将讨论语言的主要支柱之一 —— 并发！\n\n### 参考文献\n\n*   [`refactoring.guru/design-patterns/go`](https://refactoring.guru/design-patterns/go)\n\
