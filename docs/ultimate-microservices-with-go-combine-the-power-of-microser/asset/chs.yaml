  \n## 第 8 章\n\n### Kubernetes 简介\n\n### 简介\n\n在谈论 Kubernetes 之前，有一项需要首先解释的基础技术，即\
  \ Docker。Docker 是一个使用操作系统级虚拟化来运行称为容器的打包软件的平台。这些容器封装了应用程序及其依赖项，确保跨各种环境的一致性。作为开发人员，我们必须熟悉容器化的基本术语\
  \ —— 镜像、容器等。并学习 Dockerfile 的基本语法：[`docs.docker.com/engine/reference/builder/`](https://docs.docker.com/engine/reference/builder/)。如果您不熟悉虚拟化和容器化，建议详细阅读相关内容。\n\
  \n\n\n在开发者构建众多服务以组成更大的微服务架构的世界里，他们通常将这些服务打包为称为容器的可交付单元，这导致我们需要管理海量的容器。在支持每位开发者的需求和特定要求的同时，几乎不可能管理和运维如此数量的容器。幸运的是，Google\
  \ 的一些人预见到了这个问题，并打造了一个单一项目来解决它。这个项目叫做 Kubernetes。\n\n为什么我们要学习 Kubernetes？*“我只需要编写代码，让运维侧（通常是\
  \ DevOps）为我完成所有其他工作。”* 这个答案在完美的世界里是可以接受的，但现实并非如此。应用程序与其部署方式之间存在耦合。作为开发者，我们必须确保功能在生产环境中按预期运行。本地环境与生产环境之间存在巨大差异\
  \ —— 不同的参数、我们未曾考虑的边缘情况、扩展问题、安全顾虑等。为了缓解这些差异带来的问题，我们作为开发者需要了解 Kubernetes 的基础知识 ——\
  \ 常见资源、发布流程、故障排查、核心最佳实践、监控等。在本章中，我们将探讨这些主题。\n\nKubernetes 与微服务架构有什么关系？\n\n简单来说，Kubernetes\
  \ 解决了微服务架构的许多问题和缺点。例如，在微服务架构中建议使用外部配置。Kubernetes 通过提供 `ConfigMap` 和 `Secret`（存储资源）将数据注入应用容器来解决这个问题。这就是两者结合强大的原因。\n\
  \n另一个例子是，可以使用 `Ingress`（Kubernetes 资源）高效地实现路由能力。\n\nKubernetes 是一个开源的容器编排系统。该系统由\
  \ Google 于 2014 年发明，现由 CNCF（云原生计算基金会）维护。Kubernetes 的简写是 `K8s`（因 K 和 S 之间有 8 个字母）。\n\
  \n![](img/8.1.jpg)\n\n**Figure 8.1:** 微服务架构使用 Kubernetes 示例\n\n### Structure\n\n\
  在本章中，我们将讨论以下主题：\n\n*   Kubernetes Adoption（Kubernetes 采用）\n*   Kubernetes Essential\
  \ Tools - `kind`、`kubectl`、`kubectx`\n*   Basic Resources（基础资源）\n    *   Node（节点）\n\
  \    *   Namespace（命名空间）\n    *   Pod（Pod）\n*   Workloads Management（工作负载管理）\n \
  \   *   Deployment（部署）\n    *   DaemonSet（守护进程集）\n    *   StatefulSet（有状态集）\n  \
  \  *   Job（任务）\n    *   CronJob（定时任务）\n*   Important Resources（重要资源）\n    *   ConfigMap\n\
  \    *   Secret\n    *   HPA\n    *   Ingress\n*   Readiness and Liveness Probes（就绪与存活探针）\n\
  *   Resources Allocations（资源分配）\n*   Kubernetes Best Practices（Kubernetes 最佳实践）\n\
  \    *   Maintaining Good YAML Hygiene（保持良好的 YAML 规范）\n    *   Logging - Specifically\
  \ for Kubernetes（日志记录 —— 专门针对 Kubernetes）\n    *   Environments Management（环境管理）\n\
  \    *   Proper Monitoring（合理的监控）\n\n### Kubernetes Adoption\n\n如今，Kubernetes 被广泛使用，世界上大多数公司都在使用它。Kubernetes\
  \ 社区庞大且逐年增长。全球有大量会议的主题仅围绕 Kubernetes。有大量与 Kubernetes 相关的开源项目和工具。\n\n此外，一些公司拥有原生面向\
  \ Kubernetes 的产品。使用 Kubernetes 作为部署服务和工作负载的场所已成为行业标准。\n\n![](img/Figure-8.2.jpg)\n\
  \n**Figure 8.2:** 2022 年 12 月 Kubernetes 采用情况\n\nKubernetes 旨在管理容器化的工作负载和服务。此外，其目标是自动化复杂的部署流程。Kubernetes\
  \ 负责部署过程的多个方面 —— 网络、配置、发布等，也负责管理 —— 存储、安全等。\n\nKubernetes 在其内部组合了多个工具和项目，并利用它们各自的能力。例如，Kubernetes\
  \ 使用 Docker 作为容器运行时引擎，并没有自己的容器运行时引擎。Kubernetes 作为一个称为 **cluster** 的单一单元提供。我们可以通过定义期望的资源在该集群中创建资源。我们将使用\
  \ YAML 配置想要的期望资源。Kubernetes 将为我们完成所有其他工作，并努力达到我们定义的期望状态。在本章后续内容中，我们将详细阐述与软件工程师相关的不同\
  \ Kubernetes 资源。\n\n### Kubernetes Essential Tools\n\n让我们讨论一些 Kubernetes 的必要工具：\n\
  \n#### Kind\n\n`Kind` 代表 Kubernetes IN Docker，是一个在 Docker 容器中运行 Kubernetes 集群的工具。它简单直接，通常用于本地或测试环境，因为它轻量且易于使用。其他实现相同功能的工具有\
  \ `Minikube` 和 `K3s`。以下是如何使用 `kind` 启动集群：\n\n```\nkind create cluster --name example\n\
  ```\n\n#### Kubectl\n\n`Kubectl` 是 Kubernetes OSS 项目的一部分。它是一个 CLI，让我们能轻松与 Kubernetes\
  \ API 交互。以下是一些 `kubectl` 的常用命令：\n\n获取资源：\n\n```\nkubectl get pods\nkubectl get nodes\
  \ --output json\n```\n\n![](img/Figure-8.3.jpg)\n\n**Figure 8.3:** kubectl get pods\
  \ 输出示例响应\n\n第一个示例展示如何以默认命名空间获取集群中所有的 Pod。第二个示例以 JSON 输出格式获取集群中所有的 Node。\n\n创建新资源：\n\
  \n```\nkubectl create -f pod.yaml\n```\n\n修改/创建资源：\n\n```\nkubectl apply -f pod.yaml\n\
  ```\n\n删除名为 frontend 的 Pod：\n\n```\nkubectl delete pods/frontend\n```\n\n要查看 `kubectl`\
  \ 所有的命令，可以运行：\n\n```\nkubectl help\nkubectl help <command-name>\n```\n\n#### Kubectx\n\
  \n`Kubectx` 是一个极简的 CLI 工具，帮助我们在集群间切换。当我们使用 `kubectl` 时，它会访问 `~/.kube` 目录中声明的集群 API。通过使用\
  \ `kubectx`，它只会将上下文切换到期望的集群。例如：\n\n```\nkubectx <cluster-name>\n```\n\n### Basic\
  \ Resources\n\n以下三个资源在 Kubernetes 中被广泛使用。了解它们是什么对于理解 Kubernetes 至关重要。我们将在本章中反复提及它们。\n\
  \n#### Node\n\n> “Node 是 Kubernetes 中的工作机器，可以是虚拟机也可以是物理机，取决于集群。每个 Node 由控制平面管理。一个\
  \ Node 可以运行多个 Pod，Kubernetes 控制平面会自动处理在集群中的 Node 间调度 Pod。”\n\n这是 Kubernetes 官方文档的引用。这段引用很好地解释了什么是\
  \ Node。作为开发者，这已足够，我们不需要操作它们或处理 Node 问题。但请注意，有时我们的应用程序会因 Node 问题而出现故障。至少，我们需要理解问题与\
  \ Node 相关，并将其移交给运维人员处理。\n\n#### Namespace\n\nKubernetes 中的 Namespace 是资源间分离和隔离的机制。一些资源可以被命名空间化，一些则不能。每次我们使用\
  \ `kubectl get` 获取资源时，除非另行指定，否则它会带来 `default` 命名空间中的所有资源；通过添加 `-A`，我们可以获取所有命名空间中的所有资源。资源的名称和类型在命名空间内必须唯一。要查看哪些资源被命名空间化、哪些没有，可以运行：\n\
  \n```\nkubectl api-resources\n```\n\n![](img/Figure-8.4.jpg)\n\n**Figure 8.4:**\
  \ kubectl api-resources 输出\n\n请注意 “`NAMESPACED`” 列，它给出布尔答案，指示资源类型是否被命名空间化。\n\n####\
  \ Pod\n\n\n\n\nPod 资源是 Kubernetes 中最小的可部署单元。Pod 是一组共享卷、环境和上下文的容器的集合。我们可能不需要单独部署\
  \ Pod；Pod 通常是正在运行的工作负载的一部分。然而，大多数调查都将围绕 Pod 进行，包括描述它、获取其日志或获取关于 Pod 的基本数据。\n\n![](img/Figure-8.5.jpg)\n\
  \n**图 8.5：** 使用宽输出模式获取 pods\n\n描述 Pod：\n\n```\nkubectl describe pods/nginx-deployment8-6dcf8bbd4c-459fx\n\
  ```\n\n描述 Pod 是一个典型命令；它提供了关于 Pod 和 Pod 最近事件的许多详细信息。我们也可以对任何其他资源使用 `describe` 命令，格式如下：\n\
  \n```\nkubectl describe <resource-kind>/<resource-name>\n```\n\n查看日志：\n\n```\nkubectl\
  \ logs pods/frontend2\n```\n\n与 `describe` 命令类似，我们可以对每种资源使用 `logs` 命令，但它的价值较低。\n\
  \n### 工作负载管理\n\n工作负载是在 Kubernetes 上运行的应用程序。工作负载是微服务架构中的一项服务。正如我们已经看到的，部署和管理服务（工作负载）具有挑战性、复杂，且需要大量工作。Kubernetes\
  \ 通过工作负载资源提供了部署和管理服务的解决方案。在这里，我们将介绍并解释内置的工作负载资源。\n\n#### Deployment（部署）\n\nDeployment\
  \ 是 Kubernetes 中最常见的工作负载。Deployment 用于管理无状态服务。由 Deployment 管理的 Pod 是易失的。当一个 Pod\
  \ 被终止（无论是由于故障还是发布导致），Deployment 资源会创建另一个具有不同名称的新 Pod。Deployment 使用一种称为 `ReplicaSet`\
  \ 的资源来管理 Pod。每次我们发布新版本（仅应用新的 YAML），就会创建一个新的 `ReplicaSet` 并替换旧的 `ReplicaSet` 和旧的\
  \ Pod。\n\n```\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: random-deployment\n\
  spec:\n  replicas: 3\n  selector:\n    matchLabels:\n      app: random-app\n  template:\n\
  \    metadata:\n      labels:\n        app: random-app\n    spec:\n      containers:\n\
  \        - name: random-container\n          image: nginx:latest\n          ports:\n\
  \            - containerPort: 80\n```\n\n前面的 YAML 是 Kubernetes 中最小化 Deployment YAML\
  \ 的示例。\n\n#### DaemonSet\n\nDaemonSet 是一种适合在节点上运行 Pod 的工作负载。DaemonSet 的目标是提供与本地节点相关的功能。例如，具有单个副本的\
  \ DaemonSet 会在集群中的每个节点上调度一个 Pod。用例可以是存储守护进程、网络相关守护进程、日志聚合器、遥测守护进程等。\n\n#### StatefulSet\n\
  \nStatefulSet 是为需要持久状态或唯一标识的 Pod 设计的工作负载资源。与 Pod 可互换且短暂的 Deployment 资源不同，StatefulSet\
  \ 确保 Pod 在终止后以相同的名称和状态被重新创建。StatefulSet 提供一致的卷，Pod 可以使用称为 `PV`（PersistentVolume，持久卷）和\
  \ `PVC`（PersistentVolumeClaim，持久卷声明）的其他资源挂载该卷。StatefulSet 的用例可以是数据库服务、消息系统等。\n\n\
  #### Job\n\nJob 资源允许我们定义一个可以运行直到完成的任务。就这么简单。Job 资源可用于数据处理等场景。\n\n#### CronJob\n\n\
  它是一种运行 Job 资源的方式，但用 cron 调度器将其包装起来。CronJob 资源的用例可以是维护任务、计划备份、批处理等。\n\n```\napiVersion:\
  \ batch/v1beta1\nkind: CronJob\nmetadata:\n  name: random-cronjob\nspec:\n  schedule:\
  \ \"*/5 * * * *\" # Runs every 5 minutes\n  jobTemplate:\n    spec:\n      template:\n\
  \        metadata:\n          labels:\n            app: random-cronjob\n       \
  \ spec:\n          containers:\n            - name: random-container\n         \
  \     image: busybox\n              command: [\"echo\", \"Hello from the cronjob!\"\
  ]\n          restartPolicy: OnFailure\n```\n\n在前面的 YAML 示例中，我们可以看到 CronJob YAML；请注意，在\
  \ CronJob YAML 内部，我们定义了一个 Job YAML 并用调度器将其包装。\n\n### 重要资源\n\n以下资源在使用 Kubernetes\
  \ 时很常见；作为开发人员，我们可能会遇到它们。\n\n#### ConfigMap\n\nConfigMap 是一种以键值对形式存储非机密数据的资源。Pod\
  \ 可以通过环境变量、参数或卷来使用 ConfigMap 数据。ConfigMap 帮助我们实现微服务的要素之一：外部配置。可以存储在 ConfigMap 中的数据包括应用属性、连接字符串、环境数据、端点等。\n\
  \n```\napiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: random-configmap\ndata:\n\
  \  app_name: my-app\n  database_url: \"mongodb://localhost:27017\"\n```\n\n前面的 YAML\
  \ 示例描述了 ConfigMap。\n\n#### Secret\n\nSecret 资源就像 ConfigMap 资源一样，但存储的是敏感数据而非非敏感数据。可以存储在\
  \ Secret 中的数据包括密码、API 密钥、证书等。\n\n#### HPA\n\nHPA 代表 Horizontal Pod Autoscaling（水平\
  \ Pod 自动伸缩），是一种用于自动缩放工作负载资源（并非适用于所有工作负载）的资源。水平自动伸缩意味着通过增加或减少副本（Pod）的数量来进行缩放。缩放基于指标（CPU\
  \ 或内存）及其期望值。在 HPA 配置中，有最小和最大 Pod 数量限制。我们经常将 HPA 用于动态规模且负载偶尔不同的服务。\n\n#### Ingress\n\
  \n> “Ingress 将来自集群外部的 HTTP 和 HTTPS 路由暴露给集群内部的服务。流量路由由 Ingress 资源上定义的规则控制。”\n\n在该引语中，术语“`services`”特指名为“`service`”的\
  \ Kubernetes 资源。该资源负责 Kubernetes 环境内的网络，不应与服务的广泛概念混淆，特别是在微服务的语境下。\n\n![](img/Figure-8.6.jpg)\n\
  \n**图 8.6：** Kubernetes 中的 Ingress 资源\n\n这是本章提到的最复杂的资源。作为开发人员，我们可能只会在想要添加新路由或更改路由时遇到\
  \ Ingress。最后，请注意 Ingress 资源解决了 API 网关（微服务架构中的核心要素）的一些重要关注点，例如负载均衡、安全性和高层路由。\n\n\
  ### 就绪和存活探针\n\n在 Kubernetes 中，当所有容器都在运行时，Pod 会接收流量。此外，当 Kubernetes 检测到 Pod 崩溃（由于退出代码或其他故障）时，它会重启该\
  \ Pod。这些检测（无论是 Pod 准备好接收流量还是需要重启）都由 Kubernetes 自动解决。然而，在某些场景下，我们作为开发人员希望为 Kubernetes\
  \ 提供额外信息以执行这些检测。例如，我们可以决定 Pod 在建立与数据库的连接之前无法接收流量。另一个例子是，如果我们发现 Pod 缓存无效，则希望重启该 Pod。执行这种手动检测的方法就是就绪和存活探针。\n\
  \n*   **就绪探针**：指示容器是否准备好接收流量和请求。\n*   **存活探针**：指示容器是否正常运行。如果不是，则需要被杀掉并重启。\n\n```\n\
  apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: web-app-deployment\nspec:\n\
  \  replicas: 3\n  selector:\n    matchLabels:\n      app: web-app\n  template:\n\
  \    metadata:\n      labels:\n        app: web-app\n    spec:\n      containers:\n\
  \        - name: web-app-container\n          image: nginx:latest\n          ports:\n\
  \            - containerPort: 80\n          readinessProbe:\n            httpGet:\n\
  \              path: /healthz\n              port: 80\n            initialDelaySeconds:\
  \ 5\n            periodSeconds: 10\n          livenessProbe:\n```\n\n\n\n\n\n###\
  \ 资源分配\n\n在 Kubernetes 中指定 Pod 或工作负载内的 Pod 时，我们可以选择性地指定可以分配给容器的资源数量。标准且常见的分配资源是\
  \ CPU 和内存，但还有其他类型。我们可以为资源分配指定两个参数——`request`（请求）和 `limit`（限制）。\n\n*   **Request（请求）**：定义资源\
  \ `requests` 时，调度器会据此决定将 Pod 放置在哪个节点上。`request` 代表资源使用预期。\n*   **Limit（限制）**：定义资源\
  \ `limit` 时，`kubelet`（“节点代理”）会强制执行该 `limit`，不允许容器超过这些 `limits`。如果 CPU 达到 `limit`，容器会被限流；如果内存达到\
  \ `limit`，运行该容器的 Pod 会被终止并重启。\n\n掌握我们分配的资源至关重要。如果没有适当的分配，Pod 就会为所欲为。例如，我们的应用程序可能存在内存泄漏并消耗大量内存，从而影响节点或整个集群上的其他\
  \ Pod。另一个反面例子是，过小的内存分配可能会限制应用程序无法正常运行。作为开发人员，我们有责任确定容器所需的资源数量。\n\n下面是一个 Pod YAML\
  \ 示例，它启动一个名为 `hello` 的容器，并设置了 CPU 和内存的 `requests` 和 `limits`：\n\n```yaml\napiVersion:\
  \ v1\nkind: Pod\nmetadata:\n  name: example\nspec:\n  containers:\n  - name: hello\n\
  \    image: hello-world:latest\n    resources:\n      requests:\n        memory:\
  \ \"128Mi\"\n        cpu: \"250m\"\n      limits:\n        memory: \"256Mi\"\n \
  \       cpu: \"1\"\n```\n\n### Kubernetes 最佳实践\n\n以下四项最佳实践与 Kubernetes 开发人员更为相关。还有其他几项最佳实践更多地与运维相关。推荐一本关于\
  \ Kubernetes 详细最佳实践的书籍——*Kubernetes Patterns*。参考资料中有它的链接。这些模式并非摘自该书。\n\n#### 保持良好的\
  \ YAML 卫生\n\nYAML 在 Kubernetes 中就是一切。YAML 代表了 Kubernetes 中的期望状态。作为用户，我们定义它们，Kubernetes\
  \ 会为我们完成所有其他工作。它致力于将当前状态转换为期望状态（YAML 文件）。基于这一理解，YAML 必须满足以下要求：\n\n*   **整洁干净**：不包含任何我们不需要或不想要的配置。此外，我们需要避免在\
  \ YAML 文件中声明默认配置。\n*   **标签和注解**：这两个术语是与 YAML 资源相关的元数据。注解用于存储任意元数据，标签用于在 Kubernetes\
  \ 中识别资源。这是 Kubernetes 中一个广泛的话题，但我们在此不作讨论。我们需要在每个 YAML 文件中充分利用这两种元数据。\n*   **针对工作负载**：指定**存活探针和就绪探针**，正如我们之前提到的。\n\
  *   **ConfigMap 和 Secret 必须妥善配置**：切勿重复声明现有 ConfigMap 或 Secret 中已声明的键值。\n\n#### 日志记录\
  \ —— 专门针对 Kubernetes\n\n我们在 Kubernetes 中使用日志的方式与在其他系统中使用日志的方式略有不同。为避免错误，我们必须通过包含以下内容来正确标记和标记日志：\n\
  \n*   **正确的服务名称**：不是 Pod 名称！我们必须在日志中包含服务名称，以便能够将日志关联到同一服务。一个常见的错误是日志仅包含实例名称（在 Kubernetes\
  \ 中即 Pod 名称），而不是服务名称。\n*   **版本**：为了确定哪个版本在何时发生了什么变化，我们必须在每条日志上指定服务版本。这样做，我们就能看到并观察服务的生命周期。例如，错误日志仅从版本\
  \ 1.3.2 开始出现，这意味着该版本引入了一个 Bug。\n*   **集群环境信息**：任何可能影响应用程序行为的数据。有时，服务出现问题或错误并非其本身的过错。集群或节点可能对此问题负责。例如，记录节点名称可能非常有用。\n\
  \n#### 环境管理\n\n在任何系统中，我们都会出于不同原因拥有不同的环境。生产环境、预发布环境（有时称为预生产）、测试环境、本地环境等。在 Kubernetes\
  \ 中分离环境主要有两种方法：\n\n*   **每个环境使用不同的集群**：这种方法的主要优势是环境解耦，彼此之间没有依赖。其主要劣势是为每个环境搭建不同的集群需要付出更多努力，维护多个集群也需要付出更多努力。\n\
  *   **每个环境使用不同的命名空间**：这种方法的优劣势与前一种方法恰好相反。虽然环境之间存在依赖（例如，来自不同环境的 Pod 可能被分配到同一节点上），但搭建和维护所需的精力要少得多。\n\
  \n#### 合理的监控\n\n除了我们作为开发人员倾向于在服务上实施的常规监控外，还有一些监控专门针对运行在 Kubernetes 上的服务。以下是三个重要的监控指标：\n\
  \n*   **资源**：监控 CPU、内存和存储的使用情况。监控这些资源对于优化服务性能、识别瓶颈和确保高效的资源分配至关重要。\n*   **容器状态**：监控容器是否宕机/运行中/报错/探针失败/重启次数等。这些指标对于确保服务的可靠性和健康状况至关重要。此外，它们有助于发现问题、便于故障排查，并有助于构建更稳定、更有弹性的服务。\n\
  *   **Kubernetes 事件**：Kubernetes 通过事件审计其采取的操作。Kubernetes 事件记录了集群的历史。通过监控 Kubernetes\
  \ 事件，我们可以检测趋势、问题和异常，并通过查看事件获得许多洞见。\n\n### 总结\n\n在本章中，我们浏览了 Kubernetes 的基础知识，重点关注与开发人员相关的资源和操作，而非运维侧面。我们介绍了\
  \ Kubernetes 中的三个基本术语——Node（节点）、Pod 和 Namespace（命名空间）。这些术语为理解 Kubernetes 中的其他资源奠定了基础。我们了解了\
  \ Kubernetes 工作负载——Deployment（部署）、DaemonSet、StatefulSet（有状态集）、Job 和 CronJob。作为开发人员，我们必须为服务选择合适的工作负载资源。随后，我们介绍了使用\
  \ Kubernetes 时可能会遇到的常见资源——ConfigMap、Secret、HPA 和 Ingress。\n\n接着，我们讨论了两个与开发人员息息相关的主要\
  \ Kubernetes 概念。第一个是就绪探针和存活探针，它们确保我们的服务已准备好工作（接受流量）并正常运行。第二个是资源分配——我们了解了使用工作负载时需要指定的内容（主要是\
  \ CPU 和内存的 requests 和 limits）。\n\n\n\n\n最后，我们介绍了四个与使用 Kubernetes 的开发者息息相关的最佳实践——保持\
  \ YAML 规范、环境管理、日志记录，以及针对 Kubernetes 的监控。\n\n在下一章中，我们将把本章和前几章积累的知识应用到生产环境中。我们将利用\
  \ Kubernetes 的能力，学习如何在保持微服务架构风格的同时，将服务部署到生产环境。\n\n### 参考资料\n\n*   [`www.avenga.com/magazine/running-kubernetes-on-premise-versus-in-the-cloud/`](https://www.avenga.com/magazine/running-kubernetes-on-premise-versus-in-the-cloud/)\n\
  *   [`goteleport.com/blog/microservices-containers-kubernetes/`](https://goteleport.com/blog/microservices-containers-kubernetes/)\n\
  *   [`kind.sigs.k8s.io/`](https://kind.sigs.k8s.io/)\n*   [`minikube.sigs.k8s.io/docs/start/`](https://minikube.sigs.k8s.io/docs/start/)\n\
  *   [`k3s.io/`](https://k3s.io/)\n*   [`kubernetes.io/docs/reference/kubectl/`](https://kubernetes.io/docs/reference/kubectl/)\n\
  *   [`kubernetes.io/docs/tutorials/kubernetes-basics/explore/explore-intro/#:~:text=A%20Node%20is%20a%20worker,the%20Nodes%20in%20the%20cluster`](https://kubernetes.io/docs/tutorials/kubernetes-basics/explore/explore-intro/#:~:text=A%20Node%20is%20a%20worker,the%20Nodes%20in%20the%20cluster)\n\
  *   [`kubernetes.io/docs/concepts/services-networking/ingress/`](https://kubernetes.io/docs/concepts/services-networking/ingress/)\n\
  *   [`www.oreilly.com/library/view/kubernetes-patterns/9781492050278/`](https://www.oreilly.com/library/view/kubernetes-patterns/9781492050278/)\n\
  \n## 第 9 章：部署到生产环境\n\n### 简介\n\n本章将重点关注将应用程序或服务部署到生产环境时必须执行的关键事项。在完成代码编写和所有业务逻辑后，我们的服务“看似”已准备好部署。为什么说是“看似”？\n\
  \n提前解决潜在问题对于确保平稳、安全地过渡到生产环境至关重要。这涉及多项**准备工作**，包括发布流程、彻底测试和精确打包，以确保服务部署时符合预期。最重要的是，应用程序在部署到生产环境前必须通过安全措施，以防范漏洞和威胁。这包括实施加密、访问控制和定期安全审计，以保护敏感数据并维护应用程序的完整性。\n\
  \n在本章中，我们将深入探讨成功过渡到生产环境所需的基本准备工作，介绍软件行业中广泛认可且经过验证的多种技术。我们将看到如何使用 Golang 实现这些技术，涵盖安全基础、CI/CD、故障设计最佳实践和部署策略。\n\
  \n#### 结构\n\n在本章中，我们将讨论以下主题：\n\n*   CI/CD\n*   故障设计\n    *   超时\n    *   重试\n  \
  \  *   降级\n    *   熔断器\n    *   隔离舱\n*   安全\n    *   认证\n    *   授权\n*   功能开关\n\
  *   发布\n    *   基础部署\n    *   滚动更新\n    *   蓝绿部署\n    *   多服务发布\n    *   金丝雀部署\n\
  *   回滚\n\n### CI/CD\n\nCI/CD 代表持续集成和持续交付（或持续部署），它不仅仅是一组工具；更是一种文化变革，赋能团队更快、更可靠地交付更好的软件。\n\
  \n在 DevOps 时代之前，应用程序和软件的发布周期是按月、按季、按年，甚至更长。在 DevOps 时代，得益于 CI/CD 文化，集成新代码的生命周期快得多——一天内可以发布几个版本，甚至每小时发布几个版本。作为开发者，我们将代码交付并集成到真实世界（生产环境）的速度越快，就能获得更快的反馈循环，从而更快地发现\
  \ Bug、修复问题和改进。\n\n*   **持续集成 (CI)：** 侧重于频繁的代码集成和自动化测试。\n*   **持续交付 (CD)：** 增加了自动化打包部署到生产、预发布等环节。\n\
  *   **持续部署 (CD)：** 无需人工干预，直接将变更发布到生产环境。\n\n![Figure 9.1: CI/CD lifecycle](img/Figure-9.1.jpg)\n\
  \n**图 9.1：** CI/CD 生命周期\n\n上图描述了 CI/CD 流水线的生命周期及其中包含的通用步骤。\n\n具体而言，CI 指的是将代码部署到生产环境之前的过程。图中用蓝色表示（计划、编码、构建和测试）。CI\
  \ 的主要工作是打包和测试代码。如果 CI 充分通过，将继续进入 CD 阶段。CD 指的是将代码部署到其他环境（主要是生产环境）。CD 过程力求完全自动化，无需任何人工干预。\n\
  \n市场上有各种工具可帮助创建 CI/CD 流水线，例如 `Jenkins`、`GitHub Actions`、`CircleCI` 等。作为开发者，我们不会创建这些流水线，但必须了解它们，并确保我们的代码能按预期进行测试、构建和部署。\n\
  \n在微服务架构中使用 CI/CD 流水线至关重要，主要有两个原因：\n\n*   **保持一致性：** 一致且自动化的部署流程确保所有服务能继续无缝协作。\n\
  *   **可扩展性：** 随着系统增长，服务数量会增加。通常，服务数量的增加会线性增加工作量。然而，得益于 CI/CD，增加更多服务时的工作量会少得多。\n\n\
  ### 故障设计\n\n将应用程序部署到生产环境时，关于其如何表现存在迷雾和不确定性。尽管我们的代码通过了单元测试甚至冒烟测试，但应用程序遇到 Bug 和错误是可能且常见的。我们需要为这些场景做好准备。我们将在微服务架构的\
  \ RESTful API 服务中，发现几种处理故障的有价值的方法和设计模式。\n\n#### 超时\n\n对于任何需要向另一个服务发送请求，或需要为某段软件设定有限执行时间的服务来说，超时都是必不可少的。我们在从一个服务向另一个服务发送请求时经常会用到超时。使用超时，我们可以避免不必要的在途请求导致服务过载。超时时间因服务而异，通常在\
  \ 10 到 60 秒之间，平均为 30 秒，但这取决于具体场景，基本上可以是任何选定的时间限制。让我们看看如何在 Golang 中实现超时。\n\n> **免责声明**\
  \ —— 超时值是任意的，我给出的数字是基于我作为工程师的视角。它可能不同，最长 5 秒，或持续几分钟。\n\n以下示例演示了如何在 Go 中使用通道实现超时。在第一个示例中会发生超时，而在第二个示例中不会。我们首先创建一个容量为\
  \ 1 的通道，然后启动一个 goroutine 来模拟延迟并向通道发送消息。启动 goroutine 后，我们使用 `select` 语句：如果在超时前收到通道的结果则打印该结果，如果先达到超时则打印\
  \ \"`Timeout`\"：\n\n```go\n// 发生超时的示例\nresultCh := make(chan string, 1)\ngo func()\
  \ {\n    time.Sleep(3 * time.Second)\n    resultCh <- \"Received before timeout\"\
  \n}()\nselect {\ncase res := <-resultCh:\n    println(res)\ncase <-time.After(2\
  \ * time.Second):\n    println(\"Timeout\")\n}\n// 输出: Timeout\n\n// 未发生超时的示例\n\
  resultCh = make(chan string, 1)\ngo func() {\n```\n\n\n\n`time.Sleep(1 * time.Second)`\n\
  \n`resultCh <- \"Received before timeout\"`\n\n`}()`\n\n`select {`\n\n`case res\
  \ := <-resultCh:`\n\n`println(res)`\n\n`case <-time.After(2 * time.Second):`\n\n\
  `println(\"Timeout\")`\n\n`}`\n\n`// Output: Received before timeout`\n\n在这些示例中，`select`\
  \ 语句用于处理计时，检查来自通道的结果是否在指定的超时时间内被接收。\n\n我们也可以使用 context 实现超时。让我们看看如何实现：\n\n`ctx,\
  \ _ := context.WithTimeout(context.Background(), 2*time.Second)`\n\n`go func() {`\n\
  \n`select {`\n\n`case <-ctx.Done():`\n\n`println(\"Timeout\")`\n\n`os.Exit(1)`\n\
  \n`}`\n\n`}()`\n\n`time.Sleep(3 * time.Second)`\n\n`fmt.Println(\"Done\")`\n\n与前面的示例类似，我们在此示例中也实现了超时机制，但我们使用了\
  \ `context.WithTimeout` 和 `Done()` 函数。在此示例中，当超时发生时，`Done()` 函数会向通道发送一个信号。\n\n####\
  \ 重试\n\n正如前几章所讨论的，在微服务架构中，服务间通信的常用方式是通过 API 调用。最终，API 调用会失败，我们必须处理这些失败。简单的重试通常可以解决问题，并显著降低错误率（除非这是无论如何都会发生的\
  \ Bug）。一个好的做法是执行大约两次重试（除了第一次尝试之外）。重试次数仍取决于用例，可以是 0 次或更多。\n\n另一个好的做法是使用指数退避算法在每次重试之间等待。指数退避算法是一种策略，用于在发生故障时逐渐增加重试尝试之间的延迟，从而减少系统负载并提高成功通信的机会。\n\
  \n例如，每次重试之间的等待时间为 1、2、4、8、16，依此类推。让我们看看 Golang 中指数退避重试的实际示例。\n\n```\nfunc main()\
  \ {\n\terr := Retry(3, time.Second, func() error {\n\t\tfmt.Println(\"trying...\"\
  )\n\t\treturn fmt.Errorf(\"some error\")\n\t})\n\tif err != nil {\n\t\tfmt.Printf(\"\
  error: %s\\n\", err)\n\t}\n}\n\nfunc Retry(attempts int, sleep time.Duration, f\
  \ func() error) (err error) {\n\tcurrentAttempt := 1\n\tfor {\n\t\terr = f()\n\t\
  \tif err == nil {\n\t\t\treturn nil\n\t\t}\n\t\tif currentAttempt >= attempts {\n\
  \t\t\treturn fmt.Errorf(\"after %d attempts, last error: %w\", attempts, err)\n\t\
  \t}\n\t\ttime.Sleep(sleep)\n\t\tsleep *= 2\n\t\tcurrentAttempt++\n\t}\n}\n```\n\n\
  输出：\n\n```\ntrying...\ntrying...\ntrying...\nerror: after 3 attempts, last error:\
  \ some error\n```\n\n在前面的示例中，有一个指数退避重试的具体实现。我们可以用许多其他形式实现重试。例如，我们也可以为服务间的请求编写特定的重试机制。\n\
  \n#### 降级\n\n在可能发生故障的场景中，我们必须处理该故障。我们可以尝试执行重试，如上一节所示。然而，它并不总能解决问题，我们需要一个可信赖的降级方案。降级是一个无任何错误即可执行的已知函数，或是一个我们可以信任的先前功能。在最坏的情况下，`fallback`\
  \ 会通知用户出了问题。\n\n```\nfunc main() {\n\tresult, err := performOperation()\n\tif err\
  \ != nil {\n\t\t// 发生错误时的降级操作\n\t\tresult = fallbackOperation()\n\t}\n\tfmt.Println(\"\
  Result:\", result)\n}\n\nfunc performOperation() (string, error) {\n\treturn \"\"\
  , fmt.Errorf(\"Operation failed\")\n}\n\nfunc fallbackOperation() string {\n\treturn\
  \ \"Fallback result\"\n}\n```\n\n在前面的示例中，我们展示了一种执行降级的简单方法。我们尝试使用 `performOperation()`\
  \ 函数。不幸的是，它返回了一个错误，所以我们使用了一个名为 `fallbackOperation()` 的降级函数，它返回一个固定结果。\n\n#### 熔断器\n\
  \n熔断器是一种设计模式，用于增强分布式系统的弹性和稳定性，在我们的例子中是微服务架构。它通过以受控方式检测和处理故障，有助于防止级联故障（一个服务的故障导致许多服务故障，像多米诺骨牌一样）。\n\
  \n熔断器监控服务的可用性，如果检测到一定阈值的故障，就会“打开”熔断器，阻止对故障服务的进一步调用。这使系统能够优雅地处理故障，减轻有问题服务的负载，并防止整个系统性能下降。实现熔断器有几种方法，但建议使用现有的库，如\
  \ [`github.com/sony/gobreaker`](https://github.com/sony/gobreaker)。\n\n让我们深入了解该模式的逻辑和行为。熔断器可以有三种状态：关闭、打开和半打开。\n\
  \n##### 关闭\n\n这也是熔断器的初始状态。\n\n![](img/Figure-9.2.jpg)\n\n**图 9.2：** 熔断器处于关闭状态\n\n\
  在此状态下，熔断器允许来自服务 A 到服务 B 的请求。同时，熔断器按定义的周期监控故障数量（例如每分钟 10 次故障）。如果某个周期内的故障数量超过定义的阈值，状态将变为打开。\n\
  \n##### 打开\n\n图 9.3 显示了打开状态：\n\n![](img/Figure-9.3.jpg)\n\n**图 9.3：** 熔断器处于打开状态\n\
  \n在此状态下，熔断器将阻止来自服务 A 的任何请求，并向服务 A 返回错误响应。同时，服务 B 不会收到任何请求。熔断器将保持打开状态，直到定义的超时周期结束。然后，它将进入半打开状态。\n\
  \n##### 半打开\n\n图 9.4 描绘了半打开状态：\n\n![](img/Figure-9.4.jpg)\n\n**图 9.4：** 熔断器处于半打开状态\n\
  \n在此状态下，熔断器将允许有限的请求从服务 A 发往服务 B。如果这些有限数量的请求成功，熔断器将再次切换到关闭状态。\n\n#### 舱壁模式\n\n与熔断器模式一样，舱壁模式旨在保持系统弹性并避免级联故障。该模式受船舶舱壁的启发，舱壁将舱室隔离以防止漏水。\n\
  \n![](img/Figure-9.5.jpg)\n\n**图 9.5：** 船舶舱壁\n\n在软件中，舱壁模式隔离组件或服务，限制一个服务中的故障对其他服务的影响。该模式在并发系统（服务级别）或分布式系统（系统级别）中发挥重要作用，通过隔离和控制不同服务内的故障，有助于维持系统稳定性，最大限度地降低级联故障的风险。\n\
  \n我们通过为每个工作负载部署多个副本来在系统级别实现舱壁模式。拥有尽可能多的真正隔离的服务实例至关重要。以缓存为例；我们倾向于为每个副本配备独立的缓存，而不是让所有副本共享单个缓存。现在，一个副本引起的问题将会通过缓存影响所有其他副本。\n\
  \n在服务级别，我们希望 goroutine 之间的依赖尽可能小。此外，我们通常希望限制并发 goroutine 的数量，以避免给服务带来过大负载，导致其崩溃。我们已经看到了使用\
  \ `sync.WaitGroup` 等待并发 goroutine 完成的用法。然而，我们并未强制规定并发 goroutine 最大数量的硬性限制。限制 goroutine\
  \ 数量的一个好的实现是使用名为 `sizedwaitgroup` 的包 - [`github.com/remeh/sizedwaitgroup`](https://github.com/remeh/sizedwaitgroup)。让我们看看如何使用它。\n\
  \n```\npackage main\n\nimport (\n\t\"fmt\"\n\t\"time\"\n\t\"github.com/remeh/sizedwaitgroup\"\
  \n)\n\nfunc main() {\n```\n\n\n\n在前面的代码示例中，我们使用 `sizedwaitgroup` 包中的 `New` 函数设置了一个“特殊的\
  \ `WaitGroup`”，该函数接受最大 goroutine 数量作为数值参数。之后，我们使用一个遍历 0-99 的 for 循环。然后，像普通的 `WaitGroup`\
  \ 一样，我们使用 `Add()` 函数声明 goroutine 启动。\n\n在 goroutine 内部，我们执行 `logic` 函数，该函数打印数字并休眠一秒，然后使用\
  \ `Done()` 函数表示 goroutine 完成了工作。最终结果是输出会每次以 5 个元素为一批打印所有数字，并在每批之间等待一秒。\n\n### 安全\n\
  \n在本章中，我们将简要讨论围绕服务的安全性 —— 主要从开发者的角度出发，即认证和授权。部署安全的服务到生产环境以防止恶意威胁的访问至关重要 —— 但我们不会探讨作为运维一部分所需采取的安全措施。这主要是因为这是运维的责任，而非开发者。\n\
  \n在任何微服务系统中，我们都希望保证仅系统用户能够访问。\n\n此外，每个用户通常都有特定且不同的访问限制。要实现这两点，我们必须实施认证和授权。\n\n####\
  \ 认证\n\n> “认证验证你就是你声称的那个人，或者你拥有的东西不是伪造品。它可能涉及验证文件、要求你提供输入，或两者兼有。”\n\n这是来自 Okta 的一句很好地描述了认证的引言。\n\
  \n在 Web 应用程序中实现认证有多种选择，范围从使用第三方服务到自行实现认证服务。以下是一些示例：\n\n##### 第三方服务\n\n*   **Auth0**：Auth0\
  \ 提供认证和授权即服务。\n*   **Firebase Authentication**：Firebase 提供一套用于构建 Web 和移动应用程序的服务，包括认证。\n\
  \n##### 自行实现的认证\n\n*   **JWT（即 JSON Web Token）**：我们可以使用 JWT 实现认证。JWT 是包含一组声明的编码令牌，可用于认证用户。\n\
  *   **基于会话的认证**：我们可以使用会话和 Cookie 实现认证。当用户登录时，会在服务器上创建一个会话，会话 ID 存储在客户端的 Cookie 中。后续请求包含会话\
  \ ID，服务器用它来认证用户。\n\n##### 库/框架\n\n*   **Passport.js**：Passport.js 是 Node.js 流行的认证中间件。\n\
  *   **Spring Security**：Spring Security 是一个强大且高度可定制的认证和访问控制框架，用于 Java 应用程序。\n\n\
  #### 授权\n\n> “在系统安全中，授权是给予用户访问特定资源或功能权限的过程。该术语常与访问控制或客户端特权互换使用。” —— 另一句来自 Okta 的引言描述了授权。\n\
  \n与认证不同，授权过程要求我们实现业务逻辑。只有当我们了解系统的资源和功能时，产品团队才会定义用户权限的样子。在微服务架构中，系统中的每个服务都必须在拥有授权系统时强制执行用户权限。\n\
  \n问题在于我们不想为每个服务实现单独的授权系统。通常，授权逻辑在整个系统中是相似的，我们希望利用这一点来创建一个中央授权服务或包含授权逻辑的共享代码。无论我们使用外部授权服务还是仅仅共享代码，我们都会使用中间件将用户权限注入到单个服务的上下文中。\n\
  \n正如我们在 *第 7 章，构建 RESTful API* 中提到的许多其他能力一样，中间件可以根据需要使用共享代码或集中式授权服务。我们需要通过代码手动强制执行用户权限，或在数据库层面更自动地执行。以下是使用授权的用例：\n\
  \n*   仅授予账户管理员访问端点 `POST /users` 的权限。\n*   授予所有用户访问端点 `GET /views` 的权限，仅授予管理员和经理访问\
  \ `UPDATE /views` 的权限，仅授予管理员访问 `DELETE /views` 的权限。\n\n#### 功能开关\n\n在部署服务到生产环境时获得信心的另一种方法是使用功能开关。功能开关允许我们在服务中使用标志（所谓的功能标志）。标志是动态值，通常是布尔值，在服务运行时从其他服务注入。标志可以针对不同用户具有不同的配置。标志可用于多种目的：测试新功能、A/B\
  \ 测试、负载测试、因客户要求仅向特定用户开放功能等。\n\n以下是一些标志示例：\n\n*   一个名为 `show-billing-tab-ui` 的布尔标志决定名为\
  \ `billing` 的 UI 标签页是否打开。我们可以仅向公司内部的产品经理展示该功能（`billing` 标签页），以便他们在向所有客户发布前进行批准或完善。\n\
  *   一个名为 `pagination-size` 的数值标志决定 API 的分页大小，可用于测试最佳性能的最优分页大小。\n\n```\nfunc main()\
  \ {\n    if getEnvBool(\"feature-a\", false) {\n        fmt.Println(\"Feature A\
  \ is enabled. Performing Feature A logic.\")\n        // Include Feature A logic\
  \ here\n    } else {\n        fmt.Println(\"Feature A is not enabled.\")\n    }\n\
  \n    if getEnvBool(\"feature-b\", false) {\n        fmt.Println(\"Feature B is\
  \ enabled. Performing Feature B logic.\")\n        // Include Feature B logic here\n\
  \    } else {\n        fmt.Println(\"Feature B is not enabled.\")\n    }\n\n   \
  \ // Rest of the application logic\n}\n\nfunc getEnvBool(flagName string, defaultValue\
  \ bool) bool {\n    value, exists := os.LookupEnv(flagName)\n    if !exists {\n\
  \        return defaultValue\n    }\n    result, err := strconv.ParseBool(value)\n\
  \    if err != nil {\n        fmt.Printf(\"Error parsing environment variable %s:\
  \ %v\\n\", flagName, err)\n        return defaultValue\n    }\n    return result\n\
  }\n```\n\n这是一个 Golang 中功能开关的示例。在示例中，我们有两个布尔标志 —— `feature-a` 和 `feature-b`。函数 `getEnvBool`\
  \ 使用环境变量动态检查标志的值。同样的检查也可以通过向第三方服务发起 API 请求来完成。在 `main` 函数中，我们请求标志的值，然后决定是否执行业务逻辑。\n\
  \n我们可以自行创建功能开关外部服务，或者更推荐使用广泛采用的 SaaS，如 LaunchDarkly。\n\n#### 发布\n\n在将应用程序和服务部署到生产环境时，在旧版本和新版本之间切换的摩擦点称为发布。有多种执行发布的技术，所有这些技术都可以通过使用\
  \ Kubernetes 的原生工具或适用于 Kubernetes 的外部软件来实现。让我们观察一下不同的技术。\n\n#### 基础部署\n\n\n\n这是执行发布最直接的方式。它会立即终止所有先前的实例（Pod），并使用新版本创建新实例（Pod）。这种技术是执行发布最快且最具成本效益的方式，尽管它极易遭遇停机，风险最高。在\
  \ Kubernetes 中，我们可以通过定义 `.spec.strategy.type==Recreate` 将此技术指定给工作负载。\n\n##### 滚动更新\n\
  \n滚动更新允许逐步推出新版本。我们控制旧版本和新版本之间的过渡剂量。滚动更新会启动新版本的新实例（Pod），并在终止旧版本之前将流量转移给它们。\n\n![](img/Figure-9.6.jpg)\n\
  \n**图 9.6：** 滚动部署\n\n要在 Kubernetes 中实现这种类型的发布，我们需要指定以下配置：`.spec.strategy.type==RollingUpdate`。Kubernetes\
  \ 支持在执行滚动更新时可调整的事项包括：\n\n*   **最大不可用数：** 发布期间不可用的最大 Pod 数量。它可以是一个绝对数字（例如 5）或一个百分比（70%）。\n\
  *   **最大激增数：** 可以在工作负载中定义的期望 Pod 数量之上创建的最大 Pod 数量。与前一个配置类似，它可以是一个绝对数字或百分比。\n\n#####\
  \ 蓝绿部署\n\n这是最安全的发布技术，允许创建具有所有实例（Pod）的期望新版本。通过人工决策，开发人员可以选择将网络路由到旧版本（下图中的蓝色）或新版本（下图中的绿色）。\n\
  \n![](img/Figure-9.7.jpg)\n\n**图 9.7：** 蓝绿部署\n\nKubernetes 中没有运行蓝绿部署的内置解决方案。但是，有像\
  \ `ArgoCD` 这样的工具允许我们这样做。一般来说，蓝绿部署指的是创建所有期望的软件（甚至整个系统），然后决定将所有网络流量路由到哪个版本。虽然它是执行发布最安全的方式，但它是最不具成本效益的技术，且耗时最长。\n\
  \n##### 多服务发布\n\n这种发布技术是指从系统的角度进行发布，而不是从单个服务的角度。使用多服务发布，我们希望将多个服务作为一个整体单元一起发布。我们可以使用之前提到的任何技术来执行多服务发布。Kubernetes\
  \ 不提供执行此技术的内置能力。然而，`Helm` 是市场上最流行的 Kubernetes 原生开源工具之一，它可以非常快速地实现这一点。`Helm` 是一个用于管理\
  \ Chart 的 Kubernetes 开源模板引擎，可以聚合多个 Kubernetes 资源并一次性发布它们。\n\n##### 金丝雀部署\n\n金丝雀部署是滚动更新和蓝绿部署的结合。这种技术允许我们像滚动更新技术一样执行逐步发布，同时将流量路由到旧版本和新版本两者。像蓝绿部署一样，金丝雀部署允许我们观察这两个版本，并手动决定是将所有流量路由到新版本，还是继续将流量路由到先前版本。与蓝绿部署一样，它在\
  \ Kubernetes 中没有内置解决方案，我们可以使用 `ArgoCD` 等外部工具。\n\n##### 回滚\n\n新版本往往不如预期，可能会导致多个问题和故障。在这种情况下，我们希望执行回滚。回滚是将系统或应用程序恢复到先前状态或版本。在\
  \ Kubernetes 中，有两种执行回滚的方法：\n\n*   **Kubectl**：Kubernetes 中的每个资源都有一个修订版本，每次我们发布新版本时，都会创建一个新的修订版本。以下是如何使用\
  \ `kubectl` 执行回滚的示例：\n\n    ```\n    kubectl rollout undo <kind>/<resource-name>\
  \ --to-revision=<revision-number>\n    kubectl rollout undo deployment/nginx-deployment\
  \ --to-revision=2\n    ```\n\n*   **Helm**：Helm 中的每个 Chart 都有修订版本，因为它是 Kubernetes\
  \ 中的一种资源。以下是如何使用 Helm 执行回滚的示例：\n\n    ```\n    helm rollback <RELEASE> [REVISION]\
  \ [flags]\n    helm rollback frontend-services 13\n    ```\n\n### 结论\n\n在本章中，我们探讨了为将应用程序和服务部署到生产环境做准备所需的关键步骤。从最初的代码完成到确保服务具备生产就绪性，我们涵盖了各种主题，包括\
  \ CI/CD、面向失败的设计、超时、重试、回退机制，以及身份认证和授权等安全措施。\n\n我们深入研究了各种部署策略，如基本部署、滚动更新、蓝绿部署、金丝雀部署和多服务发布，每种策略都有其自身的优势和注意事项。此外，我们还讨论了功能开关作为逐步引入新功能的一种技术的重要性，以及在发生意外问题时回滚到先前稳定版本的回滚概念。\n\
  \n通过实际示例，特别是在 Golang 的背景下，我们演示了如何有效地实现这些技术。通过理解和应用这些概念，开发人员可以确保他们的服务按预期交付到生产环境，并在面对潜在故障时保持其完整性和可靠性。\n\
  \n在本章结束时，很明显，将应用程序部署到生产环境是一个多方面的过程，需要仔细的规划和执行。通过遵循最佳实践并利用所讨论的工具和技术，开发人员可以自信地驾驭生产部署的复杂性，并确保其服务在现实世界中取得成功。\n\
  \n在 *第 10 章，生产环境中的后续步骤* 中，我们将介绍应用程序和服务已在生产环境中运行时需要考虑的事项。\n\n### 参考资料\n\n*   [`www.mabl.com/blog/what-is-cicd`](https://www.mabl.com/blog/what-is-cicd)\n\
