  \n多年来，Nir 在国际范围内发表演讲，并撰写了多篇触达全球受众的文章。他为众多开源项目做出贡献，其中最成功的项目用户超过 100,000 名。\n\n除了专业成就，Nir\
  \ 还指导过许多人，帮助他们进入高科技行业并开启职业生涯。工作之余，他喜欢阅读、听播客、运动、烹饪和探索新地方，不断寻求新的体验和知识。\n\n## 技术审阅者简介\n\
