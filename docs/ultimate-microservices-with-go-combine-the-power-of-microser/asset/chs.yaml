  \n## 第 2 章\n\n### Go 的易用性\n\n### 简介\n\n在本章中，我们将深入探索 Go 的精彩世界。我们将深入研究基础知识，考察其历史，并理解发明者创建这门语言的初衷。创建这门语言的意图是什么？它旨在解决什么问题？\n\
  \n为了理解 Go，我们旨在理解其核心原则、范式、目的等。通过理解它们，我们将拥有在编写 Go 代码时洞察全局的能力。许多缺乏经验的 Go 开发者开始编写 Go\
  \ 代码后，会对错误处理技术感到恼火。如果他们清楚地理解核心原则，就会意识到 Go 当前的错误处理方式才是精确的解决方案。\n\n我们将详细阐述每一条核心原则，理解其意图，并从中获益。然后，我们将观察新手接触该语言的过程，从入职到将代码部署到生产环境。\n\
  \n接着，我们将探索 Golang 生态系统。生态系统是一个由众多社区和 Gophers 组成的庞大有机体。由于 Golang 是由 Google 维护的开源项目，加入社区的门槛非常低。\n\
  \n无需具备 Go 的先验知识。建议在积累更多 Go 开发经验后重读本章。我们将涵盖的许多观点届时会与你产生更强的共鸣。引用自《Effective Go》：“*换句话说，要写好\
  \ Go，理解其特性和习惯用法非常重要。*”\n\n#### 结构\n\n在本章中，我们将讨论以下主题：\n\n*   Go 的发明\n*   核心原则与范式\n\
  *   简洁性与极简设计方法\n*   适合云的高性能语言\n*   Go 的可维护性\n*   从入职到生产\n*   Go 的生态系统——社区及更远\n\n\
  ### Go 的发明\n\n那么这门语言是如何开始的？一切始于 Google。2007 年，Google 的三位工程师决定创建一门新语言。该语言由 Ken Thompson、Rob\
  \ Pike 和 Robert Griesemer 设计，他们各自带来了独特且相关的背景。他们参与了 UTF-8、Unix、C 编程语言等重大技术发明。该语言的全称是\
  \ Golang，由“go”+“lang”组合而成，其中“lang”是 language 的缩写。不过，他们更倾向于称其为 Go 而非 Golang，以强调该语言旨在简单易记。“Go”是一个常见的英语单词，暗示着移动、进步和效率，这与该语言为软件开发提供简单高效方法的目的相一致。此外，“Go”也是\
  \ Google 的前两个字母。\n\n在获得 Google 批准后，他们开始开发这门语言。他们的核心内部协议之一是：仅包含他们所有人都认同的编程原则。尽管这门语言发明于\
  \ 2007 年，但它主要受 C 编程语言（创建于 1972 年）影响，而非 C++、Java、C# 等较新语言。Go 和 C 编程语言有许多相似之处。确实，一些人将\
  \ Go 称为 C 语言的现代版本。\n\n他们开始使用 Go、C++ 和汇编语言编写这门编程语言。\n\n\n\n到 2008 年，Google 内部许多人都想加入该项目。它在\
  \ Google 内部迅速获得了积极的发展势头。\n\n2009 年，Go 通过 GitHub 正式作为开源项目发布，来自世界各地的开发者都能并愿意贡献代码。此外，我们在上一章提到的\
  \ Gopher 吉祥物也于 2009 年亮相。参考资料中提供了项目链接。\n\n请注意，Go 组织下的许多其他代码库也非常重要，且是 Golang 生态系统的一部分，我们稍后将讨论。将语言开源并让全球开发者可用的决定，对其当前的成功起到了关键作用。\n\
  \n2012 年，Go 1.0 版本发布，提供了对简洁性和高效性最广泛的保障，我们将在本章后面讨论这一点。从此，Go 每年发布两个版本（2012 年除外）。1.5\
  \ 版本是最重大的更新，该版本将编译器工具链完全转换为 Go 实现。另一个里程碑版本是 1.18，引入了泛型和模糊测试概念。本书遵循的当前 Go 版本是 1.20（2023\
  \ 年 7 月）。\n\n### 核心原则与范式\n\n在设计 Go 编程语言时，发明者遵循了几项原则。直到今天，所有这些核心原则仍在每个 Go 版本的发布说明中得到体现。我们建议每次发布新版本时都查看\
  \ Go 发布说明。这些说明不长，阅读理解大约需要一小时。每年投入 2-3 小时了解语言的最新进展非常有价值。发布说明清晰、直白、易于理解。\n\n正如上一章所见，该语言设计初衷是很好地适应云计算平台部署、多核计算机、大型代码库处理等场景。\n\
  \n在深入探讨每项原则的细节之前，必须提及官方 Go 文档《Effective Go》。我们建议阅读它，讲解清晰明了。另一个宝贵资源是 Go 官方 GitHub\
  \ 组织的代码审查评论 Wiki，建议浏览并加以利用。\n\nGo 有三大核心原则：\n\n*   **简洁性**：Go 设计为直观易懂，语法简洁，避免不必要的复杂性。这使开发者更容易编写、阅读和维护代码。\n\
  \n*   **高效性**：Go 以速度和性能著称。它直接编译为机器码，使其速度媲美 C 或 C++，却拥有高级语言的易用性。\n\n*   **可维护性**：Go\
  \ 强调清晰、模块化的代码结构和强类型，有助于防止错误，并使代码随时间推移更易于更新和重构。\n\n> **免责声明**：这些核心原则并非在 Go 官方文档中正式声明，而是笔者归纳总结的。\n\
  \n### Go 范式\n\nGo 编程语言的范式在官方文档中已正式声明，包括：\n\n*   命令式\n*   并发编程\n*   面向对象\n\n####\
  \ 命令式\n\n以下是命令式编程的简要概述：命令式编程是一种软件范式，代码旨在逐步解决问题，每一行代码都旨在推进问题的解决。它关注**如何**解决问题。命令式编程与声明式编程形成对比，后者更关注声明**想要**得到什么。声明式语言的例子包括\
  \ HTML、SQL、CSS 等。Go 是一门命令式语言。证明 Go 是命令式编程语言的特性包括语句、变量、循环等。\n\n#### 并发编程\n\n并发编程涉及设计软件以同时执行多个任务，通常能提高处理多种操作的应用程序的性能和响应能力。我们稍后将详细讨论如何使用\
  \ Go 并发。这一范式是创建该语言的核心原因之一。Go 可以是多线程、多进程和异步的，这些是并发编程语言的关键因素。\n\n#### 面向对象\n\n> “是的，也不是。虽然\
  \ Go 有类型和方法，并允许面向对象风格的编程，但没有类型层级。Go 中‘接口’的概念提供了一种不同的方法，我们认为它易于使用，且在某些方面更通用。还有将类型嵌入其他类型的方法，提供了类似于（但不等同于）子类化的功能。此外，Go\
  \ 中的方法比 C++ 或 Java 更通用：它们可以为任何类型的数据定义，甚至包括内置类型，如普通的‘未装箱’整数。它们不限于结构体（类）。\n>\n> 此外，缺乏类型层级使得\
  \ Go 中的‘对象’感觉比 C++ 或 Java 等语言轻量得多。”\n\n这段引文取自 Golang FAQ，很好地解释了 Go 中的面向对象概念。当然，我们将在后续详细讨论\
  \ Go 中的组合、结构体、接口等内容。\n\n**Go 支持的 OOP 原则**：\n\n*   **封装**：Go 通过包和结构体支持封装。我们可以在结构体上定义方法，将行为与数据关联，类似于传统\
  \ OOP 中的方法。\n\n*   **组合**：Go 不使用经典继承，而是使用组合，通过嵌入概念从简单类型构建复杂类型。\n\n**Go 不支持的 OOP\
  \ 原则**：\n\n*   **继承**：Go 不支持传统意义上的继承。没有类，因此无法定义类层级。Go 的方法是使用接口和组合代替。\n\n*   **多态**：虽然\
  \ Go 不支持通过继承实现多态，但它通过接口支持一种形式的多态。单个接口可由多种类型实现，接受接口作为参数的函数可接收任何实现该接口的类型。\n\n### Go\
  \ 特性\n\n编程语言的另外两个属性是动态/静态和强/弱。对 Go 而言，这些属性是：\n\n*   静态类型\n*   强类型\n\n#### 静态类型\n\
  \n在 Go 中，一旦变量类型确定，运行时就无法更改。我们不能在不声明类型的情况下声明变量。请注意，我们可以这样做：\n\n`x := 5`\n\n在这种情况下，我们没有显式声明类型，但\
  \ Go 使用“类型推断”来决定变量类型。推断并不总是生效，直到我们使用 `:=` 运算符。\n\n在该用例中，推断类型当然是 `int`。\n\n#### 强类型\n\
  \n“强”编程语言与“弱”编程语言的区别在于，我们可以对变量类型执行某些操作。请看此例：\n\n`myString := \"name\" + 2`\n\n这行代码会导致编译错误，因为我们不能将整数添加到字符串中。\n\
  \n### 简洁性与极简设计方法\n\n目前有许多广泛使用的编程语言。这些语言在每次新版本发布时变得相似的趋势日益明显。这种相似性表现为它们的能力和特性日益趋同。\n\
  \n最初，每种编程语言都是为特定目的而创建的，拥有有限的能力和特性集。然而，随着这些语言每个后续版本的发布，都会发生许多增强。这些更新包括错误修复、改进、新特性、核心库扩展、新库、新概念等。\n\
  \n大多数编程语言采用“越多越好”的方法，不断扩展其能力、特性和库，使它们能够处理各种任务。\n\n\n\n尽管如此，必须注意 Go 语言可能并不符合这一情况，因为它偏离了这种常量扩展的模式。\n\
  \n查阅 Go 语言的发布说明后会发现，大多数更新主要集中在编译增强、性能改进和准确性优化上。虽然确实引入了一些新特性和功能（一个显著的例子是泛型），但它们并不构成变更的主体。这种对简洁性的强调正是\
  \ Go 语言的追求。他们希望保持 Go 语言**枯燥**（boring）。\n\nGo 语言简洁性和极简主义的一个例子是语言的关键字数量。下图展示了关键字数量的对比。\n\
  \n![](img/Figure-2.1.jpg)\n\n**图 2.1：** 编程语言关键字数量对比\n\n如果一种编程语言拥有许多关键字，并不一定意味着它是一门糟糕的语言。反之，关键字数量少也并不自动意味着它是一门优秀的编程语言。编程语言的质量和有效性取决于许多因素，而不仅仅是它拥有的关键字数量。\n\
  \n但可以肯定地说，关键字越少，越容易记忆和使用。我们可以看到 Go 语言是关键字最少的语言之一。\n\n#### 隐藏的复杂性\n\n语言内部包含许多概念，为了在打造一门强大的编程语言的同时保持语言的简洁，投入了大量精力。\n\
  \n并发模型是隐藏复杂性的绝佳例子。我们将在本章后面详细讨论并发模型。它仅需三个按键即可实现并发——'`g`'、'`o`', '` `'——这令人惊叹。\n\n\
  另一个极致简洁的例子是访问修饰符。共有两种场景：函数/变量/常量可以是私有的或公有的。在 Go 语言中，要使某个标识符公开，只需做两件事：\n\n*   它需要声明在最高作用域。\n\
  *   它需要以大写字母开头。\n\n仅此而已；无需额外的关键字。\n\nGo 语言中的其他一些简洁特性：\n\n*   垃圾回收\n*   常量\n*   接口\n\
  *   包\n\n所有这些示例背后都隐藏着巨大的复杂性。\n\n总结本节，Go 语言不在功能上竞争。“*至于 Go 1.0，语言规范已冻结。*”\n\n###\
  \ 适合云环境的快速语言\n\n> *“Go 语言快速、有趣且高效。”* —— Ken Thompson。\n\n这是发明这门语言的核心原因之一：提供一门可以在云端并发运行的快速语言。\n\
  \n我们将详细阐述使 Go 语言如此快速的三个方面：\n\n*   编译速度快\n*   类似 C 语言\n*   并发模型\n\n#### 编译速度快\n\n\
  Go 语言不仅旨在运行时快速，还极其重视编译速度，这类似于敏捷方法论的理念，即显著提高发布频率。\n\n那么是什么让它编译得如此之快？是什么让二制制文件如此精简？原因如下：\n\
  \n*   避免循环依赖\n*   编译设计\n*   未使用的导入和声明\n*   Go 语言的简洁性\n\n##### 避免循环依赖\n\n如果我们尝试以循环方式导入包，将会遇到编译错误。如果存在循环依赖，Go\
  \ 语言无法编译。所有依赖都可以表示为一个 DAG（即有向无环图）。由于这种包结构，只有当树中的所有包都已编译完成后，每个包节点才能被编译。\n\n![](img/2.2.jpg)\n\
  \n**图 2.2：** 包依赖 DAG\n\n在该示例中，包 A 和 B 已经编译完成，我们可以并发编译 C、D 和 E。\n\n##### 编译设计\n\n\
  引用 Golang FAQ 中对“为什么要创建一门新语言？”的回答：\n\n> *“最后，使用 Go 语言旨在追求速度：在单台计算机上构建大型可执行文件最多应只需几秒钟。实现这些目标需要解决许多语言层面的问题：表达能力强但轻量级的类型系统；并发和垃圾回收；严格的依赖规范；等等。这些无法通过库或工具很好地解决；因此需要一门新语言。”*\n\
  \n正如我们所见，创建 Go 语言的主要原因之一是开发一门易于使用的快速语言。这种理念始终存在于 Go 团队的脑海中。\n\n##### 未使用的导入和声明\n\
  \n在 Go 语言中，我们不能导入未使用的包，也不能声明未使用的变量。这两种情况都会导致编译错误。Go 语言仅编译必要的依赖，从而实现精确编译，避免编译未使用的依赖。\n\
  \n##### Go 语言的简洁性\n\n如前所述，Go 语言以其简洁性著称。它仅包含约 25 个关键字，这使得编译过程更加直接。这种简洁性在编译时间上带来了显著的回报。\n\
  \n#### 类似 C 语言\n\n有人可能会将 Go 语言描述为 C 语言的现代版本。虽然许多其他语言通常使用类和继承，但 Go 语言采取了不同的方法，利用结构体和接口配合组合。Go\
  \ 语言从 C 和 C++ 继承了各种元素，例如数据结构、指针、按引用或按值传递的能力等。\n\nC 和 C++ 以速度著称，Go 语言旨在达到类似的性能水平。然而，它也力求成为一门现代且用户友好的语言，使编写代码更加容易，从而提高生产力。\n\
  \n#### 并发模型\n\n并发是 Go 语言的首要任务。通过 Goroutine 和 Channel，Go 语言使并发编程变得简单高效。Goroutine\
  \ 是由 Go 运行时管理的轻量级线程，允许多个任务独立运行。Channel 是 Goroutine 之间通信的方式，实现了安全且同步的数据交换，从而构建更快、更具扩展性的应用程序。\n\
  \nGoroutine 和 Channel 是一等公民。并发是 Go 语言旨在建立并做好的核心概念之一。我们将简要探索 Go 语言独特的并发模型。\n\nGo\
  \ 语言是一门多线程语言。然而，Go 语言与其他语言不同，作为开发者，我们无法直接访问线程。这是基于“线程是操作系统的资源”这一理念实现的。在 Go 语言中，我们不应关心线程。当然，也有需要担心的地方，比如不同\
  \ Goroutine 对同一对象的访问（`sync` 核心库应通过锁、唯一对象等帮助解决这一问题）。\n\n另一个担忧是 Goroutine 泄漏。我们将在后续章节中解决这两个问题。\n\
  \n那么，什么是 Goroutine？Go 团队通过 Goroutine 封装了传统线程。它们在资源使用和初始化方面极具成本效益。\n\n关于内存占用，初始化\
  \ Goroutine 栈仅需 2 KB，而默认线程栈为 8 KB。这轻量了 4 倍！Goroutine 内存轻量的直接效果是，分配和释放它们比线程快得多。\n\
  \nGoroutine 具有革命性，完全由 Go 运行时管理而非操作系统。它们拥有便捷的通信机制、轻量级内存、快速初始化，且不依赖硬件。\n\n为了解释 Goroutine\
  \ 的工作原理，让我们谈谈 Go 调度器。它是 Go 运行时中的一个组件，拥有对内核的直接访问权，负责管理我们执行的每一个 Goroutine。\n\nGoroutine\
  \ 被调度在线程上，调度器负责将它们分配到线程上。\n\n![](img/2.3.jpg)\n\n**图 2.3：** Go 调度器\n\n\n\n在这张图中，我们可以看到系统的核心。操作系统调度器管理着一层线程；在它之上，我们可以看到执行\
  \ Goroutine 的 Go 程序，而 Go 调度器管理着这一切。\n\n让我们观察单核系统的行为。\n\n![](img/2.4.jpg)\n\n**图\
  \ 2.4：** 单核操作系统分配一个 goroutine\n\n这张图展示了一个单核操作系统，它执行一些被称为 G1 的 Goroutine。然后在最后执行另一个被称为\
  \ G2 的 Goroutine。\n\n但当我们拥有多核时会发生什么？当一个 Go 程序启动时，调度器会初始化一个线程；如果一些 goroutine 正在执行而之前的\
  \ goroutine 尚未完成，它会分配更多线程，直到达到最大线程数。配置中的最大线程数即为 Go，它被设置为一个名为 `GOMAXPROCS` 的环境变量。Go\
  \ 团队通过基准测试得出的默认且推荐的值是核心数。例如，如果一台机器有 8 个核心，`GOMAXPROCS` 的值就是 8，调度器不会调度超过 8 个线程。我们可以配置该环境变量，但这不推荐。\n\
  \n当需要执行的 goroutine 多于可用线程时，调度器是如何工作的？\n\n![](img/2.5.jpg)\n\n**图 2.5：** 由调度器管理的、带有队列的多线程\n\
  \n每个线程都有一个专用队列，该队列知晓下一个应该在此线程上调度的 goroutine。每分配一个新线程，就会创建一个新队列。每个 goroutine 在某个线程上运行时被分配，并直接进入同一线程的队列。为了防止单个队列负载过重，调度器会在线程间执行工作窃取，并平衡它们之间的工作。\n\
  \n以上简要解释了 Go 调度器。调度器还会考虑许多其他因素，如系统锁、代码锁、线程间通信、线程分配、空闲线程等。\n\n### Go 的可维护性\n\nGo\
  \ 易于维护有几个原因：\n\n*   兼容性\n*   Go 的简洁性\n*   错误处理\n\n### 兼容性\n\n> “旨在让符合 Go 1 规范编写的程序在该规范的生命周期内持续能够正确编译和运行，且无需更改。在未来的某个不确定时间点，可能会出现\
  \ Go 2 规范，但在那之前，今天能工作的 Go 程序在未来 Go 1 的“点”版本发布（Go 1.1、Go 1.2 等）时应继续保持工作。”\n\n这是 Go\
  \ 第一个版本发布时文档中的引述。参考资料中附有该文档。请注意，文档后续部分设定了预期，并指出事情可能会出错，例如 bug、安全问题、结构体字面量等。\n\n\
  每当发布一个 Go 版本时，都旨在保持向后和向前兼容性。根据 Russ Cox 在 GopherCon 2022 上的演讲，Go 团队使用两种主要方法来保持兼容性：\n\
  \n*   API 检查\n*   测试\n\n#### API 检查\n\n为了防止破坏之前的 Go 版本，我们不能移除导出的符号、API 方法、包等。否则程序将无法运行。Go\
  \ 不能移除库、结构体、方法等。\n\nGo 团队使用一个包含所有 Go 版本所有导出 API 签名的工具。然后，Go 团队运行测试，将包的 API 与导出的\
  \ API 签名进行比较，如果有变化则发出通知。如果发生变化，他们会采取行动来阻止它，或者至少将其影响降到最低。\n\n#### 测试\n\nGoogle 在\
  \ Go 维护中拥有的一个巨大优势是可以在 Google 内部对其进行测试。Go 的开发版本会针对 Google 所有内部 Go 程序的测试进行测试。所有这些测试通过后，Go\
  \ 开发分支会被用于 Google 的生产环境和工具链中。\n\n每次发布 Go 版本时，他们都会记录新版本中是否有东西被破坏。Go 还提供了一个名为 `GODEBUG`\
  \ 的强大工具，帮助我们升级版本并验证我们的程序不会 panic。\n\n### Go 的简洁性\n\n正如我们之前所见，Go 的主要目标之一是简洁性。当我们审视程序的可维护性时，这种简洁性就会得到回报。Go\
  \ 团队的一个显著优势是他们制定所有规则。在上一章中，我们讨论了“Effective Go”，其中包含了所有约定、最佳实践和文档，指导如何做事。与其他一些语言的约定来自不同地方不同，在\
  \ Go 中，Go 团队决定一切。\n\n### 错误处理\n\nGo 与其他语言不同。在许多其他语言中，我们期望看到 `try-catch-finally`\
  \ 惯用语。\n\nGo 并非如此。在 Go 中，我们会显式地创建一个错误并将其作为变量返回。这里引用一段 Go FAQ 的内容。\n\n> “我们认为将异常与控制结构耦合（如\
  \ `try-catch-finally` 惯用语）会导致代码复杂化。这也倾向于鼓励程序员将太多普通错误（如无法打开文件）标记为异常。”\n\n有时看到这样的代码会让人沮丧：\n\
  \n```\nif err != nil {\n    return err\n}\n```\n\n然而，如果我们理解其动机，就能接受它。此外，根据 Go FAQ，Go\
  \ 的错误处理给了我们一种讲述故事的方式。我们不只是返回错误，而是可以为其添加上下文，从而创建错误的“故事”，例如：\n\n```\nif err != nil\
  \ {\n    return fmt.Errorf(\"connecting to DB: %w\", err)\n}\n```\n\n现在我们有了上下文，知道这个错误是在尝试连接数据库时发生的。这只是一个理解\
  \ Go 中错误处理隐藏力量的例子。\n\n### 从入门到生产\n\n编程语言不仅仅由编译器、语法等语言组件组成。它还包含工具链中至关重要的几个工具，如包管理器、文档、格式化工具、静态分析工具、测试工具等。\n\
  \nGo 旨在通过在工具链中提供这些工具，给 Go 开发者一种整体体验。Go 团队想要创建工具链有三个原因。\n\n一是他们不需要依赖匿名贡献者来创建工具。第二个也是更重要的原因是\
  \ Go 团队最清楚构建此类工具的最佳方式。第三个原因是为了实现标准化。\n\n我们不想要两个做非常相似的事情但运作方式不同的格式化工具，我们可以在其他语言中看到这种模式。格式化工具只是标准化的一个例子。它可以是静态分析工具、测试、time\
  \ 包等。\n\n新手从接触语言到将其部署到生产环境需要哪些步骤？\n\n1.  入门\n2.  规划\n3.  包管理\n4.  编写代码\n5.  故障排查\n\
  6.  测试\n7.  安全\n8.  构建\n9.  其他\n\n#### 入门\n\n语言新手不了解语言语法的样子。Go 团队创建了一个 playground（演练场），因此阅读过该语言介绍的开发者可以立即参与并上手练习。所有文档和\
  \ playground 都在 `go.dev` 中。\n\n#### 规划\n\n新手爱上了这门语言。现在，他们想开始一个项目。但在跳进代码之前，我们要先规划。我们想了解项目将是什么样子。为此，我们必须了解并探索我们打算使用的包。所有\
  \ Go 包有一个单一的制品管理器，毫不意外，它存在于 `go.dev` 中，具体在 `pkg.go.dev`。\n\n#### 包管理\n\n要与 Go 工具链中的各种工具交互，我们只需要拥有\
  \ Go CLI。在 Go CLI 中，各种工具帮助我们启动项目。我们完成了项目规划，现在想开始。我们将运行以下命令来初始化一个项目：\n\n\n\n\n`go\
  \ mod init github.com/nirsht/microservices-with-go`\n\n如果我们想要安装任何包，可以运行：\n\n`go\
  \ install github.com/nirsht/myawesomepackage`\n\n有各种工具可以帮助我们管理包，如 `go mod tidy`、`go\
  \ vet` 等。这些命令功能强大，让我们能够管理包。\n\n#### 编写代码\n\n项目设置完成并引入所有所需的包后，我们就可以开始编写代码了。我们可以选择\
  \ Visual Studio Code、Vim 或 GoLand（由 JetBrains 开发）等集成开发环境（IDE）来高效地编写代码。这些 IDE（以及其他\
  \ IDE）依赖语言服务器协议（LSP）来实现其功能。\n\n微软对 LSP 给出了一个很好的定义：\n\n> “语言服务器协议（LSP）是开发工具与语言服务器进程之间交换消息的标准化产物。使用语言服务器或守护进程并非新颖概念。Vim\
  \ 和 Emacs 等编辑器已经这样做了一段时间，以提供语义自动补全支持”\n\n对于许多编程语言，LSP 并非由语言的原作者提供。但在 Go 中情况不同。Go\
  \ 的 LSP 是 `gopls`，由 Go 团队维护。此外，Go 团队还为 VS Code 提供了一个名为 `vscode-go` 的扩展。\n\n####\
  \ 故障排查\n\n与所有软件工程师一样，我们的代码有时能完美运行。我们的工作包括阅读代码、调试和排查烦人的 Bug。Go 团队深知这一点。他们开发了一款旨在协助开发者进行调试和故障排查的工具。例如，他们提供了官方\
  \ Go 调试器 - `gdb`。此外，Go 团队还开发了一款名为 `pprof` 的优秀性能分析器，它支持对性能分析数据进行可视化和分析。\n\n#### 测试\n\
  \n任何自尊的软件工程师都会编写测试。这是创建系统可维护性的行业标准。Go 也为我们提供了一个高效执行测试的工具。不需要外部库，只需 Go CLI。运行时：\n\
  \n`go test.`\n\n它会遍历所有文件，找出具有 `_test` 后缀的文件，然后运行所有以 `Test` 为前缀的函数。\n\nGo 团队在 `go\
  \ test` 命令中提供了多种配置。我最喜欢的是通过 Go CLI 使用以下命令测试竞态条件的选项：\n\n`go test -race`\n\n从 Go 1.18\
  \ 开始，模糊测试可用。\n\n> “模糊测试是一种自动化测试，它持续操纵程序的输入以查找 Bug。”\n\n模糊测试是一个方便且强大的工具，用于验证我们的程序在获得错误输入时不会崩溃。\n\
  \n### 安全\n\n现在，我们想要发布代码用于生产环境。但有一个问题。我们需要检查包的依赖项中是否存在安全漏洞。\n\n自 Go 1.18 起，我们可以运行一个命令来检查所有漏洞\
  \ - `govulncheck`。Govulncheck 由 Go 团队维护的 Go 漏洞数据库提供支持。\n\n#### 构建\n\n剩下的唯一事情就是打包我们的代码。Go\
  \ 有一个编译器，负责将我们的代码编译为所需的二进制架构和操作系统。这些可以通过环境变量轻松配置 - `GOARCH` 用于架构，`GOOS` 用于操作系统。\n\
  \n构建命令内置于 Go CLI 中，我们可以通过运行以下命令来使用它：\n\n`go build main.go`\n\n#### 其他\n\n在这趟旅程中，我们只介绍了\
  \ Go 工具链中的一小部分工具。为了保持一致性，Go 将几件事集中管理，如代码检查（检查代码错误等）和格式化（让代码整洁美观，这在 Go 中至关重要）。我们认为\
  \ Go 团队选择了合适的包纳入语言，比如用于处理时间相关任务的 “time” 包。\n\n### Go 的生态系统 — 社区及更远\n\n如今，大多数编程语言都是\
  \ OSS（即开源软件）。Go 就是其中之一，并且从第一天起就是开源驱动的。\n\n如今，许多人都非常激动并渴望为 Go 或 Go 开发工具链中的许多其他项目做贡献。就包的数量而言，Go\
  \ 是最流行的编程语言之一（正如我们在上一章所见）。\n\n![](img/Figure-2.6.jpg)\n\n**图 2.6：** 主流开源编程语言的包数量\n\
  \n要提升编程语言方面的技能、知识和个人表现，以某种方式参与生态系统至关重要。这可以通过为开源项目做贡献、加入社区，或参加线上或线下聚会来实现。你也可以加入 Slack\
  \ 或 Discord 社区。\n\n一个查看大多数此类机会的绝佳网站是 `gophersource`。\n\n### 总结\n\n在本章中，我们学习了构成 Go\
  \ 的概念。通过 Google 的历史，我们看到了创建这门新语言的动机和原因——简洁性、速度、可维护性、无缝上手等。\n\n了解这些内容将为我们提供背景，让我们明白为什么\
  \ Golang 中的某些事物看起来是这样的。Go 中的错误处理就是一个绝佳的例子。许多 Go 新手都在努力理解为什么不存在 `try-catch-finally`。但过一段时间后，他们就明白了。继承也是如此；许多新手最初会惊讶于继承的不存在，但过一段时间后，他们就会理解为什么组合是\
  \ Go 的精准选择。\n\n在下一章中，我们将探索 Go 的语法和基础知识。在涵盖所有基础知识后，我们将深入更高级的主题。\n\n我们将更详细地讨论本章中提到的简洁性概念。此外，我们将深入探讨并发的实现，并解决在\
  \ Go 中使用并发时出现的挑战。我们的讨论将涵盖组合、封装、多态等各种主题。敬请期待！\n\n### 参考资料\n\n*   [`github.com/golang/go`](https://github.com/golang/go)\n\
