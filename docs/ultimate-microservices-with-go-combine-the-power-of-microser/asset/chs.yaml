  *   [`go.dev/blog/race-detector`](https://go.dev/blog/race-detector)\n\n## 第 5 章\n\
  \n### 释放 Go 语言的并发威力\n\n### 简介\n\n上一章深入探讨了 Go 语言中的核心主题及其基本原则。本章将聚焦并深入探讨最显著的支柱 ——\
  \ 并发。Go 语言开发的核心动机之一，是为开发者提供一种简单便捷的方式来编写并发运行的代码。我们将涵盖 Go 并发相关的所有主题 —— Goroutine、Channel、原则、设计模式、并发陷阱（如\
  \ Goroutine 泄漏）等。并发旨在提供最优性能。良好的性能是任何架构类型的关键指标，尤其是微服务。\n\n在《第 2 章 Go 的易用性》中，我们讨论了\
  \ goroutine 和调度器的工作原理。本章将在此基础上继续详述 goroutine。在深入 Go 并发之前，让我们先澄清三个容易混淆的术语：\n\n* \
  \  并发\n*   并行\n*   异步\n\n**并发** 是指多个任务的执行被交错进行，而非按顺序依次执行。\n\n**并行** 是指这些任务实际上在同时执行。\n\
  \n![](img/Figure-5.1.jpg)\n\n**图 5.1：** 并发与并行对比\n\n**异步** 是一个独立的概念（尽管在某些语境下相关）。一个事件发生的时间可能与另一个事件不同步（非同步）。下图展示了同步执行与异步执行的区别，其中参与者可以对应其他线程、进程甚至服务器。\n\
  \n![](img/Figure-5.2.jpg)\n\n**图 5.2：** 同步过程\n\n![](img/Figure-5.3.jpg)\n\n**图 5.3：**\
  \ 异步过程\n\n必须注意这些区别，因为本章将讨论 Go 中的并发。\n\n#### 结构\n\n本章将讨论以下主题：\n\n*   Goroutine\n\
  *   Channel —— 有缓冲 vs 无缓冲\n*   `Sync` 包\n*   发布/订阅\n*   Channel 关闭原则\n*   避免 Goroutine\
  \ 泄漏\n*   Fan In Fan Out 模式\n\n### Goroutine\n\n\n\n\n### Goroutines 和 Channels\n\
  \nGoroutines 和 channels 是我们在 Go 中用于实现并发的核心概念。在本节中，我们将探索演示 Goroutine 执行的代码示例，研究运行\
  \ Goroutine 的限制，并讨论 Goroutine 泄漏的影响。\n\n```go\nfunc main() {\n    go printHello()\
  \ // Hello\n\n    go func() {\n        fmt.Println(\"Hello from anonymous function\"\
  )\n    }() // Hello from anonymous function\n\n    time.Sleep(1 * time.Second)\n\
  }\n\nfunc printHello() {\n    fmt.Println(\"Hello\")\n}\n```\n\n就这么简单：只需使用关键字 `go`\
  \ 然后调用一个函数。该函数可以像 `printHello` 这样声明，也可以是一个匿名函数。从我们执行它们的那一刻起，Go 调度器将管理这些 Goroutines。调度器负责分配新的\
  \ goroutine、将它们分配给线程、执行它们、在需要时暂停、处理它们之间的通信以及释放 goroutine。\n\n一个普遍的问题是我们在 Go 中最多可以运行多少个\
  \ goroutine。答案是：视情况而定。回顾一下 第 2 章，Go 的易用性 —— 在幕后，我们有由 Go 调度器管理的线程。`GOMAXPROCS` 配置线程的数量；默认且推荐的值是我们运行程序的机器的核心数。假设上，我们可以运行任意数量的\
  \ goroutine，但我们必须考虑两个因素：内存使用和垃圾回收性能。\n\n**内存使用** —— 每个 goroutine 使用 2KB，这意味着 1GB\
  \ 内存的机器最多可容纳约 250K 个 goroutine。我们需要为运行程序的每台机器计算最大 goroutine 数量。\n\n**GC 性能** ——\
  \ 拥有的 goroutine 越多，垃圾回收会变得越来越慢。\n\n关于最大 goroutine 数量的一个经验法则是介于 1,000 到 10,000 之间。\n\
  \n那么，什么是 goroutine 泄漏？Goroutine 泄漏是指垃圾永远不会被回收，因为它通过 channel 发送或等待接收数据。让我们先讨论 channels，再看看\
  \ goroutine 泄漏的实际案例。\n\n#### Channels - 有缓冲 vs. 无缓冲\n\n描述 channels 最好的方式是将它们比作队列。它们的行为类似于队列\
  \ —— 我们可以向其中发送和接收项目。队列和 channels 的区别在于 channels 旨在促进 goroutine 通信。Channels 是 goroutine\
  \ 之间通信、发送和接收数据的方式。\n\n下面是一个示例，我们在其中创建一个 channel，向该 channel 发送数据，然后在主 goroutine 中从同一个\
  \ channel 接收数据：\n\n```go\nfunc main() {\n    messages := make(chan string)\n\n \
  \   go func() {\n        messages <- \"ping\"\n    }()\n\n    msg := <-messages\n\
  \    println(msg)\n}\n```\n\n我们使用 `chan` 关键字来声明一个 channel。请注意，每个 channel 都有一个类型。在示例中，channel\
  \ 的类型是 `string`，这意味着我们只能向其发送 `string` 类型的项目。使用语法 `<-`，我们将字符串 `ping` 发送到 channel\
  \ 中。我们使用赋值语法 `:=` 和 `<-` 语法从 channel 接收数据。\n\n在前面的示例中，我们使用了一个无缓冲 channel。\n\nGolang\
  \ 中有两种类型的 channels：有缓冲和无缓冲 channels。让我们来研究一下它们的区别。\n\n```go\nfunc main() {\n   \
  \ messages := make(chan string, 2)\n\n    messages <- \"ping\"\n    messages <-\
  \ \"pong\"\n\n    println(<-messages) // ping\n    println(<-messages) // pong\n\
  }\n```\n\n要声明一个有缓冲 channel，我们应该使用以下语法：`make(chan type, int)`。`int` 是 channel 的大小。正如我们所见，channels\
  \ 就像队列。Channel 的大小就是队列的大小，这意味着除非另一端有接收者，否则我们不能向 channel 发送超过其大小的项目。请注意，输出顺序像队列一样，而不是栈顺序（先进先出\
  \ FIFO，而非后进先出 LIFO）。\n\n如果我们尝试向已满的 channel 发送项目，代码将会阻塞。除非有一个接收者 goroutine —— 它将解除发送者\
  \ goroutine 的阻塞。如果所有其他 goroutine 都保持阻塞状态，我们将进入死锁，Go 会通知我们。\n\n```go\nfunc main()\
  \ {\n    messages := make(chan string, 1)\n\n    messages <- \"ping\"\n    messages\
  \ <- \"pong\"\n\n    println(<-messages)\n    println(<-messages)\n}\n```\n\n我们唯一改变的是\
  \ channel 的大小。然而，如果我们尝试运行这段代码，将会得到以下错误：\n\n```\nfatal error: all goroutines are\
  \ asleep - deadlock!\n```\n\n我们得到这个错误是因为我们尝试向已满的 channel 发送项目，而没有 goroutine 运行接收者来解除主代码的阻塞。现在，让我们看一个无缓冲\
  \ channel 的示例。\n\n```go\nfunc main() {\n    messages := make(chan string)\n\n  \
  \  go func() {\n        messages <- \"ping\"\n    }()\n\n    msg := <-messages\n\
  \    println(msg)\n}\n```\n\n声明无缓冲 channel 的方式与有缓冲 channel 完全相同，只是不声明大小。它们的区别在于无缓冲\
  \ channel 的长度为 0。在使用无缓冲 channels 和已满的有缓冲 channels 时，如果没有相应的接收者 (`<- chan`)，我们无法向\
  \ channel 发送项目 (`chan <-`)。\n\n#### 关闭 Channel\n\n当我们创建 channels 时，它们默认是打开的。我们可以使用\
  \ `close(channel)` 语法来关闭 channel。关闭 channel 意味着我们不能再向 channel 发送数据，但仍然可以接收数据。\n\n\
  ```go\nfunc main() {\n    ch := make(chan int)\n    close(ch)\n    ch <- 1 // panic:\
  \ send on closed channel\n}\n```\n\n关闭 channel 的目的是通知接收者发送者已完成工作，不会再发送任何项目。请注意，关闭\
  \ channel 必须仅从发送者一方进行，而不能从接收者一方进行。我们将在后面的章节更详细地讨论关闭 channel 的原则。\n\n#### Range 遍历\
  \ Channel\n\n我们已经见过 `range` 语法的用法。我们可以使用相同的语法来遍历从 channel 接收的值，例如在接收者一方。\n\n```go\n\
  func main() {\n    ch := make(chan int, 3)\n\n    for i := 0; i < 3; i++ {\n   \
  \     ch <- i\n    }\n\n    close(ch) // 如果你不关闭 channel，将会发生死锁！\n\n    for i :=\
  \ range ch {\n        fmt.Printf(\"%d \", i) // 0 1 2\n    }\n}\n```\n\n在示例中，我们向\
  \ channel 发送三个项目，然后通过 `range` 语法遍历接收到的值。\n\n请注意两点：\n\n1.  我们必须关闭 channel；否则，会导致死锁！如果我们不关闭\
  \ channel，`range` `for` 循环将永远卡住。发送者没有通知接收者他们已完成发送项目。\n2.  关闭 channel 可防止数据被发送到 channel。它并不阻止从\
  \ channel 接收数据，就像我们在示例最后三行所做的那样。\n\n#### Select 选择 Channel\n\n我们已经见过 `select` 语法的用法。我们可以使用相同的语法从多个\
  \ channels 接收数据。\n\n```go\nfunc main() {\n    c1 := make(chan int)\n    c2 := make(chan\
  \ int)\n\n    go func() {\n        c1 <- 1\n    }()\n\n    go func() {\n       \
  \ c2 <- 2\n    }()\n\n    go func() {\n        for {\n            select {\n   \
  \         case <-c1:\n                println(\"c1\")\n            case <-c2:\n\
  \                println(\"c2\")\n            }\n        }\n    }()\n\n    time.Sleep(1\
  \ * time.Second)\n}\n```\n\n这两个 goroutine 可以随时通过各自的 channel 发送数据。我们需要另一端有一个单一机制，能够知道从多个\
  \ channels 接收数据。`select` 语法就是该用例的解决方案。我们可以在示例中看到如何利用它。\n\n#### Channels 方向\n\n在将\
  \ channels 用作函数参数时，我们可以指定 channel 的方向。\n\n```go\nfunc main() {\n    ch := make(chan\
  \ int, 1)\n    send(ch)\n    recv(ch)\n}\n\nfunc send(ch chan<- int) {\n    ch <-\
  \ 1\n}\n\nfunc recv(ch <-chan int) {\n    fmt.Println(<-ch) // 1\n}\n```\n\n我们使用语法\
  \ `chan<-` 来指定我们可以接收一个 channel 作为参数，但只能向该 channel 发送数据。\n\n#### Goroutines 之间的同步\n\
  \n\n\n\n\n### 通道最有用的用例之一是同步\n\n我们可以通过通道通知 Goroutine 关于进程的开始和结束，从而在它们之间实现同步。在 Goroutine\
  \ 之间通知工作“`done`”的一种普遍模式是使用大小为 1 的布尔通道。\n\n```go\nfunc main() {\n\tdone := make(chan\
  \ bool, 1)\n\tgo func() {\n\t\tprintln(\"Start goroutine\")\n\t\ttime.Sleep(1 *\
  \ time.Second) // simulate work\n\t\tprintln(\"End goroutine\")\n\t\tdone <- true\n\
  \t}()\n\tprintln(\"Waiting goroutine\")\n\t<-done\n\tprintln(\"All done\")\n}\n\
  ```\n\n### 发挥通道优势\n\n正如我们所见，通道的用法是 Goroutine 之间的通信。发挥通道优势有几个用例：\n\n*   Goroutine\
  \ 之间的同步\n*   发送和接收通知\n*   使用 `select` 从多个 Goroutine 接收数据\n*   Futures 和 promises\
  \ `->` 模拟 `async/await` 过程\n*   作为队列\n*   超时处理\n*   处理致命错误\n*   定时器\n*   Fan In\
  \ Fan Out 模式\n\n这些只是用例的几个主要示例。还有许多其他用例和示例。\n\n#### 何时应使用带缓冲通道，何时应使用无缓冲通道？\n\n默认情况下，我们应该选择无缓冲通道。当接收方落后于发送方，或者在数据检索前需要同步时，带缓冲通道就变得必要了。这些是使用带缓冲通道而非无缓冲通道的主要原因。此外，特定的程序需求也可能决定使用带缓冲/无缓冲通道。\n\
  \n### `Sync` 包\n\n`sync` 包是 Go 语言的核心包之一。该包提供了基本的同步原语。包中的大多数类型提供了底层例程。高层例程应通过通道来执行。\n\
  \n### WaitGroups\n\n`WaitGroup` 是 `sync` 包中的一种类型。`WaitGroup` 提供了一种等待多个 Goroutine\
  \ 完成工作的方法。它是一个功能极其强大且用途广泛的工具。\n\n```go\nfunc main() {\n\twg := sync.WaitGroup{}\n\
  \twg.Add(5)\n\tfor i := 0; i < 5; i++ {\n\t\tgo func(i int) {\n\t\t\tdefer wg.Done()\n\
  \t\t\ttime.Sleep(1 * time.Second)\n\t\t\tprintln(i)\n\t\t}(i)\n\t}\n\tfmt.Println(\"\
  Waiting…\")\n\twg.Wait()\n\tfmt.Println(\"Done\")\n}\n```\n\n输出将如下所示（数字的顺序可能会变化）：\n\
  \n```\nWaiting…\n2\n0\n1\n3\n4\nDone\n```\n\n`WaitGroup` 类型作为一个计数器工作。在幕后，`WaitGroup`\
  \ 类型持有一个 `int` 类型的计数器，初始值为 0。如果计数器值变为 0，则所有阻塞在 `Wait()` 上的 Goroutine 都会被释放。我们使用\
  \ `Add(delta int)` 函数来增加计数器的大小。要减少计数器的值，我们使用 `Done()` 函数——它从计数器中减去 1。这些是 `WaitGroup`\
  \ 类型的所有方法——`Add`、`Done`、`Wait`。\n\n请注意，`Add` 函数中的负值会导致 panic。此外，如果我们在函数之间传递 `WaitGroup`\
  \ 实例，应该通过指针传递。\n\n这种技术最大的缺点是没有常规的方式来处理错误。有一个单独的包叫 `errgroup`，它可以帮助我们实现这一点。\n\n###\
  \ 锁\n\n为了在多个 Goroutine 之间访问相同的数据，我们需要在一个 Goroutine 访问数据时保护数据不被另一个 Goroutine 访问。这种情况可能导致数据错误，甚至更糟——致命错误。\n\
  \n```go\nfunc main() {\n\tcounter := 0\n\twg := sync.WaitGroup{}\n\twg.Add(10000)\n\
  \tfor i := 0; i < 10000; i++ {\n\t\tgo func() {\n\t\t\tdefer wg.Done()\n\t\t\tcounter++\n\
  \t\t}()\n\t}\n\twg.Wait()\n\tfmt.Println(\"counter:\", counter)\n}\n```\n\n在前面的示例中，计数器的输出应该是\
  \ 10,000。不幸的是，计数器的值远低于它。原因是多个 Goroutine 试图访问 `counter` 变量；一些失败是因为其他 Goroutine 锁定了计数器值并写入它。如果我们用\
  \ map 替换计数器并尝试写入同一个键，我们将得到一个更糟的场景——`fatal error: concurrent map writes`。为了避免这种情况，我们需要使用\
  \ `mutex`。`Mutex` 是 `sync` 包的一种类型，帮助我们加锁和解锁。\n\n```go\nfunc main() {\n\tcounter\
  \ := 0\n\twg := sync.WaitGroup{}\n\tmu := sync.Mutex{}\n\twg.Add(10000)\n\tfor i\
  \ := 0; i < 10000; i++ {\n\t\tgo func() {\n\t\t\tdefer wg.Done()\n\t\t\tmu.Lock()\n\
  \t\t\tcounter++\n\t\t\tmu.Unlock()\n\t\t}()\n\t}\n\twg.Wait()\n\tfmt.Println(\"\
  counter:\", counter)\n}\n```\n\n现在输出将是 - `counter: 10000`，符合预期。`mutex` 类型让我们能够加锁。对于任何其他想要\
  \ `Lock()` 互斥锁 (`mu`) 的 Goroutine，我们必须等待直到另一个 Goroutine `Unlock()` 互斥锁 (`mu`)。\n\
  \n### Go 语言中的单例模式 - `Once.Do`\n\n总结单例的概念——它是确保特定类型仅创建单个实例的最知名设计模式之一。在许多其他编程语言中，存在各种模式来实现这一点，同时保持线程安全。在\
  \ Go 中，利用 `sync` 包中的 `Once` 类型，实现此模式非常容易。\n\n```go\ntype cache struct{}\n\nvar cacheSingleton\
  \ *cache\nvar once sync.Once\n\nfunc main() {\n\tGetCache()\n\tGetCache()\n\tGetCache()\n\
  }\n\nfunc GetCache() *cache {\n\tonce.Do(func() {\n\t\tprintln(\"Creating singleton\
  \ object\")\n\t\tcacheSingleton = &cache{}\n\t})\n\treturn cacheSingleton\n}\n```\n\
  \n该程序的输出是 - `Creating singleton object`。仅此而已（不是三次）。\n\n`Do` 函数接收一个函数作为参数。`Do` 函数确保内部函数**恰好执行一次**，这正是我们在编写单例时想要实现的。`Do`\
  \ 也是 `Once` 类型上唯一存在的函数。\n\n### 底层例程\n\n`sync` 包中还有其他我们可以使用的底层例程，本章不再详述：\n\n1.  `sync.Map`：与\
  \ Go 中的普通 map 目的相同，但可安全地跨多个 Goroutine 并发访问。\n2.  `sync/atomic`：管理跨多个 Goroutine 的共享计数器状态。\n\
  3.  `sync.Pool`：自管理的临时对象池——这是为了辅助垃圾回收器的工作。\n\n### 发布/订阅\n\n发布-订阅是最知名的模式之一。Pub/Sub\
  \ 模式是一种消息传递模式，帮助我们在系统/服务/对象之间进行通信。它通过所谓的主题从发布者广播数据/消息。每个订阅者被分配到一个特定主题，并且每个订阅者都会接收到与其分配主题相关的所有消息。\n\
  \n![Figure 5.4: Publish-Subscribe pattern](img/Figure-5.4.jpg)\n\n```go\ntype PubSub\
  \ struct {\n\tsubscribers map[string][]chan interface{}\n}\n\nfunc NewPubSub() *PubSub\
  \ {\n\treturn &PubSub{\n\t\tsubscribers: make(map[string][]chan interface{}),\n\t\
  }\n}\n\nfunc (ps *PubSub) Publish(topic string, item interface{}) {\n\tfor _, ch\
  \ := range ps.subscribers[topic] {\n\t\tch <- item\n\t}\n}\n\nfunc (ps *PubSub)\
  \ Subscribe(topic string) <-chan interface{} {\n\tch := make(chan interface{})\n\
  \tps.subscribers[topic] = append(ps.subscribers[topic], ch)\n\treturn ch\n}\n\n\
  func main() {\n\tps := NewPubSub()\n\tch := ps.Subscribe(\"t1\")\n\tgo ps.Publish(\"\
  t1\", \"hello\")\n\titem := <-ch\n\tprintln(item.(string))\n}\n```\n\n这是 Go 语言中发布-订阅模式的一个简单实现。请注意，这个示例并不完美——我们没有关闭通道，也没有正确处理并发。实现此模式时，建议使用现有的库。\n\
  \n\n\n\n\n### 微服务架构中的发布/订阅模式\n\n发布/订阅是微服务架构中的一种模式。在构建微服务架构时，每个服务独立工作并相互解耦，这正是发布/订阅模式所要实现的目标。它允许在不更改发布者代码的情况下独立编写每个订阅者以获取其数据。订阅者只需将自己分配给一个现有的主题即可。微服务架构的诸多优势在此模式中得以体现。一个主要例子是使用发布/订阅时，服务的可扩展性变得无缝衔接。\n\
  \n更高级的发布/订阅用法允许更多功能，如计划进程、延迟、工作流等。以下是一些使用发布/订阅的实际案例：\n\n*   事件数据广播\n*   实时通知\n*\
  \   分布式缓存\n*   实时位置追踪\n\n请注意，要在微服务架构中实现服务间的发布/订阅，我们需要使用第三方服务来管理主题、发布者和订阅者。常见的发布/订阅技术可在所有最大的云厂商服务或开源项目（如\
  \ `Redis`）中找到。\n\n许多人倾向于将发布/订阅与消息代理混淆。让我们简要了解一下它们的区别。\n\n| **PubSub** | **消息代理**\
  \ |\n| --- | --- |\n| 类似广播 - 单条消息复制给多个订阅者 | 单播 - 单条消息发给单个消费者 |\n| 发布者和订阅者 | 发布者和消费者\
  \ |\n| 适合广播 | 适合任务委派 |\n| 更容易丢失消息 | 更健壮，可靠性更好 |\n| 无 FIFO 能力 | 具备 FIFO 能力 - 保持顺序\
  \ |\n\n**表 5.1：** PubSub 与消息代理的对比\n\n我们将在 *第 7 章，构建 RESTful API* 中更详细地讨论消息代理。\n\n\
  ### 通道关闭原则\n\n我们之前简要提到了通道关闭原则。然而，它非常重要，值得我们再次讨论。简单的原则是：如果是单个发送者，我们必须从发送者的 goroutine\
  \ 关闭通道。我们不应该从接收者一侧关闭通道，也不应在有多个发送者时从发送者一侧关闭通道。\n\n虽然原则如此，但也存在需要从多个发送者关闭通道的场景。在这种情况下，如果我们有多个发送者并需要关闭通道，必须执行优雅关闭。\n\
  \n```go\nfunc main() {\n    ch := make(chan int)\n    wg := &sync.WaitGroup{}\n\
  \    wg.Add(10)\n    for i := 0; i < 10; i++ {\n        go Sender(ch, wg, i)\n \
  \   }\n    go func() {\n        wg.Wait()\n        close(ch) // 优雅关闭\n    }()\n\
  \    // 接收者\n    for i := range ch {\n        println(i)\n    }\n}\n\nfunc Sender(ch\
  \ chan<- int, wg *sync.WaitGroup, i int) {\n    defer wg.Done()\n    ch <- i\n}\n\
  ```\n\n在前面的示例中，我们可以观察到使用多个发送者 goroutine 实现优雅通道关闭的情况。\n\n### 避免 Goroutine 泄漏\n\n\
  到目前为止，我们已经体验了 goroutine 所提供的所有优势。不幸的是，goroutine 也有缺点 —— goroutine 泄漏！\n\n当发送者 goroutine\
  \ 阻塞等待接收者到达通道，反之亦然时，就会发生 goroutine `泄漏`。同时，被阻塞的 goroutine 永远无法被解除阻塞。\n\n```go\n\
  func leak(ch chan int) {\n    data := <-ch\n    fmt.Println(data)\n}\n\nfunc main()\
  \ {\n    ch := make(chan int)\n    go leak(ch)\n}\n```\n\n让我们看看前面的示例；为什么这是泄漏？这是因为我们没有接收者！`leak`\
  \ 函数将永远卡住。\n\n导致 goroutine 泄漏的两种常见情况：\n\n*   被遗忘的发送者\n*   被遗弃的接收者\n\n#### 被遗忘的发送者\n\
  \n这是一种发送者 goroutine 被“`遗忘`”并试图通过通道发送数据的场景。然而，另一侧没有接收者。\n\n```go\nfunc forgottenSender(ch\
  \ chan int) {\n    data := 3\n    // 因为没有人接收数据，这里会阻塞\n    ch <- data\n}\n\nfunc\
  \ main() {\n    ch := make(chan int)\n    go forgottenSender(ch)\n    println(runtime.NumGoroutine())\
  \ // 2 而不是 1\n}\n```\n\n`forgottenSender` 函数将在一个 goroutine 中永远运行下去。在该示例中，我们必须使用带缓冲通道来避免\
  \ goroutine 泄漏，这样 `forgottenSender` 才能完成其工作。\n\n```go\nfunc forgottenSender(ch chan\
  \ int) {\n    data := 3\n    // 因为没有人接收数据，这里会阻塞\n    ch <- data\n}\n\nfunc main()\
  \ {\n    ch := make(chan int, 1) // 通过使用带缓冲通道避免 goroutine 泄漏\n    go forgottenSender(ch)\n\
  }\n```\n\nGoroutine 泄漏并不总是显而易见的。我们可以看到许多错误处理导致无意 goroutine 泄漏的场景。\n\n```go\nfunc\
  \ networkCall() int {\n    return 1\n}\n\nfunc anotherAction() error {\n    return\
  \ errors.New(\"data is invalid! Returning\")\n}\n\nfunc forgottenSender(ch chan\
  \ int) {\n    data := networkCall()\n    ch <- data\n}\n\nfunc handler() error {\n\
  \    ch := make(chan int)\n    go forgottenSender(ch)\n    err := anotherAction()\n\
  \    if err != nil {\n        return err\n    }\n    data := <-ch\n    fmt.Println(data)\n\
  \    return nil\n}\n```\n\n如果我们去掉调用 `anotherAction` 函数的部分，一切都会正常。不幸的是，假设该代码块是必要的。我们遇到了\
  \ goroutine 泄漏，因为 `forgottenSender` 函数在后台持续运行，而 `handler` 函数返回了错误，且该函数已完成工作。要解决这种情况，我们必须在调用\
  \ `anotherAction` 函数之前在 goroutine 中运行接收者，或者使用带缓冲通道。\n\n类似于错误处理用例，当我们对多个通道使用 select\
  \ case 时，也可能发生这种情况。\n\n```go\nfunc networkCall() int {\n    time.Sleep(3 * time.Second)\n\
  \    return 1\n}\n\nfunc forgottenSender(ch chan int) {\n    data := networkCall()\n\
  \    ch <- data\n}\n\nfunc handler() error {\n    ctx, cancel := context.WithTimeout(context.Background(),\
  \ 10*time.Millisecond)\n    defer cancel()\n    ch := make(chan int)\n    go forgottenSender(ch)\n\
  \    for {\n        select {\n        case data := <-ch:\n            fmt.Printf(\"\
  received data! %d\\n\", data)\n            return nil\n        case <-ctx.Done():\n\
  \            return errors.New(\"timeout! Process canceled. Returning\")\n     \
  \   }\n    }\n}\n```\n\n我们面临同样的问题：`handler` 函数在网络调用完成前就结束了工作（10 毫秒的超时低于 3 秒）。`forgottenSender`\
  \ 函数卡住了，另一侧没有接收者，从而导致 goroutine 泄漏。我们可以通过使用带缓冲通道来解决这个 goroutine 泄漏。\n\n当我们使用带缓冲通道时，它会解除\
  \ goroutine 的阻塞，随后 GC 会注意到没有人在使用通道 `ch` 并将其从内存中清理。\n\n#### 被遗弃的接收者\n\n这是一种发送者发送了数据，但发送者从未通知接收者停止接收数据的场景。\n\
  \n```go\nfunc abandonedReceiver(ch chan string) {\n    for data := range ch {\n\
  \        println(data)\n    }\n    println(\"Worker is done\")\n}\n\nfunc sender(ch\
  \ chan string) {\n    for _, data := range []string{\"one\", \"two\", \"three\"\
  } {\n        ch <- data\n    }\n}\n\nfunc handler() {\n    ch := make(chan string,\
  \ 3)\n    sender(ch)\n    go abandonedReceiver(ch)\n}\n\nfunc main() {\n    handler()\n\
  \    time.Sleep(1 * time.Second)\n    println(runtime.NumGoroutine()) // 2 而不是 1\n\
  }\n```\n\n正如我们所见，`abandonedReceiver` 函数将永远运行下去。当前程序的输出如下所示：\n\n```\none\ntwo\nthree\n\
  ```\n\n`\"Worker is done\"` 这一行永远不会被打印，因为 `abandonedReceiver` 在 range 循环上被阻塞 ——\
  \ 这导致了 goroutine 泄漏。要解决它，我们需要在发送者完成工作后关闭通道，正如我们在关闭通道一节中所见。\n\n```go\nfunc sender(ch\
  \ chan string) {\n    for _, data := range []string{\"one\", \"two\", \"three\"\
  } {\n        ch <- data\n    }\n    close(ch) // 解决 goroutine 泄漏\n}\n```\n\n####\
  \ 检测 Goroutine 泄漏\n\n\n\n\n让我们强调这样一个事实：Goroutine 泄漏表现为内存泄漏。后台运行的 goroutine 持有变量，导致这些变量无法从内存中释放。检测\
  \ goroutine 泄漏主要有两种方法：\n\n*   **性能分析**：我们将在 *第 10 章，生产环境的下一步* 中更详细地讨论性能分析。通常，在进行性能分析和代码分析时，我们可以使用\
  \ Go 的 `pprof` 或 `gops` 来检查是否有未终止的 goroutine。\n\n*   **测试**：最好但也最费力的方法是编写能够揭示 goroutine\
  \ 泄漏的单元测试。我们的目标是覆盖所有可能发生 goroutine 泄漏的场景。测试本质上会在测试结束时检查后台是否仍有 goroutine 在运行。Go 允许我们使用\
  \ `runtime.NumGoroutine()` 查看后台运行了多少个 goroutine。我们也可以使用外部包，如 `uber-go/goleak`。\n\
  \n### Fan In Fan Out 模式\n\nFan In Fan Out 是一种流行的模式，它帮助我们将多个来源转换为单个流（fan-in），或将来自单个来源的输入流式传输到多个管道中（fan-out）。在\
  \ Go 中，如果我们需要多个函数从同一个通道读取数据直到该通道关闭 —— 即 fan-out。一个函数可以从多个输入（来源）读取数据，直到所有输入通道都关闭\
  \ —— 即 fan-in。\n\n#### Fan Out\n\n当我们想要将工作分配给一组工作协程，以通过并行利用 CPU 和 I/O 等资源来进行优化时，应使用\
  \ fan-out 模式。\n\n```\nfunc generator(numbers []int) <-chan int {\n    out := make(chan\
  \ int)\n    go func() {\n        for _, num := range numbers {\n            out\
  \ <- num\n        }\n        close(out)\n    }()\n    return out\n}\n\nfunc businessLogic(num\
  \ int) int {\n    return num * 2\n}\n\nfunc main() {\n    data := []int{1, 2, 3,\
  \ 4, 5, 6}\n    var wg sync.WaitGroup\n    ch1 := generator(data[0:3])\n    ch2\
  \ := generator(data[3:])\n    wg.Add(2)\n    go func() {\n        for num := range\
  \ ch1 {\n            println(businessLogic(num))\n        }\n        wg.Done()\n\
  \    }()\n    go func() {\n        for num := range ch2 {\n            println(businessLogic(num))\n\
  \        }\n        wg.Done()\n    }()\n    wg.Wait()\n}\n```\n\n在前面的示例中，我们有一个 `data`\
  \ 变量（来源），但我们想要并行化该数据的处理过程。我们决定将工作分配给两个工作协程。我们做的第一件事是将数据分成两份。然后，我们调用了 `generator`\
  \ 函数。`generator` 函数的目的是接收输入，将所有输入发送到一个名为 `out` 的通道中，然后返回该通道。在两次调用 `generator` 函数后，我们使用了\
  \ `WaitGroup` 来等待所有工作协程完成工作。最后，我们启动了两个 goroutine（工作协程）。每个工作协程执行一些业务逻辑，然后结束。\n\n\
  #### Fan In\n\n我们应该使用 fan-in 模式将多个输入（来源）处理汇总到单个函数中。我们将通过将多个通道合并为一个来实现这一点。将多个通道合并为单个通道的过程称为多路复用。只有当所有输入通道都关闭时，单个输出通道才会关闭。我们将通过一个名为\
  \ `merge` 的函数来研究多路复用过程。\n\n```\nfunc merge(sourcesCh …<-chan int) <-chan int {\n\
  \    var wg sync.WaitGroup\n    wg.Add(len(sourcesCh))\n    out := make(chan int)\n\
  \    outputFunc := func(sourceCh <-chan int) {\n        for num := range sourceCh\
  \ {\n            out <- num\n        }\n        wg.Done()\n    }\n    for _, sourceCh\
  \ := range sourcesCh {\n        go outputFunc(sourceCh)\n    }\n    go func() {\n\
  \        wg.Wait()\n        close(out)\n    }()\n    return out\n}\n\nfunc generator(numbers\
  \ []int) <-chan int {\n    out := make(chan int)\n    go func() {\n        for _,\
  \ num := range numbers {\n            out <- num\n        }\n        close(out)\n\
  \    }()\n    return out\n}\n\nfunc main() {\n    data := []int{1, 2, 3, 4, 5, 6}\n\
  \    ch1 := generator(data[0:3])\n    ch2 := generator(data[3:])\n    ch := merge(ch1,\
  \ ch2)\n    for num := range ch {\n        println(num)\n    }\n}\n```\n\n`generator`\
  \ 函数与我们在 fan-out 模式示例中看到的相同。我们首先在 `merge` 函数中声明单个输出通道 `out`。其次，我们创建一个 `WaitGroup`\
  \ 来确定何时所有源通道都已关闭。在它们关闭后，我们将使用 `Wait()` 并关闭输出（`out`）通道。然后，我们创建了一个函数（`outputFunc`），它接收源通道并将该源通道的所有数据发送到输出通道（`out`）。最后，我们遍历所有源通道并启动\
  \ goroutine 执行 `outputFunc`。\n\n现在我们在 `main` 函数中拥有了一个单一的通道，可以安全地迭代，直到 `merge` 函数关闭该通道。\n\
  \n### 总结\n\n在本章中，我们详细讨论了 Go 中的并发。这是 Go 中最重要的主题之一，深入理解它对于编写代码至关重要。在前两章中，我们讨论了 Go\
  \ 基础主题，以深入了解 Go 的工作原理，这对于使用 Go 构建微服务架构是必不可少的。通过这些章节，我们一窥了如何利用 Go 知识构建微服务架构。\n\n\
  在下一章中，我们将介绍构建微服务架构的基本要素。\n\n### 参考资料\n\n*   [`stackoverflow.com/questions/4844637/what-is-the-difference-between-concurrency-parallelism-and-asynchronous-methods#:~:text=Concurrency%20is%20when%20the%20execution,though%20related%20in%20some%20contexts`](https://stackoverflow.com/questions/4844637/what-is-the-difference-between-concurrency-parallelism-and-asynchronous-methods#:~:text=Concurrency%20is%20when%20the%20execution,though%20related%20in%20some%20contexts)\n\
  *   [`pkg.go.dev/sync`](https://pkg.go.dev/sync)\n*   [`pkg.go.dev/golang.org/x/sync/errgroup`](https://pkg.go.dev/golang.org/x/sync/errgroup)\n\
  *   [`www.uber.com/en-JO/blog/leakprof-featherlight-in-production-goroutine-leak-detection/#:~:text=A%20possible%20solution%20to%20prevent,a%20buffer%20size%20of%201`](https://www.uber.com/en-JO/blog/leakprof-featherlight-in-production-goroutine-leak-detection/#:~:text=A%20possible%20solution%20to%20prevent,a%20buffer%20size%20of%201)\n\
  *   [`github.com/uber-go/goleak`](https://github.com/uber-go/goleak)\n\n## 第 6 章\n\
  \n### 微服务的核心要素\n\n### 简介\n\n在涵盖了与 Go 编程语言相关的所有基础知识后，我们将把它与微服务架构的核心要素相结合。你可能会问自己，什么是这些“**核心要素**”；微服务架构是一种**方法**，而非终点。因此，核心要素是技术行业的方法论、设计模式和技术。所有这些要素共同构成了一个完整的系统。没有一个配方能告诉我们如何构建出一个架构。存在许多约束、产品需求（可能会牵引出工程需求）和假设\
  \ —— 每个系统都有其独特的结构。然而，所有这些系统都有共同的要素。本章介绍这些要素，何时它们会变得有益，它们的优缺点，以及何时使用/避免它们。我们不会深入探讨每一个要素；相反，目标是提供一个框架，概述每个要素的边界。\n\
  \n我们不会涵盖微服务的所有现有要素。相反，我们将介绍主要的要素。以下是本章**不**涵盖的要素：\n\n*   **Saga 模式**：允许我们通过将分布式事务分解为更小、隔离的步骤来管理微服务架构中的分布式事务，每个步骤都有其补偿事务来处理潜在故障。\n\
  *   **Aggregator 模式**：从多个服务中聚合数据，以简化其他希望拉取该数据的服务的数据获取。\n*   **Decomposition 模式**：帮助我们将单体应用拆解为微服务。\n\
  \n\n\n\n#### 结构\n\n在本章中，我们将讨论以下主题：\n\n*   服务间通信\n    *   API 调用\n    *   消息代理\n\
  \    *   gRPC\n*   API 网关\n*   服务发现\n*   负载均衡器\n*   每服务一个数据库\n*   面向前端的后端 (BFF)\n\
  *   外部配置\n*   服务网格\n*   事件驱动架构\n    *   事件溯源\n    *   CQRS\n\n### 服务间通信\n\n正如我们在*第\
  \ 1 章，微服务简介*中所见，微服务架构由小型、独立且解耦的服务组成。每个服务旨在实现**单一**目的。然而，系统需要利用所有服务来达成更大的目标。为追求这些目标，服务需要一种通信手段，通过发送和接收来交换数据。这种通信形式因其复杂性而呈现多种面貌。\n\
  \n需要考虑的方面很多——消息类型、消息大小、响应方式、延迟、故障、文档、消息打包等。以下是在微服务架构中通信的主要形式：\n\n*   API 调用\n* \
  \  消息代理\n*   gRPC\n\n我们不会深入探讨这些形式，因为每一个都很庞大，需要透彻的理解。要正确、精确地使用它们，我们必须知道如何正确构建它们。我们还必须熟悉它们的优缺点，以便在选择时做出最佳决策。此外，还有其他几个因素、约束和假设增加了局势的复杂性。\n\
  \n### API 调用\n\nAPI 代表应用程序编程接口。API 调用由发送调用的服务发起的请求和接收请求的服务返回的响应组成。每个请求包含参数，指明请求的是哪些数据。我们通过网络的第\
  \ 7 层（应用层）发送 API 请求。\n\nAPI 调用是微服务架构中服务间最常用的通信方式。多样的 API 风格（如 REST、SOAP 和 GraphQL）值得深入讨论。其中，REST\
  \ 是采用最广泛的。因此，下一章（*第 7 章，构建 RESTful API*）将探讨 RESTful API。\n\n![](img/Figure-6.1.jpg)\n\
  \n**图 6.1：** API 调用\n\n### 消息代理\n\n我们在上一章提到了消息代理，并将其与发布/订阅设计模式进行了比较。对消息代理的一个贴切描述是：将其定义为一项服务与另一项服务之间消息的中介。服务不直接向另一服务发送请求，而是将消息发送给代理。消息主要包含数据、配置，有时还包含指令。消息代理是一个独立的服务，通常由许多服务组成，并作为一个独立的集群运行。代理的目标是接收消息，并通知其他服务有关此消息，或将其存储直到另一服务拉取它。消息代理还有许多额外功能，如重试、存储\
  \ DLQ（即死信队列）、监控、临时存储、加密、控制消息中介的速度等。\n\n![](img/Figure-6.2.jpg)\n\n**图 6.2：** 消息代理\n\
  \n必须强调的是，从头构建消息代理非常艰巨，且不推荐这样做。市场上有各种优秀且经过充分测试的技术。以下是主要技术：\n\n*   Apache Kafka\n\
  *   RabbitMQ\n*   Amazon MQ\n\n### gRPC\n\ngRPC 是一个现代的、开源的 Google 远程过程调用（RPC）**框架**。gRPC\
  \ 允许使用 Protocol Buffers 定义与语言无关的 API。Protocol Buffers（protobuf）是一种与语言无关的序列化格式，可高效地构建和序列化数据。我们可以使用\
  \ Protocol Buffers 在各种编程语言中快速创建客户端和服务端实现。gRPC 框架利用 HTTP/2 作为底层协议，支持双向流式传输和实时通信等多种能力。在幕后，它本质上只是一个\
  \ API 调用，但它利用了 HTTP/2 的能力，这使其非常强大。虽然简单的 API 很直观，但 gRPC 学习曲线平缓。此外，gRPC 框架并不支持所有编程语言。\n\
  \n### API 网关\n\n在微服务架构中，服务间通信有多种方式。标准方式是通过简单的 API，正如我们所见。\n\nAPI 网关是一项充当微服务架构入口（网关）的服务。API\
  \ 网关接受来自所有客户端的请求，然后将客户端请求导向目标服务，并将响应返回给客户端。拥有单一的系统入口点，使我们能完全**控制**进出的内容。我们可以使用 API\
  \ 网关实现几类功能：\n\n*   **安全性**：每个服务可以使用身份验证、授权和加密功能。每个服务不必强制执行这些安全要求。相反，大多数事情可以在 API\
  \ 网关中完成。有时，由于业务逻辑约束，无法执行任何操作。\n*   **可观测性**：每个服务可以使用指标、日志和追踪等功能。我们可以从 API 网关开始追踪所有请求。\n\
  *   **路由**：限流、缓存、故障处理、负载均衡、滚动更新功能等。所有这些逻辑都可以在 API 网关内部实现。\n\n![](img/Figure-6.3.jpg)\n\
  \n**图 6.3：** API 网关，客户端向服务发送请求\n\n在上图中，我们可以看到不同的客户端向 API 网关发送请求。API 网关根据请求的路径和域名知道如何将每个请求导向目标服务。此示例演示了我们提到的\
  \ API 网关路由功能等。\n\n构建架构时要记住的最重要一点是优先考虑**简洁性**。API 网关模式之所以有益且强大，是因为它帮助我们实现更简单的架构。它集中处理了许多关注点——安全性、可观测性、负载均衡、限流等。当问题发生时，我们会知道去哪里调查事故。\n\
  \n请注意，每个 API 网关各不相同。每个架构有不同的需求，导致不同的 API 网关方案。*第 8 章，Kubernetes 简介*将讨论 Kubernetes\
  \ 如何使用名为 ingress 的资源独立实现某些 API 网关模式功能。\n\n### 服务发现\n\n\n\n\n### 微服务架构中的服务发现与负载均衡\n\
  \n在微服务架构中，正如我们所说，服务之间的通信方式是通过 API。每当一个服务需要发送 API 请求时，它必须确定目标服务的网络位置（IP 地址和端口）。由于系统需求（每台服务器能并发处理的请求数有限），每个服务可能有多个实例。每个服务实例都有不同的网络位置（IP\
  \ 地址和端口）。在动态云环境中，由于更新、扩缩容、故障等原因，每个服务实例的网络位置是临时且频繁变化的。我们需要帮助来识别现有的服务实例及其对应的网络位置。\n\
  \n解决此问题的方案是**服务发现**。服务发现模式让服务知道被请求服务实例的网络位置。当请求服务得知服务网络位置后，即可开始与目标服务通信。实现服务发现主要有两种模式：\n\
  \n*   客户端发现\n*   服务端发现\n\n#### 客户端发现\n\n客户端使用此模式确定被请求服务实例的网络位置。请求服务向一个已知的存储发送请求，该存储保存着每个服务的网络位置。所谓的\
  \ `service registry`（服务注册表）即拥有所有服务实例网络位置的存储。\n\n![图 6.4：通过客户端发现进行服务发现](img/Figure-6.4.jpg)\n\
  \n**图 6.4：** 通过客户端发现进行服务发现\n\n`Requesting Service Instance`（请求服务实例）通过 HTTP 请求向服务注册表询问\
  \ `ServiceA` 实例的网络位置。服务注册表拥有 `ServiceA` 实例的网络位置。服务实例负责将其网络位置发送给服务注册表。`Requesting\
  \ Service Instance` 获取网络位置后，即可请求其想要的每个 `ServiceA` 实例。在上图中，我们请求地址为 `1.2.3.4:5555`\
  \ 的实例。\n\n该模式的主要缺点是我们必须在客户端实现复杂的负载均衡和发现逻辑，这意味着必须为每种编程语言复制一套逻辑。\n\n#### 服务端发现\n\n\
  服务端发现模式是两者中更流行的一种。在此模式中，所有“问题”都转移给负载均衡器，它充当“服务端”的角色。客户端向负载均衡器发送请求，负载均衡器的行为类似于客户端发现模式中的客户端。\n\
  \n![图 6.5：通过服务端发现进行服务发现](img/Figure-6.5.jpg)\n\n**图 6.5：** 通过服务端发现进行服务发现\n\n所有关于负载均衡的功能都在\
  \ `Load Balancer`（负载均衡器）中，而非客户端。该模式将发现逻辑从 `Requesting Service Instance`（请求服务实例）分离到\
  \ `Load Balancer`（负载均衡器），这是该模式的主要优势。\n\n`NGINX`、`AWS ALB` 和 `AWS ELB` 是常见的可充当服务端的负载均衡器。在*第\
  \ 8 章 Kubernetes 简介*中，我们将讨论 Kubernetes，它使用服务端方法实现了服务发现模式。\n\n#### 服务注册表\n\n在讨论客户端和服务端方法时，我们已经提到了服务注册表组件。服务注册表是一个包含所有服务实例网络位置的数据库。它暴露服务实例注册/注销其网络位置的能力，并将网络位置注册的工作委托给服务实例。\n\
  \n此外，服务注册表要求它们发送心跳以确定实例是否仍然存活并能接受流量。正如我们所见，Kubernetes 中没有显式的服务注册表；相反，Kubernetes\
  \ 利用现有的存储 `etcd`。Kubernetes 拥有将实例网络位置注册到 `etcd` 的内部逻辑。`etcd` 除用于此目的外，还被 Kubernetes\
  \ 用于许多其他用途。总体而言，`etcd` 是一个高可用、分布式、一致的键值存储。\n\n#### 负载均衡器\n\n负载均衡器是任何软件架构中的关键组件。一方面，我们有各种希望从我们的系统请求服务的客户端。另一方面，我们动态变化的环境构成了我们的服务。由于版本更新、故障、负载等多种原因，我们的环境可能高度动态。在这两者之间矗立着负载均衡器，它像交通警察一样路由流量。\n\
  \n负载均衡器负责在现有服务器之间有效地调度和分发网络流量。它应该知道当前哪些服务可用，哪些不可用。了解服务的可用性可以将新请求导向正常服务，并将现有请求从故障服务重定向到运行正常的服务。它确保了所有服务的可用性和可靠性。\n\
  \n如前所述，服务发现服务器可以充当负载均衡器，API 网关可以作为服务发现。因此，API 网关可以是一个负载均衡器。谈到负载均衡器，主要意图是将请求分发给可用服务的能力。请求分发可能非常复杂，我们稍后将给出不同用例和算法的示例。\n\
  \n负载均衡器有多种类型。本书此部分主要描述 L7 负载均衡器。划分负载均衡器不同组别的一种流行方式是按 L4 和 L7 分类。L4 负载均衡器工作在传输层，关注\
  \ IP 地址和端口等网络层，而 L7 负载均衡器专注于应用层。如今，无需自行编写负载均衡器。存在各种负载均衡器，如 `NGINX`、`HAProxy`、`AWS\
  \ ELB` 和 `AWS ALB`。\n\n这个广阔的主题足以填满整本书。重要的是要强调负载均衡器是**必要**的，幸运的是，通常易于操作。除非我们想编写负载均衡器或为现有项目做贡献，否则我们应专注于了解如何部署、排查故障和使用它。用法和配置因负载均衡器而异，通常可以找到在线指南引导我们完成部署。\n\
  \n接下来要理解的是负载均衡器所遵循的算法。我们可以根据特定需求配置负载均衡器。每种负载均衡器技术都有多种算法。最终，选择合适的负载均衡器算法对于满足系统需求至关重要。以下是一些广泛使用的负载均衡算法：\n\
  \n*   **轮询：** 请求在循环中依次分发，一个接一个。轮询是最常见且最简单的算法。\n*   **最少连接：** 连接数最少的服务器获得下一个请求。\n\
  *   **最短时间：** 一个计算连接数和响应时间组合的公式；响应更快且连接数较少的服务器获得下一个请求。\n*   **哈希：** 用于分发请求的键定义。键定义可以是\
  \ URL 路径、编码类型、端口、IP 地址等。\n*   **两次随机选择：** 使用算法（最少连接、最短时间或其他）选择两台服务器，然后随机选择其中一台。\n\
  \n每种算法都有利弊。选择负载均衡器算法时，我们应调研并寻找最适合我们系统的算法。其他配置也能造福我们的系统。\n\n### 每服务一个数据库\n\n\n\n\n\
  # 每个服务一个数据库\n\n每个服务一个数据库是微服务架构中的典型模式。每个拥有多个服务的系统都可能需要一个持久化数据存储系统。建立稳健的数据分离对于促进微服务架构中服务间的松耦合至关重要。请记住，不同的服务有不同的数据存储需求。关系型数据库将是一个很好的选择；有时，NoSQL\
  \ 和其他类型则是最佳选择。但这不是这里的重点。\n\n数据分离可以发生在数据库内部——即所谓的共享数据库模式。然而，在本模式中，我们将讨论每个服务一个数据库。让我们在微服务架构中演示共享数据库（例如关系型数据库）与每个服务一个数据库之间的区别。\n\
  \n![](img/Figure-6.6.jpg)\n\n**图 6.6：** 关系型数据库中的共享数据库 vs. 每个服务一个数据库\n\n各个服务间的共享数据库可以通过单个数据库和表，或每个服务一个模式来实现。开发人员常倾向于执行\
  \ SQL 连接或直接读取另一个服务的数据。为了避免这种诱惑，我们可以使用每个服务一个数据库模式。按服务分离数据库为我们提供了最高级别的分离，这体现在几个优势中：\n\
  \n*   服务是松耦合的——正如我们所期望的！\n*   每个服务可以使用不同的数据库。正如我们提到的，每个数据库有不同的需求。\n*   扩展限制——许多数据库在速度和规模方面存在限制。当我们按服务分离数据库时，复制和扩展会更容易。我们可以独立管理每个数据库，不受其他服务施加的约束。\n\
  \n然而，按服务分离数据库也有几个缺点：\n\n*   创建和管理更多数据库时，复杂度显著增加。\n*   服务间的聚合和连接变得更加复杂和困难。SQL 连接发生在不同数据库之间。因此，我们需要外部服务或工具来促进这一点。\n\
  *   跨服务实现事务变得棘手且复杂。分布式事务具有挑战性；然而，前面提到的 Saga 模式可能有助于我们解决它。\n\n将每个服务一个数据库的模式想象为服务之间的另一道屏障。许多公司通常在开始时使用共享数据库，因为它简单快捷。过了一段时间，他们意识到必须按服务分离数据库。尽管如此，经过很长时间后分离数据库的时间成本，与一开始就按服务分离数据库的场景相比，是非常高的。\n\
  \n### 面向前端的后端\n\nBFF，即面向前端的后端，是一种帮助我们改善客户端与后端系统通信的模式。在构建系统时，我们通常有不同类型的客户端：使用 HTML/JS\
  \ 的基于 Web 的应用程序、像 React 这样的 Web 框架、用于 iOS 或 Android 的移动客户端、桌面应用程序、直接的 API 请求或第三方应用程序。每个客户端都需要来自不同后端服务的、结构不同的数据。\n\
  \n我们的问题是，所有这些客户端如何与所有后端服务器通信，而不会过度增加复杂性并使其变得笨重。解决方案是使用本章前面讨论的 API 网关模式，但为每个客户端单独使用。\n\
  \n![](img/Figure-6.7.jpg)\n\n**图 6.7：** 通过 API 网关实现面向前端的后端\n\n该模式的主要缺点与我们描述的 API\
  \ 网关的缺点相同：需要维护另一个服务，另一个活动部件，这增加了复杂性。此外，增加另一个服务意味着另一次网络跳转，会导致更慢的延迟。\n\n另一方面，使用面向前端的后端具有与\
  \ API 网关相同的优势。当为每个客户端创建最优 API 时，面向前端的后端模式非常有益。每个客户端的优化可能因客户端而异；例如，基于 Web 的应用程序可能比移动应用程序需要更多的数据。\n\
  \n### 外部配置\n\n在微服务架构中开发服务时，我们编写的代码会被部署到多个环境中，而非单一环境。每个环境彼此隔离。常见的环境类型包括生产、预发布（有时称为预生产）、QA\
  \ 和开发。每个服务在每个环境中都需要不同的配置。例如，每个环境都有独立的数据库，连接第三方服务的配置各不相同，凭证也不同，还有许多其他差异。我们不想创建每个服务的副本；作为开发人员，我们讨厌重复（DRY）。问题在于如何在不创建代码重复的情况下将所有这些服务部署到不同的环境中。\n\
  \n解决方案就是这种模式——使配置对服务外部化。服务启动时，通常会通过环境变量从外部服务/源拉取配置。配置注入也可以通过环境变量以外的其他方式执行。必须谨慎小心。环境配置之间的混淆可能会非常痛苦，比如将开发和生产环境的数据库配置弄反了。\n\
  \n在 *第 8 章，Kubernetes 简介* 中，我们将看到 Kubernetes 如何通过环境变量无缝地帮助注入配置。一个广泛使用的工具 Helm，是\
  \ Kubernetes 之上的力量倍增器，并提供模板引擎，实现更无缝的配置。\n\n### 服务网格\n\n描述服务网格的最佳方式是将其作为一个专用的基础设施层，用于处理微服务之间的通信。它通常在网络层提供工具，如本章所述的元素——负载均衡器、服务发现、安全性和监控（日志、指标等）。理解这项技术的存在及其能给我们带来很大帮助至关重要。使用服务网格的主要缺点是它可能难以配置。当我们达到框架不存在的某些能力时，我们通常没有灵活性来满足我们的需求。\n\
  \n提供服务网格的三种流行市场技术是 Istio（用于 Kubernetes）、Linkerd 和 Consul。建议详细阅读相关内容；本节只是一个总结。\n\n\
  ### 事件驱动架构\n\n事件驱动架构是一个庞大的话题。我们将讨论在微服务架构中实施事件驱动架构的交集。事件驱动架构是一个迷人的话题，遗憾的是，我们无法在本书中妥善讨论它。相反，针对这一主题，强烈推荐的书籍是“*Designing\
  \ Event-Driven Systems*”。\n\n在深入探讨微服务与事件驱动的接口之前，让我们先了解事件驱动架构的基础知识。\n\n### 事件与消息\n\
  \n**消息** 是具体的，我们从特定服务发送消息给另一个服务。发送方和接收方双方都知晓模式。发送方请求数据，并且知道如何根据约定的模式从接收方请求。另一方面，接收方期望根据约定的模式收到请求，并按承诺响应数据。模式对于发送方和接收方是唯一的，且位置是预先确定的。\n\
  \n**事件** 则更为通用。事件将包含数据，而非请求或指令。事件没有特定的目的地。它被发射并广播给那些将监听并消费该事件的对象。事件还包含一个 ID 以保证唯一性。事件是不可变的，不能被更改。\n\
  \n\n\n\n\n### 事件驱动架构\n\n事件驱动架构基于我们在前几章学到的发布/订阅模式。正如发布/订阅模式中所讨论的，我们需要三个组件来实现事件驱动架构：发布者、事件代理和消费者。以下是事件驱动架构的常见用例：\n\
  \n*   **跟踪另一个系统的事件**：如果我们想创建一个通过事件跟踪另一个系统的系统，我们很可能被迫构建事件驱动架构。\n*   **审计**。\n*  \
  \ **大数据处理**：CRUD 操作可能会产生许多冲突；转向事件驱动架构可以减少这种摩擦。\n*   **后端处理**：由于业务逻辑的要求。\n\n####\
  \ 优点\n\n*   **解耦服务**：与微服务类似，事件驱动架构能更进一步地帮助我们减少服务间的摩擦，使其变为松耦合。\n*   **可扩展性**：基于相同的原因，发布/订阅模式帮助我们进行扩展。我们可以分别控制生产者和消费者，分别对它们进行扩展、处理故障、部署新版本等。\n\
  \n#### 缺点\n\n*   **数据一致性**：将发布者和订阅者隔离开的缺点是，订阅者在处理事件时可能会遇到延迟，主要是在处理大量消息时。维护一致性和处理事件变得具有挑战性，特别是当事件涉及与其他事件相关的逻辑或与第三方服务的交互时。\n\
  *   **重复事件**：事件驱动架构基于断点工作。如果发生严重故障，我们总是可以从之前的检查点“重新驱动”事件。问题在于在故障发生前我们可能已经处理了一些事件，因此我们必须再次处理相同的事件。\n\
  *   **复杂性**：正如本书多次提到的——当我们添加更多组件和服务时，我们的系统将变得更加复杂。\n\n### 事件溯源\n\n事件溯源是一种有助于利用事件优势和特性的模式。由于事件的威力，我们不必暴露\
  \ `update` 和 `delete` 操作。相反，所有事件将始终被保存，并在服务请求时进行聚合。这基本上就是事件溯源模式的作用。通常，使用 API 的服务希望对数据执行\
  \ CRUD（创建、读取、更新、删除）操作。相反，数据看起来将像是事件聚合成的状态。无论是否使用事件溯源，最终结果应该是相同的。\n\n![](img/Figure-6.8.jpg)\n\
  \n**图 6.8：** 事件溯源与 CRUD 操作对比。\n\n事件溯源“减少”了 CRUD 操作的数量。它“禁用”了更新和删除操作，“启用”了仅创建操作，并为读取操作创建了一个替代方案。该模式有两个优势，包括：\n\
  \n*   **不可变性**：所有内容均被保留和更新。原始数据被保存，我们无需猜测原始数据是什么。我们无需付出巨大努力即可获得强大的可见性，准确了解发生了什么。\n\
  *   **可重放性**：Bug 和问题终将发生。在其他场景中，我们对此无能为力。但现在，我们拥有从 Bug 引入时刻起流式传输事件所需的所有数据（事件）。\n\
  \n该模式的显著缺点是我们现在需要存储更多的数据！处理大量数据会暴露许多隐藏问题。例如，我们将不得不管理数据保留、索引和完整性；这只是冰山一角。只有当我们知道在某个时刻不再需要那些事件时，才能实现数据保留。\n\
  \n相反，查询时间可能会延长，因为我们需要在每次请求中执行聚合，但为此我们有 CQRS。\n\n### CQRS\n\nCQRS 代表命令查询职责分离，是一种帮助我们在独立进程中执行更新和读取的模式。CQRS\
  \ 基于事件溯源模式。CQRS 模式旨在在写入和读取处理程序之间创建分离。正如我们提到的，用户最终希望检索数据，但数据是作为一组事件保存的。我们不在每次读取请求时计算聚合，而是每次处理事件（创建）时，触发带有某些逻辑的所有事件的聚合。最后，它将聚合作为状态保存到视图中。处理程序将暴露一个\
  \ API 从视图中读取数据。\n\n![](img/Figure-6.9.jpg)\n\n**图 6.9：** CQRS 标准用法\n\n上图显示了三种事件类型\
  \ - `EventA`、`EventB` 和 `EventC`。所有这些事件类型都将事件流式传输到处理程序中（它们之间有一个我们未绘制的发布/订阅机制）。然后，处理程序将所有事件写入\
  \ `Tables`。每次写入都会触发一个逻辑，计算状态并将该状态写入 `View`。当图中的用户（`Reader`）希望读取数据时，它请求 `View`（绿色箭头）而不是\
  \ `Tables`（红色箭头）。\n\nCQRS 的巨大优势显而易见——它提供了快速读取！尽管有巨大优势，CQRS 也有两个缺点：\n\n*   我们需要将所有事件归约为一个状态，这有时涉及大量数据，因此执行时间可能很长。\n\
  *   写入后读取不能立即可用。\n\n### 结论\n\n在本章中，我们简要介绍了微服务架构的核心要素。虽然我们没有深入探讨每个要素和模式，但我们对微服务架构的重要要素有了清晰、明确的理解。通常，我们不会在每个微服务架构中使用本章描述的所有要素。然而，本章描述的大多数模式都以各种方式实现在大多数微服务架构中。此外，请记住我们是开发人员，运维人员（通常是\
  \ DevOps）可能会构建所有这些要素。他们将建立所有必要的基础设施，将我们的应用程序和服务部署到生产环境。作为开发人员，我们必须了解整个系统运维的工作原理。这些知识将帮助我们理解我们的单个服务与其他服务及整个系统之间的边界。\n\
  \n我们描述的所有要素都不包含我们业务的业务逻辑。业务逻辑会影响本章讨论的要素的决策和设计。我们没有深入探讨编写单个服务的实践，即业务逻辑。这是我们在下一章需要做的事情。我们将深入探讨在微服务架构中使用\
  \ Go 编写特定服务的最佳实践和技术。\n\n### 参考资料\n\n*   [`www.thegeekyminds.com/post/how-microservices-communicate#:~:text=Message%20Brokers%20%2D%20Software%20tools%20called,an%20intermediate%20between%20various%20systems`](https://www.thegeekyminds.com/post/how-microservices-communicate#:~:text=Message%20Brokers%20%2D%20Software%20tools%20called,an%20intermediate%20between%20various%20systems)\n\
  *   [`www.nginx.com/blog/service-discovery-in-a-microservices-architecture/`](https://www.nginx.com/blog/service-discovery-in-a-microservices-architecture/)\n\
  *   [`www.nginx.com/learn/api-gateway/#:~:text=An%20API%20gateway%20is%20a%20data%2Dplane%20entry%20point%20for,%2C%20routing%2C%20and%20load%20balancing`](https://www.nginx.com/learn/api-gateway/#:~:text=An%20API%20gateway%20is%20a%20data%2Dplane%20entry%20point%20for,%2C%20routing%2C%20and%20load%20balancing)\n\
  *   [`www.nginx.com/resources/glossary/load-balancing/`](https://www.nginx.com/resources/glossary/load-balancing/)\n\
  \n\n\n\n\n### 构建 RESTful API\n\n### 简介\n\nREST 代表表述性状态转移，是一种架构风格。REST 定义了一组 API\
  \ 应满足的约束，以符合 REST 风格的要求。RESTful 是形容词，指遵循 REST 约束的 API。在本章的第一节中，我们将详细阐述这些约束。\n\n\
  在本章中，我们将深入探讨 REST 的约束，并通过一个 Go 语言服务进行演示。在上一章中，我们讨论了微服务架构中服务间的通信方式。通信的普遍模式是通过 API\
  \ 调用，而 REST 是 API 最广泛采用的架构风格。因此，我们的主要关注点将放在 REST 架构模式上。微服务架构天然贯穿了整个系统的 REST 约束，反之亦然。微服务与\
  \ REST 之间存在强关联。更广泛地说，微服务 <> Go <> REST <> Kubernetes 之间存在更强大的关联。\n\n![](img/Figure-7.1.jpg)\n\
  \n**图 7.1：** Google Trends 中的“REST”搜索词\n\n正如我们从 Google Trends 所见，REST 方法多年来变得非常流行。随着这种流行度，出现了许多\
  \ RESTful API，其中一些因其值得称道的 REST 实现而变得非常流行。在初学 REST 或刚编写新的 RESTful API 时，参考知名 API\
  \ 既愉快又有启发。这里列举两个例子：\n\n*   Stripe API\n*   Twilio API\n\n有三个主题我们不会在本章涉及，将在后续章节中涵盖，它们与\
  \ REST 相关：\n\n*   故障设计\n*   监控\n*   安全 - 认证、授权\n\n务必记住，REST 是一种架构风格，并没有单一的方式或“正确”的方式来实现\
  \ REST。有些做法适合 REST，有些则明显违背 REST。在任何设计 REST API 的会议室里，都会有被称为 RESTafarians（REST 原教旨主义者）的严格派，也有人会偏离\
  \ REST 的硬性约束。我们有时可以偏离 REST 的约束，以简化/改进 API 或处理边缘情况。REST 风格不是布尔值、1 或 0。它更抽象，API 可以是“*更\
  \ REST*”或“*不太 REST*”。\n\n#### 结构\n\n在本章中，我们将讨论以下主题：\n\n*   RESTful 方法简述\n    * \
  \  资源与表述\n    *   约束\n*   设计 API\n    *   能力\n    *   文档 - Swagger 和 OpenAPI\n \
  \   *   API 文件夹结构\n    *   资源方法\n*   打造服务端\n    *   Gin Gonic 设置\n    *   责任链\n\
  \    *   CORS\n*   API 能力\n    *   分页\n    *   限流\n    *   恐慌恢复\n    *   优雅关闭\n\
  \    *   过滤与排序\n    *   缓存\n    *   约定\n    *   版本控制与弃用\n    *   常见陷阱\n\n### RESTful\
  \ 方法简述\n\n正如我们在简介中提到的，REST 是一组约束，而 RESTful API 是满足 REST 约束的 API。让我们强调一下：REST 是一种风格，而不是像\
  \ HTTP 这样的协议。REST 和 HTTP 之间存在常见的混淆。Roy Fielding 允许使用任何首选协议来实现 REST。虽然此选项可用，但大多数\
  \ RESTful API 使用 HTTP 协议，这是 Roy 推荐的首选协议，但并非强制要求。其他类型的协议可以是 FTP、SMTP、IMAP 等。流行的表述类型（REST\
  \ 中的 RE）是 JSON（代表 JavaScript 对象表示法），同样，这也不是约束。RESTful API 可以使用其他表述，如 XML、HTML、CSV、纯文本、PDF\
  \ 等。\n\n根据我们的选择、需求和业务约束，有多种方式来构建 RESTful API。最终，每个 RESTful API 都满足 REST 约束，但方式各异。\n\
  \n![](img/Figure-7.2.jpg)\n\n**图 7.2：** REST 约束\n\nREST 有六个约束。最终，我们可以随心所欲地编写代码。REST\
  \ 风格旨在指导我们构建更合理的系统。实施这些约束旨在提高客户端性能、服务端的稳定性和可扩展性。这些约束相结合，旨在解决和修复大多数系统已遇到并深受其害的常见熟悉问题。\n\
  \n#### 资源与表述\n\n我们已经多次提到资源和表述。这两个术语是 REST 风格的核心。\n\n*   **资源：** 资源是一条信息，代表作为单一单元的功能性数据。例如，资源可以是一个对象（账户、用户、椅子）、对象集合、文档、图片等。我们可以通过所谓的资源方法来改变资源的状态，这些方法需要是统一的（作为统一接口约束的一部分）。例如，HTTP\
  \ 方法如 `GET`、`POST`、`PUT`、`DELETE` 等充当资源方法。\n*   **表述：** 资源表述指的是资源的状态，包括数据、元数据和超链接。\n\
  \n#### 约束\n\n以下是六个约束。\n\n##### 客户端-服务端\n\n该约束也是微服务架构的核心原则。它鼓励我们保持客户端和服务端松耦合。客户端和服务端之间不得共享任何依赖。组件需要独立、分别开发；客户端仅知道服务端暴露的\
  \ URI。\n\n##### 统一接口\n\n这是最复杂的约束，由其他四个子约束组成。URI 代表统一资源标识符，是一串字符，Web 技术可识别并关联特定资源。\n\
  \n![](img/Figure-7.3.jpg)\n\n**图 7.3：** URI 组成\n\n与前面提到的协议和表述不同，URI 不是可选的。REST 强制我们使用\
  \ URI 来确定资源的唯一性。在服务端和客户端之间存在一个接口。该约束旨在通过四个子约束创建统一性，同时建立该接口：\n\n*   **资源标识：** 它涉及确保每个\
  \ URI 对特定资源都是唯一的。这种唯一性至关重要，可防止从不同接口操作同一资源。\n*   **通过表述操作资源：** 服务端需要暴露的表述是期望的修改。此表述需要尽可能明确。\n\
  \n\n\n\n例如，像 `DELETE + URI` 这样的 HTTP 方法用于特定资源（`DELETE` `https://domain:port/api/account/{accountId}`）表示客户端请求\
  \ API 删除一个具有 `accountId` Account ID 的账户。开发人员必须能够轻松理解 URI，而无需进一步的文档（至少在大多数情况下）。\n\
  \n*   **自描述消息：** 消息必须包含所需资源上所有的“指令”。服务器应仅从消息中获取所有必要信息，而无需进一步的询问或信息。\n\n*   **超媒体作为应用状态引擎：**\
  \ 超媒体指电影、图片、文件等所有形式的媒体。当客户端请求 RESTful API 服务器获取资源数据时，它期望获得该资源的数据。部分数据可以是超媒体，REST\
  \ 旨在提供指向媒体数据的链接，而不是以某种形式直接提供数据本身。\n\n##### 无状态\n\n每个从客户端到服务器的请求都是隔离的。服务器绝不能以任何方式依赖之前的请求，也不能依赖服务器的本地动态上下文。客户端请求必须包含执行请求所需的所有必要数据。\n\
  \n##### 分层系统\n\n每个从客户端到服务器的请求都会经过各层。客户端与业务逻辑之间从不存在直接连接。这些层可以是认证、缓存、负载均衡等。此约束鼓励我们在客户端和服务器之间创建分离的层，例如微服务架构中那样。客户端对其与服务器之间的不同层是不可知的。大多数层通常存在于\
  \ API 网关中——正如上一章所述。\n\n##### 可缓存\n\n此约束强制服务器返回一个响应，其中包含指示数据是否来自缓存的数据。\n\n##### 按需代码\n\
  \n此约束不常见，也不是必需的。服务器可以通过下载小程序或脚本为客户端提供额外功能。例如，客户端想要将 JPEG 转换为 PDF，因此它向服务器请求一个执行此操作的脚本。客户端获取脚本并执行它。\n\
  \n### 设计 API\n\n在着手编写服务之前，第一步是了解产品需求、工程约束以及可能影响决策的任何因素。定义它将是什么样子、必要的能力是什么、什么不是、以及如何实现它。决定可用资源及其对应的表现形式。\n\
  \n### 能力\n\nRESTful API 的标准能力如下：\n\n*   文档\n*   认证和授权（可以在 API 网关层）\n*   RBAC（可以在\
  \ API 网关层）\n*   分页\n*   限流\n*   缓存\n*   过滤\n*   排序\n*   监控和可观测性\n*   功能开关\n*   告警\n\
  *   错误处理\n*   自动生成代码客户端\n\n每个 API 可能不需要所有这些能力，也可能需要此处未提及的其他能力。在构建微服务架构时，每个 API 都希望实现这些能力的一部分或更多，且实现方式可能与其他\
  \ API 相同。如果我们为每个 API 重复实现相同的能力（即使我们为每个能力使用一个包），最终将得到大量略有差异的样板代码。\n\n为了解决这个问题，我们需要创建共享基础设施。实现共享基础设施的一种方式是通过共享代码（使用单体仓库时）。在\
  \ Go 中，这些代码将位于名为 `pkg` 的目录中。另一种实现共享基础设施的方式是使用 SDK（使用多仓库时）；每个 API 将导入并使用此 SDK 以满足其自身需求。\n\
  \n### 文档：Swagger 和 OpenAPI\n\n构建 API 最关键的部分是记录 API 规范。记录 API 规范的行业标准是使用 Swagger\
  \ 和 OpenAPI。\n\nOpenAPI 是一种用于标准化 API 文档的规范的官方名称。它具有独特的语法，可以用 JSON 或 YAML 编写。\n\n\
  Swagger 是一组帮助实现 OpenAPI 的工具。大多数 Swagger 工具可在开源项目中获取；付费是获取高级工具的一种选择。\n\n*   **Swagger\
  \ Editor**：允许我们在线编辑 Swagger YAML 并查看变更的工具。\n*   **Swagger UI**：为 OpenAPI 规范生成 UI\
  \ 的工具。\n*   **Swagger Codegen**：通过 OpenAPI 规范，Swagger Codegen 可以用多种编程语言生成各种 API\
  \ 客户端和服务端。\n*   其他可以帮助满足各种需求的工具，此处不一一列举。\n\n```\n![](img/Figure-7.4.jpg)\n```\n\n\
  **图 7.4：** Swagger editor（https://editor.swagger.io/）\n\nSwagger 因其简单的语法而成为功能最强大、应用最广泛的工具集，但它有许多描述\
  \ API 的选项。客户端和服务端之间的约定是使用集中式文档。很多时候，负责 API 服务端的开发人员/团队与负责客户端的开发人员/团队是不同的。\n\n###\
  \ API 文件夹结构\n\n在*第 3 章 Go 基础*中，我们讨论了 Go 的文件夹结构。我们将把该文件夹结构与 API 文件夹结构合并为一个统一的结构。设计良好的文件夹结构将满足开发人员的需求。从入职开始——无论他们是否了解该项目——导航都将毫不犹豫，直到编写代码——知道在哪里查找逻辑、在哪里添加新资源或能力。\n\
  \n这里我们将展示两种著名的文件结构，但首先，让我们观察它们的共同点。\n\n```\n![](img/Figure-7.5.jpg)\n```\n\n**图\
  \ 7.5：** API 结构的最高层级\n\n第一个文件夹是 `cmd`，我们已经讨论过，但现在我们有了另一个可执行文件：`docs`。\n\n```\n![](img/Figure-7.6.jpg)\n\
  ```\n\n**图 7.6：** API 中的 cmd 结构\n\n`docs` 目录包含另一个 `main.go`，它是入口点，类似于服务端的 `main.go`，但用于部署文档。我们可以使用\
  \ Swagger UI 基于 `swagger.yaml` 生成 UI。\n\n第二个目录名是 `deploy`，它包含部署可执行文件及其他与服务端相关资产的所有配置，例如网络、配置、自动扩缩容等。`pkg`\
  \ 和 `scripts` 目录的用途与第 3 章所述相同——它们分别包含服务端间共享的代码和脚本。文件 `go.mod`、`go.sum`、`README.md`\
  \ 和 `Dockerfile` 将位于主目录中。\n\n在两个 API 结构示例中，我们将遵循杂货店的结构。为简单起见，我们将商店中的产品分为两类（即 OpenAPI\
  \ 中的标签）——**水果**和**蔬菜**。\n\n对于水果类别，我们有苹果和香蕉。对于蔬菜类别，我们有西红柿和黄瓜。每个水果（苹果、香蕉）和每个蔬菜（西红柿、黄瓜）根据\
  \ REST 定义都是一个资源。我们可以购买更多黄瓜（CREATE）、查看我们有多少黄瓜（READ）、卖掉一些（DELETE），或更新它们今天的新价格（UPDATE）。\n\
  \n```\n![](img/Figure-7.7.jpg)\n```\n\n**图 7.7：** API 内部文件结构 A\n\n上图展示了选项 A 的文件结构，这是选项\
  \ A 与选项 B 的唯一区别。让我们浏览一下其中的目录和文件。\n\n*   `common`：此目录包含所有资源共用的样板代码、共享功能、工具类以及每个资源所需的抽象。例如，名为\
  \ `query-params.go` 的文件有助于序列化请求中的所有查询参数。\n\n\n\n*   `middleware`：中间件满足分层系统的约束。在该目录中，我们将找到各层。这些层位于请求的入口点和端点处理程序之间。中间件的示例可以有：\n\
  \    *   认证和授权\n    *   缓存\n    *   请求解析\n    *   日志记录\n    *   限流\n    *   监控\n\
  \    *   安全\n    *   缓存\n    *   为业务逻辑添加上下文，例如连接到缓存或数据库\n\n*   `tests`：包含所有服务测试。在这里，我们将详细说明测试的内部结构。\n\
  \n*   `routes_registrator.go`：每个资源有多个端点。该文件聚合所有路由并将它们注册到 API，以便 `server.go` 知道将每个请求导向所需的处理程序。\n\
  \n*   `server.go`：构建 API 引擎。它使用 `routes_registor.go`，使用中间件，并设置部分配置。\n\n*   **每个类别（标签）的目录**：每个标签（如水果、蔬菜等）都有一个不同的目录。\n\
  \n![](img/Figure-7.8.jpg)\n\n**图 7.8：** 每个类别的 API 结构选项 A\n\n在每个类别目录中，每个资源都有一个不同的目录。请注意，单个资源可以包含多个端点。例如，`GET\
  \ /api/fruits/apple/:id, POST /api/fruits/apple, UPDATE /api/fruits/apple/:id, DELETE\
  \ /api/fruits/apple/:id` —— 这四个端点都与同一个资源相关 —— apple。在每个资源目录中，可以有四个文件：\n\n*   `controller.go`：这是主要处理程序，请求在通过所有中间件后从此处开始。它解析请求，向客户端通知错误（4XX\
  \ 状态码），并按 OpenAPI 约定返回数据。\n\n*   `db.go`：这有时命名为 `repository.go`。该文件包含针对数据库的所有操作，无论是什么数据库。这种结构的威力在于我们可以切换数据库，而我们只需要处理\
  \ `db.go` 文件。请注意，该文件本身不应包含模型/实体。通常有一个单独的机制来管理数据库，如 ORM 和迁移工具（`gorm` 是实现 ORM 的标准且广泛使用的工具）。\n\
  \n*   `routes.go`：定义资源的所有端点。请注意，单个资源可以包含多个端点。该文件将包含如下函数：\n\n```\nfunc RegisterRoutes(group\
  \ *gin.RouterGroup) {\n    group.GET(\"/fruits/apple/search\", gin.HandlersChain{ProcessRequestSearch}…)\n\
  \    group.GET(\"/fruits/apple/:id\", gin.HandlersChain{ProcessRequestID}…)\n}\n\
  ```\n\n*   `service.go`：它包含所有业务逻辑。\n\n文件结构的第二种选项类似。主要区别在于文件和目录的顺序。\n\n![](img/Figure-7.9.jpg)\n\
  \n**图 7.9：** API 结构选项 B\n\n在之前的结构中，我们在单个目录中为每个资源创建了四个文件。\n\n在选项 B 中，我们创建四个目录：`controllers`、`routes`、`repositories`\
  \ 和 `services`。在每个目录中，我们将找到另一组目录，其数量等于类别的数量，并在每个目录中，每个资源对应一个文件。\n\n### 资源方法\n\n\
  如前所述，REST 并不强制我们使用特定协议，但 HTTP 方法目前作为使用最广泛的 REST 协议占据主导地位。本节将专注于 HTTP；然而，我们可以在其他协议上实现相同的行为。\n\
  \n*   `GET`：它仅用于检索信息；它不会以任何方式改变状态。此方法代表读取操作。每次使用 `GET` 方法，我们都应获得相同的结果，除非另一个 HTTP\
  \ 方法的请求修改了该资源。此类请求可以被缓存，且有长度限制。示例：\n    `GET https://www.example.com/accounts`\n\
  \    `GET https://www.example.com/accounts/search?name=john`\n    `GET https://www.example.com/accounts?page=5`\n\
  \n*   `POST`：它为特定资源创建新数据 —— 单行或多行。此类请求不可缓存，且无长度限制。通常，数据在请求体中发送，而不在 URI 中。`POST`\
  \ 和 `GET` 方法是 HTTP 方法中使用最广泛的。示例：\n    `POST https://www.example.com/accounts`\n\
  \    `POST https://www.example.com/accounts/myaccount_id/users`\n\n*   `PUT`：它通常用于更新现有资源状态。然而，它也可以像\
  \ `POST` 方法一样创建新数据。`POST` 和 `PUT` 的主要区别在于 `PUT` 是幂等的，而 `POST` 不是。这种差异意味着多次调用 `PUT`\
  \ 方法将给出相同的结果，而 `POST` 由于潜在的副作用不保证这一点。示例：\n    `PUT https://www.example.com/accounts/{myaccount_id}`\n\
  \n*   `DELETE`：它用于删除特定资源。\n\n*   **其他**：`PATCH`、`OPTIONS`、`HEAD`、`CONNECT` 和 `TRACE`\
  \ 是我们可以使用的其他 HTTP 方法，但不如前面的方法常用。\n\n让我们简要概览标准 HTTP 状态码（X 代表任意数字，`1XX` 表示 100-199）：\n\
  \n*   **1XX**：信息响应。不常用。\n\n*   **2XX**：成功响应，我们希望看到的状态码。\n    *   `200 OK`：通常由 `GET`\
  \ 方法用于确定数据已成功检索。\n    *   `201 Create`：通常由 `POST`/`PUT` 使用。\n\n*   **3XX**：重定向消息，通常用于将请求重定向到其他服务器、端点、域名等。\n\
  \n*   **4XX**：客户端错误响应，意味着请求有问题，这是客户端的责任。这类响应在中间件或控制器中捕获。\n    *   **400 Bad Request**：客户端未提供处理请求所需的正确/恰当信息。\n\
  \    *   **401 Unauthorized**：服务器无法识别客户端。\n    *   **403 Forbidden**：客户端已被识别，但无法访问请求的数据。\n\
  \    *   **404 Not Found**：它是最流行的状态码之一，表示请求未被识别。\n\n*   **5XX**：服务器错误响应，意味着服务器本身有问题，用户通常对此无能为力。\n\
  \    *   **500 Internal server error**：服务器进入了一个我们不知道如何处理的场景。\n\n### 打造服务器\n\n本节将回顾在\
  \ Go 中创建 RESTful API 服务器的要点。我们将专注于使用 Gin 设置服务器以及需要注意的事项。Go 为我们提供了一个名为 `http` 的默认包，我们将使用并利用它。\n\
  \n### Gin Gonic 设置\n\nGin 是一个 HTTP Web 框架。首先，我们将从 `main.go` 开始，在其中声明并执行服务器。\n\n\
  ```\nfunc main() {\n    port := 8080\n    engine := internal.BuildEngine()\n   \
  \ srv := &http.Server{\n        Addr:    fmt.Sprintf(\":%d\", port),\n        Handler:\
  \ engine,\n    }\n    log.Printf(\"Starting server on port %d\", port)\n    if err\
  \ := srv.ListenAndServe(); err != nil && err != http.ErrServerClosed {\n       \
  \ log.Print(\"error while running API gin server\", \"error\", err.Error())\n  \
  \      os.Exit(1)\n    }\n}\n```\n\n在声明端口并构建 gin 引擎（稍后我们将看到如何构建）后，我们创建了一个 `http.Server`\
  \ 结构体实例。之后，我们使用 `ListenAndServe()` 函数启动服务器。\n\n```\nfunc BuildEngine() *gin.Engine\
  \ {\n    engine := gin.New()\n    engine.Use(gin.Logger())\n    engine.Use(gin.Recovery())\n\
  \    engine.Use(CORS())\n    group := engine.Group(\"/api\")\n    RegisterRoutes(group)\n\
  \    // engine.use(<any middleware you want>)\n    return engine\n}\n```\n\n\n\n\
  ### 创建引擎\n\n要创建一个新引擎，我们使用了 `gin.New()`。在构建引擎时，我们将声明所有适用于服务器中所有端点的中间件。在示例中，这些包括 logger、recovery\
  \ 和 CORS（我们将在下一节讨论它们）。声明完所有需要的中间件后，我们将声明分组。Gin 允许我们将服务器划分为多个分组。我们不会重点关注这一点，而是为所有服务器分配单个分组。有时，开发人员会为一个类别分配一个分组，为一个子类别分配一个子分组。在示例中，分组仅为\
  \ `\"/api\"`。我们将通过 `routes_registrator.go` 文件中的 `RegisterRoutes` 函数将所有端点分配给该分组。\n\
  \n```go\nfunc RegisterRoutes(routerGroup *gin.RouterGroup) {\n    apple.RegisterRoutes(routerGroup)\n\
  }\n```\n\n使用此函数中的多个分组，我们可以将更相关的中间件分配给特定分组。现在，让我们观察单个端点即单个资源的内部结构。这是我们将在 `routes.go`\
  \ 文件中找到的代码：\n\n```go\npackage apple\n\nimport \"github.com/gin-gonic/gin\"\n\nvar\
  \ Path = \"/fruits/apple\"\n\nfunc RegisterRoutes(group *gin.RouterGroup) {\n  \
  \  group.GET(Path, gin.HandlersChain{ProcessRequest}...)\n}\n```\n\n而在 `controller.go`\
  \ 文件中：\n\n```go\npackage apple\n\nimport \"github.com/gin-gonic/gin\"\n\nfunc ProcessRequest(c\
  \ *gin.Context) {\n    c.JSON(200, gin.H{\n        \"color\": \"red\",\n       \
  \ \"date\": \"2023-12-11\",\n        \"taste\": \"sweet\",\n    })\n}\n```\n\n当然，响应只是模拟数据；相反，我们需要在\
  \ `server.go` 文件中执行业务逻辑函数，该函数几乎总是会从 `db.go` 文件查询数据。\n\n### 责任链\n\n如果简化来看，责任链是一种将多个命令链接在一起的设计模式，使得一个命令会引导至另一个命令。这种模式有助于我们满足分层系统的约束。该模式的实现通过中间件进行。\n\
  \n利用我们之前展示的模块化，我们可以将相关中间件应用于整个 API（在 `BuildEngine` 函数中）。我们可以更具体地将中间件应用于 `RegisterRoutes`\
  \ 函数中的特定分组（类别）。甚至更详细地，我们可以在 `routes.go` 的资源级别应用特定中间件。\n\n### CORS\n\nCORS 是一种浏览器安全功能，全称为跨源资源共享。此功能旨在限制不需要的\
  \ HTTP 请求。我们必须指定哪些源可以从 Web 浏览器向我们的 RESTful API 服务器发送请求。以下是创建可处理此问题的 Gin 中间件的方法：\n\
  \n```go\nfunc CORS() gin.HandlerFunc {\n    return func(c *gin.Context) {\n    \
  \    c.Writer.Header().Set(\"Access-Control-Allow-Origin\", \"*\")\n        c.Writer.Header().Set(\"\
  Access-Control-Allow-Credentials\", \"true\")\n        c.Writer.Header().Set(\"\
  Access-Control-Allow-Methods\", \"POST, GET\")\n        c.Next()\n    }\n}\n```\n\
  \n### API 能力\n\n如前所述，每个 API 都需要支持作为产品需求衍生出的能力。许多流行的能力几乎存在于每个 API 中，也有一些则不然。我们将在此详述流行的能力。每个\
  \ API 能力很可能会被多个 API 使用，至少流行的那些是如此。最佳实践是创建一个可配置的共享基础设施，作为一个包提供服务，或者如果是单体仓库，则置于 `pkg`\
  \ 目录下。例如，如果一个 API 使用特定类型的分页，同一公司的其他服务很可能也需要以相同方式使用分页。\n\n### 分页\n\n分页是将内容分离到单独页面/部分的过程。它通常用于导航或获取海量数据。例如，如果用户阅读在线书籍，我们不需要一次性获取所有书籍内容。相反，每当他翻页时，我们可以请求下一页。另一个例子是当我们需要特定账户的所有用户，但用户数量巨大，无法作为单个响应获取所有用户；此时我们可以使用分页。\n\
  \n存在各种分页算法，部分算法可应用于数据库层面。例如，在 PostgreSQL 的 SQL 中使用 limit 和 offset。流行的分页算法有：\n\n\
  *   **页码：** 最直接但最不常用的算法。选择固定 limit，然后将 limit 与页码相乘。\n    `GET /api/users?page=2`\n\
  *   **偏移量和限制：** 类似于上述分页算法。区别在于我们必须选择 limit 大小，而不是使用默认 limit。客户端需要在每次请求之间使用 offset，这符合客户端交互。这是最常用的分页算法。\n\
  \    `GET /api/users?limit=10`\n    `GET /api/users?limit=10&offset=10`\n    `GET\
  \ /api/users?limit=10&offset=20`\n*   **ID 的自增主键：** 也是一种普遍的算法。该算法依赖某个 ID 来排列数据，并将该\
  \ ID 用作游标。\n    `GET /api/users?limit=10`\n    `GET /api/users?limit=10&cursor=<last_id_from_previous_request>`\n\
  \    `GET /api/users?limit=10&cursor=<last_id_from_previous_request>`\n\n### 速率限制\n\
  \n速率限制是阻止用户、机器人和请求过度使用的一种方式。为保持服务器正常运行，我们必须限制发往服务器的请求数量。速率限制通常是每个时间间隔的恒定请求数，例如每分钟\
  \ 10,000 个请求。\n\n我们将在共享包中将速率限制作为中间件实现，并在每个服务中使用该中间件。没必要自己实现速率限制。有许多适合 Gin 的优秀包可以做到这一点。最后，当请求数量超过限制时，返回的\
  \ HTTP 状态码为 429（请求过多）。\n\n### Panic 恢复\n\n我们已经简要讨论了 Go 中的错误处理和 `panic()`。我们可以将 panic\
  \ 比作其他编程语言中的 raise/throw 异常。当发生意外情况时我们使用 `panic()`，因此必须使整个应用程序崩溃。编写 RESTful API\
  \ 时，端点内部的 `panic()` 很奇怪，因为单个端点不应影响其他端点。\n\n如果该端点发生严重问题，我们必须返回错误状态码。编写 RESTful API\
  \ 时，我们可能会在服务器启动时或与整个服务器崩溃相关的功能中使用 `panic()`。请也注意明智地使用 panic，因为发生 `panic()` 时会执行所有\
  \ defer 语句。\n\n开发人员经常错误地使用 `panic()`，意外地将其放在端点内，或使用将 `panic()` 传播到我们程序的包。为应对这种情况，我们可以创建一个能从\
  \ panic 中恢复的中间件。我们可以使用 Gin 默认的 panic 恢复中间件：\n\n```go\nengine.Use(gin.Recovery())\n\
  ```\n\n或者我们可以使用 `recover()` 函数制作自定义 panic 恢复：\n\n```go\nfunc WithCustomRecovery()\
  \ gin.HandlerFunc {\n    return func(c *gin.Context) {\n        defer func() {\n\
  \            if err := recover(); err != nil {\n                _ = c.Error(fmt.Errorf(\"\
  [recovered] panic: %v\", err))\n                c.AbortWithStatusJSON(http.StatusInternalServerError,\
  \ gin.H{\"Error\": \"Internal Server Error\"})\n            }\n        }()\n   \
  \     c.Next()\n    }\n}\n```\n\n在前面的示例中，我们制作了一个自定义恢复，并可以放入任何我们想要的自定义功能。注意，此中间件将针对每个在途请求发生。\n\
  \n### 优雅关闭\n\n优雅关闭是指系统或应用程序关闭或收到需要关闭的信号（发布或任何其他原因）时的行为。在接收到关闭信号时，应用程序有在途任务。优雅关闭给应用程序一个宽限期来完成其任务。\n\
  \n\n\n\n### RESTful API 中的优雅关闭\n\n构建 RESTful API 时，在服务器层面实现优雅关闭至关重要。无论发生故障还是发布新版本，我们都希望让所有正在进行中的请求完成工作。以下是来自\
  \ `main.go` 的优雅关闭示例：\n\n```go\nfunc main() {\n\tport := 8080\n\tengine := internal.BuildEngine()\n\
  \tsrv := &http.Server{\n\t\tAddr:    fmt.Sprintf(\":%d\", port),\n\t\tHandler: engine,\n\
  \t}\n\tlog.Printf(\"Starting server on port %d\", port)\n\tstartHTTPServer(srv)\n\
  }\n\nfunc startHTTPServer(srv *http.Server) {\n\t// 创建一个监听来自操作系统中断信号的上下文。\n\tsigCtx,\
  \ stopSig := signal.NotifyContext(context.Background(), syscall.SIGINT, syscall.SIGTERM)\n\
  \tdefer stopSig()\n\n\tgo func() {\n\t\tif err := srv.ListenAndServe(); err != nil\
  \ && err != http.ErrServerClosed {\n\t\t\tlog.Print(\"error while running API gin\
  \ server\", \"error\", err.Error())\n\t\t\tos.Exit(1)\n\t\t}\n\t}()\n\n\t// 监听中断信号。\n\
  \t<-sigCtx.Done()\n\n\t// 恢复中断信号的默认行为并通知用户正在关闭。\n\tstopSig()\n\n\t// 请求当前正在进行中；等待\
  \ 10 秒以便它们完成。\n\tctx, cancel := context.WithTimeout(context.Background(), 10*time.Second)\n\
  \tdefer cancel()\n\n\tif err := srv.Shutdown(ctx); err != nil {\n\t\tlog.Print(\"\
  server forced to shutdown: \", \"error\", err.Error())\n\t}\n}\n```\n\n实现优雅关闭的函数是\
  \ `startHTTPServer`。首先，我们获取后台上下文并监听来自系统的中断信号。然后，在一个 goroutine 中运行 `ListenAndServe()`\
  \ 函数。当接收到某个信号时，我们使用 `context.WithTimeout` 给系统 10 秒的时间来完成工作。请注意，此时间因服务器而异，取决于服务器的内部功能和\
  \ API 的用途。\n\n### 过滤与排序\n\n过滤和排序是我们可以在端点中实现的两大最常用功能。这是在我们之前看到的分页功能之外的补充。\n\n####\
  \ 过滤\n\n实现过滤有三种主要方式：\n\n##### 路径参数\n\n我们在本章中已经提到了路径参数。按路径参数过滤通常用于特定用例。\n\n`GET /api/accounts/{category}\
  \ -> GET /api/accounts/Enterprise`\n\n在此示例中，我们按 Enterprise 类别过滤了所有账户。当然，我们需要在 OpenAPI\
  \ 中声明它并在服务器中实现它。\n\n##### 查询参数\n\n这是执行过滤最常用的方式。URL 应该非常直观，主要使用 `?` 和 `&` 关键字来分隔过滤参数。查询参数过滤有\
  \ URL 限制，我们希望尽可能保持简单。如果变得更复杂，我们应该考虑第三种过滤选项。\n\n`GET /api/accounts?category=Enterprise&size_gt=500`\n\
  \n在此示例中，我们想要获取大小大于 500 的所有企业账户。同样，我们可以使用不同的过滤器，如 `size_lt`（小于）、`size=`（等于）、`size_not`（不等于）和\
  \ `size_gte`（大于或等于）。\n\n##### 请求体\n\n偶尔，我们需要更复杂的过滤。此时，使用请求体非常方便。\n\n```http\nPOST\
  \ /api/accounts\nContent-Type: application/json\n\n{\n  \"or\": {\n    \"category\"\
  : \"Enterprise\",\n    \"size_gt\": 500\n  }\n}\n```\n\n在前面的示例中，我们使用带有 JSON 的 HTTP\
  \ POST 请求，询问所有属于企业类别或大小大于 500 的账户。\n\n#### 排序\n\n排序是 API 按特定顺序（如用户需求）排列响应数据的能力。对数据进行排序有三种主要方式：\n\
  \n##### 升序\n\n此技术用于按特定字段从最低值排序到最高值。\n\n`GET /api/accounts?sort=size&order=asc`\n\
  \n在示例中，我们将所有账户从最小排序到最大。惯例是使用 sort 和 order 作为查询参数。\n\n##### 降序\n\n与升序相同，但顺序相反。它按从最高值到最低值返回数据。\n\
  \n`GET /api/accounts?sort=size&order=desc`\n\n惯例是使用 `asc` 表示升序，`desc` 表示降序。\n\n\
  ##### 多字段排序\n\n当单个字段不足时，我们可以使用多个字段进行更复杂的排序。\n\n`GET /api/account?sort=effective_score,-size`\n\
  \n在前面的示例中，字段 `effective_score` 是 1 到 5 之间的排名数字，用于确定账户的有效权重。我们想要检索最高效的账户（升序），且在相同效率下尺寸最小的账户（因\
  \ `-` 号而降序）。\n\n### 缓存\n\n缓存是存储频繁使用数据的能力。缓存的位置可根据情况而变化。位置可以在负载均衡器或服务器级别，分布式缓存通常使用\
  \ Redis。让我们快速回顾一下 HTTP 方法缓存：\n\n*   `GET`：默认缓存，除非发生特定情况。\n*   `POST`：默认不缓存，除非请求显式声明需要缓存数据。\n\
  *   `PUT` 和 `DELETE` 完全不可缓存。\n\n要实现缓存，我们需要利用中间件的力量并实现一个中间件。缓存功能依赖于 TTL（生存时间）和请求头定义：\n\
  \n#### Expires\n\n此头指定缓存过期的绝对时间。\n\n`Expires: Sun, 21 June 2023 16:27:59 GMT`\n\n\
  #### Cache-Control\n\n此头声明指令，指明响应是否可缓存。指令示例包括 `max-age=3600`、`must-revalidate`、`no-cache`\
  \ 等。可在 [`developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Cache-Control`](https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Cache-Control)\
  \ 找到它们。\n\n#### Last-Modified\n\n它确定上次生成响应的时间。\n\n最后，必须记住缓存的目的是在响应所需数据时改善延迟并减少服务器工作量。如果缓存未能实现其初衷，我们需要移除或修复缓存层。\n\
  \n### 约定\n\n在此，我们将详述与 RESTful API 相关的所有约定和最佳实践。\n\n*   资源可以是集合或单例。例如：\n    *   `GET\
  \ /api/accounts`：集合资源\n    *   `GET /api/accounts/{id}`：单例资源；当我们想要检索单例资源时，将使用**复数**形式的\
  \ `accounts`。\n\n*   集合/单例资源可以包含子集合，例如：\n    *   `GET /api/accounts/{id}/users`\
  \ - users 是子集合资源。\n\n*   **使用名词，而非动词**：URI 旨在将资源描述为实体（名词）而非动作（动词）。此外，不要在 URI 中包含操作名称。\n\
  \    *   `GET /api/deleteAccounts/{id}` - 不好\n    *   `DELETE /api/accounts/{id}`\
  \ - 好\n\n*   **字符约定**：\n    *   使用 `-` 提高 URI 可读性：\n        `GET /api/user-management`\n\
  \    *   不要使用尾部斜杠：\n        `GET /api/account/` - 不好\n        `GET /api/account`\
  \ - 好\n    *   始终使用正斜杠 `/` 而非反斜杠 `\\`\n    *   避免使用文件扩展名：\n        `GET /api/accounts/billing.json`\
  \ - 不好\n        `GET /api/accounts/billing` - 好\n\n在少数场景中，端点会变得高度复杂，我们需要尽可能简化它。如果变得过于复杂，我们应该考虑将其拆分为两个或多个端点。\n\
  \n### 版本控制与弃用\n\n\n\n\nAPI 是一种承诺，文档是对用户的承诺。开发人员希望因产品/工程需求引入新功能或进行破坏性更改。API 版本控制有助于实现这一目标。版本控制允许开发人员在不破坏现有客户端的情况下，在一个承诺与另一个承诺（承诺=版本）之间建立清晰的分离。\n\
  \n#### 版本控制策略\n\n让我们看看 API 版本控制的主流策略。\n\n*   **URI 版本控制：** API 版本包含在每个端点中。\n\n \
  \   `GET /api/v1/accounts`\n\n    `GET /api/v2/accounts`\n\n    这种方法很流行且非常容易实现。然而，REST\
  \ 方法希望 URI 中仅包含资源详细信息，而不包含版本。\n\n*   **查询参数版本控制：** 与 URI 版本控制类似，版本在 URI 中，但不是作为路径参数；而是作为查询参数包含在内。\n\
  \n    `GET /api/account?version=1`\n\n    `GET /api/account?version=2`\n\n    这与前一种策略相同，但不那么出名，且不要求客户端更改\
  \ URL，只需更改参数。\n\n*   **Header 版本控制：** 它包含一个指示 API 版本的 Header。\n\n    `GET /api/accounts\
  \ Headers: { \"X-API-version\": \"1\" }`\n\n    `GET /api/accounts Headers: { \"\
  X-API-version\": \"2\" }`\n\n    这种方法最符合 REST 方法。然而，版本可能对用户隐藏。\n\n#### 版本控制最佳实践\n\
  \n让我们探讨一些最佳实践：\n\n*   **采用三部分版本控制：** 版本控制模式的最佳实践如下：`major.minor.patch`。例如，1.3.2\
  \ - 主版本号为 1，次版本号为 3，补丁版本号为 2：\n\n    *   Major：用于引入破坏性或大规模 API 更改。\n    *   Minor：每当引入仍向后兼容的新功能和特性时。\n\
  \    *   Patch：用于错误修复。\n\n*   **向后兼容性：** 始终致力于支持旧功能和特性，而不是破坏它们。我们利用向后兼容性来减少对最终客户端的影响。\n\
  \n*   **沟通变更：** 每当发布新版本时，反映并详细说明变更内容并将其有效地传达给客户至关重要。\n\n#### 弃用\n\n当必须弃用旧 API 版本时，我们将优雅地进行。宽限期必须非常长，并且我们必须频繁地向客户报告变更。我们必须给用户足够的时间迁移到新版本。文档也应反映弃用情况，并将端点标记为已弃用。\n\
  \n### 常见陷阱\n\n以下是 REST 中的一些常见陷阱：\n\n*   **过度使用 POST HTTP 方法：** 开发人员倾向于坚持使用 POST\
  \ 操作，即使这不是正确的选择。我们必须利用所有其他 HTTP 方法：`DELETE`、`PATCH`、`PUT`、`GET` 等。\n\n*   **不遵守前述约定：**\
  \ “资源”一词可能会让 REST 新手感到困惑，导致糟糕的资源命名。\n\n*   **缺乏版本控制：** 我们必须按照上一节所述保持 API 版本控制和弃用策略。\n\
  \n*   **选择不当的 HTTP 状态码：** 开发人员总是使用 200、400 和 500 状态码，而不是使用适当的 HTTP 状态码。\n\n*   **Swagger\
  \ 文档混乱且包含错误信息。**\n\n*   **过度复杂化：** 开发人员最大的陷阱是使 API 变得繁琐和困惑。保持简单并不容易，但我们必须这样做。\n\n\
  ### 结论\n\n在本章中，我们回顾了 RESTful API 的概念和约束。我们了解了是什么让通用 API 从仅仅是 API 变成了 RESTful API\
  \ —— 即 REST 约束。我们详细阐述了这些约束，并看到了它们在本章中的实现。我们学习了如何启动 API —— 从设计良好的架构第一步开始，使用 Swagger\
  \ 构建基于 OpenAPI 的适当文档，并为 Go 和 RESTful API 构建正确的结构。然后，我们开始使用 Go 编写 `gin-gonic` 服务器，并为\
  \ RESTful API 实现了分页、过滤、速率限制等几项标准功能。最后，我们讨论了 RESTful API 的相关约定，以及在需要时如何对 API 进行版本控制和弃用。在此过程中，我们提醒自己注意\
  \ RESTful 新手编写 API 时可能出现的常见陷阱。\n\n在下一章中，我们将探讨微服务架构中服务周期的一个关键方面：部署阶段。我们将使用市场上最适合此目的的最佳技术\
  \ —— Kubernetes 来探索部署阶段。\n\n### 参考资料\n\n*   [`restfulapi.net/`](https://restfulapi.net/)\n\
