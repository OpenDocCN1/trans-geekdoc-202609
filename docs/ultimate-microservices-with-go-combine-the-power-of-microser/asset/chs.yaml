  \   [`github.com/brianvoe/gofakeit`](https://github.com/brianvoe/gofakeit)\n*  \
  \ [`go.dev/security/fuzz/`](https://go.dev/security/fuzz/)\n*   [`refactoring.guru/design-patterns/adapter/go/example`](https://refactoring.guru/design-patterns/adapter/go/example)\n\
