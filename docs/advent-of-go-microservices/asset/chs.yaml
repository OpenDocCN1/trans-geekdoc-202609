  \n让我们提供一个不带超时/取消的上下文。我们需要实现接口中的两个函数，而其他部分可以保持不变。我们可以使用嵌入（embedding），这样我们就不需要实现完整的\
  \ context 接口，只需实现所需的两个函数即可。\n\n导航到 `internal` 包，将 `context.go` 移动到 `context_ip.go`，并创建一个包含以下内容的新\
  \ `context.go` 文件：\n\n```\n 1 package internal\n 2 \n 3 import (\n 4   \"context\"\
  \n 5 )\n 6 \n 7 type ctxWithoutCancel struct {\n 8   context.Context\n 9 }\n10 \n\
  11 // Done 返回 nil（不可取消）\n12 func (c ctxWithoutCancel) Done() <-chan struct{} { return\
  \ nil }\n13 \n14 // Err 返回 nil（不可取消）\n15 func (c ctxWithoutCancel) Err() error {\
  \ return nil }\n16 \n17 // ContextWithoutCancel 返回一个不可取消的 ctx\n18 func ContextWithoutCancel(ctx\
  \ context.Context) context.Context {\n19   return ctxWithoutCancel{ctx}\n20 }\n\
  ```\n\n我们在这里只对提供的上下文进行了部分封装，因此我们覆盖了 `Done` 和 `Err`，但没有触碰提供的 `Deadline` 或 `Value`。剩余的函数调用将进入我们在这里嵌入的原始上下文。\n\
  \n我们现在可以修复 `Push` 函数以清除上下文取消状态了：\n\n```\n1 // 向传入的日志表推送一条记录\n2 func (svc *Server)\
  \ Push(ctx context.Context, r *stats.PushRequest) (*stats.PushRes\\\n3 nse, error)\
  \ {\n4   ctx = internal.ContextWithoutCancel(ctx)\n5 ...\n```\n\n从现在起，每个到达 `Push()`\
  \ 的请求都将完成，无论该请求的上下文是否被取消。取决于你是否仍希望在某种超时值达到时报错，可以在此之后添加 `context.WithTimeout` 调用。\n\
  \n现在，让我们对我们的 wrk 脚本进行两处更改。\n\n- 使用 `-t60s`，以便我们可以测试更长时间段。\n- 使用 `-c100`，让我们总体使用的连接数少一点。\n\
  \n重新构建并运行服务，再次运行测试：\n\n```\n1 Running 1m test @ http://172.22.0.5:3000/twirp/stats.StatsService/Push\n\
  2   4 threads and 100 connections\n3   Thread Stats   Avg      Stdev     Max   +/-\
  \ Stdev\n4     Latency    47.69ms   11.86ms 143.28ms   73.10%\n5     Req/Sec   527.04\
  \     85.10   800.00     73.25%\n6   125930 requests in 1.00m, 13.09MB read\n7 Requests/sec:\
  \   2097.16\n8 Transfer/sec:    223.23KB\n```\n\n我们可以查看 APM 并发现在在此压力测试运行期间没有记录任何错误。这意味着我们成功地解决了此问题。\n\
  \n![](img/apm3-4.png)\n\n### 总结\n\n你已经可以看到使用 Elastic APM 的用处了。我们已经解决了服务和数据库在数据库连接处理和连接限制方面的配置错误，还修复了由于\
  \ HTTP 服务器实现行为和上下文取消导致潜在数据丢失的 Bug。\n\n总的来说，这一章介绍了如何通过自定义上下文来确保 APM 跟踪的完整性，并处理了复杂的请求生命周期问题。\n\
  \n\n\n如果我们实现多个后台任务，微服务的 `Shutdown()` 函数将仅仅是各个后台任务关闭的代理。如果我们不这样做，它可能会变成乱条代码（spaghetti\
  \ code），这本身就是一种责任共享的异味。\n\n如果我们现在与 `Server{}` 相同的级别上实现后台任务，我们就不需要为每个任务重新指定依赖项。这看起来可能是个好主意，直到你意识到这再次模糊了微服务所需与特定后台任务所需之间的边界。如果说我们学到了什么，那就是我们需要倾向于使用显式声明，而不是隐式作用域。这样，就能清楚地看到后台任务具体需要什么。\n\
  \n由于我们只是通过 `Init` 增加了一层间接，并模糊了后台任务与微服务 API 之间各种职责和依赖，让我们移除 `Init()`，并根据单一职责原则来实现我们的后台任务。\n\
  \n当我们做出这个决定时，我们也意识到在这种情况下替换后台任务的实现是轻而举的——我们只需要满足为后台任务 API 创建任何接口即可。如果它与 `Server{}`\
  \ 合并，那么在以后某个时刻进行隔离和重构可能会出现问题。\n\n从我们的生成器中移除 `Init`，让我们创建一个后台任务。\n\n### 后台任务\n\n\
  在这里遵循一些命名约定是，以确保我们的后台任务设计时考虑了单一职责。对此，我引用 [Effective Go - 接口命名](https://golang.org/doc/effective_go.html#interface-names)：\n\
  \n我们并不是在创建一个通用接口，但由于结构体在这里有特定的用途，我们可以对我们的结构体使用相同的命名约定。我们将创建一个 `Flusher`。\n\n在 `server/stats/`\
  \ 下创建 `flusher.go`：\n\n```\n 1 package stats\n 2 \n3 import (\n 4   \"context\"\n\
  \ 5   \"log\"\n 6   \"time\"\n 7 \n 8   \"github.com/jmoiron/sqlx\"\n 9   \"go.uber.org/atomic\"\
  \n10 )\n```\n\n我们导入了 [go.uber.org/atomic](https://godoc.org/go.uber.org/atomic)\
  \ 用于标准库 `sync/atomic` 的封装。它们提供了封装的数据类型，使其更容易以线程安全的方式处理值。\n\n```\n1 // Flusher 是一个上下文驱动的后台数据刷新任务\n\
  2 type Flusher struct {\n3   context.Context\n4   finish func()\n5 \n6   enabled\
  \ *atomic.Bool\n7 \n8   db *sqlx.DB\n9 }\n```\n\n我们的 `Flusher{}` 结构体嵌入了 `context.Context`，因此我们不需要编写自己的\
  \ `Shutdown` 函数，而是调用 `<-flusher.Done()` 来等待它优雅地结束。这是一个本地取消上下文。\n\n```\n 1 // NewFlusher\
  \ 创建一个 *Flusher\n 2 func NewFlusher(ctx context.Context, db *sqlx.DB) (*Flusher,\
  \ error) {\n 3   job := &Flusher{\n 4     db:      db,\n 5     enabled: atomic.NewBool(true),\n\
  \ 6   }\n 7   job.Context, job.finish = context.WithCancel(context.Background())\n\
  \ 8   go job.run(ctx)\n 9   return job, nil\n10 }\n```\n\n在创建 flusher 时，我们设置了依赖项，启用了向\
  \ flusher 推送数据的功能（`enabled=true`），并设置了取消上下文。\n\n```\n 1 func (job *Flusher) run(ctx\
  \ context.Context) {\n 2   log.Println(\"Started background job\")\n 3 \n 4   defer\
  \ job.finish()\n 5 \n 6   ticker := time.NewTicker(time.Second)\n 7 \n 8   for {\n\
  \ 9     select {\n10     case <-ticker.C:\n 11       job.flush()\n 12       continue\n\
  \ 13     case <-ctx.Done():\n 14       log.Println(\"Got cancel\")\n 15       job.enabled.Store(false)\n\
  \ 16       job.flush()\n 17     }\n 18     break\n19   }\n20 \n21   log.Println(\"\
  Exiting Run\")\n22 }\n```\n\n后台任务本身监听全局取消（`ctx.Done()`），并在接收后禁用向队列推送数据。我们还创建了一个\
  \ ticker 每秒运行一次刷新任务。\n\n```\n 1 func (job *Flusher) flush() {\n 2   log.Println(\"\
  Background flush\")\n3 }\n```\n\n此时，我们的 flusher 是一个空操作，我们只是打印了一条日志以确保它工作正常。让我们调整\
  \ `server.go` 以包含 flusher 依赖项，并创建我们的 `Shutdown` 函数：\n\n```\n 1 // Server implements\
  \ stats\n 2 type Server struct {\n 3   db *sqlx.DB\n 4 \n 5   sonyflake *Sonyflake\n\
  \ 6   flusher *Flusher\n 7 }\n 8 \n9 // Shutdown 是 SIGTERM 钩子\n10 func (s *Server)\
  \ Shutdown() {\n11   <-s.flusher.Done()\n12 }\n```\n\n我们所做的只是一些清理工作。\n\n### 清理工作\n\
  \n我们需要添加 `NewFlusher` 来连接一切。\n\n\n\n\n*   `Length() int` - report 当前队列中的项数\n\n当队列满时，`Push`\
  \ 函数应该返回一个错误。你需要自己限制队列的大小，以防你的应用程序在流量激增或数据刷新到数据库延迟时耗尽所有内存。\n\n这里没有合理的限制，因此由你来来实现。\n\
  \n```\n1 // Push 向队列中添加新项\n2 func (p *Queue) Push(item *Incoming) error {\n3   p.Lock()\n\
  4   defer p.Unlock()\n5   p.values = append(p.values, item)\n6   return nil\n7 }\n\
  ```\n\n将队列刷新到数据库需要读取队列的当前项，并清空它们以供后续的 `Push()` 调用使用。目前的实现保持了低内存占用，但当值被推入队列时会分配内存。\n\
  \n```\n 1 // Clear 返回当前队列项并清空它\n 2 func (p *Queue) Clear() (result []*Incoming)\
  \ {\n 3   length := p.Length()\n 4 \n 5   p.Lock()\n 6   defer p.Unlock()\n 7 \n\
  \ 8   result, p.values = p.values[:length], p.values[length:]\n 9   return\n10 }\n\
  ```\n\n最后——一个获取队列大小的实用函数：\n\n```\n1 // Length 返回当前队列大小\n2 func (p *Queue) Length()\
  \ int {\n3   p.RLock()\n4   defer p.RUnlock()\n5   return len(p.values)\n6 }\n```\n\
  \n为了让队列能够工作，它还需要两个额外的要素：\n\n1.  生产者：向队列写入数据。\n2.  消费者：从队列读取数据。\n\n### 生产者\n\n我们的生产者很容易实现，我们只需要修改服务的\
  \ `Push()` 函数即可：\n\n```\n1 -       fields := strings.Join(IncomingFields, \",\"\
  )\n2 -       named := \":\" + strings.Join(IncomingFields, \"::\")\n3 -\n4 -   \
  \    query := fmt.Sprintf(\"insert into %s (%s) values (%s)\", IncomingTable, field\\\
  \n5 s, named)\n6 -       _, err = svc.db.NamedExecContext(ctx, query, row)\n7 -\
  \       return new(stats.PushResponse), err\n8 +       return pushResponseDefault,\
  \ svc.flusher.Push(row)\n```\n\n基本上，我们现在不再直接调用数据库查询，而是调用 `svc.flusher.Push(*Incoming)`，如果请求无法入队，它将返回一个可能的错误。\n\
  \n使我们的 API 稍微优化一点的小更改是将 `new(stats.PushResponse)` 替换为预分配的变量。在 `server_push.go` 中的\
  \ `Push` 函数之前放入以下代码段：\n\n```\n1 // 保持返回单个对象以避免分配\n2 var pushResponseDefault = new(stats.PushResponse)\n\
  ```\n\n在 `Flusher` 结构体中实现生产者，我们需要一些额外的字段：\n\n```\n1   // queueIndex 是 []queues 的键\n\
  2   queueIndex *atomic.Uint32\n3   // queueMask 是 queueIndex -> key 的掩码值\n4   queueMask\
  \ uint32\n5   // queues 持有一组可写队列\n6   queues []*Queue\n```\n\nGo 标准库提供了 `sync/atomic`\
  \ 包，它提供了对数值类型的原子操作。然而，我们将使用 `go.uber/atomic` 包，它提供了对标准库封装的便利类型。\n\n我们需要更新 `NewFlusher`\
  \ 来初始化新字段：\n\n```\n1 func NewFlusher(ctx context.Context, db *sqlx.DB) (*Flusher,\
  \ error) {\n2   queueSize := 1 << 4\n3   job := &Flusher{\n4     db:         db,\n\
  5     enabled:    atomic.NewBool(true),\n6     queueIndex: atomic.NewUint32(0),\n\
  7     queueMask:  uint32(queueSize - 1),\n8     queues:     NewQueues(queueSize),\n\
  9   }\n```\n\n我们将 `queueSize` 设置为 2 的幂——我们将值左移 4 位，这意味着 `1 << 4` 等于 `16`（二进制 `10000`）。如果你想要更大的队列，就移动更多位。`queueMask`\
  \ 是掩码值——对于 `queueSize=16`，结果为 `1111`。我们可以对任何 `uint32` 值使用 `queueMask` 来获取其低 4 位。这是一种速度优化。如果你的队列大小是\
  \ 100，你将不得不使用取模运算符（`%100`）来余数。可以使用 `%16`，但使用位与（`&15`）会更快。\n\n我们现在可以编写以下接收 `*Incoming`\
  \ 的 `Push()` 函数：\n\n```\n1 // Push 将队列均匀分布到所有队列\n2 func (job *Flusher) Push(item\
  \ *Incoming) error {\n3   if job.enabled.Load() {\n4     index := job.queueIndex.Inc()\
  \ & job.queueMask\n5     return job.queues[index].Push(item)\n6   }\n7   return\
  \ err\n8 }\n```\n\n我们使用原子值 `queueIndex` 来指定新项写入哪个队列。如果 flusher 未启用，我们在关闭时返回一个错误。客户端可以重试。这处理了我们的生产者。\n\
  \n### 消费者\n\n我们只需要替换 `flush()` 函数来实现队列消费者：\n\n```\n1 func (job *Flusher) flush()\
  \ {\n2   var err error\n3 \n4   fields := strings.Join(IncomingFields, \",\")\n\
  5   named := \":\" + strings.Join(IncomingFields, \"::\")\n6   query := fmt.Sprintf(\"\
  insert into %s (%s) values (%s)\", IncomingTable, fields, named)\n7 \n8   var batchInsertSize\
  \ int\n9   for k, queue := range job.queues {\n10     rows := queue.Clear()\n11\
  \ \n12     for len(rows) > 0 {\n13       batchInsertSize = 1000\n14       if len(rows)\
  \ < batchInsertSize {\n15         batchInsertSize = len(rows)\n16       }\n17  \
  \     log.Println(\"[flush] queue\", k, \"remaining\", len(rows))\n18       if _,\
  \ err = job.db.NamedExec(query, rows[:batchInsertSize]); err != nil {\n19      \
  \   log.Println(\"Error flushing data:\", err)\n20       }\n21       rows = rows[batchInsertSize:]\n\
  22     }\n23   }\n24 \n25   log.Println(\"[flush] done\")\n26 }\n```\n\n由于我们使用了\
  \ `jmoiron/sqlx`，通过提供一个值的切片就有向数据库执行批量插入的能力。实现顺序如下：\n\n1.  准备插入数据的查询。\n2.  读取并清空所有队列的项。\n\
  3.  将读取的项批量数据库，每次 1000 行。\n\n如果在此处遇到问题，尝试执行 `go get github.com/jmoiron/sqlx@master`\
  \ 将最新版本的 `sqlx` 引入你的项目。批量插入最近才实现，你可能需要使用 `master` 版本的 `sqlx`。\n\n### 基准测试\n\n由于我们有了之前的实现的测试，让我们对比一下队列对服务提高了多少：\n\
  \n```\n1 Running 1m test @ http://172.29.0.2:3000/twirp/stats.StatsService/Push\n\
  2   4 threads and 100 connections\n3   Thread Stats   Avg      Stdev     Max   +/-\
  \ Stdev\n4     Latency    12.54ms   21.19ms 416.79ms   91.30%\n5     Req/Sec   \
  \  3.80k     1.63k   11.03k    63.05%\n6   909154 requests in 1.00m, 94.51MB read\n\
  7 Requests/sec:  15129.35\n8 Transfer/sec:      1.57MB\n```\n\n以及没有队列的之前的版本：\n\n\
  ```\n1 Running 1m test @ http://172.22.0.5:3000/twirp/stats.StatsService/Push\n\
  2   4 threads and 100 connections\n3   Thread Stats   Avg      Stdev     Max   +/-\
  \ Stdev\n4     Latency    47.69ms   11.86ms 143.28ms   73.10%\n5     Req/Sec   527.04\
  \     85.10   800.00     73.25%\n6   125930 requests in 1.00m, 13.09MB read\n7 Requests/sec:\
  \   2097.16\n8 Transfer/sec:    223.23KB\n```\n\n让我们也验证数据已写入：\n\n```\n1 mysql> select\
  \ count(*) from incoming;\n2 +----------+\n3 | count(*) |\n4 +----------+\n5 | \
  \  909251 |\n6 +----------+\n7 1 row in set (0.06 sec)\n```\n\n请求数的小幅差异可能是因为 wrk\
  \ 在收到最终响应之前关闭了连接，但请求已记录在数据库中。\n\n因此，通过在内存中队列入入数据，我们将平均延迟降低了约 74%。我们的每秒请求吞吐量从 100%\
  \ 增加到了 721%（7.2 倍！）。\n\n### 注意事项和陷阱\n\n当受到基准测试请求冲击时，刷新过程需要时间：\n\n\n\n\n```\n 1 [flush]\
  \ begin\n 2 [flush] queue 0 rows 23388\n 3 [flush] queue 1 rows 24330\n 4 [flush]\
  \ queue 2 rows 24578\n 5 [flush] queue 3 rows 23283\n 6 [flush] queue 4 rows 22134\n\
  \ 7 [flush] queue 5 rows 20695\n 8 [flush] queue 6 rows 19347\n 9 [flush] queue\
  \ 7 rows 17880\n10 [flush] queue 8 rows 16416\n11 [flush] queue 9 rows 14987\n12\
  \ [flush] queue 10 rows 13359\n13 [flush] queue 11 rows 11659\n14 [flush] queue\
  \ 12 rows 9964\n15 [flush] queue 13 rows 7989\n16 [flush] queue 14 rows 6301\n17\
  \ [flush] queue 15 rows 4596\n18 [flush] done\n```\n\n我们可以看到数据正在很好地排队。数据的刷新（flush）确实需要一些时间\
  \ —— 超过了我们指定的 5 秒刷新间隔。让我们考虑一下当前实现的陷阱：\n\n- 内存分配\n- 错误处理\n\n我们没有限制内存分配 - 从理论上说，考虑到我们的基准测试所提供的类似压力环境，我们的程序可能会导致资源耗尽。达到安全水平的一种方法是在队列满时引入背压（backpressure）。背压意味着向队列写入新数据的操作将被拒绝，直到现有队列刷新到数据库为止。\n\
  \n这意味着我们还可以通过实现循环缓冲区（circular buffer）来预分配队列，从而在向队列中添加新数据时避免分配。新项目将覆盖旧项目，直到队列填满并拒绝新的写入。\n\
  \n### 错误处理\n目前我们没有进行任何错误处理，只是在向数据库刷新数据时打印错误。导致这种情况的可能原因可能是未计划的数据库宕机。我们可以等待并重试写入，从而保证数据安全。这要求我们实现上述循环缓冲区和背压，因为在处理这种错误场景时，资源耗尽的可能性会更高。\n\
  \n### 总结\n设置合理的队列限制并尽量减少分配，使你的服务在遇到未计划的流量峰值或宕机时更加健壮。\n"
