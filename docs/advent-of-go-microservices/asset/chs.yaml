  \ NewServerHooks() *twirp.ServerHooks {\n11   return &twirp.ServerHooks{\n12   \
  \  Error: func(ctx context.Context, err twirp.Error) context.Context {\n13     \
  \  apm.CaptureError(ctx, err).Send()\n14       return ctx\n15     },\n16   }\n17\
  \ }\n```\n\n函数 `apm.CaptureError` 接收类型为 `error` 的第二个参数。由于接口 `twirp.Error` 是标准 `error`\
  \ 类型的超集，因此它已经与该参数兼容。在我们的 `cmd_main.tpl` 中，我们将 `nil` 参数替换为 `internal.NewServerHooks()`。\n\
