  \   // 当处理请求时发生错误，调用 Error 钩子。\n3   // Error 作为参数传递。\n4   Error func(context.Context,\
  \ Error) context.Context\n5 }\n```\n\n特别地，我们想通过另一个 Elastic APM 调用 `CaptureError`\
  \ 来记录错误。让我们在 `internal` 包下准备一个函数，在 `internal/twirp.go` 中构造一个带有定义日志器的 `*twirp.ServerHooks`\
