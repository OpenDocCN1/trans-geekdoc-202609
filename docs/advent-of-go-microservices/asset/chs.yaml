  \ `docker-compose up` 并观察服务的启动过程，而无需手动执行迁移步骤。\n\n## Go：使用 Elastic APM 对 HTTP 服务进行插桩\n\
  \nElastic APM 是一项应用性能监控产品，由 Elastic 公司开发，它是 Elasticsearch 的制作者，最著名的就是 ELK 栈（Elasticsearch,\
  \ Logstash, Kibana）。APM 是他们的另一款即插即用产品，可以连接到你现有的 ELK 安装，并为应用代理提供端点，以接收性能指标数据。\n\n\
  Elastic APM 提供了一个 Go 代理，我们将使用它来对代码的各个部分进行插桩。插桩不仅能帮助我们收集性能指标，还能帮助我们调试和优化应用程序。\n\n\
  ### 包装我们现有的处理器\n\n我们已经用自定义的处理器包装了 HTTP 处理器，它在请求上下文中添加了 IP 信息。APM 的工作原理相同，为 `http.Handler`\
  \ 提供了它们自己的包装器。由于我们可以合理地假设未来可能还需要其他包装器，我们将在 `internal/wrap.go` 下创建另一个函数，以保持 `main()`\
  \ 的整洁：\n\n```go\n 1 import (\n 2   \"strings\"\n 3 \n 4   \"net/http\"\n 5 \n 6\
  \   \"go.elastic.co/apm/module/apmhttp\"\n 7 )\n 8 \n9 // WrapAll 用我们服务所需的所有处理器对\
  \ http.Handler 进行包装\n10 func WrapAll(h http.Handler) http.Handler {\n11   h = WrapWithIP(h)\n\
  12   h = apmhttp.Wrap(h)\n13   return h\n14 }\n15 \n16 ...\n```\n\n该代码导入了带有 HTTP\
  \ 处理器包装器的 APM 模块。还有许多针对特定路由框架的包装器，特别是：`httprouter`、`gorilla`、`cgi`、`gin`、`echo`、`beego`……列表非常详细，你可以在\
  \ [elastic/apm-agent-go](https://github.com/elastic/apm-agent-go/tree/master/module)\
  \ 中查看。\n\n既然我们现在已经定义了 `WrapAll`，就可以修复 `main.go` 的生成器了：\n\n```diff\n1 --- a/templates/cmd_main.go.tpl\n\
  2 +++ b/templates/cmd_main.go.tpl\n3 @@ -48,5 +48,5 @@ func main() {\n4        \
  \ twirpHandler := ${SERVICE}.New${SERVICE_CAMEL}ServiceServer(srv, nil)\n5 \n6 \
  \        log.Println(\"Starting service on port :3000\")\n7 -       http.ListenAndServe(\"\
  :3000\", internal.WrapWithIP(twirpHandler))\n8 +       http.ListenAndServe(\":3000\"\
  , internal.WrapAll(twirpHandler))\n9  }\n```\n\n运行 `make` 重新构建带有 HTTP 服务器插桩的程序。\n\
  \n包装器负责创建所谓的“事务（Transaction）”。在我们案例中，一个事务由从发送到我们处理器的请求开始，直到该请求完成。对于每个请求，各种数据都会记录到\
  \ Elastic APM，其中最明显的是请求时长。\n\n### 同时也记录错误\n\n到达你服务的任何请求都可能出错。在创建 `twirpHandler`\
  \ 时，我们省略了 `NewXXXServiceServer` 调用中的第二个参数，该参数类型为 `*twirp.ServerHooks`。此结构体定义了 Twirp\
  \ RPC 服务器实现的各种钩子（hooks）。我们特别关注 `Error` 钩子：\n\n```go\n1 type ServerHooks struct {\n\
  2   // 当处理请求时发生错误，调用 Error 钩子。\n3   // Error 作为参数传递。\n4   Error func(context.Context,\
  \ Error) context.Context\n5 }\n```\n\n特别地，我们想通过另一个 Elastic APM 调用 `CaptureError`\
  \ 来记录错误。让我们在 `internal` 包下准备一个函数，在 `internal/twirp.go` 中构造一个带有定义日志器的 `*twirp.ServerHooks`\
  \ 实例：\n\n```go\n 1 package inject\n 2 \n 3 import (\n 4   \"context\"\n 5 \n 6 \
  \  \"github.com/twitchtv/twirp\"\n 7   \"go.elastic.co/apm\"\n 8 )\n 9 \n10 func\
  \ NewServerHooks() *twirp.ServerHooks {\n11   return &twirp.ServerHooks{\n12   \
  \  Error: func(ctx context.Context, err twirp.Error) context.Context {\n13     \
  \  apm.CaptureError(ctx, err).Send()\n14       return ctx\n15     },\n16   }\n17\
  \ }\n```\n\n函数 `apm.CaptureError` 接收类型为 `error` 的第二个参数。由于接口 `twirp.Error` 是标准 `error`\
  \ 类型的超集，因此它已经与该参数兼容。在我们的 `cmd_main.tpl` 中，我们将 `nil` 参数替换为 `internal.NewServerHooks()`。\n\
  \n```diff\n1 -       twirpHandler := ${SERVICE}.New${SERVICE_CAMEL}ServiceServer(srv,\
  \ nil)\n2 +       twirpHandler := ${SERVICE}.New${SERVICE_CAMEL}ServiceServer(srv,\
  \ internal.NewServerHooks())\n```\n[/content]包装器负责创建一个名为“事务”的实体。\n\n**注意：** 这里的翻译包含了：\n\
  - [elastic/elk](https://hub.docker.com/r/elastic/elk) 镜像\n- [spadas/elk](https://github.com/spadas/elk)\
  \ 仓库\n\n运行 `make` 重新构建带有 HTTP 服务器插桩的程序。\n\n包装器负责创建一个名为“事务”的实体。在我们案例中，一个事务由从发送到我们处理器的请求开始，直到该请求完成。对于每个请求，各种数据都会记录到\
  \ Elastic APM，其中最明显的是请求时长。\n\n##同时也记录错误\n\n到达你服务的任何请求都可能出错。在创建 `twirpHandler` 时，我们省略了\
