  \ 1 import (\n 2   \"strings\"\n...\n```\n... (后文省略)\n\n\n\n\n## APM: 事务列表\n\n深入分析事务可以让我们获得超越简单访问日志行之外的可观测性。APM\
  \ 聚合了我们的请求并提供分布图，因此你可以识别出哪些请求消耗了异常的时间。毕竟，我们应该优化的是第 95 百位数或第 99 百位数，而不仅仅是整体平均情况。容易而得的成果通常来自未经过优化的边缘情况。\n\
  \n![APM: 事务详情](img/apm-3-transaction-detail-top.png)\n\n## APM: 事务详情\n\n屏幕底部有两个重要的点需要注意：\n\
  \n![APM: 事务详情](img/apm-3-transaction-detail-bottom.png)\n\n## APM: 事务详情\n\n*   时间线\
  \ (Timeline)\n*   元数据 (Metadata)\n\n时间线目前仅包含我们的事务，但我们将通过跨（spans）来丰富它。例如，一个 span\
  \ 可以是一个 SQL 查询以及执行它所需的时间。然后我们可以将事务细分为实现细节，并回答此类问题：\n\n*   该请求对数据库执行了多少次查询？\n*  \
  \ RPC 内部最长的数据库查询是什么？\n*   我们发送了多少个 HTTP 请求？\n*   RPC 内部最长的 HTTP 请求是什么？\n*   连接数据库需要多长时间？\n\
  \n元数据包含了完整的 HTTP 请求数据、运行我们服务的宿主机/容器信息、构建服务时使用的 Go 版本、运行服务时使用的参数，我们还可以使用自己的自定义字段来扩展这些数据。\n\
  \n我们的下一步将是对数据库进行插化，这样我们就可以看到数据库查询以及连接延迟等内容。有了这些，我们就有了足够的服务数据，以便对其进行优化和改进。\n\n##\
  \ Go: 使用 Elastic APM 对数据库客户端进行插化\n\n在我们设置 Elastic APM 来记录请求事务之后，我们想要进一步插化的是发送到数据库端点的\
  \ SQL 查询。Elastic APM 提供了封装数据库/sql 驱动的插化程序，它可以生成一个 `*sql.DB`。\n\n### 扩展 DB 连接\n\n\
  我们已经计划通过 `db.ConnectionOptions` 中的 `Connector` 字段函数，为这种情况生成一个 `*sqlx.DB`：\n\n```\n\
  1 // Connector 是一个可选参数，用于生成我们\n2 // 自己的 *sql.DB，然后将其封装在 *sqlx.DB 中\n3 Connector\
  \ func(context.Context, Credentials) (*sql.DB, error)\n```\n\n我们现在只需修改 DB 包中的 `Connect()`\
  \ 函数，用 APM 连接接器对其进行扩展。\n\n```\n 1 // Connect 连接到数据库并生成用于注入的句\n 2 func Connect(ctx\
  \ context.Context) (*sqlx.DB, error) {\n 3   options := ConnectionOptions{\n 4 \
  \    Connector: func(ctx context.Context, credentials Credentials) (*sql.DB, error)\
  \ {\n 5       db, err := apmsql.Open(credentials.Driver, credentials.DSN)\n 6  \
  \     if err != nil {\n 7         return nil, err\n 8       }\n 9       if err =\
  \ db.PingContext(ctx); err != nil {\n10         db.Close()\n11         return nil,\
  \ err\n12       }\n13       return db, nil\n14     },\n15   }\n16   options.Credentials.DSN\
  \ = os.Getenv(\"DSN\")\n17   options.Credentials.Driver = os.Getenv(\"DRIVER\")\n\
  18   return ConnectWithOptions(ctx, options)\n19 }\n\nfunc ConnectWithOptions(ctx\
  \ context.Context, options ConnectionOptions) (*sqlx.DB, error) {\n    // implementation\
  \ details\n    return nil \n}\n```\n（注：上面的代码块根据提供的文本逻辑进行了微调，以符合有效的语法，因为原始片段是截断或不完整的）。\n\
  \n有一些值得注意的部分是：`*sql.DB`、`*sqlx.DB`、`Connector`、`db.ConnectionOptions`、`Connect()`、`apmsql.Open`、`db.PingContext`、`db.Close`、`os.Getenv`、`DSN`、`DRIVER`\
  \ 以及 `ConnectWithOptions`。\n\n\n\n\n\n```bash\n 1 #!/bin/bash\n 2 function get_stats_ip\
  \ {\n 3   docker inspect \\\n 4     microservice_stats_1 | \\\n 5   jq -r '.[0].NetworkSettings.Networks[\"\
  microservice_default\"]'.IPAddress\n 6 }\n 7 \n 8 url=\"http://$(get_stats_ip):3000/twirp/stats.StatsService/Push\"\
  \n 9 \n10 docker run --rm --net=host -it -v $PWD:/data skandyla/wrk -d15s -t4 -c400\
  \ -s test.lua a $url\n```\n\n该命令将运行 15 秒，使用 4 个线程、400 个连接，并为每个请求运行脚本 `test.lua`。针对我们的服务运行\
  \ `./test.sh` 结果如下：\n\n```\n 1 Running 15s test @ http://172.22.0.5:3000/twirp/stats.StatsService/Push\n\
