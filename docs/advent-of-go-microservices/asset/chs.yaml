- "# Go 微服务实战\n\n\n\n\n\n\n\n\n\n\n* * * * * *\n\n\n* * * * * *\n\n\n\n\n\n\n\n\n\n\
  \n\n\n## 1. 开始阅读\n\n## 简介\n\n### 关于我\n\n我热爱 API 开发、良好实践、性能优化以及教育人们追求质量。我拥有大约 20\
  \ 年的软件编写和优化经验，并经常使用各种编程语言解决实际问题，其中 Go 是我最喜欢的语言。\n\n你可能通过以下作品了解过我的工作：\n\n* [API Foundations\
  \ in Go](https://leanpub.com/api-foundations) 的作者，\n* [12 Factor Applications with\
  \ Docker and Go](https://leanpub.com/12fa-docker-golang) 的作者，\n* [scene-si.org](https://scene-si.org)\
  \ 的博客作者\n\n在专业领域，我擅长为社交/媒体行业以及各种内容管理产品编写 API。由于这些 API 是公开的，它们的性能特性至关重要。我是一个资深的 `MySQL`\
  \ 数据库管理员，同时也拥有其他数据库的经验。\n\n我对 PHP 有很强烈的观点。我花了二十年中的大部分时间在写 PHP 代码。我热爱 Go，幸运的是，这并不要求我对它有极其强烈的偏见，因为很难找到真正糟糕的代码。老实说，你能做出的最糟糕的事情就是不处理错误，我会以此评判你。不认同？请推特\
  \ [@TitPetric](https://twitter.com/titpetric) 并告诉我。\n\n我编写过一个专业的专用 API 框架，它同时也作为斯洛文尼亚国家电视台和电台网站（RTV\
  \ Slovenia）的软件开发包（SDK）。书中建立的架构旨在替换并实现最关键的微服务。\n\n### 这本书适合谁？\n\n这本书适合所有以编写应用程序为生计的人。我将涵盖许多与高效微服务开发相关的广泛主题。\n\
  \n如果你热衷 CI 和 DevOps，你会超级喜欢这本书。我希望向你展示 Go 之外的世界，并提供一些你可以用于开发微服务的有效方法示例。\n\n本书的意图是提供一种每日练习，将教你关于\
  \ `Drone CI`、`bash`、`Makefiles`、`Docker` 以及其他可能帮助你构建微服务或应用程序基础的内容。\n\n在书中，我将涵盖以下主题：\n\
  \n1. Go: Protobuf 简介：消息 (Messages)\n2. Go: Protobuf 简介：服务 (Services)\n3. Go: Protobuf\
  \ 简介：gRPC\n4. Make: 动态 Makefile 目标\n5. Bash: 简单的代码生成\n6. Bash: 将文件嵌入 Go\n7. Go:\
  \ 数据库迁移脚架\n8. `Drone CI`: 测试数据库迁移\n9. Go: 数据库优先的结构体生成\n10. Go: 生成数据库架构文档\n11. Go:\
  \ 使用 `Wire` 进行依赖注入\n12. Docker: 考虑到安全的镜像构建\n13. Go: 实现一个微服务\n14. Docker/Bash: 向我们的微服务发送请求\n\
  15. Go: 改进我们的数据库处理\n16. Go: 使用 Elastic APM 对 HTTP 服务进行监测\n17. Go: 使用 Elastic APM\
  \ 对数据库客户端进行监测\n18. Go: 对我们的服务进行压力测试\n19. Go: 后台任务\n20. Go: 使用队列优化请求\n\n### 我应该如何学习这本书？\n\
  \n从头到尾阅读本书。如果可能，尝试自己完成练习，而不是复制粘贴。通过实际编写代码片段，你将学会如何布局项目。\n\n在开始练习之前，请务必遵循“要求”章节。\n\
  \n## 要求\n\n这是一本书提供了关于构建微服务的实操说明和示例。我们将使用一套现代技术栈来完成所有练习。\n\n### Linux 和 Docker\n\n\
  书中的示例依赖于在 Linux 主机上安装的 `docker`。Linux 虽然是一个软性要求，但在书中多次提及。你可以在 Mac 上进行操作，但在翻阅章节时可能需要进行调整。\n\
  \n* `Docker`（较新版本，我怀疑 18.09 之后的均可），\n* `Docker Compose`（从其 GitHub 页面获取最新版本），\n*\
  \ `Drone CI`（书中后将介绍方法），\n* 各种 shell 工具和程序（`awk,bash,sed,find,ls,make`）\n\n请参考[官方\
  \ docker 安装指南](https://docs.docker.com/engine/installation/linux/) 如何安装最新的 `docker`\
  \ 版本，或通过你的包管理器安装。\n\n我们将使用 `Docker Compose` 来获取数据库以及我们需要的镜像。由于我们采用了 `Docker`-优先的工作流，这意味着我们不需要处理预安装软件。\n\
  \n#### 自己的硬件\n\n如果你有自己的硬件，推荐配置为：\n\n* 2 核 CPU\n* 2GB 内存\n* 128GB 磁盘 (SSD)\n\n已知可以运行的最小配置大约是上述的一半，但一旦你的使用量增加，可能会遇到困境。如果你只是想尝试\
  \ `docker`，且笔记本上没有运行 Linux，那么简单的虚拟机可能足够了。\n\n#### 云端快速上手\n\n如果你觉得拥有自己的硬件很麻烦，欢迎来到云的世界。你可以在几分钟内在\
  \ Digital Ocean 上设置自己的虚拟服务器。你可以使用[这个 DigitalOcean 推荐链接](https://m.do.co/c/021b61109d56)获得\
  \ 10 美元的积分，同时也帮我减少一些托管账单。\n\n\n\n\n\n注册后，创建一个运行着 `Docker` 引擎的 Linux 实例非常简单，只需点击几次。页面顶部页眉有一个漂亮的绿色按钮，写着“Create\
  \ Droplet”（创建实例）。点击它，在打开的页面中导航到“One-click apps”（一键应用），然后从列表中选择“Docker”。\n\n![从“One-click\
  \ apps”中选择 Docker](img/intro_do_1.png)\n\n从“One-click apps”中选择 Docker\n\n运行 `docker`\
  \ 可能会大量占用磁盘。某些 `docker` 镜像“重量”可能达到 1 GB 或更多。我绝对建议选择至少具有 30GB 磁盘空间的实例，每月 10 美元的价格来说非常划算，但你必须留意磁盘使用情况，因为它已知可能会被占满。\n\
  \n![选择合适的磁盘大小](img/intro_do_2.png)\n\n选择合适的磁盘大小\n\n除了页面上的一些额外选项（例如选择运行实例的区域）之外，页面底部只有一个巨大的绿色“Create”（创建）按钮，它将设置好你需要的一切内容。\n\
  \n## Go: Protobuf 简介：消息 (Messages)\n\n在最基础的层面上，协议缓冲区（protocol buffers 或 protobuf）是一种以最小开销序列化化数据的方法。它们要求数据结构在客户端和服务器之间是已知且兼容的，这与\
  \ JSON 不同，JSON 的结构本身就是编码的一部分。\n\n### Protobuf 与 Go\n\n最基本的 protobuf 消息定义看起来如下：\n\
  \n```\n1 message ListThreadRequest {\n2   // session info\n3   string sessionID\
  \ = 1;\n4 \n5   // pagination\n6   uint32 pageNumber = 2;\n7   uint32 pageSize =\
  \ 3;\n8 }\n```\n\n上述消息结构指定了字段名称、类型以及它们在编码二进制结构中的顺序。根据结构是作为 protobuf 还是 JSON 编码数据使用，管理该结构有几项含义不同的不同的要求。\n\
  \n例如，这是该消息的 `protoc` 生成的代码：\n\n```\n 1 type ListThreadRequest struct {\n 2   //\
  \ session info\n 3   SessionID string `protobuf:\"bytes,1,opt,name=sessionID,proto3\"\
  \ json:\"sessionID,omi\\\n 4 tempty\"`\n 5   // pagination\n 6   PageNumber    \
  \       uint32   `protobuf:\"varint,2,opt,name=pageNumber,proto3\" json\\\n 7 :\"\
  pageNumber,omitempty\"`\n 8   PageSize             uint32   `protobuf:\"varint,3,opt,name=pageSize,proto3\"\
  \ json:\"\\\n 9 pageSize,omitempty\"`\n10   XXX_NoUnkeyedLiteral struct{} `json:\"\
  -\"`\n11   XXX_unrecognized     []byte   `json:\"-\"`\n12   XXX_sizecache      \
  \  int32    `json:\"-\"`\n13 }\n```\n\n在开发过程中，以向前兼容的方式管理 protobuf 消息时，有一些规则需要遵循：\n\
  \n*   添加新字段不是破坏性更改（breaking change），\n*   删除字段不是破坏性更改，\n*   不要重用字段编号（会破坏现有的 protobuf\
  \ 客户端），\n*   不要重新对字段进行编号（会破坏现有的 protobuf 客户端），\n*   重命名字段对于 protobuf 来说不是破坏性更改，\n\
  *   重命名字段对于 JSON 来说是破坏性更改，\n*   更改字段类型对于 protobuf 是破坏性更改，通常对 JSON 也是如此，\n*   数值类型更改（例如从\
  \ `uint16` 到 `uint32`）对于 JSON 通常来说是安全的，\n*   如果你需要在 JavaScript 中使用你的 API，JSON 和\
  \ `uint64` 并不兼容\n\n所以，基本上，如果你在开发过程中依赖于更改 protobuf 消息定义，你就需要保持客户端与服务器同步更新。这在后期尤为重要，如果你将\
  \ protobuf API 应用在移动端客户端（Android 和 iPhone 应用）上，因为对 API 做出破坏性更改会给你带来麻烦。添加新字段或删除旧字段是更改\
  \ API 最安全的方法，因为 protobuf 的定义保持了兼容性。\n\n### 生成 Protobuf Go 代码\n\n在这一系列文章中，我将构建一个真实的微服务，用于跟踪和聚合多个服务的视图数据。它不需要身份验证，从定义上说它是真正的微服务，因为它只需要单个\
  \ API 端点。\n\n我们将通过从创建一个 `rpc/stats/stats.proto` 文件来创建我们的 `stats` 微服务。\n\n```\n 1\
  \ syntax = \"proto3\";\n 2 \n3 package stats;\n 4 \n5 option go_package = \"github.com/titpetric/microservice/rpc/stats\"\
  ;\n  \n7 message PushRequest {\n8   string property = 1;\n9   uint32 section = 2;\n\
  10   uint32 id = 3;\n11 }\n12 \n13 message PushResponse {}\n```\n\n这里声明了 `proto3`\
  \ 版本。重要的部分是 `go_package` 选项：通过它定义服务的导入路径，如果另一个服务想要导入并使用这里的消息定义，这将非常有用。可重用是 protobuf\
  \ 的内置功能。\n\n由于我们不想做一半的工作，我们将采用 CI 优先（CI-first）的方法来处理微服务。使用 Drone CI 是从一开始使用 CI 的极佳选择，因为\
  \ [drone/drone-cli](https://github.com/drone/drone-cli) 不需要设置 CI 服务，你只需要通过运行 `drone-cli`\
  \ 即可在本地运行 CI 步骤。\n\n\n\n\n通过此，我们可以定义我们的 `.drone.yml` 文件来构建 Protobuf 定义，并对我们的代码库执行一些维护：\n\
  \n```\n1 workspace:\n2   base: /microservice\n3 \n4 kind: pipeline\n5 name: build\n\
  6 \n7 steps:\n8   name: test\n9   image: titpetric/microservice\n10   pull: always\n\
  11   commands:\n12     - protoc --proto_path=$GOPATH/src:. -Irpc/stats --go_out=paths=relative:\\\
  \n13  rpc/stats/stats.proto\n14     - go mod tidy\n15     - go mod download\n16\
  \     - go fmt\n```\n\n完成的维护工作是我们的 `go.mod`/`go.sum` 文件，`commands:` 下定义的第一步是 `protoc`\
  \ 命令，它将为我们声明的消息生成 Go 定义。在 `stats.proto` 文件所在的文件夹中将创建一个 `stats.pb.go` 文件，为每个声明的 `message\
  \ {}` 创建代码。\n\n### 总结\n\n在这里我们实现了：\n\n- 创建了带有 `protoc` 生成环境的 Drone CI 镜像；\n- 我们使用\
  \ Drone CI 作为本地构建，使我们未来能够迁移到托管的 CI；\n- 为我们的微服务创建了 protobuf 定义；\n- 生成了用于编码/解码 protobuf\
  \ 消息的适当 Go 代码。\n\n从这里开始，我们将转向实现 RPC 服务。\n\n## Go：Protobuf 简介：服务\n\n实现微服务的下一步（可能是第一步）是定义其\
  \ API 端点。人们通常的做法是编写 http 处理程序并求助于诸如 [go-chi/chi](https://github.com/go-chi/chi)\
  \ 的路由框架。但是，协议缓冲区可以定义你的服务，因为 RPC 调用定义已经构建在 protobuf 模式中了。\n\n### Protobuf 服务定义\n\n\
  Protobuf 文件可以定义一个 `service` 对象，它包含一个或多个 `rpc` 调用定义。让我们通过包含一个带有 RPC 的服务来扩展 `stats.proto`\
  \ 定义：\n\n```\n1 service StatsService {\n2   rpc Push(PushRequest) returns (PushResponse);\n\
  3 }\n```\n\nRPC 方法通过 `rpc` 关键字定义。这里的服务声明了一个名为 `Push` 的 RPC，它接收 `PushRequest` 消息作为输入，并返回\
  \ `PushResponse` 消息作为输出。所有的 RPC 定义应该遵循相同的命名模式，作为最佳实践。这样你可以扩展 `PushRequest` 和 `PushResponse`，而不会对\
  \ RPC 定义引入破坏性更改。\n\n默认更新项目中的 `.proto` 文件定义不会改变任何内容。我们需要使用 RPC 框架生成 RPC 骨架。对于 Go\
  \ RPC，我们可以从一开始考虑 gRPC，或者查看更简单的 [Twitch RPC 即 Twirp](https://github.com/twitchtv/twirp)。\n\
  \n选择 `Twirp` 而不是 `gRPC` 的常见原因如下：\n- `Twirp` 支持 HTTP 1.1\n- `Twirp` 支持 JSON 传输\n\
  - `Twirp` 重新实现了 HTTP/2\n\n而选择 `gRPC` 而不是 `Twirp` 的原因是：\n- `gRPC` 支持流式\n- `gRPC`\
  \ 实现了线路兼容性\n- `gRPC` 在网络层具有更多功能（重试、RPC 发现）\n\nJSON 是演示负载的优选格式，特别是在检查负载等方面。虽然 `gRPC`\
  \ 是由 Google 编写的，但你必须添加许多工具来使其对开发者更友好——[grpc-gateway](https://github.com/grpc-ecosystem)\
  \ 用于添加 HTTP/1.1，以及 [grpcurl](https://github.com/fulldev) 用于发布 protobuf 请求。\n\n`gRPC`\
  \ 是丰富丰富的框架，支持更广泛的用例。如果你觉得你需要流式传输或者你的用例超出了简单的请求/响应模型，`gRPC` 可能是你唯一的选择。\n\n### 我们的微服务\n\
  \n让我们先从 `Twirp` 开始，这样我们可以在下一个章节中与 `gRPC` 进行真实的比较。\n\n大约 10 年前，我写了一个相对简单的微服务，基本上只是跟踪视图量。该解决方案在\
  \ 10 年后证明是不可维护的，但仍然很好，因为它管理了许多处理方式不相同的资产。让我们刷新一下我们的服务定义：\n\n```\n1 service StatsService\
  \ {\n2   rpc Push(PushRequest) returns (PushResponse);\n3 }\n4 \n5 message PushRequest\
  \ {\n6   string property = 1;\n7   uint32 section = 2;\n8 }\n9 \n10 message PushResponse\
  \ {\n11 }\n```\n\n`StatsService` 定义了 `Push` RPC，它接收 `PushRequest` 消息并返回 `PushResponse`\
  \ 消息。这包含了三个参数：\n- `property`: 跟踪的属性\n- `section`: 对应的字段\n- `id`: 定义的 ID\n\n服务的目标是根据\
  \ `PushRequest` 聚合数据，例如“过去 6 个月的统计数据”。\n\n\n\n我们在上一个章节中实现了一个 Twitch RPC 生成器，但我们有一些硬核的\
  \ gRPC 粉丝要求我查看一下 gRPC 生成的内容。我也对比较这两者感兴趣，所以让我们先从构建 gRPC 程序的脚手架开始吧。我们的主要目标是在更具体的层面比较\
  \ gRPC 与 Twitch RPC 的实现细节。\n\n### 生成 gRPC 的脚手架\n\n我们需要稍微修改 `Makefile`，通过更改一个 `protoc`\
  \ 选项来包含 `grpc` 代码生成插件：\n\n在 `rpc.%` 目标下，将 `go_out` 选项从：\n\n```\n1 --go_out=paths=source_relative:.\n\
  ```\n\n更改为：\n\n```\n1 --go_out=plugins=grpc,paths=source_relative:.\n```\n\n这将包含\
  \ `grpc` 插件，该插件用于生成 gRPC 客户端和服务器的代码。我们首先注意到的点是，`go.sum` 文件发生了显著变化，即有 42 个不同的包版本被列为依赖。然而，唯一特别突出的包是\
  \ `prometheus/client_model`。这可能意味着 gRPC 服务器的内部实现原生支持某些自定义的 Prometheus 指标。我们绝对没有从\
  \ Twitch RPC 中获得这些，但我们计划添加插化支持。\n\n### 比较服务器端\n\n通过检查更改 `*.pb.go` 文件，我们可以比较 Twitch\
  \ RPC 生成的接口与 gRPC 生成的内容。gRPC 的 `protoc` 生成器生成两个不同的接口：`StatsServiceClient` 和 `StatsServiceServer`。由于我们对第一个感兴趣，让我们现在比较一下：\n\
  \n```\n1 // StatsServiceServer 是 StatsService 服务的服务器 API。\n2 type StatsServiceServer\
  \ interface {\n3   Push(context.Context, *PushRequest) (*PushResponse, error)\n\
  4 }\n```\n\n与 Twitch RPC 相比：\n\n```\n1 type StatsService interface {\n2   Push(context.Context,\
  \ *PushRequest) (*PushResponse, error)\n3 }\n```\n\n因此，首先我们看到 Twitch RPC 服务的实现与我们的\
  \ gRPC 服务器是兼容。这意味着如果我们决定从 Twitch 迁移到 gRPC，我们的工作流将不会发生任何变化。\n\n我们可以运行一个同时暴露 gRPC\
  \ 和 Twirp 端点的单一服务。同时维护这两者似乎不是个好主意，但由于我们的服务本身没有任何特定的 Twirp 实现，看起来我们可以毫不费力地运行这两个点。\n\
  \n### 比较客户端\n\n区别似乎在于客户端本身：\n\n```\n1 type StatsServiceClient interface {\n2   Push(ctx\
  \ context.Context, in *PushRequest, opts ...grpc.CallOption) (*PushResponse\\\n\
  3 , error)\n4 }\n```\n\n虽然 Twirp 客户端和服务器遵循单一接口，但 gRPC 客户端拥有额外的选项。快速浏览 [`grpc.CallOption`](https://godoc.org/google.golang.org/grpc#CallOption)\
  \ 为我们提供了一个可能的构造函数列表。正如 Google API 通常的情况一样，在目前列出的选项中：\n\n* `CallContentSubtype` (string)\
  \ 可以设置为在网络传输上使用 JSON 编码，\n\n* `CallCustomCodec` - 已弃（使用 `ForceCodec`）\n\n* `FailFast`\
  \ - 已弃（使用 `WaitForReady`）\n\n* `ForceCodec`\n\n* `WaitForReady`\n\n* `Header`\n\n\
  * `CallCustomCodec`\n\n* `Recv`\n\n* `MaxCallSize`\n\n* `Peer`\n\n* `PerRPCredentials`\n\
  \n* `MD`\n\n* `Trailer`\n\n* `UseCompress`\n\n* `WaitForReady`\n\n因此，首先我们看到 Twitch\
  \ RPC 服务的实现与我们的 gRPC 服务器是兼容。这意味着如果我们决定从 Twitch 迁移到 gRPC，我们的工作流将不会发生任何变化。\n\n\n\n\
  如果我们使用 `rpc/stats` 作为目标名称，`make` 将不会执行任何操作，因为该文件/文件夹已经存在了。这就是为什么我们要重写目标名称以包含一个 `.`（`rpc.stats`）。我们需求的另一个明显部分是让这个目标动态化。我们想要构建任意数量的服务。\n\
  \n```makefile\n 1 --- a/Makefile\n 2 +++ b/Makefile\n 3 @@ -1,4 +1,10 @@\n 4 -.PHONY:\
  \ all\n 5 +.PHONY: all rpc\n 6  7  all:\n 8         drone exec\n 9 +\n10 +rpc: $(shell\
  \ ls -d rpc/* | sed -e 's/\\//./g')\n11 +rpc.%: SERVICE=$*\n12 +rpc.%:\n13 +  @echo\
  \ '> protoc gen for $(SERVICE)'\n14 +       @protoc --proto_path=$(GOPATH)/src:.\
  \ -Irpc/$(SERVICE) --go_out=paths=source_\\\n15 relative:. rpc/$(SERVICE)/$(SERVICE).proto\n\
  16 +       @protoc --proto_path=$(GOPATH)/src:. -Irpc/$(SERVICE) --twirp_out=paths=sour\\\
  \n17 ce_relative:. rpc/$(SERVICE)/$(SERVICE).proto\n```\n\n`%` 目标接受任何选项（模式中不包含 `/`）。我们还可以为每个目标声明像\
  \ `SERVICE` 这样的变量。该变量也可以通过在前面名前加上 `export ` 导出到环境变量（例如：`rpc.%: export SERVICE=$*`）。目前我们不需要它，但之后我们需要它来为我们的\
  \ `cmd/` 程序传递构建标志。\n\n`$*` 占位符是匹配的目标参数。由于目标是 `rpc.stats`，这里的变量将只包含 `stats` 而不包含\
  \ `rpc.`，因为它是目标定义的一部分。\n\n通过在目标中的单个命令中使用 `@` 前缀，我们可以抑制命令的输出。我们只需要将 `.drone.yml`\
  \ 中的步骤更新为 `make rpc`，我们就有了对动态数量的服务的支持。运行 `make` 可以验证这一点：\n\n``````\n1 # make\n2\
  \ [test:0] + make rpc\n3 [test:1] > protoc gen for stats\n4 [test:2] + go mod tidy\
  \ > /dev/null 2>&1\n5 [test:3] + go mod download > /dev/null 2>&1\n6 [test:4] +\
  \ go fmt ./... > /dev/null 2>&1\n```\n\n### 从 cmd/ 构建我们的服务\n\n对于每个服务，我们将创建一个 `cmd/{service}/*.go`\
  \ 结构，其中至少包含 `main.go`。让我们从添加一个简单的 `cmd/stats/main.go` 开始，包含一个 hello world 来欢迎我们。我们稍后会回来为实际的服务搭建脚架。\n\
  \n```go\n1 package main\n2 \n3 void main() {\n4   println(\"Hello world\")\n5 }\n\
  ```\n\n利用我们从 `rpc` 目标中学到的动态目标知识，让我们创建一个 `build` 目标，通过运行 `make build` 来构建我们将放在 `cmd/`\
  \ 下的所有应用程序。\n\n```makefile\n1 build: export GOOS = linux\n2 build: export GOARCH\
  \ = amd64\n3 build: export CGO_ENABLED = 0\n4 build: $(shell ls -d cmd/* | sed -e\
  \ 's///./')\n5   echo OK.\n6 \n7 build.%: SERVICE=$*\n8 build.%:\n9   go build -o\
  \ build/$(SERVICE)-$(GOOS)-$(GOARCH) cmd/$(SERVICE)/*.go\n```\n\n对于主 `build` 目标，我们定义了构建变量——我们想要为\
  \ `linux`、`amd64` 构建服务，并且想要禁用 `CGO` 以获得静态二进制文件。我们列出所有 `cmd` 路径并将它们映射到 `build.%`，类似于我们处理\
  \ `rpc` 目标的方法。剩下的工作是在 `.drone.yml` 的末尾添加 `make build`并将 `build` 文件夹添加到 `.gitignore`。\n\
  \n在生成代码时，[envsubst](https://www.gnu.org/software/gettext/envsubst.html) 是 get 套件的一部分。在最简单的形式下，它接受模板文件并替换其中的任何变量，然后输出结果。如果模板中有孤立的\
  \ `$` 字符，效果并不理想。\n\n### 生成我们的 cmd/ 文件夹\n\n在生成的文件中需要的第一个变量是项目所在的完整路径。我们可以从项目根目录下的\
  \ `go.mod` 文件获取该名称。让我们从 `make templates` 开始一个动态规则：\n\n```makefile\n1 templates:\
  \ $(shell ls -d rpc/* | sed -e 's///./')\n2   @echo OK.\n3 \n4 templates.%: SERVICE=$*\n\
  5 templates.%: export MODULE=$(shell grep module go.mod | sed -e 's/ //')\n6 templates.%:\n\
  7   @echo templates: $(SERVICE) $(MODULE)\n```\n\n对于每个 RPC 服务，都会创建一个 `templates.{service}`\
  \ 目标，并导出 `SERVICE` 和 `MODULE` 变量。当我们使用 `envsubst` 时，环境变量将可用。让我们为 `main.go` 文件创建基础模板（保存为\
  \ `templates/cmd_main.tpl`）：\n\n```go\n1 package main\n2 \n3 // 文件是自动生成的，不要在此处修改，参见\n\
  4 // generator and template: templates/cmd_main.tpl\n5 \n6 import (\n7   \"log\"\
  \n8   \"context\"\n9 \n10   \"net/http\"\n11 \n12   _ \"github.com/go-sql-driver/mysql\"\
  \n13 \n14   \"${MODULE}/rpc/${SERVICE}\"\n15   server \"${MODULE}/server/${SERVICE}\"\
  \n16 )\n17 \n18 func main() {\n19   ctx := context.TODO()\n20 \n21   srv, err :=\
  \ server.New(ctx)\n22   if err != nil {\n23     log.Fatalf(\"Error in service.New():\
  \ %+v\", err)\n24   }\n25 \n26   twirpHandler := ${SERVICE}.New${SERVICE_CAMEL}ServiceServer(srv,\
  \ nil)\n27 \n28   http.ListenAndServe(\":3000\", twirpHandler)\n29 }\n```\n\n你可以看到，这里的替换唯一的一个问题就是我们需要我们编写的服务的驼峰命名名称。这很容易提供：\n\
  \n```makefile\n1 templates.%: export SERVICE_CAMEL=$(shell echo $(SERVICE) | sed\
  \ -r 's/(^|_)([a-z])/\\U\\2/g')\n```\n\n正则表达式查找两个匹配：\n\n* 字符串开头 (`^`) 或下划线 (`_`)\n\
  * 紧跟在第一个匹配项后的字符\n\n然后将其替换为该字符的大写版本。因此 `stats` 变成 `Stats`，`hello_world` 会变成 `HelloWorld`，依此类推。让我们使用此模板生成\
  \ `cmd/stats/main.go` 并验证输出：\n\n```bash\n1 templates.%:\n2   mkdir -p cmd/$(SERVICE)\n\
  3   envsubst < templates/cmd_main.tpl > cmd/$(SERVICE)/main.go\n```\n\n查看生成的 `main.go`\
  \ 输出，我们可以验证一切运行正常：\n\n```go\n1   twirpHandler := stats.NewStatsServiceServer(srv,\
  \ nil)\n```\n\n### 为我们的服务生成客户端\n\n我们可以生成的另一个简单模板是我们微服务的 Twirp 客户端。\n\n```go\n 1\
  \ package ${SERVICE}\n 2\n 3 // 文件是自动生成的，不要在此处修改，参见\n 4 // generator and template:\
  \ templates/client_client.go.tpl\n 5 \n 6 import (\n 7   \"net/http\"\n 8 \n 9 \
  \  \"${MODULE}/rpc/${SERVICE}\"\n10 )\n11 \n12 func New() ${SERVICE}.${SERVICE_CAMEL}Service\
  \ {\n13   return NewCustom(\"http://${SERVICE}.service:3000\", http.Client{})\n\
  14 }\n15 \n16 func NewCustom(addr string, client ${SERVICE}.HTTPClient) ${SERVICE}.${SERVICE_CAMEL\\\
  \n17 }Service {\n18   return ${SERVICE}.New${SERVICE_CAMEL}ServiceJSONClient(addr,\
  \ client)\n19 }\n```\n\n不需要额外的变量，因此我们只需要在 Makefile 中添加额外的 `envsubst` 行即可：\n\n```makefile\n\
  1 templates.%:\n2   mkdir -p cmd/$(SERVICE) client/$(SERVICE)\n3   envsubst < templates/cmd_main.tpl\
  \ > cmd/$(SERVICE)/main.go\n4   envsubst < templates/client_client.tpl > client/$(SERVICE)/client.go\n\
  ```\n\n### 服务器实现\n\n从现在开始，我们需要查看可以做什么来构建服务服务器端的实现。这里的模板将仅作为服务实现的初始存根版本，因为我们需要根据自己的实现复杂性来扩展它。\n\
  \n让我们首先向我们的构建环境 Dockerfile 中添加一个接口脚架工具：\n\n```dockerfile\n1 # 安装接口脚架\n2 RUN go get\
  \ -u github.com/josharian/impl\n```\n\n\n\n\n```go\npackage ${SERVICE}\n\nimport\
  \ (\n  \"context\"\n\n  \"${MODULE}/rpc/${SERVICE}\"\n)\n\ntype Server struct {\n\
  }\n\nfunc New(ctx context.Context) (*Server, error) {\n  return &Server{}, nil\n\
  }\n\nvar _ ${SERVICE}.${SERVICE_CAMEL}Service = &Server{}\n```\n\n然后我们只需要在它之后追加\
  \ `impl` 的输出，这样生成的代码就能立即满足服务接口。现在我们需要更新 `makefile` 目标以调用此模板，并为 `StatsService` 接口生成函数\
  \ `function-stubs`。\n\n```make\ntemplates.%:\n  mkdir -p cmd/$(SERVICE) client/$(SERVICE)\
  \ server/$(SERVICE)\n  envsubst < templates/cmd_main.go.tpl > cmd/$(SERVICE)/main.go\n\
  \  envsubst < templates/client_client.go.tpl > client/$(SERVICE)/client.go\n  envsubst\
  \ < templates/server_server.go.tpl > server/$(SERVICE)/server.go\n  impl -dir rpc/$(SERVICE)\
  \ 'svc *Server' $(SERVICE).$(SERVICE_CAMEL)Service >> server/$(SERVICE)/server.go\n\
  ```\n\n在检查 `stubs` 已生成后，运行 `make` 将成功构建我们的项目。查看我们的服务，只需实现 server 接口中定义的函数：\n\n```go\n\
  func (svc *Server) Push(_ context.Context, _ *stats.PushRequest) (*stats.PushResponse,\
  \ error) {\n  panic(\"not implemented\") // TODO: Implement\n}\n```\n\n我们还希望在 `server.go`\
  \ 文件不存在时才生成它——我们只想在第一次时对其进行脚手架搭建，而在 `Makefile` 中检查文件是否存在很困难，所以让我们将其移动到 `bash` 脚本，并调整\
  \ `templates` 目标的详细程度/输出：\n\n```make\ntemplates.%:\n  @mkdir -p cmd/$(SERVICE) client/$(SERVICE)\
  \ server/$(SERVICE)\n  @envsubst < templates/cmd_main.go.tpl > cmd/$(SERVICE)/main.go\n\
  \  @echo \"~ cmd/$(SERVICE)/main.go\"\n  @envsubst < templates/client_client.go.tpl\
  \ > client/$(SERVICE)/client.go\n  @echo \"~ client/$(SERVICE)/client.go\"\n  @./templates/server_server.go.sh\n\
  ```\n\n`@` 命令会抑制正在运行的命令输出，我们为每个写入的文件输出 `~ file.go`。我们的 `server_server.go.sh` 包含了对\
  \ `server.go` 文件是否存在检查：\n\n```bash\n#!/bin/bash\ncd $(dirname $(dirname $(readlink\
  \ -f $0)))\n\nif [ -z \"${SERVICE}\" ]; then\n  echo \"Usage: SERVICE=[name] SERVICE_CAMEL=[Name]\
  \ $0\"\n  exit 255\nfi\n\nOUTPUT=\"server/${SERVICE}/server.go\"\n\n## 仅当 server.go\
  \ 不存在时才生成\nif [ ! -f \"$OUTPUT\" ]; then\n  envsubst < templates/server_server.go.tpl\
  \ > $OUTPUT\n  impl -dir rpc/${SERVICE} 'svc *Server' ${SERVICE}.${SERVICE_CAMEL}Service\
  \ >> $OUTPUT\n  echo \"~ $OUTPUT\"\nfi\n```\n\n这应该为我们的脚手架工作提供一个良好的开始。规划服务的正确且最优的方法是花时间规划\
  \ `proto` schema，然后让脚手架带你进入只需要实现定义的 `RPCs` 的阶段。\n\n面对更灵活且不断变化的需求，当你开发过程中更新 `proto`\
  \ 文件时，将无法真正利用代码生成的优势。添加新的 RPC 调用意味着你必须手动定义新函数，对于只有约 3 行代码的情况来说这并不坏，但对于除了只有少数函数调用的微服务之外，这仍然不是理想。规划可以节省时间。\n\
  \n## Bash: 将文件嵌入 Go 中\n\n总有一种可能，你的 Go 应用/服务需要封装某些文件以满足某些需求。一个常见的情况是将 SQL 迁移封装到应用程序中。SQL\
  \ 迁移是一组 SQL 查询，需要运行以设置干净的数据库，或者在应用程序的生命周期内更改数据库结构。\n\n### 规划数据库迁移\n\n数据库迁移可能是件棘手。。在系统中，人们倾向于编写双向的数据库迁移——向上（up）或向下（down，撤销）。由于始终存在数据丢失，我们将只规划单向的迁移。\n\
  \n让我们实现以下文件系统结构：\n\n```\n/db - 主数据库迁移包（也会生成 .go 文件），\n/db/schema/ - 服务迁移集合\n/db/schema/stats/\
  \ - `stats` schema 的迁移，*.up.sql 文件\n/db/schema/.../ - 其他服务迁移...\n```\n\n单个迁移应该保持命名一致，例如，数据库迁移可能存储在\
  \ `2019-11-18-141536-create-message.up.sql` 文件中。特别是使用了 `*.up.sql` 文件。\n\n除了实际的迁移，我们还需要跟踪已执行的迁移。已经执行的迁移不应再次运行，因为会产生错误。为此我们需要一个迁移表，它应该存在于每个\
  \ schema 中。\n\n```sql\nCREATE TABLE IF EXISTS `migrations` (\n  `project` varchar(16)\
  \ NOT NULL COMMENT '微服务或名称',\n  `filename` varchar(255) NOT NULL COMMENT 'yyyy-mm-dd-HHMMSS.sql',\n\
  \  `statement_index` int(11) NOT NULL COMMENT '语句索引',\n  `status` text NOT NULL\
  \ COMMENT '成功或错误信息',\n  PRIMARY KEY (`project`,`filename`)\n) ENGINE=InnoDB DEFAULT\
  \ CHARSET=utf8;\n```\n\n我们希望将这些文件嵌入应用程序，同时按服务分组，以便执行服务的迁移。为了这个目的，我们在 `db/fs.go`\
  \ 中创建一个文件系统封装：\n\n```go\ntype FS map[string]string\n```\n\n好了，这应该是高潮了。如果你预期这里会有过度工程，那这并不是重点——我们追求的是简单。文件系统以文件名作为键，以文件内容作为值。生成这种文件系统非常容易：\n\
  \n```go\npackage db\n\nvar Stats FS = FS{\n  \"2019-11-18-141536-create-message.up.sql\"\
  : \"...\",\n  \"...\": \"...\",\n}\n```\n\n事实上，文件系统如此简单，以至于我们可以再次通过简单的代码生成来实现它们。我们不需要任何形式的压缩，唯一需要解决的问题是正确地引用或转义文件内容，以便我们知道生成的代码不会产生错误。\n\
  \n### 简易文件嵌入\n\n啊，当我们分析如何生成文件系统资源时，我们还发现上一节中的那种“简易模板化”已经不再适用了。我们需要一种方法来遍历迁移文件列表，以便生成单个文件。\n\
  \n我们可能仍然不想为了嵌入这些文件而引入 Go 应用的复杂度，所以让我们使用 bash 来生成文件吧。需求很简单——对于每个 schema 的迁移生成一个文件系统，并生成一个\
  \ `map[string]FS` 索引，每个服务有一个键值对。\n\n由于文件包含换行符和反引号等特殊字符，且无法很好地直接嵌入 Go 中，我们将对文件内容使用\
  \ base64 编码。为此我们可以使用 shell 的 `base64` 命令，它支持编码和解码。\n\n\n\n\n\n```bash\n 1 ##!/bin/bash\n\
  \ 2 cd $(dirname $(dirname $(readlink -f $0)))\n 3 \n 4 ## 将文件内容编码为 base64\n 5 function\
  \ base64_encode {\n 6   cat $1 | base64 -w 0\n 7 }\n 8 \n 9 ## 生成一个服务 FS\n10 function\
  \ render_service_schema {\n11   local schema=$(basename $1)\n12   echo \"package\
  \ db;\"\n13   echo\n14   echo \"var $schema FS = FS{\"\n15   local files=$(find\
  \ $1 -name '*.sql' | sort)\n16   for file in $files; do\n17     echo \"\\\"$(basename\
  \ $file)\\\": \\\"$(base64_encode $file)\\\",\"\n18   done\n19   echo \"}\"\n20\
  \ }\n21 \n22 ## 将所有服务 FS 列入 `migrations` 全局变量\n23 function render_schema {\n24 \
  \  echo \"package db;\"\n25   echo\n26   echo \"var migrations map[string]FS = map[string]FS{\"\
  \n27   for schema in $schemas; do\n28     local package=$(basename $schema)\n29\
  \     echo \"\\\"${package}\\\": ${package},\"\n30   done\n31   echo \"}\"\n32 }\n\
  33 \n34 ## 列出所有服务的迁移 (db/schema/stats, ...)\n35 schemas=$(ls db/schema/*/migrations.sql\
  \ | xargs -n1 dirname)\n36 for schema in $schemas; do\n37   # db/schema/stats ->\
  \ schema/stats\n38   schema_relative=${schema/db\\//}\n39   # schema/stats -> db/schema_stats.go\n\
  40   output=\"db/${schema_relative/\\//_}.go\"\n41 \n42   render_service_schema\
  \ $schema > $output\n43 done\n44 \n45 render_schema > db/schema.go\n```\n\n这里剩下的工作只是对生成的\
  \ go 文件运行 `go fmt`。由于这已经在我们的 Drone CI 步骤中处理过了，我们现在已经成功地将所需的 SQL 迁移准备并放入了 `db` 包中，以便从这里开始使用。\n\
  \n由于我们现在已经将所有的数据库迁移嵌入到 go 代码中，我们可以继续作为 CI 测试套件的一部分，在真实的数据库上运行这些迁移。\n\n## Go: 数据库迁移脚手架\n\
  \n在我们准备好数据库迁移文件并将其嵌入 db 包之后，我们现在只需要实现处理这些迁移所需的细节了。让我们从扩展 FS 类型开始，以实际提供读取它们的功能。\n\
  \n```\n1 // ReadFile 从 FS 返回解码后的文件内容\n2 func (fs FS) ReadFile(filename string) ([]byte,\
  \ error) {\n3   if val, ok := fs[filename]; ok {\n4     return base64.StdEncoding.DecodeString(val)\n\
  5   }\n6   return nil, os.ErrNotExist\n7 }\n```\n\n从我们的 FS 类型中读取文件非常简单。我们只需要检查我们正在尝试读取的文件是否存在，并对其进行\
  \ base64 解码。为了在某种程度上符合读取文件的标准做法，如果读取的文件不存在，我们将返回一个 `os.ErrNotExist` 错误。\n\n让我们也添加一个\
  \ migrations 辅助函数，它可以列出文件系统中的迁移，这样我们就可以循环遍历它们并逐一运行。它只列出实际的迁移文件（`*.up.sql`），而不返回任何其他嵌入的文件（例如\
  \ `migrations.sql`）。文件将按照预期的执行顺序排序。\n\n```\n 1 // Migrations 返回要执行的 SQL 文件列表\n2\
  \ func (fs FS) Migrations() []string {\n3   result := []string{}\n4   for filename,\
  \ contents := range fs {\n5     // 跳过空文件\n6     if contents == \"\" {\n7       continue\n\
  8     }\n9     if matched, _ := filepath.Match(\"*.up.sql\", filename); matched\
  \ {\n10       result = append(result, filename)\n11     }\n12   }\n13   sort.Strings(result)\n\
  14   return result\n15 }\n```\n\n我们还需要为迁移架构 (`migration.sql`) 准备一个结构体，它如下：\n\n```\n\
  \ 1 package db\n 2 \n3 type (\n 4   migration struct {\n 5     Project        string\
  \ `db:\"project\"`\n 6     Filename       string `db:\"filename\"`\n 7     StatementIndex\
  \ int    `db:\"statement_index\"`\n 8     Status         string `db:\"status\"`\n\
  \ 9   }\n10 )\n11 \n12 func (migration) Fields() []string {\n13   return []string{\"\
  project\", \"filename\", \"statement_index\", \"status\"}\n14 }\n```\n\n字段如下：\n\n\
  * `project` 表示迁移组 / 服务（例如 `stats`），\n\n* `filename` 是该组中的一个迁移（`2019-11-26-092610-description-here.up.sql`），\n\
  \n* `statement_index` - 迁移中的顺序语句索引，\n\n* `status` - 这将要么是 “ok”，或者是迁移失败时产生的错误\n\n\
  解释 `statement_index`：每个迁移可以包含多个 SQL 查询。一种常见情况是在一个迁移内部导入完整的数据库架构，其中一个迁移将在单个文件中包含多个\
  \ `CREATE TABLE` 语句。我们需要使用分隔符 `;` 拆分该文件，该分隔符应该在行尾。为此，我们可以使用 `;$` 正则表达式将迁移拆分为语句，移除空语句并返回它们的列表。列表的键是语句索引。\n\
  \n这里的 `Fields()` 函数是为了帮助我们对数据库执行查询。为了执行完整的 `INSERT`（或 `REPLACE`，……），我们需要列出数据库表的字段。另一种方法是使用反射，但那太过度设计了。此函数帮助我们移除一些适用于数据插入/更新的字段冗余（stutter）。\n\
  \n我们可以产生一个辅助函数，它接收 `FS.ReadFile` 的结果：\n\n```\n 1 func statements(contents []byte,\
  \ err error) ([]string, error) {\n2   result := []string{}\n3   if err != nil {\n\
  4     return result, err\n5   }\n6   stmts := regexp.MustCompilePOSIX(\";$\").Split(string(contents),\
  \ -1)\n7   for _, stmt := range stmts {\n8   stmt = strings.TrimSpace(stmt)\n9 \
  \    if stmt != \"\" {\n10       result = append(result, stmt)\n11     }\n12   }\n\
  13   return result, nil\n```\n\n 这样我们就可以通过 `migrations[\"stats\"].ReadFile(\"migrations.sql\"\
  )` 生成语句。\n\n### 迁移 API\n\n现在由于我们已经有了读取和拆分迁移的结构和函数，我们需要考虑迁移 API。我希望提供：\n\n* `List()\
  \ []string` - 列出嵌入迁移的服务名称\n\n* `Print(project string) error` - 输出迁移\n\n* `Run(project\
  \ string, db *sqlx.DB) error` - 传入数据库句柄和项目名称运行\n\n这让我们能够编写一个可以打印或运行的 cli 工具。让我们从易着手的成果开始：`List()`：\n\
  \n```\n1 func List() []string {\n2   result := []string{}\n3   for k, _ := range\
  \ migrations {\n4     result = append(result, k)\n5   }\n6   return result\n7 }\n\
  ```\n\n该函数只会运行一次，性能并不密集，但作为一个小练习，让我们将其重写为内存高效的函数。\n\n```go\n1 func List() []string\
  \ {\n2   result := make([]string, len(migrations))\n3   i := 0\n4   for k, _ :=\
  \ range migrations {\n5     result[i] = k\n6   }\n7   return result\n8 }\n```\n\n\
  剩下的就是 `Print` 和 `Run` 函数。让我们从 `Print` 开始，因为目前不需要设置数据库。目标是获取项目文件系统并列出包含的迁移语句。让我们实现\
  \ `cmd/db-migrate-cli/main.go`：\n\n```\n 1 package main\n 2 \n3 import (\n4   \"\
  log\"\n 5 \n6   \"github.com/titpetric/microservice/db\"\n7 )\n 8 \n9 func main()\
  \ {\n10   log.Printf(\"Migration projects: %+v\", db.List())\n11   log.Println(\"\
  Migration statements for stats\")\n12   if err := db.Print(\"stats\"); err != nil\
  \ {\n13     log.Printf(\"An error occured: %+v\", err)\n14   }\n15 }\n```\n\n我们在开发过程中会扩展这个文件，但现在我们只感兴趣的是创建的\
  \ API 是否可用。我们可以编写单元测试，但由于我们在任何情况下都需要这个工具，这样已经足够了。我们现在还无法验证数据的有效性，我们能做的就是验证数据是否存在以及可以被读取。\n\
  \n\n\n\n```go\npackage db\n\nimport (\n  \"fmt\"\n  \"log\"\n\n  \"github.com/pkg/errors\"\
  \n)\n\nfunc Print(project string) error {\n  fs, ok := migrations[project]\n  if\
  \ !ok {\n    return errors.Errorf(\"Migrations for '%s' don't exist\", project)\n\
  \  }\n\n  printQuery := func(idx int, query string) error {\n    log.Println()\n\
  \    log.Println(\"-- Statement index:\", idx)\n    log.Println(query)\n    log.Println()\n\
  \    return nil\n  }\n\n  migrate := func(filename string) error {\n    log.Println(\"\
  Printing migrations from\", filename)\n    if stmts, err := statements(fs.ReadFile(filename));\
  \ err != nil {\n      return errors.Wrap(err, fmt.Sprintf(\"Error reading migration:\
  \ %s\", filename))\n    } else {\n      for idx, stmt := range stmts {\n       \
  \ if err := printQuery(idx, stmt); err != nil {\n          return err\n        }\n\
  \      }\n    }\n    return nil\n  }\n\n  // print main migration\n  if err := migrate(\"\
  migrations.sql\"); err != nil {\n    return err\n  }\n\n  // print service migrations\n\
  \  for _, filename := range fs.Migrations() {\n    if err := migrate(filename);\
  \ err != nil {\n      return err\n    }\n  }\n  return nil\n}\n```\n\n这里的结构比我们预期的\
  \ `Run` 稍微短一些，因为我们不需要在迁移结构体中记录语句索引。我们打印了初始的 `migrations.sql`，以及项目迁移索引中包含的所有其他迁移。\n\
  \n在运行 `make` 并构建所有二进制文件后，我们可以运行 `db-migrate-cli` 命令行来验证迁移语句正在打印。\n\n```\n## ./build/db-migrate-cli-linux-amd64\n\
  2019/11/26 11:20:00 Migration projects: [stats]\n2019/11/26 11:20:00 Migration statements\
  \ for stats\n2019/11/26 11:20:00 Printing migrations from migrations.sql\n2019/11/26\
  \ 11:20:00\n2019/11/26 11:20:00 -- Statement index: 0\n2019/11/26 11:20:00 CREATE\
  \ TABLE IF NOT EXISTS `migrations` (\n  `project` varchar(16) NOT NULL COMMENT 'Microservice\
  \ or project name',\n  `filename` varchar(255) NOT NULL COMMENT 'yyyy-mm-dd-HHMMSS.sql',\n\
  \  `statement_index` int(11) NOT NULL COMMENT 'Statement number from SQL file',\n\
  \  `status` text NOT NULL COMMENT 'ok or full error message',\n  PRIMARY KEY (`project`,`filename`)\n\
  ) ENGINE=InnoDB DEFAULT CHARSET=utf8\n2019/11/26 11:20:00\n2019/11/26 11:20:00 Printing\
  \ migrations from 2019-11-26-092610-description-here.up.sql\n2019/11/26 11:20:00\n\
  2019/11/26 11:20:00 -- Statement index: 0\n2019/11/26 11:20:00 -- Hello world\n\
  2019/11/26 11:20:00\n```\n\n我们现在已经验证了：\n\n-   我们可以列出我们的数据库 schema 迁移项目（`stats`），\n\
  -   我们嵌入了 `migration.sql` 文件，\n-   我们包含了一些迁移内容，特别是 `-- Hello world` :)\n\n我们现在可以转向在真实数据库上执行迁移的实现了。\n\
  \n## Drone CI：测试数据库迁移\n\n既然我们现在可以列出数据库迁移，下一步的逻辑步骤是在真实数据库上测试它们。为了实现这一点，我们仍然需要实现 `Run`\
  \ 函数。根据 `Print()` 中的内容，我们只需要更新 `migrate()` 函数。\n\n```go\nexecQuery := func(idx int,\
  \ query string, useLog bool) error {\n  if useLog {\n    log.Println()\n    log.Println(\"\
  -- Statement index:\", idx)\n    log.Println(query)\n    log.Println()\n  }\n  if\
  \ _, err := db.Exec(query); err != nil && err != sql.ErrNoRows {\n    return err\n\
  \  }\n}\n```\n\n我们需要更新 `execQuery` 函数。`printQuery` 函数在 `migrate()` 函数中将输出添加到迁移结构体中。我们需要专门为\
  \ `migrations.sql` 文件跟踪 `status`。\n\n```go\nmigrate := func(filename string) error\
  \ {\n  log.Println(\"Printing migrations from\", filename)\n  if stmts, err := statements(fs.ReadFile(filename));\
  \ err != nil {\n    return errors.Wrap(err, fmt.Sprintf(\"Error reading migration:\
  \ %s\", filename))\n  } else {\n    for idx, stmt := range stmts {\n      if err\
  \ := printQuery(idx, stmt); err != nil {\n        return err\n      }\n    }\n \
  \ }\n  return nil\n}\n```\n\n和之前一样，无论是否产生错误，我们都更新迁移状态到数据库中。错误或成功信息将写入 `status` 字段。\n\
  \n```go\nexecQuery := func(idx int, query string, useLog bool) error {\n  if useLog\
  \ {\n    log.Println()\n    log.Println(\"-- Statement index:\", idx)\n    log.Println(query)\n\
  \    log.Println()\n  }\n  if _, err := db.Exec(query); err != nil && err != sql.ErrNoRows\
  \ {\n    return err\n  }\n}\n```\n\n```go\nmigrate := func(filename string) error\
  \ {\n  log.Println(\"Printing migrations from\", filename)\n  if stmts, err := statements(fs.ReadFile(filename));\
  \ err != nil {\n    return errors.Wrap(err, fmt.Sprintf(\"Error reading migration:\
  \ %s\", filename))\n  } else {\n    for idx, stmt := range stmts {\n      if err\
  \ := printQuery(idx, stmt); err != nil {\n        return err\n      }\n    }\n \
  \ }\n  return nil\n}\n```\n\n```go\nup() error {\n  set := func(fields []string)\
  \ string {\n    sql := make([]string, len(fields))\n    for k, v := range fields\
  \ {\n      sql[k] = k + \"=\" + v\n    }\n    return strings.Join(sql, \", \")\n\
  \  }\n  if _, err := db.NamedExec(\"replace into migrations set \"+set(status.Fields()),\
  \ status); err != nil {\n    log.Println(\"Updating status failed:\", err)\n   \
  \ return err\n  }\n  return nil\n}\n```\n\n### 配置 Drone CI 进行数据库测试\n\n在 Drone 中运行数据库集成测试应该非常简单。让我们配置一个数据库服务和一个特殊的\
  \ makefile 目标来运行迁移。\n\n```yaml\n- name: migrations\n  image: percona/percona-server:8.0.17\n\
  \  user: root\n  pull: always\n  commands:\n    - yum -q -y install make\n    -\
  \ \"bash -c 'while : ; do sleep 1 ; $(cat < /dev/null > /dev/tcp/mysql-test/3306\
  \ ) && break ; done' 2>/dev/null\"\n    - make migrate\n\nservices:\n- name: mysql-test\n\
  \  pull: always\n  image: percona/percona-server:8.0.17\n  ports:\n    - 3306\n\
  \  environment:\n    MYSQL_ROOT_PASSWORD: default\n```\n\n\n\n\n```\n 1 migrate:\
  \ $(shell ls -d db/schema/*/migrations.sql | xargs -n1 dirname | sed -e 's/db\\\n\
  \ 2 .schema./migrate./')\n 3   @echo OK.\n 4 \n 5 migrate.%: export SERVICE = $*\n\
  \ 6 migrate.%: export MYSQL_ROOT_PASSWORD = default\n 7 migrate.%:\n 8   mysql -h\
  \ mysql-test -u root -p$(MYSQL_ROOT_PASSWORD) -e \"CREATE DATABASE $(SERVICE\\\n\
  \ 9 );\"\n10   ./build/db-migrate-cli-linux-amd64 -service $(SERVICE) -db-dsn \"\
  root:$(MYSQL_ROOT_\\\n11 PASSWORD)@tcp(mysql-test:3306)/$(SERVICE)\" -real=true\n\
  12   ./build/db-migrate-cli-linux-amd64 -service $(SERVICE) -db-dsn \"root:$(MYSQL_ROOT_\\\
  \n13 PASSWORD)@tcp(mysql-test:3306)/$(SERVICE)\" -real=true\n```\n\n`makefile` 目标为我们的服务生成数据库，然后运行我们的\
