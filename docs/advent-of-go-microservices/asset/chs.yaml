  4     parts[k] = strings.ToUpper(v[0:1]) + v[1:]\n5   }\n6   return strings.Join(parts,\
  \ \"\")\n7 }\n```\n\n### 查询 information schema\n\n在我们的 `cmd/db-schema-cli/main.go`\
