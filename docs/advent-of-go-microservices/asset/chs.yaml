  ## Go: 改进我们的数据库\n\n当我们开始开发真实服务时，我们发现数据库处理需要一些改进。我们将通过添加新功能和重构某些功能，对当前状态进行一系列改进。\n\
  \n### 数据源名称 - DSN\n\n我们目前没有进行任何类型的数据源处理，但我们需要向 DSN 注入一些选项，如下：\n\n- `parseTime=true`\
  \ - 需要将日期/时间值解码为 `time.Time` 而不是 `[]byte`，\n- `loc=Local` - 为 `time.Time` 值设置位置，[参见\
  \ time.LoadLocation](https://golang.org/pkg/time/#LoadLocation)，\n- `collation=utf8mb4_general_ci`\
  \ - 设置默认排序规则（如果你想使用表情符号，现在通常提供 utf8mb4）。\n\n创建 `db/dsn.go`：\n\n```go\n1 package\
  \ db\n2 \n3 import \"strings\"\n4 \n5 func cleanDSN(dsn string) string {\n6   dsn\
  \ = addOptionToDSN(dsn, \"?\", \"?\")\n7   dsn = addOptionToDSN(dsn, \"collation=\"\
  , \"&collation=utf8mb4_general_ci\")\n8   dsn = addOptionToDSN(dsn, \"parseTime=\"\
  , \"&parseTime=true\")\n9   dsn = addOptionToDSN(dsn, \"loc=\", \"&loc=Local\")\n\
  10  dsn = strings.Replace(dsn, \"?&\", \"?\", 1)\n11  return dsn\n12 }\n13 \n14\
  \ func addOptionToDSN(dsn, match, option string) string {\n15   if !strings.Contains(dsn,\
  \ match) {\n16     dsn += option\n17   }\n18   return dsn\n19 }\n```\n\n`cleanDSN`\
  \ 函数将在未提供的情况下向 `dsn` 添加默认选项。如果你为微服务 DSN 指定了 `loc=UTC`，则将使用该选项而不是默认的 `loc=Local`。\n\
  \n我们还希望将 DSN 输出到日志中，但不输出凭据。我们将采用简单的正则表达式来掩码 DSN 的用户名和密码。创建 `db/dsn_mask.go`：\n\n\
  ```go\n1 package db\n2 \n3 import \"regexp\"\n4 )\n5 \n6 var dsnMasker = regexp.MustCompile(\"\
  (.)?:.*)(.):(.)?:.*)(.)@\")\n7 \n8 func maskDSN(dsn string) string {\n9   return\
  \ dsnMasker.ReplaceAllString(dsn, \"$1****$2:$3****$4@\")\n10 }\n```\n\n\n\n正则表达式负责对\
  \ DSN 中用户名和密码部分的任意字符进行屏蔽，只输出每个部分的第一个和最后一个字符，中间保留 4 个星号。\n\n## 多数据库数据库连接\n\n正如我们发现的，我们希望从应用本身运行迁移（migrations）。为了让迁移工作，它们需要扩展权限，而这些权限在微服务中通常是不需要也不想要的。\n\
  \n微服务通常需要 `select`、`insert`、`update` 和 `delete` 记录的权限，而迁移需要 `create`、`alter`、`index`\
  \ 以及可能的 `drop` 表的权限。[权限完整列表](https://dev.mysql.com/doc/refman/8.0/en/grant.html#grant-privileges)\
  \ 非常长，将所有这些权限都添加到微服务可能使用的账户中是一个安全性问题。\n\n总而言之——我们需要提供两个 DSN 凭据，一个用于迁移，一个用于微服务。通过这种方式，我们在服务与具有高权限的迁移之间建立了一道安全屏障。\n\
  \n为了启用多个数据库配置，我们将添加选项类型（`db/types.go`）：\n\n```\n 1 package db\n 2 \n 3 import (\n\
  \ 4   \"context\"\n 5   \"time\"\n 6 \n 7   \"database/sql\"\n 8 )\n 9 \n10 type\
  \ (\n11   // Credentialsget DSN 和 Driver\n12   Credentials struct {\n13     DSN\
  \    string\n14     Driver string\n15   }\n16 \n17   // ConnectionOptions 包含常用的连接选项\n\
  18   ConnectionOptions struct {\n19     Credentials Credentials\n20 \n21     //\
  \ Connector 是一个可选参数，用于产生我们\n22     // 自己的 *sql.DB，然后被包装在 *sqlx.DB 中\n23     Connector\
  \ func(context.Context, Credentials) (*sql.DB, error)\n24 \n25     Retries     \
  \   int\n26     RetryDelay     time.Duration\n27     ConnectTimeout time.Duration\n\
  28   }\n29 )\n```\n\n因此，要连接到任何数据库，客户端需要提供 `ConnectionOptions{}`，以及一个产生 `*sql.DB`\
  \ 的可选 `Connector`。该连接器是可选的，将用于在不修改或包装现有函数的情况下对我们的 sql 客户端进行实例化，而是通过替换正在使用的驱动程序。我们稍后会回到这一点。\n\
  \n## 更新数据库连接\n\n通过引入 `ConnectionOptions` 结构体，我们有了配置连接重试的选项。`Retries` 为我们提供了最大连接尝试次数，`RetryDelay`\
  \ 在特定的连接尝试后提供延迟时间，而 `ConnectTimeout` 则提供了全局取消超时时间。\n\n让我们修改主 `Connect` 函数以使用新的结构体，并添加一个\
  \ `ConnectWithOptions` 调用以产生与 `Connect` 相同的结果：\n\n```\n 1 // Connect 连接到数据库并产生用于注入的句柄\n\
  \ 2 func Connect(ctx context.Context) (*sqlx.DB, error) {\n 3   options := ConnectionOptions{}\n\
  \ 4   options.Credentials.DSN = os.Getenv(\"DB_DSN\")\n 5   options.Credentials.Driver\
  \ = os.Getenv(\"DB_DRIVER\")\n 6   return ConnectWithOptions(ctx, options)\n 7 }\n\
  \ 8 \n 9 // ConnectWithOptions 根据 ConnectionOptions{} 连接到主机\n10 func ConnectWithOptions(ctx\
  \ context.Context, options ConnectionOptions) (*sqlx.DB, e\\\n11 rror) {\n 12  \
  \ credentials := options.Credentials\n 13   if credentials.DSN == \"\" {\n 14  \
  \   return nil, errors.New(\"DSN not provided\")\n 15   }\n 16   if credentials.Driver\
  \ == \"\" {\n 17     credentials.Driver = \"mysql\"\n 18   }\n 19   credentials.DSN\
  \ = cleanDSN(credentials.DSN)\n 20   if options.Connector != nil {\n 21     handle,\
  \ err := options.Connector(ctx, credentials)\n 22     if err == nil {\n 23     \
  \  return sqlx.NewDb(handle, credentials.Driver), nil\n 24     }\n 25     return\
  \ nil, errors.WithStack(err)\n 26   }\n 27   return sqlx.ConnectContext(ctx, credentials.Driver,\
  \ credentials.DSN)\n 28 }\n```\n\n注意变化：\n\n* 我们现在接收 `context.Context`，以便我们可以支持来自\
  \ `main()` 的取消 (`CTRL+C`)\n* DSN 验证已移动到 `ConnectWithOptions()`\n* 我们实现了包装 `*sql.DB`\
  \ 的连接器\n\n```diff\n--- a/stats/wire_gen.go\n+++ b/stats/wire_gen.go\n@@ -14,7 +14,7\
  \ @@\n import (\n-\n-\n- func Connect(ctx context.Context) (*sqlx.DB, error) {\n\
  ```\n\n匹配我们的 `Connect` 签名：\n\n## 数据库重试\n\n让我们带有我们的逻辑创建 `db/connector.go`：\n\n\n\n\
  \n```go\n 1   ctx := context.Background()\n 2 \n 3   switch config.real {\n 4  \
  \ case true:\n 5     handle, err := db.ConnectWithRetry(ctx, config.db)\n 6    \
  \ if err != nil {\n 7       log.Fatalf(\"Error connecting to database: %+v\", err)\n\
  \ 8     }\n 9     if err := db.Run(config.service, handle); err != nil {\n10   \
