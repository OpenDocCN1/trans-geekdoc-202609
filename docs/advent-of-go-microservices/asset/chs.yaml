  \ APM，可以检查记录了哪些类型的错误并开始修复服务。\n\nAPM 图表证实了错误率：\n\n![](img/apm3-1.png)\n\n错误标签页也提供了一些关于错误的见解：\n\
  \n![](img/apm3-2.png)\n\n### 解决检测到的错误\n\n`Error 1040: Too many connections` 在 MySQL\
  \ 端和 Go 端都可以调优。在 Go 端，我们有以下选项来调优 DB 实例上的 MySQL 使用情况：\n\n* `SetMaxOpenConns()` -\
  \ 设置服务将保持开启的最大连接数，\n* `SetMaxIdleConns()` - 设置任何时间可以开启的最空闲连接数，\n* `SetConnMaxLifetime()`\
  \ - 设置连接可以保持开启的时间\n\n所有这些选项都会调整我们的数据库使用情况。默认情况下，对开启的连接数没有限制。如果我们用 `SetMaxOpenConns`\
  \ 设置了限制，则必须释放连接以便重用。通常，你希望这个限制设高一些，因为如果连接池太小，你不希望在连接上等待过多。\n\n我们想要模拟应用程序的真实行为，以估计适用于我们情况的连接数。压力测试并不是真实行为，所以让我们盲目地将其设置为一个非常不合理的值。既然我们已经将压力测试的目标设为\
  \ 400 个连接，让我们在后端的 SQL 连接中将其翻倍。\n\n默认情况下，`SetMaxIdleConns` 只允许 2 个空闲连接，这意味着一旦客户端空闲，就会产生大量的抖动。我们不希望在空闲连接减少时将其丢弃，或者至少不要这么这么快，因此我们将此值设置为与\
  \ `SetMaxOpenConns` 相同。这并不意味着连接不会关闭（MySQL 也有相应的超时）。\n\n最后，`SetConnMaxLifetime` 默认未设置，这意味着任何开启且未被\
  \ `SetMaxIdleConns` 回收的连接都可以在此处设置的时间范围内重用。\n\n连接清理操作每秒运行一次，如果我们能保持连接开启更久，也将减少对清理的压力。这取决于你，但通常除非有良好的技术理由来设置最大收集寿命（例如在\
  \ MySQL 集群前面有一个 ProxySQL 负载均衡器），否则你可能不需要更改它。\n\n打开 `db/connect.go` 并替换 `ConnectWithOptions`：\n\
  \n```\n 1 // ConnectWithOptions connect to host based on ConnectionOptions{}\n 2\
  \ func ConnectWithOptions(ctx context.Context, options ConnectionOptions) (*sqlx.DB,\
  \ error) {\n 3   credentials := options.Credentials\n 4   if credentials.DSN ==\
  \ \"\" {\n 5     return nil, errors.New(\"DSN not provided\")\n 6   }\n 8   if credentials.Driver\
  \ == \"\" {\n 8     credentials.Driver = \"mysql\"\n10   }\n11   credentials.DSN\
  \ = cleanDSN(credentials.DSN)\n 12 \n13   connect := func() (*sqlx.DB, error) {\n\
  \ 14     if options.Connector != nil {\n 15       handle, err := options.Connector(ctx,\
  \ credentials)\n 16       if err == nil {\n 17         return sqlx.NewDb(handle,\
  \ credentials.Driver), nil\n 18       }\n 19       return nil, errors.WithStack(err)\n\
  \ 20     }\n 21     return sqlx.ConnectContext(ctx, credentials.Driver, credentials.DSN)\n\
  \ 22   }\n 23 \n 24   db, err := connect()\n 25   if err != nil {\n 26     return\
  \ nil, err\n 27   }\n 28   db.SetMaxOpenConns(800)\n 29   db.SetMaxIdleConns(800)\n\
  \ 30   return db, nil\n 31 }\n```\n\n让我们配置数据库具有 1000 个连接的限制。编辑 `docker-compose.yml`\
  \ 并更新数据库定义：\n\n```\n 1   db:\n 2     image: percona/percona-server:8.0.17\n 3  \
  \   command: [\n 4       \"--max_connections=1000\"\n 5     ]\n 6     environment:\n\
  \ 7       MYSQL_ALLOW_EMPTY_PASSWORD: \"true\"\n 8       MYSQL_USER: \"stats\"\n\
  \ 9       MYSQL_DATABASE: \"stats\"\n```\n\n使用 `make && docker up` 重建镜像，最后让我们运行基准测试：\n\
  \n```\n 1 Running 15s test @ http://172.22.0.5:3000/twirp/stats.StatsService/Push\n\
  \ 2   4 threads and 400 connections\n 3   Thread Stats   Avg      Stdev     Max\
  \   +/- Stdev\n 4     Latency   224.79ms  256.55ms   1.56s    88.49%\n...\n```\n\
