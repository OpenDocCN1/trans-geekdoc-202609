  \ 名称是为了设置生成的包名，同时也传递了所有的表信息。\n\n### 类型转换\n\n当我们谈论数据库列时，有两个类型列需要考虑：`data_type`，它持有原始类型；以及\
  \ `column_type`，它是包含了其限制条件的类型，例如长度，或者数值类型是带符号/无符号数字。后者对于区分 `int64` 和 `uint64` 非常重要。\n\
  \n我们可以将类型分为三个不同的需求：\n\n- 可以是带符号/无符号的数值类型（组合类型），\n- 可以直接翻译为 Go 的简单类型，\n- 需要导入包的特殊类型（`datetime`\
  \ -> `*time.Time`）\n\n每种类型的映射应该是简单的：\n\n```go\n 1 var numericTypes map[string]string\
  \ = map[string]string{\n 2   \"tinyint\":  \"int8\",\n 3   \"smallint\": \"int16\"\
  ,\n 4   // `mediumint` - 这在技术上应该是 int24 (3 字节)，但\n 5   \"mediumint\": \"int32\"\
  ,\n 6   \"int\":       \"int32\",\n 7   \"bigint\":    \"int64\",\n 8 }\n 9 \n10\
  \ func isNumeric(column *Column) (string, bool) {\n 11   val, ok := numericTypes[column.DataType]\n\
  \ 12   return val, ok\n 13 }\n```\n\n所有的数值类型都有一个特征：无符号值会在带符号映射类型前面加一个 `u`。这样，一个无符号的\
  \ `int32` 就会变成 `uint32`。\n\n```go\n 1 var simpleTypes map[string]string = map[string]string{\n\
  \ 2   \"char\":       \"string\",\n 3   \"varchar\":    \"string\",\n 4   \"text\"\
  :       \"string\",\n 5   \"longtext\":   \"string\",\n 6   \"mediumtext\": \"string\"\
  ,\n 7   \"tinytext\":   \"string\",\n 8   \"longblob\":   \"[]byte\",\n 9   \"blob\"\
  :       \"[]byte\",\n10   \"varbinary\":  \"[]byte\",\n 11   // `float` 和 `double`\
  \ 在这里是因为它们没有无符号修饰符\n 12   \"float\":  \"float32\",\n 13   \"double\": \"float64\"\
  ,\n 14   // `decimal` - double 存储为字符串，\\o/\n 15   \"decimal\": \"string\",\n 16\
  \ }\n 17  \n18 func isSimple(column *Column) (string, bool) {\n 19   val, ok :=\
  \ simpleTypes[column.DataType]\n 20   return val, ok\n 21 }\n```\n\n简单类型像数值类型一样，返回\
  \ 1-1 的类型映射。由于这些值不是带符号/无符号的，返回的映射类型将保持原样。\n\n```go\n 1 type specialType struct {\n\
  \ 2   Import string\n 3   Type   string\n 4 }\n 5 \n 6 var specialTypes map[string]specialType\
  \ = map[string]specialType{\n 7   \"date\":      specialType{\"time\", \"*time.Time\"\
  },\n 8   \"datetime\":  specialType{\"time\", \"*time.Time\"},\n 9   \"time\": \
  \     specialType{\"time\", \"*time.Time\"},\n 10   \"timestamp\": specialType{\"\
  time\", \"*time.Time\"},\n 11   // `enum` 和 `set` 尚未实现\n 12   // `year` 尚未实现\n 13\
  \ }\n 14 \n 15 func isSpecial(column *Column) (specialType, bool) {\n 16   val,\
  \ ok := specialTypes[column.DataType]\n 17   return val, ok\n 18 }\n```\n\n特殊类型稍微复杂一点，因为它们还提供了导入。我们涵盖了内置的日期/时间字段，但我们还有其他目前被省略的字段。MySQL\
  \ 有 `JSON` 字段类型，为此我们必须导入 `github.com/jmoiron/sqlx/types` 并使用 `types.JSONText` 才能使其可用。那里还有其他类型，如\
  \ `GzippedText` 以及 `BIT(1)` 类型的实现，它可以将值扫描到 `bool` 字段中。我们不会在我们的用例中实现这些，但示例仅仅说明了需求增长得有多快。\n\
  \n由于一个 schema 可能有许多导入包的类型，我们需要保持这些包的唯一性：\n\n```go\n1 func contains(set []string,\
  \ value string) bool {\n 2   for _, v := range set {\n 3     if v == value {\n 4\
  \       return true\n 5     }\n 6   }\n 7   return false\n 8 }\n```\n\n`contains()`\
  \ 辅助函数通过提供检查导入是否已经添加的方法来帮助我们。这让我们只剩下生成相关 Go 代码的实际函数：\n\n\n\n\n最后，对于每个表，我们收集表字段、主键字段，并打印出相关的\
  \ Go 结构体和函数以支持它们。生成 `Fields` 和 `PrimaryFields` 函数的一个很大目的是为了避免反射（reflection）。如果使用类似\
  \ `select * from [table]...` 风格的 SQL 查询，添加新字段的迁移可能会破坏服务。新添加的字段将导致查询执行时发生错误。通过显式选择字段，我们可以避免这种情况。\n\
  \n事实上，将 `Fields` 和 `PrimaryFields` 保留在结构上的函数用处不大，因此我们将立即修改此处，生成一个公开的、带有服务命名前缀的变量。\n\
  \n```go\n 1 fmt.Printf(\"var %sFields = \", camel(table.Name))\n 2 if len(fields)\
  \ > 0 {\n 3   fmt.Printf(\"[]string{\\\"%s\\\"}\", strings.Join(fields, \"\\\",\
  \ \\\"\"))\n 4 } else {\n 5   fmt.Printf(\"[]string{}\")\n 6 }\n 7 fmt.Println()\n\
  \ 8 fmt.Printf(\"var %sPrimaryFields = \", camel(table.Name))\n 9 if len(primary)\
  \ > 0 {\n10   fmt.Printf(\"[]string{\\\"%s\\\"}\", strings.Join(primary, \"\\\"\
  , \\\"\"))\n11 } else {\n12   fmt.Printf(\"[]string{}\")\n13 }\n14 fmt.Println()\n\
  ```\n\n此时我们要做的唯一工作就是运行并验证生成的代码。\n\n```go\n 1 package stats\n 2 \n 3 type Migrations\
  \ struct {\n 4   // 微服务或项目名称\n 5   Project string `db:\"project\"`\n 6 \n 7   //\
  \ yyyy-mm-dd-HHMMSS.sql\n 8   Filename string `db:\"filename\"`\n 9 \n10   // 来自\
  \ SQL 文件的语句编号\n11   StatementIndex int32 `db:\"statement_index\"`\n 12 \n13   //\
  \ ok 或完整的错误信息\n14   Status string `db:\"status\"`\n 15 }\n 16 \n17 var MigrationsFields\
  \ = []string{\"project\", \"filename\", \"statement_index\", \"status\"}\n18 var\
  \ MigrationsPrimaryFields = []string{\"project\", \"filename\"}\n```\n\n这正是我们想要的。我们生成了完整的\
  \ Go 结构体，包含了所有所需的元数据，以支持我们的 Go 开发工作流。注释是从数据库架构生成的，因此我们随时可以获取这些信息——无论 DBA 在他们喜欢的编辑器中管理数据库架构，还是开发者在阅读\
  \ Go 结构体定义或内部 godoc 页面。文档的可访问性已内置于我们的流程中。\n\n现在剩下的工作是将生成器包含到 Makefile 中，位于 `migrate.%:`\
  \ 目标下：\n\n```bash\n1 ./build/db-schema-cli-linux-amd64 -schema $(SERVICE) -db-dsn\
  \ \"root:$(MYSQL_ROOT_PASS\\\n2 WORD)@tcp(mysql-test:3306)/$(SERVICE)\" > server/$(SERVICE)/types_db.go\n\
  ```\n\n现在，我们有一些需要考虑的特定需求，我们通过在正在创建的服务下生成 `types_db.go` 来解决这些问题。让我们考虑一下全局类型包会有什么问题：\n\
  \n- 我们可能会遇到表名冲突（例如：多个服务中都存在 `log` 表），\n- 在结构体前缀加上服务名前缀会引入冗余（stutter，`stats.stats_log`\
  \ 变成 `StatsStatsLog`），\n- 我们在服务实现中只需要数据库结构。我们只需要将它们转换为 PB。\n\n在某些情况下，数据库和 PB 结构之间的可能映射可能是\
  \ 1-1 的，但我们可能会为 PB 使用不同的类型（JavaScript 客户端无法无法处理 `uint64` 类型，因此它们必须是字符串），而且我们总会有数据库中可用的数据，这些数据绝不能公开暴露（JSON?）。\n\
  \n事实上，我曾考虑过给所有字段添加 `json:\"-\"` 标签，看看这能带我去多远。这真的不是个坏主意，所以……\n\n```diff\n 1 --- a/cmd/db-schema-cli/render-go.go\n\
  \ 2 ++++ b/cmd/db-schema-cli/render-go.go\n 3 @@ -128,7 +128,7 @@ func renderGo(schema\
  \ string, tables []*Table) error {\n 4                                 fmt.Printf(\"\
  \    // %s\\n\", column.Comment)\n 5                         }\n 6             \
  \            columnType, _ := resolveType(column)\n 7 -                       fmt.Printf(\"\
  \    %s %s `db:\\\"%s\\\"\\n\", camel(column.Name), co\\\n 8 lumnType, column.Name)\n\
