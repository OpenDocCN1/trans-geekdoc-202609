    \ `master` 版本的 `sqlx`。\n\n### 基准测试\n\n由于我们有了之前的实现的测试，让我们对比一下队列对服务提高了多少：\n\n```\n\
    1 Running 1m test @ http://172.29.0.2:3000/twirp/stats.StatsService/Push\n2  \
