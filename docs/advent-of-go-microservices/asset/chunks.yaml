  trans: "\n\n```\n1 ...\n2 [migrations:17] ./build/db-schema-cli-linux-amd64 -schema\
    \ stats -db-dsn \"root:defaul\\\n3 t@tcp(mysql-test:3306)/stats\" -format go -output\
    \ server/stats\n4 [migrations:18] server/stats/types_db.go\n5 [migrations:19]\
    \ ./build/db-schema-cli-linux-amd64 -schema stats -db-dsn \"root:defaul\\\n6 t@tcp(mysql-test:3306)/stats\"\
    \ -format markdown -output docs/schema/stats\n7 [migrations:20] docs/schema/stats/migrations.md\n\
    8 [migrations:21] OK.\n9 ...\n```\n\n我们可以检查输出来验证其对齐是否正确：\n\n```\n1 # migrations\n\
    2 \n3 | Name            | Type         | Key | Comment                       \
    \ |\n4 |-----------------|--------------|-----|--------------------------------|\n\
    5 | project         | varchar(16)  | PRI | Microservice or project name   |\n\
    6 | filename        | varchar(255) | PRI | yyyy-mm-dd-HHMMSS.sql          |\n\
    7 | statement_index | int(11)      |     | Statement number from SQL file |\n\
    8 | status          | text         |     | ok or full error message       |\n\
    ```\n\n### 关于数据库迁移的注意事项（Caveat emptor）\n\n我们现在拥有一套系统，可以：\n\n* 通过 Drone CI 集成测试测试\
    \ SQL 迁移，\n* 根据 schema 中的 SQL 表生成结构体，\n* 为 SQL 表生成文档片段\n\n\n\n通过这种方式进行服务开发，我们能够使用诸如\
    \ [MySQL workbench](https://www.mysql.com/products/workbench/) 等特定数据库的工具来创建 SQL\
    \ schema 和迁移，同时保持所用数据结构的“单一事实来源”。\n\nSQL schema 可以通过迁移进行更新，且 Drone CI 步骤将确保 Go\
    \ 结构体也得到更新。如果某个字段被重命名，这将是一个破坏性变更（breaking change），你需要手动重命名正在使用的 Go 字段名。由于我们没有使用数据库结构进行\
    \ JSON 编码，我们至少可以确保，关于字段命名的任何破坏性变更都不会影响到你的终端用户。\n\n独立于服务运行迁移最显著的警告是：服务中的破坏性变更需要以协调的方式进行部署。SQL\
    \ 迁移会破坏已部署的服务，而在新版本的服务运行之前会有一段时间的时间。这是分布式系统中固有的问题。\n\n如果这对你来说是一个特别的痛点（本也应该是），你应该以非破坏性的方式执行数据库迁移。例如，安全地重命名一个字段可能意味着：\n\
    \n1. 迁移：添加一个新字段，\n2. 服务：同时向新旧字段写入数据，\n3. 迁移：`UPDATE table set new_field=old_field;`，\n\
    4. 服务：停止对旧字段的写入/引用，\n5. 迁移：从表中删除旧字段\n\n这个过程并不容易自动化，但它说明了为什么在生产服务部署中，最好有一个 DBA\
    \ 协助。将服务和迁移耦合在一起会带来其他问题，例如长时间的迁移步骤以及并发问题，因为你的服务可能部署在许多副本和主机上。\n\n受控的升级通常是人类完成的任务，尽管我们希望实现这种自动化，但会有各种技术状况限制你何时何时可以执行\
    \ schema 迁移或重新部署服务，特别是在分布式系统中。\n\n## Go：使用 Wire 进行依赖注入\n\n我们的微服务最终至少一个数据库连接，以便在\
    \ MySQL 数据库中查询和存储数据。我们需要将此对象（可能从 `main()` 函数）传递给我们的服务实现。\n\n### Go 之道\n\n通过试错，我了解到“依赖注入”（Dependency\
    \ Injection）这个术语能够引起 Gopher 强烈的情绪反应。正如我之前所说的，这个术语在 Go 中代表的仅仅是“一种向我们的处理器传递内容的方法”，而对于熟悉其他编程语言该概念的人来说，它意味着许多不同的含义。\n\
    \n最平凡的依赖注入方式是在我们的服务器构造函数中声明函数参数。例如，如果我们需要 `*sqlx.DB`，我们会声明这样的构造函数：\n\n```\n1 func\
    \ New(ctx context.Context, db *sqlx.DB) {\n2   ...\n3 }\n```\n\n将由调用者实现正确的参数列表，以填充构造函数所需的依赖项。在处理像我们现在这样的大规模\
    \ RPC 脚手架项目时，我们面临着这种方法的几个陷阱。\n\n我们服务的 proto 文件定义没有提供任何方法来设置服务所需的依赖列表。显然，proto\
    \ 文件中的 service 块仅声明了我们 RPC 的接口，但它完全没有标准方法来引用 Go 结构体（如 `*sqlx.DB`）。\n\n而可能的第二个陷阱是，随着每个服务和自定义服务依赖的增加，代码生成器将变得指数级地复杂。虽然我们可以假设一个服务使用单个数据库连接，但我们无法真正知道任何特定服务的依赖会有多么独特。\n\
    \n理想情况下，我们需要一种方法，可以添加新的依赖项，而不需要重构已编写的每个服务，以保持某种一致的 Go API 理念。\n\n### 运行时 vs 编译时\n\
    \n除了向构造函数传递参数的标准 Go 方式外，现实中还有两种依赖注入模式。每种模式都有一组约束，这些约束基本上归结为它们对问题检测的影响。\n\n运行时依赖注入如\
    \ [codegangsta/inject](https://github.com/codegangsta/inject）依赖于使用来自 `reflect`\
    \ 包来检查对象或函数。例如，注入看起来如下：\n\n```\n1 injector := inject.New()\n2 injector.Map(context.TODO())\
    \ // 字面量类型\n3 injector.Map(func() *sqlx.DB { return new(sqlx.DB) }) // 对象工厂\n\
    4 injector.Invoke(server.New)\n```\n\n这种想法是，你声明一个持有具体值或返回所需类型函数的对象，然后通过反射确定哪些值应该传递给\
    \ `server.New`，隐藏在 `injector.Invoke()` 之后。\n\n显然这存在一些问题，例如错误处理（数据库连接可能会产生超时错误，我们在这里无法处理，因此只能诉诸调用\
    \ panic），以及当特定类型没有定义值或构造时，最终会导致运行时错误。\n\n当以此方式使用反射时，运行时错误是不受欢迎的副作用。应用程序的结构没有任何类型提示可以告诉\
    \ Go 编译器依赖项未满足，因此危险错误可能由于这种原因泄露到生产环境中。\n\nGoogle 也意识到了这个问题，并据此设计了自己的 DI 框架 [google/wire](https://github.com/google/wire)。该项目的意图是提供编译时依赖注入，当依赖项在构建时未声明或提供时可以报错。\n\
    \n### Wire 和依赖提供者\n\nWire 依赖代码生成和反射来分析源代码，并生成注入代码，这些代码与你编写以填充服务所需依赖项的代码相等。\n\n\
    Wire 引入的概念被称为：\n\n* 注入器（Injector）——向你的对象引入依赖的代码，\n* 提供者（Provider）——提供特定类型实例的代码\n\
    \n"
