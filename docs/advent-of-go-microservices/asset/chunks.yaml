- raw: "If we implement multiple background jobs, the microservice Shutdown() function\
    \ will be just a proxy for individual background jobs shutdowns. If we don’t,\
    \ it may be just spagetti code, which is already a smell of shared responsibility.\n\
    \nIf we implement the background jobs on the same level as the Server{}, we wouldn’t\
    \ need to re-specify dependencies for each job. That might seem like a good idea\
    \ until you realize that it again blurs the boundary between what the microservice\
    \ needs, and what the particular background job needs. If we learned anything,\
    \ we learned that we need to favour explicit declarations over implicit scope.\
    \ This way it will be clear what particularly is needed by background jobs.\n\n\
    As we would only be adding a level of indirection with Init, and blurring the\
    \ various responsibilities and dependencies between the background job and the\
    \ microservice API, let’s remove Init() and implement our background job with\
    \ the single responsibility principle in mind.\n\nAs we make this decision, we\
    \ also realize that replacing the implementation of the background job in this\
    \ case is trivial - we only need to satisfy whatever interface we create for the\
    \ background job API. If this was merged with Server{}, it would, at best, be\
    \ problematic to isolate and refactor at some later point.\n\nRemove `Init` from\
    \ our generators, and let’s create a background job.\n\n### The background job\n\
    \nIt’s good to follow some naming conventions here, to ensure that our background\
    \ job is designed with a single responsibility in mind. With that, I quote [Effective\
    \ Go - Interface names](https://golang.org/doc/effective_go.html#interface-names):\n\
    \nWe are not creating a generic interface, but as the struct has a specific utility\
    \ here, we can resort to the same naming convention for our struct. We will create\
    \ a `Flusher`.\n\nUnder `server/stats/` create `flusher.go`:\n\n```\n 1 package\
    \ stats\n 2 \n 3 import (\n 4   \"context\"\n 5   \"log\"\n 6   \"time\"\n 7 \n\
    \ 8   \"github.com/jmoiron/sqlx\"\n 9   \"go.uber.org/atomic\"\n10 )\n```\n\n\
    We’re importing [go.uber.org/atomic](https://godoc.org/go.uber.org/atomic) for\
    \ their wrappers around stdlib `sync/atomic`. They provide wrapped data types\
    \ that make it easier to work with values in a thread-safe way.\n\n```\n1 // Flusher\
    \ is a context-driven background data flush job\n2 type Flusher struct {\n3  \
    \ context.Context\n4   finish func()\n5 \n6   enabled *atomic.Bool\n7 \n8   db\
    \ *sqlx.DB\n9 }\n```\n\nOur Flusher{} struct embeds `context.Context` so we don’t\
    \ need to write our own Shutdown function, but can invoke `<-flusher.Done()` to\
    \ wait for it to gracefully finish. This is a local cancellation context.\n\n\
    ```\n 1 // NewFlusher creates a *Flusher\n 2 func NewFlusher(ctx context.Context,\
    \ db *sqlx.DB) (*Flusher, error) {\n 3   job := &Flusher{\n 4     db:      db,\n\
    \ 5     enabled: atomic.NewBool(true),\n 6   }\n 7   job.Context, job.finish =\
    \ context.WithCancel(context.Background())\n 8   go job.run(ctx)\n 9   return\
    \ job, nil\n10 }\n```\n\nWhen creating the flusher, we set the dependencies, enable\
    \ pushing data into the flusher (enabled=true), and set the cancellation context.\n\
    \n```\n 1 func (job *Flusher) run(ctx context.Context) {\n 2   log.Println(\"\
    Started background job\")\n 3 \n 4   defer job.finish()\n 5 \n 6   ticker := time.NewTicker(time.Second)\n\
    \ 7 \n 8   for {\n 9     select {\n10     case <-ticker.C:\n11       job.flush()\n\
    12       continue\n13     case <-ctx.Done():\n14       log.Println(\"Got cancel\"\
    )\n15       job.enabled.Store(false)\n16       job.flush()\n17     }\n18     break\n\
    19   }\n20 \n21   log.Println(\"Exiting Run\")\n22 }\n```\n\nThe background job\
    \ itself listens to the global context cancellation (ctx.Done), and when received\
    \ disables pushing new data to the internal queue. We also create a ticker to\
    \ run our flush job once a second, and use `defer` to invoke context cancellation\
    \ as soon as we exit from the function.\n\n```\n1 func (job *Flusher) flush()\
    \ {\n2   log.Println(\"Background flush\")\n3 }\n```\n\nAt this point, our flusher\
    \ is a no-op, and we just print something to the log, to see that everything is\
    \ working as it should. Let’s adjust `server.go` to include flusher as a dependency,\
    \ and create our Shutdown function:\n\n```\n 1 // Server implements stats.StatsService\n\
    \ 2 type Server struct {\n 3   db *sqlx.DB\n 4 \n 5   sonyflake *sonyflake.Sonyflake\n\
    \ 6   flusher   *Flusher\n 7 }\n 8 \n 9 // Shutdown is a cleanup hook after SIGTERM\n\
    10 func (s *Server) Shutdown() {\n11   <-s.flusher.Done()\n12 }\n```\n\nAll we\
    \ need to do now is some housekeeping.\n\n### Housekeeping\n\nWe need to add `NewFlusher`\
    \ to wire.go as a `wire.Inject` parameter. In order to modify `wire.go` which\
    \ is auto generated, we need to modify our Makefile and create a conditional generator\
    \ script (fix under `templates.%` target):\n\n```\n1 -       @envsubst < templates/server_wire.go.tpl\
    \ > server/$(SERVICE)/wire.go\n2 -       @echo \"~ server/$(SERVICE)/wire.go\"\
    \n3 +       @./templates/server_wire.go.sh\n```\n\nAnd we create `templates/server_wire.go.sh`\
    \ and set it as executable:\n\n```\n 1 #!/bin/bash\n 2 cd $(dirname $(dirname\
    \ $(readlink -f $0)))\n 3 \n 4 if [ -z \"${SERVICE}\" ]; then\n 5   echo \"Usage:\
    \ SERVICE=[name] MODULE=... $0\"\n 6   exit 255\n 7 fi\n 8 \n 9 OUTPUT=\"server/${SERVICE}/wire.go\"\
    \n10 \n11 if [ ! -f \"$OUTPUT\" ]; then\n12   envsubst < templates/server_wire.go.tpl\
    \ > $OUTPUT\n13   echo \"~ $OUTPUT\"\n14 fi\n```\n\nWith these changes, wire.go\
    \ will only be written if it doesn’t exist. This means we can now add `NewFlusher`\
    \ to wire.go for our stats service.\n\n### Verifying everything works\n\nAs you\
    \ should already be used to by now, run:\n\n*   `make`,\n\n*   `make docker`,\n\
    \n*   `docker-compose up -d`\n\nThis will build everything and restart your stats\
    \ container locally. To inspect if everything works, issue `docker-compose stop\
    \ stats` and `docker-compose logs stats` after some time.\n\n```\n1 stats_1  |\
    \ 2020/01/04 23:20:13 Started background job\n2 stats_1  | 2020/01/04 23:20:14\
    \ Background flush\n3 stats_1  | 2020/01/04 23:20:15 Background flush\n4 stats_1\
    \  | 2020/01/04 23:20:16 Background flush\n5 stats_1  | 2020/01/04 23:20:17 Background\
    \ flush\n6 stats_1  | 2020/01/04 23:20:18 Got cancel\n7 stats_1  | 2020/01/04\
    \ 23:20:18 Background flush\n8 stats_1  | 2020/01/04 23:20:18 Exiting Run\n9 stats_1\
    \  | 2020/01/04 23:20:18 Done.\n```\n\nWe now created a background job runner\
    \ which we can access from our API implementation. This means that we can queue\
    \ up data in the RAM and flush it from a background worker, bringing our API edge\
    \ latency down.\n\n## Go: Optimizing requests with a queue\n\nWith our background\
    \ jobs interface in place, we can create an API that will queue our incoming data\
    \ and flush it to the database at a defined frequency. Flushing our data in bulk\
    \ will give us performance advantages.\n\n### The Queue\n\nA basic Queue in Go\
    \ is a slice. To extend the queue, you can call `append`, which allocates a larger\
    \ slice if required. Since this is not thread safe, we need to use locking to\
    \ ensure that the queue is modified safely.\n\n```\n 1 // Queue provides a queuing\
    \ structure for Incoming{}\n 2 type Queue struct {\n 3   sync.RWMutex\n 4   values\
    \ []*Incoming\n 5 }\n 6 \n 7 // NewQueue creates a new *Queue instance\n 8 func\
    \ NewQueue() *Queue {\n 9   return &Queue{\n10     values: make([]*Incoming, 0),\n\
    11   }\n12 }\n```\n\nWe also need to hold several Queues to split up incoming\
    \ write requests. If we only used one queue, we would have high lock contention\
    \ between all the clients trying to write to the queue, as well as delays because\
    \ of the flusher which needs to clear out the queue as it’s written to the database.\n\
    \n```\n1 // NewQueues creates a slice of *Queue instances\n2 func NewQueues(size\
    \ int) []*Queue {\n3   result := make([]*Queue, size)\n4   for i := 0; i < size;\
    \ i++ {\n5     result[i] = NewQueue()\n6   }\n7   return result\n8 }\n```\n\n\
    The queue needs a few functions, in order to write and flush data from the queue:\n\
    \n*   `Push(*Incoming) error` - add a new item to the queue, return error if any,\n\
    \n*   `Clear() []*Incoming` - return the current items in the queue and clear\
    \ it,"
