    \ & job.queueMask\n5     return job.queues[index].Push(item)\n6   }\n7   return\
    \ err\n8 }\n```\n\n我们使用原子值 `queueIndex` 来指定新项写入哪个队列。如果 flusher 未启用，我们在关闭时返回一个错误。客户端可以重试。这处理了我们的生产者。\n\
    \n### 消费者\n\n我们只需要替换 `flush()` 函数来实现队列消费者：\n\n```\n1 func (job *Flusher) flush()\
    \ {\n2   var err error\n3 \n4   fields := strings.Join(IncomingFields, \",\")\n\
    5   named := \":\" + strings.Join(IncomingFields, \"::\")\n6   query := fmt.Sprintf(\"\
    insert into %s (%s) values (%s)\", IncomingTable, fields, named)\n7 \n8   var\
    \ batchInsertSize int\n9   for k, queue := range job.queues {\n10     rows :=\
    \ queue.Clear()\n11 \n12     for len(rows) > 0 {\n13       batchInsertSize = 1000\n\
    14       if len(rows) < batchInsertSize {\n15         batchInsertSize = len(rows)\n\
    16       }\n17       log.Println(\"[flush] queue\", k, \"remaining\", len(rows))\n\
    18       if _, err = job.db.NamedExec(query, rows[:batchInsertSize]); err != nil\
    \ {\n19         log.Println(\"Error flushing data:\", err)\n20       }\n21   \
    \    rows = rows[batchInsertSize:]\n22     }\n23   }\n24 \n25   log.Println(\"\
    [flush] done\")\n26 }\n```\n\n由于我们使用了 `jmoiron/sqlx`，通过提供一个值的切片就有向数据库执行批量插入的能力。实现顺序如下：\n\
    \n1.  准备插入数据的查询。\n2.  读取并清空所有队列的项。\n3.  将读取的项批量数据库，每次 1000 行。\n\n如果在此处遇到问题，尝试执行\
