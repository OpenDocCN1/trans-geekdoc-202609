- raw: "*   `Length() int` - report the current queued item count\n\nThe Push function\
    \ should return an error when the queue is full. It is up to you to limit the\
    \ queue size, so that your application doesn’t eat up all your memory in case\
    \ of traffic spikes or a delay in flushing the data to the database.\n\nThere\
    \ is no reasonable limit here, so it’s up to you to implement this.\n\n```\n1\
    \ // Push adds a new item to the queue\n2 func (p *Queue) Push(item *Incoming)\
    \ error {\n3   p.Lock()\n4   defer p.Unlock()\n5   p.values = append(p.values,\
    \ item)\n6   return nil\n7 }\n```\n\nFlushing the queue to the database requires\
    \ us to read the current items of the queue, and clear them for any future calls\
    \ to Push(). The current implementation keeps memory usage low, but allocates\
    \ memory when values are pushed to the queue.\n\n```\n 1 // Clear returns current\
    \ queue items and clears it\n 2 func (p *Queue) Clear() (result []*Incoming) {\n\
    \ 3   length := p.Length()\n 4 \n 5   p.Lock()\n 6   defer p.Unlock()\n 7 \n 8\
    \   result, p.values = p.values[:length], p.values[length:]\n 9   return\n10 }\n\
    ```\n\nAnd finally - an utility function to get the size of the queue:\n\n```\n\
    1 // Length returns the current queue size\n2 func (p *Queue) Length() int {\n\
    3   p.RLock()\n4   defer p.RUnlock()\n5   return len(p.values)\n6 }\n```\n\nIn\
    \ order for a queue to be functional it needs two additional things:\n\n1.  the\
    \ producer: writing data to the queue,\n\n2.  the consumer: reading data from\
    \ the queue\n\n### The Producer\n\nOur producer is easy to implement, we can just\
    \ modify our service Push() function:\n\n```\n1 -       fields := strings.Join(IncomingFields,\
    \ \",\")\n2 -       named := \":\" + strings.Join(IncomingFields, \",:\")\n3 -\n\
    4 -       query := fmt.Sprintf(\"insert into %s (%s) values (%s)\", IncomingTable,\
    \ field\\\n5 s, named)\n6 -       _, err = svc.db.NamedExecContext(ctx, query,\
    \ row)\n7 -       return new(stats.PushResponse), err\n8 +       return pushResponseDefault,\
    \ svc.flusher.Push(row)\n```\n\nBasically, instead of calling the database query\
    \ directly, we now call `svc.flusher.Push(*Incoming)`, which returns a possible\
    \ error in case the request couldn’t be queued up.\n\nA small change to make our\
    \ API a bit more optimal is replacing `new(stats.PushResponse)` with a pre-allocated\
    \ variable. Put the following snippet just before the Push function in `server_push.go`:\n\
    \n```\n1 // Keep returning a single object to avoid allocations\n2 var pushResponseDefault\
    \ = new(stats.PushResponse)\n```\n\nWhen implementing the producer in our `Flusher`\
    \ struct, we need some additional fields:\n\n```\n1   // queueIndex is a key for\
    \ []queues\n2   queueIndex *atomic.Uint32\n3   // queueMask is a masking value\
    \ for queueIndex -> key\n4   queueMask uint32\n5   // queues hold a set of writable\
    \ queues\n6   queues []*Queue\n```\n\nGo provides the [sync/atomic](https://godoc.org/sync/atomic)\
    \ package in the standard library, which provides atomic operations over some\
    \ numeric types and pointers. However, we will use the [go.uber.org/atomic](https://godoc.org/go.uber.org/atomic)\
    \ package that provides convenience types wrapped around the standard library.\n\
    \nWe need to update `NewFlusher` in order to initialize the new fields:\n\n```\n\
    \ 1 func NewFlusher(ctx context.Context, db *sqlx.DB) (*Flusher, error) {\n 2\
    \   queueSize := 1 << 4\n 3   job := &Flusher{\n 4     db:         db,\n 5   \
    \  enabled:    atomic.NewBool(true),\n 6     queueIndex: atomic.NewUint32(0),\n\
    \ 7     queueMask:  uint32(queueSize - 1),\n 8     queues:     NewQueues(queueSize),\n\
    \ 9   }\n10 ...\n```\n\nWe set the `queueSize` to be a power of 2 value - we are\
    \ shifting the value 1 left by 4 bits, meaning that `1 << 4` is the same as writing\
    \ `16` (binary `10000`). If you wanted a larger queue, you’d shift by a larger\
    \ number of bits.\n\nThe `queueMask` is the binary masking value - for a queueSize=16,\
    \ this evaluates to binary `1111`. We can use the queueMask over any uint32 value\
    \ to get only the lower 4 bits of that value.\n\nThis is an optimisation for speed.\
    \ If your queue size would be 100, you’d have to use the modulo (`%100`) operator\
    \ to give you the remainder of the division against this number. We could have\
    \ used `%16`, but if we use the binary AND `&` with `&15`, this operation will\
    \ be slightly faster.\n\nWe can now write the following Push() function to take\
    \ new `*Incoming` values:\n\n```\n1 // Push spreads queue writes evenly across\
    \ all queues\n2 func (job *Flusher) Push(item *Incoming) error {\n3   if job.enabled.Load()\
    \ {\n4     index := job.queueIndex.Inc() & job.queueMask\n5     return job.queues[index].Push(item)\n\
    6   }\n7   return errFlusherDisabled\n8 }\n```\n\nWe are using the atomic `queueIndex`\
    \ value to designate into which queue the new item should be written. If the flusher\
    \ isn’t enabled, we return an expected error - we are disabling Push when we are\
    \ shutting down the process. The client(s) may retry on this error.\n\nThis takes\
    \ care of writing our producer.\n\n### The Consumer\n\nWe only need to replace\
    \ the `flush()` function in order to implement our queue consumer:\n\n```\n 1\
    \ func (job *Flusher) flush() {\n 2   var err error\n 3 \n 4   fields := strings.Join(IncomingFields,\
    \ \",\")\n 5   named := \":\" + strings.Join(IncomingFields, \",:\")\n 6   query\
    \ := fmt.Sprintf(\"insert into %s (%s) values (%s)\", IncomingTable, fields, nam\\\
    \n 7 ed)\n 8 \n 9   var batchInsertSize int\n10   for k, queue := range job.queues\
    \ {\n11     rows := queue.Clear()\n12 \n13     for len(rows) > 0 {\n14       batchInsertSize\
    \ = 1000\n15       if len(rows) < batchInsertSize {\n16         batchInsertSize\
    \ = len(rows)\n17       }\n18       log.Println(\"[flush] queue\", k, \"remaining\"\
    , len(rows))\n19       if _, err = job.db.NamedExec(query, rows[:batchInsertSize]);\
    \ err != nil {\n20         log.Println(\"Error when flushing data:\", err)\n21\
    \       }\n22       rows = rows[batchInsertSize:]\n23     }\n24   }\n25 \n26 \
    \  log.Println(\"[flush] done\")\n27 }\n```\n\nAs we are using [jmoiron/sqlx](https://github.com/jmoiron/sqlx),\
    \ we have the capability to issue bulk inserts to the database, just by providing\
    \ a slice of values for insertion. In order of implementation:\n\n1.  we prepare\
    \ a query for inserting our data,\n\n2.  we read and clear individual queues of\
    \ all items,\n\n3.  we flush the read items to the database, 1000 rows at a time\n\
    \nIn case you have issues with this, try issuing `go get github.com/jmoiron/sqlx@master`\
    \ to pull in the latest version of sqlx into your project. Bulk inserts have been\
    \ implemented only recently, and you might have to use the `master` version of\
    \ sqlx.\n\n### Benchmarking\n\nSince we already have the tests set up from the\
    \ previous implementation, let’s compare how much the service is improved with\
    \ the queuing:\n\n```\n1 Running 1m test @ http://172.29.0.2:3000/twirp/stats.StatsService/Push\n\
    2   4 threads and 100 connections\n3   Thread Stats   Avg      Stdev     Max \
    \  +/- Stdev\n4     Latency    12.54ms   21.19ms 416.79ms   91.30%\n5     Req/Sec\
    \     3.80k     1.63k   11.03k    63.05%\n6   909154 requests in 1.00m, 94.51MB\
    \ read\n7 Requests/sec:  15129.35\n8 Transfer/sec:      1.57MB\n```\n\nAnd the\
    \ previous version without queuing:\n\n```\n1 Running 1m test @ http://172.22.0.5:3000/twirp/stats.StatsService/Push\n\
    2   4 threads and 100 connections\n3   Thread Stats   Avg      Stdev     Max \
    \  +/- Stdev\n4     Latency    47.69ms   11.86ms 143.28ms   73.10%\n5     Req/Sec\
    \   527.04     85.10   800.00     73.25%\n6   125930 requests in 1.00m, 13.09MB\
    \ read\n7 Requests/sec:   2097.16\n8 Transfer/sec:    223.23KB\n```\n\nLet’s also\
    \ verify that our data is written:\n\n```\n1 mysql> select count(*) from incoming;\n\
    2 +----------+\n3 | count(*) |\n4 +----------+\n5 |   909251 |\n6 +----------+\n\
    7 1 row in set (0.06 sec)\n```\n\nThe small discrepancy in requests may be explained\
    \ by wrk closing the connection(s) before they could recieve the final response,\
    \ but the request was logged in the database.\n\nSo, by queuing our incoming data\
    \ in memory, we reduced our average latency by about 74%. Our throughput in requests/sec\
    \ increased from 100% to 721% (7.2x!).\n\n### Notes and pitfalls\n\nThe flush\
    \ process takes it’s own time when being slammed with benchmark requests:"
