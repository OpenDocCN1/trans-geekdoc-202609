- raw: "After signing up, creating a Linux instance with a running Docker engine is\
    \ simple, and only takes a few clicks. There’s this nice green button on the top\
    \ header of the page, where it says “Create Droplet”. Click it, and on the page\
    \ it opens, navigate to “One-click apps” where you choose a “Docker” from the\
    \ list.\n\n![Choose Docker from “One-click apps”](images/intro_do_1.png)\n\nChoose\
    \ Docker from “One-click apps”\n\nRunning docker can be disk-usage intensive.\
    \ Some docker images may “weigh” up to or more than 1 GB. I would definitely advise\
    \ choosing an instance with *at least* 30GB of disk space, which is a bargain\
    \ for $10 a month, but you will have to keep an eye out for disk usage. It’s been\
    \ known to fill up.\n\n![Choose a reasonable disk size](images/intro_do_2.png)\n\
    \nChoose a reasonable disk size\n\nAside for some additional options on the page,\
    \ like chosing a region where your droplet will be running in, there’s only a\
    \ big green “Create” button on the bottom of the page, which will set up everything\
    \ you need.\n\n## Go: Introduction to Protobuf: Messages\n\nIn it’s most basic\
    \ ways, protocol buffers or protobufs are an approach to serialize structured\
    \ data with minimal overhead. They require that the data structures be known and\
    \ compatible between the client and server, unlike JSON where the structure itself\
    \ is part of the encoding.\n\n### Protobufs and Go\n\nThe most basic protobuf\
    \ message definition would look something like this:\n\n```\n1 message ListThreadRequest\
    \ {\n2   // session info\n3   string sessionID = 1;\n4 \n5   // pagination\n6\
    \   uint32 pageNumber = 2;\n7   uint32 pageSize = 3;\n8 }\n```\n\nThe above message\
    \ structure specifies the field names, types, and it’s order in the encoded binary\
    \ structure. Managing the structure has a few requirements that mean different\
    \ things, if the structures are used as protobufs, or as JSON encoded data.\n\n\
    For example, this is the `protoc` generated code for this message:\n\n```\n 1\
    \ type ListThreadRequest struct {\n 2   // session info\n 3   SessionID string\
    \ `protobuf:\"bytes,1,opt,name=sessionID,proto3\" json:\"sessionID,omi\\\n 4 tempty\"\
    `\n 5   // pagination\n 6   PageNumber           uint32   `protobuf:\"varint,2,opt,name=pageNumber,proto3\"\
    \ json\\\n 7 :\"pageNumber,omitempty\"`\n 8   PageSize             uint32   `protobuf:\"\
    varint,3,opt,name=pageSize,proto3\" json:\"\\\n 9 pageSize,omitempty\"`\n10  \
    \ XXX_NoUnkeyedLiteral struct{} `json:\"-\"`\n11   XXX_unrecognized     []byte\
    \   `json:\"-\"`\n12   XXX_sizecache        int32    `json:\"-\"`\n13 }\n```\n\
    \nIn the development process, managing the protobuf messages in a forward compatible\
    \ way, there are some rules to follow:\n\n*   Adding new fields is not a breaking\
    \ change,\n\n*   Removing fields is not a breaking change,\n\n*   Don’t re-use\
    \ a field number (breaks existing protobuf clients),\n\n*   Don’t re-number fields\
    \ (breaks existing protobuf clients),\n\n*   Renaming fields is not a breaking\
    \ change for protobuf,\n\n*   Renaming fields is a breaking change for JSON,\n\
    \n*   Changing field types is a breaking change for protobuf, mostly JSON as well,\n\
    \n*   Numeric type changes e.g. uint16 to uint32 are generally safe for JSON,\n\
    \n*   JSON and uint64 isn’t fine if you need to use your APIs from javascript\n\
    \nSo, basically, if you’re relying on changing the protobuf message definitions\
    \ during your development process, you’ll need to keep the client(s) up to date\
    \ with the server. This is especially important later, if you use the protobuf\
    \ API with mobile clients (Android and iPhone apps), since making breaking changes\
    \ to the API is going to hurt you there. Adding new fields or deleting old fields\
    \ is the safest way to make changes to the API, as the protobufs definitions stay\
    \ compatible.\n\n### Generating Protobuf Go code\n\nIn this series of articles,\
    \ I’m going to build out a real world microservice, that tracks and aggregates\
    \ view data for a number of services. It doesn’t need authentication and is in\
    \ it’s definition a true microservice, as it will only need a single API endpoint.\n\
    \nWe will create our `stats` microservice, by creating a `rpc/stats/stats.proto`\
    \ file to begin with.\n\n```\n 1 syntax = \"proto3\";\n 2 \n 3 package stats;\n\
    \ 4 \n 5 option go_package = \"github.com/titpetric/microservice/rpc/stats\";\n\
    \ 6 \n 7 message PushRequest {\n 8   string property = 1;\n 9   uint32 section\
    \ = 2;\n10   uint32 id = 3;\n11 }\n12 \n13 message PushResponse {}\n```\n\nHere\
    \ a `proto3` version is declared. The important parts are the `go_package` option:\
    \ with this an import path is defined for our service, which is useful if another\
    \ service wants to import and use the message definitions here. Reusability is\
    \ a protobuf built-in feature.\n\nSince we don’t want to do things half-way, we’re\
    \ going to approach our microservice with a CI-first approach. Using Drone CI\
    \ is a great option for using a CI from the beginning, as it’s [drone/drone-cli](https://github.com/drone/drone-cli)\
    \ doesn’t need a CI service set up, and you can just run the CI steps locally\
    \ by running `drone exec`.\n\nIn order to set up out microservice build framework,\
    \ we need:\n\n1.  Drone CI drone-cli installed\n\n2.  A docker environment with\
    \ `protoc` and `protoc-gen-go` installed,\n\n3.  A `Makefile` to help us out for\
    \ the long run\n\n4.  A `.drone.yml` config files with the build steps for generating\
    \ go code,\n\n#### Installing Drone CI\n\nInstalling drone-cli is very simple.\
    \ You can run the following if you’re on an amd64 linux host, otherwise just visit\
    \ the [drone/drone-cli](https://github.com/drone/drone-cli) releases page and\
    \ pull the version relevant for you and unpack it into `/usr/local/bin` or your\
    \ common executable path.\n\n```\n1 cd /usr/local/bin\n2 wget https://github.com/drone/drone-cli/releases/download/v1.2.0/drone_linux_amd64.t\\\
    \n3 ar.gz\n4 tar -zxvf drone*.tar.gz && rm drone*.tar.gz\n```\n\n#### Creating\
    \ a build environment\n\nDrone CI works by running CI steps you declare in `.drone.yml`\
    \ in your provided Docker environment. For our build environment, I’ve created\
    \ `docker/build/`, and inside a `Dockerfile` and a `Makefile` to assist with building\
    \ and publishing the build image required for our case:\n\n```\n 1 FROM golang:1.13\n\
    \ 2 \n 3 # install protobuf\n 4 ENV PB_VER 3.10.1\n 5 ENV PB_URL https://github.com/google/protobuf/releases/download/v${PB_VER}/protoc-${\\\
    \n 6 PB_VER}-linux-x86_64.zip\n 7 \n 8 RUN apt-get -qq update && apt-get -qqy\
    \ install curl git make unzip gettext rsync\n 9 \n10 RUN mkdir -p /tmp/protoc\
    \ && \\\n11     curl -L ${PB_URL} > /tmp/protoc/protoc.zip && \\\n12     cd /tmp/protoc\
    \ && \\\n13     unzip protoc.zip && \\\n14     cp /tmp/protoc/bin/protoc /usr/local/bin\
    \ && \\\n15     cp -R /tmp/protoc/include/* /usr/local/include && \\\n16     chmod\
    \ go+rx /usr/local/bin/protoc && \\\n17     cd /tmp && \\\n18     rm -r /tmp/protoc\n\
    19 \n20 # Get the source from GitHub\n21 RUN go get -u google.golang.org/grpc\n\
    22 \n23 # Install protoc-gen-go\n24 RUN go get -u github.com/golang/protobuf/protoc-gen-go\n\
    ```\n\nAnd the `Makefile`, implementing `make && make push` to quickly build and\
    \ push our image to the docker registry. The image is published under `titpetric/microservice-build`,\
    \ but I suggest you manage your own image here.\n\n```\n 1 .PHONY: all docker\
    \ push test\n 2 \n 3 IMAGE := titpetric/microservice-build\n 4 \n 5 all: docker\n\
    \ 6 \n 7 docker:\n 8   docker build --rm -t $(IMAGE) .\n 9 \n10 push:\n11   docker\
    \ push $(IMAGE)\n12 \n13 test:\n14   docker run -it --rm $(IMAGE) sh\n```\n\n\
    #### Creating a Makefile helper\n\nIt’s very easy to run `drone exec`, but our\
    \ requirements will grow over time and the Drone CI steps will become more complex\
    \ and harder to manage. Using a Makefile enables us to add more complex targets\
    \ which we will run from Drone with time. Currently we can start with a minimal\
    \ Makefile which just wraps a call to `drone exec`:\n\n```\n1 .PHONY: all\n2 \n\
    3 all:\n4   drone exec\n```\n\nThis very simple Makefile means that we’ll be able\
    \ to build our project with Drone CI at any time just by running `make`. We will\
    \ extend it over time to support new requirements, but for now we’ll just make\
    \ sure it’s available to us.\n\n#### Creating a Drone CI config"
  fmt: "\nAfter signing up, creating a Linux instance with a running `Docker` engine\
    \ is simple, and only takes a few clicks. There’s this nice green button on the\
    \ top header of the page, where it says “Create Droplet”. Click it, and on the\
    \ page it opens, navigate to “One-click apps” where you choose a “Docker” from\
    \ the list.\n\n![Choose Docker from “One-click apps”](images/intro_do_1.png)\n\
    \nChoose Docker from “One-click apps”\n\nRunning `docker` can be disk-usage intensive.\
    \ Some `docker` images may “weigh” up to or more than 1 GB. I would definitely\
    \ advise choosing an instance with at least 30GB of disk space, which is a bargain\
    \ for $10 a month, but you will have to keep an eye out for disk usage. It’s been\
    \ known to fill up.\n\n![Choose a reasonable disk size](images/intro_do_2.png)\n\
    \nChoose a reasonable disk size\n\nAside for some additional options on the page,\
    \ like chosing a region where your droplet will be running in, there’s only a\
    \ big green “Create” button on the bottom of the page, which will set up everything\
    \ you need.\n\n## Go: Introduction to Protobuf: Messages\n\nIn it’s most basic\
    \ ways, protocol buffers or protobufs are an approach to serialize structured\
    \ data with minimal overhead. They require that the data structures be known and\
    \ compatible between the client and server, unlike JSON where the structure itself\
    \ is part of the encoding.\n\n### Protobufs and Go\n\nThe most basic protobuf\
    \ message definition would look something like this:\n\n```\n1 message ListThreadRequest\
    \ {\n2   // session info\n3   string sessionID = 1;\n4 \n5   // pagination\n6\
    \   uint32 pageNumber = 2;\n7   uint32 pageSize = 3;\n8 }\n```\n\nThe above message\
    \ structure specifies the field names, types, and it’s order in the encoded binary\
    \ structure. Managing the structure has a few requirements that mean different\
    \ things, if the structures are used as protobufs, or as JSON encoded data.\n\n\
    For example, this is the `protoc` generated code for this message:\n\n```\n 1\
    \ type ListThreadRequest struct {\n 2   // session info\n 3   SessionID string\
    \ `protobuf:\"bytes,1,opt,name=sessionID,proto3\" json:\"sessionID,omi\\\n 4 tempty\"\
    `\n 5   // pagination\n 6   PageNumber           uint32   `protobuf:\"varint,2,opt,name=pageNumber,proto3\"\
    \ json\\\n 7 :\"pageNumber,omitempty\"`\n 8   PageSize             uint32   `protobuf:\"\
    varint,3,opt,name=pageSize,proto3\" json:\"\\\n 9 pageSize,omitempty\"`\n10  \
    \ XXX_NoUnkeyedLiteral struct{} `json:\"-\"`\n11   XXX_unrecognized     []byte\
    \   `json:\"-\"`\n12   XXX_sizecache        int32    `json:\"-\"`\n13 }\n```\n\
    \nIn the development process, managing the protobuf messages in a forward compatible\
    \ way, there are some rules to follow:\n\n* Adding new fields is not a breaking\
    \ change,\n* Removing fields is not a breaking change,\n* Don’t re-use a field\
    \ number (breaks existing protobuf clients),\n* Don’t re-number fields (breaks\
    \ existing protobuf clients),\n* Renaming fields is not a breaking change for\
    \ protobuf,\n* Renaming fields is a breaking change for JSON,\n* Changing field\
    \ types is a breaking change for protobuf, mostly JSON as well,\n* Numeric type\
    \ changes e.g. `uint16` to `uint32` are generally safe for JSON,\n* JSON and `uint64`\
    \ isn’t fine if you need to use your APIs from javascript\n\nSo, basically, if\
    \ you’re relying on changing the protobuf message definitions during your development\
    \ process, you’ll need to keep the client(s) up to date with the server. This\
    \ is especially important later, if you use the protobuf API with mobile clients\
    \ (Android and iPhone apps), since making breaking changes to the API is going\
    \ to hurt you there. Adding new fields or deleting old fields is the safest way\
    \ to make changes to the API, as the protobufs definitions stay compatible.\n\n\
    ### Generating Protobuf Go code\n\nIn this series of articles, I’m going to build\
    \ out a real world microservice, that tracks and aggregates view data for a number\
    \ of services. It doesn’t need authentication and is in it’s definition a true\
    \ microservice, as it will only need a single API endpoint.\n\nWe will create\
    \ our `stats` microservice, by creating a `rpc/stats/stats.proto` file to begin\
    \ with.\n\n```\n 1 syntax = \"proto3\";\n 2 \n3 package stats;\n 4 \n5 option\
    \ go_package = \"github.com/titpetric/microservice/rpc/stats\";\n 6 \n7 message\
    \ PushRequest {\n8   string property = 1;\n9   uint32 section = 2;\n10   uint32\
    \ id = 3;\n11 }\n12 \n13 message PushResponse {}\n```\n\nHere a `proto3` version\
    \ is declared. The important parts are the `go_package` option: with this an import\
    \ path is defined for our service, which is useful if another service wants to\
    \ import and use the message definitions here. Reusability is a protobuf built-in\
    \ feature.\n\nSince we don’t want to do things half-way, we’re going to approach\
    \ our microservice with a CI-first approach. Using Drone CI is a great option\
    \ for using a CI from the beginning, as it’s [drone/drone-cli](https://github.com/drone/drone-cli)\
    \ doesn’t need a CI service set up, and you can just run the CI steps locally\
    \ by running `drone-cli`.\n"
  trans: "\n\n注册后，创建一个运行着 `Docker` 引擎的 Linux 实例非常简单，只需点击几次。页面顶部页眉有一个漂亮的绿色按钮，写着“Create\
    \ Droplet”（创建实例）。点击它，在打开的页面中导航到“One-click apps”（一键应用），然后从列表中选择“Docker”。\n\n![从“One-click\
    \ apps”中选择 Docker](img/intro_do_1.png)\n\n从“One-click apps”中选择 Docker\n\n运行 `docker`\
    \ 可能会大量占用磁盘。某些 `docker` 镜像“重量”可能达到 1 GB 或更多。我绝对建议选择至少具有 30GB 磁盘空间的实例，每月 10 美元的价格来说非常划算，但你必须留意磁盘使用情况，因为它已知可能会被占满。\n\
    \n![选择合适的磁盘大小](img/intro_do_2.png)\n\n选择合适的磁盘大小\n\n除了页面上的一些额外选项（例如选择运行实例的区域）之外，页面底部只有一个巨大的绿色“Create”（创建）按钮，它将设置好你需要的一切内容。\n\
    \n## Go: Protobuf 简介：消息 (Messages)\n\n在最基础的层面上，协议缓冲区（protocol buffers 或 protobuf）是一种以最小开销序列化化数据的方法。它们要求数据结构在客户端和服务器之间是已知且兼容的，这与\
    \ JSON 不同，JSON 的结构本身就是编码的一部分。\n\n### Protobuf 与 Go\n\n最基本的 protobuf 消息定义看起来如下：\n\
    \n```\n1 message ListThreadRequest {\n2   // session info\n3   string sessionID\
    \ = 1;\n4 \n5   // pagination\n6   uint32 pageNumber = 2;\n7   uint32 pageSize\
    \ = 3;\n8 }\n```\n\n上述消息结构指定了字段名称、类型以及它们在编码二进制结构中的顺序。根据结构是作为 protobuf 还是 JSON\
    \ 编码数据使用，管理该结构有几项含义不同的不同的要求。\n\n例如，这是该消息的 `protoc` 生成的代码：\n\n```\n 1 type ListThreadRequest\
    \ struct {\n 2   // session info\n 3   SessionID string `protobuf:\"bytes,1,opt,name=sessionID,proto3\"\
    \ json:\"sessionID,omi\\\n 4 tempty\"`\n 5   // pagination\n 6   PageNumber  \
    \         uint32   `protobuf:\"varint,2,opt,name=pageNumber,proto3\" json\\\n\
    \ 7 :\"pageNumber,omitempty\"`\n 8   PageSize             uint32   `protobuf:\"\
    varint,3,opt,name=pageSize,proto3\" json:\"\\\n 9 pageSize,omitempty\"`\n10  \
    \ XXX_NoUnkeyedLiteral struct{} `json:\"-\"`\n11   XXX_unrecognized     []byte\
    \   `json:\"-\"`\n12   XXX_sizecache        int32    `json:\"-\"`\n13 }\n```\n\
    \n在开发过程中，以向前兼容的方式管理 protobuf 消息时，有一些规则需要遵循：\n\n*   添加新字段不是破坏性更改（breaking change），\n\
    *   删除字段不是破坏性更改，\n*   不要重用字段编号（会破坏现有的 protobuf 客户端），\n*   不要重新对字段进行编号（会破坏现有的 protobuf\
    \ 客户端），\n*   重命名字段对于 protobuf 来说不是破坏性更改，\n*   重命名字段对于 JSON 来说是破坏性更改，\n*   更改字段类型对于\
    \ protobuf 是破坏性更改，通常对 JSON 也是如此，\n*   数值类型更改（例如从 `uint16` 到 `uint32`）对于 JSON 通常来说是安全的，\n\
    *   如果你需要在 JavaScript 中使用你的 API，JSON 和 `uint64` 并不兼容\n\n所以，基本上，如果你在开发过程中依赖于更改\
    \ protobuf 消息定义，你就需要保持客户端与服务器同步更新。这在后期尤为重要，如果你将 protobuf API 应用在移动端客户端（Android\
    \ 和 iPhone 应用）上，因为对 API 做出破坏性更改会给你带来麻烦。添加新字段或删除旧字段是更改 API 最安全的方法，因为 protobuf 的定义保持了兼容性。\n\
    \n### 生成 Protobuf Go 代码\n\n在这一系列文章中，我将构建一个真实的微服务，用于跟踪和聚合多个服务的视图数据。它不需要身份验证，从定义上说它是真正的微服务，因为它只需要单个\
    \ API 端点。\n\n我们将通过从创建一个 `rpc/stats/stats.proto` 文件来创建我们的 `stats` 微服务。\n\n```\n\
    \ 1 syntax = \"proto3\";\n 2 \n3 package stats;\n 4 \n5 option go_package = \"\
    github.com/titpetric/microservice/rpc/stats\";\n  \n7 message PushRequest {\n\
    8   string property = 1;\n9   uint32 section = 2;\n10   uint32 id = 3;\n11 }\n\
    12 \n13 message PushResponse {}\n```\n\n这里声明了 `proto3` 版本。重要的部分是 `go_package`\
    \ 选项：通过它定义服务的导入路径，如果另一个服务想要导入并使用这里的消息定义，这将非常有用。可重用是 protobuf 的内置功能。\n\n由于我们不想做一半的工作，我们将采用\
    \ CI 优先（CI-first）的方法来处理微服务。使用 Drone CI 是从一开始使用 CI 的极佳选择，因为 [drone/drone-cli](https://github.com/drone/drone-cli)\
    \ 不需要设置 CI 服务，你只需要通过运行 `drone-cli` 即可在本地运行 CI 步骤。\n\n"
  toc: []
- raw: "With this, we can define our initial `.drone.yml` file that will build our\
    \ Protobuf struct definitions, as well as perform some maintenance on our codebase:\n\
    \n```\n 1 workspace:\n 2   base: /microservice\n 3 \n 4 kind: pipeline\n 5 name:\
    \ build\n 6 \n 7 steps:\n 8 - name: test\n 9   image: titpetric/microservice-build\n\
    10   pull: always\n11   commands:\n12     - protoc --proto_path=$GOPATH/src:.\
    \ -Irpc/stats --go_out=paths=source_relative:.\\\n13  rpc/stats/stats.proto\n\
    14     - go mod tidy > /dev/null 2>&1\n15     - go mod download > /dev/null 2>&1\n\
    16     - go fmt ./... > /dev/null 2>&1\n```\n\nThe housekeeping done is for our\
    \ go.mod/go.sum files, as well as running `go fmt` on our codebase.\n\nThe first\
    \ step defined under the `commands:` is our `protoc` command that will generate\
    \ the Go definitions for our declared messages. In the folder where our `stats.proto`\
    \ file lives, a `stats.pb.go` file will be created, with structures for each declared\
    \ `message {}`.\n\n### Wrapping up\n\nSo, what we managed to achieve here:\n\n\
    *   we created our CI build image with our `protoc` code generation environment,\n\
    \n*   we are using Drone CI as our local build service, enabling us to migrate\
    \ to a hosted CI in the future,\n\n*   we created a protobuf definition for our\
    \ microservice message structures,\n\n*   we generated the appropriate Go code\
    \ for encoding/decoding the protobuf messages\n\nFrom here on out, we will move\
    \ towards implementing a RPC service.\n\n## Go: Introduction to Protobuf: Services\n\
    \nThe next step (or possibly the first step) about implementing a microservice,\
    \ is defining it’s API endpoints. What people usually do is write http handlers\
    \ and resort to a routing framework like [go-chi/chi](https://github.com/go-chi/chi).\
    \ But, protocol buffers can define your service, as RPC calls definitions are\
    \ built into the protobuf schema.\n\n### Protobuf service definitions\n\nProtobuf\
    \ files may define a `service` object, which has definitions for one or many `rpc`\
    \ calls. Let’s extend our proto definitions for `stats.proto`, by including a\
    \ service with a defined RPC.\n\n```\n1 service StatsService {\n2   rpc Push(PushRequest)\
    \ returns (PushResponse);\n3 }\n```\n\nA RPC method is defined with the `rpc`\
    \ keyword. The service definition here declares a RPC named `Push`, which takes\
    \ a message `PushRequest` as it’s input, and returns the message `PushResponse`\
    \ as it’s output. All RPC definitions should follow the same naming pattern as\
    \ a best practice. This way you can extend PushRequest and PushResponse, without\
    \ introducing breaking changes to the RPC definition as well.\n\nUpdating the\
    \ `.proto` file definitions in our project by default doesn’t change anything.\
    \ We need to generate a RPC scaffold using a RPC framework. For Go RPCs, we can\
    \ consider gRPC from the beginning, or we can look towards a more simple [Twitch\
    \ RPC aka. Twirp](https://github.com/twitchtv/twirp).\n\nCommon reasons for choosing\
    \ Twirp over gRPC are as follows:\n\n*   Twirp comes with HTTP 1.1 support (vendors\
    \ need to catch up to HTTP/2 still),\n\n*   Twirp supports JSON transport out\
    \ of the gate,\n\n*   gRPC re-implements HTTP/2 outside of net/http,\n\nAnd reasons\
    \ for gRPC over Twirp are:\n\n*   gRPC supports streaming (Twirp has [an open\
    \ proposal for streaming APIs](https://github.com/twitchtv/twirp/issues/70))\n\
    \n*   gRPC makes wire compatibility promises (this is built in to protobufs)\n\
    \n*   More functionality on the networking level (retries, rpc discovery,…)\n\n\
    JSON would be the preferable format to demonstrate payloads, especially in terms\
    \ of inspecting/sharing the payloads in documentation and similar. While gRPC\
    \ is written by Google, there are many tools that you’d have to add in to make\
    \ it a bit more developer friendly - [gRPC-gateway](https://github.com/gRPC-ecosystem/gRPC-gateway)\
    \ to add HTTP/1.1, and [gRPCurl](https://github.com/fullstorydev/gRPCurl) to issue\
    \ json-protobuf bridged requests.\n\ngRPC is a much more rich RPC framework, supporting\
    \ a wider array of use cases. If you feel that you need RPC streaming or API discovery,\
    \ or your use cases lay beyond a simple request/response model, gRPC might be\
    \ your only option.\n\n### Our microservice\n\nLet’s first start with Twitch RPC,\
    \ so we can have a real comparison with gRPC in the next chapter.\n\nAbout 10\
    \ years back I wrote a relatively simple microservice that is basically just tracking\
    \ news item views. That solution is proving to be unmaintainable 10 years later\
    \ at best, but still pretty good so it manages 0-1ms/request. It’s also a bit\
    \ smarter than that, since it tracks a number of assets that aren’t news in the\
    \ same way. So, effectively the service is tracking views in a multi-tennant way,\
    \ for a predefined set of applications.\n\nLet’s refresh what our current service\
    \ definition is:\n\n```\n 1 service StatsService {\n 2   rpc Push(PushRequest)\
    \ returns (PushResponse);\n 3 }\n 4 \n 5 message PushRequest {\n 6   string property\
    \ = 1;\n 7   uint32 section = 2;\n 8   uint32 id = 3;\n 9 }\n10 \n11 message PushResponse\
    \ {}\n```\n\nOur `StatsService` defines a RPC called `Push`, which takes a message\
    \ with three parameters:\n\n*   property: the key name for a tracked property,\
    \ e.g. “news”\n\n*   section: a related section ID for this property (numeric)\n\
    \n*   id: the ID which defines the content being viewed (numeric)\n\nThe goal\
    \ of the service is to log the data in PushRequest, and aggregate it over several\
    \ time periods. The aggregation itself is needed to provide data sets like “Most\
    \ read news over the last 6 months”.\n\n### Twitch RPC scaffolding\n\nThe main\
    \ client and server code generators for Twitch RPC are listed in the README for\
    \ [twitchtv/twirp](https://github.com/twitchtv/twirp). The code generator we will\
    \ use is available from `github.com/twitchtv/twirp/protoc-gen-twirp`. We will\
    \ add this to our dockerfile:\n\n```\n1 --- a/docker/build/Dockerfile\n2 +++ b/docker/build/Dockerfile\n\
    3 @@ -21,3 +21,6 @@ RUN go get -u google.golang.org/gRPC\n4 \n5  # Install protoc-gen-go\n\
    6  RUN go get -u github.com/golang/protobuf/protoc-gen-go\n7 +\n8 +# Install protoc-gen-twirp\n\
    9 +RUN go get github.com/twitchtv/twirp/protoc-gen-twirp\n```\n\nAnd now we can\
    \ extend our code generator in the `.drone.yml` file, by generating the twirp\
    \ RPC output as well:\n\n```\n1 --- a/.drone.yml\n2 +++ b/.drone.yml\n3 @@ -10,6\
    \ +10,7 @@ steps:\n4    pull: always\n5    commands:\n6      - protoc --proto_path=$GOPATH/src:.\
    \ -Irpc/stats --go_out=paths=source_relative:\\\n7 . rpc/stats/stats.proto\n8\
    \ +    - protoc --proto_path=$GOPATH/src:. -Irpc/stats --twirp_out=paths=source_relati\\\
    \n9 ve:. rpc/stats/stats.proto\n```\n\nWe run the `protoc` command twice, but\
    \ the `--twirp_out` option could actually be added to the existing command. We\
    \ will keep this seperate just to help with readability, so we know which command\
    \ is responsible to generate what. When it comes to the code generator plugins\
    \ for protoc, there’s a long list of plugins that can generate anything from JavaScript\
    \ clients to Swagger documentation. As we will add these, we don’t want the specific\
    \ for generating one type of output to bleed into other generator rules.\n\nThe\
    \ above command will generate a `stats.twirp.go` file in the same folder as `stats.proto`\
    \ file. The important part for our implementation is the following interface:\n\
    \n```\n1 type StatsService interface {\n2         Push(context.Context, *PushRequest)\
    \ (*PushResponse, error)\n3 }\n```\n\nIn order to implement our Twitch RPC service,\
    \ we need an implementation for this interface. For that, we will look at our\
    \ own code generation that will help us with this. Particularly, we want to scaffold\
    \ both the server and the client code that could get updated if our service definitions\
    \ change.\n\nUp next: we’ll generate a gRPC server with the same proto definition,\
    \ and look at the implementation changes this brings for us. We will try to attempt\
    \ to answer which RPC framework will serve us better at the long run, with more\
    \ concrete examples of the differences between the two.\n\n## Go: Introduction\
    \ to Protobuf: gRPC"
  fmt: "\nWith this, we can define our initial `.drone.yml` file that will build our\
    \ Protobuf struct definitions, as well as perform some maintenance on our codebase:\n\
    \n```\n 1 workspace:\n 2   base: /microservice\n 3 \n 4 kind: pipeline\n 5 name:\
    \ build\n 6 \n 7 steps:\n 8 - name: test\n 9   image: titpetric/microservice-build\n\
    10   pull: always\n11   commands:\n12     - protoc --proto_path=$GOPATH/src:.\
    \ -Irpc/stats --go_out=paths=source_relative:\\\n13  rpc/stats/stats.proto\n14\
    \     - go mod tidy > /dev/null 2>&1\n15     - go mod download > /dev/null 2>&1\n\
    16     - go fmt ./... > /dev/null 2>&1\n```\n\nThe housekeeping done is for our\
    \ `go.mod`/`go.sum` files, as well as running `go fmt` on our codebase.\n\nThe\
    \ first step defined under the `commands:` is our `protoc` command that will generate\
    \ the Go definitions for our declared messages. In the folder where our `stats.proto`\
    \ file lives, a `stats.pb.go` file will be created, with structures for each declared\
    \ `message {}`.\n\n### Wrapping up\n\nSo, what we managed to achieve here:\n\n\
    - we created our CI build image with our `protoc` code generation environment,\n\
    - we are using Drone CI as our local build service, enabling us to migrate to\
    \ a hosted CI in the future,\n- we created a protobuf definition for our microservice\
    \ message structures,\n- we generated the appropriate Go code for encoding/decoding\
    \ the protobuf messages\n\nFrom here on out, we will move towards implementing\
    \ a RPC service.\n\n## Go: Introduction to Protobuf: Services\n\nThe next step\
    \ (or possibly the first step) about implementing a microservice, is defining\
    \ it’s API endpoints. What people usually do is write http handlers and resort\
    \ to a routing framework like [go-chi/chi](https://github.com/go-chi/chi). But,\
    \ protocol buffers can define your service, as RPC calls definitions are built\
    \ into the protobuf schema.\n\n### Protobuf service definitions\n\nProtobuf files\
    \ may define a `service` object, which has definitions for one or many `rpc` calls.\
    \ Let’s extend our proto definitions for `stats.proto`, by including a service\
    \ with a defined RPC.\n\n```\n1 service StatsService {\n2   rpc Push(PushRequest)\
    \ returns (PushResponse);\n3 }\n```\n\nA RPC method is defined with the `rpc`\
    \ keyword. The service definition here declares a RPC named `Push`, which takes\
    \ a message `PushRequest` as it’s input, and returns the message `PushResponse`\
    \ as it’s output. All RPC definitions should follow the same naming pattern as\
    \ a best practice. This way you can extend `PushRequest` and `PushResponse`, without\
    \ introducing breaking changes to the RPC definition as well.\n\nUpdating the\
    \ `.proto` file definitions in our project by default doesn’t change anything.\
    \ We need to generate a RPC scaffold using a RPC framework. For Go RPCs, we can\
    \ consider gRPC from the beginning, or we can look towards a more simple [Twitch\
    \ RPC aka. Twirp](https://github.com/twitchtv/twirp).\n\nCommon reasons for choosing\
    \ `Twirp` over `gRPC` are follows:\n- `Twirp` comes with HTTP 1.1 support\n- `Twirp`\
    \ supports JSON transport\n- `Twirp` re-implements HTTP/2\n\nAnd reasons for `gRPC`\
    \ over `Twirp` are:\n- `gRPC` supports streaming\n- `gRPC` makes wire compatibility\n\
    - `gRPC` has more functionality on the networking level (retries, rpc discovery)\n\
    \nJSON would be the preferable format to demonstrate payloads, especially in terms\
    \ of inspecting the payloads and similar. While `gRPC` is written by Google, there\
    \ are many tools that you’d have to add to make it a bit more developer friendly\
    \ - [grpc-gateway](https://github.com/grpc-ecosystem) to add HTTP/1.1, and [grpcurl](https://github.com/fulldev)\
    \ to issue protobuf requests.\n\n`gRPC` is a much more rich framework, supporting\
    \ a wider array of use cases. If you feel that you need streaming or your use\
    \ cases lay beyond a simple request/response model, `gRPC` might be your only\
    \ option.\n\n### Our microservice\n\nLet’s first start with `Twirp`, so we can\
    \ have a real comparison with `gRPC` in the next chapter.\n\nAbout 10 years back\
    \ I wrote a relatively simple microservice that basically just tracking views.\
    \ That solution is proving to be unmaintainable 10 years later, but still pretty\
    \ good since it manages number of assets that aren’t in the same way. Let’s refresh\
    \ what our service definition is:\n\n```\n1 service StatsService {\n2   rpc Push(PushRequest)\
    \ returns (PushResponse);\n3 }\n4 5 message PushRequest {\n6   string property\
    \ = 1;\n7   uint32 section = 2;\n8   uint32 id = 3;\n9 }\n10\n11 message PushResponse\
    \ {}\n```\n\nOur `StatsService` defines RPC called `Push`, which takes a message\
    \ with three parameters:\n- `property`: the key name for tracked property, e.g.\
    \ “news”\n- `section`: a related section ID for this property\n- `id`: the ID\
    \ which defines the content being viewed\n\nThe goal of the service is to log\
    \ the data in `PushRequest`, and aggregate it over several time periods. The aggregation\
    \ itself is needed to provide data sets like “Most read news over the last 6 months”.\n\
    \n### Twitch RPC scaffolding\n\nThe main client and server code generators for\
    \ `Twirp` are listed in the README for [twitchtv/twirp](https://github.com/twitchtv/twirp).\
    \ The code generator we will use is available from `github.com/twitchtv/twirp/protoc-gen-twirp`.\
    \ We will add this to our dockerfile:\n\n```\n1 --- a/docker/build/Dockerfile\n\
    2 +++ b/docker/build/Dockerfile\n3 @@ -21,3 +21,6 @@ RUN get -u google.golang.org/grpc\n\
    4 \n5 # Install protoc-gen-go\n6 RUN get -u github.com/golang/protobuf/protoc-gen-go\n\
    7 +\n8 +# Install protoc-gen-twirp\n9 +RUN get github.com/twitchtv/twirp/protoc-gen-twirp\n\
    ```\n\nAnd now we can extend our code generator in the `.drone.yml` file, by generating\
    \ the `twirp` RPC output as well:\n\n```\n1 --- a/.drone.yml\n2 +++ b/.drone.yml\n\
    3 @@ -10,6 +10,7 @@ steps:\n4    pull: always\n5    commands:\n6      - protoc\
    \ --proto_path=$GOPATH/src:. -Irpc/stats --go_out=paths=source_relative:\\\n7\
    \ . rpc/stats/stats.proto\n8 +    - protoc --proto_path=$GOPATH/src:. -Irpc/stats\
    \ --twirp_out=paths=source_relati\\\n9 ve:. rpc/stats/stats.proto\n```\n\nWe run\
    \ the `protoc` command twice, but the `--twirp_out` option could actually be added\
    \ to the existing command. We will keep this separate just to help with readability,\
    \ so we know which command is responsible to generate what. When it comes to the\
    \ code generator plugins for `protoc`, there’s a long list of plugins that can\
    \ generate anything from JavaScript clients to Swagger documentation. As we will\
    \ add these, we don’t want the specific for generating one type of output to bleed\
    \ into other generator rules.\n\nThe above command will generate a `stats.twirp.go`\
    \ file in the same folder as `stats.proto` file. The important part for our implementation\
    \ is the following interface:\n\n```\n1 type StatsService interface {\n2     \
    \    Push(context.Context, *PushRequest) (*PushResponse, error)\n3 }\n```\n\n\
    In order to implement our `Twirp` RPC service, we need an implementation for this\
    \ interface. For that, we will look at our own code generation that will help\
    \ us with this. Particularly, we want to scaffold both the server and the client\
    \ code that could get updated if our service definitions change.\n"
  trans: "\n通过此，我们可以定义我们的 `.drone.yml` 文件来构建 Protobuf 定义，并对我们的代码库执行一些维护：\n\n```\n\
    1 workspace:\n2   base: /microservice\n3 \n4 kind: pipeline\n5 name: build\n6\
    \ \n7 steps:\n8   name: test\n9   image: titpetric/microservice\n10   pull: always\n\
    11   commands:\n12     - protoc --proto_path=$GOPATH/src:. -Irpc/stats --go_out=paths=relative:\\\
    \n13  rpc/stats/stats.proto\n14     - go mod tidy\n15     - go mod download\n\
    16     - go fmt\n```\n\n完成的维护工作是我们的 `go.mod`/`go.sum` 文件，`commands:` 下定义的第一步是\
    \ `protoc` 命令，它将为我们声明的消息生成 Go 定义。在 `stats.proto` 文件所在的文件夹中将创建一个 `stats.pb.go`\
    \ 文件，为每个声明的 `message {}` 创建代码。\n\n### 总结\n\n在这里我们实现了：\n\n- 创建了带有 `protoc` 生成环境的\
    \ Drone CI 镜像；\n- 我们使用 Drone CI 作为本地构建，使我们未来能够迁移到托管的 CI；\n- 为我们的微服务创建了 protobuf\
    \ 定义；\n- 生成了用于编码/解码 protobuf 消息的适当 Go 代码。\n\n从这里开始，我们将转向实现 RPC 服务。\n\n## Go：Protobuf\
    \ 简介：服务\n\n实现微服务的下一步（可能是第一步）是定义其 API 端点。人们通常的做法是编写 http 处理程序并求助于诸如 [go-chi/chi](https://github.com/go-chi/chi)\
    \ 的路由框架。但是，协议缓冲区可以定义你的服务，因为 RPC 调用定义已经构建在 protobuf 模式中了。\n\n### Protobuf 服务定义\n\
    \nProtobuf 文件可以定义一个 `service` 对象，它包含一个或多个 `rpc` 调用定义。让我们通过包含一个带有 RPC 的服务来扩展 `stats.proto`\
    \ 定义：\n\n```\n1 service StatsService {\n2   rpc Push(PushRequest) returns (PushResponse);\n\
    3 }\n```\n\nRPC 方法通过 `rpc` 关键字定义。这里的服务声明了一个名为 `Push` 的 RPC，它接收 `PushRequest` 消息作为输入，并返回\
    \ `PushResponse` 消息作为输出。所有的 RPC 定义应该遵循相同的命名模式，作为最佳实践。这样你可以扩展 `PushRequest` 和 `PushResponse`，而不会对\
    \ RPC 定义引入破坏性更改。\n\n默认更新项目中的 `.proto` 文件定义不会改变任何内容。我们需要使用 RPC 框架生成 RPC 骨架。对于 Go\
    \ RPC，我们可以从一开始考虑 gRPC，或者查看更简单的 [Twitch RPC 即 Twirp](https://github.com/twitchtv/twirp)。\n\
    \n选择 `Twirp` 而不是 `gRPC` 的常见原因如下：\n- `Twirp` 支持 HTTP 1.1\n- `Twirp` 支持 JSON 传输\n\
    - `Twirp` 重新实现了 HTTP/2\n\n而选择 `gRPC` 而不是 `Twirp` 的原因是：\n- `gRPC` 支持流式\n- `gRPC`\
    \ 实现了线路兼容性\n- `gRPC` 在网络层具有更多功能（重试、RPC 发现）\n\nJSON 是演示负载的优选格式，特别是在检查负载等方面。虽然 `gRPC`\
    \ 是由 Google 编写的，但你必须添加许多工具来使其对开发者更友好——[grpc-gateway](https://github.com/grpc-ecosystem)\
    \ 用于添加 HTTP/1.1，以及 [grpcurl](https://github.com/fulldev) 用于发布 protobuf 请求。\n\n\
    `gRPC` 是丰富丰富的框架，支持更广泛的用例。如果你觉得你需要流式传输或者你的用例超出了简单的请求/响应模型，`gRPC` 可能是你唯一的选择。\n\n\
    ### 我们的微服务\n\n让我们先从 `Twirp` 开始，这样我们可以在下一个章节中与 `gRPC` 进行真实的比较。\n\n大约 10 年前，我写了一个相对简单的微服务，基本上只是跟踪视图量。该解决方案在\
    \ 10 年后证明是不可维护的，但仍然很好，因为它管理了许多处理方式不相同的资产。让我们刷新一下我们的服务定义：\n\n```\n1 service StatsService\
    \ {\n2   rpc Push(PushRequest) returns (PushResponse);\n3 }\n4 \n5 message PushRequest\
    \ {\n6   string property = 1;\n7   uint32 section = 2;\n8 }\n9 \n10 message PushResponse\
    \ {\n11 }\n```\n\n`StatsService` 定义了 `Push` RPC，它接收 `PushRequest` 消息并返回 `PushResponse`\
    \ 消息。这包含了三个参数：\n- `property`: 跟踪的属性\n- `section`: 对应的字段\n- `id`: 定义的 ID\n\n服务的目标是根据\
    \ `PushRequest` 聚合数据，例如“过去 6 个月的统计数据”。\n"
