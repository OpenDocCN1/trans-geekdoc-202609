- raw: "```\n 1 #!/bin/bash\n 2 function get_stats_ip {\n 3   docker inspect \\\n\
    \ 4     microservice_stats_1 | \\\n 5   jq -r '.[0].NetworkSettings.Networks[\"\
    microservice_default\"]'.IPAddress\n 6 }\n 7 \n 8 url=\"http://$(get_stats_ip):3000/twirp/stats.StatsService/Push\"\
    \n 9 \n10 docker run --rm --net=host -it -v $PWD:/data skandyla/wrk -d15s -t4\
    \ -c400 -s test.lu\\\n11 a $url\n```\n\nThe command will run tests for 15 seconds,\
    \ 4 threads, 400 connections, and run the script test.lua for each request. Running\
    \ `./test.sh` against our service gives us this:\n\n```\n 1 Running 15s test @\
    \ http://172.22.0.5:3000/twirp/stats.StatsService/Push\n 2   4 threads and 400\
    \ connections\n 3   Thread Stats   Avg      Stdev     Max   +/- Stdev\n 4    \
    \ Latency   224.79ms  256.55ms   1.56s    88.49%\n 5     Req/Sec   579.91    191.59\
    \     1.26k    69.63%\n 6   34493 requests in 15.04s, 5.54MB read\n 7   Socket\
    \ errors: connect 0, read 0, write 0, timeout 90\n 8   Non-2xx or 3xx responses:\
    \ 17834\n 9 Requests/sec:   2293.06\n10 Transfer/sec:    377.23KB\n```\n\nIt seems\
    \ that stress testing our service resulted in 17834 errors out of 34493 requests,\
    \ along with 90 timeout errors. That is an error rate of about 52%. Since we are\
    \ using APM, we can check what kind of errors are logged and start fixing the\
    \ service.\n\nThe APM graphs confirm the error rate:\n\n![](images/apm3-1.png)\n\
    \nThe errors tab also gives us some insight into the errors:\n\n![](images/apm3-2.png)\n\
    \n### Resolving detected errors\n\nThe `Error 1040: Too many connections` is tunable\
    \ both on the MySQL side, and the Go side. On the Go side, we have the following\
    \ options to tune MySQL usage on our DB instance:\n\n*   SetMaxOpenConns() - Set\
    \ a maximum number of connections the service will hold open,\n\n*   SetMaxIdleConns()\
    \ - Sets the most idle connections we can have open at any time,\n\n*   SetConnMaxLifetime()\
    \ - Sets the time how much the connection can stay open for\n\nAll of these options\
    \ tune our database usage. By default, there is no limit to the number of connections\
    \ that can be opened. If we set a limit with `SetMaxOpenConns`, a connection must\
    \ be freed up, so it can be reused. Generally you want this limit to be high,\
    \ because you don’t want to wait on connections too much if the pool is too small.\n\
    \nWe want to simulate real life behaviour of the application to estimate the number\
    \ of connections that work for our case. A stress test isn’t real life behaviour,\
    \ so let’s just blindly set it to something highly unreasonable. Since we already\
    \ set 400 connections as our target for the stress test, let’s double that on\
    \ the back-end for our SQL connections.\n\nBy default, `SetMaxIdleConns` only\
    \ allows 2 idle connections, meaning that there would be a lot of churn as soon\
    \ as clients go idle. We don’t want to throw away idle connections as they die\
    \ down, or at least not so fast, so we will set this value to the same as `SetMaxOpenConns`.\
    \ This doesn’t mean that the connection won’t be closed (there’s also MySQL timeout\
    \ for that).\n\nAnd finally, `SetConnMaxLifetime` is not set by default, meaning\
    \ any connection that is opened and isn’t reaped with `SetMaxIdleConns` can be\
    \ reused within the duration set here.\n\nConnection clean up operations run every\
    \ second, so we will also reduce stress on the cleanup, if we can hold the connections\
    \ open for a longer time. This one is up to you, but generally unless there’s\
    \ a good technical reason for setting a max collection lifetime, like a ProxySQL\
    \ load balancer in front of your MySQL cluster, you probably don’t need to change\
    \ this.\n\nOpen up `db/connect.go` and replace `ConnectWithOptions`:\n\n```\n\
    \ 1 // ConnectWithOptions connect to host based on ConnectionOptions{}\n 2 func\
    \ ConnectWithOptions(ctx context.Context, options ConnectionOptions) (*sqlx.DB,\
    \ e\\\n 3 rror) {\n 4   credentials := options.Credentials\n 5   if credentials.DSN\
    \ == \"\" {\n 6     return nil, errors.New(\"DSN not provided\")\n 7   }\n 8 \
    \  if credentials.Driver == \"\" {\n 9     credentials.Driver = \"mysql\"\n10\
    \   }\n11   credentials.DSN = cleanDSN(credentials.DSN)\n12 \n13   connect :=\
    \ func() (*sqlx.DB, error) {\n14     if options.Connector != nil {\n15       handle,\
    \ err := options.Connector(ctx, credentials)\n16       if err == nil {\n17   \
    \      return sqlx.NewDb(handle, credentials.Driver), nil\n18       }\n19    \
    \   return nil, errors.WithStack(err)\n20     }\n21     return sqlx.ConnectContext(ctx,\
    \ credentials.Driver, credentials.DSN)\n22   }\n23 \n24   db, err := connect()\n\
    25   if err != nil {\n26     return nil, err\n27   }\n28   db.SetMaxOpenConns(800)\n\
    29   db.SetMaxIdleConns(800)\n30   return db, nil\n31 }\n```\n\nAnd let’s configure\
    \ our database to have a maximum connection limit of 1000 connections. Edit `docker-compose.yml`\
    \ and update the database definition to this:\n\n```\n 1   db:\n 2     image:\
    \ percona/percona-server:8.0.17\n 3     command: [\n 4       \"--max_connections=1000\"\
    \n 5     ]\n 6     environment:\n 7       MYSQL_ALLOW_EMPTY_PASSWORD: \"true\"\
    \n 8       MYSQL_USER: \"stats\"\n 9       MYSQL_DATABASE: \"stats\"\n10     \
    \  MYSQL_PASSWORD: \"stats\"\n11     restart: always\n```\n\nRebuild the docker\
    \ images for our service with `make && make docker` and re-run `docker-compose\
    \ up -d`, and finally, let’s run our benchmark again:\n\n```\n1 Running 15s test\
    \ @ http://172.22.0.5:3000/twirp/stats.StatsService/Push\n2   4 threads and 400\
    \ connections\n3   Thread Stats   Avg      Stdev     Max   +/- Stdev\n4     Latency\
    \   185.91ms  158.08ms   1.47s    94.41%\n5     Req/Sec   590.52    261.76   \
    \  1.33k    62.03%\n6   34813 requests in 15.05s, 3.62MB read\n7 Requests/sec:\
    \   2313.32\n8 Transfer/sec:    246.24KB\n```\n\nIt seems we resolved all of our\
    \ connection/response errors here. There are some 5xx errors still reported in\
    \ APM which we need to look at.\n\n![](images/apm3-3.png)\n\n### Removing context\
    \ cancellation\n\nWe are still getting `twirp error internal: context canceled`.\
    \ Now, the issue with request cancelation is that even the stack trace doesn’t\
    \ help much when you want to figure out where the context was canceled from, or\
    \ even which context it’s supposed to be.\n\nGiven this stack trace:\n\n```\n\
    1 gocontext.go in CaptureError at line 131\n2 twirp.go in NewServerHooks.func1\
    \ at line 13\n3 stats.twirp.go in callError at line 795\n4 stats.twirp.go in writeError\
    \ at line 376\n5 stats.twirp.go in (*statsServiceServer).writeError at line 138\n\
    6 stats.twirp.go in (*statsServiceServer).servePushJSON at line 220\n7 stats.twirp.go\
    \ in (*statsServiceServer).servePush at line 186\n8 stats.twirp.go in (*statsServiceServer).ServeHTTP\
    \ at line 168\n9 wrap.go in WrapWithIP.func1 at line 38\n```\n\nWe might asume\
    \ that the error originated from twirp, given the `twirp error internal` message,\
    \ but when we read the code we find this little bit:\n\n```\n1 // Non-twirp errors\
    \ are wrapped as Internal (default)\n2 twerr, ok := err.(twirp.Error)\n3 if !ok\
    \ {\n4   twerr = twirp.InternalErrorWith(err)\n5 }\n```\n\nSo, our `context canceled`\
    \ error came from our `Push()` function and is wrapped into a twirp internal error.\
    \ And we see that the only function it could have come from is `_, err = svc.db.NamedExecContext(ctx,\
    \ query, row)`.\n\nOne might think that this issue is database related, but it\
    \ isn’t. There’s a simpler explanation: the request Context() function is cancellable\
    \ and is cancelled as soon as the client drops the connection. The errors show\
    \ up at the tail end of our stress test, so we can make an educated guess and\
    \ say that the last few connections wrk makes, are closed forcefully and thus\
