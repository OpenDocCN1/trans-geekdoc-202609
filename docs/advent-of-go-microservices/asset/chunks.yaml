    \ []*Column\n 8 }\n 9 \n10 var TableFields = []string{\"TABLE_NAME\", \"TABLE_COMMENT\"\
    }\n11 \n12 type Column struct {\n13   Name    string `db:\"COLUMN_NAME\"`\n14\
