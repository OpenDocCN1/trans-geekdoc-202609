  trans: "\n别忘了运行 `make && make docker`，之后你就可以运行 `docker-compose up` 并观察服务的启动过程，而无需手动执行迁移步骤。\n\
    \n# Go：使用 Elastic APM 对 HTTP 服务进行插桩\n\nElastic APM 是一项应用性能监控产品，由 Elastic 公司开发，它是\
    \ Elasticsearch 的制作者，最著名的就是 ELK 栈（Elasticsearch, Logstash, Kibana）。APM 是他们的另一款即插即用产品，可以连接到你现有的\
    \ ELK 安装，并为应用代理提供端点，以接收性能指标数据。\n\nElastic APM 提供了一个 Go 代理，我们将使用它来对代码的各个部分进行插桩。插桩不仅能帮助我们收集性能指标，还能帮助我们调试和优化应用程序。\n\
    \n## 包装我们现有的处理器\n\n我们已经用自定义的处理器包装了 HTTP 处理器，它在请求上下文中添加了 IP 信息。APM 的工作原理相同，为 `http.Handler`\
