- raw: "```\n 1 package ${SERVICE}\n 2 \n 3 import (\n 4   \"context\"\n 5 \n 6  \
    \ \"${MODULE}/rpc/${SERVICE}\"\n 7 )\n 8 \n 9 type Server struct {\n10 }\n11 \n\
    12 func New(ctx context.Context) (*Server, error) {\n13   return &Server{}, nil\n\
    14 }\n15 \n16 var _ ${SERVICE}.${SERVICE_CAMEL}Service = &Server{}\n```\n\nAnd\
    \ then we can just append the output of `impl` after it, so the generated code\
    \ immediately satisfies the service interface. We need to update the makefile\
    \ target now, to invoke this template, as well as generate the function stubs\
    \ for the StatsService interface.\n\n```\n1 templates.%:\n2   mkdir -p cmd/$(SERVICE)\
    \ client/$(SERVICE) server/$(SERVICE)\n3   envsubst < templates/cmd_main.go.tpl\
    \ > cmd/$(SERVICE)/main.go\n4   envsubst < templates/client_client.go.tpl > client/$(SERVICE)/client.go\n\
    5   envsubst < templates/server_server.go.tpl > server/$(SERVICE)/server.go\n\
    6   impl -dir rpc/$(SERVICE) 'svc *Server' $(SERVICE).$(SERVICE_CAMEL)Service\
    \ >> serve\\\n7 r/$(SERVICE)/server.go\n```\n\nAfter checking that the stubs are\
    \ generated, running `make` will successfully build our project. Looking at our\
    \ service, we are left to implement the function defined in the server interface:\n\
    \n```\n1 func (svc *Server) Push(_ context.Context, _ *stats.PushRequest) (*stats.PushRespons\\\
    \n2 e, error) {\n3   panic(\"not implemented\") // TODO: Implement\n4 }\n```\n\
    \nWe also want to generate our server.go file only if it doesn’t exist - we only\
    \ want to scaffold it for the first time, and checking file existance in Makefile\
    \ is difficult, so let’s move this into a bash script, and adjust the verbosity/output\
    \ of the complete templates target:\n\n```\n1 templates.%:\n2   @mkdir -p cmd/$(SERVICE)\
    \ client/$(SERVICE) server/$(SERVICE)\n3   @envsubst < templates/cmd_main.go.tpl\
    \ > cmd/$(SERVICE)/main.go\n4   @echo \"~ cmd/$(SERVICE)/main.go\"\n5   @envsubst\
    \ < templates/client_client.go.tpl > client/$(SERVICE)/client.go\n6   @echo \"\
    ~ client/$(SERVICE)/client.go\"\n7   @./templates/server_server.go.sh\n```\n\n\
    The `@` command suppresses the output of the command being run, and we output\
    \ `~ file.go` for each file being written. Our `server_server.go.sh` has checks\
    \ for the existance of our server.go file:\n\n```\n 1 #!/bin/bash\n 2 cd $(dirname\
    \ $(dirname $(readlink -f $0)))\n 3 \n 4 if [ -z \"${SERVICE}\" ]; then\n 5  \
    \ echo \"Usage: SERVICE=[name] SERVICE_CAMEL=[Name] $0\"\n 6   exit 255\n 7 fi\n\
    \ 8 \n 9 OUTPUT=\"server/${SERVICE}/server.go\"\n10 \n11 # only generate server.go\
    \ if it doesn't exist\n12 if [ ! -f \"$OUTPUT\" ]; then\n13   envsubst < templates/server_server.go.tpl\
    \ > $OUTPUT\n14   impl -dir rpc/${SERVICE} 'svc *Server' ${SERVICE}.${SERVICE_CAMEL}Service\
    \ >> $OUTP\\\n15 UT\n16   echo \"~ $OUTPUT\"\n17 fi\n```\n\nThis should give us\
    \ a good start for our scaffolding. The correct and most optimal way to plan your\
    \ services would be to take your time planning the proto schema, and then let\
    \ the scaffolding take you to a place where you only need to implement the defined\
    \ RPCs.\n\nWith more fluid and changing requirements, you will not really take\
    \ advantage of the code generation when you’ll be updating the proto file during\
    \ development. Adding new RPC calls will mean you’ll have to define the new functions\
    \ by hand, which isn’t really that bad with ~3 SLOC, but still isn’t ideal for\
    \ anything other than a microservice with only a few function calls. Planning\
    \ saves time.\n\n## Bash: Embedding files into Go\n\nThere’s always that chance\
    \ that your Go app/service will need to bundle some files in order to fulfill\
    \ some requirement. A common case of that is bundling SQL migrations into an app.\
    \ SQL migrations are a set of SQL queries that need to run to set up a clean database,\
    \ or to change database schema over the course of the applications lifetime.\n\
    \n### Planning database migrations\n\nDatabase migrations can be a tricky thing.\
    \ With common systems, people tend to write database migrations that go both ways\
    \ - up, or down (undo). Since there’s always a possibility of data loss, we will\
    \ only plan migrations that go one way.\n\nLet’s implement the following filesystem\
    \ schema:\n\n```\n1 /db - the main database migration package (generated .go files\
    \ too),\n2 /db/schema/ - a collection of service migrations\n3 /db/schema/stats/\
    \ - migrations for `stats` schema, *.up.sql files\n4 /db/schema/.../ - other service\
    \ migrations...\n```\n\nThe individual migrations should be consistently named,\
    \ for example, a database migration might be stored in the file `2019-11-18-141536-create-message.up.sql`.\
    \ Particularly, we only consider `*.up.sql` to be a migration, and the prefix\
    \ with the full date and time serves as a sorting key, so we know in which order\
    \ the migrations should execute in the database.\n\nIn addition to the actual\
    \ migrations, we need to track the migrations as they have been applied. A migration\
    \ that was already applied shouldn’t run again as it will produce errors, or worse.\
    \ For that we need a migration table, which should be part of every service schema.\n\
    \n```\n1 CREATE TABLE IF NOT EXISTS `migrations` (\n2  `project` varchar(16) NOT\
    \ NULL COMMENT 'Microservice or project name',\n3  `filename` varchar(255) NOT\
    \ NULL COMMENT 'yyyy-mm-dd-HHMMSS.sql',\n4  `statement_index` int(11) NOT NULL\
    \ COMMENT 'Statement number from SQL file',\n5  `status` text NOT NULL COMMENT\
    \ 'ok or full error message',\n6  PRIMARY KEY (`project`,`filename`)\n7 ) ENGINE=InnoDB\
    \ DEFAULT CHARSET=utf8;\n```\n\nWe want to embed these files into our app, and\
    \ at the same time, keep them grouped by service, so only individual migrations\
    \ for a service can be executed. For this purpose, we create a filesystem wrapper\
    \ in `db/fs.go`:\n\n```\n1 type FS map[string]string\n```\n\nWell, that was anti-climactic.\
    \ If you expected some over-engineering here, it really isn’t the point - we’re\
    \ going for simplicity here. The filesystem takes the filename as the key, and\
    \ the file contents as the value. It’s very easy to generate this filesystem,\
    \ as effectively each filesystem is only a few lines of code:\n\n```\n1 package\
    \ db;\n2 \n3 var Stats FS = FS{\n4   \"2019-11-18-141536-create-message.up.sql\"\
    : \"...\",\n5   \"...\": \"...\",\n6 }\n```\n\nIn fact, the filesystems are so\
    \ simple, that we can again resort to simple code generation to implement them.\
    \ We don’t need any kind of compression, and the only issue we need to solve,\
    \ is properly quoting or escaping the file contents, so we can know that the generated\
    \ code won’t produce errors.\n\n### Poor mans file embedding\n\nAh, as we analyze\
    \ how we’re going to generate the filesystem assets, we also realize that the\
    \ poor mans templating from the previous section isn’t really appropriate anymore.\
    \ We need to have a way to loop over the list of migration files, in order to\
    \ generate individual filesystems.\n\nWe still might not want the complexity of\
    \ a Go application to embed these files, so let’s resort to using bash to generate\
    \ the files. The requirements are simple - for each migration for a schema generate\
    \ a filesystem, and generate an index of `map[string]FS`, with a key/value for\
    \ each service.\n\nSince the files contain special characters like newslines and\
    \ back-ticks and aren’t nicely embeddable in Go as is, we will resort to base64\
    \ encoding for the file contents. For that we can use the shell `base64` command,\
    \ which supports encoding and decoding."
