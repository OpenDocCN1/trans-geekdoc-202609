    `\n16   Comment string `db:\"COLUMN_COMMENT\"`\n17 \n18   // Holds the clean data\
    \ type (`int` not `int(11) unsigned` ...)\n19   DataType string `db:\"DATA_TYPE\"\
    `\n20 }\n21 \n22 var ColumnFields = []string{\"COLUMN_NAME\", \"COLUMN_TYPE\"\
    , \"COLUMN_KEY\", \"COLUMN_COMM\\\n23 ENT\", \"DATA_TYPE\"}\n```\n\nAnd we can\
