  trans: "\n\n通过 Clair，项目的意图是持续扫描你的镜像，以发现新发布的漏洞。它不会解决这些问题，但它会让你知道是否需要升级或移除容器中包含的某些包。\n\
    \n通过 `docker-slim`，项目使用静态分析来完成我们之前手动执行的操作。我们知道应用程序并不依赖于 `/bin/` 或 `/sbin/` 文件夹下的任何内容，因此我们可以安全地删除它们而不影响我们的服务。`docker-slim`\
    \ 在此更进了一步，它不仅删除了二进制文件，而且在不引用基础镜像的情况下重建整个镜像，并删除所有可能未使用的内容，甚至可能从你的应用中剥离调试符号，最终得到一个在大小和安全性上都优化的极小镜像。通过它，你的最终构建镜像将类似于从\
    \ `FROM scratch` 开始时得到的镜像。\n\n另一种方法是使用多阶段 Dockerfile，首先在构建镜像（builder image）中安装我们需要的所有内容，然后将所需的文件复制到从\
    \ `scratch` 构建的镜像中。我们可能只需要 `/etc` 文件夹或其子集。这个练习留给读者自行完成。\n\n## Go：实现微服务\n\n我们应该开始为服务编写实际代码了。我们正在编写一个简单的统计收集服务，用于跟踪页面访问量。我们将创建一个用于收集页面访问量的数据库模式，并在过程中不断改进。\n\
    \n### 数据库模式\n\n为了复习一下，我们将实现 `Push()` RPC 调：\n\n```\n 1 service StatsService {\n\
    \ 2   rpc Push(PushRequest) returns (PushResponse);\n 3 }\n 4 \n5 message PushRequest\
    \ {\n 6   string property = 1;\n 7   uint32 section = 2;\n 8   uint32 id = 3;\n\
    \ 9 }\n10 \n11 message PushResponse {}\n```\n\n我创建了一个数据库模式，用于满足我记录请求的用例。除了 RPC\
    \ 的请求数据外，我还添加了 `remote_ip` 和 `stamp` 字段，用于跟踪访问页面的用户以及记录访问的时间。我还定义了一个 `uint64`\
    \ own `id` 主键，我将使用支持 K 排序的 [Sonyflake ID](https://github.com/sony/sonyflake) 来填充它。\n\
    \n| Name | Type | Key | Comment |\n| --- | --- | --- | --- |\n| id | `bigint(20)\
    \ unsigned` | PRI |  ID |\n| property | `varchar(32)` | | 属性名称（可读，a-z） |\n| property_section\
    \ | `int(11) unsigned` | | 属性分区 ID |\n| property_id | `int(11) unsigned` | | 属性项目\
    \ ID |\n| remote_ip | `varchar(255)` | | 发请求用户的远程 IP |\n| stamp | `datetime` |\
    \ | 请求时间戳 |\n\n如你所示，我们的文档生成器已经开始产生价值了。这是我们的迁移脚本，删除了注释以减少冗余：\n\n```\n 1 CREATE\
    \ TABLE `incoming` (\n 2  `id` bigint(20) unsigned\n 3  `property` varchar(32)\n\
    \ 4  `property_section` int(11) unsigned\n 5  `property_id` int(11) unsigned\n\
    \ 6  `remote_ip` varchar(255)\n 7  `stamp` datetime\n 8  PRIMARY KEY (`id`)\n\
    \ 9 );\n10 \n11 CREATE TABLE `incoming_proc` LIKE `incoming`;\n```\n\n我们自动创建 `incoming`\
    \ 的一个副本到 `incoming_proc` 中。这与处理上的注意事项有关——mysql 中重命名表是原子操作，这意味着我们可以执行以下查询并在表之间进行切换：\n\
    \n```\n1 RENAME TABLE incoming TO incoming_old, incoming_proc TO incoming, incoming_old\
    \ TO in\\\ncoming_proc;\n```\n\n`RENAME TABLE` 语句会交换表与表。这样做是为了将我们的读和写操作分离——一张表始终被写入，另一个表被读取并按不同的时间间隔（每小时、按天、按月……）聚合到其他表中。在该服务的上一个版本中，表模式包含一个\
    \ `AUTO_INCREMENT` 的 `ID` 字段。在 InnoDB 中，`AUTO_INCREMENT` 列会触发特殊的表级锁，阻塞其他事务以便它们能够获得连续的主键值。我们没有采用自增字段，因此已经消除了潜在的性能问题源。\n\
    \n添加迁移脚本后，我们运行 `make`，这样我们所有的资源都生成了。\n\n### 改进微服务环境\n\n为了提高一致性，我们对代码生成器进行了一些改进。由于\
    \ `wire` 会生成 `wire_gen.go`，我们将 `types_db.go` 重命名为 `types_gen.go` 以保持一致。我们还注意到迁移结果字段导致了几个命名奇怪的结构体字段：\n\
    \n- `Id`\n- `PropertyId`\n- `RemoteIp`\n\n当我们编写驼峰命名转换器（camelizer）时，我们没有考虑到要符合通用的\
    \ Go 命名规范，例如使用“JSON” 而不是“Json”。让我们通过导入一个处理常见缩写词的包来快速改进代码生成器的这部分。\n\n```\n 1 package\
    \ main\n2 \n3 import (\n4   \"github.com/serenize/snaker\"\n5 )\n6 \n7 func camel(input\
    \ string) string {\n8   return snaker.SnakeToCamel(input)\n9 }\n```\n\n现在我们可以使用\
    \ `ID`、`PropertyID` 和 `RemoteIP` 了。`serenize/snaker` 软件包可以处理这些[首字母缩写词](https://github.com/serenize/snaker)。\n\
    \n通过 `make` 和 `make push` 重新构建镜像，以便 ` - lint` 可以在 CI 中使用。在 Makefile 中添加 `lint`\
    \ 目标：\n\n```\n1 lint:\n   make tidy\n```\n\n并在 `.drone.yml` 中：\n\n```\n1 --- a/.drone.yml\n\
    2 +++ b/.drone.yml\n3 @@ -29,6 +29,7 @@ steps:\n4    commands:\n5      - make\
    \ tidy\n6      - make lint\n7      - make build\n```\n\n我修复了出现的问题，主要是导出字段添加了注释：\n\
    \n```\n1 --- a/templates/client_wire.go\n2 +++ b/templates/client_wire.go\n3 @@\
    \ -15,6 +15,7 @@ function render_wire {\n4         done\n5         echo \")\"\n\
    6 +       // Inject produces a ProviderSet with our clients\n7         echo \"\
    var Inject = wire.NewSet(\"\n8         for schema in $schemas; do\n9         \
    \        echo \"\\t${schema}.New,\"\n```\n\n### 实现 Push\n\n如所述，我们需要一个额外的依赖——由于我们没有\
    \ `AUTO_INCREMENT` 列，我们将使用 Sonyflake 生成器来提供 K 排序的 `uint64` 值。在 `inject` 包中定义以下\
    \ provider：\n\n```\n 1 import (\n 2   \"os\"\n 3   \"strconv\"\n 4 \n5   \"github.com/sony/sonyflake\"\
    \n 6 )\n 7 \n8 // Sonyflake produces a sonyflake dependency\n9 func Sonyflake()\
    \ *sonyflake.Sonyflake {\n10   var serverID uint16\n11   if val, err := strconv.ParseInt(os.Getenv(\"\
    SERVER_ID\"), 10, 16); err == nil {\n12     serverID = uint16(val)\n13   }\n14\
    \   if serverID > 0 {\n15     return sonyflake.NewSonyflake(sonyflake.Settings{\n\
    16       MachineID: func() (uint16, error) {\n17         return serverID, nil\n\
    18       },\n19     })\n20   }\n21   return sonyflake.NewSonyflake(sonyflake.Settings{})\n\
    22 }\n```\n\n更新 `inject` 包中的 ProviderSet：\n\n```go\n1 // Inject is the main ProviderSet\
    \ for wire\n2 var Inject = wire.NewSet(\n3   db.Connect,\n4   Sonyflake,\n5  \
    \ client.Inject,\n6 )\n```\n\n"
