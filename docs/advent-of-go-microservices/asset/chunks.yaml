    \ the following contents:\n\n```\n 1 package internal\n 2 \n 3 import (\n 4  \
    \ \"context\"\n 5 )\n 6 \n 7 type ctxWithoutCancel struct {\n 8   context.Context\n\
    \ 9 }\n10 \n11 // Done returns nil (not cancellable)\n12 func (c ctxWithoutCancel)\
    \ Done() <-chan struct{} { return nil }\n13 \n14 // Err returns nil (not cancellable)\n\
    15 func (c ctxWithoutCancel) Err() error { return nil }\n16 \n17 // ContextWithoutCancel\
    \ returns a non-cancelable ctx\n18 func ContextWithoutCancel(ctx context.Context)\
    \ context.Context {\n19   return ctxWithoutCancel{ctx}\n20 }\n```\n\nWe are only\
    \ partially wrapping the provided context here, so we override `Done` and `Err`,\
    \ but don’t touch the provided `Deadline` or `Value`. Those remaining function\
    \ calls will go to the original context that we embedded here.\n\nWe can fix our\
    \ `Push` function now to clear the context cancellation:\n\n```\n1 // Push a record\
    \ to the incoming log table\n2 func (svc *Server) Push(ctx context.Context, r\
    \ *stats.PushRequest) (*stats.PushRespo\\\n3 nse, error) {\n4   ctx = internal.ContextWithoutCancel(ctx)\n\
    5 ...\n```\n\nFrom now on, each request that reaches `Push()` will be completed,\
    \ regardless if the context for the request was cancelled. Depending on if you\
    \ wish to still error out on some sort of timeout value, you can add a `context.WithTimeout`\
    \ call after this one.\n\nNow, let’s make two changes to our wrk script.\n\n-\
    \ Let’s use `-t60s` so we can test for a longer time period,\n- Let’s use `-c100`\
    \ so we use a bit less connections overall.\n\nRebuild and rerun the service,\
    \ and run the test again:\n\n```\n1 Running 1m test @ http://172.22.0.5:3000/twirp/stats.StatsService/Push\n\
    2   4 threads and 100 connections\n3   Thread Stats   Avg      Stdev     Max \
    \  +/- Stdev\n4     Latency    47.69ms   11.86ms 143.28ms   73.10%\n5     Req/Sec\
    \   527.04     85.10   800.00     73.25%\n6   125930 requests in 1.00m, 13.09MB\
    \ read\n7 Requests/sec:   2097.16\n8 Transfer/sec:    223.23KB\n```\n\nWe can\
    \ look at APM and see that zero errors have been logged during this stress test\
    \ run. This means we have succesfully resolved this issue.\n\n![](images/apm3-4.png)\n\
    \n### Wrapping up\n\nYou can already see the benefit of using Elastic APM. We\
    \ already resolved a misconfiguration issue for our service and database in regards\
    \ to database connection handling and connection limits, as well as fixing a potential\
    \ bug with data loss due to behaviour of the HTTP server implementation and context\
    \ cancellation.\n\nOverall, this chapter is more of a cautionary tale what happens\
    \ if you aren’t super familiar with some internals of database connection handling\
    \ and `http.Request` context. Elastic APM was just the tool that pointed us to\
    \ our pitfalls.\n\n## Go: Background jobs\n\nAPI services, especially low latency\
    \ ones, will resort to background jobs to process data faster on ingesting it,\
    \ and aggregating and flushing it to backend services in an optimal way.\n\n###\
    \ Adding background jobs to our service\n\nIn our stats microservice, we issue\
    \ insert queries for each request directly into the database. The database supports\
    \ extended inserts, meaning we could flush thousands of rows at the same time,\
    \ and actually increase throughput, since adding 10K rows to the database with\
    \ a single query is significantly faster than adding 1 row 1 thousand times over\
    \ multiple connections.\n\nTo take advantage of the bulk insert features of the\
    \ database, we need to start a goroutine that will periodically aggregate and\
    \ flush collected to the database. How often this runs is up to you, but if you\
    \ care about data loss due to service restarts or shutdowns, you’ll need to set\
    \ a reasonably low interval.\n\nTo facilitate creating background jobs (and other\
    \ possible initialization), we can extend our `Server` codegen to satisfy the\
    \ following interface:\n\n```\n1 Init(context.Context) error\n2 Shutdown()\n```\n\
    \nThe `Init` function is there to take the global cancellation context and start\
    \ any background jobs that (hopefully), react to this context as well. When the\
    \ service shuts down, your background jobs can stop accepting new data and flush\
    \ whatever is collected to the database. The `Shutdown` function is there so the\
    \ main program can wait for the background jobs flush to complete.\n\nTo sum up:\
    \ `Init()` starts the job, `context` controls job cancellation, and `Shutdown`\
    \ is there to wait for the cleanup if needed.\n\n```\n 1 --- a/templates/server_server.go.tpl\n\
    \ 2 +++ b/templates/server_server.go.tpl\n 3 @@ -13,4 +13,15 @@ type Server struct\
    \ {\n 4         db *sqlx.DB\n 5  }\n 6  \n 7 +// Init can start background jobs\n\
    \ 8 +func (*Server) Init(_ context.Context) error {\n 9 +       // Any background\
    \ jobs go here,\n10 +       // ctx has global signal cancellation\n11 +      \
    \ return nil\n12 +}\n13 +\n14 +// Shutdown is a cleanup hook after SIGTERM\n15\
    \ +func (*Server) Shutdown() {\n16 +}\n```\n\nLet’s modify the template for `main.go`\
    \ to call `Init` and `Shutdown` appropriately. We also start the service itself\
    \ as a goroutine, and wait for context cancellation in main. As soon as the context\
    \ will be cancelled, `srv.Shutdown()` will be called.\n\n```\n 1 --- a/templates/cmd_main.go.tpl\n\
    \ 2 +++ b/templates/cmd_main.go.tpl\n 3 @@ -43,9 +43,14 @@ func main() {\n 4 \
    \        if err != nil {\n 5                 log.Fatalf(\"Error in service.New():\
    \ %+v\", err)\n 6         }\n 7 -\n8 +       if err := srv.Init(ctx); err != nil\
    \ {\n9 +               log.Fatal(err)\n10 +       }\n11         twirpHandler :=\
    \ ${SERVICE}.New${SERVICE_CAMEL}ServiceServer(srv, internal.Ne\\\n12 wServer())\n\
    13  \n14         log.Println(\"Starting service on port :3000\")\n15 -       http.ListenAndServe(\"\
    :3000\", internal.WrapAll(twirpHandler))\n16 +       go http.ListenAndServe(\"\
    :3000\", internal.WrapAll(twirpHandler))\n17 +       <-ctx.Done()\n18 +\n19 +\
    \       srv.Shutdown()\n20  }\n```\n\n### Do we really need Init?\n\nLooking at\
    \ the code, the `Init()` function may be redundant. Wire already takes `ctx`,\
    \ we just need to see if we can actually start a goroutine from there. Let’s see\
    \ what wire can do in our case, let’s try to modify `wire.go`:\n\n```\n 1 func\
    \ New(ctx context.Context) (*Server, error) {\n 2   s := new(Server)\n 3   wire.Build(\n\
    \ 4     inject.Inject,\n 5     wire.Struct(new(Server), \"*\"),\n 6   )\n 7  \
    \ if err := s.Background(); err != nil {\n 8     return nil, err\n 9   }\n10 \
    \  return s, nil\n11 }\n```\n\nUnfortunately this results in the following error\
    \ message:\n\n> wire: a call to wire.Build indicates that this function is an\
    \ injector, but injectors must consist of only the wire.Build call and an optional\
    \ return\n\nAnother option would be to just create a dependency for the background\
    \ job. This way you would just add the field to the `Server` struct, and let wire\
    \ invoke it and provide dependencies to it as well.\n\nStarting up the background\
    \ job would be taken care of, but we’d still need to issue the Shutdown signal\
    \ here. The main questions we should answer here:\n\n- Do we want the background\
    \ Job(s?) to have their own API?\n- Is the responsibility between `Server` and\
    \ `Background` shared?\n\nThese are tough questions. From the perspective of a\
    \ microservice, the complete implementation serves a single responsibility. From\
    \ the perspective of individual components, a background service is distinctly\
    \ different from the API layer, and the relationship between them may be 1:N.\n"
  trans: "\n我们还需要保留已有的上下文（context）键值，这样我们才能将跨度（span）正确地记录到 APM 中。我们不能直接使用 `context.Background()`，我们需要提供自己的上下文实现，以保留所有已由\
    \ APM HTTP 处理器包装器设置的值。\n\n让我们提供一个不带超时/取消的上下文。我们需要实现接口中的两个函数，而其他部分可以保持不变。我们可以使用嵌入（embedding），这样我们就不需要实现完整的\
    \ context 接口，只需实现所需的两个函数即可。\n\n导航到 `internal` 包，将 `context.go` 移动到 `context_ip.go`，并创建一个包含以下内容的新\
    \ `context.go` 文件：\n\n```\n 1 package internal\n 2 \n 3 import (\n 4   \"context\"\
    \n 5 )\n 6 \n 7 type ctxWithoutCancel struct {\n 8   context.Context\n 9 }\n10\
    \ \n11 // Done 返回 nil（不可取消）\n12 func (c ctxWithoutCancel) Done() <-chan struct{}\
    \ { return nil }\n13 \n14 // Err 返回 nil（不可取消）\n15 func (c ctxWithoutCancel) Err()\
    \ error { return nil }\n16 \n17 // ContextWithoutCancel 返回一个不可取消的 ctx\n18 func\
    \ ContextWithoutCancel(ctx context.Context) context.Context {\n19   return ctxWithoutCancel{ctx}\n\
    20 }\n```\n\n我们在这里只对提供的上下文进行了部分封装，因此我们覆盖了 `Done` 和 `Err`，但没有触碰提供的 `Deadline` 或\
    \ `Value`。剩余的函数调用将进入我们在这里嵌入的原始上下文。\n\n我们现在可以修复 `Push` 函数以清除上下文取消状态了：\n\n```\n\
    1 // 向传入的日志表推送一条记录\n2 func (svc *Server) Push(ctx context.Context, r *stats.PushRequest)\
    \ (*stats.PushRes\\\n3 nse, error) {\n4   ctx = internal.ContextWithoutCancel(ctx)\n\
    5 ...\n```\n\n从现在起，每个到达 `Push()` 的请求都将完成，无论该请求的上下文是否被取消。取决于你是否仍希望在某种超时值达到时报错，可以在此之后添加\
    \ `context.WithTimeout` 调用。\n\n现在，让我们对我们的 wrk 脚本进行两处更改。\n\n- 使用 `-t60s`，以便我们可以测试更长时间段。\n\
    - 使用 `-c100`，让我们总体使用的连接数少一点。\n\n重新构建并运行服务，再次运行测试：\n\n```\n1 Running 1m test @\
    \ http://172.22.0.5:3000/twirp/stats.StatsService/Push\n2   4 threads and 100\
    \ connections\n3   Thread Stats   Avg      Stdev     Max   +/- Stdev\n4     Latency\
    \    47.69ms   11.86ms 143.28ms   73.10%\n5     Req/Sec   527.04     85.10   800.00\
    \     73.25%\n6   125930 requests in 1.00m, 13.09MB read\n7 Requests/sec:   2097.16\n\
    8 Transfer/sec:    223.23KB\n```\n\n我们可以查看 APM 并发现在在此压力测试运行期间没有记录任何错误。这意味着我们成功地解决了此问题。\n\
    \n![](img/apm3-4.png)\n\n### 总结\n\n你已经可以看到使用 Elastic APM 的用处了。我们已经解决了服务和数据库在数据库连接处理和连接限制方面的配置错误，还修复了由于\
    \ HTTP 服务器实现行为和上下文取消导致潜在数据丢失的 Bug。\n\n总的来说，这一章介绍了如何通过自定义上下文来确保 APM 跟踪的完整性，并处理了复杂的请求生命周期问题。\n"
