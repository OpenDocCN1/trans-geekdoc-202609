    \ \"_\", -1)\n3   for k, v := range parts {\n4     parts[k] = strings.ToUpper(v[0:1])\
    \ + v[1:]\n5   }\n6   return strings.Join(parts, \"\")\n7 }\n```\n\n### Querying\
    \ information schema\n\nIn our `cmd/db-schema-cli/main.go` file, we need to set\
    \ up the database connection, query the schema and produce the raw structures\
