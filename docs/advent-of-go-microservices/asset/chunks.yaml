- raw: "and include `*sonyflake.Sonyflake` in the `Server{}` definition for the stats\
    \ service. Wire will regenerate the wire_gen.go file, where the sonyflake generator\
    \ will be created.\n\nImplementing our Push RPC with all the scaffolding which\
    \ we have now is pretty trivial:\n\n```\n 1 package stats\n 2 \n 3 import (\n\
    \ 4   \"context\"\n 5   \"fmt\"\n 6   \"strings\"\n 7   \"time\"\n 8 \n 9   \"\
    github.com/titpetric/microservice/rpc/stats\"\n10 )\n11 \n12 // Push a record\
    \ to the incoming log table\n13 func (svc *Server) Push(ctx context.Context, r\
    \ *stats.PushRequest) (*stats.PushRespo\\\n14 nse, error) {\n15   var err error\n\
    16   row := Incoming{}\n17 \n18   row.ID, err = svc.sonyflake.NextID()\n19   if\
    \ err != nil {\n20     return nil, err\n21   }\n22 \n23   row.Property = r.Property\n\
    24   row.PropertySection = r.Section\n25   row.PropertyID = r.Id\n26   row.RemoteIP\
    \ = \"127.0.0.1\"\n27   row.SetStamp(time.Now())\n28 \n29   fields := strings.Join(IncomingFields,\
    \ \",\")\n30   named := \":\" + strings.Join(IncomingFields, \",:\")\n31 \n32\
    \   query := fmt.Sprintf(\"insert into %s (%s) values (%s)\", IncomingTable, fields,\
    \ nam\\\n33 ed)\n34   _, err = svc.db.NamedExecContext(ctx, query, row)\n35  \
    \ return nil, err\n36 }\n```\n\nThis is an initial implementation. There are two\
    \ notable things to take care of. Since the Stamp field was mapped into a `*time.Time`,\
    \ we can’t assign the output of `time.New() time.Time` directly to it. Since I\
    \ don’t particularly like wrapping a `timeNewPtr() *time.Time` in every service,\
    \ I modified the code generator to add a setter for this field type:\n\n```\n\
    \ 1 ...\n 2   for _, table := range tables {\n 3     fields := []string{}\n 4\
    \     primary := []string{}\n 5     setters := []string{}\n 6 ...\n 7       if\
    \ columnType == \"*time.Time\" {\n 8         setters = append(setters, []string{\n\
    \ 9           fmt.Sprintf(\"// Set%s sets %s which requires a *time.Time\", columnName,\
    \ co\\\n10 lumnName),\n11           fmt.Sprintf(\"func (s *%s) Set%s(t time.Time)\
    \ { s.%s = &t }\", tableName, co\\\n12 lumnName, columnName),\n13         }...)\n\
    14       }\n15 ...\n16     for _, v := range setters {\n17       fmt.Fprintln(buf,\
    \ v)\n18     }\n19     if len(setters) > 0 {\n20       fmt.Fprintln(buf)\n21 \
    \    }\n22 \n23 ...\n```\n\nAnd the other thing is still a TODO item - I want\
    \ to log the Remote IP of the request. Now, since we’re dealing with a Twirp implementation,\
    \ we know that we have a `*http.Request` as the entrypoint. This is the first\
    \ real divergence between the implementation of a Twirp or a gRPC service.\n\n\
    What we need to do to get the IP here is to wrap our twirp handler in our own\
    \ http.Handler, which gets the information about the IP from the `*http.Request`,\
    \ and updates the context so we can get the value for this field from the context\
    \ passed to our handler.\n\n1.  http.Request provides a `Context() context.Context`\
    \ function to get the request,\n\n2.  http.Request provides a `WithContext(context.Context)\
    \ *Request` to build a new *Request\n\nThis should be pretty simple. Let’s see\
    \ if we can do it on the first try (no cheating!). To help you out with some starting\
    \ code, this is a wrapped handler:\n\n```\n 1 --- a/templates/cmd_main.go.tpl\n\
    \ 2 +++ b/templates/cmd_main.go.tpl\n 3 @@ -15,6 +15,12 @@ import (\n 4      \
    \   server \"${MODULE}/server/${SERVICE}\"\n 5  )\n 6  \n 7 +func wrapWithIP(h\
    \ http.Handler) http.Handler {\n 8 +       return http.HandlerFunc(func(w http.ResponseWriter,\
    \ r *http.Request) {\n 9 +               h.ServeHTTP(w, r)\n10 +       })\n11\
    \ +}\n12 +\n13  func main() {\n14         ctx := context.TODO()\n15  \n16 @@ -25,5\
    \ +31,5 @@ func main() {\n17  \n18         twirpHandler := ${SERVICE}.New${SERVICE_CAMEL}ServiceServer(srv,\
    \ nil)\n19  \n20 -       http.ListenAndServe(\":3000\", twirpHandler)\n21 +  \
    \     http.ListenAndServe(\":3000\", wrapWithIP(twirpHandler))\n22  }\n```\n\n\
    Now stop reading and go write your wrapper!\n\nI said no cheating? Read the IP\
    \ from a HTTP Request{}, set it into a context, and then come back when you have\
    \ it working!\n\nOk, enough of that. Let’s see what I did on the first try:\n\n\
    ```\n 1 func wrapWithIP(h http.Handler) http.Handler {\n 2   return http.HandlerFunc(func(w\
    \ http.ResponseWriter, r *http.Request) {\n 3     // get IP address\n 4     ip\
    \ := func() string {\n 5       headers := []string{\n 6         http.CanonicalHeaderKey(\"\
    X-Forwarded-For\"),\n 7         http.CanonicalHeaderKey(\"X-Real-IP\"),\n 8  \
    \     }\n 9       for _, header := range headers {\n10         if addr := r.Header.Get(header);\
    \ addr != \"\" {\n11           return strings.SplitN(addr, \", \", 2)[0]\n12 \
    \        }\n13       }\n14       return strings.SplitN(r.RemoteAddr, \":\", 2)[0];\n\
    15     }()\n16 \n17     ctx := r.Context()\n18     ctx = context.WithValue(ctx,\
    \ \"ip.address\", ip)\n19 \n20     h.ServeHTTP(w, r.WithContext(ctx))\n21   })\n\
    22 }\n```\n\nI implemented a wrapper that checks `X-Forwarded-For` and `X-Real-IP`\
    \ headers, and returns the first relevant IP listed in there. In case none of\
    \ these headers are present, I take `r.RemoteAddr`, and strip away the port number\
    \ which is expected from reading the docs.\n\nLet’s modify our Push implementation\
    \ to read from the context:\n\n```\n1   if remoteIP, ok := ctx.Value(\"ip.address\"\
    ).(string); ok {\n2     row.RemoteIP = remoteIP\n3   }\n```\n\nSo, at worst -\
    \ the RemoteIP field will be empty. Hopefully I didn’t do too bad of a job above\
    \ and we will see a real IP get logged into the database when we issue our first\
    \ request to the service.\n\n## Docker/Bash: Issuing requests against our microservice\n\
    \nIn order to test our microservice, we require a database, running migrations,\
    \ and our service itself. We’re going to build a docker-compose.yml file which\
    \ takes care of all of this.\n\n### The docker-compose file\n\nIn order to use\
    \ the docker-compose.yml file, first you need to run `make && make docker` to\
    \ build the required docker images.\n\nI started with a simple docker-compose.yml\
    \ file, like this:\n\n```\n 1 version: '3.4'\n 2 \n 3 services:\n 4   stats:\n\
    \ 5     image: titpetric/service-stats\n 6     restart: always\n 7     environment:\n\
    \ 8       DB_DSN: \"stats:stats@tcp(db:3306)/stats\"\n 9 \n10   migrations:\n\
    11     image: titpetric/service-db-migrate-cli\n12     command: [\n13       \"\
    -db-dsn=stats:stats@tcp(db:3306)/stats\",\n14       \"-service=stats\",\n15  \
    \     \"-real=true\"\n16     ]\n17 \n18   db:\n19     image: percona/percona-server:8.0.17\n\
    20     environment:\n21       MYSQL_ALLOW_EMPTY_PASSWORD: \"true\"\n22       MYSQL_USER:\
    \ \"stats\"\n23       MYSQL_DATABASE: \"stats\"\n24       MYSQL_PASSWORD: \"stats\"\
    \n25     restart: always\n```\n\nRunning a microservice requires some coordination\
    \ between containers, which we will do by hand, because:\n\n*   migrations aren’t\
    \ part of our service,\n\n*   we don’t have database reconnect logic yet so migrations\
    \ don’t wait for the database to become available\n\nWe will fix that, but for\
    \ now lets do some of the manual legwork in order to make this work. Issue the\
    \ following commands:\n\n```\n1 # first run the database\n2 docker-compose up\
    \ -d db\n3 # wait for a bit so it gets provisioned\n4 sleep 30\n5 # run migrations\n\
    6 docker-compose run --rm migrations\n7 # run our service\n8 docker-compose up\
    \ -d\n```\n\nNow, generally anytime you’d just do `docker-compose up -d` should\
    \ bring up our service, database, and update the migrations (leaving a container\
    \ behind since docker-compose doesn’t have a `rm: true` option we could use here).\
    \ This is why we should update the migrations to be run from our service with\
    \ a particular command line parameter or environment flag. We’ll come back to\
    \ that.\n\nIf you did everything correctly, `docker-compose ps` should output\
    \ something like:\n\n```\n1         Name                     Command         \
    \     State          Ports       \n2 ---------------------------------------------------------------------------------\n\
    3 microservice_db_1      /docker-entrypoint.sh mysqld   Up      3306/tcp, 33060/tcp\n\
    4 microservice_stats_1   /app/service                   Up      3000/tcp     \
    \      \n```\n\n### Our first request"
