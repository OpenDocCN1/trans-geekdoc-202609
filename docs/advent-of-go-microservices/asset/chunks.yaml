  trans: "\n如果我们实现多个后台任务，微服务的 `Shutdown()` 函数将仅仅是各个后台任务关闭的代理。如果我们不这样做，它可能会变成乱条代码（spaghetti\
    \ code），这本身就是一种责任共享的异味。\n\n如果我们现在与 `Server{}` 相同的级别上实现后台任务，我们就不需要为每个任务重新指定依赖项。这看起来可能是个好主意，直到你意识到这再次模糊了微服务所需与特定后台任务所需之间的边界。如果说我们学到了什么，那就是我们需要倾向于使用显式声明，而不是隐式作用域。这样，就能清楚地看到后台任务具体需要什么。\n\
    \n由于我们只是通过 `Init` 增加了一层间接，并模糊了后台任务与微服务 API 之间各种职责和依赖，让我们移除 `Init()`，并根据单一职责原则来实现我们的后台任务。\n\
    \n当我们做出这个决定时，我们也意识到在这种情况下替换后台任务的实现是轻而举的——我们只需要满足为后台任务 API 创建任何接口即可。如果它与 `Server{}`\
    \ 合并，那么在以后某个时刻进行隔离和重构可能会出现问题。\n\n从我们的生成器中移除 `Init`，让我们创建一个后台任务。\n\n### 后台任务\n\n\
    在这里遵循一些命名约定是，以确保我们的后台任务设计时考虑了单一职责。对此，我引用 [Effective Go - 接口命名](https://golang.org/doc/effective_go.html#interface-names)：\n\
    \n我们并不是在创建一个通用接口，但由于结构体在这里有特定的用途，我们可以对我们的结构体使用相同的命名约定。我们将创建一个 `Flusher`。\n\n在\
    \ `server/stats/` 下创建 `flusher.go`：\n\n```\n 1 package stats\n 2 \n3 import (\n\
    \ 4   \"context\"\n 5   \"log\"\n 6   \"time\"\n 7 \n 8   \"github.com/jmoiron/sqlx\"\
    \n 9   \"go.uber.org/atomic\"\n10 )\n```\n\n我们导入了 [go.uber.org/atomic](https://godoc.org/go.uber.org/atomic)\
    \ 用于标准库 `sync/atomic` 的封装。它们提供了封装的数据类型，使其更容易以线程安全的方式处理值。\n\n```\n1 // Flusher\
    \ 是一个上下文驱动的后台数据刷新任务\n2 type Flusher struct {\n3   context.Context\n4   finish\
    \ func()\n5 \n6   enabled *atomic.Bool\n7 \n8   db *sqlx.DB\n9 }\n```\n\n我们的 `Flusher{}`\
    \ 结构体嵌入了 `context.Context`，因此我们不需要编写自己的 `Shutdown` 函数，而是调用 `<-flusher.Done()`\
    \ 来等待它优雅地结束。这是一个本地取消上下文。\n\n```\n 1 // NewFlusher 创建一个 *Flusher\n 2 func NewFlusher(ctx\
    \ context.Context, db *sqlx.DB) (*Flusher, error) {\n 3   job := &Flusher{\n 4\
    \     db:      db,\n 5     enabled: atomic.NewBool(true),\n 6   }\n 7   job.Context,\
    \ job.finish = context.WithCancel(context.Background())\n 8   go job.run(ctx)\n\
    \ 9   return job, nil\n10 }\n```\n\n在创建 flusher 时，我们设置了依赖项，启用了向 flusher 推送数据的功能（`enabled=true`），并设置了取消上下文。\n\
    \n```\n 1 func (job *Flusher) run(ctx context.Context) {\n 2   log.Println(\"\
    Started background job\")\n 3 \n 4   defer job.finish()\n 5 \n 6   ticker := time.NewTicker(time.Second)\n\
    \ 7 \n 8   for {\n 9     select {\n10     case <-ticker.C:\n 11       job.flush()\n\
    \ 12       continue\n 13     case <-ctx.Done():\n 14       log.Println(\"Got cancel\"\
    )\n 15       job.enabled.Store(false)\n 16       job.flush()\n 17     }\n 18 \
    \    break\n19   }\n20 \n21   log.Println(\"Exiting Run\")\n22 }\n```\n\n后台任务本身监听全局取消（`ctx.Done()`），并在接收后禁用向队列推送数据。我们还创建了一个\
    \ ticker 每秒运行一次刷新任务。\n\n```\n 1 func (job *Flusher) flush() {\n 2   log.Println(\"\
    Background flush\")\n3 }\n```\n\n此时，我们的 flusher 是一个空操作，我们只是打印了一条日志以确保它工作正常。让我们调整\
    \ `server.go` 以包含 flusher 依赖项，并创建我们的 `Shutdown` 函数：\n\n```\n 1 // Server implements\
    \ stats\n 2 type Server struct {\n 3   db *sqlx.DB\n 4 \n 5   sonyflake *Sonyflake\n\
    \ 6   flusher *Flusher\n 7 }\n 8 \n9 // Shutdown 是 SIGTERM 钩子\n10 func (s *Server)\
    \ Shutdown() {\n11   <-s.flusher.Done()\n12 }\n```\n\n我们所做的只是一些清理工作。\n\n### 清理工作\n\
    \n我们需要添加 `NewFlusher` 来连接一切。\n"
