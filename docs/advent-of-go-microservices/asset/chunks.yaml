- raw: "```\n 1 #!/bin/bash\n 2 cd $(dirname $(dirname $(readlink -f $0)))\n 3 \n\
    \ 4 ## encode file contents in base64\n 5 function base64_encode {\n 6   cat $1\
    \ | base64 -w 0\n 7 }\n 8 \n 9 ## generate a service FS\n10 function render_service_schema\
    \ {\n11   local schema=$(basename $1)\n12   echo \"package db;\"\n13   echo\n\
    14   echo \"var $schema FS = FS{\"\n15   local files=$(find $1 -name '*.sql' |\
    \ sort)\n16   for file in $files; do\n17     echo \"\\\"$(basename $file)\\\"\
    : \\\"$(base64_encode $file)\\\",\"\n18   done\n19   echo \"}\"\n20 }\n21 \n22\
    \ ## list all service FS into `migrations` global\n23 function render_schema {\n\
    24   echo \"package db;\"\n25   echo\n26   echo \"var migrations map[string]FS\
    \ = map[string]FS{\"\n27   for schema in $schemas; do\n28     local package=$(basename\
    \ $schema)\n29     echo \"\\\"${package}\\\": ${package},\"\n30   done\n31   echo\
    \ \"}\"\n32 }\n33 \n34 ## list all service migrations (db/schema/stats, ...)\n\
    35 schemas=$(ls db/schema/*/migrations.sql | xargs -n1 dirname)\n36 for schema\
    \ in $schemas; do\n37   # db/schema/stats -> schema/stats\n38   schema_relative=${schema/db\\\
    //}\n39   # schema/stats -> db/schema_stats.go\n40   output=\"db/${schema_relative/\\\
    //_}.go\"\n41 \n42   render_service_schema $schema > $output\n43 done\n44 \n45\
    \ render_schema > db/schema.go\n```\n\nAll that’s left to do here is just to run\
    \ `go fmt` on the resulting go files. As that is already handled in our Drone\
    \ CI steps, we have now succesfully prepared the required SQL migrations into\
    \ the `db` package so we can use it from here.\n\nAs we have now embedded all\
    \ the database migrations into go code, we can move on towards running these migrations\
    \ on a real database as part of our CI testing suite.\n\n## Go: Scaffolding database\
    \ migrations\n\nAs we prepared the database migration files and embedded them\
    \ into the db package, we are now left to implement the details required to process\
    \ these migrations. Let’s start with extending the FS type, to actually provide\
    \ functionality for reading them.\n\n```\n1 // ReadFile returns decoded file contents\
    \ from FS\n2 func (fs FS) ReadFile(filename string) ([]byte, error) {\n3   if\
    \ val, ok := fs[filename]; ok {\n4     return base64.StdEncoding.DecodeString(val)\n\
    5   }\n6   return nil, os.ErrNotExist\n7 }\n```\n\nReading a file from our FS\
    \ type is super simple. All we need to do is check that the file we are trying\
    \ to read actually exists, and base64 decode it. In order to be somewhat compliant\
    \ to the standard practice for reading files, we return an `os.ErrNotExist` error\
    \ in case the file we’re trying to read isn’t there.\n\nLet’s also add a migrations\
    \ helper, that will list the migrations inside the filesystem, so that we can\
    \ just loop over them and run them one by one. It only lists actual migration\
    \ files (`*.up.sql`), and doesn’t return any other files embedded (`migrations.sql`\
    \ for one). The files are sorted into their expected execution order.\n\n```\n\
    \ 1 // Migrations returns list of SQL files to execute\n 2 func (fs FS) Migrations()\
    \ []string {\n 3   result := []string{}\n 4   for filename, contents := range\
    \ fs {\n 5     // skip empty files\n 6     if contents == \"\" {\n 7       continue\n\
    \ 8     }\n 9     if matched, _ := filepath.Match(\"*.up.sql\", filename); matched\
    \ {\n10       result = append(result, filename)\n11     }\n12   }\n13   sort.Strings(result)\n\
    14   return result\n15 }\n```\n\nWe also need a structure for our migration schema\
    \ (`migration.sql`), and this is it:\n\n```\n 1 package db\n 2 \n 3 type (\n 4\
    \   migration struct {\n 5     Project        string `db:\"project\"`\n 6    \
    \ Filename       string `db:\"filename\"`\n 7     StatementIndex int    `db:\"\
    statement_index\"`\n 8     Status         string `db:\"status\"`\n 9   }\n10 )\n\
    11 \n12 func (migration) Fields() []string {\n13   return []string{\"project\"\
    , \"filename\", \"statement_index\", \"status\"}\n14 }\n```\n\nThe fields are\
    \ as follows:\n\n*   `project` denotes the migration group / service (e.g. `stats`),\n\
    \n*   `filename` is a migration from that group (`2019-11-26-092610-description-here.up.sql`),\n\
    \n*   `statement_index` - the sequential statement index from a migration,\n\n\
    *   `status` - this will either be “ok”, or the error produced from a failing\
    \ migration\n\nTo explain `statement_index`: each migration can be several SQL\
    \ queries. A common case is to import the complete database schema inside one\
    \ migration, where a migration will be several `CREATE TABLE` statements in a\
    \ single file. We need to split this file with a delimiter `;`, which should be\
    \ at the end of the line. For this we can use the `;$` regular expression to split\
    \ the migration into statements, remove empty statements, and return a list of\
    \ them. The list key is the statement index.\n\nThe Fields() function there is\
    \ to help us issue queries against the database. In order to issue a full `INSERT`\
    \ (or `REPLACE`,…), we need to list the database table fields. The other way to\
    \ do it would be to use reflection, but that’s overkill. This function helps us\
    \ to remove some of the field stutter which applies to data insertion/update.\n\
    \nWe can produce a helper function, that takes the result of `FS.ReadFile`:\n\n\
    ```\n 1 func statements(contents []byte, err error) ([]string, error) {\n 2  \
    \ result := []string{}\n 3   if err != nil {\n 4     return result, err\n 5  \
    \ }\n 6   stmts := regexp.MustCompilePOSIX(\";$\").Split(string(contents), -1)\n\
    \ 7   for _, stmt := range stmts {\n 8     stmt = strings.TrimSpace(stmt)\n 9\
    \     if stmt != \"\" {\n10       result = append(result, stmt)\n11     }\n12\
    \   }\n13   return result, nil\n14 }\n```\n\nThis way, we can produce the statements\
    \ from a migration file in the following way:\n\n```\n1 stmts, err := statements(migrations[\"\
    stats\"].ReadFile(\"migrations.sql\"))\n```\n\nThe result from ReadFile is expanded\
    \ into the function parameters here. The error checking here is a bit reduced,\
    \ on account that the error is just propagated forward.\n\n### The migration API\n\
    \nSo now that we have all the required structures and functions to read migrations\
    \ and split them into statements, we need to consider the migration API. I would\
    \ like to provide the following functionality from this package:\n\n*   `List()\
    \ []string` - should list the service names for the embedded migrations\n\n* \
    \  `Print(project string) error` - output the migration queries with log.Println,\n\
    \n*   `Run(project string, db *sqlx.DB) error` - pass a database handle and project\
    \ name to run migrations\n\nThis gives us the ability to write a cli tool, that\
    \ can print or run specific migrations. Let’s start with the low hanging fruit:\
    \ List():\n\n```\n1 func List() []string {\n2   result := []string{}\n3   for\
    \ k, _ := range migrations {\n4     result = append(result, k)\n5   }\n6   return\
    \ result\n7 }\n```\n\nThe function will run only once, and isn’t performance intensive,\
    \ but for a small exercise, let’s rewrite that into an efficiently allocated function.\
    \ I do this so often that it becomes second nature, just to avoid inefficient\
    \ allocations with append().\n\n```\n1 func List() []string {\n2   result := make([]string,\
    \ len(migrations))\n3   i := 0\n4   for k, _ := range migrations {\n5     result[i]\
    \ = k\n6   }\n7   return result\n8 }\n```\n\nWhich leaves us with Print and Run\
    \ functions. Let’s start with Print, since it doesn’t require us to set up a database\
    \ just yet. The goal is to get the project filesystem and list the statements\
    \ for the contained migrations. Let’s implement `cmd/db-migrate-cli/main.go`:\n\
    \n```\n 1 package main\n 2 \n 3 import (\n 4   \"log\"\n 5 \n 6   \"github.com/titpetric/microservice/db\"\
    \n 7 )\n 8 \n 9 func main() {\n10   log.Printf(\"Migration projects: %+v\", db.List())\n\
    11   log.Println(\"Migration statements for stats\")\n12   if err := db.Print(\"\
    stats\"); err != nil {\n13     log.Printf(\"An error occured: %+v\", err)\n14\
    \   }\n15 }\n```\n\nWe will extend this file over our development, but for now\
    \ we are only interested in verifying that the API which we will create is functional.\
    \ We could make unit tests, but this is just as good as we need this tool in any\
    \ case. We cannot verify validity of the data just yet, the only thing we can\
    \ do is to verify that the data is there, and can be read."
