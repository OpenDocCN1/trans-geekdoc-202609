    10 \n 11 - name: build\n 12   image: titpetric/microservice-build\n 13   pull:\
    \ always\n 14   commands:\n 15     - make tidy\n 16     - make wire ./...\n 17\
    \     - make lint\n 18     - make build\n```\n\n这些更改允许我们删除了 `drone.yml` 中的以下内容：\n\
    \n```bash\n1     -bash -c 'while : do  sleep 1 ; $(cat < /dev/null > /tcp/mysql-test:3306)\
    \ ) break ; done'\n```\n\n事实上，我们删除了整个迁移步骤。由于已经配置了数据库服务，我们就不需要在 build 镜像中劫持 `percona`\
    \ 镜像来安装客户端。现在我们需要做的就是通过 `make` 验证一切符合预期：\n\n```bash\n 1 ...\n 2 [codegen:27] +\
    \ make migrate\n 3 [codegen:28] ./build/db-migrate-cli-linux-amd64 -service stats\
    \ -dbn \"migrations:migrations@tcp(mysql-test:3306)/migrations\" -real=true\n\
    \ 4 [codegen:29] connecting to database migrations:migrations@tcp(mysql-test:3306)/migrations\n\
    \ 5 [codegen:30] can't connect, dsn=migrations:migrations@tcp(mysql-test:3306)/migrations,\
    \ err=dial tcp 192.168.96.2:3306: connect: refused, try=1\n 6 [codegen:31] can't\
    \ connect, dsn=migrations:migrations@tcp(mysql-test:3306)/migrations, err=dial\
    \ tcp 192.168.96.2:3306: connect: refused, try=2\n 7 [codegen:32] can't connect,\
    \ dsn=migrations:migrations@tcp(mysql-test:3306)/migrations, err=dial tcp 192.168.96.2:3306:\
    \ connect: refused, try=3\n 8 [codegen:33] Running migrations from migrations.sql\n\
    ```\n\n最后，我们需要在服务的 `main.go` 文件中添加一个选项，以便在服务启动时运行迁移，从而简化我们的 `docker-compose.yml`。让我们使用小巧而有效的\
    \ [sigctx](https://github.com/sentRG/sigctx) 包处理通过信号的上下文取消：\n\n```go\n 1 --- a/templates/cmd_main.go.tpl\n\
    \ 2 +++ b/templates/cmd_main.go.tpl\n 3 @@ -4,20 +4,41 @@ package main\n 4  //\
    \ generator and template: templates/cmd_main.go.tpl\n 5 \n 6  import (\n 7 + \
    \      \"flag\"\n 8         \"log\"\n 9 -       \"context\"\n 10 \n 11       \
    \  \"net/http\"\n 12 \n 13         _ \"github.com/go-sql-driver/mysql\"\n 14 +\
    \       \"github.com/sentRG/sigctx\"\n 15 \n 16       \"${MODULE}/db\"\n 17  \
    \       \"${MODULE}/internal\"\n 18         \"${MODULE}/rpc/${SERVICE}\"\n 19\
    \         server \"${MODULE}/server/${SERVICE}\"\n 20  )\n 21 \n 22  func main()\
    \ {\n 23 -       ctx := context.TODO()\n 24 +       var config struct {\n 25 \
    \              migrate bool\n 26               migrateDB db.ConnectionOptions\n\
    \ 27       }\n 28       flag.StringVar(&config.migrateDB.Driver, \"migrate-driver\"\
    , \"\", \"Migrations: driver\")\n 29       flag.StringVar(&config.migrateDB.DSN,\
    \ \"migrate-dsn\", \"\", \"DSN for database connection\")\n 30       flag.BoolVar(&config.migrate,\
    \ \"migrate\", false, \"Run migrations?\")\n 31       flag.Parse()\n 32 \n 33\
    \       ctx := sigctx.New()\n 34 \n 35       if config.migrate {\n 36        \
    \       handle, err := db.ConnectWithRetry(ctx, config.migrateDB)\n 37       \
    \        if err != nil {\n 38                       log.Fatalf(\"Error connecting\
    \ to database: %+v\", err)\n 39               }\n 40               if err := db.Run(\"\
    ${SERVICE}\", handle); err != nil {\n 41                       log.Fatalf(\"An\
    \ error occured: %+v\", err)\n 42               }\n 43       }\n 44 + \n 45  \
    \     log.Println(\"Starting service on port :3000\")\n 46       http.ListenAndServe(\"\
    :3000\", internal.WrapWithIP(twirpHandler))\n 47  }\n```\n\n我们在开始监听请求之前，还添加了一些输出：\n\
    \n```go\n   log.Println(\"Starting service on port :3000\")\n   http.ListenAndServe(\"\
    :3000\", internal.WrapWithIP(twirpHandler))\n```\n\n### 重测绑定的迁移\n\n我们现在可以简化 `docker-compose.yml`\
    \ 配置，直接从我们的服务运行迁移。自动迁移不是你在生产环境中想要运行的，但它极大简化了我们的测试/开发，因为数据库内容通常会被丢弃。\n\n```yaml\n\
    \ 1 version: '3.4'\n 2 \n 3 services:\n 4   stats:\n 5     image: titpetric/service-stats\n\
    \ 6     restart: always\n 7     environment:\n 8       DB_DSN: \"stats:stats@tcp(db:3306)/stats\"\
    \n 9     command: [\n10       \"-migrate-db-dsn=stats:stats@tcp(db:3306)/stats\"\
    ,\n11       \"-migrate\"\n 12     ]\n 13 \n 14   db:\n 15     image: percona/percona-server:8.0.17\n\
    \ 16     environment:\n 17       MYSQL_ALLOW_EMPTY_PASSWORD: \"true\"\n 18   \
    \    MYSQL_USER: \"stats\"\n 19       MYSQL_DATABASE: \"stats\"\n 20       MYSQL_PASSWORD:\
    \ \"stats\"\n 21     restart: always\n```\n\n"
