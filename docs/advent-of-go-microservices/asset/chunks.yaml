    \ -format markdown -output docs/schema/stats\n7 [migrations:20] docs/schema/stats/migrations.md\n\
    8 [migrations:21] OK.\n9 ...\n```\n\nAnd we can check the output to verify that\
    \ it’s padded correctly:\n\n```\n1 # migrations\n2 \n3 | Name            | Type\
    \         | Key | Comment                        |\n4 |-----------------|--------------|-----|--------------------------------|\n\
    5 | project         | varchar(16)  | PRI | Microservice or project name   |\n\
    6 | filename        | varchar(255) | PRI | yyyy-mm-dd-HHMMSS.sql          |\n\
    7 | statement_index | int(11)      |     | Statement number from SQL file |\n\
    8 | status          | text         |     | ok or full error message       |\n\
    ```\n\n### A caveat emptor about database migrations\n\nWe have now a system in\
    \ place that:\n\n*   tests SQL migrations with Drone CI integration tests,\n\n\
    *   generates structs based on the SQL tables in our schema,\n\n*   generates\
    \ documentation snippets for SQL tables\n\nBy approaching our service development\
    \ in this way, we have made possible to create SQL schema and migrations with\
    \ database specific tooling like [MySQL workbench](https://www.mysql.com/products/workbench/),\
    \ while at the same time keeping a single source of truth for the data structures\
    \ in use.\n\nThe SQL schema can be updated with migrations, and the Drone CI steps\
    \ will ensure that the Go structures are updated as well. If some field is renamed\
    \ it will be a breaking change and you will need to rename the Go field names\
    \ in use by hand. Since we’re not using the database structures for JSON encoding,\
    \ we can at least be sure, that any breaking changes in regards to field naming\
    \ will not trickle out to your end users.\n\nThe most significant warning about\
    \ running migrations separately from the service is that breaking changes in the\
    \ service need to be deployed in a coordinated way. The SQL migration will break\
    \ the deployed service and there will be some time before a new version of the\
    \ service may be running. This is an inheren problematic of distributed systems.\n\
    \nIf this is a particular pain point for you, and it should be, you should perform\
    \ the database migrations in a non breaking way. For example, renaming a field\
    \ safely might mean the following:\n\n1.  Migration: Add a new field,\n\n2.  Service:\
    \ Write both to new and old fields,\n\n3.  Migration: `UPDATE table set new_field=old_field;`,\n\
    \n4.  Service: Stop writing/referencing old fields,\n\n5.  Migration: DROP the\
    \ old field from the table\n\nThe process isn’t easy to automate but illustrates\
    \ why in production service deployments, it’s good to have a DBA for assistance.\
    \ Coupling the service and migrations together brings other problems, like having\
    \ long running migration steps and concurrency issues since your service might\
    \ be deployed over many replicas and hosts.\n\nControlled upgrades are usually\
    \ a task that’s performed by humans, as much as we would like to automate this\
    \ there can be various technical circumstances which limit you as to when you\
    \ can perform schema migrations or a redeploy of your services, especially in\
    \ distributed systems.\n\n## Go: Dependency injection with Wire\n\nOur microservices\
    \ ultimately need at least a database connection in order to query and store data\
    \ in a MySQL database. We need to pass this object, possibly from the `main()`\
    \ function, to our service implementation.\n\n### The Go way\n\nI have learned\
    \ through trial and error, that “Dependency Injection” is a term which manages\
    \ to evoke a strong emotional response in gophers. As I’ve said before, all that\
    \ the term represents in Go is “a way to pass stuff into our handlers”, while\
    \ it means a lot of different things to people familiar with the concept from\
    \ other programming languages.\n\nThe most trivial way of dependency injection\
    \ would be to declare function arguments in our server constructor. For example,\
    \ if we would need a `*sqlx.DB`, we would declare a constructor like:\n\n```\n\
    1 func New(ctx context.Context, db *sqlx.DB) {\n2   ...\n3 }\n```\n\nIt would\
    \ be up to the caller to implement the correct argument list to fill the required\
    \ dependencies for the constructor. When dealing with a possible large scale RPC\
    \ scaffolding project, like we are, we are faced with a few pitfalls of this approach.\n\
    \nThe proto file definition for our service doesn’t provide any way to set up\
    \ a list of dependencies which are required for our service. Obviously the service\
    \ block in the proto file only declared the interface for our RPCs, but it has\
    \ absolutely no standard way to reference Go structures (like `*sqlx.DB`).\n\n\
    The obvious second pitfall is that our code generators would become exponentially\
    \ more complex with each added service, and custom service dependencies. While\
    \ we can asume that we use a single database connection for a service, we can’t\
    \ really know how unique the dependencies for any given service will be.\n\nIdeally\
    \ we need a way where we can add new dependencies, and not have to refactor every\
    \ service we have written until then to keep some idea of a consistent Go API.\n\
    \n### Runtime vs. compile time\n\nIn addition to the standard Go way to pass parameters\
    \ to constructors, there are two pattern to dependency injection in the wild.\
    \ Each one of them has a set of constraints, which basically boil down to it’s\
    \ effect on when an issue is detected.\n\nRuntime dependency injections, like\
    \ [codegangsta/inject](https://github.com/codegangsta/inject) resort to using\
    \ reflection from the internal `reflect` package, to inspect objects or functions\
    \ written in the Go way above, and invoke functions that provide results for individual\
    \ parameters. As an example, injection would look like:\n\n```\n1 injector :=\
    \ inject.New()\n2 injector.Map(context.TODO()) // literal type\n3 injector.Map(func()\
    \ *sqlx.DB { return new(sqlx.DB) }) // object factory\n4 injector.Invoke(server.New)\n\
    ```\n\nThe idea is, that you declare an object which holds either concrete values\
    \ or functions that return values of a required type and then figure out with\
    \ reflection which values should be passed to `server.New`, hidden behind injector.Invoke()\
    \ call.\n\nObviously this has a few issues like error handling (it’s likely that\
    \ a database connection can produce a timeout error on connection, we can’t handle\
    \ it here and thus we can only resort to a panic call), and ultimately a runtime\
    \ error when a value or construction for a particular type is not defined.\n\n\
    Runtime errors are an unwanted side effect when reflection is used in such a way.\
    \ The structure of the application doesn’t have any kind of type hinting that\
    \ would suggest to the go compiler that a dependency isn’t satisfied, and possibly\
    \ dangerous errors could bleed into production because of this.\n\nGoogle has\
    \ also realized this problem, and because of it has designed their own DI framework,\
    \ [google/wire](https://github.com/google/wire). The intent of the project is\
    \ to provide a compile-time dependency injection, which could error out in case\
    \ a dependency isn’t declared or provided at build time.\n\n### Wire and dependency\
    \ providers\n\nWire relies on code generation and reflection to analyze the source\
    \ code and produce injection code that is equal to what you would have to write,\
    \ in order to fill the dependencies required by your service.\n\nThe concepts\
    \ introduced by Wire are called:\n\n*   The Injector - the code that introduces\
    \ dependencies to your object,\n\n*   The Provider - the code that provides an\
    \ instance of a particular type"
