  trans: "\n现在，我们可以通过调用 `buf.Bytes()` 获取生成的源代码。我们也可以加载 `go/format` 包，并将源代码通过格式化器进行处理化。在\
    \ `renderGo` 函数的末尾，添加以下代码，以格式化源码并保存 `types_db.go`。\n\n```go\n 1 filename := path.Join(basePath,\
    \ \"types_db.go\")\n 2 contents := buf.Bytes()\n 3 \n 4 formatted, err := format.Source(contents)\n\
    \ 5 if err != nil {\n 6   // 回退到未格式化的源码以便检查\n 7   // 检查保存的文件以查看发生了什么错误\n 8   formatted\
    \ = contents\n 9   log.Println(\"An error occured while formatting the go source:\
    \ %s\", err)\n10   log.Println(\"Saving the unformatted code\")\n11 }\n12 \n13\
    \ fmt.Println(filename)\n14 \n15 return ioutil.WriteFile(filename, formatted,\
    \ 0644)\n```\n\n调用 go 结构体生成器的 Makefile 命令发生了变化。我们只需显式地添加 `-format` 和 `-output`，以便我们可以在指定的文件夹中生成文件。\n\
    \n```makefile\n1 - > server/$(SERVICE)/types_db.go\n2 + -format go -output server/$(SERVICE)\n\
    ```\n\n我们可以验证 `types_db.go` 是否仍然被正确生成。让我们运行 `make` 并验证。在 `make` 的输出某处，会出现以下行：\n\
    \n```text\n1 [migrations:18] server/stats/types_db.go\n```\n\n这意味着 `fmt.Println`\
    \ 已执行，并且文件在紧随之后被写入。如果我们打开文件并进行验证，将看到生成的结构体在其中，因此我们没有破坏任何内容。\n\n### 实现一个 markdown\
    \ 输出渲染器\n\n我们从一个空存根开始，现在由我们来实现渲染到 Markdown 的渲染器。为了这一点，我们需要设置一些简单的要求：\n\n* 我们想要创建输出目录\n\
    * 每个表都需要有自己的独立文件（`[table_name].md`）\n* 我们将表名作为标题打印出来\n* 可选：如果有表描述，我们将打印出来\n* 并根据\
    \ SQL 表结构生成带填充的、人类可读的 markdown 表格\n\n我们可以从最简单的开始：\n\n```go\n 1 // 创建输出文件夹\n 2\
    \ if err := os.MkdirAll(basePath, 0755); err != nil {\n 3   return err\n 4 }\n\
    ```\n\n通过调用 `MkdirAll`，我们递归地创建输出文件夹。由于 `renderGo` 也需要创建一个文件夹，我们将代码段复制到 `renderGo`\
    \ 中。现在，我们可以继续遍历 schema 中的表，并单独地为它们渲染 markdown 内容。\n\n```go\n 1 // 使用 schema 生成单个\
    \ markdown 文件\n 2 for _, table := range tables {\n 3   filename := path.Join(basePath,\
    \ table.Name+\".md\")\n 4 \n 5   contents := renderMarkdownTable(table)\n 6  \
    \ if err := ioutil.WriteFile(filename, contents, 0644); err != nil {\n 7     return\
    \ err\n 8   }\n 9 \n10   fmt.Println(filename)\n11 }\n12 return nil\n```\n\n如果\
    \ `ioutil.WriteFile` 发生错误，此函数将跳出。可能的错误包括没有文件权限或空间不足。由于 `renderMarkdown` 返回一个错误，我们可以将此信息传回\
    \ `main()` 并报错。\n\n现在我们可以转向单个表输出生成器。markdown 可以读取以下格式的表格：\n\n```text\n1 |Name|Type|Key|Comment|\n\
    2 |--|--|--|\n3 |1|2|3|4|\n```\n\n显而易见的问题是，如果没有填充，输出将是不直观的。我们希望生成如下带有填充的、人类可读的\
    \ markdown 表格：\n\n```text\n1 |Name |Type |Key |Comment |\n2 |------|------|------|---------|\n\
    3 |1    |2    |3    |4       |\n```\n\n现在，我们注意到，在没有填充的情况下，标题是不够的。我们需要根据标题来设置填充：\n\
    \n```go\n1 // 初始化填充映射\n2 titles := []string{\"Name\", \"Type\", \"Key\", \"Comment\"\
    }\n3 padding := make(map[string]int)\n```\n\n遍历标题，并为每个标题设置填充：\n\n```go\n 1 //\
    \ 创建输出文件夹\n 2 if err := os.MkdirAll(basePath, 0755); err != nil {\n 3   return\
    \ err\n 4 }\n```\n（注：此处根据上下文逻辑翻译了原文中缺失的描述部分）\n\n我们需要一个函数来根据宽度生成格式化字符串：\n\n```go\n\
    \ 1 // 生成格式字符串的函数\n 2 format := func(width int) string {\n 3   return fmt.Sprintf(\"\
    |-%ds \", width)\n 4 }\n```\n\n现在，我们需要根据标题长度来填充映射：\n\n```go\n 1 // 填充标题长度\n 2\
    \ for _, title := range titles {\n 3   padding[title] = len(title)\n 4 }\n```\n\
    \n最后，我们得到了一个格式化字符串：\n\n```go\n 1 // 最终格式化字符串\n 2 format = format(padding[\"Name\"\
    ]) + \"\\n\"\n```\n"
