- raw: "As a possibility, instead of a generic ProviderSet, we could have a concrete\
    \ Providers interface, that must satisfy all the fields declared on `Server{}`.\
    \ The interface, as it is a concrete type, can cross package boundaries and the\
    \ individual provider implementations (or a singleton of them) could be provided\
    \ as an external package. Currently wire doesn’t really take the concept into\
    \ it’s logical conclusion, and is probablly too complex for a DI framework. But,\
    \ as we don’t really have a better option and won’t start to write our own, this\
    \ is what we have and we can work with it.\n\n## Docker: Building images with\
    \ security in mind\n\nWhen it comes to running our microservices in production,\
    \ we need to build docker images. Security is unfortunately an afterthought, so\
    \ let’s try to figure out what we can do to increase security so it’s better than\
    \ most of the stuff out there.\n\n### Configuring Makefile targets\n\nWe will\
    \ start by adding Makefile rules to enable us to build and push docker images.\n\
    \n```\n 1 # docker image build\n 2 \n 3 IMAGE_PREFIX := titpetric/service-\n 4\
    \ \n 5 docker: $(shell ls -d cmd/* | sed -e 's/cmd\\//docker./')\n 6   @echo OK.\n\
    \ 7 \n 8 docker.%: export SERVICE = $(shell basename $*)\n 9 docker.%:\n10   @figlet\
    \ $(SERVICE)\n11   docker build --rm --no-cache -t $(IMAGE_PREFIX)$(SERVICE) --build-arg\
    \ service_name\\\n12 =$(SERVICE) -f docker/serve/Dockerfile .\n13 \n14 # docker\
    \ image push\n15 \n16 push: $(shell ls -d cmd/* | sed -e 's/cmd\\//push./')\n\
    17   @echo OK.\n18 \n19 push.%: export SERVICE = $(shell basename $*)\n20 push.%:\n\
    21   @figlet $(SERVICE)\n22   docker push $(IMAGE_PREFIX)$(SERVICE)\n```\n\nThere’s\
    \ nothing magical about this target, it’s the same principle which we are already\
    \ using for our code generation, and service building. To use it, you can just\
    \ run `make docker` to build the images, and `make push` to push the images to\
    \ docker hub or your registry, based on the IMAGE_PREFIX value.\n\n### The basic\
    \ Dockerfile image\n\nLet’s create our basic service Dockerfile under `docker/serve/Dockerfile`.\
    \ We will start with some reasonable defaults and then try to improve the security\
    \ of the built images even further.\n\n```\n 1 FROM alpine:latest\n 2 \n 3 ARG\
    \ service_name\n 4 ENV service_name=$service_name\n 5 \n 6 WORKDIR /app\n 7 \n\
    \ 8 ENV TZ Europe/Ljubljana\n 9 RUN apk --no-cache add ca-certificates tzdata\
    \ && ln -snf /usr/share/zoneinfo/$TZ /et\\\n10 c/localtime && echo $TZ > /etc/timezone\n\
    11 \n12 COPY /build/${service_name}-linux-amd64 /app/service\n13 \n14 RUN adduser\
    \ -S www-data -u 1000\n15 USER www-data\n16 \n17 EXPOSE 3000\n18 \n19 ENTRYPOINT\
    \ [\"/app/service\"]\n```\n\nWe are actually building a fully featured distro\
    \ image on alpine here. We add the few required packages that actually enable\
    \ our service to function on some common baseline:\n\n*   `ca-certificates` adds\
    \ the SSL certificates required for issuing HTTPS requests,\n\n*   `tzdata` configures\
    \ the timezone (usually optional if your apps will be built on UTC)\n\nThe tzdata\
    \ package is required not only for setting a default timezone for the Docker image,\
    \ but to format times based on timezone data in Go:\n\n```\n1   location, err\
    \ := time.LoadLocation(\"Europe/Ljubljana\")\n2   if err != nil {\n3     fmt.Println(err)\n\
    4   }\n5 \n6   t := time.Now().In(location)\n7 \n8   fmt.Println(\"Time in Ljubljana:\"\
    , t.Format(\"02.01.2006 15:04\"))\n```\n\nSecurity wise, we are doing two things:\n\
    \n*   we add an unprivileged `www-data` user, so our service doesn’t run as `root`,\n\
    \n*   we run our service on port 3000 (a privileged user would be required to\
    \ run on port 80).\n\nThe attack surface here requires that a person should first\
    \ exploit our service, and then exploit the running kernel to escalate privileges\
    \ from www-data to root, and then could use `apk` to install packages that could\
    \ either do whatever inside the container, or attempt to break out of docker to\
    \ own your host.\n\nCan we improve this further? I believe we can. Two things\
    \ come to mind:\n\n*   we can remove tools and binaries that enable `root` to\
    \ have an usable container (remove `apk` to start),\n\n*   instead of relying\
    \ on alpine, we could build our images on `scratch`, which is absolutely empty.\n\
    \n### Security implications of our docker image\n\nIn order to figure out all\
    \ the files that are bundled in the container, we can use docker to list the files\
    \ built in the image. Since the container has `find`, this can be done with:\n\
    \n```\n1 docker run --rm --entrypoint=/usr/bin/find titpetric/service-stats /\
    \ -type f > files\\\n2 .txt\n```\n\nInspecting the file, we can list the root\
    \ folders to figure out which are safe and unsafe:\n\n```\n 1 # cat files.txt\
    \ | perl -p -e 's/^(\\/[^\\/]+).+/\\1/g' | sort | uniq -c | sort -nr\n 2    9904\
    \ /sys\n 3    1362 /usr\n 4    1130 /proc\n 5      51 /etc\n 6       8 /lib\n\
    \ 7       3 /sbin\n 8       1 /.dockeren\n 9       1 /bin\n10       1 /app\n```\n\
    \nWe can immediately ignore the `/sys` and `/proc` folders, since these are coming\
    \ from our docker container environment and don’t include executable files. We\
    \ could just inspect the executables found in the PATH environment:\n\n```\n1\
    \ # docker run -it --rm --entrypoint=/bin/sh titpetric/service-stats -c set |\
    \ grep PATH\n2 PATH='/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'\n\
    ```\n\nSince all the executable files are contained in either the `bin` or `sbin`\
    \ folders, we can list them particularly just by looking for `bin/` with grep:\n\
    \n```\n 1 # cat files.txt | grep bin/\n 2 /usr/bin/c_rehash\n 3 /usr/bin/posixtz\n\
    \ 4 /usr/bin/iconv\n 5 /usr/bin/getent\n 6 /usr/bin/getconf\n 7 /usr/bin/ssl_client\n\
    \ 8 /usr/bin/scanelf\n 9 /usr/sbin/zdump\n10 /usr/sbin/update-ca-certificates\n\
    11 /usr/sbin/zic\n12 /bin/busybox\n13 /sbin/apk\n14 /sbin/ldconfig\n15 /sbin/mkmntdirs\n\
    ```\n\nNow, the simpler attack surface for privilege escalation needs something\
    \ that’s called a `setuid` bit set on the executable. This means that an unprivileged\
    \ user like `www-data` can run something as root. You can inspect the binaries\
    \ by invoking find with `-perm -4000` as the parameter. On our host, we’ll end\
    \ up a list like this:\n\n```\n 1 # find / -perm -4000\n 2 /usr/lib/openssh/ssh-keysign\n\
    \ 3 /usr/lib/eject/dmcrypt-get-device\n 4 /usr/lib/dbus-1.0/dbus-daemon-launch-helper\n\
    \ 5 /usr/bin/chfn\n 6 /usr/bin/sudo\n 7 /usr/bin/gpasswd\n 8 /usr/bin/newgrp\n\
    \ 9 /usr/bin/passwd\n10 /usr/bin/chsh\n11 /bin/su\n12 /bin/mount\n13 /bin/umount\n\
    ```\n\nAlpine doesn’t come with any setuid executables (at least with out current\
    \ package selection), which means the only way to exploit the running container\
    \ would be to attack the kernel. From here, the attack surface can still theoretically\
    \ be limited to the running container, meaning an attacker could run anything\
    \ in the container with elevated root privileges. The other way would be to break\
    \ out of the cgroup of the running process, and effectively attack the host. We\
    \ can defend against the first scenario, just by cleaning up the executables in\
    \ the built image. Let’s just do that:\n\n```\n1 # delete all the bundled binaries\
    \ on standard PATH locations\n2 RUN rm -rf /bin /sbin /usr/bin /usr/sbin /usr/local/bin\
    \ /usr/local/sbin\n```\n\nBy cleaning these up, we can be sure that the attacker\
    \ can’t just run `/bin/busybox` under a privileged process and end up with a shell\
    \ to your container. There are other ways to improve the security of your container,\
    \ and ultimately the security issue might be in your app and the libraries that\
    \ are compiled in, so we can’t be sure that there is absolutely no way to exploit\
    \ it, but at least we came pretty damn close.\n\n### Possible improvements\n\n\
    There are two notable projects that deal with container security which you might\
    \ want to look at.\n\n*   [Clair](https://github.com/quay/clair) - a static analyzer\
    \ for common vulnerabilities,\n\n*   [docker-slim](https://github.com/docker-slim/docker-slim)\
    \ - merge image layers and remove unused files"
