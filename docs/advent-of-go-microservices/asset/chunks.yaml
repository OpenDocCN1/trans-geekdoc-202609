    \ are executed, and the second migration run doesn’t end up with an error. We\
    \ can see that the migration is skipped, as it has already been applied to the\
    \ database.\n\n## Go: Database first struct generation\n\nAs we set up our protobuf\
    \ structures and data migrations, we will need to interface between them. Unfortunately,\
