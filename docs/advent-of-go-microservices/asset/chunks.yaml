    \ render_schema > db/schema.go\n```\n\n这里剩下的工作只是对生成的 go 文件运行 `go fmt`。由于这已经在我们的\
    \ Drone CI 步骤中处理过了，我们现在已经成功地将所需的 SQL 迁移准备并放入了 `db` 包中，以便从这里开始使用。\n\n由于我们现在已经将所有的数据库迁移嵌入到\
    \ go 代码中，我们可以继续作为 CI 测试套件的一部分，在真实的数据库上运行这些迁移。\n\n## Go: 数据库迁移脚手架\n\n在我们准备好数据库迁移文件并将其嵌入\
    \ db 包之后，我们现在只需要实现处理这些迁移所需的细节了。让我们从扩展 FS 类型开始，以实际提供读取它们的功能。\n\n```\n1 // ReadFile\
    \ 从 FS 返回解码后的文件内容\n2 func (fs FS) ReadFile(filename string) ([]byte, error) {\n\
    3   if val, ok := fs[filename]; ok {\n4     return base64.StdEncoding.DecodeString(val)\n\
    5   }\n6   return nil, os.ErrNotExist\n7 }\n```\n\n从我们的 FS 类型中读取文件非常简单。我们只需要检查我们正在尝试读取的文件是否存在，并对其进行\
    \ base64 解码。为了在某种程度上符合读取文件的标准做法，如果读取的文件不存在，我们将返回一个 `os.ErrNotExist` 错误。\n\n让我们也添加一个\
    \ migrations 辅助函数，它可以列出文件系统中的迁移，这样我们就可以循环遍历它们并逐一运行。它只列出实际的迁移文件（`*.up.sql`），而不返回任何其他嵌入的文件（例如\
    \ `migrations.sql`）。文件将按照预期的执行顺序排序。\n\n```\n 1 // Migrations 返回要执行的 SQL 文件列表\n\
    2 func (fs FS) Migrations() []string {\n3   result := []string{}\n4   for filename,\
    \ contents := range fs {\n5     // 跳过空文件\n6     if contents == \"\" {\n7     \
    \  continue\n8     }\n9     if matched, _ := filepath.Match(\"*.up.sql\", filename);\
    \ matched {\n10       result = append(result, filename)\n11     }\n12   }\n13\
    \   sort.Strings(result)\n14   return result\n15 }\n```\n\n我们还需要为迁移架构 (`migration.sql`)\
    \ 准备一个结构体，它如下：\n\n```\n 1 package db\n 2 \n3 type (\n 4   migration struct {\n\
    \ 5     Project        string `db:\"project\"`\n 6     Filename       string `db:\"\
    filename\"`\n 7     StatementIndex int    `db:\"statement_index\"`\n 8     Status\
    \         string `db:\"status\"`\n 9   }\n10 )\n11 \n12 func (migration) Fields()\
    \ []string {\n13   return []string{\"project\", \"filename\", \"statement_index\"\
    , \"status\"}\n14 }\n```\n\n字段如下：\n\n* `project` 表示迁移组 / 服务（例如 `stats`），\n\n*\
    \ `filename` 是该组中的一个迁移（`2019-11-26-092610-description-here.up.sql`），\n\n* `statement_index`\
    \ - 迁移中的顺序语句索引，\n\n* `status` - 这将要么是 “ok”，或者是迁移失败时产生的错误\n\n解释 `statement_index`：每个迁移可以包含多个\
    \ SQL 查询。一种常见情况是在一个迁移内部导入完整的数据库架构，其中一个迁移将在单个文件中包含多个 `CREATE TABLE` 语句。我们需要使用分隔符\
    \ `;` 拆分该文件，该分隔符应该在行尾。为此，我们可以使用 `;$` 正则表达式将迁移拆分为语句，移除空语句并返回它们的列表。列表的键是语句索引。\n\n\
    这里的 `Fields()` 函数是为了帮助我们对数据库执行查询。为了执行完整的 `INSERT`（或 `REPLACE`，……），我们需要列出数据库表的字段。另一种方法是使用反射，但那太过度设计了。此函数帮助我们移除一些适用于数据插入/更新的字段冗余（stutter）。\n\
    \n我们可以产生一个辅助函数，它接收 `FS.ReadFile` 的结果：\n\n```\n 1 func statements(contents []byte,\
    \ err error) ([]string, error) {\n2   result := []string{}\n3   if err != nil\
    \ {\n4     return result, err\n5   }\n6   stmts := regexp.MustCompilePOSIX(\"\
    ;$\").Split(string(contents), -1)\n7   for _, stmt := range stmts {\n8   stmt\
    \ = strings.TrimSpace(stmt)\n9     if stmt != \"\" {\n10       result = append(result,\
    \ stmt)\n11     }\n12   }\n13   return result, nil\n```\n\n 这样我们就可以通过 `migrations[\"\
    stats\"].ReadFile(\"migrations.sql\")` 生成语句。\n\n### 迁移 API\n\n现在由于我们已经有了读取和拆分迁移的结构和函数，我们需要考虑迁移\
    \ API。我希望提供：\n\n* `List() []string` - 列出嵌入迁移的服务名称\n\n* `Print(project string)\
    \ error` - 输出迁移\n\n* `Run(project string, db *sqlx.DB) error` - 传入数据库句柄和项目名称运行\n\
    \n这让我们能够编写一个可以打印或运行的 cli 工具。让我们从易着手的成果开始：`List()`：\n\n```\n1 func List() []string\
    \ {\n2   result := []string{}\n3   for k, _ := range migrations {\n4     result\
    \ = append(result, k)\n5   }\n6   return result\n7 }\n```\n\n该函数只会运行一次，性能并不密集，但作为一个小练习，让我们将其重写为内存高效的函数。\n\
    \n```go\n1 func List() []string {\n2   result := make([]string, len(migrations))\n\
    3   i := 0\n4   for k, _ := range migrations {\n5     result[i] = k\n6   }\n7\
    \   return result\n8 }\n```\n\n剩下的就是 `Print` 和 `Run` 函数。让我们从 `Print` 开始，因为目前不需要设置数据库。目标是获取项目文件系统并列出包含的迁移语句。让我们实现\
    \ `cmd/db-migrate-cli/main.go`：\n\n```\n 1 package main\n 2 \n3 import (\n4  \
    \ \"log\"\n 5 \n6   \"github.com/titpetric/microservice/db\"\n7 )\n 8 \n9 func\
    \ main() {\n10   log.Printf(\"Migration projects: %+v\", db.List())\n11   log.Println(\"\
    Migration statements for stats\")\n12   if err := db.Print(\"stats\"); err !=\
    \ nil {\n13     log.Printf(\"An error occured: %+v\", err)\n14   }\n15 }\n```\n\
    \n我们在开发过程中会扩展这个文件，但现在我们只感兴趣的是创建的 API 是否可用。我们可以编写单元测试，但由于我们在任何情况下都需要这个工具，这样已经足够了。我们现在还无法验证数据的有效性，我们能做的就是验证数据是否存在以及可以被读取。\n\
    \n"
