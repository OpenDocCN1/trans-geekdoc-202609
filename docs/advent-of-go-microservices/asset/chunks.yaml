- raw: "Finally, for each table we collect the table fields, the primary key fields,\
    \ and print out the relevant Go structures and functions to support them. A big\
    \ part of generating the `Fields` and `PrimaryFields` functions is to avoid reflection.\
    \ A migration to add a new field could break the service, if a `select * from\
    \ [table]...` style SQL query would be used. A newly added field would result\
    \ in an error executing the query. By selecting fields explicitly, we can avoid\
    \ this scenario.\n\nIn fact, there’s little use to keep `Fields` and `PrimaryFields`\
    \ as functions on the structure, so we’ll immediately modify this to generate\
    \ a public, service-prefixed variable.\n\n```\n 1 fmt.Printf(\"var %sFields =\
    \ \", camel(table.Name))\n 2 if len(fields) > 0 {\n 3   fmt.Printf(\"[]string{\\\
    \"%s\\\"}\", strings.Join(fields, \"\\\", \\\"\"))\n 4 } else {\n 5   fmt.Printf(\"\
    []string{}\")\n 6 }\n 7 fmt.Println()\n 8 fmt.Printf(\"var %sPrimaryFields = \"\
    , camel(table.Name))\n 9 if len(primary) > 0 {\n10   fmt.Printf(\"[]string{\\\"\
    %s\\\"}\", strings.Join(primary, \"\\\", \\\"\"))\n11 } else {\n12   fmt.Printf(\"\
    []string{}\")\n13 }\n14 fmt.Println()\n```\n\nAll that’s left to do at this point\
    \ is to run and verify the generated code.\n\n```\n 1 package stats\n 2 \n 3 type\
    \ Migrations struct {\n 4   // Microservice or project name\n 5   Project string\
    \ `db:\"project\"`\n 6 \n 7   // yyyy-mm-dd-HHMMSS.sql\n 8   Filename string `db:\"\
    filename\"`\n 9 \n10   // Statement number from SQL file\n11   StatementIndex\
    \ int32 `db:\"statement_index\"`\n12 \n13   // ok or full error message\n14  \
    \ Status string `db:\"status\"`\n15 }\n16 \n17 var MigrationsFields = []string{\"\
    project\", \"filename\", \"statement_index\", \"status\"}\n18 var MigrationsPrimaryFields\
    \ = []string{\"project\", \"filename\"}\n```\n\nThat’s exactly what we wanted.\
    \ We generate the full Go structure with all required metadata to support our\
    \ Go development workflows. The comments are generated from the database schema,\
    \ so we have this information available at any time - if a DBA is managing the\
    \ database schema in their favorite editor, or if a developer is reading the Go\
    \ struct definitions or internal godoc pages. Documentation accessibility is built\
    \ into our process.\n\nAll that’s left to do now is to include our generator into\
    \ the Makefile, under the `migrate.%:` target:\n\n```\n1 ./build/db-schema-cli-linux-amd64\
    \ -schema $(SERVICE) -db-dsn \"root:$(MYSQL_ROOT_PASS\\\n2 WORD)@tcp(mysql-test:3306)/$(SERVICE)\"\
    \ > server/$(SERVICE)/types_db.go\n```\n\nNow, we have some specific requirements\
    \ to consider, which we are solving by generating `types_db.go` under individual\
    \ services which we are making. Let’s consider how having a global types package\
    \ would be problematic:\n\n*   It’s likely we would have naming conflicts for\
    \ tables (example: `log` table existing in multiple services),\n\n*   Prefixing\
    \ the structures with the service name would introduce stutter (`stats.stats_log`\
    \ becomes `StatsStatsLog`)\n\n*   We really only need the database structures\
    \ in our service implementation. We need only to convert them to PB.\n\nIn some\
    \ casses, the possible mapping between DB and PB structures could be 1-1, but\
    \ it’s likely we’re going to have different types for PB (javascript client’s\
    \ can’t really handle uint64 types so they have to be strings), and we will always\
    \ have data which is available in the database, which must never be exposed publicly\
    \ (JSON?).\n\nIn fact, I have half of mind to add `json:\"-\"` tags to all the\
    \ fields and see how far that brings me. It really isn’t a bad idea, so…\n\n```\n\
    \ 1 --- a/cmd/db-schema-cli/render-go.go\n 2 +++ b/cmd/db-schema-cli/render-go.go\n\
    \ 3 @@ -128,7 +128,7 @@ func renderGo(schema string, tables []*Table) error {\n\
    \ 4                                 fmt.Printf(\"    // %s\\n\", column.Comment)\n\
    \ 5                         }\n 6                         columnType, _ := resolveType(column)\n\
    \ 7 -                       fmt.Printf(\"    %s %s `db:\\\"%s\\\"`\\n\", camel(column.Name),\
    \ co\\\n 8 lumnType, column.Name)\n 9 +                       fmt.Printf(\"  \
    \  %s %s `db:\\\"%s\\\" json:\\\"-\\\"`\\n\", camel(colum\\\n10 n.Name), columnType,\
    \ column.Name)\n11                 }\n12                 fmt.Println(\"}\")\n\
    13                 fmt.Println()\n```\n\nI think this is what people are referring\
    \ to when they say you have to future-proof your code. I’m not counting on the\
    \ fact that the structures defined here will never be exported, we might have\
    \ to come back and patch our code generation in this case, but it’s way better\
    \ to start with paranoid defaults, and then open up your system. It’s way harder\
    \ to disable something, than to enable it.\n\n### Moving forward\n\nAs we didn’t\
    \ create a real migration that would create any tables yet, the only table that’s\
    \ dumped as Go code is the Migrations table. Our next steps will be to create\
    \ some real migrations for our table, and see if we can already define some coner\
    \ cases where we’re going to need to go outside of the current implementation.\n\
    \nAs we said, it’s our goal to actively generate the documentation from SQL as\
    \ our data source, which also means we’re going to be generating some markdown\
    \ output from the database tables we’ll be working with.\n\n## Go: Generating\
    \ database schema documentation\n\nSince we are testing migrations and generating\
    \ Go struct types from the database schema, we also have all the available information\
    \ to generate documentation snippets for each schema. We will generate markdown\
    \ formatted tables with the final database schema, after all the migrations have\
    \ been applied.\n\n### Updating the Go generators\n\nWe need to adjust the generator\
    \ code, since each table will need to be rendered in an individual markdown file.\
    \ We need to add a parameter to db-schema-cli, which we will pass to specify an\
    \ output folder.\n\n```\n 1 --- a/cmd/db-schema-cli/main.go\n 2 +++ b/cmd/db-schema-cli/main.go\n\
    \ 3 @@ -18,11 +18,13 @@ func main() {\n 4                 }\n 5              \
    \   Schema string\n 6                 Format string\n 7 +               Output\
    \ string\n 8         }\n 9         flag.StringVar(&config.db.Driver, \"db-driver\"\
    , \"mysql\", \"Database driver\")\n10         flag.StringVar(&config.db.DSN, \"\
    db-dsn\", \"\", \"DSN for database connection\")\n11         flag.StringVar(&config.Schema,\
    \ \"schema\", \"\", \"Schema name to print tables fo\\\n12 r\")\n13         flag.StringVar(&config.Format,\
    \ \"format\", \"go\", \"Output formatting\")\n14 +       flag.StringVar(&config.Output,\
    \ \"output\", \"\", \"Output folder (mandatory)\")\n15         flag.Parse()\n\
    16 \n17 +       if config.Output == \"\" {\n18 +               log.Fatal(\"Missing\
    \ -output parameter, please specify output folder\")\n19 +       }\n```\n\nWe\
    \ can now specifiy `-output [folder]` as an argument to db-schema-cli. Let’s adjust\
    \ the signature for `renderGo` to take this parameter, so we will generate Go\
    \ code in the folder specified with the same parameter. We can also add `renderMarkdown`\
    \ at the same time:\n\n```\n 1 // Render go structs\n 2 if config.Format == \"\
    go\" {\n 3   if err := renderGo(config.Output, config.Schema, tables); err !=\
    \ nil {\n 4     log.Fatal(err)\n 5   }\n 6 }\n 7 \n 8 // Render markdown tables\n\
    \ 9 if config.Format == \"markdown\" {\n10   if err := renderMarkdown(config.Output,\
    \ config.Schema, tables); err != nil {\n11     log.Fatal(err)\n12   }\n13 }\n\
    ```\n\nPlease create a `render-md.go` file, which contains the following:\n\n\
    ```\n1 package main\n2 \n3 func renderMarkdown(basePath string, schema string,\
    \ tables []*Table) error {\n4   return nil\n5 }\n```\n\nThe stub is here just\
    \ so we can compile the source as we need to do some housekeeping for the renderGo\
    \ function. Since we want to write to a file from renderGo, we will create a bytes\
    \ buffer, and modify our various `fmt.Print*` calls into `fmt.Fprint*`, which\
    \ takes an `io.Writer` as an additional first parameter. The code in the renderGo\
    \ function becomes something like this:\n\n```\n1 buf := bytes.NewBuffer([]byte{})\n\
    2 \n3 fmt.Fprintf(buf, \"package %s\\n\", schema)\n4 fmt.Fprintln(buf)\n5 // ...\n\
    ```"
