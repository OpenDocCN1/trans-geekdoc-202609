  trans: "\n\n```go\n 1 // List tables in schema\n 2 tables := []*Table{}\n 3 fields\
    \ := strings.Join(TableFields, \", \")\n 4 err = handle.Select(&tables, \"select\
    \ \"+fields+\" from information_schema.tables where\\\n 5  table_schema=? order\
    \ by table_name asc\", config.Schema)\n 6 if err != nil {\n 7   log.Println(\"\
    Error listing database tables\")\n 8   log.Fatal(err)\n 9 }\n10 \n 11 // List\
    \ columns in tables\n 12 for _, table := range tables {\n 13   fields := strings.Join(ColumnFields,\
    \ \", \")\n 14   err := handle.Select(&table.Columns, \"select \"+fields+\" from\
    \ information_schema.co\\\n15 lumns where table_schema=? and table_name=? order\
    \ by ordinal_position asc\", config.S\\\n16 chema, table.Name)\n 17   if err !=\
    \ nil {\n 18     log.Println(\"Error listing database columns for table:\", table.Name)\n\
    \ 19     log.Fatal(err)\n 20   }\n 21 }\n```\n\n我们现在只需要一些桥接代码来调用我们的 Go 代码渲染函数：\n\
    \n```go\n 1 // Render go structs\n 2 if config.Format == \"go\" {\n 3   if err\
    \ := renderGo(config.Schema, tables); err != nil {\n 4     log.Fatal(err)\n 5\
    \   }\n 6 }\n```\n\n我们传递 `schema` 名称是为了设置生成的包名，同时也传递了所有的表信息。\n\n### 类型转换\n\n当我们谈论数据库列时，有两个类型列需要考虑：`data_type`，它持有原始类型；以及\
    \ `column_type`，它是包含了其限制条件的类型，例如长度，或者数值类型是带符号/无符号数字。后者对于区分 `int64` 和 `uint64`\
    \ 非常重要。\n\n我们可以将类型分为三个不同的需求：\n\n- 可以是带符号/无符号的数值类型（组合类型），\n- 可以直接翻译为 Go 的简单类型，\n\
    - 需要导入包的特殊类型（`datetime` -> `*time.Time`）\n\n每种类型的映射应该是简单的：\n\n```go\n 1 var numericTypes\
    \ map[string]string = map[string]string{\n 2   \"tinyint\":  \"int8\",\n 3   \"\
    smallint\": \"int16\",\n 4   // `mediumint` - 这在技术上应该是 int24 (3 字节)，但\n 5   \"\
    mediumint\": \"int32\",\n 6   \"int\":       \"int32\",\n 7   \"bigint\":    \"\
    int64\",\n 8 }\n 9 \n10 func isNumeric(column *Column) (string, bool) {\n 11 \
    \  val, ok := numericTypes[column.DataType]\n 12   return val, ok\n 13 }\n```\n\
    \n所有的数值类型都有一个特征：无符号值会在带符号映射类型前面加一个 `u`。这样，一个无符号的 `int32` 就会变成 `uint32`。\n\n```go\n\
    \ 1 var simpleTypes map[string]string = map[string]string{\n 2   \"char\":   \
    \    \"string\",\n 3   \"varchar\":    \"string\",\n 4   \"text\":       \"string\"\
    ,\n 5   \"longtext\":   \"string\",\n 6   \"mediumtext\": \"string\",\n 7   \"\
    tinytext\":   \"string\",\n 8   \"longblob\":   \"[]byte\",\n 9   \"blob\":  \
    \     \"[]byte\",\n10   \"varbinary\":  \"[]byte\",\n 11   // `float` 和 `double`\
    \ 在这里是因为它们没有无符号修饰符\n 12   \"float\":  \"float32\",\n 13   \"double\": \"float64\"\
    ,\n 14   // `decimal` - double 存储为字符串，\\o/\n 15   \"decimal\": \"string\",\n 16\
    \ }\n 17  \n18 func isSimple(column *Column) (string, bool) {\n 19   val, ok :=\
    \ simpleTypes[column.DataType]\n 20   return val, ok\n 21 }\n```\n\n简单类型像数值类型一样，返回\
    \ 1-1 的类型映射。由于这些值不是带符号/无符号的，返回的映射类型将保持原样。\n\n```go\n 1 type specialType struct\
    \ {\n 2   Import string\n 3   Type   string\n 4 }\n 5 \n 6 var specialTypes map[string]specialType\
    \ = map[string]specialType{\n 7   \"date\":      specialType{\"time\", \"*time.Time\"\
    },\n 8   \"datetime\":  specialType{\"time\", \"*time.Time\"},\n 9   \"time\"\
    :      specialType{\"time\", \"*time.Time\"},\n 10   \"timestamp\": specialType{\"\
    time\", \"*time.Time\"},\n 11   // `enum` 和 `set` 尚未实现\n 12   // `year` 尚未实现\n\
    \ 13 }\n 14 \n 15 func isSpecial(column *Column) (specialType, bool) {\n 16  \
    \ val, ok := specialTypes[column.DataType]\n 17   return val, ok\n 18 }\n```\n\
    \n特殊类型稍微复杂一点，因为它们还提供了导入。我们涵盖了内置的日期/时间字段，但我们还有其他目前被省略的字段。MySQL 有 `JSON` 字段类型，为此我们必须导入\
    \ `github.com/jmoiron/sqlx/types` 并使用 `types.JSONText` 才能使其可用。那里还有其他类型，如 `GzippedText`\
    \ 以及 `BIT(1)` 类型的实现，它可以将值扫描到 `bool` 字段中。我们不会在我们的用例中实现这些，但示例仅仅说明了需求增长得有多快。\n\n\
    由于一个 schema 可能有许多导入包的类型，我们需要保持这些包的唯一性：\n\n```go\n1 func contains(set []string,\
    \ value string) bool {\n 2   for _, v := range set {\n 3     if v == value {\n\
    \ 4       return true\n 5     }\n 6   }\n 7   return false\n 8 }\n```\n\n`contains()`\
    \ 辅助函数通过提供检查导入是否已经添加的方法来帮助我们。这让我们只剩下生成相关 Go 代码的实际函数：\n\n"
