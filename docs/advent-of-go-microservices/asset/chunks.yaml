- raw: "With Clair, the intent of the project is to continously scan your images for\
    \ newly published vulnerabilities. It will not solve them, but it will let you\
    \ know if you need to upgrade or remove some of the packages that are contained\
    \ in your container.\n\nWith docker-slim, the project uses static analysis for\
    \ doing what we did above by hand. We know that our application doesn’t rely on\
    \ anything under `bin/` or `sbin/` folders, so we could safely delete them without\
    \ impacting our service. Docker slim goes further than that, and not only removes\
    \ binaries, but rebuilds the complete image without referencing the base image,\
    \ and deleting everything that may be unused, possibly even stripping debug symbols\
    \ from your app, and ending up with a tiny image which goal is both optimized\
    \ for size and security. With it, your final build image would be similar to what\
    \ you would get if you started with `FROM scratch`.\n\nAnother approach would\
    \ be to use a multi stage Dockerfile, which first installs everything we need\
    \ in a builder image, and then copies the required files into an image built from\
    \ `scratch`. What we would probablly need is just the `/etc` folder, or a subset\
    \ of it. The exercise is left to the reader.\n\n## Go: implementing a microservice\n\
    \nWe should move towards writing actual code for our service. We are writing a\
    \ simple statistics collection service for tracking page views. We are going to\
    \ create a database schema for collecting page views and improve things along\
    \ the way.\n\n### The database schema\n\nTo refresh, we will be implementing our\
    \ Push() RPC call:\n\n```\n 1 service StatsService {\n 2   rpc Push(PushRequest)\
    \ returns (PushResponse);\n 3 }\n 4 \n 5 message PushRequest {\n 6   string property\
    \ = 1;\n 7   uint32 section = 2;\n 8   uint32 id = 3;\n 9 }\n10 \n11 message PushResponse\
    \ {}\n```\n\nI’ve created a database schema which serves my use case for logging\
    \ the request. In addition to the request data for the RPC, I added fields `remote_ip`,\
    \ and `stamp` to track the user making the page view and the time the page view\
    \ was logged. I also defined an `id` uint64 primary key, which I’ll fill out with\
    \ a K-sortable [Sonyflake ID](https://github.com/sony/sonyflake).\n\n| Name ||\
    \ Type || Key || Comment |\n\n| --- | --- | --- | --- |\n\n| id || bigint(20)\
    \ unsigned || PRI || Tracking ID |\n\n| --- | --- | --- | --- |\n\n| property\
    \ || varchar(32) ||   || Property name (human readable, a-z) |\n\n| property\\\
    _section || int(11) unsigned ||   || Property Section ID |\n\n| property\\_id\
    \ || int(11) unsigned ||   || Property Item ID |\n\n| remote\\_ip || varchar(255)\
    \ ||   || Remote IP from user making request |\n\n| stamp || datetime ||   ||\
    \ Timestamp of request |\n\nAs you can see, our docs generator is already paying\
    \ for itself. This is our migration, with the comments stripped out to cut down\
    \ verbosity:\n\n```\n 1 CREATE TABLE `incoming` (\n 2  `id` bigint(20) unsigned\n\
    \ 3  `property` varchar(32)\n 4  `property_section` int(11) unsigned\n 5  `property_id`\
    \ int(11) unsigned\n 6  `remote_ip` varchar(255)\n 7  `stamp` datetime\n 8  PRIMARY\
    \ KEY (`id`)\n 9 );\n10 \n11 CREATE TABLE `incoming_proc` LIKE `incoming`;\n```\n\
    \nWe are automatically creating a copy of `incoming` into `incoming_proc`. This\
    \ has to do with processing caveats - renaming tables in mysql is an atomic operation,\
    \ meaning we can issue the following queries and replace the tables between each\
    \ other:\n\n```\n1 RENAME TABLE incoming TO incoming_old, incoming_proc TO incoming,\
    \ incoming_old TO in\\\n2 coming_proc;\n```\n\nThe rename table statement would\
    \ replace the tables between each other. This is to separate our reads from our\
    \ writes - one table is always getting written to, the other is getting read and\
    \ aggregated into other tables, grouped by various time intervals (hourly, daily,\
    \ monthly,…).\n\nIn the previous version of this service, the table schema had\
    \ an ID field which was an AUTO\\_INCREMENT. In InnoDB, an AUTO\\_INCREMENT column\
    \ triggers a special table-level lock, which blocks other transactions so that\
    \ they recieve consecutive primary key values. We aren’t resorting to auto incrementing\
    \ fields so we already eliminated a possible source of performance issues.\n\n\
    After adding the migration, we run `make`, so all our assets are generated.\n\n\
    ### Improving the microservice environment\n\nWe do a few improvements of our\
    \ code generators in order to increase consistency. Since wire generates `wire_gen.go`,\
    \ we rename our `types_db.go` to `types_gen.go` so we can be consistent. We also\
    \ notice that the fields from our migration result in a few oddly named struct\
    \ fields:\n\n*   Id\n\n*   PropertyId\n\n*   RemoteIp\n\nWhen we were writing\
    \ our camelizer, we didn’t consider that we want to stay compliant with common\
    \ Go naming styles, e.g. “JSON” instead of “Json”. Let’s quickly improve that\
    \ part of our code generator, by importing a package that handles common initialisms.\n\
    \n```\n1 package main\n2 \n3 import (\n4   \"github.com/serenize/snaker\"\n5 )\n\
    6 \n7 func camel(input string) string {\n8   return snaker.SnakeToCamel(input)\n\
    9 }\n```\n\nAnd now we can use ID, PropertyID and RemoteIP respectively. The package\
    \ [serenize/snaker](https://github.com/serenize/snaker) lists common initialisms\
    \ which it sources from [golang/lint#lint.go](https://github.com/golang/lint/blob/fdd1cda4f05fd1fd86124f0ef9ce31a0b72c8448/lint.go#L770).\
    \ We can even add golint to our CI jobs? Let’s do it. Add the following at the\
    \ end of `docker/build/Dockerfile`:\n\n```\n1 # Install golint\n2 RUN go get -u\
    \ golang.org/x/lint/golint\n```\n\nRebuild the image by running `make` and `make\
    \ push` so it can be used with Drone, and then let’s add a Makefile target and\
    \ Drone CI step to lint our code:\n\n```\n1 lint:\n2   golint -set_exit_code ./...\n\
    ```\n\nAnd our `.drone.yml`:\n\n```\n1 --- a/.drone.yml\n2 +++ b/.drone.yml\n\
    3 @@ -29,6 +29,7 @@ steps:\n4    commands:\n5      - make tidy\n6      - wire\
    \ ./...\n7 +    - make lint\n8      - make build\n```\n\nI fixed the issues that\
    \ showed up, mostly about having comments for exported fields, like:\n\n```\n\
    \ 1 --- a/templates/client_wire.go.sh\n 2 +++ b/templates/client_wire.go.sh\n\
    \ 3 @@ -15,6 +15,7 @@ function render_wire {\n 4         done\n 5         echo\
    \ \")\"\n 6         echo\n 7 +       echo \"// Inject produces a wire.ProviderSet\
    \ with our RPC clients\"\n 8         echo \"var Inject = wire.NewSet(\"\n 9  \
    \       for schema in $schemas; do\n10                 echo -e \"\\t${schema}.New,\"\
    \n```\n\nAnd after adding all the possible comments to our code generated code\
    \ and a few stylistic fixes around our `db` package, we are ready to implement\
    \ our service up to spec.\n\n### Implementing Push\n\nAs mentioned before, we\
    \ will need an additional dependency - as we don’t have an AUTO\\_INCREMENT column,\
    \ we will use a Sonyflake ID generator to provide us with k-sortable uint64 values.\
    \ In our inject package, define the following provider:\n\n```\n 1 import (\n\
    \ 2   \"os\"\n 3   \"strconv\"\n 4 \n 5   \"github.com/sony/sonyflake\"\n 6 )\n\
    \ 7 \n 8 // Sonyflake produces a sonyflake ID generator dependency\n 9 func Sonyflake()\
    \ *sonyflake.Sonyflake {\n10   var serverID uint16\n11   if val, err := strconv.ParseInt(os.Getenv(\"\
    SERVER_ID\"), 10, 16); err == nil {\n12     serverID = uint16(val)\n13   }\n14\
    \   if serverID > 0 {\n15     return sonyflake.NewSonyflake(sonyflake.Settings{\n\
    16       MachineID: func() (uint16, error) {\n17         return serverID, nil\n\
    18       },\n19     })\n20   }\n21   return sonyflake.NewSonyflake(sonyflake.Settings{})\n\
    22 }\n```\n\nSonyflake has 16 bits reserved for a Machine ID. By default, Sonyflake\
    \ calculates the Machine ID from the bottom 16 bits of a valid LAN address from\
    \ your container. This may prove problematic if you run your services on multiple\
    \ stand alone hosts, as the individual networks may provision the same IP to multiple\
    \ instances of your service. I added in support for a `SERVER_ID` environment\
    \ variable to be prepared for this.\n\nUpdate the ProviderSet in the inject package:\n\
    \n```\n1 // Inject is the main ProviderSet for wire\n2 var Inject = wire.NewSet(\n\
    3   db.Connect,\n4   Sonyflake,\n5   client.Inject,\n6 )\n```"
