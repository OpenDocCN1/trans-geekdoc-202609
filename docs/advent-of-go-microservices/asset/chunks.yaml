- raw: "Now, we didn’t define any exposed ports on the container, but that’s not important.\
    \ We can access any publicly exposed port from the container, all we need to do\
    \ is find out the IP that it’s using. We can do that like this:\n\n```\n1 # docker\
    \ inspect microservice_stats_1 | grep IPAddress\n2       \"SecondaryIPAddresses\"\
    : null,\n3       \"IPAddress\": \"\",\n4               \"IPAddress\": \"172.24.0.3\"\
    ,\n```\n\nWe can quickly verify by issuing a simple curl request:\n\n```\n1 #\
    \ curl -s http://172.24.0.3:3000 | jq .\n2 {\n3   \"code\": \"bad_route\",\n4\
    \   \"msg\": \"unsupported method \\\"GET\\\" (only POST is allowed)\",\n5   \"\
    meta\": {\n6     \"twirp_invalid_route\": \"GET /\"\n7   }\n8 }\n```\n\nThe actual\
    \ endpoint for our service is available on the following link:\n\n*   `/twitch/stats.StatsService/Push`\n\
    \nLet’s first start with bogus request with invalid data:\n\n```\n1 curl -s -X\
    \ POST -H 'Content-Type: application/json' \\\n2      http://172.24.0.3:3000/twirp/stats.StatsService/Push\
    \ \\\n3      -d '{\"userID\": \"2\"}' | jq .\n```\n\nThe response we get back\
    \ is:\n\n```\n1 {\n2   \"code\": \"internal\",\n3   \"msg\": \"received a nil\
    \ *PushResponse and nil error while calling Push. nil respons\\\n4 es are not\
    \ supported\"\n5 }\n```\n\nWell, the error isn’t entirely expected, but it’s an\
    \ easy fix. Instead of returning nil at the end of our Push function, we’ll just\
    \ create a PushResponse instance with `new()`:\n\n```\n 1 --- a/server/stats/server_push.go\n\
    \ 2 +++ b/server/stats/server_push.go\n 3 @@ -31,5 +31,5 @@ func (svc *Server)\
    \ Push(ctx context.Context, r *stats.PushRequest)\\\n 4  (*stats.PushR\n 5  \n\
    \ 6         query := fmt.Sprintf(\"insert into %s (%s) values (%s)\", IncomingTable,\
    \ field\\\n 7 s, named)\n 8         _, err = svc.db.NamedExecContext(ctx, query,\
    \ row)\n 9 -       return nil, err\n10 +       return new(stats.PushResponse),\
    \ err\n11  }\n```\n\nRe-issuing the requests returns a valid but empty response\
    \ (JSON: `{}`). But wait, we literally sent invalid data to our RPC, how come\
    \ we didn’t error out? Let’s revisit the structure for `PushRequest`:\n\n```\n\
    1 type PushRequest struct {\n2   Property string `json:\"property,omitempty\"\
    `\n3   Section  uint32 `json:\"section,omitempty\"`\n4   Id       uint32 `json:\"\
    id,omitempty\"`\n5 }\n```\n\nInspecting the JSON tags on the PB generated fields,\
    \ we see that they have `omitempty` set. This is the reason why we don’t get a\
    \ JSON decoder error on the request, as none of the fields are mandatory. The\
    \ encoding/json package also works in a way, where you don’t need to decode every\
    \ bit of the JSON structure, so our bogus `userID` payload just gets ignored.\n\
    \nObviously, this a job for validation. Let’s add some basic checks for valid\
    \ input. Add the following checks at the beginning of our Push() implementation:\n\
    \n```\n 1   validate := func() error {\n 2     if r.Property == \"\" {\n 3   \
    \    return errors.New(\"Missing Property\")\n 4     }\n 5     if r.Property !=\
    \ \"news\" {\n 6       return errors.New(\"Invalid Property\")\n 7     }\n 8 \
    \    if r.Id < 1 {\n 9       return errors.New(\"Missing ID\")\n10     }\n11 \
    \    if r.Section < 1 {\n12       return errors.New(\"Missing Section\")\n13 \
    \    }\n14     return nil\n15   }\n16   if err := validate(); err != nil {\n17\
    \     return nil, err\n18   }\n```\n\nRebuild with `make build`, `make docker.stats`\
    \ and reload the service with `docker-compose up -d`. Retrying the previous request\
    \ now ends up like this:\n\n```\n1 {\n2   \"code\": \"internal\",\n3   \"msg\"\
    : \"Missing Property\",\n4   \"meta\": {\n5     \"cause\": \"*errors.errorString\"\
    \n6   }\n7 }\n```\n\nYay! Let’s craft a valid request, and get back to an empty\
    \ response.\n\n```\n 1 #!/bin/bash\n 2 payload='{\n 3   \"property\": \"news\"\
    ,\n 4   \"section\": 1,\n 5   \"id\": 1\n 6 }'\n 7 \n 8 curl -s -X POST -H 'Content-Type:\
    \ application/json' \\\n 9      http://172.24.0.3:3000/twirp/stats.StatsService/Push\
    \ \\\n10      -d \"$payload\" | jq .\n```\n\nEverything works as expected. Let’s\
    \ verify by inspecting the contents of the incoming table in the database. Run\
    \ the following command to verify:\n\n```\n 1 # docker-compose exec db mysql -u\
    \ root stats -e 'select * from incoming'\n 2 +--------------------+----------+------------------+-------------+------------+-----\\\
    \n 3 ----------------+\n 4 | id                 | property | property_section\
    \ | property_id | remote_ip  | stam\\\n 5 p               |\n 6 +--------------------+----------+------------------+-------------+------------+-----\\\
    \n 7 ----------------+\n 8 | 279831112371404803 |          |                0\
    \ |           0 | 172.24.0.1 | 2019\\\n 9 -12-14 11:12:21 |\n10 | 279831611778793475\
    \ |          |                0 |           0 | 172.24.0.1 | 2019\\\n11 -12-14\
    \ 11:17:18 |\n12 | 279833914468466691 |          |                0 |        \
    \   0 | 172.24.0.1 | 2019\\\n13 -12-14 11:40:11 |\n14 | 279835838647369731 | news\
    \     |                1 |           1 | 172.24.0.1 | 2019\\\n15 -12-14 11:59:18\
    \ |\n16 +--------------------+----------+------------------+-------------+------------+-----\\\
    \n17 ----------------+\n```\n\nIt seems we’re good. The REMOTE\\_IP seems to be\
    \ working as well, but since we have curl here, let’s forge some headers and verify\
    \ that too? We need to verify XFF and XRI headers respectively:\n\n*   XFF with\
    \ `-H \"X-Forwarded-For: 8.8.8.8, 127.0.0.1\"`\n\n*   XRI with `-X \"X-Real-IP:\
    \ 9.9.9.9\"`\n\n```\n 1 +--------------------+----------+------------------+-------------+-----------+------\\\
    \n 2 ---------------+\n 3 | id                 | property | property_section |\
    \ property_id | remote_ip | stamp\\\n 4                |\n 5 +--------------------+----------+------------------+-------------+-----------+------\\\
    \n 6 ---------------+\n 7 | 279836335454289923 | news     |                1 |\
    \           1 | 9.9.9.9   | 2019-\\\n 8 12-14 12:04:14 |\n 9 | 279836312486281219\
    \ | news     |                1 |           1 | 8.8.8.8   | 2019-\\\n10 12-14\
    \ 12:04:00 |\n11 +--------------------+----------+------------------+-------------+-----------+------\\\
    \n12 ---------------+\n```\n\nIn the words of John “Hannibal” Smith: “*I love\
    \ it when a plan comes together*”.\n\n## Go: Improving our database handling\n\
    \nAs we start to develop real services, we found out that our database handling\
    \ needs some improvements. We are going to do a series of improvements of the\
    \ current state by adding some new features, and restructuring some existing ones.\n\
    \n### Data source name - DSN\n\nWe aren’t doing any kind of data source handling\
    \ so far, but we need to inject some options into the DSN, like the following:\n\
    \n*   `parseTime=true` - needed for decoding date/datetime values into a `time.Time`,\
    \ instead of `[]byte`,\n\n*   `loc=Local` - set the location for time.Time values,\
    \ [see time.LoadLocation](https://golang.org/pkg/time/#LoadLocation),\n\n*   `collation=utf8mb4_general_ci`\
    \ - set the default collation (utf8mb4 is a given these days if you want emojis)\n\
    \nCreate `db/dsn.go`:\n\n```\n 1 package db\n 2 \n 3 import \"strings\"\n 4 \n\
    \ 5 func cleanDSN(dsn string) string {\n 6   dsn = addOptionToDSN(dsn, \"?\",\
    \ \"?\")\n 7   dsn = addOptionToDSN(dsn, \"collation=\", \"&collation=utf8_general_ci\"\
    )\n 8   dsn = addOptionToDSN(dsn, \"parseTime=\", \"&parseTime=true\")\n 9   dsn\
    \ = addOptionToDSN(dsn, \"loc=\", \"&loc=Local\")\n10   dsn = strings.Replace(dsn,\
    \ \"?&\", \"?\", 1)\n11   return dsn\n12 }\n13 \n14 func addOptionToDSN(dsn, match,\
    \ option string) string {\n15   if !strings.Contains(dsn, match) {\n16     dsn\
    \ += option\n17   }\n18   return dsn\n19 }\n```\n\nThe `cleanDSN` function will\
    \ append default options to the dsn, if they aren’t already provided. If you will\
    \ specify `?loc=UTC` to your microservice DSN environment, that option will be\
    \ used, instead of the refault `loc=Local`.\n\nWe would also like to output the\
    \ DSN into the logs, without outputing the credentials. We’ll resort to a simple\
    \ regular expression to mask the DSN username and password. Create `db/dsn_mask.go`:\n\
    \n```\n 1 package db\n 2 \n 3 import \"regexp\"\n 4 )\n 5 \n 6 var dsnMasker =\
    \ regexp.MustCompile(\"(.)(?:.*)(.):(.)(?:.*)(.)@\")\n 7 \n 8 func maskDSN(dsn\
    \ string) string {\n 9   return dsnMasker.ReplaceAllString(dsn, \"$1****$2:$3****$4@\"\
    )\n10 }\n```"
