- raw: "Now, we can get the generated source code by calling `buf.Bytes()`. We can\
    \ also load the `go/format` package, and push the source code through a formatter.\
    \ At the tail end of the renderGo function, add the following code which formats\
    \ the source and saves `types_db.go`.\n\n```\n 1 filename := path.Join(basePath,\
    \ \"types_db.go\")\n 2 contents := buf.Bytes()\n 3 \n 4 formatted, err := format.Source(contents)\n\
    \ 5 if err != nil {\n 6   // fall back to unformatted source to inspect\n 7  \
    \ // the saved file for the error which occured\n 8   formatted = contents\n 9\
    \   log.Println(\"An error occured while formatting the go source: %s\", err)\n\
    10   log.Println(\"Saving the unformatted code\")\n11 }\n12 \n13 fmt.Println(filename)\n\
    14 \n15 return ioutil.WriteFile(filename, formatted, 0644)\n```\n\nThe Makefile\
    \ command to invoke the go struct generator changes. Let’s just explicitly add\
    \ `-format` and `-output` so we can generate the file in the specified folder.\n\
    \n```\n1 - > server/$(SERVICE)/types_db.go\n2 + -format go -output server/$(SERVICE)\n\
    ```\n\nWe can verify if types\\_db.go is still generated correctly. Let’s run\
    \ make and verify. Somewhere in the output of `make`, the following line shows\
    \ up:\n\n```\n1 [migrations:18] server/stats/types_db.go\n```\n\nThis means that\
    \ the `fmt.Println` was executed, and the file was written just after that. If\
    \ we open the file and verify, we will see that the generated struct is there,\
    \ so we didn’t break anything.\n\n### Implementing a markdown output renderer\n\
    \nWe started with an empty stub, and now it’s up to us to implement the renderer\
    \ to Markdown. For this, we need to set some simple requirements:\n\n*   we want\
    \ to create the output dir\n\n*   each table needs to be in it’s own file (`[table_name].md`),\n\
    \n*   we will print the table name as the title,\n\n*   optionally we will print\
    \ the table description if any,\n\n*   and produce a padded, human readable, markdown\
    \ table with the sql table structure\n\nWe can start with the very simple one:\n\
    \n```\n1 // create output folder\n2 if err := os.MkdirAll(basePath, 0755); err\
    \ != nil {\n3   return err\n4 }\n```\n\nWith a call to MkdirAll we recursively\
    \ create the output folder. Since renderGo also needs to create a folder, we copy\
    \ the snippet into renderGo as well. Now, we can move on to loop over the tables\
    \ in our schema, and individually render the markdown contents for them.\n\n```\n\
    \ 1 // generate individual markdown files with schema\n 2 for _, table := range\
    \ tables {\n 3   filename := path.Join(basePath, table.Name+\".md\")\n 4 \n 5\
    \   contents := renderMarkdownTable(table)\n 6   if err := ioutil.WriteFile(filename,\
    \ contents, 0644); err != nil {\n 7     return err\n 8   }\n 9 \n10   fmt.Println(filename)\n\
    11 }\n12 return nil\n```\n\nThis function will break out if an error occurs on\
    \ ioutil.WriteFile. Possible errors include you not having write permissions for\
    \ the file, or out of disk space. As renderMarkdown returns an error, we can pass\
    \ this information back to main() and error out with a relevant error message.\n\
    \nNow we can move to the individual table markdown output generator. Now, markdown\
    \ can read tables in the following format:\n\n```\n1 |Name|Type|Key|Comment|\n\
    2 |--|--|--|--|\n3 |1|2|3|4|\n```\n\nThe obvious issue is that without correct\
    \ padding, this isn’t very human readable. We want to generate output as close\
    \ to this as possible:\n\n```\n1 | Name | Type | Key | Comment |\n2 |------|------|-----|---------|\n\
    3 | 1    | 2    | 3   | 4       |\n```\n\nNow, we immediately notice something\
    \ - the heading of the table also counts as the length of a column, and adds to\
    \ the padding below. We need to set the initial padding to the length of the column\
    \ title:\n\n```\n1 // calculate initial padding from table header\n2 titles :=\
    \ []string{\"Name\", \"Type\", \"Key\", \"Comment\"}\n3 padding := map[string]int{}\n\
    4 for _, v := range titles {\n5   padding[v] = len(v)\n6 }\n```\n\nAfter this,\
    \ we need to loop through each table column, and adjust the padding for each markdown\
    \ column depending on the data returned. To make the code a bit clearer, we also\
    \ create a local `max(a,b int) int` function.\n\n```\n 1 max := func(a, b int)\
    \ int {\n 2   if a > b {\n 3     return a\n 4   }\n 5   return b\n 6 }\n 7 \n\
    \ 8 // calculate max length for columns for padding\n 9 for _, column := range\
    \ table.Columns {\n10   padding[\"Name\"] = max(padding[\"Name\"], len(column.Name))\n\
    11   padding[\"Type\"] = max(padding[\"Type\"], len(column.Type))\n12   padding[\"\
    Key\"] = max(padding[\"Key\"], len(column.Key))\n13   padding[\"Comment\"] = max(padding[\"\
    Comment\"], len(column.Comment))\n14 }\n```\n\nNow, we should have the required\
    \ length for each column in the `padding` variable. Naively, we could resort to\
    \ something like `strings.Repeat` and length checks to calculate the padding required\
    \ based on the cell contents length, but we can resort to the formatting features\
    \ of `fmt` print functions, namely the width value for any type.\n\n```\n1 %f\
    \     default width, default precision\n2 %9f    width 9, default precision\n\
    3 %.2f   default width, precision 2\n4 %9.2f  width 9, precision 2\n5 %9.f   width\
    \ 9, precision 0\n```\n\nWith our particular case, we need to print `%10s` to\
    \ pad a string to the length of 10. By default, the string is padded on the left,\
    \ but there’s a flag for that as well. We can print `%-10s`, and the field will\
    \ be left justified, like we want.\n\n```\n 1 // use fmt.Sprintf to add padding\
    \ to columns, left align columns\n 2 format := strings.Repeat(\"| %%-%ds \", len(padding))\
    \ + \"|\\n\"\n 3 \n 4 // %%-%ds becomes %-10s, which right-pads string to len=10\n\
    \ 5 paddings := []interface{}{\n 6   padding[\"Name\"],\n 7   padding[\"Type\"\
    ],\n 8   padding[\"Key\"],\n 9   padding[\"Comment\"],\n10 }\n11 format = fmt.Sprintf(format,\
    \ paddings...)\n```\n\nUltimately, we end up with a formatting string which we\
    \ can pass to fmt.Sprintf and can be used for each row of the table. The string\
    \ may be something like `| %-10s | %-5s | %-3s | %-50s |`. Now, the print functions\
    \ in fmt take `...interface{}` as the parameters, so unfortunately, we can’t just\
    \ use `titles...` since the types don’t match. We need to coerce the type into\
    \ `[]interface{}`, just like we did with the paddings above.\n\n```\n 1 // create\
    \ initial buffer with table name\n 2 buf := bytes.NewBufferString(fmt.Sprintf(\"\
    # %s\\n\\n\", table.Name))\n 3 \n 4 // and comment\n 5 if table.Comment != \"\"\
    \ {\n 6   buf.WriteString(fmt.Sprintf(\"%s\\n\\n\", table.Comment))\n 7 }\n 8\
    \ \n 9 // write header row strings to the buffer\n10 row := []interface{}{\"Name\"\
    , \"Type\", \"Key\", \"Comment\"}\n11 buf.WriteString(fmt.Sprintf(format, row...))\n\
    ```\n\nAfter the header row, we need to output the divider. All the padding from\
    \ the values should just be replaced with dash characters, all we need is to pass\
    \ a row with empty columns.\n\n```\n1 // table header/body delimiter\n2 row =\
    \ []interface{}{\"\", \"\", \"\", \"\"}\n3 buf.WriteString(strings.Replace(fmt.Sprintf(format,\
    \ row...), \" \", \"-\", -1))\n```\n\nAnd now we are left with printing the columns:\n\
    \n```\n1 // table body\n2 for _, column := range table.Columns {\n3   row := []interface{}{column.Name,\
    \ column.Type, column.Key, column.Comment}\n4   buf.WriteString(fmt.Sprintf(format,\
    \ row...))\n5 }\n6 \n7 // return byte slice for writing to file\n8 return buf.Bytes()\n\
    ```\n\nEdit the Makefile to add the db-schema-cli renderer with the following\
    \ parameters:\n\n*   `-format markdown` - sets the renderer,\n\n*   `-output docs/schema/$(SERVICE)`\
    \ - sets the output path\n\nAt the end of the `migrate.%` target, copy the following\
    \ line:\n\n```\n1   ./build/db-schema-cli-linux-amd64 -schema $(SERVICE) -db-dsn\
    \ \"root:$(MYSQL_ROOT_PA\\\n2 SSWORD)@tcp(mysql-test:3306)/$(SERVICE)\" -format\
    \ markdown -output docs/schema/$(SERV\\\n3 ICE)\n```\n\nWhen running make we can\
    \ verify that the migrations for our services are written."
