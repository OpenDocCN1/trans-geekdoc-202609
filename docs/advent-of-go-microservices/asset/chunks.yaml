  trans: "\n\n注入器（Injector）是任何返回特定类型的函数，在我们的案例中，它是数据库连接句柄 `*sqlx.DB`，或者在我们目前唯一的 RPC\
    \ 客户端中，它是 `stats.StatsService` 接口。这些每一个都可以带错误返回，也可以不带错误返回。如果带错误返回，`wire` 将生成用于错误检查的支持代码，并将错误从生成的\
    \ `Injector` 向上抛出。\n\n让我们创建 `db/connect.go` 并为数据库连接编写提供者（provider）：\n\n```go\n\
    \ 1 package db\n 2 \n 3 import (\n 4   \"errors\"\n 5   \"os\"\n 6 \n 7   \"github.com/jmoiron/sqlx\"\
    \n 8 )\n 9 \n10 func Connect() (*sqlx.DB, error) {\n11   dsn := os.Getenv(\"DB_DSN\"\
    )\n12   driver := os.Getenv(\"DB_DRIVER\")\n13   if dsn == \"\" {\n14     return\
    \ nil, errors.New(\"DB_DSN not provided\")\n15   }\n16   if driver == \"\" {\n\
    17     driver = \"mysql\"\n18   }\n19   return sqlx.Connect(driver, dsn)\n20 }\n\
    ```\n\n在这种情况下，`db.Connect` 函数是我们的数据库连接的提供者。对于我们的客户端，我们将再次采用代码生成来产生另一个 `ProviderSet`。在你的\
    \ `Makefile` 的 `templates:` 目标（主目标）下添加以下内容：\n\n```bash\n1   @./templates/client_wire.go.sh\n\
    ```\n\n然后创建包含内容的 `templates/client_wire.go.sh`：\n\n```bash\n 1 #!/bin/bash\n 2\
    \ cd $(dirname $(dirname $(readlink -f $0)))\n 3 \n 4 ## list all services\n 5\
    \ schemas=$(ls -d rpc/* | xargs -n1 basename)\n 6 \n 7 function render_wire {\n\
    \ 8   echo \"package client\"\n 9   echo\n10   echo \"import (\"\n11   echo -e\
    \ \"\\t\\\"github.com/google/wire\\\"\"\n12   echo\n13   for schema in $schemas;\
    \ do\n14     echo -e \"\\t\\\"${MODULE}/client/${schema}\\\"\"\n15   done\n16\
    \   echo \")\"\n17   echo\n18   echo \"var Inject = wire.NewSet(\"\n19   for schema\
    \ in $schemas; do\n20     echo -e \"\\t${schema}.New,\"\n21   done\n22   echo\
    \ \")\"\n23 }\n 24 \n25 render_wire > client/wire.go\n26 echo \"~ client/wire.go\"\
    \n```\n\n对于我们声明的每个服务，都在 `wire.NewSet()` 中注册了一个新的提供者，并通过 `client.Inject` 可。在我们当前的情况下，该文件如下：\n\
    \n```go\n 1 package client\n 2 \n 3 import (\n 4   \"github.com/google/wire\"\n\
    \ 5 \n 6   \"github.com/titpetric/microservice/client/stats\"\n 7 )\n 8 \n9 var\
    \ Inject = wire.NewSet(\n10   stats.New,\n11 )\n```\n\n当我们添加一个新服务时，该服务的导入会被添加，一个新的提供者会被添加到\
    \ `wire.NewSet` 调用中。这样，新服务对所有服务都可用，我们只需要将类型添加到 `Server{}` 结构中，它将由生成的注入器填充。\n\n\
    由于这些注入器是独立的，我们可以创建一个全局 `inject` 包，在单个 `ProviderSet`（`inject/inject.go`）中将它们绑定：\n\
    \n```go\n 1 package inject\n 2 \n 3 import (\n 4   \"github.com/google/wire\"\n\
    \ 5 \n 6   \"github.com/titpetric/microservice/client\"\n 7   \"github.com/titpetric/microservice/db\"\
    \n 8 )\n 9 \n10 var Inject = wire.NewSet(db.Connect, client.Inject)\n```\n\n从这里开始可以使用\
    \ wire 生成注入器。\n\n### Wire 和依赖注入\n\n我们已经为 `wire` 配置了分析代码并生成我们服务的注入器。首先，我们需要在 `Dockerfile`\
    \ 中安装 `wire`：\n\n```dockerfile\n1 +# Install wire for DI\n2 RUN get -u github.com/google/wire/cmd/wire\n\
    ```\n\n重新构建并将 dockerfile 推送到你的仓库，你就可以从 Drone 开始使用 `wire`。从 `templates/server.tpl`\
    \ 中移除 `New()` 并在 `Server{}` 结构内部声明 `*sqlx.DB` 作为依赖：\n\n```go\n 1 package ${SERVICE}\n\
    \ 2 \n 3 import (\n 4   \"context\"\n 5 \n 6   \"github.com/jmoiron/sqlx\"\n 7\
    \ \n 8   \"${MODULE}/rpc/${SERVICE}\"\n 9 )\n10 \n11 type Server struct {\n12\
    \   db *sqlx.DB\n13 }\n14 \n\n\n\n这将确保旧的构造函数与 `Wire` 创建的新构造函数之间没有冲突。现在我们将使用代码生成器模板（`templates/server_wire.tpl`）在我们的服务\
    \ `server/stats/wire.go` 下创建注入器定义：\n\n```go\n 1 //+build wireinject\n 2 \n 3 package\
    \ ${SERVICE}\n 4 \n 5 import (\n 6   \"context\"\n 7 \n 8   \"github.com/google/wire\"\
    \n 9 \n10   \"${MODULE}/inject\"\n 11 )\n 12 \n13 func New(ctx context.Context)\
    \ (*Server, error) {\n14   wire.Build(\n15     inject.Inject,\n16     wire.Struct(new(Server)),\n\
    17   )\n18   return nil, nil\n19 }\n```\n\n正如从模板所示，文件以 `//+build wireinject` 开头，这会将文件从我们的构建过程中排除。`wire`\
    \ 使用此文件加载并分析它引用的源文件，以确定了哪些依赖。\n\n确保你在 `Makefile` 的 `templates:%` 目标中调用以下行，为每个现有服务生成所需的\
    \ `wire.go` 文件：\n\n```bash\n   @envsubst < templates/server_wire.tpl > server/$(SERVICE)/wire.go\n\
    ```\n\n构建构建环境的镜像后，我们只需要在代码库上运行 `wire ./...`。我们将此添加到 drone 的构建步骤中：\n\n```yaml\n\
    1 - name: build\n2   image: titpetric/microservice-build\n3   pull: always\n4\
    \   commands:\n5     - make tidy\n6     - wire ./...\n7     - make build\n```\n\
    \n运行 `wire ./...` 会产生我们的 `wire_gen.go` 文件：\n\n```bash\n1 # wire ./...\n2 wire:\
    \ github.com/titpetric/microservice/server/stats: wrote server/stats/wire_gen.go\n\
    ```\n\n如果我们检查文件本身，我们可以看到它就像手写的一样好。服务器需要的每个依赖项都被填充了，而其他的被忽略了。在我们的情况下，这意味着我们获得了\
    \ DB 句柄，但由于我们没有使用任何 RPC 客户端，在将它们添加到 `Server` 结构之前，它们会被忽略。\n\n```go\n 1 // Code\
    \ generated by Wire. DO NOT EDIT.\n 2 \n 3 //go:generate wire\n 4 //+build !wireinject\n\
    \ 5 \n 6 package stats\n 7 \n 8 import (\n 9   \"context\"\n 10   \"github.com/titpetric/microservice/db\"\
    \n 11 )\n 12 \n13 // Injectors from wire.go:\n 14 \n15 func New(ctx context.Context)\
    \ (*Server, error) {\n16   sqlxDB, err := db.Connect()\n17   if err != nil {\n\
    18     return nil, err\n19   }\n20   server := &Server{\n21     db: sqlxDB,\n\
    22   }\n23   return server, nil\n24 }\n```\n\n返回错误的提供者在这些函数中也有进行错误处理。由于错误被保留并返回，我们可以在服务构造函数外部使用它们——在我们的案例中，我们在\
    \ `main()` 中执行了 `log.Fatal`。\n\n"
