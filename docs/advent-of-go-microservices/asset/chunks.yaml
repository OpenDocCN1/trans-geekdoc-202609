- raw: "The regular expression takes care of masking any number of characters in the\
    \ username and password part of the DSN, outputting only the first and last characters\
    \ of each, with 4 asterisks in between.\n\n### Multiple database connections\n\
    \nAs we figured out, we want to run the migrations for our app from the app itself.\
    \ In order for migrations to work, they need extended privileges, which aren’t\
    \ usually needed or wanted in a microservice.\n\nA microservice usually needs\
    \ permissions to select, insert, update and delete records, while a migration\
    \ needs permissions to create, alter, index and possibly drop tables. The [full\
    \ list of grants](https://dev.mysql.com/doc/refman/8.0/en/grant.html#grant-privileges)\
    \ is quite long, and adding them all to the account your microservice might be\
    \ using is a security issue.\n\nTo sum it up - we will need to provide two DSN\
    \ credentials, one for migrations and one for the microservice. By doing this\
    \ we are enabling a security barrier between the service, and between the migrations\
    \ which have elevated permissions.\n\nTo enable multiple database configurations,\
    \ we will add option types (`db/types.go`):\n\n```\n 1 package db\n 2 \n 3 import\
    \ (\n 4   \"context\"\n 5   \"time\"\n 6 \n 7   \"database/sql\"\n 8 )\n 9 \n\
    10 type (\n11   // Credentials contains DSN and Driver\n12   Credentials struct\
    \ {\n13     DSN    string\n14     Driver string\n15   }\n16 \n17   // ConnectionOptions\
    \ include common connection options\n18   ConnectionOptions struct {\n19     Credentials\
    \ Credentials\n20 \n21     // Connector is an optional parameter to produce our\n\
    22     // own *sql.DB, which is then wrapped in *sqlx.DB\n23     Connector func(context.Context,\
    \ Credentials) (*sql.DB, error)\n24 \n25     Retries        int\n26     RetryDelay\
    \     time.Duration\n27     ConnectTimeout time.Duration\n28   }\n29 )\n```\n\n\
    So, to connect to any database, a client needs to provide the ConnectionOptions{},\
    \ with an optional Connector that produces an \\*sql.DB. The connector is optional\
    \ and will be used to instrument our sql client without having to modify or wrap\
    \ the existing functions, but by replacing the driver in use. We’ll come back\
    \ to this later.\n\n### Updating database connections\n\nWith the introduced ConnectionOptions\
    \ struct, we have options to configure connection retry. The Retries gives us\
    \ a maximum connection try count, RetryDelay gives us a delay duration after particular\
    \ connection attempt, while the ConnectTimeout gives us a global cancellation\
    \ timeout.\n\nLet’s modify our main Connect function to use the new structures,\
    \ and add a ConnectWithOptions call that produces the same result as Connect:\n\
    \n```\n 1 // Connect connects to a database and produces the handle for injection\n\
    \ 2 func Connect(ctx context.Context) (*sqlx.DB, error) {\n 3   options := ConnectionOptions{}\n\
    \ 4   options.Credentials.DSN = os.Getenv(\"DB_DSN\")\n 5   options.Credentials.Driver\
    \ = os.Getenv(\"DB_DRIVER\")\n 6   return ConnectWithOptions(ctx, options)\n 7\
    \ }\n 8 \n 9 // ConnectWithOptions connect to host based on ConnectionOptions{}\n\
    10 func ConnectWithOptions(ctx context.Context, options ConnectionOptions) (*sqlx.DB,\
    \ e\\\n11 rror) {\n12   credentials := options.Credentials\n13   if credentials.DSN\
    \ == \"\" {\n14     return nil, errors.New(\"DSN not provided\")\n15   }\n16 \
    \  if credentials.Driver == \"\" {\n17     credentials.Driver = \"mysql\"\n18\
    \   }\n19   credentials.DSN = cleanDSN(credentials.DSN)\n20   if options.Connector\
    \ != nil {\n21     handle, err := options.Connector(ctx, credentials)\n22    \
    \ if err == nil {\n23       return sqlx.NewDb(handle, credentials.Driver), nil\n\
    24     }\n25     return nil, errors.WithStack(err)\n26   }\n27   return sqlx.ConnectContext(ctx,\
    \ credentials.Driver, credentials.DSN)\n28 }\n```\n\nNotable changes:\n\n*   we\
    \ now take a `context.Context`, so we can support cancellation (CTRL+C) from main(),\n\
    \n*   DSN validation was moved into ConnectWithOptions()\n\n*   We implemented\
    \ the connector code to wrap a \\*sql.DB into \\*sqlx.DB\n\nRe-runing wire picks\
    \ up our new `Connect` signature:\n\n```\n 1 --- a/server/stats/wire_gen.go\n\
    \ 2 +++ b/server/stats/wire_gen.go\n 3 @@ -14,7 +14,7 @@ import (\n 4  // Injectors\
    \ from wire.go:\n 5  \n 6  func New(ctx context.Context) (*Server, error) {\n\
    \ 7 -       sqlxDB, err := db.Connect()\n 8 +       sqlxDB, err := db.Connect(ctx)\n\
    \ 9         if err != nil {\n10                 return nil, err\n11         }\n\
    ```\n\nWe can now move to implement connection retrying.\n\n### Database connection\
    \ retry\n\nLet’s create a `db/connector.go` file with our retry logic:\n\n```\n\
    \ 1 package db\n 2 \n 3 import (\n 4   \"context\"\n 5   \"log\"\n 6   \"time\"\
    \n 7 \n 8   \"github.com/jmoiron/sqlx\"\n 9   \"github.com/pkg/errors\"\n10 )\n\
    11 \n12 // ConnectWithRetry uses retry options set in ConnectionOptions{}\n13\
    \ func ConnectWithRetry(ctx context.Context, options ConnectionOptions) (db *sqlx.DB,\
    \ \\\n14 err error) {\n15   dsn := maskDSN(options.Credentials.DSN)\n16 \n17 \
    \  // by default, retry for 5 minutes, 5 seconds between retries\n18   if options.Retries\
    \ == 0 && options.ConnectTimeout.Seconds() == 0 {\n19     options.ConnectTimeout\
    \ = 5 * time.Minute\n20     options.RetryDelay = 5 * time.Second\n21   }\n22 \n\
    23   connErrCh := make(chan error, 1)\n24   defer close(connErrCh)\n25 \n26  \
    \ log.Println(\"connecting to database\", dsn)\n27 \n28   go func() {\n29    \
    \ try := 0\n30     for {\n31       try++\n32       if options.Retries > 0 && options.Retries\
    \ <= try {\n33         err = errors.Errorf(\"could not connect, dsn=%s, tries=%d\"\
    , dsn, try)\n34         break\n35       }\n36 \n37       db, err = ConnectWithOptions(ctx,\
    \ options)\n38       if err != nil {\n39         log.Printf(\"can't connect, dsn=%s,\
    \ err=%s, try=%d\", dsn, err, try)\n40 \n41         select {\n42         case\
    \ <-ctx.Done():\n43           break\n44         case <-time.After(options.RetryDelay):\n\
    45           continue\n46         }\n47       }\n48       break\n49     }\n50\
    \     connErrCh <- err\n51   }()\n52 \n53   select {\n54   case err = <-connErrCh:\n\
    55     break\n56   case <-time.After(options.ConnectTimeout):\n57     return nil,\
    \ errors.Errorf(\"db connect timed out, dsn=%s\", dsn)\n58   case <-ctx.Done():\n\
    59     return nil, errors.Errorf(\"db connection cancelled, dsn=%s\", dsn)\n60\
    \   }\n61 \n62   return\n63 }\n```\n\nI tried to be brief here, but let’s go over\
    \ the notable parts:\n\n*   a goroutine is created to loop and retry connecting\
    \ to the database,\n\n*   an error channel is created to recieve the final error\
    \ from the goroutine,\n\n*   we are using named returns to keep the SLOC down\
    \ somewhat,\n\n*   a final select statement listens for: \n\n    *   context cancellation\
    \ (e.g. signal from outside)\n\n    *   overall connect timeout option as an event,\n\
    \n    *   the exit from the gorutine (connErrCh)\n\nNow, I’m pretty sure there’s\
    \ an error in there. Let me ask you a question: What happens to the goroutine\
    \ if the global ConnectTimeout is reached?\n\n### Migration improvements\n\nAs\
    \ a helper/utility, we want to run migrations from our service, if we provide\
    \ an argument like `-migrations true` (by default this would be false). We also\
    \ want to use the connection retry for the migrations, as well as our service\
    \ which will run behind it.\n\nLet’s improve `cmd/db-migrate-cli/main.go` first:\n\
    \n```\n 1 -               db struct {\n 2 -                       DSN    string\n\
    \ 3 -                       Driver string\n 4 -               }\n 5 +        \
    \       db      db.ConnectionOptions\n 6                 real    bool\n 7    \
    \             service string\n 8         }\n 9 -       flag.StringVar(&config.db.Driver,\
    \ \"db-driver\", \"mysql\", \"Database driver\")\n10 -       flag.StringVar(&config.db.DSN,\
    \ \"db-dsn\", \"\", \"DSN for database connection\")\n11 +       flag.StringVar(&config.db.Credentials.Driver,\
    \ \"db-driver\", \"mysql\", \"Databas\\\n12 e driver\")\n13 +       flag.StringVar(&config.db.Credentials.DSN,\
    \ \"db-dsn\", \"\", \"DSN for database c\\\n14 onnection\")\n```\n\nWe replace\
    \ the already existing structure with DSN and Driver name with the excepted db.ConnectionOptions.\
    \ We can now pass this to a `ConnectWithRetry` method along with a context:"
