  trans: '

    我们在上一个章节中实现了一个 Twitch RPC 生成器，但我们有一些硬核的 gRPC 粉丝要求我查看一下 gRPC 生成的内容。我也对比较这两者感兴趣，所以让我们先从构建
    gRPC 程序的脚手架开始吧。我们的主要目标是在更具体的层面比较 gRPC 与 Twitch RPC 的实现细节。


    ### 生成 gRPC 的脚手架


    我们需要稍微修改 `Makefile`，通过更改一个 `protoc` 选项来包含 `grpc` 代码生成插件：


    在 `rpc.%` 目标下，将 `go_out` 选项从：


    ```

    1 --go_out=paths=source_relative:.

    ```


    更改为：


    ```

    1 --go_out=plugins=grpc,paths=source_relative:.

    ```


    这将包含 `grpc` 插件，该插件用于生成 gRPC 客户端和服务器的代码。我们首先注意到的点是，`go.sum` 文件发生了显著变化，即有 42 个不同的包版本被列为依赖。然而，唯一特别突出的包是
    `prometheus/client_model`。这可能意味着 gRPC 服务器的内部实现原生支持某些自定义的 Prometheus 指标。我们绝对没有从
    Twitch RPC 中获得这些，但我们计划添加插化支持。


    ### 比较服务器端


    通过检查更改 `*.pb.go` 文件，我们可以比较 Twitch RPC 生成的接口与 gRPC 生成的内容。gRPC 的 `protoc` 生成器生成两个不同的接口：`StatsServiceClient`
    和 `StatsServiceServer`。由于我们对第一个感兴趣，让我们现在比较一下：


    ```

    1 // StatsServiceServer 是 StatsService 服务的服务器 API。

    2 type StatsServiceServer interface {

    3   Push(context.Context, *PushRequest) (*PushResponse, error)

    4 }

    ```


    与 Twitch RPC 相比：


    ```

    1 type StatsService interface {

    2   Push(context.Context, *PushRequest) (*PushResponse, error)

    3 }

    ```


    因此，首先我们看到 Twitch RPC 服务的实现与我们的 gRPC 服务器是兼容。这意味着如果我们决定从 Twitch 迁移到 gRPC，我们的工作流将不会发生任何变化。


    我们可以运行一个同时暴露 gRPC 和 Twirp 端点的单一服务。同时维护这两者似乎不是个好主意，但由于我们的服务本身没有任何特定的 Twirp 实现，看起来我们可以毫不费力地运行这两个点。


    ### 比较客户端


    区别似乎在于客户端本身：


    ```

    1 type StatsServiceClient interface {

    2   Push(ctx context.Context, in *PushRequest, opts ...grpc.CallOption) (*PushResponse\

    3 , error)

    4 }

    ```


    虽然 Twirp 客户端和服务器遵循单一接口，但 gRPC 客户端拥有额外的选项。快速浏览 [`grpc.CallOption`](https://godoc.org/google.golang.org/grpc#CallOption)
    为我们提供了一个可能的构造函数列表。正如 Google API 通常的情况一样，在目前列出的选项中：


    * `CallContentSubtype` (string) 可以设置为在网络传输上使用 JSON 编码，


    * `CallCustomCodec` - 已弃（使用 `ForceCodec`）


    * `FailFast` - 已弃（使用 `WaitForReady`）


    * `ForceCodec`


    * `WaitForReady`


    * `Header`


    * `CallCustomCodec`


    * `Recv`


    * `MaxCallSize`


    * `Peer`


    * `PerRPCredentials`


    * `MD`


    * `Trailer`


    * `UseCompress`


    * `WaitForReady`


    因此，首先我们看到 Twitch RPC 服务的实现与我们的 gRPC 服务器是兼容。这意味着如果我们决定从 Twitch 迁移到 gRPC，我们的工作流将不会发生任何变化。

    '
