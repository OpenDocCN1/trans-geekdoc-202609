- raw: "We implemented a Twitch RPC generator in the previous chapter, but we do have\
    \ some hard core gRPC fans that requested that I should check out what gRPC produces.\
    \ I am interested into comparing these two as well, so let’s start by scaffolding\
    \ our gRPC handlers. Our main goal is to compare the implementation details of\
    \ gRPC over Twitch RPC in more concrete terms.\n\n### Generating the gRPC scaffolding\n\
    \nWe need to modify the `Makefile` slightly, in order to include the `grpc` codegen\
    \ plugin, by changing a protoc option:\n\nUnder the `rpc.%` target, change the\
    \ `go_out` option, from:\n\n```\n1 --go_out=paths=source_relative:.\n```\n\nto\
    \ the following:\n\n```\n1 --go_out=plugins=grpc,paths=source_relative:.\n```\n\
    \nThis will include the `grpc` plugin that generates the code for the gRPC Client\
    \ and Server. The first thing we can notice is that there is a significant change\
    \ in our `go.sum` file, namely that 42 different package versions have been listed\
    \ as dependencies. The only package that really stands out however is `prometheus/client_model`.\
    \ This might mean that the gRPC server implementation internals support some custom\
    \ prometheus metrics out of the box. We definitely don’t get that from Twitch\
    \ RPC, but we are planning to add on instrumentation.\n\n### Comparing the server\
    \ side\n\nInspecting the changed `*.pb.go` files, we can compare the interface\
    \ produced by Twitch RPC, and what gRPC produces. The gRPC protoc generator produces\
    \ two distinct interfaces, `StatsServiceClient` and `StatsServiceServer`. As we\
    \ are interested in the first one, let’s compare it now:\n\n```\n1 // StatsServiceServer\
    \ is the server API for StatsService service.\n2 type StatsServiceServer interface\
    \ {\n3   Push(context.Context, *PushRequest) (*PushResponse, error)\n4 }\n```\n\
    \nCompared to Twitch RPC:\n\n```\n1 type StatsService interface {\n2   Push(context.Context,\
    \ *PushRequest) (*PushResponse, error)\n3 }\n```\n\nSo, first, we see that the\
    \ implementation for our Twitch RPC service is compatible with our gRPC server.\
    \ This means that our workflow will not change a single bit, if we decide to migrate\
    \ from Twitch to gRPC.\n\nWe can run a single service, which exposes both gRPC\
    \ and Twirp endpoints. Maintaining them both seems like a bad idea, but as we\
    \ don’t have any Twirp specific implementation in our service itself, it seems\
    \ like we can manage to run both endpoints without difficulty.\n\n### Comparing\
    \ the client side\n\nThe difference seems to be in the client itself:\n\n```\n\
    1 type StatsServiceClient interface {\n2   Push(ctx context.Context, in *PushRequest,\
    \ opts ...grpc.CallOption) (*PushResponse\\\n3 , error)\n4 }\n```\n\nWhile the\
    \ Twirp Client and Server conform to a single interface, gRPC clients have additional\
    \ options available. A cursory reading of [grpc.CallOption](https://godoc.org/google.golang.org/grpc#CallOption)\
    \ gives us a list of possible constructors. As is supposedly common with Google\
    \ APIs, of the listed options currently:\n\n*   CallContentSubtype (string) can\
    \ be set to use JSON encoding on the wire,\n\n*   CallCustomCodec - DEPRECATED\
    \ (use ForceCodec)\n\n*   FailFast - DEPRECATED (use WaitForReady)\n\n*   ForceCodec\
    \ - EXPERIMENTAL API (wait, we just came here from CallCustomCodec)\n\n*   Header\
    \ - retrieves header metadata\n\n*   MaxCall(Recv/Send)MsgSize - client message\
    \ size limits\n\n*   MaxRetryRPCBufferSize - EXPERIMENTAL\n\n*   Peer (p \\*peer.Peer)\
    \ - Populate \\*p after RPC completes\n\n*   PerRPCCredentials - Sets credentials\
    \ for a RPC call\n\n*   Trailer (md \\*metadata.MD) - returns trailer metadata\
    \ (no idea what is a Trailer)\n\n*   UseCompressor - EXPERIMENTAL\n\n*   WaitForReady\
    \ (waitForReady bool) - if false, fail immediately, if true block/retry (default=false)\n\
    \nSo, to summarize - out of all those options, 3 are EXPERIMENTAL, 2 are DEPRECATED\
    \ and one of them is pointing to an EXPERIMENTAL option, and the biggest question\
    \ raised is how the gRPC client behaves in relation to WaitForReady, and which\
    \ option is recommended if any.\n\nIn comparison, Twitch RPC produces, at least\
    \ in my opinion, a nicer interface for specific clients:\n\n```\n1 // NewStatsServiceProtobufClient\
    \ creates a Protobuf client that implements the Stats\\\n2 Service interface.\n\
    3 func NewStatsServiceProtobufClient(addr string, client HTTPClient) StatsService\
    \ {\n4 ...\n5 \n6 // NewStatsServiceJSONClient creates a JSON client that implements\
    \ the StatsService \\\n7 interface.\n8 func NewStatsServiceJSONClient(addr string,\
    \ client HTTPClient) StatsService {\n9 ...\n```\n\ngRPC could benefit from some\
    \ interface deduplication here. The gRPC clients constructor could take those\
    \ particular call options so both the client and server could conform to the same\
    \ interface. Also, much as the server side implementation, it’s also obvious that\
    \ gRPC implements the client side as well, as the transport isn’t based on net/http:\n\
    \n```\n1 // NewStatsServiceClient creates a gRPC client that implements the StatsServiceClien\\\
    \n2 t interface.\n3 func NewStatsServiceClient(cc *grpc.ClientConn) StatsServiceClient\
    \ {\n4 ...\n```\n\nWhat we can also see is that the gRPC client can authenticate\
    \ to the gRPC server via the PerRPCCredentials option. This is also something\
    \ that Twitch RPC doesn’t provide for us. We don’t need it for our service, but\
    \ it’s something to consider if you want to increase the level of security inside\
    \ your service mesh.\n\nWe won’t create the gRPC server just yet, but we’ll keep\
    \ this codegen option enabled for the future. As we already discussed, gRPC is\
    \ a great framework to have when we have clients that can speak it natively. It’s\
    \ not great for the browser or the javascript console (am I wrong?), and it’s\
    \ definitely not great for debugging/sniffing traffic, but using the proto files\
    \ to generate the clients for Android/iPhone apps is a valid use case. gRPC has\
    \ wider code generation support than Twirp and is a better option if you want\
    \ to cover a larger ecosystem.\n\n## Make: Dynamic Makefile targets\n\nA common\
    \ pattern which we want to support when building our services is to build everything\
    \ under `rpc/{service}/{service}.proto` as well as `cmd/*` and other locations\
    \ which may be manually written or generated with various tools.\n\n### Building\
    \ multiple targets with Go\n\nGo does actually support building the whole cmd/\
    \ folder in one command:\n\n```\n1 go build -o ./build ./cmd/...\n```\n\nThis\
    \ functionality was added in Go [just recently, in the 1.13.4 tag](https://github.com/golang/go/commit/b48bda9c6f57ca9a940eac95700485b9640a62e9).\n\
    \nIt will not create the build folder itself, but will build all your applications\
    \ under based on the `./cmd/...` argument. Why do we need dynamic makefile targets?\
    \ We can live without them for building multiple Go programs, but we don’t only\
    \ need them for building the cmd/ folder, but for other code generation folders\
    \ as well.\n\nWe could resort to `//go:generate` tags to invoke our files, but\
    \ it would again mean some duplication/replication of responsibility. Defining\
    \ a single dynamic Makefile target keeps all the logic in one place. It also allows\
    \ you to customize the build steps to target multiple architectures, operating\
    \ systems, and other use cases.\n\nLet’s learn how dynamic Makefile targets work\
    \ and try to cover our use cases.\n\n### Dynamic Makefile target for building\
    \ RPC/Protobuf files\n\nThe first target that we want to support is running all\
    \ code generation required for our RPC services. We define a `rpc` makefile target,\
    \ and use dynamic execution to build a list of dynamic targets:\n\n```\n1 rpc:\
    \ $(shell ls -d rpc/* | sed -e 's/\\//./')\n```\n\nHere we use the make built-in\
    \ feature to run a shell, and with the output of that shell command define our\
    \ dynamic targets. For each folder found under `rpc/`, a target like `rpc.{folder}`\
    \ is created. For example, if we wanted to build the code for a target, we could\
    \ do:\n\n```\n1 rpc.stats:\n2   protoc --proto_path=$GOPATH/src:. -Irpc/stats\
    \ --go_out=paths=source_relative:. rpc\\\n3 /stats/stats.proto\n4   protoc --proto_path=$GOPATH/src:.\
    \ -Irpc/stats --twirp_out=paths=source_relative:. \\\n5 rpc/stats/stats.proto\n\
    ```"
