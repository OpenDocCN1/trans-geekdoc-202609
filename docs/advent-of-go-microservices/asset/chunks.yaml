    \ `cmd/stats/main.go` 开始，包含一个 hello world 来欢迎我们。我们稍后会回来为实际的服务搭建脚架。\n\n```go\n\
    1 package main\n2 \n3 void main() {\n4   println(\"Hello world\")\n5 }\n```\n\n\
    利用我们从 `rpc` 目标中学到的动态目标知识，让我们创建一个 `build` 目标，通过运行 `make build` 来构建我们将放在 `cmd/`\
    \ 下的所有应用程序。\n\n```makefile\n1 build: export GOOS = linux\n2 build: export GOARCH\
    \ = amd64\n3 build: export CGO_ENABLED = 0\n4 build: $(shell ls -d cmd/* | sed\
    \ -e 's///./')\n5   echo OK.\n6 \n7 build.%: SERVICE=$*\n8 build.%:\n9   go build\
    \ -o build/$(SERVICE)-$(GOOS)-$(GOARCH) cmd/$(SERVICE)/*.go\n```\n\n对于主 `build`\
    \ 目标，我们定义了构建变量——我们想要为 `linux`、`amd64` 构建服务，并且想要禁用 `CGO` 以获得静态二进制文件。我们列出所有 `cmd`\
    \ 路径并将它们映射到 `build.%`，类似于我们处理 `rpc` 目标的方法。剩下的工作是在 `.drone.yml` 的末尾添加 `make build`并将\
    \ `build` 文件夹添加到 `.gitignore`。\n\n在生成代码时，[envsubst](https://www.gnu.org/software/gettext/envsubst.html)\
    \ 是 get 套件的一部分。在最简单的形式下，它接受模板文件并替换其中的任何变量，然后输出结果。如果模板中有孤立的 `$` 字符，效果并不理想。\n\n\
    ### 生成我们的 cmd/ 文件夹\n\n在生成的文件中需要的第一个变量是项目所在的完整路径。我们可以从项目根目录下的 `go.mod` 文件获取该名称。让我们从\
    \ `make templates` 开始一个动态规则：\n\n```makefile\n1 templates: $(shell ls -d rpc/*\
    \ | sed -e 's///./')\n2   @echo OK.\n3 \n4 templates.%: SERVICE=$*\n5 templates.%:\
    \ export MODULE=$(shell grep module go.mod | sed -e 's/ //')\n6 templates.%:\n\
    7   @echo templates: $(SERVICE) $(MODULE)\n```\n\n对于每个 RPC 服务，都会创建一个 `templates.{service}`\
    \ 目标，并导出 `SERVICE` 和 `MODULE` 变量。当我们使用 `envsubst` 时，环境变量将可用。让我们为 `main.go` 文件创建基础模板（保存为\
    \ `templates/cmd_main.tpl`）：\n\n```go\n1 package main\n2 \n3 // 文件是自动生成的，不要在此处修改，参见\n\
    4 // generator and template: templates/cmd_main.tpl\n5 \n6 import (\n7   \"log\"\
    \n8   \"context\"\n9 \n10   \"net/http\"\n11 \n12   _ \"github.com/go-sql-driver/mysql\"\
    \n13 \n14   \"${MODULE}/rpc/${SERVICE}\"\n15   server \"${MODULE}/server/${SERVICE}\"\
    \n16 )\n17 \n18 func main() {\n19   ctx := context.TODO()\n20 \n21   srv, err\
    \ := server.New(ctx)\n22   if err != nil {\n23     log.Fatalf(\"Error in service.New():\
    \ %+v\", err)\n24   }\n25 \n26   twirpHandler := ${SERVICE}.New${SERVICE_CAMEL}ServiceServer(srv,\
    \ nil)\n27 \n28   http.ListenAndServe(\":3000\", twirpHandler)\n29 }\n```\n\n\
    你可以看到，这里的替换唯一的一个问题就是我们需要我们编写的服务的驼峰命名名称。这很容易提供：\n\n```makefile\n1 templates.%:\
    \ export SERVICE_CAMEL=$(shell echo $(SERVICE) | sed -r 's/(^|_)([a-z])/\\U\\\
    2/g')\n```\n\n正则表达式查找两个匹配：\n\n* 字符串开头 (`^`) 或下划线 (`_`)\n* 紧跟在第一个匹配项后的字符\n\n然后将其替换为该字符的大写版本。因此\
    \ `stats` 变成 `Stats`，`hello_world` 会变成 `HelloWorld`，依此类推。让我们使用此模板生成 `cmd/stats/main.go`\
    \ 并验证输出：\n\n```bash\n1 templates.%:\n2   mkdir -p cmd/$(SERVICE)\n3   envsubst\
    \ < templates/cmd_main.tpl > cmd/$(SERVICE)/main.go\n```\n\n查看生成的 `main.go` 输出，我们可以验证一切运行正常：\n\
    \n```go\n1   twirpHandler := stats.NewStatsServiceServer(srv, nil)\n```\n\n###\
    \ 为我们的服务生成客户端\n\n我们可以生成的另一个简单模板是我们微服务的 Twirp 客户端。\n\n```go\n 1 package ${SERVICE}\n\
    \ 2\n 3 // 文件是自动生成的，不要在此处修改，参见\n 4 // generator and template: templates/client_client.go.tpl\n\
    \ 5 \n 6 import (\n 7   \"net/http\"\n 8 \n 9   \"${MODULE}/rpc/${SERVICE}\"\n\
    10 )\n11 \n12 func New() ${SERVICE}.${SERVICE_CAMEL}Service {\n13   return NewCustom(\"\
    http://${SERVICE}.service:3000\", http.Client{})\n14 }\n15 \n16 func NewCustom(addr\
    \ string, client ${SERVICE}.HTTPClient) ${SERVICE}.${SERVICE_CAMEL\\\n17 }Service\
    \ {\n18   return ${SERVICE}.New${SERVICE_CAMEL}ServiceJSONClient(addr, client)\n\
    19 }\n```\n\n不需要额外的变量，因此我们只需要在 Makefile 中添加额外的 `envsubst` 行即可：\n\n```makefile\n\
    1 templates.%:\n2   mkdir -p cmd/$(SERVICE) client/$(SERVICE)\n3   envsubst <\
    \ templates/cmd_main.tpl > cmd/$(SERVICE)/main.go\n4   envsubst < templates/client_client.tpl\
    \ > client/$(SERVICE)/client.go\n```\n\n### 服务器实现\n\n从现在开始，我们需要查看可以做什么来构建服务服务器端的实现。这里的模板将仅作为服务实现的初始存根版本，因为我们需要根据自己的实现复杂性来扩展它。\n\
    \n让我们首先向我们的构建环境 Dockerfile 中添加一个接口脚架工具：\n\n```dockerfile\n1 # 安装接口脚架\n2 RUN go\
    \ get -u github.com/josharian/impl\n```\n"
