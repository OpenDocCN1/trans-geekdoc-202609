    \ item)\n6   return nil\n7 }\n```\n\n将队列刷新到数据库需要读取队列的当前项，并清空它们以供后续的 `Push()` 调用使用。目前的实现保持了低内存占用，但当值被推入队列时会分配内存。\n\
    \n```\n 1 // Clear 返回当前队列项并清空它\n 2 func (p *Queue) Clear() (result []*Incoming)\
    \ {\n 3   length := p.Length()\n 4 \n 5   p.Lock()\n 6   defer p.Unlock()\n 7\
    \ \n 8   result, p.values = p.values[:length], p.values[length:]\n 9   return\n\
    10 }\n```\n\n最后——一个获取队列大小的实用函数：\n\n```\n1 // Length 返回当前队列大小\n2 func (p *Queue)\
    \ Length() int {\n3   p.RLock()\n4   defer p.RUnlock()\n5   return len(p.values)\n\
    6 }\n```\n\n为了让队列能够工作，它还需要两个额外的要素：\n\n1.  生产者：向队列写入数据。\n2.  消费者：从队列读取数据。\n\n###\
