- raw: "If we used `rpc/stats` as the target name, `make` wouldn’t do anything as\
    \ that file/folder already exists. This is why we are rewriting the target name\
    \ to include a `.` (rpc.stats). The obvious second part of our requirement is\
    \ to make this target dynamic. We want to build any number of services.\n\n```\n\
    \ 1 --- a/Makefile\n 2 +++ b/Makefile\n 3 @@ -1,4 +1,10 @@\n 4 -.PHONY: all\n\
    \ 5 +.PHONY: all rpc\n 6 \n 7  all:\n 8         drone exec\n 9 +\n10 +rpc: $(shell\
    \ ls -d rpc/* | sed -e 's/\\//./g')\n11 +rpc.%: SERVICE=$*\n12 +rpc.%:\n13 + \
    \ @echo '> protoc gen for $(SERVICE)'\n14 +       @protoc --proto_path=$(GOPATH)/src:.\
    \ -Irpc/$(SERVICE) --go_out=paths=source_\\\n15 relative:. rpc/$(SERVICE)/$(SERVICE).proto\n\
    16 +       @protoc --proto_path=$(GOPATH)/src:. -Irpc/$(SERVICE) --twirp_out=paths=sour\\\
    \n17 ce_relative:. rpc/$(SERVICE)/$(SERVICE).proto\n```\n\nThe `%` target takes\
    \ any option (which doesn’t include / in the pattern). We can also declare variables\
    \ like `SERVICE` for each target. The variable can also be exported into the environment\
    \ by prefixing it with `export ` (example: `rpc.%: export SERVICE=$*`). Currently\
    \ we don’t need this, but we will need it later on to pass build flags for our\
    \ cmd/ programs.\n\nThe `$*` placeholder is the matched target parameter. As the\
    \ target is `rpc.stats`, the variable here will only contain `stats` but not `rpc.`\
    \ since it’s part of the target definition.\n\nWith the `@` prefix on individual\
    \ commands in the target, we suppress the output of the command. All we need to\
    \ do is update the step in `.drone.yml` into `make rpc`, and we have support for\
    \ a dynamic number of services. Running make verifies this:\n\n```\n1 # make\n\
    2 [test:0] + make rpc\n3 [test:1] > protoc gen for stats\n4 [test:2] + go mod\
    \ tidy > /dev/null 2>&1\n5 [test:3] + go mod download > /dev/null 2>&1\n6 [test:4]\
    \ + go fmt ./... > /dev/null 2>&1\n```\n\n### Building our services from cmd/\n\
    \nFor each service, we will create a `cmd/{service}/*.go` structure, containing\
    \ at least `main.go`. Let’s start with adding a simple `cmd/stats/main.go` with\
    \ a hello world to greet us. We will come back and scaffold the actual service\
    \ later.\n\n```\n1 package main\n2 \n3 void main() {\n4   println(\"Hello world\"\
    )\n5 }\n```\n\nUsing what we learned for dynamic targets with the `rpc` target,\
    \ let’s create a `build` target which will build all the applications we will\
    \ put under `cmd/` by running `make build`.\n\n```\n1 build: export GOOS = linux\n\
    2 build: export GOARCH = amd64\n3 build: export CGO_ENABLED = 0\n4 build: $(shell\
    \ ls -d cmd/* | sed -e 's/cmd\\//build./')\n5   echo OK.\n6 \n7 build.%: SERVICE=$*\n\
    8 build.%:\n9   go build -o build/$(SERVICE)-$(GOOS)-$(GOARCH) ./cmd/$(SERVICE)/*.go\n\
    ```\n\nFor the main `build` target, we define our build environment variables\
    \ - we want to build our services for linux, for amd64 architecture, and we want\
    \ to disable CGO so we have static binaries. We list all cmd locations as dynamic\
    \ targets and remap them to `build.%`, similarly to what we do with the rpc target.\
    \ All that is left to do is to add `make build` at the end of `.drone.yml`, and\
    \ add our `/build` folder into the `.gitignore` file for our project.\n\n## Bash:\
    \ Poor mans code generation\n\nWhen it comes to generating code, I often find\
    \ that the simplest code generation only needs variable replacement. There’s a\
    \ cli utility that already facilitates this with environment variables, named\
    \ [envsubst](https://www.gnu.org/software/gettext/manual/html_node/envsubst-Invocation.html),\
    \ part of the `gettext` suite of tools.\n\nIn it’s most simple form, it takes\
    \ a template file and replaces any variables contained within, and outputs the\
    \ resulting text. It’s not super great if you have any dangling `$` characters\
    \ in your template, but for most purposes it’s going to work well.\n\n### Generating\
    \ our service cmd/ folders\n\nThe first variable that we will need in our generated\
    \ files, is the full import name that our project lives at. We can get this name\
    \ from the `go.mod` file in the root of the project. Let’s start with a dynamic\
    \ rule for `make templates` and go from there.\n\n```\n1 templates: $(shell ls\
    \ -d rpc/* | sed -e 's/rpc\\//templates./g')\n2   @echo OK.\n3 \n4 templates.%:\
    \ SERVICE=$*\n5 templates.%: export MODULE=$(shell grep ^module go.mod | sed -e\
    \ 's/module //g')\n6 templates.%:\n7   @echo templates: $(SERVICE) $(MODULE)\n\
    ```\n\nFor each of our RPC services, a `templates.{service}` target is created,\
    \ and for those, the SERVICE and MODULE environment variable are exported. When\
    \ we’re going to be using envsubst, the environment variables will be available\
    \ for replacement.\n\nLet’s create our basic template for `main.go` files (save\
    \ as `templates/cmd_main.go.tpl`):\n\n```\n 1 package main\n 2 \n 3 // file is\
    \ autogenerated, do not modify here, see\n 4 // generator and template: templates/cmd_main.go.tpl\n\
    \ 5 \n 6 import (\n 7   \"log\"\n 8   \"context\"\n 9 \n10   \"net/http\"\n11\
    \ \n12   _ \"github.com/go-sql-driver/mysql\"\n13 \n14   \"${MODULE}/rpc/${SERVICE}\"\
    \n15   server \"${MODULE}/server/${SERVICE}\"\n16 )\n17 \n18 func main() {\n19\
    \   ctx := context.TODO()\n20 \n21   srv, err := server.New(ctx)\n22   if err\
    \ != nil {\n23     log.Fatalf(\"Error in service.New(): %+v\", err)\n24   }\n\
    25 \n26   twirpHandler := ${SERVICE}.New${SERVICE_CAMEL}ServiceServer(srv, nil)\n\
    27 \n28   http.ListenAndServe(\":3000\", twirpHandler)\n29 }\n```\n\nAs you can\
    \ see, there is really only one issue with the replacements here, and that is\
    \ the need to have a camel-cased name of the service we are writing. It is quite\
    \ easy to provide it:\n\n```\n1 templates.%: export SERVICE_CAMEL=$(shell echo\
    \ $(SERVICE) | sed -r 's/(^|_)([a-z])/\\\\\n2 U\\2/g')\n```\n\nThe regular expression\
    \ replacement is looking for two matches:\n\n*   either the beggining of the string\
    \ (`^`) or an underscore (`_`)\n\n*   the character directly following the first\
    \ match\n\nAnd then replaces it with the uppercase version of this character.\
    \ So `stats` becomes `Stats`, and `hello_world` would become `HelloWorld`, and\
    \ so on. Let’s use this template to generate cmd/stats/main.go, and verify the\
    \ output:\n\n```\n1 templates.%:\n2   mkdir -p cmd/$(SERVICE)\n3   envsubst <\
    \ templates/cmd_main.go.tpl > cmd/$(SERVICE)/main.go\n```\n\nLooking at the main.go\
    \ output produced, we can verify that everything works as expected:\n\n```\n1\
    \   twirpHandler := stats.NewStatsServiceServer(srv, nil)\n```\n\n### Generating\
    \ the client for our service\n\nAnother simple template which we can generate\
    \ is the Twirp client for our microservice.\n\n```\n 1 package ${SERVICE}\n 2\
    \ \n 3 // file is autogenerated, do not modify here, see\n 4 // generator and\
    \ template: templates/client_client.go.tpl\n 5 \n 6 import (\n 7   \"net/http\"\
    \n 8 \n 9   \"${MODULE}/rpc/${SERVICE}\"\n10 )\n11 \n12 func New() ${SERVICE}.${SERVICE_CAMEL}Service\
    \ {\n13   return NewCustom(\"http://${SERVICE}.service:3000\", http.Client{})\n\
    14 }\n15 \n16 func NewCustom(addr string, client ${SERVICE}.HTTPClient) ${SERVICE}.${SERVICE_CAMEL\\\
    \n17 }Service {\n18   return ${SERVICE}.New${SERVICE_CAMEL}ServiceJSONClient(addr,\
    \ client)\n19 }\n```\n\nNo additional variables are required, so we can just add\
    \ an additional envsubst line to the makefile:\n\n```\n1 templates.%:\n2   mkdir\
    \ -p cmd/$(SERVICE) client/$(SERVICE)\n3   envsubst < templates/cmd_main.go.tpl\
    \ > cmd/$(SERVICE)/main.go\n4   envsubst < templates/client_client.go.tpl > client/$(SERVICE)/client.go\n\
    ```\n\n### Server implementation\n\nFrom here on out we need to see what we can\
    \ do to build the implementation of the server side of our service. The templating\
    \ here will serve only as an initial stubbed version of a service implementation,\
    \ as we will need to extend it with complexity of our own implementation.\n\n\
    Let’s start by adding an interface scaffolding utility to our build environment\
    \ Dockerfile:\n\n```\n1 # Install interface scaffolder\n2 RUN go get -u github.com/josharian/impl\n\
    ```\n\nUsing [josharian/impl](https://github.com/josharian/impl), we can generate\
    \ a scaffold of the interface which we need to satisfy. We can now create the\
    \ server side template like this:"
