    \ | news     |                1 |           1 | 8.8.8.8   | 2019-\\\n10 -12-24\
    \ 11:04:00 |\n11 +--------------------+----------+----------------+-------------+-----------+------\\\
    \n12 ---------------+\n```\n\n用 John “Hannibal” Smith 的话来说：“*我喜欢计划井然有序的感觉*”。\n\
    \n## Go: 改进我们的数据库\n\n当我们开始开发真实服务时，我们发现数据库处理需要一些改进。我们将通过添加新功能和重构某些功能，对当前状态进行一系列改进。\n\
    \n### 数据源名称 - DSN\n\n我们目前没有进行任何类型的数据源处理，但我们需要向 DSN 注入一些选项，如下：\n\n- `parseTime=true`\
    \ - 需要将日期/时间值解码为 `time.Time` 而不是 `[]byte`，\n- `loc=Local` - 为 `time.Time` 值设置位置，[参见\
    \ time.LoadLocation](https://golang.org/pkg/time/#LoadLocation)，\n- `collation=utf8mb4_general_ci`\
    \ - 设置默认排序规则（如果你想使用表情符号，现在通常提供 utf8mb4）。\n\n创建 `db/dsn.go`：\n\n```go\n1 package\
    \ db\n2 \n3 import \"strings\"\n4 \n5 func cleanDSN(dsn string) string {\n6  \
    \ dsn = addOptionToDSN(dsn, \"?\", \"?\")\n7   dsn = addOptionToDSN(dsn, \"collation=\"\
    , \"&collation=utf8mb4_general_ci\")\n8   dsn = addOptionToDSN(dsn, \"parseTime=\"\
    , \"&parseTime=true\")\n9   dsn = addOptionToDSN(dsn, \"loc=\", \"&loc=Local\"\
    )\n10  dsn = strings.Replace(dsn, \"?&\", \"?\", 1)\n11  return dsn\n12 }\n13\
    \ \n14 func addOptionToDSN(dsn, match, option string) string {\n15   if !strings.Contains(dsn,\
    \ match) {\n16     dsn += option\n17   }\n18   return dsn\n19 }\n```\n\n`cleanDSN`\
    \ 函数将在未提供的情况下向 `dsn` 添加默认选项。如果你为微服务 DSN 指定了 `loc=UTC`，则将使用该选项而不是默认的 `loc=Local`。\n\
    \n我们还希望将 DSN 输出到日志中，但不输出凭据。我们将采用简单的正则表达式来掩码 DSN 的用户名和密码。创建 `db/dsn_mask.go`：\n\
    \n```go\n1 package db\n2 \n3 import \"regexp\"\n4 )\n5 \n6 var dsnMasker = regexp.MustCompile(\"\
    (.)?:.*)(.):(.)?:.*)(.)@\")\n7 \n8 func maskDSN(dsn string) string {\n9   return\
    \ dsnMasker.ReplaceAllString(dsn, \"$1****$2:$3****$4@\")\n10 }\n```\n"
