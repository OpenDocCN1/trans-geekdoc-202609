    We implemented a Twitch RPC generator in the previous chapter, but we do have
    some hard core gRPC fans that requested that I should check out what gRPC produces.
    I am interested into comparing these two as well, so let’s start by scaffolding
    our gRPC handlers. Our main goal is to compare the implementation details of gRPC
    over Twitch RPC in more concrete terms.


    ### Generating the gRPC scaffolding


    We need to modify the `Makefile` slightly, in order to include the `grpc` codegen
    plugin, by changing a `protoc` option:


    Under the `rpc.%` target, change the `go_out` option, from:


    ```

    1 --go_out=paths=source_relative:.

    ```


    to the following:


    ```

    1 --go_out=plugins=grpc,paths=source_relative:.

    ```


    This will include the `grpc` plugin that generates the code for the gRPC Client
    and Server. The first thing we can notice is that there is a significant change
    in our `go.sum` file, namely that 42 different package versions have been listed
    as dependencies. The only package that really stands out however is `prometheus/client_model`.
    This might mean that the gRPC server implementation internals support some custom
    prometheus metrics out of the box. We definitely don’t get that from Twitch RPC,
    but we are planning to add on instrumentation.


    ### Comparing the server side


    Inspecting the changed `*.pb.go` files, we can compare the interface produced
    by Twitch RPC, and what gRPC produces. The gRPC `protoc` generator produces two
    distinct interfaces, `StatsServiceClient` and `StatsServiceServer`. As we are
    interested in the first one, let’s compare it now:


    ```

    1 // StatsServiceServer is the server API for StatsService service.

    2 type StatsServiceServer interface {

    3   Push(context.Context, *PushRequest) (*PushResponse, error)

    4 }

    ```


    Compared to Twitch RPC:


    ```

    1 type StatsService interface {

    2   Push(context.Context, *PushRequest) (*PushResponse, error)

    3 }

    ```


    So, first, we see that the implementation for our Twitch RPC service is compatible
    with our gRPC server. This means that our workflow will not change a single bit,
    if we decide to migrate from Twitch to gRPC.


    We can run a single service, which exposes both gRPC and Twirp endpoints. Maintaining
    them both seems like a bad idea, but as we don’t have any Twirp specific implementation
    in our service itself, it seems like we can manage to run both endpoints without
    difficulty.


    ### Comparing the client side


    The difference seems to be in the client itself:


    ```

    1 type StatsServiceClient interface {

    2   Push(ctx context.Context, in *PushRequest, opts ...grpc.CallOption) (*PushResponse\

    3 , error)

    4 }

    ```


    While the Twirp Client and Server conform to a single interface, gRPC clients
    have additional options available. A cursory reading of [`grpc.CallOption`](https://godoc.org/google.golang.org/grpc#CallOption)
    gives us a list of possible constructors. As is supposedly common with Google
    APIs, of the listed options currently:


    * `CallContentSubtype` (string) can be set to use JSON encoding on the wire,


    * `CallCustomCodec` - DEPRECATED (use `ForceCodec`)


    * `FailFast` - DEPRECATED (use `WaitForReady`)


    * `ForceCodec`


    * `WaitForReady`


    * `Header`


    * `CallCustomCodec`


    * `Recv`


    * `MaxCallSize`


    * `Peer`


    * `PerRPCredentials`


    * `MD`


    * `Trailer`


    * `UseCompress`


    * `WaitForReady`


    So, first, we see that the implementation for our Twitch RPC service is compatible
    with our gRPC server. This means that our workflow will not change a single bit,
    if we decide to migrate from Twitch to gRPC.

