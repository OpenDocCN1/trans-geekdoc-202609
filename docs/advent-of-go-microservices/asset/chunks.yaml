- raw: "APM: Transaction list\n\nDrilling down into transactions gives us observability\
    \ beyond the simple access log line. APM aggregates our requests and provides\
    \ a distribution graph, so you can figure out which requests took an extraordinary\
    \ amount of time. After all, we should be optimizing the 95th or 99th percentile,\
    \ and not just the overall average case. The low hanging fruit usually comes from\
    \ edge cases which aren’t optimized well.\n\n![APM: Transaction details](images/apm-3-transaction-detail-top.png)\n\
    \nAPM: Transaction details\n\nThere are two important things to note on the bottom\
    \ of the screen:\n\n![APM: Transaction details](images/apm-3-transaction-detail-bottom.png)\n\
    \nAPM: Transaction details\n\n*   Timeline\n\n*   Metadata\n\nThe timeline currently\
    \ contains only our transaction, but we will enrich this with spans. For example,\
    \ a span would be an SQL query, and the time it took to execute it. We can then\
    \ subdivide the transaction into implementation details and answer questions like:\n\
    \n*   How many queries against the database did the request perform?\n\n*   What\
    \ was the longest database query inside the RPC?\n\n*   How many HTTP requests\
    \ did we make?\n\n*   What was the longest HTTP request inside the RPC?\n\n* \
    \  How long does connecting to a database take?\n\nThe metadata contains the complete\
    \ HTTP request data, information about the host/container where our service is\
    \ running, which Go version our service was built with, which arguments our service\
    \ was run with, and we can extend this data with our own custom fields.\n\nOur\
    \ next step will be to instrument our database, so we can see our database queries\
    \ and things like connect latency. With that, we will have enough data about our\
    \ service, so that we can optimize and improve it.\n\n## Go: Instrumenting the\
    \ Database client with Elastic APM\n\nAfter we set up Elastic APM to log our request\
    \ transaction, the following thing we wish to instrument are the SQL queries going\
    \ to our database endpoint. Elastic APM provides instrumentation that wraps the\
    \ database/sql driver, which produces an `*sql.DB`.\n\n### Extending DB connection\n\
    \nWe already planned to produce a `*sqlx.DB` for this eventuality with the Connector\
    \ field function in `db.ConnectionOptions`:\n\n```\n1 // Connector is an optional\
    \ parameter to produce our\n2 // own *sql.DB, which is then wrapped in *sqlx.DB\n\
    3 Connector func(context.Context, Credentials) (*sql.DB, error)\n```\n\nWe can\
    \ now just modify the `Connect()` function in the DB package, to extend it with\
    \ an APM connector.\n\n```\n 1 // Connect connects to a database and produces\
    \ the handle for injection\n 2 func Connect(ctx context.Context) (*sqlx.DB, error)\
    \ {\n 3   options := ConnectionOptions{\n 4     Connector: func(ctx context.Context,\
    \ credentials Credentials) (*sql.DB, error) {\n 5       db, err := apmsql.Open(credentials.Driver,\
    \ credentials.DSN)\n 6       if err != nil {\n 7         return nil, err\n 8 \
    \      }\n 9       if err = db.PingContext(ctx); err != nil {\n10         db.Close()\n\
    11         return nil, err\n12       }\n13       return db, nil\n14     },\n15\
    \   }\n16   options.Credentials.DSN = os.Getenv(\"DB_DSN\")\n17   options.Credentials.Driver\
    \ = os.Getenv(\"DB_DRIVER\")\n18   return ConnectWithRetry(ctx, options)\n19 }\n\
    ```\n\nThere are about three notable parts to this change. First, by default we\
    \ were using `sqlx.Connect` to create the database handle and issue a Ping request\
    \ and error out. As this is an sqlx addon, we need to re-implement some functionality\
    \ here by calling Open, followed with PingContext.\n\nWhat `apmsql` does under\
    \ the scenes is to produce a `sql.Driver` interface, that wraps the original driver\
    \ for the drivers you’re already familiar with. The Elastic APM Go Agent provides\
    \ the following packages to register popular SQL drivers:\n\n*   `go.elastic.co/apm/module/apmsql/pq`\
    \ (github.com/lib/pq)\n\n*   `go.elastic.co/apm/module/apmsql/mysql` (github.com/go-sql-driver/mysql)\n\
    \n*   `go.elastic.co/apm/module/apmsql/sqlite3` (github.com/mattn/go-sqlite3)\n\
    \n### Verifying it’s working\n\nEach SQL query issued will produce what is called\
    \ a “Span”. Like the transactions, the APM client sends the query metadata and\
    \ duration, and nests it under the main request transaction. This way you can\
    \ see particularly which queries have executed within a given request.\n\nLet’s\
    \ rebuild our service with `make` and `make docker`, and run our development stack\
    \ with `docker-compose up -d`. Let’s re-run some requests with curl, and navigate\
    \ to the new transactions in the APM interface.\n\n![APM: Listing query SPANs](images/apm2-spans.png)\n\
    \nAPM: Listing query SPANs\n\nThe query shows up twice, the first one is the `prepare`\
    \ of the statement, and the second one is the `exec` of the statement. We can\
    \ click the span and get a detailed view.\n\n![APM: The query details](images/apm2-span-detail.png)\n\
    \nAPM: The query details\n\nThe particular query which ran against the database\
    \ is logged in it’s normalized form. It does not include the actual parameters\
    \ of the query being inserted.\n\n![APM: The query stack trace](images/apm2-span-trace.png)\n\
    \nAPM: The query stack trace\n\nAnd finally, we can see the stack trace of the\
    \ query being executed. We can know the path of the application call, all the\
    \ way to the calling of the database function. It’s useful to have this but I\
    \ fear that perhaps it’s not the most quick, as stack traces in Go are notably\
    \ slow, and need to be avoided if you’re working on performance.\n\nAPM makes\
    \ provisions for tuning this - a stack trace is only recorded if the span duration\
    \ is longer than 5ms, and you can tune that with an environment variable:\n\n\
    ```\n1 ELASTIC_APM_SPAN_FRAMES_MIN_DURATION=5ms\n```\n\nCheck out other possible\
    \ configuration options for the APM agent on the [agent configuration page](https://www.elastic.co/guide/en/apm/agent/go/current/configuration.html).\n\
    \nEverything in your service stays the same, now there is just the APM agent under\
    \ the hood, sending query metrics to Elastic APM as we wanted. We can use this\
    \ data to analyze the query performance and improve our application significantly.\n\
    \nLike, I can’t believe that query took 12ms. We have not tuned the database AT\
    \ ALL.\n\n## Go: Stress testing our service\n\nAs we implemented our service that\
    \ adds pageviews to the database, we realize an unfortunate circumstance. Each\
    \ insert query takes about 12ms, which means our request rate, at least per single\
    \ CPU core, is poor. We’re talking about 83 req/s poor.\n\nBut as we know that\
    \ scaling isn’t linear and you shouldn’t judge a single request, we need to perform\
    \ some stress testing to give us a better idea of where we are.\n\nNow, the best\
    \ practices of stress testing suggest that you need isolation. In our case this\
    \ means that we would need to have at least 3 servers running, one with our stress\
    \ testing tool, another with our service, and another with the database, and possibly\
    \ a fourth server with APM. This way the benchmarks won’t be tainted.\n\nNow,\
    \ considering I’m doing this on a low-end-ish thin client machine, we can be sure\
    \ that my stress tests here will be tainted. I’m running everything on a single\
    \ machine, along with a full featured desktop, so the measurements will be skewed,\
    \ but hopefully they will be good enough for some basic evaluation.\n\n### Setting\
    \ up our stress test\n\nWhat we need to do first is figure out how to stress test\
    \ some requests to our service. We need a tool that supports POST requests with\
    \ custom payloads, concurrency, and something that will spit out a total request\
    \ rate at the end.\n\nA short search leads us to wrk, and there seems to be a\
    \ modern up to date docker image with wrk available ([skandyla/wrk](https://hub.docker.com/r/skandyla/wrk/)),\
    \ so let’s try to use it straight from docker. In order to craft a POST request,\
    \ a lua script for it needs to be created. Let’s create `test.lua`:\n\n```\n1\
    \ wrk.method = \"POST\"\n2 wrk.headers['Content-Type'] = \"application/json\"\n\
    3 wrk.body   = '{\"property\":\"news\",\"section\":1,\"id\":1}'\n```\n\nAnd let’s\
    \ create a test.sh, that also takes care of getting our service container IP:"
