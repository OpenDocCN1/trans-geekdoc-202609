  trans: "\n作为一种可能性，与其使用通用的 `ProviderSet`，我们可以定义一个具体的 `Providers` 接口，它必须满足在 `Server{}`\
    \ 上声明的所有字段。该接口作为一个具体类型，可以跨越包边界，而且各个提供者的实现（或它们的单例）可以作为外部包提供。目前 `wire` 并没有真正将这一概念推向逻辑终点，对于\
    \ DI 框架来说可能太复杂了。但由于我们没有更好的选择，也不打算开始自己编写，这就是我们目前拥有的，我们可以利用它进行工作。\n\n# Docker：以安全为核心构建镜像\n\
    \n在在生产环境中运行微服务时，我们需要构建 docker 镜像。遗憾的是，安全性往往是事后考虑的，所以让我们尝试做些什么来提高安全性，使其比市上的大多数东西都要。\n\
    \n## 配置 Makefile 目标\n\n我们将从添加 Makefile 规则开始，以便我们构建和推送 docker 镜像。\n\n```\n 1 #\
    \ docker image build\n 2 \n 3 IMAGE_PREFIX := titpetric/service-\n 4 \n 5 docker:\
    \ $(shell ls -d cmd/* | sed -e 's/cmd\\//docker./')\n 6   @echo OK.\n 7 \n 8 docker.%:\
    \ export SERVICE = $(shell basename $*)\n 9 docker.%:\n10   @figlet $(SERVICE)\n\
    \ 11   docker build --rm --no-cache -t $(IMAGE_PREFIX)$(SERVICE) --build-arg service_name\\\
    \n12 =$(SERVICE) -f docker/serve/Dockerfile .\n 13 \n 14 # docker image push\n\
    \ 15 \n 16 push: $(shell ls -d cmd/* | sed -e 's/cmd\\//push./')\n 17   @echo\
    \ OK.\n 18 \n 19 push.%: export SERVICE = $(shell basename $*)\n 20 push.%:\n\
    \ 21   @figlet $(SERVICE)\n 22   docker push $(IMAGE_PREFIX)$(SERVICE)\n```\n\n\
    这个目标并没有神奇之处，它与我们已经在代码生成和服务构建构建使用的原理相同。要使用它，你只需运行 `make docker` 构建镜像，并运行 `make\
    \ push` 根据 `IMAGE_PREFIX` 的值将镜像推送到 docker hub 或你的注册表。\n\n### 基础 Dockerfile 镜像\n\
    \n在 `docker/serve/Dockerfile` 下创建我们的基础服务 Dockerfile。我们将从一些合理的默认开始，然后尝试进一步提高构建镜像的安全性。\n\
    \n```\n 1 FROM alpine:latest\n 2 \n 3 ARG service_name\n 4 ENV service_name=$service_name\n\
    \ 5 \n 6 WORKDIR /app\n 7 \n 8 ENV TZ Europe/Ljubljana\n 9 RUN apk --no-cache\
    \ add ca-certificates tzdata && ln -snf /usr/share/zoneinfo/$TZ /etc\\\n10 c/localtime\
    \ && echo $TZ > /etc/timezone\n 11 \n 12 COPY /build/${service_name}-linux-amd64\
    \ /app/service\n 13 \n 14 RUN adduser -S www-data -u 1000\n 15 USER www-data\n\
    \ 16 \n 17 EXPOSE 3000\n 18 \n 19 ENTRYPOINT [\"/app/service\"]\n```\n\n我们实际上是在\
    \ `alpine` 上构建一个功能完整的发行版。我们添加了一些实际上让我们的服务能够在某些基准上运行的包：\n\n* `ca-certificates`\
    \ 添加了发布请求所需的 SSL 证书，\n* `tzdata` 配置时区（如果你的应用在 UTC 上构建，则通常是可选的）\n\n`tzdata` 包不仅用于为\
    \ Docker 镜像设置默认时区，还需要根据时区格式化时间：\n\n```\n 1   location, err := time.LoadLocation(\"\
    Europe/Ljubljana\")\n 2   if err != nil {\n 3     fmt.Println(err)\n 4   }\n 5\
    \   t := time.Now().In(location)\n 6   fmt.Println(\"Time in:\", t)\n```\n\n从安全性来说，我们做了两件事：\n\
    \n* 我们添加了一个非用户用户 `www-data`，以便我们的服务不以 `root` 运行，\n* 我们在端口 3000 上运行服务（特权用户运行端口\
    \ 80）。\n\n这里的攻击面要求用户首先利用我们的服务，然后利用内核从 `www-data` 提升权限到 `root`，然后使用 `apk` 在容器内安装包尝试逃逸到你的主机。\n\
    \n我们能否进一步改进此？我想有两点：\n\n* 我们可以移除启用 `root` 的工具和二进制文件（移除 `apk`），\n* 与其依赖 alpine，我们可以在\
    \ `scratch` 上构建镜像，它是完全空的。\n\n### 我们的镜像的安全影响\n\n为了找出容器中封装的所有文件，可以使用 docker 列出镜像中构建的文件。由于容器有\
    \ `find`，可以通过这种方式：\n\n```\ndocker run --rm --entrypoint=/usr/bin/find titpetric/service\
    \ -type f > files.txt\n```\n\n检查文件，我们可以列出 root 文件夹哪些是安全的，哪些是不安全的：\n\n```\n 1 #\
    \ cat files.txt | perl -p -e 's/^([/]+).+/\\1/g' | uniq -c | sort -nr\n 2    9904\
    \ /sys\n 3    1362 /usr\n 4    130 /proc\n 5      51 /etc\n 6       8 /lib\n 7\
    \       3 /sbin\n 8       1 /root\n 9       1 /bin\n10       1 /app\n```\n\n我们可以\
    \ own `/sys` 和 `/proc` 文件夹，因为它们来自 docker 环境且不包含可执行文件。我们可以只检查 `PATH` 环境中的可执行文件：\n\
    \n```\n# docker run -it --rm --entrypoint=/bin/sh titpetric/service -c echo PATH='/usr/local/sbin:/usr/local/bin:/sbin:/bin:/bin'\n\
    ```\n\n由于所有可执行文件都在 `bin` 或 `sbin` 文件夹中，我们可以通过查找 `bin/` 特别列出它们：\n\n```\n 1 # cat\
    \ files.txt | grep bin/\n 2 /usr/bin/ash\n 3 /usr/bin/posix\n 4 /usr/bin/iconv\n\
    \ 5 /usr/bin/getent\n 6 /usr/bin/getconf\n 7 /usr/bin/ssl_client\n 8 /usr/bin/scanelf\n\
    \ 9 /usr/sbin/zdump\n10 /usr/sbin/update-ca-certificates\n11 /usr/sbin/zic\n12\
    \ /bin/busybox\n13 /sbin/apk\n14 /sbin/ldconfig\n15 /sbin/mkmntdirs\n```\n\n现在，更简单的权限提升攻击面需要可执行文件设置了\
    \ `setuid` 位。这意味着像 `www-data` 这样的非特权用户可以以 `root` 身份运行某些。你可以通过调用带有 `-perm -4000`\
    \ 参数的 `find` 来检查二进制文件。在我们的主机上，我们将得到这样的列表：\n\n```\n 1 # find / -perm -4000\n 2\
    \ /usr/lib/openssh/ssh-keygen\n 3 /usr/lib/eject/dmcrypt-get-device\n 4 /usr/lib/dbus-1.0/dbus-daemon-launch-helper\n\
    \ 5 /usr/bin/chfn\n 6 /usr/bin/sudo\n 7 /usr/bin/gpasswd\n 8 /usr/bin/newgrp\n\
    \ 9 /usr/bin/passwd\n10 /usr/bin/chsh\n 11 /bin/su\n12 /bin/mount\n 13 /bin/umount\n\
    ```\n\nAlpine 不带任何 `setuid` 可执行文件（至少按照我们目前的包选择），这意味着利用运行容器的唯一方法将是攻击内核。从这里开始，攻击面理论上仍然限制在运行的容器，这意味着攻击者可以以提升的\
    \ root 权限在容器内运行任何内容。另一种方法是逃离运行进程的 cgroup 并有效攻击主机。只需清理构建镜像中的执行文件即可防御第一种情况。让我们就这样做吧：\n\
    \n```\n# 删除标准 PATH 上的所有封装二进制文件\nRUN rm -rf /bin /sbin /usr/bin /usr/sbin /usr/local/bin\
    \ /usr/local/sbin\n```\n\n通过清理这些内容，我们可以确保攻击者不能在特权进程下运行 `/bin/busybox` 并获得你容器的\
    \ shell。还有其他方法可以提高容器的安全性，最终安全问题可能在于你的应用和编译的库中，因此我们无法确定绝对没有方法利用它，但至少我们已经很努力了。\n\
    \n### 可能的改进\n\n有两个处理容器安全的知名项目，你可能想看看。\n\n* [Clair](https://github.com/quay/clair)\
    \ - 常见漏洞的静态分析器，\n* [docker-slim](https://github.com/docker-slim/docker-slim) -\
    \ 合并镜像层并删除未使用文件\n\n"
