- raw: "Don’t forget to run `make && make docker`, and after you can run `docker-compose\
    \ up` and watch the service getting set up without manual migration steps.\n\n\
    ## Go: Instrumenting the HTTP service with Elastic APM\n\nElastic APM is an application\
    \ performance monitoring product Elastic, the makers of Elasticsearch, and most\
    \ notably the ELK stack (Elasticsearch, Logstash, Kibana). APM is another plug\
    \ and play product of theirs, that hooks up to your existing ELK installation\
    \ and provides endpoints for application agents to receive performance metrics\
    \ data.\n\nElastic APM provides a Go agent, which we will use to instrument various\
    \ parts of our code. The instrumentation will help us not only with performance\
    \ metrics, but with debugging and optimization of our applications as well.\n\n\
    ### Wrapping our existing handler\n\nWe already wrapped the HTTP handler with\
    \ our own, that adds IP information into the request context. APM works in the\
    \ same way, providing their own wrapper for a http.Handler. Since we can reasonably\
    \ assume that we will need other wrapers in the future, we will create another\
    \ function under `internal/wrap.go` to keep main() cleaner:\n\n```\n 1 import\
    \ (\n 2   \"strings\"\n 3 \n 4   \"net/http\"\n 5 \n 6   \"go.elastic.co/apm/module/apmhttp\"\
    \n 7 )\n 8 \n 9 // WrapAll wraps a http.Handler with all needed handlers for our\
    \ service\n10 func WrapAll(h http.Handler) http.Handler {\n11   h = WrapWithIP(h)\n\
    12   h = apmhttp.Wrap(h)\n13   return h\n14 }\n15 \n16 ...\n```\n\nThe code imports\
    \ the APM module with the HTTP handler wrapper. There are also routing framework\
    \ specific wrappers available, notably: httprouter, gorilla, cgi, gin, echo, beego,…\
    \ The full list is quite extensive, you can review them on [elastic/apm-agent-go](https://github.com/elastic/apm-agent-go/tree/master/module).\n\
    \nSo, as we have WrapAll defined now, we can fix our generator for `main.go`:\n\
    \n```\n1 --- a/templates/cmd_main.go.tpl\n2 +++ b/templates/cmd_main.go.tpl\n\
    3 @@ -48,5 +48,5 @@ func main() {\n4         twirpHandler := ${SERVICE}.New${SERVICE_CAMEL}ServiceServer(srv,\
    \ nil)\n5  \n6         log.Println(\"Starting service on port :3000\")\n7 -  \
    \     http.ListenAndServe(\":3000\", internal.WrapWithIP(twirpHandler))\n8 + \
    \      http.ListenAndServe(\":3000\", internal.WrapAll(twirpHandler))\n9  }\n\
    ```\n\nRun `make` to rebuild your app with HTTP server instrumentation.\n\nThe\
    \ wrapper takes care of creating what is called a “Transaction”. A transaction\
    \ in our case consists of the incoming request to our handler, all the way until\
    \ the completion of that request. For each request, various data is logged to\
    \ Elastic APM, the most obvious one of which is the request duration.\n\n### Logging\
    \ errors too\n\nAny request coming to your service may error out. When creating\
    \ twirpHandler, we omit the second parameter to the `NewXXXServiceServer` call,\
    \ a parameter of `*twirp.ServerHooks` type. This structure defines various hooks\
    \ implemented by the Twirp RPC server handler. We are especially interested in\
    \ the `Error` hook:\n\n```\n1 type ServerHooks struct {\n2   // Error hook is\
    \ called when an error occurs while handling a request. The\n3   // Error is passed\
    \ as argument to the hook.\n4   Error func(context.Context, Error) context.Context\n\
    5 }\n```\n\nParticularly, we want to log the error with another Elastic APM API\
    \ call, CaptureError. Let’s prepare a function that will construct an instance\
    \ of \\*twirp.ServerHooks in our internal package with a defined error logger,\
    \ under `internal/twirp.go`:\n\n```\n 1 package inject\n 2 \n 3 import (\n 4 \
    \  \"context\"\n 5 \n 6   \"github.com/twitchtv/twirp\"\n 7   \"go.elastic.co/apm\"\
    \n 8 )\n 9 \n10 func NewServerHooks() *twirp.ServerHooks {\n11   return &twirp.ServerHooks{\n\
    12     Error: func(ctx context.Context, err twirp.Error) context.Context {\n13\
    \       apm.CaptureError(ctx, err).Send()\n14       return ctx\n15     },\n16\
    \   }\n17 }\n```\n\nThe function `apm.CaptureError` takes the second parameter\
    \ of the type `error`. As the interface `twirp.Error` is a superset of the standard\
    \ `error` type, it’s already compatible with this parameter.\n\nIn our cmd\\_main.tpl\
    \ we just replace the `nil` parameter with `internal.NewServerHooks()`.\n\n```\n\
    1 -       twirpHandler := ${SERVICE}.New${SERVICE_CAMEL}ServiceServer(srv, nil)\n\
    2 +       twirpHandler := ${SERVICE}.New${SERVICE_CAMEL}ServiceServer(srv, internal.Ne\\\
    \n3 wServerHooks())\n```\n\n### Setting up ELK\n\nThere’s an utility docker image\
    \ that provides a bundled ELK installation:\n\n*   [sebp/elk](https://hub.docker.com/r/sebp/elk/)\
    \ docker hub image,\n\n*   [spujadas/elk-docker](https://github.com/spujadas/elk-docker)\
    \ github repository\n\nThe container supports ELK up to version 7.4.0. It should\
    \ be easy enough to add it into our development docker-compose.yml file. Append\
    \ the following under `services`:\n\n```\n1   elk:\n2     image: sebp/elk\n```\n\
    \nAnd run the following in order:\n\n```\n1 sysctl vm.max_map_count=512000\n2\
    \ docker-compose up -d\n```\n\nIt possibly takes a few minutes in order for ELK\
    \ to be reachable. When it completes, you can open `http://localhost:5601` in\
    \ your browser, and you’ll find yourself on the ELK console. Now we need to add\
    \ APM.\n\n### Setting up APM\n\nTurns out, we don’t really need much for APM,\
    \ just a small config file that tells it where the elasticsearch instance is where\
    \ it wants to send data to. Let’s create `docker/elk`, and inside `apm-server.yml`:\n\
    \n```\n1 apm-server:\n2   host: \"0.0.0.0:8200\"\n3 \n4 output.elasticsearch:\n\
    5   hosts: [\"elk:9200\"]\n```\n\nAnd the Dockerfile (we could avoid this with\
    \ a volume mount, but it’s trivial):\n\n```\n1 FROM docker.elastic.co/apm/apm-server:7.4.0\n\
    2 \n3 USER root\n4 COPY apm-server.yml /usr/share/apm-server/apm-server.yml\n\
    5 RUN chown root:apm-server /usr/share/apm-server/apm-server.yml\n6 \n7 USER apm-server\n\
    ```\n\nAnd finally, add APM to our `docker-compose.yml` file:\n\n```\n1   apm:\n\
    2     build: docker/apm\n```\n\nRe-run `docker-compose up -d` to start the APM\
    \ service.\n\n### Configuring our sender\n\nWe have configured ELK and APM, now\
    \ we need to configure our service to send data to APM. This is done with two\
    \ environment variables, which we can add to our service, just after DB\\_DSN:\n\
    \n```\n1      environment:\n2        DB_DSN: \"stats:stats@tcp(db:3306)/stats\"\
    \n3 +      ELASTIC_APM_SERVICE_NAME: \"stats\"\n4 +      ELASTIC_APM_SERVER_URL:\
    \ \"http://apm:8200\"\n5      command: [\n```\n\nRun `docker-compose up -d` to\
    \ reload the changed services.\n\nNow we can re-run the curl request which we\
    \ used for testing:\n\n```\n 1 #!/bin/bash\n 2 payload='{\n 3   \"property\":\
    \ \"news\",\n 4   \"section\": 1,\n 5   \"id\": 1\n 6 }'\n 7 \n 8 curl -s -X POST\
    \ -H 'Content-Type: application/json' \\\n 9      -H \"X-Real-IP: 9.9.9.9\" \\\
    \n10      http://172.22.0.5:3000/twirp/stats.StatsService/Push \\\n11      -d\
    \ \"$payload\" | jq .\n```\n\nBe sure to update the IP of the service by running\
    \ `docker inspect microservice_stats_1` and finding the actual IPAddress of the\
    \ service. Run the curl request a couple of times, so it will generate/feed some\
    \ data into APM.\n\nIf you don’t see any requests to APM from Kibana, make sure\
    \ your service build is up to date (run `make docker.stats`), and then run `docker-compose\
    \ up -d` again to recreate it.\n\n### Reviewing ELK data\n\nAs we started collecting\
    \ ELK data for our service, it’s a good time to review a few key features. After\
    \ opening up the APM menu from the left side-bar, we get a listing of every service\
    \ that we are logging, along with basic metrics like average response time, transactions/minute,\
    \ and errors/minute.\n\n![APM: The list of registered services](images/apm-1-services.png)\n\
    \nAPM: The list of registered services\n\nAfter this, we can drill down into our\
    \ service. Set an interval for the last 15 minutes, so you get some usable graphs\
    \ on the next screen. The graphs show the overall request rate and durations for\
    \ your service, and at the end of the page - individual transactions.\n\n![APM:\
    \ Service details](images/apm-2-service-detail-top.png)\n\nAPM: Service details\n\
    \nAt the bottom of the screen, individual transactions are listed:\n\n![APM: Transaction\
    \ list](images/apm-2-service-detail-bottom.png)"
