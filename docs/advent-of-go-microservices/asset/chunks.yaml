- raw: "An injector is any function that returns a particular type, like in our case,\
    \ the database connection handle, `*sqlx.DB`, or in the case of our currently\
    \ only RPC client, a `stats.StatsService` interface. Each of these can be returned\
    \ with an error, or without one. If returned with an error, wire will generate\
    \ the supporting code for error checking and bubble up the error from the generated\
    \ Injector.\n\nLet’s create `db/connect.go` with our provider for a database connection:\n\
    \n```\n 1 package db\n 2 \n 3 import (\n 4   \"errors\"\n 5   \"os\"\n 6 \n 7\
    \   \"github.com/jmoiron/sqlx\"\n 8 )\n 9 \n10 func Connect() (*sqlx.DB, error)\
    \ {\n11   dsn := os.Getenv(\"DB_DSN\")\n12   driver := os.Getenv(\"DB_DRIVER\"\
    )\n13   if dsn == \"\" {\n14     return nil, errors.New(\"DB_DSN not provided\"\
    )\n15   }\n16   if driver == \"\" {\n17     driver = \"mysql\"\n18   }\n19   return\
    \ sqlx.Connect(driver, dsn)\n20 }\n```\n\nIn this case, the `db.Connect` function\
    \ is a provider for our database connection. As for our clients, we will resort\
    \ to code generation again, to produce another ProviderSet. Add the following\
    \ to your Makefile under your `templates:` target (the main one):\n\n```\n1  \
    \ @./templates/client_wire.go.sh\n```\n\nAnd then create `templates/client_wire.go.sh`\
    \ with the following contents:\n\n```\n 1 #!/bin/bash\n 2 cd $(dirname $(dirname\
    \ $(readlink -f $0)))\n 3 \n 4 ## list all services\n 5 schemas=$(ls -d rpc/*\
    \ | xargs -n1 basename)\n 6 \n 7 function render_wire {\n 8   echo \"package client\"\
    \n 9   echo\n10   echo \"import (\"\n11   echo -e \"\\t\\\"github.com/google/wire\\\
    \"\"\n12   echo\n13   for schema in $schemas; do\n14     echo -e \"\\t\\\"${MODULE}/client/${schema}\\\
    \"\"\n15   done\n16   echo \")\"\n17   echo\n18   echo \"var Inject = wire.NewSet(\"\
    \n19   for schema in $schemas; do\n20     echo -e \"\\t${schema}.New,\"\n21  \
    \ done\n22   echo \")\"\n23 }\n24 \n25 render_wire > client/wire.go\n26 echo \"\
    ~ client/wire.go\"\n```\n\nFor each service we have declared, a new provider is\
    \ registered in wire.NewSet() and made available over `client.Inject`. In our\
    \ current case, this file is generated:\n\n```\n 1 package client\n 2 \n 3 import\
    \ (\n 4   \"github.com/google/wire\"\n 5 \n 6   \"github.com/titpetric/microservice/client/stats\"\
    \n 7 )\n 8 \n 9 var Inject = wire.NewSet(\n10   stats.New,\n11 )\n```\n\nAs we\
    \ would add a new service, the import for the service would be added, and a new\
    \ provider would be added to the `wire.NewSet` call. As such, new services immediately\
    \ become available to all existing services, all we need is to add the appropriate\
    \ type into the Server{} structure and it will get filled with the generated injector.\n\
    \nAs these injectors are stand-alone, we can create a global `inject` package,\
    \ which binds them together in a single ProviderSet (`inject/inject.go`):\n\n\
    ```\n 1 package inject\n 2 \n 3 import (\n 4   \"github.com/google/wire\"\n 5\
    \ \n 6   \"github.com/titpetric/microservice/client\"\n 7   \"github.com/titpetric/microservice/db\"\
    \n 8 )\n 9 \n10 var Inject = wire.NewSet(db.Connect, client.Inject)\n```\n\nAnd\
    \ from here on we can move towards generating the Injector with wire.\n\n### Wire\
    \ and dependency Injector\n\nWe have scaffolded all the requirements for wire,\
    \ to be able to analyze the code and generate the injector that will fill out\
    \ dependencies for our services. First, we need to install wire in our build/Dockerfile:\n\
    \n```\n1 +# Install google wire for DI\n2 +RUN go get -u github.com/google/wire/cmd/wire\n\
    ```\n\nRebuild and push the dockerfile to your registry, and you can start using\
    \ wire from Drone. As wire will create our new service constructor, remove `New()`\
    \ from `templates/server_server.go.tpl` and add `*sqlx.DB` as a dependency by\
    \ declaring it inside the `Server{}` struct:\n\n```\n 1 package ${SERVICE}\n 2\
    \ \n 3 import (\n 4   \"context\"\n 5 \n 6   \"github.com/jmoiron/sqlx\"\n 7 \n\
    \ 8   \"${MODULE}/rpc/${SERVICE}\"\n 9 )\n10 \n11 type Server struct {\n12   db\
    \ *sqlx.DB\n13 }\n14 \n15 var _ ${SERVICE}.${SERVICE_CAMEL}Service = &Server{}\n\
    ```\n\nThis will ensure that there isn’t a conflict between the old constructor,\
    \ and the new constructor created with Wire. We will now create an injector definition\
    \ in our service, under `server/stats/wire.go`, by using a template for our code\
    \ generator (`templates/server_wire.go.tpl`):\n\n```\n 1 //+build wireinject\n\
    \ 2 \n 3 package ${SERVICE}\n 4 \n 5 import (\n 6   \"context\"\n 7 \n 8   \"\
    github.com/google/wire\"\n 9 \n10   \"${MODULE}/inject\"\n11 )\n12 \n13 func New(ctx\
    \ context.Context) (*Server, error) {\n14   wire.Build(\n15     inject.Inject,\n\
    16     wire.Struct(new(Server), \"*\"),\n17   )\n18   return nil, nil\n19 }\n\
    ```\n\nAs you see from the template, the file begins with `//+build wireinject`,\
    \ which excludes this file from our build process. Wire uses this file to load\
    \ and analyze the source files that it references, to figure out which dependencies\
    \ are defined.\n\nMake sure that you invoke the following line in your Makefile\
    \ `templates.%` target to generate the required wire.go file for each existing\
    \ service:\n\n```\n1   @envsubst < templates/server_wire.go.tpl > server/$(SERVICE)/wire.go\n\
    ```\n\nAfter we build the docker image for our build environment, all we need\
    \ to do is run `wire ./...` on our code base. We will add this to our build steps\
    \ in drone:\n\n```\n1 - name: build\n2   image: titpetric/microservice-build\n\
    3   pull: always\n4   commands:\n5     - make tidy\n6     - wire ./...\n7    \
    \ - make build\n```\n\nRunning `wire ./...` produces our `wire_gen.go` files:\n\
    \n```\n1 # wire ./...\n2 wire: github.com/titpetric/microservice/server/stats:\
    \ wrote server/stats/wire_gen.go\n```\n\nAnd if we inspect the file itself, we\
    \ can see it’s written just as well if we would write it by hand. Each of the\
    \ required dependencies by our server is filled out, and the others are omitted.\
    \ This in our case means that we get our DB handle, but as we aren’t using any\
    \ RPC clients they are omitted until we add them to the `Server` struct.\n\n```\n\
    \ 1 // Code generated by Wire. DO NOT EDIT.\n 2 \n 3 //go:generate wire\n 4 //+build\
    \ !wireinject\n 5 \n 6 package stats\n 7 \n 8 import (\n 9   \"context\"\n10 \
    \  \"github.com/titpetric/microservice/db\"\n11 )\n12 \n13 // Injectors from wire.go:\n\
    14 \n15 func New(ctx context.Context) (*Server, error) {\n16   sqlxDB, err :=\
    \ db.Connect()\n17   if err != nil {\n18     return nil, err\n19   }\n20   server\
    \ := &Server{\n21     db: sqlxDB,\n22   }\n23   return server, nil\n24 }\n```\n\
    \nThe providers that return errors also have error handling in this function.\
    \ As the errors are preserved and returned, we can use them outside of our service\
    \ constructor - in our case, we issue a `log.Fatal` in main() and exit.\n\nWith\
    \ wire set up, adding a new dependency into our service is trivial, we just need\
    \ to add a new field into the Server{} struct. In case we want to omit a field\
    \ from being filled out with wire, we can tag it with `wire:\"-\"`. We future\
    \ proofed our service layer in such a way that we can add new dependencies into\
    \ the main `inject` package, and they will be picked up by all services at the\
    \ same time.\n\nThere are some caveats with wire, notably that you can’t pass\
    \ a `wire.ProviderSet` as the argument for an Injector. This is because wire relies\
    \ on parsing the AST of your packages source files in order to generate provider\
    \ invocations. In the sense of a public API which could be imported from a third\
    \ party package, wire has no way to know on the code generation step, which providers\
    \ are defined inside a ProviderSet.\n\nThere are probablly other notable exceptions\
    \ where wire might fail. In the sense of something you can pick up and randomly\
    \ throw at an object, it’s definitely not as robust as writing individual server\
    \ constructors by hand."
