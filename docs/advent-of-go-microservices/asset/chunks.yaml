    \   Driver string\n 6     }\n 7     Schema string\n 8     Format string\n 9  \
    \ }\n10   flag.StringVar(&config.db.Driver, \"db-driver\", \"mysql\", \"Database\
    \ driver\")\n11   flag.StringVar(&config.db.DSN, \"db-dsn\", \"\", \"DSN for database\
    \ connection\")\n12   flag.StringVar(&config.Schema, \"schema\", \"\", \"Schema\
