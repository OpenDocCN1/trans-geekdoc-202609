    \ aren’t part of our service,\n*   we don’t have database reconnect logic so migrations\
    \ don’t wait for the database to become available\n\nWe will fix that, but for\
    \ now lets do some of the manual legwork in order to make this work. Issue the\
    \ following commands:\n\n```\n 1 # first run the database\n 2 docker-compose up\
    \ -d db\n 3 # wait for a bit so it gets provisioned\n 4 sleep 30\n 5 # run migrations\n\
    \ 6 docker-compose run --rm migrations\n 7 # run our service\n 8 docker-compose\
    \ up -d\n```\n\nNow, generally anytime you’d just do `docker-compose up -d` should\
    \ bring up our service, database, and update the migrations (leaving a container\
    \ behind since docker-compose doesn’t have a `rm: true` option we could use here).\
    \ This is why we should update the migrations to be run from our service with\
    \ a particular command line parameter or environment flag. We’ll come back to\
    \ that.\n\nIf you did everything correctly, `docker-compose ps` should output\
    \ something like:\n\n```\n 1         Name                     Command        \
    \      State          Ports       \n 2 --------------------------------------------------------------------------------\n\
    \ 3 microservice_db_1      /docker-entrypoint.sh mysqld   Up      3306/tcp, 33060/tcp\n\
    \ 4 microservice_stats_1   /app/service                   Up      3000/tcp   \
    \        \n```\n"
  trans: "\n并在 stats 服务的 `Server{}` 定义中包含 `sonyflake.Sonyflake`。Wire 将重新生成 `wire_gen.go`\
    \ 文件，在该文件中将创建 `sonyflake` 产生器。\n\n使用我们目前拥的所有脚手架实现我们的 `Push` RPC 是非常简单的：\n\n```go\n\
    \ 1 package stats\n 2 \n 3 import (\n 4   \"context\"\n 5   \"fmt\"\n 6   \"strings\"\
    \n 7   \"time\"\n 8 \n 9   \"github.com/titpetric/microservice/rpc/stats\"\n10\
    \ )\n11 \n12 // 将一条记录写入传入的日志表\n13 func (svc *Server) Push(ctx context.Context,\
    \ r *stats.PushRequest) (*stats.PushRespo\\\n14 nse, error) {\n15   var err error\n\
    16   row := Incoming{}\n17 \n18   row.ID, err = svc.sonyflake.NextID()\n19   if\
    \ err != nil {\n20     return nil, err\n21   }\n22 \n23   row.Property = r.Property\n\
    24   row.PropertySection = r.Section\n25   row.PropertyID = r.Id\n26   row.RemoteIP\
    \ = \"127.0.0.1\"\n27   row.SetStamp(time.Now())\n28 \n29   fields := strings.Join(IncomingFields,\
    \ \",\")\n30   named := \":\" + strings.Join(IncomingFields, \",:\")\n31 \n32\
    \   query := fmt.Sprintf(\"insert into %s (%s) values (%s)\", IncomingTable, fields,\
    \ nam\\\n33 ed)\n34   _, err = svc.db.NamedExecContext(ctx, query, row)\n35  \
    \ return nil, err\n36 }\n```\n\n这是一个初始实现。有两个特别需要注意的地方。由于 `Stamp` 字段被映射为 `*time.Time`，我们不能直接将\
    \ `time.New() time.Time` 的输出赋值给它。由于我不喜欢在每个服务中包装一个 `timeNewPtr() *time.Time`，我修改了代码生成器，为该类型添加了\
    \ setter：\n\n```go\n 1 ...\n 2   for _, table := range tables {\n 3     fields\
    \ := []string{}\n 4     primary := []string{}\n 5     setters := []string{}\n\
    \ 6 ...\n 7       if columnType == \"*time.Time\" {\n 8         setters = append(setters,\
    \ []string{\n 9           fmt.Sprintf(\"// Set%s sets %s which requires a *time.Time\"\
    , columnName, co\\\n10 lumnName),\n11           fmt.Sprintf(\"func (s *%s) Set%s(t\
    \ time.Time) { s.%s = &t }\", tableName, co\\\n12 lumnName, columnName),\n13 \
    \        }...)\n14       }\n15 ...\n 16     for _, v := range setters {\n17  \
    \     fmt.Fprintln(buf, v)\n18     }\n19     if len(setters) > 0 {\n20       fmt.Fprintln(buf)\n\
    21     }\n22 ...\n```\n\n另一个事情仍然是一个 `TODO`（待办事项） - 我想记录请求的 Remote IP。现在，由于我们正在处理一个\
    \ Twirp 实现，我们知道有一个 `*http.Request` 作为入口。这是 Twirp 或 gRPC 服务实现之间的第一个分歧点。\n\n为了在这里获取\
    \ IP，我们需要将 twirp 处理器包装在我们自己的 `http.Handler` 中，从 `*http.Request` 中获取 IP 信息，并更新上下文，这样我们就可以获取传递给处理器的该字段的值。\n\
    \n1. `http.Request` 提供了 `Context() context.Context` 来获取请求，\n2. `http.Request`\
    \ 提供了 `WithContext(context.Context) *Request` 来构建新的 `Request`\n\n这应该很简单。让我们看看是否能在第一次尝试就完成（不要作弊！）。为了帮助你提供一些起始代码，这是一个处理器：\n\
    \n```go\n 1 --- a/templates/cmd_main.tpl\n 2 +++ b/templates/cmd_main.tpl\n 3\
    \ @@ -15,6 +15,12 import (\n 4         \"${MODULE}/server/\"\n 5  \n 7 +func wrapWithIP(h\
    \ http.Handler) http.Handler {\n 8 +       return http.HandlerFunc(func(w http.ResponseWriter,\
    \ r *http.Request) {\n 9 +               h.ServeHTTP(w, r)\n 10 +       })\n 11\
    \ +}\n 13 +func main() {\n 14         ctx := context.TODO()\n 15  \n 16 @@ -25,5\
    \ +31,5 @@ func main() {\n 17  \n 18         twirpHandler := ${SERVICE}.New${SERVICE_CAMEL}Server(srv,\
    \ nil)\n 19  \n 20 -       http.ListenAndServe(\":3000\", twirpHandler)\n 21 +\
    \       http.ListenAndServe(\":3000\", wrapWithIP(twirpHandler))\n 22 }\n```\n\
    \n现在停止阅读并编写你的包装器！我说过不要作弊吗？从 HTTP 请求中读取 IP，将其设置到上下文中，然后完成后回来。\n"
