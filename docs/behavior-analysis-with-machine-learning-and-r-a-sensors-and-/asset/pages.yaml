  md: '# 7.8 Summary


    Depending on the problem at hand, the data can be encoded in different forms.
    Representing data in a particular way, can simplify the problem solving process
    and the application of specialized algorithms. This chapter presented different
    ways in which data can be encoded along with some of their advantages/disadvantages.


    +   - **Feature vectors** are fixed-size arrays that capture the properties of
    an instance. This is the most common form of data representation in machine learning.

    - Most machine learning algorithms expect their inputs to be encoded as feature
    vectors.

    - **Transactions** is another way in which data can be encoded. This representation
    is appropriate for association rule algorithms.

    - Data can also be represented as **images**. Algorithms like CNNs (covered in
    chapter 8) can work directly on images.

    - The **Bag-of-Words** representation is useful when we want to model a complex
    behavior as a composition of simpler ones.

    - A **graph** is a general data structure composed of *vertices* and *edges* and
    is used to model relationships between entities.

    - It is possible to convert data into multiple representations. For example, timeseries
    can be converted into images, recurrence plots, etc.'
  merge: -1
  img_proc: true
