    # 5.2 Smoothing


    Smoothing comprises a set of algorithms with all of highlighting patterns in the
    data as a preprocessing step to clean the data and remove noise. These methods
    are widely used on timeseries data also with spatio-temporal data such as images.
    With timeseries data, they are often used to emphasize long-term patterns reduce
    short-term signal artifacts. For example, in Figure 5.2 a stock chart was smoothed
    using two methods: moving average


