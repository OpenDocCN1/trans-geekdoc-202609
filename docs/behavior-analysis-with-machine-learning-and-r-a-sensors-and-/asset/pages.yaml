  md: '# CHAPTER 5. PREPROCESSING BEHAVIORAL DATA


    # 150


    ![](img/91c149cc24c3e5af2971580c9dda9d8b_162_0.png)


    Figure 5.3: Rows with missing values.


    different ways to handle missing values:


    +   - **Discard rows.** If the rows with missing values are not too many, they
    can simply be discarded.


    +   - **Mean value.** Filling the missing values with the mean value of the corresponding
    variable. This method is simple and can be effective. One of the problems with
    this method is that it is sensitive to outliers (as it is the arithmetic mean).


    +   - **Median value.** The median is robust against outliers, thus, it can be
    used instead of the arithmetic mean to fill the gaps.


    +   - **Replace with the closest value.** For timeseries data, as is the case
    of the sheep readings, one could replace missing values with the closest known
    value.


    +   - **Predict the missing values.** Use the other variables to predict the missing
    one. This can be done by training a predictive model. A regressor if the variable
    is numeric'
  merge: -1
