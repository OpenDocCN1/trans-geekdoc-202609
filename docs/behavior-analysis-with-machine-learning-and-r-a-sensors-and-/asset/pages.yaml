    For example, the confidence of the rule {chocolate, chips} \implies {soda} is:


    ```

    conf({chocolate,chips} \implies {soda}) = \frac{supp({chocolate, chips, soda})}{supp({chocolate,chips})}\n=
    (2/10)/(3/10)\n= .66

    ```


    The lift of {soda} \implies {icecream} is:


    ```

    lift({soda}) \implies {icecream}) = \frac{supp({soda, icecream})}{supp({soda})supp({icecream})}\n=
    (2/10)/((7/10)(3/10))\n= 0.95

    ```


    Association rules mining is unsupervised in the sense that there are no labels
    or ground truth. Many applications of association rules are targeted to market
    basket analysis to gain insights into shoppers'' behavior and take actions to
    increase sales. To find rules it is necessary to have ''transactions'' (sets of
    items), for example, supermarket products. However, this is not the only application
    of association rules. There are other problems that can be structured as transactions
    of items. For example in medicine, diseases can be seen as transactions and symptoms
    as items. Thus, one can apply association rules algorithms to find symptoms and
    disease relationships. Another application is in recommender systems.'
  merge: -1
