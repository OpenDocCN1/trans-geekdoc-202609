    # ## 2.1 k-nearest Neighbors


    k-nearest neighbors (k-NN) is one of the simplest classification algorithms. The
    predicted class for a given query instance is the most common class of its k nearest
    neighbors. A query instance is just the instance we want to make predictions on.
    In its most basic, the algorithm consists of two steps:


    +   1. Compute the distance between the query instance and all training instances.

    2. Return the most common class among the k nearest training instances.


    This is a type of lazy-learning algorithm because all the computations take place
    at prediction time. There are no parameters to learn at training time! The training
    phase consists'
