    # 8.4 Overfitting


    One important thing to look at when training a network is overfitting. That is,
    when the model memorizes instead of learning (see chapter 1). Overfitting means
    that the model becomes very specialized at mapping inputs to outputs from the
    train set but fails to do so with new test samples. One of the reasons is that
    a model can become too complex and so many parameters that it will perfectly adapt
    to its training data but will miss more general patterns that allow it to perform
    well on unseen instances. To control for this, one can plot loss/accuracy curves
    during training epochs.


    In Figure 8.21 we can see that after epochs the validation loss starts to increase
    even though the train loss is still decreasing. This is because the model is getting
    better on reducing the error on the train set but its performance starts to decrease
    when presented with new instances. Conversely, one can observe a similar effect
    with the accuracy. The model keeps improving its performance on the train set
    but at some point, the accuracy on the validation set starts to decrease. Usually,
    one stops the training before overfitting starts to occur. In the following, I
    will introduce you to two common techniques to combat overfitting in neural networks.


    ![](img/91c149cc24c3e5af2971580c9dda9d8b_277_0.png)


    Figure 8.21: Loss and accuracy curves.'
  merge: -1
  img_proc: true
- pgno: 278
  md: "# CHAPTER 8. PREDICTING BEHAVIOR WITH DEEP LEARNING\n\n# 8.4.1 Early Stopping\n\
    \n```\nkeras_electromyography_earliest.R\n```\n\nNeural networks are trained for\
    \ several epochs using gradient descent. But the question is: For how many epochs?\
    \ As can we see in Figure 8.21, many epochs can lead to overfitting and too few\
    \ can cause underfitting. Early stopping is a simple but effective method to reduce\
    \ the risk of overfitting. The method consists of setting a large number of epochs\
    \ and stop updating the network's parameters when a condition is met. For example,\
    \ one can be to stop when there is no performance improvement on the validation\
    \ set after n epochs or when there is a decrease of some percent accuracy.\n\n\
    Keras provides some mechanisms to implement early stopping and this is accomplished\
    \ via callbacks. A callback is a function that is run at different stages during\
    \ training such as the beginning or end of an epoch at the beginning or end of\
    \ a batch, Callbacks are passed as a list to the fit() function. You can define\
    \ custom callbacks or use some of the built-in ones callback_early_stopping().\
    \ This callback will cause the training to stop the training if after 10 epochs\
    \ (patience) there is no improvement of at least 1% (min_delta) in accuracy on\
    \ the validation set.\n\n```\ncallback_early_stopping(monitor = \"val_acc\",\n\
    \    min_delta = 0.01,\n    patience = 10,\n    mode = \"max\")\n```\n\nThe min_delta\
    \ parameter specifies the minimum change in the monitored metric to qualify as\
    \ an improvement. The mode specifies if training should be stopped when the metric\
    \ has stopped decreasing if it is set to \"min\". If it is set to \"max\", training\
    \ will stop when the monitored metric has stopped increasing.\n\nIt may be the\
    \ case that the best validation performance was not achieved by the model in the\
    \ last epoch but at some previous point. By setting the restore_best_weights parameter\
    \ to TRUE the model weights from the epoch with the best value of the monitored\
    \ metric will be restored."
  merge: -1
  img_proc: true
