    Those numbers are surprising! In the previous section, our mixed model had an
    accuracy of 92.7% and now the user-independent model has an accuracy of 58%! This
    is because the latter didn''t know anything about the target user. Since each
    person different, the user-independent model was not able to capture the patterns
    of new users and had a big impact on the performance.


    # When should a user-independent model be used to validate a system?


    +   1. When you expect the system to be used out-of-the-box by new users and the
    system does not have any data from new users.


    The main advantage of the user-independent model is that it does not require training
    data from the target users so they can start using it right at the expense of
    lower accuracy.


    The opposite case is when a model is trained specifically for the target user.
    This model is called the user-dependent model and will be presented in the next
    section.


    # 9.3 User-Dependent Models


    A user-dependent model is trained with data belonging only to the target user.
    In general, this type of model performs better compared to the mixed model and
    user-independent model. This is because the model captures the particularities
    of a specific user. The way to evaluate user-dependent models is to iterate through
    each user, and for each user, build and test a model with only her/his data. The
    per-user evaluation can be done using k-fold cross validation, for example. For
    the skeleton database, we have 4 instances per action. The number of unique classes
    (27) is also high compared to the number of instances per action. If we do, for
    example, 10-fold cross-validation, it is very likely that the train sets will
    not contain examples for several of the possible actions. To avoid this, we will
    leave-one-out validation within each user. This means that we iterate through
    each instance. In each iteration, the instance is used as the test set and the
    remaining ones are used for the train set.'
  merge: -1
  img_proc: true
