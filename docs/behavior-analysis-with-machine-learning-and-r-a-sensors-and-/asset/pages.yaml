  md: '# Chapter 1


    # Introduction


    Living organisms are constantly sensing and analyzing their surrounding environment.
    This includes inanimate objects but also other living entities. All of this is
    with the objective of making decisions and taking actions, either consciously
    or unconsciously. If we see someone running, we will react differently depending
    on whether we are at a stadium or in a bank. At the same time, we may also analyze
    other cues such as the runner''s facial expressions, clothes, items, and the reactions
    of the other people around us. Based on this aggregated information, we can decide
    how to react and behave. All this is supported by the organisms'' sensing capabilities
    and decision-making processes (the brain and/or chemical reactions). Understanding
    our environment and how others behave is crucial for conducting our everyday life
    activities and provides support for other tasks. But, what is behavior? The Cambridge
    dictionary defines behavior as:


    > the way that person, an animal, a substance, etc. behaves in a particular situation
    or under particular conditions."


    Another definition by dictionary.com is:


    > “observable activity in a human or animal."


    Both definitions are very similar and include humans and animals. Following those
    definitions, this book will focus on the automatic analysis of human and animal
    behaviors. There are three main reasons why one might want to analyze behaviors
    in an automatic manner:


    +   - React. A biological or an artificial agent (or a combination of both) can
    take actions based on what is happening in the surrounding environment. For example,
    if suspicious behavior is detected in an airport, preventive actions can be triggered
    by security'
  merge: -1
  img_proc: true
- pgno: 14
  md: '![](img/91c149cc24c3e5af2971580c9dda9d8b_14_0.png)


    Figure 1.1: Andean condor. source: wikipedia.


    systems and the corresponding authorities. Without the possibility to automate
    such a detection system, it would be infeasible to implement it in practice. Just
    imagine trying to analyze airport traffic by hand.


    +   2. **Understand.** Analyzing the behavior of an organism can help us to understand
    other associated behaviors and processes and to answer research questions. For
    example, Williams et al. (2020) found that *Andean condors* (the heaviest soaring
    bird) only flap their wings for 1% of their total flight time. In one of the cases,
    a condor flew ≈ 172 km without flapping. Those findings were the result of analyzing
    the birds'' behavior from data recorded by bio-logging devices. In this book,
    several examples make use of inertial devices will be studied.


    +   3. **Document/Archive.** Finally, we may want to document certain behaviors
    for future use. It could be for evidence purposes or maybe it is not clear how
    the information can be used now but come in handy later. Based on the archived
    information, one could gain new knowledge in the future and it to react (take
    decisions/actions). For example, we could document our nutritional habits (what
    do we eat, how often, etc.). If there is a health issue, a specialist could use
    this historical information to make a more precise diagnosis and propose actions.


    ![](img/91c149cc24c3e5af2971580c9dda9d8b_14_1.png)'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# CHAPTER 1. INTRODUCTION


    Some behaviors can be used as a proxy to understand other behaviors, states, and/or
    processes. For example, detecting body movement behaviors during a job interview
    could serve as the basis to understand stress levels. Behaviors can also be modeled
    as a composition of lower-level behaviors. In chapter 7, a method called Bag of
    Words that be used to decompose complex behaviors into a set of simpler ones will
    be presented.


    In order to analyze and monitor behaviors, we need a way to observe them. Living
    organisms use their available senses as eyesight, hearing, smell, echolocation
    (bats, dolphins), thermal senses (snakes, mosquitoes), etc. In the case of machines,
    they need sensors to accomplish or approximate these tasks. For example, RGB and
    thermal cameras, microphones, temperature sensors, and so on.


    The reduction in size of sensors has allowed the development of more powerful
    wearable devices. devices are electronic devices that are worn by a user, usually
    as accessories or embedded in clothes. Examples of wearable devices are smartphones,
    smartwatches, fitness bracelets, agility watches, etc. These devices have embedded
    sensors that allow them to monitor different aspects of such user as activity
    levels, blood pressure, temperature, and location to name a few. Examples of sensors
    that can be found in these devices are accelerometers, gyroscopes, heart rate,
    microphones, Wi-Fi, Bluetooth, Galvanic Skin Response (GSR), etc.


    Several of these sensors were initially used for some specific purposes. For example,
    accelerometers in smartphones were intended to be used for gaming or detecting
    the device''s orientation. Later, some people started to propose and implement
    new cases such as activity recognition (Shoaib et al., 2015) and fall detection.
    The magnetometer, which measures the earth''s magnetic field, was mainly used
    with map applications to determine the orientation of the device, but later, it
    was found that it could be used for indoor location purposes (Brena et al., 2017).


    In general, wearable devices have proven success in tracking different types of
    behaviors such as physical activity, sports activities, and even mental states
    (Garcia-Ceja et al., 2018c). These sensors generate a lot of raw data, but it
    will be our task to process and analyze it. Doing by hand becomes impossible given
    the large amounts and available formats in which data is available. Thus, in this
    book, several machine learning methods will be introduced to extract and analyze
    different types of behaviors from data. The next section begins with an introduction
    to machine learning. The rest of this chapter will introduce the required machine
    learning concepts before we start analyzing behaviors in chapter 2.'
  merge: -1
  img_proc: true
