    # 3.5 Summary


    In this chapter, several ensemble learning methods were introduced. In general,
    ensemble models perform better than single models.


    +   * The main idea of ensemble learning is to train several models and combine
    their results.

    * Bagging is an ensemble method consisting of n base learners, each, trained with
    bootstrapped training samples.

    * Random Forest is an ensemble of trees. It introduces randomness to the trees
    by selecting random features in each split.

    * Another ensemble method is called **stacked generalization**. It consists of
    a set of base learners and a meta-learner. The latter is trained using the outputs
    of the base'
