  md: "# CHAPTER 2. PREDICTING BEHAVIOR WITH CLASSIFICATION MODELS 53\n\nIt is zero\
    \ when there is no uncertainty and when there is complete uncertainty. The entropy\
    \ of a discrete variable $X$ with values $x_1 \\dots x_n$ and probability mass\
    \ function $P(X)$ is:\n\n```\n$H(X) = -\\sum_{i=1}^{n} P(x_i)logP(x_i) \\quad\
    \ (2.8)$\n```\n\nTake for example a fair coin with probability of heads and tails\
    \ = 0.5 each. The entropy for that coin is:\n\n```\n$H(X) = -(0.5)log(0.5) + (0.5)log(0.5)\
    \ = 1$\n```\n\nSince we do not know what will be the result when we drop the coin,\
    \ the entropy is maximum. Now consider the extreme case when the coin is biased\
    \ that the probability of heads is 1 and the probability of tails is 0. The entropy\
    \ in this case is:\n\n```\n$H(X) = -(1)log(1) + (0)log(0) = 0$\n```\n\nIf we know\
    \ that the result is always going to be, then there is no uncertainty when the\
    \ coin is dropped. The entropy of $p$ positive examples and $n$ negative examples\
    \ is:\n\n```\n$H(p, n) = -\frac{p}{p+n}log(\\frac{p}{p+n}) + (\\frac{n}{p+n})log(\\\
    frac{n}{p+n}) \\quad (2.9)$\n```\n\nThus, the entropies for the three possible\
    \ values of $Price$ are:\n\n```\n$H_{price=low}(4,0) = -\frac{4}{4+0}log(\\frac{4}{4+0})\
    \ + (\\frac{0}{4+0})log(\\frac{0}{4+0}) = 0$\\n$H_{price=medium}(2,4) = -\frac{2}{2+4}log(\\\
    frac{2}{2+4}) + (\\frac{4}{2+4})log(\\frac{4}{2+4}) = 0.918$\\n$H_{price=high}(0,2)\
    \ = -\frac{0}{0+2}log(\\frac{0}{0+2}) + (\\frac{2}{0+2})log(\\frac{2}{0+2}) =\
    \ 0$\n```\n\nThe average of those three can be calculated by taking into account\
    \ the number of corresponding instances for each value and the total number of\
    \ instances:\n\n```\n$meanH(price) = (4/12)(0) + (6/12)(0.918) + (2/12)(0) = 0.459$\n\
