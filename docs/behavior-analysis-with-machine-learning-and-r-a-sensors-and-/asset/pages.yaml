  md: '# CHAPTER 8. PREDICTING BEHAVIOR WITH DEEP LEARNING


    Suppose today was payday and the theater is projecting an action movie. Then,
    we can set the input variables $money = 1$ and $horror = 0$. Now we want to decide
    if we should go to the theater or not. To get the final answer we can use Equation
    (8.1). This formula tells us we need to multiply each input variable with their
    corresponding weights and add them:


    ```

    $(money)(5) + (horror)(-3)

    ```


    Substituting $money$ and $horror$ with their corresponding values:


    ```

    (1)(5) + (0)(-3) = 5

    ```


    Since $5 > t$ (remember the threshold $t = 3$), the final output will be 1, thus,
    the advice is to go to the movies. Let''s try the scenario when you have money
    but they are projecting a horror movie: $money = 1, horror = 1$.


    ```

    (1)(5) + (1)(-3) = 2

    ```


    In this case, $2 < t$ and the final output is 0. Even if you have money, you should
    not waste it on a movie that you know most will not like. This process of applying
    operations to the inputs and obtaining the final result is called **forward propagation**
    because the inputs are ''pushed'' all the way through the network (a single perceptron
    in this case). For bigger networks, the outputs of the current layer become the
    inputs of the next layer, and so on.


    For convenience, a simplified version of Equation (8.1) can be used. This alternative
    representation is useful because it provides flexibility to change the internals
    of the units (neurons) as we will see. The first simplification consists of representing
    the inputs and weights as vectors:


    ```

    $\sum_{i} w_i x_i = \mathbf{w} \cdot \mathbf{x}$ \quad (8.2)

    ```


    The summation becomes a dot product between $\mathbf{w}$ and $\mathbf{x}$. Next,
    the threshold $t$ can be moved to the left and renamed to $b$ which stands for
    **bias**. This is only notation but you can still think of the $bias$ as a threshold.'
  merge: -1
