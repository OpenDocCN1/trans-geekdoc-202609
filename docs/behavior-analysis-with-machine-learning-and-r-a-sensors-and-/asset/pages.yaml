  md: '# 1.10 Summary


    In this chapter, several introductory machine learning concepts and terminology
    were introduced. These concepts are the basis for the methods that will be covered
    in the following chapters.


    +   - Behavior can be defined as “an observable activity in a human or animal”.

    - Three main reasons of why we may want to analyze behavior automatically was
    discussed: react, understand, and document/archive.

    - One way to observe behavior automatically is through the use of sensors and/or
    data.

    - Machine Learning consists of a set of computational algorithms that automatically
    find useful patterns and relationships from data.

    - The three main building blocks of machine learning are: data, algorithms, and
    mod-els.

    - The main types of machine learning are supervised learning, semi-supervised
    learning, partially-supervised learning, and unsupervised learning.

    - In R, data is usually stored in data frames. Data frames have variables (columns)
    and instances (rows). Depending on the task, variables can be independent or dependent.

    - A predictive model is a model that takes some input and produces an output.
    Classifiers and regressors are predictive models.

    - A data analysis pipeline consists of several tasks including data collection,
    cleaning, preprocessing, training/evaluation, and presentation of results.

    - Model evaluation can be performed with hold-out validation or k-fold cross-validation.

    - Overfitting occurs when a model ‘memorizes’ the training data instead of finding
    useful underlying patterns.

    - The test error can be decomposed into noise, bias, and variance.'
