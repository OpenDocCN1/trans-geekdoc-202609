  md: '# CHAPTER 2. PREDICTING BEHAVIOR WITH CLASSIFICATION MODELS 62


    section we learned decision trees are built recursively. Trees are built by first
    selecting a feature to be at the root, then the root is split into subnodes and
    on. How those subnodes are chosen depends on their parent node. With Naive Bayes,
    features don''t need information about other features, thus the parameters for
    each feature can be learned in parallel.


    To demonstrate how Naive Bayes works I will use the SMARTPHONE ACTIVITIES dataset
    as in the previous section. For any given query instance, the aim is to predict
    your most likely class based on the accelerometer features. For a new query instance,
    we want to estimate its class based on the features we have observed. Let''s say
    we want to know what is the probability that the query instance belongs to the
    class ‘Walking’. This can be formulated as follows:


    $P(C = Walking|f_1, \dots, f_n).


    This reads the conditional probability that the class is ‘Walking’ given the observed
    evidence. For each instance, the evidence that we can observe are its features
    $f_1, \dots, f_n$. In this dataset, each instance has 39 features. If we want
    to estimate what is the most likely class all we need to do is compute the conditional
    probability for each class and return the highest one:


    ```

    $y = \argmax_{k\in\1,\dots,K\}} P(C_k|f_1, \dots, f_n) \quad (2.10)$

    ```


    where $K$ is the total number of possible classes. The arg notation means: Evaluate
    the right hand expression for every class $k$ and return the $k$ that resulted
    with the maximum probability. If instead of arg max we use max (without the arg)
    that would mean to return the actual maximum probability instead of the class
    $k$.


    Now let''s see how we can compute $P(C_k|f_1, \dots, f_n)$. To compute a conditional
    probability we can use Bayes’ rule:


    ```

    $P(H|E) = \frac{P(H)P(E|H)}{P(E)} \quad (2.11)$

    ```


    Let’s dissect that formula:


    +   1. $P(H|E)$ is called the posterior and it is the probability of the hypothesis
    $H$ given the observed evidence $E$. In our example, the hypothesis can be that
    $C = Walking$ and the evidence consists of the measured features. This is the
    probability that ultimately we want to estimate for each class and pick the class
    with the highest probability.'
  merge: -1
  img_proc: true
- pgno: 75
  md: '# CHAPTER 2. PREDICTING BEHAVIOR WITH CLASSIFICATION MODELS


    2. $P(H)$ is called the **prior**. This is the probability of a hypothesis happening
    without having any evidence. In our example, this translates to the probability
    that an instance belongs to a particular class without looking at its features.
    In practice, this is estimated from the training set containing 100 instances
    and from those, 80 are of type ''Walking'' and 20 are of type ''Jogging''. Then,
    the prior for ''Walking'' is $P(C = Walking) = 80/100 = 0.8$ and the prior for
    ''Jogging'' is $P(C = Jogging) = 20/100 = 0.2$.


    3. $P(E)$ is the probability of the evidence. Since this one doesn''t need to
    compute it. This can be thought of as a normalization factor. When choosing the
    final class we only need to select the one with the highest score, so there is
    no need to normalize them into proper properties between 0 and 1.


    4. $P(E|H)$ is the **likelihood**. For numerical variables we can estimate this
    using a Gaussian probability density function. This sounds intimidating! but all
    we need to do is compute the **mean** and **standard deviation** for each feature-class
    pair and plug them into the probability density function (pdf). The formula for
    a Gaussian (also called normal) pdf is:


    ```

    $f(x) = \frac{1}{\sigma\sqrt{2\pi}}e^{-(x-\mu)^2/2\sigma^2}$  (2.12)

    ```


    where $\mu$ is the mean and $\sigma$ is the standard deviation.


    Suppose that some feature $f1$ and when the class is ''Walking'', its mean is
    5 and its standard deviation is 3. That is, we filter the train set and only select
    those instances with class ''Walking'' and compute the mean and standard deviation
    for feature $f1$. Figure 2.14 shows how its pdf looks like.


    If we have a query instance with a feature $f1=1.7$ we can compute its likelihood
    given the ''Walking'' class $P(f1=1.7|C=Walking)$ with equation (2.12) by plugging
    in $x=1.7$, $\mu=5$ and $\sigma=3$. In $R$, the function `dnorm()` implements
    the norm.


    ```

    dnorm(x=1.7, mean = 5, sd = 3)

    # [1] 0.07261739

    ```


    Figure 2.15 shows the likelihood with a solid circle when $x=1.7$.


    If we have one more feature we need to compute the likelihood for each and take
    our **product**: $P(f1|C=Walking) * P(f2|C=Walking) * \dots * P(fn|C=Walking)$.
    Each feature and class pair has its own $\mu$ and $\sigma$ parameters. Thus, Naive
    Bayes requires to learn'
