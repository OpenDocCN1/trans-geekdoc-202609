    # 5.6 One-hot Encoding


    All algorithms need some or all input variables to be in numeric format -either
    the response/predictor variables. In R, for most classification algorithms, the
    class is usually encoded as a factor but some implementations may require it to
    be in numeric format. We sometimes have some categorical variables as predictors
    such as gender (‘male’, ‘female’). Some algorithms need to be in numeric format
    because they, for example, are based on distance computations like k-nn or Nearest
    neighbors. Other models need to perform arithmetic operations on the predictor
    variables like neural networks.


    One way to convert categorical variables into numeric ones is called one-hot encoding
    and it works by creating new variables called dummy variables which are boolean,
    one for each possible category. Suppose a dataset has a categorical variable Job
    (Figure 5.14) with three possible values: programmer, teacher and dentist. This
    variable can be one-hot encoded by creating 3 new dummy variables and setting
    them to 1 for the corresponding category and for the rest.


    > You should be aware of the dummy variable trap which means that one variable
    can be predicted from the others. For example, if the possible values are just
    male and female, if the dummy variable for male is 1 we know the dummy variable
    for female must be 0. The solution is to drop one of the created variables. Which
    one? Any variable can be dropped, it does not matter which one. This trap only
    applies when the variable is a predictor. If it is a response variable, nothing
    should be dropped.


    Figure 5.15 shows a guideline about how to convert non-numeric variables into
    numeric ones for classification tasks. This is only a guideline and the process
    will depend on each application.


    The caret package has dummyVars() that can be used to one-hot encode the categorical
    variables of a data frame. Since the STUDENTS’ MENTAL HEALTH dataset'
