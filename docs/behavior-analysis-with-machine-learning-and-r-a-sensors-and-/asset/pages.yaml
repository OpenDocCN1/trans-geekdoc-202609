  md: '# CHAPTER 1. INTRODUCTION


    +   * Data

    * Algorithms

    * Models


    Every machine learning method needs **data** to learn from. For the example of
    the fruits, we need examples of images for each type of fruit we want to recognize.
    Additionally, we need their corresponding output types (labels) so the algorithm
    can learn how to associate image with its corresponding label.


    > Not every machine learning method needs the expected output or labels (more
    on this in the Taxonomy section 1.2).


    Typically, an **algorithm** will use the **data** to learn a **model**. This is
    called the learning phase. The learned **model** can then be used to generate
    predictions when presented with new data. The data used to train the models is
    called the **train set**. Since we need a way to test how the model will perform
    once it is deployed in a real setting (in production), we also need what is known
    as the **test set**. The test set is used to estimate the model''s performance
    on data it has never seen before (more on this will be presented in section 1.5).


    # 1.2 Types of Machine Learning


    Machine learning methods can be grouped into different types. Figure 1.3 depicts
    a categorization of machine learning ''types''. This figure is based on (Becek
    et al., 2012). The $x$ axis represents the certainty of the labels and the $y$
    axis the percent of training data that is labeled. In our previous example, the
    labels are the fruits'' names associated with each image.


    From the figure, four main types of machine learning methods can be observed:


    +   * **Supervised learning.** In this case, 100% of the training data is labeled
    and the certainty of those labels is 100%. This is like the fruits example. For
    every image used to train the system, the respective label is also known and there
    is no uncertainty about the label. When the expected output is a category (the
    type of fruit), this is called classification. Examples of classification models
    (a.k.a classifiers) are decision trees, k-nearest neighbors, random forest, neural
    networks, etc. When the output is a real number (e.g., predict temperature) it
    is called **regression**. Examples of regression models are linear regression,
    regression trees, neural networks, random forest,'
