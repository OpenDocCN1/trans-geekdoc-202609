    # 10.4 Summary


    This chapter presented two anomaly detection models namely, Isolation Forests
    and autoencoders. Examples of how those models can be used for anomaly trajectory
    detection were also presented. This chapter also introduced ROC curves and AUC
    which can be used to assess the performance of a model.


    +   * **Isolation Forests** by generating random partitions of the features until
    all instances are isolated.

    * Abnormal points are more likely to be isolated during the first partitions.

    * The average tree path length of abnormal points is smaller than that of normal
    points.

    * An **anomaly score** that ranges between 0–1 is calculated based on the path
    length and the closer to 1 the more likely the point is an anomaly.

    * A **ROC curve** is used to visualize the sensitivity and false positive rate
    of a model for different thresholds.

    * The area under the curve **AUC** can be used to summarize the performance of
    a model.

    * A simple **autoencoder** is an artificial neural network whose output layer
    has the same shape as the input layer.

    * Autoencoders are used to encode the data into a lower dimension from which then,
    it'
