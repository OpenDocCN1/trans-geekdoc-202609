    We Used vectorization capabilities to compute the final vector of probabilities
    within the same function without having to iterate through each element. When
    using Keras, these operations are efficiently computed by the backend (for example,
    TensorFlow).


    Finally, point 3 states that we need to use average cross-entropy as the loss
    function. Now that we have converted $y''$ into probabilities, we can compute
    its dissimilarity with $y$. The distance (dissimilarity) between two vectors $(A,B)$
    of probabilities can be computed using the cross-entropy:


    > $CE(A, B) = -\sum B_i log(A_i) \quad (8.17)$


    Thus, to get the dissimilarity between $y''$ and $y$ we first apply $y''$ (to
    transform it into proper probabilities) and then, we compute the cross entropy
    over the resulting vector of probabilities and $y$.


    > $CE(softmax(y''), y). \quad (8.18)$


    In R this can be implemented with the following:


    ```

    # Cross-entropy

    CE <- function(A,B){

    sum(B * log(A))

    }

    y <- c(1, 0, 0)

    ```'
