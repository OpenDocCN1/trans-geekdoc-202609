    # 2.2 Performance Metrics


    Performance metrics allow us to measure the generalization performance of a model
    from several angles. The most common performance metric for classification is
    the accuracy:


    ```

    $$\text{accuracy} = \frac{\text{# correctly classified instances}}{\text{total
    # instances}} \quad (2.3)$

    ```


    In order to have a better understanding of the generalization performance of a
    model, it is a good practice to compute several performance metrics in addition
    to the accuracy. Accuracy'
