    # 8.2 Keras and TensorFlow with R


    TensorFlow² is an open-source computational library used mainly for machine learning
    and more specifically, for deep learning. It has many available tools and extensions
    to perform a wide variety of tasks as data pre-processing, model optimization,
    reinforcement learning, probabilistic reasoning, to name a few. TensorFlow is
    very flexible and is used for research, development, and in production environments.
    It provides an API that contains the necessary building blocks to build different
    types of neural networks including CNNs, Autoencoders, Recurrent Neural Networks,
    etc. It has two main versions. A CPU version and a GPU version. The latter allows
    the execution of programs by taking advantage of the computational power of graphic
    processing units. This makes training models much faster. Despite all flexibility
    and power, it can take some time to learn the basics. Sometimes you need a way
    to build and test machine learning models in a simple way, for example, when trying
    new ideas or prototyping. Fortunately, there exists an interface to TensorFlow
    called Keras³.


    Keras offers an API that abstracts TensorFlow of details making it easier to build
    and train machine models. Keras is what I use when building deep learning models
    in this book. Keras does not only provide an interface to TensorFlow but also
    to other deep learning engines as Theano⁴, Microsoft Cognitive Toolkit⁵, etc.
    Keras was developed by François Chollet and, it is integrated with TensorFlow.


