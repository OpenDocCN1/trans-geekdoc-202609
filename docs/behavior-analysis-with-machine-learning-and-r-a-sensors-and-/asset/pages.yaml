    # 5.7 Summary


    Programming functions that train predictive models expect the data to be in a
    particular format. Furthermore, some methods make assumptions about the data like
    having missing values, having all variables in the same scale and so on. This
    chapter presented several commonly used methods to preprocess our datasets before
    using them to train models.


    +   - When collecting data from different sensors, we can face several sources
    of variation like sensor’ format, different sampling rates, different scales,
    and, so on.

    - Some preprocessing methods can lead to information injection. This happens when
    some information from the train set is leaked to the test set.

    - Missing values is a common problem in many data analysis tasks. In R, the narian
    package can be used to spot missing values.

    - Imputation is the process of inferring the values of missing values. The imputation
    package can be used to impute values in datasets.

    - Normalization is the process of transforming a set of variables to a common
    scale. For example from 0 to 1.

    - imbalanced dataset has a disproportionate number of classes of a certain type
    with respect to the others. Some methods like random/under sampling and SMOTE
    can be used to balance a dataset.

    - One-hot-encoding is a method that converts categorical variables into numeric
    ones.'
