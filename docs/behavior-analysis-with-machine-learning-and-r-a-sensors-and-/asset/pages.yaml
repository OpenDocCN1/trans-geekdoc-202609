    # 1.4 Data Analysis Pipeline


    Usually, the data analysis pipeline consists of several steps which are depicted
    in Figure 1.6. This is not a complete list but includes the most common steps.
    It starts with the data collection. Then the data exploration and so on, until
    the results are presented. These steps can be followed in sequence, but you can
    always jump from one step to another one. In fact, most of the time you will end
    up using an iterative approach by going from one step to the other (forward or
    backward) as needed.


    The big gray box at the bottom means that machine learning methods can be used
    in all steps and not just during training or evaluation. For example, one may
    use dimensionality reduction methods in the data exploration phase to plot the
    data or classification or regression methods in the cleaning phase to impute missing
    values. Now, let''s give a brief description of each of these phases:


