    ```

    # Softmax function.

    softmax <- function(scores)

    exp(scores) / sum(exp(scores))

    probabilities <- softmax(scores)

    print(probabilities)

    # [1] 0.82196136 0.04216934 0.13586930

    print(sum(probabilities)) # Should sum up to 1.

    # [1] 1

