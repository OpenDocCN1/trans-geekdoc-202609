    ```

    $f(x) = g(w\cdot x+b) \quad (8.4)$

    ```


    In neural networks terminology, $g(x)$ is known as the **activation function**.
    Its result indicates how much active unit is based on its inputs. If the result
    is 1, it means this unit is active. If the result is 0, it means the unit is inactive.


    This new notation allows us to use different activation functions by substituting
    $g(x)$ with some other function in Equation (8.4). In the case of the perceptron,
    the activation function $g(x)$ is the threshold function,


    ```

    $g(x) = step(x) = \begin{cases} 1 & \text{if } x>0 \ 0 & \text{if } x\leq 0 \end{cases}
    \quad (8.5)$

    ```


