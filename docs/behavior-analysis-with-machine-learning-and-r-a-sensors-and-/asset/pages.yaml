    one in the middle. Even if it was not perfect on the train data, it will do better
    than the other models when evaluating it on new test data.


    Overfitting is a common problem in machine learning. One way to know if a model
    is overfitting is if the error in the train set is low, but it is high on a new
    set (a test or validation set). Figure 1.14 illustrates this idea. Too-simple
    models will have a high error in both, the train and validation sets. As the complexity
    of the model increases, the error on both sets is reduced. At some point, the
    complexity of a model is too high so that it gets too specific on the train set
    and fails to perform well on a new independent set.


    In this example, we saw how overfitting and overfitting can affect the generalization
    performance of a model in a classification setting but the same can occur in regression
    problems.


    There are several methods to reduce overfitting but many are specific to each
    type of model. For example, with decision trees (covered in chapter 2), one way
    to reduce overfitting is to limit their depth or build ensembles of trees (chapter
    3). Neural networks are also highly prone to overfitting since they can be very
    complex with millions of parameters and there are also several techniques to reduce
    the effect of overfitting (chapter 8).


