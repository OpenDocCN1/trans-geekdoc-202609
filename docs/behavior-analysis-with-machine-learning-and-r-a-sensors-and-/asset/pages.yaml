    8.15 shows the predictions on new training data points that were never seen by
    the network before.


    Even though the predictions are not perfect, they are very close to the expected
    value (division by 2) considering that the network is very simple and was only
    trained with a single data point and only for 3 epochs!


    If the training set has more than one data point, then we need to compute the
    derivative of each point and accumulate them (the derivative of a sum is equal
    to the sum of the derivatives). In the previous example, the update rule becomes


    > $w = w - \alpha \sum_{i=1}^{N} 2x_i(w - y) \quad (8.14)$


    This means before updating a weight, first we need to compute the derivative for
    each point and add them. This needs to be done for every parameter in the network.
    Thus, each **epoch** is a pass through all training points and all parameters.


