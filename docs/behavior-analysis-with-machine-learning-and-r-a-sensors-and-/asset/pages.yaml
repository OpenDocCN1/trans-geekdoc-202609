    ![](img/91c149cc24c3e5af2971580c9dda9d8b_346_0.png)


    > A good way of finding the best threshold is to set apart validation set from
    which the optimal threshold can be estimated. However, this is not always feasible
    due to the limited amount of abnormal points.


    In this example we manually tried different thresholds and evaluated their impact
    on the final results. In the following section I will show you a method that allows
    you to estimate the performance of a model when considering many possible thresholds
    at once!


    # 10.2.4 ROC curve and AUC


    The receiver operating characteristic curve we also known as ROC curve is a plot
    that depicts the sensitivity and the false positive rate (FPR) as behave the detection
    threshold varies. The sensitivity/recall can be calculated by dividing the true
    positives by the number of positives TP/P (see chapter 2). The FPR = FP/N where
    FP are the false positives and N are the total number of negative examples (the
    normal trajectories). The FPR is also known as the probability of false alarm.
    Ideally, we want a model that has a high sensitivity and a low FPR.


    In R we use the PRROC package (Graau et al., 2015) to plot ROC curves. We will
    plot the ROC curve of the Isolation Forest results for the abnormal fish trajectory
    detection.'
