    # 5.3 Normalization


    Having variables on different scales can have an impact during learning and at
    inference time. Consider a study where the data was collected using a wristband
    that has a light sensor and an accelerometer. The measurement unit of the light
    sensor is *lux* whereas the accelerometer''s is $m/s^2$. After inspecting the
    dataset, you realize that the *min* and *max* values of the light sensor are 0
    and 155 respectively. The *min* and *max* values for the accelerometer are -0.4
    and 7.45 respectively. Why is this a problem? Well, several learning methods are
    based on distances such as k-nn, Nearest centroid, Dynamic Time Warping, thus
    will be heavily affected by bigger scales. Furthermore, other methods like neural
    networks (covered in chapter 8) are also affected by different scales. They have
    a harder time learning their parameters (weights) when data is not normalized.
    On the other hand, some methods are not affected by different scales, for example,
    tree-based learners as decision trees and random forests. Since most of the time
    you may want to try different methods, it is a good idea to normalize your predictor
    variables.


    A common normalization technique is to scale all values between 0 and 1. Suppose
    there is a numeric vector $x$ that you want to normalize between 0 and 1. Let
    $max(x)$ and $min(x)$ be the maximum and minimum values of $x$. The following
    can be used to normalize the $i^{th}$ value of $x:


    ```

    $z_i = \frac{x_i - min(x)}{max(x) - min(x)}$

    ```


    $z_i$ is the new normalized $i^{th}$ value, thus the previous formula is applied
    to every value in $x$. The $max(x)$ and $min(x)$ values are parameters learned
    from the data. Notice that if you split your data into training and test sets
    the $max$ and $min$ values (the parameters) are learned only from the training
    set and then normalize both the train and test set. This is to avoid information
    injection (section 5.5). Be aware that after the parameters are learned from the
    train set and once the model is deployed in production, it is likely that some
    input values will be ''out of range''. If the train set is not representative
    of what you will find in real life, some values will be smaller than the learned
    $min(x)$ and some others will be greater than the learned $max(x)$. Even if the
    train set is representative of the real-life phenomenon, there is nothing that
    will prevent some to be out of range. A simple way to handle this is to truncate
    the values. In some cases, we know what are the true minimum and maximum values.
    For example in image processing, images are usually'
