  md: '# Chapter 5


    # Preprocessing Behavioral Data


    ```

    preprocessing.R

    ```


    Sensor-based behavioral data comes in many flavors and forms, but when training
    predictive models, the data needs to be in a particular format. Some of the sources
    of variation when collecting data are:


    +   - **Sensors’ format.** Each type of sensor and manufacturer stores data in
    a different format. For example, .csv files, binary files, images, proprietary
    formats, etc.

    - **Sampling rate.** The sampling rate indicates how many measurements are taken
    per unit of time. For example, a heart sensor may return a single value every
    second, thus, the sampling rate is 1 Hz. An accelerometer that captures 50 values
    per second has a sampling rate of 50 Hz.

    - **Scales and ranges.** Some sensors may return values in degrees (e.g., a temperature
    sensor) while others return values in some other scale, for example, centimeters
    for a proximity sensor. Furthermore, ranges can also vary. That is, a sensor may
    capture values in the range of 0-1000, for example.


    During the data exploration step (chapter 4) we may also find that there are missing
    values, inconsistent values, noise, and so on, thus, we also need to care of that.


    This chapter provides an overview of some common methods used to clean and preprocess
    the data before one can start training reliable models.'
  merge: -1
  img_proc: true
