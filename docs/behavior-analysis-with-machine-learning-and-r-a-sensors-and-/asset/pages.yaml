    # 8.1.6 Stochastic Gradient Descent


    We have seen how gradient descent iterates over all training points before updating
    each parameter. To recall, an epoch is one pass through all parameters and for
    each parameter, the derivative with each training point needs to be computed.
    If the training set consists of thousands or millions of points this method becomes
    very time-consuming. Furthermore, in practice neural networks do not have one
    or two parameters but thousands or millions. In those cases, the training can
    be done more efficiently using stochastic gradient descent (SGD). This method
    adds two modifications to the classic gradient descent:


    +   1. At the beginning, the training set is shuffled (this is the stochastic
    part).

    2. The training set is divided into $b$ batches with $m$ data points. Each $m$
    is known as the batch size and is a hyperparameter that we need to define.


    Then, at each epoch all batches are iterated and the parameters are updated based
    on each batch and not the entire training set, for


    ```

    $w = w - \alpha \sum_{i=1}^{m} 2x_i(x_i, w - y)$ (8.15)

    ```


    Again, an epoch is one pass through all parameters and all batches. Now you may
    be wondering why this method is more efficient if an epoch still involves the
    same number of operations but they are split into chunks. Part of this is since
    the parameter updates are more frequent, the loss also improves quicker. Another
    reason is that the operations within each batch can be optimized and performed
    in parallel, for example, by using a GPU. One thing to note is that each update
    is based on less information by only using $m$ points of the entire data set.
    This can introduce noise in the learning but at


    > $^1$http://neuralnetworksanddeeplearning.com/chap2.html'
