  md: In summary, one can construct any type of dummy model depending on the application.
    The takeaway is that dummy models allow us to assess how more complex models perform
    with respect to some baselines and can help us to detect possible problems in
    the data and features. What I typically do when solving a problem is to start
    with simple models and/or rules and then, try more more complex models. Of course,
    manual thresholds and simple rules can work remarkably well in some situations
    but they are not scalable. Depending on the use, one can just implement the simple
