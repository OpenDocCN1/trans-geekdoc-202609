    # 4.5 Boxplots


    Box plots are a good way to visualize the relationship between variables and classes.
    R already has the boxplot() function. In the SMARTPHONE ACTIVITIES dataset, the
    RESULTANT variable represents the ''total amount of movement'' considering the
    three axes. It is the average of the square roots of the sum of the values of
    each axis squared $\sqrt{x^2+y^2+z^2}$. The following code displays a set of boxplots
    (one for each class) with respect to the RESULTANT variable.


    ```

    boxplot(RESULTANT ~ class, dataset)

    ```


    The solid black line in the middle of each box marks the *median*. For a more
    complete explanation about boxplots please see here ^1. Overall, we can see that
    this variable can be good at separating high-intensity activities like jogging,
    walking, etc. from low-intensity


