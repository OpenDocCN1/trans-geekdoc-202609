    # 2.6 Dummy Models


    ```

    dummy_classifiers.R

    ```


    When faced with a new problem, you may be tempted to start trying to solve it
    by using a complex model. Then, you proceed to train your complex model and evaluate
    it. The results look reasonably good so you think you are done. However, this
    good performance could only be an illusion. Sometimes there are underlying problems
    with the data that give the false impression that a model is performing well.
    Examples of such problems are imbalanced datasets, no correlation between the
    features and the classes, features not containing enough information, **Dummy
    models** can be used to spot some of those. Dummy models use little or no information
    at all when making predictions (we’ll see how in a moment).


    Furthermore, for some problems (specially in regression) it is not clear what
    is considered to be a good performance. There are problems in which doing slightly
    better than random is considered great achievement (e.g., in forecasting) but
    for other problems that would be unacceptable. Thus, we need some type of baseline
    to assess whether or not a particular model is bringing some benefit. Dummy models
    are not only used to spot problems but can be used as baselines as well.


    > Dummy models are also called *baseline models* or *dumb models*. One student
    was supervising us to call them *stupid models*. When I am angry I also call them
    that today I''m in a good mood I''ll refer to them as *dummy*.


    Now, I will present three types of dummy classifiers and we will implement them.


