  md: "# CHAPTER 5. PREPROCESSING BEHAVIORAL DATA\n\nset and a test set. The parameters\
    \ (max and min) are learned from the train set and used to normalize both, the\
    \ train and test sets.\n\n```\n# Define a function to normalize the train and\
    \ test set\n# based on the parameters learned from the train set.\nnormalize <-\
    \ function(trainset, testset){\n\n# Iterate columns\nfor(i in 1:ncol(trainset)){\n\
    \n  c <- trainset[,i] # train column\n  c2 <- testset[,i] # testset column\n\n\
    \  # Skip if the variable is not numeric or integer.\n  if(class(c) != \"numeric\"\
    \ && class(c) != \"integer\"){\n\n    # Learn the max value from the trainset's\
    \ column.\n    max <- max(c, na.rm = T)\n    # Learn the min value from the trainset's\
    \ column.\n    min <- min(c, na.rm = T)\n\n    # If all values are the same set\
    \ it to max.\n    if(max==min){\n      trainset[,i] <- max\n      testset[,i]\
