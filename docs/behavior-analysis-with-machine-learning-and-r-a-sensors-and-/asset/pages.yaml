    # 4.11 Summary


    One of the first tasks during a data analysis pipeline is to familiarize yourself
    with the data. There are several techniques and tools that can provide support
    during this process.


    +   - Talking with field experts can help you to better understand the data.

    - Generating statistics is a good way to gain general insights of a dataset. In
    R, the summary() function will compute such statistics.

    - For classification problems, one of the first steps is to check the distribution
    of classes.

    - In multi-user settings, generating a user-class sparsity matrix can be useful
    to detect missing classes per user.

    - Boxplots and correlation plots are used to understand the behavior of the variables.

    - R has several packages for creating interactive plots such as digraphs for timeseries
    and qtlcharts

    - Multidimensional scaling (MDS) can be used to project high-dimensional data
    into 2 or 3 dimensions so they can be plotted.

    - R has some packages like DataExplorer that provide some degree of automation
    for exploring a dataset.'
