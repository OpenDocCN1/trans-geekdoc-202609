    pipeline. This applies to both classification and regression problems. I''m starting
    with this topic because it will be a recurring one every time you work with machine
    learning. You will also be training a lot of models, but you will need ways to
    validate them as well.


    Once you have trained a model (with a training set), that is, finding the best
    function $f$ that maps inputs to their corresponding outputs, you may want to
    estimate how good the model is at solving a particular problem when presented
    with examples it has never seen before (that were not part of the training set).
    This estimate of how good the model is at predicting the output of new examples
    is called **generalization performance.**


    To estimate the generalization performance of a model, a dataset is usually divided
    into a *train set* and a *test set*. As the name implies, the train set is used
    to train the model (learn its parameters) and the test set is used to evaluate/test
    its generalization performance. We need independent sets because when deploying
    models in the wild, they will be presented with new instances never seen before.
    By dividing the dataset into two subsets, we are simulating this scenario where
    the test set instances were never seen by the model at training time so the performance
    estimate will be more accurate than if we used the same set to train and evaluate
    it. There are two main validation methods that differ in the way the dataset is
    divided: *hold-out validation* and *k-fold cross validation.*


    +   **1) Hold-out validation.** This method randomly splits the dataset into train
    and test sets based on some predefined percentages. For example, randomly select
    70% of the instances and use them as train set and the remaining 30% for the test
    set. This will vary depending on the application and the amount of data, but typical
    splits are 50/50 and 70/30 percent for the train and test sets, respectively.
    Figure 1.7 shows an example of a dataset divided into 70/30.


    Then, the train set is used to train (fit) a model, and the test set is to evaluate
    how well that'
