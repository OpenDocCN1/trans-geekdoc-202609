- pgno: 9
  md: '# Welcome


    This book aims to provide an introduction to machine learning concepts and algorithms
    applied to a diverse set of behavior analysis problems. It focuses on the practical
    aspects of solving problems based on data collected from sensors or stored in
    electronic records. The included examples demonstrate how to perform several of
    the tasks involved during a data analysis pipeline such as data exploration, visualization,
    preprocessing, representation, model training/validation, and so on. Of all this,
    using the R programming language and real-life datasets.


    Some of the content that you will find here, How To:


    +   - Build supervised machine learning models to predict indoor locations based
    on WiFi signals, recognize physical activities from smartphone sensors and 3D
    skeleton data, detect gestures from accelerometer sensors, and so on.

    - Use unsupervised learning algorithms to discover criminal behavioral patterns.

    - Program your own ensemble learning methods and use multi-view stacking to fuse
    signals from heterogeneous data sources.

    - Train deep learning models as neural networks to classify muscle activity from
    electromyography signals and CNNs to detect smiles in images.

    - Evaluate the performance of your models in traditional and multi-user settings.

    - Train anomaly detection models such as Isolation Forests and autoencoders to
    detect abnormal fish trajectories.

    - And much more!


    The accompanying source code for all examples is available at https://github.com/enrigiquet/behavior-code.
    The book itself was written in R with the bookdown package developed by Yihui
    Xie. The front cover and summary-comments were illustrated by Vance Capley.


