    #> 0 202 8

    #> 1 16 46

    ```


    From the ROC curve plot we can see that the AUC was 0.93 which is lower than the
    0.96 achieved by the Isolation Forest but with fine tuning and training for more
    epochs, the autoencoder should be able to achieve similar results.'
