  md: '# # Chapter 10


    # ## Detecting Abnormal Behaviors


    Abnormal data points are instances that are rare or do not occur very often. They
    are also called outliers. Some examples include illegal bank bank transactions,
    defective products, natural disasters, etc. Detecting abnormal behaviors is an
    important topic in the fields of health care, ecology, economy, psychology, and
    so on. For example, abnormal behaviors in wildlife creatures can be an indication
    of abrupt changes in the environment and rare behavioral patterns in a person
    may be an indication of health deterioration.


    Anomaly detection can be formulated as a binary classification task and solved
    by training a classifier to distinguish between normal and abnormal instances.
    The problem with this approach is that anomalous points are rare and there may
    not be enough to train a classifier. This can also lead to class imbalance problems.
    Furthermore, the models should be able to detect abnormal points even if they
    are very different from the training data. To address these issues, several anomaly
    detection methods have been developed over the years and this chapter introduces
    two of them: Isolation Forests and Autoencoders.


    This chapter starts by explaining how Isolation Forests work and then, an example
    of how to apply them for abnormal trajectory detection is presented. Next, a method
    (ROC curve) to evaluate the performance of such models is described. Finally,
    another called autoencoder can be used for anomaly detection is explained and
    applied to the abnormal trajectory detection problem.


    # ### 10.1 Isolation Forests


    As its name implies, an isolation forest identifies anomalous points by explicitly
    ''isolating'' them. In this context isolation means separating an instance from
    the others. This approach is different from many other anomaly detection algorithms
    where they first build a profile of normal instances and mark an instance as an
    anomaly if it does not conform to the'
  merge: -1
  img_proc: true
- pgno: 330
  md: '# CHAPTER 10. DETECTING ABNORMAL BEHAVIORS


    +   - anomaly

    * normal


    ![](img/91c149cc24c3e5af2971580c9dda9d8b_330_0.png)


    Figure 10.1: Example partitioning of a normal and an anomalous point.


    normal profile. Isolation Forests were proposed by Liu et al. (2008) and the method
    is based on building many trees (similar to Random Forests, Chapter 3). This method
    has several advantages including its efficiency in time and memory usage. Another
    advantage is at training time it does not require to have examples of the anomalous
    cases but if available, they can be incorporated as well. This method is based
    on trees, another thing about it is that it does not require to scale the features.


    This method is based on the observation that anomalies are ‘few and different’
    which makes them easier to isolate. This method builds an ensemble of trees where
    each tree is called Isolation Tree. Each Isolation Tree partitions the features
    until every instance is isolated (it’s at a leaf node). Since anomalies are easier
    to isolate they will be closer to the root of the tree. An instance is marked
    as an anomaly if it has a short path length to the root across all Isolation Trees.


    A tree is generated recursively by randomly selecting a feature and then selecting
    a partition point between the maximum and minimum value of that feature. Each
    partition corresponds to a split point in tree. The procedure terminates when
    all instances are isolated. The number of partitions that were required to isolate
    a point corresponds to the path length of that point to the root of the tree.


    Figure 10.1 shows a sets of points with only 1 feature (x axis). One of the anomalous
