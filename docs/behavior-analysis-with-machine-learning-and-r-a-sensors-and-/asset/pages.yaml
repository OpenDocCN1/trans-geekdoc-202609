- pgno: 334
  md: '# CHAPTER 10. DETECTING ABNORMAL BEHAVIORS


    ![](img/91c149cc24c3e5af2971580c9dda9d8b_334_0.png)


    Figure 10.4: Example of Dascyllus reticulatus fish. Source: wikedia.org


    Capturing fish trajectories is a challenging task specially, in unconstrained
    underwater conditions. Frankly, the Fish4Knowledge¹ project has developed fish
    analysis tools and methods to ease the task. They have processed enormous amounts
    of video streaming data and have extracted fish information including trajectories.
    They have made the fish trajectories dataset publicly available² (Beyan and Fisher,
    2013).


    The FISH TRAJECTORIES dataset contains 3102 trajectories belonging to the Dascyllus
    reticulatus fish (see Figure 10.4) observed in the Taiwanese coral reef. Each
    trajectory is labeled as ''normal'' or ''abnormal''. The trajectories were extracted
    from underwater video and are stored as coordinates over time.


    Our main task will be to detect the abnormal trajectories using an Isolation Forest
    before that, we are going to explore, visualize, and pre-process the dataset.


    # 10.2.1 Explore and Visualize Trajectories


    The data is stored in a mat file so we are going to use the package R.matlab (Bengtsson,
    2018) to import the data into an array. The following code can be found in the
    script visualize_fish.R.


    ```

    library(R.matlab)


    # Read data.

    df <- readMat("../fishDetections_total3102.mat")$fish.detections

    ```


