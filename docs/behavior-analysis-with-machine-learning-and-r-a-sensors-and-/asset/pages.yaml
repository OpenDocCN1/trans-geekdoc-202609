  md: '# CHAPTER 7. ENCODING BEHAVIORAL DATA


    So, far, I have been talking about BoW applications for text and images. In this
    section, I will show you how to decompose complex activities from accelerometer
    data into simpler activities and encode them as BoW. In chapters 2 and 3 we have
    supervised models for simple activity recognition. Those activities were some
    like: walking, jogging, standing, etc. For those, it is sufficient to divide them
    into windows of size equivalent to a couple of seconds in order to infer their
    labels. On the other hand, complex activities happen in longer periods of time
    and are composed of many simple activities. One example is the activity shopping.
    When we are shopping we perform many different activities including walking, taking
    groceries, paying, standing while looking at the stands, and so on. Another example
    is commuting.


    Using the same approach for simple activity classification on complex ones may
    not work. Representing a complex activity using fixed-size windows, could cause
    some conflicts. For example, a window may be covering the time when the user was
    walking, walking can be present in different types of complex activities. If a
    window falls to be part of a segment when the person was walking, there is not
    enough information to know which was the complex activity at that time. This is
    where BoW comes into play. If we represent a complex activity as a bag of simple
    activities then, a classifier will have an easier time differentiating between
    classes. For instance, when exercising, the frequencies (counts) of high-intensity
    activities (like running or jogging) will be higher compared to when someone is
    shopping.


    In practice, it would be very tedious to label all the simple activities to form
    the BoW. We will use the unsupervised approach discussed in the previous section
    to automatically find labels for the simple activities so we only need labels
    for the complex ones.


    Here, I will use the COMPLEX ACTIVITIES dataset consisting of five complex activities:
    ''commuting'', ''working'', ''being at home'', ''shopping'' and ''exercising''.
    The duration of the activities varies from some minutes to a couple of hours.
    Accelerometer data at 50 Hz was collected with a cellphone placed in the user''s
    belt. The dataset has 880 accelerometer files, representing a complex activity.


    The task is to go from the raw accelerometer data of the complex activity to a
    BoW representation where each word will represent a simple activity. The overall
    steps are as follows:


    +   Divide the raw data into small fixed-length windows and generate feature vectors
    from them. Intuitively, these are the simple activities.


    +   Cluster the feature vectors.


    +   Label the vectors by assigning them to the closest centroid.


    +   Build the word-count table.'
  merge: -1
  img_proc: true
