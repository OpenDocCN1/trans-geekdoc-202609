- pgno: 89
  md: '$X = (x_1, x_2, \dots, x_{T_x})$\nY = (y_1, y_2, \dots, y_{T_y})$


    $x_i$ and $y_i$ are vectors. In the previous example, the vectors only have one
    element since the sequences are 1-dimensional but DTW also works with multidimensional
    sequences. $T_x$ and $T_y$ are the sequences'' lengths.


    $d(i_x, i_y)$


    be the *dissimilarity* (distance) between vectors $x_i$ and $y_i$ (e.g., Euclidean
    distance). Then, $\phi_x$ and $\phi_y$ are the warping functions that relate $i_x$
    and $i_y$ to a common axis $k$:


    $i_x = \phi_x(k), k = 1, 2, \dots, T$\nY_y = \phi_y(k), k = 1, 2, \dots, T.$


    The total dissimilarity between the two sequences:


    $d_{\phi}(X, Y) = \sum_{k=1}^{T} d(\phi_x(k), \phi_y(k))$


    The aim is to find the warping function $\phi$ that minimizes the total dissimilarity:


    $\min_{\phi} d_{\phi}(X, Y)$


    The solution can be efficiently computed using dynamic programming. Usually, when
    solving this minimization problem, some constraints are applied:


    +   - **Endpoint constraints.** This constraint makes sure that the first and
    last elements of each sequence are connected.


    $\phi_x(1) = 1, \phi_y(1) = 1$\nphi_x(T) = T_x, \phi_y(T) = T_y$'
