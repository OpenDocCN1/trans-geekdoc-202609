    # 5.4 Imbalanced Classes


    Ideally, classes will be uniformly distributed, that is, there is approximately
    the same number of instances per class. In real-life (as always), this is not
    the case. And in many situations (more than you may think), class counts are heavily
    skewed. When this happens the dataset is set to be imbalanced. Take as an example,
    bank transactions. Most of them will be normal when a small percent be fraudulent.
    In the medical field this is very common. It is easier to collect samples from
    healthy individuals compared to samples from individuals with rare conditions.
    For example, a database may have thousands of images from healthy tissue but with
    signs of cancer. Of course, having a few cases with diseases is a good thing for
    the world! but not for machine learning methods. This is because predictive models
    will try to learn their parameters such that the error is reduced and most of
    the time this error is based on accuracy, the models will be biased towards making
    correct predictions for the majority classes (the ones with higher counts) while
    paying attention to minority classes. This can be a problem because some applications
    we may be more interested in detecting the minority classes (illegal transactions,
    cancer cases, etc.).


    Suppose a given database has 998 instances with class ''no cancer'' and only 2
    instances with class ''cancer''. A trivial classifier that always predicts ''no
    cancer'' will have an accuracy of 98.8% will not be able to detect any of the
    ''cancer'' cases! So, what can we do?


    +   - Collect more data from the minority class. In practice, this can be difficult,
    expensive, etc. or just impossible because the study was conducted a long time
    ago and it is no longer possible to replicate the context.'
  merge: -1
  img_proc: true
- pgno: 173
  md: '# CHAPTER 5. PREPROCESSING BEHAVIORAL DATA


    +   * Delete data from the majority class. Randomly discard instances of the majority
    class. In the previous example, we could discard 996 instances of type ''no cancer''.
    The problem with this is that we end up having small datasets and it will not
    be enough to learn good predictive models. If you have a huge dataset then this
    can be an option in practice, this is rarely the case and you have the risk of
    having underrepresented samples.


    +   * Create synthetic data. One of the most common solutions is to create synthetic
    data from the minority classes. In the following sections two methods that will
    be discussed: random oversampling and SMOTE.


    +   * Adapt your learning algorithm. Another option is to use an algorithm that
    takes into account class counts and weights them accordingly. This is called cost-sensitive
    classification. For example, the rpart() method to train decision trees has a
    weight parameter that can be used to assign more weight to minority classes. When
    training neural networks it is also possible to assign weights to different classes.


    The following two subsections cover techniques to create synthetic data.


    # 5.4.1 Random Oversampling


    > shny_random-oversampling.Rmd


    This method consists of duplicating data points from the minority class. The following
    code will create an imbalanced dataset with 200 instances of ''class1'' and only
    15 instances of ''class2''.


    ```

    set.seed(1234)

    # Create random data

    n1 <- 200 # Number of points of majority class.

    n2 <- 15 # Number of points of minority class.


    # Generate random values for class1.

    x <- rnorm(mean = 0, sd = 0.5, n = n1)

    y <- rnorm(mean = 0, sd = 1, n = n1)

    ```'
