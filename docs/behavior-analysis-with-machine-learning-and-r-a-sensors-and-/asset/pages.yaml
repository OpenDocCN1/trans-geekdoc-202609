    # 6.3 Mining Association Rules


    Association rule mining consists of a set of methods to extract patterns (rules)
    from transactional data. For example, shopping behavior can be analyzed by finding
    rules from customers'' shopping transactions. A transaction is an event that involves
    a set of items. For example, when someone buys a soda, a bag of chips, and a chocolate
    bar the purchase is registered as one transaction containing 3 items. I apologize
    for using this example for those of you with healthy diets. Based on a database
    that contains many transactions, it is possible to uncover item relationships.
    These relationships are usually expressed as implication rules of the form X ⇒
    Y where X and Y are sets of items. Both sets are disjoint, this means that items
    in X are not in Y and vice-versa which can be formally represented as X ∩ Y =
    ∅, that is, the intersection of the two sets is the empty set. X ⇒ Y is read as:
    if X then Y. The left-hand-side (lhs) X is called the antecedent and the right-hand-side
    (rhs) Y is the consequent.'
  merge: -1
  img_proc: true
- pgno: 197
  md: '# CHAPTER 6. DISCOVERING BEHAVIORS WITH UNSUPERVISED LEARNING 185


    In the unhealthy supermarket example, a rule like {chips, chocolate} ⇒ {soda}
    can be interpreted as if someone buys chips and then, it is likely that this person
    will also buy soda. These types of rules are used for targeted advertisements,
    product placement decisions, etc.


    The possible number of rules that can be generated grows exponentially as the
    number of items increases. Furthermore, not all rules may be interesting. The
    most well-known algorithm for finding association rules is called Apriori (Agrawal
    and Srikant, 1994). To quantify a rule is interesting or not, this algorithm uses
    two importance measures: support and confidence.


    +   - Support. The support supp(X) of an itemset X is the proportion of transactions
    that contain all the elements in X. This quantifies how frequent the itemset.


    +   - Confidence. The confidence of a rule conf(X ⇒ Y)=supp(X ∪ Y)/supp(X) and
    can be interpreted as the probability Y occurs given X is present. This can also
    be thought of as the probability that transaction X also contains Y. The ∪ operator
    is the union of two sets. This means taking all elements from both sets and removing
    repeated elements.


    Now that we have a way to measure the rules'' importance, the Apriori algorithm
    first finds itemsets that satisfy a minimum support and generates rules from those
    itemsets that satisfy a minimum confidence. These minimum thresholds are set by
    the user. The lower the thresholds, the more rules returned by the algorithm.
    One thing to note is that Apriori generates rules with itemsets of size one on
    the right-hand side. Another common metric to measure the importance of a rule
    is the lift. Lift is typically used after Apriori has generated the rules to further
    filter/or rank the results.


    +   - Lift. The lift of a rule lift(X ⇒ Y)=supp(X ∪ Y)/(supp(X)supp(Y)) is similar
    to the confidence but it also takes into consideration the frequency of X and
    Y. A lift of 1 means there is no association between X and Y. A lift greater than
    1 means that Y is likely to occur if X occurs and a lift less than 1 means that
    Y is unlikely to occur when X occurs.


    We compute all those metrics using an example. The following table shows an database
    of transactions.


    The support of the itemset consisting of a single item ''chocolate'' is supp({chocolate})=5/10=0.5
    because ''chocolate'' appears in 5 out of the 10 transactions. The support of
    {chips, soda} is 3/10=0.3.'
