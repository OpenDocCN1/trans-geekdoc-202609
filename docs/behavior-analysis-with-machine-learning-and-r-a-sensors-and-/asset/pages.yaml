    \ <- (c - min) / (max - min)\n\n      # Truncate max values in testset.\n    \
    \  idxs <- which(c2 > max)\n      if(length(idxs) > 0){\n        c2[idxs] <- max\n\
    \      }\n\n      # Truncate min values in testset.\n    }\n  }\n}\n}\n```"
