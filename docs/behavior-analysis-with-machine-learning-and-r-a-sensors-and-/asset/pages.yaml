    # 2.6.2 Uniform Classifier


    This is another type of dummy classifier. One predicts classes at random with
    equal probability and can be implemented as follows.


    ```

    # Define the dummy classifier''s train function

    uniform.train <- function(data){


    # Get the unique classes.

