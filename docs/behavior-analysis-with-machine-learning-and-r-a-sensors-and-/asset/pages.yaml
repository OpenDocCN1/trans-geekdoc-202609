    # 2.5.1 Hand Gesture Recognition


    ![](img/91c149cc24c3e5af2971580c9dda9d8b_94_0.png)


    hand_gestures.R, hand_gestures_auxiliary.R


    Gestures are a form of communication. They are often accompanied with speech but
    can also be used to communicate independently of speech (like in sign language).
    Gestures allow us to externalize and emphasize emotions and thoughts. They are
    based on body movements from arms, hands, fingers, face, head, etc. Gestures can
    be used as a non-verbal way to identify and study behaviors for different purposes
    such as for emotion'
