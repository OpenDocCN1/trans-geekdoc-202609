    The visual interpretation of RPs requires some experience and is out of the scope
    of this book. However, they can be used as a visual pattern extraction tool to
    represent the data and then, in conjunction with machine learning methods like
    CNNs, used to solve classification problems.


    > There exists an objective way to analyze RPs is called recurrence quantification
    analysis (RQA) (Zbilut and Webber, 1992). It introduces several measures like
    percentage of recurrence points (recurrence rate), percentage of points that form
    vertical lines (laminarity), average length of diagonal lines, length of the longest
    diagonal line, trees, etc. Those measures can then be used as features to train
    classifiers such as decision trees, k-nn, etc.


    But how are RPs computed? Well, that is the topic of the next section.


    # 7.5.1 Computing Recurrence Plots


    It''s time to delve into the details of how these mysterious plots are computed.
    Suppose there is a timeseries with $n$ elements (points). To compute its RP we
    need to compute the distance between each pair of points. We can store this information
    in an $n \times n$ matrix. Let''s call this a distance matrix $D$. Then, we need
    to define a threshold $\epsilon$. For each entry in $D$ if the distance is less
    or equal than the threshold $\epsilon$ then it is set to 1 and 0 otherwise.


    Formally, a recurrence of a state at time $i$ at a different time $j$ is marked
    within a two-dimensional square matrix with ones and zeros whose axes represent
    time:


    ```

    $R_{i,j}(x) = \begin{cases} 1 & \text{if } ||\tilde{x}_i - \tilde{x}_j|| \le \epsilon
    \ 0 & \text{otherwise}. \end{cases} \quad (7.1)$

    ```'
  merge: -1
  img_proc: true
