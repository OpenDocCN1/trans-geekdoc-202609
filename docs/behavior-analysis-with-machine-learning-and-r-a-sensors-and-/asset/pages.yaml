    ```


    In this section, we will use association rules mining to find patterns in the
    HOMICIDE REPORTS dataset. This database contains homicide reports from 1980 to
    2014 in the United States. The database is structured as a table with 24 columns
    and 638, 454 rows. Each row corresponds to a homicide report that includes city,
    state, year, the month of the victim, sex of the perpetrator, if the crime was
    solved or not, weapon used, age of the victim and perpetrator, the relationship
    type between the victim and the perpetrator and some other information.


    Before trying find rules, the data needs to be preprocess and converted into transactions.
    Each homicide report will be a transaction and the items will be the possible
    values of 3 of the columns: **Relationship, Weapon, and Perpetrator.Age. The Relationship**
    variable can take values like Stranger, Neighbor, Friend, etc. In total, there
    are 28 possible relationship values including *Unknown*. For the purpose of our
    analysis, we will remove rows with unknown in *Relationship* and *Weapon*. Since
    Perpetrator.Age is an integer, we need to convert it into categories. The following
    age groups are created: child (< 13 years), teen (13 to 17 years), adult (18 to
    45 years) and lateAdulthood (> 45 years). After this cleaning and preprocessing
    steps, the dataset has 3 columns and 328, 238 rows. See Figure 6.11. The script
    used to perform the preprocessing is `crimes_process.R`.


    Now, we have a data frame that contains only the information that we will use
    and each row will be used to generate one transaction. An example transaction
    may be {R. Wife, Knife, Adult}. This represents the case where the perpetrator
    is an adult who used a knife to kill his wife. Note the ‘R’ at the beginning of
    ‘Wife.’ was added for clarity to identify that this item is a relationship. One
    to note that every transaction will consist of exactly 3 items. This is a bit
    different than the market basket case in which every transaction can include a
    varying number of products. Although this item-size constraint


