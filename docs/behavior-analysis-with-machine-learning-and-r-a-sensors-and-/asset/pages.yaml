    * Comedy: Indicates if the genre of the movie is *comedy*.

    * Price: Ticket price.

    * Go: The decision of whether to go to the movies or not.


    The main question when building a tree which feature should be at the root (top).
    One answer this question, you may need to grow the tree by adding another feature
    (node) as one of the root''s children. To decide which feature to add you need
    to answer the first question: “What feature should be at the root of this subtree?”.
    This is a recursive definition! The tree keeps growing until you reach a leaf
    node, there are no more features to select, or you have reached a predefined depth.


    For the *cinema* dataset we need to find the best variable to be placed at root.
    Let''s suppose we choose between *Price* and *Comedy*. Figure 2.8 shows these
    two possibilities.


    If select *Price*, there are three possible subnodes, one for each value: *low,
    medium,* and high. If *Price* is low then four instances fall into this subtree
    (the first four from the table). For all of them, the value of *Go* is 1. If *Price*
    is high, two instances fall into this category and their *Go* is 0, if price is
    high then you should not go to the movies according to this data. There are six
    instances for the *Price* is medium. From those, two of them have *Go=1* and the
    remaining four have *Go=0*. For cases the *Price* is *low* or high we can arrive
    at a solution. If the price is *low* then go to cinema, if the price is high then
