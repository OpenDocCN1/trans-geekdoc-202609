    the local cost matrix is 0 and the cost of the *minimum* of the cell from the
    west (1, 1) is also 0. So $W : 0 + 0 + 0 = 0$. For each cell we add the current
    cost plus minimum cost when coming from the contiguous cell. The minimum costs
    are marked with red. For some cells it is possible to arrive from three different
    directions: S, W, and SW, thus we need to compute the cost when coming from each
    of those. The final minimum cost at position (5, 6) is 3. Thus, that is the global
    DTW distance. In the example, it is possible to get the minimum at (5, 6) arriving
    from the south or southeast.


    Once the table is filled, we can backtrack starting at (5, 6) to find warping
    functions. Figure 2.21 shows the final warping functions. The boundary of the
    endpoints we know $\phi_Q(1) = 1, \phi_R(1) = 1$ and $\phi_Q(6) = 5$. Then, from
    (5, 6), the minimum contiguous cell is 2 from SW, thus $\phi_Q(5) = 5, \phi_R(5)
    = 4$ and so on. Note that we could also have chosen to arrive from the south with
    same minimum value of 2 but still this would have resulted in the overall distance.
    The dashed line in figure 2.20 shows the full backtracking.


    The runtime complexity of DTW is $O(T_Q T_R)$ which is the required time to compute
    the local cost matrix and the dynamic programming table.


    In R, the *dtw* package (Giorgio, 2009) has the function `dtw()` to compute the
    DTW distance between two sequences. Let''s use this package to solve the previous
