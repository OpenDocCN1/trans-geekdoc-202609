- pgno: 304
  md: '# CHAPTER 9. MULTI-USER VALIDATION


    # When should a mixed model be used to validate a system?


    +   1. When you know that you will have some available data to train the model
    for all the users that are intended to use the system.

    2. In many cases, a dataset has already missing information about the mapping
    between rows and users. That is, a *userid* column is not present. In those cases,
    the best performance estimation would be through the use of a mixed model.


    To demonstrate the differences between the different types of models (mixed, user-independent,
    and user-dependent) I will use the SKELETON ACTIONS dataset. First, a brief description
    of the dataset is presented including details about how the features were extracted.
    Then, the dataset is used to train a mixed model and in the following sub-sections,
    it is used to train user-independent and user-dependent models.


    # 9.1.1 Skeleton Action Recognition with Mixed Models


    ```

    preprocess_skeleton_actions.R classify_skeleton_actions.R

    ```


    To demonstrate the 3 different types of models I chose the UTD-MHAD dataset (Chen
    et al., 2015) and from now on, I will refer to it as the SKELETON ACTIONS dataset.
    This database is suitable because it was collected by 8 persons (4 females/4 males)
    and each has a subject id, thus, we know which actions were collected by which
    users. The number of actions is 27 and thus of the actions are: ‘right-hand wave’,
    ‘two hand front clap’, ‘basketball shoot’, ‘front boxing’, etc.


    The data was recorded using a Kinect camera and an inertial sensor unit and each
    subject repeated each of the 27 actions 4 times. More information about the collection
    process and pictures can be consulted on the online dataset website https://personal.utdallas.edu/~kehtar/UTD-MHAD.html.


    For our examples, I will only focus on the skeleton data generated by the Kinect
    camera. These data consists of human body joints (20 joints). Each file contains
    one action for one user and repetition. The file names have the structure aA_S_T_skeleton.mat.
    The A is the action id, the S is the subject id and the T is the trial (repetition)
    number. For each frame, the 3D positions of the 20 joints are recorded.


    The script preprocess_skeleton_actions.R shows how to read the files and plot
    the actions. The files are stored in Matlab format. The library R.matlab (Bengtsson,
    2018) can be used to read the files.'
  merge: -1
  img_proc: true
