  md: '# CHAPTER 7. ENCODING BEHAVIORAL DATA


    Once the complex activities are encoded as BoW (histograms), one could train a
    classifier using the histogram frequencies as features.


    # 7.7 Graphs


    Graphs are one of the most general data structures (and my favorite one). The
    two basic components of a graph are its vertices and edges. Vertices are also
    called nodes and edges are also called arcs. Vertices are connected by edges.
    Figure 7.18 shows three types of graphs. Graph (a) is an undirected graph that
    consists of 3 vertices and 3 edges. Graph (b) is a directed graph, that is, its
    edges have a direction. Graph (c) is a weighted directed graph because its edges
    have a direction and they also have an associated weight.


    Weights can represent anything, for example, distances between cities or number
    of messages sent between devices. In the previous graph, the vertices also have
    a label (integer numbers could be strings). In general, vertices and edges can
    have any number of attributes, not just weight and/or labels. Many data structures
    like binary trees and lists are graphs with constraints. For example, a list is
    also a graph in which all vertices are connected as a sequence: a->b->c. Trees
    are also graphs with the constraint that there is only one root node and nodes
    can only have edges to their children. Graphs are very useful to represent many
    types of real-world things like interactions, social relationships, geographical
    locations, the world wide web, and so on.


    There are two main ways to encode a graph. The first one is as an adjacency list.
    An adjacency list consists of a list of tuples for each node. The tuples represent
    edges. The first element of a tuple indicates the target node and the second element
    the weight of the edge. Figure 7.19-b shows the adjacency list representation
    of the corresponding weighted directed graph in the same frame.


    The second main way to encode a graph is as an adjacency matrix. This is a square
    n x n matrix where n is the number of nodes. Edges are represented as entries
    in the matrix. If there is an edge between node a and b, the corresponding cell
    contains the weight


    ![](img/91c149cc24c3e5af2971580c9dda9d8b_235_0.png)


    Figure 7.18: Three different types of graphs.'
  merge: -1
  img_proc: true
