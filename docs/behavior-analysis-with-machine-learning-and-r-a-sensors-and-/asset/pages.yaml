  md: "# CHAPTER 2. PREDICTING BEHAVIOR WITH CLASSIFICATION MODELS\n\n$j(A, B) = \\\
    frac{|A \\cup B| - |A \\cap B|}{|A \\cup B|} \\quad (2.2)$\n\n$A$ and $B$ are\
    \ sets of MAC addresses. A **set** is an unordered collection of elements. In\
    \ our example, let's say we have two sets, $S_1$ and $S_2$:\n\n$S_1 = \\{a, b,\
    \ c, d, e\\}$$\\nS_2 = \\{e, f, g, a\\}$\n\nThe set $S_1$ has 5 elements (letters)\
    \ and $S_2$ has 4 elements. $A \\cup B$ means the **union** of the two sets $A$\
    \ and its result is the set of all elements that are either in $A$ or $B$. For\
    \ example, the union of $S_1$ and $S_2$ is $S_1 \\cup S_2 = \\{a, b, c, d, e,\
    \ f, g\\}$. The $A \\cap B$ denotes the **intersection** between $A$ and $B$ which\
    \ is the set of elements that are in both $A$ and $B$. In example, $S_1 \\cap\
    \ S_2 = \\{e\\}$. Finally the vertical bars $|\\|$ mean the **cardinality** of\
    \ the set, that is, the number of elements. The cardinality of $S_1$ is $|S_1|=5$\
    \ because it has 5 elements. The cardinality of the union of the two sets $|S_1\
    \ \\cup S_2|=7$ because the set that results from the union of $S_1$ and $S_2$\
    \ has 7 elements.\n\nIn R, we can implement the **jaccard** distance as follows:\n\
    \n```\njaccardDistance <- function(set1, set2){\nlengthUnion <- length(union(set1,\
    \ set2))\nlengthIntersecton <- length(intersect(set1, set2))\nd <- (lengthUnion\
    \ - lengthIntersecton) / lengthUnion\nreturn(d)\n}\n```\n\nThe implementation\
    \ is in the script `indoor_auxiliary.R`. Now we can run our function! Let's compute\
    \ the distance between two instances of the same class (`bedroomA`).\n\n```\n\
    # Compute jaccard distance between instances with same class:\n# (bedroomA)\n\
    jaccardDistance(dataset[[1]]$accessPoints$mac,\n      dataset[[4]]$accessPoints$mac)\n\
    # [1] 0.3333333\n```"
