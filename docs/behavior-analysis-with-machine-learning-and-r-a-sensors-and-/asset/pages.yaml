    # 10.3 Autoencoders


    In its simplest form, an autoencoder is a neural network whose output layer has
    the same shape as the input layer. If you are not familiar with artificial neural
    networks, you can take a look at chapter 8. An autoencoder will try to learn how
    to generate an output that is as similar as possible to the provided input. Figure
    10.11 shows an example of a simple autoencoder with 4 units in the input and output
    layers. The hidden layer has 2 units.


    Recall when training a classification or regression model, we need to provide
    training examples of the form (x, y) where x represents the input features and
    y is the desired output'
