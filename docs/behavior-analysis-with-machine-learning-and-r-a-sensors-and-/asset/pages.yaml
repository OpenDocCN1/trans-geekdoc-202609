- pgno: 315
  md: '# CHAPTER 9. MULTI-USER VALIDATION


    +   1. When the model will be trained only using data from the target user that
    will use the system.


    In general, user-dependent models have the best accuracy. The disadvantage is
    that they require training data from the target user and for some applications,
    collecting training data can be very difficult and expensive.


    Can we have a system that has the best of both worlds from user dependent/independent
    models? That is, a model that is as accurate as a user-dependent model but requires
    small quantities of training data from the target user. The answer is yes, and
    how we can do that is covered in the next section User-Adaptive Models.


    # 9.4 User-Adaptive Models


    We have already talked about some of the limitations of user-dependent and user-independent
    models. On one hand, userdependent models require training data from the target
    user. In many situations, collecting training data is difficult. On the other
    hand, user-independent models do not need data from the target user but are less
    accurate. To overcome these limitations, models that evolve over time as more
    information is available can be built. One can start with a user-independent model
    and as more data is available from the target user, the model can be updated accordingly.
    In this situation, there is no need to wait to start using the system and as new
    feedback is available, the model gets better and better by learning the specific
    patterns of a particular user.


    In this section, I will explain how a technique called transfer learning can be
    used to build an adaptive model that updates itself as new training data is available.
    First, in the following subsection the idea of transfer learning is introduced
    and next, the method is used to build an adaptive model for activity recognition.


    # 9.4.1 Transfer Learning


    In machine learning, transfer learning refers to the idea of using the knowledge
    gained when solving a problem to solve another different problem. The new problem
    can be a similar one but also be unrelated. For example, a model trained to detect
    smiles from images could also be used to predict gender (of course with fine-tuning).
    In humans, learning is a lifelong process in which many tasks are interrelated.
    When we are faced with a new problem, we tend to find solutions that have worked
    in the past for similar problems. However, in machine learning most of the time
    the models are trained from scratch for every'
  merge: -1
  img_proc: true
- pgno: 316
  md: '# CHAPTER 9. MULTI-USER VALIDATION


    new problem. For many tasks, training a model from scratch is very time consuming
    and requires a lot of effort, especially during the data collection and labeling
    phase.


    The idea of transfer learning dates back to 1991 (Pratt et al., 1991) but with
    the advent of deep learning and in particular, convolutional neural networks,
    has gained popularity because it has been proven to be a valuable tool when solving
    challenging problems. In 2014 a CNN architecture VGG16 was proposed by Simonyan
    and Zisser (2014) and the ILSV image recognition competition. This CNN was trained
    with more than 1 million images to recognize 1000 categories and it consists of
    several convolution layers, max pooling operations, and fully connected layers.
    In total, the network has ≈138 million parameters and it took some weeks to train.


    What if you wanted to add a new category to the 1000 labels? Or, maybe you only
    want to focus on a subset of the categories? With transfer learning you can take
    advantage of a network that has already been trained and adapted to your particular
    problem. In the case of deep learning, the approach consists ‘freezing’ the first
    layers of a network and only retrain/modify the last layers to adapt them for
    the particular problem. During training, the frozen layers'' parameters will not
    change and the unfrozen ones are updated as usual during the gradient descent
    procedure. As discussed in chapter 8, the first layers can act as feature extractors
    and can be reused. With this approach, you can easily retrain a VGG16 network
    in an average computer and within a reasonable time. In fact, Keras already provides
    interfaces to connect pre-trained architectures that you can reuse.


    In this section we will use this idea to build a user-adaptive model for activity
    recognition using transfer learning.


    # 9.4.2 A User-Adaptive Model for Activity Recognition


