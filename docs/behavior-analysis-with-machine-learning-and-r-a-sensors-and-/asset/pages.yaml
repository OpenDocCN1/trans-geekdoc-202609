    the user using the last 30 seconds and the second element is heart rate.


    Clearly, for this specific classification problem the second option is more likely
    to produce better results. The first option may not even contain enough information
    and will lead the predictive model to produce random predictions. With the second
    option, the boundaries between classes are more clear and classifiers will have
    an easier time finding them.


    In R, feature vectors are stored as data frames where rows are individual instances
    and columns are features. Some of the advantages and limitations of feature vectors
    are:


    # Advantages:


    +   - Efficient in terms of memory.

    - Most ML algorithms support them.

    - Efficient in terms of computations compared to other representations.


    # Limitations:


    +   - Are static in the sense that they cannot capture temporal relationships.

    - A lot of information and/or temporal relationships may be lost.

    - Some features may be redundant leading to decreased performance.

    - Require effort and domain knowledge to extract them.

    - Difficult to plot if the dimension is > 2 unless some dimensionality reduction
    method is applied such as Multidimensional Scaling (chapter 4).'
