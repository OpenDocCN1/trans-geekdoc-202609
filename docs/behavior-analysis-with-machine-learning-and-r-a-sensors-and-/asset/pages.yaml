  md: "# CHAPTER 1. INTRODUCTION\n\n![](img/91c149cc24c3e5af2971580c9dda9d8b_16_0.png)\n\
    \nFigure 1.2: Overall Machine Learning phases.\n\n# # 1.1 What is Machine Learning?\n\
    \nYou can think of Machine Learning as a set of computational algorithms that\
    \ automatically find useful patterns and relationships from data. Here, the keyword\
    \ is automatic. When trying to solve a problem, one can hard-code a predefined\
    \ set of rules, for example, chained if-else conditions. For instance, if we want\
    \ to detect the object in a picture is an orange or peer, we can do something\
    \ like:\n\n```\n```\nif(number_green_pixels > 90%)\n    return \"pear\"\nelse\n\
    \    return \"orange\"\n```\n```\n\nThis simple rule should work well and will\
    \ do the job. Imagine that now your boss tells you the system needs to recognize\
    \ green apples as well. Our previous rule will no longer work, and we will need\
    \ to include additional rules and thresholds. On the other hand, a machine learning\
    \ algorithm will automatically learn such rules based on the updated data. So,\
    \ you only need to update your data with examples of green apples and “click”\
    \ the re-train button!\n\nThe result of learning is knowledge that the system\
    \ can use to solve new instances of a problem. In this case, when you show a new\
    \ image to the system it should be able to recognize the type of fruit. Figure\
    \ 1.2 shows this general idea.\n\n> For more formal definitions of machine learning,\
    \ I recommend you check (Kononenko and Kukar, 2007).\n\nMachine learning methods\
    \ rely on three main building blocks:"
  merge: -1
  img_proc: true
