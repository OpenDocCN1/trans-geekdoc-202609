    where $\vec{x}$ are the states and $||\cdot||$ is a norm (for example Euclidean
    distance). $R_{i,j}$ is the square matrix and will be 1 if $\vec{x}_i \approx
    \vec{x}_j$ up to an error $\epsilon$. The $\epsilon$ is important since systems
    do not recur exactly to a previously visited state.


    The threshold $\epsilon$ needs to be set manually which can be difficult in some
    situations. If not set properly, the RP can end up having excessive ones or zeros.
    If you plan to use RPs as part of an automated process and fed them to a classifier,
    you can use the distance matrix instead. The advantage is that you do not need
    to specify any parameter except for the distance function. The distance matrix
    can be defined as:


    ```

    $D_{i,j}(x) = ||\vec{x}_i - \vec{x}_j||$

    ```


    which is similar to Equation (7.1) but without the extra step of applying a threshold.


    # Advantages:


    +   - RPs capture dynamic patterns of a system.

    - They can be used to extract small and large scale patterns.

    - Timeseries can be easily encoded as RPs.

    - Can be used as input for CNNs for supervised learning tasks.


