    In TensorFlow, image dimensions are specified with the following order: height,
    width, and depth. In Keras, the layer_conv_2d() function is used to add a convolution
    layer to a sequential model. This function has several arguments but the 6 most
    common ones are: filters,kernel_size,strides,padding,activation, and input_shape.'
