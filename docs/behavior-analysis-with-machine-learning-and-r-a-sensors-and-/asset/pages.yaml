    # 8.1 Introduction to Artificial Neural Networks


    Artificial neural networks (ANNs) are mathematical models inspired by the brain.
    Here, I would like to emphasize the word inspired because ANNs do not model how
    a biological brain actually works. In fact, there is little knowledge about how
    the brain works. ANNs are composed of units (also called neurons or nodes) and
    connections between units. Each unit can receive inputs from other units. These
    inputs are processed inside the unit and produce an output. Typically, units are
    arranged into layers (as we will see later) and connections between units have
    an associated weight. These weights are learned during training and they are the
    core elements that make a network behave in a certain way.


    > For the rest of the chapter, I will mostly use the term units to refer to neurons/nodes.
    From time to time, I will use the term network to refer to artificial neural networks.


    Before going into details of how multi-layer ANNs work, let''s start with a very
    simple network consisting of a single unit. Even though this network only has
    one node, it is already composed of several interesting elements which are the
    base of more complex networks. First, it has n input variables $x_1 \dots x_n$
    which are real numbers. Second, the unit has a n weights $w_1 \dots w_n$ associated
    with each input. These weights can take real numbers as values. Finally, there
    is an output $y$ which is binary (it can take two values: 1 or 0).


    > This simple neural network consisting of one unit with a binary output is called
    a perceptron and was proposed by Rosenblatt (1958).


    ![](img/91c149cc24c3e5af2971580c9dda9d8b_242_0.png)


    Figure 8.1: A neural network composed of a single unit (perceptron).'
  merge: -1
