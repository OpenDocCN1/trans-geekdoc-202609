- pgno: 110
  md: '# # Chapter 3


    # ## Predicting Behavior with Ensemble

    Learning


    In the previous chapters, we have been building single models, either for classification
    or regression. With **ensemble learning**, the idea is to train several models
    and combine their results to increase the performance. Usually, ensemble methods
    outperform single models. In the context of *ensemble learning*, the individual
    models whose results are to be combined are known as **base learners**. Base learners
    can be of the same type (homogenous) or of different types (heterogeneous). Examples
    of ensemble methods are **Bagging**, **Random Forest**, and **Stacked Generalization**.
    In the following sections, the three of them will be described and explain applications
    in behavior analysis will be presented as.


    # ### 3.1 Bagging


    Bagging stands for “bootstrap aggregating” and is an ensemble learning method
    proposed by Breiman (1996). Ummm, *Bootstrap, aggregating?* Let’s start with the
    *aggregating* part. As the name implies, this method is based on training several
    *base learners* (e.g., decision trees) and combining their outputs to produce
    a single final. One way to combine the results is by taking the majority vote
    for classification tasks or the average for regression. In an ideal case, we would
    have enough data to train each *base learner* with an independent train set. However,
    in practice we may have only a single set of limited size. Training several *base
    learners* with the same train set is equivalent to having a single learner, provided
    that the training procedure of the base learners is deterministic. Even if the
    training procedure is not deterministic, the resulting models could be very similar.
    What we would like to have accurate base learners but at the same time they should
    be different. Then, how can we train those base learners? Well, this is where
    the *bootstrap* part comes into play.'
  merge: -1
  img_proc: true
- pgno: 111
  md: '# CHAPTER 3. PREDICTING BEHAVIOR WITH ENSEMBLE LEARNING


    99


    train set


    ![](img/91c149cc24c3e5af2971580c9dda9d8b_111_0.png)


    Figure 3.1: Bagging example.


    Bootstrapping means generating new train sets by sampling instances with replacement
    from the original train set. If the original train set has $N$ instances, the
    method selects $N$ instances at random to produce a new train set. With replacement
    means that repeated instances are allowed. This has the effect of generating a
    new train set of size $N$ by removing some instances and duplicating other instances.
    By using this method, $n$ different train sets can be generated and used to train
    $n$ different learners.


    It has been showing that more diverse base learners increases performance. One
    way of generating diverse learners is by using different train sets as just described.
    In his original work, Breiman (1996) used decision trees as base learners. Decision
    trees are considered to be very unstable. This means that small changes in the
    train set produce very different trees—this is a good thing for bagging! Most
    of the time, the aggregated predictions produce better than the best individual
    learner from the ensemble.


    Figure 3.1 shows bootstrapping in action. The train set is sampled with replacement
    3 times. The numbers represent indices to arbitrary train instances. Here, we
    can see that in the first sample, the instance number 5 is missing but instead,
    instance 2 is duplicated. All samples have five elements. Then, each sample is
    used to train individual decision trees.


    One of the disadvantages of ensemble methods is their higher computational time
    both during'
