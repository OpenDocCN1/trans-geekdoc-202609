- pgno: 90
  md: 'Monotonicity. This constraint allows ‘time to flow’ only from left to right.
    That is, we can not go back in time.


    ```

    $\phi_x(k+1) \geq \phi_x(k)$

    $\phi_y(k+1) \geq \phi_y(k)$

    ```


    Local constraints. For example, allow jumps of at most 1 step.


    ```

    $\phi_x(k+1) - \phi_x(k) \leq 1$\n$\phi_y(k+1) - \phi_y(k) \leq 1$

    ```


    Also, it is possible to apply global constraints, other local constraints, and
    apply different weights to slopes the three described above are the most common.
    For a comprehensive list of constraints, please see (Rabiner and Juang, 1993).
    Now let’s get back to our example and go through the steps to compute the dissimilarity
    and warping functions between our query ($Q$) and reference ($R$ ) sequences:


    ```

    $Q = (2, 2, 2, 4, 4, 3)$

    nR = (2, 2, 3, 3, 2)$

    ```


    The first step is to compute a local cost matrix. This is just a matrix that contains
    the distance between every pair of points between the two sequences. For this
    example, we will use the Manhattan distance. Since our sequences are 1-dimensional
    this distance can be computed as the absolute difference $|x_i - y_j|$. Figure
    2.19 shows the resulting cost matrix.


    For example, position (1, 1) = 0 (row,column) because the first element of $Q$
    is 2 and the first element of $R$ is also 2, thus, $[2-2] = 0$. The rest of the
    matrix is filled in the same way. In dynamic programming, partial results are
    computed and stored in a table. Figure 2.20 shows the final dynamic programming
    table computed from the local cost matrix. Initially, this table is empty. We
    start to fill it from bottom left at position (1, 1). From the local cost matrix,
    the cost at position (1,1) is 0 so the cost at that position in the dynamic programming
    table is 0. Then we can start filling the contiguous cells. The only direction
    from which we can arrive at position (1,2) is from the west. The cost at position
    (1, 2) from'
