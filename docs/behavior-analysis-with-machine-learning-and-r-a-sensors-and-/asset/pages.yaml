    # 5.4.2 SMOTE


    The Synthetic Minority Oversampling Technique (SMOTE) (Chawla et al., 2002) can
    also be used to generate more data points from the minority class. One of the
    limitations of random oversampling is that it creates duplicates. This has the
    effect of having fixed boundaries and the classifiers can overspecialize. To avoid
    this, SMOTE creates entirely new data points.


    SMOTE operates on the feature space (the predictor variables). To generate a new
    point, take the difference between a given point $a$ (taken from the minority
    class) and one of its randomly selected neighbors $b$. The difference is multiplied
    by a random number between 0 and 1 and added to $a$. This has the effect of selecting
    a point along the line $a$ and $b$. Figure 5.10 illustrates the generating of
    a new point in two dimensions.


    The number of nearest neighbors $k$ is a parameter defined by the user. In their
    original work (Chawla et al., 2002), the authors set $k=5$. Depending on how many
    new samples need to be generated, $k''$ neighbors are randomly selected from the
    original $k$ nearest neighbors. For example, if 200% oversampling is needed, $k''=2$
    neighbors are selected at random out of the $k=5$ and one data point is generated
    with each of them. This is performed for each data point in the minority class.


    An implementation of SMOTE is also provided in `auxiliary_functions/R`. An example
    of how to apply it can be found in `preprocessing.R` in the corresponding directory
    of this chapter''s code. The `smote.class(completeDf, targetClass, N)` function
    has several arguments. The first one is the data frame that contains the minority
    and majority class, that is, the complete dataset. The second argument is the
    minority class label. The third argument $N$ is the percent of sente and the last
    $(k)$ is the number of nearest neighbors to consider.'
  merge: -1
  img_proc: true
