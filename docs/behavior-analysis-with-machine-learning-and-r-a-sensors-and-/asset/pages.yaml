  md: '# APPENDIX B. DATASETS


    # B.2 DEPREJSON


    Included: Yes.


    This dataset contains motor activity recordings of 23 unipolar and bipolar depressed
    patients and 32 healthy controls. Motor activity was monitored with an actigraph
    watch worn at the right wrist (Actwatch, Cambridge Neurotechnology Ltd, England,
    model AW4). The sampling frequency was 32 Hz. The device uses the inertial sensors
    data to compute an activity count every minute which is stored as an integer value
    in the memory unit of the actigraph watch. The number of counts is proportional
    to the intensity of the movement. The dataset also contains some additional information
    about the patients and the control group. For more details see Garcia-Ceja et
    al. (2018b).


    # B.3 ELECTROMYOGRAPHY


    Included: Yes.


    This dataset was made available by Kirill Yashuk. The data was collected using
    an armband device with 8 sensors placed on the skin surface that measure little
    electrical activity from the right forearm at a sampling rate of 200 Hz. A video
    of the device can be seen here: https://youtu.be/lu5-G6DPtkk.


    The data contains 4 gestures: 0-rock, 1-scissors, 2-paper, 3-OK, and has 65 columns.
    The last column is the class label from 0 to 3. Each gesture was recorded 6 times
    for 20 seconds. The first 64 columns are electrical measurements. 8 consecutive
    readings for each of the 8 sensors. For more details, please see Yashuk (2019).


    # B.4 FISH TRAJECTORIES


    Included: Yes.


    The Fish4knowledge (Beyan and Fisher, 2013) project made this database available.
    It contains 3102 trajectories belonging to the Dascyllus reticulatus fish observed
    in the Taiwanese coral reef. Each trajectory is labeled as ''normal'' or ''abnormal''.
    The trajectories were extracted from underwater video. Bounding box''s coordinates
    over time were extracted from the video. Data does not contain video images but
    the final coordinates. The compilation in this book also includes a .csv file
    with extracted features from the trajectories.


    > http://groups.inf.ed.ac.uk/f4/'
