  md: '![](img/91c149cc24c3e5af2971580c9dda9d8b_340_0.png)


    Figure 10.8: The original trajectory (circles) and after filling the gaps with
    linear interpolation (crosses).


    The number of resulting speeds and accelerations are $n-1$ and $n-2$ respectively
    where $n$ is the number of time steps in the trajectory. When training an Isolation
    Forest, all feature vectors need to be of the same length however, the trajectories
    in the database have different number of time steps. In order to have fixed-length
    feature vectors we will compute the *mean, standard deviation, min,* and *max*
    from both, the speeds and accelerations. Thus, we will end up having 8 features
    per trajectory. Finally we assemble the data frame along the trajectory ID and
    the label (''normal'' or ''abnormal'').


    ```

    f.meanSpeed <- mean(derivs$speed)

    f.sdSpeed <- sd(derivs$speed)

    f.minSpeed <- min(derivs$speed)

    f.maxSpeed <- max(derivs$speed)

    f.meanAcc <- mean(derivs$acceleration)

    f.sdAcc <- sd(derivs$acceleration)

    ```'
