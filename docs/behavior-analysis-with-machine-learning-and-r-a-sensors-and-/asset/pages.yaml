    From Figure 10.7 we can see that there are big time gaps between points. This
    is because some time frames are missing. If we print the first rows of the trajectory
    and look at the time we can see that for example, time steps 4, 5, 6 are missing.


    ```

    head(tmp.trj)

    # x y time displacementTime polar displacement

    # 1 187.0 86.0 0 187.86+i 0.0+0.0i

    # 2 183.5 86.0 1 183.5+85.0 -3.5-1.0i

    # 3 181.5 85.0 2 181.5+85.0 -2.0+0.0i

    # 4 176.0 85.0 3 176.0+85.0 -5.5+0.0i

    # 5 144.5 75.5 7 144.5+75.5i -31.5-9.5i

    ```


    From continuing, it would be a good idea to try to fill those gaps. The function
    TrajResampleTime() does exactly that by applying linear interpolation along the
    trajectory.


    ```

    resampled <- TrajResampleTime(tmp.trj, 1)

    ```


    If we plot the resampled trajectory we will see how the missing points were filled.
    Now we are almost ready to start detecting anomalies. Remember that Isolation
    Trees work with features by making partitions. Thus, we need to convert the trajectories
    into a feature vector representation. To do that, we extract features from the
    trajectories based on speed and acceleration. The TrajDerivatives() function computes
    the speed and linear acceleration between pairs of trajectory points.


    ```

    derivs <- TrajDerivatives(resampled)


    # Print first speeds.

    head(deriv$speed)

    # [1] 3.640055 2.000000 5.500000 8.225342 8.225342 8.225342


    # Print linear accelerations.

    head(deriv$acceleration)

    # [1] -1.640055 3.500000 2.725342 0.000000 0.000000 0.000000

    ```'
