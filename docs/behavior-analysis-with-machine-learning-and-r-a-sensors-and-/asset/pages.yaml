    ```\n\n```\nrecalls <- c(recalls, metrics[\"Recall\"])\n```\n\n```\nprecisions\
    \ <- c(precisions, metrics[\"Precision\"])\n} # end of users iteration\n```\n\n\
    We iterated through each user and performed the leave-one-out-validation for each,\
