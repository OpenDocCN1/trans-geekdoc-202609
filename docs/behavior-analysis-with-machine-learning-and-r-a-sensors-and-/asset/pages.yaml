    \ performance across all users.\n\n```\n# Print average performance across users.\n\
    \nmean(accuracies)\n#> [1] 0.943114\nmean(recalls)\n#> [1] 0.9425154\nmean(precisions)\n\
    #> [1] 0.9500772\n```\n\nThis time, the average accuracy was 94.3% which is higher\
    \ than the accuracy achieved by the mixed model and the user-independent model.\
    \ The average recall and precision were also higher compared to the other types\
