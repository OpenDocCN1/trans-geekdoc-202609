    +   **Data cleaning.** After the data exploration phase here, we can remove the
    outliers, remove noisy data points, remove variables that are not needed for further
    computation, and so on.


    +   **Preprocessing.** Predictive models expect the data to be in some structured
    format and satisfying some constraints. For example, several models are sensitive
    to class imbalances, i.e., the presence of many instances with a given class but
    a small number of instances with other classes. In fraud detection, most of the
    instances will belong to the normal class but just a small proportion will be
    of type ‘illegal transaction’. In this case, we may to do some preprocessing to
    balance the dataset. Some models are also sensitive to feature differences. For
    example, a variable *weight* would be in kilograms but another variable *height*
    in centimeters. By training a predictive model, the data needs to be prepared
    in such a way that the models can get the most out of it. Chapter 5 will present
    some common preprocessing steps.


    +   **Training and evaluation.** Once the data is preprocessed, we can then proceed
    to train the models. Furthermore, we also needs to evaluate their generalization
    performance on unseen instances. The purpose of this phase is to try, and fine-tune
    models to find the one that performs the best. Later in this chapter, some model
    evaluation techniques will be introduced.


    +   **Interpretation and presentation of results.** The purpose of this phase
    is to analyze and interpret the models’ results. We can use performance metrics
    derived from the evaluation phase to make informed decisions. We also want to
    understand how the models work internally and how the predictions are derived.


