  md: '# Chapter 4


    # Exploring and Visualizing Behavioral Data


    ```

    EDA.R, iterative_mds.R

    ```


    Exploratory data analysis (EDA) refers to the process of understanding your data.
    There are several available methods and tools for doing so, including summary
    statistics and visualizations. In this chapter, I will cover some of them. As
    mentioned in section 1.4, data exploration is one of the first steps of the data
    analysis pipeline. This step is important because it will help in the decision
    process during the next steps, for example, the selection of pre-processing tasks
    and predictive methods. Even though there already exist several EDA techniques,
    are not constrained on them but you can always apply any means that will allow
    you to better understand your data and gain new insights.


    # 4.1 Talking with Field Experts


    Sometimes we will be involved in the whole data analysis process starting with
    the idea, defining research questions, hypotheses, conducting the data collection,
    and so on. In those cases, it is easier to understand the initial structure of
    the data since you might had been the one responsible for designing the data collection
    protocol.


    Unfortunately (fortunately for some), it is often the case that we are already
    given a dataset. It may have some documentation or note. In those cases, it becomes
    important to talk with the field experts that designed the study and the data
    collection protocol to understand what was the purpose and motivation of each
    piece of data. Again, it is often'
  merge: -1
  img_proc: true
- pgno: 132
  md: '# CHAPTER 4. EXPLORING AND VISUALIZING BEHAVIORAL DATA 120


    not easy to be directly in touch with the people who conducted the initial study.
    One of the reasons may be that you found the dataset online and the project is
    already over. In those cases, you can try to contact the authors. I have done
    that several times and they were very responsive. It is also a good idea to find
    experts in the field even if they were not involved in the project. This will
    allow you to understand things from their perspective and possibly to explain
    patterns/values that you may find in the process.


    # 4.2 Summary Statistics


    Now that you understand how the data was collected and what is the meaning of
    each variable, it is time to find out how the actual data looks like. It is always
    a good idea to start looking at some summary statistics. This provides some general
    insights about the data and will help you in deciding future pre-processing steps.
    In R, an easy way to do this is with the summary() function. The following code
    reads the SMARTPHONE ACTIVITIES dataset and to limited space, only prints a summary
    of the first 5 columns, column 33, 35 and the last one (the class).


    ```

    # Read activities dataset.

    dataset <- read.csv(file.path(datasets_path, stringsAsFactors = T))

    # Print first 5 columns,

    # column 33, 35 and the last one (the class).

    summary(dataset[,c(1,5,33,35,ncol(dataset))))

    ```


