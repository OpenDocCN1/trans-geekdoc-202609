    has I in the first row and 3x3 = 9 parameters. This makes CNNs so efficient since
    the same kernel is applied to the entire image. This is known as ''parameter sharing''.
    Our kernel has Is at the top and zeroes elsewhere so it seems this kernel learned
    to detect horizontal lines. If we look at the final output image we see that the
    horizontal lines were emphasized by this kernel. This would be a good kernel to
    differentiate between 7s and 0s, for example. 0s does not have long horizontal
    lines. But maybe it will have difficulties discriminating between 7s and 5s since
    both have horizontal lines at the top.


    In this example, only 1 kernel was used in practice, but you may want to have
    more kernels, each in charge of identifying the best features for the given problem.
    For example, another kernel could learn to identify diagonal which would be useful
    to differentiate between 7s and 5s. The number of kernels per layer is a hyperparameter.
    In the previous example, we could have defined to have 4 kernels instead of one.
    In that case, the output of that layer would have been 4 feature maps of size
    3x3 each (Figure 8.28).


    What would be the output of a convolution with 4 kernels of size 3x3 if it is
    applied to an RGB color image of size 5x5x3? In that case, the output will be
    the same (4 feature maps of size 3x3) as if image were grayscale (5x5x1). Remember
    that the number of output feature maps equals the depth of the image. In this
    case, each kernel will have a depth of 3. Each depth is applied independently
    of the corresponding R, G, and B channels. Thus, each kernel has 3x27 parameters
    that need to be learned. After applying each kernel to each image channel (in
    this example, 3 channels), the results of each channel are added and this is why
    we end up with one feature map per kernel. The following course website has a
    nice interactive animation of how convolutions are applied to an image with 3
    channels: https://cs231n.github.io/convolutional-networks/. In the next section
