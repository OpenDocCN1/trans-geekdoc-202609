- pgno: 302
  md: '# Chapter 9


    # Multi-User Validation


    Every person is different. We all have different physical and mental characteristics.
    Every person reacts in different ways to the same stimulus and conducts physical
    and motor activities in particular ways. As we have seen, predictive models rely
    on the training data; and for user-oriented applications, this data encodes their
    behaviors. When building predictive models, we want them to generalization capability
    comes at a price, especially in multi-user settings. A multi-user setting is one
    in which the results depend heavily on the target user, that is, the user on which
    the predictions are made. Take, for example, a gesture recognition system. At
    inference time, a specific person (the target user) performs a gesture and the
    system should recognize it. The input data comes directly from the user. On the
    other hand, a non-multi-user system does not depend on a particular person. A
    classifier that labels fruits on images or a regression model that predicts house
    prices does not depend directly on a particular person.


    Some time I had to build an activity recognition system based on inertial data
    from a wrist band. So I collected the data, trained the models, and evaluated
    them. The performance results were good. However, it turned out that the system
    was tested on a new sample it failed. The reason? The training data was collected
    from people within a particular age group (young) but the target market of the
    product was for much older people. Older people tend to walk more slowly, the
    system predicting ''no movement'' in fact, the person was walking at a very slow
    pace. This is an extreme example but even within the same age group, there are
    going to be differences between users (inter-user variance). Or even the same
    user will evolve over time and change her/his behaviors (intra-user variance).


    So, how can we evaluate multi-user systems to reduce the unexpected effects once
    the system is deployed? Most of the time there''s going to be surprises when testing
    a system on new users we need to be aware of that. But in this chapter, I will
    present 3 types of models'
  merge: -1
  img_proc: true
- pgno: 303
  md: 'CHAPTER 9. MULTI-USER VALIDATION


    that will help you to reduce uncertainty to some extent you will have a better
    idea of how the system will behave when tested on more realistic conditions. The
    models are: **mixed models, user-independent models, and user-dependent models.**
    We will see how to train each type of model using a database with actions recorded
    with a motion capture system. After that, I will also show you how to build **adaptive
    models** that are tuned with the objective of increasing their performance for
    a particular user.


    # 9.1 Mixed Models


    Mixed models are trained and validated as usual without considering information
    about mappings between data points and users. Suppose we have a dataset as shown
    in Figure 9.1. The first column is the user id, the second column the label we
    want to predict and the last two columns are arbitrary features.


    With a mixed model we would remove the `userid` column and perform k-fold validation
    or hold-out validation as usual. In fact, this is what we have been doing so far.
    By doing so, some random data points will end up in the train set and others in
    the test set regardless of which data point was generated by user. The user rows
    are just *mixed*, thus the *mixed model*. This model assumes that the data was
    generated by a single user. One of the disadvantages of validating a system using
    a mixed model is that the performance results could be overestimated. By randomly
    splitting into train and test sets, some data points for a given user end up in
    each of the splits. At inference time, when showing a test sample belonging to
    a particular user to the model, it is likely that the training set of model included
    some data from that particular user. Thus, the model already knows a little about
    that user so we can expect an accurate prediction. However, this assumption not
    always holds true. If the model is to be used on a **new user** that the model
    has never seen before, then, it may not produce accurate predictions.


