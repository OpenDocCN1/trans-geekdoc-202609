    Figure 8.30: Output of summary().


    (4) is the number of feature maps equal to the number of kernels (filters=4).
    The number of parameters is 40 (last column). This is because there are 4 kernels
    with 3x3=9 parameters each, and there is one bias per kernel included by default:
    $4 \times 3 \times 3 \+ 4 = 40$.


    The output of MaxPooling2D is (None, 4, 4, 4). The height and width are 4 because
    the pool size was 2 and the stride was 2. This had the effect of reducing to half
    the height and width of the previous layer. Max pooling preserves the number of
    feature maps, the last number is 4 (the number of feature maps from previous layer).
    Max pooling does not have any learnable parameters since it applies a fixed operation
    every time.


    Before passing the downsampled feature maps to the next fully connected layer
    they need to be flattened into a 1-dimensional array. This is done with the layer_flatten()
    function and its output has a shape of (None, 64) which corresponds to the $4
    \times 4 \times 4 = 64$ features of the previous layer. The next fully connected
    layer has 32 units each with a connection with every one of the 64 input features.
    Each unit has a bias. Thus the number of parameters is $64 \times 32 + 32 = 2080$.


    Finally the output layer has $32 \times 2 + 2 = 66$ parameters. The entire network
    has 2, 186 parameters! Now, you can try to modify, the kernel size, the strides,
    the padding, and input shape and see how the output dimensions and the number
