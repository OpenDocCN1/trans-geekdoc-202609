  md: '# 8.9 Summary


    **Deep learning (DL)** consists of a set of different architectures and algorithms.
    As of now, it mainly focuses on artificial neural networks (ANNs). This chapter
    introduced two main types of DL models (ANNs and CNNs) and their application to
    behavior analysis.


    +   * Artificial neural networks (ANNs) are mathematical models inspired by the
    brain. That does not mean they work the same as the brain.

    * The **perceptron** is one of the simplest ANNs.

    * ANNs consist of an input layer, hidden layer(s) and an output layer.

    * Deep networks has many hidden layers.

    * **Gradient descent** can be used to learn the parameters of a network.

    * Overfitting is a recurring problem in ANNs. Some methods like **dropout** and
    **early stopping** can be used to reduce the effect of overfitting.

    * A convolutional neural network (CNN) is a type of ANN that can process N-dimensional
    arrays very efficiently. They are used mainly for computer vision tasks.

    * CNNs consist of **convolution** and **pooling** layers.'
  merge: -1
