    If we explore the data frame’s values, for example with the RStudio viewer (Figure
    5.4), two things can be noted. First, for the compass values, there is a missing
    value for each present value. Thus, it looks like 50% of compass values are missing.
    For *pressure*, it seems that there are 7 missing values for each available value.


    So, what could be the root of those missing values? Remember that at the beginning
    of this chapter it was mentioned that **one of the sources of variation is sampling
    rate.** If we look at the set documentation all sensors have a sampling rate of
    200 Hz except for the compass and the pressure sensor. The compass has a sampling
    rate of 100 Hz. That is half compared to the other sensors! This explains why
    50% of the rows are missing. Similarly, the pressure sensor has a sampling rate
    of 25 Hz. By visualizing and inspecting the missing data, we have just found out
    that the missing values are not caused by random noise or sensor failures but
    because the sensors are not as fast as the others!


    Now that we know there are missing values we need to decide what to do with them.
    The following subsection lists some some ways to deal with missing values.


    # # 5.1.1 Imputation


    Imputation is the process of filling in missing values. One of the reasons for
    imputing missing values is that some predictive models cannot deal with missing
    data. Another reason is that it may help in increasing the predictions’ performance,
    for example, if we are trying to predict the sheep behavior from a discrete set
    of categories based on the inertial data. There are'
