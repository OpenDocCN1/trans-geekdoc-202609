  md: '# CHAPTER 7. ENCODING BEHAVIORAL DATA


    # 7.2 Timeseries


    A timeseries is a sequence of data points ordered in time. We have already worked
    with timeseries data in previous chapters (2) when classifying physical activities
    and hand gestures. Timeseries can be multi-dimensional. For example, typical inertial
    sensors capture motion forces in three axes. Timeseries analysis methods can be
    used to find underlying time-dependent patterns while timeseries forecasting methods
    aim to predict future data points based on historical data. Timeseries analysis
    is a very extensive topic and there are already several books that specialize
    on it. For example, the book “Forecasting: Principles and Practice” by Hydman
    and Athanasopoulos (2018) focuses on timeseries forecasting with R.


    In this book we use timeseries data collected from sensors in the context of behavior
    predictions using machine learning. We have already seen how classification models
    (like decision trees) can be trained with timeseries converted into feature vectors
    (section 2.3.1) or by using the raw timeseries data with Dynamic Time Warping
    (section 2.5.1).


    Advantages:


    +   - Many problems have this form and can be naturally modeled as timeseries.

    - Temporal information is preserved.

    - Easy to plot and visualize.


    Limitations:


    +   - Not all algorithms support timeseries of varying lengths so, one needs to
    truncate and/or do some type of padding.

    - Many timeseries are slower than the ones that work with feature vectors.

    - Timeseries can be very long, making computations very slow.


    # 7.3 Transactions


    Sometimes we want to represent our data as transactions, as we did in section
    6.3. Data represented as transactions are usually intended to be used by association
    rule mining algorithms (see section 6.3). As a minimum, a transaction has a unique
    identifier and a set of items. Items can be types of products, symptoms, ingredients,
    etc. A set of transactions is called a database. Figure 7.4 taken from chapter
    6 shows an example database with 10 transactions. In this example, items are sets
    of products from a supermarket.'
  merge: -1
  img_proc: true
