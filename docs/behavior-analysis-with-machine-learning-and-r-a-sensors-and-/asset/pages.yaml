    loss = ''categorical_crossentropy'',

    optimizer = optimizer_sgd(lr = 0.01)

    metrics = c("accuracy")

    )

    ```


    ```

    # Fit model.

    history <- model %% fit(

    trainX, trainY,

    epochs = 50,

    batch_size = 8,

    validation_split = 0.10,

    verbose = 1,

    view_metrics = TRUE

    )

    ```


    We are using a stochastic gradient descent optimizer with a learning rate of 0.01
    and crossentropy as the loss function. We can use 10% of the train set as the
