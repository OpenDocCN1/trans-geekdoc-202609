    ''jogging'' even if a particular user never does that. This can degrade the predictions''
    performance for that particular user and can be worse if that user performs other
    activities of the possible 6. A possible solution is to train different classifiers
    with different class subsets. If you know that some users go ''jogging'' then
    you train a classifier that excludes ''jogging'' and use that for set of users.
    The disadvantage of this is that there are many possible combinations so you need
    to train many models. Since several classifiers can generate prediction scores
    and/or probabilities per class, another solution would be to train a single model
    with all classes and predict the most probable class excluding that are not part
    of a particular user.


    +   * Users can use unique classes. For example, suppose there is a new user that
    has an activity labeled as *Eating* which no one else, and thus, it was not included
    during training. In this situation, the classifier will never predict *Eating*
    since it was not trained for that activity. One solution could be to add the new
    user''s data with the new labels and retain the model. But if not too many users
    have the activity *Eating* then, in the worst case, they will die of starvation.
    In a less severe case, the overall system performance degrades because as the
    number of classes increases it becomes more difficult to find separation boundaries
    between categories, thus, the models become less accurate. Another possible solution
    is to build *user-dependent models for each user*. These, and other types of models
    in *multi-user settings* will be covered in chapter 9.'
