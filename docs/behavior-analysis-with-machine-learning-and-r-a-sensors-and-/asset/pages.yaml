    0: don''t go

    1: go


    Figure 8.2: Perceptron to decide whether or not to go to the movies based on two
    input variables.


    This single unit also known as *perceptron* is capable of making binary decisions
    based on the input and the weights. To get the final decision $y''$ the inputs
    are multiplied by their corresponding weights and the results are summed. Formally:
    If the sum is greater than a given threshold, then the output is 1 and 0 otherwise.


    ```

    $y'' = \begin{cases} 1 & \text{if } \sum_i w_ix_i > t, \ 0 & \text{if } \sum_i
    w_ix_i \le t \end{cases} \quad (8.1)$

    ```


    We can use a perceptron to make important decisions in life. For example, suppose
    you need to decide whether or not to go to the movies. Assume this decision is
    based on two pieces of information:


    +   1. You have money to pay the entrance (or not) and,

    2. it is a horror movie (or not).


    There are two additional assumptions as well:


    +   1. The movie theater only projects 1 film.

    2. You don''t like horror movies.


    This decision-making process can be modeled with the perceptron of Figure 8.2.
    This perceptron has two binary input variables: *money* and *horror*. Each variable
    has an associated weight. Suppose there is a decision threshold of $t=3$. Finally,
    there is a binary output: 1 means you should go to the movies and 0 indicates
    that you should not go.


    > In this example, the weights (5 and -3) and the threshold $t=3$ were already
    provided. The weights and the threshold are called the *parameters* of the network.
    Later, we will see how the parameters can be learned automatically from data.'
  merge: -1
