    In the first iteration, the kernel is aligned with the upper left corner of the
    original image. An element-wise multiplication is performed and the results are
    summed. The operation is shown at the top of the figure. In the first iteration,
    the result was 3 and it is set at the corresponding position of the final convolved
    image (feature map). In the next iteration, the kernel is moved one position to
    the right and the final result is 3 which is set in the next position of the convolved
    image. The process continues until the kernel reaches the bottom right corner.
    At the last iteration (9), the result is 1.


    Now, the convolved image (feature map) represents the features extracted by this
    particular kernel. Note, that the feature map is a 3x3 matrix which is smaller
    than the original image. It is also possible to force the feature map to have
    the same size as the original image by padding it with zeros.


