    Imagine that now you want to estimate what would be the performance of the model
    in a situation where a completely new user is shown to the model, that is the
    model does not know anything about this user. We can model these situations using
    a user-independent model which is the topic of the next section.


    # 9.2 User-Independent Models


    The user-independent model allows us to estimate the performance of a system on
    new users. That, the model does not contain any information about the target user.
    This resembles a scenario when the user wants to use a service out-of-the-box
    without having to go through a calibration process or having to collect data.
    To build a user-independent model we just need to make sure that the training
    data does not contain any information about the users on the test set. We can
    achieve this by splitting the dataset into two disjoint groups of users based
    on their ids. For example, assign 70% of the users to the train set and remaining
    to the test set. If the dataset is small, one way to optimize it is by performing
    leave-one-user-out validation: if the dataset has n users, then, n iterations
    are performed. In each iteration, one user is selected as the test set and the
    remaining ones are used as the train set. Figure 9.4 illustrates leave-one-user-out
    validation for the first 2 iterations of the procedure.


    By doing this, we guarantee that the model knows anything about the target user.
    To implement this leave-one-user-out validation method in our skeleton recognition
    case, let''s first define some initialization variables. These include the unique
    users variable which stores the ids of all users in the database. As before, we
    will compute the accuracy, recall, and precision so we define variables to store
    these metrics for each user.'
