    # 4.8 Multidimensional Scaling (MDS)


    In situations, our data is compiled of several variables. If the number of variables
    is more than 3 (3-dimensional data), it becomes difficult to plot the relationships
    between data points. Take, for example, the HOME TASKS dataset which has 27 predictor
    variables from accelerometer and sound. One thing that we may want to do is to
    visually inspect'
  merge: -1
  img_proc: true
- pgno: 146
  md: '# CHAPTER 4. EXPLORING AND VISUALIZING BEHAVIORAL DATA 134


    the data points and check whether or not points from the same class are closer
    to points from different classes. This can give you an idea of the difficulty
    of the problem at hand. If points of the same class are very close and grouped
    together, it is likely that a classification model will not hold separating the
    data points. But how do we plot such relationships with high dimensional data?
    One method is using multidimensional scaling (MDS) which consists of a set of
    techniques aimed at reducing the dimensionality of data so it can be visualized
    in 2D or 3D. The objective is to plot the data that the original distances between
    pairs of points are preserved in a given lower dimension d.


    There exist several MDS methods but most of them take a distance matrix as input
    (for example, Euclidean distance). In R, generating a distance matrix from a set
    of points is easy. As an example, let''s generate some data points.


    ```

    # Generate 3 2 random points.

    x <- runif(3)

    y <- runif(3)

    d <- data.frame(x,y)

    labels <- c("a","b","c")

    print(df)

    #      x          y

    # 1 0.4457900 0.5978606

    # 2 0.4740106 0.5013938

    # 3 0.8890085 0.4109234

    ```


    The dist() function can be used to compute the distance matrix. By default, this
    function computes the Euclidean distance between rows:


    ```

    dist(df)

    #      1          2

    # 2 0.0999863

    # 3 0.48102824 0.42486143

    ```


    The output is the Euclidean distance between the pairs of rows (1, 2), (1, 3)
    and (2,3).

    One way to obtain cartesian coordinates in a d dimensional space for n points
    from their distance matrix D is to use an iterative algorithm (Borg et al., 2012).
    Such an algorithm consists of the following general steps:


    +   1. Initialize n data points with random coordinates C of dimension d.'
  merge: -1
  img_proc: true
- pgno: 147
  md: '# CHAPTER 4. EXPLORING AND VISUALIZING BEHAVIORAL DATA


    # Iteration 0


    ![](img/91c149cc24c3e5af2971580c9dda9d8b_147_0.png)


    Figure 4.7: MDS initial coordinates.


    +   1. Compute a distance matrix $D''$ from $C$.

    2. Move the coordinates $C$ such that the distances of $D''$ get closer to the
    original ones in $D$.

    3. Repeat from step 2 until the difference between $D''$ and $D$ cannot be reduced
    any further or some predefined maximum number of iterations.


    The script `iterativeMDS.R` implements this algorithm (`iterativeMDS()` function)
    which is based on the implementation from (Segaran, 2007). Its first argument
    $D$ is a distance matrix, the second argument `maxit` is the total number of iterations
    and the last argument `lr` controls how fast the points are moved in each iteration.
    The script also shows how to apply the method to the `eurodist` dataset which
    consists of distances between European cities. Figure 4.7 shows the initial coordinates
    of the cities. Figure 4.8 shows the result after 30 iterations. Finally, Figure
    4.9 shows the final result. By only knowing the distance matrix, the algorithm
    was able to find a visual mapping that closely resembles the real positions.


    > Before continuing, I would like to apologize because the previous example (cities'')
