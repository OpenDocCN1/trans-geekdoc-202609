    For numerical variables, the output includes some summary statistics like the
    min, max, etc. For factor variables, the output is different. It displays the
    unique values with their respective counts. If there are more than six unique
    values, the rest is omitted. For example, the class variable (the last one) has
    528 instances with the value ‘Downstairs’. By looking at the min and max values
    of the numerical variables, we can see that those are not the same for all variables.
    For some variables, their maximum value is 1, for others, it is less than 1 and
    for others, it is greater than 1. It seems that the variables are not in the same
    scale. This is important because some algorithms are sensitive to different scales.
    In chapters 2 and 3 we mainly used decision tree-based algorithms which are not
    sensitive to different scales, but some others like neural networks. In chapter
    5, a method to transform variables into the same scale will be introduced.


    ![](img/91c149cc24c3e5af2971580c9dda9d8b_133_0.png)


    > It is a good practice to check the min and max values of all variables to see
    if they have different ranges since some algorithms are sensitive to this.


    The output of the summary() function also shows some strange things. The statistics
    of variable XAVG are all 0s. Some other variables like ZAVG were encoded as characters.
    Seems that the ‘?’ symbol is appended to the numbers. In summary, the summary()
    function (I know, too many summaries in this sentence), allowed us to spot some
    errors in the dataset. What we do next with that information, will depend on the
    domain and application.


    # 4.3 Class Distributions


    When it comes to behavior sensing, many of the problems are modeled as classification
    problems. This means that there are different possible categories. It is often
    a good idea to plot the class counts (class distribution). The following code
    shows how to do that for the SMARTPHONE ACTIVITIES dataset. First, the table()
    method is used to get the actual class counts. Then, the plot is generated with
    ggplot.'
