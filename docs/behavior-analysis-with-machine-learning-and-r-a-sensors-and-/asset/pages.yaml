    It is worth noting that perceptrons have two major limitations:


    +   1. The output is binary.

    2. Perceptrons are linear functions.


    The first limitation imposes some restrictions on its applicability. For example,
    a perceptron cannot be used to predict real-valued outputs, which is a fundamental
    aspect for regression problems. The second limitation makes the perceptron only
    capable of solving linear problems. Figure 8.4 graphically shows this limitation.
    In the first case, the outputs of the OR logical operator can be classified (separated)
    using a line. On the other hand, it is not possible to classify the output of
