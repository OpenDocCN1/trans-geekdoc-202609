  md: '# CHAPTER 6. DISCOVERING BEHAVIORS WITH UNSUPERVISED LEARNING 197


    In this section, we showed how interesting rules are extracted from a crimes database.
    Several preprocessing steps were required to transform the tabular data into transactional
    data. This example demonstrated how the same data can be represented in different
    ways (tabular and transactional). The next chapter will cover more details about
    how data can be transformed into different representations suitable for different
    types of learning algorithms.


    # 6.4 Summary


    One of the types of machine learning is unsupervised learning in which there are
    no labels. This chapter introduced some unsupervised methods such as clustering
    and association rules.


    +   * The objective of k-means clustering is to find groups of points such that
    points in the same group are similar and points from different groups are as dissimilar
    as possible.

    * The centroid of a group is calculated by taking the mean value of each feature.

    * In k-means, one needs to specify the number of groups $k$ before running the
    algorithm.

    * The Silhouette Index is a measure that tells us how well a set of points were
    clustered. This measure can be used to find the optimal number of groups $k$.

    * Association rules can find patterns in an unsupervised manner.

    * The A-priori algorithm is the most well-known method to find association rules.

    * Before using the A-priori algorithm, one needs to format the data as transactions.

    * A transaction is an event that involves a set of items.'
