    Included: Yes.


    The sound and accelerometer data were collected by 3 volunteers performing 7 different
    home activities: mop floor, sweep floor, type on computer keyboard, brush teeth,
    wash hands, chips and watch t.v. Each volunteer performed each activity for approximately
    3 min. If the activity lasted less than 3 min, another session was recorded until
    completing the 3 min. The data were collected with a wrist-band (Microsoft Band
    2) and a cellphone. The wrist-band was used to collect accelerometer data and
    was worn by the volunteers in their dominant hand. The accelerometer sensor returns
    values for the x, y, and axes the sampling rate was set to 31 Hz. The cellphone
    was used to record environmental sound with a sampling rate of 8000 Hz and it
    was placed on a table in the same room the user was performing the activity. To
    preserve privacy, the dataset does not contain the raw recordings but extracted
