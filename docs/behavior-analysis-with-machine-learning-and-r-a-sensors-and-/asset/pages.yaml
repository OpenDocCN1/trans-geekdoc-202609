    to top right and fills the corresponding values for M and D. The distance between
    elements i and j from the vector is computed. That distance is directly stored
    in D. To generate the RP we check if the distance is less or equal to the threshold.
    If that is the case the corresponding entry in M is set to 1. Finally, both matrices
    are returned by the function.


    Now, we can try rp() function on the HAND GESTURES dataset to convert one of the
    timeseries into a RP. We first read one of the gesture files. For example, the
    first gesture ''1'' from user 1. We only extract the acceleration from the x axis
    and store it in x.


