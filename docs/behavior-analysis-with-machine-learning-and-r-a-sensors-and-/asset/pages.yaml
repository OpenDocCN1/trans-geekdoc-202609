    The code to reproduce this example is in the script example_isolate_point.R. If
    we look at the highlighted normal instance we can see that it took 8 partitions
    to isolate it.


    Instead of generating a single tree, we can generate an ensemble of n trees and
    average their path lengths. Figure 10.2 shows the average path length from the
    previous normal and anomalous instances as the number of trees in the ensemble
    is increased.


    After 200 trees, the average path length of the normal instance starts to converge
    to 8.7 and the path length of the anomalous one converges to 3.1. This shows that
    anomalies have shorter path lengths on average.


    In practice, an Isolation Tree is recursively grown until a predefined maximum
    height is reached (more on this later), or when all instances are isolated, or
    all instances in a partition have the same values. Once all Isolation Trees in
    the ensemble (Isolation Forest) are generated, the instances can be sorted according
    to their average path length to the root. Then, instances with shorter path lengths
    can be marked as anomalies.


