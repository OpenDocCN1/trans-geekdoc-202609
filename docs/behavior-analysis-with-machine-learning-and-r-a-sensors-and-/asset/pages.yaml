  md: '# CHAPTER 8. PREDICTING BEHAVIOR WITH DEEP LEARNING


    classification tasks but can also be used for regression and time series data.
    If we wanted to perform image classification with a traditional neural network,
    first we would need to either build a feature vector by:


    +   1. extracting features from the image or,

    2. flattening the image pixels into a 1D array.


    The first solution requires a lot of image processing expertise and domain knowledge.
    Extracting features from images is not a trivial task and requires a lot of preprocessing
    to reduce noise, artifacts, segment the objects of interest, remove background,
    etc. Additionally, considerable effort is spent on feature engineering. The drawback
    of the second solution is that spatial information is lost, that is, the relationship
    between neighboring pixels. CNNs solve the two previous problems by automatically
    extracting features while preserving spatial information. As opposed to traditional
    networks, CNNs can take input n-dimensional images and process them efficiently.
    The main building blocks of a CNN are:


    +   1. Convolution layers

    2. Pooling operations

    3. Traditional fully connected layers


    Figure 8.26 shows a simple CNN and its basic components. First, the image goes
    through a convolution layer with 4 kernels (details about the convolution operation
    are described below). This layer is in charge of extracting features by applying
    the kernels on top of the image. The result of this operation is a convoluted
    image, also known as feature maps. The number of feature maps is equal to the
    number of kernels, in this case. Then, a pooling operation is applied on top of
    the feature maps. This operation reduces the size of the feature maps by downsampling
    them (details on below). The output of the pooling operation is a set of feature
    maps with reduced size. Here, the outputs are 4 reduced feature maps when the
    pooling operation is applied to each feature map independently of the others.
    Then, the feature maps are flattened into a one-dimensional array. Conceptually,
    this array represents all the features extracted from the previous steps. These
    features are then used as inputs to a neural network with its respective input,
    hidden, and output layers. *and underlined text means that parameter learning
    occurs in layer. For example, in the convolution layer, the parameters of the
    kernels need to be learned. On the other hand, the pooling operation does not
    require parameter learning since it is a fixed operation. Finally, the parameters
    of the neural network are learned too, including the hidden layers and the output
    layer.


    One can build more complex CNNs by stacking more convolution layers and pooling
    operations. By doing so, the level of abstraction increases. For example, the
