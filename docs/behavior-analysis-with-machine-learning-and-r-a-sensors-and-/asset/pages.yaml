    \ and large-scale patterns. Examples of small-scale patterns are diagonals, horizontal/vertical\
    \ lines, dots, etc. Large-scale patterns are called $typology$ and they depict\
    \ the global characteristics of the dynamic system$^5$.\n\n> $4$https://commons.wikimedia.org/wiki/File:Rp_examples740.gif\n\
