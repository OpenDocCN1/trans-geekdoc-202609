    # 6.2 The Silhouette Index


    As opposed to supervised learning, in unsupervised learning there no **ground
    truth** to validate the results. In clustering, one way to validate the resulting
    groups is to plot them and explore the clusters'' data points and look for similarities/or
    differences. But sometimes we also want to automate the process and have a quantitative
    measure to how how well the clustering algorithm grouped the points with the given
    set of parameters. If we had such a method we could do parameter optimization,
    for example, to find the best k. Well, there is something called the *silhouette
    index* (Rousseau, 1987) and it can be used to measure the correctness of the clusters.


    This index is computed for each data point and tells us how well they are clustered.
    The total silhouette index is the mean of all points'' indices and gives us an
    idea of how well the points were clustered overall. This index goes from -1 to
    1 and I''ll explain in a moment'
  merge: -1
  img_proc: true
- pgno: 193
  md: '# B


    # A


    ![](img/91c149cc24c3e5af2971580c9dda9d8b_193_0.png)


    how to interpret it but first let''s see how it is computed.


    To compute the silhouette index two are needed: the currently created groups and
    where the distances between points. Let:


    $a(i)$ = average dissimilarity (distance) of point $i$ to all other points in
    $A$, where $A$ is the cluster to $i$ has been assigned to (Figure 6.7).


    $d(i, C)$ = average dissimilarity between $i$ and all points in some cluster $C$.


    $b(i) = \min_{C \neq A} d(i, C)$. The cluster $B$ for which the minimum is attained
    is the neighbor of point $i$. (The second best choice for $i$).


    Thus, $s(i)$ (the silhouette index of point $i$) is obtained with the formula:


    ```

    $s(i) = \frac{b(i) - a(i)}{\max\{a(i), b(i)\}} \quad (6.3)$

    ```


    When $s(i)$ is close to 1 it means the *within* dissimilarity $a(i)$ is much smaller
    than the smallest *between* dissimilarity $b(i)$ thus, $i$ can be considered well-clustered.
    When $s(i)$ is close to 0 it is not clear whether $i$ belongs to $A$ or $B$. When
    $s(i)$ is close to $-1$, $a(i)$ is larger than $b(i)$ meaning that $i$ may have
    been misclassified. The total silhouette index $S$ is the average of all indices
    $s(i)$ of all points.


