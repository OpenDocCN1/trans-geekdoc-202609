- pgno: 282
  md: '# CHAPTER 8. PREDICTING BEHAVIOR WITH DEEP LEARNING 270


    In modern implementations, the scaling is done during training so at inference
    time there is no need to apply dropout. The predictions are done as usual. In
    Keras, the layer_dropout () can be used to add dropout to any layer. Its parameter
    rate is a float between 0 and 1 that specifies the fraction of units to drop.
    The following code snippet builds a neural network with 2 hidden layers. Then,
    dropout with a rate of 0.5 is applied to both of them.


    ```

    model <- keras_model_sequential()

    model %

    layer_dense(units = 256, activation = ''relu'', input_shape = 1000) %%

    layer_dropout(0.5) %%

    layer_dense(units = 128, activation = ''relu'') %%

    layer_dropout(0.5) %

    layer_dense(units = 2, activation = ''softmax'')

    ```


    It is very common to apply dropout networks in computer vision because the inputs
    are images or videos of input values (pixels) but the number of samples is often
    very limiting overfitting. In section 8.6 convolutional networks (CNNs) will be
    introduced which are suitable for computer vision problems. In the corresponding
    smile detection example (section 8.8), we will use dropout. When building CNNs,
    dropout is almost always added to the different layers.


    # 8.5 Fine-Tuning a Neural Network


    Deciding for a neural network''s architecture, no formula will tell you how many
    hidden layers or number of units each layer should have. There is also no formula
    for determining the batch size, the learning rate, type of activation function,
    for how many epochs we train the network, and so on. All those are called the
    hyperparameters of the network Hyperparameter tuning is a complex optimization
    problem and there is a lot of research going on tackles from different angles.
    My suggestion is to start with a simple architecture that has been used before
    to solve a similar problem and fine-tune it for your specific task. If you are
    not aware of any network that has been used for a similar problem, there are still
    some guidelines (described below) to get you started. Always keep in mind that
    those are only recommendations, you do not need to abide by them and you should
    feel free to try any configurations that deviate from those guidelines depending
    on your problem at hand.'
  merge: -1
  img_proc: true
- pgno: 283
  md: '# CHAPTER 8. PREDICTING BEHAVIOR WITH DEEP LEARNING


    Training neural networks is a time-consuming process, especially in deep networks.
    Training a network can take from several minutes to weeks. In many cases, cross-validation
    is not feasible. A common practice is to divide the data into train/validation/test
    sets. The training data is used to train a network with a given architecture and
    a set of hyperparameters. The validation set is used to evaluate the generalization
    performance of the network. Then, you can try different architectures and hyperparameters
    and evaluate the performance again and again with the validation set. Typically,
    the network''s performance is monitored during training epochs by plotting the
    loss and accuracy of the train and validation sets. Once you are happy with your
    model, you test its performance on the test set only once and that is the result
    that reported.


    Here are some starting guidelines, however, also take into consideration that
    those hyperparameters can be dependent on each other. So, if you modify a hyperparameter
    it may impact other(s).


    **Number of hidden layers.** Most of the time one or two hidden layers should
    be enough to solve not too complex problems. The advice is to start with one hidden
    layer and if one is not enough to capture the complexity of the problem, then
    add another layer and so on.


    **Number of units.** If a network has too few units it can underfit, that is,
    the model will be too simple to capture the underlying data patterns. Also, it
    will take more time to learn the parameters. Some guidelines mention that the
    number of units should be somewhere between the number of input features and the
    number of units in the output layer. Huang (2003) has proposed a formula for the
    two-hidden layer to calculate the number of units that are enough to learn $N$
    samples: $2\sqrt{m+2}$ where $m$ is the number of output units. But like this,
    there are many other similar formulas.


    My suggestion is to first gain some practice and intuition with simple problems
    and a good way to do this is using the TensorFlow playground (https://playground.tensorflow.org/).
    This is a web-based implementation of a neural network that you can fine-tune
    to solve a predefined set of classification and regression problems. For example,
    Figure 8.2 shows how I tried to solve the XOR problem with a neural network with
    1 hidden layer and 1 unit with a sigmoid activation function. After more than
    1,000 epochs the loss is still quite high (0.3). Try to add more neurons and/or
    hidden layers and see if you can solve the XOR problem with fewer epochs.


    **Batch size.** Batch sizes range between 4 and 512. Big batch sizes provide a
    better estimate of the gradient but are more computationally expensive. On the
    other hand, small batch sizes are faster to compute but will incur more noise
    in the gradient estimation requiring more


    > https://www.heatonourresearch.com/2017/06/01/hidden-layers.html'
  merge: -1
  img_proc: true
