    sample size:


    ![](img/91c149cc24c3e5af2971580c9dda9d8b_175_0.png)


    Figure 5.9: Shiny app with random oversampling example.


    Shiny apps are interactive web applications. This shiny app graphically demonstrates
    how random oversampling works. Figure 5.9 shows the shiny app. The user can move
    the slider to generate new data points. Please note that the boundaries do not
    change as the number of instances increases (or decreases). This is because the
    new points are just duplicates so they overlap with existing ones.


    > It is a common mistake to generate synthetic data on the entire dataset before
    splitting into train and test sets. This will cause your model to be heavily overfitted
    since several duplicate data points can end up in both sets. Create synthetic
    data only from the train set.


    Random oversampling is simple and effective in many cases. A potential problem
