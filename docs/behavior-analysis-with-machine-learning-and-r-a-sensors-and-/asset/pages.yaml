- pgno: 187
  md: '# CHAPTER 6. DISCOVERING BEHAVIORS WITH UNSUPERVISED LEARNING 175


    This is one of the most commonly used unsupervised methods due to its simplicity
    and efficacy. Its objective is to find groups of points such that points in the
    same group are similar and points from different groups are as dissimilar as possible.
    The number of groups k needs to be defined a priori. The method is based on computing
    distances to centroids. The centroid of a set of points is computed by taking
    the mean of each its features. The k-means algorithm is as follows:


    Generate k centroids at random.


    +   Repeat until no change or max iterations:

    - Assign each data point to the closest centroid.

    - Update centroids.


    Measure the distance between a data point and a centroid, the Euclidean distance
    is typically used but other distances can be used as well depending on the application.
    As an example let''s cluster user responses from the STUDENTS'' MENTAL HEALTH
    dataset. Demonstrate how k-means works, we choose only two variables to group
    into 3 disjoint groups. The variables are ToAS (total accumulated stress) and
    ToSC (total social connectedness). The code that implements the k-means algorithm
    can be found in the script kmeans_steps.R. The algorithm begins by selecting 3
    centroids at random. Figure 6.1 shows a scatterplot of ToAS and ToSC along with
    the random centroids.


    Next, at the first iteration, each point is assigned to the closest centroid.
    This is depicted in Figure 6.2 (top left). Then, the centroids are updated (moved)
    based on the new assignments. In the next iteration, the centroids are reassigned
    to the closest centroids and so on. Figure 6.2 shows the first 4 iterations of
    the algorithm.


    From iteration 1 to 2 the centroids moved considerably. After that, they began
    to stabilize. Formally, the algorithm tries to minimize the within cluster variation
    of all clusters. The cluster variation of a single cluster $C_k$ is defined as:


    > $W(C_k) = \sum_{x_i \in C_k} (x_i - \mu_k)^2 \quad (6.1)$


    where $x_i$ is a data point and $\mu_k$ is the centroid of cluster $C_k$. Thus,
    the total cluster variation TWCV is:


    > $TWCV = \sum_{i=1}^k W(C_i) \quad (6.2)$'
