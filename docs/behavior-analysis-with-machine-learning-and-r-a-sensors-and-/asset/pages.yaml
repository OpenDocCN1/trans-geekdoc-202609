    Be aware that when computing the cross-entropy with equation (8.17) order matters.
    The first element should be the predicted scores y'' and the second element should
    be the true-one encoded vector y. We don''t want to apply a log function to a
    vector with values of 0. Most of the time, the predicted scores y'' will be different
    from 0 that''s why we prefer to apply the log function to them. In the very rare
    case when the predicted scores have zeros, we can add a small number. In practice,
    this is taken care of by the backend (e.g., TensorFlow).


    We know how to compute the cross-entropy for each training instance. The total
