    | 1 | 2 - (0.05) + (2 + 3)(3 + 2 - 1.5) = **0.65** | (3 + 0.65 - 1.5)² = 0.2025
    |

    | 2 | 0.65 - (0.05) + (2 + 3)(3 + 0.65 - 1.5) = **0.51** | (3 + 0.51 - 1.5)² =
    0.0009 |

    | 3 | 0.51 - (0.05) + (2 + 3)(3 + 0.51 - 1.5) = **0.501** | (3 + 0.501 - 1.5)²
    = 0.000001 |


