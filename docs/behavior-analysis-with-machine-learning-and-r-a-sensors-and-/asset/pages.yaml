  md: '# CHAPTER 4. EXPLORING AND VISUALIZING BEHAVIORAL DATA


    but many fewer of other classes. For some applications this can be a problem.
    For example, in fraud detection, datasets have many legitimate transactions but
    just a few of illegal transactions. This will bias a classifier to be good at
    detecting legitimate transactions but what we are really interested in detecting
    the illegal transactions. This is something very common to find in behavior sensing
    datasets. For example in the medical domain, it is much easier to collect data
    from healthy controls than from patients with a given condition. In chapter 5,
    some of the oversampling techniques that can be used to deal with the class imbalance
    will be presented.


    When the classes are imbalanced, it is also recommended to validate the generalization
    performance using stratified subsets. This means that when dividing the dataset
    into train and test sets, the distribution of classes should be preserved. For
    example, if the dataset has class ''A'' and ''B'' and 80% of the instances are
    of type ''A'' then, the train set and the test set should have 80% of their instances
    of type ''A''. In crossvalidation, this is known as stratified cross-validation.


    # 4.4 User-Class Sparsity Matrix


    In behavior sensing, using two things are involved: individuals and behaviors.
    Individuals will express different behaviors to different extents. For the activity
    recognition example, some persons may go jogging frequently while others never
    go jogging at all. Some behaviors will be present or absent depending on each
    individual. We can plot this information with what I call a user-class sparsity
    matrix. Figure 4.2 shows this matrix for the activities dataset. The code to generate
    this plot is included in the script EDA. R.


    The x-axis shows the user id and the y-axis the classes. A colored entry (gray
    in this case) means that the corresponding user has at least one associated of
    the corresponding class. For example, user 3 performed all activities and thus
    the dataset contains at least one instance for each of the six activities. On
    the other hand, user 25 only has instances for two activities. Users are sorted
    in descending order (user who have more classes are at the left). At the bottom
    of the plot, the sparsity is shown (0.18). This is just the percentage of empty
    cells in the matrix. When all users have at least one instance of every class
    the sparsity is 0. When the sparsity is different from 0, one needs to decide
    what do depending on the application. The following cases are possible:


    +   - Some users did not perform all activities. If the classifier was trained
    with, for example, 6 classes and a user never goes ''jogging'', the classifier
    may still sometimes predict'
