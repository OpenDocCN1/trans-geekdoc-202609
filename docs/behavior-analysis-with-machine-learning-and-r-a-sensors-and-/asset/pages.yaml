    There exist many implementations of decision trees. Some implementations compute
    variable importance using the entropy (as shown here) but others use the Gini
    index, for example. Each implementation also treats numeric variables in different
    ways. Pruning the tree using different techniques is also common in order to reduce
    its size.


    Some of the most common implementations are C4.5 trees (Quinlan, 2014) and CART
    (Steinberg and Colla, 2009). The later is implemented in the rpart package (Therneau
    and Atkinson, 2019) which will be used in the following section to build a model
    that predicts physical activities from smartphones sensor data.


