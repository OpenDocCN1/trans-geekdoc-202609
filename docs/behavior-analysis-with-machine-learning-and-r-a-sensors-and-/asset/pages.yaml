    (De Gelder, 2006) or for the identification of developmental disorders like autism
    (Anzzewicz et al., 2016).


    Gestures can also be used to develop user-computer interaction applications. The
    following video shows an example application of gesture recognition for domotics.
    The application determines the indoor location using *k-nn* as it was shown in
    this chapter. The gestures are classified using DTW (I''ll show how to do it in
    a moment). Based on the location and type of gesture, a specific home appliance
    is activated. I programmed that time ago using the same algorithms presented here.


    Link to video: https://youtu.be/47-35YmimN4


    To demonstrate how DTW can be used for hand gesture recognition, we will examine
    the HAND GESTURES dataset that was collected with a Smartphone using its accelerometer
    sensor. The data was collected by 10 individuals who performed 5 repetitions of
    10 different gestures (''triangle'', ''square'', ''circle'', ''a'', ''b'', ''c'',
    ... ''4''). The sensor is a triaxial accelerometer that returns values for the
    *x*, *y* and *z* axes. The participants were not instructed to hold the smartphone
    in any particular way. The sampling rate was set at 50 Hz. To record a gesture,
    the user presses the phone-screen with her/his thumb, performs the gesture in
    the air, and stops pressing the screen after the gesture is complete. 2.23 shows
    the start and end positions of the 10 gestures.


    In order to make the recognition orientation-independent, we can compute the *magnitude*
    of the 3 accelerometer axes. This will provide us with the overall movement patterns
    regardless of orientation.


    ```

    $$Magnitude(t) = \sqrt{a_x(t)^2 + a_y(t)^2 + a_z(t)^2} \quad (2.16)$

    ```


    where $a_x(t)$, $a_y(t)$ and $a_z(t)$ are the accelerations at time $t$.'
