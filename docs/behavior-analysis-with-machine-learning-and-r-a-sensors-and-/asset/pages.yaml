- pgno: 349
  md: '![](img/91c149cc24c3e5af2971580c9dda9d8b_349_0.png)


    (a label or a number). When training an autoencoder, the input and the output
    is the same, that is, $(x, x)$.


    Now you may be wondering what is the point of training a model that generates
    the same output as its input. If you take a closer look at Figure 10.11 you can
    see that the hidden layer has fewer units (only 2) than the input and output layers.
    When the data is passed from the input layer to the hidden layer it is ‘reduced’
    (compressed). Then, the compressed data is reconstructed as it is passed to the
    subsequent layers until it reaches the output. Thus, the neural network will learn
    to compress and reconstruct the data at the same time. Once the network is trained,
    we can get rid of the layers after the middle hidden layer and use the ‘left-hand-side’
    of the network to compress our data. The **encoder**. Then, we can use the right-hand-side
    to decompress the data. This part is called the **decoder**. In this example,
    the encoder and decoder consist of only 1 layer but they can have more (as we
    will see in the next section). In practice, you will not use autoencoders to compress
    files in your computer because there are more efficient methods to do that. Furthermore,
    the compression is *lossy*, that is, there is no guarantee that the reconstructed
    file will be exactly the same as the original. However, autoencoders have many
    applications including:


    +   - Dimensionality reduction for visualization.

    - Data denoising.

    - Data generation (variational autoencoders).

    - Anomaly detection (this is what we are interested in!).


    Recall that when training a neural network we need to define a loss function.
    The'
