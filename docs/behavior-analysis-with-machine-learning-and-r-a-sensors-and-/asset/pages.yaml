    In the next section, I will introduce Multi-view Stacking which basically is the
    same as Generalized Stacking but each first-level learner is trained with features
    from a different view.


    # 3.4 Multi-view Stacking for Home Tasks Recognition


    ```

    stacking_algorithms.R stacking_activities.R

    ```


    Multi-view learning refers to the case when an instance can be characterized by
    two or more independent ‘views’. For example, one can extract features for webpage
    classification from a webpage’s text also from the links pointing to it. Usually,
    there is the assumption that the views are independent and each is sufficient
    to solve the problem. Then, why combine them? In many cases, each view provides
    additional and complementary information, thus, allowing to train better models.


    The simplest thing one can do is to extract features from each view, aggregate
    them, and train a single model. This approach usually works well but it has some
    limitations. Each view may have different statistical properties, thus different
    types of models may be needed for each view. When aggregating features from all
    views, variable correlations may be introduced which could impact the performance.
    Another limitation is that features need to be in the same format (feature vectors,
    images, etc.), so they can be aggregated.


    For video classification, we could have two views. One represented by sequences
    of images, and the other one by the corresponding audio. For the video part, we
    could encode the'
  merge: -1
  img_proc: true
- pgno: 123
  md: '# CHAPTER 3. PREDICTING BEHAVIOR WITH ENSEMBLE LEARNING


    features as images themselves, i.e., metrics. Then, a Convolutional Neural Network
    (covered in chapter 8) could be trained directly from those images. For the audio
    part, statistical features can be extracted and stored into normal feature vectors.
    In this case, the two representations (views) are different. One is a matrix and
    the other one-dimensional feature vector. Combining them to train a single classifier
    could be problematic given the nature of the views and their different encoding
    formats. Instead, we can train two models, for each and combine the results. This
    is precisely the idea of Multi-view Stacking (Garcia-Ceja et al., 2018a). Train
    a different model for each view and combine the outputs like Stacking.


    Here, Multi-view Stacking will be demonstrated using the HOME TASKS dataset. This
    dataset was collected from two sources. Acceleration and audio. The acceleration
    was recorded with a wrist-band watch and the audio using a cellphone. This dataset
    consists of 7 common tasks: ''m floor'', ''sweep floor'', ''type on computer keyboard'',
    ''brush teeth'', ''wash hands'', ''eat chips'', and ''watch t.v.''. Three volunteers
    performed each activity for approximately 3 minutes.


    The acceleration and audio signals were segmented into 3 sec. windows. From each
    window, different features were extracted. From the acceleration, the 3 axes (x,y,z)
    such as mean, standard deviation, maximum values, mean magnitude, area under the
    curve, etc. From the audio signals, 12 features were extracted, Mel Frequency
    Cepral Coefficients (MFCCs). To preserve volunteers'' privacy, the original audio
    was not released. The dataset already contains the features from acceleration
    and audio. The first column is the label.


    In order to implement Multi-view Stacking, two Random Forests will be trained,
    one for each view (acceleration and audio). The predicted outputs will be stacked
    to form the new training set D'' and a Random Forest with D'' will act as the
    meta-learner.


    The next code snippet from stacking_algorithms .R shows the multi-view stacking
    implemented in R.


    ```

    mvstackacking <- function(D, v1cols, v2cols, k = 10){


    # Generate folds for internal cross-validation

    folds <- sample(i:k, size = nrow(D), replace = T)


    trueLabels <- NULL

    predicted.v1 <- NULL # predicted labels with view 1

    predicted.v2 <- NULL # predicted labels with view 2

    probs.v1 <- NULL # predicted probabilities with view 1

    ```'
