    # 4.9 Heatmaps


    Heatmaps are a good way to visualize the ‘intensity’ of events. For example, a
    heatmap can be used to depict wide interactions by overlapping colored pixels
    relative to the number of clicks. This visualization eases the process of identifying
    the most relevant sections of the given website, for example. In this section,
    we will generate a heatmap of weekly motor activity levels of individuals with
    and without depression. The DEPRESION dataset will be used for this task. It contains
    motor activity records captured with an actigraphy device which is like a watch
    but has several sensors including accelerometers. The device registers the amount
    of movement every minute. The data contains records of 23 patients and 32 controls
    (those without depression). The participants were for 13 days on average.


    The accompanying script auxiliary_eda.R has the function computeActivityHour()
    that returns a matrix with the average activity level of the depressed patients
    or the controls (without depression). The matrix dimension is 24 × 7 and it stores
    the activity level at each day and how. The type argument is used to specify if
    we want to compute this matrix for the depressed or control participants.


    ```

    source("auxiliary_eda.R")


    # Generate matrix with mean activity levels

    # per hour for the control and condition group.

    map.control <- computeActivityHour(Datapath, type = "control")

    map.condition <- computeActivityHour(datapath, type = "condition")

    ```


    Since we want to compare the heatmaps of both groups we normalize the matrices
    that the values between 0 and 1 in both cases. The script also contains a method
    normalizeMatrices() to do the normalization.


    ```

    # Normalize matrices.

    res <- normalizeMatrices(map.control, map.condition)

    ```


    Then, the pheat package (Kolde, 2019) can be used to create the actual heatmap
    from the matrices.'
  merge: -1
  img_proc: true
