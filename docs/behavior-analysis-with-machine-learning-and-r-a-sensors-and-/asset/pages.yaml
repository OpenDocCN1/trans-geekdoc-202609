    # 8.4.2 Dropout


    Dropout is another technique used to reduce overfitting proposed by Srivastava
    et al. (2014). It consists of ''dropping'' some of the units from a hidden layer
    for each sample during training. In theory, it can also be applied to input and
    output layers but that is not very common The incoming and outgoing connections
    of a dropped unit are discarded. Figure 8.23 shows an example of applying dropout
    to a network. In b), the middle unit was removed from the network in c), the top
    and bottom units were removed.


    Each unit has an associated probability $p$ (independent of other units) of being
    dropped. This probability is another hyperparameter but typically it is set to
    0.5. Thus, during each iteration and for each sample, half of the units are discarded.
    The effect of this, is having'
  merge: -1
  img_proc: true
- pgno: 281
  md: '# CHAPTER 8. PREDICTING BEHAVIOR WITH DEEP LEARNING


    # 269


    ![](img/91c149cc24c3e5af2971580c9dda9d8b_281_0.png)


    a) original neural network


    b) neural network with one unit dropped


    c) neural network with two units dropped


    Figure 8.23: Dropout example.


    ![](img/91c149cc24c3e5af2971580c9dda9d8b_281_1.png)


    Figure 8.24: Incoming connections to one unit when the previous layer has dropout.


    more simple networks (see Figure 8.23) and thus less prone to overfitting. Intuitively,
    we can also think of dropout as training an ensemble of neural networks, each
    having a slightly different structure.


    From the perspective of one unit that receives inputs from the previous hidden
    layer with dropout, approximately half of its incoming connections will be gone
    (if $p = 0.5$). See Figure 8.24.


    Dropout has the effect of making units not to rely on any single incoming connection,
    this makes the whole network able to compensate for the lack of connections by
    learning alternative paths. In practice and for many applications, this can result
    in a more robust model. A side effect of applying dropout is that the expected
    value of the activation function of a unit will be diminished because half of
    the previous activations will be 0. Recall the output of a neuron is computed
    as:


    ```

    $f(\mathbf{x}) = g(\mathbf{w} \cdot \mathbf{x} + b)$

    ```


    where $\mathbf{x}$ contains the input values from the previous layer, $\mathbf{w}$
    the corresponding weights and $g()$ is the activation function. With dropout,
    approximately half of the values of $\mathbf{x}$ will be 0. To compensate for
    that, the input values need to be scaled, in this case, by a factor of 2.


    ```

    $f(\mathbf{x}) = g(\mathbf{w} \cdot 2\mathbf{x} + b)$

    ```'
