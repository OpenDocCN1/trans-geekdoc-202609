    The most common smoothing method for timeseries is the simple moving average.
    With this method, the first element of the resulting smoothed series is computed
    by taking the average of the elements within a window of predefined size. The
    window''s position starts at the first element of the original series. The second
    element is computed in the same way after moving the window position to the right.
    Figure 5.6 shows this procedure on a series with 5 elements and a window size
    of 3. After the third iteration, it is not possible to move the window one more
    step to the right while 3 elements since the end of the time series has been reached.
    Because of this, the smoothed series will have some missing values at the end.
    Specifically, it will have $w-1$ fewer elements where $w$ is the window size.
    A simple solution is to compute the average of the elements covered by the window
    even if they are less than the window size.


    In the previous example average is taken from the elements to the right of the
    pointer. There is a variation called centered moving average in which the center
    point of the window has the same elements to the left and right (Figure 5.7).
