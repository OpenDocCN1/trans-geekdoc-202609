    4 features.


    We will represent each action (file) as a feature vector. The same script also
    shows the code to extract the feature vectors from each action. To extract the
    features, a reference point in the skeleton is selected, in this case the spine
    (joint 3). Then, for each frame, the distance between all joints (excluding the
    reference point) and the reference point is calculated. Finally, for each joint,
    the *mean*, *min*, and *max* are computed across all time frames. Since there
    are 19 joints (excluding the spine), we end up with $19*3=57$ features. Figure
    9.3 shows how the final dataset looks like. Only showing the first 4 features
    out of 57 and user id and labels.


    > The following examples assume that the dataset.csv with the extracted features
    already exits in the skeleton_actions/ directory. To generate this file, run the
    feature extraction code in the script preprocess_skeleton_actions.R.


    If the dataset in a suitable format, we can proceed to **train our mixed model.**
    The script containing the full code for training the different types of models
    is `classify_skeleton_actions.R`. This script makes use of the `dataset.csv` file.


    First, the auxiliary functions are loaded because we will use the `normalize()`
    function to normalize the data. We will use a Random Forest for the classification
    and the `caret` package to compute the performance metrics.'
