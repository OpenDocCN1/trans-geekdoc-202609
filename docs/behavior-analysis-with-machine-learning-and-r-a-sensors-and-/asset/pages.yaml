- pgno: 59
  md: '# CHAPTER 2. PREDICTING BEHAVIOR WITH CLASSIFICATION MODELS


    also has some limitations, especially in highly imbalanced datasets. The following
    metrics provide different views of a model''s performance for the binary case
    (when there are only two classes). These metrics can be extended to the multi-class
    setting using a one v.s. all approach. That is, compare each class to the remaining
    classes.


    Before introducing other metrics, it is connects to define some:


    +   * True positives (TP): Positive examples classified as positives.

    * True negatives (TN): Negative examples classified as negatives.

    * False positives (FP): Negative examples misclassified as positives.

    * False negatives (FN): Positive examples misclassified as negatives.


    For binary classification, it is you decide which one is the positive class. For
    example, if your problem is detecting faults and you have two classes: ''fall''
    and ''nofall'', considering ''fall'' as the positive class makes sense since you
    are the one you are most interested in detecting. The following, is a commonly
    used metrics in classification:


    **Recall:** The proportion of positives that are classified as such. Alternative
    names for recall are: **true positive rate, sensitivity, and hit rate.** In fact,
    the diagonal of the confusion matrix with proportions of the indoor location example
    shows the recall for each class (Figure 2.3).


    ```

    $recall = \frac{TP}{P}$$

    ```


    **Specificity:** The proportion of negatives classified as such. It is also called
    the true negative rate.


    ```

    $specificity = \frac{TN}{N}$$

    ```


    **Precision:** The fraction of true positives among those classified as positives.
    Also known as the positive predictive value.


    ```

    $precision = \frac{TP}{TP + FP}$$

    ```


    **F1-score:** This is the harmonic mean of precision and recall.


    ```

    $F1-score = 2 \cdot \frac{precision \cdot recall}{precision + recall}$$

    ```


    The *confusionMatrix()* function from the *caret* package computes several of
    those metrics. From our previous confusion matrix object, we can inspect those
    metrics by class.'
  merge: -1
  img_proc: true
