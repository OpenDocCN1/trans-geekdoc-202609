  md: '# # Chapter 8


    # ## Predicting Behavior with Deep Learning


    Deep learning (DL) consists of a set of model architectures and algorithms with
    applications in supervised, semi-supervised, unsupervised and reinforcement learning.
    Deep learning is mainly based on artificial neural networks (ANNs). One of the
    main characteristics of DL is that the models are composed of several levels.
    Each level transforms its input into more abstract representations. For example,
    for an image recognition task, the first level corresponds to raw pixels, the
    next level transforms pixels into simple shapes like horizontal/vertical lines,
    diagonals, etc. The next level abstract more complex shapes like wheels, windows,
    and so on; and the final level could detect if the image contains a car or a human,
    or maybe both.


    Examples of DL architectures include deep neural networks (DNNs), convolutional
    neural networks (CNNs), recurrent neural networks (RNNs), and autoencoders, to
    name a few. One of the reasons for the success of DL is due to its flexibility
    to deal with different types of data and problems. For example, CNNs can be used
    for image classification. RNNs can be used for timeseries data, autoencoders can
    be used to generate new data, and so on. Another advantage of DL is that it is
    not required to do feature engineering. That is, different features depending
    on the problem domain. Depending on the problem and the DL architecture, it is
    possible to feed the raw data (with some preprocessing) to the model. The model
    will then, automatically extract features at each level with an increasing level
    of abstraction. DL has achieved state-of-the-art results in many different tasks
    like speech recognition, image recognition, translation, etc. It has also been
    successfully applied to different types of behavior prediction.


    In this chapter, an introduction to artificial neural networks will be presented.
    Next, we will see how to train deep models in R using Keras and TensorFlow. We
    will apply these models'
  merge: -1
  img_proc: true
