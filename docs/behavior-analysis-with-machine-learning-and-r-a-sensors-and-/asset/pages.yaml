  md: '# CHAPTER 10. DETECTING ABNORMAL BEHAVIORS


    function captures how well the network is learning. It measures how different
    the predictions are from the true expected outputs. In the context of autoencoders,
    this difference is known as the reconstruction error and can be measured using
    the mean squared error (similar to regression).


    > In this section I introduced the most simple type of autoencoder but there are
    many variants as denoising autoencoders, variational autoencoders (VAEs), and
    so on. The Wikipedia page provides a good overview of the different types of autoencoders:
    https://en.wikipedia.org/wiki/Autoencoder


    # 10.3.1 Autoencoders for Anomaly Detection


    ```

    keras_autoencoder_fish.R

    ```


    Autoencoders can be used as anomaly detectors and we will use one to detect abnormal
    fish trajectories. The way this does is by training an autoencoder to compress
    and reconstruct the normal instances. Once the autoencoder has learned to encode
    normal instances, we can expect the reconstruction error to be small. When presented
    with out-of-the-normal instances, the autoencoder will have a hard time trying
    to reconstruct them and consequently, the reconstruction error will be hard. Similar
    to Isolation Forests where the tree length provides a measure of the rarity of
    an instance, the reconstruction error in autoencoders can be used as an anomaly
    score.


    To tell whether an instance is abnormal or not, we can pass it through the autoencoder
    and compute its reconstruction error $\epsilon$. If $\epsilon > threshold$ the
    label can be regarded as abnormal.


    Similar to what we did with the Isolation Forest, we will use the fishFeatures.csv
    file that contains the fish trajectories encoded as features. Each trajectory
    is composed of 8 numeric features based on acceleration and speed. We will use
    80% of the normal instances to train the autoencoder. All abnormal instances will
    be used for the test set.


    After splitting the data (the code is in keras_autoencoder_fish.R), we will normalize
    (standardize) it. The normalize.standard() function will normalize the data such
    that it has a mean of 0 and a standard deviation of 1.


    ```

    $z = \frac{x - \mu}{\sigma} \quad (10.3)$

    ```'
  merge: -1
  img_proc: true
- pgno: 351
  md: "# CHAPTER 10. DETECTING ABNORMAL BEHAVIORS\n\nThis is slightly different from\
    \ the 0-1 normalization we have used before. The reason is that when scaling to\
    \ 0-1 the min and max values from the train set need to be learned. If there are\
    \ data points in the test set that have values outside the min and max they will\
    \ be truncated. But since we expect anomalies to have rare values, then it is\
    \ likely that they will be outside the train ranges and they will be truncated.\
    \ After being truncated, abnormal instances could look more similar to the normal\
    \ ones, it will be more difficult to spot them. By standardizing the data we make\
    \ sure that the extreme values of the abnormal points are preserved. In this case,\
    \ the parameters to be learned from the train set are $\\mu$ and $\\sigma$.\n\
    Once the data is normalized we can define the autoencoder.\n\n```\nautoencoder\
    \ <- keras_model_sequential()\n\nautoencoder <- %%\nlayer_dense(units = 32, activation\
    \ = 'relu',\n    input_shape = ncol(train.normal)-2) %%\nlayer_dense(units = 16,\
    \ activation = 'relu') %%\nlayer_dense(units = 8, activation = 'relu') %%\nlayer_dense(units\
    \ = 16, activation = 'relu') %%\nlayer_dense(units = 32, activation = 'relu')\
    \ %%\nlayer_dense(units = ncol(train.normal)-2, activation = 'linear')\n```\n\n\
    This is normal neural network with an input layer having the same number of units\
    \ as number of features (8). This network has 5 hidden layers of size 32, 16,\
    \ 8, 16, and 32, respectively. The output layer has 8 units (the same as the input).\
    \ All activation functions are RELU the last one which is linear because the network\
    \ should be able to produce any number as output. Now we can compile and fit the\
    \ model.\n\n```\nautoencoder %% compile(\nloss = 'mse',\noptimizer = optimizer_sgd(lr\
    \ = 0.01),\nmetrics = c('mse')\n)\n```\n\n```\nhistory <- autoencoder %%\nas.matrix(train.normal[,-c(1:2)]]),\n\
    as.matrix(train.normal[,-c(1:2)]]),\n```"
