  md: '# # Chapter 6


    # # Discovering Behaviors with Unsupervised Learning


    So far, we have been working with supervised learning methods, that is, models
    for which the training instances have two elements: 1) a set of input values (features)
    and 2) the expected output (label). As mentioned in chapter 1, there are other
    types of machine learning methods and one of those is unsupervised learning which
    is the topic of this chapter. In unsupervised learning the training instances
    do not have a response variable (e.g., a label). Thus, the objective is to extract
    knowledge from the available data without any type of guidance (supervision).
    For example, given a set of variables that characterize a person, we would like
    to find groups of people with similar behaviors. For physical activity behaviors,
    this could be done by finding groups of very active people versus groups of people
    with low physical activity. Those groups can be useful for delivering appropriate
    suggestions to each group, thus, enhancing and personalizing the user experience.


    This chapter starts with one of the most popular unsupervised learning algorithms:
    kmeans clustering. Then, an example of how this technique can be applied to find
    groups of students with similar characteristics is presented. Then, association
    rules are presented which is another type of unsupervised learning. Finally, association
    rules are used to find criminal patterns in a database.


    # ## 6.1 K-means clustering


    ```

    kmeans_steps.R

    ```'
