    Figure 2.16: Four datasets with the same correlation of 0.816.


    ![](img/91c149cc24c3e5af2971580c9dda9d8b_87_1.png)


    Figure 2.17: Time shift example between two sentences.


    To account for this “time-shift” effect in time series data we can use Dynamic
    Time Warping (Sakoe et al., 1990) when comparing two time series. DTW is a method
    that:


    +   - Finds an optimal match between two given time-dependent sequences.

    - Computes the dissimilarity between the sequences.

    - Finds the optimal deformation of one of the sequences onto the other.


    Another advantage of DTW is that the time series do not need to be of the same
    length. Suppose we have two time series, a *query*, and a *reference* we want
    to compare with:'
