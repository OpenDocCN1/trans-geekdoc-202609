    on sheep and goats and tracked their behavior during one day. They also video-recorded
    the session and annotated the data with different types of behaviors such as grazing,
    fighting, scratch-biting. The device was placed on the neck with random orientation
    and it collects acceleration, orientation, magnetic field, temperature, and barometric
    pressure. In this book, only data from one of the sheep is used (Sheep/S1.csv).


    # B.10 SKELETON ACTIONS


    Included: No.


    The authors of this dataset are Chen et al. (2015). The data was recorded by 8
    subjects with a Kinect camera and an inertial sensor unit and each subject repeated
    each action 4 times.'
  merge: -1
  img_proc: true
- pgno: 366
  md: 'The number of actions is 27 and some of the actions are: right hand wave, two
    front clap, basketball shoot, front boxing, etc. More information about the collection
    process and pictures can be consulted on the website https://personal.utdallas.edu/~kehtar/UTD-MHAD.html.


    # B.11 SMARTPHONE ACTIVITIES


    Included: Yes.


    This dataset is collected by WISDM³ and was made available by Kwapisz et al. (2010).
    The dataset has 6 activities: walking, jogging, walking upstairs, walking downstairs,
    sitting and standing. The data was collected by 36 volunteers with the accelerometer
    of an Android phone located in the users’ pant pocket and with a sampling rate
    of 20 Hz.


    # B.12 SMILES


    Included: No.


    This dataset contains face images of 64 × 64 pixels and is published here: http://conradsanderson.id.au/lfwcrop/.
    This is a cropped version (Sanderson and Lovell, 2009) of the Labeled Faces in
    the LFW (Labeled) database (Huang et al., 2008). Please, download the color version
    (lfwcrop_color.zip) and copy all ppm files into the faces/ directory.


    A subset of the database was labeled by Arigababu et al. (2016), Arigababu (2017).
    The labels are provided as two text files (SMILE list.txt, NON-SMILE list.txt),
    each containing the list of faces that correspond to smiling and non-smiling faces.
    The smiling set has 600 pictures.


    # B.13 STUDENTS’ MENTAL HEALTH


    Included: Yes.


    This dataset contains 268 survey responses that include variables related to depression,
    accultural stress, social connectedness, and help-seeking behaviors reported by
    international and domestic students at an international university in Japan. For
    a detailed description, please see (Nguyen et al., 2019).


    > ³http://www.cis.fordham.edu/wisdm/dataset.php'
