- pgno: 44
  md: '![](img/91c149cc24c3e5af2971580c9dda9d8b_44_0.png)


    Figure 1.15: Error due to bias and variance.


    more informed decisions when building predictive models. The *test error*, also
    known as the *generalization error* of a predictive model can be decomposed into
    three components: a bias, a variance, and noise.


    **Noise.** This component is related to the data and there is nothing we can do
    about it. For example, two instances having the same values in their features
    but with a different label.


    **Bias.** The bias is how much the average prediction differs from the true value.
    Note the *average* keyword. This means that we make the assumption that an infinite
    (or very large) number of train sets can be generated, and for each predictive
    model is trained. Then we average the predictions of all those models and see
    how much that average differs from the true value.


    **Variance.** The variance relates to how much the predictions change for a given
    data point when training a model using a different train set each time.


    The following picture graphically illustrates different scenarios for high/low
    bias and variance. The center of the target represents the true value and the
    small red dots the predictions on a hypothetical *test set*.


    Bias and variance are closely related to underfitting and overfitting. High variance
    is a sign'
  merge: -1
  img_proc: true
