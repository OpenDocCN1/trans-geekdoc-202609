    # 1.8 Underfitting and Overfitting


    From the felines classification example, we saw how we can separate two classes
    by computing the mean for each class. For the two-class problem, this is equivalent
    to having a decision line between the two means (Figure 1.12). Everything to the
    right of this decision line will be closer to the mean that corresponds to *leopard*
    and everything to the left to *tiger*. In this case, the classification function
    is a vertical line, and during learning the position of the line that reduces
    the classification error is searched for. We implicitly estimated the position
