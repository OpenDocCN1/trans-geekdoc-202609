  fmt: '

    ## 2. Operability: Design interfaces that are operable by users with diverse abilities
    and input methods. Provide keyboard navigation alternatives for users who cannot
    use a mouse, ensure that interactive elements are easily clickable or touchable,
    and avoid time-based interactions that may be challenging for some users.


    ## 3. Understandability: Make interfaces understandable to users with varying
    levels of cognitive abilities and language proficiency. Use clear and concise
    language, provide instructions and guidance where necessary, and ensure that navigation
    and layout are intuitive and predictable.


    ## 4. Robustness: Ensure that digital products and interfaces are robust and compatible
    with assistive technologies used by individuals with disabilities. Follow web
    accessibility standards such as `WCAG` (Web Content Accessibility Guidelines)
    to ensure compatibility with screen readers, magnifiers, and other assistive devices.


    ## 5. Text Alternatives: Provide text alternatives for non-text content, such
    as images, videos, and audio files, to ensure that users with visual impairments
    can access the content using assistive technologies.


    ## 6. Focus Management: Ensure that focus indicators are clearly visible and distinguishable
    for keyboard users, allowing them to navigate through interactive elements and
    controls easily.


    ## 7. Semantic Markup: Use semantic HTML markup to structure content and ensure
    compatibility with assistive technologies. Use heading tags to create a logical
    hierarchy, label form controls properly, and use landmark roles to define the
    structure of the page.


    ## 8. Testing and Evaluation: Conduct regular accessibility testing with users
    with disabilities to identify barriers and usability issues. Use automated accessibility
    testing tools and manual testing techniques to evaluate accessibility compliance
    and make necessary improvements.


    By considering these accessibility considerations in design, developers can create
    digital products and interfaces that are inclusive, usable, and accessible to
    users of all abilities.

    '
  trans: '


    ## 2. 可操作性：设计可供不同能力和输入方式的用户操作的界面。为无法鼠标的用户提供键盘导航替代方案，确保交互元素易于点击或触摸，并避免可能对某些用户产生挑战的基于时间限制的交互。


    ## 3. 可理解性：使界面对于不同认知水平和语言能力的用户来说易于理解。使用清晰简洁的语言，在必要时提供说明和指导，并确保导航和布局是直观且可预测的。


    ## 4. 健壮性：确保数字产品和界面具有健壮性，并与残障人士使用的辅助技术兼容。遵循 `WCAG`（网络内容无障碍指南）等网络无障碍标准，以确保与屏幕阅读器、放大镜和其他辅助设备的兼容性。


    ## 5. 文本替代：为非文本内容（如图像、视频和音频文件）提供文本替代，以确保视觉障碍用户能够使用辅助技术访问内容。


    ## 6. 焦点管理：确保焦点指示对键盘用户清晰可见且易于区分，让他们能够轻松地在交互元素和控件之间导航。


    ## 7. 语义化标记：使用语义化的 HTML 标记来构建内容，确保与辅助技术的兼容性。使用标题标签创建逻辑层级，正确标记表单控件，并使用地标角色（landmark
    roles）定义页面结构。


    ## 8. 测试与评估：定期与残障人士一起进行无障碍测试，以识别障碍和可用性问题。使用自动化无障碍测试工具和手动测试技术来评估无障碍合规性并进行必要的改进。


    通过在设计中考虑这些无障碍因素，开发者可以创建出包容性、易用性且让所有能力的用户都能访问的数字产品和界面。


    '
