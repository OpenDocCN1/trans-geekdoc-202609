    1. [World Health Organization (WHO) (n.d.). *eHealth Governance*](#ch6.xhtml#R_en6_1).
    [https://www.who.int/ehealth/governance/en/](https://www.who.int)

    2. [Wilson, P. (2012). Legal frameworks for eHealth. *Global Observatory for eHealth
    series – Volume 5*](#ch6.xhtml#R_en6_2). World Health Organization (WHO). [https://www.who.int/goe/publications/legal_framework_web.pdf](https://www.who.int)

    3. [United Nations (2015). *Universal Declaration of Human Rights (UDHR)*](#ch6.xhtml#R_en6_3).
    [https://www.un.org/en/udhrbook/pdf/udhr_booklet_en_web.pdf](https://www.un.org)

    4. [Council of Europe (2013, October 02). *European Convention on Human Rights*](#ch6.xhtml#R_en6_4).
    [https://www.echr.coe.int/documents/convention_eng.pdf](https://www.echr.coe.int)

    5. [United Nations (1966). *International Covenant on Civil and Political Rights*](#ch6.xhtml#R_en6_5).
    UN Office of the High Commissioner on Human Rights. [https://www.ohchr.org/en/professionalinterest/pages/ccpr.aspx](https://www.ohchr.org)

    6. [Council of Europe (2020, December 31). *Guide on Article 8 of the European
    Convention on Human Rights*](#ch6.xhtml#R_en6_6). European Court of Human Rights.
    [https://www.echr.coe.int/documents/guide_art_8_eng.pdf](https://www.echr.coe.int)

    7. [The African Union Commission (2014, June 27). *African Union Convention on
    Cyber Security and Personal Data Protection*](#ch6.xhtml#R_en6_7). [https://au.int/en/treaties/african-union-convention-cyber-security-and-personal-data-protection](https://au.int)

    8. [Orrell, T. (2015, November). *The African Declaration on Internet Rights and
