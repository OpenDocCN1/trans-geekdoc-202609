    同样，配置不当的医疗系统或数据库服务器会导致`Threat`（威胁）。缺乏经验的系统管理员或允许用户任意配置和重新配置公司设备的组织政策——这些都是导致该`Threat`的预设性`Vulnerabilities`（漏洞）。医疗数据泄露是这种情况可能导致的安全违规行为，尽管其中可能并不包含恶意意图。


    此外，允许员工获得比其工作功能通常所需的更高的权限来访问数据和信息资源的医疗组织政策，也是一种 `Vulnerability`（漏洞）。担任此类职位的员工会成为一个
    `Threat`（威胁）。然而，利用这种特权恶意汲取敏感数据或信息以获取个人财务收益，是一种违反安全的攻击行为。


    再次，医疗机构中没有身份验证密码的开放 Wi-Fi 连接也是一种 `Vulnerability`（漏洞）。未经授权而连接到该资源的外部人员将成为一个 `Threat`（威胁）。当这种外部人员在此种情况下采取恶意行动时，就发生了
    `Attack`（攻击）。


    请注意，`Threats`（威胁）的来源可能是内部的（在这种情况下被称为内部威胁）或外部的。但在实践中，`Threats`（威胁）、`Vulnerabilities`（漏洞）和`Attacks`（攻击）之间的关系不仅复杂，而且错综复杂。这种关系的性质有时使得在理论上难以在这些概念之间划定清晰的界限。然而，理解此处提供的描述将有助于识别电子健康`Cybersecurity
    Threat Landscape`（网络安全威胁格局）的当代现状。


    ## 电子健康网络安全的威胁主体


    当 `Threat Agents`（威胁主体）利用、尝试利用或持续利用漏洞时，`Threats`（威胁）就会存在或显现。因此，这些 `Threat Agents`（威胁主体）是电子健康网络安全论述中不可或缺的因素。事实上，`eHealth
    Cybersecurity Threat Landscape`（电子健康网络安全威胁格局）持续存在不同的参与者。出现在这一`Landscape`（格局）中的`Threat
    Agents`包括个人实体、独立团体、公司实体、主权（国家）实体或非主权（但受主权国家赞助的）实体。换句话说，基本上，电子健康网络安全的 `Threat Agents`
    包括个人和非个人实体，这些实体可能是独立的或与主权相关的，还包括主权实体。


    `Individual Entities`（个人实体）可能是对计算机/信息安全工作和操作具有技术技能的海客。他们也可能包括不具备技术技能但可能通过非技术手段采取恶意操作的恶意个人。此外，他们也可能是没有恶意意图的幼稚人类行为者（内部或外部），但他们无意的行为和活动对安全利益和目标的损害可能并毫不小。


    `Independent Groups`（独立团体）是由具有共同愿景或使命的恶意个人实体组成的，这种愿景或使命可能是政治、意识形态、文化、财务、爱国主义或其他。作为其操作手段的一部分，他们可能表现出特定的技术水平。而他们操作背后的灵感可能是恐怖/叛乱、宣传、极端主义、行动主义或狂热的热情。


    在某些情况下，出于各种原因寻求实施恶意网络行动的主权政府可能会赞助`Individuals`（个人）和`Independent Groups`（独立团体）。在这种身份下，他们符合`Sovereign-sponsored/Sovereign-affiliated
    Threat Agents`（主权赞助/主权相关的威胁主体）。


    具有竞争或伙伴关系的`Corporate Entities`（公司实体）也可能是电子健康网络安全的威胁主体。当涉及竞争利益时，恶意意图通常表现为旨在破坏公司利益或目标组织的声誉。然而，当涉及伙伴利益时，疏忽行为同样可能创造或持续可能对公司安全利益产生不利的威胁局面。与非主权赞助的`Individual
    Entities`和`Independent Groups`相比，具有恶意意图的`Corporate Threat Entities`（公司威胁实体）通常具有更多的威胁资源能力。


    `Sovereign Entities`（主权实体）是出于各种原因实施恶意网络行动以维护或维护利益的国家。当`Threat Agents`利用、尝试利用或持续利用漏洞时，`Threats`就会存在或显现。因此，这些`Threat
    Agents`是电子健康网络安全论述中不可或缺的因素。事实上，eHealth Cybersecurity Threat Landscape（电子健康网络安全威胁格局）持续存在不同的参与者。出现在这一
    Landscape（格局）中的 Threat Agents（威胁主体）包括个人实体、独立团体、公司实体、主权（国家）实体或非主权（但受主权赞助的）实体。（等一下，清理一下）主权赞助/主权相关的实体威胁网络安全并非不可能。同时，财务利益已知占绝大多数（80%


    ## 医疗保健中的网络安全事件


    当由于威胁主体的恶意或无意行动导致医疗保健领域发生网络安全事件时，通常会显现某些结果，并且工具和技术、方法或策略，以及威胁目标经常作为导致这些结果的威胁-攻击过程的一部分（`图
    2.3`）。


    ![图 2.3 网络安全事件发生时。](img/fig6.jpg)


    通常，这些`Outcomes`（结果）包括`数据泄露与泄漏`、`间谍活动`以及`医疗保健 IT 系统/设备的不可用或故障`。然而，当网络安全事件针对医疗机构时，间谍活动很少结果，除非如之前强调的那样，医疗组织的系统或基础设施为感兴趣的更大实体（如政府或武装部队）的操作和活动提供了窗口/余地。


    导致这些结果的路径具有：


    *   `Threat Objectives`（威胁目标），例如侦察/枚举、数字/电子截获、服务中断、诱导系统/设备故障、侵蚀安全文化/协议/操作、凭据填充和身份盗窃/数字身份冒充；

    *   `Methods, Strategies, or Approaches`（方法、策略或途径），例如欺骗（电子邮件、数据包、位置、地址、协议操作、网站、生物识别和非生物识别标识等）、社会工程学、高级持续性威胁（或
    APTs）、现场的物理事件和活动（包括可能是幼稚或具有恶意意图的内部操作）、Wi 嗅探（wardriving）、中间人攻击（MITM）、注入/投毒、权限提升、转载、数字活动监控、劫持、对协议和常规操作的颠覆/绕过以及拒绝服务（DoS）；

