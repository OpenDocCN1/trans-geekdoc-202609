    In the same vein, a misconfigured medical system or database server poses a `Threat`.
    An inexperienced systems administrator or organizational policies that allow users
    to configure and reconfigure corporate devices arbitrarily – these are pre-disposing
    `Vulnerabilities` to this `Threat`. A healthcare data leak is a security violation
    that could result from this situation, even though no malicious intentions may
    have been associated with it.


    In addition, a healthcare organizational policy that allows employees more privileged
    access to data and information resources than is ordinarily needed for their job
    functions is a `Vulnerability`. Such an employee in this role becomes a `Threat`.
    However, to use this privilege to siphon sensitive data or information maliciously
    for personal financial gain is an attack that violates security.


    Again, an open Wi-Fi connection without an authentication access code at a healthcare
    facility is a `Vulnerability`. An outsider who connects to this resource without
    an authorization becomes a `Threat`. When such an outsider undertakes a malicious
    action under this condition, an `Attack` has taken place.


    Notice also that `Threats` could have origins that are either internal (in which
    case they are referred to as insider threats) or external. In practice, however,
    `Threats`, `Vulnerabilities`, and `Attacks` share a relationship that is not only
    complex but is also complicated. The nature of this relationship sometimes makes
    it difficult to draw a distinct demarcation along these concepts in theory. However,
    understanding the descriptions here provided would be helpful for discerning the
    contemporary realities of the `Cybersecurity Threat Landscape` for eHealth.


    ## Threat Agents to Cybersecurity of eHealth


    `Threats` exist or manifest when `Threat Agents` exploit, attempt to exploit,
    or perpetuate a vulnerability. Thus, these `Threat Agents` are an indispensable
    factor in the discourse around cybersecurity in eHealth. Indeed, the `eHealth
    Cybersecurity Threat Landscape` is one that has continued to feature different
    players. `Threat Agents` that have featured in this `Landscape` include individual
    entities, independent groups, corporate entities, sovereign (nation-state) entities,
    or non-sovereign (but sovereign-sponsored) entities. In other words, basically,
    `Threat Agents` to eHealth cybersecurity include individual and non-individual
    entities, which could be either independent or sovereign-affiliated, as well as
    sovereign entities.


    `Individual Entities` could be hackers who have technical skills in the workings
    and operations of computer/information security. They could also include malicious
    individuals who might not have technical skills but may seek to undertake malicious
    operations through non-technical means. Then, they could also be naive human actors
    (internal or external) without malicious intent, but whose unwitting actions and
    activities could be no less inimical to security interests and goals.


    `Independent Groups` are associations of malicious individual entities united
    by a common vision or mission that could be political, ideological, cultural,
    financial, patriotic, or otherwise. As part of their repertoire of operations,
    they could feature certain levels of technical competence. Whereas, the inspiration
    behind their operations could be terror/insurrection, propaganda, extremism, activism,
    or wild enthusiasm.


    In some cases, sovereign governments seeking to undertake malicious cyber operations
    for various reasons could sponsor `Individuals` and `Independent Groups`. In this
    capacity, they qualify as `Sovereign-sponsored/Sovereign-affiliated Threat Agents`.


    `Corporate Entities` with competing or partnering interests could also pose as
    threat agents to eHealth cybersecurity. When competing interest is involved, malicious
    intentions usually feature with the aim of sabotaging corporate interests or the
    reputation of the target organization. However, when partnering interests are
    involved, actions of inadvertence could equally create or perpetuate threat situations
    that might be inimical to corporate security interests. Compared to `Individual
    Entities` and `Independent Groups` that are not sovereign-sponsored, `Corporate
    Threat Entities` with malicious intentions often feature more threat resource
    capabilities.


    `Sovereign Entities` are nation states that undertake malicious cyber operations
    for various reasons to safeguard or assert interests. `Threats exist or manifest
