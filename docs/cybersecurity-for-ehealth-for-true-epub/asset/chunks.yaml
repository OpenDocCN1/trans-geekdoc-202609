    # Availability


    `Availability` pertains to the guarantee that data elements and the information
    they translate into are always and promptly accessible at all times, at all such
    points, and for all such uses, functions, and operations that are authorized,
    ethical, and lawful – in order to preserve the utility of data and information,
    regardless of prevailing realities. In many cases, this guarantee has less to
    do with the actual data and information elements themselves, and more to do with
    the status of the devices, infrastructure, systems, and networks that avail these
    data and information.


    Perhaps one of the most popular risks to `Availability` is having more concurrent
    usage of digital utilities than overall computing resources are able to cater
    for, effectively and efficiently. This could result from non-malicious factors
    such as periods of high service demand that see many users seeking access to the
    digital services that an organization provides – a phenomenon technically referred
    to as “Flash Crowds”. It could also be the outcome of malicious attempts to overwhelm
    computing resources in order to hinder legitimate use – a phenomenon known as
    a “Denial of Service (DoS)” attack; or a “Distributed Denial of Service (DDoS)”
    attack (when it involves enlisting the capacity of other hijacked /compromised
    machines to amplify the impact of the attack).


    However, it is possible to endanger `Availability` through incidents that result
    in data corruption, disconnection/inaccessibility, or erasure, which might result
    from malware activities, system/network malfunction and failure, or human actions
    like disconnecting or disabling system and network connections. In essence, however,
    to compromise the availability of healthcare data is to grind to a halt all such
    uses, functions, and operations that rely on the information that such healthcare
    data provides, whether as part of products or services.


    [Figure 1.3](#ch1.xhtml#fig3) illustrates the triadic relationship between Confidentiality,
    `Availability`, and Integrity when it comes to Healthcare Data (or EHRs).


    ![Figure 1.3 Healthcare Data (EHRs) Invariants.](images/fig3_B.jpg)


    [Figure 1.3 Healthcare Data (EHRs) Invariants.](#ch1.xhtml#R_fig3)


    Generally, these three Invariants also incorporate imperatives for ensuring their
    quality and security. However, these imperatives are usually also a function of
    the standards and rules adopted by existing and binding frameworks for governing
    and regulating data functions, operations, and interactions from a higher level.
    In jurisdictions that consider healthcare data and information essential for the
    preservation and functioning of society, these Invariants are ostensibly the reason
    for classifying the devices, infrastructure, systems, and networks that avail
    these data and information, as “critical infrastructure”.


    Anytime there is a compromise of the invariants of `Integrity`, `Confidentiality`,
    and/or `Availability`, the saying in lay terms often follows – “data has been
    breached”. Although, many times, the use of this phrase may neither correctly,
    nor entirely reflect the true situation of a data incident in reality. However,
    the phrase generally describes the idea that a malicious (and often external)
    attack against a data invariant has turned out successful. In reality, however,
    data incidents may not necessarily be a handiwork of malicious entities attacking
    from the outside only. It could also be the result of a naive (possibly inadvertent),
    or malicious (usually intentional) insider action or operation; or a system failure/malfunction,
    in which case it could more correctly be referred to as a “leakage”.


    It is also important to note that within the domain of healthcare, the `Confidentiality`
    of data is often the most attacked of all three, since it tends to bring the most
    direct reward to attackers. Attacks against `Availability` and `Integrity` more
    often aim to cause reputational damage and loss of revenue.


    ## Healthcare Information Communication Technology and People


    The healthcare sector is one in which ICTs and people frequently interface and
    interact for various purposes. These people could include non-technical users
    like patients, caregivers, nurses, pharmacists, public health professionals, volunteers,
    and visitors, as well as technical users like system and network administrators,
    cleaners/janitors, doorkepers, and guards. Some of these individuals harness the
    utilities and capabilities of ICTs (otherwise known as eHealth) to perform and
    support various uses, functions, and operations to ensure they are performing
    securely, optimally, and productively. Yet others work to ensure that the environments
    where these ICTs are domiciled remain ideally safe, healthful, and comfortable.


    Unfortunately, however, these people/user groups the majority of whom are often
    untrained in the discourse of cybersecurity have frequently posed the most formidable
    fault lines. Several independent reports including by cybersecurity giant Kaspersky
    these various groups have often presented the human lapses through which cybercriminals
    have continued to scourge the healthcare sector. In some cases, these criminal
    operations have been abetted (even unwittingly) by human actions of naiveness,
    inadvertency, unawareness, disinterestedness, unscrupulousness, and recklessness;
    while in other cases, they have been catalysed by innate human feelings and emotions
    of desperation, love, altruism, nonchalance, hatred, disgruntlement, malice, avarice,
    and discontent. This framework of actions and sentiments generally increases the
    susceptibility of these user groups to maliciously intended schemes and strategies.


    On some occasions, the devices that they bring with them to participate in the
    digital spaces around healthcare facilities have unknowingly participated in cybersecurity
    incidents. These digital spaces could be those that enable remote work or support
    on-site work. However, when these devices – which could be poorly secured, not
    well-configured, shared devices, or laced with malware – connect to digital spaces
    that are otherwise secure, they carry across this framework of vulnerabilities
    and apparently undermine the security status of these digital spaces.

