    此外，还存在跨境传输电子健康（eHealth）数据和信息的担忧，其目的是提高数据主体（患者）可获得的医疗服务质量，而其他司法管辖区可能适用完全不同的数据保护、消费者保护和法律责任体系。因此，电子健康监管的另一个目标是建立一套原则和规范，使其与多个司法管辖区的现有法律和谐统一，并尽可能地减少冲突。


    医疗保健行业处于一种近乎不断的蜕变状态。这体现在医疗保健和医疗程序的定期进展上，产生了需要监管审查的新型实践和应用；运营和服务交付范围的不断扩张，使得需要对现有法规进行定期审查；创新技术（如物联网）的频繁出现揭示了需要规范和标准化的新用例和用途；以及需要监管审查并可能需要重组所有结构的合并与收购。


    所有这些现实直接和间接地影响着有关电子健康监管的目标，有时会产生新挑战，或使现有挑战变得更加复杂。无论如何，在这样一个动态且复杂的环境中，电子健康监管对于维护电子健康在现代医疗交付中提供的效用仍然不可不可缺的。


    ## 重要的国际立法


    某些国际立法有助于阐明监管在尝试实现以下目标时面临的一些挑战的背景：明确性质、确立范围，并保护涉及全球医疗服务交付的涉及电子健康系统和应用交互的完整性。这些国际立法试图在任何涉及信息通信技术的医疗服务交付各个方面，定义并规范最佳实践标准、伦理、责任、程序和操作。这些立法通常在全球性的全球框架内进行定位和探索，该框架包含了对电子健康安全、可靠、伦理和人文应用更广泛接受的考量。


    ### 特别是世界卫生组织（WHO）关于电子健康法律框架的报告


    《世界人权宣言》（UDHR）特别引用 `Article 12`，规定隐私是一项普遍人权。声明：“任何人都不受对其隐私、家庭、住宅或通信的任意干涉，也不受对其荣誉和名誉的攻击。人人都有权享受法律保护，免受此类干扰或攻击。”通过这种方式，司法管辖区监管的责任和边界得以确立。这要求此类司法管辖区监管提供防止个人隐私受到任意侵犯的保护，同时还要确保监管本身不违反这一特定规定。这一规定也出现在另一项国际立法——《公民权利和政治权利国际公约》（`ICCPR`）的
    `Article 17` 中。


    事实上，`ICCPR` 的 `Article 17` 通过 `General Comment (No. 16)` 为 `UDHR` 的 `Article 12`
    提供了更多背景，该注释认为：


    > 在计算机、数据银行和其他设备上收集和持有个人信息，无论是由公共机构还是私人个人或实体，都必须受到法律的监管。国家必须采取有效措施，确保有关个人生活的信息不会落入未经授权接收、处理和使用这些信息的人手中，且绝不用于与公约不符的目的。为了对其私人生活获得最有效的保护，每个人都有权以易于理解的形式确定自动数据文件中存储了哪些个人数据（如果有的话），以及这些数据出于什么目的。每个人还应该能够确定哪些公共机构或私人个人或实体控制或可能控制他们的文件。


    此外，《欧洲人权公约》（`ECHR`）的 `Article 1` 在以下情况下包含这些例外：

    1. 数据处理符合患者或在当时身体或法律上无法做出同意的另一人的核心利益；

    2. 数据处理是为了预防医学、医学诊断、提供护理或治疗，或医疗服务的管理所需，且相关的个人数据由医疗专业人员处理；以及

    3. 在处理过程中存在重大的公共利益或对公共安全的关注。


    这些重要的国际立法极大地帮助完善和过滤了与当代知情同意、隐私、身份和自主权，以及涉及个人数据的其他数字权利等问题相关的监管责任的范围和背景。事实上，它们启发了不同地区出现的监管和立法努力，例如《非洲联盟网络安全和个人数据保护公约》：即《马拉博公约》（`Malabo
    Convention`）。


    ## 管理与行政的角色与责任


    正如之前强调的，医疗机构在电子健康方面管理和行政的角色与责任通常倾向于统一治理的多利益相关者利益、伦理的必要要求以及监管要求，使电子健康应用与业务目标保持一致，同时保留其在医疗服务交付中的效用。现在，如何实现这一目标通常证明是困难的部分。


    在这一方面的启动阶段，重要的是医疗机构要机会评估电子健康为业务连续性带来的潜力和前景，然后决定哪些医疗信息通信技术、工具和资源对其业务模式的成功具有最重要的益处。例如，在管理大型客户群的记录时，从长期来看，维持手工（纸质）记录管理模式是不可行且低效的。同样，随着门诊服务的开始扩大，可能有必要以一种患者可以触及的方式提供医疗服务，即使是在医疗机构之外。


    这些是为增强业务连续性有效性的可能考虑因素，可能会影响医疗机构采用医疗信息通信技术的决策。但在此时，同样关键的是确保有关数据、基础设施、系统与设备、人员与用户、合规性，以及适用于此类方面的伦理、安全、风险及事件管理和技术支持的其他运营最佳实践都得到了审慎的考虑。


