    **Emmanuel C. Ogu** 是一位资深计算机科学家、特许 IT 专业人员、数字权利与自由倡导者、网络安全专家、技术治理与数字发展专家以及可持续发展研究人员。他是
    2020 年互联网学会（ISOC）派往互联网治理论坛（IGF）的青年大使，在公共政策、可持续发展和互联网治理领域内的网络安全与信息技术交叉领域拥有超过 7
    年的累计工作经验。


    # 1 网络安全基础与电子健康概述


    DOI: [10.1201/9781003254416-1](https://dx.doi.org/10.1201/9781003254416-1)


    ## 引言


    2018 年 7 月，新加坡卫生部和网络安全局收到了一份关于新加坡综合医院（SingHealth）数据泄露的报告——SingHealth 是新加坡最大的医疗机构集团。此次泄露导致在为期一周内有
    150 万条个人数据记录被盗取，并进一步针对了约 16 万名患者的门诊药物信息。


    这些患者是在 2015 年 5 月 1 日至 2018 年 7 月 4 日期间访问过 SingHealth 专科门诊诊所和综合诊所的个人，其中包括新加坡总理李显龙以及其他高级部长。这一事件被载入史册称为
    `SingHealth` 数据泄露。这是一次备受目的的网络攻击，本可以通过更好的网络安全卫生和实践来避免，且发生时当时全球黑市上的健康数据价格至少为 50
    美元。`SingHealth` 数据泄露揭示了 SingHealth 在网络安全框架方面的大量技术和非技术性疏忽；据信，一个被描述为隐蔽、“高技巧、耐心且持久”的攻击者策划了这次泄露。


    最初，综合健康信息系统（IHIS）——负责新加坡公共卫生系统所用信息技术安全的机构——在其中一个托管电子健康记录（EHRs）的数据库服务器上记录到可疑活动后，检测到了该泄露。初步调查显示，某个前端用户工作站的恶意软件入侵可能为这次臭名昭著的攻击提供了切入点，主谋借此获得了对服务器资源的特权访问，并同样很好地掩盖了他们的数字足迹。


    2019 年 1 月，一份独立的 450 页报告


    总而言之，调查委员会（CoI）的报告将数据泄露的原因归结为 SingHealth 在网络安全认知和概念化方面的关键差距，以及实施方式和实践的问题。


    ## 网络安全基础与电子健康概述


    `SingHealth` 网络攻击是近年来使全球医疗行业成为负面媒体关注焦点的几起备受目的事件之一，并引发了巨大的公众抗议。在这些事件的轨迹中，频繁出现了一些共同主题，包括网络安全意识薄弱、系统和基础设施安全实践健康、政策和治理框架的缺失，以及对网络安全概念化和理解的不足。


    这些主题凸显了反复出现的相似性，这说明了这样一个现实：在现代信息通信技术的推动下，全球医疗领域各种电子健康创新、系统和应用的普及和增长已经创造并维持了一个威胁领域。在这个威胁领域，政策和监管难以跟上发展速度，标准化面临多重背景挑战，而技术能力在很大程度上匮乏。尽管如此，后果仍然是严重的。


    因此，我们最终面对的是犯罪分子眼中一个软性的、高价值的目标，他们继续为了财务利益而肆掠全球医疗行业。旷日未决的集体诉讼、由于巨额赔偿支付导致的财务能力紧张，以及在许多圈子引发辩论并产生的不信任情绪和声誉受损。这一切都是这一不幸交织的直接影响。


    ## 2020 年医疗健康网络安全报告


    本章将网络安全介绍为一个多维度的概念，概述了电子健康及其在现代医疗各领域的各种应用，同时讨论了医疗健康数据以及适用于这一独特数据类的不变性。此外，本章还讨论了用户与信息通信技术（ICTs）的交互，这是医疗健康网络安全事件根本原因的核心。


    ## 作为概念的网络安全


    网络安全是一个复合的多维度概念，有许多现有定义。然而，这些定义中最好的强调了四个面板，作为构成网络安全的四个方面。它们是`信息技术资产`、`人员/用户`、`流程`和`策略`。


    `图 1.1` 描绘了这一概念化。


    ```

    ![图 1.1 网络安全的四个个面板](img/fig1.jpg)

    ```


    图 1.1 网络安全的四个面板


    `信息技术资产`包含电子健康部署中的基础设施、系统、平台和设备。这些包括在现场和离线托管数据和服务以提供实用功能的服务器和平台、提供这些功能的网络介质，以及用于访问这些功能的终端系统和设备。这些系统和设备可能包括手机、电脑、平板电脑设备和其他信息技术（IT）系统。


    `人员/用户`指为了各种目的与基础设施进行交互的人类代理。他们可能是依赖基础设施提供的功能来提供服务的人员、从这些提供的服务中获益的客户（这有时要求他们直接/间接地与基础设施交互），或依靠基础设施为组织提供服务的供应商。


    `流程`是指由基础设施提供的服务和功能支持的各种组织操作。它们可以包括广泛的活动，从客户服务、销售、采购、审计和分销，仅此类。


    `策略`是组织范围内的准则，指导和规范基础设施、人员和流程围绕数据和信息等关键组织资产的运行和相互作用。在最优秀的部署中，这些准则的设计与业务运营行业更广泛接受的最佳实践保持一致。


