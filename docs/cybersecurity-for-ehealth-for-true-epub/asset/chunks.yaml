    The sets and sequences of processes and operations that are put in place for the
    purpose of preserving security and ensuring other security-related functions.


    ### Server

    A hardware or software computing system that functions primarily to provide utility
    and services to other programs, systems, and devices (often referred to as “clients”)
    that connect to it.


    ### Shoulder Surfing

    The practice of spying on users by looking over their shoulders as they use applications
    or digital electronic devices, often with the motive of learning sensitive user
    information (such as usernames, passwords, secure URLs, etc.).


    ### Smash ‘n’ Grab

    An operation that involves a malicious actor quickly smashing through a security
    or other barriers to lay a hold on valuables.


    ### Social Engineering

    The usually malicious practice of posing as a trusted entity in order to deceive
    individuals/users into taking actions or divulging (sensitive) information that
    they might otherwise not have inclined to.


    ### Spoofing

    The often-malicious impersonation of an authorized entity in digital communications
    in order to attain/receive privileges, utilities provided to the authorized entity
    by a system or network. It is a form of identity theft.


    ### Subversion

    The malicious process of bypassing or over-running the control functions of a
    digital computing system or resource, often for the purpose of gaining unauthorized
    access.


    ### Tailgating

    The practice of gaining unauthorized access to a usually secure or restricted
    location/facility as a result of bypassing physical security and access measures
    by tagging someone closely enough. Otherwise referred as `Pigbacking`.


    ### Threat Actors

    Human or non-human individual or group that seek to compromise the security of
    computer systems or networks for malicious purposes.


    ### Threat Landscape

    An anthology of threats that are native to a specific context or domain, about
    what risks they present, what the trends they manifest.


    ### Transloading

    The process of transferring malicious payload between or across systems, devices,
    or other digital media.


    ### Two-Factor Authentication

    A form of authentication that requires users to present more than one type of
    information for identity confirmation/verification.


    ### Uniform Resource Locator (URL)

    An identifier that references a resource on a local network, or the World Wide
    Web/Internet. It is otherwise referred as a web address.


    ### Unstructured Supplementary Service Data (USSD)

    A protocol that enables users’ mobile devices to communicate with service providers
    using short codes and special characters like `*` and `#`.


    ### Virtual Private Networks (VPNs)

    An encrypted connection that links a device to a network across the open Internet
    – providing a reliable means for transmitting data without the risk of interference.


    ### Virus

    A malware that propagates by binding itself to files and is able to inflict damage
    according to instructions contained in its program.


    ### Vishing

    A form of Social Engineering that involves an attacker posing as a trusted entity
    in voice-based communication (e.g., phone calls, audio messages).


    ### Wardriving

    The act of locating wireless network access points around various locations with
    the aim of exploiting successful connections to such access points. Sometimes
    referred as Access Mapping.


    ### Website

    A collection of web pages that feature content about a person, organization, technology,
    or other entity/phenomenon and is tied to a particular name that makes it discoverable
    on the Internet.


