  trans: "\n\n定期模拟真实网络攻击条件和操作的渗透测试，也有助于为组织框架、结构、流程和政策的安全性韧性提供有用的见解。这些对于识别威胁数据和信息安全的裂缝至关重要，这些裂缝可能会对部署了信息通信技术用于医疗/健康服务提供的医疗机构的安全状况造成颠覆性影响。\n\
    \n此外，还有必要确保第三方供应商、子公司和关联公司承担着与母级医疗机构相同的数据和信息安全标准。许多时候，我们可以看到这些第三方的疏忽无论是有意还是无意地制造并持续了漏洞，最终对母级机构产生了负面影响。\n\
    \n归根结底，在电子健康（eHealth）背景下，数据和信息的安全仍然医疗机构的责任，这种责任在监管面前是推卸的。在引入各种其他参与者和主体与医疗信息通信技术对接时，医疗机构的风险表面扩大了，尽管责任仍然是神圣的。当这些参与者和主体理解了用于确保完整性、保护隐私、维护机密性以及保证可用性的措施和机制时，他们能够更好地合作并支持现有的措施和机制，以实现预期目标和结果。\n\
