  trans: '

    同样，间谍软件秘密地将有关计算机运行和活动的数据及信息传输给外部恶意攻击者，而根基包（rootkits）允许对系统、设备和用户应用程序进行后台/后门访问，并掩盖其存在和操作以规避检测。同样，逻辑炸弹是构建在应用程序中的恶意软件，在满足特定逻辑条件时激活某些恶意行为。而自动运行脚本是恶意代码，一旦它们与系统及设备对接界面就会自动激活，使它们能够绕过常规的安全检查。


    恶意软件协调对电子健康服务和医疗运营造成巨大破坏和引发严重混乱的能力已广为人知。它们能够在患者的扫描结果和影像报告中添加虚假信息和标记，以误导医疗诊断并损害医疗服务的完整性。此外，它们还可以自动转储或大量提取敏感的个人健康相关信息；篡改医疗监测设备的读数；并更改通过电子输液泵和阀门输送的剂量。恶意软件还能秘密下载其他恶意组件（通过被称为“路过式下载”的策略），并让恶意外部攻击者在医疗机构的数字运营中获得持久的足点。事实上，恶意软件对全球医疗行业构成的威胁影响是一个完全值得畏惧的危险。


    ## 相关基础设施


    企业医疗基础设施的功能通常是为有效利用参与系统和设备提供平台，以支持医疗流程和运营。因此，针对医疗基础设施的威胁和攻击目标是受支持和授权的`Systems`与`Devices`
    传输的`Data`以及`Information`/`Signals`信息/信号），旨在瘫痪依赖于它们的组织`Processes`和`Operations`。


    这些威胁和攻击通常采用旨在侦查和枚举、拦截数字/电子通信以及干扰服务的方法。这些方法包括无线劫车（wardriving）、拒绝服务（DoS）、高级持续性威胁（APT）和中间人攻击（MITM）。在许多情况下，当医疗基础设施受到恶意攻击者的威胁时，跨这些基础设施传输的数据和信息已经面临风险。这还包括处理、存储和传输这些数据与信息的系统和设备，以及依赖这些活动的组织流程/运营。事实上，在这一阶段，其中一个或多个目标已经存在被破坏的可能性。


    无线劫车简单是指在移动车辆中搜索医疗设施周围的 Wi-Fi 网络连接的行为，通常带有恶意意图。有时，这种车辆可能是摩托车或自行车，在这种情况下，它们通常分别被称为“无线劫车骑”（warbiking）和“无线劫车单”（warcycling）。通过这种方法，恶意攻击者能够发现并锁定接入私内部网络的开放访问连接。从而获得投放恶意软件、在组织网络上伪造身份或执行“抢夺”行动的手段，以窃取可能用于各种恶意目的的敏感医疗数据和信息。


    此外，可能应用 MITM 技术来有效搜索、拦截，并在某些情况下篡改或重路由数字电子通信。目前已发现大量用于 MITM 操作的工具和技术，包括位翻转、网络嗅探器和分析器，以及网络协议和服务中的隐藏隧道。此外，信号干扰发生器/干扰发生器也被用于阻塞安全和警报系统以及基础设施从传感器/探测器向执行器/效应传输的信号和信息。


    DoS 是一种威胁攻击方法，旨在临时或不确定地拒绝服务和服务公用设施（医疗系统、服务器、网站等）的合法使用和访问。实现这一目标的方法之一是让这些服务和公共设施陷入无用且无效的活动中，例如处理和响应毫无意义的数据包和请求。这拒绝合法用户访问此类服务和服务公用设施。然而，DoS
    也可能是其他类型恶意软件（如勒索软件和蠕病毒）的行为和活动的结果，以及无意的人为操作，例如意外禁用连接或绊倒网络硬件。


    通常，攻击者积极寻求扩大和放大 DoS 操作影响的方法，通常会考虑几种方案。其中之一是劫持/破坏同一基础设施内的其他用户机器，通过感染一种名为`bot`的控制恶意软件将它们纳入一个中央控制框架；然后在一个受
    `bot` 感染的机器网络（称为`botnets`）中将它们全部招用于这种恶意操作。另一种考虑是窃取目标基础设施内用户机器的数字身份，然后将这些身份分配给攻击者控制的外部机器，然后再协调它们进行这项恶意活动。当
    DoS 攻击以这种方式获得分布式支持时，从技术上讲，发生了分布式拒绝服务（DDoS）。


    高级持续性威胁（APT）应用了一系列复杂的隐蔽且不干扰的技术，在获得对医疗基础设施的未经授权访问后，掩盖其足迹并长期规避检测。在 APT 中反复发现的协调和资源方面具有稳健、高容量特性，这支持了一个逻辑推理：应用
    APT 作为策略的威胁代理/攻击者通常是国家级实体，或非国家实体赞助的恶意组织。他们可能将医疗机构作为对更大目标实体进行间谍活动的的幌子。


    在 APT 中看到的协调水平反映了它们能够稳健地整合跨阶段的各种策略、工具和技术，这些技术逐渐但系统地构建起攻击目标或结果。


    ## 相关流程/运营


    在医疗背景下，针对流程/运营的威胁旨在扰乱和困扰安全`Resilience`（韧性），并利用支持`Efficiency`（效率）的组织流程和运营中的安全疏忽。实现这一目标的常用方法是颠覆/绕过安全协议和常规程序，通常通过幼稚的内部人员或恶意外部人员的操作。


    事实上，在医疗领域，流程和运营的设计和建立通常旨在保持组织业务模式的效率，并赋予应对冲击和中断的韧性。然而，在应用这些流程和运营来加强和维护医疗机构的安全状态时，任何颠覆或绕过它们的尝试事实证明与组织的长期安全目标相悖。


    ## 相关政策


    在电子健康的网络安全威胁格局，政策（Policies）很少是恶意威胁攻击者的最终目标。然而，这些威胁攻击者继续探索政策保护组织资产、流程/运营和利益的`Robustness`（稳健性）和`Effectiveness`（有效性）程度，试图发现提供恶意优势的漏洞和不足。

