  trans: "\n例如，即使对于遭受终末期疾病甚至可能处于死亡边缘的个人，个人尊严权也必须得到维护。治理医疗数据如何处理、访问和管理的多利益相关方规范框架也必须谨慎遵守。患者医疗数据的处理和管理必须符合更广泛的可接受最佳实践，以及广大公众的最大利益。作为患者且患有某些疾病的人员，其安全通常也依赖于保持其医疗记录的私密性和安全性。虽然有时，医疗数据和系统也可能成为外部干扰威胁国家主权的途径。\n\
    \n然而，在这一复杂困局的核心，存在着一项共识，即电子健康记录或患者医疗数据应保持合理的信誉度、可访问性、私密性，并免受未经授权的干扰、披露、使用、处理、传输以及其他数据相关操作和交互的侵害，特别是那些未能直接且透明地确保数据主体本身获得知情同意的操作。在多个司法管辖区，已建立独立的监管机构，通过运行和应用载入`法案`和`法规`中的一系列指令和规范，来保护并确保`医疗数据`的`不变性（Invariants）`。\n\
    \n对于医疗机构而言，斗争不仅关乎对现有法规的合规；还关乎在服务交付中建立透明度和信义责任的声誉。医疗机构确保电子医疗数据和信息具有充分且有效的安全及风险管理的意识日益增强，加之监管在催化这种意识方面发挥的作用，以及许多司法管辖区政府对违规和违反规定的行为的响应，揭示了这场斗争的非同寻易性。\n\
    \n尽管几个政府（如美国）已经建立了在医疗等领域激励技术“有意义的使用”的框架，但未能满足针对安全、可靠和负责任的应用所需的规定，其监管后果可能会迅速降低此类激励措施所提供的效用和优势。\n\
    \n## 完整性、机密性与可用性：不变且不可妥协\n\n`完整性`、`机密性`和`可用性`对于`电子健康`为全球医疗提供的效起着至关重要的作用。事实上，它们的作用是不可缺的。正如`第一章`中所强调的，这可以归于多种因素和现实。以下是近期全球医疗领域发生的事件中所发挥过的几个因素。\n\
    \n2017 年，据报道，位于马萨诸塞州威斯特伯勒勒（Westborough）、为美国医疗机构提供供应商服务的云端电子健康记录系统 `eClinicalWorks`\
    \ \n\n这些指控包括：在患者屏幕上定期显示错误的医疗信息图表、在单一视图中定期显示多个患者的医疗信息、在特定工作流的进展记录中未能准确显示病史，以及审计日志未能准确记录用户行为，指控医疗供应商\
    \ `eClinicalWorks` 违反了信义责任并存在严重疏忽。\n\n这一事件揭示了可靠且可信的数据和信息操作对医疗交付业务的重要性。事实上，每当医疗数据和信息的真实性产生怀疑时，整个关注案例的`电子健康`操作流程链（无论是产品还是服务）的效用就会被中断。这还预示着对生命和安全的潜在的危害影响。因此，`ECRI\
    \ 学院`（原急急护理研究所）在 2019 年的一份报告中\n\n2018 年的一起事件\n\n这意味着大量的医疗工作者和专业人士——非医务人员、心理学家、营养师和其他专业人士——通过虚假档案，能够访问患者的电子医疗记录，即使这些患者与其医疗专业、医疗工作或雇佣职责毫无关系。\n\
    \n这起事件揭示了一个不可妥协的事实：医疗数据和信息应仅对获得授权的个人开放，这些人员需要此类数据来执行某些定义的医疗或医学功能，以符合数据主体的最大利益。同时还要确保在如何访问和使用此类数据方面获得知情同意。\n\
    \n另一个涉及 `Cignet` 的案例（一家在美国马里兰州南部运营多家医疗机构的医疗服务）涉及 41 名在 2008 年 9 月至 2009 年 10 月期间请求访问其医疗记录的患者。该医疗机构连续几个月未能满足这一请求。尽管当时`HIPAA`中的规范要求医疗机构必须在收到请求后\
    \ 30 天内向患者提供医疗记录副本，最晚不超过 60 天。\n\n2010 年 3 月 30 日，美国司法部卫生健康服务部（`HHS`）民事权利办公室（`OCR`）对马里兰州乔治王子县的\
    \ `Cignet` Health 获得了缺席判决，原因为其违反了多项`HIPAA`的监管规范。尽管 `Cignet` 已于 2010 年 4 月 7 日向\
    \ `OCR` 提交了医疗记录，但这已超出要求的截止日期几个月。`Cignet` 因这一违规行为被处以 130 万美元的民事罚款。\n\n虽然本案中尚未明确导致缺席的原因，但该事件提供了一个清晰的视角，说明了在请求或需要时确保医疗记录随时可用的必要性。\n\
    \n在另一起事件中\n\n通过这起事件的视角，也许更清楚地解释了为什么`可用性`是医疗数据的不变量，以及为什么医疗法规在医疗背景下，对于确保数据和信息可用性相关事务的快速访问和响应具有极高的重视。\n\
    \n"
- fmt: '

    It is no gainsaying that the essence of information technology (or eHealth) applications
    in healthcare has been primarily for the purpose of ensuring that access to quality
    healthcare services is available ubiquitously and without any form of confinement
    or incapacity that is imposed as a result of geographic location, mobility, or
    similar constraints. Whereas, the utility that is provided in this context relies
    on medical/healthcare data and information being available in just the same manner,
    and particularly in a way that can be trusted as accurate and reliable for informing
    medical/healthcare diagnosis and decisions.


    All of these crumble when `Integrity` is compromised. So, how then can `Integrity`
    be ensured in healthcare applications of information technology (eHealth)?


    ### 1. One school of thought that has been widely considered in this regard is
    allowing patients (frequent/periodic) access to their healthcare/medical data.
    The reality of device sensors with wide error margins, as well as the possibility
    of interceptions and alterations that could occur at different points in the data
    processing/operations chain are facts that have been more evident by recent events.
    By allowing patients access to their data at various points in the processing/operations
    chain, it adds a layer of interest-based verification that can be relied upon
    as the chain continues to scale. The logic is pretty simple: no one can be more
    interested in the accuracy of medical/healthcare records than the patients themselves.


    However, this does not in any way diminish the responsibilities attributed to
    healthcare organizations for safely collecting these data and information, as
    well as processing and storing them in a reliably secure manner. Therefore, in
    no respect can this layer of verification be construed to mean a shift or relegation
    of this responsibility.


    It is also important to realize that hackers can be patients too (or pose as one).
    Hence, security measures must be in place in this context to verify the identities
    of individuals (patients) requesting access to healthcare data over eHealth deployments,
    and also to ensure that these individuals (patients) are only able to access their
    data, their data alone, and nothing but their data.


    Biometric authentication has frequently been explored as a foolproof way of verifying
    individual identities for this purpose. Additional measures like firewall restrictions,
    honeypots, and intrusion detection/prevention systems, have also been applied
    in several contexts to restrict what can be accessed and viewed under such circumstances,
    while also watching for anomalous behaviours that are suggestive of malicious
    intent and operations.


    ### 2. Maintain log files at various points of the data processing and operations
    chain, for the purpose of tracking and checking whenever errors are suspected
    or confirmed. Audit logs are indispensable to the goal of ensuring integrity in
    the management of electronic medical/healthcare data and information. This is
    because in many cases, when infractions are being investigated, audit logs provide
    a way of establishing or disproving corporate irresponsibility on the part of
    the healthcare organization. Beyond this, it also helps healthcare organizations
    during routine checks, to be able to flag red points in their operations and process
    chains, which could compromise their risk standing.


    All of these are possible because audit logs help to trace the points of origin
    when integrity issues emerge. It provides a means of identifying what might have
    been the cause of such issues, as well as determining what technical, structural,
    or operational measures would have helped avert such occurrences at the organization-wide
    level.


    ## Safeguarding Privacy


    Even though the term “privacy” continues to feature in discussions around healthcare
    cybersecurity incidents, the term itself has no universally accepted definition,
    except such as is defined within the context of regulations that are binding in
    particular jurisdictions. This is because privacy, in its essence, has more personalistic
    dimensions with overlapping considerations that regulations often struggle to
    capture. These include bodily integrity, personal dignity, secrecy, and individual
    autonomy.


    However, privacy remains a top consideration whenever infractions occur. Privacy
    policies help to align the business interests and goals of healthcare organizations
    with the responsibility of safeguarding privacy. Even though beyond this, healthcare
    organizations are often required by regulation to have in place a robust risk
    management plan that would help them proactively assess, detect, mitigate, and
    respond effectively to risks.


    Furthermore, regulations in certain jurisdictions (such as the GDPR of the European
    Union) have specified best practices aimed at preserving privacy from an organizational-to-user
    standpoint. These include:


    - Removing personally identifiable information from healthcare/medical data that
    are collected about patients, and sometimes mapping these to pseudo-identities
    or special tokens that help to distinguish records pertaining to particular individuals
    within digital operations and processes, without necessarily identifying such
    individuals—a technique known as `Anonymization/Pseudonymization`.

    - Collecting very limited amounts of data and information that can be used to
    uniquely identify patients, which is intuitive because the lesser the amount of
    personal data and information that is required of patients who patronize healthcare
    services, the easier it is to keep such personal data and information undisclosed,
    thereby reducing the surface areas of potential internal and external threats—a
    technique known as `Minimization`.

    - Ensuring that privacy considerations are embedded into the very foundational
    stages of conceptualizing, designing, and engineering software and systems for
    use in healthcare—an approach known as `Privacy by Design`.


    `Privacy by Design` can be pursued by making certain that (a) the most stringent
    privacy settings are activated by default in new systems and software (otherwise
    called `Privacy by Default`), (b) proactive privacy measures are incorporated,
    so that risks to privacy can be anticipated and forestalled even before they materialize
    as breaches/incidents, (c) end-to-end security techniques are applied to enforce
    privacy throughout the life cycle of data processes and operations, and (d) sensitive
    data and information are computed and processed securely at all times, at all
    points, and for all purposes.

