    为了保护安全并确保其他安全功能而建立的一系列进程和操作序列。


    ### 服务器

    一种硬件或软件计算系统，其主要功能是为连接它的其他程序、系统和设备（通常称为“客户端”）提供实用程序和服务。


    ### 窥视偷窥

    在用户在使用应用程序或数字电子设备时，通过从他们背后观察来监视用户的行为，其目的通常是为了获取敏感用户信息（如用户名、密码、安全 URL 等）。


    ### 破窗抢劫 (Smash ‘n’ Grab)

    涉及恶意者迅速破坏安全或其他障碍以夺取贵重物品的操作。


    ### 社会工程

    一种通常是恶意的行为，通过伪装成受信任的实体来欺骗个人/用户采取他们原本可能不愿采取或或泄露敏感）信息。


    ### 欺骗

    在数字通信中经常以恶意手段冒充授权实体，以获取/接收系统或网络为该授权实体提供的权限或实用程序。这是一种身份盗窃的形式。


    ### 颠覆

    绕过或接管数字计算系统或资源的控制函数的恶意过程，通常目的是获得未经授权的访问。


    ### 尾随

    通过紧跟某人来绕过物理安全和访问措施，从而获得对通常安全或受限地点/设施未经授权访问的行为。也称为 `Pigbacking`。


    ### 威胁者

    出于恶意目的寻求破坏计算机系统或网络安全的人类或非人类个体或群体。


    ### 威胁格局

    特定背景或领域内原生威胁的汇，关于它们呈现出哪些风险以及表现出哪些趋势。


    ### 负载转运

    在系统、设备或其他数字媒体之间或跨设备传输恶意负载的过程。


    ### 双重身份验证

    一种身份验证形式，要求用户提供多种类型的信息进行身份确认/验证。


    ### 统一资源定位符 (URL)

    引用本地网络或万维网/互联网上资源的标识符。也称为网页地址。


    ### 非结构化辅助业务数据 (USSD)

    一种允许用户的移动设备使用短代码和 `*`、`#` 等字符与服务提供商通信的协议。


    ### 虚拟专用网络 (VPNs)

    一种将设备通过开放互联网连接到网络的加密连接——提供了一种可靠的数据传输手段，且无受干扰风险。


    ### 病毒

    一种通过自我绑定到文件来传播的恶意软件，能够根据程序包含的指令造成损害。


    ### 语音诈骗 (Vishing)

    社会工程学的一种形式，涉及攻击者在语音通信（如电话、语音消息）中伪装成受信任的实体。


    ### 游击 (Wardriving)

    在各个地点寻找无线网络接入点的行为，旨在利用对此类接入点的成功连接。有时被称为接入点映射 (Access Mapping)。


    ### 网站

    一组网页的集合，包含关于某个人、组织、技术或其他实体/现象的内容，并关联一个特定的名称，使其在互联网上可被发现。


