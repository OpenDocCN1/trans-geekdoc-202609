    # 6 Governance, Ethics, and Regulation in eHealth


    DOI: [10.1201/9781003254416-6](https://dx.doi.org/10.1201/9781003254416-6)


    ## Introduction


    The imperatives of governance, the responsibilities of ethics, and the oversight
    of regulation: These are three characteristics that make the adoption of eHealth
    for modern healthcare particularly challenging for many jurisdictions, especially
    the fact that governance structures (both at the national and international levels)
    should be robust and inclusive enough to engender wider unanimity with regards
    to the duties and responsibilities of healthcare organizations that deploy information
    and communication technologies, while also ensuring that broad-based compliance
    is achieved with regards to all the multi-stakeholder regulatory specifications
    and requirements that apply to the deployment of eHealth for modern healthcare.
    Oftentimes, the difficulty for healthcare organizations also arises as a result
    of trying to balance corporate/business interests against the ethical duty of
    preserving trust, transparency, and accountability in the various applications
    of eHealth, and under the oversight function of regulation.


    Nonetheless, and in the light of the current realities that continue to transpire
    in this space, the distinguishing factor for success or failure of healthcare
    organizations that adopt healthcare information and communication technologies,
    relies to a great extent on the effectiveness of the internal frameworks of such
    organizations in (1) aligning corporate interests with the broader consensus of
    governance as pertains to eHealth, (2) minding that the operations of healthcare
    information technologies agree with the wider-acceptable duties and responsibilities
    of ethical practice, and (3) ensuring compliance with all binding regulations
    that pertain to the adoption and deployment of eHealth.


    The goal is to ensure an effective balance between (a) the structures and functions
    of administrative frameworks for internally governing the operations of eHealth
    in alignment with business interests, (b) the wider-acceptable ethical duties
    and responsibilities of adopting healthcare information technologies, and (c)
    the unavoidable necessity of compliance with multi-stakeholder regulatory requirements
    in this regard.


    For healthcare organizations, the persistent reality of threats lingering ever
    so near, in a very dynamic and unpredictable threat landscape, imposes an added
    layer of wariness that becomes rather too risky to relegate, ultimately resulting
    in a convolution of imperatives that must be robustly considered in seeking to
    deploy eHealth in ways that would not ultimately prove inimical to business sustainability
    and continuity in the long term.


    However, the journey to achieving this effective balance and blend of governance,
    ethics, and regulatory compliance in the applications of information and communications
    technologies to healthcare begins by understanding the various goals and considerations
    that apply to governance, ethics, and regulation in the context of eHealth.


    ## Governance, Ethics, and Regulation in eHealth


    **Governance**, in the context of eHealth, refers to the various structures, functions,
    and patterns of authority, engagement, and multi-stakeholder involvement that
    are applied towards safeguarding the utilities of healthcare information and communication
    technologies. According to the World Health Organization (WHO)'
