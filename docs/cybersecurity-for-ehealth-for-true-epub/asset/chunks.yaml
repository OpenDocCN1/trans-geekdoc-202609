    \ reap these benefits because internal governance structures, functions, and operations\
    \ are often fractured at the centre. Indeed, it is fairly easy to boil down cybersecurity\
    \ incidents in healthcare information technologies to lapses and insufficiencies\
    \ in structures and frameworks for governance at the organizational level.\n\n\
