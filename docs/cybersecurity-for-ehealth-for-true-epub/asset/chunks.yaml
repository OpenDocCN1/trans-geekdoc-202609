    # 可用性


    `Availability` 指的是数据元素及其转化的信息在任何时间、任何位点，以及对于所有授权、合伦理且合法的用途、功能和操作，都能始终且及时地被访问——无论现实情况如何，其目的都是为了保持数据和信息的实用性。在许多情况下，这种保证与数据和信息元素本身的关系较小，而与其提供这些数据和信息的设备、基础设施、系统和网络的状态的关系更大。


    `可用性` 最常见的风险之一，是数字工具的并发使用人数超过了总体计算资源能够有效且高效提供的能力。这可能源于非恶意的因素，例如在服务需求高峰期，有许多用户寻求访问组织提供的数字服务——这种现象在技术上被称为“突发性流量（Flash
    Crowds）”。它也可能是恶意企图通过压垮计算资源来阻碍合法使用的结果——这种现象被称为“拒绝服务（DoS）”攻击；或者是一个“分布式拒绝服务（DDoS）”攻击（当涉及招募其他被劫持/受损机器的能力来放大攻击影响时）。


    然而，可能会通过导致数据损坏、断开/无法访问或删除的事件来危及`Availability`，这些事件可能是由于恶意软件活动、系统/网络故障和失效，或者是断开或禁用系统及网络连接等人类行为造成的。但本质上，损害医疗数据的可用性意味着停止所有依赖此类医疗数据所信息的用途、功能和操作，无论这些是作为产品还是服务的一部分。


    图 1.3 展示了医疗数据（或 EHR）中机密性、`Availability`和完整性之间的三者关系。


    ![图 1.3 医疗数据 (EHRs) 不变性](img/fig3_B.jpg)


    图 1.3 医疗数据 (EHRs) 不变性。


    通常，这三个不变性还包含了确保其质量和安全的指令。然而，这些指令通常也取决于现有且具有约束力的框架所采纳的标准和规则，这些框架从更高层次上治理和监管数据功能、操作和交互。在认为医疗数据和信息对于社会的保护和运行至关重要的司法管辖区，这些不变性表面上是将提供这些数据和信息的设备、基础设施、系统和网络归类为“关键基础设施”的原因。


    当`Integrity`、`Confidentiality`和/或`Availability`的不变性遭到损害时，俗语通常是——“数据泄露了”。尽管很多时候，这个短语可能既不能正确也不能完全反映现实中数据事件的真实情况。然而，该短语通常描述这样观点：针对数据不变性的恶意（通常是外部的）攻击已证明成功。但实际上，数据事件并不一定是外部恶意实体攻击的结果。它也可能是天真（可能无意的）的或恶意（通常是故意的）的内部人员行为或操作的结果；或者是系统故障/失效，在这种情况下，可以更准确地称之为“泄露”。


    同样重要的是，在医疗领域内，数据的`Confidentiality`通常是三者中最受攻击最频繁的，因为它往往能给攻击者带来最直接的回报。针对`Availability`和`Integrity`的攻击更多是为了造成声誉损害和收入损失。


    ## 医疗信息技术与人


    医疗部门是一个 ICT 与人员为了各种目的频繁进行接口和交互的领域。这些人可能包括非技术用户，如患者、看护人员、护士、药剂师、公共卫生专业人员、志愿者和访客，以及技术用户，如系统和网络管理员、清洁工/用工、门卫和安保。其中一些人利用
    ICT 的工具和能力（又被称为电子健康）来执行和支持各种用途、功能和操作，以确保他们的执行是安全、优化且高效的。另一些人则致力于确保这些 ICT 所在的环境保持理想状态的安全、健康和舒适。


    遗憾的是，这些人员/用户群体（其大多数人在网络安全话语方面往往没有经过培训）经常构成了最严峻的断层。包括网络安全巨头卡巴斯基在内的若干独立报告指出，这些群体经常表现出人为疏忽，网络分子通过这些疏忽持续肆虐医疗行业。在某些情况下，这些犯罪活动得到了人类天真、无意、无知、漠不、不廉耻和鲁莽行为（即使是无意的）的助长；而在其他情况下，它们被人类天生的绝望、爱、利他主义、漠不在、仇恨、不满、恶意、贪婪和不满等感觉和情感所催化。这种行为和情感的框架通常增加了这些用户群体对恶意计划和策略的敏感性。


    在某些场合，他们带入医疗设施周围数字空间的设备在不经意间参与了网络安全事件。这些数字空间可能是那些实现远程工作或支持现场工作的工作。然而，当这些设备——可能是安全防护不力、配置不当、共享设备或带有恶意软件的设备——连接到原本安全的数字空间时，它们会携带这一脆弱性框架，并显然破坏了这些数字空间的安全状态。


