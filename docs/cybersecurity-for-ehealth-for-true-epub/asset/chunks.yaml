    For instance, the right to personal dignity must be preserved even for individuals
    who are suffering terminal ailments, and might even be at the point of death.
    The multi-stakeholder frameworks of regulatory specifications governing how healthcare
    data are to be handled, accessed, and managed must also be circumspectly adhered
    to. The handling and management of patients’ healthcare data must align with wider
    acceptable best practices, as well as the best interests of the greater public.
    The security of persons who are patients and suffering certain medical conditions
    may also often rely on keeping their healthcare records private and secure. While
    sometimes, healthcare data and systems could equally provide an avenue through
    which external interference could threaten the sovereignty of a state.


    However, at the centre of this quagmire of complexities is a consensus regarding
    the fact that electronic health records or patients’ healthcare data are to remain
    reasonably trustworthy, accessible, private, and protected against interference,
    disclosure, usage, processing, transmission, as well as other data-related operations
    and interactions that are unauthorized, especially such that fails to directly
    and transparently secure the informed consent of the data subjects themselves.
    In several jurisdictions, independent regulatory agencies have been established
    to safeguard and ensure the `Invariants` of `Healthcare Data`, by operating and
    applying a body of prescriptions and specifications enshrined in `Acts`, and `Regulations`.


    For healthcare organizations, the struggle is not just with respect to compliance
    with existing regulations; it also pertains to building a reputation of transparency
    and fiduciary responsibility in service delivery. The growing awareness of the
    duty of healthcare organizations to ensure adequate as well as effective security
    and risk management for electronic medical data and information, coupled with
    the regulatory roles that have been played in catalysing this awareness, and the
    responsiveness of government to infractions and violations in many jurisdictions,
    reveal the non-trivial nature of this struggle.


    Even though several governments (such as the United States) have established frameworks
    for incentivizing “meaning use” of technology in domains such as healthcare, the
    regulatory repercussions for failing to meet the requirements specified for safe,
    secure, and responsible applications can quickly dwindle the utility and advantage
    that such incentives offer.


    ## Integrity, Confidentiality, and Availability: Invariant and Non-Negotiable


    `Integrity`, `Confidentiality`, and `Availability` play a crucial role in the
    utility that `eHealth` offers for global healthcare. Indeed, their role is indispensable.
    As highlighted in `[Chapter One](#ch1.xhtml)`, this can be attributed to a number
    of factors and realities. Here are a few of them that have played out in happenings
    within the global healthcare sector in not-too-distant times passed.


    In 2017, `eClinicalWorks`, a cloud-based electronic health records system that
    provides vendor services to healthcare organizations in the United States from
    Westborough, Massachusetts, was reported


    These allegations included periodically displaying incorrect medical information
    charts on patient screens, periodically displaying medical information for multiple
    patients concurrently on a single view, failing to display medical history accurately
    on progress notes in specific workflows, as well as audit logs that failed to
    accurately record user actions, alleging a breach in fiduciary responsibility
    and gross negligence on the part of the healthcare vendor – `eClinicalWorks`.


    This incident reveals the importance of reliable and trustworthy data and information
    operations to the business of healthcare delivery. Indeed, whenever the veracity
    of medical data and information becomes in doubt, then the utility of the `eHealth`
    operations and process chain is truncated for the entire case in focus (whether
    they be products or services). This also portends potentially harmful implications
    for life and safety. Therefore, it is little wonder that the `ECRI Institute`
    (formerly, `Emergency Care Research Institute`) in a 2019 Report


    A 2018 incident


    This meant that a wide range of healthcare workers and professionals – (non-medical)
    staff, psychologists, dietitians, and other professionals, through false profiles,
    were able to access the electronic medical records of patients, even for those
    patients that had nothing to do with their medical speciality, healthcare work,
    or duty of employment.


    In this incident was revealed the non-negotiable fact that healthcare data and
    information are to be kept only accessible to authorized individuals who need
    such data to perform certain well-defined healthcare or medical functions that
