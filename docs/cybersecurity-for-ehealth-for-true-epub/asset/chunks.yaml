    ## 2. 维护组织环境的完整性


    悬挂的网络线（以太网）、未盖盖或损坏的接线盒和电线槽、为了连接端端设备而运行距离很长（有时是公共可访问区域）的布线、位于医疗设施周围无身份标识且无法追踪的数字/电子设备——这些都是许多医疗组织中常见的环境现象，并对网络安全产生影响。硬件数据包嗅器、键盘记录器、信号干扰器/干扰发生器以及网络扩展器/重复器已经通过这些手段成功挂接到电子健康系统和基础设施上，并在很长时间内不被发现。


    因此，当布线必须跨越相当距离且不首选无线方案时，线管通道是一个推荐选项。但当这些通道的物理完整性受到破坏时，必须迅速修复。同样，不使用或不再使用的网络线应该切断接头并停止，或者完全拆除。


    此外，对医疗组织拥有和运营的数字/电子设备进行显著标记是一种良好的做法，特别是那些内部（组织设施内）运行的设备。这使得在医疗设施内发现外来设备时更容易识别。


    ## 3. 采用安全处置的途径和方案


    事实上，不可否认，医疗组织产生的大电子垃圾可能包含敏感数据和信息，这些信息不能随意处置。这包括存储媒体、系统、设备，甚至非电子的纸质打印文档和刻有字的纸张。因此，当这些材料不再有用或不再使用时，建立适当措施和程序对其进行安全处置至关重要。


    对于可回收和不可回收的电子材料，应建立组织措施，以确保完全清除其所包含（或曾包含）的数据和信息，使其变得不可恢复，或至少不易于恢复。同样，非电子材料也应被有效粉碎和/或焚烧。


    ## 电子健康的网络安全：逻辑必然性


    ### 2019 年医疗健康焦点报告


    结果导致了持续的威胁局面，许多电子健康系统和设备存在制造商和开发者早已公布的漏洞，但仍活跃在医疗运营中，尽管尚未采取措施确保它们收到了最新的安全补丁和修复。此外，还存在一种潜在的危险情况：中央生产网络/数据库基础设施同时为员工、访客/客户以及医疗组织的第三方供应商和子公司提供服务，而缺乏有效的边界和限制。此外，现实情况是关键生产系统和基础设施被用于各种医疗功能和运营，其覆盖范围过广，且缺乏防止外部干扰的充分保护。


    因此，作为有效保护电子健康系统和基础设施的逻辑必然要求的一部分，以下点很重要：


    ### 1. 限制电子健康系统及基础设施的覆盖范围和访问权限。


    事实证明，如果组织系统和基础设施的访问范围超授权授权所需的范围，往往会对医疗信息技术网络安全的利益和目标产生不利。例如距离医疗设施数百米外仍可访问的宽范围无线网络、在医疗系统上共享但可通过安全性不良的网络访问的文件和文件夹、不具备端到端抗拦截和抗篡改能力的远程连接功能，包括能够接收不安全（且不可验证）无线网络信号的电子健康系统和设备。


    作为一个基本原则，建议对电子健康和医疗技术背景下出现的所有（敏感）数据和信息进行加密，并仅通过安全通道传输，这既不是夸大也不是被害妄想。此外，应有效检查并控制电子健康系统和基础设施的数字覆盖和访问性。同样，确保此类经常处理可能敏感和关键数据信息的系统和基础设施，其访问范围不会超出授权功能和运营的范围也至关重要。


    ### 2. 为电子健康系统、基础设施和数据资源维护最新的安全状态。


    应采取适当的组织措施，通过在合理短的时间范围内进行定期升级和更新，确保电子健康系统和基础设施始终保持最新的安全状态，以反映针对现有威胁格局的有效安全态势。


    此外，用于处理、存储、访问和传输敏感医疗信息的电子健康系统和设备应具备内置防护罩和防火墙，防止它们连接到开放访问/未经验证的网络连接或通过其传输数据。电子邮件服务器还应配置内置安全软件，检查邮件附件和链接以验证其安全性。这些对于创建必要的逻辑屏障层至关重要，以保护敏感医疗数据和信息免受试图通过电子健康系统和基础设施以获取此类数据导出（外泄）或进入（渗透）访问的恶意外部入侵。


    通过广泛采用和系统部署其他网络安全硬件和软件工具（如终端反恶意软件解决方案、系统和网络入侵检测与防御解决方案、数字报警/陷阱系统等）的支持，可以逐步实现电子健康系统和基础设施强大的安全状态。


    ### 3. 分隔对电子健康系统、基础设施和数据资源的访问。


    医疗机构的访客和客户通常不应能够访问与医疗专业人员和员工相同的网络连接，第三方供应商也是如此。应该创建中央系统和基础设施的子集，以服务于不同的隔离功能、运营和用户类别。例如，用于内部通信的虚拟专用网络（`VPNs`）应保持加密、为此保留，并仅供授权实体访问。当医疗运营的部分外包时，也有必要对此类关系的性质、范围和参与程度进行隔离。


