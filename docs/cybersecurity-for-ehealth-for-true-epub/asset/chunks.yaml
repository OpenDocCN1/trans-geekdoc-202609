    这种医疗服务或操作范围创建（或扩展）了哪些（新的）数字交互生态系统？哪些元素参与了这些生态系统？为了有效保护这一新生态系统中的运营，需要考虑哪些网络安全维度？这些问题的答案对于确保新的业务模式和操作不会加剧现有网络安全风险、放大漏洞影响并扩展网络威胁和攻击范围至关重要。然而，为了有效回答这些问题，对威胁格局的稳健理解是不可或缺的，特别是考虑到网络安全威胁格局在非常短时间内持续频繁且快速地变化和蜕变。


    例如，在新冠肺炎（2020 年）爆发后，许多医疗机构被迫实施快速数字化转型，包括将业务迁移到“云端”的新平台和环境。其目标是帮助他们在不颠覆整个业务链的情况下，应对物理距离的需求。在此过程中，围绕现有的业务库创建了新的数字生态系统。然而，对于这些案例中的许多，这也意味着涉及机构的网络安全威胁格局发生了重大变化。


    随着许多医院和医疗机构为了限制与非新冠患者的物理接触而转向电子健康，并管理有限的个人防护装备库存和供应以照顾危重症和住院患者，新的远程能力开启了一个蜕变的威胁格局，为网络攻击者创造了新机会。随着新利用策略的出现，已知恶意技术也被放大了。结果，仅在疫情引发封锁的几个月内，医疗行业的网络事件和攻击统计数据就超过了过去几年报告的年度数据。


