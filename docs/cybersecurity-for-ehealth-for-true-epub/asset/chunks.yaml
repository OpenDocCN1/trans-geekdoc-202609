  trans: "\n在机密性方面，医疗机构有义务保护患者电子健康/医疗记录免受未经授权的访问，即使是来自组织内部。这要求患者的数据和信息仅供那些为了有效的医疗诊断或提高医疗服务质量而需要访问这些记录的专业人员和员工使用。它还要求采取措施，以确保这些医疗/健康专业人员和员工在未经授权和未经主体同意的情况下无法披露此类数据和信息。\n\
    \n破坏机密性（即使在内部）也会削弱人们对医疗机构有效保护电子健康记录（EHR）免受任何媒介（包括外部）威胁能力的普遍信任。这通常是机密性泄露后引发监管处罚的焦点。那么，如何才能保护机密性呢？\n\
    \n确保机密性的基本原则是**访问控制**。然而，其应用方式有时取决于受保护数据/信息的状态（是静态存储还是传输中）。尽管如此，这些方法的概念化在大体上是相同的，因为其目标通常是确保未经授权的实体无法访问、提取或查看被视为机密的数据和信息。\n\
    \n### 1. 访问身份验证以确认请求实体的授权\n\n在尝试保护电子健康领域患者数据和信息的机密性时，确保敏感医疗记录仅供获得授权的人员访问是非常关重要的。这通常意味着增加了一层身份验证，作为一个确认请求访问此类数据或信息的实体已授权的过程。\n\
    \n将此与事件日志操作相结合进一步有助于追踪并了解哪些实体在什么时间访问了什么特定数据或信息，同时也可能确定对敏感数据和信息执行了哪些用户操作，即使是授权实体执行的操作也是。\n\
    \n### 2. 加密实现安全的传输、存储和检索\n\n加密本质上是确保敏感数据和信息通常无法被直接读取或解读的过程。这通常通过将敏感数据和信息编码为某种形式来实现，该形式需要密钥或口令才能将数据或信息还原为可读的明文形式。\n\
    \n当这种技术应用于整个数据通信/传输过程时，它被称为**端到端加密**（或 E2EE）。\n\n## 保证可用性\n\n在多个司法管辖区，法规通常要求在规定的最长时间范围内向患者提供其健康记录。这一要求要么是作为医疗监管法案的一部分，要么作为普通公民信息/数据监管法案的一部分。在这些司法管辖区内，如果未能规定时间内（出于任何原因）为患者提供其健康数据的访问，将构成监管违规，这通常会面临巨额罚款和和解。\n\
    \n但是，在电子健康和医疗信息通信技术的背景下，通常如何保证可用性呢？一些被广泛采用的方法和途径包括：创建和管理备份、增加冗余，以及对系统、设备和服务进行进行定期维护，以优化数据处理和操作的性能。\n\
    \n1.  基本上，备份是一种通过数据元素、资源和工具的复制来保证可用性的技术。通过这种技术，敏感的医疗/健康数据和信息被复制，以确保即使在面临恶意软件攻击、数据库损坏/故障/失效或因删除导致丢失等威胁时仍然保持可用。\n\
    \n2.  冗余与备份的概念密切相关。不同在于，备份通常涉及数据元素、资源和工具；而冗余更相关地应用于基础设施、系统、组件和功能。冗余是指对关键基础设施、系统、组件和功能的复制，通过创建一个能够保证可用性的故障备用替代方案来增强可靠性。\n\
    \n    然而，在创建和管理备份与冗余时经常犯的一个错误是没有没有确保它们不会暴露在与在使用数据相同的风险因素中。例如，将备份介质存放在医疗机构现场，并与使用数据介质处于相同的条件下，可能会使此类备份暴露于火灾、盗窃、恶意软件攻击、内部威胁等相同风险因素。冗余基础设施、系统、组件和功能也如此。\n\
    \n    在许多情况下，云端选项被推荐，因为它不仅使备份和冗余脱离可能威胁其所提供功能的物理/环境风险，还使得这些备份和冗余的获取不受地理或位置的限制。但另一方面，也有需要意识到云备份和冗余并不会自动且完全地将数据和信息安全的责任转移给云服务商，尽管法规有时会在这方面考虑过一种共享且定义良好的对等安排。\n\
    \n    这首先是因为云基础设施、平台和服务通常是按“现况”（`as-is`）的基础上提供的，订阅组织有责任通过添加和删除功能来进行配置和定制，以满足其安全标准和需求，而且因为云平台已被发现是网络犯罪分子者的新目标领域。\n\
    \n3.  调优操作基本上提供了一种优化数据源、数据库服务，并扩展到依赖它们的数据处理和操作的手段，从而确保它们继续优化、有效且高效地运行。在大规模下，这变得尤为重要，因为当数据处理和操作通过次优路径进行而必须等待不确定的时间时，这对于医疗机构及其患者/客户来说都可能是关键的。\n\
    \n    为此，额外对电子健康系统、设备和服务进行定期维护操作也同样重要。例如：磁盘错误检查以修复坏道、内存碎片整理以优化内存操作、审查错误报告和防火墙策略/事件日志以发现异常和警告信号、检查硬件完整性以识别可能导致故障的缺陷和不足、更新安全功能和应用程序、应用系统升级和补丁、清理不再使用的文件以释放磁盘空间，以及运行扫描和诊断以检测和分析系统故障。\n\
    \n电子健康领域数据和信息安全的其他考虑因素包括对合并、收购和业务整合的数据源、数据元素和数据库进行审查和审计。有时，这些整合可能会引入漏洞和风险，危及母公司及现有数据资产的安全状况。\n"
- fmt: "\nPeriodic penetration tests that simulate actual cyber-attack conditions\
    \ and operations also help to provide useful insights into the security resilience\
    \ of organizational frameworks, structures, processes, and policies. These are\
    \ crucial for identifying fault lines that threaten data and information security\
    \ and could upturn the security status of healthcare organizations that deploy\
    \ information and communication technologies for healthcare/medical service delivery.\n\
    \nFurthermore, there is also the need to ensure that third-party vendors, subsidiaries,\
    \ and affiliates are held accountable to the same data and information security\
    \ standards as that of the parent healthcare organization. Many a time, it has\
    \ been seen that lapses from these third parties have wittingly or unwittingly\
    \ created and perpetuated vulnerabilities that ultimately impacted negatively\
    \ on the parent organizations.\n\nUltimately, the security of data and information\
    \ in the context of eHealth remains a responsibility of healthcare organizations,\
    \ which cannot be abdicated, at least in the sight of regulation. In bringing\
    \ in various other players and actors to interface with healthcare information\
    \ and communication technologies, the risk surface is expanded for healthcare\
    \ organizations, even though the responsibility remains sacrosanct. When these\
    \ players and actors understand the measures and mechanisms that are applied to\
    \ ensure integrity, safeguard privacy, preserve confidentiality, and guarantee\
    \ availability, they are better able to cooperate with, and support existing measures\
    \ and mechanisms towards desired goals and outcomes.\n\n## Notes\n\n1. [Becker’s\
