  trans: "\n\n同样，是这种“直觉”会让一名医疗专业人士直接拒绝将用于在医院系统之间传输敏感患者记录的移动存储设备，借给需要向设施外传输数据进行打印的亲近朋友或亲属。相反，他们宁愿交出一个不与医院系统连接的个人移动设备，尽管该医疗专业人员本可以选择从工作移动设备中移出所有敏感患者数据，并在返回后对设备进行恶意软件扫描。\n\
    \n然而，这种直觉反应可能基于对事实的认知，即工作移动设备可以使用简单的数据恢复软件工具恢复其敏感数据。还存在在设备中植入新型恶意软件的可能性，这可能无法被反病毒扫描检测到），或者（故意或无意地）被替换为嵌入了自动运行根内核程序的完全相同的副本。\n\
    \n因此，通过结构化地模拟实际威胁情景的随机测试，然后分析目标个体在这些测试条件下的行为选择和反应，评估“安全直觉”（Intuition for Security）变得可能。这将为个人/用户的角度评估医疗机构的安全状况提供有用的见解。\n\
    \n有效识别、避免、隔离和遏制威胁主体及威胁状况的能力——这就是`安全直觉`的基本素质。\n\n## 威胁情景：识别、隔离与遏制\n\n`第二章` 已经详细讨论了电子健康和医疗保健领域可能出现的各种威胁主体、它们为人知的运作机制，以及当电子健康部署针对不同层级时可能表现出的各种威胁攻击情景。\n\
    \n然而，在医疗和电子健康背景下，个人网络安全面临的更大挑战是如何识别和隔离它们，以便有效地遏制它们的运行，至少在个人层面（这是它们最初于针对的地方），并在进行相应的升级和报告之前。事实上，在信息和通信技术的背景下，几乎不可能完全避免或防止网络安全威胁情景。尽管如此，它们是否会成功实际的安全违规，在很大程度上取决于能否从医疗信息技术的个人（用户侧）层面有效地识别、隔离和遏制针对网络安全的威胁和威胁主体。\n\
    \n理解这六项原则/指南将证明是有用的，无需考虑任何特定顺序（图 3.2`）。\n\n![图 3.2 电子健康个人网络安全的六项原则/指南。](img/fig9_B.jpg)\n\
    \n`图 3.2 电子健康个人网络安全的六项原则/指南。`\n\n1. 了解哪些个人负有个人或共享责任进行安全/保护的资产可能成为威胁攻击者的目标并被其利用。此类利用尝试成功会有什么（潜在）影响？换句话说，此类资产的安全资本是什么？\n\
    \n   医疗利益相关者的职责和责任通常要求他们对设备和系统、`身份验证与访问凭据`以及私有工作空间的物理访问控制承担安全托管和管理。所有这些对于他们工作角色的各种功能都是用的。在现实中，这种托管和管理超出了这些利益相关者所运营的医疗机构和设施的物理边界和维度。\n\
    \n   对于`安全直觉`来说，这些医疗从业者理解针对他们所托管和管理的这些资产的各种攻击可能性是非常关重要的。他们还必须意识到攻击尝试成功可能对组织的安全状况意味着什么。\n\
    \n   例如，这些可能包括`用于身份验证和访问的用户凭据`、`用于传输数据和信息的移动驱动器`、`自带设备 (BYOD)`安排以及收集过程和存储数据的公司系统。这些资产是具有恶意意图威胁情景中的首要目标。\n\
    \n2. 意识到哪些类型的威胁攻击者可能对这些资产感兴趣。\n\n   > 知彼知己，百战不殆。知彼而不知己，一胜一伤。不知彼而不知己，每战百战俱殆。\n\
    \   > – 孙子，《兵法》\n\n   当医疗利益相关者托管或管理组织资产时，对于个人网络安全而言，至关重要的一点是他们不仅要意识到受托资产的价值，还要意识到可能想要获取此类资产的实体类型，特别是带有恶意意的。这是个人网络安全的一项关键原则。这一原则让医疗利益相关者了解他们可能要对抗的攻击者的本质，以及拥有哪些可以有效防御这些攻击者的安全资源和能力。通过这样，他们能够更好地衡量并校准他们的“安全直觉”，以与他们在个人层面负责保护这些资产时可能进入的领域的状态和现实保持。\n\
    \n   例如，在军事或政府机构内部设施工作的医疗专业人员必须意识到，即使是国家附属或支持的威胁攻击者也可能试图获取他们的凭据和令牌。这对于访问安全位置，或可能存储高级政府或军事官员电子健康记录的安全医疗系统是有用的。\n\
    \n. 理解威胁攻击者在寻求破坏个人网络安全以控制资产可能会应用哪些类型的工具和技术。威胁攻击者在寻求破坏个人网络安全作为获取价值资产的路径时，通常会部署各种工具和技术。\n\
    \n   部署的工具或类型通常与威胁攻击者在实现结果的过程中寻求实现的目标或目标一致。\n\n   在了解哪些个人网络安全托管资产可能是威胁攻击者的目标后，下一步是理解针对这些资产的威胁方法和策略可能包含的工具和技术。\n\
    \n   例如，用户如果能够理解社会工程策略可能包含`钓鱼`或`电话诈骗`技术，试图欺骗用户披露个人访问凭据或敏感公司信息，那么她的“安全直觉”就能让她更好地察觉即将发生的电话诈骗威胁情景。\n\
    \n"
- fmt: '

    Similarly, a healthcare professional who understands that shoulder surfing is
    a social engineering technique that might be applied to deduce non-public URLs,
    and memorize login passwords, and usernames, is mindful about entering personal
    credentials and accessing private work interfaces on shared computers in crowded
    public spaces.


    ### 4. Know the likely mediums for propagation and amplification for imminent
    and ongoing threat situations, deploying various tools and techniques. Threat
    situations, particularly when they have become successful or begun to have a foothold,
    often explore avenues for propagation, in order to amplify the impact of their
    malicious operations. Being able to effectively circumvent and immobilize them
    at this point is perhaps the holy grail of containment goals.


    However, as a user, it is not possible to achieve this promptly and effectively
    without a shrewd (and sometimes in-depth) knowledge of the kind of threat actor
    involved, and the type of tools or techniques deployed as part of the threat operations.
    By knowing what type of tools or techniques are being deployed, as well as the
    methods of propagation or amplification that have been known to be explored by
    such tools and techniques in operation, it becomes possible to foretell the potential
    impact of such a threat situation. This makes it possible to forestall or truncate
    impact effectively, before irreversible or critical damage occurs.


    For instance, worms typically propagate autonomously by spreading across devices
    connected to a network. Thus, an effective approach to circumventing and containing
    an identified worm threat on a medical system/device connected to a corporate
    production network would probably begin with taking that device off the network.
    In the same way, following the detection of a bot infection on a user computer,
    an effective approach to circumventing the threat operation would probably begin
    with shutting down remote communications to and from the machine, in order to
    liberate such a machine from the coordinated control of the remote attacker. These
    are frequently used approaches, and work reliably. It even featured in a recent
    report about a June 2020 cyber-attack against Life Healthcare Group


    However, and particularly as a (non-technical) user, it is important to understand
    at this point, the far-reaching consequences of such actions. It is also critical
    to consider the extent possible risk to which certain other organizational processes
    and operations (some of which could even be security-related) that could result
    from an action of personal cybersecurity undertaken to safeguard a system or device
    under threat.


    Investigations by the United States Department of Health and Human Services (`HHS`)
    Office for Civil Rights (`OCR`) into a 2010 data breach involving the New York-Presbyterian
    Hospital (`NYPH`), was traced to a Columbia University (`CU`) professor-physician
    having disconnected a personal device that had been connected to the `NYPH` network.


    The professor-physician, who recently developed software solutions for the hospital,
    had deactivated the device – a personally owned server. However, the absence of
    effective technical safeguards and organization-wide apparatuses for information
    risk management consequently resulted in a leak that made some 6,800 patient health
    information (including vitals, medications, lab results, and overall health status)
    accessible over the open Internet. In 2014, both organizations had to pay an aggregate
    of 4.8 million dollars in damage settlement under the Health Insurance Portability
    and Accountability Act (`HIPAA`), as an outcome of this non-malicious human action.


    Now, there is no evidence to suggest that the action of the professor-physician
    was a form of threat response, or that the action had a malicious intention, even
    though investigations revealed that neither of the corporate entities involved
    had taken adequate steps to ensure that the server was secure and that it contained
    appropriate software protections. However, this incident does provide insight
    into the fact that non-malicious and well-intended user actions, even when geared
    towards enhancing safety and security, could ultimately prove inimical to corporate
    security interests, especially without having considered such actions robustly
    and shrewdly.


    So, ultimately, if any user actions at circumventing threat situations would be
    considered effective in the long run, then the appropriate technical support and
    security teams of the healthcare organization must be promptly and expeditiously
    notified at the point where such actions are being considered in the very first
    place, or immediately such actions are executed (in the worst case). This would
    help avert disruptions in downstream business operations that might be reliant
    on the disabled workstation, and which could be equally critical to business processes
    and the security status of the organization.


    ### 5. Observe for signs of deviation in performance efficiency, and changes in
    normal operational behaviour by assets under personal stewardship or custody.
    Diminishing performance efficiency or sudden changes in normal operational behaviour
    are common obvious manifestations of impending and ongoing threat situations –
    often characterized by noticeable deviations in the normal patterns of efficiency,
    performance, and operational behaviour.


    For instance, when systems and devices suddenly begin to slow down with ads and
    prompts sprawling about, or network connections and services begin to throttle
    or fail, or the abrupt lockout of authentication and access credentials. If there
    is no other higher-level technical explanation for these occurrences, then they
    could well be indicative of ongoing malware exfiltration or MITM operations on
    packets, data, and information. They could also signal malicious attempts to compromise
    the availability of network-based services for accessing client data; and efforts
    aimed at impersonating an authorized digital identity, respectively.


    Indeed, a perceptive Intuition for Security would be one that is quick to suspect
    these occurrences as having possible malicious undertones.


    ### 6. Understand what lines of defence are in place to inspire and support personal
    cybersecurity efforts towards securing and safeguarding organizational assets
    in personal custody, and cooperate with them. These lines of defence could exist
    in settings on systems, software, and devices; infrastructure configurations;
    policy provisions; or established security protocols/processes/operations.


    For instance, some healthcare organizations configure robust device policies on
    corporate systems and devices, some of which enable remote tracking and/or erasure
    of certain classes of devices that fail to connect to the secure corporate infrastructure
    every few hours. Others have in place, robust firewalls and systems for intrusion
    detection and prevention, as well as routines for automatic backups on a periodic
    basis. There are also those that maintain up-to-date corporate-level anti-malware
    products and services. In addition, there are equally healthcare organizations
    that deploy very strong password and authentication policies (including two-factor
    authentication, and logon timeout) across the board, or across certain critical
    levels of user operations. Likewise, there are healthcare organizations with device
    sign-in policies that photograph users and automatically activate device tracking
    after a maximum number of failed sign-in attempts.

