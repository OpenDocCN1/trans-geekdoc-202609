    ## Cybersecurity Incidents in Healthcare


    When cybersecurity incidents happen in healthcare due to malicious or inadvertent
    actions of threat agents, certain outcomes usually manifest, and several tools
    and techniques, methods or strategies, as well as threat objectives frequently
    as part of the threat-attack processes that lead to these outcomes (`Figure 2.3`).


    ![Figure 2.3 When Cybersecurity Incidents Happen.](images/fig6.jpg)


    Typically, these `Outcomes` include `data breaches & leaks`, `espionage`, and
    `unavailability or failure of medical and healthcare IT systems/devices`. Espionage,
    however, is seldom an outcome when cybersecurity incidents target healthcare facilities,
    except, as previously highlighted, in cases where the systems or infrastructure
    of a healthcare organization provides a window/leeway into the operations and
    activities of a bigger entity of interest, such as the government or armed forces.


    The trail that leads towards these outcomes features:


    *   `Threat Objectives` such as reconnaissance/enumeration, digital/electronic
    interceptions, service disruptions, induced systems/device malfunction, erode
    security culture/protocols/operations, credential stuffing, and identity theft/digital
    impersonation;

    *   `Methods, Strategies, or Approaches` like spoofing (of emails, packets, location,
    addresses, protocol operations, websites, biometric & non-biometric identifiers,
    etc.), social engineering, advanced persistence (or, APTs), physical events and
    activities on site (including insider operations that could be either naive or
    maliciously intended), wardriving, man-in-the-middle (MITM), injection/poisoning,
    privilege escalation, transloading, shadowing digital activities, hijacking, subversion/bypass
    of protocols and routines, and denial of service (DoS);

