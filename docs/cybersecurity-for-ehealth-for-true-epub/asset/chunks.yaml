  trans: '

    同样，如果医疗保健专业人员理解“窥视攻击”是一种社会工程技术，可能被用于推导出非公开的 URL，并记忆登录密码和用户名，那么他们在拥挤的公共场所的共享计算机上输入个人凭据和访问私人工作界面时就会格外小心。


    ### 4. 熟悉紧发生和正在发生的威胁情况下可能的传播和放大媒介，并部署各种工具和技术。威胁情况，特别是当它们已成功或开始立足点时，通常会探索传播途径，以放大其恶意操作的影响。在此时能够有效规避并瘫痪它们，可能是遏制目标中的“圣杯”。


    然而，作为用户，如果对涉及的威胁行为者类型，以及作为威胁行动一部分部署的工具或技术类型没有敏锐（有时是深层次）的了解，就不可能快速有效地实现这一目标。通过了解正在部署什么种类型的工具或技术，以及此类工具技术在运行过程中已知会探索的传播或放大方法，就可以预判此类威胁情况的潜在影响。这使得在发生不可逆转或关键的损害之前，能够有效地阻止或截断影响。


    例如，蠕虫通常通过在连接到网络的设备间扩散来自主传播。因此，对于连接到企业生产网的医疗系统/设备上识别出的蠕虫威胁，规避和遏制其有效方法可能从将该设备断开网络开始。同样，在检测到用户计算机被僵程序感染后，规避威胁行动的有效方法可能从关闭与机器进出的远程通信开始，以便将机器从远程攻击者的协调控制中释放出来。这些是经常使用的方法，且运行可靠。这甚至出现在最近一份关于
    2020 年 6 月针对 Life Healthcare Group 网络攻击的报告中。


    然而，特别是作为一名（非技术性）用户，在此时理解此类行动的深远影响至关重要。同样，考虑到为了保护受威胁的系统或设备而采取的个人网络安全行动，可能导致某些其他组织流程和操作（其中某些甚至与安全相关）产生可能的风险，也是关键。


    美国卫生和人类服务部（`HHS`）民权办公室（`OCR`）对 2010 年涉及纽约卫医院（`NYPH`）的数据泄露事件进行的调查，追溯到哥伦比亚大学（`CU`）的一位教授兼医生断开了连接到
    `NYPH` 网络的个人设备。


    这位教授兼医生最近为该医院开发了软件解决方案，他停用了该设备——一台个人拥有的服务器。然而，由于缺乏有效的技术保护和全组织的信息风险管理机制，导致泄露，使得约
    6,800 名患者的健康信息（包括生命体征、药物、实验室结果和整体健康状况）在开放互联网上可见。2014 年，由于这种非恶人为行为，两家机构不得不根据《健康保险可携带性与责任法案》（`HIPAA`）总共支付了
    480 万美元的损害赔金。


    现在，没有证据表明该教授兼医生的行动是威胁响应的形式，或者该行动具有恶意意图，尽管调查显示，涉及的两个实体都没有采取充分措施来确保服务器安全并包含适当的软件保护。然而，这一事件为我们提供了一个洞察：非恶意且意图良好的用户行动，即使目标是增强安全和防护，最终也可能对企业的安全利益产生不利，特别是在没有稳健且敏锐地考虑此类行动的情况下。


    因此，最终，如果认为任何规避威胁情况的用户行动从长远来看是有效的，那么在考虑此类行动的最初，或在执行此类行动后立即（最坏的情况下），必须及时通知医疗机构适当的技术支持和安全团队。这将有助于避免可能依赖于禁用工作站的下游业务运营中断，而这些中断对业务流程和组织的安全状态同样至关重要。


    ### 5. 观察个人管理或托管资产在性能效率上出现偏离迹象，以及正常操作行为的变化。性能效率的降低或正常操作行为的突然变化是即将发生和正在发生的威胁的常见明显表现——通常表现为效率、性能和操作行为正常模式的显著偏差。


    例如，当系统和设备突然开始变慢并充斥着广告和提示，或者网络连接和服务开始限流或失败，或者身份验证和访问凭据被突然锁定。如果这些发生没有其他更高层次的技术解释，那么它们很可能表明正在进行恶意软件外泄，或对数据包、数据和信息的中间人攻击（MITM）操作。它们也分别标志着破坏访问客户端数据的网络服务可用性的恶意尝试；以及旨在冒充授权数字身份的努力。


    事实上，一种敏锐的“安全直觉”应该是能够迅速怀疑这些发生可能具有恶意意图的。


    ### 6. 了解建立了哪些防线，以启发并支持个人网络安全努力，确保和保护个人托管的组织资产，并与之配合。这些防线可能存在于系统、软件和设备的设置中；基础设施配置；政策规定或已建立的安全协议/流程/操作中。


    例如，某些医疗机构在企业系统和设备上配置了严格的设备策略，其中某些策略允许对每几小时未连接到安全企业基础设施的某些设备进行远程跟踪和/或擦除。其他机构则配备了强大的防火墙和入侵检测防御系统，以及定期的自动备份程序。还有一些维护着最新的企业级反恶意软件产品和服务。

