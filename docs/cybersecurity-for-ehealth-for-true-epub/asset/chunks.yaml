  trans: '


    不可否认，信息技术（或电子健康）在医疗保健领域的应用，其主要目的是为了确保能够无随地获得优质医疗保健服务，且不受地理位置、移动性或类似限制所带来的任何形式的限制或障碍。然而，这种背景下的实用性依赖于医疗/保健数据和信息以同样的方式可用，特别是以一种被认为准确且可靠的方式，为医疗/保健诊断和决策提供依据。


    当 `Integrity`（完整性）受到损害时，这一切都会崩塌。那么，如何在医疗保健信息技术应用（电子健康）中确保 `Integrity` 呢？


    ### 1. 方面被广泛考虑的一种观点是允许患者（频繁/定期）访问其医疗/健康数据。设备传感器具有较大的误差范围，以及在数据处理/操作链的不同点可能发生拦截和篡改的可能性，这些事实在近期事件中已变得更加明显。通过允许患者在处理/操作链的各个点访问其数据，这增加了一个基于利益的验证层，在链持续扩展时是可以信赖的。其逻辑非常简单：没有人比患者自己更关注医疗/保健记录的准确性了。


    然而，这并不会以任何方式减轻医疗保健机构在安全收集这些数据和信息，以及以可靠安全的方式对其处理和存储等方面的责任。因此，在任何方面，这种验证层都不能解释为这种责任的转移或推卸。


    同样重要的是，黑客也可能是患者（或伪装成患者）。因此，在此背景下必须采取安全措施，以验证通过电子健康部署请求医疗数据的个人（患者）的身份，并确保这些个人（患者）只能访问他们的数据，仅限他们的数据，且无其他任何内容。


    生物识别认证经常被探索作为一种验证个人身份的万无一失的方法。额外的措施如防火墙限制、蜜罐以及入侵检测/防御系统也已应用于多种场景，用以限制在这种情况下可以访问和查看的内容，同时监控暗示恶意意图和操作的异常行为。


    ### 2. 在数据处理和操作链的各个点维护日志文件，以便在怀疑或确认错误时进行跟踪和检查。审计日志对于确保电子医疗/保健数据和信息管理完整性这一目标是不可缺的。这是因为在许多情况下，当调查违规行为时，审计日志提供了一种建立或反驳医疗保健机构方面不负责任行为的方法。此外，它还帮助医疗保健机构在常规检查期间标记出其操作和流程链中的红点，这些红点可能会损害它们的风险状况。


    这一切之所以成为可能，是因为审计日志有助于在完整性问题出现时追溯源头。它提供了一种识别此类问题可能原因的方法，并确定了哪些技术、结构或操作措施可以帮助在组织范围内避免此类事件的发生。


    ## 保护隐私


    尽管“隐私”一词继续出现在有关医疗保健网络安全事件的讨论中，但该术语本身并没有通用的定义，除非是在特定管辖区内具有约束力的法规背景下所定义的定义。这是因为隐私在本质上具有更多个人化的维度，并带有重叠的考量，而法规往往难以捕捉这些内容。这些包括身体完整性、个人尊严、秘密性和个人自主。


    然而，每当发生违规行为时，隐私仍然是首要考虑。隐私政策有助于将医疗保健机构的业务利益和目标与保护隐私的责任相结合。此外，法规通常要求医疗保健机构建立稳健的风险管理计划，帮助他们主动评估、检测、缓解并有效应对风险。


    此外，某些管辖区的法规（如欧盟的 GDPR）规定了从组织到用户角度旨在保护隐私的最佳实践。这些包括：


    - 从收集的患者医疗保健/医疗数据中移除个人身份识别信息，有时将这些信息映射到伪标识或特殊标记，这有助于在数字操作和流程中区分属于特定个人的记录，而无需一定识别这些个人——这种技术被称为`匿名化/去标识化`（Anonymization/Pseudonymization）。

    - 收集极少量的用于唯一识别患者的数据和信息，这是直观的，因为对于使用医疗服务的患者来说，要求的个人数据和信息越少，越容易保持此类个人数据和不公开，从而减少潜在内部外部威胁的攻击面——这种技术被称为`最小化`（Minimization）。

    - 确保在用于医疗保健的软件和系统的概念化、设计和工程阶段嵌入隐私考量——这种方法被称为`隐私设计`（Privacy by Design）。


    `隐私设计`可以通过确保以下点来实现：(a) 在新系统和软件中默认激活最严格的隐私设置（也称为`默认隐私`，Privacy by Default），(b)
    纳入预防性的隐私措施，以便在隐私风险演变为违规/事件之前对其进行预测和阻止，(c) 应用端到端的安全技术以在数据处理和操作的整个生命周期执行隐私，以及 (d)
    敏感数据和信息在任何时间、任何地点和任何目的下都进行安全的计算和处理。


