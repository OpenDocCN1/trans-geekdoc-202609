    For example, a network administrator attempting to deploy a network service quickly
    might, in a bid to multi-task and enhance productivity, apply a shell script to
    automatically configure and host the service on the organization’s network. Sometimes,
    this administrator might omit to take cognisance of certain default configuration
    parameters that do not meet the security standards, policies, and operational
    frameworks of the organization. Similarly, a user trying to access their online
    social networks using the office Internet connection that is only accessible on
    corporate devices might attempt to upload multimedia (pictures and videos) by
    plugging in a personal removable device. Failing to consider that malware could
    infiltrate the corporate network through this means.


    In addition, the doorkeeper to a healthcare facility might not understand the
    risks to cybersecurity posed by an inability to present a valid access card at
    all points of entry (regardless of the associated circumstance or the person involved).
    Hence, this individual might manually override or subvert access validation protocols
    for a person in a wheelchair who is unable to reach high enough to swipe their
    access card. An elderly visitor who is struggling to drag along several bags is
    also likely to be granted the same compromise; even an employee who seems unable
    to find their access card at the time. Such a doorkeeper might be apparently oblivious
    of the fact that these incidents could well be forerunners or precursors in action,
    as part of a coordinated security violation strategy.


    In the same way, a janitor or cleaner might not understand the cybersecurity risks
    posed by the unavailability of a critical system, network service, or connection.
    As a result, he could accidentally trip over a network or power cable in the course
    of their cleaning duties, and then casually ignore the necessity of immediately
    calling the attention of the technical IT staff to the incident. Eventually, this
    may result in disruptions to service availability and delivery to the lower legs
    of the network from that point of connection down the line; or even result in
    disruptions to the effectiveness of services rendered by the systems and devices
    that depend on that particular connection remaining online.


    In summary, it is the holy grail of eHealth cybersecurity, and perhaps cybersecurity
    generally, to essentially protect and safeguard the sanctity of the three Invariants
    of Confidentiality, Integrity, and Availability. In practice, however, this is
    often only achievable by deploying a multi-dimensional approach that factors in
    the various interactions between Infrastructure & Systems, the People (technical
    and non-technical Users, as well as support staff) that interface with them, the
    business Processes that rely on them, and the organizational Policies that provide
    the governance framework for all of these.


