  trans: '

    通常情况下，攻击者通过医疗机构现场的物理事件和活动来实现这一目标，这可能涉及天真或带有恶意意图的内部操作。尽管如此，通过系统性地颠覆或绕过医疗机构政策条款的规范，这些威胁往往能够成功地逐渐且系统地侵蚀组织政策的边界和限制。从长远来看，这暴露并持续了关键漏洞，为恶意行为者打开了阻力极小或几乎没有任何阻碍的路径。


    2009 年 1 月 16 日，美国卫生与人类服务部（`HHS`）与美国最大的药店连锁店 CVS（CVS Pharmacy, Inc.）达成了一项金额为 225
    万美元的和解协议。根据一份调查报告，“CVS 未实施适当的政策和程序，在处置过程中合理且恰当地保护受保护的健康信息”。报告进一步指出，“CVS 未对员工如何妥善处置此类信息进行充分培训”，并且“没有对于未能遵守其处置政策和程序的员工建立维护并实施惩罚政策”。


    调查源于人们发现 CVS 随手丢弃含有患者受保护的健康信息（姓名、地址、药物和其他个人身份信息）的药瓶，而这些瓶子被放在公共可以的开放垃圾场。这可能侵犯了其百万患者的隐私。


    这一事件为适用于医疗机构流程、操作以及医疗组织政策的网络安全威胁格局提供了洞察。


    ## 风险因素有哪些？


    有几个风险因素有时有助于针对人员/用户、系统和设备、基础设施、流程和操作中的安全漏洞以及政策漏洞的网络犯罪分子铺路，从而获取医疗机构的资产。然而，当威胁针对流程/操作和政策规范时（特别是带有恶意意图时），通常是更大计划的前奏，而其成功取决于目标医疗机构薄弱的安全文化。


    一些医疗机构认为，基础网络安全培训对于其技术人员或支持人员是必要的，这通常归因于资金限制以及某些被认为是非技术性职位的性质。更糟糕的是，许多医疗机构（特别是在发展中国家）未能聘用或定期签约网络安全专家和专业人士，尽管他们拥有大量的电子健康（eHealth）产品和服务。然而，当涉及到电子健康背景以及可能的其他网络安全领域时，医疗机构入口处的门卫和接待人员对网络安全保护的重要性，与几层之上的
    IT 经理一样关键。


    门卫如果理解恶意行为者如何通过“搭便”（piggybacking）和“尾随”（tailgating）等手段寻求医疗设施的未经授权物理访问，那么在设施内部及周围的任何入口或遇到未能及时正确识别身份的陌生人时，他就知道要注意什么。如果此人还理解在公司环境中植入硬件键盘记录器或网络嗅探器可能导致的风险，情况会更理想。


    同样，考虑一名清洁工，他理解通过搜寻被丢弃的存储设备、带有个人信息的便利签、未粉碎的公司文档或随手丢弃的不再使用的公司系统，如何为恶意行为者提供有用的信息，以危及医疗机构的网络安全状态。这样的人会对组织使用的中间垃圾场或垃圾收集点的未识别陌生人保持警惕。


    一种日益增长的做法是人员/用户在多个网络服务和应用程序中使用相同的凭据（用户名和密码），这是另一个不可忽视的强大风险因素。一份安全报告显示![图 2.4 医疗保健网络安全事件——风险因素](img/fig7_B.jpg)


    图 2.4 医疗保健网络安全事件——风险因素


    然而，另一个在颠覆医疗保健安全流程和操作中常见的因素是由于熟悉、天真和亲缘关系而导致的松懈。根据 20 世纪美国作家比尔·范恩（Bill Vaughan）的话，“熟悉是所有破坏者中最具破坏性的”；职业教练布兰尼·伯根德（Brittany
    Burgunder）补充道：“仅仅因为某些东西熟悉并不意味着它是安全的。仅仅因为某些感觉安全并不意味着它对你有好处。”医疗机构的安全人员更容易颠覆/绕过安全协议、流程和操作，为一个在设施内已变得熟悉的陌生人提供访问，或为一个未能提供访问设施授权的亲属提供访问。同样，当涉及到亲属或其他熟悉人士时，员工/用户可能对其个人访问凭据、数据和设备的安全性更加松懈。


    此外，设计不佳的医疗应用程序未能设计中稳健地整合安全协议和保护措施——如密码加密、输入验证/错误检查、安全套接字通信、双重身份验证、访问/登录超时等——这对此类应用程序收集、生成或访问的用户数据构成了危险。通过非常简单且不成熟的工具和技术（其中许多软件是互联网上免费提供的或具有公开源代码，只需编译运行），敏感的用户数据可能被恶意的外部行为者窃取。


    然后，一些医疗系统（硬件和软件）以及设备未采用安全设计和卫生的最佳实践——例如最新的反病毒程序、防火墙策略、广告和跟踪器拦截器、针对拦截加固的操作，以及具有防重构能力的接口——这些本身就可能成为医疗数据和信息的威胁。例如，一个具有可区分按键音的安全密码键盘，或者使用无法抵御频繁重复触摸模式磨损的硬件工程设计。随着时间的推移，这可能对用户数据、访问凭据和其他关键信息构成巨大威胁。


    同样，某些医疗组织政策未能防止，或无意中授予用户对组织系统/设备和基础设施的权限、访问权限或可用性，超出了其有效履行工作岗位职责所需的。这对数据和信息构成了隐蔽的危险，因为这些用户成为了恶意行为者更愿意探索以到达资产的直接通道。


    此外，还有遗留医疗系统，制造商发布了关于发现漏洞的公告；但这些系统尚未发布修复这些漏洞的安全更新，而它们仍在使用各种医疗流程和操作中活跃。事实上，这好比一间众所周知没有锁的房子，但仍作为各种用户贵重物品的存放处。

