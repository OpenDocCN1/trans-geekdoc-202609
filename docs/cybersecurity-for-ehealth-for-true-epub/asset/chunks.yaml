- fmt: '

    The practice and profession of defending information technology systems and assets
    against threats, malicious actors, and attacks.


    ### Data Breach

    A cyber incident that intentionally or unwittingly results in the compromise of
    security, leading to unauthorized access, disclosure, or theft of information
    that is considered valuable and confidential, and should be otherwise secured.


    ### Data Element

    The atomicity of data that is defined in semantics and representation, and has
    a value that can be collected, processed, stored, or transmitted.


    ### Data Invariant

    An unchanging property that is binding on a functional body of data, and all operations
    that are performed on such data – before, during, and/or after collection, processing,
    storage, or transmission.


    ### Data Subject

    A human or non-human entity, to which a particular data element refers.


    ### Denial of Service

    The malicious action of preventing legitimate users from accessing digital platforms,
    utilities, and resources (e.g., systems, devices, and networks), typically by
    flooding and engaging such digital platforms, utilities, and resources with useless
    (sometimes malicious) traffic and requests.


    ### Digital Footprint

    Information that is available about an individual by virtue of their online presence
    and activities on the Internet.


    ### Digital Shadow

    The collection of all residual information (confidential, proprietary, or sensitive)
    about an individual, which is left behind following engagements with a digital
    service or platform.


    ### Domain Name

    A string that perpetually identifies (that is, names and addresses) an online
    location as one that is autonomous in its administration, authority, and control.


    ### Encryption

    The process of encoding sensitive information in such a way that it can only be
    accessed and understood by authorized entities that possess the information that
    is needed to reverse the encoding operation (through a process known as decryption).
    A secret key is a critical component in the process of encryption and decryption,
    and holds the necessary information for successfully and legitimately encoding
    and decoding data.


    ### End-to-End (E2E)

    A design principle which ensures that the features and functions that are critical
    to application or security operations reside in the nodes sitting at both ends
    of a medium that serves as an intermediary between these end nodes for the purpose
    of communication or exchange.


    ### Enumeration

    An attack step that seeks to gather relevant information with the aim of deducing
    a complete or representative listing/profile of the entities of interest within
    a target domain/environment, which is often a computer network, a physical office
    location, or a computer system.


    ### Firewall

    A computer program that provides defence against unauthorized access to computer
    systems or private networks.


    ### Information and Communication Technologies (ICTs)

    A broad terminology that is typically applied to describe the unified models,
    frameworks, and apparatuses for communication and information exchange, as well
    as the integral role played by computers and other digital electronic devices
    in facilitating storage, manipulation, transmission, retrieval, and access to
    such information.


    ### Input Validation

    A control mechanism that is built into a device or software to check and ensure
    that data entered by users meet the format, specifications, and requirements for
    processing.


    ### Keylogger

    Hardware or software that is able to monitor and record user keystrokes that are
    delivered through input devices to a digital computing system or platform, and
    then store or relay such information to an attacker. It is usually used to steal
    sensitive information for malicious purposes.


    ### Login Timeout

    A security configuration that allows users to be automatically logged out from
    digital systems, devices, and applications after a certain time period has elapsed.


    ### Malware

    A portmanteau collocation of the terms “MALicious” and “softWARE”. Referring to
    computer programs that are designed to infiltrate digital systems and networks
    without consent or authorization, and often with the capacity to cause damage.


    ### Man-in-the-Middle

    The practice of intercepting digital communications by interposing between two
    unknowing entities, often with malicious intent to relay, re-route, alter, or
    simply gain (otherwise) unauthorized access to information/data.


    ### Minimization

    The practice of limiting data collection operations to receiving only such data
    elements that are necessary and relevant to fulfilling a specific purpose that
    is well-defined.


    ### Network

    An interconnection of digital electronic devices (such as computers) that enables
    communication/information exchange, and the sharing of files and resources over
    electronic channels.


    ### Network Protocol

    The rules of engagement that define and specify how data and information exchange
    would take place between devices within a computer network.


    ### Network Sniffer

    A software or device that enables the real-time monitoring and analysis of packets
    and protocols on a network for legitimate or malicious purposes. It is sometimes
    also referred to as a network analyser.


    ### Packet

    The unit of data that is carried by a network, and is formatted to contain the
    necessary information and control parameters that are needed to transmit the data
    across the network.


    ### Packet Tracer

    A software or device that is used to map the path along which packets travel on
    a network, often by imitating or simulating the layout and structure of the network
    at the physical, logical, or conceptual level.


    ### Patch

    An enhancement that is provided for a computer program, or the files and data
    that it uses, in order to fix security vulnerabilities or insufficiencies in the
    program.


    ### Phishing

    A form of Social Engineering that usually involves an attacker/malicious individual
    posing as a trusted entity in a text-based communication (e.g., email, instant
    message [IM], short message [SMS], etc.).


    ### Platform

    A business utility with an operating model that allows multiple participants (consumers)
    to connect to it for the purposes of interacting, sharing, creating, and deriving
    value typically through dyadic engagements and exchanges.


    ### Policy

    A targeted body of procedures and principles that are established to provide guidelines
    for informed decision-making and actions that lead to rational outcomes, which
    are in line with broader envisioned goals.


    ### Programming

    The process/task of creating solutions to computational problems through instructions
    or commands written in a particular language that can be understood and processed
    by a computer system.


    ### Pseudonymization

    The practice of substituting personally identifiable information in a body of
    data with non-identifiable information mapped to a description that enables the
    original personal information to be easily deduced; thus, transforming the original
    data into one that does not personally identify data subjects any longer.


    ### Reconnaissance

    A preliminary step in an attack procedure that seeks to gather useful information
    about the identities, operations, and vulnerabilities in target systems/networks
    (sometimes referred to as enumeration), often with the aim of exploiting such
    vulnerabilities in a later attack against the system/network.


    ### Scavenging

    The practice of scouring through garbage for residual information of interest;
    which, although, might have been ordinarily inaccessible (due to its sensitive
    nature), could provide useful intelligence for future malicious operations.


    ### Secure Socket Communication

    A protocol that is used to encrypt web communications/transactions. It is sometimes
    also referred to as `Secure Socket Layer (SSL) Communication`.


    ### Security Protocol

