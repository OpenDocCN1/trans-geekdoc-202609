    Furthermore, the growing popularity of Bring Your Own Device (BYOD) arrangements
    means that it is often difficult to achieve a balanced or levelled security status
    for cybersecurity frameworks implemented in healthcare, since the security of
    personal user devices cannot be guaranteed off site. Even for organizations with
    strict policies allowing only corporate devices to participate in their digital
    spaces, the trend of growing comfortability that frequently sees employees/users
    treat and handle company devices as their “own property” is a risk that can easily
    be exploited. Also, off-site/remote-working arrangements often demand that aspects
    of the healthcare organization’s data and infrastructure are accessible off site,
    such that, at scale, it becomes more difficult to effectively monitor who accesses
    what, when, from where, and how. All of these realities coalesce to complicate
    the risk terrain for cybersecurity in healthcare.


    The absence of open channels for information verification could also pose a risk
    factor that enhances the chances of success for malicious actors. In the event
    of an ongoing attack targeting users/clients and visitors to a newly hosted web-based
    healthcare service, or a social engineering attempt to steal access credentials
    for a newly deployed application software, or a rogue/fake business transaction
    that has spooked a third-party vendor/affiliate. The ability to verify information
    in real-time through open, and perhaps public-facing channels could spell the
    difference between success and failure for such malicious incidents.


    Again, a culture of people/users’ unawareness, non-enforcement of policy provisions,
    policy somersault, and policy changes that are too rapid and too frequent – these
    situations have continually posed critical risks to the effectiveness and robustness
    of policy provisions in safeguarding against the modern realities of the healthcare
    cybersecurity threat landscape. Policy development processes for healthcare organizations
    should, of necessity, involve the contributions of cybersecurity professionals
    for risk assessment. Through new organizational regimes that attempt to bring
    change too quickly, and especially before the risks and lapses that are ordinarily
    created by a transitional vacuum are gauged properly, the cybersecurity standing
    of a healthcare organization can be left vulnerable. Malicious individuals often
    watch out for these periods of change/transition, as an advantage for orchestrating
    malicious agenda.


    Beyond all these, however, there are also natural occurrences that could equally
    pose risks to eHealth deployments in healthcare. These occurrences, even though
    they are often able to bring about the same threat outcomes, differ from the traditional
    operational regimen of other known Threat Agents. For instance, earthquakes and
    fires could threaten the operations of backbone technology infrastructure that
    eHealth applications rely on, such as national telecommunications networks and
    power grids. While these incidents may pose critical threats to the operations
    of certain deployments of eHealth – such as unavailability of Internet and telecommunications
    services for TeleHealth and mHealth applications – they do not reflect the perspective
    of intent and intentionality that characterizes the operations and activities
    of traditional threat actors.


    Indeed, it can be inundating to come to terms with the true extent and realities
    of the cybersecurity threat landscape to eHealth and healthcare, generally, especially
    since what has been discussed and explained in this chapter does not claim to
    be exhaustive. It is therefore valid to ask, “How can healthcare stakeholders
    and professionals be better positioned and prepared to cope and engage effectively
    with these realities?” However, already being aware of the nature and realities
    of this threat landscape is, perhaps, the necessary first and important step to
    progress in seeking an answer to this crucial question.


