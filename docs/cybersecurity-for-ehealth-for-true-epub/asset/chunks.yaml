    \n# 4 Data/Information Security for eHealth Deployments\n\nDOI: [10.1201/9781003254416-4](https://dx.doi.org/10.1201/9781003254416-4)\n\
    \n## Introduction\n\nFrom the *General Data Protection Regulation* (GDPR) of the\
    \ European Union, to the *Health Insurance Portability and Accountability Act*\
    \ (HIPAA) of the United States, the *Protection of Personal Information* (POPI)\
    \ Act of South Africa, the *Personal Information Protection and Electronic Documents\
    \ Act* (PIPEDA) of Canada, the *Digital Information Security in Healthcare Act*\
    \ (DISHA) of India, the *Act on the Protection of Personal Information* (APPI)\
    \ of Japan, and *Kenya’s Health Act*, 2017, all of these Acts and Regulations\
    \ reflect the great importance that is placed on healthcare data/electronic health\
    \ records in many jurisdictions around the World.\n\nIn 2013, *Advocate Health\
    \ Care*, an Illinois-based healthcare facility, was constrained to pay civil settlement\
    \ claims to the tune of $5.55 million, to HHS’ Office for Civil Rights for violations\
    \ of the HIPAA\n\nIn one of the incidents leading up to this breach, Advocate\
    \ Medical Group, a subsidiary of the healthcare organization, had suffered a burglary\
    \ at one of her offices that resulted in the stealing of four laptop computers\
    \ containing patients’ information. In another incident, an external access to\
    \ the organization’s network compromised the healthcare information of 2000 patients.\
    \ In yet another incident, a work laptop computer was stolen from the vehicle\
    \ of an employee of the Organization. All the incidents took place between August\
    \ and November of 2013.\n\nWhereas, healthcare regulations and acts in many jurisdictions\
    \ place upon healthcare organizations that collect, process, transmit, and store\
    \ patients’ electronic medical records, the responsibility of ensuring that these\
    \ data are kept safe, secure, and accessible, even within the ambience of binding\
    \ regulatory specifications. To falter in this responsibility typically amounts\
    \ to a regulatory violation that has often been responded to with huge fines and\
    \ large settlement pay-outs.\n\nIndeed, this responsibility translates to mean\
    \ that healthcare organizations have a duty to manage data in the most effective\
    \ and efficient manner that ensures that data elements are (a) trustworthy and\
    \ reliable for informing medical decisions, (b) kept safeguarded against unauthorized\
    \ encounters and interferences, in order that privacy is preserved, and (c) guaranteed\
    \ to be promptly available at all times, at all such points, and for all such\
    \ uses, functions, and operations that are authorized, ethical, and lawful.\n\n\
    In [Chapter One](#ch1.xhtml), the Invariants of Healthcare Data have been presented\
    \ and discussed. But then, in the practice of modern healthcare, how do these\
    \ Invariants reflect the premium that is placed on them by various healthcare\
    \ stakeholders – regulators, patients/clients, healthcare service providers, healthcare\
    \ professionals, and third-party vendors/affiliates. What approaches can be applied\
    \ to help minimize risk and liability from a non-technical standpoint, so that\
    \ healthcare organizations and professionals are better able to navigate the non-trivialities\
    \ of regulation? This is the grain of discussions in this chapter.\n\n## Data/Information\
    \ Security for eHealth Deployments\n\nData and Information Security remains critical\
    \ for eHealth deployments, particularly because the sensitive nature of data that\
    \ is electronic patients’ health records is one which is hedged by a complex strain\
    \ of considerations pertaining to Human & Digital Rights, Democracy & the Rule\
    \ of Law, Personal Security, Public Health & Safety, and National Sovereignty."
