- fmt: '

    The options are indeed numerous, and they all present effective pathways for success,
    even with little technical expertise. At scale, successful identity theft operations
    that target a particular healthcare organization can provide very potent advantage
    for a later credential stuffing cyber-attack, which deploys these stolen identities
    to automate user login requests across multiple servers or web services using
    freely available web automation tools and applications. These could be useful
    foundations for data breaches/leaks, and other forms of healthcare cyber incidents.


    However, malicious actors that target people/users could also decide to shadow
    their digital interactions or electronic communications in order to steal data
    about them as well as their access credentials. Shadowing in this regard is achievable
    using `Keyloggers` – a hardware or software device that is able to trap and record
    input keystrokes and mouse clicks on digital electronic devices and machines,
    which are then transmitted to a designated location for the use of the attacker.


    Indeed, threats that target healthcare users are latent threats to medical systems
    and devices, organizational infrastructure, healthcare processes and operations,
    as well as corporate policies.


    ## Pertaining Systems & Devices


    Medical devices and other information and communication technologies (`ICTs`)
    used in healthcare often pose an easy target for malicious actors, and for many
    reasons. This is because security resilience is often times lacking in many of
    these devices, particularly as they often feature software and hardware that have
    long been outdated.


    Generally, threats and attacks to medical `ICT` systems and devices target the
    `Data` and `Information` that they collect, process, access, and store about users
    (employees, clients, and vendors), and business operations. These threats and
    attacks usually explore methods and strategies like spoofing, scavenging, injection/poisoning,
    transloading, hijacking, bit-flipping attacks, and privilege escalation.


    These methods and strategies lean towards objectives such as reconnaissance/enumeration,
    identity theft/digital impersonation, induced malfunction in systems/device, access
    denial through lockouts and service truncation, and altering data & information.
    In many cases, by the time these systems and devices come under threat by malicious
    actors, people and users have long been at risk, with the possibility of having
    one or more these already compromised.


    In `spoofing`, digital identities are stolen or falsified. The goal being to accrue
    to an unknown and illegitimate party the otherwise legitimate advantages and benefits
    accorded to a trusted digital player. The digital identities that could be spoofed
    in this case range from emails, to data packets, location information, device
    (physical) addresses, protocol operations, websites, as well as biometric & non-biometric
    identifiers, to mention a few. A spoofed hospital website or server address could
    successfully impersonate and pose to users as a legitimate digital actor, in order
    to obtain their access credentials, data, or other legitimate information. Similarly,
    a spoofed device address with administrative privileges can pose a legitimate
    request for users’ healthcare data or information domiciled on a secure server.


    `Scavenging` is the practice of searching through physical or logical residues
    for sensitive information that could be useful for malicious purposes. When scavenging
    takes place physically, it often happens around a healthcare organization’s dumpsites
    or garbage collection point(s), but when it happens logically, it involves scouring
    through system log files and error reports for sensitive information that could
    offer an advantage in a malicious scheme. Data and information that was contained
    in a casually disposed storage device can also be recovered and reconstructed
    substantially (and in some cases, completely) using software that is freely available
    on the Internet, even though the storage device may have been properly formatted
    or erased prior to disposal. In the same way, sensitive information on printed
    materials that are casually disposed have also provided an advantage for criminal
    scavengers.


    Similarly, `Privilege Escalation` seeks to take advantage of a design flaw in
    a healthcare system or software, in order to gain access to usually protected
    resources (sensitive data and information) that are otherwise inaccessible to
    particular users, user groups, or applications. When malicious actors succeed
    in escalating privilege, it becomes much easier for them to cover their tracks
    properly by tampering with system/event activity logs. Thereby making it difficult
    to promptly detect healthcare cybersecurity incidents and respond in a timely
    and effective manner.


    `Bit-flipping attacks` provide a non-cryptanalytic way for attackers to compromise
    cryptographic cipher implementations by changing bits in the encrypted information
    (known as the cipher text) in a way that could bring about a predictable change
    in the original message. While this attack does not necessarily provide a way
    for the attackers to learn the content of the original message precisely, it does
    make it possible to compromise the integrity of particular messages or blocks
    of messages that rely on a particular cipher channel. In cases where such a cipher
    channel is required for authentication purposes, a bit-flipping attack could result
    in a denial of access.


    `Injection/Poisoning`, however, is the practice of introducing or feeding bad/bogus
    commands and parameters into request or commit operations, in a bid to cause healthcare
    systems and devices to fail-open and release sensitive user/client data and information
    that they hold. `XSS` (cross-site scripts), malicious query statements in `SQL`
    (structured query language), packet header, and routing table poisoning; these
    are common techniques that have been adopted as part of the injection/poisoning
    threat-attack regimen.


    In addition, malicious actors could seek to hijack systems and devices belonging
    to users and their employers/healthcare organizations, in order to gain remote
    control over these machines as avenues for amplifying the strength and impact
    of subsequent malicious schemes. Under this form of coordinated control, these
    compromised machines remain subject to the whims and caprices of the malicious
    actors, who are able to instruct them to carry out a broad range of malicious
    activities in order to remove attention from the persons of the real attackers.
    Such machines become “zombies” under the influence of the attacker.


    Alternatively, malicious threat actors could explore avenues for directly or indirectly
    transloading malware onto medical `ICT` systems and devices for the purpose of
    disrupting normal system and device functions/operations, as well as denying access.
    `Malware` has been a common tool often featuring in the threat-attack processes
    that target medical systems and devices. A portmanteau term that integrates “malicious
    + software”, `malware` exists in various types/kinds, namely, `spyware`, `ransomware`,
    `Trojans`, `viruses`, `rootkits`, `logic bombs`, `worms`, and automated running
    (`Autorun`) scripts.


    There are deeper technical characteristics that help to distinguish more clearly
    between these various sorts of malware. However, in the most basic sense, `worms`
    and `viruses` differ in that `worms` are autonomous self-replicating malware,
    while `viruses` replicate by binding to relevant user files and are generally
    under the control of an external influence that is usually the attacker or malware
    author. On the other hand, `Trojans` often come disguised as software that is
    legitimate and harmless (like games, software, etc.), while `ransomware` operate
    by hijacking and denying access to systems/devices and the data that they hold,
    until a fee (known as the ransom) is paid.

