    Partners Digital. [https://www.gp-digital.org/wp-content/uploads/pubs/african-declaration-a-positive-agenda-for-rights-online.pdf](https://www.gp-digital.org)


    # Glossary of Definitions


    ### Access Authentication

    An access control measure that requires authorized entities to confirm or verify
    their person and identity by providing certain information (that is usually confidential
    or unique), prior to gaining access to a system or network.


    ### Access Control

    These are measures that are put in place to restrict entry and engagement with
    a system or network to only such entities that are authorized.


    ### Anonymization

    The practice of removing all personally identifiable information from a body of
    data, such that it becomes impossible to identify the original data subject.


    ### Anti-malware

    A device or application that provides protection against various malware.


    ### Bot

    A software program, device, or system that is able to receive, process, and execute
    commands/instructions, such as enable it to perform pre-defined tasks in a repetitive
    manner.


    ### Botnet

    A collection of infected or compromised systems and devices that are under the
    control of an attacker, and can be deployed to perpetrate and amplify the impact
    of malicious operations against targets of.


    ### Bring Your Own Device (BYOD)

    A working arrangement that permits employees of an organization to bring and use
    personal devices and systems within the corporate environment, and also gain access
    to organizational resources and platforms using these personal devices and systems.


    ### Code

    A collection of instructions written in a particular computational language, which
    describes/specifies the procedures and operations that would be undertaken in
    the execution/processing of a particular task. It is otherwise referred to as
    Source Code.


    ### Credentials

    Digital artefacts that contain the information needed to prove or verify something
    about the subject or user that holds such credentials.


    ### Cross-Site Scripting

    Written as `XSS` in shorthand, it is a security vulnerability of web applications
    that allows malicious actors to compromise or interfere with the legitimate interactions
    that authorized users have with such applications.


    ### Cryptanalytics

    It generally refers to the science, procedures, technologies, and activities that
    are applied in an analysis aimed at understanding the hidden aspects of information
    systems and technologies, to enable the encryption and decryption of messages
    without the use of secret keys.


    ### Cyber-Attack

    A criminal offence against a digital information technology asset (networks, devices,
    systems, etc.) that seeks to gain unauthorized access, control, and usage of such
    asset for malicious purposes. It typically features a range of tools, techniques,
    methodologies, and strategies.


    ### Cyber-Physical Systems

    An implementation that involves the use of computers in monitoring physical phenomena,
    and/or controlling physical processes and operations, featuring the use of sensors
    (to detect events as impulses and variations in the physical environment), and
    actuators (to take actions in response to detections).


    ### Cybersecurity

