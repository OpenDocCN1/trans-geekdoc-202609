    eHealth is an umbrella term that over the last decade has seen growing popularity
    in the fields of medicine and public health. The World Health Organization broadly
    defined eHealth as “the use of information and communication technologies (ICT)
    for health” – a fairly simple and straightforward definition that, however, involves
    several facets of interactions and supporting technologies coming together to
    enhance access to quality healthcare, and support service delivery at an affordable
    cost.


    Over the years, eHealth has been seen to involve the deployment of a wide range
    of information and communication technologies (ICTs) (including mobile telephony,
    artificial intelligence, voice recognition, speech translation, video conferencing,
    wired & wireless communication, digital sensing & imaging, computational analytics,
    bioinformatics / biomedical informatics), supported by electronic devices, for
    various applications in Healthcare. However, and as illustrated in [Figure 1.2](#ch1.xhtml#fig2),
    different nomenclatures characterize the coinage of these applications, based
    on particular utilities, features, and capabilities.


    ![Figure 1.2 Overview of eHealth.](images/fig2_B.jpg)


    [Figure 1.2 Overview of eHealth.](#ch1.xhtml#R_fig2)


    For instance, `mHealth` or `mobile Health` combines the portability of mobile
    technology with the ubiquity of wireless telecommunications for the delivery of
    healthcare services. This could be for the purposes of training, awareness & information
    dissemination, emergency reporting, data collection, or locating healthcare facilities.


    Similarly, `TeleHealth` is the provisioning of remote clinical and non-clinical
    healthcare services over telecommunication channels by leveraging electronic ICTs
    when service delivery cannot take place physically.


    On the one hand, this is applicable for clinical purposes such as medical diagnosis,
    patient monitoring, physical therapy, off-site surgeries, consultation (between
    healthcare professionals and patients, and among healthcare professionals), medical
    reminders & follow-ups, and treatment prescription. While on the other hand, it
    is also applicable for non-clinical purposes like continuing medical education,
    and health administration. However, when TeleHealth particularly focuses on clinical
    healthcare services, it’s often been referred to as `TeleMedicine`.


    In the same vein, `Digital Health` or `digiHealth` harnesses the powers of digitalization
    (or digital information technologies) to enhance the precision and personalization
    of healthcare service delivery. Essentially, it seeks to interconnect data-driven
    technologies, competences, and capabilities from across multiple domains to improve
    the effectiveness of healthcare delivery, as well as the general health and wellness
    of human populations. DigiHealth has been widely applied for clinical decision
    support, as well as assistive and rehabilitative purposes.


    Recent times have seen a wide range of systems and devices feature in the context
    and operations of eHealth. They include hospital information systems (HIS), mobile
    phones/smartphones, computers, tablet devices, cyber-physical systems, sensor-based
    smart wearables (watches, glasses, headgears/headsets, etc.), data-driven decision
    support systems (DSS), RFID-based implants and ingestibles, robotic scanners,
    digital imaging devices, personal digital assistants (PDAs), and various forms
    of patient monitoring devices, among others. These are to mention a few.


    eHealth has contributed many benefits to the practice of modern medicine and healthcare
    delivery, which cannot be overstated. It has helped in bringing quality healthcare
    to communities that hitherto were unconnected to the global healthcare delivery
    chain due to impassable road networks, lack of funding, shortage or lack of healthcare
    staff, and language barriers. Several researches have also reported how various
    applications of eHealth have helped lower the cost of healthcare delivery for
    both administrators and consumers. It has helped in building confidence in both
    healthcare staff and patients, and generally helped to strengthen the healthcare
    systems of entire countries and regions.


    Indeed, the quality of healthcare and service delivery shares a strong correlation
    with the quality and reliability of patient health data that is available to inform
    healthcare decisions. However, healthcare data remains of a rather delicate, private,
    and confidential nature. This is because the life of the patient or care-receiver
    depends on its accuracy and consistency in real time, as well as its availability
    at all times, while the sanctity of their civil liberties could very well depend
    on its confidentiality.


    In many jurisdictions, EHRs (or healthcare data) form an integral part of healthcare
    delivery, while being fully integrated into national agendas for digitalization
    and technology development.


    ## Healthcare Data Invariants: Integrity, Confidentiality, and Availability


    Today, healthcare data (or `EHRs`) are worth over $400 USD per patient record


    `Integrity` is the characteristic of consistency, completeness, verifiability,
    accuracy, and authenticity throughout the life cycle of a data or information
    element. Integrity has both physical and logical (non-physical) aspects, and in
    many cases, these are a function of the practices and realities that originate
    at the design and developmental phases of data collection. Integrity is a key
    determinant of reliability, as it determines the extent to which data can be trusted
    as valid enough to be able to inform decisions, reliably.


    With respect to `EHRs`, and indeed other forms of data, Integrity faces a number
    of risks. This includes human errors that could originate at the point of entry
    or manipulation, malicious data and system operations, as well as mismatch errors
    that could result from moving or replicating data across different storage points.
    In addition, bugs and misconfigurations could affect concurrency in data (processing)
    operations, also including malware that seeks to alter and compromise data, and
    system failures that could affect data functions across multiple points.


    `Confidentiality` relates to the structures of authorization, modes of access,
    and patterns of use that apply to data elements throughout their life cycle. It
    is the duty of enforcing the authority to possess/access, so that data does not
    get into the wrong hands. To succeed in this duty, the prevention of such encounters
    with data elements that might prove inimical to the interests of data subjects
    is critical.


    There exists a number of risks to the Confidentiality of healthcare data. These
    include compromised access credentials, escalated privilege levels, misconfigured
    or poorly secured systems and devices for storing, processing, or manipulating
    data, open transmission over public analogue or digital media, disposal techniques
    that are not resilient against recovery and reconstruction, and existing vulnerabilities
    in acquired database systems and infrastructure.

