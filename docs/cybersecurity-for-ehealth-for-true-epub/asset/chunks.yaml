  raw: 'Often times, attackers pursue this aim through physical events and activities
    on site at the healthcare facility, and could involve insider operations that
    are either naive or maliciously intended. Nonetheless, through a systematic process
    of subverting or bypassing the specifications of policy provisions of healthcare
    organizations, these threats have often successfully eroded the boundaries and
    limits of organizational policies, gradually and systematically. In the long run,
    this exposes and perpetuates critical gaps that could open up paths of little
    resistance or almost no hindrance at all for malicious actors.


    On January 16, 2009, the U.S. Department of Health & Human Services (HHS) and
    CVS Pharmacy, Inc. – the largest pharmacy chain in the Country – reached a settlement
    agreement to the tune of $2.25 Million. According to an investigative report,
    “CVS failed to implement adequate policies and procedures to reasonably and appropriately
    safeguard protected health information during the disposal process”. Further adding
    that “CVS failed to adequately train employees on how to dispose of such information
    properly”, and “did not maintain and implement a sanctions policy for members
    of its workforce who failed to comply with its disposal policies and procedures”


    The investigation originated following discoveries that CVS casually disposed
    of pill bottles that contained protected health information of patients (names,
    addresses, and medication and other personally identifiable information) into
    open dumps that were accessible to the public. Thereby, potentially violating
    the privacy of its millions of patients.


    This incident provides an insight into the cybersecurity threat landscape that
    applies to the processes and operations of healthcare organizations, as well as
    healthcare organizational policies.


    ## What Are the Risk Factors?


    There are several risk factors that sometime help to soften the terrain for cybercriminals
    who target people/users, systems & devices, infrastructure, security lapses in
    processes and operations, and gaps in policy as a link to lay hands on a healthcare
    organization’s assets. Although, when threats target processes/operations and
    policy specifications, especially with malicious intention, it is usually as a
    precursor to a larger scheme, for which success relies on a weakened security
    culture at the target healthcare facility.


    Some healthcare organizations consider basic cybersecurity training as necessary
    for only their technical personnel or support staff, often citing constraints
    in funding, as well as the nature of certain job roles perceived to be non-technical.
    Worse still, many healthcare organizations (particularly across developing countries)
    fail to employ or regularly contract cybersecurity experts and professionals,
    even though they feature an extensive repertoire of eHealth products and services.
    However, when it comes to the context of eHealth, and perhaps other domains of
    cybersecurity, the role of the keeper and greeter at the entrance to the healthcare
    facility is as crucial to the protection of cybersecurity as that of the IT manager
    many floors above.


    A doorkeeper that understands how malicious actors might seek unauthorized physical
    access to healthcare facilities through approaches like piggybacking and tailgating,
    knows what to watch for when granting access to strangers who fail to promptly
    and correctly identify themselves at any and all points of entry or encounter
    within and around the facility. It becomes even better when such an individual
    also understands the possible resulting risks of implanting hardware keyloggers
    or network sniffers around the corporate environment.


    Similarly, consider a janitor who understands how scavenging for disposed storage
    devices, sticky notes with personal information, unshredded company documents,
    or casually disposed corporate systems that are no longer in use could provide
    malicious actors with useful information to compromise the cybersecurity status
    of a healthcare organization. Such an individual would be wary of unidentified
    strangers at intermediate dumpsites or garbage collection points that are used
    by the organization.


    A growing practice that has continued to see people/users, use the same credentials
    (usernames and passwords) across multiple web services and applications is another
    potent risk factor that cannot be overlooked. One security report ![Figure 2.4
    Cybersecurity Incidents in Healthcare – Risk Factors.](images/fig7_B.jpg)


    [Figure 2.4 Cybersecurity Incidents in Healthcare – Risk Factors.](#ch2.xhtml#R_fig7)


    However, another factor that is a common strain in the subversion of security
    processes and operations in healthcare, are laxities occasioned by familiarity,
    naiveness, and nepotism. According to the 20th-Century American Author, Bill Vaughan,
    “Familiarity is the most destructive of all iconoclasts”; with Professional Coach,
    Brittany Burgunder, adding that “Just because something is familiar, doesn’t mean
    it’s safe. And just because something feels safe, doesn’t mean it’s good for you”.
    Security personnel at a healthcare facility are more likely to subvert/bypass
    security protocols, processes, and operations, to grant access to an unidentified
    stranger who has simply become a familiar face at the facility, or to a relative
    who has not been able to provide authorization to access the facility. In the
    same way, an employee/user is more likely to be lax about the security of their
    personal access credentials, data, devices, when a relative or some other familiar
    person is involved.


    Also, a poorly engineered healthcare application that failed to robustly incorporate
    security protocols and safeguards in its design – like passwords encryption, input
    validation/error checking, secure socket communication, two-factor authentication,
    access/logon timeout, etc. – becomes a danger to user data that is collected,
    generated, or accessed by such an application. Using very simple and unsophisticated
    tools and techniques, many of them being software that are either freely available
    on the Internet or have publicly available source codes which only need to be
    compiled and run, sensitive user data could be siphoned by a malicious external
    actor.


    Then, there are healthcare systems (hardware and software) and devices that do
    not adopt best practices for security design and hygiene – such as up-to-date
    anti-malware applications, firewall policies, blockers for ads and trackers, operations
    that are hardened against interception, as well as interfaces that are resilient
    to reconstruction – which could become threats in themselves to healthcare data
    and information. Consider, for example, a security pin pad that incorporates distinguishable
    key tones, or engineered using hardware that is not resilient against wear occasioned
    by frequent and repetitive patterns of touch. Over time, this could pose a formidable
    threat to users’ data, access credentials, and other critical information.


    In the same vein, there are healthcare organizational policies that fail to guard
    against, or inadvertently grant to users more privilege, access, or accessibility
    to organizational systems/devices and infrastructure than is needed to effectively
    meet the responsibilities of their job roles. This poses an insidious danger to
    data and information, as these users become direct channels that malicious actors
    would be more willing to explore in order to reach assets.


    In addition, there are the legacy healthcare systems for which manufacturers have
    published announcements about discovered vulnerabilities; but then, these systems
    yet unpatched with security releases that fix these vulnerabilities, even while
    they are still in active use in various healthcare processes and operations. Indeed,
    this is analogous to a house that is widely known to be without a lock, but is
    still in use as a store for valuables belonging to various users.'
