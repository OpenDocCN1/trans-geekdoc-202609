    献给我服务的**上帝**——所有智慧与理解的赐予者。


    献给 **Lyndar** 和 **Patra**，感谢你们包容我在专注于写作时，许多周对家庭生活的疏离。


    # 前言


    网络安全的现代现实揭示了许多部门和行业在应对新兴趋势方面的准备不足。其中一个部门就是医疗保健行业。在该行业中，在现代信息通信技术的推动下，各种电子健康（eHealth）创新、系统和应用在全球医疗范围内普及和扩散，创造了一个威胁领域。在这个领域，政策和法规难以跟上发展，标准化面临多种背景挑战，技术能力在很大程度上匮乏。持续影响全球医疗保健行业的高频网络安全事件表明，这种准备不足往往已渗透到医疗机构的整个体系、层级和基层，尽管从可接受的财务和声誉指数衡量，此类事件的影响一直以来是灾难性的。


    当进入实际阶段时，有必要将与全球网络安全现实及医疗保健行业相关的最相关且基础的知识进行综合，并以适应全球医疗保健行业利益相关者技术能力不足的形式呈现这些知识。更重要的是，该领域的许多现有资源被批评为：要么是其内容过于技术化，无法为非技术医疗保健利益相关者提供有用且信息丰富的资源，要么是其范围过于理论化，无法就参与医疗保健行业网络安全的实际现实产生联系。


    因此，在本书书中，我尝试将定义学术特征的基于证据的科学方法方法的严谨性，与行业专业人士原生方法中对细节的关注和批判性评估的质量相结合。它提炼了最基础的信息，并以紧凑的方式呈现，易于吸收。这是通过从全球医疗保健行业的真实案例研究中汲取教训，推动其他复杂的原理和见解实现的；特别是对于没有医疗信息通信技术工作原理正式技术培训的医疗保健利益相关者。同时，它试图不将网络安全的批判性论述以及它对电子健康所预示的重大意义浅薄化。


    通过排除硬核技术内容，我成功整合了更关键的关注焦点，作为一个快速入门指南，使非技术医疗保健利益相关者（即医疗专业人员、医护工作者、监管和合规机构、医疗中心经理、行政人员和保险公司、客户/患者以及第三方供应商）能够以更具知识且更有效的方式理解电子健康网络安全的现实。


    总而言之，本书介绍了网络安全的基础知识和电子健康概览，涵盖了电子健康背景下网络安全的基础概念、观点和应用。随后，它深入探讨了针对电子健康的网络安全威胁格局，讨论了威胁类别、威胁源、威胁目标、各种威胁源所采用的策略和方法、网络安全威胁态势中的倾向性风险因素，以及在针对电子健康的网络事件中部署的各种工具/技术。此外，它讨论了作为电子健康系统、服务和基础设施守护者，增强个人网络安全的方法和最佳实践——包括一种逐步培养和敏锐网络安全直觉的方法。


    此外，本书还介绍了电子健康部署中数据和信息安全的基础原则，涵盖了维护完整性、保护隐私、确保机密性和保证可用性的不变性。随后，它讨论了确保电子健康系统和基础设施安全的物理、逻辑和操作上的必要要求，同时通过电子健康部署现实生态系统中的各种监控和评估程序及方法确保合规性。


    最后，本书对电子健康的治理、伦理和监管提出了一些思考，强调了重要的国际立法，这些法律为理解监管目标和挑战提供了必要的背景，以及管理/行政的角色和职责，以及合规与安全之间的关系。书中以书中关键术语和词汇的详尽词表结束，这些词汇被认为有助于没有信息技术背景的读者加深对这些词背景和用法的理解。


    所以，这里！向大家介绍：*电子健康网络安全*。


    **– Emmanuel C. Ogu**


    # 致谢


    我感谢过去几年中参加我培训和咨询活动的许多医疗利益相关者和专业人士。与你们的接触和互动提供了许多见解和背景，有助于丰富书中讨论。我非常感激有机会从你们在全球医疗保健行业的各种经验中学习。


    我也感谢我的朋友 Yushavia，以及 Trishula Pathways 和非洲医疗保健门户 (AHP) 的卓越团队。在疫情肆延导致的全球封锁期间，他们的推动、伙伴关系和协作激发了所需的紧迫感，推动了本书在最短时间内完成开发过程并最终完工。


    最后，我感谢 John 的编辑领导和 Stephanie 的编辑支持，他们都帮助出版过程成为一个全方位的愉快的体验。


    谢谢！


    **– Emmanuel C. Ogu**


    # 作者简介


