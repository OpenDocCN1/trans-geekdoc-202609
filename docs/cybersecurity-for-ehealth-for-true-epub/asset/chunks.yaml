  trans: '

    防御信息技术系统和资产免受威胁、恶意行为和攻击的实践与专业领域。


    ### 数据泄露

    一种故意或无意导致安全受损的网络事件，导致对被视为有价值且机密的信息的未经授权访问、披露或盗取，而这些信息本应受到其他方式的保护。


    ### 数据元素

    在语义和表示中定义的数据的原子性，其具有可以被收集、处理、存储或传输的值。


    ### 数据不变性

    一种绑定在功能性数据体上的不变属性，以及对此类数据执行的所有操作——包括在收集、处理、存储或传输之前、期间和/或之后的操作。


    ### 数据主体

    某一特定数据元素所指的人类或非人类实体。


    ### 拒绝服务

    一种防止合法用户访问数字平台、工具和资源（例如系统、设备和网络）的恶意行为，通常通过用无用的（有时是恶意的）流量和请求淹没并占用此类数字平台、工具和资源来实现。


    ### 数字足迹

    根据个人在互联网上的在线存在和活动可以获取的关于该个人的信息。


    ### 数字影子

    个人在与数字服务或平台交互后留下的所有残余信息（机密、专有或敏感）的集合。


    ### 域名

    一个永久标识在线位置（即名称和地址）的字符串，该位置在管理、权限和控制上是自主的。


    ### 加密

    对敏感信息进行编码的过程，使得只有拥有反转编码操作所需信息（通过称为解密的过程）的授权实体才能访问和理解这些信息。密钥是加密和解密过程中的关键组件，持有着成功且合法编码和解码数据的必要信息。


    ### 端到端 (E2E)

    一种设计原则，确保对于应用程序或安全操作至关重要的特征和功能位于介质的两端节点上，该介质作为端节点之间通信或交换的媒介。


    ### 遍历

    一种攻击步骤，旨在收集相关信息，以推断出目标域/环境（通常是计算机网络、物理办公地点或计算机系统）内感兴趣实体的完整或具代表性的列表/概。


    ### 防火墙

    一种提供防御计算机系统或私有网络未经授权访问的计算机程序。


    ### 信息通信技术 (ICTs)

    一个通用术语，通常用于描述通信和信息交换的统一模型、框架和装置，以及计算机和其他数字电子设备在促进此类信息的存储、处理、传输、检索和访问方面发挥的整合作用。


    ### 输入验证

    一种内置在设备或软件中的控制机制，用于检查并确保用户输入的数据符合处理的格式、规范和要求。


    ### 键盘记录器

    硬件或软件，能够监控并记录通过输入设备传递到数字计算系统或平台的用户的击键次数，并将此类信息存储或转发给攻击者。它通常用于出于恶意目的窃取敏感信息。


    ### 登录超时

    一种安全配置，允许用户在经过一段时间推移后自动从数字系统、设备和应用程序中注销。


    ### 恶意软件

    “MALicious”（恶意的）和“softWARE”（软件）术语的组合词。指设计用于未经许可或授权而渗透数字系统和网络的计算机程序，通常具有造成破坏的能力。


    ### 中间攻击

    通过在两个不知情的实体之间插入媒介来拦截数字通信的实践，通常带有恶意意图，以中继、重路由、更改或仅仅获取（或其他）未经授权的信息/数据访问。


    ### 最小化

    将数据收集操作限制为仅接收对于实现定义定义的特定目的所必需且相关的数据元素的实践。


    ### 网络

    数字电子设备（如计算机）的互连，实现了通信/信息交换以及在电子通道上共享文件和资源。


    ### 网络协议

    定义并规范计算机网络内设备之间如何进行数据和信息交换的交战规则。


    ### 网络嗅探器

    一种能够出于合法或恶意目的实时监控和分析网络上的数据包和协议的软件或设备。它有时也被称为网络分析仪。


    ### 数据包

    网络承载的数据单元，其格式化为包含跨网络传输数据所需的必要信息和控制参数。


    ### 数据包追踪器

    一种用于映射数据包在网络上传输路径的软件或设备，通常通过在物理、逻辑或概念层面上模仿或模拟网络的布局和结构来实现。


    ### 补丁

    为计算机程序或其使用的文件和数据提供的增强程序，用于修复程序中的安全漏洞或缺陷。


    ### 钓鱼攻击

    一种社会工程的形式，通常涉及攻击者/恶意个人在文本通信中（例如电子邮件、即时消息 [IM]、短信 [SMS] 等）伪装成受信任的实体。


    ### 平台

    一种业务工具，其运营模型允许多个参与者（消费者）连接到它，以交互、共享、创建和衍生价值为，通常通过双向交互和交换来实现。


    ### 策略

    一组特定的程序和原则，旨在为知情决策和导致合逻辑结果的行动提供指导，这些结果应符合更广泛的愿景目标。


    ### 编程

    通过由计算机系统理解和处理的特定语言编写指令或命令来创建计算问题解决方案的过程/任务。


    ### 伪匿名化

    将数据体中的个人身份信息替换为非可识别信息的实践，这些信息映射到一种能够轻松推断原始个人信息的描述中；从而将原始数据转换为不再能个人识别数据主体的状态。


    ### 侦察

    攻击程序中的初步步骤，旨在收集有关目标系统/网络的身份、操作和漏洞的有用信息（有时被称为遍历），通常是为了在稍后的针对系统/网络的攻击中利用这些漏洞。


    ### 拾遗

    在垃圾中搜寻感兴趣的残余信息的实践；尽管这些信息可能由于其敏感性而通常无法获取，但可以为未来的恶意操作提供有用情报。


    ### 安全套字层

    一种用于加密网络通信/交易的协议。它有时也被称为 `安全套接层 (SSL) 通信`。


    ### 安全协议


