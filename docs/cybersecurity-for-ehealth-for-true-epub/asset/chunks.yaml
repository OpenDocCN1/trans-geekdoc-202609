  trans: '


    # 工具与技术


    - 包含恶意软件（勒索软件、木马、病毒、间谍软件、根内核、逻辑炸弹、蠕虫和自动运行脚本）、数据恢复软件、网络钓鱼/语音钓鱼、扫描器与跟踪器、搭车/尾随、窥视、数据包追踪、网络协议与服务中的隐藏隧道、跨站脚本
    (XSS)、SQL 注入、信号干扰器/干扰发生、网络嗅探器与分析器、键盘记录器、抢劫、机器人和机器人网络。


    在实践中，工具和技术作为方法/策略/手段的一部分被整合到威胁目标框架内，旨在实现网络安全事件的结果。但在实践中发现，多个威胁目标可以包含不同的方法/策略/手段，这些方法反过来又会大量复杂的工具和技术（特别是涉及恶意意图时以引发网络安全事件。


    例如，作为导致医疗系统故障的威胁攻击目标的一部分，诱导性故障可能通过权限提升开始链条，该权限提升整合了一种欺骗技术，试图在系统眼中冒充授权的数字身份；随后在系统或设备上传输恶意软件或执行
    SQL 注入。同样，一种寻求为了经济利益破解电子健康记录的威胁攻击策略，可能会利用硬件或软件网络嗅探器和数据包分析器，其技术特征是在医疗设施现场通过物理事件捕获敏感信息（例如访问凭据），作为整合了内部人员操作的协调数字拦截策略的一部分。


    ## 相关人员/用户


    人员/用户是医疗领域网络安全威胁格局中的频繁目标。正如第一章 所示，这是因为他们通常是全球医疗行业中高价值资产的软目标。有时，对用户的威胁可能源于同一流程/操作链中其他用户的意识行为或无意行为。其他时候，他们可能是恶意外部人员针对性的尝试，旨在利用推断出的、感知或披露的漏洞来获取经济利益。


    通常，当威胁和攻击针对医疗领域的人员/用户时，他们通常盯着关于用户的敏感 `Data`（数据）以及他们持有的 `Access Credentials`（访问凭据）。这些威胁/攻击渗透和传播的最常见且最流行的途径可能是社会工程。


    ### 社会工程


    社会工程在实践中利用了多种方法，旨在欺骗/操纵个人，使其在不同情况下做他们不太可能做的事情。这可能包括泄露敏感信息、执行不利于安全利益和目标的行动，或授予不受允许的让步。


    社会工程通常试图利用认知偏差（有时被称为“人类硬件中的 Bug”）以及其他心理和行为倾向/易感性。这是一种强大的技术，因为这些偏差往往构并影响了用户最显易见的行为和动作，使他们容易受到恶意行为者某些类型的外部影响。通过社会工程，已经证明可以欺骗医疗领域的人员/用户成功泄露敏感的财务细节和账户凭据。还可以操纵或诱导他们点击链接或连接移动设备，这些设备最终会传输并安装恶意软件，从而让攻击者获得对系统资源的持久且特权的访问权限。


    ### 网络钓鱼与语音钓鱼


    网络钓鱼（Phishing）和语音钓鱼（Vishing）是社会工程的常见方法，经常出现在针对医疗领域人员/用户的威胁攻击场景中。这是在电子通信中冒充信任实体的行为，旨在通过欺骗获取敏感数据或信息。当这种行为通过基于语音的电子通信（如电话或或语音录音）实施时，被称为
    `Vishing`（语音钓鱼）。然而，当它通过基于文本的通信（如电子邮件、聊天/即时消息或短短信）实施时，被称为 `Phishing`（网络钓鱼）。


    ### 其他工程方法


    其他社会工程方法包括搭车（piggybacking）或尾随（tailgating）——这种做法是秘密跟随对安全或受限医疗应用程序/设施/区域授权访问的人员，以通过所需的安全检查或访问验证协议，并在不通过授权程序的情况下获得访问。此外，还有窥视（shoulder-surfing）技术，在用户输入这些凭据时，通过窥视用户的肩膀来观察并可能记住用户名、密码、PIN
    码、信用卡详情和安全 URL 等安全凭据。


    此外，社会工程特别针对医疗领域人员/用户关于其日程安排、雇主、工作环境与文化、在线和线下互动、数字设备及其使用、网络连接以及用户界面与应用程序。这可以通过被动推断（不与目标用户直接交互或界面，而是通过公开的来源）或主动推断（涉及与用户的直接交互和界面）。恶意行为者偏好社会工程，可能是因为这几乎不需要技术知识，并且通常提供了一条阻力最小的路径。


    想想：为什么试图获取敏感和高价值医疗数据的恶意个人，要花费大量时间设计一种复杂的恶意软件，作为稳健攻击方案的一部分，用以破解高度安全的组织服务器和系统？相比之下，他们完全可以：


    - 在电话中伪装成医疗机构的技术人员，欺骗具有授权访问权限的纯真员工使其泄露登录凭据；

    - 在医疗设施内部的私人工作区附近徘徊，等待用户离开工作站但未完全注销，然后跳入并使用该用户的凭据继续访问；

    - 操纵医院中心存不满的技术人员（其拥有授权访问权限，由于其拥有授权访问权限且可能不知道此类数据在黑市上的实际价值，诱导其以廉低的价格传输此类数据；

    - 在忙碌工作日的入口高峰段，尾随一名对本应安全的医疗设施拥有授权访问的员工（该设施存有电子健康记录），然后植入能够实现远程访问和汲取敏感数据的设备；

    - 利用授权的医院员工的信任关系或利他倾向，请求使用其个人或工作设备，并在过程中在设备上植键盘记录器或其他恶意软件；

    - 创建面向公众的用户界面的相同副本，以欺骗不知情的授权用户或员工提供访问凭据；或

    - 通过不诚实的用户/医疗专业人员公开发的照片（显示了电脑屏幕）推断出非公开用户界面的布局和内容，然后创建一个相同的副本，发起针对医疗机构员工的大规模身份窃取。


