    例如，一名试图快速部署网络服务的网络管理员，为了同时处理多个任务并提高效率，可能会使用 shell 脚本来在组织网络上自动配置和托管该服务。有时，该管理员可能会忽略某些默认配置参数，而这些参数并不符合该组织的安全标准、政策和运营框架。与此，一名用户尝试通过仅限公司设备访问的办公室内网络连接来访问其在线社交网络，可能会尝试通过插入个人移动设备来上传多媒体文件（照片和视频）。他们没有考虑到恶意软件可能会通过这种方式渗透到公司网络。


    此外，医疗机构的门卫人员可能无法理解在所有入口处未能出示有效准入卡（无论相关情况或涉及人员如何）对网络安全构成的风险。因此，该人员可能会为无法够及足够高度以刷准入卡的轮椅使用者手动干预或破坏访问验证协议。一个费力拖着好几个袋子的老年访客也可能获得同样的妥协；即使是一个在当时似乎找不到准入卡的员工也是如此。这样的门卫人员可能并没有察觉到，这些事件很可能是某种协调安全违规策略行动的前奏或预兆。


    同样，一名清洁工或维护人员可能无法理解关键系统、网络服务或连接不可用所带来的网络安全风险。结果，他在执行清洁任务过程中不小心绊到网络线或电源线，然后随口忽略了立即通知技术
    IT 人员处理该事件的必要性。最终，这可能导致服务可用性以及从该连接点向下的服务交付中断；甚至可能导致依赖该特定连接保持在线的系统和设备所服务的有效性中断。


    总之，电子健康（以及可能广义的网络安全）的圣杯，本质上是保护和维护机密性、完整性和可用性这“三大不变性（Invariants）”的神圣性。但在实践中，这通常只能通过部署一种多维度的方法来实现，该方法考虑了基础设施与系统、与之交互的人员（技术和非技术用户，以及支持人员）、依赖这些系统的业务流程，以及为所有这些提供治理框架的组织政策之间的各种交互。


