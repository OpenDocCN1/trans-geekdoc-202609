    \ victory gained you will suffer a defeat. If you know neither the enemy nor yourself,\
    \ you will succumb in every battle.\n   > – Sun Tzu, *The Art of War*\n\n   When\
    \ healthcare stakeholders keep custody or stewardship of organizational assets,\
    \ it is crucial to personal cybersecurity that they are cognizant of not just\
    \ the value of the assets entrusted to them, but also the kinds of entities that\
    \ might be interested in laying hold on such assets, especially with malicious\
    \ intentions. This is a critical principle for personal cybersecurity. One that\
    \ keeps before healthcare stakeholders the realities about the nature of actors\
    \ that they are likely to be going against, as well as what security resources\
    \ and capabilities are available to defend against these actors effectively. This\
    \ way, they are better able to gauge and calibrate their `Intuition for Security`\
    \ to align with the status and realities of the threat domain they might be entering\
    \ into by being responsible for securing these assets at the personal level.\n\
    \n   For example, a healthcare professional employed at a facility domiciled inside\
    \ a military or government agency must be cognizant of the fact that even sovereign-affiliated\
    \ or sovereign-sponsored threat actors might seek to lay a hold on their access\
    \ credentials and tokens. This could either be useful for accessing secure locations,\
    \ or secure healthcare systems that might be housing electronic health records\
    \ of senior government or military officials.\n\n3. Understand what types of tools\
