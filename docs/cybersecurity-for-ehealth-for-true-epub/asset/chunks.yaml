- fmt: '

    **Emmanuel C. Ogu** is a Consummate Computer Scientist, a Chartered IT Professional,
    an Advocate for Digital Rights & Freedom, a Cybersecurity Specialist, a Technology
    Governance & Digital Development Expert, and a Sustainable Development Researcher.
    He is a 2020 Youth Ambassador of the Internet Society (ISOC) to the Internet Governance
    Forum (IGF), with more than 7 years of cumulative experience working at the intersection
    of Cybersecurity and Information Technology within the domains of Public Policy,
    Sustainable Development, and Internet Governance.


    # 1 Cybersecurity Basics & Overview of eHealth


    DOI: [10.1201/9781003254416-1](https://dx.doi.org/10.1201/9781003254416-1)


    ## Introduction


    In July of 2018, Singapore’s Ministry of Health, and Cyber Security Agency received
    a report regarding a data breach at the Singapore General Hospital (SingHealth)
    – Singapore’s largest group of healthcare institutions. This breach resulted in
    the stealing of 1.5 million records of personal data over a week-long period,
    and further targeted outpatient medication information of some 160,000 patients.


    These patients were individuals who had visited specialist outpatient clinics
    and polyclinics at SingHealth from May 01, 2015, to Jul 04, 2018, and included
    the Prime Minister of Singapore – Lee Hsien Loong – as well as other senior ministers.
    It was to go down the memory lane as the `SingHealth` data breach. A high-profile
    cyber-attack that could have been prevented through better cybersecurity hygiene
    and practices, and occurred at a time when health data sold for at least $50 on
    the global black market. The `SingHealth` data breach uncovered a host of technical
    and non-technical lapses in the cybersecurity frameworks at SingHealth; and, an
    attacker that has been described as stealthy, “skilled, patient, and persistent”
    is believed to have orchestrated this breach


    At first, the Integrated Health Information System (IHIS) – the Agency responsible
    for the security of information technologies used in Singapore’s public health
    system – detected the breach, following the recording of suspicious activity on
    one of the database servers that hosted electronic health records (EHRs). Initial
    investigations revealed that a malware infiltration on one of the front-end user
    workstations might have provided the entry point for the infamous attack, through
    which the masterminds were able to gain privileged access to server resources
    and equally mask their digital footprints properly.


    In January 2019, an independent 450-page Report


    In summary, the Report by the CoI anchored the cause of the data breach on critical
    gaps in the perceptions and conceptualization around cybersecurity at SingHealth,
    as well as the manner of implementation, and practice.


    ## Cybersecurity Basics & Overview of eHealth


    The `SingHealth` cyber-attack is one of several high-profile incidents that have
    made the global healthcare sector a cynosure of negative media attention and much
    public outcry in recent years. Certain common themes have featured frequently
    along the trails of these incidents, including poor cybersecurity awareness, unhealthy
    system and infrastructure security practices, gaps in policy and governance frameworks,
    and insufficiencies in the conceptualization and understanding of cybersecurity.


    These themes highlight a recurring strain of similarities that are altogether
    indicative of the reality that the pervasiveness and proliferation of various
    eHealth innovations, systems, and applications in global healthcare, powered by
    modern information and communications technologies, have created and perpetuated
    a threat domain. This threat domain is on wherein policy and regulation struggles
    to keep pace with development, standardization faces several contextual challenges,
    and technical capacity is largely deficient. The consequences, nonetheless, have
    remained dire.


    Thus, we end up with a soft, high-value target for criminal masterminds, who have
    continued to scourge the global healthcare sector for financial gain. Class action
    lawsuits with lingered proceedings, strained financial capacities owing to huge
    compensation payouts, and the mistrustful sentiments and disrepute that trails
    emanating debates in many circles. All of these have been the direct impact of
    this unfortunate convolution.


    ## The 2020 Healthcare Cybersecurity Report


    This chapter introduces cybersecurity as a multi-dimensional concept, with an
    overview of eHealth and its various applications across domains of modern healthcare,
    while also discussing healthcare data, as well as the invariants that apply to
    this unique data class. In addition, the chapter features discussions about user
    interactions with information and communications technologies (ICTs), as the fulcrum
    of underlying causes in healthcare cybersecurity incidents.


    ## Cybersecurity as a Concept


    Cybersecurity is a composite multi-dimensional concept with many existing definitions.
    However, the best of these definitions underscore four panels as the aspects that
    form the aspects that form cybersecurity. They are `Information Technology Assets`,
    `People/Users`, `Processes`, and `Policies`.


    `Figure 1.1` depicts this conceptualization.


    ```

    ![Figure 1.1 Four Panels of Cybersecurity](images/fig1.jpg)

    ```


    [Figure 1.1 Four Panels of Cybersecurity](#ch1.xhtml#fig1)


    `Information Technology Assets` encompass the Infrastructure, Systems, Platforms,
    and Devices that feature in eHealth deployment. These include the servers and
    platforms on site and off site that host data and services in order to provide
    the utilities, the network mediums over which these utilities are provisioned,
    and the end-point systems and devices that are used to access these utilities.
    These systems and devices could include mobile phones, computers, tablet devices,
    and other information technology (IT) systems.


    `People/Users` refer to the human agents that interface with Infrastructure for
    various purposes. They could be personnel who rely on the utilities provided by
    the Infrastructure to render services, clients who benefit from these rendered
    services, which sometimes requires them to interface with the Infrastructure directly/indirectly,
    or vendors who rely on the Infrastructure to provide services to the organization.


    `Processes` refer to various organizational operations that are supported by the
    services and utilities provided by Infrastructure. They could include a wide range
    of activities ranging from customer service, to sales, purchasing, audit, and
    distribution, to mention a few.


    `Policies` are the organization-wide prescriptions that guide and regulate how
    Infrastructure, People, and Processes function and co-interact around key organizational
    assets like data and information. In the most excellent deployments, the design
    of these prescriptions aligns with wider-acceptable best practices in the industry
    of business operations.

