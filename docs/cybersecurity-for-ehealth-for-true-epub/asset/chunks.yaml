    Thus, this chapter presents and traverses the Cybersecurity Threat Landscape for
    eHealth, and then discusses an overview of what happens when cybersecurity incidents
    target the healthcare sector. It further presents the more common threats to users,
    threats to systems & devices, threats to infrastructure, threats to processes/operations,
    and threats to policies that feature in this Threat Landscape. It then goes on
    to highlight and elucidate a repertoire of risk factors that help to insure the
    success of malicious activities that target the healthcare sector.


    # The Cybersecurity Threat Landscape for eHealth


    Although not very different from the general cybersecurity threat landscape per
    se, the particular high-value nature of the assets that feature in the global
    healthcare sector (including user data and critical infrastructure) make these
    assets the priced trophies that criminal masterminds crave to lay hands on. This
    is probably the reason why healthcare cybersecurity incidents are relatively more
    popular and high profile.


    By deploying an array of tools, techniques, and strategies, all varied in their
    sophistication, attackers seem to retain the upper hand as preparedness and response
    efforts struggle to keep pace with the dynamic nature of the cybersecurity threat
    landscape. Indeed, threats to cybersecurity in Healthcare have been discovered
    to pertain to end users; the applications that avail various healthcare functions
    and services; and the systems and devices that are used to access these user applications.
    While at the same time, also targeting the data that they generate, store, process,
    and use; the infrastructure that underlies and powers these systems and applications,
    and the information that are transmitted over these infrastructures; the business
    processes and operations that rely on the efficient functioning of these Infrastructures;
    and the policies that define and guide interactions within this realm.


    Therefore, it is useful, and perhaps intuitive to consider a layered approach
    to understanding the Cybersecurity Threat Landscape to eHealth. [Figure 2.1](#ch2.xhtml#fig4)
    presents a layered conceptualization of this Threat Landscape. Indeed, what is
    (or should be) the goal of cybersecurity for eHealth is to protect Users and their
    Data from malicious actors. In order for this to be effectively pursued, Systems
    (hardware and software) and Devices, which have the most direct impact and interface
    with users and data, need to be protected. In the same way, this applies to the
    Infrastructure that provides the framework for interactions, which systems and
    devices often leverage to interface with users and their data. The processes and
    operations that necessitate these interactions between systems & devices on the
    one hand, and then users & data on the other hand, over corporate infrastructure
    are also critical considerations in this Threat Landscape. While at the same time
    not neglecting the policies and procedures that define the context for these various
    facets of interactions.


    ![Figure 2.1 A Layered Approach to Understanding the eHealth Cybersecurity Threat
    Landscape.](images/fig4_B.jpg)


    [Figure 2.1 A Layered Approach to Understanding the eHealth Cybersecurity Threat
    Landscape.](#ch2.xhtml#R_fig4)


    Therefore, within this eHealth Threat Landscape, policies and procedures should
    clearly define what users and data participate in particular processes and operations,
    the systems and devices permitted to feature in these interactions, as well as
    the infrastructural provisions necessary to power these interactions. This is
    because gaps in the policy are capable of endangering processes and operations,
    and, by extension, putting infrastructure at risk, thereby jeopardizing the security
    of interactions involving medical systems & devices, as well as users and their
    healthcare data.


    Here is a way to look at it. When healthcare organizational policies fail to define
    clearly the operations of customer service, particularly in terms of boundaries
    and limits, it may seem right to some employees to bring clients/customers beyond
    the general waiting area/reception of the facility into their personal workspaces.
    Within this private space, these customers could have access to internal network
    connections and be able to rattle firewall operations, or enumerate and reconnoitre
    healthcare systems and devices, especially if they have malicious intentions.
    They are also able to view and snapshot private user interfaces, see usernames
    and other authentication parameters, thereby endangering users and their data.
    In essence, a policy insufficiency of a healthcare organization is able to perpetuate
    an insidious susceptibility that can ripple through the core of the organization’s
    assets. The same is true as you proceed inwards in this layered threat landscape
    (Figure 2.1). However, it is noteworthy that the conceptualization in Figure 2.1
    is merely idealistic. Because, in reality, corporate arrangements may not particularly
    reflect this exact representation.


    While it is often commonplace to use the terms `threat` and `attack` synonymously
    or analogously when referring to happenings in cybersecurity, even in the context
    of healthcare, they do not actually mean the same thing, at least not technically.
    The fundamental difference generally lies in the notions of “intention” and “intentionality”.
    Whereas “intention” is a function of the purpose/motive/aim/goal, “intentionality”
    is a function of the process/manner/method.


    A `threat` is an insidious security condition, the creation of which may or may
    not have been intentional and features intention that may or may not be malicious.
    However, its behaviour and action could, nonetheless, enable or directly result
    in a security violation. An `attack`, on the other hand, is a security violation
    that intentionally compromises a security condition, typically with malicious
    intentions.


    Another concept that often features in this context is the concept of “vulnerability”.
    A `vulnerability` is a security gap, susceptibility, or weakness that a `threat`
    takes advantage of, in order to result in a security violation. So, in other words,
    and in many instances, threats must meet vulnerabilities, in order for security
    to be successfully compromised, or attacks orchestrated. [Figure 2.2](#ch2.xhtml#fig5)
    depicts this relationship.


    ![Figure 2.2 Threat, Vulnerability, and Attack.](images/fig5_B.jpg)


    [Figure 2.2 Threat, Vulnerability, and Attack.](#ch2.xhtml#R_fig5)


    Vulnerabilities, in this case, could exist in users (their behaviours, propensities,
    and activities); infrastructure, systems & devices (by virtue of their design,
    operations, and usage); processes & operations (concerning their security resilience),
    as well as policies (in terms of their robustness). In essence, Vulnerabilities
    are often a product of inherent lapses in the systems, devices, strategies, processes,
    and procedures put in place for security, protection, and defence.


    For example, a weak/unchanged default user password is a `Vulnerability`. Writing
    it on a sticky note and pasting it close to a computer in order not to forget
    it, that is a `Threat`. When a third party leverages this condition to gain unauthorized
    access to a user account on an eHealth product or service, a security violation
    has occurred.


    Similarly, a healthcare computer system without anti-malware installed poses a
    `Vulnerability`. Removable devices that connect to such a computer are `Threats`.
    However, when a piece of malware successfully transloads from these removable
    devices onto the computer, a security violation has occurred. Realize that this
    violation could be an unwitting outcome of the `Threat` action. It could also
    represent the success of a deliberate attempt to infiltrate the computer system
    with malicious intention, in which case referring to it as an attack would be
    right.

