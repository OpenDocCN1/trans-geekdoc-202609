    A client base in a new jurisdiction, a new branch or subsidiary, a new vendor/supplier/affiliate,
    a new healthcare service, a new employee, transitions in working arrangements
    – all of these are activities that healthcare organizations could undertake, which
    open up new ecosystems around existing eHealth deployments.


    Within these new ecosystems, it is important to be cognizant of new data access
    points that are created, extensions of existing digital infrastructures (networks
    & systems), acquired/integrated digital participants and assets (data, systems,
    users), as well as new regulatory implications that might have been imposed by
    these new ecosystems. All of these new realities must be properly enumerated,
    and should form part of the considerations for monitoring & evaluation plans and
    efforts, especially in order not to perpetuate redundant ecosystems around eHealth
    systems and infrastructures that could surreptitiously avail an entry point of
    least resistance to malicious actors.


    Therefore, access credentials that are created when employees are hired, must
    be deactivated and archived when an employee ceases to work at a healthcare organization
    anymore. When users switch between eHealth services, their access to previous
    services should be disabled. Network and data access points for former vendors
    and affiliates should be promptly shut down. When working-from-home arrangements
    change, the remote provisioning and access to certain eHealth resources and utilities
    should be reviewed accordingly. Digital devices and storage media belonging to
    the healthcare organization should be retrieved when medical professionals change
    employers.


    Taken holistically, these few pointers highlighted in this chapter offer a progressive
    template that could be robustly applied towards better cybersecurity for eHealth
    systems and infrastructures in the practice of modern healthcare.


