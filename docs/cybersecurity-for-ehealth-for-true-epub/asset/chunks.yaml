  trans: "\n\n这些都是可能存在的防御防线，旨在电子健康（eHealth）背景下，通过启发和支持个人网络安全工作，无论是作为安全韧性和威胁预防的补充还是增补。因此，医疗保健专业人员熟悉并配合这些防御防线，是增强其`安全直觉`（Intuition\
    \ for Security）过程的重要部分，以便能够有效应对电子健康网络安全威胁格局的现代现实。\n\n因此！请使用强密码并定期更换。避免重复使用旧密码，无论距离上次使用已过了多久。在安全更新发布后，尽快安装/应用这些更新。不要共享或泄露个人访问凭据。避免在缺乏专业操作知识的情况下胡弄安全软件和实用程序。警惕点击链接以及绕过过滤器访问通常受限或可能被标记为潜在危险的网站，或下载资源。在使用个人设备执行敏感工作功能/职责时要务必小心。不要在纸上写密码和访问凭据；数字密码管理软件提供了更安全的替代方案。以上仅是其中几点。\n\
    \n现在，可能会出现自保成为个人网络安全考虑因素的糟糕情况，例如生命和人安全可能直接受到威胁时。在这种情况下，了解有哪些哪些防线可以支持个人网络安全，可能会触发某些行为反应，这些反应从回溯来看，在不危及个人安全的情况下反映个人网络安全的最佳选择。\n\
    \n因此，为了能够识别、隔离和遏制医疗信息技术应用中针对个人安全的威胁状况，仅仅让医疗利益相关者知道其安全管理范围内的资产可能可能被威胁者利用是不够的。他们还必须意识到哪些威胁者可能对在这些资产上获得脚点感兴趣，并同样理解威胁者在寻求破坏这些资产时可能应用何种工具和技术。除此之外，观察性能效率的偏差也至关重要，以便通过冻结传播和放大的媒介来规避威胁状况。然而，这一切都依赖于对支持和启发个人网络安全工作的防御防线的敏锐理解。\n\
    \n## 升级与报告\n\n事实是，在医疗信息技术背景下，存在某些针对个人网络安全的威胁和威胁状况，普通的（未受过技术培训的）利益相关者可能无法做好准备或无法有效处理。例如，考虑那些涉及国家资助或与国家关联的威胁代理和实体，甚至实际国家实体本身的威胁状况。在这些情况下，威胁者的资源能力充足，且通常远超支持和启发个人网络安全的可能存在的任何最佳手段。\n\
    \n在这种情况下，用户假设他们能够有效且有韧性地应对这些威胁状况是愚的。因此，电子健康个人网络安全的责任之一，确切地说也是`安全直觉`，在于能够识别自己何时正面对一个从到目前为止远超其自身资源能力（如培训和安全设置）的威胁者，并知道何时以及如何进行适当的升级和报告。\n\
    \n尽管如此，对所有针对个人网络安全的疑似、确认的、成功或未成功的威胁尝试进行升级确实至关重要。及时、充分地向医疗机构内部的相关部门/机制报告此类尝试至关重要。忽视这一点是危险的，因为对个人网络安全的威胁很少是孤立或随机事件。它们通常是旨在破坏组织/企业网络安全状态的大规模协调尝试。因此，通过及时有效地报告此类尝试，可能及早启动足够的警惕措施，以阻止迫在眉睫的大规模攻击。\n\
    \n然而，事件报告与升级的方法根本上取决于建立了什么样的组织或监管结构来管理网络安全事件（无论是作为特定类别的事件还是作为通用事件处理方案的一部分）。因此，对于医疗机构而言，建立有效的事件处理和管理结构是不可或越的，特别是考虑到医疗服务交付特征的运营关键性，以及对人类生命的风险维度。此外，同样重要的是`人员/用户`能够意识到组织事件管理机制规定的关于事件升级和报告的程序。\n\
    \n尽管如此，如何将网络安全事件有效地传达给相应的组织技术支持以及安全或事件管理团队，对于非技术用户（通常由他们报告这些事件）和必须响应这些事件的技术团队来说都是一个现实挑战。这很多时候是由于用户在升级报告中沟通事件的能力，与这些报告对于提供及时有效的技术响应的易理解性和实用性之间存在脱节导致的。以下是一些说明性问题，帮助`人员/用户`有效地向技术支持和响应团队升级并报告医疗网络安全事件。\n\
    \n1. **你如何描述在事件发生前直到报告这段时间期间，你的个人网络安全和用户体验的现状？**\n   务必说明你作为信息技术用户，在报告事件之前的这段时期内可能经历的所有值得注意的事件。\n\
    \   这些可能是个人参与、介入和互动中显著的事件或情况，涉及与设备、系统或访问凭据的（尝试性）交互。\n\n2. **个人保管的信息技术资产的正常操作行为和状态是否存在任何明显的变化或偏差？这些事件以前发生过吗？**\n\
    \   确保充分说明所有与个人使用信息技术相关的异常情况。如果情况属实，请不要忘记说明此前已注意到这些异常情况。\n\n3. **在这些行为发生之前，正在进行哪些用户操作和活动？**\n\
    \   恰当地报告在注意到第一次及后续行为和运行条件异常时，与个人使用信息技术相关的、正在进行的操作和活动。\n\n4. **是否有任何与事件相关的值得注意的周围环境？**\n\
    \   如果有任何相关的事件，请务必也说明这些。这些事件可能是环境方面的、功能/操作方面的或其他方面的。\n\n5. **在升级/报告之前，是否针对正要升级/报告的情况采取了任何个人（已授权或未授权的）措施？**\n\
    \   务必准确且透明地说明在报告所涉事件之前，可能采取了哪些个人措施，无论这些措施是否经过授权。此外，说明哪些见解可能指导了这些措施。\n\n"
