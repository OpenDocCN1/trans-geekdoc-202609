    ## Healthcare Data Invariants: Integrity, Confidentiality, and Availability


    Today, healthcare data (or EHRs) are worth over $400 USD per patient record


    **Integrity** is the characteristic of consistency, completeness, verifiability,
    accuracy, and authenticity throughout the life cycle of a data or information
    element. Integrity has both physical and logical (non-physical) aspects, and in
    many cases, these are a function of the practices and realities that originate
    at the design and developmental phases of data collection, processing, and storage
    mechanisms, before rippling upwards. Integrity is a key determinant of reliability,
    as it determines the extent to which data can be trusted as valid enough to be
    able to inform decisions, reliably.


    With respect to EHRs, and indeed other forms of data, Integrity faces a number
    of risks. This includes human errors that could originate at the point of entry
    or manipulation, malicious data and system operations and interactions, as well
    as mismatch errors that could result from moving or replicating data across different
    storage points. In addition, bugs and misconfigurations could affect concurrency
    in data (processing) operations, also including malware that seeks to alter and
    compromise data and information, and system failures that could affect data functions
    across multiple points. Indeed, to compromise Integrity is to diminish the trustworthiness
    of data for any purpose, and at all points throughout its life cycle.


    **Confidentiality** relates to the structures of authorization, modes of access,
    and patterns of use that apply to data elements throughout their life cycle. It
    is the duty of enforcing the authority to possess/access, so that data does not
    get into the wrong hands. To succeed in this duty, the prevention of such encounters
    with data elements that might prove inimical to the interests of data subjects
    is critical. This is without exceptions to purposes, intent, or actions that might
    include viewing, sharing/transmitting, usage, or disclosure; and particularly
    when such an encounter is unintentional, unauthorized, unlawful, unnecessary,
    or unscrupulous.


    There exists a number of risks to the Confidentiality of healthcare data. These
    include stolen or compromised access credentials, escalated privilege levels,
    misconfigured or poorly secured systems and devices for storing, processing, or
    manipulating data, open transmission over public analogue or digital media, disposal
    techniques that are not resilient against recovery and reconstruction, and existing
    vulnerabilities in acquired database systems and infrastructure. In many contexts,
    to compromise confidentiality is to undermine the legitimate claims to the privacy
    of data subjects in ways that oppose the wider-acceptable prescriptions and norms
    regarding digital and civil rights.'
