    ## 6. 是否曾经尝试对此类事件和发生的情况进行升级/报告？


    如果曾尝试过通过正式（通过现有的组织渠道）或非正式的方式对此类事件和异常进行升级或报告，请务必同时提及这些情况，并确保说明这些尝试产生了什么结果或指令（如果有的话）。


    ## 7. 你对正在报告的事件是否有任何目前的怀疑和意见？什么可能导致了这些怀疑/意见？


    对正在报告的事件持有个人怀疑和意见是可以的。毕竟，你被认为是该事件的初始接触点之一。因此，请清楚且明确地陈述这些怀疑；不要忘记提到可能导致这些怀疑的原因。


    在网络安全事件的口头报告中，针对这些问题准备好答案可能是一个好主意。即使在书面事件报告中，确保在报告中提供对这些说明性问题的答案同样重要。这些说明性问题并非并无遗漏，但它们为在这方面的有效进展提供了实用的指南。


    因此，显而易见，在医疗和电子健康（eHealth）背景下，个人网络安全的有效性取决于组织机制是否到位以实现以下目标：


    1. 确保用户获得最新的培训和意识提升；

    2. 提供强有的安全策略和协议，以巩固组织的安全状态；

    3. 保证实时信息验证，以及及时高效的技术支持；

    4. 有效且谨慎地管理并最小化风险和责任；以及，

    5. 建立韧性的流程和程序，用于协调事件报告、升级、调查、响应/处理和恢复。


    这进一步说明了这样一个事实：通往有效个人网络安全的之旅始于医疗组织或机构的高层行政和管理层。因为只有在这个框架内，网络安全意识的效应才能从高层向外并向下扩散，从而通过敏锐化对安全的直觉来增强个人网络安全的能力。


    考虑到当前电子健康网络安全的现状，医疗机构及其资产在任何时候受到威胁早已不再是一个“是否”的问题，而是“何时”以及医疗机构及其资产将“如何”受到威胁的问题。因此，这归结为面对即将发生或正在发生的组织网络安全状态的威胁和攻击时，为增强准备和响应能力而采取的措施和步骤。它们在威胁情况下的表现如何，直接取决于威胁出现时它们的安全就绪程度。


    ## 注释


    1. Verizon (2019). 数据泄露调查报告 (DBIR). [`enterprise.verizon.com/en-gb/resources/reports/dbir/2019/healthcare/`](https://enterprise.verizon.com)

    2. Life Healthcare Group (2020, 6 月 09 日). Life Healthcare Group 遗憾地宣布其南部非洲业务是
    IT 系统针对性犯罪攻击的受害者. [`www.lifehealthcare.co.za/news-and-info-hub/latest-news/life-healthcare-announces-cyber-incident/`](https://www.lifehealthcare.co.za)

    3. McGee, K. (2014, 5 月 07 日). 违反 HIPAA 规定支付 480 万美元结算. [`www.databreoday.com/48-million-settlement-for-hipaa/`](https://www.databreoday.com)


    # 4 电子健康部署中的数据/信息安全


