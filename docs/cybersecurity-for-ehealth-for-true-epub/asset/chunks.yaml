    此外，自自带设备（BYOD）安排的日益普及，意味着在医疗保健领域实施的网络安全框架中，往往难以实现平衡或统一的安全状态，因为个人用户设备的安全性在场外是无法保障的。即使对于那些采取严格政策、仅允许公司设备参与数字空间的组织来说，员工/用户频繁将和处理公司设备视为其“私有财产”这种日益增长的心理趋势也是一种可以被轻易利用的风险。此外，场外/远程办公安排要求医疗保健机构的数据和基础设施可以在场外访问，这导致在大规模情况下，要有效监控谁在何时、从何地以及如何访问了什么变得更加困难。所有这些现实交织在一起，使医疗保健网络安全的风险格局变得复杂。


    信息验证开放渠道的缺失也可能成为一个风险因素，增加恶意攻击者的成功机会。例如，针对新托管的网络医疗保健服务的用户/客户及访客的持续攻击，试图窃取新部署应用程序软件访问凭据的社会工程尝试，亦或是惊扰第三方供应商/关联方的违规/虚假交易。通过开放且可能是面向公众的渠道实时验证信息的能力，可能是决定此类恶意事件成败的关键。


    再次，人员/用户的无知文化、政策条款的执行不力、政策反复以及过于快速和频繁的政策变更——这些情况对政策条款在应对现代医疗保健网络安全威胁格局现实挑战方面的有效性和稳健性构成了持续的关键风险。医疗保健机构的政策开发过程必然需要网络安全专业人员参与风险评估。通过试图过快地引入变革的新组织制度，特别是在尚未充分评估过渡真空期通常产生的风险和疏漏之前，医疗保健机构的网络安全状况可能会处于脆弱状态。恶意个人通常盯着这些变化/过渡时期，将其作为策划恶意意图的优势。


    然而，除此之外，还有一些自然现象可能对医疗保健中的电子健康部署带来同样的风险。这些现象虽然通常会导致相同的威胁结果，但与其他已知威胁主体（Threat Agents）的传统运行模式不同。例如，地震和火灾可能会威胁电子健康应用所依赖的基础技术基础设施，如国家电信网络和电网。虽然这些事件可能对某些电子健康部署的运行构成关键威胁——例如远程医疗和移动健康应用无法使用互联网和电信服务——但它们并没有反映传统攻击者操作和活动所具有的意图和刻意性。


    事实上，要接受电子健康及整个医疗保健网络安全威胁格局的真实范围和现实可能会令人目不应接，尤其是本章讨论和解释的内容并不自称详尽。因此，提出以下问题：“医疗保健利益相关者和专业人员如何更好地定位和准备，以有效应对和参与这些现实？”是完全合理的。然而，已经意识到这一威胁格局的本质和现实，也许是寻求这一关键问题答案并取得的必要且重要的第一步。


    ## Notes


