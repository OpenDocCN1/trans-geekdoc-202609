    # 定义术语表


    ### 访问认证 (Access Authentication)

    一种访问控制措施，要求授权实体在访问系统或网络之前，通过提供某些信息（通常是机密的或唯一的）来确认或验证其个人和身份。


    ### 访问控制 (Access Control)

    这些是旨在实施的措施，用于限制仅授权实体进入和参与系统或网络。


    ### 匿名化 (Anonymization)

    从数据集中移除所有个人身份识别信息的做法，使得无法识别原始数据主体。


    ### 反恶意软件 (Anti-malware)

    一种提供针对各种恶意软件保护的设备或应用程序。


    ### 机器人 (Bot)

    一种能够接收、处理并执行指令以执行定义任务的软件程序、设备或系统。


    ### 僵尸网络 (Botnet)

    受攻击者控制的受感染或受损系统和设备的集合，用于实施并放大对目标攻击的影响。


    ### 自带设备 (Bring Your Own Device, BYOD)

    一种工作安排，允许员工在企业环境中携带并使用个人设备和系统，并使用这些设备访问组织资源和平台。


    ### 代码 (Code)

    使用计算语言编写的指令集合，描述了执行/处理特定任务时将进行的程序和操作。通常称为源代码。


    ### 凭证 (Credentials)

    包含用于证明或验证持有此类凭证的主体或用户信息的数字制品。


    ### 跨站脚本 (Cross-Site Scripting)

    网络应用程序的一种安全漏洞，允许恶意攻击破坏或干扰授权用户与此类应用程序之间的合法交互。


    ### 密码学分析 (Cryptanalytics)

    通常指用于分析信息系统和技术隐藏层面的科学、程序、技术和活动，以便在不使用密钥的情况下对消息进行解密。


    ### 网络攻击 (Cyber-Attack)

    针对数字信息技术资产（网络、设备、系统等）的犯罪行为，旨在为了恶意目的非法访问、控制和使用此类资产。


    ### 信息物理系统 (Cyber-Physical Systems)

    一种涉及使用计算机监测物理现象和/或控制物理过程操作的实现，其特点是使用了传感器（检测物理环境中的事件和变化）和执行器（响应检测结果采取行动）。


    ### 网络安全 (Cybersecurity)


