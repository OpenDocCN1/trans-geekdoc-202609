  \n# 定义术语表\n\n### 访问认证 (Access Authentication)\n一种访问控制措施，要求授权实体在访问系统或网络之前，通过提供某些信息（通常是机密的或唯一的）来确认或验证其个人和身份。\n\
  \n### 访问控制 (Access Control)\n这些是旨在实施的措施，用于限制仅授权实体进入和参与系统或网络。\n\n### 匿名化 (Anonymization)\n\
  从数据集中移除所有个人身份识别信息的做法，使得无法识别原始数据主体。\n\n### 反恶意软件 (Anti-malware)\n一种提供针对各种恶意软件保护的设备或应用程序。\n\
  \n### 机器人 (Bot)\n一种能够接收、处理并执行指令以执行定义任务的软件程序、设备或系统。\n\n### 僵尸网络 (Botnet)\n受攻击者控制的受感染或受损系统和设备的集合，用于实施并放大对目标攻击的影响。\n\
  \n### 自带设备 (Bring Your Own Device, BYOD)\n一种工作安排，允许员工在企业环境中携带并使用个人设备和系统，并使用这些设备访问组织资源和平台。\n\
  \n### 代码 (Code)\n使用计算语言编写的指令集合，描述了执行/处理特定任务时将进行的程序和操作。通常称为源代码。\n\n### 凭证 (Credentials)\n\
  包含用于证明或验证持有此类凭证的主体或用户信息的数字制品。\n\n### 跨站脚本 (Cross-Site Scripting)\n网络应用程序的一种安全漏洞，允许恶意攻击破坏或干扰授权用户与此类应用程序之间的合法交互。\n\
  \n### 密码学分析 (Cryptanalytics)\n通常指用于分析信息系统和技术隐藏层面的科学、程序、技术和活动，以便在不使用密钥的情况下对消息进行解密。\n\
  \n### 网络攻击 (Cyber-Attack)\n针对数字信息技术资产（网络、设备、系统等）的犯罪行为，旨在为了恶意目的非法访问、控制和使用此类资产。\n\n\
  ### 信息物理系统 (Cyber-Physical Systems)\n一种涉及使用计算机监测物理现象和/或控制物理过程操作的实现，其特点是使用了传感器（检测物理环境中的事件和变化）和执行器（响应检测结果采取行动）。\n\
  \n### 网络安全 (Cybersecurity)\n\n\n\n\n防御信息技术系统和资产免受威胁、恶意行为和攻击的实践与专业领域。\n\n### 数据泄露\n\
  一种故意或无意导致安全受损的网络事件，导致对被视为有价值且机密的信息的未经授权访问、披露或盗取，而这些信息本应受到其他方式的保护。\n\n### 数据元素\n\
  在语义和表示中定义的数据的原子性，其具有可以被收集、处理、存储或传输的值。\n\n### 数据不变性\n一种绑定在功能性数据体上的不变属性，以及对此类数据执行的所有操作——包括在收集、处理、存储或传输之前、期间和/或之后的操作。\n\
  \n### 数据主体\n某一特定数据元素所指的人类或非人类实体。\n\n### 拒绝服务\n一种防止合法用户访问数字平台、工具和资源（例如系统、设备和网络）的恶意行为，通常通过用无用的（有时是恶意的）流量和请求淹没并占用此类数字平台、工具和资源来实现。\n\
  \n### 数字足迹\n根据个人在互联网上的在线存在和活动可以获取的关于该个人的信息。\n\n### 数字影子\n个人在与数字服务或平台交互后留下的所有残余信息（机密、专有或敏感）的集合。\n\
  \n### 域名\n一个永久标识在线位置（即名称和地址）的字符串，该位置在管理、权限和控制上是自主的。\n\n### 加密\n对敏感信息进行编码的过程，使得只有拥有反转编码操作所需信息（通过称为解密的过程）的授权实体才能访问和理解这些信息。密钥是加密和解密过程中的关键组件，持有着成功且合法编码和解码数据的必要信息。\n\
  \n### 端到端 (E2E)\n一种设计原则，确保对于应用程序或安全操作至关重要的特征和功能位于介质的两端节点上，该介质作为端节点之间通信或交换的媒介。\n\n\
  ### 遍历\n一种攻击步骤，旨在收集相关信息，以推断出目标域/环境（通常是计算机网络、物理办公地点或计算机系统）内感兴趣实体的完整或具代表性的列表/概。\n\n\
  ### 防火墙\n一种提供防御计算机系统或私有网络未经授权访问的计算机程序。\n\n### 信息通信技术 (ICTs)\n一个通用术语，通常用于描述通信和信息交换的统一模型、框架和装置，以及计算机和其他数字电子设备在促进此类信息的存储、处理、传输、检索和访问方面发挥的整合作用。\n\
  \n### 输入验证\n一种内置在设备或软件中的控制机制，用于检查并确保用户输入的数据符合处理的格式、规范和要求。\n\n### 键盘记录器\n硬件或软件，能够监控并记录通过输入设备传递到数字计算系统或平台的用户的击键次数，并将此类信息存储或转发给攻击者。它通常用于出于恶意目的窃取敏感信息。\n\
  \n### 登录超时\n一种安全配置，允许用户在经过一段时间推移后自动从数字系统、设备和应用程序中注销。\n\n### 恶意软件\n“MALicious”（恶意的）和“softWARE”（软件）术语的组合词。指设计用于未经许可或授权而渗透数字系统和网络的计算机程序，通常具有造成破坏的能力。\n\
  \n### 中间攻击\n通过在两个不知情的实体之间插入媒介来拦截数字通信的实践，通常带有恶意意图，以中继、重路由、更改或仅仅获取（或其他）未经授权的信息/数据访问。\n\
  \n### 最小化\n将数据收集操作限制为仅接收对于实现定义定义的特定目的所必需且相关的数据元素的实践。\n\n### 网络\n数字电子设备（如计算机）的互连，实现了通信/信息交换以及在电子通道上共享文件和资源。\n\
  \n### 网络协议\n定义并规范计算机网络内设备之间如何进行数据和信息交换的交战规则。\n\n### 网络嗅探器\n一种能够出于合法或恶意目的实时监控和分析网络上的数据包和协议的软件或设备。它有时也被称为网络分析仪。\n\
  \n### 数据包\n网络承载的数据单元，其格式化为包含跨网络传输数据所需的必要信息和控制参数。\n\n### 数据包追踪器\n一种用于映射数据包在网络上传输路径的软件或设备，通常通过在物理、逻辑或概念层面上模仿或模拟网络的布局和结构来实现。\n\
  \n### 补丁\n为计算机程序或其使用的文件和数据提供的增强程序，用于修复程序中的安全漏洞或缺陷。\n\n### 钓鱼攻击\n一种社会工程的形式，通常涉及攻击者/恶意个人在文本通信中（例如电子邮件、即时消息\
  \ [IM]、短信 [SMS] 等）伪装成受信任的实体。\n\n### 平台\n一种业务工具，其运营模型允许多个参与者（消费者）连接到它，以交互、共享、创建和衍生价值为，通常通过双向交互和交换来实现。\n\
  \n### 策略\n一组特定的程序和原则，旨在为知情决策和导致合逻辑结果的行动提供指导，这些结果应符合更广泛的愿景目标。\n\n### 编程\n通过由计算机系统理解和处理的特定语言编写指令或命令来创建计算问题解决方案的过程/任务。\n\
  \n### 伪匿名化\n将数据体中的个人身份信息替换为非可识别信息的实践，这些信息映射到一种能够轻松推断原始个人信息的描述中；从而将原始数据转换为不再能个人识别数据主体的状态。\n\
  \n### 侦察\n攻击程序中的初步步骤，旨在收集有关目标系统/网络的身份、操作和漏洞的有用信息（有时被称为遍历），通常是为了在稍后的针对系统/网络的攻击中利用这些漏洞。\n\
  \n### 拾遗\n在垃圾中搜寻感兴趣的残余信息的实践；尽管这些信息可能由于其敏感性而通常无法获取，但可以为未来的恶意操作提供有用情报。\n\n### 安全套字层\n\
  一种用于加密网络通信/交易的协议。它有时也被称为 `安全套接层 (SSL) 通信`。\n\n### 安全协议\n\n\n\n\n\n为了保护安全并确保其他安全功能而建立的一系列进程和操作序列。\n\
  \n### 服务器\n一种硬件或软件计算系统，其主要功能是为连接它的其他程序、系统和设备（通常称为“客户端”）提供实用程序和服务。\n\n### 窥视偷窥\n\
  在用户在使用应用程序或数字电子设备时，通过从他们背后观察来监视用户的行为，其目的通常是为了获取敏感用户信息（如用户名、密码、安全 URL 等）。\n\n###\
  \ 破窗抢劫 (Smash ‘n’ Grab)\n涉及恶意者迅速破坏安全或其他障碍以夺取贵重物品的操作。\n\n### 社会工程\n一种通常是恶意的行为，通过伪装成受信任的实体来欺骗个人/用户采取他们原本可能不愿采取或或泄露敏感）信息。\n\
  \n### 欺骗\n在数字通信中经常以恶意手段冒充授权实体，以获取/接收系统或网络为该授权实体提供的权限或实用程序。这是一种身份盗窃的形式。\n\n### 颠覆\n\
  绕过或接管数字计算系统或资源的控制函数的恶意过程，通常目的是获得未经授权的访问。\n\n### 尾随\n通过紧跟某人来绕过物理安全和访问措施，从而获得对通常安全或受限地点/设施未经授权访问的行为。也称为\
  \ `Pigbacking`。\n\n### 威胁者\n出于恶意目的寻求破坏计算机系统或网络安全的人类或非人类个体或群体。\n\n### 威胁格局\n特定背景或领域内原生威胁的汇，关于它们呈现出哪些风险以及表现出哪些趋势。\n\
  \n### 负载转运\n在系统、设备或其他数字媒体之间或跨设备传输恶意负载的过程。\n\n### 双重身份验证\n一种身份验证形式，要求用户提供多种类型的信息进行身份确认/验证。\n\
  \n### 统一资源定位符 (URL)\n引用本地网络或万维网/互联网上资源的标识符。也称为网页地址。\n\n### 非结构化辅助业务数据 (USSD)\n一种允许用户的移动设备使用短代码和\
  \ `*`、`#` 等字符与服务提供商通信的协议。\n\n### 虚拟专用网络 (VPNs)\n一种将设备通过开放互联网连接到网络的加密连接——提供了一种可靠的数据传输手段，且无受干扰风险。\n\
  \n### 病毒\n一种通过自我绑定到文件来传播的恶意软件，能够根据程序包含的指令造成损害。\n\n### 语音诈骗 (Vishing)\n社会工程学的一种形式，涉及攻击者在语音通信（如电话、语音消息）中伪装成受信任的实体。\n\
  \n### 游击 (Wardriving)\n在各个地点寻找无线网络接入点的行为，旨在利用对此类接入点的成功连接。有时被称为接入点映射 (Access Mapping)。\n\
  \n### 网站\n一组网页的集合，包含关于某个人、组织、技术或其他实体/现象的内容，并关联一个特定的名称，使其在互联网上可被发现。\n\n# 参考文献\n\n\
