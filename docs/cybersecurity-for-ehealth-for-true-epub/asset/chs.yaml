- "# eHealth 网络安全\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n献给我服务的**上帝**——所有智慧与理解的赐予者。\n\n\
  献给 **Lyndar** 和 **Patra**，感谢你们包容我在专注于写作时，许多周对家庭生活的疏离。\n\n# 前言\n\n网络安全的现代现实揭示了许多部门和行业在应对新兴趋势方面的准备不足。其中一个部门就是医疗保健行业。在该行业中，在现代信息通信技术的推动下，各种电子健康（eHealth）创新、系统和应用在全球医疗范围内普及和扩散，创造了一个威胁领域。在这个领域，政策和法规难以跟上发展，标准化面临多种背景挑战，技术能力在很大程度上匮乏。持续影响全球医疗保健行业的高频网络安全事件表明，这种准备不足往往已渗透到医疗机构的整个体系、层级和基层，尽管从可接受的财务和声誉指数衡量，此类事件的影响一直以来是灾难性的。\n\
  \n当进入实际阶段时，有必要将与全球网络安全现实及医疗保健行业相关的最相关且基础的知识进行综合，并以适应全球医疗保健行业利益相关者技术能力不足的形式呈现这些知识。更重要的是，该领域的许多现有资源被批评为：要么是其内容过于技术化，无法为非技术医疗保健利益相关者提供有用且信息丰富的资源，要么是其范围过于理论化，无法就参与医疗保健行业网络安全的实际现实产生联系。\n\
  \n因此，在本书书中，我尝试将定义学术特征的基于证据的科学方法方法的严谨性，与行业专业人士原生方法中对细节的关注和批判性评估的质量相结合。它提炼了最基础的信息，并以紧凑的方式呈现，易于吸收。这是通过从全球医疗保健行业的真实案例研究中汲取教训，推动其他复杂的原理和见解实现的；特别是对于没有医疗信息通信技术工作原理正式技术培训的医疗保健利益相关者。同时，它试图不将网络安全的批判性论述以及它对电子健康所预示的重大意义浅薄化。\n\
  \n通过排除硬核技术内容，我成功整合了更关键的关注焦点，作为一个快速入门指南，使非技术医疗保健利益相关者（即医疗专业人员、医护工作者、监管和合规机构、医疗中心经理、行政人员和保险公司、客户/患者以及第三方供应商）能够以更具知识且更有效的方式理解电子健康网络安全的现实。\n\
  \n总而言之，本书介绍了网络安全的基础知识和电子健康概览，涵盖了电子健康背景下网络安全的基础概念、观点和应用。随后，它深入探讨了针对电子健康的网络安全威胁格局，讨论了威胁类别、威胁源、威胁目标、各种威胁源所采用的策略和方法、网络安全威胁态势中的倾向性风险因素，以及在针对电子健康的网络事件中部署的各种工具/技术。此外，它讨论了作为电子健康系统、服务和基础设施守护者，增强个人网络安全的方法和最佳实践——包括一种逐步培养和敏锐网络安全直觉的方法。\n\
  \n此外，本书还介绍了电子健康部署中数据和信息安全的基础原则，涵盖了维护完整性、保护隐私、确保机密性和保证可用性的不变性。随后，它讨论了确保电子健康系统和基础设施安全的物理、逻辑和操作上的必要要求，同时通过电子健康部署现实生态系统中的各种监控和评估程序及方法确保合规性。\n\
  \n最后，本书对电子健康的治理、伦理和监管提出了一些思考，强调了重要的国际立法，这些法律为理解监管目标和挑战提供了必要的背景，以及管理/行政的角色和职责，以及合规与安全之间的关系。书中以书中关键术语和词汇的详尽词表结束，这些词汇被认为有助于没有信息技术背景的读者加深对这些词背景和用法的理解。\n\
  \n所以，这里！向大家介绍：*电子健康网络安全*。\n\n**– Emmanuel C. Ogu**\n\n# 致谢\n\n我感谢过去几年中参加我培训和咨询活动的许多医疗利益相关者和专业人士。与你们的接触和互动提供了许多见解和背景，有助于丰富书中讨论。我非常感激有机会从你们在全球医疗保健行业的各种经验中学习。\n\
  \n我也感谢我的朋友 Yushavia，以及 Trishula Pathways 和非洲医疗保健门户 (AHP) 的卓越团队。在疫情肆延导致的全球封锁期间，他们的推动、伙伴关系和协作激发了所需的紧迫感，推动了本书在最短时间内完成开发过程并最终完工。\n\
  \n最后，我感谢 John 的编辑领导和 Stephanie 的编辑支持，他们都帮助出版过程成为一个全方位的愉快的体验。\n\n谢谢！\n\n**– Emmanuel\
  \ C. Ogu**\n\n# 作者简介\n\n\n\n\n\n**Emmanuel C. Ogu** 是一位资深计算机科学家、特许 IT 专业人员、数字权利与自由倡导者、网络安全专家、技术治理与数字发展专家以及可持续发展研究人员。他是\
  \ 2020 年互联网学会（ISOC）派往互联网治理论坛（IGF）的青年大使，在公共政策、可持续发展和互联网治理领域内的网络安全与信息技术交叉领域拥有超过 7\
  \ 年的累计工作经验。\n\n# 1 网络安全基础与电子健康概述\n\n\n## 引言\n\n2018 年 7 月，新加坡卫生部和网络安全局收到了一份关于新加坡综合医院（SingHealth）数据泄露的报告——SingHealth\
  \ 是新加坡最大的医疗机构集团。此次泄露导致在为期一周内有 150 万条个人数据记录被盗取，并进一步针对了约 16 万名患者的门诊药物信息。\n\n这些患者是在\
  \ 2015 年 5 月 1 日至 2018 年 7 月 4 日期间访问过 SingHealth 专科门诊诊所和综合诊所的个人，其中包括新加坡总理李显龙以及其他高级部长。这一事件被载入史册称为\
  \ `SingHealth` 数据泄露。这是一次备受目的的网络攻击，本可以通过更好的网络安全卫生和实践来避免，且发生时当时全球黑市上的健康数据价格至少为 50\
  \ 美元。`SingHealth` 数据泄露揭示了 SingHealth 在网络安全框架方面的大量技术和非技术性疏忽；据信，一个被描述为隐蔽、“高技巧、耐心且持久”的攻击者策划了这次泄露。\n\
  \n最初，综合健康信息系统（IHIS）——负责新加坡公共卫生系统所用信息技术安全的机构——在其中一个托管电子健康记录（EHRs）的数据库服务器上记录到可疑活动后，检测到了该泄露。初步调查显示，某个前端用户工作站的恶意软件入侵可能为这次臭名昭著的攻击提供了切入点，主谋借此获得了对服务器资源的特权访问，并同样很好地掩盖了他们的数字足迹。\n\
  \n2019 年 1 月，一份独立的 450 页报告\n\n总而言之，调查委员会（CoI）的报告将数据泄露的原因归结为 SingHealth 在网络安全认知和概念化方面的关键差距，以及实施方式和实践的问题。\n\
  \n## 网络安全基础与电子健康概述\n\n`SingHealth` 网络攻击是近年来使全球医疗行业成为负面媒体关注焦点的几起备受目的事件之一，并引发了巨大的公众抗议。在这些事件的轨迹中，频繁出现了一些共同主题，包括网络安全意识薄弱、系统和基础设施安全实践健康、政策和治理框架的缺失，以及对网络安全概念化和理解的不足。\n\
  \n这些主题凸显了反复出现的相似性，这说明了这样一个现实：在现代信息通信技术的推动下，全球医疗领域各种电子健康创新、系统和应用的普及和增长已经创造并维持了一个威胁领域。在这个威胁领域，政策和监管难以跟上发展速度，标准化面临多重背景挑战，而技术能力在很大程度上匮乏。尽管如此，后果仍然是严重的。\n\
  \n因此，我们最终面对的是犯罪分子眼中一个软性的、高价值的目标，他们继续为了财务利益而肆掠全球医疗行业。旷日未决的集体诉讼、由于巨额赔偿支付导致的财务能力紧张，以及在许多圈子引发辩论并产生的不信任情绪和声誉受损。这一切都是这一不幸交织的直接影响。\n\
  \n## 2020 年医疗健康网络安全报告\n\n本章将网络安全介绍为一个多维度的概念，概述了电子健康及其在现代医疗各领域的各种应用，同时讨论了医疗健康数据以及适用于这一独特数据类的不变性。此外，本章还讨论了用户与信息通信技术（ICTs）的交互，这是医疗健康网络安全事件根本原因的核心。\n\
  \n## 作为概念的网络安全\n\n网络安全是一个复合的多维度概念，有许多现有定义。然而，这些定义中最好的强调了四个面板，作为构成网络安全的四个方面。它们是`信息技术资产`、`人员/用户`、`流程`和`策略`。\n\
  \n`图 1.1` 描绘了这一概念化。\n\n```\n![图 1.1 网络安全的四个个面板](img/fig1.jpg)\n```\n\n图 1.1 网络安全的四个面板\n\
  \n`信息技术资产`包含电子健康部署中的基础设施、系统、平台和设备。这些包括在现场和离线托管数据和服务以提供实用功能的服务器和平台、提供这些功能的网络介质，以及用于访问这些功能的终端系统和设备。这些系统和设备可能包括手机、电脑、平板电脑设备和其他信息技术（IT）系统。\n\
  \n`人员/用户`指为了各种目的与基础设施进行交互的人类代理。他们可能是依赖基础设施提供的功能来提供服务的人员、从这些提供的服务中获益的客户（这有时要求他们直接/间接地与基础设施交互），或依靠基础设施为组织提供服务的供应商。\n\
  \n`流程`是指由基础设施提供的服务和功能支持的各种组织操作。它们可以包括广泛的活动，从客户服务、销售、采购、审计和分销，仅此类。\n\n`策略`是组织范围内的准则，指导和规范基础设施、人员和流程围绕数据和信息等关键组织资产的运行和相互作用。在最优秀的部署中，这些准则的设计与业务运营行业更广泛接受的最佳实践保持一致。\n\
  \n\n\n\n电子健康（eHealth）是一个术语，在过去的十年里，在医学和公共卫生领域日益流行。世界卫生组织将电子健康广义地定义为“健康信息和通信技术（ICT）的使用”——这是一个相当简单直接的定义，但它涉及到多个层面的交互和支持技术的结合，以增强获取优质医疗服务的途径，并支持以负担得起的成本的服务交付。\n\
  \n多年来，电子健康被认为涉及各种信息和通信技术（ICT）（包括移动电话、人工智能、语音识别、语音翻译、视频会议、有线及无线通信、数字传感与成像、计算分析、生物信息学/医学信息学）的部署，并在电子设备的支撑下用于医疗保健领域的各种应用。然而，如图\
  \ 1.2 所示，根据特定的用途、功能和能力，这些应用具有不同的命名法。\n\n![图 1.2 电子健康概述。](img/fig2_B.jpg)\n\n图 1.2\
  \ 电子健康概述。\n\n例如，`mHealth`或`移动健康`将移动技术的便携性与无线电信的普及性相结合，用于医疗服务的交付。这可以用于培训、意识提高和信息传播、紧急报告、数据收集或定位医疗机构。\n\
  \n同样，`TeleHealth`（远程健康）是在无法进行物理服务交付时，利用电子 ICT 技术通过通信通道提供的远程临床和非临床医疗服务。\n\n一方面，它适用于临床目的，如医疗诊断、患者监测、物理治疗、院外手术、咨询（医疗专业人员与患者之间，以及医疗专业人员之间）、医疗提醒和随访以及治疗处方。另一方面，它也适用于非临床目的，如继续医学教育和健康管理。然而，当远程健康特别关注临床医疗保健服务时，它通常被称为`TeleMedicine`（远程医疗）。\n\
  \n同样，`Digital Health`或`digiHealthdig 数字健康）利用数字化（或数字信息技术）的力量来增强医疗服务交付的精确性和个性化。本质上，它寻求连接跨多个领域的数据驱动技术、能力和技能，以提高医疗交付的效率以及人类人口的整体健康和福祉。数字健康已广泛应用于临床决策支持以及辅助和康复目的。\n\
  \n近期，各种系统和设备出现在电子健康的背景和操作中。它们包括医院信息系统（HIS）、手机/智能手机、电脑、平板设备、信息物理系统、基于传感器的智能可穿戴设备（手表、眼镜、头戴/耳机等）、数据驱动的决策支持系统（DSS）、基于\
  \ RFID 的植入物和摄入物、机器人扫描仪、数字成像设备、个人数字助理（PDA）以及各种形式的患者监测设备等。这些只是其中的几个。\n\n电子健康对现代医学实践和医疗交付贡献了许多益处，其意义不言而喻。它帮助那些此前由于道路网络不畅、缺乏资金、医疗人员短缺或缺乏以及语言障碍而与全球医疗交付链脱节的社区获得了优质医疗。若干研究还报告了电子健康的各种应用如何帮助降低管理人员和消费者医疗交付的成本。它帮助建立了医护人员和患者的信心，并通常有助于加强整个国家和地区的医疗保健体系。\n\
  \n事实上，医疗保健和服务交付的质量与用于辅助医疗决策的患者健康数据的质量和可靠性存在强相关性。然而，医疗数据仍然具有相当敏感、隐私和机密的性质。这是因为患者或护理接受者的生命取决于数据的实时准确性和一致性，以及随时的可用性，而他们的公民自由的神圣性可能完全取决于数据的机密性。\n\
  \n在许多司法辖区，电子健康记录（或医疗数据）是医疗交付不可或缺的一部分，并完全整合到国家数字化和技术发展的议程中。\n\n## 医疗数据不变性：完整性、机密性和可用性\n\
  \n今天，医疗数据（或`EHRs`）每份患者记录的价值超过 400 美元\n\n`Integrity`完整性是数据或信息元素在整个生命周期内一致性、完整性、可验证性、准确性和真实的特征。完整性既有物理和逻辑（非物理）方面，在许多情况下，这些是源于数据收集设计和开发阶段的实践和现实。完整性是可靠性的关键决定因素，因为它决定了数据在多大程度上可以被认为足够有效并可靠地指导决策。\n\
  \n对于`EHRs`以及其他形式的数据，完整性面临许多风险。包括可能源于输入点或操纵的人为错误、恶意数据和系统操作，以及由于在不同存储点之间移动或复制数据而导致的不匹配错误。此外，漏洞和配置错误可能会影响数据（处理）操作的并发，还包括试图更改和破坏数据的恶意软件，以及可能影响多个点数据功能的系统故障。\n\
  \n`Confidentiality`机密性涉及适用于数据元素整个生命周期期间的授权结构、访问模式和使用模式。它是强制执行拥有/访问权限的职责，以确保数据不会落入错误的人手中。为了成功完成这项职责，防止与可能证明对数据主体利益产生不利的数据元素发生此类接触至关重要。\n\
  \n医疗数据的机密性存在许多风险。包括被泄露的访问凭据、权限级别的提升、用于存储、处理或操纵数据的配置错误或安全性较差的系统和设备、通过公共模拟或数字介质进行的开放式传输、不具备足够的抵御恢复和重构能力的处置技术，以及在收购的数据库系统和基础设施中存在的漏洞。\n\
  \n\n\n\n# 可用性\n\n`Availability` 指的是数据元素及其转化的信息在任何时间、任何位点，以及对于所有授权、合伦理且合法的用途、功能和操作，都能始终且及时地被访问——无论现实情况如何，其目的都是为了保持数据和信息的实用性。在许多情况下，这种保证与数据和信息元素本身的关系较小，而与其提供这些数据和信息的设备、基础设施、系统和网络的状态的关系更大。\n\
  \n`可用性` 最常见的风险之一，是数字工具的并发使用人数超过了总体计算资源能够有效且高效提供的能力。这可能源于非恶意的因素，例如在服务需求高峰期，有许多用户寻求访问组织提供的数字服务——这种现象在技术上被称为“突发性流量（Flash\
  \ Crowds）”。它也可能是恶意企图通过压垮计算资源来阻碍合法使用的结果——这种现象被称为“拒绝服务（DoS）”攻击；或者是一个“分布式拒绝服务（DDoS）”攻击（当涉及招募其他被劫持/受损机器的能力来放大攻击影响时）。\n\
  \n然而，可能会通过导致数据损坏、断开/无法访问或删除的事件来危及`Availability`，这些事件可能是由于恶意软件活动、系统/网络故障和失效，或者是断开或禁用系统及网络连接等人类行为造成的。但本质上，损害医疗数据的可用性意味着停止所有依赖此类医疗数据所信息的用途、功能和操作，无论这些是作为产品还是服务的一部分。\n\
  \n图 1.3 展示了医疗数据（或 EHR）中机密性、`Availability`和完整性之间的三者关系。\n\n![图 1.3 医疗数据 (EHRs) 不变性](img/fig3_B.jpg)\n\
  \n图 1.3 医疗数据 (EHRs) 不变性。\n\n通常，这三个不变性还包含了确保其质量和安全的指令。然而，这些指令通常也取决于现有且具有约束力的框架所采纳的标准和规则，这些框架从更高层次上治理和监管数据功能、操作和交互。在认为医疗数据和信息对于社会的保护和运行至关重要的司法管辖区，这些不变性表面上是将提供这些数据和信息的设备、基础设施、系统和网络归类为“关键基础设施”的原因。\n\
  \n当`Integrity`、`Confidentiality`和/或`Availability`的不变性遭到损害时，俗语通常是——“数据泄露了”。尽管很多时候，这个短语可能既不能正确也不能完全反映现实中数据事件的真实情况。然而，该短语通常描述这样观点：针对数据不变性的恶意（通常是外部的）攻击已证明成功。但实际上，数据事件并不一定是外部恶意实体攻击的结果。它也可能是天真（可能无意的）的或恶意（通常是故意的）的内部人员行为或操作的结果；或者是系统故障/失效，在这种情况下，可以更准确地称之为“泄露”。\n\
  \n同样重要的是，在医疗领域内，数据的`Confidentiality`通常是三者中最受攻击最频繁的，因为它往往能给攻击者带来最直接的回报。针对`Availability`和`Integrity`的攻击更多是为了造成声誉损害和收入损失。\n\
  \n## 医疗信息技术与人\n\n医疗部门是一个 ICT 与人员为了各种目的频繁进行接口和交互的领域。这些人可能包括非技术用户，如患者、看护人员、护士、药剂师、公共卫生专业人员、志愿者和访客，以及技术用户，如系统和网络管理员、清洁工/用工、门卫和安保。其中一些人利用\
  \ ICT 的工具和能力（又被称为电子健康）来执行和支持各种用途、功能和操作，以确保他们的执行是安全、优化且高效的。另一些人则致力于确保这些 ICT 所在的环境保持理想状态的安全、健康和舒适。\n\
  \n遗憾的是，这些人员/用户群体（其大多数人在网络安全话语方面往往没有经过培训）经常构成了最严峻的断层。包括网络安全巨头卡巴斯基在内的若干独立报告指出，这些群体经常表现出人为疏忽，网络分子通过这些疏忽持续肆虐医疗行业。在某些情况下，这些犯罪活动得到了人类天真、无意、无知、漠不、不廉耻和鲁莽行为（即使是无意的）的助长；而在其他情况下，它们被人类天生的绝望、爱、利他主义、漠不在、仇恨、不满、恶意、贪婪和不满等感觉和情感所催化。这种行为和情感的框架通常增加了这些用户群体对恶意计划和策略的敏感性。\n\
  \n在某些场合，他们带入医疗设施周围数字空间的设备在不经意间参与了网络安全事件。这些数字空间可能是那些实现远程工作或支持现场工作的工作。然而，当这些设备——可能是安全防护不力、配置不当、共享设备或带有恶意软件的设备——连接到原本安全的数字空间时，它们会携带这一脆弱性框架，并显然破坏了这些数字空间的安全状态。\n\
  \n\n\n\n例如，一名试图快速部署网络服务的网络管理员，为了同时处理多个任务并提高效率，可能会使用 shell 脚本来在组织网络上自动配置和托管该服务。有时，该管理员可能会忽略某些默认配置参数，而这些参数并不符合该组织的安全标准、政策和运营框架。与此，一名用户尝试通过仅限公司设备访问的办公室内网络连接来访问其在线社交网络，可能会尝试通过插入个人移动设备来上传多媒体文件（照片和视频）。他们没有考虑到恶意软件可能会通过这种方式渗透到公司网络。\n\
  \n此外，医疗机构的门卫人员可能无法理解在所有入口处未能出示有效准入卡（无论相关情况或涉及人员如何）对网络安全构成的风险。因此，该人员可能会为无法够及足够高度以刷准入卡的轮椅使用者手动干预或破坏访问验证协议。一个费力拖着好几个袋子的老年访客也可能获得同样的妥协；即使是一个在当时似乎找不到准入卡的员工也是如此。这样的门卫人员可能并没有察觉到，这些事件很可能是某种协调安全违规策略行动的前奏或预兆。\n\
  \n同样，一名清洁工或维护人员可能无法理解关键系统、网络服务或连接不可用所带来的网络安全风险。结果，他在执行清洁任务过程中不小心绊到网络线或电源线，然后随口忽略了立即通知技术\
  \ IT 人员处理该事件的必要性。最终，这可能导致服务可用性以及从该连接点向下的服务交付中断；甚至可能导致依赖该特定连接保持在线的系统和设备所服务的有效性中断。\n\
  \n总之，电子健康（以及可能广义的网络安全）的圣杯，本质上是保护和维护机密性、完整性和可用性这“三大不变性（Invariants）”的神圣性。但在实践中，这通常只能通过部署一种多维度的方法来实现，该方法考虑了基础设施与系统、与之交互的人员（技术和非技术用户，以及支持人员）、依赖这些系统的业务流程，以及为所有这些提供治理框架的组织政策之间的各种交互。\n\
  \n\n\n\n\n\n\n\n# 2 电子健康的网络安全威胁格局\n\nDOI: [10.1201/9781003254416-2](https://dx.doi.org/10.1201/9781003254416-2)\n\
  \n## 引言\n\n虽然网络安全风险确实能够渗透整个医疗机构的数字化设备，但它们通常源于并扩散自医疗业务内部特定的运营和交互生态系统。因此，对于专业人士和管理员来说，在现有公司业务库中添加新的数字模型和操作时，能够回答某些关键问题至关重要。\n\
  \n这种医疗服务或操作范围创建（或扩展）了哪些（新的）数字交互生态系统？哪些元素参与了这些生态系统？为了有效保护这一新生态系统中的运营，需要考虑哪些网络安全维度？这些问题的答案对于确保新的业务模式和操作不会加剧现有网络安全风险、放大漏洞影响并扩展网络威胁和攻击范围至关重要。然而，为了有效回答这些问题，对威胁格局的稳健理解是不可或缺的，特别是考虑到网络安全威胁格局在非常短时间内持续频繁且快速地变化和蜕变。\n\
  \n例如，在新冠肺炎（2020 年）爆发后，许多医疗机构被迫实施快速数字化转型，包括将业务迁移到“云端”的新平台和环境。其目标是帮助他们在不颠覆整个业务链的情况下，应对物理距离的需求。在此过程中，围绕现有的业务库创建了新的数字生态系统。然而，对于这些案例中的许多，这也意味着涉及机构的网络安全威胁格局发生了重大变化。\n\
  \n随着许多医院和医疗机构为了限制与非新冠患者的物理接触而转向电子健康，并管理有限的个人防护装备库存和供应以照顾危重症和住院患者，新的远程能力开启了一个蜕变的威胁格局，为网络攻击者创造了新机会。随着新利用策略的出现，已知恶意技术也被放大了。结果，仅在疫情引发封锁的几个月内，医疗行业的网络事件和攻击统计数据就超过了过去几年报告的年度数据。\n\
  \n仅在疫情引发封锁的第一个月内，几份独立报告（包括来自美国以色列 IT 安全巨头 Check Point\n\n\n\n\n因此，本章介绍并遍历了电子健康（eHealth）的网络安全威胁格局，然后讨论了当网络安全事件针对医疗保健部门时发生的情况。它进一步介绍了该威胁格局中常见的用户的威胁、针对系统和设备的威胁、针对基础设施的威胁、针对流程/操作的威胁以及针对策略的威胁。随后，重点强调并阐述一系列有助于针对医疗保健部门恶意活动成功的风险因素。\n\
  \n## 电子健康的网络安全威胁格局\n\n尽管与一般的网络安全威胁格局本身并不相似，但全球医疗保健部门资产（包括用户数据和关键基础设施）具有特殊的高价值特性，使得这些资产成为犯罪分子梦寐以求的昂贵奖品。这可能就是为什么医疗保健网络安全事件相对更加流行且受关注的原因。\n\
  \n通过部署各种复杂程度异的工具、技术和策略，攻击者似乎保持着优势地位，因为准备工作和响应努力难以跟上网络安全威胁格局的动态变化。事实上，已发现针对医疗保健的网络安全威胁涉及终端用户；提供各种医疗功能和服务的应用程序；以及用于访问这些用户应用程序的系统和设备。与此同时，这些威胁还针对其生成、存储、处理和使用的数据；支撑并运行这些系统和应用程序的基础设施；通过这些基础设施传输的信息；依赖于这些基础设施高效运行的业务流程和操作；以及定义和引导该领域交互的策略。\n\
  \n因此，采用分层方法来理解电子健康网络安全威胁格局是有帮助的，或许也是直观的。图 2.1 展示了该威胁格局的分层概念化。事实上，电子健康网络安全的目标（或应该的目标）是保护用户及其数据免受恶意行为者的侵害。为了有效实现这一目标，需要保护与用户和数据产生最直接影响和接口的系统（硬件和软件）以及设备。同样，这适用于提供交互框架的基础设施，系统和设备经常利用该框架与用户及其数据进行接口。在企业基础设施上，一方面是系统与设备之间、另一方面是用户与数据之间必要交互的流程和操作，也是该威胁格局中的关键考虑因素。同时，也没有忽视定义这些交互各个方面方面背景的策略和程序。\n\
  \n![图 2.1 理解电子健康网络安全威胁格局的分层方法。](img/fig4_B.jpg)\n\n图 2.1 理解电子健康网络安全威胁格局的分层方法。\n\n\
  因此，在这个电子健康威胁格局中，策略和程序应明确定义哪些用户和数据参与特定的流程和操作，哪些系统和设备允许参与这些交互，以及支持这些交互的基础设施规定。这是因为策略上的漏洞会危害流程和操作，并进一步使基础设施面临风险，从而危及涉及医疗系统和设备以及用户及其医疗健康数据的交互安全。\n\
  \n这里有种看待问题的方法。当医疗组织策略未能明确定义客户服务的操作时（特别是在边界和限制方面），对某些员工来说，将客户从设施的通用候候区/接待区带入他们的个人工作空间似乎是正确的。在这个私人空间内，这些客户可以访问内部网络连接，并能够干扰防火墙操作，或枚举和侦察医疗系统和设备，特别是如果他们有敌意。他们还能查看并快照私有的用户界面，查看用户名和其他身份验证参数，从而危害用户及其数据。从本质上，医疗组织的策略缺陷会导致一种隐蔽的易感性，这种易感性会渗透到组织资产的核心。当你在这个分层威胁格局向内移动时（图\
  \ 2.1），情况也是如此。然而，值得注意的是，图 2.1 中的概念化仅仅是理想化的。因为在现实中，企业的安排可能并不特别反映这种表现。\n\n虽然在提到网络安全事件（即使在医疗保健背景下）时，经常将\
  \ `threat`（威胁）和 `attack`（攻击）同义或类比使用，但它们实际上并不相同，至少在技术上如此。根本区别通常在于“意图”（intention）和“故意”（intentionality）。“意图”是目的/动机/目标/目标的功能，而“故意”是过程/方式/方法的功能。\n\
  \n`threat` 是一种隐蔽的安全状态，其创建可能是也可能不是故意的，并且具有可能也可能不是恶意的意图。然而，它的行为和行动可能能够或直接导致安全违规。另一方面，`attack`\
  \ 是故意破坏安全状态的安全违规，通常带有恶意意图。\n\n这种情况下经常出现的另一个概念是“漏洞”（vulnerability）。`vulnerability`\
  \ 是 `threat` 利用的安全漏洞、易感性或弱点，以导致安全违规。因此，换句话说，在许多情况下，威胁必须遇到漏洞才能成功破坏安全或策划攻击。图 2.2 了这种关系。\n\
  \n![图 2.2 威胁、漏洞与攻击。](img/fig5_B.jpg)\n\n图 2.2 威胁、漏洞与攻击。\n\n在这种情况下，漏洞可能存在于用户（他们的行为、倾向和活动）；基础设施、系统和设备（由于其设计、操作和使用）；流程和操作（关于其安全韧性），以及策略（就其稳健性而言）。从本质上说，漏洞通常是为了安全、保护和防御而建立的系统、设备、策略、流程和程序的内在缺陷的产物。例如，一个弱/未更改的默认用户密码是一个\
  \ `vulnerability`。将其写在便利贴上并贴在电脑旁以防忘记，这就是一个 `threat`。当第三方利用这种状态未经授权访问电子健康产品或服务的用户账户时，就发生了安全违规。\n\
  \n同样，一个没有安装反恶意软件的医疗计算机系统构成了一个 `vulnerability`。连接到此类计算机的可移动设备是 `threats`。然而，当恶意软件成功从这些可移动设备传输到计算机时，就发生了安全违规。要意识到这种违规可能是\
  \ `threat` 行动的无意结果。它也可能代表了带有恶意意图渗透计算机系统的故意尝试，在这种情况下，将其称为攻击是正确的。\n\n\n\n\n同样，配置不当的医疗系统或数据库服务器会导致`Threat`（威胁）。缺乏经验的系统管理员或允许用户任意配置和重新配置公司设备的组织政策——这些都是导致该`Threat`的预设性`Vulnerabilities`（漏洞）。医疗数据泄露是这种情况可能导致的安全违规行为，尽管其中可能并不包含恶意意图。\n\
  \n此外，允许员工获得比其工作功能通常所需的更高的权限来访问数据和信息资源的医疗组织政策，也是一种 `Vulnerability`（漏洞）。担任此类职位的员工会成为一个\
  \ `Threat`（威胁）。然而，利用这种特权恶意汲取敏感数据或信息以获取个人财务收益，是一种违反安全的攻击行为。\n\n再次，医疗机构中没有身份验证密码的开放\
  \ Wi-Fi 连接也是一种 `Vulnerability`（漏洞）。未经授权而连接到该资源的外部人员将成为一个 `Threat`（威胁）。当这种外部人员在此种情况下采取恶意行动时，就发生了\
  \ `Attack`（攻击）。\n\n请注意，`Threats`（威胁）的来源可能是内部的（在这种情况下被称为内部威胁）或外部的。但在实践中，`Threats`（威胁）、`Vulnerabilities`（漏洞）和`Attacks`（攻击）之间的关系不仅复杂，而且错综复杂。这种关系的性质有时使得在理论上难以在这些概念之间划定清晰的界限。然而，理解此处提供的描述将有助于识别电子健康`Cybersecurity\
  \ Threat Landscape`（网络安全威胁格局）的当代现状。\n\n## 电子健康网络安全的威胁主体\n\n当 `Threat Agents`（威胁主体）利用、尝试利用或持续利用漏洞时，`Threats`（威胁）就会存在或显现。因此，这些\
  \ `Threat Agents`（威胁主体）是电子健康网络安全论述中不可或缺的因素。事实上，`eHealth Cybersecurity Threat Landscape`（电子健康网络安全威胁格局）持续存在不同的参与者。出现在这一`Landscape`（格局）中的`Threat\
  \ Agents`包括个人实体、独立团体、公司实体、主权（国家）实体或非主权（但受主权国家赞助的）实体。换句话说，基本上，电子健康网络安全的 `Threat Agents`\
  \ 包括个人和非个人实体，这些实体可能是独立的或与主权相关的，还包括主权实体。\n\n`Individual Entities`（个人实体）可能是对计算机/信息安全工作和操作具有技术技能的海客。他们也可能包括不具备技术技能但可能通过非技术手段采取恶意操作的恶意个人。此外，他们也可能是没有恶意意图的幼稚人类行为者（内部或外部），但他们无意的行为和活动对安全利益和目标的损害可能并毫不小。\n\
  \n`Independent Groups`（独立团体）是由具有共同愿景或使命的恶意个人实体组成的，这种愿景或使命可能是政治、意识形态、文化、财务、爱国主义或其他。作为其操作手段的一部分，他们可能表现出特定的技术水平。而他们操作背后的灵感可能是恐怖/叛乱、宣传、极端主义、行动主义或狂热的热情。\n\
  \n在某些情况下，出于各种原因寻求实施恶意网络行动的主权政府可能会赞助`Individuals`（个人）和`Independent Groups`（独立团体）。在这种身份下，他们符合`Sovereign-sponsored/Sovereign-affiliated\
  \ Threat Agents`（主权赞助/主权相关的威胁主体）。\n\n具有竞争或伙伴关系的`Corporate Entities`（公司实体）也可能是电子健康网络安全的威胁主体。当涉及竞争利益时，恶意意图通常表现为旨在破坏公司利益或目标组织的声誉。然而，当涉及伙伴利益时，疏忽行为同样可能创造或持续可能对公司安全利益产生不利的威胁局面。与非主权赞助的`Individual\
  \ Entities`和`Independent Groups`相比，具有恶意意图的`Corporate Threat Entities`（公司威胁实体）通常具有更多的威胁资源能力。\n\
  \n`Sovereign Entities`（主权实体）是出于各种原因实施恶意网络行动以维护或维护利益的国家。当`Threat Agents`利用、尝试利用或持续利用漏洞时，`Threats`就会存在或显现。因此，这些`Threat\
  \ Agents`是电子健康网络安全论述中不可或缺的因素。事实上，eHealth Cybersecurity Threat Landscape（电子健康网络安全威胁格局）持续存在不同的参与者。出现在这一\
  \ Landscape（格局）中的 Threat Agents（威胁主体）包括个人实体、独立团体、公司实体、主权（国家）实体或非主权（但受主权赞助的）实体。（等一下，清理一下）主权赞助/主权相关的实体威胁网络安全并非不可能。同时，财务利益已知占绝大多数（80%\n\
  \n## 医疗保健中的网络安全事件\n\n当由于威胁主体的恶意或无意行动导致医疗保健领域发生网络安全事件时，通常会显现某些结果，并且工具和技术、方法或策略，以及威胁目标经常作为导致这些结果的威胁-攻击过程的一部分（`图\
  \ 2.3`）。\n\n![图 2.3 网络安全事件发生时。](img/fig6.jpg)\n\n通常，这些`Outcomes`（结果）包括`数据泄露与泄漏`、`间谍活动`以及`医疗保健\
  \ IT 系统/设备的不可用或故障`。然而，当网络安全事件针对医疗机构时，间谍活动很少结果，除非如之前强调的那样，医疗组织的系统或基础设施为感兴趣的更大实体（如政府或武装部队）的操作和活动提供了窗口/余地。\n\
  \n导致这些结果的路径具有：\n\n*   `Threat Objectives`（威胁目标），例如侦察/枚举、数字/电子截获、服务中断、诱导系统/设备故障、侵蚀安全文化/协议/操作、凭据填充和身份盗窃/数字身份冒充；\n\
  *   `Methods, Strategies, or Approaches`（方法、策略或途径），例如欺骗（电子邮件、数据包、位置、地址、协议操作、网站、生物识别和非生物识别标识等）、社会工程学、高级持续性威胁（或\
  \ APTs）、现场的物理事件和活动（包括可能是幼稚或具有恶意意图的内部操作）、Wi 嗅探（wardriving）、中间人攻击（MITM）、注入/投毒、权限提升、转载、数字活动监控、劫持、对协议和常规操作的颠覆/绕过以及拒绝服务（DoS）；\n\
  \n\n\n\n## 工具与技术\n\n- 包含恶意软件（勒索软件、木马、病毒、间谍软件、根内核、逻辑炸弹、蠕虫和自动运行脚本）、数据恢复软件、网络钓鱼/语音钓鱼、扫描器与跟踪器、搭车/尾随、窥视、数据包追踪、网络协议与服务中的隐藏隧道、跨站脚本\
  \ (XSS)、SQL 注入、信号干扰器/干扰发生、网络嗅探器与分析器、键盘记录器、抢劫、机器人和机器人网络。\n\n在实践中，工具和技术作为方法/策略/手段的一部分被整合到威胁目标框架内，旨在实现网络安全事件的结果。但在实践中发现，多个威胁目标可以包含不同的方法/策略/手段，这些方法反过来又会大量复杂的工具和技术（特别是涉及恶意意图时以引发网络安全事件。\n\
  \n例如，作为导致医疗系统故障的威胁攻击目标的一部分，诱导性故障可能通过权限提升开始链条，该权限提升整合了一种欺骗技术，试图在系统眼中冒充授权的数字身份；随后在系统或设备上传输恶意软件或执行\
  \ SQL 注入。同样，一种寻求为了经济利益破解电子健康记录的威胁攻击策略，可能会利用硬件或软件网络嗅探器和数据包分析器，其技术特征是在医疗设施现场通过物理事件捕获敏感信息（例如访问凭据），作为整合了内部人员操作的协调数字拦截策略的一部分。\n\
  \n## 相关人员/用户\n\n人员/用户是医疗领域网络安全威胁格局中的频繁目标。正如第一章 所示，这是因为他们通常是全球医疗行业中高价值资产的软目标。有时，对用户的威胁可能源于同一流程/操作链中其他用户的意识行为或无意行为。其他时候，他们可能是恶意外部人员针对性的尝试，旨在利用推断出的、感知或披露的漏洞来获取经济利益。\n\
  \n通常，当威胁和攻击针对医疗领域的人员/用户时，他们通常盯着关于用户的敏感 `Data`（数据）以及他们持有的 `Access Credentials`（访问凭据）。这些威胁/攻击渗透和传播的最常见且最流行的途径可能是社会工程。\n\
  \n### 社会工程\n\n社会工程在实践中利用了多种方法，旨在欺骗/操纵个人，使其在不同情况下做他们不太可能做的事情。这可能包括泄露敏感信息、执行不利于安全利益和目标的行动，或授予不受允许的让步。\n\
  \n社会工程通常试图利用认知偏差（有时被称为“人类硬件中的 Bug”）以及其他心理和行为倾向/易感性。这是一种强大的技术，因为这些偏差往往构并影响了用户最显易见的行为和动作，使他们容易受到恶意行为者某些类型的外部影响。通过社会工程，已经证明可以欺骗医疗领域的人员/用户成功泄露敏感的财务细节和账户凭据。还可以操纵或诱导他们点击链接或连接移动设备，这些设备最终会传输并安装恶意软件，从而让攻击者获得对系统资源的持久且特权的访问权限。\n\
  \n### 网络钓鱼与语音钓鱼\n\n网络钓鱼（Phishing）和语音钓鱼（Vishing）是社会工程的常见方法，经常出现在针对医疗领域人员/用户的威胁攻击场景中。这是在电子通信中冒充信任实体的行为，旨在通过欺骗获取敏感数据或信息。当这种行为通过基于语音的电子通信（如电话或或语音录音）实施时，被称为\
  \ `Vishing`（语音钓鱼）。然而，当它通过基于文本的通信（如电子邮件、聊天/即时消息或短短信）实施时，被称为 `Phishing`（网络钓鱼）。\n\n\
  ### 其他工程方法\n\n其他社会工程方法包括搭车（piggybacking）或尾随（tailgating）——这种做法是秘密跟随对安全或受限医疗应用程序/设施/区域授权访问的人员，以通过所需的安全检查或访问验证协议，并在不通过授权程序的情况下获得访问。此外，还有窥视（shoulder-surfing）技术，在用户输入这些凭据时，通过窥视用户的肩膀来观察并可能记住用户名、密码、PIN\
  \ 码、信用卡详情和安全 URL 等安全凭据。\n\n此外，社会工程特别针对医疗领域人员/用户关于其日程安排、雇主、工作环境与文化、在线和线下互动、数字设备及其使用、网络连接以及用户界面与应用程序。这可以通过被动推断（不与目标用户直接交互或界面，而是通过公开的来源）或主动推断（涉及与用户的直接交互和界面）。恶意行为者偏好社会工程，可能是因为这几乎不需要技术知识，并且通常提供了一条阻力最小的路径。\n\
  \n想想：为什么试图获取敏感和高价值医疗数据的恶意个人，要花费大量时间设计一种复杂的恶意软件，作为稳健攻击方案的一部分，用以破解高度安全的组织服务器和系统？相比之下，他们完全可以：\n\
  \n- 在电话中伪装成医疗机构的技术人员，欺骗具有授权访问权限的纯真员工使其泄露登录凭据；\n- 在医疗设施内部的私人工作区附近徘徊，等待用户离开工作站但未完全注销，然后跳入并使用该用户的凭据继续访问；\n\
  - 操纵医院中心存不满的技术人员（其拥有授权访问权限，由于其拥有授权访问权限且可能不知道此类数据在黑市上的实际价值，诱导其以廉低的价格传输此类数据；\n- 在忙碌工作日的入口高峰段，尾随一名对本应安全的医疗设施拥有授权访问的员工（该设施存有电子健康记录），然后植入能够实现远程访问和汲取敏感数据的设备；\n\
  - 利用授权的医院员工的信任关系或利他倾向，请求使用其个人或工作设备，并在过程中在设备上植键盘记录器或其他恶意软件；\n- 创建面向公众的用户界面的相同副本，以欺骗不知情的授权用户或员工提供访问凭据；或\n\
  - 通过不诚实的用户/医疗专业人员公开发的照片（显示了电脑屏幕）推断出非公开用户界面的布局和内容，然后创建一个相同的副本，发起针对医疗机构员工的大规模身份窃取。\n\
  \n\n\n\n\n选项确实非常多，即使在技术专业知识有限的情况下，它们也为成功提供了有效的途径。在大规模范围内，针对特定医疗机构的成功身份盗用操作可以为随后的凭据泛洪（credential\
  \ stuffing）网络攻击提供非常强大的优势，这种攻击利用免费的网络自动化工具和应用程序，部署这些被盗身份，在多个服务器或 Web 服务上自动执行用户登录请求。这些可能成为数据泄露/外泄以及其他形式医疗网络事件的有用基础。\n\
  \n然而，针对人员/用户的恶意攻击者也可能决定监控他们的数字交互或电子通信，以窃取关于他们的数据以及他们的访问凭据。这方面的监控可以通过 `Keyloggers`（键盘记录器）来实现——这是一种硬件或软件设备，能够捕获并记录数字电子设备和机器上的输入击键和鼠标点击，然后将这些传输到指定位置供攻击者使用。\n\
  \n事实上，针对医疗用户的威胁是针对医疗系统和设备、组织基础设施、医疗流程和操作以及公司政策的潜伏威胁。\n\n## 相关系统与设备\n\n医疗保健领域的医疗设备和其他信息通信技术（`ICTs`）由于多种原因，往往成为恶意攻击者的容易目标。这是因为许多此类设备往往缺乏安全韧性，特别是它们通常配备了早已过时的软件和硬件。\n\
  \n通常情况下，针对医疗 `ICT` 系统和设备的威胁和攻击针对它们收集、处理、访问和存储关于用户（员工、客户和供应商）以及业务运营的 `Data`（数据）和\
  \ `Information`（信息）。这些威胁和攻击通常利用如欺骗、拾取、注入/投毒、转运（transloading）、劫持、位翻转攻击和权限提升等方法和策略。\n\
  \n这些方法和策略倾向于诸如侦察/枚举、身份盗用/数字伪装、诱发系统/设备故障、通过锁定和服务截断拒绝访问以及更改数据和信息等目标。在许多情况下，当这些系统和设备受到恶意攻击者的威胁时，人员和用户早已处于风险之中，可能已经其中一个或多个被破解。\n\
  \n在 `spoofing`（欺骗）中，数字身份被盗取或伪造。其目标是让未知且非法的第三方获得本属于受信任数字参与者的合法优势和利益。在这种情况下可能被欺骗的数字身份范围从电子邮件、数据包、位置信息、设备（物理）地址、协议操作、网站，以及生物和非生物识别符等（仅不限于）。一个欺骗的医院网站或服务器地址可以成功伪装成合法的数字参与者面对用户，以获取他们的访问凭据、数据或其他合法信息。同样，具有管理权限的欺骗设备地址可以对存储在安全服务器上的用户医疗健康数据或信息提出合法请求。\n\
  \n`Scavenging`（拾取）是指搜索物理或逻辑残留以寻找可能用于恶意目的敏感信息的行为。当拾取在物理上发生时，它通常发生在医疗机构的垃圾场或垃圾收集点；但当它在逻辑上发生时，则涉及扫描系统日志文件和错误报告，寻找可能为恶意计划提供优势的敏感信息。随意丢弃的存储设备中包含的数据和信息也可以使用互联网上免费的软件进行大量的（在某些情况下是完全的）恢复和重建，尽管该存储设备在处理之前可能经过了正确的格式化或擦除。同样，随意丢弃的打印材料上的敏感信息也为犯罪提供了便利。\n\
  \n同样，`Privilege Escalation`（权限提升）试图利用医疗系统或软件中的设计缺陷，以访问通常受保护的资源（敏感数据和信息），而这些资源对于特定用户、用户组或应用程序是不可访问的。当恶意攻击者成功提升权限时，他们更容易通过篡改系统/事件活动日志来掩盖自己的踪迹。这使得及时检测医疗网络安全事件并做出有效响应变得困难。\n\
  \n`Bit-flipping attacks`（位翻转攻击）为攻击者提供了一种非密码分析的方法，通过更改加密信息（即密文）中的位来破坏加密算法实现，这种方式可以导致原始消息产生可预测的变化。虽然这种攻击并不一定为攻击者提供精确获取原始消息内容的方法，但它确实可以破坏依赖特定加密通道的特定消息或消息块完整性。在需要此类加密通道进行身份验证的情况下，位翻转攻击可能导致拒绝访问。\n\
  \n然而，`Injection/Poisoning`（注入/投毒）是在请求或提交操作中引入或喂不良/虚假命令和参数的做法，旨在导致医疗系统和设备故障打开，并释放它们持有的敏感用户/客户数据和信息。`XSS`（跨站脚本）、`SQL`（结构化查询语言）中的恶意查询语句、包头和路由表投毒；这些都是已被采用作为注入/投毒威胁攻击方案部分的常用技术。\n\
  \n此外，恶意攻击者可能寻求劫持属于用户及其雇主/医疗机构的系统和设备，以获得对这些机器的远程控制，作为放大后续恶意计划强度和影响的途径。在这种协同控制下，这些被破解的机器受恶意攻击者的反复支配，攻击者能够指示它们执行广泛的恶意活动，以转移人们对真实攻击者的注意力。这些机器在攻击者的影响下变成了“僵尸”。\n\
  \n或者，恶意威胁者可以探索直接或间接地将恶意软件转运到医疗 `ICT` 系统和设备的途径，目的是破坏正常的系统和设备功能/操作以及拒绝访问。`Malware`（恶意软件）是一种经常出现在针对医疗系统和设备的威胁攻击过程中的常用工具。作为一个整合了“恶意+软件”的组合词，`malware`\
  \ 存在多种类型，即间谍软件、勒索软件、木马、病毒、根内核程序、逻辑炸弹、蠕虫和自动运行（`Autorun`）脚本。\n\n\n\n\n同样，间谍软件秘密地将有关计算机运行和活动的数据及信息传输给外部恶意攻击者，而根基包（rootkits）允许对系统、设备和用户应用程序进行后台/后门访问，并掩盖其存在和操作以规避检测。同样，逻辑炸弹是构建在应用程序中的恶意软件，在满足特定逻辑条件时激活某些恶意行为。而自动运行脚本是恶意代码，一旦它们与系统及设备对接界面就会自动激活，使它们能够绕过常规的安全检查。\n\
  \n恶意软件协调对电子健康服务和医疗运营造成巨大破坏和引发严重混乱的能力已广为人知。它们能够在患者的扫描结果和影像报告中添加虚假信息和标记，以误导医疗诊断并损害医疗服务的完整性。此外，它们还可以自动转储或大量提取敏感的个人健康相关信息；篡改医疗监测设备的读数；并更改通过电子输液泵和阀门输送的剂量。恶意软件还能秘密下载其他恶意组件（通过被称为“路过式下载”的策略），并让恶意外部攻击者在医疗机构的数字运营中获得持久的足点。事实上，恶意软件对全球医疗行业构成的威胁影响是一个完全值得畏惧的危险。\n\
  \n## 相关基础设施\n\n企业医疗基础设施的功能通常是为有效利用参与系统和设备提供平台，以支持医疗流程和运营。因此，针对医疗基础设施的威胁和攻击目标是受支持和授权的`Systems`与`Devices`\
  \ 传输的`Data`以及`Information`/`Signals`信息/信号），旨在瘫痪依赖于它们的组织`Processes`和`Operations`。\n\
  \n这些威胁和攻击通常采用旨在侦查和枚举、拦截数字/电子通信以及干扰服务的方法。这些方法包括无线劫车（wardriving）、拒绝服务（DoS）、高级持续性威胁（APT）和中间人攻击（MITM）。在许多情况下，当医疗基础设施受到恶意攻击者的威胁时，跨这些基础设施传输的数据和信息已经面临风险。这还包括处理、存储和传输这些数据与信息的系统和设备，以及依赖这些活动的组织流程/运营。事实上，在这一阶段，其中一个或多个目标已经存在被破坏的可能性。\n\
  \n无线劫车简单是指在移动车辆中搜索医疗设施周围的 Wi-Fi 网络连接的行为，通常带有恶意意图。有时，这种车辆可能是摩托车或自行车，在这种情况下，它们通常分别被称为“无线劫车骑”（warbiking）和“无线劫车单”（warcycling）。通过这种方法，恶意攻击者能够发现并锁定接入私内部网络的开放访问连接。从而获得投放恶意软件、在组织网络上伪造身份或执行“抢夺”行动的手段，以窃取可能用于各种恶意目的的敏感医疗数据和信息。\n\
  \n此外，可能应用 MITM 技术来有效搜索、拦截，并在某些情况下篡改或重路由数字电子通信。目前已发现大量用于 MITM 操作的工具和技术，包括位翻转、网络嗅探器和分析器，以及网络协议和服务中的隐藏隧道。此外，信号干扰发生器/干扰发生器也被用于阻塞安全和警报系统以及基础设施从传感器/探测器向执行器/效应传输的信号和信息。\n\
  \nDoS 是一种威胁攻击方法，旨在临时或不确定地拒绝服务和服务公用设施（医疗系统、服务器、网站等）的合法使用和访问。实现这一目标的方法之一是让这些服务和公共设施陷入无用且无效的活动中，例如处理和响应毫无意义的数据包和请求。这拒绝合法用户访问此类服务和服务公用设施。然而，DoS\
  \ 也可能是其他类型恶意软件（如勒索软件和蠕病毒）的行为和活动的结果，以及无意的人为操作，例如意外禁用连接或绊倒网络硬件。\n\n通常，攻击者积极寻求扩大和放大\
  \ DoS 操作影响的方法，通常会考虑几种方案。其中之一是劫持/破坏同一基础设施内的其他用户机器，通过感染一种名为`bot`的控制恶意软件将它们纳入一个中央控制框架；然后在一个受\
  \ `bot` 感染的机器网络（称为`botnets`）中将它们全部招用于这种恶意操作。另一种考虑是窃取目标基础设施内用户机器的数字身份，然后将这些身份分配给攻击者控制的外部机器，然后再协调它们进行这项恶意活动。当\
  \ DoS 攻击以这种方式获得分布式支持时，从技术上讲，发生了分布式拒绝服务（DDoS）。\n\n高级持续性威胁（APT）应用了一系列复杂的隐蔽且不干扰的技术，在获得对医疗基础设施的未经授权访问后，掩盖其足迹并长期规避检测。在\
  \ APT 中反复发现的协调和资源方面具有稳健、高容量特性，这支持了一个逻辑推理：应用 APT 作为策略的威胁代理/攻击者通常是国家级实体，或非国家实体赞助的恶意组织。他们可能将医疗机构作为对更大目标实体进行间谍活动的的幌子。\n\
  \n在 APT 中看到的协调水平反映了它们能够稳健地整合跨阶段的各种策略、工具和技术，这些技术逐渐但系统地构建起攻击目标或结果。\n\n## 相关流程/运营\n\
  \n在医疗背景下，针对流程/运营的威胁旨在扰乱和困扰安全`Resilience`（韧性），并利用支持`Efficiency`（效率）的组织流程和运营中的安全疏忽。实现这一目标的常用方法是颠覆/绕过安全协议和常规程序，通常通过幼稚的内部人员或恶意外部人员的操作。\n\
  \n事实上，在医疗领域，流程和运营的设计和建立通常旨在保持组织业务模式的效率，并赋予应对冲击和中断的韧性。然而，在应用这些流程和运营来加强和维护医疗机构的安全状态时，任何颠覆或绕过它们的尝试事实证明与组织的长期安全目标相悖。\n\
  \n## 相关政策\n\n在电子健康的网络安全威胁格局，政策（Policies）很少是恶意威胁攻击者的最终目标。然而，这些威胁攻击者继续探索政策保护组织资产、流程/运营和利益的`Robustness`（稳健性）和`Effectiveness`（有效性）程度，试图发现提供恶意优势的漏洞和不足。\n\
  \n\n\n通常情况下，攻击者通过医疗机构现场的物理事件和活动来实现这一目标，这可能涉及天真或带有恶意意图的内部操作。尽管如此，通过系统性地颠覆或绕过医疗机构政策条款的规范，这些威胁往往能够成功地逐渐且系统地侵蚀组织政策的边界和限制。从长远来看，这暴露并持续了关键漏洞，为恶意行为者打开了阻力极小或几乎没有任何阻碍的路径。\n\
  \n2009 年 1 月 16 日，美国卫生与人类服务部（`HHS`）与美国最大的药店连锁店 CVS（CVS Pharmacy, Inc.）达成了一项金额为 225\
  \ 万美元的和解协议。根据一份调查报告，“CVS 未实施适当的政策和程序，在处置过程中合理且恰当地保护受保护的健康信息”。报告进一步指出，“CVS 未对员工如何妥善处置此类信息进行充分培训”，并且“没有对于未能遵守其处置政策和程序的员工建立维护并实施惩罚政策”。\n\
  \n调查源于人们发现 CVS 随手丢弃含有患者受保护的健康信息（姓名、地址、药物和其他个人身份信息）的药瓶，而这些瓶子被放在公共可以的开放垃圾场。这可能侵犯了其百万患者的隐私。\n\
  \n这一事件为适用于医疗机构流程、操作以及医疗组织政策的网络安全威胁格局提供了洞察。\n\n## 风险因素有哪些？\n\n有几个风险因素有时有助于针对人员/用户、系统和设备、基础设施、流程和操作中的安全漏洞以及政策漏洞的网络犯罪分子铺路，从而获取医疗机构的资产。然而，当威胁针对流程/操作和政策规范时（特别是带有恶意意图时），通常是更大计划的前奏，而其成功取决于目标医疗机构薄弱的安全文化。\n\
  \n一些医疗机构认为，基础网络安全培训对于其技术人员或支持人员是必要的，这通常归因于资金限制以及某些被认为是非技术性职位的性质。更糟糕的是，许多医疗机构（特别是在发展中国家）未能聘用或定期签约网络安全专家和专业人士，尽管他们拥有大量的电子健康（eHealth）产品和服务。然而，当涉及到电子健康背景以及可能的其他网络安全领域时，医疗机构入口处的门卫和接待人员对网络安全保护的重要性，与几层之上的\
  \ IT 经理一样关键。\n\n门卫如果理解恶意行为者如何通过“搭便”（piggybacking）和“尾随”（tailgating）等手段寻求医疗设施的未经授权物理访问，那么在设施内部及周围的任何入口或遇到未能及时正确识别身份的陌生人时，他就知道要注意什么。如果此人还理解在公司环境中植入硬件键盘记录器或网络嗅探器可能导致的风险，情况会更理想。\n\
  \n同样，考虑一名清洁工，他理解通过搜寻被丢弃的存储设备、带有个人信息的便利签、未粉碎的公司文档或随手丢弃的不再使用的公司系统，如何为恶意行为者提供有用的信息，以危及医疗机构的网络安全状态。这样的人会对组织使用的中间垃圾场或垃圾收集点的未识别陌生人保持警惕。\n\
  \n一种日益增长的做法是人员/用户在多个网络服务和应用程序中使用相同的凭据（用户名和密码），这是另一个不可忽视的强大风险因素。一份安全报告显示![图 2.4 医疗保健网络安全事件——风险因素](img/fig7_B.jpg)\n\
  \n图 2.4 医疗保健网络安全事件——风险因素\n\n然而，另一个在颠覆医疗保健安全流程和操作中常见的因素是由于熟悉、天真和亲缘关系而导致的松懈。根据 20\
  \ 世纪美国作家比尔·范恩（Bill Vaughan）的话，“熟悉是所有破坏者中最具破坏性的”；职业教练布兰尼·伯根德（Brittany Burgunder）补充道：“仅仅因为某些东西熟悉并不意味着它是安全的。仅仅因为某些感觉安全并不意味着它对你有好处。”医疗机构的安全人员更容易颠覆/绕过安全协议、流程和操作，为一个在设施内已变得熟悉的陌生人提供访问，或为一个未能提供访问设施授权的亲属提供访问。同样，当涉及到亲属或其他熟悉人士时，员工/用户可能对其个人访问凭据、数据和设备的安全性更加松懈。\n\
  \n此外，设计不佳的医疗应用程序未能设计中稳健地整合安全协议和保护措施——如密码加密、输入验证/错误检查、安全套接字通信、双重身份验证、访问/登录超时等——这对此类应用程序收集、生成或访问的用户数据构成了危险。通过非常简单且不成熟的工具和技术（其中许多软件是互联网上免费提供的或具有公开源代码，只需编译运行），敏感的用户数据可能被恶意的外部行为者窃取。\n\
  \n然后，一些医疗系统（硬件和软件）以及设备未采用安全设计和卫生的最佳实践——例如最新的反病毒程序、防火墙策略、广告和跟踪器拦截器、针对拦截加固的操作，以及具有防重构能力的接口——这些本身就可能成为医疗数据和信息的威胁。例如，一个具有可区分按键音的安全密码键盘，或者使用无法抵御频繁重复触摸模式磨损的硬件工程设计。随着时间的推移，这可能对用户数据、访问凭据和其他关键信息构成巨大威胁。\n\
  \n同样，某些医疗组织政策未能防止，或无意中授予用户对组织系统/设备和基础设施的权限、访问权限或可用性，超出了其有效履行工作岗位职责所需的。这对数据和信息构成了隐蔽的危险，因为这些用户成为了恶意行为者更愿意探索以到达资产的直接通道。\n\
  \n此外，还有遗留医疗系统，制造商发布了关于发现漏洞的公告；但这些系统尚未发布修复这些漏洞的安全更新，而它们仍在使用各种医疗流程和操作中活跃。事实上，这好比一间众所周知没有锁的房子，但仍作为各种用户贵重物品的存放处。\n\
  \n\n\n此外，自自带设备（BYOD）安排的日益普及，意味着在医疗保健领域实施的网络安全框架中，往往难以实现平衡或统一的安全状态，因为个人用户设备的安全性在场外是无法保障的。即使对于那些采取严格政策、仅允许公司设备参与数字空间的组织来说，员工/用户频繁将和处理公司设备视为其“私有财产”这种日益增长的心理趋势也是一种可以被轻易利用的风险。此外，场外/远程办公安排要求医疗保健机构的数据和基础设施可以在场外访问，这导致在大规模情况下，要有效监控谁在何时、从何地以及如何访问了什么变得更加困难。所有这些现实交织在一起，使医疗保健网络安全的风险格局变得复杂。\n\
  \n信息验证开放渠道的缺失也可能成为一个风险因素，增加恶意攻击者的成功机会。例如，针对新托管的网络医疗保健服务的用户/客户及访客的持续攻击，试图窃取新部署应用程序软件访问凭据的社会工程尝试，亦或是惊扰第三方供应商/关联方的违规/虚假交易。通过开放且可能是面向公众的渠道实时验证信息的能力，可能是决定此类恶意事件成败的关键。\n\
  \n再次，人员/用户的无知文化、政策条款的执行不力、政策反复以及过于快速和频繁的政策变更——这些情况对政策条款在应对现代医疗保健网络安全威胁格局现实挑战方面的有效性和稳健性构成了持续的关键风险。医疗保健机构的政策开发过程必然需要网络安全专业人员参与风险评估。通过试图过快地引入变革的新组织制度，特别是在尚未充分评估过渡真空期通常产生的风险和疏漏之前，医疗保健机构的网络安全状况可能会处于脆弱状态。恶意个人通常盯着这些变化/过渡时期，将其作为策划恶意意图的优势。\n\
  \n然而，除此之外，还有一些自然现象可能对医疗保健中的电子健康部署带来同样的风险。这些现象虽然通常会导致相同的威胁结果，但与其他已知威胁主体（Threat Agents）的传统运行模式不同。例如，地震和火灾可能会威胁电子健康应用所依赖的基础技术基础设施，如国家电信网络和电网。虽然这些事件可能对某些电子健康部署的运行构成关键威胁——例如远程医疗和移动健康应用无法使用互联网和电信服务——但它们并没有反映传统攻击者操作和活动所具有的意图和刻意性。\n\
  \n事实上，要接受电子健康及整个医疗保健网络安全威胁格局的真实范围和现实可能会令人目不应接，尤其是本章讨论和解释的内容并不自称详尽。因此，提出以下问题：“医疗保健利益相关者和专业人员如何更好地定位和准备，以有效应对和参与这些现实？”是完全合理的。然而，已经意识到这一威胁格局的本质和现实，也许是寻求这一关键问题答案并取得的必要且重要的第一步。\n\
  \n\n3. Panda Security (2020，8 月 26 日). 43 项 COVID-19 网络安全统计数据*Panda 媒体中心. [`www.pandasecurity.com/mediacenter/news/covid-cybersecurity-statistics/`](https://www.pandasecurity.com)\n\
  5. Verizon (2020). *数据泄露调查报告 (DBIR). [`enterprise.verizon.com/resources/executivebriefs/2020-dbir-executive-brief.pdf`](https://enterprise.verizon.com)\n\
  7. U.美国卫生与人类服务部 (2017，6 月 07 日). 解决协议：CVS 支付 225 万美元并改进处置做法以解决隐私案件。[`www.hhs.gov/hipaa/for-professionals/compliance-enforcement/examples/cvs/index.html`](https://www.hhs.gov)\n\
  \n\n\n\n\n准确九天后，来自加拿大数据隐私监管机构的专家小组访问了 Adeola 工作的医疗机构，调查涉及患者电子健康记录的“可疑活动”。起初，事件的发现源于八天前在机构网络上检测到的异常行为——而那正是在\
  \ Adeola 在 `mHealth` 应用程序上尝试登录医生仪表板遇到困难的第二天。\n\n该事件导致 Adeola 所负责的 11,000 名患者的医疗数据泄露；其中\
  \ 4,000 名患者的电子健康记录在 `Psyche-I-Track` 提供的三个不同医疗服务中被严重篡改。调查显示，Adeola 当前的访问凭据激活了受损点，使恶意外部攻击者获得了访问该机构基础设施的权限。\n\
  \n这一假设性事件从一个极小的视角，让我们看到了现代电子健康网络安全领域一直以来面临的斗争：技术自我保护（有效且高效）的能力，与人类因素在医疗信息与通信技术安全运行方面充分配合的能力之间，存在持续的脱节。这说明了一个事实：安全性及其相关的协议和规程很难与易用性和用户便利性良好融合。最终，这使得全球医疗行业利益相关者心中产生了一种“谁下一个，还会发生什么？”的挥之去的恐惧——这种不确定性的阴云笼罩着该行业的巨大潜力。那么，路在何方？我们如何找到平衡？\n\
  \n## 电子健康部署中的个人网络安全\n\n多份独立报告（包括美国电信巨头 Verizon 发布的 2019 年《数据泄露调查报告》`[DBIR]`）\n\n\
  一系列个人网络安全方面的因素和疏忽被认为助长了医疗网络安全事件频发的现实，包括：\n\n1. 被盗的访问凭据；\n2. 弱密码或未更改的默认密码；\n3. 篡改防火墙和反恶意软件配置；\n\
  4. 共享用户凭据（用户名和密码）；\n5. 修改设备和系统的自动更新设置；\n6. 上传错误或感染的文件；\n7. 访问未经授权、不安全或危险的网站；\n8.\
  \ 出各种个人但天真的原因绕过防火墙限制；\n9. 通过不安全/未验证的通道传输敏感信息；\n10. 安装不可信的第三方应用程序；\n11. 滥用访问权限；\n\
  12. 个人/公司设备和系统的访问权限错误或共享；\n13. 将敏感信息误发给非预期接收者；\n14. 滥用访问权限；\n15. 未应用/安装更新和补丁；\n\
  16. 点击垃圾邮件中的链接；\n17. 未能及时识别并报告/升级威胁状况；\n18. 不妥善处理包含敏感信息的文件和媒体；\n19. 存储介质放置不当；以及\n\
  20. 对个人网络安全的最佳实践缺乏普遍认知（仅列举几点）。\n\n这些隐蔽的状况在医疗信息与通信技术的背景下，已被证明是个人网络安全的祸星，而这些技术绝大多数都是以用户/人员为操作核心的。\n\
  \n考虑到人们/用户在高价值的电子健康网络安全链中往往是最脆弱、最易受攻击且最疏忽的群体，那么可能更容易理解为什么个人网络安全对于电子健康领域来说是不可逾越的。\n\
  \n那么，应该如何概念化并实践个人网络安全呢？\n\n答案在于理解我所说的`安全直觉`（`Intuition for Security`）。\n\n## 安全直觉\n\
  \n三个特征有助于描述和定义`安全直觉`。它们分别是`直觉`（`Instinct`）、`知识`（`Knowledge`）和`行为`（`Behaviour`）。\n\
  \n`直觉`是一种能够催化（有时是下意识）的理性倾向。`知识`涉及认知能力，可能通过反复关联、训练或经验获得。`行为`是反映选择的体现行动特征。\n\n![Figure\
  \ 3.1](img/fig8_B.jpg)\n\n这三个特征有助于概念化个人网络安全的基础，特别是因为在网络安全实践中，`知识`会强化`直觉`，两者结合共同指导并告知`行为`。\n\
  \n\n\n\n\n同样，是这种“直觉”会让一名医疗专业人士直接拒绝将用于在医院系统之间传输敏感患者记录的移动存储设备，借给需要向设施外传输数据进行打印的亲近朋友或亲属。相反，他们宁愿交出一个不与医院系统连接的个人移动设备，尽管该医疗专业人员本可以选择从工作移动设备中移出所有敏感患者数据，并在返回后对设备进行恶意软件扫描。\n\
  \n然而，这种直觉反应可能基于对事实的认知，即工作移动设备可以使用简单的数据恢复软件工具恢复其敏感数据。还存在在设备中植入新型恶意软件的可能性，这可能无法被反病毒扫描检测到），或者（故意或无意地）被替换为嵌入了自动运行根内核程序的完全相同的副本。\n\
  \n因此，通过结构化地模拟实际威胁情景的随机测试，然后分析目标个体在这些测试条件下的行为选择和反应，评估“安全直觉”（Intuition for Security）变得可能。这将为个人/用户的角度评估医疗机构的安全状况提供有用的见解。\n\
  \n有效识别、避免、隔离和遏制威胁主体及威胁状况的能力——这就是`安全直觉`的基本素质。\n\n## 威胁情景：识别、隔离与遏制\n\n`第二章` 已经详细讨论了电子健康和医疗保健领域可能出现的各种威胁主体、它们为人知的运作机制，以及当电子健康部署针对不同层级时可能表现出的各种威胁攻击情景。\n\
  \n然而，在医疗和电子健康背景下，个人网络安全面临的更大挑战是如何识别和隔离它们，以便有效地遏制它们的运行，至少在个人层面（这是它们最初于针对的地方），并在进行相应的升级和报告之前。事实上，在信息和通信技术的背景下，几乎不可能完全避免或防止网络安全威胁情景。尽管如此，它们是否会成功实际的安全违规，在很大程度上取决于能否从医疗信息技术的个人（用户侧）层面有效地识别、隔离和遏制针对网络安全的威胁和威胁主体。\n\
  \n理解这六项原则/指南将证明是有用的，无需考虑任何特定顺序（图 3.2`）。\n\n![图 3.2 电子健康个人网络安全的六项原则/指南。](img/fig9_B.jpg)\n\
  \n`图 3.2 电子健康个人网络安全的六项原则/指南。`\n\n1. 了解哪些个人负有个人或共享责任进行安全/保护的资产可能成为威胁攻击者的目标并被其利用。此类利用尝试成功会有什么（潜在）影响？换句话说，此类资产的安全资本是什么？\n\
  \n   医疗利益相关者的职责和责任通常要求他们对设备和系统、`身份验证与访问凭据`以及私有工作空间的物理访问控制承担安全托管和管理。所有这些对于他们工作角色的各种功能都是用的。在现实中，这种托管和管理超出了这些利益相关者所运营的医疗机构和设施的物理边界和维度。\n\
  \n   对于`安全直觉`来说，这些医疗从业者理解针对他们所托管和管理的这些资产的各种攻击可能性是非常关重要的。他们还必须意识到攻击尝试成功可能对组织的安全状况意味着什么。\n\
  \n   例如，这些可能包括`用于身份验证和访问的用户凭据`、`用于传输数据和信息的移动驱动器`、`自带设备 (BYOD)`安排以及收集过程和存储数据的公司系统。这些资产是具有恶意意图威胁情景中的首要目标。\n\
  \n2. 意识到哪些类型的威胁攻击者可能对这些资产感兴趣。\n\n   > 知彼知己，百战不殆。知彼而不知己，一胜一伤。不知彼而不知己，每战百战俱殆。\n  \
  \ > – 孙子，《兵法》\n\n   当医疗利益相关者托管或管理组织资产时，对于个人网络安全而言，至关重要的一点是他们不仅要意识到受托资产的价值，还要意识到可能想要获取此类资产的实体类型，特别是带有恶意意的。这是个人网络安全的一项关键原则。这一原则让医疗利益相关者了解他们可能要对抗的攻击者的本质，以及拥有哪些可以有效防御这些攻击者的安全资源和能力。通过这样，他们能够更好地衡量并校准他们的“安全直觉”，以与他们在个人层面负责保护这些资产时可能进入的领域的状态和现实保持。\n\
  \n   例如，在军事或政府机构内部设施工作的医疗专业人员必须意识到，即使是国家附属或支持的威胁攻击者也可能试图获取他们的凭据和令牌。这对于访问安全位置，或可能存储高级政府或军事官员电子健康记录的安全医疗系统是有用的。\n\
  \n. 理解威胁攻击者在寻求破坏个人网络安全以控制资产可能会应用哪些类型的工具和技术。威胁攻击者在寻求破坏个人网络安全作为获取价值资产的路径时，通常会部署各种工具和技术。\n\
  \n   部署的工具或类型通常与威胁攻击者在实现结果的过程中寻求实现的目标或目标一致。\n\n   在了解哪些个人网络安全托管资产可能是威胁攻击者的目标后，下一步是理解针对这些资产的威胁方法和策略可能包含的工具和技术。\n\
  \n   例如，用户如果能够理解社会工程策略可能包含`钓鱼`或`电话诈骗`技术，试图欺骗用户披露个人访问凭据或敏感公司信息，那么她的“安全直觉”就能让她更好地察觉即将发生的电话诈骗威胁情景。\n\
  \n\n\n\n同样，如果医疗保健专业人员理解“窥视攻击”是一种社会工程技术，可能被用于推导出非公开的 URL，并记忆登录密码和用户名，那么他们在拥挤的公共场所的共享计算机上输入个人凭据和访问私人工作界面时就会格外小心。\n\
  \n### 4. 熟悉紧发生和正在发生的威胁情况下可能的传播和放大媒介，并部署各种工具和技术。威胁情况，特别是当它们已成功或开始立足点时，通常会探索传播途径，以放大其恶意操作的影响。在此时能够有效规避并瘫痪它们，可能是遏制目标中的“圣杯”。\n\
  \n然而，作为用户，如果对涉及的威胁行为者类型，以及作为威胁行动一部分部署的工具或技术类型没有敏锐（有时是深层次）的了解，就不可能快速有效地实现这一目标。通过了解正在部署什么种类型的工具或技术，以及此类工具技术在运行过程中已知会探索的传播或放大方法，就可以预判此类威胁情况的潜在影响。这使得在发生不可逆转或关键的损害之前，能够有效地阻止或截断影响。\n\
  \n例如，蠕虫通常通过在连接到网络的设备间扩散来自主传播。因此，对于连接到企业生产网的医疗系统/设备上识别出的蠕虫威胁，规避和遏制其有效方法可能从将该设备断开网络开始。同样，在检测到用户计算机被僵程序感染后，规避威胁行动的有效方法可能从关闭与机器进出的远程通信开始，以便将机器从远程攻击者的协调控制中释放出来。这些是经常使用的方法，且运行可靠。这甚至出现在最近一份关于\
  \ 2020 年 6 月针对 Life Healthcare Group 网络攻击的报告中。\n\n然而，特别是作为一名（非技术性）用户，在此时理解此类行动的深远影响至关重要。同样，考虑到为了保护受威胁的系统或设备而采取的个人网络安全行动，可能导致某些其他组织流程和操作（其中某些甚至与安全相关）产生可能的风险，也是关键。\n\
  \n美国卫生和人类服务部（`HHS`）民权办公室（`OCR`）对 2010 年涉及纽约卫医院（`NYPH`）的数据泄露事件进行的调查，追溯到哥伦比亚大学（`CU`）的一位教授兼医生断开了连接到\
  \ `NYPH` 网络的个人设备。\n\n这位教授兼医生最近为该医院开发了软件解决方案，他停用了该设备——一台个人拥有的服务器。然而，由于缺乏有效的技术保护和全组织的信息风险管理机制，导致泄露，使得约\
  \ 6,800 名患者的健康信息（包括生命体征、药物、实验室结果和整体健康状况）在开放互联网上可见。2014 年，由于这种非恶人为行为，两家机构不得不根据《健康保险可携带性与责任法案》（`HIPAA`）总共支付了\
  \ 480 万美元的损害赔金。\n\n现在，没有证据表明该教授兼医生的行动是威胁响应的形式，或者该行动具有恶意意图，尽管调查显示，涉及的两个实体都没有采取充分措施来确保服务器安全并包含适当的软件保护。然而，这一事件为我们提供了一个洞察：非恶意且意图良好的用户行动，即使目标是增强安全和防护，最终也可能对企业的安全利益产生不利，特别是在没有稳健且敏锐地考虑此类行动的情况下。\n\
  \n因此，最终，如果认为任何规避威胁情况的用户行动从长远来看是有效的，那么在考虑此类行动的最初，或在执行此类行动后立即（最坏的情况下），必须及时通知医疗机构适当的技术支持和安全团队。这将有助于避免可能依赖于禁用工作站的下游业务运营中断，而这些中断对业务流程和组织的安全状态同样至关重要。\n\
  \n### 5. 观察个人管理或托管资产在性能效率上出现偏离迹象，以及正常操作行为的变化。性能效率的降低或正常操作行为的突然变化是即将发生和正在发生的威胁的常见明显表现——通常表现为效率、性能和操作行为正常模式的显著偏差。\n\
  \n例如，当系统和设备突然开始变慢并充斥着广告和提示，或者网络连接和服务开始限流或失败，或者身份验证和访问凭据被突然锁定。如果这些发生没有其他更高层次的技术解释，那么它们很可能表明正在进行恶意软件外泄，或对数据包、数据和信息的中间人攻击（MITM）操作。它们也分别标志着破坏访问客户端数据的网络服务可用性的恶意尝试；以及旨在冒充授权数字身份的努力。\n\
  \n事实上，一种敏锐的“安全直觉”应该是能够迅速怀疑这些发生可能具有恶意意图的。\n\n### 6. 了解建立了哪些防线，以启发并支持个人网络安全努力，确保和保护个人托管的组织资产，并与之配合。这些防线可能存在于系统、软件和设备的设置中；基础设施配置；政策规定或已建立的安全协议/流程/操作中。\n\
  \n例如，某些医疗机构在企业系统和设备上配置了严格的设备策略，其中某些策略允许对每几小时未连接到安全企业基础设施的某些设备进行远程跟踪和/或擦除。其他机构则配备了强大的防火墙和入侵检测防御系统，以及定期的自动备份程序。还有一些维护着最新的企业级反恶意软件产品和服务。\n\
  \n\n\n\n这些都是可能存在的防御防线，旨在电子健康（eHealth）背景下，通过启发和支持个人网络安全工作，无论是作为安全韧性和威胁预防的补充还是增补。因此，医疗保健专业人员熟悉并配合这些防御防线，是增强其`安全直觉`（Intuition\
  \ for Security）过程的重要部分，以便能够有效应对电子健康网络安全威胁格局的现代现实。\n\n因此！请使用强密码并定期更换。避免重复使用旧密码，无论距离上次使用已过了多久。在安全更新发布后，尽快安装/应用这些更新。不要共享或泄露个人访问凭据。避免在缺乏专业操作知识的情况下胡弄安全软件和实用程序。警惕点击链接以及绕过过滤器访问通常受限或可能被标记为潜在危险的网站，或下载资源。在使用个人设备执行敏感工作功能/职责时要务必小心。不要在纸上写密码和访问凭据；数字密码管理软件提供了更安全的替代方案。以上仅是其中几点。\n\
  \n现在，可能会出现自保成为个人网络安全考虑因素的糟糕情况，例如生命和人安全可能直接受到威胁时。在这种情况下，了解有哪些哪些防线可以支持个人网络安全，可能会触发某些行为反应，这些反应从回溯来看，在不危及个人安全的情况下反映个人网络安全的最佳选择。\n\
  \n因此，为了能够识别、隔离和遏制医疗信息技术应用中针对个人安全的威胁状况，仅仅让医疗利益相关者知道其安全管理范围内的资产可能可能被威胁者利用是不够的。他们还必须意识到哪些威胁者可能对在这些资产上获得脚点感兴趣，并同样理解威胁者在寻求破坏这些资产时可能应用何种工具和技术。除此之外，观察性能效率的偏差也至关重要，以便通过冻结传播和放大的媒介来规避威胁状况。然而，这一切都依赖于对支持和启发个人网络安全工作的防御防线的敏锐理解。\n\
  \n## 升级与报告\n\n事实是，在医疗信息技术背景下，存在某些针对个人网络安全的威胁和威胁状况，普通的（未受过技术培训的）利益相关者可能无法做好准备或无法有效处理。例如，考虑那些涉及国家资助或与国家关联的威胁代理和实体，甚至实际国家实体本身的威胁状况。在这些情况下，威胁者的资源能力充足，且通常远超支持和启发个人网络安全的可能存在的任何最佳手段。\n\
  \n在这种情况下，用户假设他们能够有效且有韧性地应对这些威胁状况是愚的。因此，电子健康个人网络安全的责任之一，确切地说也是`安全直觉`，在于能够识别自己何时正面对一个从到目前为止远超其自身资源能力（如培训和安全设置）的威胁者，并知道何时以及如何进行适当的升级和报告。\n\
  \n尽管如此，对所有针对个人网络安全的疑似、确认的、成功或未成功的威胁尝试进行升级确实至关重要。及时、充分地向医疗机构内部的相关部门/机制报告此类尝试至关重要。忽视这一点是危险的，因为对个人网络安全的威胁很少是孤立或随机事件。它们通常是旨在破坏组织/企业网络安全状态的大规模协调尝试。因此，通过及时有效地报告此类尝试，可能及早启动足够的警惕措施，以阻止迫在眉睫的大规模攻击。\n\
  \n然而，事件报告与升级的方法根本上取决于建立了什么样的组织或监管结构来管理网络安全事件（无论是作为特定类别的事件还是作为通用事件处理方案的一部分）。因此，对于医疗机构而言，建立有效的事件处理和管理结构是不可或越的，特别是考虑到医疗服务交付特征的运营关键性，以及对人类生命的风险维度。此外，同样重要的是`人员/用户`能够意识到组织事件管理机制规定的关于事件升级和报告的程序。\n\
  \n尽管如此，如何将网络安全事件有效地传达给相应的组织技术支持以及安全或事件管理团队，对于非技术用户（通常由他们报告这些事件）和必须响应这些事件的技术团队来说都是一个现实挑战。这很多时候是由于用户在升级报告中沟通事件的能力，与这些报告对于提供及时有效的技术响应的易理解性和实用性之间存在脱节导致的。以下是一些说明性问题，帮助`人员/用户`有效地向技术支持和响应团队升级并报告医疗网络安全事件。\n\
  \n1. **你如何描述在事件发生前直到报告这段时间期间，你的个人网络安全和用户体验的现状？**\n   务必说明你作为信息技术用户，在报告事件之前的这段时期内可能经历的所有值得注意的事件。\n\
  \   这些可能是个人参与、介入和互动中显著的事件或情况，涉及与设备、系统或访问凭据的（尝试性）交互。\n\n2. **个人保管的信息技术资产的正常操作行为和状态是否存在任何明显的变化或偏差？这些事件以前发生过吗？**\n\
  \   确保充分说明所有与个人使用信息技术相关的异常情况。如果情况属实，请不要忘记说明此前已注意到这些异常情况。\n\n3. **在这些行为发生之前，正在进行哪些用户操作和活动？**\n\
  \   恰当地报告在注意到第一次及后续行为和运行条件异常时，与个人使用信息技术相关的、正在进行的操作和活动。\n\n4. **是否有任何与事件相关的值得注意的周围环境？**\n\
  \   如果有任何相关的事件，请务必也说明这些。这些事件可能是环境方面的、功能/操作方面的或其他方面的。\n\n5. **在升级/报告之前，是否针对正要升级/报告的情况采取了任何个人（已授权或未授权的）措施？**\n\
  \   务必准确且透明地说明在报告所涉事件之前，可能采取了哪些个人措施，无论这些措施是否经过授权。此外，说明哪些见解可能指导了这些措施。\n\n\n\n\n\n\
  ## 6. 是否曾经尝试对此类事件和发生的情况进行升级/报告？\n\n如果曾尝试过通过正式（通过现有的组织渠道）或非正式的方式对此类事件和异常进行升级或报告，请务必同时提及这些情况，并确保说明这些尝试产生了什么结果或指令（如果有的话）。\n\
  \n## 7. 你对正在报告的事件是否有任何目前的怀疑和意见？什么可能导致了这些怀疑/意见？\n\n对正在报告的事件持有个人怀疑和意见是可以的。毕竟，你被认为是该事件的初始接触点之一。因此，请清楚且明确地陈述这些怀疑；不要忘记提到可能导致这些怀疑的原因。\n\
  \n在网络安全事件的口头报告中，针对这些问题准备好答案可能是一个好主意。即使在书面事件报告中，确保在报告中提供对这些说明性问题的答案同样重要。这些说明性问题并非并无遗漏，但它们为在这方面的有效进展提供了实用的指南。\n\
  \n因此，显而易见，在医疗和电子健康（eHealth）背景下，个人网络安全的有效性取决于组织机制是否到位以实现以下目标：\n\n1. 确保用户获得最新的培训和意识提升；\n\
  2. 提供强有的安全策略和协议，以巩固组织的安全状态；\n3. 保证实时信息验证，以及及时高效的技术支持；\n4. 有效且谨慎地管理并最小化风险和责任；以及，\n\
  5. 建立韧性的流程和程序，用于协调事件报告、升级、调查、响应/处理和恢复。\n\n这进一步说明了这样一个事实：通往有效个人网络安全的之旅始于医疗组织或机构的高层行政和管理层。因为只有在这个框架内，网络安全意识的效应才能从高层向外并向下扩散，从而通过敏锐化对安全的直觉来增强个人网络安全的能力。\n\
  \n考虑到当前电子健康网络安全的现状，医疗机构及其资产在任何时候受到威胁早已不再是一个“是否”的问题，而是“何时”以及医疗机构及其资产将“如何”受到威胁的问题。因此，这归结为面对即将发生或正在发生的组织网络安全状态的威胁和攻击时，为增强准备和响应能力而采取的措施和步骤。它们在威胁情况下的表现如何，直接取决于威胁出现时它们的安全就绪程度。\n\
  \n## 注释\n\n1. Verizon (2019). 数据泄露调查报告 (DBIR). [`enterprise.verizon.com/en-gb/resources/reports/dbir/2019/healthcare/`](https://enterprise.verizon.com)\n\
  2. Life Healthcare Group (2020, 6 月 09 日). Life Healthcare Group 遗憾地宣布其南部非洲业务是 IT\
  \ 系统针对性犯罪攻击的受害者. [`www.lifehealthcare.co.za/news-and-info-hub/latest-news/life-healthcare-announces-cyber-incident/`](https://www.lifehealthcare.co.za)\n\
  3. McGee, K. (2014, 5 月 07 日). 违反 HIPAA 规定支付 480 万美元结算. [`www.databreoday.com/48-million-settlement-for-hipaa/`](https://www.databreoday.com)\n\
  \n# 4 电子健康部署中的数据/信息安全\n\n\n\n\n例如，即使对于遭受终末期疾病甚至可能处于死亡边缘的个人，个人尊严权也必须得到维护。治理医疗数据如何处理、访问和管理的多利益相关方规范框架也必须谨慎遵守。患者医疗数据的处理和管理必须符合更广泛的可接受最佳实践，以及广大公众的最大利益。作为患者且患有某些疾病的人员，其安全通常也依赖于保持其医疗记录的私密性和安全性。虽然有时，医疗数据和系统也可能成为外部干扰威胁国家主权的途径。\n\
  \n然而，在这一复杂困局的核心，存在着一项共识，即电子健康记录或患者医疗数据应保持合理的信誉度、可访问性、私密性，并免受未经授权的干扰、披露、使用、处理、传输以及其他数据相关操作和交互的侵害，特别是那些未能直接且透明地确保数据主体本身获得知情同意的操作。在多个司法管辖区，已建立独立的监管机构，通过运行和应用载入`法案`和`法规`中的一系列指令和规范，来保护并确保`医疗数据`的`不变性（Invariants）`。\n\
  \n对于医疗机构而言，斗争不仅关乎对现有法规的合规；还关乎在服务交付中建立透明度和信义责任的声誉。医疗机构确保电子医疗数据和信息具有充分且有效的安全及风险管理的意识日益增强，加之监管在催化这种意识方面发挥的作用，以及许多司法管辖区政府对违规和违反规定的行为的响应，揭示了这场斗争的非同寻易性。\n\
  \n尽管几个政府（如美国）已经建立了在医疗等领域激励技术“有意义的使用”的框架，但未能满足针对安全、可靠和负责任的应用所需的规定，其监管后果可能会迅速降低此类激励措施所提供的效用和优势。\n\
  \n## 完整性、机密性与可用性：不变且不可妥协\n\n`完整性`、`机密性`和`可用性`对于`电子健康`为全球医疗提供的效起着至关重要的作用。事实上，它们的作用是不可缺的。正如`第一章`中所强调的，这可以归于多种因素和现实。以下是近期全球医疗领域发生的事件中所发挥过的几个因素。\n\
  \n2017 年，据报道，位于马萨诸塞州威斯特伯勒勒（Westborough）、为美国医疗机构提供供应商服务的云端电子健康记录系统 `eClinicalWorks`\
  \ \n\n这些指控包括：在患者屏幕上定期显示错误的医疗信息图表、在单一视图中定期显示多个患者的医疗信息、在特定工作流的进展记录中未能准确显示病史，以及审计日志未能准确记录用户行为，指控医疗供应商\
  \ `eClinicalWorks` 违反了信义责任并存在严重疏忽。\n\n这一事件揭示了可靠且可信的数据和信息操作对医疗交付业务的重要性。事实上，每当医疗数据和信息的真实性产生怀疑时，整个关注案例的`电子健康`操作流程链（无论是产品还是服务）的效用就会被中断。这还预示着对生命和安全的潜在的危害影响。因此，`ECRI\
  \ 学院`（原急急护理研究所）在 2019 年的一份报告中\n\n2018 年的一起事件\n\n这意味着大量的医疗工作者和专业人士——非医务人员、心理学家、营养师和其他专业人士——通过虚假档案，能够访问患者的电子医疗记录，即使这些患者与其医疗专业、医疗工作或雇佣职责毫无关系。\n\
  \n这起事件揭示了一个不可妥协的事实：医疗数据和信息应仅对获得授权的个人开放，这些人员需要此类数据来执行某些定义的医疗或医学功能，以符合数据主体的最大利益。同时还要确保在如何访问和使用此类数据方面获得知情同意。\n\
  \n另一个涉及 `Cignet` 的案例（一家在美国马里兰州南部运营多家医疗机构的医疗服务）涉及 41 名在 2008 年 9 月至 2009 年 10 月期间请求访问其医疗记录的患者。该医疗机构连续几个月未能满足这一请求。尽管当时`HIPAA`中的规范要求医疗机构必须在收到请求后\
  \ 30 天内向患者提供医疗记录副本，最晚不超过 60 天。\n\n2010 年 3 月 30 日，美国司法部卫生健康服务部（`HHS`）民事权利办公室（`OCR`）对马里兰州乔治王子县的\
  \ `Cignet` Health 获得了缺席判决，原因为其违反了多项`HIPAA`的监管规范。尽管 `Cignet` 已于 2010 年 4 月 7 日向 `OCR`\
  \ 提交了医疗记录，但这已超出要求的截止日期几个月。`Cignet` 因这一违规行为被处以 130 万美元的民事罚款。\n\n虽然本案中尚未明确导致缺席的原因，但该事件提供了一个清晰的视角，说明了在请求或需要时确保医疗记录随时可用的必要性。\n\
  \n在另一起事件中\n\n通过这起事件的视角，也许更清楚地解释了为什么`可用性`是医疗数据的不变量，以及为什么医疗法规在医疗背景下，对于确保数据和信息可用性相关事务的快速访问和响应具有极高的重视。\n\
  \n\n\n\n\n不可否认，信息技术（或电子健康）在医疗保健领域的应用，其主要目的是为了确保能够无随地获得优质医疗保健服务，且不受地理位置、移动性或类似限制所带来的任何形式的限制或障碍。然而，这种背景下的实用性依赖于医疗/保健数据和信息以同样的方式可用，特别是以一种被认为准确且可靠的方式，为医疗/保健诊断和决策提供依据。\n\
  \n当 `Integrity`（完整性）受到损害时，这一切都会崩塌。那么，如何在医疗保健信息技术应用（电子健康）中确保 `Integrity` 呢？\n\n###\
  \ 1. 方面被广泛考虑的一种观点是允许患者（频繁/定期）访问其医疗/健康数据。设备传感器具有较大的误差范围，以及在数据处理/操作链的不同点可能发生拦截和篡改的可能性，这些事实在近期事件中已变得更加明显。通过允许患者在处理/操作链的各个点访问其数据，这增加了一个基于利益的验证层，在链持续扩展时是可以信赖的。其逻辑非常简单：没有人比患者自己更关注医疗/保健记录的准确性了。\n\
  \n然而，这并不会以任何方式减轻医疗保健机构在安全收集这些数据和信息，以及以可靠安全的方式对其处理和存储等方面的责任。因此，在任何方面，这种验证层都不能解释为这种责任的转移或推卸。\n\
  \n同样重要的是，黑客也可能是患者（或伪装成患者）。因此，在此背景下必须采取安全措施，以验证通过电子健康部署请求医疗数据的个人（患者）的身份，并确保这些个人（患者）只能访问他们的数据，仅限他们的数据，且无其他任何内容。\n\
  \n生物识别认证经常被探索作为一种验证个人身份的万无一失的方法。额外的措施如防火墙限制、蜜罐以及入侵检测/防御系统也已应用于多种场景，用以限制在这种情况下可以访问和查看的内容，同时监控暗示恶意意图和操作的异常行为。\n\
  \n### 2. 在数据处理和操作链的各个点维护日志文件，以便在怀疑或确认错误时进行跟踪和检查。审计日志对于确保电子医疗/保健数据和信息管理完整性这一目标是不可缺的。这是因为在许多情况下，当调查违规行为时，审计日志提供了一种建立或反驳医疗保健机构方面不负责任行为的方法。此外，它还帮助医疗保健机构在常规检查期间标记出其操作和流程链中的红点，这些红点可能会损害它们的风险状况。\n\
  \n这一切之所以成为可能，是因为审计日志有助于在完整性问题出现时追溯源头。它提供了一种识别此类问题可能原因的方法，并确定了哪些技术、结构或操作措施可以帮助在组织范围内避免此类事件的发生。\n\
  \n## 保护隐私\n\n尽管“隐私”一词继续出现在有关医疗保健网络安全事件的讨论中，但该术语本身并没有通用的定义，除非是在特定管辖区内具有约束力的法规背景下所定义的定义。这是因为隐私在本质上具有更多个人化的维度，并带有重叠的考量，而法规往往难以捕捉这些内容。这些包括身体完整性、个人尊严、秘密性和个人自主。\n\
  \n然而，每当发生违规行为时，隐私仍然是首要考虑。隐私政策有助于将医疗保健机构的业务利益和目标与保护隐私的责任相结合。此外，法规通常要求医疗保健机构建立稳健的风险管理计划，帮助他们主动评估、检测、缓解并有效应对风险。\n\
  \n此外，某些管辖区的法规（如欧盟的 GDPR）规定了从组织到用户角度旨在保护隐私的最佳实践。这些包括：\n\n- 从收集的患者医疗保健/医疗数据中移除个人身份识别信息，有时将这些信息映射到伪标识或特殊标记，这有助于在数字操作和流程中区分属于特定个人的记录，而无需一定识别这些个人——这种技术被称为`匿名化/去标识化`（Anonymization/Pseudonymization）。\n\
  - 收集极少量的用于唯一识别患者的数据和信息，这是直观的，因为对于使用医疗服务的患者来说，要求的个人数据和信息越少，越容易保持此类个人数据和不公开，从而减少潜在内部外部威胁的攻击面——这种技术被称为`最小化`（Minimization）。\n\
  - 确保在用于医疗保健的软件和系统的概念化、设计和工程阶段嵌入隐私考量——这种方法被称为`隐私设计`（Privacy by Design）。\n\n`隐私设计`可以通过确保以下点来实现：(a)\
  \ 在新系统和软件中默认激活最严格的隐私设置（也称为`默认隐私`，Privacy by Default），(b) 纳入预防性的隐私措施，以便在隐私风险演变为违规/事件之前对其进行预测和阻止，(c)\
  \ 应用端到端的安全技术以在数据处理和操作的整个生命周期执行隐私，以及 (d) 敏感数据和信息在任何时间、任何地点和任何目的下都进行安全的计算和处理。\n\n\n\
  \n\n在机密性方面，医疗机构有义务保护患者电子健康/医疗记录免受未经授权的访问，即使是来自组织内部。这要求患者的数据和信息仅供那些为了有效的医疗诊断或提高医疗服务质量而需要访问这些记录的专业人员和员工使用。它还要求采取措施，以确保这些医疗/健康专业人员和员工在未经授权和未经主体同意的情况下无法披露此类数据和信息。\n\
  \n破坏机密性（即使在内部）也会削弱人们对医疗机构有效保护电子健康记录（EHR）免受任何媒介（包括外部）威胁能力的普遍信任。这通常是机密性泄露后引发监管处罚的焦点。那么，如何才能保护机密性呢？\n\
  \n确保机密性的基本原则是**访问控制**。然而，其应用方式有时取决于受保护数据/信息的状态（是静态存储还是传输中）。尽管如此，这些方法的概念化在大体上是相同的，因为其目标通常是确保未经授权的实体无法访问、提取或查看被视为机密的数据和信息。\n\
  \n### 1. 访问身份验证以确认请求实体的授权\n\n在尝试保护电子健康领域患者数据和信息的机密性时，确保敏感医疗记录仅供获得授权的人员访问是非常关重要的。这通常意味着增加了一层身份验证，作为一个确认请求访问此类数据或信息的实体已授权的过程。\n\
  \n将此与事件日志操作相结合进一步有助于追踪并了解哪些实体在什么时间访问了什么特定数据或信息，同时也可能确定对敏感数据和信息执行了哪些用户操作，即使是授权实体执行的操作也是。\n\
  \n### 2. 加密实现安全的传输、存储和检索\n\n加密本质上是确保敏感数据和信息通常无法被直接读取或解读的过程。这通常通过将敏感数据和信息编码为某种形式来实现，该形式需要密钥或口令才能将数据或信息还原为可读的明文形式。\n\
  \n当这种技术应用于整个数据通信/传输过程时，它被称为**端到端加密**（或 E2EE）。\n\n## 保证可用性\n\n在多个司法管辖区，法规通常要求在规定的最长时间范围内向患者提供其健康记录。这一要求要么是作为医疗监管法案的一部分，要么作为普通公民信息/数据监管法案的一部分。在这些司法管辖区内，如果未能规定时间内（出于任何原因）为患者提供其健康数据的访问，将构成监管违规，这通常会面临巨额罚款和和解。\n\
  \n但是，在电子健康和医疗信息通信技术的背景下，通常如何保证可用性呢？一些被广泛采用的方法和途径包括：创建和管理备份、增加冗余，以及对系统、设备和服务进行进行定期维护，以优化数据处理和操作的性能。\n\
  \n1.  基本上，备份是一种通过数据元素、资源和工具的复制来保证可用性的技术。通过这种技术，敏感的医疗/健康数据和信息被复制，以确保即使在面临恶意软件攻击、数据库损坏/故障/失效或因删除导致丢失等威胁时仍然保持可用。\n\
  \n2.  冗余与备份的概念密切相关。不同在于，备份通常涉及数据元素、资源和工具；而冗余更相关地应用于基础设施、系统、组件和功能。冗余是指对关键基础设施、系统、组件和功能的复制，通过创建一个能够保证可用性的故障备用替代方案来增强可靠性。\n\
  \n    然而，在创建和管理备份与冗余时经常犯的一个错误是没有没有确保它们不会暴露在与在使用数据相同的风险因素中。例如，将备份介质存放在医疗机构现场，并与使用数据介质处于相同的条件下，可能会使此类备份暴露于火灾、盗窃、恶意软件攻击、内部威胁等相同风险因素。冗余基础设施、系统、组件和功能也如此。\n\
  \n    在许多情况下，云端选项被推荐，因为它不仅使备份和冗余脱离可能威胁其所提供功能的物理/环境风险，还使得这些备份和冗余的获取不受地理或位置的限制。但另一方面，也有需要意识到云备份和冗余并不会自动且完全地将数据和信息安全的责任转移给云服务商，尽管法规有时会在这方面考虑过一种共享且定义良好的对等安排。\n\
  \n    这首先是因为云基础设施、平台和服务通常是按“现况”（`as-is`）的基础上提供的，订阅组织有责任通过添加和删除功能来进行配置和定制，以满足其安全标准和需求，而且因为云平台已被发现是网络犯罪分子者的新目标领域。\n\
  \n3.  调优操作基本上提供了一种优化数据源、数据库服务，并扩展到依赖它们的数据处理和操作的手段，从而确保它们继续优化、有效且高效地运行。在大规模下，这变得尤为重要，因为当数据处理和操作通过次优路径进行而必须等待不确定的时间时，这对于医疗机构及其患者/客户来说都可能是关键的。\n\
  \n    为此，额外对电子健康系统、设备和服务进行定期维护操作也同样重要。例如：磁盘错误检查以修复坏道、内存碎片整理以优化内存操作、审查错误报告和防火墙策略/事件日志以发现异常和警告信号、检查硬件完整性以识别可能导致故障的缺陷和不足、更新安全功能和应用程序、应用系统升级和补丁、清理不再使用的文件以释放磁盘空间，以及运行扫描和诊断以检测和分析系统故障。\n\
  \n电子健康领域数据和信息安全的其他考虑因素包括对合并、收购和业务整合的数据源、数据元素和数据库进行审查和审计。有时，这些整合可能会引入漏洞和风险，危及母公司及现有数据资产的安全状况。\n\
  \n\n\n\n定期模拟真实网络攻击条件和操作的渗透测试，也有助于为组织框架、结构、流程和政策的安全性韧性提供有用的见解。这些对于识别威胁数据和信息安全的裂缝至关重要，这些裂缝可能会对部署了信息通信技术用于医疗/健康服务提供的医疗机构的安全状况造成颠覆性影响。\n\
  \n此外，还有必要确保第三方供应商、子公司和关联公司承担着与母级医疗机构相同的数据和信息安全标准。许多时候，我们可以看到这些第三方的疏忽无论是有意还是无意地制造并持续了漏洞，最终对母级机构产生了负面影响。\n\
  \n归根结底，在电子健康（eHealth）背景下，数据和信息的安全仍然医疗机构的责任，这种责任在监管面前是推卸的。在引入各种其他参与者和主体与医疗信息通信技术对接时，医疗机构的风险表面扩大了，尽管责任仍然是神圣的。当这些参与者和主体理解了用于确保完整性、保护隐私、维护机密性以及保证可用性的措施和机制时，他们能够更好地合作并支持现有的措施和机制，以实现预期目标和结果。\n\
