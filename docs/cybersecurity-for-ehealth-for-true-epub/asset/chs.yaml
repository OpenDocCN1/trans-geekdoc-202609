  \n# 5 保护电子健康系统与基础设施\n\n\n## 引言\n\n根据《2020 年数据泄露成本报告》\n\n因此，综合考虑收入损失、客户/委托信任的丧失、行业声誉的下降以及监管绝不妥协的严格性，很快就会发现，网络安全事件对医疗机构的影响和意义绝非小事，无法用夸张来形容。医疗机构如果忽视这些关键现实，可能等同于自焚。但在现代医疗实践中，为了稳健地保护电子健康系统和基础设施，需要哪些必要条件？\n\
  \n## 保护电子健康系统与基础设施\n\n安全被定义为“所需的程序性和技术措施，用以：(a) 防止计算机系统中存储或处理的数据被未经授权的访问、修改、使用和传播，(b)\
  \ 防止任何蓄意的拒绝服务，以及(c) 保护整个系统免受物理伤害”。\n\n直觉上，因此，电子健康背景下的安全本质上包含了物理、逻辑以及操作方面。这些方面中的每一个方面都对之前在第一章中强调的网络安全四个维度具有影响\
  \ —— 基础设施与系统、人员/用户、流程和政策。那么，如何从物理、逻辑和操作上确保电子健康系统和基础设施的安全，且不忽视这些多维度呢？（见图 5.1）\n\n\
  ![图 5.1 保护电子健康系统与基础设施的必要措施](img/fig10_B.jpg)\n\n图 5.1 保护电子健康系统与基础设施的必要措施\n\n## 电子健康网络安全：物理必要条件\n\
  \n常见的误解是认为网络安全只有非物理方面和影响。然而，近期在医疗领域观察到的几次网络安全事件证明，破坏网络安全的旅程完全可以从物理角度开始。同样，通往医疗网络安全事件的强大长期解决方案的道路，有时只需修复物理维度上的诱因或易发性趋势/现实。以下是可以可靠应用于保护电子健康系统和基础设施的物理必要条件。\n\
  \n1. **限制对办公室和工作空间的访问。** 确保个人工作空间仅供在这些空间工作的医疗和健康专业人员访问，或医疗机构的其他员工访问（如果是共享工作空间）。允许非员工访问这些工作空间，即使是授予通常不共享这些工作空间的其他员工无限制的访问，都会对医疗机构构成隐性的网络安全威胁。\n\
  \n   内部人员可能会接触到高于其权限级别的数据、信息、系统、设备或基础设施设施，而外部人员（即使没有证明其具有恶意意）可能在无意中进入一个他们无法充分理解操作和现实的关键高风险的空间。此外，医疗和健康专业人员应特别警惕在私下咨询期间让患者处于孤立且无人看管的状态，或在工作期间离开他们的系统和设备，因为网络黑客也可能是患者。\n\
  \n\n\n\n\n## 2. 维护组织环境的完整性\n\n悬挂的网络线（以太网）、未盖盖或损坏的接线盒和电线槽、为了连接端端设备而运行距离很长（有时是公共可访问区域）的布线、位于医疗设施周围无身份标识且无法追踪的数字/电子设备——这些都是许多医疗组织中常见的环境现象，并对网络安全产生影响。硬件数据包嗅器、键盘记录器、信号干扰器/干扰发生器以及网络扩展器/重复器已经通过这些手段成功挂接到电子健康系统和基础设施上，并在很长时间内不被发现。\n\
  \n因此，当布线必须跨越相当距离且不首选无线方案时，线管通道是一个推荐选项。但当这些通道的物理完整性受到破坏时，必须迅速修复。同样，不使用或不再使用的网络线应该切断接头并停止，或者完全拆除。\n\
  \n此外，对医疗组织拥有和运营的数字/电子设备进行显著标记是一种良好的做法，特别是那些内部（组织设施内）运行的设备。这使得在医疗设施内发现外来设备时更容易识别。\n\
  \n## 3. 采用安全处置的途径和方案\n\n事实上，不可否认，医疗组织产生的大电子垃圾可能包含敏感数据和信息，这些信息不能随意处置。这包括存储媒体、系统、设备，甚至非电子的纸质打印文档和刻有字的纸张。因此，当这些材料不再有用或不再使用时，建立适当措施和程序对其进行安全处置至关重要。\n\
  \n对于可回收和不可回收的电子材料，应建立组织措施，以确保完全清除其所包含（或曾包含）的数据和信息，使其变得不可恢复，或至少不易于恢复。同样，非电子材料也应被有效粉碎和/或焚烧。\n\
  \n## 电子健康的网络安全：逻辑必然性\n\n### 2019 年医疗健康焦点报告\n\n结果导致了持续的威胁局面，许多电子健康系统和设备存在制造商和开发者早已公布的漏洞，但仍活跃在医疗运营中，尽管尚未采取措施确保它们收到了最新的安全补丁和修复。此外，还存在一种潜在的危险情况：中央生产网络/数据库基础设施同时为员工、访客/客户以及医疗组织的第三方供应商和子公司提供服务，而缺乏有效的边界和限制。此外，现实情况是关键生产系统和基础设施被用于各种医疗功能和运营，其覆盖范围过广，且缺乏防止外部干扰的充分保护。\n\
  \n因此，作为有效保护电子健康系统和基础设施的逻辑必然要求的一部分，以下点很重要：\n\n### 1. 限制电子健康系统及基础设施的覆盖范围和访问权限。\n\n\
  事实证明，如果组织系统和基础设施的访问范围超授权授权所需的范围，往往会对医疗信息技术网络安全的利益和目标产生不利。例如距离医疗设施数百米外仍可访问的宽范围无线网络、在医疗系统上共享但可通过安全性不良的网络访问的文件和文件夹、不具备端到端抗拦截和抗篡改能力的远程连接功能，包括能够接收不安全（且不可验证）无线网络信号的电子健康系统和设备。\n\
  \n作为一个基本原则，建议对电子健康和医疗技术背景下出现的所有（敏感）数据和信息进行加密，并仅通过安全通道传输，这既不是夸大也不是被害妄想。此外，应有效检查并控制电子健康系统和基础设施的数字覆盖和访问性。同样，确保此类经常处理可能敏感和关键数据信息的系统和基础设施，其访问范围不会超出授权功能和运营的范围也至关重要。\n\
  \n### 2. 为电子健康系统、基础设施和数据资源维护最新的安全状态。\n\n应采取适当的组织措施，通过在合理短的时间范围内进行定期升级和更新，确保电子健康系统和基础设施始终保持最新的安全状态，以反映针对现有威胁格局的有效安全态势。\n\
  \n此外，用于处理、存储、访问和传输敏感医疗信息的电子健康系统和设备应具备内置防护罩和防火墙，防止它们连接到开放访问/未经验证的网络连接或通过其传输数据。电子邮件服务器还应配置内置安全软件，检查邮件附件和链接以验证其安全性。这些对于创建必要的逻辑屏障层至关重要，以保护敏感医疗数据和信息免受试图通过电子健康系统和基础设施以获取此类数据导出（外泄）或进入（渗透）访问的恶意外部入侵。\n\
  \n通过广泛采用和系统部署其他网络安全硬件和软件工具（如终端反恶意软件解决方案、系统和网络入侵检测与防御解决方案、数字报警/陷阱系统等）的支持，可以逐步实现电子健康系统和基础设施强大的安全状态。\n\
  \n### 3. 分隔对电子健康系统、基础设施和数据资源的访问。\n\n医疗机构的访客和客户通常不应能够访问与医疗专业人员和员工相同的网络连接，第三方供应商也是如此。应该创建中央系统和基础设施的子集，以服务于不同的隔离功能、运营和用户类别。例如，用于内部通信的虚拟专用网络（`VPNs`）应保持加密、为此保留，并仅供授权实体访问。当医疗运营的部分外包时，也有必要对此类关系的性质、范围和参与程度进行隔离。\n\
  \n\n\n\n\n```markdown\n存储敏感患者医疗数据和信息的数据库系统和基础设施，也不应允许某些类用户直接访问，尤其是那些非技术类用户。在审查访问/连接请求时，通常会使用中间预处理机制，并判断这些请求是否可以通过中心数据库系统/基础设施的子集来服务。这有助于保持效率，并防止出现恶意用户命令或请求可能危及组织数据库资产的情况。\n\
  \n此外，对电子健康（eHealth）系统和基础设施及其处理的数据的访问，应当面向各种角色的任务和工作职能。前台工作人员不需要访问与其预约安排无关之外的患者健康记录。同样，药剂师可能并不需要访问与其药物史相关之外的患者医疗/健康保健记录。\n\
  \n### 4. 限制个人数字设备与电子健康系统和基础设施的交互与参与。自备设备（BYOD）安排有时会提供一种余地，威胁和攻击借此损害电子健康系统和基础设施的安全性。与电子健康系统和基础设施交互的个人设备，其安全状态的确定确定程度，通常取决于组织政策在其他参与和交互中能够有效监管此类设备操作和活动的程度。在许多情况下，很难以一种万无一失的方式实现这种有效性。\n\
  \n偏于使用个人移动设备访问电子健康门户和接口以开处患者药物的医生、使用个人电脑与医疗专业人员进行远程医疗咨询的患者，以及使用个人电脑调取受监测病例医疗记录的下班医疗人员——所有这些个人数字设备在电子健康中的交互和参与，都是对医疗保健信息技术系统和基础设施安全性的潜在威胁。\n\
  \n因此，运行此类 BYOD 安排的医疗机构必须拥有良好的逻辑规则和政策，明确规定并限制此类出现在其医疗服务和运营链中的设备被授权的操作类型、交互和功能，特别是当涉及患者敏感的医疗或医疗信息时。\n\
  \n## 电子健康网络安全：运营要务\n\n在服务和运营链条中包含电子健康系统和基础设施的医疗机构承担着巨大的责任。这种责任在于确保其组织运营和服务以方法为特征的实践、程序和活动，不会与其所依赖的电子健康系统和基础设施的网络安全利益和目标相悖。医疗机构如何确保其服务和运营为特征的文化和制度不会威胁电子健康系统和基础设施的安全状态？以下是一些运营要务建议，旨在帮助保护医疗机构在这方面的利益和目标。\n\
  \n### 1. 针对技术变革和转型采用渐进整合的方法。变革和转型时期通常以真空为特征，这可能是由于 (a) 多个层级之间知识和信息范围的不足/缺陷；(b) 对未来可能带来什么的不确定性；(c)\
  \ 适应`现状`中断的挣扎，以及有时现有应对机制的不完善；以及 (d) 当前个人或集体能力在满足新时代需求方面（感知到/实际的）能力和素质的不足。这些是与技术相关的变革和转型频繁相关的社会技术现实。\n\
  \n黑客和网络犯罪分子也会关注此类变革和转型时期，并迅速发现可能被利用来破坏安全的漏洞。一个证明是，由于 COVID-19 大流行期间的大范围封锁，许多组织突然转向居家办公。\n\
  \n因此，变革和转型（特别是与技术相关的变革）采用渐进整合的方法是重要的——即一种协调的、并从基准开始对齐并重点关注组织基本社会技术现实的方法。通过这种方法，用户可以被启发并支持逐渐适应技术变革和转型，并以有利于业务利益的方式。\n\
  \n### 2. 使用多利益相关者参与的自下而上方法建立政策和流程。近年来在集体诉讼和巨额和金罚过程中获得的一项关键教训是，确保电子健康系统和基础设施网络安全的责任并非医疗机构的首席安全官（`CSO`）、首席信息安全官（`CISO`）或安全与风险管理机构专属。\n\
  \n几个机构在医疗保健网络安全（以及广义的网络安全）讨论中经历的最令人尴尬的现实之一是，投入的巨额资金以及组织高层为制定既稳健又有韧性的政策和流程而采取的精明策略，在在组织基线上因一个简单的按钮点击而无功于事。\n\
  \n从本质上，让医疗机构的低级人员参与有关建立新政策和流程以及修订旧政策的讨论绝不是坏主意。这是至关重要的，因为由于不了解医疗机构所采用的网络安全最佳实践而导致的人为错误和失误（这些通常被载在定义组织政策、流程和程序的的企业文件中）是领先的社会技术和社会文化失误之一，这些失误持续导致全球医疗保健部门陷入不必要的网络安全困境。事实上，它是\
  \ 2019 年英国报告的 90% 网络数据泄露事件的主要诱因。\n\n 3. 建立并培养强大的网络安全文化。组织的网络安全状态取决于反映在组织所有层面的整体网络安全文化具有多大的韧性。在医疗保健行业，实际上是所有行业中，稳健的网络安全文化往往可以决定规避威胁情况和成功的网络攻击之间的差异。但是，如何建立这样一种文化呢？\n\
  ```\n\n\n\n\n激发一种包容性且结合了零信任模型（即不信任任何实体，验证所有请求）的稳健警惕方法，或许是一个良好的开始。最终，医疗保健机构的所有利益相关者都必须成为企业网络安全责任的伙伴和合作者，通过那些有时看似不便、但对于保障医疗信息和通信技术的最佳实践和方法来相互支持和互补。奖励和赞扬良好的安全行为和实践，即使是那些没有在物理上表现出来的；同样也要确保及时纠正和弥补不良的安全行为和实践。建立网络安全策略（例如：密码和用户账户策略、防火墙和远程通信策略、设备控制策略等）并确保其执行。\n\
  \n然而，在此之外，可能更重要的是，必须营造一种氛围，让用户和员工能够放心地报告无意的行为或疏忽，这些行为可能无意中损害了组织的安全状态，或违反了某些安全策略，即使这些安全损害仅仅是理论上的，尚未导致实际的安全事件。在这样的氛围下，医疗保健机构可能获得宝贵的时间来进行有效的应对或反应，从而帮助他们避免迫在眉睫的安全事件造成更严重的后果。然而，如果没有一种让人们/用户感到可以无惧受到不当指责而披露此类疏忽的氛围，这些收益将难以实现。\n\
  \n但是，为了让上述任何措施发挥作用，培训、意识和能力建设不能仅属于那些因职能和角色可能需要这些知识的技术精通人士的专有领域。相反，应让每个利益相关者都合理地了解组织的网络安全体系是什么样的，有哪些保护/限制措施以及位于何处；建立了监控和问责措施；对安全风险的容忍程度是多少；哪些信息技术资产对于防御至关重要，需要防御的威胁本质是什么；哪些实体和领域是高风险的；受到威胁或攻击时该怎么办。在这些方面，确保没有任何利益相关者被遗漏是重要的。\n\
  \n现在，可能会有人认为，这基本上是将饼主动交给了恶意内部人员。然而，结合其他物理、逻辑和操作的必要要求进行考虑，显而易见，网络安全文化只是一个补充方面，在保护电子健康系统和基础设施的任务中，与任何其他方面同等重要。\n\
  \n### 风险评估与事件管理\n\n4. 创建一个内部风险评估和事件管理框架/机制。这对于医疗服务交付业务是不可或缺的，因为对电子健康系统和基础设施的风险和事件可能直接预示着生命安全的严重影响。因此，医疗保健机构需要建立一个框架/机制，在内部评估网络安全风险并管理事件之前，防止其对组织产生不良后果。\n\
  \n这特别有助于医疗保健机构有效衡量量某些流程、操作和实践对长期业务连续性的影响，同时增强和加强其检测、调查、预防、响应、控制和从网络安全事件中恢复的能力，并将损害和损失降至最低。\n\
  \n但更重要的是，这些框架/机制应该是稳健、主动且具有足够响应性的，以便在网络安全风险真正变成事件之前将其识别出来。可能性、概率、后果影响/严重程度、可缓解性（按程度）以及可避免性。这些是有效风险评估的已知支柱——能够建立事件在特定背景下发生的可能性、（在给定现有组织流程、操作和实践的情况下）事件发生的概率、产生结果的影响/严重程度、此类影响如何被减轻/扩散以及到何种程度，以及此类风险可以在多大程度上完全避免。这些是电子健康系统和基础设施网络安全的关键考量。\n\
  \n此外，对于部署了电子健康系统和基础设施的医疗保健机构来说，一个韧性的运营应急计划对于其风险管理和事件响应机制是不可或缺的。这有助于确保当风险转化为事件时，医疗运营不会停止。\n\
  \n## 合规性监控与评估\n\n遗憾的是，如果没有协调的监控和评估方法，这些物理、逻辑或操作的必要要求都无法有效发挥，以确保电子健康系统和基础设施以各种形式出现的医疗保健机构各层实现合规。监控评估计划通常被证明有助于构建和引导这方面的努力和活动。\n\
  \n这通常始于定义监控评估工作的目标/结果、这些目标/结果如何进行基准比较，以及合规包含什么内容（涉及指标，以及如何在背景中进行衡量/评估）。可能，例如，衡量合规性可以设为成功的监管（重新）评估，或者账户管理系统和服务器标记为不符合组织密码策略要求的密码数量的减少。\n\
  \n所有这些都可以正式化为一份计划，概述将用于监控评估过程的方法和方法论——可以是物理、逻辑或操作的——以及如何应用这些方法。接下来是根据监控评估计划的基准目标，在聘用所需的资源以确保监控评估过程顺畅高效之前，决定将追求哪些证据。\n\
  \n事实上，合规性监控和评估的方法营造了主动性和响应性的氛围，从长远来看，增强了医疗保健机构对电子健康系统和基础设施进行有效安全的能力。然而，为了在这方面明智地开展，直觉的第一步是理解电子健康新部署周围存在哪些数字生态系统，以及这些生态系统如何运行并与医疗保健机构的数字化和资产对接。\n\
  \n## 理解电子健康部署的生态系统\n\n正如第二章所示，当电子健康部署开始扩大和扩张时，通常可以看到现有框架和流程周围开始形成新的医疗运营数字生态系统。理解这些新生态系统对现有结构的影响（特别是关于数据和信息安全），对于医疗保健机构在这些业务中的成功至关重要。\n\
  \n这种新的医疗服务或操作创建（或扩大）了哪些数字交互生态系统？哪些元素参与了这些新生态系统？为了有效保护新医疗数字生态系统中的操作，需要考虑哪些网络安全维度？这些是理解电子健康系统和基础设施周围形成的生态系统的基础性问题。\n\
  \n\n\n\n\n在新司法管辖区建立客户群、开设分支机构或子公司、引入新的供应商/供应商/关联公司、新的医疗服务、招聘新员工、工作安排的转变——这些都是医疗机构可能开展的活动，它们将在现有电子健康（eHealth）部署周围开启新的生态系统。\n\
  \n在这些新的生态系统中，重要的是意识到新产生的数据访问点、现有数字基础设施（网络与系统）的扩展、获取/集成的数字参与者和资产（数据、系统、用户），以及这些新生态系统可能带来的监管影响。所有这些新情况必须妥善列举，并应作为监测与评估计划和工作的一部分，特别是为了避免在电子健康系统和基础设施周围维持冗余的生态系统，这些系统可能会为恶意攻击者提供阻力最小的进入点。\n\
  \n因此，员工入职时创建的访问凭据在员工停止在医疗机构工作后必须禁用并归档。当用户在不同的电子健康服务之间切换时，其对之前服务的访问权限应被禁用。前供应商和关联公司的网络和数据访问点应及时关闭。当居家办公安排发生变化时，应相应对某些电子健康资源和工具的远程配置及访问进行审查。当医疗专业人员更换雇主时，应回收属于医疗机构的数字设备和存储媒体。\n\
  \n整体而言，本章强调的这几个要点提供了一个渐进式的模板，可以稳健地应用于现代医疗实践中，提升电子健康系统和基础设施的网络安全。\n\n## Notes\n\n\
