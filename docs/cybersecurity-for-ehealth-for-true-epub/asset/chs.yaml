  \ 公司。\n\n\n\n\n在国家层面，`Governance`（治理）涉及指导和协调 `eHealth`的发展与应用，围绕政策建立共识和多利益相关者的平衡，并通过通过在\
  \ `eHealth` 的各种应用中提供监督和问责保障来保护个人和群体。而在国际/全球层面，它涉及围绕各种利益相关者在使用全球技术设施（如 `Internet`）时相关的权利、责任、规则和风险的论述，这些用途涉及医疗保健、敏感医疗数据的处理与管理以及其他信息技术在医疗领域的应用。\n\
  \n在最理想的情况下，`Governance` 方法应当通过应用促进法治的程序来实现“参与性、透明、负责任、有效且公平”。但是，`eHealth` 的治理在实现这一目标的道路上仍面临着若干挑战：其是在利益往往相互竞争且冲突的利益相关者之间，就各种问题达成共识和平衡是一个众所周知的难题。此外，通常作为前述点的后续，当变革应当由多方利益相关者驱动时，维持进展和行动的动力也面临着挑战。\n\
  \n组织层面治理对医疗机构的影响同样不容忽视。然而，尽管在医疗领域使用信息技术的成本效益已得到证实，并伴随着效率、可扩展性和可移植性的优势，但许多医疗机构仍在努力持续地获得这些利益，因为其内部治理结构、职能和运营在中心往往是破碎的。事实上，很容易将医疗信息技术中的网络安全事件归结为组织层面治理结构和框架的缺失与不足。\n\
  \n例如，追溯到用户意识不足或疏忽的事件，可以直接或间接地地与组织层面治理结构和框架的缺失联系起来。\n\n（注：原文中存在大量重复段落，已根据要求仅翻译并输出核心逻辑内容。）\n\
  \n\n\n其效用在于能够提供某种水平的保障，从而在司法管辖区范围内促进电子健康（eHealth）的广泛采用，维护医疗服务链中所有利益相关者的信任、透明度和问责制。这方面的利益相关者包括(a)患者（可能是公民或非公民），(b)提供医疗和非医疗服务的医疗专业人员，(c)监管机构、资助者/投资者和管理人员，(d)保险公司和供应商。\n\
  \n因此，围绕电子健康监管的讨论集中在：(1) 保护个人医疗和医疗信息免受未经许可（或不再许可）的收集、存储或处理——即`数据主权与隐私`；(2) 保护敏感医疗数据和医疗信息免受未经授权的泄露/暴露、篡改/损坏以及不可用/丢失——即`数据保护`；(3)\
  \ 通过公正规定责任、权利和义务，防止在电子健康产品和服务的提供、销售、流程和运营中针对利益相关者的不公平和不尊严的行为——即`消费者保护`（或`提供者/制造商责任`），以及(4)\
  \ 执行标准以突出并防止电子健康服务利益相关者之间的反竞争行为和操作——即`公平竞争`。\n\n但是，在电子健康的背景下，驱动和维持监管效用的根本目标是什么？理解这些目标，以及在追求这些目标过程中经常遇到的挑战，对于探明医疗机构在电子健康方面应承担的管理和行政责任至关重要。\n\
  \n## 理解监管的目标与挑战\n\n电子健康监管的一个根本性考量因素是：电子健康挑战挑战并超越了传统的医疗服务交付模式；而传统的医疗服务交付其特征是在预先的服务点进行物理呈现，且通过服务交付系统的进展非常直接且定义明确。电子健康为各种医疗服务交付模式/级别（一级、二级、三级和四级）采取了更动态、不受限制的路径，这不受物理边界的限制。\n\
  \n在此背景下，监管的目标是明确在任何应用电子健康交付医疗服务的交互的性质、确定其范围并维护其完整性。此类交互可能是(a) 寻求医疗/医学服务的患者与提供此类服务的从业者之间，(b)\
  \ 履行医疗/医学服务职责的医疗从业人员之间，(c) 医疗从业人员与其以各种职业和专业身份雇用的医疗机构之间，(d) 医疗机构之间各种可能描述其服务交付模式的运营之间，以及(e)\
  \ 医疗机构与提供外包/附属服务支持医疗运营的第三方关联之间。因此，医疗信息技术的监管还旨在界定出现在此类交互中的各种医疗利益相关者必须承担的责任。\n\n电子健康为医疗服务交付业务带来了若干不确定性，监管有时难以跟上其步伐。一方面，在远程能力赋予匿名能力，并使服务交付渠道和资源暴露于可能具有恶意的全球范围外部干扰的背景下，有保护医疗受试者（患者）伦理必要要求的职责。因此，这在缺乏全球认可/跨司法管辖区法律框架的情况下，为公平地归属违规责任带来了挑战，有时还通过将医疗监管拖入消费者保护、法律责任和民权等其他领域，使医疗监管的范围变得复杂。\n\
  \n另一方面，有监测医疗行业内各种利益相关者实践和操作的职责，以确保某些参与者（通过普通市场力量产生的主导地位，或通过兼收购整合利益和资产）不会对行业产生过度影响，这最终可能危及其他利益相关者的利益。从而导致医疗监管必须应对经济学、市场资本化、竞争法和公司治理的某些复杂性。\n\
  \n事实上，在监管医疗信息和通信技术（或电子健康）的操作、流程和服务的过程中，经常遇到许多此类复杂性。\n\n例如，知情是从个人医疗和医学记录中提取的，特别是由于此类背景下适用的数据和信息的敏感性。但是，从电子健康能够服务患者最大利益的角度来看，取决于关于患者的数据和信息是否可处理以告知高质量医疗和医学服务的交付，监管面临着另一个挑战。即如何在平衡知情同意伦理的同时，不削弱电子健康为高质量医疗和医学服务提供的效用，而这些服务也符合数据主体（患者）的利益。\n\
  \n再次，当数据隐私权与公共健康安全利益发生时，经常会出现众周知的挑战。通常情况下，处理个人数据的接受实践要求收集、存储和处理数据的目的必须明确、透明并获得患者（电子健康应用中的数据主体）的授权，以至于每当需要为了与原始收集目的不同的目的进行处理或应用时，要么重新获得数据主体的授权，要么重新收集数据。\n\
  \n然而，在某些情况下，广大公众的福利和安全可能取决于对敏感个人数据的处理（例如疾病爆发期间的接触追踪、安全画像分析或与法律诉讼相关的目的），而这些数据在当时是为另一个已明确定义且经过授权的目的而收集的。监管目标之一是能够在此类公共利益与保护为增强电子健康服务交付而收集、存储和处理的敏感医疗和医学数据的必要要求之间取得平衡。\n\
  \n但是，随着主权政治利益对医疗交付职责和责任的干扰日益增加（无论是在国家还是国际层面），明确理解和界定什么是公共利益有时是一个巨大的挑战，特别是当涉及到现任政府的专制意志和反复变化时。在这方面，监管面临的挑战是明确规定在什么情况下打破数据主体授权的需求，并将电子健康数据和医学记录应用于可能符合广大公众利益的其他目的，同时确保此类规定不被可能伪装成公共利益的政治原因所劫持。\n\
  \n\n\n\n\n此外，还存在跨境传输电子健康（eHealth）数据和信息的担忧，其目的是提高数据主体（患者）可获得的医疗服务质量，而其他司法管辖区可能适用完全不同的数据保护、消费者保护和法律责任体系。因此，电子健康监管的另一个目标是建立一套原则和规范，使其与多个司法管辖区的现有法律和谐统一，并尽可能地减少冲突。\n\
  \n医疗保健行业处于一种近乎不断的蜕变状态。这体现在医疗保健和医疗程序的定期进展上，产生了需要监管审查的新型实践和应用；运营和服务交付范围的不断扩张，使得需要对现有法规进行定期审查；创新技术（如物联网）的频繁出现揭示了需要规范和标准化的新用例和用途；以及需要监管审查并可能需要重组所有结构的合并与收购。\n\
  \n所有这些现实直接和间接地影响着有关电子健康监管的目标，有时会产生新挑战，或使现有挑战变得更加复杂。无论如何，在这样一个动态且复杂的环境中，电子健康监管对于维护电子健康在现代医疗交付中提供的效用仍然不可不可缺的。\n\
  \n## 重要的国际立法\n\n某些国际立法有助于阐明监管在尝试实现以下目标时面临的一些挑战的背景：明确性质、确立范围，并保护涉及全球医疗服务交付的涉及电子健康系统和应用交互的完整性。这些国际立法试图在任何涉及信息通信技术的医疗服务交付各个方面，定义并规范最佳实践标准、伦理、责任、程序和操作。这些立法通常在全球性的全球框架内进行定位和探索，该框架包含了对电子健康安全、可靠、伦理和人文应用更广泛接受的考量。\n\
  \n### 特别是世界卫生组织（WHO）关于电子健康法律框架的报告\n\n《世界人权宣言》（UDHR）特别引用 `Article 12`，规定隐私是一项普遍人权。声明：“任何人都不受对其隐私、家庭、住宅或通信的任意干涉，也不受对其荣誉和名誉的攻击。人人都有权享受法律保护，免受此类干扰或攻击。”通过这种方式，司法管辖区监管的责任和边界得以确立。这要求此类司法管辖区监管提供防止个人隐私受到任意侵犯的保护，同时还要确保监管本身不违反这一特定规定。这一规定也出现在另一项国际立法——《公民权利和政治权利国际公约》（`ICCPR`）的\
  \ `Article 17` 中。\n\n事实上，`ICCPR` 的 `Article 17` 通过 `General Comment (No. 16)` 为\
  \ `UDHR` 的 `Article 12` 提供了更多背景，该注释认为：\n\n> 在计算机、数据银行和其他设备上收集和持有个人信息，无论是由公共机构还是私人个人或实体，都必须受到法律的监管。国家必须采取有效措施，确保有关个人生活的信息不会落入未经授权接收、处理和使用这些信息的人手中，且绝不用于与公约不符的目的。为了对其私人生活获得最有效的保护，每个人都有权以易于理解的形式确定自动数据文件中存储了哪些个人数据（如果有的话），以及这些数据出于什么目的。每个人还应该能够确定哪些公共机构或私人个人或实体控制或可能控制他们的文件。\n\
  \n此外，《欧洲人权公约》（`ECHR`）的 `Article 1` 在以下情况下包含这些例外：\n1. 数据处理符合患者或在当时身体或法律上无法做出同意的另一人的核心利益；\n\
  2. 数据处理是为了预防医学、医学诊断、提供护理或治疗，或医疗服务的管理所需，且相关的个人数据由医疗专业人员处理；以及\n3. 在处理过程中存在重大的公共利益或对公共安全的关注。\n\
  \n这些重要的国际立法极大地帮助完善和过滤了与当代知情同意、隐私、身份和自主权，以及涉及个人数据的其他数字权利等问题相关的监管责任的范围和背景。事实上，它们启发了不同地区出现的监管和立法努力，例如《非洲联盟网络安全和个人数据保护公约》：即《马拉博公约》（`Malabo\
  \ Convention`）。\n\n## 管理与行政的角色与责任\n\n正如之前强调的，医疗机构在电子健康方面管理和行政的角色与责任通常倾向于统一治理的多利益相关者利益、伦理的必要要求以及监管要求，使电子健康应用与业务目标保持一致，同时保留其在医疗服务交付中的效用。现在，如何实现这一目标通常证明是困难的部分。\n\
  \n在这一方面的启动阶段，重要的是医疗机构要机会评估电子健康为业务连续性带来的潜力和前景，然后决定哪些医疗信息通信技术、工具和资源对其业务模式的成功具有最重要的益处。例如，在管理大型客户群的记录时，从长期来看，维持手工（纸质）记录管理模式是不可行且低效的。同样，随着门诊服务的开始扩大，可能有必要以一种患者可以触及的方式提供医疗服务，即使是在医疗机构之外。\n\
  \n这些是为增强业务连续性有效性的可能考虑因素，可能会影响医疗机构采用医疗信息通信技术的决策。但在此时，同样关键的是确保有关数据、基础设施、系统与设备、人员与用户、合规性，以及适用于此类方面的伦理、安全、风险及事件管理和技术支持的其他运营最佳实践都得到了审慎的考虑。\n\
  \n\n\n\n当应用电子健康（eHealth）时，医疗保健流程的几乎每个阶段都会为了各种目的收集数据，因此，医疗机构的管理和行政有责任建立框架来确保这些数据的安全，并确保其不变性（完整性、机密性和可用性）始终得到维护。为此，医疗保健机构应当评估与其提供的各种电子健康产品和服务相关的数据和信息需求，然后采取措施来安全地获取、组织/处理、存储、传输和应用此类数据和信息。当这些操作的某些方面外包给供应商、关联机构和子公司时，母级医疗机构同样有责任确保这些合作伙伴/关联机构遵循与其自身承担相同的标准和最佳实践。\n\
  \n这种实现方式也影响着医疗机构服务交付流程和运营的有效性，以及该机构业务模式满足投资目标的效率。这可以帮助医疗机构预先防止可能影响财务的法律责任问题；防止可能导致声誉和法律后果的运营方案中断；在动态的电子健康环境中有效应对监管、创新和其他进展；将稀缺资源有效分配给并行的业务利益；并保护对于建立消费者对电子健康产品和服务的信任至关重要的道德伦理要求。\n\
  \n此外，管理和行政部门经常要对电子健康产品和服务交付过程中发生的技术性和非技术性（包括人为）错误承担法律责任。因此，医疗机构在精简、扩展和组织其在链中部署的电子健康产品服务的流程和运营方面发挥着角色和责任——要考虑到相关的环境、社会技术和社会文化影响——以符合随之来的风险和安全影响。有时，这可能涉及衡量其风险偏好，并将其与其技术和法律能力进行衡量，以便在建立充分措施和机制来缓解这些意外对业务的影响之前，更好地了解他们预防意外情况的能力，以及在此类意外发生时他们有效应对的准备程度。\n\
  \n此外，管理和行政部门还承担着额外职责，即确保使用电子健康产品服务的医疗专业人员与他们使用的电子健康产品和服务之间实现无缝协作，特别是当决策支持处于意图范围内。这一点很重要，因为基于准确可靠的数据和信息的临床决策支持，其关键影响可能会由于源于人为或机器缺陷的诊点医疗和医疗保健信息的差异而加剧。这种情况可能会威胁医疗机构的业务利益并造成破坏性后果。\n\
  \n最终，医疗经理和行政人员的角色和责任是提供领导、结构和框架，并建立所需的原则和流程，以确保电子健康为机构内部医疗保健服务交付提供的功能以符合法规要求的方式保留，与那些促进广泛采用电子健康的知名伦理考量相结合，并融合多利益相关者治理的各种利益。\n\
  \n为了医疗机构在这方面取得成功，在业务连续性计划中优先考虑信息技术资产非常重要。这样，电子健康产品和服务成为业务连续性的关键考虑因素，使其能够获得管理和行政部门所需的关注，以维护其对于高质量医疗服务交付的效。随后，研究驱动的增强和改进将变得可能，使电子健康产品和服务能够在内部继续发展和进步，以可能积极影响投资回报的方式。\n\
  \n## 合规性与安全性\n\n认识到将合规性与第三方行业范围合同的最佳实践和最低要求误同于企业或组织层面的有效安全性是具有危险的。虽然若干法规和广泛认可的行业合同有助于规定有效电子健康部署可以稳健考虑的最低要求、最佳实践和自愿标准，但这些绝不能被视为建立明确的组织安全政策和目标，以及实施必要的技术流程、控制、系统**工具和程序以保护医疗机构关键信息和通信技术资产的替代品或替代方案。\n\
  \n不幸的是，在全球医疗保健行业，发现医疗机构和医疗保健组织拥有各种声誉良好的第三方标准组织的合规认证，却以非常尴尬的方式屈于网络事件和攻击的情况正变得越来越普遍。这通常被追溯为缺乏稳健且有效的安全框架，尽管对多个自愿标准和最佳实践的合规是显而易见的。\n\
  \n`Compliance`（合规）仅代表机构履行其对第三方机构（可以是行业标准机构、监管机构等）的合同或运营义务的程度，而 `Security`（安全）则意味着超越合规，整合必要的技术流程、控制、系统、工具和程序，以根据明确定义的组织目标稳健且有效地保护关键数字电子资产。\n\
  \n然而，在某些语境下，合规性和安全性往往会重叠。但即便如此，它们在动机、范围和目标上也存在差异。从任何角度来看，医疗机构必须遵守的合规要求和义务通常对于组织目标和运营模型是什么是盲目的，因为它们通常旨在建立或维持公众对该行业所提供效能的信任。因此，这些合规要求和义务有时被发现是模糊的且缺乏具体的。这是完全正确的，因为它们在开发时关注的是一般的行业/各行业，而不是任何特定的组织。\n\
  \n因此，医疗机构和医疗保健机构的责任在于超越满足合规义务，确保组织整个信息和通信技术资产及基础设施的安全性迫切要求。\n\n## 结语\n\n随着数字信息和通信技术继续渗透全球医疗保健领域，并在医疗保健服务交付的电子健康部署中找到实际应用，医疗机构和医疗保健机构意识到并准备好采用和使用此类技术带来的安全影响和企业责任是非常重要的。\n\
  \n\n\n对于非技术类医疗利益相关者（医疗专业人员、医疗工作者、监管与合规机构、健康中心经理、行政人员和保险公司、客户/患者以及第三方供应商），他们通常在电子健康系统和基础设施的实际运行与操作方面缺乏深入的技术能力，且缺乏对有效网络安全程序和最佳实践的专业知识。本书中的信息将有助于他们掌握所需的实务知识和洞察，以应对在医疗服务交付过程中网络安全安全的日常现实问题和挑战。\n\
  \n然而，必须强调的是，在组织/公司层面，采纳和应用书中提供的信息和建议时，必须与技术专家和专业人士进行协商。这些专家将帮助引导并对这些信息和建议进行背景化，使其与组织的运营现实和目标保持一致。其重要性无论如何强调都不为过。\n\
  \n此外，本书也希望能对一般的（网络安全）爱好者，甚至是全球医疗相关/邻接领域的人士产生吸引力，他们希望对医疗行业相关的网络安全威胁和风险有基础性的理解。同时，为设计、创建和开展医疗信息技术培训计划的协调员和导师提供实用的工具，这些计划可以是正式医学/护理学院学位、证书或文凭培训的一部分，也可以是医疗、医学、公共卫生或护理领域的资后继续教育课程。\n\
  \n此外，预计本书的语言、结构和设计将引起国家和区域（或国际）级医学委员会、护理委员会、公共卫生专业学会以及其他医疗机构/协会的共鸣。在这方面，预计成功将基于这样一个现实：尽管该领域具有很强的当代意义，但针对非技术受众的基础性培训资源匮乏，阻碍了该领域培训计划的有效性。本书正是在这一空白处，提供了与该问题现实和需求切合的资源。\n\
  \n但最终，凭借本书提供的从多个组织和国家背景中积累而来的广博见解和观点，希望寻求尽尽力量平息持续动摇全球医疗行业的网络事件和攻击浪潮的医疗利益相关者，能够找到一份在这一追求过程中取得进展和成功的有用且实用的指南。\n\
