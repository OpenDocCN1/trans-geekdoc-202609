  md: 'The distribution of AQI in the sampling cases shows that AES is vulnerable
    to light and moderate pollution. Although pollutant concentrations within the
    AES are lower than along the street canyon area, the AES is also an area where
    residents often engage in outdoor activities in the neighborhood [72]. Prolonged
    outdoor activities in light and moderate pollution areas still pose a greater
    risk of exposure to traffic-related air pollutants for residents. Long-term exposure
    to lightly polluted areas may irritate healthy people, so it is recommended that
    children, the elderly, and people with heart and respiratory diseases should reduce
    prolonged, high-intensity outdoor exercise [61]. Therefore, more attention needs
    to be paid to the air environment in the AES, and design strategies that can improve
    the air quality in the area need to be proposed.


    # 5.2. Effect of block configurations on pollutant concentrations


    The ML models can be applied to generate partial dependence plots to examine the
    nonlinear effects of individual variables on pollutant concentrations. Partial
    dependence plots (PDPs) are popular for interpreting ML models. They show how
    the target prediction changes when a feature varies while considering the average
    effect of all other features [73]. The relationships between BH_std and the four
    regional pollutant concentration indicators were analyzed separately. It was found
    that the effects of BH_std on the global and local indicators were not the same
    (Fig. 13a). Consistent with the results in Section 1 of Chapter 4, BH_std is almost
    linearly related to the global metrics, Cpod_Block and Cped_Block. The larger
    the BH_std, the lower the average pollutant concentration in the block. This indicates
    that the degree of staggered building heights within the block positively affects
    reducing pollutant concentrations [30,74]. However, It is also mentioned in many
    empirical studies that BH_std does not have a single linear relationship with
    pollutant concentration [25,28]. There is also literature suggesting that the
    range of positive effects of BH_std needs to be discussed [54]. In this study,
    BH_std below 25 m instead leads to an increase in pollutant concentration for
    local metrics. Only when the BH_std exceeds 25 m does the pollutant concentration
    decrease with increasing it (Fig. 13a). This illustrates that the mitigation of
    traffic pollutant concentration impacts in the AES region does not rely on increasing
    BH_std alone. There is spatial heterogeneity in the effect of BH_std on pollutant
    concentrations.


    The reason for the difference in the impact mechanism of BH_std in global and
    local metrics can be analyzed by the relationship between building height and
