    sampling cases. The traditional CFD simulation optimization process would take
    more than two months to meet such a large number of iterations. In contrast, the
    optimization process incorporating the ML surrogate model takes only 3 h to accomplish
    this requirement (Table 6).


    The multi-objective optimization revealed a synergistic relationship between the
    two global indices and similarly between the two local indices. However, there
    is a trade-off relationship between global and local indices. The global and local
    metrics cannot be optimal simultaneously. Although there was a certain linear
    correlation between the four concentrations (Fig. 10a), the solution space still
    formed a Pareto front surface in the last generation of the solution set (Fig.
    10b). In particular, there is no absolute optimal solution between the two targets
    Cpod_Block and Cped_AES. The solution space formed by these two objectives can
    be seen as a clear trade-off which indicates that all regions’ pollutant concentrations
    decreased during the optimization. However, when the optimization results converge
