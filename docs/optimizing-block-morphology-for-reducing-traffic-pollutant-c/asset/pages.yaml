    # 3. Case study


    # 3.1. Parametric model development


    The complexity and a large number of morphological properties of actual urban
    blocks make it difficult to comprehensively analyze the morphological effects
    on pollutant diffusion [53]. Therefore, a block type with more pronounced building
    height standard deviation characteristics needs to be selected for discussion
    based on the diversity of block morphology. The case study utilized the block
    basic morphological settings based on one of the clustering results of Wuhan residential
    block morphology from previous studies [28]. These blocks have a relatively large
    BH_std ranging from 20 to 35 m. To examine how BH_std and block layout affect
    traffic pollutant concentrations, the model fixed the FAR and Rb_c at 2.3 and
    0.22, respectively, while varying the BH_std of the block from 10 to 35 m. The
    formula for calculating the standard deviation of building height in this paper
    is shown in Eq. (1) [54]:


    ```

    BH_{std} = \sqrt{\frac{1}{n}\sum_{i=1}^{n} (h_i - \bar{h})^2} (1)

    ```


    where n is the number of buildings in the target block which is 21 in this paper.
    h_i is the height of each building. \bar{h} is the average height of the buildings
    in the block, which is 31.43 m. The block scale was also fixed according to this
    type of block: 530 m for the long side and 270 m for the wide side. The target
    block had 35 sites for building placement (Fig. 3a), but only 21 sites were occupied
    (Fig. 3b), and the total building area was 330,000 m^2 to maintain consistent
    FAR and Rb_c. These building placements were numbered along the Y-axis by A-E
    and the X-axis by 1-7 (Fig. 3a). The study only considered the height and location
    of 21 buildings in the target block. Different BH_std corresponded to different
    and unique combinations of building heights, which were limited to 3-99 m. For
    example, if BH_std was 28.69 m, the heights of the 21 buildings were 3, 3, 3,
    6, 6, 9, 15, 15, 18, 18, 24, 24, 24, 24, 33, 45, 54, 78, 81, 81, and 96 m. A random
    set of'
