    The convergence criteria were set according to the change in residuals. Typical
    residuals at convergence reached 10^-3 for Ux, Uy, Uz, pressure, k, and epsilon
    and 10^-4 for the concentration. The RNG k-epsilon model was chosen as the turbulence
    model.


    The inlet profiles reported by Ref. [64] were set as inflow boundary conditions.
    The velocity profile (U), turbulent kinetic energy profile (k), and turbulent
    dissipation rate profile (ε) can be defined as follows:


    ```

    U(z) = (U*/κ) * ln((z+z0)/z0)   (5)

    k(z) = U*^2 / sqrt(Cμ)   (6)

    ε(z) = U*^3 / (κ(z+z0))   (7)

    ```


    where z denotes the height coordinate (m), z0 is the aerodynamic roughness length
    (m), and κ is the von Karman constant (0.4187). A wind speed of 2 m/s at the 10
    m height was imposed at the inlet. U* is the atmospheric boundary layer friction
    velocity at 0.0774 (m/s), and Cμ is a constant (0.09).


    The pollutant concentration was calculated by solving a steady-state time-averaged
    convection diffusion equation:


    ```

    ∂(ρcui)/∂xi = ∂/∂xi (K * ∂c/∂xi) + S   (8)

    ```


    where c denotes the pollutant concentration. S denotes the pollutant source term.
    K is the mass diffusion coefficient for the concentration, which is the sum of
    molecular diffusivity (D) and eddy diffusivity (DT). The eddy diffusivity is defined
    by:


    ```

    Dt = νt / Sc_t   (9)

    ```


    where Sc_t is the turbulent Schmidt number, and it is a constant between 0.2 and
    1.3 in the RANS model [65]. In the present study, the Schmidt number is 0.4. The
    specific boundary conditions are summarized in Table 2.


    # 3.4. Validation and mesh sensitivity


    A wind tunnel experiment conducted at the University of Hamburg was used to validate
    the RNG k-ε turbulence model and near-wall functions. Airflow and dispersion around
    a finite array of rectangular building models (CEDVAL B1-1) were measured at a
    reduced scale of 1:200 in a Blasius wind tunnel. The experimental model included
