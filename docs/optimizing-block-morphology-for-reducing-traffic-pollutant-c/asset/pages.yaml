    # 5. Discussion


    # 5.1. AQI distributions of the sampling blocks


    After simulating CFD for 1000 samples, the AQI was calculated for each probe in
    the blocks. The probes with exceeded AQI were linked to form areas with different
    contamination levels. The pollution areas for each sampling case are superimposed
    to form a map of the extent and frequency of blocks affected by traffic-related
    air pollution (Fig. 12). Each color represents the extent of pollution, and the
    transparency of the color represents the frequency of possible contamination.
    The horizontal distribution of AQI shows that as the distance to the traffic pollution


    source increases, the intensity and frequency of exposure to pollution decreases.
    Half of the block would be exposed to lightly polluted, and parts of the AES would
    be moderately polluted (Fig. 12a). Heavy and severe pollution hardly entered the
    inner part of the block and was distributed along the street canyon. Analysis
    of the vertical distribution of AQI reveals that lightly and moderately polluted
    areas occupy almost the entire height of the podium. In contrast, heavy pollution
    is distributed below the middle of the podium height, and severe pollution is
    distributed at the bottom. Fig. 12b illustrates the vulnerability of pedestrians
    at the edges of the block adjacent to dense traffic to severe and heavy pollution.
    Residents who are active outdoors and live below the fifth floor in the AES are
    also vulnerable to moderate and light pollution.'
