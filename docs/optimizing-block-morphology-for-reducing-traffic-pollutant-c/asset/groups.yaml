  mdcn: "\n\n## 优化街区形态以降低街道峡谷相邻外部空间中交通污染物浓度：一种机器学习方法\n\nYunni Wu $^{a,b,c}$, Hong\
    \ Chen $^{a,b,c,*}$\n\n$^a$ 华中科技大学建筑与城市规划学院，中国武汉，430074  \n$^b$ 湖北省城镇化工程技术研究中心，中国武汉，430074\
    \  \n$^c$ 自然资源部城市模拟重点实验室，中国武汉，430074\n\n### 文章信息\n\n关键词：\n- 街区形态\n- CFD\n- 机器学习\n\
    - 优化\n- 交通污染物\n\n## 摘要\n\n位于道路旁环境中的居住街区暴露于交通相关空气污染中，不利影响居民健康。街道峡谷相邻外部空间（AES）中的行人高度区域受交通污染物影响最为严重。为了寻找能够减轻该区域污染物浓度的街区形态优化策略，研究了机器学习（ML）回归模型以替代耗时的计算流体动力学（CFD）模型。使用了1000个CFD模拟案例的数据来训练ML模型。选出了最佳代理模型，并将其与优化算法相耦合。讨论了基于区域浓度参数的单目标和多目标优化问题。结果表明，街区的建筑高度标准差（BHsd）是一个关键的形态参数，能有效影响污染物浓度。街区不同位置的建筑高度对不同区域污染物浓度的影响机制也各不相同。通过与ML模型耦合的优化得到的最优街区配置有助于降低污染物浓度。本研究为居住街区设计优化提供了一个框架，可帮助城市设计师高效评估和选择有利于减轻交通污染物影响的街区布局。\n\
    \n## 1. 引言\n\n城市交通排放是空气污染的主要驱动因素之一，随着城市化的发展，其排放量有所增加。交通引起的颗粒物（PM）、氮氧化物（NOx）和一氧化碳（CO）都可能对人类健康、气候和环境造成危害\
    \ [1]。大量流行病学研究表明，肺功能受损、哮喘、呼吸道癌症、心血管和脑血管疾病、乳腺癌及甲状腺功能退化等导致的发病率和死亡率与交通相关空气污染密切相关\
    \ [2–4]。估计显示，2014年和2020年，中国北京分别有8379例和1908例因交通污染导致的过早死亡病例 [5]。因此，发现切实可行的措施以减轻交通污染并提升城市宜居性至关重要。\n\
    \n居住在街道峡谷附近的城市居民因交通相关空气污染而面临严重健康问题的风险 [6,7]。街道峡谷是建筑物如峡谷般排列的城市特征，影响移动汽车产生的污染如何扩散。交通引起的空气污染物对居住区影响的程度取决于多种变量，包括风向、道路类型、街区形状、交通量等。一般来说，次要道路的影响范围较小，可能在50\
    \ m以内，但高速公路和主干道的影响范围更广，可能达到300 m或更远 [8]。研究表明，CO从道路源扩散的最远距离在100 m至200 m之间 [9]，这与道路附近居住区的范围相吻合。在街道峡谷中减轻空气污染物影响的更有效方法是将它们引导至城市冠层，而不是利用强风稀释。这能防止污染物扩散到邻近街区并扩大暴露区域\
    \ [10–12]。这也能降低行人行走区域的浓度。\n\n以往研究主要关注街道峡谷中交通污染物的扩散及其对行人的影响 [13–18]。然而，这些研究忽略了这些污染物如何扩散到周围街区，以及如何减轻其对街道相邻外部空间（AES）内居民的影响。AES是指\n\
    \n| 术语 | 定义 |\n|---|---|\n| AES | 街道相邻的外部空间 |\n| ML | 机器学习 |\n| CFD | 计算流体动力学\
    \ |\n| GA | 遗传算法 |\n| NSGAII | II代非支配排序遗传算法 |\n| CO | 一氧化碳 |\n| BHstd | 建筑高度标准差\
    \ |\n| FAR | 容积率 |\n| Rbc | 建筑覆盖率 |\n| LHS | 拉丁超立方采样 |\n| RF | 随机森林 |\n| GB |\
    \ 梯度增强 |\n| XGB | 极端梯度增强 |\n| LGBM | 光梯度增强机 |\n| Cpod | 裙房体积内的归一化浓度 |\n| Cped\
    \ | 行人体积内的归一化浓度 |\n| AQI | 空气质量指数 |\n\n街道峡谷相邻的街区外部区域，通常是街区内相邻建筑排与第二排建筑之间的次级街道区域。这些空间拥有自身的微气候，有时与周围气候显著不同\
    \ [19]。AES通过允许更多活动在室外进行更长时间，使场所更加宜居（图1）。街区内AES较温和的微气候促进了户外空间的更多使用，而更多的室外时间则增强了人们对空间的归属感和控制感，并增加了与他人相遇的机会，从而促进社区形成。此外，封闭空间的空间清晰度有助于形成更清晰的认同感和归属感，这也可能导致该空间被更多地使用。由于这些区域常用于室外活动，因此监测其中的交通污染物浓度至关重要\
    \ [20]。\n\n城市形态（即建筑物和街道的形状与排列）是影响交通污染物扩散和浓度的一个因素。城市形态可以影响城市街区和街道峡谷中的气流模式、湍流强度和通风性能。之前的论文总结了许多街区形态参数对交通污染物扩散的影响，例如容积率（FAR）[21–23]、建筑覆盖率（Rbc）[24,25]、建筑高度\
    \ [26,27] 等。与风环境和污染物扩散模拟研究中常用的理想街区模型相比，实际街区的布局更加多样和复杂 [28]。例如，建筑高度标准差（BHstd）是表征实际街区建筑高度差异的形态指标，但在理想化街区研究中常被忽略。许多实地研究已证实，它对交通污染扩散有显著影响\
    \ [25,29]。建筑高度偏差会影响水平和垂直方向的平均流动，从而改变污染物传输的路径和速率 [30]。然而，关于该参数如何与街区建筑布局相互作用以影响污染物扩散的研究甚少。\n\
    \n以前的研究模拟了各种形态参数组合，以考察它们对风环境和社区污染物浓度的影响 [31,32]。结果分析了污染物浓度分布如何随街区布局变化，并解释了街区形态如何影响污染物扩散\
    \ [15,24]。然而，通过交叉组合多个形态参数很难全面涵盖多样的社区形式 [33]。同一个形态指标可以对应多种街区配置。因此，探讨和优化哪种布局更有利于降低街区内交通污染物浓度是有价值的。\n\
    \n优化算法是通过最小化或最大化衡量解决方案质量的函数来寻找问题最佳解的方法。复杂的城市街区模型可以通过优化算法多次迭代，以产生符合预期的更好设计结果 [34–37]。优化算法通常包含三个要素：决策变量、约束条件和目标函数。优化目标的选择需要谨慎考虑。它可以是单目标或多目标，并可以关注全局或局部层面。这些选择可能导致不同的优化结果\
    \ [38–40]。\n\n在传统的城市街区环境优化问题中，研究者受限于模拟数据获取的耗时性 [41]。因此，优化迭代次数仍然有限，解空间难以进行全局搜索\
    \ [42,43]。为了克服这一挑战，代理模型替代了耗时或难以获取的计算流体动力学（CFD）模拟数据。代理模型是对难以轻易测量或计算的感兴趣结果的近似数学模型。代理模型可以帮助降低涉及昂贵或复杂模拟的优化问题的计算成本和复杂性\
    \ [44]。应用于CFD的代理模型包括响应面法 [45]、克里金法 [34]、多项式回归 [40] 和机器学习 [46–49]。机器学习（ML）是人工智能的一个分支，使计算机能够从数据中学习并在无需显式编程的情况下提高性能。ML可以通过加速计算、提高精度、降低复杂性以及实现新应用来增强CFD\
    \ [50]。基于ML模型的优化算法可以大大提高计算效率，并能更详细地探索解集空间。\n\n本研究旨在填补关于交通污染物对AES居民影响方面的文献空白。尽管AES比其他区域更容易暴露于污染物，但它常常被忽略。本研究还考察了街区形态（尤其是BHstd）和街区布局如何影响不同区域的污染物扩散。BHstd是一个以前模拟研究中常被忽略的重要形态参数。为实现这一目标，本研究利用ML创建街区污染物浓度的回归模型作为CFD的代理模型。接着，它将ML模型与优化算法相结合，以探索能够降低AES中污染物浓度的最优街区设计策略。本文结构如下：第2章概述了本研究的研究框架；第3章描述了本研究中使用的案例条件、CFD、ML和优化设置；第4章和第5章展示并讨论了本研究的主要发现；第6章总结了本文并提出一些启示。\n\
    \n![](img/3dfc16e89d69a1b97a2f485b1851c7d6_1_0.png)\n\n图1. 居民在街区内进行户外活动 [19]。\n\
