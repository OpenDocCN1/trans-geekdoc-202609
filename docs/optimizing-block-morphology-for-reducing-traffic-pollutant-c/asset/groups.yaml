    ### 图 16. 优化街区配置与对照组的污染物扩散。


    然而，这也导致污染物在街道内部向街区内部的后续扩散，以及 AES 中行人高度（z = 1.5 m）处污染物浓度的增加（图 15b）。这说明仅依靠街区平面布局来缓解交通污染物对
    AES 的影响是不切实际的。在优化街区平面布局时，需要考虑建筑高度的变化。


    图 15a 显示，靠近街道的高层建筑形成了强烈的峡谷效应 [75]，街道内的风速大幅增加。与对照组 A 和 B 相比，AES 的风速也显著增加。然而，这两种情况下的风速增加并未导致污染物向街区内部的加速扩散（图
    15b）。这是因为面向街道的高层建筑在背风侧形成了与主导风向相反的气流，并随流体阻止污染物进一步进入街区。S4 与 M2 的比较分析表明，案例 S4 的 AES
    区域污染程度高于 M2，但 M2 街区内部的静风区相对更大，可能导致行人活动不舒适。原因可能是 M2 街道侧的 E 排全部被建筑占据，使得洁净空气难以穿过建筑间隙流通。先前的研究还表明，BHstd
    可能会显著增强较高建筑产生的阻力并增加动量通量，同时通过平均流减少污染物稀释能力，但增强城市区域内的湍流特性 [30,76]。由于平均流和湍流扩散都有助于城市区域的污染物去除，因此
    BHstd 可能会削弱或增强通风能力。


    如图 16a 所示，当 BHstd = 0 时，街道中的污染物可以越过建筑屋顶翻滚进入街区（对照组 A），或穿过街区迎风面第一排建筑间隙进入街区（对照组 B）。当
    BHstd > 34 m 且迎风建筑为一排高层建筑时，由于建筑迎风面形成了巨大的涡流，污染物难以进入街区。与对照组 A 和 B 相比，两个优化案例中的污染物并未在街道峡谷内积聚，而是随横向
    3D 涡流扩散到目标街区的两侧。优化案例的结果表明，污染物通过 E–2 和 E–3 建筑之间的间隙进入街区。由于 E–3 建筑较低，污染物可以从屋顶翻滚进入
    AES。当单目标优化侧重于 Cped,Block 时，街区构建保护 AES 免受污染物积聚，但忽略了污染物进一步向街区内部扩散。与 S4 相比，M2 的 E
    排占据了更多的建筑。可以推测，这是因为该多目标优化过程中对全局和局部指标有更全面的关注。


    本文中对 BHstd 的讨论仍基于与街道峡谷垂直的风向。然而，一些文献表明，大角度环境风向（例如 30° 和 45°）会增加建筑阻力，并比小角度将更多动能转化为湍动能。因此，大角度通常会降低
    3D 城市型几何中的污染物扩散能力 [77]。当占主导的风向与街道峡谷的夹角时，能够减轻污染物对 AES 影响的街区形式值得在未来工作中探讨。同时，调整数据集大小并调参以更好地与优化算法耦合，可以进一步提高
    ML 模型对污染物浓度的预测精度。城市设计中的其他因素也可以加入优化目标以供未来工作讨论，例如采光和热舒适度，以得出哪种街区形式更有利于居民活动。


    ## 6. 结论


    本文对不同 BHstd 和布局的大量街区配置案例进行了采样和 CFD 模拟，以获得与街区形式和交通空气污染物扩散相关的数据集。基于 ML 方法，该数据集生成了用于污染物浓度预测的代理模型。通过
    ML 模型与优化算法的结合，本研究总结了降低 AES 和街区污染物浓度的各种形态策略。本文的主要结论如下。


    对在此区域进行户外活动的人群来说，与交通相关的空气污染物。


    - 街区内建筑高度标准差（BHstd）高于 33 m 可有效降低 AES 中的污染物浓度。优化结果表明，将高层建筑布置在污染源相邻区域并使低层建筑后退，是减少污染物向街区扩散的合理策略。与建筑高度均质化布局相比，该策略可将
    AES 区域的污染物浓度降低至少 48%，街区污染物降低 86%。


    - 街道上的 40–60 m 建筑高度可防止污染物进入街区。街区内下风侧建筑越高，越容易导致污染物积聚。因此，建筑高度应控制在 60 m 以下。建筑高度对
    AES 区域平均污染物浓度的影响大于街区。当关注 AES 区域的污染物浓度水平时，仍有必要审视整个街区的建筑配置。


    - 无论优化目标侧重于全局还是局部指标，都可能导致不同的优化策略。在街区污染物扩散问题研究中，关注区域的变化可能导致结论的差异。


    - ML 可将 CFD 模拟加速至少 800 倍。采用本研究中 CFD、ML 和优化算法的工作流，可以高效解决城市设计中的多因素、多变量决策问题，这可以为城市规划师和建筑师提供一些参考。


