    ## 5. Discussion


    ### 5.1. AQI distributions of the sampling blocks


    After simulating CFD for 1000 samples, the AQI was calculated for each probe in
    the blocks. The probes with exceeded AQI were linked to form areas with different
    contamination levels. The pollution areas for each sampling case are superimposed
    to form a map of the extent and frequency of blocks affected by traffic-related
    air pollution (Fig. 12). Each color represents the extent of pollution, and the
    transparency of the color represents the frequency of possible contamination.
    The horizontal distribution of AQI shows that as the distance to the traffic pollution
    source increases, the intensity and frequency of exposure to pollution decrease.
    Half of the block would be exposed to lightly polluted and parts of the AES would
    be moderately polluted (Fig. 12a). Heavy and severe pollution hardly entered the
    inner part of the block and was distributed along the street canyon. Analysis
    of the vertical distribution of AQI reveals that lightly and moderately polluted
    areas occupy almost the entire height of the podium. In contrast, heavy pollution
    is distributed below the middle of the podium height, and severe pollution is
    distributed at the bottom. Fig. 12b illustrates the vulnerability of pedestrians
    at the edges of the block adjacent to dense traffic to severe and heavy pollution.
    Residents who are active outdoors and live below the fifth floor in the AES are
    also vulnerable to moderate and light pollution.


    ![](img/3dfc16e89d69a1b97a2f485b1851c7d6_11_0.png)


    ![](img/3dfc16e89d69a1b97a2f485b1851c7d6_11_1.png)


    ![](img/3dfc16e89d69a1b97a2f485b1851c7d6_11_2.png)


    Fig. 13. Partial dependence diagram of BH_std and building height at each site.


    The distribution of AQI in the sampling cases shows that AES is vulnerable to
    light and moderate pollution. Although pollutant concentrations within the AES
    are lower than along the street canyon area, the AES is also an area where residents
    often engage in outdoor activities in the neighborhood [72]. Prolonged outdoor
    activities in light and moderate pollution areas still pose a greater risk of
    exposure to traffic-related air pollutants for residents. Long-term exposure to
    lightly polluted areas may irritate healthy people, so it is recommended that
    children, the elderly, and people with heart and respiratory diseases should reduce
    prolonged, high-intensity outdoor exercise [61]. Therefore, more attention needs
    to be paid to the air environment in the AES, and design strategies that can improve
    the air quality in the area need to be proposed.


    ### 5.2. Effect of block configurations on pollutant concentrations


    The ML models can be applied to generate partial dependence plots to examine the
    nonlinear effects of individual variables on pollutant concentrations. Partial
    dependence plots (PDPs) are popular for interpreting ML models. They show how
    the target prediction changes when a feature varies while considering the average
    effect of all other features [73]. The relationships between BH_std and the four
    regional pollutant concentration indicators were analyzed separately. It was found
    that the effects of BH_std on the global and local indicators were not the same
    (Fig. 13a). Consistent with the results in Section 1 of Chapter 4, BH_std is almost
    linearly related to the global metrics, Cpod_Block and Cped_Block. The larger
    the BH_std, the lower the average pollutant concentration in the block. This indicates
    that the degree of staggered building heights within the block positively affects
    reducing pollutant concentrations [30,74]. However, it is also mentioned in many
    empirical studies that BH_std does not have a single linear relationship with
    pollutant concentration [25,28]. There is also literature suggesting that the
    range of positive effects of BH_std needs to be discussed [54]. In this study,
    BH_std below 25 m instead leads to an increase in pollutant concentration for
    local metrics. Only when the BH_std exceeds 25 m does the pollutant concentration
    decrease with increasing it (Fig. 13a). This illustrates that the mitigation of
    traffic pollutant concentration impacts in the AES region does not rely on increasing
    BH_std alone. There is spatial heterogeneity in the effect of BH_std on pollutant
    concentrations.


    The reason for the difference in the impact mechanism of BH_std in global and
    local metrics can be analyzed by the relationship between building height and
    pollutant concentration at various sites within the block. Figs. 13b and 13c show
    how the building heights at different locations within the block affect Cpod_Block
    and Cped_AES, respectively. Overall, the building heights have less effect on
    Cpod_Block than on Cped_AES. The effect of building height on pollutant concentrations
    in these two areas diminishes as the location is deeper into the neighborhood.
    In particular, the regression curves of building heights in row C with Cpod_Block
    converge to a horizontal line. This suggests that a block-wide building configuration
    still needs to be examined when focusing on pollutant concentrations in the AES
    area. The effect trend of buildings in rows A and B is not the same, but the increase
    in height led to a slight rise in Cpod_Block. C-row buildings had little effect
    on Cpod_Block but a more significant positive correlation with Cped_AES. Buildings
    in rows A, B, and C positively correlate with Cped_AES. An increase in building
    height leads to significant growth in Cped_AES, especially when the building height
    in the area is greater than 66 m. It can be observed that the building heights
    in rows E and D are negatively correlated with the pollutant concentrations in
    both regions. The effect trend of building height in row E on the global and local
    indicators is also very consistent. Both pollutant concentration indicators remain
    constant at a high value, then drop sharply with the increase in building height
    until a critical point, and remain constant. The only difference may be the location
    where these two inflection points occur. The range of row E building heights that
    cause a rapid decrease in Cpod_Block is between 40 and 60 m, while the range of
    intervals that cause a decrease in Cped_AES is slightly more extensive, between
    33 and 66 m. This illustrates that a certain height (at least 33 m) of street-facing
    buildings is required to serve as a barrier to the traffic-related air pollutants
    from the street canyon into the block. The discrepancy in the effect of building
    heights at different sites on pollutant concentrations explains the trade-off
    between the global and local concentration indicators. This also explains why
    optimizing these two pollutant concentration metrics results in Pareto front solutions.
    In general, the higher the building height near the street canyon and the lower
    the building height inside the block, the better it is for preventing pollutants
    from entering the block.


