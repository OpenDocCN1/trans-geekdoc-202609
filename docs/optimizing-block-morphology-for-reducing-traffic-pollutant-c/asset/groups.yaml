    goal in the single-objective optimization problem is C_pod,AES, a local metric.
    The multi-objective optimization problem’s objectives are the pollutant concentration
    in four regions containing global and local indicators.


    This study employed two optimization algorithms, Genetic Algorithm (GA) for single-objective
    optimization and non-dominated sorting genetic algorithm II (NSGA II) for multi-objective
    optimization (Table 4). The GA algorithm used a population size of 50. If the
    goal value did not decrease within 20 generations, it was considered to have converged.
    The maintenance rate was 10%, and the inbreeding was 80% [71]. To ensure that
    the iterations of the other algorithms were consistent with GA, the population
    size and generations of NSGA II were limited to 50 and 100, respectively.


