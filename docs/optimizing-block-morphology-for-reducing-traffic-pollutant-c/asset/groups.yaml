    slightly more extensive, between 33 and 66 m. This illustrates that a certain
    height (at least 33 m) of street-facing buildings is required to serve as a barrier
    to the traffic-related air pollutants from the street canyon into the block. The
    discrepancy in the effect of building heights at different sites on pollutant
    concentrations explains the trade-off between the global and local concentration
    indicators. This also explains why optimizing these two pollutant concentration
    metrics results in Pareto front solutions. In general, the higher the building
    height near the street canyon and the lower the building height inside the block,
    the better it is for preventing pollutants from entering the block.


