    ## 5. 讨论


    ### 5.1. 采样街区的 AQI 分布


    对 1000 个样本进行 CFD 模拟后，计算了街区中每个探测点的 AQI。将 AQI 超标的探测点连接起来，形成不同污染程度的区域。每个采样案例的污染区域叠加，形成街区受交通相关空气污染影响范围和频率的地图（图
    12）。每种颜色代表污染程度，颜色的透明度代表可能污染的频率。AQI 的水平分布显示，随着距离交通污染源的增加，污染暴露的强度和频率降低。街区一半区域将暴露于轻度污染，AES
    的部分区域将处于中度污染（图 12a）。重度和严重污染几乎未进入街区内部，而是沿街道峡谷分布。对 AQI 垂直分布的分析显示，轻度和中度污染区域占据了裙房几乎整个高度。相比之下，重度污染分布在裙房高度中部以下，严重污染分布在底部。图
    12b 说明了临近密集交通的街区边缘行人对重度和严重污染的脆弱性。在 AES 中经常在户外活动且居住在五楼以下的居民也容易受到中度和轻度污染的影响。


    ![](img/3dfc16e89d69a1b97a2f485b1851c7d6_11_0.png)


    ![](img/3dfc16e89d69a1b97a2f485b1851c7d6_11_1.png)


    ![](img/3dfc16e89d69a1b97a2f485b1851c7d6_11_2.png)


    图 13. BH_std 与各场地建筑高度的部分依赖图。


    采样案例的 AQI 分布显示，AES 易受轻度和中度污染的影响。尽管 AES 内的污染物浓度低于街道峡谷区域，但 AES 也是居民经常在户外活动的社区区域
    [72]。在轻度和中度污染区域进行长时间户外活动，仍会给居民带来更大的交通相关空气污染物暴露风险。长期暴露于轻度污染区域可能会刺激健康人群，因此建议儿童、老年人以及患有心脏和呼吸道疾病的人减少长时间、高强度的户外运动
    [61]。因此，需要更多关注 AES 的空气环境，并提出能够改善该区域空气质量的设计策略。


    ### 5.2. 街区配置对污染物浓度的影响


    ML 模型可用于生成部分依赖图，以考察单个变量对污染物浓度的非线性影响。部分依赖图（PDP）常用于解释 ML 模型。它们展示了在考虑所有其他特征平均效应的同时，当某个特征变化时目标预测如何变化
    [73]。分别分析了 BH_std 与四个区域污染物浓度指标之间的关系。研究发现，BH_std 对全局和局部指标的影响不相同（图 13a）。与第 4 章第
    1 节的结果一致，BH_std 与全局指标 Cpod_Block 和 Cped_Block 几乎呈线性关系。BH_std 越大，街区内的平均污染物浓度越低。这表明，街区内建筑高度错落程度的增加对降低污染物浓度有正面影响
    [30,74]。然而，许多实证研究也指出，BH_std 与污染物浓度之间不存在单一的线性关系 [25,28]。也有文献表明，需要讨论 BH_std 正面影响的范围
    [54]。在本研究中，BH_std 低于 25 m 反而会导致局部指标的污染物浓度增加。只有当 BH_std 超过 25 m 时，污染物浓度才随其增加而降低（图
    13a）。这说明，AES 区域交通污染物浓度影响的缓解并不仅依赖于增加 BH_std。BH_std 对污染物浓度的影响存在空间异质性。


    分析街区不同位置的建筑高度与污染物浓度之间的关系，可以解释 BH_std 在全局和局部指标中影响机制的差异。图 13b 和 13c 分别展示了街区不同位置的建筑高度如何影响
    Cpod_Block 和 Cped_AES。总体而言，建筑高度对 Cpod_Block 的影响小于对 Cped_AES 的影响。随着位置深入街区内部，建筑高度对这两个区域污染物浓度的影响逐渐减弱。特别是，C
    行建筑高度与 Cpod_Block 的回归曲线趋于水平线。这表明，在关注 AES 区域污染物浓度时，仍需审视整体街区的建筑配置。A 行和 B 行建筑的影响趋势不尽相同，但高度增加会导致
    Cpod_Block 略微上升。C 行建筑对 Cpod_Block 影响较小，但与 Cped_AES 存在更显著的正相关。A、B 和 C 行建筑与 Cped_AES
    呈正相关。建筑高度增加会导致 Cped_AES 显著增长，尤其是当该区域建筑高度大于 66 m 时。可以观察到，E 行和 D 行的建筑高度与两个区域的污染物浓度呈负相关。E
    行建筑高度对全局和局部指标的影响趋势也非常一致。两个污染物浓度指标先保持高位不变，随后随建筑高度增加而急剧下降，直至达到临界点，之后保持不变。唯一的区别可能是这两个拐点出现的位置。导致
    Cpod_Block 快速下降的 E 行建筑高度范围在 40 至 60 m 之间，而导致 Cped_AES 下降的区间范围略广，为 33 至 66 m。这说明，需要一定高度（至少
    33 m）的临街建筑作为屏障，阻挡街道峡谷中的交通相关空气污染物进入街区。不同位置建筑高度对污染物浓度影响的差异，解释了全局和局部浓度指标之间的权衡。这也解释了为什么优化这两个污染物浓度指标会产生
    Pareto 前沿解。总体而言，临街道峡谷处的建筑越高，街区内部的建筑越低，越有利于防止污染物进入街区。


