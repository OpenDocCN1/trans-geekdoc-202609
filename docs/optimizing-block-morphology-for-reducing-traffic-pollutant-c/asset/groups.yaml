    to the street canyon. However, some literature suggests that ambient wind directions
    of large angles (for example, 30 and 45) increase the drag of buildings and transfer
    more kinetic energy into turbulent kinetic energy than small angles. Therefore,
    large angles usually reduce the capacity of pollutant dispersion in 3D urban-like
    geometries [77]. Block forms that mitigate the impact of pollutants on the AES
    when the dominant wind direction of the angle with the street canyon is worth
    exploring in future work. Meanwhile, adjusting the size of the data set and tuning
    parameters to better couple with the optimization algorithm can further improve
    the prediction accuracy of ML models for pollutant concentrations. Other factors
    in urban design can also be added to the optimization objectives for discussion
    in further work, such as lighting, and thermal comfort, to conclude that a neighborhood
    form is more conducive to resident activity.


    # 6. Conclusion


    In this paper, a large number of block configuration cases with different BHstd
    and layouts were sampled and CFD simulated to obtain a dataset related to block
    form and traffic air pollutant dispersion. Based on the ML approach, this dataset
    generated surrogate models for pollutant concentration prediction. Through the
    conjugation of the ML model and optimization algorithm, various morphology strategies
    for reducing pollutant concentrations in AES and block were summarized in this
    study. The main conclusions of this paper are as follows.


    to traffic-related air pollutants for people who conduct outdoor activities in
    this area.


    +   • The standard deviation of building height (BHstd) in the block is above
    33 m can effectively reduce the concentration of pollutants in AES. Optimization
    results show that taller buildings placed in areas adjacent to pollution sources
    and lower buildings set back is a reasonable strategy to reduce the diffusion
    of pollutants into the block. This strategy can reduce at least 48% of pollutant
    concentrations in the AES area and 86% of pollutants in the block compared to
    a homogenized building height layout.

    +   • Building heights of 40-60 m on the street can prevent pollutants from entering
    the block. The taller the building in the downwind inside the block, the more
    cause pollutants accumulate. Therefore, building heights should be controlled
    below 60 m. Building height impacts the average pollutant concentration in the
    AES area more than in the block. When focusing on pollutant concentration levels
    in the AES area, it is still necessary to examine the building configuration of
    the entire block.

    +   • Whether the optimization objective focuses on a global or local index can
    lead to different optimization strategies. The variation of the area of concern
    in the study of pollutant dispersion problems in the block can lead to distinctions
    in conclusions.

    +   • ML can speed up the CFD simulation by at least 800 times. Using the workflow
    of CFD, ML, and optimization algorithms in this study, the multi-factor and multivariate
    decision problems in urban design can be solved efficiently, which can provide
    some references for urban planners and architects.


