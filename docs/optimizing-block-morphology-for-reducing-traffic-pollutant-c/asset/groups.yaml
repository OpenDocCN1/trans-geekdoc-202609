    # 3.6. Settings for optimization solvers


    Table 4 lists the optimization parameters as BH_std and building locations. The
    optimization goal is to minimize the concentration of pollutants. The optimization
    goal in the single-objective optimization problem is C_pod,AES, a local metric.
    The multi-objective optimization problem’s objectives are the pollutant concentration
    in four regions containing global and local indicators.


    This study employed two optimization algorithms, Genetic Algorithm (GA) for single-objective
    optimization and non-dominated sorting genetic algorithm II (NSGA II) for multi-objective
    optimization (Table 4). The GA algorithm used a population size of 50. If the
    goal value did not decrease within 20 generations, it was considered to have converged.
    The maintenance rate was 10%, and the inbreeding was 80% [71]. To ensure that
    the iterations of the other algorithms were consistent with GA, the population
    size and generations of NSGA II were limited to 50 and 100, respectively.


    # 4. Result


    # 4.1. CFD simulations results of sampling blocks


    The simulation results for 1000 sample conditions indicate that global concentration
    metrics are lower than local concentration metrics. The average pollutant concentration
    in the podium volume is lower than in the pedestrian volume. C_pod,Block is significantly
    lower than C_pe-AES. Essentially the normalized average concentrations of all
    samples in the AES area were 1.5–2.5 times higher than in the block. Analysis
    of the correlation between the four pollutant concentrations of 1000 cases with
    the BH_std and layout parameters revealed that the linear coefficient between
    the BH_std and the global index was relatively high, while the correlation with
    the local index was low (Fig. 7). The correlation coefficient between BH_std and
    C_pod,Block is -0.64, indicating that BH_std has a significant negative correlation
    with the global pollutant concentration. The row of buildings close to the source
    of pollution - row E - all showed a negative correlation between building height
    and pollutant concentrations. The closer the building is to the downwind direction
    inside the block, the more positive the correlation between height and pollutant
    concentration. However, linear correlation coefficients between building heights
    in blocks and pollutant concentrations in all areas are not high. It can be assumed
    that building heights and layouts are not simply linearly related to the distribution
    of pollutant concentrations.


