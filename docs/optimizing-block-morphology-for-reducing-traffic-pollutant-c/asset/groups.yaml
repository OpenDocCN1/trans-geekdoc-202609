    减少了 51% 以上，C_ped-AES 减少了 86%。多目标优化的帕累托解均通过 CFD 进行了模拟，并从模拟得到的较低污染物浓度值的五个案例中在图 14
    中选取了结果。与图 11b 对比发现，通过 CFD 模拟得到的优秀解集与 ML 模型预测的结果在街区形态上并不相差太远。综合策略均将高层建筑布置在污染源相邻区域，将低层建筑布置在街区中部和后部。尽管
    ML 模型在预测极值点时存在一些误差，但仍在可接受范围内。ML 模型与优化算法相结合的框架，仍探索出了更多有效的设计策略，以降低交通污染对 AES 和街区的影响。


    利用案例 S4 和 M2 分别作为单目标和多目标优化结果的代表，探讨了街区配置对交通污染物扩散的影响机制（图 15）。与对照组 A 相比，对照组 B 在街区内部具有更高的风速，这是由于街区的
    Rbc 较低（图 15a）。


