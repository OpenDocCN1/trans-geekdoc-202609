    ### 3.5. 机器学习模型设置


    35 维输入街区布局参数及其对应的 BH_std 被用作机器学习模型的输入特征。每个案例使用四个平均浓度值作为标签。1000 个 RANS 案例被随机分为
    800 个训练案例和 200 个测试案例，大约相当于 80–20% 的分割。本文选择了四种机器学习模型——随机森林 (RF)、梯度提升 (GB)、eXtreme
    Gradient Boosting (XGB) 和 Light Gradient Boosting Machine (LGBM) —— 这些模型经过精细调整，以准确预测各区域的污染物浓度。


    随机森林 (RF) 回归模型是一种在训练期间构建多个决策树并输出各棵树平均预测的学习方法 [67]。梯度提升 (GB) 是一种用于回归和分类问题的机器学习技术，它生成一组弱预测模型，通常是决策树
    [68]。eXtreme Gradient Boosting (XGB) 是一种集成方法，用于训练拟合先前树残差的小深度树。每棵加入树的权重由学习率超参数控制
    [69]。Light Gradient Boosting Machine (LGBM) 是一种使用梯度提升创建弱预测模型集成（通常是决策树）的机器学习算法，用于回归任务。它以其处理大型数据集和高维特征的速度和效率而闻名
    [70]。


    在本研究中，四种回归模型在 FLAML 中同时进行了训练、调优和比较。表 3 列出了每种机器学习方法所探索的参数范围及所使用的最优参数。每种机器学习模型允许的超参数调优最大时间为
    300 秒，每个模型均在该时间内满足收敛准则。这些估计器根据四个区域分别进行了四次训练和调优。然后从中选择一个最优模型作为该区域对应的平均污染物浓度预测模型。这种用于预测模型构建的子区域方法可以突出街区空间效应对污染物浓度的异质性，并提高模型预测精度
    [47]。


    为评估这些机器学习模型，分别分析了测试案例上的均方根误差 (RMSE) 和测试案例的平均 R<sup>2</sup> 值，对应公式 (12) 和 (13)：


    \(RMSE = \sqrt{\frac{1}{n} \sum_{i=1}^{n} (c_i - \widehat{c}_i)^2}\) (12)


    \(R^2 = 1 - \frac{\sum (\widehat{c}_i - c_i)^2}{\sum (\overline{c_i} - c_i)^2}\)
    (13)


    其中，\(\widehat{c}_i\) 是预测浓度，\(c_i\) 是仿真得到的浓度，\(\overline{c_i}\) 是测试案例上的平均浓度。


