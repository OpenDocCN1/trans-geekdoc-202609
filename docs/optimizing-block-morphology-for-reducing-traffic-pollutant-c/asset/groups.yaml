    # 3.5. Settings for ML model


    The 35-dimensional input block layout parameter and the corresponding BH_std were
    used as input features for the ML model. Four average concentration values were
    used as labels for each case. The 1000 RANS cases were randomly split into 800
    training and 200 test cases, roughly equivalent to an 80–20% split. This paper
    selected four machine learning models - Random Forest (RF), Gradient Boost (GB),
    eXtreme Gradient Boosting (XGB), and Light Gradient Boosting Machine (LGBM) –
    which were fine-tuned to predict pollutant concentrations in each region accurately.


    The Random Forest (RF) regression model is a learning method that constructs multiple
    decision trees during training and outputs the mean prediction of the individual
    trees [67]. Gradient Boosting (GB) is a machine learning technique for regression
    and classification problems that produces an ensemble of weak prediction models,
    typically decision trees [68]. Extreme Gradient Boosting (XGB) is an ensemble
    method that trains small-depth trees fitted to the residuals of prior trees. The
    weight of each added tree is controlled by the learning rate hyperparameter [69].
    Light Gradient Boosting Machine (LGBM) is a machine learning algorithm that uses
    gradient boosting to create an ensemble of weak prediction models, typically decision
    trees, for regression tasks. It is known for its speed and efficiency in handling
    large datasets and high-dimensional features [70].


    In this study, four regression models were simultaneously trained, tuned, and
    compared in FLAML. Table 3 lists the parameter range explored along with the optimal
    parameters used for each machine learning method. The maximum time allowed for
    hyperparameter tuning of each machine learning model was 300 s, and each model
    met the convergence criterion within that time. These estimators were trained
    and tuned four times according to the four regions. Then one optimal model was
    selected from them as the corresponding average pollutant concentration prediction
    model for that region. Such a sub-region approach to prediction model construction
    can highlight the heterogeneity of block spatial effects on pollutant concentrations
    and improve model prediction accuracy [47].


    To assess these ML models, the root mean square error (RMSE) on the testing cases
    and the average R<sup>2</sup> values of the testing cases were analyzed, respectively
    Eqs. (12) and (13):


    \(RMSE = \sqrt{\frac{1}{n} \sum_{i=1}^{n} (c_i - \widehat{c}_i)^2}\) (12)


    \(R^2 = 1 - \frac{\sum (\widehat{c}_i - c_i)^2}{\sum (\overline{c_i} - c_i)^2}\)
    (13)


    where \(\widehat{c}_i\) is the predicted concentration, \(c_i\) is the concentration
    obtained from simulations, and \(\overline{c_i}\) is the average concentration
    over the testing case.


