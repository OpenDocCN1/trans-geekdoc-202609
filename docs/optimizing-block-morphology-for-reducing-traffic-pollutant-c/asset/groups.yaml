    ### 4.3. Results of optimizations


    Both the single-objective and multi-objective optimizations converged within 100
    iterations (Fig. 9). The optimal result for the single-objective optimization
    has a Cped_AES of 0.080, while the multi-objective optimization has a lower result
    with a Cped_AES of 0.035, and all three concentration values in the other regions
    are between 0.03 and 0.05. Whether single or multi-objective, the optimization
    framework incorporating ML surrogate models generated block configurations with
    lower polluting concentrations than the 1000 sampling cases. The traditional CFD
    simulation optimization process would take more than two months to meet such a
    large number of iterations. In contrast, the optimization process incorporating
    the ML surrogate model takes only 3 h to accomplish this requirement (Table 6).


