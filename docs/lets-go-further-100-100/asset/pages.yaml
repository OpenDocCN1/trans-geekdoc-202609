- pgno: 558
  md: '# # HTTP basic authentication


    Perhaps the simplest way to determine *who is making a request* to your API is
    to use HTTP basic authentication.


    With this method, the client includes an `Authorization` header with every request
    containing their credentials. The credentials need to be in the format `username:password`
    and base-64 encoded. So, for example, to authenticate as `alice@example.com:pa55word`
    the client would send the following header:


    ```

    Authorization: Basic YWxpY2VAZXhhbXBsZS5jb206cGE1NXdvcmQ=

    ```


    In your API, you can then extract the credentials from this header using Go''s
    `Request.BasicAuth()` method, and verify that they’re correct before continuing
    to process the request.


    A big plus of HTTP basic authentication is how simple it is for clients. They
    can just send the same header with every request — and HTTP basic authentication
    is supported out-of-the-box by most programming languages, web browsers, and tools
    such as `curl` and `wget`.


    It’s often useful in the scenario where your API doesn’t have ‘real’ user accounts,
    but you want a quick and easy way to restrict access to it or protect it from
    prying eyes.'
  merge: -1
  img_proc: true
- pgno: 559
  md: "For APIs with ‘real’ user accounts and — in particular — hashed passwords,\
    \ it’s not such a great fit. Comparing the password provided by a client against\
    \ a (slow) hashed password is a deliberately costly operation, and when using\
    \ HTTP basic authentication you need to do that check for every request. That\
    \ will create a lot of extra work for your API server and add significant latency\
    \ to responses.\n\nBut even then, basic authentication can still be a good choice\
    \ if traffic to your API is very low and response speed is not important to you.\n\
    \n# Token authentication\n\nThe high-level idea behind *token authentication*\
    \ (also sometimes known as *bearer token authentication*) works like this:\n\n\
    +   1. The client sends a request to your API containing their credentials (typically\
    \ username or email address, and password).\n+   \n+   2. The API verifies that\
    \ the credentials are correct, generates a *bearer token* which represents the\
    \ user, and sends it back to the user. The token expires after a set period of\
    \ time, after which the user will need to resubmit their credentials again to\
    \ get a new token.\n+   \n+   3. For subsequent requests to the API, the client\
    \ includes the token in an `Authorization` header like this:"
