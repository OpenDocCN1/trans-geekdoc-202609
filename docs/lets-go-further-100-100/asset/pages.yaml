  md: 'which means there’s no opportunity to set HTTP response headers conditionally
    based on whether the `Encode()` method returns an error or not.


    Imagine, for example, that you want to set a `Cache-Control` header on a successful
    response, but not set a `Cache-Control` header if the JSON encoding fails and
    you have to return an error response.


    Implementing that cleanly while using the `json.Encoder` pattern is quite difficult.


    You could set the `Cache-Control` header and then delete it from the header map
    again in the event of an error — but that’s pretty hacky.


    Another option is to write the JSON to an interim `bytes.Buffer` instead of directly
    to the `http.ResponseWriter`. You can then check for any errors, before setting
    the `Cache-Control` header and copying the JSON from the `bytes.Buffer` to `http.ResponseWriter`.
    But once you start doing that, it’s simpler and cleaner (as well as slightly faster)
    to use the alternative `json.Marshal()` approach instead.


