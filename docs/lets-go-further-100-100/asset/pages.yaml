- pgno: 593
  md: '# Requiring User Activation


    As we mentioned a moment ago, the first thing we’re going to do in terms of authorization
    is restrict access to our `/v1/movies**` endpoints — so that they can only be
    accessed by users who are authenticated (not anonymous), and who have activated
    their account.


    Carrying out these kinds of checks is an ideal task for some middleware, so let’s
    jump in and make a new `requireActivatedUser()` middleware method to handle this.
    In this middleware, we want to extract the `User` struct from the request context
    and then check the `IsAnonymous()` method and `Activated` field to determine whether
    the request should continue or not.


    Specifically:


    +   - If the user is anonymous we should send a `401 Unauthorized` response and
    an error message saying “`you must be authenticated to access this resource`”.

    +   - If the user is not anonymous (i.e. they have authenticated successfully
    and we know who they are), but they are not *activated* we should send a `403
    Forbidden` response and an error message saying “`your user account must be activated
    to access this resource`”.'
  merge: -1
  img_proc: true
