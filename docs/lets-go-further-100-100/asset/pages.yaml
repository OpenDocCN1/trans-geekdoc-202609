  md: 'you cannot register a route like `GET /foo/new` *and* another route with a
    parameter segment that conflicts with it — like `GET /foo/:id`.


    If you’re using a standard REST structure for your API endpoints — like we will
    be in this book — then this restriction is unlikely to cause you many problems.


    In fact, it’s arguably a positive thing. Because conflicting routes aren’t allowed,
    there are no routing-priority rules that you need to worry about, and it reduces
    the risk of bugs and unintended behavior in your application.


    But if you do need to support conflicting routes (for example, you might need
    to replicate the endpoints of an existing API exactly for backwards-compatibility),
    then I would recommend taking a look at `pat`, `chi` or Gorilla `mux` instead.
    All of these are good routers which *do* permit conflicting routes.


    # Customizing httprouter behavior


    The `httprouter` package provides a few configuration options that you can use
    to customize the behavior of your application further, including enabling *trailing
    slash redirects* and enabling *automatic URL path cleaning*.


    More information about the available settings can be found [here](here).'
