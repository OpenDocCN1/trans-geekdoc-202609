  md: "now easy for us to identify exactly what code a particular binary contains\
    \ — all we need to do is run the binary with the `-version` flag and then cross-reference\
    \ it against the Git repository history.\n\n# Using Git tags\n\nIn some projects\
    \ you may want to annotate certain Git commits with tags, often to denote a formal\
    \ release number.\n\nTo illustrate this, let’s add the `v1.0.0` tag to our latest\
    \ commit like so:\n\n```\n$ git tag v1.0.0\n$ git log\ncommit 76c976a07d0fce3d813f3a4748574f81b1e24226\
    \ (HEAD -> master, tag: v1.0.0)\nAuthor: Alex Edwards <alex@alexedwards.net>\n\
    Date:   Sun Apr 18 18:39:17 2021 +0200\n\n    Generate version number automatically\n\
    \n...\n```\n\nIf you’re tagging your commits in this way, then it’s a good idea\
    \ to use the `--tags` and `--long` flags when calling `git describe` to generate\
    \ the version number for your application. This will force the output to be in\
    \ the following format:\n\n```\n{tag}-{number of additional commits}-g{abbreviated\
    \ commit hash}\n```"
