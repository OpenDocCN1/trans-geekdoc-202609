    ^C{"level":"INFO","time":"2021-04-11T10:42:29Z","message":"caught signal","properties":{"signal":"interrupt"}}

    ```


    You can also restart the application and try sending a `SIGTERM` signal. This
    time the log entry properties should contain `"signal":"terminated"`, like so:'
