  md: 'Chapter 9.


    # Filtering, Sorting, and Pagination


    In this section of the book we’re going to focus on building up the functionality
    for a new GET /v1/movies endpoint, which will return the details of multiple movies
    in a JSON array.


    | Method | URL Pattern | Handler | Action |

    |---|---|---|---|

    | GET | /v1/healthcheck | healthcheckHandler | Show application information |

    | GET | /v1/movies | listMoviesHandler | Show the details of all movies |

    | POST | /v1/movies | createMovieHandler | Create a new movie |

    | GET | /v1/movies/:id | showMovieHandler | Show the details of a specific movie
    |

    | PATCH | /v1/movies/:id | updateMovieHandler | Update the details of a specific
    movie |

    | DELETE | /v1/movies/:id | deleteMovieHandler | Delete a specific movie |


    We’ll develop the functionality for this endpoint incrementally, starting out
    by returning data for all movies and then gradually making it more useful and
    usable by adding filtering, sorting, and pagination functionality.'
