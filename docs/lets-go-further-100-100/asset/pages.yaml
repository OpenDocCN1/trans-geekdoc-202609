- pgno: 500
  md: "```\n// The background() helper accepts an arbitrary function as a parameter.\n\
    func (app *application) background(fn func()) {\n    // Launch a background goroutine.\n\
    \    go func() {\n        // Recover any panic.\n        defer func() {\n    \
    \        if err := recover(); err != nil {\n                app.logger.PrintError(fmt.Errorf(\"\
    %s\", err), nil)\n            }\n        }()\n        // Execute the arbitrary\
    \ function that we passed as the parameter.\n        fn()\n    }()\n}\n```\n\n\
    This background() helper leverages the fact that Go has first-class functions,\
    \ which means that functions can be *assigned to variables* and *passed as parameters*\
    \ to other functions.\n\nIn this case, we’ve set up the background() helper so\
    \ that accepts any function with the signature func() as a parameter and stores\
    \ it in the variable fn. It then spins up a background goroutine, uses a deferred\
    \ function to recover any panics and log the error, and then executes the function\
    \ itself by calling fn().\n\nNow that this is in place, let’s update our registerUserHandler\
    \ to use it like so:\n\nFile: cmd/api/users.go"
