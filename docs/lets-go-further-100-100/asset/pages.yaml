  md: "```\nFile: migrations/000005_create_tokens_table.down.sql\n\nDROP TABLE IF\
    \ EXISTS tokens;\n```\n\nLet’s quickly step through the columns in this new tokens\
    \ table and explain their purpose.\n\n+   - The `hash` column will contain a SHA-256\
    \ hash of the activation token. It’s important to emphasize that we will only\
    \ store a hash of the activation token in our database — not the activation token\
    \ itself.\n+   \n+     We want to hash the token before storing it for the same\
    \ reason that we bcrypt a user’s password — it provides an extra layer of protection\
    \ if the database is ever compromised or leaked. Because our activation token\
    \ is going to be a high-entropy random string (128 bits) — rather than something\
    \ low entropy like a typical user password — it is sufficient to use a fast algorithm\
    \ like SHA-256 to create the hash, instead of a slow algorithm like bcrypt.\n\
    +   - The `user_id` column will contain the ID of the user associated with the\
    \ token. We use the `REFERENCES user` syntax to create a foreign key constraint\
    \ against the primary key of our `users` table, which ensures that any value in\
    \ the `user_id` column has a corresponding `id` entry in our `users` table."
