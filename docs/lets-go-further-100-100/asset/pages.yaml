  md: "# Executing the Shutdown\n\nIntercepting the signals is all well and good,\
    \ but it’s not very useful until we do something with them! In this chapter, we’re\
    \ going to update our application so that the `SIGINT` and `SIGTERM` signals we\
    \ intercept trigger a graceful shutdown of our API.\n\nSpecifically, after receiving\
    \ one of these signals we will call the `Shutdown()` method on our HTTP server.\
    \ The official documentation describes this as follows:\n\n> > *Shutdown gracefully\
    \ shuts down the server without interrupting any active connections. Shutdown\
    \ works by first closing all open listeners, then closing all idle connections,\
    \ and then waiting indefinitely for connections to return to idle and then shut\
    \ down.*\n\nThe pattern to implement this in practice is difficult to describe\
    \ with words, so let’s jump into the code and talk through the details as we go\
    \ along.\n\n```\nFile: cmd/api/server.go\n\n```go\npackage main\n\nimport (\n\
    \    \"context\" // New import\n)\n```\n```"
  merge: -1
  img_proc: true
- pgno: 431
  md: "```\n\"errors\" // New import\n\"fmt\"\n\"net/http\"\n\"os\"\n\"os/signal\"\
    \n\"syscall\"\n\"time\"\n)\n\nfunc (app *application) serve() error {\n    srv\
    \ := &http.Server{\n        Addr:         fmt.Sprintf(\":%d\", app.config.port),\n\
    \        Handler:      app.routes(),\n        IdleTimeout:  time.Minute,\n   \
    \     ReadTimeout:  10 * time.Second,\n        WriteTimeout: 30 * time.Second,\n\
    \    }\n\n    // Create a shutdownError channel. We will use this to receive any\
    \ errors returned\n    // by the graceful Shutdown() function.\n    shutdownError\
    \ := make(chan error)\n\n    go func() {\n        // Intercept the signals, as\
    \ before.\n        quit := make(chan os.Signal, 1)\n        signal.Notify(quit,\
    \ syscall.SIGINT, syscall.SIGTERM)\n        s := <-quit\n\n        // Update the\
    \ log entry to say \"shutting down server\" instead of \"caught signal\".\n  \
    \      app.logger.PrintInfo(\"shutting down server\", map[string]string{\n   \
    \         \"signal\": s.String(),\n        })\n\n        // Create a context with\
