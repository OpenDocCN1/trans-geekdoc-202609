- pgno: 206
  md: '# Additional Information


    # Migrating to a specific version


    As an alternative to looking at the `schema_migrations` table, if you want to
    see which migration version your database is currently on you can run the `migrate`
    tool''s `version` command, like so:


    ```

    $ migrate -path=./migrations -database=$EXAMPLE_DSN version

    2

    ```


    You can also migrate up or down to a specific version by using the `goto` command:


    ```

    $ migrate -path=./migrations -database=$EXAMPLE_DSN goto 1

    ```


    # Executing down migrations


    You can use the `down` command to roll-back by a specific number of migrations.
    For example, to rollback the *most recent migration* you would run:


    ```

    $ migrate -path=./migrations -database =$EXAMPLE_DSN down 1

    ```'
