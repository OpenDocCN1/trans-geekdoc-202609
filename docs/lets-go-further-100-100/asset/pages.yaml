- pgno: 922
  md: 'would need to create a brand-new context for the background goroutine using
    `context.Background()` anyway.


    So, to summarize, using the request context as the parent context for database
    timeouts adds quite a lot of behavioral complexity and introduces nuances that
    you and anyone else working on the codebase needs to be aware of. You have to
    ask: *is it worth it?*


    For most applications, on most endpoints, it’s probably not. The exceptions are
    probably applications which frequently run close to saturation point of their
    resources, or for specific endpoints which execute slow running or very computationally
    expensive SQL queries. In those cases, canceling queries aggressively when a client
    disappears may have a meaningful positive impact and make it worth the trade-off.'
