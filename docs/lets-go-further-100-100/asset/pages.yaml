  md: '# Validating JSON Input


    In many cases, you’ll want to perform additional validation checks on the data
    from a client to make sure it meets your specific business rules before processing
    it. In this chapter we’ll illustrate how to do that in the context of a JSON API
    by updating our `createMovieHandler` to check that:


    +   - The movie title provided by the client is not empty and is not more than
    500 bytes long.

    +   - The movie year is not empty and is between 1888 and the current year.

    +   - The movie runtime is not empty and is a positive integer.

    +   - The movie has between one and five (unique) genres.


    If any of those checks fail, we want to send the client a `422 Unprocessable Entity`
    response along with error messages which clearly describe the validation failures.


