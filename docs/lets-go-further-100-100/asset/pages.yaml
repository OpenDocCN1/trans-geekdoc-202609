- pgno: 64
  md: '+   - Go `time.Time` values (which are actually a `struct` behind the scenes)
    will be encoded as a JSON string in RFC 3339 format like `"2020-11-08T06:27:59+01:00"`,
    rather than as a JSON object.

    +   - A `[]byte` slice will be encoded as a base64-encoded JSON string, rather
    than as a JSON array. So, for example, a byte slice of `[]byte{''h'',''e'',''l'',''l'',''o''}`
    would appear as `"aGVsbG8="` in the JSON output. The base64 encoding uses padding
    and the standard character set.


    A few other important things to mention:


    +   - Encoding of nested objects is supported. So, for example, if you have a
    *slice of structs* in Go that will encode to an *array of objects* in JSON.

    +   - Channels, functions and `complex` number types cannot be encoded. If you
    try to do so, you''ll get a `json.UnsupportedTypeError` error at runtime.

    +   - Any pointer values will encode as *the value pointed to*. Likewise, `interface{}`
    values will encode as the value contained in the interface.


