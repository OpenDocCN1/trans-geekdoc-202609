    The key fingerprint is:

    SHA256:/ii7Wo90BdsoaMU1UAajmd/5vBSeVmBRtf7QtoWw8YM

    greenlight@greenlight.alexedwards.net

    The key''s randomart image is:

    +-----[RSA 4096]-----+

    |     ++= .....   |

    |     = + . .   . |

    |   + o . o o .   |

    |   + . B . B o   |

    |   o o S + E * + |

    |   .   o = +   =o|

    |     o o B     ..|

    |     o.+ = .     |

    |     ..++o o     |

    +-----[SHA256]-----+

    ```


    This will generate two new files in your `$HOME/.ssh` folder:


    +   - The `$HOME/.ssh/id_rsa_greenlight` file contains your *private key*. Make
