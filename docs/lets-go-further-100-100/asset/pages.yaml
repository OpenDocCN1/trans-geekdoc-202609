    \ f Filters) {\n    // Check that the page and page_size parameters contain sensible\
    \ values.\n    v.Check(f.Page > 0, \"page\", \"must be greater than zero\")\n\
    \    v.Check(f.Page <= 10_000_000, \"page\", \"must be a maximum of 10 million\"\
