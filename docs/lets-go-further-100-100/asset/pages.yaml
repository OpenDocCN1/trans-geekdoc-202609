  md: '# Full-Text Search


    In this chapter we’re going to make our movie title filter easier to use by adapting
    it to support *partial matches*, rather than requiring a match on the full title.
    So, for example, if a client wants to find *The Breakfast Club* they will be able
    to find it with just the query string `title=breakfast`.


    There are a few different ways we could implement this feature in our codebase,
    but an effective and intuitive method (from a client point of view) is to leverage
    PostgreSQL’s *full-text search* functionality, which allows you to perform ‘natural
    language’ searches on text fields in your database.


    PostgreSQL full-text search is a powerful and highly-configurable tool, and explaining
    how it works and the available options in full could easily take up a whole book
    in itself. So we’ll keep the explanations in this chapter high-level, and focus
    on the practical implementation.


    To implement a basic full-text search on our `title` field, we’re going to update
    our SQL query to look like this:


    ```

    ```sql

    SELECT id, created_at, title, year, runtime, genres, version

    FROM movies

    WHERE (to_tsvector(''simple'', title) @@ plainto_tsquery(''simple'', $1) OR $1
    =

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 331
  md: '```

    '')

    AND (genres @> $2 OR $2 = ''{}'')

    ORDER BY id

    ```


    That looks pretty complicated at first glance, so let’s break it down and explain
    what’s going on.


    The `to_tsvector(''simple'', title)` function takes a movie title and splits it
    into *lexemes*. We specify the `simple` configuration, which means that the lexemes
    are just lowercase versions of the words in the title†. For example, the movie
    title "The Breakfast Club" would be split into the lexemes `''breakfast'' ''club''
    ''the''`.


    > † Other ‘non-simple’ configurations may apply additional rules to the lexemes,
    such as the removal of common words or applying language-specific stemming.


    The `plainto_tsquery(''simple'', $1)` function takes a search value and turns
    it into a formatted *query term* that PostgreSQL full-text search can understand.
    It normalizes the search value (again using the `simple` configuration), strips
    any special characters, and inserts the *and operator* & between the words. As
    an example, the search value "The Club" would result in the query term `''the''
    & ''club''`.


    The `@@` operator is the matches operator. In our statement we are using it to
    check whether the generated *query term matches the lexemes*. To continue the
    example, the query term `''the'' & ''club''` will match rows which contain *both*
    lexemes `''the''` and `''club''`.'
  merge: -1
  img_proc: true
