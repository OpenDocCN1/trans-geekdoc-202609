- pgno: 427
  md: 'One thing I’d like to quickly emphasize about this: our `quit` channel is a
    `buffered channel` with size 1.


    We need to use a buffered channel here because `signal.Notify()` `does not wait`
    for a receiver to be available when sending a signal to the `quit` channel. If
    we had used a regular (non-buffered) channel here instead, a signal could be ‘missed’
    if our `quit` channel is not ready to receive at the exact moment that the signal
    is sent. By using a buffered channel, we avoid this problem and ensure that we
    never miss a signal.


    OK, let’s try this out.


    First, run the application and then press `Ctrl+C` on your keyboard to send a
    `SIGINT` signal. You should see a `"caught signal"` log entry with `"signal":"interrupt"`
    in the properties, similar to this:


