    # Using a helper function\n\nIf you need to execute a lot of background tasks\
    \ in your application, it can get tedious to keep repeating the same panic recovery\
    \ code — and there’s a risk that you might forget to include it altogether.\n\n\
    To help take care of this, it’s possible to create a simple helper function which\
    \ wraps the panic recovery logic. If you’re following along, open your cmd/api/helpers.go\
    \ file and create a new background() helper method as follows:\n\n```\nFile: cmd/api/helpers.go\n\
    \npackage main\n\n...\n```"
