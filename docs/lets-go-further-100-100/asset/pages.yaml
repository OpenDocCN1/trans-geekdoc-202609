- pgno: 538
  md: '# Activating a User


    In this chapter we’re going to move on to the part of the activation workflow
    where we actually activate a user. But before we write any code, I’d like to quickly
    talk about the relationship between users and tokens in our system.


    What we have is known in relational database terms as a *one-to-many relationship*
    — where one user may have many tokens, but a token can only belong to one user.


    When you have a one-to-many relationship like this, you’ll potentially want to
    execute queries against the relationship from two different sides. In our case,
    for example, we might want to either:


    +   - Retrieve the user associated with a token.

    +   - Retrieve all tokens associated with a user.


    To implement these queries in your code, a clean and clear approach is to update
    your database models to include some additional methods like this:


    ```

    UserModel.GetForToken(token)  → Retrieve the user associated with a token

    TokenModel.GetAllForUser(user) → Retrieve all tokens associated with a user

    ```'
  merge: -1
  img_proc: true
- pgno: 539
  md: 'The nice thing about this approach is that the entities being returned align
    with the main responsibility of the models: the `UserModel` method is returning
    a user, and the `TokenModel` method is returning tokens.


    # Creating the activateUserHandler


    Now that we’ve got a very high-level idea of how we’re going to query the user
    ↔ token relationship in our database models, let’s start to build up the code
    for activating a user.


    In order to do this, we’ll need to add a new `PUT /v1/users/activated` endpoint
    to our API:


    | Method | URL Pattern | Handler | Action |

    |---|---|---|---|

    | GET | /v1/healthcheck | healthcheckHandler | Show application information |

    | GET | /v1/movies | listMoviesHandler | Show the details of all movies |

    | POST | /v1/movies | createMovieHandler | Create a new movie |

    | GET | /v1/movies/:id | showMovieHandler | Show the details of a specific movie
    |

    | PATCH | /v1/movies/:id | updateMovieHandler | Update the details of a specific
    movie |

    | DELETE | /v1/movies/:id | deleteMovieHandler | Delete a specific movie |'
