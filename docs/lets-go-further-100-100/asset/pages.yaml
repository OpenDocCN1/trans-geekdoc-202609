- pgno: 12
  md: '# Prerequisites


    # Background knowledge


    This book is written as a follow up to *Let''s Go*, and we''ll leverage a lot
    of the information and code patterns from that book again here.


    If you''ve already read and enjoyed *Let''s Go*, then this book should be a good
    fit for you and the ideal next step in your learning. If you haven''t, then I
    highly recommend starting with *Let''s Go* first — especially if you''re a newcomer
    to Go.


    You can read this as a standalone book, but please be aware that it is somewhat
    advanced — it doesn''t explain the fundamentals in detail, and some topics (like
    testing) don''t feature at all because they were covered heavily in the previous
    book. But if you''re comfortable using Go and already have a decent amount of
    experience behind you, then this book may also be a good fit for you. Feel free
    to jump straight in.


    # Go 1.16


    The information in this book is correct for the latest major release of Go (version
    1.16), and you should install this if you''d like to code-along with the application
    build.'
  merge: -1
