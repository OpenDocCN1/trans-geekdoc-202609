- pgno: 829
  md: 'following command:


    ```

    ''migrate -path ~/migrations -database $$GREENLIGHT_DB_DSN up''

    ```


    Because the $ character has a special meaning in makefiles, we are *escaping it*
    in the command above by prefixing it with an additional dollar character like
    $$. This means that the command that actually runs on our droplet will be `''migrate
    -path ~/migrations -database $GREENLIGHT_DB_DSN up''`, and in turn, the migration
    will be run *using the droplet environment variable* `GREENLIGHT_DB_DSN`.


    It’s also important to note that we’re surrounding this command with single quotes.
    If we used double quotes, it would be an *interpreted string* and we would need
    to use an additional escape character \ like so:


    ```

    "migrate -path ~/migrations -database \$$GREENLIGHT_DB_DSN up"

    ```


    Alright, let’s try this out!


    Go ahead and execute the `make production/deploy/api` rule that we just made.
    You should see that all the files copy across successfully (this may take a minute
    or two to complete depending'
