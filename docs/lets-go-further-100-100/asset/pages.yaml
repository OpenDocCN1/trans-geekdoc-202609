    In many ways, doing this would be considered good practice. Allowing context to
    ‘flow’ through your application is generally a good idea, and this approach is
    also more flexible — whatever is calling the database model can easily control
    the timeout duration rather than it always being a fixed duration set by the database
    model.


    But using the request context as the parent introduces a lot of additional complexity.


    The key thing to be aware of is that the *request context will be canceled* if
    the client closes their HTTP connection. From the `net/http` docs:


    > > For incoming server requests, the [request] context is canceled when the client’s
    connection closes, the request is canceled (with HTTP/2), or when the ServeHTTP
    method returns.


    If we use the request context as the parent, then this cancellation signal will
    bubble down to our database driver `pq` and the running SQL query will be terminated
    in exactly the same way that it is when a context timeout is reached. Importantly,
    it means we would receive the same `pq: canceling statement due to user request`
    error message that we do when a database query times out.'
