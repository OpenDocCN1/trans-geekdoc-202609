  md: "Chapter 22.4.\n\n# JSON Encoding Nuances\n\n# Nil and empty slices are encoded\
    \ differently\n\nNil slices in Go will be encoded to the null JSON value, whereas\
    \ an empty (but not nil) slice will be encoded to an empty JSON array. For example:\n\
    \n```\nvar nilSlice []string\nemptySlice := []string{}\n\nm := map[string][]string{\n\
    \    \"nilSlice\": nilSlice,\n    \"emptySlice\": emptySlice,\n}\n```\n\nWill\
    \ encode to the following JSON:\n\n```\n{\"emptySlice\":[],\"nilSlice\":null}\n\
    ```\n\n# Using omitempty on a zero-valued struct doesn’t work"
