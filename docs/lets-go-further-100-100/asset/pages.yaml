  md: '# Configuring the Database Connection Pool


    In the first *Let''s Go* book we talked through the `sql.DB` connection pool at
    a high-level and demonstrated the core principles of how to use it. But in this
    chapter we’re going to go in-depth — explaining how the connection pool works
    behind the scenes, and exploring the settings we can use to change and optimize
    its behavior.


    > **Note:** This chapter contains quite a lot of theory, and although it’s interesting,
    it’s not *critical* to the application build. If you find it too heavy-going,
    feel free to skim over it for now and then circle back to it later.


    So how *does* the `sql.DB` connection pool work?


    The most important thing to understand is that a `sql.DB` pool contains two types
    of connections — ‘in-use’ connections and ‘idle’ connections. A connection is
    marked as in-use when you are using it to perform a database task, such as executing
    a SQL statement or querying rows, and when the task is complete the connection
    is then marked as idle.


    When you instruct Go to perform a database task, it will first check if any idle
    connections are available in the pool. If one is available,'
  merge: -1
  img_proc: true
- pgno: 184
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 185
  md: 'the risk is that the *connection pool itself* will be a bottleneck in your
    application.


    But leaving it unlimited isn’t necessarily the best thing to do. By default PostgreSQL
    has a hard limit of 100 open connections and, if this hard limit is hit under
    heavy load, it will cause our `pq` driver to return a "`sorry, too many clients
    already`" error.


    > **Note:** The hard limit on open connections can be changed in your `postgresql.conf`
    file using the `max_connections` setting.


    To avoid this error, it makes sense limit the number of open connections in our
    pool to comfortably below 100 — leaving enough headroom for any other applications
    or sessions that also need to use PostgreSQL.


    The other benefit of setting a `MaxOpenConns` limit is that it acts as a very
    rudimentary throttle, and prevents the database from being swamped by a huge number
    of tasks all at once.


    But setting a limit comes with an important caveat. If the `MaxOpenConns` limit
    is reached, and all connections are in-use, then any further database tasks will
    be forced to wait until a connection becomes free and marked as idle. In the context
    of our API, the user’s HTTP request could ‘hang’ indefinitely while waiting for
    a free connection. So to mitigate this, it’s important to always set a timeout
    on database tasks using a `context.Context` object. We’ll explain how to do that
    later in the book.'
  merge: -1
  img_proc: true
