  md: '# Granting Permissions


    Our permissions model and authorization middleware are now functioning well. But
    — at the moment — when a new user registers an account they *don’t have any permissions*.
    In this chapter we’re going to change that so that new users are automatically
    *granted* the "movies:read" permission by default.


    # Updating the permissions model


    In order to grant permissions to a user we''ll need to update our `PermissionModel`
    to include an `AddForUser()` method, which adds *one or more permission codes
    for a specific user* to our database. The idea is that we will be able to use
    it in our handlers like this:


    ```

    ```

    // Add the "movies:read" and "movies:write" permissions for the user with ID =
    2.

    app.models.Permissions.AddForUser(2, "movies:read", "movies:write")

    ```

    ```


    Behind the scenes, the SQL statement that we need to insert this data looks like
    this:'
