  md: '# Creating Custom Metrics


    The default information exposed by the expvar handler is a good start, but we
    can make it even more useful by exposing some additional custom metrics in the
    JSON response.


    To illustrate this, we’ll start really simple and first expose our application
    version number in the JSON. If you don’t remember, the version number is currently
    defined as the string constant "1.0.0" in our main.go file.


    The code to do this breaks down into two basic steps: first we need to register
    a custom variable with the expvar package, and then we need to set the value for
    the variable itself. In one line, the code looks roughly like this:


    ```

    expvar.NewString("version").Set(version)

    ```


    The first part of this — expvar.NewString("version") — creates a new expvar.String
    type, then publishes it so it appears in the expvar handler’s JSON response with
    the name "version", and then returns a pointer to it. Then we use the Set() method
    on it to assign an actual value to the pointer.


