    So, putting this all together, it means that if a client doesn’t provide a title
    parameter in their query string, then value for the $1 placeholder will be the
    empty string "", and the filter condition in the SQL query will evaluate to true
    and act like it has been ‘skipped’. Likewise with the genres parameter.


    Note: PostgreSQL also provides a range of other useful array operators and functions,
    including the && ‘overlap’ operator, the'
