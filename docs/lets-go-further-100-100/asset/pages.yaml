  md: "```\n```go\nfunc (app *application) notPermittedResponse(w http.ResponseWriter,\
    \ r *http.Request) {\n    message := \"your user account doesn't have the necessary\
    \ permissions to access this resource\"\n    app.errorResponse(w, r, http.StatusForbidden,\
    \ message)\n}\n```\n```\n\nThen let’s head to our `cmd/api/middleware.go` file\
    \ and create the new `requirePermission()` middleware method.\n\nWe’re going to\
    \ set this up so that the `requirePermission()` middleware automatically wraps\
    \ our existing `requireActivatedUser()` middleware, which in turn — don’t forget\
    \ — wraps our `requireAuthenticatedUser()` middleware.\n\nThis is important —\
    \ it means that when we use the `requirePermission()` middleware we’ll actually\
    \ be carrying out *three checks* which together ensure that the request is from\
    \ an *authenticated (non-anonymous), activated user, who has a specific permission.*\n\
    \nLet’s go ahead and create this in the `cmd/api/middleware.go` file like so:\n\
    \n```\nFile: cmd/api/middleware.go\n\npackage main\n\n...\n```"
