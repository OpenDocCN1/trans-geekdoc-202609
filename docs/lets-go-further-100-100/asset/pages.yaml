  md: '# Filtering Lists


    In this chapter we’re going to start putting our query string parameters to use,
    so that clients can search for movies with a specific title or genres.


    Specifically, we’ll build a reductive filter which allows clients to search based
    on a case-insensitive exact match for movie title and/or one or more movie genres.
    For example:


    ```

    ```

    // List all movies.

    /v1/movies


    // List movies where the title is a case-insensitive exact match for ''black panther''.

    /v1/movies?title=black+panther


    // List movies where the genres includes ''adventure''.

    /v1/movies?genres=adventure


    // List movies where the title is a case-insensitive exact match for ''moana''
    AND the

    // genres include both ''animation'' AND ''adventure''.

    /v1/movies?title=moana&genres=animation,adventure

    ```

    ```


    **Note:** The + symbol in the query strings above is a URL-encoded space character.
    Alternatively you could use %20'
