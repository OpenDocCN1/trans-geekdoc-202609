- pgno: 561
  md: 'When the client sends back the token in subsequent requests, your API can look
    up the token in the database, check that it hasn''t expired, and retrieve the
    corresponding user ID to find out who the request is coming from.


    The big advantage of this is that your API maintains control over the tokens —
    it''s straightforward to revoke tokens on a per-token or per-user basis by deleting
    them from the database or marking them as expired.


    Conceptually it''s also simple and robust — the security is provided by the token
    being an ‘unguessable’, which is why it''s important to use a high-entropy cryptographically-secure
    random value for the token.


    So, what are the downsides?


    Beyond the complexity for clients that is inherent with token authentication generally,
    it''s difficult to find much to criticize about this approach. Perhaps the fact
    that it requires a database lookup is a negative — but in most cases you will
    need to make a database lookup to check the user''s activation status or retrieve
    additional information about them *anyway*.


    # Stateless token authentication


    In contrast, stateless tokens encode the user ID and expiry time *in the token
    itself*. The token is cryptographically signed to prevent tampering and (in some
    cases) encrypted to prevent the contents being read.'
  merge: -1
  img_proc: true
- pgno: 562
  md: 'There are a few different technologies that you can use to create stateless
    tokens. Encoding the information in a JWT (JSON Web Token) is probably the most
    well-known approach, but PASETO, Branca and nacl/secretbox are viable alternatives
    too. Although the implementation details of these technologies are different,
    the overarching pros and cons in terms of authentication are similar.


    The main selling point of using stateless tokens for authentication is that the
    work to encode and decode the token can be done in memory, and all the information
    required to identify the user is contained within the token itself. There’s no
    need to perform a database lookup to find out who a request is coming from.


    The primary downside of stateless tokens is that they can’t easily be revoked
    once they are issued.


    In an emergency, you could effectively revoke all tokens by changing the secret
    used for signing your tokens (forcing all users to re-authenticate), or another
    workaround is to maintain a blocklist of revoked tokens in a database (although
    that defeats the ‘stateless’ aspect of having stateless tokens).


    > **Note:** You should generally avoid storing additional information in a stateless
    token, such as a user’s activation status or permissions, and using that as the
    basis for *authorization* checks. During the lifetime of the token, the information
    encoded into it will potentially become stale and out-of-sync with the real data
    in your system — and relying on stale data'
