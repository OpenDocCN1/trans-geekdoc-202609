- pgno: 669
  md: 'header, and an `Access-Control-Request-Method` header. If any one of these
    pieces is missing, we know that it is not a preflight request.


    Once we identify that it is a preflight request, we need to send a `200 OK` response
    with some special headers to let the browser know whether or not it''s OK for
    the real request to proceed. These are:


    +   - An `Access-Control-Allow-Origin` response header, which reflects the value
    of the preflight request''s `Origin` header (just like in the previous chapter).

    +   - An `Access-Control-Allow-Methods` header listing the HTTP methods that can
    be used in real cross-origin requests to the URL.

    +   - An `Access-Control-Allow-Headers` header listing the request headers that
    can be included in real cross-origin requests to the URL.


    In our case, we could set the following response headers to allow cross-origin
    requests for *all our endpoints*:


    ```

    Access-Control-Allow-Origin: <reflected trusted origin>

    Access-Control-Allow-Methods: OPTIONS, PUT, PATCH, DELETE

    Access-Control-Allow-Headers: Authorization, Content-Type

    ```


    **Important:** When responding to a preflight request it''s not necessary to include
    the CORS-safe methods `HEAD`, `GET` or `POST` in the `Access-Control-Allow-Methods`
    header. Likewise,'
  merge: -1
  img_proc: true
- pgno: 670
  md: '> > it’s not necessary to include forbidden or CORS-safe headers in `Access-Control-Allow-Headers`.


    When the web browser receives these headers, it compares the values to the method
    and (case-insensitive) headers that it wants to use in the real request. If the
    method or any of the headers are not allowed, then the browser will block the
    real request.


    # Updating our middleware


    Let’s put this into action and update our `enableCORS()` middleware so it intercepts
    and responds to any preflight requests. Specifically, we want to:


    +   1. Set a `Vary: Access-Control-Request-Method` header on all responses, as
    the response will be different depending on whether or not this header exists
    in the request.

    +   2. Check whether the request is a preflight cross-origin request or not. If
    it’s not, then we should allow the request to proceed as normal.

    +   3. Otherwise, if it is a preflight cross-origin request, then we should add
    the `Access-Control-Allow-Method` and `Access-Control-Allow-Headers` headers as
    described above.


    Go ahead and update the `cmd/api/middleware.go` file like so:


    ```

    File: `cmd/api/middleware.go`

    ```'
