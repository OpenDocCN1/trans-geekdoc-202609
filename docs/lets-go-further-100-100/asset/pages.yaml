  md: '# Chapter 20.


    # # Building, Versioning and

    # Quality Control


    In this section of the book we’re going shift our focus from writing code to *managing
    and maintaining* our project, and take steps to help automate common tasks and
    prepare our API for deployment.


    Specifically, you’ll learn how to:


    +   - Use a makefile to automate common tasks in your project, such as creating
    and executing migrations.

    +   - Carry out quality control checks of your code using the `go vet` and `staticcheck`
    tools.

    +   - Vendor third-party packages, in case they ever become unavailable in the
    future.

    +   - Build and run executable binaries for your applications, reduce their size,
    and cross-compile binaries for different platforms.

    +   - Burn-in a version number and build time to your application when building
    the binary.

    +   - Leverage Git to generate automated version numbers as part of your build
    process.'
