  md: '# Connecting to PostgreSQL


    OK, now that our new `greenlight` database is set up, let’s look at how to connect
    to it from our Go application.


    As you probably remember from *Let’s Go*, to work with a SQL database we need
    to use a *database driver* to act as a ‘middleman’ between Go and the database
    itself. You can find a list of available drivers for PostgreSQL in the Go wiki,
    but for our project we’ll opt for the popular, reliable, and well-established
    `pq` package.


    If you’re coding-along with this book, then go ahead and use `go get` to download
    version `v1.10.0` of `pq` like so:


    ```

    $ go get github.com/lib/pq@v1.10.0

    go: downloading github.com/lib/pq v1.10.0

    go get: added github.com/lib/pq v1.10.0

    ```


    To connect to the database we’ll also need a *data source name* (DSN), which is
    basically a string that contains the necessary connection parameters. The exact
    format of the DSN will depend on which database driver you’re using (and should
    be described in the driver documentation), but when using `pq` you should be able
    to connect to your local `greenlight` database as the `greenlight` user with the
    following DSN:'
