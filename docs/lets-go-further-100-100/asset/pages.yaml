- pgno: 465
  md: '+   - The username part of an email address *may or may not* be case-sensitive
    — it depends on the email provider. Almost every major email provider treats the
    username as case-insensitive, but it is not absolutely guaranteed. All we can
    say here is that the real-life user behind the address `alice@example.com` is
    *very probably* (but not definitely) the same as `ALICE@example.com`.


    So, what does this mean for our application?


    From a security point of view, we should always store the email address using
    the exact casing provided by the user during registration, and **we should send
    them emails using that exact casing only**. If we don’t, there is a risk that
    emails could be delivered to the wrong real-life user. It’s particularly important
    to be aware of this in any workflows that use email for authentication purposes,
    such as a password-reset workflow.


    However, because `alice@example.com` and `ALICE@example.com` are *very probably*
    the same user, we should generally treat email addresses as case-insensitive for
    comparison purposes.


    In our registration workflow, using a case-insensitive comparison prevents users
    from accidentally (or intentionally) registering multiple accounts by just using
    different casing. And from a user-experience point-of-view, in workflows like
    login, activation or password resets, it’s more forgiving for users if we don’t
    require them to submit their request with exactly the same email casing that they
    used when registering.'
  merge: -1
  img_proc: true
- pgno: 466
  md: "# # User enumeration\n\nIt’s important to be aware that our registration endpoint\
    \ is vulnerable to *user enumeration*. For example, if an attacker wants to know\
    \ whether `alice@example.com` has an account with us, all they need to do is send\
    \ a request like this:\n\n```\n```bash\n$ BODY='{\"name\": \"Alice Jones\", \"\
    email\": \"alice@example.com\", \"password\": \"pa5sword\"}'\n$ curl -d \"$BODY\"\
    \ localhost:4000/v1/users\n{\n    \"error\": {\n        \"email\": \"a user with\
    \ this email address already exists\"\n    }\n}\n```\n```\n\nAnd they have the\
    \ answer right there. We’re explicitly telling the attacker that `alice@example.com`\
    \ is already a user.\n\nSo, what are the risks of leaking this information?\n\n\
    The first, most obvious, risk relates to user privacy. For services that are sensitive\
    \ or confidential you probably don’t want to make it obvious who has an account.\
    \ The second risk is that it makes it easier for an attacker to compromise a user’s\
    \ account. Once they know a user’s email address, they can potentially:\n\n+ \
    \  - Target the user with social engineering or another type of tailored attack."
  merge: -1
  img_proc: true
- pgno: 467
  md: "+   - Search for the email address in leaked password tables, and try those\
    \ same passwords on our service.\n\nPreventing enumeration attacks typically requires\
    \ two things:\n\n+   1. Making sure that the response sent to the client is always\
    \ exactly the same, irrespective of whether a user exists or not. Generally, this\
    \ means changing your response wording to be ambiguous, and notifying the user\
    \ of any problems in a side-channel (such as sending them an email to inform them\
    \ that they already have an account).\n+   \n+   2. Making sure that the *time\
    \ taken* to send the response is always the same, irrespective of whether a user\
    \ exists or not. In Go, this generally means offloading work to a background goroutine.\n\
    \nUnfortunately, these mitigations tend to increase the complexity of your application\
    \ and add friction and obscurity to your workflows. For all your regular users\
    \ who are not attackers, they’re a negative from a UX point of view. You have\
    \ to ask: *is it worth the trade-off?*\n\nThere are a few things to think about\
    \ when answering this question. How important is user privacy in your application?\
    \ How attractive (high-value) is a compromised account to an attacker? How important\
    \ is it to reduce friction in your user workflows? The answers to those questions\
    \ will vary from project-to-project, and will help form the basis for your decision.\n\
    \nIt’s worth noting that many big-name services, including Twitter, GitHub and\
    \ Amazon, don’t prevent user enumeration (at least not on their registration pages).\
    \ I’m not suggesting that this makes it OK —"
  merge: -1
  img_proc: true
- pgno: 468
  md: just that those companies have decided that the additional friction for the
    user is worse than the privacy and security risks *in their specific case*.
  merge: -1
