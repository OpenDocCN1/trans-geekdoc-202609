- pgno: 226
  md: '```

    ...

    ```


    That code is nice and succinct, but there are a few important things to mention.


    Because the `Insert()` method signature takes a `*Movie` pointer as the parameter,
    when we call `Scan()` to read in the system-generated data we’re updating the
    values *at the location the parameter points to*. Essentially, our `Insert()`
    method *mutates* the `Movie` struct that we pass to it and adds the system-generated
    values to it.


    The next thing to talk about is the placeholder parameter inputs, which we declare
    in an `args` slice like this:


    ```

    args := []interface{}{movie.Title, movie.Year, movie.Runtime,

    pq.Array(movie.Genres)}

    ```


    Storing the inputs in a slice isn’t strictly necessary, but as mentioned in the
    code comments above it’s a nice pattern that can help the clarity of your code.
    Personally, I usually do this for SQL queries with more than three placeholder
    parameters.


    Also, notice the final value in the slice? In order to store our `movie.Genres`
    value (which is a `[]string` slice) in the database, we need to pass it through
    the `pq.Array()` adapter function before executing the SQL query.'
  merge: -1
