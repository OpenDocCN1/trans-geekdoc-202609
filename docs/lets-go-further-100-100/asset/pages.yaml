- pgno: 903
  md: "It’s possible to encode a map which has integer values as the map keys. The\
    \ integers will be automatically converted to strings in the resulting JSON (because\
    \ the keys in a JSON object must always be strings). For example, the following\
    \ map:\n\n```\nm := map[int]string{\n  123: \"foo\",\n  456_000: \"bar\",\n}\n\
    ```\n\nWill encode to the JSON:\n\n```\n{\"123\":\"foo\",\"456000\":\"bar\"}\n\
    ```\n\nIn addition, map keys that implement the encoding.TextMarshaler interface\
    \ are also supported. This means that you can also use time.Time and net.IP values\
    \ as map keys out-of-the-box. For example, the following map:\n\n```\nt1 := time.Now()\n\
    t2 := t1.Add(24 * time.Hour)\n\nm := map[time.Time]string{\n  t1: \"foo\",\n \
    \ t2: \"bar\",\n}\n```"
  merge: -1
