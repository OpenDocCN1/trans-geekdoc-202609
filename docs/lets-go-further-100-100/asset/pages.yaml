- pgno: 848
  md: '# Using Caddy as a Reverse Proxy


    We’re now in the position where we have our Greenlight API application running
    as a background service on our droplet, and listening for HTTP requests on port
    4000. And we also have Caddy running as a background service and listening for
    HTTP requests on port 80.


    So the next step in setting up our production environment is to configure Caddy
    to act as a reverse proxy and forward any HTTP requests that it receives onward
    to our API.


    The simplest way to configure Caddy is to create a Caddyfile — which contains
    a series of rules describing what we want Caddy to do. If you’re following along,
    please go ahead and create a new remote/production/Caddyfile file in your project
    directory:


    ```

    $ touch remote/production/Caddyfile

    ```


    And then add the following content, making sure to replace the IP address with
    the address of your own droplet:'
  merge: -1
  img_proc: true
- pgno: 849
  md: "```\nFile: remote/production/Caddyfile\n\nhttp://45.55.49.87 {\n    reverse_proxy\
    \ localhost:4000\n}\n```\n\nAs you can probably guess by looking at it, this rule\
    \ tells Caddy that we want it to listen for HTTP requests to 45.55.49.87 and then\
    \ act a reverse proxy, forwarding the request to port 4000 on the local machine\
    \ (where our API is listening).\n\n> **Hint:** Caddyfiles have *a lot* of available\
    \ settings and we’ll demonstrate some of the more common ones as we progress through\
    \ this chapter. But if you plan on using Caddy in your own production projects,\
    \ then I recommend reading through the official Caddyfile documentation, which\
    \ is excellent.\n\nThe next thing we need to do is upload this Caddyfile to our\
    \ droplet and reload Caddy for the changes to take effect.\n\nTo manage this,\
    \ let’s update our makefile to include a new `production/configure/caddyfile`\
    \ rule. This will follow the same basic pattern that we used in the previous chapter\
    \ for uploading our `api.service` file, but instead we’ll copy our Caddyfile to\
    \ `/etc/caddy/Caddyfile` on the server.\n\nLike so:"
  merge: -1
  img_proc: true
- pgno: 850
  md: "```\nFile: Makefile\n\n#\n================================================================================\n\
    ====== #\n# PRODUCTION\n#\n================================================================================\n\
    ====== #\n\nproduction_host_ip = '45.55.49.87'\n\n...\n\n## production/configure/caddyfile:\
    \ configure the production Caddyfile\n.PHONY: production/configure/caddyfile\n\
    production/configure/caddyfile:\n    rsync -P ./remote/production/Caddyfile greenlight@${production_host_ip}:~\n\
    \    ssh -t greenlight@${production_host_ip} '\\\n        sudo mv ~/Caddyfile\
    \ /etc/caddy/ \\\n        && sudo systemctl reload caddy \\\n    '\n```\n\nOnce\
    \ you’ve made that change, go ahead and run the rule to deploy the Caddyfile into\
    \ production:\n\n```\n$ make production/configure/caddyfile\nrsync -P ./remote/production/Caddyfile\
    \ greenlight@\"45.55.49.87\":~\nsending incremental file list\nCaddyfile\n   \
    \            53 100%    0.00kB/s    0:00:00 (xfr#1, to-chk=0/1)\nssh -t greenlight@\"\
    45.55.49.87\" '\\\n```"
  merge: -1
  img_proc: true
- pgno: 851
  md: '```

