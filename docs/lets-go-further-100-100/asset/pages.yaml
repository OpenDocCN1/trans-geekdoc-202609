- pgno: 864
  md: '# Managing Password Resets


    If the API you’re building is for a public audience, it’s likely that you’ll want
    to include functionality for a user to reset their password when they forget it.


    To support this in your API, you could add the following two endpoints:


    | Method | URL Pattern | Handler | Action |

    |---|---|---|---|

    | POST | /v1/tokens/password-reset | createPasswordResetTokenHandler | Generate
    a new password reset token |

    | PUT | /v1/users/password | updateUserPasswordHandler | Update the password for
    a specific user |


    And implement a workflow like this:


    +   1. A client sends a request to the `POST /v1/tokens/password-reset` endpoint
    containing the email address of the user whose password they want to reset.

    +   2. If a user with that email address exists in the `users` table, *and the
    user has already confirmed their email address by activating*, then generate a
    cryptographically-secure high-entropy random token.'
  merge: -1
  img_proc: true
- pgno: 865
  md: "+   3. Store a hash of this token in the `tokens` table, alongside the user\
    \ ID and a short (30-60 minute) expiry time for the token.\n+   4. Send the original\
    \ (unhashed) token to the user in an email.\n+   5. If the owner of the email\
    \ address didn’t request a password reset token, they can ignore the email.\n\
    +   6. Otherwise, they can submit the token to the `PUT /v1/users/password` endpoint\
    \ along with their new password. If the hash of the token exists in the `tokens`\
    \ table and hasn’t expired, then generate a bcrypt hash of the new password and\
    \ update the user’s record.\n+   7. Delete all existing password reset tokens\
    \ for the user.\n\nIn our codebase, you could implement this workflow by creating\
    \ a new `password-reset` token scope:\n\n```\nFile: internal/data/tokens.go\n\n\
    ```go\npackage data\n\n...\n\nconst (\n    ScopeActivation      = \"activation\"\
    \n    ScopeAuthentication = \"authentication\"\n    ScopePasswordReset  = \"password-reset\"\
    \n)\n\n...\n```\n```"
  merge: -1
  img_proc: true
- pgno: 866
  md: <!-- no content -->
  merge: -1
  img_proc: true
