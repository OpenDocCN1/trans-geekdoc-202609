  md: '# Checking Permissions


    Now that our PermissionModel is set up, let’s look at how we can use it to restrict
    access to our API endpoints.


    Conceptually, what we need to do here isn’t too complicated.


    +   - We’ll make a new `requirePermission()` middleware which accepts a specific
    permission code like `"movies:read"` as an argument.

    +   - In this middleware we’ll retrieve the current user from the request context,
    and call the `app.models.Permissions.GetAllForUser()` method (which we just made)
    to get a slice of their permissions.

    +   - Then we can then check to see if the slice contains the specific permission
    code needed. If it doesn’t, we should send the client a `403 Forbidden` response.


    To put this into practice, let’s first make a new `notPermittedResponse()` helper
    function for sending the `403 Forbidden` response. Like so:


    ```

