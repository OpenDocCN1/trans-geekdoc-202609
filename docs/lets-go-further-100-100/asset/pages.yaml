- pgno: 707
  md: '# Recording HTTP Status Codes


    As well as recording the total count of responses sent, we can take this further
    and extend our `metrics()` middleware to start tallying exactly which HTTP status
    codes our responses had.


    The tricky part of doing this is finding out *what HTTP status code a response
    has* in our `metrics()` middleware. Unfortunately Go doesn’t make this easy —
    there is no built-in way to examine a `http.ResponseWriter` to see what status
    code is going to be sent to a client.


    The de-facto workaround is to create your own custom implementation of `http.ResponseWriter`
    which records a copy of the HTTP status code for future access. But doing this
    can be quite brittle and awkward — there are several edge cases that you need
    to be wary of, and it can cause problems if you are using any of the ‘additional’
    ResponseWriter interfaces such as `http.Flusher` and `http.Hijacker`.


    Rather than making your own custom `http.ResponseWriter` implementation, I highly
    recommend using the third-party `httpsnoop` package. It’s small and focused, with
    no additional dependencies, and it makes it very easy to record the HTTP status
    code and size of each response, along with the total processing time for each
    request.


    If you’re following along, go ahead and download it like so:'
