  md: '# # Updating a Movie


    In this chapter we’ll continue building up our application and add a brand-new
    endpoint which allows clients to *update the data for a specific movie*.


    | Method | URL Pattern | Handler | Action |

    |---|---|---|---|

    | GET | /v1/healthcheck | healthcheckHandler | Show application information |

    | POST | /v1/movies | createMovieHandler | Create a new movie |

    | GET | /v1/movies/:id | showMovieHandler | Show the details of a specific movie
    |

    | PUT | /v1/movies/:id | updateMovieHandler | Update the details of a specific
    movie |


    More precisely, we’ll set up the endpoint so that a client can edit the `title`,
    `year`, `runtime` and `genres` values for a movie. In our project the `id` and
    `created_at` values should never change once they’ve been created, and the `version`
    value isn’t something that the client should control, so we won’t allow those
    fields to be edited.


    For now, we’ll configure this endpoint so that it performs a *complete replacement*
    of the values for a movie. This means that the client will need to provide values
    for *all* editable fields in their JSON request body… even if they only want to
    change one of them.'
