- pgno: 31
  md: '# API Endpoints and RESTful Routing


    Over the next few sections of this book we’re going to gradually build up our
    API so that the endpoints start to look like this:


    | Method | URL Pattern | Handler | Action |

    |---|---|---|---|

    | GET | /v1/healthcheck | healthcheckHandler | Show application information |

    | GET | /v1/movies | listMoviesHandler | Show the details of all movies |

    | POST | /v1/movies | createMovieHandler | Create a new movie |

    | GET | /v1/movies/:id | showMovieHandler | Show the details of a specific movie
    |

    | PUT | /v1/movies/:id | editMovieHandler | Update the details of a specific movie
    |

    | DELETE | /v1/movies/:id | deleteMovieHandler | Delete a specific movie |


    If you’ve built APIs with REST style endpoints before, then the table above probably
    looks very familiar to you and doesn’t require much explanation. But if you’re
    new to this, then there are a couple of important things to point out.'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'The first thing is that requests with the same URL pattern will be routed to
    *different handlers* based on the *HTTP request method*. For both security and
    semantic correctness, it''s important that we use the appropriate HTTP method
    for the action that the handler is performing.


    In summary:


    | Method | Usage |

    |---|---|

    | GET | Use for actions that retrieve information only and don’t change the state
    of your application or any data. |

    | POST | Use for *non-idempotent* actions that modify state. In the context of
    a REST API, `POST` is generally used for actions that *create* a new resource.
    |

    | PUT | Use for *idempotent* actions that modify the state of a resource at a
    specific URL. In the context of a REST API, `PUT` is generally used for actions
    that *replace* or *update* an existing resource. |

    | PATCH | Use for actions that *partially update* a resource at a specific URL.
    It’s OK for the action to be either idempotent or non-idempotent. |

    | DELETE | Use for actions that *delete* a resource at a specific URL. |


    The other important thing to point out is that our API endpoints will use clean
    URLs, with parameters interpolated in the URL path. So — for example — to retrieve
    the details of a specific movie a client will make a request like `GET /v1/movies/1`,
    instead of appending the movie ID in a query string parameter like `GET /v1/movies?id=1`.'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# Choosing a router


    When you’re building an API with endpoints like this in Go, one of the first hurdles
    you’ll meet is the fact that `http.ServeMux` — the router in the Go standard library
    — is quite limited in terms of its functionality. In particular it doesn’t allow
    you to route requests to different handlers based on the request method (`GET`,
    `POST`, etc.), nor does it provide support for clean URLs with interpolated parameters.


    Although you can work-around these limitations, or implement your own router,
    generally it’s easier to use one of the many third-party routers that are available
    instead.


    In this chapter we’re going to integrate the popular `httprouter` package with
    our application. Most importantly, `httprouter` is stable, well-tested and provides
    the functionality we need — and as a bonus it’s also extremely fast thanks to
    its use of a radix tree for URL matching. If you’re building a REST API for public
    consumption, then `httprouter` is a solid choice.


    If you’re coding-along with this book, please use `go get` to download version
    `v1.3.0` of `httprouter` like so:


    ```

    $ go get github.com/julienschmidt/httprouter@v1.3.0

    go: downloading github.com/julienschmidt/httprouter v1.3.0

    go get: added github.com/julienschmidt/httprouter v1.3.0

    ```'
  merge: -1
  img_proc: true
- pgno: 34
  md: '> **Note:** If you already have a copy of `httprouter v1.3.0` on your machine
    from another project, then your existing copy will be used and you won’t see a
    `go: downloading...` message.


    To demonstrate how `httprouter` works, we’ll start by adding the two endpoints
    for *creating a new movie* and *showing the details of a specific movie* to our
    codebase. By the end of this chapter, our API endpoints will look like this:


    | Method | URL Pattern | Handler | Action |

    | GET | /v1/healthcheck | healthcheckHandler | Show application information |

    | POST | /v1/movies | createMovieHandler | Create a new movie |

    | GET | /v1/movies/:id | showMovieHandler | Show the details of a specific movie
    |


    # Encapsulating the API routes


    To prevent our `main()` function from becoming cluttered as the API grows, let’s
    encapsulate all the routing rules in a new `cmd/api/routes.go` file.


    If you’re following along, create this new file and add the following code:


    ```

    ```bash

    $ touch cmd/api/routes.go

    ```

    ```'
  merge: -1
