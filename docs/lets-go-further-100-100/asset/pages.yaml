- pgno: 162
  md: 'When you’re looking at this code, there might be a couple of questions in your
    head.


    Firstly, you might be wondering why we’re initializing the `Validator` instance
    in our handler and passing it to the `ValidateMovie()` function — rather than
    initializing it in `ValidateMovie()` and passing it back as a return value.


    This is because as our application gets more complex we will need call *multiple*
    validation helpers from our handlers, rather than just one like we are above.
    So initializing the `Validator` in the handler, and then passing it around, gives
    us more flexibility.


    You might also be wondering why we’re decoding the JSON request into the `input`
    struct and then copying the data across, rather than just decoding into the `Movie`
    struct directly.


    The problem with decoding directly into a `Movie` struct is that a client could
    provide the keys `id` and `version` in their JSON request, and the corresponding
    values would be decoded *without any error* into the `ID` and `Version` fields
    of the `Movie` struct — even though we don’t want them to be. We *could* check
    the necessary fields in the `Movie` struct after the event to make sure that they
    are empty, but that feels a bit hacky, and decoding into an intermediary struct
    (like we are in our handler) is a cleaner, simpler, and more robust approach —
    albeit a little bit verbose.


    OK, with those explanations out of the way, you should be able to start the application
    again and things should work the same as before from the client’s perspective.
    If you make an invalid request,'
