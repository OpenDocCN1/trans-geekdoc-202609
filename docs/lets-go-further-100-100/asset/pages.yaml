    \ Read() function from the crypto/rand package to fill the byte\n    // slice\
    \ with\n    // random bytes from your operating system's CSPRNG. This will return\
    \ an\n    // error if\n    // the CSPRNG fails to function correctly.\n    _,\
    \ err := rand.Read(randomBytes)\n    if err != nil {\n        return nil, err\n\
    \    }\n\n    // Encode the byte slice to a base-32-encoded string and assign\
    \ it to the\n    // token\n    // Plaintext field. This will be the token string\
    \ that we send to the\n    // user in their\n    // welcome email. They will look\
    \ similar to this:\n    // Y3QMGX3PJ3WLRL2YRTQGQ6KRHU\n    //\n    // Note that\
    \ by default base-32 strings may be padded at the end with the\n    // =\n   \
    \ // character. We don't need this padding character for the purpose of our\n\
    \    // tokens, so\n    // we use the WithPadding(base32.NoPadding) method in\
    \ the line below to\n```"
