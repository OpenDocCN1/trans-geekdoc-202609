- pgno: 893
  md: "and extract the user ID from the `subject` claim.\n\nWhen we say “verify the\
    \ JWT”, what we actually mean is the following four things:\n\n+   - Check that\
    \ the signature of the JWT matches the contents of the JWT, given our secret key.\
    \ This will confirm that the token hasn’t been altered by the client.\n+   - Check\
    \ that the current time is between the “not before” and “expires” times for the\
    \ JWT.\n+   - Check that the JWT “issuer” is \"greenlight.alexedwards.net\".\n\
    +   - Check that \"greenlight.alexedwards.net\" is in the JWT “audiences”.\n\n\
