  md: '# Sorting Lists


    Let’s now update the logic for our GET `/v1/movies` endpoint so that the client
    can control how the movies are sorted in the JSON response.


    As we briefly explained earlier, we want to let the client control the sort order
    via a query string parameter in the format `sort={-}{field_name}`, where the optional
    `-` character is used to indicate a descending sort order. For example:


    ```

    // Sort the movies on the title field in ascending alphabetical order.

    /v1/movies?sort=title


    // Sort the movies on the year field in descending numerical order.

    /v1/movies?sort=-year

    ```


    Behind the scenes we will want to translate this into an `ORDER BY` clause in
    our SQL query, so that a query string parameter like `sort=-year` would result
    in a SQL query like this:


    ```

    SELECT id, created_at, title, year, runtime, genres, version

    FROM movies

    WHERE (STRPOS(LOWER(title), LOWER($1)) > 0 OR $1 = '''')

    ```'
  merge: -1
  img_proc: true
- pgno: 341
  md: '```

    AND (genres @> $2 OR $2 = ''{}'')

    ORDER BY year DESC --<- Order the result by descending year

    ```


    The difficulty here is that the values for the `ORDER BY` clause will need to
    be generated at runtime based on the query string values from the client. Ideally
    we’d use placeholder parameters to insert these dynamic values into our query,
    but unfortunately it’s *not possible to use placeholder parameters for column
    names or SQL keywords* (including `ASC` and `DESC`).


    So instead, we’ll need to interpolate these dynamic values into our query using
    `fmt.Sprintf()` — making sure that the values are checked against a strict safelist
    first to prevent a SQL injection attack.


    When working with PostgreSQL, it’s also important to be aware that the order of
    returned rows is only guaranteed by the rules that your `ORDER BY` clause imposes.
    From the [official documentation]():


    > If sorting is not chosen, the rows will be returned in an unspecified order.
    The actual order in that case will depend on the scan and join plan types and
    the order on disk, but it must not be relied on. A particular output ordering
    can only be guaranteed if the sort step is explicitly chosen.


    That means if we don’t include an `ORDER BY` clause, then PostgreSQL may return
    the movies in any order — *and the order may or may not change each time the query
    is run.*'
