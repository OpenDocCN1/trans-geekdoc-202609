  md: 'Chapter 10.2.


    # Panic Recovery


    At the moment any panics in our API handlers will be recovered automatically by
    Go''s `http.Server`. This will unwind the stack for the affected goroutine (calling
    any deferred functions along the way), close the underlying HTTP connection, and
    log an error message and stack trace.


    This behavior is *OK*, but it would be better for the client if we could also
    send a `500 Internal Server Error` response to explain that something has gone
    wrong — rather than just closing the HTTP connection with no context.


    In *Let’s Go* we talked through the details of how to do this by creating some
    middleware to *recover* the panic, and it makes sense to do the same thing again
    here.


    If you’re following along, go ahead and create a `cmd/api/middleware.go` file:


    ```

    ```bash

    $ touch cmd/api/middleware.go

    ```

    ```


    And inside that file add a new `recoverPanic()` middleware:'
  merge: -1
  img_proc: true
- pgno: 386
  md: "File: cmd/api/middleware.go\n\n```\n```go\npackage main\n\nimport (\n    \"\
    fmt\"\n    \"net/http\"\n)\n\nfunc (app *application) recoverPanic(next http.Handler)\
    \ http.Handler {\n    return http.HandlerFunc(func(w http.ResponseWriter, r *http.Request)\
    \ {\n        // Create a deferred function (which will always be run in the event\n\
    \        // of a panic\n        // as Go unwinds the stack).\n        defer func()\
    \ {\n            // Use the builtin recover function to check if there has been\
    \ a\n            // panic or\n            // not.\n            if err := recover();\
    \ err != nil {\n                // If there was a panic, set a \"Connection: close\"\
    \ header on\n                // the\n                // response. This acts as\
    \ a trigger to make Go's HTTP server\n                // automatically close the\
    \ current connection after a\n                // response has been\n         \
    \       // sent.\n                w.Header().Set(\"Connection\", \"close\")\n\
    \                // The value returned by recover() has the type interface{},\n\
    \                // so we use\n                // fmt.Errorf() to normalize it\
    \ into an error and call our\n                // serverErrorResponse() helper.\
    \ In turn, this will log the\n                // error using\n               \
    \ // our custom Logger type at the ERROR level and send the\n                //\
    \ client a 500\n                // Internal Server Error response.\n         \
    \       app.serverErrorResponse(w, r, fmt.Errorf(\"%s\", err))\n            }\n\
    \        }()\n    }\n}\n```\n```"
  merge: -1
  img_proc: true
