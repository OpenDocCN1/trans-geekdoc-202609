    It’s important to point out here that the `enableCORS()` middleware is deliberately
    positioned early in the middleware chain.


    If we positioned it after our rate limiter, for example, any cross-origin requests
    that exceed the rate limit would *not have the* `Access-Control-Allow-Origin`
    *header set*. This means that they would be blocked by the client’s web browser
    due to the same-origin policy, rather than the client receiving a `429 Too Many
    Requests` response like they should.


