    # Additional Information


    # Build caching


    It’s important to note that the go build command caches build output in the Go
    build cache. This cached output will be reused again in future builds where appropriate,
    which can significantly speed up the overall build time for your application.


    If you’re not sure where your build cache is, you can check by running the go
    env GOCACHE command:


    ```

    $ go env GOCACHE

    /home/alex/.cache/go-build

    ```


    You should also be aware that the build cache does not automatically detect any
    changes to C libraries that your code imports with cgo. So, if you’ve changed
    a C library since the last build, you’ll need to use the -a flag to force all
    packages to be rebuilt'
  merge: -1
  img_proc: true
- pgno: 773
  md: 'when running `go build`. Alternatively, you could use `go clean` to purge the
    cache:


    ```

    $ go build -a -o=/bin/foo ./cmd/foo      # Force all packages to be rebuilt

    $ go clean -cache                      # Remove everything from the build cache

    ```


    > **Note:** If you ever run `go build` on a non-`main` package, the build output
    will be stored in the build cache so it can be reused, but no executable will
    be produced.'
