  md: "# Validating Query String Parameters\n\nThanks to the `readInt()` helper that\
    \ we made in the previous chapter, our API should already be returning validation\
    \ errors if the `page` and `page_size` query string parameters don’t contain integer\
    \ values. Go ahead and try it out, if you like:\n\n```\n$ curl \"localhost:4000/v1/movies?page=abc&page_size=abc\"\
    \n{\n  \"error\": {\n    \"page\": \"must be an integer value\",\n    \"page_size\"\
    : \"must be an integer value\"\n  }\n}\n```\n\nBut we still need to perform some\
    \ additional sanity checks on the query string values provided by the client.\
    \ In particular, we want to check that:\n\n+   - The `page` value is between 1\
    \ and 10,000,000.\n+   - The `page_size` value is between 1 and 100.\n+   - The\
    \ `sort` parameter contains a known and supported value for our movies table.\
    \ Specifically, we’ll allow `\"id\"`, `\"title\"`, `\"year\"`, `\"runtime\"`,\
    \ `\"-id\"`, `\"-title\"`, `\"-year\"` or `\"-runtime\"`."
