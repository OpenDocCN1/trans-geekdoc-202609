- pgno: 416
  md: 'Chapter 12.1.


    # Sending Shutdown Signals


    When our application is running, we can terminate it at any time by sending it
    a specific signal. A common way to do this, which you''ve probably been using,
    is by pressing `Ctrl+C` on your keyboard to send an *interrupt* signal — also
    known as a `SIGINT`.


    But this isn''t the only type of signal which can stop our application. Some of
    the other common ones are:


    | Signal | Description | Keyboard shortcut | Catchable |

    |---|---|---|---|

    | `SIGINT` | Interrupt from keyboard | `Ctrl+C` | Yes |

    | `SIGQUIT` | Quit from keyboard | `Ctrl+\` | Yes |

    | `SIGKILL` | Kill process (terminate immediately) | - | No |

    | `SIGTERM` | Terminate process in orderly manner | - | Yes |


    It''s important to explain upfront that some signals are *catchable* and others
    are not. Catchable signals can be intercepted by our application and either ignored,
    or used to trigger a certain action (such as a graceful shutdown). Other signals,
    like `SIGKILL`, are not catchable and cannot be intercepted.'
  merge: -1
  img_proc: true
