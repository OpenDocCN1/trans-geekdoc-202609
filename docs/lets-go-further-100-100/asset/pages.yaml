- pgno: 748
  md: '# Module Proxies and Vendoring


    One of the risks of using third-party packages in your Go code is that the package
    repository may cease to be available. For example, the `httprouter` package plays
    a central part in our application, and if the author ever decided to delete it
    from GitHub it would cause us quite a headache to scramble and replace it with
    an alternative.


    (I’m not suggesting this is likely to happen with `httprouter` — just using it
    as an example!)


    Fortunately, Go provides two ways in which we can mitigate this risk: *module
    proxies and vendoring.*


    # Module proxies


    In version 1.13, Go began to support *module proxies* (also known as *module mirrors*)
    by default. These are services which mirror source code from the original, authoritative,
    repositories (such as those hosted on GitHub, GitLab or BitBucket).


    Go ahead and run the `go env` command on your machine to print out the settings
    for your Go operating environment. Your output should look similar to this:'
  merge: -1
  img_proc: true
