    # Formatting and Enveloping Responses


    So far in this book we’ve generally been making requests to our API using Firefox,
    which makes the JSON responses easy-to-read thanks to the ‘pretty printing’ provided
    by the built-in JSON viewer.


    But if you try making some requests using curl, you’ll see that the actual JSON
    response data is all just on one line with no whitespace.


    ```

    $ curl localhost:4000/v1/healthcheck

    {"environment":"development","status":"available","version":"1.0.0"}


    $ curl localhost:4000/v1/movies/123

    {"id":123,"title":"Casablanca","runtime":102,"genres":

    ["drama","romance","war"],"version":1}

    ```


    We can make these easier to read in terminals by using the `json.MarshalIndent()`
    function to encode our response data, instead of the regular `json.Marshal()`
    function. This automatically adds whitespace to the JSON output, putting each
    element on a separate line and prefixing each line with optional *prefix* and
    *indent* characters.


    Let’s update our `writeJSON()` helper to use this instead:'
