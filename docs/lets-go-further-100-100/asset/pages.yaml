  md: "```\npackage main\n\n...\n\nfunc (app *application) enableCORS(next http.Handler)\
    \ http.Handler {\n    return http.HandlerFunc(func(w http.ResponseWriter, r *http.Request)\
    \ {\n        w.Header().Add(\"Vary\", \"Origin\")\n\n        // Add the \"Vary:\
    \ Access-Control-Request-Method\" header.\n        w.Header().Add(\"Vary\", \"\
    Access-Control-Request-Method\")\n\n        origin := r.Header.Get(\"Origin\"\
    )\n\n        if origin != \"\" && len(app.config.cors.trustedOrigins) != 0 {\n\
    \            for i := range app.config.cors.trustedOrigins {\n               \
    \ if origin == app.config.cors.trustedOrigins[i] {\n                    w.Header().Set(\"\
    Access-Control-Allow-Origin\", origin)\n\n                    // Check if the\
    \ request has the HTTP method OPTIONS and\n                    // contains the\n\
    \                    // \"Access-Control-Request-Method\" header. If it does,\n\
    \                    // then we treat\n                    // it as a preflight\
    \ request.\n                    if r.Method == http.MethodOptions &&\n       \
    \                 r.Header.Get(\"Access-Control-Request-Method\") != \"\" {\n\
    \                        // Set the necessary preflight response headers, as\n\
    \                        // discussed\n                        // previously.\n\
    \                        w.Header().Set(\"Access-Control-Allow-Methods\",\n  \
    \                          \"OPTIONS, PUT, PATCH, DELETE\")\n                \
    \        w.Header().Set(\"Access-Control-Allow-Headers\",\n                  \
    \          \"Authorization, Content-Type\")\n\n                        // Write\
    \ the headers along with a 200 OK status and\n                        // return\
    \ from\n                        // the middleware with no further action.\n  \
    \                      w.WriteHeader(http.StatusOK)\n                        return\n\
    \                    }\n                }\n            }\n        }\n    }\n}\n\
