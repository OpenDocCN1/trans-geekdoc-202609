  md: "```\n> choco install make\n```\n\n# A simple makefile\n\nNow that the make\
    \ utility is installed on your system, let’s create our first iteration of a makefile.\
    \ We’ll start simple, and then build things up step-by-step.\n\nA makefile is\
    \ essentially a text file which contains one or more rules that the make utility\
    \ can run. Each rule has a target and contains a sequence of sequential commands\
    \ which are executed when the rule is run. Generally speaking, makefile rules\
    \ have the following structure:\n\n```\n# comment (optional)\ntarget:\n    command\n\
    \    command\n    ...\n```\n\n**Important:** Please note that each command in\
    \ a makefile rule must start with a tab character, **not spaces**. If you happen\
    \ to be reading this in PDF format, the tab will appear as a single space character\
    \ in the snippet above, but please make sure it is a tab character in your own\
    \ code."
  merge: -1
  img_proc: true
- pgno: 718
  md: "If you’ve been following along, you should already have an empty `Makefile`\
    \ in the root of your project directory. Let’s jump in and create a rule which\
    \ executes the `go run ./cmd/api` command to run our API application. Like so:\n\
    \n```\nFile: Makefile\n\nrun:\n\tgo run ./cmd/api\n```\n\nMake sure that the `Makefile`\
    \ is saved, and then you can execute a specific rule by running `$ make <target>`\
    \ from your terminal.\n\nLet’s go ahead and call `make run` to start the API:\n\
    \n```\n$ make run\ngo run ./cmd/api\n{\"level\":\"INFO\",\"time\":\"2021-04-18T10:38:26Z\"\
    ,\"message\":\"database connection pool established\"}\n{\"level\":\"INFO\",\"\
    time\":\"2021-04-18T10:38:26Z\",\"message\":\"starting server\",\"properties\"\
    :{\"addr\":\":4000\",\"env\":\"development\"}}\n```\n\nGreat, that’s worked well.\
    \ When we type `make run`, the make utility looks for a file called `Makefile`\
    \ or `makefile` in the current directory and then executes the commands associated\
    \ with the `run` target."
