- pgno: 469
  md: '# Chapter 14.


    # # Sending Emails


    In this section of the book we’re going to inject some interactivity into our
    API, and adapt our `registerUserHandler` so that it sends the user a welcome email
    after they successfully register.


    In the process of doing this, we’re going to cover a few interesting topics. You’ll
    learn:


    +   - How to use the Mailtrap SMTP service to send and monitor test emails during
    development.

    +   - How to use the `html/template` package and the new Go 1.16 *embedded files*
    functionality to create dynamic and easy-to-manage templates for your email content.

    +   - How to create a reusable `internal/mailer` package for sending emails from
    your application.

    +   - How to implement a pattern for sending emails in background goroutines,
    and how to wait for these to complete during a graceful shutdown.'
  merge: -1
  img_proc: true
- pgno: 470
  md: '# SMTP Server Setup


    In order to develop our email sending functionality, we’ll need access to a SMTP
    (Simple Mail Transfer Protocol) server that we can safely use for testing purposes.


    There are a huge number of SMTP service providers (such as Postmark, Sendgrid
    or Amazon SES) that we could use to send our emails — or you can even install
    and run your own SMTP server. But in this book we’re going to use Mailtrap.


    The reason for using Mailtrap is because it’s a specialist service for sending
    emails during development and testing. Essentially, it delivers all emails to
    an inbox that you can access, instead of sending them to the actual recipient.


    I’ve got no affiliation with the company — I just find that the service works
    well and is simple to use. They also offer a ‘free forever’ plan, which should
    be sufficient for anyone who is coding-along with this book.


    > **Note:** If you already have your own SMTP server, or there is an alternative
    SMTP provider that you want to use instead, that’s absolutely fine. Feel free
    to skip ahead to the next chapter.'
  merge: -1
  img_proc: true
