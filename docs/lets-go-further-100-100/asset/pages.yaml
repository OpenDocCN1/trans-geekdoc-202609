    # Database Setup and Configuration


    In this next section of the book, we’re going to move forward with our project
    build and set up a SQL database to persistently store our movie data.


    Unlike the first *Let’s Go* book (where we used MySQL as our database), this time
    we’re going to use PostgreSQL. It’s open-source, very reliable and has some helpful
    modern features — including support for array and JSON data types, full-text search,
    and geospatial queries. We’ll use a couple of these modern PostgreSQL features
    as we progress through our build.


    In this section you’ll learn:


    +   - How to install and set up PostgreSQL on your local machine.

    +   - How to use the `psql` interactive tool to create databases, PostgreSQL extensions
    and user accounts.

    +   - How to initialize a database connection pool in Go and configure its settings
    to improve performance and stability.'
