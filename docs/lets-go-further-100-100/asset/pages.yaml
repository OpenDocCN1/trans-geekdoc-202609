  md: 'As an alternative to the pattern that we’ve used in the code above, we could
    create a context with a timeout *in our handlers* using the *request context*
    as the parent — and then pass that on to our database model.


    But — and it’s a big but — doing this introduces a lot of behavioral complexity,
    and for *most* applications the benefits aren’t large enough to make the trade-off
    worthwhile.


    The details behind this are very interesting, but also quite intricate and heavy-going.
    For that reason I’ve discussed it further in [this appendix](#).'
