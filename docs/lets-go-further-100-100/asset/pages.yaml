    # Namespacing targets


    As your makefile continues to grow, you might want to start *namespacing* your
    target names to provide some differentiation between rules and help organize the
    file. For example, in a large makefile rather than having the target name `up`
    it would be clearer to give it the name `db/migrations/up` instead.'
