  md: "```\na string,\n// so that we're able to distinguish between a plaintext password\
    \ not being\npresent in\n// the struct at all, versus a plaintext password which\
    \ is the empty string\n\"\".\ntype password struct {\n    plaintext *string\n\
    \    hash      []byte\n}\n\n// The Set() method calculates the bcrypt hash of\
    \ a plaintext password, and\nstores both\n// the hash and the plaintext versions\
    \ in the struct.\nfunc (p *password) Set(plaintextPassword string) error {\n \
    \   hash, err := bcrypt.GenerateFromPassword([]byte(plaintextPassword), 12)\n\
    \    if err != nil {\n        return err\n    }\n\n    p.plaintext = &plaintextPassword\n\
    \    p.hash = hash\n\n    return nil\n}\n\n// The Matches() method checks whether\
    \ the provided plaintext password\nmatches the\n// hashed password stored in the\
    \ struct, returning true if it matches and\nfalse\n// otherwise.\nfunc (p *password)\
    \ Matches(plaintextPassword string) (bool, error) {\n    err := bcrypt.CompareHashAndPassword(p.hash,\
    \ []byte(plaintextPassword))\n    if err != nil {\n        switch {\n        case\
    \ errors.Is(err, bcrypt.ErrMismatchedHashAndPassword):\n            return false,\
    \ nil\n        default:\n            return false, err\n        }\n    }\n```"
