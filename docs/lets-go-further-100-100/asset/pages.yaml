- pgno: 233
  md: "# Additional Information\n\n# $N notation\n\nA nice feature of the PostgreSQL\
    \ placeholder parameter $N notation is that you can use the same parameter value\
    \ in multiple places in your SQL statement. For example, it's perfectly acceptable\
    \ to write code like this:\n\n```\n// This SQL statement uses the $1 parameter\
    \ twice, and the value `123` will\nbe used in\n// both locations where $1 appears.\n\
    stmt := \"UPDATE foo SET bar = $1 + $2 WHERE bar = $1\"\nerr := db.Exec(stmt,\
    \ 123, 456)\nif err != nil {\n...\n}\n```\n\n# Executing multiple statements\n\
    \nOccasionally you might find yourself in the position where you want to execute\
    \ more than one SQL statement in the same database call, like this:\n\n```\nstmt\
    \ := `\n    UPDATE foo SET bar = true;\n    UPDATE foo SET baz = false;`\n```"
