  md: '* character like so:


    ```

    Access-Control-Allow-Methods: *

    Access-Control-Allow-Headers: *

    ```


    But using these comes with some important caveats:


    +   - Wildcards in these headers are currently only supported by 74% of browsers.
    Any browsers which don’t support them will block the preflight request.

    +   - The `Authorization` header cannot be wildcarded. Instead, you will need
    to include this explicitly in the header like `Access-Control-Allow-Headers: Authorization,
    *`.

    +   - Wildcards are not supported for credentialed requests (those with cookies
    or HTTP basic authentication). For these, the character `*` will be treated as
    the literal string `"*"`, rather than as a wildcard.'
