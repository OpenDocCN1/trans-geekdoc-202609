- pgno: 804
  md: '![](img/30f9221bfc265d52b544dd595ca099de_804_0.png)


    The next step is to choose a plan which matches the technical specifications you
    need for the droplet. In this case we''ll select the **Basic Regular Intel with
    SSD** plan at **$5/month**, which will give us a virtual machine with 1GB RAM,
    25GB of disk space and 1000GB of outbound data transfer each month (inbound data
    transfer is unrestricted).'
  merge: -1
  img_proc: true
- pgno: 805
  md: '![](img/30f9221bfc265d52b544dd595ca099de_805_0.png)


    The next option allows us to add block storage to the droplet. This is essentially
    a droplet-independent storage volume which acts like a local hard disk and can
    be moved between different droplets. It’s not something we need right now, so
    you can skip this section.


    After that we need to select the data center where out droplet will be physically
    hosted. I’m going to choose New York 3 but feel free to pick an alternative location
    if you like.'
  merge: -1
  img_proc: true
- pgno: 806
  md: '![](img/30f9221bfc265d52b544dd595ca099de_806_0.png)


    After that we can select some free “add-on” features for our droplet. In our case
    we’ll select Monitoring, which will allow you to later see graphs of various droplet
    statistics (like CPU, memory and disk use) in your Digital Ocean control panel
    — and you can also set up alerts if resource usage exceeds a certain threshold.'
  merge: -1
  img_proc: true
- pgno: 807
  md: '![](img/30f9221bfc265d52b544dd595ca099de_807_0.png)


    Under the Authentication section, make sure that SSH keys is selected as the authentication
    method and that the SSH key that you just uploaded is checked.


    Then we get to the final configuration options.'
  merge: -1
