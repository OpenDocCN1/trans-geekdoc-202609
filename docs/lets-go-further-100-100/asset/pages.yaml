- pgno: 900
  md: "The omitempty struct tag directive never considers a struct to be empty — even\
    \ if all the struct fields have their zero value and you use omitempty on those\
    \ fields too. It will always appear as an object in the encoded JSON. For example,\
    \ the following struct:\n\n```\n```go\ns := struct {\n    Foo struct {\n     \
    \   Bar string `json:\",omitempty\"`\n    } `json:\",omitempty\"`\n}{}\n```\n\
    ```\n\nWill encode to the JSON:\n\n```\n```json\n{\"Foo\":{}}\n```\n```\n\nThere’s\
    \ a long-standing proposal which discusses changing this behavior, but the Go\
    \ 1 compatibility promise means that it’s unlikely to happen any time soon. Instead,\
    \ you can get around this by making the field a pointer to a struct, which works\
    \ because omitempty considers nil pointers to be empty. For example:\n\n```\n\
    ```go\ns := struct {\n    Foo *struct {\n        Bar string `json:\",omitempty\"\
    `\n    } `json:\",omitempty\"`\n}{}\n```\n```"
  merge: -1
