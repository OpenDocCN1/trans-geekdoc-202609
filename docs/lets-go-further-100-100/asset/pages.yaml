  md: "And then add the following code:\n\n```\nFile: cmd/api/healthcheck.go\n\n```go\n\
    package main\n\nimport (\n    \"fmt\"\n    \"net/http\"\n)\n\n// Declare a handler\
    \ which writes a plain-text response with information about the\n// application\
    \ status, operating environment and version.\nfunc (app *application) healthcheckHandler(w\
    \ http.ResponseWriter, r *http.Request) {\n    fmt.Fprintln(w, \"status: available\"\
    )\n    fmt.Fprintf(w, \"environment: %s\\n\", app.config.env)\n    fmt.Fprintf(w,\
