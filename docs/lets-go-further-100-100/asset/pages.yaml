- pgno: 595
  md: "File: cmd/api/middleware.go\n\n```\n```go\npackage main\n\n...\n\nfunc (app\
    \ *application) requireActivatedUser(next http.HandlerFunc) http.HandlerFunc {\n\
    \    return http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {\n\
    \        // Use the contextGetUser() helper that we made earlier to retrieve the\
    \ user\n        // information from the request context.\n        user := app.contextGetUser(r)\n\
    \n        // If the user is anonymous, then call the authenticationRequiredResponse()\
    \ to\n        // inform the client that they should authenticate before trying\
    \ again.\n        if user.IsAnonymous() {\n            app.authenticationRequiredResponse(w,\
    \ r)\n            return\n        }\n\n        // If the user is not activated,\
    \ use the inactiveAccountResponse() helper to\n        // inform them that they\
    \ need to activate their account.\n        if !user.Activated {\n            app.inactiveAccountResponse(w,\
    \ r)\n            return\n        }\n\n        // Call the next handler in the\
    \ chain.\n        next.ServeHTTP(w, r)\n    })\n}\n```\n```"
