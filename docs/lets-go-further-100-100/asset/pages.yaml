    // Wrap the router with the panic recovery middleware.

    return app.recoverPanic(router)

    }

    ```


    Now that’s in place, if there is a panic in one of our API handlers the `recoverPanic()`
    middleware will recover it and call our regular `app.serverErrorResponse()` helper.
    In turn, that will log the error using our custom `Logger` and send the client
    a nice `500 Internal Server Error` response with a JSON body.


    # Additional Information


    # Panic recovery in other goroutines


    It’s really important to realize that our middleware will only recover panics
    that happen in the same goroutine that executed the `recoverPanic()` middleware.


    If, for example, you have a handler which spins up another goroutine (e.g. to
    do some background processing), then any panics that happen in the background
    goroutine will not be recovered — not by the `recoverPanic()` middleware... and
    not by the panic recovery built into `http.Server`. These panics will cause your
    application to exit and bring down the server.'
