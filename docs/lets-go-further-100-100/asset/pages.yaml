- pgno: 726
  md: "When you specify a prerequisite target for a rule, the corresponding commands\
    \ for the prerequisite targets will be run *before* executing the actual target\
    \ commands.\n\nLet’s leverage this functionality to ask the user for *confirmation\
    \ to continue* before executing our `db/migrations/up` rule.\n\nTo do this, we’ll\
    \ create a new `confirm` target which asks the user `Are you sure? [y/N]` and\
    \ exits with an error if they do not enter `y`. Then we’ll use this new `confirm`\
    \ target as a prerequisite for `db/migrations/up`.\n\nGo ahead and update your\
    \ `Makefile` as follows:\n\n```\nFile: Makefile\n\n# Create the new confirm target.\n\
    confirm:\n    @echo -n 'Are you sure? [y/N] ' && read ans && [ ${ans:-N} = y ]\n\
    \nrun/api:\n    go run ./cmd/api\n\ndb/psql:\n    psql ${GREENLIGHT_DB_DSN}\n\n\
    db/migrations/new:\n    @echo 'Creating migration files for ${name}...'\n    migrate\
    \ create -seq -ext=.sql -dir=./migrations ${name}\n\n# Include it as prerequisite.\n\
    db/migrations/up: confirm\n```"
  merge: -1
