    \n# Additional Information\n\n# Why not use an unsigned integer for the movie\
    \ ID?\n\nAt the start of the Get() method we have the following code which checks\
    \ if the movie id parameter is less than 1:\n\n```\nfunc (m MovieModel) Get(id\
    \ int64) (*Movie, error) {\n    if id < 1 {\n        return nil, ErrRecordNotFound\n\
    \    }\n    ...\n}\n```\n\nThis might have led you to wonder: if the movie ID\
    \ is never negative, why aren’t we using an unsigned uint64 type to store the\
    \ ID in our Go code, instead of an int64?\n\nThere are two reasons for this."
