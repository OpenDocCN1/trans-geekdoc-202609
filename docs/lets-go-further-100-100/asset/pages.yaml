- pgno: 400
  md: '# IP-based Rate Limiting


    Using a global rate limiter can be useful when you want to enforce a strict limit
    on the total rate of requests to your API, and you don’t care where the requests
    are coming from. But it’s generally more common to want a separate rate limiter
    for each client, so that one bad client making too many requests doesn’t affect
    all the others.


    A conceptually straightforward way to implement this is to create an in-memory
    *map of rate limiters*, using the IP address for each client as the map key.


    Each time a new client makes a request to our API, we will initialize a new rate
    limiter and add it to the map. For any subsequent requests, we will retrieve the
    client’s rate limiter from the map and check whether the request is permitted
    by calling its `Allow()` method, just like we did before.


    Because we’ll potentially have multiple goroutines accessing the map concurrently,
    we’ll need to protect access to the map by using a mutex to prevent race conditions.


    If you’re following along, let’s jump into the code and update our `rateLimit()`
    middleware to implement this.


    ```

    File: cmd/api/middleware.go

    ```'
  merge: -1
  img_proc: true
