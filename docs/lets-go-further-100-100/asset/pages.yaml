- pgno: 446
  md: "```\n}\n\n    return true, nil\n}\n```\n\nWe explained how the golang.org/x/crypto/bcrypt\
    \ package works previously in *Let's Go*, but let's quickly recap the key points:\n\
    \n+   - The `bcrypt.GenerateFromPassword()` function generates a bcrypt hash of\
    \ a password using a specific cost parameter (in the code above, we use a cost\
    \ of 12). The higher the cost, the slower and more computationally expensive it\
    \ is to generate the hash. There is a balance to be struck here — we the cost\
    \ to be prohibitively expensive for attackers, but also not so *slow* that it\
    \ harms the user experience of our API. This function returns a *hash string*\
    \ in the format:\n\n```\n$2b$[cost]$[22-character salt][31-character hash]\n```\n\
    \n+   - The `bcrypt.CompareHashAndPassword()` function works by re-hashing the\
    \ provided password using the *same salt and cost parameter* that is in the hash\
    \ string that we're comparing against. The re-hashed value is then checked against\
    \ the original hash string using the `subtle.ConstantTimeCompare()` function,\
    \ which performs a comparison in constant time (to mitigate the risk of a timing\
    \ attack). If they don't match, then it will return a `bcrypt.ErrMismatchedHashAndPassword`\
    \ error."
