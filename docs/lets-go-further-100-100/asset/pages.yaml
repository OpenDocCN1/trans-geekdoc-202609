    \ for a specific user.\n\nWe’ll also create a new `ValidateTokenPlaintext()` function,\
    \ which will check that a plaintext token provided by a client in the future is\
    \ exactly 26 bytes long.\n\nOpen up the `internal/data/tokens.go` file again,\
    \ and add the following code:\n\n```\nFile: internal/data/tokens.go\n\npackage\
    \ data\n\nimport (\n    \"context\" // New import\n    \"crypto/rand\"\n    \"\
