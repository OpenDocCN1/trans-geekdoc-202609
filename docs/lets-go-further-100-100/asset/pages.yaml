- pgno: 732
  md: "Because we already have a file on disk at `./run/api`, the `make` tool considers\
    \ this rule to have already been executed and so returns the message that we see\
    \ above without taking any further action.\n\nTo work around this, we can declare\
    \ our makefile targets to be phony targets:\n\n> A phony target is one that is\
    \ not really the name of a file; rather it is just a name for a rule to be executed.\n\
    \nTo declare a target as phony, you can make it prerequisite of the special `.PHONY`\
    \ target. The syntax looks like this:\n\n```\n.PHONY: target\ntarget: prerequisite-target-1\
    \ prerequisite-target-2 ...\n    command\n    command\n    ...\n```\n\nLet’s go\
    \ ahead and update out `Makefile` so that all our rules have phony targets, like\
    \ so:\n\n```\nFile: Makefile\n\n## help: print this help message\n.PHONY: help\n\
    help:\n    @echo 'Usage:'\n    @sed -n 's/^##//p' ${MAKEFILE_LIST} | column -t\
    \ -s ':' | sed -e 's/^/ /'\n```"
  merge: -1
