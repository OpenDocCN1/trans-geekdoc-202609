- pgno: 19
  md: '```

    .

    ├── bin

    ├── cmd

    │   └── api

    │       └── main.go

    ├── internal

    ├── migrations

    ├── remote

    ├── go.mod

    └── Makefile

    ```


    Let’s take a moment to talk through these files and folders and explain the purpose
    that they’ll serve in our finished project.


    +   - The `bin` directory will contain our compiled application binaries, ready
    for deployment to a production server.

    +   - The `cmd/api` directory will contain the application-specific code for our
    *Greenlight* API application. This will include the code for running the server,
    reading and writing HTTP requests, and managing authentication.

    +   - The `internal` directory will contain various ancillary packages used by
    our API. It will contain the code for interacting with our database, doing data
    validation, sending emails and so on. Basically, any code which *isn’t* application-specific
    and can potentially be reused will live in here. Our Go code under `cmd/api` will
    *import* the packages in the `internal` directory (but never the other way around).'
  merge: -1
  img_proc: true
- pgno: 20
  md: '+   - The `migrations` directory will contain the SQL migration files for our
    database.

    +   - The `remote` directory will contain the configuration files and setup scripts
    for our production server.

    +   - The `go.mod` file will declare our project dependencies, versions and module
    path.

    +   - The `Makefile` will contain *recipes* for automating common administrative
    tasks — like auditing our Go code, building binaries, and executing database migrations.


    It’s important to point out that the directory name `internal` carries a special
    meaning and behavior in Go: any packages which live under this directory can only
    be imported by code *inside the parent of the* `internal` *directory*. In our
    case, this means that any packages which live in `internal` can only be imported
    by code inside our `greenlight` project directory.


    Or, looking at it the other way, this means that any packages under `internal`
    *cannot be imported by code outside of our project*.


    This is useful because it prevents other codebases from importing and relying
    on the (potentially unversioned and unsupported) packages in our `internal` directory
    — even if the project code is publicly available somewhere like GitHub.


    # Hello world!'
