  md: "Behind the scenes, the `pq.Array()` adapter takes our `[]string` slice and\
    \ converts it to a `pq.StringArray` type. In turn, the `pq.StringArray` type implements\
    \ the `driver.Valuer` and `sql.Scanner` interfaces necessary to translate our\
    \ native `[]string` slice to and from a value that our PostgreSQL database can\
    \ understand and store in a `text[]` array column.\n\n**Hint:** You can also use\
    \ the `pq.Array()` adapter function in the same way with `[]bool`, `[]byte`, `[]int32`,\
    \ `[]int64`, `[]float32` and `[]float64` slices in your Go code.\n\n# Hooking\
    \ it up to our API handler\n\nNow for the exciting part. Let’s hook up the `Insert()`\
