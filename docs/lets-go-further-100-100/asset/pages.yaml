- pgno: 92
  md: "# Advanced JSON Customization\n\nBy using struct tags, adding whitespace and\
    \ enveloping the data, we’ve been able to add quite a lot of customization to\
    \ our JSON responses already. But what happens when these things aren’t enough,\
    \ and you need the freedom to customize your JSON even more?\n\nTo answer this\
    \ question, we first need to talk some theory about how Go handles JSON encoding\
    \ behind the scenes. The key thing to understand is this:\n\n> *When Go is encoding\
    \ a particular type to JSON, it looks to see if the type has a `MarshalJSON()`\
    \ method implemented on it. If it has, then Go will call this method to determine\
    \ how to encode it.*\n\nThat language is a bit fuzzy, so let’s be more exact.\n\
    \nStrictly speaking, when Go is encoding a particular type to JSON it looks to\
    \ see if the type satisfies the `json.Marshaler` interface, which looks like this:\n\
    \n```\ntype Marshaler interface {\n    MarshalJSON() ([]byte, error)\n}\n```"
  merge: -1
  img_proc: true
- pgno: 93
  md: 'If the type does satisfy the interface, then Go will call its `MarshalJSON()`
    method and use the `[]byte` slice that it returns as the encoded JSON value.


    If the type doesn’t have a `MarshalJSON()` method, then Go will fall back to trying
    to encode it to JSON based on its own internal set of rules.


    So, if we want to customize how something is encoded, all we need to do is implement
    a `MarshalJSON()` method on it which returns a *custom JSON representation of
    itself* in a `[]byte` slice.


    > **Hint:** You can see this in action if you look at the source code for Go’s
    `time.Time` type. Behind the scenes `time.Time` is actually a `struct`, but it
    has a `MarshalJSON()` method which outputs a RFC 3339 format representation of
    itself. This is what gets called whenever a `time.Time` value is encoded to JSON.


