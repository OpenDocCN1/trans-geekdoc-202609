  md: '**Hint:** In PostgreSQL the `\` character indicates a *meta command*. Some
    other useful meta commands are `\l` to list all databases, `\dt` to list tables,
    and `\du` to list users. You can also run `\?` to see the full list of available
    meta commands.


    Now that our `greenlight` database exists and we’re connected to it, there are
    a couple of tasks we need to complete.


    The first task is to create a new `greenlight` user, without superuser permissions,
    which we can use to execute SQL migrations and connect to the database from our
    Go application. We want to set up this new user to use *password-based* authentication,
    instead of peer authentication.


    PostgreSQL also has the concept of *extensions*, which add additional features
    on top of the standard functionality. A list of the extensions that ship with
    PostgreSQL can be found here, and there are also some others that you can download
    separately.


    In this project we’re going to use the `citext` extension. This adds a case-insensitive
    character string type to PostgreSQL, which we will use later in the book to store
    user email addresses. It’s important to note that extensions can only be added
    by *superusers*, to a *specific database*.


    Go ahead and run the following commands to create a new `greenlight` user with
    a specific password and add the `citext`'
