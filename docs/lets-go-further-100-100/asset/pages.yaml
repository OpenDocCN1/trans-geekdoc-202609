  md: '# Additional Information


    # Partial origin matches


    If you have a lot of trusted origins that you want to support, then you might
    be tempted to check for a partial match on the origin to see if it ‘starts with’
    or ‘ends with’ a specific value, or matches a regular expression. If you do this,
    you must take a lot of care to avoid any unintentional matches.


    As a simple example, if `http://example.com` and `http://www.example.com` are
    your trusted origins, your first thought might check that the request `Origin`
    header ends with `example.com`. This would be a bad idea, as an attacker could
    register the domain name `attackerexample.com` and any requests from that origin
    would pass your check.


    This is just one simple example — and the following blog posts discuss some of
    the other vulnerabilities that can arise when using partial match or regular expression
    checks:


    +   - Security Risks of CORS

    +   - Exploiting CORS misconfigurations for Bitcoins and bounties


    Generally, it’s best to check the `Origin` request header against an explicit
    safelist of full-length trusted origins, like we have done in this chapter.


    # The null origin'
