  md: '# Deployment and Executing Migrations


    At this point our droplet is set up with all the software and user accounts that
    we need, so let’s move on to the process of deploying and running our API application.


    At a very high-level, our deployment process will consist of three actions:


    +   1. Copying the application binary and SQL migration files to the droplet.

    +   2. Executing the migrations against the PostgreSQL database on the droplet.

    +   3. Starting the application binary as a *background service*.


    For now we''ll just focus on steps 1 and 2, and tackle running our application
    as a *background service* in the next chapter.


    Let’s begin by creating a new `make production/deploy/api` rule in our makefile,
    which we will use to execute these first two steps automatically. Like so:


    ```

    File: Makefile

    ```'
  merge: -1
  img_proc: true
- pgno: 828
