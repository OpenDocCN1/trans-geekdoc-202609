  md: 'Chapter 13.2.


    # Setting up the Users Model


    Now that our database table is set up, we’re going to update our `internal/data`
    package to contain a new `User` struct (to represent the data for an individual
    user), and create a `UserModel` type (which we will use to perform various SQL
    queries against our `users` table).


    If you’re following along, go ahead and create an `internal/data/users.go` file
    to hold this new code:


    ```

    $ touch internal/data/users.go

    ```


    Let’s start by defining the `User` struct, along with some helper methods for
    setting and verifying the password for a user.


    As we mentioned earlier, in this project we will use bcrypt to hash user passwords
    before storing them in the database. So the first thing we need to do is install
    the `golang.org/x/crypto/bcrypt` package, which provides an easy-to-use Go implementation
    of the bcrypt algorithm.


    ```

    $ go get golang.org/x/crypto/bcrypt@latest

    go: downloading golang.org/x/crypto v0.0.0-20210314154223-e6e6c4f2bb5b

    go get: added golang.org/x/crypto v0.0.0-20210314154223-e6e6c4f2bb5b

    ```'
