- pgno: 126
  md: 'But for a public-facing API, the error messages themselves aren’t ideal. Some
    are too detailed and expose information about the underlying API implementation.
    Others aren’t descriptive enough (like "EOF"), and some are just plain confusing
    and difficult to understand. There isn’t consistency in the formatting or language
    used either.


    To improve this, we’re going to explain how to *triage the errors* returned by
    `Decode()` and replace them with clearer, easy-to-action, error messages to help
    the client debug exactly what is wrong with their JSON.


    # Triaging the Decode error


    At this point in our application build, the `Decode()` method could potentially
    return the following five types of error:


    | Error types | Reason |

    |---|---|

    | `json.SyntaxError`<br>`io.ErrUnexpectedEOF` | There is a syntax problem with
    the JSON being decoded. |

    | `json.UnmarshalTypeError` | A JSON value is not appropriate for the destination
    Go type. |

    | `json.InvalidUnmarshalError` | The decode destination is not valid (usually
    because it is not a pointer). This is actually a problem with our application
    code, not the JSON itself. |

    | `io.EOF` | The JSON being decoded is empty. |'
