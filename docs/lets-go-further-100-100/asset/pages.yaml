- pgno: 187
  md: '# The SetConnMaxLifetime method


    The `SetConnMaxLifetime()` method sets the `ConnMaxLifetime` limit — the maximum
    length of time that a connection can be reused for. By default, there’s no maximum
    lifetime and connections will be reused forever.


    If we set `ConnMaxLifetime` to one hour, for example, it means that all connections
    will be marked as ‘expired’ one hour after they were first created, and cannot
    be reused after they’ve expired. But note:


    +   - This doesn’t guarantee that a connection will exist in the pool for a whole
    hour; it’s possible that a connection will become unusable for some reason and
    be automatically closed before then.

    +   - A connection can still be in use more than one hour after being created
    — it just cannot *start* to be reused after that time.

    +   - This isn’t an idle timeout. The connection will expire one hour after it
    was first created — not one hour after it last became idle.

    +   - Once every second Go runs a background cleanup operation to remove expired
    connections from the pool.


    In theory, leaving `ConnMaxLifetime` unlimited (or setting a long lifetime) will
    help performance because it makes it less likely that new connections will need
    to be created from scratch. But in certain situations, it can be useful to enforce
    a shorter lifetime. For example:


    +   - If your SQL database enforces a maximum lifetime on connections, it makes
    sense to set `ConnMaxLifetime` to a slightly shorter value.'
  merge: -1
  img_proc: true
- pgno: 188
  md: '+   - To help facilitate swapping databases gracefully behind a load balancer.


    If you do decide to set a `ConnMaxLifetime` on your pool, it’s important to bear
    in mind the frequency at which connections will expire (and subsequently be recreated).
    For example, if you have 100 open connections in the pool and a `ConnMaxLifetime`
    of 1 minute, then your application can potentially kill and recreate up to 1.67
    connections (on average) every second. You don’t want the frequency to be so great
    that it ultimately hinders performance.


    # The SetConnMaxIdleTime method


    The `SetConnMaxIdleTime()` method (which was introduced in Go 1.15) sets the `ConnMaxIdleTime`
    limit. This works in a very similar way to `ConnMaxLifetime`, except it sets the
    maximum length of time that a connection can be *idle* for before it is marked
    as expired. By default there’s no limit.


    If we set `ConnMaxIdleTime` to 1 hour, for example, any connections that have
    sat idle in the pool for 1 hour since last being used will be marked as expired
    and removed by the background cleanup operation.


    This setting is really useful because it means that we can set a relatively high
    limit on the number of idle connections in the pool, but periodically free-up
    resources by removing any idle connections that we know aren’t really being used
    anymore.'
  merge: -1
  img_proc: true
- pgno: 189
  md: '# Putting it into practice


    So that’s a lot of information to take in… and what does it mean in practice?
    Let’s summarize all the above into some actionable points.


    +   1. As a rule of thumb, you should explicitly set a `MaxOpenConns` value. This
    should be comfortably below any hard limits on the number of connections imposed
    by your database and infrastructure, and you may also want to consider keeping
    it fairly low to act as a rudimentary throttle.


    For this project we’ll set a `MaxOpenConns` limit of 25 connections. I’ve found
    this to be a reasonable starting point for small-to-medium web applications and
    APIs, but ideally you should tweak this value for your hardware depending on the
    results of benchmarking and load-testing.


    +   2. In general, higher `MaxOpenConns` and `MaxIdleConns` values will lead to
    better performance. But the returns are diminishing, and you should be aware that
    having a too-large idle connection pool (with connections that are not frequently
    re-used) can actually lead to reduced performance and unnecessary resource consumption.


    Because `MaxIdleConns` should always be less than or equal to `MaxOpenConns`,
    we’ll also limit `MaxIdleConns` to 25 connections for this project.


    +   3. To mitigate the risk from point 2 above, you should set generally set a
    `ConnMaxIdleTime` value to remove idle connections that'
  merge: -1
  img_proc: true
- pgno: 190
  md: 'haven’t been used for a long time. In this project we’ll set a `ConnMaxIdleTime`
    duration of 15 minutes.


    +   4. It’s probably OK to leave `ConnMaxLifetime` as unlimited, unless your database
    imposes a hard limit on connection lifetime, or you need it specifically to facilitate
    something like gracefully swapping databases. Neither of those things apply in
    this project, so we’ll leave this as the default unlimited setting.


    # Configuring the connection pool


    Rather than hard-coding these settings, lets update the `cmd/api/main.go` file
