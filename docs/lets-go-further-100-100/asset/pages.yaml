    ```


    In my case the commit hash is `0f8573aab79f3cbee17d39901d5cb200121c7ed1` — but
    yours will be a different value.


    It’s also possible to use the `git describe` command to get a ‘human-readable’
    descriptor for the current state of the repository. Like so:


    ```

    $ git describe --always --dirty

    0f8573a

    ```


    In this case, we can see that `git describe` returns an *abbreviated version of
    the commit hash*. We’re also using the `--dirty` flag, which means that the descriptor
    will be suffixed with "`-dirty`" if there are any uncommitted changes in the repository.
    For example `0f8573a-dirty`.


    Let’s update our project so that the output from `git describe` is burnt-in to
    our binaries as the application ‘version number’ when building the executable.


    To do this, the first thing that we need to do is switch the `version` constant
    in our `cmd/api/main.go` file to be a variable, because it’s not possible to ‘burn-in’
    a value to a constant.'
