    # Using a domain name


    For the next step of our deployment we’re going to configure Caddy so that we
    can access our droplet via a domain name, instead of needing to use the IP address.


    If you want to follow along with this step you’ll need access to a domain name
    and the ability to update the DNS records for that domain name. If you don’t have
    a domain name already available that you can use, then you can get a free one
    via the Freenom service.


    I’m going to use the domain greenlight.alexedwards.net in the sample code here,
    but you should swap this out for your own domain'
  merge: -1
  img_proc: true
