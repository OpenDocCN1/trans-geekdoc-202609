  md: '# Managing SQL Query Timeouts


    So far in our code we’ve been using Go’s `Exec()` and `QueryRow()` methods to
    run our SQL queries. But Go also provides *context-aware* variants of these two
    methods: `ExecContext()` and `QueryRowContext()`. These variants accept a `context.Context`
    instance as the first parameter which you can leverage to *terminate running database
    queries*.


    This feature can be useful when *you have a SQL query that is taking longer to
    run than expected*. When this happens, it suggests a problem — either with that
    particular query or your database or application more generally — and you probably
    want to cancel the query (in order to free up resources), log an error for further
    investigation, and return a `500 Internal Server Error` response to the client.


    In this chapter we’ll update our application to do exactly that.


    # Mimicking a long-running query


    To help demonstrate how this all works, let’s start by adapting our database model’s
    `Get()` method so that it mimics a long-running query. Specifically, we’ll update
    our SQL query to return a `pg_sleep(10)` value, which will make PostgreSQL sleep
    for 10 seconds before returning its result.'
