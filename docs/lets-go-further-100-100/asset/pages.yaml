- pgno: 55
  md: 'In your programming career you might have come across other JSON APIs which
    send responses with the header

    `Content-Type: application/json; charset=utf-8`.


    Including a `charset` parameter like this isn’t normally necessary. The JSON RFC
    states:


    > JSON text exchanged between systems that are not part of a closed ecosystem
    MUST be encoded using UTF-8.


    The important word here is “must”. Because our API will be a public-facing application,
    it means that our JSON responses must always be UTF-8 encoded. And it also means
    that it’s safe for the client to assume that the responses it gets are always
    UTF-8 encoded. Because of this, including a `charset=utf-8` parameter is redundant.


    The RFC also explicitly notes that the `application/json` media type does not
    have a `charset` parameter defined, which means that it is technically incorrect
    to include one too.


    Basically, in our application a `charset` parameter serves no purpose, and it’s
    safe (and also correct) to not include one in our

    `Content-Type: application/json` header.'
  merge: -1
