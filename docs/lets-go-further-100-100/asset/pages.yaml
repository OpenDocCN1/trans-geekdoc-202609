    \ parameter. The \"\" and 0 indicate\n        // that the\n        // log.Logger\
    \ instance should not use a prefix or any flags.\n        ErrorLog:     log.New(logger,\
    \ \"\", 0),\n        IdleTimeout:  time.Minute,\n        ReadTimeout:  10 * time.Second,\n\
    \        WriteTimeout: 30 * time.Second,\n    }\n    ...\n}\n```\n```\n\nWith\
    \ that set up, any log messages that http.Server writes will be passed to our\
