- pgno: 859
  md: "Now that we have a domain name set up we can utilize one of Caddy’s headline\
    \ features: *automatic HTTPS.*\n\nCaddy will automatically handle provisioning\
    \ and renewing TLS certificates for your domain via Let’s Encrypt, as well as\
    \ redirecting all HTTP requests to HTTPS. It’s simple to set up, very robust,\
    \ and saves you the overhead of needing to keep track of certificate renewals\
    \ manually.\n\nTo enable this, we just need to update our `Caddyfile` so that\
    \ it looks like this:\n\n```\nFile: remote/production/Caddyfile\n\n# Set the email\
    \ address that should be used to contact you if there is a problem with\n# your\
    \ TLS certificates.\n{\n  email you@example.com\n}\n\n# Remove the http:// prefix\
    \ from your site address.\ngreenlight.alexedwards.net {\n  respond /debug/* \"\
    Not Permitted\" 403\n  reverse_proxy localhost:4000\n}\n```\n\nFor the final time,\
    \ deploy this Caddyfile update to your droplet…\n\n```\n$ make production/configure/caddyfile\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 860
