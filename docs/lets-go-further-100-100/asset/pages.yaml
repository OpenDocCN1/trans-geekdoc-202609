- pgno: 642
  md: 'You may also want to open the network activity tab in your developer tools
    and examine the HTTP headers associated with the blocked request.


    ![](img/30f9221bfc265d52b544dd595ca099de_642_0.png)


    There are a couple of important things to point out here.


    The first thing is that the headers demonstrate that the request was sent to our
    API, which processed the request and returned a successful 200 OK response to
    the web browser containing all our standard response headers. To re-iterate: the
    request itself was not prevented by the same-origin policy — it’s just that the
    browser won’t let JavaScript see the response.'
  merge: -1
  img_proc: true
- pgno: 643
  md: 'The second thing is that the web browser automatically set an `Origin` header
    on the request to show where the request originates from (highlighted by the red
    arrow above). You’ll see that the header looks like this:


    ```

    Origin: http://localhost:9000

    ```


    We’ll use this header in the next chapter to help us selectively relax the same-origin
    policy, depending on whether we trust the origin that a request is coming from.


    Finally, it’s important to emphasize that the same-origin policy is a *web browser
    thing only*.


    Outside of a web browser, anyone can make a request to our API from anywhere,
    using `curl`, `wget` or any other means and read the response. That’s completely
    unaffected and unchanged by the same-origin policy.'
