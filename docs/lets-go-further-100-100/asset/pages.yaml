- pgno: 432
  md: "```\n// Call Shutdown() on our server, passing in the context we just\nmade.\n\
    \    // Shutdown() will return nil if the graceful shutdown was\nsuccessful, or\
    \ an\n    // error (which may happen because of a problem closing the\nlisteners,\
    \ or\n    // because the shutdown didn't complete before the 5-second context\n\
    deadline is\n    // hit). We relay this return value to the shutdownError channel.\n\
    \    shutdownError <- srv.Shutdown(ctx)\n}()\n\napp.logger.PrintInfo(\"starting\
    \ server\", map[string]string{\n    \"addr\": srv.Addr,\n    \"env\":  app.config.env,\n\
    })\n\n    // Calling Shutdown() on our server will cause ListenAndServe() to\n\
    immediately\n    // return a http.ErrServerClosed error. So if we see this error,\
    \ it is\nactually a\n    // good thing and an indication that the graceful shutdown\
    \ has started.\nSo we check\n    // specifically for this, only returning the\
    \ error if it is NOT\nhttp.ErrServerClosed.\n    err := srv.ListenAndServe()\n\
    \    if !errors.Is(err, http.ErrServerClosed) {\n        return err\n    }\n\n\
    \    // Otherwise, we wait to receive the return value from Shutdown() on the\n\
    \    // shutdownError channel. If return value is an error, we know that there\n\
    was a\n    // problem with the graceful shutdown and we return the error.\n  \
    \  err = <-shutdownError\n    if err != nil {\n        return err\n    }\n```"
