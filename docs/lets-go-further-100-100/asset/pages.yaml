- pgno: 902
  md: "# Non-ASCII punctuation characters aren’t supported in struct tags\n\nWhen\
    \ using struct tags to change the keys in a JSON object, any tags containing non-ASCII\
    \ punctuation characters will be ignored. Notably this means that you can’t use\
    \ en or em dashes, or most currency signs, in struct tags. For example, the following\
    \ struct:\n\n```\ns := struct {\n    CostUSD string `json:\"cost $\"` // This\
    \ is OK.\n    CostEUR string `json:\"cost €\"` // This contains the non-ASCII\
    \ punctuation character\n    // € and will be ignored.\n}{\n    CostUSD: \"100.00\"\
    ,\n    CostEUR: \"100.00\",\n}\n```\n\nWill encode to the following JSON (notice\
    \ that the struct tag renaming the CostEUR key has been ignored):\n\n```\n{\"\
    cost $\":\"100.00\",\"CostEUR\":\"100.00\"}\n```\n\n# Integer, time.Time and net.IP\
    \ values can be used as map keys"
  merge: -1
