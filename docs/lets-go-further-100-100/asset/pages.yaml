- pgno: 852
  md: '# Blocking access to application metrics


    While we’re in the browser, let’s navigate to the GET /debug/vars endpoint which
    displays our application metrics. You should see a response similar to this:


    ![](img/30f9221bfc265d52b544dd595ca099de_852_0.png)


    As we mentioned earlier, it’s really not a good idea for this sensitive information
    to be publicly accessible.


    Fortunately, it’s very easy to block access to this by adding a new respond directive
    to our Caddyfile like so:'
  merge: -1
  img_proc: true
- pgno: 853
  md: "```\nFile: remote/production/Caddyfile\n\nhttp://45.55.49.87 {\n  respond /debug/*\
    \ \"Not Permitted\" 403\n  reverse_proxy localhost:4000\n}\n```\n\nWith this new\
    \ directive we’re instructing Caddy to send a 403 Forbidden response for all requests\
    \ which have a URL path beginning /debug/.\n\nGo ahead and deploy this change\
    \ to production again, and when you refresh the page in your web browser you should\
    \ find that it is now blocked.\n\n```\n$ make production/configure/caddyfile\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 854
  md: "![](img/30f9221bfc265d52b544dd595ca099de_854_0.png)\n\nAlthough the metrics\
