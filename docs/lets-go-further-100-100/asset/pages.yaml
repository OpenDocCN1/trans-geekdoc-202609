  md: '# # Using embedded file systems


    Before we continue, let’s take a quick moment to discuss embedded file systems
    in more detail, because there are a couple of things that can be confusing when
    you first encounter them.


    +   - You can only use the `//go:embed` directive on global variables at package
    level, not within functions or methods. If you try to use it in a function or
    method, you’ll get the error `"go:embed cannot apply to var inside func"` at compile
    time.


    +   - When you use the directive `//go:embed "<path>"` to create an embedded file
    system, the path should be *relative to the source code file containing the directive*.
    So in our case, `//go:embed "templates"` embeds the contents of the directory
    at `internal/mailer/templates`.


    +   - The embedded file system is rooted in the directory which contains the `//go:embed`
    directive. So, in our case, to get the `user_welcome.tmpl` file we need to retrieve
    it from `templates/user_welcome.tmpl` in the embedded file system.


    +   - Paths cannot not contain `.` or `..` elements, nor may they begin or end
    with a `/`. This essentially restricts you to only embedding files that are contained
    in the same directory (or a subdirectory) as the source code which has the `//go:embed`
    directive.


    +   - If the path is to a directory, then all files in the directory are recursively
    embedded, except for files with names that begin with'
  merge: -1
  img_proc: true
- pgno: 484
  md: '+   - . or _. If you want to include these files you should use the * wildcard
    character in the path, like `//go:embed "templates/*"`

    +   - You can specify multiple directories and files in one directive. For example:
    `//go:embed "images" "styles/css" "favicon.ico"`.

    +   - The path separator should always be a forward slash, even on Windows machines.


