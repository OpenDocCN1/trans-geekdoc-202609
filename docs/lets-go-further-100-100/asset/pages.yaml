    \ to the production server\n.PHONY: production/connect\nproduction/connect:\n\
    \    ssh greenlight@${production_host_ip}\n\n## production/deploy/api: deploy\
    \ the api to production\n.PHONY: production/deploy/api\nproduction/deploy/api:\n\
