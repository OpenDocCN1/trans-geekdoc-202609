- pgno: 808
  md: '![](img/30f9221bfc265d52b544dd595ca099de_808_0.png)


    We only need **one droplet** right now, so you can leave that as the default.


    You should also add a **hostname** for the droplet. Amongst other things, the
    hostname is used as the main identifier for the droplet in the Digital Ocean control
    panel, and it’s also what you’ll see when you SSH into the droplet later to administer
    it. So you should pick a name that is sensible and easy-to-recognize. I’m going
    to use the hostname `greenlight-production`, but feel free to use something different
    if you like.


    Adding tags to your droplet is completely optional, but if you do a lot of work
    with Digital Ocean they can be a useful way to help filter and manage droplets.
    I’ll use the tags `greenlight` and `production` here.'
  merge: -1
  img_proc: true
- pgno: 809
  md: 'Then lastly you can choose to pay an additional 20% charge to enable automated
    droplet backups. If you select this option, then Digital Ocean will take a ‘snapshot’
    of your droplet once a week and store it for a period of 4 weeks. You can then
    restore a droplet to its snapshotted state via the control panel if you ever need
    to. It’s entirely up to you whether to enable backups or not — but it’s a simple
    and hassle-free safety net.


    Once that’s all set, go ahead and click the **Create Droplet** button at the foot
    of the screen. You should see a progress bar while the droplet is being set up
    for you, and after a minute or two the droplet should be live and ready to use.


    ![](img/30f9221bfc265d52b544dd595ca099de_809_0.png)'
