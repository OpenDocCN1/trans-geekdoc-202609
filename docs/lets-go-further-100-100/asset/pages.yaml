- pgno: 118
  md: '```

    ...

    ```


    There are few important and interesting things about this code to point out:


    +   - When calling `Decode()` you must pass a *non-nil pointer* as the target
    decode destination. If you don’t use a pointer, it will return a `json.InvalidUnmarshalError`
    error at runtime.

    +   - If the target decode destination is a struct — like in our case — the struct
    fields must be exported (start with a capital letter). Just like with encoding,
    they need to be exported so that they’re visible to the `encoding/json` package.

    +   - When decoding a JSON object into a struct, the key/value pairs in the JSON
    are mapped to the struct fields based on the struct tag names. If there is no
    matching struct tag, Go will attempt to decode the value into a field that matches
    the key name (exact matches are preferred, but it will fall back to a case-insensitive
    match). *Any JSON key/value pairs which cannot be successfully mapped to the struct
    fields will be silently ignored.*

    +   - There is no need to close `r.Body` after it has been read. This will be
    done automatically by Go’s `http.Server`, so you don’t have too.


    OK, let’s take this for a spin.'
