- pgno: 167
  md: 'During installation, an *operating system* user named `postgres` should also
    have been created on your machine. On Unix-based systems you can check your `/etc/passwd`
    file to confirm this, like so:


    ```

    $ cat /etc/passwd | grep ''postgres''

    postgres:x:127:134:PostgreSQL administrator,,,:/var/lib/postgresql:/bin/bash

    ```


    This is important because, by default, PostgreSQL uses an authentication scheme
    called *peer authentication* for any connections from the local machine. Peer
    authentication means that if the current operating system user''s username matches
    a valid PostgreSQL user username, they can log in to PostgreSQL as that user with
    no further authentication. There are no passwords involved.


    So it follows that if we switch to our *operating system* user called `postgres`,
    we should be able to connect to PostgreSQL using `psql` without needing any further
    authentication. In fact, you can do both these things in one step with the following
    command:


    ```

    $ sudo -u postgres psql

    psql (13.1 (Ubuntu 13.1-1.pgdg20.04+1))

    Type "help" for help.


    postgres=#

    ```'
