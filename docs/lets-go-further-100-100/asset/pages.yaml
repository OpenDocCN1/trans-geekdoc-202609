- pgno: 750
  md: 'The important thing to look at here is the `GOPROXY` setting, which contains
    a comma-separated list of module mirrors. By default it has the following value:


    ```

    GOPROXY="https://proxy.golang.org,direct"

    ```


    The URL `https://proxy.golang.org` that we see here points to a *module mirror*
    maintained by the Go team at Google, containing copies of the source code from
    tens of thousands of open-source Go packages.


    Whenever you fetch a package using the `go` command — either with `go get` or
    one of the `go mod *` commands — it will first attempt to retrieve the source
    code from this mirror.


    If the mirror already has a stored copy of the source code for the required package
    and version number, then it will return this code immediately in a zip file. Otherwise,
    if it’s not already stored, then the mirror will attempt to fetch the code from
    the authoritative repository, proxy it onwards to you, and store it for future
    use.


    If the mirror can’t fetch the code at all, then it will return an error response
    and the `go` tool will fall back to fetching a copy directly from the authoritative
    repository (thanks to the `direct` directive in the `GOPROXY` setting).


    Using a module mirror as the first fetch location has a few benefits:'
  merge: -1
  img_proc: true
- pgno: 751
  md: '+   - The `https://proxy.golang.org` module mirror *typically* stores packages
    long-term, thereby providing a degree of protection in case the original repository
    disappears from the internet.

    +   - It’s not possible to override or delete a package once it’s stored in the
    `https://proxy.golang.org` module mirror. This can help prevent any bugs or problems
    which might arise if a package author (or an attacker) releases an edited version
    of the package *with the same version number*.

    +   - Fetching modules from the `https://proxy.golang.org` mirror can be much
    faster than getting them from the authoritative repositories.


    In most cases, I would generally suggest leaving the `GOPROXY` setting with its
    default values.


    But if you don’t want to use the module mirror provided by Google, or you’re behind
    a firewall that blocks it, there are other alternatives like https://goproxy.io
    and the Microsoft-provided https://athens.azurefd.net that you can try instead.
    Or you can even host your own module mirror using the open-source Athens and goproxy
    projects.


    For example, if you wanted to switch to using `https://goproxy.io` as the primary
    mirror, then fall back to using `https://proxy.golang.org` as a secondary mirror,
    then fall back to a direct fetch, you could update your `GOPROXY` setting like
    so:


    ```

    ```bash

    $ export GOPROXY=https://goproxy.io,https://proxy.golang.org,direct

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 752
  md: 'Or if you want to disable module mirrors altogether, you can simply set the
    value to `direct` like so:


    ```

    $ export GOPROXY=direct

    ```


    # Vendoring


    Go’s module mirror functionality is great, and I recommend using it. But it isn’t
    a silver bullet for all developers and all projects.


    For example, perhaps you don’t want to use a module mirror provided by Google
    or another third-party, but you also don’t want the overhead of hosting your own
    mirror. Or maybe you need to routinely work in an environment without network
    access. In those scenarios you probably still want to mitigate the risk of a disappearing
    dependency, but using a module mirror isn’t possible or appealing.


    You should also be aware that the default `proxy.golang.org` module mirror doesn’t
    absolutely guarantee that it will store a copy of the module forever. From the
    FAQS:


    > > *proxy.golang.org does not save all modules forever. There are a number of
    reasons for this, but one reason is if proxy.golang.org is not able to detect
    a suitable license. In this case, only a temporarily cached copy of the module
    will*'
  merge: -1
  img_proc: true
- pgno: 753
  md: '> *be made available, and may become unavailable if it is removed from the
    original source and becomes outdated.*


    Additionally, if you need to come back to a ‘cold’ codebase in 5 or 10 years’
    time, will the `proxy.golang.org` module mirror still be available? Hopefully
    it will — but it’s hard to say for sure.


    So, for these reasons, it can still be sensible to *vendor* your project dependencies
    using the `go mod vendor` command. Vendoring dependencies in this way basically
    stores a complete copy of the source code for third-party packages in a *vendor*
    folder in your project.


    Let’s demonstrate how to do this. We’ll start by adapting our `Makefile` to include
    a new `vendor` rule which calls the `go mod tidy`, `go mod verify` and `go mod
    vendor` commands, like so:


    ```

    File: Makefile


    ...


    #

    ================================================================================

    ====== #

    # QUALITY CONTROL

    #

    ================================================================================

    ====== #


    ## audit: tidy and vendor dependencies and format, vet and test all code

    .PHONY: audit

    audit: vendor

    ```'
  merge: -1
