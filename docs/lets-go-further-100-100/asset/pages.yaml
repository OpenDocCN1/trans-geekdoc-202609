- pgno: 608
  md: "```\nCREATE TABLE IF NOT EXISTS permissions (\n    id bigserial PRIMARY KEY,\n\
    \    code text NOT NULL\n);\n\nCREATE TABLE IF NOT EXISTS users_permissions (\n\
    \    user_id bigint NOT NULL REFERENCES users ON DELETE CASCADE,\n    permission_id\
    \ bigint NOT NULL REFERENCES permissions ON DELETE CASCADE,\n    PRIMARY KEY (user_id,\
    \ permission_id)\n);\n\n-- Add the two permissions to the table.\nINSERT INTO\
    \ permissions (code)\nVALUES\n    ('movies:read'),\n    ('movies:write');\n```\n\
    \nThere are a couple of important things to point out here:\n\n+   - The PRIMARY\
    \ KEY (user_id, permission_id) line sets a composite primary key on our users_permissions\
    \ table, where the primary key is made up of both the users_id and permission_id\
    \ columns. Setting this as the primary key essentially means that the same user/permission\
    \ combination can only appear once in the table and cannot be duplicated.\n+ \
    \  - When creating the users_permissions table we use the REFERENCES user syntax\
    \ to create a foreign key constraint against the primary key of our users table,\
    \ which ensures that any value in the user_id column has a corresponding entry\
    \ in our users table. And likewise, we use the REFERENCES permissions syntax"
  merge: -1
