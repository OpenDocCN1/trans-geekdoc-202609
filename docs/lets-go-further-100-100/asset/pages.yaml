    and convert this to a `time.Duration`.

    +   2. We could use a string representing the duration — like "5s" (5 seconds)
    or "10m" (10 minutes) — and then parse it using the `time.ParseDuration()` function.


    Both approaches would work fine, but we’ll go with option 2 in this project. Go
    ahead and update the `cmd/api/main.go` file as follows:'
