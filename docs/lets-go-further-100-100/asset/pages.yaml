- pgno: 300
  md: '# Parsing Query String Parameters


    Over the next few chapters, we’re going configure the `GET /v1/movies` endpoint
    so that a client can control which movie records are returned via *query string
    parameters*. For example:


    ```

    /v1/movies?title=godfather&genres=crime,drama&page=1&page_size=5&sort=-year

    ```


    If a client sends a query string like this, it is essentially saying to our API:
    “*please return the first 5 records where the movie name includes `godfather`
    and the genres include `crime` and `drama`, sorted by descending release year*”.


    > **Note**: In the `sort` parameter we will use the `-` character to denote descending
    sort order. So, for example, the parameter `sort=title` implies an ascending alphabetical
    sort on movie title, whereas `sort=-title` implies a descending sort.


    So the first thing we’re going to look at is *how to parse these query string
    parameters in our Go code*.'
  merge: -1
  img_proc: true
