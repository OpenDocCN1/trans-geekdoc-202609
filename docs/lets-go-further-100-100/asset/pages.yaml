  md: '# JSON Encoding


    Let’s move on to something a bit more exciting and look at how to encode native
    Go objects (like maps, structs and slices) to JSON.


    At a high-level, Go’s `encoding/json` package provides two options for encoding
    things to JSON. You can either call the `json.Marshal()` function, or you can
    declare and use a `json.Encoder` type.


    We’ll explain how both approaches work in this chapter, but — for the purpose
    of sending JSON in a HTTP response — using `json.Marshal()` is generally the better
    choice. So let’s start with that.


    The way that `json.Marshal()` works is conceptually quite simple — you pass a
    native Go object to it as a parameter, and it returns a JSON representation of
    that object in a `[]byte` slice. The function signature looks like this:


    ```

    ```go

    func Marshal(v interface{}) ([]byte, error)

    ```

    ```


    > **Note:** The `v` parameter in the above method has the type `interface{}` (known
    as the `empty interface`). This effectively means that we’re able to pass any
    Go type to `Marshal()` as the `v` parameter.'
  merge: -1
  img_proc: true
