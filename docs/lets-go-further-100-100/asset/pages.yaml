  md: '# Deleting a Movie


    In this chapter we’ll add our final CRUD endpoint so that a client can *delete
    a specific movie* from our system.


    | Method | URL Pattern | Handler | Action |

    |---|---|---|---|

    | GET | /v1/healthcheck | healthcheckHandler | Show application information |

    | POST | /v1/movies | createMovieHandler | Create a new movie |

    | GET | /v1/movies/:id | showMovieHandler | Show the details of a specific movie
    |

    | PUT | /v1/movies/:id | updateMovieHandler | Update the details of a specific
    movie |

    | DELETE | /v1/movies/:id | deleteMovieHandler | Delete a specific movie |


    Compared to the other endpoints in our API, the behavior that we want to implement
    here is quite straightforward.


    +   - If a movie with the `id` provided in the URL exists in the database, we
    want to delete the corresponding record and return a success message to the client.

    +   - If the movie `id` doesn’t exist, we want to return a `404 Not Found` response
    to the client.'
