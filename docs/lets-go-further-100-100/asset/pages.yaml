  md: 'Chapter 10.1.


    # Structured JSON Log Entries


    At the moment, all of our log entries are simple free-form messages prefixed by
    the current date and time, written to the *standard out* stream. A good example
    of these are the log entries that we see when we start the API:


    ```

    $ go run ./cmd/api

    2021/04/09 19:43:31 database connection pool established

    2021/04/09 19:43:31 starting development server on :4000

    ```


    For many applications this simple style of logging will be *good enough*, and
    there’s no need to introduce additional complexity to your project.


    But for applications which do a lot of logging, it can often be useful to enforce
    a consistent structure and format for your log entries. This can help make it
    easier to distinguish between different types of log entry (like *informational*
    and *error* entries), easier to search and filter log entries, and simpler to
    integrate your logs with third-party analysis and monitoring systems.


    So in this chapter we’re going demonstrate how to adapt our application so that
    log entries are written in a structured JSON format, similar to this:'
  merge: -1
  img_proc: true
- pgno: 371
  md: '```

    {"level":"INFO","time":"2020-12-16T10:53:35Z","message":"starting server","properties":{"addr":":4000","env":"development"}}

    ```


    Essentially, each log entry will be a single JSON object containing the following
    key/value pairs:


    | Key | Description |

    |---|---|

    | level | A code indicating the severity of the log entry. In this project we
    will use the following three severity levels, ordered from least to most severe:

    - INFO (least severe)

    - ERROR

    - FATAL (most severe) |

    | time | The UTC time that the log entry was made with second precision. |

    | message | A string containing the free-text information or error message. |

    | properties | Any additional information relevant to the log entry in string
    key/value pairs (optional). |

    | trace | A stack trace for debugging purposes (optional). |


    # Creating a custom logger


    To implement this in our API, we''re going to create our own custom Logger type
    which writes structured log entries in JSON format.


    We''ll implement some convenience methods on Logger, such as PrintInfo() and PrintError(),
    in order to make it easy to write log'
