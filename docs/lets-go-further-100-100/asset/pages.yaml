- pgno: 566
  md: '+   - Your API then sends the authorization code to another endpoint provided
    by the identity provider. They verify the authorization code, and if it’s valid
    they will send you a JSON response containing an *ID token*.

    +   - This ID token is itself a JWT. You need to validate and decode this JWT
    to get the actual user information, which includes things like their email address,
    name, birth date, timezone etc.

    +   - Now that you know who the user is, you can then implement a stateful or
    stateless authentication token pattern so that you don’t have to go through the
    whole process for every subsequent request.


    Like all the other options we’ve looked at, there are pros and cons to using OpenID
    Connect. The big plus is that you don’t need to persistently store user information
    or passwords yourself. The big downside is that it’s quite complex — although
    there are some helper packages like `coreos/go-oidc` which do a good job of masking
    that complexity and providing a simple interface for the OpenID Connect workflow
    that you can hook in to.


    It’s also important to point out that using OpenID Connect requires all your users
    to have an account with the identity provider, and the ‘authentication and consent’
    step requires human interaction via a web browser — which is probably fine if
    your API is the back-end for a website, but not ideal if it is a ‘standalone’
    API with other computer programs as clients.'
