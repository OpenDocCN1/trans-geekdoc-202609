  md: '# Metrics


    When your application is running in production with real-life traffic — or if
    you’re carrying out targeted load testing — you might want some up-close insight
    into how it’s performing and what resources it is using.


    For example, you might want to answer questions like:


    +   - How much memory is my application using? How is this changing over time?

    +   - How many goroutines are currently in use? How is this changing over time?

    +   - How many database connections are in use and how many are idle? Do I need
    to change the connection pool settings?

    +   - What is the ratio of successful HTTP responses to both client and server
    errors? Are error rates elevated above normal?


    Having insight into these things can help inform your hardware and configuration
    setting choices, and act as an early warning sign of potential problems (such
    as memory leaks).


    To assist with this, Go’s standard library includes the `expvar` package which
    makes it easy to collate and view different application metrics at runtime.


