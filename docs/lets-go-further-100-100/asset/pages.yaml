    # Additional Information


    # Integration with the http.Server error log


    It’s important to be aware that Go’s `http.Server` may also write its own log
    messages relating to things like unrecovered panics, or problems accepting and
    writing to HTTP connections.


    By default, it writes these messages to the standard logger — which means they
    will be written to the standard error stream (instead of standard out like our
    other log messages), and they won’t be in our nice new JSON format.


    If you want everything logged in one place, in the same format, then that’s obviously
    a problem.


    Unfortunately, you can’t set `http.Server` to use our new `Logger` type directly.
    Instead, you will need to leverage the fact that our `Logger` satisfies the `io.Writer`
    interface (thanks to the `Write()` method that we added to it), and set `http.Server`
    to use a regular `log.Logger` instance from the standard library which *writes*
    to our own `Logger` as the target destination.'
