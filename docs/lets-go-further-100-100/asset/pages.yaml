- pgno: 273
  md: 'There are a couple of options, but the simplest and cleanest approach in this
    case is to use a form of optimistic locking based on the version number in our
    movie record.


    The fix works like this:


    +   1. Alice and Bob’s goroutines both call `app.models.Movies.Get()` to retrieve
    a copy of the movie record. Both of these records have the version number `N`.

    +   2. Alice and Bob’s goroutines make their respective changes to the movie record.

    +   3. Alice and Bob’s goroutines call `app.models.Movies.Update()` with their
    copies of the movie record. But the update is only executed if *the version number
    in the database is still N*. If it has changed, then we don’t execute the update
    and send the client an error message instead.


    This means that the first update request that reaches our database will succeed,
    and whoever is making the second update will receive an error message instead
    of having their change applied.


    To make this work, we’ll need to change the SQL statement for updating a movie
    so that it looks like this:


    ```

    ```sql

    UPDATE movies

    SET title = $1, year = $2, runtime = $3, genres = $4, version = version + 1

    WHERE id = $5 AND version = $6

    RETURNING version

    ```

    ```'
