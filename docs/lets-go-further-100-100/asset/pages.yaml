- pgno: 606
  md: '| id | email | ... |

    |---|---|---|

    | 1 | alice@example.com | ... |

    | 2 | bob@example.com | ... |


    And our permissions data is stored in a `permissions` table like this:


    | id | code |

    |---|---|

    | 1 | movies:read |

    | 2 | movies:write |


    Then we can create a joining table called `users_permissions` to store the information
    about *which users have which permissions*, similar to this:


    | user_id | permission_id |

    |---|---|

    | 1 | 1 |

    | 2 | 1 |

    | 2 | 2 |


    In the example above, the user `alice@example.com` (user ID `1`) has the `movies:read`
    (permission ID `1`) permission only, whereas `bob@example.com` (user ID `2`) has
    both the `movies:read` and `movies:write` permissions.'
