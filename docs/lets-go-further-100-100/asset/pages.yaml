  md: "# Sending JSON Responses\n\nIn this section of the book, we’re going to update\
    \ our API handlers so that they return JSON responses instead of just plain text.\n\
    \nJSON (which is an acronym for *JavaScript Object Notation*) is a human-readable\
    \ text format which can be used to represent structured data. As an example, in\
    \ our project a movie could be represented with the following JSON:\n\n```\n{\n\
    \  \"id\": 123,\n  \"title\": \"Casablanca\",\n  \"runtime\": 102,\n  \"genres\"\
    : [\n    \"drama\",\n    \"romance\",\n    \"war\"\n  ],\n  \"version\": 1\n}\n\
    ```\n\nTo give you a *very* quick overview of the JSON syntax…\n\n+   - The parentheses\
    \ {} define an *JSON object*, which is made up of comma-separated key/value pairs."
