- pgno: 548
  md: "If a client sends the same PUT /v1/users/activated request multiple times,\
    \ the first will succeed (assuming the token is valid) and then any subsequent\
    \ requests will result in an error being sent to the client (because the token\
    \ has been used and deleted from the database). But the important thing is that\
    \ *nothing in our application state (i.e. database) changes after that first request.*\n\
    \nBasically, there are no application state side-effects from the client sending\
    \ the same request multiple times, which means that the endpoint is idempotent\
    \ and using PUT is more appropriate than POST.\n\nAlright, let’s restart the API\
