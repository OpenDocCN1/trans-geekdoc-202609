  md: "Chapter 14.4.\n\n# Sending Background Emails\n\nAs we mentioned briefly in\
    \ the last chapter, sending the welcome email from the `registerUserHandler` method\
    \ adds quite a lot of latency to the total request/response round-trip for the\
    \ client.\n\nOne way we could reduce this latency is by sending the email in a\
    \ *background goroutine*. This would effectively ‘decouple’ the task of sending\
    \ an email from the rest of the code in our `registerUseHandler`, and means that\
    \ we could return a HTTP response to the client without waiting for the email\
    \ sending to complete.\n\nAt its very simplest, we could adapt our handler to\
    \ execute the email send in a background goroutine like this:\n\n```\nFile: cmd/api/users.go\n\
    \npackage main\n...\n\nfunc (app *application) registerUserHandler(w http.ResponseWriter,\
    \ r *http.Request) {\n...\n    // Launch a goroutine which runs an anonymous function\
    \ that sends the welcome email.\n```"
  merge: -1
  img_proc: true
- pgno: 494
  md: "```\n```go\ngo func() {\n    err = app.mailer.Send(user.Email, \"user_welcome.tmpl\"\
    , user)\n    if err != nil {\n        // Importantly, if there is an error sending\
    \ the email then we use the\n        // app.logger.PrintError() helper to manage\
    \ it, instead of the\n        // app.serverErrorResponse() helper like before.\n\
    \        app.logger.PrintError(err, nil)\n    }\n}()\n\n    // Note that we also\
    \ change this to send the client a 202 Accepted status code.\n    // This status\
    \ code indicates that the request has been accepted for processing, but\n    //\
    \ the processing has not been completed.\n    err = app.writeJSON(w, http.StatusAccepted,\
    \ envelope{\"user\": user}, nil)\n    if err != nil {\n        app.serverErrorResponse(w,\
    \ r, err)\n    }\n}\n```\n```\n\nWhen this code is executed now, a new ‘background’\
    \ goroutine will be launched for sending the welcome email. The code in this background\
    \ goroutine will be executed *concurrently* with the subsequent code in our `registerUserHandler`,\
    \ which means we are no longer waiting for the email to be sent before we return\
    \ a JSON response to the client. Most likely, the background goroutine will still\
    \ be executing its code long after the `registerUserHandler` has returned.\n\n\
    There are a couple of things I’d like to emphasize here:"
  merge: -1
  img_proc: true
- pgno: 495
  md: "+   - We use the `app.logger.PrintError()` helper to manage any errors in our\
    \ background goroutine. This is because by the time we encounter the errors, the\
    \ client will probably have already been sent a `202 Accepted` response by our\
    \ `writeJSON()` helper.\n+   \n+   Note that we don’t want to use the `app.serverErrorResponse()`\
    \ helper to handle any errors in our background goroutine, as that would result\
    \ in us trying to write a second *HTTP response* and getting a `\"http: superfluous\
    \ response.WriteHeader call\"` error from our `http.Server` at runtime.\n\n+ \
    \  - The code running in the background goroutine forms a *closure* over the `user`\
    \ and `app` variables. It’s important to be aware that these ‘closed over’ variables\
    \ are *not scoped to the background goroutine*, which means that any changes you\
    \ make to them will be reflected in the rest of your codebase. For a simple example\
    \ of this, see the following [playground code](#).\n+   \n+   In our case we aren’t\
    \ changing the value of these variables in any way, so this behavior won’t cause\
