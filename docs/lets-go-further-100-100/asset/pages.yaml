    # Relationship between permissions and users


    The relationship between permissions and users is a great example of a *many-to-many*
    relationship. One user may have *many permissions*, and the same permission may
    belong to *many users*.


    The classic way to manage a many-to-many relationship in a relational database
    like PostgreSQL is to create a *joining table* between the two entities. I''ll
    quickly explain how this works.


    Let''s say that we are storing our user data in a `users` table which looks like
    this:


    | id | email | ... |

    |---|---|---|'
  merge: -1
