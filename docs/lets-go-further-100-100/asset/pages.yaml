    essentially be ‘skipped’ when movie title being searched for is the empty string
    "".


    The (genres @> $2 OR $2 = ''{}'') condition works in the same way. The @> symbol
    is the ‘contains’ operator for PostgreSQL arrays, and this condition will return
    true if all values in the placeholder parameter $2 are contained in the database
    genres field or the placeholder parameter contains an empty array.


    You’ll remember that earlier in the book we set up our listMoviesHandler so that
    the empty string "" and an empty slice are used as the default values for the
