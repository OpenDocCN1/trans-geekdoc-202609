- pgno: 836
  md: '# Running the API as a Background Service


    Now that we know our API executable works fine on our production droplet, the
    next step is to configure it to run as a *background service*, including starting
    up automatically when the droplet is rebooted.


    There are a few different tools we could use to do this, but in this book we will
    use systemd — a collection of tools for managing services that ships with Ubuntu
    (and many other Linux distributions).


    In order to run our API application as a background service, the first thing we
    need to do is make a unit file, which informs systemd how and when to run the
    service.


    If you’re following along, head back to a terminal window on your local machine
    and create a new `remote/production/api.service` file in your project directory:


    ```

    $ mkdir remote/production

    $ touch remote/production/api.service

    ```


    And then add the following markup:'
  merge: -1
  img_proc: true
- pgno: 837
  md: '```

    File: remote/production/api.service


    [Unit]

    # Description is a human-readable name for the service.

    Description=Greenlight API service


    # Wait until PostgreSQL is running and the network is "up" before starting

    the service.

    After=postgresql.service

    After=network-online.target

    Wants=network-online.target


    # Configure service start rate limiting. If the service is (re)started more

    than 5 times

    # in 600 seconds then don''t permit it to start anymore.

    StartLimitIntervalSec=600

    StartLimitBurst=5


    [Service]

    # Execute the API binary as the greenlight user, loading the environment

    variables from

    # /etc/environment and using the working directory /home/greenlight.

    Type=exec

    User=greenlight

    Group=greenlight

    EnvironmentFile=/etc/environment

    WorkingDirectory=/home/greenlight

    ExecStart=/home/greenlight/api -port=4000 -db-dsn=${GREENLIGHT_DB_DSN} -

    env=production


    # Automatically restart the service after a 5-second wait if it exits with a

    non-zero

    # exit code. If it restarts more than 5 times in 600 seconds, then the rate

    limit we

    # configured above will be hit and it won''t be restarted anymore.

    Restart=on-failure

    RestartSec=5

    ```'
  merge: -1
  img_proc: true
- pgno: 838
  md: '```

    [Install]

    # Start the service automatically at boot time (the ''multi-user.target''

    describes a boot

    # state when the system will accept logins).

    WantedBy=multi-user.target

    ```


    Now that we’ve got a unit file set up, the next step is to install this unit file
    on our droplet and start up the service. Essentially we need to do three things:


    +   1. To ‘install’ the file, we need to copy it into the `/etc/systemd/system/`
    folder on our droplet.

    +   2. Then we need to run the `systemctl enable api` command on our droplet to
    make `systemd` aware of the new unit file and automatically enable the service
    when the droplet is rebooted.

    +   3. Finally, we need to run `systemctl restart api` to start the service.


    All three of these tasks will need to be run with `sudo`.


    Let’s update our makefile to include a new `production/configure/api.service`
    rule which automates these tasks for us. Like so:


    ```

    File: Makefile


    ...

    ```'
