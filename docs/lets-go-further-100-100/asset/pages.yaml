  md: '# The ./... pattern


    Most of the `go` tools support the `./...` wildcard pattern, like `go fmt ./...`,
    `go vet ./...` and `go test ./...`. This pattern matches the current directory
    and all sub-directories, excluding the `vendor` *directory*.


    Generally speaking, this is useful because it means that we’re not formatting,
    vetting or testing the code in our `vendor` directory unnecessarily — and our
    `make audit` rule won’t fail due to any problems that might exist *within* those
    vendored packages.'
