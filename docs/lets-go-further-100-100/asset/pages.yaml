- pgno: 724
  md: "I recommend using the / character as a namespace separator, rather a period,\
    \ hyphen or the : character. In fact, the : character should be strictly avoided\
    \ in target names as it can cause problems when using *target prerequisites* (something\
    \ that we’ll cover in a moment).\n\nLet’s update our target names to use some\
    \ sensible namespaces, like so:\n\n```\n```make\nFile: Makefile\n\nrun/api:\n\
    \    go run ./cmd/api\n\ndb/psql:\n    psql ${GREENLIGHT_DB_DSN}\n\ndb/migrations/new:\n\
    \    @echo 'Creating migration files for ${name}...'\n    migrate create -seq\
    \ -ext=.sql -dir=./migrations ${name}\n\ndb/migrations/up:\n    @echo 'Running\
    \ up migrations...'\n    migrate -path ./migrations -database ${GREENLIGHT_DB_DSN}\
    \ up\n```\n```\n\nAnd you should be able to execute the rules by typing the full\
    \ target name when running `make`. For example:\n\n```\n```bash\n$ make run/api\n\
    go run ./cmd/api\n```\n```"
