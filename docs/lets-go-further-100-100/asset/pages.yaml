    \ string) {\n    v.Check(tokenPlaintext != \"\", \"token\", \"must be provided\"\
    )\n    v.Check(len(tokenPlaintext) == 26, \"token\", \"must be 26 bytes long\"\
    )\n}\n\n// Define the TokenModel type.\ntype TokenModel struct {\n    DB *sql.DB\n\
