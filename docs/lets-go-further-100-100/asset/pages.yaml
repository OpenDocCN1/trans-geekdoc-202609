  md: '# Creating Secure Activation Tokens


    The integrity of our activation process hinges on one key thing: the ‘unguesability’
    of the token that we send to the user’s email address. If the token is easy to
    guess or can be brute-forced, then it would be possible for an attacker to activate
    a user’s account even if they don’t have access to the user’s email inbox.


    Because of this, we want the token to be generated by a *cryptographically secure
    random number generator* (CSPRNG) and have enough entropy (or *randomness*) that
    it is impossible to guess. In our case, we’ll create our activation tokens using
    Go’s `crypto/rand` package and 128-bits (16 bytes) of entropy.


    If you’re following along, go ahead and create a new `internal/data/tokens.go`
    file. This will act as the home for all our logic related to creating and managing
    tokens over the next couple of chapters.


    ```

    $ touch internal/data/tokens.go

    ```


    Then in this file let’s define a `Token` struct (to represent the data for an
    individual token), and a `generateToken()` function that we can'
  merge: -1
  img_proc: true
