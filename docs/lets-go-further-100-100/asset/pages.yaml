- pgno: 793
  md: 'In terms of infrastructure and architecture, we’ll run everything on a single
    Ubuntu Linux server. Our stack will consist of a PostgreSQL database and the executable
    binary for our Greenlight API, operating in much the same way that we have seen
    so far in this book. But in addition to this, we’ll also run Caddy as a *reverse
    proxy* in front of the Greenlight API.


    Using Caddy has a couple of benefits. It will automatically handle and terminate
    HTTPS connections for us — including automatically generating and managing TLS
    certificates via Let’s Encrypt — and we can also use Caddy to easily restrict
    internet access to our metrics endpoint.


    In this section you’ll learn how to:


    +   - Commission an Ubuntu Linux server running on Digital Ocean to host your
    application.

    +   - Automate the configuration of the server — including creating user accounts,
    configuring the firewall and installing necessary software.

    +   - Automate the process of updating your application and deploying changes
    to the server.

    +   - How to run your application as a background service using systemd, as a
    non-root user.

    +   - Use Caddy as a reverse proxy in front of your application to automatically
    manage TLS certificates and handle HTTPS connections.'
  merge: -1
  img_proc: true
- pgno: 794
  md: '# Creating a Digital Ocean Droplet


    The first thing that we need to do is commission a server on Digital Ocean to
    host our application.


    Strictly speaking, what we’re going to commission is actually a *virtual machine*
    known in Digital Ocean terminology as a *droplet*.


    If you’d like to follow along with this stage of the book, you’ll need to register
    for a Digital Ocean account if you don’t already have one. As part of the registration
    process, you’ll be prompted confirm your email address and then add a minimum
    of $5 USD pre-paid credit to your account using either a credit/debit card or
    PayPal.


    Once you’ve completed the registration and added the credit, you should find yourself
    presented with an introductory screen similar to this:'
  merge: -1
