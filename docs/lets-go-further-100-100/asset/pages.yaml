- pgno: 392
  md: '# Global Rate Limiting


    Let’s build things up slowly and start by creating a single *global rate limiter*
    for our application. This will consider *all the requests* that our API receives
    (rather than having separate rate limiters for every individual client).


    Instead of writing our own rate-limiting logic from scratch, which would be quite
    complex and time-consuming, we can leverage the `x/time/rate` package to help
    us here. This provides a tried-and-tested implementation of a *token bucket* rate
    limiter.


    If you’re following along, please go ahead and download the latest version of
    this package like so:


    ```

    $ go get golang.org/x/time/rate@latest

    go: downloading golang.org/x/time v0.0.0-20210220033141-f8bda1e9f3ba

    go: added golang.org/x/time v0.0.0-20210220033141-f8bda1e9f3ba

    ```


    Before we start writing any code, let’s take a moment to explain how token-bucket
    rate limiters work. The description from the official `x/time/rate` documentation
    says:


    > A Limiter controls how frequently events are allowed to happen. It implements
    a “token bucket” of size b, initially full'
  merge: -1
  img_proc: true
- pgno: 393
  md: '> and refilled at rate r tokens per second.


    Putting that into the context of our API application...


    +   - We will have a bucket that starts with b tokens in it.

    +   - Each time we receive a HTTP request, we will remove one token from the bucket.

    +   - Every 1/r seconds, a token is added back to the bucket — up to a maximum
    of b total tokens.

    +   - If we receive a HTTP request and the bucket is empty, then we should return
    a 429 Too Many Requests response.


    In practice this means that our application would allow a maximum ‘burst’ of b
    HTTP requests in quick succession, but over time it would allow an average of
    r requests per second.


    In order to create a token bucket rate limiter from x/time/rate, we will need
    to use the NewLimiter() function. This has a signature which looks like this:


    ```

    // Note that the Limit type is an ''alias'' for float64.

    func NewLimiter(r Limit, b int) *Limiter

    ```


    So if we want to create a rate limiter which allows an average of 2 requests per
    second, with a maximum of 4 requests in a single ‘burst’, we could do so with
    the following code:'
