- pgno: 349
  md: '# Paginating Lists


    If you have an endpoint which returns a list with hundreds or thousands of records,
    then for performance or usability reasons you might want to implement some form
    of *pagination* on the endpoint — so that it only returns a subset of the records
    in a single HTTP response.


    To help demonstrate how to do this, in this chapter we’re going to update the
    `GET /v1/movies` endpoint so that it supports the concept of ‘pages’ and a client
    can request a specific ‘page’ of the movies list by using our `page` and `page_size`
    query string parameters. For example:


    ```

    // Return the 5 records on page 1 (records 1-5 in the dataset)

    /v1/movies?page=1&page_size=5


    // Return the next 5 records on page 2 (records 6-10 in the dataset)

    /v1/movies?page=2&page_size=5


    // Return the next 5 records on page 3 (records 11-15 in the dataset)

    /v1/movies?page=3&page_size=5

    ```


    Basically, changing the `page_size` parameter will alter the number of movies
    that are shown on each ‘page’, and increasing the `page` parameter by one will
    show you the next ‘page’ of movies in the list.'
