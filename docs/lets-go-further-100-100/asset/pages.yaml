- pgno: 884
  md: '# Authentication with JSON Web Tokens


    In this appendix we’re going to switch the authentication process for our API
    to use JSON Web Tokens (JWTs).


    **Important:** Using JWTs for this particular application doesn''t have any benefits
    over our current ‘stateful token’ approach. The JWT approach is more complex,
    ultimately requires the same number of database lookups, and we lose the ability
    to revoke tokens. For those reasons, it doesn''t make much sense to use them here.
    But I still want to explain the pattern for two reasons:


    +   - JWTs have a lot of mind-share, and as a developer it’s likely that you will
    run into existing codebases that use them for authentication, or that outside
    influences mean you are forced to use them.

    +   - It’s worth understanding how they work in case you need to implement APIs
    that require *delegated authentication*, which *is* a scenario that they’re useful
    in.'
  merge: -1
  img_proc: true
- pgno: 885
  md: '> **Note:** If you’re completely new to JWTs, I recommend reading the [Introduction
    to JSON Web Tokens](...) article as a starting point.


    As we briefly explained earlier in the book, JWTs are a type of *stateless token*.
    They contain a set of *claims* which are signed (using either a symmetric or asymmetric
    signing algorithm) and then encoded using base-64. In our case, we’ll use JWTs
    to carry a *subject* claim containing the ID of an authenticated user.


    There are a few different packages available which make working with JWTs relatively
    simple in Go. In most cases the `pascaldekloe/jwt` package is a good choice —
    it has a clear and simple API, and is designed to avoid a couple of the major
    JWT security vulnerabilities by default.


    If you want to follow along, please install it like so:


    ```

    $ go get github.com/pascaldekloe/jwt@v1.10.0

    ```


    One of the first things that you need to consider when using JWTs is the choice
    of signing algorithm.


    If your JWT is going to be consumed by a *different* application to the one that
    created it, you should normally use an asymmetric-key algorithm like ECDSA or
    RSA. The ‘creating’ application uses its private key to sign the JWT, and the
    ‘consuming’ application uses the corresponding public key to verify the signature.'
  merge: -1
  img_proc: true
- pgno: 886
  md: 'Whereas if your JWT is going to be *consumed by the same application that created
    it*, then the appropriate choice is a (simpler and faster) symmetric-key algorithm
    like HMAC-SHA256 with a random secret key. This is what we’ll use for our API.


    So, to get authentication with JWTs working, you’ll first need to add a secret
    key for signing the JWTs to your `.envrc` file. For example:


    ```

    File: .envrc


    ```

    export GREENLIGHT_DB_DSN=postgres://greenlight:pa55word@localhost/greenlight

    export

    JWT_SECRET=pei3einoh0Beem6uM6Ungohn2heiv5lah1ael4joopie5Jaigeikooz aoTew2Eh6

    ```

    ```


    **Note:** Your secret key should be a cryptographically secure random string with
    an underlying entropy of at least 32 bytes (256 bits).


    And then you’ll need to update your `Makefile` to pass in the secret key as a
    command-line flag when starting the application, like so:


    ```

    File: Makefile


    ```

    ...

    #

    ================================================================================

    ```

    ```'
