  md: "counter by 1. You can then monitor the counter, and when it equals zero you\
    \ know that all your background goroutines have finished.\n\nLet’s take a quick\
    \ look at a standalone example of how `sync.WaitGroup` works in practice.\n\n\
    In the code below, we’ll launch five goroutines that print out \"hello from a\
    \ goroutine\", and use `sync.WaitGroup` to wait for them all to complete before\
    \ the program exits.\n\n```\n```go\npackage main\n\nimport (\n    \"fmt\"\n  \
    \  \"sync\"\n)\n\nfunc main() {\n    // Declare a new WaitGroup.\n    var wg sync.WaitGroup\n\
    \n    // Execute a loop 5 times.\n    for i := 1; i <= 5; i++ {\n        // Increment\
    \ the WaitGroup counter by 1, BEFORE we launch the\n        // background routine.\n\
    \        wg.Add(1)\n\n        // Launch the background goroutine.\n        go\
    \ func() {\n            // Defer a call to wg.Done() to indicate that the background\n\
    \            // goroutine has\n            // completed when this function returns.\
    \ Behind the scenes this\n            // decrements\n            // the WaitGroup\
    \ counter by 1 and is the same as writing\n            wg.Add(-1).\n```\n```"
  merge: -1
  img_proc: true
- pgno: 506
  md: "```\ndefer wg.Done()\n\n    fmt.Println(\"hello from a goroutine\")\n    }()\n\
    }\n\n    // Wait() blocks until the WaitGroup counter is zero --- essentially\n\
    blocking until all\n    // goroutines have completed.\n    wg.Wait()\n\n    fmt.Println(\"\
    all goroutines finished\")\n}\n```\n\nIf you run the above code, you’ll see that\
    \ the output looks like this:\n\n```\nhello from a goroutine\nhello from a goroutine\n\
    hello from a goroutine\nhello from a goroutine\nhello from a goroutine\nall goroutines\
    \ finished\n```\n\nOne thing that’s important to emphasize here is that we increment\
    \ the counter with wg.Add(1) immediately before we launch the background goroutine.\
    \ If we called wg.Add(1) in the background goroutine itself, there is a race condition\
    \ because wg.Wait() could potentially be called before the counter is even incremented."
