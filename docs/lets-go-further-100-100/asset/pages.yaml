    \    v.Check(f.PageSize <= 100, \"page_size\", \"must be a maximum of 100\")\n\
    \n    // Check that the sort parameter matches a value in the safelist.\n    v.Check(validator.In(f.Sort,\
    \ f.SortSafelist...), \"sort\", \"invalid sort value\")\n}\n```\n```"
