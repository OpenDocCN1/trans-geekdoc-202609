- pgno: 569
  md: '# Generating Authentication Tokens


    In this chapter we’re going to focus on building up the code for a new `POST/v1/tokens/authentication`
    endpoint, which will allow a client to exchange their credentials (email address
    and password) for a stateful authentication token.


    > **Note:** For conciseness, rather than repeating the words ‘stateful authentication
    token’ throughout the rest of this book, from now on we’ll simply refer this as
    the user’s *authentication token*.


    At a high level, the process for exchanging a user’s credentials for an authentication
    token will work like this:


    +   1. The client sends a JSON request to a new `POST/v1/tokens/authentication`
    endpoint containing their credentials (email and password).

    +   2. We look up the user record based on the email, and check if the password
    provided is the correct one for the user. If it’s not, then we send an error response.

    +   3. If the password is correct, we use our `app.models.Tokens.New()` method
    to generate a token with an expiry time of 24 hours and the scope `"authentication"`.

    +   4. We send this authentication token back to the client in a JSON response
    body.


    Let’s begin in our `internal/data/tokens.go` file.'
