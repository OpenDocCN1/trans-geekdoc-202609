    # SQL query timing attack


    It’s worth pointing out that the SQL query we’re using in `UserModel.GetForToken()`
    is theoretically vulnerable to a timing attack, because PostgreSQL’s evaluation
    of the `tokens.hash = $1` condition is not performed in constant-time.


    ```

    SELECT users.id, users.created_at, users.name, users.email,

    users.password_hash, users.activated, users.version

    FROM users

    INNER JOIN tokens

    ON users.id = tokens.user_id

    WHERE tokens.hash = $1      --<-- This is vulnerable to a timing attack

    AND tokens.scope = $2

    AND tokens.expiry > $3

    ```


    Although it would be somewhat tricky to pull off, in theory an attacker could
    issue thousands of requests to our `PUT /v1/users/activated` endpoint and analyze
    tiny discrepancies in the average response time to build up a picture of a hashed
    activation token value in the database.


    But, in our case, even if a timing attack was successful it would only leak the
    *hashed* token value from the database — not the plaintext'
