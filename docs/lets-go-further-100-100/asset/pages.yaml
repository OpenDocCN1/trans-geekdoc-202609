    # # Restricting Origins


    Using a wildcard to allow cross-origin requests, like we are in the code above,
    can be useful in certain circumstances (like when you have a completely public
    API with no access control checks). But more often you’ll probably want to restrict
    CORS to a much smaller set of *trusted origins*.


    To do this, you need to explicitly include the trusted origins in the `Access-Control-Allow-Origin`
    header instead of using a wildcard. For example, if you want to only allow CORS
    from the origin `https://www.example.com` you could send the following header
    in your responses:'
  merge: -1
  img_proc: true
- pgno: 649
  md: '```

    ```text

    Access-Control-Allow-Origin: https://www.example.com

    ```

    ```


    If you only have one, fixed, origin that you want to allow requests from, then
    doing this is quite simple — you can just update your `enableCORS()` middleware
    to hard-code in the necessary origin value.


    But if you need to support multiple trusted origins, or you want the value to
    be configurable at runtime, then things get a bit more complex.


    One of the problems is that — in practice — you can only specify *exactly one
    origin* in the `Access-Control-Allow-Origin` header. You can’t include a list
    of multiple origin values, separated by spaces or commas like you might expect.


    To work around this limitation, you’ll need to update your `enableCORS()` middleware
    to check if the value of the `Origin` header matches one of your trusted origins.
    If it does, then you can reflect (or *echo*) that value back in the `Access-Control-Allow-Origin`
    response header.


    > > **Note:** The web origin specification does permit multiple *space-separated*
    values in the `Access-Control-Allow-Origin` header but, unfortunately, no web
    browsers actually support this.'
