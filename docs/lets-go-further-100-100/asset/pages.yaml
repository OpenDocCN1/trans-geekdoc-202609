- pgno: 242
  md: 'The first reason is because *PostgreSQL doesn''t have unsigned integers*. It''s
    generally sensible to align your Go and database integer types to avoid overflows
    or other compatibility problems, so because PostgreSQL doesn''t have unsigned
    integers, this means that we should avoid using `uint*` types in our Go code for
    any values that we''re reading/writing to PostgreSQL too.


    Instead, it''s best to align the integer types based on the following table:


    | PostgreSQL type | Go type |

    |---|---|

    | `smallint`, `smallserial` | `int16` (-32768 to 32767) |

    | `integer`, `serial` | `int32` (-2147483648 to 2147483647) |

    | `bigint`, `bigserial` | `int64` (-9223372036854775808 to 9223372036854775807)
    |


    There’s also another, more subtle, reason. Go’s `database/sql` package doesn’t
    actually support any integer values greater than 9223372036854775807 (the maximum
    value for an `int64`). It’s possible that a `uint64` value could be greater than
    this, which would in turn lead to Go generating a runtime error similar to this:


    ```

    ```

    sql: converting argument $1 type: uint64 values with high bit set are not supported

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 243
  md: By sticking with an `int64` in our Go code, we eliminate the risk of ever encountering
    this error.
