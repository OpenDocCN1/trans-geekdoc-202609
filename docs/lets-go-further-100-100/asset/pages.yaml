  md: "# Additional Information\n\n# Non-simple configuration and more information\n\
    \nAs mentioned above, you can also use a language-specific configuration for full-text\
    \ searches instead of the `simple` configuration that we’re currently using. When\
    \ you create lexemes or query terms using a language-specific configuration, it\
    \ will strip out common words for the language and perform word stemming.\n\n\
    So, for example, if you use the `english` configuration, then the lexemes generated\
    \ for \"`One Flew Over the Cuckoo's Nest`\" would be '`cuckoo`' '`flew`' '`nest`'\
    \ '`one`'. Or with the `spanish` configuration, the lexemes for \"`Los lunes al\
    \ sol`\" would be '`lun`' '`sol`'.\n\nYou can retrieve a list of all available\
    \ configurations by running the `\\dF` meta-command in PostgreSQL:\n\n```\npostgres=#\
    \ \\dF\n        List of text search configurations\n Schema |   Name   |     \
    \     Description\n--------+----------+-------------------------------\n pg_catalog\
    \ | arabic | configuration for arabic language\n pg_catalog | danish | configuration\
    \ for danish language\n pg_catalog | dutch  | configuration for dutch language\n\
    ```"
