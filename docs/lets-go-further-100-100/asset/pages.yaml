  md: '![](img/30f9221bfc265d52b544dd595ca099de_802_0.png)


    # Creating a droplet


    Now that you have a valid SSH key added to your account, it’s time to actually
    create a droplet.


    There are a couple of ways that you can do this. It’s possible to do so programmatically
    via the Digital Ocean API or using the official command-line tool, and if you
    need to create or manage a lot of servers then I recommend using these.


    Or alternatively, it’s possible to create a droplet manually via your control
    panel on the Digital Ocean website. This is the approach we’ll take in this book,
    partly because it’s simple enough to do as a one-'
  merge: -1
  img_proc: true
