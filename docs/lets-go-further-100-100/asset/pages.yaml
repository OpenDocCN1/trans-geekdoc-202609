  md: '# Advanced CRUD Operations


    In this section of the book we’re going to look at a few more ‘advanced’ patterns
    that you might want to use for the CRUD endpoints that your API provides.


    You’ll learn:


    +   - How to support *partial* updates to a resource (so that the client only
    needs to send the data that they want to change).

    +   - How to use *optimistic concurrency control* to avoid race conditions when
    two clients try to update the same resource at the same time.

    +   - How to use *context timeouts* to terminate long-running database queries
    and prevent unnecessary resource use.'
  merge: -1
  img_proc: true
- pgno: 262
  md: "# Handling Partial Updates\n\nIn this chapter we’re going to change the behavior\
    \ of the `updateMovieHandler` so that it supports *partial updates* of the movie\
    \ records. Conceptually this is a little more complicated than making a *complete\
    \ replacement*, which is why we laid the groundwork with that approach first.\n\
    \nAs an example, let’s say that we notice that the release year for *The Breakfast\
    \ Club* is wrong in our database (it should actually be 1985, not 1986). It would\
    \ be nice if we could send a JSON request containing only the change that needs\
    \ to be applied, instead of all the movie data, like so:\n\n```\n{\"year\": 1985}\n\
    ```\n\nLet’s quickly look at what happens if we try to send this request right\
    \ now:\n\n```\n$ curl -X PUT -d '{\"year\": 1985}' localhost:4000/v1/movies/4\n\
    {\n  \"error\": {\n    \"genres\": \"must be provided\",\n    \"runtime\": \"\
    must be provided\",\n```"
  merge: -1
  img_proc: true
- pgno: 263
  md: "```\n    \"title\": \"must be provided\"\n  }\n}\n```\n\nAs we mentioned earlier\
    \ in the book, when decoding the request body any fields in our `input` struct\
    \ which *don’t* have a corresponding JSON key/value pair will retain their `zero-value`.\
    \ We happen to check for these zero-values during validation and return the error\
    \ messages that you see above.\n\nIn the context of partial update this causes\
    \ a problem. How do we tell the difference between:\n\n+   - A client *providing\
    \ a key/value pair which has a zero-value value* — like `{\"title\": \"\"}` —\
    \ in which case we want to return a validation error.\n+   - A client *not providing\
    \ a key/value pair* in their JSON at all — in which case we want to ‘skip’ updating\
    \ the field but not send a validation error.\n\nTo help answer this, let’s quickly\
    \ remind ourselves of what the zero-values are for different Go types.\n\n| Go\
    \ type | Zero-value |\n|---|---|\n| `int*`, `uint*`, `float*`, `complex` | `0`\
    \ |\n| `string` | `\"\"` |\n| `bool` | `false` |"
  merge: -1
  img_proc: true
- pgno: 264
  md: "| Go type | Zero-value |\n|---|---|\n| `func`, `array`, `slice`, `map`, `chan`\
    \ and `pointers` | `nil` |\n\nThe key thing to notice here is that pointers have\
    \ the zero-value nil.\n\nSo — in theory — we could change the fields in our input\
    \ struct to be pointers. Then to see if a client has provided a particular key/value\
    \ pair in the JSON, we can simply check whether the corresponding field in the\
    \ input struct equals nil or not.\n\n```\n// Use pointers for the Title, Year\
    \ and Runtime fields.\nvar input struct {\n    Title   *string        `json:\"\
    title\"`   // This will be nil if there is no corresponding key in the JSON.\n\
    \    Year    *int32         `json:\"year\"`    // Likewise...\n    Runtime *data.Runtime\
    \  `json:\"runtime\"` // Likewise...\n    Genres  []string       `json:\"genres\"\
    `  // We don't need to change this because slices already have the zero-value\
    \ nil.\n}\n```\n\n# Performing the partial update\n\nLet’s put this into practice,\
    \ and edit our updateMovieHandler method so it supports partial updates as follows:\n\
    \n```\nFile: cmd/api/movies.go\n```"
  merge: -1
