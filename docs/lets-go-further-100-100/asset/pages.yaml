    *local machine’s operating system and architecture*. But it also supports cross-compilation,
    so you can generate a binary suitable for use on a different machine. This is
    particularly useful if you’re developing on one operating system and deploying
    on another.


    To see a list of all the operating system/architecture combinations that Go supports,
    you can run the `go tool dist list` command like so:


