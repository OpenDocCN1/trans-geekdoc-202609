    # Additional Information


    # System-generated error responses


    While we’re on the topic of errors, I’d like to mention that in certain scenarios
    Go’s `http.Server` may still automatically generate and send plain-text HTTP responses.
    These scenarios include when:


    +   - The HTTP request specifies an unsupported HTTP protocol version.

    +   - The HTTP request contains a missing or invalid `Host` header, or multiple
    `Host` headers.

    +   - The HTTP request contains an invalid header name or value.

    +   - The HTTP request contains an unsupported `Transfer-Encoding` header.

    +   - The size of the HTTP request headers exceeds the server’s `MaxHeaderBytes`
    setting.

    +   - The client makes a HTTP request to a HTTPS server.'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'For example, if we try sending a request with an invalid Host header value
    we will get a response like this:


    ```

    $ curl -i -H "Host: こんにちは" http://localhost:4000/v1/healthcheck

    HTTP/1.1 400 Bad Request: malformed Host header

    Content-Type: text/plain; charset=utf-8

    Connection: close


    400 Bad Request: malformed Host header

    ```


    Unfortunately, these responses are hard-coded into the Go standard library, and
    there’s nothing we can do to customize them to use JSON instead.


    But while this is something to be aware of, it’s not necessarily something to
    worry about. In a production environment it’s relatively unlikely that well-behaved,
    non-malicious, clients would trigger these responses anyway, and we shouldn’t
    be overly concerned if bad clients are sometimes sent a plain-text response instead
    of JSON.'
