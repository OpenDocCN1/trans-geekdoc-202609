    goroutine which listens on this `Done` channel. If the channel gets closed, then
    `pq` sends a cancellation signal to PostgreSQL. PostgreSQL terminates the query,
    and then sends the error message that we see above as a response to the original
    `pq` goroutine. That error message is then returned to our database model’s `Get()`
