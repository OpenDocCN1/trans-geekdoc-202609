- pgno: 790
  md: 'Let’s take a quick look at what this currently looks like for our project:


    ```

    ```bash

    $ git describe --always --dirty --tags --long

    v1.0.0-0-g76c976a

    ```

    ```


    So, in this case, we can see from the version number that the repository is based
    on `v1.0.0`, has 0 additional commits on top of that, and the latest commit hash
    is `76c976a`. The `g` character which prefixes the commit hash stands for ‘git’,
    and exists to help distinguish the hash from any hashes generated by other version-control
    systems.


    Let’s update our `Makefile` to use these additional flags when generating the
    version number, like so:


    ```

    File: Makefile


