    \n    // Pass the context on to the Get() method.\n    example, err := app.models.Example.Get(ctx,\
    \ id)\n    if err != nil {\n        switch {\n        case errors.Is(err, data.ErrNotFound):\n\
    \            app.notFoundResponse(w, r)\n        default:\n            app.serverErrorResponse(w,\
    \ r, err)\n        }\n        return\n    }\n}\n```\n```"
