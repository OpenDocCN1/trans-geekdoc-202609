- pgno: 796
  md: '![](img/30f9221bfc265d52b544dd595ca099de_796_0.png)


    # Creating a SSH key


    In order to log in to droplets in your Digital Ocean account you’ll need a *SSH
    keypair*.


    > **Suggestion:** If you’re unfamiliar with SSH, SSH keys, or [public-key cryptography](...)
    generally, then I recommend reading through the first half of [this guide](...)
    to get an overview before continuing.


    If you already have a SSH keypair that you’re happy to use for this purpose, then
    that’s great, and you can skip ahead to the next section.'
  merge: -1
  img_proc: true
- pgno: 797
  md: 'But if you don’t, you’ll need to create a keypair using the `ssh-keygen` command
    on your local machine. Similar to this:


    ```

    $ ssh-keygen -t rsa -b 4096 -C "greenlight@greenlight.alexedwards.net" -f

