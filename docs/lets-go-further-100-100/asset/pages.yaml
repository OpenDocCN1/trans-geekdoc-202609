  md: '# Server Configuration and Installing Software


    Now that our Ubuntu Linux droplet has been successfully commissioned, we need
    to do some housekeeping to secure the server and get it ready-to-use. Rather than
    do this manually, in this chapter we’re going to create a reusable script to automate
    these setup tasks.


    > **Note:** In this chapter we’ll use a regular bash script to perform the setup
    tasks, but if you’re happy using a configuration management tool such as Ansible,
    then please feel free to implement the same setup process using that instead.


    At a high level we want our setup script to do the following things:


    +   - Update all packages on the server, including applying security updates.

    +   - Set the server timezone (in my case I’ll set it to `America/New_York`) and
    install support for all locales.

    +   - Create a `greenlight` user on the server, which we can use for day-to-day
    maintenance and for running our API application (rather than using the all-powerful
    `root` user account). We should'
