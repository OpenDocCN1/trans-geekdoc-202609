- pgno: 137
  md: 'Fortunately, Go’s `json.Decoder` provides a `DisallowUnknownFields()` setting
    that we can use to generate an error when this happens.


    Another problem we have is the fact that `json.Decoder` is designed to support
    *streams* of JSON data. When we call `Decode()` on our request body, it actually
    reads the *first JSON value only* from the body and decodes it. If we made a second
    call to `Decode()`, it would read and decode the second value and so on.


    But because we call `Decode()` once — and only once — in our `readJSON()` helper,
    anything after the first JSON value in the request body is ignored. This means
    you could send a request body containing multiple JSON values, or garbage content
    after the first JSON value, and our API handlers would not raise an error. For
    example:


    ```

    ```

    # Body contains multiple JSON values

    $ curl -i -d ''{"title": "Moana"}{"title": "Top Gun"}''

    localhost:4000/v1/movies

    HTTP/1.1 200 OK

    Date: Tue, 06 Apr 2021 18:53:57 GMT

    Content-Length: 41

    Content-Type: text/plain; charset=utf-8


    {Title:Moana Year:0 Runtime:0 Genres:[]}


    # Body contains garbage content after the first JSON value

    $ curl -i -d ''{"title": "Moana"} :~()'' localhost:4000/v1/movies

    HTTP/1.1 200 OK

    Date: Tue, 06 Apr 2021 18:54:15 GMT

    Content-Length: 41

    ```

    ```'
