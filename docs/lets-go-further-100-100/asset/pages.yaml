  md: '# Optimistic Concurrency Control


    The eagle-eyed of you might have noticed a small problem in our `updateMovieHandler`
    — there is a race condition if two clients try to update the same movie record
    at exactly the same time.


    To illustrate this, let’s pretend that we have two clients using our API: Alice
    and Bob. Alice wants to correct the runtime value for *The Breakfast Club* to
    97 mins, and Bob wants to add the genre ‘comedy’ to the same movie.


    Now imagine that Alice and Bob send these two update requests at *exactly* the
    same time. As we explained in *Let’s Go*, Go’s `http.Server` handles each HTTP
    request in its own goroutine, so when this happens the code in our `updateMovieHandler`
    will be running concurrently in two different goroutines.


    Let’s step through what could potentially happen in this scenario:


    +   1. Alice’s goroutine calls `app.models.Movies.Get()` to retrieve a copy of
    the movie record (which has version number `N`).

    +   2. Bob’s goroutine calls `app.models.Movies.Get()` to retrieve a copy of the
    movie record (which still has version `N`).

    +   3. Alice’s goroutine changes the runtime to 97 minutes in its copy of the
    movie record.'
  merge: -1
  img_proc: true
- pgno: 272
  md: '+   4. Bob’s goroutine updates the genres to include ‘comedy’ in its copy of
    the movie record.

    +   5. Alice’s goroutine calls `app.models.Movies.Update()` with its copy of the
    movie record. The movie record is written to the database and the version number
    is incremented to `N+1`.

    +   6. Bob’s goroutine calls `app.models.Movies.Update()` with its copy of the
    movie record. The movie record is written to the database and the version number
    is incremented to `N+2`.


    Despite making two separate updates, only Bob’s update will be reflected in the
    database at the end because the two goroutines were *racing* each other to make
    the change. Alice’s update to the movie runtime will be lost when Bob’s update
    overwrites it with the old runtime value. And this happens silently — there’s
    nothing to inform either Alice or Bob of the problem.


    > **Note:** This specific type of race condition is known as a *data race*. Data
    races can occur when two or more goroutines try to use a piece of shared data
    (in this example the movie record) at the same time, but the result of their operations
    is dependent on the exact order that the scheduler executes their instructions.


    # Preventing the data race


    Now we understand that the data race exists and why it’s happening, *how can we
    prevent it?*'
