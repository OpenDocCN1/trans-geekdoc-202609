    以机器人机械臂肩关节为中心、边长为 600 的正方形被用于模拟其运动。结果是，模拟器中每个机器人机械臂的长度在几何上缩减了实际机械臂的连杆长度：$l_1 =
    100$，$l_2 = 20$ 和 $l_3 = 40$。在初始过程中，关节值被随机设置。机械臂端执行器的位置随机放置在三个圆周周上，其中肩部的位置是机械臂运动的原点。目标位置位于边长为
    40 的正方形中心。在实验中，我们为每组参数生成了 200,000 次实验。


    表格显示了学习率。对于所有算法，端执行器越接近目标，获得的奖励越高。端执行器在目标周围正方形内停留的时间越长，奖励越高。当机械臂（智能体）移动到指定目标并在位置停留预定的步数，或者步数超过
    200 时，学习过程终止。


    图 2 显示了每个算法的学习率；横轴显示学习间隔，每个间隔包含 1,000 次实验，而纵轴代表每个间隔的成功率。在图 2 中，D4PG 在过程中比 DDPG
    实现了更高的成功率和更好的稳定性。


    接下来，我们研究了在使用两种算法训练控制模型后，位于不熟悉的圆周轨迹上的目标位置的定位误差。


    表格 I

    学习参数

    | 学习 | 数值 |

    |--- | --- |

    | 学习率 | 0.001 |

    | 折扣因子 | 0.9 |


    ![](img/0d964d9c0f3cd7715fe07c9eb0edd363_2_0.png)


    图 2. DDPG 和 D4PG 算法学习成功率对比。


    ![](img/0d964d9c0f3cd7715fe07c9eb0edd363_2_1.png)


    图 3. DDPG 和 D4PG 算法在不熟悉目标位置后的定位误差对比。


    定位误差定义为目标与端执行器位置之间的欧几里得距离。测试的目标点总数为 19 个，每个点的定位误差通过使用不同关节配置值获得的 1,000 次实验结果进行评估。两种算法观察到的误差以及误差棒棒显示了标准差。在图
    3 中，通过训练控制模型获得的平均误差和方差低于 DDPG。D4PG 算法实现的机器人机械臂任务精度比 DDPG 高。


    最后，进行了机器人机械臂沿期望轨迹的跟踪，以作为一种实际的控制方法。图 5 展示了使用 D4PG 和 DDPG 算法完成学习过程后，不熟悉的圆周轨迹。机械臂首先将其端执行器移动到轨迹起点，在初始关节角随机设置后遵循控制指令，然后它们对于每个指定的终点点对点地跟踪轨迹。如图
    4 所示，很难确保端执行器在保持 D4PG 控制模型精度的同时跟踪期望轨迹。尽管该控制模型不满足实际需求，且在期望轨迹的最终位置周围观察到较大的误差（如图
    5 所示），但 D4PG 训练的模型表现得优于 DDPG 训练的模型。


    # IV. 结论


    本研究调查了深度强化学习（DRL）控制机器人机械臂的有效性：探索了两种类型，即 DDPG 和 D4PG 算法来训练控制模型，并比较了它们的性能。机器人机械臂的运动模拟使用了人形机器人的
    7 自由手臂，并使用模拟器实现了两种


    ![](img/0d964d9c0f3cd7715fe07c9eb0edd363_3_0.png)


    ![](img/0d964d9c0f3cd7715fe07c9eb0edd363_3_1.png)


    算法进行计算实验，基于机器人机械臂端执行器的到达任务，通过上述实验训练了模型并测试了其性能。实验结果验证了 DRL 在机器人机械臂控制中的应用，并证明了在该任务中取得了比
    DDPG 算法更好的性能。


    本研究提出的提出的仿真目标是提高机器人机械臂在复杂场景下的精度和控制。未来的工作将讨论优化 DRL 算法以提高模型的跟踪精度，并通过在真实世界设置中评估控制性能来对真实场景进行实验。


