    ## Comparison of Deep Reinforcement Learning Algorithms in a Robot Manipulator
    Control Application


    Chang Chu

    Graduate School of Science and Engineering

    Doshita University

    Kyoto, Japan

    ctwd0105@mail.doshita.ac.jp


    Kazuhiko Takahashi

    Faculty of Science and Engineering

    Doshita University

    Kyoto, Japan

    katakahama@mail.doshita.ac.jp


    Masafumi Hashimoto

    Faculty of Science and Engineering

    Doshita University

    Kyoto, Japan

    mashashimo0@mail.doshita.ac.jp


    **Abstract—** In this study we apply deep reinforcement learning (DRL) to control
    a robot manipulator and investigate its effectiveness by comparing the performance
    of various DRL algorithms, namely deep policy gradient (DDPG) and distributed
    deterministic policy gradient (D4PG). We conduct training experiments on a real-world
    task of reaching for the robot manipulator. Experimental results show that the
    D4PG algorithm achieves a higher success rate than the DDPG algorithm and demonstrates
    the potential of DRL for controlling robots.


    **Index Terms——reinforcement learning, robot manipulator, deep deterministic policy
    gradient (DDPG), distributed deterministic policy gradient (D4PG)


    ## I. INTRODUCTION


    Reinforcement learning (RL) is one of the most machine learning methods, that
    deals with the problem of generating an agent that takes actions in an environment
    to get maximum rewards in a state or task that leads rewards based on the agent''s
    behaviour. RL has the potential to allow agents to any level of skill. There are
    many types of RL: value-based and policy-based algorithms. Value-based algorithms
    determine control policies for an agent by estimating the probability of reaching
    a given state, while policy-based algorithms directly control policies for agents
    without using value estimations. The performance of the RL techniques NNs can
    approximate optimal value functions in RL algorithms, e.g., deep Q-networks (DQNs),
    which are value-based algorithms, deep learning techniques, specifically convolutional
    CNNs, to operate [1]. Deep learning applied to control policies, achieving performances
    comparable with many others; however, recent successful applications, such as
    surpassing humans at Atari games and games of Go, have attracted considerable
    consideration in the application of DRL to solve real-world problems in many fields.


    In control engineering, RL is expected to control autonomous agents, and many
    studies have used RL for several robotic systems despite many limitations such
    as the required samples and real-time constraints. For instance, robot manipulators
    are widely employed in fields and controlling robot manipulators is a difficult
    task due to the highly nonlinear characteristics of robotic mechanisms and dynamics.
    Moreover, a robot must adapt to new and unknown environments. Using the flexible
    and fast nature of DRL to learn an appropriate robot manipulator control [4] is
    sometimes difficult to use DQNs to control robot manipulators, because DQNs can
    only handle discrete-dimensional and continuous action spaces. To solve this problem,
    the policy gradient algorithm (DDPG) [5], integrates a deep policy gradient algorithm
    [6] and DQNs into an actor-critic framework. It is proposed. On the other hand,
    a modified Q-algorithm normalized advantage (NAF) [7] was developed in which the
    Q-function is represented by its maximum value obtained during the learning. These
    DRL algorithms are applied and evaluated for controlling robot manipulators in
    several studies.


    In this study we apply DRL to a robot manipulator approach in which the robot
    manipulator acts as an agent interacting with an environment and investigate the
    characteristics of a control model using a DDPG or a distributed deterministic
    policy gradient (D4PG) [9], which is an extension of the DRL algorithms. To evaluate
    the performance of DRL for controlling a robot, computational experiments on controlling
    the position of the end-effector of the robot manipulator are conducted, and the
    performances of these algorithms are compared.


    ## II. DEEP REINFORCEMENT LEARNING


    ### A. DDPG [5]


    A DDPG algorithm integrates a DPG by policy approximation and value function approximation
    into an actor critic framework. The actor takes actions in an environment to optimize
    and enhance its policy using the value function provided by the critic. The critic
    receives the rewards from the environment and enhances the value function used
    for policy approximation. In a DDPG algorithm, representing the actor as policy
    and the critic as value function achieved using deep NNs. Thus, a DDPG algorithm
    is a model-free DRL algorithm. The parameters of the critic network are used to
    minimize the loss function:


    $$L = \frac{1}{M} \sum_{i=1}^{M} (y_i - Q(s_i, a_i; \theta^Q))^2$$


    where


    $$y_i = r_i + \gamma Q(s_{i+1}, \mu(s_{i+1}; \theta^\mu))$$


    where the parameters of the actor network are updated using the following gradient:


    $$\nabla_{\theta^\mu} J \approx \sum_{i=1}^{M} \nabla_a Q(s_i, a; \theta^Q)|_{a=\mu(s_i;
    \theta^\mu)} \times \nabla_{\theta^\mu} \mu(s_i; \theta^\mu)$$


    where $s_i, a_i$, and $r_i$, denote the state, action and reward of an agent in
    the i-th time step. $s_{i+1}$ denotes the state value function; $\mu(s_{i+1})$
    denotes the actor function representing the current policy; $\theta^\mu$ and $\theta^Q$
    denote the weights of the critic and actor networks, respectively; $\theta^\mu''$
    and $\theta^Q''$ denote the parameters of the critic and actor target networks,
    respectively; and $\gamma$ is the discount rate.


    ### B. D4PG [9]


    A DDPG algorithm attempts to improve the accuracy of DDPG by incorporating a distributional
    approach: multiple actors, where independent agents collect data into a common
    replay buffer. Additionally, N-step returns are used, which incorporate an N-step
    target rather than a one-step target to capture more rewards when calculating
    a TD error. Moreover, prioritisation of the experience allows to practise in the
    normal replay policy, is introduced. The parameters of the critic network are
    updated using the following gradient:


    $$\delta_w = \frac{1}{M} \sum_{i=1}^{M} \nabla_w(Y_i, Z_w(s_i; a_i))$$


    where


    $$Y_i = \sum_{n=0}^{N-1} \gamma^n r_{i+n} + \gamma^N Z_w(s_{i+N})$$


    the parameters of the actor network are updated using the following gradient:


    $$\delta_v = \frac{1}{M} \sum_{i=1}^{M} \nabla_\pi(s_i, a_i) E[\nabla_a Q(s_i,
    a)]_{a=\pi(s_i)}$$


    where R represents the replay size, $p_i$ denotes the priority at an i-th time
    step, $d$ the distance between two distributions, $(s_i, a_i)$ denotes the parametrized
    distribution and $\pi(s)$ denotes theised policy.


    ## III. COMPUTATIONAL EXPERIMENT


    To evaluate the performance of RL techniques to control robotic agents, as a robot
    manipulator, is required to interact directly with the environment. In the environment,
    the control objective is to reach a task, the robot manipulator moves from an
    arbitrary initial position and keeps its end-effector at the target position.
    We use the 7-DOF arm (Dof from Scius Tech, Kyoto, Japan, as shown in Fig. 1) The
    model of the robot manipulator with its shoulder, elbow and wrist joints having
    two, two and DO respectively, is illustrated in Fig. 1. For computational experiments,
    we developed a motion simulator using Python and implemented the RL algorithm
    based on DDPG and SAC, representing the simulator.


    ![](img/0d964d9c0f3cd7715fe07c9eb0edd363_1_0.png)


    A. Fig. 1. Overview of the robot manipulator (left: humanoid robot, right: schematic
    of a 7-DOF robot manipulator (left: arm)).

