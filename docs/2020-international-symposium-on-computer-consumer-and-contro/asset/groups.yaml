    ## 机器人手臂控制应用中深度强化学习算法的比较


    Chang Chu

    科学与工程研究生院

    足石大学

    日本，京都

    ctwd0105@mail.doshita.ac.jp


    Kazuhiko Takahashi

    科学与工程学部

    足石大学

    日本，京都

    katakahama@mail.doshita.ac.jp


    Masafumi Hashimoto

    科学与工程学部

    足石大学

    日本，京都

    mashashimo0@mail.doshita.ac.jp


    **摘要——** 在本研究中，我们将深度强化学习（DRL）应用于机器人手臂的控制，并通过比较各种 DRL 算法（即深度策略梯度（DDPG）和分布式确定性策略梯度（D4PG））的性能来研究其有效性。我们针对机器人手臂抓取的现实任务开展了训练实验。实验结果表明，D4PG
    算法的成功率高于 DDPG 算法，并展示了深度强化学习在机器人控制方面的潜力。


    **索引词——强化学习，机器人手臂，深度确定性策略梯度（DDPG），分布式确定性策略梯度（D4PG）**


    ## I. 引言


    强化学习（RL）是机器学习中最的方法之一，它解决了生成智能体的问题，使智能体在环境中采取行动，并在状态或任务中获得最大奖励。强化学习具有让智能体掌握任何水平技能的潜力。强化学习有很多类型：基于值的（value-based）和基于策略（policy-based）的算法。基于值的算法通过估计到达给定状态的概率来确定智能体的控制策略，而基于策略的算法在不使用值估计的情况下直接控制智能体的策略。RL
    技术的性能：神经网络（NNs）可以近似 RL 算法中的最优值函数，例如深度 Q 网络（DQNs），这是基于值的算法；深度学习技术，特别是卷积神经网络 CNN，用于操作
    [1]。应用于控制策略的深度学习取得了与许多其他方法相当的性能；然而，近期成功的应用（例如在雅达利游戏和围棋中击败人类）已经引起了人们对应用深度强化学习解决许多领域现实问题的高度关注。


    在控制工程中，RL 被用于控制自主智能体，尽管存在样本需求和实时性限制等许多限制，但许多研究已将 RL 用于多个机器人系统。例如，机器人手臂被广泛应用于各个领域，由于机器人机构和动力学的高度非线性特性，控制机器人手臂是一项困难的任务。此外，机器人必须适应新的且未知的环境。利用深度强化学习灵活且快速的特性来学习合适的机器人手臂控制
    [4] 有时很难使用 DQNs 控制机器人手臂，因为 DQNs 只能处理离散和连续动作空间。为了解决这个问题，提出了策略梯度算法（DDPG）[5]，并将深度策略梯度算法
    [6] 和 DQNs 集成到执行者-评论（actor-critic）框架中。另一方面，开发了改进的 Q 算法归一化优势（NAF）[7]，其中 Q 函数由学习过程中获得的最大值表示。这些
    DRL 算法已在多项研究中应用于机器人手臂控制。


    在本研究中，我们将 DRL 应用于机器人手臂方法，其中机器人手臂作为与环境交互的智能体，并使用 DDPG 或分布式确定性策略梯度（D4PG）[9]（DRL
    算法的扩展）研究控制模型的特性。为了评估深度强化学习控制机器人的性能，对机器人手臂末端执行器的位置控制进行了计算实验，并比较了这些算法的性能。


    ## II. 深度强化学习


    ### A. DDPG [5]


    DDPG 算法通过策略近似和值函数近似将 DPG 集成到执行者-评论框架中。执行者（actor）在环境中采取行动，利用评论者（critic）提供的值函数来优化和增强其策略。评论者接收来自环境的奖励，并增强用于策略近似的值函数。在
    DDPG 算法中，使用深度神经网络将执行者表示为策略，评论者表示为值函数。因此，DDPG 算法是一种无模型的 DRL 算法。评论者网络的参数被用于最小化损失函数：


    $$L = \frac{1}{M} \sum_{i=1}^{M} (y_i - Q(s_i, a_i; \theta^Q))^2$$


    其中


    $$y_i = r_i + \gamma Q(s_{i+1}, \mu(s_{i+1}; \theta^\mu))$$


    其中执行者网络的参数使用以下梯度更新：


    $$\nabla_{\theta^\mu} J \approx \sum_{i=1}^{M} \nabla_a Q(s_i, a; \theta^Q)|_{a=\mu(s_i;
    \theta^\mu)} \times \nabla_{\theta^\mu} \mu(s_i; \theta^\mu)$$


    其中 $s_i, a_i$ 和 $r_i$ 表示智能体在第 $i$ 个时间步的状态、动作和奖励。$s_{i+1}$ 表示状态值函数；$\mu(s_{i+1})$
    表示代表当前策略的执行者函数；$\theta^\mu$ 和 $\theta^Q$ 分别表示评论者和执行者网络的权重；$\theta^\mu''$ 和 $\theta^Q''$
    分别表示目标评论者执行者网络的参数；$\gamma$ 是折扣率。


    ### B. D4PG [9]


    DDPG 算法尝试通过引入分布方法来提高 DDPG 的准确性：多个执行者，其中独立智能体将数据收集到公共的回放缓冲区中。此外，使用了 N 步回报（N-step
    returns），它在计算 TD 误差时使用 N 步目标而非单步目标来捕捉更多奖励。此外，引入了经验优先化允许在正常的回放策略中进行练习。评论者网络的参数使用以下梯度更新：


    $$\delta_w = \frac{1}{M} \sum_{i=1}^{M} \nabla_w(Y_i, Z_w(s_i; a_i))$$


    其中


    $$Y_i = \sum_{n=0}^{N-1} \gamma^n r_{i+n} + \gamma^N Z_w(s_{i+N})$$


    执行者网络的参数使用以下梯度更新：


    $$\delta_v = \frac{1}{M} \sum_{i=1}^{M} \nabla_\pi(s_i, a_i) E[\nabla_a Q(s_i,
    a)]_{a=\pi(s_i)}$$


    其中 $R$ 代表回放大小，$p_i$ 表示第 $i$ 个时间步的优先级，$d$ 是两个分布之间的距离$(s_i, a_i)$ 表示参数化的分布，$\pi(s)$
    表示参数化的策略。


    ## III. 计算实验


    为了评估 RL 技术控制机器人智能体的性能，需要机器人手臂直接与环境交互。在环境中，控制目标是到达某个任务，机器人手臂从任意初始位置移动并将其末端执行器保持在目标位置。我们使用了
    7 自由手臂（Dof 来自 Scius Tech，日本，京都，如图 1 所示）。肩部、肘部和腕部关节具有 2、2 和 3 个自由度的机器人手臂模型如图 1
    所示。对于计算实验，我们使用 Python 开发了运动模拟器，并实现了基于 DDPG 和 SAC 的 RL 算法来代表模拟器。


    ![](img/0d964d9c0f3cd7715fe07c9eb0edd363_1_0.png)


    A. 图 1. 机器人手臂概述（左：人形机器人，右：7 自由机器人手臂示意图（左：手臂））。


