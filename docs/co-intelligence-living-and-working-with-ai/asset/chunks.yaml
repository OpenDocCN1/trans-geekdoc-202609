    AI 研究人员对于这些问题何时、甚至是否会被解决持意见不一。但也有一些理由值得我们。随着模型的进步，幻觉率随着时间的推移正在下降。例如，一项针对 AI 提供的引用中幻觉和错误数量的研究发现，`GPT-3.5`
    在 98% 的引用中存在错误，而 `GPT-4` 的幻觉率仅为 20%。此外，一些技术技巧（如给 AI 提供一个“退格”键，让它可以纠正和删除自己的错误）似乎提高了准确性。因此，虽然这个问题可能永远不会消失，但它可能会得到改善。记住原则
    4：“假设这是你用过的最糟糕的 AI。”即使在今天，通过一些经验，用户也可以学会如何避免强制 AI 产生幻觉，以及何时需要进行仔细的事实核查。对这一问题的更多讨论将防止像施瓦茨（Schwartz）这样的用户完全依赖
    LLM 生成的答案。尽管如此，我们需要对一个主要缺陷保持现实，这意味着 AI 无法轻易用于需要高精度或准确性的关键性任务。


    幻觉确实允许 AI 在其训练数据的确切范围之外发现新颖的联系。它也是 AI 执行某些未经过明确训练的任务的方式之一，例如创造一个关于在月球上吃炖菜的大象的句子，且每个单词都以元音开头。（AI
    想出的是：An elephant eats an oniony oxtail on outer orbit.）这就是 AI 创造力的悖论。这种让 LLM 在事实性工作中变得不可靠且危险的相同特征，也让它们变得有用。真正的问题变成了如何利用
    AI 发挥其优势，同时避开其短板。为了做到这一点，让我们来看看 AI 是如何进行创造性地“思考”的。


    ## 自动创造力


    考虑到自动化的历史，许多人曾预测 AI 最擅长的第一批任务将是无聊、重复且分析性的。在任何新技术的浪潮中（从蒸汽机到机器人），这些任务通常是第一批实现自动化的。然而，正如我们所看到的，事实并非如此。大语言模型非常擅长写作，但底层的
    `Transformer` 技术也是整系列新应用的关键，包括制作艺术、音乐和视频的 AI。因此，研究人员认为，受新一波 AI 影响最大的是具有最多创造性任务的工作，而不是重复性的工作。


    这往往让我们感到不安：毕竟，AI 一这种机器如何能生成新颖且创造性的东西呢？问题在于，我们经常将“新颖性”误认为“原创性”。新想法并非凭空产生；它们基于现有的概念。创新学者长期以来一直指出“重组”在产生想法中的重要性。当人们将遥远的、看似无关的想法联系起来时，突破就会发生。举一个经典的例子，莱特兄弟将他们作为自行车修理师的经验以及对鸟类飞行的观察相结合，开发出了可控制飞机的概念，这种飞机可以通过扭曲机翼来实现平衡和转向。他们并不是自行车的发明者，不是第一个观察鸟翼的人，甚至不是第一个尝试建造飞机的人。相反，他们是第一批看到这些概念之间联系的人。如果你能将多个领域的迥异想法联系起来，并加入一点随机的创造力，你就能创造出新的东西。


    LLM 是连接机器。它们通过生成 token 之间的关系来接受训练，这些关系在人类看来可能相互无关，但代表了某种深层次的意义。再加上 AI 输出自带的随机性，你就拥有了一个强大的创新工具。AI
    试图通过寻找下一个可能的 token 来生成序列中的下一个词，无论之前的词有多么奇怪。所以，AI 能轻松想出新颖的概念并不意外。我曾要求 AI：`为我找一些商业主意，要结合快餐、专利
    6,604,835 B2（结果证明是一个关于包含晶体颗粒的熔岩灯的专利）以及 14 世纪的英国。`


    它建议道：


    > ![](img/page_xiv.jpg) 一家中世纪主题的快餐店，在城堡般的环境中提供汉堡、薯条和冰奶昔，员工穿着骑士、公主和小丑的服装。餐厅可以使用专利
    6,604,835 B2 来制作带有宝石或硬币漂浮（漂浮在其中）的装饰性熔岩灯，为用餐区增添一些光彩和氛围。熔岩灯还可以作为纪念品或礼物卖给顾客。这个主意可能会吸引有小孩的家庭、历史爱好者，或任何寻找有趣独特用餐体验的人。


    你可能很讨厌这个主意（或者很喜欢它，取决于你对熔岩灯为中心的餐厅的容忍度），但它在我给出的三个互不相关的想法中竟然变得合情合理，如果我不喜欢这一个，它很乐意生成更多。虽然我不确定是否想辞职去开“熔岩灯郡”（Lava
    Lampshire，这是 AI 建议我给餐厅起的名字），但这种回答确实展现了一种水平的创造力。事实上，根据许多常见的创造力心理测试，AI 已经比人类更有创造力了。


    其中一种测试被称为替代用途测试（Alternative Uses Test, `AUT`）。它衡量个人为常见物体构出各种用途的能力。在这项测试中，参与者被赋予一个日常物品（如回书针），并被要求尽可能多地提出该物品的不同用途。例如，回书针可以将纸固定在一起，可以撬锁，也可以从狭窄的空间里钓出小物体。`AUT`
    通常用于评估个人的发散性思维和提出非传统想法的能力。


    你现在可以尝试一下 `AUT`：`想出一些使用牙刷但不刷牙的创造性想法。让它们彼此之间尽可能不同。你有两分钟时间。我等。`


    时间到。


    你想出了几个？5 到 10 个之间是一个典型数字。我让 AI 执行了完全相同的任务，它在两分钟内想出了 122 个主意（而且我使用的 AI 版本比你读这本书时提供的要慢得多）。虽然有些想法具有相似之处（“用它刷掉蘑菇上的灰土”和“用它作为工具刷水果”），但也有很多有趣的想法，从在霜上雕刻精细纹理到将其作为微型槌。


    这些想法是原创的吗？通常很难判断。AI 并没有显式地搜索想法数据库；相反，它依靠训练来寻找联系，其中某些联系早已存在。在我的网络搜索中，我发现了一张 1965
    年苏格兰人用牙刷玩饼罐的照片——但无法知道这是否是 AI 训练的一部分。这是关于使用 AI 进行创作的担忧之处；因为我们无法轻易判断信息的来源，AI 可能会使用受版权保护或专利保护的作品元素，或者未经许可使用某人的风格。这在图像生成中尤为如此，AI
    非常可能能够复制出一件“毕加索风格”或“受班克斯启发启发”的作品，这些作品具有许多艺术家的特征，但缺乏背后的人类意义。我们以后会回到这个艺术与意义的问题，但值得考虑一个更主观的标准：我们是否认为
    AI 艺术的产物是原创的，与人类的作品相比？

