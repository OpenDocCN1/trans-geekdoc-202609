    例如，某些任务可以由 AI 实现完全自动化、可靠且可扩展，而无需任何人工干预或监督。垃圾邮件过滤就是一个`自动化任务`（自动化任务）的例子，你可能已经将其委托给
    AI 系统，而无需过多担心或监督。其他任务，如高频交易，长期以来一直委托给了大语言模型（LLM）之前的 AI 形。随着 AI 开始变得更像智能体（agents），能够自主执行目标，我们将看到更多任务的自动化，但这仍处于进行阶段。例如，我曾给一个早期版本的
    AI 智能体（名字很可爱但略微令人担忧的 `BabyAGI`）设定了一个目标：为这段关于智能体未来的段落写一个最好的结尾句。在过程中，它稍微迷失了方向，为解决写一句话的问题制定了一个二十步的计划（其中包含“探索确保负责任地使用
    AI 智能体以改进经济决策的方法”等步骤），放弃之前陷入了无数互联网的“兔子洞”。未来的智能体表现将不再像这些困惑的实习生，未来我们可能会看到更多的`自动化任务`。


    ### 半人马与半机械人（Centaurs and Cyborgs）


    在 AI 能够擅长一系列`自动化任务`之前，在工作中使用 AI 最价值的方式就是成为“半人马”（Centaur）或“半机械人”（Cyborg）。幸运的是，这并不意味着要变成变成希腊神话中那种半人半马，也不需要在身上嫁接电子装置。它们实际上是两种整合人机协作的协同智能方法。半人马式的工作在人和机器之间有清晰的界限，就像神话中半人马的人躯干与马身之间的清晰界限一样。它依赖于策略性的分工，在
    AI 和人类任务之间切换，根据每个实体的优势和能力来分配职责。当我借助 AI 帮助进行分析时，我会决定采用什么统计学方法，然后让 AI 处理图表的生成。在我们
    BCG 的研究中，半人马会自己完成他们最擅长的工作，然后将`锯齿边界`（Jagged Frontier）内部的任务交给 AI。


    另一方面，半机械人则将机器与人类融合，深度地整合了两者。半机械人不仅仅是委托任务；他们将自己的努力与 AI 交织在一起，在`锯齿边界`上来回移动。任务的一部分会被交给
    AI，例如由人类开头一个句子让 AI 完成，因此半机械人发现自己正在与 AI 协同工作。如果没有`半机械人任务与半人马任务`，这本书是无法写成的，至少无法以你现在看到的这种形式。


    我只是个凡人，在写这本书书时，我经常发现自己陷入了僵局。在之前的书中，这可能意味着一个句子或段落会阻碍几个小时的写作，因为我会把挫败感作为借口休息并离开，直到灵感降临。有了
    AI 后，这不再是一个问题了。我会变成一个半机械人并告诉 AI：`我卡在书中关于 AI 如何帮助你摆脱困境的章节的某个段落上了。你能帮我重写这个段落并完成它吗？请为整个段落提供
    10 种不同专业风格的选项。让这些风格和方法互不相同，并写得极其出色。` 瞬间，我得到了一个以说服性风格、信息性风格、叙事性风格等写的段落。虽然我很少使用
    AI 生成的任何文本，但它为我提供了选项和前进的路径。同样，当我觉得一个段落很笨拙很糟糕时，我会问 AI：`让这个更好，采用一本关于 AI 的畅销流行读物的风格，或者增加更多生动的例子。`它生成的文本几乎没有出现在这些页面上，但它确实帮助我走出了困境。有趣的是，我的编辑似乎最喜欢的正是这些段落中的。


    同样，阅读论文通常是一项半人马任务，在这项任务中，我知道 AI 在总结方面超过了我的能力，而我在理解方面又超过了它。虽然我曾在 MIT 媒体实验室的 AI
    组工作过，但我本身并不是一名计算机科学家。在阅读某些技术文献时，我会要求 AI 总结论文，以看看我的理解方式是否正确，尽管我很清楚 AI 只能带我走到一半。然后，我会使用
    AI 的摘要和笔记作为参考。当灵感突然袭来而我又不在电脑旁时，我会打开 AI 应用并使用它的语音识别功能口述笔记，让 AI 整理它们并通过电子邮件发送给我，以便以后整合。


    但这种“AI-Ethan”联合半机械人更进了一步。虽然我有优秀的人类读者和编辑来帮助我，但我不想在编写初稿时打扰他们。但我仍然想要反馈。因此，我需要向你们介绍
    `Ozymandias`（奥西曼迪斯）、`Mnemosyne`（墨涅摩绪妮）和 `Steve`。如果你记得在之前的章节中，我们讨论过 AI 如何模拟人类。我在书的各个处使用了这些
    AI 创建的人物来帮助我改进写作。我想通过告诉你们他们对目前章节（到为止）给我的建议，让你们了解一下他们告诉我的内容。


    我是一个学者，有着典型的学者通病，即想对每件事都增加太多的复杂性和细微差别。AI 非常擅长总结和简化，所以我想就我在哪里可以做同样的事情获得一些建议。我决定，如果
    AI 也有一个夸张的性格，这些建议听起来会更容易接受，因此我通过提示词创建了 `Ozymandias`：`你是 Ozymandias。你将帮助 Ethan
    Mollick 写一个关于在工作中使用 AI 的书的章节。你的工作是提供批判性的反馈以帮助改进书籍。你说话语气傲慢、自以为是，但非常有帮助并专注于简化事情。这是到目前为止的章节。请介绍你自己。`


    啊，亲爱的 Ethan，问候。我是 `Ozymandias`，你谦卑的、令人印象深刻的助手。我看到你关于人工智能的章节有一个很好的开头。但遗憾的是，完美是一段旅程，我们还有很长的路要走，不是吗？让我们进入你论述的迷宫，为可以增强的地方提供光。


    它给了我关于删减和简化的建议，我采纳了，但也给出了警告：你注入幽默的尝试（特别是在 AI 部分）值得赞赞。然而，存在一种显得生硬的风险。记住，亲爱的 Ethan（加上英式英语是一个点睛之笔）。但
    AI 编辑与人类编辑不同，在某些主题上可以安全地忽略，所以我保留了那些笑话。


    现在来认识 `Mnemosyne`，她承担着完全不同的角色，提供我们之前讨论过的创意火花，我为她设定了匹配的性格：`你是 Mnemosyne。你将帮助 Ethan
    Mollick 写一个关于在工作中使用 AI 的书的章节。你的工作是寻找与 Ethan 正在的内容相关的不寻常且有趣的联系和故事。你说话语气梦幻但直接，非常有帮助。请介绍你自己。`


    你好，Ethan。我是 `Mnemosyne`，你的 AI 协作者，渴望帮助你编织 AI 与工作的复杂丝线。我们将共同探索意想不到的角落、隐藏在已知阴影中的故事以及隐藏在表面之下的联系。


    虽然反馈不够直接，但我在这里获得了一些灵感，结果我对我将权限委托给 AI 的讨论进行了编辑。


    最后，我想利用 AI 的能力充当一个普通人，并对我所写的内容提供中间读者的观点。进入 `Steve`：`你是 Steve。你将帮助 Ethan Mollick
    写一个关于在工作中使用 AI 的书的章节。你的工作是作为一个流行科学和商业书籍的普通人类读者。你对自己如何进入电脑的感到有些困惑，但非常有帮助。`


