- fmt: '

    Second, leaders need to figure out a way to decrease the fear associated with
    revealing AI use. Assuming early studies are true and we see productivity improvements
    of 20 to 80 percent on various high-value professional tasks, I fear the natural
    instinct among many managers is “fire people, save money.” But it does not need
    to be that way. There are many reasons for companies to not turn efficiency gains
    into head-count reduction or cost reduction. Companies that figure out how to
    use their newly productive workforce should be able to dominate any company that
    tries to keep their post-AI output the same as their pre-AI output, just with
    fewer people. And companies that commit to maintaining their workforce will likely
    have employees as partners who are happy to teach others about the uses of AI
    at work, rather than scared workers who hide their AI for fear of being replaced.


    Convincing employees that this is the case is another matter. Perhaps organizations
    can offer guarantees that no employees will be laid off as a result of AI use,
    or promise that workers can use the time they free up using AI to work on more
    interesting projects, or even end work early. But there are hints buried in the
    early studies of AI about a way forward, toward a different working environment
    altogether. Workers, while worried about AI, tend to like using it because it
    removes the most tedious and annoying parts of their job, leaving them with the
    most interesting tasks. So, even as AI removes some previously valuable tasks
    from a job, the work that is left can be more meaningful and more high-value.
    This is not inevitable, of course, so managers and leaders must decide whether
    and how to commit themselves to reorganizing work around AI in ways that help,
    rather than hurt, their human workers. You need to ask: What is your vision about
    how AI makes work better rather than worse? And this is where organizations with
    high degrees of trust and good cultures will have an advantage. If your employees
    don’t believe you care about them, they will keep their AI use hidden.


    Third, organizations should highly incentivize AI users to come forward, and expand
    the number of people using AI overall. That means not just permitting AI use but
    also offering substantial rewards to people finding substantial opportunities
    for AI to help. Think cash prizes that cover a year’s salary. Promotions. Corner
    offices. The ability to work from home forever. With the potential productivity
    gains possible due to `LLMs`, these are small prices to pay for truly breakthrough
    innovation. And large incentives also show that the organization is serious about
    this issue.


    Finally, companies need to start thinking about the other component of effectively
    using AI: systems. The pressure for organizations to take a stand on a technology
    that affects their most highly paid workers will be immense, as will be the value
    of these workers becoming more productive. Without a fundamental restructuring
    of how organizations work, the benefits of AI will never be recognized.


    ### From Tasks to Systems


    We often take for granted the systems we use to structure and coordinate work
    in our organizations. We assume they are natural ways of getting things done.
    But in reality, they are historical artifacts, shaped by the technological and
    social conditions of their times. The organizational chart, for example, was originally
    made to run railroads in the 1850s. Developed by early railroad barons, they created
    a hierarchical system of authority, responsibility, and communication that enabled
    them to control and monitor the operations of their railroad empire. Enabled by
    the telegraph, they integrated humans into a clear hierarchy, with bosses giving
    orders that flowed through the rails and telegraph lines to the workers at the
    bottom of the chart. The system was so successful that it was soon adopted by
    other industries and organizations, becoming the standard model of bureaucracy
    for the twentieth century.


    Another system emerged from a different combination of human limitations and technology:
    the assembly line. Generally credited to Henry Ford in the early twentieth century,
    it allowed his company to mass-produce automobiles at a lower cost and higher
    speed. He realized that humans were not very good at performing complex and varied
    tasks, but they were very good at performing simple and repetitive work. He also
    noticed that technology could help him synchronize and optimize the flow of work,
    by using standardized tools and parts, and new technologies like conveyor belts
    and timers. He divided the production process into small and simple tasks, and
    assigned them to workers who performed them repeatedly and efficiently. His system
    was so successful that it revolutionized the manufacturing industry, creating
    economies of scale and scope and enabling mass consumption and customization.


    The internet marked another new set of technologies to organize and control work,
    which is why we have seen the emergence of new systems of work organization and
    management in recent decades, such as agile software development, lean manufacturing,
    holacracy, and self-managing teams. Enabled by waves of tools ranging from email
    to complex enterprise software, these management trends took new, data-driven
    approaches to organizing. But, like all work before, they still rely on human
    capabilities and limitations. Human attention remains finite, our emotions are
    still important, and workers still need bathroom breaks. The technology changes,
    but workers and managers are just people.


    This is what AI may alter. By acting as a co-intelligence managing work, or at
    least helping managers manage work, the enhanced capabilities of `LLMs` could
    radically change the experience of work. A single AI can talk to hundreds of workers,
    offering advice and monitoring performance. They could mentor, or they could manipulate.
    They could guide decisions in ways that are subtle or overt.


    Companies have been experimenting with forms of computerized control over workers
    since long before this generation of AI. Time clocks, cameras, and other forms
    of monitoring have been common for over a century, but these approaches kicked
    into high gear with the rise of pre-LLM AI, and especially the use of algorithms
    to control work and workers. Think of the gig worker hoping `Uber` will give them
    a good stream of customers, despite receiving a low rating from an angry passenger,
    or the `UPS` driver whose every minute of driving is scrutinized by an algorithm
    to see if they were efficient enough to keep their job. Katherine Kellogg of MIT,
    along with Melissa Valentine and Angèle Christin of Stanford, outlined how these
    new types of control were different from previous forms of management. Where managers
    previously had limited information about what workers were doing, algorithms were
    comprehensive and instantaneous, using massive amounts of data from many sources
    to track workers. The algorithms also work interactively, channeling workers in
    real time to whatever task the company wanted. And they are opaque—their biases,
    and even the way they make decisions—are hidden from workers.


    Wharton professor Lindsey Cameron saw this firsthand when she was a gig-working
    driver for six years as part of an intense ethnographic study of how workers deal
    with algorithmic management. Forced to depend on `Uber` or `Lyft`s algorithms
    to find work, they engage in covert forms of resistance to gain some control over
    their destiny. For example, drivers might worry that a particular rider could
    give them lower ratings (thus hurting their future earnings), so they will convince
    the rider to cancel before pickup, perhaps by claiming that the driver can’t see
    the potential pickup spot. But even these forms of resistance do not free drivers
    from the algorithm, which controls where they go, how much they make, and how
    they spend their time.

