    But the first society-wide benefits also begin to appear. Innovation has been
    slowing alarmingly in recent decades. In fact, a recent, convincing, and depressing
    paper found that the pace of invention is dropping in every field, from agriculture
    to cancer research. More researchers are required to advance the state of the
    art. In fact, the speed of innovation appears to be dropping by 50 percent every
    13 years, slowing down economic growth.


    Part of the issue appears to be a growing problem with scientific research itself:
    there is too much of it. The burden of knowledge is increasing, in that there
    is too much to know before a new scientist has enough expertise to start doing
    research themselves. This is also why half of all pioneering contributions in
    science now happen after age forty, when it used to be that younger scientists
    were the ones who achieved breakthroughs. Similarly, start-up rates of STEM PhDs
    are down 38 percent in the last 20 years. The nature of science is growing so
    complex that PhD founders now need large teams and administrative support to make
    progress, so they go to big firms instead. Thus, we have the paradox of our Golden
    Age of science. More research is being published by more scientists than ever,
    but the result is actually slowing progress! With too much to read and absorb,
    papers in more crowded fields are citing new work less and canonizing highly cited
    articles more.


    But there are already signs that AI can help. Research has successfully demonstrated
    that it is possible to correctly determine the most promising directions in science
    by analyzing past papers with AI, ideally combining human filtering with the AI
    software. And other work has found that AI shows considerable promise autonomously
    conducting scientific experiments, finding mathematical proofs, and more. It may
    be that the advances in AI can help us overcome the limitations of our merely
    human science and lead to breakthroughs in how we understand the universe and
    ourselves. Many of the original AI enthusiasts are, in fact, counting on the power
    of AI to figure out ways to radically extend and improve human lives. While linear
    growth in AI capabilities may not be able to achieve this lofty goal, if it is
    even achievable, it may help restart the slowing engines of progress.


    It is possible to see this scenario as gently turning up the temperature over
    time. AI comes to take a larger and larger role in our lives but gradually enough
    that disruption is manageable. And we also start to see some of the major benefits
    of AI as well: faster scientific discovery, increased productivity growth, and
    more educational opportunities for people all over the world. The results are
    mixed, but largely positive. And humans remain in control of the direction that
    AI takes.


    But AI has not been advancing in a linear way.


    ### Scenario 3: Exponential Growth


    Not all technological growth slows down quickly. Moore’s Law, which has seen the
    processing capability of computer chips double roughly every two years, has been
    true for fifty years. AI might continue to accelerate in this way. One reason
    this might occur is the so-called flywheel—AI companies might use AI systems to
    help them create the next generation of AI software. Once this process starts,
    it may be hard to stop. And at this pace, AI becomes hundreds of times more capable
    in the next decade. Humans are not very good at visualizing exponential change,
    and so our vision starts to rely far more on science fiction and guesswork. But
    we can expect massive changes everywhere. Everything in Scenario 2 happens, but
    at a much, much, much faster pace that we find correspondingly more difficult
    to absorb.


    In this scenario, risks are more severe and less predictable. Every computer system
    is vulnerable to AI hacking. AI-powered robots and autonomous AI agents, monitored
    by humans, could potentially drastically reduce the need for human work while
    expanding the economy. The adjustment to this shift, if it were to occur, is hard
    to imagine. It will require a major rethinking of how we approach work and society.

