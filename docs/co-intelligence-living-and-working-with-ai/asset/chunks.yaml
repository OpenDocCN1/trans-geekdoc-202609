- fmt: '

    # AI Creativity and Innovation


    A recent paper by Jennifer Haase and Paul Hanel did just that, having humans blindly
    judge the creativity of AIs compared to humans in the AUT. After testing AI and
    100 people on various objects, ranging from balls to pants, they found the `GPT-4`
    model outperformed all but 9.4 percent of humans tested in generating creative
    ideas, as judged by other humans. Given that `GPT-4` was the latest model tested,
    and it was much better than previous AI models, it might be expected that the
    creativity of AIs could continue to grow over time.


    Of course, there are other creativity tests as well. A popular one is the remote
    associates test (`RAT`). This test asks people to find the common word that connects
    a a set of three seemingly unrelated words. For example, `pine`, `crab`, and `sauce`
    are connected by the word `apple`. (Try one: What word connects `cream`, `skate`,
    and `water`? The AI got it right.) Unsurprisingly, as a connection machine, AI
    usually maxes out this test, too.


    While these psychological tests are interesting, human creativity tests aren’t
    necessarily definitive. There is always the chance that the AI has previously
    been exposed to the results of similar tests and is just repeating answers. And,
    of course, psychological testing is not necessarily proof that AI can actually
    come up with useful ideas in the real world. But we have evidence that AI is actually
    quite good at practical creativity as well.


    ## Out-Inventing Humans


    I know this is true, because they are out-inventing students in one of Wharton’s
    most well-known innovation classes. It’s a well-worn joke that `MBAs` are not
    necessarily the most innovative, but Wharton has generated a ton of start-ups,
    and many of them had their start in the innovation class run by professors `Christian
    Terwiesch` and `Karl Ulrich`. Along with their colleagues `Karan Girotra` and
    `Lennart Meincke`, they staged an idea generation contest to come up with the
    best products for a college student that would cost $50 or less. It was the `GPT-4`
    AI against 200 students. The students lost, and it wasn’t even close. AI was faster,
    obviously, generating a lot more ideas than the average person in any given time.
    But it was also better. When they asked sets of human judges whether they would
    be interested enough in the ideas to buy the product if it was ever made, AI ideas
    were more likely to attract financial interest. The degree of the victory was
    startling: of the 40 best ideas rated by the judges, 35 came from `ChatGPT`.


    We aren’t completely out of an innovation job, however, as other studies find
    that the most innovative people benefit the least from AI creative help. This
    is because, as creative as the AI can be, without careful prompting, the AI tends
    to pick similar ideas every time. The concepts may be good, even excellent, but
    they can start to seem a little same-y after seeing enough of them. Thus, a large
    group of creative humans will usually generate a wider diversity of ideas than
    the AI. All of this suggests that humans still have a large role to play in innovation...
    but that they would be foolish not to include AI in that process, especially if
    they don’t consider themselves highly creative.


    As should be obvious, some people are uniquely good at generating ideas and can
    apply this ability in almost every context. Indeed, recent research has shown
    that the “equal-odds rule” is true.


    ## Slogan Generation Examples for a Cheese Shop


    We asked AI to generate 20 slogans for a mail-order cheese shop:


    1. `A Brie-lliant Way to Doorstep!`

    2. `Cheese the Day, Right at Your Door.`

    3. `Life’s Better with Gouda.`

    4. `Unlock the Melt, Post by Post.`

    5. `Savor the Curd, Delivered to Your Turf!`

    6. `Aged to T.`

    7. `From Our Cave to Your Crave.`

    8. `Rethink Cheese—Mailed for Ease.`

    9. `Your Passport to Fromage.`

    10. `A Parcel of Pleasure, from Cheddar to Treasure.`

    11. `We’ve Got Your Cheese Needs Sealed and Delivered.`

    12. `We Make You Feta, One Package at Time.`

    13. `Where Dairy Meets Delivery.`

    14. `Every Letter Is Feta—the Cheesier, the Better.`

    15. `Cut the Queue, Get the Blue.`

    16. `Say Cheese and We’ll Mail It, Please.`

    17. `Cheesy Love, from Our Box to Your Block.`

    18. `No Whey We’re Ordinary, Get Your Cheesy Story.`

    19. `Quality Aged, Perfectly Packaged.`

    20. `Embrace the Rind, Love Delivered in Kind.`


    And... most of the ideas are terrible, and some are incoherent, and a few have
    potential (and bad puns). It took us no time to generate 20 ideas, and it is costless
    to skim them to see if they inspire better. I am a little bit partial to `Cut
    the Queue, Get the Blue` and `From Our Cave to Your Crave.` But if none of those
    sparked your interest, ask for another 20 with different prompting. Or ask it
    to consider a particular customer (a cheese shop that will appeal to novices or
    children) or to change the context of the prompt in other ways.


    Another key aspect of idea generation is to embrace variance. Research shows that,
    to find good novel ideas, we likely have to come up with many bad novel ideas
    because most new ideas are pretty bad. Fortunately, we are good at filtering out
    low-quality ideas, so if we can generate novel ideas quickly and at low cost,
    we are more likely to generate at least some high-quality gems. So we want the
    AI answers to be weird.

    '
