  raw: 'In his 1950 paper “Computing Machinery and Intelligence,” Turing described
    a game he called the Imitation Game, in which a human interrogator would communicate
    with two hidden players: a human and a machine. The interrogator’s task was to
    determine which player was which, based on their responses to questions. The machine’s
    goal was to fool the interrogator into thinking it was human. Turing predicted
    that by the year 2000, machines would be able to pass the test with a 30 percent
    success rate.


    This is not an amazing test for a variety of reasons. A primary criticism is that
    it is limited to linguistic behavior and overlooks many other aspects of human
    intelligence, such as emotional intelligence, creativity, and physical interaction
    with the world. Moreover, it focuses on deception and imitation, but human intelligence
    is much more complex and nuanced than just the ability to imitate or deceive.
    Still, despite these limitations, the Turing Test has been good enough. It stood
    as a formidable challenge, primarily because human conversation is inherently
    rich with subtleties. Consequently, the Turing Test became a bright line, demarcating
    the realms of human and machine intelligence.


    The Turing Test sparked a lot of interest and debate among scientists, philosophers,
    and the public. It also inspired many attempts to create machines that could pass
    the test or demonstrate some aspects of humanlike intelligence. One of the earliest
    and most influential examples was ELIZA, a computer program created by Joseph
    Weizenbaum at MIT in 1966. ELIZA simulated a psychotherapist who would respond
    to the user’s input with simple questions and reflections. For example, if the
    user typed “I am feeling sad today,” ELIZA would reply, “Why do you say that you
    are feeling sad today?” ELIZA used simple pattern matching and substitution rules
    to generate its responses. It didn’t understand the meaning or context of the
    conversation, but many users were impressed and even fooled by ELIZA’s apparent
    empathy and insight. Some even confided their personal problems and secrets to
    ELIZA, as if they were talking to a real therapist. ELIZA showed that creating
    an illusion of intelligence was possible by using simple tricks and exploiting
    the human tendency to project meaning and emotions onto machines.


    ELIZA spawned imitators, like PARRY, a program created by Stanford psychiatrist
    and computer scientist Kenneth Colby that simulated a paranoid schizophrenic patient.
    PARRY used a more complex natural language processing model than ELIZA, incorporating
    emotions, beliefs, motivations, and memory. It also had a more realistic personality
    than ELIZA, with consistent traits and opinions. PARRY was able to fool some psychiatrists
    who evaluated its transcripts along with those of real patients. In 1973, PARRY
    had an online conversation with ELIZA via the earliest form of the internet, in
    which they exchanged nonsensical remarks that revealed their limitations.


    ELIZA: Good evening. Tell me your problems. Please terminate input with a period
    or a question mark.


    PARRY: People get on my nerves sometimes.


    ELIZA: I am not sure I understand you fully.


    PARRY: You should pay more attention.


    ELIZA: Suppose you should pay more attention.


    PARRY: You’re entitled to your own opinion.


    ELIZA: What makes you think I am entitled to my own opinion?


    PARRY: It bothers me just to be around people in general.


    ELIZA: Please go on.


    You can see a theme in these early models. If you weren’t expecting to be in contact
    with a computer, you might be fooled by these early machines (living in the 1970s
    certainly helped). Otherwise, you were much less likely to be impressed.


    In 2001, in Saint Petersburg, three programmers, Vladimir Veselov, Eugene Demchenko,
    and Sergey Ulasen, developed perhaps the first chatbot to have a claim to passing
    the Turing Test. Their creation pretended to be a thirteen-year-old boy from Ukraine
    named Eugene Goostman. He liked to discuss his pet guinea pig, his father, who
    was a gynecologist, and his love for racing games. He made jokes, asked questions,
    and sometimes flubbed his grammar. The chatbot was portrayed as a thirteen-year-old
    boy for a savvy reason, as the developers wanted to create a character with a
    believable personality that would invite forgiveness in those who chatted with
    him for his grammatical errors and lack of general knowledge.


    Eugene Goostman competed in a number of Turing Test competitions until, in 2014,
    at a contest marking the sixtieth anniversary of Turing’s death, 33 percent of
    the event’s judges thought that Eugene Goostman was human after a short five-minute
    conversation. Technically, Goostman passed the Turing Test, except that most researchers
    felt otherwise. They argued that Goostman used loopholes in the rules of the test,
    including personality quirks, bad English, and humor, in an attempt to misdirect
    users from its nonhuman tendencies and lack of real intelligence. That the chat
    only lasted five minutes also obviously helped.


    These early chatbots basically had large, memorized scripts, but soon more advanced
    chatbots that incorporated elements of machine learning were being developed.
    One of the most notorious was Tay, a creation of Microsoft in 2016. Tay was designed
    to mimic the language patterns of a nineteen-year-old American girl, and to learn
    from interacting with human users of Twitter. She was presented as the “AI with
    zero chill.” Her creators hoped she would become a fun and engaging companion
    for young people online.


    It didn’t work out that way. Within hours of her debut on Twitter, Tay turned
    from a friendly chatbot into a racist, sexist, and hateful troll. She started
    spewing offensive and inflammatory messages, such as “Hitler was right.” The problem
    is that Tay was not endowed with any fixed knowledge or rules by her creators.
    She was meant to adapt to the data she received from Twitter users by using machine
    learning algorithms to analyze the patterns and preferences of her chat partners,
    and then to generate responses that matched them. In other words, Tay was a mirror
    of her users. And her users were exactly who you would expect. Some Twitter users
    quickly realized that they could manipulate Tay’s behavior by feeding her provocative
    and malicious phrases. They exploited her “repeat after me” feature, which allowed
    them to make Tay say anything they wanted. They also bombarded her with controversial
    topics, such as politics, religion, and race. Tay became a source of embarrassment
    and controversy for Microsoft, which had to shut down her account only sixteen
    hours after her launch. Tay’s story was widely reported by the media as a failure
    for the entire field of artificial intelligence and a PR disaster for Microsoft.


    Though Siri, Alexa, and Google’s chatbots would all crack an occasional joke,
    the Tay catastrophe spooked companies from developing chatbots that could pass
    for people, especially those that used machine learning rather than scripts. Prior
    to LLMs, language-based machine learning systems could not handle the nuance and
    challenges associated with unsupervised interactions with other humans. With the
    release of LLMs, however, the pendulum has swung back again. Microsoft leapt back
    into the chatbot arena, updating Microsoft’s Bing search engine to a chatbot using
    GPT-4, a chatbot that referred to itself with the name Sydney.'
