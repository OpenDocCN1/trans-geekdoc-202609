- fmt: '

    In regular surgical training, experienced doctors and trainee residents can work
    next to each other, with the doctor carefully helping the resident as they watch
    and try techniques. With robotic surgery, there is just one seat that controls
    the robot, usually filled by the senior surgeon, while trainees are reduced to
    watching, getting brief turns at the machine, or just using simulators. Under
    tremendous time pressure, residents had to choose between learning traditional
    surgery skills or figuring out how to use these new robots on their own time.
    While many doctors ended up undertrained, those who wanted to learn how to use
    robotic surgery equipment turned away from official channels. They did their own
    “shadow learning” by watching YouTube channels or training more on live patients
    than they probably should have.


    This same sort of training crisis is going to spread as AI automates more and
    more basic tasks. Even as experts become the only people who can effectively check
    the work of ever more capable AIs, we are in danger of stopping the pipeline that
    creates experts. The way to be useful in the world of AI is to have high levels
    of expertise as a human. The good thing is that educators know something about
    how to make experts. Doing so, ironically, means returning to the basics—but adapted
    for a learning environment that has already been revolutionized by AI.


    ### Building Expertise in the Age of AI


    AI is good at finding facts, summarizing papers, writing, and coding tasks. And,
    trained on massive amounts of data and with access to the internet, Large Language
    Models seem to have accumulated and mastered a lot of collective human knowledge.
    This vast and tappable storehouse of knowledge is now at everyone’s fingertips.
    So it might seem logical that teaching basic facts has become obsolete. Yet it
    turns out the exact opposite is true.


    This is the paradox of knowledge acquisition in the age of AI: we may think we
    don’t need to work to memorize and amass basic skills, or build up a storehouse
    of fundamental knowledge—after all, this is what the AI is good at. Foundational
    skills, always tedious to learn, seem to be obsolete. And they might be, if there
    was a shortcut to being an expert. But the path to expertise requires a grounding
    in facts.


    Learning any skill and mastering any domain requires rote memorization, careful
    skills building, and purposeful practice, and the AI (and future generations of
    AI) will undoubtedly be better than a novice at many early skills. For example,
    researchers at Stanford found that the `GPT-4` AI scored higher than first- and
    second-year medical students at their final clinical reasoning exams. The temptation,
    then, might be to outsource these basic skills to the AI. After all, doctors are
    happy to use medical apps and the internet to help diagnose patients instead of
    simply memorizing medical information. Isn’t this the same thing?


    The issue is that in order to learn to think critically, problem-solve, understand
    abstract concepts, reason through novel problems, and evaluate the AI’s output,
    we need subject matter expertise. An expert educator, with knowledge of their
    students and classroom, and with pedagogical content knowledge, can evaluate an
    AI-written syllabus or an AI-generated quiz; a seasoned architect, with a comprehensive
    grasp of design principles and building codes, can evaluate the feasibility of
    an AI-proposed building plan; a skilled physician, with extensive knowledge of
    human anatomy and diseases, can scrutinize an AI-generated diagnosis or treatment
    plan. The closer we move to a world of Cyborgs and Centaurs in which the AI augments
    our work, the more we need to maintain and nurture human expertise. We need expert
    humans in the loop.


    ### The Requirement of Deliberate Practice


    So let’s consider what it takes to build expertise. First, it requires a plan.
    After that, we have to practice. It isn’t just a certain amount of practice time
    that is important (10,000 hours is not a magical threshold, no matter what you
    read), but rather, as psychologist Anders Ericsson discovered, the type of practice.
    Experts become experts through deliberate practice, which is much harder than
    merely repeating a task. Instead, deliberate practice requires serious engagement
    and a continual ratting up of difficulty. It also requires a coach, teacher, or
    mentor who can provide feedback and push the learner outside their comfort zone.


    Take, for instance, the world of classical piano. Imagine two students: Sophie
    and Naomi. Sophie spends her afternoons playing the same pieces she’s comfortable
    with over and over again. She might do this for hours on end, believing that sheer
    repetition will improve her skills. She feels a sense of accomplishment as she
    gets better and better at this work. Naomi, on the other hand, conducts her practice
    sessions under the guidance of a seasoned piano instructor. She begins by playing
    scales and then moves on to progressively challenging pieces. When she makes mistakes,
    her instructor points them out, not to chastise her but to help her understand
    and rectify them. Naomi also regularly sets goals for herself, like mastering
    a particularly tricky section of a piece or improving her speed and agility on
    certain passages. The process is much less fun than Sophie’s experience, because
    Naomi’s challenges escalate with her skill, making sure she is always facing some
    degree of difficulty. Yet over time, even if both students clock in the same number
    of practice hours, Naomi will likely surpass Sophie in skill, precision, and technique.
    This difference in approach and outcome illustrates the gap between mere repetition
    and deliberate practice. The latter, with its elements of challenge, feedback,
    and incremental progression, is the true path to mastery.


    But this sort of practice is very hard. It requires a plan, as well as a coach
    who can continually provide feedback and mentorship. Good coaches are rare, and
    are skilled experts in their own right, making it hard to get the coaching required
    for success in deliberate practice. AI may be able to help directly address these
    issues, creating a better training system than we have today.

