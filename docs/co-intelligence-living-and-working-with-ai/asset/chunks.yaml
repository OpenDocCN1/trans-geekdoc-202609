    AIs. At the end of the practice session, this AI grades them on their performance
    before passing them to a final AI, prompted to act as a mentor. This final interaction
    helps them make sense of what they learned and encourages them to try again. While
    we had to improvise around the weak spots of current AI models with this elaborate
    system, such as its lack of memory, in the future, we might expect an AI to handle
    all these roles naturally. This could be a big boost to gaining expertise.


    ### When Everyone Is an Expert


    I have been making the argument that expertise is going to matter more than before,
    because experts may be able to get the most out of AI coworkers and are likely
    to be able to fact-check and correct AI errors. But even with deliberate practice,
    not everyone can become an expert in everything. Talent also plays a role. As
    much as I might love to be a world-class painter or soccer star, I never will
    be, no matter how much I practice. In fact, for the most elite athletes, deliberate
    practice explains only 1 percent of their difference from ordinary players—the
    rest is a mix of genetics, psychology, upbringing, and luck.


    And this doesn’t apply just to athletes. Silicon Valley tells stories of the “10x
    engineer.” That is, a highly productive software engineer is up to 10 times better
    than an average one. This is actually a topic that has been studied repeatedly,
    although most of those studies are quite old. But those experiments find an even
    larger effect than 10x. The gap between the programmers in the top 75th percentile
    and those in the bottom 25th percentile can be as much as 27 times along some
    dimensions of programming quality. Add this to my own research looking at a job
    that many people find incredibly boring and cookie-cutter—middle management. In
    my study of the video game industry, I found that the quality of the middle manager
    overseeing a game explained more than a fifth of the game’s eventual revenues.
    That was a bigger effect than the entire senior management team, and more than
    the designers who came up with the creative ideas for the game itself.


    If you are able to find, train, and retain these top workers, you get tremendous
    benefits. A large part of schooling and work is focused on getting people to this
    highly skilled state. However, people who are good at one skill may not be good
    at another. Modern professional work consists of a wide range of activities rather
    than a single specialization. For example, the job of a doctor may require many
    tasks, like diagnosing patients, providing treatment, offering advice, filling
    out expense reports, and overseeing the office staff. It is unlikely that any
    doctor is equally good at all these tasks. Even the best workers have weak spots,
    requiring that they be part of larger organizations to ensure they can focus on
    their area of expertise.


    Except, as we discussed earlier, we already know one major effect of AI: it levels
    the playing field. If you were in the bottom half of the skill distribution for
    writing, idea generation, analyses, or any of a number of other professional tasks,
    you will likely find that, with the help of AI, you have become quite good. This
    isn’t a new phenomenon—the robot surgeons we discussed at the start of the chapter
    are the most helpful for the lowest performers—but AI is much more general purpose
    than robot surgeons.


    In field after field, we are finding that a human working with an AI co-intelligence
    outperforms all but the best humans working without an AI. In our study of Boston
    Consulting Group, where previously the gap between the average performances of
    top and bottom performers was 22 percent, the gap shrank to a mere 4 percent once
    the consultants used GPT-4. In creative writing, getting ideas from AI “effectively
    equalizes the creativity scores across less and more creative writers,” according
    to one study. And law students near the bottom of their class using AI equalized
    their performance with folks at the top of the class (who actually saw a slight
    decline when using AI). The authors of the study concluded, “This suggests that
    AI may have an equalizing effect on the legal profession, mitigating inequalities
    between elite and nonelite lawyers.” It gets more extreme. I participated in a
    panel discussion of the future of education with the CEO of Turnitin, the plagiarism-detecting
    company. He said, “Most of our employees are engineers and we have a few hundred
    of them . . . and I think in eighteen months we will need twenty percent of them,
    and we can start hiring them out of high school rather than four-year colleges.
    Same for sales and marketing functions.” I could hear gasps from the audience.'
