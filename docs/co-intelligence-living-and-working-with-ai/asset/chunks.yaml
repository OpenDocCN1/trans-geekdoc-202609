    AI makes too many mistakes to use in an automated fashion. Though that starts
    to change when other systems enforce the accuracy of AI answers. For example,
    I often ask it to write Python programs to solve problems. I don’t know Python,
    but if the AI makes a mistake, the code will not work. Further, the AI takes the
    error code the Python compiler generates and uses that to adjust its own strategy.
    You will want to keep an eye on the growing capabilities of AI in the future to
    see how opportunities to automate tasks might grow.'
