  trans: '

    即使 AI 不再进一步进展，它的某些影响也已不可避免。AI 带来的第一波必然变化将是关于我们理解和误解世界的方式。现在已经无法区分 AI 生成的图像与真实照片了，这只需使用今天任何人都可以使用的工具就能实现。视频和语音的伪造也轻而易举。网络信息环境将变得完全无法管理，事实核查员会被洪流般的信息淹没。现在创建虚假图像比拍摄真实照片仅稍微困难一点。任何关于政治家、名人或战争的图像都可能是伪造的——无从辨别。我们对于哪些事实是真实的这种本就脆弱的共识很可能会迅速崩塌。


    技术解决方案不太可能拯救我们。试图通过对 AI 作品添加水印来追踪图像和视频来源的尝试，可能会通过对底层内容进行相对简单的修改而破解。而且这还假定伪造图像和视频的人使用的是商业工具——随着政府开发自己的系统以及开源模型的泛滥，识别
    AI 生成的内容将变得更加困难。也许在将来的某个时刻，AI 可以帮助我们剔除杂质，但 AI 在检测 AI 内容方面是出名的不可靠赖，因此这似乎也不可能。


    这种情况只有几种可能的解决方式。也许人们对主流媒体的信任会复苏，主流媒体可能成为图像和故事真伪的仲裁者，仔细追踪每个故事和作品的来源。但这似乎不太可能。第二种选择是我们将进一步分裂成不同的“部落”，只相信我们想相信的信息，并将任何我们不想关注的信息视作虚假。很快，甚至即使是最基本的事实也将引发争议。这种日益封闭的信息孤泡的增长似乎更有可能，它加速了在大语言模型（LLM）时代之前的趋势。最后一种选择是我们完全彻底放弃网络新闻来源，因为它们充斥了太多虚假信息，以至于不再有用。无论我们向哪个方向发展，即使
    AI 没有进展，我们与信息互动的方式也将发生改变。


    我们与 AI 的个人关系也会发生变化。目前的系统已经足够像人类了，研究表明，通过少量的微调，AI 可以变得更具吸引力，甚至可能达到令人担忧的程度。在一个拥有数百万用户的平台上进行的一项大型实验显示，训练模型产生能让人们持续聊天的结果，可以使用户留存率增加
    30%，对话时间也更长。这表明，即使没有技术进步，与机器人聊天也将变得极具吸引力。目前的系统还不足以成为深度对话伙伴，但我们可能开始看到个人选择与 AI 的互动多于与人的互动。


    我们已经讨论过的其他趋势现在也是不可避免的。即使假设 `LLMs` 不会有进一步改进，AI 也对许多工作者的任务产生巨大影响，特别是那些从事高薪创意和分析工作的人。然而，处于目前状态的
    AI 为 `Cyborg` 任务留下了大量空间，而且人类的能力在许多情况下超过了 AI 的能力。如果 AI 不进一步发展，工作将会发生变化，但它可能会作为人类的补充，减轻繁琐工作的负担并提高性能，特别是在低表现者中。这并不意味着某些工作和行业将不会受到威胁——例如，大多数翻译工作可能会在很大程度上被
    AI 取代——但在大多数情况下，AI 不会取代人类劳动。目前的系统在理解上下文、细微差别和规划方面的理解还不够深刻。


    这种情况可能会改变。


    ### 场景 2：缓慢增长


    AI 的能力正以指数级增长，但技术领域大多数指数级增长最终都会放缓。AI 可能很快就会遇到这一瓶颈。在实践中，这意味着增长不再每年增加十倍，而是增长放缓，每年可能增长
    10% 或 20%。这种现象发生有很多原因。训练成本的激增和监管要求都是可能性。包括教授（以及 Meta 首席 AI 科学家）Yann LeCun 在内的许多科学家所认为的，我们也很快就会遇到大语言模型的技术极限。这将要求我们找到新的技术方法来开发
    AI 以持续下去。无论发生如何，这种缓慢的改进仍然代表了令人印象深刻的变革速度，尽管这种速度是可以理解的。想象一下电视每年都会稍微好一点。你不需要扔掉旧电视，但新电视可能比你几年前买的要好且便宜得多。通过这种线性变化，我们可以预见未来的到来并为此制定计划。


    场景 1 中发生的一切仍然会发生。坏人仍然会利用 AI 伪造网络信息，但随着时间的推移，AI 处理更复杂工作的能力让他们变得更加危险。你的电子邮箱信箱会被精准针对你的个性化信息所淹没（广告公司已经在通过
    AI 为数百万用户制作个性化视频），其中一些是诈骗或钓鱼尝试。你会接到用亲人声音的电话，索要保释金。在下一次战争期间，每个国防部官员都会开始收到非常具体的威胁短信，内容是
    AI 生成的其家庭视频。无能的罪犯和恐怖分子利用 AI 提升性能的能力，成为更高效的杀手。


    这些都是可怕的可能性，但因为 AI 是以适度的速度进展的，最坏的结果不会发生。早期使用 AI 生成危险化学品或武器的事件可能会导致有效的监管，以减缓危险用途的扩散。公司和政府的联盟，也许开源隐私倡导者，可能会时间制定使用规则，让人们以可以验证的方式建立身份，从而消除一些身份冒充的威胁。


    每年，AI 生成的人格变得更加真实，进一步推向边界。视频游戏中充满了 AI 生成的非玩家角色，第一批个性化 AI 电影开始出现，你可以选择场景或角色的发展方式。使用
    AI 心理医生变得更加正常，与真实人类和 AI 聊天机器人的混合互动成为我们经营的常态。再次，AI 的缓慢增长为社会适应这种变化提供了机会。法律要求标记 AI
    内容，围绕将聊天机器人作为朋友的社会规范将继续确保大多数人与真实的人共度时光。


    工作变得日益转型。每年，AI 模型都能做到比前一年所做的更多，在各个行业中产生涟漪。首先，每年价值 1000 亿美元的呼叫中心市场随着 AI 代理开始补充人工代理而发生转型。接下来，大多数广告和营销写作主要由
    AI 完成，仅由人类 `Cyborg` 提供有限指导。很快，AI 正在执行许多分析任务，并承担越来越多的编码和编程工作。但总的来说，由于变化速度较慢，这种冲击浪看起来与过去的通用技术浪相似。任务的变化大于职位的变换，创造的工作比销毁的多。对再培训的重点关注以及与
    AI 协作技能的关注有助于减轻最坏的风险。


