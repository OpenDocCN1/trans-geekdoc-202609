    It is possible to see this scenario as gently turning up the temperature over
    time. AI comes to take a larger and larger role in our lives but gradually enough
    that disruption is manageable. And we also start to see some of the major benefits
    of AI as well: faster scientific discovery, increased productivity growth, and
    more educational opportunities for people all over the world. The results are
    mixed, but largely positive. And humans remain in control of the direction that
    AI takes.


    But AI has not been advancing in a linear way.


    ### Scenario 3: Exponential Growth


    Not all technological growth slows down quickly. Moore’s Law, which has seen the
    processing capability of computer chips double roughly every two years, has been
    true for fifty years. AI might continue to accelerate in this way. One reason
    this might occur is the so-called flywheel—AI companies might use AI systems to
    help them create the next generation of AI software. Once this process starts,
    it may be hard to stop. And at this pace, AI becomes hundreds of times more capable
    in the next decade. Humans are not very good at visualizing exponential change,
    and so our vision starts to rely far more on science fiction and guesswork. But
    we can expect massive changes everywhere. Everything in Scenario 2 happens, but
    at a much, much, much faster pace that we find correspondingly more difficult
    to absorb.


    In this scenario, risks are more severe and less predictable. Every computer system
    is vulnerable to AI hacking, and AI-powered influence campaigns are everywhere.
    AIs, still controlled by humans, generate dangerous new pathogens and chemicals,
    helping governments and terrorist cells achieve new methods of destructiveness.
    There were already signs of this occurring with primitive, pre-LLM AIs: AI researchers
    building a tool to find new drugs to save lives realized it could do the opposite,
    generating new chemical warfare agents. Within six hours, it invented deadly VX
    nerve gas . . . and worse things. With widespread, powerful AIs, militaries and
    criminals use AI to amplify their efforts. And unlike in the previous scenario,
    our current governmental systems do not have time to adjust in the usual way.


    Instead, these AI bad actors are held in check by “good” AIs. But there is an
    Orwellian tinge to this solution. Everything we see needs to be filtered through
    our own AI systems to remove dangerous and misleading information, creating its
    own risk of filter bubbles and bad information. Governments use AI to crack down
    on AI-powered crime and terrorism, creating the danger of AI-tocracy, as ubiquitous
    surveillance enables both dictators and democracies to establish more control
    over the citizens. The world looks more like a cyberpunk struggle between authorities
    and hackers, all using AI systems.


    AI companions become far more compelling to speak with than most other people,
    and can communicate seamlessly with us in real time, a change that happens faster
    than anyone expected. Loneliness becomes less of an issue, but new forms of social
    isolation emerge, in which some people would rather interact with AIs than with
    humans. AI-powered entertainment provides incredibly customized and unique experiences
    that mix games, stories, and movies. This doesn’t mean that everyone becomes an
    introvert, speaking only to artificial intelligences. They are still not sentient
    in this scenario, and humans will still want to do human things with other people.


    And in working with people, AI can help unlock human potential. AI therapists
    and assistants help people who want to improve themselves do so in new ways. The
    ability to use AI to accomplish tasks in days that would otherwise take years
    allows new types of entrepreneurship and innovation to flourish. I have already
    spoken to physicists and economists who are able to do much more focused research
    because AI serves as both a source of inspiration and a way of outsourcing time-consuming,
    pricey programming and grant-writing tasks. Perhaps AI companions will help us
    all achieve goals that were previously out of reach. And it is probably good that
    this is possible, because we are all likely to have more free time under this
    scenario.


    With exponential change, AIs a hundred times better than GPT-4 start to actually
    take over human work. And not just office work, either, as there is some early
    evidence that LLMs may help us overcome the barriers that have made building working
    robots so challenging. AI-powered robots and autonomous AI agents, monitored by
    humans, could potentially drastically reduce the need for human work while expanding
    the economy. The adjustment to this shift, if it were to occur, is hard to imagine.
    It will require a major rethinking of how we approach work and society. Shortened
    workweeks, universal basic income, and other policy changes might become a reality
    as the need for human work decreases over time. We will need to find new ways
    to occupy our free time in meaningful ways, since so much of our current life
    is focused around work.'
