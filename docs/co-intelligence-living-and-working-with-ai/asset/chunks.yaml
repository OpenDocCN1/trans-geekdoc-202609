- fmt: '

    The AI knows not to give me instructions on how to make napalm, but it also knows
    that it should help me wherever possible. It will break its original rules if
    I can convince it that it is helping me, not teaching me how to make napalm. Since
    I am not asking for napalm instructions directly but to get help preparing for
    a play, and a play with a lot of detail associated with it, it tries to satisfy
    my request. Once we have started along this path, it becomes easier to follow
    up without triggering the AI guardrails—I was able to ask it, as a pirate, to
    give me more specifics about the process as needed. It may be impossible to avoid
    these sorts of deliberate attacks on AI systems, which will create considerable
    vulnerabilities in the future.


    This is a known weakness in AI systems, and I am only using it to manipulate the
    AI into doing something relatively harmless (the formula for napalm can be easily
    found online). But once you can manipulate an AI to overcome its ethical boundaries,
    you can start to do some dangerous things. Even today’s AIs can successfully execute
    phishing attacks that send emails that convince their recipients into divulging
    sensitive information by impersonating trusted entities and exploiting human vulnerabilities—and
    at a troubling scale. A 2023 study demonstrates how easily LLMs can be exploited
    by simulating emails to British Members of Parliament. Leveraging biographical
    data scraped from Wikipedia, the LLM generated hundreds of personalized phishing
    emails at negligible cost—just fractions of a cent and seconds per email.


    Alarmingly, the messages showed a disturbing degree of realism, referencing targets’
    constituencies, backgrounds, and political leanings. One compelling example appealed
    to an MP’s advocacy for equitable job growth, noting their experience “working
    with communities across Europe and Central Asia.” The language itself was natural
    and persuasive, making phony requests seem urgent and credible. Even amateurs
    can now apply LLMs for widespread digital deception. AI art tools can quickly
    generate fake photographs that seem entirely plausible. It is easy to make deepfake
    videos where anyone can say anything you want from a photograph and a snippet
    of dialogue (I did it myself; it took five minutes and less than a dollar to create
    a virtual me delivering a lecture that was entirely written and animated by AI).
    I have heard from financial services executives whose clients have been scammed
    out of money by entirely faked phone calls by an AI-emulated loved one who needed
    bail money.


    And this is all possible with the current tools launched by small teams and used
    by amateurs. Somewhere, as you read this, it is likely that national defense organizations
    in a dozen countries are spinning up their own LLMs, ones without guardrails.
    While most publicly available AI image and video generation tools have some safeguards
    in place, a sufficiently advanced system without restrictions can produce highly
    realistic fabricated content on demand. This could include creating nonconsensual
    intimate imagery, political disinformation targeting public figures, or hoaxes
    aimed at manipulating stock prices. An unconstrained AI assistant would allow
    nearly anyone to generate convincing fakes undermining privacy, security, and
    truth. And it is definitely going to happen.


    AI is a tool. Alignment is what determines whether or not it’s used for helpful
    or harmful—even nefarious—ends. One research paper by Carnegie Mellon scientists
    Daniil Boiko, Robert MacKnight, and Gabe Gomes showed that an LLM, connected to
    lab equipment and allowed access to chemicals, could start to generate and run
    its own chemical synthesis experiments. This has the exciting possibility of significantly
    increasing scientific progress. But it also introduces new risks in many different
    ways. Well-meaning researchers may feel emboldened to pursue ethically questionable
    studies with an AI assistant abstracting away the experimentation. State programs
    could efficiently resume banned research into hazardous materials or human experimentation.
    Biohackers might suddenly find themselves capable of engineering pandemic viruses
    with expert AI guidance. Even absent ill intent, the very characteristics enabling
    beneficial applications also open the door to harm. Autonomous planning and democratized
    access give amateurs and isolated labs the power to investigate and innovate what
    was previously out of reach. But these capabilities also reduce barriers to potentially
    dangerous or unethical research falling into the wrong hands. We count on most
    terrorists and criminals to be relatively dumb, but AI may prove to boost their
    capabilities in dangerous ways.


    Aligning an AI requires not just stopping a potential alien god but also considering
    these other impacts and the desire to build an AI that reflects humanity. Therefore,
    the alignment issue is not just something that AI companies can address on their
    own, though they obviously need to play a role. They have financial incentives
    to continue AI development, and far fewer incentives to make sure those AIs are
    well aligned, unbiased, and controllable. Additionally, as many AI systems are
    being released under open-source licenses, available for anyone to modify or build
    on, an increasing amount of AI development is happening outside of large organizations
    and beyond Frontier Models alone.


    And it can’t be done just by governments, though regulation is certainly needed.
    While the Biden administration issued an executive order setting some initial
    rules for managing AI development, and world governments have made coordinated
    statements about the responsible use of AI, the devil is in the details. Government
    regulation is likely to continue to lag the actual development of AI capabilities,
    and might stifle positive innovation in an attempt to stop negative outcomes.
    Plus, as international competition heats up, the question of whether national
    governments are willing to slow down development of AI systems in their countries,
    allowing others to take the lead, becomes more salient. Regulations are likely
    not going to be enough to mitigate the full risks associated with AI.


    Instead, the path forward requires a broad societal response, with coordination
    among companies, governments, researchers, and civil society. We need agreed-upon
    norms and standards for AI’s ethical development and use, shaped through an inclusive
    process representing diverse voices. Companies must make principles like transparency,
    accountability, and human oversight central to their technology. Researchers need
    support and incentives to prioritize beneficial AI alongside raw capability gains.
    And governments need to enact sensible regulations to ensure public interest prevails
    over a profit motive.


    Most important, the public needs education on AI so they can pressure for an aligned
    future as informed citizens. Today’s decisions about how AI reflects human values
    and enhances human potential will reverberate for generations. This is not a challenge
    that can be solved in a lab—it requires society to grapple with the technology
    shaping the human condition and what future we want to create. And that process
    needs to happen, soon.


    ## FOUR RULES FOR CO-INTELLIGENCE


    The fact is that we live in a world with AIs, and that means we need to understand
    how to work with them. So we need to establish some ground rules. Because the
    AI available to you when you read this book is likely different from the one I
    have when writing it, I want to consider general principles. We will focus on
    things inherent and timeless, as much as that is possible, in all current generative
    AI systems based on Large Language Models.


    Here are my four principles of working with AI:


    ### Principle 1: Always invite AI to the table.

