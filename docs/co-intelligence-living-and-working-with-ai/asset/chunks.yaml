  trans: '


    在多项研究中，从 AI 中获益最大的人是那些初始能力最低的人——它让表现平庸者变成了表现优异。在写作任务中，糟糕的写作者变得扎实；在创造力测试中，它对创造力最低的人提升最大。在法学学生中，法律写作最差的学生变成了优秀的学生。在一项针对呼叫中心早期生成式
    AI 的中，表现最差的员工生产力提高了 35%，而经验丰富的员工获益则微乎其微。在波士锡（BCG）的研究中，我们也发现了类似的效应。技能最弱的人从 AI 中获益最多，但即使是表现最高的人也受益了。


    这表明工作可能会发生更激进的重构，AI 将充当巨大的“平衡器”，让每个人都变成卓越的员工。这种影响可能与体力的自动化一样深远。你挖得有多好已经不再重要了，因为你还是挖不过蒸汽铲机。在这种情况下，由于工作的性质将发生巨大变化，因为教育和技能的价值将会降低。随着成本更低的员工在更短时间内完成相同的工作，大规模失业或至少是就业不足将变得更加可能，我们可能需要看到政策解决方案，例如四天工作制或通用基本收入，以降低人类福利的底线。


    因此，短期内，我们可能看到就业情况的变化不大（但任务会发生巨大变化），但正如以未来主义者罗伊·阿马拉（Roy Amara）命名的阿马拉法则所说：“我们倾向于高估技术的短期影响，而低估其长期影响。”从长期来看，未来异常不明。AI
    对某些行业的影响将超过其他行业，就像某些工作将发生翻天覆地的变化，而另一些则完全没有变化一样。现在，没有人能准确告诉你任何特定公司或学校会发生什么。而且当下一代
    AI 发布时，任何建议都将过时。不存在外部权威。对于接下来会发生什么，我们掌握着主动权，无论好坏。


    ## 7. 作为导师的 AI


    这里有一个秘密：我们长期以来一直知道如何增强教育，只是一直没能完全做到。教育心理学家本杰明·布鲁姆（Benjamin Bloom）在 1984 年发表了一篇名为《两西玛问题》（The
    2 Sigma Problem）的论文。在这篇论文中，布鲁姆报告说，接受一对一辅导的平均学生表现比在传统教室环境中接受教育的学生高出两个标准差。这意味着，平均受辅导学生的得分高于对照组中
    98% 的学生（尽管并非所有的辅导研究都发现了如此巨大的影响）。布鲁姆将其称为“两西玛问题”，因为他挑战研究人员和教师，寻找能够达到与一对一辅导相同效果的小组教学方法，而这种辅导在大规模实施上成本太高且不切实际。布鲁姆的“两西玛问题”启发了许多研究和实验，探索可能接近直接辅导益处的替代性教学方法。然而，没有任何一种方法能够持续地匹配或超越布鲁姆所称的一对一辅导的两西玛效应。这表明，导师与学生之间的互动某些独特且强大的之处，无法通过其他手段轻易复制。因此，一个强大、适应性强且廉价的个性化导师是教育的圣杯，这并不意外。


    这就是 AI 介入的地方。或者说，希望 AI 介入的地方。尽管今天的 AI 如此奇妙，但我们还没有达到可以用“魔法教科书”取代人类教师的程度。尽管我们确实正处于一个转折点，AI
    将重塑我们的教学和学习方式，无论是在学校里还是离开学校后。同时，AI 在不久将来对教育的影响可能是反直觉的。它们不会取代老师，而是会让教室变得更加必要。它们可能会迫使我们在学校学习更多而非更少实。它们在改进教学方式之前，会先摧毁现有的方式。


    ### 作业末日之后


    几个世纪以来，教育的变化非常微小。学生聚集在教室里听老师讲。他们做家庭作业来练习所学知识，然后通过测试确保他们留住了知识。然后他们进入下一个课题。与此同时，对教学科学的研究取得了很大进展。例如，我们知道课堂讲座不是最有效的教学方式，而且主题需要交织在一起，学生才能留住所学内容。但遗憾学生的是，研究显示家庭作业和测试实际上都是非常有用的学习工具。


    因此，大型语言模型大规模应用的首要影响是引发了“作业末日”，这无疑是一种打击。作弊在学校里已是常态。一项针对 11 年大学课程的研究发现，当学生在 2008
    年做家庭作业时，它提高了 86% 学生的考试成绩，但在 2017 年仅对 45% 的学生有帮助。为什么？因为到 2017 年，超过一半的学生在网上查阅作业答案，所以他们从未获得家庭作业的益处。而且不仅如此。到
    2017 年，15% 的学生已经付钱让别人代写，通常通过在线代写工厂。甚至在生成式 AI 出现之前，肯尼亚就有 20,000 人靠全职写文章生活。


    有了 AI，作弊变得轻而易举。事实上，AI 的核心能力似乎几乎是为作弊而生的。想想常见的家庭作业类型。其中许多都涉及阅读，然后对阅读内容进行总结或报告。这些作业要求学生吸收阅读内容并与其进行某种智力上的斗争。然而，AI
    非常擅长总结和应用信息。而且现在可以阅读 `PDFs`。甚至可以阅读整本书。这意味着学生将受诱于让 AI 帮助总结书面内容。当然，结果可能包含错误和简化，但即使结果是正确的，这些总结也会塑造学生的思维。此外，采取捷径可能会降低学生对阅读内容的关注程度，从而使课堂讨论的智力价值降低，因为筹码变了。或者考虑练习题。我们已经看到
    AI 如何攻克研究生入学的关键考试，所以你孩子四年级的几何作业不太可能挡它的路。


    而且，当然，AI 已经来夺了作业之王——文章。文章在教育中无处不在，服务于多种目的，从展示学生的思维方式到提供反思的机会。但它们也非常容易让任何 `LLM`
    生成，而且基于 AI 的文章正在变得越来越好。起初，AI 的风格很显而易见，但新的模型写作方式不再那么笨拙和循环，并且可以很容易地提示以适合学生身份的风格写作。此外，幻构参考文献和明显错误的问题现在要少得多，且易于发现。错误是微妙的，而非显而易见的。参考文献是真实的。此外，最重要的一点是：`没有方法可以检测文本是否由
    AI 生成`。几轮提示就能消除任何检测系统识别 AI 写作的能力。更糟糕的是，检测器的误报率很高，会指责没有使用 AI 的人（特别是非英语母语者）使用了 AI。你同样不能让
    AI 来检测 AI 写作——它只会胡造答案。除非是在课堂上完成作业，否则没有准确的方法可以检测作品是否是人类创作的。


