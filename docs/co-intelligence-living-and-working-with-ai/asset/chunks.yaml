    Let’s step into the world of architecture. Envision two budding architects, Alex
    and Raj. Both have just graduated from top-tier architecture schools, brimming
    with fresh ideas and an eagerness to design. Alex begins his journey by drafting
    designs using traditional methods. He frequently reviews famous architectural
    blueprints and gets feedback from a senior architect in his firm once a week.
    He believes that by continuously sketching and refining his designs, he will gradually
    improve. While this process does help him learn, it’s limited by the frequency
    of feedback and the depth of analysis that his mentor can provide in a short period.


    Raj, conversely, integrates an AI-driven architectural design assistant into his
    workflow. Each time he creates a design, the AI provides instantaneous feedback.
    It can highlight structural inefficiencies, suggest improvements based on sustainable
    materials, and even predict potential costs. Moreover, the AI offers comparisons
    between Raj’s designs and a vast database of other innovative architectural works,
    highlighting differences and suggesting areas of improvement. Instead of just
    iterating designs, Raj engages in a structured reflection after every project,
    thanks to the insights from the AI. It’s akin to having a mentor watching over
    his shoulder at every step, nudging him toward excellence.


    Over several months, the difference between Alex’s and Raj’s growth trajectories
    becomes evident. While Alex’s designs do mature and evolve, the pace of his growth
    is significantly slower. His once-a-week feedback sessions, although valuable,
    don’t provide the immediate, in-depth analysis that Raj benefits from after every
    single design iteration. Raj’s approach, with the aid of AI, embodies the essence
    of deliberate practice. His consistent, rapid feedback loop, combined with targeted
    suggestions for improvement, ensures that he’s not just practicing more; he’s
    practicing better. In this context, the AI is more than just a tool for Raj; it
    serves as an ever-present mentor, ensuring that each attempt isn’t just about
    producing another design, but about consciously understanding and refining his
    architectural approach.


    Today’s AI cannot achieve this entire vision. It is not able to connect complex
    concepts, and it still hallucinates too much. Yet, in our experiments at Wharton,
    we have found that today’s AI still makes a pretty impressive coach in limited
    ways, offering timely encouragement, instruction, and other elements of deliberate
    practice. For example, we built a simulator using AI to teach people how to pitch
    their ideas. Users first receive an instruction session and a chance to ask the
    AI questions about what they learned (where the AI is prompted to provide advice
    on pitching the way I do in my classes). Next, they go into a practice session,
    where a different prompt has the AI simulate a venture capitalist, grilling them
    about their pitch and idea. The whole time, another instance of the same AI is
    gathering data about their performance, including secret “notes” kept by the previous
    AIs. At the end of the practice session, this AI grades them.


    ### When Everyone Is an Expert


    Today’s AI cannot achieve this entire vision. It is not able to connect complex
    concepts, and it still hallucinates too much. Yet, in our experiments at Wharton,
    we have found that today’s AI still makes a pretty impressive coach in limited
    ways, offering timely encouragement, instruction, and other elements of deliberate
    practice. For example, we built a simulator using AI to teach people how to pitch
    their ideas. Users first receive an instruction session and a chance to ask the
    AI questions about what they learned (where the AI is prompted to provide advice
    on pitching the way I do in my classes). Next, they go into a practice session,
    where a different prompt has the AI simulate a venture capitalist, grilling them
    about their pitch and idea. The whole time, another instance of the same AI is
    gathering data about their performance, including secret “notes” kept by the previous
    AIs. At the end of the practice session, this AI grades them.


