    # 引言


    ## 三个不眠之夜


    几个小时后，显然有些事情发生了巨大的变化。在 AI 发布四天后，我决定在我的本科创业课上演示这个新工具。坦率地说，大家都听说过它。在学生面前，我进行了一场演示，展示了
    AI 如何帮助生成想法、撰写商业计划、将这些计划变成诗歌（尽管这需求很大），并通常充当合伙人的角色。课程结束时，我的学生 Kirill Naum 使用他从未用过的代码库，为他的创业项目创建了一个演示——一个受哈利·波特启发的能对行人做出反应的移动框架——花费的时间比他预想的短了一半。第二天就有风险投资猎人联系他了。


    在向学生介绍 AI 的两天内，就有几个人告诉我他们使用 ChatGPT 像对待十岁孩子一样向他们解释复杂的概念。他们不再频繁举手了——既然以后可以问 AI，为什么要在课堂上暴露自己呢？而且每篇文章突然都变成了完美的语法（尽管引用通常是错误的，最后一段往往以“综上所述”开头——这是早期
    ChatGPT 写作的特征）。


    但学生们不仅感到兴奋，还感到焦虑。他们想知道未来。


    一些人问我这对他们理想的职业意味着什么（“如果 AI 可以完成大部分工作，我应该成为放射科医生吗？”“五年后撰写营销文案还是一份工作吗？”）。其他人问这种技术发展何时会停止，或者是否会停止。有人甚至问通用人工智能（AGI，即假设的比人类更聪明的机器）是否会在毕业前到来。


    那时我没有任何答案（尽管现在我有了一些），但我意识到自己无法免这些这些影响。因此，我决定亲自动手并对 AI 进行测试。在过去的五年里，我的大部分工作是构建教学业务技能的模拟。为了构建这些复杂的数字体验，大学投入了大量资金，十二位人才也付出了努力。在数千小时后，这些游戏非常棒：利用成千上万行的代码，我们可以进行精细的学习模拟，帮助教授谈判等技能。但我并不是计算机科学家，我是一个长期从事创新研究的学者。


