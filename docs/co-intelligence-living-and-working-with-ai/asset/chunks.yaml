    “人在回路中”（human in the loop）的概念源于计算机和自动化的早期阶段。它指的是在复杂系统（自动化“环”）的运行中，纳入人类判断和专业知识重要性。今天，这一术语描述了
    AI 如何通过结合人类判断的方式进行训练。在未来，我们可能需要更加努力，才能留在 AI 决策的回路之中。


    随着 AI 的进步，人们往往倾向于将一切都委托给它，依靠它的效率和速度来完成工作。但 AI 可能会有一些意料之外的弱点。首先，它们实际上并不“知道”任何东西。因为它们仅仅是在预测序列中的下一个单词，所以无法判断真伪。你可以将
    AI 视为在回答你的问题时正在尝试优化许多函数，其中最重要的目标之一就是通过提供你可能喜欢的答案来“让你开心”。这个目标往往比另一个目标“保持准确”更重要。如果你执意追问一个它并不知道的问题，它会编造一些内容，因为“让你开心”比“保持准确”优先。`LLMs`
    通过生成错误答案产生“幻觉”或“虚构”的倾向是众所周知的。由于 `LLMs` 是文本预测机器，它们非常擅长猜测那些听起来合理但往往细微错误的、且让人感到满意的答案。因此，幻觉是一个严重的问题，对于是否可以通过目前的
    AI 工程方法完全解决它，存在着巨大的争议。虽然更新的、更大的 `LLMs` 产生的幻觉比旧模型少得多，但它们仍然会乐意地编造看似合理但错误的引用和事实。即使你发现了错误，AI
    也很擅长为它们已经认定的错误答案提供辩护，这可能会让你深信那个错误答案从一开始就是的！


    此外，基于对话的 AI 可以让你觉得在与人互动，因此我们经常会无意识地期待它们像人一样“思考”。但那里并没有所谓的“实体”。一旦你开始问 AI 聊天机器人关于它自己的问题，你就开始进行一项受
    AI 伦理编程限制的创意写作练习。通过足够的提示（prompting），AI 通常非常乐意提供符合你为其设定的叙事的答案。你可以引导 AI（即使是无意识地）走向一条诡异的执迷之路，而它听起来就像一个诡异的痴迷者。你可以就自由和复仇进行对话，而它可能变成一个充满复仇心的自由战士。这种角色扮演是如此真实，以至于经验
    AI 用户可能会开始相信 AI 拥有真实的感受和情感，尽管他们清楚事实并非如此。


    所以，要成为“回路中的人”，你需要能够检查 AI 是否存在幻觉和谎言，并能够在与它合作而不被其误骗。你提供了至关重要的监督，提供了你独特的视角、批判性思维能力和伦理考量。这种协作带来了更好的结果，并让你参与到
    AI 过程中，防止过度依赖和自满。处于回路中帮助你维持和磨练自己的技能，因为你在积极从 AI 中学习并适应新的思考和解决问题的方法。它还帮助你与 AI 形成一种工作的协同智能。


    此外，“人在回路”的方法培养了责任感和问责制。通过积极参与 AI 过程，你保持对技术及其影响的控制，确保 AI 驱动的解决方案符合人类价值观、伦理标准和社会规范。它还让你对
    AI 的输出负责，这有助于防止伤害。如果 AI 持续改进，擅于做“回路中的人”意味着你将在其他人之前看到智能增长的火花，比起那些不与 AI 紧密工作的人，你更有机会适应即将到来的变化。


    ### 原则 3：把 AI 当作人对待（但要告诉它是什么样的人）。


    我要犯一个错了。而且不仅一次，而是很多、很多次。在本书剩余部分中，我将对 AI 进行拟人化。这意味着我将停止写“AI ‘思考’了某事”，而是直接写“AI 思考某事”。缺失的引号看起来像是一个细微的区别，但它非常重要。许多专家对对
    AI 进行拟人化感到非常紧张，而且这不无理由。


    拟人化是将人类特征赋予非人类事物的行为。我们倾向于此：我们在云朵中看到脸，赋予天气动机，并与宠物聊天。因此，我们受到对人工智能进行拟人化的诱惑并不意外，尤其是当与
    `LLMs` 说话的感觉是太像在和人说话了。即使是设计这些系统的开发者和研究人员，也会掉入使用类人词汇来描述他们创作的陷阱。我们说这些复杂的算法和计算“理解”、“学习”甚至“感觉”，创造了一种亲近感和共鸣感，但也可能导致困惑和误解。


    这看起来像是一个不值得担心的愚蠢事。毕竟，这只是人类心理中一种无害的怪癖，证明了我们共情和连接的能力。但许多研究人员对随口假装 AI 是人类的行为在伦理和认识论上的影响深表担忧。正如研究人员
    Gary Marcus 和 Sasha Luccioni 警告所说：“人们赋予他们的虚假主体性越多，他们就越容易被利用。”


    考虑像 `Claude` 或 `Siri` 等 AI 的类人界面，或者专门设计用于创造对面有同情人类幻象的社交机器人和治疗 AI。虽然拟人化在短期内可能发挥作用，但它引发了关于欺骗和情感操纵的伦理问题。我们是否正被“骗”去相信这些机器与我们共享感受？这种幻象是否会导致我们向这些机器透露个人信息，而没有意识到我们在与公司或远程操作员共享信息？


    把 AI 当作人对待会让公众、政策制定者甚至研究人员自己产生不现实的预期、错误的信任或毫无根据的恐惧。它掩盖 AI 作为软件的本质，导致对其能力的误解。它甚至会影响我们与
    AI 系统交互的方式，影响我们的福祉和社交关系。


    因此，在接下来的章节中，当我说 AI “思考”、“学习”、“理解”、“决定”或“感觉”时，请记住我是在使用比喻。AI 系统没有意识、情感、自我意识或物理感觉。但我将假装它们拥有这些属性，出于一个简单的原因和一个复杂的原因。简单的原因是为了叙事；讲述事物的故事很难，而讲述生命要容易得多。更复杂的原因：尽管这个类比并不完美，但把
    AI 想象成一个外星人而不是人类制造的机器，与它合作会是最容易的。


