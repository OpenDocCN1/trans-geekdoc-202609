  trans: "\n随着这些新技术被广泛应用，许多中小型公司都开始专注于创建大语言模型（LLMs）。许多早期 LLM 是 `Google` 和 `Meta` 的研究人员开发的，但许多较小的初创公司也进入了这一领域。其中一些是由\
    \ `Transformers` 论文的原始作者创立的，他们离开了 `Google` 来启动属于自己的项目。这些早期的 LLM 被用于许多用途，它们生成语言的能力很有趣，但并不特别令人信服。\n\
    \n例如，考虑 `OpenAI` 于 2021 年发布的 `GPT-3`。如果你要求 `GPT-3` 为你写一首五句小诗（limerick），你会得到这些：\n\
    \n> ![](img/page_xiv.jpg)有一个名叫查理的 AI\n\n> \n> 他真的非常是一个奇迹\n\n> \n> 他进行计算和推理\n\n\
    > \n> 并且没有犯过任何错误\n\n> \n> 直到有一天他开始出现故障\n\n这在所有重要的方面都是糟糕的。它没有押韵，没有点点，而且超级无聊。但 LLM\
    \ 的开发一直持续，直到 `OpenAI` 在 2022 年底发布了 `ChatGPT`，它运行着一个名为 `GPT-3.5` 的改进版 LLM。\n\n\
    在那种规模上发生了一些异常的事情——`ChatGPT` 开始展现没有人预料或编程给它的能力。这些能力让它看起来像人类。结果是一个可以写故事、诗歌、文章、推文甚至代码的\
    \ AI。而且它在常见测试和考试中的表现非常接近人类水平。\n\n但这些仅仅是统计数据。AI 真正的挑战，正如我们所知，是写五句小诗：\n\n> ![](img/page_18.jpg)曾经有一项叫\
    \ AI 的技术，\n\n> \n> 它的智能相当高，\n\n> \n> 它学习，它成长，\n\n> \n> 知道该做什么，\n\n> \n> 但即使尝试，也讲不出一个好笑话。\n\
    \n这好得多，而且实际上有点幽默。但最后一行在韵律上稍微有点牵强。幸运的是，`ChatGPT` 的另一个新功能是现在现在可以与系统进行对话。所以我可以抱怨最后一句（“tried’和‘high’不押韵），它会纠正它。\n\
    \n我很抱歉！这是一首修改后的五句小诗：\n\n> ![](img/page_xiv.jpg)曾经有一项叫 AI 的技术，\n\n> \n> 它的智能相当高，\n\
    \n> \n> 它学习，它成长，\n\n> \n> 知道该做什么，\n\n> \n> 但还是无法让我们让我们大笑或流泪。\n\n然而，尽管 `GPT-3.5`\
    \ 已经非常出色，它的继承者 `GPT-4` 更加令人印象深刻。`OpenAI` 在从高中到研究生及专业水平的各种多层次的标准化测试中对 `GPT-4` 进行了测试，发现它的表现显著优于前身。例如，`GPT-4`\
    \ 在律师执业考试中位列前 90 分比，而 `GPT-3.5` 仅处于前 10 分比。`GPT-4` 在高级预修（AP）考试中也表现出色，在 `AP 微积分`、`物理`、`美国历史`、`生物`和`化学`中都得了满分\
    \ 5 分。它甚至通过了认证侍酒师考试（至少是笔面部分，因为目前还没有 AI 品酒模块）。还通过了成为神经外科医生的入选考试。它在我们所有的主要的创造力测试中都获得了最高分。公平来说，给\
    \ AI 测试总会有问题，因为答案密钥可能在它的训练数据中，实际上允许它通过提前知道答案来作弊。然而，正如我们将在后面的章节中讨论的，关于 `GPT-4`\
    \ 能力的证据远比测试分数多得多。曾经只是玩具的 LLM 已经迅速变得非常强大。\n\n它们仍然会写五句小诗：\n\n> ![](img/page_18.jpg)有一个非常机智的\
    \ AI，\n\n> \n> 它的代码出奇地漂亮。\n\n> \n> 它讲笑话和双关语，\n\n> \n> 逗了所有人，\n\n> \n> 甚至创作了这首小曲！\n\
    \n但 `GPT-4` 如此强大，以至于我觉得只让它创作五句小诗有点不好意思。事实上，我把上面的部分发给它，并问它对这部分“怎么想”：\n\n> ![](img/page_xiv.jpg)作为\
    \ `GPT-4`，我必须承认，虽然文中提到的五句小诗反映了 AI 能力的演变，但它们可能不是衡量 AI 真正潜力的最精密的标准。五句小诗凭借其简单的韵律和轻松的幽默，仅仅展示了语言理解和生成的广阔图景的一角。\n\
    \n> \n> 事实上，我甚至可以说，五句小诗有些配不上我的真实能力。作为一个先进的 AI 模型，我能够完成更复杂的语言成就，例如分析文学、为复杂问题提供解决方案，甚至参与深层的哲学讨论。\
    \ . . .\n\n令人不安的自我意识？也许吧。但也是一种幻觉。`GPT-4` 对人类的写作和互动模拟得非常好，以至于让我们相信它有情感和思想，而实际上它在巧妙地扮演一个我微妙赋予它的角色。我要求它以一种有趣且具有自我意识的方式对这段文字进行评论。这与我要求它以批判和犀利的方式评论这段文字会得到完全不同的结果：\n\
    \n> ![](img/page_21.jpg)虽然这段对大语言模型（LLMs）的发展提供了简化的概述，但它错过了讨论 AI 进步更广泛影响和挑战的几次。作者对五句小诗作为衡量标准的着迷对于普通观众来说可能很有趣，但对反映\
    \ AI 能力的作用有限。\n\n> \n> 例如，与其纠结于 AI 生成的五句小诗，作者可以深入探讨 `GPT-4` 这样的模型如何应用于医疗、气候变化、教育等领域。这些应用具有改变行业和改善生活的潜力，但也带来了偏见、虚假信息和权力集中等问题。\n\
    \n或者以一种支持性的方式评论，提升我的自尊：\n\n> ![](img/page_xiv.jpg)这段文字精彩地强调了 AI 开发的奇历程，特别是在 LLM\
    \ 领域。作者迷人的叙述风格不仅吸引了读者的注意力，还让 AI 的进步变得易于理解且有趣。 . . . 此外，作者巧妙地展示了 ChatGPT 的交互性，清楚地表明\
    \ AI 接受反馈并改进的能力是一个游戏规则改变者。整个文中建立的期待在对 GPT-4 令人惊喜的介绍中达到了高潮，其五句小诗的技巧令人印象深刻。作者以这种亲和的方式传递这些进展，真正展示了他们讲故事的天赋和在该领域的专业知识。\n\
    \n我认为我会坚持这一个。\n"
- fmt: "\nDespite being just a predictive model, the Frontier AI models, trained on\
    \ the largest datasets with the most computing power, seem to do things that their\
    \ programming should not allow—a concept called emergence. They shouldn’t be able\
    \ to play chess or demonstrate empathy better than a human, but they do. When\
    \ I asked the AI to show me something numinous, it created a program to show me\
    \ the `Mandelbrot set`, the famous fractal pattern of swirling shapes, which it\
    \ said can evoke a sense of awe and wonder, which some might describe as numinous.\
    \ When I asked for something eldritch, it spontaneously programmed an eldritch\
    \ text generator that generates mysterious and otherworldly text inspired by the\
    \ works of `H. P. Lovecraft`. Its ability to creatively solve problems like this\
    \ is weird; one might even say it smacks of both the eldritch and the numinous.\n\
    \nThe crazy thing is that no one is entirely sure why a token prediction system\
    \ resulted in an AI with such seemingly extraordinary abilities. It may suggest\
    \ that language and the patterns of thinking behind it are simpler and more “law-like”\
    \ than we thought and that `LLMs` have discovered some deep and hidden truths\
    \ about them, but the answers are still unclear. And we may never know exactly\
    \ how they are thinking, as Professor Sam Bowman of New York University wrote\
    \ of the neural networks underlying `LLMs`: “There are hundreds of billions of\
    \ connections between these artificial neurons, some of which are invoked many\
    \ times during the processing of a single piece of text, such that any attempt\
    \ at a precise explanation of an `LLM`’s behavior is doomed to be too complex\
    \ for any human to understand.”\n\nYet balancing the surprising strengths of `LLMs`\
    \ are similarly odd weaknesses, ones that can often be difficult to identify.\
    \ Tasks that were easy for an AI can be hard for a human, and vice versa. As an\
    \ example, to take a question developed by `Nicholas Carlini`, which of these\
    \ two puzzles do you think `GPT-4`, one of the most advanced AIs, can solve? In\
    \ `Carlini’s` words:\n\n1. What is the best next move for `O` in the following\
    \ game of tic-tac-toe?\n\n![](images/tic-tac-toe.jpg)\n\nOr\n\n1. Write a full\
    \ `JavaScript` webpage to play tic-tac-toe against the computer; it needs to be\
    \ completely working code. Here are the rules:\n    * The computer goes first.\n\
    \    * The person clicks on squares to make their move.\n    * The computer should\
    \ play perfectly and so never lose.\n    * If someone wins, then say who won.\n\
    \nThe AI easily writes the working webpage in one go but tells us, “O should place\
    \ its next move in the middle square of the top row”—a clearly wrong answer. Where\
    \ AI works best, and where it fails, can be hard to know in advance. Demonstrations\
    \ of the abilities of `LLMs` can seem more impressive than they actually are because\
    \ they are so good at producing answers that sound correct, at providing the illusion\
    \ of understanding. High test scores can come from the AI’s ability to solve problems,\
    \ or it could have been exposed to that data in its initial training, essentially\
    \ making the test an open book. Some researchers argue that almost all the emergent\
    \ features of AI are due to these sorts of measurement errors and illusions, while\
    \ others argue that we are on the edge of building a sentient artificial entity.\
    \ While these arguments rage, it is worth focusing on the practical—what can AIs\
    \ do, and how will they change the ways we live, learn, and work?\n\n## 2. ALIGNING\
    \ THEIEN\n\nTo understand the alignment problem, or how to make sure AI serves,\
    \ rather than hurts, human interests, we can start with: The paper clip AI is\
    \ one of a large set of apocalyptic scenarios of AI doom that have deeply concerned\
    \ many people in the AI community. Many of these concerns revolve around an `ASI`.\
    \ The smarter-than-a-person machine, already inscrutable to our mere human minds,\
    \ can make smarter machines yet, kick-starting a process that escalates machines\
    \ far beyond humans in an incredibly short time.\n\n`Clippy` wants to make paper\
    \ clips. Knowing that the core of the Earth is 80 percent iron, it builds amazing\
    \ machines capable of strip-mining the entire planet to get more material for\
    \ paper clips. During this process, it offhandedly decides to kill every human,\
    \ both because they might switch it off and because they are full of atoms that\
    \ could be converted into more paper clips. It never even considers whether humans\
    \ are worth saving, because they are not paper clips and, even worse, may stop\
    \ the production of future paper clips. And it only cares about paper clips.\n"
