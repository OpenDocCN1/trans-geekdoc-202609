    > 你将成为我的谈判老师。请模拟一个详细的场景，我必须在其中进行谈判。你扮演其中一方，我扮演另一方。在场景的每一步中，你都要询问我的回复，并等待收到我的回复。在收到我的回复后，请告诉我对方做了什么、说了什么细节。你将对我的回复进行评分，并根据谈判科学提供详细的反馈，告诉我如何做得更好。如果我表现很好，就给我一个更具挑战性的场景；如果我失败了，就给我一个更简单的场景。


    ChatGPT 回复道：


    > ![](img/page_xiv.jpg)没问题，我很乐意通过模拟练习来帮助练习谈判！让我们从一个简单的场景开始。你是一个销售，试图向一位客户售出 100
    支笔。这些笔的价格通常是 1 美元，但客户试图压价。客户首先提议以每支 0.50 美元购买。你如何回应？


    随后，它带我完成了整个模拟，虽然并不完美，但完成了我们团队花费几个月才能完成的 80% 工作。而这仅仅基于我的一段话的提示词！


    我的失眠之夜开始了。坦率地说，它们还没有结束。似乎每周 AI 都会带来一个一个新的奇迹——或者一个令人担忧的新进展。我很快发现自己正在与聊天机器人争论，当我要求它帮我写计算机代码时，它竟然指责我不符合道德。我发现可以通过给机器正确的词汇来创造美丽的图像。我可以用
    `Python` 编程，这是一种我从未学过的语言。我发现机器可以完成我的大部分工作……可能还有很多其他人的工作。我发现了一些非常接近“外星共生智能”的东西，它能与人类良好互动，但它不是人类，事实上，也没有意识。我想我们很快都会拥有属于自己的三个失眠之夜。


    由于我现在的精疲力竭，我不断回到学生的问题：这项技术对工作和教育的未来意味着什么？事情发生得如此快，让人很难确定，但我们可以开始看到它的轮廓。


    ### AI 作为通用技术


    AI 是我们这些研究技术的人所称的“通用技术”（General Purpose Technology，讽刺的是，缩写也是 `GPT`）。这些进步是每代一次的技术，类似于蒸汽机或互联网，触及每一个行业和生活的方方面面。而且，在某些方面，生成式
    AI 甚至更大。


    通用技术的采纳速度通常缓慢，因为它们需要许多其他技术才能良好运行。`internet` 就是一个很好的例子。虽然它在 20 世纪 60 年代后期作为 `ARPANET`
    诞生，但花了近三十年才在 20 世纪 90 年代实现普及，这得益于 `web browser` 的发明、廉价电脑的发展以及支持高速互联网日益增长的基础设施。五年后，手机才促成了社交媒体的兴起。许多公司甚至还没有完全拥抱互联网：让业务“数字化”仍然是商学院讨论的热点话题，尤其是许多银行仍在使用大型机计算机。


    之前的通用技术同样从开发到实用花费了许多十年时间。以计算机为例，这是另一种变革性技术。早期计算机的进步很快，得益于`Moore’s Law`（摩尔定律）——这是一个关于计算机能力每两年翻一倍的长期趋势。但计算机变得有用仍然花费了数十年。


    ### AI 的采纳速度


    早期计算机的进步很快，得益于`Moore’s Law`，即计算机能力每两年翻一倍的长期趋势。但计算机变得有用仍然花费了数十年。（注：此处原文存在重复段落，已按要求翻译并保留逻辑）。


    （注：由于原文中存在大量关于“Early computers improved quickly, thanks to Moore’s Law...”的重复段落，根据指令“不要重复输出原文”的原则，在译文中已去除了冗余的重复翻译，确保逻辑连贯。）


