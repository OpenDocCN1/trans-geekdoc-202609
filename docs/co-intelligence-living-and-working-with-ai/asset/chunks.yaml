- fmt: '

    And while I am sure that in-class essay writing will come back in style as a stopgap
    measure, AI does more than help students cheat. Every school or instructor will
    need to think hard about what AI use is acceptable: Is asking AI to provide a
    draft of an outline cheating? Requesting help with a sentence that someone is
    stuck on? Is asking for a list of references or an explainer about a topic cheating?
    We need to rethink education. We did it before, if in a more limited way.


    When the calculator was first introduced in schools, the reaction was surprisingly
    close to the initial concerns I hear about students using AI for tasks like writing
    today. As education researcher Sarah J. Banks writes, in the early days of their
    popularity in the mid-1970s, many teachers were eager to incorporate calculators
    into their classrooms, recognizing the potential for increased student motivation
    and engagement. After students learned the basics, these teachers believed, they
    should be given the opportunity to use calculators to tackle more realistic and
    complex problems. However, not everyone shared this enthusiasm. Some teachers
    were hesitant to adopt calculators, as their effects had not been thoroughly researched,
    and they believed that curriculum should be adapted before introducing new technology.
    A mid-1970s survey found that 72 percent of teachers and laypeople did not approve
    of seventh-grade students using calculators. One concern was the inability to
    help students understand and identify their errors, for the calculators did not
    log the buttons that students pressed, making it difficult for teachers to see
    and correct mistakes. Early research similarly found that parents were worried
    that their children would become dependent on the technology and forget basic
    mathematical skills. Doesn’t that sound familiar?


    Attitudes shifted quickly, and by the late 1970s, parents and teachers became
    more enthusiastic and saw the potential benefits of calculator use, such as improved
    attitudes toward learning, and ensuring their children were well equipped for
    a technology-driven world. A year or two later, another study revealed that 84
    percent of teachers wanted to use calculators in their classrooms, but only 3
    percent were employed by schools that provided calculators. Teachers were generally
    untrained in their use and needed support from administration and parents to incorporate
    them into their classrooms. Despite the lack of official policies, many teachers
    continued to insist on calculators in their classes. The debate persisted into
    the 1980s and early 1990s, with some teachers still believing that calculators
    hindered students’ acquisition of basic skills while others considered them essential
    tools for the future. By the mid-1990s, calculators were part of the curriculum
    and were used to complement other ways of learning math. Some tests allowed them,
    some did not. A practical consensus was achieved. Math education did not fall
    apart, though debate and research continues today, a half century after the calculator
    appeared in classrooms.


    To some extent, AI will follow a similar path. There will be assignments where
    AI assistance is required and some where AI use is not allowed. In-school writing
    assignments on non-internet-enabled computers, combined with written exams, will
    ensure students learn basic writing skills. We’ll find a practical consensus that
    will allow AI to be integrated into the learning process without compromising
    the development of critical skills. Just as calculators did not replace the need
    for learning math, AI will not replace the need for learning to write and think
    critically. It may take a while to sort it out, but we will do so. In fact, we
    must do so—it’s too late to put the genie back in the bottle.


    The calculator completely changed what was valuable to teach, and the nature of
    math teaching overall—huge modifications that were mostly for the good. And this
    revolution took a long time. Unlike AI, though, calculators started off as expensive
    and limited tools, giving schools time to integrate them into lessons as they
    were slowly adopted over a decade. The AI revolution is happening much faster
    and more broadly. What happened to math is going to happen to nearly every subject
    in every level of education, a transformation without the delay.


    So students will cheat with AI. But as we saw with user innovation earlier, they
    also will begin to integrate AI into everything they do, raising new questions
    for educators. Students will want to understand why they are doing assignments
    that seem obsolete thanks to AI. They will want to use AI as a learning companion,
    a coauthor, or a teammate. They will want to accomplish more than they did before,
    and will also want answers about what AI means for their future learning paths.
    Schools will need to decide how to respond to this flood of questions.


    The Homework Apocalypse threatens a lot of good, useful types of assignments,
    many of which have been used in schools for centuries. We will need to adjust
    quickly to preserve what we are in danger of losing and to accommodate the changes
    AI will bring. That will take immediate effort from instructors and education
    leaders and clearly articulated policies around AI use. But the moment isn’t just
    about preserving old types of assignments. AI provides the chance to generate
    new approaches to pedagogy that push students in ambitious ways.


    I have made AI mandatory in all my classes for undergraduates and MBAs at the
    University of Pennsylvania. Some assignments ask students to “cheat” by having
    the AI create essays, which they then critique—a sneaky way of getting students
    to think hard about the work, even if they don’t write it. Some assignments allow
    unlimited AI use but hold the students accountable for the outcomes and facts
    produced by the AI, which mirrors how they might work with AI in their postschool
    jobs. Other assignments use the new capabilities of AI, asking students to conduct
    interviews with the AI before they speak to people at real organizations. And
    some of the assignments take advantage of the fact that the AI enables the impossible.
    For example, my first assignment to students in my Wharton entrepreneurship class
    now reads:


    ```

    Make what you are planning on doing ambitious to the point of impossible; you
    are going to be using AI. Can’t code? Definitely plan on making a working app.
    Does it involve a website? You should commit to creating a prototype working site,
    with all-original images and text. I won’t penalize you for failing if you are
    too ambitious.

    ```


    Any plan benefits from feedback, even if it just gives you permission to discuss
    what might go wrong. Ask the AI to give you 10 ways your project could fail and
    a vision of success, using the prompts from class. And, to make it interesting,
    ask three famous figures to criticize your plan. You can invoke entrepreneurs
    (Steve Jobs, Tory Burch, Jack Ma, Rihanna), leaders (Elizabeth I, Julius Caesar),
    artists, philosophers, or any other people you think would be useful to critique
    your strategy in their voice.


    Thus, while classes that are focused on teaching essays and writing skills will
    return to the nineteenth century, with in-class essays handwritten in blue books,
    other classes will feel like the future, with students carrying out the impossible
    every day.


    Of course, all this raises the even bigger question: What should we actually teach?
    Even slow-moving educational institutions are recognizing that teaching about
    AI will play an important role in education, with the US Department of Education
    suggesting, within just months of the release of `ChatGPT`, that AI will need
    to be embraced in classrooms. Some pundits go further, arguing that we need to
    focus on working with AI. We should, they argue, teach basic AI literacy, and
    probably “prompt engineering,” about the art and science of creating good prompts
    for AIs.

    '
