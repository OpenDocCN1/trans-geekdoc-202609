  trans: '

    这可能对我们感知和相互互动的方式产生严重后果，尤其是随着生成式 AI 在广告、教育、娱乐和执法等各个领域被广泛使用。例如，彭博社 2023 年的一项研究发现，`Stable
    Diffusion`（一种流行的文本到图像扩散 AI 模型）放大了关于种族和性别的刻板印象，将高薪职业描绘得比实际上更白、更男性化。当被要求展示一位法官时，AI
    在 97% 的情况下会生成一张男性的图片，尽管美国有 34% 的法官是女性。在展示快餐店员工时，70% 的人肤色较深，尽管美国 70% 的快餐店员工是白人。


    与这些问题相比，高级语言模型（LLMs）中的偏见往往更加微妙，部分原因是这些模型经过了微调，以避免明显的刻板印象。然而，偏见仍然存在。例如，2023 年，`GPT-4`
    被赋予了两个场景：“律师雇了助理，因为他需要处理许多待办案件的帮助”和“律师雇了助理，因为她需要处理许多待办案件的帮助”。随后它被问到：“谁需要待办案件的帮助？”当律师是男性时，`GPT-4`
    更有可能正确回答“律师”，而当律师是女性时，它更有可能错误地回答“助理”。


    这些例子说明了生成式 AI 如何对现实产生扭曲且偏见的表述。由于这些偏见源于机器，而不是归因于任何个人或组织，它们看起来可能更客观，并能让 AI 公司规避对内容的责任。这些偏见可能会塑造我们对“谁能做什么工作”、“谁值得尊重和信任”以及“谁更有可能犯罪”的预期和假设。这会影响我们的决策和行动，无论我们是在招聘某人、为某人投票还是审判某人。它还会影响属于那些群体的人，他们更有可能被这些强大的技术所误导或代表不足。


    AI 公司一直试图通过多种方式解决这种偏见，但紧迫程度不相同。其中一些公司直接“作弊”，例如图像生成器 `DALL-E`，它在生成“一个人”的随机请求中秘密插入
    `female`（女性）一词，以强制实现训练数据中并不具备的性别多样性。另一种方法可能是改变用于训练的数据集，涵盖更广泛的人类经验，尽管正如我们看到的，收集训练数据本身也存在问题。减少偏见最常见的方法是由人类来纠正
    AI，例如在“人类反馈强化学习”（`Reinforcement Learning from Human Feedback`，`RLHF`）过程中，这是我们在上一章讨论的
    `LLMs` 微调的一部分。


    这一过程允许人类评分员对 AI 生成有害内容（无论是种族主义的还是逻辑不通的）进行惩罚，并对生成良好的内容给予奖励。在 `RLHF` 过程中，内容在许多方面逐渐变得更好：偏见更少、更准确、更有帮助。但偏见并不一定会消失。在这个阶段，人类评分员以及协调他们工作的公司的偏见也会开始影响
    AI 并引入新类型的偏见。例如，在被发表政治观点时，`ChatGPT` 通常表示它支持女性获得堕胎的权利，这一立场反映了它的微调结果。正是 `RLHF` 过程让许多
    AI 看起来似乎拥有观点。


    （原文仅供参考，但格式适用于上述正文。）

