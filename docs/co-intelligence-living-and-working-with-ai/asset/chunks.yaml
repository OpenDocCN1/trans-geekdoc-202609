    After introducing himself, Steve suggested:


    ### Clarity and structure

    At times, the text might benefit from clearer signposting and transitions. For
    instance, before introducing the concept of “Jobs, Tasks, and Systems,” it might
    be useful to have a transitional sentence like “Let’s break down the different
    aspects of work—jobs, tasks, and systems—to fully understand how AI affects each
    of them.”


    ### Terminology

    You introduce a number of terms (`Just Me Tasks`, `Delegated Tasks`, `Centaur`
    and `Cyborg Tasks`), and it could be helpful to define these in a more straightforward
    manner before delving into the examples. A brief, concise definition at the start
    can help readers follow along better.


    As a reader, I found your chapter informative, engaging, and thought-provoking.
    I look forward to seeing the final product!


    Steve’s suggestions shaped the chapter and helped me edit my work considerably.
    This particular advice, from a team of AI, is something that was not possible
    before, and greatly changed how I approached writing, without directly altering
    my style or voice. Using AI stopped me from ever losing momentum, and it often
    gives me ideas I never could have come up with before.


    Using AI as a co-intelligence, as I did while writing, is where AI is the most
    valuable. Figure out a way to do this yourself if you can. As a starting point,
    follow the first principle (invite AI to everything) until you start to learn
    the shape of the `Jagged Frontier` in your work. This will let you know what the
    AI can do and what it can’t. Then start working like a `Centaur`. Give the tasks
    that you hate but can easily check (like writing meaningless reports or low-priority
    emails) to the AI and see whether it improves your life. You will likely start
    to transition naturally into `Cyborg` usage, as you find the AI indispensable
    in overcoming small barriers and helping with tricky tasks. At that point, you
    have found a co-intelligence.


    You also have to remember that AI is changing, and the boundaries between these
    task types are permeable and will likely shift as AI capabilities improve over
    time. Tasks we delegate to AI today thanks to its competent but imperfect abilities
    may transition to fully automated in the future as performance reaches human parity
    across more domains. Likewise, some `Just Me Tasks` could eventually move into
    the `Centaur` category if AI becomes adept enough to fluidly collaborate rather
    than just assist. And new creative frontiers we cannot yet fathom may open up
    for human-AI symbiosis as both sides advance. The spectrum will also shift in
    the other direction as we consciously decide that certain emotionally charged
    or ethically questionable responsibilities should remain exclusively human.


    For workers, these fluid categories mean the impact of AI will be felt gradually,
    as we adapt to its increasing powers, rather than in a single disruption. As the
    Venn diagram of human and machine abilities evolves, so must our conceptions of
    suitable roles and responsibilities. And there is likely to be a growing disconnect
    between what workers do with AI and what their companies and organizations are
    doing.


    ### Secret Task Automation


    Today, billions of people have access to `Large Language Models` and the productivity
    benefits they bring. And from decades of research in innovation studying everyone
    from plumbers to librarians to surgeons, we know that, when given access to general
    purpose tools, people figure out ways to use them to make their jobs easier and
    better. The results are often breakthrough inventions, ways of using AI that could
    transform a business entirely. People are streamlining tasks, taking new approaches
    to coding, and automating time-consuming and tedious parts of their jobs. But
    the inventors aren’t telling their companies about their discoveries; they are
    keeping them secret. There are at least three reasons these `Cyborgs` and `Centaurs`
    stay secret. But they all boil down to the same thing: people don’t want to get
    in trouble.


    The problems start with organizational policy. Many companies, from `J.P.Morgan`
    to `Apple`, initially banned `ChatGPT` use, often because of legal concerns. But
    these bans had a big effect ... they caused employees to bring their phones into
    work and access AI from personal devices. While data is hard to come by, I have
    already met many people at companies where AI is banned who are using this workaround—and
    those are just the ones willing to admit it! This type of shadow IT use is common
    in organizations, but it incentivizes workers to keep quiet about their innovations
    and productivity gains.


    And that isn’t the only reason AI users fear revealing that they are `Cyborgs`.
    Much of the value of AI use comes from people not knowing you are using it. The
    ability of AI to write in ways that seem human is very powerful, but only if people
    think it is coming from an actual human. We know from research that when people
    learn they are receiving AI-created content, they judge it differently than if
    they assume it comes from a human. Unsurprisingly, when I conducted a bit of an
    unscientific Twitter poll, over half of generative AI users reported using the
    technology without telling anyone, at least some of the time.


    All this shadow use leads to the final concern, the justified worry that workers
    might be training their own replacements by figuring out how to work with AI.
    If someone has figured out how to automate 90 percent of a particular job, and
    they tell their boss, will the company fire 90 percent of their coworkers? Better
    not to speak up.


    All the usual ways in which organizations try to respond to new technologies don’t
    work well for AI. They are all far too centralized and far too slow. The IT department
    cannot easily build an in-house AI model, and certainly not one that competes
    with one of the `Frontier LLMs`. Consultants and system integrators have no special
    knowledge about how to make AI work for a particular company, or even the best
    ways to use AI overall. The innovation groups and strategy councils inside organizations
    can dictate policy, but there is no reason to believe that the corporate leaders
    of any organization are going to be wizards at understanding how AI might help
    a particular employee with a particular task. In fact, they are likely pretty
    bad at figuring out the best-use cases for AI. Individual workers, who are keenly
    aware of their problems and can experiment a lot with alternate ways of solving
    them, are far more likely to find powerful and targeted uses.


    At least for now, the best way for an organization to benefit from AI is to get
    the help of their most advanced users while encouraging more workers to use AI.
    And that is going to require a major change in how organizations operate. First,
    they need to recognize that the employees who are figuring out how best to use
    AI might be at any level of the organization, with any sort of history or past
    performance record. No company hired employees based on their AI skills, so AI
    skills might be anywhere. Right now, there is some evidence that the workers with
    the lowest skill levels are benefiting the most from AI, and so might have the
    most experience in using it, but the picture is still not clear. As a result,
    companies need to include as much of their organization as possible in their AI
    agenda, a democratic turn of events that many companies would rather avoid.

