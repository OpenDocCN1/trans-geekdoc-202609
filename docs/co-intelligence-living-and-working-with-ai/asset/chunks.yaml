- fmt: '

    So will AI result in the death of expertise? I don’t think so. As we discussed,
    jobs don’t consist of just one automatable task, but rather a set of complex tasks
    that still require human judgment. Plus, because of the Jagged Frontier, it is
    unlikely to do every task that a worker is responsible for. Improving the performance
    in a few areas need not lead to replacement; instead, it will allow workers to
    focus on building and honing a narrow slice of area expertise, becoming the human
    in the loop.


    But it is possible that there may be a new type of expert arising. While, as we
    discussed in the last chapter, prompt crafting is unlikely to be useful for most
    people, that doesn’t mean it is entirely useless. It may be that working with
    AI is itself a form of expertise. It is possible that some people are just really
    good at it. They can adopt Cyborg practices better than others and have a natural
    (or learned) gift for working with `LLM` systems. For them, AI is a huge blessing
    that changes their place in work and society. Other people may get a small gain
    from these systems, but these new kings and queens of AI get orders of magnitude
    improvements. If this scenario is true, they would be the new stars of our AI
    age and would be sought out by every company and institution, the way other top
    performers are recruited today.


    I, along with my frequent collaborator and expert on teaching with new technologies
    (and spouse), Dr. Lilach Mollick, have had some experience of this ourselves.
    As the hype and anxiety around AI built in the summer of 2023, we found ourselves
    in demand as some of the people who could best combine knowledge of pedagogy with
    deep experience in creating prompts. The big AI companies, including `OpenAI`
    and `Microsoft`, shared our prompts as the examples to use in classrooms, and
    the prompts themselves were cited and passed around educational institutions around
    the world. While we didn’t think of ourselves as having a special skill in prompting,
    we found that we were very good at making AI dance to our tune. We don’t really
    know why we are good at this (Experience? A background in game design and teaching?
    An ability to take the “perspective” of the AI, of the instructor, and of the
    student? Our experience in writing instructions for a variety of audiences?),
    but it suggests that there may be a role for humans who are experts at working
    with AI in particular fields. We just haven’t quite pinpointed the specific skills
    or expertise that taps into the ability to “speak” to the AI.


    An AI future requires that we lean into building our own expertise as human experts.
    Since expertise requires facts, students will still need to learn reading, writing,
    history, and all the other basic skills required in the twenty-first century.
    We have already seen how this broad-based knowledge can help people get the most
    out of AI. And besides, we need to continue to have educated citizens rather than
    delegate all our thinking to machines. Students may also need to start to develop
    a narrow focus, picking an area where they are better able to work with AI as
    experts themselves. At the same time, our total range of abilities will grow broader,
    as the AI fills gaps and helps mentor us to increase our own skills. If the capabilities
    of AI do not change radically, it is likely that AI truly becomes our co-intelligence,
    helping us fill the gaps in our own knowledge and pushing us to become better
    ourselves. But this is not the only future we need to be thinking about.


    # 9 AI AS OUR FUTURE


    This book may seem as if it is full of science fiction, but everything I am describing
    has already happened. We have created a weird alien mind, one that isn’t sentient
    but can fake it remarkably well. It is trained on the vast archives of human knowledge,
    and also on the backs of low-paid workers. It can pass tests and act creatively,
    with the potential to change how we work and learn; but it also makes up information
    regularly. You can no longer trust that anything you see, or hear, or read was
    not created by AI. All of that already happened. Humans, walking and talking bags
    of water and trace chemicals that we are, have managed to convince well-organized
    sand to pretend to think like us.


    What happens next is science fiction—or rather, science fictions, because there
    are many possible futures. I see four clear possibilities for what will happen
    in the next few years in the world of AI. The implications of each possibility,
    however, are less clear. I want to lay out each possibility for you, and what
    the world may look like as a result.


    Let us start with the most unlikely future, which, disturbingly enough, is not
    the possibility of `AGI`. Far less likely is the possibility that AI has already
    reached its limits, but that is where we will start.


    ## Scenario 1: As Good as It Gets


    What if AIs stop making huge leaps forward? Sure, there may be small improvements
    here or there, but in this future, they are vanishingly small compared to the
    huge leaps that we saw from `GPT-3.5` and `GPT-4`. The AI you are using now really
    is the best you will ever use.


    From a technical perspective, this seems like an unrealistic outcome. There is
    no reason to suspect that we have hit any sort of natural limit in the ability
    of AIs to improve. That doesn’t mean `LLMs` will inevitably keep getting smarter:
    researchers have identified many possible problems with their underlying architecture
    and training that may, at some point, limit how capable they can become. For example,
    the AI systems may run out of data to train on; or the cost and effort of scaling
    up the computing power to run AIs may become too large to justify. But there is
    little evidence that the limitations have already been reached, and even if they
    were, there are other tweaks and changes that could be made to `LLMs` to squeeze
    more out of the systems for years to come. And `LLMs` are just one approach to
    AI; other successor technologies may overcome these limits.


    Slightly more possible is a world where regulatory or legal action stops future
    AI development. Maybe AI safety experts convince governments to ban AI development,
    complete with threats of force against any who dare breach these limits. But,
    given that most governments are only just beginning to consider regulation, and
    there’s a lack of international consensus, it seems extremely unlikely that a
    global ban will happen soon or that regulation will make AI development grind
    to a halt.


    Nonetheless, this scenario seems to be the one most people and organizations are
    planning for. And I understand that denial. Most people didn’t ask for an AI that
    can do many tasks previously reserved for humans. Teachers did not want to see
    almost every form of homework instantly be solvable by a computer. Employers did
    not want highly paid tasks that are only meaningful when done by humans (performance
    reviews, reporting) to be done by machines instead. Government officials did not
    want a perfect disinformation system released without any useful countermeasures.
    The world got much stranger, very quickly.


    So it is not surprising that so many people are trying to deal with the implications
    of AI by assuming that nothing is going to change, by banning it permanently,
    or even imagining that the changes brought by AI can be easily contained. As we
    have seen, those policies are not likely to work. Worse yet, the substantial benefits
    of AI are going to be greatly reduced by trying to pretend it is just like previous
    waves of technology, where changes take decades to occur.

