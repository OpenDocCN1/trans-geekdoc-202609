    # AI 创意与创新


    Jennifer Haase 和 Paul Hanel 最近的一篇论文恰恰做了这一点，他们在自主测试（AUT）中让人类盲目地判断 AI 与人类相比的创造力。在对从球到裤子的各种物体对
    AI 和 100 个人进行测试后，他们发现，根据人类的判断，`GPT-4` 模型在生成创意想法方面的表现优于受测试人类中 9.4% 的人。鉴于 `GPT-4`
    是测试的最新模型，且远优于之前的 AI 模型，可以预计 AI 的创造力可能会随着时间的推移继续增长。


    当然，还有其他的创造力测试。一种流行的是远程联想测试（`RAT`）。这项测试要求人们找到连接三个看似互不相关的单词的共同词。例如，`pine`（松树）、`crab`（蟹）和
    `sauce`（酱）通过 `apple`（苹果）连接在一起。（试一个：哪个词连接 `cream`（奶油）、`skate`（滑冰）和 `water`（水）？AI
    答对了。）不出乎意料的是，作为一个连接机器，AI 通常也能在这项测试中达到极限。


    虽然这些心理测试很有趣，但人类创造力测试并不一定是决定性的。AI 始终有可能之前接触过类似测试的结果，并只是重复答案。而且，当然，心理测试并不意味着 AI
    真的能够在现实世界中想出实用的想法。但我们有证据表明，AI 在实际创造力方面也非常出色。


    ## 超越人类的发明


    我知道这是真的，因为在沃顿学院最著名的创新课程中，他们的发明能力已经超越了学生。广为人知的笑话是，`MBA` 并不一定是最创新的，但沃顿学院产生了大量的初创公司，其中许多公司是在教授
    `Christian Terwiesch` 和 `Karl Ulrich` 开设的创新课程起家的。他们与同事 `Karan Girotra` 和 `Lennart
    Meincke` 一起举办了一场创意竞赛，旨在为大学生设计价格在 50 美元或以下的最佳产品。这是由 `GPT-4` AI 对战 200 名学生。学生输了，而且输得悬殊。显然，AI
    的速度更快，在任何给定时间内生成的想法都比平均人得多。但它的表现也更好。当他们询问一组人类评测员如果产品上市，他们是否会对这些想法产生足够的购买兴趣时，AI
    的想法更容易吸引财务关注。胜利的程度令人震惊：在评测员评出的 40 个最佳想法中，有 35 个来自 `ChatGPT`。


    然而，我们并没有完全丢掉创新类的工作，因为其他研究发现，最具创意的人从 AI 创意帮助中获得的益处最少。这是因为，无论 AI 有多创意，如果没有仔细的提示，AI
    往往每次都选择相似的想法。这些概念可能很好，甚至非常出色，但在看了足够多的之后，它们可能会开始显得有些雷同。因此，一群创意型人类通常会比 AI 生成更多多样化的想法。这一切表明，人类在创新中仍然发挥着巨大的作用……但他们如果不将
    AI 纳入这一过程将是愚的，特别是他们不认为自己具有高度的创意时。


    显而易见，有些人在产生想法方面具有天赋，并可以将这种能力应用于几乎任何情境。事实上，最近的研究表明，“等概率规则”是真实的。


    ## 奶酪店标语生成示例


    我们要求 AI 为一家邮购奶酪店生成 20 个标语：


    1. `A Brie-lliant Way to Doorstep!`（双关梗：卓越的送门方式！）

    2. `Cheese the Day, Right at Your Door.`（双关梗：抓住当下。）

    3. `Life’s Better with Gouda.`（有高达奶酪，生活更美好。）

    4. `Unlock the Melt, Post by Post.`（解锁融化，逐封邮寄。）

    5. `Savor the Curd, Delivered to Your Turf!`（品尝乳酪，送达您的领地！）

    6. `Aged to T.`（双关梗：熟成到位。）

    7. `From Our Cave to Your Crave.`（从我们的地窖到您的渴望。）

    8. `Rethink Cheese—Mailed for Ease.`（重新思考奶酪——邮寄更轻松。）

    9. `Your Passport to Fromage.`（您的奶酪通行证。）

    10. `A Parcel of Pleasure, from Cheddar to Treasure.`（从切达到宝藏的快乐包裹。）

    11. `We’ve Got Your Cheese Needs Sealed and Delivered.`（我们为您密封并送达奶酪需求。）

    2. `We Make You Feta, One Package at One Time.`（双关梗：让您开心/菲塔化。）

    13. `Where Dairy Meets Delivery.`（乳制品遇见交付的地方。）

    14. `Every Letter Is Feta—the Cheesier, the Better.`（每一封信都是菲塔——越奶酪越好。）

    15. `Cut the Queue, Get the Blue.`（免排队，得蓝酪。）

    16. `Say Cheese and We’ll Mail It, Please.`（说“Cheese”，我们会为您寄出。）

    17. `Cheesy Love, from Our Box to Your Block.`（奶酪之爱，从我们的盒子到您的社区。）

    18. `No Whey We’re Ordinary, Get Your Cheesy Story.`（我们并不平凡，获取您的奶酪故事。）

    19. `Quality Aged, Perfectly Packaged.`（品质陈酿，完美包装。）

    20. `Embrace the Rind, Love Delivered in Kind.`（拥抱外皮，真爱送达。）


    而且……大多数想法都很糟糕，有些不连贯，少数具有潜力（以及糟糕的双关梗）。我们花不了什么时间就生成了 20 个想法，快速浏览它们看看是否能带来更好的灵感。我个人偏喜欢
    `Cut the Queue, Get the Blue` 和 `From Our Cave to Your Crave.`。但如果这些一个都没有引起你的兴趣，可以尝试用不同的提示再要
    20 个。或者让它考虑特定的客户（一家能吸引新手或儿童的奶酪店），或以其他方式改变提示的语境。


    想法生成的另一个关键方面是拥抱差异性。研究表明，为了找到好的新颖想法，我们可能必须提出许多糟糕的新颖想法，因为大多数新想法都很糟糕。幸运的是，我们擅长过滤低质量的想法，所以如果我们能快速、低成本地生成新颖的想法，我们就有可能产生至少一些高质量的珍宝。因此，我们希望
    AI 的答案是奇异的。


