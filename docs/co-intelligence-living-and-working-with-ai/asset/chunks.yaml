- fmt: '

    In 2023, many companies advertised six-figure salaries for “AI whisperer” roles,
    and for good reason—as we have seen, working with AI is far from intuitive. And
    any time a new job title with high pay appears, so does a huge number of courses,
    instruction manuals, and YouTube channels offering the knowledge you (yes, YOU)
    need to get rich today.


    To be clear, `prompt engineering` is likely a useful near-term skill. But I don’t
    think `prompt engineering` is so complicated. You actually have likely read enough
    at this point to be a good `prompt engineer`. Let’s start with the third principle
    I shared earlier—treat AI like a person and tell it what kind of person it is.
    `LLMs` work by predicting the next word, or part of a word, that would come after
    your prompt, sort of like a sophisticated autocomplete function. Then they continue
    to add language from there, again predicting which word will come next. So the
    default output of many of these models can sound very generic, since they tend
    to follow similar patterns that are common in the written documents the AI was
    trained on. By breaking the pattern, you can get much more useful and interesting
    outputs. The easiest way to do that is to provide context and constraints, as
    we saw in chapter 5.


    For slightly more advanced prompts, think about what you are doing as programming
    in prose. You can give the AI instructions and it mostly sort-of follows them.
    Mostly, because there is a lot of randomness associated with AI outputs, so you
    will not get the consistency of a standard computer program. But it can be worth
    thinking about how you can provide a very clear and logical prompt to the AI.


    A lot of active research is happening around the best way to “program” an `LLM`,
    but one practical implication is that it can help to give the AI explicit instructions
    that go step by step through what you want. One approach, called `chain-of-thought
    prompting`, gives the AI an example of how you want it to reason, before you make
    your request. Even more usefully, you can also provide step-by-step instructions
    that build on each other, making it easier to check the output of each step (letting
    you refine the prompt later), and which will tend to make the output of your prompts
    more accurate.


    Here is an example: let’s say I wanted to include a good analogy of an AI tutor
    in this chapter, and wanted to get help from an AI. I could simply ask for one:
    Tell me a good analogy for an AI tutor. And the response was a little unsatisfying:
    An AI tutor is like a musical metronome, because it is consistent, adaptable,
    and a mere tool.


    Now we can try applying some of these other techniques: Think this through step
    by step: come up with good analogies for an AI tutor. First, list possible analogies.
    Second, critique the list and add three more analogies. Next, create a table listing
    pluses and minuses of each. Next, pick the best and explain it. Here, `GPT-4`
    considered a dozen suggestions, from personal trainer to gardener, and created
    a table comparing them all, before settling on a `GPS system`, which, much like
    an AI tutor, is designed to assist users in navigating unfamiliar terrain. It
    provides real-time feedback, adjusts recommendations based on changing conditions
    (e.g., traffic or construction), and offers alternative routes when the user goes
    off track. Similarly, an AI tutor guides students through the academic terrain,
    offering real-time feedback, adjusting based on the student’s progress, and providing
    alternative learning paths when necessary. This analogy also emphasizes the idea
    that while the tool provides guidance, it’s up to the user (or student) to drive
    and make the journey, reinforcing the collaborative nature of learning with AI.
    Much improved, due to a little `prompt engineering`.


    However, all of this remains much less a science than an art, and AIs still work
    more like people than software. For example, in a study where AIs tested many
    different kinds of prompts, Google’s most advanced model responded best to a prompt
    that began “Take a deep breath and work on this problem step by step!” Given their
    inability to breathe, or to panic, I don’t think anyone would have suspected that
    this would be the most effective way to get an AI to do what you want, but it
    scored higher than the best logical prompts that humans created.


    After this complexity, prompt crafting might be a little confusing and intimidating.
    So I have good news for you (and bad news for the people who want to make prompt
    crafting the future of education). Being “good at prompting” is a temporary state
    of affairs. The current AI systems are already very good at figuring out your
    intent, and they are getting better. If you want to do something with AI, just
    ask it to help you do the thing. “I want to write a novel; what do you need to
    know to help me?” will get you surprisingly far. And remember, AI is only going
    to get better at guiding us, rather than requiring us to guide it. Prompting is
    not going to be that important for that much longer.


    This doesn’t mean we shouldn’t teach about AI in schools. It is critical to give
    students an understanding of the downsides of AI, and the ways it can be biased
    or wrong or can be used unethically. However, rather than distorting our education
    system around learning to work with AI via `prompt engineering`, we need to focus
    on teaching students to be the humans in the loop, bringing their own expertise
    to bear on problems. We know how to teach expertise. We try to do it in school
    all the time, but it is a hard process. AI might make it easier.


    ### Flipped Classrooms and AI Tutors


    We know something about what the classrooms of the future will look like. AI cheating
    will remain undetectable and widespread. AI tutoring will likely become excellent,
    but not a replacement for school. Classrooms provide so much more: opportunities
    to practice learned skills, collaborate on problem-solving, socialize, and receive
    support from instructors. School will continue to add value, even with excellent
    AI tutors. But those tutors will change education. They already have. Just a few
    months after the release of `ChatGPT`, I noticed that students were raising their
    hands less to ask questions. When I asked why, one student told me, “Why raise
    your hand in class when you can ask `ChatGPT`?”


    The biggest change will be in how teaching actually happens. Today, that is often
    by an instructor lecturing a class. A good lecture can be a powerful thing, but
    it takes work—to be effective it needs to well organized, include opportunities
    for students to interact with the teacher, and continuously relate ideas back
    to one another. In the near term, AI can help instructors prepare lectures that
    are grounded in content and take into account how students learn. We have already
    been finding that AI is very good at assisting instructors to prepare more engaging,
    organized lectures and make the traditional passive lecture far more active.


    In the longer term, however, the lecture is in danger. Too many involve passive
    learning, where students simply listen and take notes without engaging in active
    problem-solving or critical thinking. Moreover, the one-size-fits-all approach
    of lectures doesn’t account for individual differences and abilities, leading
    to some students falling behind while others become disengaged due to a lack of
    challenge.


    A contrasting philosophy, active learning, reduces the importance of the lecture,
    asking students to participate in the learning process through activities like
    problem-solving, group work, and hands-on exercises. In this approach, students
    collaborate with one another and the instructor. Multiple studies support the
    growing consensus that active learning is one of the most effective approaches
    to education, but it can take effort to develop active learning strategies, and
    students still need proper initial instruction. So how can active learning and
    passive learning coexist?

    '
