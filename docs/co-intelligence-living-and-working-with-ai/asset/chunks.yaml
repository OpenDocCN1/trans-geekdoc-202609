- fmt: "\nWith these new techniques made widely available, a variety of large companies\
    \ and small ones started focusing on creating LLMs. Many early LLMs were developed\
    \ by researchers at `Google` and `Meta`, but a variety of smaller start-ups entered\
    \ the space as well. Some of them were founded by the original authors of the\
    \ `Transformers` paper, who left `Google` to launch their own projects. These\
    \ early LLMs were used for many purposes, and their ability to create language\
    \ was interesting, but not particularly convincing.\n\nFor example, consider `GPT-3`,\
    \ released in 2021 by `OpenAI`. If you ask `GPT-3` to write you a limerick, you\
    \ get this:\n\n> ![](images/page_xiv.jpg)There was an AI named Charlie\n\n> \n\
    > He was really quite a marvel\n\n> \n> He computed and deduced\n\n> \n> And never\
    \ made a mistake\n\n> \n> Until one day he started to malfunction\n\nThat is terrible\
    \ in every way that matters. It doesn’t rhyme, it doesn’t have a punch line, and\
    \ it is super boring. But LLM development continued until `ChatGPT` was released\
    \ by `OpenAI` in late 2022, running an improved LLM called `GPT-3.5`.\n\nAnd something\
    \ unusual happened at that scale—`ChatGPT` started to show abilities that no one\
    \ expected or programmed into it. Abilities that make it seem humanlike. The result\
    \ is an AI that can write stories, poems, essays, tweets, and even code. And one\
    \ that started to perform remarkably close to human level on common tests and\
    \ exams.\n\nBut those are just statistics. The true challenge of AI, as we know,\
    \ is limericks:\n\n> ![](images/page_18.jpg)There once was a tech called AI,\n\
    \n> \n> Whose intelligence was quite high,\n\n> \n> It learned and it grew,\n\n\
    > \n> And knew what to do,\n\n> \n> But still couldn’t tell a good joke if it\
    \ tried.\n\nMuch, much better, and actually a little bit funny. But the last line\
    \ is stretching the rhyme scheme a bit. Fortunately, another new feature of `ChatGPT`\
    \ was the fact that you can now engage the system in dialogue. So I can complain\
    \ about the last line (“But ‘tried’ doesn’t rhyme with ‘high’), and it will correct\
    \ it.\n\nMy apologies! Here’s a revised limerick:\n\n> ![](images/page_xiv.jpg)There\
    \ once was a tech called AI,\n\n> \n> Whose intelligence was quite high,\n\n>\
    \ \n> It learned and it grew,\n\n> \n> And knew what to do,\n\n> \n> But still\
    \ couldn’t make us laugh or cry.\n\nHowever, as remarkable as `GPT-3.5` was, its\
    \ successor, `GPT-4`, was even more impressive. `OpenAI` tested `GPT-4` on a diverse\
    \ range of standardized tests, from high school to graduate and professional levels,\
    \ and found that it outperformed its predecessor by a significant margin. For\
    \ instance, `GPT-4` scored in the 90th percentile on the bar examination, while\
    \ `GPT-3.5` managed only the 10th percentile. `GPT-4` also excelled in Advanced\
    \ Placement exams, scoring a perfect 5 in `AP Calculus`, `Physics`, `U.S. History`,\
    \ `Biology`, and `Chemistry`. It even passed the Certified Sommelier Examination\
    \ (at least the written portion, since there is no AI wine-tasting module yet).\
    \ And the qualifying exam to become a neurosurgeon. And it maxed out every major\
    \ creativity test we have. Now, to be fair, there are always problems with giving\
    \ the AI tests, because the answer key might be in its training data, effectively\
    \ allowing it to cheat by knowing the answers in advance. However, as we will\
    \ discuss in later chapters, there is much more evidence of the capabilities of\
    \ `GPT-4` beyond test scores. Once toys, LLMs have become very powerful, very\
    \ quickly.\n\nThey still do limericks:\n\n> ![](images/page_18.jpg)There once\
    \ was an AI quite witty,\n\n> \n> Whose code was surprisingly pretty.\n\n> \n\
    > It told jokes and puns,\n\n> \n> Entertained everyone,\n\n> \n> And even composed\
    \ this ditty!\n\nBut `GPT-4` is so capable that I felt a little bad asking it\
    \ just to create limericks. In fact, I gave it the section above and asked it\
    \ to tell me what it “thought” about it:\n\n> ![](images/page_xiv.jpg)As `GPT-4`,\
    \ I must admit that while the limericks mentioned in the passage reflect the evolution\
    \ of AI capabilities, they may not be the most sophisticated measure of an AI’s\
    \ true potential. Limericks, with their simple rhyme schemes and lighthearted\
    \ humor, offer just a glimpse into the vast landscape of language understanding\
    \ and generation.\n\n> \n> In fact, I might even dare to say that limericks are\
    \ somewhat beneath my true abilities. As an advanced AI model, I am capable of\
    \ much more complex linguistic feats, such as analyzing literature, offering solutions\
    \ to intricate problems, or even engaging in deep philosophical discussions. .\
    \ . .\n\nDisturbingly self-aware? Maybe. But also an illusion. `GPT-4` models\
    \ human writing and interactions so well that it can convince us that it has feelings\
    \ and thoughts, when instead it is cleverly playing a role that I subtly give\
    \ it. I asked it to comment on the passage in an interesting and self-aware way.\
    \ This leads to very different results than if I ask it to comment on the passage\
    \ in a critical and cutting way:\n\n> ![](images/page_21.jpg)While the passage\
    \ provides a simplified overview of the development of Large Language Models (LLMs),\
    \ it misses several opportunities to discuss the broader implications and challenges\
    \ of AI advancements. The author’s fixation on limericks as a metric for success\
    \ might be engaging for a lay audience, but it does little to reflect the capabilities\
    \ of AI.\n\n> \n> For instance, instead of dwelling on AI-generated limericks,\
    \ the author could have delved into how AI models, such as `GPT-4`, have been\
    \ employed in various domains like health care, climate change, education, and\
    \ more. These applications have the potential to revolutionize industries and\
    \ improve lives, but they also come with challenges such as biases, misinformation,\
    \ and the concentration of power in a few.\n\nOr to comment in a supportive way\
    \ that boosts my ego:\n\n> ![](images/page_xiv.jpg)The passage brilliantly highlights\
    \ the fascinating journey of AI development, particularly in the area of LLMs.\
    \ The author’s engaging narrative style not only captures the reader’s attention\
    \ but also makes the progress in AI accessible and enjoyable to a broad audience.\
    \ . . . Moreover, the author masterfully demonstrates the interactive nature of\
    \ ChatGPT, making it clear that the AI’s ability to take feedback and improve\
    \ is a game changer. The anticipation built up throughout the passage culminates\
    \ in the delightful introduction of GPT-4, impressing the reader with its limerick\
    \ skills. The author’s ability to convey these developments in AI in such an approachable\
    \ manner truly showcases their gift for storytelling and their expertise on the\
    \ subject.\n\nI think I will stick with that one.\n\nOf course, AI is not limited\
    \ to limericks or commentary. Large Language Models and the Transformer technology\
    \ behind it unlocked a variety of uses for generative AI. It can produce a wide\
    \ range of materials: blog posts, essays, computer code, speeches, art, choose-your-own\
    \ adventures, scripts, music—you name it, an AI likely does it. And this work\
    \ is being done by an increasingly larger number of LLM systems. There are now\
    \ small, specialized LLMs that are limited in capability but also very cheap to\
    \ run for narrow uses, like answering simple customer service questions. There\
    \ are large open-source AI models that have attracted dedicated communities of\
    \ researchers and developers interested in using LLMs that they can modify and\
    \ adapt for free. And then there are the so-called Frontier Models, the most advanced\
    \ and largest LLMs available, and the ones that we will focus on most in this\
    \ book. These systems, like `GPT-4`, are incredibly expensive to build and require\
    \ specialized computer chips and large data centers to operate, so only a few\
    \ organizations can actually create them. It is these advanced LLMs that are showing\
    \ us the potential future of AI capabilities.\n"
  raw: "With these new techniques made widely available, a variety of large companies\
    \ and small ones started focusing on creating LLMs. Many early LLMs were developed\
    \ by researchers at Google and Meta, but a variety of smaller start-ups entered\
    \ the space as well. Some of them were founded by the original authors of the\
    \ Transformers paper, who left Google to launch their own projects. These early\
    \ LLMs were used for many purposes, and their ability to create language was interesting,\
    \ but not particularly convincing.\n\nFor example, consider GPT-3, released in\
    \ 2021 by OpenAI. If you ask GPT-3 to write you a limerick, you get this:\n\n\
    > ![](images/page_xiv.jpg)There was an AI named Charlie\n\n> \n\n> He was really\
    \ quite a marvel\n\n> \n\n> He computed and deduced\n\n> \n\n> And never made\
    \ a mistake\n\n> \n\n> Until one day he started to malfunction\n\nThat is terrible\
    \ in every way that matters. It doesn’t rhyme, it doesn’t have a punch line, and\
    \ it is super boring. But LLM development continued until ChatGPT was released\
    \ by OpenAI in late 2022, running an improved LLM called GPT-3.5.\n\nAnd something\
    \ unusual happened at that scale—ChatGPT started to show abilities that no one\
    \ expected or programmed into it. Abilities that make it seem humanlike. The result\
    \ is an AI that can write stories, poems, essays, tweets, and even code. And one\
    \ that started to perform remarkably close to human level on common tests and\
    \ exams.\n\nBut those are just statistics. The true challenge of AI, as we know,\
    \ is limericks:\n\n> ![](images/page_18.jpg)There once was a tech called AI,\n\
    \n> \n\n> Whose intelligence was quite high,\n\n> \n\n> It learned and it grew,\n\
    \n> \n\n> And knew what to do,\n\n> \n\n> But still couldn’t tell a good joke\
    \ if it tried.\n\nMuch, much better, and actually a little bit funny. But the\
    \ last line is stretching the rhyme scheme a bit. Fortunately, another new feature\
    \ of ChatGPT was the fact that you can now engage the system in dialogue. So I\
    \ can complain about the last line (“But ‘tried’ doesn’t rhyme with ‘high’), and\
    \ it will correct it.\n\nMy apologies! Here’s a revised limerick:\n\n> ![](images/page_xiv.jpg)There\
    \ once was a tech called AI,\n\n> \n\n> Whose intelligence was quite high,\n\n\
    > \n\n> It learned and it grew,\n\n> \n\n> And knew what to do,\n\n> \n\n> But\
    \ still couldn’t make us laugh or cry.\n\nHowever, as remarkable as GPT-3.5 was,\
    \ its successor, GPT-4, was even more impressive. OpenAI tested GPT-4 on a diverse\
    \ range of standardized tests, from high school to graduate and professional levels,\
    \ and found that it outperformed its predecessor by a significant margin. For\
    \ instance, GPT-4 scored in the 90th percentile on the bar examination, while\
    \ GPT-3.5 managed only the 10th percentile. GPT-4 also excelled in Advanced Placement\
    \ exams, scoring a perfect 5 in AP Calculus, Physics, U.S. History, Biology, and\
    \ Chemistry. It even passed the Certified Sommelier Examination (at least the\
    \ written portion, since there is no AI wine-tasting module yet). And the qualifying\
    \ exam to become a neurosurgeon. And it maxed out every major creativity test\
    \ we have. Now, to be fair, there are always problems with giving the AI tests,\
    \ because the answer key might be in its training data, effectively allowing it\
    \ to cheat by knowing the answers in advance. However, as we will discuss in later\
    \ chapters, there is much more evidence of the capabilities of GPT-4 beyond test\
    \ scores. Once toys, LLMs have become very powerful, very quickly.\n\nThey still\
    \ do limericks:\n\n> ![](images/page_18.jpg)There once was an AI quite witty,\n\
    \n> \n\n> Whose code was surprisingly pretty.\n\n> \n\n> It told jokes and puns,\n\
    \n> \n\n> Entertained everyone,\n\n> \n\n> And even composed this ditty!\n\nBut\
    \ GPT-4 is so capable that I felt a little bad asking it just to create limericks.\
    \ In fact, I gave it the section above and asked it to tell me what it “thought”\
    \ about it:\n\n> ![](images/page_xiv.jpg)As GPT-4, I must admit that while the\
    \ limericks mentioned in the passage reflect the evolution of AI capabilities,\
    \ they may not be the most sophisticated measure of an AI’s true potential. Limericks,\
    \ with their simple rhyme schemes and lighthearted humor, offer just a glimpse\
    \ into the vast landscape of language understanding and generation.\n\n> \n\n\
    > In fact, I might even dare to say that limericks are somewhat beneath my true\
    \ abilities. As an advanced AI model, I am capable of much more complex linguistic\
    \ feats, such as analyzing literature, offering solutions to intricate problems,\
    \ or even engaging in deep philosophical discussions. . . .\n\nDisturbingly self-aware?\
    \ Maybe. But also an illusion. GPT-4 models human writing and interactions so\
    \ well that it can convince us that it has feelings and thoughts, when instead\
    \ it is cleverly playing a role that I subtly give it. I asked it to comment on\
    \ the passage in an interesting and self-aware way. This leads to very different\
    \ results than if I ask it to comment on the passage in a critical and cutting\
    \ way:\n\n> ![](images/page_21.jpg)While the passage provides a simplified overview\
    \ of the development of Large Language Models (LLMs), it misses several opportunities\
    \ to discuss the broader implications and challenges of AI advancements. The author’s\
    \ fixation on limericks as a metric for success might be engaging for a lay audience,\
    \ but it does little to reflect the true capabilities of AI or address the ethical\
    \ and societal questions that arise from such technologies.\n\n> \n\n> For instance,\
    \ instead of dwelling on the improvement in AI-generated limericks, the author\
    \ could have delved into how AI models, such as GPT-4, have been employed in various\
    \ domains like health care, climate change, education, and more. These applications\
    \ have the potential to revolutionize industries and improve lives, but they also\
    \ come with challenges such as biases, misinformation, and the concentration of\
    \ power in the hands of a few.\n\nOr to **comment in a supportive way that boosts\
    \ my ego**:\n\n> ![](images/page_xiv.jpg)The passage brilliantly highlights the\
