    在常规手术培训中，经验丰富的医生和实习住院医生可以并肩工作，医生会在住院生观察并尝试技术时细心地地提供帮助。而在机器人手术中，只有一个控制机器人的座椅，这通常由资深主刀医生占据，而实习生则被降为旁观者、获得短暂的机器操作机会，或者仅仅使用模拟器。在巨大的时间压力下，住院生必须在学习传统手术技能与利用自己的业余时间自行研究如何使用这些新机器人之间做出选择。虽然许多医生最终导致了培训不足，但那些想要学习使用机器人手术设备的人却背离了官方渠道。他们通过观看
    YouTube 频道进行自己的“影子学习”，或者在活体病人身上进行比他们本该多多的训练。


    随着 AI 自动化处理越来越多的基础任务，同样的培训危机也将会蔓延。即使专家将成为唯一能够有效检查日益强大的 AI 之工作的人，但我们仍面临着中断专家培养路径的危险。在
    AI 世界中变得有用的方法，是作为人类拥有高水平的专业知识。好消息是，教育者对于如何培养专家了如指掌。讽刺的是，这意味着回归基础——但要适应一个已被 AI
    彻底变革的学习环境。


    ### 在 AI 时代建立专业知识


    AI 擅长发现事实、总结论文、写作和编码任务。而且，通过在海量数据上训练并访问互联网，大语言模型似乎积累并掌握了大量的人类集体知识。这个庞大且可开发的知识库现在就在每个人的指尖。因此，教授基础事实已经过时似乎是合乎逻辑的。然而，事实证明情况恰恰相反。


    这就是 AI 时代知识获取的悖论：我们可能认为自己不需要努力去记忆和积累基础技能，或者建立一个基础知识库——毕竟，这正是 AI 擅长的。基础性技能学习起来总是很枯燥，似乎已经过时。如果存在通往专家的捷径，它们可能确实过时。但通往专的道路需要事实的支撑。


    学习任何技能和掌握任何领域都需要死记硬背、仔细的技能构建和有针对的练习，而 AI（以及未来的几代 AI）在许多早期技能上无疑比初学者更好。例如，斯坦福大学的研究人员发现，`GPT-4`
    AI 在最终临床推理考试中的得分高于大一和大二的医学生。因此，诱可能是将这些基础技能外包给 AI。毕竟，医生们乐于使用医疗应用和互联网来帮助诊断患者，而不是仅仅记忆医学信息。这难道不是同一回事吗？


    问题在于，为了学习批判性思考、解决问题、理解抽象概念、对新颖问题进行推理以及评估 AI 的输出，我们需要学科专业知识。一位了解学生和课堂、并具备教学内容知识的专家教育者，可以评估
    AI 编写的大纲或 AI 生成的测验；一位掌握设计原则和建筑规范的资深建筑师，可以评估 AI 提的建筑计划的可性；一位拥有人体解剖学和疾病广泛知识的医生，可以审查
    AI 生成的诊断或治疗方案。我们越接近 AI 增强工作的半人（Cyborgs）和半马（Centaurs）世界，就越需要维护和培养人类的专业知识。我们需要在回路中引入专家。


    ### 刻意练习的要求


    所以，让我们考虑建立专业知识需要什么。首先，它需要一个计划。之后，我们必须练习。重要的不仅仅是练习的时间（10,000 小时并不是什么魔术数字，无论你读到什么），而是正如心理学家安德斯·艾里克森（Anders
    Ericsson）发现的，练习的类型。专家通过刻意练习成为专家的，这比仅仅重复任务要困难得多。相反，刻意练习需要认真的投入和不断增加难度。它还需要教练、老师或导师，他们可以提供反馈并推动学习者走出自己的舒适区。


    以古典钢琴世界为例。想象两个学生：Sophie 和 Naomi。Sophie 下午都在反复一遍地弹奏她自己熟悉的曲子。她可能连续这样弹好几个小时，认为纯粹的重复就能提高她的技能。随着她在工作上做得越来越好，她感到很有成就感。相反，Naomi
    在资深钢琴老师的指导下进行练习。她从弹奏音阶开始，然后逐渐转向更具挑战性的曲目。当她出错时，她的老师会指出，不是为了责备她，而是为了帮助她理解并纠正。Naomi
    还会定期为自己设定目标，例如掌握乐曲中特别棘手的部分，或提高在某些段落中的速度和敏捷性。这个过程比 Sophie 的经历无趣得多，因为 Naomi 的挑战随着她技能的增长而升级，确保她始终面临着某种程度的困难。然而，随着时间的推移，即使两个学生花费了相同的练习小时，Naomi
    在技能、精准和技巧上很可能超越 Sophie。这种方法和结果的差异说明了单纯重复与刻意练习之间的差距。后者具有挑战、反馈和渐进的元素，是通往精通的真正道路。


    但这种练习非常困难。它需要一个计划，还需要一位能够不断提供反馈和指导的教练。优秀的教练是稀缺的，而且他们本身就是熟练的专家，这使得获得刻意练习成功所需的指导变得困难。AI
    可能能够帮助直接解决这些问题，创建一个比我们现在更好的培训系统。

