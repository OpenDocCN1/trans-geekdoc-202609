    ### The Impact of AI on Work and Life


    Finally, as great as previous General Purpose Technologies were, their impact
    on work and education may actually be less than AI. Where previous technological
    revolutions often targeted mechanical and repetitive work, AI works, in many ways,
    as co-intelligence. It augments, or potentially replaces, human thinking to dramatic
    results. Early studies of the effects of AI have found it can often lead to a
    20 to 80 percent improvement across a wide variety of job types, from coding to
    marketing. By contrast, when steam power, that most fundamental of General Purpose
    Technologies, the one that created the Industrial Revolution, was put into a factory,
    it improved productivity by 18 to 22 percent. And despite decades of looking,
    economists have had difficulty showing a real long-term productivity impact of
    computers and the internet over the past twenty years.


    Plus, General Purpose Technologies aren’t just about work; they touch every aspect
    of our lives. They change how we teach, entertain ourselves, interact with other
    people, and even our sense of self. Schools are in an uproar over the future of
    writing based on the first generation of AI, and AI tutors may radically change
    how we educate students. AI-driven entertainment allows for stories to be personalized
    to us and is sending shock waves through Hollywood. And AI-driven misinformation
    is already flowing through social networks in ways that are difficult to detect
    and deal with.


    ### The Alien in the Room


    And all of this ignores the larger issue, the alien in the room. We have created
    something that has convinced many smart people that it is, in some way, the spark
    of a new form of intelligence. An AI that has blown through both the `Turing Test`
    (Can a computer fool a human into thinking it is human?) and the `Lovelace Test`
    (Can a computer fool a human on creative tasks?) within a month of its invention,
    an AI that aces our hardest exams, from the bar exam to the neurosurgery qualifying
    test. An AI that maxes out our best measures for human creativity and our best
    tests for sentience. Even weirder, it is not entirely clear why the AI can do
    all these things, even though we built the system and understand how it technically
    works.

