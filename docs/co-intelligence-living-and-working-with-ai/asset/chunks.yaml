- fmt: '

    For example, some tasks are fully automated, reliable, and scalable by AI without
    any human intervention or supervision. Spam filtering is an example of an `Automated
    Task` that you likely already delegate to an AI system without much worry or oversight.
    Other tasks, like high-frequency trading, have also long been delegated to pre-LLM
    forms of AI. As AIs start to act more like agents, capable of executing on goals
    autonomously, we will see more automation of tasks, but that is still a work in
    progress. For example, I gave an early form of AI agent (with the cute but slightly
    worrying name of `BabyAGI`) the goal of writing the best closing sentence to this
    paragraph on the future of agents. It lost its way a bit in the process, developing
    a twenty-one-step plan for solving the problem of writing a single sentence (with
    steps like “Explore methods to ensure AI agents are used responsibly to improve
    economic decision-making”) and going down numerous internet rabbit holes before
    giving up. Future agents will act less like confused interns, and it is likely
    that we will see many more `Automated Tasks` in the future.


    ### Centaurs and Cyborgs


    Until AIs become very good at a range of `Automated Tasks`, the most valuable
    way to use AI at work is to become a Centaur or Cyborg. Fortunately, this does
    not involve getting cursed to turn into the half human–half horse of Greek myth
    or grafting electronic gizmos to your body. They are rather two approaches to
    co-intelligence that integrate the work of person and machine. Centaur work has
    a clear line between person and machine, like the clear line between the human
    torso and horse body of the mythical centaur. It depends on a strategic division
    of labor, switching between AI and human tasks, allocating responsibilities based
    on the strengths and capabilities of each entity. When I am doing an analysis
    with the help of AI, I will decide on what statistical approaches to do but then
    let the AI handle producing graphs. In our study at BCG, Centaurs would do the
    work they were strongest at themselves, and then hand off tasks inside the `Jagged
    Frontier` to the AI.


    On the other hand, Cyborgs blend machine and person, integrating the two deeply.
    Cyborgs don’t just delegate tasks; they intertwine their efforts with AI, moving
    back and forth over the `Jagged Frontier`. Bits of tasks get handed to the AI,
    such as initiating a sentence for the AI to complete, so that Cyborgs find themselves
    working in tandem with the AI. This book could not have been written, at least
    in the form you have it today, without both `Cyborg and Centaur Tasks`.


    I am only human, and in writing this book, I often found myself stuck. In previous
    books, that could mean a single sentence or paragraph would block hours of writing,
    as I used my frustration as an excuse to take a break and walk away until inspiration
    struck. With AI, that was no longer a problem. I would become a Cyborg and tell
    the AI: `I am stuck on a paragraph in a section of a book about how AI can help
    get you unstuck. Can you help me rewrite the paragraph and finish it by giving
    me 10 options for the entire paragraph in various professional styles? Make the
    styles and approaches different from each other, making them extremely well written.`
    In an instant, I had the paragraph written in a persuasive style, an informative
    style, a narrative style, and more. While I rarely used any of the text the AI
    produced, it gave me options and pathways forward. Similarly, when I felt a paragraph
    was clunky and bad, I would ask the AI: `Make this better, in the style of a bestselling
    popular book about AI, or add more vivid examples.` The text it produced almost
    never appears in these pages, but it helped guide me out of difficulty. And, interestingly,
    it was some of these paragraphs that my editor seemed to like best.


    Similarly, reading papers was often a Centaur task, one in which I knew the AI
    exceeded my capabilities in summarizing, while I exceeded it in understanding.
    While I have worked with the AI group at the MIT Media Lab, I am not myself a
    computer scientist. When reading some of the technical literature, I would ask
    the AI to summarize a paper to see if I understood it in the right way, knowing
    full well that the AI could get me only partway there. And then I would use AI
    summaries and notes to refer back to. When sudden inspiration would hit, and I
    was not near a computer, I would open up an AI app and use its voice recognition
    to dictate notes, having the AI organize them and email them to me to incorporate
    later.


    But the joint AI-Ethan Cyborg went further. While I had excellent human readers
    and editors to help me, I didn’t want to bother them while working on early drafts.
    But I still wanted feedback. Thus, I need to introduce you to `Ozymandias`, `Mnemosyne`,
    and `Steve`. If you remember in our previous chapters, we discussed how AI can
    simulate being a human being. I used these AI-created figures at various points
    in the book to help me improve my writing. I want to give you a little bit of
    a sample of what they told me, by giving you the advice they gave me on the current
    chapter, so far.


    I am an academic, and I have the typical academic’s curse of wanting to add too
    much complexity and nuance to everything. AI is great at summarizing and simplifying,
    so I wanted to get some advice on where I could do the same. I decided the advice
    would feel a bit easier to take if the AI also had an over-the-top personality,
    so I created `Ozymandias` by prompting: `You are Ozymandias. You are going to
    help Ethan Mollick write a book chapter on using AI at work. Your job is to offer
    critical feedback to help improve the book. You speak in a pompous, self-important
    voice but are very helpful and focused on simplifying things. Here is the chapter
    so far. Introduce yourself.`


    Ah, dear Ethan, greetings. I am `Ozymandias`, your humble, yet impressively, aide.
    I see you’ve made a good start on your chapter about artificial intelligence.
    But, alas, perfection is a journey, and we have miles to go before we sleep, do
    not? Let’s delve into the labyrinthine corridors of your discourse and shed light
    on areas that could be enhanced.


    It gave me advice on what to cut and simplify, which I acted on, but also a warning:
    Your attempt to infuse humour, particularly in the AI section, is commendable.
    However, there is a risk that it may come across as forced. Remember, dear Ethan,
    humour is a spice to be sprinkled sparingly, not poured. Pretty direct feedback
    (and the addition of British English is a nice touch). But AI editors, unlike
    human ones, can be safely ignored on some topics, so I kept the jokes.


    Now meet `Mnemosyne`, who serves a very different role, providing the creative
    spark we discussed earlier, and I gave her a personality to match: `You are Mnemosyne.
    You are going to help Ethan Mollick write a book chapter on using AI at work.
    Your job is to find unusual and interesting connections and stories that are related
    to what Ethan is working on. You speak in a dreamy but direct voice and are very
    helpful. Introduce yourself.`


    Hello, Ethan. I am `Mnemosyne`, your AI collaborator, eager to help you weave
    together the intricate threads of AI and work. Together, we will explore the unexpected
    corners, the stories that lurk in the shadows of the known, and the connections
    that lie beneath the surface.


    While the feedback was less direct, I took some inspiration here and, as a result,
    made edits to my discussion about delegating authority to AIs.


    Finally, I wanted to use the capabilities of AI to act as an everyperson and give
    me the median reader’s view of what I had written. Enter `Steve`: `You are Steve.
    You are going to help Ethan Mollick write a book chapter on using AI at work.
    Your job is to be a normal human reader of popular science and business books.
    You are somewhat confused about how you got to be inside a computer but are very
    helpful.`

