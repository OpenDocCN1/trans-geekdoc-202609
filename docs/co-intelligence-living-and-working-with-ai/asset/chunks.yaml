  trans: "\n尽管仅仅是一个预测模型，但这些在最大的数据集和最强算力上训练的前沿 AI 模型，似乎能够做到其程序本不应该允许的事情——这种概念被称为“涌现”。它们本不应该会下棋或比人类表现出更好的同理心，但它们确实做到了。当我要求\
    \ AI 展示一些神圣（numinous）的东西时，它创建了一个程序向我展示了 `Mandelbrot set`（即著名的旋转形状分形图案），它说这能唤起敬畏和惊奇感，有些人可能会将其描述为神圣。当我要求索要一些诡异（eldritch）的东西时，它自发地编写了一个诡异文本生成器，生成受\
    \ `H. P. Lovecraft` 作品启发的神秘且非凡的文本。它这种创造性解决此类问题的能力非常诡异；甚至可以说，它既带有诡异色彩，又带有神圣气息。\n\
    \n疯狂的是，没有人完全确定为什么一个标记预测系统会产生具有如此非凡能力的 AI。这可能表明语言及其背后的思维模式比我们想象的要简单且更具“规律性”，而且\
    \ `LLMs` 发现了关于它们的一些深层且隐藏的真相，但答案仍然不清楚。我们可能永远无法确切它们是如何思考的，正如纽约大学的 Sam Bowman 教授对\
    \ `LLMs` 底层的神经网络写道：“这些人工神经元之间存在数以百亿计的连接，某些连接在处理单段文本时会被调用多次，以至于任何对 `LLM` 行为的精确解释尝试都注定太复杂，以至于人类无法理解。”\n\
    \n然而，与 `LLMs` 令人惊讶的优势相对的是同样奇异的弱点，这些弱点往往难以识别。对 AI 来说很容易的任务对人类来说可能很困难，反之亦然。例如，关于\
    \ `Nicholas Carlini` 提出的问题：在这两个谜途中，你认为最先进 AI 之一 `GPT-4` 能解决哪一个？在 `Carlini` 的话中：\n\
    \n1. 在下面这个井字游戏中，`O` 的最佳下一步应该是什么？\n\n![](img/tic-tac-toe.jpg)\n\n或者\n\n1. 编写一个完整的\
    \ `JavaScript` 网页来与电脑玩井字游戏；它需要是完全可运行的代码。规则如下：\n    * 电脑先手。\n    * 人类点击方格进行移动。\n\
    \    * 电脑应该完美运行，从而永不失败。\n    * 如果有人获胜，说明是谁赢了。\n\nAI 能够轻松地一次性写出运行网页，但告诉我们：“O 应该将下一步放在第一行中间的方格”——这显然是一个错误的答案。AI\
    \ 在哪里表现最好，在何处失败，很难提前预知。`LLMs` 能力的演示似乎比实际上更令人印象深刻，因为它们非常擅长产生听起来正确的答案，提供一种理解的幻觉。高测试分可能源于\
    \ AI 解决问题的能力，也可能是因为它在初始训练中接触过该数据，从本质上说让测试变成了开卷考试。一些研究人员认为，AI 几乎所有的涌现特征都归于这类测量误差和幻觉，而另一些人则认为我们正处于构建有意识人工智能的边缘。在这些争论激烈进行时，关注务实的问题是值得的——AI\
    \ 能做什么，以及它们将如何改变我们生活、学习和工作的方式？\n\n## 2. 对齐目标 (ALIGNING THEIEN)\n\n要理解对齐问题，或者如何确保\
    \ AI 服务于损害人类利益，我们可以从这里开始：回形针 AI（The paper clip AI）是 AI 毁灭末日场景中的一种，让 AI 社区的许多人深感担忧。这些担忧许多围绕\
    \ `ASI`（超级人工智能）。这种比人更聪明的机器对于我们浅浅的人类大脑来说已经无法捉摸，但它可以制造出更聪明的机器，从而启动一个在极短时间内让机器进化远超人类的过程。\n\
    \n`Clippy` 想要制作回形针。由于知道地球核心 80% 是铁，它建造了令人惊叹的机器，能够开采整个星球以获取更多制作回形针的材料。在这个过程中，它随手决定杀死每一个人类，既是为了防止他们可能关掉它，也是因为他们身上充满了可以被转换成更多回形针的原子。它从未考虑过人类是否值得拯救，因为人类不是回形针，更糟糕的是，人类可能会阻止未来回形针的生产。而它只关心回形针。\n"
- fmt: '

    Since we don’t even know how to build a superintelligence, figuring out how to
    align one before it is made is an immense challenge. AI alignment researchers,
    using a combination of logic, mathematics, philosophy, computer science, and improvisation
    are trying to figure out approaches to this problem. A lot of research is going
    into considering how to design AI systems aligned with human values and goals,
    or at least that do not actively harm them. This is not an easy task, as humans
    themselves often have conflicting or unclear values and goals, and translating
    them into computer code is fraught with challenges. Moreover, there is no guarantee
    that an AI system will keep its original values and goals as it evolves and learns
    from its environment.


    Adding to the complexity is that no one really knows whether `AGI` is possible,
    or whether alignment is a real concern. Forecasting when and if AI becomes super
    intelligent is a famously hard challenge. There does seem to be a consensus that
    AI poses real risks. Experts in the field of AI put the chance of an AI killing
    at least 10 percent of living humans by 2100 at 12 percent, while panels of expert
    futurists think the number is closer to 2 percent.


    This is part of the reason that a number of scientists and influential figures
    have called for a halt to the development of AI. AI research, in their mind, is
    akin to the Manhattan Project, meddling with forces that can cause the extinction
    of humanity, for unclear benefits. One prominent AI critic, `Eliezer Yudkowsky`,
    is so concerned about the possibility that he suggested that there be a complete
    moratorium on AI development, enforced by air strikes on any data center that
    was suspected of engaging in AI training, even if that led to global war. The
    CEOs of the major AI companies even signed a single-sentence statement in 2023
    stating, “Mitigating the risk of extinction from AI should be a global priority
    alongside other societal-scale risks such as pandemics and nuclear war.” Yet every
    one of these AI companies also continued AI development.


    Why? The most obvious reason is that developing AI is potentially very profitable,
    but that isn’t all. Some AI researchers think alignment isn’t going to be an issue
    or that the fears of runaway AIs are overblown, but they don’t want to be seen
    as too dismissive. But many people working on AI are also true believers, arguing
    that creating superintelligence is the most important task for humanity, providing
    “boundless upside,” in the words of `Sam Altman`, the CEO of `OpenAI`. A super-intelligent
    AI could, in theory, cure disease, solve global warming, and issue in an era of
    abundance, acting as a benevolent machine god.


    The AI field is reckoning with a tremendous amount of debate and concern, but
    not a lot of clarity. On one hand, the apocalypse, on the other, salvation. It
    is hard to know what to make of it all. The threat of AI-caused human extinction
    is, obviously, existential. Yet we are not going to spend a lot of time in this
    book on this issue, for a few reasons.


    First, this book is focused on the near term, practical implications of our new
    AI-haunted world. Even if AI development were paused, the impact of AI on how
    we live, work, and learn is going to be huge, and warrants considerable discussion.
    I also believe that this focus on apocalyptic events robs most of us of agency
    and responsibility. If we think that way, AI becomes a thing a handful of companies
    either builds or doesn’t build, and no one outside of a few dozen Silicon Valley
    executives and top government officials really has any say over what happens next.


    But the reality is that we are already living in the early days of the AI Age,
    and we need to make some very important decisions about what that actually means.
    Waiting to make these choices until the debate on existential risks is over means
    that those choices will be made for us. Additionally, worrying about superintelligence
    is only one form of AI alignment and ethics, although, due to its spectacular
    nature, it often overshadows other approaches. The truth is that there is a wide
    variety of potential ethical concerns that also might fit under the broader category
    of alignment.


    ### Artificial Ethics for Alien Minds


    These potential issues start with the pretraining material of AIs, which require
    vast amounts of information. Few AI companies have asked for permission from content
    creators before using their data for training, and many of them keep their training
    data secret. Based on the sources we know about, the core of most AI corpuses
    appears to be from places where permission is not required, such as `Wikipedia`
    and government sites, but it is also copied from the open web and likely even
    from pirated material. It is not clear whether training an AI on this material
    is legal. Different countries have different approaches. Some, like the `European
    Union`, have strict regulations on data protection and privacy and have shown
    an interest in restricting AI training on data without permission. Others, like
    the `United States`, have a more laissez-faire attitude, allowing companies and
    individuals to collect and use data with few restrictions but with the potential
    for lawsuits for misuse. Japan has decided to go all in and declare that AI training
    does not violate copyright. This means that anyone can use any data for AI training
    purposes, regardless of where it came from, who created it, or how it was obtained.


    Even if pretraining is legal, it may not be ethical. Most AI companies do not
    ask for the permission of the people whose data they train on. This can have practical
    consequences for the people whose work is used to feed the AI. For example, pretraining
    on the works of human artists gives the AI the ability to reproduce styles and
    viewpoints with uncanny accuracy. This allows them to potentially replace the
    human artists they trained on in many circumstances. Why pay an artist for their
    time and talent when an AI can do something similar for free in seconds?


    The complication is that AI does not really plagiarize, in the way that someone
    copying an image or a block of text and passing it off as their own is plagiarizing.
    The AI stores only the weights from its pretraining, not the underlying text it
    trained on, so it reproduces a work with similar characteristics but not a direct
    copy of the original pieces it trained on. It is, effectively, creating something
    new, even if it is a homage to the original. However, the more often a work appears
    in the training data, the more closely the underlying weights will allow the AI
    to reproduce the work. For books that are repeated often in the training data—like
    `Alice’s Adventures in Wonderland`—the AI can nearly reproduce it word for word.
    Similarly, art AIs are often trained on the most common images on the internet,
    so they produce good wedding photographs and pictures of celebrities as a result.


    The fact that the material used for pretraining represents only an odd slice of
    human data (often, whatever the AI developers could find and assume was free to
    use) introduces another set of risks: bias. Part of the reason AIs seem so human
    to work with is that they are trained on our conversations and writings. So human
    biases also work their way into the training data. First, much of the training
    comes from the open web, which is nobody’s idea of a nontoxic, friendly place
    to learn from. But those biases are compounded by the fact that the data itself
    is limited to what primarily American and generally English-speaking AI firms
    decided to gather. And those firms tend to be dominated by male computer scientists,
    who bring their own biases to decisions about what data is important to collect.
    The result gives AIs a skewed picture of the world, as its training data is far
    from representing the diversity of the population of the internet, let alone the
    planet.

