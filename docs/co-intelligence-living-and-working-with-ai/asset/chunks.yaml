    # 5 作为创造者的 AI


    我们与 AI 工作的第一个原则是始终邀请它参与。我们已经讨论过与 AI 交互如何像与人交谈和工作一样。但它是什么样的人呢？AI 拥有什么技能？它擅长什么？为了讨论这一点，我们首先需要面对
    AI 非常不擅长的领域。


    限制 AI 的最大问题也是它的优势之一：它那臭名昭著的编造能力，即幻觉。记住，`LLMs` 的工作原理是根据其训练数据中的统计模式，预测在你给出的提示词之后最可能的词汇。它并不在乎这些词是否真实、有意义或具有原创性。它只想产生一种让你开心的连贯且合理的文本。幻觉听起来足够合理且符合语境，以至于难以辨别谎言与真相。


    关于 `LLMs` 为什么会产生幻觉并没有确定的答案，影响因素可能在模型之间有所不同。不同的 `LLMs` 可能具有不同的架构、训练数据和目标。但在许多方面，幻觉是
    `LLMs` 工作方式的一个深层部分。它们并不直接存储文本，而是存储关于哪些 token 更有可能跟随其他 token 的模式。这意味着 AI 实际上并不“知道”任何东西。它是即时生成答案的。此外，如果它过于紧贴训练数据中的模式，则被认为模型对该训练数据过拟合。过拟合的
    `LLMs` 可能无法推广到新的或未见的输入，并生成无关或不一致的文本——简而言之，它们的结果总是相似且缺乏启发。为了避免这种情况，大多数 AI 在回答中加入了额外的随机性，这相应地增加了幻觉发生的概率。


    除了技术之外，幻觉也可能来自 AI 的源素材，这些素材可能存在偏见、不完整、矛盾，甚至存在我们在第 2 章中讨论过的错误。模型没有办法区分观点或创意性虚构作品与事实、比喻语言与字面意思、以及不可靠来源与可靠来源。模型可能会继承数据创建者、策展人和微调者的偏见和成见。


    当 AI 无法区分虚构渗透进现实时，也可能很有趣。例如，数据科学家 Colin Fraser 指出，当被要求给出 1 到 100 之间的随机数字时，`ChatGPT`
    有 10% 的时间回答“42”。如果它真的是在随机选择数字，它应该只有 1% 的时间回答“42”。我读者中的科幻迷们可能已经猜到了为什么 42 出现得频繁得多。在道格拉斯·亚当斯的经典喜剧《银河系漫游指南》中，42
    是“关于生命、宇宙以及万万物的终极问题”的答案（留下了一个更大的问题：问题是什么？），这个数字已成为互联网上的一个缩写笑话。因此，Fraser 推测，AI
    看到的 42 比其他数字多得多，这反过来增加了 AI 输出该数字的概率——同时幻觉认为它正在给你一个随机答案。


    这些技术问题变得更加严重，因为它们依赖于模式而不是数据库来创建答案。如果你要求 AI 提供一个引用或引言，它将根据它学到的数据之间的联系来生成该引言或引用，而不是从记忆中检索它。如果引言很有名，比如“四分又七年”，它可能会写对。但如果引言很冷僻，AI
    可能会用合理的幻觉来填充细节。


    `LLMs` 幻觉最臭名昭著的早期案例之一发生在 2023 年，当时一位名为 Steven A. Schwartz 的律师使用 `ChatGPT` 为一起人身伤害诉讼准备法律简报。`ChatGPT`
    引用了六个虚假案件。这些案件被辩护律师发现了，他们在法律数据库中找不到任何记录。他们随后通知了法官，法官要求 Schwartz 解释他的来源。Schwartz
    承认他使用了 `ChatGPT` 生成这些案件，并无意欺骗法庭。他声称自己不知道 `ChatGPT` 的性质和局限性。


    法官 P. Kevin Castel 没有被 Schwartz 的解释说服。他裁定 Schwartz 行为恶意并误导了法庭。他还发现 Schwartz 忽略了几个红旗，例如那些毫无意义的名字、日期和引用。他对
    Schwartz 和他的共同律师 Peter LoDuca 处以 5,000 美元的共同罚款，LoDuca 接手了该案件但仅仅掩盖了 Schwartz。他还要求他们联系虚假案件中提到的法官并告知有关情况。


    顺便说一下，上述三个段落是由连接了互联网的 `GPT-4` 版本编写的。而且几乎是正确的。根据新闻报道，虚假案件不止六个；LoDuca 并没有接手案件而仅仅掩盖了
    Schwartz；罚款的部分原因是由于律师们在虚假案件上变本加厉，远超他们最初的错误。这些微小的幻觉很难被发现，因为它们完全合理。只有在对输出中的每一个事实和句子进行极其仔细的阅读和研究后，我才注意到这些问题。


    '
- fmt: '

    AI researchers have mixed opinions as to when, or even if, these problems will
    be solved. There is some reason to hope. As models advance, hallucination rates
    are dropping over time. For example, a study examining the number of hallucinations
    and errors in citations given by AI found that `GPT-3.5` made mistakes in 98 percent
    of the cites, but `GPT-4` hallucinated only 20 percent of the time. Additionally,
    technical tricks, like giving the AI a “backspace” key so it can correct and delete
    its own errors, seem to improve accuracy. So, while it may never go away, this
    problem will likely improve. Remember Principle 4: “Assume this is the worst AI
    you will ever use.” Even today, with some experience, users can learn how to avoid
    forcing the AI into hallucinations and when careful fact-checking is necessary.
    And more discussion of this issue will prevent users like Schwartz from wholly
    relying on LLM-generated answers. That said, we need to be realistic about a major
    weakness, which means AI cannot easily be used for mission-critical tasks requiring
    precision or accuracy.


    Hallucination does allow the AI to find novel connections outside the exact context
    of its training data. It also is part of how it can perform tasks that it was
    not explicitly trained for, such as creating a sentence about an elephant who
    eats stew on the moon, where every word should begin with a vowel. (The AI came
    up with: An elephant eats an oniony oxtail on outer orbit.) This is the paradox
    of AI creativity. The same feature that makes LLMs unreliable and dangerous for
    factual work also makes them useful. The real question becomes how to use AI to
    take advantage of its strengths while avoiding its weaknesses. To do that, let
    us consider how AI “thinks” creatively.


    ## Automatic Creativity


    Given the history of automation, many people would have predicted that the first
    tasks AI would be good at would be boring, repetitive, and analytical. Those are
    usually the first tasks to be automated in any wave of new technology, from steam
    power to robots. As we have seen, however, that is not the case. Large Language
    Models are excellent at writing, but the underlying `Transformer` technology also
    serves as the key for a whole set of new applications, including AI that makes
    art, music, and video. As a result, researchers have argued that it is the jobs
    with the most creative tasks, rather than the most repetitive, that tend to be
    most impacted by the new wave of AI.


    This tends to make us uncomfortable: After all, how can AI, a machine, generate
    something new and creative? The issue is that we often mistake novelty for originality.
    New ideas do not come from the ether; they are based on existing concepts. Innovation
    scholars have long pointed to the importance of recombination in generating ideas.
    Breakthroughs often happen when people connect distant, seemingly unrelated ideas.
    To take a canonical example, the Wright brothers combined their experience as
    bicycle mechanics and their observations of the flight of birds to develop their
    concept of a controllable plane that could be balanced and steered by warping
    its wings. They were not the inventors of the bicycle, the first to observe birds’
    wings, or even the first people to try to build an airplane. Instead, they were
    the first to see the connections between these concepts. If you can link disparate
    ideas from multiple fields and add a little random creativity, you might be able
    to create something new.


    LLMs are connection machines. They are trained by generating relationships between
    tokens that may seem unrelated to humans but represent some deeper meaning. Add
    in the randomness that comes with AI output, and you have a powerful tool for
    innovation. The AI seeks to generate the next word in a sequence by finding the
    next likely token, no matter how weird the previous words were. So it should be
    no surprise that the AI can come up with novel concepts with ease. I asked AI
    to: `Find me business ideas that would incorporate fast food, patent 6,604,835
    B2 \[which turned out to be for a lava lamp that included bits of crystal\], and
    14th century England.`


    It suggested:


    > ![](images/page_xiv.jpg)A medieval-themed fast-food restaurant that serves burgers,
    fries, and shakes in a castle-like setting, with staff dressed as knights, princesses,
    and jesters. The restaurant could use patent 6,604,835 B2 to create decorative
    lava lamps with gems or coins floating in them, to add some sparkle and ambiance
    to the dining area. The lava lamps could also be sold as souvenirs or gifts to
    customers. This idea could appeal to families with children, history buffs, or
    anyone looking for a fun and unique dining experience.


    You may hate this idea (or love it, depending on your tolerance for lava lamp–centric
    restaurants), but it somehow made sense out of the three unrelated ideas I gave
    it, and if I didn’t like that one, it would be happy to generate many more. And
    while I am not sure I want to quit my job to start Lava Lampshire, as the AI suggested
    I name my restaurant, this sort of response does exhibit a level of creativity.
