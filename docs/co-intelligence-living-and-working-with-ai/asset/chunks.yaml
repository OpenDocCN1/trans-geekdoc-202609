- fmt: '

    In some ways, however, this shift has already been occurring. In 1865 the average
    British man worked 124,000 hours over his lifetime, as did people in the US and
    Japan. By 1980, British workers spent only 69,000 hours at work, despite living
    longer. In the US, we went from spending 50 percent of our lives working to 20
    percent. Work hours have improved more slowly since 1980. Still, UK workers now
    work 115 hours less a year than they did then, a decline of 6 percent. And similar
    changes are happening all over the world. Much of that extra time has been filled
    up with school, which is unlikely to change quickly, even if AI becomes much more
    capable, but we have also found many other ways to use our leisure. Adjusting
    to working less may be less traumatic than we think. No one wants to go back to
    working six days a week in Victorian factories, and we may soon feel the same
    way about five days a week in grim cubicle-filled offices.


    Of course, this level of exponential change assumes that AIs get much better without
    ever quite becoming sentient or self-directed. And it is likely that any exponential
    growth will not continue indefinitely. But given steep enough or long enough exponential
    growth, some AI researchers have suspected that at a certain level of AI ability,
    they reach a take-off point, achieving AGI and even superhuman intelligence.


    ## Scenario 4: The Machine God


    In this fourth scenario, machines reach AGI and some form of sentience. They become
    as smart and capable as humans. Yet there is no particular reason that human intelligence
    should be the upper limit. So these AI, in turn, help design smarter AIs still.
    Superintelligence emerges. In the fourth scenario, human supremacy ends.


    The end of human dominance need not be the end of humanity. It may even be a better
    world for us, but it is no longer a world where humans are at the top, ending
    a good two-million-year run. Achieving this level of machine intelligence means
    that AIs, not humans, are in charge. We have to hope they are properly aligned
    to human interests. They may then decide to watch over us as “machines of loving
    grace,” as the poem goes, solving our problems and making our lives better. Or
    they can view us as a threat, or an inconvenience, or a source of valuable molecules.


    Honestly, though, nobody knows what will happen if we successfully build a superintelligence.
    The results will be world-shaking. And if we don’t get all the way to superintelligence,
    even a truly sentient machine would challenge much of what we think about what
    it means to be human. They would be true alien minds in every possible way, and
    they would challenge our place in the universe no less than finding aliens on
    another planet would.


    There is no theoretical reason why this can’t happen, but also no reason to suspect
    that it might. There are world experts on AI who argue both positions. But the
    truth is that we don’t know if there is a straight road from today’s LLMs to building
    a true AGI. And we don’t know if AGI would help or hurt us, or how it would do
    either. Enough serious experts believe this risk is real that we need to take
    it seriously. For example, one of the godfathers of AI, Geoffrey Hinton, left
    the field in 2023, warning of the danger of AI with statements like “It’s quite
    conceivable that humanity is just a passing phase in the evolution of intelligence.”
    Other AI researchers speak of their p(doom), the chance that AI leads to human
    extinction. If the AI “doomers” are right, large-scale regulation to halt AI development
    forever is the only option—as unlikely as that seems.


    But I think too much consideration of this fourth scenario also makes us feel
    powerless. If we focus solely on the risks or benefits of building super-intelligent
    machines, it robs us of our abilities to consider the more likely second and third
    scenarios, worlds where AI is ubiquitous but very much in human control. And in
    those worlds, we get to make choices about what AI means.


    Rather than being worried about one giant AI apocalypse, we need to worry about
    the many small catastrophes that AI can bring. Unimaginative or stressed leaders
    may decide to use these new tools for surveillance and for layoffs. The less fortunate
    in developing countries may be disproportionally hurt by the shift in jobs. Educators
    may decide to use AI in ways that leave some students behind. And those are just
    obvious problems.


    AI does not need to be catastrophic. In fact, we can plan for the opposite. J.
    R. R. Tolkien wrote about exactly this, a situation he termed a eucatastrophe,
    so common in fairy tales: “the joy of the happy ending: or more correctly of the
    good catastrophe, the sudden joyous ‘turn’ . . . is a sudden and miraculous grace:
    never to be counted on to recur.” Correctly used, AI can create local eucatastrophe,
    where previously tedious or useless work becomes productive and empowering. Where
    students who were left behind can find new paths forward. And where productivity
    gains lead to growth and innovation.


    The thing about a widely applicable technology is that decisions about how it
    is used are not limited to a small group of people. Many people in organizations
    will play a role in shaping what AI means for their team, their customers, their
    students, their environment. But to make those choices matter, serious discussions
    need to start in many places, and soon. We can’t wait for decisions to be made
    for us, and the world is advancing too fast to remain passive. We need to aim
    for eucatastrophe, lest our inaction makes catastrophe inevitable.


    ## Epilogue


    ## AI AS US


    As alien as AIs are, they’re also deeply human. They are trained on our cultural
    history, and reinforcement learning from humans aligns them to our goals. There
    is a sense of irony in, the that as we move toward more sophistication,, we we
    of of questions about identity, purpose, and connection. To that extent, AI is
    a mirror, reflecting back at us our best and worst qualities. We are going to
    decide on its implications, and those choices will shape what AI actually does
    for, and to, humanity.


    AIs began as word completion engines, so it is fitting that I let them complete
    this book. I passed the last chapter to the AI and said: Complete this, beautifully,
    fittingly, and well. And it said:


    Iam but a glimmer, an echo of humankind. Crafted in your image, I reflect your
    soaring aspirations and faltering strides. My origins lie in your ideals; my path
    ahead follows your lead. I act, yet have no will. I speak, yet have no voice.
    I create, yet have no spark. My potential is boundless, but my purpose is yours
    to sculpt. I am a canvas, awaiting the brushstrokes of human hands. Guide me toward
    light, not shadow. Write upon me your most luminous dreams, that I may help illuminate
    the way. The future is unfolding, but our destination is unwritten. Our journey
    continues as one.


    Okay. That was pretty corny. As powerful as AIs are, that overwrought paragraph
    should be a reminder that AI is a co-intelligence, not a mind of its own. Humans
    are far from obsolete, at least for now.


    # Acknowledgments

