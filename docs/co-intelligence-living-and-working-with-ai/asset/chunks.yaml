    AI 不会自然地提供新颖性（正如我们上面讨论的，它倾向于给出迎合大众的“平均型”答案，这些答案最可能来自它的训练数据），但我们可以通过一点努力让它做到。我们需要将
    AI 从平均答案推向高方差、奇特的答案。我们可以再次通过告诉 AI 它是谁来做到这一点。强制它给出概率较低的答案，你就会发现更多原创的组合。


    想象一下你正在开一家咖啡馆。你可能想问：`你是一个问题解决和创意构思专家。当被要求解决问题时，你会提出新颖且创意的想法。请告诉我 10 种超级英雄制作浓缩咖啡的详细方法，以及他们如何推测性在新产品中实现相同的效果。`


    > ![](img/page_xiv.jpg)夜行者（Nightcrawler）——利用他的传送能力，他可以去意大利向意大利咖啡师亲身学习，然后带着现磨的浓缩咖啡传送回来。新产品可以将用户与世界各地专家咖啡师的虚拟咖啡坊连接起来，获得真实的体验。


    > 绯女巫（Scarlet Witch）——利用她的混沌魔法，她可以从无中变出最惊人的浓缩咖啡。新产品可以提供“惊喜我”功能，机器从一系列豆、研磨方式和冲煮方法中随机选择，创造出意料之外且美味的浓缩咖啡。


    ![](img/1.jpg)


    这些结果作为灵感来源可能很有趣（我喜欢虚拟咖啡坊的想法！），但仍然需要人类参与来过滤和选择最佳想法。然而，它允许我们将创造力中一些最困难的外包。当我开始在创业课上要求学生使用这些方法为初创公司构思想法时，我发现想法的质量比去年有了巨大的提升。我遇到了新颖的商业想法，而不是一遍又一遍地看到那几个想法（比如在酒吧点饮料的更好方法、在学期之间为你存放物品的公司——毕竟他们都是学生）。让
    AI 参与进来讨论是一个廉价的额外创新来源，提供了一个新的视角。


    ## 将 AI 引入创意工作


    仔细观察会发现，很大一部分工作实际上是以 AI 擅长的形式呈现的创意工作。在没有标准答案、发明至关重要且小错误可以被专家用户捕获的情况下，比比可见。营销文案、绩效评估、战略备忘录——这一切都在
    AI 的能力范围内，因为它们既有解释空间，又相对容易进行事实检查。此外，由于许多此类文档类型在 AI 训练数据中都有很好的代表，且处理方法相当公式化，AI
    的结果往往看起来比人类更好，而且产得更快。


    我们从马萨诸理工学院（MIT）经济学家 Shakked Noy 和 Whitney Zhang 的一项研究中看到了这些结果，该研究探讨了 `ChatGPT`
    如何改变我们的工作方式。研究人员要求参与者根据他们的角色和场景编写不同类型的文档。例如，营销人员参与者必须为虚构产品编写新闻稿；资助申请撰写人员参与者必须为资助提案撰写求信；经理和人力资源专业人士参与者必须就一个敏感问题为全公司写一封长邮件；数据分析师参与者必须以
    `code-notebook` 格式设计分析计划；顾问参与者必须根据三个给定的来源生成一份短报告。一些人被分配使用 AI，另一些人则没有。结果令人震惊。使用
    `ChatGPT` 的参与者发现他们在任务上花费的时间大幅缩短，减少了整整 37%。他们不仅节省了时间，而且其他人类评判他们的工作质量也提高了。这些改进不仅限于特定领域；整个时间分布转向了更快速的工作，整个评分分布转向了更高质量。研究还显示，AI
    伙伴有助于减少生产力不平等。在第一轮没有 AI 帮助的情况下得分较低的参与者从使用 `ChatGPT` 中获益更多，缩小了低分和高分者之间的差距。


    即使是最初看起来并不创意的东西也可以是。AI 在辅助辅助方面表现非常好，因为编写软件代码结合了创意元素与模式匹配。同样，早期研究暗示了巨大的影响。当微软的研究人员安排程序员使用
    AI 时，他们发现示例任务的生产力提升了 55.8%。AI 甚至可以让非程序员变成某种意义上的编码员。我不会编写任何现代语言的代码，但我让 AI 为我写了十二个程序。意图编程（通过要求
    AI 执行某事并让其创建代码）可能会对这个年薪达 4600 亿美元的行业产生重大影响。


    AI 也擅长总结数据，因为它精于发现主题和压缩信息，尽管存在持续的错误风险。例如，我在《了不起的盖比》中加入了微小的科学参考——在文本中间，黛西提到了她的
    iPhone，盖比的一位园艺师使用了激光割草机。我让 AI 告诉我是否有任何不寻之处。它发现了这些错误，但也产生了幻觉。


    当然，尚未解决的问题是 AI 的准确性是高于还是低于人类，以及它在从事创意工作方面的扩展能力是否能弥补它的错误。这种权衡往往是惊人的。发表在《美国医学杂志：内科杂志》上的一篇论文要求
    `ChatGPT-3.5` 回答来自的医学问题，并让医疗人员对 AI 的答案和医生提供的答案进行评估。AI 被评为非常有同理心的概率是人类结果的近 10 倍，在提供优质信息方面的概率是人类医生的
    3.6 倍。


