    2023 年，许多公司为“AI 旁语者”（AI whisperer）职位开出了六位数的薪水，这并非偶然——正如我们所看到的，与 AI 协作远非直观。每当出现一个高薪的新职位名称时，就会出现大量的课程、说明手册和
    YouTube 频道，提供你（是的，就是你）今天想要致富所所需的知识。


    明确的是，`prompt engineering`（提示词工程）可能是一项实用的短期技能。但我认为 `prompt engineering` 并没有那么复杂。到目前为止，你可能已经读了足够的内容，足以成为一名优秀的
    `prompt engineer`。让我们从我之前分享的第三条原则开始——把 AI 当成人，并告诉它它是什么样的人。`LLMs` 的工作原理是预测你的提示词之后的下一个词（或词的一部分），类似于一种复杂的自动补全功能。然后它们从那里继续添加语言，并再次预测下一个词将是什么。因此，许多此类模型的默认输出听起来可能非常平庸乏味，因为它们倾向于遵循
    AI 训练的文字文档中常见的模式。通过打破这种模式，你可以获得更有用且更有趣的输出。最简单的方法就是提供上下文和约束，正如我们在第 5 章中看到的那样。


    对于稍微高级的提示词，请将你所做的事情看作是用散文进行编程。你可以给 AI 指令，它在很大程度上会遵循这些指令。之所以说大部分，是因为 AI 输出包含大量的随机性，所以你无法获得标准计算机程序那样的一致性。但思考如何向
    AI 提供非常清晰且符合逻辑的提示词是值得的。


    目前有许多关于如何“编程” `LLM` 最佳方法的活跃研究正在进行，但一个实际的启示是：给 AI 提供显式的指令，分步描述你的需求将会有帮助。一种被称为 `chain-of-thought
    prompting`（思维链提示）的方法，在你提出请求之前，先给 AI 提供一个你希望它如何推理的示例。更有用的是，你还可以提供相互递进的逐步指令，这使得检查每一步的输出变得更容易（让你稍后可以完善提示词），并且倾向于让你的提示词输出更准确。


    这里有一个例子：假设我想在这一章中加入一个关于 AI 导师的良好类比，并想寻求 AI 的帮助。我可以简单地问它：给我一个关于 AI 导师的良好类比。结果有点不尽如人意：AI
    导师就像一个音乐节拍器，因为它具有一致性、适应性，并且仅仅是一个工具。


    现在我们可以尝试应用这些其他技术了：分步思考这个过程：为 AI 导师想出良好的类比。首先，列出可能的类比。其次，对列表进行评判并再增加三个类比。接下来，创建一个表格列出每一项的优缺点。接着，选出最好的并解释它。在这里，`GPT-4`
    考虑了从私人教练到园丁的十几个建议，并创建了一个比较所有这些建议的表格，最后选定了 `GPS system`。这个系统就像 AI 导师一样，设计初衷是帮助用户在陌生的路程中导航。它提供实时反馈，根据不断变化的情况（如交通或施工）调整建议，并在用户偏离路线时提供替代方案。同样，AI
    导师会引导学生穿过学术领域，提供实时反馈，根据学生的进度进行调整，并在必要时提供备选学习路径。这个类比还强调了这样观点：虽然工具提供了引导，但驱动并完成这段旅程的是用户（或学生），这强化了与
    AI 学习的协作本质。由于了一点 `prompt engineering`，结果得到了极大改善。


    然而，这一切仍然更多地像是一门艺术而非科学，而且 AI 的工作方式仍然更像人而非软件。例如，在一项 AI 测试了许多不同类型提示词的研究中，Google 最先进的模型对以“深吸一口气并分步骤解决这个问题！”开头的提示词响应最好。考虑到它们无法呼吸也无法恐慌，我不认为有人会怀疑这是让
    AI 按照你的意愿工作的有效方法，但它的得分比人类创建的最佳逻辑提示词还要高。


    在经历了这些复杂性之后，编写提示词可能会让人有些困惑和畏惧。所以我有一个好消息给你们（对那些想让编写提示词成为教育未来的人来说是个坏消息）。“擅长提示”是一个暂时的状态。目前的
    AI 系统已经非常擅长识别你的意图，而且它们正在变得更好。如果你想用 AI 做些事情，直接让它帮你做那件事就好。“我想写一部小说；你需要了解什么来帮助我？”这会让你走得意想不到地远。记住，AI
    只会在引导我们方面变得越来越出色，而不是要求我们引导它。提示词将不会再那么重要了。


    这并不意味着我们不应该在学校教授 AI。让学生理解 AI 的劣势，以及它可能产生的偏见、错误或被不道德地使用至关重要。然而，我们不需要扭曲我们的教育体系来学习通过
    `prompt engineering` 与 AI 协作，而应该专注于教学生如何成为“环中的人”（humans in the loop），将自己的专业知识应用于问题中。我们知道如何教授专业知识。我们一直在学校里尝试这样做，但这是一个艰难的过程。AI
    可能会让它变得更容易。


    ### 翻转课堂与 AI 导师


    我们对未来教室的样子已经有些了解。AI 作弊将仍然是不可检测且普遍的。AI 辅导可能会变得非常优秀，但不能取代学校。教室提供了多得：练习已技能的机会、协作解决问题、社交以及来自教师的支持。即使有了优秀的
    AI 导师，学校也将继续产生价值。但这些导师将改变教育。它们已经开始了。仅仅在 `ChatGPT` 发布几个月后，我注意到学生举手提问的情况减少了。当我问为什么时，一个学生告诉我：“既然可以问
    `ChatGPT`，为什么要在课上举手呢？”


    最大的变化将是教学的实际发生方式。今天，通常是由老师授课。良好的讲座是非常强大的，但它需要努力——要使其有效，它需要组织良好，包含学生互动的机会，并不断将各个想法联系起来。短期内，AI
    可以帮助教师准备基于内容并考虑到学生学习方式的讲座。我们已经发现 AI 非常擅长协助教师准备更有参与感、组织良好的讲座，并让传统的被动讲座变得更加活跃。


    但长期来看，讲座面临着危险。许多讲座涉及被动学习，学生只是听和记笔记，而不参与主动解决问题或批判性思维。此外，讲座这种一刀切的方法没有考虑到差异和能力，导致一些学生掉队，而另一些学生因缺乏挑战而失去兴趣。


    一种相反的哲学——主动学习降低了讲座的重要性，要求学生通过解决问题、小组合作和实践活动等活动参与学习过程。在这种方法中，学生之间以及与教师之间协作。多项研究支持日益增长的共识：主动学习是最有效的教育方法之一，但开发主动学习策略需要努力，而且学生仍然需要正确的初始指导。那么，主动学习和被动学习如何共存呢？

