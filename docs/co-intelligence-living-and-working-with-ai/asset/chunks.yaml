  trans: '

    让我们开始吧。想象你的 AI 协作者是一个速度极快的实习生，他们渴望取悦你，但往往倾向于歪曲事实。尽管我们一直认为 AI 是没有感情的、逻辑严密的机器人，但大语言模型（LLMs）的行为更像人类。它们可以很有创意、幽默且富有说力，但在被要求给出答案时，它们也可能会回避问题，并编造出听起来合理但错误的信息。它们并不是任何领域的专家，但它们可以模仿专家的语言和风格，这种方式既可能帮助，也可能误导。它们并不了解现实世界，但可以根据常识和模式生成合理的场景和故事。它们（目前）还不是你的朋友，但可以通过学习你的反馈和互动来适应你的偏好和性格。它们甚至会对情感操纵产生反应，研究人员记录，如果你在提示词中告诉它们“这对我的职业非常重要”，LLM
    会产生更好的答案。简而言之，它们是容易受影响的，甚至是有些轻信的。


    为了充分利用这种关系，你必须建立一个清晰且特定的 AI 人设（persona），定义 AI 是谁以及它应该解决什么问题。记住，LLM 的工作原理是预测你的提示词之后出现的下一个单词（或单词的一部分）。然后它们从那里继续添加语言，再次预测下一个单词会是什么。因此，许多此类模型的默认输出听起来可能非常通用，因为它们倾向于遵循
    AI 训练时所使用的文档中常见的相似模式。通过打破这种模式，你可以获得许多有用且有趣的输出。做到这一点简单的方法是提供背景和限制。告诉系统它是“谁”是有帮助的，因为它给了它一个视角。告诉它扮演
    MBA 学生的老师，其输出将与要求它扮演马戏团小丑完全不同。这并不是魔法——你不能通过说“像比尔·盖茨一样行动”就此获得更好的商业建议——但它可以帮助使语气和方向符合你的目的。


    让我给你举几个例子，说明定义 AI 人设如何提高你的结果。假设你是一个营销总监，你想用 LLM 为你的新产品生成一些朗朗上口的口号，这款产品是一款可以追踪健康和健身的智能手表。如果你简单地要求
    LLM `Generate some slogans for my product`，而没有任何背景信息或限制，你可能会得到类似这样的内容：


    * 让你保持聪明的智能手表

    * 你的健康与健身伙伴

    * 你生活方式的终极设备

    * 使用我们的智能手表保持连接与健康

    * 全能智能手表


    这些内容并不新颖，也不令人印象深刻。它们听起来像是通用的营销辞藻，适用于任何智能手表或可穿戴设备。它们没有捕捉到你的产品独特独特或吸引人的地方。现在，假设你通过告诉
    LLM 它是谁以及它应该做什么来给它提供一些背景和限制。例如，你可以说 `Act as a witty comedian and generate some
    slogans for my product that make people laugh`。然后你可能会得到类似这样的：`想要看起来很健硕的懒人的终极设备`。或者：`既然你的手腕可以免费地唠叨你，为什么要请私人教练？`（不过，正如你可能看到的，大多数
    AI 倾向于停留在“老爸笑话”的领域。）


    当然，如果那不符合你的风格或目标，你没必要让 AI 扮演喜剧演员。你也可以要求它扮演专家、朋友、评论家、故事讲述者或任何其他适合你目的的角色。关键在于给 LLM
    提供一些指导和方向，让它生成符合你预期和需求的输出，并让它处于正确的“思维状态”中，以给你有趣且独特的答案。研究表明，要求 AI 遵循不同的人设会导致不同的、通常更好的答案。但并不总是清楚哪些人设效果最好，LLM
    甚至可能会微妙地根据你的提问技巧调整它们的人设，对看起来经验较少的人提供不那么准确的答案，因此实验是关键。


    一旦你给了它一个人设，你就可以像对待其他人或实习生一样与它合作。当我要求学生使用 AI 生成关于相关主题五段式“作弊”时，我见证了这种方法的价值。起初，学生给出的提示词简单且模糊，导致了平平奇的文章。但随着他们尝试不同的策略，AI
    输出的质量显著提高。从课堂中产生的一种非常有效的策略是将 AI 视为共同编辑，进行往复的对话式过程。学生通过不断完善和重新引导 AI，创作出了远超他们最初尝试的优秀文章。


    记住，你的 AI 实习生虽然速度极快且知识渊博，但并非完美无缺。保持批判性的眼光并将 AI 视为一个为你服务的工具至关重要。通过定义它的人设、参与协作编辑过程并不断提供指导，你可以利用
    AI 作为一种协作共同智能的形式。


    ### 原则 4：假设这是你用过的最糟糕的 AI。


    当我 2023 年底写下这些时，我认为至少未来一年的世界是什么样子。更大、更智能的前模型（Frontier Models）正在到来，伴随着越来越多的小型和开源
    AI 平台。此外，AI 正在以新的方式与世界连接：它们可以阅读和编写文档、视觉和听觉、产生语音和图像，并浏览网页。LLM 将集成到你的电子邮件、浏览器和其他常用工具中。AI
    开发的下一个阶段将涉及更多 AI “代理”（agents）——半自主的 AI，可以被赋予一个目标（`plan a vacation for me`）并在人类帮助最小的情况下执行它。然而，之后事情开始变得模糊，未来变得不再清晰，AI
    的风险和收益开始倍增。我们稍后会回到主题，但有一个显而易见的结论，一个我们很多人难以理解的结论：你现在使用的任何 AI 都将是你用过的最糟糕的 AI。


    短时间内的变化已经是巨大的。在一个视觉例子中，考虑这两张使用 2022 年中期和 2023 年中期最先进 AI 模型制作的照片。它们都有相同的提示词，`black
    and white picture of otter wearing a hat`，但一个是充满皮毛的克苏鲁式噩梦，另一个是，嗯，一只戴着帽的水獭。同样的能力的提升在
    AI 中是无处不在的。


    没有理由怀疑 AI 系统的能力不会停止增长，但即使如此，对我们使用 AI 方式的调整和改进也将确保未来的软件比现在先进得多。我们正在一个很快就会拥有 PlayStation
    6 的世界里玩豆豆。而且这还是假设 AI 根据技术发展的正常速度进行改进。如果开发通用人工智能（AGI）的可能性被证明是真实且可行的，世界在未来几年内将发生更巨大的变革。


    随着 AI 越来越能够执行曾被认为是人类才能完成的任务，我们需要应对与日益强大的外星共同智能共处时的敬畏和兴奋——以及它们也会带来的焦虑和损失。许多曾经被认为是人类独有的事情将能够由
    AI 完成。因此，通过拥抱这一原则，你可以将 AI 的局限性视为暂时的，而对新进展保持开放将帮助你适应变化、拥抱新技术，并在 AI 指数级进步驱动的快速变化的商业环境中保持竞争力。这可能是一个令人不舒服的处，正如我们将讨论的那样，但它表明，利用
    AI 改变你的工作、生活和自身的可能性（我们现在可以窥见）只是开始。


    '
- fmt: '

    A common misconception tends to hinder our understanding of AI: the belief that
    AI, being made of software, should behave like other software. It is a little
    bit like saying humans, made of biochemical systems, should behave like other
    biochemical systems. While Large Language Models are marvels of software engineering,
    AI is terrible at behaving like traditional software.


    Traditional software is predictable, reliable, and follows a strict set of rules.
    When properly built and debugged, software yields the same outcomes every time.
    AI, on the other hand, is anything but predictable and reliable. It can surprise
    us with novel solutions, forget its own abilities, and hallucinate incorrect answers.
    This unpredictability and unreliability can result in a fascinating array of interactions.
    I have been startled by the creative solutions AI develops in response to a thorny
    problem, only to be stymied as the AI completely refuses to address the same issue
    when I ask again.


    Moreover, we usually know what a traditional software program does, how it does
    it, and why it does it. With AI, we’re often left in the dark. Even when we ask
    an AI why it made a particular decision, it fabricates an answer rather than reflecting
    on its own processes, mainly because it doesn’t have processes to reflect on in
    the same way humans do. Finally, traditional software comes with an operating
    manual or a tutorial. AI, however, lacks such instruction. There’s no definitive
    guide on how to use AI in your organization. We’re all learning by experimenting,
    sharing prompts as if they were magical incantations rather than regular software
    code.


    AI doesn’t act like software, but it does act like a human being. I’m not suggesting
    that AI systems are sentient like humans, or that they will ever be. Instead,
    I’m proposing a pragmatic approach: treat AI as if it were human because, in many
    ways, it behaves like one. This mindset, which echoes my “treat it like a person”
    principle of AI, can significantly improve your understanding of how and when
    to use AI in a practical, if not technical, sense.


    AI excels at tasks that are intensely human. It can write, analyze, code, and
    chat. It can play the role of marketer or consultant, increasing productivity
    by outsourcing mundane tasks. However, it struggles with tasks that machines typically
    excel at, such as repeating a process consistently or performing complex calculations
    without assistance. AI systems also make mistakes, tell lies, and hallucinate
    answers, just like humans. Each system has its own idiosyncratic strengths and
    weaknesses, just like each human colleague does. Understanding these strengths
    and weaknesses requires time and experience working with a particular AI. The
    abilities of AI systems range widely, from middle-school to PhD level, depending
    on the task.


    Social scientists have begun to test this analogy by giving AI the same tests
    we give humans across fields ranging from psychology to economics. Consider, for
    example, the distinctive ways people choose what to buy, how much they’re willing
    to pay, and how they adjust these choices based on income and past preferences.
    Companies spend billions of dollars trying to understand and influence this process,
    which has always been uniquely human. However, a recent study found that AI can
    not only understand these dynamics but also make complex decisions about value
    and assess different scenarios just like a human would.


    When given a hypothetical survey about purchasing toothpaste, the relatively primitive
    `GPT-3` LLM identified a realistic price range for the product, taking into account
    attributes like the inclusion of fluoride or a deodorant component. Essentially,
    the AI model weighed different product features and made trade-offs, just like
    a human consumer would. The researchers also found that `GPT-3` can generate estimates
    of willingness to pay (`WTP`) for various product attributes consistent with existing
    research. For this, they used conjoint analysis, a method often used in market
    research to understand how people value different product features. When given
    a conjoint-style survey, `GPT-3` generated estimates of `WTP` for fluoride toothpaste
    and deodorizing toothpastes that were close to the figures reported in previous
    studies. It also demonstrated substitution patterns expected from real consumer
    choice data, adjusting its choices based on the prices and attributes of the products.


    In fact, the AI even demonstrated an ability to adapt its responses based on a
    given “persona,” reflecting different income levels and past purchase behaviors.
    If you tell it to act like a particular person, it does. I have the students in
    my entrepreneurship class “interview” the AI about their potential products before
    ever talking to a real person. While I wouldn’t use that as a replacement for
    more traditional market research, it works well as both practice and a place to
    get some initial insights to follow up with when talking to actual potential customers.


    But the AI is not just acting like a consumer; it also arrives at similar moral
    conclusions, with similar biases, to the ones we have. For example, MIT professor
    John Horton had AI play the `Dictator Game`, a common economic experiment, and
    found he could get the AI to act in a way similar to a human. In the game, there
    are two players, one of whom is the “dictator.” The dictator is given a sum of
    money and must decide how much to give to the second player. In a human setting,
    the game explores human norms like fairness and altruism. In Horton’s AI version,
    AI was given specific instructions to prioritize equity, efficiency, or self-interest.
    When instructed to value equity, it chose to divide the money equally. When prioritizing
    efficiency, the AI opted for outcomes that maximized the total payoff. If self-interest
    was the order of the day, it allocated most of the funds to itself. Though it
    has no morality of its own, it can interpret our moral instructions. When no specific
    instruction was given, AI defaulted to efficient outcomes, a behavior that could
    be interpreted as a kind of built-in rationality or a reflection of its training.


    High school junior Gabriel Abrams asked AI to simulate various famous literary
    characters from history and had them play the `Dictator Game` against each other.
    He found that, at least in the views of the AI, our literary protagonists have
    been getting generous over time: “the Shakespearean characters of the 17th century
    make markedly more selfish decisions than those of Dickens and Dostoevsky in the
    19th century and in turn Hemingway and Joyce of the 20th century and Ishiguro
    and Ferrante of the 21st.” Of course, this project is just a fun exercise, and
    it is easy to overstate the value of these sorts of experiments overall. The point
    here is that AI can assume different personas rapidly and easily, emphasizing
    the importance of both developer and user to these models.


    These economic experiments, along with other studies on market responses, moral
    judgments, and game theory, showcase the striking humanlike behaviors of AI models.
    They not only process and analyze data but also appear to make nuanced judgments,
    parse complex concepts, and adapt their responses based on the information they
    are given.


    Consider the oldest, and most famous, test of computer intelligence: the `Turing
    Test`. It was proposed by Alan Turing, a brilliant mathematician and computer
    scientist widely regarded as the father of modern computing. Turing-fascinated
    by the question, Can machines think? He realized this question was too vague and
    subjective to be answered scientifically, so he devised a more concrete and practical
    test: Can machines imitate human intelligence?

