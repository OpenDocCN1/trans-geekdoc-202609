    and will also want answers about what AI means for their future learning paths.
    Schools will need to decide how to respond to this flood of questions.


    The Homework Apocalypse threatens a lot of good, useful types of assignments,
    many of which have been used in schools for centuries. We will need to adjust
    quickly to preserve what we are in danger of losing and to accommodate the changes
    AI will bring. That will take immediate effort from instructors and education
    leaders and clearly articulated policies around AI use. But the moment isn’t just
    about preserving old types of assignments. AI provides the chance to generate
    new approaches to pedagogy that push students in ambitious ways.


    I have made AI mandatory in all my classes for undergraduates and MBAs at the
    University of Pennsylvania. Some assignments ask students to “cheat” by having
    the AI create essays, which they then critique—a sneaky way of getting students
    to think hard about the work, even if they don’t write it. Some assignments allow
    unlimited AI use but hold the students accountable for the outcomes and facts
    produced by the AI, which mirrors how they might work with AI in their postschool
    jobs. Other assignments use the new capabilities of AI, asking students to conduct
    interviews with the AI before they speak to people at real organizations. And
    some of the assignments take advantage of the fact that the AI enables the impossible.
    For example, my first assignment to students in my Wharton entrepreneurship class
    now reads:


    Make what you are planning on doing ambitious to the point of impossible; you
    are going to be using AI. Can’t code? Definitely plan on making a working app.
    Does it involve a website? You should commit to creating a prototype working site,
    with all-original images and text. I won’t penalize you for failing if you are
    too ambitious.


    Any plan benefits from feedback, even if it just gives you permission to discuss
    what might go wrong. Ask the AI to give you 10 ways your project could fail and
    a vision of success, using the prompts from class. And, to make it interesting,
    ask three famous figures to criticize your plan. You can invoke entrepreneurs
    (Steve Jobs, Tory Burch, Jack Ma, Rihanna), leaders (Elizabeth I, Julius Caesar),
    artists, philosophers, or any other people you think would be useful to critique
    your strategy in their voice.


    Thus, while classes that are focused on teaching essays and writing skills will
    return to the nineteenth century, with in-class essays handwritten in blue books,
    other classes will feel like the future, with students carrying out the impossible
    every day.


    Of course, all this raises the even bigger question: What should we actually teach?
    Even slow-moving educational institutions are recognizing that teaching about
    AI will play an important role in education, with the US Department of Education
    suggesting, within just months of the release of ChatGPT, that AI will need to
    be embraced in classrooms. Some pundits go further, arguing that we need to focus
    on working with AI. We should, they argue, teach basic AI literacy, and probably
    “prompt engineering,” about the art and science of creating good prompts for AIs.


    ### Teaching about AI'
