    of workers and managers. AI sets goals and targets for them, assigns tasks and
    roles to them, evaluates their performance, and rewards them accordingly. But,
    unlike the cold, impersonal algorithm of Lyft or Uber, LLMs might also provide
    feedback and coaching to help workers improve their skills and productivity. AI’s
    ability to act as a friendly adviser could sand down the edges of algorithmic
    control, covering the Skinner box in bright wrapping paper. But it would still
    be the algorithm in charge. If history is a precedent, this is a likely path for
    many companies.


