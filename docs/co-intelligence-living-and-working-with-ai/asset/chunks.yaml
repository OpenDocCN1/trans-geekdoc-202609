- fmt: '

    One solution to incorporating more active learning is by “flipping” classrooms.
    Students would learn new concepts at home, typically through videos or other digital
    resources, and then apply what they’ve learned in the classroom through collaborative
    activities, discussions, or problem-solving exercises. The main idea behind flipped
    classrooms is to maximize classroom time for active learning and critical thinking,
    while using at-home learning for content delivery. The value of flipped classrooms
    seems to be mixed, ultimately depending on whether they encourage active learning
    or not.


    So the problem with implementing active learning lies in the lack of quality resources,
    from teacher time to the difficulty of finding good “flipped” learning materials,
    thus maintaining a status quo where active learning remains rare. This is where
    AI comes in as a partner, not a replacement, since human teachers can fact-check
    and guide the AI in ways that will help their class. AI systems can help teachers
    generate customized active learning experiences to make classes more interesting,
    from games and activities to assessments and simulations. For example, history
    professor Benjamin Breen used `ChatGPT` to create a Black Death simulator, in
    which students got a more immersive sense of what it might be like to live during
    the time of the plague than they would from a standard textbook. His students
    generally loved the assignment but also did things that surprised him, taking
    advantage of the flexibility of the AI to lead peasant revolts or develop the
    first vaccines against the plague. It is hard to imagine consistently getting
    these sorts of educational experiences before AI.


    But AI allows for more fundamental changes to how we learn, beyond providing classroom
    activities. Imagine introducing high-quality AI tutors into the flipped classroom
    model. These AI-powered systems have the potential to significantly enhance the
    learning experience for students and make flipped classrooms even more effective.
    They provide personalized learning, where AI tutors can tailor instruction to
    each student’s unique needs while continually adjusting content based on performance.
    This means that students can engage with the content at home more effectively,
    ensuring they come to class better prepared and ready to dive into hands-on activities
    or discussions.


    With AI tutors taking care of some of the content delivery outside of class, teachers
    can devote more time to fostering meaningful interactions with their students
    during class. They can also use insights from the AI tutors to identify areas
    where students might need extra support or guidance, enabling teachers to provide
    more personalized and effective instruction. And with AI assistance, they can
    design better active learning opportunities in class to make sure learning sticks.


    This isn’t a far-future pipe dream. Tools from Khan Academy (and some of our own
    experiments) suggest that existing AI, when properly prepared, is already an excellent
    tutor. Khan Academy’s `Khanmigo` goes beyond the passive videos and quizzes that
    made Khan Academy famous by including AI tutoring. Students can ask the tutor
    to explain concepts, of course, but it is also capable of analyzing patterns of
    performance to guess at why a student is struggling with a topic, providing much
    deeper help. It can even answer that most challenging of questions, “Why should
    I bother learning this?” by explaining how a topic like cellular respiration relates
    to a student who wants to be a football player (the AI’s argument: it will help
    them understand nutrition and therefore athletic performance).


    Students are already using AI as a learning tool. Teachers are already using AI
    to prep for class. The change is already here, and we will all encounter it sooner
    or later. It may force us to change models, but it will be in a way that ultimately
    enhances learning and reduces busywork. And, most exciting, this change is likely
    to be worldwide. Education is the key to increasing incomes and even intelligence.
    But two-thirds of the world’s youth are missing basic skills because school systems
    have failed them. But AI has changed everything: we stand on the cusp of an era
    when AI changes how we educate—the only question is whether we steer this shift
    in a way that lives up to the ideals of expanding opportunity and nurturing potential.


    ## AI AS A COACH


    The biggest danger to our educational system posed by AI is not its destruction
    of homework, but rather its undermining of the hidden system of apprenticeship
    that comes after education. For most professional workers, leaving school for
    the workforce marks the beginning of their practical education, not the end. Education
    is followed by years of on-the-job training, which can range from organized training
    programs to a few years of late nights and angry bosses. This system was not designed
    in a centralized way as parts of our educational system were, but it is critical
    to the way we actually learn to do real work.


    People have traditionally gained expertise by starting at the bottom. The carpenter’s
    apprentice, the intern at a magazine, the medical resident. These are usually
    pretty horrible jobs, but they serve a purpose. Only by learning from more experienced
    experts in a field, and trying and failing under their tutelage, do amateurs become
    experts. But that is likely to change rapidly with AI. As much as the intern or
    first-year lawyer doesn’t like being yelled at for doing a bad job, their boss
    usually would rather just see the job done fast than deal with the emotions and
    errors of a real human. So they will do it themselves with AI, which, if not yet
    the equivalent of a senior professional in many tasks, is often better than a
    new trainee. This could create a major training gap.


    In fact, Professor Matthew Beane, who studies robotics at UC Santa Barbara, showed
    that this is already happening among surgeons. Medical robots have been in hospitals
    for over a decade, helping perform surgeries while doctors nearby operate them
    with video game–like controllers. While the data on surgical robots is mixed,
    they seem to be helpful in many cases. They also create a huge problem in training.

