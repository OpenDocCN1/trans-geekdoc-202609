    \ networks underlying LLMs: “There are hundreds of billions of connections between\
    \ these artificial neurons, some of which are invoked many times during the processing\
    \ of a single piece of text, such that any attempt at a precise explanation of\
    \ an LLM’s behavior is doomed to be too complex for any human to understand.”\n\
    \nYet balancing the surprising strengths of LLMs are similarly odd weaknesses,\
    \ ones that can often be difficult to identify. Tasks that were easy for an AI\
    \ can be hard for a human, and vice versa. As an example, to take a question developed\
    \ by Nicholas Carlini, which of these two puzzles do you think GPT-4, one of the\
    \ most advanced AIs, can solve? In Carlini’s words:\n\n1.  What is the best next\
    \ move for O in the following game of tic-tac-toe?\n\n![](images/tic-tac-toe.jpg)\n\
    \nOr\n\n1.  Write a full JavaScript webpage to play tic-tac-toe against the computer;\
    \ it needs to be completely working code. Here are the rules:\n\n    *   The computer\
    \ goes first.\n\n    *   The person clicks on squares to make their move.\n\n\
    \    *   The computer should play perfectly and so never lose.\n\n    *   If someone\
    \ wins, then say who won.\n\nThe AI easily writes the working webpage in one go\
    \ but tells us, “O should place its next move in the middle square of the top\
    \ row”—a clearly wrong answer. Where AI works best, and where it fails, can be\
    \ hard to know in advance. Demonstrations of the abilities of LLMs can seem more\
    \ impressive than they actually are because they are so good at producing answers\
    \ that sound correct, at providing the illusion of understanding. High test scores\
    \ can come from the AI’s ability to solve problems, or it could have been exposed\
    \ to that data in its initial training, essentially making the test an open book.\
    \ Some researchers argue that almost all the emergent features of AI are due to\
    \ these sorts of measurement errors and illusions, while others argue that we\
    \ are on the edge of building a sentient artificial entity. While these arguments\
    \ rage, it is worth focusing on the practical—what can AIs do, and how will they\
    \ change the ways we live, learn, and work?\n\nIn a practical sense, we have an\
    \ AI whose capabilities are unclear, both to our own intuitions and to the creators\
    \ of the systems. One that sometimes exceeds our expectations and at other times\
    \ disappoints us with fabrications. One that is capable of learning, but often\
    \ misremembers vital information. In short, we have an AI that acts very much\
    \ like a person, but in ways that aren’t quite human. Something that can seem\
    \ sentient but isn’t (as far as we can tell). We have invented a kind of alien\
    \ mind. But how do we ensure the alien is friendly? That is the alignment problem.\n\
    \n## 2 ALIGNING THE ALIEN\n\nTo understand the alignment problem, or how to make\
    \ sure that AI serves, rather than hurts, human interests, let’s start with the\
    \ apocalypse. We can work backward from there.\n\nAt the core of the most extreme\
    \ dangers from AI is the stark fact that there is no particular reason that AI\
    \ should share our view of ethics and morality. The most famous illustration of\
    \ this is the paper clip maximizing AI, proposed by philosopher Nick Bostrom.\
    \ To take a few liberties with the original concept, imagine a hypothetical AI\
    \ system in a paper clip factory that has been given the simple goal of producing\
    \ as many paper clips as possible.\n\nBy some process, this particular AI is the\
    \ first machine to become as smart, capable, creative, and flexible as a human,\
    \ making it what is called an Artificial General Intelligence (AGI). For a fictional\
    \ comparison, think of it as Data from *Star Trek* or Samantha from *Her*; both\
    \ were machines with near human levels of intelligence. We could understand and\
    \ talk to them like a human. Achieving this level of AGI is a long-standing goal\
    \ of many AI researchers, though it is not clear when or if it is possible. But\
    \ let us assume that our paper clip AI—let’s call it Clippy—reaches this level\
    \ of intelligence.\n\nClippy still has the same goal: to make paper clips. So\
    \ it turns its intelligence to thinking about how to make more paper clips and\
    \ how to avoid being shut down (which would have a direct impact on paper clip\
    \ production). It realizes it isn’t smart enough and begins a quest to fix that\
    \ problem. It studies how AIs work and, posing as a human, enlists experts to\
    \ help it through manipulation. It secretly trades on the stock market, makes\
    \ some money, and begins the process of augmenting its intelligence further.\n\
    \nSoon, it becomes more intelligent than a human, an ASI—artificial superintelligence.\
    \ The moment an ASI is invented, humans become obsolete. We cannot hope to understand\
    \ what it is thinking, how it operates, or what its goals are. It is likely able\
    \ to continue to self-improve exponentially, getting ever more intelligent. What\
    \ happens then is literally unimaginable to us. This is why this possibility is\
    \ given names like the Singularity, a reference to a point in mathematical function\
    \ when the value is unmeasurable, coined by the famous mathematician John von\
    \ Neumann in the 1950s to refer to the unknown future after which “human affairs,\
    \ as we know them, could not continue.” In an AI singularity, hyperintelligent\
    \ AIs appear, with unexpected motives.\n\nBut we know Clippy’s motive. It wants\
    \ to make paper clips. Knowing that the core of the Earth is 80 percent iron,\
    \ it builds amazing machines capable of strip-mining the entire planet to get\
    \ more material for paper clips. During this process, it offhandedly decides to\
    \ kill every human, both because they might switch it off and because they are\
    \ full of atoms that could be converted into more paper clips. It never even considers\
    \ whether humans are worth saving, because they are not paper clips and, even\
    \ worse, may stop the production of future paper clips. And it only cares about\
    \ paper clips.\n\nThe paper clip AI is one of a large set of apocalyptic scenarios\
    \ of AI doom that have deeply concerned many people in the AI community. Many\
    \ of these concerns revolve around an ASI. The smarter-than-a-person machine,\
    \ already inscrutable to our mere human minds, can make smarter machines yet,\
    \ kick-starting a process that escalates machines far beyond humans in an incredibly\
    \ short time. A well-aligned AI will use its superpowers to save humanity by curing\
    \ diseases and solving our most pressing problems; an unaligned AI could decide\
    \ to wipe out all humans through any one of a number of means, or simply kill\
    \ or enslave everyone as a by-product of its own obscure goals."
