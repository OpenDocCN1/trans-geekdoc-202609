    让我们进入建筑的世界。想象一下两位初出茅头的建筑师，Alex 和 Raj。他们刚从顶尖建筑学院毕业，充满了新颖的想法和对设计的渴望。Alex 从使用传统方法起草设计开始了他的旅程。他经常审阅著名的建筑蓝图，每周从公司的一位资深建筑师那里获得反馈。他相信，通过不断地描绘和完善设计，他会逐渐进步。虽然这个过程确实有助于他学习，但受限于反馈的频率以及他的导师在短时间内能提供的分析深度。


    相比之下，Raj 将一个 AI 驱动的建筑设计助手整合到他的工作流中。每当他创建一个设计时，AI 都会提供即时反馈。它可以指出结构上的低效之处，根据可持续材料提出改进建议，甚至预测潜在成本。此外，AI
    还会将 Raj 的设计与大量其他创新建筑作品数据库进行比较，突出差异并建议改进之处。得益于 AI 提供的见解，Raj 不仅仅是在迭代设计，而是在每个项目结束后都进行结构化的反思。这就像有一位导师在每一步都守护在他身边，推着他迈向卓越。


    几个月后，Alex 和 Raj 增长轨迹之间的差异变得显而易见。虽然 Alex 的设计确实在成熟和演变，但他增长的速度明显慢得多。他每周一次的反馈会议虽然很有价值，但无法提供
    Raj 在每次设计迭代后都能获得的即时、深层次分析。Raj 在 AI 帮助下的方法体现了刻意练习（deliberate practice）的精髓。他持续、快速的反馈循环，结合针对性的改进建议，确保了他不仅仅是在增加练习量，而是在提高练习。在这种背景下，AI
    对 Raj 来说不仅仅是一个工具；它像一个无处不在的导师，确保每一次尝试不仅仅是为了产生另一个设计，而是为了有意识地理解和完善他的建筑方法。


    今天的 AI 无法实现这一整个愿景。它无法连接复杂的概念，而且仍然存在很多幻觉。然而，在我们在沃顿学院的实验中，我们发现如今的 AI 在有限范围内仍然可以成为非常令人印象深刻的教练，提供及时的鼓励、指导以及刻意练习的其他元素。例如，我们使用
    AI 构建了一个模拟器来教人们如何推销他们的想法（pitch）。用户首先接受指导环节，并有机会向 AI 提问关于他们学到的内容（此时 AI 被提示要像我在课堂上那样提供推销方面的建议）。接下来，他们进入练习环节，通过不同的提示词让
    AI 模拟风险投资人，对他们的推销和想法进行“灵魂拷问”。在整个过程中，同一 AI 的另一个实例正在收集他们表现的数据，包括之前的 AI 留下的秘密“笔记”。在练习环节结束时，这个
    AI 会对他们进行评分。


    ### 当每个人都是专家


    今天的 AI 无法实现这一整个愿景。它无法连接复杂的概念，而且仍然存在很多幻觉。然而，在我们在沃顿学院的实验中，我们发现如今的 AI 在有限范围内仍然可以成为非常令人印象深刻的教练，提供及时的鼓励、指导以及刻意练习的其他元素。例如，我们使用
    AI 构建了一个模拟器来教人们如何推销他们的想法。用户首先接受指导环节，并有机会向 AI 提问关于他们学到的内容（此时 AI 被提示要像我在课堂上那样提供推销方面的建议）。接下来，他们进入练习环节，通过不同的提示词让
    AI 模拟风险投资人，对他们的推销和想法进行“灵魂拷问”。在整个过程中，同一 AI 的另一个实例正在收集他们表现的数据，包括之前的 AI 留下的秘密“笔记”。在练习环节结束时，这个
    AI 会对他们进行评分。

