    请让我扮演一个商学院教授的角色。在 1016 份职业中，我的重叠度排名第 22，这让我有些担心。但我的工作并不是一个单一、不可分割的实体。相反，它包含各种任务：教学、研究、写作、填写年度报告、维护电脑、撰写推荐信等等。“教授”这个头衔只是一个标签；日常的琐事是由这些任务的混合组成的。


    AI 能接管其中的一些任务吗？答案是肯定的。坦率地说，有些任务我是并不介意交给 AI 的，比如行政文书工作。但这意味着我的工作将会消失吗？并不完全如此。消除某些任务并不意味着工作的消失。正如动力工具没有消灭木木，反而是让他们变得更高效；电子表格让会计师工作得更快，但并没有消灭会计师。AI
    有潜力自动处理枯燥的任务，将我们解放出来，去从事需要人类独特特质的工作，例如创造力和批判性思维——或者，正如我们在上一章中讨论的那样，可能还有管理和策划 AI
    的创意输出。


    然而，故事还没有结束。我们运行的系统在塑造我们的工作方面也起着至关重要的作用。作为商学院教授，一个显而易见的系统是终身制，这意味着我无法被轻易替换，即使我的工作被外包给了
    AI。但更微妙的是大学里的许多其他系统。假设 AI 授课做得比我好。学生们愿意将他们的学习外包给 AI 吗？我们的教室技术能够适应 AI 教学吗？大学院长会觉得这样使用
    AI 舒服吗？那些排名的学校的杂志和网站会因为我们这样做而惩罚我们吗？我的工作与许多其他工作、客户和利益相关者相关。即使 AI 自动化了我的工作，它所运行的系统就不那么明显了。


    所以，让我们把 AI 置于背景中，讨论一下在任务和系统层面它能做什么。


    ### 任务与锯齿边界（The Jagged Frontier）


    从理论上分析 AI 对工作的影响是一回事，但对其进行测试则是另一回事。我一直在和研究小组一起做这项工作，包括哈佛社会科学家 Fabrizio Dell''Acqua、Edward
    McFowland III 和 Karim Lakhani，以及来自华威士商学院的 Hila Lifshitz-Assaf 和麻省理工学院的 Katherine
    Kellogg。我们得到了全球顶尖管理咨询机构之一波士顿咨询（BCG）的帮助，由他们运行了研究，并在近八百名顾问参与了实验。


    顾问们被随机分为两组：一组必须按照标准方式工作，另一组则可以使用 `GPT-4`，这是全球 169 个国家的人都可以访问的同一种市售原版大语言模型（LLM）。然后，我们为他们提供了一些
    AI 培训，让他们在计时器的限制下，独立完成 18 项任务。这些任务由 BCG 设计，看起来像顾问的标准日常工作。任务包括创造性任务（`为一种针对未被充分开发的市场或运动领域的新鞋子提出至少
    10 个创意`）、分析性任务（`根据用户划分鞋类行业市场`）、写作和营销任务（`为你的产品起草一份新闻稿营销文案`）以及说服任务（`给员工写一封励性的忘录，详细说明为什么你的产品将超越竞争对手`）。我们甚至咨询了鞋公司的高管，以确保这些工作是现实的。


    与 AI 合作的小组表现明显优于不使用 AI 的小组。使用 AI 的顾问速度更快，他们的工作被认为比同事更有创造力、写作水平更好、更具分析性。但，使用 AI
    的顾问在关键时刻也更容易犯大错。我们衡量了结果，发现没有 AI 帮助的顾问在 84% 的情况下回答正确，但当他们使用 AI 时，正确率只有 60% 到 70%。


    发生了什么？


    在另一篇论文中，Fabrizio Dell''Acqua 解释了为什么过度依赖 AI 可能会事适得其反。他聘佣了 181 名专业招聘人员，并给了他们一项棘手任务：根据他们的数学能力评估
    44 份工作申请。数据来自一项国际成人技能测试，因此数学分数并不直观。招聘人员获得了不同程度的 AI 辅助：有些人拥有良好的 AI，有些很糟糕，有些完全没有。他衡量了他们的准确性、速度、努力程度和信心。


    拥有高质量 AI 的招聘人员表现比拥有低质量 AI 的人员差。他们对每份简历花费的时间和精力更少，并盲目遵循 AI 的建议。他们也没有随着时间的推移而进步。相反，拥有低质量
    AI 的招聘人员更加警觉、更具批判性且更独立。他们改进了与 AI 的交互以及自己的技能。


    Dell’Acqua 开发了一个数学模型来解释 AI 质量与人类努力之间的权衡。当 AI 非常优秀时，人类没有理由努力工作和投入注意力。他们让 AI 接管，而不是将其作为工具，这会损害人类的学习、技能发展和生产力。他将其称为“开车打睡（falling
    asleep at the wheel）”。


    Dell’Acqua 的研究指向了我们在 BCG 顾问实验中发生的情况。强大的 AI 让顾问更容易“开车打睡”并犯大错。他们误解了“锯齿边界”的形状。


    理解 AI 如何影响工作的未来，涉及到理解人类与 AI 的交互如何变化，这取决于任务位于该边界的什么位置以及边界将如何变化。这需要时间和经验，这就是为什么坚持“邀请
    AI 参与一切”的原则非常重要，这让我们学习锯齿边界的形状，以及它如何映射到构成我们个人工作的复杂任务体中。有了这些知识，我们需要有意识地给 AI 分配任务，以便利用它的优势并弥补我们的短板。我们希望在减少无聊工作的同时变得高效，并在保持人类参与的同时也解决
    AI 的价值问题。


    ### 属于我的任务，属于 AI 的任务


