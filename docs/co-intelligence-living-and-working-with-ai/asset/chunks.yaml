  trans: '

    这些预测性 AI 技术可能在零售巨头亚马逊找到了它们的终极表达，该公司在 2010 年代深度拥抱了这种形式的 AI。亚马逊物流实力的核心在于其 AI 算法，这些算法静静地编排着供应链的每一个阶段。亚马逊将
    AI 集成到需求预测、仓库布局优化以及货物交付中。它还能根据实时需求数据智能地组织和重新排列货架，确保热门产品易于获取以快速发货。AI 还驱动了亚马逊的 `Kiva`
    机器人，这些机器人将装满产品的货架运送到仓库工人面前，使包装和发货过程更加高效。机器人本身依赖于其他 AI 进展，包括计算机视觉和自动驾驶领域的进展。


    然而，这些类型的 AI 系统并非没有局限。例如，它们在预测“未知的未知”（即人类直觉上理解但机器无法理解的情况）时非常吃力。此外，它们对于尚未通过监督学习遇到过的数据也感到很困难，这给它们的适应性带来了挑战。最重要的是，大多数
    AI 模型在以连贯且感知上下文的方式理解和生成文本方面也存在限制。因此，虽然这些 AI 应用在今天仍然很重要，但它们并不是大多数人在日常生活中直接看到或注意到的东西。


    但在行业和学术专家发表的关于不同形式 AI 的众多论文中，有一篇脱颖而出，其标题引人注目：“注意力就是一切”（Attention Is All You Need）。这篇论文由
    Google 研究人员于 2017 年发表，引入了 AI 世界的重大转变，特别是在计算机理解和处理人类语言方面。这篇论文提出了一种名为 `Transformer`
    的新架构，它可以帮助计算机更好地处理人类的交流。在 `Transformer` 出现之前，使用其他方法来教计算机理解语言，但它们具有局限性，严重限制了实用性。`Transformer`
    通过利用“注意力机制”解决了这些问题。这种技术允许 AI 关注文本中最相关的部分，让 AI 更容易理解并处理语言，使其处理方式看起来更像人类。


    在阅读时，我们知道句子中最后一个读到的词并不总是最重要的词，但机器在这一概念上却很挣扎。结果就是产生了听起来很别扭、显然由计算机生成的句子。“谈论算法如何静静地编排每一件物品”正是一个
    `Markov chain` 生成器（一种文本生成 AI 的早期形式）想要继续这段话的方式。早期的文本生成器依赖根据基本规则选择单词，而不是阅读上下文线索，这就是为什么
    iPhone 键盘会显示许多糟糕的自动补全建议。解决理解语言的问题非常复杂，因为许多单词可以以多种方式组合，使得公式化的统计方法变得不可行。注意力机制帮助解决这一问题，它允许
    AI 模型权衡一段文本中不同单词或短语的重要性。通过关注文本中最相关的部分，`Transformers` 与早期的预测性 AI 相比，可以产生更具上下文感知能力且连贯的写作。在
    `Transformer` 架构进步的基础上，我们现在处于一个 AI 时代，像我这样的 AI 能够生成上下文丰富的内容，展示了机器理解和表达能力的卓越演变。（而且，是的，最后那句话是
    AI 生成的文本——与 Markov chain` 有很大区别！）


    这些新类型的 AI 被称为大语言模型（`LLMs`），它们仍然在预测，但它们不是预测亚马逊订单的需求，而是分析一段文本并预测下一个标记（token），这简单来说就是一个单词或单词的一部分。归根结底，这就是
    `ChatGPT` 在技术上所做的一切——作为一个像你手机上那种非常复杂的自动补全工具。你给它一些初始文本，它根据统计上计算出的序列中可能的可能的下一个标记继续写下去。如果你输入“完成这个句子：我想，所以我
    . . . ,”，AI 将预测下一个单词将是 `am`，每次都是如此，因为这种情况极有可能发生。如果你输入一些更奇怪的内容，比如“火星人吃了香蕉，因为”，你每次都会得到不同的答案：“它是飞船上唯一的熟悉食物，”它是从未尝试过的有趣食物，”或“它是为了测试地球食物的适用性的实验。”这是因为句子的后半部分有很多可能的答案，大多数
    `LLMs` 在回答时加入了一些随机性，以确保每次的结果都不同。


    为了教 AI 如何理解和生成文本，它在网站、书籍和其他数字文档的海量文本上进行训练。这被称为预训练，与早期的 AI 不同，它是无监督的，这意味着它不需要经过标记的数据。相反，通过分析这些示例，AI
    学习了语言的模式和结构。令人惊讶的是，通过大量的可调参数（称为权重 weights），`LLMs` 能够创建一个模拟人类写作的模型。权重是 `LLMs` 在阅读这些数十亿单词时学习的复杂变换，它们告诉
    AI 不同的单词或单词部分一起出现或按特定顺序出现的概率。原始的 `ChatGPT` 有 175 亿权重，编码了单词和单词部分之间的关系。没有人编写这些权重，相反，它们是
    AI 在训练过程中自己学习的。


    把 `LLM` 想象成一个勤奋的学徒厨，渴望成为主厨。为了学习烹饪，学徒从阅读和研究世界各地的谱开始。每份菜谱代表一段文本，各种食材代表单词和短语。学徒的目标是理解如何组合不同的食材，以创造出一道佳肴。


    学徒厨从一个混乱、无序的厨房开始，这代表了 175 亿权重。最初，这些权重具有随机值，尚未包含任何关于单词之间关系的有用信息。为了积累知识并精炼调料架，学徒厨通过他们学习过的菜谱进行不断尝试。它发现某些味道更常见且更搭——如苹果和肉桂——而某些味道很罕见且应该避免——如苹果和孜。在训练期间，学徒厨尝试使用现有的厨房重新制作菜谱中的菜肴。每次尝试后，学徒会将自己的作品与原始菜谱进行比较，并识别任何错误或差异。学徒厨会重新考虑厨房中的食材，精炼味道之间的连接，以更好地理解它们一起使用或按特定顺序使用的概率。

