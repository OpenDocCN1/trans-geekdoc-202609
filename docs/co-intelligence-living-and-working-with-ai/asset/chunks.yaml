  trans: '

    其次，领导者需要找到一种减少对披露使用 AI 的恐惧的方法。假设早期研究是真实的，我们在各种高价值专业任务中看到了 20% 到 80% 的生产力提升，我担心许多经理的本能反应是“裁员，省钱”。但事实并非如此。公司有许多理由不将效率增益转化为人员削减或成本降低。那些学会如何利用其高生产力劳动力的公司，应该能够主宰任何试图保持
    AI 时代产出与 AI 前前一致、仅人数更少的公司。而那些致力于维持员工规模的公司，其员工可能会成为合作伙伴，他们乐意向他人传教如何在工作中使用 AI，而不是由于害怕被取代而隐藏自己
    AI 使用行为的工人。


    说服员工接受这一点是另一回事。也许组织可以提供保证，确保没有员工因使用 AI 而被裁员，或者承诺工人可以使用使用 AI 释放出的时间处理更有趣的项目，甚至早点下班。但在
    AI 的早期研究中埋藏着关于未来道路的提示，通向一个完全不同的工作环境。工人虽然担心 AI，但往往喜欢使用它，因为它消除了他们工作中最单调和烦恼的部分，给他们留下了有趣的任务。因此，即使
    AI 从工作中移除了一些以前有价值的任务，剩下的工作也可以更意义意义、更高价值。当然，这并非不可避免，因此经理和领导者必须决定是否以及如何致力于围绕 AI
    重新组织工作，以一种帮助而非伤害他们人类员工的方式。你需要问自己：关于 AI 如何让工作变得更好而不是更糟，你的愿景是什么？这正是具有高度信任和良好文化的组织将拥有优势的地方。如果你的员工不相信你在乎他们，他们就会继续隐藏对
    AI 的使用。


    第三，组织应该极力激励 AI 使用者站出来，并扩大整体使用 AI 的人数。这意味着不仅要允许使用 AI，还要为那些发现 AI 帮助提供巨大机会的人提供丰厚的奖励。想想足以涵盖一年薪资的现金奖金。晋升。角办公室。永远居家办公的能力。由于
    `LLMs` 可能带来的潜在生产力增益，对于真正的突破性创新来说，这些是微小的代价。而且巨大的激励也表明组织对这个问题是认真的。


    最后，公司需要开始考虑有效使用 AI 的另一个要素：系统。组织对于一项影响其高薪水员工的技术采取立场的压力将是巨大的，这些工人生产力提高所带来的价值也是如此。如果不对组织的工作方式进行根本性的重构，AI
    的益处将永远无法实现。


    ### 从任务到系统


    我们经常对用于结构化和协调组织工作的系统视理所当然。我们假设它们是完成任务的自然方式。但现实中，它们是历史的产物，是由其时代的技术和社会条件所塑造的。例如，组织架构图最初是为了在
    19 世纪 50 年代运营铁路而设计的。由早期的铁路大亨开发，他们创建了一套关于权威、责任和通信的层级系统，使他们能够控制和监控铁路帝国的运营。在电报的帮助下，他们将人类整合到一个清晰的层级结构中，老板下达的指令通过流经轨道和电报线传递给图表底部的工人。该系统非常成功，很快就被其他行业和组织采用，成为
    20 世纪官僚体制的标准模型。


    另一个系统源于人类局限性和技术的不同组合：流水线。流水线通常归功于 20 世纪初的亨利·福特，它允许他的公司以更低的成本和更高的速度批量生产汽车。他意识到人类并不擅长执行复杂且多样的任务，但他们非常擅长执行简单重复的工作。他还注意到，通过使用标准工具和零件，以及传送带和计时器等新技术，技术可以帮助他同步和优化工作流。他将生产过程分为小而简单的任务，并将它们分配给反复、高效执行这些任务的工人。他的系统非常成功，彻底改变了制造业，创造了规模经济和范围经济，并使大众消费和定制成为可能。


    互联网标志着另一组用于组织和控制工作的技术，这就是为什么在过去的几十年里，我们看到了新的工作组织管理系统的出现，例如敏捷软件开发、精益生产、全员自治（Holacracy）和自管理团队。在从电子邮件到复杂企业软件等工具浪的推动下，这些管理趋势采用了新的、数据驱动方法。但与以前的所有工作一样，它们仍然依赖于人类的能力和局限性。人类的注意力是有限的，我们的情感仍然很重要，工人仍然需要上厕所。技术在变，但工人和经理只是人。


    这正是 AI 可能会改变的。通过作为管理工作的协作智能，或至少帮助经理管理工作，`LLMs` 的增强能力可能会从根本上改变工作体验。单个 AI 可以与数百名工人交流，提供建议并监控表现。它们可以担任导师，也可以操纵。它们可以以微妙或公开的方式引导决策。


    在这一代 AI 出现之前，公司一直在尝试对工人进行各种计算机控制。打卡机、摄像头和其他监控形式已经常见了一个世纪，但这些方法在预 LLM  AI 的兴起、特别是使用算法控制工作和工人时进入了高潮。想想一个零工，希望
    `Uber` 能为他们提供稳定的客户源，尽管他们收到了愤怒乘客的低评；或者 `UPS` 司机，他们驾驶的每一分钟都受到算法的审查，以查看他们是否足够高效以保住工作。麻省理工学院的凯瑟琳·凯洛格与斯坦福大学的梅丽莎·瓦伦丁和安杰尔·克里斯汀一起概述了这些新型控制类型与之前的管理形式何不同。以前经理对工人正在做什么的信息有限，而算法是全面且实时的，利用来自许多来源的海量数据来跟踪工人。算法还以交互方式工作，实时引导工人完成公司想要的任何任务。而且它们是不透明的——它们的偏见，甚至决策方式，对工人来说都是隐藏的。


    华盛顿教授林德赛·卡梅隆在担任六年的零工司机时亲身体验了这一点，这是一项关于工人如何应对算法管理的深度民族志研究的一部分。被迫依赖 `Uber` 或 `Lyft`
    的算法来寻找工作，他们进行隐蔽的反抗以获得对命运的某种控制权。例如，司机可能会担心特定的乘客会给他们打低分（从而损害未来的收入），因此他们会说服乘客在取车前取消，也许谎称司机看不到潜在的接送点。但即使这些反抗形式也没有让司机从算法中解放，算法控制着他们去哪里、赚多少钱以及如何度过时间。

