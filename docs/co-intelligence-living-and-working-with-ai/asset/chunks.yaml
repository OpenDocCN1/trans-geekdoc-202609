- fmt: '

    The AI will not naturally deliver novelty (as we discussed above, it tends to
    give the crowd-pleasing “average” answer that is most likely from its training
    data), but we can make it do so with a little work. We need to push the AI from
    an average answer to a high-variance, weird one. We can do this again by telling
    the AI who it is. Force it to give you less likely answers, and you will find
    more original combinations.


    Imagine you are opening a coffee shop. You might want to ask: `You are an expert
    at problem-solving and idea generation. When asked to solve a problem, you come
    up with novel and creative ideas. Tell me 10 detailed ways a superhero might make
    espresso and how they might speculatively get the same effects in a new product.`


    > ![](images/page_xiv.jpg)Nightcrawler—Using his teleportation power, he could
    transport himself to Italy to learn firsthand from Italian baristas, and teleport
    back with a freshly made espresso. A new product could connect users to virtual
    coffee workshops with expert baristas around the world for an authentic experience.


    > Scarlet Witch—Using her chaos magic, she could conjure up the most amazing cup
    of espresso from nothing. A new product could offer a “Surprise Me” feature where
    the machine randomly selects from a range of beans, grinds, and brew methods to
    create an unexpected and delicious espresso.


    ![](images/1.jpg)


    The results can be interesting as sources of inspiration (I like the idea of the
    virtual coffee workshops!) but still require a human in the loop to filter and
    select the best ideas. Yet it allows us to outsource some of the most difficult
    aspects of creativity. When I started requiring students to use these methods
    to generate ideas for start-ups in my entrepreneurship class, I found that the
    ideas’ quality increased tremendously from the prior year. I encountered novel
    business ideas rather than seeing the same few ideas over and over again (better
    ways to order drinks at bars, companies that would store your stuff between semesters—they
    are students after all). Having the AI at the table was a cheap source of additional
    innovation and a new perspective.


    ## Adding AI to Creative Work


    Upon closer inspection, a surprisingly large amount of work is actually creative
    work in the form that AI is good at. Situations in which there is no right answer,
    where invention matters and small errors can be caught by expert users, abound.
    Marketing writing, performance reviews, strategic memos—all these are within the
    capability of AI because they have both room for interpretation and are relatively
    easily fact-checked. Plus, as many of these document types are well represented
    in the AI training data, and are rather formulaic in approach, AI results can
    often seem better than that of a human and can be produced faster as well.


    We can see these results in a study by economists Shakked Noy and Whitney Zhang
    from MIT, examining how `ChatGPT` could transform the way we work. The researchers
    asked the participants to write different types of documents based on their roles
    and scenarios. For example, the participants who were marketers had to create
    a press release for a fictional product; the participants who were grant writers
    had to craft a cover letter for a grant proposal; the participants who were managers
    and HR professionals had to compose a long email for the whole company on a delicate
    issue; the participants who were data analysts had to design an analysis plan
    in a `code-notebook` format; and the participants who were consultants had to
    produce a short report based on three given sources. Some were assigned to use
    AI and some were not. The results were nothing short of astonishing. Participants
    who used `ChatGPT` saw a dramatic reduction in their time on tasks, slashing it
    by a whopping 37 percent. Not only did they save time, but the quality of their
    work also increased as judged by other humans. These improvements were not limited
    to specific areas; the entire time distribution shifted to faster work, and the
    entire grade distribution shifted to higher quality. The study also showed that
    AI teammates helped reduce productivity inequality. Participants who scored lower
    on the first round without AI assistance benefited more from using `ChatGPT`,
    narrowing the gap between low and high scorers.


    Even things that don’t initially appear to be creative can be. AI works tremendously
    well as a coding assistant because writing software code combines elements of
    creativity with pattern matching. Again, early research suggests big impacts.
    When researchers from Microsoft assigned programmers to use AI, they found an
    increase of 55.8 percent in productivity for sample tasks. AI can even turn nonprogrammers
    into coders, of a sort. I can’t write code in any modern language, but I have
    had AI write a dozen programs for me. The idea of programming by intent, by asking
    the AI to do something and having it create the code, is likely to have significant
    impacts in an industry whose workers earn $464 billion a year.


    AI is also good at summarizing data since it is adept at finding themes and compressing
    information, though at the ever-present risk of error. As an example, I added
    tiny science references to *The Great Gatsby*—in the middle of the text, Daisy
    refers to her iPhone, and one of Gatsby’s gardeners uses a laser-powered lawn
    mower. I asked the AI to tell me if anything seemed unusual. It found both errors
    but also hallucinated.


    Of course, the unresolved question is whether AI is more or less accurate than
    humans, and whether its extended abilities to do creative, human work makes up
    for its errors. The trade-offs are often surprising. A paper published in the
    *Journal of the American Medical Association: Internal Medicine* asked `ChatGPT-3.5`
    to answer medical questions from the internet, and had medical professionals evaluate
    both the AI’s answers and an answer provided by a doctor. The AI was almost 10
    times as likely to be rated as very empathetic than the results provided by the
    human, and 3.6 times as likely to be rated as providing good-quality information
    compared to human doctors.

