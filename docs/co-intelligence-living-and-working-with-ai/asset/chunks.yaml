    我们可以想象大语言模型（LLMs）如何极大增强这一过程，创造出一个更全面的“全景监狱”：在这个系统中，工作的每一个方面都受到人工智能的监控和控制。AI 追踪员工和管理人员的活动、行为、输出和结果。AI
    为他们设定目标和指标，分配任务和角色，评估他们的表现，并给予相应的奖励。但是，与 Lyft 或 Uber 那种冷酷、不带感情的算法不同，LLMs 还可以提供反馈和教练，帮助员工提高技能和生产力。AI
    扮演友善顾问的能力可以磨平算法控制的棱角，给斯金纳箱箱裹上一层亮丽的包装纸。但尽管如此，主导的仍然是算法。如果历史可以作为先例，这很可能是许多公司将要走的道路。


    但也存在其他、更具乌托邦色彩的可能性。我们不需要让大量人类受制于机器主宰。相反，LLMs 可以帮助我们蓬勃发展，因为它让我们再无法忽视真相：很多工作实际上非常无聊，而且没有特别意义。如果我们承认了这一点，就可以把注意力转向改善人类的工作体验。


    在调查中，人们报告说每周在工作中感到无聊的时间达 10 小时，这一比例惊得人。虽然并非所有工作都必须令人兴奋，但有大量工作是毫无无故地无聊的，这似乎是一个大问题。无聊不仅是人们离开公司的首要原因，而且我们在无聊时会做一些疯狂的事。一项针对本科生的的一项小型研究发现，66%
    的男性和 25% 的女性宁愿忍痛苦地电击自己，也不愿静静地坐 15 分钟且无所事事。无聊不仅会导致我们伤害自己；18% 的无聊者在有机会的情况下杀死了虫子（而非无聊的人中仅有
    2% 这样做过）。无聊的父母和士兵表现得都更具施虐倾向。无聊不仅仅是无聊，它以其独特的方式也是危险的。


    在理想的世界里，经理们会花时间尝试结束导致无聊的无用和重复工作，并调整工作以关注更具参与感的任务。然而，尽管有多年来的管理建议，大多数正式的仪式、表格和要求在失去效用后依然存在。如果人类无法结束这些枯燥的工作，也许机器可以。


    我们已经将写作中最糟糕的部分（检查语法）和数学（长除法）外包给了拼写检查器和计算器等机器，使我们从这些枯燥的任务中解放出来。使用 LLMs 来扩展这一过程是自然而然的。这确实是我们在关于使用
    AI 工作的早期研究中看到的。使用 AI 执行任务的人更享受工作，并觉得他们能够更好地发挥自己的才华和能力。将糟糕、毫无意义的任务外包给 AI 是一种解脱。你工作中最糟糕的部分交给了
    AI，这样你就可以专注于那些美好的事情。


    因此，如果我们想思考真正交给 AI 的第一份工作，也许我们应该像其他每一次自动化浪潮开始的方式一样：从那些枯燥的、（心理上）危险的重复的任务开始。公司和组织可以开始思考如何让无聊的流程对
    AI 友好，让机器（在人类的监督下）填写我们所需的表格。奖励那些使用 AI 消灭无聊任务的员工也有利于简化运营，同时让每个人变得更快乐。如果这能揭示某些可以安全自动化而不会降低价值的任务，那就再好不过。也许那些就是可以被消除的工作。与替代方案——算法控制相比，这无疑是一个更好的起点。


