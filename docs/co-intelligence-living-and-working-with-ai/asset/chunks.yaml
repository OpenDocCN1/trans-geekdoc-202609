    那么 AI 会导致专业知识的消亡吗？我不认为会。正如我们讨论过的，工作并非由单一的可自动化任务组成，而是由一系列仍然需要人类判断的复杂任务组成的。此外，由于“锯齿边界”（Jagged
    Frontier），它很难完成员工负责的每一项任务。在少数领域提高性能并不意味着会被人的取代；相反，它将允许员工专注于构建和磨炼狭小领域的专业知识，成为“环路中的人类”（human
    in the loop）。


    但可能会出现一种新型的专家。虽然我们在上一章中讨论过，提示词工程（prompt crafting）对大多数人来说可能并不可用，但这并不意味着它完全没有用处。与
    AI 协作本身可能就是一种专业知识。可能有些人确实非常擅长此。他们能比其他人更好地采用“半人机械”（Cyborg）式的实践，并在与 `LLM` 系统协作方面拥有天赋（或通过学习获得）的天赋。对于他们来说，AI
    是一个巨大的福音，改变了他们在工作和社会中的地位。其他人可能只会从这些系统中获得微小的收益，但这些新的 AI 帝王和王后获得的是数量级的提升。如果这种情况属实，他们将成为我们
    AI 时代的新星，并像今天顶尖人才被招聘一样，被每家公司和机构寻求。


    我和我的长期合作伙伴、新技术教学专家（也是我的配偶）Lilach Mollick 博士本身也过过这种经历。随着 2023 年夏天围绕 AI 的热潮和焦虑升温，我们发现自己供不应求，因为我们是少数最能将教学法知识与创建提示的深度经验结合的人。包括
    `OpenAI` 和 `Microsoft` 在内的大型 AI 公司分享了我们的提示词作为课堂使用的示例，而提示词本身也在全球教育机构中引用和流传。虽然我们并不认为自己在提示词方面拥有特殊技能，但我们发现自己非常擅长让
    AI 按照我们的意愿跳舞。我们并不知道为什么擅长这个（经验？游戏设计和教学的背景？能够代入 AI、导师和学生的“视角”的能力？还是我们为不同受众编写指令的经验？），但这表明，在特定领域擅长与
    AI 协作的人类可能拥有一席之地。我们尚未完全确定位那些开启与 AI “对话”能力的特定技能或专业知识。


    AI 的未来要求我们依靠构建自己作为人类专家的专业知识。由于专业知识需要事实，学生仍然需要学习阅读、写作、历史以及 21 世纪所需的所有基本技能。我们已经看到这种基础知识如何帮助人们从
    AI 中获得最大收益。此外，我们需要继续拥有受过教育的公民，而不是将所有的思考都委托给机器。学生可能还需要开始培养专注的注意力，选择一个他们自己作为专家能够更好地与
    AI 协作的领域。同时，我们的总能力范围将变得更广泛，因为 AI 会填补空白并帮助指导我们提高自己的技能。如果 AI 的能力不发生根本性变化，AI 很有可能真正成为我们的“共同智能”（co-intelligence），帮助我们填补知识的空白，并促使我们变得更好。但这并不是我们唯一需要考虑的未来。


    # 9 AI 是我们的未来


    这本书看起来似乎充满了科幻色彩，但我描述的一切已经发生过。我们创造了一个奇异的外星大脑，它虽然没有意识，但可以非常惊人地伪装出意识。它在人类知识的海量档案中接受训练，也是在低薪工人的劳动基础上被训练的。它可以通过测试并表现出创造性，具有改变我们工作和学习方式的潜力；但它也会经常编造信息。你无法再相信你看到的、听到的或读到的任何东西不是由
    AI 创建的。这一切已经发生了。人类——这些会走路会说话、装满水和微量化学物质的袋——成功说服了组织良好的沙子假装得像我们一样思考。


    接下来发生的是科幻小说——或者说是多个科幻小说，因为有很多可能的未来。我看到 AI 世界在未来几年内可能发生四种明确的可能性。然而，每种可能的影响尚不明确。我想向你们列出每种可能性，以及结果导致的世界可能的样子。


    让我们从最不可能的未来开始，令人不安的是，这个未来并不是 `AGI`（通用人工智能）的可能性。更不太可能是 AI 已经达到了它的极限，但我们将从这里开始。


    ## 场景 1：已达极致


    如果 AI 不再取得巨大的飞跃呢？当然，这里那里可能会有微小的改进，但在这种未来，这些改进与我们从 `GPT-3.5` 和 `GPT-4` 看到的巨大飞跃相比，是微乎其道的。你现在使用的
    AI 确实是你将使用过的最好的。


    从技术角度来看，这似乎是一个不现实的结果。没有理由怀疑我们在 AI 改进能力上遇到了任何种自然限制。这并不意味着 `LLMs` 将不可避免地一直变得聪明：研究人员已经发现了其底层架构和训练中许多可能的问题，这些问题可能会在某个时刻限制它们能达到的程度。例如，AI
    系统可能会用尽用于训练的数据；或者运行 AI 所需计算力的扩展成本和精力可能变得过大，不值得投入。但几乎没有证据表明已经达到了这些限制，即使达到了，也可以对
    `LLMs` 进行其他调整和更改，以在未来几年内从系统中压榨出更多性能。而且 `LLMs` 只是实现 AI 的一种方法；其他继代技术可能会克服这些限制。


    稍微可能的是一个监管或法律行动阻止了未来 AI 开发的世界。也许 AI 安全专家会说服政府禁止 AI 开发，并对任何胆于违反这些限制的人威胁使用武力。但考虑到大多数政府才开始考虑监管，而且缺乏国际共识，全球禁令在近期发生或监管让
    AI 开发停滞是极不可能的。


    尽管如此，这种场景似乎是大多数人和组织正在计划的。我理解这种否认。大多数人并没有要求一个可以完成以前留给人类任务的 AI。老师们不想看到几乎所有形式的作业都能被计算机解决。雇主不希望那些只有由人类执行才有意义的高薪任务（绩效评估、报告）由机器完成。政府官员不希望在没有任何有效应对措施的情况下发布一个完美的虚假信息系统。世界很快变得非常怪异。


    因此，许多人试图通过假假设什么都不会改变、永久禁止它，甚至想象 AI 带来的变化可以被轻易控制来应对 AI 的影响，这并不意外。正如我们所见，这些政策可能不起作用。更糟糕的是，试图假装它像以前的技术浪潮一样（变化需要几十年才会发生），会导致
    AI 的巨大收益大幅减少。


