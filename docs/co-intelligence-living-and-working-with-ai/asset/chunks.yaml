    你应该尝试邀请 AI 来帮助你所所做的一切，只要不涉及法律或伦理障碍。在实验过程中，你可能会发现 AI 的帮助有时让你很满意，有时让你沮丧，有时毫无用处，有时让你感到不安。但你这样做不仅仅是为了寻求帮助；熟悉
    AI 的能力能让你更好地理解它如何协助你——或者如何威胁你和你的工作。鉴于 AI 是一项通用技术（General Purpose Technology），没有任何单一的手册或说明书可以让你通过它理解它的价值和局限性。


    ### AI 的锯齿边界（The Jagged Frontier）


    让这件事变得更加复杂的是一种我和合著者称为“**AI 锯齿边界**”的现象。想象一座城墙，某些塔楼和防御墙向外延伸到乡村地区，而另一些则向城堡中心回缩。这道墙就是
    AI 的能力范围，距离中心越远，任务就越困难。墙内的一切都可以由 AI 完成；墙外的一切对 AI 来说都很困难。问题在于这道墙是隐形的，因此某些在逻辑上看起来距离中心等远、因此难度相当的任务——例如，写一首十四行诗和写恰好五十个字的诗——实际上处于这道墙的不同侧。AI
    非常擅长写十四行诗，但因为它是以标记元（tokens）而非单词来概念化世界的，它产生的诗字数往往多于于五十字。同样，某些意想不到的任务（如灵感激发）对 AI
    来说很容易，而另一些看起来机器很容易完成的任务（如基础数学）对 `LLMs` 来说却是挑战。要找出边界的形状，你需要进行实验。


    ### 个人层面的创新


    这种实验给了你一个机会，让你在某个你熟悉的任务中使用 AI 成为顶级专家。这种原因源于关于创新的基本真理：对于组织和公司来说创新是昂贵的，但对于执行工作的个人来说是廉价的。创新来自试错，这意味着一个试图推出新产品以帮助营销人员编写更具吸引力文案的组织，需要构建产品、在许多用户身上进行测试，并进行多次修改以做出可行的东西。然而，营销人员一直在编写文案，可以尝试许多不同的使用
    AI 帮助的方法，直到找到成功的方法为止。不需要雇佣团队或使用昂贵的软件开发周期。


    随着人工智能的普及，深入理解 AI 工具细微差别、局限性和能力的用户将处于独特地位，能够释放 AI 的全部创新潜力。这些用户型创新者往往是新产品和服务的突破性想法的来源。他们的创新也经常是意想不到创业想法的绝佳来源。那些发现如何让
    AI 为工作提供服务的员工将产生巨大影响。


    ### AI 作为思考伴侣


    AI 可以非常有用。不仅是为了工作任务（正如我们将在接下来的章节中讨论的那样），还因为异质的视角可能很有帮助。人类受到各种影响我们决策的偏见影响。但这些偏见中的许多源于我们被困在自己的脑海中。现在，我们有了另一个（奇异的、人工的）共同智能可以向它寻求帮助。AI
    可以作为我们的思考伴侣协助我们提高自己的决策能力，帮助我们反思自己的选择（而不是简单地依赖 AI 为我们做决定）。我们处于一个人类决策技能可以以新方式被轻松增强的世界。


    ### 克服现状偏见（Status Quo Bias）


    即使你嘲笑 AI 生成的文本可能具有说服力和激励性这种想法，但我发现确实如此。我在非常紧迫的时间内写了这本书，还承担着对家庭、学生、合作者和大学的其他责任。开始非常困难，但我知道阻碍我的一件事是现状偏见，即即使在可能可能有处时也避免改变的冲动。为了克服这种偏见，考虑你因不采取而失去什么会有帮助。AI
    在这方面表现得惊地好，正如当我这样提示它时所看到的：`我正考虑写一本关于生成式 AI 的书，但我非常忙，认为我想投入这么大的精力。你能将我没写书的失败重构为一种损失而不是一个默认选项吗？让这种表述变得生动一些。`


    > ![](img/page_51.jpg)在一个充满知识的世界里，你站在创新的边缘，手里拿着关于生成式 AI 的理解火炬。然而，当世界向你寻求启迪时，火炬却没有点燃。不是因为世界还没准备好，而是因为你让业务的私语熄灭了它的火焰。这不是世界的损失，而是你的损失。


    哎呀，我想我该把这本书写完了了。这种将失败重构为损失的方式非常棒，并暗示了我们开始使用 AI 的一种方法是探索如何从职业和个人两个方面帮助自己。AI 的优点和缺点可能并不反映你自身，而这是一种资产。这种思维和方法的多样性可以导致人类大脑可能永远不会的解决方案和想法。


    我们在摸清锯齿边界形状的同时，不仅是在学习 AI 的优点。我们还在寻找它的弱点。在日常任务中使用 AI 有助于增强我们对其能力和局限性的理解。在 AI 在我们的劳动力中继续发挥作用的世界里，这种知识是无价的。随着我们越来越熟悉
    `LLMs`，我们不仅可以更有效地利用它们的优点，还可以预判对我们工作的潜在威胁，为一个要求人类与人工智能无缝整合的未来做好准备。


    ### 风险与考虑


    AI 不是万灵药，在某些情况下它可能不会按预期工作，甚至可能产生不利的结果。一个潜在的担忧是你的数据隐私，这超出了与大公司共享数据的常规问题，涉及到对训练的深度担忧。当你将信息传递给
    AI 时，大多数 `LLMs` 不会直接从数据中学习，因为它们不是预训练的一部分，而预训练通常早已完成。然而，你上传的数据可能会用于未来的训练运行或微调你正在使用的模型。因此，虽然
    AI 训练你的数据不太可能复制你分享的精确细节，但并非不可能。几家大型 AI 公司已经通过提供保护你信息的隐私模式解决了这一担忧，其中某些模式符合健康数据的最高监管标准。


