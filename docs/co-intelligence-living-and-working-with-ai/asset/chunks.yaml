    没有人真正知道这一切将通向何方，包括我在内。然而，尽管没有确定的答案，我认为我可以成为一个有用的指南。我发现，自己在人工智能的影响方面是一个有影响力的声音，特别是通过我的通讯博客《有用的事》（*One
    Useful Thing*），尽管我本身并不是计算机科学家。事实上，我认为我理解 AI 的优势之一在于，作为沃顿商学院的教授，长期以来一直在研究并编写关于技术如何被*使用*的文章。因此，我和我的合著者们发表了一些关于教育和商业领域
    AI 的早期研究，并且我们一直在尝试 AI 的实际用途，这些方法已被许多主要的 AI 公司引用为案例。我经常与各个组织、公司、政府机构以及许多 AI 专家交流，以理解我们正在创造的世界。我也努力跟上该领域如潮水般的研究，其中大部分是以科学工作论文的形式存在的，它们尚未经过漫长的同行评审过程，但仍提供了关于这一新现象的宝贵数据（我将在书中引用大量的早期工作，以帮助完善我们正通向何处的图景，但重要的是意识到这个领域正在迅速演变）。基于所有这些对话和论文，我可以向你保证，没有任何拥有
    AI 意义的完整图景，甚至那些制造和使用这些系统的人也不理解它们的全部影响。


    因此，我想尝试带你领略 AI 作为世界上的一种新事物——一种协作智能，带有该术语所蕴含的所有模糊性。我们发明了从斧头到直升机的技术，增强了我们的体力能力；还有其他像电子表格那样可以自动处理复杂的任务；但我们从未构建过一种能够增强我们智力的通用型技术。现在，人类可以使用一种可以模拟我们思考和写作的工具，作为一种协作智能来改进（或取代）我们的工作。但许多开发
    AI 的公司正在进一步，希望创造出一种有感知能力的机器，一种真正的新协作智能形式，它将与我们在地球上共存。为了理解这意味着什么，我们需要从头开始，从一个非常基础的问题开始：什么是
    AI？


    所以我们将从这里开始，讨论大语言模型技术。这将为我们思考作为人类如何最好地与这些系统合作提供基础。之后，我们可以深入探讨 AI 如何通过作为同事、老师、专家甚至伴侣来改变我们的生活。最后，我们可以转向这对我们意味着什么，以及与外星大脑共同思考又意味着什么。


    # 第一部分


    ## 1. 创造外星大脑


    谈论 AI 可能会让人困惑，部分是因为 AI 意味着许多不同的含义，而且这些含义往往会混杂在一起。Siri 根据指令向你讲一个笑话。终结者粉碎头骨。算法预测信用分。


    长期以来，我们一直对会思考的机器深迷入迷。1770 年，第一台机械象棋电脑的发明让看到它的人大为惊奇——那是一个放置在精美柜子上的棋盘，棋子由一个装扮成奥斯曼巫师的机器人操纵。它在
    1770 年到 1838 年间巡游世界。这台机器也被称为`机械土耳人`（Mechanical Turk），在象棋对弈中击败了本·富兰克林和拿破仑，并让埃德加·爱伦·波在
    19 世纪 30 年代看到它后对人工智能的可能性推测。当然，这都是一个谎言——这台机器在虚假的齿轮内部巧妙地隐藏了一个真正的象棋大师，但我们相信机器可能思考的能力，欺骗了世界上许多顶尖的人才四分之三世纪。


    回到 1950 年，一个玩具和一个思想实验（分别由当时处于发展的计算机科学领域的两位不同天才开发）导致了对人工智能的新概念。那个玩具是一个名为`西西斯`（Theseus）的临时制成的机械鼠，由克劳德·香农（Claude
    Shannon）开发，他是一位发明家、恶剧作家和二十世纪伟大的信息理论学家。在 1950 年的一部电影中，他揭示了由电话交换机驱动的`西西斯`能够穿越复杂的迷宫——这是机器学习的首个真实例子。思想实验是`模仿游戏`（imitation
    game），计算机先驱艾兰·图灵在其中首次提出了关于机器如何发展出足以模仿人类的功能水平的理论。虽然计算机还是非常新的发明，但图灵那篇具有影响力的论文帮助了人工智能这一萌芽领域的开启。


    光有理论是不够的，一些早期的计算机科学家开始编写推向很快被称为“人工智能”边界的程序，这个术语是 1956 年由麻省理工学院的约翰·麦卡锡发明的。进展最初非常快，因为计算机被编程解决逻辑问题和下西洋跳棋——研究人员预计
    AI 将在十年内在象棋中击败特级大师。但炒作周期一直困扰着 AI，随着这些承诺未能实现，幻灭感随之而来，进入了许多“AI 冬季”之一，在这些期间 AI 进展停滞，资金枯竭。随后又出现了其他的繁荣与衰退周期，每一次繁荣都伴随着重大的技术进步，例如模仿人脑的人工神经网络，随后由于
    AI 无法实现预期目标而导致崩溃。


    最近一波 AI 热潮始于 20 10 年代，承诺使用机器学习技术进行数据分析和预测。这些许多应用使用了一种名为`监督学习`（supervised learning）的技术，这意味着这些形式的
    AI 需要标记数据来学习。标记数据是针对给定任务注释了正确答案或输出的数据。例如，如果你想训练一个 AI 系统识别面部，你需要为它提供已标记有图中人物姓名或身份的面部图像。AI
    的这一阶段是拥有海量数据的大型组织的领域。它们将这些工具作为强大的预测系统，无论是优化物流，还是根据你的浏览历史猜测向你展示什么内容。你可能听过用`大数据`或`算法决策`这些流行词来描述这类用途。消费者主要在这些技术集成到语音识别系统或翻译应用等工具中时看到机器学习的好处。AI
    是对这类软件行为的一个糟糕的（尽管对营销很友好）标签，因为这些系统中并没有多少东西看起来实际上是智能或灵敏的，至少在人类聪明或灵敏的方式上如此。


    为了看到这种 AI 工作的一个例子，请想象一家酒店仅凭现有数据和一个简单的 Excel 表格，尝试预测明年的需求。在预见性 AI 出现之前，酒店主通常被留在这里玩猜游戏，在预测需求的同时要与效率低下和资源浪费作斗争。有了这种形式的
    AI，他们反而可以输入大量数据——天气模式、当地活动和竞争对手定价——并生成准确得多的预测。结果是运营更高效，最终是业务更丰利。在机器学习和自然语言处理成为主流之前，组织关注的是平均意义上的正确——以今天的标准来看这种方法相当原始。随着
    AI 算法的引入，重点转向了统计分析和最小化差异。不再是平均水平正确，而是针对每个特定实例正确，这导致了更准确的预测，彻底改变了许多后台职能，从管理客户服务到帮助运行供应链。


    '
- fmt: '

    These predictive AI technologies may have found their ultimate expression at the
    retail giant Amazon, which deeply embraced this form of AI in the 2010s. At the
    heart of Amazon’s logistical prowess lies its AI algorithms, silently orchestrating
    every stage of the supply chain. Amazon integrated AI into forecasting demand,
    optimizing its warehouse layouts, and delivering its goods. It also intelligently
    organizes and rearranges shelves based on real-time demand data, ensuring that
    popular products are easily accessible for quick shipping. AI also powered Amazon’s
    `Kiva` robots, which transported shelves of products to warehouse workers, making
    the packing and shipping process more efficient. The robots themselves rely on
    other AI advances, including those in computer vision and automated driving.


    However, these types of AI systems were not without limitations. For instance,
    they struggled with predicting “unknown unknowns,” or situations that humans intuitively
    understand but machines do not. Additionally, they had difficulty with data they
    had not yet encountered through supervised learning, which posed challenges to
    their adaptability. And, most important, most AI models were also limited in their
    ability to understand and generate text in a coherent and context-aware manner.
    Thus, while these uses of AI are still important today, they were not something
    most people directly saw or noticed in their daily lives.


    But among the many papers on different forms of AI being published by industry
    and academic experts, one stood out, a paper with the catchy title “Attention
    Is All You Need.” Published by Google researchers in 2017, this paper introduced
    a significant shift in the world of AI, particularly in how computers understand
    and process human language. This paper proposed a new architecture, called the
    `Transformer`, that could be used to help a computer better process how humans
    communicate. Before the `Transformer`, other methods were used to teach computers
    to understand language, but they had limitations that severely curtailed their
    usefulness. The `Transformer` solved these issues by utilizing an “attention mechanism.”
    This technique allows the AI to concentrate on the most relevant parts of a text,
    making it easier for the AI to understand and work with language in a way that
    seemed more human.


    When reading, we know that the last word we read in a sentence is not always the
    most important one, but machines struggled with this concept. The result was awkward-sounding
    sentences that were clearly computer generated. TALKING ABOUT HOW ALGORITHMS SILENTLY
    ORCHESTRATING EVERY ITEM is how a `Markov chain` generator, an early form of text
    generation AI, wanted to continue this paragraph. Early text generators relied
    on selecting words according to basic rules, rather than reading context clues,
    which is why the iPhone keyboard would show so many bad autocomplete suggestions.
    Solving the problem of understanding language was very complex, as there were
    many words that could be combined in many ways, making a formulaic statistical
    approach impossible. The attention mechanism helps solve this problem by allowing
    the AI model to weigh the importance of different words or phrases in a block
    of text. By focusing on the most relevant parts of the text, `Transformers` can
    produce more context-aware and coherent writing compared to earlier predictive
    AIs. Building on the strides of the `Transformer` architecture, we now find ourselves
    in an era when AI, like me, can generate contextually rich content, showcasing
    the remarkable evolution of machine comprehension and expression. (And, yes, that
    last sentence was AI-produced text—a big difference from the Markov chain`!)


    These new types of AI, called Large Language Models (`LLMs`), are still doing
    prediction, but rather than predicting the demand for an Amazon order, they are
    analyzing a piece of text and predicting the next token, which is simply a word
    or part of a word. Ultimately, that is all `ChatGPT` does technically—act as a
    very elaborate autocomplete like you have on your phone. You give it some initial
    text, and it keeps writing text based on what it statistically calculates as the
    most likely next token in the sequence. If you type “Finish this sentence: I think,
    therefore I . . . ,” the AI will predict the next word will be `am every time,
    because it is incredibly probable that this is the case. If you type something
    weirder, like “The Martian ate the banana because,” you will get different answers
    every time: “it was the only familiar food available in the spacecraft’s pantry,”
    “it was a new and interesting food that he had never tried before and he wanted
    to experience the taste and texture of this Earthly fruit,” or “it was part of
    an experiment to test the suitability of Earth’s food for consumption on Mars.”
    This is because there are many more possible answers for the second half of the
    sentence, and most `LLMs` add a little randomness to their answers, which ensures
    slightly different results each time you ask them a question.


    To teach AI how to understand and generate humanlike writing, it is trained on
    a massive amount of text from various sources, such as websites, books, and other
    digital documents. This is called pretraining, and unlike earlier forms of AI,
    it is unsupervised, which means the AI doesn’t need carefully labeled data. Instead,
    by analyzing these examples, AI learns to recognize patterns, structures, and
    context in human language. Remarkably, with a vast number of adjustable parameters
    (called `weights`), `LLMs` can create a model that emulates how humans communicate
    through written text. `Weights` are complex mathematical transformations that
    `LLMs` learn from reading those billions of words, and they tell the AI how likely
    different words or parts of words are to appear together or in a certain order.
    The original `ChatGPT` had 175 billion weights, encoding the connection between
    words and parts of words. No one programmed these weights; instead, they are learned
    by the AI itself during its training.


    Imagine an `LLM` as a diligent apprentice chef who aspires to become a master
    chef. To learn the culinary arts, the apprentice starts by reading and studying
    a vast collection of recipes from around the world. Each recipe represents a piece
    of text, with various ingredients symbolizing words and phrases. The apprentice’s
    goal is to understand how to combine different ingredients (words) to create a
    delicious dish (coherent text).


    The apprentice chef begins with a chaotic, disorganized pantry, representing the
    175 billion weights. Initially, these weights have random values and do not yet
    contain any useful information about how words are related. To build their knowledge
    and refine the spice rack, the apprentice chef goes through a process of trial
    and error, learning from the recipes they have studied. It finds that certain
    flavors are more common and go better together—like apples and cinnamon—and certain
    flavors are rare because they should be avoided—like apples and cumin. During
    training, the apprentice chef attempts to re-create the dishes from the recipes
    using their current pantry. After each attempt, the apprentice compares their
    creation to the original recipe and identifies any mistakes or discrepancies.
    The apprentice then reconsiders the ingredients in the pantry, refining the connections
    between flavors to better understand how likely they are to be used together or
    in a particular sequence.

