    # Introduction


    ## THREE SLEEPLESS NIGHTS


    After a few hours, it was clear that something huge had shifted. Four days after
    the AI was launched, I decided to demonstrate this new tool to my undergraduate
    entrepreneurship class. Frankly anyone had heard of it. In front of my students,
    I put on a show, demonstrating how AI can help generate ideas, write business
    plans, turn those business plans into poems (not that there is a lot demand for
    that), and generally fill the role of cofounder. By the end of the class, one
    of my students, Kirill Naum, had created a working demo for his entrepreneurship
    project—a Harry Potter–inspired moving frame that reacted to people walking near
    it—using a code library he had never used, in less than half the time it would
    have taken. He had venture capital scouts reaching out to him by the end of the
    next day.


    Within two days of introducing students to AI, several told me they used ChatGPT
    to explain confusing concepts to them “like they were ten years old.” They stopped
    raising their hands as much—why expose themselves in class when they could just
    ask the AI later? And every essay was suddenly written with perfect grammar (though
    references were often wrong and the final paragraph tended to start with “In conclusion”—a
    telltale sign of early ChatGPT writing).


    But the students weren’t just excited, they were nervous. They wanted to know
    the future.


    Some of them asked me what it means for their preferred careers (“Should I become
    a radiologist if AI can do a lot of the work?” “Will writing marketing copy still
    be a good job five years from now?”). Others asked when this technological development
    would stop, or if it would stop. Someone even asked if Artificial General Intelligence
    (AGI), the hypothetical machine that would be smarter than a human, might arrive
    before graduation.


    I didn’t have any answers then (though I have a few more now), yet I recognized
    that I wasn’t immune to these changes. So I decided to get hands-on and put the
    AI through its paces. Much of my work over the past five years has been building
    simulations that teach business skills. It has taken tremendous investment from
    my university, and the efforts of a dozen talented people, to build these elaborate
    digital experiences. After thousands of hours, the games were great: using thousands
    of lines of code, we could do elaborate learning simulations that helped teach
    skills like negotiation. But I am not a computer scientist, I am an academic studying
    innovation who has long been involved. For decades, AI research has always promised
    more than it has delivered. During this time, AI applications, from self-driving
    cars to personalized tutoring, always seemed to be on the edge. So my sleepless
    nights came early, just after the release of ChatGPT in November 2022.

