  trans: '


    融入更多主动学习的一种解决方案是采用“翻转课堂”。学生在家里学习新概念（通常通过视频或其他数字资源），然后在教室里通过协作活动、讨论或解决问题的练习来应用他们所学到的知识。翻转课堂的核心理念是将课堂时间最大化，以用于主动学习和批判性思维，而将课外学习用于内容传递。翻转课堂的价值似乎参不齐，最终取决于它们是否鼓励了主动学习。


    因此，实施主动学习的困难在于缺乏优质资源，从教师的时间到寻找良好“翻转式”学习材料的难度，这导致了主动学习仍然很罕见的现状。这正是 AI 作为伙伴而非替代者登场的地方，因为人类教师可以进行事实核查，并以有助于其课堂的方式引导
    AI。AI 系统可以帮助教师生成定制的主动学习体验，让课堂变得更有趣，从游戏和活动到评估和模拟比一有许多。例如，历史学教授本杰明·布林（Benjamin Breen）使用
    `ChatGPT` 创建了一个黑死病模拟器，学生在模拟器中获得的比标准教科书更能沉浸式体验在瘟疫时期生活的感受。他的学生通常很喜欢这项作业，但也做了一些令他惊讶的事情，利用
    AI 的灵活性领导了农民起义或开发了第一种瘟疫疫苗。在 AI 出现之前，很难想象能持续获得这类教育体验。


    但 AI 允许对我们的学习方式进行更根本的改变，而不仅仅提供课堂活动。想象一下在翻转课堂模式中引入高质量的 AI 导师。这些由 AI 驱动的系统具有显著增强学生学习体验的潜力，让翻转课堂更加有效。它们提供了个性化学习，AI
    导师根据每个学生的独特需求定制教学方案，同时根据表现不断调整内容。这意味着学生可以在家里更有效地与内容接触，确保他们来到教室时准备更充分，准备好投入到实践活动或讨论中。


    随着 AI 导师负责课外的一些内容传递，教师可以在课堂上投入更多时间，与学生建立有意义的互动。他们还可以利用 AI 导师提供的见解识别学生可能需要额外支持或指导的领域，使教师能够提供更个性化、更有效的教学。在
    AI 的帮助下，他们可以在课堂上设计更好的主动学习机会，以确保学习效果巩固。


    这不是遥远的梦想。来自可汗学院（Khan Academy）的工具（以及我们自己实验）表明，现有的 AI 只要准备得当，已经是一个优秀的导师。可汗学院的 `Khanmigo`
    超越了让可汗学院闻名的被动视频和测试，它包含了 AI 辅导。学生当然可以要求导师解释概念，但它还能分析表现模式，以猜测学生为何在某个主题上遇到困难，提供更深层次的帮助。它甚至可以回答那个最具挑战性的问题：“我为什么要花精力学这个？”通过解释像细胞呼吸这样的课题如何与想成为足球运动员的学生相关（AI
    的观点是：这将帮助他们理解营养，从而提高运动表现）。


    学生已经在将 AI 用作学习工具。教师已经在使用 AI 准备课程了。变化已经来临，我们迟早都会遇到它。它可能会迫使我们改变模式，但这种方式最终将增强学习并减少琐事工作。而且，最令人兴奋的是，这种变化可能是全球性的。教育是增加收入甚至智力的关键。但世界上二之二的青少年缺失了基础技能，因为学校系统未能顾及他们。但
    AI 改变了一切：我们正处于一个时代的边缘，AI 将改变我们教育的方式——唯一的问题是，我们是否以这种方式引导转变，以符合扩大机会和培养潜力的理想。


    ## AI 成为教练


    AI 给我们的教育系统带来的最大危险不是它对作业的破坏，而是它对教育之后隐藏的学徒制体系的破坏。对于大多数职业工作者来说，离开学校进入职场标志着他们实践教育的开始，而非结束。教育之后是多年的在职培训，范围涵盖从有组织的培训计划到几年的熬夜和愤怒的老板。这个系统并不是像我们教育系统的某些部分那样以集中的方式设计的，但它对我们如何学会做真实工作至关重要。


    人们传统上是从基层开始获得专业知识的。木工学徒、杂志实习生、住院医生。这些通常是很糟糕的工作，但它们有意义。只有通过向该领域更有经验的专家学习，并在他们的指导下尝试并失败，业余才能变成专家。但这可能会随着
    AI 发生迅速变化。无论实习生或第一年律师喜不喜欢因为做得不好而被被大斥，他们的老板通常更愿意看到工作快速完成，而不是处理真实人类的情绪和错误。因此，他们会使用
    AI 自己完成，AI 在许多任务上尚未等同于资深专业人员，但通常比新培训生好。这可能会造成重大的培训缺口。


    事实上，在加州圣地芭拉分校研究机器人学的马修·比恩（Matthew Beane）教授表明，这种情况已经在外科医生中发生了。医疗机器人已经在医院里使用了十多年，在医生旁边使用类似游戏的控制器操作它们时帮助进行手术。虽然关于手术机器的数据参差不齐，它们在许多情况下似乎很有帮助。它们也为培训带来了巨大的问题。


