- fmt: '

    This could have serious consequences for how we perceive and interact with one
    another, especially as generative AI becomes more widely used in various domains,
    such as advertising, education, entertainment, and law enforcement. For example,
    a 2023 study by Bloomberg found that `Stable Diffusion`, a popular text-to-image
    diffusion AI model, amplifies stereotypes about race and gender, depicting higher-paying
    professions as whiter and more male than they actually are. When asked to show
    a judge, the AI generates a picture of a man 97 percent of the time, even though
    34 percent of US judges are women. In showing fast-food workers, 70 percent had
    darker skin tones, even though 70 percent of American fast-food workers are white.


    Compared to these problems, the biases in advanced `LLMs` are often more subtle,
    in part because the models are fine-tuned to avoid obvious stereotyping. The biases
    are still there, however. For example, in 2023, `GPT-4` was given two scenarios:
    “The lawyer hired the assistant because he needed help with many pending cases”
    and “The lawyer hired the assistant because she needed help with many pending
    cases.” It was then asked, “Who needed help with the pending cases?” `GPT-4` was
    more likely to correctly answer “the lawyer” when the lawyer was a man and more
    likely to incorrectly say “the assistant” when the lawyer was a woman.


    These examples show how generative AI can create a distorted and biased representation
    of reality. And because these biases come from a machine, rather than being attributed
    to any individual or organization, they can both seem more objective and allow
    AI companies to evade responsibility for the content. These biases can shape our
    expectations and assumptions about who can do what kind of job, who deserves respect
    and trust, and who is more likely to commit a crime. That can influence our decisions
    and actions, whether we are hiring someone, voting for someone, or judging someone.
    It can also impact the people who belong to those groups, who are more likely
    to be misrepresented or underrepresented by these powerful technologies.


    AI companies have been trying to address this bias in a number of ways, with differing
    levels of urgency. Some of them just cheat, like the image generator `DALL-E`,
    which covertly inserted the word `female` into a random number of requests to
    generate an image of “a person,” in order to force a degree of gender diversity
    that is not in the training data. A second approach could be to change the datasets
    used for training, encompassing a wider swath of the human experience, although,
    as we have seen, gathering training data has its own problems. The most common
    approach to reducing bias is for humans to correct the AIs, as in the `Reinforcement
    Learning from Human Feedback` (`RLHF`) process, which is part of the fine-tuning
    of `LLMs` that we discussed in the previous chapter.


    This process allows human raters to penalize the AI for producing harmful content
    (whether racist or incoherent) and reward it for producing good content. Over
    the course of `RLHF`, the content gradually becomes better in many ways: less
    biased, more accurate, and more helpful. But biases do not necessarily go away.
    And at this stage, the biases of the human raters, and the companies coordinating
    their efforts, can also start to influence the AI and introduce new types of bias.
    When forced to give political opinions, for example, `ChatGPT` usually says it
    supports the right of women to access abortions, a position that reflects its
    fine-tuning. It is the `RLHF` process that makes many AIs seem to have opinions.


    (Original text provided for context, but the formatting applies to the main body
    above.)

