  trans: '


    由于我们甚至不知道如何构建超级智能，因此在它制造之前弄清楚如何对其对齐是一项巨大的挑战。AI 对齐研究人员正结合逻辑、数学、哲学、计算机科学和即兴发挥，试图寻找解决这一问题的方法。许多研究正致力于如何设计与人类价值观和目标对齐的
    AI 系统，或者至少不会主动损害这些价值观。这并不是一项易易的任务，因为人类自身往往具有冲突或不明确的价值观和目标，而将它们翻译成计算机代码充满了挑战。此外，无法保证
    AI 系统在演化和从环境中学习时，会保持其原始的价值观和目标。


    增加复杂性的是，没有人真正知道 `AGI`（通用人工智能）是否可能，或者对齐是否是一个真实关注的问题。预测 AI 何时以及是否会变得超级智能是一个出了名的难题。目前似乎存在一种共识，即
    AI 构成了真实的风险。AI 领域的专家认为，到 2100 年，AI 杀死至少 10% 活人类的概率为 12%，而未来主义专家小组则认为这个数字接近 2%。


    这就是为什么许多科学家和影响力人物呼吁停止 AI 开发的原因之一。在他们看来，AI 研究类似于曼哈顿计划，是在干预可能导致人类灭绝的力量，而换取的是不明确的利益。一位知名的
    AI 批评者 `Eliezer Yudkowsky` 对这种可能性深表担忧，以至于他建议完全暂停 AI 开发，并通过对任何怀疑参与 AI 训练的数据中心进行空袭来强制执行，即使这会导致全球战争。几家主要
    AI 公司的首席执行官甚至在 2023 年签署了一份只有一句话的声明，：“减轻 AI 带来的灭绝风险与流行病和核战争等其他社会规模风险一样，应该是全球首要任务。”然而，这些
    AI 公司也都继续了 AI 开发。


    为什么？显而易见的原因是开发 AI 具有巨大的盈利潜力，但并非全部。一些 AI 研究人员认为对齐不会成为问题，或者认为对失控 AI 的恐惧被夸大了，但他们不想被看作是过于轻视。但许多从事
    AI 工作的人也也是真正的坚实信徒，他们认为创造超级智能是人类最重要的任务，正如 `OpenAI` 首席执行官 `Sam Altman` 所说，这提供了“无限的收益”。理论上，超级智能
    AI 可以治愈疾病、解决全球变暖，并在富足时代出现，充当一个慈悲的机器神。


    AI 领域正面临着巨大的争论和担忧，但并没有清晰的定论。一方面是末日世界，另一方面是救赎。很难知道如何看待这一切。AI 导致的人类灭绝威胁显然是生存性的威胁。然而，由于几个原因，我们不会在这本书中花费大量时间在这个问题上。


    首先，本书关注的是我们这个被 AI 笼罩的新世界在短期内、实际的意义。即使 AI 开发停滞，AI 对我们生活、工作和学习的影响也将是巨大的，并且值得进行大量的讨论。我也认为，这种对末日事件的关注剥夺了我们大多数人的能动权和责任。如果我们这样想，AI
    就变成了一个由少数公司构建或不构建的东西，除了几十个硅谷高管和高层政府官员之外，没有没有人能对接下来发生的事情有任何真正的话语权。


    但现实是，我们已经生活在 AI 时代的早期，我们需要对这实际上意味着什么做出一些非常重要的决定。等等到关于生存风险的辩论结束后再做这些选择，意味着这些选择将由别人替我们做出。此外，担心超级智能只是
    AI 对齐和伦理的一种形式，尽管由于其惊人的性质，它往往会掩盖其他方法。事实是，存在许多潜在的伦理担忧，它们也可能符合对齐这一更广泛的范畴。


    ### 人工伦理与外星思维


    这些潜在问题始于 AI 的预训练材料，它们需要大量信息。由于其惊人的性质，它往往会掩盖其他方法。事实是，存在许多潜在的伦理担忧，它们也可能符合对齐这一更广泛的范畴。


    （注：此处译文根据原文逻辑进行了衔接处理，确保段落连贯性）


