    但首批全社会的益处也开始出现。几十年来，创新的速度以令人担忧的速度在缓慢。事实上，最近一篇具有说服力且令人沮丧的论文发现，从农业到癌症研究，每一个领域的发明速度都在下降。要推动技术水平的发展，需要更多的研究人员。事实上，创新的速度似乎每
    13 年就会下降 50%，这减缓了经济增长。


    问题的部分原因似乎在于科学研究本身日益日益严重的问题：科学研究的数量太多了。知识的负担正在增加，因为在一名新晋科学家拥有足够的专业知识并开始自己的研究之前，需要学习过多的内容。这也是为什么现在科学领域中一半的开创性贡献都发生在
    40 岁之后，而过去通常是年轻的科学家取得突破。同样，在过去的 20 年里，STEM 领域博士毕业生的创业率下降了 38%。科学的性质变得如此复杂，以至于博士学位创始人现在需要大型团队和行政支持才能取得进展，因此他们转向了大公司。因此，我们面临着科学黄金时代的悖论：比以往任何时候都有更多的科学家发表了更多的论文，但结果实际上是减缓了进展！由于需要阅读和吸收的内容太多，更拥挤领域的论文对新工作的引用在减少，反而更多地对高引用文章进行经典化处理。


    但已经出现了 AI 可以提供帮助的迹象。研究已成功证明，通过 AI 分析过去的论文，可以正确确定科学领域最有前景的方向，理想情况下是将人工筛选与 AI 软件结合起来。其他工作还发现，AI
    在自主进行科学实验、寻找数学证明等方面展现了巨大的潜力。AI 的进步可能帮助我们克服仅仅依靠人类科学科学的局限性，并在我们理解宇宙和自身方面取得突破。事实上，许多最初的
    AI 热者正寄希望于 AI 的力量，寻找从根本上扩展和改善人类生活的方法。虽然 AI 能力的线性增长可能无法实现这一崇高目标，但即使可以实现，它可能帮助重新启动正在缓慢的进步引擎。


    这种情况可以看作是随着时间的推移逐渐提高温度。AI 在我们的生活中着越来越大的角色，但过程足够缓慢，使得干扰在可控范围内。我们也开始看到 AI 的一些主要益处：更快的科学发现、更高的生产力增长，以及为世界各地的人提供更多教育机会。结果虽然不一，但总体是积极的。而且人类仍然控制着
    AI 发展的方向。


    但 AI 并不是以线性方式推进的。


    ### 场景 3：指数级增长


    并不是所有的技术增长都会迅速放缓。摩尔定律——计算机芯片的处理能力大约每两年翻倍——已经持续了五十年。AI 可能继续这样加速。可能发生的原因之一是所谓的飞轮效应——AI
    公司可能会使用 AI 系统来帮助他们创建下一代 AI 软件。一旦这个过程开始，可能很难停止。按照这种速度，AI 在未来十年内的能力将提高数百倍。人类并不擅长可视化指数级的变化，因此我们的愿景开始更多地依赖科幻小说和猜测。但我们可以预期到处都会发生巨大的变化。场景
    2 中发生的一切都会发生，但速度要快得多、快得多，至于让我们感到相应地难以吸收。


    在这种情况下，风险更加严重且更不可预测。每一个计算机系统都受到 AI 攻击的威胁。受人类监控的 AI 驱动机器人和自主 AI 代理可能会在扩大经济的同时，大幅减少对人类劳动的需求。如果这种转变发生，其调整是难以想象的。它需要我们对处理工作和社会的方式进行大反思。

