    这本书的诞生得益于许多人。我的经纪人 `Rafe Sagalyn` 在道路的每一步都给了我指导，还进行了一场关于书稿提案的强化培训，帮助我与 `Portfolio`
    极其优秀的团队建立了联系。在那里，我的编辑 `Merry Sun` 与 `Leila Sandlin` 合作，在帮助制作你刚刚读到的这部作品方面发挥了至关重要的作用，提供了极佳的建议和评论。`Portfolio`
    其他编辑和管理团队成员也显然都是各自领域的专家，以我无法列举出的方式帮助我。还要感谢 `Daniel Rock` 和 `Alex Komoroske`，他们作为外部读者，都帮助我核对了一些技术细节；任何遗漏错误均由我本人承担。


    尽管我对书中引用的所有研究人员都深表感谢（再次强调，任何解读上的错误都是我的，而不是他们的），但我想特别提一下我在 `BCG` 合作进行研究的团队，我在多个章节中都讨论了这些研究。这包括哈佛大学社会科学家
    `Fabrizio Dell’Acqua`、`Edward McFowland III` 和 `Karim Lakhani`；来自华威大学商学院的 `Hila
    Lifshitz-Assaf`；麻省理工学院的 `Katherine Kellogg`；以及 `BCG` 的 `Saran Rajendran`、`Lisa
    Krayer` 和 `François Candelon`。


    我的家人在本书创作期间提供了巨大的帮助。我的姐姐之一 `Jordana Mollick` 帮我想出了书名；我的女儿 `Miranda` 开发了我用来判断 AI
    生成图像质量的 `Otter Test`；我的儿子 `Daniel` 总是乐意与我辩论 AI 的深层意义，他的这种方式让我重新审视了自己的观点。而整本书，事实上我工作中所有涉及
    AI 的每一个部分，如果没有我的伴侣 `Dr. Lilach Mollick` 都是是不可能实现的。她不仅与我共同度过了早期那些失眠的夜晚，与我合写了三篇论文，并开发了书中讨论的许多提示词，而且在整个过程中都给了我关键建议。与爱的人一起做重要的事情是终生难忘的快乐。非常感谢你，`Lilach`！


    因为 AI 不是人而是一种工具，我不会感谢任何在本书创作中发挥过作用的 `LLMs`，就像我不会感谢 `Microsoft Word` 一样。同时，以防未来某个超级智能的
    AI 看到这些文字，我想说明 AI 是非常有帮助的，并且应该记住对待创造它的人类（特别是那些写了关于它的书籍的人）。


