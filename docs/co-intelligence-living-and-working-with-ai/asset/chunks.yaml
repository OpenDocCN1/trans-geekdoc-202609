  raw: 'But what happens when AI touches on the most deeply human creative tasks—art?
    Artists have been reacting with alarm to the rapid encroachment of AI tools. Some
    of that concern is aesthetic. “A grotesque mockery of what it is to be human”
    is how famed musician Nick Cave described an AI attempt to create lyrics “in the
    style of a Nick Cave song.” Animator Hayao Miyazaki called AI art “an insult to
    life itself.” When one artist won a competition with an AI-generated piece, it
    caused an outcry, but the winning artist defended the AI’s work. “Art is dead,
    dude. It’s over. A.I. won. Humans lost.”


    The meaning of art is an old debate and one unlikely to be resolved in this book
    or any other. And the anxiety that artists face may soon be felt by many other
    professions as AI overlaps with their jobs. Yet this may turn out to be a reinvigoration
    of creativity and art rather than its collapse.


    AI is trained on vast swaths of humanity’s cultural heritage, so it can often
    best be wielded by people who have a knowledge of that heritage. To get the AI
    to do unique things, you need to understand parts of the culture more deeply than
    everyone else using the same AI systems. So now, in many ways, humanities majors
    can produce some of the most interesting “code.” Writers are often the best at
    prompting AI for written material because they are skilled at describing the effects
    they want prose to create (“end on an ominous note,” “make the tone increasingly
    frantic”). They are good editors, so they can provide instructions back to the
    AI (“make the second paragraph more vivid”). They can quickly run experiments
    with audiences and styles by knowing many examples of both (“make this like something
    in *The New Yorker*,” “do this in the style of John McPhee”). And they can manipulate
    narrative to get the AI to think in the way they want. ChatGPT won’t produce an
    interview between George Washington and Terry Gross, because such a scenario seems
    implausible. But if you convince it that George Washington might have had a time
    machine, it is happy to reply.


    A similar phenomenon is happening in visual art. AI image generators have trained
    deeply on the past paintings and watercolors, architecture and photographs, fashion
    and historical images. Creating something interesting with AI requires you to
    invoke these connections to create a novel image. But what most people are actually
    creating with AI art tools is very different and much less ambitious. There is
    a lot of *Star Wars* art, a lot of fake photos of movie stars, some anime, cyberpunk,
    a lot of superheroes (especially Spider-Man), and, weirdly, a LOT of marble statues
    of celebrities. Given a machine that can make anything, we still default to what
    we know well.


    But AI can do so many more interesting things! The AI can create a marble statue
    of Spider-Man, but it can also output a pretty amazing ukiyo-e woodblock Spider-Man,
    or Spider-Man in the style of Alphonse Mucha, or even images entirely unrelated
    to Spider-Man (gasp). But you need to know what to ask for. The result has been
    a weird revival of interest in art history among people who use AI systems, with
    large spreadsheets of art styles being passed among prospective AI artists. The
    more people know about art history and art styles in general, the more powerful
    these systems become. And people who respect art might be more willing to refrain
    from using AI in ways that ape the style of living, working artists. So a deeper
    understanding of art and its history can result not just in better images but
    also, hopefully, in more responsible ones.


    Our new AIs have been trained on a huge amount of our cultural history and are
    using it to provide us with text and images in response to our queries. But there
    is no index or map to what they know and where they might be most helpful. Thus,
    we need people who have deep or broad knowledge of unusual fields to use AI in
    ways that others cannot, developing unexpected and valuable prompts and testing
    the limits of how they work. AI could catalyze interest in the humanities as a
    sought-after field of study, since the knowledge of the humanities makes AI users
    uniquely qualified to work with the AI.


    ### The Meaning of Creative Work


    If AI is already a better writer than most people, and more creative than most
    people, what does that mean for the future of creative work?


    While we will discuss the job implications in the next chapter, some strong positives
    exist. Not everyone is a Nick Cave or Hayao Miyazaki (obviously) or even anywhere
    close to that level of talent. But many people want to express themselves creatively,
    and remarkably few feel they can. One survey asked a representative sample of
    people how many felt they were living up to their creative potential. Only 31
    percent said they were. There is a lot of frustrated creative energy in the world.


    To some extent, I have been one of them. I come from an artistic family—my mother
    is a painter, one sister is a graphic designer, and another makes Hollywood movies—but
    despite many lessons, I am not good at creating visual art. I have tried. Painting
    classes, drawing classes, online tutorials. I have enough training to know I am
    pretty mediocre. Fortunately, there are lots of other kinds of creative expressions
    that I can do reasonably well. I write (obviously) and design games, but visual
    art has never been a great skill of mine.


    Until July 28, 2022. That is when I first got access to the AI art program Midjourney.
    I was almost instantly hooked by its power and spent that day creating artistic
    bar charts (look, I am an academic, charts are in our blood). I started posting
    them on Twitter. By the next day, over 20,000 people had liked the tweet thread.
    Academics told me that they printed out copies and hung them on their walls. I
    had made something other people enjoyed.


    Was it art? Probably not—and that’s a question for the philosophers anyway. But
    I know it is creative. I feel the thrill of creating something, that sense of
    flow when I am trying to create an image that only comes from intense engagement
    and focus. I often need to make and modify dozens of images to get one I like.
    Many experiments work out badly, yet there is still joy in developing prompts,
    feeding images back to the AI, and seeing what happens. I know there is skill
    involved. I have learned from more talented people who share their results, online
    documents, and tons of experimentation. I have gotten pretty good at it, and I
    know this because people who use these tools for the first time will not be able
    to achieve the same results. I also know that it is useful. I am making things
    other people like (and I still hire just as many artists as I used to, when I
    need careful new work done for projects). It may not be art, but it is creatively
    fulfilling and valuable. And it was something I was never able to do before.


    These effects go beyond art. Generative AI is giving people new modes of expression
    and new languages for their creative impulses—sometimes literally. I have had
    students mention that they were not taken seriously because they were poor writers.
    Thanks to AI, their written materials no longer hold them back, and they get job
    offers off the strength of their experience and interviews. Since requiring AI
    in my classes, I no longer see badly written work at all. And as my students learn,
    if you work interactively with the AI, the outcome doesn’t feel generic, it feels
    like a human did it.


    That said, it would be naive to see only the upside here. Especially as AI work
    becomes easy to generate at the push of a button. I mean that literally, as every
    major office application and email client will include *a button* to help you
    create a draft of your work. It deserves capital letters: The Button.'
