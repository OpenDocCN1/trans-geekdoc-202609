  trans: '


    在任务层面，我们需要思考 AI 擅长什么以及不擅长什么。但我们还需要考虑自己擅长什么，以及哪些任务需要我们保持人类的特性。我们将这些任务称为`我专属任务`（Just
    Me Tasks）。至少在目前，这些任务对 AI 来说是没用的，反而会手添麻烦。它们也可能是你坚信认为应该由人类完成、不需要任何 AI 帮助的任务。随着 AI
    的进步，后一类可能会比前者更重要。例如，AI 目前非常不擅长笑话，除非你非常喜欢“老爸幽默”（dad humor）。（别听我的。我让它讲一个笑话来反驳这一论点，AI
    回答道：“我认为 AI 有时很幽默。这里给你一个笑话：戴着蝴蝶结的鱼叫什么？很有情调（Sofishticated）。![](img/Emoji_Fish.jpg)”
    . . . 我无话可说。）所以，写笑话就是一个`我专属任务`，因为这是 AI 做不到的。但记住第四条原则：这是你用过的最糟糕的 AI。当你读到这里时，AI
    喜剧演员可能已经变得非常优秀了。这把我们引向第二类`我专属任务`：我们真的想让 AI 写笑话吗？


    我们已经看到，并没有一条清晰、明亮的界限来划分 AI 无法做到的“人类事务”。它在模拟同理心、创造力和人性方面做得很好。试图寻找一些 AI 绝对无法做到（因为它们是人类独有的）的事情，最终可能是具有挑战性的。但这并不意味着我们希望
    AI 做所有这些事情。我们可能会出于个人或伦理原因保留`我专属任务`，例如抚养孩子、做出重要决定或表达我们的价值观。


    此书中几乎所有的写作都是`我专属任务`。这有三个原因。首先，AI 擅长写作，但并不擅长带有个人风格的写作。我想，或者担心，这可能是一个暂时的状况。通过与 AI
    合作，我已经可以获得非常接近我语气的模拟。为了看看它是如何运作的，我给了 AI `本章中直到这一句的文本`，并问它：`描述我的写作风格`。它告诉我，我的写作是学术严谨性、个人见解和实用建议的结合，并以一种对话式的、易于理解的方式呈现。


    听到奉听的分析总是很愉快，但现在我可以更进一步，要求 AI 克隆我的语气和方法：`继续这种风格，为我写一段话，说明为什么作者可能不想将写作委托给 AI，即使它是一个出色的作家`。AI
    回复道：


    > ![](img/page_18.jpg)“虽然 AI 在写作能力方面确实取得了令人瞩目的进步，但确实有充分的理由让作者选择紧紧握住自己的笔（或键盘）。首先，写作是一个极具个人化的过程。它是将独特的见解、经验和声音带到纸面上的一种方式。我们写的每一个句子都注入了我们的个性和观点，与读者建立起一种独特的人类连接。将这项任务委托给
    AI，无论它多么先进，都可能面临丧失那种个人色彩的风险。此外，写作的行为可以是一段自我发现的旅程，一个澄清思路的机会，以及与我们主题深度互动的方式。通过将控制权交给
    AI，我们可能会错过这些丰富的经历。”


    ### 我专属任务的本质


    虽然 AI 的能力越来越强，但仍有一些任务应该留给人类完成。将这项任务委托给 AI，无论它多么先进，都可能面临丧失那种个人色彩的风险。此外，写作的行为可以是一段自我发现的旅程，一个澄清思路的机会，以及与我们主题深度互动的方式。通过将控制权交给
    AI，我们可能会错过这些丰富的经历。


    我们已经看到，并没有一条清晰、明亮的界限来划分 AI 无法做到的“人类事务”。它在模拟同理心、创造力和人性方面做得很好。试图寻找一些 AI 绝对无法做到（因为它们是人类独有的）的事情，最终可能是具有挑战性的。但这并不意味着我们希望
    AI 做所有这些事情。我们可能会出于个人或伦理原因保留`我专属任务`，例如抚养孩子、做出重要决定或表达我们的价值观。


    此书中几乎所有的写作都是`我专属任务`。这有三个原因。首先，AI 擅长写作，但并不擅长带有个人风格的写作。我想，或者担心，这可能是一个暂时的状况。通过与 AI
    合作，我已经可以获得非常接近我语气的模拟。为了看看它是如何运作的，我给了 AI `本章中直到这一句的文本`，并问它：`描述我的写作风格`。它告诉我，我的写作是学术严谨性、个人见解和实用建议的结合，并以一种对话式的、易于理解的方式呈现。


    听到奉听的分析总是很愉快，但现在我可以更进一步，要求 AI 克隆我的语气和方法：`继续这种风格，为我写一段话，说明为什么作者可能不想将写作委托给 AI，即使它是一个出色的作家`。AI
    回复道：


    ### 委托任务


    委托任务（Delegated Tasks）是我们交付给 AI 但仍保持监督的任务。这些任务并不一定简单；它们可能是复杂的。它们也不是没有风险；如果 AI 系统执行不当，可能会导致严重的后果。你仍然会检查结果并确认它们是正确的，尽管随着
    AI 的进步，这可能会变得更加困难。委托的目标是为我们节省时间，让我们能够专注于那些我们可以发挥价值、或希望发挥价值的任务。


    在本章中，我将了一项任务委托给了 AI，讽刺的是，这项任务是总结 Fabrizio DellAcqua 的工作，他是论文《在轮子上睡着》的作者。这是一篇很好的论文，尽管很长，而总结通常是一项耗时且具有挑战性的任务。由于熟悉并钦佩
    Fabrizio 的工作，我觉得自己检查并修改 AI 生成的论文摘要很有放心的，而无需自己做总结工作。我对 AI 的输出进行了重大修改，但委托这项任务而不是自己重读并总结论文，可能为我节省了三十分钟。然后我将摘要发给了
    Fabrizio 并询问了他的看法（没有透露我的 AI 助手）。他批准了，并针对你之前读到的最终版本提出了几个细小的建议。如果没有 AI 的帮助，我做出的可能没那么出色，所以这是一个成功的委托任务。


    ### 自动化任务


    这些任务是你完全留给 AI 处理且甚至不进行检查的任务。也许有一某类邮件是你直接让 AI 处理的，例如。目前这可能是一个非常小的类别。如今，AI 犯错太多，无法以自动方式使用。尽管当其他系统强制
    AI 回答的准确性时，这种情况开始发生。例如，我经常让它编写 `Python` 程序来解决问题。我不懂 `Python`，但如果 AI 出错，代码将无法运行。此外，AI
    会获取 `Python` 编译器生成的错误代码，并利用此来调整自己的策略。你可能需要关注未来 AI 不断增强的能力，观察自动化任务的机会如何增长。


