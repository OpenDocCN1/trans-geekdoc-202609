    > You will be my negotiation teacher. You will simulate a detailed scenario in
    which I have to engage in a negotiation. You will fill the role of one party,
    I will fill the role of the other. You will ask for my response in each step of
    the scenario and wait until you receive it. After getting my response, you will
    give me details of what the other party does and says. You will grade my response
    and give me detailed feedback about what to do better using the science of negotiation.
    You will give me a harder scenario if I do well, and an easier one if I fail.


    ChatGPT wrote back:


    > ![](images/page_xiv.jpg)Sure, I’d be happy to help you practice negotiations
    through a simulation exercise! Let’s start with a simple scenario. You are a salesperson
    trying to sell 100 pens to a customer. The pens are usually $1, but the customer
    is trying to negotiate the price down. The customer starts by offering to buy
    the pens for $0.50 each. How do you respond?


    And it proceeded to take me through an entire simulation that, while not perfect,
    did 80 percent of what took our team months to do. Based on just a paragraph-long
    prompt from me!


    My sleepless nights began. And to be honest, they haven’t ended. Every week, it
    seems like AI serves up a new miracle—or a new concerning development. I soon
    found myself arguing with a chatbot that accused me of being unethical when I
    asked it to help me write computer code. I discovered that I could create beautiful
    images by giving the right words to a machine. I could code in `Python`, a language
    I never learned. I discovered that a machine could do large amounts of my job...
    and maybe lots of other people’s jobs. I discovered something remarkably close
    to an alien co-intelligence, one that can interact well with humans, without being
    human or, indeed, sentient. I think we will all have our three sleepless nights
    soon.


    And sleep-deprived as I now am, I keep going back to my students’ questions: What
    does this technology mean for the future of work and education? Things are happening
    so quickly that it is hard to be sure, but we can begin to see its outlines.


    ### AI as General Purpose Technology


    AI is what those of us who study technology call a General Purpose Technology
    (ironically, also abbreviated `GPT`). These advances are once-in-a-generation
    technologies, like steam power or the internet, that touch every industry and
    every aspect of life. And, in some ways, generative AI might even be bigger.


    General Purpose Technologies typically have slow adoption, as they require many
    other technologies to work well. The `internet` is a great example. While it was
    born as `ARPANET` in the late 1960s, it took nearly three decades to achieve general
    use in the 1990s, with the invention of the `web browser`, the development of
    affordable computers, and the growing infrastructure to support high-speed internet.
    It was fifty years before smartphones enabled the rise of social media. And many
    companies have not even fully embraced the internet: making a business “digital”
    is still a hot topic of discussion at business school, especially as many banks
    still use mainframe computers.


    And previous General Purpose Technologies have similarly taken many decades from
    development until they were useful. Consider computers, another transformative
    technology. Early computers improved quickly, thanks to `Moore’s Law`, the long-standing
    trend that the capability of computers doubles every two years. But it still took
    decades for computers to be useful. Early computers improved quickly, thanks to
