    No one really knows where this is all heading, including me. Yet, despite not
    having definitive answers, I think I can be a useful guide. I have found myself
    to be an influential voice on the implications of AI, particularly through my
    newsletter, *One Useful Thing*, even though I am not a computer scientist myself.
    Indeed, I think that one of my advantages in understanding AI is that, as a professor
    at Wharton, I have long studied and written about how technologies are *used*.
    As a result, my coauthors and I have published some of the first research on AI
    in education and in business, and we have been experimenting with practical uses
    of AI in ways that major AI companies have cited as examples. I regularly speak
    with organizations, companies, and government agencies, as well as with many AI
    experts, to understand the world we are making. I also attempt to keep up with
    the flood of research in the field, much of it in the form of scientific working
    papers that have not yet gone through the long process of peer review but still
    offer valuable data about this new phenomenon (I will be citing a lot of this
    early work in the book to help fill in the picture of where we are headed, but
    it is important to realize that the field is evolving rapidly). Based on all these
    conversations and papers, I can assure you that there is nobody who has the complete
    picture of what AI means, and even the people making and using these systems do
    not understand their full implications.


    So I want to try to take you on a tour of AI as a new thing in the world, a co-intelligence,
    with all the ambiguity that the term implies. We have invented technologies, from
    axes to helicopters, that boost our physical capabilities; and others, like spreadsheets,
    that automate complex tasks; but we have never built a generally applicable technology
    that can boost our intelligence. Now humans have access to a tool that can emulate
    how we think and write, acting as a co-intelligence to improve (or replace) our
    work. But many of the companies developing AI are going further, hoping to create
    a sentient machine, a truly new form of co-intelligence that would coexist with
    us on Earth. To get a handle on what this means, we need to start from the beginning,
    with a very basic question: What is AI?


    So we are going to start there, discussing the technology of Large Language Models.
    That will give us a basis for thinking about how we, as humans, can best work
    with these systems. After that, we can dive into how AI can change our lives by
    acting as a coworker, a teacher, an expert, and even a companion. Finally, we
    can turn to what this might mean for us, and what it means to think together with
    an alien mind.


    # PART I


    ## 1. CREATING ALIEN MINDS


    Talking about AI can be confusing, in part because AI has meant so many different
    things and they all tend to get muddled together. Siri telling you a joke on command.
    The Terminator crushing a skull. Algorithms predicting credit scores.


    We’ve long had a fascination with machines that can think. In 1770, the invention
    of the first mechanical chess computer stunned those who saw it—a chessboard set
    upon an elaborate cabinet, with its chess pieces manipulated by a robot dressed
    as an Ottoman wizard. It toured the world from 1770 to 1838. The machine, also
    known as the `Mechanical Turk`, beat Ben Franklin and Napoleon in chess matches
    and led Edgar Allan Poe to speculate on the possibility of artificial intelligence
    upon seeing it in the 1830s. It was all a lie, of course—the machine cleverly
    hid a real chess master inside its fake gears, but our ability to believe that
    machines might be able to think fooled many of the best minds in the world for
    three quarters of a century.


    Fast-forward to 1950, when a toy and a thought experiment, each developed by a
    different genius of the still-developing field of computer science, led to a new
    conception of artificial intelligence. The toy was a jury-rigged mechanical mouse
    called `Theseus`, developed by Claude Shannon, an inventor, prankster, and the
    greatest information theorist of the twentieth century. In a 1950 film, he revealed
    that `Theseus`, powered by repurposed telephone switches, could navigate through
    a complex maze—the first real example of machine learning. The thought experiment
    was the `imitation game`, where computer pioneer Alan Turing first laid out the
    theories about how a machine could develop a level of functionality sufficient
    to mimic a person. While computers were a very new invention, Turing’s influential
    paper helped kick off the nascent field of artificial intelligence.


    Theories alone were not enough, and a handful of early computer scientists started
    working on programs that pushed the boundaries of what was soon called artificial
    intelligence, a term invented in 1956 by John McCarthy of MIT. Progress was initially
    rapid as computers were programmed to solve logic problems and play checkers—leading
    researchers expected an AI to beat grandmasters in chess within a decade. But
    hype cycles have always plagued AI, and as these promises went unfulfilled, disillusionment
    set in, one of many “AI winters” in which AI progress stalls and funding dries
    up. Other boom-and-bust cycles followed, each boom accompanied by major technological
    advances, such as artificial neural networks that mimicked the human brain, followed
    by collapse as AI could not deliver on expected goals.


    The latest AI boom started in the 2010s with the promise of using machine learning
    techniques for data analysis and prediction. Many of these applications used a
    technique called `supervised learning`, which means these forms of AI needed labeled
    data to learn from. Labeled data is data that has been annotated with the correct
    answers or outputs for a given task. For example, if you want to train an AI system
    to recognize faces, you need to provide it with images of faces that have been
    labeled with the names or identities of the people in them. This phase of AI was
    the domain of larger organizations that had vast amounts of data. They used these
    tools as powerful prediction systems, whether optimizing shipping logistics or
    guessing what of content to show you based on your browsing history. You might
    have heard the buzzwords `big data` or `algorithmic decision-making` describing
    these kinds of uses. Consumers mostly saw the benefits of machine learning when
    these techniques were integrated into tools such as voice recognition systems
    or translation apps. AI was a poor (albeit marketing-friendly) label for what
    this sort of software did, since there was very little about these systems that
    actually seemed intelligent or clever, at least in the ways humans are intelligent
    and clever.


    To see one example of how this sort of AI works, picture a hotel attempting to
    forecast its demand for the upcoming year, armed with nothing but existing data
    and a simple Excel spreadsheet. Before predictive AI, hotel owners would often
    be left playing a guessing game, trying to predict demand while grappling with
    inefficiencies and wasted resources. With this form of AI, they could instead
    input a wealth of data—weather patterns, local events, and competitor pricing—and
    generate far more accurate predictions. The results were a more efficient operation
    and, ultimately, a more profitable business. Before machine learning and natural
    language processing became mainstream, organizations focused on being correct
    on average—a rather rudimentary approach by today’s standards. With the introduction
    of AI algorithms, the focus shifted to statistical analysis and minimizing variance.
    Instead of being right on average, they could be right for each specific instance,
    leading to more accurate predictions that revolutionized many back-office functions,
    from managing customer service to helping run supply chains.

