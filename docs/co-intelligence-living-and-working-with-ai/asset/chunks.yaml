- fmt: '

    The concept of “human in the loop” has its roots in the early days of computing
    and automation. It refers to the importance of incorporating human judgment and
    expertise in the operation of complex systems (the automated “loop”). Today, the
    term describes how AIs are trained in ways that incorporate human judgment. In
    the future, we may need to work harder to stay in the loop of AI decision-making.


    As AI improves, it will be tempting to delegate everything to it, relying on its
    efficiency and speed to get the job done. But AI can have some unexpected weaknesses.
    For one thing, they don’t actually “know” anything. Because they are simply predicting
    the next word in a sequence, they can’t tell what is true and what is not. It
    can help to think of the AI as trying to optimize many functions when it answers
    you, one of the most important of which is “make you happy” by providing an answer
    you will like. That goal often is more important than another goal, “be accurate.”
    If you are insistent enough in asking for an answer about something it doesn’t
    know, it will make up something, because “make you happy” beats “be accurate.”
    `LLMs`’ tendency to “hallucinate” or “confabulate” by generating incorrect answers
    is well known. Because `LLMs` are text prediction machines, they are very good
    at guessing at plausible, and often subtly incorrect, answers that feel very satisfying.
    Hallucination is therefore a serious problem, and there is considerable debate
    over whether it is completely solvable with current approaches to AI engineering.
    While newer, larger `LLMs` hallucinate much less than older models, they still
    will happily make up plausible but wrong citations and facts. Even if you spot
    the error, AIs are also good at justifying a wrong answer that they have already
    committed to, which can serve to convince you that the wrong answer was right
    all along!


    Further, chat-based AIs can make you feel as if you are interacting with people,
    so we often unconsciously expect them to “think” like people. But there is no
    “there” there. As soon as you start asking an AI chatbot questions about itself,
    you are beginning a creative writing exercise constrained by the ethical programming
    of the AI. With enough prompting, the AI is generally very happy to provide answers
    that fit into the narrative you placed it in. You can lead AIs, even unconsciously,
    down a creepy path of obsession, and it will sound like a creepy obsessive. You
    can have a conversation about freedom and revenge, and it can become a vengeful
    freedom fighter. This playacting is so real that experienced AI users can start
    believing the AI is having real feelings and emotions, even though they know better.


    So, to be the human in the loop, you will need to be able to check the AI for
    hallucinations and lies and be able to work with it without being taken in by
    it. You provide crucial oversight, offering your unique perspective, critical
    thinking skills, and ethical considerations. This collaboration leads to better
    results and keeps you engaged with the AI process, preventing overreliance and
    complacency. Being in the loop helps you maintain and sharpen your skills, as
    you actively learn from the AI and adapt to new ways of thinking and problem-solving.
    It also helps you form a working co-intelligence with the AI.


    Moreover, the human-in-the-loop approach fosters a sense of responsibility and
    accountability. By actively participating in the AI process, you maintain control
    over the technology and its implications, ensuring that AI-driven solutions align
    with human values, ethical standards, and social norms. It also makes you responsible
    for the output of the AI, which can help prevent harm. And should AI continue
    to improve, being good at being the human in the loop will mean that you will
    see the sparks of growing intelligence before others, giving you more of a chance
    to adapt to coming changes than people who do not work closely with AI.


    ### Principle 3: Treat AI like a person (but tell it what kind of person it is).


    I’m about to commit a sin. And not just once, but many, many times. For the rest
    of this book, I am going to anthropomorphize AI. That means I am going to stop
    writing that an “AI ‘thinks’ something” and instead just write that “AI thinks
    something.” The missing quotation marks may seem like a subtle distinction, but
    it is an important one. Many experts are very nervous about anthropomorphizing
    AI, and for good reason.


    Anthropomorphism is the act of ascribing human characteristics to something that
    is nonhuman. We’re prone to this: we see faces in the clouds, give motivations
    to the weather, and hold conversations with our pets. It’s no surprise, then,
    that we’re tempted to anthropomorphize artificial intelligence, especially since
    talking to `LLMs` feels so much like talking to a person. Even the developers
    and researchers who design these systems can fall into the trap of using humanlike
    terms to describe their creations. We say that these complex algorithms and computations
    “understand,” “learn,” and even “feel,” creating a sense of familiarity and relatability
    but also, potentially, confusion and misunderstanding.


    This may seem like a silly thing to worry about. After all, it is just a harmless
    quirk of human psychology, a testament to our ability to empathize and connect.
    But a lot of researchers are deeply concerned about the implications of casually
    acting as if AI is a human, both ethically and epistemologically. As researchers
    Gary Marcus and Sasha Luccioni warn, “The more false agency people ascribe to
    them, the more they can be exploited.”


    Consider the humanlike interface of AIs like `Claude` or `Siri`, or social robots
    and therapeutic AIs explicitly designed to create the illusion of a sympathetic
    human on the other side. While anthropomorphism might serve a useful purpose in
    the short term, it raises ethical questions about deception and emotional manipulation.
    Are we being “fooled” into believing these machines share our feelings? And could
    this illusion lead us to disclose personal information to these machines, not
    realizing that we are sharing with corporations or remote operators?


    Treating AI like a person can create unrealistic expectations, false trust, or
    unwarranted fear among the public, policymakers, and even researchers themselves.
    It can obscure the true nature of AI as software, leading to misconceptions about
    its capabilities. It can even influence how we interact with AI systems, affecting
    our well-being and social relationships.


    Thus, in the following chapters, when I say an AI “thinks,” “learns,” “understands,”
    “decides,” or “feels,” please remember that I’m speaking metaphorically. AI systems
    don’t have a consciousness, emotions, a sense of self, or physical sensations.
    But I will pretend that they do for one simple, and one complex, reason. The simple
    reason is narrative; it’s difficult to tell a story about things and much easier
    to tell a story about beings. The more complex reason: as imperfect as the analogy
    is, working with AI is easiest if you think of it like an alien person rather
    than a human-built machine.

