  trans: '

    虽然我确信课堂写作将作为一种权宜之计回归流行，但 AI 的作用远不止于帮助学生作弊。每所学校或每个老师都需要深思哪些 AI 的使用是可以接受的：让 AI 提供一份大纲草案算作弊吗？就某人被卡住的句子寻求帮助？索要一份参考文献列表或对某个主题的解释算作弊吗？我们需要重新审视教育。我们以前这样做过，只是方式较为局限。


    当计算器首次引入学校时，人们的反应与我今天听到的关于学生使用 AI 完成写作等任务的最初担忧惊人地相似。正如教育研究者莎拉·J·班克斯（Sarah J. Banks）所写，在
    20 世纪 70 年代中期计算器普及的早期，许多老师急于将计算器引入课堂，并意识到这可能提高学生的学习积极性和参与度。这些老师认为，在学生学习了基础知识后，他们应该获得使用计算器解决更具现实且复杂问题的机会。然而，并非所有人都持有这种热情。有些老师对采用计算器犹豫不决，因为其影响尚未得到充分研究，他们认为在引入新技术之前应该先调整课程。20
    世纪 70 年代的一项调查显示，72% 的老师和普通人士不同意七级学生使用计算器。一个担忧是计算器无法帮助学生理解和识别错误，因为计算器不会记录学生按下的键，导致老师难以发现并纠正错误。早期的研究同样发现，父母担心孩子依赖技术而遗忘基础数学技能。这听起来不熟悉吗？


    态度转变很快，到了 20 世纪 70 年代后期，家长和老师变得更加热情，看到了使用计算器的潜在益处，例如改善对学习的态度，并确保他们的孩子为技术驱动的世界做好准备。一两年后，另一项研究显示，84%
    的老师想在课堂上使用计算器，但只有 3% 的老师所在学校提供了计算器。老师们通常没有接受过如何使用计算器的培训，需要管理层和家长的支持才能将其融入课堂。尽管缺乏官方政策，许多老师继续坚持在课堂上使用计算器。这场辩论持续到
    20 世纪 80 年代和 90 年代初，有些老师仍然认为计算器阻碍了学生掌握基础技能，而另一些人则认为它们是未来的工具。到 90 年代中期，计算器已成为课程的一部分，并用于补充学习数学的其他方式。有些考试允许使用，有些则不允许。人们达成了一个务实的共识。数学教育并没有崩溃，尽管在计算器进入教室半个世纪后的今天，辩论和研究仍在继续。


    在某种程度上，AI 将遵循类似的路径。将会会有某些作业需要 AI 协助，而会有另一些作业不允许使用 AI。在未连接互联网的电脑上进行校内写作作业，结合书面考试，将确保学生学会基础写作技能。我们将找到一种务实的共识，让
    AI 整合到学习过程中，而不损害批判性思维能力的发展。正如计算器没有取代学习数学的需求一样，AI 也不会取代学习写作和批判性思维的需求。解决这个问题可能需要一段时间，但我们能做到。事实上，我们必须这样做——想把“魔瓶里的魔鬼”关回瓶里已经太晚了。


    计算器完全改变了教学的价值所在，以及数学教学的整体本质——这些巨大的修改大多是有益的。而且这场革命花费了很长时间。然而，与 AI 不同，计算器起初是昂贵且有限的工具，让学校有时间在十年间缓慢采纳并将其融入课程。AI
    革命的发生速度更快、范围更广。在数学身上发生的事情将发生在教育各个阶段的每一个学科上，这是一场没有延迟的转型。


    所以，学生确实会用 AI 作弊。但正如我们之前看到的用户创新那样，他们也将开始将 AI 整合到他们所做的每件事中，为教育者提出了新问题。学生会想要理解为什么要做那些看起来已经过时的作业。他们想要利用
    AI 作为学习伴侣、合作作者或队友，完成比以前更多的任务。他们将想知道 AI 对他们未来的学习路径意味着什么。学校将需要决定如何应对这一 AI 浪潮。


    作业末日威胁着许多有益的作业类型，这些作业几个世纪以来一直使用。我们需要快速调整，以保护我们可能失去的东西，并适应 AI 带来的变化。这需要教师和教育者的者的努力，以及明确的
    AI 使用政策。但这种时刻不仅仅是为了保护旧作业类型。AI 提供了新的教学方法的机会。我在宾夕法尼亚大学的所有本科生课程中已将 AI 强制化。有些作业要求学生让
    AI 生成文章，然后由他们进行批判——这是让学生深入思考的一种巧妙方法，即使他们没有亲笔写作。有些作业允许无限量使用 AI，但要求学生对 AI 产生的结果和事实负责。其他作业利用
    AI 的新能力，要求学生在与真实的人对话之前先与 AI 进行访谈。例如，我在沃顿创业课上的第一个作业现在写道：


    ```

    让你的计划要做的事情雄心勃勃到极致；你将使用 AI。不会写代码？那就计划制作一个应用程序。涉及网站？你应该承诺创建一个原型网站，包含所有原创图像和文本。如果你因为太雄心勃勃而失败，我不会惩罚你。

    ```

