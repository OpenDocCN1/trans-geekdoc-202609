  trans: '


    面对空白页的暴政时，人们想要按下`那个按钮`（The Button）。从某些事情开始总比从无到有容易得多。学生会用它来开始论文。经理会用它来写邮件、报告或文档。老师会在提供反馈时使用它。科学家会用它来写资助申请。概念艺术家会用它来完成初稿。每个人都会使用`那个按钮`。


    让 AI 为我们撰写初稿（即使我们是自己完成工作，这并非理所如此）其影响是巨大的。一个后果是，我们可能会失去创造力和原创性。当我们使用 AI 生成初稿时，我们倾向于锚定在机器产生的第一个想法上，这会影响我们未来的工作。即使我们完全重写了草稿，它们仍然会受到
    AI 影响的污染。我们将无法探索不同的视角和替代方案，而这些视角本可以带来更好的解决方案和洞察。


    另一个后果是，我们可能会降低思考和推理的质量和深度。当我们使用 AI 生成初稿时，我们不需要对自己写的内容思考得那么努力、那么深奥。我们依赖机器来完成分析和综合的苦差，而我们自己没有参与批判性和反性思考。我们还错过了从错误和反馈中学习的机会，以及发展自己风格的机会。


    已经有证据表明这将成为一个问题。之前提到的 MIT 研究发现，`ChatGPT` 大多是作为人类努力的替代品，而不是我们技能的补充。事实上，绝大多数参与者甚至懒得去编辑
    AI 的输出。这是我在人们首次使用 AI 时反复看到的问题：他们只是直接粘贴被问到的原始问题，然后让 AI 回答。


    许多工作在设计上就是耗时的。在一个 AI 提供了一种即时、相当不错、且近乎全球范围内可获取的捷径的世界里，我们很快将面临各种创造性工作的意义危机。这在某种程度上是因为我们预期的创造性工作需要细致的思考和修改，但也因为时间往往充当工作的代名词。以推荐信为例。教授经常被要求为学生写信，写一封好信需要很长时间。你必须了解这个学生以及写信的原因，决定如何措辞以符合职位要求和学生的优势，等等。这种“耗时”的特性在某种程度上就是意义所在。教授花时间写一封好信，是他们支持学生申请的信号。我们是在燃烧自己的时间，以此向其他人传递这封信是值得读的信号。


    或者我们可以按下`那个按钮`。


    问题在于，AI 生成的信将会很出色。不仅是语法正确，而且对人类读者来说也具有说服力和洞察力。它将比我收到的大多数推荐信都要好。这意味着，不仅信件的质量不再是教授兴趣的信号，而且如果你不通过
    AI 来写推荐信，你实际上可能在伤害他人，尤其是如果你不是一个特别擅长写作的人。因此，人们现在必须考虑，信件的目标（帮学生找到工作）与实现该目标在道德上正确的方法（教授花费大量时间写信）之间的冲突。我仍然用老办法写我所有的信，但我怀疑这最终会对我的学生产生不利。


    现在考虑所有其他任务，这些任务的最终书面输出非常重要，因为它们是投入任务的时间以及投入其中的深思熟虑的信号——绩效评估、战略备忘录、大学申请、资助申请、演讲、对论文的评论。等等诸多。


    那么，`那个按钮`开始诱惑每个人。那些做起来很无聊但由人类完成时就很有意义的工作（如绩效评估）变得容易外包——而且表面质量实际上提升了。我们开始主要用 AI
    创建文档，并发送到 AI 驱动的收件箱中，收件者在其中做出回应。我们开始主要用 AI 创建文档，并发送到 AI 驱动的收件箱中，收件者在其中做出回应。在大多数
    AI 的范围内，这种意义感消失了。AI 也会让以前有意义的任务变得毫无意义。


    我们需要重构意义，在艺术领域，在仪式感中。当摄影让油画变得过时，艺术家开始推向艺术的边界。当电子表格让手动添加数据变得不再需要，文职人员的职责发生了变化，大抵如此。正如我们在下一章中将看到的，这种意义的变化将对工作产生巨大影响。


    ## 6 AI 作为同事


    当人们开始认真使用 AI 时，第一个问题之一是它是否会影响他们的工作。答案很可能是定的。


    '
- fmt: '

    Take my role as a business school professor. As the 22nd most overlapping of 1,016
    jobs, I am a little concerned. But my job isn’t just a single, indivisible entity.
    Instead, it comprises a variety of tasks: teaching, researching, writing, filling
    out annual reports, maintaining my computer, writing letters of recommendation,
    and more. The job title “professor” is just a label; the daily grind consists
    of this mix of tasks.


    Can AI take over some of these tasks? The answer is yes, and frankly, there are
    tasks that I wouldn’t mind offloading to AI, like administrative paperwork. But
    does that mean my job will vanish? Not really. Getting rid of some tasks doesn’t
    mean the job disappears. In the same way, power tools didn’t eliminate carpenters
    but made them more efficient, and spreadsheets let accountants work faster but
    did not eliminate accountants. AI has the potential to automate mundane tasks,
    freeing us for work that requires uniquely human traits such as creativity and
    critical thinking—or, possibly, managing and curating the AI’s creative output,
    as we discussed in the last chapter.


    However, this isn’t the end of the story. The systems within which we operate
    play a crucial role in shaping our jobs as well. As a business school professor,
    an obvious system is tenure, meaning that I cannot be easily replaced, even if
    my job were outsourced to AI. But more subtle are the many other systems at a
    university. Let’s say an AI could deliver a lecture better than I can. Would students
    be willing to outsource their learning to AI? Would our classroom technology be
    able to accommodate AI teaching? Would the deans of the university feel comfortable
    using AI in this way? Would the magazines and sites that rank schools punish us
    for doing so? My job is connected to many other jobs, customers, and stakeholders.
    Even if AI automated my job, the systems in which it works are less obvious.


    So let’s put AI into context and talk about what it can do at the level of tasks
    and systems.


    ### Tasks and the Jagged Frontier


    It is one thing to theoretically analyze the impact of AI on jobs, but another
    to test it. I have been working on doing that, along with a team of researchers,
    including the Harvard social scientists Fabrizio Dell’Acqua, Edward McFowland
    III, and Karim Lakhani, as well as Hila Lifshitz-Assaf from Warwick Business School
    and Katherine Kellogg of MIT. We had the help of Boston Consulting Group (BCG),
    one of the world’s top management consulting organizations, which ran the study,
    and nearly eight hundred consultants who took part in the experiments.


    Consultants were randomized into two groups: one that had to do work the standard
    way and one that got to use `GPT-4`, the same off-the-shelf vanilla version of
    the LLM that everyone in 169 countries has access to. We then gave them some AI
    training and set them loose, with a timer, on eighteen tasks that were designed
    by BCG to look like the standard job of consultants. There were creative tasks
    (`Propose at least 10 ideas for a new shoe targeting an underserved market or
    sport`), analytical tasks (`Segment the footwear industry market based on users`),
    writing and marketing tasks (`Draft a press release marketing copy for your product`),
    and persuasiveness tasks (`Pen an inspirational memo to employees detailing why
    your product would outshine competitors`). We even checked with shoe company executives
    to ensure that this work was realistic.


    The group working with the AI did significantly better than the group that didn''t.
    The AI-powered consultants were faster, and their work was considered more creative,
    better written, and more analytical than their peers. But the AI-powered consultants
    were also more likely to make big errors when it counted. We measured the results,
    and we found that the consultants without AI help got the problem right 84 percent
    of the time, but when they used AI, they got it only 60 to 70 percent of the time.


    What happened?


    In a different paper, Fabrizio Dell’qua shows why relying too much on AI can backfire.
    He hired 181 professional recruiters and gave them a tricky task: to evaluate
    44 job applications based on their math ability. The data came from an international
    test of adult skills, so the math scores were not obvious. Recruiters were given
    different levels of AI assistance: some had good or bad AI, and some had none.
    He measured how accurate, how fast, how hardworking, and how confident they were.


    Recruiters with higher-quality AI were worse than recruiters with lower-quality
    AI. They spent less time and effort on each résumé, and blindly followed the AI
    recommendations. They also did not improve over time. On the other hand, recruiters
    with lower-quality AI were more alert, more critical, and more independent. They
    improved their interaction with the AI and their own skills.


    Dell’Acqua developed a mathematical model to explain the trade-off between AI
    quality and human effort. When the AI is very good, humans have no reason to work
    hard and pay attention. They let the AI take over instead of using it as a tool,
    which can hurt human learning, skill development, and productivity. He called
    this “falling asleep at the wheel.”


    Dell’Acqua’s study points to what happened in our study with the BCG consultants.
    The powerful AI made it likelier that the consultants fell asleep at the wheel
    and made big errors. They misunderstood the shape of the Jagged Frontier.


    The future of understanding how AI impacts work involves understanding how human
    interaction with AI changes, depending on where tasks are placed on this frontier
    and how the frontier will change. That takes time and experience, which is why
    it is important to stick with the principle of inviting AI to everything, letting
    us learn the shape of the Jagged Frontier and how it maps onto the unique complex
    of tasks that comprise our individual jobs. With that knowledge, we need to be
    conscious about the tasks we are giving AI, so as to take advantage of its strengths
    and our weaknesses. We want to be more efficient while doing less boring work,
    and to remain the human in the loop while also addressing the value of AI.


    ### Tasks for Me, Tasks for AI

    '
