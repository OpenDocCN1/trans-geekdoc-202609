- fmt: '

    We could imagine how LLMs might supercharge this process, creating an even more
    comprehensive panopticon: in this system, every aspect of work is monitored and
    controlled by AI. AI tracks the activities, behaviors, outputs, and outcomes of
    workers and managers. AI sets goals and targets for them, assigns tasks and roles
    to them, evaluates their performance, and rewards them accordingly. But, unlike
    the cold, impersonal algorithm of Lyft or Uber, LLMs might also provide feedback
    and coaching to help workers improve their skills and productivity. AI’s ability
    to act as a friendly adviser could sand down the edges of algorithmic control,
    covering the Skinner box in bright wrapping paper. But it would still be the algorithm
    in charge. If history is a precedent, this is a likely path for many companies.


    But other, more utopian possibilities also exist. We don’t need to subject vast
    numbers of humans to machine overlords. Rather, LLMs could help us flourish by
    making it impossible to ignore the truth any longer: a lot of work is really boring
    and not particularly meaningful. If we acknowledge that, we can turn our attention
    to improving the human experience of work.


    In surveys, people report being bored about 10 hours a week at work, a shockingly
    large percentage of the time. While not all work has to be thrilling, a huge amount
    of it is boring for no reason, and that seems to be a big problem. Not only is
    boredom a top cause for people leaving companies, but we do crazy stuff when bored.
    One small study of undergraduates found that 66 percent of men and 25 percent
    of women choose to painfully shock themselves rather than sit quietly with nothing
    to do for 15 minutes. Boredom doesn’t just lead us to hurt ourselves; 18 percent
    of bored people killed worms when given a chance (only 2 percent of non-bored
    people did). Bored parents and soldiers both act more sadistically. Boredom is
    not just boring; it is dangerous in its own way.


    In an ideal world, managers would spend time trying to end the useless and repetitive
    work that leads to boredom, and to adjust work to focus on the more engaging tasks.
    Despite years of management advice, however, most official rituals, forms, and
    requirements persist long past their usefulness. If humans couldn’t end this tedious
    work, maybe machines can.


    We have already outsourced the worst part of writing (checking grammar) and math
    (long division) to machines like spell checkers and calculators, which freed us
    from these tedious tasks. It would be natural to use LLMs to extend the process.
    And this is indeed what we have seen in some early research on using AI for work.
    People who use AI to do tasks enjoy work more and feel they are better able to
    use their talents and abilities. The ability to outsource crappy, meaningless
    tasks to the AI can be freeing. The worst parts of your job go to AI so that you
    get to focus on the good stuff.


    Thus, if we want to think about the first work we truly give to AIs, maybe we
    should start the way every other automation wave has started: with the tedious,
    (mentally) dangerous, and repetitive. Companies and organizations could start
    with thinking about how to make boring processes AI friendly, allowing machines
    (with human supervision) to fill our required forms. Rewarding workers for slaying
    boring tasks with AI could also help streamline operations, while making everyone
    happier. And if this sheds light on tasks that could be safely automated with
    no decrease in value, so much the better. Maybe that is work that can be eliminated.
    It is certainly a better place to start than the alternative, algorithmic control.


    ### From Systems to Jobs


    And now, having covered tasks and systems, we can return to the question of jobs
    and the extent to which AI might replace human workers. As we have seen, it seems
    very likely that AI will take over human tasks. If we take advantage of all that
    AI has to offer, this could be a good thing. Boring tasks, or tasks that we are
    not good at, can be outsourced to AI, leaving good and high-value tasks to us,
    or at least to AI-human Cyborg teams. This fits into historical patterns of automation,
    where the bundles of tasks that make up jobs change as new technologies are developed.
    Accountants once were in charge of calculating numbers by hand; now they use a
    spreadsheet—they are still accountants, but their bundles of tasks have changed.


    When we start to take into account the systems in which jobs operate, we see other
    reasons to suspect slower, rather than faster, change in the nature of jobs. Humans
    are built deep into the fabric of every aspect of our organizations. You cannot
    easily replace a human with a machine without tearing that fabric. Even if you
    could replace a doctor with an AI overnight, would patients be okay being seen
    by a machine? How would liability rules work? How would other health-care professionals
    adjust? Who would do the other tasks that the doctor was in charge of, like training
    interns or being part of professional organizations? Our systems will prove more
    resistant to change than our tasks.


    But that doesn’t mean some industries won’t change quickly as their fundamental
    economics shift. General Purpose Technologies both destroy and create new fields
    of work. Stock photography, a $3 billion per year market, is likely to largely
    disappear as AIs, ironically trained on these very images, can easily produce
    customized images. Or consider the $110 billion a year call-center industry, which
    will reckon with the impact of fine-tuned AIs handling ever more tasks that were
    once done by humans, acting like a phone tree service that actually works. At
    the same time, entirely new industries may appear, like those servicing and deploying
    AI systems. And existing industries may become supercharged. For example, more
    scientists and engineers are likely to be required to modify and adapt old systems
    to take advantage of AI.


    So it may not be a big surprise that over two-thirds of a panel of economists
    expect, on average, for AI to have very little effect on overall jobs in the next
    few years, even as AI boosts the economy overall. That doesn’t mean new technologies
    never displace workers en masse, though. In fact, it has happened to one of the
    biggest job categories ever held by women—telephone operators. By the 1920s, 15
    percent of all American women had worked as operators, and AT&T was the largest
    employer in the United States. AT&T decided to remove the old-school telephone
    operators and replace them with much cheaper direct dialing. Operator jobs dropped
    rapidly by 50 to 80 percent. As might be expected, the job market overall adjusted
    quickly, as young women found other roles, like secretarial positions, that offered
    similar or better pay. But the women with the most experience as operators took
    a larger hit to their long-term earnings, as their tenure in a now extinct job
    did not translate to other fields. So, while jobs usually adjust to automation,
    they do not always, at least not for everyone.


    Of course, there are also reasons why AI might be different from other technological
    waves. It is the first wave of automation that broadly affects the highest-paid
    professional workers. Plus, AI adoption is happening much more quickly, and much
    more broadly, than previous waves of technology. And we are still unclear as to
    what the limits, and possibilities, of this new technology are, how quickly they
    will continue to grow, and how ahistorical and strange the effects might be.


    Knowledge work is famous for very large differences in abilities among workers.
    For example, repeated studies found that differences between the programmers in
    the top 75th percentile and those in the bottom 25th percentile can be as much
    as 27 times along some dimensions of programming quality. And my own research
    has found that large gaps exist between good and bad managers. But AI may change
    all that.

