  trans: '

    然而，在某些方面，这种转变已经发生。1865 年，英国人一生中平均工作 124,000 小时，美国和日本的人也是如此。到 1980 年，尽管英国人的寿命延长了，但英国工人工作的时间仅为
    69,000 小时。在美国，我们工作时间占生命时间的比例从 50%下降到了 20%。自 1980 年以来，工作时间的改善变得更加缓慢。尽管如此，英国工人现在的每年工作时间比那时少了
    115 小时，下降了 6%。类似的变化正在发生在全球范围内。这些额外时间中的很大一部分被学校教育填满了，即使 AI 变得更加强大，这种变化也不可能迅速改变；但我们也发现了许多其他利用空闲时间的方法。适应更少的工作可能比我们想象的没有那么具有伤性。没有人想回到维多利亚时代工厂每周工作六天的日子，我们很快可能对在充满压抑隔间的办公办公室里每周工作五天产生同样的感觉。


    当然，这种程度的指数级变化假设 AI 会变得得多，但永远不会真正产生意识或自我引导。而且，任何指数级增长都不可能无限持续。但考虑到足够陡峭或足够长的指数级增长，一些
    AI 研究人员怀疑，在 AI 能力的某个水平上，它们将达到飞跃点，实现通用人工智能（AGI）甚至超人类智能。


    ## 情景 4：机器神


    在第四种情景中，机器达到了 AGI 和某种形式的意识。它们变得像人类一样聪明和能干。然而，并没有特殊的理由说明人类智能应该是上限。因此，这些 AI 反过来又帮助设计更聪明的
    AI。超级智能出现了。在第四种情景中，人类的至上地位结束了。


    人类统治地位的结束并不意味着人类的终结。它甚至可能是对我们一个更好的世界，但它不再是一个人类处于顶端的世界，结束了一段长达两百万年的良好进程。实现这种水平的机器智能意味着由
    AI 而非人类来负责。我们必须希望它们与人类的利益得到适当的对齐。它们可能会决定像诗中所写的那样，作为“充满慈悲的机器”来守护我们，解决我们的问题并让我们的生活更好。或者它们可以将我们视为威胁、不便，或者是宝贵分子的来源。


    老实说，没有人知道如果我们成功构建了超级智能会发生什么。结果将是动摇世界的。如果我们没有完全达到超级智能，即使是一台真正有意识的机器，也将挑战我们对“何之所以为人”的许多想法。它们在每一个可能的方面都是真正的外星头脑，它们对我们在宇宙中地位的挑战，不亚于在另一个星球上发现外星人。


    从理论上没有理由说明这种情况不会发生，但也没有理由怀疑它可能会发生。世界上有很多 AI 专家对这两种观点都有主张。但事实是，我们并不知道从今天的大语言模型（LLMs）到构建真正的
    AGI 之间是否有一条直达之路。我们也不知道 AGI 会帮助还是伤害我们，或者它将如何产生其中一种结果。有足够的严肃专家认为这种风险是真实的，以至于我们需要认真对待它。例如，AI
    之父之一的杰弗里·辛顿（Geoffrey Hinton）于 2023 年离开了该领域，他警告 AI 的危险，言辞如：“完全可以想象，人类只是智能演化过程中的一个短暂阶段。”其他
    AI 研究人员谈论他们的“p(doom)即 AI 导致人类灭绝的概率。如果这些“AI 末日论者”是正确的，那么永久停止 AI 开发的大规模监管是唯一的选择——尽管这看起来那么不现实。


    但我认为，过度考虑这第四种情景也会让我们感到无力。如果我们仅仅关注于构建超级智能机器的风险或益处，它就剥夺了我们考虑更有可能的第二、第三种情景的能力——即
    AI 无处不在但完全受人类控制的世界。在那些世界里，我们可以对 AI 的意义做出选择。


    与其担心某一个巨大的 AI 末日世界，我们更需要担心 AI 可能带来的许多微小灾难。缺乏想象力或压力过大的领导者可能会决定使用这些新工具进行监控和裁员。发展中国家较不幸运的人可能会在职业转型中受到不成比例的影响。教育工作者可能会决定以会让某些学生落后的方式使用
    AI。这些只是显而的问题。


    AI 不需要是灾难性的。事实上，我们可以为相反的情况制定计划。J.R.R. 托尔金（J. R. R. Tolkien）写写过这种情况，他将其称为“大团圆”（eucatastrophe），这在童话中非常常见：“圆满结局的快乐：或更准确地说，是好的灾难，突然的喜悦‘转折’……是一种突然而奇迹的恩典：永远无法指望再次发生。”使用得当的
    AI 可以创造局部的“大团圆”，让以前枯燥或无用的工作变得多产且赋能。让被落下的学生能找到新的道路。让生产力的提高带来增长和创新。


    一种广泛应用技术的特点是，关于如何使用它的决策不仅限于一小群人。组织中的许多人将在塑造 AI 对他们的团队、客户、学生和环境的意义方面发挥作用。但为了让这些选择产生意义，严肃的讨论需要在很多地方开始。


    ## 后结


    ## AI 即我们


    致谢

