    `Ethan Mollick` is a professor of management at Wharton, specializing in entrepreneurship
    and innovation. His research has been featured in various publications, including
    `Forbes`, `The New York Times`, and `The Wall Street Journal`. He is the creator
    of numerous educational games on a variety of topics. He lives and teaches in
    Philadelphia, Pennsylvania.


