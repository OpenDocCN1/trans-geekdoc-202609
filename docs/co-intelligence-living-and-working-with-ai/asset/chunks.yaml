    that the “equal-odds rule” is true for creativity, which is that very creative
    people generate both more ideas and better ideas than other folks. Coming up with
    lots of ideas was not correlated with intelligence; it seems to be a skill some
    people have and others do not. Until the past year, no prosthetic or approach
    would help people who were not good at generating a lot of ideas to do better
    (besides coffee, which genuinely increases creativity). We are now in a period
    during which AI is creative but clearly less creative than the most innovative
    humans—which gives the human creative laggards a tremendous opportunity. As we
    saw in the AUT, generative AI is excellent at generating a long list of ideas.
    From a practical standpoint, the AI should be invited to any brainstorming session
    you hold.


    So how should we use AI to help generate ideas? Fortunately, the papers, and other
    research on innovation, have some good suggestions. When you do include AI in
    idea generation, you should expect that most of its ideas will be mediocre. But
    that’s okay—that’s where you, as a human, come into the equation. You are looking
    for ideas that spark inspiration and recombination, and having a long list of
    generated possibilities can be an easier place to start for people who are not
    great at coming up with ideas on their own.


    So how do we do it? Let’s imagine that we want to come up with 20 ideas for marketing
    slogans for a new mail-order cheese shop. The AI can generate those for us, but
    we will get even better quality if we remember the principle of telling AI who
    it is: You are an expert at marketing. When asked to generate slogan ideas you
    come up with ideas that are different from each other, clever, and interesting.
    You use clever wordplay. You try not to repeat themes or ideas. Come up with 20
    ideas for marketing slogans for a new mail-order cheese shop, make them different
    from each other, and make them clever and creative.


    1.  “A Brie-lliant Way to Your Doorstep!”


    2.  “Cheese the Day, Right at Your Door.”


    3.  “Life’s Better with a Slice of Our Gouda.”


    4.  “Unlock the Melt, Post by Post.”


    5.  “Savor the Curd, Delivered to Your Turf!”


    6.  “Delivered with Glee, Aged to a T.”


    7.  “From Our Cave to Your Crave.”


    8.  “Rethink Cheese—Mailed for Your Ease.”


    9.  “Your Passport to Global Fromage.”


    10.  “A Parcel of Pleasure, from Cheddar to Treasure.”


    11.  “We’ve Got Your Cheese Needs Sealed and Delivered.”


    12.  “We Make You Feta, One Package at a Time.”


    13.  “Where Dairy Meets Delivery.”


    14.  “Every Letter Is Feta—the Cheesier, the Better.”


    15.  “Cut the Queue, Get the Blue.”


    16.  “Say Cheese and We’ll Mail It, Please.”


    17.  “Cheesy Love, from Our Box to Your Block.”


    18.   “No Whey We’re Ordinary, Get Your Cheesy Story.”


    19.  “Quality Aged, Perfectly Packaged.”


    20.  “Embrace the Rind, Love Delivered in Kind.”


    And . . . most of the ideas are terrible, and some are incoherent, and a few have
    potential (and bad puns). It took us no time to generate 20 ideas, and it is costless
    to skim them to see if they inspire better ideas. I am a little bit partial to
    “Cut the Queue, Get the Blue” and “From Our Cave to Your Crave.” But if none of
    those sparked your interest, ask for another 20 with different prompting. Or ask
    it to consider a particular customer (a cheese shop that will appeal to novices
    or children) or to change the context of the prompt in other ways. Tirelessly
    generating concepts is something AIs are uniquely good at.


    Another key aspect of idea generation is to embrace variance. Research shows that,
    to find good novel ideas, we likely have to come up with many bad novel ideas
    because most new ideas are pretty bad. Fortunately, we are good at filtering out
    low-quality ideas, so if we can generate novel ideas quickly and at low cost,
    we are more likely to generate at least some high-quality gems. So we want the
    AI answers to be weird.'
