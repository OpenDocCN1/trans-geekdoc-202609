- fmt: '

    So let’s start in. Imagine your AI collaborator as an infinitely fast intern,
    eager to please but prone to bending the truth. Despite our history of thinking
    about AI as unfeeling, logical robots, LLMs act more like humans. They can be
    creative, witty, and persuasive, but they can also be evasive and make up plausible,
    but wrong, information when pressed to give an answer. They are not experts in
    any domain, but they can mimic the language and style of experts in ways that
    can be either helpful or misleading. They are unaware of the real world but can
    generate plausible scenarios and stories based on common sense and patterns. They
    are not your friends (for now) but can adapt to your preferences and personality
    by learning from your feedback and interactions. They even seem to respond to
    emotional manipulation, with researchers documenting that LLMs produce better
    answers if you tell them “this is important to my career” as part of your prompt.
    They are, in short, suggestible and even gullible.


    To make the most of this relationship, you must establish a clear and specific
    AI persona, defining who the AI is and what problems it should tackle. Remember
    that LLMs work by predicting the next word, or part of a word, that would come
    after your prompt. Then they continue to add language from there, again predicting
    which word will come next. So the default output of many of these models can sound
    very generic, since they tend to follow similar patterns common in the written
    documents the AI was trained on. By breaking the pattern, you can get much more
    useful and interesting outputs. The easiest way to do that is to provide context
    and constraints. It can help to tell the system “who” it is, because it gives
    it a perspective. Telling it to act as a teacher of MBA students will result in
    a different output than if you ask it to act as a circus clown. This isn’t magical—you
    can’t say Act as Bill Gates and get better business advice—but it can help make
    the tone and direction appropriate for your purpose.


    Let me give you some examples of how defining an AI persona can improve your results.
    Suppose you’re a marketing director and you want to use an LLM to generate some
    catchy slogans for your new product, a smartwatch that tracks your health and
    fitness. If you simply ask the LLM, `Generate some slogans for my product`, without
    any context or constraints, you might get something like this:


    * The smartwatch that keeps you smart

    * Your health and fitness partner

    * The ultimate device for your lifestyle

    * Stay connected and healthy with our smartwatch

    * The smartwatch that does it all


    These are not very original or memorable. They sound like generic marketing phrases
    that could apply to any smartwatch or wearable device. They don’t capture what
    makes your product unique or appealing. Now suppose you give the LLM some context
    and constraints by telling it who it is and what it should do. For example, you
    could say, `Act as a witty comedian and generate some slogans for my product that
    make people laugh`. Then you might get something like: `The ultimate device for
    lazy people who want to look fit`. Or: `Why hire a personal trainer when your
    wrist can nag you for free?` (Though, as you can probably see, most AIs prefer
    to stay in Dad Joke territory.)


    Of course, you don’t have to have the AI act as a comedian if that’s not your
    style or goal. You could also ask it to act as an expert, a friend, a critic,
    a storyteller, or any other role that suits your purpose. The key is to give the
    LLM some guidance and direction on how to generate outputs that match your expectations
    and needs, to put it in the right “headspace” to give you interesting and unique
    answers. Research has shown that asking the AI to conform to different personas
    results in different, and often better, answers. But it isn’t always clear what
    personas work best, and LLMs may even subtly adapt their persona to your questioning
    technique, providing less accurate answers to people who seem less experienced,
    so experimentation is key.


    Once you give it a persona, you can work with it as you would another person or
    an intern. I witnessed the value of this approach in action when I assigned my
    students to “cheat” by using an AI to generate a five-paragraph essay on a relevant
    topic. At first, the students gave simple and vague prompts, resulting in mediocre
    essays. But as they tried different strategies, the quality of the AI’s output
    improved significantly. One very effective strategy that emerged from the class
    was treating the AI as a coeditor, engaging in a back-and-forth, conversational
    process. Students produced impressive essays that far exceeded their initial attempts
    by constantly refining and redirecting the AI.


    Remember, your AI intern, though incredibly fast and knowledgeable, is not flawless.
    It’s crucial to keep a critical eye on and treat the AI as a tool that works for
    you. By defining its persona, engaging in a collaborative editing process, and
    continually providing guidance, you can take advantage of AI as a form of collaborative
    co-intelligence.


    ### Principle 4: Assume this is the worst AI you will ever use.


    As I write this in late 2023, I think I know what the world looks like for at
    least the next year. Bigger, smarter Frontier Models are coming, along with an
    increasing range of smaller and open-source AI platforms. In addition, AIs are
    becoming connected to the world in new ways: they can read and write documents,
    see and hear, produce voice and images, and surf the web. LLMs will become integrated
    with your email, web browser, and other common tools. And the next phase of AI
    development will involve more AI “agents”—semi-autonomous AIs that can be given
    a goal (`plan a vacation for me`) and execute it with minimal human help. After
    this, however, things start to get hazy, the future becomes less clear, and the
    risks, and benefits, of AI start to multiply. We will return to this theme later,
    but there is one obvious conclusion, one that is hard for a of us to grasp: whatever
    AI you are using now is going to be the worst AI you will ever use.


    The change in a short time is already huge. In a visual example, consider these
    two images, made using the most advanced AI models available in mid-2022 and mid-2023.
    Both have the same prompt, `black and white picture of otter wearing a hat`, but
    one is a Lovecraftian nightmare of fur and the other is, well, an otter wearing
    a hat. The same capability gains have been ubiquitous in AI.


    There is no reason to suspect that the abilities of AI systems are going to stop
    growing anytime soon, but even if they do, tweaks and improvements to how we use
    AI will ensure that future software is far more advanced than it is today. We
    are playing Pac-Man in a world that will soon have PlayStation 6s. And that is
    assuming that AI improves according to the normal pace of technology development.
    If the possibility of developing AGI turns out to be real and achievable, the
    world will be even more transformed in the coming years.


    As AI becomes increasingly capable of performing tasks once thought to be human,
    we’ll need to grapple with the awe and excitement of living with increasingly
    powerful alien co-intelligences—and the anxiety and loss they’ll also cause. Many
    things that once seemed exclusively human will be able to be done by AI. So, by
    embracing this principle, you can view AI’s limitations as transient, and remaining
    open to new developments will help you adapt to change, embrace new technologies,
    and remain competitive in a fast-paced business landscape driven by exponential
    advances in AI. This is a potentially uncomfortable place to be, as we will discuss,
    but it suggests that the possibilities of using AI to transform your work, your
    life, and yourself, which we can now glimpse, are just the beginning.

