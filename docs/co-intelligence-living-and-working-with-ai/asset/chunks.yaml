    从系统到工作


    知识工作以员工之间能力差异巨大而闻名。例如，反复的研究发现，前 75% 分位的程序员与后 25% 程序员在编程质量的某些维度上的差距可能高达 27 倍。我自己的研究也发现，优秀的经理和糟糕的经理之间存在巨大差距。但
