    At the level of tasks, we need to think about what AI does well and what it does
    badly. But we also need to consider what we do well and what tasks we need to
    remain human. Those we can call `Just Me Tasks`. They are tasks in which the AI
    is not useful and only gets in the way, at least for now. They might also be tasks
    that you strongly believe should remain human, with no AI help. As AI improves,
    the latter category likely becomes more important than the former. For example,
    AI is currently terrible at jokes, unless you absolutely love dad humor. (Don’t
    take my word for it. I asked it to tell me a joke to disprove this assertion,
    and the AI responded: “I think AI can be funny sometimes. Here’s a joke for you:
    What do you call a fish that wears a bowtie? Sofishticated. ![](images/Emoji_Fish.jpg)”
    . . . I rest my case.) So joke writing would be a `Just Me Task`, because it is
    something the AI cannot do. But remember the fourth principle: this is the worst
    AI you will ever use. By the time you read this, AI comedians may have become
    very good. Which brings us to the second type of `Just Me Task`: Do we even want
    AI to write jokes?


    We have already seen that there is not a clear bright shining line of “human things”
    that the AI cannot do. It does a good job approximating empathy, creativity, and
    humanity. Trying to find things that AI can definitely not do because they are
    uniquely human may ultimately be challenging. But that doesn’t mean we want AI
    to do all these things. We may reserve `Just Me Tasks` for personal or ethical
    reasons, such as raising our children, making important decisions, or expressing
    our values.


    Almost all the writing in this book is a `Just Me Task`. There are three reasons
    for this. First, the AI is good at writing, but not that good at writing with
    a personal style. I think, or fear, that is likely a temporary situation. I can
    already get a pretty good approximation of my tone by working with the AI. To
    see how that works, I gave the AI the `text of this chapter, up until this sentence,
    and asked it: `Describe my writing style`. It told me that my writing is a blend
    of academic rigor, personal insight, and practical advice, presented in a conversational,
    accessible manner.


    It is always nice to get a flattering analysis, but now I can go further, asking
    the AI to clone my tone and approach: `Continuing in this style, write me a paragraph
    about why an author may not want to delegate writing to an AI, even if it is a
    good writer`. And the AI responds:


    > ![](images/page_18.jpg)“While it’s true that AI has made impressive strides
    in writing capabilities, there are compelling reasons why an author might choose
    to keep their pen (or keyboard) firmly in hand. For one, writing is an intensely
    personal process. It’s a way to bring unique insights, experiences, and voice
    to the page. Each sentence we write is imbued with our individuality and perspective,
    creating a connection with the reader that is uniquely human. Delegating this
    task to an AI, no matter how sophisticated, could risk losing that personal touch.
    Furthermore, the act of writing can be a journey of self-discovery, an opportunity
    to clarify our thoughts, and a way to engage deeply with our subject matter. By
    handing over the reins to AI, we could potentially miss out on these enriching
    experiences.


    ### The Nature of Just Me Tasks


    While AI is increasingly capable, there are tasks that should remain human. Delegating
    this task to an AI, no matter how sophisticated, could risk losing that personal
    touch. Furthermore, the act of writing can be a journey of self-discovery, an
    opportunity to clarify our thoughts, and a way to engage deeply with our subject
    matter. By handing over the reins to AI, we could potentially miss out on these
    enriching experiences.


    We have already seen that there is not a clear bright shining line of “human things”
    that the AI cannot do. It does a good job approximating empathy, creativity, and
    humanity. Trying to find things that AI can definitely not do because they are
    uniquely human may ultimately be challenging. But that doesn’t mean we want AI
    to do all these things. We may reserve `Just Me Tasks` for personal or ethical
    reasons, such as raising our children, making important decisions, or expressing
    our values.


    Almost all the writing in this book is a `Just Me Task`. There are three reasons
    for this. First, the AI is good at writing, but not that good at writing with
    a personal style. I think, or fear, that is likely a temporary situation. I can
    already get a pretty good approximation of my tone by working with the AI. To
    see how that works, I gave the AI the `text of this chapter, up until this sentence,
    and asked it: `Describe my writing style`. It told me that my writing is a blend
    of academic rigor, personal insight, and practical advice, presented in a conversational,
    accessible manner.


    It is always nice to get a flattering analysis, but now I can go further, asking
    the AI to clone my tone and approach: `Continuing in this style, write me a paragraph
    about why an author may not want to delegate writing to an AI, even if it is a
    good writer`. And the AI responds:


    ### Delegated Tasks


    Delegated Tasks are those that we hand off to AI but still maintain oversight.
    They are not necessarily simple; they can be complex. They are also not risk-free;
    they can have serious consequences if done incorrectly by the AI system. You will
    still check over the results and confirm they are right, though this may become
    harder as AI improves. The whole goal of delegation is to save us time and allow
    us to focus on tasks where we can be, or want to be, value.


    I delegated one task to AI in this chapter and, ironically, that consisted of
    summarizing the work of Fabrizio DellAcqua, author of the `Falling Asleep at the
    Wheel` paper. It is a good paper, though a long one, and summarizing is often
    a time-consuming and challenging task. Having known and admired Fabrizio’s work,
    I felt comfortable that I could check, and alter, the AI-generated summary of
    his paper without having to do the work of summarizing it myself. I made significant
    changes to the output of the AI, but delegating this task, rather than rereading
    and summarizing the paper myself, probably saved me thirty minutes. I then emailed
    Fabrizio the summary and asked what he thought of it (not revealing my AI helper).
    He approved, with a few small suggestions that I made for the final version you
    read earlier. Without AI help, I would have probably done a less impressive job,
    so this was a successfully delegated task.


    ### Automated Tasks


    These are tasks you leave completely to the AI and don’t even check on. Perhaps
    there is a category of email that you just let AI deal with, for example. This
    is likely to be a very small category for now. Today, AI makes too many mistakes
    to use in an automated fashion. Though that starts to change when other systems
    enforce the accuracy of AI answers. For example, I often ask it to write `Python`
    programs to solve problems. I don’t know `Python`, but if the AI makes a mistake,
    the code will not work. Further, the AI takes the error code the `Python` compiler
    generates and uses that to adjust its own strategy. You will want to keep an eye
    on the growing capabilities of AI in the future to see how opportunities to automate
    tasks might grow.

