  trans: '

    在自我介绍后，Steve 提出了以下建议：


    ### 清晰度与结构

    有时，文本可能需要更清晰的指引和过渡。例如，在引入“工作、任务与系统（Jobs, Tasks, and Systems）”这一概念之前，如果有这样一句过渡句可能会有用：“让我们拆解工作的不同方面——工作、任务和系统——以充分理解
    AI 如何影响它们的每一个方面。”


    ### 术语

    你引入了许多术语（`Just Me Tasks` 个人任务、`Delegated Tasks` 委托任务、`Centaur` 半人马和 `Cyborg Tasks`
    机械人任务），在深入探讨示例之前，用更直接的方式定义这些术语会有帮助。在开头给出简明扼的定义有助于读者更好地跟随。


    作为一名读者，我觉得这一章内容丰富、引人入胜且发人深。我期待看到最终成品！


    Steve 的建议塑造了这一章节，并极大地帮助我编辑了作品。这种来自 AI 团队的特定建议在以前是不可能的，它大大改变了我的写作方式，但没有直接改变我的风格或语气。使用
    AI 让我从未失去过动力，而且它经常带给我我以前从未想过的主意。


    将 AI 作为协作智能（co-intelligence），正如我在写作时所做的那样，这是 AI 价值所在。如果可以，自己想出一个方法。作为一个起点，遵循第一原则（邀请
    AI 参与一切），直到你开始了解你工作中 `Jagged Frontier`（锯齿边界）的轮廓。这将让你知道 AI 能做什么，不能做什么。然后开始像 `Centaur`（半人马）一样工作。将那些你讨厌但可以轻松检查的任务（如编写无意义的报告或低优先级邮件）交给
    AI，看看这是否能改善你的生活。随着你发现 AI 在克服小障碍和帮助棘手任务方面不可或缺，你可能会自然地过渡到 `Cyborg`（机械人）模式。那时，你就找到了一个协作智能。


    你必须记住，AI 正在发生变化，这些任务类型之间的边界是渗透的，并且可能会随着 AI 能力的提高而移动。今天我们由于 AI 能力合格但并不完美而委托给它的任务，未来随着性能在更多领域达到人类水平，可能会转向完全自动化。同样，如果
    AI 变得足够熟练可以流地协作而不仅仅是辅助，一些 `Just Me Tasks` 最终可能会进入 `Centaur` 类别。随着双方的进步，人类目前无法想象的新创意前疆可能会为人机共生而开辟。当我们意识地决定某些带有情感色彩或伦理疑疑的责任应仅由人类承担时，这一光谱也会向另一个方向移动。


    对于工作者来说，这些流动的类别意味着 AI 的影响是逐渐感受到的，随着我们适应其不断增强的力量，而不是通过单一的冲击。随着人类和机器能力的维恩图演变，我们对合适角色和责任的观念也必须随之演变。员工使用
    AI 做的事情与他们公司和组织所做的事情之间可能会出现越来越多的脱节。


    ### 秘密任务自动化


    今天，数十亿计的人可以使用 `Large Language Models`（大语言模型）以及它们带来的生产力优势。从几十年来对从管道工、管理员到外科医生等所有人的创新研究中，我们知道，当人们可以使用通用工具时，他们会想办法利用这些工具让自己的工作变得更容易、更好。结果往往是突破性的发明，是完全改变业务的
    AI 使用方法。人们正在简化任务，采用新的编码方法，并自动处理工作中耗时且枯燥的部分。但这些发明者并没有告诉公司他们的发现；他们保持着秘密。至少有三个这些
    `Cyborgs` 和 `Centaurs` 保持秘密的原因。但它们都归结为同一点：人们不想惹麻烦。


    问题始于组织政策。从 `J.P.Morgan` 到 `Apple`，许多公司最初禁止使用 `ChatGPT`，通常是因为法律顾虑。但这些禁令产生了很大影响……它们导致员工把手机带进办公室并通过个人设备访问
    AI。虽然数据很难获得，但我已经发现许多在禁止的情况下的公司里通过这种绕过方法使用 AI——而他们恰恰是那些愿意承认的人！而且这种影子 IT（shadow
    IT）使用在组织中很常见，但它激励了员工隐瞒创新和生产力收益。


    这并不是唯一的原因，AI 用户还担心暴露自己是 `Cyborg`（机械人）。AI 使用的很大价值源于人们不知道你在使用它。AI 以类人类写作的能力非常强大，但只有在人们认为它是来自人类时如此。我们从研究中知道，当人们得知收到的是
    AI 生成的内容时，他们的判断会有不同。出乎意料的是，当我进行了一次不科学的 Twitter 调查时，超过半数的生成式 AI 用户报告曾在不知情的情况下使用。


    所有这些影子使用导致了最终的担忧，即合理担心工人通过学习如何与 AI 工作来培养自己的替代者。如果有人想出了如何自动化 90% 的工作，并告诉了老板，公司会解雇
    90% 的同事吗？最好不要说。


    组织应对新技术的通常方式对 AI 都不起作用。它们都太集中，也太慢了。IT 部门无法轻松构建内部 AI 模型，更不用说与 `Frontier LLMs`（前沿大模型）竞争的模型。顾问和系统集成商对于如何让
    AI 服务特定公司没有特殊知识，甚至整体使用 AI 的最佳方法。组织内部的创新小组和战略委员会制定政策，但没有理由相信任何组织的领导者都是理解 AI 如何帮助特定员工完成特定任务的专家。事实上，他们在寻找
    AI 最佳用例方面可能糟糕。个人工作者敏锐地感知自己的问题，并能尝试许多替代方案，他们可能发现强大且有针对性的用途。


    至少目前，组织从 AI 中获益的最佳方法是寻求其最先进用户的帮助，同时鼓励更多工作者使用 AI。这将要求组织的运作方式发生重大变化。首先，他们需要意识到，找出如何最佳使用
    AI 的员工可能处于组织的任何层，具有任何背景或过去的绩效记录。

