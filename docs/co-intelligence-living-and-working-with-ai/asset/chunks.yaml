  trans: '

    随着时间的推移和通过无数次的迭代，学徒厨师的储藏变得越来越整齐和准确。现在的权重反映了词汇和短语之间有意义的联系，学徒已经蜕变为了大师厨师。在给定提示（prompt）时，大师厨师会从其庞大的素材库中巧妙地选择合适的食材，并咨询他们精细的调料架，以确保味道的完美平衡。类似，AI
    创建了类人类的文本，既引人入胜、信息丰富又与当前主题相关。


    训练 AI 做到这一点是一个迭代过程，需要强大的计算机来处理从数十亿词中学习时涉及的巨大计算。这一预训练阶段是 AI 构建如此昂贵的主要原因之一。预训练期间需要配备昂贵芯片的高速计算机运行数月，这很大程度上导致了更先进的大语言模型（LLMs）训练成本超过
    1 亿美元，并在过程中消耗了大量的能量。


    许多 AI 公司对它们用于训练的原始源文本（称为训练语料库）保持保密，但典型的训练数据示例很大程度上由从互联网、公领域书籍、研究文章以及研究人员可以找到各种其他免费内容源中提取的文本组成。实际上详细研究这些来源会发现一些奇特的材料。例如，因公司欺诈而倒闭的安然公司（Enron）整个邮件数据库被用作许多
    AI 训练材料的一部分，仅仅因为它是免费向 AI 研究人员提供的。同样，训练数据中包含了大量的业余浪漫小说，因为互联网充满了业余小说家。寻找高质量的训练材料已成为
    AI 开发中的一个大课题，因为渴求信息的 AI 公司正面临优质免费来源枯竭。


    因此，大多数 AI 训练数据也可能包含受版权保护的信息，无论是在无意还是有意的情况下未经许可使用的书籍。这在法律上的影响尚不明确。由于这些数据被用于创建权重，而不是直接复制到
    AI 系统中，一些专家认为这超出了标准版权法的范畴。在未来几年里，这些问题可能会由法院和法律系统解决，但它们在 AI 训练的早期阶段造成了伦理和法律上的不确定性。在此，AI
    公司正在寻找更多数据用于训练（一项估计显示，在线书籍和学术文章等高质量数据将在 2026 年耗尽），并继续使用低质量的数据。此外，人们还在积极研究 AI 是否能够在其自身内容上进行预训练。这就是下棋
    AI 已经在做的事情，通过与自己对弈来学习，但目前还不清楚这对于 LLM 是否有效。


    由于使用的数据源具有多样性，学习并不总是一件好事。AI 也会从它看到的数据中学习偏见、错误和虚假信息。在预训练刚结束，AI 并不一定会产生人们对提示所预期的那种结果。更糟糕的是，它没有伦理边界，并乐意提供如何挪用资金、杀人或在网上跟踪某人的建议。预训练模式下的
    LLM 就像镜子一样，只反映它们学习过的任何内容，而不进行任何判断。因此，在学习了预训练所有的文本示例后，许多 LLM 会在第二阶段进行进一步改进，被称为“微调”。


    一种重要的微调方法是将人类引入这一过程，而这个过程以前主要是自动化的。AI 公司聘佣工人（有些是高薪专家，其他是肯尼亚等英语国家的低薪合同工）来阅读 AI
    的回答并根据各种特征对其进行判断。在某些情况下，这可能是对准确性进行评分；在另一些情况下，可能是为了筛选掉暴力或色情答案。这些反馈随后被用于额外的训练，微调
    AI 的性能以符合人类的偏好，提供额外的学习以强化好的答案并减少坏答案，这就是为什么这个过程被称为来自人类反馈的强化学习（`RLHF`）。


    在 AI 经过这一最初的强化学习阶段后，它们可以继续进行微调。这种微调通常通过提供更具体的示例来让模型调整，例如，通过观察哪些回答获得了用户的“点赞”或“踩”来实现。这种微调可以使模型的响应更符合特定需求。

