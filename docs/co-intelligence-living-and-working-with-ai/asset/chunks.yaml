  trans: '


    当 AI 触及人类最深层的创作任务——艺术时，会发生什么？艺术家们对 AI 工具的快速侵入感到警觉。其中一些担忧源于审美层面。著名音乐人尼克·凯夫（Nick
    Cave）将 AI 尝试创作“尼克·凯夫风格”歌词的行为描述为“对人类本质的荒诞嘲弄”。动画大师宫崎骏称 AI 艺术“是对生命本身的侮辱”。当一位艺术家用
    AI 生成的作品赢得比赛时，引发了抗议，但获奖艺术家却为 AI 作品辩护道：“艺术死了，哥们。结束了。AI 赢了。人类输了。”


    艺术的意义是一个古老的辩题，而且在这本书或其他任何书中都不可能得到解决。艺术家面临的焦虑很快可能会随着 AI 与其职业的重叠而让许多其他职业感受到。然而，这结果可能是创造力和艺术的复兴，而非它们的崩溃。


    AI 是在人类海量的文化遗产上进行训练的，因此它通常最适合对这些遗产了解的人来操控。要让 AI 做出独特的东西，你需要比其他使用相同 AI 系统的人更深地理解文化的某些部分。因此，在许多方面，人文科学类专业的学生可以产出最有趣的“代码”。作家通常是擅长提示
    AI 生成写作材料的人，因为他们擅长描述他们希望散文营造的效果（“以一种不祥的基调结束”、“让语调变得越来越狂热”）。他们是出色的编辑，所以可以向 AI 反馈指令（“让第二段更生动”）。通过熟悉大量的案例，他们可以快速针对受众和风格进行实验（“让这个看起来像*新纽约人*里的东西”、“用约翰·麦克菲的风格做这个”）。他们还能够操纵叙事，让
    AI 按他们想要的方式思考。ChatGPT 不生成乔治·华盛顿与特里·格罗斯的采访，因为这种场景看起来不现实。但如果你说服它乔治·华盛顿可能有一台时光机，它就会乐意回答。


    视觉艺术领域正在发生类似的现象。AI 图像生成器对过去的画作、水彩、建筑、摄影、时尚和历史图像进行了深度训练。用 AI 创建出有趣的东西需要你调用这些联系来创造新颖的图像。但大多数人实际上用
    AI 艺术工具创作的东西完全不同，而且野心也小得多。有大量的《星大战》艺术、很多电影星的伪造照片、一些动漫、赛博朋克、大量的超级英雄（尤其是蜘蛛侠），而且奇怪的是，还有**非常多**名人大理石像。面对一台可以制造任何东西的机器，我们仍然倾向于我们熟悉的东西。


    但 AI 还可以做多得有趣的事情！AI 可以创建一个蜘蛛侠的大理石像，但也可以输出一个非常惊人的浮世绘木版蜘蛛侠，或者阿尔尔丰斯·慕莎风格的蜘蛛侠，甚至是与蜘蛛侠完全无关的图像（令人惊叹）。但你需要知道自己想要什么。结果是，使用
    AI 系统的人中对艺术史的兴趣产生了一种奇特的复兴，巨大的艺术风格表格在潜在的 AI 艺术家之间流传。人们对艺术史和通用艺术风格了解越多，这些系统就变得越强大。尊重艺术的人可能更愿意避免以模仿生活、工作的艺术家的方式来使用
    AI。因此，对艺术及其历史更深层次的理解可能不仅导致（希望如此的话）。


    ## 创作作品的意义


    对艺术及其历史更深层次的理解可能不仅导致（希望如此的话）。我知道它是很有用的。我正在制作别人喜欢的东西（当项目需要精细的新工作时，我仍然会聘佣和以前一样多的艺术家）。这可能不是艺术，但在创作上是充实且有价值的。我从更有才华的人那里学习，他们分享他们的成果、在线文档和大量的实验。我已经练得很擅长了，我知道这一点，因为第一次使用这些工具的人无法获得相同的结果。我也知道它是很有用的……这也是我以前从未能做到的。


    直到 2022 年 7 月 28 日。那是我第一次接触到 AI 程序 `Midjourney` 的时候。我瞬间被它的力量所吸引，花了一整天时间创作图像。到了第二天，就有超过
    2 万人点赞了那个推文。学者们告诉我，他们把这些图像打印出来挂在墙上。我制作了别人喜欢的东西。


    那是艺术吗？可能不是——无论如何，那是哲学家们的问题。但我知道它是创造性的。我感受到了创造某种东西的快感，那种来自深度投入和专注的“流”感。我经常需要制作和修改几十张图像才能得到一张我喜欢的。许多实验的结果很糟糕，但在开发提示词、向
    AI 反馈图像并观察发生什么时，仍然有乐趣。我知道其中涉及技巧。我从更有才华的人那里学习，他们分享他们的成果、在线文档和大量的实验。我已经练得很擅长了，我知道这一点，因为第一次使用这些工具的人无法获得相同的结果。这些效果超越了艺术。生成式
    AI 正在为人们的创作冲动提供新的表达模式和新语言——有时是字面上的。我曾听学生提到，他们因为写作不好而没有被认真对待。多亏了 AI，他们的文字材料不再阻碍他们，他们凭借经验和面试获得了工作机会。自从在课程中要求使用
    AI 后，我再也看不到任何糟糕的作品了。随着我的学生的学习，发现，如果你与 AI 进行交互式工作，结果并不会平庸，它感觉像是人类完成的。


    尽管如此，如果只看到这里的积极的一面也是天真的。特别是当 AI 作品通过点击一个按钮就能轻松生成时。我指的是字面上的意思，因为每个主要的办公应用程序和电子邮件客户端都将包含一个帮助你创建草稿的按钮。它值得大写：那个按钮。


