- fmt: '

    Even if AI doesn’t advance further, some of its implications are already inevitable.
    The first set of certain changes from AI is going to be about how we understand,
    and misunderstand, the world. It is already impossible to tell AI-generated images
    from real ones, and that is simply using the tools available to anyone today.
    Video and voice are also trivially easy to fake. The online information environment
    is going to become completely unmanageable, with fact-checkers overwhelmed by
    the flood. It is only slightly harder to create fake images now than to take real
    photographs. Every image of a politician, celebrity, or a war could be made up—there
    is no way to tell. Our already fragile consensus about what facts are real is
    likely to fall apart, quickly.


    Technological solutions are unlikely to save us. Attempts to track the provenance
    of images and videos by watermarking AI creations can be defeated with relatively
    simple alterations to the underlying content. And that assumes that the people
    faking images and videos are using commercial tools—identifying AI-generated content
    will become even harder as governments develop their own systems and open-source
    models proliferate. Perhaps, in some future, AI can help us filter through the
    chaff, but AIs are notoriously unreliable at detecting AI content, so this seems
    unlikely as well.


    There are really only a couple of ways that this could work out. Perhaps there
    will be a resurgence of trust in mainstream media, which might be able to act
    as arbiters of what images and stories are real, carefully tracking the provenance
    of each story and artifact. But that seems unlikely. A second option is that we
    further divide into tribes, believing the information we want to believe and ignoring
    as fake any information we don’t want to pay attention to. Soon, even the most
    basic facts will be in dispute. This growth of ever more insular information bubbles
    seems much more likely, accelerating the pre-LLM trend. A final option is that
    we turn away from online sources of news entirely, because they are so polluted
    with fake information that they stop becoming useful. Regardless of which direction
    we head in, even without advances in AI, the way we relate to information will
    change.


    Our personal relationship with AI will change as well. Current systems are already
    good enough to seem human, and with small amounts of tuning, research has shown
    that AIs can be even more engaging, perhaps worryingly so. One large experiment
    on a platform with millions of users shows that training a model to produce results
    that keep people chatting leads to 30 percent more user retention and much longer
    conversations. That suggests that, even without technological advancement, chatting
    with bots is going to get significantly more compelling. Current systems are not
    good enough to be deep conversation partners, but we may start to see individuals
    choosing to interact more with AI than with humans.


    And other trends we have already discussed are now also inevitable. Even assuming
    no further improvement in `LLMs`, AIs will have a large impact on the tasks of
    many workers, especially those in highly paid creative and analytical work. However,
    AIs in their present state leave plenty of room for `Cyborg` tasks, and human
    ability exceeds AI abilities in many cases. While work will change if AI did not
    develop further, it would likely operate as a complement to humans, relieving
    the burden of tedious work and improving performance, particularly among low performers.
    That doesn’t mean some jobs and industries will not be under threat—most translation
    work, for example, is likely to be largely displaced by AI—in most cases, though,
    AI would not replace human labor. Current systems are not good enough in their
    understanding of context, nuance, and planning.


    That is likely to change.


    ### Scenario 2: Slow Growth


    AI has been increasing in ability at an exponential pace, but most exponential
    growth in technology eventually slows down. AI could hit that barrier soon. Practically,
    that means that rather than increasing in capacity by ten times a year, growth
    slows, increasing maybe 10 percent, or 20 percent, a year instead. There are many
    reasons this might happen. Ballooning training costs and regulatory requirements
    are possibilities. So is the possibility that we will soon hit technical limits
    for Large Language Models, as a number of scientists, including professor (and
    chief AI scientist at Meta) Yann LeCun, have argued. This will require us to find
    new technological approaches to developing AI in order to continue. However it
    happens, this slower improvement would still represent an impressive rate of change,
    though one we can understand. Think of how televisions get a bit better every
    year. You don’t need to throw out your old TV, but new ones are likely quite a
    bit better and cheaper than the one you bought a few years ago. With this sort
    of linear change, we can see the future coming and plan for it.


    Everything that happens in Scenario 1 still happens. Bad actors still use AI to
    fake online information, but as time goes on, the ability of AI to do more complex
    work makes them more dangerous. Your email inbox becomes flooded with precisely
    targeted messages that are personalized to you (ad companies are already doing
    personalized videos for millions of users via AI), some of which are scams or
    phishing attempts. You receive phone calls in the voice of loved ones asking for
    bail money. During the next war, every Defense Department official begins receiving
    very specific threatening text messages featuring AI-generated videos of their
    family. Incompetent criminals and terrorists take advantage of the ability of
    AI to raise performance to become more effective killers.


    These are scary possibilities, but because AI is advancing in a measured pace,
    the worst bad outcomes don’t come to pass. Early incidents where AIs are used
    to generate dangerous chemicals or weapons could result in effective regulation
    to slow down the proliferation of dangerous uses. Coalitions of companies and
    governments, or perhaps open-source privacy advocates, could have the time to
    develop usage rules that allow people to establish their identity in a way that
    can be verified, removing some of the threat of impersonation.


    And every year the personas generated by AIs get more realistic, pushing the frontiers
    further. Video games are populated by AI-generated nonplayer characters, and the
    first personalized AI movies begin to appear, in which you can select the way
    scenes or characters play out. It becomes more normal to use an AI therapist,
    and interacting with a mix of real humans and AI chatbots becomes a regular way
    we do business. Again, the slower growth of AI provides an opportunity for society
    to adjust to this change. Laws require AI content to be labeled, and social norms
    around using chatbots as friends continue to make sure that most people spend
    their time with real human beings.


    Work becomes ever more transformed. Each year, AI models do more than they were
    capable of the year before, creating waves that ripple across industry after industry.
    First, the $100 billion a year call-center market is transformed as AI agents
    start to supplement human ones. Next, most advertising and marketing writing are
    done primarily by AI, with limited guidance from human `Cyborg`. Soon, AI is performing
    many analytical tasks and doing increasing amounts of coding and programming work.
    By and large, though, the slower pace of change means that this wave of disruption
    looks like that of past General Purpose Technologies. Tasks change more than jobs,
    and more jobs are created than destroyed. A major focus on retraining and focusing
    skills on working with AI helps mitigate the worst risks.

    '
