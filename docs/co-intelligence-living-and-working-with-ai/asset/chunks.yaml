    So let’s consider what it takes to build expertise. First, it requires a basis
    of knowledge. Humans actually have many memory systems, and one of them, our working
    memory, is the brain’s problem-solving center, our mental workspace. We use our
    working memory’s stored data to search our long-term memory (a vast library of
