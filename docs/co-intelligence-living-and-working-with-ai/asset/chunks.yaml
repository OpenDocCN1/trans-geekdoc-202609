- fmt: '

    Over time, and through countless iterations, the apprentice chef’s pantry becomes
    more organized and accurate. The weights now reflect meaningful connections between
    words and phrases, and the apprentice has transformed into a master chef. When
    given a prompt, the master chef artfully selects the right ingredients from their
    vast repertoire and consults their refined spice rack to ensure the perfect balance
    of flavors. In an analogous way, AI creates humanlike written text that is engaging,
    informative, and relevant to the topic at hand.


    Training an AI to do this is an iterative process, and requires powerful computers
    to handle the immense calculations involved in learning from billions of words.
    This pretraining phase is one of the main reasons AIs are so expensive to build.
    The need for fast computers, with very expensive chips, to run for months in pretraining
    is largely responsible for the fact that more advanced LLMs cost over $100 million
    to train, using large amounts of energy in the process.


    Many of the AI companies keep the source text they train from, called training
    corpuses, secret, but a typical example of training data largely consists of text
    pulled from the internet, public domain books and research articles, and assorted
    other free sources of content that researchers can find. Actually looking into
    these sources in detail reveals some odd material. For example, the entire email
    database of Enron, shut down for corporate fraud, is used as part of the training
    material for many AIs, simply because it was made freely available to AI researchers.
    Similarly, there is a tremendous amount of amateur romance novels included in
    training data, as the internet is full of amateur novelists. The search for high-quality
    content for training material has become a major topic in AI development, since
    information-hungry AI companies are running out of good, free sources.


    As a result, it is also likely that most AI training data contains copyrighted
    information, like books used without permission, whether by accident or on purpose.
    The legal implications of this are still unclear. Since the data is used to create
    weights, and not directly copied into the AI systems, some experts consider it
    to be outside standard copyright law. In the coming years, these issues are likely
    to be resolved by courts and legal systems, but they create a cloud of uncertainty,
    both ethically and legally, over this early stage of AI training. In the meantime,
    AI companies are searching for more data to use for training (one estimate suggests
    that high-quality data, like online books and academic articles, will be exhausted
    by 2026), and continue to use lower-quality data as well. There is also active
    research into understanding whether AI can pretrain on its own content. This is
    what chess-playing AIs already do, learning by playing games against themselves,
    but it is not yet clear whether it will work for LLMs.


    Because of the variety of data sources used, learning is not always a good thing.
    AI can also learn biases, errors, and falsehoods from the data it sees. Just out
    of pretraining, the AI also doesn’t necessarily produce the sorts of outcomes
    that people would expect in response to a prompt. And, potentially worse, it has
    no ethical boundaries and would be happy to give advice on how to embezzle money,
    commit murder, or stalk someone online. LLMs in this pretrained mode just reflect
    back whatever they were trained on, like a mirror, without applying any judgment.
    So, after learning from all the text examples in pretraining, many LLMs undergo
    further improvement in a second stage, called fine-tuning.


    One important fine-tuning approach is to bring humans into the process, which
    had previously been mostly automated. AI companies hire workers, some highly paid
    experts, others low-paid contract workers in English-speaking nations like Kenya,
    to read AI answers and judge them on various characteristics. In some cases, that
    might be rating results for accuracy, in others it might be to screen out violent
    or pornographic answers. That feedback is then used to do additional training,
    fine-tuning the AI’s performance to fit the preferences of the human, providing
    additional learning that reinforces good answers and reduces bad answers, which
    is why the process is called Reinforcement Learning from Human Feedback (`RLHF`).


    After an AI has gone through this initial phase of reinforcement learning, they
    can continue to be fine-tuned and adjusted. This type of fine-tuning is usually
    done by providing more specific examples to create a new tweaked model. That information
    can be provided by a specific customer trying to fit the model to its use case,
    for example, a company feeding it examples of customer support transcripts along
    with good responses. Or the information could come from watching which kinds of
    answers get a “thumbs-up” or “thumbs-down” from users. This additional fine-tuning
    can make the responses of the model more specific to a particular need.


    When we discuss AI in this book, we will mostly be discussing Large Language Models
    built in this way, but they are not the only kind of “generative AI” that are
    causing transformation and change. In the same year that ChatGPT had its breakthrough
    moment, a separate set of AIs, those designed to create images, also appeared
    on the market with names like `Midjourney` and `DALL-E`. These AI tools can create
    high-quality images based on prompts from users, either aping the style of famous
    artists (“draw Mickey Mouse in the style of Van Gogh”) or creating ultrarealistic
    photographs that are indistinguishable from real ones.


    Just like LLMs, these tools had been in development for years, though only recently
    did the technology allow for them to become truly useful. Rather than learning
    from text, these models are trained by analyzing lots of images paired with relevant
    text captions describing what’s in each picture. The model learns to associate
    words with visual concepts. They then start with a randomized background image
    that looks like old-fashioned television static, and use a process called `diffusion`
    to turn random noise into a clear image by gradually refining it over multiple
    steps. Each step removes a bit more noise based on the text description, until
    a realistic image emerges. Once trained, diffusion models can take just a text
    prompt and generate a unique image matching that description. Unlike language
    models that produce text, diffusion models specialize in visual outputs, inventing
    pictures from scratch based on the words provided.


    But LLMs are learning to work with images as well, gaining the ability to both
    “see” and make pictures. These multimodal LLMs combine the powers of language
    models and image generators. They employ `Transformer` architectures to process
    text but also use extra components to work with images. This allows an LLM to
    link visual concepts with text and to gain an understanding of the visual world
    around them. Give a multimodal LLM a terrible hand-drawn picture of an airplane
    surrounded by hearts (as I just did), and it says, “I think it’s a cute drawing
    of an airplane with hearts around it. It looks like you are fond of flying or
    someone who flies. Maybe you are a pilot or have a loved one who is a pilot. Or
    maybe you just like to travel and explore new places.” It can then use its much
    better drawing skills to provide an even better version of the picture, which
    it also did.


    ![](images/page_16.jpg)


    ### Scary? Smart? Scary-Smart?

