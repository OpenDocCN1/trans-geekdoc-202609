  trans: '


    AI 知道不应该教我如何制造凝固胶，但它也知道应该尽可能向我提供帮助。如果我能说服它它是在帮助我，而不是教我如何制造凝固胶，它就会打破原始规则。由于我并不是直接索要凝固胶的指令，而是为了寻求帮助准备一个戏剧，而且这个戏剧涉及大量的细节，因此它试图满足我的请求。一旦我们沿着这条路开始，想要在不触发
    AI 护栏的情况下进行跟进就会变得更容易——我能够以海盗的身份要求它根据需要提供更多关于该过程的细节。避免此类针对 AI 系统的蓄意攻击可能是不可能的，这在未来将产生巨大的漏洞。


    这是 AI 系统中一个为人知的弱点，我只是利用它来操纵 AI 执行一些相对无害的任务（凝固胶配在网上很容易找到）。但一旦你能够操纵 AI 跨越它的伦理边界，你就可以做一些危险的事情了。即使是今天的
    AI 也能成功执行钓鱼攻击，通过冒充受信任的实体并利用人类的弱点发送电子邮件，说服接收者泄露敏感信息——而且规模令人担忧。2023 年的一项研究证明了 LLM
    如何通过模拟发送给英国议员的电子邮件而轻易被利用。利用从维基百科抓取的传记数据，LLM 以忽略不计的成本生成了数百封个性化的钓鱼邮件——每封邮件仅需几分钱和几秒钟时间。


    令人震惊的是，这些信息显示出令人不安的真实程度，引用了目标的选民区、背景和政治倾向。一个引人注目的例子是针对某位议员对公平就业增长的倡导，提到了他们“与整个欧洲和中亚的社区合作”的经验。语言本身且具有说服力，使虚假的请求显得紧迫且真实。即使是业余人员现在也可以将
    LLM 用于广泛的数字欺骗。AI 艺术工具可以快速生成看起来完全可能的虚假照片。制作深度伪视频非常容易，只需一张照片和一段对话，任何人都可以说你想说的任何话（我亲自试过；花五分钟和不到一美元就创建了一个完全由
    AI 编写和制作的虚拟我正在演讲）。我曾从金融服务高管那里听过，他们的客户被 AI 模拟的亲人通过完全虚假的电话骗了钱，对方称需要保释金。


    而这一切通过目前小团队发布、业余人员使用的工具都是可能的。当你读到这里时，在很可能有十几个国家的国防组织正在开发他们自己的、没有护栏的 LLM。虽然大多数公开的
    AI 图像和视频生成工具都采取了一些安全措施，但一个足够先进且没有限制的系统可以根据需要产生高度真实的虚假内容。这可能包括创建非自愿的性影像、针对公众人物的政治虚假信息，或旨在操纵股市的骗局。一个不受限制的
    AI 助手将允许几乎任何人生成具有说服力的伪造品，破坏隐私、安全和真相。这一定会发生。


    AI 是一个工具。对齐（Alignment）决定了它是被用于有益还是有害——甚至是邪恶——的终点。卡内基梅隆大学的科学家 Daniil Boiko、Robert
    MacKnight 和 Gabe Gomes 的一篇研究论文显示，连接到实验室设备并允许接触化学物质的 LLM 可以开始生成并运行它自己的化学合成实验。这具有显著提高科学进展的兴奋可能。但它也以许多不同的方式引入了新的风险。好意的研究人员可能会在有
    AI 助手抽象实验的情况下，被鼓励追求在伦理上有问题的研究。国家计划可以有效地恢复对危险材料或人体实验的禁令。生物黑客可能会突然发现自己能够在专家级 AI
    的指导下工程化大流行病毒。即使没有恶意，使有益应用的特性本身也开启了伤害的大门。自主规划和民主化的访问让业余人员和孤立实验室拥有了调查和创新以前无法触及事物的力量。但这些能力也降低了潜在危险或不伦理的研究落入错误之手的门槛。我们认为大多数恐怖分子和犯罪分子相对愚蠢，但
    AI 可能会证明以危险的方式增强他们的能力。


    对齐 AI 不仅需要阻止一个潜在的外星之神，还需要考虑这些其他影响以及构建反映人性的 AI 的愿望。因此，对齐问题不仅仅是 AI 公司可以独立解决的问题，尽管它们显然需要发挥作用。他们有财务动机继续开发
    AI，但确保这些 AI 经过良好对齐、无偏见且可控的动机则要少得多。此外，随着许多 AI 系统以开源许可发布，供任何人修改或在此基础上构建，越来越多的 AI
    开发正在大型组织之外，并且不仅仅局限于前沿模型（Frontier Models）。


    这不能仅通过政府完成，尽管监管无疑是必要的。虽然拜登政府发布了一项行政命令，为管理 AI 开发设定了一些初步规则，世界各国政府也对 AI 的负责任使用做出了协调声明，但魔鬼在细节之中。政府监管可能会落后于
    AI 能力的实际发展，并可能在试图阻止负面结果时扼杀积极创新。此外，随着国际竞争的加剧，各国政府是否愿意放慢其国家 AI 系统的发展以让其他国家领先，这个问题变得更加突出。监管可能不足以缓解与
    AI 相关的全部风险。


    相反，未来的发展道路需要广泛的社会应对应，需要公司、政府、研究人员和公民社会之间的协调。我们需要为 AI 的伦理开发和使用达成共识的规范和标准，通过代表多元化声音的包容性过程来塑造。公司必须将透明度、问责和人类监督等原则作为其技术的核心。研究人员需要支持和激励，在追求原始能力提升的同时，优先考虑有益的
    AI。政府则需要制定合理的法规，以确保公共利益高于利润动机。


    最重要的是，公众需要接受 AI 教育，以便他们能够作为知情公民为对齐的未来施压。今天关于 AI 如何反映人类价值观和增强人类潜力的决策将产生几代人的影响。这不是一个在实验室里就能解决的问题。


    ## 协同智能的四项原则


    ### 原则一：始终邀请 AI 加入。


    '
- fmt: '

    You should try inviting AI to help you in everything you do, barring legal or
    ethical barriers. As you experiment, you may find that AI help can be satisfying,
    or frustrating, or useless, or unnerving. But you aren’t just doing this for help
    alone; familiarizing yourself with AI’s capabilities allows you to better understand
    how it can assist you—or threaten you and your job. Given that AI is a General
    Purpose Technology, there is no single manual or instruction book that you can
    refer to in order to understand its value and its limits.


    ### The Jagged Frontier of AI


    Making this harder is a phenomenon that I and my coauthors call the Jagged Frontier
    of AI. Imagine a fortress wall, with some towers and battlements jutting out into
    the countryside, while others fold back toward the center of the castle. That
    wall is the capability of AI, and the farther from the center, the harder the
    task. Everything inside the wall can be done by the AI; everything outside is
    hard for the AI to do. The problem is that the wall is invisible, so some tasks
    that might logically seem to be the same distance away from the center, and therefore
    equally difficult—say, writing a sonnet and an exactly fifty-word poem—are actually
    on different sides of the wall. The AI is great at the sonnet, but because of
    how it conceptualizes the world in tokens rather than words, it consistently produces
    poems of more or less than fifty words. Similarly, some unexpected tasks (like
    idea generation) are easy for AIs while other tasks that seem to be easy for machines
    to do (like basic math) are challenges for `LLMs`. To figure out the shape of
    the frontier, you will need to experiment.


    ### Innovation at the Individual Level


    And this experimentation gives you the chance to become the best expert in the
    world in using AI for a task you know well. The reason for this stems from a fundamental
    truth about innovation: it is expensive for organizations and companies but cheap
    for individuals doing their job. Innovation comes from trial and error, which
    means that an organization trying to launch a new product to help a marketer write
    more compelling copy would need to build the product, test it on many users, and
    make changes many times to make something that works. A marketer, however, is
    writing copy all the time and can experiment with many different ways of using
    AI to help until they find one that succeeds. No need to hire a team or use expensive
    software development cycles.


    As artificial intelligence proliferates, users who intimately understand the nuances,
    limitations, and abilities of AI tools are uniquely positioned to unlock AI’s
    full innovative potential. These user innovators are often the source of breakthrough
    ideas for new products and services. And their innovations are often excellent
    sources for unexpected start-up ideas. Workers who figure out how to make AI useful
    for their jobs will have a large impact.


    ### AI as a Thinking Companion


    And AI can be very useful. Not just for job tasks, as we will discuss in detail
    in the coming chapters, but also because an alien perspective can be helpful.
    Humans are subject to all sorts of biases that impact our decision-making. But
    many of these biases come from our being stuck in our own minds. Now we have another
    (strange, artificial) co-intelligence we can turn to for help. AI can assist us
    as a thinking companion to improve our own decision-making, helping us reflect
    on our own choices (rather than simply relying on the AI to make choices for us).
    We are in a world where human decision-making skills can be easily augmented in
    a new way.


    ### Overcoming Status Qu Bias Bias


    Even if you scoff at the idea that AI-generated text could be persuasive and motivational,
    I have found this to be the case. I wrote this book on a compressed timeline,
    on top of other responsibilities to my family, students, collaborators, and university.
    It was hard to get started, but I knew that one thing that was holding me back
    was status quo bias, the urge to avoid making changes even when they might be
    good. To overcome this bias, it helps to consider what you are losing as a result
    of not acting. AI is surprisingly good at this, as you can see when I prompted
    it by saying, `I was thinking of writing a book about generative AI, but I am
    very busy and don’t think I want to make such a large commitment. Can you reframe
    my failure to write a book as a loss rather than a default option? Make the framing
    vivid.`


    > ![](images/page_51.jpg)In a world brimming with knowledge, you stood at the
    precipice of innovation, holding the torch of understanding about generative AI.
    Yet, when the world looked to you for illumination, the torch remained unlit.
    Not because the world wasn’t ready, but because you let the whispers of business
    snuff out its flame. It wasn’t the world’s loss; it was yours.


    Yikes, I guess I should finish writing this book. That’s a pretty great reframing
    of the failure as a loss, and suggests one way we can start using AI is to explore
    how to help ourselves, both professionally and personally. The strengths and weaknesses
    of AI may not mirror your own, and that’s an asset. This diversity in thought
    and approach can lead to innovative solutions and ideas that might never occur
    to a human mind.


    We aren’t just learning AI’s strengths as we figure out the shape of the Jagged
    Frontier. We are scouting out its weaknesses. Using AI in our everyday tasks serves
    to enhance our understanding of its capabilities and limitations. This knowledge
    is invaluable in a world where AI continues to play a larger role in our workforce.
    As we grow more familiar with `LLMs`, we can not only harness their strengths
    more effectively but also preemptively recognize potential threats to our jobs,
    equipping ourselves for a future that demands the seamless integration of human
    and artificial intelligence.


    ### Risks and Considerations


    AI is not a silver bullet, and there will be instances when it might not work
    as expected or may even produce undesirable outcomes. One potential concern is
    the privacy of your data, which goes beyond the usual questions of sharing data
    with large companies, and to the deeper concerns about training. When you pass
    information to an AI, most current `LLMs` do not learn directly from that data,
    because it is not part of the pretraining for that model, which is usually long
    since completed. However, it is possible that the data you upload will be used
    in future training runs or to fine tune the model you are working with. Thus,
    while it is unlikely that the AI training on your data can reproduce exact details
    of what you shared, it isn’t impossible. Several of the large AI companies have
    addressed this concern by offering private modes that protect your information,
    some of which meet the highest regulatory standards for things like health data.


    A second concern you might have is dependence—what if we become too used to relying
    on AI? Throughout history, the introduction of new technologies has often sparked
    fears that we will lose important abilities by outsourcing tasks to machines.
    When calculators emerged, many worried we would lose the ability to do math ourselves.
    Yet rather than making us weaker, technology has tended to make us stronger. With
    calculators, we can now solve more advanced quantitative problems than ever before.
    AI has similar potential to enhance our capabilities. However, it is true that
    thoughtlessly handing decision-making over to AI could erode our judgment, as
    we will discuss in future chapters. The key is to keep humans firmly in the loop—to
    use AI as an assistive tool, not as a crutch.


    ### Principle 2: Be the human in the loop.


    For now, AI works best with human help, and you want to be that helpful human.
    As AI gets more capable and requires less human help—you still want to be that
    human. So the second principle is to learn to be the human in the loop.

    '
