- fmt: '

    In study after study, the people who get the biggest boost from AI are those with
    the lowest initial ability—it turns poor performers into good performers. In writing
    tasks, bad writers become solid. In creativity tests, it boosts the least creative
    the most. And among law students, the worst legal writers turn into good ones.
    And in a study of early generative AI at a call center, the lowest-performing
    workers became 35 percent more productive, while experienced workers gained very
    little. In our study in BCG, we found similar effects. Those who had the weakest
    skills benefited the most from AI, but even the highest performers gained.


    This suggests the potential for a more radical reconfiguration of work, where
    AI acts as a great leveler, turning everyone into an excellent worker. The effects
    of this could be as profound as the automation of manual labor. It didn’t matter
    how good you were at digging, because you still couldn’t dig as well as a steam
    shovel. In this case, the nature of jobs will change a lot, as education and skill
    become less valuable. With lower-cost workers doing the same work in less time,
    mass unemployment, or at least underemployment, becomes more likely, and we may
    see the need for policy solutions, like a four-day workweek or universal basic
    income, that reduce the floor for human welfare.


    In the short term, then, we might expect to see little change in employment (but
    many changes in tasks), but, as Amara’s Law, named after futurist Roy Amara, says:
    “We tend to overestimate the effect of a technology in the short run and underestimate
    the effect in the long run.” The future is remarkably unclear in the long term.
    AI will transform some industries more than others, just as some jobs will become
    radically different while others don’t change at all. Right now, no one can tell
    you exactly what will happen for any particular company or school. And any advice
    will be obsolete when the next generation of AI is released. There is no outside
    authority. We have agency over what happens next, for good and for bad.


    ## 7. AI AS A TUTOR


    Here’s a secret: we have long known how to supercharge education; we just can’t
    quite pull it off. Benjamin Bloom, an educational psychologist, published a paper
    in 1984 called “The 2 Sigma Problem.” In this paper, Bloom reported that the average
    student tutored one-to-one performed two standard deviations better than students
    educated in a conventional classroom environment. This means that the average
    tutored student scored higher than 98 percent of the students in the control group
    (though not all studies of tutoring have found as large an impact). Bloom called
    this the two sigma problem, because he challenged researchers and teachers to
    find methods of group instruction that could achieve the same effect as one-to-one
    tutoring, which is often too costly and impractical to implement on a large scale.
    Bloom’s two sigma problem has inspired many studies and experiments to explore
    alternative teaching methods that could approximate the benefits of direct tutoring.
    However, none of these methods has been able to consistently match or surpass
    the two sigma effect of one-to-one tutoring that Bloom claimed. This suggests
    that there is something unique and powerful about the interaction between a tutor
    and a student that cannot be easily replicated by other means. So it is not surprising
    that a powerful, adaptable, and cheap personalized tutor is the holy grail of
    education.


    This is where AI comes in. Or where AI, hopefully, comes in. As remarkable as
    today’s AIs are, we have not reached the point where they can replace human teachers
    with magical textbooks. Though we are certainly at an inflection point where AI
    will reshape how we teach and learn, both in schools and after we leave them.
    At the same time, the ways in which AI will impact education in the near future
    are likely to be counterintuitive. They won’t replace teachers but will make classrooms
    more necessary. They may force us to learn more facts, not fewer, in school. And
    they will destroy the way we teach before they improve it.


    ### After the Homework Apocalypse


    Education has changed remarkably little for centuries. Students gather in a class
    to be taught by a teacher. They do homework to practice what they learned and
    then get tested to ensure they have retained their knowledge. Then they move on
    to the next topic. At the same time, research on the science of teaching has advanced
    a lot. For example, we know that in-class lectures are not the most effective
    way to teach and that topics need to be interwoven together in order for students
    to retain what they know. Unhappily for students, however, research shows that
    both homework and tests are actually remarkably useful learning tools.


    So it is a blow that the first impact of Large Language Models at scale was to
    usher in the Homework Apocalypse. Cheating was already common in schools. One
    study of eleven years of college courses found that when students did their homework
    in 2008, it improved test grades for 86 percent of them, but it helped only 45
    percent of students in 2017. Why? Because over half of students were looking up
    homework answers on the internet by 2017, so they never got the benefits of homework.
    And that isn’t all. By 2017, 15 percent of students had paid someone to do an
    assignment, usually through essay mills online. Even before generative AI, 20,000
    people in Kenya earned a living writing essays full time.


    With AI, cheating is trivial. In fact, the core capabilities of AI seem almost
    built for cheating. Think about common types of homework assignments. Many of
    them involve reading and then summarizing or reporting on what was read. These
    assignments expect that students will absorb the reading and engage in some sort
    of intellectual struggle with it. AI, however, is very good at summarizing and
    applying information. And it can now read `PDFs`. Or even entire books. This means
    that students will be tempted to ask the AI for help summarizing written content.
    Sure, the results can contain errors and simplifications, but even if they are
    correct, these summaries will shape a student’s thinking. Further, taking this
    shortcut may lower the degree to which the student cares about their interpretation
    of a reading, making in-class discussions less intellectually useful because the
    stakes are lower. Or consider problem sets. We already saw how AI is acing key
    exams for graduate school, so your kid’s fourth-grade geometry assignment is unlikely
    to stand in its way.


    And, of course, AI has come for the king of assignments, the essay. Essays are
    ubiquitous in education, where they serve many purposes, from demonstrating how
    students think to providing an opportunity for reflection. But they are also really
    easy for any `LLM` to generate, and AI-based essays are getting better and better.
    At first, AI style was conspicuous, but newer models write in a less awkward and
    circular way and can easily be prompted to write in a style appropriate for a
    student. Plus, the problem of hallucinated references and obvious errors is now
    much less common and easy to catch. Mistakes are subtle, rather than obvious.
    References are real. Additionally, and most important: `there is no way to detect
    whether or not a piece of text is AI-generated`. A couple of rounds of prompting
    remove the ability of any detection system to identify AI writing. Even worse,
    detectors have high false-positive rates, accusing people (and especially nonnative
    English speakers) of using AI when they are not. You cannot ask an AI to detect
    AI writing either—it will just make up an answer. Unless you are doing in-class
    assignments, there is no accurate way of detecting whether work is human-created.

