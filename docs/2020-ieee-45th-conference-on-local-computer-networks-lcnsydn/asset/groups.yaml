    # ARdeep: Adaptive and Reliable Routing Protocol for Mobile Robotic Networks with
    Deep Reinforcement Learning


    Jianmin LIU *1, QI WANG*, Chaoenta HE *1, Yongjun X *


    *Institute of Computing Technology, Chinese Academy of Sciences, Beijing, CHINA

    †University of Chinese Academy of Sciences, Beijing, CHINA

    Email: [liujianmin82, wang008, heentaox, xyj]@ict.ac.cn


    **Abstract—The mobile robotic network connecting multiple robotic devices such
    as unmanned aerial vehicles (UAVs) needs protocols that can handle the instability
    of robotic networks in the intermittently connected links and frequent changes.**
    This paper proposes a deep reinforcement learning adaptive and reliable routing
    protocol, ARdeep. We formulate routing decisions with a Markov Decision Process
    model to adapt to the network environment, making routing decisions. Results demonstrate
    that ARdeep outperforms the existing good performing QGeo and conventional GPR.


    **Index Terms—** routing, deep reinforcement learning, Deep-Q (DQN), mobile robotic
    networks


    An adaptive and highly autonomous routing protocol that can adaptively design
    routing decisions is.


    In this work, we formulate the process of routing decisions with a Markov Decision
    Process (MDP) model to automatically characterize the network variations and proposed
    ARdeep, a Deep Reinforcement Learning (DRL)-based adaptive and reliable routing
    protocol for mobile robotic networks. ARdeep is a distributed and geographic based
    routing protocol, where each node distributively makes optimal routing decisions
    on local context. We use a vector consisting of the distance between the neighbor
    and the destination, the neighbor, Packet Error Ratio (PER) and the expected connection
    time of the link to the cluster status. In general RL, we use DRL to learn optimal
    policy because RL is capable of handling large state space. Moreover, we propose
    an advanced approach where Deep-Q Network (DQN) is distributed at each robotic
    node, while DQN training is centralized to improve implementation and stability.


    # I. INTRODUCTION


    As a result of the advancements in sensors, computation technologies and mobile
    robotic devices such as unmanned vehicles, unmanned aerial vehicles (UAVs) provide
    opportunities for future services. Mobile robotic devices have been extensively
    used in fields such as transportation and surveillance [4]. Mobile robotic network,
    a high-speed mobile robotic network, allows communication between devices without
    the need for any fixed infrastructure. It can govern the autonomous movement of
    robotic devices and support robot-to-robot communication. However, due to changing
    topology caused by high speed of moving nodes and unstable communication, networking
    is still a challenging problem in mobile robotic networks.


    Existing based routing protocols and geographic based routing protocols limit
    the path selection and are also hard to use in such a dynamic environment due
    to the lack of understanding of the changes of dynamic environment. In mobile
    robotic networks, frequent topology changes may necessitate change routing decisions
    in real time to adapt to the network variations. Hence,


    # II. RELATED WORK


    Topology-based routing protocols use topology information to maintain up-to-date
    tables. LTOL[8], a proactive routing protocol, considers traffic factors and link
    quality to offer efficient communication in Flying Ad Hoc Networks (FANETS). Ganghuk
    et al. [1] proposed Robust and Reliable Routing (PAR) based on the reactive reactive
    protocol AODV [9], which uses the bidirectional and directional routing mechanism
    to achieve the requirement of some of FANETs. Nevertheless, topology-based routing
    protocols tend to increase the overhead because of the frequent changes of network
    topologies in dynamic network environment. Geographic routing is one of the primary
    solution to reduce routing overhead. Location-based routing (LAR) [5] is proposed
    to control the routing overhead by limiting the routing of requests. KAR et al.
    [3] proposed greedy perimeter status to GPSR by using only the location of neighbors
    to route setup delays. Although these geographic protocols reduce the overhead,
    they limit the route path selection due to the lack of understanding the dynamically
    changing nature.


    To solve the problem, machine learning algorithms are adapted to routing protocols.
    There are noteworthy studies of RL-based routing protocols. [Qgrid12], a grid-based
    geographic routing for ad hoc networks, it selects an optimal next-hop grid, and
    chooses a specific vehicle to carry the next-hop grid information. Pogeo [26]
    is a Q-learning-based geographic routing protocol for unmanned networks. It considers
    link quality and error rate in routing to improve packet delivery ratio. However,
    most of existing RL-based protocols ignore link status when making forwardings,
    which makes it difficult for them to capture the changes of link status, leading
    to low adaptability to the network variations.


    # III. DEFINITION AND MODEL


    ### A. Problem definition


    In this paper, we consider a routing optimization problem for data transmission
    from a source to a destination in the mobile robotic network of multiple devices.
    We define a vector $C_{u_i} = (c_{u_i,b_j}, PER_{u_i,b_j})$ to characterize the
    link between a node $u_i$ and its neighbor $b_j$, where $c_{u_i,b_j}$ represents
    the expected connection time of link, and $PER_{u_i,b_j}$ represents the packet
    error rate (PER) of neighbor $b_j$ and the destination. Meanwhile, a minimum distance
    $d_{min}$ between two neighbors $b_i$ and $j$ is considered.


    ### B. MDP Model


    In this paper, we formulate the routing decision process with a Markov Decision
    Process (MDP) to adapt the network time variations. We assume that routing decisions
    are executed in units of time slots, each time slot is set to 1 and total time
    slots of a routing process from source to a destination is T. Then the mission
    task is to select the next hop and forward a packet to it. In ARDeep, the state,
    action and reward function of MDP are defined as follows:


    - 1) State: We assume that, at time slot $t \in \{1, 2, ..., T\}$, node $u_i$
    with $m$ many neighbors. To capture the changes of link status, these defined
    links are formed by $u_i$ and all its neighbors as a discrete state $s$, compared
    to previous studies that regard node $u_i$ as the state. The, the state $s_i \in
    S$ is defined by a vector $(C_{u_i,b_1}, ..., C_{u_i,b_m})$.


    - 2) Action: In routing process, node $u_i$ who has the packet needs to select
    a neighbor as the next hop to forward the Packet. At time slot $t$, we define
    an action $a_i \in A$, where $B$ is the set of neighbors. Action $a_i$ chooses
    the selected neighbor to forward the packet.


    - 3) Reward: To achieve reliable and timely data transmission, we introduce a
    new concept of reliable reward, which is based on not only the distance but also
    link quality. The reliable distance $D_{u_i,j}$ is calculated as:


    $D_{u_i,j} = \frac{d_{u_i,j}}{d_{u_i,b_j}} \times (1 - PER_{u_i,b_j}) \quad (1)$


    $r_i = \begin{cases} R_{max} - R_{max} & \text{when neighbor } b_j \text{ is the
    local minimum} \\ \omega D_{u_i,b_j} + (1-\omega) E_{u_i,b_j} & \text{if } c_{u_i,b_j}
    < c_{min} \end{cases} \quad (2)$


    Where $d_{u_i,j}$ is the distance between $u_i$ and the destination, and $d_{u_i,b_j}$
    is the distance between $u_i$ and neighbor $b_j$. $PER_{u_i,b_j}$ is the packet
    error rate of the link between $u_i$ and neighbor $b_j$; $c_{u_i,b_j}$ is the
    expected connection time of the link between $u_i$ and neighbor $b_j$. $R_{max}$
    is the maximum reward value, $c_i$ and $E_{u_i,b_j}$ are the remaining and initial
    energy of neighbor $b_j$, respectively. $\omega \in (0, 1)$ is used to adjust
    the impact of reliable distance $D_{u_i,j}$ in reward. If the reliable distance
    is the destination, the maximum reward $R_{max}$ is used; when the reliable reward
    is negative to avoid a cycle when neighbor $b_j$ is local minimum (i.e., when
    all neighbors of $u_i$ are further from the destination).


    To adapt the dynamic networks with the feature of the topology changes, ARDeep
    adopts the distributed routing decision mechanism, where routing decisions are
    constructed to include of routing path in network.


    # IV. ARDEP DESIGN


    ARDeep is implemented by an alternative approach where DQN is executed at each
    node, while training of DQN is centralized to simpel implementation.

