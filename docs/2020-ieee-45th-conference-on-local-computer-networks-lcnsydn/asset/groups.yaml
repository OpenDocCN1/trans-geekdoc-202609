    # ARdeep: 基于深度强化学习的移动机器人网络自适应可靠路由协议


    Jianmin LIU *1, QI WANG*, Chaoenta HE *1, Yongjun X *


    *中国科学院计算技术研究所，北京，中国

    †中国科学院，北京，中国

    Email: [liujianmin82, wang008, heentaox, xyj]@ict.ac.cn


    **摘要—连接多个无人机（UAVs）等多个机器人设备的移动机器人网络需要能够处理间歇性连接链路和频繁变化的机器人网络不稳定性的协议。** 本文提出了一种基于深度强化学习的自适应可靠路由协议
    ARdeep。我们用马尔可夫决策过程模型对路由决策进行建模以适应网络环境并做出路由决策。结果表明，ARdeep 的性能优于现有的高性能 QGeo 和传统的
    GPR。


    **索引词—** 路由，深度强化学习，Deep-Q (DQN)，移动机器人网络


    能够自适应设计路由决策的自适应且高度自主的路由协议是。


    在工作中，我们用马尔可夫决策过程（MDP）模型对路由决策过程进行建模，以自动表征网络变化，并提出了 ARdeep，一种基于深度强化学习（DRL）的移动机器人网络自适应可靠路由协议。ARdeep
    是一种分布式且基于地理的路由协议，每个节点根据本地上下文分布式地做出最优路由决策。我们使用一个包含邻居与目的地之间的距离、邻居节点、数据包错误率（PER）以及链路预期连接时间的簇状态向量。在通用强化学习（RL）中，我们使用
    DRL 来学习最优策略，因为 RL 能够处理大型状态空间。此外，我们提出了一种先进方法，将深度 Q 网络（DQN）分布在每个机器人节点上，同时将 DQN 训练集中以提高实现稳定性。


    # I. 引言


    随着传感器、计算技术和如无人机等移动机器人设备的进步，无人机（UAV）为未来的服务提供了机会。移动机器人设备已广泛应用于运输和监控等领域 [4]。移动机器人网络作为一种高速移动机器人网络，允许设备之间在不需要任何固定基础设施的情况下进行通信。它可以控制机器人设备的自主移动并支持机器人之间的通信。然而，由于高速移动节点导致拓扑结构变化以及通信不稳定，网络在移动机器人网络中仍然是一个具有挑战性的问题。


    现有的基于拓扑的路由协议和基于地理的路由协议限制了路径选择，由于对动态环境变化的缺乏理解，在这种动态环境中也难以使用。在移动机器人网络中，频繁的拓扑变化可能需要实时更改路由决策以适应网络变化。因此，


    # II. 相关工作


    基于拓扑的路由协议利用拓扑信息来维护最新表。LTOL[8] 是一种主动路由协议，考虑了流量因素和链路质量，以为飞行自组网络（FANETS）提供高效的通信。Ganghuk
    等人 [1] 提出了基于响应式协议 AODV [9] 的鲁棒可靠路由协议（PAR），它使用双向和定向路由机制来满足某些 FANETs 的需求。然而，由于动态网络环境中拓扑结构的频繁变化，基于拓扑的路由协议往往会增加开销。地理路由是减少路由开销的主要解决方案之一。基于位置的路由（LAR）[5]
    被提出限制请求路由来控制路由开销。KAR 等人 [3] 仅通过邻居的位置为 GPSR 提出了贪婪周边界状态以减少路由设置延迟。尽管这些地理协议减少了开销，但由于对动态变化特性的缺乏理解，它们限制了路由路径的选择。


    为了解决这个问题，机器学习算法被引入到路由协议中。关于基于 RL 的路由协议有值得关注的研究。[Qgrid12] 是一种基于网格的自组网络地理路由，它选择最优的下一跳网格，并选择特定的车辆来携带下一跳网格信息。Pogeo
    [26] 是一种基于 Q-learning 的无人网络地理路由协议。它在路由中考虑了链路质量和错误率以提高数据包交付率。然而，现有的大多数基于 RL 的协议在转发时忽略了链路状态，这使得它们难以捕捉链路状态的变化，导致对网络变化的适应性较低。


    # III. 定义与模型


    ### A. 问题定义


    在本文中，我们考虑了多设备移动机器人网络中从源到目的数据传输的路由优化问题。我们定义了一个向量 $C_{u_i} = (c_{u_i,b_j}, PER_{u_i,b_j})$
    来表征节点 $u_i$ 与其邻居 $b_j$ 之间的链路，其中 $c_{u_i,b_j}$ 代表链路的预期连接时间，$PER_{u_i,b_j}$ 代表邻居
    $b_j$ 与目的地之间的数据包错误率（PER）。同时，考虑了两个邻居 $b_i$ 和 $j$ 之间的最小距离 $d_{min}$。


    ### B. MDP 模型


    本文中，我们用马尔可夫决策过程（MDP）对路由决策过程建模以适应网络时间变化。我们假设路由决策是以时间槽为单位执行的，每个时间槽设置为 1，从源到目的地的路由过程的总时间槽为
    T。那么，任务目标是选择下一跳并将数据包转发到那里。在 ARDeep 中，MDP 的状态、动作和奖励函数定义如下：


    - 1) 状态：我们假设在时间槽 $t \in \{1, 2, ..., T\}$，节点 $u_i$ 有 $m$ 个邻居。为了捕捉链路状态的变化，这些定义的链路由
    $u_i$ 及其所有邻居组成一个离散状态 $s$，与之前将节点 $u_i$ 视为状态的研究相比。因此，状态 $s_i \in S$ 定义为向量 $(C_{u_i,b_1},
    ..., C_{u_i,b_m})$。


    - 2) 动作：在路由过程中，拥有数据包的节点 $u_i$ 需要选择一个邻居作为下一跳来转发数据包。在时间槽 $t$，我们定义动作 $a_i \in A$，其中
    $B$ 是邻居集合。


    - 3) 奖励：为了实现可靠及时的数据传输，我们引入了可靠奖励的新概念，它不仅基于距离，还基于链路质量。可靠距离 $D_{u_i,j}$ 计算如下：


    $D_{u_i,j} = \frac{d_{u_i,j}}{d_{u_i,b_j}} \times (1 - PER_{u_i,b_j}) \quad (1)$


    $r_i = \begin{cases} R_{max} - R_{max} & \text{当邻居 } b_j \text{ 是局部最小值时 \\ \omega
    D_{u_i,j} + (1-\omega) E_{u_i,b_j} & \text{如果 } c_{u_i,b_j} < c_{min} \end{cases}
    \quad (2)$


    其中 $d_{u_i,j}$ 是 $u_i$ 到目的地的距离，$d_{u_i,b_j}$ 是 $u_i$ 与邻居 $b_j$ 之间的距离。PER_{u_i,b_j}$
    是 $u_i$ 与邻居 $b_j$ 之间链路的数据包错误率；$R_{max}$ 是最大奖励值，$c_i$ 和 $E_{u_i,b_j}$ 分别是邻居 $b_j$
    的剩余能量和初始能量。$\omega \in (0, 1)$ 用于调整可靠距离 $D_{u_i,j}$ 对奖励的影响。如果距离是目的地，则使用最大奖励 $R_{max}$；当可靠奖励为负时，以避免在邻居
    $b_j$ 为局部最小值时产生环（即 $u_i$ 的所有邻居距离目的地都远时）。


