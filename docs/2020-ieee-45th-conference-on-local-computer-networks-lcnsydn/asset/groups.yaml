    problem in mobile robotics. In this paper, we propose a novel reinforcement learning
    based adaptive and reliable routing protocol, ARDeep. In order to adapt to dynamic
    network environment, we formulate the routing decision process within a MDP model
    which allows to capture the link status, when making decisions, the PER, the expected
    connection time of the link, the remaining energy of nodes and the distance between
