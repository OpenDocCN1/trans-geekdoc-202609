    # 基于 DRL 的路由决策


    路由决策


    | 邻居表 | |

    | :--- | --- |

    | 位置 $l_i$ | $b_{i,des}$, $E_i$ |

    | 位置 $l_j$ | 速度 $v_j$， $E_j$ |


    ![](img/b044d4857b67ad2569632f230f0bb833_2_0.png)


    图 1：ARdee 架构


    我们使用距离 $d_u$ 和目的地来标准化距离 $db_{i,des}$ 和 $d_{min}$。由于 $d_{ij}$ 可能小于 $db_{i,des}$
    或 $d_{min}$，我们分别将归一化的 $db_{i,des}$ 和 $d$ 限制为1。每个邻居 $b_i$ 的 Q 值通过 DQN 以归一化的 $C_{u,i}$
    作为输入进行计算。获取所有邻居的 Q 值后，选择最大 Q 值作为下一跳来转发数据包。


    并提高稳定性。在执行过程中，持有数据包的节点使用 DQN 选择动作来确定下一跳。采取动作后，节点从环境中获得奖励。在训练过程中，中心化训练器从经验内存中运行批处理（mini-batches）以更新
    DQN 参数并最小损失。参数更新后，中心化训练器将更新发送到每个节点。当节点更新其 DQN 参数时。


    # V. 性能分析


    在本次实验中，我们实现了 ARdee，并将其与现有优秀协议 QoGo [2] 和传统 GPR [38] 进行了比较。我们在使用安装了 Python 3.5
    的 ThinkPad E2460（配备 i5-6250U CPU）上的网络仿真器评估了性能。DQN 使用三层反传播网络方法构建，隐藏层和输出层使用了 ReLU
    [7] 和线性激活函数。


    仿真设置设置为 1 km，并使用高斯移动性（GMK）模型来捕捉移动节点的真实性。我们采用 IEEE 802.11 作为 MAC 协议，并使用带有范围的全向天线。在仿真中，我们随机选择五个节点作为源，以
    100 米/秒的速度向一个站发送 127 字节的数据包。每条链路设置为 [0, 0.2] 范围内的随机值。节点的移动速度变化。我们使用包交付率（PDR）和平均端到端延迟（平均
    ED）来评估路由性能。


    # A. 路由节点决策


    每个路由节点可以通过定位系统（GPS）或其他定位方法获取其位置和速度。HELLO 消息（包括节点的位置、速度和剩余能量）在邻居之间交换。在收到某些邻居的 HELLO
    消息后，节点 $b_i$ 维护其邻居表，并将邻居 $b_j$ 的位置、速度和剩余能量信息更新到邻居表中。表中的信息用于路由决策过程。


    ![](img/b044d4857b67ad2569632f230f0bb833_2_1.png)


    (a) 不同最大速度下的 PDR


    # B. 基于 DRL 的决策


    在本文，我们逐步计算每个邻居（即动作）的 Q 值。我们将邻居链路的状态作为 DQN 的输入，邻居的 Q 值作为 DQN 的输出。假设节点 $u$ 拥有 $m$
    个邻居并在时间隙 $t$ 携带数据包。该节点根据其邻居表计算与节点和邻居之间链路相关的 $C_{u,b_i}$。


    向量 $C_{u,b_i} = [d_{u,b_i}, PER_{u,b_i}, E_{u,b_i}, d_{min}]$ 在节 III-A 中描述。它用于检查链路并表示链路状态。由于
    $C_{u,b_i}$ 具有不同的维度和单位，我们在将其作为 DQN 输入计算 Q 值之前，首先将这些元素归一化到 [0, 1] 范围。值 $C_{u,b_i}$
    的归一化方法如下：


    ![](img/b044d4857b67ad2569632f230f0bb833_2_2.png)


    (b) 不同节点数量下的 PDR


    $CT_{u,b_i} = \min(d_{u,b_i}/d_{min}, 1)$，其中 $CT_{min}$ 是最大预期时间。由于邻居 $b_i$ 的初始
    PER 值在 [0,1] 范围内，我们不需要。


    图 2：不同路由协议的快速比较


    467


    ![](img/b044d4857b67ad2569632f230f0bb833_3_0.png)


    (A) 不同移动速度下的平均 ED


    简而言之，在节点移动速度和节点数量不同的动态网络中，ARDeep 优于现有的 Qgeo 和传统 GPS。


    # VI. 结论


    由于高速移动和拓扑变化，网络路由仍然移动机器人领域的一个具有挑战性的问题。在本文中，我们提出了一种基于强化学习的新自适应可靠路由协议 ARDeep。为了适应动态网络环境，我们在
    MDP 模型中制定了路由决策过程，该模型在决策时能够捕捉链路状态、PER、链路的预期连接时间、节点的剩余能量以及节点与目的地之间的距离，从而允许 ARDeep
    更好地跨越网络。仿真结果显示，ARDeep 更适用于转发决策，并且优于现有的 Qgeo 和传统 GPS。


    ![](img/b044d4857b67ad2569632f230f0bb833_3_1.png)


    (B) 不同节点数量下的平均 ED


    图 3：不同路由协议的比较


    图 2(a) 和 (b) 显示了路由协议在不同移动速度和不同节点数量下的 PDR。从这两点可以看出，ARDeep 具有最高的 PDR。Qgeo 因为缺乏信息，总是尝试寻找距离目的地最近的邻居来转发数据包，由于路径导致
    PDR 下降。虽然 Qgeo 的 PDR 很高，但由于缺乏链路状态 PDR 会下降。ARDeep 考虑了链路质量、链路预期连接、节点剩余能量以及节点与目的地之间的距离，这使得
    ARDeep 能够捕捉链路变化并做出更可靠的路由决策。相反选择选择链路来传输数据包，从而获得更高的 PDR。


    图 3(a) 和 (b) 显示了路由协议在不同移动速度和不同节点数量下的平均 ED。我们看到由于中继机制绕过区域，GPS 具有最高的平均端到端延迟。随着节点的不断移动，网络拓扑发生变化，解决方案的网络拓扑中可能会产生空隙。简而言之，由于链路状态的增加，ARDeep
    频繁采用转发策略而非贪婪转发。虽然 Qgeo 的 ED 较低，但 ARDeep 在计算奖励值未使用 Q-learning 和数据包选择，平均端到端时间仍然很高，因为它无法捕捉链路状态的变化以做出更可靠的路由决策。与
    GPS 和 Qgeo 相比，ARDeep 能够捕捉链路状态并预测区域价值，从而导致更低的端到端时间。


