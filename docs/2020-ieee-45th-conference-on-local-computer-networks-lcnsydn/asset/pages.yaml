    # B. DRL based decisions


    In this paper, we calculate the Q-value of each neighbor (i.e. action) by step.
    We represent the status of the link neighbor as an input of DQN, and the Q-value
    of the neighbor as the output of DQN. That node $u$ with $m$ neighbors carries
    a packet at time slot $t$. That node calculates each $C_{u,b_i}$ related to the
    link between node and neighbor based on its neighbor table.


    The vector $C_{u,b_i} = [d_{u,b_i}, PER_{u,b_i}, E_{u,b_i}, d_{min}]$ is described
