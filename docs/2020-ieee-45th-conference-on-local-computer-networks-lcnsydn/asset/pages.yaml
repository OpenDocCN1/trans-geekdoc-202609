    # V. PERFORMANCE ANALYSIS


    In this experiment, we implemented our ARdee and compared it with existing good
    protocol QoGo [2] and conventional GPR [38]. We evaluated the performance using
    network simulator with Python 3.5 installed on ThinkPad E2460 with i5-6250U CPUs.
    The DQN was built with back propagation network method which uses three layers,
    and ReLU [7] and linear activation function was used in hidden layers and output
    layer.


    The simulation set is 1 km and a Gaussian Mobility (GMK) model is used to capture
    the reality of mobile nodes. We adopted IEEE 802.11 for MAC protocol and omnidirectional
    antenna with range. In the simulation, we randomly select five nodes as sources
    to send a packet of 127Bytes to one station at a speed of 100 meters. Each link
    is set to random in the range [0, 0.2]. The moving speed of nodes changes We use
    the packet delivery ratio (PDR) and average end-to-end delay (average ED) to evaluate
    the routing performance.


    # A. Routing Node Decision


    Each routing node can obtain its position and speed by a global positioning system
    (GPS) or other localization methods. The HELLO message, including the position
    of the node, speed and the remaining energy of the node, is exchanged among neighbors.
    After receiving a HELLO message from some neighbors, node $b_i$ maintains its
    neighbor table and updates the information of the position, speed and the remaining
    energy of neighbor $b_j$ into its neighbor table. The information in the table
    is used in routing decision process.


