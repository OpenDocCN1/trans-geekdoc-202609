    # VI. CONCLUSIONS


    Due to high-speed mobility and topology changes, network routing is still a challenging
    problem in mobile robotics. In this paper, we propose a novel reinforcement learning
    based adaptive and reliable routing protocol, ARDeep. In order to adapt to dynamic
    network environment, we formulate the routing decision process within a MDP model
    which allows to capture the link status, when making decisions, the PER, the expected
    connection time of the link, the remaining energy of nodes and the distance between
    the node and the destination, which allows ARDeep to better intersect networks.
    Simulation results show ARDeep is more appropriate for forwarding decisions and
    outperforms the existing Qgeo and conventional GPS.


    ![](img/b044d4857b67ad2569632f230f0bb833_3_1.png)


    (B) Average ED under different number of nodes


    Figure 3: Comparison of different routing protocols


    Fig.2(a) and (b) show the PDR of routing protocols under different moving speed
    and different number of nodes. From the two, we see that ARDeep has the highest
    PDR. Qgeo always tries to find the nearest neighbor to the destination to forward
    packets by the lack of information, PDR degradation due to the lack of path. Although
    Qgeo has high, PDR decreases due to the lack of link status. ARDeep considers
    the link quality, expected connection of the link, remaining energy of the nodes
    and the distance between the nodes and the destination, which allows ARDeep to
    capture link changes and to make more reliable routing decisions. In return, a
    link is selected to transmit data packets, resulting in higher PDR.


    Fig.3(a) and (b) show the average ED of routing protocols under different moving
    speed and different number of nodes. We see that GPS has the highest ever average
    end-to-end delay due to relay mechanism to bypass the area. As nodes continuously
    moves, the network topology changes and areas may be generated in the network
    topology of the solution. In a word, ARDeep frequently adopts forwarding policy
    instead of greedy forwarding due to the increase in link status. Although Qgeo
    has low ED, ARDeep using Q-learning and packet selection in the calculation of
    the reward value, average end-to-end time is still high because it cannot capture
    the changes of link status to make more reliable routing decisions. Compared to
    GPS and Qgeo, ARDeep is capable of capturing link status and predict the value
    of area, in leading to lower end-to-end time.


