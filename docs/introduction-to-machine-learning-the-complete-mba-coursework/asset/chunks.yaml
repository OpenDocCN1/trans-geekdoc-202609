    ## Python Program


    Below given is a python program for the classification of iris flowers from the
    iris dataset. A corresponding decision tree is created-classification make use
    of features sepal length, sepal width, petal length, and petal width


    ```python

    # import required libraries(DecisionTreeClassifier, export_text) and dataset(load_iris)

    from sklearn.datasets import load_iris

    from sklearn.tree import DecisionTreeClassifier

    from sklearn.tree import export_text

    # dataset is loaded to iris variable

    iris = load_iris()

    # DecisionTreeClassifier function is called and pass the maximum depth of tree
    as parameter

    decision_tree = DecisionTreeClassifier(random_state=0, max_depth=5)

    # fitting for the data points is done (iris.data is features and iris.target is
    datapoints)

    decision_tree = decision_tree.fit(iris.data, iris.target)

    # tree is generated and saved to r by labelling feature names

    r = export_text(decision_tree, feature_names=iris[''feature_names''])

    # displaying the tree in text form

    print(r)

    ```


