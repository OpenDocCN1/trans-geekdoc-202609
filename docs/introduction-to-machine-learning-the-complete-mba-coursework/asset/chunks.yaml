    Both will be discussed in detail ahead.


    ## 1.2.2. 无监督学习

    这种类型的学习算法利用无标签数据来训练用于智能行为的模型。当手头的數據未标记时，算法会尝试找出相似的模式并将具有相关特征的数据归为一组。无监督学习是一种没有教师存在、系统在没有任何监督的情况下学习的模式。这里系统基于经验学习。聚类是无监督学习的一个例子。无监督学习算法的例子包括客户市场细分、聚类、图像修复、药物发现等。


    ## 1.2.3. 强化学习

    当研究人员发现如果系统按预期方式完成工作时提供奖励会很好时，强化学习被引入。简单来说，这里系统从错误中学习。强化学习通常被称为真正的 AI，在训练数据不足时使用。缺乏训练数据意味着模型对当前问题没有专业知识，因此只能通过经验逐渐学习。起初它尝试随机行动以从环境中学习，然后找出解决问题的最佳策略。智能体与其环境之间存在迭代反馈循环，有助于其更具交互性地学习。与传统的机器学习算法不同，像
    `SARSA`（State-Action-Reward-State-Action）、蒙特卡洛方法 和 `Q-learning` 这样的强化学习算法在行为上更具动态性。强化学习算法的工作原理是通过强化奖励和惩罚来学习模式。模型试图在特定情况下采取最合适的行动，以最大化累积奖励并最小化惩罚。如果采取的步骤正确，则会得到奖励；否则会被惩罚。强化学习与监督学习方法不同，后者在训练数据中已有答案，因此模型使用正确答案进行训练；在强化学习中，没有答案/标签，模型根据过去的经验决定如何执行给定任务。因此在强化学习中，决策是一个顺序过程，我们会对之前做出的决策序列进行标记。强化学习最好的例子之一是下棋，其中棋盘上的每一步根据之前走法的历史被评为正面或负面。其他典型的强化学习应用可见于工业自动化、控制理论和博弈论的机器人领域。在所有这些应用中，都存在明确定义的环境、动作和奖励。博弈论的一个绝佳例子是
    `AlphaGo` 强化学习模型，它能够击败世界上最好的人类玩家。


    ## 1.2.4. 深度学习

    人脑中的神经元在我们的二进制计算机中被激发为人工神经网络以解决问题。这种学习技术称为深度学习。


    ## 1.2.5. 深度强化学习

    深度强化学习将人工神经网络与强化学习架构相结合，使软件定义的智能体能够在虚拟环境中学习实现目标的最佳可能行动，即它将函数逼近和目标优化结合起来，将状态-动作对映射到预期奖励。结合深度神经网络的强化算法可以击败在众多
    Atari 电子游戏、Starcraft II 和 Dota-2 以及围棋世界冠军中表现出色的专家。虽然这对非玩家来说可能听起来微不足道，但它是对强化学习先前成就的巨大改进，并且最先进的技术正在迅速发展。人工智能中最有趣的领域之一是深度强化学习的概念，其中机器可以根据其行动的结果自行教学。它是人工智能领域中极具前景的领域之一，因此让我们看看它是什么并探索实际应用。深度强化学习是人工智能和机器学习的一个类别，其中智能机器可以从其行动的结果中学习，类似于人类从经验中学习的方式。这种机器学习类型固有的特点是智能体根据其行动获得奖励或惩罚。使其达到目标结果的行动会得到奖励（强化）。机器通过一系列试错不断学习，使该技术适用于不断演变的动态环境。尽管强化学习已经存在数十年，但它最近与深度学习相结合，取得了惊人的成果。这里，强化学习的“深度”部分指的是复制人类大脑结构的多个（深度）人工神经网络层。深度学习需要大量的训练数据和显著的计算能力。现在，在过去几年中，数据量爆炸式增长，而计算能力的成本却大幅下降，这推动了深度学习应用的爆发。我们将在即将到来的章节中详细讨论监督学习、无监督学习和深度学习技术，并提供足够的图表和示例。这些技术的实现将在
    `python` 中使用 `Jupyter notebook` 交互式开发环境进行。我们将使用 `python` 包如 `NumPy` 和 `scikit-learn`
    来实现 ML 技术。这两个包都是开源的，并且易于集成到 `python` 环境中。


