    ## 5.6. 深度学习的需求


    深度学习模型通常被称为深度神经网络，因为大多数深度学习模型都是使用神经网络实现的。“深度”一词背后的思想来自神经网络中使用更多隐藏层。深度神经网络可能包含超过
    100 个隐藏层，而标准神经网络只有两三个层。机器学习从数据集中手动提取相关特征，并使用这些特征创建模型，但在深度学习中，相关特征是从数据集中自动提取的。另一个关键区别是深度学习旨在用于大型数据集，并且通常具有可扩展性。


    ## 5.7. 卷积神经网络


    [卷积神经网络](https://www.mathworks.com/discovery/convolutional-neural-network-matlab.html)
    (`CNN` or `ConvNet`) 是最受欢迎的深度神经网络之一，该技术被用于许多深度学习应用中。`CNN` 适用于 2-D 数据，因为 `CNN`
    的操作是对提取的特征与输入数据进行 2-D 卷积。`CNN` 广泛用于图像数据的深度学习。`CNN` 的优点是不需要手动特征提取。系统设计为直接从输入数据中提取特征。你无需定义和提供相关特征。由于特征提取是自动化的，基于
    `CNN` 的深度学习模型可用于实时目标检测，并为计算机视觉提供高精度。下面是一个卷积神经网络的简单架构。包含多个卷积层、可选的池化层和全连接层。让我们在下面详细了解每一层。


    ### 5.7.1. 卷积层


    `CNN` 的基础在于卷积操作。因此它们被称为卷积神经网络。`CNN` 的第一层是卷积，该层用于从输入数据中提取特征。卷积阶段将输入隐藏层的特征图与权重矩阵进行卷积并产生输出特征图。权重矩阵有四个维度；前两个是卷积输入层的特征图数量
    ![](img/Image00388.jpg) 和卷积输出层的特征图数量 ![](img/Image00389.jpg)。另外两个是感受野宽度和感受野高度的大小。在
    `CNN` 中，不是将整个输入数据或图像进行卷积，而是对子集进行卷积，其目标是在数据中不论模式的位置如何都能找到输入数据中的相似模式。通过使用输入数据的小方块学习图像特征来保留像素关系。步长决定了输出图像的大小（宽度
    x 高度）。步长简单来说是在应用卷积操作之前在垂直和/或水平方向滑动的像素数。通常在卷积层使用 `ReLU`。简而言之，卷积是一种数学运算，接受两个输入，例如图像矩阵和滤波器。`CNN`
    中的卷积通常会变得复杂，但有助于解决复杂问题。


    ### 5.7.2. 池化层


    引入池化层是为了减少参数数量；这些是可选的，当数据或图像过大时使用。你可以应用子采样来降低每个映射的维度，同时保留有价值的信息。子采样另称为下采样或空间池化。不同类型的空间池化如下所示


    * `Max Pooling`

