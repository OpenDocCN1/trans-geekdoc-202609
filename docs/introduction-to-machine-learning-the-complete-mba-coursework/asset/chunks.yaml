    ### 2.5.4. Naive Bayes algorithm


    The Naive Bayes algorithm is a simplified approach for classification. It works
    with an assumption of independence among predictors. Simply, a Naive Bayes classifier
    assumes that the presence of a specific feature in a class is unrelated to the
    presence of any other feature. The Naive Bayes model is easy to form and particularly
    suitable for very large data sets. Along with ease, Naive Bayes is known to outperform
    even highly sophisticated classification methods. For example, a fruit may be
    considered an apple if it is red, round, and about 3 inches in diameter. Even
    if these structures depend on each other or upon the existence of the other features,
    all of these properties independently contribute to the probability that this
    fruit is an apple, which is why it is known as ''Naive''. The Naïve Bayes algorithm
    operates on the below assumptions.


    * All the features considered are independent and does not relate to each other,
    and the presence or absence of any feature does not affect the existence of another
    feature

    * The data under consideration exhibit class-conditional independence; that is,
    the events are independent so long as they are conditioned on the same class value.

