    ![](img/Image00372.jpg) `Feedback neural networks` 是存在反馈的网络，这意味着网络中神经元的输出会直接或间接地通过其他链接神经元反馈到其输入。`Feedback
    neural networks` 另称为 `Recurrent Neural Networks`。`LSTM` (`Long Short-Term Memory`)
    是 `RNN` 的一个例子。


