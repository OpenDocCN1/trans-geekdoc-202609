    # CHAPTER 4 NATURAL LANGUAGE PROCESSING


    ## Learning Objectives

    After reading this chapter, the audience will be able to understand:

    1. Types and components of natural language processing

    2. How to generate root from inflected words using various techniques


    Implementation of these techniques will be done in `python` with `Jupyter notebook`
    interactive development environment. We will be using `python` packages such as
    `NumPy` and `scikit-learn` for the implementation of `ML` techniques.


    ## 4.1. Natural Language Processing (NLP)

    The way humans express information is entirely unstructured. Human beings generally
    communicate in words and sentences rather than tables, lists, or excel sheets.
    Since humans write and speak unstructured, the complexity of understanding it
    by the machines and computers is very high. Natural Language Processing (NLP)
    deals with this problem. It helps computers and machines understand the unstructured
    text and vocals to retrieve meaningful information from it. You can consider Natural
    Language Processing (NLP) as a sub-field of Artificial Intelligence (AI) that
    helps computers interact with humans.


    ### Applications of NLP

    1. Speech Recognition

    2. Language Translation

    3. Automated Question Answering

    4. Automated Text Summary Generation

    5. Chatbot

    6. Spelling and Grammar check

    7. Autosuggestions and Autocomplete

    8. Email Spam detector

    '
