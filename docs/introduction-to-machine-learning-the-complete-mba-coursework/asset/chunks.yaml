    ## Pooling


    `Max pooling` chooses the largest element from the receptive field. `Average pooling`
    takes the average value of the receptive field, and `Sum pooling` takes the sum
    of the feature map elements.


    ### 5.7.3 Batch Normalization


    `Batch Normalization` allows every layer in `CNN` to perform more independent
    learning. You may simply consider this as a layer used to normalize the output
    of the previous layer. The activations scale the input layer in normalization.
    `Batch Normalization` can be used to produce more accurate and efficient `CNN`
    models, which avoids the problem of overfitting. This layer is typically placed
    after convolution and pooling layers.


    ### 5.7.4 Fully connected layer


    After the convolution and pooling layers, the rest is similar to any feed forward
    networks. We flattened our matrix into the vector and fed it into a `Fully connected
    layer` like a neural network. Consider the obtained feature map matrix is converted
    and turned to a vector ![](Image00390.jpg), this is fed to `Fully connected` layers
    to create a model. We can apply any activation function at this stage to produce
    an output. The choice of the activation function is the freedom of the model designer.
    You can choose activation functions such as `softmax`, `sigmoid`, etc.


    ## 5.8 Types of Convolutional Neural Networks (CNN)


    There are several Convolutional neural networks, and some of them are listed below.


    ### 5.8.1 LeNet-5


    [LeNet- 5](https://towardsdatascience.com/illustrated-10-cnn-architectures-95d78ace614d#e276)
    `LeNet` is an exceptional `CNN` introduced to perform object classification. It
    is exceptional in its performance, accuracy, and capability. This algorithm was
    initially developed and trained to classify 0-9 hand-written digits from the `MNIST`
    dataset. `LeNet` consists of 7 layers, and the activation function applied is
    `ReLU`.


    ### 5.8.2 AlexNet


    [AlexNe t](https://towardsdatascience.com/illustrated-10-cnn-architectures-95d78ace614d#e971)
    `AlexNet` was introduced by Alex Krizhevsky, Ilya Sutskever, and Geoffery E. Hinton
    and won `ImageNet ILSVRC-2012` competition. This `CNN` is very similar to the
    `LeNet` structure but consists of many filters compared to the original `LeNet`.
    `AlexNet` is able to classify large set of objects. To deal with overfitting issues,
    `AlexNet` uses `dropout` instead of regularization to deal with overfitting.


    ### 5.8.3 VGGNet-16


    [VGGNet-1 6](https://towardsdatascience.com/illustrated-10-cnn-architectures-95d78ace614d#c5a6)
    `VGGNet-16` was designed by Simonyan and Zisserman and became the runners up of
    the `ILSVRC-2014` competition. `VGGNet` is exceptional for feature extraction
    because of the simple pattern that it follows. The hyper-parameters for the filter
    size and the strides for both the convolution and pooling layers are constant:
    Filters of size `3 X 3` and `stride = 1` used at the convolution layer, and the
    `max-pooling` layer make use of filters of size `2 X 2` and `stride = 2`. Such
    layers are applied in a particular order all over the network.


    ### 5.8.4 ResNet


    [ResNe t](https://towardsdatascience.com/illustrated-10-cnn-architectures-95d78ace614d#e4b1)
    `ResNet` provided better performance than `VGGNet` and came first in all the awards
    of the `ILSVRC 2015` for classification, detection, and localization. `ResNet`
    is otherwise called Residual Networks and was the most groundbreaking development
    in the area of `CNN` so far. `ResNet` makes use of `skip-connections` and `batch-normalizations`
    to aid training with thousands of layers without performance degradation. Performance
    degradation means the problem of "vanishing gradient," where the back-propagated
    gradient becomes infinitely small. `ResNet` used the idea of `identity shortcut
    connection` that transfers results to few deeper layers and skips some other layers
    in between.


    ### 5.8.5 GoogleNet/Inception


