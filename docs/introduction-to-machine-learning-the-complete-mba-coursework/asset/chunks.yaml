- raw: "Preface Motivation This book is designed as a part of \"The Complete MBA Coursework\
    \ Series,\" established to equip the professionals and students with eminent capabilities\
    \ and hone their skillset. The motivation behind this series is the need to establish\
    \ a thorough and complete MBA coursework, following the core and elective courses\
    \ of prestigious institutions like Harvard and Wharton's Business Schools. With\
    \ this self-motivated study of the MBA curriculum, students and professionals\
    \ can tailor their MBA according to their interests and requirements. Thus, embarking\
    \ on this self-study MBA coursework rather than a traditional, costly, and lengthy\
    \ MBA degree program is worth the time. MBA degree programs are very costly, although\
    \ the skill boost associated is worth acquiring. Thus, as a part of the MBA coursework\
    \ series, the following book helps the students learn the basic terminologies\
    \ and techniques associated with Machine Learning. This book does not attempt\
    \ to provide a self-contained discussion of Machine Learning. Instead is a decent\
    \ introduction to Machine Learning courses used in top MBA programs. Further,\
    \ the introductory is stemmed from our professional experience. Finally, we want\
    \ to thank Hina Aslam and Sara Aslam for providing us with many suggestions and\
    \ valuable feedback on this book.  Prerequisites To make the book as accessible\
    \ as possible, the reader should have a basic working knowledge of Regression,\
    \ Algebra, computer, and programming. However, prior exposure to an undergraduate\
    \ Machine Learning program is not required. The emphasis throughout the book is\
    \ on the understanding of basic terminologies and the valid application of Machine\
    \ Learning to real-world business practices. Final few words Thank you for buying\
    \ this book, and feedback is highly appreciated  for enhancing future versions.\
    \ I hope that all readers gain something useful from this book and boost their\
    \ knowledge of Management techniques that the author aimed at while writing it.\
    \ Although this book has been thoroughly checked and proofread; typos, errors,\
    \ inconsistencies in instances where I have got it wrong are bound to sneak in.\
    \ Any readers spotting such errors or addressing certain questions or comments\
    \ are kindly requested to contact our customer service through this e-mail ([introductory.books@gmail.com](mailto:introductory.books@gmail.com)\
    \ ) before writing any review online. Finally, feel free to return the book and\
