    import numpy as np

    from sklearn.preprocessing import StandardScaler

    from sklearn.svm import SVC

    # input X and y- X being the data points and y being the class labels.

    X = np.array([[-1, -1], [-2, -1], [1, 1], [2, 1]])

    y = np.array([1, 1, 2, 2])

    # Perform the SVM classification using SVM() function by setting gamma parameter
    to ''auto''

    clf = SVC(gamma=''auto'')

    clf.fit(X, y)

    # Predict using the function clf.predict and pass new data points as parameters

    print(clf.predict([[-0.8, -1]]))

