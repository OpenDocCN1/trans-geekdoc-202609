    \ 截图\n![](img/Image00346.jpg)\n\n## 4.11. 自然语言处理库\n\n这里我们将看到一些用于 NLP 的 Python\
    \ 库\n\n### 自然语言工具包(NLTK)\n\n`NLTK` Python 框架是一个非常著名的 NLP 工具。它不仅用于教育和研究，也用于生产环境。该工具使用起来毫不费力且免费。\n\
    特性：分词、命名实体识别、词性标注、情感分析\n\n### spaCy\n\n`spaCy` 是另一个广泛使用的开源自然语言处理库，可用于 Python。它速度快且优化，主要用于生产环境。\n\
    特性：分词、命名实体识别、词性标注、情感分析、依存句法分析\n\n### TextBlob\n\n`TextBlob` 是一个用于处理大量文本数据的 Python\
    \ 库。\n特性：分类、名词短语提取、语言翻译、词性标注、情感分析、WordNet 集成。\n\n### Gensim\n\n`Gensim` 是另一个用于相似度检测的\
    \ NLP Python 框架。虽然它不是通用 NLP 库，但能很好地处理指定任务。\n特性：非负矩阵分解、TF-IDF、潜在语义分析\n\n### Pattern\n\
    \n`Pattern` 是一个语法简洁的 NLP Python 框架，用于科学研究和生产。它是 NLP 研究人员和学生强有力且有价值的工具。\n特性：命名实体识别、分词、词性标注、句法分析、情感分析\n\
    \n#### 探索 NLTK Python 库功能的示例 Python 程序\n\n```\n# import required libraries NLTK\
    \ and modules sent_tokenize, word_tokenize and FreqDist and you may require to\
    \ use\n# nltk.download('punkt')\nimport nltk\nnlt.download('punkt')\nfrom nltk\
    \ import sent_tokenize\nfrom nltk import word_tokenize\nfrom nltk.probability\
    \ import FreqDist\n# read the text file NLP.txt (you may choose any text file)\n\
    input_file= open ( \"NLP.txt\" )\ntext=input_file.read()\n# nltk used to perform\
    \ sentence tokenization, word tokenization and last to find the frequency distribution\
    \ of text and to print most frequent 10 words\nsentence=sent_tokenize(text)\n\
    word=word_tokenize(text)\nfreq_dist=FreqDist(text)\nprint(sentence)\nprint(word)\n\
    freq_dist.most_common( 10 )\n```\n\nJupyter Notebook 截图\n![](img/Image00347.jpg)\n\
    \n# 第 5 章 深度学习\n\n## 学习目标\n\n阅读本章后，读者将能够理解：\n1. 模仿人类大脑处理数据的工作方式\n2. 处理非结构化和未标记数据\n\
    3. 各种类型的人工神经网络和卷积神经网络\n\n### 5.1. 人工神经网络\n\n人工神经网络是一个相对较新且高效的系统，其核心工作思想基于生物神经网络。`ANN`\
    \ 也被称为“人工神经系统”或“联结主义系统”。人工神经网络由大量称为节点或神经元的小型互连单元组成，这些单元能够在它们之间交换信息。这些单元可以被视为具有并行操作能力的简单处理器。每个神经元之间存在连接，并且连接与权重相关联。该权重承载有关输入信号的信息。权重的存在至关重要，是\
    \ `ANN` 的关键因素；对这些连接权重的改变可以激发或抑制正在传递的输入信号。每个神经元都有一个内部激活函数，只有满足激活函数的输入信号才能通过神经元。这样的神经元的输出再次作为输入馈送给其他链接的神经元。现在让我们考虑生物神经元以理解基本原理。\n\
