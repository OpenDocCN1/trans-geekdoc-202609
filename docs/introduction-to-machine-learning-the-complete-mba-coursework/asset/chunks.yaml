    # Introduction to Machine Learning


    ## Chapter 1 Introduction to Machine Learning


    ### Learning Objectives

    This chapter presents a conceptual understanding of Machine Learning and the chronological
    order of various machine learning techniques. We will discuss the significance
    of Machine learning and its applications in different areas. This chapter will
    enable the audience to understand:

    1. The concept of artificial intelligence and machine learning

    2. Application of machine learning algorithms around us

    3. Prominent ML techniques according to their chronological order

