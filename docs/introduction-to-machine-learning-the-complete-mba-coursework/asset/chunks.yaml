    \ analysis, Wordnet integration.\n\n### Gensim\n\n`Gensim` is another NLP python\
    \ framework used for similarity detection. Although it is not a general-purpose\
    \ NLP library, it handles the assigned tasks very well.\nFeatures: Non-negative\
    \ matrix factorization, TF-IDF, Latent semantic analysis\n\n### Pattern\n\n`Pattern`\
    \ is an NLP python framework with straightforward syntax that is used for scientific\
    \ research purposes and production. It is a potent and valuable tool for NLP researchers\
    \ and students.\nFeatures: Named entity recognition, Tokenization, Part of Speech\
    \ tagging, Parsing, Sentiment analysis\n\n#### Example python program to explore\
    \ features of NLTK python library\n\n```\n# import required libraries NLTK and\
    \ modules sent_tokenize, word_tokenize and FreqDist and you may require to use\n\
    # nltk.download('punkt')\nimport nltk\nnlt.download('punkt')\nfrom nltk import\
    \ sent_tokenize\nfrom nltk import word_tokenize\nfrom nltk.probability import\
