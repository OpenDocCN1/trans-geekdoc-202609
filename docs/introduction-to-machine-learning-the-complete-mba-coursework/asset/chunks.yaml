    `K` medoid clustering is otherwise called `PAM` (partitioning around medoid).
    In this type of clustering, a medoid represents each cluster. This method effectively
    handles outliers since it is using medoids for clustering. Outliers are the data
    points that could not be included in any clusters; they can either be ignored
    or considered a new cluster. We start the `K`-medoid clustering by taking a random
    set of ![](Image00208.jpg) data points as the set of medoids. Then at each step,
    all data points that are not medoids are analyzed one by one to see if they should
