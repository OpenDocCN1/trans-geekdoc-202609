    e-mail into spam and non-spam automatically)

    * Facial Recognition (facebook somehow already knows your friends and tags them
    automatically using ML algorithms when you upload a picture)

    * Text to Speech or Voice Recognition (smart virtual assistant like Sri, Google
    Assistant, Cortana, etc. have text to speech and speech to text recognition features
    and respond accordingly)

    * Unmanned Aerial Vehicles (UAVs or drones are remotely controlled and behave
    in unseen situations. The ground-based controller uses machine learning algorithms
    to understand the flying territory and perform the destined task)

    * Social Media and E-commerce Advertisements (Facebook, Netflix, Amazon use ML
    techniques to gauge user''s interest and relevant recommendations are given accordingly)

    * Space Exploration Probes (Space exploration probes utilize ML algorithms to
    discover new galaxies and explore new territories such as Mars)

    * Customer Segmentation in online shopping websites (Companies predict the behavior
    of their customers using ML algorithms, i.e., to know which customers will respond
    to a particular promotion)

    * Real-Time Object Identification for self-driving cars (Accurate detection of
    street buildings, vehicles, pedestrians, and road signs using artificial intelligence)

    * Search engine result improvements (Search engine optimization uses ML algorithms
    to improve search results)

    * Business Intelligence and Stock Market Prediction (Business Intelligence serve
    as a basis for Stock Market Prediction & Portfolio Analysis)

    * Online fraud detection (Deep Learning algorithms powered by an Artificial Intelligence
    Neural network identify fraudsters or bots)


    ## 1.2 Types of Machine Learning

    The development of today''s advanced machine learning started using traditional
    statistical techniques such as regression, probability theories, decision trees,
    classification, clustering. Although machine learning algorithms are developed
    drastically, understanding these techniques is mandatory for your journey through
    machine learning. Statistical methods were suitable when the availability of data
    was less. In the current world, the availability of data is abundant, and these
    techniques have some limitations of their own. Hence far more advanced techniques
    such as deep learning and deep reinforced learning are developed to solve challenging
    problems. There are different types of machine learning techniques that are developed
    as per the increasing requirement of better accuracy and result. They are given
    in below figure 1.1. The techniques at the far left are the first developed techniques,
    and the right most one is the most advanced.


    ![](Image00004.jpg)


    ### 1.2.1 Supervised Learning

    The supervised learning algorithms use labeled data for training the models deployed
    for learning intelligent behavior. Most of the real-world data collected are unlabelled
    and need to be annotated carefully if supervised learning algorithms are utilized.
    It is generally more manageable for the models to learn patterns and create distinctions
    between various data classes if labels are provided. The labels serve as teachers
    and therefore guide the model to learn what is what precisely. Supervised learning
    is similar to teaching a child to walk. You will hold the child''s hand, show
    him how to take his foot forward, and demonstrate walking to let the child understand,
    and you will continue the same process until the child learns to walk on himself.
    This technique is the first developed machine technique. In simple, you can consider
    this form of learning where a teacher is present to show the right and wrongs.
    Regression and Classification techniques are examples of supervised learning.
    Examples of supervised learning algorithms include fraudulent activity detection,
    spam detection, face detection algorithm, etc. In all these examples, the input
    data used for learning is already annotated as fraudulent, non-fraudulent, spam,
    non-spam, face, and non-face. Thus, it is easier for the model to learn patterns
    from the available classes. The supervised learning algorithms can be used to
    achieve two tasks:

    1. Regression

    2. Classification

    '
