    虽然人类知识渊博，但在相互交流时我们经常误解上下文，并且经常对相似的句子或词语做出完全不同的解读。我们可以用一个基础的例句来考察这种场景，“Call me
    a taxi, please.” 可以用多种方式解读句子，该句子存在歧义。其含义可以理解为以下几种方式。

    -   把人叫做出租车

    -   为那个人叫一辆出租车


    另一个歧义句的例子是“I saw a man on a hill with a telescope.” 该句子可以有多种解读，例如

    -   一个人站在山丘上，我用望远镜看到了他。

    -   一个人站在山丘上，山丘上有望远镜。

