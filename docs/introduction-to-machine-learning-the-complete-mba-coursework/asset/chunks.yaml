    ### 2.5.4. 朴素贝叶斯算法


    朴素贝叶斯算法是分类的一种简化方法。它基于预测变量之间独立性的假设。简单来说，朴素贝叶斯分类器假设某个类中特定特征的存在与任何其他特征的存在无关。朴素贝叶斯模型易于构建，尤其适用于非常大的数据集。除了易用性之外，朴素贝叶斯还以优于甚至高度复杂的分类方法而闻名。例如，如果一种水果是红色的、圆形的且直径约为
    3 英寸，则可能被认为是苹果。即使这些特征相互依赖或依赖于其他特征的存在，所有这些属性都独立地贡献于该水果是苹果的概率，这就是为什么它被称为“朴素”。朴素贝叶斯算法基于以下假设。


    * 考虑到的所有特征都是独立的且互不相关，任何特征的存在或不存在都不会影响另一个特征的存在

    * 所考虑的数据表现出类条件独立性；也就是说，只要它们以相同的类别值为条件，事件就是独立的

