    ## 1.1 引言

    人工智 能 (AI) 指的是机器复制人类智能的能力。这些机器使用不同的算法进行编程，以表现出人类行为和行动。AI 这个术语可以简单地表述为机器的智能，能够像人类一样学习和解决问题。随着计算资源的可用性对普通人变得容易，人工智能超越了区块链曝光、虚拟现实和量子计算。机器学习是人工智能的一种应用，可以定义为系统利用可用数据和先验经验持续学习的能力，而无需专门编程。创建这种能够自我学习的人工智能系统需要充足的数据和巨大的计算资源。高性能计算
    (HPC) 的易得性使研究人员和开发者能够创建各种机器学习模型，从而提供更好的准确性和结果。像 Google、Amazon 和 Microsoft 这样的云服务提供商都提供高度可配置的
    GPU 就绪虚拟机和机器学习工具包，用户可以利用它们来创建、训练和重新训练模型。机器学习 (ML) 从概率、统计和优化理论中借鉴了其思想，以在不显式编程的情况下向机器注入智能。该领域的目标是开发能够自动学习和理解数据以在未见情况下生成预测的机器。只有人类在日常生活中才以这种特征而闻名；他们了解在不确定情况发生时如何行为，这就是为什么他们被视为智能生命。通过开发由数据驱动的机器学习
    (ML) 算法，类似的智能被赋予机器。数据可能以任何形式出现，例如图像、语音、文本等。所开发的 ML 算法基于许多应用，范围从视觉到语言处理、预测、模式识别、游戏、数据挖掘、专家系统和机器人技术。有意识或无意识地，我们一直在使用许多建立在机器学习模型之上的服务。例如，让我们以与
    google assistant 或 Alexa 交谈的场景为例。两者都使用复杂的机器学习模型来理解语义和沟通上下文，以提供请求的响应。它们甚至会随着时间的推移而不断改进，通过持续学习你的使用方式。另一个例子是在线购物网站上的智能推荐，它们会精确地显示你正在寻找的商品。这种智能推荐是通过使用机器学习模型研究你的过去购买和搜索偏好而实现的。下面列出了一些更多示例场景。


    ### 1.1.1 机器学习应用

    机器学习算法在我们周围的各种应用中发挥作用。我们在日常生活中遇到的一些最常见应用列于下方：

    * 垃圾邮件过滤（Yahoo, Gmail, Hotmail, etc. use spam filters that categorize e-mail into
    spam and non-spam automatically）

    * 人脸识别（facebook somehow already knows your friends and tags them automatically
    using ML algorithms when you upload a picture）

    * 文本转语音或语音识别（smart virtual assistant like Sri, Google Assistant, Cortana, etc.
    have text to speech and speech to text recognition features and respond accordingly）

    * 无人驾驶飞行器（UAVs or drones are remotely controlled and behave in unseen situations.
    The ground-based controller uses machine learning algorithms to understand the
    flying territory and perform the destined task）

    * 社交媒体和电子商务广告（Facebook, Netflix, Amazon use ML techniques to gauge user''s interest
    and relevant recommendations are given accordingly）

    * 深空探测器（Space exploration probes utilize ML algorithms to discover new galaxies
    and explore new territories such as Mars）

    * 在线购物网站的客户细分（Companies predict the behavior of their customers using ML algorithms,
    i.e., to know which customers will respond to a particular promotion）

    * 自动驾驶汽车的实时物体识别（Accurate detection of street buildings, vehicles, pedestrians,
    and road signs using artificial intelligence）

    * 搜索引擎结果改进（Search engine optimization uses ML algorithms to improve search results）

    * 商业智能和股市预测（Business Intelligence serve as a basis for Stock Market Prediction
    & Portfolio Analysis）

    * 在线欺诈检测（Deep Learning algorithms powered by an Artificial Intelligence Neural
    network identify fraudsters or bots）


    ## 1.2 机器学习的类型

    当今先进机器学习的发展始于使用传统的统计技术，如回归、概率理论、决策树、分类、聚类。尽管机器学习算法发展迅速，但理解这些技术对于你的机器学习之旅是必不可少的。统计方法在数据可用性较低时很适用。在当前世界，数据的可用性非常丰富，而这些技术本身也存在一些局限性。因此，更先进的技术如深度学习和深度强化学习被开发出来以解决具有挑战性的问题。根据对更好准确性和结果的不断增长的需求，开发了不同类型的机器学习技术。它们在下图
    1.1 中给出。最左侧的技术是最早开发的技术，最右侧的是最先进的。


    ![](img/Image00004.jpg)


    ### 1.2.1 监督学习

    监督学习算法使用标记数据来训练用于学习智能行为的模型。收集的大多数真实世界数据都是未标记的，如果使用监督学习算法，则需要仔细标注。如果提供标签，模型通常更容易学习模式并在各种数据类别之间做出区分。标签充当教师，因此指导模型精确地学习什么是什么。监督学习类似于教孩子走路。你会牵着孩子的手，示范如何向前迈步，并示范走路让孩子理解，你会继续同样的过程，直到孩子学会自己走路。这种技术是第一个开发的机器技术。简单来说，你可以认为这种学习形式中有一个老师在场来展示对错。回归和分类技术是监督学习的例子。监督学习算法的例子包括欺诈活动检测、垃圾邮件检测、人脸检测算法等。在所有这些例子中，用于学习的输入数据已经标注为欺诈、非欺诈、垃圾邮件、非垃圾邮件、人脸和非人脸。因此，模型更容易从可用类别中学习模式。监督学习算法可用于实现两个任务：

    1. 回归

    2. 分类

    '
