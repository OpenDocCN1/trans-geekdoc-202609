    -   山丘上有一个人，我用望远镜看到了他做某事。


    这些例子说明语言处理不是“deterministic”，这意味着相同的语言或句子可以有多种解释，并且对一个人方便的东西可能对另一个人来说不方便或不合适。解读和建议会因主体而异。由于存在这种歧义，我们可以将自然语言处理（NLP）视为一种非确定性方法。由于自然语言处理（NLP）是非确定性的，它可以用来创建一种高度智能的机器，能够理解人类在各种情境下如何思考和解读。


    ## 4.2. 自然语言处理的种类

    自然语言处理中有两种不同的分类；它们是基于规则的自然语言处理和统计自然语言处理


    ### 4.2.1. 基于规则的自然语言处理

    基于规则的方法是处理自然语言的首批开发技术。由于这些技术存在已久，已被证明非常有效。基于规则 NLP 的一些示例有上下文无关文法（`CFG`）和正则表达式。该技术使用常识推理来操作或采用“填空”方法来解决问题。基于规则
    NLP 的问题在于在泛化场景中性能下降，并且该方法耗时长且需要人工投入。


    ### 4.2.2. 统计自然语言处理

    统计自然语言处理在大量数据上运行并尝试从中寻找解决方案。在统计 NLP 中，使用机器学习算法来训练自然语言处理模型。在 NLP 模型在大量数据实例上成功训练后，训练好的模型可以解决
    NLP 问题。以下表 4.1. 显示了两种方法的关键特征和局限性。

    ![](img/Image00332.jpg)


    ## 4.3. 自然语言处理（NLP）的组成部分

    自然语言处理中有不同的阶段，如下图 4.1. 所示，它们是词法分析、句法分析、语义分析、篇章分析和语用分析。我们将逐一讨论它们。

    ![](img/Image00333.jpg)


    ### 4.3.1. 词法分析

    词法分析又称为结构分析。在这里，我们分析句子的结构。语言的词典是指语言中单词和短语的集合。词法分析阶段将整个输入文本划分为段落、句子和单词。它涉及识别和分析单词的结构，因此也被称为结构分析。


    ### 4.3.2. 句法分析

    句法分析又称为解析；在这一阶段，单词（词法分析阶段的输出）会被分析语法并以显示单词之间关系的方式排列。考虑一个例句，“The shop goes to the
    garden,” 由于它没有显示单词之间的任何关系，因此不会被英语句法分析器接受。


    ### 4.3.3. 语义分析

    语义分析试图为单词找到准确的含义并分析文本的意义。在此阶段，确保诸如“hot ice-cream”之类的句子不会通过语义检查阶段。


    ### 4.3.4. 篇章整合

    篇章整合考虑文本的上下文。它考虑句子结束前的含义。考虑示例，“He came to office.” 在这种情况下，“he”必须在前一句中被引用。


    ### 4.3.5. 语用分析

    语用分析是自然语言处理的最后阶段。语言的整体交流和解释在语用分析阶段进行。它旨在在各种情况下开发语言的有意义使用。


    ## 4.4. 词干提取

    词干提取是自然语言处理中用于规范化单词的程序。在语言中，单个单词可以根据使用的上下文具有多种形式。让我们考虑一个示例单词“carry”，单词“carry”是一个动词，但它可以根据上下文采用许多其他形式，如“carries”、“carried”、“carrying”等。在词法分析阶段，输入文本或语音会被分词，解释器将这些输入单词视为不同的单词，即使它们传达相同的含义。由于自然语言处理旨在理解不同上下文中内容的含义，我们使用它来解决这个问题。词干提取程序通过将单词截断到其词干来规范化单词。让我们看一个例子，单词“carries”、“carried”、“carrying”将被缩减为“carri”，并且所有这些单词都仅由词干“carri”引用。也就是说，用于所有词形式的标记是“carri”。词干输出“carri”不携带任何含义或包含在词典中。词干提取可能不会为特定的一组单词提供词典、语法正确的词。词干提取有不同类型，如
    `Porter''s Stemmer`、`Snowball Stemmer`、`Lovin''s Stemmer` 等等。Snowball Stemmer
    的一个优点是它支持多种语言。


    ## 4.5. 词形还原

    词形还原与词干提取类似，并尝试为给定单词找到相似的基础“词干”。然而，词形还原与词干提取不同；词形还原找到一个词典单词作为基础“词干”，而不是截断原始单词。词形还原比词干提取慢，因为词干提取不考虑词干单词的上下文或含义。词形还原较慢但比词干提取更准确。词干提取或词形还原的选择取决于需求和项目目标。如果项目需要更快的响应，则可以使用词干提取，但如果更高的准确性至关重要，则最佳选择是词形还原。词形还原考虑词性（`POS`）值，该过程可能为不同的
    `POS` 值产生不同的输出。我们通常有四个 `POS` 选项，如 `Verb(v)`、`Noun(n)`、`Adjective(a)` 和 `Adverb()`


    Python 程序 - 显示词干提取和词形还原之间的差异

    ```

    import nltk

    nltk.download(''wordnet'')

    from nltk.stem import PorterStemmer

    from nltk.stem import WordNetLemmatizer

    lemmatizer = WordNetLemmatizer()

    print(lemmatizer.lemmatize(''carrying''))

    stemmer = PorterStemmer()

    print(stemmer.stem(''carrying''))

    ```

    输出：

    ```

    Carrying

    Carri

    ```

