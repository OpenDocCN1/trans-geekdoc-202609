    ![](img/Image00312.jpg) 密度可达的。点 ![](img/Image00313.jpg) 不是核心点，因此称为边界点。我们将点划分为彼此都很接近的核心点集；然后是边界点，它们接近至少一个核心点；最后是剩余点，它们不接近任何核心点。![](img/Image00321.jpg)
    显示即使点 ![](img/Image00322.jpg) 不是核心点，它也是从 ![](img/Image00313.jpg) 密度可达的。![](img/Image00323.jpg)


    ### 3.6.1. DBSCAN 的算法


    - 第 1 步：将 ![](img/Image00284.jpg) 视为待聚类的数据点。

