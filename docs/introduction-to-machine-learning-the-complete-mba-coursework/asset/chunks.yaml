    # 第 3 章 无监督机器学习


    ## 学习目标


    阅读本章将使读者能够理解：

    1. 聚类和关联的概念

    2. 大型和小规模数据集的各种聚类类型、聚类中心、`centroids`、`medoids`


    这些技术的实现将在 `python` 中使用 `Jupyter notebook` 交互式开发环境进行。我们将使用 `python` 包如 `NumPy`
    和 `scikit-learn` 来实现 ML 技术。


    ## 3.1. 无监督学习


    无监督学习是一种学习技术，其中学习算法尝试以最少的人工监督对先前未检测到的数据点进行标记。这种学习技术涉及使用尚未分类或标记的信息对机器进行训练，并且与监督学习技术相比，学习过程在没有监督的情况下继续进行。机器尝试通过识别模式、相似性和差异，在没有任何先验信息的情况下对数据点进行分类。让我们通过一个简单的例子来理解学习情况和算法操作，假设系统被提供了一张包含汽车和踏板车的图像，并且假设机器之前既没有见过汽车也没有见过踏板车。在这种情况下，我们的机器对汽车或踏板车的特征没有任何概念，但机器被赋予了学习能力，以便它可以通过识别相似性、差异和模式来从图像中对汽车和踏板车进行分类。无监督学习通常允许机器使用未标记的数据处理。无监督学习有两类：


    ### 3.1.1. 聚类


    聚类是一种过程，它将一组数据点划分为多个组，使得同一组内数据点之间的相似度很高，而不同组之间数据点的相似度较低。这些组被称为簇，同一簇内数据点之间的相似性称为类内相似性，不同簇的数据点之间的相似性称为类间相似性。


    ### 3.1.2. 关联


    关联规则学习问题是指某人希望发现描述数据大部分部分的规则，例如购买 X 的人也倾向于购买 Y。有不同类型的聚类技术，我们将在下面部分讨论每种技术


    #### 聚类类型

    1. `K-means clustering`

    2. `K-NN` (`k nearest neighbors`)

    3. `K-medoid clustering` or `PAM` (`partitioning around medoids`)

    4. `Fuzzy C means clustering`

    5. `DBSCAN`


    ## 3.2. K-均值聚类


    一个簇指的是由于某些相似性而聚合在一起的数据点集合。你将描述一个目标数字 `k`，它指的是数据集中需要的 `centroids` 的数量。`centroid`
    是表示簇中心的想象或真实位置。每个数据点通过降低簇内平方和被分配到各个簇中。换句话说，`k-means` 算法识别出 `k` 个 `centroids` 的数量，然后将每个数据点分配到最近的簇，同时保持
    `centroids` 尽可能小。`K means clustering` 算法是解决聚类问题的首要且直接的无监督学习算法之一。通常，无监督算法仅使用输入向量从数据集中得出推断，而不参考已知或标记的结果。`k-means`
    中的 ''means'' 指的是数据的平均值，有助于找到 `centroid`。假设我们需要将数据集分类为 ![](img/Image00208.jpg)个簇。我们通过选择
    ![](img/Image00208.jpg)个随机点作为 ![](img/Image00227.jpg)个簇的初始聚类中心来开始聚类过程。现在计算数据点与
    ![](img/Image00208.jpg)个簇的每个聚类中心之间的距离度量。距离聚类中心最小的数据点被归入该簇。在每个数据点与相应的聚类中心关联后，我们取与中心关联的数据点的平均值并用平均值替换中心，这对每个中心都执行。该过程重复进行，直到中心收敛到某些固定点。簇创建后，每个簇的数据点表现出最大类内相似性和最小类间相似性。`k-means`
    的目标很简单：将相关数据点分组在一起并发现潜在模式。为了实现这一目标，`k-means` 在数据集中搜索固定数量 (`k`) 的簇。


    ### 3.2.1. `k-means` 算法如何工作？


    使用的距离度量可以是欧几里得距离。考虑两个数据点 ![](img/Image00235.jpg)则这两点之间的距离可以计算为 ![](img/Image00236.jpg)假设每个数据点具有
    ![](img/Image00046.jpg)个特征；那么数据点是一个 ![](img/Image00046.jpg)维向量。即 ![](img/Image00237.jpg)假设另一个数据点
    ![](img/Image00006.jpg)为 ![](img/Image00238.jpg)那么这两个数据点之间的距离为 ![](img/Image00239.jpg)考虑一组数据点
    ![](img/Image00129.jpg)具有 ![](img/Image00047.jpg)个数据点，其中每个数据点定义为一个 ![](img/Image00046.jpg)维向量，并设
    ![](img/Image00240.jpg)为中心集合，![](img/Image00241.jpg)为当 ![](img/Image00242.jpg)时第
    ![](img/Image00068.jpg)个簇中的数据点数量。这里 ![](img/Image00208.jpg)是期望簇的总数。这里聚类算法的基本思想是将
    ![](img/Image00129.jpg)划分为 ![](img/Image00208.jpg)个不相交子集 ![](img/Image00243.jpg)


    ### 3.2.2. `k-means` 聚类算法的步骤


    - 第 1 步：随机选择 `k` 个聚类中心 ![](img/Image00240.jpg)

    - 第 2 步：计算每个数据点与 ![](img/Image00245.jpg) 中的每个聚类中心之间的距离

    - 第 3 步：将每个数据点 ![](img/Image00246.jpg)分配到簇中心 ![](img/Image00247.jpg)，如果 ![](img/Image00248.jpg)为最小值

    - 第 4 步：假设 (![](img/Image00249.jpg)) 为分配给簇中心 ![](img/Image00247.jpg) 的数据点，其中 ![](img/Image00241.jpg)
    为类 ![](img/Image00241.jpg) 中的数据点总数

    - 第 5 步：通过取该簇中数据点的均值重新计算聚类中心。使用下面的方程 ![](img/Image00250.jpg)

    - 第 6 步：现在使用新分配的聚类中心为每个数据点重新计算距离度量，如果新聚类中心收敛则停止。


    #### 如何确定初始聚类中心？


    可以采取以下步骤来初始化聚类中心

    1. 从数据集中随机选择 ![](img/Image00227.jpg)个数据点用于 ![](img/Image00227.jpg)个簇

    2. 另一种方法是取所有数据点的平均值并添加一些随机数以生成 ![](img/Image00208.jpg)个聚类中心

    3. 将数据点划分为 ![](img/Image00227.jpg)个相等区间，以便数据被划分为 ![](img/Image00208.jpg)个组。现在取每个组的均值作为
    ![](img/Image00208.jpg)个聚类中心。


    尽管 `K-means` 聚类算法很简单，但它具有某些缺点，例如

    1. 聚类中心的随机选择可能不会导致最优结果

    2. 该算法只能在数值数据上工作；它不能应用于分类数据

    3. 最终簇的结构取决于初始聚类中心的选择

    4. 用户在算法执行前指定簇的数量

