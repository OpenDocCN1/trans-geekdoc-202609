    #### How to determine initial cluster centers?


    The following steps can be taken to initialize cluster centers

    1. Random selection of ![](Image00227.jpg)data points from the dataset for ![](Image00227.jpg)clusters

    2. Another method is to take the average of whole data points and add some random
