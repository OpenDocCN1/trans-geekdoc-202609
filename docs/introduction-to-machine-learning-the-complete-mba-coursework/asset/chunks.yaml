    ### 4.10 Term Frequency — Inverse Document Frequency (TF-IDF)


    `Term Frequency — Inverse Document Frequency (TF-IDF)` is a word scoring measure
    used for information retrieval and summarization. The term is used to express
    the importance of a word in a given text. The word that appears multiple times
    in a document can be considered an essential word compared to other words that
    appear fewer times. If a word appears many times in a document and the same word
    frequently appears in some other documents, then the word can be considered a
    general occurring word, and we cannot assign much importance to it. Suppose we
    want to search for “quality mobile” and consider the search done on an extensive
    database with mobile descriptions. The search program is designed to display the
    closest response to the user query. The search engine will compute the `TF-IDF`
    to calculate the score for all of our available descriptions in the database,
    and the result with the higher score will be retrieved as a search result. If
    there exists an exact match for the user query, there is no need for `TF-IDF`
    calculation, and the exactly matched description is shown as a result. Suppose
