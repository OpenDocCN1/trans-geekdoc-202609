- raw: 'Although humans are knowledgeable, we often misunderstand the context while
    interacting with one another, and we often interpret similar sentences or words
    entirely differently. We can examine this scenario using an elementary example
    sentence, "Call me a taxi, please." One can interpret the sentences in many ways,
    and the sentence is ambiguous. The meaning can be understood in the following
    ways. \-           Call the person as a taxi \-           Book a taxi to the person
    Another example of an ambiguous sentence is "I saw a man on a hill with a telescope."
    This sentence can be interpreted in many ways, such as \-           A man is standing
    on the hill, and I saw him with a telescope. \-           A man is standing on
    the hill, which has a telescope. \-           I was standing on a hill and saw
    a man using my telescope. \-           I was standing on a hill and saw a man
    having a telescope. \-           There was a man on a hill, and I saw him something
    with my telescope. These examples illustrate that language processing is not "deterministic,"
    which means the same language or sentence can have multiple interpretations, and
    something convenient for one person can be inconvenient or not suitable for another
    person. Interpretations and suggestion can be varied from entity to entity. Since
    there is such ambiguity, we can consider Natural Language Processing (NLP) as
    a non-deterministic approach. Since Natural Language Processing (NLP) is non-deterministic,
    it can be used to create a highly intelligent machine capable of understanding
    how humans think and interpret in various contexts. 4.2.        Types of Natural
    Language Processing There are two different classifications in Natural Language
    Processing; they are  Rule-based Natural Language Processing and Statistical Natural
    Language Processing 4.2.1.                           Rule-based Natural Language
    Processing Rule-based approaches are the first developed techniques to process
    Natural Language. Since these techniques are here for so long, they are proven
    to work very well. Some of the examples for Rule-based NLP are Context-Free Grammar
    (CFG) and Regular expressions. This technique uses common sense reasoning to operate
    or consider the "fill in the blanks" method to solve problems. The problems with
    Rule-based NLP are the performance degradation occurring in generalized scenarios,
    and the approach takes much time and requires manual efforts. 4.2.2.                           Statistical
    Natural Language Processing Statistical Natural Language Processing operates on
    large amounts of data and tries to find solutions from it. In Statistical NLP,
    Machine learning algorithms are used to train Natural Language Processing models.
    After the NLP model is trained successfully on a large instance of data, the trained
    model can solve NLP problems. The following table 4.1. shows the key features
    and limitations of both methods. ![](Image00332.jpg)4.3.        Components of
    Natural Language Processing (NLP) There are different stages in natural language
    processing, as shown in the below figure 4.1., they are Lexical Analysis, Syntactic
    Analysis, Semantic Analysis, Discourse Analysis, and Pragmatic Analysis. We will
    discuss each of them one by one. ![](Image00333.jpg)4.3.1.                           Lexical
    Analysis Lexical analysis is otherwise called structure analysis. Here, we analyze
    the structure of the sentence. Lexicon of a language means the collection of words
    and phrases in a language. The lexical analysis phase divides the whole input
    text into paragraphs, sentences, and words. It involves identifying and analyzing
    words'' structure and is hence known as structure analysis. 4.3.2.                           Syntactic
    Analysis Syntactic analysis is otherwise called parsing; in this stage, the words
    (output of lexical analysis phone) are analyzed for grammar and are arranged in
    a fashion that shows the relationship among the words. Consider an example sentence,
    "The shop goes to the garden," does not get accepted by English syntactic analyzer
    since it does not show any relationship between words. 4.3.3.                           Semantic
    Analysis Semantic analysis tries to find the accurate meaning for the words and
    analyses the text''s meaningfulness. In this stage, make sure that sentences such
    as "hot ice-cream" do not go through the Semantic  checking phase. 4.3.4.                           Discourse
    Integration Discourse integration takes into consideration the context of the
    text. It considers the meaning of the sentence before it ends. Consider the example,
    "He came to office." In this case, "he" must be referenced in the preceding sentence.
    4.3.5.                           Pragmatic Analysis The pragmatic analysis is
    the last stage of Natural Language Processing. The overall communication and interpretation
    of language are carried out in the Pragmatic analysis stage. It aims to develop
    meaningful use of language in various situations. 4.4.        Stemming Stemming
    is a procedure in Natural Language Processing used to normalize words. In languages,
    a single word can have multiple forms depending upon the context used. Let us
    consider an example word "carry," The word "carry" is a verb, but it can take
    many other forms such as "carries," "carried," "carrying," and so on, related
    to its context. During the lexical analysis phase, the input text or speech is
    tokenized, and the interpreter considers these input words as different words
    even though they convey the same meaning. Since Natural Language Processing aims
    to understand the meaning of content for different contexts, we use it to resolve
    this problem. The stemming procedure normalizes the word by truncating the word
    to its stem word. Let us see one example, the words "carries," "carried," "carrying"
    will be reduced to "carri", and all these words are referred to by the stem word
    "carri" only. That is the token used for all the word forms is "carri". The stemmed
    output "carri" does not carry any meaning or included in the dictionary. Stemming
    may not give us a dictionary, grammatical word for a particular set of words. 
    There are different types of Stemming, such as Porter''s Stemmer, Snowball Stemmer,
    Lovin''s Stemmer, and many more. One advantage of Snowball Stemmer is that it
    supports a wide variety of languages. 4.5.        Lemmatization Lemmatization
    operates similarly to stemming and tries to find a similar base "stem" for a given
    word. However, Lemmatization differs from stemming; Lemmatization finds a dictionary
    word as a base "stem" instead of truncating the original word. Lemmatization is
    slower than stemming because stemming does not consider the context or meaning
    of the stemmed word. Lemmatization is slower but more accurate compared to stemming.
    The choice of stemming or lemmatization depends on the requirement and project
    goal. If a project needs faster responses, then stemming may be used, but If higher
    accuracy is crucial, then the best option is Lemmatization. Lemmatization takes
    into account Part of Speech (POS) values, The process may produce different outputs
    for different values of POS. We generally have four options for POS, such as Verb(v),
    Noun(n), Adjective(a) and Adverb() Python Program- Showing the difference between
    Stemming and Lemmatization \# import required libraries nltk, PorterStemmer, WordNetLemmatizer
    import nltk nltk.download(''wordnet'') from nltk.stem import PorterStemmer from
    nltk.stem import WordNetLemmatizer \# perform lemmatization and stemming on the
    word carrying lemmatizer=WordNetLemmatizer() print(lemmatizer.lemmatize(''carrying''))
    stemmer=PorterStemmer() print(stemmer.stem(''carrying'')) Output: Carrying Carri
    Jupyter Notebook Screenshot ![](Image00334.jpg)4.6.        Part of Speech Tagging
    (PoS tagging) Let us discuss that we need Part of Speech (PoS). Consider the simple
    question, “can you help me with the can?” The word “can” can have several meanings
    depending on the context and PoS. The first occurred, “can” is used as a question
    word for question formation. The second “can” at the end of the sentence is intended
    to denote a container or bucket. If you look at the Part of Speech (PoS), the
    first “can” is a verb, while the second “can” is a noun. Giving the word a specific
    meaning helps the program to handle it correctly in both semantic and syntactic
    analysis, and hence PoS tagging is essential for syntactic and semantic analysis
    to solve sentences with several semantic meanings. Python Program \# import required
    libraries nltk to perform pos tagging import nltk nltk.download(''averaged\_perceptron\_tagger'')
    \# perform pos tagging on the words carrying and carried tagging=nltk.pos\_tag(\["carrying","carried"\])
    print(tagging) Output: \[(''carrying'', ''VBG''), (''carried'', ''VBD'')\] Jupyter
    Notebook Screenshot ![](Image00335.jpg)4.7.        Chunking Chunking is a procedure
    applied to extract meaningful phrases or a group of words from unstructured text.
    Chunking works on top of PoS tagging. We cannot find meaningful information from
    tokens only. Tokens are passed through the PoS tagging stage and then fed to the
    Chunking phase, as shown in the above figure. Chunking means a group of words,
    which breaks simple text into more meaningful phrases than individual words. Now
    let us understand the output of the chunking phase. We have mentioned that chunking
    produces meaningful groups of words are called phrases. What are these words?
    Let us see.  There are five categories of phrases such as Noun Phrases (NP), Verb
    Phrases (VP), Adjective Phrases (ADJP), Adverb Phrases (ADVP), Prepositional Phrases
    (PP). There are different rules to construct these phrases; they are given below
    in the form of a grammar notation. ![](Image00336.jpg)Phrase structure rules '
