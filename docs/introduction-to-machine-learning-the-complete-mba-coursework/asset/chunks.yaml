    a pure class. Simply entropy is a measure of impurity in a dataset. Sets with
    high entropy are very diverse and provide little information about other items
    that may also belong in the set, as there is no apparent commonality. The measure
    of entropy is bits. Entropy values range from 0 to 1 when there are only two classes.
    If there are n classes, entropy ranges from 0 to log2 (n). If entropy is minimum,
    it indicates that the sample is homogeneous means less dissimilarity. In contrast,
