    ## 4.7. Chunking

    Chunking is a procedure applied to extract meaningful phrases or a group of words
    from unstructured text. Chunking works on top of `PoS` tagging. We cannot find
    meaningful information from tokens only. Tokens are passed through the `PoS` tagging
    stage and then fed to the Chunking phase, as shown in the above figure. Chunking
    means a group of words, which breaks simple text into more meaningful phrases
    than individual words. Now let us understand the output of the chunking phase.
    We have mentioned that chunking produces meaningful groups of words are called
    phrases. What are these words? Let us see.

    There are five categories of phrases such as `Noun Phrases (NP)`, `Verb Phrases
    (VP)`, `Adjective Phrases (ADJP)`, `Adverb Phrases (ADVP)`, `Prepositional Phrases
    (PP)`. There are different rules to construct these phrases; they are given below
    in the form of a grammar notation.

