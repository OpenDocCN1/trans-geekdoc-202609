    ## 4.6. Part of Speech Tagging (PoS tagging)

    Let us discuss that we need Part of Speech (`PoS`). Consider the simple question,
    “can you help me with the can?” The word “can” can have several meanings depending
    on the context and `PoS`. The first occurred, “can” is used as a question word
    for question formation. The second “can” at the end of the sentence is intended
    to denote a container or bucket. If you look at the Part of Speech (`PoS`), the
    first “can” is a verb, while the second “can” is a noun. Giving the word a specific
    meaning helps the program to handle it correctly in both semantic and syntactic
    analysis, and hence `PoS` tagging is essential for syntactic and semantic analysis
    to solve sentences with several semantic meanings.


    Python Program

    ```

    import nltk

    nltk.download(''averaged_perceptron_tagger'')

    tagging = nltk.pos_tag(["carrying","carried"])

    print(tagging)

    ```

    Output:

    ```

    [(''carrying'', ''VBG''), (''carried'', ''VBD'')]

    ```

