    # 2.6. 支持向量机 (SVM)


    支持向量机 (`SVM`) 是一种监督学习技术，用于解决分类问题和回归挑战。然而，它主要用于分类问题。该技术旨在在一个 `n` 维空间中 (`n` 为特征的数量)
    找到最佳超平面，以明确地对数据点进行分类，从而将数据集划分为不同的类别。这里，支持向量是最接近所创建超平面 的数据点。这些点非常重要，因为它们位于超平面附近；因此，删除这些点可能会改变超平面的位置。此外，超平面的维度取决于特征的数量，即，如果输入特征的数量为
    2，则超平面可能只是一条直线。支持向量是更接近超平面 的数据点；因此，它们会影响超平面的位置和方向。利用这些支持向量，我们最大化分类器的间隔。删除支持向量会改变超平面的位置。这些点有助于我们构建
    `SVM` 决策边界。支持向量机 (`SVM`) 是一种监督机器学习模型，使用分类算法用于两组或多组分类问题。在为 `SVM` 模型提供每个类别的标记训练数据后，它们可以对新的文本进行分类。以下是
    `SVM` 分类器的优点：

    - 在高维空间中有效

    - 在维度数量大于样本数量时很有用


