    ### 4.8 命名实体识别 (NER)


    `Named Entity Recognition (NER)` 自动扫描整个文本并提取一些基本信息，例如日期、时间、人物、组织、地点、货币等。`NER`
    的应用包括简历总结、电影的自动剧情创建、新闻机构的内容提取、搜索引擎优化等。让我们在下表 4.2 中查看一些常用的实体。 ![](img/Image00337.jpg)


    ### 4.9 词袋方法


    在此方法中，原始文本被分析以提取有意义的特征。由于词语被混合在一起，因此被称为词袋；也就是说，这些词语的出现没有顺序。该模型将给定的文本转换为词语，并记录文本中词语的频率。简而言之，您可以将词袋视为一个句子的表示，即一组词语及其出现频率，而不考虑顺序的重要性。
    ![](img/Image00338.jpg)


    1. `Raw Text`: 这是我们操作的输入文本

    2. `Clean Text`: 删除诸如标点符号和停用词等不必要的字符以清理文本。

    3. `Tokenize`: 句子被表示为一组标记或词语。

    4. `Building Vocab`: 这包含在删除不必要数据后文本中使用的总词语。

    5. `Generate Vocab`: 这包含词语及其在句子中出现的频率。


    让我们为下面给出的句子创建词袋。

    1. Ahmad and Usman traveled by the flight.

    2. The train was delayed.


    这里第一步是通过删除标点符号、句号和其他不必要的字符来创建基本结构。 ![](img/Image00339.jpg) 现在记录词语频率 ![](img/Image00340.jpg)
    现在按字母顺序排序并合并句子 1 和句子 2 ![](img/Image00341.jpg) 现在最终的词袋将如下所示 ![](img/Image00342.jpg)


    ### 4.10 词频 — 逆文档频率 (TF-IDF)


    `Term Frequency — Inverse Document Frequency (TF-IDF)` 是用于信息检索和摘要的词语评分度量。该术语用于表达一个词语在给定文本中的重要性。与出现次数较少的词语相比，在文档中多次出现的词语可以被视为重要词语。如果一个词语在文档中多次出现，并且在其他文档中也频繁出现，那么该词语可以被视为通用词语，我们无法赋予其太多重要性。假设我们想要搜索“quality
    mobile”并考虑在包含手机描述的庞大数据库中进行搜索。搜索程序旨在显示最接近用户查询的响应。搜索引擎将计算 `TF-IDF` 来计算数据库中所有可用描述的分数，得分较高的结果将被检索为搜索结果。如果用户查询存在完全匹配，则无需进行
    `TF-IDF` 计算，完全匹配的描述将作为结果显示。假设我们在数据库中有以下描述

    1. The good mobile

    2. a quality cell

    3. a fast mobile

    4. the cheap mobile cell phone


    描述 a 与用户查询的三个词语中有一个词语匹配；描述 c 与用户查询有一个词语匹配，描述 d 也与用户查询有一个词语匹配。然而，描述 b 包含一个词语“quality”，这是一个重要词语。因此搜索程序将显示描述
    b 作为搜索结果。现在，如果你查看这些描述，你会看到词语“mobile”在描述中很常见，因此它将具有显著更低的 `IDF` 值，从而导致更低的 `TF-IDF`
    值。如果考虑词语“quality”，它很少出现在其他描述中，与词语“mobile”相比具有较高的区分能力。因此，`TF-IDF` 值会更高，搜索程序可以得出结果为描述
    b。`TF*IDF` 分数与术语的重要性成正比；也就是说，`TF*IDF` 分数越高，术语越有价值，反之亦然。`TF`、`TF-IDF`、`IDF` 的公式

    1. `TF(Term Frequency)`

    ![](img/Image00343.jpg)

    2. `IDF(Inverse Document Frequency)`

    ![](img/Image00344.jpg)

    3. `TF-IDF(Term Frequency — Inverse Document Frequency)`

