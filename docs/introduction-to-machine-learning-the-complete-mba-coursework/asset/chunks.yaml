    ## 池化


    `Max pooling` 从感受野中选择最大元素。`Average pooling` 取感受野的平均值，而 `Sum pooling` 取特征图元素的总和。


    ### 5.7.3 批归一化


    `Batch Normalization` 使 `CNN` 中的每一层都能进行更独立的学习。你可以简单地将其视为用于归一化前一层输出的层。激活函数在归一化中缩放输入层。`Batch
    Normalization` 可用于生成更准确和高效的 `CNN` 模型，从而避免过拟合问题。该层通常放置在卷积和池化层之后。


    ### 5.7.4 全连接层


    在卷积和池化层之后，其余部分与任何前馈网络相似。我们将矩阵展平成向量并像神经网络一样将其输入到 `Fully connected layer` 中。假设获得的特征图矩阵被转换并变成向量
    ![](img/Image00390.jpg)，将其输入到 `Fully connected` 层以创建模型。我们可以在此阶段应用任何激活函数来产生输出。激活函数的选择是模型设计者的自由。你可以选择诸如
    `softmax`、`sigmoid` 等激活函数。


    ## 5.8 卷积神经网络（CNN）类型


    存在几种卷积神经网络，下面列出了其中一些。


    ### 5.8.1 LeNet-5


    [LeNet-5](https://towardsdatascience.com/illustrated-10-cnn-architectures-95d78ace614d#e276)
    `LeNet` 是一种用于执行对象分类的出色 `CNN`。它在性能、准确性和能力方面都很出色。该算法最初是为从 `MNIST` 数据集对 0-9 手写数字进行分类而开发和训练的。`LeNet`
    由 7 层组成，所应用的激活函数是 `ReLU`。


    ### 5.8.2 AlexNet


    [AlexNet](https://towardsdatascience.com/illustrated-10-cnn-architectures-95d78ace614d#e971)
    `AlexNet` 由 Alex Krizhevsky、Ilya Sutskever 和 Geoffery E. Hinton 提出，并在 `ImageNet
    ILSVRC-2012` 竞赛中获胜。该 `CNN` 与 `LeNet` 结构非常相似，但与原始 `LeNet` 相比包含许多滤波器。`AlexNet` 能够对大量对象进行分类。为了解决过拟合问题，`AlexNet`
    使用 `dropout` 而不是正则化来处理过拟合。


    ### 5.8.3 VGGNet-16


    [VGGNet-16](https://towardsdatascience.com/illustrated-10-cnn-architectures-95d78ace614d#c5a6)
    `VGGNet-16` 由 Simonyan 和 Zisserman 设计，并在 `ILSVRC-2014` 竞赛中获得亚军。由于其遵循的简单模式，`VGGNet`
    在特征提取方面表现出色。卷积和池化层滤波器大小和步长的超参数是恒定的：卷积层使用大小为 `3 X 3` 且 `stride = 1` 的滤波器，而 `max-pooling`
    层使用大小为 `2 X 2` 且 `stride = 2` 的滤波器。这些层以特定顺序应用于整个网络。


    ### 5.8.4 ResNet


    [ResNet](https://towardsdatascience.com/illustrated-10-cnn-architectures-95d78ace614d#e4b1)
    `ResNet` 的性能优于 `VGGNet`，并在 `ILSVRC 2015` 的分类、检测和定位所有奖项中名列第一。`ResNet` 另称为残差网络，是迄今为止
    `CNN` 领域最具突破性的发展。`ResNet` 利用 `skip-connections` 和 `batch-normalizations` 来帮助使用数千层进行训练而不会出现性能下降。性能下降是指“消失梯度”问题，其中反向传播的梯度变得无限小。`ResNet`
    使用了 `identity shortcut connection` 的思想，将结果传递到少数更深的层并跳过中间的一些层。


    ### 5.8.5 GoogleNet/Inception


