    Lemmatization is slower than stemming because stemming does not consider the context
    or meaning of the stemmed word. Lemmatization is slower but more accurate compared
    to stemming. The choice of stemming or lemmatization depends on the requirement
    and project goal. If a project needs faster responses, then stemming may be used,
    but If higher accuracy is crucial, then the best option is Lemmatization. Lemmatization
    takes into account Part of Speech (`POS`) values, The process may produce different
    outputs for different values of `POS`. We generally have four options for `POS`,
    such as `Verb(v)`, `Noun(n)`, `Adjective(a)` and `Adverb()`


    Python Program- Showing the difference between Stemming and Lemmatization

    ```

    import nltk

    nltk.download(''wordnet'')

    from nltk.stem import PorterStemmer

    from nltk.stem import WordNetLemmatizer

    lemmatizer = WordNetLemmatizer()

    print(lemmatizer.lemmatize(''carrying''))

    stemmer = PorterStemmer()

    print(stemmer.stem(''carrying''))

    ```

    Output:

    ```

    Carrying

    Carri

    ```

