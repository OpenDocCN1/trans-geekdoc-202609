    ## 4.6. 词性标注（PoS tagging）

    让我们讨论我们需要词性（`PoS`）。考虑简单问题，“can you help me with the can?” 单词“can”可以根据上下文和 `PoS`
    有多种含义。第一个出现的“can”用作疑问词形成疑问。句子末尾的第二个“can” intended to denote a container or bucket.
    如果你看词性（`PoS`），第一个“can”是动词，而第二个“can”是名词。给单词一个特定的含义有助于程序在语义和句法分析中正确处理它，因此 `PoS`
    标注对于解决具有多种语义含义的句子在句法和语义分析中是必不可少的。


    Python 程序

    ```

    import nltk

    nltk.download(''averaged_perceptron_tagger'')

    tagging = nltk.pos_tag(["carrying","carried"])

    print(tagging)

    ```

    输出：

    ```

    [(''carrying'', ''VBG''), (''carried'', ''VBD'')]

    ```

