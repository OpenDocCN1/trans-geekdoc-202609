    ## 5.4. 人工神经网络的类型


    现在让我们看看不同类型的人工神经网络。根据神经网络的架构，主要有三种类型。它们是

    - `Feedforward Network`

    - `Feedback Network`

    - `Lateral Network`


    ### 5.4.1. 前馈网络


    ![](img/Image00371.jpg) 如上图所示，此类网络中有三层。它们是输入层、隐藏/中间层和输出层。第一层是输入层，该层中神经元的数量与输入数量成正比。输入层被称为被动层，因为该层中的神经元不会参与数据处理。它们只是将输入传递给下一层。第二层是隐藏层，它们接收来自输入层的输入。隐藏层中神经元的数量和层数是任意的，并根据模型设计而变化。该层中的神经元被称为活跃神经元，因为它们参与数据处理和信号修改。此架构的第三层是输出层；它们也是活跃层。该层中神经元的数量与神经网络的输出值成正比。`Feedforward
    networks` 可以根据模型设计具有多个隐藏层。下面是具有两个隐藏层的前馈网络图。


