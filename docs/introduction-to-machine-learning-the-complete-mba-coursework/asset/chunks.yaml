    Both will be discussed in detail ahead.


    ## 1.2.2. Unsupervised Learning

    This type of learning algorithm makes use of unlabelled data for training the
    models deployed for intelligent behavior. When the data at hand is unlabelled,
    the algorithm tries to find out similar patterns and places data with relevant
    features into one group. Unsupervised learning is a type of learning where no
    teacher is present, and the system learns without any supervision. Here the system
    learns based on experience. Clustering is an example of unsupervised learning.
    Examples of unsupervised learning algorithms include customer market segmentation,
    clustering, image restoration, drug discovery, etc.


    ## 1.2.3. Reinforcement Learning

    Reinforcement learning was introduced when the researchers discovered that it
    would be nice to provide a reward as the system does the job in an intended way.
    In simple words, here, the system learns from the mistake. Reinforcement learning,
    often known as real AI, is utilized when we are not given enough training data.
    Lack of training data means the model has no expertise in the problem at hand
    and therefore learns gradually by experience. It tries random moves, in the beginning,
    to learn from its environment and then finds out what is the best strategy to
    solve the problem. There is an iterative feedback loop between the agent and its
    environment that helps it learn more interactively. Unlike the traditional machine
    learning algorithms, reinforcement learning algorithms like `SARSA` (State-Action-Reward-State-Action),
    Monte Carlo methods, and `Q-learning` are more dynamic in their behavior. The
    reinforcement learning algorithm works on the principle of learning patterns by
    reinforcing reward and punishment. The model tries to make the most suitable action
    in a particular situation that would maximize the cumulative reward and minimize
    punishment. If the step taken is right, it is awarded; otherwise, it is penalized.
    Reinforcement learning differs from the supervised learning approach where the
    training data already has an answer key so that the model is trained with the
    correct answer; in reinforcement learning, there is no answer/label, and the model
    decides to perform the given task in the light of its past experience. Thus in
    reinforcement learning, decision making is a sequential process, where we give
    labels to a sequence of decisions made earlier. One of the best examples of reinforcement
    learning is playing chess, where each of our moves on the board is rated as positive
    or negative given the history of previous moves. Some other typical reinforcement
    learning applications are seen in robotics for industrial automation, control
    theory, and game theory. In all these applications, there is a well-defined environment,
    actions, and rewards. A great example of game theory is the `AlphaGo` Reinforcement
    Learning model that was able to beat the world''s best human player.


    ## 1.2.4. Deep Leaning

    Neurons in the human brain are stimulated as artificial neural networks in our
    binary computers to solve problems. Such learning techniques is called Deep Learning.


    ## 1.2.5. Deep Reinforcement Learning

    Deep reinforcement learning incorporates artificial neural networks with the reinforcement
    learning architecture that sanctions software-defined agents to learn the best
    actions possible in a virtual environment to attain their goals, i.e., it unites
    function approximation and target optimization, mapping state-action pairs to
    expected rewards. Reinforcement algorithms that incorporate deep neural networks
    can beat human experts playing numerous Atari video games, Starcraft II and Dota-2,
    and the world champions of Go. While that may sound trivial to non-gamers, it
    is a vast improvement over reinforcement learning''s previous accomplishments,
    and state of the art is progressing rapidly. One of the most intriguing areas
    of artificial intelligence is the concept of deep reinforcement learning, where
    machines can teach themselves based upon the results of their actions. It is one
    of the artificial intelligence areas that shows great promise, so let us look
    at what it is and explore real-world applications. Deep reinforcement learning
    is a category of artificial intelligence and machine learning where intelligent
    machines can learn from the results of their actions, similar to the way humans
    learn from experience. Inherent in this type of machine learning is that an agent
    is rewarded or penalized based on their actions. Actions that get them to the
    target outcome are rewarded (reinforced). A machine keeps learning through a series
    of trial and error, making this technology fitted for dynamic environments that
    keep evolving. Although reinforcement learning has been around for decades, it
    was recently combined with deep learning, which established phenomenal results.
    Here, the "deep" portion of reinforcement learning refers to multiple (deep) layers
    of artificial neural networks that replicate a human brain structure. Deep learning
    needs large amounts of training data and significant computing power. Now, over
    the last few years, the volumes of data have exploded while computing power costs
    have dramatically reduced, which has enabled the explosion of deep learning applications.
    We will discuss supervised learnings, unsupervised learnings, and deep learning
    techniques in detail in the upcoming chapters with sufficient figures and examples.
    Implementation of these techniques will be done in `python` with `Jupyter notebook`
    interactive development environment. We will be using `python` packages such as
    `NumPy` and `scikit-learn` for the implementation of ML techniques. Both these
    packages are open source and easy to integrate into the `python` environment.


    # CHAPTER 2 SUPERVISED MACHINE LEARNING


    ## Learning Objectives

    Reading this chapter will enable the audience to:

    1. Understand the use of supervised learning algorithms for regression and classification
    tasks

    2. Identify the challenges related to classifications

    3. Use the algorithm to learn the mapping function from the input to the output

    4. Acknowledge the concept and theorems of probability, hyperplane, and datasets

