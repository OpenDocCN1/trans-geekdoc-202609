    ## 3.6. DBSCAN


    `DBSCAN` algorithms (density-based spatial clustering of applications with noise)
    are specially used for clustering large datasets. The idea behind `DBSCAN` is
    to create clusters having a minimum number of points and density. Density is a
    measure of the minimum number of data points within a certain distance of each
    other points. This idea helps to exclude the cluster formation by an outlier.
    The minimum number of points in any cluster must be defined initially; let us
    denote that parameter with ![](Image00310.jpg). ![](Image00311.jpg) is another
    parameter that defines the threshold distance to maintain between data points
    within a cluster. The ![](Image00311.jpg)-neighborhood or neighborhood of a data
    point is defined as the set of points that falls within a distance of ![](Image00311.jpg).
    In the `DBSCAN` algorithm, the number of clusters in the output is not pre-defined;
    instead, the algorithm determines the number of clusters ![](Image00308.jpg).
    In order to understand `DBSCAN` and its operations, one must understand the concept
    of density. A data point ![](Image00312.jpg) is said to be directly density reachable
    from data point ![](Image00313.jpg), if ![](Image00314.jpg) ![](Image00315.jpg)
    The first part ensures that the data points ![](Image00316.jpg) lies within the
    acceptable range ![](Image00311.jpg). The second part of the definition ensures
    a minimum number of core points close to each other ![](Image00317.jpg). These
    core points contribute to the central portion of the cluster. A directly density-reachable
    point must be done to one of these core points, but it need not be a core point
    itself. In that case, it is called a border point. Two points are said to be density-reachable
    only if there exists and chain of directly density-reachable points from one to
    another. This property ensures that any cluster will have core data points very
    close to a larger number of other data points (core points) and then some border
    points close to at least one core point. Let us try to explain the concept of
    ![](Image00311.jpg) Neighbourhood, Core points, and Density reachable with an
    example figure. In the first part of figure 3.1. ![](Image00318.jpg), the point
    ![](Image00312.jpg) has 4 data points within the neighborhood since the value
    of ![](Image00310.jpg) is ![](Image00319.jpg) the data point ![](Image00312.jpg)
    is considered a core point. In the second part of figure 3.1. ![](Image00320.jpg),
    there are five core points and note that out of the 4 points in the neighborhood
    of ![](Image00312.jpg), only 3 are themselves core points. These 4 points are
    said to be directly density-reachable from ![](Image00312.jpg). Point ![](Image00313.jpg)
    is not a core point and is thus called a border point. We have partitioned the
    points into a core set of points that are all close to each other; then border
    points, which are close to at least one of the core points; and finally, the remaining
    points, which are not close to any core point. ![](Image00321.jpg) shows that
    even though point ![](Image00322.jpg) is not a core point, it is density-reachable
    from ![](Image00313.jpg). ![](Image00323.jpg)


