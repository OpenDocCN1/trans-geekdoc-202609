    # 2.6. Support Vector Machine (SVM)


    Support Vector Machine (`SVM`) is a supervised learning technique to solve classification
    problems and regression challenges. However, it is mostly practiced in classification
    problems. This technique aims to find the best hyperplane in an `n`-dimensional
    space (`n`-the number of features) that distinctly classifies the data points,
    which classifies the data set to different classes. Here, the support vectors
    are the data points closest to the created hyperplane. These are very critical
    since these points lie close to the hyperplane; hence, removing these points could
    alter the hyperplane''s position. Also, the hyperplane dimension depends upon
    the number of features, i.e., if the number of input features is 2, then the hyperplane
    might just be a straight line. Support vectors are data points closer to the hyperplane;
    thus, they influence the hyperplane''s position and orientation. Using these support
    vectors, we maximize the margin of the classifier. Deleting the support vectors
    will change the position of the hyperplane. These are the points that help us
    build our `SVM` decision boundary. A support vector machine (`SVM`) is a supervised
    machine learning model that uses classification algorithms for two-group or multi-group
    classification problems. After giving an `SVM` model set of labeled training data
    for each category, they can categorize new text. Following are the advantages
    of the `SVM` classifier:

    - Effective in high dimensional spaces

    - Useful where the number of dimensions is greater than the number of samples


    We will examine Support Vector Machines through an example scenario. Consider
    the data for determining the chances of travel. For simplicity, let us consider
    there are only two features we are looking at to determine the travel decisions,
    such as traffic and bus fare. The output will be either yes or no. That is, if
    yes, travel is possible and if no, travel is not done.

    ![](Image00178.jpg)

    Since the output is either yes or no, this can be considered as a two-class problem.
    Moreover, the dataset is said to be two class dataset. Now let us consider the
    scatter plat of the above data. The above data can be plotted on a 2-D plane,
    keeping features on the plot''s axis. Here we will generate the scatter plot keeping
    traffic in ![](Image00005.jpg)axis and bus fare in ![](Image00006.jpg)axis. Here
    in this plot blue star represents class label ![](Image00179.jpg)and the red circle
    denotes class label ![](Image00180.jpg)

    ![](Image00181.jpg)

    As we examine the above diagram, we found that it was possible to draw a straight
    line in the scatter diagram to separate the values which produced an output ![](Image00179.jpg)and
    ![](Image00182.jpg). That is given below; the green line separates so that all
    the points marked with a blue star are on one side of the line, and the points
    marked with red circles are on the other side of the line. Thus, such a line is
    called a separating line. If there exists such a line for a given dataset, the
    data is said to be linearly separable, but there are other data that are not linearly
    separable. Data in our example scenario is linearly separable.

    ![](Image00183.jpg)

    In our above example, one could draw multiple lines to separate these classes,
    below shows another yellow line drawn to separate the classes ![](Image00179.jpg)and
    ![](Image00182.jpg). In this case, the selection of the best separator line is
    essential.

    ![](Image00184.jpg)

    The concept of the margin of a separating line can be used to find the best separator
    line. Consider the perpendicular distance between the data points and the separator
    line. The separator line margin is defined as the double of the shortest perpendicular
    distance between data points and the separator line. The below figure shows some
    of the perpendicular distance and least perpendicular distance for our data. The
    separator line with maximum margin can be considered as the best separator line
    and choose for classification.

    ![](Image00185.jpg)

    In the above figure, you can find the shortest perpendicular distance from the
    line to the data point ![](Image00186.jpg). The line with the highest value for
    margin is called the "maximum margin line" or the "optimal separating line". This
    line is otherwise called a "support vector machine", where "support vector" is
    the data points that are closest to the optimal separating line. As shown in the
    figure, we may draw a dashed line through the nearest support vector of both classes.

    ![](Image00187.jpg)

    The region between these two dashed lines can be thought of as a "road" or a "street"
    of maximum width that separates the "yes" data points and the "no" data points.


