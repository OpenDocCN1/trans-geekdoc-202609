    ## 5.4. Types of Artificial Neural Networks


    Now let us see different types of artificial neural networks. Based on the architecture
    of neural networks, there are mainly three types. They are

    - `Feedforward Network`

    - `Feedback Network`

    - `Lateral Network`


    ### 5.4.1. Feedforward Network


    ![](Image00371.jpg) As shown in the above figure, there are three layers in this
    type of network. They are the input layer, the hidden/middle layer, and the output
    layer. The first layer is the input layer, and the number of neurons in this layer
    is proportional to the number of inputs. The input layer is said to be a passive
    layer since the neurons in this layer will not participate in processing the data.
    They just pass input to the next layers. The second layer is a hidden layer, and
    they receive inputs from the input layer. The number of neurons and the layers
    in the hidden layer are arbitrary and vary according to the model design. Neurons
    in this layer as said to be active since they participate in data processing and
    signal modification. The third layer of this architecture is the output layer;
    they are also active layers. The number of neurons in this layer is proportional
    to the neural network''s output values. `Feedforward networks` can have multiple
    hidden layers depending on the model design. Below is a figure of a feedforward
    network with two hidden layers


    ### 5.4.2. Feedback Network


    ![](Image00372.jpg) `Feedback neural networks` are the network in which feedback
    is present, that means the output of neurons in the networks is either directly
    or indirectly fed back to its input via other linked neurons. `Feedback neural
    networks` are otherwise called `Recurrent Neural Networks`. `LSTM` (`Long Short-Term
    Memory`) is an example of `RNN`.


    ### 5.4.3. Lateral Network


    ![](Image00373.jpg) `Lateral networks` can be considered a compromise between
    feed forward and feedback neural networks, There is no designated feedback path
    in this type of network, but there is a coupling of neurons within a layer. A
    representation of the lateral network is shown in the above figure.


