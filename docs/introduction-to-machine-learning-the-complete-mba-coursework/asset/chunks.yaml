    # 第 4 章 自然语言处理


    ## 学习目标

    阅读本章后，读者将能够理解：

    1. 自然语言处理的种类和组成部分

    2. 如何使用各种技术从屈折词生成词根


    这些技术的实现将在 `python` 中进行，使用 `Jupyter notebook` 交互式开发环境。我们将使用 `python` 包，如 `NumPy`
    和 `scikit-learn` 来实现 `ML` 技术。


    ## 4.1. 自然语言处理 (NLP)

    人类表达信息的方式完全是非结构化的。人类通常用词语和句子进行交流，而不是表格、列表或 Excel 表格。由于人类书写和口语是非结构化的，机器和计算机理解其复杂性非常高。自然语言处理
    (NLP) 解决这个问题。它帮助计算机和机器理解非结构化的文本和语音，以从中提取有意义的信息。你可以将自然语言处理 (NLP) 视为人工智能 (AI) 的一个子领域，它帮助计算机与人类交互。


    ### NLP 的应用

    1. 语音识别

    2. 语言翻译

    3. 自动问答

    4. 自动文本摘要生成

    5. 聊天机器人

    6. 拼写和语法检查

    7. 自动建议和自动完成

    8. 电子邮件垃圾邮件检测器

