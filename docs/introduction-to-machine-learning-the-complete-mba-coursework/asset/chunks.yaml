    ### 2.2.4. Logistic Regression

    逻辑回归是一种合适的回归分析，当因变量是二分的（二元的）时使用。与线性回归不同，逻辑回归的因变量是离散的而不是连续的。逻辑回归用于描述数据以及一个因变量二元变量与一个或多个序数、名义、区间或比率水平自变量之间的关系。有时逻辑回归难以解释；Intellects
    Statistics 工具可以轻松让你进行分析，然后用通俗英语解释输出。逻辑回归在 20 世纪早期被应用于生物科学。随后也被应用于许多社会科学应用中。当因变量（目标）为分类时实现逻辑回归。例如，肿瘤是恶性（1）还是不是（0）为了预测一封电子邮件是否为垃圾邮件（1）还是不是（0）考虑一个需要对肿瘤是否恶性进行分类的案例。如果我们对这样的问题使用线性回归，则需要设置一个阈值以便进行分类。如果实际类别是恶性的，阈值为
    0.7，预测的连续值为 0.6，则该数据点将被分类为非恶性，导致现实时间中严重后果。从上述示例可以推断，线性回归不适合分类问题。线性回归是无界的，这就带来了逻辑回归。其值严格介于
    0 到 1 之间。逻辑回归的类型 - 二元逻辑回归：分类响应只有两种可能结果。示例：垃圾邮件或非垃圾邮件。 - 多项逻辑回归：处理三个或更多无序类别。示例：预测哪种食物更受欢迎（素食、非素食、纯素）。
    - 序数逻辑回归：处理三个或更多有序类别，例如，电影评分从 1 到 5。


    ### 2.2.5. Decision Boundary

    可以设置一个阈值来预测数据属于哪个类别。基于此阈值，得到的估计概率将被分类。假设预测值 ≥ 0.5，则将电子邮件分类为垃圾邮件，否则为非垃圾邮件。决策边界可以是线性的或非线性的。可以增加多项式阶数以获得更复杂的决策边界。


    ## 2.3. Classification

    分类只是将输入映射到分类标签的过程，执行此任务的模型被称为分类器。回归通常应用于数值问题，即预测下一商业年度的营业额。分类问题则不同，应用于将输入映射到相应标签。例如，考虑一个简单的银行活动；银行的自动化系统可以决定将客户的贷款请求映射为“安全”或“风险”。在这里，“安全”和“风险”是标签。分类是一个两步过程；第一步是模型的学习阶段。模型用训练集创建。训练阶段包括输入及其对应的正确标签。由于每个训练输入的类别标签都已提供，此步骤也称为监督学习（教师在场
    - 正确输出已知）。第二阶段使用训练好的模型并用它对新输入进行分类以得到相应标签。数学上你可以写分类为 ![](img/Image00008.jpg)分类的第一阶段可以被视为生成函数
    ![](img/Image00007.jpg)，第二阶段为在输入 ![](img/Image00005.jpg) 上操作函数 ![](img/Image00007.jpg)
    以生成相应的类别标签 ![](img/Image00006.jpg)。分类器的准确率定义为正确分类的测试样本数与总测试样本数的比率。一旦分类器以可接受的准确率生成，就可用于分类。你可以用准确率、速度、鲁棒性和可扩展性等参数比较不同的分类器。准确率，如我们之前解释的，指给定分类器正确预测标签的能力，速度指执行分类所需的计算资源，鲁棒性指系统在给定不完整或噪声数据时执行的能力。可扩展性指分类器处理大量数据的能力。


    ### 2.3.1. Challenges in classification

    数据清洗：数据清洗是分类中的预处理阶段，用于减少学习过程中的不确定性并产生具有更好准确率的分类器。输入数据应分析是否存在噪声和有价值数据的缺失，即缺失值。噪声可使用多种平滑技术处理，缺失值可通过用最常观察到的值替换该值或使用统计方法预测该值来解决。相关性分析：相关性分析可用于识别对分类重要的相关特征。相关性分析的一个例子是相关性。如果两个特征高度相关，则其中一个可在预处理阶段移除。特征子集选择也可用于减少特征集。此技术可用于找到一个缩减的特征集，使得数据类别的概率分布尽可能接近使用所有特征得到的原始分布。通过这两种相关性分析技术移除不贡献于分类的特征，可以进一步简化分类问题并使其更具成本效益。这些属性可能会减慢整个分类器并在与其他分类器性能比较时失败。数据转换和约简：数据归一化是分类中非常重要的预处理。例如，考虑一些特征，如距离或收入等。这些通常具有较大的整数值，对这些大值进行操作对于复杂分类网络或深度网络来说很复杂。使用此类数据可能会减慢整个分类过程，并导致巨大的性能损失。为了解决上述问题，我们将使用一种称为归一化的技术。归一化将给定特征的所有值缩放，使其落在较小的指定范围内，如
    -1.0 到 1.0 或 0.0 到 1.0。归一化适用于数值数据，如距离、薪水和营业额。另一种数据转换技术是概括；数据可以概括为更高级别的概念以避免复杂性。例如，特征分数可以概括为等级。同样，利润可以概括为低、中、高，分类属性，如街道，可以概括为更高级别的概念，如城市。概括过程压缩原始训练数据，导致更少的输入-输出操作，从而减少内存使用，实现更好的性能。存在不同类型的分类技术，如决策树分类、贝叶斯、支持向量机（`SVM`）、K-最近邻分类等。我们将在本章中介绍这些分类技术。


    ## 2.4. Decision Tree Classification

    决策树是一种监督学习技术，可用于分类和回归问题，但主要用于解决分类问题。决策树只是一个树结构，其中每个内部节点表示对属性的提问/测试，每个分支表示该提问/测试的可能结果，每个叶节点表示类别标签。决策树简单地提问，并根据答案（是/否）进一步将树拆分为子树。从标记的训练样本生成决策树的过程称为决策树归纳。树中最顶部的节点是根节点。我们使用
    `CART` 算法构建树，该算法代表分类与回归树算法。决策或测试是基于给定数据集的特征进行的。决策树的图形表示描绘了基于给定条件解决问题的所有可能解决方案。它被称为决策树，因为就像树一样，它从根节点开始，进一步扩展分支并构建树状结构。让我们考虑银行贷款申请的处理。首先，在根节点检查申请人的年龄组，对于青年和中年年龄组，检查就业状态。对于老年，检查过去未偿贷款的历史。根据对这些测试问题的回答，每个申请都被分类为标签“安全”或“风险”。![](img/Image00064.jpg)决策树分类器之所以如此流行，是因为决策树分类器相当简单，不需要任何领域知识和特定的参数设置。决策树可以轻松处理高维数据，因此在生物医学、财务分析、制造、生产、天文学和物理学等各种应用中都非常有用。事实上，决策树是许多基于规则的归纳系统的基础，如在线购物网站。决策树的优点
    - 它易于理解，因为它遵循人类在做出任何现实生活决策时遵循的相同过程。 - 它对于解决决策相关问题非常有价值。 - 它有助于思考问题的所有可能结果。 - 与其他算法相比，对数据清洗的需求较少。决策树的缺点
    - 决策树覆盖了许多层，使其复杂化。 - 对于更多类别标签，决策树的计算复杂性可能会影响增长。 - 它可能存在过拟合问题，可使用随机森林算法确定。


