    `DBSCAN` 算法（基于密度的具有噪声的空间聚类）专门用于聚类大型数据集。`DBSCAN` 背后的思想是创建具有最小点数和密度的簇。密度是彼此一定距离内数据点的最小数量的度量。这一思想有助于排除异常值形成的簇。任何簇中的最小点数必须最初定义；让我们用
    ![](img/Image00310.jpg) 表示该参数。![](img/Image00311.jpg) 是另一个参数，定义簇内数据点之间保持的阈值距离。![](img/Image00311.jpg)-邻域或数据点的邻域定义为落在
    ![](img/Image00311.jpg) 距离内的点集。在 `DBSCAN` 算法中，输出中的簇数不是预先定义的；相反，算法确定簇数 ![](img/Image00308.jpg)。为了理解
    `DBSCAN` 及其操作，必须理解密度的概念。如果 ![](img/Image00314.jpg) ![](img/Image00315.jpg)，则数据点
    ![](img/Image00312.jpg) 被认为是从数据点 ![](img/Image00313.jpg) 直接密度可达的 第一部分确保数据点 ![](img/Image00316.jpg)
    位于可接受范围 ![](img/Image00311.jpg) 内。定义的第二部分确保彼此靠近的最小核心点数 ![](img/Image00317.jpg)。这些核心点有助于簇的中心部分。直接密度可达点必须指向这些核心点之一，但它本身不必是核心点。在这种情况下，它被称为边界点。只有当从一个到另一个存在直接密度可达点的链时，两点才被认为是密度可达的。该属性确保任何簇都将具有非常接近大量其他数据点（核心点）的核心数据点，然后是一些接近至少一个核心点的边界点。让我们尝试用示例图来解释
    ![](img/Image00311.jpg) 邻域、核心点和密度可达的概念。在图 3.1 的第一部分 ![](img/Image00318.jpg) 中，由于
    ![](img/Image00310.jpg) 的值为 ![](img/Image00319.jpg)，点 ![](img/Image00312.jpg)
    在邻域内有 4 个数据点，因此数据点 ![](img/Image00312.jpg) 被认为是核心点。在图 3.1 的第二部分 ![](img/Image00320.jpg)
