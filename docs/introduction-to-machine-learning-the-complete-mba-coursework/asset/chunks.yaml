    # 2.5. Bayesian Classification


    The Bayesian classifier is a very basic and straightforward classifier introduced
    by the understanding of Bayes theorem. This algorithm is used for classifying
    multi-class datasets. The Bayesian classifier is often known as a naïve Bayes
