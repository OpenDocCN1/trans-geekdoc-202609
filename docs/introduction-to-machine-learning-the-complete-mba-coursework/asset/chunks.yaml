    ## 3.5. Fuzzy C Means Clustering


    Fuzzy clustering is a form of clustering applicable when a data point can exist
    in more than one cluster. Fuzzy clustering is otherwise called soft ![](Image00208.jpg)-means
    or soft clustering. Each data point exhibits a probability to belong to each cluster.
    We can say that a membership coefficient corresponds to the degree to which an
    element belongs to a specific cluster. The point closer to the center of a cluster
    has a high degree of membership than the points in the boundaries of a cluster.
    Let us consider an example. For example, a leaf can be green or yellow (hard clustering),
    but a leaf can also be green AND yellow (fuzzy clustering). Here, the leaf can
    be green to a certain degree as well as yellow to a certain degree. Instead of
    the leaf belonging to green ![](Image00290.jpg) and not yellow ![](Image00291.jpg),
    the leaf can belong to green ![](Image00292.jpg) and yellow ![](Image00293.jpg).
    Although these values are ![](Image00225.jpg) and ![](Image00190.jpg) they do
    not represent probabilities, and the sum of these two values will not necessarily
    add to ![](Image00223.jpg). The fuzziness of clustering can be explained by Dunn''s
    partition coefficient ![](Image00294.jpg) of the clustering, where ![](Image00208.jpg)
    represents the total number of clusters. Dunn''s partition coefficient is defined
    as the sum of squares of all membership coefficients, divided by the total number
    of data points. The value of ![](Image00294.jpg) ranges between ![](Image00295.jpg).
    A low value for the Dunn''s coefficient indicates a very fuzzy clustering, whereas
    a value close to ![](Image00223.jpg) indicates a near-crisp clustering. The key
    difference between other clustering forms we have seen earlier and fuzzy clustering
    is that in fuzzy clustering, a data point can exist in multiple clusters, whereas
    in ![](Image00208.jpg) means or ![](Image00208.jpg) medoid clustering, a data
    point can be associated with only one cluster. One of the most popular fuzzy clustering
