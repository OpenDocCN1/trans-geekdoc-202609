    随着深度学习持续主导头条，将神经网络与符号推理相结合的混合方法正悄悄地受到关注。接下来，我们将转向机器学习——这是现代突破背后的力量。


    # 机器学习：从数据到决策


    ## 简单算法预测电影大热的时刻

    Netflix 使用处理用户评分和观看习惯的 ML 模型彻底改变了电影推荐。他们的“Netflix 奖”竞赛引发了全球对协同过滤的兴趣，该技术依赖于从大型数据集中发现的模式。


    ### 机器学习的核心原理

    机器学习侧重于从数据中提取模式，而不是显式地编写每个规则。ML 模型不是列举指令，而是通过调整参数以适应观测示例来“学习”。这种方法有三种主要范式：


    1. 监督学习：模型从标记数据中学习，将输入映射到输出（例如，将图像分类为“猫”或“狗”）。

    2. 无监督学习：模型在未标记数据中发现隐藏结构（例如，根据购买行为对客户进行聚类）。

    3. 强化学习：智能体在提供奖励的环境通过试错来学习最优行动。


    #### 机器学习兴起的驱动因素

    1. 大数据：来自社交媒体、电子商务和传感器的数字信息爆炸。

    2. 计算能力：GPU 和专用硬件加速了大型模型的训练。

    3. 算法改进：诸如反向传播（用于神经网络）和新的优化技术等创新。


    ## 机器学习成功的背后秘诀

    除了硬件和数据之外，成功的 ML 还需要依赖于特征工程和稳健的评估指标。未能选择正确的特征或准确衡量性能可能会产生误导性的结果。


    ## 你在给你的算法喂垃圾还是金子？

    数据不足会瘫痪最复杂的模型。接下来，我们将研究最基础的 ML 算法：回归、分类和聚类，以及它们如何成为广泛现实世界应用的奠基石。


    # 核心算法：回归、分类与聚类


    ## 依赖逻辑回归的电商巨头

    据报道，亚马逊在创业早期阶段曾使用逻辑回归来预测用户是否会点击推荐的产品。尽管线性边界非常简单，但在输入高质量数据时，它被证明是极其强大的。


    ### 回归：预测连续结果

    * 线性回归：寻找输入特征（例如房屋面积）与连续目标（例如房屋价格）之间的线性关系。

    * 多项式回归：通过添加多项式项将线性回归扩展到捕捉非线性关系。

    * 正则化技术：岭回归 (`L2`) 和 Lasso 回归 (`L1`) 有助于控制过拟合。


    ### 分类：分配标签

    * 逻辑回归：`logistic regression` 产生类别的概率而不是连续输出。

    * 决策树：根据特征阈值划分数据，形成从根节点到叶子节点的路径，对应于预测。

    * 朴素贝叶斯：结合（通常是朴素的）特征独立假设应用贝叶斯定理，适用于垃圾邮件过滤和情感分析。


    ### 聚类：对未标记数据分组

    * K-Means：通过迭代优化聚类质心来使类内方差最小。

    * 层次聚类：构建树状图以显示数据的嵌套分组。

    * DBSCAN：通过密度识别不同形状和大小的簇。


    ## 通过一个令人惊讶的示例解读 K-Means

    分析星系的天文学家经常使用 `K-Means` 根据亮度和大小对星系进行聚类。这揭示了宇宙中隐藏的结构，证明了 ML 如何揭明远超我们直觉理解的现象。


    ## 聚类能开启新的业务领域吗？

    聚类通过细分客户或识别异常提供了改变规则的见解。接下来，我们将看到这些基础算法如何通过集成组合得到大幅改进，从而进一步增强预测能力。


    # 集成方法：Boosting、Bagging 与群体力量


    ## 随机森林如何拯救一家科技初创公司

    当一家金融科技初创公司面临严重的欺诈检测问题时，他们将单个决策树替换为 `Random Forest`——一种通过 `bagging` 构建的许多树的集成。此举大幅减少了误报，并将公司免于被错误标记为可疑的客户流失。


    ## 集成方法的原理

    无论调优得如何，单一模型都可能受到高方差或偏差的影响。结合多个模型可以克服这些问题。


    ### Bagging（自助聚合）

    通过在自助样本上训练多个模型来减少方差。

    * 它通过在随机选择的子子集上训练模型。

    * `Random Forest` 是一个典型的例子。


    ### Boosting

    通过顺序训练模型，每个模型都在修正前一个模型的错误。

    * `AdaBoost` 是这种技术。


    ### Stacking（堆叠）

    在多个基模型的预测之上训练一个元模型。

    * 它可以结合神经网络、线性模型和树模型方法。


    ### Bagging 与 Boosting：改变数据科学的对决

    数据科学家经常比较 `Random Forest`（一种 `bagging` 方法）和 `Gradient Boosting` 或 `XGBoost`。选择取决于数据规模、噪声水平和可解释性。


    ## 模型共同思考会发生什么？

    集成方法在 ML 中证明了“群体智慧”的作用。但如果模型本身以更自然的方式学习呢？这就是神经网络出现。


    # 神经网络：数学与灵感的碰撞


    ## 神经网络第一次看到猫

    2012 年，Google Brain 项目在 YouTube 帧上训练了一个深度神经网络。在没有告诉它什么是“猫”的情况下，网络自发产生了一个在出现猫时激活的神经元。


    ### 生物学启发

    人工神经网络 (`ANNs`) 的灵感来自大脑的神经元和突触。每个人工神经元计算输入的加权和，应用激活函数（例如 `ReLU`、等），并将结果向前传递。


    ### 神经网络的关键组件

    1. 输入层：接收原始数据（像素、传感器读取等）。

    2. 隐藏层：逐步转换特征，使网络能够学习复杂的模式。

    3. 输出层：产生最终预测（例如分类概率）。

    4. 训练 (`Backpropagation`)：误差反向通过神经网络以更新权重，使损失函数最小化。


    ### 激活函数及其重要性

    * `sigmoid` / `tanh`：历史上流行，但会导致梯度消失。

    * `ReLU`（修正线性单元）：深度架构中很流行，避免了某些梯度消失问题。

    * `Leaky ReLU` / `ELU`：旨在进一步解决梯度消失或 ReLU 问题的变体。


    ## 从感知器到多层网络

    20 世纪 50 年代，单层感知器受到推崇，但被证明无法处理非线性任务。向多层感知器 (`MLPs`) 的转变复兴了神经网络，开启了复杂特征提取的大门。


