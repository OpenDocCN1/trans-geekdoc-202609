  trans: '


    - **Epoch**：训练数据通过模型的一次完整过程。

    - **Overfitting**（过拟合）：模型记住了训练数据，导致失去泛化能力。

    - **Backpropagation**（反向传播）：通过反向传播误差来调整神经网络权重的算法。

    - **Confusion Matrix**（混淆矩阵）：评估分类模型性能的表格（`TP`、`FP`、`TN`、`FN`）。


