    - **Epoch**: One complete pass of the training data through the model.

    - **Overfitting**: When a model memorizes training data, losing generalization
    ability.

    - **Backpropagation**: Algorithm for adjusting weights in neural networks by propagating
    errors backward.

    - **Confusion Matrix**: Table for evaluating the performance of classification
    models (`TP`, `FP`, `TN`, `FN`).


