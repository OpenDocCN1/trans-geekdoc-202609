    ## 引言：进入 AI 宇宙


    虽然 `AI` 通常与未来机器人联系在一起，但它的根源深植于逻辑和数学。本书探索了从早期基于规则的系统到现代生成模型的历程。


    ## 人工智能的广领域


    人工智能并不是单一项技术，而是旨在模拟人类认知功能的各种领域的总称。从推荐引擎到自动驾驶汽车，`AI` 渗透进我们的日常生活。


    ## 经典 AI、专家系统、知识表示及其他


    `AI` 早期依赖于符号逻辑。这些系统通过复杂的 `if-then` 规则集使用人类编码的知识。


    ## 机器学习：从数据到决策


    `Machine learning` 将重点从显式编程转向从数据中学习的算法。这种转变使得系统能够识别人类可能会忽略的模式。


    ## 核心算法：回归、分类与聚类


    机器学习的核心是基础算法，如用于预测值的 `regression`、用于分类的 `classification` 以及用于寻找隐藏群体的 `clustering`。


    ## 集成方法、Boosting、Bagging 与群体力量


    为了提高准确性，研究人员通常结合多个模型。`boosting` 和 `bagging` 等技术利用了模型的集体性能。


    ## 神经网络：当数学遇上灵感


    受人类大脑的启发，`neural networks` 使用节点层来处理复杂信息。


    ## 深度学习的深度解析


    `Deep learning` 利用具有许多层的深层神经网络，能够从原始数据中自动提取特征。


    ## 卷积神经网络：读取图像，重构视觉


    `Convolutional neural networks` (CNNs) 彻底改变了计算机视觉，允许机器以高精度处理视觉数据。


    ## 循环神经网络：机器中的记忆


    `Recurrent neural networks` (RNNs) 为序列数据设计，例如文本或时间序列。


    ## Transformer 模型、BERT、GPT 与 NLP 革命


    `transformer`架构改变了自然语言处理，使模型能够理解跨文本文本的上下文。


    ## 生成对抗网络 (GANs)：从零开始创造


    `GANs` 由两个相互竞争的网络组成，以创造真实的图像。


    ## 自动编码器、Hopfield 网络与玻尔兹曼机


    `Autoencoders` 用于数据压缩和降噪，学习高效表示。


    ## 强化学习：对自主掌控的追求


    `Reinforcement learning` 通过试错教授智能体最大化奖励信号。


    ## 机器人、视觉感知与智能智能体


    机器人将 `AI` 与硬件相结合，创造与物理世界交互的机器。


    ## 自然语言处理、对话、聊天机器人及更多


    `Natural language processing` (NLP) 使计算机能够理解并生成人类语言。


    ## 规划、调度与问题解决：经典 AI 策略


    经典 `AI` 专注于寻找实现目标的动作序列。


    ## 智能搜索策略、Minimax、A* 及其他


    `minimax` 等算法用于博弈论，以预测并应对对手。


    ## 语音识别：从语音命令到情感检测


    `Speech recognition` 将音频转换为文本，有时还能检测情感。


    ## 自适应共振理论与模块化神经网络


    这些理论探索了系统如何在不忘记旧知识的情况下适应新信息。


    ## 现实世界应用：医疗、金融及其他


    `AI` 正在改变行业，从医疗诊断到金融欺诈检测。


    ## 数据：驱动 AI 的燃料


    数据的质量和数量决定了任何现代 `AI` 性能。


    ## AI 中的伦理与偏见：道德迷宫


    随着 `AI` 的增长，解决偏见和决策的伦理影响至关重要。


    ## AI 的边缘：量子计算与未来可能性


    `Quantum computing` 的未来有望指数级加速 `AI` 能力。


    ## AI 规模化：云计算、APIs 与 MLOps


    在大规模部署 `AI` 需要健壮的基础，如云平台和 `MLOps`


    ## 善的 AI：拯救世界的创新


    `AI` 有潜力解决气候变化和疾病爆发等全球性挑战。


    ## 安全与网络防御：数字战场上的 AI


    `AI` 是双刃剑，既用于防御也用于发起网络攻击。


    ## 人性因素：工作、创造力与协作


    人类与 `AI` 的关系将重新定义动力和创作过程。


    ## 建立 AI 初创企业：从想法到主宰市场


    创立 `AI` 企业需要平衡技术创新与市场需求。


    ## 结论：进入 AI 宇宙


    `AI` 的旅程刚刚开始。随着我们从简单的逻辑转向深度学习，变革的可能性是无限的。


