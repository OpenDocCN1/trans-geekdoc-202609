    ## Introduction: Entering the AI Cosmos


    ## A Tiny Chip That Changed the World


    Acrucial moment in modern computing occurred when general-purpose graphics processing
    units (GPUs) were repurposed to accelerate neural network computations. While
    GPUs were initially designed for rendering complex 3D graphics in gaming, researchers
    quickly realized that these chips could also perform large-scale matrix operations,
    essential for training multi-layer neural networks, at a fraction of the time
    CPUs required. This hardware leap catapulted AI from a niche research topic to
    a global phenomenon, transforming industries from entertainment to healthcare.


    ## The Day a Chess Match Shocked Humanity


    In 1997, IBM’s Deep Blue defeated Garry Kasparov in a highly publicized chess
    match. The system relied on brute-force search, specialized evaluation heuristics,
    and extensive opening databases. Though it wasn’t a “learning” system in the modern
    sense, it awakened the public to the idea that computers might match or even surpass
    human reasoning in specific tasks.


    ## Can Machines Think, or Are We Underestimating Them?


    The question remains: do machines “think,” or are they merely executing sophisticated
    pattern matching? AI’s continuing evolution, especially in machine learning and
    deep learning, suggests we may still underestimate its potential. As you journey
    through the chapters of this book, you’ll witness how this technology has transcended
    rules-based logic to achieve a level of adaptive, data-driven intelligence once
    deemed science fiction.


    ## The Grand Scope of Artificial Intelligence


    ## The Unexpected AI in Your Daily Life


    Chances are you use AI daily without realizing it. Whether tagging friends in
    Facebook photos or letting your email client auto-compose replies, you’re harnessing
    the power of modern AI.


    ### Defining AI: An Umbrella of Technologies


    Artificial intelligence (AI) encompasses a wide range of methods for replicating
    or simulating human intelligence. While these systems can include everything from
    simple “if-then” rule-based programs to advanced neural networks, the unifying
    goal is to enable machines to perceive, reason about, and act on information in
    ways that mimic or surpass human capabilities.


    #### Subfields and Overlaps


    1\. Machine Learning (ML): Algorithms that learn patterns from data.


    2\. Neural Networks: A subset of ML inspired by the human brain’s interconnected
    neurons.


    3\. Deep Learning: Neural networks with multiple (deep) layers, enabling feature
    extraction at higher abstraction levels.


    4\. Natural Language Processing (NLP): Understanding and generating human language.


    5\. Reinforcement Learning (RL): Training agents to act in an environment to maximize
    rewards.


    6\. Expert Systems: Rule-based AI that encodes domain knowledge for decision-making.


    ## A Conversation with Siri


    Modern voice assistants like Siri, Google Assistant, and Alexa integrate several
    AI components, such as speech recognition, NLP, and query understanding, to parse
    user commands and respond in natural language. These are no longer static, pre-programmed
    systems; they adapt and improve as they gather more data from user interactions.


    ## Is Everything We Do About to Be Automated?


    From self-driving cars to AI-powered customer service, automation looms large
    on the horizon. In the following chapters, you’ll see precisely how these various
    subfields contribute to a single, ever-evolving AI tapestry and how “classic AI”
    laid the foundations for today’s machine learning revolutions.


    ## Classic AI, Expert Systems, Knowledge Representation, and Beyond


    ## How a “Doctor AI” Diagnosed Patients Better Than Humans


    In the 1970s, an expert system named MYCIN surpassed many junior doctors in diagnosing
    blood infections. MYCIN’s success hinged on an extensive rule base gleaned from
    medical specialists, which allowed it to infer likely diseases and treatments.


    ### Building Blocks of Classic AI


    1\. Knowledge Representation: Symbolic structures like semantic networks, frames,
    or ontologies store facts and relationships.


    2\. Expert Systems: Based on “if-then” rules, these systems encapsulate human
    expertise in software form.


    3\. Inference Engines: They interpret the rules, deriving logical conclusions
    (often using forward-chaining or backward-chaining).


    4\. Planning and Reasoning: Classic AI also tackled logical puzzles, scheduling,
    and theorem proving through symbolic manipulation.


    ### Why Classic AI Mattered, And Its Limitations


    • Power: Expert systems showed that well-crafted rules could outperform humans
    in narrow domains.


    • Fragility: However, these systems often struggled with unseen conditions or
    ambiguous data, as they lacked machine learning’s adaptability.


    • Maintenance: Updating rule bases to reflect new knowledge was labor-intensive.


    ## The Forgotten Power of Knowledge Bases


    Search engines like Google owe part of their prowess to large-scale knowledge
    graphs, descendants of symbolic AI. The synergy between statistical methods and
    symbolic logic remains an active research area, hinting that “classic AI” may
    yet see a renaissance.


    ## Will Symbolic AI Make a Comeback?'
