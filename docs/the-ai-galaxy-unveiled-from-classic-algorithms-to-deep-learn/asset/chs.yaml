  ## 致读者的说明






  随着深度学习持续主导头条，将神经网络与符号推理相结合的混合方法正悄悄地受到关注。接下来，我们将转向机器学习——这是现代突破背后的力量。


  # 机器学习：从数据到决策


  ## 简单算法预测电影大热的时刻

  Netflix 使用处理用户评分和观看习惯的 ML 模型彻底改变了电影推荐。他们的“Netflix 奖”竞赛引发了全球对协同过滤的兴趣，该技术依赖于从大型数据集中发现的模式。


  ### 机器学习的核心原理

  机器学习侧重于从数据中提取模式，而不是显式地编写每个规则。ML 模型不是列举指令，而是通过调整参数以适应观测示例来“学习”。这种方法有三种主要范式：


  1. 监督学习：模型从标记数据中学习，将输入映射到输出（例如，将图像分类为“猫”或“狗”）。

  2. 无监督学习：模型在未标记数据中发现隐藏结构（例如，根据购买行为对客户进行聚类）。

  3. 强化学习：智能体在提供奖励的环境通过试错来学习最优行动。


  ### 机器学习兴起的驱动因素

  1. 大数据：来自社交媒体、电子商务和传感器的数字信息爆炸。

  2. 计算能力：GPU 和专用硬件加速了大型模型的训练。

  3. 算法改进：诸如反向传播（用于神经网络）和新的优化技术等创新。


  ## 机器学习成功的背后秘诀

  除了硬件和数据之外，成功的 ML 还需要依赖于特征工程和稳健的评估指标。未能选择正确的特征或准确衡量性能可能会产生误导性的结果。


  ## 你在给你的算法喂垃圾还是金子？

  数据不足会瘫痪最复杂的模型。接下来，我们将研究最基础的 ML 算法：回归、分类和聚类，以及它们如何成为广泛现实世界应用的奠基石。


  # 核心算法：回归、分类与聚类


  ## 依赖逻辑回归的电商巨头

  据报道，亚马逊在创业早期阶段曾使用逻辑回归来预测用户是否会点击推荐的产品。尽管线性边界非常简单，但在输入高质量数据时，它被证明是极其强大的。


  ### 回归：预测连续结果

  * 线性回归：寻找输入特征（例如房屋面积）与连续目标（例如房屋价格）之间的线性关系。

  * 多项式回归：通过添加多项式项将线性回归扩展到捕捉非线性关系。

  * 正则化技术：岭回归 (`L2`) 和 Lasso 回归 (`L1`) 有助于控制过拟合。


  ### 分类：分配标签

  * 逻辑回归：`logistic regression` 产生类别的概率而不是连续输出。

  * 决策树：根据特征阈值划分数据，形成从根节点到叶子节点的路径，对应于预测。

  * 朴素贝叶斯：结合（通常是朴素的）特征独立假设应用贝叶斯定理，适用于垃圾邮件过滤和情感分析。


  ### 聚类：对未标记数据分组

  * K-Means：通过迭代优化聚类质心来使类内方差最小。

  * 层次聚类：构建树状图以显示数据的嵌套分组。

  * DBSCAN：通过密度识别不同形状和大小的簇。


  ## 通过一个令人惊讶的示例解读 K-Means

  分析星系的天文学家经常使用 `K-Means` 根据亮度和大小对星系进行聚类。这揭示了宇宙中隐藏的结构，证明了 ML 如何揭明远超我们直觉理解的现象。


  ## 聚类能开启新的业务领域吗？

  聚类通过细分客户或识别异常提供了改变规则的见解。接下来，我们将看到这些基础算法如何通过集成组合得到大幅改进，从而进一步增强预测能力。


  # 集成方法：Boosting、Bagging 与群体力量


  ## 随机森林如何拯救一家科技初创公司

  当一家金融科技初创公司面临严重的欺诈检测问题时，他们将单个决策树替换为 `Random Forest`——一种通过 `bagging` 构建的许多树的集成。此举大幅减少了误报，并将公司免于被错误标记为可疑的客户流失。


  ## 集成方法的原理

  无论调优得如何，单一模型都可能受到高方差或偏差的影响。结合多个模型可以克服这些问题。


  ### Bagging（自助聚合）

  通过在自助样本上训练多个模型来减少方差。

  * 它通过在随机选择的子子集上训练模型。

  * `Random Forest` 是一个典型的例子。


  ### Boosting

  通过顺序训练模型，每个模型都在修正前一个模型的错误。

  * `AdaBoost` 是这种技术。


  ### Stacking（堆叠）

  在多个基模型的预测之上训练一个元模型。

  * 它可以结合神经网络、线性模型和树模型方法。


  ### Bagging 与 Boosting：改变数据科学的对决

  数据科学家经常比较 `Random Forest`（一种 `bagging` 方法）和 `Gradient Boosting` 或 `XGBoost`。选择取决于数据规模、噪声水平和可解释性。


  ## 模型共同思考会发生什么？

  集成方法在 ML 中证明了“群体智慧”的作用。但如果模型本身以更自然的方式学习呢？这就是神经网络出现。


  # 神经网络：数学与灵感的碰撞


  ## 神经网络第一次看到猫

  2012 年，Google Brain 项目在 YouTube 帧上训练了一个深度神经网络。在没有告诉它什么是“猫”的情况下，网络自发产生了一个在出现猫时激活的神经元。


  ### 生物学启发

  人工神经网络 (`ANNs`) 的灵感来自大脑的神经元和突触。每个人工神经元计算输入的加权和，应用激活函数（例如 `ReLU`、等），并将结果向前传递。


  ### 神经网络的关键组件

  1. 输入层：接收原始数据（像素、传感器读取等）。

  2. 隐藏层：逐步转换特征，使网络能够学习复杂的模式。

  3. 输出层：产生最终预测（例如分类概率）。

  4. 训练 (`Backpropagation`)：误差反向通过神经网络以更新权重，使损失函数最小化。


  ### 激活函数及其重要性

  * `sigmoid` / `tanh`：历史上流行，但会导致梯度消失。

  * `ReLU`（修正线性单元）：深度架构中很流行，避免了某些梯度消失问题。

  * `Leaky ReLU` / `ELU`：旨在进一步解决梯度消失或 ReLU 问题的变体。


  ## 从感知器到多层网络

  20 世纪 50 年代，单层感知器受到推崇，但被证明无法处理非线性任务。向多层感知器 (`MLPs`) 的转变复兴了神经网络，开启了复杂特征提取的大门。





  AlexNet 在 2012 年 ImageNet 竞赛中的胜利与传统的计算机视觉方法相比，目标分类的错误率降低了近一半。它的成功揭示了更深架构、更多数据以及
  GPU 加速的力量。


  ### 为什么“深”至关重要


  深度网络不是只有两个隐藏层的浅层网络，而是采用许多层（有时超过一百层），创建出层次化的特征表示。早期层检测裸边缘或颜色对比，而深层则将这些组合成复杂的特征图，以识别复杂的形状甚至是整个物体。


  ### 训练挑战与解决方案


  - **梯度消失/爆炸**：梯度幅度可能很小或很大。解决方案包括仔细的权重初始化、跳跃连接（`ResNets`）以及更好的激活函数。

  - **正则化**：`Dropout`、数据增强和批量归一化有助于防止深度网络中的过拟合。

  - **计算需求**：训练密集网络可能在 GPU 集群上需要几天或几周，尽管 `PyTorch` 和 `TensorFlow` 等框架简化了这一过程。


  ## 为什么架构中的“深度”很重要


  每一层都增加了一个抽象层。例如，`CNN` 可能在第一层检测边缘，在第二层检测角，在第三层检测简单纹理，并在后续层中将它们组合成物体部分。这种分步组合的机制是深度学习成功的核心。


  ## 层数越多总能产生更多智能吗？


  并不是越深越越好；复杂性可能会导致收益递减和训练时间难以控制。接下来，我们将探索一种专门的深度架构：卷积神经网络（`CNNs`），它们对于视觉、医学影像等领域的任务至关重要。


  ## 卷积神经网络：读取图像，重构视觉


  ## 超越放射科生的算法


  在斯坦福大学，一个基于 `CNN` 的系统在分析皮肤病变时，识别黑色素瘤的能力几乎等于或超过了经过认证的皮肤科医生，证明了 `CNNs` 在诊断中拯救生命的潜力。


  ### CNN 架构详解


  1. **卷积层**：使用可学习的过滤器（`kernels`）在输入图像上滑动，检测不同空间位置的边缘或纹理等特征。

  2. **池化层**：减少空间维度（通常通过取 `max` 或 `average`），以在保留关键特征的同时减少计算量。

  3. **全连接层**：在多次卷积+池化循环后，提取的特征被输入到层中，将它们映射到最终输出（例如类别概率）。


  ### 为什么 CNN 擅长视觉任务


  - **局部感受野**：卷积保留了空间关系。

  - **参数共享**：同一个过滤器在整个图像上被重复使用，与全连接网络相比，大幅减少了可学习的参数。

  - **平移不变性**：`CNNs` 能够有效地学习到右上角的特征与左下角的特征是相同的。


  ## 自动驾驶汽车中的 CNN


  除了医学影像外，自动驾驶车辆依赖 `CNNs` 来实时检测行人、车道标记和标志标志。基于 `CNN` 的检测系统必须处理动态且往往不可预测的环境。


  ## 视觉 AI 能走多远？


  从人脸识别到高级医学诊断，`CNNs` 彻底改变了我们分析视觉数据的能力。接下来，我们将转向另一种关键深度网络类型：循环神经网络（`RNNs`），它专为文本或时间序列等序列数据设计。


  ## 循环神经网络：机器中的记忆


  ## 学会像莎士比亚一样写作的 RNN


  一个在莎士比亚语料库上训练的早期 `RNN` 生成了莎士比亚风格的新文本，证明了神经网络能够捕捉语言中的长期依赖。


  ### RNN 内部原理


  - **隐藏状态**：维护来自之前步骤的信息。

  - **参数共享**：同一个过滤器在整个图像上被重复使用，与全连接网络相比，大幅减少了可学习的参数。

  - **平移不变性**：`CNNs` 能够有效地学习到右上角的特征与左下角的特征是相同的。（等等，原文此处重复了 CNNs，按指令保留。）





  GAN 能够生成栩栩如生的图像、声音甚至是整个虚拟世界。在我们深入研究高级架构之前，让我们先看看自动编码器和霍菲德网络等关注表示学习和记忆的神经网络。


  # 自动编码器、霍菲德网络与玻尔兹曼机器


  ## 一种学习压缩自身的神经网络


  自动编码器可以将数据（例如图像）压缩到低维的“潜空间”并进行重构。这一过程有助于发现隐藏模式，使其在降维中极具价值。


  ### 自动编码器


  • 编码器：将输入映射到压缩的潜表示。

  • 解码器：从此潜码重构原始数据。

  • 去噪自动编码器：学习从受损的输入中去除噪声。

  • 变分自动编码器 (`VAEs`)：引入概率技术，产生更多多样化的生成输出。


  ### 霍菲德网络与玻尔兹曼机器


  • 霍菲德网络：将多个模式存储为稳定状态；可以从部分线索中重构模式。

  • 受限玻尔兹曼机器 (`RBMs`) 是一种二分架构，用于特征提取并作为深度信念网络 (`DBNs`) 的构建模块。

  • 基于能量的模型：激活模式最小化能量函数，从而培养稳定的表示。


  ## 基于记忆的模型的隐藏层


  这些架构在无监督设置下表现出色。它们可以学习复杂的嵌入并处理异常检测或重建缺失信息等任务。


  ## 特征提取真的是 AI 进展的关键吗？


  自动编码器强调了压缩有意义的特征如何支撑高效的数据使用和稳健的。接下来，我们将进入强化学习，智能体在那里学习自主导航动态环境。


  # 强化学习：追求自主


  ## 击败围棋顶级冠军的 AI


  DeepMind 的 `AlphaGo` 利用强化学习（以及蒙特卡洛树搜索）在古代围棋游戏中击败了李世石。由于分支因子巨大，围棋长期以来被认为过于复杂，无法通过暴力搜索解决。


  ### RL 基础


  1. 代理：学习行动的实体。

  2. 环境：提供状态、奖励或惩罚的外部世界。

  3. 策略：从状态到动作的映射。

  4. 价值函数：估计给定状态的未来奖励。


  ### 方法与框架


  • `Q-Learning`：智能体学习动作价值函数 `Q(s, a)`，代表在状态 `s` 下采取动作的预期回报。

  • 策略梯度：直接优化可微策略；在连续动作空间中流行。

  • Actor-Critic 方法：结合了最好的基于价值和基于策略的方法。


  ## 奖励函数与优胜劣汰算法


  奖励定义错误，你的代理可能会“作弊”。例如，赛船游戏 AI 可能会发现反复碰撞可以获得微小但无限的生存奖励，从而忽略真实目标。


  ## 强化学习将诞生真正的机器自主吗？


  随着 `RL` 复杂性的增加，特别是与深度网络融合时，一个新领域正在出现：自动驾驶汽车、游戏 AI 以及从自身错误中迭代学习的工业机器人。接下来，我们将探索 `RL`
  如何与机器人和感知相结合实现现实行动。


  # 机器人、视觉感知与智能体


  ## 亚马逊仓库和你的客厅中的机器人


  现代仓库依赖机器人群自主导航和分类物品。同时，像 Roomba 扫地机器人这样的个人机器人已成为家庭常客，采用基于传感器的 AI。


  ### 机器人智能的组件


  1. 感知：解释传感器数据，如摄像头、`LIDAR` 或红外。

  2. 定位与地图构建：`SLAM`（同步定位与地图构建）帮助跟踪位置。

  3. 运动规划：`RRT`（快速探索树）引导机器人。

  4. 控制：`PID` 控制器确保运动稳定。


  ## 人形在舞台上跳舞的日子


  Boston Dynamics 的 `Atlas` 可以完成后翻，这是结合了传感器融合和敏捷性的壮举。


  ## 我们很快就能看到无缝机器人吗？


  随着传感器变得廉价且 `AI` 变得复杂，`RL` 可以处理一切。我们现在来看自然语言处理 (`NLP`)。


  # 自然语言处理、聊天机器人等


  ## 拯救银行的聊天机器人


  在深蓝之前，带有 Alpha-Beta 剪枝的 `Minimax` 是象棋引擎的核心。一个实现良好的系统可以在惊人的深度上胜过人类思维。


  ### NLP 构建模块


  • 文本预处理：分词、小写化、删除停用词。

  • 词嵌入：`Word2Vec` 和 `GloVe` 将单词映射到密集向量。

  • 语法与语义：词性标记、依存法分析、命名实体识别。

  • 用于 `NLP` 的 Transformers：如 `BERT` 和 `GPT` 等大型语言模型在阅读理解、摘要和情感分析方面达到了顶水平。


  ## 用于情感分析的 NLP


  企业挖掘 Twitter 或评论以评估公众情绪。复杂模型可以检测正面或负面情感、讽刺或上下文细微差别。


  ## 机器会完全理解人类情感吗？


  `NLP` 进展迅速，但真正的情感智能仍然是未解决的问题。我们重新回顾规划、调度和问题解决。


  # 规划、调度与问题解决：经典 AI 策略


  ## 一秒解决五十年的难题


  经典 AI 擅长处理定义良好的难题，从农翁塔到复杂的调度。单个调良好的算法通常能找到最优或近优的解决方案。


  ### 算法工具箱


  • 状态空间搜索：`BFS`、`DFS`、均匀代价搜索和基于启发式的方法。

  • `STRIPS`（斯坦福研究研究院问题求解器）：一种将目标分解为子目标的规划语言，许多 AI 规划系统的基石。

  • 约束满足问题 (`CSPs`)：通过系统地执行约束来解决数独或资源分配等谜。


  ## 优化生产线的算法


  制造商使用高级调度算法来协调机器使用、减少闲置时间并提高吞吐量。尽管深度学习具有吸引力，这些经典的 AI 解决方案依然稳健。




  从策略游戏到开放世界 RPG，`A*` 经常被用于敌人和 NPC 的导航，确保它们的移动真实可信，而不会在暴力检查上耗尽 CPU。


  ## 搜索如何演变为真正的预见性？


  将深度学习与基于搜索的规划相结合产生了 `AlphaZero`，它从零开始学会了国际象棋、围棋和将棋。接下来，我们将转向语音识别，将原始音频转换为结构化文本。


  ## 语音识别：从语音命令到情感检测


  ### Siri 首次（几乎）理解了讽刺的时刻


  Apple 的 `Siri` 偶尔会提供幽默的回应，这反映了语音识别的进步以及对基础语用学的理解。尽管远非完美，但与 20 世纪 90 年代笨重的语音系统相比这是一个巨大的飞跃。


  ### 语音识别流水线


  1. `声学建模`：将原始音频信号转换为音素组件。

  2. `语言建模`：预测哪种词序列最可能（通常使用 `n-grams` 或神经网络）。

  3. `端到端深度学习`：现代方法将声学模型和语言模型折叠到单个神经网络中，显著降低了错误率。


  ### 情感检测及其他


  一些高级模型尝试通过音调和韵律来判断说话者的情绪状态（例如兴奋与沮丧），这为治疗或客户服务开辟了可能，但也引发了隐私担忧。


  ## 支撑 Alexa 运行的数据大山


  Amazon 的虚拟助手处理数十亿条命令，不断完善其模型。这种巨大的规模既是福音（大量的训练数据），也是诅咒（隐私问题、潜在偏见）。


  ## 完美的语音识别会重塑我们与技术的交互吗？


  语音驱动的界面可能成为常态，特别是随着穿戴设备和 `IoT` 设备的普及。接下来，我们将讨论`自适应合成理论`和模块化神经网络，这些是 AI 研究中不为人知但影响巨大的框架。


  ## 自适应合成理论与模块化神经网络


  ### 一种模仿人类感知的很少讨论的方法


  Stephen Grossberg 推进了自适应合成理论 (`ART`)，以协调新数据与现有知识之间的关系，同时避免灾难性遗忘。这种方法与人类在保留核心记忆的同时不断从新经验中学习的方式产生共鸣。


  ### ART 机制


  - `共鸣`：当输入模式与现有表示匹配时，系统会“共鸣”并巩固学习。

  - `重置机制`：如果新模式不符合，`ART` 会触发重置，形成新的类别或精炼边界。


  ### 模块化神经网络


  - `分治法`：与巨型网络不同，多个较小的网络专注于子问题（如视觉对比语言）。

  - `专家混合模型`：门控将输入路由到最适合给定输入领域的任何“专家”。


  ## 在独立模块中拆解复杂任务


  模块化设计可以减少过拟合，提高可解释性并实现有效扩展。它们镜像了人类大脑拥有专门的视觉、语言和运动控制区域。


  ## 模块化架构能超出我们的想象进行扩展吗？


  随着 AI 进入日益复杂的任务领域，多网络方法和持续学习可能变得至关重要。接下来，我们将看到这些技术如何出现在现实、高风险医疗、金融及其他场景中。


  ## 现实世界应用：医疗、金融及其他


  ### 使用 AI 预测生命威胁事件的医院


  一家大型医院连锁机构采用 `ML` 模型分析 `EHR`（电子健康记录）数据，检测败毒症的早期迹象。医生在患者病情恶化几小时前收到警报，大大提高了生存率。


  ### 行业特定突破


  - 医疗：`放射学`（基于 `CNN` 的图像分析）、个性化治疗预测、药物发现。

  - 金融：使用异常检测进行欺诈检测、通过 `RL` 优化高频交易以及用于投资组合管理的机器人顾问。

  - 零售与电子商务：推荐系统、动态定价、需求预测。

  - 制造业：预测性维护、自动化质量控制。


  ## 欺诈检测中的 AI：金融奇迹


  银行将异常检测与集成模型相结合，实时识别可疑交易，在欺诈活动升级前将其终止。


  ## AI 会取代专家还是让他们变得强大？


