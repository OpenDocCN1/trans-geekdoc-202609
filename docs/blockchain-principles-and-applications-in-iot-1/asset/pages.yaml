- pgno: 8
  md: '# Section Blockchain Principles


    Chapter 1 gives the overview of blockchain and IoT. It starts with the discussion
    of various components in IoT. This chapter covers a detailed literature review
    with challenges in IoT in the next section, including security requirements in
    IoT. Thereafter, this chapter gives the definition of blockchain and types of
    blockchain. Then it moves towards the component of blockchain with privacy and
    security requirements of blockchain. Finally, this chapter shows how blockchain
    is integrated with IoT for various applications.


    Chapter 2 covers all the consensus mechanisms. A consensus mechanism is an algorithm
    that approves transactions or records on a decentralized ledger while rejecting
    false or fraudulent records. This chapter covers mostly used consensus mechanisms
    like proof of work, proof of stake, delegated proof of capacity, proof of elapsed
    time, proof of authority, and proof of activity with their block diagrams, explanation,
    proof, and cons. This chapter concludes with a relative study of these consensus
    mechanisms.


    Chapter 3 covers smart contracts that provide services to the users of a blockchain.
    It starts with the definitions of the smart contracts and off-chain contracts.
    Next, it covers the literature followed by the workings of the smart contracts
    with various example platforms. Then it discusses issues related to security in
    smart contracts. Another aspect is covering applications of smart contracts with
    various use cases. This chapter ends with research challenges in smart contracts.


    Chapter 4 covers the Internet of Things (IoT) in detail. This chapter starts with
    the introduction of IoT and its applications. Then it covers the generation of
    IoT life cycle followed by amalgamation of blockchain for IoT applications. Thereafter,
    it discuss network slicing of IoT and IoT-enabled technologies. This chapter ends
    with research challenges and the future scope of IoT in our world.


    Chapter 5 gives details about blockchain implementation challenges in IoT. It
    discusses the research challenges in blockchain like, scalability, integrated
    cost, privacy and security challenges, regulation issues, energy consumption,
    lack of standardization, selfish mining, lack of understanding, and awareness
    with a detailed literature coverage. Next, this chapter gives mathematical foundations
    of blockchain which the difference between blockchain and mining applications.
    Some of the cryptographic foundations are also discussed in the last part.


    Chapter 6 covers how blockchain and IoT can be a benchmark in Industry 5.0. It
    starts with IoT overview with benefits, drawbacks, and applications. Then the
    chapter moves towards IoT security. Thereafter, this chapter discuss the workings
    of IoT. It concludes with various smart applications of IoT in Industry 5.0.


    # Section B Blockchain Applications in Internet of Things (IoT)


    Chapter 7 gives an implementation of ASIC-based mining system in blockchain for
    IoT environment to increase scalability and security. This chapter starts with
    the present problems in IoT applications using blockchain and gives the proposed
    solution. Then it gives the detailed understanding of blockchain implementation
    perspective. In the next'
  merge: -1
  img_proc: true
- pgno: 9
  md: '# Preface


    section, it gives the proposed model in details. This chapter concludes with ASIC
    miners and a comparative study of why one should opt for ASIC mining based blockchain
    for IoT applications.


    Chapter 8 shows how blockchain can be used for patient record management and analysis
    with machine learning. It starts with preliminaries and background of the proposed
    system. Next, it moves towards importance of health care, followed by machine
    learning approaches. Finally, this chapter concludes with a future scope.


    Chapter 9 gives an IoT-based electronic health records (EHRs) management system
    using blockchain technology. This chapter starts with the importance and structure
    of the blockchain followed by blockchain components and actors. Then it gives
    the proposed model and implementation with various types of blockchains. Thereafter
    it gives the proposed system, working philosophy, and algorithms. It concludes
    with the importance and overview of the system.


    Chapter 10 tells us why it is important to study blockchain and IoT as university
    courses (UG, PG, and PhD) in the context of India and internationally. This chapter
    is all about e-learning, regular learning, and vocational learning of blockchain
    and IoT. It covers detailed courses available worldwide for the study of blockchain
    and IoT. Finally, this chapter concludes with some proposed courses in blockchain
    and IoT.


    # Section C Security Aspects in Blockchain and IoT


    Chapter 11 covers cryptographic and consensus techniques supporting privacy and
    security management of cryptocurrency transactions in details. Cryptocurrency
    is another important application of blockchain and it requires a high degree of
    privacy and security. This chapter starts with blockchain fundamentals and transaction
    process in cryptocurrency. Next, it covers privacy and security issues in detail.
    Cryptographic techniques are the algorithms and protocols that provide privacy
    and security, and this is discussed in detail thereafter. This chapter concludes
    with various consensus mechanisms and their securities.


    Chapter 12 gives a database approach using blockchain for storing information
    that can be used for access in IoT systems. After a discussion of blockchain,
    it discusses Ethereum-based blockchain and smart contracts. Next, it moves towards
    proposed architecture and implementation. A conclusion is drawn in the last section.


    Chapter 13 gives all the cryptographic foundations of blockchain technology. In
    detail, it starts with cryptographic hash function and discusses public key cryptography.
    The post quantum cryptography concept is covered. Then it moves to zero knowledge
    protocols and lightweight cryptography, which are needed for IoT and blockchain
    security.


    Chapter 14 provides an access control and data security model for IoT applications
    using blockchain technology. It starts with various access control methods and
    challenges. Then it gives this scenario regarding blockchain technology. Then
    it discusses blockchain-based access control in various domains. This chapter
    concludes with future directions and research issues.


    Chapter 15 discuss the lightweight cryptography and protocols, which are now the
    only ways to provide security in low resource IoT applications. First, it gives
    a detailed'
