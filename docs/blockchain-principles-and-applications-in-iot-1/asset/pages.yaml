    [11–15]. The blockchain can be three types: public blockchain, private blockchain,
    and hybrid blockchain.

    Public blockchain is a kind of blockchain that is open in nature and here de-centralized
    computer networks are used for accessibility to anyone interested in a transaction
    [16]. Those who are validated in the transaction receive rewards. Such kinds of
    blockchain are used in two models:


    +   - Proof-of-work

    - Proof-of-stake


    Furthermore, two common examples of public blockchains include the Bitcoin and
    Ethereum (ETH) blockchains. High security, open environment, anonymous nature,
    no regulations, full transparency, distributed, etc are the prime examples of
    blockchain technology [17], [18].

    Whereas private blockchains have the restrictions and are not open, they have
    access restrictions. In private blockchains, people need permission to do the
    transaction and here the role of system administrator is important. Hyperledger
    is a private, permitted blockchain. Basically, private blockchain solutions develop
    these platforms for the internal networking system of a company. Some of the features
    of private blockchain technology are full of privacy, high efficiency, faster
    transaction, better scalability, and speedness [8,20).

    The hybrid blockchains are the mix of both public blockchain and private blockchain.
    Hybrid blockchains offer better control for achieving a higher goal and can centralized
    and decentralized features. It is important to note that, hybrid blockchains are
    not open but still offer blockchain features such as integrity, transparency,
    and security. A hybrid'
