    # 12.2 IoT and Blockchain


    Kevin Ashton coined the term IoT in 1999 with reference to supply chain management
    [11]. The Internet of Things (IoT) is a system of interconnected devices that
    fetch data from the local environment and share it to process, store, and analyze.
    All smart devices, embedded systems, and sensors are IoT [12]. IoT networks are
    showing a rapid increase in demand and scale. Cisco predicted that there will
    be 500 billion IoT devices by the year 2030. Centralized systems are getting expensive
    due to deployment and maintenance overheads [13]. Along with these pre-existing
    problems trust and security is also a matter of concern in these traditional systems
    as data can be forged and modified [14]. Proper measures should be introduced
    to enhance the security and trust of the systems that are often a gateway to confidential
    information.


    Blockchain is a kind of tamper-resistant data structure where the data is grouped
    into a chain of blocks [15]. It is distributed, decentralized, and immutable [16].
    Distributed architecture means that data is not stored in a single node. In this
    peer-to-peer network, each node in the network has a copy of the blockchain so
    the failure of a single system does not affect the network. Decentralization ensures
    no single user has control over the data [17]. It eliminates the requirement of
    a third-party validation for transactions, which blockchain uses public-key cryptography
    that gives owners control over their digital assets [18]. Immutability helps to
    avoid any unauthorised alteration of records. To pass a change in a blockchain,
    we need to have the approval of 50% of the network. they can control the whole
    network. This is also known as the 51% attack [19].


    A block contains the cryptographic hash of its data and the hash of the block
    and so on forming a chain. It is similar to the linked list data structure [16].
    So if data is'
