    # 11.2.4 Transaction Process


    In a blockchain network, if a client wishes to transmit a cryptotoken to another
    client, the sender must first request a transaction. After a request has been
    submitted, a block representing the transaction is formed. A timestamp, hash value,
    nonce, block version, and data are all included in this block. The block is submitted
    to all other nodes in the network. The block and the transaction are validated
    by every node in the network. Nodes receive rewards for the proof of work and
    the block is added to the chain when it has been validated. Then, the cryptotoken
    transfer from one to another becomes finalized and legitimate [10–12]. The transaction
    process flow of a cryptotoken is depicted in Figure 11.4.


    # 11.2.5 Wallet and Addresses


    The client must first utilize a wallet app to start using a cryptotoken. A public
    key and a private key are generated by the wallet app. The private key may be
    considered as a PIN that allows us to access our cryptokens and authorize payments,
    and has to be a secret. The public key may be considered as an account number
    of a bank. The private key is used to generate the public key using mathematics.
    A hash function is utilized to the public key to produce a cryptotoken address.
    Each address has its own cryptocurrency balance, and transactions are generally
    cryptotoken transfers between these addresses. For example, if Alice transfers
    50 BTC to Bob, this transaction may be considered an instruction to subtract 50
    BTC from the balance of Alice’s address and add 50 BTC to the balance of Bob’s
    address [9,13].


