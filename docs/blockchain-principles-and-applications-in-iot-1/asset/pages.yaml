- pgno: 261
  md: '# Access Control and Data Security


    A number of papers that we found in our study use the “privacy-preserving” as
    a foremost remark of access control. The term deals with allowing owners to control
    the access to their data as well as protecting the confidentiality of unauthorized
    users. In a broader sense, the term also encompasses the ability for users to
    view who all have accessed their data. At the same time, the identity of the user
    and the access requests to the data should not be revealed to the open public.
    When all the above requirements are fulfilled, a privacy-preserving access control
    system can be said to be truly built.


    # 14.3.1 Access Control Methods


    The previously specified features are often encoded into access control policies
    using different models known as access control models. These models vary in the
    way they are implemented and the degree of granularity and control they allow
    over the resources. Different models use different variables and functions to
    implement the access control rules. Often all the access control are classified
    into mandatory access control (MAC) or discretionary access control (DAC). In
    MAC, permissions are given on a level based hierarchy. Administrators create levels
    and assign users to levels while rules are specified in a manner that a user can
    access all resources that are not above his level, however, provides access by
    the identity of the individual. Usually this is done by maintaining a list of
    authorized users for each resource. MAC is more suited for general use cases classifications
    (labels) are assigned to each file system object and the subjects (users) and
    rules are assigned based on these classifications. DAC is more often used in a
    personal scenario assigning control over access policies of their resources. Some
    of the common access control methods are as follows:


    +   **Role-Based Access Control (RBAC):** This type of model makes use of rules
    or privileges assigned to users to specify the rules of access control. RBAC can
    implement both DAC as well as MAC. This model is suited to medium-sized organizations
    that assign a smaller number of roles to their employees. One limitation of RBAC
    is that it doesn''t allow for fine-grained access rules specification.


    +   **Attribute-Based Access Control (ABAC):** This model has been developed as
    a successor to the RBAC model that allows for additional attributes belonging
    to the user, resource, or environment or a mix of all these attributes. Boolean
    operations are often used to specify rules using these attributes. ABAC allows
    for a higher degree of granularity, but at the same time, it is difficult to configure
    the access for specific users while keeping other users with similar attributes.


    +   **Capability-Based Access Control (CapBAC):** Capability is defined as a communicable
    and unforgeable token of authority. In context of access control, this token represents
    a set of access rights that are provided to the user owning the token. This advantage
    of this type of model is that it provides easy delegation of rights by the transfer
    of the token.


    +   **Identity-Based Access Control:** This form of access control can be thought
    of as a specific implementation of the ABAC model where the attributes used are
    related to the identities of the users or the resources being accessed. Access
    is usually granted when users authenticate themselves, for example, using a password.
    This allows for a very fine-grained control over the policies allowed per user
    based.'
