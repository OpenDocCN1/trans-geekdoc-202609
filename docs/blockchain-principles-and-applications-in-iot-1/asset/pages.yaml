- pgno: 124
  md: '110


    Blockchain


    precedence over another, it becomes a shared ledger to decide which node will
    produce the next block. Since all nodes have a shared ledger, the block produced
    by one node must be propagated to the rest of the network. To solve this problem,
    various algorithms known as consensus algorithms define introduces.


    These algorithms define how the nodes attain a “consensus” or agreement among
    themselves as to which node should be producing the next block. Some of the popular
    consensus algorithms are:


    +   1. Proof of work (PoW)

    2. Proof of stake (PoS)

    3. Delegated proof of stake (DPoS)


    There are also many other consensus mechanisms [3,4] with new research conducted
    for building better and more efficient consensus models. Among the mentioned models,
    PoW is the most popular [5] as it was used by Bitcoin. In this consensus mechanism,
    every node competes to solve a cryptographic puzzle, and the first to solve it
    produces the new block. Although this model is resource intensive as compared
    to others, it is far the most decentralized method. In PoS, every node stakes
    a certain amount of cryptocurrency. The nodes with the highest stake produce new
    blocks. In PoS, every node “delegates” or votes for which node to be elected for
    block producing by staking cryptocurrency. The nodes with the maximum amount of
    cryptocurrency generated and produce blocks. Both PoS and DPoS can be centralised
    by a single account or stakeholder if that individual holds a very huge amount
    of cryptocurrency. Such individuals are termed “whales” in the cryptocurrency
    domain [6].


    We will using the PoW consensus algorithm for our implementation because of its
    decentralized nature. In the PoW consensus mechanism, a random number called a
    nonce is generated. A particular value for a nonce is accepted only when the block
    hash is generated, considering that value satisfies the criteria defined in the
    genesis block of the blockchain. Every node associated with mining will recursively
    keep on trying a random value unless the desired result is achieved.


    # 7.3.1.1 Advantages of Proof of Work Consensus Mechanism


    Unlike other mechanisms, in proof of work, all nodes are truly considered equal.
    There is no predetermined way to find which node in the network will be producing
    new blocks and it is random; hence, it is not possible to hack the node to produce
    malicious block data.


    # 7.3.1.2 Hardware-Based Block Producing


    ASICs, or application specific integrated circuits, are specially customized integrated
    circuits which are designed to perform specific tasks. These are highly optimized
    circuits that can be designed to produce maximum throughput with minimum energy
    consumption. An ASIC [7] can be used to design miners which are highly efficient
    in the process of producing new blocks (Figure 7.2).'
