    # 3.3.5 Transaction-Ordering Dependency


    This problem appears when two independent transactions invoke the same contract
    are merged into a single block. The miner chooses the order in which transactions
    are carried out. If the transformations are not performed in the proper sequence,
    an opponent can easily launch an attack. Assume that a puzzle contract exists,
    with the user who completes the puzzle solution (Tu), the evil owner immediately
    sends a transaction (To) to adjust the reward for the contract. By chance, those
    two transactions (To and Tu) might be within the same block. The user would receive
    a reduced payment if the miner executed To before Tu, and the wicked owner would
    succeed in their attack.


    # 3.3.6 Reliance on Timestamps


    The issue appears when a contract employs the timestamp of a block as a criterion
    to trigger and execute transactions. For example, a game-based contract selects
    the winner using the timestamp as a random seed. The miner usually sets the timestamp
    to the current local time. The timestamp, on the other hand, has the drawback
    of allowing a'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# Self-Executing Contracts


    dishonest miner to change its value by around 15 minutes while the blockchain
    system still accepts the block [30]. Because the timestamp value is not guaranteed
    to be correct, contracts that depend on it are vulnerable to attack by dishonest
    miners.


    # 3.3.7 Mishandled Exception Vulnerability


    This issue arises whenever a contract (caller) calls another contract (callee)
    without inspecting the value returned by the caller. When calling another contract,
    the contract may raise an exception. Depending on the call function''s architecture,
    this exception may or not notify the caller.


    # 3.3.8 Re-entrancy Vulnerability


    The problem arises when an attacker uses a recursive call function to make several
    repeating withdrawals. In June 2016, an attacker used the Decentralized Autonomous
    Organisation''s (DAO) re-entrancy vulnerability to steal over $60 million.


    # 3.3.9 Privacy Concerns


    There issues concerning privacy are:


    The lack of transactional privacy is the first issue. All transactions and user
    balances are visible to the public in blockchain systems [31]. Because many people
    perceive financial transactions to be confidential information, this loss of privacy
    may hinder the adoption of smart contracts.


    The lack of data feeds privacy is the second issue. When a contract necessitates
    the use of data feeds, it requests the provider of these feeds. This request,
    however, is public because it can be seen by anybody on the blockchain [32].


    # 3.3.10 Performance Issues


    Smart contracts are performed sequentially in blockchain systems. However, because
    the number of smart contracts that can be performed per second is restricted,
    this will severely impact the performance of blockchain systems. Blockchain solutions
    will be unable to scale as the number of smart contracts grows in the future.


    Different security issues related to the platforms and their corresponding preventive
    measures are given in the following table (Table 3.1).


    # 3.4 Applications for Smart Contracts


    This section covers the different application areas of a smart contract. People
    in the legal, commercial, technical, and other sectors have genuine reasons to
    be excited and apprehensive about expanding the prominence of smart contracts.
    There are numerous reasons to be optimistic. Smart contracts can improve economic
    efficiency, lower transaction, and legal costs, and make transactions more transparent
    and anonymous.'
