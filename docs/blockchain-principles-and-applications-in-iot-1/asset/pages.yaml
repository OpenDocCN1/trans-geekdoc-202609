- pgno: 277
  md: '# Access Control and Data Security 263


    The paper deploys an access control system similar to ABAC using users’ identity
    attributes. Intel SGX has also been used to protect the integrity and confidentiality
    of the policy enforcement process, which mainly uses a symmetric encryption approach.
    The user is able to reconstruct the key if they satisfy the access control policy
    of the organization owning the data. The paper argues against the blockchain for
    enforcing the cryptographic policy for two reasons: the approach would be publicly
    to all and running the algorithm on the blockchain would be too costly. Blockchain
    is instead used to ensure that users'' identity attributes or the defined access
    control policy cannot be easily modified by a malicious user but requires the
    verification of a certain majority of the participating organizations.


    Information centre networking (ICN) deals with other issues related to cloud infrastructures
    where attackers steal data from the various cache networks. Once cached at a location,
    data is no longer in the hands of the owner and cannot be controlled how it is
    processed. To ensure only the intended or authorized users obtain the data, authors
    of [44,45]P3 discuss a private blockchain-based approach to distribute the data.
    While the data is encrypted by a single key, the decryption keys are stored on
    the blockchain for each user, encrypted by their public key so that the authorized
    user can obtain the decryption key. This allows the content provider (CP) to not
    be online all the time.


    The design of [44] P3 consists of splitting the content into n blocks and encoding
    into m (n) blocks by the XOR encoding algorithm. Only out of the m blocks can
    correctly decode the original data and only the authorized users can successfully
    obtain the right set of blocks. The CP is responsible for encrypting the data,
    publishing the data to the blockchain as well as user registration along with
    the access policy thus giving the owner of the data in an ICN the complete control
    over/her data. Upon registration with a CP, a user receives credentials which
    can be searched in the blockchain to obtain the decryption keys for that set of
    data.


    Another issue is the one faced by cloud federations is the issue of shared ownership
    of data in the cloud. A single owner can delete files, revoke permissions and
    act maliciously without consulting the other collaborators. [43] P10 proposes
    two options to deal with this issue, the second one being a blockchain solution
    to reach consensus on access control decisions. Access control decisions are stored
    on the blockchain via smart contracts. Access control decisions are taken by multiple
    owners and the votes are stored on the blockchain. Whenever a user requests access
    for a file, the blockchain verifies the request against the access control policy
    as well as the owners'' votes stored on the blockchain.


