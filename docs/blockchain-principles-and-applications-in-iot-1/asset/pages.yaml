    # 3.2 Workings of a Smart Contract


    A smart contract is a group of procedural rules and logic for scenario-response
    scenarios. Specifically, they are blockchain-based decentralized, trusted shared
    codes [17]. The parties involved must be convinced of contractual specifications,
    violation of contract conditions, accountability for contract breach, and external
    verification data sources, and put it on the blockchain as a smart contract to
    automate contract execution on behalf of the signatories. There are no central
    agencies involved in the process (see Figure 3.3). Section 2 covers the workings
    of smart contracts, programming language and platforms used for Ethereum and Hyperledger
    Fabric, Further this section covers the steps involved in the development of a
    smart contract.


    # 3.2.1 Programming Languages and Platforms


    Different blockchain systems can be employed to create smart contracts. Platforms
    differ in terms of their qualities [18]. We''ll go through Ethereum and Hyperledger
    Fabric, two popular systems.


