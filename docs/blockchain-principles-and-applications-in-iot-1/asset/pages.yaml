    # 5.1 Introduction


    Blockchain is a widely known technology that is currently used in different business
    sectors. It is considered a disruptive technological innovation that enables to
    revolutionize the trading and interaction process of society. This reputation
    is specific attributable to its characteristics, which enables mutually mistrusting
    entities in controlling financial transactions and interacting without depending
    on a reliable third party. Blockchain technology and distributed ledgers gaining
    immense attention and initiating numerous projects in various industries. However,
    the financial industry can be considered the key user of the blockchain system
    [1]. This particular technology was initially created for supporting the


    DOI: 10.1201/9781030230957-6'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'renowned cryptocurrency Bitcoin in 2009. Since then, the application of this
    technology has been gradually increasing in different aspects of the business.
    Blockchain usually refers to a chain of blocks that save all committed transactions
    with the help of a public ledger. The length of the chain constantly increases
    while new blocks are attached to it.


    Moreover, blockchain functions in a decentralized environment that includes different
    core technologies: "cryptographic hash," distributed consensus algorithms, and
    "digital signatures." All financial transactions happen in a decentralized way
    that eradicates the necessity for intermediaries to verify and validate the transactions.
    The technology has major characteristics: "transparency,"decentralization," "audibility,"
    and "immutability" [2]. Apart from Bitcoin, the technology can be applied in other
    financial services, such as remittance, digital assets, and online payments. It
    can be applied in supply chain management, healthcare and hospitality management,
    digital media transfer, and many more. However, numerous challenges can emerge
    during the implementation of this technology. This paper will strongly focus on
    those challenges limiting the use of blockchain along with its structure and different
    application areas.


    # 5.2 Discussion of Challenges Regarding the Implementation of Blockchain


    Despite the wide range of blockchain applications in multiple business areas,
    several crucial challenges remain. These challenges limit the use of blockchain
    as well as prevent it from being applied in digital trades. Some of the challenges
    are described as follows.


    # 5.2.1 Scalability


    It is a vital challenge related to the implementation of blockchain as it limits
    the functionality of the technology. The size of the blockchain has become significantly
    huge the usage volume of the technology is increasing, and the number of occurred
    transactions is rising daily—blockchain processes and stores thousands of transactions
    in nodes to obtain validation [3]. Primarily, the present transaction source requires
    to be confirmed before the transaction itself. Moreover, the time break and block
    size limitation necessary for generating new blocks maintain a significant role
    in not fulfilling requirements regarding the instantaneous processing of many
    transactions in a real-time environment. Apart from that, the size of each block
    can also be an issue that is responsible for delaying the transaction.


    # 5.2.2 Integrated Cost


    High costs related to the implementation of blockchain can also be another critical
    challenge for many organizations. Replacing the old and existing system with a
    blockchain-centric new system requires financial resources and time as it involves
    many upgraded technologies. In addition, discovering the most appropriate blockchain
    system is not as easy as most are not entirely developed and tested [4]. Additionally,
    even the most reasonable platforms also require a huge cost to be implemented
    along energy cost. There is no specific cost for a blockchain-based solution as
    its price depends on the organization’s services that plan to implement it.'
