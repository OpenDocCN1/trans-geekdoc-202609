    # 5.2.3 Privacy and Security Challenges


    Privacy and security measures are always been one of the biggest concerns regarding
    the im-plementation of blockchain. Leakage of privacy related to the transaction
    is a major vul-nerability of the technology. The balances and the other credentials
    of public keys can be visible to those connected to that network. Due to that,
    there is a high chance of data breach, and the blockchain is mostly used in a
    financial transaction, the risk factors can enhance to a high extent [5]. This
    behavior makes the technology less applicable in most cases. However, this problem
    can be resolved by obtaining anonymity in the blockchain. It can be categorized
    into a mixing solution and an anonymous solution.


    # 5.2.4 Regulation Issues


    The lack of rules and regulations or improper guidelines and regulations is another
