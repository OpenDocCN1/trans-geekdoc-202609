    # 3.1 Introduction


    A blockchain is a digital record that stores transactions publicly after nodes
    have verified them. The nodes validate each transaction, and the cryptography
    hash function secures the transactions. A transaction is linked by the hash value
    of the previous transaction. No one can command or alter a transaction once it
    is added to the blockchain, but it can be viewed publicly, bringing transparency
    to the system [1]. To validate a transaction, blockchain employs some proof-of-work
    and proof-of-stake techniques.


    In the previous years, the growth of blockchain innovation has demonstrated that
    it offers a vast range of use cases. The combination of blockchain technology
    and smart contracts allows for a great deal of flexibility to design, develop,
    and implement real-world problems at a lower cost and less time than traditional
    third-party systems [2].


    This section covers introduction of smart contracts and off-chain contracts. The
    section also covers the literature survey.


    # 3.1.1 Definition


    The word "smart contract" was first given by Nick Szabo during the mid-1990s.
    He proposed turning contract clauses into code and embedding them in software
    or hardware to make the contracts self-executing, reducing costs among many parties,
    and away from unintentional discrepancies during the execution of the contract.
    This contract is a computerized code that executes on the blockchain and holds
    a set of protocols [3].


    Generally, the smart contract is used to describe the automation of legal contracts.
    This word describes a legal contract that could be expressed and implemented in
    software in whole or in part [4]. A smart contract lives on the blockchain and
    ensures that the required fulfill the user''s needs. Anyone connected to the network
    can see the code, which is publicly visible in the blockchain. The contract is
    triggered to ensure the digital transaction once the requirements are met by the
    specified deadline [5].


    The terms of a contract are encrypted with cryptography; no one can change the
    contents of a contract. The immutability provided by blockchain makes sure that
    a copy of the contract is stored on every node associated with the network, ensuring
    a backup version of the contract. The operating mechanism of a smart contract
    and the traditional contract between two or more parties is almost the same [6].
    There is no need to rely on attorneys to create a contract for them; instead,
    the smart contract is automatically executed to provide payment when specific
    criteria are fulfilled (Figures 3.1 and 3.2). In comparison to traditional contracts,
    smart contracts offer the following benefits:


    +   - Smart contracts cannot be changed arbitrarily once they have been published
    due to the immutability of blockchains. Furthermore, all transactions kept and
    mirrored across the entire distributed blockchain system may be traced and audited.
    As a result, nefarious activities such as financial fraud can be considerably
    reduced [7].'
