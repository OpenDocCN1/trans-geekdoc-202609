  md: '# 11.5.10 Proof of Ownership (PoO)


    PoO is a consensus technique designed for tracking the owners of certain information
    at a given point in time. Using PoO, both the prover and the verifier can check
    the ownership of an asset at zero cost. It makes deceitful on secondary markets
    and allows safer P2P transactions. This technique is used to confirm the integrity,
    date of publishing, and ownership of their products or contracts in businesses.
    In this approach, only those who have access to private key of the signature may
    verify them. A piece of data is always accompanied with a PoO. Certifying the
    ownership of a piece of data on the blockchain confirms that the data existed
    at a specific point in time. Cryptographic functions are always used to attach
    a PoO to a piece of data. This makes it impossible to change the data after it
    has been certified. If even a single bit of the content is changed, the entire
    certificate becomes invalid. Because proofs are stored on the blockchain, it is
    simple to transfer ownership to the original issuer of a certificate. Certificates
    cannot be double-spent. It applies not only to the CodeChain platform, but also
    to Bitcoin, Ethereum, Cardano, Litecoin, and other cryptocurrencies [60,67,68].


    # 11.5.11 Proof of Burn (PoB)


    PoB is an alternative consensus technique for PoS and PoW. PoB uses less energy
    than PoW. This technique ensures that miners achieve a consensus by burning cryptocurrencies.
    The process of permanently removing cryptocurrencies from circulation is known
    as burning. PoB-powered blockchains utilize it to validate transactions, in case
    of the fact that it reduces inflation. PoB is easily verifiable but difficult
    to undo in comparison to PoS and PoW [69]. PoB validates transactions using virtual
    mining equipment rather than real ones. As a result, the more coins you have,
    the more power you have, and vice versa. Higher mining capability increases the
    speed of finding new blocks. As a result, the miner earns more rewards. PoB is
    described in detail in the reference [70].


    # 11.5.12 Byzantine Fault Tolerance (BTF)


    A Byzantine fault occurs when a component in a distributed computing system fails
    and there is no sufficient information to decide whether a component has failed.
    The goal of BTF is to be able to resist against system failures or without symptoms
    that prevent other system components from reaching a consensus among them, which
    is required for correct operation of the system [71]. NEO platform utilized BFT
    as a consensus technique. BFT is a system that provides correct service without
    interruptions. Service interruptions are mostly caused by Byzantine faults as
    software flaws, operator errors, and malicious assaults. Therefore, practical
    Byzantine fault tolerance (PBFT) was developed to overcome a number of issues
    with existing BFT solutions. It is designed with a minimal overhead time. PBFT
    is described in detail in the reference [72].


