  md: '# 11.2 Blockchain


    # 11.2.1 Introduction


    The technology of blockchain is mainly developed for transacting a cryptocurrency.
    Attempting to solve the problems for tracking and validation of distributed transactions
    using cryptographic primitives is one of the main functions of the blockchain.
    The whole transaction history is recorded. If the user needs a recent past, they
    can filter it out. Blockchain has its own rules and regulations. The rules and
    regulations are written as a smart contract before starting a transaction. A transaction
    is only possible between two peers on the P2P network that operates on a cryptographic
    protocol. The sender should enter a digital signature before making a transaction.
    This digital signature validates the transaction. If this signature is validated,
    the transaction is proceeded meaning that a cryptocurrency can transfer a digital
    currency directly between two parties without any third party. As a distributed
    ledger, a distributed timestamping server [5] are used to manage a block autonomously,
    meaning that the whole network is decentralized. This makes blockchains suitable
    for the recording of transactions of any kind. As a result, the blockchain provides
    a number of advantages to a cryptocurrency business, including “immutability,
    decentralization, anonymity, improved security, and higher capacity” [6].


    # 11.2.2 Structure of a Block


    The blockchain is a data structure that represents a public distributed ledger
    made of a linked list of blocks that are connected together using cryptographic
    primitives. A fundamental unit of blockchain is the block, which is made of two
    parts: “the block header and the block body. The block header contains of block
    version, previous block hash, Nonce, Merkle root hash, and timestamp. [7]. The
    block body contains a transaction counter and transactions” The structure of a
    block in a blockchain is depicted in Figure 11.1. For the formation of blockchain,
    the blocks are joined as a linked list by the hash value of the previous block
    header, as seen in Figure 11.2, and are cryptographically protected.


    # 11.2.3 Blockchain Architecture


    Blockchain architecture is made of “six layers: a data layer, a network layer,
    a consensus layer, an incentive layer, a contract layer, and an application layer”
    [8–10], which are depicted in Figure 11.3.


    +   **Data Layer** – At the data layer, transaction data is collected and stored
    in a block of the linked list data structure known as a ledger utilizing asymmetric
    encryption methods, hash functions, Once and time-stamped Merkle trees [8,9].n**Network
    Layer** – The network layer connects all of the nodes in the network and establishes
    a decentralized P2P network environment. It utilizes distributed systems, data
    transmission protocols, and data verification mechanisms. The principal responsibility
    of the network layer is to verify and forward the transactions over the network.
    A digital signature technique is utilized to verify the transaction [8,9].'
