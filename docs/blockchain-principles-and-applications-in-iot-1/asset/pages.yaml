    # 14.4 Permissionless vs Permissioned Blockchain


    Permissionless blockchains allow anyone to enter the blockchain network and publish
    nodes. Any participant in the network can view and write onto the ledger. Hence,
    such types of blockchains are also called as public blockchains. Often PoW or
    PoS consensus protocols are used in this system to safeguard bad actors in the
    network. Consensus mechanisms also allow incentives to encourage good practices
    in the blockchain. The blockchains and their consensus algorithms are all openly
    opened and available for anyone to use. As the blockchains are all, setup cost
    in a permission-less blockchain is often less. The popular blockchains, Bitcoin
    [14] and Ethereum [15], are examples of permission-less blockchains. Ethereum,
    however, has a permitted blockchain implementation also for use.


    Permissioned blockchains, on the other hand, require publishing users to be authorized
    by some kind of authority. The authority can be a single organization (private
    blockchain) or a group of organizations (consortium blockchain). Since only a
    few nodes are allowed to verify the transactions, these blockchains are faster
    and offer higher scalability. Reading rights may be allowed to all participants
    or a selected few as decided again by the authority. The HyperLedger Fabric is
    an example of a permitted blockchain [22].


