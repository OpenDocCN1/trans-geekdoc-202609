- pgno: 275
  md: '# Access Control and Data Security


    +   - Need for Trust: Cloud service providers (CSPs) do not provide any form of
    contract mentioning they will not misuse the data or for their own purposes. Additionally,
    they may decide to shut down their services any time, leading to a lack of trust
    in the CSPs. CSP may also leak data to third-party providers in anonymized or
    non-anonymized format leading to privacy breach. [38][P36]


    +   - Issues with Collaboration: Data misuse and leakage of data can also arise
    in Cloud Infrastructures, where organizations share their data across cloud infrastructures
    to achieve a common goal. Not just data, even access control policies may be changed
    by any malicious participating party [39–42][P39][P47]


    +   - Access Key Distribution: Another common issue with access over cloud is
    the distribution of encryption/decryption keys that are commonly used in several
    access cloud models. [43][P10]


    2. Current Research: Out of the short-listed papers under our study, we found
    a total of six notable papers as shown in Table 14.2 over the cloud domain. Cloud
    is however, a domain that is part of healthcare and IoT. The six papers we consider
    here tackle problems faced by users and cloud service providers (CSPs) in maintaining
    a security, privacy-preserving environment for users'' data. The papers under
    our study attempt use a blockchain to suit the needs of a privacy-preserving cloud,
    having the facilities of data sharing, and auditing as well. At the same time,
    the aim is to ensure that the users can control their data entirely when stored
    on the cloud, including the various consumers who can access the data.


    In [38][P36], the authors describe the common issue of a cloud environment where
    the data owners have no information of how their data is being processed, stored
    or where the data is being accessed. Data breaches and breaches to third-party
    data seekers is a major issue in such cases. The proposed solution involves combining
    existing cryptographic measures with blockchain decentralized and tamper-proof
    solution to create a transparent, controlled, privacy-preserving environment also
    facilitating sharing of data among different data providers/seekers.


    Data privacy is maintained by hierarchical identity based encryption (HIBE) and
    hierarchical identity based signature (HIBS) schemes. Data access, including the
    access policy is maintained by the owner. The data owner themselves generate a
    set of ID-based pair of keys to encrypt as well as the data intended to be shared
    with a service provider. Using per smart ID-based key, no link can be established
    between the smart contract and the data owner, preventing any re-identification
    of data owners. For each provider the data owner intends to share the data with,
    a smart contract exists, defining the structure of data, access policies, as well
    as the actions that the service provider can perform over the data. Another form
    of smart contract also exists, when a second provider/data seeker seeks to request
    data from the first provider. A smart contract is ahead ahead creating a transaction
    in the public blockchain notifying the owner, who goes ahead with the second provider.


    [40] P47 deals with issues faced by cloud federations (CFs). CFs are a collaborative
    program between infrastructures where organizations share data in order to achieve
    a common goal. Issues relating to CFs include the leakage or misuse of data as
    well as unauthorized or illegal modification of access policy by a malicious user/participating
    entity.'
