- pgno: 7
  md: '# Preface


    Blockchain is a distributed ledger system to keep all the data in a chain of blocks.
    This system is basically a server less system and the node works in mutual consensus.
    The basic principle is, first transaction/data is created and it is agreed by
    n/2+1 nodes of ‘n’ number of nodes, then hash is generated to this new data plus
    block, and finally data+hash is the block generated to be added in the blockchain.
    Once a data is added then no modification or deletion is possible in future. Principally,
    blockchains are of mainly two types, private/permission blockchain and public/permission-less
    blockchain. Bitcoin and Ether are famous blockchains.


    Blockchains have many applications in the IoT domain. Blockchain can be used for
    traffic data system, sensor data, supply chain management and one important application
    is no-code or low-code software development. Blockchain technology is the answer
    to the primary challenges of IoT, including its scalability, privacy, and reliability.
    Blockchain technology can be an excellent means to track and monitor billions
    of connected devices, enabling the sharing and processing of transactions between
    connected devices. Moreover, decentralized, it eliminates single points of failure,
    creating a more resilient ecosystem for devices to run on. Blockchain IoT can
    facilitate secure and reliable collaboration between connected devices in an IoT
    network.


    This, book will cover all the aspects of blockchain, its application in IoT, and
    all the security aspects. This book is edited, it is designed that can be used
    as a textbook/reference book in UG and PG courses having blockchain as a subject.


    This book is organized into three sections, “Section A: Blockchain Principles”
    describes the overview of blockchain and IoT in Chapter 1. Next, all the important
    algorithms are covered in Chapter 2. Smart contracts, as one of the important
    features through which blockchain offers services to users, is covered in Chapter
    3. Chapter 4 covers the Internet of Things (IoT) in detail. The implementation
    challenges in blockchain are covered in Chapter 5. Chapter 6 covers how blockchain
    and IoT can be a benchmark in Industry 5.0. “Section B: Blockchain Applications
    in Internet of Things (IoT)” describes ASIC-based mining system in blockchain
    for IoT environment and also discusses scalability and security issues in Chapter
    7. Chapter 8 shows how blockchain can be used as patient record management and
    analysis using machine learning approach. Chapter 9 is about an IoT EHM system
    using blockchain. Chapter 10 tells why it is important to study blockchain and
    IoT as university courses (UG, PG, and PhD) in the context of India and internationally.
    The final section, “Section C: Security Aspects in Blockchain and IoT,” gives
    a detailed understanding of cryptographic and consensus techniques supporting
    privacy and security management of cryptocurrency transactions in Chapter 11.
    As blockchain is itself data repository, Chapter 12 covers secure blockchain-based
    databases for storing sensitive information for access control IoT systems. Chapter
    13 gives the necessary cryptographic foundations required to implement a blockchain
    securely. Chapter 14 covers access control and data security of IoT applications
    using blockchain technology and protocols that are nowadays used extensively for
    blockchain and IoT security.'
