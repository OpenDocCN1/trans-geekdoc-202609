- pgno: 236
  md: 'First, theoretical [2] and then practical cryptanalysis [3,4] SHA-1 hash function
    shows the importance of cryptographic algorithm selection in blockchains. On the
    other hand, the addition of new cryptographic algorithms might provide better
    security or new features to a blockchain. For instance, the Taproot upgrade of
    the Bitcoin that is scheduled for mid-November 2021 is to add Schnorr signatures
    [6] to the blockchain. These signatures have better security properties and allow
    key aggregation, which can shrink multiple signatures to a single signature [7],
    saving space and transaction fees.


    However, development of a large quantum computer would break digital signature
    algorithms of current blockchains because they rely on the discrete logarithm
    problem that can be solved on such a quantum computer in polynomial-time [8].
    Thus, the performance and the size of the digital signature algorithms competing
    in the Post-Quantum Cryptography Competition might be vital for future blockchains.


    Blockchains have evolved in time and different cryptographic algorithms like zero-knowledge
    protocols or lightweight cryptography found their way in this technology. For
    instance, the anonymity in Bitcoin has to be achieved by non-cryptographic cryptocurrencies
    like Zerocash [10] and [ash [11] use special types of zero-knowledge protocols
    [12] for anonymity.


    Blockchains also have Internet of Things applications. However, some IoT devices
    have small memory, computational power, or battery. When modern cryptographic
    standards are on resource constrained IoT devices, and efficiency can become an
    issue. Thus, blockchains on IoT devices might benefit from lightweight cryptographic
    algorithms. Moreover, finalists of NIST’s ongoing lightweight authentication competition
    were announced in March 2021 [13].


    Thus, the security of a blockchain requires understanding of the cryptographic
    foundations of blockchain technology. Algorithm and parameter selection significantly
    affect the security, performance, and efficiency of a blockchain. Thus, this chapter
    investigates the security of cryptographic algorithms that are used in blockchains.
    We are going to have an emphasis on Bitcoin, since it is the pioneer of its disruptive
    technology. Moreover, we are going to focus on lightweight cryptography, which
    is more suitable for constrained IoT devices.


    # 13.3.1 Methodology


    Since the use of digital signatures and hash functions in the Bitcoin blockchain,
    many other areas of cryptography found their way to blockchain technology:


    +   1. **Hash Functions:** In a blockchain, hash functions can be used for address
    derivation, securing the block header, creating data, creating unique identities,
    and creating cryptographic puzzles.


    +   2. **Public-Key Cryptography:** Digital signature algorithms are used for
    signing transactions in a blockchain. Moreover, threshold cryptography can be
    used for secret sharing.


    +   3. **Post-Quantum Cryptography:** Building a large quantum computer would
    render most of the public-key algorithms useless, including the digital signature
    algorithm and its variants. Quantum-safe digital signature algorithms can be used
    in blockchains in case of such a technological advancement. However, performance
    and size of such digital signatures can be vital for blockchain technology.'
