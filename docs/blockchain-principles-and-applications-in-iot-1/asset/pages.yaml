- pgno: 54
  md: '# 3.2.1.1 Ethereum


    The Ethereum platform allows applications to run precisely as they are programmed,
    with no downtime, censorship, theft, or interference of a third party. Ethereum
    applications are powered by Ether, Ethereum’s platform-specific cryptographic
    token. Ether can be utilized as a digital currency and reward the participant
    nodes for their tasks [19].


    # 3.2.1.2 Hyperledger fabric


    The Linux Foundation administers this blockchain platform. This framework is used
    to build distributed ledger systems, and it is based on a modular design that
    allows for high levels of confidentiality, robustness, flexibility, and scalability
    [20]. It is created to allow for pluggable deployments of various components while
    also considering the complexities and complexities that occur throughout the economic
    environment.


    The platform use technology to store smart contracts known as “chain code,” which
    make up the system’s application logic. Aside from that, “chain code” is the only
    way to interface with the blockchain and the only transaction data source. Smart
    contracts on Ethereum can be authored in several high-level languages. These codes
    will be compiled into EVM bytecodes and executed [21].


    Go and Java languages are used to write a smart contract for Hyper ledger Fabric
    [22]. The key to implementing smart contracts for this platform is to use the
    “chain code” interface. There are three functions: Init, Invoke, and Query. These
    functions handle the deployment of the contract, processing of the transaction,
    and transaction queries, respectively.


    A smart contract can be executed utilizing a unique address allocated to it blockchain
    technology. For a clear understanding of how a smart contract works, consider
    a scenario: If someone wishes to sell a property or give it rent to someone, they
    can easily leverage an existing blockchain network to deploy a smart contract
    [23].


    Information on the property can be kept in the blockchain, and any member in the
    network can view it, but no one can alter it. In this manner, the owner of that
    property can easily find a buyer without the help of a third party [24].


    Smart contracts built on the blockchain have a lot of advantages in a variety
    of scenarios:


    +   - Reliability and real-time updates

    - Accuracy

    - Reduced risk of execution

    - There are fewer middlemen


    +   - It is expensive


    # 3.2.2 Steps to Take When Developing Smart Contracts


    Following are the steps to develop a smart contract [25]:


    +   1. Recognize the smart contract’s use case.


    +   2. Generate a new architecture for smart contract interactivity, as a flowchart
