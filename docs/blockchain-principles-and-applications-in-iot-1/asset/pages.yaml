    # 14.6.2 Cloud


    Cloud computing is one of the most successful domains of computer science in the
    last decade, bringing everyone in the world closer to each other. Almost all data
    is now stored on the cloud for purposes of sharing, remote usage, and offering
    transparency of a centralized store. However, not everyone is aware of the risks
    associated with the storage of data over the cloud.


    A cloud is currently regarded as a trusted third-party storage solution. However,
    it may not be necessary that one''s data stored over the cloud is as secure as
    it is emphasized.


    +   Challenges: A recent survey on access control issues in cloud computing mentions
    the following security issues in cloud computing:


    +   Loss of Data Control: Once uploaded on the cloud, a user has no control over
    how the data is stored, secured or processed. Data storage and usage must be transparent
    to every user as if he is the sole controller of the data [37].'
