  md: '# Techniques Supporting Privacy and Security


    # 11.2.6 CAP Properties


    The architecture of a distributed ledger possesses CAP properties: “(1) Consistency
    – all nodes maintain an identical ledger with the most recent update. (2) Availability
    – any transaction generated in the network at any point in time will be accepted
    in the ledger. (3) Partition tolerance – the network can continue to operate even
    if a branch of the nodes fails” [14]. The primary problem is that it is difficult
    for any commonly acceptable cryptoken to be present without all three properties
    satisfied.


    # 11.3 Privacy and Security


    # 11.3.1 Introduction


    All cryptocurrency transactions are processed on a blockchain, which is a digitized,
    decentralized, and public ledger. The general security features of a cryptocurrency
    blockchain-system are determined after analyzing the requirements for privacy
    and security of cryptocurrency transactions.


    # 11.3.2 Privacy and Security Requirements


    The requirements for privacy and security of cryptotoken transactions are generally
    classified in the following eight categories.


    +   Consistency of The Ledgers – If two peers notice that a user’s balance is
    different, that user can utilize the discrepancy to launch an attack, as spending
    the same currency twice. It is subject to mismatches and inconsistencies between
    the ledgers of various financial institutions. Thus, the ledgers must be consistent
    at all times [14].

    Integrity of Transactions – In a blockchain, each transaction is shared across
    a number of users in network. Thus, the blockchain system must maintain transaction
    integrity and prohibit the completion of illegal transactions [14].

    Availability of Data – At any time and from any location, authorized users of
    the blockchain system should be able to access transaction data when required
    [14].

    Prevention of Double-Spending – The risk of a cryptocurrency being spent twice
    is known as doublespending. It occurs when a blockchain network is interrupted
    and cryptocurrency is effectively stored. Because digital information may be easily
    reproduced by smart persons who understand the blockchain network, doublespending
    is a potential concern that is specific to cryptocurrency. Thus, it is essential
    to prevent double-spending transactions in cryptocurrency system [15].

    Confidentiality of Transactions – All transactions in a blockchain are made public
    and accessible to all participating nodes in the system. Every user on the network
    has the ability to start a new transaction and make a new block. As a result,
    all users have access to the details of every transaction, including the sender,
    receiver, and amount. The more nodes are added to a network, the more transaction
    data would be publicly shared; and the less confidential the transaction data
    are. Thus, the confidentiality of transactions is essential in blockchain systems
    [16,17].'
