  md: '# Access Control and Data Security


    otherwise as well as changing of medical records. Due to this,, patients often
    prefer not to digitize their medical records.


    +   - Historical Data: The health insurance industry is one application where
    this facility is required. Insurance fraud happens when patients develop fake
    medical certificates to get insurance. This can happen easily as there is no recordkeeping
    facility for EMRs that can preserve patient’s privacy as well as provide a verifiable
    and immutable history of medical data to authorized requesting [27–30][P52].

    - Fragmented Storage: Currently, EMRs are stored at the locations they are often
    generated or in reside clusters. This limits researchers from being able to access
    the entire pool of available data [31–33][P52, P63].


    A total of nine papers are shown in Table 14.1 which were found in the domain
    of access control in health through blockchain application. The first paper to
    make a breakthrough in this domain is MedRec by Azaria et al. [31][P52] We provide
    a detailed overview of the method proved the formation of several healthcare-related
    papers that come after. We also provide a detailed summary of other notable works
    in the domain of health care that are different from MedRec and or have solved
    any major issue in MedRec or related works. Other shorter summaries are provided
    to sum up the work done in this domain. MedRec is one of the first papers to be
    published that tackles the problems of local storage of EMRs. Different hospitals
    are unable to access a patient’s medical history due to the unavailability of
    sharing methods. This is wholly to protect the patients’ privacy. MedRec proposes
    a blockchain based overlay over existing storage to provide a access control system
    that allows patients to query their data themselves from anywhere and share data
    with other medical institutions or researchers. This makes the design modular
    and easy to integrate with current solutions. Three different types of contracts
    have been in in this framework. The first type is used to provide a mapping between
    a user and their Ethereum account. The second type links patients and medical
    record providers (medical institutions) and associated permissions allowing a
    patient to access their data via an available query string which can be applied
    on the provider’s database to obtain the EMRs. The third contract provides a summary
    of all related medical data associated with any patient or provider allowing easy
    access to fragmented data, especially for researchers.


    The method proposed being one of the first, solves several issues regarding fragmented
    records storage, rules out centralized storage as an option, and provides a base
    for future systems to be developed using blockchain. However, the system does
    suffer from the following limitations:


    +   - Identity Exposure: Ethereum account and user identification mappings are
    available on the blockchain for public viewing.

    - Records Storage: Does not provide any information on how records can be securely
    stored. Assumes all health use trusted local storage methods.

    - Publicly Accessible Policies: Access permissions are stored openly on the public
    blockchain risking kind of impersonation attacks.

    - Auditing: Patients cannot view an immutable log of all who have accessed their
    medical records.'
