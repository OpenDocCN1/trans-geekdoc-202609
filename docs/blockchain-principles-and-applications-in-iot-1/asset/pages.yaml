    # Definition 5 (Elliptic Curve Discrete Logarithm Problem): Let E be an elliptic
    curve over a finite field Fq. Let N be the order of the group E(Fq) and P ∈ E(Fq).
    Given j = ord(P) and Q ∈ <P>, finding the unique m ∈ {0, 1, 2, ..., j-1} such
    that Q = mP is the elliptic curve discrete logarithm problem (ECDLP).


    Digital signature algorithm (DSA) and its elliptic curve analogue ECDSA (elliptic
    curve digital signature algorithm) are used mostly for signing transactions.


    DSA Parameter Generation:


    +   1. Choose a good function H(.) of SHA-2, SHA-3

    2. Choose key lengths L and N (e.g. (3072,256))

    3. Choose N-bit prime q such that p-1 is a multiple of q

    4. Choose g (its multiplicative group order modulo p is q)


    DSA User Key Generation:


    +   1. Randomly choose x where 0 < x < q

    2. Calculate y = g^x mod p


    x is the secret and y is the public key.'
