    across those three disciplines (clinical implications, security implications,
    and policy implications).


    # 8.3 Role of Blockchain and Machine Learning in Health Care


    # 8.3.1 Blockchain for securing medical data


    Although blockchain was introduced for financial industry transactions, its scope
    is not limited. This chapter deals with healthcare application of blockchain technology.
    Healthcare informatics take care of hospital, medical, and human health records
    at an industrial scale. Human health activities are observed under the supervision
    of healthcare professionals. Usually it is observed in standard operations that
    treating facilities do not trust patient''s clinical history and previous third-party
    dealing. There are many technical and logical issues, which seem to be apparent
    and reasonable. When situations are critical and a complete history remains unknown
    to a new healthcare worker, it becomes a matter of life and death for the subject
    under observation. On the other side, if the same history remains available in
    a (safe, secured) centralized server, the life of a patient becomes easier in
    multiple dimensions. Blockchain concept applications in healthcare informatics
    and promising features that may lead us to the next generation of automation.
    Blockchain features that are uniquely beneficial for this application are immutability,
    decentralization, enhanced security, distributed ledgers, consensus, and faster
    real-time updates. In [25,26], the author has shared the research scope in health
    care with blockchains. We are discussing here the procedure of keeping patients''
    records secure along with machine learning for data analysis purposes.'
