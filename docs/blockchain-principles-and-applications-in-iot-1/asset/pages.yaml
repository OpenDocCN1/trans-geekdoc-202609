    # 3.5 Challenges


    Although smart contracts are a promising technology, there are still a lot of
    obstacles to overcome. This section provides a summary of recent progress in addressing
    these issues [34].


    # 3.5.1 Creation-Related Challenges


    The establishment of contracts is a crucial stage in the implementation of smart
    contracts. Users must create their contracts, which they must deploy on blockchain
    platforms because blockchains are fundamentally immutable; blockchains cannot
    change smart contracts built on them after they''ve been implemented [35]. Hence,
    developers must carefully handle the issues listed below.


    Programming languages such as Go, Kotlin, and Java are used to develop smart contracts.
    After that, the source code will be compiled and run. Hence, programs have different
    types of codes depending on the period. This is an important issue to make programs
    readable in every form.


    # 3.5.2 Functionality-Related Challenges


    The existing platforms for smart contracts face numerous functional challenges.
    Following are some examples:


    +   - Re-entrancy: It refers to the ability to recall an interrupted function
    safely. Malicious individuals could use this to steal digital currency.

    - Elimination randomization: Randomization of created blocks may be necessary
    for some applications, like lotteries and others. This can be performed by generating
    pseudo-random integers using a timestamp or nonce. On the other side, a few threat
    miners may create blocks to deviate from the pseudo-random generator''s findings.

    - Excessive billing: According to new research, smart contracts are overpriced
    as a result of under-optimization [36]. These overloaded patterns are characterized
    by dead code and expensive operations in loops, including repeating computations.'
