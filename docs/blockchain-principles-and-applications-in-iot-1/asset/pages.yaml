    possible edge computing and reading the data and the IoT device. Traffic lights
    can be the best example for this system, where the lights are operated based on
    the data stored (Figure 7.3).


    # 7.4.1.2 Setup with only IoT Input Device


    In this setup, there is a sensor that is used to sense and store data in the blockchain.
    This data will be sent in the form of a transaction. The flow for storing data
    is described later. In such a setup, there will be a computation device that will
    connect with peer nodes in the blockchain, the IoT sensor device, and a block
    mining unit. In Figure 7.4, it is displayed as a dedicated ASIC miner because
    it is the recommended approach; however, it can also be a software running in
    a light board computer.

    Figure 7.4 shows a high-level overview of such a setup. The data collected from
    the sensor is passed to the miner for producing new blocks. The same data is pushed
    to other peer nodes. Every node competes for producing new blocks based on the
    proof-work consensus mechanism.


