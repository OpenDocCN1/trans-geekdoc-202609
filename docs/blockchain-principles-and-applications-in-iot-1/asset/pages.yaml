- pgno: 58
  md: 'Smart contract applications or decentralized apps may be developed and tested
    more easily on public blockchains. Startups can use public smart contracts to
    raise capital. Big businesses are primarily interested in using permissioned smart
    contracts to incorporate their business models and enforce rules. Banking, electronic
    medical records (EMRs), and IoT data management are the most common application
    cases [33]. There are also other uses, such as insurance, finance trading, e-government,
    and others. The following are a few examples of smart contract uses in the real
    world.


    # 3.4.1 Medical Records and Health Care


    Smart contracts can be effectively employed in health care and the management
    of access to medical records. Many healthcare practitioners view blockchain technology
    and smart contracts as a secure means to share and access patients'' electronic
    medical records. Smart contracts can include multi-signature authorization among
    patients and providers, limiting access to the record to only authorized individuals
    or devices. They also make interoperability possible using collaborative version
    control to keep the record consistent.


    Smart contracts can also be employed to provide researchers access to personal
    health-related information and enable micro-payments to be automatically delivered
    to patients for participation and benefit the patients and their caregivers.


    # 3.4.2 Banking


    In banking, smart contracts can be utilized to enforce laws and policies, such
    as in the mortgage service. A study mentions that smart contracts in mortgages
    might save consumers $480-960 USD per loan, while banks could save $3-11 billion
    USD annually in the United States and Europe. Smart contracts can also use by
    banks to organize clearing and settlement procedures. Additionally, smart contract
    logic can be used to implement KYC and anti-money laundering requirements quickly.
    Stellar blockchain, built on top of Hyperledger Fabric, allows for automated currency
    exchange in international transactions.


    # 3.4.3 Internet of Things


    The usage of smart contracts and blockchain for managing data in IoT is a potential
    but contentious application scenario. Intuitively, because both systems are non-centralized,
    blockchain might be used to improve trust in IoT ecosystems that transfer value
    of data regularly. To begin with, IoT data is frequently sensitive and must not
    be shared with others. Second, blockchains use a lot of resources. Having IoT
    devices execute all applications, even with lightweight consensus protocols, is
    redundant due to their low processing capability. The objective is to create a
    reliable, cost-effective, and efficient corporate network while retaining an indelible
    record to meet the needs.


    # 3.4.4 Insurance


    The insurance sector chooses smart contracts to execute error checking, routing,
    workflow approval, and payout calculations according to the claim. For instance,
    the processing of travel insurance claims can automatically be checked for delayed
    flights or cancellations. Smart contracts can assist in removing the human element
    from the process, lowering total administrative costs for insurers, and boosting
    transparency for clients.'
