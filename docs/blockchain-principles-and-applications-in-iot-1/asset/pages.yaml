  md: '# 13.2.1 Blocks


    Transactions are stored in blocks in a blockchain. In some blockchains, a block
    has to be published in a pre-determined time for security. For instance, a block
    is published in the Bitcoin blockchain in 10 minutes and in the Ethereum network
    in 1 minute on average. For this reason, a block can have no transaction at all,
    which happens many times in cryptocurrencies.


    The size in a block chain generally has an upper bound. For instance, a Bitcoin
    network has 1 MB block size limit and a soft fork this size was virtually increased
    to 4 MB via the SegWit upgrade. For this reason, number of transactions per second
    or total transactions in a block might be upper bound in a blockchain.


    Data stored in a blockchain depends on the blockchain implementation. Generally,
    data sent to a blockchain network connects a user''s address, user''s public key,
    transaction inputs and outputs, and a digital signature.


    Although blockchains are primarily used for transferring digital assets, it can
    be used to permanently write data on the blockchain and publicly announce it.
    Some blockchains might support smart contracts in which transactions can be used
    to process the data that is being sent and store some of the results on the blockchain.


    A transaction submitted by a user to the blockchain becomes a candidate transaction.
    When a publishing node includes these transactions in a block, they are written
    to the blockchain. Among the submitted transactions, some or all of the validated
    and authentic transactions are stored as the block data. The metadata of the block
    is stored in the block header.


    Data fields of header and block data differ significantly amongst blockchains.
    Generally, a block header contains fields like block height, hash of the current
    block data, hash of the previous block header, timestamp, size of the block, and
    nonce. Once is a random value generally used in blockchain networks that requires
    mining in order to make the hash value less than a pre-defined value called the
    block difficulty. A set of transactions included within the block and some other
    related data about the block may appear as the block data.


    # 13.2.2 Consensus Models


    The whole network agrees on the initial block that is also referred to as the
    genesis block. The distributed nature of the blockchains introduces a synchronization
    problem among the nodes when new blocks are added. To avoid conflicts and double
    spending problem of cryptocurrencies, a consensus model is used. New blocks are
    added to the blockchain according to the consensus model and each block is linked
    to the previous block because each block header contains the previous block''s
    hash value. The most popular consensus models are proof of stake and proof of
    work for permission-less models. Proof of authority and round robin are common
    consensus models that are used in permitted models.


    A proof-of-work consensus is used in permission-less blockchains. A cryptographic
    puzzle that is generally based on hash functions the publishing node to hash the
    header with different nonces so that the hash output is smaller than the difficulty
    value of the puzzle. This is open consensus algorithm and generally the solver
    of the cryptographic puzzle is rewarded. This is generally how new coins are introduced
    in cryptocurrencies. This is referred to as mining. The resources used for cryptocurrency
