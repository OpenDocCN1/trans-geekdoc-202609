  md: '# Access Control and Data Security


    One of the major limitations of MedRec, poses a slight threat to the privacy of
    the individuals by the revelation of the patient''s identity is mainly due to
    the permission-less blockchain that is used by the framework. In a permission-less
    blockchain, any user may join the blockchain, access data and be able to verify
    the transactions. In a permissioned blockchain environment, users are given identities
    by a trusted identity provider. The identity provider helps to manage trust by
    controlling access control within the network as well the user''s rights to validate
    new blocks. This kind of implementation has been deployed by Dubovitskaya et al.
    in [[34][P50]]. The authors have implemented an access control system over the
    HyperLedger permissioned blockchain that contains metadata as well as access control
    policies to access encrypted medical data stored in the cloud. These access control
    policies are defined by those who own the data themselves.


    In a permissioned environment, users'' identities are known and lesser chances
    exist for users to perform any malicious activities. The implementation on HyperLedger
    uses the medical record and another set of the organized patients'' data in the
    cloud, encrypted with the patients'' secret key. The framework ensures the following
    features, privacy, security, availability, and scalability. Privacy is provided
    by allowing a patient complete control over the access control policy over/her
    data. Security attacks aren''t very plausible since the network is permitted and
    the identities of every user is known. With cloud-based storage and APIs, availability
    of data is also ensured. Scalability is ensured by the PBFT consensus protocol.
    However, the paper seems to target only kind of medical record as mentioned and
    in future efforts, the authors will work on including kinds of medical records,
    including images.


    The next particular in our study of healthcare related blockchain research is
    [[35][P61] by Zhang and Lin. This paper is targeted towards doctors being able
    to access historical healthcare related information of a given patient from all
    the healthcare institutions he/she has been in the past. The paper suggests that
    storing PHI in cloud-based services is insecure and poses security challenges
    which can be taken of care by storing them in blockchain.


    The first blockchain is a private blockchain which is local to every health institution
    and stores records of patients who visit that institution. A private blockchain
    ensures faster transactions, lower cost, and greater security. The second blockchain
    is a consortium blockchain that store secure searchable indexes of PHI in the
    respective private blockchain. These, searchable indexes are key search encrypted
    in a manner that fetches any doctor the results he/she would want from the revelation
    of the identity of it to any third-party listener. All identities and PHI records
    are encrypted using public-key encryption for security and privacy. The goals
    defined in the paper include data security and access control, privacy preservation,
    search time, time revocation (to ensure a doctor can access the medical records
    only at the time he by the patient and not in future), and system availability.
    A consensus mechanism called proof of conformance has been suggested by the paper
    which checks for the valid authorization of the doctor while uploading the PHI
    to the private blockchain as well checks if the search indexes are from a predefined
    set of indexes for system interoperability. Another method in [[27][P62] uses
    blockchain only for auditing and non-tampering of data. Access policies are given
    by the patients and stored on the blockchain. Hospitals are responsible for encrypting
    the data using combined attribute-based/identity-based encryption and signature
    (C- AB/IB-ES) schemes and adding to the data pool controlled by the blockchain''s
    consensus nodes. These nodes are'
