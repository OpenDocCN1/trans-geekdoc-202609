- pgno: 260
  md: '# 14.3 Access Control


    Access control refers to the controlling of access to specific resources or systems.
    In the world of computers, this mainly refers to the controlling of access to
    systems, files, codes, and other information stored in any computer device. The
    term computer device isn''t limited to a personal computer and can refer to any
    device in today''s world that can store information and may or not be connected
    to any network. In cases of devices not connected to any network, the term physical
    access control is more applicable. In this paper, we refer to access control mainly
    to technical (or logical) access control that refers to any technological (or
    algorithmic) restrictions that we impose on the way a particular resource is to
    be accessed.


    Similarly, a secure access control system must implement the following requirements:


    +   **Authentication**: This step includes the identification stage also described
    previously. Authentication is required to ensure that only legitimate users are
    allowed to access the system. Various day-to-day use of authentication can be
    seen in the use of usernames and passwords, biometrics, physical keys, etc. Software
    authentication schemes generally rely on usernames and passwords or digital signatures.


    +   **Authorization**: This refers to giving access to the resource that has been
    requested by a user by en-uring that the user is legitimate and meets the access
    requirements. This is usually encoded in the form of scripts called as access
    control policies. These policies specify which user can access which resources
    and/or vice versa, that is, which resource can be accessed by all users.


    +   **Auditing**: A list of all access requests made, accepted, and denied are
    often kept track of to analyze later, especially in the event of a security breach.
    This process is called auditing.


    While these are the basic requirements of access control models that current centralized
    systems implement, the upcoming distributed access control systems have a need
    to ensure the following features:


    +   **Publicly Visible Auditing**: The requirement of auditing has be extended
    further to ensure that all users must be able to access the audit logs in a free
    and fair manner. In more constricted systems, at least the owners of the resources
    must be enabled to freely see the list of users that have requested access to
    their resources.


    +   **Owner Controlled Policies**: Users owning resources must be given complete
    and granular control over their resources. This means that owners be allowed to
    specify the policy themselves as to who can access their resources as well as
    what actions can be performed on these resources.


    +   **Identity-Preserving**: While maintaining a public log of all access requests
    is important, it is also important to ensure that users’ identities aren''t revealed.
    The pattern of access of resources can reveal personal and confidential information
    about a person such as his preferences and hence care as to be taken to ensure
    anonymity.'
  merge: -1
