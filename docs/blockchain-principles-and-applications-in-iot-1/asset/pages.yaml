    #  2.1 Introduction


    Blockchain [1,2] is a distributed chain of nodes. Blockchain acts as an immutable
    [3] ledger that can track transactions [4,5] and assets. Blockchains can hold
    both tangible and intangible items and can record virtually any value. Digital
    transactions on a blockchain network reduces risk and cost. Bitcoin [6], one of
    the most widely used digital currencies [7], uses blockchain as its fundamental
    framework. Since all the transactions are encrypted [8] and are immutable, cryptocurrencies
    are safer than traditional methods. Blockchain also acts as a public ledger [9],
    which makes it open and accessible to anyone using the currency.


    In 1982, cryptographer David Cha proposed a technology similar to blockchain.
    Stuart Haber and Scott Stornetta published further work on cryptographically secure
    blockchains in 1991. They wanted to implement a mechanism to prevent document
    timestamps from being forged. In 1992, Haber, Stornetta, and Dave Bayer proved
    the architecture by using a Merkle tree that can combine many document certificates
    into one block.


