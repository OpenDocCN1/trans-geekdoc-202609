    Lightweight stream cipher – Another symmetric lightweight cryptographic primitive
    is stream ciphers [3]. Here, the one-time pad (OTP) concept is used by the cipher
    known as Vernam cipher. The OTP generation process is based on fully random keystream.
    Each digit of the keystream is combined with one digit of plaintext to produce
    a digit of ciphertext. To make OTP unbreakable, the size of the keystream should
    be same length as plaintext. That is why it is considered practical. The other
