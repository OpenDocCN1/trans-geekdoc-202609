    +   4. Cloud Server: A cloud server is a reliable infrastructure with significant
    computing speed and storage (cloud storage). To enable safe data sharing and storage
    resources, a cloud server is used to store and manage the patient''s EHRs. The
    cloud server will be receiving the EHR data from the patient after a transaction
