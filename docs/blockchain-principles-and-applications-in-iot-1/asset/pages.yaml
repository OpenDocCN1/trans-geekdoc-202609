    that has endorsing peers E1, E2, E3 and two committing peers C4 and C5. E1, E2,
    and E3 will be committing the transaction i.e they will be the committers. Each
    of the endorsing peers has a ledger to store transactions. Also, there is an endorsement
    policy "P" defined which "A" and "B" installed on them. E1, E2 and E3 must sign
    the transaction. C4 and C5 are not part of the policy and they only have to commit
