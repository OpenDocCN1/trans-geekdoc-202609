    # 9.1 Introduction to Blockchain


    This section will give a basic introduction of the blockchain technology required
    for understanding the further implementation details mentioned in the later sections.
    Blockchain can be thought of an immutable, distributed ledger that is used to
    store transactions permanently and securely. This ledger of transactions is stored
    on every node in the blockchain network. There is no single point of failure because
    the ledger is distributed and you would have to take down every node in the network
    to bring the blockchain down, which is almost impossible to do. All blockchain
    nodes in the network use some algorithm to reach a consensus.


    # 9.1.1 Properties of a Blockchain


    # 9.1.1.1 Provenance


    A blockchain is used to store transactions in an immutable and secure way and
    it can be used to track the origin and ownership of various things like funds,
    cryptocurrency, assets, etc. The users of the blockchain can trace all history
    of these things and verify the authenticity of these things using blockchain in
    a trustworthy way. This property of provenance makes blockchain transparent to
    everyone. This property of blockchain can be used to fight'
  merge: -1
  img_proc: true
- pgno: 151
  md: '# IoT & Blockchain EHR Management System


    corruption and tax evasion. We can track where the funds are coming from and where
    they are going using the blockchain, and we can have transparent movement of funds.


    # 9.1.1.2 Consensus


    Since blockchain is a decentralized technology, there is no central authority
    to maintain and manage the ledger. Also, no one has any reason to trust anyone
    on the Internet. So, how do we build trust and reach an agreement in the trustless
    and decentralized network? To solve this problem, we use consensus mechanisms
    to help achieve agreement among the nodes in a trustless and decentralized network.
    A consensus mechanism is a set of rules that every node in the blockchain network
    must follow. Also, every transaction must follow all these rules to be valid.
    The consensus is driven by incentives that are given to the participants of the
    network so they do not behave maliciously. The consensus mechanism helps the participants
    to reach agreement on a global level without any central authority or middleman.
    One of the consensus mechanisms that is used by popular blockchain networks is
    “proof of work,” which is used in Bitcoin and Ethereum blockchain networks. Other
    consensus mechanisms are “proof of stake, “proof of burn,” “proof of activity,”
    etc.


    # 9.1.1.3 Immutability


    Blockchain is immutable in that once a transaction has been recorded on the blockchain
    ledger, it is impossible to remove or modify it. That is every transaction that
    has been done in the blockchain network and on the ledger is permanently and no
    one can change it. This property also makes it secure because no malicious participant
    in the network will be able to modify anything on the ledger. To change anything
    on the blockchain they have to change every ledger that is with the majority of
    the nodes in the network, which is impossible to do. We will see the immutability
    property of blockchain in detail in subsequent sections.


    # 9.1.1.4 High availability


    As there no central authority, the blockchain network cannot be shut down by anyone
    and it''s running 24x7 every day of the year. To bring down the blockchain network,
    we would have to shut down every node that is in the network, which is impossible.
    This property of blockchain makes it available all the time. Also, the blockchain
    is censorship resistant. No one can stop from accessing the blockchain contents
    as long as they have Internet access.


    # 9.1.1.5 Finality


    Transactions which have been made and stored on the blockchain are permanent and
    final and cannot be reversed. There is no way to change or remove the transaction
    once it has been made on the blockchain. This property of blockchain makes a trustless
    infrastructure in which everyone can trust the finality and not each other.


    # 9.1.2 Structure of Blockchain


    The main data structure used in blockchain technology is linked list. A linked
    list consists of a chain of nodes that are connected with each other. Each node
    of the linked list contains a data part and the address part, which contains a
    reference to the next node and'
  merge: -1
  img_proc: true
- pgno: 152
  md: '138


    Blockchain


    ![](img/accfea9a01c34cc061afd3c9ae34e481_152_0.png)


    FIGURE 9.1

    Blockchain architecture.


    this is how the list is connected. In the blockchain technology, addresses are
    not used for the linking purpose because addresses become obsolete on the Internet
    i.e. addresses which are relevant to machine X will not be of use by machine Y.
    Therefore, in blockchain technology to solve this problem, hashing is used to
    link the blocks together. Each block in the blockchain consists of a block header
    and a block body. The header contains metadata about the block like the timestamp
    when the block was created, block id, previous block header, number of transactions
    that are in this block, hash of the transactions, etc. The body of the block contains
    the transactions that are present in that block. The hash that is used to link
    the nodes is computed on a previous block header and stored as a reference in
    the next block. This forms a linked list of structures with the hashes as references
    to previous blocks. This is why any malicious user cannot change any contents
    on the blockchain. If they want to change any transaction in any block they must
    change block and compute the hash of block and store that as a reference in the
    next block and do the same thing for all the following blocks of the blockchain.
    This also has to be done for every copy of the ledger for every node in the blockchain
    network, which is impossible to do, and this is what makes blockchain secure from
    malicious users. The transactions that are in the blocks contain the sender and
    receiver addresses and digital signature for that transaction and how much cryptocurrency
    was transferred if this transaction involved a fund transfer and also contains
    some other information. The illustration given below shows a simple blockchain
    (Figure 9.1).


    # 9.1.3 Blockchain Components


    # 9.1.3.1 Ledger


    Every node in the network will maintain a ledger, which is a kind of database,
    and will keep a record of all the transactions in the network. These transactions
    will maintain the state of the data that is being stored in the blockchain.


    # 9.1.3.2 Smart Contract


    A smart contract is just like a contract in the real world, but smart contracts
    are in digital format. It is a small piece of code that is stored inside a blockchain.
    Smart contracts execute'
  merge: -1
  img_proc: true
- pgno: 153
  md: '# IoT & Blockchain EHR Management System


    automatically when certain conditions written in the smart contracts are met.
    Smart contracts eliminate the need for a trusted third party to make the transaction
    happen. They are immutable and distributed i.e. once the smart contracts cannot
    be modified or changed. And being distributed means that every node in the network
    will check and verify the contract''s output. Each smart invocation is treated
    as a blockchain transaction. Currently the largest blockchain supporting smart
    contracts is Ethereum, which was created for the purpose of supporting and running
    smart contracts. Smart contracts are written in a variety of programming languages,
    including Golang, Nodejs, Solidity, and others.


    # 9.1.3.3 Peer Network


    A peer network is a network of nodes that are involved in the consensus process
    and they maintain a ledger. They check if the transactions are valid or not order
    and add them to the ledger.


    # 9.1.3.4 Events


    Whenever a transaction happens on the blockchain, events are emitted, and the
    application can register for event notifications. Using these events, we can get
    all the information about that transaction, the time of commit or the block number
    in which this transaction is added or transaction hash, etc.


    # 9.1.3.5 Systems Management


    The blockchain network is a distributed system and runs across multiple nodes,
    so it requires management to create, change, and monitor blockchain components.
    We can monitor at the system level or application level.


    # 9.1.3.6 Wallet


    A wallet is a device that stores the credentials of the user for performing transactions
    on the blockchain network. In the case of permission-less networks, the credentials
    are the user''s public and private key and in the case of permissions networks,
    it is a digital certificate that will be stored in the wallet. It can also perform
    encryption and signing the transactions. The wallet can be software based or hardware
    based to store the credentials.


    # 9.1.4 Blockchain Actors


    # 9.1.4.1 Blockchain Architect


    The architect designs how the blockchain solution is going to be built. They will
    figure out how the network itself will be created and what information needs to
    be stored on the blockchain ledger and what transactions need to happen to access
    that information. They will also figure out logic needs to be embedded into the
    blockchain.


    # 9.1.4.2 Blockchain User


    The blockchain users will interact with the system and perform business transactions
    on the blockchain. These users can belong to multiple organizations that are part
    of the blockchain network. The user is not aware of the blockchain.'
  merge: -1
  img_proc: true
- pgno: 154
  md: '# 9.1.4.3 Blockchain Developer


    The developer will take the design or architecture created by the blockchain architect
    and develop the actual code that will run on the blockchain network itself. They
    will work on developing the applications and the smart contracts that will be
    used by users to interact with blockchain.


    # 9.1.4.4 Blockchain Operator


    The blockchain operator has special permissions and will manage, monitor, and
    run the blockchain network. There is a blockchain network operator for every organization
    in the network.


    # 9.1.4.5 Membership Services


    The membership services provide the identities to the users to transact on the
    blockchain. They will provide a digital certificate to the users and peers so
    they can communicate using this certificate on the blockchain network.


    # 9.1.4.6 Traditional Processing Platform


    These are the systems that blockchain connects to get some information from or
    to send information to. These can be traditional data sources or external databases
    that are also a part of the overall blockchain solution.


    # 9.1.4.7 Blockchain Regulator


    The regulator can monitor the operations and transactions happening on the network
    and they can check if the transactions are legitimate and are compliant with the
