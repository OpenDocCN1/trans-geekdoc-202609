    ![](img/accfea9a01c34cc061afd3c9ae34e481_128_0.png)


    **FIGURE 7.6**

    Only mining node.


    # 7.4.2.1 Understanding the UTXO Model


    In the UTXO model, the data stored in the ledger is in form of a list of list
    of transactions. When a certain transaction is to be validated, the amount of
    currency the account is trying to send are compared. Each entry in the ledger
    has a unique transaction id, the account sending currency, the account receiving
    it, and the amount sent in the transaction. Whenever a new transaction is made,
    a new transaction record is created. This action is not yet confirmed. A list
    of unconfirmed transactions is maintained. Each transaction also has an associated
    transaction fee. When a particular transaction is verified and added to a block,
    the miner gets this transaction fee. Since each block has a fixed block size,
    the miner will try to fit in as many transactions as possible so that the total
    storage size is less than or equal to the block size, and at the same time maximize
    the fee received. This is a classic example of a Knapsack problem [9], where the
    action fees determine the specified transaction fees, the higher is the chance
    of the transaction being confirmed after.


    Figure 7.7 shows the flow where a new transaction is initiated and added to the
    transaction 7.7, and then a certain number of transactions are selected and produced
    into a block and added to the blockchain.


    ![](img/accfea9a01c34cc061afd3c9ae34e481_128_1.png)


    **FIGURE 7.7**

    Flow of transaction selection in UTXO model.'
