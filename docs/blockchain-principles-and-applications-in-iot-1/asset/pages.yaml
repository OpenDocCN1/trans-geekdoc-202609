    # 9.4 Challenges in Current Electronic Health Record (EHR) Systems


    Before the advancement in current technology, the healthcare industry relied on
    a paper-based system for storing medical records that was a handwritten system.
    The problem with this system was it inefficient, unreliable, and not secure. It
    had a severe problem in terms of accessibility, and it could only be used by one
    person at a time.


    With the advancement in technology came EHR systems that are being used to store
    health records of the patients in a digital format. However, these EHR systems
    have concerns regarding the medical record security and privacy, user data ownership,
    and data integrity. The majority of EHR data sharing presently occurs by fax or
    mail, which can cause considerable delays in patient care and is due to the lack
    of a secure and trustworthy medical records sharing system. There are multiple
    EHR systems in use at various institutions, each with its own set of terminology,
    technical capabilities, and functional capabilities; hence, there is no globally
    established standard. Accessing fragmented patient data across several EHRs is
    still a challenge. A patient must go through a lengthy and laborious process in
    order to view all of their medical records.


    Breach of data in the medical industry is also a serious concern. There are no
    alerts triggered for unauthorized access of patient information, and it is not
    known what information was accessed.'
  merge: -1
  img_proc: true
- pgno: 164
  md: '# 9.4.1 Challenges in Current Health Monitoring Systems


    While an increasing number of elderly require long-term care, many still desire
    to stay independent and as long as possible and reside in their own homes. At
    home, the patients cannot be treated and taken care of due to the lack of necessary
    medical equipment. In hospitals, continuous monitoring of patients’ essential
    vital signs is a critical task. This is generally done nowadays with the use of
    several sensors affixed to the patient and beside monitors. Due to this the patients
    have to be fixed with devices near their beds to monitor their vitals.


    # 9.5 Motivation for Introducing Blockchain into the System


    Given the aforementioned issues, it is reasonable to seek a platform that may
    aid in the transformation of the healthcare sector to one that is more patient-centric.
    Blockchain can provide such a platform that is both secure and transparent, as
    well as provide data integrity for patient medical records without third-party
    intervention. By blockchain, the patient can keep track of whose medical records
    and every access to the medical records can be stored in the blockchain permanently
    in the form of transactions. Also, to provide access control, permissioned blockchain
    can be used so that only certain participants can access the system. In this case,
    we want only the patient and the doctor who has been given access by the patient
    to view the EHRs.


    # 9.6 Proposed IoT-Based Blockchain EHR System


    We propose an IoT-based permissioned blockchain system that could be utilized
    in the healthcare sector to deploy blockchain technology for EHR and remote monitoring.
    The goal of our proposed system is to store the medical records and patient’s
    vitals data in a secure way and give access to these medical records to whom the
    patient allows so that our system is patient-centric. Furthermore, by leveraging
    cloud storage for medical records, this framework tackles the scalability issue
    blockchain technology presents in general. Introduction of IoT sensors in this
    system helps in gathering the patient’s vital information in a remote and secure
    way. This system is built on permissioned blockchain, therefore, the access to
    the blockchain can be controlled and the patient can control who can access their
    medical records. Also, this system will be secure and scalable because of the
    use of blockchain technology.


    # 9.7 Technical Details


    The EHR blockchain network consists of peer nodes (hospitals, clinics, etc.),
    hospital administrators, a network administrator, and a cloud server for storing
    data. Below is a description of the various entities that make up the system.'
