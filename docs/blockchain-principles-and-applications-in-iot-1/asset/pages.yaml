  md: 'Bitcoin uses the elliptic curve $y^2 = x^3 + 7$ over $F_p = 2^{256} - 2^{32}
    - 2^9 - 2^7 - 2^1$ for ECDSA. This curve is called $secp256k1$ and the same curve
    with the same / private keys can be used by other algorithms like Schnorr signatures
    [5] also on the reliability of DLP. Bitcoin only supports ECDSA. However, Taprot
    fork is expected to happen in November 2021, will will provide support for Schnorr
    signatures.


    Unlike DSA, ECDSA allows us to choose many elliptic curves with the same number
    of points on them. Thus, a natural question arises: Does the DLP equally hard
    for elliptic curves that have the same number of points? This question is older
    than Bitcoin in cryptography, a common practice is to use random curves. Thus,
    cryptographers wondered if it is possible to come across a weak elliptic curve.
    In the case of Bitcoin, if $secp256k1$ is a weak curve for which DLP is easy to
    solve. In [32], it is shown that almost all elliptic curves over the same finite
    field having the same number of points have the same density of discrete logarithm
    by showing polynomial self-reducibility of the ECDLP among others. Orders in imaginary
    quadratic fields play an important role in this result because the endomorphism
    ring of an ordinary curve is isomorphic to one in an imaginary quadratic field.
    For a fixed $N$ and $m$, elliptic curves that are isomorphic to one in an imaginary
    quadratic field have the vertices of an isogeny graph and prime degree is between
    them of less than $m$ the edges. The polynomial time self-reducibility of the
    ECDLP is achieved by navigating this isogeny graph. If there are polynomial amount
    of weak curves over which the ECDLP is easy, the ECDLP for the rest of the elliptic
    curves over the same finite field having the same number of points can be solved
    by transferring the ECDLP for a strong curve to ECDLP for a weak curve by computing
    polynomial amount of random isogenies between elliptic curves. Thus, it is reasonable
    to assume that Bitcoin elliptic curve $secp256k1$ is secure as any elliptic curve
    over the same finite field having the same number of points. Moreover, NIST announced
    that they are going to include more elliptic curves to their portfolio [33]. Thus,
    NIST is expected to include Bitcoin''s elliptic curve $secp256k1$ for interoperability.


    Although Schnorr signatures were invented in 1990, they expired in 2008. Bitcoin
    was not as popular as ECDSA, which was widely used and tested. By this time Bitcoin
    did not support Schnorr signatures at the beginning and now a soft fork is required
    to add a new cryptography algorithm. This soft fork for Bitcoin called Taprot
    is scheduled for November 2021.


    The main advantage of Schnorr signatures against ECDSA or DSA is key/signature
    aggregation. Bitcoin and most of the blockchains allow multi-signature, which
    provides transactions that are signed by multiple parties. A *multisig* transaction
    is signed by $n$ parties contains $n$ public keys which increases the transaction
    size and the computation required for the verification of the transaction. However,
    Schnorr public key and signatures can be aggregated [7] so that $n$ parties that
    are going to sign a transaction can combine their public key to form a single
    public key, without needing to test each other. Then they can sign the same message
    with their private keys. Combining these $n$ signatures forms a single signature
    which can be verified by the aggregate public key. Thus a verifier must only verify
    a public key to check that all of the $n$ parties signed the message. Therefore,
    it is expected to have smaller transaction sizes resulting in fee savings. Bitcoin
    users because it makes impossible to distinguish single signature spends from
    *multisig* spends. Note that *multisig* transactions are also used by a single
    party when the transaction requires the transferring assets from more than one
    previous transaction.'
