    of healthcare data. Healthcare informatics applies principles of computer science
    and information science to improve the quality of life science research, advancements
    in public health, health education and public. It is a multidisciplinary field
    that involves computer, cognitive and social sciences. In healthcare, tools and
    technologies of informatics use for providing better health services. Further,
