    # 3.5.3 Deployment-Related Challenges


    Smart contracts are being deployed to the well-suited platforms after their creation.
    Additionally, to avoid any potential hurdle, testing of the smart contracts is
    compulsory [37]. The creators of a smart contract should also consider the contract''s
    interaction patterns so that any potential losses due to malicious activity can
    be avoided.


    It is practically impossible to make modifications to smart contracts once they
    have been put on blockchains. Hence, it is critical to evaluate the accuracy of
    smart contracts before their deployment. Moreover, over the complexity of modeling
    smart contracts, verifying their accuracy may be difficult [38].


    # 3.5.4 Execution-Related Challenges


    The execution step is critical for smart contracts since it defines their final
    state. While executing smart contracts, a variety of challenges must be handled.
    One cannot execute smart contracts without accessing real-world data [39–43].
    A smart contract is designed so that it requires running in a sandbox. An oracle
    acts as an agent in a smart contract, locating and verifying real-world events
    and relating this information to the smart contract. Hence finding a reliable
    oracle becomes a task.


    # 3.6 Conclusion


    Because of the swift advancement of blockchain innovation, smart contracts have
    emerged as a popular study topic. Smart contracts'' unchangeable and irreversible
    qualities allow people to exchange money, shares, and intellectual assets with
    no interference from a third party. As result, smart contracts are projected to
    disrupt several established industries, including finance, health care, business,
    and more. This chapter provides an overview of smart contracts, covering their
    working, platforms, security issues, and application scenarios. We also went through
    some of the smart contract''s challenges and future trends.


