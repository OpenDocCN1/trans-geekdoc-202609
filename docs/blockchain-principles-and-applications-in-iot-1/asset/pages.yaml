- pgno: 310
  md: '296


    Blockchain


    # 15.9 Conclusion


    In this paper, three lightweight primitives and three lightweight protocols in
    an IoT environment have been illustrated. Under lightweight primitives, however
    different, stream ciphers, and hash functions played their role to maintain security
    in IoT have clearly been notified. In addition, hardware parameter analysis (e.g.
    throughput, area, latency, power, etc.) in a certain setup give an overall IoT
    security efficiency provided by different ciphers, hashes, and protocols. In the
    discussion section, a separate study in a tabular form have been discussed. It
    gives a brief overview of the primitives and the protocols at a glance to the
    readers. This paper has been written with the hope that it will help upcoming
    researchers by gaining a consolidate idea of lightweight cryptographic primitives
    and protocols. It also helps researchers to improve security level from the basic
    knowledge of IoT security issues and requirements.


