    # 2.2.2 Proof of Stake


    The second major consensus protocol is called proof of stake. In proof of stake,
    the right to mine the blocks is given out not randomly, but proportionally. So
    to mine a block, a person has to stake some coins in the network, and the probability
    of mining the block is proportional to the number of coins staked to the network.
    Here, the mining power of the miner depends on the number of coins he/she owns.
    The proof-of-stake consensus mechanism was developed to solve the scalability
    [18] and environmental sustainability problems raised by the proof-of-work protocol.


    As by the name, nodes on a network stake a certain amount of cryptocurrency to
    be considered candidates to validate the new block and collect the fee associated
    with it. Then, an algorithm selects the node that will validate the new block
    from a pool of candidates. To make the selection fair to everyone on the network,
    this algorithm combines the amount of stake with other factors such as coin-age-based
    selection and the random block selection process. In coin-age-based selection,
