  md: '# Access Control and Data Security


    4. Consensus Models: In a distributed ledger, it is important to decide which
    block will be published next, or rather which block will publish the block in
    order to maintain consistency. A number of miner nodes will be trying to continuously
    gather transactions and create a valid block. However, the order and list of transactions
    collected will be different for each miner and a different block is generated
    by each miner node. When these blocks are broadcasted to the other nodes in the
    blockchain, different nodes may end accepting different valid blocks. Therefore
    there needs to be a method to select which block is accepted. Consensus algorithms
    help decide a condition which is satisfied for a block to be accepted. Protocols
    like proof of work and proof of stake are two of the many algorithms that are
    use in today''s blockchains.


    Proof of Work: In this model, a miner node gets to publish a block to the chain
    only by solving a difficult task which is easy to verify. Bitcoin employs the
    proof-of-work (PoW) consensus model [14], which requires the hash value of the
    block that begins with a fixed number of zeros. The hash value of the block is
    changed by changing the nonce field in the header of the block. This problem is
    computationally expensive and it is believed that nodes are putting in sufficient
    power to calculate the hash not maliciously. Once the nonce value has been found
    that produces the desired hash, block along with the nonce is broadcasted to the
    network for verification. Moreover, being an expensive task, the chances of two
    blocks being generated at the same time is quite less. However, if two blocks
    are broadcasted at the same time then there exists a fork in the blockchain, that
    is inconsistency in the locally maintained blockchain between nodes. There are
    methods to resolve forks such as waiting for the next block to be published and
    then adopting the longest chain. Ethereum also currently uses the PoW consensus
    model, but is however shifting towards the proof-of-stake model for its computational
    usage [15].


    Proof of Stake: This consensus algorithm decides based on the amount of the user
    has invested into the network. The amount of stake can be decided by several factors
    like age of the account, amount of cryptocurrency till date or amount of cryptocurrency
    held, etc. The idea is that a user who has more time in the network has incentive
    to subvert the system [18]. However, depending only the amount of cryptocurrency
    can gradually turn the system into a centralized system by making the rightful
    user control the entire system. To prevent this, methods like randomization in
    Blockchain and Seit [20] and coin age-based selection in Peercoin [21] have been
    used. In contrast to the PoW model, PoS is less or substantially expensive.


    There are several other consensus models developed by different blockchain implementations
    such as proof of authority, proof of weight, proof of elapsed time, proof of burn,
    and several more including modifications to PoW and PoS such as delayed proof
    of work and delegated proof of stake. However, the above described consensus algorithms
    are the most popular ones in


