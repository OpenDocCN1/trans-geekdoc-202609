  md: '# 12.4 Opportunities


    Blockchain has great potential and by day new solutions are coming up that leverage
    blockchain to solve problems of trust and security. Scaling a blockchain’s security
    scheme is easier than traditional ones due to its decentralized nature and it
    also provides strong protection against data tampering and prevents rogue devices
    [41]. A few salient features of blockchain are listed below that makes it so popular
    [42].


    +   - Tracking sensor data and preventing unauthorized modification.

    - The distributed ledger can be used for device authentication, identification,
    and safe data transfer.

    - Third party is not required for trust.

    - Single source failure doesn''t affect the system.

    - Reduces operational costs as there are no intermediaries.


    Though blockchain has its perks and benefits, it is still in its early stages
    and there are barriers that prevent its application in the IoT environment.

    One of the challenges is the issue of storage when blockchain is adopted in IoT
    applications. Usually, IoT devices generate a huge amount of data. Over time,
    as the blockchain grows, all nodes will require larger storage and better bandwidth
    to keep the transactions updated [43]. Many studies are incorporating blockchain
    with traditional cloud-based IoT architecture.


    In this paper we are discussing access-control IoT security devices such as biometric
    locks, we store a limited amount of data. Usually, they store the biometric data
    of the selected persons who have access. Storing these sensitive data can address
    the security issues faced by smart IoT locks. Mohatar at [44] discussed using
    blockchain-for biometric template protection.


    # 12.5 Basic Architecture and Implementation


    We are using Ethereum blockchain to deploy smart contracts. There are other options
    available also like Tezos, Quorum. But we will use Ethereum as it is more mature,
    stable, well documented, with an active community that aids in its maintenance,
    and provides fine-grained management. We have used Ethereum’s smart contract feature
    extensively for our research. To write a smart contract, we will use the Solidity
    programming language. Solidity was created by the Ethereum community. As per the
    Solidity documentation, this is statically typed and curly braced, which is to
    be used on an EVM (Ethereum Virtual Machine). The proposed smart contract consists
    of two sections, one is basic CRUD (create, read, update, and delete) operations
    for admin and the other part is to be used by the client to verify the user’s
    authenticity via searching the database. The client part is where the IoT edge
    interacts with a blockchain directly, the access part is implemented using an
    edge device where the user provides their biometric details, fingerprint, retina
    scan, or other advanced biometric features. The edge part interacts with Ethereum
    using the Ethereum client and verifies the user details.'
