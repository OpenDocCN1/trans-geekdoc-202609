    Blockchain


    P35 introduces CapChain built for the Monero blockchain making of Monero''s Ring
    Confidential Transactions to preserve privacy. The method makes use of the token
    approach to allow users to not just grant access rights but also delegate rights
    to other users. The implementation models Cap-BAC by treating access rights as
    capabilities on the blockchain that can be transferred to users just like cryptocurrency.
    To preserve identities, instead of using public addresses, transactions on the
    blockchain use a hash chain as these permissions are delegated from user to user.
    The use of sub-addresses allow for easy revocation of all rights from a user with
    other users that have derived their rights from this user. The implementation
    does suffer from drawbacks.


    The limitation of this approach is that it doesn''t provide the ability to revoke
    access as easily as revocation requires a transaction on the chain. As the access
    policies are stored in the form of contracts on the blockchain, these are publicly
    visible which can form a threat [52][P6]


    The authors of [64]P5 continue their work on FairAccess using the second generation
    of blockchain to implement the architecture. This new generation of blockchain,
    called the account model, allows gained access control through the use of advertised
    scripting for smart contracts [56][P7]


    To tackle the issue of distance between IoT devices and the cloud storage which
    has an increase in latency, authors of [48]P5 used a blockchain layer to provide
    an access control and data management framework over time-series IoT data stored
    at the edge of the network using a locality-aware decentralized storage system.
    Even cloud nodes can be used as storage nodes for this purpose. To secure the
    storage on devices, the IoT data streams are chained, compressed, and encrypted
    at the application layer. Transactions are made on the blockchain to facilitate
    sharing of data with a service.


    They include the dataset and the public key of the service. Access requests are
    checked on the blockchain for a corresponding transaction by the owner and only
    then the key is shared with the requester. This method suffers from the drawback
    of slow transaction speeds.


    IoT devices constantly change managers or may be under the control of more than
    one manager at a time. However, manager devices are also lower power devices that
    cannot easily execute the access control. Handling hard coding of managing access
    control, security, scalability, transparency, and currency will not be easy to
    execute on these devices. [57,58]P7 by Oscar Novo proposes an architecture using
    a single smart contract on the blockchain is used to define all access controls.
    The IoT devices are however not included as part of the blockchain. A new entity
    defined as the management hub translates information between the blockchain and
    the devices. Managers are however considered lightweight nodes in the blockchain
    that are responsible for managing the access control of the IoT devices under
    them by accessing the smart contract. A single contract automatically handles
    the issues of managing multiple devices and currency.


    However, this architecture does not support the ability to audit the access control
    permissions. To obtain access, the management hub simply query the access control
    policy in the blockchain and translate the request back to the devices. Transactions
    aren''t supported as in current blockchain implementations; it takes a couple
    of seconds to minutes for the operation. Additionally, modification of access
    control policy requires a transaction against the smart contract which might take
    some significant amount of time to reflect in the blockchain. This inherent limitation
    of the blockchain also poses as a threat to the strength of the access control
    model.'
