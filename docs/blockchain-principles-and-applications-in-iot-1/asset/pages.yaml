  md: '# Access Control and Data Security


    the stated policies and revoke access as and when required. Often the basic operations
    that must be considered by an access control system involve read, write, and no
    access. A user must be able to change these policies between one another at any
    time. This is another concern to be attended to in the domain of IoT.


    # 14.8 Drawbacks of the Survey


    This survey has been conducted by a thorough study of the selected papers and
    information has been collected in tabular form as well as summaries of proposed
    methods. However, the work may not be completely accurate and exhaustive due to
    the following drawbacks:


    +   - A few notable papers have been missed during the paper screening and selection
    phase. Nonetheless, attempts have been made to include any notable papers that
    have been referenced significantly in our selected papers and may contribute to
    this research.


    +   - The research in this field is fairly new and isn''t a lot of common structure
    to the issues tackled, solutions proposed, and limitations addressed. Due to this,
    a few fields in the tables are provided as the selected papers haven''t addressed
    these concerns. To resolve this, we hope our future directions section will provide
    a structure for future researchers to address in their works.


    +   - Language used to describe the methods may have varied from paper to paper,
    which could have led to different interpretations of the works carried out. We
    have attempted to understand what they is depicting before writing our summaries,
    however, the reader is offered to read the actual article to understand the complete
    method employed. This drawback derives from the previous drawback and we once
    again hope that our paper sets the standards for terms and tokens to be used.


    # 14.9 Conclusion


    Even with the aforementioned drawbacks, this paper provides a comprehensive overview
    of the work being carried out in access control using blockchain. A number of
    researchers are currently using blockchain for various security providing solutions.
    However, the research being carried out in this field, especially with the blockchain
    technology, is scattered around different researchers using their own terminology
    and addressing only a partial set of goals and concerns. Access control systems
    need to follow a certain standard to ensure easy interoperability and usage.


    Not all methods proposed are perfect. Some suffer from the drawbacks of their
    own proposal and from the inherent drawbacks of the blockchain technology. As
    technology is still evolving, we can hope to find better research work in this
    domain in Nonetheless, these works will still form a foundation and learning to
    create better access control systems using blockchains in the future. This paper
    may be used as a reference for future works to be structured and offers complete
    features that are currently lacking in most proposed systems.'
