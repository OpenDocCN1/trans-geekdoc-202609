    protocol (TCP) through an intermediary server along the way. Figure 15.14 reflects
    the way of communication between end-to-end clients by passing stanzas.


    In the case of instant messaging, XMPP and XML handle all the fundamental. it
    includes direct messages sending and receiving between users, status checking
