    which are randomly generated from a generator P with order n on an elliptic curve,
    r is a random integer called the binding factor, m is an integer that encodes
    the message. The elliptic curve scalar multiplication operation is used to form
    m.P and r.Q R on an elliptic curve by combining m.P and r.Q with the elliptic
    curve addition operation. The point R is a Pedersen commitment. By revealing both
    the message m and the binding factor r, the Pedersen commitment checks(m,r) simply
    returns the point R. The persian_commit(m,r) is implemented with additive homomorphism.
    To form the point R3 = R1 + R2 Pedersen commitments R1 = m1.P+ r1.Q and R2 = m2.P+
    r2.Q are combined using elliptic curve point addition. The Pedersen commitment
    to encode the integer message m= m1+ m2 and the new binding factor r3= r1+ r2
    is represented by the point R3 such that R3= m3.P+ r3.Q [48].


    # 11.4.6 Zero-Knowledge Proof


    Zero-knowledge proof is a kind of cryptographic technique with privacy-preserving
    features. The basic concept is that “a certifier can verify to a verifier that
    an assertion is correct without supplying the verifier with any relevant information.
    If the certifier and the verifier have a common reference string, it is possible
    to achieve computational zero-knowledge without the requirement for communication
    between the certifier and the verifier” [22,24,50]. The general ideal of a zero-knowledge
    proof is described in the reference [51].


    All bank accounts are encrypted and saved in a blockchain application. When a
    user transfers cryptocurrency to another user, he may easily utilize zero-knowledge
    proof to show that he has sufficient funds for the cryptocurrency transfer while
    concealing his account balance [14]. The application of zero-knowledge proof for
    confidential transactions is described in the reference [52].


    Zero-Knowledge Proof Using Elliptic Curve – PROVER and VERIFIER generate a generator
    point G on an elliptic curve. They both know the point P’ on the curve. PROVER
    knows β ∈ n such that P’ = β. They want to prove this fact to VERIFIER without
    opening β. Protocol steps are as follows [53].


    +   - PROVER selects a random λ ∈ n and calculates the point Q = λ. G.

    - PROVER sends the point Q to VERIFIER.

    - VERIFIER checks θ = HASH (G, P, Q) where α is a random seed and sends θ to PROVER.

    - PROVER calculates ϕ = λ + θ. (mod n) and sends ϕ to VERIFIER.'
