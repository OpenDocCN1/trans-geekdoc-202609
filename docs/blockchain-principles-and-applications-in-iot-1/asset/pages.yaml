  md: '# Cons


    +   1. Proof of authority is not a decentralized system; rather, it is an attempt
    to prove the efficiency of centralized institutions.


    +   2. Anyone can see the proof-of-authority validators.


    # 2.2.7 Proof of Activity


    Proof of activity employs a blockchain consensus algorithm that is used to make
    sure that all transactions registered on a blockchain are genuine and that all
    miners reach a consensus. It also serves as a protection against attacks on the
    underlying blockchain. Proof of activity is a combination of two other blockchain
    consensus algorithms, proof of work and proof of stake. Proof of activity is used
    in blockchain networks like Dcred, Espers, and CoinBureau.


    The first phase employs the proof-of-work technique, which miners compete with
    their processing power to become the first to solve a complex task to generate
    a new block for the blockchain. Once the block is mined, the system proceeds to
    the second step, in which participants are chosen at random from the network,
    similar to the proof of stake. Just as in normal proof of stake, the odds of getting
    chosen rise with the number of coins a member holds in that network. The personnel
    are then tasked with forming and signing the critical block. Depending on the
    implementation, they may need to validate or sign the block to certify their authenticity.
    When the group of validators sign the new block, the status of a complete block
    will be achieved. With the new block being identified, it will be added to the
    existing blockchain network, with the transactions of the new block being recorded.
    The first miners and the various validators who played a role will be the ones
    who receive the reward. Proof of activity offers a second layer of security against
    51% of attacks since an attacker would potentially require 51% or more of the
    network''s total mining power as well as 51% or more of the coins staked in the
    network to effectively pull off the attack.


    # Pro


    +   1. If a specified number of verifiers acknowledge the block as legitimate
    can it be permanently attached to the blockchain. In other words, introducing
    a modified block into the system is difficult.


    # Con


    +   1. As proof of activity employs proof of work in the first phase, it consumes
    a lot of computational power.


    # 2.3 Relative Study


