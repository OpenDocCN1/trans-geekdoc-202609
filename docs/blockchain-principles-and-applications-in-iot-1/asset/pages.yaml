- pgno: 1
  md: '# Blockchain


    Blockchain: Principles and Applications in IoT covers all the aspects of blockchain
    and its application in IoT. The book focuses on blockchain, its features, and
    the core technologies that are used to build the blockchain network. The gradual
    flow of chapters traces the history of blockchain from cryptocurrencies to blockchain
    technology platforms and applications that are adopted by mainstream financial
    and industrial domains worldwide due to their ease of use, increased security,
    and transparency.


    +   - Focuses on application of blockchain on IoT domain

    - Focuses on blockchain as a data repository

    - Goes beyond blockchain in relation to cryptocurrency to cover its use in areas
    like health care, supply chain management, etc.

    - Covers consensus algorithms like PAROX, RAFT, etc. and their applications


    This book is primarily aimed at graduates and researchers in computer science
    and IT.'
