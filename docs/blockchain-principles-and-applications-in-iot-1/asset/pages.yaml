    # 7.4.3.1 Using an Edge Computation Device Like RaspberryPi


    One of the most common implementations is using SoC (system on chip), which is
    used for on-edge computation. Such devices have a complete operating system running
    on them and various forms of applications/programs can be run. Such devices also
    support complex operations associated with networking and can also perform threading.
    On the downside, such devices are often more costly and power-consuming. These
    devices are often a better choice when on-edge operations are to be performed.
    Such devices are also easy to program because they are capable of compiling and
    running most programming languages. This also reduces the overhead of developing
    software for such systems because the wide range of available libraries.


    Such devices can be used for mining as well. If the device is already used for
    some other computation on edge, multi-threading can be used to run the mining
    algorithm in a different thread. To mine using these devices, the software has
    to be designed that can mine blocks.


    Advantages of using such devices for running the miners:


    +   1. If the IoT device is already running on-edge computation, it will be more
    efficient to use such devices which can easily run to medium level on-edge computation
    and the mining algorithm can be executed on a parallel thread.

    2. It is easier to develop applications for such platforms because they have a
    full operating system that can compile and run most programming languages.

    3. Since such devices are also capable of performing various networking tasks,
    they can connect with the rest of the blockchain and transmit data without the
    need for a separate networking module.

    4. Updates and bug fixes are easy as the program running on these devices can
    be easily updated by putting in new code.


    Disadvantages of using such devices are:


    +   1. They consume more power and are costly. Such devices often have various
    modules and features that are not needed for mining and hence used for mining
    only will be a waste of resources.

    2. The attack surface for any form of cyber-attack increases. Various modules/features
    that are not used by the system can turn into vulnerabilities and can be exploited
    to get unauthorized access to the devices.

    3. Since such devices are made to perform a wide plethora of operations, often
    they are not efficient in performing specific tasks (in this case, mining new
    blocks).


