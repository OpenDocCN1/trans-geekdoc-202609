    # 10.4 Blockchain Technology: Foundation to Basic Applications and Emergence


    Blockchain technology is becoming a technology and has reached from the basic
    term blockchain. As far as the scientific century is concerned, blockchain is
    not only a database; furthermore, it is a new technology with more digital trust
    [7,8]. In the year 1982, David Cham coined proposed the term blockchain and later
    Stuart Haber and W. Scott Storneta in the year 1992 wrote a block on seront consortium
    where more concepts and ideas became introduced on blockchain[6,90]. However,
    first blockchain network was invented and implemented by Satoshi Nakamoto after
    developing the first digital currency, Bitcoin. It is important to note that blockchain
    technology is the technology behind blockchain, and it cannot be owned. And further
    development phases are depicted in Figure 10.2.'
