    In a round-robin consensus model, nodes take turns in creating blocks. When a
    publishing node is unavailable on its turn to publish a block, a time limit may
    be enforced to prevent system halt. This model does not require any cryptographic
    puzzles, has very low power requirement, and prevents any node from creating a
    majority of the blocks.


    A proof-of-authority consensus model rely on the high level of trust amongst the
    publishing nodes since they know their real-identities. It relies on the fact
    that some misbehavior of a publishing node would affect their reputation.


    A proof-of-elapsed-time consensus model requires secure hardware that can generate
    a random number that determines the time wait of a publishing node.


    # 13.2.3 Forking


    Some intentional changes to a blockchain data structure or network''s protocol
    might be necessary for many reasons. These changes are called forks and can be
    categorized as soft and hard forks.


    A soft fork is a backward compatible change to a blockchain implementation. Non-updated
    nodes may not understand valid transactions that come from updated nodes but can
    still transact with them. Increasing the block size limit virtually to 4 MB via
    the SegWit upgrade in the Bitcoin network is a soft fork example. Adding a new
    cryptographic algorithm to a blockchain requires a soft fork. For instance, Bitcoin''s
    Taproot upgrade, which is scheduled for November 2021, is going to create a soft
    fork by adding Schnorr signatures [5] to Bitcoin.


    A change to a blockchain implementation that is not backwards compatible is referred
    to as a hard fork. These hard forks might be unintentional and might be caused
    by a software error. Intentional hard forks might be due to a flaw found in the
    cryptographic algorithms used in the blockchain. When a hard fork is introduced
    to a cryptocurrency, this actually generates two cryptocurrencies where the users''
    data is duplicated in both blockchains. For example, in 2016, a hacker stole $50
    million US dollars'' worth of tokens from a decentralized autonomous organization
    and Ethereum reversed this fork. However, the original blockchain continued as
    Ethereum Classic. Thus, the hard fork resulted in two different cryptocurrencies.


