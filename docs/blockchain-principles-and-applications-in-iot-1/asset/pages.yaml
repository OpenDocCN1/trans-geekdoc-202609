  md: '# ASIC-Based Mining System in Blockchain


    a device that uses a microprocessor for the sole purpose of mining. The uniqueness
    of ASIC has revolutionized the way electronics are manufactured. This reduces
    the die sizes while increasing the density of logic gates per.

    Advantages of using ASICs:


    +   - The small size of an ASIC makes it a high choice for sophisticated systems.

    - In general, an ASIC is optimized to compute just a single function or set of
    related functions. An ASIC can be used to calculate the block hashes. This would
    highly increase the hashing rate and hence reduce the time used for mining new
    blocks.

    - Since they are very application-specific, it is next to impossible to hack such
    devices as the attack surface is very small.

    - They consume very little power.


    Disadvantages of using such devices:


    +   - Making such circuits requires special programming knowledge and equipment.

    - Since they are very specific in function, separate modules are needed for networking.

    - In most cases, they are not easily upgradable.


    Since ASIC miners consume less power and have a small form factor, they become
    the best choice for none IoT setups.


    # 7.4.4 Implementing Pub-Sub Model in Blockchain-Based IoT


    Most IoT devices are based on the famous Pub-Sub model [10] where there is a publisher
    device that is used to publish the data and a subscriber device that subscribes
    to the publishing device. The subscribing device lists for any data published
    by the publishing device and performs computation and/or generated output based
    on those published data.

    In a blockchain-based IoT setup, all the IoT devices are considered nodes. The
    devices that record data will be creating transactions whereas the devices used
    for computation and output will only be traversing the blockchain to get the desired
    data. To maintain secure access to data, encryption with public-private key pairs
    can be used to encrypt the data. The publishing node can encrypt the data with
    the public key of the node which is supposed to read the data, and only the node
    with the correct corresponding private key can decrypt it and get access. In this
    way, although all the data is stored on the blockchain, only the desired nodes
    can have access to it.


