    # 13.6 Zero-Knowledge Protocols


    Cryptocurrencies like Bitcoin provide pseudo-anonymity. That is, anybody can see
    every transaction in the blockchain but know who belongs to real life. In order
    to obtain anonymity, users use non-cryptographic techniques like mixing in n people
    together and sign a multi-signature transaction to hide the receiver and the sender
    of a single transaction. Such techniques are not always practical and requires
    trust amongst the participants. Two protocols, Zeroin [10] and Zerocash [11],
    incorporate anonymity at the protocol level using zero-knowledge protocols. The
    main idea behind zero-knowledge protocols is that one party can prove they know
    a value x without revealing it.


    Zerocash protocol uses two coins A and B to obtain anonymity. A user obtains anonymity
    by destroying their A and making some amount of B coins. Although this provides
    anonymity, transaction amounts are still visible in Zeroin. The cryptographic
    building blocks of Zerocash is the use of RSA accumulators which require a one-time
    trusted setup. A trusted party is needed for the choice of two primes q and p
    to create N = pq and destroy q and p. Thus, the security depends on the IFP. Anybody
    can create new coins without being detected. Zcoin was the first cryptocurrency
    that used this protocol but then moved over the Sigma protocol [35], which removes
    the trusted setup feature of the Zerocash protocol.


    To provide anonymity, Zeroc uses zk-SNARKs [12], zk-SNARKs make zeroknowledge
    proofs more compact and easy to verify. This efficiency removes the necessity
    of having a basing that is used in Zeroin. Moreover, public ledger no longer contains
    transaction amounts in Zerocash. However, over 1 GB of random/secret public parameters
    are needed to set up Zerocash compared to a single public number N that is used
    in Zeroin. How else zero-knowledge proofs or protocols can be used in blockchain
    technology remains an open problem.


