- pgno: 122
  md: '# 7.1 Introduction


    Blockchain is a technology that enables decentralized storage of data across multiple
    notes. Each note stores a copy of the data (also called a ledger) and hence it
    is also known as distributed ledger technology. Blockchain is immutable, i.e.,
    once any data is stored on the blockchain, it cannot be altered or modified. Because
    of the intentionally introduced redundancy, it is not feasible to alter any data
    that is once stored on the blockchain. This makes the system highly secure and
    users can trust that the data is stored.


    The process of producing new blocks in a blockchain is called “mining” and the
    hardware used for this task is termed “miner.” The process of mining is associated
    with solving a cryptographic puzzle that is resource intensive. It is possible
    to use special integrated circuits that are designed solely for the purpose of
    mining new blocks. Such circuits are used only for the purpose of producing new
    blocks and the design of an ASIC miner will be based on the specifications of
    the blockchain that it will be used in. ASIC miners consume low power and resource
    when compared with any other alternative for mining blocks in a blockchain.


    # 7.2 Present Problem and Proposed Solution Overview


    When a blockchain network is set, it is important to design how the process of
    producing new blocks will be carried out. If the network relies on a small number
    of validator nodes that are responsible for the process of block producing then
    it centralises the network to some extent. This makes the network highly vulnerable
    to 51% of attacks [1]. Also, if traditional single board computers are used for
    the mining process, they are vulnerable to a wide spectrum of security threats
    [2].


    We recommend the use of popular PoW (proof of work) consensus mechanism popularized
    by Bitcoin because it doesn''t rely on centralized nodes; rather, every node in
    the network can participate in the block-producing process. We also recommend
    the use of ASIC miners because besides being highly efficient, they are also less
    vulnerable to various security threats. Since ASICs are designed specifically
    to perform a particular task, the attack surface is significantly low and hence
    they can’t be hacked.


    # 7.3 Understanding Blockchain


    Blockchain is a way of storing data in a decentralized fashion so there is not
    one single point of failure in the entire network. The term “blockchain” is derived
    from two terms: “block” and “chain.” The data is stored in form of small blocks
    of fixed size and are linked with one another by their hashes. This forms a chain-like
    structure, hence the term “blockchain” is used (Figure 7.1).'
  merge: -1
  img_proc: true
- pgno: 123
  md: '# ASIC-Based Mining System in Blockchain


    ![](img/accfea9a01c34cc061afd3c9ae34e481_123_0.png)


    **FIGURE 7.1**


    Structure of a blockchain.


    As shown in the diagram, every block in the blockchain consists mostly of


    +   1. Block Data: This contains the main data that is to be stored in the blockchain.

    2. Prev Hash: This field stores the block hash of the previous block in the chain.

    3. Nonce: Nonce is a special value that is used in the process of block mining.

    4. Block Hash: This field stores the combined hash of all the fields defined in
    the blockchain. The combined hash consists of the Merkle Root of all the data,
    previous hash, and any additional data if present.


    Since each block stores the hash of the previous block and the hash of that block
    depends directly on the prev hash field, if any one block in the chain is changed
    or altered, the hash of that block will automatically change which will result
    in any block after being invalid. Because of this feature of the blockchain, even
    if the data in one of the blocks is altered, it can be easily detected and the
    system prevents any change to take place. For the change to persist, all the successive
    blocks have to be modified as well which becomes very resource-intensive. The
    amount of computation needed for such alteration increases exponentially as more
    and more blocks are added to the chain.


    This chain of blocks is also called a ledger. the ledger is distributed among
    every node present in the network, i.e., every node maintains an up-to-date copy
    of the ledger. Added redundancy ensures that if one of the chains in a particular
    node is compromised or any malicious data is added to it, the other nodes can
    easily detect it be discarded. Under such cases, the chain with the malicious
    data will be discarded. Therefore, if someone wants to add malicious data and
    corrupt the ledger, at least 51% of the nodes will have to be corrupted. This
    is known as a 51% attack. Given the amount of computation needed for altering
    a block, such an attack becomes impossible for a blockchain with multiple nodes.


    # 7.3.1 Block Producing/Block Mining


    Block producing/block mining is the process of creating new blocks. Since blockchainis
    based on a decentralized system where every node works parallels and no node has'
