  md: '# The Study of Consensus Algorithms


    A consensus [13] mechanism is an algorithm that approves transactions or records
    on a decentralized ledger while rejecting false or fraudulent records. When additional
    blocks are added to the current chain of blocks, the algorithm is executed. The
    notion is that by requiring a certain amount of work, malicious actors will abstain
    from tampering with the ledger lest the effort be unprofitable. The very first
    application of proof of work [14] was to screen spam.


    Adam proposed Hashcash, a proof-of-work technology. In 1997, it required email
    senders to confirm and attach stamps to email headers to demonstrate to recipients
    that they used CPU to compose emails. These stamps are one-way encryption schemes
    that are simple for the recipient to verify but difficult for the sender to manufacture.
    Spammers would be hesitant to send out big amounts of emails under this paradigm
    it becomes unprofitable to receive a large volume of CPU resources manufacture
    stamps. Regular users, however, may still send a single email at a reasonable
    fee.


    Consensus techniques in the blockchain realm are commonly referred as mining and
    staking activities; they are typically seen as a means to issue new currency.
    Their primary goal, is to safeguard the decentralized [15] network, while payments
    in the form of coins provide an additional incentive for employees to keep the
    network running. The subsections explained proof of work, proof of stake, delegate
    proof of capacity, proof of elapsed time, proof of authority, and proof of activity
    in Section 2.1 to Section 2.7, respectively.


    # 2.2.1 Proof of Work


    The proof-of-work method was developed in 1993. Malicious activities like denial
    of service attacks and other spam networks were prevented by this method. The
    algorithm required some work from the user in terms of processing power. In 2009,
    Bitcoin used the proof-of-work algorithm to validate transactions in its network.
    To add new blocks, users have to use their computational power to solve a cryptographic
    puzzle [16] and complete the proof of work validation. This innovative use of
    the proof-of-work algorithm has been adopted by many cryptocurrencies and it has
    become the widely used consensus algorithm.


    Users on a network exchange digital tokens. All transactions are collected into
    blocks by a decentralized ledger. However, caution be exercised to confirm transactions
    and organize blocks. This obligation falls on specific nodes known as miners,
    and the process is known as mining. The way that Bitcoin chooses to implement
    proof of work, is in a quite simple, maybe deceptively simple hashing puzzle.
    The Bitcoin protocol requires the nodes to attach a hash to the transaction data
    in the block while generating their blocks. Simply put, the hashing puzzle is
    as follows: Take a hash of block plus nonce and find at least X zeros in the resultant
    hash. It must be obtained by trial. Repeatedly hash the ever-changing block with
    different nonces until you have the required amount of zeros. When the miner ultimately
    discovers the correct answer, the node broadcasts it to the whole network at the
    same moment, in exchange for a Bitcoin reward which necessitates regenerating
    all successors and redoing the work they contain, which amounts to computing the
    complete chain of difficult mathematical problems, which is nearly impossible.
    This protects the blockchain against manipulation. Figure 2.1 gives the block
    diagram of proof of work.'
