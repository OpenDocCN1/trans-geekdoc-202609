    do some computation and send data for storage to the cloud. Every patient who
    is fixed with the sensors will have a mobile device.


    # 9.8 Workings of the System


    # 9.8.1 Medical Records Storage


    In the proposed system, a blockchain node will be provided by each hospital integrated
    with its own EHR system that will form the blockchain network. Patients and doctors
    use a web-based interface to upload EHRs and access them. The medical records
    will be stored-off in cloud-based storage and only the metadata about those medical
    records will be stored on the chain. The metadata that will be stored in the blockchain
    for each patient will include patient ID, patient name, the hash of emergency
    records of the patient, and hash of encrypted records of the patient. The patient''s
    EHR data will be stored in two layers, regular layer data will be stored directly
    in the cloud storage, while emergency records will be encrypted and first stored
    in the cloud. To ensure the EHR data of the patient, the system employs public-key
    asymmetric encryption and uses digital signatures. The patient, when visiting
    the doctor, can add them to the list of doctors who can view the patient''s regular
    records. The patient can also give access to their emergency records to the doctor.
    After a visit to the doctor, the patient will remove the doctor''s access to their
    records. The doctor on the other hand can upload the prescription for that patient
    which will be added to the patient''s EHR and will be stored as a transaction
    in the blockchain which will prevent prescription fraud.


    Figure 9.12 shows the system model of the proposed electronic health record (EHR)
    management system using blockchain.'
