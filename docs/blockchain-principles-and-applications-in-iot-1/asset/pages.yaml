    # 5.3.3 Types of Blockchain


    According to Nirananamurthy, Nithya, and Jagannatha [19], there are mainly three
    types of blockchain that are generally used. They are “public blockchain,” “private
    blockchain,” and “consortium blockchain.” It can be stated that each blockchain
    has its characteristics that make them useful in the business world. Public blockchains
    are open to the public, which allows anybody to connect the network and take part
    in the core operations. Moreover, any individual can further participate in the
    consensus process can check and verify the transactions to it. Sometimes, these
    blockchains are considered “permissionless” as there is no permission required
    for interacting with the protocol. However, being open to all does not make it
    less secure than the other blockchains. The transaction data is viewable in this
    blockchain, such as date, amount, and wallet number.


    On the other hand, the private blockchains are opposite of the public blockchains
    as they are more restricted, and only certain nodes are allowed to participate
    in the consensus. In this management, a central authority, which can be a business
    or enterprise, takes control of creating and validating transactions and decides
    who can view the transactions. Moreover, the authority can further determine the
    mining rights and change or override entries on the distributed ledger. Nevertheless,
    in another study, Dib et al. [20] showed that the consortium could also be very
    effective for business operations as it exhibits a decentralized behavior. This
    blockchain can be both private and public that is regulated by preselected nodes.
    It is not fully open like a public blockchain or restricted like a private blockchain.
    It can be further referred to as a hybrid blockchain which shows the two blockchain''s
    characteristics.


