    # 3.3 Issues Related to the Security


    Section covers the various security issues and the corresponding preventive measures
    related to smart contracts. We consider a smart contract as a digital representation
    of a real-world legal arrangement. Once it has been validated by the consensus
    process and uploaded to the blockchain, it will be executed without any interruption
    from a third party [26]. The blockchains like Fabric, Corda, and EOS support smart
    contracts due to their success on Ethereum. Several significant properties of
    today''s blockchains, on the other hand, may generate security difficulties with
    smart contracts (refer to Table 3.1).


    # 3.3.1 Tamper-Proofing and Decentralization


    Blockchain is a decentralized, tamper-resistant digital log. Furthermore, malicious
    actors using pseudonyms can build and execute smart contracts. Hence, it is not
    easy to repair a vulnerable smart contract, and once deployed, it''s easy to lose
    control [27].


    # 3.3.2 Public Ledgers and Open-Source Code


    A smart contract is usually open source. An adversary may be able to see transactions
    and data. Hence, smart contract vulnerabilities are easy to attack.


    # 3.3.3 Blockchain Platforms and Smart Contract Languages


    The development of d-apps on the blockchain differs from the development of regular
    applications. D-app developers must have a deep understanding of blockchain operations.
    Otherwise, smart contract creators'' intentions are frequently at odds with smart
    contract implementation. Furthermore, because blockchain technologies advance
    swiftly, design faults in blockchain platforms or smart contract languages may
    emerge. D-app developers are constantly presented with new platform characteristics
    [28].


    # 3.3.4 Transactions with Fictitious Names


    Maximum transactions on public blockchains are pseudonymous. This attribute encourages
    illicit activity in smart contracts, such as money laundering and Ponzi scams.
    Financial assets are frequently transferred using smart contracts. Smart contract
    security'
