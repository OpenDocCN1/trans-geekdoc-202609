    # 13.2 Blockchain Technology


    Blockchains are tamper resistant and tamper evident ledgers that are distributed
    among the users. They usually do not require a central authority. They enable
    users to record transactions in a shared ledger in their community. When a record
    is written, users are not allowed to delete or update it. Moreover, it can be
    easily noticed when a record in the blockchain is modified afterwards.


    Bitcoin blockchain is the first cryptocurrency that combined many technologies
    introduced in 2008 and its ledger started on 3 January 2009. Users within the
    Bitcoin blockchain use digital addresses obtained from cryptographic algorithms
    and electronic cash information is attached to these digital addresses. Digital
    asset transactions between users are digitally signed using public-key digital
    signature algorithms and the transactions become publicly available in the blockchain
    for everyone in the network to The distributed structure of the Bitcoin blockchain
    together with cryptographic hash functions make the blockchain tamper resistant
    and tamper evident. After the invention of blockchain, thousands of other cryptocurrencies
    are introduced, which generally have different parameters like used cryptographic
    algorithms, the total number of available coins, or the block time that represents
    the time it takes on average for a block to be written to the blockchain.


    Although blockchain technology solves the problem of digital currency, it is still
    unclear what other problems can be solved with this technology. Note that a blockchain
    might be helpful if we need all of the following conditions:'
