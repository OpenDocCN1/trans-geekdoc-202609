    # 5.3.2 Concept of Consensus Algorithm


    Pahlajani, Kishirsagar, and Pagchhare [16] narrated that the consensus algorithm
    or layer can be considered the critical aspect in the blockchain architecture.
    This particular algorithm governs protocols for deciding of adding a new block
    in the blockchain. Moreover, the consensus algorithm resolves the issue of trust
    in the technology. However, it can also be referred to as a specific process that
    allows all the blockchain network participants to reach a shared agreement regarding
    the current state of the distributed ledger. Therefore, a consensus algorithm
    aims to find a joint agreement that is acceptable to the entire network. In this
    manner, the algorithm helps to acquire high reliability in the network and ensures
    the increase of trust among participants in the distributed environment.


    Additionally, the consensus protocol further ensures that each added block in
    the blockchain is the sole version of the truth accepted by all the technology
