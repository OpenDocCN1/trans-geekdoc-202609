    scalable system. Blocks and transactions are checked by pre-approved individuals
    who serve as system moderators. Proof of consensus is met by businesses or private
    groups who wish to create chains that are effectively closed and do not require
    involvement from the broader public. This mechanism is much more efficient than
    it eliminates resource-intensive mining processes, but validators need to maintain
    integrity. As reputation and identity are at stake, the system encourages users
    to act honestly through the proper functioning of the network.


    Amid the push to abandon proof of work, proof-of-stake algorithms have emerged
    as the benefits of proof of stake are obvious, there is one important disadvantage
    that is sometimes neglected. Proofofstake algorithms are based on the concept
    that those who have tokens in a network will be encouraged to behave in the network''s
    best interests or risk losing their investment. As a result, it is natural to
    believe that the more a person''s investment in the network, the more they are
    to ensure their success. This assumption, however, fails to account for the fact
    that, while identical stakes may be equal in monetary worth, they may not be equally
    appreciated by their holders. Proof of authority seeks to help with this. Instead
    of tokens, network participants stake their identities, which is the idea of the
    algorithm. This implies that, unlike many other blockchain protocols, validators
    in PoA systems are known entities that risk their reputations in exchange for
    the ability to validate blocks (Figure 2.4).


    # Pros


    +   1. Risk tolerance is high as long as 51% of the nodes are not malicious.


    +   2. High transaction rate.


    +   3. Consumes less computational power than consensus methods like proof of
    work.


    +   4. The duration between new blocks being created is predictable.


    ![](img/accfea9a01c34cc061afd3c9ae34e481_43_0.png)


