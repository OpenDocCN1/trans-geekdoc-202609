- pgno: 45
  md: '# The Study of Consensus Algorithms


    sluggish, immutable database with extremely high redundancy, which means it is
    costly to maintain and difficult to grow. However, a scalable blockchain is sometimes
    misunderstood as just another phrase for a blockchain with a high transaction
    per second. However, the term scalability a far larger variety of connotations
    in the context of blockchain. For example, every increase to Bitcoin in terms
    of throughput, latency, start-up time, or cost per transaction is referred to
    as scaling, and the resulting blockchain system is referred to as scalable. In
    the blockchain, the phrase scalable a comparison concept. When a blockchain system
    is referred to as scalable, it means it achieves a greater TPS than previous systems
    by improving its consensus method and/or tweaking some parameters.


    There are some potential solutions for blockchain scalability. One scaling concept
    is to incorporate more transactions in a block by increasing the block size or
    using fewer bytes to represent information in the block. To prevent network spamming,
    networks like Ethereum and Bitcoin have an upper limit on block size. This limit
    can be accommodated by more transactions. We can obtain higher throughput by reducing
    the amount of information in each block by more efficient hashing algorithms and
    data structures. Increasing block size means increasing block propagation time,
    which means the blocks will take longer to verify.


    We can accelerate transactions by reducing the time it takes to add a new block
    to the network. This is dictated by the block level in proof-of-work systems.
    Shortening the block difficulty, on the other hand, will increase the number of
    mined blocks that do not make it to the main chain due to competition, resulting
    in further computation waste. This increases network bandwidth while reducing
    security by lowering the effective hash rate.


    We can use various consensus protocols to increase the network''s scalability.
    Proof of stake less power than proof of work. Proof of stake also increase the
    frequency of block additions since miners will no longer have to spend time, solving
    cryptographic puzzles. Proof of stake is more scalable than proof of work, it
    has several disadvantages.


    To improve scalability, we can employ the off-chaining strategy. The off-chaining
    strategy, as the name implies, incorporates the off-chaining process of portioning
    the data. The burden on the blockchain network and transaction processing costs
    could be reduced as a result. Only a few nodes are permitted to calculate the
    difficulty proof in off-chaining. Before computing the proof, the participating
    nodes must provide a deposit. A group of nodes verifies the proof after it has
    collected. If the proof is valid, the deposit and incentive are returned to the
    submitter. If not, the deposit is forfeited.


    Sharding [20] may be used to boost scalability in a blockchain. Because the blockchain
    state is partitioned into shards, a node does not need to run the complete data
    set to validate and perform a transaction. Transactions will be routed to nodes
    depending on the shards they affect, and all nodes will work in parallel, lowering
    total time. As a layer top of the blockchain architecture, subchain architecture
    may be employed. Subchain architecture features a tree-like hierarchical structure
    with a root chain and several child chains. It operates based on strong and weak
    blocks. Weak blocks are those that meet a target of lower difficulty. As soon
    as a weak block is discovered, miners pile up weak blocks until a block with the
    specified difficulty goal is discovered (strong block). When the goal is reached,
    the child chain is closed and reconnected to the root chain, decreasing the average
    first confirmation time of transactions. Table 2.1 gives a relative study of consensus
    mechanisms.'
