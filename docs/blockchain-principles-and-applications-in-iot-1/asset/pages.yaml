  md: 'mechanism in the distributed manner. User identification and authentication
    are performed on the cloud. The delegation according to the access policy is still
    performed by the owner on his/device, but the various delegation relationships
    are stored on the blockchain for access authorization. Service providers upon
    receiving service requests check the blockchain for these delegations to grant
    or deny access. Revocation is performed by invoking the smart contract holding
    these delegation certificates. This type of method overcomes the lack of scalability
    and revocation in current distributed CapBAC systems. However, the problem with
    this method of revocation is that the rights cannot be revoked immediately but
    require the transaction to be completed on the blockchain.


    # 14.7 Future Directions for Research


    Based on the study of the works on blockchain-based access control systems, we
    have attempted to provide an insight into what must be the grounds of future work.
    This domain is fairly new and we hope that these insights form a foundation for
    future work to be structured around.


    +   * **Auditing:** Blockchain technology has made popular due to the collection
    of immutable records. Hence, auditing is a facility that is by default a feature
    of the blockchain. However, some implementations still do not provide this feature.
    Auditing of access control helps in understanding and improving the security system
    in place. Hence, an immutable ledger like blockchain must be deployed for its
    use in auditing.

    * **Blockchain as an Overlay:** Storage in blockchain is not as easy as the size
    of data stored in blockchains must be kept in control. However, size of data needs
    to be monitored grows in size daily. Off-chain storage methods are better opted
    for compared to on-chain storage methods. Using the blockchain as an overlay over
    the existing storage method is the approach to go for in the future.

    * **Transaction Speed:** A number of transaction based approaches imitating the
    CapBAC model have been described, especially in the domains of IoT and cloud.
    However, these suffer from the slower transaction speed in current generation
    transaction speeds, these models can lay the foundation of better consensus models
    and faster access control systems. However, currently transaction speeds may still
    be made better with the use of permissioned blockchain [34]]P50 or fewer consensus
    nodes [33]]P6.

    * **Easy setup and Interoperability:** Any system proposed to be integrated with
    existing systems in little or no setup costs. Additionally, these systems have
    to be designed that they can operate on any existing system. This requirement
    is necessary for consumers to be comfortable with the usage of a newer security
    system while the existing one is still performing as needs. This concern also
    requires attention in the field of IoT containing high amounts of heterogeneity.

    * **Dynamic Access Control Policies:** Most systems implemented offer the ability
    to define policies in the form of smart contracts that are statically controlled.
    However, access control also requires the ability to be able to dynamically control'
