    simple blockchain transaction. Satoshi Nakamoto (alias) introduced blockchain
    in 2008 as a digital ledger of the famous cryptocurrency Bitcoin [21]. However,
    since its formation, blockchain has evolved to have multiple uses in the present
    day, from banking and payments, supply chain management, audit, and regulatory
    compliance, health care, real estate, voting, and many more [22].


    Blockchain is getting popular and many applications are using blockchain to resolve
    problems as it provides security, trust, and privacy. The three prominent types
    of blockchains are public, private, and consortium blockchains [23]. In a public
    blockchain, anyone can read and access the information and developers do not bother
    the users. All the information is public by default. It is primarily applied to
    Ethereum [7], Bitcoin [21], Hyperledger [24], and other fields. In a private blockchain,
    the write permission is only available to an individual or organization, and the
    read and other permissions are restricted. A private blockchain provides superior
    security in terms of data privacy and faster transaction speeds in comparison
    to public blockchains [25]. A consortium blockchain gives us what we call "partial
    decentralization", the users can trade and control, but they won''t be able to
    verify the transaction or publish smart contracts without the permission of the
    consortium [26]. Blockchains also used varied consensus algorithms depending on
    the use case. The three most popular consensus are proof of work (PoW), proof
    of stake (PoS), and practical Byzantine fault tolerance (PBFT).


    # 12.3 Ethereum Blockchain and Smart Contracts


    Ethereum is a distributed computing platform, unlike the traditional client-server
    model [7]. Ethereum mainly comprises blockchain, network trie, and tri data structures.'
