    elliptic curve, and discrete logarithm are selected as subparts. At present, there
    is no favorable lightweight asymmetric cryptographic primitive that is comparable
    with conventional primitives. The detailed discussion over lightweight primitives
    has been discussed in [1]. Lightweight block cipher, stream cipher, and hash function
    are all under the symmetric key category, which are going to be discussed in Section
    3, Section 4, and Section 5, respectively.


    Lightweight block cipher – One of the symmetric lightweight cryptographic primitives
    is block cipher [2]. Based on the capability of devices, the implementation of
    block ciphers are categorized into three classes: lightweight, ultra-lightweight,
    and low cost. For lightweight implementations, a maximum of 3,000 logic gates
    can be allowed. Ultra-lightweight implementations are suitable in resource-constrained
    smart devices (in terms of memory requirement, power consumption, and computation
    capacity). Why this type of implementation occupies up to 1,000 logic gates. A
