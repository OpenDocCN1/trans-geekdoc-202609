  md: 'The blockchain logs the network''s state at certain times after transactions.
    These logs are stored in Merkle Patricia trees, which own a hash [27]. In Merkle
    Patricia trees, every node has a hash value. The hash of each node is determined
    by the SHA3 hash value of its contents. This hash acts as the key that connects
    to the node. LevelDB [28] is used as the database layer where the state is stored.
    Smart contracts and user account data are stored in the trie data structures.
    Smart contracts are programmed in Turing languages [29] like Solidity, an object-oriented
    language based on C++, Python, JavaScript, and PowerShell.


    Ethereum, NXT, and Hyperledger Fabric were also blockchain-based cryptocurrencies.
    Unlike the popular Bitcoin, they can use smart contracts [9]. The idea of smart
    contracts was first proposed by Nick Szabo in 1994 [30]. Smart contracts and protocols
    that are stored in a blockchain that automatically execute when relevant events
    or actions occur after the contract. They are mostly used to automate the agreement
    upon fulfilling the conditions so that all stakeholders can be certain of the
    outcome without any involvement of any intermediary, unlike traditional contracts
    [31]. It helps prevent tampering as smart contracts are copied to each node of
    the blockchain. It also helps to reduce human errors and disputes [32].


    Though smart contracts developed over the years many problems, they still encounter
    many challenges. In 2016, the Decentralized Autonomous Organization (DAO) smart
    contract was hacked and manipulated to steal cryptocurrency worth $50 million
    USD at that time [12.3](Figure 12.3).


    It is not easy to incorporate blockchain solutions into existing IoT systems due
    to their low computational resources. And also in a blockchain, each node must
    have a copy of the blockchain to maintain consistency. Blockchain technology is
    quite resourceintensive. Scaling it is harder. Several improvements are being
    made to increase scalability and speed, though improved yet it is still far from
    traditional storage methods [34]. On-chain techniques like increasing the block
    size in Bitcoin cash [35], compressing the blocks as compact block relay [36],
    sharding [37,38], and other improved consensus mechanisms [39,40]. But since access-control
    IoT systems have improved to store only a limited amount of data we did not worry
    about storage. There are many improvements made in this area, like Wang et al.
    [10] proposed a three-layered hierarchical architecture.


