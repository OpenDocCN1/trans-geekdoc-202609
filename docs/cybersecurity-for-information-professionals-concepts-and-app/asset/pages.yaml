    # Conclusion


    The goal of this work is to propose a new insider threat detection approach based
    on users'' psychophysiological and computer-based behavior measures. Our results
    indicate that both EEG and ECG signals carry out a good resolution on detecting
    the malicious activities as shown in our signal detection module. While the availability
    of the hardware and its applicability in real-world work environments introduce
    some challenges for this module, this module can be used in a highly secured work
    environment where employees deal with highly sensitive information. Moreover,
    with recent advances in wearable technologies, this limitation will not exist
    in the near future. For example, most smartwatches and fitness trackers have sensors
    that can record ECG signals. Also, EEG technology is growing, and many new devices
    have been introduced recently such as the smart cap (SmartCap Tech, 2018) and
    the mindset smart headphones (kickstarter, 2018). Furthermore, we provide the
    performance of each signal separately, so, based on the availability, the organization
    can always choose to use any of the signals that fit their needs.


    The non-signal detection module provides the best choice as it is easy to setup
    and does not require any expensive hardware, a video-based eye-tracking device
    can be used, also, there are many new implementations of eye-tracking systems
    that do not require complicated hardware and can achieve good accuracy (Gómez-Poveda
    & Gaudioso, 2016; Mazhar, Shah, Khan, & Tehami, 2015). In addition, the mouse
    movements and keystrokes tracker does not require any hardware. The reason behind
    evaluating each single psychophysiological behavior measure individually then
    combining them together is to provide flexibility in the design as some measures
    may not be available as explained before. Therefore, our proposed insider threat
    detection framework can be a combination of the'
  merge: -1
  img_proc: true
- pgno: 279
  md: 'measures or just a single measure. It also can be combined with other approaches
    which use user''s activity behaviors when using the network or the organization''s
    computer systems and resources to improve the detection accuracy.


    As we conducted human research experiments to evaluate our approach, we were very
    cautious in choosing the participants in terms of gender, age, education level,
    and the cybersecurity knowledge. We did our best to have diverse participants
    that would represent a real-world workplace environment. However, it would be
    valuable to include participants with less education and computer skills. Furthermore,
    our main challenge was the experiment scenarios, mainly the malicious scenarios.
    Emulating real-world insider threat scenarios is a very complicated task as it
    is associated with the psychological and behavioral aspects of the users. We tried
    to simulate real-world workplace environments in our experimental environment
    and tested the participants in conditions that are similar to real-world insider
    attack scenarios. We chose two attacks that involved the network and the application
    level, and mostly used by insiders in practice. It is possible that what we were
    actually discriminating between the specific tasks the participant was performing
    rather than whether that task was malicious. To address this issue with statistical
    significance, more data needs to be collected from more tasks and tested based
    on tasks not involved in the training.


