- pgno: 239
  md: 'guidance for achieving the best practices. The ten steps suggested by FCC can
    be mapped and divided into four layers of security: physical device, app, network,
    and data security. Multiple security layers involve the growing diversity of mobile
    devices, applications, and services in communication networks. It would be helpful
    to decompose the layers when discussing the best practices of mobile security.


    # **Physical Device Protection**


    As for physical device security, setting up a lock screen PIN or strong password
    is the first step to protect our smartphones from being accessed by others. Beyond
    the PIN and password, newer mobile devices support alternative biometric features
    to guard their devices with fingerprint, face recognition, or iris scanning. A
    longer password is a better choice because the four-digit PIN can be easily compromised.
    The rule of thumb of creating a password is to avoid using sequential number (e.g,
    123456) and short or common names/words that can be identified in a dictionary.
    If a user has difficulty creating a strong password, password manager tools have
    been designed to assist in generating complex passwords. Diceware, an open source
    tool invented by Arnold Reinhold, can help construct a strong passphrase or password.
    Diceware was developed by utilizing entropy theory to achieve a higher level of
    randomness with encryption and security. To use Diceware, one needs dice and the
    Diceware wordlist which is available from either the Reinhold’s Diceware Passphrase
    page (Reinhold 2018) or from the Electronic Frontier Foundation’s Dice-Generated
    Passphrases page (EFF 2019). A passphrase generated by Diceware can also be used
    to encrypt information for mobile devices. For protecting device security, the
    second step is to avoid modifying the default security settings unless it is necessary,
    because the default security settings provide features to run automatic security
    updates on hardware, software, and OS. Users need to pay attention to how the
    security settings of their smartphones are set up. It is important to ensure that
    the latest security patch updates and OS version have been installed. In case
    the smartphone is lost, users need to set up Find Device function to remotely
    locate the smartphone. Another protection tip relevant to physical device (see
    Table 10.2) is reporting to the mobile network operator and local police department
    when the smartphone is stolen or lost. In so doing, the mobile network operator
    will suspend the user’s service immediately to avoid unauthorized usage.


    It is worth noting that setting up a password to lock the screen can only prevent
    others from directly accessing the mobile device. If the mobile device is not
    encrypted, the person who stole or held the device can access the data in the
    mobile device using a USB cable physically connected to a computer or software
    tools to access the data in the device.'
  merge: -1
  img_proc: true
- pgno: 240
  md: '# App-Level Security Protection


    As shown in Table 10.2, five out of the ten steps pertain to application security.
    It is known that most Android devices lack built-in security features. Therefore,
    the steps suggested by FCC for both Apple iOS and Android are almost identical
    except for step six, where Apple iPhones have built-in security features that
    users can leverage and rely on, while Android devices might need the installation
    of mobile security apps to secure the device and data privacy. Samsung, one of
    the dominating Android device vendors, has developed a built-in security tool,
    Knox, for its latest devices to address data security and privacy issues (Samsung
    Knox 2019). Google also has Google Play Protect built-in the Android devices to
    regularly scan the apps and detect harmful apps; users can check their app security
    status by opening the Google Play store app. Mobile users need to be vigilant
    about the availability of built-in defense features that support different mobile
    security layers and take precautions when interacting with their mobile device,
    in order to protect their data/information privacy and security on their mobile
    device.


    One of the tips suggested is only installing apps from trusted sources. Unlike
    Google Play store for Android apps, Apple store has detailed guidelines to approve
    apps, and has earned a good reputation for protecting users'' privacy. A well-known
    example was Apple removing Facebook''s Onavo Protect app from the App Store in
    2018 due to its violation of Apple''s privacy guideline about collecting user
    data on the usage of other apps. Facebook Research app reused the code from Onavo
    Protect app to recruit paid users aged between 13 and 35 in the United States
    and India, using a virtual private network (VPN) and granting root network access
    to monitor and collect their mobile usage data. VPN is meant to protect the data
    transmitted to and from the mobile device with encryption; users are encouraged
    to use it to protect the security of data exchange when connecting to free public
    Wi-Fi, and to understand app permissions before accepting them. Paid users of
    Facebook Research app were asked to grant permission to access the “root” level
    of their phones, which allows Facebook to retrieve all the data in their phones,
    including encrypted data and private messages (Constine 2019). Due to the controversial
    use of the security app for spying on users, Onavo Protect app was eventually
    removed by Facebook from Google Play store in early 2019. Considering an analogy
    of a door, if users give permission to change the configuration or access their
    personal data, it is like either opening or unlocking the door to invite the strangers
    to enter their house, which is an unwise decision that could become a major threat.


    Similar to physical device security, the apps require users to accept updates
    and patches in order to keep their systems safely up to date. Based on a recent
    survey, approximately 80% of US adults believe that updating apps is crucial,
    while 33%'
  merge: -1
  img_proc: true
- pgno: 241
  md: 'do not regularly update or check if their apps need to be updated (Google and
    Harris Poll 2019). This implies that information professionals can help provide
    more information access, training, or education to transfer the best practices
    internally within our served communities.


    # Data Protection


    Two tips listed in Table 10.2 pertain to data protection; they suggest not only
    backing up and securing personal data, but also erasing data on old devices before
    reselling or recycling them. It would be safe to backup with two copies of the
    same files in the mobile devices on different devices, such as a PC, laptop, or
    external hard disk. To secure sensitive personal data, users might consider encrypting
    the device as well as backing up data. While handling old mobile devices, users
    can set them back to their original factory settings to wipe personal data saved
    on the device.


    If mobile users lack awareness of data protection using their smartphones, they
    will not take precautions to prevent their personal data from being transferred
    or disclosed to social networks or third parties. Consequently, mobile users who
    do not have a cybersecurity habit will not be motivated to install anti-virus
    and anti-malware software tools in their mobile devices, not to mention ensuring
    that the applications and the mobile OS are up to date. Nevertheless, users constantly
    install a variety of apps with diverse features promoted by the businesses and
    organizations, which may put them at great risk of data breach. For instance,
    retailers have developed mobile apps to engage online customers and extend their
    in-store shopping experience to e-commerce and mobile commerce (i.e., m-commerce).
    Users can make online purchases and set up pick up orders with grocery store apps,
    check account balance and make payments with banking apps, and use ride sharing
    apps to arrange transportation. In general, these apps will not work without the
    Internet because the apps with the capability of context-aware mobile computing
    need to gather data about the user’s location in real-time and analyze the data
    to adapt interactions accordingly. On the one hand, the collection of user data
    makes it easier to offer personalized services and targeted advertisement. On
    the other hand, users might not know how much data or information have been collected
    and sent back to the retailers, banks, and ride sharing service providers, or
    sold to advertisers. Based on the app usage data and the data/information that
    users gave away, those companies and app service providers can piece the data
    together into a whole to profile users. The problem is that consumers cannot seem
    to opt out for privacy reasons, and they are not asked for consent for data collection
    and sharing between third parties. As smartphones gradually turn into a repository
    of biometrics and associated data, data security and privacy should be a big part
    of individual’s efforts to protect their data. Considering security and privacy
    together is often essential for protecting either.'
  merge: -1
  img_proc: true
- pgno: 242
  md: '# Network-Level Security Protection


    Mobile devices are equipped with the wireless connectivity via Bluetooth, cellular
    data, or Wi-Fi network to access the Internet. In terms of network security, the
    tip suggests being smart on open Wi-Fi networks, which could be done in different
    ways. Open or public Wi-Fi networks available in cafés, airports, or hotels are
    usually free and handy, but unfiltered and unsecured. Not all free public Wi-Fi
    requires a password, making data communication vulnerable to hacker attacks. Thus,
    before connecting to any free Wi-Fi access points, mobile users need to cautiously
    ensure they connect to the recognized wireless network with the name given by
    the café, airport or hotel instead of an unknown or bogus one. The mobile users
    also have to think twice before using open Wi-Fi network to access sensitive or
    confidential information as it reveals one’s identity (e.g., banking, credit card
    information, and health records); data or information can be easily intercepted
    and captured in public W-Fi network by cybercriminals. As a result, mobile device
    users’ personal information and digital identity might be stolen.


    To securely access the systems or resources at work, mobile device users should
    use a VPN when connecting to an open Wi-Fi network to prevent a data breach. Additionally,
    it is safer to avoid keeping copies of sensitive/confidential data on personal
    mobile devices. Furthermore, while accessing social networking or online shopping
    websites, mobile users could consider using their data plan supported by their
    mobile phone network rather than choosing open Wi-Fi networks. The anti–virus
    and anti-malware software installed in mobile devices could help detect and protect
    against malicious attacks; however, users have to ensure that software is updated
    in a timely fashion.


    More and more websites employ encryption to protect user information. If the web
    address starts with “https” instead of “http,” it is encrypted. As a mnemonic,
    Federal Trade Commission (FTC) suggests considering the “s” in “https” as “secure.”
    Therefore, paying attention to the secure “https” can ensure that the data transfer
    is protected by encryption. Combining crowdsourcing and machine learning, Web
    of Trust (WOT) (www.mywot.com) is a website reputation service facilitating safer
    browsing and searching with web reputation icons and risk notifications to prevent
    users from scams, malware, phishing, rogue websites, and malicious links. WOT
    is not only an add-on in an Internet browser, but also a mobile app on both iOS
    and Android to prevent users from inadvertently clicking on a problematic link
    through mobile Internet. The user of WOT can contribute to the community by rating
    a website, which identifies the threats that anti–virus or anti-malware tools
    might not catch.


    Using a smartphone as a hub, smart mobile Internet of Things (M-IoT) connects
    a variety of applications, such as smart wearables, smart home, smart campus,
    smart city, smart health, and so on. Smart M-IoT devices could put the user’s
    network at high risk owing to the context-aware connectivity and artificial'
  merge: -1
  img_proc: true
- pgno: 243
  md: 'intelligence (AI), extending communication from human-mobile interaction to
    invisible machine-to-machine communications. The growing prevalence of smart devices
    increases the attack surface targets; however, security, privacy and trust remain
