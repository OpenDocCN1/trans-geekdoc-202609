  md: '# Chapter 9


    # Healthcare Regulations, Threats, and their Impact on Cybersecurity


    Mitchell Parker

    Executive Director, Information Security and Compliance

    Indiana University Health


    # Introduction


    Cybersecurity in Healthcare is important because it touches the patient, the provider,
    and the facilities that store and process patient data. Everyone is affected by
    the loss of access to electronic systems such as Electronic Medical Records used
    in the care process. From data breaches, ransomware, to improper medical records
    access, healthcare information security is pervasive. The risks present are unlike
    every other industry because of the interconnected nature of medical devices,
    electronic health records, interconnection between organizations, and patient
    access.


    One of the most targeted industries is Healthcare. With the number of large data
    breaches such as Anthem’s 2015 90 million record data breach caused by foreign
    intrusion into their network (Teichert 2018), Community Health Systems’ 2014 4.5
    million record data breach caused by foreign network intrusion (Bosshart n.d.),
    and MD Anderson’s 2012 and 2013 loss of two flash drives and a laptop containing
    Protected Health Information for over 30,000 patients (Flahive n.d.), it is easy
    to see that attackers are not only targeting healthcare, they are succeeding.
    The threats, such as Ransomware, continue to evolve.'
  merge: -1
  img_proc: true
- pgno: 194
  md: 'This chapter will delve into four categories to explain the impact of regulations
    and threats on a healthcare organization''s cybersecurity posture. The reason
    why is to examine what they are and their multidimensional impact on an organization.


    We will look at the Security and Privacy components as they relate to cybersecurity
    for the Health Information Portability and Accountability Act (HIPAA), Health
    Information Technology for Economic and Clinical Health Act (HITECH), the EU General
    Data Protection Regulation (GDPR), Payment Card Industry – Data Security Standards
    (PCI-DSS), and 21st Century CURES Act and Trusted Exchange Framework.


    We will then examine the key programs and processes an organization needs to proactively
    defend themselves against cyberattacks, which are the establishment and maintenance
    of a Security program, establishment and maintenance of a Privacy program, and
    implementation of a Data Management, Classification, and Monitoring program. We
    will also discuss the requirements to implement an Asset Management and Tracking
    program, conduct comprehensive risk assessments that cover both Information Security
    and Physical Security, and develop and implement a risk management plan to address
    open issues.


    From this, we will discuss ten emergent and current threats to the healthcare
    environment, and fifteen ways healthcare organizations can address these threats
    under the described programs. The intent of this is to educate the reader as to
    how to build their own comprehensive program, and address risks in their own organization.


    # # Healthcare Privacy and Security Legislation and Requirements


    # ## HIPAA and Its Applicability to Privacy and Security


    The Health Information Portability and Accountability Act, which was signed on
    August 21, 1996, was originally designed to “improve the portability and accountability
    of health insurance coverage” for employees transitioning between jobs, combat
    fraud, waste and abuse in the industry, promote the use of medical savings accounts,
    provide coverage for pre-existing conditions, and simplifying the administration
    of health insurance (HIPAA Journal n.d.). The Privacy Rule, which had an effective
    date for compliance of April 14, 2003, defined Protected Health Information (PHI)
    as “any information held by a covered entity which concerns health status, the
    provision of healthcare, or payment of healthcare that can be linked to an individual”
    (HHS n.d.a). It also defined the intended purposes of access to PHI, which are
    for purposes of coordinating payment, treatment, or business operations (HIPAA
    Journal n.d.).'
  merge: -1
  img_proc: true
- pgno: 195
  md: 'It also defined the terms Business Associate (BA) and Covered Entity. Covered
    Entities are Health Plans, Health Care Clearinghouses, or Health Care Providers
    who electronically transmit any health information in connection with transactions
    for which the Department of Health and Human Services (HHS) has adopted standards
    (HIPAA Journal n.d.). They can be institutions, organizations, or persons. Researchers
    are also covered entities if they are also providers that electronically transmit
    PHI in connection with any transaction for which HHS has adopted a standard (HIPAA
    Journal n.d.).


    BAs are a person or entity, acting on behalf of a Covered Entity, that performs
    certain functions involving the storage or processing of PHI on behalf of them
    who are not workforce members. They require a Business Associate Agreement, which
    is a legal contract that ensures that the BA will adequately and appropriately
    safeguard the information they store and/or process on behalf of the Covered Entity.
    The Business Associate Agreement must establish the permitted and required uses
    and disclosures of PHI by the BA. It must also provide that the BA will not use
    or further disclose the information other than as permitted or required by the
    contract or law. It requires the BA to implement reasonable and appropriate safeguards
    against unauthorized use or disclosure. It also requires the BA to disclose PHI
    to individuals’ requests for copies and make the information available for amendments
    and accountings. This also requires BAs to make available their internal practices,
    books, and records relating to the usage and disclosure of PHI to the Department
    of Health and Human Services (HHS). At the termination of the contract, require
    the BA to return or destroy all PHI received or created by or on behalf of the
    CE. BAs have to ensure that all subcontractors meet the same requirements as they
    have to. Finally, there needs to be a termination clause authorizing termination
    should the BA violate material term(s) of the contract. The Privacy Rule also
    provides instructions on how PHI should be disclosed. It gives rules for getting
    consent from patients before using their information for marketing, fundraising,
    or research purposes. It also gives patients the right to withhold information
    about their care from private insurers if they fund their own treatment. It empowers
    patients to get copies of their Medical Records, ideally in an electronic format
    (HHS n.d.e).


    The most important and critical concept is that of Minimum Necessary. This means
    that organizations need to use only the minimum amount of PHI needed to complete
    a task. This requires organizations to implicitly inventory their PHI and sensitive
    data, classify it, and understand where the information is (HHS n.d.h).


    The HIPAA Security Rule, which has an effective compliance date of April 21, 2005,
    deals specifically with electronically stored Protected Health Information (ePHI).
    It has a number of controls and safeguards organized into three categories. These
    controls and safeguards have to be abided by and followed. In addition, a Security
    Officer has to be named for the organization. This person does not have to be
    dedicated, but they have to have the assigned responsibility.'
  merge: -1
  img_proc: true
- pgno: 196
  md: 'The Administrative safeguards require organizations to create and maintain
    policies and procedures which will illustrate how organizations will comply with
    the Security Rule. The Physical Safeguards are a set of controls that organizations
    have to follow to protect physical access to both printed and electronic PHI from
    unauthorized access. Technical Controls are to protect ePHI during its storage,
    transmission, and processing (HHS n.d.a).


    There has been a major misconception with the Security Rule in terms of Cybersecurity.
    There are two types of controls in the Security Rule, which are Addressable and
    Required. The Addressable controls were interpreted as that you needed to have
    a compensating control to address the issue, rather than directly meeting the
    requirement of the control. Specific requirements for Encryption in the Security
    Rule, 45CFR 164.312(a)(2)(iv), which require organizations to implement mechanisms
    to encrypt and decrypt ePHI, were bypassed in favor of controls that did not encrypt
    data and required the Breach Notification Rule and HITECH Act to clear up (HHS
    n.d.d). A number of data breaches were caused by organizations not encrypting
    data to the requirements of the Security Rule.


    A number of breaches were also caused by organizations not understanding the concept
    of Minimum Necessary, not inventorying their data and assets, and not understanding
    where their data flows were to be able to protect the data (HHS n.d. a). A major
    misconception of companies that has led to data breaches has been that HIPAA only
    applies to communication with outside entities, and that internal communications
    or storage do not need to be protected with the same rigor. This is not true.


    The Security Rule also requires organizations to conduct a periodic risk assessment
    against it to identify any potential gaps, and to reasonably and appropriately
    address them with a security plan. A common misconception of HIPAA is that it
    requires organizations to use only supported operating systems, hardware, and
    software. What the intent is to reasonably and appropriately protect those hardware,
    software, and devices (HHS n.d.c). While no periodic frequency has been specified
    in the Security Rule for either the Risk Assessment or Security Plan, the HITECH
    Act does mandate that organizations who apply for Meaningful Use funding are supposed
    to have a Risk Assessment for each reporting period. The Office for Civil Rights,
    the division of the Center for Medicare and Medicaid Services responsible for
    enforcement of HIPAA, has made statements that they expect the Risk Assessment
    and Risk Management Plan to be done annually at each reporting period (HHS n.d.a).
    As part of this risk assessment, organizations are expected to know what assets
    they own, what risks they pose, and plan to address those risks through a combination
    of Administrative, Technical, and Physical controls.


    Finally, and most critically, the Security Rule requires Data Backup plans, Disaster
    Recovery plans, Emergency Mode Operations Plans, their testing and revision procedures,
    and an application and data criticality analysis (HHS n.d.c).'
  merge: -1
  img_proc: true
- pgno: 197
  md: 'This means that organizations need to make sure that they back up their data,
    test the backups periodically, and test and update their disaster recovery and
    emergency mode operations plans regularly. In the case of a cybersecurity incident,
    knowing what to do when the systems are down is critical. This is mandated by
    Federal law. However, many organizations have not implemented these or adjusted
    them, as evidenced by the ransomware attacks that several hospitals have paid
    the ransom for. The prime example of this is Hollywood Presbyterian Hospital,
    who paid $17,000 in Bitcoin to get their data back after a 2016 attack (Winton
    2016). The Online Trust Alliance, in their Cyber Incident and Breach Trends Report,
    cites that out of 159,700 total incidents analyzed by them in 2017, 93% were avoidable
    and could have been prevented with basic cyber hygiene (The Internet Society 2018).
    A report from the Department of Health and Human Services Office of Inspector
    General published in July 2016 reveals that only two-thirds of the 400 hospitals
    they surveyed had contingency plans that met the four HIPAA requirements (Levinson
    n.d.). The emphasis of the Privacy and Security Rules is to provide a framework
    that organizations can follow and periodically review to check their compliance.
    The controls in the framework emphasize the need to have good Administrative controls
    in place to protect ePHI.


    # The HITECH Act and Its Applicability to Privacy and Security


    The Health Information Technology for Economic and Clinical Health Act, also known
    as the HITECH Act, was enacted as part of the American Recovery and Reinvestment
    Act of 2009 and was signed into law on February 17, 2009 (McGraw n.d.) with an
    effective date of February 18, 2010 for the majority of the Act (HHS n.d.a.).
    The main aim of the Act is promoting the adoption and meaningful use of Health
    Information Technology. However, Subtitle D addresses many of the privacy and
    security concerns of the Privacy and Security rule by doing the following:


    +   (1) Clarifying who a BA is and providing explicit definitions. Before the
    HITECH Act, organizations had to enter into explicit contracts to define their
    responsibilities under HIPAA. Under the HITECH Act, BAs are required to comply
    with most provisions of the Security Rule. Entities that store, transmit, or process
    data on behalf of Covered Entities are also considered BAs, as are entities that
    contract with Covered Entities to allow them to offer a personal health record
    to patients (McGraw n.d.). This is important as many smaller hospitals and providers
    do not have the resources to offer patients electronic copies of their records,
    and this sets the minimum cybersecurity standards that they have to follow.'
  merge: -1
  img_proc: true
- pgno: 198
  md: '+   (2) Requiring organizations to notify individuals of breaches of their
    PHI within 60 days of discovery of a breach and defining what a breach is. A breach,
    according to the Department of Health and Human Services (HHS), is considered
    an impermissible use or disclosure under the Privacy Rule that compromises the
    security or privacy of the PHI.


    +   (a) However, if encryption technology is used to protect the data, and is
    consistent with guidance given in NIST Special Publication 800–111, Guide to Storage
    Encryption Technology for End User Devices, or NIST Special Publications 800–52,
    Guidelines for the Selection and Use of Transport Layer Security (TLS) Implementations;
    800–77, Guide to IPsec VPNs; or 800–113, Guide to SSL VPNs, or others which are
    Federal Information Processing Standards (FIPS) 140–2 validated, the data is not
    considered breached. In effect, this closes the encryption loop discussed earlier
    and establishes minimum standards for the encryption technologies to be used.


    +   (b) If an unauthorized person who received it cannot be reasonably expected
    to have retained it, it is not a breach.


    +   (c) If it''s unintentional, access is within the scope of employment or a
    professional relationship, and not further disclosed, it is not a breach.


    +   (d) If it''s an inadvertent disclosure that occurs within a facility and the
    information does not go any further, it is not a breach (HHS n.d.a).


    +   (3) Introducing four categories of violations that reflect increasing levels
    of culpability.


    +   (4) Introducing four corresponding tiers of penalty amounts that increase
    the minimum penalty amount for each violation.


    +   (5) Setting a maximum penalty amount of $1.5 million for all violations of
    an identical penalty (HHS n.d.d)


    +   (6) Striking the previous bar on the imposition of penalties if the covered
    entity did not know and with the exercise of reasonable diligence would not have
    known of the violation (such violations are now punishable under the lowest tier
    of penalties) (HHS n.d.a).


    +   (7) Providing a prohibition on the imposition of penalties for any violation
    that is corrected within a 30-day time period, as long as the violation was not
    due to willful neglect. (HHS n.d.a).


    +   (8) When organizations attest to Meaningful Use, requiring a Security Risk
    Assessment and Risk Management Plan as part of the attestation process for the
    reporting period (HHS n.d.a).


    What this does in terms of Cybersecurity is provide enhancements to the Security
    Rule that put hard time limits on completion of Risk Assessments and Risk Management
    Plans, implicitly requires the usage of approved encryption technologies to protect
    PHI and requires organizations to consistently assess and address'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'risk for their assets. This means that organizations that ignore updating vulnerable
    components of web server applications, or that do not update their operating systems
    will be penalized for willful neglect. In addition, they will need to come up
    with risk management plans that address identified risks (HHS n.d.a). These will
    need to be kept consistent for the device, hardware, and software in the environment
    or under their control. The HITECH Act, when properly interpreted, clears up the
    ambiguity of the Security Rule.


    # The European Union GDPR and Its Applicability to Healthcare


    The EU General Data Protection Regulation, better known as GDPR, is a replacement
    for the existing EU Data Protection 95/46/EC (Intersoft n.d.b). It is designed
    to provide EU-wide data privacy laws. Due to the evolution of data usage, the
    laws needed to be updated. Due to the effects of both fascism and communism in
    the European Union, there has been a long history of organizations such as the
    Stasi, Nazis, or KGB using personal data to oppress citizens and dissidents, which
    provides the basis for such strong legislation.


    The scope of GDPR, according to Article 3, includes two groups of entities:


    +   (1) Firms located in the European Union that store and process Personal Data
    there.


    +   (2) Firms not located in the European Union that directly and specifically
    offer goods and services to EU residents, or monitor the behavior and/or activity
    of EU residents (GDPREU.org n.d.).


    If your organization specifically markets to or offers services to EU citizens,
    then GDPR will apply to your organization. The reason for inclusion here is because
    a significant amount of academic healthcare organizations openly solicit international
    patients.


    GDPR is based around the concept of three entities. The Subject is any natural
    person whose personal data is being stored, processed, or transmitted. Controllers,
    which can be a natural or legal person, corporation, or government authority,
    establish the purpose, method, and reason for data processing either by themselves
    or in concert with others. Processors process data on behalf of Controllers or
    other Processors (Intersoft n.d.a). GDPR is designed to empower and protect EU
    Subjects from governmental or organizational overreach through enhanced privacy
    laws, provide transparency into Personal Data usage by data controllers and data
    processors, require data security by default when processing data, and allow citizens
    to control what information data controllers and processors have about them and
    require explicit consent to do so. This is a major change for many companies.
    However, one of the major issues is that organizations only'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'focus on one of the main tenets, the Right to Be Forgotten, as opposed to the
    numerous others. GDPR has 99 articles, and an additional 171 requirements. It
    is a regulation, as opposed to a directive, and therefore is enforceable with
    fines and penalties.


    Its scope is to all Data Controllers and Data Processors based in the European
    Union, and organizations that access the personal data of EU citizens (Intersoft
    n. d.c). This has a major impact because corporations that access data and explicitly
    provide and market services to EU citizens outside of the EU need to abide by
    the GDPR as well. This includes companies such as Facebook, Microsoft, and Google.
    Processors can include third parties.


    According to Article 37 of the GDPR, these organizations need to have Data Protection
    Officer(s) assigned, who can be assigned to more than one organization (Intersoft
    n.d.d). They can be a contractor, employee, or company assigned to the role. Their
    contact information needs to be made available to the appropriate supervisory
    authorities. They also need to be professionally qualified to complete the duties
    assigned under Article 39. They need to inform the Controller and Processor(s)
    under their purview of their obligations under the GDPR, monitor compliance with
    GDPR and any local superseding provisions with regard to the protection of Personal
    Data, including the assignment of responsibilities, awareness, and training. They
    are also responsible for conducting and monitoring the required audits (Intersoft
    n.d.e).


    They are also responsible for monitoring the Data Protection Impact Assessment
    (DPIA). A DPIA needs to be conducted when an organization is planning on implementing
    new processes or technologies that present a risk to Personal Data which can present
    a high risk to the rights and freedoms of natural persons. This means that if
    the processing of data can result in harms or damages to the Subject, DPIA needs
    to be done. A DPIA, under Article 35 of the GDPR (Intersoft n.d.f), is an assessment
    of the following:


    +   (1) The intended usage of Personal Data by the Controller and/or Processor.

    +   (2) The intended data elements to be used in processing operations.

    +   (3) A description of the processing operations used to store, process, or
    manipulate the data.

    +   (4) A description of the responsibilities of the Controller(s) and Processor(s)
    in the operations.

    +   (5) A needs analysis of why these data elements are required.

    +   (6) An assessment to the risks of rights and freedoms of Subjects.

    +   (7) Intended countermeasures, including safeguards, security measures, and
    mechanisms to protect Personal Data and regulatory compliance in harmony with
    the GDPR, specifically Article 25, Data protection by design and default (Intersoft
    n.d.g)

    +   (8) Intended countermeasures to protect the rights and individual interests
    of Data Subjects and other concerned parties.'
  merge: -1
  img_proc: true
- pgno: 201
  md: '(9) Consultation with the appropriate supervisory authorities during the process,
    as defined under Article 36, Prior Consultation (Intersoft n.d.d), which involves
    allowing them to review the DPIA, supporting processing documents, risk assessments,
    and intended countermeasures. The supervisory authorities are allowed up to eight
    weeks to provide an initial response, and can, under Article 58, order a deeper
    investigation, fines, reprimands, withdrawal of certification, or erasure of Personal
    Data if an organization is noncompliant (Intersoft n.d.h).


    Organizations also need to prove that they are accountable by not only following
    Articles 37, 35, and 25, but also by demonstrating a culture of monitoring, reviewing,
    and assessing procedures regularly. They need to minimize data processing and
    retention to only what is needed by processes identified by the DPIA. They need
    to have the appropriate safeguards and countermeasures as defined by Article 25.
    They also need to take the Article 36, Prior Consultation process, seriously.
    Most critical is that Processors and Controllers assess, and address risk continually,
    as opposed to once.


    The other important four important tenets are that of Explicit Consent, the Right
    to Be Forgotten, the Right for Data Portability, and the Right to Object to Profiling
    (Heimes n.d.; Intersot n.d.h, n.d.i; Irwin n.d.). Subjects must freely give consent
    for their Personal Data to be used for explicit consent (Irwin n.d.). A number
    of US-based websites that use third-party ad networks for revenue generation have
    stopped offering services to EU citizens because they resell information without
    affirmative consent (Heimes n.d.).


    The Right to Be Forgotten, Article 17 of the GDPR, allows Subjects to request
    that Personal Data held by Processors or Controllers concerning them be erased
    using reasonable and practical steps if the data is no longer necessary for the
    purpose for which it was collected or processed, they withdraw affirmative consent
    and there is no grounds for processing based on that, there is objection to the
    processing by the Subject and there is no legitimate need to do so, it’s illegal,
    it has to be erased for compliance purposes, or it was collected on a person under
    the age of 16 without parental consent, or the child is now 16 and objects. However,
    there are five caveats to the Right to Be Forgotten, which are that it does not
    apply for exercising the right of freedom and information, does not take precedence
    over legal obligations or tasks done in the public interest, does not take precedence
    over legal obligations or tasks done in the public interest for public health,
    or for archiving purposes in the public interest, scientific or historical research
    purposes, or statistical purposes if the right impairs or makes impossible achieving
    the objectives of that processing, or the establishment, exercise, or defense
    of legal claims (Intersot n.d.i).


    What this really means is that all invocations of the Right to be Forgotten requiring
    organizations to examine the request in detail, and make a decision'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'using informed resources so that the requests can be effectively processed.
    It is important to understand that Collectors and Processors cannot erase everything,
    nor should they, and that a cross-disciplinary approach is needed to effectively
    comply, not just blind erasure.


    The Right to Data Portability requires organizations to provide data that a Subject
    has provided to a Controller or Processor to another provider if feasible, or
    to the Subject in a usable format (Intersort n.d.h). The Right to Object to Profiling
    indicates that subjects have the right not to be subject to a decision solely
    based on automated processing (Intersort n.d.k). This has significant ramifications
    for Artificial Intelligence and Machine Learning as this requires affirmative
    consent for their data to be used in the AI/ML decision making process, and that
    there needs to be a nonautomated process alternative in case they do not consent
    to it.


    GDPR is a comprehensive framework that changes how companies operate. It empowers
    EU citizens to control their data. It has not been fully determined how much non-EU
    companies have to comply outside of the European Union, such as when EU patients
    are treated at facilities in the United States, but it is something that will
    be addressed fully in the future. However, it is a major change requiring companies
    to plan out how they store, process, and otherwise manage data.


    # **PCI-DSS and How They Apply to Healthcare Organizations**


    In healthcare, the main way to pay bills is through credit or debit cards. The
    industry standard that organizations are required to implement to protect credit
    card data and comply with requirements are the Payment Card Industry – Data Security
    Standards. These requirements have been developed and maintained by the Payment
    Card Industry Security Standards Council (PCI-SSC), which include many of the
    merchant banks in the United States (TechTarget n.d.). There are 12 major requirements
    and 5 best practices to review to make sure that organizations are in full compliance
    (PCI SSC 2018).


    PCI-DSS requires that organizations install and maintain firewalls configured
    to protect cardholder data. This does not mean that they just have a firewall.
    The devices that process credit cards have to be segmented away from the rest
    of the network. The vendor-supplied default passwords and security parameters
    need to be changed (TechTarget n.d.).


    Stored cardholder data needs to be protected. This doesn’t mean just putting it
    on a file share away from everything else. It needs to be segmented off from the
    rest of the network, encrypted, and protected with two-factor authentication,
    approved strong encryption, minimum access, and audit logging. Cardholder data'
  merge: -1
  img_proc: true
- pgno: 203
  md: 'in transit needs to be encrypted across the Internet and public networks. Anti-virus
    software needs to be used and kept updated as much as possible. Tracking and monitoring
    of all accesses, changes, and alerts from systems, especially anti-virus, is required
    (PCI SSC 2018).


    Organizations need to develop and maintain secure applications. This doesn’t mean
    to just develop an application or deploy a system once. The expectation is that
    they will be maintained regularly and kept in a secure state and assessed for
    risk regularly. As part of this, access will be restricted by need-to-know and
    documented. Access also needs to be reviewed and removed for those who no longer
    have a business need promptly. To do so, unique IDs need to be assigned to each
    person with access. Physical access to cardholder data must be restricted. All
    of the above needs to be tested and documented at least once a year, and with
    a corresponding policy which addresses information security (PCI SSC 2018; TechTarget
    n.d.).


    The best practices are to monitor all security controls to ensure they are working
    effectively. If a control fails, make sure it is detected and responded to. Restore
    the control, identify the failure, identify and address any security issues that
    came about due to it, mitigate the issue, and then resume monitoring. Review changes
    to the environment, determine their impact, identify new requirements, and then
    update the scope and implement new or changed controls. Review structural changes
    to the organization and determine if those change PCI scope, and if they do, adjust
    the scope and requirements, and perform periodic reviews of the environment and
    organization to make sure that everyone is following the right processes (PCI
    SSC 2018). PCI-DSS, while not explicitly a healthcare regulation, governs a technology
    that is in use for financial payments every day. It is also congruent with HIPAA
    and GDPR in continually assessing and addressing risk.


    # 21st Century CURES Act


    The 21st Century CURES Act, Public Law 114–255, effective December 13, 2016, is
    designed to accelerate medical product development and bring new innovations and
    advances to patients that need them (114th Congress (Congress) n.d.; FDA n.d.a).
    As part of this, the Act promotes and supports secure interoperability between
    providers without special effort on the part of the user, and allow for complete
    access, exchange, and use of all electronically accessible health information.
    It establishes the governance needed to do so in Section 4003. Section 4004 defines
    Information Blocking as the implementation of healthcare information technology
    in such a way as to inhibit information sharing between providers. This can include
    development of technology as well as its implementation. Even implementing an
    Electronic Medical Records system with'
  merge: -1
  img_proc: true
- pgno: 204
  md: 'a high degree of customization can potentially put an organization in violation.
    Technology developers can be fined up to $1 million dollars per violation, and
    providers can lose federal incentives and potentially also have civil penalties
    levied (114th Congress (Congress n.d.)).


    What this really means is that US healthcare is being incentivized to share information
    and develop information portability capabilities similar to what is required by
    the GDPR for EU citizens. Security and Privacy need to be built into the process,
    just like GDPR. The draft Trusted Exchange Framework that has been developed by
    the Office of the National Coordinator also requires two-factor authentication
    as part of the authentication process (ONC n.d.), further building security into
    interoperability.


    The convergence of HIPAA, HITECH, GDPR, PCI-DSS, and the 21st Century CURES Act
    lead us to one set of conclusions. Organizations need to have a good unified plan
    and program to address cyber security threats and requirements. If your organization
    has a good core security program, they can not only address cyber threats, but
    also become a more resilient organization capable of meeting regulatory compliance
    requirements. An example of an attempt to come up with a unified plan is the Health
    Information Trust Common Security Framework (HITRUST CSF), version 9.2, which
    combines HIPAA, HITECH, GDPR, PCI-DSS, and Singapore’s Personal Data Protection
    Act (PDPA) into one framework (HITRUST n.d.).


    # Key Programs and Processes Required for Effectively Managing Cybersecurity Response


    # Information Security Program


    Healthcare organizations need to have several programs in place to effectively
    manage their cybersecurity response. The first, and most important, is to have
    an Information Security Program in place with an assigned Security Officer, whose
    overall responsibilities of this program are to identify, assess, and coordinate
    addressing of risks to administrative, technical, and physical controls in an
    organization (HHS n.d.a). While in the past, the Information Security Officer
    and their team, if they have one, would have day to day responsibility for implementation
    of solutions, the pervasiveness of the projects required to address cybersecurity
    needs require the entire organization to own components and tasks of it.


    This is because many of the security components that once were separately managed,
    such as encryption, anti-malware protection, firewalls, and intrusion detection
    systems are now included in existing components such as switches, routers, desktop
    management, and desktop and embedded operating systems.'
  merge: -1
  img_proc: true
- pgno: 205
  md: 'When there are dedicated security components, the level of integration required
    for tools such as Network Access Control, which allows network access based upon
    the security posture of a device, requires close communication between the security
    and network components (Cisco n.d.).


    The Security Officer is also responsible for overseeing the administrative processes,
    such as overseeing review of system users and their access levels, policy and
    procedure development, assist in enforcement and investigations, provide information
    security training and security communication, performing HIPAA, PCI-DSS, security,
    and technical risk assessments and audits as part of the compliance process, and
    developing the risk management plan. They are also responsible for change management
    processes and ensuring that they do not reduce security. The Security Rule defines
    the requirements for Disaster Recovery, Downtime Procedures, and Alternate Mode
    operations (HHS n.d.j). As such, the Security Officer is also responsible for
    oversight of those. They are not responsible for the operation of the plans, however
    they are responsible for documenting them as part of risk assessments and participating
    in their development, as well as testing of the plans.


    With the complexity of environments, they are also responsible for managing security
    during the asset intake and disposition processes. Devices and systems need to
    be evaluated for risk before they even come into the environment and need to be
    deployed securely. The security officer needs to make sure that devices such as
    medical equipment or systems such as Electronic Medical Record or virtual infrastructures
    are configured securely before they attach to the network. When the devices or
    computers are disposed of, PHI needs to be erased from the devices securely. For
    Cloud-based infrastructures, the Security Officer is responsible for ensuring
    that the configurations are also secure.


    They are also responsible for oversight of the technical processes, including
    working with the technical teams so that devices, networks, and their configurations
    are reasonably and appropriately secure to the standards set in the HIPAA Security
    Rule, HITECH Act, and 21st Century CURES Act. This includes the oversight of encryption
    and key management processes, oversight of network security, and oversight of
    infrastructure management to ensure secure configurations.


    In addition, they are also now responsible for working with the physical security
    teams to address physical security requirements to protect assets. This includes
    physical placement of devices to reduce the security and privacy risks from exposure
    to PHI, physical protection to reduce the risk of theft, and performing physical
    security risk assessments (HHS n.d.d). A corollary item some healthcare providers
    do is to collaborate on Hazard Vulnerability Analysis reports with the Physical
    Security Team (CHA n.d.).


    Since Downtime Procedures, Disaster Recovery, and Alternate Mode Operations are
    part of the HIPAA Security Rule, a part of the responsibility of the Security
    Officer is to coordinate with the parties who own those on integrating'
  merge: -1
  img_proc: true
- pgno: 206
  md: 'Information Security as part of these programs, as cybersecurity attacks causing
    system downtimes are now very common (HHS 2018d).


    # Privacy Program


    The Privacy Officer is responsible for the implementation of a Privacy Program
    whose scope is managing the appropriate intake, usage, consents, and disclosures
    of protected information across an organization to minimize risk, ensure confidentiality,
    and maintain compliance with international, federal, state, and local laws and
    requirements for data intake, processing, consenting, and disposition/retention
    (AHIMA n.d.). This position is usually staffed by a lawyer because of the needed
    legal knowledge and training to be able to interpret laws, requirements, their
    applicability, and ethics standards and apply them to develop policies, procedures,
    and processes that meet organizational requirements.


    The Privacy Program requires good organizational governance, including senior
    management, security, corporate compliance, and risk to be able to address and
    respond to identified issues. They need to establish solid policies, procedures,
    and processes to meet the requirements of managing the appropriate usage, consents,
    processing, intake, and disposition of data in an organization.


    They also need to conduct privacy walkthroughs and risk assessments of organizations
    to make sure that all parties with access to protected information manage and
    use it in concordance with appropriate rules and regulations, and protect the
    integrity, security, and privacy of it across the organization. They own the development
    and maintenance of consent and authorization processes to make sure they are in
    accordance with applicable laws, regulations, and standards. They are also responsible
    for investigations and risk assessments of potential data and privacy breaches.
    They track and investigate potential breaches, and report breaches to the appropriate
    state and Federal authorities (HHS n.d.d).


    They are responsible for the privacy education program, and ongoing education
    where required as part of it. This includes establishing channels by which organization
    members or concerned parties can report issues.


    With the changing needs of cybersecurity, there is a heightened need to work with
    Information Security to establish Privacy Monitoring of systems containing Protected
    Health Information. This involves auditing all accesses to Electronic Medical
    Record (EMR) systems and reviewing them to see if people are accessing records
    outside of a defined Business, Payment, or Operations need, or if they are accessing
    records of friends, family, VIPs, or neighbors. This Privacy Monitoring also can
    include reviewing where the records were accessed from, such as from certain IP
    addresses, to see if an account has been compromised. It may also include proactive
    scanning of audit logs to see what records that an asset which has been compromised
    with malware accessed to identify potentially breached'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'patients. It may include scanning audit logs to see what records a stolen or
    missing asset may have accessed and potentially stored (Cyngergistek n.d.). Finally,
    as part of an investigation, it may include all accesses from a certain employee.
    This is a constantly evolving process that requires good governance, excellent
    partnerships with Information Security and the technology teams, and constant
    monitoring for compliance.


    # Data Management, Classification, and Monitoring Program


    The Data Management, Classification, and Monitoring program ties into the HIPAA
    Security Rule requirements for Data Management, Information Security, and Privacy.
    It also is required for PCI-DSS processing. The reason for this is to establish
    lifecycle management and intake, storage, processing, protection at rest, protection
    in transit, access requirements, retention, and disposition/disposal of data by
    an organization of its data. The reason for this program is to provide a single
    reference that organizations can use to determine the appropriate protection and
    management requirements for it.


    As part of this, organizations need to identify where they store data, how it
    is stored, and where it flows throughout its lifecycle. This is required for HIPAA,
    PCI-DSS, and GDPR compliance. Privacy Monitoring is a way of sampling identified
    data flows for inappropriate access (Cyngergistek n.d.).


    Data Loss Prevention (DLP) is a process and technology used to identify data that
    is not being adequately protected by monitoring data flows to identify data that
    is not flowing to appropriate destinations or is not being protected adequately
    (Zhang 2019). Examples of DLP include scanning workstations to see if data is
    being transferred to flash drives, scanning web traffic to see if unencrypted
    credit card data is being sent to websites, or scanning to see if Protected Health
    Information is being sent unprotected across the network or to the Internet. This
    can also include scanning for information being sent to suspect places or to “phishing”
    sites.


    Cloud Access Security Brokers (CASB), a subset of DLP, are technologies used to
    monitor for data loss with cloud providers. As a lot of Cloud providers encrypt
    traffic to and from their environments, it requires organizations to interface
    with the Cloud providers, and potentially use integration via Application Programming
    Interfaces to identify potential DLP violations at the cloud providers (Netskope
    n.d.).


    The Data Management, Classification, and Monitoring program either needs its own
    dedicated resource or needs to be managed by the Privacy and Security teams with
    input from Risk and Corporate Compliance. There needs to be governance either
    through data management or through existing Privacy and Security committee(s).
    This needs the attention and action of senior leadership to be effective.'
  merge: -1
  img_proc: true
- pgno: 208
  md: '# Asset Management Program


    Along with Data Management, there needs to be excellent Asset Management. HIPAA,
    PCI-DSS, and GDPR all require the identification of assets that will be storing
    or processing protected information (HHS n.d.d). An Asset Management program tracks
    the intake, location, information stored and processed, protection, demographic
    information, and ultimate disposition of an asset through its lifecycle in a company.
    It also tracks the software, operating system, configurations, and security patches
    loaded on a device. It can be done either automatically or manually. The use of
    asset management combined with technology such as Network Access Control, which
    is a gatekeeper to allow known devices onto the network, to identify assets that
    have not been identified or catalogued. This program needs to be managed and maintained
    by a dedicated Asset Management team, and requires synchronization with Supply
    Chain, Medical Device Management, Server Infrastructure, and Desktop Support along
    with Privacy and Security.


    The cybersecurity benefit of Asset Management is that the cataloguing of assets
    will help organizations better discover and address vulnerabilities by being able
    to target and address them. It also provides information on the security posture
    of the environment at any given time, and what data resides where. This is useful
    for when machines have been targeted by malware, when you need to identify assets
    that need to be protected, or when you need to otherwise assess risk.


    # Risk Assessments


    Information Security Risk Assessments, both technical and nontechnical, are absolutely
    critical for organizations. They are required by HIPAA, HITECH, GDPR, and PCI-DSS
    at least annually. They should also be done for incoming assets and systems. Ideally,
    the risk assessment will have a quantitative score from 0 to 5, 0 being no risk,
    and 5 being critical, to measure the likelihood of each risk occurring, its overall
    risk, and its impacts on income, patient satisfaction, employee engagement, operations,
    and reputation. The risk assessment tool should use a standard format, such as
    the System Readiness Assessment tool from the Center for Medicare and Medicaid
    Services (CMS), which gives providers a basic risk management framework they can
    use to conduct their own risk assessments (HHS n.d.j). They need to be done at
    least yearly and during major changes such as an EMR implementation to identify
    known risks so that they can be followed up on. These are excellent at identifying
    technical, administrative, and physical risks and give you not only a background
    as to what they are, but what you should address based on the impact.'
  merge: -1
  img_proc: true
- pgno: 209
  md: '# Risk Management Plan


    The Risk Management Plan, which follows up on the Risk Assessment, takes the identified
    top risks and assigns resources to address them, provides a documented plan to
    address them within a fixed time period. The risk, identified resources, project
    plan, completion date, and follow-up dates need to be identified. This helps identify
    and put timelines on cyber risks and allows organizations to plan remediations
    to risks and budget money and resources for them.


    # Ten Emerging Threats More Prevalent in the Healthcare Environment


    There are currently ten major types of cyberattacks and threats that cause most
    of the events you read about on the Internet or in newspapers. We will look at
    each of these attacks and discuss how they can threaten the security of the network
    and the data stored on it.


    # Ransomware


    Ransomware, the most common type of attack now, works by utilizing any number
    of security vulnerabilities in common programs such as document viewers, web browsers,
    or operating systems to execute itself and encrypt files or databases. To get
    your files back, you need to pay a “ransom” in cryptocurrency, usually Bitcoin
    or Ethereum, to get a key to unlock your files. Ransomware works because many
    organizations do not back up their data, do not have effective downtime procedures,
    or do not have tested alternate mode operations, and because of that will pay
    the cost to get their business back. A number of healthcare organizations such
    as Hollywood Presbyterian Hospital and municipal governments have fallen victim
    to Ransomware. However, files containing PHI that have been encrypted by Ransomware
    are considered breached unless you can affirmatively prove that there has been
    a low probability of a breach (HHS 2016).


    # Phishing


    Phishing works by tricking the user into responding to or clicking on a link in
    a fake message, usually official looking or sounding, from a malicious third party,
    and using that to retrieve credentials for the purpose of either impersonating
    that user to send more phishing emails, using those credentials to log into sites
    and take control of bank accounts, cryptocurrency wallets, or personal information,
    or to impersonate someone for more targeted attacks (Fruhlinger 2018). An example
    is the attack that happened to New York Oncology Hematology, where 15 employees'
  merge: -1
  img_proc: true
- pgno: 210
  md: 'fell for one of these schemes and caused a data breach of 128,000 employees
    and patients (Davis 2018). Children’s Mercy Hospital in Kansas City, MO had to
    notify 63,049 patients and family members after employees fell for a phishing
    scheme and caused data breaches (Paavola 2018).


    # Business Email Compromise


    Business Email Compromise is a targeted attack that uses either a compromised
    account from a successful Phishing attack, a forged email address, or a throwaway
    free account to impersonate an executive for the purpose of convincing someone
    with access to make financial transactions to maliciously send money to bank accounts
    in their control. They normally use a false sense of urgency to attempt to convince
    their targets to make these transactions without following standard processes
    or controls that would otherwise thwart this attack (FBI n.d.). Southern Oregon
    University had a $2 million loss due to this type of attack in 2017 (Dellinger
    2017). The Federal Bureau of Investigation, in a Public Service Announcement from
    July 12, 2018, indicated that they had recorded 78,617 domestic and international
    incidents of these with an exposed dollar loss of $12,536,948,299 across multiple
    industries (FBI 2018).


    # System Currency


    System Currency and Keeping Software Updated is the main reason many of these
    breaches occur in the first place. The healthcare world is well-known for its
    use of legacy software. WannaCry, Petya/NotPetya, SamSam, and other variants of
    malware spread by taking advantage of known vulnerabilities in Microsoft software
    that had been patched. Not keeping software patched has caused a very large number
    of data breaches and is easily preventable.


    # Healthcare Data Breaches


    Intentional and Unintentional data breaches, such as copying data to an unprotected
    flash drive and then losing it, having an unprotected laptop stolen, or having
    a train car full of trash spread papers of unprotected PHI through a neighborhood
    are a persistent threat. Employees snooping on medical records that they do not
    have a business need for purposes of Payment, Treatment, or Operations is also
    a major threat. A major example of a data breach involving a flash drive is with
    the MD Anderson Cancer Center data breach, where two unencrypted USB Flash drives
    containing records on 33,500 patients were lost, and they had to pay $4.3 million
    in penalties (HHS n.d.g). A contemporary example of medical records snooping happened
    to reality TV star Kim Kardashian, whose medical records were'
  merge: -1
  img_proc: true
- pgno: 211
  md: 'accessed by six people at Cedars-Sinai in Los Angeles after she gave birth
    to her daughter there (Gorman and Seweel 2013). Those six people were later terminated
    after an investigation. An example of a data breach involving remote access is
    with the one that happened at Community Health Systems in 2014, where a security
    vulnerability in the OpenSSL library used to encrypt data known as Heartbleed
    was used to access the medical records of 4.5 million patients (Ragan n.d.).


    # # Coding/Programming Errors


    Coding errors in software are often exploited by malicious third parties to extract
    data from databases or systems. SQL Injection attacks, which work by overriding
    legitimate database commands either programmatically or through exploiting the
    lack of input validation in web programming, are the most common manifestation
    of this (OWASP.org. n.d.). However, buffer overflow, heap overflow, and stack
    overflow attacks, which take advantage of poor input validation techniques, poor
    bounds checking (often in the C programming language), and insecure coding, are
    also prevalent. SQL Injection attacks were the cause of a data breach that affected
    the company Medical Informatics Engineering, and its subsidiary, NoMoreClipboard,
    who lost 3.9 million personal records in 2015. Attorneys general from 12 states
    are suing this company, based in Indiana, because they failed to secure their
    computer systems (Bradbury 2018).


    # # User Management


    User management and the failure to remove unneeded or unused accounts is also
    a consistent threat. A number of cases prosecuted by the US Justice Department''s
    Computer Crimes and Intellectual Property Section have involved terminated employees
    that have retained access to systems at their previous employers and either utilized
    that data for gain elsewhere or maliciously attacked their old companies (US DOJ
    n.d.). Memorial Health System paid a $5.5 million penalty to the US government
    after a data breach that affected 115,143 individuals caused by the use of a former
    employee''s credentials to access protected health information (HHS n.d.k). It
    is important to constantly validate who has access to systems, to terminate system
    and remote access immediately upon termination, and to review access immediately
    after a job role change.


    # # Wireless Security


    Wireless security is also a constant concern. Many wireless devices either still
    use no encryption, the Wired Equivalent Privacy (WEP) Protocol, which was broken
    in 2007, or older encryption schemes such as Wi-Fi Protected Access, which does
    not encrypt'
  merge: -1
  img_proc: true
- pgno: 212
  md: 'data with strong encryption (Schneier 2007). The use of no or weak encryption
    on wireless allows malicious actors to maliciously eavesdrop on traffic and hijack
    account credentials. While this example was not in healthcare, TJX, the parent
    company of TK Maxx, was breached because of lax wireless security, and 45.6 million
    credit cards were taken from their network because of their use of WEP (Espiner
    2007).


    # Network Hijacking


    A newer type of attack is Network Hijacking. Well-funded nation-states such as
    China and Russia are able to either hack existing network providers or manipulate
    networks under their control to redirect traffic from the Internet to computers
    they control for the purpose of impersonating legitimate sites and taking advantage
    of weak security controls in software for hijacking information or injecting their
    own. The Amazon Route 53 DNS attack utilized a technique called Border Gateway
    Protocol (BGP) hijacking to reroute traffic to Amazon Domain Name Server (DNS)
    servers through servers in Russia. This allowed malicious hackers to steal $23
    million in cryptocurrency (Goodin 2018). There is also a malware that targets
    home routers and redirects traffic to hostile websites which hijack passwords,
    personal data, and bank account information such as VPNFilter (Symantec 2018).


    # Medical Device Security


    Medical Device Security involves attacks directly aimed at compromising medical
    devices. A common issue with them is that their software and firmware are never
    updated for a number of reasons (FDA n.d.b). Many of these devices run either
    Windows or embedded Linux. Many healthcare providers also do not segment their
    networks to protect medical devices. They will run them on their wireless network
    or will put them on open networks that everyone can see. This allows malicious
    actors to easily compromise them and use them to either attack other devices,
    steal information, or further compromise the integrity and behavior of hospital
    networks. The Wannacry malware attack, attributed to North Korea, which crippled
    numerous organizations in the United States and United Kingdom, directly attacked
    medical devices in the United States, including a Bayer Medrad device. This was
    the first time that a malware attack had directly attacked medical devices (Brewster
    2017).


    # How Can We Address These Threats for Healthcare Organizations and Professionals?


    We can take a structured approach and utilize fifteen techniques to increase our
    defenses to greatly improve security and bring us in compliance with HIPAA,'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'PCI-DSS, HITECH, and GDPR. These techniques will make your organization more
    resilient and increase your chances of surviving a cybersecurity attack. These
    are the both the implementation of the mandatory regulatory requirements of the
    HIPAA Security Rule, and recommendations from PCI-DSS. The application of these
    basic controls and best practices will not only bring your health care organization
    into regulatory compliance, but also significantly reduce risk. The goals of these
    controls, based on HIPAA and PCI-DSS, are to provide organizations with the basic
    controls needed to maintain effective cybersecurity and demonstrable evidence
    of compliance.


    # Risk Assessments


    Conducting risk assessments at least annually will not only bring your organization
    into regulatory compliance with the HIPAA Security Rule, it will also allow you
    to identify key areas for improvement. Utilizing a quantitatively scored risk
    assessment that addresses the items of highest impact and likelihood first will
    allow you to prioritize what risks to address and how quickly you need to address
    them. If possible, use the CMS System Readiness Assessment tool in combination
    with numeric scoring to identify your top risks. PCI-DSS also requires at least
    an annual risk assessment.


    # Training/Communication Plan


    Your workforce needs to know what to do. The HIPAA Security Rule requires that
    you have comprehensive training on an ongoing basis that addresses Information
    Security (HHS n.d.d). This training should be updated at least yearly. There also
    needs to be at least monthly communication on emergent issues, and if there is
    an emergency, immediate communication. A good training program will discuss what
    actions team members need to take, why they need to take them, and what they can
    do to further assist. Constant communication on how team members can report vulnerabilities
    or issues to Privacy or Security is also highly recommended.


    # Asset Management


    Having a good asset management program allows you to quickly identify vulnerable
    assets and develop remediation plans. If you do not know what you own, how can
    you protect it? You need to be able to identify and locate your assets so you
    can address risks as they arise and ensure that all assets are reasonably and
    appropriately protected against high risks. It is also required by the Security
    Rule to protect physical and digital assets. Physical assets include physical
    computers, hardware, networks, backup tapes, smartphones, flash drives, and paper
    files and data. Digital assets include software, medical data, computer files,
    and images, including pictures and radiology images.'
  merge: -1
  img_proc: true
- pgno: 214
  md: '# Vulnerability Management


    When vulnerabilities occur, they need to be patched or protected against as quickly
    as possible. A good vulnerability management program involves coordination with
    the IT department to address identified vulnerabilities through the application
    of remediation processes to the applicable assets. These processes can include
    configuration changes, software patches, or network changes. Penetration test,
    which is where someone attempts to break into a network for the purpose of identifying
    security holes, is also a form of vulnerability management. Vulnerability management,
    which is the identification of risks and the plan to remediate them, is written
    up in the Security Rule as “Protect against any reasonably anticipated threats
    or hazards to the security or integrity of such information” (HHS n.d.d).


    # Downtime Procedures/Alternate Mode Operations


    When a system downtime or cyberattack happens, your organization needs to be able
    to continue business without the computers being fully operational, or operational
    at all. Ransomware is effective because it is disruptive and can cause organizations
    that do not have downtime procedures, which are steps that an organization can
    take to remain operational without key critical systems such as EMRs working.
    These procedures need to be updated and tested with team members at least yearly.
    The HIPAA Security Rule also requires this.


    # Data Backup


    Ransomware is also successful because many organizations do not back up their
    data, do not test to see how long it takes to restore it, or do not test the backups
    at all. In the case of Hancock Regional Hospital in Indiana, ransomware actually
    affected the backups (Long n.d.). Often the ransomed data is the only copy the
    organization has. Having good tested data backups and knowing how long it takes
    to restore backups of critical systems will be of great assistance in successfully
    recovering from an attack. Also, organizations, in light of the Hancock incident,
    need to make sure that ransomware does not affect them. The HIPAA Security Rule,
    finally, also requires them.


    # Data Loss Prevention/Cloud Access Security Broker


    The use of DLP/CASB to identify either the intentional or unintentional exfiltration
    of protected data outside the assets or cloud services authorized to access it
    will assist in several ways. First, it will help identify potential exfiltration
    of data by malware from infected PCs. It can also find misconfigured websites
    or cloud services not protecting data. It can also find potential insider threats
    of people sending out data for either personal gain or criminal purposes. The'
  merge: -1
  img_proc: true
- pgno: 215
  md: 'Security Rule requires this because organizations are required to “Protect
    against any reasonably anticipated uses or disclosures of such information that
    are not permitted or required under subpart E of this part” (HHS n.d.d). The use
    of these technologies helps guard against these potential unauthorized disclosures.


    # Continual System and Security Monitoring


    Having logs and audit data is not enough. You need to look at this data and examine
    it for potential anomalies. The use of a Security Incident and Event Management
    (SIEM) system to scan the copious amounts of log files and audit data is required
    to be able to meet the requirements of HIPAA, PCI-DSS, and GDPR. This is because
    it is nearly impossible to accurately scan this data and make associations and
    correlations to find anomalies or issues. Systems also need to be configured to
    send their log data to the SIEM to be able to give it enough data for analysis
    to find said anomalies. HIPAA, in particular, requires the review of information
    systems activity in the Security Rule to determine potential violations of patient
    privacy and security (HHS n.d.d).


    # User Access Reviews


    As we previously discussed, a number of data breaches have been caused by access
    to accounts by people that were not currently employed at the companies they pilfered
    data from or hacked. It is required under HIPAA, PCI-DSS, and GDPR to review access
    to systems, promptly make sure that people who do not need access have it removed,
    and review access and entitlements of team members who have changed roles to make
    sure that they only access what they need to.


    # Privacy Monitoring


    Under both HIPAA and GDPR, it is required to monitor access to systems to ensure
    that people access Personal Data or PHI for business and job-related purposes.
    Privacy Monitoring is the overall process by which organizations can detect potential
    privacy violations and address them. In healthcare, looking at the records of
    patients you are not involved in treatment, operations, or arranging payment for
    is a breach. This includes your own family, friends, and neighbors. With GDPR,
    viewing Personal Data outside of the documented business processes and workflows
    is also considered a breach.


    # Encryption and Key Management


    The HITECH Act and HIPAA mandate the use of strong encryption to protect PHI in
    transit and at rest. PCI-DSS requires it to protect cardholder data in'
  merge: -1
  img_proc: true
- pgno: 216
  md: 'transit and at rest. Strong encryption is no longer an addressable issue, it
    is a standard part of doing business. Encrypting Personal Data, credit card data,
    and PHI, and protecting the encryption keys from potential compromise is a requirement
    to handle it. Having good processes to manage encryption keys and passwords will
    help protect the organization.


    # ## Distributed Ledger Technologies


    The use of Distributed Ledger Technologies to exchange data between mutually exclusive
    members of consortiums can greatly help verify and validate who made transactions
    and when and provide an authoritative record of them. The Security Rule requires
    that organizations protect the confidentiality, integrity, and availability of
    data. This is another means by which they can do so using cryptographic hashing,
    identity management, and encryption.


    Digital Distributed Ledger Technologies provide verification and validation services
    between mutually exclusive and independent participants where there is no central
    authority, by utilizing a synchronized shared ledger (distributed ledger) replicated
    and distributed across participants, mutually agreeable record and transaction
    formats that can be verified and validated by source systems, Strong cryptographic
    verification and cross-validation of record entries to ensure immutability and
    prevent tampering or double-entries, processes for ensuring consensus and consistency
    of the ledger view by all participants utilizing strong cryptography, appropriate
    consensus mechanisms, and cryptographic hashing algorithms to link entries together,
    and technologies that allow participants to utilize Application Programming Interfaces
    or utilities to enable reading or writing to the distributed ledger and enable
    records and transactions to be transferred between the Distributed Ledger and
    authoritative data sources and/or systems.


    Note: Participants could be further defined, such as size of node, light or heavy
    processing, light or heavy devices or systems, and so on (Ray n.d.).


    # ## Network Segmentation and Design/Zero Trust Networks


    Building on the principles of Minimum Necessary from the HIPAA Privacy Rule, this
    involves only giving minimum network access to assets that explicitly need it
    and explicitly forbidding any unnecessary communications. This involves the use
    of firewalls, switching, and Access Control Lists to explicitly permit only required
    traffic and deny the rest. The use of this technique greatly reduces the attack
    surface of the network and reduces the potential risk of medical device compromise.
    It buys time so that limited resources can effectively patch these devices.'
  merge: -1
  img_proc: true
- pgno: 217
  md: '# Effective Contract Management


    Security management of Cloud providers and third parties is not enforceable without
    good binding legal contracts. The Business Associate Agreement should not only
    specify the security parameters required, it needs to also specify the methods
    and processes by which third parties can comply, and what requirements they need
    to follow. This is so that systems and devices that are going to be used on behalf
    of your organization are able to be monitored for compliance and security. The
    HIPAA Security rule also requires that organizations appropriately safeguard the
    information.


    # Risk Management Plan


    Finally, nothing is effective without a constantly managed and updated Risk Management
    Plan. Building on the information from the risk assessments, vulnerability management
    program, security monitoring, and privacy monitoring systems, this is the comprehensive
    plan that will guide your organization’s security program. This plan has to have
    assigned tasks, resources, plans, and definitive and realistic dates that need
    to be met. If there is no plan, there is no way of measuring progress across the
    organization, and it will be significantly more difficult to manage the Information
    Security program. It is also required by the HIPAA Security Rule.


    # Conclusion


    This chapter’s aim was to assist the reader in understanding the regulatory environment
    behind data protection and cybersecurity in healthcare, including HIPAA, HITECH,
    PCI-DSS, GDPR, and the 21st Century CURES Act. We discussed how HIPAA started
    out as providing a basic set of Privacy and Security controls and definitions,
    specifically of BAs and Covered Entities for organizations, and how they emphasized
    the need to continually review and monitor processes. We then discussed how the
    HITECH Act cleared up ambiguity in the HIPAA Security Rule, specifically with
    the definitions of BAs, specifics of when to notify affected parties of breaches,
    increased administrative penalties, and acceptable encryption standards for protecting
    Protected Health Information. The GDPR was then looked at in detail, with the
    emphasis on the Article 35 Data Protection Impact Analysis, the rights of Natural
    Persons, and the need for organizations to be able to articulate their data processes
    and flows. As healthcare relies significantly on payments from patients and families,
    the Payment Card Industry – Data Security Standards (PCI-DSS) standards, and steps
    organizations need to take to be compliant, specifically with protection and segmentation
    of cardholder data, and the required continual review and assessment steps. The
    21st Century CURES Act, with its emphasis on secure interoperability using'
  merge: -1
  img_proc: true
- pgno: 218
  md: 'documented processes and standards that require privacy and security to be
    designed in, and increased financial penalties for organizations that do not comply,
    was explained, particularly the requirement for organizations to not engage in
    Data Blocking.


    Healthcare organizations need to have six key programs in place to protect themselves
    against cybersecurity attacks and remain in regulatory compliance. An Information
    Security program with an assigned Information Security officer to oversee information
    security efforts is where they need to start. A Privacy Program to effectively
    monitor how organizations administratively protect patient data is also required
    by the HIPAA Privacy Rule. Knowing where data resides, where it flows, and monitoring
    it for appropriate use and disclosure is the responsibility of the Data Management,
    Classification, and Monitoring program. Knowing what assets a healthcare organization
    has and what data is stored and processed by them is the mission of the Asset
    Management program. Risk Assessments are the method and process by which healthcare
    organizations can effectively quantify and measure risk and determine what the
    greatest threats are. Risk Management plans take the input of the risk assessment
    and are used to develop processes and steps by which organizations can effectively
    mitigate risk.


    The ten most dangerous cybersecurity threats to healthcare organizations were
    then explored. These include Ransomware, Phishing, Business Email Compromise,
    System Security (keeping systems current so security risks can be addressed with
    patches and fixes), Data Breaches, Coding/Programming Errors (especially SQL Injection
    and Buffer Overflow attacks), User Management, specifically not removing users
    who no longer need access, Wireless Security, Network Hijacking, and Medical Device
    Security. The case of MD Anderson Cancer Center, who had a data breach and subsequent
    $4.3 million-dollar administrative penalty caused by the loss of two unencrypted
    flash drives, was extrapolated.


    Finally, we looked at the fifteen steps an organization can take to help greatly
    improve their resiliency and reduce their risk of cyberattack, based on the HIPAA
    Security Rule and PCI-DSS. These are basic steps we covered earlier in the chapter.
    They include risk assessments, effective training and communication plans, asset
    management, vulnerability management, tested downtime procedures and alternate
    mode operations, data backup, DLP/CASB, Continual System and Security Monitoring,
    User Access Reviews, Privacy Monitoring, Encryption and Key Management, the potential
    use of Distributed Ledger Technologies, Zero Trust/Segmented Networks, Effective
    Contract Management, and finally, a Risk Management Plan to tie it all together.
    The cases of Hancock Regional Hospital and MD Anderson show that there is a need
    for continual security monitoring.


    The most important aspect to take away from this chapter is that security is continuous,
    and that it takes continual effort and following up to assess and address risk.
    The work is never done, and threats continue to evolve. However, we can work to
    make our organizations significantly more resilient from these attacks.'
  merge: -1
  img_proc: true
