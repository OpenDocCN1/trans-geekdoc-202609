    protocols and obtain student health records, student grades, student or faculty
    research history, and utilize this data in malevolent guises. If such private
    student information and data is stolen, irreparable damage could be caused to
    students. Along with uploading students’ data to information warehouse servers,
    promoting some data and information via open access initiatives may also lead
    to malicious uses of data and information. These cybercriminals also seem to troll
    and assail universities and other related research institutions.


    # # Cybersecurity Breaches Affect Universities and the Military


