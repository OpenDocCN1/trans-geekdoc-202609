  img_proc: true
- pgno: 111
  md: '# Breaking the Mold


    But why do all this? One could argue that while the information security world
    has put increasing resources toward job teaching cybersecurity skills to young
    adults and teens, and indeed, librarian-to-librarian training through grassroots
    initiatives like the Library Freedom Project and closely affiliated Tor Project
    (Macrina 2015) has already proven to be highly effective. Tweens however are largely
    left out of this equation, and at an age where basic security knowledge and key
    concepts could have a lasting impact on their digital lives. This is even more
    true in the state of California, which has seen significant drops in funding for
    school librarians and library spaces within schools. The California School Library
    Association notes that “since the beginning of the 21st Century, California has
    decreased the number of teacher librarians who are officially administering required
    school library programs by over 60%” (CSLA 2019). This shortage of school librarians,
    coupled with the ever-increasing impact of Internet technology in our daily lives,
    means public libraries should play a bigger role in developing online privacy
    awareness and cybersecurity skills. At the same time, over the past decade the
    US federal government has shown even greater interest in cybersecurity as a means
    of workforce development and promoting national security. One needs to only browse
    the millions of dollars of grant funding for cybersecurity education floating
    on Grants.gov, a central database for multiple departments, to see this is true.


    The software “edutainment” model, which attempts to create games with the primary
    goal of education, rather than demonstrate learning objectives through pre-existing
    (and inherently fun) videogames, also never attempts to wrestle with or even approach
    the fact that youth and their digital selves have completely different motivating
    factors in cyberspace. In surveying traditional online cyber-security education
    material and textbooks, you will often find it is heavily focused on the financial
    implications for data loss or data leaks, often from a business perspective. This
    does not work so well for tweens. For example, how does one explain the need to
    keep their smartphone OS up to date if they do not own or use one? Many of the
    teens I spoke to use laptops provided by their school – as a result, they have
    an IT team working in the background doing maintenance. This is not the “real
    world” quite yet. The impact of an identity theft is completely different when
    you are 12. Youth, when compared to their older peers, have invested less time
    in maintaining or curating their online identity, and thus have much less to lose.
    This is why Minecraft became the subject of cybersecurity education, because while
    a game world may seem less “real” to adults, our hypothesis was that it would
    better demonstrate the benefit of threat modeling to young people.


    Although experimental in nature, through this project I hoped to show that reframing
    cybersecurity as a set of survival skills anchored in the fundamental elements
    of Minecraft gameplay (exploration, design, and self-preservation) and'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'expanded to also include the meta-framework of the Minecraft online community
    (specifically the multiplayer experience, but also game modifications) will mesh
    better with youth audiences not only because educators and students can suddenly
    use this shared language, but also because it leverages _organic_ gameplay and
    Minecraft game mechanics they are already familiar with, which is very empowering.
    This concept of a MetaMinecraft, or the sum whole of the Minecraft fandom, is
    an attempted to create a flipped classroom where the students do not know they
    have been exercising their cybersecurity skills until their gameplay experiences
    are introduced as analogous to the process of threat profiling and risk management.


    This experiment is also in contrast to current uses of Minecraft in education,
    of which I was very familiar with as a member of the Minecraft Education Edition
    Mentor team, a volunteer cohort of educators and technologists from across the
    globe. Traditionally, Minecraft has been used as an education tool to explore
    virtual worlds either related to a subject area (walking through an ancient city
    or scale model of Martian terrain, for example) or as a means of self-expression
    (build a small town) and teaching the very basics of software programming through
    the acclaimed Hour of Code (https://hourofcode.com) lesson series. MetaMinecraft
    is different because the desired result is less about what a student design in
    their game, and more about reframing the mental processes of Minecraft gameplay
    toward a specific goal. If successful, students will never play Minecraft the
    same way again, creating a positive feedback loop and reinforcing the lessons
    learned through the workshop experience.


    # # Videogames and Security


    Software companies like Google and others have recently started to create “edutainment”
    style game experiences that teach security concepts as well. For example, https://beinternetawesome.withgoogle.com/
    teaches students how to behave online, but these game experiences are somewhat
    lackluster. Unlike Minecraft, this is not a game that youth lose sleep playing
    or blame failing grades on because they stayed up too late at night playing.


    It is interesting to note that videogames, and especially the ones found in arcades
    before home consoles, predated the Internet as we know it today and for much of
    their history did not pose many security threats to consumers. In the earliest
    days, the physical security of an arcade cabinet and its ability to consume quarters
    from the pockets of eager bowling alley users in the 1970s was about as complicated
    as it got for most consumers.


    Videogame consoles made popular in the 1980s by Nintendo and Atari were also relatively
    risk-free endeavors for everyone involved. After the initial point of sale, there
    was not much information flow between game and publisher. This is'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'in stark contrast with modern online multiplayer videogame ecosystems which
    often not only include both an account and password to manage, but also credit
    card information for in-game purchases, weekly and sometimes daily content updates,
    security patches, game exploits, and complex social hierarchies and cultural norms
    to virtually navigate.


    # ## Post-World Wide Web


    Even during the 1990s with its mass proliferation of consumer electronic and first
    and second generations of home PCs becoming more widely available, many popular
    video games continued to be single-player experiences. This was in part due to
    the fact that the Internet just was not fast enough to enjoy playing a multiplayer
    videogame – the lag was too great, and the pings were too high. To get around
    this many videogame fans and community organizers hosted LAN parties where they
    instead built a high-speed network for a short time to facilitate gameplay.


    In the 2000s and beyond, the true potential of massively multiplayer online (MMO)
    games began to blossom with titles like RuneScape and World of Warcraft gaining
    broader media attention and awareness as Internet speeds improved and 3D graphics
    hardware became cheaper. These games are important to consider in terms of cybersecurity
    because they often introduced virtual economies which relied on real-world currency
    to function. For the first time malicious users had a real incentive to trick
    or swindle other players out of their hard-earned money – with auction sites like
    eBay and others becoming more popular, there was a growing black market for compromised
    accounts and items. Video games became a thing that not only consumed cash, but,
    if you “played” it the right way, could generate cash as well.


    For all these reasons it should be clear to see why it took so long for commercial
    videogames to find a foothold in classrooms, but through the popularity of MMOs
    and sudden rise in mobile gaming in the post-iPhone era, the need to educate youth
    about the risks associated with their favorite activity cannot be ignored.


    # ## The Cyberpunk Genre


    While the context of gameplay has changed dramatically over the past 50 years,
    it is worth mentioning that throughout this entire expansion of the industry there
    were games that touched on security topics indirectly through the science fiction
    subgenre known as cyberpunk. One of the earliest examples, Neuromancer (Interplay
    1988) was based on a novel by the same name written by William Gibson in 1984.
    Later examples include Deus Ex (Eidos Interactive 2000), Uplink (Introversion
    Software 2001), and Watch Dogs (Ubisoft 2014) all of which feature a style of
    point and click “hacking” as a game element but do little to educate players about
    Internet security – these are essentially role playing games which take place
    in a fantasy realm where technology is intentionally indistinguishable from magic.'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'Careful planning and risk remediation are not on the agenda when players can
    simply reload a save file. In these instances, security is most often presented
    as a temporary puzzle to be solved in the shortest amount of time possible; they
    are not training manuals or textbooks.


    Darknet (McNeill 2016) is one exception to the rule. This virtual reality game
    still uses puzzles as a main game element, but also uses a 3D network visualization
    overview as its primary interface. Players have the option of using viruses, worms,
    and 0-day exploits to traverse increasingly difficult network topologies in a
    way that is closer to reality than any other example previously mentioned. Like
    Minecraft, the game works well in an education setting because it is an attempt
    to simulate reality rather than amplify reality in a way typically of the cyberpunk
    genre.


    # Minecraft in Context


    Minecraft’s popularity and growth over the past decade, starting as a small side
    project by a single software developer and exploding into a cultural icon recognized
    by iPad wielding toddlers many years before they even poses the fine motor skills
    necessary to operate the game’s mobile app touch-screen interface, has allowed
    it to become the subject of close study across multiple disciplines (Nebel et
    al. 2016).


    Before we proceed, it is important to note that there are two important periods
    in Minecraft’s history to consider before engaging with past research. While the
    overall landscape of Minecraft in academia as it existed before Minecraft was
    famously acquired by Microsoft in 2014 for $2.5 billion, and the following tectonic
    shift in the Minecraft community this caused as a result is not as easy to see
    at the first glance. It is important to understand that while many gamers consider
    this time period before acquisition to be the “peak” of Minecraft’s popularity
    (reflected in search tools like Google Trends and more currently, in sappy nostalgia
    videos created by Minecraft fans on YouTube, more on that later), this was a turning
    point from a technical standpoint as well.


    Post-Microsoft, there was a major “cooling” period in terms of game changes and
    new features. Much like The Walt Disney Company acquisition of the Star Wars franchise
    from Lucasfilm in 2012, superfans were a bit apprehensive about the future of
    their favorite thing, and left to wonder if their fandom would survive. This was
    also an interesting period for Minecraft fans because it marked the kickoff of
    several data breaches in Minecraft community forums and multi-player servers (Hunt
    2019) and was also the end of a popular “fork” of Minecraft for education called
    MinecraftEDU developed by a third-party game studio (TeacherGaming 2019).


    In place of MinecraftEDU, Microsoft launched Minecraft Education Edition (MCEE)
    and, with that, brought integration with Office 365 for Education'
  merge: -1
  img_proc: true
- pgno: 115
  md: '(which, as of 2019, still offers a free tier or service for qualifying institutions)
    and an online portal for lesson plans and course material. MCEE not only disabled
    some features found in normal Minecraft, like the ability to host a dedicated
    server (users would now have to manage save files themselves) but also paved the
    way for new in-game abilities and features to make the game more user friendly
    for instructors.


    # Public Perception: The Key Ingredient


    With all of these market forces in play, any analysis of Minecraft for education
    would be incomplete without diving deeper into the subject (Willett 2018) but
    because this is not the focus of the project, I will quickly summarize my findings
    based on the San Francisco Bay area teen library community. It is pretty simple:
    tweens do not care, they play Minecraft because it is fun and easy to learn; however,
    as tweens age into teens, they may “grow out” of Minecraft or, perhaps more accurately,
    “grow toward” other videogames which feature more violent themes (e.g., Fortnite)
    that were previously unavailable to them due to their age or former levels of
    parental supervision.


    In my experience, because Microsoft has invested so much time and money focusing
    on the youth market through merchandising and annual events like MINECON, many
    teens and young adults identify Minecraft as something for kids. To put it another
    way, the game becomes categorically “uncool” and something “a younger brother
    plays.” At best, Minecraft may become part of an occasional nostalgia trip in
    the same way people enjoy rewatching old movies. At worst, a point of ridicule
    toward peers with opposite interest and an extension of cultural “gatekeeping”
    across the gaming community. Indeed, it seems the game has become a victim of
    its own popularity.


    # Finding the Right Game for Your Library


    From this, it is incredibly important to consider the fact that Minecraft, as
    a gaming platform, may not be the right fit for your community. In my experience
    as a video game enthusiast since the early 1990s, first acquainted with the Atari
    2600 game library and nearly every generation of video game consoles since then,
    gamers are oddly territorial about not just the type of media they consume (in
    terms of genre: strategy, role playing, action, puzzle, etc.) but also for what
    *reason* you are a fan and the peer group associated with it.


    From a practical standpoint, this is easy to understand in the context of face-to-face
    multiplayer games experienced in a computer lab setting. If everyone is already
    playing Roblox (https://roblox.com), one of the closest competitors to Minecraft
    in terms of gameplay style and intended audiences, one would have an uphill battle
    in persuading your classmates to switch to Minecraft. In an education'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'setting, this is relaxed a bit because students are happy to play a video game
    during regularly scheduled class time, period, but for libraries the biggest challenge
    is getting people in the door, or perhaps more accurately, persuading the parents
    of teens and tweens to schedule time to attend a cybersecurity-based workshop.


    # # What We Talk about When We Talk about Cybersecurity


    One of the biggest challenge educators face in the realm of cybersecurity boils
    down to the inflexibility of tech jargon. Often these words had historical underpinnings
    or were spun off from military terminology that seem out of place in a classroom
    of tweens. For example, in the early days of the web when most Internet-connected
    computers were bigger than your refrigerator, a network “port” was something you
    could point at and understand its functionality simply by looking at the array
    of empty network plugs in front of you. One could literally see how and why communicating
    through the same signal interface would create confusion for a machine, and the
    security benefit of closing ports that were not in use. Now, the idea of a network
    port is an abstract concept, thanks to the miniaturization of computer parts –
    half the battle is about making sense of this disjoined terminology. Similarly,
    addressing a room of tweens about the merits of intrusion detection systems (IDS)
    to stop a cyberattack in its tracks becomes much easier when the security practice
    is decoupled from the three- and/or four-letter federal agencies that coined a
    term. Citing NIST does not get us any closer to understanding layered security
    as a learning objective when your audiences’ top priority is protecting their
    XBOX account.


    On the other hand, the same students sure as hell get why you cannot just camp
    anywhere overnight in Minecraft without at least putting a door and four walls
    between you and the swarm of monsters than intend to blow up all their virtual
    stuff and ruin the work-in-progress sugar cane farm they are building on the other
    side of the in-game volcanic island that was just discovered. Presenting the same
    IDS scenario in this context might surprise you and, depending on their age, might
    result in a “Well, duh” reaction from seasoned Minecraft players – after hundreds
    of hours of seeing these security scenarios played out in a virtual environment,
    what they lack is not experience or insight, but the conceptual framework their
    older peers use to describe it.


    To illustrate this further, a team of researchers from multiple universities recently
    asked college age students to “think through” several cybersecurity-related questions
    in an effort to identify common misconceptions and problematic reasoning (Thompson
    et al. 2018). What this team of researchers found through a series of interviews
    (mostly) undergrads fell into four themes: over-generalization, conflated concepts,
    biases (physical, user, and personal), and incorrect assumptions. This is a highly
    recommended read because the research'
  merge: -1
  img_proc: true
- pgno: 117
  md: 'team also took tremendous care in how they set up their interviews and in explaining
    their methodology.


    # Overgeneralization


    This is the misapplication of an idea from one context to another, commonly happened
    in reference to passwords. Teens understand you should not share passwords. This
    is generally true, but an expert might point out that password sharing in some
    cases is necessary and there are additional security layers that can be put in
    place to mitigate the risk of password leaks. For example, a shared password that
    can be remotely revoked, reset, or expired after a certain amount of time is better
    than a permanently shared password that cannot be reset. Where a novice sees only
    one option or output, an expert can cite many alternatives.


    In the game of Minecraft, novice players tend to overgeneralize the strength or
    utility of different security elements, like walls, because their builds follow
    a formula. In some cases, a pit with a drawbridge is easier and more effective
    than high walls and doors. An expert is more context aware – they can read the
    total environment better.


    # Conflated Concepts


    This is similar to overgeneralizations but demonstrating a lack of deep understanding
    between two ideas. To state this more plainly, during focus group meetings I almost
    always had teens who were confused by the difference between security and privacy,
    and when prompted would often get the same answers for both. An expert understands
    the nuanced meaning between both terms, and why it is possible to have one without
    the other. My go-to explanation for librarians uses social media as an example:
    Twitter offers a secure sign in process, but the privacy of the service is much
    more about how you use it and the information contained in a given tweet or combined
    through a series of tweets. Similarly, Tor offers an anonymized IP address and
    greater browsing privacy but can be set up in an insecure way on a host machine.
    Understanding the difference between these two concepts is critical.


    # Biases


    In cybersecurity this is often related to specific brands or tech companies. Teens
    might identify specific phone manufacturers as more or less secure than others
    (e.g., Android vs iPhone operating systems) based purely on rumor or market speculation.
    Expert opinions have more weight because they attempt to remove bias, or at the
    very least acknowledge their bias upfront. Another great example came from the
    research article itself, in which these researchers interviewed'
  merge: -1
  img_proc: true
- pgno: 118
  md: 'a subject who distrusted Internet services originating from a particular country

    but could not cite exactly what was at risk compared to other nation states.


    # Incorrect Assumptions


    These are basic mischaracterizations of an attackers’ intent or capabilities.
    In the

    study conducted with college students, they were often “fixed” on a single solution

    to a security problem statement. For example, the goal of unauthorized access
    to an

    information system is not always about stealing or exfiltrating data, it could
    be as

    simple as data destruction. In my focus group sessions, this was less prevalent

    among teens than the previous four themes, but this is not unusual because

    individuals did not get a chance to explain their answers at length – assumptions,

    even when incorrect, are more likely to arise in detailed explanations.


    # Recommendations


    Of the four themes, overgeneralization and conflation were most prevalent in my

    sample group, often demonstrating familiarity with certain terms and security

    practices, but limited experience on the outer boundaries of their practical

    applications. By the third or fourth teen advisory group, it became very clear
    to

    me that this might be a result of how we often phrase security advice, out of

    necessity, into “sounds bites” that are easy to remember and digest, but lack

    substance. For example, it is generally true that sharing your home address with

    anonymous strangers online is a bad idea, but a deeper discussion about the

    process an attacker might use to piece together data points from different sources

    toward revealing or verify the accuracy of a home address does not fit on a poster

    at 72-point font size every October (corresponding with “national cybersecurity

    awareness month” in the United States).


    As a result of this research, Thompson et al. generally advised embracing

    complex security scenarios and real-world case studies. I think this is true for

    college age students, but not good advice for teaching teens and tweens about

    cybersecurity in a public library setting. At the undergraduate level and above,

    instructors are interested in using complex scenarios to help students essential

    “break free” from their preconceived ideas about how security works, but this

    approach requires some familiarity with cybersecurity concepts. Tweens have only

    just begun to scratch the surface of these concepts in their early years of Internet

    use. Recall that in theory, the Children’s Online Privacy Protection Act (COPPA)

    means administration of any online account is happening only under adult supervision

    before the age of 13. Secondly, library workshop audiences tend to

    have a much wider range of technical skill levels and socioeconomic factors to

    consider. Knowing your community becomes much more important in the

    context of cybersecurity education for the public because you can anticipate'
  merge: -1
  img_proc: true
- pgno: 119
  md: 'a much wider range of risk factors based on how they access the Internet, not
    just what they are doing online. Because the range of security experience is much
    wider with this group, it is to our advantage to equally address both sides of
    the spectrum and still provide a meaningful experience. Video games make this
    process much easier because we can all speak a common language.


    # Videogame Culture


    In planning a cybersecurity workshop in public spaces, it is also important to
    consider not only what topics should be covered, but also who you expect will
    attend. Previously, I alluded to this by referencing the wider range of skill
    level typically present in free or low-cost technology workshops versus academic
    settings, but market strategy goes beyond knowing your audience and should also
    consider competition.


    Pairing cybersecurity training with commercial video games is one way to “piggyback”
    on market trends and research of a billion-dollar industry. In the same way a
    hacker performing a spear phishing campaign on a high-level executive might do
    extensive research on their target before crafting the perfect fake email, you
    might also want to begin consuming the same marketing material produced by video
    game software developers, over time, to pick up on trends you can also use to
    promote your own content. For extremely popular games like Minecraft there are
    annual conventions, a wide range of official merchandise (and knock-off brands),
    plus hours and hours of community made YouTube videos to help you understand the
    mindset of your target audience. The Internet is big – even “niche” games coming
    from independent game companies have thriving online communities you can observe
    or, better yet, participate in. Rather than categorizing potential customers in
    classically defined, socioeconomic segments of the total population like “Gen
    Z” or “Gen X,” it might be more beneficial to think about fans of a specific videogame
    in terms of the mental processes involved in gameplay itself.


    # Ethnographic Research


    In Palo Alto our local Microsoft Store hosted a global livestream event in October
    which was full of inside jokes and humor aimed squarely at superfans. This was
    a solid gold research opportunity in terms of seeing first-hand how Microsoft
    communicates back to the Minecraft community, but also the emphasis on video streaming
    and minigames within Minecraft. It was also at such event when the realization
    that a large portion of our market strategy for this project should address the
    parent or guardian of a Minecraft fan, not just youth who play the game. No one
    was walking to this mall on a Saturday morning to watch a livestream event at'
  merge: -1
  img_proc: true
- pgno: 120
  md: '9 AM without some extra help. Clearly this target audience was getting a ride
    to and from the mall (with perhaps a pitstop at Starbucks to refuel mom or dad
    on the way). It also seemed pretty clear that, on some level, Minecraft was recognized
    as being a generally good influence. “Kid tested, mother approved” as the low-sugar
    cereal commercial once said.


    While not every videogame is as popular as Minecraft, there is undoubtably an
    online community or subforum somewhere full of hundreds if not thousands of players
    who are willing to answer questions about the game you are thinking about using
    for education outreach or provide general help. Go out and talk to them! Find
    out what they like and do not like about the game. Though controversial because
    of its association with highly targeted online marketing campaigns and presidential
    elections, the study of psychographics versus demographics is incredibly useful
    in this case because we are interested in matching an education experience for
    a specific type of thinker based on a specific type of game (Godin 2018).


    # What about Fortnite?


    No discussion of Minecraft in 2019 would be complete without contrasting the sandbox
    game with its contemporary, Fortnite. So here we are. If 2014 was the year of
    Minecraft, thanks to the added media coverage due to Microsoft’s billion-dollar
    acquisition of the game, then 2018 was the year of Fortnite, with countless news
    articles and blogs citing the popularity of the game, simultaneously amplifying
    its reach through mass media while at the same time warning parents about the
    impact it has had in classrooms. One could argue “Peak Fortnite Panic” occurred
    in early December 2018 with USA Today’s click-bait-style article titled ‘This
    game is like heroin’: Fortnite addiction sending kids to gaming rehab in behavioral
    specialist Lorrine Marer is quoted comparing videogame addiction to substance
    abuse (Haller 2018). This quote from a news article in late November published
    in Bloomberg was later picked up by several other news publications as well, including
    the Washington Examiner, Chicago Tribune, Boston Globe, and Forbes Magazine (Feeley
    & Palmeri 2018).


    Throughout this project many librarians were well aware of the rising popularity
    of Fortnite and ongoing competition in the hearts and minds of youth who play
    Minecraft. Fortnite presents several challenges in the context of education and
    outreach in public libraries, but to be clear, it is not off the table entirely.
    From a marketing perspective, the “viral” popularity of the game cannot be ignored.
    From a cybersecurity training perspective, Fortnite lacks several key features,
    like the ability to host your own server or install your own game mods, which
    make the “meta” elements of MetaMinecraft more interesting because through this
    metadiscussion an instructor can talk not only about game itself but also the
    surrounding software development mod community and the risks therein.'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'The rapid pace of Fortnite gameplay and emphasis on player versus player battle
    also makes it difficult to examine closely. Accomplished players have fast reflexes
    and good instinct, unlike Minecraft’s slower paced resource finding and block
    by block building dynamics. Yes, both games feature fort building, and there is
    where much of the comparison comes from, but Minecraft builds can take hours,
    days, or even weeks to complete and requires careful planning and resource management,
    whereas an entire Fortnite match can happen in 10 minutes. Up until early December
    2018, Fortnite also lacked a game mode where users could build and play in peace
    for as long as they wished. One thing both games have in common and is a topic
    I suggest readers might want to consider exploring further is the prevalence of
    illegal game “hacks” or cheats in both communities. These are typically programs
    which run in the background and promise to grant the player special in-game abilities,
    like seeing through walls or automatic aiming of a weapon giving them superhuman
    accuracy and control. What is concerning about these applications, apart from
    the risk of being permanently banned from either game if caught using them (or
    legal action from the game developers themselves), are the instructions often
    paired with these programs, which sometimes suggest disabling any antivirus applications
    before installing or making specific changes to system files in order for the
    “hack” to work. What percentage of users that instead of hacking the game they
    want to play are instead hacking themselves, we may never know, but anecdotal
    evidence suggests this is a widespread means of propagating keyloggers and remote
    access Trojans on unsuspecting victims who are also disinclined to report the
    source of their computer problem because in doing so they would also reveal their
    intent to cheat.


    # Flipping the Equation: Gamified Cybersecurity


    Commercial video games which not only support an education experience but also
    work as standalone games have a competitive advantage over games designed to be
    educational experience because potential students are already familiar with how
    they work and are more likely to participate or simply gain more from the experience
    because their favorite game is represented. This is exactly what made Minecraft
    offshoots like MinecraftEDU and later Education Edition popular, and in recent
    years more and more educators have been leveraging the power over commercial video
    games for this purpose. Indeed, there is now a cottage industry of education professionals
    who review commercial games online for this explicit purpose and categorize their
    potential toward different learning objectives. One such project, iThrive Games
    (https://ithrivegames.org), under the direction of social psychologist Susan Rivers,
    PhD, features an online Curated Games Catalog which anyone can freely browse online
    and includes reviews split into four learning categories: empathy, curiosity,
    growth mindset, and kindness.'
  merge: -1
  img_proc: true
- pgno: 122
  md: 'This is all wonderful news, and perhaps serves as an indicator that mindset
    of what makes for an effective classroom is changing rapidly. However, unlike
    a traditional classroom, where students are already present and are perhaps motivated
    to play *any* video game if their alternative is lecture based or noninteractive,
    there is some additional effort to get people to attend afterschool programs or
    weekend workshops in a public library. As a result, we need to think carefully
    about intrinsic (e.g., “I signed up to be here because I wanted to be here or
    had a desire to learn”) versus extrinsic (e.g., “I’m here because I must be here
    or need a grade to pass”) motivation. As one librarian phrased it in a PLP survey
    response, “what would make them want to come?”


    We can shed some light on this idea by looking at two examples of gamified education
    experiences that very successfully did the opposite: the creation of original
    games which are simultaneously entertaining and educational, rather than one following
    the other. The first example was very recently launched by the Electronic Frontier
    Foundation (https://eff.org) and combines the virtual reality 360-degree panoramic
    view of Google Street Maps with a *Where’s Waldo* approach to understanding the
    prevalence of surveillance cameras in urban areas, simply titled *Spot the Surveillance*
    (Maass 2018). The second example documented by blogger Matthew Farber for the
    National Public Radio KQED Mind/Shift blog describes an ARG or “alternative reality
    game” developed by two high school teachers called *Blind Protocol* (Farber 2018).
    This one is particularly interesting in the way it uniquely uses student collaboration
    taking place *between* different media formats rather than fixed in a specific
    medium or game space.


    What makes these projects successful from a commercial gaming perspective is less
    about the content delivered and more about their process-based, trial-and-error
    approach to learning. *Spot the Surveillance* players are given very little instruction
    in terms of how to identify cameras or incentive to “win” the game. The takeaway
    message is clear though: cameras are everywhere, and they are not just recording
    traffic. In *Blind Protocol* students find a series of clues which unlock a story
    line, sent to them by a mysterious hacker whose intentions are unclear. They may
    go off course in the process because it is unstructured, but this is a feature,
    not a bug. The learning process is about teamwork, critical thinking skills, and
    how to combine disparate pieces of information to form a larger whole. These are
    prime examples of “learning by doing” rather than learning by hearing or seeing.


    # Practical Applications and Lessons Learned


    Before jumping in to game-enhanced learning, it is important to consider how this
    compares to other eLearning modes (video tutorials, learning management software,
    etc.) not only from the instructor perspective, but from the student’s perspective
    as well. One of the biggest weaknesses in Minecraft-based lesson plans'
  merge: -1
  img_proc: true
- pgno: 123
  md: 'is the ability of the instructor to “speak Minecraft” with students and draw
    parallels between the game world and reality. This, unfortunately, does not happen
    overnight. It means spending at least a couple hours in-game to understand *why*
    threat modeling fits so well. This is no different than any other science discipline,
    where line drawings on chalk boards are often used to represent high-level ideas
    on a microscopic level. Without fluency in these concepts, or having run the same
    experiment before, it is difficult to further illustrate those ideas with words.


    From the student perspective, it is difficult to say if your lesson plan has worked
    because the true test is not about answering an essay prompt or filling out multiple
    choice questions, but will they recall the security advice or begin to apply the
    concepts you introduced at a later date. Clark and Mayer suggest there are five
    “promising features” that computer games offer over traditional eLearning modes
    (2016). Fully utilizing these elements are in many ways the “secret sauce” of
    game-based instruction.


    # Coaching


    The instructors’ ability to provide “over the shoulder” advice before or after
    students (or a group of students) make a move or implement a design idea can create
    a positive feedback loop for the entire class. Highlighting novel approaches as
    they happen is a great way to spark new ideas and can generate discussion topics
    organically.


    Coaching can also take place before gameplay even begins; in the same way sports
    team might review a video recording of their competitor, we can review fort designs
    posted by the Minecraft community at large, and begin to critique their security
    efforts through the lens of threat modeling.


    # Self-Explanation


    This evidence-based principle suggests that memory retention is enhanced when
    the “flow” of gameplay is maintained. When compared to control groups that were
    asked to type out their reasoning while using a video game enhanced learning module,
    the test groups that minimized disruption during gameplay performed better than
    their peers.


    In this specific example, students were selecting answers from on-screen menus
    while in-game, which is not currently possible in Minecraft, but by designing
    the course in such a way that the student is given total freedom to decide not
    only what they are protecting in their Minecraft base, but also the complexity
    of their threat model and design, we help preserve autonomy and flow and their
    ability to self-explain.'
