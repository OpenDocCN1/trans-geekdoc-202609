  md: '# 12.4 Conclusion


    Security vulnerabilities in software products are an increasing concern to organizations,
    developers, and, of course, consumers. Ultimately, when data breaches occur, the
    consumers are affected, and so are the organizations that use those software products
    to conduct business operations.


    There is no doubt that the cost to an organization that releases software containing
    security vulnerabilities is very high. Avoiding the introduction of such vulnerabilities
    requires awareness and commitment on the part of an organization that develops
    software products to secure software development practices (secure SDLC), as discussed
    in this chapter. It is expected that a software product developed using secure
    SDLC will cost more, and it will impact the project schedule, but this is much
    better than paying the high costs of software breaches later. An organization’s
    reputation is also affected by such events and that is also important to consider.


    It is important that developers are knowledgeable in known security vulnerabilities
    so that they can avoid writing code that is exploitable. We also know that the
    sooner a vulnerability is discovered, the easier and cheaper it is to fix it,
    as discussed in section 12.3.3. Adopting a secure SDLC that considers security
    at every stage of development contributes to the early identification of potential
    vulnerabilities. This chapter discussed secure SDLC, including discussions on
    the activities at each phase of the development cycle. Developers need to have
    a sound understanding of threat modeling, secure designs, secure coding practices,
    and security in testing in order to minimize security bugs and efficiently develop
    secure applications.


    Software developers must make the extra effort and time to improve the security
    of software products by insisting on security by design. I am aware that this
    will increase the costs and schedules of software products. One of the challenges
    software development organizations have been facing for decades is delivering
    working software that meets the customer requirements on time and on budget. Budgetary
    constraints and market forces, for example, sometimes force companies to reduce
    the amount of time dedicated to testing, which implies that the cost of maintenance
    will be higher because ultimately more bugs ship with the software and will have
    to be dealt with during the production stage of the software. Such bugs could
    be vulnerabilities that increase the risk of using the software. Senior management
    in software development organizations must embrace and champion the “secure by
    design” philosophy for their software products. It will cost a bit more and take
    longer; but more successful software development companies are those that develop
    quality and secure software that meets the users/stakeholders’ business requirements.


    Today’s business environment is characterized by regular data breaches. These
    data breaches are very expensive to the enterprises that are attacked. After such
    attacks, customers lose trust and run with their money, resulting in a huge negative
    impact to the organizations that were attacked. This includes damage to the organization’s
    reputation and possible violations of regulatory compliance. For these reasons,'
  merge: -1
  img_proc: true
