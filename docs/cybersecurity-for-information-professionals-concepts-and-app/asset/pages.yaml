    # Data Confidentiality


    Digital tools hold a lot of promise in terms of empowering individuals to take
    control over their personal data. However, there is a significant gap in terms
    of practices around different groups. For example, collecting data about vulnerable
    populations by humanitarian organizations may not adequately address the possible
    implications of collecting and using data about such populations (Vannini et al.
    2019). Depending upon the importance and sensitivity of the data being shared,
    this may be especially critical for marginalized individuals, such as students
    and undocumented or irregular immigrant. Similarly, the use of the digital tools
    increases the probability that a patron’s data confidentiality may be violated
    as well. Anytime a patron utilizes any technology in a cultural heritage institution,
    he or she also should feel confident his or her data will also be kept confidential.
    Such confidentiality is vital so that patrons medical history, financial research,
    and religious preference are not exposed and coupled with his or her name, lest
    the public discover personally sensitive data about specific patrons. If such
    confidentiality is breached, basic tenants of all cultural heritage research institutions
    are eroded and patrons are likely not to return and utilize technology that helps
    them'
