- pgno: 285
  md: '# Chapter 12


    # Cybersecurity in the Software Development Life Cycle


    Johnson Kinyua, PhD


    College of Information Sciences and Technology, The Pennsylvania State University


    University Park, PA, USA


    # 12.1 Introduction


    Many organizations use software development processes to create software products,
    and these include developers of major enterprise software packages, firms implementing
    commercial off-the-shelf software (COTS), and custom in-house development. Developing
    a large software product is a complex process and to increase the chances of success
    organizations should use some standard software development methodology. There
    are indeed a number of variations in approaches to the development of software,
    which are normally called software development methodologies or software development
    life cycle (SDLC) models. The range of software development life cycle models
    includes the waterfall model, agile software development, scrum, rapid application
    development, joint application development, and the spiral model (Royce 1970,
    Boehm 1988, Phlegger and Atlee 2010).


    Within these life cycle models, there should be variations that should meet an
    organization’s software development needs. Many of the life cycle models are built
    around the traditional waterfall model, which we discuss in section 12.2. The
    waterfall model is used extensively, especially in the development of large enterprise
    software'
  merge: -1
  img_proc: true
- pgno: 286
  md: 'systems. It is important to note that these models vary in end-user involvement,
    budget, and project implementation time. Traditional software development methodologies
    do not normally integrate security into the software development process, although
    this has been changing over the years (Alberts et al. 2003, Mead, Hough and Stehney
    2005, Kissel et al. 2008, Noopur 2013, Yuan et al. 2014). Traditionally, life
    cycle models are focused on creating software to meet the functional and nonfunctional
    requirements of users. More recently, these life cycle models are being augmented
    to integrate security at each phase, adding protection to software (Kissel et
    al. 2008). There are also attempts to integrate security into design and testing
    techniques, secure coding best practices, and other cybersecurity practices across
    the curriculum of computer science programs in the context of IoT systems (McManus
    2018). Security is no longer a requirement that should be baked into the software
    after the fact. Indeed security should be considered to be an important functional
    requirement right from the start.


    In order to understand how security can be built into the software product, it
    is necessary to have an understanding of software development methodologies. In
    section 12.2 we briefly discuss various software development methodologies. In
    section 12.3 we provide details on integrating security into software development
    in the context of SDLC. The conclusion is provided in section 12.4. It is noteworthy
    that all the software development methodologies discussed in section 12.2 did
    not traditionally integrate security in any of the phases. It could, however,
    be argued that the risk analysis step in the Spiral Model (Boehm 1988) could be
    interpreted in a security context, although the model does not explicitly state
    so.


    With the onset of the Internet, we have seen an exponential growth in the use
    of the Internet for e-commerce, the Web, email communications, web-enabled enterprise
    information systems, social media, and the Internet of Things (IoT). Building
    secure software gradually became a primary concern. The need to build secure software
    was further exacerbated by the phenomenal growth in the frequency and severity
    of cyberattacks. Today, the cybercrime ecosystem is a $1.5 trillion dollar industry
    that costs the US economy alone $57 to $109 billion per year (Advisers 2018, O’Connor
    2018). The need to build more secure software is therefore beyond debate. Initial
    attempts to secure software developed using the traditional insecure methodologies
    consisted of “bolting on” security to an application after the fact or late in
    the development life cycle. This is no longer an option and software must be secure
    by design. This is the philosophy adopted in section 12.3.


    # 12.2 Software Development Methodologies


    # 12.2.1 The Waterfall Model


    The waterfall model, also called the SDLC model, is the oldest and a popular software
    development methodology (Royce 1970). It consists of a number of'
  merge: -1
  img_proc: true
- pgno: 287
  md: 'phases where the result of each phase is called a deliverable, which flows
    into the next phase, as shown in Figure 12.1. The SDLC usually includes the following
    six phases: requirements analysis, system design, coding, testing, deployment,
    and operation and maintenance.


    After a phase is completed, the process moves to the next phase. In practice,
    it may not be feasible to work independently on each phase. It is usually required
    to revisit previous steps based on changes to the requirements or the need for
    improvements. Hence, in practice the model is iterative in nature because of the
    need to revisit previous phases.


    Prior to the system analysis phase, a system investigation or preliminary investigation
    is conducted. Some depictions of waterfall models include this as the first phase,
    although we have not done so. The need to build a software product usually emanates
    from a business opportunity or problem. The purpose of this investigation is,
    therefore, to assess or evaluate the IT-related business opportunity or problem.
    The system investigation is a crucial step because the outcome will affect the
    entire development process. A key part of system investigation is a feasibility
    study that evaluates expected costs and benefits and recommends a course of action
    based on technical, economic, organizational, operational, and time factors. After
    the system investigation, a decision is made on whether to proceed with the project
    or not. The process continues to the requirements analysis phase if the decision
    was to go ahead with the project otherwise further work ceases.


    During the requirements analysis phase, the functional and nonfunctional requirements
    of the software system are gathered, prioritized, and documented.


    ![](img/74778e0ca6379f5d5e4de83ac1ff23da_287_0.png)


    Figure 12.1 The Waterfall Model.'
  merge: -1
  img_proc: true
- pgno: 288
  md: 'The requirements define the scope of a project and must reflect the desires
    and needs of users and stakeholders and *not* developers. Unfortunately, requirements
    can and will change over the life cycle of a project, and this complicates the
    software development process.


    There are two types of requirements: functional and nonfunctional. The functional
    requirements describe what a software system will do, while nonfunctional requirements
    describe requirements not directly related to the services that the software will
    provide to its users. Examples of nonfunctional requirements include ease-of-use,
    user response time, software memory usage, reliability, and user interactions.
    Sometimes there is an overlap between functional and nonfunctional requirements.
    It should be noted that errors in requirements are among the most problematic
    and expensive in software development projects. This is because their effects
    cascade throughout the project, causing errors in later development phases. For
    example, an ambiguous or incomplete requirement might result in wasted design
    and development work, which in turn might lead to time spent testing software
    components that are not really needed. The deliverable of this phase is the system
    requirements document, which is also called the requirements specifications.


    The next phase is the system design phase in which the software components of
    the software product are created based on the requirements gathered in the previous
    phase. This effectively defines the technical design or architecture of the software,
    and this architecture describes *how* the system will solve the business problem.
    The deliverable of the design phase is the architecture that specifies


    +   - system modules

    +   - system inputs, outputs, and user interfaces

    +   - software, hardware, databases, networking, personnel, and procedures

    +   - module integration


    The deliverable for this phase is the system design specification, which should
    be presented to management and users for review and approval; this is required
    before proceeding to the next phase. The system design specification consists
    of a logical system design that states what the system will do, using abstract
    specifications, and a physical system design that states how the system will perform
    its functions with actual physical specifications. The system design specification
    will be used by programmers to transform the logical system design into program
    modules and code.


    During the implementation phase, programmers create the computer code for the
    new system based on the design specifications. Large systems development projects
    can require millions of lines of computer code, and many programmers organized
    into teams would be needed. These teams often include some key users to help programmers
    focus on the business problem at hand. The deliverable for this phase is software
    modules and associated documentation.'
  merge: -1
  img_proc: true
- pgno: 289
  md: 'During the testing phase, the software modules are tested to make sure they
    satisfy the requirements before the software is released into the production environment
    for use by the customers or users. Testing verifies that the code works correctly
    under various conditions, or tests are designed to detect errors or bugs in the
    code and subsequently remove them. Testing is time-consuming and expensive, especially
    if it is thorough. Inadequate testing, which can occur for a number of reasons,
    will lead to higher maintenance costs later. Inadequate testing may occur due
    to time-to-market pressures, reduced testing time due to schedule issues, project
    management issues that propagate to the testing phase, and so on.


    It is necessary to create a comprehensive test plan to conduct systematic testing
    of the software. The different kinds of tests that are performed on the software
    include unit testing, system testing, integration testing, and user acceptance
    testing. In unit testing, every module is tested alone in order to discover any
    bugs or errors in its code. In system testing, all of the modules that comprise
    the system are brought together and tested as a whole. With integration testing,
    various modules are brought together for testing purposes in order to verify that
    the interaction among them works as expected. With user acceptance testing, a
    relatively small group of users or other stakeholders are involved directly in
    the testing process. Users and stakeholders frequently have a very different point
    of view than developers or even testers. User acceptance testing should include
    unit testing or system testing. The intended outcome is a decision about whether
    or not the unit or being tested meets user and stakeholder requirements. All tests
    should be carefully documented and this becomes the deliverable of this phase.


    After the testing is completed, the software product is deployed into the production
    environment for business use by the organization. This is known as the deployment
    phase. After this point, the software product has entered the operation and maintenance
    phase. The software will be used by the owning organization to conduct business
    operations, and it is during this period that maintenance must take place.


    The software system needs different kinds of maintenance. From time to time, software
    errors that were not discovered and removed during the testing phase will occur
    during normal use of the software. These errors must be removed so that the software
    operates correctly and this continues throughout the life of the product. The
    second type of maintenance is updating the software to accommodate changes in
    business or operations or conditions. For example, a new government regulation
    might require a software update for the organization to stay compliant. These
    corrections and updates usually do not really add any new functionality because
    they simply keep the software functioning as required. The third type of maintenance
    is that which adds new functionality to the software by adding new features to
    the existing software without disturbing its operation.


    The waterfall model can be very useful in assisting developers in laying out what
    they need to do. Its simplicity makes it easy to explain to customers who are'
  merge: -1
  img_proc: true
- pgno: 290
  md: 'not familiar with software development because it also makes it explicit which
    intermediate deliverables are necessary in order to begin the next phase of development.
    Most other models are really just embellishments of the waterfall model incorporating
    feedback loops and extra activities. However, it should be noted that with the
    waterfall model, traditionally building secure software was not the intention;
    instead, the main consideration was to deliver working software to meet an organization’s
    business goals. This also applies to the other methodologies discussed in the
    following subsections.


    # 12.2.2 Agile Software Development


    Most of the software development processes proposed and used in the 1970s through
    the 1990s imposed some form of rigor in the way in which software is conceived,
    documented, developed, and tested. In the late 1990s, some developers who did
    not like this rigor formulated their own principles and highlighted the role that
    flexibility could play in producing working software in short periods of time.
    This gave birth to the Agile software development process codified through an
    “Agile Manifesto,” with four value statements or tenets and twelve principles
    (Alliance 2001, Amber 2012, Zain 2017):


    +   - Individuals and interactions over processes and tools. Teams organize themselves
    and communicate through face-to-face interaction rather than through documentation.

    +   - Working software over comprehensive documentation. The primary measure of
    success is the degree to which the software works properly.

    +   - Customer collaboration over contract negotiation. They focus on customer
    collaboration rather than contract negotiation, thereby involving the customer
    in key aspects of the development process.

    +   - Responding to change over following a plan. They concentrate on responding
    to change rather than on creating a plan and then following it because they believe
    that it is impossible to anticipate all requirements at the beginning of development.


    The principles of agile development are defined as follows (Amber 2012):


    +   1. Early and continuous delivery of working, valuable software

    +   2. Expect and embrace changing requirements

    +   3. Deliver working software frequently (every 2 weeks to 2 months, shorter
    is better)

    +   4. Developers and business people work together throughout the project

    +   5. Build projects around motivated individuals and support them

    +   6. Most effective project communication is face-to-face'
  merge: -1
  img_proc: true
- pgno: 291
  md: '+   7. Working software is the primary measure of progress

    +   8. Nurture sustainable development to maintain pace indefinitely

    +   9. Promote continuous attention to technical excellence and good design

    +   10. Simplicity is essential – do as little as possible while delivering value

    +   11. The best work emerges from self-organizing groups

    +   12. Regularly reflect on how to be more effective and adjust


    The Agile software development process is an iterative SDLC model typically used
    for small- to medium-sized enterprise projects. The essential idea behind the
    agile software development movement is that the focus of software development
