    # Data Fusion


    This section investigated how to combine and integrate multiple sources of behavioral
    measures to increase the performance and provide more accurate results. To do
    this, we use data fusion strategies in two different levels of our data analysis
    process, the feature level and decision level. Data fusion is the procedure of
    integrating data from numerous domains or sources to deliver more efficient and
    potentially more accurate learning than those produced by any of the single data
    sources (Hall & McMullen, 2004).


    We fuse the EEG and the ECG data collected from our participants during the same
    period of time. The goal is to find if there is any correlation between these
    psychophysiological measures while users perform malicious activities versus normal
    activities that can increase the detection performance. To do this, we used a
    canonical correlation analysis (Haghigat, Abdel-Mottaleb, & Alhalabi, 2016; Sun,
    Zeng, Liu, Heng, & Xia, 2005) over our EEG and ECG feature sets that were extracted
    from a specific time window and generated a new feature set that maximizes the
    correlation across the two feature sets. Canonical correlation analysis has been
    traditionally applied to examine relationships between two sets of variables (Hotelling,
    1936). It is described as the process of obtaining two sets of basis vectors,
    one for A and the other for B, that maximize the correlations between the projections
    of the variables in these basis vectors (Borga, 2001; Sun,'
  merge: -1
  img_proc: true
- pgno: 274
  md: 'Zeng, Liu, Heng, & Xia, 2005). In this work, the result feature vector is generated
    by performing canonical correlation analysis over the synchronized EEG and ECG
    feature vector.


    For the non-signal psychophysiological measures fusion, we use the participants’
    eye-tracking, mouse, and keystroke dynamics data. We conduct the feature extraction
    process for both eye-tracking data and mouse and keystroke dynamics data independently
    for the same participant. However, this process should be synchronized. In other
    words, the feature vector obtained from the eye-tracking dynamics data and the
    feature vector derived from the mouse and keyboard dynamics data are extracted
    from the same time window (epoch). Then, both feature vectors are combined into
    one feature vector that represents the user’s non-signal psychophysiological behavior
    for that specific epoch.


    As we generate different modules that employ different psychophysiological measures
    and as each of the modules will have its own prediction results, a decision fusion
    is needed to combine the results and generate the final prediction. To do this,
    we use a majority voting technique (Zuev & Ivanov, 1999) that consolidates the
    decisions of multiple classifiers in one final decision. In this work, we have
    three modules represented by three classifiers, each one of them utilizes one
    psychophysiological measure. Namely, the EEG signal module, the ECG signal module,
    and the non-signal behavior module that uses the eye-tracking and mouse and keystroke
    dynamics data. We take the synchronized decisions from each module and feed them
    to our majority voting function as the following: Suppose that CEEG represents
    our EEG signals classifier, CECG represents our ECG signals classifier, and CNon-signal
    represents our eye-tracking, mouse and keystroke dynamics classifier. Then the
    final prediction is calculated as following:


    ```

    \(\widehat{P} = V(C_{EEG}, C_{ECG}, C_{Non-signal})\) (11.1)

    ```


    where V() is our voting function and \(\widehat{P}\) is the final prediction.
    For example, assuming that we combine our three classifiers that classify synchronized
    training samples as CEEG = 0, CECG = 1, CNon-signal = 1, the voting function \(\widehat{P}
    = V(0, 1, 1)\) and the final decision will be = 1.


