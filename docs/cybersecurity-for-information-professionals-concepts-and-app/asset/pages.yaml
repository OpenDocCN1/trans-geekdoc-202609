  md: '# Chapter 7


    # Providing Open Access to Heterogeneous Information Resources without Compromising
    Privacy and Data Confidentiality


    Daniel G. Alemneh and Kris S. Helge


    University of North Texas USA


    Texas Woman''s University USA


    # Introduction


    It is a well-accepted fact that emerging trends in technology (such as the rapid
    growth of mobile devices and cloud computing solutions) are changing the landscape
    and the way business is conducted in many organizations, including in cultural
    heritage institutions. Digital technologies provide scholars with access to diverse
    and previously unavailable contents that span various formats and myriad technologies
    across'
  merge: -1
  img_proc: true
- pgno: 152
  md: 'institutions and nations. As noted by Janes (2018), the digital shift has been
    upon us all for some time now, and the issues and realities are getting deeper
    and more complex as library service continues to be transformed by the multifaceted
    changes already in place and others on the horizon. Although technologies such
    as automation, artificial intelligence, and machine learning already help to facilitate
    access and interactions with big data, such innovations can also increase risks.
    Data growth has reached explosive levels. As the legacy system simply cannot keep
    up with the pace of the digital transformation. Some of the concerns with big
    data applications relate to:


    +   - system security (e.g., protecting digital preservation and networked systems/services
    from exposure to external/internal threats);

    +   - collection security (e.g., protecting content from loss or change, the authorization
    and audit of repository processes);

    +   - legal and regulatory aspects (e.g., personal or confidential information
    in the digital material, secure access, redaction).


    This chapter will discuss challenges raised by concerns about ensuring long-term
    access to digital resources verses data confidentiality and balancing the right
    level of data security that addresses compliance requirements in the context of
    libraries and cultural heritage institutions.


    # ## Background of Open Access Movement


    The digital shift has challenged the status quo and existing values, and as a
    result data security is a critical imperative for all institutions. According
    to the 2018 Thales Global Data Security and Threat Report, the rate of enterprises
    that are encountering data breaches grew from 21% in 2016 to 26% in 2017 and now
    to 36% in 2018. Digital transformation requires new data security approaches.
    In fact, increasingly many nations are articulating and releasing their national
    cyber strategies. Accordingly, the White House published a comprehensive National
    Cyber Strategy in September 2018 detailing how the United States current administration
    aims to improve cybersecurity in government, critical infrastructure and the private
    sector, as well as tackling cybercrime and international issues.


    The open access (OA) movement is part of the broader “open knowledge” or “open
    content” movement that transforms scholarly communication. In reviewing the literature
    of the past few years, there is no shortage of views on the role of digital libraries
    and open access in facilitating digital access to knowledge by reducing barriers.
    Many researchers articulate a vision of a digital library environment that resonates
    with possibilities to create a knowledge management system that will enable scholars
    to navigate through these resources in a standard, intuitive, and consistent way.
    Many researchers including Alemneh and Hastings'
  merge: -1
  img_proc: true
- pgno: 153
  md: '(2006), and Verma (2018) agree that the new scholarly communication systems
    will inevitably be based on capabilities of interoperable network technology.


    As cultural heritage institutions embrace such digital environments, they are
    facing unprecedented pressures to ensure privacy and reduce the exposure of their
    institutions to all kinds of data-related risks. Escalating cyberattacks, together
    with the insider threats for data breaches, make balancing the open access aspirations
    of cultural heritage institutions without compromising privacy and data confidentiality
    challenging. In July 2018, the US National Academies of Sciences (NAS) released
    a consensus report titled _Open Science by Design: Realizing a Vision for 21st
    Century Research_, which lays out a vision for a fully open global science environment,
    and provides the following five specific recommendations for moving from vision
    to implementation:


    +   1. Research institutions and funders to work to create a culture that actively
    supports open science by better rewarding and supporting researchers engaged in
    open science.

    +   2. Research institutions and other entities to support the development of
    educational and training programs to support students and researchers in adopting
    open science practices.

    +   3. Research funders and institutions to develop policies/procedures to identify
    research outputs for long-term preservation and public access, and funding to
    be made available to support these activities.

    +   4. Funders and institutions to ensure that research archives are designed
    and implemented according to the FAIR (findable, accessible, interoperable, and
    reusable) principles.

    +   5. The research community to work together to advance open science by design
    in order to advance science and help science better serve the needs of society.


    # The Promise and Security Challenges of Open Access Big Data


    The term “big data” increasingly refers to the use of advanced data analytics
    methods that extract value from data. According to the 2018 Thales Data Threat
    Report, compared to traditional relational databases, the data generated and stored
    within big data environments can be orders of magnitude larger, less homogeneous,
    and change rapidly. There are a number of concepts associated with big data, including
    the three top attributes what are often referred to as the “Three V’s: Volume,
    Variety and Velocity.” Some experts (including Jain 2019; Van Rijmenam 2018) go
    on to add two more Vs to the list, variability and value. It would be difficult
    to define what these 5Vs mean in ways that can work in various contexts. When
    it comes to handling big data, different disciplines or'
  merge: -1
  img_proc: true
- pgno: 154
  md: 'organizations might use the same tools for collecting and manipulating the
    data at their disposal, but there are significant differences in how they use
    technologies to organize, analyze, interpret, and put the output data to work
    in general. The following brief description provides some points about the five
    Vs and their impacts on information professionals:


    +   1. Volume: Data is being produced at astronomical rates, and size in this
    case is measured as volume. As Cano (2014) noted, with the Internet of Things
    (IOT) and all kinds of smart devices that feed smart living, the sheer volume
    of the data continues to grow every second. No wonder 90% of all data ever created
    was created in the past two years.


    +   2. Velocity: In the context of big data, velocity refers to the speed at which
    huge amounts of new data are being created, collected, and analyzed in near real-time
    using various technological tools. Big data technology helps to cope with the
    enormous speed the data is created and used in near real time.


    +   3. Variety: With increasing volume and velocity comes increasing variability.
    Big data technology allows structured and unstructured diverse data to be harvested,
    stored, and used simultaneously (George 2017).


    +   4. Variability: It refers to the inconsistency, which is the quality or trustworthiness
    of the data. According to Van Rijmenam (2018), variability is the variance in
    meaning, or the meaning is changing (rapidly. In indexing the same term or word
    can have a different meaning. In the same way, to perform proper sentiment analysis,
    algorithms need to be able to understand the context and be able to decipher the
    exact meaning of a word in that context.


    +   5. Value: This refers to the worth of the data being extracted. Big data can
    create enormous value for the global economy, driving innovation, productivity,
    efficiency, and growth. Despite the size, unless big data can be turned into value,
    it is useless (cost-benefit). In other words, the value is in the transformation
    and how the data is turned into information and then into knowledge.


    Firican (2019) emphasized the importance of understanding the characteristics
    and properties of big data to prepare for both the challenges and advantages of
    big data initiatives. Some used the term complexity to refer to the complex process
    in which large volumes of data from multiple sources is collected, linked, connected,
    and correlated to be reliable in order to grasp the information that is supposed
    to be conveyed by in original data.


    # Unintended Consequences of Open Access


    Good intentions of open access may results in deleterious consequences. As mentioned
    earlier, most modern information institutions attempt to offer hosted data, information,
    and knowledge as openly as possible. Yet, such open access can'
  merge: -1
  img_proc: true
- pgno: 155
  md: 'result in data and information descending into the possession of sinister individuals.
    For example, copious libraries now offer data repositories for their researchers,
    faculty, and students (University Libraries, Data Repository Services 2018). Faculty
    place their raw data, both quantitative and qualitative, into such a repository.
    Uploading their data benefits faculty by assuring that it will be accessible to
    colleagues who may comment, utilize, question, and otherwise implement their raw
    data; their data will be preserved and safe from corrupt jump drives or personal
    drives; and their data will be harvested and visible globally. However, since
    these researchers'' data is globally accessible, danger of a data parasite obtaining
    and misusing this data is also possible.


    Data parasites are individuals who through little or no achievement of their own
    obtain other people''s data and use it maliciously to ultimately publish articles
    or other written documents, and fail to give attribution to the original data
    gatherers or creators. For example, data parasites will troll several different
    data repositories from universities, colleges, and other research institutions
    in hopes of gathering specific data about new technologies that could promote
    cleaner forms of energy for automobiles. They will then piece this data together
    and attempt to publish a paper or offer a conference presentation using the fragmentary
    data, while offering no credit to the original data gatherers (Longo and Drazen
    2016). Thus, they take credit for proposing some form of this new technology and
    convey it as their idea and research – a form of plagiarism (Helge and McKinnon
    2013). Such parasitic pseudo-research harms the original creators of the data
    and scientific research as a whole.


    Plagiarism of others'' data, information, and knowledge occurs frequently and
    for various reasons. Sometimes, researchers accidentally use another''s research
    and data without giving proper attribution. Other times, such as with data parasites,
    plagiarism is intentional. Such malevolent intent can occur because a student
    researcher simply believes he or she will not get caught in such a malicious act.
    Other reasons for plagiarism include not taking an academic course seriously;
    not understanding self-plagiarism, improper conceptualization of what common knowledge
    is; and not knowing how to accurately cite scholarship, research, and data (Helge
    2017). Dissertations and theses also often become the target of cybercriminals
    preying on academic informational institutions.


    # Intellectual Property Rights and Pirated Theses and Dissertations


    Many benefits arise when students and faculty place their dissertations or theses
    into an open access scholarship repository. Their research is instantly accessible
    to anyone around the globe; sharing their research globally results in personal
    and professional benefits; they have a permanent and convenient hyperlink with
    which to refer prospective employers, research collaborators, and other research
    entities; they may'
  merge: -1
  img_proc: true
- pgno: 156
  md: 'receive invaluable constructive criticism from many researchers globally; and
    other altruistic researchers have perpetual and efficient access to this invaluable
    scholarship (Abrizah et al. 2015). Despite these benefits, as with open data,
    negative ramifications may manifest with open access to dissertations and theses
    as well. Serving as a scholarly communications librarian at the University of
    North Texas, I was approached by a faculty member who had just obtained her Ph.D.
    from North American university. She deposited her recently completed dissertation
    into her university''s digital scholarship repository and was excited about the
    potential benefits of such a deposit. However, she discovered her dissertation
    had been pirated and was being sold in China. She queried whether anything could
    be done to stop the scholarship bootlegging. The response given to her explained
    that, unfortunately, legally not much could be offered. In the United States,
    one may be sued for copyright infringement and other intellectual property crimes
    when a dissertation is improperly reproduced, distributed, displayed, or when
    illegal derivatives are created within the borders of the United States of America
    (17 U.S.C. 2018). However, when such intellectual property crimes occur outside
    of the United States of America, such as in China, the US courts do not have legal
    personal jurisdiction to allow a prosecution to proceed, without proper extradition.
    Pennoyer v. Neff, 95 U.S. 714 (1878). Obtaining proper extradition from China
    is very cumbersome, especially for a stolen dissertation or thesis. So, at best
    for faculty or students whose dissertations or theses are stolen and sold, they
    should be happy someone is actually reading their scholarship.


    # # Internet Crimes Complaint Center (IC3) Roles in Protecting IP Rights


    Besides being elated someone is actually reading and paying money for their dissertation
    or thesis, victims of scholarship piracy may also file a complaint with the Internet
    Crimes Complaint Center (IC3) www.ic3.gov/default.aspx. IC3 is a branch of the
    Federal Bureau of Investigation and examines Internet-facilitated criminal activity
    (Federal Bureau of Investigation, Internet Crime Complaint Center 2018). There
    is no guarantee victims of scholarship theft will receive any equitable or monetary
    relief from filing a complaint with the IC3; however, filing a complaint with
    this federal entity could help in such recovery. Although it is difficult to legally
    punish cybercriminals who steal and misuse intellectual property outside of specific
    legal jurisdictions, some countries such as the European Union (EU) formed alliances
    and passed legislation that protects the use of certain individual data.


    # # Current Data and Information Laws


    To help assuage individuals'' fears of their data being misused in sinister guises,
    the EU recently passed legislation that directly addresses data misuse. In 2018,'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'the EU passed into law the Regulation (EU) 2016/679 of the European Parliament
    and of the Council of 27 April 2016 on the protection of natural persons with
    regard to the processing of personal data and on the free movement of such data,
    and repealing Directive 95/46/EC (General Data Protection Regulation (GDPR)) (Intersoft
    Consulting 2018). The GDPR regulates how specific individuals’ (e.g., student,
    medical patient, etc.) data (e.g., grade point average, medical diagnosis, etc.)
    is processed or utilized by an individual, or an organization in a professional
    or commercial guise (European Commission 2018). For example, the GDPR does not
    apply to a private individual utilizing home addresses and phone numbers of other
    individuals who live in the same neighborhood in order to organize a block party.
    However, a commercial organization that is collecting that same data along with
    data about the shirt sizes of all who live on that block, and that plans on selling
    that data to another commercial company, is regulated by the GDPR. The difference
    is that the individuals or entity whose motivation is to utilize the personal
    data for monetary purposes is regulated by the GDPR, whereas the private individuals
    using the data for personal noncommercial purposes is not regulated by the GDPR.
    Newly passed GDPR also grants to EU citizens many protections and opportunities
    to become aware of how their data is being utilized.


    # Impact of GDPR in Protecting European Union Citizens


    The GDPR grants to EU citizens many rights, which include to discover and have
    access to personal data other entities hold, be aware of the processing of one’s
    personal data, have incorrect data about an individual be corrected, have obsolete
    personal data deleted, object to the processing of one’s data for commercial purposes,
    request the restriction of some personal data, and to obtain personal data in
    a machine-readable format (European Commission 2018). Such regulation allows EU
    denizens the opportunity to be more aware of where their data is being utilized,
    how it is used, who is using it, what it is being used for, and for EU citizens
    to rightfully object, correct, and have more control over the use of their personal
    data. Ultimately, in information warehouses, such as libraries, this could help
    researchers, students, and other patrons become more aware of how their research
    data is being utilized, by whom, where, and also allot them more legal protections
    to reverse the use of data usage when their data is used for malevolent purposes.
    In fact, GDPR impact companies beyond user privacy. Article 33 of GDPR specifies
    that organizations must report a breach to the supervisory authority within 72
    hours of detection, detailing the nature of the breach, the approximate number
    of data subjects and personal data records impacted, the likely consequences of
    the breach, and measures taken or proposed to address the breach and its negative
    effects (Woods 2019). In the past few decades, not many countries,'
  merge: -1
  img_proc: true
- pgno: 158
  md: 'including the United States, have passed similar broad sweeping legislation
    that

    offers as much macrolevel protection.


    # Proposed US Model Statute for Data and Information Privacy


    In the United States, legislation passed offers more directed, microlevel protec-

    tions, targeting specific industries. Laws such as the 1996 Health Insurance

    Portability and Accountability Act (HIPPA), the 1999 Gramm-Leach-Bliley Act,

    and the 2002 Homeland Security Act direct healthcare entities, financial institutions,

    and federal agencies to ensure data and information systems are protected

    with a reasonable level of security. Such reasonable levels of security are usually

    satisfied via an entity tangibly displaying it has created and documented specific

    protocols, policies, principles, standards, and guidelines that reasonably protect

    and secure healthcare, financial, and/or other data, information, and knowledge.

    Such vague statutory language does not afford private citizens an opportunity
    to

    edit incorrect data, to know how one''s data is being utilized, by whom it is
    being

    utilized or to whom it is being sold, where one''s data is being transferred,
    and

    other microlevel uses of one''s data. Perhaps it is time for the US Congress to

    follow the example of the EU and create legislation that better empowers the

