- pgno: 136
  md: 'While there may be a need to protect personal data, the balance of this is
    contested across nations. The USA enacted freedom of information legislation in
    1966 and as such was an early proponent of providing citizen access to public
    sector information. Sweden has been a pioneer of freedom of speech and the press
    with censorship abolished as long ago as 1766. It is therefore not a coincidence
    that WikiLeaks, which campaigns for open data, is based in Sweden. Ironically,
    the United States has been a significant target for WikiLeaks attacks. More generally,
    open data campaigners have called for Open Government Manifestoes with data more
    automatically made publicly available.


    Globally national governments have legislated for different approaches to privacy
    and freedom of information particularly in respect of the parameters of the work
    of the security services. In 2013, Edward Snowden, who had been a USA Government
    employee within the Central Intelligence Agency, leaked classified information
    from the National Security Agency (NSA). The leaked information revealed a significant
    level of surveillance across citizens’ digital lives including their usage of
    cell phones, social media such as Facebook, and other software such as Skype.
    The intelligence gathered was deemed to provide a “pattern of life” which provided
    a detailed profile of individuals and their networks of association. The UK’s
    intelligence service was implicated in the surveillance. The targets of the surveillance
    were not limited to USA and UK citizens. The United States argued that all surveillance
    was in accordance with USA law and certainly legislation such as the Patriot Act
    2001 allows far reaching powers to be exercised to allegedly keep the USA safe
    from terrorist attack. Snowden is seen by some as a traitor, given that it is
    argued the intelligence services do need to operate in secrecy to be successful
    and keep the nation safe. However, others see Snowden as a valiant whistleblower
    and freedom fighter, as his leaks have been claimed to expose a significant level
    of snooping on all citizens. Following this incident, the German Chancellor Angela
    Merkel famously condemned the USA and UK surveillance stating in response to the
    incident that there should be “no spying among friends.” The USA Patriot Act has
    been challenged in other ways. In 2005 the so-called Connecticut Four (four librarians)
    filed a lawsuit Doe v Gonzales to challenge the powers of the Federal Bureau Agency
    under the Act, which was claimed to provide for access to libraries’ patron reading
    records. In essence, this debate was about whether an individual should be judged
    and in part tried based upon what they read. In 2006 the USA Government gave up
    this battle and in 2007 the “Connecticut Four” were honored for their stance by
    the American Library Association.


    The expectations for state intervention in overseeing citizens’ lives through
    monitoring of their digital data are highly contested; it is at the heart of the
    moral agenda delivered by IG in terms of ensuring balanced information delivery.
    Recently there has been international criticism of China by freedom campaigners
    regarding the so-called Sesame credit which scores citizens for their online'
  merge: -1
  img_proc: true
- pgno: 137
  md: 'behaviors including providing points for not only personal behavior but the
    behaviors of those within a citizen''s digital networks. Good behaviors, such
    as the purchase of Chinese goods or online educational study, may be rewarded,
    while bad behaviors, such as online gaming, may be punished, for example, through
    either travel rewards or travel bans.


    The Chinese Government does take a differing stance on some aspects of state control.
    As cited by Zeng et al. (2017), the Chinese President Xi Jinping''s address to
    the Beijing sponsored World Internet Conference in Wuzhen in 2015 indicated China''s
    position that the Internet should be governed according to the same principles
    as other fields of international relations whereby Internet sovereignty is provided
    for and respected. As such nations, would in accordance with this, control and
    regulate their own cyberspace. In a world where cyber warfare presents real challenges,
    the ability to manage boundaries in cyberspace may become more accepted. Cybersecurity
    relies on national values for determining the protections and processes put in
    place around different types of information as opposed to opening up and creating
    trust across boundaries.


    As technologies have advance, there have been new areas of contention. The ability
    for humans to understand and account for new technologies is complex. With the
    advancement of robotics, autonomous vehicles, machine learning, and artificial
    intelligence (AI), who holds responsibility for the actions of technology is being
    gradually defined in law. In the context of these technologies the role, decisions,
    and accountability in terms of human interventions are being further worked through.
    As new forms of technology emerge with biological components and increasingly
    sophisticated systems, the boundaries between human rights and “personhood” are
    a further area of contest. In 2017, the EU Legal Affairs Committee argued for
    the potential for AI and robots to have the status of personhood. However, this
    concept is as much about assigning responsibility away from individuals. Limited
    companies have legal personhood with legal responsibility. Nevertheless, there
    are boards of people with culpability for decisions if not financial payment.
    We are still working out:


    +   1. What is a person and what are the rights that assign to “personhood”?

    +   2. What are the responsibilities that assign to “personhood”?

    +   3. Where are the boundaries and laws required between human and machine?

    +   4. How are robots and AI understood and accountable?

    +   5. How can/should these technologies be deployed?


    In the latter context we see already the debates around surveillance but also
    with regard to AI predictive technologies and what they should be allowed to calculate
    or assume.'
