  md: 'spending more effort, time, and money is well worth it in the long run. In
    future, robust and resilient cyber defenses are what will differentiate the more
    successful organizations from the less successful ones. However, we must always
    remember that deploying secure software applications alone is only part of the
    solution to defending cyberspace. The core pillars for robust and resilient cyber
    defenses include secure software (by design), user/customer training and education,
    and risk-driven management practices.


    # Further Readings


    Readers interested in learning more about secure software development can refer
    to the sources listed in this section. The OWASP Secure SDLC Project website provides
    regular updates on any developments in this area (OWASP 2018b). Nikolaenya (2017)
    provides a useful guide for secure software development stage by stage. Othmane
    et al. (2014) have discussed proposals for extending the Agile development process
    with security engineering activities.


    The Software Assurance Forum for Excellence in Code (SAFECode), a non-profit organization,
    regularly publishes on different aspects of security processes and practices in
    order to advance software assurance methods and positively impacts the security
    and reliability of the technology systems (SAFECode 2018b). It hosts many publications
    based on the experiences of its members, but one publication of interest is the
    paper titled “Fundamental Practices for Secure Software Development” that includes
    updates to the fundamental practices to reflect current best practices, new technical
    considerations, and broader practices now considered foundational to a successful
    Secure Development Life Cycle (SDL) program (SAFECode 2018a). The third edition
    of the paper was published in March 2018. This paper is an excellent source of
    best practices and new technical considerations. Scanlon (2018a, 2018b) has provided
    excellent discussions on ten types of application security testing tools, and
    decision-making factors for selecting application security testing tools.


