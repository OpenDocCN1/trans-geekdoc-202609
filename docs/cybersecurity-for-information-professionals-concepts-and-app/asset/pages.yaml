    even when they involve emotion or stress.


    # Analysis of Non-signal Psychophysiological Measure and Results


    In this section, we analyzed the eye tracking and the mouse and keystroke dynamics
    data from our main experiment. The Tobii Pro eye-tracking device captures the
    eye gaze locations on the screen (x,y) coordinates, and produces raw data at a
    sampling rate of 60 times per second including the saccade, fixation locations
    (x,y), and pupil diameter. We analyze the raw samples to extract the features.
    We sample the eye-tracking raw data into 10-second time frames (epochs), each
    time frame representing one feature vector. We extract all possible features from
    the eye-tracking data: the movement features, which can be categorized as spatial
    and temporal features, as well as the pupil features.


    We obtain a total of 38 movement features and 8 pupil features that include temporal
    features such as the saccade and fixation duration, the pairwise speed and acceleration,
    spatial features such as the pairwise distance, the distance from the'
  merge: -1
  img_proc: true
- pgno: 268
  md: 'center of the screen, and the direction of saccades. We also consider the frequency
    of eye blinking, and the saccades and fixations frequencies. For the pupil''s
    data, we obtain the pupil diameter and apply statistic measures such as the minimal,
    maximal, mean, and standard deviation of the diameter. The same statistics were
    applied to the eye movement features. Since we use classification to distinguish
    between malicious and benign activities, we need to ensure only good-quality features
    are used in order to achieve a good accuracy. Therefore, using feature selection
    techniques and choosing the best feature set is an essential process before doing
    the classification. In our approach, we choose three feature selection algorithms
    to choose a group of best-quality features: forward greedy search algorithm, backward
    greedy search algorithm, and information gain feature evaluation algorithm. We
    combine the three feature selection techniques to evaluate the features and select
    the best, as a result, we reduce our feature set from 46 to 17 features which
    are selected as best features.


    # Malicious Activity Detection on Eye Tracking Data


    After completing the experiments for all participants, we organized the data into
    two groups as we explained in our main study experimental results section. We
    use the datasets from the first setup to evaluate the performance of our approach
    in distinguishing the malicious activities from the benign activities in general.
    The datasets from the second setup, on the other hand, we use to evaluate the
    ability of our approach in differentiating between the malicious activities and
    the benign activities performed under stress. The goal is to show that our approach
    is not only able to differentiate between benign behavior and the malicious behavior,
    but also can differentiate between benign and malicious behavior even when the
    benign behavior is performed under stress. After generating the datasets, we divide
    each one into a 70% tuning and training dataset and a 30% testing dataset. In
    particular, we split the ten-minute task time to seven minutes for training and
    three minutes for testing, and we disregard the last ten seconds of the seven
    minutes and the first ten seconds of the three minutes to ensure a good separation
    between the training and testing sets. We use the same classification algorithms
    in our main study experiment and consider each participant individually and generate
    a separate profile for each using only their data to train and test the classifiers.


    We use the dataset containing data from all experiment tasks (setup 1) to measure
    the performance of the classifiers. We run the classifiers for each participant
    two times. First, we use the complete feature set (the original 46 extracted features).
    Then, we run the classifiers again using the best feature set (the 17 selected
    features) and compare the results. Table 11.11 shows the results of our three
    classifiers (SVM, Random Forest, and k-NN). The top part of the table shows the
    average results over our 25 participants using the complete feature set and the
    selected feature set.'
