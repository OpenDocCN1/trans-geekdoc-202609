    # Effect of Horizon Technologies on Data Privacy and Confidentiality


    Many horizon technologies will soon affect library patron data privacy and confidentiality.
    One such technology currently being experimented with is termed sixth-sense technology.
    This technology interacts with digital world phenomena as a person gestures with
    his or her arms, hands, or other parts of the body in the physical world (Nuistr
    y 2009). Such a gesture could involve motioning with one’s hand and fingers to
    swipe from right to left to turn a page, pointing to an object to retrieve more
    information about it, or setting an object on a tablet to discover where similar
    items may be located. For example, a person may place a soccer ball on a tablet,
    and utilizing the sixth-sense technology, he or she could then theoretically locate
    all nearby physical locations where a soccer match was being played within the
    next two weeks.


    Another burgeoning technology that will be adopted by cultural heritage institutions
    is the IoT. IoT digitizes the physical world, and allows an information warehouse
    to digitally connect all of its electronic items and simultaneously'
