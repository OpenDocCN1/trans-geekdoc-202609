  md: 'User stories are “lightweight,” that is, short, textual narratives describing
    how one or more users or actors will interact with an envisioned or imagined piece
    of working software to accomplish some realistic goal. Generally, user stories
    should come from users, or at the very least from a designer’s discussion with
    a prospective user. In cases where this is not possible, the designer should assume
    the perspective of the user and imagine a realistic goal and the support the software
    will provide to help accomplish it. The entire set of user stories for a given
    software project suggests a set of features required to support the users’ goals.
    This set of features makes up the project’s product backlog. The product backlog
    is, in essence, all of the development work that needs to be done in order to
    construct a complete software product.


    The core deliverables in a Scrum consist of those shown in Figure 12.2 and are
    produced in the order suggested in the diagram.


    Note that the second of the four steps identified in the figure represents a decomposition
    of the preceding step. In other words, the Product Backlog decomposes the User
    Stories into a set of features to design, implement, and test. Each project sprint
    will decompose Product Backlog items further into the discrete tasks that will
    be performed as part of the sprint. Planning a sprint involves moving items from
    the product backlog to the sprint backlog and providing estimates of the effort
    required to complete each item in the sprint.


