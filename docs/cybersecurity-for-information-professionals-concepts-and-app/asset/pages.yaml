  md: '# Chapter 10


    # Mobile Cybersecurity:

    A Socio-Technical

    Perspective


    Hsia-Ching Chang

    Department of Information Science, University of North Texas

    Cybersecurity Policy Fellow, New America


    # Introduction: From the Internet to Mobile Internet


    Mobile Internet, one of the disruptive technologies, has transformed the way people
    communicate, live, and work since the early 2010s (Manyika et al. 2013). As for
    mobile Internet penetration, the number of mobile-only users has surpassed that
    of desktop-only users since 2015 in the United States, and the trend has remained
    stable since 2017 (VPN Mentor 2018). A recent study by the Pew Research Center
    (2018) indicates that 95% of Americans own mobile devices among which 77% of them
    are smartphones and 50% are tablets. The wider popularity of smartphones is not
    surprising because unlike tablets, smartphones offer various ways of communication;
    they have changed how people do things and interact with others. Interestingly,
    based on eMarketer’s report, users spend more time interacting with smartphones
    and apps than with tablets and mobile web; apps account for more than 90% of time
    spent on smartphones (Wurmser 2018). The increasing number of smartphone users
    and their consumption in apps manifest the importance of mobile cybersecurity.
    The growing smartphone penetration also demonstrates that we are facing the challenges
    of preventing increased risks as users continue to install new apps in their mobile
    devices.'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'Verizon’s Mobile Security Index 2018 reports that mobile security threats are
    increasing; 79% of surveyed organizations stated that they considered their employees
    to constitute a greater threat than hacktivists, criminals, and partners. The
    risks could result from downloading vulnerable mobile apps or visiting malicious
    websites. This exhibits social sub-systems (i.e., people) and technical sub-systems
    (i.e., mobile technologies) co-existing in an organization; therefore, the socio-technical
    perspective emerges as we tackle issues of information systems and technologies
    (Bostrom and Heinen 1977). A socio-technical perspective refers to a balance between
    people and technology when accounting for technology development. Goode (2018)
    suggests the significance of embedding a socio-technical perspective in cybersecurity
    training and education. In this sense, considering the role of humans and social
    aspects of cybersecurity is equally important to technical aspects. Therefore,
    this chapter discusses mobile security from a socio-technical perspective to address
    humans and socio-technical systems instead of just technology. In the context
    of cybersecurity, human mistakes are inevitable and application vulnerabilities
    continue to emerge, which reinforces the importance of socio-technical cybersecurity.


    Organizations usually have different layers of protection in place to ensure cybersecurity.
    For instance, they apply encryption on data as the first step, install anti-virus
    software in every device, and deploy firewalls to block unauthorized access, deterring
    cyber criminals from performing attacks. It would be easy for cyber criminals
    to target individuals (employees, partners, and customers) affiliated with the
    organizations they attack. In the mobile environment, it would be even easier
    for cyber criminals to perform attacks and steal sensitive data, intellectual
    property, or top-secret information because employees and partners might use their
    mobile devices to access organization data that are classified as critical digital
    asset, and their mobile devices usually do not have strong security protection.


    The chapter is structured as follows. It begins by outlining the layers of the
    multi-stakeholder mobile ecosystem and the cyber threats within the ecosystem.
    Following that, the security and privacy risks of mobile apps for mobile devices
    are laid out. It then touches on mobile users'' security behavior and discusses
    the mobile security best practices. Finally, it concludes with the proverb “prevention
    is better than cure” and reiterates the importance of layered security to defend
    mobile security.


    # Cyber Threats in the Mobile Ecosystem


    Mobile devices like tablets and smartphones have a wide range of features that
    could increase the attack surface, such as sensors, audio, video interfaces,'
  merge: -1
  img_proc: true
- pgno: 225
  md: 'connectivity, data storage, and so on. Mobile security is not only limited
    to mobile devices, but also the operating system, network communication, and applications.
    In its study on mobile device security, the Department of Homeland Security (2017)
    identifies the key components when assessing the security of mobile devices: mobile
    device technology stack (e.g., mobile operating systems, firmware, hardware, and
    mobile applications); communication networks (e.g., cellular, Wi-Fi, Bluetooth)
    and network services; and device physical access. Figure 10.1 shows the key elements
    in a mobile ecosystem at a glance.


    As smartphones become one of the most popular personal mobile devices, various
    personal data as well as information are generated and saved in the smartphone.
    From the overview of the mobile ecosystem, the data and information in the smartphone
    can be leaked through multiple channels, such as the installation of mobile applications,
    mobile network connection, malware targeting hardware/firmware, and system vulnerability.
    Figure 10.2 illustrates several concepts that pertain to mobile security risks
    and their relationships. Vulnerabilities refer to weaknesses where a threat could
    occur by exploiting the vulnerabilities in a device or service, leading to potential
    risks.


    Serving as an industry-recognized vulnerability database, common vulnerabilities
    and exposures (CVE), maintained by the MITRE Corporation, is a shared repository
    housing entries of publicly known cybersecurity vulnerabilities freely available
    for businesses or organizations that provide cybersecurity-related products and
    services around the world. Compared to threats and risks, vulnerabilities involve
    more technical details that only IT security professionals would understand. Therefore,
    when communicating with average users, we usually focus on threats and risks to
    address cybersecurity issues. With the daily increase in the newly identified
    vulnerabilities, cybersecurity threats involve an ever-changing landscape. In
    the mobile ecosystem, hackers have tried to capitalize on vulnerabilities at different
    levels, including hardware, firmware, operating system, applications, networks,
    and so forth. Counter-measures need to be taken in order to mitigate the risks.


    The Department of Homeland Security divides the threats to the mobile ecosystem
    into five categories: (1) operating system/firmware threats, (2) application-based
    threats, (3) network-based threats, (4) physical device/access-based threats,
    and (5) threats to the mobile enterprise systems. Mobile enterprise systems refer
    to enterprise mobile services and infrastructure that comprise mobile device management
    and enterprise app stores. An organization that provides mobile device management
    can have an addition layer of security protection against potential threats. Although
    mobile enterprise systems are one of the key components in the mobile ecosystem,
    they are excluded as beyond the scope of this chapter. This chapter will focus
    on mobile security issues from a consumer’s perspective rather than an organization’s
    perspective.'
