  md: '![](img/74778e0ca6379f5d5e4de83ac1ff23da_227_0.png)


    Figure 10.2 The relationships among threat, vulnerability, and risk.


    # Threats in Mobile Technology Stack (Operating System/Firmware/Hardware)


    As shown in Figure 10.3, mobile technology stack represents a mobile device’s
    multiple technology layers consisting of the hardware, firmware, mobile operating
    system, mobile applications, and embedded components (e.g., sensors and SIM card).
    Vulnerabilities in any of these components may be targeted by threats. For instance,
    the memory corruption defects in firmware could be manipulated by the attackers
    to gain administrative access (Veracode 2013); therefore, the user must regularly
    update firmware to ensure the device remains up to date. Like desktops or laptops,
    the mobile devices have operating systems, such as iPhone OS (iOS), Android, Blackberry,
    and Windows. Modifying the mobile device configuration (e.g., jailbreaking or
    rooting a phone) is one of the major mobile threats,


    ![](img/74778e0ca6379f5d5e4de83ac1ff23da_227_1.png)


    Figure 10.3 Mobile device technology stack (Department of Homeland Security 2017).'
  merge: -1
  img_proc: true
- pgno: 228
  md: 'tampering, as it exploits the defects in the phone’s operating system (Department
    of Homeland Security 2017).


    # Physical Device Threats


    The causes of physical device threats include device loss or theft and malicious
    charging stations. The GSMA, an association that represents the worldwide mobile
    communications industry, provides security advice to mobile phone users on mobile
    phone theft (GSMA 2019b). Public charging stations available in the airports,
    subways, or hotels have become targets for criminals to launch charging attacks.
    Juice jacking, one type of charging attacks, can access personal data through
    a USB charger with data transfer capabilities without the user’s permission, or
    install malicious software on the device when the device is unlocked, while juice
    filming attacks, a more advanced charging attack, can do the same even when the
    phone is locked (Meng et al. 2015). Most users are unaware of the charging risks
    and trust public charging stations. Bekker (2018) provides several tips to protect
    mobile devices from juice jacking, including verifying the power source or using
    portable power sources instead, plugging one’s own cord into a wall outlet, or
    bringing power-only USB cords to help mitigate data transfer risks.


    # Network-Based Threats


    The network communication layer accommodates different types of mobile connectivity
    network, such as Bluetooth, cellular, Wi-Fi, near-field communication and services
    provided by mobile network operators (e.g., AT&T, Verizon, and T-Mobile). The
    data stored in the mobile devices can be intercepted in any network environment,
    from short distance within a wireless personal area network (WPAN) to medium distance
    within a wireless local area network (WLAN) to long distance within a wireless
    wide area network (WWAN).


    WPAN is designed to enable personal devices (e.g., smartphones, laptops, tablets,
    and wearables) to exchange data and communicate with each other in proximity.
    Bluetooth is one of the representative technologies and has become a connection
    feature in smartphones; however, as Bluetooth is easy to hack, it is therefore
    suggested that mobile users should not leave Bluetooth on unless they are using
    it.


    The data communication using WLAN, also called Wireless Fidelity (Wi-Fi), is commonly
    seen in offices, homes, and universities. The IEEE 802.11 working group has developed
    and extended the standards for WLAN, allowing longer-distance and a faster transmitting
    rate for data communication. Wi-Fi Protected Access 2 (WPA2), a Wi-Fi security
    standard, aims to use the Advanced Encryption Standard (AES) protocol (password)
    to prevent unauthorized access to users’'
  merge: -1
  img_proc: true
- pgno: 229
  md: 'wireless data. However, Mathy Vanhoef, a network security researcher, identified
    the WPA2 standard flaw and was able to hack Wi-Fi networks using a technique called
    key reinstallation attack (KRACK) (Vanhoef 2017). Wi-Fi Alliance is developing
    the next-generation Wi-Fi security, WPA3, to simplify and enhance Wi-Fi security
    (Wiggers 2018).


    WWAN goes beyond the borders of cities and countries when it comes to mobile communications.
    Mobile communication technology has gone through multiple generations, from the
    first-generation (1G) to the fourth-generation (4G). The third-generation (3G)
    of mobile communication standard has transformed the way people communicate using
    mobile phones. Adopting Internet protocol (IP) technology, 3G enables mobile devices
    to communicate not only through voice, but also through text, images, videos,
    and multimedia information. Additionally, voice over Internet protocol (VOIP),
    also called Internet phone, offers an alternative way of calling. With the Internet,
    mobile users can make phone calls using Wi-Fi calling apps, such as Skype, WhatsApp,
    Facebook Messenger, and Google Talk. According to the Skype website, the information
    (e.g., voice, messages, images, and files) exchanged between one Skype account
    and another Skype account via the Internet is encrypted. However, for calls made
    from Skype app through the Internet to mobile or landline phones, the communication
    over the telephone network is not encrypted.


    In June 2018, Skype added a new feature called “Private Conversations,” which
    provides end-to-end encrypted audio calls, text messages, images, videos, and
    files to prevent eavesdropping attacks (Skype calls 2018). Users need to update
    their Skype app to the latest version on their PCs or mobile devices in order
    to utilize this feature to make their communication data more secure.


    A mobile device, the primary endpoint in cellular networks, interacts with cellular
    base stations to send and receive information. 4G technology like Long-Term Evolution
    (LTE) has dominated the current cellular infrastructure; however, it is not completely
    secure as there are various cybersecurity threats to LTE hardware, software, and
    networks (Cichonski, Franklin and Bartock 2017). A mobile phone must send authentication
    data to the base station before making a call; therefore, a potential risk with
    mobile phones is the attack by fake base stations in LTE Networks (Al Mazroa and
    Arozullah 2015). In addition, it is difficult for mobile users to detect fake
    base stations. As the attackers receive the user’s authentication data through
    fake base stations, they gain unauthorized access to the cellular network. Once
    this scenario happens, short message service (SMS) One-Time-Password (OTP) sent
    by online banks is not as secure as we believe. The reason is that the OTP sent
    through SMS is not encrypted and can be intercepted by a hacker with a fake base
    station or performing Man-in-the-Middle attacks on mobile apps exploiting OS vulnerabilities
    (Grassi, Garcia and Fenton 2017). The security of SMS OTP greatly depends on network
    security. Requesting OTP through email or app might be more secure because most
    major email service providers and OTP authentication apps offer encryptions. According
    to'
  merge: -1
  img_proc: true
- pgno: 230
  md: 'NIST''s recent special report, Digital Identity Guidelines (SP 800–63), SMS
    OTP also faces the risk of social engineering.


    # ## Application-Based Threats


    As shown in the mobile ecosystem (Figure 10.1), the mobile Internet infrastructure
    is mainly supported by device vendors (e.g., Apple, Samsung, and Motorola) and
    OS vendors (e.g., Apple and Google) to provide security updates, App stores, data
    backup and cloud storage, and push notification services. A mobile application
    (or app) refers to “an application that runs on a mobile device and is context
    aware” (Arzenšek and Heričko 2014, 1); the nature of context-awareness results
    in privacy and security challenges in mobile application testing. The application
    layer is where the user directly interacts with the mobile information systems.
    Except for the pre-installed apps, users have the freedom to download and install
    the apps they prefer or need. A variety of apps allow users to do different things
    that involve managing sensitive personal information. Social media and networking
    apps enable users to share their status and real-time information at their fingertips.
    Users can use bank apps to pay bills or transfer money. They can also adopt health-related
    apps to monitor their sleep patterns or fitness information. Despite the great
    benefits that various apps offer, users must be aware of major application-based
    threats and know how to protect their personal data and information generated
    by using those apps from being manipulated by unauthorized parities. However,
    taking precautions against mobile threats does not seem to be a common practice
    across most organizations. For instance, two-factor authentication is a strong
    authentication method that adds an extra layer of identifying users as they login.
    OTP, a form of two-factor authentication, adds the “second” factor to the authentication
    besides the first factor, the account password. According to Verizon’s Mobile
    Index 2018, only 38% of organizations use two-factor authentication on their mobile
    devices. More than a quarter of respondents whose organizations do not provide
    mobile security training rated their users as having low awareness of mobile threats.


    Different privacy and security issues have been identified in distinct categories
    of mobile applications. Zlatolas et al. (2017) conducted a systematic literature
    review on academic publications that propose models illustrating privacy and security
    issues on mobile applications. They found that privacy variables appear about
    three times more often than security variables in academic publications from 2009
    to 2016. This is not surprising because mobile applications collect user data,
    and unauthorized secondary use could jeopardize a user’s security and privacy.
    Mobile cloud computing (MCC) apps move computation and data storage from mobile
    devices to cloud platforms; however, MCC applications face ongoing security challenges,
    such as authentication, authorization, data/code integrity (Wang, Chen and Wang
    2015).'
