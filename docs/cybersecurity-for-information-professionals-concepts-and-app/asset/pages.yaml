    that its platform can experience manipulation from malicious sources. Users on
    Twitter can be victim of bulk or aggressive disruptions through deceptive activities
    that include but are not limited to spams, bots, and fake accounts.


    # Social Media Phishing


    Phishing is the most common form of cyberattack even on social media platforms.
    Although phishing attacks are conventionally conducted by sending malicious links
    through emails, in modern days this attack has tremendously grown over social
    media sites. Phishing messages sent over social media sites are highly likely
    to be opened by users than those sent via regular emails (Seymour and Tully n.d.,
    3; Frenkel 2017). Phishing comes in forms of spear or whale attacks. In spear
    phishing, specific individuals or organizations are strategically victimized with
    recognition of enough trustworthy background information about them. In whale'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'phishing attacks, the phishers target top executives and higher officials with
    intentions of large form of fraud and embezzlement. Spear phishing is the fastest
    growing attack on social media primarily due to the networked architecture of
    the platform and lack of security trainings of users. The attackers send malicious
    links in harmless messages to the users in spear phishing attack (Figure 8.1).
    Even if one user in the entire network clicks the link the entire system gets
    affected by it. This practice is not limited within general hackers, but state-hackers
    also take the benefit of it. For example, Russian hackers entered Pentagon computer
    network through one of its official’s Twitter account (Frenkel 2017). The hackers
    sent infected summer vacation messages to the Pentagon official’s spouse’s Twitter
    account, which was later shared with the Pentagon official. Therefore, the breadth
    of phishing attack on social media is far-fetched. Government social media accounts
    are usual targets of spear phishing. For example, Iranian hackers attempt to attack
    US Department of State social media accounts (Frenkel 2017; Sanger and Perlroth
    2017), Russian-led hacking efforts of 10,000 US Defense Department Twitter accounts
    are classic spear phishing attacks (Calabresi 2017; Frenkel 2017).


    # Social Engineering


    Individuals and organizations can be victim of social engineering. Commonly, victims
    lose personal and sensitive information because of deceits. Some popular approaches
    of social engineering are phishing, quid pro quo or vishing, tailgating, impersonation,
    and baiting. While its attacks are quick, recovery from one incident is lengthy.
    Individuals need awareness about cybersecurity policies and guidelines in order
    to avoid social engineering risks. The organizations must train its employees
    with cybersecurity skills so that they can avert away any potential security risk
    for the company. Social engineering categorically can be executed in couple of
    ways – hunting and framing. Hunting is


    ![](img/74778e0ca6379f5d5e4de83ac1ff23da_176_0.png)


    Figure 8.1 Social media phishing phases.'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'more popular approach in comparison to farming method. In hunting process,
    victims notice negligible attentions and in farming process, the victim gets hooked
    for longer times.


    The malicious attacks intend to extract confidential information from individuals
    and organizations. Social engineering is even more dangerous than other forms
    of cybersecurity risks because it grows on the basis of trust. The victims are
    lured to believe information provided to them. The levels of deception are stronger
    with regard to its breadth, depth, and intention. These complex tasks are often
    performed with the help of regular tools and applications. Extensive coding skills
    are not always required for conducting social engineering.


    The core purpose of social engineering is to exploit victims and control access
    to their confidential information and resources (Conteh and Schmick 2016, 32;
    Breda et al. 2017, 2). In cybersecurity context, human targets are tempted to
    release sensitive information knowingly or unknowingly being affected by security
    breaches. It can be defined as the practice of provoking individuals or organizations
    for disclosing confidential information and network resources through the means
    of deceitful techniques either controlled by human skills or socio-technical tools.
    The attackers capitalize human trust and the tendency to make errors.


    # Social Engineering Attack Types


    The attackers use different types of resources including human and technical tools
    for the purposes of system exploitations. Cybersecurity risks on social media
    platforms take many forms. Those are accomplished either by reliance on entirely
    human involvements or by utilization of socio-technical tools. Based on these
    two different sources, social media cybersecurity risks are divided into two areas
    – in-person attacks and socio-technical attacks (Table 8.2).


    # In-Person Attacks


    Cybersecurity attacks that involve human skills largely are termed as in-person
    attacks. Popular in-person cybersecurity attacks are impersonation, tailgating,


    # Table 8.2 Social engineering attack types


    | In-Person Attacks | Socio-Technical Attacks |

    | :--- | :--- |

    | Impersonation | Phishing |

    | Tailgating | Vishing |

    | Dumpster diving | Vishing or quid pro quo |

    | Shoulder surfing | Eavesdropping |

    | Reverse social engineering | |'
