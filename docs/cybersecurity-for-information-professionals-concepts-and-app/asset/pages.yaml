    # 12.2.4 Scrum


    Scrum, which was created at Object Technology in 1994, uses iterative development
    where each 30-day iteration is termed a “sprint cycle” (Schwaber and Beedle, Agile
    Software Development with Scrum 2002). The sprint cycles are used to implement
    the product’s backlog of prioritized requirements where multiple self-organizing
    and autonomic teams implement product increments in parallel. Coordination is
    done at a brief daily status meeting called a “Scrum.”


    In the Scrum method, there are three central roles on a project: product owner,
    scrum master, and developer (Schwaber and Sutherland, The Scrum Guide™ 2017).
    Each of these will be discussed briefly here. The product owner is responsible
    for the overall “shape” and feature set of the software product. The product owner
    identifies and prioritizes features to implement, tracks progress of the overall
    product, and accepts or rejects work completed by the development team. The scrum
    master is responsible for managing the development team’s work on each sprint.
    The scrum master identifies impediments to the project process and helps eliminate
    them. The scrum master ensures the development process as defined for the project
    is being followed.


    Project group members are responsible for designing, implementing, and testing
    the features that are developed as part of the project. They are also responsible
    for estimating their work on each product feature as defined for a given sprint,
    communicating their estimates to the product owner and scrum master, and demonstrating
    how their software meets requirements as specified in the corresponding user story
    (discussed subsequently). Once a project is identified and a project group assembled,
    the scrum method defines a series of activities and iterations toward completion
    of the project.'
