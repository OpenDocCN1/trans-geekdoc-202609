    # # Main Study Experimental Results


    After completing the experiments for all participants, we used a 10-second time
    frame (epoch) to extract our feature vector. We applied our feature extraction
    algorithm using three levels of decomposition for the EEG signal and six levels
    of decomposition for the ECG signals. We organized the recorded signals (i.e.,
    EEG, ECG) in two ways:


    +   Setup 1: we label the feature vectors extracted from each participant by the
    task activity. The feature vectors extracted from the benign activities'' tasks
    (tasks 1, 2, 3, 4) have a label “0” (negative), and the feature vectors obtained
    from the malicious activity tasks (tasks 5, 6) have a label “1” (positive). This
    setup is used to evaluate our approach’s capability in distinguishing the malicious
    activities from the benign activities.


    +   Setup 2: we only use four tasks in this setup by labeling the feature vectors
    extracted from the benign activities under stress (task 2, 4) as “0” (negative),
    and the feature vectors extracted from the malicious activities (tasks 5, 6) as
    “1” (positive). We only consider the malicious tasks and the benign tasks performed
    under stress to measure our approach’s performance in differentiating between
    the malicious activities and the benign activities performed under stress.


    We perform training and testing on each participant’s data. We split each participant’s
    data into 70% tuning and training set, and 30% testing set by dividing the ten
    minutes of task time into seven minutes for training and three minutes for testing.
    In order to ensure a good separation between the training and testing sets, we
    ignore the 30-second time window between the training and testing time (the last
    15 seconds of the training minutes and the first 15 seconds of the testing minutes).
    We utilize three different classification algorithms, namely: the SVM (Cortes
    & Vapnik, 1995), the K-nearest-neighbors (k-NN) (Altman, 1992), and the Random
    forests (Breiman, 2001) to classify the examples.


