- pgno: 21
  md: '# # Chapter 1


    # # Cybersecurity Challenges and Implications for the Information Profession


    Reem Alkhaledi and Suliman Hawamdeh


    Department of Information Science, University of North Texas


    # ## Introduction


    Technology has changed the way we communicate, exchange information, and conduct
    business. It has impacted our lives in a big way and made it possible for anyone
    with a handheld device or mobile phone to access information from different sites
    and diverse information systems located around the world. Real-time access to
    information enabled people to engage in business and commerce activities online.
    The convenience created by the technology comes at a price. It has created an
    environment where we are more vulnerable to cyberattacks and cybersecurity threats
    than ever before. The increase in the number of cybersecurity breaches in the
    past decade highlighted the magnitude and the complexity of the cybersecurity
    problem. Some of the high-profile cases such as Yahoo 3 billion users data breach
    in 2013, eBay 145 users in 2014, Uber 57 million users in 2016, the US Democratic
    party email system hack in 2016, and Equifax 143 million consumers data in 2017
    are few examples of the security threats and data breaches that individuals and
    organizations face today (Armstrong, 2018). This could be just the tip of the
    iceberg of what we would expect in terms of challenges posed by advanced 5G technologies
    and artificial intelligent-enabled devices.'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'Most consumers and information service users expect their private and confidential
    information to be kept confidential, protected, and stored in secure systems.
    As consumers, we are expected, if not required, to provide personal information
    to complete certain credit card purchases or online transactions. Even if a privacy
    policy exists, disagreeing with the policy might means denied access to the services
    provided, leaving users questioning their rights and the wisdom and value of reading
    such policies (Menand, 2018). Data security breaches in most cases means customers’
    valuable information are exposed and probably stolen. Such breaches represent
    a wakeup call to the fact that everything connected to the Internet could be vulnerable.
    This includes smartphones, computers, home automation, television sets, cars,
    and virtual assistant such Alexa, Cortana, and Siri. Land phone communications
    are replaced by emails, and social media applications such WhatsApp and Facebook
    have become the norm.


    Losing connectivity to the Internet can sometimes bring operations in the organization
    to a halt. The reliance on Internet as the main mode of communication has increased
    exposure to cyberattacks. Addressing the Internet vulnerability issues requires
    a coordinated effort by the government and the private sector to address not only
    the technical aspect of the problem but rather the regulatory and social issues.
    Innovation and advances in technology are usually preceded regulations and other
    measures needed to encounter cybersecurity threats. While technical security measures
    such as encryption, blockchain, and authentication technologies can be developed
    and deployed in relatively short time, new regulations, human and social issues
    move much slower and in most cases operates in a catch-up mode.


    Cybersecurity does not affect only large size organizations, but it also affects
    individuals who are equally vulnerable to cyberattacks. People need to be educated
    on the importance of personal cybersecurity and learn how to protect themselves
    from cybersecurity threats. The number of unsecure networks that people connect
    to it on daily basis is alarming. According to a survey by Symantec released in
    May 2017 showed that 87% of consumers globally have used readily available unsecured
    public networks (Symantec, 2017). The survey showed more than 60% of those surveyed
    globally think their information is safe when using public networks. At the same
    time 53% of the user cannot tell the difference between secured or unsecured networks.
    This is not surprising given the increased reliance on digital information for
    business and entertainment. The survey showed that 59% of those surveyed used
    the network to access emails, 26% logged into work email, 56% accessed social
    media, 44% share photos and videos, 25% access banking and financial information,
    and 17% carried out transaction using personally identifiable information.


    The use of unsecure public networks such as hotspots leaves customers vulnerable
    for cyberattacks through intercepting data packets sent over unsecured networks.
    Hackers can eardrop on open connections to gather useful information'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'about user activities such as login information or personally identifiable
    information. Lord (2019) described cybersecurity as the body of technologies,
    processes, and practices used to protect network devices, programs, and data from
    attack and unauthorized access. This is important as cyberattacks become more
    sophisticated, there is a need to look at the problem from a holistic and integrated
    approach by examining the rules, regulations, procedures, and practices.


    # Historical Perspective


    # The Information Profession


    The information profession can be described as the field of work or the occupation
    that deals with information through its lifecycle from creation to disposal. According
    to Bates (2015), the information discipline is unique and does not fit in the
    spectrum of traditional disciplines. The information discipline is a metadiscipline
    similar to the education discipline which deals with a body of knowledge from
    a particular orientation. Every profession has both academic disciplinary aspects
    and professional practice aspects. Bates added that one common aspect of the information
    disciplines is that they all deal with collection, organization, retrieval, and
    presentation of information in various contexts and on various subject matters.


    Historically, librarians, archivists, and record managers had dealt with gathering,
    processing, organizing, and disseminating information. The evolution of the information
    profession was shaped overtime with the evolution of information disciplines.
    Melvil Dewey, who became the librarian at Columbia College in 1883, was offered
    the first class in library economy in 1887. Dewey is considered one of the pioneers
    in the field of information in which one of his signature achievements was the
    creation of the Dewey Decimal Classification system. The field of information
    science disciplines is inherently interdisciplinary drawing on theories and methods
    from other fields. Dewey library classification system was based on the classification
    of knowledge by Sir Francis Bacon (Wiegand, 1998). Dewey helped to establish the
    American Library Association (ALA) in 1876, and in 1926, the Carnegie Corporation
    funded the first Graduate Library School at the University of Chicago (Richardson,
    2010).


    The real transformation of the library and information profession started with
    the creation of the DDC system to organize the library collections – the first
    systematic and scientific method to organize the collection by different disciplines.
    The flexibility and scalability of Dewey classification system made it the default
    standard for organizing the library material and library collections for long
    time. The evolution of the information profession into scientific disciplines
    was driven by the need to go beyond gatekeeping role to a more dynamic and service-oriented
    profession.'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'The big shift and transformation of the information profession happened with
    the invention of computers and the idea of using computer to store and retrieve
    information. In 1945, Vannevar Bush published an article under the title “As We
    May Think” in which he talked about mechanizing the process of storing and retrieving
    books with higher degree of speed and flexibility. Soon after (in 1948), Holmstrom
    described the possibility of using UNIVAC computer in bibliographic searching
    (Sanderson and Croft, 2012). The real library automation efforts started in 1960s,
    with the first large information retrieval research group formed by Gerard Salton
    first at Harvard University and then at Cornell University. Work in the area of
    information retrieval in the 1970s and 1980s still form the basis for most of
    the current development in online and database searching. Most notable work in
    that period is Luhn’s term frequency (tf), which is based on the statistical analysis
    of the keyword in the document. The work by Sparck Jones extended Luhn’s tf to
    include the statistical analysis of the word occurrence in the document and across
    the collection of documents. She introduced the concept of inverse document frequency
    which measures the significance of the term in a given document corpus (Jones,
    2004).


    In 1990s, the field of information was further expanded by the development of
    several major areas in the field of information that included full text retrieval
    systems, digitization of paper document, document management systems, hypermedia,
    multimedia, and virtual reality applications. The birth of the web opened the
    door to globalization and the global access to information from an integrated
    diverse resource. This was made possible by the development of hypertext transfer
    protocol (HTTP), the hypertext markup language (HTML), and the web browsers. The
    web search engines started to appear in the mid-1990s, and at the turn of the
    century, we started to see more sophisticated technologies developed and deployed
    on the Internet. Web 2.0 moved the web from static web pages to more dynamic web
    applications where access to information in real time is made possible. The concept
    of knowledge portals and enterprise portals started to emerge by integrating diverse
    range of applications and by providing single sign on access technologies.


    The 2000s marked the turn of the century in an era characterized by globalization
    and the increased emphasis on knowledge as a factor of growth. It has given rise
    to intellectual capital, intellectual property, and the wider concept of the knowledge-based
    economy. It has also given rise to the birth of online mega corporations such
    Google, Amazon, Netflix, and Facebook. It created interest in new growth areas
    in the information field such as knowledge management, knowledge discovery, big
    data, data analytics, and data science. The relationship between technology, people,
    and information formed the basis for birth of the iSchools movement or the Information
    Schools.


    The iSchools movement started in 2005 when a number of library and information
    science schools realized that their teaching and research programs'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'had capacity to reach a broader audience of students and to prepare professionals
    for work beyond librarianship. Since then the number of schools joined the iSchools
    movement have increased to more than 80 schools. Since then many of the library
    and information science schools changed their name by dropping the word library
    from to reflect the broader nature of the information profession. It is important
    to note that a number of institutions joined the iSchools consortium were not
    originally library schools. They are part of the Computing Research Association
    and business schools with strong management information system programs. The iSchools
    vision as stated on the iSchool.org website is to expand presence internationally,
    recognized for creating innovative information solutions and systems to benefit
    individuals, organizations, and society at large.


    The iSchools consortium represents a shift in directions and philosophy from the
    traditional library and information science education. The shift in direction
    revolves around broadening the concept of the information field by the diversifications
    of program offerings and the inclusion of new and emerging areas such as data
    science, cybersecurity, and knowledge management.


    # Privacy and the Right to Be Forgotten


    The relationship between privacy and security is a complex one. Historically,
    information professionals including librarians, archivists, and record keepers
    defended intellectual freedom and championed the user’s right to privacy. By doing
    so, librarians in essence took on themselves the task of protecting user’s information
    and keeping it confidential. This undertaking required that information professionals
    understand and practice safe records keeping. The American Library Association
    (ALA), the largest library association in the world, has long held that privacy
    is a core value of the librarianship profession. The ALA Code of Ethics adopted
    on June 28, 1995 article II states that “We uphold the principles of intellectual
    freedom and resist all efforts to censor library resources.” This is in line with
    the Freedom of Information Act and the freedom of expression, as recognized by
    Resolution 59 of the UN General Assembly adopted in 1946 and Article 19 of the
    Universal Declaration of Human Rights in 1948 (Magi, 2011; Diaz, 2019).


    The right to be forgotten is relatively new and it is an interesting concept given
    the fact that once information is posted on the web, and gets captured by someone
    somewhere and saved permanently. This could be the case even if the information
    might be wrongly posted and removed. In light of this and in response to other
    privacy concerns raised by data collection on the web, the European Union created
    the right to be forgotten and the right to erasure as part of the General Data
    Protection Regulation. The regulation came about as a result of the case Google
    Spain SL, Google Inc v Agencia Española de Protección de Datos, Mario Costeja
    González.'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'Privacy refers to the right to control personal information, whereas security
    refers to how your personal information is protected. There is a delicate balance
    between privacy and security as both are related. Most web-based services and
    social media applications provide privacy policies and privacy agreements designed
    in theory to protect users. However, failure to protect user’s information in
    certain cases undermines users’ confidence in these systems. Most users pay little
    attention the privacy statements or terms of use and the long-term implication
    of the information collected about them (Menand, 2018).


    While technology enhances access to information and provides the needed tools
    to protect user’s data such as advance encryption and privacy setting, cybersecurity
    remains a challenge to both the users and the information professionals. Threats
    to privacy in the cyberspace are real and varied. Security threats come in different
    forms and shapes that include government surveillance tools, sophisticated identity
    theft, cybercrimes using hacking to exploit vulnerabilities in online applications
    such banking, e-commerce transaction, online retails databases, and election stations
    (Armerding, 2018; Miao, 2018). To encounter such threats, there must be a holistic
    approach to the problem that would include creating awareness among users, building
    a sound and robust infrastructure, and training a new generation of information
    and cybersecurity professional who can deal with both the technical and social
    aspects of cybersecurity.


    # Cyberattacks and Cybersecurity Threats


    Cyberattacks are on the rise and cybersecurity threats are real. Cyberattacks
    do not only pose problems to individuals but also to private and public institutions,
    governments agencies, and society at large. The Internet has opened the door to
    all sorts of hacking and intrusion activities by local players and hostile powers.
    The most sophisticated types of attacks are those orchestrated by hostile powers
    and hostile governments in a form of cyberwar. Spying in cyberspace has become
    a common activity through deploying malicious software and cookies. This sometimes
    is combined with other form of data collection and monitoring using sophisticated
    artificial intelligence and predictive analytics tools (Collier, 2019; Joshi,
    2019). Information and cybersecurity professional’s role is to guard against such
    activities and threats. This means that information and cybersecurity professionals
    not only need to understand the risk and the different types of cybersecurity
    threats that might exist but also need to develop the capacity to work with the
    tools and technologies needed to encounter such threats.


    # Phishing Threats


    Phishing is a common security practice carried out by sending emails that might
    appear to be coming from reputable organizations or close friends using their'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'personal contacts. As long as we are connected to the Internet, we are potential
    targets to different form of phishing attacks. Recent studies have shown that
    more than 90% of cyberattacks happened using phishing emails (BBB, 2017). In such
    environment, the hackers by sending fraudulent emails they try to collect credentials
    that can be used to gain access to sensitive information. Phishing attacks attempt
    to exploit security vulnerability associated with user''s lack of knowledge or
    user''s lack of awareness about the risk by responding to email requests. Sometime
    the emails are designed to create panic by creating a sense of emergency, causing
    the person to panic and response to the hacker''s request.


    In recent years, phishing attacks are becoming more sophisticated and can be tailored
    using real people information. Much of that information can be stolen from contacts
    information accessed using various social media applications. Many of the social
    media applications require users to agree for the app to access their contact
    information. Users most of the time are left with no choice but to agree and consent
    for the app to access their contact information or their location. The binary
    option of yes or no does not leave the user with that many options to protect
    their contacts or location information. Using contact information hackers are
    able to design phishing emails and send them on behalf of trusted parties such
    as coworkers, family members, or friends.


    Clicking on a link provided by the phishing email could enable the hacker to gain
    access to the employee email account and use it to send phishing messages to other
    employees. Taking over of the employee email can also enable the hacker to gain
    access to sensitive information According to Moore and Clayton (2007), phishing
    is a process of enticing people into visiting fraudulent websites and convincing
    them to enter credential information such as usernames, passwords, addresses,
    social security numbers, and personal identification numbers.


    # Ransomware


    Ransomware is another type of security threat that is becoming serious. A recent
    article by CNN dated May 10, 2019 reported a number of ransomware attacks on local
    US government such as cities, police stations, schools, and government offices
    (Collier, 2019). The number of ransomware attacks is on the rise. In 2016 the
    number of attacks was 46. In 2017, the number dropped to 38 but in 2018 the number
    jumped to 53, indicating a rise in the number of ransomware attacks again.


    Ransomware is a type of malware that attackers try to install on the targeted
    computers. The malware then prevents users from accessing their system or personal
    information and demands ransom payments. The method by which ransomware is spread
    is through phishing emails or malicious spam. The email normally has attachments
    that can act as booby traps. Phishing occurs when the'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'user connects to a fake website by simply clicking on an Internet link that
    is embedded within the email.


    There are three different types of ransomware. These are scareware, screen lock,
    and encryption ransomware. Scareware uses security alerts and other methods to
    scare the users of viruses or other malicious apps installed on the computer and
    it can be removed if you sign up and pay to the services to remove it. Another
    way is to freeze the screen displaying an FBI message claiming that you have violated
    certain rules and you need to contact them immediately to resolve the issue. They
    normally warn you from switching your computer off. One of the nasty methods is
    to deploy a malware that hijack and encrypt the data (Brewer, 2016). The danger
    here is unlike the previous two where the computer can be turned off and then
    a cleanup software is used to remove the malware. In this type of encryption malware
    once it has encrypted the file, it is impossible to decrypt the files again without
    paying ransom, resulting in losing data.


    # Cryptojacking


    Cryptojacking is another type of security threat similar to ransomware but mainly
    affect cryptocurrency. Cryptocurrencies refer to a type of money generated using
    encrypted codes (Nadeau, 2018). For any currency to have a value it should be
    in limited supply. Gold is used as a currency due to the limited supply and the
    difficulty and efforts it takes to mine gold, making it of a higher value metal.
    Cryptocurrencies are similar in many ways to gold, as bitcoins are hard to mine
    and require unique skills to discover certain mathematical calculations that are
    not easy to duplicate.


    Cryptocurrency in the form of bitcoin is a relatively new phenomenon and came
    about in 2009. The value of bitcoins skyrocketed from the time it was used to
    purchase pizza back in 2010 to now using it to buy luxury cars, real estates,
    and self-declared billionaire. The value of one bitcoin reached more than $20,000
    in 2017, which motivated people around the world to start mining bitcoins (Rooney,
    2018). Cryptocurrency as piece of information (a complex mathematical calculation)
    stored in databases and on computer networks requires higher level of security.


    Cryptocurrencies in the form of bitcoins are basically database records protected
    by the strength of the network security and the carrier in which the financial
    transaction is performed. Unlike traditional currency which can be backed by gold
    or government banks guarantees, cryptocurrency is managed by multiple duplicate
    databases across decentralized networks with no control or government oversight.
    The decentralized nature of the cryptocurrency makes it hard for anybody or agency
    to control the number of bitcoins that can be released in the market. Cryptojacking
    is a process of stealing resources that enable the hackers to locate or mine currency
    at low or no cost. Cryptojacking software can'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'be deployed in a form of malware that can take advantage of the resources deployed
    to mine bitcoins.


    # Cyber Physical Attacks


    Cyber physical attacks are viewed in relation to cyber physical systems and the
    weakness of their computation and communication elements. For example, a user
    with bad intentions can take control of the computing and communication components
    of a certain service and devices such as computer centers, home automation devices,
    cars, or water pumps. Loukas (2015) described cyber physical attacks as “cyber-attacks
    that have physical effect propagations ... a cyber physical attack is a security
    breach in cyberspace that adversely affects physical space” (p. 11).


    Physical security is critical to the overall security of the services provided
    online. There are many components of physical security planning and implementation
    that involve activities such as designing the facilities, risk assessment and
    asset management, and rules and regulations that govern entry and use of the facilities
    (Hutter, 2019). Cybersecurity professionals have the responsibility to make sure
    that the physical security of facilities is under their control. This includes
    restrictive entry to the facility, authenticating employees looking to gain access
    to the facilities, and monitoring contractors and other visitors who might try
    to access the physical site area. The secure areas usually house servers, data
    storage devices, and other computing resources that are needed to run the organization.


    # State-Sponsored Attacks


    Cyber warfare today is a reality given the increased political tension around
    the world (Dunn Cavelty, 2012). The increased dependency on the Internet as a
    form of communication tool, a platform for commerce, and automation vehicle such
    as Internet of Things (IoT) has created high-value targets. Today every organization,
    private or public, is connected to the Internet. Such loose public network of
    billions of machines around the world makes it possible for hackers from around
    the world to engage in aggressive activities, ranging from stealing information
    to crippling organization or state infrastructure. Almost all sectors of society
    including education institutions, health information systems, government department,
    and private and public corporation rely on technology and Internet communication.
    Most organization will be brought to a standstill and stop functioning as and
    when they experience Internet interruption and communication problems. This is
    applied not only to Internet-based operations such as Amazon or Facebook, but
    rather to brick and mortar companies that rely heavily'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'on information systems and data repositories essential to their daily operations,
    and without access to these resources, they cannot operate.


    It is easy for states to engage in cyber warfare to inflict damages on adversaries
    given the low cost, speed, and risk compare to traditional warfare. Some countries
    have invested heavily in such capabilities, creating a race against time in preparedness
    and readiness to defend. Most countries developed capabilities to defend against
    cybersecurity attacks. However, such infrastructure and capabilities can be misused
    if it falls in the hands of wrong people.


    # Cybersecurity Challenges


    Computer network infrastructure faces security threats on a daily basis, and the
    number of threats are growing and becoming more sophisticated. According to Wang
    and Yang (2017), almost every minute, there are more than half a million attack
    attempts that are taking place in cyberspace. Hackers have become more sophisticated,
    and protecting information systems form hacking activities has become more difficult.
    Hackers are constantly looking for vulnerabilities and weaknesses in the system
    with the motivation of stealing information and undermining the IT infrastructure.
    Hackers only need to have a single tool or technique to access an information
    system that has a weakness that they can take advantage of. Most businesses, small
    or big, are facing difficulty in keeping up with the number of threats due to
    the growing variety of hardware, devices, applications, and end users. Toward
    the end of 2016, companies realized the acute shortage in cybersecurity professionals
    and decided to increase their budgets to meet the challenge. CyberSeek, an initiative
    funded by the National Initiative for Cybersecurity Education (NICE), reported
    that the United States has shortfall of 314,000 cybersecurity professionals as
    of January 2019. The global cybersecurity shortage of highly qualified professionals
    is projected to reach 1.8 million by 2022 (Crumpler and Lewis, 2019; Frost and
    Sullivan, 2017).


    # Internet of Things (IoT) Vulnerability


    According to Loukas in 2015, the IoT is the vision of a global infrastructure
    made of a network of objects. The information in this case is not generated by
    people but rather by devices and physical objects such as appliances, vehicles,
    home automation devices, and smart buildings. Consumer devices such as TV sets,
    cars, and personal devices are the main driver of IoT and it accounts for 5.2
    billion units in 2017 and is expected to rise up to 12.86 billion in 2020. Businesses
    specific business devices such as manufacturing field devices, process sensors
    for electrical generating plants, and real-time location devices for healthcare
    are expected to rise from 1.64 billion in 2017 to 3.17 billion in 2020 (Tung,
    2017). Powered with the'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'latest and most advanced technology, IoT devices have the ability to communicate
    and interact via the Internet in a way that can be watched and controlled from
    a distance. Such devices are used to automate homes, factories, offices, and smart
    buildings (Rouse, 2016).


    IoT device connectivity to the networks depends on the type of IoT application
    deployed. Just as there are many different IoT applications, there are different
    connectivity and communications options. Communications protocols include CoAP,
    DTLS, and MQTT, among others. Wireless protocols include IPv6, LPWAN, Zigbee,
    Bluetooth low energy, Z-Wave, RFID, and NFC. Cellular, satellite, WiFi, and Ethernet
    can also be used. Due to the variety of such devices and the danger posed by the
    rapidly growing IoT attacks, the FBI released the public service announcement
    “FBI Alert Number I-091015-PSA” in September 2015 (Rouse, 2016). The document
    outlined the risks associated with the use of IoT devices and made recommendations
    regarding methods and tools that can be used to protect and secure such devices.


    # Artificial Intelligence


    Making progress in areas like image recognition, voice recognition, natural language
    processing, and deep learning will enhance our ability to design a more sophisticated
    intelligent systems capable of defending against cyber. As hacking activities
    become more sophisticated and complex, the need to deploy AI capabilities to examine
    and predict vulnerabilities will increase. We could also see an increase in the
    number of organizations deploying AI tools to monitor and protect against sophisticated
    attacks.


    AI robots have become popular in recent years as tools for collecting data due
    to low cost. However, autonomous AI tools can inflict long-term damage without
    the need for human interference. It has the ability to adjust itself to the environment
    and reinvent itself if need be depending the circumstances (Dieterich and Horvitz,
    2015; Harel, Gal, and Elovici, 2017). Mining and analyzing large amount of data
    gives these tools the ability to adapt to the environment and determine the types
    of attacks. Based on the information gathered, it could assess the willingness
    of the targets to pay ransom based on profiling the victims over a long period
    of time. AI could be used to create trust through engaging targets in long-term
    relationships designed to gather information through fake social media accounts
    and other impersonated identities.


    Guarding against such capabilities requires organizations to to deploy smarter
    and more sophisticated tools to deal with malicious AI software. AI systems can
    be trained to detect malware and viruses with the help of big datasets and machine
    learning. They can be trained to analyze microbehavior of ransomware attacks to
    recognize ransomware before it encrypts a system (Joshi, 2019).'
