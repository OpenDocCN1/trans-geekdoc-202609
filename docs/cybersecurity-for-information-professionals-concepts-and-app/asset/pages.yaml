    # Cybercriminals Quickly Make Money Off of Stolen Data


    After breaking into a business, educational, governmental, or other public sector
    digital database, cybercriminals quickly sell stolen private and personal data
    on the dark web. The dark web is a part of the Internet not discoverable by traditional
    search engines such as Google of Firefox, and is only discoverable via special
    web browsers such as Tor. The dark web accounts for approximately less than 0.01%
    of the Internet. The entire Internet itself is known to be broken into three parts:
    the surface web, the deep web, and the dark web. The surface web makes up about
    10% of the Internet. Information, data, and knowledge located in the surface web
    may easily be retrieved via simple search from most web browsers such as Google
    and Internet Explorer. An example of surface web content is a gaming company selling
    legally downloadable video games via their commercial website. The deep web consists
    of 90% of the Internet, and offers data, information, and knowledge to users via
    search engines such as scholarly books or articles located in databases by a paywall.
    An example of this would be when a student searches in EbscoHost and downloads
    a scholarly article via his or her university or college username and password.
    The dark web is a part of the deep web, consisting of about 0.01% of the Internet,
    where much illicit'
  merge: -1
  img_proc: true
- pgno: 167
  md: 'trading of black market items and services occurs. Using primarily the web
    browser called Tor, stolen data, information, and knowledge is often illegally
    traded and sold (Ablon et al. 2014).


    Cybercriminals have a complete logistics system setup on the dark web on which
    stolen data can be marketed, sold, delivered and lightning speed to buyer via
    a sophisticated logistics system, and implemented via buyers for their malicious
    purposes (Ablon et al. 2014). Thus, when cybercriminals are able to successfully
    break into and private millions of customers’ private data, they are highly likely
    to have a quick return of possibly hundreds of thousands of dollars to possibly
    millions of dollars by selling this data within minutes on the dark web.


    # What Recourse Do Victims of Cybercrime Have?


    Of course, when one falls victim to cybercrime, the natural response, other than
    feeling violated and somewhat helpless is, is there any legal recourse, or anywhere
    one may turn to for help. While receiving legal help from cybercrime is somewhat
    cumbersome due to cybercriminals usually residing in legal jurisdiction from where
    the victim’s data or information is stolen, there are some interjurisdictional
    agencies to where one may attempt to seek help. For example, one may contact the
    IC3 www.ic3.gov/default.aspx and file a complaint regarding cybercrime. The complaint
    should include the victim’s name, address, telephone, and email; financial transaction
    information; specific details regarding how one was victimized; and any other
    relevant information.


    If one falls victim to a phishing email scam, or if one simply receives an email
    phishing scam attempt, one may forward the attempt to reportphishing@antiphising.org
    (the Anti-Phishing Working Group (APWG)) and to phishing-report@us-cert.gov where
    it will be received by the United States Computer Emergency Readiness Team (US-CERT).
    The APWG is a private, international work group that tracks various types of cybercrime,
    and attempts to deter such future cybercrime. The US-CERT group is an arm of the
    US Department of Homeland Security, and attempts to garner information about cybercrimes
    and subsequently better educate the its denizens regarding awareness and potential
    dangers of certain Internet activity (Smith 2016).


    If an individual finds him or herself in one of the mass data/information breaches
    similar to the ones mentioned above (e.g., Target), he or she may enroll in the
    online account monitoring software called WebWatcher. This system offers reimbursement
    for monetary loss due to cyber breaches and fraud up to one million dollars. When
    one enrolls in these services, he or she also obtains fraud counseling services
    and reimbursement coverage for free (Smith 2016). So, though victims of cybercrime
    when it affects people.'
