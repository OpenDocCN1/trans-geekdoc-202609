    # Analysis of Signal Psychophysiological Measures

    and Results


    In this section, we present our analysis and results for the signal part of our
    recorded psychophysiological measures (i.e., EEG, ECG) for both the pilot study
    and the main study. One of the essential steps in our data analysis is to preprocess
    and filter the acquired EEG and ECG signals. This step requires specific signal
    processing and filtering procedures. The EEG and the ECG signals, as we explained
    before, are low- frequency signals with very low signal intensity measured in
    microvolts (µV). Therefore, these signals will naturally include some noises that
    may corrupt their purity. There are two types of noises we should take into consideration.
    First, the EMG artifacts that happen due to involuntary muscle movements around
    the device electrodes. Second, the electrooculogram (EOG) artifacts that are generated
    as a result of eye blinking when the EEG signals are recorded. Our first step
    is to remove these artifacts and remove any other noises that may influence the
    results. We use a low-pass filter to remove the higher frequency noises, high-pass
    filter to cut off the lower frequency, and select a frequency range from 0.1 to
    30 Hz. Next, we extract features from the recorded signals. EEG and ECG signals
    can be presented in time and frequency domains. A combination of frequency information
    features and time domain information features can be extracted from both domains
    and improve the classification performance (Mensch, Werfel, & Seung, 2004). There
    are many feature extraction techniques that can be applied to these signals and
    they can obtain features from either the time or frequency domains. In this work,
    we use a wavelet packet decomposition technique (Khushaba, Kodagoda, Lal, & Dissanayake,
    2011; Li, Shen, & Beadle, 2004) to extract the features. The wavelet transform
    algorithms have gained substantial consideration in analyzing non-stationary signals
    (signal’s statistical characteristics change with time) (Li, Shen, & Beadle, 2004).
    Wavelets are localized in both the time and frequency domains, and these characteristics
    of wavelets make it a useful tool for the purpose of feature extraction. In more
    detail, the wavelet packet decomposes the originally recorded signals into a specific
    number of sub-bands using the wavelet function and generates a sub-band tree.
    Each level of the tree is composed by passing the previous approximation coefficients
    over high-pass and low-pass filters. Then, we take the energy of the wavelet coefficients
    using the normalized filter bank energy for each sub-band.'
