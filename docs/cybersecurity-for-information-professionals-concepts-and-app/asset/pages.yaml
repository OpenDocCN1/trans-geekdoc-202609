    # 12.3.2 SQUARE


    SQUARE is a nine-step methodology (Table 12.1) created at Carnegie Mellon University
    to assist organizations in building security in the early stages of development.
    According to the United States Computer Emergency Readiness Team (US-CERT) (Mead
    2013):


    > Security Quality Requirements Engineering (SQUARE) provides a means for eliciting,
    categorizing, and prioritizing security requirements for information technology
    systems and applications. The focus of this methodology is to build security concepts
    into the early stages of the development life cycle. The model can also be used
    for documenting and analyzing the security aspects of fielded systems and for
    steering future improvements and modifications to those systems.


    The nine steps focus on eliciting, categorizing, and prioritizing security requirements
    for information technology systems and software applications (Mead, Hough and
    Stehney 2005, Mead 2006, Mead 2013). The goal of SQUARE is to categorize and prioritize
    security requirements. Steps 1–4 are actually activities that precede security
    requirements engineering but are necessary to ensure that the process is successful.


    Collecting requirements is dependent on representation from the project’s stakeholders.
    To collect requirements using the SQUARE process, it is important to first identify
    all stakeholders for the project. SQUARE is most effective and accurate when conducted
    with a team of requirement engineers, security experts, and the stakeholders of
    the information system or software application project (Mead, Hough and Stehney
    2005). The table shows each step explained in detail to satisfy the security goals
    of the organization. We elaborate on these steps further:


    Step 1: Agree on definitions: Project team members and stakeholders are gathered
    to enable the definition of the most consistent set of topics for security requirements
    related to the project (Mead 2013). Owing to different background experiences
    of team members, it is inferred that security definitions related to security
    of the project may mean different things to different members. Consistent definitions
    with clearly defined terms should ensure success going forward.'
