  md: '# Conclusion


    Historically, information professionals like librarians, archivists, and record
    managers assumed the role of gatekeepers with the self-mandated tasks of protecting
    organizational asset, advocating for intellectual freedom and securing patron’s
    information. Advocating for intellectual freedom and privacy required that information
    professionals protect patron’s information from unwanted and unauthorized access.
    This notion was further supported by ALA Code of Ethics and the Freedom of Information
    as a basic human recognized by the United Nations Resolution 59 (Magi, 2011; UDHR,
    2019). The Library Bill of Rights adopted by the ALA in 1939 clearly states that
    “A person’s right to use a library should not be denied or abridged because of
    origin, age, background, or views.” The bill also recognized the importance of
    protecting and safeguarding users’ information by stating that “All people, regardless
    of origin, age, background, or views, possess a right to privacy and confidentiality
    in their library use. Libraries should advocate for, educate about, and protect
    people’s privacy, safeguarding all library use data, including personally identifiable
    information” (www.ala.org; Diaz, 2019).


    Today, as much as technology has revolutionized the way people access, manipulate,
    and use information, it has also increased vulnerability and made it easier for
    hackers and bad actors to try and gain unauthorized access to information long
    held sacred by information professionals. Certainly, technology and the Internet
    did not make it easier for information professionals to do their job. Threats
    to privacy in cyberspace are real and complex and come in different forms and
    shapes. To encounter such threats, there must be a holistic approach to dealing
    with the problem. This would include creating awareness among the users and privide
    formal education to equip information professional with the skills and competencies
    needed to combat cybersecurity threats as well as provide sound and robust infrastructure
    that addresses the technical, legal, and social aspects of cybersecurity. The
    chapter discussed cybersecurity attacks, threats, and challenges in the context
    of the information profession and its historical association with the notion of
    cybersecurity and privacy.


