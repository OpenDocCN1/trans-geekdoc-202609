  md: '# Chapter 8


    # # Cybersecurity and Social Media


    Hassan Zamir


    School of Information Studies, Dominican University


    # ## Introduction


    Social media is a tool for building networks, interact, and practice democracy.
    Across the globe, users share contents, emotions, and engage in conversations
    effortlessly. People of all walks of life can communicate with each other in an
    unprecedented way. Individuals, businesses, governments, and charities can get
    connected with ease. However, with greater technological affordances come greater
    risks. Nefarious sources can sabotage the systems and steal individual and organizational
    information. Cybersecurity risks are higher on social media platforms. Moreover,
    there is citizen distrust on both government and social media companies with regard
    to data protection. Recent data and security breaches have escalated the concerns
    even more.


    In the United States, 64% Americans do not have faith on government protection
    and social media sites over cybersecurity risks and information privacy protection
    (Pew Research 2017). The US citizens are also divided over data encryption, particularly
    during crime investigation. However, more and more people are shifting toward
    storing their information in digital tools. In the case of social media, user
    data can be harnessed easily at this current status. Hackers steal information,
    breach the data, and manipulate in any way they wish. They intend to leak data
    and take control over the systems by slowing it down and hijacking'
  merge: -1
  img_proc: true
- pgno: 174
  md: 'the accounts. Their illegal access to information causes physical interferences
    and service unavailable.


    Recently, Federal Communications Commission ruled that Internet Service Providers
    (ISPs) can use and sell customer data (Consumer Reports 2018). The ISPs have customer
    data divided into two categories – sensitive personal data and less-sensitive
    personal data. Sensitive data includes “geographic location, children’s information,
    health information, financial information, social security numbers,” web browsing
    history, app usage history, the content of communications.” The less-sensitive
    data includes user’s name, address, IP address, subscription levels, and anything
    else not in the “opt in” category. Under the new rule, ISPs can sell the second
    category or less-sensitive data.


    In the age of big data, social media platforms generate exabytes of data in seconds.
    While the technology companies capitalize on big data, online predators weaponize
    sophisticated data science and machine learning techniques for security concerns
    like social engineering. The threat actors can be anyone including individuals,
    inside agents, disgruntled employees, third parties, government-backed officials,
    or careless workers. They can sabotage the system and cause major security breaches
    out of financial gains, espionage, entertainment, revenge, convenience, fear,
    and ideology.


    This chapter discusses specifically about cybersecurity risks associated with
    social media. It highlights frequently observed security risks on social media
    platforms. The chapter rigorously stresses on the most common forms of cyberattacks
    on social media including phishing and social engineering. In this regard, it
    describes related security concerns and mitigation techniques. It also describes
    recommended social media cybersecurity implications for information professionals.


    # # Social Media Cybersecurity Risks


    Social media platforms generate millions of user data every second. Abundant information
    provides enough indicators to the attackers. Numerous cybersecurity risks are
    associated with social media usage. Security experts and scholars mention similar
    kinds of cyberattack approaches on social media based on recent and well-known
    security incidents. Some of the common social media security risks are phishing,
    social engineering, malicious shorten URLs, information leakage, impersonations,
    account hijacking, identity theft, scamming, Denial of Services (DoS), Distributed
    Denial of Services (DDoS), and bots (Table 8.1). Some risks are connected with
    cause and effects of social media use such as cyber-extremism, hate crime, cyberbullying,
    disinformation, and social media policing. These risks are commonly related either
    to information or systems. The attackers set missions to capture victim’s information
    or sabotage the system. Facebook assessed information operations executed on its
    platform and identified three major areas'
  merge: -1
  img_proc: true
