    # Malware Attacks


    Malware exists in many forms, for example, viruses, worms, and Trojans. It can
    attach itself to legitimate codes; it can also replicate itself across the network
    or the Internet. The impacts of malware infection can be devastating, destroying
    boot-sectors, or permanently deleting systems files. When it is combined with
    the use of the cryptography, it could encrypt the victims'' critical files and
    ask for a ransom. In the following, we discuss eight (8) different types of malware
    attacks.


    +   1. Macro viruses: These viruses could infect generally Microsoft products
    such as the Word or Excel applications. Macro viruses attach to the initialization
    sequences of the Word (.doc or .docx) or Excel (.xls or .xlsx). When these applications
    are run, the virus executes to replicate itself to attach to other files. Fortunately,
    these macro viruses can be thwarted with newly updated Microsoft patches.


    +   2. Boot sector or executable file infection: Viruses can attach themselves
    to executable codes (.exe). That is, when the executable files (.exe) are run,
    the virus code will also execute. When the executable codes attach to the master
    boot records on the hard disk, it could load the virus into the random access
    memory and propagate to other disks.


    +   3. Polymorphic and metamorphic viruses: The virus could conceal and mutate
    itself into different codes by encryption algorithms or compression techniques.
    Polymorphic malware can change part of its own code, while metamorphic malware
    codes are completely rewritten during each infection. When these types of viruses
    have a high level of entropy, they will mutate into many modifications or versions
    of their own source codes to avoid signature-based antivirus detection. An advanced
    version of mutable virus'
