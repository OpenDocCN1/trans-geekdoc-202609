    # # Bridging the Cybersecurity Talent Gap: Cybersecurity Education in iSchools


    Hsia-Ching Chang


    Department of Information Science, University of North Texas


    Cybersecurity Policy Fellow, New America


    Cary Jim and Suliman Hawamdeh


    Department of Information Science, University of North Texas


    # ## Introduction


    Cybersecurity has emerged as a global issue in recent years with major challenges
    to individuals and organizations around the world. The International Systems Audit
    and Control Association (ISACA) report: State of Cybersecurity 2019 reveals an
    expressed concern about the lack of skilled cybersecurity professionals on their
    teams by approximately 70% of the global respondents. The same report indicates
    almost 40% of the recent university graduates in cybersecurity are not prepared
    for the job requirement. The academic goals and objectives of cybersecurity within
    computer science education may be a frequent misperception'
  merge: -1
  img_proc: true
- pgno: 76
  md: 'because of the interdisciplinary nature of cybersecurity. Other skill sets
    in relation to human behavior are also important to the design and development
    of a holistic cybersecurity view which is beyond the traditional effort concentrated
    on technical training. The Cybersecurity Workforce Framework developed by the
    National Initiative for Cybersecurity Education (NICE) identifies 33 specialty
    areas for cybersecurity jobs in which more than half primarily involve nonprogramming
    tasks (Swire 2018). Information science focuses on information behavior and processes
    between humans and technologies. As a discipline closely related to computer science
    and information technology, it can provide a unique advantage to address the human
    aspects of cybersecurity. The consortium of information schools known as the iSchools
    are in a good position to address some of the educational issues related to cybersecurity,
    especially security issues related to information organization, information management,
    social media, and knowledge management. The iSchools focus on educating students
    from both technical and nontechnical backgrounds which play an important role
    to address interdisciplinary training and support for the development of a diversified
    workforce.


    Besides the need of trained cybersecurity professionals, public knowledge of cybersecurity
    is also important. The innovations of smart devices ranging from smartphones,
    wearables, smart homes, connected cars, to medical devices are becoming part of
    our daily life and shaping our behavior slowly toward the foreseeable future.
    According to the 2018 Study on Global Megatrends in Cybersecurity conducted by
    Ponemon Institute with sponsorship from Raytheon, 82% of the IT practitioners
    predicted a data breach from unsecured Internet of Things (IoT) devices is very
    likely to occur in the subsequent years. For example, a smartphone could serve
    as a hub to any connected devices through applications in syncing with wearables
    to track activities, monitoring doorbell ring, home energy use, and controlling
    smart devices'' functions. It is worth noting that we have been living in the
    digital age and our next generations have grown up with the use of mobile Internet
    and smart devices as part of their daily routines. How do we prepare for the cybersecurity
    risks that could jeopardize our security and safety? The engagement of information
    professionals with the general public can help raise their awareness of cybersecurity
    risks. The Pew Research Center designed a cybersecurity knowledge quiz and conducted
    an online survey to 1,055 adult Internet users who resided in the United States
    in June 2016. The full report What the Public Knows about Cybersecurity concludes
    that the majority of respondents failed to answer the 13 questions accurately,
    with an average of 5.5 correct answers. Most Americans may not be certain on how
    to address cybersecurity or have enough knowledge of cybersecurity protection
    (e.g., strong passwords or imposed risk in using public WiFi) especially key technical
    cybersecurity concepts, such as botnet, VPN, and two-factor authentication (Olmstead
    and Smith 2017). This signifies that most users with smart devices and connected
    to the Internet are at higher risk of cybersecurity threats.'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'In addition, a 2017 National Cybersecurity Alliance (NCSA) survey revealed
    that a cybersecurity/privacy knowledge gap exists between teens and their parents.
    More than one-third of teens feel that they know more than their parents about
    cybersecurity/privacy issues. These statistics concur that there is an urgent
    need to increase the cybersecurity literacy level of the general public in the
    United States (Furnell and Moore 2014).


    Cybersecurity seems to be a far-reaching subject for non-IT professionals due
    to technical jargon and how it was positioned solely as a technological domain
    within computer science, networking, and engineering. However, common knowledge
    of security and privacy is part of the foundational understanding in cybersecurity.
    It is critical to have both technical and soci behavioral knowledge of cybersecurity
    in our increasingly interconnected society. The goal of this chapter is to navigate
    the different levels of efforts to cybersecurity education and workforce development
    across the United States. For information professionals, the iSchools in North
    America are selected examples on how their programs are meeting the interdisciplinary
    need of cybersecurity training and education. We further analyze the alignment
    of iSchools cybersecurity curriculum with the NICE Cybersecurity Workforce Framework.
    At the end, we examine the major opportunities and challenges for information
    professionals, iSchools, and the future development of cybersecurity education.


    # Cybersecurity Workforce Development and Training


    A recent (ISC)² Cybersecurity Workforce Study (2018) shows that there are approximately
    three million cybersecurity jobs unfilled globally. The study identifies the most
    needed cybersecurity areas of expertise in eight different areas: security awareness,
    risk assessment/analysis/management, security administration, network monitoring,
    incident investigation and response, intrusion detection, cloud computing security,
    and security engineering. It is noteworthy that the first three areas of expertise
    are not technical but focus on the management and administration within an organization.
    This indicates that cybersecurity professionals do need to be aware of social,
    political, economic, and criminological issues (Leaning and Averweg 2019). The
    same survey also asks the cybersecurity professionals to self-evaluate the top
    areas where they need to enhance and improve over the next two years based on
    their current expertise and future demand. The areas where cybersecurity professionals
    feel that they need to grow the most are: governance, risk management and compliance
    (GRC), security analysis, risk assessment/analysis/management, and security engineering.
    Other top areas where they do not have high expertise and want to improve are
    cloud computing security, penetration testing, threat intelligence analysis, and
    forensics. The job title and description of a cybersecurity professional vary
    by'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'companies and settings. This diverse view on what a cybersecurity professional
    is could contribute to misalignment of skilled labor to work market. According
    to the U.S. Bureau of Labor Statistics, Occupational Outlook Handbook (2019),
    information security analysts fall within the computer and information technology
    occupations. The main role of an information security analyst is to implement
    computer and network security measures for an organization and their roles are
    expanding. One aspect of security is to develop emergency or disaster recovery
    plan of the information system and technology for an organization with a focus
    to protect their digital assets. This description characterizes some aspects of
    cybersecurity tasks for a security professional. However, there are other job
    titles and description of what cybersecurity professionals do on a regular basis.
    For examples, security analyst, cryptographer, chief information security officer,
    or security consultant are common job titles used in for recruitment. One example
    of a cybersecurity position with specific certification and training is ISSO.
    ISSO stands for information system security officer. This particular position
    will require knowledge in federal certification and accreditation (C&A) processes
    and is often the contact person for system security plans and plans of action
    and milestones. The following sections will further discuss the different levels
    of training and education for cybersecurity.


    # # Cybersecurity Education Initiatives


    # ## National-Level Cybersecurity Centers and Initiatives


    There are two major academic centers in the United States that provide guidance
    on training and education for cybersecurity in the country. The National Centers
    of Academic Excellence in Cyber Defense Education (CAE-CD) focuses on cyber defense
    program in higher education and research (CAE-R). Any regionally accredited community
    colleges, four-years universities and graduate-level institutions can apply for
    the CAE-CD, CAE-2Y, or CAE-R designations for their academic program by meeting
    the rigorous criteria and regulations. The National Centers of Academic Excellence
    in Cyber Operations (CAE-CO) supports the President’s NICE to broaden the technical
    training of skilled workers in supporting a cybersecurity nation (NSA, CSS n.d.).
    Their designation program is applicable to undergraduate and graduate programs
    with an emphasis in computer science or computer engineering.


    # ### K-12 Education and Cybersecurity Initiatives


    Traditionally, computer and network training falls under the Career and Technical
    Education (CTE) program for majority of the American public school. This type
    of program emphasizes on vocational training for students who do not plan to enter
    a four-year university after high-school graduation. Due to the STEM'
  merge: -1
  img_proc: true
- pgno: 79
  md: 'education movement and initiatives, many public schools or traditional college
    preparatory attempt to bring science, technology, and engineering programs into
    the general curriculum. Other schools may utilize their existing CTE program with
    modification to increase choices and pathways for students to take computer science,
    technology, and engineering courses. Computer science, coding, and robotics programs
    are penetrating many public schools at the elementary and middle school level.
    They focus on increasing students’ interest in STEM and customize pathways to
    encourage students to consider a career in STEM as early as possible. Cybersecurity
    is considered a subtopic in relation to the study of computer science and network
    security in the CTE curriculum. Within K-12 education, cybersecurity education
    initiatives are supported by different agencies at the national, state, and local
    level. For example, the United States Department of Homeland Security (DHS) Cybersecurity
    Education Training Assistant Program (CETAP) provides K-12 teachers cybersecurity
    curricula and tools for teaching this subject (DHS, NICCS 2019). At the local
    or state levels, efforts are in place to establish cybersecurity as a core subject
    with specific curriculum and relevant teacher training to implement it in a regular
    classroom. The NICE K-12 Cybersecurity Education host their annual conference
    since 2017 to discuss education, training, and other needs for all stakeholders
    within K-12 settings (NICE 2019). There is a growing need of cybersecurity curriculum
    for students in the classroom as well as training for teachers to implement those
    programs. The school staff and other technology personnel who interact or manage
    the school information systems also should be trained to handle possible cybersecurity
    threats.


    # Community College or Technical School


    There are different levels of effort to address the workforce and training needs
    at the postsecondary level, especially in community colleges and technical schools.
    In 2002, the National Science Foundation (NSF) and the American Association of
    Community Colleges (AACC) hosted a three days’ workshop to discuss the role of
    community colleges in cybersecurity education and training of cybersecurity professionals
    at all levels (AACC 2002). This event covered seven major themes: trustworthy
    computing, cybercrime, foundations of cybersecurity curricula, cybersecurity literacy,
    current cybersecurity courses and curricula, hiring cybersecurity professionals,
