    # 12.3.3.1 Threat Modeling


    Threat modeling is a proactive process of identifying threats to assets, assessing
    them, and then designing countermeasures to mitigate them. There are several threat
    models that have been developed and some of them include Microsoft Threat Model,
    Trike, OCTAVE, Generic Threat Model, and OMG Threat Model (Alberts et al 2003,
    Meier et al. 2003, OWASP 2018a).


    A threat is any circumstance or event with the potential to adversely impact organizational
    operations and assets, or individuals, through an information system through modification
    of information, unauthorized access, destruction, disclosure, or and/or denial
    of service. The first step is to identify threats that might damage the software
    product, and then to identify the vulnerabilities responsible for the threats.
    The next step is to assess the impact of those threats if they were to be realized.
    Quantitative ranking techniques such as Microsoft’s STRIDE and DREAD (Meier et
    al. 2003) can be used. OWASP identifies a process for assessing the likelihood
    of threats in a generic risk model (OWASP 2018a) that uses a qualitative approach
    for ranking threats. The approach of this model is the calculation: risk = likelihood
    × impact. Likelihood is the possibility of the attack, and impact is a combination
    of factors ranging from reputational and financial impact to systems impacts.
    After ranking the threats, countermeasures must be developed for those threats
    whose risk ranking is unaccaptable, especially those that are ranked as high risk
    and medium risk. However, all risks should be addressed while taking into account
    the costs and benefits considerations.


    # 12.3.3.2 Secure Design Considerations


    As the architecture and design of the application are defined, security considerations
    should be assessed. The architecture should be assessed from both a security perspective
    and a performance perspective. It is in this phase that hard-to-correct security
    problems can be fixed at the time they are easiest to address and less costly.
    When addressing vulnerabilities, the basic concept behind each vulnerability and
    attack needs to be understood in order to create a secure design. The design can
    be constructed while keeping in mind all the security prerequisites of the application.
    Then the detailed design specifications are created that show developers exactly
    which security controls must be included and how the components will interact
    with the overall application. You should also develop the security test plans
    and misuse cases that will be used during the testing phase.'
