- pgno: 97
  md: 'management, compliance, and regulations. The convergence of privacy and security
    in cybersecurity education will yield significant benefits to the workforce preparation
    and allow current professionals to develop collective solution at work. The work
    roles with higher counts (counts >= 20) in Table 4.8 seem to fall into two categories:
    Oversee and Govern and Securely Provision. Other top five work roles include Information
    Systems Security Developer, Security Architect, Security Control Assessor, and
    Systems Developer, which are in the category of Securely Provision. Several work
    roles (with counts between 16 and 20) are also worth noting, such as Information
    Systems Security Manager in Oversee and Govern as well as Enterprise Architect
    and Systems Requirements Planner in Securely Provision. These identified work
    roles required both technical and nontechnical competency; particularly, the role
    of an enterprise architect involves aligning business processes with IT and system
    security, which require facilitation between the IT professionals and non-IT professionals.


    # Mapping to Specialty Areas


    Cybersecurity is multifaceted, multidisciplinary, and interdisciplinary due to
    the nature of its complexity. Different disciplines focus their work in a specific
    area, but they also interact with other specialty area. Based on the key search
    activity, the results of matched Tasks and KSAs to the category and specialty
    areas are displayed in Table 4.9. The top three specialty areas by counts include
    Legal Advice and Advocacy, Program/Project Management and Acquisition, and Systems
    Development. Digital Forensics, Cybersecurity Management, Risk Management, and
    Security Architecture appear to be emerging specialty areas that are also a focus
    in the curriculum. The patterns unveiled in specialty areas with their categories
    are consistent with the previous findings in which Oversee and Govern and Securely
    Provision are the two major workforce categories. This observation reflects the
    iSchools UC Berkley School of Information current focus on competency development
    in specialty areas for cybersecurity.


    Using the NICE Cybersecurity Workforce Framework to map the represented keywords
    and concepts from the MiCS cybersecurity curriculum help us gain insight into
    what has been taught from one of the iSchools, UC Berkeley School of Information.
    The mapping activity of the keywords with the NICE Framework Tasks and KSAs supports
    the understanding of cybersecurity education emphases and possible direction for
    future development. Other specialty areas from the NICE framework (e.g., Training,
    Education, and Awareness in Oversee and Govern; Data Administration and Knowledge
    Management in Operate and Maintain; All-Source Analysis, Threat Analysis, Language
    Analysis in Analyze) can also provide work-related opportunities for information
    professionals who would like to develop their career horizontally or vertically.'
