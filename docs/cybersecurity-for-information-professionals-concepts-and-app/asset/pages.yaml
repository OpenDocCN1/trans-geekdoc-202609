- pgno: 124
  md: '# Pretraining


    It is interesting to note that this principle is already used frequently by game
    developers in the form of tutorials or linear introduction levels where the game
    introduces or demonstrates a concept, for example, that the “A” button will make
    your game character jump, then players have to immediately use this new information
    to advance to the next level.


    Similarly, the process of threat modeling is greatly enhanced by the introduction
    of core concepts like risk, impact, and probability before they being hands-on
    in game coursework.


    # Modality


    Through controlled experiments using educational video games, researchers have
    found information presented by voice rather than on screen text shows strong evidence
    for increased memory retention. This, coupled with the coaching principle, is
    a great reason to keep your class sizes small and interactive. Speaking from personal
    experience, one of the best aspects of teaching in a video-game-enhanced classroom
    is the instructor’s ability to see, translate, and share design ideas as they
    happen, without asking students to break away from the activity itself.


    # Personalization


    One of the easiest ways to leverage video games within a security education context
    is to pick a game that is easy to customize and speak in a conversational style.
    Minecraft is a great example of this because it allows players to not only build
    large structures block by block, but also modify the exterior environment to fit
    their needs. Similarly, asking students, and especially youth, to directly apply
    security knowledge or practice new security techniques like threat modeling to
    their personal life is much easier than bringing forward case studies about historic
    data breaches affecting millions of users.


    At the same time, be aware that casually mentioning cyberthreats like online bullying
    and harassment are an extremely sensitive subject for those who have experienced
    it, especially in library workshop settings where participants are less familiar
    with each other. It is possible to overpersonalize, and given the norms established
    in most library settings around privacy and anonymity, you may want to begin classes
    or training sessions with a reminder to respect these boundaries.


    # Future Development


    While Minecraft is not a new player in the world of youth and youth education,
    there are still many avenues for cybersecurity education to take place within
    the'
  merge: -1
  img_proc: true
- pgno: 125
  md: 'meta-framework of the game universe both online and offline. My primary goal
    has been to introduce the concept of threat modeling to youth using a systems
    design thinking methodology where students are tasked with building a fort or
    home base in the game and then reflecting on weaknesses in their initial design.
    Quite literally, they are building out a mental model mimicking security layers
    like firewalls and encryption in 3D space to better understand how security layers
    interact with one another and identifying ways to mitigate the impact of security
    events at these different layers. But this is only one example of how Minecraft
    gameplay could be leveraged to introduce cybersecurity concepts to younger audiences.
    In the process of all this, I have found a few more areas that could be generalized
    to fit newer games.


    *Social engineering* is extremely common in most MMO games, ranging from wide
    scale market manipulation effecting the game world economy to a wide range of
    scams that occur inside and outside of the game. With MMOs it is not uncommon
    for high-score accounts to be bought and sold on auction sites, which incentives
    phishing scams and other attacks meant to compromise an account.


    *Network security principles* and common threats could be demonstrated through
    simulated attacks on a game server. Why care about distributed denial of services
    (DDOS)? This is very easy to understand when a DDOS attack is directed at a server
    the class is using or attempting to use. There are several teachable moments here.


    *Cryptography* could be explained in the context of multiplayer chat and demonstrated
    through rating the various means of communication players have available. Is it
    more secure to send encrypted messages over in-game chat, or to sit next to the
    person you are playing the game with and talk in the open? The answer really depends
    on context, and often there is no perfect solution. Exploring the pros and cons
    of end-to-end encryption versus offline communication requires a nuanced understanding
    of both, which is easier to explore in the context of game play rather than spy
    thrillers and trade craft we often see in action adventure films and spy thrillers
    starring James Bond.


    *Risk management* could also be expanded to go beyond just the process of threat
    modeling and more toward the real-world application of business resources to solve
    or mitigate security problems. There are many real-time strategy (RTS) games which
    task players with collecting, managing, and distributing resources based on environmental
    factors which could be utilized to illustrate these principles. RTS players already
    use these skills in rapid succession, and “anchoring” their skills in a different
    field like cybersecurity could open up whole new career pathways.


    *Man in the middle attacks (MITM)* are similar to how many computer memory or
    game-data editor-based cheats function, but on the network scale versus hardware
    scale. Instead of intercepting communication between computers or end nodes, these
    cheats demonstrate the power granted by editing data in real time, tricking the
    system into doing something it was not intended to do by delivering tampered information.'
