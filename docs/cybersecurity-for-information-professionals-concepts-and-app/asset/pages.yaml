    # # Malware in Singaporean Health Records Database


    In a separate unexpected attack in 2018, cybercriminals broke into a Singaporean
    health records database, SingHealth, and took the names and addresses of approximately
    1.5 million medical patients, and the names of medicines dispensed to some of
    these patients. This breach occurred via malware through which the cybercriminals
    gained access to the personal health data. Just this year alone, numerous other
    nation-states claimed some of their governmental agencies have been hacked by
