    The top 10 issues can be grouped into five major categories. The first is exploiting
    the wrong use of Web platform feature or exploiting extraneous functionality,
    like a backdoor, by injecting malicious code (#1 and #10). The second is insecure
    data storage and insufficient malicious code (#2 and #5), which could cause a
    data breach. Data storage and cryptography should go hand in hand because solid
    cryptography principles and techniques can secure data storage. Encryption is
    one of the key components in cryptography, as well as an effective data security
    technique. The third is insecure authentication and authorization (#4 and #6),
    which could lead to unauthorized access and use. Authentication and authorization
    are two essential elements in identity and access management. While authentication
    verifies user identity at system login, authorization determines the user role
    or permission to access the system. The fourth is insecure communication and reverse
    engineering (#3 and #9); these pertain to authentication compromise. The fifth
    is poor code quality and code tampering (#7 and #8); they could influence the
    executing and running of code. Though several categories relevant to platform,
    communication protocol, reverse engineering, and coding might not be controlled
    by the mobile users, mobile app developers and mobile users can select the apps
    and the services that provide secure data storage/authentication/ authorization
    and use strong cryptography.


    # Mobile Users’ Security Behavior


    Mobile devices are exposed to greater risks than are personal computers (McGill
    and Thompson 2017). According to Symantec Corporation (2019), 55% of Internet
    traffic involves mobile devices, which increases the likelihood of mobile users
    being targeted by cyber criminals. The advances of mobile technology and applications
    have been the focal points of the research community. However, research on mobile
    users’ security behavior is still in its nascent state (Verkijika 2018). Protecting
    mobile devices against cybersecurity threats requires considering both human and
    technological'
  merge: -1
  img_proc: true
- pgno: 235
  md: 'factors (Alsaleh, Alomar and Alarifi 2017). A socio-technical perspective of
    cybersecurity accounts for cybersecurity issues from both people and technology
    aspects, not just technology alone. Drawing on such a perspective, we can balance
    the understanding of both technical and social challenges in relation to mobile
    cybersecurity and find feasible ways to address them.


    # # User Interactions with Mobile Apps


    The life cycle of mobile apps involves five stages: install, update, uninstall,
    open, and close (Böhmer et al. 2011). Unless the apps were pre-installed in the
    mobile device, a user has to initiate the installation. What are the major factors
    that drive a user’s installation of an app? A recent study reports that trust
    and security of the mobile applications significantly influence users’ intention
    to install mobile applications, while risk and privacy have rather insignificant
    effects on users’ intention of installations (Chin, Harris and Brookshire 2018).
    It is worrisome that users seem to over-trust the public app store; therefore,
    perceived risk and privacy concerns play unimportant roles in users’ intent to
    install mobile apps. A survey comparing the Android and iPhone users’ security
    and privacy awareness shows that Android users appear more conscious of the security
    and privacy risks than iPhone users while adopting a new app (Reinfelder, Benenson
    and Gassmann 2014). The reason might be that Apple App store has more rigorous
    review processes than Google Play store; thereby, their users tend to trust the
    apps reviewed by the Apple App store and worry less about the potential privacy
    and security risks. In addition, most users do not have the good security habit
    of updating their mobile device as soon as a new operating system (OS) version
    is available. Consequently, OS vulnerabilities become the most common mobile device
    threat (Pradeo Lab 2018).


    Interestingly, regardless of the number of apps installed, mobile users only pay
    attention to several apps they installed for major tasks, and the main user-mobile
    phone interactions occur in social apps (Jesdabodi and Maalej 2015). As social
    apps have access to users’ personal sensitive information and data stored in the
    mobile devices and the third party cloud platforms, users need to be cautious
    about data breach issues since unintentional data leakage through mobile applications
    has been identified as the number-one threat to organizations; location coordinates
    as well as contact lists are the most leaked private data (Pradeo Lab 2018). Malicious
    apps are often camouflaged with social or gaming apps taking different forms to
    gain access to users’ data or information. Four primary types of malicious mobile
    apps identified by the application security company include: (1) Spyware: tracking
    user location and mobile activities, (2) Trojans: appearing legitimate but designed
    to disguise its dangerous intent, such as taking control of the device or stealing
    personal data/information, (3) Phishing links: tricking users into fake websites
    similar to the original ones to steal user credentials, and (4) Hidden processes:
    running in the'
  merge: -1
  img_proc: true
- pgno: 236
  md: 'background of the mobile device as certain actions are initiated, for example,
    launching a bank app (Veracode n.d.). Spyware and Trojans are common forms of
    malicious software (i.e., malware) and could be the tools used for technical cybercrimes
    (Martens, De Wolf and De Marez 2019). It is worth noting that mobile scams through
    phishing links involving social interactions can be disseminated by cyber criminals
    via social media or SMS (Symantec Corporation 2019).


    # Mobile Users'' Security Awareness and Behavior


    A hierarchical taxonomy of mobile users'' security awareness, developed by Bitton
    et al. (2018), provides a socio-technical overview of users'' mobile security
    behavior; it combines technical and psychological dimensions to measure the security
    awareness of smartphone users. The four technological focus areas and ten sub-focus
    areas of the taxonomy encompass: (1) Applications (application installation/handling),
    (2) Browsing and Communication (browser, virtual communication, and accounts),
    (3) Communication Channels (networks and physical channels), and (4) Device (operating
    system, data privacy, and security systems). The technical focus areas in this
    taxonomy align with the elements illustrated in the mobile ecosystem, except for
    Browsing and Communication, which involve user interaction with the interfaces
    of browsing and communicating. Bitton et al. (2018) note that the abovementioned
    technical focus areas could change over time due to the ongoing development of
    new mobile technologies and threats. The other part of the taxonomy centers on
    a user''s psychological dimensions and sub-dimensions, ranging from attitude (perceived
    probability of a threat, perceived severity of a threat, and perceived usefulness
    of recommended behavior) to knowledge (declarative knowledge and procedural knowledge)
    to security behavior (preventive behavior and confronting behavior). This taxonomy
    indicates that mobile users'' interactions with those technical components are
    driven by their attitude, knowledge, and security behavior.


    From a psychological perspective, Kraus, Wechsung and Möller (2017) suggest that
    security is not the only or even major motivation that steers users'' security
    and privacy actions on smartphones. They recommend considering other psychological
    needs (e.g., meaning, stimulation, autonomy, and competence) when designing security
    and privacy features for smartphones. In this sense, while organizing user training
    or awareness programs for promoting mobile security, designing a motivational
    intervention accounting for psychological needs can be more effective than a regular
    intervention without a psychological component. In a recent study on extending
    the protection motivation theory in the context of smartphone security, anticipated
    regret, a common emotion in decision making, is considered as a mediator between
    users'' threat perceptions and security intentions/behaviors (Verkijika 2018).
    The study results demonstrate that users'' perceived vulnerability and perceived
    severity have a positive effect on anticipated regret, while self-efficacy'
  merge: -1
  img_proc: true
- pgno: 237
  md: 'and anticipated regret directly impact smartphone security intentions. Thus,
    anticipated regret and security intentions positively influence smartphone security
    behaviors.


    There are two general types of mobile security behaviors: preventive behavior
    refers to the user’s actions to reduce risk, whereas confronting behavior relates
    to the user’s actions while facing a security risk (Bitton et al. 2018). Although
    installing mobile security tools could be a good preventive behavior to protect
    users from malware and viruses, not every tool can guarantee perfect protection
    (AV-Test 2018). Several organizations, like Virus Bulletin, a member of the Anti-Malware
    Testing Standards Organization (AMTSO), and AV-Test Institute, evaluate anti-virus
    software for computers and mobile devices, and make the reports freely available
    to the public. Mobile users are encouraged to remain informed of current anti-virus
    and anti-malware software for protecting mobile devices.


    # Smartphone Security Best Practices: Protecting Security at Every Layer


    Benjamin Franklin’s famous quote, “An ounce of prevention is worth a pound of
    cure,” was intended to raise the awareness of fire prevention (UShistory.org.
    1995). However, his foresight axiom is very relevant to cybersecurity and can
    be applied to cybersecurity prevention and intervention. When it comes to mobile
    cybersecurity prevention within a multi-stakeholder ecosystem, the stakeholders
    need to share their responsibilities and protect mobile security at every layer.
    Only by working together can we make achieving this goal possible. We can start
    as mobile phone consumers to do what we need to do to strengthen the weakest (human)
    link.


    Layered security is a concept combining multiple types of security measures and
    posture, which helps to protect against different attack vectors (see Table 10.1).
    The more security measures in place, the more difficult for attackers to hack
    into the mobile system.


    Compared to other mobile devices, smartphones have become indispensable in most
    people’s daily life. With smartphones, mobile users can perform multitasks efficiently,
    including writing emails, surfing on the Internet, listening to podcasts/radio/music,
    using social media/networking apps to catch up with family and friends, playing
    mobile games, and so on. The more versatile the smartphones become, the more likely
    they will gradually replace certain roles that personal computers and laptops
    play in our work and personal life. However, the capability of smartphones supporting
    both voice and data communication makes users face the daunting risk of disclosing
    personal data or information that is mostly unprotected. The largest barrier of
    smartphone security is that users are often prone to focus on the convenience
    and overlook the mobile security and privacy concerns, compared to computer security.
    The reason might be that mobile users still view their smartphone as a conventional
    mobile phone and remain unaware of the multiple layers'
  merge: -1
  img_proc: true
