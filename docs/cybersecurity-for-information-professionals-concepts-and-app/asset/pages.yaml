    # # Data, Information, and Knowledge Privacy


    Horizon technologies will affect data, information, and knowledge privacy. Although
    the tools to manipulate big data (including capturing data, data storage, data
    analysis, search, sharing, transfer, visualization, querying, updating, preserving)
    are improving by the hour, the top big data challenges include information privacy.
    Jail (2016) noted that as more and more medical devices are designed to monitor
    patients and collect data, there is great demand to be able to analyze that data
    and then transmit it back to clinicians and others. With increasing adoption of
    population health and big data analytics, we are seeing greater variety of data
    by combining traditional clinical and administrative data with unstructured notes,
    socioeconomic data, and even social media data. All these will only lead to increasing
    velocity of big data and presents data security challenges, as sensitive data
    can be anywhere – and there everywhere.


    Tene and Polonetsky (2019) – among other privacy advocates and data regulators
    call for the development of a model where the benefits of data for businesses
    and researchers are balanced against individual privacy rights. This presents
    us with what Janes (2018) calls a classic balancing act: for instance, taking
    advantage of what libraries could learn from their communities’ habits, tastes,
    and activities without crossing the line into what would be perceived as misuse
    of personal data.


    A cornerstone value that library personnel perpetually promote is patron privacy.
    This value stems from the Association for Research and College Libraries (ACRL)
    and the American Library Association (ALA) – promoted fundamental right to have
    one’s research, checkouts, search history, and other library conduct remain confidential,
    unless otherwise consented to by a patron. ACRL and ALA’s privacy perspective
    supports current US law opined in the US Supreme Court case, Olmstead v. U.S.,
    277 U.S. 438 (1928), which conveys one of the most comprehensive rights free people
    have is the right to be left alone. The ALA Bill of Rights (ALA Library Bill of
    Rights 2018) additionally suggests a lack of privacy'
