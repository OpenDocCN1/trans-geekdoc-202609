  img_proc: true
- pgno: 189
  md: 'point for machine learning. What users share on social media, sometimes is
    held against them and they are judged for their interactions and behaviors. Users
    have their own intentions behind every post and machine learning-based knowledge
    may expose quite different meanings, which is often times terrifying.


    Online security awareness is mandatory in every sector. Users may think of quitting
    social media platforms. However, their voices against social media malpractices
    can bring better solutions. At the same time, state and governments need to place
    appropriate regulations to protect user information. Adequate laws and orders
    can hold offenders and platforms accountable for deceptive activities. It is the
    duty of social media companies as well as to ensure safety of its users. Their
