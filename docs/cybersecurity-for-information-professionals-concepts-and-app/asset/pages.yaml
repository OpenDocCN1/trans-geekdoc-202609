- pgno: 59
  md: '# Chapter 3


    # User Privacy and Security Online: The Role of Information Professionals


    Mohammed Nasser Al-Suqri, Salim Said AlKindi, and Naifa Eid Saleem


    Department of Information Studies, Sultan Qaboos University


    # Overview


    Ensuring the privacy of library users and providing a safe and secure environment
    in which to seek and use information resources have always been central values
    for information professionals, and encapsulated in guidelines and codes of practice
    issued by the International Federation of Library Associations (IFLA) and those
    of library associations around the world. The ability to adhere to these values
    in day-to-day work, however, is being threatened by the new information environment,
    in which users use library computers to search for and use information resources
    online via web search engines, or to access the Internet for other purposes such
    as online banking, paying bills, or accessing e-government services. In this context,
    information professionals face new challenges in their endeavors to protect the
    privacy and security of library users.'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'Growing threats to the online privacy and security of library users include
    government monitoring and surveillance of online activity in the name of national
    security legislation: the collection of personal data by third-party organizations
    for marketing purposes; and the illegal hacking of online information systems
    for criminal purposes, as well as the online “footprint” left by information system
    users which can potentially be seen by library staff, IT specialists, or others
    with access to the system. The chapter discusses these increasing threats to patron
    privacy in the online information environment, and identify what information professionals
    and library associations can do and are already doing to maximize the privacy
    and security of users in the new electronic information environment. Three important
    roles in particular are identified and discussed: promoting digital literacy,
    which includes ensuring that users understand threats to privacy and take appropriate
    steps to minimize these when seeking information online; working with IT specialists
    to develop and implement secure online information systems; and acting as political
    advocates for the privacy and confidentiality of library users in the face of
    increasing regulation which potentially contravenes these values. The chapter
    concludes with a number of key recommendations for ways in which librarians and
    other information professionals can help maximize the privacy and security of
    users online, while reconciling this with other important values such as freedom
    of access to information.


    # Growing Threats to User Security and Privacy in the Online Information Environment


    A diverse range of factors threatens the security and privacy of users when searching
    and using online services and resources in libraries. These present information
    professionals with unprecedented challenges to protect users and uphold the key
    values of the information profession. A review of relevant literature revealed
    some of the main factors or trends that are presenting new risks to the privacy
    or security online library users, as discussed in this section.


    First, government surveillance of online activity, ostensibly for purposes of
    protecting national security or combatting terrorism, has become widespread (Fortier
    & Burkell 2015; IFLA 2016a). There is often a lack of transparency about this
    surveillance, with individuals having no idea that their online activities are
    being monitored. However, this is not a new threat facing libraries: in the United
    States, surveillance of library users has often been a practice of the FBI for
    counter-intelligence purposes during times of perceived threats to national security.
    Matz (2008), for example, refers to the Library Awareness Program of the FBI in
    the 1980s, which used library records to monitor the reading habits of individuals
    with Russian or Slavic sounding names. The extent of government surveillance of
    individuals in the United States and worldwide was also famously'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'revealed by Edward Snowden, the former CIA employee and federal government
    IT contractor, who in 2013 leaked National Security Agency information about mass
    online surveillance programs (Clark 2016).


    In many countries including the United States since the passing of the Uniting
    and Strengthening America by Providing Appropriate Tools Required to Intercept
    and Obstruct Terrorism Act of 2001 (USA PATRIOT Act), libraries are required to
    provide detailed information on patron activity if requested to do so under a
    court order, and to unencrypt this if necessary (Kim 2016). In the face of such
    legislation and surveillance activities, information professionals can no longer
    offer the guarantees of privacy and anonymity to library users, which were once
    possible, especially as users are increasingly using online search engines such
    as Google over which librarians have little control (Pekala 2017) rather than
    traditional library databases and catalogues.


    Second, as libraries themselves increasingly provide digital services and resources
    and often collaborate with others to establish extensive shared electronic networks,
    this also increases the risks to user privacy and security. A large number of
    actors are typically involved in establishing and maintaining such networks, often
    including private vendors, and it becomes more difficult to secure systems or
    identify when user activity is being monitored by third-party organizations. A
    major breach of the privacy and security of library users was committed by the
    company Adobe, which collected data on the activity of individuals who used their
    Digital Editions 4 (DE4) software to read e-books online. It was reportedly sent
    in unencrypted form to Adobe, enabling anyone monitoring web traffic to see the
    information (Gallagher 2014).


    Researchers have found that third-party vendors who supply digital content to
    libraries often have unclear or limited privacy policies which are not of the
    standard typical of libraries in the past (Klinefelter 2016). Furthermore, cloud-based
    or Library 2.0 services such as BiblioCommons are increasingly being adopted by
    libraries. These use new business models in which basic services are provided
    free of charge to users but which are funded through data-driven advertising which
    requires the collection of personal data (Zimmer 2017). User activity is tracked
    and analyzed so that personalized advertising or recommendations can be provided
    to individuals and used in understanding overall user trends, as described in
    the “IFLA Statement on the Right to be Forgotten” (IFLA 2016b). In this new business
    environment, multiple parties collect and share data about online activity for
    marketing purposes, and may also sell this data to brokers who in turn sell it
    on to other parties who may use this data for legitimate marketing purposes or
    for criminal activity (Kim 2016; Pekala 2017). Libraries themselves are increasingly
    collecting and using information about their users in order to provide personalized
    recommendations or services tailored to the needs of their target population (Hahn
    2017). This sometimes involves interacting with users on social media in ways
    that may also compromise their privacy.'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'Breaches of personal data can also occur due to gaps in network security on
    library systems, when a system becomes infected by a virus, or as a result of
    users becoming victims of phishing scams (Kim 2016). Third parties with malicious
    intent might intercept information being transmitted across the Internet, especially
    when using wireless networks or when this is not fully encrypted (Breeding 2015).
    It was reported in 2017 that one hacker had breached the security systems of libraries
    in more than 60 leading universities and other institutions in the United States
    and the United Kingdom, such as Cornell University, Purdue University, the University
    of Oxford, and the University of Cambridge (Osborne 2017). The risk of hacking
    is of particular concern when library users take advantage of the availability
    of library computers and Internet access to use online services such as banking,
    e-government, and online shopping or to interact on social media sites (Massis
    2017). While in many settings this is contributing to a narrowing of the digital
    divide between those with Internet access at home and those without, the risks
    to their security are typically greater in the public library setting.


    Overall, these security risks are increasing as new technologies evolve and are
    adopted by libraries. Hahn (2017), for example, discusses the likely impacts on
    library users as the Internet of Things (IoT) disrupts technologies currently
    being used by libraries. In this development, minuscule technologies that gather
    and transmit data are being embedded in nearly all types of items and devices,
    even including library books, for example, with benefits such as the ability to
    track borrowing or personalize recommendations to users. However, this is another
    development which has implications for user privacy, since individuals often have
    no idea that their activities are being monitored by new interconnected technologies,
    and for user security, since the developments also often increase the potential
    for malicious hacking. Privacy and security become more difficult for libraries
    to protect due to the many third-party tools and service providers typically involved
    in the interconnected systems comprising the IoT (Hahn 2017).


    # Privacy and Security as Key Values of Information Professionals


    Information professionals have both ethical and legal responsibilities to ensure
    the privacy and security of their users. These are historically important responsibilities,
    which are encapsulated in the core values of the profession as set out in professional
    policies and codes of practice. For example, the American Library Association’s
    (ALA) Code of Ethics states “We protect each library user’s right to privacy and
    confidentiality with respect to information sought or received and resourcs consulted,
    borrowed, acquired or transmitted” (2008). Similarly, the IFLA Code of Ethics
    identifies respect for personal privacy, protection of personal data, and confidentiality
    as core principles underpinning the relationship between libraries and their users
    (IFLA 2015).'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'Traditionally, such provisions have been intended to ensure that library users
    can browse the library collections and use resources anonymously or at least be
    assured of confidentiality of their user records. In recent years, these professional
    codes and guidance have been evolving to reflect the changing information environment
    and to ensure that information professionals can best protect the users of online
    library services and resources against threats to their security and privacy.
    For example, the “IFLA Statement on Privacy in the Library Environment” (IFLA
    2016a) recommends that libraries limit or abstain from collecting personal data
    that would compromise privacy, and also educate staff and users about how to protect
    their privacy and security online, while the ALA’s “Policy Concerning Confidentiality
    of Personally Identifiable Information about Library Users” (ALA 2004) specifies
    that personal information relating to the searches and the use of library services
    and databases must be protected from unauthorized access, including access by
    government agencies unless a warrant is provided.


    Information professionals also have a legal responsibility to ensure that relevant
    legislation relating to the privacy of personal data is observed. For example,
    the European Union’s General Data Protection Regulation, which came into force
    in May 2018, requires all organizations to provide full disclosure of data held
    on EU/EEA citizens and obtain the personal consent to this by the individuals
    concerned. EU/EEA citizens are covered by this law even when living in or visiting
    other countries, which means that libraries worldwide, along with other organizations
    which hold personal data on their customers or users, must abide by this law and
    seek consent to the storage and use of this data as well as ensuring that the
    required measures are in place to protect the data from unauthorized access and
    use (Cox 2018).


    At the same time, the new information environment in which library users rely
    heavily on online services and resources is presenting potential value conflicts
    for information professionals, especially between the core values of protecting
    user privacy on the one hand and ensuring freedom of intellectual access and preserving
    the historical record on the other. Intellectual freedom has always been a cornerstone
    value of libraries, a point recently reiterated by IFLA in its Global Vision Report
    Summary which states that “no value was more highly rated than a commitment to
    equal and free access to information and knowledge” and “We must be champions
    of intellectual freedom” (IFLA 2018b, p. 1). But measures such as website filtering
    tools or government surveillance of the online behaviors of library users often
    hinder intellectual freedom and introduce elements of political control over the
    activities of library users in ways which clash with the fundamental principles
    of information professionals.


    In the face of these growing and largely unprecedented challenges and value conflicts
    facing information professionals, a number of important ways in which this group
    can help protect the security and privacy of library users, while also maximizing
    intellectual freedom, can be identified and are discussed in the'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'following sections. Specifically, these are defined as promoting digital literacy,
    implementing technical solutions, and political advocacy.


    # Promoting Digital Literacy


    Since complete privacy and user security cannot be guaranteed in the online information
    environment, one of the most important roles of information professionals is to
    ensure that users are provided with adequate information and understanding about
    threats to their online privacy and security and how to protect themselves from
    these. These types of knowledge and skills are an important component of what
    is often referred to as digital literacy, or the “the ability to use information
    and communication technologies to find, evaluate, create, and communicate information,
    requiring both cognitive and technical skills” (ALA 2013). Although this embraces
    a broad range of skills required to effectively access and use information online,
    an increasingly important component of digital literacy involves awareness of
    cybersecurity issues and risks to personal privacy when using the Internet, as
    well as the methods and tools that are important in protecting oneself from these,
    as set out in the “IFLA Statement on Digital Literacy” (2017a).


    There are several main components to the role of information professionals in
    promoting digital literacy skills that enable users to protect themselves online:
    1) Developing and disseminating clear privacy policies which are tailored to the
    online information environment; 2) providing users with information and guidance
    about the threats to their online privacy and security and how to protect themselves
    against these, and also about their rights with regard to privacy and intellectual
    freedom when using online services and resources, and 3) promoting privacy literacy
    and cybersecurity literacy through participation in conferences and workshops,
    in which best practices are shared within the profession and with other key stakeholders
    such as human rights organizations and government representatives.


    Researchers have highlighted the importance of reviewing and updating library
    privacy policies to ensure that these reflect aspects of the new information environment
    and the new privacy risks associated with this environment (e.g., Hahn 2017; Klinefelter
    2016). These may relate, for example to the use of cloud-based services and the
    ways in which online activity may be monitored by a range of parties. A range
    of measures for improving an individual’s ability to stay safe when using the
    Internet are set out by Henning (2018) and might be incorporated into such policies.
    These include, for example, being able to recognize whether links to websites
    are real or not, and ways of creating and managing secure online passwords.


    Yet empirical studies have provided evidence indicating that very few libraries
    have updated their privacy policies to take account of the new risks and are not
    educating users about these or the importance, for example, of opt-in notifications
    (e.g., Chamberlain & Zimmer 2017; Cotter & Sasso 2016). In a study of'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'the use by libraries of social media to interact with users (Cotter & Sasso
    2016) it was found, for example, that while around 75% of libraries surveyed had
    a social media policy, only 53% of these included reference to privacy. The same
    study revealed high levels of confusion and uncertainty on the part of librarians
    about what constitutes a violation of privacy (Cotter & Sasso 2016). It has also
    been highlighted in the literature that privacy policies must incorporate information
    about tracking or surveillance tools, and the ways in which user data will be
    used by the library or other parties, to enable users to make informed decisions
    about their use of online resources (Fortier & Burkill 2015).


    Marden (2017) discusses the development and content of the New York Public Library’s
    new privacy policy, released in November 2016. The process involved conducting
    a full inventory of the library’s systems, databases, and paper-based information
    gathering; examining the privacy practices of other nonprofit organizations; drawing
    on the key privacy principles of the ALA; and consulting a wide range of internal
    stakeholders. The new policy developed as a result of this process provided clear
    guidance to users on what information the library collects, how it is used, how
    users can manage their own information, including opt-in and opt-out methods,
    and how the information is shared with third parties.


    Developing the digital literacy skills of library users requires more than updating
    library privacy policies however; it is also crucial that information professionals
    are proactive in ensuring that users are aware of and understand the implications
    of such policies. This is particularly important in the light of UK research which
    provided evidence of an emerging security and intellectual privacy divide, along
    socioeconomic lines, between those with and those without the knowledge to protect
    themselves online (Loyds Bank 2017). Other UK research revealed very lax practices
    among Internet users, with many admitting that they do not bother reading privacy
    statements or that they are happy to divulge personal information in order to
    achieve the desired outcome from their Internet searches (Ofcom 2015).


    On a brighter note, some good practices are emerging among information professionals
    and related groups for improving digital literacy and increasing awareness of
    privacy and security issues. In the United States, for example, the Library Freedom
    Project, a syndicate of librarians, technical specialists, lawyers, and other
    groups, delivers workshops and conducts other activities intended to ensure that
    librarians and library users have adequate information and understanding about
    privacy and intellectual freedom rights and how to use utilize technology to protect
    these (Kim 2016). In a number of countries including the United States, Canada,
    Australia, the United Kingdom, France, and Germany, some libraries are using “cryptoparties”
    in the form of workshops to teach library users the basics of digital privacy
    and how to protect themselves from online monitoring activities. (IFLA 2015).
    Good practices also involve simply ensuring that the library policies are effectively
    disseminated to users. In the case of the'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'New York Library’s privacy policy discussed earlier, this was rolled out on
    the library website with a clear banner announcing the new policy, and information
    about it was also emailed directly to more than a million library patrons and
    others signed up for library information (Marden 2017).


    The IFLA as well as many national library associations are actively hosting or
    participating workshops and conferences for the purpose of promoting digital literacy
    and online safety. Central to the work of the IFLA in this respect is the Global
    Vision discussion, a series of workshops and an online platform used to facilitate
    and promote discussion of these issues among librarians from 190 countries (IFLA
    2018a). IFLA participates regularly in international human rights conferences
    such as RightsCon on topics including cybersecurity and online privacy (IFLA 2018b),
    as well as other international initiatives. These include annual events such as
    the European Commission’s Safer Internet Day, focused on safe use of the Internet
    by young people (IFLA 2018c), and the Internet Governance Forums held by a global
    multistakeholder group for the purpose of discussing public policy issues relating
    to safe use of the Internet (IFLA 2017b). It has also produced a Resource Pack
    on Digital Literacy, intended to provide information and guidance to libraries
    around the world, including how to ensure patrons are protected online, and with
    case study examples from around the world (IFLA 2018d).


    In the United Kingdom, the Government’s Internet Safety Strategy, published in
    2017, specifically encourages libraries to be directly involved in implementing
    the strategy, for example, by making online resources and training available and
    integrating safety messages into existing library services for children and parents
    (Libraries Taskforce 2017). In one of the library sector’s responses to this strategy,
    the Society of Chief Librarians implemented a series of “family learning and digital
    roadshows” in which librarians are able to learn about the latest security technologies
    and how to teach library users to protect themselves online (HM Government 2018).


    # Implementing Technical and Policy Solutions


    The second main role of information professionals in relation to the security
    and privacy of online users is to work with IT professionals to ensure that best
    practice technical standards and solutions are in place to secure the online library
    systems, resources and databases from unauthorized access or use (Massis 2017)
    and to maximize the privacy of users (Klinefelter 2016).


    Information professionals also have a responsibility to their users to ensure
    that recommended websites or databases, as well as services and resources provided
    by third-party vendors, meet high standards of privacy and security. An analysis
    of the privacy policies of leading vendors providing digital content to public
    libraries in the United States found that while these were often meeting industry
    standards they were falling short of the privacy standards generally expected
    of a library'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'setting (Lambert, Parker, & Bashir 2015). It has been flagged up in the literature,
    however, that there is little guidance available to librarians for use in evaluating
    whether the resources they might recommend to their users meet high standards
    of privacy and do not involve monitoring or surveillance of users (Fortier & Burkell
    2015). This indicates a need for such guidance to be provided in future.


    Despite this current gap in guidance, best practices for securing library systems
    and protecting the privacy of users is emerging and has been implemented by many
    libraries. These have not yet been collated as a standard set of international
    best practices, though the ALA’s Intellectual Freedom Committee has issued a number
    of guidelines to assist libraries and their third-party vendors in developing
    good practices for online privacy and data management and security, which are
    available at www.ala.org/advocacy/privacy/guidelines. A wide range of recommended
    approaches to improving security and privacy online have been documented by Hennig
    in a recent (2018) Library and Technology Report, in the form of a highly practical
    guide. For example, Hennig (2018) recommends, based on advice from the Electronic
    Frontier Foundation, that organizations should initially build a “threat model”
    or a plan setting out the required level of security for each type of data they
    collect or use. This involves addressing the questions “what do I want to protect?”,
    “who do I want to protect it from?”, “how bad are the consequences if I fail?”,
    “How likely is it that I will need to protect it?”, and “How much trouble am I
    willing to go through to try to prevent potential consequences?” (Hennig 2018,
    p. 7). Hennig (2018) also discusses measures such as the use of biometric security,
    for example touch ID and face recognition, to authenticate system users and reduce
    hacking risks, and the use of ad blockers and private mode browsing for protecting
    the privacy of individuals online.


    Some other specific measures identified from the literature include the use of
    strict password requirements, and ensuring that patron passwords are not stored
    as unencrypted text on library systems (Breeding 2016), as well as the use of
    two factor authentication. This involves asking users not only for a password
    to log into library systems, but also for a second piece of identifying information
    usually in the form of a numeric code sent to the user by email or text message
    (Hennig 2018; Klintefelt 2016). Encryption of user data by the library is also
    essential, especially when transmitted online or using Wireless technology, in
    order to protect this against interception by a third party (Hahn 2017).


    Other important measures to protect the privacy and security of individual users
    when using the Internet within libraries include turning off memory functions
    for passwords and form-filling, the practice of locking accounts after a number
    of failed log-in attempts, and rebooting of computers after a specified period
    of inactivity in order to clear personal information (IFLA 2018e; Kim 2016). However,
    there is still more to be done. For example, Robinson (2017) discusses the move
    by many governmental and other organizations to move all websites from HTTP to
    the more secure HTTPS protocol, and recommends that libraries follow this example.'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'With regard to the collection, storage, and use of user information in general,
    best practices for libraries include the use of short periods for retention of
    personal data, and having clear retention policies which are made available to
    users. Beckstrom (2017) notes that a data retention policy should provide information
    on how and what information is collected on users by the library itself and by
    any third-party services used by the library, and on what the user can do to request
    that their personal information is deleted or not used by the respective organizations.
    The use of data warehouses where deidentified patron data can be stored is also
    an emerging best practice. Yoose (2017) provides the example of Seattle Public
    Libraries, which wanted to find out more about the use of libraries by young people
    in the millennial population, and were therefore faced with the challenge of how
    to track online behaviors while also protecting the identities of users. They
    achieved this by creating a data warehouse to which circulation transactions were
    exported from the main library database and anonymized and aggregated for the
    purpose of analysis. Access to the data warehouse is also tightly controlled and
    limited to those staff who need to maintain or use the data.


    # Political Advocacy


    The third main role of information professionals is as political advocates for
    the various rights of library users. Libraries and library associations have traditionally
    been advocates of both privacy and intellectual freedom rights, and this role
    is becoming increasingly important in the face of increasing surveillance and
    monitoring of online activity, the growth of privacy legislation, and the inherent
    risks of the online information environment (Lamden 2015). In the United States,
    for example, librarians played an important role in opposing demands for library
    records of individuals to be provided on request under the USA PATRIOT Act, and
    the Library Freedom project successfully opposed the Department of Homeland Security
    in its attempt to limit the adoption of encryption technologies by libraries in
    the United States (Clark 2016). The ALA is also active in advocacy efforts to
    strengthen individual privacy laws and to promote digital literacy skills among
    library users (Klinefelter 2016).


    Conflicts often arise, however, between measures intended to protect user privacy
    and the efforts of information professionals to maximize the freedom of library
    users to access a wide range of resources, or to preserve information for public
    use. Advocacy efforts are also important, therefore, to ensure that these rights
    are effectively balanced when developing policies and legislation. An example
    is provided by the “Right to be Forgotten” legislation set out in the EU’s 1995
    Data Protection Directive (European Commission 2012), which is intended to increase
    the personal privacy rights of Internet users. Under this legislation, individual
    citizens can request that personal or sensitive information about them is'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'removed from the Internet. However, IFLA has argued that librarians have a
    responsibility to ensure that policymakers understand the potential importance
    of preserving such information for historical or research purposes or other public
    interest considerations, particularly when the transparency of this information
    may be important to the public interest, as in the case of leading politicians
    for example (Edwards 2017; IFLA 2014, 2016b).


    The use of filtering software in libraries is another controversial measure which
    can restrict intellectual freedom in the interest of national security or the
    safety and security of library users. As the use of online services and resources
    by library users increases, many libraries are implementing filtering tools which
    block access to sites deemed to be illegal or inappropriate (such as pornographic
    sites or the websites of extremist religious groups), in the interests of ensuring
    a safe and secure library environment for all users. While addressing some aspects
    of security, however, such filtering tools can threaten the intellectual freedom
    rights of users, and have often been shown to be ineffective in the sense of preventing
    users from making legitimate use of blocked sites for research or educational
    purposes. Researchers have also reported evidence that library users feel uncomfortable
    about asking for websites to be unblocked in these circumstances, indicating that
    such measures not only hinder intellectual freedom but may also have a negative
    impact on user privacy. Information professionals have an important role to play
    therefore in the form of advocacy intended to reduce the use of such filtering
    tools or at least to restrict their use to sites which are illegal or pose a definite
    security risk. More generally, it has been noted that information professionals
    have a professional responsibility to protect the rights of library users to access
    information free from surveillance (Fortier & Burchell 2015).


    The political advocacy role of librarians has come to the fore recently in the
    case of the United States. Here, the ALA issued releases following the election
    of President Trump in 2016, making a commitment to support the policies of the
    new administration, and subsequently retracted these following a backlash from
    librarians who argued that these conflicted with many of their professional values
    such as privacy and confidentiality (Zimmer 2017). These developments build on
    ongoing efforts by librarians in the United States to protect the information
    freedom rights of users. For example, Clark (2016) cites the example of the Library
    Freedom Project''s successful resistance to the Department of Homeland Security''s
    attempts to limit the use of encryption technologies by libraries, while at individual
    level, librarians in the United States have won court cases to overturn attempts
    by the FBI to obtain user data without a warrant or judicial review (Glaser 2015).


    # Recommendations and Conclusions


    This chapter has discussed the increasing threats to the privacy and security
    of library users when using online services and resources and identified three
    key roles of'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'information professionals which are important for protecting the privacy and
    security of online users as well as their intellectual freedom rights. The following
    key recommendations for information professionals and their professional associations
    are intended to help ensure that these roles can be effectively fulfilled:


    +   - All information professionals should receive online security and privacy
    training to ensure that they can effectively contribute to the design of online
    library services and provide users with appropriate advice and support to enable
    them to use digital library services and collections securely and with appropriate
    levels of privacy.

    +   - Information professionals should work together to ensure that their libraries
    implement best practice standards of security for online systems and resources,
    and that all online library services and content are compliant with such standards,
    including those provided by third party vendors.

    +   - The collection of personal information about library users and their use
    of library services should be kept to the minimum required to meet legal or admin-istrative
    requirements, and such information should be destroyed as soon as it is no longer
    needed.

    +   - Library privacy policies should be regularly reviewed and updated as necessary
    to ensure that they are aligned with the online information environment and the
    threats to user privacy that are inherent in this.

    +   - Information professionals should play an active role in promoting the digital
    literacy of users by disseminating privacy policies, and providing information
    on the use of technology to reduce privacy and security risks online.

    +   - Library associations should stay informed of policy and legislative develop-ments
    which may either threaten the privacy of library users or limit access to information
    which may be of importance for research or public interest purposes, and should
    lead or actively support advocacy efforts intended to protect users against such
    developments.

    +   - Library associations should seek opportunities to be directly involved or
    con-sulted in the development of policies or legislation relating to the surveillance
    of online activity or the protection of personal data, in order to help ensure
    that these are reasonable and do not contravene intellectual freedom rights or
    hinder the preservation of important information and historical records.


    In conclusion, as the information environment evolves and online searches become
    established as the main information seeking method of many library users, protecting
    their privacy and security from the various threats identified in this chapter
    is becoming one of the most important responsibilities of information professionals.
    Additionally, the political advocacy role of information professionals and their
    professional associations is becoming ever more important, particularly in order
    to ensure that an appropriate balance is maintained between the privacy rights
    and'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'intellectual freedom rights of users in the new information environment. The
    discussion and recommendations in this chapter are intended to raise awareness
    of these roles and the ways in which they can be most effectively fulfilled.


