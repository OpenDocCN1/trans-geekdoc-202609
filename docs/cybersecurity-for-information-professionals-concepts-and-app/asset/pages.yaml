    # Security and Privacy in Data Life Cycle


    Data life cycle refers to the entire process of data life from data generation
    to end of life. There are a few of different ways for defining the phases of data
    life cycle. We will define the phases of data life cycle including data generation,
    data sharing, data usage, data storage, and data destruction. Each phase may have
    different security and privacy requirements.


    # Data Generation


    Data can be generated in many different ways such as collecting data through crowdsourcing,
    data acquisition using sensors, or producing data from running software. The ownership
    of the generated data has to be clearly defined in this phase since it decides
    the regularities and policies for using, sharing, storing, and erasing the data,
    and the technology for protecting the data security and privacy. It is not easy
    to define the owner of the data. For example, who is the owner of the data that
    were taken through online survey regarding the drinking preference of adults?
    Therefore, legal policies are needed for defining the data ownership. In addition,
    it is important to have ways for appropriately managing the privacy preference
    as well as the change of preference for each data owner. It is necessary to have
    mechanisms for preventing data acquisition devices from illegal data acquisition,
    and ensuring the owner to control the data usage and sharing (Bertino 2016, 400–407).


    # Data Sharing


    Data sharing may be implemented in three ways: transferring data from one site
    to another through network, transferring data using physical equipment, and sharing
    data in a server. The owner of the data should control or be aware of the data
    sharing, but it is not practical in many cases. Therefore, legal guidelines and
    policies are needed for regulating the sharing of the data that are owned by others
    (Bertino 2016, 400–407). (We define the owner of data as the subject of the data
    refers to. For example, an owner of the health information of a patient in a hospital
    is the patient.) Access controls and flow controls are important for ensuring
    the security and privacy of data sharing.'
