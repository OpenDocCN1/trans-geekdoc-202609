  img_proc: true
- pgno: 178
  md: 'dumpster diving, shoulder surfing, and reverse social engineering (Breda et
    al. 2017, 2). There are other forms of human-involved cybersecurity risks but
    essentially are associated with the risks listed here.


    # Impersonation


    The practice of deceiving victims by representing as another person with aims
    to gain access to information resources and networks is known as impersonation
    (Conteh and Schmick 2016, 32; Breda et al. 2017, 2). The attacker pretends or
    pretexts by playing a role of someone close to the target. It is one of the most
    common conventional methods of social engineering. Persons are critical victims
    of such practices and they may lose control over their information networks to
    the social engineers. Intentions of impersonation involve committing fraud, identity
    theft, industrial espionage, and so on. The impersonators collect information
    about the victim granularly over the time and connect those for building a coherent
    and credible source of information. They fulfill their aim through stalking, researching
    company websites and social media accounts, and pretexting over phones. For example,
    impersonators play roles of IT help desk and provide related services like change
    of passwords and so on. This opportunity gains them power to obtain confidential
    information and sabotage the targets. In the context of social media, fake profiles
    of celebrities and their fan group accounts are common impersonation trap. Technically
    impersonators spread rumors and increase followers’ counts with aim to distribute
    spams whenever needed.


    # Tailgating


    The attackers plan to enter the network through restricted access points. They
    convincingly request legitimate employees for availing unauthorized access in
    a company (Bourne 2014, 242–67). They portray plausible scenarios to the legitimate
    employees such as loss of keys or forgetting keys at home. Their false identities
    help them to be in areas of a company that otherwise will be impossible to enter.
    Their investigations on target company and its employees bring expected opportunities
    for them. This attack sounds innocent. It requires fewer computing skills and
    more human skills. Often companies neglect this criminal activity and mostly rely
    on security logs for mitigating specific cases.


    # Dumpster Diving


    This risk is associated with cybersecurity indirectly. However, it has direct
    connections with physical security risks. Old company resources like forms, credit
    cards, invoices, memos, and notepads contain valuable information about the organization'
  merge: -1
  img_proc: true
- pgno: 179
  md: 'and its human resources. The attackers can produce credible information from
    these weeded sources (Liu et al. 2009, 87–108). The dumpster diver generates databases
    with target company and employee information. Prior to disposal of old materials,
    it is important to shred the printed resources and erase any kind of storage media.


    # Shoulder Surfing


    The attackers often look over the shoulders of the victims to gain access to their
    login information. Shoulder surfing is a low-tech strategy of social engineering.
    In modern days, employees work in open environments and log in workstations locally
    for administration purposes. Shoulder surfers take the advantage of stealing PIN
    codes and passwords just by looking at the authorized users’ activities (Liu et
    al. 2009, 87–108). Although it has low-tech requirements, this technique proves
    effective for the social engineers because they can easily modify their strategies
    on the spot.


    # Reverse Social Engineering


    Social engineering techniques are gradually becoming well-recognized cybersecurity
    knowledge. The attackers are also perfecting their skills even more and placing
    them one step ahead in strategy deployment. They are now reversing social engineering
    attacks. They place them among authorized users as trustworthy allies in attempts
    to provide technical supports (Rountree 2011, 135–59). But their fundamental target
    lies in organizational disruption by the means of gaining trusts of official users.


    # Socio-Technical Attacks


    Socio-technical attacks heavily rely on digital tools and computing skills (Breda
    et al. 2017, 5). Some techniques require moderate to some degree of coding skills.
    Others can be achieved based on significant technical knowledge. Most common types
    of socio-technical cyberattacks on social media platforms are phishing, baiting,
    vishing, and eavesdropping.


    # Phishing for Social Engineering


    Phishing is the most common form of email scams that targets to access confidential
    information (Flick and Morehouse 2011, 109–42; Conteh and Schmick 2016, 32; Breda
    et al. 2017, 2). Simple clicks on suspicious links overthrough the entire system.
    Its contents look believable and legitimate to users, which is why they often
    fall into the trap and lose their confidential information to the attackers. Phishing
    can easily transport sensitive information and computer network access to the
    devices of the'
  merge: -1
  img_proc: true
- pgno: 180
  md: 'attackers. This technique is adopted by the hackers most commonly due to its
    simplicity and efficacy. With simple HTML and CSS codes, building a copycat website
    for a well-known website is easier. Once the link is sent through emails in the
    target networks, the built-in worms and malware can effectively collect confidential
    information from victim’s devices. The phishers commonly choose email networks,
    social networks, and text messages to spread the spams. They circulate spams on
    social media like Facebook, Twitter, Instagram, LinkedIn, and other such platforms
    for acquiring background information about victims. They build phishing operations
    around large-scale social and political events like national holidays, celebratory
    moments, elections, and so on. These campaigns are often generated in the form
    of breaking news. Their ultimate target is persuading the victim to click on the
    malicious links. In social phishing cases, the phishers scrape contents from social
    media accounts of the victim and use those for constructing user-specific phishing
    emails (Jagatic et al. 2007).


    # Baiting


    Baiting works with concepts similar to phishing. It provides backdoor entrance
    of IT infrastructure to the attackers (Conteh and Schmick 2016, 32; Breda et al.
    2017, 6). They use either digital tools or physical media like USB devices and
    place those in tactical spots. Once these are used in any organizational workstation,
    effects of chain reactions from the installed malware compromise devices in the
    entire network. The attackers on social media, for example, on Twitter, detect
    the trending topics. They locate key messages with the trending topic and hashtags.
    They replace the original links from the Twitter posts with their desired shortened
    links and URLs associated with malicious sites. It is hard for regular users to
    distinguish the original contents from malicious contents out of millions of comments
    and retweets. The security flaws start to affect devices when these deceptive
    links are clicked.


    # Vishing


    Vishing, also known as quid pro quo, is another widespread type of social engineering
    model. It is widely known as “voice phishing” (SocialEngineering. Org, n.d.).
    The deceiver tricks the users with legitimate information by representing well-known
    companies or even government agencies. They make random phone calls and convince
    users to exchange personal information in relation to IT services, IRS tax records,
    utility services, and more. The perpetrators also attract users to click on certain
    online advertisements and contents that make users’ personal devices compromised
    and provide a phone number. While some users call to that phone number by providing
    their personal information, which ultimately land in wrong hands with ill purposes.'
  merge: -1
  img_proc: true
- pgno: 181
  md: '# # Eavesdropping


    Unapproved interference of users’ real-time conversations over social media, mobile
    phones, and online applications is known as eavesdropping (Breda et al. 2017,
    5). Its physical form, that is, interception of phone conversations, is conventionally
    called as wiretapping. Internet-based calls without VoIP and encryption technology
    become playground for digital trespassers. With rootkit applications, the intruders
    can easily listen to users’ conversations on their laptops via the installed microphones.
    Eavesdropping is treacherous in nature because it does not malfunction the network
    data transmission and leaves little room for detection. Public WiFi networks are
    the most vulnerable targets for eavesdropping.


    # # Social Engineering Attack Phases


    A careful attention to the overall process of any social engineering can be broken
    down to various steps. It involves stages of investigations, data collection,
    manipulation, and termination. These phases can be sub-grouped into three categories
    – pre-attack, the attack, and post-attack (Figure 8.2). At first, an extensive
    amount of research is conducted on victim’s profile. Owing to the advancement
    of information systems, personal and professional networks are becoming easier
    to harness to gather information. The more information collected about the victim,
    the better the chances for entrapment. In the second stage, victim’s work information,
    geographical attachments, and social information are valuable resources for the
    perpetrators to conduct criminal masquerade. The attacker plots tricks to hook
    the victim to the stories without increasing suspicions. Once the desired information
    is collected, in the third stage, the attacker closes the interactions with victim.
    The consequences of such practice are beyond imagination and its longevity is
    difficult to predict.


    # # Cyber-Extremism and Online Hate Crimes


    Religious extremist groups use social media platforms to recruit members. They
    use multimedia contents like images and videos, chatrooms, website links, retweets,


    ![](img/74778e0ca6379f5d5e4de83ac1ff23da_181_0.png)


    Figure 8.2 Social engineering attack phases.'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'hashtags, social media interaction features, and mobile applications to distribute
    propaganda and radicalize new generations. Cyber-extremists have seven key characters
    in their online behaviors – cyber mobs, isolatiests, fantasy seekers, thrill seekers,
    moral crusaders, narcissists, and attention seekers (Awan 2017, 143). Ignorant
    groups use social media like Facebook with negative and discriminatory attitudes
    for sharing religious slurs such as Islamophobia (Awan 2016, 1). Scholars categorized
    hate speech by collecting data from two social media platforms – Whisper and Twitter,
    and found those are commonly related to race, behavior, physical, sexual orientation,
    class, gender, ethnicity, disability, and religion (Silva et al. 2016, 1–4).


    # Cyberbullying


    In a survey of college-going students, Whittaker and Kowalski (2015) found they
    were victims of cyberbullying via social media posts. Although texting was most
    common method, the students were targets for cyberbullying, social media platforms
    like Twitter, Facebook, Instagram, and YouTube were pre-dominant media where they
    were affected as well. Cyber aggressors use comments and forum replies as venues
    to post their comments by protecting their anonymity.


    # Disinformation


    Social media is a cost effective and easily accessible tool for promotion of low-quality
    news mixed with false information, that is, fake news. Malicious accounts such
    as trolls, social bots, and automated accounts use social media for dissemination
    of propaganda. Social media is an effective tool for creating groups of like-minded
    people. They share similar ideas and eventually believe homogenous thoughts. This
    can create social echo chambers where users only share and consume some types
    of information (Shu et al. 2017). Propagation of fake news in social media echo
    chambers is faster, which can create polarized communities (Vicario et al. 2016,
    554–9).


    # Social Media Bots


    Social media bots generate automatic interactions with users and interfere in
    public dialogues, civic discourses, political agenda, policy discussions, elections,
    social movements, and fake news distribution. The bots can easily be trained with
    sophisticated computing techniques (Monsted et al. 2017). Those can be customized
    and controlled for when and how many social media posts will be created on various
    social and political events. Evidence of bot usage can be traced during global
    issues like US elections (Allcott and Gentzkow 2017, 211–36; Bessi and Ferrara
    2016; Shao et al. 2018), Brexit (Howard and Kollanyi 2016), the 2017 French Presidential
    Election (Ferrara 2017), stock market manipulation, and'
  merge: -1
  img_proc: true
- pgno: 183
  md: 'vaccination policy (Ferrara et al. 2016). Ferrara (2017) mentions the existence
    of potential underground black-market for “reusable political-disinformation bots.”


    # Social Media Policing


    Identifying criminal information on social media and build investigation on it
    is an attractive practice to the IT forensic and cybercrime departments in police
    forces (Denef et al. 2012). They use tools developed by IBM, SAS, SAP, Oracle,
    Radian6, Attensity, Kapow, and Palantir for information storage, analysis, and
    visualization. The law enforcement departments can track IP addresses used to
    send private messages over social media, alongside email addresses and phone numbers.
    European laws and orders provide supports for police to harness criminal data
    available from social media. Data collection from social media sites protected
    under international laws is complicated for local police departments. For example,
    it requires advanced protocols for European police forces to gather data from
    Facebook, as it is an US-based company. Facebook, however, has teams for collaborations
    with international police operations, especially, to work in areas like child
    abuse, child pornography, and so on. Facebook can suspend social media accounts
    and freeze users’ data that the company can share with police departments when
    appropriate legal requests have been placed. In addition to criminal investigations,
    the police forces generally used social media platforms for communications and
    building relationships with citizens, distributions of emergency news, and community
    policing.


    # Social Media Cybersecurity Risk Mitigation Techniques


    Use of social media is manifold. From keeping in touch with close networks to
    build new friendships, planning events to sharing experiences through rich multimedia
    contents like photos, videos, and interactions with network – all can be done
    in single hyper-connected media. While this brings the world closer, the consequential
    prices are often higher.


    # Browser Updates


    To prevent malware attacks, loss of personal information by clicking links, it
    is safer to disregard social media login invitations through links sent by unknown
    parties. Bookmarks and opening social media accounts by accessing through browsers
    is wiser. Sometimes browsers get affected by virus and loss of personal stored
    information becomes obvious. Therefore, personal information storage on'
  merge: -1
  img_proc: true
- pgno: 184
  md: 'browsers for social media accounts is unsafe. It is acutely dangerous when
    the accounts are accessed on public computer systems. Public WiFi connections
    with unsecured network are risky for social media usage for various reasons. Hackers
    can access to these untrusted networks easily and track all the general activities
    online.


    # Passwords


    Strong passwords are highly useful to protect social media accounts. Security
    experts advise the use of stronger and newer passwords regularly. Use of one password
    for all of the social media platforms is never a good practice. Passwords related
    to contents shared on social media like favorite animals or places are easy to
    crack. Random words in strings make stronger passwords. Use of password managers
    are often highly recommended in case of fear of losing and forgetting passwords.
    Although highly sophisticated password manager applications are growing, Americans
    are still relying on good-old fashioned strategies such as memorization and writing
    down in notes (Olmstead and Smith 2017).


    # Security Updates


    Security updates are crucial for social media account protection. Right version
    of the application is safer to use. Otherwise, security glitches and errors are
    prone to exploitation by hackers. Unrecognized network requests without proper
    details should be treated cautiously. Social media can be a playground for scammers
    to lure users with false information and contents. Users become easy targets of
    social engineering with the expense of sensitive personal information-


    Company-specific security protection initiatives are on the rise. Facebook address
    spear phishing attacks by providing specialized notifications, developing detection
    systems, and promoting phishing counteractive measures among the users. Most of
    the social media companies practice dual-factor authentication as standard. In
    addition to passwords, users get links and codes sent to their emails and phones
    for account verification purposes. Many use third-party applications in connection
    with social media accounts for the purposes of playing games, productivity, and
    so on. It is highly important to review third-party applications on regular basis.


    # Privacy


    Privacy risks are widely known concept among social media users. Although many
    do not trust social media company with data protection and privacy, they seem
    to ignore privacy risks and use the platforms anyway. Change of privacy'
  merge: -1
  img_proc: true
- pgno: 185
  md: 'settings to desired theme is important. Business users tend to have greater
    concerns over privacy protections. Because they believe their information can
    get jeopardized for not paying proper attention to it.


    # Social Media Policy


    Importance of social media policy is highly recognized. It can work as the guidelines
    for everyone in the company and offer solutions to legal procedures, if necessary.
    From actions to preventions, individual and group responsibilities, confidentiality,
    and copyright – all areas can be clearly defined in policy documents.


    # Training and Security Education


    Promotion of social media security education is immensely necessary. Security
    education can make individual users aware of how to protect and avoid any risks
    on the platform. In the business cases, employees must go through security trainings,
    which can prove very effective. They can be better equipped with right knowledge
    on how to mitigate and tackle company security challenges. In this regard, appointment
    of individuals and teams based on size of the company can be useful. The designated
    official can take charge and update everyone time-to-time with security alerts.


    # Security Technologies


    We safeguard our computers and internet services by installing firewalls and anti-virus
    software. Similarly, investment in security technologies for social media site
    protection is a timely decision. The security technologies regularly alert and
    update with security concerns on the system. It can track, monitor phishing and
    suspicious activities, and report for actions.


    # Laws and Regulations


    With the brink of number of cybersecurity attacks and users’ data exploitations,
    governments around the world are closing the regulation gaps for social media
    companies. Governments of North American and European countries are clamoring
    on social media companies like Facebook, Twitter, Google, and others for their
    liabilities in data breaches. The Online Safety Act, in Australia, for example,
    in response to horrendous New Zealand mosque mass shooting, aims to hold accountable
    social media platforms and the online predators for any illegal and abusive contents.
    The United States has enacted several laws and regulations for the protection
    of online safety. Major data breaches have escalated the privacy'
  merge: -1
  img_proc: true
- pgno: 186
  md: 'concerns. Securing safer online environment is a monumental task as sources
    of security risks are always dynamic and unpredictable. Although overarching cybersecurity
    laws in the United States is absent, various area-specific federal laws such as
    Health Insurance Portability and Accountability Act (HIPAA) for health data protection
    and Federal Information Security Management Act (FISMA) are widely accepted. Moreover,
    state laws such as California Consumer Privacy Act and New York State Department
    of Financial Services cybersecurity regulation are highly regarded. The most expansive
    online data protection law is, however, Europe''s General Data Protection Regulation
    (GDPR).


    # Implications for Information Professionals


    Information professionals in libraries and cultural institutions strongly practice
    privacy protection of user information for long. According to the American Library
    Association (ALA) Code of Ethics, it protects “each library’s user’s right to
    privacy and confidentiality with respect to information sought or received and
    resources consulted, borrowed, acquired or transmitted” (American Library Association
    2006). The International Federation of Library Associations and Institutions (IFLA)
    Code of Ethics express similar message as it believes that “librarians and other
    information workers respect personal privacy, and the protection of personal data,
    necessarily shared between individuals and institutions” (IFLA 2012). The ALA
    2003 Policy Manual added more specific direction about privacy based on the Library
    Bill of Rights. It reads


    > in a library (physical or virtual), the right to privacy is the right to open
    inquiry without having the subject of one’s interest examined or scrutinized by
    others. Confidentiality exists when a library is in possession of personally identifiable
    information about users and keeps that information private on their behalf.

    > (American Library Association 2014)


    Therefore, it is highly important for information professionals to protect all
    kinds of digital resources and user information from breaching through disruptive
    technologies like social media. Libraries frequently use social media platforms
    like Facebook, Twitter, blogs, Instagram, Pinterest, and Flickr (Sieck 2014).
    Libraries around the world use social media typically for the purposes of promotions
    of events, library services, new acquisitions, and collection of items, sharing
    news and updates, customer services, and development of connections. Libraries
    can adopt various steps for better digital privacy including updating privacy
    policies, encryption technologies, requiring vendors to follow library privacy
    rules, and training information professionals (Caldwell-Stone 2017). On the basis
    of social media security, best'
  merge: -1
  img_proc: true
- pgno: 187
  md: 'practices designed by social media security providers such as ZeroFOX (2017)
    following recommendations are suggested for information professionals.


    # Current Status


    Information professional can identify current security status by checking if the
    social media accounts are breached or not. Some platforms such as haveibeenpwned.com
    provide information if any email address associated with social media accounts
    has been disclosed from any data breach.


    # Multi-Factor Authentication


    Uses of dual-authentication or multi-factor authentication are now a security
    practice standard. Enabling multi-factor authentication can strengthen security
    protection. With this practice, users now require to log-in their accounts by
    providing a security code sent to their smartphones or other devices. Without
    matching codes, any unknown access will be difficult.


    # Strong Passwords


    Avoidance of using simple passwords for social media accounts is always a good
    practice. Usernames, date of births, and location can be easily traced and those
    can put the library social media accounts in cybersecurity risks. Passwords with
    complex and longer characters are difficult to crack for hackers. Use of combination
    of symbols, numbers, and upper and lowercase letters can generate strong passwords.


    # Security Setting Updates


    Use of the most updated applications is an essential task to avoid security risks.
    Web browsers, operating systems, device settings, and social media applications
    provide notifications for updates and security glitches. To mitigate any security
    risks, it is important to install the updated versions of digital systems and
    applications.


    # Connection Curation


    Library social media accounts will have many followers and connections. Monitoring
    the types of followers and friends on the social media accounts is a good practice
    to identify any malicious profiles. Phishers may post spams and false information
    in conversations of library social media accounts. Weeding these spams and malicious
    accounts can help avoid cybersecurity risks both for the libraries and its users.'
