    # Major Opportunities and Challenges for iSchools


    Originally developed in the NIST Special Publication 800-16 Report: Information
    Technology and Security Training Requirements: A Role- and Performance-Based Model,
    the Learning Continuum (deZafra et al. 1998, Appendix A) provides a conceptual
    framework for IT security training. A further discussion of the learning continuum
    can be found in the NIST Special Publication 800-50 Report: Building an Information
    Technology Security Awareness and Training Program where the IT Security Learning
    Continuum (Wilson and Hash 2003, Figure 2.1) focuses on Awareness, Training, and
    Education as a continuum for learning with three levels embedded in each area:
    beginning, intermediate, and advanced. This report specifically identifies critical
    steps in the life cycle of IT security awareness and training program. This is
    a companion publication to NIST SP 800-16. The NIST special publications are also
    useful for nongovernment organizations to design their security awareness and
    training programs. As stated in the NIST SP 800-50, “Learning is a continuum;
    it starts with awareness, builds to training, and evolves into education” (Wilson
    and Hash 2003, 7).


    From our examination of the North America iSchools program and curriculum, a majority
    of iSchools appear to recognize the importance of cybersecurity and have various
    levels of programs and courses for information security and cybersecurity. As
    presented in Figure 4.4, the Cybersecurity Learning Continuum illustrates the
    learning spectrum moving from security awareness to cybersecurity essentials,
    to role-based training, to education and/or experience. Thus, it shows the potential
    for iSchools cybersecurity program development to move from a single module or
    coursework to an integrated approach that addresses the various roles and responsibilities
    of cybersecurity professionals in an interdisciplinary manner.


    Figure 4.4 indicates that security awareness programs aim to raise the awareness
    of all users in the organization, while courses on cybersecurity essentials target
    at all users involved with IT systems. Cybersecurity awareness and cybersecurity
    essentials provide fundamental literacy for role-based training. Role-based training
    is required when the users’ work roles intersect with IT systems or cybersecurity
    responsibilities. Role-based training and education phase mutually influence each
    other, which motivates the employees to consider cybersecurity as their profession
    through interdisciplinary or multidisciplinary education obtaining'
