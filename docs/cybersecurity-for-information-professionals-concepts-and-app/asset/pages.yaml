    # Trust versus Trustworthiness


    Trust facilitates basic human relationships in our society. The default of trust
    is two people who can rely on one another. Trust can also be one-sided or group-based
    largely depending on communication. Trust depicts a type of interdependent relationship
    between two individuals, two parties, or two groups: a trustor, who may (or may
    not) trust a trustee. Trust also implies a trustor’s willingness to take risks
    and to be vulnerable. That is, trustors must have a sense of vulnerability toward
    a trustee for a trust relationship to exist. Trustworthiness, on the other hand,
    refers to an inferred quality inherent in a trustee. The establishment of trustors’
    beliefs as to a trustee’s trustworthiness is an antecedent to a trust relationship.


    Trustworthiness can be defined in several different ways with a spectrum of factors
    and dimensionality. For example, Lieberman (1981) identifies two factors: competence
    (external or situational cause) and integrity (internal or dispositional cause),
    while Butler (1991) identifies ten factors to measure trustworthiness: availability,
    competence, consistency, discreetness, fairness, integrity, loyalty, openness,
    promise, fulfillment, and receptivity. Mayer, Davis, and Schoorman (1995) simplify
    the concepts to provide a more generic framework with three factors of perceived
    trustworthiness: ability (competence), benevolence (kindness), and integrity (goodwill/ethics).
    To be more specific, competence refers to an external (situational) cause, which
    is the effective application of learned behavior; for example, a person can be
    competent by acquiring a set of skills. Integrity, on the other hand, refers to
    an internal (dispositional) cause, which is a person’s internal dispositional
    state; for example, a person is willing to sacrifice his or her own time or energy
    to make a high integrity contribution regarding an assigned task. Benevolence
    (kindness) refers to the quality of a trustee that wants to do good, which may
    benefit the trustor.


