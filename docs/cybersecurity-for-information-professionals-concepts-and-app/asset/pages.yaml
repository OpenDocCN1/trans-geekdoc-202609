    # 12.3.3 Security Analysis and Design


    The main goal of the “Security analysis and design” phase is to reduce the number
    of vulnerabilities in the design prior to coding. It is an iterative review process
    that analyzes the design and architecture of an application from a security perspective.
    The review includes an analysis of critical areas of the application responsible
    for integrating basic security principles; for example, confidentiality, authentication,
    authorization, and integrity. The main objective is to understand the security
    needs of a user and the application, which are not necessarily the same. A number
    of methodologies can be used in reviewing the design and architecture, including
    threat modeling using techniques such as Microsoft’s STRIDE and DREAD (Meier et
    al. 2003), OWASP (2018a), and OCTAVE (Alberts et al. 2003). A brief discussion
    of threat modeling is provided in section 12.3.3.1. Studies have shown that it
    is easier and less costly to eliminate software errors in the earlier phases of
    SDLC (Marasco 2007). In a study conducted by the IBM System Science Institute
    in order determine the relative cost of fixing defects within the SDLC, the findings
    show that the costs escalate further down the SDLC phases (Mukesh 2009), which
    is almost similar to results presented in the earlier study (Marasco 2007). Based
    on these studies, the following conclusions can be drawn:


    +   - Errors in requirements engineering are among the most problematic and expensive.

    +   - Requirements errors cost US businesses at least $30 billion per year (Marasco
    2007) and often result in failed or abandoned projects and damaged careers.

    +   - It is necessary to find and fix requirements errors early in the life cycle
    of a project.


    These studies do not specifically identify the relative costs of fixing security
    flaws in SDLC. However, it has been reported that the cost to resolve a security
    issue'
