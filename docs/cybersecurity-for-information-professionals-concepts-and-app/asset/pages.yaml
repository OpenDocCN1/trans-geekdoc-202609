    # Data Security and Social Media


    The popularity of social media platforms has grown over the years and continues
    to grow. Almost all the social media services like Facebook, YouTube, Snapchat,
    Instagram, WhatsApp, and so on have a mobile app available for download for free
    on the popular mobile device platforms like Android and iOS. According to a 2018
    Pew Research survey of U.S. adults who use social media sites through the website
    or on their cellphone, two-thirds of American adults use Facebook, only YouTube
    has a higher adoption rate, which was 73%. Two other companies owned by Facebook,
    Instagram, and WhatsApp are used by 35% and 22% of U.S. adults, respectively.
    74% of American women and 62% of men use Facebook book, also 74% of the survey
    responders indicate that they visit Facebook once a day and 45% of the responders
    gets news from Facebook (Gramlich 2019). From the survey results, we can infer
    that Facebook’s influence as a social media platform is very strong, beyond that,
    the user data that Facebook has access to is huge. When you include some of Facebook’s
    notable acquisitions in the social media space like WhatsApp and Instagram, you
    can only begin to imagine how close Facebook is from identifying you. WhatsApp
    is a social platform that uses your primary phone number as a means of identification
    and communicating with other WhatsApp users. This implies that Facebook technically
    has a record'
