  img_proc: true
- pgno: 140
  md: 'effective implementations of an ISO 27000 system may be very simple systems
    as it is argued these can enable individuals to engage with, understand, remember,
    and implement the system requirements. Key to successful IG delivery is human
    engagement with the values delivered by the frameworks.


    The standard requires than an organization understands what information assets
    it holds and then ascertains the value of these assets. The starting point for
    evolving the ISMS is the information asset register which records the asset, its
    value, location, and owner in terms of assigning responsibility for the asset.
    Information assets are wide ranging and include the knowledge that individuals
    hold if it is significantly valuable and the future potential lack of availability
    of that knowledge presents a risk to organizational processes. In essence, ISO
    27000 links knowledge management concepts (which focus on human knowledge of organizational
    value) and records and information management. Furthermore, any other key components
    that are part of the delivery of information assets value must be listed, including
    software suppliers, systems hardware, and other non-technological information
    components.


    # Risk Assessment and Treatment


    Risk assessment and risk frameworks are a mandatory part of the ISO 27000 framework.
    The risk methodology requires the development of the information asset register
    to ensure that the threats and vulnerabilities for each information asset’s confidentiality,
    integrity, and availability are managed. Risk assessment should involve the identification
    of information opportunities in addition to potential negative consequences from
    system failures. Thus, Cloud computing services provided by a third party may
    result in some loss of organizational control. However, working with a Cloud service
    that operates at a larger scale may provide additional expertise to mitigate against
    new and emerging software threats/vulnerabilities. Key to decision making in terms
    of the whole infrastructure deployed is to understand the value(s) of information
    and the competing requirements and threats/vulnerabilities.


    The overarching risk management process requires the understanding of strategic
    objectives, the establishment of risk appetite (i.e., the level of risk exposure
    which is acceptable), risk assessment, analysis and evaluation, risk reporting,
    decisions and treatment, and then ongoing monitoring and review. In the simplest
    of systems, the information asset is provided with a value which aligns to the
    scored impact should the information be compromised in any way. In the context
    of ISO 27000 compromise may mean that the information is:


    +   disclosed to unauthorized parties, for example, if the information is stolen
    for the purposes of identity theft or other forms of cybercrime;'
  merge: -1
  img_proc: true
- pgno: 141
  md: '+   - unavailable, for example, through loss, data corruption, or as occurs
    in the instance of a ransomware attack;

    +   - no longer trustworthy, for example, if a system has been tampered with.


    In terms of valuing information, it is important to note that the value of information
    may not be static. Some information relies on immediacy, for example, information
    relating to financial markets may be highly significant at a very particular point
    in time. Other information accrues value. In the context of big data, data gains
    value by virtue of the scale of information held. The same piece of information
    or data may have multiple significances to different stakeholders. Against each
    asset, any threats/vulnerabilities relating to the asset are identified, described,
    and estimated. A threat itself cannot be managed but the vulnerabilities the threat
    can exploit can be dealt with. As risk seeks to mitigate the “effect of uncertainty
    on objectives” (ISO 2018) organizations will then determine an approach to risk.
    The risk exposure is calculated by multiplying the asset value/impact by the likelihood
    of the vulnerability being exploited.


    In addition, to assessing the organizational and legislative context, a number
    of models can help with understanding risks. One such model is the STEEPLE model.
    This has seven factors which provide domains for considering risks. The seven
    factors are (Lomas and McLeod 2017) sociocultural factors (S), technological factors
    (T), economic factors (E), environmental impacts (E), political factors (P), legal
    factors (L), and ethical factors (E). These enable information values to be considered
    in a diverse way and to take into account risks including social agendas more
    widely. For example, the factors take into account environmental considerations
    considering the power resource implications of managing information through time.
    One case is that of bitcoin. Alex de Vries, a bitcoin specialist at PwC, has estimated
    that the servers required to run bitcoin consume almost as much power as that
    taken to run Ireland (De Vries 2018). Equally many individuals now have multiple
    devices running and consuming power for a wide range of nonessential uses. As
    such IG does encompass environmental considerations which may score differently
    in terms of an impact as opposed to economic impacts.


    While the approach of quantifying risk by multiplying the asset value/impact by
    the likelihood of the vulnerability being exploited is one of the more common
    approaches, it is not the only one. Another approach commonly used in an information
    and communication technology (ICT) context relates to analyzing the single loss
    expectancy (SLE) for a single event which is calculated by the asset value multiplied
    by the likelihood or exposure factor. An annualized loss expectancy can then be
    calculated by multiplying the annual rate of occurrence by the SLE. This can be
    a useful approach in an ICT context where, as an example, power outages may influence
    ICT service delivery on multiple occasions or with regard to cybersecurity where
    there may be numerous cyberattacks.'
