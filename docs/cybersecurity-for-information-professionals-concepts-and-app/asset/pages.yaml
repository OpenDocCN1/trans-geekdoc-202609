  md: '# Chapter 13


    # Data Security and Privacy


    Biodun Awojobi and Junhua Ding


    Department of Information Science, University of North Texas


    # Introduction


    Data security is about the technology and policy for protecting confidentiality,
    integrity, and availability of data during its entire life cycle. Confidentiality
    means data are only accessible by authorized users and are protected from unauthorized
    disclosure; integrity means data are correct and prevented from improper and unauthorized
    modification; and availability means data are always accessible whenever needed
    and are prevented from denying of service (Bertino 2016, 400–407).


    The emerging of big data and Internet of Things (IoT) brings the great attention
    of data privacy. While data confidentiality is the basic requirement to data privacy,
    it has additional requirements for complying legal privacy regulations and managing
    individual privacy preferences (Bertino 2016, 400–407).


    The technology for ensuring data security and privacy can be summarized as four
    controls: access controls, flow controls, inference controls, and cryptographic
    controls (Denning and Denning 1979, 227–249). The four controls for protecting
    data security were introduced by D. Denning and P. Denning in their data security
    paper published four decades ago (Denning and Denning 1979, 227–249). The four
    controls are still applied to modern data security and privacy, although many
    new control models have been invented. For example, role-based access control
    (RBAC) (Ferraiolo, Kuhn, and Chandramouli 2003; Ding and Mo 2012, 92–101) has
    been widely implemented in modern computing systems, and differential'
  merge: -1
  img_proc: true
- pgno: 312
  md: 'privacy (Dwork et al. 2006, 265–284) has been implemented for inference controls
    by a few large data consumers including Google and Apple.


    Computers are increasingly becoming more portable and always connected to the
    internet. The rapid technological advancement in the smartphone market and sensor-based
    devices that are connected to the internet exposes opportunities for new privacy
    and security threats. Generally, IoT establishes the concept that virtually every
    physical thing or sensor-based device in the world that can be connected to a
    power source can become a computer that is connected to the internet (Fleisch
    2010, 125–157). It is expected that in year 2020, there will be at least 25 billion
    connected devices (O’Neill 2016, 48–49). These always-on and internet-connected
    devices that are in our homes and offices will collect data about us and store
    the data in a database on remote servers. A privacy or security breach of the
    connected devices can be costly.


    Mobile applications have revolutionized the user experience with smartphones.
    Most smartphones are equipped with sensor and connectivity capabilities like a
    GPS, WiFi, bluetooth, memory, data storage, camera, and lots of sensors like an
    accelerometer, light sensors, and so on. In most of the developed countries, smartphones
    are also always connected to the Internet (Gramlich 2019). IoT devices are similar
    to smartphone devices because, like smartphone devices used in most developed
    countries are always connected to the Internet, IoT devices are generally always
    connected to the Internet at all times. Not all mobile applications require the
    Internet to run on a smartphone. Mobile applications often make a user to create
    an account on their server for recognition and tagging, they are also capable
    of controlling the sensor and connectivity capabilities of the smartphone by default.
    This means that if the mobile application is owned by a third-party developer,
    the app developer can collect sensitive user data without the knowledge of the
    end user. Smartphone makers such as Apple and Google have features built in their
    software to limit and in most cases prevent privacy and breaches; however, the
    enforcement is based on a shared responsibility model. The device owner needs
    to implement the control to protect against a security breach. Enforcing password
    protection policies such as implementing biometric authentication, use of strong
    password complexity, age, and reuse requirement is important.


    The use of social media platforms such as Facebook, Instagram, YouTube continues
    to grow because of the wide adoption of mobile applications on smartphones (Gramlich
    2019). Social media platforms introduce many unknown privacy risks to the users
    of the platform, especially risks around user profiling (Isaak and Hanna 2018,
    56–59). The privacy issue gets heightened, especially when the social media platform
    owner is unaware of the sensitive user data being collected through its platform.
    Users should have the right to delete mobile application from their smartphones
    and also completely erase their presence on a social media platform. Security
    and privacy need to be protected during the four phases of the data life cycle.
    The five phases of the data life cycle are data'
  merge: -1
  img_proc: true
- pgno: 313
  md: 'generation, data sharing, data usage, data storage, and data destruction. The
    social media platform owner should create explicit security and privacy policies
    and guidelines for the platform users and developers.


    # # Technology for Data Security and Privacy


    Access controls are the selective restriction of data access for regulating who
    can access the data and what can be accessed. Flow controls regulate the data
    propagation process to protect data from being accessed by unauthorized users
    and prevent a data flow if it is unauthorized (Bacon et al. 2014, 76–89). Inference
    controls prevent data from leaking specific information that is reconstructed
    through deduction of confidential information by inference (Denning and Denning
    1979, 227–249). Cryptographic controls are to protect data from unauthorized accessing
    through encryption of data, which are scrambled into unintelligible ciphertext
    (Denning and Denning 1979, 227–249). In the following section, we describe some
    representative models for each control.


    # ## Access Controls


    The main access control models include discretionary access control (DAC), mandatory
    access control (MAC), RBAC, and attribute-based access control (ABAC). Each organization
    may use different access control models according to its security and privacy
    requirements.


    DAC asks the system administrator or the owner of data to set the access control
    policy for each data object. The access control policy defines access rights for
    each user to a data object such as a file. An example of DAC is the access control
    of Unix files, which defines the read, write, and execute permissions for the
    owner, users in the same group, and other users of a file. DAC allows a user to
    transfer its ownership to another user, which could cause security problems.


    MAC is a hierarchical approach to control the access to data objects. Only the
    system administrator can set the access control policy for each user to access
    every data object, but an end user of a data object cannot change the access control
    to the object. Each data object is assigned with a security label, which contains
    a classification of security information such as top secret or confidential, and
    a category of management information such as department or college. Each user
    in the MAC system is also assigned with the classification and category properties
    from the same set of properties applied to the data objects. When a user accesses
    a data object, the MAC system compares the user’s classification and category
    information to the one that is assigned to the data object to grant or decline
    the access request. An example of MAC is the access controls of Windows operating
    system for admins, ordinary users, and guests.'
  merge: -1
  img_proc: true
- pgno: 314
  md: 'RBAC creates a group of roles such as Administrator or Developer based on their
    business responsibilities in an organization that the RBAC system belongs to.
    Each role is assigned with a set of access rights such as read, write, and execute,
    and then each user is assigned with one or multiple roles. The user has all access
    rights for its roles. Each data object contains a set of access control attributes.
    Attributes are sets of access rights that are used to describe the access control.
    A user can only access the data object when its role has the access rights that
    meet the control requirements set by the access control attributes.


    ABAC uses attributes as building blocks in a structured language that defines
    access policies. The attributes include user attributes, resource attributes,
    object attributes, environment attributes, and other attributes. When a user accesses
    a data object, ABAC system grants or declines the access based on the access policy,
    the user’s attributes, the attributes of the object, and the environmental attributes.
    Although ABAC provides dynamic, context-aware and risk-intelligent access controls,
    ensuring the completeness and soundness of the access policy could be a grand
    challenging task.


    # Flow Controls


    Flow controls can be implemented with the access controls (i.e., MAC, DAC, RBAC,
    and ABAC) discussed above. The access control rights include one for controlling
    whether a user can transfer a data object and an object can be transferred or
    not. MAC, RBAC, and ABAC require a central authority to specify the flow controls
    or policies, but DAC can allow each user to specify the flow controls for each
    data object. System support is still needed for continuously checking the data
    flows at runtime (Bacon et al. 2014, 76–89). A system may use a dynamic technique
    to enforce security policies during runtime by terminating data transferring when
    a possible leak is about to happen.


    # Inference Controls


    A statistical database is a database for statistical purposes through offering
    queries for finding statistical information from the database. The statistical
    information is calculated from individual information collected in the database,
    but the individual information should be kept confidential. However, an adversary
    could learn the confidential contents of a statistical database by creating a
    series of targeted queries and remembering the results. An adversary can also
    learn the private information though cross-checking queried data from different
    data sources (Narayanan and Shmatikov 2006). Differential privacy (Dwork et al.
    2006, 265–284) is an effective way of inference control to protect data from inference
    attacks. Differential privacy is an approach for preventing leaking of privacy
    information of individuals that are in a statistics database that publishes aggregate'
  merge: -1
  img_proc: true
- pgno: 315
  md: 'information. For example, many companies and government agencies publish statistical
    aggregates while protecting confidentiality of individual survey responses through
    inference controls with differential privacy. One of the advantages from differential
    privacy is that it provides acceptable accuracy of the statistical aggregates
    while prevents privacy information of individuals from being visible to anyone.
    The basic idea of differential privacy is to add randomized “noise” into an aggregate
    query result so that an adversary learns “virtually nothing” more about an individual
    than they would learn when the individual is absent from the dataset. The “virtually
    nothing” means an adversary can only get an insignificantly small change in belief
    about an individual in the database. The E-differential privacy proposed by Dwork
    et al. (2006, 265–284) is used to control the extent of the change. The lower
    is the value of E, the less is the change of the benefit of the individual. A
    randomized algorithm A is E-differential private when the probability of result
    x returned by algorithm A that is applied to dataset D1 to the probability of
    the same result x returned by algorithm A that is applied to dataset D2 is significantly
    small, which is defined by E, for all x and for all pairs of datasets D1 and D2,
    where D1 and D2 are different with only one record (Dwork et al. 2006, 265–284).
    Laplace mechanism (Dwork et al. 2006, 265–284) can be implemented to process results
    of aggregate queries with “noise” to make them differential private.


    # Cryptographic Controls


    Cryptographic controls are critical for protecting data confidentiality and integrity
    from accidental leaking or modification. There are two classes of encryption:
    symmetric encryption and asymmetric encryption. Symmetric encryption uses only
    one key or called “secret key” to encrypt and decrypt the targeted data. Key exchange
    between sender and receiver of encrypted data is necessary and it is important
    to keep its confidentiality. Examples of symmetric encryption algorithms include
    Advanced Encryption Standard (AES) and Data Encryption Standard (DES). DES was
    developed by IBM and was the first standardized cipher for securing electronic
    communications (Denning and Denning 1979, 227–249). It is used in variations such
    as 2-key DES or 3-key DES. AES is the most widely used symmetric encryption algorithm.
    National Institute of Standards and Technology (NIST) set AES as the standard
    for the encryption of electronic data in 2001. AES cipher has a block size of
    128 bits with three different key lengths as AES-128, AES-192, and AES-256.


    Asymmetric encryption uses matched paired keys called “public key” and “secret
    key.” The public key is published so that it is publicly accessible, but the secret
    key is kept as secret by the owner who created the paired public key and secret
    key. Both public key and secret key can be used for encrypting and decrypting
    data. When data is encrypted with a public key, then only the one who owns the
    paired secret key can decrypt the data. If data is encrypted with a secret key,
    then anyone'
  merge: -1
  img_proc: true
- pgno: 316
  md: 'can decrypt the data with the paired public key. The latter encryption scenario
    is to ensure the encrypted data are only from an expected sender. Since public
    keys are published for public, it is important to ensure a public key is published
    by the declared owner. Public key certification authority is the entity to certify
    the ownership of a public key by the named subject of the certificate.


    Encryption is also used for ensuring data integrity. For example, Message Authentication
    Code (MAC) is used for protecting data integrity by allowing a user to check any
    changes to the data content. The sender of data produces a MAC according to the
    data content using an MAC algorithm, then encrypts the MAC and attaches the encrypted
    MAC to the data. The receiver of the data produces a MAC from the received data
    using the same MAC algorithm, and then decrypts the received MAC. If the decrypted
    MAC and the one produced by the receiver are same, then received data is not modified.


    Cryptographic controls are also implemented in many data communication protocols
    such as https to ensure the security and privacy of the communication, which won’t
    be discussed in this section.


    # IoT Implication for Cybersecurity


    Smartphones might be currently the most widely connected devices to the internet.
    However, this is changing with the emerging IoT applications. IoT devices, which
    are sensor-based devices that help with home automation, are always connected
    to the Internet. Like smartphones, our interactions with IoT devices generate
    data points, which can be converted into intelligent information. Gartner believes
    that by 2020 we will have 25 billion connected devices, while Cisco believes that
    we will have 50 billion connected devices by 2020 (O’Neill 2016, 48–49). Other
    analysts, like Morgan Stanley, believe that the number of connected devices will
    be as high as 75 billion. IoT will not only dramatically change the way we operate
    in the world today, but it will also open new cybersecurity challenges. For example,
    we can wake-up in the morning and realize that our car has driven itself to our
    most recently viseted location because of a hack or a malfunction. IoT is the
    future; it is part of humanity’s journey to digital transformation. In fact, some
    argue that the benefits outweigh the security and privacy risks that IoT poses
    currently.


    The three key principles of cybersecurity are explained with the CIA triad, which
    are confidentiality, integrity, and availability (Aldossary and Allen 2016). IoT
    privacy is a confidentiality issue, while integrity and availability are IoT security
    issues. When an unauthorized user gains access to the data on an IoT device, it
    means that there has been a breach of privacy. A breach of security often occurs
    prior to a breach of privacy. For example, the password to the IoT device may
    have been compromised and used to maliciously collect data from the device. In
    this scenario, a security breach preceded a privacy breach. An example of a breach
    of integrity with IoT'
  merge: -1
  img_proc: true
- pgno: 317
  md: 'devices is manipulating device settings such that the user data is sent to
    another server. Preventing the device from being accessible to the owner either
    through physically or programmatically tampering with the device is an Availability
    issue. IoT has a significant technological intensity. Tech intensity refers to
    the adoption rate of new digital solutions. Imagine if you can receive a package
    with your IoT-powered doorbell system, while you are in another country. This
    could have been a package that would have had to be returned if it weren’t for
    IoT. IoT was listed on the top-three list of disruptive technologies, second only
    to Mobile Internet and Automation of knowledge work, which are both technologies
    heavily influenced by IoT (Manyika et al. 2013).


    The issue of IoT security is one that we cannot underplay or ignore. IoT devices
    are typically low-powered devices. This means they lack robust hardware resources
    like memory and computing power to load a full network stack – features that are
    often included in high-powered devices like a standard computer. Most IoT devices
    only have the module required to perform its core functionality. This implies
    that the devices are naturally prone and vulnerable to hacks (Jaswal et al. 2017,
    1277). For most IoT device manufacturers, creating an easy to setup experience
    trumps security. Most consumer IoT devices do not follow common security best
    practices such as using strong passwords or enforcing high-security wireless encryption
    standards. If an IoT device is compromised, the data collected by the bad actors
    from the device or group of devices is often personal and sensitive which can
    pose a huge privacy threat. It is difficult to have an end-to-end security design
    for IoT devices such that the entire information collection, transmission, processing,
    and retrieval process are captured. Some legacy devices have vulnerabilities that
    cannot be patched through software and can only be mitigated with hardware. Smartphones
    are commonly used to set up and control IoT devices, typically with a mobile application.
    If the mobile application developer is collecting information about the usage
    of the application, then there are some security vulnerabilities that need to
    be assessed and addressed.


    # Mobile Applications Security Issues


    Smartphones and tablets are low-powered devices compared to desktop and laptop
    computers. Device manufacturers of smartphones and tablets install an operating
    system that is capable of maximizing the device features and capabilities of the
    hardware like a battery, sensor, touchscreen, and so on. Smartphones and tablet
    by default have a mobile version of a web browser installed. As the operating
    system of a mobile device is not designed to run a full-featured browser as you
    have on a Microsoft Windows machine or a Macintosh device, running one can potentially
    drain the devices’ resources like the battery. The mobile web browser is an example
    of a mobile application. We, therefore, define a mobile app as a software application
    that can be downloaded wirelessly from an app store or through any other'
  merge: -1
  img_proc: true
- pgno: 318
  md: 'software vendor. It is designed to run specifically on smartphones, tablets,
    and other mobile devices. Mobile apps are designed to take advantage of mobile
    device software and hardware capabilities. iPhones, for example, have inbuilt
    components such as an accelerometer, touchscreen, front-facing cameras and so
    on. Mobile device manufacturers preinstall mobile apps on their mobile devices.
    Examples of such apps from the Apple iOS ecosystem are Safari browser, mail app,
    photos app, and so on. Mobile apps preinstalled and developed by mobile device
    manufacturers are called native apps. Users are also able to download other apps
    from other developers like games, social apps, and so on from the device manufacturers’
    app stores. Apps developed by other developers are referred to as third-party
    apps. Some of these mobile apps are offered as free apps while others need to
    be paid for.


    Unlike a web browser that relies on the Internet to download the required website
    data, most mobile apps do not require the Internet as they already have the data
    required to run the application downloaded. A significant design advantage for
    mobile app developers is that the user experience and behavior of the app user
    are controlled by the app developer. In terms of security, app developers continually
    provide security and feature updates for the apps. Unfortunately, mobile apps
    are not immune from zero-day attacks. Sometimes device exploits may have been
    carried out successfully on several devices before the app developer discovers
    it and subsequently releases a security fix.


    Ensuring that a mobile device is secure and that our sensitive data does not fall
    in the wrong hands is not the sole responsibility of the software developers and
    hardware manufacturers; we have a part to play. The software in mobile devices
    allows for its users to enforce a certain level of security. A mobile device operating
    system like the Apple iOS or the Alphabet Android has been preloaded with the
    standard security framework and toolsets. It is the responsibility of the user
    to implement them. For example, passwords on mobile devices are not mandatory
    but are recommended. Some mobile device users prefer not to have a password on
    their device because of the hassle of unlocking the device. It is important to
    note that passwords are not highly respected in the security community as some
    argue that policies need to be enforced to ensure that passwords are secure. Policies
    like:


    +   - Password age requirements, where a password can only be used for a certain
    period, after which the user needs to change the password;

    +   - Password complexity;

    +   - Password reuse requirements also help bolster the security posture of our
    mobile devices.


    Knowing that your username and password is all that is required to gain access
