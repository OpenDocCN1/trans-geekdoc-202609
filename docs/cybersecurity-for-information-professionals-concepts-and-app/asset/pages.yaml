    # Introduction


    This chapter was written halfway through a yearlong project funded by the

    California State Library LSTA “pitch an idea” grant program and in partnership

    with a group of 40 libraries in the San Francisco Bay Area called the Pacific

    Library Partnership (PLP), of which the author’s home library in Palo Alto,

    California, is a member. It contains the views and observations of the author
    and

    should not be confused as an endorsement by any affiliate organizations.


    The project was designed to test the effectiveness of Minecraft as a platform

    that librarians, and especially public librarians, could use to engage with teens
    and

    tweens on the subject of cybersecurity. Readers may find it interesting to know

    that testing course material against different target demographics was not the

    original intent of the grant “pitch” process, but at the advice of multiple librarians

    and state library’s grant advisor, we identified tweens as largest consumers of

    Minecraft media, but not without some debate. This change is reflected in the'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'final grant proposal title which specifically mentions both groups as “youths”
    and ultimately, a redesign of the original course material to reflect the cybersecurity
    understanding and cybersecurity need of young people who may not yet even poses
    a personal email account. That said, because Minecraft uses individual usernames
    and passwords to log in, and has a history of data breaches affecting the community
    at large, the need for cybersecurity awareness had already been set.


    # # Project Goals


    The first phase, which ran from July to November 2018, consisted of several informal
    email surveys sent out to the PLP community, followed by interviews with librarians
    and teen advisory boards or groups, and more formal research avenues including
    pitching the idea at library conferences and networking with Minecraft and security
    professionals. Above all else, multiple years of Minecraft gameplay experience
    were also extremely important, because the plan was to use the actual survival
    gameplay mechanics of Minecraft to demonstrate cybersecurity threat modeling as
    an analogy. This connection is not obvious unless a person has spent at least
    2–3 hours playing the game itself and understands the various threats embedded
    in the game environment and their options for mitigating these threats.


    As much as possible, the goal of this project was to create a series of Minecraft-based
    lesson plans that blended the self-preservation skill sets inherent to Minecraft’s
    survival mode with the survival skills a person needs to cultivate for the purpose
    of protecting their own personal online security cybersecurity. The second, overarching
    goal as a product intended for public libraries was to document the cost effectiveness
    of different delivery methods for the same material, of which there were many,
    and third and finally to create content that was accessible to multiple audiences
    in terms of cybersecurity awareness and Minecraft gameplay skills levels.


    It should be noted that the first iteration of this lesson plan is still in the
    early testing stages, and will continue to evolve through the second half of the
    project, but was built on an idea presented by a researcher at a BSides, an ever-growing
    community run security conference series (White 2016) and later documented on
    the EDUCAUSE Security Matters blog (Markman 2016). As mentioned previously, the
    “prototype” lesson plan uses a design-thinking process to help illustrate the
    rise and fall of specific patterns in cybersecurity risk management based on different
    environmental factors. Students are asked to create and modify their self-designed
    threat profiles based on their understanding of the Minecraft universe, then build
    and test their “digital fort” against their classmates. All of this occurs within
    the game universe of Minecraft itself. This not only allows for a great amount
    of creativity, but also successfully gets people thinking about and building their
    conceptual framework around what makes for a good contingency plans and edges
    toward other cyberskills like network design, security layering, and social engineering.'
