- pgno: 188
  md: '# Designated Officers


    One or more officers need to be appointed for identification and protection of
    social media cybersecurity cases in libraries. The designated officers can monitor
    and track any suspicious activities on the accounts. They can generate security
    protection steps and procedures for everyone.


    # Training and Awareness


    Cybersecurity risks are complex and commonly use modern technologies. In order
    to cope up with it, regular security trainings are required for information professionals.
    Knowledgeable professionals know how to handle complex social media security cases.
    Offering correct cybersecurity education in the academic programs can help the
    information professionals to learn the nuances of security risks. Workshops, webinars,
    conferences can be valuable avenues for increasing knowledge in cybersecurity.


    Social media are often unnoticed when it comes to cybersecurity. However, libraries
    and information professionals regularly use social media for various professional
    purposes. It contains user communication and digital resources. Anyone with wrong
    motifs can threaten the overall library systems through its social media platforms.
    Protection of privacy and confidentiality has been an utmost priority for libraries
    and information professionals. They should uphold this noble tradition by providing
    and offering secure and safer social media platforms for its users.


    # Conclusion


    Online security is often compromised due to lack of knowledge about it. Three
    components – process, technology, and people are significant in overall online
    security. The core of which, however, is people. It is common sense how people
    should develop a more secure online environment. Carefulness on friendship network
    development is crucial. Avoidance of unknown web territories is wiser and safer.
    The CIA (confidentiality, integrity, and availability) model ensures online security
    protection goals. Security experts commonly advice for the use of secured and
    updated web browser, look for popups, pay attention to warning messages, certificate
    errors, and suspicious links.


    As technical advances proceed, the capabilities of attackers are renewed in the
    same rate. Their expertise to filtrate systems for stealing sensitive information
    becomes greater, too. However, human psychology is central to their attention.
    Therefore, right security education is necessary for all kinds of users. Correct
    knowledge about social media cybersecurity risks can prove effective. Moreover,
    users need to pay attention to what they share on social media. Their interactions
    become a data'
