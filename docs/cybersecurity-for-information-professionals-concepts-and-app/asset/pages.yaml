    # Case Studies of Security and Privacy Issues


    # Ransomware in St. Louis


    Some case studies may further convey the possible pitfalls of digital access to
    data, information, and knowledge. Some data, information, and knowledge stored
    in information institutions, such as libraries, may be susceptible to cyber breaches,
    even though it is not proffered to the public via open access. In 2017, cybercriminals
    breached the information systems of 17 separate public libraries in St. Louis,
    Missouri. As a result of this digital trespass, all 17 libraries’ computer systems
    were infected with ransomware that encrypted most of the library system’s digital
    files, and to unencrypt these files the cybercriminals demanded a $35,000 payment
    in the electronic currency bitcoin. The cybercriminals effectively shut down the
    entire St Louis library system and destroyed the library staff’s email system
    in a matter of minutes (Pagliery 2017). Until the sabotage was rectified, this
    caused patron and library staff angst due to them not having access to their normal
    information'
