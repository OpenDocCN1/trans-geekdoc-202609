    of ploys – targeted data collection, content creation, and false amplification.
    Malicious actors steal data from all kinds of users including individuals, government,
    nonprofit and for-profit organizations, and media outlets. They use phishing infected
    with malware and steal user data. Stolen information typically is used for creation
