- pgno: 142
  md: 'Where there is legislation in place, the organization must act to manage and
    mitigate vulnerabilities. However, in many instances there will be a balance to
    be struck in terms of the action required. There is often no one right response
    to the risk choices to be made, as to share information will have benefits but
    may mean opening up information to some additional security risks. An organization
    may have an agreed risk appetite that will be critical to evaluating and implementing
    the appropriate risk approaches. The risk appetite can simply be set at a defined
    level whereby the risk score, if above the defined risk appetite, must be dealt
    with. This is typically dispensed with by terminating the process and thus erasing
    the risk, treating the risk through applying controls, or transferring the risk
    to another party. In the latter context it is important to note that not all risks
    can be transferred. For example, an EU organization that captures personal data
    can outsource the management of that personal data, but nevertheless it retains
    data protection responsibilities under EU data protection laws. In considering
    risk in an opportunistic context there will be certain calculations where the
    risk must be taken to leverage an advantage. In addition, risk can be tolerated.
    It remains impossible to negate all information vulnerabilities if the range of
    information values are to be leveraged.


    Societal expectations for risk in different national and organizational contexts
    do differ. The financial sector is highly regulated to ensure confidence and consumer
    protection within the financial system. The public sector contains large quantities
    of diverse personal data sometimes sensitive in nature. There is an expectation,
    in this context, that the information will be protected and that public-sector
    organizations will be accountable and transparent regarding their actions. For
    example, the retail sector now often has large amounts of customer data which
    need to be managed to provide customer assurance and maintain reputational confidence.
    Within this context information is key for managing supply chains.


    Within the ISO 27000 standard are a list of 114 controls divided between process
    controls such as policies and procedures, physical controls, technical controls,
    legal and regulatory controls, and human controls including HR processes, education,
    and training (ISO 2013b). Organizations can also adopt their own additional controls.
    Controls can be preventive, detective, or corrective. It is a requirement of the
    standard to create a “statement of applicability.” This is defined as a “documented
    statement describing the control objectives and controls that are relevant and
    applicable to the organization’s ISMS” (ISO 2013b). Where a control is not selected,
    then it is necessary to justify within the statement of applicability why the
    system does not require that control. This process helps put in place a structure
    of linked information security responsibilities, for example, ICT will be responsible
    for network access controls and operating system access controls, HR for all employment
    recruitment and contracts including vetting, undertakings of confidentiality,
    and so on. While individual controls may fall within pre-existing frameworks,
    some will require new partnerships and the program of reviewing these'
  merge: -1
  img_proc: true
- pgno: 143
  md: 'controls therefore builds an information management framework of responsibilities
    (Lomas 2010). This is critical for IG and cybersecurity successful delivery. For
    example, HR may decide on homeworking policies, but these will also rely on ICT
    to facilitate access to online working spaces that do not compromise other network
    security considerations. As cyberattacks increase, it is important that training
    occurs with appropriate penalties for noncompliance. A bank may dismiss an employee
    for clicking on a link in an email that may contain a virus or responding to a
    phishing attack whereas a university is not likely to take such severe action.
    ICT will identify the risks and work with HR on training employees but HR will
    determine any dismissal procedures.


    Organizations must have approaches to handling incidents, including accidents,
    as well as full-scale crises including internal and external attacks. Business
    continuity planning provides for pre-empting such situations. One of the listed
    controls relates to change management. In this regard, ISO 27000 requires that
    information systems continue to be continuously monitored, through the cycle of
    planning, checking, doing, acting, and monitoring to make sure all aspects remain
    up-to-date and appropriate. All information security incidents, including near
    misses, must be recorded, reviewed, assessed, and new processes established as
    appropriate.


    Other codes also assist with defining specific data governance and ICT security
    and management requirements. Examples include DoD 5015.2 (Department of Defense
    2002) as a specific security set of measures, COBIT 5 for audit approaches (Information
    Systems Audit and Control Association 2012), and ITIL for maintenance purposes
    (Office of Government Commerce 2011). In a technology context, vulnerability disclosure
    is required to enable organizations to identify and patch weaknesses within ICT
    software and hardware that can be exploited by cybercriminals. A recent report
    by ENISA (2018) sets out the different actors within a vulnerability disclosure
    process and the significant role of economic considerations and incentives that
    may influence their behavior. The report concludes that it is often due to economic
    protection that some vulnerabilities are disclosed responsibly while others are
    not. As such it is important for governments to hold software and hardware suppliers
    to account for such notifications and for the complex network of information relationships
    to be understood to provide IG.


    Too simplistic risk profiling has increasingly been called into question (Gilb
    2005; Lomas 2010). In the wake of the 2008 banking crisis, risk profiling was
    shaken to its roots. The complexity of managing risk and better understanding
    networked risks was given greater recognition. This is further recognized in the
    context of modelling the management of pandemics. This involves more sophisticated
    approaches to planning and considering a range of scenarios and future outcomes.


    Risk management needs to take on board new realities of information creation and
    thus management. As information growth and variety expands, the ethics and realities
    of information value, ownership, and placement across legislative regimes'
  merge: -1
  img_proc: true
- pgno: 144
  md: 'need to be negotiated and risk assessed. ISO 27000’s central focus on frameworks
    with risk management processes at their very heart provide one tool which can
    assist. Nonetheless and critically is international cooperation and collaboration
    at a government and citizen level.


    # Information Governance Subcomponents


    As noted, IG provides an overarching framework but within it there are component
    parts of the “technical” governance delivery which are sometimes isolated to focus
    on a specific aspect of the IG delivery. These include, but are not limited to,
    data governance, information assurance, cybersecurity and governance, information
    security, Internet governance, and IT governance. Where governance is aligned,
    it implies board level oversight and a broader ethical consideration of the delivery.


    Information must be reliable to deliver value and this process is delivered through
    data governance. One way of providing greater assurance of information value is
    to break down the information into its smallest component parts (i.e., data) in
    order to ensure that each piece of data is reliable. This is termed data quality.
    Sarsfield (2009, 38) defines data governance as guaranteeing that data can be
    trusted, and people made accountable for any adverse event that happens when the
    data quality is poor. In this context, this means assigning ownership and preventing
    issues with data quality including fixing any issues that occur. Reliable data
    governance can provide powerful intelligence to impact on decision making and
    direction.


    Data governance is delivered by the provision of data quality linked to the process
    of data curation and stewardship including the provision of metadata. Metadata
    encompasses a wide number of elements. The Dublin Core Metadata Initiative defined
    15 core metadata elements, which have now been incorporated into the international
    standard ISO 15836 (ISO 2017a) and are wide ranging including, for example, metadata
    about the author, creation date, and data format. These elements can be separate,
    encapsulated, tagged, hidden or explicit, automated, or manually applied. The
    international standard ISO 23081 (ISO 2017b) defines six types of metadata including
    metadata about records, agents, business activities or processes, records management
    processes, business rules or policies and mandates, and metadata about metadata.


    Metadata is also a critical component of information assurance which seeks to
    ensure the evidential value of information delivery. The five information assurance
    pillars are availability, integrity, confidentiality, authentication, and nonrepudiation.
    The first elements traditionally align to information security delivery and are
    at the heart of IG frameworks. So too are the additional components of authentication
    and nonrepudiation which refer to the application of processes'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'which will assure that an author’s statement or documentation cannot be disputed
    in terms of its validity. As such it is often associated with legal processes,
    for example, the delivery of a contract. Aligned within this aspect of legal delivery
    is e-discovery which provides a framework for the discovery and production of
    information in a legal suit.


    IT governance looks specifically at the technical delivery (Weill and Ross 2004),
    “the leadership and organizational structures and processes that ensure that the
    organization’s IT sustains and extends the organization’s strategies and objectives.”
    Another IG component is cyber governance which deals with organizational cyber
    risks at a board level engaging key stakeholders. Von Solms (2016) sets out a
    maturity model for this one IG subset. This has been developed based the PwC’s
    global security surveys (PwC 2015). This surveys the budget, roles, and responsibilities
    of the security within an organization, security policies, security technologies,
    overall security strategy, and finally the review of the current security and
    privacy risks. Based on this data set, Von Solms has developed a maturity model
    that sets out four categories against which maturity is measured:


    +   ■ Category 1: Understanding the strategic role of cyber risk in the company.

    +   ■ Category 2: Understanding and providing guidance on the cyber strategy of
    the company.

    +   ■ Category 3: Understanding and reviewing the cybersecurity budget for the
    company.

    +   ■ Category 4: Understanding and evaluating the cybersecurity policies of the
    company.


    The categories have further subcategories and against each, the level of maturity
    is assessed through a scale of nothing existing at all, to a very basic position,
    to a progressed position, and to finally a stable position. The maturity levels
    evidence that, in this context, security is locked down but there is no greater
    ambition than stability. Strategic and opportunistic ambition for information
    more widely is set into the bigger IG framework.


    Cybersecurity systems seek to keep information safe from a wide range of attacks
    within a cyber context. Information security provides for the management of security
    risks across all platforms and information formats including technology and people
    with assets including knowledge, paper documentation, and online data formats.
    To harness the value of information/data while providing protection, sophisticated
    approaches to information creation and management are required. It is an oft quoted
    maxim that a security system is only as strong as its weakest link. In this regard,
    Kooper et al. denote the limitations and inadequacies of relying on only smaller
    parts of governance delivery, such as IT governance (Kooper et al. 2011). To deliver
    on information value, opportunistic and negative risks must be balanced. Kooper
    et al. discuss the balance of actors and the wider'
  merge: -1
  img_proc: true
- pgno: 146
  md: 'dimensions of delivering on information value. To deal with this complexity,
    holistic systems are needed that manage a wide range of information considerations
    not least the human factor.


    Furthermore, as technology is driven globally, these systems must take account
    of information rights legislation at a global scale and regional difference in
    law and citizen expectations must be navigated. As such it is IG, which has emerged
    as a multidisciplinary field that provides for holistic thinking and frameworks
    to protect and enhance the management of information. The 2017 survey delivered
    by the Information Governance Initiative and published in 2018, which claimed
    to have reached 100,000 practitioners globally, stated that 48% of practitioners
    saw IG as essential for successful cybersecurity delivery even though cybersecurity
    is narrower in delivery as it cannot exist without broader underpinning. IG provides
    for a wider and more comprehensive approach.


    # The Human Factor


    As noted by Rubino et al. in 2017, key to good governance is to have leadership
    throughout an organization in order that others take on the significance of managing
    and protecting information ethically. This applies at government levels too. In
    addition, IG needs to be understood and engaged with by multiple parties if it
