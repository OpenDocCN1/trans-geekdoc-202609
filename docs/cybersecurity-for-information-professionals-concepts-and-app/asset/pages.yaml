- pgno: 303
  md: 'Efficient input validation is a must as most vulnerabilities emanate from inadequate
    input validation or none at all. Every input entered by a user should be sanitizing,
    but the best practice is to create a “white list” of expected known good input
    parameters and formats instead of relying on a “black list” of known bad inputs.
    SQL injection is of particular concern whenever user requests need data from a
    database via a web server, which is very common. In order for a SQL injection
    to be successful, the attacker will need to manipulate the standard SQL query
    and exploit non-validated input vulnerabilities (Incapula 2018). To prevent SQL
    injections, we must practice input validation and utilize a web application firewall
    to filter out SQL injections (Incapula 2018).


    We should never trust the input to SQL statements but must use parameterized SQL
    statements. Parameterized SQL statements or queries (also known as prepared statements)
    are a technique of query execution that separates a query string from query parameter
    values. This is done to avoid SQL injections and to speed up query executions
    in certain scenarios. Because query parameters are passed separately, parameter
    values cannot modify (and break) the query string. We are effectively insisting
    that all input to SQL statements must be sanitized.


    We should use libraries (e.g., anti-cross site scripting library) to protect against
    security bugs during web application development and ensure to test the code with
    a web application scanner to detect vulnerabilities. We must make sure to use
    modern compilers, which often include defenses against coding errors; for example,
    GCC protects code from buffer overflows. Use proper error/exception handling when
    coding and check the return values of every function, especially security-related
    functions. In addition, use a secure coding checklist. In order to track changes
    made to the code or document, use version/configuration control; this enables
    easy rollback to a previous version in case of errors. Remember that version control
    facilitates accountability and saves development time.


    Your organization should implement peer reviews and sound security testing, as
    explained in section 12.3.5. Having an organization security policy that prohibits
    the use of banned functions in coding is also important. Don’t store sensitive
    data in cookies and encrypt all confidential data using strong cryptographic techniques.
    Encoding of every user-supplied input is recommended because attackers use malicious
    input to conduct XSS types of attacks and doing so can prevent the client’s web
    browser from interpreting these as executable code. Manage cryptographic keys
    carefully by having a key management plan. Use long keys and strong cryptographic
    algorithms to make it harder for adversaries. Use of FIPS-approved cryptographic
    algorithms is recommended and security protocols with inherent cryptographic weakness
    should not be used (e.g., SSL V2).


    Education and training are also important and every organization should educate
    its developers on how to write secure code, for example, by offering training
    seminars or courses. The training should cover strategies and best practices to
    mitigate'
