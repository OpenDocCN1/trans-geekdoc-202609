  md: '# # Chapter 11


    # # Psychophysiological and Behavioral Measures Used to Detect Malicious Activities


    Dr. Yassir Hashem

    Department of Computer Science and Engineering, University of North Texas

    Denton, Texas


    # ## Introduction


    Insider threat is one of the greatest concerns for information security that could
    cause more significant financial losses and damages than any other attack. The
    insider threat has received significant attention and has been studied extensively.
    However, implementing an efficient detection system is a very challenging task.


    Insiders usually have authorized access to the organization’s computer systems,
    information, and assets and are capable of infiltrating an organization’s sensitive
    information, stealing, or damaging data and sabotaging facilities, equipment,
    and IT systems (Cummings et al., 2012). The computer emergency response team (CERT)
    defines a malicious insider as “a current or former employee who has or had authorized
    access to an organization’s information systems and has intentionally used that
    access to influence the confidentiality, integrity, or availability of the organization’s
    information systems” (Silowash et al., 2012). Little is known about the insider
    threat, and the threat of insider activities continues to be of paramount concern
    in'
  merge: -1
  img_proc: true
- pgno: 250
  md: 'both the public and private sectors (Glasser & Lindauer, 2013; Ponemon Institute
    LLC, 2016). However, many surveys have been done that demonstrate the severity
    of insider threats. For example, the cybercrime report by PwC states that the
    most serious fraud cases were committed by insiders (PWC, p. 2015). A report produced
    by the security management company, AlgoSec, found that a significant proportion
    of security professionals view insider threats as their greatest organizational
    risk (AlgoSec, 2014). The results of the 2014 US state of cybercrime survey conducted
    by the CERT Division of the Software Engineering Institute at Carnegie Mellon
    University shows that 32% of the cybercrime events have been carried out by insiders
    (CERT. (2014, 7)). In 2015, the federal cybersecurity survey of 200 federal IT
    managers shows that 76% of the participants are concerned about leaks from insider
    threats (SolarWinds, 2015).


    The research community has been striving to provide solutions and approaches that
    are capable of mitigating the insider threat problem. Many research studies have
    been investigating and analyzing these types of threats and raising many research
    questions such as what is the scope for involving human and psychological factors,
    and what are the proper approaches to detect and effectively protect the information
    system. Most of these studies and proposed solutions are based on technological
    and behavioral theories and are intended to detect attacks before they impact
    a system and pose irreparable damage (Bowen, Salem, Keromytis, & Stolfo, 2010).


    Many approaches have been proposed including anomaly detection, segregation of
    duties, and security awareness approaches (Kaghazgaran & Tabaki, 2015; Park &
    Stolfo, 2012; Salem & Stolfo, 2009; Thompson, 2004). However, it is recognized
    that solutions to insider threats are mainly user-centric, and several psychological
    and psychosocialal models have been proposed (Greitzer & Frincke, 2010; Theoharidou,
    Kokolakis, Karyda, & Kiountouzis, 2005). Most of these approaches monitor the
    insider''s voluntary activities on using the network or the organization''s computer
    systems and resources; however, a skilled insider can always forge these activities
    and deceive the detection system.


    # # Psychological Aspects of Cybersecurity


    With the growing interest in psychological aspects of cybersecurity, researchers
    are concerned with identifying predictors of these behaviors. However, most of
    these models rely on humans to recognize the signs and record the behaviors to
    detect insider threats. Further, these models tend to rely on detecting insider''s
    voluntary behaviors that could potentially fail to recognize individuals who are
    capable of feigning normal behavior. Other behavioral approaches aim to assess
    cybersecurity violations through changes in user''s activities and require the
    user to interact with computer peripherals (e.g., mouse; keyboard).'
  merge: -1
  img_proc: true
- pgno: 251
  md: 'On the other hand, the psychophysiological measures such as electroencephalography
    (EEG), electrocardiogram (ECG), and eye movement dynamics can provide rich knowledge
    about user behaviors and can provide an excellent source to start a new type of
    insider threat detection system. These measures are involuntarily generated, continuously
    available, and can be measured automatically, which is not available by other
    traditional behavior measures. The human brain processes legitimate and malicious
    activities differently. By capturing the neural activities and user''s brain state,
    we can develop methods to automatically separate malicious activities from benign
    behavior. The neurophysiological methods can provide knowledge of a user''s brain
    state by accessing and recording neural activities.


    The ECG is another psychophysiological measure; it is the electrical activities
    of the heart that have been used in the medical domain for diagnosing many cardiac
    diseases (Polat & Güneş, 2007). It also provides valuable information about the
    state of the user such as the emotional stress, depression, fear, and anxiety
    that affects a user''ss that are unrefined by the conscious mind and generate
    a distinctive feature space of voluntary, involuntary, and reflexive eye movement.
    They can help to identify the changes in the user''s behavior. As the conscious
    and unconscious mental processes generate different patterns of eye movement and
    when an insider engages in malicious activities, his/her brain activity will translate
    to changes in eye movement behavior compared to when he/she performs non-malicious
    activities.


    As the above psychophysiological measures may not always be available, finding
    a correlation between these measures and the user''s computer-based behaviors
    would provide another source to detect the malicious activities. The computer-based
    behaviors, when a user interacts with computer peripherals (e.g., mouse; keyboard),
    can provide dynamic traces of an insider''s mind and can reveal concealed cognitive
    states that cannot be achieved using the traditional behaviors (a user''s behaviors
    when using the network or the organization''s computer systems and resources).
    The mouse and keystroke dynamics have been used widely for analyzing user''s behavior
    such as deception and fraud detection, mental state, and emotion prediction (Kaklauskas,
    Krutinis, & Seniut, 2009; Lali, Naghizadeh, Nasrollahi, Moradi, & Mirian, 2014;
    Lim, Ayesh, & Stacey, 2015; Salmeron-Majadas, Santos, & Boticario, 2014).


    In this chapter, we propose a multi-modal framework based on the user''s psychophysiological
    measures and computer-based behaviors to distinguish between a user''s behavior
    during regular activities versus malicious activities. We utilize several psychophysiological
    measures such as EEG, ECG, and eye movement and pupil behaviors along with the
    computer-based behaviors such as the mouse movement, mouse clicks, and keystroke
    dynamics to build our framework for'
  merge: -1
  img_proc: true
- pgno: 252
  md: 'detecting malicious insiders. We conduct human subject experiments to capture
    the psychophysiological measures and the computer-based behaviors for a group
    of participants while performing several computer-based activities in different
    scenarios. We analyze the behavioral measures, extract useful features, and evaluate
    their capability in detecting insider threats. We investigate each measure separately,
    and then we use data fusion techniques to build two modules and a multi-modal
    framework.


    The focus of this study is on the malicious insider where an employee or other
    insider tries to abuse the system intentionally. The adversary in this scenario
    has an access to the system and a good knowledge of the internal organizational
    processes and structures.


    # Psychophysiological Measures


    Insider threats have been extensively studied and many approaches based on behavioral,
    psychological, physiological, and technical perspectives have been proposed to
    tackle the threat and provide solutions (Greitzer & Frincke, 2010; Kaghazgaran
    & Takabi, 2015; Park & Stolfo, 2012; Salem & Stolfo, 2009; Theoharidou, Kokolakis,
    Karyda, & Kiountouzis, 2005; Thompson, 2004).


    The psychophysiological measures such as the ECG and EEG have mainly been used
    for emotion detection and prediction (Chaniel, Ansari-Asl, & Pun, 2007; Kim, Bang,
    & Kim, 2004; Vaish & Kumari, 2014; Wang, Nie, & Lu, 2014). More recently, some
    studies started to investigate the possibility of using users'' psychophysiological
    measures such as the ECG, EEG, voice, and skin conductivity for data leakage prevention
    frameworks. For example, Almehmadi et al. investigated the use of physiological
    signals as a measurement to detect insider threats (Almehmadi & El-Khatib, 2014).
    Similar to this work, Lee et al. presented an internal information leakage prevention
    system based on insider biometrics signals such as heart rate variability, core
    body temperature, and skin temperature to find unusual changes (Lee et al., 2014).
    These two papers are closely related to this work, where both used psychophysiological
    signals to develop a data leakage prevention and insider threat monitoring framework.
    However, our study used different techniques, provided more extensive research,
    and utilized more psychophysiological measures. Also, our experiments included
    a larger number of participants and more complex activity tasks. For example,
    in Lee et al.’s (2014) study, authors simply measured the heart rate variability
    for one subject while watching a horror movie using a simple software [BioGraph
    Infiniti Software (Thought Technology Ltd, 2017)] to detect the change in the
    biometric signals. In the other study (Almehmadi & El-Khatib, 2014), authors collected
    ECG, galvanic skin response, and skin temperature measures for 15 subjects while
    performing two tasks (normal and malicious) and measured the abnormal deviation
    rate for these measures by simply calculating the'
  merge: -1
  img_proc: true
- pgno: 253
  md: 'difference in the average rate of the sensors raw data. There was no feature
    extraction nor any extensive analysis done over the recorded data in both studies.


    Eye-tracking and gaze-tracking technologies have recently been attracting more
    interest in the computer security domain as relatively low-cost eye-tracking devices
    have become widely available in the market. They have mainly been used for authentication
    and identification (Cantoni, Galdi, Nappi, Porta, & Riccio, 2015; De Luca, Denzel,
    & Hussmann, 2009; Liang, Tan, & Chi, 2012). Closely related to this work are two
    recent studies that utilize the eye movements for insider threat mitigation.


    The first study by Eberz et al. used eye-tracking to propose a biometric based
    on distinctive eye movement patterns with the goal of mitigating the insider threat
    in so-called lunchtime attack scenarios where a person temporarily gains physical
    access to a workstation that he/she is not supposed to use (e.g., using a coworker''s
    workstation while he/she is at lunch) (Eberz, Rasmussen, Lenders, & Martinovic,
    2015). Although they target a particular case of insider threat, the approach
    they proposed was essentially a biometric-based authentication mechanism that
    detect if someone else other than the authenticated user has physical access to
    a device. This work, on the other hand, has an entirely different threat model
    than this work, which focuses on changes in user''s eye movement patterns to distinguish
    between malicious activities and non-malicious activities and detect the threat
    before it occurs. The second study proposed by Neupane et al. who conducted a
    three-dimensional study of phishing detection to detect the unintentional insiders
    based on EEG and eye gaze patterns (Neupane, Rahman, Saxena, & Hirshfield, 2015).
    Unlike this work, which focuses on intentional malicious insider threats, this
    study is related to unintentional insiders (apathetic insiders) and the eye movements
    are used only to identify whether users look at the security indicators.


    In addition, the computer-based behaviors are soft biometrics that have not been
    explored for the insider threat detection and mitigation purposes. However, they
    have mainly been used for authentication and identification (Bergadano, Gunetti,
    & Picardi, 2002; Monrose & Rubin, 2000; Pusara & Brodley, 2004; Valacich, Jenkins,
    Nunamaker, Hariri, & Howie, 2013). Further, the mouse and keystroke dynamics were
    explored for emotional and mental state prediction as well as deception and fraud
    detection (Lali, Naghizadeh, Nasrollahi, Moradi, & Mirian, 2014; Lim, Ayesh, &
    Stacey, 2015; Salmeron-Majadas, Santos, & Boticario, 2014). Closely related to
    this work, Valacich et al. proposed a polygraph technique that utilizes an online
    survey platform to differentiate between innocent users'' and guilty insiders''
    reaction to a concealed information test using specific mouse movement features
    (Valacich, Jenkins, Nunamaker, Hariri, & Howie, 2013). This study targeted a very
    specific case of insider threat using a controlled experiment where the participants
    reacted to visual stimuli displayed on the screen (online survey). However, in
    this work, we did'
  merge: -1
  img_proc: true
- pgno: 254
  md: 'not use any stimuli in the experiments; instead, we focused on developing tasks
    that are close to real-world scenarios.


    # # Experimental Design


    This section provides an overview of the design goals and then describes the experimental
    design developed to meet those goals. We record the EEG signals, ECG signals,
    eye movements, mouse movements, and keystroke dynamics for participants while
    they perform several activities, both benign and malicious. In general, there
    are two types of experiments that can be conducted for our purpose. The first
    is the events control experiment where the participant reacts to visual stimuli
    displayed on the screen, and the device records his/her reaction. The second type
    is the free experiment where there is no specific stimuli or event. In order to
    closely imitate real-world insider threat scenarios we aim to address in this
    study, we have chosen the second type of experiments. We do not use any stimuli
    in the experiments and instead we focus on developing tasks that are close to
    realistic situations.


    The study involves human subject experiments to collect the psychophysiological
    and the computer-based behavioral measures. We have conducted two experiments
    on different groups of subjects. Each experiment emulates a real-life scenario
    that is very similar to a typical work environment. In the first experiment (the
    pilot study), we use a small group of participants (10 subjects) to establish
    our initial analysis and investigate the capability of using the psychophysiological
    measures to detect malicious insiders. Based on the results, we extend our analysis
    and conduct the second experiment (the main study) which includes a larger number
    of participants (25 subjects), more complex activity tasks, and more advanced
    recording devices. Also, we include the eye movement dynamics, as well as the
    mouse movement and keystroke dynamics in our data acquisition phase.


    # # Ethical Considerations


    The experiments were conducted with the approval of the Institutional Review Board
    (IRB) from the University of North Texas, and the participants were compensated
    $30 for one hour of their time. Their participation was voluntary, and they were
    given the option to withdraw from the experiment at any time. We followed the
    standard best practices to protect the participants’ data collected during the
    experiments.


    # # Pilot Study


    This experiment was our first step to analyze the psychophysiological measures
    and investigate the effectiveness of using these measures for insider threat'
  merge: -1
  img_proc: true
- pgno: 255
  md: 'detection purposes. More specifically, we captured the ECG and EEG signals
    for a group of participants (10 subjects) while they performed several computer-based
    activity tasks for both malicious and benign scenarios. The experiments were conducted
    in our lab room which was set up to keep the same environmental conditions for
    all tasks and all participants. Figure 11.1a shows the experimental setup for
    our pilot study. We used the following devices in our experiments:


    +   To record the participant’s EEG signals, we used a noninvasive Brain-Computer
    Interface Emotive EPOC headset (Emotiv, 2014) that contains 14 active electrodes
    (channels) recording the signals from different parts of the brain with a sampling
    rate of 128 Hz.


    +   To record the participant’s ECG signals, we used the OpenBCI 32-bit Board
    (OpenBci, 2014) with 256 sampling rates, a high-quality bio-sensing platform that
    provides a high-resolution recording of electromyography (EMG), ECG, and EEG signals.


    The experiments were done for each participant separately and at different times
    during the day. The experiment was divided into 10-minute tasks for a total of
