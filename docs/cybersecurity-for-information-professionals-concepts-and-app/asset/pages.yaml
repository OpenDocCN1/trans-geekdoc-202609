  md: '# Small Businesses Are Easy Targets for Cyber Assailers


    Small businesses might assume they are nontargets from cybercriminals because
    larger corporations might have more data for criminals to quickly pillage and
    sell. This is an incorrect assumption however. Small businesses are frequently
    targets of sinister hackers because most cybercriminals are cognizant that most
    small businesses either cannot afford adequate antivirus protection, or simply
    do not have the awareness to keep such security software current.


    One example of how easily cybercriminal can infiltrate small business is from
    a case study of Quaint Bakeries. A couple of years ago, two recent graduates of
    California Polytechnic State University commenced a vegan bakery that took orders
    online. They even hired a third-party vendor to install and maintain what they
    thought was adequate software to protect their online assets. This third party
    also set up a virtual personal network to keep the bakery’s IP addresses confidential
    and encrypt various Internet connections. However, this was not quite enough protection
    to prevent all cyberattacks (Strauss 2018).


    While participating in a demo with a Microsoft store (lucky for the bakery, they
    learned their site was not full-proof via a demo rather than really losing valuable
    data to malicious hackers), the two bakers learned that their website could be
    easily spoofed. In other words, Microsoft successfully created a derivative of
    their site with one slight change in the sites URL. The bakers did not notice
    this small derivation and logged into the fictitious site thinking it was their
    actual website. Luckily this was just a demo and the bakers learned a valuable
    lesson (Strauss 2018).


    However, many real cybercriminals create fictitious websites and embed links with
    malware on these sites. When one clicks on one of these links the malware can
    secretly install key-logging software on the user’s computer, and then cyber hackers
    can discover exactly what a user is typing (Strauss 2018). Or worse, what the
    user is doing via video, or saying via various sensors.


    Small businesses need to remember they are just as vulnerable as any other entity
    to cybercrime. They are often a more desirable target due to cyber hooligans’
    knowledge that owners of small businesses might not have the financial means or
    appropriate digital security knowledge to protect themselves. These small business
    entrepreneurs should educate themselves as did the Bakers at Quaint Bakery about
    valid and reliable products and services that may protect their digital assets
    from cybercriminals. Cybercriminals also target the secure data and information
    located in larger companies as well.


    # Cyber Breaches Occur in the Larger Corporate Arena as Well


    Cybercriminals attack corporate information technology venues as well. In January
    2014, Ukrainian cyber hackers broke into Target’s information'
