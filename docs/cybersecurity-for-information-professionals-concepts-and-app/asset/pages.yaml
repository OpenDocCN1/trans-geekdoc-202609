- pgno: 80
  md: 'provide mentoring, training, curriculum resource, and services for other community
    colleges, businesses, and students to strengthen the cybersecurity workforce (National
    Cyberwatch Center 2019). At the federal level, the US Department of Education,
    Office of Postsecondary Education, initiated a Pilot Program for Cybersecurity
    Education Technological Upgrades for Community Colleges (PPCE-TUCC) to support
    the country’s community colleges to expand their cybersecurity education program,
    especially for lower-income students and schools that lack the resource to maintain
    such programs (2018).


    # Professional Certification


    There are many types of professional certification for the cybersecurity domain
    and it is impossible to provide a list of all available certifications in this
    chapter. There are vendor-specified certification and nonvendor-specified certification
    depending on the nature of the job requirement and the goal of the company. Many
    of the postsecondary schools and technical or community colleges are offering
    information security and/or information technology certifications that the industrial
    partners would recognize as valid training. Many of these certification programs
    may require prior computer and networking knowledge and skills before enrollment.
    Professional certifications issued by private (nonprofit or profit) organizations
    are often designed for people who have some work experience in a security role.
    One example is the CISSP (Certified Information System Security Professional),
    which requires a candidate to have relevant work experience in a specific area.
    Another type of avenue to get professional certification is through a combined
    program. There are hybrid programs in which an educational institute includes
    components of the certification requirement as part of their curriculum. Students
    who graduated from those hybrid programs will earn a degree (e.g., two or four
    years) with the qualification and knowledge to participate in a professional certification
    process. With so many different channels to acquire training and certification,
    how does the hiring organization determine who qualify for their cybersecurity
    job openings? Knapp, Maurer, and Plachkina (2017) reviewed cybersecurity programs
    and the role of certification in helping candidates to meet qualification for
    jobs. They found out the industry typically evaluate their candidate’s qualification
    for cybersecurity jobs based on a combination of academic qualification, industry
    certification and work experience. How can someone learn and become a proficient
    cybersecurity professional? Assante and Tobey (2011) discussed the development
    of cybersecurity professionals from amateurs to experts as an ongoing process.
    The traditional career progression in this area required many years of practical
    experience and IT knowledge. Eventually those who are knowledgeable and skillful
    will progress to a mastery level with vast knowledge of digital forensics, operational
    response, and risk management.'
  merge: -1
  img_proc: true
- pgno: 81
  md: '# # National Initiative for Cybersecurity Education (NICE) Cybersecurity Workforce
    Framework


    Knowledge, skills, and abilities (KSAs) is used to describe a set of competencies
    that can be demonstrated by a person. In the technology industry, KSA is often
    used to develop job description, training and development, or evaluation of job
    performance. A recent study (Jones, Namin, and Armstrong 2018) solicited a list
    of current practices and views from a group of cyber professionals at two premier
    hacker conferences, Black Hat 2016 and DEF CON 24. Their findings had shown the
    top five KSAs expressed by the current professionals are: understanding of network
    protocols, network security architecture concepts (including how the traffic flows
    across the network), basic system administration, network, and operating system
    hardening techniques and overall system and application security threats and vulnerabilities.
    More than half of the participants indicated that these KSAs were mostly learned
    from their job, followed by school and self-learning. There is a need to continue
    to improve skills of the current professionals as well as preparing those who
    are interested to work in the cybersecurity domain.


    NICE Framework 2.0 has been developed and updated with a taxonomy of 7 workforce
    categories, 33 specialty areas, 52 work roles, and associated KSAs for the cybersecurity
    domain. Encompassing three components (enhancing awareness, expanding the pipeline,
    and evolving the field), the NICE framework 2.0 identifies seven work categories:
    Security Provision, Operate and Maintain, Protect and Defend, Investigate, Collect
    and Operate, Analyze, Oversee, and Govern (Newhouse et al. 2017). Table 4.1 displays
    the term and descriptions of each workforce category in an alphabetical order.
    Three workforce categories appear relevant to what information profession does:
    Oversee and Govern, Analyze, and Collect and Operate. While Oversee and Govern
    focus on cybersecurity management, Analyze, and Collect emphasize gathering and
    evaluating cybersecurity information.


    As shown in Figure 4.1, mapping the specialty areas with workforce categories,
    some of the specialty areas in other categories also seem relevant to information
    profession. For instance, data administration and knowledge management pertain
    to Operate and Maintain category; risk management in Securely Provision is related
    to Oversee and Govern. Analyze competency seems to be the core knowledge areas
    of security analytics supporting Investigate and Collect and Operate and inform
    other four workforce categories (Protect and Defend, Oversee and Govern, Operate
    and Maintain, and Security Provision) to make data-driven decisions. Reciprocally,
    data administration and knowledge management aid in ensuring the processes align
    with analytics project management.'
  merge: -1
  img_proc: true
