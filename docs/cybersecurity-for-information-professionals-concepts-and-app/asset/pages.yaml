    # Conclusion


    “Cybersecurity issues are complex, and there is no standard recipes for protecting
    information assets within organizations” (Knapp, Maurer, and Plachkinova 2017,
    102). This statement is proven by the diverse roles and interconnected responsibilities
    of cybersecurity professionals at the local and national level represented by'
