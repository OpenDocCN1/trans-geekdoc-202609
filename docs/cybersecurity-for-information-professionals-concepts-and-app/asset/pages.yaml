  md: '# Chapter 6


    # Information Governance and Cybersecurity:

    Framework for Securing and Managing

    Information Effectively

    and Ethically


    Dr Elizabeth Lomas


    Associate Professor in Information Governance, University College London


    # Introduction


    Over the last 30 years the value of information/data has increased as new technologies
    have made it more accessible, enabled it to be reused, and to add new uses, for
    example, through linked data, aggregated data, or big data. As such data has become
    increasingly commoditized with greater recognition of a range of information value(s).
    New technologies have created new forms of digital assets. An example is blockchain
    which has underpinned developments in cryptocurrency such as bitcoin. Another
    example is personal data, which in 2011 the World Economic Forum defined as a
    new asset class that it predicted will increasingly spur a host of new personalized
    services and applications with incredible velocity and global reach.'
  merge: -1
  img_proc: true
- pgno: 130
  md: 'In order to take advantage of new information possibilities provided by technology,
    including the capacity for workers to connect 24/7, and new communication channels
    with enhanced audience reach, organizations have moved from a world in which they
    have been able to control information within internal boundaries to one in which
    the organizational boundaries are permanently perforated. New forms of data storage
    distribute and manage data in different ways, for example, the Cloud. In addition,
    there are new demands and expectations for organizations to interface and actively
    interact or even cocreate information with external stakeholders. Moreover, the
    digital world connects to and manages the physical world creating the “Internet
    of Things.” Information now acts as the latest form of oil driving economies and
    societal living requirements.


    In tandem with the growing potential, value, and social significance of information,
    the online management of a wide range of data has opened up information/data to
    new forms of theft and attack. New channels and the proliferation of information
    have led to new types of misinformation and subversion. The threat and reality
    of cybercrime and cyber warfare has significantly increased (Arquilla, 2012).
    A 2018 report by the security company Norton reported that in the year of 2017
    alone, 44% of consumers were impacted by cybercrime. At an international level
    we see increasing reports that cyber warfare is ongoing. Denardis (2014) highlights
    the alleged 2010 use of the USA/Israeli Government to undermine the Iranian nuclear
    programs through the deployment of the Stuxnet Worm and the Russian Denial of
    Service attacks on the Estonian Government in 2007. Such attacks can cause both
    national reputational damage and tangible impacts. It has moved the focus of Internet/World
    Wide Web, telecommunication infrastructures, and mobile usage into an arena of
    open international dispute. For example, in 2018 the USA National Defense Authorization
    Act resulted in the Chinese company Huawei being banned from the 5G networks due
    to concerns over spying. Huawei are bringing a legal case to attempt to overturn
    this decision. This further evidences the complexity of international information
    and infrastructure control.


    To deal with these complex information world dynamics, it is the field of information
    governance (IG) which has emerged as the solution for individuals, organizations,
    and nations (Lomas 2010; MacLennan 2014; Smallwood 2014) to manage information.
    IG provides the solution to dealing with information challenges in terms of both
    opportunities and dangers that are implicit within information creation. It deals
    with the management of information assets legally and ethically as well as providing
    guarantees around information confidentiality, integrity, and availability through
    time. It raises information to government and board level as an area for regulation,
    oversight, and active strategic management. IG is multidisciplinary drawing on
    a range of expertise to deliver information agendas. Embedded within IG are other
    governance components which form'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'smaller parts of the IG framework delivery. These include, but are not limited
    to, cybersecurity and governance, computer/IT governance, data governance, information
    assurance, and Internet governance. Importantly IG provides frameworks that align
    people, processes, and technology in accordance with the law and best practice.


    # # The Information Governance Context and Its Relationship with Cybersecurity:
    A Historical Perspective


    IG has grown out of corporate governance thinking which has been legislated and
    regulated for and applied across public and private sector settings. Governance
    provides for governing, controlling, and regulating good order to deliver societal
    values including protection. As such, the term governance has developed to require
    a system of leadership and management that balances societal goals and is in essence
    “ethical.” The system of governance may be applied to a nation, business, charity,
    or some other body. In 2000, a leading proponent of corporate governance, Sir
    Adrian Cadbury, described the complex balance which corporate governance should
    deliver in terms of providing for the delivery of economic and social goals which
    consider individual and communal needs. He stated that the aim of governance in
    this context is to align the interests of individuals, corporations, and society
    as nearly as possible (Cadbury 2000). This therefore includes the organizational
    management of relationships across organizational boundaries to sustainably deliver
    employment and prosperity while promoting integrity, openness, value, and diversity
    for a wide range of interests (Financial Reporting Council 2018).


    As such, governance is not a fixed concept but is dependent upon the ethical values
    of society and the governments in place, which inform and dictate the format for
    leadership, societal accountability, and trust. Within this context of corporate
    governance, information plays a critical dynamic role. As noted by Willis, information
    delivers: transparency, accountability, due process, compliance, the delivery
    of statutory and common law requirements, stewardship, systems and processes,
    and security of personal and corporate information (Willis 2005, 86–87). As technologies
    have advanced, the role of information within governance agendas has expanded
    and over time becoming a distinct activity particularly as information as an asset
    has been better recognized (Lomas 2010). In 2010, Deborah Logan (2010) wrote a
    Gartner blog post defining IG as the specification of decision rights and an accountability
    framework to deliver “desirable behaviors.” She wrote the blog under an article
    titled, “What is information governance and why is it so hard?” Clearly to provide
    a holistic framework is not simple and the scale of this endeavor is not to be
    underestimated in terms of the support and resources required. In 2012, Barclay'
  merge: -1
  img_proc: true
- pgno: 132
  md: 'T. Blair, a founder member of the Information Governance Initiative think tank,
    defining IG, again emphasized this complexity in terms of the need to deal with
    information through comprehensive IG programs which deliver the value of information
    assets while minimizing risk and cost (Blair 2012).


    In part, the complexity of the IG endeavor relates to the wide-ranging nature
    of information assets which may be marketable resources but in addition represent
    something more. As Desouza (2009, 35) states, resources can be traded being purchased
    and sold in the marketplace but in contrast assets are things that organizations
    care deeply about. Such assets have a more strategic and complex set of values.
    In essence, information can be a product or service; it can deliver influence,
    a competitive edge, education, enrichment, and entertainment. It can have a monetary
    sales value and/or a cost to recreate it. However, it can have other wider societal
    values in terms of national, organizational, personal, or cultural memory and
    identity. It can be something to share or keep private. It is important to note
    the complexity and multiple realities of information value to different stakeholders
    through time. Reliable authentic information, delivered by systems with integrity,
    develop trust, accountability, and the potential for democracy and/or open systems
    of government. In this context, cybersecurity helps provide protection and strategies
    for authorized access to information. IG provides a wider vision of information
    needs.


    Today IG has evolved to straddle four key domains, each of which is underpinned
    by risk management processes: information economics recognizing the value(s) of
    information assets, information laws and ethics, information management, and information
    security (which extends to cybersecurity and other information security including
    the management of paper records). IG balances stakeholder needs to provide access
    and information use in addition to protection. In terms of managing information,
    IG is the framework of choice as the broadest and most comprehensive. As noted
    by Eugen and Petruţ (2018), IG encompasses data governance and IT governance.
    ENISA set out that cybersecurity is one aspect of a bigger governance delivery
    picture (2015, 12), with cybersecurity focusing on the specific protection required
    for information rather than a wider information picture which is required for
    organizational and national level delivery more generally. Cybersecurity does
    consider national and international safety but does not address citizen requirements
    in terms of other information needs. IG requires holistic thinking, experts, and
    collaboration to ensure successful information delivery for society. As defined
    by Lomas et al. (2019, 4), IG provides a holistic ethical framework, “which takes
    into account a range of societal and individual stakeholder information needs.
    It enables a just process of information co-creation, sharing, management, ownership
    and rights.” In line with social justice concepts, all can be invested in the
    IG system. It takes into consideration individual, family, community, organizational,
    and societal needs supported by practitioner experts but in addition citizens
    more generally.'
  merge: -1
  img_proc: true
- pgno: 133
  md: '# # National Laws and Ethical Expectations for Managing and Protecting Information


    Key in managing IG is ethical delivery and compliance with law and local expectations.
    Where there is ethical consensus there is law. However, there is limited consensus
    and few international information rights laws exist, even though we live in a
    world where information delivered through technology transcends international
    boundaries. There are differing national expectations for information ownership,
    publication, defamation, libel, sedition, computer misuse, confidentiality, privacy,
    and personal data. In a seminal article, Mason (1986, 5) sets out four key areas
    of ethical dispute with key questions of contention as summarized in Table 6.1.


    These issues have been widely debated. The complexities surrounding these issues
    exist because it is not always possible to balance these differing dimensions
    and there are very different national and cultural perspectives. Van Den Hoven
    (2008, 52–57) discusses the different approaches to understanding the practice
    of


    Table 6.1 Mason''s Four Ethical Issues of the Information Age with Associated
    Questions


    | Area of Contention | Questions |

    |---|---|

    | Accuracy | * Who is responsible for the authenticity, fidelity, and accuracy
    of information?

    * Similarly, who is to be held accountable for errors in information and how is
    the injured party to be made whole? |

    | Property | * Who owns information?

    * What are the just and fair prices for its exchange?

    * Who owns the channels, especially the airways, through which information is
    transmitted? |

    | Accessibility | * How should access to this scarce resource be allocated?

    * What information does a person or an organization have a right or a privilege
    to obtain, under what conditions, and with what safeguards? |

    | Privacy | * What information should one be required to divulge about one’s self
    to others? Under what conditions and with what safeguards? What information should
    one be able to keep strictly to one’s self? |'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'applying ethical principles. Generalists see the possibility for there to be
    agreed overarching ethical principles while particularists see the importance
    of specific contextual circumstances. Reflective equilibrium moves back and forth
    between these perspectives to reach a balanced perspective which is potentially
    more suited to a complex world.


    The closest thing to an agreed global or “generalist” agenda on ethical IG is
    established in the *Universal Declaration of Human Rights* which was adopted by
    the United Nations General Assembly in 1948 in order to set out a global agenda
    for fundamental human rights. While setting out a global moral agenda one can
    see the need for a reflective equilibrium approach to apply these into practice.
    Article 12 and 17 set out rights in terms of privacy and property. Information
    property rights have emerged and developed through patents, trademarks, and copyright
    laws which over the past century have evolved into relatively agreed international
    frameworks. The World Intellectual Property Organization has provided a focal
    point for such discussions. However, in 2019, the EU has moved to protect intellectual
    ownership to a far degree than other Western counterparts. The 2019 Copyright
    Directive places increased responsibilities on social media platforms to regulate
    their content and take responsibilities for copyright infringements. Article 13
    has been termed the “meme ban,” which makes online platforms responsible for removing
    copyrighted content. Article 11 delivers what has been termed a “link tax,” preventing
    news outlets reproducing content. Article 12 of the Copyright Directive prevents
    filming and sharing at events such as sports venues.


    In terms of the Human Rights Declaration, Article 12 sets, “No one shall be subjected
    to arbitrary interference with his privacy, family, home or correspondence, nor
    to attacks upon his honour and reputation. Everyone has the right to the protection
    of the law against such interference or attacks.” This thus enshrines privacy
    principles. Building on human rights legislation in 1980, the Organisation for
    Economic Co-operation and Development (OECD) passed the *OECD Guidelines on the
    Protection of Privacy*. This established key principles for managing personal
    data or “data protection.” Within the *Universal Declaration of Human Rights*,
    Article 20 asserts a further information related right that, “Everyone has the
    right to freedom of opinion and expression; this right includes the right to hold
    opinions without interference and to seek, receive and impart information and
    ideas through any media and regardless of frontiers.”


    While not necessarily contradictory, the boundaries between these rights have
    not been consistently interpreted at a global level. Within Europe, legislation
    has placed an emphasis on strengthening privacy and personal data rights. In 1995
    the European Union (EU) passed a Data Protection Directive (Directive 95/46/ EC).
    This Directive regulated for a minimum standard for managing personal data across
    the 28 EU member states and those additional nations within the'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'European Economic Area (Iceland, Liechtenstein, and Norway). In 2016, the EU
    passed the General Data Protection Regulation (GDPR) with even stronger requirements
    for managing personal data (European Parliament and Council of the European Union
    2016). This came into force in May 2018. It provides strict requirements for managing
    European citizens data even if the service is provided by a non-EU entity. The
    fines for personal data failings are significant and can cost an organization
    up to 20 million Euros or 4% of turnover whichever is greater. There are six key
    principles at the heart of the Regulation which require organizations to build
    in “privacy by design” when developing any system with personal data elements.
    This concept was first advocated for in the 1990s by the Ontario Privacy Commissioner,
    Ann Cavoukian. As such organizations are encouraged to undertake privacy impact
    assessments. This approach allows for the legislation to remain relevant as the
    needs for managing cybersecurity evolve. Under the terms of the legislation, personal
    data must be protected. The full range of protections are not defined but the
    privacy impact assessment requires that threats are identified and reviewed as
    new security dangers emerge. The recommended standard to build compliance in this
    regard is the International Standards Organization’s ISO 27000 standard series
    which aligns IG and cybersecurity considerations. If personal data is breached,
    then, in the GDPR context, the relevant EU regulatory authorities must be notified
    within 72 hours and penalties may be applied. Those individuals impacted should
    also be informed and the risks of the breach explained.


    This legislation has evolved out of a recognition that personal data has become
    both a valuable asset which provides revenue streams, not least for harvesting
    marketing information, as well as a resource capable of costing an organization
    where it is not properly managed. In 2018, a number of high-profile companies
    received fines for data breaches and data misuse, for example, the two USA corporations
    Facebook and Uber. While these laws are sensible and pragmatic in principle, they
    are not necessarily easy to deliver into practice when considering competing personal
    data rights and demands for wide ranging information use. Businesses have continued
    to push the boundaries. For example, Amazon’s Alexa records all conversations
    within its range regardless of whether the device is being actively used. As discussed
    by Day et al. (2019), the justification for this is that then Amazon staff can
    use the data to improve speech recognition. However, the information on this functionality
    and the ability to change it within Alexa privacy settings is limited. These instances
    happen because of the increasing possibilities of technology and the reality that
    the emphasis on protecting personal data is not interpreted uniformly at a global
    level. Within the USA context there has been a greater emphasis on fundamental
    freedoms of speech in contrast to privacy. This aligns the Human Universal Declaration
    of Human Rights Article 20 with the USA Constitution wherein freedom of speech
    is the First Amendment.'
