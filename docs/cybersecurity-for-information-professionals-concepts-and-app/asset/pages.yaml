  img_proc: true
- pgno: 322
  md: '# Data Usage


    Data usage has to be monitored and controlled since it could easily cause problems
    in data confidentiality, integrity, and availability. The owner of the data should
    be able to control how the data is to be used and is aware of the potential security
    and privacy risk as well as should know how the data could be used. Data usage
    should protect data population and individual privacy according to owners’ preference
    and data usage policies. Encryption of data is an effective way to protect the
    data privacy. However, using encrypted data in many cases such as analyzing data
    using machine learning algorithms or indexing data is challenging although it
    is possible (Agrawal and Srikant 2000, 439–450; Mendes and Vilela 2017, 10562–10582).
    Access controls and cryptographic controls could be used for ensuring the security
    and privacy of data usage.


    # Data Storage


    Encryption is an important way to ensure data confidentiality and integrity for
    data storage. For large amount of data, it is necessary to consider the computational
    cost for encrypting the data and secure way for key management (Chen and Zhao
    2012, 647–651). When the data is needed again, the environment for using the data
    should be available. Of course, protecting the security of physical media of the
    data storage is also critical, but it is beyond the scope of the discussion in
    this section.


    # Data Destruction


    Data could be destroyed in a logical way or a physical way. When a datum item
    is destroyed in a logical way, it is only marked as deleted in a storage system
    such as a database or a file system but the data is still available, which is
    vulnerable for security attacks. Data still could be recovered entirely or partially
    even if they were physical destroyed. Therefore, it is important to follow a process
    for ensuring data is completely destroyed for data destruction.


    # Conclusion


    In this chapter, we discussed the general concept of data security and privacy,
    the four controls: access controls, flow controls, inference controls, and cryptographic
    controls for protecting data security and privacy. We briefly discussed the regulations
    for protecting data security and privacy in the European Union and the United
    States. This chapter provided an overview of IoT, the security and privacy implications
    of the technology. We explained the core concept of cybersecurity using the CIA
    triad. The chapter discussed the core notions of security and privacy with mobile
    applications such as passwords complexity and reuse requirements, and data'
  merge: -1
  img_proc: true
- pgno: 323
  md: 'exfiltration using mobile applications. It also discussed the data security
    issues with social media and provided guidance on how to be safe on social media
    platforms. Finally, we discussed the security and privacy issues on each phase
    in data life cycle. The chapter only gives an overview of the technology and regulation
    for protecting data security and privacy in general.


