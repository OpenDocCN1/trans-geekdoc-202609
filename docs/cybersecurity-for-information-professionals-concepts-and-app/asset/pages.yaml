  md: '# Lessons Learned


    It is apparent that cybercriminals target any and all type of organization when
    seeking to quickly breach an information technology security barrier and steal
    private data and information. All sectors are at risk, government, academic, small
    business, large corporations, nonprofit charities, and so on. The motivation behind
    pirating private data and information is that cybercriminals can quickly sell
    such stolen goods and make a large profit on the dark web. Cybersecurity simply
    does not have the technology nor adequate person power yet to effectively patrol
    the dark web. There are too many discrete locations and ways for cybercriminals
    to complete illegal sales on the dark web. There are government and private agencies
    that can lend some help to victims of cybercrime on the dark web. However, all
    cultural heritage institutions need to remain cognizant of the possible malware
    and cyberattacks to which their information infrastructure and their patrons may
    be susceptible. Such awareness needs to prompt information professionals to ensure
    the utilization of the most valid and reliable antimalware software and that its
    patrons are properly notified of all possible risk when using digital materials
    in their institution. Information professionals should also actively advocate
    for the passage of updated laws that offer strict punitive consequences for those
    who commit cybercrimes, and advocate for adequate funding with which to invest
    in proper safety measures to prevent cybercrimes.


    # Summary and Conclusion


    Emerging trends and horizon technologies are allowing cultural heritage institutions
    to develop new ways of gathering, preserving, analyzing, and synergizing data,
    information, and knowledge. These new technological endeavors offer great benefits
    to global humanity, but also, as with any new development, open new opportunities
    to individuals with malicious intent. As many data, information, and knowledge
    warehouses adhere to the global open access movement; opportunities for data breaches
    are further apparent. Dichotomously opposed to such data, information, and knowledge
    breaches, most cultural heritage institutions, such as libraries, adhere to valuing
    the utmost guarantees of privacy and confidentiality for their patrons. Such strong
    dedication to privacy and confidentiality is exemplified in international library
    policy and is further reflected in international law. Despite such efforts of
    cultural policy makers and legislators, cybercriminals continue to implement malevolent
    tactics such as ransomware, viruses, worms, spyware, Trojans, phishing, pharming,
    and other malicious endeavors.


    Some of these types of cyberattacks result from well-meant initiatives to globally
    share data, information, and knowledge. Dissertations, theses, e-journals, data,
    art, and other types of scholarship are increasingly deposited into open'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'access digital repositories to allow and promote universal access. Promoting
    such access, unfortunately, sometimes leads to data parasites stealing researchers’
    data, or other cybercriminals pirating scholarly works such as these or dissertations.
    These cybercriminals then claim such stolen information and data as their own,
    plagiarize it, offer no credit to the original creator(s), and often utilize this
    pilfered information, data, and knowledge for illegal commercial purposes.


    The current state of the dark web also presents a challenge to all types of cultural
    heritage institutions based in government, academic, corporate, and not-for-profit
    sectors. Cybercriminals may quickly pirate private information and data from these
    entities and turn a quick profit by selling these goods on the dark web. To help
    reduce the illegal behavior being carried out on the dark web, more research needs
    to be completed about how the dark web works, more effective technology needs
    to be implemented to help reduce dark web crime, and new laws need to be passed
    that can enable security to better monitor the dark web and prevent and reduce
    the percentage of cybercrime occurring on the dark web.


    Increasingly, organizations are reassessing their operational readiness to detect
    and respond to a breach. The European Union has addressed some data theft and
    misuse via the General Data Protection Regulation (GDPR). In addition to privacy,
    thanks to GDPR’s stringent breach notification regulation, organizations have
    revamped their incident response programs over the past year to meet the requirements.
    With the recent release of the National Cyber Strategy (White House 2018), the
    United States now has its first fully articulated cyber strategy. However, the
    United States has not recently passed proposed legislation into law to address
    modern data and information misuse. A proposed model statute in this chapter could
    offer insight into how the US federal government, and the 51 states and district
    legislative bodies could provide legal guidance to this issue.


    In the current data-intensive environments, all global standard organizations
    and legislative bodies will be precipitously challenged in perpetuity to continuously
    update standards and legislation as horizon technologies arise that alter the
    way in which data is collected, preserved, utilized, shared, and synergized. No
    wonder most ISO27k standards, which include many aspects of information technologies,
    are under review on an ongoing basis, and the publication of ISO/IEC 27045 (the
    specific standard for big data security and privacy) may not even be expected
    until the year 2022.


    In today’s cybersecurity landscape, realizing the promise of open access and big
    data may well depend on our ability to continue our quest to maintain our cyber
    readiness in the face of ever evolving threats. With appropriate legal policies,
    guidelines, and a combination of right technology, right people and right processes
    in place, organizations and nations at large will be able to contain damage and
    minimize risk when (yes, it’s a matter of “when,” not “if”) they are breached
    and digitally attacked.'
