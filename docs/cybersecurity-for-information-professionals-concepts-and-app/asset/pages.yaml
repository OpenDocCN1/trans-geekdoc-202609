  md: 'AI systems can perform predictive analytics based on the data generated on
    daily basis and provide alerts of potential future threats.


    # Social and Cultural Issues


    Internet users around the world are increasing in numbers and now they are part
    of the digital culture. Digital culture is a culture shaped by technology and
    has transformed the way we communicate and behave in cyberspace. People with different
    social and cultural backgrounds have different views and attitudes toward privacy
    and security. According to Miao (2018), the concept of privacy has changed. For
    example, in the past if you were in your room alone, you did not expect people
    watching you and you do not have smart machines and devices that might be spying
    on you. If you were shopping, most of your transaction would have been paid in
    cash and the merchant has very little knowledge of you. But cybersecurity is not
    only a technical problem, it is a business and a human issue in which people’s
    perception of security is shaped by social and cognitive issue that involves culture,
    normative beliefs, and state of mind. Understanding the economical, situational,
    and behavioral issues governing people’s perception of risk is critical to combating
    cybersecurity attacks.


    Hackers are always looking for new ways to steal valuable information of users
    mainly for monetary gain (Overfelt, 2016). However, stolen information could create
    social and cultural clash and, in some cases, endangering people’s lives. The
    psychological impact of revealing confidential information related to race, gender,
    sexual orientation, and health issues has not been adequately studied. In a more
    conservative culture, the motivation for hacking could be social, ethical, or
    political, making it more vulnerable for internal security threats. Awareness
    and the level of education play an important role in tackling the cybersecurity
    problem. Aloul (2012) reported that the number of Internet users in the Middle
    East grew by 1825% compared with the growth of 445% in the rest of the world during
    a 10-years period. He pointed out that one of the major problems is dealing with
    the number of the “uneducated” users, making this population an easy target for
    hackers and cyberattacks.


    # Cybersecurity Awareness and Education


    Cybersecurity impact on businesses, government agencies, and society can be assessed
    from long-term effect on the economy and the cost associated with cyberattacks.
    The increased reliance on technology and digitization of assets makes it harder
    to protect intangible assets such as intellectual property from cyberattacks.
    Intellectual property theft in the form of patents, trade secrets, trademarks,
    and copyright materials in digital format such as movies, software,'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'and games cost the economy billions of dollars. One study showed that copyright
    violations and intellectual property theft in movies, songs, software, and video
    games costs 373,375 jobs and $58 billion in total economic activity (Siwek, 2007).
    Cyberattacks happen when vulnerability exists, making it necessary for organizations
    to build robust cybersecurity infrastructure. It is also important to hire qualified
    information and cybersecurity professionals who make sure policies, regulations,
    procedure, and practices are in place to deal with potential risks. While organizations
    normally focus on the technical infrastructure, it is normally the social and
    ethical aspects of security that most of the time are overlooked.


    As stated earlier, organizations are losing billions of dollars yearly due to
    stolen intellectual properties in the form of trademarks, digital goods, branding,
    and reputations, and also due to stolen vital confidential information related
    to products, services, best practices, and procedures. On the other hand, organizations
    do engage in competitive intelligence and collect information about competitors''
    products and services in a legal and ethical manner. Such activities are not considered
    spying as long as it is not a theft of property or trade secret ideas. Cyber theft
    is an illegal hacking activity that normally cause loss of revenue and can create
    an unfair advantage for affected parties over a long period of time.


    To combat cybersecurity threats, organizations need to hire qualified information
    and cybersecurity professionals who are to deal with all aspects of security.
    The shortage in the number of qualified cybersecurity professionals is a challenge
    that has long-term security implications. It is estimated that, in 2019, the number
    of vacant positions in cybersecurity will rise to six million globally (Cabaj
    et al., 2018). The shortage in cybersecurity professionals could be alleviated
    if we can train information professional in the area of cybersecurity. Today,
    most organizations focus their attention and limited resources on protecting the
    technical components of their systems. This approach is insufficient due to the
    fact that cybersecurity threat started using advanced AI tools as well as social
    and psychological methods (Lord, 2019). This means that organizations need to
    investment in technology as well as human capital in the form of training and
    creating awareness about cybersecurity threats.


    The shortage in the number of qualified cybersecurity professionals has prompted
    various government agencies to embark on funding cybersecurity infrastructure,
    including the expansion of the workforce with the help of educational institutions.
    This includes providing funding for student scholarships and capacity building
    through the creation of formal academic programs. To support these efforts, the
    Senate Commerce Committee approved the Cybersecurity Act (S. 773) in 2009 to improve
    and develop the states cybersecurity awareness (Cheung et al., 2011). The act
    calls for the development of a new generation of information technology (IT) and
    cybersecurity specialists in order to develop and maintain a sound and effective
    cybersecurity infrastructure. Internet users who gain access through public network,
    such as unsecure hotspots, are considered to'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'be the most vulnerable population. Besides understanding the risk of using
    public networks, users have to change their behavior while using social media
    and other applications designed to share information (Rahim et al., 2015).


    In addition to creating awareness about the dangers of cybersecurity attacks,
    there is a need for more formal education in which theory can inform practice.
    By realizing the risks posed by the shortage in highly qualified cybersecurity
    professionals, the Department of Homeland Security partnered with National Science
    Foundation (NSF) and the Office of Personnel Management in 2000 to provide educational
    institutions with funding to support two- and four-years degree programs at colleges
    and universities. The Scholarship for Service Program (SFS) was created under
    the Federal Cyber Service Training and Education Initiative to provide funding
    to colleges and universities for scholarships and capacity building in the information
    assurance and computer security fields.


    The SFS program funded multiple educational institutions over the years with the
    objectives of creating growth and preparing a cadre of federal information assurance
    professionals. Figure 1.1 shows the distribution of fund by state awarded to academic
    institutions. The program offers scholarships that fully cover the costs (tuition
    and education fees) for full-time students who join an institution that is part
    of the program. The students in the program also receive stipends of $22,500 for
    undergraduate and $34,000 for graduate (CyberCorps®, 2019).


    Cybersecurity is one of the fast-growing areas in the fields in IT where women
    are underrepresented. This could be attributed to social, institutional, and personal
    challenges that women face when it comes to job advancement in cybersecurity.
    Women seem to experience more social and institutional challenges in the work-place
    than men. According to Bagchi-Sen et al. (2010), female students feel that they
    do not have much guidance and mentoring since the majority of faculty members
    in the computer science and IT departments are males. Being mentored by a faculty
    is very important for the student''s future when it comes to job opportunities;
    the lack of female mentors might possibly delay their professional development
    within the field.


    In the fields of sciences and engineering, women are underrepresented. “NSF data
    shows groups identified as being underrepresented in STEM (racial and ethnic minorities,
    women, and persons with disabilities) still lag behind their majority counterparts
    in STEM degree attainment and representation in the STEM workforce” (James, Singer,
    and Elgin, 2017, p. 2). This is no different when it comes to women in the cybersecurity
    profession. A recent study showed that women make up only 20% of the cybersecurity
    workforce (Morgan, 2019). The rise of cybersecurity awareness is leading more
    women to join the field.'
