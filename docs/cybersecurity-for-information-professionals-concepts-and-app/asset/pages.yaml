- pgno: 7
  md: '# Preface


    Cybersecurity attacks are on the rise and cybersecurity challenges are real. Cybersecurity
    has direct and indirect impacts on individuals, organizations, and government
    institutions. Direct impacts involve individuals and organizations (private and
    public) with direct connection to the Internet using smart devices such as computers,
    laptops, smart phones, or Internet of Thing (IoT) devices. Indirect impacts involve
    people and organizations who might have a direct connection to the Internet, but
    their data might be hosted by institutions that have different direct connections
    to the Internet and could be vulnerable to cyberattacks. Cybersecurity threats
    and challenges are dynamic and complex and tackling them requires both interdisciplinary
    and multi-disciplinary approach. Given the complexity of cybersecurity issues,
    awareness and education remain as one of the most effective ways of combating
    cybersecurity threats. To raise the public awareness of cybersecurity, the U.S.
    Government designated October as the National Cybersecurity Awareness Month (NCSAM)
    since 2004. The campaign is co-led by Department of Homeland Security and National
    Cyber Security Alliance (NCSA) working with the industries, schools, and nonprofit
    organizations to promote data privacy and security (Department of Homeland Security
    2018).


    As the transformation into digital citizens is taking place, it is inevitable
    that we leave digital footprints and traces of our activities as well as unintended
    digital shadows generated by surveillance cameras and online social networks and
    applications. Protecting one’s personal information in cyberspace and the right
    to privacy is now a fundamental human right recognized in the UN Declaration on
    Human Rights. However, the relationship between privacy and security in the Internet
    environment is challenging due to continued evolution of Internet applications
    and the increased sophistication of digital technologies. Historically, information
    professionals including librarians, archivists, and record managers took on the
    role of gatekeepers and locked important information in files, cabinets, and buildings.
    In the ancient world, librarians assumed the role of gatekeepers in the form of
    “the keepers of the tablets” or the “masters of the scrolls.” Security of patron’s
    data become of paramount importance when information professionals started to
    advocate for intellectual freedom and privacy. The new article (Article VII) of
    the Library Bill of Rights emphasizes the importance of protecting and safeguarding
    users’ information'
  merge: -1
  img_proc: true
- pgno: 8
  md: 'by stating that “All people, regardless of origin, age, background, or views,
    possess a right to privacy and confidentiality in their library use. Libraries
    should advocate for, educate about, and protect people’s privacy, safeguarding
    all library use data, including personally identifiable information” (American
    Library Association 2019). This is a clear undertaking and commitment made by
    information professionals to protect data and information as one of the core values
    of the information profession. This will also demand cybersecurity education or
    information sharing to equip information professionals with cybersecurity knowledge
    as they come across cybersecurity risks or incidents.


    Information professionals have been paying more attention to confidentiality and
    putting a greater emphasis on privacy over cybersecurity. The cybersecurity breach
    incidents are soaring, and as a result, cybersecurity risks are high. Utilizing
    cybersecurity awareness training in the workplace has been one of the most effective
    methods in promoting cybersecurity culture. It also enhances individuals’ understanding
    of the risks and makes them more cybersecurity conscious. However, it is still
    unknown whether employees’ security behavior at work can be extended to their
    security behavior at home and personal life. While library and information professionals
    assume the role of gatekeepers to safeguard the organization data and information
    assets, they can also aid in enabling effective information access and dissemination
    of cybersecurity knowledge to make users more conscious about the cybersecurity
    and privacy risks that are often hidden in the cyber universe.


    This book introduces the fundamental concepts in cybersecurity and addresses some
    of the challenges faced by information professionals, librarians, archivists,
    record managers, students, and the broader audience from relevant and related
    disciplines. We recommend this book for educators preparing courses in information
    security, cybersecurity, and the integration of privacy and cybersecurity. The
    chapters contained in this book represent diverse perspectives of the role information
    professionals play in the field of cybersecurity. The following are the synopses
    of each chapter.


    # Human Aspects of Cybersecurity: Bridging the Weakest Link


    Alkhaledi and Hawamdeh’s chapter “Cybersecurity Challenges and Implications for
    the Information Profession” provides historical perspective of the information
    profession, privacy, and security. The chapter discusses cyberattacks, cybersecurity
    threats, cybersecurity challenges, cybersecurity awareness, and cybersecurity
    education. It highlights the role information professionals including librarians,
    archivists, and record managers play in advocating to protecting privacy and securing
    patrons information. The chapter emphasizes the point that in order to'
  merge: -1
  img_proc: true
- pgno: 9
  md: 'protect against security threats, there is a need for a holistic approach to
    security that would include creating awareness among users, building a sound and
    robust infrastructure, and train a new generation of information and cybersecurity
    professionals who can deal with both the technical and social aspects of cybersecurity.


    Ho’s chapter “Trustworthiness: Top Qualification for Cyber Information Professionals”
    provides an illuminating account that addresses how to prepare qualified cyber
    information professionals to handle information security with best practices,
    high ethical standards, and trustworthiness. Ho begins the chapter by discussing
    the future of cyberattacks along with the knowledge, skills, and abilities (KSAs)
    that information professionals will need in order to protect and defend the confidentiality,
    integrity, and availability of information artifacts, systems, and networks. To
    bolster our conventional perception that humans are the weakest link, Ho suggests
    that trustworthiness is an essential qualification for cyber information professionals,
    enabling cyber defenders to defend information assets against both the technological-centric
    attacks and human-centric threats. With trustworthy handlers, information can
    be collected, accessed, and processed with ethical considerations, and our human
    right to information privacy can be protected. Matrices for evaluating trustworthiness
    are discussed and illustrated to inform the future development of a computational
    inference engine, that is, a social software to enhance the weakest links in the
    chain of commands.


    Al-Suqri, AlKindi, and Saleem’s chapter “User Privacy and Security Online: The
    Role of Information Professionals” discusses the increasing threats to patron
    privacy in the online information environment and identifies what information
    professionals and librarians can do to maximize the privacy and security of users
    in the emergent digital literacy environment. Three important roles are notably
    identified: promoting digital literacy to minimize the risks when users seek information
    online, working with IT specialists to develop and implement secure online information
    systems, and acting as political advocates for the privacy and confidentiality
    of library users when confronting regulations. This chapter provides key recommendations
    for ways in which librarians and information professionals can help maximize the
    privacy and security of users online, while reconciling the conflict with freedom
    of access to information.


    Chang, Jim, and Hawamdeh’s chapter “Bridging the Cybersecurity Talent Gap: Cybersecurity
    Education in iSchools” reviews the current efforts of cybersecurity education
    and workforce development across various institutions in the United States. To
    support the development of information professionals, cybersecurity training and
    education programs among the North America iSchools serve as an example to address
    the socio-technical aspect of cybersecurity. Chang, Jim, and Hawamdeh analyze
    the alignment of iSchools cybersecurity curriculum with National Initiative for
    Cybersecurity Education (NICE) Cybersecurity Workforce Framework. The different
    extended Open Systems Interconnect (OSI) models are discussed to inform the ongoing
    training and education to address both technical'
  merge: -1
  img_proc: true
- pgno: 10
  md: 'and social/human aspects of cybersecurity challenges. The NIST’s Cybersecurity
    Learning Continuum is presented as a roadmap to guide future development of educational
    opportunities for iSchools and other stakeholders.


    Markman’s chapter “MetaMinecraft: Cybersecurity Education through Commercial Video
    Games” dives into the ecstasy and agony of utilizing a popular “sandbox survival”
    video game to introduce threat modeling as a cybersecurity concept for teens and
    tweens in libraries. Markman presents background research, historical notes, and
    lessons learned during a yearlong research project to test the effectiveness of
    Minecraft as a tool for community engagement in public libraries. Through an analysis
    of Minecraft’s online communities and software ecosystem, an overarching view
    of the commercial video game is presented and paired with common newbie cybersecurity
    misconceptions including overgeneralization, conflated concepts, biases, and incorrect
    assumptions. Other examples of emergent gaming ranging from more traditional role-playing
    games to Virtual Reality (VR) puzzle quests are also presented for the future
    consideration as potential outreach tools.


    # # Data/Information Aspects of Cybersecurity: Protecting the Assets that Matter


    Lomas’ chapter “Information Governance and Cybersecurity: Framework for Securing
    and Managing Information Effectively and Ethically” addresses the complexity of
    global information dynamics. It introduces the field of information governance
    (IG) as the solution for individuals, organizations, and nations to manage information.
    In tandem with the growing potential, value and social significance of information,
    the online management of a wide range of data has opened up information/data to
    new forms of theft and attack including information subversion, cybercrime, and
    cyber warfare. Lomas views cybersecurity as a subcomponent of IG because IG provides
    the holistic solution to dealing with information challenges in terms of both
    opportunities and dangers that are implicit within information creation. This
    chapter sets out IG considerations, tools, and frameworks for securing and managing
    information effectively and ethically.


    Almenh and Helge’s chapter “Providing Open Access to Heterogeneous Information
    Resources without Compromising Privacy and Data Confidentiality” reviews the current
    status of data security and argues in favor of balancing the open access aspirations
    of cultural heritage institutions with the need for privacy and data confidentiality.
    The escalating cyberattacks can come from insider threats for data breaches or
    other malevolent tactics by cyber criminals, such as ransomware, viruses, spyware,
    phishing, and other malicious endeavors. Other types of cyberattacks can result
    from well-meant initiatives like open access or globally shared data, information,
    and knowledge. Almenh and Helge’s proposed model statute could offer'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'insight into how the United States federal government, and the 51 states and
    district legislative bodies could provide legal guidance to address modern data
    and information misuse.


    Zamir''s chapter “Cybersecurity and Social Media” addresses that information professionals
    frequently use social media for user engagements, communications, and building
    networks; however, cybersecurity risks on social media platforms are often overlooked.
    Recent social media data breaches make the scenarios more intense. Hackers can
    easily collect and manipulate user data from social media. Personal identifiable
    information and confidential digital resources can be harnessed effortlessly through
    techniques such as phishing, social engineering, and impersonation. Attackers
    can also distribute malicious contents and short URLs in public conversations
    over social media platforms. Their attacking styles are getting more sophisticated
    and advanced. Zamir’s chapter discusses common cybersecurity threats over social
    media platforms and its mitigation techniques. In this regard, it highlights implications
    for information professionals by recommending strategies to protect confidential
    user data and use social media safely.


    Parker’s chapter “Healthcare Regulations, Threats, and their Impact on Cybersecurity”
    aims to educate information professionals on how to build their own comprehensive
    security program and address risks in their own organization. Healthcare industry
    has been especially targeted by data breaches and ransomware attacks. Parker discusses
    the security and privacy components of the Health Information Portability and
    Accountability Act (HIPAA), Health Information Technology for Economic and Clinical
    Health Act (HITECH), the EU General Data Protection Regulation (GDPR), Payment
    Card Industry – Data Security Standards (PCI-DSS), and 21st Century CURES Act
    and Trusted Exchange Framework. As a practitioner involved in managing the healthcare
    records, Parker further examines the key processes and programs an organization
    needs to proactively defend themselves, presents emergent and current threats
    to the healthcare environment, and discusses how organizations can address these
    threats.


    # Technical Aspects of Cybersecurity:

    Understanding Socio-Technical Cybersecurity Trends


    Chang’s chapter “Mobile Cybersecurity: A Socio-Technical Perspective” outlines
    different layers of the multi-stakeholder mobile ecosystem and the potential cyber
    threats within the ecosystem. From the technical perspective, the security and
    privacy risks of mobile apps are discussed using the top-ranked mobile vulnerability
    categories identified by the Open Web Application Security Project (OWASP)’s mobile
    security project. In terms of the social and human perspective, this chapter also
    delineates user interactions with mobile apps as well as'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'mobile users’ security awareness and behavior. Chang introduces smartphone
    security best practices to put forward the idea that protecting mobile cyberscurity
    at every layer is critical. This chapter concludes with the proverb “prevention
    is better than cure” and reiterates the importance of layered security to defend
    mobile cyberscurity.


    Hashem’s chapter “Psychophysiological and Behavioral Measures Used to Detect Malicious
    Activities” proposes a multi-modal framework based on the user’s psychophysiological
    measures and computer-based behaviors to distinguish between a user’s behavior
    during regular activities versus malicious activities. He utilized several psychophysiological
    measures such as electroencephalogram (EEG), electrocardiogram (ECG), and eye
    movement and pupil behaviors along with the computer-based behaviors such as the
    mouse movement, mouse clicks, and key-stroke dynamics to build a framework for
    detecting malicious insiders. He conducted human subject experiments to capture
    the psychophysiological measures and the computer-based behaviors for a group
    of participants while performing several computer-based activities in different
    scenarios. He analyzed the behavioral measures, extracted useful features, and
    evaluated their capability in detecting insider threats. He investigated each
    measure separately, and then used data fusion techniques to build two modules
    and a multi-modal framework.


    Kinyua’s chapter “Cybersecurity in the Software Development Life Cycle” emphasizes
    that secure software development in an organization is a proactive process of
    designing, building, and testing software that incorporates security into each
    phase. Kinyua reviews several commonly used software development processes and
    explores how security is integrated into every step of the software development
    process from requirements to testing. The SQUARE process is considered as a methodology
    for eliciting and prioritizing secure requirements. Kinyua then discusses different
    approaches to security analysis and design, secure coding practices, security
    in testing, code reviews, vulnerability testing and penetration testing, and fuzzy
    testing. In essence, security needs to be built into the software development
    process from the start in order to reduce security risks introduced at each stage
    of the secure software development life cycle.


    Ding and Awojobi''s chapter “Data Security and Privacy” discusses emerging technologies
    like Internet of Things (IoT), smartphones, mobile applications, and social media.
    The authors believe that data security and privacy are best addressed using a
    combination of technological controls, regulatory, and legal policies. They explained
    the benefits of enforcing controls like password complexity and data retention
    policies. They explained some of the strategies that social media platforms use
    to collect data and safeguard private information.


    Last but not least, this book addresses the ongoing challenges of cybersecurity.
    Since very few iSchools have offered cybersecurity programs, it is time for information
    professionals to step up and contribute to long-term workforce development. We
    hope this book will encourage more information professionals'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'to design and lead cybersecurity awareness campaigns and cybersecurity hygiene
    programs to change people’s security behavior. It is our hope that this book will
    aid in promoting the engagement of information professionals becoming the advocates
    for the cybersecurity field.


