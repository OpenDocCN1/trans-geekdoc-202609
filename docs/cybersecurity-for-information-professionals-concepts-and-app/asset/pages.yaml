    # 12.3.5 Security in Testing


    Software testing is an important phase in SDLC before any software is deployed
    in the production environment. Various kinds of testing are performed, such as
    unit testing, system testing, integration testing, and user acceptance testing.
    The purpose of testing is to uncover software bugs and then remove them, hopefully
    creating a better software product. Similarly, software security testing is an
    indispensable phase of a secure SDLC, and it performs sanity checking before the
    software is deployed in the production environment. The idea behind it is to discover
    security flaws in code and then fix them. We now discuss some approaches for conducting
    software security testing.


    # 12.3.5.1 Code Reviews


    During code reviews, an objective group of experts reviews both your code and
    its documentation for misunderstandings, inconsistencies, and other faults. A
    team is composed of the developer (you) and three or four other technical experts
    is created. The team studies the program in a consistent way and looks for faults.
    A recorder or scribe records any faults found, and these are thereafter rectified
    by the developer after the review. All the findings and errors resulting from
    code review must be documented and maintained. Code reviews can be manual or automated.


    From a security perspective, code review is a process of software security testing
    in which the developer of the program, other technical experts, and a team of
    quality assurance testers review the code together. The developer will be required
    to fix any security flaws after the end of the review. Peer reviews can also be
    conducted in which software developers check each other’s code to find security
    bugs and other kinds of bugs before handing the code to the QA team. In addition
    to peer code review, it is a best practice to engage a third-party with special
    expertise in security to perform source code review before your application is
    deployed.


    During a security code review, we look for known common vulnerabilities and system
    calls that could be used for malicious purposes. Code reviews have been shown
    to be very successful in detecting faults and are often included in an'
  merge: -1
  img_proc: true
- pgno: 305
  md: 'organization''s list of mandatory or best practices. Remember that the earlier
    in the development process a fault is spotted, the easier and less expensive it
    is to correct.


    # 12.3.5.2 Vulnerability Testing and Penetration Testing


    Application vulnerability scanning tools can be used to discover vulnerabilities
    in software so that these vulnerabilities can be fixed before they can be discovered
    by nefarious actors. There are various tools available to identify vulnerabilities
    in code, such as Nessus, OpenVAS, Tripwire IP360, Wireshark, AirCrack, Retina,
    Nikto, Nexpose, and Microsoft Baseline Security Analyzer (MBSA) (eWatch 2018,
    STC Admin 2018). Some of them scan for vulnerabilities and carry out a wide range
    of network checks. The vulnerabilities that can be found by these application
    vulnerability scanning tools include cross-site scripting (XSS), injection flaws,
    malicious file execution, and cross sire request forgery (CSRF).


    Penetration testing, also called pen testing, is a procedure that is used to discover
    defects at the operating system or server level. Tools specifically designed for
    pen testing are used to scan one or more target systems in order to discover open
    ports that may indicate the presence of vulnerabilities. The scanning consists
    of transmitting TCP/IP packets to the target system in attempts to communicate
    with various common services, in order to discover which services are operating
    on the target system. Most of the tools mentioned above can also be used for pen
    testing.


    Vulnerability scanners automate security auditing and play a vital role in security
    applications and the network by scanning your network and websites for different
    security risks. These scanners are also capable of generating a prioritized list
    of those applications that should be patched, describing the vulnerabilities,
    and providing steps on how to remediate them. These tools make pen testing a lot
    easier by automating the scanning and analysis of scan results, and is it even
    possible for some of them to even automate the patching process. Pen testers should
    have no knowledge of the source code or architecture of the application. It is
    recommended that a third-party pen tester conduct the penetration testing, and
    the results of this assessment process are documented and presented to the organization.


    # 12.3.5.3 Fuzz Testing


    Fuzz testing means testing software against malformed data by feeding it with
    unexpected, invalid, or random test inputs to see how it reacts. The system is
    then monitored for crashes and other undesirable behavior. Fuzz testing can be
    effective for finding security vulnerabilities. Every time software is changed
    or updated, fuzz testing should be conducted. Fuzzing techniques use black-box
    testing, and they allow the detection of most of the common vulnerabilities, for
    example, buffer overflow, cross-site scripting, and SQL injections.'
