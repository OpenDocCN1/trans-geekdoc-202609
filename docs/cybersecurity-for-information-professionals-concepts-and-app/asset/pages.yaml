    # Practical Adoption and Implications of the Application


    Research on analyzing communicative intent and language–action cues has shown
    great promise in the area of attributing and determining trustworthiness – both
    subjectively (Ho 2009a, 2009b, 2014, Ho and Lee 2012) and objectively (Ho 2019,
    Ho, Fu, et al. 2015, Ho and Hancock 2019, Ho, Hancock, and Booth 2017, Ho, Hancock,
    Booth, Burmester, et al. 2016, Ho, Hancock, Booth, and Liu 2016, Ho, Hancock,
    et al. 2015, Ho, Hancock, Booth, Liu, et al. 2016, Ho, Liu, Booth, and Hariharan
    2016). This chapter identifies the research potential of identifying actors’ communicative
    intent and cues in absolute terms. In the cyber world of the future, information
    professionals are required to pay attention on the application adoption of evaluating
    trustworthiness, and understand the implications of an individual’s trustworthiness
    as an absolute qualification for the organization. This will help determine organizational
    performance and productivity requirements if more business activities move to
    the cloud environment.


    The extension of the trustworthiness determination can contribute to social computational
    systems that can provide organizational security without intruding on personal
    privacy. A computational classifier (i.e., a social firewall) could be developed
    to provide objective analysis of “random samples” of the online communication
    without collecting and monitoring individual’s private information.


    Trustworthiness can also have significant impact on organizational hiring or personnel
    retention practices. When interviewing candidates or evaluating'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'employees, more attention should be focused on the candidates’ trustworthiness
    in terms of integrity and ethical values in addition to competence (external performance
    indicators) or benevolence (interpersonal) factors. It is important to understand
    differences in leadership and management style when evaluating key personnel (Ho
    2019). Unintentional streams of administrative errors may indicate that an individual
    may not be suitable or reliable with regard to a certain type of assignment. While
    organizations must recognize the importance of establishing an ethical culture
    of trust, a greater challenge for management is evaluating trustworthiness of
    cyber information professionals with regard to integrity, competence, and benevolence.


    # Conclusions


    Although the cyber information professional’s KSAs and competence on the job are
    important, *integrity* would be more a critical disposition-based indicator of
    trustworthiness. An individual may be regarded as incompetent but still be found
    to be trustworthy. By contrast, a person may be very competent, but not trustworthy.
    It is quite common that betrayers of organizations appear benevolent and are seen
    as very nice people. Organizations that wish to put together a cyber defense team
    should pay more attention to candidates who are trustworthy and can handle information
    with high integrity, rather than those who are technically savvy but cannot be
    trusted. Safeguard information assets require collective efforts. Trustworthiness,
    as a top qualification for cyber information professionals, can be evaluated and
    measured during interpersonal communication as well as group interaction. Addressing
    the trustworthiness of human assets will not only solve cybersecurity technical
    challenges, but also bridges the weakest link of commands. We are in an age where
    ethical values and moral standards are not clearly defined by society. As such,
    individuals could be ignorant of ethics, which may negatively impact their decisions
    in personal life or at work. Poor adoption of standards around ethics may affect
    and even damage the fabric of trust in society. Today’s cyber information professionals
    should strive to think with social responsibility and act in a trustworthy manner
    to enable the operations of the organizations, and to sustain the value and structure
    of our society.


