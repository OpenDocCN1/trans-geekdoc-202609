- pgno: 104
  md: 'the various publications and reports we discussed in this chapter. The global
    cybersecurity workforce shortage has a major impact on national cybersecurity
    as well. To respond to the Executive Order 13800 of May 11, 2017, Strengthening
    the Cybersecurity of Federal Networks and Critical Infrastructure by the president,
    there were several working groups and deliverables in response to the intensifying
    cybersecurity threats to our nation (Department of Homeland Security CISA 2017).
    Specifically, to address the matter of American cybersecurity workforce, the Secretary
    of Commerce and the Secretary of Homeland Security (2017) compiled a report: Supporting
    the Growth and Sustainment of the Nation’s Cybersecurity Workforce: Building the
    Foundation for a more Secure American Future. They recommended the private and
    public sectors working together to improve cybersecurity workforce development
    and suggested three aspects where the public and private sectors can collaborate
    including transforming the learning environment to grow a dynamic and diverse
    cybersecurity workforce, aligning education and training with cybersecurity workforce
    demands by applying the National Initiative for Cybersecurity Education (NICE)
    Cybersecurity Workforce Framework, and establishing robust metrics that evaluate
    the effectiveness and impact of cybersecurity workforce investments (Department
    of Homeland Security 2017). A recent Executive Order on America’s Cybersecurity
    Workforce by the president reiterates that more than 300,000 cybersecurity job
    vacancies remain unfilled in the United States and promotes the wider adoption
    of NICE’s cybersecurity workforce framework (The White House 2019).


    When cybersecurity is considered a national issue, our country should rally all
    the support to build and strengthen the current workforce. Higher education is
    in a unique position to support this goal due to their traditional role of teaching
    and research with industrial partnership to produce highly skilled workforce beyond
    basic education. Higher education can address the cybersecurity skill gaps by
    recognizing areas to improve and keep up with technology advances in this profession.
    Cybersecurity education is relevant to every other profession who comes “online,”
    utilize technology, and being a part of a network environment. This chapter provides
    a glimpse of the current status of cybersecurity education at the different levels,
    in particular, higher education institutes such as the iSchools. Through mapping
    of the NICE Cybersecurity Workforce Framework with an exemplar curriculum from
    one of the iSchools and outlining the different extended OSI models and the NIST’s
    Cybersecurity Learning Continuum to inform the ongoing training or education to
    address both technical and social/human aspects of cybersecurity challenges, we
    believe information profession can play a critical role to meet the need of a
    diverse cybersecurity workforce.


