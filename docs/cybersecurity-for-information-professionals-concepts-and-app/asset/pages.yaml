- pgno: 15
  md: '# # Contributors


    **Dr. Daniel Gelaw Alemneh** is a faculty member at the University of North Texas
    (UNT), coordinator of Digital Curation activities, and also teaching at the UNT
    College of Information. He recently (in 2020) served as a Fulbright scholar at
    Addis Ababa University in Ethiopia. His research interest includes open access,
    scholarly communication, digital curation, and ensuring long-term access to cultural
    heritage resources. He publishes extensively and is actively involved in various
    professional societies and has served in various capacities, including as a member
    of the Board-of-Directors of the Association for Information Science and Technology
    (ASIS&T) and its Executive Committee. Daniel is currently a Fulbright Scholar
    at Addis Ababa University, Ethiopia and can be reached at daniel.alemneh@unt.edu.


    **Reem Alkhaledi** is a PhD student in the College of Information at the University
    of North Texas. Reem’s area of interest is in electronic health records and cyber
    security. She graduated with a bachelor’s in Advertising and Sociology from the
    University of Miami in 2006 and obtained a master’s degree in Information Science
    from Kuwait University in 2012, where she discovered her interest in electronic
    health records and cybersecurity. Reem looks forward in pursuing a career in academia.


    **Dr. Salim Said AlKindi** is an assistant professor at Department of Information
    Studies, College of Arts and Social Sciences, Sultan Qaboos University. He obtained
    his PhD in Internet Studies from School of Media, Culture and Creative Arts, Curtin
    University, Perth, Australia; a master’s degree in Information Management and
    System, Monash University, Faculty of Information Technology, Melbourne, Australia;
    and a bachelor’s degree in Library and Information Science from Sultan Qaboos
    University, Department of Library and Information Science, Sultanate of Oman.
    Dr Salim AlKindi research interests are in the area of Information and Knowledge
    Management, Research Methods, Web-based teaching and learning, Internet/web technologies
    (e.g., social media, social web), Information Organization and Retrieval, Information
    Literacy, Web Search Strategies and Information Ethics.'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'His recent research is conducted in the areas of Online Tools and social media
    for professional uses, research, and teaching.


    **Dr. Mohammed Nasser Al-Suquri** is an associate professor and the Dean of Postgraduate
    Studies, Sultan Qaboos University. He received his PhD in Library and Information
    Management from Emporia State University, School of Library and Information Management,
    Emporia; a master’s degree in Library and Information Science from Pratt Institute,
    School of Information and Library Science, New York; and a bachelor’s degree in
    Library and Information Science from Sultan Qaboos University, Department of Library
    and Information Science, Sultanate of Oman. Mohammed Nasser Al-Suquri conducts
    research in the areas of user studies, knowledge management and sharing, technology
    adoption theories and models, research methodology, information industries, and
    impact of new technology on academic libraries.


    **Biodun Awojobi** has been in the Information Technology industry for over 15
    years. He received his MBA and Master of Science in Cybersecurity from the University
    of Dallas. He also has a Bachelor of Science degree in Electronic and Computer
    Engineering from Lagos State University in Lagos, Nigeria. He has worked in multiple
    IT software, networking, and security roles across several industries over the
    years. He worked at Microsoft for six years, before transitioning to Google to
    focus on Infrastructure, Application Modernization, and Security for the Google
    Cloud Platform. At Microsoft, he worked in multiple roles over the six years at
    the company. His last position being a Senior Technical Specialist for Security
    and Compliance, aligned with the Financial Services industry. He is a Microsoft
    Certified Trainer with multiple Microsoft certifications, including – Messaging,
    Productivity, and Security. Biodun is working on his PhD in Information Science
    at the University of North Texas with focus on Cybersecurity. His research interests
    are in Privacy and Security with the Internet of Things (IoT).


    **Dr. Hsia-Ching Chang** is an assistant professor in the Department of Information
    Science, College of Information, at University of North Texas. She is affiliated
    with the Center for Information and Cyber Security (CICS), an interdisciplinary
    research center at the University of North Texas. Dr Chang is also a Cybersecurity
    Policy Fellow at New America, a non-partisan think tank based in Washington, D.C.
    providing advice to policy makers on emerging topics. Her research interests concentrate
    on cybersecurity (from a socio-technical perspective), data analytics, social
    media, knowledge mapping, scientometrics, and information behavior. She holds
    the Cloud Security Alliance’s CCSK (Certificate of Cloud Security Knowledge),
    the first IT certification for secure cloud computing. She has developed and taught
    the graduate-level course, Information and Cyber Security, since 2015.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '**Dr. Junhua Ding** is a professor of data science at the University of North
    Texas. He had been a faculty member of computer science with East Carolina University
    for 11 years and he also has near 8 years of industry experience with lead biomedical
    companies. His research interests include machine learning, data analytics, software
    security, biomedical computation, and software engineering. He received his PhD,
    MS, and BS in computer science from Florida International University, Nanjing
    University, and China University of Geosciences, respectively.


    **Dr. Yassir Hashem** is an information technology and cybersecurity specialist
    with over 18 years of experience in both the educational and industrial sectors.
    He earned his Ph.D. in Computer Science and Engineering from the University of
    North Texas (2018). He also received his M.S. degree in computer science from
    the same university in 2016. He served as a research and teaching assistant at
    the University of North Texas with research focused on various aspects of cybersecurity
    and privacy including but not limited to: insider threats, risk assessment and
    management, cloud computing security, privacy and security of online social networks,
    context-aware computing and usable security. He also had over ten years of industrial
    experience in project management and information technology and has been working
    for several organizations inside and outside the United States.


    **Dr. Suliman Hawamdeh** is a professor in the Department of Information Science,
    College of Information, University of North Texas. He is a leading authority in
    the field of knowledge management. Dr Hawamdeh founded and directed several academic
    programs including the first Master of Science in Knowledge Management in Asia
    in the School of Communication and Information at Nanyang Technological University
    in Singapore. He served as the Information Science Department chair from 2010
    to 2018 at University of North Texas and founded the Bachelor and Master of Science
    in Data Science. Dr Hawamdeh is the editor in chief of the *Journal of Information
    and Knowledge Management (JIKM)* and the editor of a book series on *Innovation
    of Knowledge Management* Published by World Scientific. He has authored and edited
    several books in the areas of knowledge management, information science, and data
    analytics. He has extensive industrial experience and worked as the managing director
    of ITC Information Technology Consultant from 1992 to 1998. Dr Hawamdeh served
    in the capacity of chair and founding chair of several conferences including the
    International Conference on Knowledge Management and the Knowledge and Project
    Management Symposium. He was the founding president of the Information and Knowledge
    Management Society in Singapore and the founding president of the Knowledge and
    Information Professional Association (KIPA) in the United States. He served as
    a CO-PI from 2012 to 2019 on a $1.2 million NSF grant aimed at educating PhD students
    in the areas of cybersecurity and information assurance.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '**Dr. Kris Helge** serves as Assistant Dean of Academic Engagement at Texas
    Woman’s University. He also serves as part-time faculty at Texas Woman’s University
    and Rutgers University. He holds a PhD in Information Science from the University
    of North Texas, JD from South Texas College of Law Houston, MLS from the University
    of North Texas, and a BA from Baylor University.


    **Dr. Shuyuan Mary Ho** is an associate professor in the School of Information
    at Florida State University. Her research focuses on understanding the sociotechnical
    mechanisms of trusted human-computer interaction, specifically the subtle differences
    of language-action cues in computer-mediated deception and mis-/disinformation.
    Her work expands the social-computational investigation of cloud forensics, charged
    language of online influencers, and the effects of news media on the polarization
    of political opinion. Her work —mostly funded by U.S. National Science Foundation
