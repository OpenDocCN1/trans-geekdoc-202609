  md: '# Chapter 2


    # Trustworthiness: Top Qualification for Cyber Information Professionals


    Shuyuan Mary Ho


    Florida State University


    # Introduction


    Our human worth and values are defined by symbols and virtual identities – for
    example, email address, social media accounts, bank accounts, bitcoins, and so
    on. In the contemporary interconnected society; these symbols are represented
    by the “numbers” ($) in bank accounts, by “likes” in social media accounts, grades
    in the university systems, or scores maintained by the credit unions and background
    check agencies. These symbols and identities are translated and represented by
    data and information – whether individually or collectively – and the bits and
    bytes of data that reside on information systems in cyberspace. Due to connectivity
    and the user-friendly nature of the networking environment, data and information
    are left vulnerable and transparent in cyberspace, which leaves our human rights
    to privacy, worth, and values subject to manipulation and attack.


    Cyberspace is that ubiquitous environment where communication occurs and is enabled
    through interconnected technologies. The term cyber information professionals
    refers to the information handlers in cyberspace that require adequate technical
    and management knowledge, skills, and abilities (KSAs) in order to identify and
    understand the dynamic requests and needs of modern'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'information seekers – so as to collect, organize, classify, preserve, archive,
    retrieve, and disseminate information through up-to-date computer-mediated technology.
    Unfortunately, threats also manifest in cyberspace. The systems on which information
    artifacts reside are typically vulnerable and subject to attack. These attacks
    can occur in the areas of networks, systems, applications, software, and hardware.
    They emanate from social actors that span from the ill intentioned to naïve users
    making unintentional errors. These problems create an urgent need for information
    professionals to acquire up-to-date qualifications and KSAs so as to respond to
    the risks and threats – external, internal, and coordinated – of information loss,
    theft, compromise, disruption, and sabotage.


    The chapter is outlined to begin with the discussion on a range of the cyberattacks
    of the future. Based on the varieties of attacks, essential KSAs are raised to
    provide guidance for cyber information professionals to prepare in order to respond
    and address the future of cyberattacks. Most importantly, trustworthiness as top
    qualification should guide information professionals in handling information,
    data, configuration of systems, and policy reinforcement in cyberspace. The chapter
    will discuss the approaches to determine trustworthiness, along with a matrix
    used to evaluate trustworthiness. The inference matrices specifically explain
    the mechanisms of reviewing observed behaviors for a specific cause based on information
    types in communication. Evaluation of trustworthiness can be programmable, and
    thus this discussion opens a new research venue that aims at evaluating social
    actors’ trustworthiness based on their communicative intents and language–action
    cues in the human–computer interaction of sociotechnical systems. The practical
    adoption of trustworthiness algorithms is discussed to enlighten the workforce
    on an approach to bridge the weakest (human) link when safeguarding our most valuable
    information assets. The implications of cyber information professionals’ trustworthiness
    are discussed at the end to conclude the chapter with optimal anticipation of
    the future.


    # ## The Future of Cyberattacks


    Cybercriminals use tools and techniques to disrupt services, steal credentials,
    and gain access to information systems. The cyberattacks of the future will include
    the following six categories of threats: network-based attacks, Internet-based
    attacks on websites, advanced malware, social engineering, insider threats, and
    coordinated attacks.


    # ## Network-Based Attacks


    Most of the cyberattacks are carried out due to network connectivity. Inevitably,
    a variety of network-based approaches can be used to exploit and penetrate'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'systems and networks. In the following, we discuss eleven (11) types of cyber-attacks
    that utilize networking knowledge and techniques.


    +   1. Eavesdropping: Attackers can intercept network traffic to obtain sensitive
    or confidential information such as passwords, credit cards numbers, and so on.
    The attackers can passively listen on the network for any message transmission
    on the network. The attackers could be disguised as a normal unit on the network,
    and actively grab the information by probing or scanning the networks.


    +   2. Man-in-the-middle Session Hijacking: Attackers can hijack a session between
    a client and a server, substituting their source and destination IP addresses
    to the attackers’ machines, and thus hijacking communication between the client
    and the server.


    +   3. IP spoofing: Attackers can send packets with the source IP address of a
    known, trusted host, convincing a victim system to communicate with the attack
    machines pretending to be the trusted machines.


    +   4. Replay: An attacker can intercept a packet, change its session timestamps
    or nonce (i.e., a random number), and send the packet at a later time to the victim
    machine. The victim machines can be confused by the replay technique, not knowing
    that the packets were delayed, intercepted, and read by the attackers.


    +   5. Denial-of-service (DoS): A DoS or distributed denial-of-service (DDoS)
    attack rides on the convenience of TCP handshake protocols to launch many forms
    of TCP SYN flood attacks that aim to disrupt system resources and services. The
    attackers can take over a device and use it to flood the target systems with connection
    requests, while not responding with reply packets to those requests. Such request
    packets would occupy the target systems’ bandwidth, and cause the target systems
    to time-out while waiting for the response packets.


    +   6. Teardrop attack: Attackers can also confuse the target systems by changing
    the length and fragmentation offset field in sequential IP packets so that these
    packets overlap one another on the target systems. As the target systems attempt
    to reconstruct the packets, these target systems could thus be confused and crash.


    +   7. Smurf attack: Attackers can spoof a target machine’s IP address, and send
    spoofed ICMP echo requests. These spoofed ICMP requests would go to all IP addresses
    in the network broadcast range, and thus cause huge amounts of network congestion.


    +   8. Ping-of-death attack: Attackers can send fragmented, oversized IP packets
    (i.e., over the maximum of 65,535 bytes) to a victim machine, causing the victim
    systems to reassemble the packets and experience a buffer overflow crash.'
