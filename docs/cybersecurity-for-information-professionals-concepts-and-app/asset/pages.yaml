  md: 'Step 2: Identify assets and security goals: Identifying asset protection and
    security goals should be aligned with the organization’s security policy and environment
    (Mead 2013). The identification of assets may be different for groups as they
    have separate goals to achieve. Once all assets have been identified along with
    the security goals by the various stakeholders, prioritization needs to take place
    to ensure the most critical assets are protected. Executive decisions can be used
    to resolve conflicts concerning a goal’s priority.


    Step 3: Develop artifacts to support security requirements: This step will help
    identify the area of operations and issues of misuse and scenarios in which various
    controls or configurations compromise may arise particular to the area of operation.
    The goal of this step is to identify artifacts that will support the security
    requirements (Mead 2013).


    Step 4: Perform risk assessment: An expert risk assessment is performed based
    on the artifacts discovered in the previous step. The NIST SP 800-30 publication
    guide for conducting a risk assessment can be used for this step.


    The team then performs a risk assessment by listing vulnerabilities and threats
    that may affect the system, quantifying their likelihood and determining potential
    consequences to ensure security requirements developed later are valid and can
    be mapped to a vulnerability or threat. A semi-quantitative assessment will be
    performed to provide the qualities of a cost/benefit and qualitative approach.
    An expert in risk assessment methods should be brought on board during this step
    to avoid a scenario in which a solution is developed without a real understanding
    of what problem is being solved by that solution (Mead 2013).


    Step 5: Select elicitation techniques: There are different elicitation techniques
    that can be used for gathering requirements such as interviews, questionnaires,
    surveys, and focus groups. Cultural backgrounds and past experiences with certain
    topics can become important in having various stakeholders. Formal elicitation
    techniques such as structured interviews can help overcome potential communication
    issues. This may also be solved by simply sitting down with the various working
    groups to understand the group’s specific security requirements need.


    Step 6: Elicit security requirements: This is the actual elicitation process that
    utilizes the technique selected in the previous step. It is important to ensure
    that the output of this step is a list of requirements and not implementation
    recommendations.


    Step 7: Categorize requirements: A security requirements engineer will need to
    distinguish essential requirements, desired goals, and architectural constraints
    that may be present. Some requirements may actually be constraints, and this allows
    assessment of the risks associated with these constraints. This categorization
    also helps in the prioritization activity that follows in step 8.


    Step 8: Prioritize requirements: This step’s dependency relies on what the semi-quantitative
    risk assessment highlights. Special consideration should be given to'
