    # # Potential Models for Cybersecurity Training


    As smart innovations and the IoT are drastically growing and evolving, new technologies
    will inevitably outpace the current laws and regulations in protecting users from
    cybersecurity threats. The IoT Attack Surface Areas Project by the Open Web Application
    Security Project (OWASP) identified 18 surface areas that are vulnerable for IoT
    attacks. One of the IoT surface areas, privacy, primarily concerned with user
    data disclosure, device and user location disclosure, and differential privacy.
    This implied the need of cybersecurity education and awareness training for the
    users, especially to users from data breaches, and other cybersecurity threats
    (OWSAP 2015).


    Cybersecurity threat is an ever-changing landscape. Identifying threats and addressing
    risks require ongoing training and education to meet both technical and social
    aspects of cybersecurity challenges. From the technical aspects of cybersecurity,
    the IT and cybersecurity professionals are often referred to the Open Systems
    Interconnection (OSI) model for the networked environment standard. The model
    was developed by the International Organization for Standardization (ISO) in 1984,
    as a protocol networking standards and information exchange between hardware,
    software, and applications. The last version was created in 1994 (ISO/IEC 7498-1:1994)
    and reviewed in 2000 (ISO 1994). The OSI model describes a seven-layers model
    of an information communication system where data is transferred across the'
  merge: -1
  img_proc: true
- pgno: 100
  md: 'layers in a networked environment. Each layer has its protocol to communicate
    and posed vulnerability as well because cyber threats and attacks can occur at
    any of these seven layers. The point of introducing the OSI model here is to demonstrate
    the extra layers added by Michael Gregg, Chief Technology Officer (CTO), and his
    colleague (2006), in comparison with the Pedagogic Cybersecurity Framework developed
    by Dr. Peter Swire (2018). The extended models provide a complementary perspective
    on the original technical OSI model. Table 4.10 shows a comparison of the OSI
    model and its extended models.


    From the social/human perspective, the eighth layer, People, was added to the
    OSI model by Gregg and his colleague (2006) to address the human and social issues
    beyond technical functionality. Social engineering was identified as the biggest
    threat at that time, which is still a concern today. From a multidisciplinary
    perspective, Swire (2018) proposed a Pedagogic Cybersecurity Framework (PCF) which
    extends the horizon of our cybersecurity education to the organizational, government,
    and national levels. Although Swire (2018) did not list people in a separate layer,
    he placed users within the household, so-called people, in the Organization layer.
    The PCF delineates how the nontechnical areas of expertise, like cybersecurity
    management, policy, law, and international affairs, come into play. We usually
    think of cybersecurity threats from an individual or organizational level. However,
    cyber threats and impacts are also part


