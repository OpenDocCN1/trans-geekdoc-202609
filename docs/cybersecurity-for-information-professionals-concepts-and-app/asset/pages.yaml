    reported on the resulting number of user personal data harvested was 87 million
    (Isaak and Hanna 2018). Smartphone apps make giving access to apps like Facebook
    and other third-party developers very easy.


    Our use of mobile applications comes with some undisclosed risks. In the case
    of the Facebook scenario described above, by signing in to an application or authorizing
    an application to access your Facebook profile, you disclose your personal information
    and that of your Facebook friends. As a best practice, you should only accept
    a friend request from the people you know. Ghost accounts are popular on social
    media platforms like Twitter and Facebook. These ghost accounts might clone the
    persona of a celebrity or a brand, so accepting the friend request doesn’t raise
    an eyebrow. The ghost account will then send messages to the gained connections;
    hence the targeted harvesting of data will commence. Mobile app developers devise
    various methods to capture user data. A technology called Silverpush, which is
