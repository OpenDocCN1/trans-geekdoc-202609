    individual level to government, national and international level of cybersecurity
    issues. The KSAs and tasks mapped in both courses have three shared workforce
    categories, such as Investigate, Collect and Operate, and Securely Provision.
    The course “Usable Privacy and Security” deals with KSAs and tasks relevant to
    Analyze and Operate and Maintain to comprehend user needs, while the course “Government,
    National Security, and the Fifth Domain” comprises KSAs and tasks accounting for
    Protect and Defend as well as Oversee and Govern occurred at higher level.


    # Mapping to Work Roles


    Similar to job titles, work roles indicate the major responsibilities of one’s
    job. The work roles in the NICE Framework are identified by the category and specialty
    area. In this mapping activity, several work roles are identified along with the
    category in Table 4.8. The work role, Privacy Officer/Privacy Compliance Manager,
    in category Oversee and Govern, covers the most KSAs and tasks uncovered in the
    curriculum. Though Information Systems Security Manager is in the same category
    (Oversee and Govern), the number of KSAs and tasks covered is relatively lower.
    This is not surprising because privacy and ethical issues are more predominate
    among the different iSchools while security is typically identified as a technical
    concern. At the intersection between privacy and security is personal identification
    information (PII). The focus of security measure is to protect unauthorized access
    to PII and its confidentiality, integrity, and availability. On the other hand,
    the view on privacy is about managing the life cycle of PII and its alignment
    with the organization’s governance framework, risk'
