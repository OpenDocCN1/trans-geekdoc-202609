    issues and solve known security problems.


    # 12.3.4 Secure Coding Practices


    The major objective of secure coding practices is to increase awareness about
    software security among the developer community. Programs that are developed following
    secure coding standards are much more secure than programs that do not follow
    any standards. Writing secure code is an essential part of secure software development.
    Unfortunately, neither a novice nor an experienced programmer necessarily knows
    how to write code securely. A developer''s unintentional ignorance of known vulnerabilities
    and insecure coding practices can generate security flaws in a program. Such flaws
    could be responsible for crashing a program, enabling a denial-of-service attack
    or other kinds of attacks. We therefore need to adopt effective approaches to
    detect and eliminate such flaws. Hence, adopting secure coding practices helps
    avoid most of the software defects responsible for causing vulnerabilities and
    improves the quality of the software. However, we should always remember that
    in order to develop a secure application, practicing secure coding techniques
    alone is not sufficient. Security should be incorporated into every phase of the
    SDLC, as we have stated before.


    Secure coding techniques include both general guidelines, which can be used to
    improve software security independent of the programming language that is used
    for software development, and techniques specific to a programming language used
    for software development. Our discussion will focus mainly on programming language
    independent recommendations. Guidelines for specific languages such as Java and
    C++ can be found on vendor websites. For example, see Oracle (2018) for securing
    coding guidelines in Java. For further discussions and recommendations on secure
    coding techniques, see also Shiralkar and Grove (2009) and OWASP (2010).'
