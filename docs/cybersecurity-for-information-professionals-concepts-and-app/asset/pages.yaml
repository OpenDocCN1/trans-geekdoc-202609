    # ## Insider Threat


    Insider threat has become one of the most complex organizational problems (Ho,
    Hancock, Booth, Burmester, et al. 2016, Ho, Kaarst-Brown, and Benbasat 2018).
    Insiders are mostly composed of employees and contractors with whom extensive
    access to organizational information assets and systems are granted. As business
    communication is supported by ubiquitous computer-mediated technological settings,
    the ubiquitous nature of the computed-mediated technology not only transforms
    the way people interact with information systems, and with each other in virtual
    or cloud-based environment, but also grants opportunities for online deception
    to occur, thus making the shift to intentional betrayal against the organizations
    difficult to detect. Broadly speaking, there are two categories of insider threats.
    Negligent insiders can make careless mistakes and errors that allow social engineering
    to succeed and credential information to leak. More severely, rogue and deceptive
    insiders with ill intent can compromise and/or steal classified information (e.g.,
    CIA agent Aldrich Ames, FBI agent Robert Hanssen, NSA contractor Edward Snowden,
    and soldier Chelsea Manning) or launch devastating sabotage against organizations
    (e.g., publicizing the CIA hacking tools on Wiki-leak results in setting back
    the national intelligence operations many years).


