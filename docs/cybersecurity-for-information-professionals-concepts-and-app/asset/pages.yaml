  md: 'of your valid phone number plus other tracking data. Instagram, on the other
    hand, has a record of your pictures, videos, and the pictures that you like. This
    is in addition to the geolocation features Instagram has.


    By creating an open platform such as an Application Programming Interface (API)
    that provides consumers and third-party developers with the ability to get information
    from the social media platform, it can be said that a platform like Facebook’s
    motive was to democratize the data. While it is good at democratizing a platform,
    there should be controls as well, especially when the data of the authorizing
    users and their friends are being shared. Facebook’s motives can also be questioned
    as a bigger play for more advertisement revenue, partly because the results of
    the psychoanalysis campaign by the third-party apps are used to create targeted
    ads to Facebook users.


    In 2013, Cambridge Analytica (a third-party company) created an application “this
