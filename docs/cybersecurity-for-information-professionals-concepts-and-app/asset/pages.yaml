- pgno: 138
  md: 'The link between information rights/data law link to education, consumerism,
    and networks is a contested ground globally. IG seeks to underpin and enforce
    good ethical information behaviors but in part relies on legislation as the ultimate
    boundaries for delivering these frameworks. Where moral behaviors are agreed,
    IG provides for whistleblowing to call out bad behaviors, and in some instances,
    this has changed engrained national norms. However, the complexity of navigating
    information boundaries is not insignificant.


    # Information Governance Frameworks


    There is no one single approach to delivering IG. There are a wide range of frameworks
    that have been developed to put in place systems for managing, protecting, and
    leveraging information value through IG frameworks. The ARMA International''s
    *Information Governance Maturity Model* developed in 2010 established eight key
    principles against which to measure IG delivery within an organizational context
    which include accountability, transparency, integrity, protection, compliance,
    availability, retention, and disposition (ARMA International, 2010). These principles
    have been largely developed from records and information management paradigms
    and while providing a strong internal framework, they nevertheless potentially
    require some development to take account of managing information across complex
    boundaries. A critical component within the framework is the delivery of retention/disposition
    schedules. In a cybersecurity context it is important not to retain redundant
    information which might pose risks to an individual or organization if accessed
    by an unauthorized party. Equally key data, as established under a retention schedule,
    must be protected to ensure its continued availability and integrity through time
    to authorized parties. Similarly there is a need to ensure information remains
    available. Cyberattacks have sought new ways to cause damage and unethical profit.
    For example, ransomware attacks take control of a system and deny access to core
    data by organizations or individuals subject to the payment of a ransom. Bitcoin
    has enabled ransoms to be paid with minimal potential for the payment to be tracked.
    The proliferation of new forms of attack continues each year. In this regard it
    is the International Organization''s family of information security standards
    ISO 27000 (see www.27000.org/) that builds a strong framework aligning IG and
    cybersecurity.


    *ISO 27000* is legislated for as the recommended standard for information security
    best practice, for example, to deliver personal data security under the EU''s
    GDPR and to meet the requirements of the USA''s Federal Information Security Management
    Act. The key requirements of the standard series are to deliver an “Information
    Security Management System (ISMS)” which provides for information as an asset
    to be managed to deliver:'
  merge: -1
  img_proc: true
- pgno: 139
  md: '+   - protection of organizational assets, ensuring both their ongoing availability
    for business purposes and their protection against unauthorized access;

    +   - privacy of personal information;

    +   - maintenance of intellectual property rights.


    Critically it delivers (ISO 2012, 2 and 5):


    +   - Confidentiality: The property that information is not made available or
    disclosed to unauthorized individuals, entities, or processes.

    +   - Integrity: The property of safeguarding the accuracy and completeness of
    assets.

    +   - Availability: The property of being accessible and usable upon demand by
    an authorized entity.


    These defined characteristics are not synonymous and may sometimes need to be
    balanced with choices made through risk management decision processes. However,
    importantly they provide for the delivery of a system which is not dealing with
    a narrow definition of security which locks down information but rather one which
    delivers information in accordance with organizational/national needs. The framework
    is established through (ISO 2013a):


    +   - a policy, objectives, and activities that reflect business objectives and
    can include whistleblowing processes;

    +   - asset classification and control;

    +   - physical and environmental security;

    +   - personnel security;

    +   - an approach and framework to implementing, maintaining, monitoring (including
    incident reporting systems), improving systems consistent with the organizational
    culture;

    +   - systems development and maintenance protocols;

    +   - business continuity management;

    +   - legal compliance frameworks;

    +   - visible support and commitment from all levels of management;

    +   - effective marketing of the requirements to all managers, employees, and
    other parties to achieve awareness;

    +   - distribution of guidance on policy and standards to all managers;

    +   - provisions to fund key activities;

    +   - provision of appropriate awareness, training, and education;

    +   - implementation of a measurement system to evaluate performance and feedback
    suggestions for improvement.


    It aligns to the ARMA International IG principles but places the delivery of a
    potentially wider scoped risk management framework. Some of the most'
