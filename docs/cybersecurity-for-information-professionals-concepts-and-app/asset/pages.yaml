  md: '# Mobile App Privacy and Security Risks


    According to Verizon’s mobile security index that surveyed more than 600 mobility
    professionals responsible for mobile device procurement and management in their
    organizations, they were most concerned about malware, ransomware, and device
    theft/loss as the top three threats that were more likely to lead to security
    incidents in 2018, while they were most concerned about malware, ransomware, and
    insecure or poor coding practice in 2019 (Verizon 2018, 2019). Device theft/loss
    is one of the physical device threats, whereas malware, ransomware, and poor coding
    practice are app relevant threats. Although the general impression about malware
    and ransomware is that such threats are more frequently seen on Android devices,
    iOS devices are not immune.


    The Open Web Application Security Project (OWASP) has a work-in-progress mobile
    security project to categorize mobile-specific vulnerabilities, and offers Mobile
    Apps Checklist for developers and security professionals. Based on an analysis
    of 2 million mobile applications and 500,000 mobile devices with the US National
    Vulnerability Database, US Computer Emergency Readiness Team (US-CERT), and OWASP
    vulnerabilities, Pradeo Lab’s Mobile Threat Report (2018) demonstrates that approximately
    60% of mobile applications have severe flaws that can lead to data leakage (49%),
    Denial of Service (DoS) attacks (7%), Man-in-the-Middle attacks (5%), and encryption
    weaknesses (5%). The report also reveals that the most leaked data that may seriously
    infringe on privacy is geo-location coordinates, followed by contact lists, user
    profile information, user files (e.g., photo, video, and documents) and SMS. It
    is not surprising that data leakage/breach is the major issue among attacks because
    we are sharing every detail about the usage of the app and mobile device as well
    as personal data generated by using the app and device. Additionally, if a user
    owns a wearable (e.g., smart watch, fitness tracker) and it connects to the user’s
    smartphone through an app, the vendors can compound the information stored in
    the wearable with other information in the smartphone in order to further profile
    the user. Therefore, due to the connectivity of the mobile devices, the configuration
    and security, as well as the privacy settings of wearables are equally important
    in regard to the mobile phone, tablet, and laptop.


    The OWASP top 10 checklist can also inform mobile device users about which mobile
    app issues put users at risks. Table 10.1 presents the most recent top 10 list
    released in 2016 and summarizes the attack vectors, security weaknesses, as well
    as technical and business impacts. According to Table 10.1, the exploitability
    of the attack vectors is rated EASY across nine out of the top ten risks: improper
    platform usage, insecure data storage, insecure communication, insecure authentication,
    insufficient cryptography, insecure authorization, code tampering, reverse engineering,
    and extraneous functionality. The prevalence of security weakness is identified
    as COMMON across the top ten risks, while the detectability of'
