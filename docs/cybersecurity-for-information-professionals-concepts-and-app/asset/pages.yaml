    Society (2018) offers top tips for the consumers of connected IoT devices to protect
    their security and privacy, such as purchasing the connected devices that support
    updates for devices and apps, enabling encryption, reviewing the privacy settings
    on the devices and their apps, using strong passwords, avoiding reusing identical
    passwords, disconnecting the devices when not in use, and making home Wi-Fi networks
    more secure with firewalls.


    # # Conclusion: Prevention Is Better than Cure


    As we continue to become more connected with a variety of ubiquitous mobile devices,
    it is inevitable that the attack surface spreads wider and will eventually become
    limitless, which presents considerable challenges regarding mobile cybersecurity.
    Different groups of stakeholders, including device makers, mobile network operators,
    software companies, equipment providers, and Internet companies in the mobile
    ecosystem, actively participate in shaping and altering the future of mobile Internet,
    mobile apps, and mobile security. In light of the worrisome statistics on users’
    low awareness of mobile security, information professionals should not only consider
    the impact of mobile devices on information behavior and mobile device use to
    access information, but also help communicate and disseminate the major threats
    and risks in today’s dynamic mobile landscape.


    Mobile security needs to be considered and implemented at multiple layers, including
    hardware security, OS security, network security, app security, and data/information
    security. To enhance mobile security, ideally, those multiple layers should be
    combined into the security design of future mobile devices. Although there is
    still long way to go, mobile industries have united through GSMA to initiate a
    global open standard, named Mobile Connect, which aims to offer a secure universal
    identity solution and enable mobile users to authenticate themselves with an industry-wide
    standard API supporting multiple factors authentication (GSMA 2019a).


    Mobile devices are equipped with sensors to scan and collect a user’s biometrics
    (e.g., voice, iris, face, and fingerprints), geo-coordinates, personal information,
    and mobile usage data. On the one hand, users need to provide certain information
    to connect to a mobile network or an app. The service providers and vendors in
    the mobile ecosystem collect all kinds of user information as well as usage data
    to know more about their users in order to provide better user experience and
    improve apps or services. On the other hand, users have no clue as to whether
    those companies that collected the user data sell their data to unauthorized third
    parties for revenue. With all the features, functions, and conveniences that users'
  merge: -1
  img_proc: true
- pgno: 244
  md: 'have to give up in exchange for their data security and privacy, studies have
    shown that users are usually willing to compromise their data privacy for convenience
    or preferred features and functions. However, users need to be more critical about
    the privacy and security settings of their mobile devices. After all, the awareness
    of privacy and security risks will drive a user’s decisions concerning the level
    of privacy and security settings, or permission of data disclosure.


    If mobile devices lack built-in security features like iPhones do, mobile users
    need to install mobile antivirus and anti-malware apps on their mobile devices
    to help detect and defend against malicious attacks. Furthermore, mobile users
    need to ensure that the mobile OS and apps are kept updated. They also need to
    be cautious about the network connections of their mobile devices and the possibility
    of leaking sensitive information by checking if the device is running unnecessary
    functions or requesting unnecessary data.


    Ongoing security training in the organizations is very important to raise public
    awareness of mobile security and privacy risks. If it is unavailable, mobile users
    need to stay aware of the latest security threats and risks. As information professionals,
    it is essentially important for us to help mobile users seek or access risk information
    in the mobile landscape.


