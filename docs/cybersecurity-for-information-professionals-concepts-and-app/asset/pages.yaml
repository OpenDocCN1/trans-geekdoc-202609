  md: '# Conclusion


    While it is a bit awkward to expound on a work-in-progress effort, my hope is
    that librarians, educators, security researchers, and game designers will all
    benefit from reading about what was learned over the last 9 months of research
    and development for this project, and perhaps inspire more people to try new styles
    of game-based education and “intentional play” activities in a range of public
    spaces, and not just library computer labs.


    In this chapter we have explored past and present examples of how Minecraft, a
    wildly open-ended and popular commercial videogame, has been used to support teachers
    and classrooms across the globe. We also looked at one proposed use of its survival
    mode game mechanics to bring cybersecurity knowledge and security concepts to
    new audiences. Through interviews with teen librarians and teen focus groups in
    libraries, validated by a similar “talk aloud” exercise and research projects
    across multiple college campuses, four common areas of confusion or misconception
    around cybersecurity were also identified.


    Different marketing strategies to support commercially available video games as
    an extension of ongoing information literacy education and outreach already taking
    place in public libraries were also discussed; however, many of these theories
    remain untested as the experimental project which launched this research moves
    forward. We also saw two best practice examples of how unique game experiences,
    as part of a process-based mode of inquiry, can begin to engage with cybersecurity
    topics and themes through the Blind Protocol classroom experience and Spot the
    Surveillance.


    While the Minecraft project in question focused on threat modeling as the primarily
    learning objective, five additional topic areas in cybersecurity were also identified
    as areas showing major overlap with the meta-framework of Minecraft and other
    online multiplayer games worthy of future consideration from information professionals.
    At the same time, five general features or enhancements provided by video game-based
    learning were reviewed, in addition to how they could be applied to other security-focused
    classrooms.


