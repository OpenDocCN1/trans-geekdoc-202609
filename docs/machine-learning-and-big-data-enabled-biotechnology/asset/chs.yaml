  \ (14.11c)!$\\frac{dC_P(t)}{dt} = q \\cdot C_X(t) + e_P(C(t), u(t), w, b)$\n\n其中\
  \ $e_i(C(t), u(t), w, b)$ 是状态 $i$ 的偏差项，该项本身是具有权重 $w$ 和偏置 $b$ 的机器学习模型关于状态变量和操作条件的函数。\n\
  \n\n\n\n如在表 14.2 中提到的，生物过程模型经常被用于优化目的。生物过程背景下的动态优化是指识别过程随时间（如批次、分料批次和连续系统）的最优运行条件。由于许多生物过程模型包含了常微分方程\
  \ (ODEs)，生物过程的动态优化必须在优化算法中包含形式形式数值积分，从而导致并非易求解的非凸优化问题。\n\n某些优化问题还涉及具有高刚性的过程模型，在这种情况下，模型离散化会导致数值问题，转而诉助于无梯度优化算法（例如\
  \ `PSO` 和进化算法），尽管这些算法并不能保证收敛到甚至局部最优。通常情况下，建议从多个初始点进行基于梯度的优化，或者利用无梯度优化来确定一个良好的初始值，然后从该值采用基于梯度的优化，从而确保对解空间进行充分探索。\n\
  \n### 14.2.6.1 分料批次生物过程中的最优补料\n\n在本节中，我们以分料批次生物过程为例概述了一个优化框架。在优化分料批次过程时，我们可以将动态底物补料速率视为自由度在该示例中，我们建议最大化最终生物细胞密度，其优化问题包含了等式\
  \ 14.8a–14.8c 中描述的混合模型，其形式如框架 14.12 所示：\n\n\n\n\n(14.12a)\n```math\n\\min_{F, CS^{\\\
  text{feed}}} \\int CX(t_f) dt\n```\n\n(14.12b)\n```math\ns.t. F_{\\min} \\leq F(t)\
  \ \\leq F_{\\max},\n```\n\n(14.12c)\n```math\n\\frac{dCX(t)}{dt} = \\mu_{\\max}\
  \ \\cdot r_S(t) - \\theta_{\\mu d}(C(t), F(t)) \\cdot CX(t) - \\frac{F(t)}{V(t)}\
  \ \\cdot CX(t),\n```\n\n(14.12d)\n```math\n\\frac{dCS(t)}{dt} = \\frac{F(t)}{V(t)}\
  \ \\cdot (CS^{\\text{feed}} - CS(t)) - v_{maxS} \\cdot r_S(t),\n```\n\n(14.12e)\n\
  ```math\n\\frac{dP(t)}{dt} = \\theta_{qP}(C(t), F(t)) \\cdot CX(t) - \\frac{F(t)}{V(t)}\
  \ \\cdot P(t),\n```\n\n(14.12f)\n```math\n\\frac{dV(t)}{dt} = F(t),\n```\n\n(14.12g)\n\
  ```math\nr_S(t) = \\frac{CS(t)}{CS(t) + \\theta_{KS}(C(t), F(t))} \\cdot CX(t),\n\
  ```\n\n\n\n其中 `C` 是状态变量向量 `[C[X], C[S], C[P]]`，`V` 是反应器中的液体体积，`F(t)` 是时间 `t` 时的体积进料速率，`C_{S}^{feed}(images/c14-i0009.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  ><msubsup><mi>C</mi><mi>S</mi><mtext>feed</mtext></mtext></math>` 是进料中底物的浓度，`F`\
  \ 是离散化时间变化的进料速率向量。还需要注意的是，优化软件包通常以最小化为导向，而最小化函数的负值等同于找到它的最大值。Eqs. 14.8a–14.8c 已经被修改为\
  \ Eqs. 14.12c14.12c–14.12 g 所示的形式，以包含补料分分的质量平衡。还需要注意的是，引入进料可能会在优化框架中引起刚性，特别是脉冲进料，这在某些情况下会对梯度下降优化算法带来挑战。\n\
  \n## 14.2.6.2 不确定性下的动态优化\n\n根据应用的不同，可以通过目标函数或约束将不确定纳入动态优化框架。例如，稳健优化（robust optimization）要求最优解在不确定参数在其不确定性范围内的*所有*可能组合下都必须满足不等式约束条件，这对于需要保证产品质量或某些条件会危及培养生物的生物系统具有适用性。因此，稳健优化算法倾向于识别一组“最坏情况”（worst-case）参数（最可能违反约束的参数）；在决定约束条件时，使用的是“最坏情况”参数而非标称值\
  \ [[109\\]](#c14.xhtml#c14-bib-0109)。的一项关于稳健动态优化的先前研究介绍了针对青霉素生产案例的稳健优化算法研究，在该案例中，细胞密度和底物浓度在整个补料分分过程中都有最大允许值\
  \ [[110\\]](#c14.xhtml#c14-bib-0110)。虽然可以找到稳健最优解，但解决方案可能过于保守；克服这一问题的类似方法是机会约束优化（chance-constrained\
  \ optimization），它允许预定比例的解违反不确定不等式约束 [[111\\]](#c14.xhtml#c14-bib-0111)。然而，这需要对参数不确定性的分布方式做出假设。稳健优化和机会约束优化方法对于动态系统来说计算成本都是高昂的，在大多数情况下无法保证能找到全局最优解\
  \ [112, 110。\n\n一种计算开销较低的方法涉及对参数进行采样以生成多个并行模型；然后对标称目标函数的优化受所有并行模型的约束，从而近似稳健性或对机会约束的满足。这种多模态方法（即基于场景树的方法）在先前的研究中被证明，与仅使用标称参数相比，其违反约束的实例更少\
  \ [\\[113\\]](#c14.xhtml#c14-bib-0113)；然而，它并没有实现完全稳健性，不像某些计算成本更高的方法，后者旨在通过求解双层优化问题来识别“最坏情况”参数，这在随后的研究中得到了证实\
  \ [\\[110\\]](#c14.xhtml#c14-bib-0110)。\n\n当考虑来自目标函数而非约束的不确定性时，可以通过引入惩罚项来对目标函数的方差进行惩罚以考虑不确定性\
  \ [[114\\]](#c14.xhtml#c14-bib-0114)。减少对方差的惩罚允许使用户探索缺乏知识的区域以可能设计新实验，而增加这种惩罚则针对一个不太可能偏离模型预测的最优解。同样，通过使用不同的参数样本并行生成多个模型可以获得目标函数值的分布，并从中计算目标函数的均值和方差。最后，鉴于不确定性下动态优化的复杂性，本章节未包含此类内容（同样未包含混合模型构建的详细不确定性分析）。然而，感兴趣的读者可以参考\
  \ [\\[110\\]](#c14.xhtml#c14-bib-0110) 关于青霉素生产稳健优化的研究，[\\[115\\]](#c14.xhtml#c14-bib-0115)\
  \ 关于批次过程控制的机会约束强化学习，以及 [\\[116\\]](#c14.xhtml#c14-bib-0116) 关于啤酒发酵不确定性下的优化。\n\n\
  ## 14.3 微藻黄素生产的混合建模\n\n### 14.3.1 微藻黄素生产引言\n\n现在，为了说明混合建模的潜力，我们将使用微藻黄素生产作为案例研究，应用在第\
  \ 14.2 节中解释的混合建模方法。黄素是一种类胡萝卜醇，对人类有多种健康处，包括抗癌作用和预防白内障 [117–119。然而，人体内部不合成黄素，而是依赖从食物和补充剂中摄入黄素。尽管某些食物天然含有黄素，特别是水果和蔬菜\
  \ [[120\\]](#c14.xhtml#c14-bib-0120)，但服用黄素补充剂可能更方便更有效。黄素补充剂的消耗推动了全球黄素市场在 2024 年达到约\
  \ 3.69 亿美元，预计到 2029 年将增长到 4.61 亿美元，复合年增长率（CAGR）为 6.1% [\\[121\\]](#c14.xhtml#c14-bib-0121)。目前，商业化黄素生产完全来源于金盏菊花瓣\
  \ [[122\\]](#c14.xhtml#c14-bib-0122)。然而，微藻作为为了光捕获而产生黄素的微型光合生物 [[\\[123\\]](#c14.xhtml#c14-bib-0123)，与金盏菊相比，由于收获的劳动强度较低、生长速度更快且具有全年收获（而非季节性）的能力，微藻具有成为黄素生产中商业可行方案的潜力\
  \ [[\\[117\\]](#c14.xhtml#c14-bib-0117)。尽管具有商业可行性，但微藻黄素生产过程中仍存在若干局限性，即微藻细胞内的黄素含量低，导致工艺产率低，且微藻生物质生产的成本比金盏菊高，后者生长不需要那么多能量或养分喂料\
  \ [[\\[117\\]](#c14.xhtml#c14-bib-0117)。\n\n\n\n\n目前正在探索多种方案以推动微藻类黄素生产的商业化应用，其中一种方案就是异营养生长（本案例研究的重点），即产类黄素微藻在无光条件下生长，从而实现超高细胞密度，进而提高类黄素的潜在产量和生产率\
  \ 124。为了进一步优化异营养生长条件下的类黄素生产，可以进行实验以确定某些最佳运行条件，例如温度和底物选择，如之前的研究所示 124。此外，另一个考虑因素是进行分批培养操作并优化补料策略，可以使用不同的流速和补料成分。然而，补料速率和成分的潜在组合非常多，由于自由度过多，在实验中确定最佳补料策略具有挑战性。基于模型的优化通过高效地探索广泛的潜在补料条件，解决了分批培养过程优化的复杂性，从而减少了对实验的需求。在本节中，我们展示了混合建模在产类黄素微藻高密度培养（HCD）中用于分批优化的应用。\n\
  \n### 14.3.2 实验设置与数据可用性\n\n本节的案例研究侧重于利用葡萄糖和尿素作为底物，在分批条件下*索金齐球藻*的生长。在之前的研究中，尿素优于硝酸钠作为氮源，以获得更高的生物量生产率\
  \ 124。葡萄糖和尿素以单一组合料的形式在整个分批培养过程中连续补料。分批培养器的初始工作体积为 2.5 L，单补料速率可达 0.05 L/h。补料设计允许葡萄糖和尿素的浓度分别高达\
  \ 750 g/L 和 60 g/L。\n\n每 12 小时收集一次细胞密度测量值，葡萄糖和尿素浓度在前 24 小时内每 12 小时测量一次，随后每 12 小时的采样频率增加到\
  \ 3–4 次，类黄素含量则每 24 小时测量一次。进行了两个初始分批培养实验，两者都从相同的初始细胞密度、葡萄糖浓度和尿素浓度开始。第一个实验从初始的 24\
  \ 小时料阶段开始，随后通过频繁手动调整补料流速将葡萄糖浓度维持在 4 g/L 到 8 g/L 之间，直到 168 小时实验结束。整个实验过程中，葡萄糖和尿素的补料浓度分别固定在\
  \ 750 g/L 和 46.5 g/L。第二个实验也从 24 小时的料阶段开始，补料速率每 12 小时改变一次，尿素补料浓度每 12 小时调整为 0 g/L\
  \ 到 60 g/L 之间的值，直到 144 小时实验结束。实验数据见图 14.4](#c14.xhtml#c14-fig-0004)，其中类黄素含量乘以细胞密度，以显示反应器内浓度的整体变化。\n\
  \n### 14.3.3 构建微藻类黄素生产的混合模型\n\n最终，该案例研究旨在确定最佳的分批补料策略，以在过程结束时使类黄素产量最大化。为了促进分批补料优化，将构建一个分批培养过程模型并将其整合到优化框架中。该模型应能够在实验数据有限的情况下生成准确的预测，实现分批培养过程的高效优化。针对本特定案例研究构建的混合模型是根据第\
  \ 14.2 节中讨论的方法](#c14.xhtml#c14-sec-0013）构建的。主要进行动力学建模，并将其额外作为混合模型的基准，随后引入神经网络（ANN）以提高模型准确性。\n\
  \n#### 14.3.3.1 微藻类黄素生产的初步动力学建模\n\n该案例研究系统的基础动力学模型形式如式 14.13a](#c14.xhtml#c14-disp-0031）14.13f](#c14.xhtml#c14-disp-0036）所示：\n\
  \n\n\n\n(14.13a) $\\frac{dC_X(t)}{dt} = \\mu_{max} \\cdot \\frac{C_G(t)}{C_G(t)\
  \ + K_G} \\cdot C_X(t) - \\mu_d \\cdot C_X(t) - \\frac{F(t)}{V(t)} \\cdot C_X(t),$\
  \ (images/c14-math-0031.png)\n\n(14.13b) $\\frac{dC_G(t)}{dt} = \\frac{F(t)}{V(t)}\
  \ \\cdot (C_G^{feed}(t) - C_G(t)) - v_{max,G} \\cdot \\frac{C_G(t)}{C_G(t) + K_G}\
  \ \\cdot C_X(t),$ (images/c14-math-0032.png)\n\n(14.13c) $\\frac{dC_N(t)}{dt} =\
  \ \\frac{F(t)}{V(t)} \\cdot (C_N^{feed}(t) - C_N(t)) - v_{max,N} \\cdot \\frac{C_N(t)}{C_N(t)\
  \ + K_N} \\cdot C_X(t),$ (images/c14-math-0033.png)\n\n(14.13d) $\\frac{dL_C(t)}{dt}\
  \ = Y_{LX} - \\mu_{max} \\cdot \\frac{C_G(t)}{C_G(t) + K_G} \\cdot L_C(t) - d_L\
  \ \\cdot L_C(t),$ (images/c14-math-0034.png)\n\n(14.13e) $C_L(t) = L_C(t) \\cdot\
  \ C_X(t),$ (images/c14-math-0035.png)\n\n(14.13f) $\\frac{dV(t)}{dt} = F(t),$ (images/c14-math-0036.png)\n\
  \n\n\n\n其中 `C[X]` 代表单位为 g/L 的细胞密度，`C[G]` 代表单位为 g/L 的葡萄糖浓度，`C[N]` 代表单位为 g/L 的尿素浓度，`L[C]`\
  \ 代表单位为 mg/(g biomass) 的黄素含量，`C[L]` 代表反应器内的总黄素浓度。机理模型基于底物吸收和生长的 Monod 动力学假设，以及一级细胞死亡假设。将\
  \ Monod 动力学作为模型的主体是合理的，因为它在文献中的多个产黄素微藻系统模型中已成功应用 [125–127]]。尿素在公式 14.13c 中从细胞生长中解耦出来，因为图\
  \ 14.4 中的实验数据表明，细胞在尿素极少或没有的情况下仍能继续生长；尿素与生物量增长速率之间未知的关系将在构建混合模型时通过机器学习部分进行量化。需要注意的是，黄素含量是细胞内浓度。因此，在公式\
  \ 14.13d 中考虑了稀释因素。公式 14.13a–14.13f 中的参数是使用框架 14.3 中描述的参数估计框架估计的，采用的是公式 14.13a–14.13f，而非公式\
  \ 14.5b–14.5d。\n\n动力学模型拟合情况见图 14.4，参数值见表 14.3 的第二列。尽管该动力学模型对细胞密度的拟合良好（在两次分料培养实验中的\
  \ R² 值为 0.932），但该动力学模型在捕捉底物浓度曲线方面表现尤为吃力，这从两次分料培养实验中葡萄糖和尿素的 R² 值分别为 -1.073 和 0.123\
  \ 中可以看出。图 14.4 所示的两次分料培养实验 1 和 2 的动力学模型拟合结果表明，动力学模型低估了底物浓度，特别是在前 24 小时之后，这意味着动力学模型高估了它们各自的速率。到\
  \ 24 小时时，细胞密度已经增加了 600%，这意味着对消耗速率的过估可能是由于细胞密度增加导致的传质限制或细胞内竞争，而机理模型并未解释这一点。由于对该过程的机理理解尚不，可以引入数据驱动组件来捕捉系统内的剩余关系，而不需要对更复杂的动力学模型引入额外假设，从而避免引入进一步偏差。本节构建的动力学模型为混合模型提供了基础，并将从此以后作为进一步比较的基准。\n\
  \n![表 14.3 动力学模型参数及其随时间变化的均值和标准差](img/c14-i0010)\n\n### 变参数的人工网络实现\n\n如上一节所述，由于动力学模型拟合不足，因此引入了数据驱动组件以提高模型准确性。对于此情况，选择前馈神经网络（FFNN）作为数据驱动模型，因为它能够捕捉分料发酵过程中可能存在的任何非线性关系。第一步是识别随变化的参数，在本情况下发现这些参数为\
  \ `μ[max]`、`v[max]G` (images/c14-i0012) 和 `v[max]N` (images/c14-i0013)，其随时间变化的参数分别为\
  \ `theta[μ[max]]` (images/c14-i0014)、`theta[v[max]G]` (images/c14-i0015) 和 `theta[v[max]N]`\
  \ (images/c14-i0016)，因为这些参数呈现出最大的不确定性，且模型拟合对这些值表现出了足够的敏感性。随后使用框架 14.5 中的参数估计框架（遵循公式\
  \ 14.13a–14.13f）来识别随变化的参数曲线。\n\n在识别出随变化的参数曲线后（其均值 `μ` 和标准差 `σ` 见表 14.3），训练 FFNN\
  \ 以对建模随变化的参数作为输出、状态变量和控制动作作为输入之间的关系。在本情况下，作为 FFNN 输入的状态变量和控制动作是 `C[X]`、`C[G]`、`C[N]`、`F[G]`（葡萄糖供给速率，g/h）和\
  \ `F[N]`（尿素供给速率，g/h）。将控制动作包含在输入中是因为单独的状态变量值（参数更新时）无法在下一次参数更新之前提供系统的完整信息。FFNN 使用\
  \ L1 损失函数（平均绝对误差，MAE）进行训练，如公式 14.6 所示，并通过 L1 正则化对 ANN 权重和偏置的绝对值进行惩罚，如公式 14.9 所示。L1\
  \ 正则项将冗余参数收敛至零，通过鼓励训练仅关注影响最大的权重和偏置，从而减少 FFNN 的参数过化和过拟合。\n\n\n\n\n\nFFNN 包含 2 个隐藏层，每层\
  \ 8 个节点，并使用增强数据进行训练；每个增强数据集都是训练数据集的副本，但其输入施加了高斯噪声。数据增强通过扩展训练数据集并使模型对噪声更具鲁棒性来提高神经网络的性能，从而减少过拟合\
  \ [[128, 129]。在本研究中，使用高斯噪声分布生成了 100 个增强数据集，标准差为 0.01（标准化数据标准差的 1%）。引入足够的噪声以提高 FFNN\
  \ 的鲁棒性是重要的，但不能引入过多以免抑制 FFNN 的拟合能力。参数正则化与数据增强的有助于有助于在使用仅有两次批次实验的极有限数据集时的潜在过拟合问题。训练持续了\
  \ 40,000 轮（epochs），如先前的混合建模研究 [\\[130\\]](#c14.xhtml#c14-bib-0130)所示，以确保在大规模增强数据集上收敛。增强数据集训练的精度图如图图\
  \ 14.3 所示，该图展示了 FFNN 强强大的拟合能力，其对于标准化时变参数的收敛 MAE（或 L1 损失）为 0.014，$R²$ 值分别为 0.999、0.998\
  \ 和 0.999，分别为：![theta Subscript mu Sub Subscript max](img/c14-i0017.png)<math display=\"\
  inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#952;</mi><mrow><msub><mi>&#956;</mi><mrow><mi\
  \ mathvariant=\"normal\">max</mi></mrow></msub></mrow></msub></math>, ![theta Subscript\
  \ v Sub Subscript max Underscript upper G Endscripts](img/c14-i0018.png)<math display=\"\
