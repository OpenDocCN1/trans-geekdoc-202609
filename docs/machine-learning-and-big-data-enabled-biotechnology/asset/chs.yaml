  \n# 用于高通量微生物鉴定/培养的机器学习方法\n\nMohamed Mastouri\n\n（此处为单位信息）\n\n## 引言\n\n微生物鉴定和培养是微生物学中用于理解微生物群落多样性、结构和功能的关键技术。培养是指在受控的实验室条件下生长微生物，而鉴定旨在确定这些生物的分类分类。这些方法的重要性在于它们能够发现此前未知的微生物，并对它们的生态作用提供见解。例如，培养组学（culturomics）已经培养出数百与人类相关的新微生物，为宿主-细菌关系提供了新的视角。同样，将传统培养与先进测序技术相结合，发现某些培养的土壤细菌在非培养的群落分析中稀少或不存在，证明了稀有生物圈意料之外的可及性。然而，必须注意到，传统的培养方法具有局限性。自然生态系统中只有一小部分（0.1–1%）的微生物可以在标准实验室条件下培养。这导致了非培养方法的发展，如宏基因组学和单细胞基因组学，这些方法允许对未培养的微生物进行分析，并对微生物多样性和生态提供更全面的理解。\n\
  \n\n\n\n传统的微生物鉴定方法长期以来依赖于基于培养和生化的技术。这些方法涉及在培养基中分离微生物，然后进行酶促反应和形态学分析 6。虽然这些方法仍然是大多数实验室的核心基础和标准做法，但它们众所周知是耗时且耗力的，并且可能无法检测出样本中存在的所有微生物。有趣的是，分子技术彻底改变了微生物鉴定，提供了更快速、更准确的结果。基于聚合酶链反应（`PCR`）的\
  \ 16S 核糖 RNA 基因测序等方法在全面的细菌研究中变得越来越流行。其他分子方法包括荧光*原位*杂交（`FISH`）、变性梯度凝胶电泳（`DGGE`）和末端片段长度多态性（`T-RFLP`）\
  \ 7。虽然传统的培养和生化方法仍然重要，特别是在抗生素敏感性测试中 8，但分子技术显著增强了我们鉴定和研究微生物的能力。这些较新方法具有高灵敏度、特异性以及检测不可培养微生物的能力等优势。然而，重要的是，每种方法都有其自身的优势和局限性，技术的选择应根据特定的研究目标和样本类型进行\
  \ 7。\n\n各个领域的传统方法面临着巨大的挑战，限制了它们的有效性和效率。在微生物诊断中，传统方法在样本处理、培养困难、误识别以及确定耐药性方面的延迟方面力不从心\
  \ 9。这些局限性可能导致诊断不准确或延迟，从而影响患者护理。\n\n高通量（`HTP`）技术通过实现对微生物基因组、转录组和群落的快速、全面分析，彻底改变了微生物学。这些技术，特别是高通量测序（`HTS`），显著推进了我们对各种环境（包括食品系统）中微生物多样性、功能和相互作用的理解\
  \ 10, 11。`HTS` 技术允许研究人员以以前空前的速度产生大量的遗传数据，促进了全基因组分析和生物系统中分子机制的阐明 12。有趣的是，`HTP` 技术在传统微生物学之外也有应用。在食品微生物学中，`HTS`\
  \ 已用于预测食品样本中微生物的流行情况，研究微生物对食品相关条件的响应，并开发关联基因型和表型的辅助方法。此外，单细胞基因组学和宏基因组学的结合提高了从复杂微生物群获取全基因组信息的效率和精度，使研究人员能够将功能与物种联系起来并研究主病毒相互作用。`HTP`\
  \ 技术，特别是 `HTS`，已成为微生物学中不可缺的工具，为微生物群及其功能提供了前所未有的见解。这些技术在食品安全、食品发酵优化、益生菌机制理解以及摄入微生物对人类肠道微生态的影响的研究方面有着应用\
  \ 13。随着测序和计算方法的不断进步，`HTP` 技术的作用将继续扩展到微生物生态系统和人类健康。\n\n机器学习（`ML`）和人工智能（`AI`）正在彻底改变微生物领域，为数据分析、预测和决策提供强大的工具。这些技术被应用于微生物学的各个方面，包括临床诊断、耐药性（AMR）检测和实验室自动化\
  \ 14。在临床微生物学中，`ML` 算法正被通过实验室自动化来减少诊断工作量，检测和识别临床相关的微生物以及 AMR 14。这些应用具有显著提高微生物分析效率和准确性的潜力。例如，基于\
  \ AI 的系统可以全面、快速且非侵入的方式分析医学成像和诊断技术的数字数据，为疾病提供前所未有的见解 15。然而，重要的是，尽管 `ML` 和 `AI` 在微生物学中具有广阔的前景，它们在常规实验室实践中的整合仍然有限。\n\
  \n本章探讨了 `ML` 与各种 `HTP` 平台的协同作用，如基因组和宏基因组测序、质谱法（`MS`）、流式细胞术（`FCM`）和成像技术。整合策略实现了精确的微生物物种鉴定、AMR\
  \ 预测和表型表征。此外，`ML` 模型应用于自动化菌株筛选、生物反应器工艺优化以及基于 `CRISPR` 的基因组编辑等合成生物学应用。我们还回顾了 `ML`\
  \ 的基本概念，比较了不同的学习范式（监督学习、无监督、强化学习），并简要介绍了它们在微生物研究中的应用。数据标准化、模型解释性和计算开销等问题得到了批判性分析。最后，我们还暗示了未来的方向，例如多组学集成的潜力、可解释人工智能（`XAI`）以及用于推进微生物研究和诊断的新技术，如量子计算和联邦学习。本章将尝试概述\
  \ `ML` 如何变革 `HTP` 微生物研究，为未来的科学探索提供基础性背景和当前案例。\n\n\n\n\nHTP（高通量）微生物技术是指对微生物样本进行高效、快速和大规模处理或分析的前沿策略和平台。HTP\
  \ 技术在许多领域都有应用，包括基因组学、生物燃料生产和环境监测。在微生物基因组学中，HTP 测序能够产生海量的高质量序列数据，使得能够快速积累证据，并能在法医学科学中稳健地识别与微生物相关的证据\
  \ 16。该技术极大地提高了微生物分析和鉴定的速率与准确性，这对于解决生物犯罪和应对生物恐怖主义攻击至关重要。\n\nHTP 技术也应用于微生物燃料电池，在这些领域，微生物代谢被用于生物燃料生产、能量获取和生物修复\
  \ 17。这些系统引起了不同学科的兴趣，并为各种环境下的可持续应用提供了空间。在重组蛋白的生产中，已经开发了 HTP 筛选技术以提高初始工艺设计的效率。例如，`BioLector`\
  \ 微生物反应器平台已被用作 HTP 培养系统，用于筛选结果向大规模生物反应器系统具有高转移性的 `E. coli` 表达克隆 18。这种方法在很大程度上避免了在全受控生物反应器中进行实验的需求，以较低的成本加速了工艺开发。\n\
  \nHTP 技术还应用于膜蛋白的生产，膜蛋白在过去被认为是一项巨大的挑战。一种用于膜蛋白克隆和表达筛选的并行 HTP 方法显示出意意想不到的高成功率，71% 的\
  \ `E. coli` 整合膜蛋白达到了纯化所需的水平 19。HTP 方法彻底改变了微生物研究，为快速分析微生物和微生物相互作用提供了新颖且强大的系统。这些方法也被应用于微生物学的所有领域，从食品微生物学到环境微生物学和临床诊断\
  \ 10, 20, 21。HTP 测序已用于微生物群落和宏基因组研究，提供了对微生物多样性和功能性的见解 20, 22。\n\n尽管微生物研究已被 HTP 测序所淹没，但其他\
  \ HTP 方法也作为强大的工具脱颖而出。例如，`MALDI-TOF MS` 生物分型在快速鉴定微生物方面前景广阔，特别是在医学环境中 23。液滴微流也为 HTP\
  \ 微生物培养和分析开辟了新途径，具有探索单细胞异质性和微生物相互作用的能力 18, 24。HTP 方法学极大地促进了我们探索微生物系统及其应用。从基于测序的方法到新的培养方法，这些方法正在改变微生物学的各个领域。随着技术的不断演进，我们可以预期\
  \ HTP 方法取得新进展，这可能为更全面、高效的微生物研究策略开启大门 (图 8.1) 22。\n\n![图 8.1 AI 集成高通量微生物鉴定和抗药性预测的工作流：该图说明了\
  \ AI 模型集成到高通量微生物鉴定工作流中。来自基因组/宏基因组测序、MALDI-TOF 质谱 (MS) 和基于显微镜成像的输入数据经过特征提取。提取的特征使用机器学习算法进行分析。输出包括微生物鉴定、抗药性预测，展示了由\
  \ AI 方法提高的速率和准确性。](img/c08f001.png)\n\n图 8.1 AI 集成高通量微生物鉴定和抗药性预测的工作流：该图说明了 AI 模型集成到高通量微生物鉴定工作流中。来自基因组/宏基因组测序、MALDI-TOF\
  \ 质谱 (MS) 和基于显微镜成像的输入数据经过特征提取。提取的特征使用机器学习算法进行分析。输出包括微生物鉴定、抗药性预测，展示了由 AI 方法提高的速率和准确性。\n\
  \n### 8.2.2 宏基因组学与二代测序 (NGS)\n\n宏基因组学是对无需培养的环境微生物群落 DNA 进行分析，它已被二代测序 (NGS) 技术的进步所彻底改变\
  \ 25。NGS 能够对各种栖息地的微生物组成和多样性进行快速分析，同时对数百万 DNA 片段进行高通量测序 26, 27。\n\n有趣的是，NGS 已经从传统的基因组学扩展到宏基因组学，能够检测意外的疾病病毒并发现新的人类病毒（包括癌症相关病毒）。此外，NGS\
  \ 通过宏基因组学策略促进了对健康和疾病状态下人类病毒组的探索 28。\n\nNGS 显著影响了宏基因组研究，提供了对微生物多样性、群落结构和功能活动的全面见解\
  \ 29。该技术已应用于多个领域，包括临床微生物学、公共卫生、食品与农业、能源和环境 30。随着 NGS 的不断演进，有望进一步增强我们对微生物宿主相互作用的理解，并为复杂的微生物世界提供宝贵的见解\
  \ 26, 27。\n\n### 8.2.3 基于质谱的蛋白质学 (MALDI-TOF MS)\n\n基质辅助激光吸离/电离飞行时间质谱是临床微生物学中使用的一种突破性技术，能够快速准确地鉴定微生物。与传统的生化检测相比，MALDI-TOF\
  \ MS 更方便、更快速、更精确 31, 32。该技术允许在几分钟内直接从新培养菌落中鉴定细菌物种，在典型工作流中将微生物鉴定时间缩短了约一天 32, 33。\n\
  \n\n\n\n\n虽然 MALDI-TOF MS 最初设计用于细菌鉴定，但随后的研究证明，其应用范围已扩展到酵母、霉菌和分枝杆菌的鉴定[34]。此外，该技术还探索了其他多种前沿应用，如菌株分型、抗药性检测和抗真菌敏感性[34,\
  \ 35]。尽管用途广泛，但 MALDI-TOF MS 的局限性之一是难以分析小分子化合物。为了克服这一局限性，人员开发了新型纳米材料基基质，提高了该技术分析这些化合物的敏感性和准确性[36]。\n\
  \n随着应用范围不断扩大，MALDI-TOF MS 已成为临床微生物学的一项资产，可以通过加快诊断速度和缩短住院时间来改善患者预后[32, 37]。凭借应用领域的不断创新，该技术有望进一步推动微生物诊断的发展。\n\
  \n### 8.2.4 流式细胞术\n\n流式细胞术（FCM）是一种高敏技术，根据细胞的物理和化学性质广泛用于高通量（HTP）分选和单细胞分析。它结合了微流控、光学和数据收集，提供关于细胞群的定量数据[38]。该技术能够同时测量细胞大小、形状、复杂度和荧光等多种参数，对定义良好的细胞亚群进行准确表征和分离[38]。\n\
  \n具有增强能力的高端系统是近期 FCM 进展的成果。例如，成像流式细胞术（IFC）将数字显微镜与传统 FCM 结合，实现了高内细胞功能和形态分析[39]。此外，全硅纤维微流控式细胞仪的突破使得与商业硬件性能相同的便携式\
  \ HTP 设备成为可能[40]。此外，无标记技术（如  FCM）被用于在无需荧光标记的情况下研究活细胞的化学组成[39]。\n\n简而言之，FCM 在不断进步，微流控技术的进步是背后的推动因素之一[41]。这些进展显著拓宽了\
  \ FCM 从生物医学研究到临床诊断和药物开发等领域的应用范围。随着技术的进步，我们可以预期更高的分辨率、敏感性和吞吐量，从而将 FCM 转化为个体细胞分选和分析的宝贵资源。\n\
  \n### 8.2.5 微流控与芯片实验室系统\n\n微流控和芯片实验室（LOC）系统通过在芯片上微型化、集成和自动化复杂过程，改变了医疗保健，能够通过 `100`\
  \ μm 的微通道精确操纵通常量级为 `10^-9` 到 `10^-18` L 的极小体积[42]。这一发展极大扩展了 LOC 在许多领域的应用，如生物分析、代谢组学、药物发现和个性化医疗[43]。\n\
  \n然而，尽管从工程角度来看微流控系统已显著发展，但色谱系统的开发在过去几年中处于停滞状态。最初，微流控在色谱中的巨大前景引发了高度热情，但可重复性、敏感性和接口方面的挑战使其未能成为通用标准[44]。\n\
  \n突破这些限制的一种潜在发展方向是将电润介型（EWOD）执行器与其他微流控技术集成。据观察，这种集成在提升数字微流控（DMF）以用于多功能 LOC 设备方面具有潜力[45]。尽管有这些进展，但在微流控系统中各种操作步骤（流体处理、分子识别和信号放大）的集成仍然是实现完整、功能性即时检测设备关键限制[46]。\n\
  \n虽然微流控和 LOC 系统在即时诊断、环境监测和药物发现方面的前景仍然是巨大的，但从原型到完整且健壮系统的转化还需要工程、材料科学和生物整合方面的额外进展。攻克剩余的技术挑战（特别是系统集成和可重复性问题）将是释放此类系统在生物医学研究和医疗诊断中全部潜力的答案[46]。这些技术非常有前景，但其更广泛的采用将取决于克服将多个组件集成到精简、功能性平台的复杂性。\n\
  \n### 8.2.6 高内成像与表型分析\n\n高内成像和表型分析通过对复杂生物系统进行大规模自动筛选，大大增强了植物和细胞生物学研究。这些技术将先进的显微镜与复杂的图像分析算法相结合，能够自动提取多个细胞或有机特征的定量信息[47]。\n\
  \n在植物生物学中，利用各种成像模式的 HTP 表型设施已经建立，用于无破坏性测量与生长相关的性、应激反应和作物性能，提供了以前用传统方法难以获取的信息[48]。由于表型筛选实验早早在模式植物\
  \ `拟 idopsis` 上开始，现在已逐渐转向为经济上重要的作物（如高粱）建立高内成像技术的方法，以扩展农业研究中的高内成像平台[48]。\n\n\n\n\n\
  可见光、热成像、叶绿素荧光和光谱成像等多种成像技术的整合，提高了对园艺植物形态生理性状及生化响应进行完全表型分析的[[49]](#c08.xhtml#c08-bib-0049)。这种整体方法使研究人员能够实现植物，，使作物改良方法更加准确。同时，在细胞生物学领域，高含量筛选已成为一种极其强大的工具，用于在单细胞分辨率下分析药物作用、研究基因功能以及探索细胞对各种扰动的响应[[50]](#c08.xhtml#c08-bib-0050)。高含量成像取得成功的关键因素之一是先进图像分析流水线和机器学习（MI）方法的发展，这些方法在从这些技术产生的大数据集中提取有用生物信息方面发挥了至关重要的作用[[51]](#c08.xhtml#c08-bib-0051)。\n\
  \n这些计算工具允许研究人员量化复杂的表型，检测细微的处理效应并发现隐藏的生物机制。随着该领域的发展，高含量成像与其他组学技术的整合，以及标准化数据库的发展，对于进一步推动生物发现和作物育种具有巨大的潜力。尽管这些进展充满前景，但仍需计算技术和数据整合方面的创新，才能充分发挥高含量成像在基础和应用水平植物生物学中的潜力。\n\
  \n## 8.3 机器学习基础\n\n### 8.3.1 机器学习与 AI 的定义\n\nML 是 AI 的分支，使计算机能够通过从经验中学习来得出结论并提高性能，而无需针对特定任务进行显式编程[[52]](#c08.xhtml#c08-bib-0052)。然而，AI\
  \ 描述的是执行执行与人类智能相关的任务的总体概念，例如推理、解决问题和决策[52, [53]](#c08.xhtml#c08-bib-0053)。\n\n虽然\
  \ ML 被广泛认为是 AI 的子领域，但一些研究人员将 ML 区分为窄人工智能，侧重于其通过数据和预测进行学习的能力，与之相反，AI 包含了各种类型的机器智能[[53]](#c08.xhtml#c08-bib-0053)。这种区分强调了\
  \ ML 在应用中的特殊性，其目标是设计算法和统计模型，使机器能够通过经验、数据模式和学习来提高任务性能。\n\nAI 作为一门通用学科，旨在创建可以模拟人类认知能力的智能系统。另一方面，ML\
  \ 特指算法开发，通过从数据中学习来增强机器性能，因此是 AI 成功的不可或缺的组成。AI 和 ML 通过自动化复杂的决策、功能优化和提高预测准确性，在医学、光学、光子学和工业的广泛应用中展现着巨大的潜力[52–[55]](#c08.xhtml#c08-bib-0055)。这些技术通过实现更高效、更准确的分析正在改变行业，有望在诊断、制造和其他领域带来改进。\n\
  \n### 8.3.2 监督学习 vs 无监督学习 vs 强化学习\n\nML 是 AI 的分支，允许计算机通过从数据中学习来进行推理并增强性能，而无需为了特定目的进行直接编程[[52]](#c08.xhtml#c08-bib-0052)。AI\
  \ 是更广泛的概念，指机器执行传统与人类智能相关的任务，如推理、解决问题和决策[52, [53]](#c08.xhtml#c08-bib-0053)。\n\n\
  虽然 ML 通常被视为 AI 的子领域，其他学者将 ML 区分为一种窄人工智能，强调其在数据驱动学习和预测功能方面的专业化，与之对比的是 AI 的通用范围，包含了其他类型的机器智能[[53]](#c08.xhtml#c08-bib-0053)。这种区别强调了\
  \ ML 在应用中的独特性，其目标是开发算法和统计模型，促进机器通过经验、数据模式和推理来提高任务完成。\n\n![图 8.2 监督学习和无监督机器学习方法的视觉概览：(a)\
  \ 监督学习技术使用标记数据执行分类和回归任务。常见算法包括决策树、支持向量机 (SVMs)、线性/逻辑回归、K 近邻算法 (KNN) 和神经网络。分类涉及学习类别之间的决策边界，而回归则是对数据拟合连续趋势。(b)\
  \ 无监督学习方法处理无标记数据以发现隐藏模式。主要任务包括聚类、降维和异常检测。这些方法用于识别自然分组、减少数据复杂性或寻找稀有的离群数据点。[62] /\
  \ 经 Elsevier 许可。](images/c08f002.png)\n\n图 8.2 监督学习和无监督机器学习方法的视觉概览：(a) 监督学习技术使用标记数据执行分类和回归任务。常见算法包括决策树、支持向量机\
  \ (SVMs)、线性/逻辑回归、K 近邻算法 (KNN) 和神经网络。分类涉及学习类别之间的决策边界，而回归则是对数据拟合连续趋势。(b) 无监督学习方法处理无标记数据以发现隐藏模式。主要任务包括聚类、降维和异常检测。这些方法用于识别自然分组、减少数据复杂性或寻找稀有的离群数据点。[[62]](#c08.xhtml#c08-bib-0062)\
  \ / 经 Elsevier 许可。\n\n在广义上，AI 专注于创建可以模拟人类智功能的智能系统。另一方面，监督、无监督和强化学习（RL）是根据策略和应用领域划分的三种不同的\
  \ ML 方法论。\n\n监督学习（图 8.2a）是在标记数据上训练模型，这些数据提供了输入特征和相应的输出标签[[56]](#c08.xhtml#c08-bib-0056)。算法被训练用于映射输入值到目标输出，最典型的分类或回归问题。例如，在分类中，模型被训练以根据标记示例估计一个映射输入向量到预给类别的函数[[56]](#c08.xhtml#c08-bib-0056)。当有大量高质量标记数据可用时，监督学习的效果最好，算法可以进行充分的预测或分类。然而，这里的巨大局限是标记数据的获取成本和时间，这在大多数实际应用中可能是极其昂贵的。\n\
  \n\n\n相反，无监督学习（图 8.2b））处理的是未标记的数据，目的是识别内在的模式或结构，而不是目标输出标签 [[56]](#c08.xhtml#c08-bib-0056)。当难以获取或稀缺标记数据时，这种方法尤特别方便，因为它允许发现数据中隐含的模式。无监督学习最大的困难可能在于发现和分析数据中的这些底层结构\
  \ [[57]](#c08.xhtml#c08-bib-0057)。无监督学习倾向于利用聚类和降维等方法。例如，无监督特征学习可以用于从高维数据中学习判别性特征，例如在高光谱图像分析中，其目标是在不丢失有用信息的情况下降低数据复杂性\
  \ [[58]](#c08.xhtml#c08-bib-0058)。\n\n尽管监督学习和无监督学习是最成熟的范式，但强化学习（RL）是本书未涵盖的另一个重要范式。RL\
  \ 涉及通过与环境交互来训练模型，算法根据所采取的操作获得反馈（奖励或惩罚），而不是使用标记数据。该范式最适用于动态和不确定环境中的决策问题。\n\n机器学习框架下的监督学习、无监督学习和\
  \ RL 各有优劣，并且对于特定类型的问题是最优。当存在标记数据时，监督学习表现优异，能够为分类和回归任务建立非常准确的模型。另一方面，无监督学习专门用于揭示未标记数据中隐藏的模式或结构，因此特别适用于聚类和降维。RL\
  \ 与其他者的区别在于，它关注在变化变化的情况下进行决策，智能体通过与环境交互并相应收到奖励或惩罚来学习。它对于序列决策问题特别有用 [[56]](#c08.xhtml#c08-bib-0056)。\n\
  \n机器学习通过开发通过数据驱动学习优化性能的算法，直接为 AI 的成功做了贡献。AI 和 ML 在医疗、光学、光子学和工业等许多领域具有巨大潜力，因为它们可以被用于自动化复杂的决策过程、优化性能并增强预测能力\
  \ [[55]](#c08.xhtml#c08-bib-0055)。两者都在改变行业，因为它们能够实现更多的分析，从而带来诊断、制造和其他类别的突破。\n\n\
  RL 与监督和无监督学习的区别在于，它侧重于根据环境的反馈学习最优动作 [[56]](#c08.xhtml#c08-bib-0056)。在这里，智能体通过试错来学习最大化奖励的累和，它在视频摘要等方面取得了成功\
  \ [[59]](#c08.xhtml#c08-bib-0059)。\n\n还存在嵌入了此类学习范式元素的混合方法。例如，半监督学习同时利用未标记和标记样本来提高模型性能，因此在没有多少标记数据但有大量未标记数据时，它是实用的。自训练（self-training）、协同训练（co-training）和基于深度学习（DL）的方法等技术通常应用于半监督学习\
  \ [[60]](#c08.xhtml#c08-bib-0060)。\n\n虽然每个学习范式都有其优点，但它们也有缺点。监督学习在需要大量标记数据时可能要求非常高，无监督学习并不一定能转化为具体的任务目标，而\
  \ RL 在复杂环境中实施具有挑战性。混合方法中的新兴突破报告了令人鼓舞的结果。例如，对比学习方法已经弥合了计算机视觉应用中无监督学习和监督学习之间的差距 [[61]](#c08.xhtml#c08-bib-0061)。在监督任务中使用无监督特征学习也被认为可以提高性能，特别是在缺乏足够标记数据的情况下\
  \ [[58]](#c08.xhtml#c08-bib-0058)。\n\n最后，选择合适的 ML 范式取决于所面临的问题、标记数据存在否以及任务目标。随着研究的持续，新的技术和混合方法正在不断开发，扩展了机器学习的领域以满足不同领域的需求。\n\
  \n### 8.3.3 微生物识别中常用的 ML 算法\n\n\n\n机器学习（ML）算法在微生物识别和分类中变得越来越重要。几种常用的机器学习算法在该领域展示了良好的前景。`Decision\
  \ Trees`（决策树）和`Random Forests`（`RFs`）是微生物识别的热门选择。`Decision Trees`创建一个流程图结构来根据特征对样本进行分类，而`RFs`通过结合多个决策树来提高准确性并减少过拟合。这些算法在处理具有许多特征的复杂数据集时特别有用\
  \ [[63]](#c08.xhtml#c08-bib-0063)。`SVMs`（支持向量机）在微生物分类任务中表现出高性能。`SVMs`的工作原理是在高维空间中寻找最优超平面以以分离不同的类别。它们在处理数据中的线性和非线性关系方面非常有效\
  \ [[64]](#c08.xhtml#c08-bib-0064)。`K-nearest neighbors`（`KNN`）是微生物识别中另一种广泛使用的算法。它根据特征空间中`KNN`的多数类对样本进行分类。`KNN`在多项研究中均显示出良好的效果，特别是在处理较小的数据集时\
  \ [[64]](#c08.xhtml#c08-bib-0064)。\n\n`Neural Networks`（神经网络）和`DL`（深度学习）方法近年来受到了广泛关注。这些方法可以从大型数据集中自动学习复杂模式，适用于分析高维微生物数据。`DL`模型在基于图像的微生物识别任务中表现出卓越的性能\
  \ [[63]](#c08.xhtml#c08-bib-0063), [64]](#c08.xhtml#c08-bib-0064)。\n\n特征选择和降维技术对于提高微生物识别中机器学习模型性能至关重要。这些方法有助于识别最相关的特征并减少数据集的复杂性，从而产生更高效、准确的模型。`Principal\
  \ Component Analysis`（`PCA`，主成分分析）和递归特征消除等技术被常用 [[65]](#c08.xhtml#c08-bib-0065)。大数据在微生物`ML`应用中的作用不言而喻。随着大规模基因组和宏基因组数据集可用性的增加，`ML`算法可以利用这些丰富的信息来提高其预测能力。大数据方法能够发现微生物群中新的模式和关系，而这些关系通过传统的分析方法可能是无法发现的\
  \ [[64]](#c08.xhtml#c08-bib-0064)。\n\n模型验证和性能指标对于评估微生物识别中`ML`模型的可靠性和有效性至关重要。常见指标包括准确率、精确率、召回率和`F1-score`。准确率衡量预测的整体正确性，而精确率和召回率则侧重于模型正确识别正性案例的能力。`F1-score`提供了精确率和召回率的平衡衡量。`Receiver\
  \ Operating Characteristic`（`ROC`，受者工作特征）曲线和`Area Under the Curve`（`AUC`，曲线下面积）是评估二分类模型性能的重要工具。它们说明了不同分类阈值下真阳性率和假阳性率之间的权衡\
  \ [[64]](#c08.xhtml#c08-bib-0064)。\n\n需要注意的是，`ML`算法的性能取决于具体的微生物识别任务和数据集的性质。例如，在一项关于宫颈癌预测的研究中，`RF`、`Decision\
  \ Tree`、`Adaptive Boosting`和`Gradient Boosting`算法实现了 100%的准确率，而`SVM`达到了 99%的准确率\
  \ [[63]](#c08.xhtml#c08-bib-0063)。另一项关于脑肿瘤分类的研究中，`KNN`和`Neural Networks`的性能优于其他模型，准确率分别为\
  \ 98.5%和 98.4% [[64]](#c08.xhtml#c08-bib-0064)。数据尺度方法的选择也会显著影响模型性能。例如，在一项心脏病诊断研究中，`CART`算法结合`Robust\
  \ Scaler`或`Quantile Transformer`的表现优于其他组合，实现了 100%的准确率。\n\n## 8.4 用于高通量微生物识别的机器学习方法\n\
  \n`ML`技术越来越多地应用于搜索各种来源的复杂数据集，包括基因组信息、微生物群落信息、显微镜图像和光谱信息 [[66]](#c08.xhtml#c08-bib-0066)。这些技术的目标是提高微生物识别的准确性和速度，这超越了传统技术。\n\
  \n机器学习用于识别微生物的一些算法包括`SVMs`、`Artificial Neural Networks`（`ANN`）、`RF`和`logistic regression`\
  \ [[67]](#c08.xhtml#c08-bib-0067), [68]](#c08.xhtml#c08-bib-0068)。这些算法能够高效地管理大量数据，并确定人类专家难以检测的复杂模式\
  \ [[69]](#c08.xhtml#c08-bib-0069)。例如，在`MALDI-TOF MS`分析中，已采用`ML`方法来改进物种识别和`AMR`（抗药性）\
  \ [[69]](#c08.xhtml#c08-bib-0069)。\n\n惊讶的是，虽然像`RF`这样更复杂的模型在某些情况下可能提供更好的性能，但即使是极其简单的`L2-regularized\
  \ logistic regression`（L2 正则化逻辑回归）在大多数情况下也能提供相当的性能。简单模型的优势是它们学习速度快且更容易解释，这在透明度考虑和计算速度至关重要的情况下特别有价值\
  \ [[68]](#c08.xhtml#c08-bib-0068)。这产生了根据特定目标选择合适的`ML`模型的需求，并在模型的复杂性、准确性和可解释性之间进行平衡。\n\
  \n总的来说，`ML`通过提供快速精确处理复杂微生物数据的可能性正在彻底改变微生物识别。尽管如此，应足够关注模型复杂度、计算能力和可解释性之间的权衡，以确保所选的`ML`方法符合研究或临床目标。\n\
  \n### 8.4.1 基因组和宏基因组数据处理\n\n宏基因组和基因组数据分析在微生物生态学和环境科学中变得越来越重要。序列对齐和特征检测是解读此类复杂数据集的核心活动，`ML`工具已成为宏基因组样本物种识别和分类的强大方法。\n\
  \n\n\n\n机器学习（ML）在物种识别中的应用彻底了宏基因组数据分析。多种机器学习方法，包括`SVMs`、决策树、`RF`、神经网络（`NN`）和深度学习（`DL`），被用于分类、回归或聚类复杂的代谢组数据[\\\
  [72\\]](#c08.xhtml#c08-bib-0072)。这些方法通过代谢组谱在改进疾病建模和诊断方面显示出巨大潜力[\\[72\\]](#c08.xhtml#c08-bib-0072)。深度学习在\
  \ 16S rRNA 分类中特别成功。例如，`DL-TODA` 是一种基于卷积神经网络（`CNN`）架构的程序，已被证明可以在不需要构建参考数据库的情况下以高准确率分类宏基因组读段[\\\
  [73\\]](#c08.xhtml#c08-bib-0073)。在用来自 639 种物物的 2454 个基因组模拟的合成数据上，`DL-TODA` 实现了超过\
  \ 0.98 的分类准确率，属水平以上达到 0.98，物种水平达到 0.97，优于 `Kraken2` 和 `Centrifuge` 等最先进工具。\n\n16S\
  \ rRNA 分类的另一种新解决方案是 `RiboDetector`，这是一个利用双向长短期记忆（`BiLSTM`）神经网络的软件包[\\[74\\]](#c08.xhtml#c08-bib-0074)。`RiboDetector`\
  \ 能够快速准确地从各种类型的序列数据中识别 rRNA 读段，包括转录组、宏基因组和宏转录组数据集。它表现出优于现有方法的性能，误分类更，且对于识别新型 rRNA\
  \ 序列具有极强的泛化能力[\\[74\\]](#c08.xhtml#c08-bib-0074)。\n\n一个基于机器学习的宏基因组物种分析的有趣案例研究是 `DeepVirFinder`，这是一种无需参考且无需比对的方法，用于从宏基因组数据中识别病毒序列[\\\
  [75\\]](#c08.xhtml#c08-bib-0075)。`DeepVirFinder` 使用病毒 `RefSeq` 序列进行训练，并使用新发现的序列进行评估，结果显示其在不同长度片段范围内优于现有工具。在人类肠道宏基因组样本的应用中，它识别了结直肠癌患者的\
  \ 50,000 个病毒序列，并提示了病毒存在与癌症状态之间的可能关联[\\[75\\]](#c08.xhtml#c08-bib-0075)。\n\nWang\
  \ *et al.* 在 2015 年的一篇名为 `MetaBoot` 的论文中构建了一种新型机器学习框架，其目标是促进在宏基因组数据中发现非冗余的分类标志物。`MetaBoot`\
  \ 将最小冗余最大相关（`mRMR`）方法与自助采样（bootstrapping resampling）相结合，以增强标志物选择的稳健性、准确性和生物相关性。该系统通过数据归一化、初始特征选择、重复自助采样以减少冗余和噪声，以及基于标志物选择频率的最终排名来工作。将\
  \ `MetaBoot` 与不同统计分布（正态、伽马和混合）的合成数据以及真实的口部和土壤微生物组数据集进行了比较。与 `LEfSe`、`Metastats`\
  \ 和 `Wilcoxon` 等传统方法相比，`MetaBoot` 在检测具有生物相关性的非冗余标志物方面表现更优，并提高了分类准确率。该研究命名为 `MetaBoot`，是因为它是分类应用中发现标志物的可靠平台，在微生物群落谱分析、环境监测和临床诊断中具有重要的应用价值[\\\
  [76\\]](#c08.xhtml#c08-bib-0076)。\n\n在综述期间，Fiannaca *et al.* [\\[77\\]](#c08.xhtml#c08-bib-0077)\
  \ 强调了机器学习（特别是 `DL` 架构）在实现宏基因组研究中准确的细菌分类方面日益增长的重要性。他们指出，传统方法、基于比对的方法以及广泛使用的 `RDP`\
  \ 分类器在计算成本和准确性降低方面面临挑战，特别是在处理 NGS 数据的短读序列时。为了解决这些限制，作者建议并测试了两种 `DL` 模型——`CNNs` 和深度置信网络（`DBNs`），并结合基于\
  \ k-mer 的序列表示。他们的模型超过了其他模型，特别是在处理 `AMP` 序数据时，属水平准确率超过 91%，超过了 `RDP` 分类器的 83.8%。\n\
  \n机器学习，尤其是 `DL`，在应对序列噪声、16S rRNA 基因的高变区以及海量宏基因组数据方面起着至关重要的作用。这项研究指出，`DL` 为细菌检测提供了精确且可扩展的解决方案，为其在诊断设备、环境采样和微生物组研究中的应用铺平了道路，在这些领域，精确的微生物群落分析至关重要[\\\
  [77\\]](#c08.xhtml#c08-bib-0077)。该研究引入了 `ANNA16` (图 8.3)，这是一种基于 DNA 序列的新型 16S rRNA\
  \ 基因拷贝数（GCN）估计器，解决了基于 16S rRNA 的微生物群落分析中的一个重大空白。细菌和古菌的 16S `GCN` 在 1 到 21 之间，而传统的基于读段计数的方法容易导致微生物群落中细胞丰度的偏差。现有方法由于基于分类学或系统发育，受到数据库异质性、高计算复杂性和准确性降低的限制。\n\
  \n`ANNA16` 通过利用集成集成模型（`SEM`），结合多层感知器（`MLP`）和 `SVM` 架构克服了所有这些限制。该算法针对 `rrnDB` 数据库中超过\
  \ 19,000 条全长 16S 基因序列进行了训练。通过基于 6-mer 的表示，`ANNA16` 实现了无需系统发育定位的 16S `GCN` 直接预测。性能比较表明，`ANNA16`\
  \ 优于 `rrnDB`、`CopyRighter`、`PAPR` 和 `PICRUSt2` 等传统工具，无论是针对全长还是通用扩增的高变区（V1–V9）。模型在均方误差（RMSE）方面表现最佳，表明其具有最好的准确性和泛化能力。\n\
  \n![图 8.3 深度学习模型的框架和架构。(a) DNA 序列：K-mer 化 (K = 6)。(b) ANNA16 的框架。(c) 基于 MLP 的集成模型\
  \ (SEM)。(d) SEM 内部模块的架构。[78] / Springer Nature / CC BY 4.0.](images/c08f003.png)\n\
  \n图 8.3 深度学习模型的框架和架构。(a) DNA 序列：K-mer 化 (K = 6)。(b) `ANNA16` 的框架。(c) 基于 MLP 的集成模型\
  \ (SEM)。(d) SEM 内部模块的架构。[\\[78\\]](#c08.xhtml#c08-bib-0078) / Springer Nature /\
  \ CC BY 4.0。\n\n此外，通过应用 `SHAP`（Shapley 加性解释）分析，作者证明了 `ANNA16` 可以识别非常有信息的序列位置，例如被传统方法忽略的非典型保守位。这一观察表明，像\
  \ `ANNA16` 这样的深度算法可以检测超出已知位点的微妙进化信号。论文还描述了未来的改进方向，例如实施迁移学习以及解决极高 `GCN` 值物种的数据不平衡问题。\n\
  \n简而言之，`ANNA16` 通过为解决 16S rRNA `GCN` 偏差提供一种可扩展、准确且可解释的程序，展示了深度学习在微生物组研究中的力量。该程序在临床诊断、环境研究和微生物生态学中的定量微生物组分析中起着关键作用[\\\
  [78\\]](#c08.xhtml#c08-bib-0078)。\n\n### 8.4.2 基于质谱的鉴定\n\n\n\n\n与传统的生化方法相比，MALDI-TOF\
  \ MS 以其便捷、快速、准确和廉价的优点，改变了临床微生物实验室的微生物鉴定模式 [32, 75]。该技术在日常微生物鉴定中可以节省约一天的时间，已成为临床微生物学的关键工具\
  \ [32。MALDI-TOF MS 方法基于全细胞指纹法，结合专用生物信息学软件进行谱图分析和鉴定 [79]。ML 算法，特别是集成在 `MALDI Biotyper`\
  \ 软件中的算法，实现了谱数据的处理以及与参考数据库的匹配，从而实现准确鉴定 [79。\n\n临床微生物学的一项案例研究表明，MALDI-TOF MS 在葡萄球菌的鉴定方面非常准确，99.3%\
  \ 的分离株被正确鉴定到物种水平 [79]。该技术在其他医学相关微生物（包括分枝杆菌属、酵母和多种病原体）的鉴定中也展现出巨大潜力 [34]。此外，MALDI-TOF\
  \ MS 在耐药性检测和菌株分型中的应用也具有前景，在流行病学调查中具有价值 [80]。尽管发展迅速，但在优化样品制备、扩大参考数据库以及完善某些微生物分类的鉴定算法方面仍面临挑战\
  \ [81]。解决这些挑战对 MALDI-TOF MS 在临床诊断中的进一步进化具有重要意义。\n\nWeis 等人 [69] 的系统综述考虑了将 ML 技术与\
  \ MALDI-TOF MS 结合，用于微生物鉴定和药物敏感性测试（AST）。在回顾 36 项研究时，该综述详细说明了最常用的 ML 算法，即 `SVM`、`Genetic\
  \ Algorithms` (GA)、`ANN` 和 `RFs`。这些技术显著增强了物种间的区分能力，特别是对于密切相关的微生物，如葡萄球菌属 (*Staphylococcus*)、链球菌属\
  \ (*Streptococcus*) 和克雷伯菌 (*Klebsiella*)，并有助于准确预测 AMR，例如耐甲西林黄色葡萄球菌（MRSA）和耐万霉素中水平菌株。\n\
  \n尽管有这些结果，综述报告了几个重要的局限性：样本量小、外部验证有限（仅占研究的 11%）以及由于依赖商业软件且缺乏开放数据或共享代码导致的可重复性差。作者提出了协作步骤，以生成具有耐药谱的公开数据集，采用透明的\
  \ ML 工作流并引入外部验证，以提高此类方法的临床实用性。\n\n这项研究强调了 ML 增强型 MALDI-TOF MS 进一步加速微生物诊断的潜力，但指出需要标准化和可重复性以获得更广泛的临床认可\
  \ [69]。De Bruyne 等人 [14] 的研究创建了一个利用 MALDI-TOF MS 方法结合数据处理和 ML 算法鉴定细菌种的基准方案。研究人员针对乳杆菌属\
  \ (*Leuconostoc*)、果乳菌属 (*Fructobacillus*) 和乳球菌属 (*Lactococcus*) 优化了样品制备方案（如细胞涂片和细胞提取），并使用了归一化和背景校正等严格的预处理方案。\n\
  \n进行了 `PCA`、多维缩放 (`MDS`) 和 `kNN` 分析以揭示物种特异性谱图。乳杆菌属和果乳菌属的鉴定准确率为 84.6%，乳球菌属的准确率为 94.2%。通过应用\
  \ `SVM` 和 `RFs` 等模型，鉴定准确率显著提高，达到了 98.4% 的准确率和 96.8% 的 F 分。\n\n该研究表明，基于 MALDI-TOF\
  \ MS 和 ML 的细菌种鉴定是一种高效、经济且可靠的过程，在微生物分类和诊断中具有广泛的应用前景 [14]。\n\nFeucherolles 等人 [82]\
  \ 研究调查了 MALDI-TOF MS 与 ML 结合用于弯曲弯杆菌 (*Campylobacter jejuni*) 和空肠弯杆菌 (*Campylobacter\
  \ coli*) 的快速 AMR 检测。对来自人类、动物和环境的 224 株弯曲弯杆菌和 116 株空肠弯杆菌对包括青霉素和四环素在内的七种抗生素耐药性进行了测试。利用\
  \ `RF` 和逻辑回归模型分析蛋白谱，在检测耐药菌株方面实现了高灵敏度（92.3%）和准确率（81.2%）。\n\n该研究还评估了物种特性和提取方法的影响，发现不同提取类型之间没有显著差异。此外还鉴定了潜在的\
  \ AMR 标志物，有助于理解这些病原体的耐药机制。\n\n作者得出结论，集成 MALDI-TOF MS 和 ML 的流水线是一种有前景、快速且具有成本效益的早期\
  \ AMR 筛选工具，有助于临床和食品安全背景下的快速抗生素治疗。然而，他们建议使用更大的数据集并扩大病原体覆盖以进行临床验证 [82]。\n\n这项研究建立了一种基于\
  \ MALDI-TOF MS 和监督 ML 模型的端到端流水线，以增强对三种相关肠球菌（粪肠球菌 *E. faecalis*、E. faecium* 和乳杆菌\
  \ *E. lactis*）的物种水平鉴定。通过 410 菌株和 1640 份谱图，作者比较了 `KNN`、`SVMs` 和 `RF` 模型。传统的 MALDI-TOF\
  \ MS 和商业 `Bioty` 软件将乳杆菌误判为粪肠球菌。相反，随机森林 (`Random Forest`) 模型表现更好，准确率达到 99.1%，AUC\
  \ 值大于 0.98。\n\n该研究还检测到了物种特异性的质谱标志物，并通全基因组测序进行了验证，包括 I 型毒素-抗毒素系统和异亮氨酸 tRNA 合成酶等蛋白质的峰。作者得出结论，ML\
  \ 增强的 MALDI-TOF MS 显著提高了极相似肠球菌种的分类准确性和区分能力，为临床诊断和食品安全监测提供了快速且具有成本效益的工具。\n\n### 8.4.3\
  \ 基于图像的鉴定\n\n\n\n\nAI 彻底改变了微生物菌落形态的研究，使其变为对微生物的快速精确识别。用于自动识别的标注细菌数据集（AGAR）包含 18,000\
  \ 张 5 种微生物的图像，旨在辅助微生物菌落分析的自动化 83。该数据集包含了各种光照下的单培养和混合培养图像，并被标记为可计数、不可计数或空白。将深度神经网络架构（如\
  \ `Faster R-CNN` 和 `Cascade R-CNN`）应用于 AGAR 数据集，已证明了深度学习（DL）方法在从培养皿图像中自动定位微生物并对其分类的巨大潜力\
  \ 83。无标记单细胞流式细胞术（IFC）与数字全息显微镜相结合，已成为生命科学和临床诊断的一种强大成像技术 84。深度学习应用于全息成像使得即时检测设备有效利用。研究人员提出了一种结合\
  \ `Mask R-CNN` 进行细胞检测、卷积自动编码器进行特征提取以及前馈神经网络进行单细胞分类的综合方法，以避免不同实验条件下产生的数据偏差 84。该方法已成功用于耐药性子宫内膜细胞识别这一挑战性问题。通过数字全息显微镜和机器学习（ML），已实现了无染色\
  \ IFC 中血中未处理癌细胞的实时可视化以及自动检测与分类 85。\n\n这种方法能够对原性和转移性结肠癌细胞以及四种血细胞进行分类，每秒 15 个细胞的吞吐量下具有高精度（92.56%）\
  \ 85。此外，还开发了一种集成微流控、光子、计算显微镜、实时图像处理和机器学习的图像引导细胞分选与分类系统，提供了流式细胞术（FCM）的高吞吐量和显微镜的丰富信息\
  \ 86。Özel Duygan *等人* 87 报告了 `CellCognize`，这是一种机器学习工作流，可以从 FCM 数据中快速识别和分类微生物类型的多样性。在学习了由细菌菌株、酵母和微珠组成的\
  \ 32 个参考标准的多参数 FCM 数据后，`CellCognize` 通过训练 `ANN` 实现了 80% 的平均预测准确率。系统能够解析微生物物种，识别生理状态（如生长阶段）并量化生物量产量。它的效果与\
  \ 16S rRNA 基因测序和 14C 标记底物掺入等传统方法一样有效。该流程被应用于合成微生物群和天然淡水微生物群，准确地记录了群落对化学改良的响应。此外，`CellCognize`\
  \ 通过将未知微生物群的 FCM 特谱与参考标准进行比较，返回了其相似性评分。这一方面显示了其在临床、环境和工业背景下进行快速、低成本微生物多样性分析的前景 87。Martis\
  \ *等人* 88 提出了一种用于计算机细菌分类的深度学习架构，弥补了传统手动方法耗时且容易出错的局限性。该架构通过微调现有的预训练 CNN 模型（`VGG16`、`MobileNet`\
  \ 和 `Inception v3`）利用了迁移学习，处理了一个包含 12,000 张细菌图像（分为 12 类）的数据集。旋转和缩放等预处理任务在分类前对图像进行了标准化。在这些模型中，`VGG16`\
  \ 达到了 99.99% 的最高准确率，远超 `MobileNet` (73.33%) 和 `Inception v3` (80.24%)。该架构不仅能根据结构和形状预测细菌簇，还为每个预测提供了置信度值，从而保证了可靠性。研究确定在识别细菌的模型中\
  \ `VGG16` 表现最佳，并对未来对病毒和其他单细胞生物的识别提出了潜在的系统扩展建议 88。\n\n## 8.5 高通量微生物培养的机器学习方法\n\n\
  ### 8.5.1 机器学习驱动的微生物生长预测\n\n机器学习驱动的微生物生长预测已成为一种强大的方法，用于加速开发用于可持续生产价值化合物的高性能菌菌。基于约束的建模（CBM）和机器学习技术独立或结合使用，已被证明在分析和优化发酵参数方面是有效的\
  \ 89。这些方法能够从基因型预测细胞表型，并揭示复杂生物系统中的模式，为发酵过程建立更准确、可靠的模型。\n\n在工业背景下，机器学习已成功应用于预测大型垃圾干发酵系统中的沼气产量性能。利用\
  \ AutoML 算法（如 `AutoGluon` 和 `H[2]O`）的新型智能系统对消化器和渗液罐的沼气输出实现了高预测准确率。除了准确预测外，该系统还提供了可解释的见解和预警能力，强调了机器学习在优化复杂工业发酵工作流方面的潜力。\n\
  \n机器学习与 HTP 机器人平台的集成显著增强了微生物培养。开发了一种开源机器人菌株分离平台，结合机器学习算法，可以根据需求快速产生微生物分离物。通过利用菌落形态和基因组数据，该系统实现了微生物多样性的最大化，并实现了特定属的选择。当应用于人类粪便样本时，它成功建立了肠道微生物生物库，涵盖了\
  \ 80% 以上的丰富分类，凸显了其在系统微生物组分析和生物库方面的用途。\n\n机器学习在优化小型筛选平台的培养条件也起了关键作用。Berkeley Lights\
  \ Beacon® 系统是一种高通量灌流平台，允许在模拟工业分批发酵的连续培养条件下监测菌株产量 90。这种方法促进了全基因组随机突变后高产菌株的选择。\n\n\
  除了培养优化，机器学习越来越多地应用于实验数据的分析和解释。机器学习增强的光谱分析和动力学模型实现了催化剂的表征和合成条件的优化，加速了微生物培养中的材料发现\
  \ 91。\n\n培养芯片技术的创新扩大了高通量微生物培养的范围。一种包含多达百万个生长室的微工程陶瓷片被用于快速活细胞计数、高通量筛选和特定表型的目标回收 92。这种多功能平台能够实现快速动态的环境变化，促进了特定酶活性的检测和宏基因组库的筛选。总之，这些进展展示了机器学习在从菌株选择、发酵优化到数据分析和生物库的整个微生物培养流程中的变革性潜力。\n\
  \n### 8.5.2 AI 在微生物培养过程优化中的应用\n\n\n\n先进的生物反应器和计算机化培养监测平台引领着这场革命，实现了实时数据采集与分析，以实现更好的过程控制\
  \ 93。`Raman spectroscopy` 已证明是哺乳动物细胞培养生物反应器在线监测的非常有用的工具。这种非破坏性技术允许同时预测多种培养参数，如谷氨酰胺、葡萄糖、乳酸和细胞密度\
  \ 93。同样，如 `Zn[2]GeO[4]:Mn@Fe^(3+)` 等电子探针设备能够对微生物代谢（即 `Fe(III)` 呼吸）进行实时监测，并为复杂的代谢活动提供见解，增强生物合成\
  \ 94。\n\n`RL` 在自适应培养系统中展现出广阔前景，特别是在连续生物反应器中共培养的控制。`RL` 代理可以将群体维持在指定水平，并在发生低频率采样时表现优于标准控制器。令人惊讶的是，通过并行运行五个生物反应器，可以在\
  \ 24 小时内获得有效的控制策略，这验证了这种方法的有效性 (图 8.4) 95。过程分析技术 (`PAT`) 与 `AI` 的结合使得海量培养数据集的开发和使用成为可能。数据驱动模型\
  \ (`DDMs`) 现在可以将过程学条件与细胞培养状态相关起来，并预测活细胞密度、产物浓度和代谢物浓度等动态行为。这些模型在计算负载、准确性和可靠性之间取得了平衡，这使得在生物工艺工程中做出主动决策成为可能\
  \ 96。\n\n药物微生物学人工智能辅助生物工艺优化的临床示例，是一个全自动 24 并微生物反应器机器人设施的设计与建造。该系统由基于模型的自适应输入设计模型管理，支持在模拟工业规模生物反应器的条件下对克隆库进行规模缩小表征。培养策略通过宏观动力学生长模型进行定期优化，展示了\
  \ `AI` 在菌株筛选和工艺开发中的力量 97。\n\n另一种突破方法是使用 `Berkeley Lights Beacon®` 平台开发的的高通量灌流筛选平台。它允许实时测量连续培养菌株的产量，并提供与工业相关生物反应器过程中行为高度相关的表型。该平台已有效用于通过全基因组随机突变提高高产率菌株，产生在生物反应器中峰值生产率大幅增加的突变体\
  \ 90。\n\n![图 8.4 用于连续培养中两种营养缺陷型物种控制的强化学习。(a) 强化学习 (RL) 循环；代理通过动作与环境交互，并观察环境状态以及奖励。代理采取行动以最大化其收到的总奖励（回报）。(b)\
  \ 依赖两种不同营养物质的双营养缺陷型生物系统，对共同碳源进行竞争。(c) 连续培养器图。RL 代理观察到的状态由两种细菌菌株的群体组成；代理采取的行动控制流入反应器的营养缺陷养分的浓度。(d)\
  \ 代表性系统轨迹。代理在离散时间点（圆圈）采取的行动影响状态动力学（黑色箭头），目标是满足奖励条件（移动到绿色圈中心）。状态由两个（连续定义的）微生物群体 N1\
  \ 和 N2 的丰度组成。代理的行动决定了营养缺陷养流入反应器的速率。在每个时间步，代理的奖励取决于当前状态与目标状态之间的距离。95 / PLOS / CC\
