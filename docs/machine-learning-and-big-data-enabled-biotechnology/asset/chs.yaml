  \ 1.136 |\n| PEPlife 49 | 在不同*in vivo*条件下的肽半衰期数据库。 | 938 |\n| THPdb 50 | 已批准治疗性肽和蛋白平台，包括药代动力学和机制。\
  \ | 852 |\n| InverPep 51 | 用于临床应用的反向抗菌肽专用数据库。 | 774 |\n| B3Pdb 52 | 汇编能够穿过血脑屏障肽的平台。\
  \ | 465 |\n| Quorumpeps 53 | 参与群体感通信的肽数据库。 | 354 |\n| PLifePred 54 | 肽半衰期估计的预测工具和库。\
