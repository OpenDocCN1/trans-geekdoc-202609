  \ 12.1 引言\n\n在 19 世纪和 20 世纪的大部分时间里，生物化学和计算机一直沿着独立的路径发展。在 20 世纪中期，随着 DNA 双螺旋结构的破解以及第一台现代计算机的等突破性成就，这两个领域呈指数级增长，并开始相互影响（图\
  \ 12.1）。大脑中的神经元及其网络启发了数学家和计算机科学家开发人工神经网络（ANN）。计算机的自动化和信息处理启发了生物学家和生物化学家开发下一代测序（NGS）和生物信息学。随着这两个领域日益密切，解决健康和能源全球挑战的创新解决方案应运而生。其成果之一是先进代谢谱分析框架的发展，推动了生物技术和医学的发展。这些方法建立在代谢模型（在第\
  \ 1 章和第 2 章中描述）、代谢组学（在第 10 章中描述）以及通量模型（在第 9 章和第 11 章中描述）的基础之上。在这里关注代谢的动力学，并探索机器学习（ML）在阐明这些动态方面的作用。\n\
  \n## 12.2 代谢的动态本质\n\n生物由几个复杂的生物化学反应网络组成（见第 1 章和第 2 章）。代谢是其中之一，能够在变化环境中产生细胞能量货币和生物化学构建块。换句话说，虽然代谢网络的结构是不变的，但它们是动态的，并不断受到调节以维持稳态。\n\
  \n![图 12.1 时间线。生物化学和计算领域中塑造定量和计算生物学的重大事件时间线。](img/c12f001.png)\n\n图 12.1 时间线。生物化学和计算领域中塑造定量和计算生物学的重大事件时间线。\n\
  \n代谢网络主要由酶催化反应和一些自发反应组成。在这两种反应类型中，底物浓度的增加都会导致反应速率的提高。然而，对于前者，有限的酶活性位点导致了反应动力学的饱和行为，这被称为米凯尔斯-门登方程（Michaelis-Menten\
  \ kinetics）。酶活性，或酶催化反应的速率也受到产物和效应物浓度的影响，它们可以产生正负调节。因此，每种代谢物都具有多种身份，作为各种酶的底物、产物以及激活剂和抑制剂。酶和代谢物的结合产生了代谢网络和一种涌现属性——自调节，它引导瞬态代谢状态走向稳定的稳态。\n\
  \n让我们来看糖酵解中的一个由磷酸果糖激酶（PFK）催化的反应示例。\n\n![](img/c12g001.png)\n\nPFK 通过耦合腺苷三磷酸（ATP）转化为腺苷二磷酸（ADP），催化\
  \ 6-磷酸果糖（F6P）磷酸化为 1,6-二磷酸果糖（FBP）。反应速率 `v[`PFK]` 可以表示为可逆的类米凯尔斯-门登方程。\n\n(12.1)![v\
