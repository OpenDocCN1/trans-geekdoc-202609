  \n对于具有 $N$ 个反应的网络，将解决 $2*N$ 个优化问题。所有通量的可行行区域由一个 $N$ 维多面体描述。FVA 是在该可行区域周围内接最小边界框的一种方便方法。FVA\
  \ 无法找到 $N$ 维多面体本身，因为在相同目标函数下改变某个反应的通量通常需要网络中其他通量也发生变化。图 1.3 显示了可行区域和 FVA 求解空间。\n\
  \nFVA 还可以用于寻找特定环境条件下代谢网络中的阻塞反应，如第 1.3.2 节所述。这些反应的 FVA 确定的最小值和最大值均为零。阻塞反应可能是由反应限制引起的，也可能是由于代谢网络中的缺口，例如网络中没有产生或消耗途径的代谢产物（死端代谢产物）。识别这些阻塞反应有助于发现死端代谢产物，并通过将这些反应的值预设为零来缩小\
  \ FBA 的搜索空间。\n\n![Figure 1.3 FVA solution space.](img/c01f003.png)\n\n图 1.3 FVA\
  \ 求解空间。\n\n## 1.4.3 通量采样\n\n虽然 FVA 提供了可能通量的范围，但它没有提供可行区域内的分布。通量采样旨在通过生成许多满足网络约束的可行解来解决这个问题。这为代谢潜力提供了更全面的视图，特别是当目标函数尚时不。通量采样的关键优势在于能够揭示可能通量的范围和分布，而不受限于特定目标，如\
  \ 56–58 所示。\n\n与 FBA 通过优化定义目标来识别单一通量分布不同，通量采样生成了大量的可行通量状态集合，而不会优先考虑任何特定解决方案。因此，结果本质上是非确定性的，反映了模型约束允许的所有可能的代谢行为范围。需要进一步分析从这些分布中提取生物学见解，例如识别频繁活跃的反应、通量相关性，或可能代表生理相关状态的主导代谢途径\
  \ 62-64。\n\n然而，通量采样的计算非常密集，特别是对于具有数千个反应的大型基因组规模模型（GEMs）。高效采样需要先进的线性代数方法和仔细的预处理，以确保数值稳定性和对解空间的均匀覆盖。此外，解释产生的高维数据可能具有挑战性，通常需要降维或统计总结。与提供清晰优化准标准的\
  \ FBA 不同，通量采样并不指示哪种分布在生物学意义上是“最好的”或“最可能的”；它只是展示了在模型约束可能会发生什么。\n\n通量采样还通过生成高维数据集允许与机器学习方法结合，这些数据集可以进行聚类、分类或针对表型状进行回归。这对于具有复杂调控的系统或尝试预测涌现属性特别有价值。\n\
  \n![Figure 1.3 FVA solution space.](img/c01f003.png)\n\n图 1.3 FVA 求解空间。FBA 针对特定的代谢目标进行优化，产生单一通量分布，而通量采样在不假设目标的情况下对可行空间进行采样。结果是通量采样产生了概率分布，并提供了更深代谢见解。此示例通量分布是\
  \ GAPDH（甘醛-3-磷酸脱氢酶）的，其中 $N=5,000$。\n\n\n\n\n\n一旦构建了功能完善且经过验证的 GEM，它就可以作为一种强大的*计算机（in\
  \ silico）*工具，用于模拟和分析细胞行为。这一步标志着从基础生化网络模型向能够生成生物学洞察的预测平台的转变。*计算机*预测可以指导代谢工程、菌株设计、培养基优化以及第\
  \ 1.6 节中讨论的各种生物技术应用的假设生成。然而，这些预测的质量和可靠性高度取决于应用于模型的约束质量、所选的优化策略以及相关生物数据的整合。本节讨论了整合组学数据、系统知识、机器学习（ML）和其他生物网络的工具和技术，以生成可靠的预测。\n\
  \n## 1.5.1 约束\n\n代谢模型代表了生物在任何条件下的所有可能的代谢能力。为了做出准确的、特定条件的预测，必须应用生物学约束来缩小可行解空间。这些约束应用于第\
  \ 1.4 节中定义的相同模型（`FBA`、`flux sampling`），但通过定义在给定的实验或生理背景下哪些反应可能活跃，为预测提供了更多的背景信息和精炼。约束越符合生物学实际，预测的通量就越接近真实的细胞行为。\n\
  \n各种组学数据集可用于施加这些约束，如表 1.1 所示。代谢组学数据在转换为摄取和分泌速率时，会直接限制交换反应，并常用于所有的 `FBA` 方法。转录组学允许通过基因表达水平推断反应活性，诸如\
  \ `MADE` [\\[67\\]](#c01.xhtml#c01-bib-0067)、`MOOMIN` [\\[68\\]](#c01.xhtml#c01-bib-0068)\
  \ 和 `SPOT` [\\[81\\]](#c01.xhtml#c01-bib-0081) 等方法通过 `GPR` 关联将表达数据转换为特定条件的模型。热力学约束（使用吉布斯自由能变化）为反应分配方向性并防止不可行的循环；诸如\
  \ `TFA` [\\[48\\]](#c01.xhtml#c01-bib-0048)、`CycleFreeFlux` [\\[78\\]](#c01.xhtml#c01-bib-0078)\
  \ 和 `loopless-COBRA` [\\[49\\]](#c01.xhtml#c01-bib-0049) 等方法整合了这些原理。\n\n酶动力学和物理能力约束考虑了细胞对酶的丰度和催化能力的限制；诸如\
  \ `FBAwMC` [\\[72\\]](#c01.xhtml#c01-bib-0072)、`MOMENT` [\\[73\\]](#c01.xhtml#c01-bib-0073)\
  \ 和 `GECKO` [\\[76\\]](#c01.xhtml#c01-bib-0076) 等方法反映了蛋白质组约束、拥挤和能量预算，从而超越了化学计量比，更好地捕捉细胞的优先偏好。\n\
  \n## 1.5.2 目标函数\n\n在基于优化的模型中（`FBA` 是最流行的一种），需要目标函数来预测通量分布，但目标函数的选择并不总是明确的。目标函数是代谢模型中有用的组件，因为它们可以引导通量向真实的解决方案发展。\n\
  \n代谢模型中最常用的目标是`生物量最大化`，其基于细胞自然优先考虑长的假设。然而，在某些条件下（特别是在压力或营养限制物下），这一假设可能不再成立。可以将组学数据整合到代谢模型中以帮助此。诸如\
  \ `ObjFind` [\\[82\\]](#c01.xhtml#c01-bib-082)、`BOSS` [\\[83\\]](#c01.xhtml#c01-bib-083)、`invFBA`\
  \ [\\[84\\]](#c01.xhtml#c01-bib-084) 和 `SCOOT` [\\[85\\]](#c01.xhtml#c01-bib-085)\
  \ 等方法利用组学数据提供更细致的分析。多目标公式化允许同时考虑多个目标，例如生长或生存。这些方法的示例总结在表 1.2 中。\n\n## 1.5.3 验证计算机预测\n\
  \n`GEM` 的用处在于其做出准确预测的能力。预测的准确性可以根据模型的背景通过与实验数据的比较来评估。在接下来的章节中，我们概述了几个关键。\n\n表 1.1\
