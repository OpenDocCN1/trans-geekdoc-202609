  \ movablelimits=\"false\">&#8721;</mo><mrow><mi>j</mi><mo>=</mo><mn>1</mn></mrow><mi>V</mi></munderover><msub><mi>y</mi><mrow><mi>i</mi><mo>,mo><mi>j</mi></mrow></msub><mi>log</mi><mrow><mo\
