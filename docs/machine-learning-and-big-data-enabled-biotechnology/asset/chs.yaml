  >MID</mi> <mtext mathvariant=\"italic\">measured</mtext> </msub> <mo>&#8722;</mo>\
  \ <msub> <mi mathvariant=\"italic\">MID</mi> <mtext mathvariant=\"italic\">simulated</mtext>\
  \ </msub> </mrow> <mo stretchy=\"false\">)</mo> </mrow> <mn>2</mn> </msup> <msub>\
  \ <msup> <mi>&#963;</mi> <mn>2</mn> </msup> <mtext mathvariant=\"italic\">measured\
  \ MIDs</mtext> </msub> </mfrac> </math>\n\n由于不同途径之间的原子映射存在差异，因此感兴趣的途径决定了应该使用何种标记剂进行通量测。因此，通过\
  \ ¹³C MFA 测定的通量准确性取决于标记剂的组成和位置标记 24。\n\n## 12.4 将机器学习引入代谢通量分析\n\n通量平衡分析（FBA）识别代谢网络的限制，并预测整体表型，如生长速率、基因必需性和生物产品合成的可行性。与\
  \ FBA 相比，MFA 通过整合同位素示信息更准确地预测通量；然而，MFA 的学习曲线更陡。实施 MFA 需要在原子映射、同位素示、代谢模型构建和数学优化方面具有专业知识。\n\
  \n![图 12.5 利用机器学习简化通量量化：(a) 同位素标记模式的实验测量和测量的传输通量（营养物质摄取和产物分泌速率）是确定通量的成分。(b) MFA\
  \ 模拟同位素标记模式，直到它们与实验观察结果充分匹配。机器学习（ML）模型捕捉了同位素标记模式与通量之间的关系。(c) 两种方法都旨在确定编码在同位素标记模式中的通量。](img/c12f005.png)\n\
  \n图 12.5 利用机器学习简化通量量化：(a) 同位素标记模式的实验测量和测量的传输通量（营养物质摄取和产物分泌速率）是确定通量的成分。(b) MFA 模拟同位素标记模式，直到它们与实验观察结果充分匹配。机器学习（ML）模型捕捉了同位素标记模式与通量之间的关系。(c)\
  \ 两种方法都旨在确定编码在同位素标记模式中的通量。\n\nMFA 的复杂性促使人们探索 ML 技术以简化 MFA (图 12.5)。目前存在多种 ML 算法，它们都有其独特的优缺点。这些算法可以大致分为监督学习和无监督学习方法。监督学习涉及在标记数据上训练模型，其中输入特征和期望输出是知的，而无监督学习旨在发现未标记数据中的模式和关系。衍生\
  \ ML 模型性能和适用性取决于训练阶段使用的数据集的质量和数量。\n\n### 12.4.1 ML 应用 MFA 的挑战\n\n在描述用于 MFA 的不同 ML\
  \ 工具之前，我们先讨论将 ML 应用于 MFA 的挑战。这些挑战源于数据的可用性以及训练 ML 模型所需的计算能力。\n\n#### 12.4.1.1 缺乏训练机器学习模型的同位素标记模式和通量数据\n\
  \n通量分析的训练数据集可能来源于先前的 MFA 结果 25–27，包括来自质谱（MS）或核磁共振（NMR）的同位素标记模式 28 29。虽然这些方法提供了代谢通量的详细见解，但高质量通量数据的可用性有限。代谢模型规模和复杂性的增加带来了进一步挑战。例如，`iAF260`\
  \ 模型 30。数据缺失、损坏和错误会影响 ML 模型的训练和预测准确性。通过数据清洗解决这些问题对于确保有效学习至关重要 32。数据的一致注释（无论是人工还是机器生成的）也同样关键。\n\
  \n#### 12.4.1.2 通量预测中同位素标记模式的可变尺寸\n\n通量可以通过不同的同位素标记剂和测量不同的代谢物来获得。例如，对于具有六个碳子的葡萄糖，有\
  \ 62 种位置 ¹³C 标记葡萄糖标记剂（2⁶=64，减去均匀标记 (13)C 和均匀未标记的两个平凡葡萄糖异构体）。取决于感兴趣的生物和可用仪器，测量的代谢物也会有所不同。因此，输入\
  \ ML 模型的同位素标记模式的大小和类型具有很大的变异性。\n\n#### 12.4.1.3 异构数据类型的整合\n\n\n\n\n多组学数据（例如转录组学和蛋白质组学）以及热力学约束构成了关于代谢通量的额外信息。然而，由于这些数据和约束的格式不同，整合异构数据集以训练机器学习（ML）模型并预测通量面临着挑战。此外，除了最简单的情况外，其他组学数据与通量之间的关系尚未被完全建立（例如，基因敲除或沉默导致通过相应酶催化的反应的通量为零或可忽略不计），这增加了除同位素标记模式之外引入更多数据集进行通量预测的挑战。\n\
  \n#### 12.4.1.4 初始计算成本\n\n收集、生成和清理训练数据，以及训练、验证和测试机器学习模型需要大量的计算能力。此外，如果代谢网络结构或跨越代谢网络的原子映射未知，那么构建适用于通量分析的代谢模型在计算和实验成本上将非常昂贵。好在，一旦机器学习模型训练完成，使用它们的计算强度应该比运行数学优化来获取通量要低得多。\n\
  \n### 12.4.2 可用的计算工具\n\n机器学习模型基于算法，这些算法从训练数据中学习模式以做出预测或决策。我们展示了已用于并可能用于通量确定中各种任务的计算工具和机器学习算法示例。\n\
  \n#### 12.4.2.1 为训练机器学习模型进行代谢通量采样\n\n由于机器学习模型的好坏完全取决于其训练数据，因此采样可行且具有生理学意义的通量是一项重要任务。采样通量的最常用方法之一是蒙特卡洛（MC）采样，这是一种探索受限通量空间的随机算法。当通量空间很大（基因组规模模型）时，MC\
  \ 采样（如击打运行（HR）算法）是高效的。改进的 HR 算法，例如人工中心化击打运行（ACHR）和带带舍入的坐标击打运行（CHRR），已被开发出来以满足狭窄的解空间\
  \ [[33]](#c12.xhtml#c12-bib-0033)。基于约束的重建与分析（COBRA）是一种可在 MATLAB 和 Python 中使用的、基于约束的\
  \ FBA 工具箱，它有助于在代谢网络上施加物理化学约束以获得稳态通量 [[12]](#c12.xhtml#c12-bib-0012)。`COBRA` 利用上述\
  \ MC-HR 技术来估计代谢网络中的通量分布。ANNs 和 GANs 是机器学习框架，可以在其中集成 MC 采样算法以生成通量训练数据集。\n\n#### 12.4.2.2\
  \ 贯穿整个代谢网络的原子映射\n\n确定原子穿过代谢网络的去向是同位素示的基础。跨越单个反应从底物侧到相应产物侧的原子映射提供了有关通量分布与同位素标记模式之间关系的信息。原子映射模型可以通过整合文献中代谢酶的反应机制知识来开发，但随着代谢模型范围的扩大以及反应机制的未知，这会变得非常繁琐。因此，计算方法在映射原子转移方面发挥了补充作用\
  \ [[34]](#c12.xhtml#c12-bib-0034)。用于原子映射的潜在机器学习工具包括图卷积网络（GCN）和 Transformer 架构。GCN\
  \ 是一种专门设计用于处理图结构化数据的特殊神经网络。GCN 已被用于单细胞 RNA 测序数据研究细胞级代谢通量 [[35]](#c12.xhtml#c12-bib-0035)\
  \ 以及预测 *E. coli* 中的基因必需性 [[36]](#c12.xhtml#c12-bib-0036)。Transformer 编码器模型是一种常用于文本分析的无监督机器学习方法。它们已被用于专门从反应\
  \ SMILES 作为训练数据来映射化学反应 [[37]](#c12.xhtml#c12-bib-0037)。Transformer 架构还被用于开发一种名为\
  \ `BERT`（基于 Transformer 的双向编码表示）的机器学习语言模型，该模型在合成化学中被广泛用于预测化学反应和逆合成路径 (22–24)。\n\n\
  #### 12.4.2.3 信息丰富的同位素标记物的选择\n\n信息丰富的同位素标记物应该为感兴趣的代谢通路提供定量知识。如 `INCA` 等软件包已被开发用于辅助选择信息丰富的同位素标记物。`INCA`\
  \ 允许用户模拟来自代谢通量的同位素标记 [[38]](#c12.xhtml#c12-bib-0038)。支持向量机（SVM）等监督学习模型用于分类和回归任务，并已用于分析基因表达、蛋白质丰度和组学数据\
  \ [[39]](#c12.xhtml#c12-bib-0039)。`SVM` 分离和分类数据使其成为选择同位素标记物非常有前景的计算工具。另一个监督机器学习模型示例是随机森林（RF）。`RF`\
  \ 是一种集成学习方法，通过结合多个决策树并进行聚合来增强预测准确性。`RF` 模型已应用于药物发现中的活性分子识别、癌症代谢通路研究以及心衰患者的风险预测 (40–42)。`RF`\
  \ 也可用于识别同位素标记物的用途。\n\n#### 12.4.2.4 其他辅助机器学习工具\n\n强化学习是一种范式，代理通过试错学习与环境交互并最大化累计奖励\
  \ [[43]](#c12.xhtml#c12-bib-0043)。强化学习可用于优化涉及酶表达时间变化的动态通路，并根据环境线索或细胞状态控制基因表达，从而对代谢过程进行精确调节。迁移学习是一种技术，利用从一个领域获得的知识来增强另一个相关领域的性能\
  \ [[44]](#c12.xhtml#c12-bib-0044)。迁移学习在从研究良好的生物向研究较少的生物转移重建基因调控网络方面显示出前景 [[45]](#c12.xhtml#c12-bib-0045)，从而加速了数据稀缺背景下的网络建模。用于\
  \ MFA 不同任务的无监督机器学习工具包括聚类和关联算法。聚类算法分析未标记原始数据，发现模式并根据相似性将数据分为若干类 [[46]](#c12.xhtml#c12-bib-0046)。`K-means`\
  \ 聚类算法能够处理大数据，并已用于利用无标记数据绘制人类扁桃组织中的代谢物分布图 [[47]](#c12.xhtml#c12-bib-0047)。关联算法是发现数据集中模式和变量间相关性的另一种方法\
  \ [[48]](#c12.xhtml#c12-bib-0048)。这些算法可以被用来发现代谢网络及其内部同位素追踪等复杂系统中的新模式。\n\n### 12.4.3\
  \ 基于机器学习的代谢通量分析的通用工作流\n\n\n\n\n基于 ML 的通量确定由四个步骤组成，在代谢流量分析（MFA）中可以找到对应的步骤。它始代谢模型构建，随后是训练数据生成、ML\
  \ 模型训练和测试（图 12.6）。为了训练和测试用于通量化的 ML 模型，需要由同位素模式和通量的配对数据。基于 ML 和基于优化的策略之间的差异会影响通量计算的执行以及结果分析。尽管如此，两种通量确定方法都依赖于通量与同位素标记模式之间的相同基本关系，确定通量所需的成分也是相同的。\n\
  \n通量定量成分包括：\n\n1. 代谢网络\n2. 同位素标记模式\n3. （可选）营养物质摄取和产物分泌的速率\n\n![图 12.6 基于 ML 的通量分析步骤...（省略部分文本）](img/c12f006.png)\n\
  \n图 12.6 基于 ML 的通量分析步骤。描述了基于 ML 的 MFA 构建的四个步骤，并与传统 MFA 的类似过程进行了对比。两种方法在代谢模型构建上采用了相同的底层框架。然而，基于\
  \ ML 的方法中数据生成的仿真发生在训练之前，而基于优化的仿真则发生在通量确定的运行时。同样，基于 ML 的 MFA 训练将计算需求提前了，而基于优化的 MFA\
  \ 的计算需求在运行时最高。最后，基于 ML 的 MFA 使用预留的测试数据全局范围内评估通量预测的准确性和精度，而基于优化的 MFA 则通过额外的仿真和优化轮逐单独评估准确性和精度。\n\
  \n#### 12.4.3.1 代谢模型构建\n\n作为通量确定的第一步，必须构建一个描述代谢通量与同位素标记模式之间关系的代谢模型。代谢模型由（1）化学计量矩阵和（2）原子映射组成。化学计量矩阵（`S`）根据单个反应的底物和产物的化学计量系数在数值上表示代谢模型（图\
  \ 12.2）。`S` 的每一行对应一种代谢产物，每一列对应模型中的一个反应。代谢模型可以从各种数据库获取，如 BiGG [\\[49\\]](#c12.xhtml#c12-bib-0049)。原子映射描述了原子如何通过生化反应从底物重新组合成产物（图\
  \ 12.4）。原子映射信息可以从 MetaCyc 等数据库获取 [\\[50\\]](#c12.xhtml#c12-bib-0050)。\n\n#### 12.4.3.2\
  \ 获取训练数据\n\nML 模型需要一组真实的输入-输出对进行训练。在通量确定的背景下，输入包括测量的同位素标记模式（图 12.3）以及（如果可用）转通量，输出是完整的细胞内和转通量集。然而，细胞内通量通常没有基于测量的“真值”。相反，训练数据可以通过使用与生理相关的通量仿真同位素标记模式（例如同位素异构体和\
  \ `MIDs`）来生成。通过仿真生成数据的一个重要考虑因素是通量的采样。基于生理学、热力学和/或启发式方法限制通量空间会使采样更有效。为了最小化通量预测的偏差，采样应均匀覆盖受限的通量空间\
  \ (15, 51)）。一旦选择了通量空间和采样算法，应确定训练数据集的大小，以平衡计算效率（可能意味着通量空间覆盖不足）和准确性（可能需要详尽的通量采样）。一旦选定一组通量用于标记仿真，基于\
  \ ML 的 MFA 数据生成就类似于 MFA 中优化搜索过程中仿真同位素标记模式的步骤。关键区别在于，基于优化的 MFA 需要对每个通量预测进行迭代仿真，而基于\
  \ ML 的 MFA 则提前进行所有仿真，并学习同位素标记模式与未来所有通量预测之间的关系。\n\n#### 12.4.3.3 训练机器学习模型\n\n由同位素标记模式和代谢通量组成的配对数据被分为三类，用于\
  \ ML 模型的训练、验证和测试。训练涉及 ML 模型（算法）的选择和参数调优。ML 模型的性能根据其通量预测的准确性和精度进行评估。使用一个量化真实通量与预测通量之间差异的损失函数来引导\
  \ ML 模型的训练和评估。\n\n```\n(12.3)![italic Loss equals f left-parenthesis v Subscript\
  \ true Baseline comma v Subscript predicted Baseline right-parenthesis](img/c12-math-0004.png)\n\
  <math display=\"block\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  > <mtext mathvariant=\"italic\">Loss</mtext> <mo>=</mo> <mi>f</mi> <mrow> <mo stretchy=\"\
  false\">(</mo> <mrow> <msub> <mi>v</mi> <mtext>true</mtext> </msub> <mo>,</mo> <msub>\
  \ <mi>v</mi> <mtext>predicted</mtext> </msub> </mrow> <mo stretchy=\"false\">)</mo>\
  \ </mrow> </math>\n```\n\nML 模型训练和评估中的损失函数与基于优化的 MFA 中的目标函数形成对比，后者量化测量与仿真标记模式之间的差异。\n\
  \n```\n(12.4)![italic Loss equals f left-parenthesis italic upper M I D Subscript\
  \ measured Baseline, italic upper M I D Subscript simulated right-parenthesis](img/c12-math-0005.png)\n\
  <math display=\"block\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  > <mtext mathvariant=\"italic\">Loss</mtext> <mo>=</mo> <mi>f</mi> <mrow> <mo stretchy=\"\
  false\">(</mo> <mrow> <msub> <mi mathvariant=\"italic\">MID</mi> <mtext>measured</mtext>\
  \ </msub> <mo>,</mo> <msub> <mi mathvariant=\"italic\">MID</mi> <mtext>simulated</mtext>\
  \ </msub> </mrow> <mo stretchy=\"false\">)</mo> </mrow> </math>\n```\n\n不同的损失函数意味着基于优化的\
  \ MFA 旨在准确仿真同位素标记模式，而 ML 预测旨在准确的通量预测。虽然预计这两种方法会从相同的同位素标记模式输入产生相似的通量，但结果并不一定相似，因为相同或相似的同位素模式可能源于不同的通量集。\n\
  \n#### 12.4.3.4 机器学习模型的评估\n\n\n\n\n\n可以使用 ML 模型在训练阶段未见过的测试数据，对训练好的 ML 模型通量预测的准确性和精确性进行评估。通过将保留测试数据中的预测通量与真实通量进行比较，可以量化误差分布的偏差和宽度，这为\
  \ ML 通量预测的准确性和精确性提供了基础。基于 ML 的 MFA 评估过程与基于优化的 MFA 不同，后者涉及从不同的初始通量集开始的多轮优化，用以映射局部和全局最小值，并通过\
  \ `VarSSR` 对识别出的最小 `VarSSR` 处通量波动的敏感性来确定置信区间。在评估 ML 模型时，应进行拟合优度分析（例如决定系数、赤卡 X² 检验等）。\n\
  \n### 12.4.3.5. 执行：直接从同位素标记模式计算代谢通量\n\n基于 ML 的 MFA 的主要优势是易于使用、计算成本极低且易于获取。与基于优化的\
  \ MFA（需要对同位素标记模式进行迭代模拟）不同，ML 模型只需要一次计算。此外，虽然目前的基于优化的 MFA 软件是解释同位素标记模式和计算代谢通量的强大工具，但需要代谢模型构建和编程方面的专业知识才能获得可靠的通量输出。基于\
  \ ML 的 MFA 的执行只需要输入同位素标记模式实验测量的一个简单步骤。考虑到这些因素，预构建的代谢模型和预训练的 ML 模型简化了通量确定，并将 MFA\
  \ 的用途扩展到广泛的研究社区。\n\n### 12.4.4 提高基于 ML 的 MFA 的速度和精度\n\n可以实现各种 ML 架构和整体软件设计来改进 MFA。最近的研究表明，ML\
  \ 模型能够根据同位素标记模式准确且快速地预测通量 [\\[11\\]](#c12.xhtml#c12-bib-0011)。`ML-Flux` 是一个两阶段 ML\
  \ 框架，采用基于深度学习的填充技术来处理同位素标记模式的可变测量值，并使用连续神经网络将完整的同位素模式转换为代谢通量（图 12.7 和 表 12.1）。\n\
  \n为了理解 `ML-Flux` 框架，从描述第二阶段 ML 模型开始会有帮助。该模型是一个全连接前馈 ANN，输入代谢模型中所有代谢产物的同位素标记模式，并输出线性独立的自由通量。利用线性代数和网络解空间知识扩展自由通量，从而产生通过代谢模型的完整通量分布。这种方法确保了不会产生冗余的通量预测，并确保所有代谢产物符合质量平衡。\n\
  \n![图 12.7 基于 ML 的 MFA 示例工作流。实验标记数据组织成所有测量代谢产物的 MID 堆叠数组，输入到 PCNN 模型中，该模型填充未测量代谢产物的同位素标记模式。完整的同位素模式信息输入到\
  \ ANN 中以预测自由通量。使用线性代数，自由通量揭示了全面的代谢通量图。](img/c12f007.png)\n\n图 12.7 基于 ML 的 MFA 示例工作流。实验标记数据组织成所有测量代谢产物的\
  \ MID 堆叠数组，输入到 `PCNN` 模型中，该模型填充未测量代谢产物的同位素标记模式。完整的同位素模式信息输入到 `ANN` 中以预测自由通量。使用线性代数，自由通量揭示了全面的代谢通量图。\n\
  \n使用 `ANN` 的一个问题是，通量预测要求同位素标记的全面测量，这在技术上具有挑战性。为了弥补实验测量之间的差距，`ML-Flux` 使用了另一个部分卷积网络（`PCNN`）。由于同位素标记比例的值于\
  \ 0 和 1 之间，类似于图像中的灰度像素，`PCNN` 已用于修复（修复图像受损的部分）。\n\n用于通量预测的两阶段 ML 平台展示了深度学习如何简化从实验测量标记模式的定量分析。`ML-Flux`\
  \ 的结果显示了前景，因为通量预测只需一步完成。`ML-Flux` 的明显优势是其速度和易用性。先进 ML 架构的发展及其在 MFA 中的应用将进一步提高精度和速度。\n\
  \n### 12.4.5 动态通量和同位素标记分析\n\n动态代谢通量分析 (`DMFA`) 跟踪随时间变化的代谢状态，而经典 MFA 映射稳态。在分批和补料培养中，细胞代谢在整个过程中并不保持不变。因此，需要\
  \ `DMFA` 将通量分析扩展到更多现实应用中。\n\n`DMFA` 假设代谢处于准稳态；过程动态发生的时间尺度慢于细胞内变化的时间尺度。例如，考虑一个培养*大杆菌*以产生乙酸的补料反应器。胞外环境随着葡萄糖的消耗和乙酸的产生而改变。细胞代谢响应并调整这些变化。\n\
  \n研究代谢系统动力学的两种常用技术是平均通量法和分段通量法。平均通量法提供了一种获取分为不同阶段的代谢快照的方法。计算平均传输通量并实现在每个阶段的标准 MFA\
  \ 中。这种方法的缺点是通量没有时间分辨率。为了确定时间分辨率通量，使用了样条拟合、移动平均和多项式拟合等平滑技术，随后在狭的时间间隔内连续应用 MFA。或者，通过在时间段使用分段线性通量函数，分段通量法能够对时间序列数据进行拟拟以确定通量\
  \ [\\[52\\]](#c12.xhtml#c12-bib-0052)。\n\n进行 `DMFA` 的另一种方法是动态建模与 MFA 的混合。这种混合方法是一种准动态分析，它将一系列稳态\
  \ MFA 模型与代表生物化学网络动力学的微分方程组 (`ODEs`) 结合。MFA 方程涵盖了具有未知动力学性质的反应，而 `ODEs` 包含已知参数的反应。随着时间分辨率和动力学细节的增加，`DMFA`\
  \ 的计算需求变得非常巨大。\n\n\n\n\n\n一种深度学习架构——物理信息神经网络（PINNs），是一类受物理定律约束的神经网络。受到已知动力学约束的 PINNs\
  \ 能够比传统求解器更快地求解常微分方程（ODE），因此可用于解决代谢通量分析（DMFA）问题。PINNs 使得在同时考虑生物学和反应扩散定律的情况下，研究伤口愈合的动力学成为可能\
  \ [41]。另一种可能应用于 DMFA 的机器学习方法是长短期记忆网络（LSTM）。LSTM 模型是一种循环神经网络（RNN），旨在学习序列化数据中的长期依赖关系。LSTM\
  \ 模型已被证明可以使用多变量输入进行过程监测和控制，预测过程变量的实时数据 55 。因此，LSTM 可用于根据同位素标记模式的时间演化来预测动态通量。\n\n\
  ## 12.5 未来展望\n\nMFA 为生物技术和医学提供了定量且可操作的见解 56。研究人员正在应对日益复杂的生物系统，例如微生物群落 57 和基因组规模代谢网络\
  \ (58, 59)。代谢网络复杂性的增加需要 MFA 的新范式。此外，通过质谱（MS）或核磁共振（NMR）进行代谢物测量的实验限制，为解析大型模型中的代谢通量带来了挑战。\n\
  \n为了进一步提高复杂系统中通量的定量分析，开发专门为解决生物问题（包括代谢通量）设计的机器学习算法至关重要，而不是借用为其他设计的算法。由于黑箱算法阻碍了同位素标记模式与通量之间关系的解释性，因此需要解释人工智能（XAI）方法，这样我们才不会盲目依赖机器学习的预测\
  \ 60。通过揭示复杂数据集中的模式和关系，机器学习在 MFA 中的应用提供了对代谢内部机制的直觉。结合新知识，开发复杂的机器学习模型将充分实现下一代 MFA\
  \ 及其在确定代谢异质性细胞群（如微生物群落和多细胞生物体）通量方面的全部潜力。\n\n![图 12.8 未来展望。广泛的通量确定将提供受益于生物科学不同应用领域的定量见解。](img/c12f008.png)\n\
  \n图 12.8 未来展望。广泛的通量确定将提供受益于生物科学不同应用领域的定量见解。\n\n在实验方面，新型同位素示踪的使用和对代谢物的全面测量将推动通量分析扩展到中心碳代谢之外。氮示（例如使用\
  \ ¹⁵N 标记的谷酰胺）已用于癌症研究、神经科学、免疫学以及肠道微生物的氨基酸和核苷酸代谢制图 (61, 62)。一旦攻克了 ¹³C 和 ¹⁵N ，随着代谢物检测和定量的进步，其他同位素示踪剂如\
  \ ²H、¹⁸O 和 ³⁴S 将拓宽 MFA 的视野。我们谨慎地认为，人工智能将补充生物化学和分析化学的进步，成为改进定量分析、传递新知识以及推进生物技术和医学的变革性工具（图\
  \ 12.8）。\n\n## References\n\n1. Tohato, Y., Ikuta, K., Shionoya, A. et al. (2013).\
