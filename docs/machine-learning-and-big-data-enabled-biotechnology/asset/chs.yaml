  \ Approaches for the Development of Genome-Scale Metabolic Network Models\n\nEmma\
  \ M. Glass()\n\n¹University of Virginia, Department of Biomedical Engineering, 415\
  \ Lane Road, Charlottesville, VA 22904, USA\n\n²University of Virginia, Department\
  \ of Biochemistry & Molecular Genetics, 1415 Jefferson Park Avenue, Charlottesville,\
  \ VA 22908, USA\n\n## 2.1 Introduction\n\nMetabolism is a system of biochemical\
  \ pathways that convert nutrients into energy, complex biomolecules, and waste;\
  \ together these conversions enable essential cellular functions for growth and\
  \ homeostasis. Consequently, improving our understanding of how metabolism affects\
  \ phenotypes for cellular function and growth can have important implications for\
  \ health and disease. Two distinct but complementary approaches are often taken\
  \ when studying metabolism: deep characterization of individual biochemical pathways\
  \ as well as broad characterization of a whole metabolic system. A systems approach\
  \ can be particularly valuable for linking the mechanisms of individual reactions\
  \ and pathways to whole metabolic systems, probing the cellular genotype–phenotype\
  \ relationships and guiding disease treatments.\n\n\n\n\n基因组规模代谢网络模型（GSMs），如第 1\
  \ 章所示，是分析各种生物体代谢状态的宝贵工具。GSMs 是一种表示生物体代谢网络的数学框架；它们利用一组基因-蛋白质-反应（GPR）规则构建，这些规则是根据生物体的全基因组序列以及该生物体所有代谢反应的化学计量质量平衡矩阵制得的。从基因组测序数据生成代谢模型有一套通公认且标准的协议，包括以下四个主要步骤：(1)\
  \ 初步重构，(2) 重构精炼，(3) 将重构转换为兼容格式，以及 (4) 网络评估 [\\[1\\]](#c02.xhtml#c02-bib-0001)。在重构和整理之后，可以将高通量组学数据（如蛋白质组学、转录组学和代谢组学）与重构的网络相结合，以创建具有增强生物学合理性和预测能力的上下文化模型（图\
  \ 2.1）。\n\n第一个 GSM 是于 1999 年为机会性细菌病原体*流感嗜杆菌*手动创建的 [\\[2\\]](#c02.xhtml#c02-bib-0002)。到\
  \ 2019 年，在仅仅二十年后，已经通过手动方法和自动化计算流水线创建了超过 6000 个 GSM [\\[3\\]](#c02.xhtml#c02-bib-0003)。然而，在过去的五年里，自动化\
  \ GSM 工具的爆炸式发展导致了多个大型 GSM 集合的发表，包括通过重构和分析组装肠道生物体（AGORA1） [\\[4\\]](#c02.xhtml#c02-bib-0004)（773\
  \ 个 GSM），AGORA2 [\\[5\\]](#c02.xhtml#c02-bib-0005)（7302 个 GSM），PATHGENN [\\[6\\\
  ]](#c02.xhtml#c02-bib-0006)（914 个 GSM），EMBL GEMs [\\[7\\]](#c02.xhtml#c02-bib-0007）（5587\
  \ 个 GSM），MetaGEM [\\[8\\]](#c02.xhtml#c02-bib-0008)（447 个 GSM），以及最近的 APOLLO [\\\
  [9\\]](#c02.xhtml#c02-bib-0009)（247092 个 GSM）。目前，包括 APOLLO 资源在内，已有超过 25 万个原核和真核细胞\
  \ GSM，导致了与人类健康相关的新发现。例如，来自 AGORA1 和 AGORA2 集合的 GSM 已用于发现肠道微生物与结直肠癌之间的联系 [\\[10\\\
  ]](#c02.xhtml#c02-bib-0010)，阐明微生物肠道综合病群中代谢是如何被调节的 [\\[11\\]](#c02.xhtml#c02-bib-0011)，预测人类肠道中个性化的短链脂肪酸产生图谱\
  \ [\\[12\\]](#c02.xhtml#c02-bib-0012)，*烟曲霉*菌株对肺部微生物的生长依赖性 [\\[13\\]](#c02.xhtml#c02-bib-0013)，以及许多其他临床相关应用。这些示例突显了\
  \ GSM 在解决重要生物医学问题上的巨大影响。\n\n![图 2.1 从测序数据到能够模拟代谢表型的全功能网络模型的 GSM 开发通用流程示意图。R = 反应，Ex\
  \ = 交换反应。](img/c02f001.png)\n\n图 2.1 从测序数据到能够模拟代谢表型的全功能网络模型的 GSM 开发通用流程示意图。R = 反应，Ex\
  \ = 交换反应。\n\n在本章中，我们将首先介绍从基因组测序数据手动或自动构建全功能网络模型（GSM）的流程。然后，我们将概述用于构建 GSM 的工具。最后，我们将讨论该领域的应用以及未来方向。\n\
  \n2.2 手动创建 GSM\n\n从基因组测序数据生成 GSM，需要考虑 GPR 规则。并非所有基因与其相应的酶都有一一对应关系。例如，多个基因可以编码多个亚基并聚合成一个蛋白质复合体。因此，必须精确定义基因、蛋白质和反应之间的关系。\n\
  \n在基因组学出现之前，这些反应是通过实验研究确定的：从生物体中分离出酶并证明其功能。然而，现在利用基因组学工具，我们现在基于 DNA 序列同源性对全基因组进行功能注释。\n\
  \n在确定 GPR 关联并确定要纳入 GSM 的代谢反应后，我们使用反应的化学计量系数构建化学计量（S）矩阵。由于很少生物体具有广泛的实验衍生信息，现在的 GSM\
  \ 构建高度依赖基因注释。`S`矩阵的列代表单个反应，行代表每个化合物，`S`矩阵中的值对应于反应中每个化合物的化学计量系数。`S`矩阵的结构允许存储化学信息和网络信息，并解释网络内部反应是如何相互连接的。通常，`S`矩阵表示一个拓扑非线性反应图：可逆反应中的节点之间存在联合反应。一旦完成，`S`矩阵代表了生物体的连接反应网络。\n\
  \n通过`S`矩阵的形式重构生物网络，我们可以直接计算与细胞表型相关的可能网络状态。细胞受到自然法则、环境限制和物理空间的约束，限制了可能的行为范围。在我们的\
  \ GSM 中，我们可以对网络施加约束，以获得代表各种功能状态的解。通过改变我们约束的内容以及施加约束的严格程度，我们可以捕捉不同的解空间和细胞表型。\n\n\
  2.3 自动化 GSM 开发\n\n### 2.3.1 自动化 GSM 方法的通用方法\n\n近年来，基于上述手动 GSM 构建框架（界定 GPR 规则、选择反应、构建化学计量矩阵、施加约束），开发自动化\
  \ GSM 开发的方法出了大量努力。通常，自动化网络重构流水线遵循从基因组序列生成高质量草图模型的几个主要步骤：(1) BLAST 搜索，(2) 参考化学数据库，(3)\
  \ 反应纳入，(4) 填充步骤（可选）。这些自动化工具的输出可以是用于模拟的 GSM，也可以是在模拟之前可以进一步人工整理的 GSM（图 2.2）。\n\n![图\
  \ 2.2 自动化 GSM 工具的通用工作流](img/c02f002.png)\n\n图 2.2 自动化 GSM 工具的通用工作流。\n\n\n\n\n自动化\
  \ GSM（基因组规模模型）方法从原始或已注释的基因组序列开始，这些序列可以从各种公开的基因组序列数据库获得，例如 GenBank [14]、BV-BRC [15]\
  \ 和 RefSeq [16]。然后使用 `BLAST` 搜索算法将基因组与生物化学数据库进行比对，以寻找同源基因。随后，使用 KEGG [17]、BiGG [18]\
  \ 或 MetaCyc [19] 等化学反应数据库识别基因相关反应，这些数据库提供了基因、蛋白质和代谢反应之间的全面映射。将这些基因相关反应添加到草稿 GSM\
  \ 中。通常情况下，仅基于基因相关反应构建的草稿 GSM 会存在网络漏洞，导致通路连通性受，最终导致错误的模拟和预测。为了纠正这些错误，某些自动化 GSM 构建方法包括一个填补步骤，根据所采用的方法，以概率、基于机器学习、基于优化或基于启发的方法向\
  \ GSM 中添加反应以建立网络连通性。最终的 GSM 通常以系统生物学标记语言（`SBML`）格式或 JavaScript 对象表示（`JSON`）格式保存，因为这些是跨工具兼容的社区标准。\n\
  \n在本章中，我们将讨论自动化 GSM 开发的方法。我们将讨论从头构建（de-novo reconstruction）工具，包括从 (1) 原始基因组、蛋白质或宏基因组序列、(2)\
  \ 已注释序列、(3) 生物化学数据库以及 (4) 现有模型开始。此外，我们还将讨论几种用于修改和可视化现有 GSM 的工具。本章讨论的所有 GSM 方法汇总见表\
  \ 2.1。\n\n## 2.3.2 GSM 构建工具\n\n### 2.3.2.1 从原始序列\n\n#### ModelSEED\nModelSEED [20]\
  \ 是一种适用于原核生物的基于 Web 的自动化 GSM 重建平台。输入是组装基因组序列或 `SEED` 子系统列表。基因组序列或子系统使用子系统技术（`RAST`）进行注释。网络中每个反应的\
  \ `GPR` 关联基于 `RAST` 注释期间分配给基因的功能，随后映射到 `ModelSEED` 生物化学数据库。在 `GPR` 关联后，通过添加基因组编码的一个或多个酶以及一组不需要酶催化的自发反应生成初步重建。在构建草稿\
  \ GSM 后，通过名为“自动完成（Auto-completion）”的步骤将反应重新添加到模型。在该步骤中，添加一组最小反应使模型能够在计算机上模拟生长。\n\
  \n表 2.1 自动化重建和分析工具\n\n| 输入 | 输出 | 实现 | 填补方法 | 生物类型 | 年份 |\n| :--- | :--- | :---\
  \ | :--- | :--- | :--- |\n| ModelSEED | 组装基因组序列或 `SEED` 子系统列表 | `SBML`, Excel |\
  \ Web (带 GUI) | “自动完成”；添加最小反应集 | 原核生物 | [20] | 2010 |\n| CoReCo | 基因组序列 | `SBML`\
