  \ `Fbp` 和 `Pkt` 的表达，结合 `Pfk` 的敲除，能够有效提高 3-羟丙酸的产量。\n\n### 10.3.2 绝对代谢组学与热力学分析\n\n\
  由于化合物降解、样品制备过程中的氧化以及质谱中的离子抑制效应等因素，靶代谢组学的定量准确性并不总是精确 41。为了解决这些问题，开发了稳定同位素稀释内标法 42,43。该方法涉及向样品中加入浓度的稳定同位素标记内标（¹³C,\
  \ ²H, ¹⁵N-标记化合物），这些化合物与目标代谢物具有相同的化学结构但质量不同。通过比较测量过程中标记（内标）与未标记（内源性代谢物）化合物的信号强度比，该方法可以修正样品制备过程中离子化效率的波动和代谢物的损失，从而实现更准确的绝对浓度计算。\n\
  \n此外，通过精确测量细胞内代谢物浓度，该方法可以对代谢途径内的相对浓度和平衡进行详细评估。具体而言，分析反映能量状态的 `ATP/ADP/AMP` 比例以及追踪\
  \ TCA 循环中中间产物浓度的变化，有助于识别热力学限制的反应 44,45。将此方法与通量平衡分析（FBA）和热力学通量分析（TFA）相结合，可以明确代谢途径中的限速步骤并优化合成设计。例如，可以通过测量的绝对浓度计算吉布斯自由能，以识别具有热力学障碍的反应。这些信息随后可以整合到热力学约束模型中，以预测聚羟基乳酸酯（PHB）等产物的生物合成途径\
  \ 46。\n\n### 10.3.3 代谢通量的评价与优化\n\n到目前，我们讨论了代谢物池大小的定量方法。然而，仅分析代谢浓度不足以评估细胞内代谢通量。代谢通量分析（MFA）通过质谱测量稳定同位素的掺入来实现。通过将同位素标记模式和位置原子数据与模型中的通量分布进行比较，可以估计细胞内通量分布。MFA\
  \ 根据细胞内代谢物浓度和同位素标记是否达到稳态进行分类 47。例如，当细胞提供 [1−¹³C]葡萄糖时，稳态细胞内代谢物的同位素分布可用于确定通量。对于蓝藻和植物等自养生物，CO[2]\
  \ 是唯一的碳源，使用 ¹³CO[2] 进行标记会导致所有代谢物完全标记，使得该方法失效。相反，在假设代谢物浓度不变的情况下，对 ¹³C 的掺入进行时间序列测量。这种方法使得自养系统中的通量计算成为可能\
  \ 48。此外，在代谢物浓度动态变化的非稳态条件下，通过对模型中所有细胞内代谢物浓度进行详细的时间序列分析，可以估计代谢通量的变化 21。通过测量不同时间点的选定代谢物浓度，还可以推断整个培养期间的通量变化\
  \ 49。\n\n## 10.4 基于人工智能（AI）的代谢组学数据处理与分析\n\n\n\n\n\nAI 已成为处理和解释代谢组学数据的不可或缺工具[[50,\
  \ 51]]。主要应用之一是代谢物的鉴定和注释。通过 `MS` 进行非靶向代谢组学通常产生许多特征（质峰），这些特征必须分配给真实的代谢物，这一过程充满了不确定性，被认为是代谢组学数据处理的主要瓶颈。贝叶斯建模可以严谨地处理这种不确定性。例如，整合概率注释（`IPA`）是一种基于贝叶斯的方法，通过整合多种证据源来注释代谢组学特征[[52]](#c10.xhtml#c10-bib-0052)。在\
  \ `IPA` 中，同位素丰谱、加合物形成、色谱保留时间和已知的生物化学连接等信息被用作概率模型的输入。该方法计算给定一组光谱特征对应于特定代谢物的后验概率。`IPA`\
  \ 不仅能自动分配代谢物身份，还能量化每条注释的置信度。通过从先验概率（例如基于生物化学途径的某些代谢物的可能性）开始，并利用观测数据（`m/z` 匹配、同位素比例等）更新这些信念，算法以原则的方法完善了代谢物身份。这为每个假设的代谢物鉴定提供了置信度评分，这是传统的确定性匹配方法所缺乏的。`IPA`\
  \ 证明，结合多个证据流可以显著减少错误注释并提高代谢组学分析的一致性。在实践中，贝叶斯注释帮助研究人员关注最有可能的代谢物鉴定，并对模糊情况进行标记以进一步验证，从而简化了代谢组学中最挑战性的任务之一。此外，基于机器学习的代谢组学数据处理的最新进展以\
  \ `MS-DIAL 5` 的开发为代表[[53]](#c10.xhtml#c10-bib-0053)。`MS-DIAL 5` 是一种先进的多模态 `MS` 数据分析环境，利用基于电子激活解离（`EAD`）的串联\
  \ `MS` 进行深入的脂质结构阐明。通过引入机器学习算法分析光谱模式并预测碰撞截面值，`MS-DIAL 5` 在注释脂质结构方面达到了 96.4% 的准确率，包括\
  \ `sn-`、`OH-` 和 `C=C` 位置的分配。该平台不仅促进了脂质的详细结构表征，还整合了 `MS` 成（`MSI`）数据来绘制脂质定位图。因此，`MS-DIAL\
  \ 5` 通过增强代谢物注释的分辨力和可靠性，为 `IPA` 等贝叶斯方法提供了补充策略，最终有助于复杂生物样本中不确定性并简化代谢物鉴定。\n\nAI 在代谢组学和合成生物学中的另一个关键应用是优化代谢途径以提高产量或效率。例如，数据驱动模型可以以新的方式执行\
  \ `MFA`：不再仅仅依赖于预定义的动力学方程，机器学习可以学习从酶水平和代谢物浓度到途径通量的映射。Costello 和 Martin 证明，将 `ML`\
  \ 与丰富的时间序列多组学数据（蛋白质组学和代谢组学）相结合可以准确预测代谢途径动力学，优于传统的动力学模型[[54]](#c10.xhtml#c10-bib-0054)。他们的\
  \ `ML` 模型可以整合蛋白质组和代谢物数据，以预测途径通量随时间推移或在扰动下的变化，而无需手动推导速率律。AI 还用于推荐途径优化的基因改造。通过从先前的工程数据中学习，AI\
  \ 系统可以建议过量表达、敲除或突变哪些基因。一个著名的例子是为途径工程开发的自动推荐工具（`ART`）[[55]](#c10.xhtml#c10-bib-0055)。该工具使用\
  \ `ML` 在 `S. cerevisiae` 中迭代设计和评估途径步骤[[56]](#c10.xhtml#c10-bib-0056)。AI 的另一个令人兴奋的应用是发现新途径。在这种情况下，团队利用序列数据训练了\
  \ `ML` 模型（支持向量机，`SVMs`）来预测苄喹类碱[[57]](#c10.xhtml#c10-bib-0057)。候选酶（一种芳香乙醛合成酶和苯基丙酮酸脱羧酶）具有功能性，导致了此前缺失的关键中间体的产生。这一案例说明了\
  \ AI 驱动的洞察结合代谢组学验证如何扩展超出自然限制的途径。总之，AI 方法论通过预测途径行为、引导基因干预甚至发明新路线，赋予了途径优化能力，而这一切都得到了代谢组学数据的告知和验证。\n\
  \n## 10.5 代谢组学及其分析的未来方向\n\n基因组学、转录组学和蛋白质组学的公开数据集促进了大规模元分析，带来了新的见解。然而，由于样品制备方案的差异、实验处理的不同以及由离子抑制效应导致的定量不一致，代谢组学数据在不同实验室和实验批次之间的比较和整合更具挑战性。为了克服这些挑战，样品处理自动化进展、采用绝对定量方法以及数据库平台的增强至关重要。例如，研究表明，样品预处理的自动化显著提高了重复性，这从相对标准差值确保了充分的一致性可以看出[[58]](#c10.xhtml#c10-bib-0058)。未来自动实验室系统可能适用于基于代谢组学的菌株工程[[59]](#c10.xhtml#c10-bib-0059)。此外，正在开发用于代谢组学的高质量\
  \ ¹3C 标记内标，以提高定量准确性[[60]](#c10.xhtml#c10-bib-0060)。进一步的技术进步和这些方法的广泛应用有望提高代谢组学数据的整体质量（图\
  \ 10.3）。\n\n![图 10.3 代谢组学及其分析未来方向的概念概述。样品制备自动化、使用 ¹3C 标记内标提高定量水平以及公共数据库的扩展是增强数据质量和重复性的核心。这些先进技术与稳健的分析和“学习”平台相结合，将实现更全面的跨实验室比较和大规模元分析。](img/c10f003.png)\n\
  \n\n\n\n\n# 图 10.3 代谢组学及其分析未来方向的概念概述。\n\n样本制备的自动化、使用`¹³C`-标记的内标以提高定量准确性，以及公共数据库的扩展，是提高数据质量和可重复性的核心。将这些进展与稳健的分析平台和“学习”平台相结合，将实现更全面的跨实验室比较和大规模元分析。\n\
  \n此外，近期基于质谱（MS）的指纹图创新为代谢组学分析提供了广阔的未来方向。例如，一项关于通过`MALDI-TOF`质谱指纹图进行基因组规模基因本体预测的研究表明，机器学习模型（如`SVM`和`random\
  \ forest`算法）可以从高通量质谱数据中快速准确地预测基因功能[61]。该方法应用于综合酵母敲除库时，不仅实现了基因的功能注释，还突显了优化生物生产底盘选择的潜力。通过将快速质谱指纹技术与机器学习算法相结合，此类预测性方法为更全面、自动化和标准化的工作流铺平了道路。随着更多高质量代谢组学数据集被存公共数据库[62–77]（表\
  \ 10.2），跨实验室和大规模比较分析将变得越来越可行，进一步加深我们对细胞代谢的理解。\n\n## 表 10.2 代表性代谢组学相关数据库。\n\n| 名称\
