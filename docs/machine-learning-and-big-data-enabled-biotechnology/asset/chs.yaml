  - 111\n\n### [Unknown]\n- 将 GO 术语预测作为输出\n- 使用在远程同源检测任务上预训练的 `transformer` 层\n- 81\n\
  \n\n\n\n\n此外，我们回顾了如何利用深度神经网络根据定义良好的分类命名方案（EC 编号和 GO 术语）对酶的功能进行分类，并展示了按代表性深度神经网络架构分类的深度学习模型。然而，尽管付出了许多努力，使用深度学习预测\
  \ EC 编号和 GO 术语仍存在根本局限性，代表性不足的 EC 编号和 GO 术语类别的数据不平衡限制了预测精度。这些挑战是不可避免，但为了在现实应用中实现更稳健、更可靠的酶功能预测，必须解决这些问题。随着生物大数据的增长，利用人工智能进行酶功能预测的趋势已转向整合多种生物资源和蛋白质。这种方法已被证明在预测组学水平的蛋白质各种属性（包括功能）方面高效\
  \ [79]。此外，通过利用生成性模型的特性（如幻觉效应），酶工程策略正将其领域扩展到非天然酶空间，在其中工程酶与天然酶的序列相似性较低，但保留了相同或相似的结构和功能特性\
  \ [112–117]。这些创新变革正推动生物学进入新阶段，通过酶功能预测加速酶工程的进展。\n\n## 致谢\n\n本章节通过扩展我们最近在《Trends in\
  \ Biotechnology》上发表的综述论文（doi: 10.1016/j.tibtech.2025.03.003）编写而成 [118]。我们将涵盖范围从酶功能预测的经典方法扩展到了最先进的深度学习模型，强调了由深度学习进展驱动的预测方法的演变和未来方向。这项工作得到了由韩国科学与信息通信部支持的国家研究基金资助“引领生物制造业的先进合成生物学源技术开发”项目（RS-2024-00399424）的支持。该研究还得到了韩美合作研究基金（KUCRF）的资助，该基金由大韩民科学与信息通信部和福利部资助（资助号：RS-2024-00468410）。\n\
