  \ <mrow> <mi>i</mi> <mo>=</mo <mn>1</mn> </mrow> <mrow> <mo stretchy=\"false\">|</mo>\
  \ <msub> <mi mathvariant=\"bold\">c</mi> <mi>j</mi> </msub> <mo stretchy=\"false\"\
  >|</mo> </mrow> </msubsup> <msub> <mi mathvariant=\"bold\">x</mi> <mi>i</mi> </msub>\
  \ </math>\n```\n\n并重新分配观测值，直到满足停止准则——数据点分配不再发生进一步变化，或者簇内距离总和达到最化。\n\n聚类已用于不同的目的\
  \ [56, 57]：根据代谢谱对微生物菌株进行分类，帮助选择生物生产的最优候选者；区分酶促反应，有助于识别新的生物合成途径；以及对质谱数据中的代谢产物进行分组，以区分核心代谢途径和潜在的副产物。然而，聚类方法具有某些局限性。例如，它们通常根据所有可用特征对分子实体进行分组，这可能会隐藏仅存在于特定特征子集中的关系。此外，在硬聚类结构中，每个实体被限制在一个组中，尽管它们可以根据生物学功能参与多个组。这些缺点可以通过双聚类（biclustering）来解决，使其对于识别协同调控模式具有价值\
  \ [58]。\n\n### 11.3.3.2 双聚类\n\n双聚类起源于基因表达数据分析 [59]，是一种独特的聚类技术，可以同时对观测值和变量进行分组，因此通常被定位为模式发现方法。该问题也称为子空间聚类，旨在识别一组双聚类，使得每个双聚类\
  \ `B`[`k]` 都满足特定的感兴趣标准。为了引导这些双聚类的形成，通常采用同质性标准，通常通过使用优势函数来实现 [60]。给定的双聚类 `B` = (`I,\
  \ J`)，其中 `I` 和 `J` 分别是观测值和变量的子集，通常由其模式 `ϕ[J]` 表征，即给定变量上的期望值。可以追求不同类型的同质性，包括：\n\n\
  *   全局恒常，如果对于所有 `x[i]`   `I` 和 `y[j]`   `J`，`a[ij]` = `μ`+ `η[ij]`，其中 `μ` 是典型值，`η[ij]`\
  \ 是观测噪声；\n*   变量恒常，即观测值上的模式，如果 `a[ij]` = `μ[j]`+ `η[ij]`，其中 `μ[j]` 代表变量 `y[j]` 中的期望值；\n\
  *   相加性（乘法），如果对于所有 `i` ∈ `I` 和 `j` ∈ `J`，`a[ij]` = `μ[j]`+ `γ[i]`+ `η[ij]` (`a[ij]`\
  \ = `μ[j]`× `γ[i]`+ `η[ij]`)，其中 `μ[j]` 是变量 `y[j]` 中的期望值，`γ[i]` 是对观测值 `x[i]` 的调整；\n\
  *   变量保序，如果存在 `J` 变量的排列 `π[J]`，在该排列下，`I` 中每个观测值的值序列是严格递增的。\n\n除了同质性外，双聚类搜索还可以整合统计显著性标准\
  \ [61] 以确保双聚类的出现偏离零模型下的预期，以及差异性标准 [62] 以防止冗余。\n\n在生物技术中，双聚类有许多应用，包括识别协同调控途径和发现相似途径\
  \ [63]。双聚类可以为推定的调节模块提供宝价值的见解，并了解微生物或工程菌株如何适应不同环境 [64, 65]。\n\n### 11.3.3.3 表征学习与降维\n\
  \n降维（DR）侧重于减少数据集特征的数量同时保留大部分信息 [67]。降维技术通常分为两种方法：特征选择和特征提取。特征选择根据特定标准（如最小化信息损失或最大化预测能力）识别特征子集，通过过滤技术、嵌入方法和封装模型实现\
  \ [68]。相比之下，特征提取通过转换或组合现有特征产生新特征，通常通过非线性变换。常用的降维技术之一是主成分分析 (`PCA`)，因为它通过最少的维度捕捉最大方差来降低数据集维度\
  \ [69]。生成的 `k` 个维度（主成分）是原始维度协方差矩阵特征向量的线性投影，解释方差根据相应的特征值计算![sigma-summation Underscript\
  \ j equals 1 Overscript k Endscripts lamda Subscript j 2 2 slash-summation Underscript\
  \ j equals 1 Overscript n Endscripts lamda Subscript j 2](img/c11-i0008.png)\n```\n\
  <math display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  ><msubsup><mo>&#8721;</mo> <mrow><mi>j</mi> <mo>=</mo <mn>1</mn></mrow><mi>k</mi></msubsup><msub><mi>&#955;</mi><mi>j</mi><mn>2</mn></msub><mo\
  \ stretchy=\"false\">/</mo><msubsup><mo>&#8721;</mo> <mrow><mi>j</mi> <mo>=</mo\
  \ <mn>1</mn></mrow><mi>n</mi></msubsup><msub><mi>&#955;</mi><mi>j</mi><mn>2</mn></msub></math>\n\
  ```\n其中 `k` ≤ `m`。\n\nt 分布随机邻域嵌入 (`t-SNE`) 和均匀流形近似投影 (`UMAP`) 等降维技术也特别适用于可视化复杂多维数据中的相关性并选择变量\
  \ [70–72]。\n\n它们被一致地表征细胞类型和状态，包括区分应激细胞 [73] 和健康细胞与疾病细胞 [74]。最近，它们也被应用于分类细胞为高产细胞或低产细胞\
  \ [75]。\n\n\n\n\n\n表示学习通过利用自编码器和变分推断等 DL 技术进行特征提取，为经典的 DR 方法提供了一种替代方案 [[76]](#c11.xhtml#c11-bib-0076)。它正越来越多地应用于代谢工程中，用于获取复杂数据的数值表示（嵌入），例如高维、多层、时间序列性和/或成像数据。表示学习已用于从代谢反应中学习嵌入以预测新的生物合成途径、从蛋白质序列中学习嵌入以预测酶活性（新型生物催化剂）、从多组学数据中优化微生物菌株，或从上下文相关的基因型数据中预测菌株表型\
  \ [[77]](#c11.xhtml#c11-bib-0077)。\n\n## 11.3.4 混合 ML 与基于约束的模型\n\n分析高维生物学数据的一种有前景的方法涉及机理建模方法的整合\
  \ [78, 79]，例如广泛使用的 `FBA` 方法（关于 `CBM` 的全面回顾，请参见 [[80]](#c11.xhtml#c11-bib-0080) 和\
  \ [[81]](#c11.xhtml#c11-bib-0081)），结合 ML 方法。混合 `ML/CBM` 方法将先进的 `ML` 技术（无论是监督或无监督学习范式）与机理\
  \ `CBM` 方法（此处称为 `FBA` 方法）相结合，以探索两种形式的协同效应和机会 [[27]](#c11.xhtml#c11-bib-0027)。这种整合允许\
  \ `ML` 利用机理知识，最终转化为预测能力和解释性的提升，正如最近的述所示 [16, 82]。\n\n根据可用的数据类型和特定的研究目标，可以建立各种数据和知识驱动的流水线。目前，利用组学数据整合基于约束的模型和\
  \ `ML` 的不同工作流/方法可分为两大类：i) 将 `CBM-FBA` 作为 `ML` 的输入，其中使用来自高通量技术的多个数据集生成特定条件的 `CBMs`\
  \ 以获得代谢通量预测，并从中通过 `ML` 技术推断出重要模式；ii) 将 `ML` 作为 `CBM-FBA` 的输入，其中 `ML` 方法直接应用于单/多组学数据集以进行特征选择，然后将这些特征作为输入约束来构建/改进\
  \ `CBM-FBA` 模型。在本节中，我们将重点介绍这些整合研究，并提供每个工作流中涉及步骤的概述。\n\n### 11.3.4.1 CBM-FBA 作为 ML\
  \ 的输入\n\n在可用时，实验数据可以与源自 `FBA` 的通量相结合以创建多组学特征，能够预测感兴趣的目标 [[83]](#c11.xhtml#c11-bib-0083),\
  \ 84。由代谢模型生成的通量可以输入 `ML` 算法进行进一步分析。Plaimas *et al.* [[85]](#c11.xhtml#c11-bib-0085)\
  \ 为 `ML` 提供了源自 `FBA`、生物化学知识和转录组数据的描述符，以预测代谢网络中的必需酶/反应。通过采用 `SVM` 算法，该系统在预测准确性上比单独使用\
  \ `FBA` 方法有了显著提高。Vijakumar *et al.* 描述了另一种整合 `FBA` 和 `ML` 的混合流水线 [86, 87。这种新方法涉及通过将转录组数据作为约束来构建特定条件的代谢模型，然后使用多目标\
  \ `FBA` 模型进行模拟。随后， `ML` 模型在转录组数据和预测的通量谱上进行训练，能够识别不同条件下的关键基因/反应。类似地，另一种方法是将从 `pFBA`\
  \ 预测的输入通量与组学数据相结合，以提高微生物生长速率的预测能力 [[88]](#c11.xhtml#c11-bib-0088)。\n\n最近的一项创新是开发了一种将\
  \ `FBA` 直接嵌入到 `ML`（人工 `Ns`）中的混合方法 [[89]](#c11.xhtml#c11-bib-0089)。与传统的 `FBA` 需要大量的实验数据来定义培养基吸收通量不同，提出的人工代谢网络\
  \ (`AMN`) 整合了一个神经预处理层来捕捉培养基成分与吸收通量之间的关系，在不需要额外实验测量的情况下实现了准确的表型预测。通过 `CBM` 约束 `ML`，这种混合方法实现了更高的代谢通量和生长速率预测准确率，同时减少了数据需求。`AMN`\
  \ 框架还显示出更广泛的应用，包括设计基因敲除策略，因此代表了菌株工程的重大进展。此外，无监督建模策略（包括 `PCA`）也被应用于源自 `FBA` 的结果 [90,\
  \ 91]。\n\n存在许多计算方法用于数据整合，以开发特定上下文和特定条件的代谢模型 [[92]](#c11.xhtml#c11-bib-0092)。一个有趣的方向是将特定条件的代谢建模与贝叶斯\
  \ `ML` 结合，以推断代谢途径对各种环境条件的响应 [93。此外，替代 `ML` 方法（桥接监督和无监督算法）也可以与 `FBA` 结果整合，以估计 `CBM`\
  \ 的主要代谢特征 [94。\n\n虽然基于 `FBA` 方法已成功用于分析组学数据以解决每种数据类型的固有局限性，但它们需要物体的目标函数（通常未知） [95。此外，这些方法还需要若干预处理步骤来有效整合\
  \ `CBM` 与多模态数据，这是一个复杂且具有挑战性的过程 [96。\n\n### 11.3.4.2 ML 作为 CBM-FBA 的输入\n\n另一种方法是将\
  \ `ML` 的输入特征整合到基于 `FBA` 的模型中，以提高其预测能力或辅助模型构建。与其仅仅依赖 `FBA` 生成的直接通量估计，不如利用 `ML` 分析组学数据并生成数据驱动的通量边界。这些边界可以作为额外约束传递\
  \ `FBA` 模型，从而缩小解空间并提高预测的准确性。\n\n一个代表性的示例是将 `ML` 与约束规划相结合以预测代谢通量 [[97]](#c11.xhtml#c11-bib-097)。这种方法展示了\
  \ `ML` 生成数据衍生通量的能力，这些通量随后作为输入约束纳入 `FBA` 框架，从而引导预测。通过整合二次规划，该方法确保预测的通量谱满足化学计量约束，增强了结果的生物学意义。此外，`ML`\
  \ 方法还可以用于估计基因组规模的酶催化周转数（体外的 `k[cat]` 或 `k[app,max]`）以对 `FBA` 模型参数化，从而获得更准确的预测 [98。\n\
  \n\n\n\n\n此外，利用无监督学习方法为 `FBA` 公式获取额外约束的努力已显示出具有前景的成果 99。一种有趣的策略是学习表征以表征应变变异并识别代谢状态，这些特征可以被\
  \ `CBM` 进一步利用 100。同样，通过结合时间依赖的代谢组学数据的 `PCA`，成功应用非稳态 `FBA` 框架，这有助于识别线性代谢状态以预测动态条件下的代谢通量\
  \ 101。除了降维技术外，聚类方法也可以与 `FBA` 结合，对通量分布进行分组（例如 102）。\n\n图 11.1 汇总了整合 `ML` 和 `CBM`\
  \ 的主要流程。流程的选择本质上取决于所需的输出和可用数据的类型。尽管这些流程得到了成功应用，但它们仍面临多组学数据高维、低质量和异质性的挑战，通常表现出显著的不平衡和偏态形式\
  \ [103, 104]。为了克服这个问题，需要更多的研究来进一步评估将复杂数据与这些计算方法相结合的新方法。\n\n## 11.4 微生物细胞工厂设计基于机器学习的方法：案例研究\n\
  \n`ML` 的快速进展，加之日益广泛的数据收集工作，共同为克服生物技术和微生物生物制造中的挑战提供了灵活且高效的工具包。本节说明了第 11.3 节 中描述的各种计算方法如何通过参考案例研究，利用大数据来解决细胞工厂开发中的各种挑战。特别重点介绍了一些示例，以展示将\
  \ `ML` 与多次记录的实验相结合，如何促进从菌株工程、通量设计到代谢生产的各种应用。\n\n### 11.41 菌株工程和通量设计中基于机器学习的方法\n\n\
  菌株工程旨在识别遗传策略以优化微生物性能。传统上，这是通过基因的随机改变实现的，例如敲除、促进过表达的变化或引入异源途径。现代菌株工程的一个重点是迭代的 `DBTL`\
  \ 循环 105，通过获取大型数据集来评估菌株性能并指导改进方向。在这方面，`ML` 在从大数据中提取有意义的见解方面可以起关键作用，从而引导连续的菌株工程和途径设计\
  \ 106。为了加速 `ML` 驱动的菌株开发，人员投入巨大努力将这些技术整合到 `DBTL` 框架中，提高了生物生产的效率和精密度。作为第一个例子，Carbonell\
  \ 等人 107 提出了一种用于精细化工菌株优化的集成 `DBTL` 流程。该工作流集成了计算途径设计、机器人辅助 DNA 装配、高通量筛选和基于 `ML` 的学习循环，以高效构建代谢途径原型。`Design`\
  \ 阶段采用生物信息学工具进行酶选择和途径构建，随后通过机器人 DNA 装配实现 `Build` 自动化。`Test` 阶段使用高通量代谢物筛选，将结果馈入 `Learn`\
  \ 阶段，在该阶段中，`ML` 模型精炼了途径性能预测。通过利用智能采样和统计学习，这种方法显著减少了实验工作量，同时加速了菌株开发，使 (2S)-松菜皮素醇的产量提高了\
  \ 500 倍。随后，HamediRad 和同事 108 通过开发一种名为 `BioAutomata` 的自动化算法驱动平台，证明了 `DBTL` 循环中 `ML`\
  \ 驱动优化的威力。`BioAutomata` 采用贝叶斯优化来高效探索可能的基因表达水平的巨大设计空间。这种贝叶斯方法有效地平衡了设计空间的探索与对潜力区域的利用，能够在高效识别最佳基因表达水平的同时，最大限度地减少所需的实验次数。通过优化番青素生物合成途径，他们的系统评估了少于\
  \ 1% 的可能变体，但表现优于随机筛选 77%。预测模型与高通量自动化的结合能够快速发现最佳途径配置，降低了实验成本和设计复杂性。另一个有趣的例子是自动推荐工具\
  \ (`ART`) 109，这是一个基于 `ML` 的平台，它整合了概率建模和贝叶斯集成 `ML` 方法，用于在 `DBTL` 循环中系统地推荐菌株设计。通过使用蛋白表达水平或启动子组合作为输入，`ART`\
  \ 已证明能够预测目标分子的产量。`ART` 的一个重要优势在于其量化预测中不确定性的能力，允许人员识别并探索设计空间中表征不足的区域。Zhou 和合作者成功演示了用于异源代谢途径组合优化的不同\
  \ `ML` 辅助工作流（称为 `MiYA`） 110。这一创新系统将人工 `NNs` 与 `YeastFab` 装配策略相结合，以增强 `DBTL` 循环。为了证明其有效性，`MiYA`\
  \ 被应用于优化酒酵母中的两条生物合成途径以提高紫红素产量。这些研究强调了将 `ML` 算法整合到 `DBTL` 循环以加速菌株开发的巨大潜力。\n\n最近，深度\
  \ `NNs` 在理性菌株工程中显示了巨大的前景，包括通过逆向合成发现途径（即从底物到目标分子的一系列生化学反应）。Biswas 等人 111 引入了一种用于低样本蛋白工程的高效数据\
  \ `DL` 模型，利用在标记突变体上训练的 `UniRep` 框架 33，通过计算机定向进化外推 100 万 万序列的功能。他们的方法在两种不同的蛋白（`avGFP`\
  \ 和 `TEM-1 β-酰胺酶`）上进行了测试，最佳的 AI 设计候选者在单个实验周期内功能提高了高达 500%。通过利用全局蛋白质序列知识并在局部突变景观上微调表征，他们的方法与经典的蛋白工程策略相比展示了更优的泛化能力。在另一项研究中，Segler\
  \ 和同事 112 使用了基于蒙特卡洛树搜索 (`MCTS`) 的逆向合成系统，该系统整合了深度 `NNs` 和符号人工智能来预测小有机分子的合成路线。他们的系统包含三个\
  \ `NNs`：引导搜索的扩展策略、评估反应可行性的过滤网络以及用于估计最佳逆向合成步的采样网络。该模型基于 Reaxys 数据库（[www.reaxys.com](http://www.reaxys.com)）的\
  \ 1240 万条反应进行训练，显著优于传统的基于规则的逆向合成规划，解决的问题数量是以前方法的两倍，速度快了 30 倍。\n\n\n\n\n其他多种允许对基因表达进行精确控制和途径优化的策略也可以通过\
  \ `ML` 进行增强。一种典型方法涉及通过修改启动子（promoter）和 RBS 元素来微调基因表达。在这方面，`ML` 已被以数据驱动的方式引导启动子和\
  \ RBS 序列的设计，这是理性途径工程中调控基因表达的常用策略。例如，Meng *et al.* [[113]](#c11.xhtml#c11-bib-0113)\
  \ 证明了 `NNs` 在定量设计控制基因表达的关键元件（如启动子和 RBS）方面的强大。在这项研究中，一个 `NN` 从一个包含 100 个突变 `Trc`\
  \ 启动子和 RBS 序列的库中训练，捕捉了广泛的表达强度。该模型在训练和测试数据集上均实现了高相关系数，表明其具有很强的预测准确性。最近，`ML` 还被用于优化化学生产的多基因途径。例如，Jervis\
  \ 及其同事 [[35]](#c11.xhtml#c11-bib-0035) 实施了一种 `ML` 引导的方法（使用 `SVM` 和前馈 `NNs`）来优化 *E.\
  \ coli* 中生化途径的翻译控制。该方法在甲羟戊酸途径上得到了验证，这是一条通往单萜生产的九步代谢途径。通过分析一个包含 5184 个成员的 RBS 库，他们的模型在仅筛选该库的\
  \ 3% 的情况下，准确预测了高产的途径变体。将该策略应用于重组单萜生物合成途径时，产物浓度提高了 60% 以上。最后这两个例子展示了系统地整合高通量菌株构建、测试和\
  \ `ML` 以优化多步途径、提高滴度和物产率的潜力。然而，这些策略依赖于建立广泛的突变菌株库，这限制了 `ML` 在具有成熟遗传工程工具和方案的微生物中的适用性。一种可能的替代方法是将一个在可用\
  \ mRNA 表达数据上训练的 `NN` 输入到多目标优化器中，例如非支配排序遗传算法-II (`NSGA-II`)。Kang 及其同事 [[114]](#c11.xhtml#c11-bib-0114)\
  \ 利用这种方法识别了最优菌株设计，结果证明能够提高番茄红素浓度，减少了对大型库的需求。虽然在菌株工程背景下探索较少，但 `RL` 在优化菌株性能方面具有巨大的前景。作为一种概念证明，Sabzevari\
  \ *et al.* [[115]](#c11.xhtml#c11-bib-0115) 引入了一种多智能体 `RL` 方法，并在 *Saccharomyces\
  \ cerevisiae* 的组合菌株库上进行了验证，专注于增强 L-色氨酸的生物合成。他们的结果强调了基于 `RL` 的菌株优化的潜力，减少了对尝试方法的依赖。\n\
  \n利用大规模数据结合 `ML` 和 `CBM` 方法也出现在菌株工程和通量设计（即基因靶的选择及其随后的优化）中。例如，Kim 及其同事 [[84]](#c11.xhtml#c11-bib-0084）引入了一个\
  \ *E. coli* 多组学整合和预测建模的综合框架。他们开发了一个整合 649 种条件下 4389 个全基因组谱的多组学汇编，包括转录组、蛋白质组、代谢组和通量组数据。利用这一资源，他们构建了一个多尺度预测模型。\n\
  \n基于 `ML` 的方法也被用于从酶或基因表达数据获取通量学信息 [[116]](#c11.xhtml#c11-bib-0116)。例如，Oulia 及其共同作者\
  \ [[117]](#c11.xhtml#c11-bib-0117) 应用 `DL` 技术根据 *Entamoeba histolytica* 中的酶水平预测代谢通量。在他们的研究中，他们证明了在通过合成数据生成的\
  \ 68950 个实例的大数据集上训练的深层 `NN` 模型优于经典的 `ML`。同样，Costello *et al.* [[118]](#c11.xhtml#c11-bib-0118)\
  \ 引入了一种 `ML` 方法从时间序列多组学数据预测代谢途径动力学。\n\n\n\n\n代谢生产涉及利用微生物从可再生生物资源中合成高价值化合物，如药物、生物燃料和工业生化品。在在微生物宿主内设计并构建生物合成途径后，工作重点转向了增强目标化合物的代谢生产。此外，扩大微生物细胞工厂中生物工艺的规模对于成功的商业化至关重要。虽然传统方法依赖于试错法，通常效率低下且耗时，但基于机器学习（ML）的方法通过分析大型数据集来预测代谢生产，并随后优化发酵条件，从而加速了这一过程。文献中的几项研究报告了应用基于机器学习的方法增强代谢生产的进展\
  \ [39, 44]。例如，Colletti *et al.* [\\[121\\]](#c11.xhtml#c11-bib-0121) 和 Varman *et\
  \ al.* [\\[122\\]](#c11.xhtml#c11-bib-0122) 开发了纯机器学习模型，根据生物合成步骤数、培养条件和遗传修饰等输入参数，先验估计工程化\
  \ *E. coli* 和 *S. cerevisiae* 菌株的化学生产率。这些回归模型准确预测了产物产量，为发酵过程提供了重要指导。另一项研究通过神经网络（NN）回归器结合遗传算法（GA），研究了\
  \ *Debaryomyces nepalensis* 在生物反应器中增强的木糖醇生产 [\\[123\\]](#c11.xhtml#c11-bib-0123)。使用包含先前时间点的温度、pH、氧气传递速率、生物量和甘醇浓度等发酵变量的数据集，训练了神经网络模型来预测生物量生长和木糖醇产量。通过将这些预测因子与遗传算法结合，他们优化了发酵条件，证明了\
  \ ANN-GA 优于回归-GA，将木糖醇产量从 59.4 g/L 提高到 65.73 g/L。\n\n其他方法通过将代谢建模与机器学习相结合，利用大规模数据提高高价值化合物的代谢生产，也显示出可靠的结果。例如，Zhang\
  \ *et al.* [\\[124\\]](#c11.xhtml#c11-bib-0124) 集成了 CBM (FBA) 和机器学习模型以优化酵母中的色氨酸代谢。通过采用\
  \ CBM，他们识别了关键的代谢工程目标，并构建了一个由多种启动子组合控制的潜在菌株设计组合代谢途径库。为了便于高通量表征，他们开发了一个生物传感器筛选系统，从\
  \ 500 多种不同的菌株设计中生成了超过 124000 个基于荧光的实验时间序列数据点。该数据集整合了基因型数据、生长概谱和生物传感器输出，随后被用于训练机器学习算法（EVOLVE\
  \ [\\[125\\]](#c11.xhtml#c11-bib-0125) 和 ART [\\[109\\]](#c11.xhtml#c11-bib-0109)），成功预测了优化的代谢途径。获得的结果表明，这种混合方法与最佳初始设计相比，色氨酸滴度高出多\
  \ 74%。在另一项研究 [\\[126\\]](#c11.xhtml#c11-bib-0126) 中，将混合机器学习框架与基因组规模代谢模型整合，以评估微生物工厂的性能。以\
  \ *E. coli* 为例，作者从约 100 篇研究文章中手动整理了一个包含 1200 个工程菌株的数据集，包括关键遗传修饰、生物工艺条件以及 20 多种不同化合物（包括琥酸、L-乳酸和异丁醇）的生产指标。然后，通过\
  \ FBA 模拟增强该数据集，他们生成了额外的代谢特征。采用集成机器学习技术，他们证明了基于滴度和产量预测菌株性能具有很高的交叉验证准确性。同样，Czajka\
  \ 和同事 [\\[127\\]](#c11.xhtml#c11-bib-0127) 引入了一种结合知识挖掘、CBM 和机器学习的集成框架，利用基因表达数据和环境条件预测\
  \ *Yarrowia lipytica* 的有机酸、萜类等产量。尽管该框架显示了前景，但其成功取决于广泛数据的可用性。\n\n最近，2020 年，开发了一种新型混合机器学习/CBM\
  \ 方法用于控制补料中的营养可用性 [\\[128\\]](#c11.xhtml#c11-bib-0128)。Schinn 和合作者开发了一种集成 CBM 与机器学习的方法来预测\
  \ CHO 细胞培养中的代谢物谱。通过利用具有不同生长和生产能力的 CHO 克隆的生物工艺数据，他们训练了代谢模型来估计氨基酸摄取率。然后，通过应用回归模型，他们修正了代谢预测的系统偏差，并实施了指数函数以扩展预测。他们的方法正确预测了\
  \ 8 天培养期的氨基酸消耗动态，准确率高达 86%，实现了生物反应器的营养预测控制。\n\n在多组学整合背景下，Zampieri *et al.* [\\[129\\\
  ]](#c11.xhtml#c11-bib-0129) 采用多组学机器学习方法预测 CHO 细胞的乳酸产生，将基因表达数据与代谢模拟相结合。通过基于 127 个\
  \ CHO 培养的基因表达重建特定条件的基因组规模代谢模型，他们使用 FBA 估计了代谢反应速率。然后，通过应用 PCA 和弹性回归等机器学习方法，他们完善了代谢预测并训练了广义线性模型来预测不同生物工艺条件下的乳酸产量。在另一项研究中，开发了\
  \ *Pseudomonas putida* 的 CBM，纳入基因表达数据和 FBA 以预测鼠脂醇合成 [\\[90\\]](#c11.xhtml#c11-bib-0090)。随后将统计学和机器学习技术应用于\
  \ FBA 生成的通量分布，以识别增加鼠脂醇产生的生物标志物和代谢途径。\n\n无监督方法也被用于提高微生物系统中目标化学品的生产。例如，Morris *et\
  \ al.* [\\[130\\]](#c11.xhtml#c11-bib-0130) 提出了一种专注于多元关联的无监督大数据分析流程，用于识别代谢抑制剂和促进因子，以优化\
  \ CHO 细胞培养单隆抗体（mAbs）的生产过程。通过将该分析流程应用于补料生物反应器条件下代谢组数据，作者识别了影响生产的关键代谢物。这种分析使得重点代谢物排序，随后用于代谢通路富集研究，以更好地了解它们在生产力中的作用。\n\
  \n\n\n\n\n本章涵盖了基于机器学习（ML）的方法在解决代谢工程中持续挑战方面的重大进展，展示了大数据如何彻底改变工业生物技术。为此，我们首先建立了该领域描述性建模和预测性建模技术的基础，并阐述了实验研究设计和数据预处理的关键原则。我们特别关注了机器学习与现有方法（包括\
  \ `CBM` 和 `DBTL` 循环框架）之间的协同作用，以充分挖掘混合方法在代谢工程中的变革性潜力。\n\n我们探讨了菌株工程、通量设计和代谢生产中的真实案例研究，形成了一幅关于基于机器学习的方法如何驱动创新的全景，并在可能的情况下特别关注了其影响的量化。\n\
  \n尽管监督学习和无监督机器学习立场带来了机遇，但在充分探索多模态数据源、大多数实验的纵向特性、新兴的表型技术（例如 `single-cell multi-omics`、细粒度分子结合活性）以及不断发展的\
  \ `DL` 进展方面，挑战仍然存在。此外，设计“最佳”的基于机器学习的方法并非易事，它关键取决于目标问题的特定性和可用数据。在此背景下，预计会有更广泛的努力转向系统比较和基于机器学习流水线的自动化\
  \ [[132]](#c11.xhtml#c11-bib-0132)。此外，由于机器学习算法在超出给定数据训练范围的推断方面可能存在局限性，关注模型的泛化能力（例如\
  \ `uncertainty-bounded estimates`）是确保它们适用于未见的内源性-外源性因素组合的关键，这也是优化代谢系统时的紧迫需求。\n\n\
  ## 展望\n\n预计未来几年，`Deep Learning`（深度学习）方法在代谢工程领域的渗透将加强 [[133]](#c11.xhtml#c11-bib-0133)。深度生成模型（例如\
  \ `GANs`、`VAEs`）可用于引导提高代谢产物产量的新菌株设计。基于注意力的模型具有捕捉代谢输入与通量之间复杂关系的潜力。序列到函数的模型可以利用 `transformer`\
  \ 架构来设计合成调节元件。像 `AlphaFold` 和 `ProtGPT2` 这样的 Transformer 已经在帮助酶设计以增强代谢途径。最后，`DL`\
  \ 架构通过循环层结构等手段捕捉生物过程固有的动态特性，以及使用 `graph NNs` 捕捉复杂的多层关系的能力，使其成为直接从纵向研究产生的原始多变量时间序列数据中学习的理想候选，而无需繁密的特征工程。\n\
  \n`Transfer Learning`（迁移学习）可以利用来自相关任务或生物体的知识来提高预测和描述能力（例如 [[134]](#c11.xhtml#c11-bib-0134)）。范例包括：从表征良好的生物体（例如\
  \ `E. coli` 和 `S. cerevisiae`）中迁移学习到的表示，以预测研究较少的生物体的代谢功能；在模拟或实验途径数据上对预训练模型，以预测不同条件或菌株下的途径性能；或者对在一种条件（如需氧生长）的\
  \ `fluxomics` 数据上训练的模型进行微调，以预测不同培养条件或生物工艺设置下的通量。\n\n作为补充，`Multitask Learning`（多任务学习，`MTL`）可以通过跨任务共享知识来同时解决多个相关的预测任务（例如\
  \ [[135]](#c11.xhtml#c11-bib-0135)），从而利用协同效应提高模型的泛化能力和性能。`MTL` 可以通过跨任务共享知识来解决多个相关的预测任务，从而利用协同效应提高模型的泛化能力和性能。\n\
  \n我们进一步期望社区通过 `Self-Supervision`（自监督）引入代谢领域 [[136]](#c11.xhtml#c11-bib-0136))，然后可以对其进行掩码处理。同样，可以通过掩码来学习\
  \ `embeddings`（嵌入）。\n\n最后，`DL` 架构通过循环层结构等手段捕捉生物过程固有的动态特性，以及使用 `graph NNs` 捕捉复杂的多层关系的能力，使其成为直接从纵向研究产生的原始多变量时间序列数据中学习的理想候选，而无需繁密的特征工程。\n\
