  \n\n\n\n一旦建立起不同结构的人工神经网络（ANN）并对数据进行了适当划分，就可以开始训练。在训练 ANN 时，有若干选择需要根据具体情况进行，例如包括引入正则化项、训练轮数（epochs）、批大小（batch\
  \ size），以及最后用于训练 ANN 的优化算法。\n\n可以在训练目标函数中添加正则化项以减少或消除不必要的参数并避免过拟合 94。正则化项存在多种变体，包括\
  \ L1 和 L2 正则化，它们分别对 ANN 参数的绝对值和 ANN 参数值的平方进行惩罚 95。例如，在 MAE 损失函数中引入 L1 正则化项会得到如式\
  \ 14.9 所示的目标函数：\n\n```\n(14.9) min_{w,b} 1/n ∑_k ∑_t |λ_k(C(t), u(t), w, b) - θ_k(t)|\
  \ + λ_L1 ∑_q |w_q|\n```\n\n其中 `L1` 是惩罚权重，可以通过增加该权重以牺牲 ANN 拟合效果为代价对权重进行更大的惩罚。同样，在\
  \ MAE 损失函数中添加 L2 正则化项会产生如式 14.10 所示的目标函数：\n\n```\n(14.10) min_{w,b} 1/n ∑_k ∑_t\
  \ |λ_k(C(t), u(t), w, b) - θ_k(t)| + λ_L2 ∑_q w_q²\n```\n\n轮数（Epoch number）和批大小（batch\
  \ size）指的是数据输入训练算法的方式。批大小决定了在更新 ANN 参数之前每批处理多少个数据点 96。在训练数据集太大而无法在单次迭代中处理的情况下，可以从完整训练数据集的大小中缩小批大小\
  \ 97。轮数简单是指优化算法查看整个数据集的次数 96。因此，增加轮数可以提高 ANN 对训练数据的拟合能力，但代价是计算时间变长和过拟合风险的增加。早停（Early\
  \ stopping）是一种正则化形式，它评估已训练 ANN 在验证集上的性能，并在满足停止准则时终止训练 98，从而避免因使用过多轮数导致的过拟合。\n\n\
  训练 ANN 通常涉及反向传播 99，它利用链式法则计算损失函数相对于 ANN 权重和偏置的梯度。目前存在多种用于 ANN 的工具，其中之一是 Python 包\
  \ `PyTorch` 100，在其中可以选择不同的损失函数、正则化项（以及权重）、批大小和轮数。\n\n### 14.2.4 混合模型不确定性估计\n\n量化不确定性是过程模型开发中的重要一步，通过评估其预期精度为预测置信度提供宝贵的见解。这意味着不确定性分析可以被视为模型验证的一种形式\
  \ 101，尽管它经常被忽视，因为验证集上过高的模型不确定性可能是训练数据集过拟合的标志 102。虽然某种程度的不确定性不可避免的（特别是在生物系统中），但最小化模型不确定性有助于优化控制策略的发展，例如\
  \ QbD 方法论中使用的策略。\n\n\n\n\n在混合建模的背景下，最具不确定性和影响力的参数已经通过机器学习模型进行了回归，随后可以假设混合模型的不确定性主要源于数据驱动模型。不确定性估计的一种方法是自助法（bootstrapping），这在机器学习中广泛应用于量化不确定性并提高模型的稳定性和健壮性\
  \ [103, 104]。自助法涉及使用训练数据集的不同随机样本来训练多个独立的机器学习模型。然后将每个模型与机理部分相结合，形成各自的混合模型。拥有多个混合模型而非一个意味着生成了多个状态变量轨迹；对不同轨迹进行采样有助于计算量化模型不确定性的置信区间。\n\
  \n自助的数据采样可以是完全随机的，也可以遵循某种策略；之前的一项研究在进行自助法时，对于每个模型的训练，都消除了实验时间范围内预定时间段内的所有数据 [105]。模拟系统在给定持续时间内经历信息缺失的情景，有助于评估模型对不完整数据期间的泛化能力，例如工业生物工艺中的传感器失效并需要固定的修复跨度的情况。需要注意的是，使用高斯过程（GPs）来模拟机器学习组件而非神经网络（ANN），对不确定性分析有益，因为它们可以自动生成随时间变化的参数的置信区间，从而生成整个混合模型的置信区间。然而，由于缺乏显式的模型结构，GPs\
  \ 并不总是容易实现，且不适用于高维输入系统，如第 14.1.2.3 节所示。\n\n## 14.2.5 混合模型构建的考虑\n\n构建混合模型时有多种选择。本节简要概述了构建混合模型过程中可以考虑的一些关键因素，特别是当使用\
  \ `ANN` 作为机器学习组件时。\n\n### 14.2.5.1 混合模型的灰度（Greyness）\n\n混合模型的“灰度”是指混合内部白盒建模与黑盒建模的比例。目前不存在用于量化“灰度”的指标；但我们知道相对于初始模型设计，“灰度”是在增加还是减少。例如，实施更多的机理知识将向“灰度”尺的“白”端移动。尽管混合模型的“灰度”会因情况而异，但一项研究不同混合模型“灰度”影响的研究发现，引入特定的机理知识可能会增加向模型引入错误归纳偏的风险\
  \ [69]，这意味着只有在高度置信的情况下才应引入机理知识。\n\n### 14.2.5.2 差异混合建模\n\n混合建模并不总是需要机器学习模型来模拟随时间变化的参数；差异混合模型（discrepancy\
  \ hybrid models）获取机理部分的输出并用数据驱动部分对其进行修正，类似于 GB EL。例如，当应用于公式 14.2a–14.2c 中描述的机理模型时，差异混合模型将呈现为公式\
  \ 14.11a–14.11c 所示的形式：\n\n\n\n\n\n(14.11a)!$\\frac{dC_X(t)}{dt} = \\mu_{max} \\\
  cdot \\frac{C_S(t)}{C_S(t) + K_S} \\cdot C_X(t) - \\mu_d \\cdot C_X(t) + e_X(C(t),\
  \ u(t), w, b)$ (images/c14-math-0021.png)<math display=\"block\" overflow=\"scroll\"\
