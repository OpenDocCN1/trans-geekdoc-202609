  \ 组成。此外，对于 CNN 无法分类的 EC 号，DeepEC 使用 `DIAMOND` 实现同源性分析。2023 年，DeepECTransformer 发布，它在神经网络中使用\
  \ transformer 层进行预测 38。与 DeepEC 相比，它涵盖了更多的 EC 号，并采用了线性层 `BERT` 架构 39。改进后的架构能够更好地预测训练集中低同源性的酶，且对同源性分析的依赖程度比\
  \ DeepEC 低。\n\n最后，CLEAN 模型（2023）将 EC 问题从多标签分类重构为对比学习框架 40。它利用从 `ESM-1b` pLM 获取的蛋白质表示和前馈神经网络（`FFNN`）。通过在其学习框架中使用基于距离的预测，使其能够更准确、更可靠地预测\
  \ EC 号，特别是对于研究较少或标记错误的酶等情况，其表现一直优于传统的分类模型。许多此类基于 EC 的学习方法在书的第 5 章中有更详细的介绍。\n\n###\
  \ 4.2.4 酶活性\n\n酶活性是指酶将底物转化为产物的能力。酶活性通常用动力学参数表示，例如底物转化速率（`k[cat]`）、底物结合亲和力（`K[M]`）和催化效率（`k[cat]/K[M]`）。准确预测这些参数对于各种应用至关重要，包括酶工程、代谢建模和药物开发。可靠的预测可以加速生物催化剂的发现，优化合成生物学的通路设计，并减少对昂贵且耗时的实验表征的需求。\n\
  \n动力学参数预测的进展显著改进了 `k[cat]` 和 `K[M]` 的估计。2022 年，DLKcat 旨在利用蛋白质序列和底物表示进行预测，但在处理缺乏紧密同源物的酶时表现不佳\
  \ 41。2023 年，TurNuP 通过利用序列的 pLM 嵌入和底物的化学指纹，试图构建一个更具通用性的 `k[cat]` 预测器 42。UniKP 扩展了这项工作，不仅使用了来自\
  \ pLMs 的预训练嵌入，还使用了来自化学模型的嵌入 43。通过这一新框架，UniKP 被用于预测不同类型的动力学参数（如除 `k[cat]` 外的 `K[M]`），提升了所有动力学参数的性能。2024\
  \ 年，CatPred 利用了更新的序列和底物预训练嵌入、扩展的数据集以及不确定性预测，获得了更好的 `K[M]` 预测 26。我们最近还开发了 CPI-Pred，这是一个通用的框架，可以在序列和底物嵌入之间互换预训练模型\
  \ 27。有趣的是，它的最佳模型性能与 CatPred 持平，这表明仅靠模型架构的改进可能不再能驱动预测准确性的大幅提升。关键挑战在于，未来的进展可能更多取决于更高质量和更多样化数据集的可用性，而非深度学习模型本身的进一步完善。\n\
  \n### 4.2.5 蛋白质热稳定性\n\n热稳定性是指蛋白质在温度升高时保持其空间结构的能力，稳定性对于生物活性蛋白（BPes）至关重要。热稳定性低的蛋白质在生理温度下往往聚集，导致活性丧失、功能障碍或毒性蛋白聚集的形成\
  \ 44。\n\n研究人员研究蛋白质热稳定性有两种主要方法。第一种涉及预测蛋白质的熔点（`T[m]`）。`T[m]` 是 50% 的蛋白质丢失其天然结构的点，指示了给定蛋白质在整个温度范围内的稳定性。2023\
  \ 年，DeepSTABp 被用于预测给定蛋白质序列的 `T[m]` 44。该模型从热蛋白质组谱数据集中提取序列特征和物理特征，并运行预测以确定 `T[m]`。DeepSTABp\
  \ 达到了最先进（SOTA）的性能，在该回归任务上胜过了 ProTstab2。\n\n第二种方法将热稳定性视为分类问题，但由于数据集限制，是通过一组二分类模型来实现的。BertThermo\
  \ 是第一种将蛋白质在某些阈值温度（类似于 `T[m]`）之上是否保持稳定视为分类任务的方法 45。通过这种方式，有多个二分类分类器，其中每个模型的阈值温度是静态保持的。2024\
  \ 年，TemProSta 使用了类似的方法，利用了更大的数据集，并在标准基准测试（iThermo、SAPPHIRE、SCMTPP 和 ThermoPred）上优于所有其他可比方法\
  \ 46。\n\n### 4.2.6 蛋白质毒性\n\n蛋白质毒性是指蛋白质对生物系统可能产生的负面影响，可能导致有害反应。在开发基于蛋白质的疗法时，使用二分类预测方法来确定蛋白质是否有毒至关重要\
  \ 47。\n\n早期的毒性预测方法很大程度上基于模板，采用 `BLAST` 等序列对齐工具将未知蛋白质与已知蛋白质进行比较 48。这些方法虽然具有开创性，但受限于对高质量模板序列的依赖。为了克服这一点，研究人员转向基于特征的模型，从蛋白质序列中提取组成、进化和物理化学属性。一个著名的模型是\
  \ 2013 年开发的 ToxinPred 48，它为预测肽奠定了基础。\n\n最近的进展看到了无对齐方法的采用，这些方法利用了 `RNNs`、`LSTMs`\
  \ 和 `transformers` 等深度学习架构 47。特定的模型如 CSM-Toxin 48、ToxinPred 3.0 47 以及较新的 VISH-Pred\
  \ 49 利用了 `ProteinBERT` 50 和 `ESM-2` 51 等 pLM 的力量来捕捉复杂的序列模式和细微的结构特征。这些先进方法不仅提高了预测准确性，还促进了易用\
  \ Web 端工具的，这些工具可以集成到实际工作流中，最终增强了更安全、更有效的蛋白质药物的设计。\n\n### 4.2.7 蛋白质溶解度\n\n溶解度是指蛋白质在生理条件下保持溶解在溶液中的比例。在蛋白质表达中，确定蛋白质是溶解还是形成聚集对于高效生产至关重要，这在过表达蛋白中更为常见。在生产前对溶解性进行分类有助于优化选择，因为不溶性聚集会降低产量、增加纯化成本并影响功能。相比之下，溶解性蛋白质更容易纯化和用于下游应用。\n\
  \n\n\n\n\n尽管有很多用于蛋白质生产的模式生物，但大多数工作集中在预测大肠杆菌（`Escherichia coli`）中的蛋白质溶解性，因为它在工业中被广泛使用，并且拥有最多的可用数据[\\\
  [52\\]](#c04.xhtml#c04-bib-0052)。早期的方法通过支持向量机和朴素贝叶斯，从蛋白质序列预测蛋白质是否可溶（二分类任务）[\\[53\\\
  ]](#c04.xhtml#c04-bib-0053)。`PROSO` 是 2007 年首批手动策划专家特征的机器学习模型之一，例如根据物理化学性质对氨基酸进行分组，以提高预测的泛化能力。从那时起研究人员探索了改进的特征工程和更大的数据集。2021\
  \ 年，`NetSolP` 是`pLMs`的早期采用者，以微调后的`ESM-1b`模型的形式进行这些预测，并与当时的其他竞争性模型相比实现了 SOTA 性能[\\\
  [54\\]](#c04.xhtml#c04-bib-0054)。2023 年，研究人员发现氨基酸计数、相邻氨基酸之间的转换、残基沿序列的分布以及电荷和疏水性等属性之间的相关性特征具有特别的影响[\\\
  [55\\]](#c04.xhtml#c04-bib-0055)。这导致了`RPPSP`模型的开发，它利用这些特征优于`NetSolP`和早期的模型。随着对使用`pLM`嵌入兴趣的增长，2024\
  \ 年的模型`PLM_Sol` 出现，通过将`ProtT5`序列嵌入通过双向`LSTM`处理，成为了最佳预测器，并在本文写作时仍是目前的 SOTA[\\[52\\\
  ]](#c04.xhtml#c04-bib-0052)。\n\n## 4.3 工具包与基准测试\n\n### 4.3.1 开源工具概述\n\n**数据集与数据库**\
  \ 在过去的十年中，大规模数据集已广泛用于许多功能预测机器学习任务。对于蛋白质，`UniProt` [\\[8\\]](#c04.xhtml#c04-bib-0008)\
  \ 是最为人知且使用的数据库。它包含了蛋白质序列、其天然宿主生物的信息，以及来自`PDB`数据库的 3D 结构等补充数据[\\[58\\]](#c04.xhtml#c04-bib-0058)和/或预测模型如`AlphaFold`[\\\
  [59\\]](#c04.xhtml#c04-bib-0059)。`UniProt`通常还托管其他蛋白质功能标签，例如动力学信息、`GO`以及指向外部数据库如`STRING`的\
  \ PPI 链接[\\[60\\]](#c04.xhtml#c04-bib-0060)。在酶空间，`BRENDA` [\\[61\\]](#c04.xhtml#c04-bib-0061)\
  \ 在提供功能性酶信息方面起着重要作用。表 4.2 中列出的许多其他数据集和数据库也经常用于序列到功能的预测流水线中。\n\n表 4.2 用于序列到功能预测任务的数据集，来源已链接至数据库/数据集名称。\n\
