  \ Urbana, IL, 61801, USA\n\n## 6.1 引言\n\n### 6.1.1 计算机辅助合成规划\n\n20 世纪 60 年代年代，计算机辅助合成规划（`CASP`）的概念由\
  \ E. J. Corey 首次提出 [1]，旨在从反应数据库中学习合成逻辑并为目标分子生成合成路线。`CASP` 涉及使用逆向合成工具系统地拆解目标分子，直到达到市售化合物\
  \ [2–5](#c06.xhtml#c06-bib-0005)]。这是一个复杂的过程，包含了多个任务，例如单步合成、多步搜索算法和排名系统。逆向合成过程始于选择合适的训练数据库。USPTO\
  \ [6 数据库是反应训练和基准测试的常用资源，而 Reaxys [7 数据库是一个包含文献反应的商业数据库。对于单步合成，主要使用两种方法：基于模板的方法和无模板的方法。这些方法决定了如何从单步反应的目标分子中预测前驱体。\n\
  \n在基于模板的工具中，反应模板可以通过从反应数据库中提取反应模式，或者通过领域专家的输入来策划反应规则来构建。在提取模板时，通过识别反应中心来捕捉反应物和产物之间的结构变化，形成一组反应规则。这些规则随后被用于预测新反应的前驱体。相比之下，无模板工具通过训练模型直接从目标分子预测前驱体，而不依赖于预定义的反应模板。由于查询反应与现有模板之间存在结构相似性，基于模板的工具通常能产生更准确的前驱体，而无模板工具能够实现领域外预测，扩展了可能合成途径的范围。本章讨论的基于机器学习的方法总结见表\
  \ 6.1。\n\n### 6.1.2 逆向生物合成\n\n近年来，逆向生物合成工具的发展非常迅速 [2–5](#c06.xhtml#c06-bib-0005)]。通常，逆向生物合成遵循与逆向合成相同的原理，但由于生物合成途径的独特性，在某些方面有所不同。\n\
  \n第一个主要区别在于生物反应数据库的可用性，这些数据库规模远小于化学反应数据库，仅包含化学数据库中约 10% 的数据点。常用的生物反应数据库包括 BRENDA\
  \ [28、KEGG [29、MetaCyc [30、SABIO-RK [31] 以及各种集成数据库 [32]。为了解决数据限制，一种解决方案是数据增强，如 `BioNav`-11](#c06.xhtml#c06-bib-0011)\
  \ 所示。另一个区别是生物反应涉及代谢产物，如 `Retrobio`-8](#c06.xhtml#c06-bib-0008)] 所示。另一个区别是合成路线通常在达到市售化合物时终止。但在逆向生物合成中，某些算法使用\
  \ `NovoStoic`-33](#c06.xhtml#c06-bib-0033)。\n\n## 6.2 逆向生物合成工具\n\n通过逆向生物合成进行途径发现是一个复杂的过程，涉及单步合成、多步搜索和排名系统。在本节中，我们将讨论用于途径发现的各种人工智能/机器学习工具。对于单步反应，有两种主要方法：基于模板的方法和无模板的方法。我们将介绍两种方法的代表性工具。在预测单步反应后，整合多步搜索。最后，排名系统提供列表。\n\
  \n### 6.2.1 基于模板的工具\n\n在基于模板的工具中，反应模板可以从数据库中提取，也可以由人工专家策划（见图 6.1](#c06.xhtml#c06-fig-0001)）。在提取模板时，首先选择合适的数据库。对于酶反应，数据库条目通常包括反应物、产物、酶以及辅因子。反应物、产物和辅因子被表示为\
  \ `SMILES` [34]，而酶使用酶学（EC）编号进行分类。接下来，通过识别反应物和产物之间的差异来形成反应模板。反应模板存储为 `SMARTS` [35]，当输入新的目标分子时，可以使用模板预测前驱体。此外，与模板相关的酶可以作为参考。酶反应的一个挑战是缺乏统一数据库且存在冗余或相似反应。一种可能的解决方案是使用集成数据库，如\
  \ `BKMS`-36](#c06.xhtml#c06-bib-0036)，它整合了来自 BRENDA [28、KEGG [29、MetaCyc [30] 和\
  \ SABIO-RK [31] 的数据。\n\n表 6.1 用于人工智能/机器学习驱动的逆向合成中途径发现、酶选择和优化的关键计算方法和工具总结。\n\n| 方法/算法\
