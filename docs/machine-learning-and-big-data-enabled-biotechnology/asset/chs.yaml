  \ |\n\n---\n\n`RetrobioCat` [\\[8\\]](#c06.xhtml#c06-bib-0008) 是一种基于模板的逆生物合成工具，使用专家策划的酶促模板进行路径探索。该工具将文献中的酶反应汇编到内部数据库中，根据酶类型进行分类，以便模板提取和识别。通过社区驱动的平台，用户可以探索合成路线。\n\
  \n`ASKCOS` (化学酶化模式) [\\[9\\]](#c06.xhtml#c06-bib-0009) 是一种计算合成规划工具，将从 BKMS 数据库提取的酶促模板与化学合成模板相结合。该工具建立在之前的逆合成工具之上，`ASKCOS`\
  \ [\\[9\\]](#c06.xhtml#c06-bib-0009) 从 BKMS [\\[36\\]](#c06.xhtml#c06-bib-0036)\
  \ 数据库提取反应模板，并将其整合到化学酶化合成工具中。一种优先级机制从化学生物库中每一步选择模板。在化学和生物合成方法的比较中，某些路径完全是通过酶反应发现的。此外，化学酶化合成规划预测的路线比传统的化学合成规划方法更短。\n\
  \n#### **基于模板的方法**\n\n`RetrobioCat` [\\[8\\]](#c06.xhtml#c06-bib-0008) 是一种基于模板的逆生物合成工具，使用专家策划的酶促模板进行路径探索。\n\
  \n![图 6.1 逆合成工具](img/c06f001.png)\n\n6.1 逆合成工具。(a) 基于模板的方法：从数据库提取反应。(b) 无模板方法：使用机器学习\
  \ (ML) 算法预测目标分子。(c) 多步搜索：使用搜索算法构建多步合成路线。(d) 路径排名：应用评分系统对合成路线进行排名。\n\n### 6.2.2 无模板工具\n\
  \n与基于模板的方法不同，无模板工具利用机器学习 (ML) 算法预测给定分子的前体（见图 6.1b）。虽然基于模板的方法在设计和选择反应模板后是确定的，但基于机器学习的方法具有更高的活性。分子的表示、算法的选择以及训练过程中使用的技术都影响了预测性能。反应数据库通常分为训练集、验证集和测试集，根据模型重建测试集反应的能力来评估预测性能。分子可以表示为\
  \ `SMILES` [\\[34\\]](#c06.xhtml#c06-bib-0034) 字符串或以图的形式。由于逆合成输出是化学结构，必须考虑多种因素以确保其有效性，包括成键规则、结构热力学稳定性和异构效应。为了解决这些问题，在生成最终输出之前可以使用过滤器来消除无效结构。\n\
  \n\n\n\n\n`Rxn4chemistry` [[10]](#c06.xhtml#c06-bib-0010) 由 IBM 开发，是第一个基于机器学习的逆生物合成工具。它使用\
  \ `ECREACT` 数据库 [[10]](#c06.xhtml#c06-bib-0010) 中的反应进行训练。化学品被表示为 `SMILES` 并被标记化为一个端到端的\
  \ Transformer 架构，以用于正向和反向合成预测。值得注意的是，为了扩大数据集并将化学知识整合到模型训练中，它通过多任务迁移学习包含了来自 `USPTO`\
  \ [[6]](#c06.xhtml#c06-bib-0006) 化学数据库的反应。在 `Rxn4chemistry` 网站上，如果无法通过酶途径找到逆合成路线，则会建议一条补充的化学路线。作为第一个基于机器学习的逆合成工具，`Rxn4chemistry`\
  \ [[10]](#c06.xhtml#c06-bib-0010) 在其发表的工作中展示了具有前景的结果，同时也识别了一些错误的预测，凸显了其局限性以及进一步改进的空间。\n\
  \n另一个基于机器学习的工具 `BioNavi-NP` [[11]](#c06.xhtml#c06-bib-0011）专注于天然产物合成。考虑到生物反应数据有限的问题，`BioNavi-NP`\
  \ 实施了数据增强技术。具体而言，它使用 `DNP` 数据库表示天然产物，并计算 `USPTO` [[6]](#c06.xhtml#c06-bib-0006)\
  \ 数据集中反应与 `DNP` 数据集中化合物之间的分子相似性。相似性高的反应被添加到训练集中，扩展数据库后观察到了性能增强。\n\n### 6.2.3 搜索算法\n\
  \n在逆合成中，某些工具关注单步合成，旨在实现高可重性和准确性。然而，为实际应用和工业级合成设计完整的合成路径需要多步合成路线（图 6.1c）。由于每个目标分子可能有多个预测的前驱体，可能的合成路线数量随着步骤的增加而呈指数级增长。因此，多步合成算法不能简单地将单步反应连接起来，必须平衡路线质量和计算效率。从目标分子开始，可以生成各种候选前驱体。为了降低计算成本，每一步都选择最有前景的前驱体进行扩展。在此过程中，会评估并比较每种反应的可靠性和有效性。可靠性通常取决于与已知反应模板或既定反应规则的相似程度，而有效性可以使用合成复杂度评分进行评估，该部分将在第\
  \ 2.4 节中详细讨论。在这些评估之后，选择下一个节点进行扩展，该过程一直持续到达到市售的化合物为止。\n\n`MCTS` [[37]](#c06.xhtml#c06-bib-0037）是一种广泛使用的决策算法，根据概率探索确定最佳下一步。在逆合成中，`AiZynthFinder`\
  \ [[12]](#c06.xhtml#c06-bib-0012) 是第一个将 `MCTS` 应用于逆合成规划的工具，遵循选择、扩展、模拟和反向传播的过程。在这个框架下，选择一个初始分子进行扩展。通过模拟探索搜索树，评估每个分支以根据概率和可行性确定其是否通向可行的起始原料。\n\
  \n`Retro*` [[11]](#c06.xhtml#c06-bib-0011) 是另一种遵循最佳优先搜索的多步逆合成方法。它将逆合成问题结构化为 `AND-OR`\
  \ 树，其中分子代表 `OR` 节点，反应步骤代表 `AND` 节点。`Retro*` 利用学习到的值函数引导节点选择，优先考虑高质量路径。每一步都选择统计学上有利的前驱体。\n\
  \n### 6.2.4 排名\n\n对合成路线进行适当排名在扩展搜索树的过程和展示最终合成路线列表的过程中都关重要。由于可以预测出多条合成路线，可靠的评分系统有助于用户选择最佳方案（图\
  \ 6.1d）。在合成路线排名中，可靠性代表对预测反应的置信度，通常由模板与反应之间的相似性来衡量。此外，由于正向反应预测的准确性通常高于逆合成规划，可以使用正向反应预测器来验证结果并识别潜在的副反应。逆合成的有效性可以定义为预测路线是否通向可用化合物，已经开发了几种评分指标来评估这一方面。\n\
  \n最为人知的指标是 `SCScore` [[13]](#c06.xhtml#c06-bib-0013)，它引入了用于排名的合成复杂度概念。该评分系统基于合成复杂度概念。具体而言，分析反应中的反应物和产物，产物在合成上比反应物更复杂。所有化合物根据其合成复杂度在\
  \ 1 到 5 的梯度上进行分类。在路线排名中，倾向于选择从合成更复杂的分子到简单分子的反应，并累积分数以确定给定路线的整体合成复杂度。\n\n`SCScore`\
  \ [[13]](#c06.xhtml#c06-bib-0013)广泛应用于逆合成，`RetrobioCat` [[8]](#c06.xhtml#c06-bib-0008)和\
  \ `Rxn4chemistry` [[10]](#c06.xhtml#c06-bib-0010)都利用它进行路线排名。在实际应用中，必须考虑其他因素，包括原料的成本、合成路线的总成本、每步的产率以及试剂的毒性。为了实现更全面的评估，可以从在线文献提取相关数据并分配不同的权重。\n\
  \n另一方面，`SAscore` [[14]](#c06.xhtml#c06-bib-0014）评估化合物是否易于合成，承认某些复杂结构可以通过简单的反应形成。这种方法涉及对\
  \ `PubChem` 数据库中的分子进行碎片化，并在易合成的子结构在数据库中出现频率更高的假设下计算碎片评分。此外，通过在 `SAscore` 计算中对这些结构施加惩罚分，考虑了复杂的分子特征（如环和立体中心）。\n\
  \n\n\n\n一旦通过逆向生物合成为目标分子设计了生化途径，那么为该途径选择合适的酶对于确保途径中的每一步都具有可行性和高效性至关重要 [38]。与传统的合成化学不同，化学催化剂可能提供广泛的反应性，而酶具有高度的特异性、区域选择性和立体选择性，这使得它们在以最少副反应合成复杂分子方面具有特别价值。此外，为给定的转化识别合适的酶可以确保整个过程的效率。在本节中，我们将提供关于如何利用\
  \ AI/ML 工具进行酶的选择和优化的高层概述和深入的技术细节。我们关注四个关键方面：预测酶的底物特异性和催化效率、工程化具有改进性质的酶变体，以及从头（*de\
  \ novo*）设计新型酶（图 6.2）。这些方法补充了第 4 章和第 5 章中描述的酶发现工具。\n\n![图 6.2 酶选择与优化的概述。酶选择始于已知酶的数据库，并对其底物特异性和催化效率进行评估。在酶工程中，候选酶通过优化进行精炼以增强其性质。同时，*de\
  \ novo* 酶设计利用生成式 AI 创建针对特定底物或反应的新型酶结构和序列。](img/c06f0022.png)\n\n图 6.2 酶选择与优化的概述。酶选择始于已知酶的数据库，并对其底物特异性和催化效率进行评估。在酶工程中，候选酶通过优化进行精炼以增强其性质。同时，*de\
  \ novo* 酶设计利用生成式 AI 创建针对特定底物或反应的新型酶结构和序列。\n\n### 6.3.1 酶底物特异性\n\n底物特异性是指酶识别并作用于特定底物的能力。在逆向生物合成中，选择酶是确保反应可行性的关键步骤。传统上，酶的选择依赖于序列相似性，使用\
  \ `BLAST` [39]、`BRENDA` [28] 或 `UniProt` [40] 等数据库。虽然这些方法有用，但基于序列的模型可能会忽略酶的活性差异。AI/ML\
  \ 通过学习复杂的酶-底物相互作用增强了预测能力。超越基于 EC 编号的酶分类，需要基于序列的底物特异性预测模型来预测酶与给定底物的兼容性。许多基于 AI/ML\
  \ 方法被提出以泛化不同酶家族的酶-底物相互作用。`enzyme` 是一种基于序列的酶选择工具，通过对随机采样的小分子进行训练，解决了数据集不平衡的问题。这种方法整合到合成生物学工作流中，通过高斯过程预测\
  \ *in silico* 酶催化反应 [15]。Mellor 等人建立了一种基于反应指纹和酶序列相似性的高斯过程模型 [41]。该模型成功识别了涉及 *E.\
  \ coli* 的酶催化反应。总而言，基于序列的 AI/ML 预测器为筛选底物筛选酶提供了一种快速方法。最近，蛋白质语言模型（如 `ESM` [42]）显著推进了基于序列的模型的发展。酶-底物预测模型（`ESP`）采用了一种改进的\
  \ Transformer 架构来预测酶-底物关系 [16]。与依赖显式结构信息的模型不同，`ESP` 从酶序列嵌入中提取功能特征。分子-酶相互作用模型 (`MEI`)\
  \ 使用带有注意力机制的分层神经网络整合了酶序列数据和小分子原子环境 [17]，解决了酶的多功能性挑战。该模型成功预测了 `CYP450` 酶活性以及复杂塑料的酶促降解，准确率达到\
  \ 90%。当高分辨率酶结构（实验或预测的）可用时，基于结构的方法可以完善特异性预测。分子对接模拟（如 `AutoDock` [18]）长期以来一直用于评估酶-配体结合。Mou\
  \ 等将配体对接、结构建模和物理化学描述符与 AI/ML 模型（随机森林、支持向量机和梯度提升树）相结合 [43]。该方法在预测细菌腈酰酶的底物范围方面实现了\
  \ 82% 的准确率。\n\n总体而言，结合序列模式、结构建模（对接或 AlphaFold 预测的结构）以及现代 AI/ML，产生了强大的酶-底物特异性预测器。这些工具使得合成规划者能够在\
  \ *in silico* 选择可能催化给定反应的酶。\n\n### 6.3.2 酶催化效率\n\n一旦为反应的候选酶，下一个挑战是确保反应以理想的速度进行。催化效率涵盖了动力学参数（周转数\
  \ `k[cat]`、米氏 en 常数 `K[m]` 和催化效率 `k[cat]/K[m]`）以及酶转化底物为产物的难易程度。提高催化活性通常涉及理解反应能垒和酶的动力学。计算化学方法如量子力学/分子力学\
  \ (`QM/MM`) 可以明确计算酶催化反应的过渡态能量，而分子动力学 (`MD`) 模拟则揭示了酶构象变化如何影响催化 [44]。然而，这些基于物理的方法非常耗时，对于筛选大型突变库或多种酶组合是不可行的。AI/ML\
  \ 通过从实验动力学数据或高级理论计算中学习，提供了更快速的模型。通过这种方式，AI/ML 可以通过预测哪些突变或条件会提高催化效率，从而指导酶的优化。\n\n\
  \n\n\n`AI/ML` 研究的一个日益增长的领域是直接根据酶和底物的特征预测酶动力学参数。最近的深度学习模型在该领域取得了丰的成果。`CatPred` 是一个综合性的深度学习框架，旨在预测酶的\
  \ `k[cat]`、`K[m]` 和抑制常数（`K[i]`）[[19]](#c06.xhtml#c06-bib-0019)。它利用预训练的蛋白质语言模型（`pLMs`）和三维结构特征来提高泛化能力，特别是对于分布外样本（out-of-distribution\
  \ samples）。与以往泛化能力不足的方法不同，`CatPred` 引入了不确定量化技术来评估预测的可靠性。此外，`DLKcat` 结合了用于酶序列处理的卷积神经网络（CNNs）和用于底物结构表征的图神经网络（GNNs）[[20]](#c06.xhtml#c06-bib-0020）。它已应用于\
  \ 343 种酵母物的大规模 `k[cat]` 预测，并成功为酶受限代谢模型进行了参数化。`DLKcat` 实现了高预测准确性，甚至能捕捉酶突变对催化周转的影响，使其在酶工程中非常有价值。同样，Kroll\
  \ 等人开发了一种深度学习模型，通过结合分子指纹的图神经网络和酶氨基酸序列的深度表征来预测 `K[m]` 值[[45]](#c06.xhtml#c06-bib-0045)。他们的方法成功扩展到\
  \ 47 种模型生物的基因组规模预测，成为代谢建模和系统生物学的宝贵工具。\n\n集成学习技术，特别是梯度提升树，通过利用预训练语言模型和生物化学特征，在预测酶动力学参数方面展现了强劲的性能。`UniKP`\
  \ 集成了多个 `AI/ML` 模型和预训练语言模型，根据酶序列和底物结构预测 `k[cat]`、`K[m]` 和 `k[cat]/K[m]`[[21]](#c06.xhtml#c06-bib-0021)。它采用了一种基于集成的回归方法，通过系统地考虑\
  \ `pH` 和温度等环境因素，性能优于先的模型。此外，`UniKP` 结合了重新加权方法以提高高价值动力学参数的预测精度，解决了许多 `AI/ML` 模型中的一个关键局限。另一方面，`TurNuP`\
  \ 利用 Transformer 神经网络提取酶序列特征来预测 `k[cat]`，并采用差异反应指纹编码完整的反应信息[[22]](#c06.xhtml#c06-bib-0022)。与传统模型相比，`TurNuP`\
  \ 对与训练数据相似性低的酶表现出更好的泛化性。该模型已成功应用于代谢模型的参数化，改进了蛋白质组分配的预测。\n\n这些研究表明，在有足够训练数据的情况下，`AI/ML`\
  \ 模型可以作为复杂的酶动力学实验的替代方案。对于逆合成，此类模型对酶候选进行排名，不仅基于它们是否*能够*催化反应，还取决于它们可能的催化效率，将注意力集中在最具催化能力的选项上。\n\
  \n### 6.3.3 酶工程\n\n酶工程涉及修改酶以增强其性能，例如提高活性、选择性、稳定性，或改变其底物范围。在 `AI/ML` 驱动的逆合成中，一旦为某一步选择了酶，可能会对其进行工程化处理以更好地符合工艺要求（例如更高的周转率、溶剂耐受性或对底物的接受）。\n\
  \n`ML`引导的定向进化（`MLDE`）通用流程包括：\n1. 生成初始多样性库并测量活性（实验数据）；\n2. 在该数据上训练 `AI/ML` 模型（如`回归模型`或`分类器`，可能是`神经网络`）以学习序列-功能关系；\n\
  3. 使用模型提出下一组预计具有更好的变异体。然后对建议的变异体进行实验测试，收集新数据并重复该循环。通过优先考虑突变，`AI/ML` 引导的方法比贪婪地仅遵循当前最优解能更广泛地探索序列空间。这降低了错过全局最优解的风险。Yang\
  \ 等人证明了这种范式的前景，表明 `ML` 模型可以用更少的筛选迭代引导定向进化，以提高酶活性[[46]](#c06.xhtml#c06-bib-0046)。作为一个具体例子，通过训练`贝叶斯模型`引导的\
  \ `Sortase A` 演化比传统方法更高效地找到了改进的变异体[[47]](#c06.xhtml#c06-bib-0047)。同样，最近的一研究使用 `MLDE`\
  \ 方法进化出对药物中间体具有增强非对映选择性的`酮还原酶`，成功识别出高选择性变异体[[48]](#c06.xhtml#c06-bib-0048)。这些成功说明了数据驱动模型如何加速酶优化，在有效减少实验量的同时实现相同或更好的效果。\n\
  \n### 6.3.4 从头开始设计与发现酶\n\n尽管天然酶的种类不断增加，但逆合成方案有时需要尚不存在酶或现有酶效率不够高的反应。在这种情况下，*从头开始**de\
  \ novo*）设计新酶的能力——本质上是为“自然界不存在”的反应发明生物催化剂——是一个规则改变者。传统的酶工程从现有的蛋白质支架开始，但*从头开始*酶设计旨在从零创建一个酶来催化所需的反应。这是一项极其复杂的任务：它需要想象一种能够以正确的方向结合底物、稳定反应过渡态并执行必要的化学反应的蛋白质结构，同时还要折叠成稳定的、可表达的蛋白质。从头开始酶设计的早期尝试（深度学习时代之前）表明这在理论上是可能的。例如，Röthlisberger\
  \ 等人通过通过计算将理论催化基团插入稳定的蛋白质支架中，设计了一种用于 Kemp 消除反应的新酶，在随后的实验室进化后，该酶实现了可测量的活性[[49]](#c06.xhtml#c06-bib-0049)。然而，这些尝试的成功率非常低——数万个设计可能只产生一个弱活性的酶——这凸显了该问题的困难性[[50]](#c06.xhtml#c06-bib-0050)。\n\
  \n\n\n\n人工智能和计算建模的最新进展极大地提高了*de novo*（从头开始）酶设计的成功率。一个突破源于生成模型的应用，即 AI 模型被训练用于产生具有某些特定属性的新蛋白质序列或结构。研究人员现在无需手动指定活性位点的几何形状并费力地设计骨架（如传统方法所示），而是利用深度学习来“想象”新蛋白质。一个令人注目的例子是\
  \ Baker 实验室开发的“幻觉”方法，该方法利用神经网络生成满足某些设计目标的新颖蛋白质结构[51]。这种方法被用于创建与任何天然蛋白都不同的发光酶（荧光素酶）[50]。团队定义了他们所需的化学反应（荧光素底物的氧化以产生光子），然后使用深度学习算法“幻觉”出数千种可以催化该反应的可能蛋白质折叠。关键在于，这些幻觉蛋白质并不是已知酶的改良——它们是基于\
  \ AI 生成的*de novo*设计骨架构建的。在引入推定的活性位点（例如，在模型中定位一个精氨酸以稳定过渡态的负电荷）并优化序列后，合成并测试了几种设计。显著的是，至少有三个设计显示出荧光素酶活性，其中一个名为“LuxSit”的设计非常高效——发出的肉眼可见的蓝光。`LuxSit`\
  \ 的大小仅为 117 个氨基酸（比任何已知天然荧光素酶都小），并证明非常健壮（即使在接近沸点的温度下部分折叠）。这一案例原则上为几乎任何化学反应的定制酶打开了大门。\n\
  \n*de novo*酶设计的另一个革命性工具是基于扩散的蛋白质模型。`RFdiffusion` 将扩散模型（已用于生成图像和文本）的原理应用于蛋白质结构[23]。`RFdiffusion`\
  \ 被用于从头设计了一种复杂的丝氨酸水解酶，实现了与天然酶相当的催化效率[52]。该设计流程始于指定所需的反应机制：在这种情况下，通过经典的丝氨酸-组氨酸-天氨酸催化三和一个稳定中间体的氧阴离子空进行酯水解。理想活性位点的三维坐标（关键残基的排列和底物结合几何形状）被输入\
  \ `RFdiffusion`，随后生成可以包含该活性位点的整个蛋白质结构。`RFdiffusion` 的输出是一个新的蛋白质骨架（折叠），它正确定位了催化残基。然后，第二个\
  \ AI 算法（如序列设计网络 `ProteinMPNN` [24)）分配氨基酸身份以产生可行的序列，第三个程序评估每个设计在多大程度上能稳定反应机制的所有步骤。使用这种方法，团队生成了约\
  \ 1,000 个*de novo*设计并在湿实验中进行筛选，发现几个设计成功催化了整个四步水解机制，其效率与天然酶相当。这种水平的催化性能对于*de novo*设计的酶来说是前所未有的，强调了生成式\
  \ AI 方法捕获与多步反应相关的复杂催化需求的能力，而这些反应在历史上一直挑战着传统的设计方法。重要的是要认识，这一成就仍然需要迭代实验验证，即对 AI 生成的候选物进行合成、测试和优化。尽管如此，酶设计的初步选择是由\
  \ AI 系统地引导的，代表了相对于传统随机或试错策略的重大进展。\n\n除了这些特定技术外，各种用于蛋白质设计的生成模型也蓬勃发展。这些包括学习蛋白质序列潜在表示空间的变分自动编码器（VAEs）[53]、用于产生合理酶序列的生成对抗网络（GANs）如\
  \ `ProteinGAN` [25]，以及大规模语言模型如 `ProGen` [26] 和 `ProtGPT2` [27]，后者通过从数百万个天然蛋白中学习语法，可以逐字符地生成新颖蛋白质序列。这些模型可用于生成具有特定属性的蛋白质。例如，`ProGen`\
  \ 已用于根据特定的酶分类（EC 编号）或蛋白质家族创建酶序列，产生与预期功能或组别紧密匹配的蛋白质。这些 AI 生成的酶仍然需要实验验证，但它们扩展了进化采样范围之外的搜索空间。在逆合成的背景下，可以想象使用生成模型为“缺失反应”提议酶。例如，为碳-硅键的形成（一种非自然反应）设计酶活性位点，并让模型创建一个蛋白质来催化它。虽然这仍然是一个新兴领域，但已经有了概念验证的成功，AI\
  \ 设计的酶开启了完全新的生物催化步骤。\n\n尽管有了这些进展，*de novo* 酶设计仍然具有挑战性。成功通常需要产生大量的候选物，并取决于当前模型未能完全捕获的细微因素（如蛋白质动力学、溶剂效应以及某些反应对辅助因子或金属离子的需求）。然而，AI\
  \ 技术的快速改进令人乐观。荧光素酶和水解酶的案例表明，每年的成功率和酶性能都会带来数量级的提高。随着生成模型的进一步完善（例如，结合基于物理的反馈或在酶机制数据上进行训练），我们可以预计几乎任何反应的定制酶将变得可行。对于逆合成规划，这意味着即使拟定的生物合成路径存在“空白”（没有已知酶的步骤），有一天通过计算机设计新酶来填充这些空白可能会成为常态，从而将生物催化真正扩展到化学的新领域。\n\
  \n## 6.4 展望\n\nAI/ML 正在改变逆合成和生物催化，但未来仍面临许多机遇和挑战。例如：在合成路线设计中将生物催化与传统化学催化相结合、开发用于合成规划更强大的\
  \ AI 模型（包括基础模型和大语言模型）、预测酶性质和为非天然反应设计酶的进展、模型训练数据资源的标准化，以及深度学习模型解释性的改进。解决这些问题将推向计算逆合成的边界并加速可持续合成路线的发现。\n\
  \n### 6.4.1 生物催化与化学催化的整合\n\n\n\n\n\n未来，我们设想逆合成规划器能够无缝地结合生物催化和化学催化，充分利用两者的优势。例如，合成路线中的早期步骤可能最适合由高选择性的酶来完成，而后期的步骤可能需要酶无法胜任的金属催化偶。AI\
  \ 模型的开发应当考虑此类权衡，并提出混合路径 [[54]](#c06.xhtml#c06-bib-0054)。最近的讨论强调，目前的逆向合成算法很少将生物催化步骤与传统步骤结合。为了改变这一现状，需要更多关于化学-酶促反应序列的数据，以便规划器能够学习在何时插入酶催化步骤以获得最佳结果的模式。化学酶促合成已有成功案例，例如在某些药物的合成路线中，与纯化学路线相比，酶促步骤提高了产率或选择性\
  \ [[555]](#c06.xhtml#c06-bib-0055)。\n\n在实际操作中，逆向合成 AI 可能会提出一条多步路线：其中一种工程化酶将廉价的原料转化为中间体，然后通过化学方法将其与另一个片段偶联，随后是酶促拆解步骤等。此类混合路线可以产生更短、更经济的合成方案。未来，社区将受益于弥合有机化学与生物化学数据集差距的努力。这些计划可能包括扩展逆合成规则集以涵盖酶转化，并训练模型通过综合指标（例如考虑考虑化学和生物步骤的总产率、反应条件的兼容性）来评估步骤序列。在计算机中（*in\
  \ silico*）成功结合生物催化和化学催化将反映合成化学家在实验室中常用的做法——在每一步都使用“最合适的工具”，但具有 AI 提供的探索速度和广度。最终，这种整合预计将为复杂分子产生更具创意且更绿色的合成路线，超越传统逆合成的边界。\n\
  \n### 6.4.2 迈向下一代生物合成规划 AI\n\n尽管在逆合成路线预测方面已显著进展，但显然需要更强大的、专注于生物合成规划的 AI 模型。目前的许多逆合成算法（无论是基于模板的还是无模板的）都是为有机合成开发的，然后以有限的方式调整以包含生物转化。未来的模型应该从头开始就基于生物化学的基础上进行构建。一个极具前景的方向是开发用于化学和生物学的基础模型（foundation\
  \ models）——在海量反应数据或生物化学知识上训练的大型 AI 模型，可以针对特定任务进行微调。在化学领域，我们已经看到大型 Transformer 模型从数百万个反应示例中“学习”了化学知识。类似的模型可以在代谢途径网络和酶促反应上进行训练\
  \ [[10]](#c06.xhtml#c06-bib-0010)。基础模型可以编码逆合成逻辑的通用原理（例如识别分子中需要断裂的策略键），同时理解酶的限制（例如识别酶通常作用的官能团）。\n\
  \n此外，`ChatGPT` 等大语言模型（LLMs）的出现为交互式逆合成规划开启了大门。可以想象一种用于逆合成的聊天机器人，允许化学家与 AI 对话：用户可能会请求目标分子的合成计划，AI\
  \ 提出一条路线（混合化学和酶步骤）并解释其推理，用户可以提出后续的“如果……怎么办”的问题（例如更换可用的酶或考虑替代原料）。为了实现这一点，LLMs 需要被赋予逆合成知识——可能通过对关于合成方法的文本（论文、专利）进行训练来实现。这方面的早期实验已经出现，LLMs\
  \ 已被用于建议化学反应或标注路径，但要实现可靠的性能仍需大量开发工作。\n\n### 6.4.3 增强酶预测与设计能力\n\n随着逆合成规划模型变得日益先进，一个平行的需求是更强大的\
  \ AI 工具来预测酶的属性并设计新酶。拥有路线规划只是成功了一半——必须确保所选的酶能够实际执行这些步骤。我们之前讨论了 AI/ML 如何预测某些属性，以及生成式模型如何创建新酶。未来，这些能力需要被扩展并提高准确性，以实现实现针对任何反应的按需生物催化开发。\n\
  \n一个关键挑战是准确预测酶-底物对：给定一个候选酶，我们能预测它是否会接受某种底物以及速率有多快吗？目前的方法（如对接模拟或简单的序列相似性）可靠性有限，特别是对于新底物而言。此外，目前的\
  \ AI 模型主要依赖于蛋白质级别的嵌入，往往无法预测跨酶家族的催化效率。鉴于即使是单点突变也能剧改变催化性质，现有模型在迁移性和准确性方面经常面临困难，严重限制了它们的可信度。改进现有模型可能需要更多训练数据——例如各种酶-底物组合的高通量筛选结果或动力学数据，以及具有单点突变分辨率的酶——这需要社区努力共享并标准化此类数据。\n\
  \n在酶工程方面，更好的突变效应 AI/ML 模型将使在计算机中（*in silico*）优化酶变得更容易。我们预见到将更多使用大型预训练蛋白质模型（如产生残基嵌入的模型）来预测突变的影响。目前，已有计算方法利用\
  \ Transformer 模型通过分析多序列比对中的模式来预测有益突变。然而，目前的方法高度依赖于突变库的初始多样性，并在捕捉突变间的上位效应（epistatic\
  \ interactions）方面非常困难，而这种效应至关重要但在目前的建模方法中经常被忽视。未来的工具可能允许科学家设计出具有更大底物的酶，而 AI 模型输出一组预测可以扩大结合位点且不破坏酶折叠或活性的突变。\n\
  \n\n\n\n\n重要的是，为了开启真正的自然界不存在的反应，使用生成式模型的从头（*de novo*）酶设计将继续推进。在不的将来，生成式模型可能会为完全人工的反应设计酶（例如，形成在任何代谢途径中未发现的化学键）。一些研究小组已经在致力于训练以反应化学描述符为条件的生成式模型，这本质上是要求模型根据反应描述“幻化”出一种酶。我们预计\
  \ AI 设计酶的质量将提高到需要更少“设计-构建-测试”循环的程度。随着生成式模型变得越来越精通，酶设计可能成为逆向合成中的标准步骤：每当对于所需的转化没有天然酶时，逆向合成程序就可以调用生成式模型来提出一种新酶，从而有效地为规划器的工具箱添加了“虚拟酶库”。\n\
  \n### 6.4.4 数据标准化与模型可解释性\n\n`ML` 在逆向生物合成中的进展与高质量数据的可用性紧密相关。一个迫切的需求是标准化并扩展酶、反应和途径的数据库，使其采用有利于\
  \ `AI/ML` 模型开发的格式。目前，信息分散在各个资源中：`UniProt` [\\[40\\]](#c06.xhtml#c06-bib-0040) 中的酶序列和基础功能，`BRENDA`\
  \ [\\[28\\]](#c06.xhtml#c06-bib-0028) 或 `SABIO-RK` [\\[31\\]](#c06.xhtml#c06-bib-0031)\
  \ 中的详细动力学数据，`KEGG` [\\[29\\]](#c06.xhtml#c06-bib-0029) 或 `MetaCyc` [\\[56\\]](#c06.xhtml#c06-bib-0056)\
  \ 中的代谢途径，以及文献或小众数据库如 `ProtaBank` [\\[57\\]](#c06.xhtml#c06-bib-0057) 中的实验蛋白工程数据。这些许多数据库在设计时并未考虑到\
  \ `ML` ——它们可能缺乏负样本、命名不一致，或者缺少了数据集之间的关联（例如，`UniProt` [\\[40\\]](#c06.xhtml#c06-bib-0040)\
  \ 中的哪个序列对应 `BRENDA` [\\[28\\]](#c06.xhtml#c06-bib-0028) 中的哪个动力学记录）。为了构建稳健的 `AI/ML`\
  \ 模型，我们需要具有一致注释的全面数据集。例如，预测酶特异性的模型将受益于这样的数据集：该数据集列出了每种酶在标准条件下作用的和不作用的底物。实现这一点需要社区对数据架构达成共识，并在实验结果即使“失败”时也共享（以避免模型产生偏差）。未来，连接这些数据库的联合倡议（以便模型可以轻松获取关于酶的所有相关信息：序列、结构、反应、动力学、突变体等）将极大促进\
  \ `AI/ML` 的发展。\n\n最后，随着用于逆向生物合成的 `AI` 模型变得越来越复杂（具有数百万参数的深度神经网络），对可解释和可说明模型的需求日益增长。目前，许多深度学习模型都是“黑箱”——它们可能会预测使用哪种酶或进行什么突变，但不知道为什么。增加可解释性可以采取多种形式。其中一种方法是将机理知识或约束整合到模型中，使其输出遵循已知的化学规则。例如，逆向合成模型可能会受到原子映射规则的约束以确保质量平衡，或者酶活性预测器可能会突出活性位点中哪些氨基酸位置对其决策贡献最大（可能通过一种可以可视化的注意力机制）。另一种方法是事后解释：通过分析训练过的模型来提取人类可以理解的见解。例如，如果神经网络从序列预测酶功能，诸如\
  \ `saliency maps`（显著性映射）之类的工具可以识别网络认为重要的基序或残基——这些可能对应于已知的催化基序或提示新的基序。在一项研究中，一种酶家族的\
  \ `AI/ML` 分类器被设计为“生物化学可解释”，这意味着它将某些学习到的特征与已知的生物化学属性相关 [\\[58\\]](#c06.xhtml#c06-bib-0058)。这种可解释性不仅建立了信任，还能带来科学发现（例如，发现与特异性相关的新序列模式）。\n\
  \n结论是，基于 `AI/ML` 的逆向生物合成前景光明。我们预计将形成一个正反馈循环：更好的数据导致更好的模型，而更好的模型能够实现产生更有价值数据的实验。在这种计算与生物技术的协同作用中，酶——自然的催化剂——将扮演主角角色，并在能够从自然示例中学习的算法以及超越这些示例的想象力的指导下。随着集成酶化规划、强大的\
  \ `AI` 驱动设计工具以及对可解释和可信 AI 的关注，按需合成任何分子的愿景正变得日益切实。未来几年可能会见证逆向合成 AI 从聪明的助手变为合成化学和生物技术领域不可或缺的创意伙伴。\n\
