  \ 4  \n\n机器学习用于序列到功能的方法\n\n*Rana A. Barghout()*\n\n¹多伦多大学，化学工程与应用化学系，200 College\
  \ St, M5T 3E5, Toronto, ON, Canada  \n\n²Vector 人工智能研究所，108 College St, M5G 0C6,\
  \ Toronto, ON, Canada  \n\n## 4.1 引言\n\n蛋白质是生命的分子机器，其生物化学和细胞功能源于氨基酸的序列。它们可以折叠成动态的三维结构，从有序到构象柔性不等。这种关系可以用\
  \ Bepler 和 Berger 提出的“语言”类比来描述[[1]](#c04.xhtml#c04-bib-0001)：氨基酸作为化学“字母”，组合成结构元件（“单词”），当这些元件被组成句子时，就获得了功能性“意义”。\n\
  \n\n\n\n\n蛋白质序列中氨基酸的线性排列以高效率编码了其结构和功能特性 [[2\\]](#c04.xhtml#c04-bib-0002)。即使是对该序列的细微扰动（如单碱基突变）也会改变其稳定性，这凸显了仅从序列信息推断功能的困难性。克服这一挑战对于疾病研究和生物技术的应用至关重要\
  \ [[3\\]](#c04.xhtml#c04-bib-0003)。直接从序列推断蛋白质功能将改进对遗传性疾病的理解 [[4\\]](#c04.xhtml#c04-bib-0004)，并识别新的药物靶点\
  \ [[5\\]](#c04.xhtml#c04-bib-0005)。它还能够设计出具有增强能力的酶，用于化学品的合成 [[6\\]](#c04.xhtml#c04-bib-0006)和污染物的降解\
  \ [[7\\]](#c04.xhtml#c04-bib-0007)。\n\n近年来，现代测序技术使序列数据呈指数级增长。截至 2025 年，UniProt 数据库包含超过\
  \ 2.53 亿条蛋白质序列 [[8\\]](#c04.xhtml#c04-bib-0008)，但只有于 0.3%的序列具有经过实验验证的功能注释 [[9\\\
  ]](#c04.xhtml#c04-bib-0009)。这是由于实验检测耗费人力且耗时，而且容易产生偏差，对所有蛋白质的覆盖范围有限 [[10\\]](#c04.xhtml#c04-bib-0010)。测序与功能注释之间的差距，迫切需要可靠的计算方法，以便能够根据序列信息预测蛋白质功能。\n\
  \n机器学习（ML）已在从序列到功能的映射方面取得了重大突破。机器学习模型通常被建模为分类或回归任务，在原始氨基酸序列（输入）上进行训练，以准确预测功能特征（输出）。传统的机器学习方法需要对蛋白质序列进行比对或人工特征工程；因此，它们在捕捉序列与其相应功能之间复杂的高维关系方面存在局限。相比之下，现代机器学习模型可以从大型数据集中学习特征和非线性模式，使其非常适合蛋白质序列数据。深度学习（DL）模型使用神经网络作为机器学习模型的构建模块，通过对数据进行参数化变换来学习数据的新表示，并针对当前任务进行优化。最初的突破是由卷积神经网络（CNNs）驱动的，通过识别序列基序（motifs），这些基序对应于驱动蛋白质功能的催化位点或结合域\
  \ [[11\\]](#c04.xhtml#c04-bib-0011)。这些模型还与其他架构（如循环神经网络 RNNs）结合，以捕捉时间上的关系 [[12\\\
  ]](#c04.xhtml#c04-bib-0012)。最近的模型整合了 Transformer 架构 [[13\\]](#c04.xhtml#c04-bib-0013)，该架构能够捕捉长程依赖关系，并识别对进化过程中维持蛋白质功能至关重要的氨基酸序列。\n\
  \n随着机器学习越来越多地应用于序列到功能问题，两个关键优先事项是提高泛化能力和整合多组学数据。关注这些方面可以确保模型不仅在基准数据集上保持准确，而且适用于不同的生物背景。如果一个模型能够对训练集之外的未见或多样化序列做出准确预测，则被认为具有泛化能力。正如在与进化上较远的变异体的验证任务中所示，许多模型在面对非常不相似的训练数据时，性能会大幅下降\
  \ [[14\\]](#c04.xhtml#c04-bib-0014)。这凸显了将预测外推到完全未见序列空间的挑战。如自监督预训练 [[15\\]](#c04.xhtml#c04-bib-0015）和物理启发架构\
  \ [[16\\]](#c04.xhtml#c04-bib-0016）等方法有助于模型超越简单的记忆，转向上下文感知的预测。泛化能力与多组学数据的整合密不可分。生物功能很少仅由序列决定；它源于分子相互作用的级联。因此，这些模型的训练数据需要整合基因组学、转录组学、蛋白质组学、代谢组学和微生物组学\
  \ [[17\\]](#c04.xhtml#c04-bib-0017)。通过优先考虑泛化能力和多组学整合，序列到功能模型可以从狭窄的、特定基准的成功转向广泛可用的研究工具（见\
  \ 图 4.1）。\n\n![图 4.1 蛋白质序列到功能范式和机器学习（ML）方法的概述。(a) 序列到功能的范式描述了蛋白质序列如何决定其结构，结构反决定了其功能。机器学习可以促进直接预测，跳过对结构测定的需求。(b)\
  \ 序列到功能的预测应用跨越生物技术到医疗领域。(c) 机器学习方法涉及使用蛋白质序列作为输入，然后通过从基础方法到高级深度神经网络的模型进行处理。这些模型产生输出，包括表示嵌入和生化或生物物理特征的预测，并通过特定指标对性能进行评估。](img/c04f001.png)\n\
  \n图 4.1 蛋白质序列到功能范式和机器学习（ML）方法的概述。(a) 序列到功能的范式描述了蛋白质序列如何决定其结构，结构反决定了其功能。机器学习可以促进直接预测，跳过对结构测定的需求。(b)\
  \ 序列到功能的预测应用跨越生物技术到医疗领域。(c) 机器学习方法涉及使用蛋白质序列作为输入，然后通过从基础方法到高级深度神经网络的模型进行处理。这些模型产生输出，包括表示嵌入和生化或生物物理特征的预测，并通过特定指标对性能进行评估。\n\
  \n## 4.2 序列到功能的现状\n\n### 4.2.1 蛋白质功能预测：从 BLAST 到语言模型\n\n在目前常见的机器学习模型建立之前，人们提出了了许多不同的基于规则的方法。自\
  \ 1997 年以来，基本局部比对搜索工具（BLAST）和 psi-BLAST [[18\\]](#c04.xhtml#c04-bib-0018）等方法被通过在已有的蛋白质或\
  \ DNA 数据库中寻找序列相似性，通过同源性预测蛋白质功能。更新的方法包括 `DIAMOND` [[19\\]](#c04.xhtml#c04-bib-0019）和\
  \ `HHblits` [[20\\]](#c04.xhtml#c04-bib-0020)，它们显著提高了相似序列的搜索吞吐量。\n\n21 世纪初的机器学习模型使用了\
  \ k-最近邻（KNN）和支持向量机（SVMs）等算法，将功能预测视为分类问题 [[21\\]](#c04.xhtml#c04-bib-0021), [22\\\
  ]](#c04.xhtml#c04-bib-0022)。由于这些机器学习方法依赖于已建立且经过标注的数据（而这些数据往往来自有偏差的数据），它们通常无法预测分布之外的蛋白质属性，或与现有数据相似性低的蛋白质。\n\
  \n虽然监督学习推进了蛋白质功能预测，但自监督学习通过利用大量的未标记序列数据集产生了更广泛的影响。在这些技术中，掩码语言模型（MLM）已成为主导策略。在 `MLM`\
  \ 中，模型被训练利用周围上下文重建序列中随机掩码的氨基酸，从而学习丰富的表示。\n\n\n\n\n\n`TAPE` [\\[13\\]](#c04.xhtml#c04-bib-0013)\
  \ 是最早成功使用掩码语言模型（MLM）任务训练蛋白质语言模型 (`pLM`)的模型之一，证明了基于 transformer 的模型可以从蛋白质序列中编码与功能相关的信息。`ESM-1b`\
  \ 和 `ESM-2` 在较大的数据集上训练的同时，不断扩展模型深度，这在结构和功能预测方面都提供了性能提升 [\\[23\\]](#c04.xhtml#c04-bib-0023)。除了\
  \ `ESM` 之外，`ProtTrans` 套件引入了如 `ProtBERT` 等模型，它保留了基于 transformer（`BERT`）的 MLM 方法的双向编码器表示，而\
  \ `ProtT5` 则适配了 `T5` 编码器-解码器架构，以实现跨掩码（span-masking）并增强序列表示的灵活性 [\\[24\\]](#c04.xhtml#c04-bib-0024)。与\
  \ transformer 模型相比，`CARP` 采用了扩张卷积神经网络（dilated CNNs），以较低的计算成本提供了具有竞争力的性能 [\\[25\\\
  ]](#c04.xhtml#c04-bib-0025)。消融实验表明，添加 `pLM` 嵌入可以提高模型将序列映射到相应功能的能力 \\[26, 27\\]，这凸显了基于机器学习的自监督学习在推进蛋白质序列到功能预测方面的有效性（表\
  \ 4.1）。\n\n## 4.2.2 基因本体论 (Gene Ontology)\n\n为了标准化蛋白质的描述，社区在 2000 年创建了名为基因本体论 (`GO`）的词汇表，为不同数据库和研究小组中的基因和产物提供一致的注释方法\
  \ [\\[28\\]](#c04.xhtml#c04-bib-0028), [29\\]](#c04.xhtml#c04-bib-0029)]。`GO` 涵盖了基因/蛋白质功能的三个主要方面：分子功能\
  \ (`MF`)、生物过程 (`BP`) 以及细胞组分/位置 (`CC/CL`)。`GO` 结构是分级的，多个其他 `GO` 语从三个父术语分支出来，以完全封装基因产物的功能。这为分类类机器学习模型尝试为新的、未注释的蛋白质构建\
  \ `GO` “树”提供了完美的依据。\n\n2017 年，`DeepGO` 使用 `CNN` 更好地识别序列数据中的模式，并结合了多模态数据源来预测 `GO`\
  \ 注释 [\\[30\\]](#c04.xhtml#c04-bib-0030)]。`DeepGoPlus` [\\[31\\]](#c04.xhtml#c04-bib-0031)\
  \ 和 `Deep_CNN_LSTM_GO` [\\[32\\]](#c04.xhtml#c04-bib-0032) 构建了更深的网络并结合了长短期记忆（`LSTM`），导致了预测性能的提升，并允许更长的序列输入，从而实现更广泛的蛋白质分析。2021\
  \ 年，`DeepGraphGO` [\\[33\\]](#c04.xhtml#c04-bib-0033) 使用结构化 `GNN` 蛋白质表示，使其在比较 `BP`\
  \ 和 `CC` 本体论的预测时优于 `DeepGoPlus`。2023 年，`DeepGO-SE` [\\[34\\]](#c04.xhtml#c04-bib-0034)\
  \ 利用了来自 `ESM-2` 的 `pLM` 嵌入，允许模型泛化并预测大部分未见蛋白质的 `GO` 术。\n\n## 4.2.3 酶委员会编号 (Enzyme\
  \ Commission Numbers)\n\n尽管 `GO` 仍然是序列分类最大的领域，但其他指标也被其他机器学习模型预测。在微生物基因组中，酶是最常见的功能基因类之一。随后，它们的催化行为和功能通常用酶委员会\
  \ (`EC`) 编号表示。`EC` 由四个数字组成，代表酶的类、亚类、亚亚类和亚亚亚类。\n\n表 4.1 蛋白质功能预测模型：输入-输出数据源。\n\n|\
