  false\">)</mo></mrow></math>\n\n在这里，`N` 是序列长度，`V` 是词表大小（例如 DNA 为 4：A、C、G 和 T）。`y[i,j]`\
  \ 是一个独热向量，其中正确的核苷酸标记为 1，所有其他均为 0。由于损失将每个预测的对数概率乘以 `y[i,j]`，因此只有正确类别贡献（因为 1 × 对数概率被保留，而\
  \ 0 × 其他任何值均为 0）。例如，如果真实核苷酸是 A（独热标签 = `[1,0,0,0]`）且模型预测为 `[0.7,0.1,0.1,0.1]`，`Loss`\
  \ = −log(0.7) ≈ 0.36，表示预测很有信心。相反地，如果模型给所有核苷酸分配相等的概率（`[0.25,0.25,0.25,0.25]`），`Loss`\
  \ = −log(0.25) ≈ 1.39，则不确定性较高。\n\n通常，`MLM` 主要由双向 Transformer 编码器 (BERT) 模型 [86]\
  \ 使用，通过利用两个方向的上下文来预测掩码标记。这种双向方法使 BERT 模型能够学习丰富的上下文表示，对于回归和分类下游任务非常有效。当应用于 DNA 序列时，这些\
  \ BERT 模型通常包含一个额外的回归或分类“头”（放置在预训练模型之上的小型神经网络），以将学习到的表示转换为特定的预测，例如增强子活性水平。相比之下，GPT\
  \ [82] 模型采用 AR 方法，从左到右顺序预测核苷酸，从而具有生成序列的能力。因此，GPT 风格的 AR 模型适用于涉及生成的任务，例如设计新的调控元件或生成具有所需功能的序列\
  \ [46。第一个基于 DNA 的大语言模型 (LLM) 是 DNABERT [87]，它建立在人类基因组 512 个核苷酸上训练的 12 层 BERT [88]\
  \ 架构之上。之后，出现了几种 GLM，特别是 Nucleotide Transformer [86] 和 DNABERT-2 [85]。尽管这些模型都使用 Transformer\
  \ 架构，但它们在分词策略上存在差异。尽管取得了成功，Transformer 由于依赖自注意力机制，固有面临计算挑战，导致计算复杂度为 `O(n²`，其中 `n`\
  \ 是序列长度 [81]。这是因为自注意力计算序列中所有位置之间的两两交互，需要模型对所有可能的标记对计算注意力分数。\n\n为了解决这些扩展性挑战，引入了 HyenaDNA\
  \ [84]。HyenaDNA 在单核苷酸分辨率下采用 AR 下一个标记预测方法。至关重要的是，它随序列长度呈亚二次扩展，实现了 `O(n log n)` 的计算复杂度。这使其比二次\
  \ Transformer 模型快高达 160 倍。底层的 Hyena 架构支持高达百万核苷酸的输入序列，显著扩大了可以有效建模的基因上下文范围。通过将语言建模技术与监督的序列到函数预测模型相结合，HyenaDNA\
  \ 有效生成了合成 DNA 序列，其证明在于创建了功能酵母启动子和人类细胞类型特异性增强子。\n\n\n\n在这些进展的基础上，基于 `StripedHyena`\
  \ 架构的 `Evo` 模型[\\[80\\]](#c03.xhtml#c03-bib-0080)近期出现，是一种多功能方法，能够跨 DNA、RNA 和蛋白质进行序列生成和功能预测。`Evo`\
  \ 使用具有 70 亿参数、上下文长度为 `8 kb` 和 `131 kb` 的大规模数据集进行训练，展现出了令人深刻的性能。它在预测不同生物系统中的突变适应性效应方面超过了专门化模型，包括*E.\
  \ coli* 蛋白质、非编码 RNA 和调控 DNA 序列。`Evo` 的一个特别值得关注的应用是对合成 CRISPR-Cas 系统进行生成设计，例如 `Cas9`、`Cas12`\
  \ 和 `Cas13` 蛋白质。`Evo` 生成蛋白质-RNA 复合物在序列组成和结构完整性方面都与其天然对应物非常相似。此外，`Evo` 还将其生成能力扩展到整个转座元件（以\
  \ `IS605` 系统为例），产生了新颖且功能连贯的编码序列。值得的是，`Evo` 还能生成高达 `650 kb` 的基因组规模序列，显著扩大了基因组建模的范围，并为大规模生物工程开辟了新途径。\n\
  \n### 3.2.2.4 用于生物序列设计的扩散模型\n\n扩散模型近期作为强大的生成式架构出现，为生成真实的合成调控元件\\[53, 89]、长 DNA 序列[\\\
  [90\\]](#c03.xhtml#c03-bib-0090)] 和 `5^′\\-UTRs`[\\[91\\]](#c03.xhtml#c03-bib-0091)]提供了提供了对抗和基于注意力的框架的替代方案。与通过对抗训练生成序列的\
  \ `GANs` 不同，扩散模型通过学习逆转渐进式加噪过程来工作。如图 3.3b 所示，生成过程从一个真实的 DNA 序列开始，首先将其 one-hot 编码为二进制矩阵。在正向扩散过程中，高斯噪声在多个时间步中逐添加到\
  \ one-hot 编码序列中，表示为 `x*[0]` → `x*[1]` → `x*[t]`。随着噪声积累，序列的结构化模式逐渐退化，直到表示形式类似于纯噪声。从数学上讲，每个噪声序列\
  \ `x*[t]` 都是使用预定义的噪声调度 `t` 计算的，并添加了高斯噪声 `ϵ∼N(0,1)`。这一过程模拟了生物信息的丢失，将高度结构化的序列转变为充满噪声的、无信息的分布，其中每个核苷碱具有相等的概率（例如\
  \ A、C、G、T 均为 ~0.25）。这种转换由方程定义：\n\n![x Subscript t Baseline equals StartRoot alpha\
  \ Subscript t Baseline EndRoot x Subscript t minus 1 Baseline plus StartRoot 1 minus\
  \ alpha Subscript t Baseline EndRoot open e comma open e tilde script upper N left-parenthesis\
  \ 0 comma 1 right-parenthesis](img/c03-math-0008.png)<math display=\"block\" overflow=\"\
  scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\">StartRoot alpha Subscript\
  \ t Baseline EndRoot x Subscript t minus 1 Baseline plus StartRoot 1 minus alpha\
  \ Subscript t Baseline EndRoot open e comma, open e tilde script upper N left-parenthesis\
  \ 0 comma 1 right-parenthesis = StartRoot alpha Subscript t Baseline EndRoot x[t]\
  \ + StartRoot 1 minus alpha Subscript t Baseline EndRoot N(0,1)</math>\n\n逆向过程是发生生成的地方。一个神经网络（通常是\
  \ `U-Net` 或 `Transformer` [\\[92\\]](#c03.xhtml#c03-bib-0092)）被训练用于对这些随机序列去噪。模型接收噪声输入\
  \ `x*[t]` 以及当前时间步 `t`，并学习预测所添加的噪声。训练目标是最小化预测噪声与正向过程中使用的实际噪声之间的差异。\n\n\n\n\n将 DNA\
  \ 序列翻译为功能预测的深度学习（DL）模型的有效训练，需要大规模且经过良好的序列-功能数据集。这些数据提供了经验性的“地面真值”（ground truth），将特定的核苷酸模式映射到转录输出、染色质构或任何由\
  \ DNA 序列直接调控的细胞状态。因此，这些数据集对于深度学习模型学习基因调控的复杂上下文依赖规则至关重要。在合成生物学中，转录组谱数据集尤为有价值。可用数据集可大致分为两类：源于在原始染色质和调节背景下进行的全基因组分析的天然背景数据集（native-context\
  \ datasets），以及通过筛选克隆 DNA 序列插入到报告基因构建物中的活性，并质质粒或基因组整合引入细胞而生成的合成数据集（synthetic datasets）。在本节中，我们将描述代表性的天然背景数据集和合成数据集，并讨论它们各自如何助力训练适用于合成元件设计的预测模型。\n\
  \n### 3.3.1 源自基因组的天然背景数据集\n\n天然数据集源于全基因组序列，并在其原始生物学背景下进行分析。这些数据集包括原始基因组序列，以及捕获跨细胞类型和条件下特定生化活动的功能注释。大量的天然背景数据集可以通过免费资源公开获取（详情在表\
  \ 3.1 中进一步详细说明），包括 ENCODE [37（DNA 元素百科全））、GTEx [93（基因型-组织表达））、Roadmap Epigenomics\
  \ Consortium [94）、FANTOM [95（哺乳动物基因功能注释）、CATlas（顺式元件图谱）、Expression Atlas [96 以及\
  \ RegulonDB [97]。基因组注释与全基因组转录活性数据集的结合，对于训练将 DNA 序列特征（如启动子序列注释）与转录活性联系起来的深度学习模型本质重要。例如，`Xpresso`\
  \ 是一个仅基于启动子序列和与 mRNA 稳定性相关的序列特征训练的 `CNN`，用于预测人类和小鼠的稳态基因表达水平 [55]。为了训练 `Xpresso`，提取了每个基因的启动子序列（例如从\
  \ `TSS` 上游 ~7 kb 到下游 ~3.5 kb 的基因组区域），并将其转换为 one-hot 向量以馈送神经网络。每个序列都根据其来自 Epigenomics\
  \ Roadmap Consortium 和 `ENCODE` 的批量 `RNA-seq` 数据集的对应基因表达水平进行标记。另一个基于 `CNN` 的模型 `Basenji`\
  \ 使用 131 kb 基因组区域作为输入，并将基因表达 Cap 分析 (`CAGE`) 数据集作为目标，预测细胞类型特异性的 RNA 表达谱 [61]。该模型采用扩张卷积架构以能够使用大感受野，通过建模远距离增强子-启动子相互作用来改进基因表达预测。相同的数据集也被用于在\
  \ 196 kb 基因组区域上训练 `Enformer` [56]。`Enformer` 的架构将卷积块与 `Transformers` 结合，以整合来自 100\
  \ kb 的更远程相互作用的信息，在基因表达预测方面优于 `Basenji`（皮尔逊相关系数 0.85 对 0.81）。最近的进展是 `Borzoi`，这是一种\
  \ `U-Net` 风格的架构，结合了卷积层和 `Transformer` 层，从 524 kb 的基因组窗口预测 RNA 表达（皮尔逊相关系数为 0.87）[98]。`Borzoi`\
  \ 使用超过 1 万个人人类和小鼠基因组实验进行训练，包括来自 FANTOM5 联盟的 `CAGE` 数据以及来自 `ENCODE` 和 `GTEx` 的 `RNA-seq`\
  \ 覆盖轨道。使用相同的数据集，作者训练了 `Flashzoi`，这是 `Borzoi` 的增强版本，引入了旋转位置编码以在减少训练时间的同时保留或提高若干预测任务（包括\
  \ `RNA` 覆盖）的准确性 [99]。\n\n表 3.1 公开的数据库。\n\n| 数据库 | 目标 | 数据类型 | 生物种 |\n| --- | ---\
  \ | --- | --- |\n| ENCODE | 识别基因组中的所有功能元件。 | `RNA-seq`, `ChIP-seq`, `DNase-seq`,\
  \ `ATAC-seq`, `CAGE`。 | 人，小鼠 |\n| GTEx | 跨物种和发育阶段的组织和细胞特异性基因表达。 | `RNA-seq`, `eQTL`。\
  \ | 人，非人类 |\n| Roadmap Epigenomics Consortium | 原代组织和细胞的表观遗传学谱图。 | `ChIP-seq`。 |\
  \ 人 |\n| FANTOM | 哺乳动物基因组的功能注释。 | `CAGE`, `RNA-seq`。 | 人，小鼠 |\n| CATlas | 单细胞表观遗传学的顺式元件图谱。\
  \ | `ATAC-seq`。 | 人，小鼠，哺乳动物 |\n| Expression Atlas | 跨组织、物种和条件的基因和蛋白表达。 | `RNA-seq`。\
  \ | 动物，植物，真菌 |\n| RegulonDB | 关于大杆菌 K-12 转录调节的综合资源。 | `RNA-seq`。 | 大杆菌 |\n\n###\
  \ 3.3.2 合成数据集\n\n除了分析天然基因组外，`RNA-seq` 在评估合成设计元件的功能也起着至关重要的作用。在 MPRA 实验中，合成 DNA 序列库（通常包含启动子、增强子或\
  \ 5'UTR）被克隆到报告基因的上游并引入细胞。转录后，每个合成构建物产生一个带有标记的 `mRNA`，随后使用 `RNA-seq` 测量每个序列的表达水平。\n\
  \n在经典的低通量设置中，通过在报告基因旁克隆一组候选 DNA 序列来创建转录活动的合成数据集 [100]。这些构建体通过质粒转染或慢病毒整合导入细胞，并使用荧光素酶读数定量报告表达。高通量\
  \ RNA 测序的出现，结合廉价的 DNA 合成和实验室自动化的进步，使得更高效的筛选方法成为可能，包括 MPRA（图 3.5）。这种技术允许在单次实验中同时分析成千上万个候选\
  \ DNA 序列的转录活性 [101]。MPRA 存在多种变体，包括游离体 MPRA、慢病毒 MPRA [102, 103] 以及 `STARR-seq` [104]，但它们都共享一个共同框架：将\
  \ CRE 库与带有条形码的报告基因克隆。这些库随后被导入细胞，并使用 RNA 测序并行量化转录活性。\n\n\n\n\n\n![图 3.5 用于验证合成调控\
  \ DNA 活动的大规模并行报告基因分析（MPRA）流程。(a) 文库设计与克隆。在寡聚核酸合成期间，每个合成候选顺式调节元件（CREs）分别连接到多个唯一的\
  \ DNA 条码（BCs）。条码–CRE 对被克隆到质粒骨架中（取决于格式，位于最小启动子–报告基因盒盒的上游或下游），以创建一个质粒库，其中每个 CRE 都与其条码无歧义地关联。(b)\
  \ CRE 活性定量。在文库转染（或病毒转导）后，分别提取质粒（或基因组）DNA 和总 RNA。从每个池中通过 PCR 扩增含有条码的片段，并进行高通量测序。对于每个\
  \ CRE，条码转录量计算为 RNA 中的条码计数除以 DNA 中的条码计数。CRE 的整体活性定义为其相关条码的平均条码转录量。¶ 来源：BioRender.](img/c03f005.png)\n\
  \n### 图 3.5 用于验证合成调控 DNA 活动的大规模并行报告基因分析（MPRA）流程\n\n(a) 文库设计与克隆。在寡聚核酸合成期间，每个合成候选顺式调节元件（`CREs`）分别连接到多个唯一的\
  \ DNA 条码（`BCs`）。条码–CRE 对被克隆到质粒骨架中（取决于格式，位于最小启动子–报告基因盒的上游或下游），以创建一个质粒库，其中每个 `CRE`\
  \ 都与其条码无歧义地关联。\n\n(b) `CRE` 活性定量。在文库转染（或病毒转导）后，分别提取质粒（或基因组）DNA 和总 RNA。从每个池中通过 PCR\
  \ 扩增含有条码的片段，并进行高通量测序。对于每个 `CRE`，条码转录量计算为 `RNA` 中的条码计数除以 `DNA` 中的条码计数。`CRE` 的整体活性定义为其相关条码的平均条码转录量。¶\
  \ 来源：BioRender。\n\n一个原生物 MPRA 数据集源于细菌调控序列的宏基因组挖掘 [[105]](#c03.xhtml#c03-bib-0105)。来自\
  \ 184 个原生物基因组的 29,000 多条 165-bp 调控序列被合成、加标记并克隆到物种特异性质粒中 `GFP` 报告基因的上游。这些构建体被转化到各种细菌宿主中，并使用\
  \ `RNA-seq` 和 `FACS-seq` 进行检测。得到的数据集用于训练 `DeepSEED`，该深度学习框架学习了启动子序列与活性之间的关系，允许设计物种特异性的合成启动子\
  \ [[39]](#c03.xhtml#c03-bib-0039)。\n\n2024 DREAM 随机启动子挑战生成了一个基于 FACS 的 MPRA 数据集，包含超过\
  \ 670 万个随机 80-bp 序列，它们序列克隆到启动子环境中并在 *S. cerevisiae*（酿毕酵母）中表达。荧光测量和高通量测序定量能够训练一系列模型，以仅根据\
  \ DNA 序列预测 RNA 表达。参赛团队采用了多种深度学习架构，包括 `CNNs`、循环神经网络（`RNNs`）和 `Transformers`，实现了强大的序列到表达的预测性能\
  \ [[106]](#c03.xhtml#c03-bib-0106)。\n\n在早期的一项研究中，Cuperus *et. al.* 使用组氨酸生长检测 MPRA\
  \ 测定了 *S. cerevisiae* 中 500,000 个 50 核苷酸长的随机 5^′-UTRs 的活性 [[107]](#c03.xhtml#c03-bib-0107)。使用该数据集训练的\
  \ `CNN` 预测了随机和天然 5^′ UTR 对蛋白表达的影响，并通过单核苷酸 *in silico*（计算机模拟）进化引导了合成 5^′ UTR 的设计。同一小组还使用基于\
  \ MPRA 的方法量化了人类细胞系中 280,000 个随机 5^′ UTR 的活性 [[57]](#c03.xhtml#c03-bib-0057)。得到的数据集用于训练\
  \ `Optimus 5^′\\-Prime`，这是一种根据 5^′ UTR 序列预测核糖体负载的 `CNN`。该模型成功与遗传算法结合，引导了具有精确翻译控制的新型\
  \ 5^′ UTR 设计。同一数据集还支持了其他 5^′ UTR 活性预测器的训练，例如基于 `CNN` 的 `FramePool` 系列 [[108]](#c03.xhtml#c03-bib-0108)，以及基于\
  \ `Transformer` 的 `UTR-LM` [[109]](#c03.xhtml#c03-bib-0109) 和 `UTR-Insight` [[110]](#c03.xhtml#c03-bib-0110)。\n\
  \nMPRA 也被广泛用于研究远端调控元件，例如增强子。例如，`UMI-STAR-seq`（`STARR-seq` 的变体）用于生成 *Drosophila*（果蝇）S2\
  \ 细胞中发育和管家基因增强子的高分辨率活性图 [[64]](#c03.xhtml#c03-bib-064)。该数据集用于训练 `DeepSTARR`，一种基于\
  \ `Basset` 架构的工具 [[111]](#c03.xhtml#c03-bib-0111)，用于识别新型增强子并预测其活性。`DeepSTARR` 用于预测不存在于\
  \ *Drosophila* 基因组的 10 亿个随机 DNA 序列的活性，实验验证显示皮尔逊相关系数 62。\n\n使用在 K562、HepG2 和 SK-N-SH\
  \ 人类细胞系中检测的包含 776,474 条 200-bp 序列的离游体 MPRA 数据集，Gosai *et al* [[46]](#c03.xhtml#c03-bib-046)\
  \ 训练了 `Malinois`，另一种基于 `Basset` 的 `CNN` 活性预测器。通过将 `Malinois` 与设计算法，他们开发了 `CODA`（DNA\
  \ 活动计算优化），这是一个设计新型细胞特异性 `CRE` 的平台。重要的是，这些合成 `CRE` 通过 MPRA 在体外验证，并在小和小斑鱼体内进行了功能验证。同一数据集还支持了\
  \ `regLM` 的训练，这是一种结合 `HyenaDNA` 与类先验回归器的工作流，用于生成人类细胞特异性增强子 [[83]](#c03.xhtml#c03-bib-083)。使用\
  \ `lentiMPRA` 方法量化了三种人类细胞类型（HepG2、K562 和 WTC11）中超过 680,000 个候选 `CRE` 的转录活性 [[112]](#c03.xhtml#c03-bib-0112)。得到的数据集用于基准测试四个模型的预测潜力，`MPRALegNet`\
  \ 实现了最高性能（皮尔逊 *r* ≈ 0.83）。\n\n## 3.4 使用 Motif 分析和深度学习评估合成生物元件\n\n使用深度学习设计合成生物元件不仅需要生成合理的序列，还需要根据生物功能和背景进行严格评估。为了简化跨生物元件的评估，已经建立了一系列定量评估策略。这些包括分布相似性指标（例如\
  \ Fréchet 起始距离、k-mer 相关性）、motif 语法评估（例如 TFBS 的间距和共出现）以及结构特征检查（例如 Kozak 序列的存在、GC\
  \ 含量或聚聚腺尾信号）。表 3.2 总结了这些关键指标，为如何对比天然序列对合成序列进行定量评估提供了简明的参考，从而为合成生物系统的原理设计和迭代优化提供了可能。\n\
  \n\n\n\n\n虽然表 3.2 为评估生成的序列提供了一个结构化的起点，但必须认识，DNA 的底层调控语法本质上是灵活且依赖于上下文的，而不是受通用固定规则的支配。深度学习（DL）模型证明在揭示这些复杂模式方面至关重要，它们能够直接从序列数据中学习位置约束、基序语法和高阶相互作用。例如，在\
  \ 800 多种真菌基因组上训练的物种感知 DNA 语言模型捕捉物种特异性的启动子特征，包括 `TATA box` 的偏好位置（在 `S. pombe` 中位于\
  \ `TSS` 上游约 30 bp，在 `S. cerevisiae` 中为 50–120 bp）以及如 `TATA-INR` 间距和 RNA 结构元素等远程相互作用\
  \ 113。\n\n至关重要的是，DL 模型还可以解码基序语法——即影响功能的调节基序的排列、间距和组合。在合成 B 细胞启动子 `MPRA` 数据上训练的 `CNN`\
  \ 学习到，当 `OCT motif` 位于核心启动子 45 bp 以内时，转录活动达到峰值，并识别了如 `CArG-box + Runx1 + Arid3a`\
  \ 等协同组合 114。同样，在数千个 `Drosophila` 增强子序列上训练的 `DeepSTARR` 模型发现，只有特定的基序实例（例如单个 `GATA\
  \ motif`）驱动活性，这取决于局部上下文和间距。这些示例表明，`DL` 不仅捕捉了生物学意义的特征，还为调节 DNA 形式化了一种概率性的、感知内容的语法\
  \ 64。\n\n### 表 3.2 生成式任务中使用的指标。\n\n| 指标 | 目标 | 描述 |\n| --- | --- | --- |\n| Fréchet\
  \ Inception Distance (FID) | 数据集相似性 | 比较对应于生成的图像和真实图像的所学潜空间的均值和协方差统计。 |\n| k-mer\
  \ 频率相关性 (R²) | 序列相似性 | 计算真实与生成序列的 k-mer 计数，绘制自然与合成频率对比图，并使用线性拟合的决定系数。 |\n| Levenshtein\
  \ 距离或编辑距离 | 序列相似性 | 计算将生成的序列转换为真实参考序列所需的最小插入、删除或替换次数。 |\n| k-mer 计数的 Jaccard 相似性\
  \ | 序列间的组成相似性 | 衡量生成的与真实序列之间 k-mer 集的重叠程度。 |\n| k-mer 计数的余弦相似性 | 序列间的组成相似性 | 将序列视为\
  \ k-mer 频率向量，并计算生成的与真实频率分布之间角的余弦值。 |\n| TATA-box 位置 | 核心启动子位置准确性 | 评估合成启动子是否将 `TATA-box`\
  \ 放置在距离 `TSS` 上游物种特异的距离（例如在 `S. pombe` 中为 ~30 bp，在 `S. cerevisiae` 中为 50–120 bp）。\
  \ |\n| TFBS 密度 | 基序内容相似性 | 计算合成序列中单位长度的已知 `TFBS`，并与自然启动子/增强子进行比较，以确保基序丰度具有可比性。 |\n\
  | 基序间距一致性 | 调节语法一致性 | 将关键基序之间的距离（例如 `OCT motif` 到核心启动子的距离）与经验确定的最佳范围（例如 ≤45 bp）进行比较，以确保空间排列支持活性。\
  \ |\n| 基序共出现性 | 调节语法一致性 | 衡量定义空间窗口内出现特定基序对或高阶组合（例如 `CArG-box + Runx1 + Arid3a`）的频率，反映协同相互作用。\
  \ |\n| GC 含量 | 组成上下文保真度 | 比较合成序列中整体和区域特定的 GC 百分比与自然分布，确保尊重物种特有的碱基组成约束。 |\n| Kozak\
  \ 序列存在性 | 5′ UTR 准确性 | 量化 5′ UTR 中起始密码子周围共识基序 `GCCRCCAUGG` 的匹配情况（R = 嘌呤）。得分越高表示核糖体识别环境越优越。\
  \ |\n| Poly(A) 信号存在性 | 3′ UTR 终止信号准确性 | 检测合成 3′ UTR 中转录末端上游 10–30 nt 的经典 `AAUAAA`（及变体）六聚。确保高效切割和聚腺苷化的正确位置和序列上下文。\
  \ |\n| 密码子适应指数 (CAI) | 密码子使用优化 | 衡量编码序列的同义密码子组成与宿主生物偏好密码子使用的程度。CAI 越高，预期翻译效率越高。\
  \ |\n\n## 3.5 生成设计的当前挑战\n\n生成式 AI 已证明了其设计定制化生物序列（如启动子和增强子）的能力，在生物技术中具有显著应用——从开发用于治疗的细胞特异性调节元件，到为工业目的设计增强催化效率的新酶\
  \ 83。尽管取得了这些进展，目前的 `LLMs` 受限于其无法捕捉调控元件中的远程相互作用，这主要是由于现有 `Transformer` 模型具有二次复杂度(![script\
  \ upper O left-parenthesis n squared right-parenthesis](img/c03-i0005.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  ><mi mathvariant=\"script\">O</mi><mrow><mo stretchy=\"false\">(mo><msup><mi>n</mi><mn>2</mn></msup></mo>\
  \ stretchy=\"false\">)</mo></mrow></math>)。新兴模型（如状态空间模型 `MAMBA` 115）通过实现线性复杂度(![script\
  \ upper O left-parenthesis n right-parenthesis](img/c03-i0006.png)<math display=\"\
  inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"\
  script\">O</mi><mrow><mo stretchy=\"false\">(mo><mi>n</mi><mo stretchy=\"false\"\
  >)</mo></mrow></math>) 解决了这一挑战，使得能够在减少内存限制的情况下训练和生成染色体长度的序列。`Caduceus` 模型中双向性的集成\
  \ 116 可能用于同时生成上游和下游序列，为*从头开始*（de novo）染色体生成铺平道路。\n\n`LLMs` 的另一个关键局限性在于它们容易产生幻觉，即生成生物学上不可能或无功能的序列。这一问题可能源于训练集中序列多样性的有限，导致模型对常见模式过拟合，而未能捕捉稀有但重要的序列变异。不完整或不准确的基因注释加剧了这个问题，通常导致输出不可靠。目前，这些挑战在\
  \ DNA 序列生成领域尚未得到解决。为了缓解这些局限性，自然语言处理中的策略，如来自人类反馈的强化学习 (`RLHF`) 117，可以应用于合成元件的工程。`RLHF`\
  \ 根据人工反馈对模型进行微调。在生物背景下，这可以是实验验证反馈，尽管这将产生巨大的计算和成本。\n\n## 3.6 结论\n\n\n\n\n\n生成式人工智能（GenAI）标志着合成生物学的范式转变，为传统的“设计-构建-测试-学习”循环提供了一种精简替代方案。通过从大规模数据学习复杂的序列-功能关系，这些模型能够生成新型、真实的功能序列，并减轻实验负担。随着预测和生成模型的不断改进，我们预计它们的整合将成为跨物种合成元件理性可编程设计的核心。通过根据特定用户需求定制生物序列的合成，GenAI\
  \ 将驱动生物经济的创新并扩大生物技术行业的潜力。\n\n# 参考文献\n\n1. `Clarke, L.` and `Kitney, R.` (2020).\
