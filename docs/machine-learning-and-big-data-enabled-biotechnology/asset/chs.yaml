  \ 来源：BioRender。\n\n### 3.2.1.1 基因组监督学习的数据考虑\n\n`DL` 本质上既是以数据为中心也是以算法为中心的——成功的成果不仅取决于模型架构，还取决于数据准备。所有监督学习模型共享一个框架：从输入变量（如基因组序列或源自\
  \ `MP` 的序列）配对目标表达值（通常使用 `RNA-seq` 数据测量）。\n\n在使用基因组数据时，模型输入通常包括与基因相关的调控 DNA 序列——例如增强子、启动子和非翻译区\
  \ (`UTR`)。数据集通常分为训练（80–90%）、验证（5–10%）和测试（5–10%）集（图 3.1a,b）。训练集用于学习参数，验证集在训练期间监控性能（例如超参数调优）。测试集严格保留用于最终评估，在训练或验证期间不得接触模型。\n\
  \n虽然我们在这里不介绍一般的统计和机器学习原理或优化策略（参见推荐文献 [66]–68](#c03.xhtml#c03-bib-0068)]，以及其他章节，因为其他模型涉及理解生物功能的不同领域），但我们强调了在处理生物序列数据时至关重要的几个特定数据考虑因素（特别是对于部分表征时），以避免误导性结果：\n\
  \n#### 1. 目标变量的偏差\n\n#### 2. 输入序列的偏差\n\n\n\n\n\nRNA-seq 和其他测序技术可能会因为扩增步骤引入 GC 含量偏差\
  \ 69。必须使用标准规范化协议对这些偏差进行修正，以避免在技术伪影上训练模型 70。\n\n### 3. 分布一致性\n训练集、验证集和测试集应该遵循相似的。否则，测试集上的性能可能无法反映真实的泛化能力。\n\
  \n### 4. 序列冗余与数据泄露\n当用于训练机器学习算法的数据包含了你试图预测的信息时，就会发生数据泄露。基因组学中常见的陷阱是序列冗余：相似或相同的序列出现在多个数据拆分中。这会导致数据泄露，使模型通过记忆而非学习可泛化的特征来通过“作弊”。为了缓解这一点，应该根据相似性（例如\
  \ 80–90%）对序列进行聚类，并以拆分的方式防止相似序列交叉于训练集、验证集和测试集。\n\n### 5. 数据转换泄露\n预处理步骤（如缩放、规范化和填充）必须仅在训练数据上拟合，并单独应用于验证集和测试集。全局应用转换（即使用整个数据集的信息）会引入数据泄露并夸大性能指标\
  \ 71。\n\n通过遵循这些实践，可以确保在 DNA 序列数据上训练的神经网络具有稳健的泛化能力并得到公平评估，避免可能干扰生物学解释的伪影 72。\n\n\
  ### 3.2.1.2 用于监督基因组序列建模的卷积神经网络入门\n一旦数据集经过适当筛选，下一步是训练监督预测模型。训练 CNN 的过程（在图 3.2 中也有概述）从前向传播开始，信息从输入的\
  \ DNA 序列流过所有模型层输出预测值。在训练之前，DNA 序列中的每个核苷酸都被转换为数值、机器可读的独编码（one-hot）向量格式。例如，A 被编码为\
  \ `[1, 0, 0, 0]`，C 编码为 `[0, 1, 0, 0]`，G 编码为 `[0, 0, 1, 0]`，T 编码为 `[0, 0, 0, 1]`。因此，像\
  \ ATATAACG 这样的序列被表示为一个 8x4 的二进制矩阵，其中每行对应一个核苷酸，每列对应输入张量中的一个通道（图 3.2a）。该矩阵随后通过一个由可学习滤波器或内核组成的卷积层（图\
  \ 3.2b）。这些滤波器充当模式检测器，扫描 k-mer 子序列，计算其内部权重与相应的独编码编码窗口之间的点积。在图 3.2 的示例中，CNN 应用了单次前向传播。\n\
  \n（注：提供的源文本末尾包含大量的重复和碎片化句子结构。我已清理冗余内容，以保持所描述的 CNN 过程的核心技术解释。）\n\n\n\n\n\n通过这种方式结合所有位置的信息，每个神经元都学习了不同的局部模式（例如在不同位置检测到的基序）是如何共同影响最终预测的。这种方法允许\
  \ CNN 捕捉复杂的句法逻辑并将其表示为标量输出，该输出通常对应于具有生物学意义的分，例如预测的基因表达水平或序列具有调节活性的概率。使用损失函数（在本例中为均方误差\
  \ MSE）将此输出与真实的已知目标值进行比较（图 3.2d）。例如，如果真实标签为 1.2 而模型预测为 0.76，则均方误差为 0.1936。\n\n在 CNN\
  \ 训练的第二阶段，即反向传播，模型调整其内部参数以最小化损失（图 3.2e）。反向传播从计算出的损失开始，反向通过网络，计算卷积层和全连接层中的每个权重如何影响最终预测。具体而言，网络计算梯度——这些数学值指示了每个神经元的权重为了最小化损失函数而应该改变的方向和幅度。使用梯度下降法，CNN\
  \ 增量更新这些权重以改进其预测。通过多次迭代，网络进行自我微调，越来越擅于识别具有生物学意义的模式，从而增强了其预测准确性和可解释性。\n\nCNN 已成功应用于仅通过\
  \ DNA 序列预测 mRNA 表达水平 [[55]](#c03.xhtml#c03-bib-0055)。使用跨越 7 个物种的 20,000 个 RNA-seq\
  \ 实验的数据集，Zrimec *et al.* [[42]](#c03.xhtml#c03-bib-0042) 训练了一个模型，在*酿酵母*（S. cerevisiae）中实现了\
  \ R² = 0.82 的预测得分。这篇文章表明，基因调节结构本身编码了表达变异的大部分。至关重要的是，该模型识别了超过 2,000 个调节基序，包括分布在启动子、UTR\
  \ 和终止子中的已知 TFBS 和新序列元件。该模型还揭示了基序共存的规则——特定的基序组合可以调节跨越三个以上数量级的表达变化。这些发现强调了 CNN 仅从序列提取具有生物学意义的模式和基序相互作用的潜力，这归于它们整合局部基序信号以推断全局表达结果的能力。\n\
  \n### 3.2.2 生成序列建模\n\n在讨论了使用 CNN 的模型引导序列设计框架的预测部分后，我们现在转向生成性部分，该部分通常涉及使用生成式人工智能\
  \ (GenAI) 设计序列。GenAI 方法已成为设计合成生物部分的强大工具，在基因组学中的应用日益广泛。GenAI 的兴起受到 `ChatGPT` 和 `DALL·E`\
  \ 等工具的推动，这些工具可以根据为用户定制的简单提示生成类文本和真实的图像。这些底层技术在生物学中也被证明是强大的，因为 DNA 和蛋白质可以表示为文本——DNA\
  \ 使用碱基“A”、“C”、“T”和“G”，蛋白质用氨基酸字母表示。这种表示允许 GenAI 模型以类似于生成语言或艺术的方式生成功能性生物序列。由于能够产生所需属性的新序列，GenAI\
  \ 模型越来越多地被从头（de-novo）设计 [[74]](#c03.xhtml#c03-bib-0074) [[77]](#c03.xhtml#c03-bib-0077)\
  \ [[78]](#c03.xhtml#c03-bib-0078) [[79]](#c03.xhtml#c03-bib-0079) [[80]](#c03.xhtml#c03-bib-0080)\
  \ 以及 [[82]](#c03.xhtml#c03-bib-0082)。\n\n#### 3.2.2.1 无监督学习的数据准备\n\n使用 GAN、扩散模型或基于\
  \ Transformer 的语言模型等方法对生物序列进行成功的建模很大取决于数据集准备。与监督学习不同（监督学习在标记数据集上训练模型，将输入序列如启动子）映射到输出（如基因表达水平），无监督生成模型直接从未标记的序列数据中学习统计模式，通常直接使用基因组\
  \ FASTA 文件。虽然不需要标签，但数据准备仍然至关重要——与 CNN 类似，涉及消除冗余、数据泄露和清理序列数据。首先，原始基因组 DNA 序列必须经过质量控制，以消除测序错误和模糊核苷酸（例如“N”字符），这些会损害学习。生成建模的另一个挑战是基因长度的变异性，特别是当模型需要固定长度的输入时。这通过裁剪或填充标准化序列长度来解决。填充通常涉及向较短的序列中添加中性标记（例如“N”字符）以确保输入长度一致。例如，如果模型需要\
  \ 512 碱基的输入，则 430 碱基的序列将填充 82 个碱基。最后，为了避免训练偏差，可以通过对代表不足的序列类进行上采样或对过度代表进行下采样来平衡数据集。总之，仔细的数据准备对于无监督学习至关重要，它使生成模型能够产生生物学上、多样且具有功能的序列。\n\
  \n#### 3.2.2.2 用于生物序列设计的 GAN\n\n\n\n\n\n# GANs\n\nGAN 50 是一种生成式深度学习方法，通过对真实基因组元素的分布来设计具有生物学意义的\
  \ DNA 序列。GAN 由两个神经网络组成：生成器 `Generator (G)`，用于训练生成真实的合成 DNA 序列；以及判别器 `Discriminator\
  \ (D)`，用于评估给定序列是真实的还是人工生成的。如图 3.3a 所示，训练 GAN 的过程从采样一个随机潜向量 ![z tilde script upper\
  \ N left-parenthesis 0 comma 1 right-parenthesis](img/c03-i0001.png)<math display=\"\
  inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>z</mi><mo>&#8764;</mo><mi\
  \ mathvariant=\"script\">N</mi><mrow><mo stretchy=\"false\">(mo><mrow><mn>0</mo><mo>,</mo><mn>1</mn></mrow><mo\
  \ stretchy=\"false\">)</mo></mrow></math> 开始。该向量随后被传递到 `Generator`，通过线性变换（`logits\
  \ = wz + b`）产生原始分数或 `logits`，并将其重塑为一个代表合成 DNA 序列的“位置-核苷酸”矩阵。然后，对该矩阵的每一行应用 softmax\
  \ 激活函数——每行代表了 A、C、G 和 T 在特定位置的分布——将 `logits` 转换为四种 DNA 碱基的概率，生成的概率矩阵直接传递给 `Discriminator`。`Generator`\
  \ 和 `Discriminator` 在对抗循环中进行训练：判别器更新其权重以更好地学习区分真实序列和生成序列，而生成器则调整其参数以产生判别器越来越难以检测的输出。这种动态过程在图\
  \ 3.3a 的右图中可视化，其中代表合成序列的浅灰色分布逐渐移动，以与真实序列的深灰色分布对齐。在经过多次训练迭代应用梯度下降算法后，`Generator`\
  \ 逐渐学会合成与自然生物序列无异的序列。在推理期间，使用已训练好的 GAN 来合成离散的 DNA 序列以便检查或下游使用。在此阶段，`Generator` 返回的“位置-核苷酸”矩阵首先通过计算矩阵中每个位置概率最高的核苷酸来生成核苷酸序列。然后，该合成序列被传递到\
  \ `Discriminator`，由其分配一个表示该序列真实性的概率分数。高分意味着序列来自真实数据分布，而低分则表示它是合成的。\n\nGAN 的迭代对抗训练涉及\
  \ `Generator` 和 `Discriminator` 的交替优化步骤。首先，优化 `Discriminator` 以准确区分真实序列与生成的“伪造”序列。从数学上讲，这一优化步骤通过计算判别器损失函数\
  \ `L[D]` 的梯度来完成，该函数定义为：\n\n![upper L Subscript upper D Baseline equals minus left-bracket\
  \ log upper D left-parenthesis x Subscript Baseline right-parenthesis plus log left-parenthesis\
  \ 1 minus upper D left-parenthesis upper G left-parenthesis z right-parenthesis\
  \ right-parenthesis right-bracket](img/c03-math-0002.png)<math display=\"block\"\
  \ overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>L</mi><mi>D</mi></msub><mo>=</mo><mo\
  \ form=\"prefix\">&#8722;</mo><mrow><mo stretchy=\"false\">\\[</mo><mrow><mi>log</mi><mi>D</mi><mrow><mo\
  \ stretchy=\"false\">(mo><msub><mi>x</mi><mtext>real</mtext></msub><mo stretchy=\"\
  false\">)</mo></mrow><mo form=\"postfix\">+</mo><mi>log</mi><mrow><mo stretchy=\"\
  false\">(mo><mrow><mn>1</mn><mo>&#8722;</mo><mi>D</mi><mrow><mo stretchy=\"false\"\
  >(mo><mrow><mi>G</mi><mrow><mo stretchy=\"false\">(mo><mi>z</mi><mo stretchy=\"\
  false\">)</mo></mo></mrow><mo stretchy=\"false\">)</mo></mo><mo stretchy=\"false\"\
  >)</mo></mrow></mo><mo stretchy=\"false\">\\]</mo></mrow></math>\n\n`L[D]` = `-[log\
  \ D(x_real) + log(1 - D(G(z)))]`\n\n\n\n\n\n### 图 3.3 GAN 与扩散模型\n\n(a) 用于合成 DNA\
  \ 序列的 GAN 工作流。左上面板为 GAN 概述。将潜向量 `z` 传递通过 `Generator` (`G`)，其输出一个合成序列。`Discriminator`\
  \ (`D`) 负责评估给定序列是来自真实数据分布还是由生成的。右侧面板，生成器学习真实数据分布。起初，生成的序列分布（浅灰色）与真实序列分布（深灰色）存在显著差异。经过迭代训练，生成器学习了真实数据分布，并生成了类似于真实数据的合成序列。底部面板为\
  \ GAN 训练。`Generator` 以潜向量 `z` 作为输入计算 `logits` (`logits=W*z+b`)。`Logits` 通过通过 `softmax`\
  \ 层以计算每个位置的核苷酸概率。生成的序列经过 one-hot 编码传递给 `Discriminator`（本身就是一个 `CNN`），该判别器输出序列来自真实数据分布的概率。这些评分引导着对抗训练循环，使\
  \ `Generator` 能够不断优化其输出，使其趋于生物学真实的 DNA 序列。\n\n(b) 用于 DNA 序列生成的扩散模型工作流。顶部面板为扩散过程概述。真实的\
  \ DNA 序列经过 one-hot 编码并处于正向扩散过程中，在该过程中随时间推移逐渐添加高斯噪声。去噪网络学习反转这一过程，将嘈杂的表示提炼回结构化序列。右上面板为训练与生成。在训练期间，模型学习将噪声映射到真实的\
  \ DNA 序列。在生成期间，模型将随机生成的噪声去噪为真实的合成 DNA 序列。底部面板。模型从均匀的碱基概率开始（每个约 0.25）。在每个时间步（`X0`,\
  \ `X1`, ···, `XT`）上，概率都会向生物学合理的分布调整。最终，在每个位置选择概率最大的核苷酸以形成最终序列。这种去噪过程能够生成新颖、多样化的\
  \ DNA 序列，这些序列捕捉了关键的生物基序和模式，无需复制训练示例。\n\n*Source*: BioRender。\n\n![upper L Subscript\
  \ upper G Baseline equals minus log upper D left-parenthesis upper G left-parenthesis\
  \ z right-parenthesis right-parenthesis](img/c03-math-0003.png)\n\n```math\n<math\
  \ display=\"block\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  ><msub><mi>L</mi><mi>G</mi></msub><mo>=</mo><mo form=\"postfix\">&#8722;</mo><mi>log</mi><mo>&#8201;</mo><mi>D</mi><mrow><mo\
  \ stretchy=\"false\">(</mo><mrow><mi>G</mi><mrow><mo stretchy=\"false\">(</mo><mi>z</mi><mo\
  \ stretchy=\"false\">)</mo></mrow></mrow><mo stretchy=\"false\">)</mo></mrow></math>\n\
  ```\n\n在这里，`D(G(z))` 代表由 `Discriminator` 预测的概率，即由 `Generator` `G(z)` 产生的序列是真实的（或“自然的”）生物序列的概率。`Generator`\
  \ 经过训练以最大化这一概率，这通过最小化上述的负对数概率来实现。最小化 `L[G]` 鼓励 `Generator` 创建 `Discriminator` 无法与真实序列区分的合成序列。例如，如果\
  \ `Generator` 生成了一个类似于天然 Kozak 共有序列的“GCCACCATGG”序列，且 `Discriminator` 为其分配了较高的真实概率，则\
  \ `Generator` 获得的损失较低。至关重要的是，`Generator` 的最终目标是匹配真实生物序列的分布——不是通过生成单个理想序列，而是通过创建多个合成序列，其集体特征（例如基序、核苷酸频率和模式）密切模仿在原始数据中观察到的特征。考虑一个涉及\
  \ Kozak 序列的简单示例，如“GCCACCATGG”和“GCCGCCATGG”。起初，`Generator` 生成生物学相关性小的多样化随机序列。经过多次训练迭代，随着\
  \ `Discriminator` 区分真实序列的能力变得更强，`Generator` 接收到关于其输出偏离真实序列的精确反馈。因此，`Generator` 的参数调整引导其产生与真实数据集具有相同统计特性的序列。\n\
  \nGAN 应用于 DNA 序列生成的示例是 `ExpressionGAN` [25]，该方法旨在设计在酿酵母（*S. cerevisiae*）中具有可预测转录输出的合成调节序列。在此框架下，`Generator`\
  \ 与一个预测性“先知”模型耦合，该模型能准确估计每个生成序列对应的基因表达水平。在优化过程中，预测模型引导 `Generator` 生成达到特定目标表达水平的序列。值得，尽管与自然序列存在巨大差异（>33%），但实验验证证实了\
  \ `ExpressionGAN` 生成的序列在*体内*具有功能性。惊的是，57% 与高表达相关的合成调节序列的表达水平超过了自然序列对应的表达水平 [25]。这不仅证明了基于\
  \ GAN 的模型处理广泛调节序列空间的能力，还证明了它们超越传统突变方法局限性的潜力。因此，`ExpressionGAN` 证明了 GAN 在现有生物约束之外创新的力量，能够精确控制基因表达，这对生物技术和治疗应用具有重要意义。\n\
  \n#### 3.2.2.3 基于 Transformer 的 DNA 模型\n\n里程碑式著作《Attention Is All You Need》[81]\
  \ 中引入的 Transformer 架构改变了我们训练基因组级序列模型的能力，并由此能够解释释和生成文本。该论文还引入了自注意力机制，允许模型权衡句子中每个词的相关性，实现更高效的语义和语法理解。例如，在句子“She\
  \ went to the bank to deposit money”中，自注意力允许模型根据周围的单词将“bank”解释为金融机构，而不是河流岸边的陆地。重要的是，通过消除任何循环或卷积操作并完全依赖于自注意力，Transformers\
  \ 能够并行处理输入中的所有位置，使得使用更大的模型和更快的训练成为可能。在这一基础工作的基础上，生成式预训练 Transformer（GPT）[82] 等模型在广泛应用中生成连贯、感知上下文的文本方面也展现了卓越的性能。基于注意力的模型在自然语言生成任务中的成功，促进了它们在其他领域的应用。在基因组学中，DNA\
  \ 或 RNA 序列可以被视为由 A、C、G、T 和 U 核苷酸组成的文本，基因组语言模型（GLMs）已被证明在捕捉局部基序和长期依赖方面是有效的。这种能力使它们特别适用于合成部件设计，在这些设计中精确的序列生成和上下文理解至关重要。\n\
  \n\n\n\n与基于卷积的模型类似，`GLM` 的训练需要将原始 DNA 序列转换为数值格式。然而，`GLMs` 并不是采用独热编码，而是依赖于分词（tokenization），该过程将核苷酸碱基字母映射到数值表示或标记的过程（图\
  \ 3.4）。在最简单的方法（称为单字符分词）中，每个核苷酸被视为一个独立的标记，类似于文本语料中处理字符的方式（例如，“A”可能被编码为 1，“C”被编码为\
  \ 2，以此此类推）。还可以引入额外的标记以告知并引导 `GLM` 设计具有特定特征的序列。例如，在 `regLM` 框架 [[83]](#c03.xhtml#c03-bib-0083)\
  \ 中，使用双标记提示词 `<X><Y>` 生成合成的 `S. cerevisiae` 启动子，并将其置于 DNA 序列之前。每个标记代表在特定培养基中所需的启动子活性，其中`<X>`\
  \ 代表复杂培养基中的活性，`<Y>` 代表定义培养基中的活性。标记值范围从 0（极低活性）到 4（极高活性）。例如，提示词 `<2><4>` 指示模型生成在复杂培养基中具有中等活性而在定义培养基中具有极高活性的\
  \ `S. cerevisiae` 启动子。同样，对于人类增强子的生成，`regLM` 实现了一个三标记提示词 `<A><B><C>`，其中每个标记指定特定人类细胞系中的增强子活性：`<A>`\
  \ 用于 HepG2（肝细胞），`<B>` 用于 K562（红细胞性白血病），`<C>` 用于 SK-N-SH（神经母质瘤）。这些值从 0（不活跃）到 3（非常活跃）。例如，提示词\
  \ `<0><3><1>` 指导模型生成在 HepG2 中不活跃、在 K562 中高度活跃并在 SK-N-SH 中表现出低活性的增强子。下面显示了这些提示词结构的示例：\n\
  \n![图 3.4 用于 DNA 序列理解的基于 Transformer 的模型概述。顶部面板。来自广泛生物的 DNA 序列被输入 Transformer 模型并进行分词以转换为数值格式。左下面板。MLM\
  \ 与 AR 训练。在 MLM（左侧）中，模型使用注意力评分推断被掩码碱基的身份，学习双向依赖关系。在 AR（右侧）中，它一次生成一个碱，根据给定先验上下文预测最可能的核苷酸。分布曲线显示了特定位置的核苷酸概率输出。左下面板，注意力机制。热图表示序列中每个核苷酸的注意力评分。通过这些评分，Transformers\
  \ 学习 DNA 的上下文感知表示，这些可用于多种下游基因组任务。¶ 来源：BioRender。](img/c03f004.png)\n\n图 3.4 用于 DNA\
  \ 序列理解的基于 Transformer 的模型概述。顶部面板。来自广泛生物的 DNA 序列被输入 `Transformer` 模型并进行分词以转换为数值格式。左下面板。`MLM`\
  \ 与 `AR` 训练。在 `MLM`（左侧）中，模型使用注意力评分推断被掩码碱基的身份，学习双向依赖关系。在 `AR`（右侧）中，它一次生成一个碱，根据给定先验上下文预测最可能的核苷酸。分布曲线显示了特定位置的核苷酸概率输出。左下面板，注意力机制。热图表示序列中每个核苷酸的注意力评分。通过这些评分，`Transformers`\
  \ 学习 DNA 的上下文感知表示，这些可用于多种下游基因组任务。¶ 来源：BioRender。\n\n另一种，k-mer 分词使用滑动窗口方法将 DNA 分段为长度为\
  \ *k* 的重叠子序列。例如，序列 `ATGCA` 将产生 `ATG`、`TGC` 和 `GCA`。这种方法保留了局部上下文并引入了与生物学相关的词汇，捕捉了如\
  \ `TFBS` 等短基序。然而，k-mer 分词会导致词表大小随 *k* 指数级增长（例如 3-mer 为 $4³$），这会影响内存和计算效率。选择单核苷酸还是\
  \ k-mer 分词取决于模型的设计目标——优先考虑细粒度分辨率还是更丰富的基序上下文。\n\n`GLM` 训练通常从预训练阶段开始，在该阶段，模型接触大量的无标记数据以学习通用表示。此阶段允许模型在不需要显式标签或注释的情况下捕捉\
  \ DNA 内部的模式和上下文信息，使其泛化到下游任务，如 DNA 部分的分类或生成。对于预训练，可以使用一个或多个生物的基因组。例如，`HyenaDNA` [[84]](#c03.xhtml#c03-bib-0084）专注于人类基因数据，使其学习针对人类基因组的专门表示。相比之下，`DNABERT-2`\
  \ [[85]](#c03.xhtml#c03-bib-0085)等模型聚合了来自多个物种（包括细菌、植物和人类）的 DNA 序列，鼓励跨进化背景的更广泛泛化。\n\
  \n有两种主要的预训练方法：掩码语言模型（MLM）和自回归模型（AR）（图 3.4 右下方）。在 MLM 中，序列中的某些核苷酸被掩码，模型学习使用未掩码的上下文预测掩码标记的身份。在\
  \ AR 模型中，模型被训练为仅根据之前的标记预测序列的下一个核苷酸。这两种方法的主要区别在于，MLM 训练允许模型从被掩码碱基的两侧学习双向依赖关系，理解上游和下游核苷酸如何影响给定位置。例如，如果提供了序列\
  \ `ATA_CC`，模型根据邻近的核苷酸学习推断掩码标记可能是 `G`。另一方面，在 AR 训练中，给定 `ATAGC`，模型估计下一个碱基的概率分布，并从四个核苷酸中选择最可能的候选者来扩展序列。\n\
  \n\n\n\n\n基于 Transformer 的模型的一个重要创新是注意力机制，如图图 3.4 左下角所示。注意力机制允许模型在预测核苷酸时，通过为每个位置分配重要性评分（或注意力权重），来选择性地关注输入序列的某些部分。重要的是，注意力权重是依赖于上下文的，这意味着分配给每个核苷酸的相关性会根据特定的周围序列而改变。例如，在对启动子区域进行建模时，模型可能会对已知的调控基序（如\
  \ TATA 盒，“TATAAA”）分配高注意力评分，以预测下游的转录起始位点 (TSS)。\n\n基于 Transformer 的 DNA 语言模型使用交叉熵损失作为目标函数进行训练。交叉熵将预测的核苷酸概率分布与实际的正确核苷酸进行比较。交叉熵值越低，意味着模型为正确答案分配的概率越高。对于\
  \ `MLM`，模型仅利用完整序列上下文预测被掩码的位置；对于 `AR` 建模，模型仅利用之前的位置从左到右预测每个核苷酸。在这两种情况下，交叉熵都会在每个相关位置计算以指导学习。每个设置的损失可以定义为：\n\
