  \nMarc Amil^()\n\n¹King's College London, Randall Centre for Cell & Molecular Biophysics,\
  \ New Hunt's House, Guy's Campus, SE1 1UL, London, UK\n²Chalmers University of Technology,\
  \ Department of Biology and Biological Engineering, Kemivägen 10, SE-412 96, Gothenburg,\
  \ Sweden\n³Vilnius University, Institute of Biotechnology, Life Sciences Centre,\
  \ Sauletekio al. 7, LT10257, Vilnius, Lithuania\n\n## 3.1 引言\n\n合成生物学旨在通过设计和组合遗传元件来工程生物体，创建用于多种生物技术应用的复杂系统\
  \ [1]，包括生物燃料的生产 [2, 3]、药物 [4] 以及工业化学品 [5]。合成生物学的核心概念是标准化遗传元件——编码定义生物学功能的 DNA 序列。虽然第\
  \ 1 章和第 2 章展示了从这些 DNA 序列中提取基因组规模代谢功能的方法，本章旨在关注 DNA 本身的功能部分。这些部分包括启动转录的启动子、促进翻译起始的核糖体结合位点\
  \ (RBS)、决定转录速率、蛋白质结构和功能的编码序列、信号转录终止的终止子以及调节 RNA 转录的增强子。例如，将启动子、编码序列和终止子结合可以产生一个基因表达盒。这些模块化组件可以进一步组装成更高级的遗传生物电路，以在工程生物体内执行复杂任务，如振荡器或双稳开关\
  \ [6, 7]。一个著名的例子是遗传双稳开关，它使用两个可抑制的启动子（如 `Ptrc-2` 和 `PLtetO-1`）以及它们对应的抑制基因（`lacI`\
  \ 和 `tetR`），每个抑制对方的活性。这种设置允许细胞在开启（表达 GFP）和关闭（不表达 GFP）两种状态之间稳定切换——并被用于创建记忆设备，记录对异丙基-β-D-1-硫代半乳糖\
  \ (IPTG) 等化学物质的暴露，IPTG 会临时使 `lacI` 失活，从而将开关从一个状态翻转到另一个 [7]。\n\n## 遗传进化与文库的作用\n\n\
  获取高质量、多样化的功能元件库（如启动子、增强子和终止子）对于构建稳健且可调的系统至关重要。产生此类库的一种常用策略涉及基于突变的方法，包括易错 PCR 和饱和突变\
  \ [10]-13]。这些方法随机引入突变，随后通过筛选进行选择，形成了定向进化的基础 [14, 15]。定向进化通过循环的多样化、表达和选择来模拟自然选择，以富集改良变体，而不需要先验知识\
  \ [16, 17]。尽管定向进化非常有效，但传统方法仍然耗费大量时间 [18]。由于突变是随机引入的，大多数变体无效或无法符合规格，需要筛选来分离有益突变。例如，在蛋白质突变时，高达\
  \ 70% 的随机氨基酸替换会导致活性下降，其中 50% 是完全有害的 [19]-21]。在大肠杆菌中，用随机 100 bp 序列替换天然启动子显示，只有约 10%\
  \ 的随机序列可以驱动转录，而 90% 不产生表达 [22]。同样，随机 DNA 可以导致基因活跃表达 [23]，但序列空间的巨大规模是一个主要挑战，需要筛选数百万个\
  \ DNA 构建体。例如，一个 100 bp 的启动子有 $1.6 \\times 10^{60}$ 种可能的变体，这与观测宇宙中的原子数量相当 [24]，使得详尽的筛选是不可行的。当目标是提高启动子驱动的表达时，对随机突变过程建模显示，少于\
  \ 0.5% 的变体能达到结果 [25]。\n\n此外，由于每个进化步骤都建立在上一步的基础上，该过程本质上具有路径依赖性，这意味着每一轮选择的每个突变都会影响未来突变是否可行或是否可能成功。如果早期突变提供了微小的益处，但阻止了获得更好解决方案的可能性（因为需要通过适应性较差的中间变体），该过程可能会错过最佳结果。\n\
  \n\n\n\n\n为了减轻实验负担并更有效地引导设计工作，研究人员开发了多种计算工具，在计算机中（*in silico*）模拟遗传元件的性能。这些工具包括 `RBS\
  \ Calculator` \\[28, 29\\], `RBS Designer` [\\[30\\]](#c03.xhtml#c03-bib-0030),\
  \ `UTR Designer` [\\[31\\]](#c03.xhtml#c03-bib-0031), 以及 `EMOPEC` [\\[32\\]](#c03.xhtml#c03-bib-0032)。通过对核糖体–mRNA\
  \ 结合、mRNA 二级结构和热力学性质等分子相互作用进行建模，这些算法估计翻译起始速率，旨在预测基因表达水平。例如，`RBS Calculator` [\\\
  [28\\]](#c03.xhtml#c03-bib-0028) 使用细菌翻译起始的热力学模型来预测与核糖体结合相关的`吉布斯自由能变化`，从而估计给定 mRNA\
  \ 序列的相对翻译起始速率。它既支持逆向工程（从现有序列预测起始速率），也支持正向工程（设计合成的 `RBSs` 以实现用户指定的表达水平），其预测范围跨越了五个数量级。然而，尽管该工具非常先进，但\
  \ `RBS Calculator` 主要针对*大肠杆菌*（*Escherichia coli*）定制，且假设了平衡热力学，，这对于高度结构化的 RNA 或非模型生物体可能并不适用。此外，它没有考虑如\
  \ RNA 结合蛋白等其他调控元件。因此，使用这些工具设计的遗传元件在不同的宿主或环境条件中可能会表现出不可预测的行为，限制了它们的移植性和预测能力。\n\n\
  尽管用于理性化序列设计的计算工具取得了进展，但受限于对分子机制的理解不完全、对宿主的特异性假设以及在不同生物背景下的泛化能力差，传统的统计模型和机制模型仍然存在局限\
  \ [\\[33\\]](#c03.xhtml#c03-bib-0033)。因此，前的一代计算方法未能取代涉及大规模筛选的传统实验方法，而后者仍然是生物元件工程的标准。另一方面，在过去的十年里，我们读取生物学的能力极大地提高。跨物种、组织和细胞类型的单细胞测序以及基因表达和染色质可及性的高分辨率分析进展，产生了海量数据集\
  \ \\[34–37\\]。这些丰富的信息结合机器学习的快速发展以及人工智能（AI）的进展，使得非线性复杂的序列-表达关系建模成为可能，从而设计增强子 [\\\
  [38\\]](#c03.xhtml#c03-bib-0038)、调控启动子 \\[39–41\\],设计整个基因 \\[25, 42\\],控制组织特异性表达\
  \ [\\[43\\]](#c03.xhtml#c03-bib-0043), 44\\],甚至设计针对特定人类细胞类型定制的合成调控 DNA \\\\45, 46\\\
  ]。\n\n与机制无关的、AI 驱动的方法正在改变序列设计——从试错筛选转变为预测性的、可编程的工程学科。利用大规模生物数据集，深度神经网络可以学习细微的序列-功能关系，从而设计调控元件无需进行穷尽筛选。这些进展催生了模型引导的设计框架——这种框架通过训练良好的预测器来引导设计。在接下来的章节中，我们将介绍基于神经网络的预测框架。我们将讨论常用的架构，如卷积神经网络（CNNs）\\\
  [47, 48\\] 如何被用于解释 DNA 功能。我们还将强调生成式深度学习（DL）模型的整合，例如生成对抗网络（GANs）\\[50, 51\\], 扩散模型\
  \ \\[52, 53\\], 以及基于 Transformer 的模型 \\[54\\]，它们可以采样出生物学上多样化的序列，减少对随机突变的依赖。\n\n\
  ## 3.2 使用深度学习进行模型引导的设计\n\n在模型引导的设计框架中，生成并评估候选 DNA 序列以识别特定功能（如最大化蛋白质表达）。该框架通常整合两个神经网络组件：生成序列的模型和评估每个设计潜力的预测模型（见图\
  \ 3.1d）。\n\n预测模型充当*先知*（oracle），根据所需的生物学结果对序列进行评分以引导生成模型。预测模型有两种模式：(i) 分类，分配离散标签（例如转录因子结合：是/否）；(ii)\
  \ 回归，预测连续变量，如基因表达水平 \\[42, 55, 56\\] 或平均核糖体负载（MRL）等翻译效率指标 [\\[57\\]](#c03.xhtml#c03-bib-0057)。由于能够有效地学习局部序列特征，CNN\
  \ 常用于回归任务。\n\n在生成方面，最近的进展展示了使用 DL 架构（包括 GAN、扩散模型和基于 Transformer 的语言模型，例如通用预训练 Transformer，GPT）来采样生物学上合理且多样化的\
  \ DNA 序列。与往往产生无功能或生物学不可行变体的随机突变方法相比，这些模型从功能性序列分布中学习并提高了设计效率（见图 3.1c）。\n\n\n\n\n\
  解码 `cis`-顺式调控密码——控制基因表达的序列规则——仍然是基因组学中的核心挑战之一。随着大规模功能基因组学数据集的兴起，机器学习模型（特别是 `DL`\
  \ 架构）已成为直接从 DNA 序列解码这些调控元素的强大工具。其中，`CNNs` 已成为预测关键调控现象的基础，例如转录因子结合 \\[48, 60],染色质可及性\
  \ [\\[61\\]](#c03.xhtml#c03-bib-0061)、基因表达 \\[55, 56\\],甚至是 3D 基因组架构 \\[62, 63]]。基于\
  \ `CNN` 的模型不仅在预测能力上达到或超过了以往的方法，还能对基因调控的序列基序（motifs）和相互作用提供可解释的见解 [\\[49\\]](#c03.xhtml#c03-bib-0049)]。此外，`CNNs`\
  \ 已扩展到模拟大规模并行报告实验（`MPRA`）的输出，在序列与调控活动之间建立了直接联系，允许设计新型合成调控元件 \\[64, 65\\]。在本章中，我们将特别关注\
  \ `CNNs` 在对基因表达建模中的应用，以从调控 DNA 序列预测每百万转录本数 (`TPM`) 等定量指标。\n\n![图 3.1 调控 DNA 序列预测和生成模型模型框架概述。(a)\
