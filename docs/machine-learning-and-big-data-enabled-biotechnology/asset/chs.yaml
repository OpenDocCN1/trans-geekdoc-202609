  \ $m_L(t) = C_L(t) \\cdot V(t),$\n\n为了本案例研究，进行了一项计算实验，以检查当前混合模型的优化结果，并使用一个在广泛工条件下经过验证的更全面的混合模型作为“地面真值”（ground-truth）。图\
  \ 14.5 显示了框架 14.14 的优化结果，预测最终叶黄素产量为 290.3 mg，实际最终浓度为 366.0 mg。作为对比，用于构建混合模型的第二个补料分培养实验也设计了\
  \ 12 小时的补料阶段，并实现了 466.8 mg 的总叶黄素产量。虽然由于周期缩短导致总叶黄素产量减少，但优化实验在更短的时间跨内进行（120 小时而非 144\
  \ 小时），并且实现了最高的叶黄素产量 0.702 mg/(g glucose)，而补料培养实验 1 和 2 的产量分别为 0.611 mg/(g glucose)−\
  \ 和 0.675 mg/(g glucose)。从预测的补料速率来看，图 14.5 中显示的逐渐增加的速率在物理意义上是合理的，因为细胞密度的增加对底物的需求更高，以维持更大的细胞密度。\n\
  \n\n\n\n\n图 14.5 中模拟后阶段的模型预测不匹配凸显了在何需要进一步的信息来更好地训练模型。动态模型特别容易受到误差传播的影响（模拟早期的微小误差随着模拟时间轴的延伸而积累，形成更大的偏移）。例如，图\
  \ 14.5 所示的葡萄糖和尿素浓度曲线中，最大的误差出现在 100 小小时之后，这强调了在过程后阶段改进训练的必要性。\n\n这种不匹配的一个原因可能是细胞密度的预测，其拟合的\
  \ `R²` 值为 `0.799`，其中混合模型最初高估了细胞生长，导致了对底物消耗速率的过估。随后，底物消耗速率的过估意味着从 25-30 小时开始，底物浓度通常被低估，从而导致对细胞生长的低估。\n\
  \n细胞密度的预测欠优可能是由于训练数据集的原因；尽管通过 100 个新数据集对数据进行了增强，但图 14.3 显示，时变参数 ![theta Subscript\
  \ mu Sub Subscript max](img/c14-i0028.png)<math display=\"inline\" overflow=\"scroll\"\
  \ xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#952;</mi><mrow><msub><mi>&#956;</mi><mrow><mi\
  \ mathvariant=\"normal\">max</mi></mrow></msub></mrow></msub></math>在增强后的训练集中存在明显的间隙，即在标准化值\
  \ 0.5 到 1.5 之间没有对应时变参数的训练数据，尽管在等式 14.5a 所示的目标函数中使用惩罚项来用以惩罚时变参数的偏离。\n\n此外，整个过程中细胞密度的增加增加了系统对传播误差的敏感性，例如，在补分批培养实验\
  \ 1 中，葡萄糖消耗速率从 24 小时开始补料到 168 小时的最终时间，从 1.91 g/L/h 增加到 6.97 g/L/h，这意味着模拟误差在时间轴的后期对模拟轨迹的影响更大。图\
  \ 14.5 中的补料曲线也显示了类似的趋势，这反映了优化结果中葡萄糖消耗速率随时间的增加，从而增加了模型对底物吸收预测误差的敏感性。\n\n预测性能最差的部分是尿素，其\
  \ `R²` 值为 `-0.115`。然而，这是由于数据集的两个主要局限性：\n1. 如前，![theta Subscript mu Sub Subscript\
  \ max Subscript Baseline comma](img/c14-i0029.png)<math display=\"inline\" overflow=\"\
  scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#952;</mi><mrow><msub><mi>&#956;</mi><mrow><mi\
  \ mathvariant=\"normal\">max</mi></mrow></msub></mrow></msub><mspace width=\"-0.1em\"\
  /><mo>,</mo></math> 的训练中存在间隙，这直接影响了尿素（因为在等式 14.13c 中消耗速率与细胞密度成正比），\n2. 用于训练的两个补分批培养实验都使尿素长时间处于低浓度，这意味着\
  \ `FFNN` 无论 `FFNN` 的输入如何，都会预测高尿素消耗率（因此 ![v Subscript max Underscript upper N Endscripts](img/c14-i0030.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  ><msub><mi>v</mi><mrow><msub><mi mathvariant=\"normal\">max</mi><mrow><mspace width=\"\
  -0.1em\"/><mi>N</mi></mrow></msub></mrow></msub></math>但这并不总是成立。\n\n训练数据集中的低尿素浓度也会抑制\
  \ `FFNN` 识别尿素对生长影响的能力——数据提供的唯一信息是，低尿素浓度下生长仍然可以发生。同样，补分批培养实验 1 中的葡萄糖浓度在 36 小时后保持在\
  \ 4 到 8 g/L 的狭窄范围内，这再次限制了 `FFNN` 充分捕捉葡萄糖对时变参数影响的能力。对尿素和葡萄糖糟糕的预测能力强调了涵盖广泛操作条件数据的必要性。\n\
  \n![图 14.5 使用从框架 14.14 描述的优化框架推导出的最优补料策略，混合模型预测值与真实数据的对比。](img/c14f005.png)\n\n\
  图 14.5 使用从框架 14.14 描述的优化框架推导出的最优补料策略，混合模型预测值与真实数据的对比。\n\n尽管在过程某些短阶段预测性能可能看起来欠优，但必须强调，只有两个补分批培养实验可用于训练，这使得构建高保真模型变得极具挑战性。因此，在这种情况下，混合模型的预测是可以接受的。在可以设计有限实验的情况下，应该进行仔细的实验设计（DOE），以最大化从每个实验中获得的信息。为了未来改进混合模型的预测，可以添加约束条件以减少实验结束时的剩余量。此外，可以通过在优化目标中使用惩罚函数来尝试与现有实验不同的补料策略，鼓励探索更广泛的操作条件，从而强调了基于模型的实验在模型训练和后续过程优化中的重要性。\n\
  \n## 14.4 总结\n\n本章首先介绍了一些关键文献，说明了机器学习在生物工艺开发和优化中的各种应用。观察发现，现有模型通常处于机理（白盒）和纯数据驱动（黑盒）建模之间，并深入解释了它们各自的优缺点。为了同时解决机理和数据驱动建模的局限性并利用各自的优势，作者提出了混合建模（或“灰盒”）的概念，将机器学习集成到机理模型中。探讨了文献中混合模型在生物加工中的若干应用，展示了其增强生物工艺的强大能力。\n\
  \n该章节概述了构建混合模型的全面方法，从基于质量平衡和简单动力学机机理模型开始。对于机模型性能不佳的情况，使用敏感性和不确定性分析来识别最不确定的参数，然后将其重构为时变函数。随后可以使用实验状态变量和控制动作作为输入，训练机器学习模型来估计这些时变参数。文中还提供了神经网络训练的详细步骤，包括正则化、数据增强以及训练集、验证集和测试集的划分。自助法（Bootstrap）也被引入，作为量化混合模型预测不确定性和提高混合模型鲁棒性的策略。\n\
  \n\n\n\n\n本章描述的方法随后被应用于一种小球藻（*Chlorella. sorokiniana*）在异营养补料分培养条件下生产类黄素的详细案例研究。尽管基于\
  \ Monod 动力学的初始建模在细胞密度方面表现良好，但无法准确预测葡萄糖和尿素浓度，因此引入了 `FFNN` 来对三个关键时变参数进行建模：最大比生长速率、最大比葡萄糖摄取速率和最大比尿素摄取速率。混合模型显著优于纯机模型，将关键状态变量的平均\
  \ `R²` 值从 0.219 提高到 0.974。\n\n最后，将混合模型整合到动态优化框架中，以实现 120 小时补料培养过程中类黄素产量的最大化。优化自由度由动态进料速率和底物进料浓度提供，证明了基于模型的优化如何有助于高效识别最佳运行条件。总体而言，产类黄素微藻补料培养过程的建模与优化展示了混合建模在动态生物工艺中的潜力，特别是在数据可用性有限的情况下。虽然本章没有显式探讨，但重要的是，可以采用在线模型更新来纳入新数据并增强预测准确性。同样关键的是可用丰富且多样化的数据集，以确保稳健的混合模型训练。\n\
