  # 5 人工智能预测酶功能\n\n## 5.1 引言\n\n酶在维持细胞过程中起着至关重要的作用，有效地催化代谢、生物合成和稳态。因此，为了彻底理解细胞，识别哪些蛋白质是酶并分析其特定功能至关重要。全基因组测序技术极大地增强了我们通过识别预测编码基因来理解遗传基础的能力，但这些基因的精确功能注释一直是一项挑战。\n\
  \n计算酶功能分类的发展补充了实验方法的局限性。这些计算方法使酶功能预测从局部规模扩展到全基因组分析，显著扩大了其范围和适用性。正如第 4 章所述，酶功能预测的早期计算策略是基于同源性的方法。基于同源的方法通过将未知序列与良好的酶进行比较来识别相似区域，相似序列通常暗示类似的生物学功能。这些方法的有效性得到了广泛认可，但它们严重依赖先验知识，且在许多情况下序列相似性并不对应功能相似性。因此，利用序列或结构中的内在属性进行功能预测的重要性日益增加。人工智能的出现通过学习和捕捉酶特征与其功能之间的复杂关系实现了准确预测。在本章中，我们回顾了使用计算方法预测酶功能的最新进展，涵盖从传统方法到先进深度学习模型。我们重点对该领域进行全面分析，强调基本原理和方法发展。最后，我们讨论了进一步开发基于人工智能的酶功能注释的持续挑战和未来方向。\n\
  \n## 5.2 预测酶功能的传统计算方法\n\n\n\n\n为了预测未知蛋白质是否作为酶发挥并确定其催化活性，最基础且应用广泛的计算方法涉及通过分析它们之间的相似性，将知识从已表征的酶转移到未表征的蛋白质。这种策略自计算机辅助酶表征早期阶段以来被广泛应用[3]。从进化的角度来看，序列相似性高的蛋白质被认为进化自共同的祖先，从而保留了它们的功能[4,\
  \ 5]。\n\n随着全基因组测序技术的进步，蛋白质序列可用性的增加，源自这些序列的氨基酸序列和生物化学特征成为酶功能分类的主要资源。基本局部比对工具（`BLAST`）被认为是生物序列相似性分析的金标准工具[6]。它通过启发式方法衡量一对生物序列的局部相似性，从大型生物数据库中快速识别出与查询序列相似的序列。通过具有统计学显著性的匹配，可以将酶功能分配给查询蛋白质，使得\
  \ `BLAST` 成为蛋白质和酶功能预测领域应用最广泛的工具之一[7–10]。\n\n尽管 `BLAST` 能对具有全局序列相似性的蛋白质序列进行有效搜索，但检测影响酶功能的远程同源序列仍然挑战。为了解决这一局限性，开发了位置特异迭代\
  \ BLAST（`PSI-BLAST`）[11]，这利用位置特异评分矩阵（`PSSM`）的蛋白质序列搜索方法。`PSI-BLAST` 通过迭代执行序列比对以更新\
  \ `PSSM`，该矩阵被用于下一轮迭代，使其能够更好地检测远端同源物并将酶功能知识转移到查询蛋白质。例如，`ModFun` 利用 `PSI-BLAST` 和蛋白质-蛋白质相互作用数据成功预测了\
  \ `CYP7`（一种肽酰-脯氨酰顺反式异构酶）的功能，而这是仅通过 `BLAST` 无法预测的[8]。\n\n生物信息学的进展进一步实现了在功能域细粒度水平上的酶功能分析，扩展到了序列水平分析之外。`Profile-HMM`\
  \ 是一种隐藏马尔可夫模型，它代表了从一组蛋白质的多序列比对（`MSA`）中导出的氨基酸位置特异性频率及其状态转移概率（即匹配、删除和插入）[12]。这种方法能够准确识别通过传统序列比对无法检测的保守序列或功能域[13,\
  \ 14]。源自具有相同功能的酶家族的谱图（Profiles）提供了表征酶功能的功能基序、结构域和家族。将查询蛋白质比对到这些谱图中有助于识别和分析其酶功能[14–16]。因此，基于序列相似性的方法已从简单的全局序列比对进展到通过局部保守序列精确检测与酶活性相关的功能域，实现了计算机辅助的高通量酶功能预测。\n\
  \n## 5.3 使用机器学习预测酶功能\n\n基于同源的方法促使酶功能预测的趋势从实验方法转向*计算机模拟（*in silico*）方法。然而，进化过程的多样性往往会显著降低它们的有效性[17]。例如是趋同进化，它允许蛋白质在序列相似性低的情况下具有相似的功能[18]。另一个例子是散性进化，它诱导蛋白质即使具有高序列相似性也会获得不同的功能[19]。因此，对一种不依赖于相似性的新预测方法有很高的需求。机器学习通过学习数据的内在特征进行预测，已经有效地解决了酶功能预测中的这一需求[20]。\n\
  \n开发高性能机器学习模型必须考虑两个关键因素。第一个是特征提取，涉及确定从原始数据中提取有意义的属性以及如何将它们预处理为机器可读格式。即使使用相同的原始数据集和模型架构，模型性能也可能根据训练特征的选择和处理而产生巨大差异。第二个因素是构建用于有效处理给定特征的机器学习模型。由于各种机器学习算法具有不同的优点和局限性，综合考虑算法的固有属性和训练数据来设计模型至关重要。在本节中，我们探索了从氨基酸序列中提取特征的不同方法，并重点介绍了常用于预测酶功能的机器学习算法。\n\
  \n### 5.3.1 从氨基酸序列中提取酶特征\n\n氨基酸序列是酶特征的根本决定因素，内在编码了其化学、结构和演化信息。源自氨基酸序列的酶特征可以大致分为直接特征和派生特征。直接特征定义为根据氨基酸物理化学性质的统计分析，可以从酶序列中立即提取的特征（图\
  \ 5.1a）。相比之下，派生特征需要对原始序列数据进行额外处理以提取非直观信息，如高阶结构、功能域和演化谱图（图 5.1b）。\n\n氨基酸组成（`AAC`）是一种直接特征，通过计算每个氨基酸序列的频率直直接地表示酶的整个物理化学性质[21]。由于其简单性，它在机器学习方法的早期被广泛使用[22–26]。例如，`AAC`\
  \ 用于训练基于 k 最近邻（`kNN`）算法的酶功能预测模型[25]。同样，设计了一种基于支持向量机（`SVM`）的模型来共同利用 `AAC` 和物理化学性质对酶功能进行分类[26]。然而，`AAC`不足以全面反映蛋白质分子的详细特征。\n\
  \n\n\n\n\n为了解决这一局限性，研究人员利用了从每个氨基酸残基特定属性衍出的各种物理化学特征用于酶功能预测 [[23, 24, 27–30]。物理化学性质与蛋白质功能高度相关，因为它们包含了关于细胞环境中分子相互作用和催化活动的关键信息。目前已开发了多种计算工具，基于统计分析从酶序列中提取并向量化物理化学性质。代表性示例包括\
  \ `Pepstats`、`ProtParam` 和 `PROFEAT` [[31–33].`Pepstats` 计算分子量、等电点、`AAC` 以及脂肪族、芳香族、极性、非极性、带电、碱性和酸性残基的组成\
  \ [[32]。`ProtParam` 返回负电和正电残基的统计值以及每个原子的计数 [[31]。`PROFEAT` 提供了一套全面的物理化学特征，包括 `AAC`、二肽组成、自相关性和氨基酸分布模式，可计算出\
  \ 1,447 个描述符值 [[33]。当这些计算特征与机器学习模型结合时，它们对酶功能的分类非常有效 [[28–30]。例如，`ECPredred` 利用 `Pepstats`\
  \ 提取蛋白质特征，随后用于训练 `SVM` 以进行酶委员会编号（`EC number`）预测 [[29]。然而，`AAC` 和物理化学特征都无法提供酶序列中每个氨基酸的位置信息。伪氨基酸组成（`PseAAC`）是\
  \ `AAC` 的扩展，它结合了相邻氨基酸之间的相关性，从而解决了这个问题。由于氨基酸的物理化学性质被用于计算这些相关性，`PseAAC` 可以同时代表酶的物理化学性质和局部序列顺序信息\
  \ [[34, 35]。\n\n![图 5.1 基于人工智能的酶功能预测中从氨基酸序列中提取特征的示意图。(a) 直接特征提取的图形方案。`AAC` 代表每个氨基酸在酶序列中的出现频率。蛋白质的物理化学特征根据每个氨基酸的各种内在属性（例如：分子量、极性、等电点、原子组成和带电残基）决定。可以使用\
  \ `Pepstats`、`ProtParam` 和 `PROFEAT` 等统计工具进行特征向量提取。(b) 派生特征提取的图形方案。二级结构组成量化了酶中局部折叠模式的频率。功能域组成表示为指示功能域存在与否的向量。可以使用\
  \ Pfam 和 InterPro 等多个数据库。(c) pLM 的构建和利用的图形方案。在预训练阶段，输入序列在残基水平被掩盖并输入编码器层以嵌入隐藏表示。模型通过利用未掩盖残基的特征来训练预测掩盖残基，这允许\
  \ pLM 学习通用的序列上下文。训练后，从 pLM 编码器提取的隐藏表示可以反映蛋白质的内在特性，作为下游任务的有用起点](img/c05f001.png)\n\
  \n图 5.1 特征提取的示意图...\n\n(a) 直接特征提取的图形方案。`AAC` 代表每个氨基酸在酶序列中的出现频率。蛋白质的物理化学特征根据每个氨基酸的各种内在属性（例如：分子量、极性、等电点、原子组成和带电残基）决定。可以使用\
  \ `Pepstats`、`ProtParam` 和 `PROFEAT` 等统计工具进行特征向量提取。(b) 派生特征提取的图形方案。二级结构组成量化了酶中局部折叠模式的频率。功能域组成表示为指示功能域存在与否的向量。可以使用\
  \ Pfam 和 InterPro 等多个数据库。(c) pLM 的构建和利用的图形方案。在预训练阶段，输入序列在残基水平被掩盖并输入编码器层以嵌入隐藏表示。模型通过利用未掩盖残基的特征来训练预测掩盖残基，这允许\
  \ pLM 学习通用的序列上下文。训练后，从 pLM 编码器提取的隐藏表示可以反映蛋白质的内在特性，作为下游任务的有用起点。\n\n虽然直接特征很容易提取和解释，但仅依赖这些特征可能不足以准确捕捉酶的功能特性。派生特征包括了非直观的信息，例如结构和演化特性，这通常需要对氨基酸序列进行额外的预处理。例如，结构和功能元素的组成为酶的功能提供了宝贵的见解，尽管这需要额外的计算处理，且从原始序列中提取往往复杂。二级结构组成代表多肽骨架的局部构象，可以使用\
  \ `STRIDE` [[36] 和 `PSIPRED` [[37]。例如，从 `STRIDE` 获取的二级结构组成用于训练 `SVM` 模型来分类酶类型，结合了额外的结构特征（例如：表面积、二硫键、表面\
  \ `AAC`）和物理化学性质（例如：`AAC`、辅因子类型、金属离子）[27]。功能域组成量化了特定域在蛋白质序列中的出现频率，利用了来自 Pfam 和 InterPro\
  \ 等蛋白质域数据库的信息 [[38, 39]。由于功能域与蛋白质的生物功能密切相关，这一特征已广泛应用于酶功能预测 [[40–42]。例如，`ECS` 是一个基于\
  \ Pfam 功能域组成训练的 `SVM` 模型，成功地将蛋白质序列分类为六类酶 [[40]。每个序列被表示为 2657 维的二进制向量，对应于 Pfam 数据库中功能域的存在与否。\n\
  \n\n\n\n源自传统同源性方法的演化特征也被用于训练机器学习模型，以准确预测酶功能。例如，在 `ECPred` 中，源自 `BLAST` 搜索的同源性评分用于训练\
  \ `kNN` 模块，根据高分序列的功能分类来预测酶功能 [29] 。另一个例子是 `EzyPred`，它使用 `PSSMs` 来提供与蛋白质序列中演化保守区域相关的详细信息\
  \ [43。\n\n### 5.3.2 基于机器学习的酶功能预测算法\n\n各种机器学习算法采用不同的策略来处理输入数据。因此，选择合适的机器学习算法来有效分析给定特征的特性至关重要。在酶功能分类中，三种最常用的机器学习方法类型是基于实例的、基于边界的和基于树的算法。基于实例的算法直接从现有数据得出预测，而不对显式模型进行参数优化。`kNN`\
  \ 是这类算法的代表性示例，它通过相应特征空间内的最近邻推断出主要的酶功能分类 [44]。例如，基于 `InterPro` 的功能域组成衍生的特征向量可以计算每个酶的距离，以便进行基于\
  \ `kNN` 的预测 [41]。另一个例子是源自 `PSSM` 的特征向量被用于计算每个蛋白质序列的距离，用 `kNN` 预测六种 `EC` 编号的酶类（即\
  \ `EC` 编号的第一位数字） [45]。一些先进的 `kNN` 算法也被用于更好地捕捉生物特征与标签之间的歧义关系。例如，优化的证据理论 `kNN` 被用于考虑影响决策过程的相邻数据的可靠性\
  \ [43, 24, 26, 27, 29, 30, 40]。例如，`EC` 编号和蛋白质家族的分类是通过 [23] 进行的。\n\n\n\n\n\n人工神经网络（`ANNs`）通过模拟人脑神经元间通过突触进行的信息传递而开发，是所有深层神经网络的基础算法\
  \ [52]。几十年来，`ANNs` 一直用于捕获复杂的非线性数据模式，能够分析蛋白质序列与其功能之间的非线性关系 [53, 54]。例如，在已知结构域组的序列相似性上训练的\
  \ `ANNs` 可以预测输入蛋白中的功能结构域，即使对于那些序列相似性的蛋白质也是如此，而这对于传统的 `BLAST` 搜索是挑战性的 [55]。同样，`ProtFun`\
  \ 被开发为 `ANNs` 的集成模型，根据各种物理化学性质（包括疏水性、带电氨基酸数量和二级结构）来预测酶的功能类别 [56]。尽管早期 `ANNs` 的使用受限于计算能力而仅浅层网络架构，但它们的出现具有重要意义，因为它们形成了所有后续先进深层神经网络的基础。\n\
  \n在基于深度学习的酶预测模型中，`EC`编号和`GO`术语通常用作模型训练的目标标签。`EC`编号是酶功能分类分类方案之一，它将酶的一般功能分配给特定的数字\
  \ [57]。`EC`编号在一个分级系统中由由点分隔的四个数字组成，越靠近`EC`编号的末尾，功能信息越详细。第一个数字是酶类，根据酶执行的主要反应分配，分类为氧化还原酶（`EC:1`）、转移酶（`EC:2`）、水解酶（`EC:3`）、裂解酶（`EC:4`）、异构酶（`EC:5`）、连接酶（`EC:6`）和转运酶（`EC:7`）。酶的功能通过第二和第三个数字进一步描述，称为“亚类”（`subclass`）和“亚亚类”（`sub-subclass`），提供了更详细的功能角色。最后一个数字表示酶反应的底物类型。例如，`EC:3.4.11.4`表示作用于肽键的水解酶，从多肽或蛋白质上切下氨端残基。基因本体（`GO`）术语作为一种基因功能分类系统，也从分子功能、细胞组分和生物学过程方面描述蛋白质属性。每一类`GO`术语都代表分子水平的活动、这些功能发生的细胞位置以及由多个分子水平活动执行的大规模生物学过程。通过标记多个`GO`术语并进行分级链接，该系统提供了更详细的描述和复杂的关系，结构为有向无环图。\n\
  \n随着计算能力的突破、新型神经网络架构的发展以及大数据的到来，各种深层神经网络架构被开发出来以提高学习效率。此类神经网络在预测酶功能方面表现出了强大的性能。基本上，深层神经网络从氨基酸序列和/或来自序列的特征中学习，识别酶固有的模式\
  \ [1]。在本节中，我们将讨论用于预测`EC`编号和`GO`术语的深度学习模型的最新进展，重点关注其有效处理酶数据的架构。\n\n### 5.4.1 卷积神经网络\n\
  \n卷积神经网络（`CNNs`）最初开发用于通过通道和卷积核来学习图像输入的模式，其中卷积核根据卷积核尺寸压缩相邻的像素 [58]。这些卷积层通过卷积核与输入局部区域之间的乘法和加法，有效地捕获局部特征模式（图\
  \ 5.2）。`CNNs`的这些特性也可以应用于学习酶序列的局部上下文，从而增强酶功能预测的性能。通过利用`CNNs`，开发了多种基于深度学习的工具来预测`EC`编号和/或`GO`术语\
  \ [59–66]。一个著名的例子是`DeepEC`，该模型结合使用基于`CNN`的模块和同源分析模块来预测酶的`EC`编号 [63]。`DeepEC`分两步运行：首先，三个`CNN`子模块并行预测输入序列是否为酶、前三个数字的`EC`编号以及第四位数字。然后，如果`EC`编号无法一致地预测（即预测到第三位数字和第四位数字的不一致），`DeepEC`通过采用基于序列相似性的同源分析来分配`EC`编号。另一个例子是`ECPICK`，它也利用三个并行的卷积层以及四个分级层，分别预测`EC`编号的每个数字\
  \ [67]。分级层执行两种预测：从最后一个隐藏表示一次性对四个数字进行全局预测，以及从同一层的隐藏表示逐顺序对每个数字进行局部预测。最终的预测概率是这两个预测的加权平均值。\n\
  \n还利用`CNNs`和氨基酸序列开发了预测`GO`术语作为酶功能的模型。例如，`DeepGOPlus`将氨基酸序列作为输入并将其嵌入维度为(21, 2000)的热编码向量中，分别代表氨基酸类型和序列长度\
  \ [65]。热编码简化了来自序列的信息，在嵌入过程中不需要复杂的计算或可学习参数。对于超过 2000 个氨基酸残基的输入蛋白质，保留前 2000 个残基，而较短的序列在热编码向量中填充零。然后将热编码向量输入\
  \ 16 个卷积层，随后是最大池化层和全连接层，以预测每个`GO`术语的概率。卷积层由于其平移不变性，能够从图像等二维输入中提取特征，使其广泛应用于开发从热编码向量预测`GO`术语的深度神经网络。另一个模型`ProteInfer`通过采用空洞卷积层以低计算成本识别更广泛的上下文，并利用残差层确保神经网络在训练期间的稳定性，来同时预测`GO`术语和`EC`编号\
  \ [66]。`ProteInfer`利用这些优势有效地预测多标签序列（即多功能酶）。\n\n\n\n\n\n与用于捕捉图像局部模式的 `CNNs` 不同，循环神经网络（`RNNs`）的设计目标是为了处理序列数据，例如自然语言。`RNNs`\
  \ 逐个读取每个标记（例如自然语言中的单词和蛋白质中的氨基酸残基），并使用内部记忆保留来自之前标记的信息。受到类似于自然语言的，蛋白质性质主要由氨基酸的顺序决定的启发，`RNNs`\
  \ 已被用于从蛋白质序列中提取全局上下文（图 5.3）[60, 64, 68–70]。例如，`DEEPre` 通过集成 `CNNs` 和随后的长短记忆网络（`LSTM`，一种\
  \ `RNN` 类型）而开发出来\\[60\\]](#c05.xhtml#c05-bib-0060)。`DEEPre` 将依赖序列长度的特征作为 `CNNs`\
  \ 的输入，以捕捉酶序列的局部上下文。然后通过 `LSTM` 从压缩的卷积特征导出全局表示。该全局表示与序列长度无关的特征拼接，以预测输入序列的 `EC number`。`DEEPre`\
  \ 使用针对每个数字位预测专门训练的子模型，分层预测 `EC number` 的每一位数字。`mlDEEPre` 是 `DEEPre` 的扩展，通过估算 `EC\
  \ numbers` 中所有数字的概率来预测多标签酶\\[61\\]](#c05.xhtml#c05-bib-0061)。`mlDEEPre` 执行四阶段预测：(1)\
  \ 确定输入蛋白质是否为酶，(2) 识别酶的多谱性，(3) 预测 `EC number` 的第一位，以及 (4) 预测完整的四位 `EC number`。\n\n\
  ![图 5.3 在残基水平提取蛋白质全局特征的 RNN 方案。第一个残基的特征输入到第一层。这些特征的输出随后顺序馈到下一层，与第二个残基的特征合并。这种机制一直持续到序列末尾，从\
  \ RNN 的最后一层获取全局表示。](img/c05f003.png)\n\n图 5.3 在残基水平提取蛋白质全局特征的 RNN 方案。第一个残基的特征输入到第一层。这些特征的输出随后顺序馈到下一层，与第二个残基的特征合并。这种机制一直持续到序列末尾，从\
  \ RNN 的最后一层获取全局表示。\n\n`RNNs` 是预测预测 `EC numbers` 还有 `GO terms` 的有效神经架构。例如，`UDSMProt`\
  \ 是一个由应用了自监督预训练的 `LSTM` 组成的模型，它可以同时预测 `EC numbers` 和 `GO terms`\\[68\\]](#c05.xhtml#c05-bib-0068)。`UDSMProt`\
  \ 首先在未标记的蛋白质序列数据库上进行训练，根据先前的残基预测下一个残基，这使得模型能够学习通用的蛋白质序列上下文。在进行此类自监督预训练后，在冻结了预训练参数的\
  \ `LSTM` 层末尾添加全连接层，并在标记数据集上再次训练，以根据输入序列的 `EC numbers` 和 `GO terms` 对酶功能分类。\n\n###\
  \ 5.4.3 Transformer 和蛋白质语言模型\n\n虽然 `RNNs` 对于处理序列数据非常有价值，但这种架构存在一个根本性的缺点：随着序列通过 `RNNs`，初始信息会逐渐衰减。然而，`transformer`\
  \ 架构的出现（其设计用于捕捉自然语言中标记之间的长程依赖）通过同时识别标记对之间所有的关系和影响解决了这一局限性\\[71\\]](#c05.xhtml#c05-bib-0071)。`transformer`\
  \ 架构也从自然语言与蛋白质序列之间的相似性中启发，推动了蛋白质科学的边界。在蛋白质中，`transformer` 架构对于学习残基之间的关系特别有效（图 5.4）\\\
  70, 72–81]。\n\n为了利用 `transformer` 架构的优势以及存储在各种数据库中的海量蛋白质数据\\82, 83]，蛋白质语言模型（`pLMs`）应运生，模仿了通过掩码语言模型预训练的类似\
  \ `BERT` 的模型（图 5.1c）\\[84\\]](#c05.xhtml#c05-bib-0084)–96。例如，`ESM` 构建具有 6.5 亿参数，并在\
  \ `UniRef50` 数据库的序列上进行训练，通过应用掩码语言模型来学习残基之间的进化关系（例如共进化、接触等）\\[85\\]](#c05.xhtml#c05-bib-0085)。最近，`ESM`\
  \ 更新为 `ESM3`，它在蛋白质的各个方面（如序列、结构）上进行了训练\\[96\\]](#c05.xhtml#c05-bib-0096)。另一个模型 `ProtT5`\
  \ 设计为预训练 `pLM`，通过掩码连续结构域而非单个残基来执行下游任务\\[87\\]](#c05.xhtml#c05-bib-0087)。`ProstT5`\
  \ 在保持 `ProtT5` 架构的同时，使用 `3Di` 标记支持双向转换（从结构到序列，或反之），并整合了结构信息\\95,97]。从这些 `pLMs` 中提取的嵌入作为下游应用的基础，有效地表示了内在模式和特征。例如，`DeepECtransformer`\
  \ 利用 `transformer` 层和 `CNNs` 来预测 `EC numbers`\\[72\\]](#c05.xhtml#c05-bib-0072)。`transformer`\
  \ 层由来自 `ProtBERT` 模型的两个后续自注意力编码器组成，将输入的氨基酸序列嵌入为隐藏表示\\[87\\]](#c05.xhtml#c05-bib-0087)。通过\
  \ `transformer` 层转换后的隐藏表示被馈入连续的 `CNN` 层，有效地学习输入酶的局部和全局特征。`DIAMOND` 是同源搜索算法的工具，在神经网络无法预测输入酶的\
  \ `EC number` 时补充 `DeepECtransformer`，根据同源酶分配 `EC numbers`\\[98\\]](#c05.xhtml#c05-bib-0098)。得益于\
  \ `transformer` 层，`DeepECtransformer` 与之前的 `EC number` 预测工具相比展现了更卓越的性能。\n\n\n\n\n\
  \nTransformer 架构和 pLMs（蛋白质语言模型）的出现也影响了 GO 术以及 EC 号的预测。例如，`PFresGO` 首先使用蛋白质序列和 GO\
  \ 术嵌入作为输入。蛋白质序列被转换为两种表示：从输入序列的 one-hot 编码提取的特征，以及从 `ProtT5` 模型编码器中提取的嵌入[73, 87]]。这些表示被求和，并与\
  \ GO 术嵌入一起输入 Transformer 的多头交叉注意力层，以学习输入序列中的每个残基与哪个 GO 术相关性较高。另一个例子是 `PhiGnet`，它利用\
  \ `ESM-1b` 模型作为神经网络阶段，将输入的酶序列转换为隐藏表示[85, 99]]。隐藏表示使用两种类型的图神经网络（`GCNs`）进行处理：一种捕捉代表两个共变位点处成对残基之间关系的进化耦合，另一种则将残基社区识别为识别基残基间的层次化相互作用。基于这些关系（即图中的边），表示中的相应特征被更新，并用于预测\
  \ EC 号和 GO 术。\n\n同样，蛋白质结构信息也被用于预测 GO 术，因为蛋白质的三维结构通常决定了其在催化、分子运输和其他功能中的作用。最近的一项研究开发了\
  \ `ESM-S`，这是一种结合了结构信息的 `pLM`[[81\\]](#c05.xhtml#c05-bib-0081)]。`ESM-S` 基于 `ESM2`\
  \ 构建，后者在序列数据库上通过掩码语言模型（即预测序列中的被掩码的标记）进行预训练，并进一步在远程同源性检测数据集上进行训练，以学习结构信息。从 `ESM-S`\
  \ 学习到的表示不仅在 GO 术预测中表现出性能提升，在 EC 号预测任务中也是如此，这凸显了结构信息对酶功能分类的重要性。`PredGO` 结合了从 `pLM`\
  \ 学习的表示、蛋白质蛋白质相互作用网络以及三维结构信息来预测 GO 术，强调了利用异构数据源如何增强 GO 术预测的性能[[100\\]](#c05.xhtml#c05-bib-0100)]。为了在预测\
  \ EC 号时反映结构信息，最先进的 EC 号预测模型 `MAPred` 利用 `ESM` 和 `ProstT5` 作为预训练模型，分别基于序列和结构提取嵌入[80,\
  \ 93, 95]]。`MAPred` 采用采用交叉注意力机制来交织序列和 `3Di` 表示以提取全局特征，同时使用不同卷积尺寸的卷积层进行局部特征提取。最后，`MAPred`\
  \ 将全局和局部特征拼接，并输入多层感知器以分层预测 EC 号的数字。\n\n机器学习训练方案的进步也通过深度学习改变了酶的功能分类。研究人员使用了监督学习，这是一种机器学习方法，通过在标记数据上训练模型来对新输入进行预测或分类。然而，`CLEAN`\
  \ 通过对比学习进行训练，以确保功能相似的酶在潜空间中更加接近。\n\n### 5.4 图神经网络\n\n随着深度学习的发展，`AlphaFold` 和 `RoseTTAFold`\
  \ 开创了高置信度的结构预测先河[101, 102]。随着蛋白质结构数据可用性的增加，信息已成为预测 EC 号的关键[103]。图神经网络（`GNNs`）适用于结构数据，节点（例如原子或残基）和边（例如空间距离、顺序等）定义如（图\
  \ 5.5）[92, 99, 100, 104–111]]。例如，`GraphEC` 利用 `ProtTrans` 提取嵌入并利用 `ESMFold` 生成三维蛋白质结构[87,\
  \ 93, 111]]。节点和边分别由残基和相邻残基之间的关系定义。使用这种 `GNN`，模型预测输入酶的三种输出：活性位、最 pH 和 EC 号。对于 EC\
  \ 号预测，`GraphEC-AS` 的训练之前是预测输入酶的活性位，使用了加权残基。由 `GNN` 嵌入的隐藏表示通过池化进行压缩，从而预测 EC 号。`GraphEC`\
  \ 还使用标签扩散来平衡预测结果与源自同源物的标签。\n\n三维蛋白质结构数据可用性的增加也为预测 GO 术提供了有用信息。`DeepFRI` 利用酶的序列和结构信息来预测\
  \ GO 术[[106\\]](#c05.xhtml#c05-bib-0106)]。对于这项任务，`LSTMs` 用于嵌入输入酶的序列，并根据先前的残基预测下一个氨基酸。三维蛋白质结构生成接触图以识别空间接近的残基对，从而在残基水平构建蛋白质图。`GCN`\
  \ 作为 `GNN` 的一种，通过反映 `LSTMs` 的表示和接触图的边来更新每个残基的特征。在另一种方法中，`TransFun` 采用了由 `AlphaFold2`\
  \ 预测的蛋白质结构，后者创建了指示蛋白质中每个残基相邻残基的邻接矩阵[[109\\]](#c05.xhtml#c05-bib-0109)]]。等变 `GNNs`\
  \ 被用于预测 GO 术，节点和边特征分别由 `ESM-1b` 的嵌入和相邻残基之间的关系定义。\n\n\n\n\n\n![图 5.5 从蛋白质结构创建图以及在残基水平进行消息传递的\
  \ GNN 过程。](img/c05f005.png)\n\n图 5.5 从蛋白质结构创建图以及在残基水平进行消息传递的 GNN 过程。蛋白质图通过蛋白质结构的原子坐标构建，将残基定义为节点，并将相邻残基之间的关系定义为边，其中相邻残基被定义为预定义距离内的残基。在消息传递阶段，每个残基通过聚合相邻残基的特征来更新其表示，使得残基能够包含来自邻居的信息。这允许\
  \ GNN 高效地学习结构信息，强调空间特征。此外，根据节点和边的定义方式，GNN 可以从蛋白质图中捕捉多样的几何和空间特征。\n\n随着大量的蛋白质三维结构数据可用，在类似于蛋白质序列的蛋白质结构上预训练深度学习模型已被用于显式捕捉对于确定蛋白质功能至关重要的空间信息。例如，`GearNet`\
  \ 是一个在 `AlphaFoldDB` 上预训练的 `GNN`，它可以预测 EC 编号和 GO 术语 [90, 94]。与使用掩码语言模型在序列数据上预训练不同，在结构数据上预训练更为复杂。为了应对这一挑战，`GearNet`\
  \ 采用了多视图对比学习，该方法将同一蛋白质的不同视图（即子序列和子结构）与其他蛋白质视图区分来，并将生物相关的子结构紧密地嵌入潜空间中。尽管预训练数据集包含不到百万的数据点（远小于用于\
  \ `pLMs` 的数百万到数十亿蛋白质序列），但 `GearNet` 在 EC 编号和 GO 术语预测的下游任务中表现出高预测性能，凸显了基于结构的蛋白质功能分析的潜力。\n\
  \n`Gs` 也可以用于学习蛋白质蛋白质相互作用网络的信息，在网络中蛋白质之间的关系是一个重要因素，因为很难独立确定蛋白质的作用（例如在 GO 术语的背景下）。`DeepGOGAT-SE`\
  \ 使用图注意力网络（一种 `GNN`）设计，以应用源于蛋白质蛋白质相互作用的图结构，并采用 `ESM2` 模型提取序列派生的嵌入作为输入 [78]。`DeepGOGAT-SE`\
  \ 通过有效整合从 `ESM2` 学习的表示与源于蛋白质蛋白质相互作用网络的泛上下文，在 GO 术语分类中实现了高性能。\n\n## 5.5 结语\n\n在本章中，我们介绍了酶的功能分类，并介绍了使用计算学习算法的各种预测方案的发展和进展（表\
  \ 5.1）。传统的机器学习算法最初被用于计算资源预测酶功能。随着各种分类方案（如 `kNN`、`SVM` 和随机森林）的设计，基于机器学习的模型在以蛋白质派生特征作为输入时变得更加可靠，但但也遇到了一些局限性，包括数据质量、特征提取、计算资源以及传统算法的参数限制。为了应对这些挑战，深度学习方法随着图形处理器等计算设备的进步而运而生，显著扩大了计算生物学的领域。因此，我们讨论了多种最初为其他领域设计的神经网络，但现在由于具有共同特征（如图像中的空间局部性和自然语言的顺序性）而被应用于生物学。\n\
