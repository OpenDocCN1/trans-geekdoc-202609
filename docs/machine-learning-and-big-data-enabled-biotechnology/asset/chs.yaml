  \ stretchy=\"false\">)</mo></mrow></mrow><mi mathvariant=\"italic\">dt</mi></mfrac><mo>=</mo><msub><mi>&#956;</mi><mi>max</mi></msub><mo>&#183;</mo><mfrac><mrow><msub><mi>C</mi><mi>S</mi></msub><mrow><mo\
