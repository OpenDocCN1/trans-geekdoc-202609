  \ |\n\n#### 1.5.3.1 生长速率预测\n\n验证的关键节点是评估预测准确性，并将预测的生长速率（通过生物量反应最大化）与实验量的生长速率进行比较。这直接反映了模型在多大程度上反映了细胞的整体代谢能力以及生物量反应的合理性。预测与观察生长之间的偏差可能意味着模型构建不当、约束缺失或生物量反应构建不准确。\n\
  \n#### 1.5.3.2 氨基酸依赖型\n\n氨基酸依赖（生物无法合成生长所需的氨基酸）可以通过限制特定氨基酸的交换反应，并观察运行 FBA 生物量最大化时模型是否变得不可行来评估。这模拟了生物无法产生特定氨基酸的情况，反映了其对外部的依赖。准确的模型应该正确预测已知的依赖型，即缺乏必需营养将导致生物无法生存。\n\
  \n\n\n\n\n例如，在 CHO 细胞中，已有报道其对脯氨酸、胱氨酸和精氨酸等氨基酸存在营养缺陷。在一项研究中，作者通过限制这些氨基酸的交换反应评估了多个\
  \ CHO 模型 [91]。对这些模型进行了测试，以观察当脯氨酸、胱氨酸或精氨酸缺失时生长是否受到抑制，从而反映了已知的营养缺陷。对这些依赖关系的准确预测表明，该模型成功捕捉了\
  \ CHO 细胞的代谢需求，使其成为工业应用中优化培养条件或提高菌株稳健性的有用工具。\n\n### 1.5.3.3 基因必需性\n\n基因必需性分析是验证基因组规模模型的关键方法，通过确定基因的失活是否会导致模型所预测的细胞死亡。这是通过删除与特定基因相关的反应并测试模型的生存能力来实现的。该过程模拟了编码必需酶或代谢功能的基因的敲除，允许研究人员评估模型是否准确预测了生物在此类条件下的生存情况。\n\
  \n为了验证这些预测，通常会将计算机模拟（*in silico*）的基因敲除与实验结果进行比较，例如通过 CRISPR 敲除筛选产生的结果。CRISPR 技术能够在体内（*in\
  \ vivo*）精确删除基因，提供关于哪些基因对细胞生存至关重要的实验数据 [92]。稳健的模型将正确预测这些必需基因，而差异可能表明模型存在缺陷，例如缺失通路或调节信息不。例如，大肠杆菌的\
  \ `iML1515` 模型在含有 16 种碳源的最小培养基下测试时，预测基因必需性的准确性达到了 93.4% [93]。计算预测与实验数据之间这种高度的一致性强调了该模型的质量，以及基因删除筛选在验证基因组规模模型和识别模型可改进领域方面的效用。\n\
  \n### 1.5.3.4 已知宿主特性\n\n还可以通过模型重现宿主生物已知代谢或生理特征的能力对模型进行基准测试。例如，酵母中的克拉伯树效应或癌症细胞中的瓦博格效应是记录详备的特性，准确的基因组规模模型（GEMs）应当捕捉到这些特性。此外，氨基酸、葡萄糖或代谢产物的吸收和分泌谱可以直接与细胞代谢组学数据进行比较。模型能够在不过拟的情况下复制越多特性，对其生物真度的信心就越高。\n\
  \n### 1.5.3.5 胞内预测准确性\n\n基因组规模模型的一个关键方面是预测胞内通量的能力，这为基因组水平上的细胞代谢状态提供了见解。这些预测使研究人员能够详细理解代谢，促进工业过程的设计和优化菌株的工程。为了确保这些预测是可靠的，验证模型准确预测胞内通量的能力至关重要。\n\
  \n这种验证的最有效方法之一是与实验 ¹³C 代谢通量分析（MFA）数据进行比较。通过引入 ¹³C 标记底物并追踪其整合到代谢产物中，研究人员可以得出细胞内的实际通量分布，为与\
  \ GEM 预测对比提供稳健的数据集 [94, 95]。\n\n由于使用 `FBA` 在 GEM 中模拟代谢时存在多重最优解的问题，建议将通量采样作为生成胞内通量预测的方法（见\
  \ 1.4.3 节）。通量采样产生一系列可能的解，允许研究人员评估通量分布的可变性，而不是依赖于单一最优解。可以将这些采样的通量分布与 ¹³C-MFA 结果进行比较，以评估模型预测的准确性\
  \ [96]。\n\n这种方法已成功应用于工业相关细胞。在一项研究中，研究人员将 CHO 细胞 GEM 的通量预测与 ¹³C-MFA 数据进行了比较，为模型预测细胞代谢活动的可靠性提供了见解\
  \ [91]。这些比较对于确保模型在引导细胞工程和优化生物技术工艺中的作用至关重要，必须是任何模型评估工作流的一部分。\n\n## 1.5.4 迈向多层、多尺度代谢网络\n\
  \n虽然 GEM 为代谢建模提供了一个强大的框架，但它们只捕捉了细胞功能的一个层。事实上，生物系统通过多种过程的相互作用运行，包括转录、翻译、信号传递和调节。为了更完整地理解细胞行为，重点在于开发将这些生物过程与代谢网络整合的多层和多尺度模型，如图\
  \ 1.5\n\n### 1.5.4.1 集成基因调节网络\n\n虽然代谢网络提供了一种整合组数据以模拟细胞行为和评估遗传扰动的极佳方法，但它们没有捕捉任何调节交互。例如，大肠杆菌有数百个\
  \ `TF`，可以以组合的方式开启或关闭基因。在更复杂的生物中，这些调节过程扩展到控制细胞行为的无数翻译后和转录后相互作用。\n\n\n\n\n将转录调控整合到代谢模型的第一种方法是调控通量分析（rFBA）[79，它将布尔调控网络与\
  \ FBA 结合。调控约束（例如转录因子 TF 的存在或缺失）被用于开启或关闭反应，从而能够模拟动态环境条件下调控效应对代谢的影响。尽管在逻辑层上较为简单，但\
  \ rFBA 提供了一种包含基因调控的可行方法，并已应用于大肠杆菌（*E. coli*）、结核分枝杆菌（*M. tuberculosis*）和酿酒酵母（*S.\
  \ cerevisiae*）。\n\nPROM [88] 通过放松布尔逻辑并估计调控基因/TF 激活的概率，然后相应调整相关反应的通量边界，对 rFBA 改进。这种概率框架已应用于多种生物，包括结核分枝杆菌（*M.\
  \ tuberculosis*），根据转录图谱提供特定特异性的代谢预测。其他方法还包括 IDREAM [97、SR-FBA [98、iFBA [99 以及 TRFBA\
  \ [100]。\n\n### 1.5.4.2 整合转录与翻译\n\n除了转录调控外，转录和翻译通过其对大分子合成所需的代谢前体（如 RNA、氨基酸、ATP）的依赖与代谢相互作用，而产生的蛋白质则催化代谢反应。捕捉这种依赖关系可以施额外的约束，并对代谢网络提供更深层次的见解。\n\
  \nME 模型通过将基因组模型（GEMs）与产生代谢酶所需的转录和翻译机制相结合来解决这个问题 [35, 36]。这些模型对代谢施加了全局的、生长相关的调控约束，在预测生长、代谢通量和基因表达水平等表型方面表现优于独立的\
  \ GEMs [36]。ME 模型没有显式地捕捉特定的调控机制，这是开发多尺度 ME 模型的一个重要领域。\n\n### 1.5.4.3 整合信号通路网络\n\n\
  细胞通过调整基因表达和代谢活性来响应环境的变化，这一过程受到信号转导通路的严密协调。这些通路将外部信号传递给细胞内靶，影响调控网络和代谢网络。将信号通路整合到代谢和调控模型中可以提供背景并施加额外约束，提高预测准确性。然而，重构细胞内信号网络仍然是一项重大挑战，只有少数的生物具有大规模的图谱\
  \ [99, 101]。由于对这些途径进行独立表征既耗时又耗资源，一种更具扩展性的方法是利用高通量数据集来推断环境变化如何影响细胞协调。\n\n### 1.5.4.4\
  \ 多细胞与多组织模型\n\n生物功能往往不是源于孤立细胞，而是源于跨组织和细胞类型的协调相互。因此，人们对将 GEMs 扩展到单细胞水平以上以模拟多细胞和多组织系统越来越感兴趣。一种方法是通过共享的细胞外间隙连接多个组织特异性的\
  \ GEM，从而模拟跨器官的代谢产物交换 [102]。这种策略已应用于人类的全体代谢模型，其中肝脏、肌肉、脂肪和肠道模型相互作用，以研究系统性代谢，例如糖尿病或饥饿反应\
  \ [103]。\n\n在生物技术背景下，研究涵盖了共培养微生物细胞培养 [104]，以及结合哺乳动物和微生物 GEMs 来研究宿主-微生物群的相互作用 [105]。癌症研究利用肿瘤-基质模型来捕捉营养竞争和微环境效应\
  \ [106]。人类代谢图谱等资源通过提供组织特异性数据和策划的反应集，促进了此类模型的构建 [107, 108]。\n\n### 1.5.4.5 多尺度生物反应器模型\n\
  \n上述章节中，“多尺度”指的是对生物过程进行分层以获得更深层次的见解。在生物技术背景下，增加一个额外的尺度——生物反应器是明智的。为了将分子模型与群体或生物反应器行为连接起来，多尺度模型将细胞内网络与描述生长、营养消耗的较高级过程模型相结合\
  \ [109–113]。为了使这些模拟具有计算可行性，通常使用降阶模型或简化的 GEMs 来替代全尺度模型。动态 FBA (dFBA) 方法 [114] 将随时间变化的环境与离散间隔的\
  \ FBA 模拟相结合。模型简化技术（如基本模式分析或使用核心子网络）在保留关键代谢特征的同时允许快速模拟 [115]。由于细胞在培养中由于异步生长、细胞周期状态和位置表现出代谢活动的异质性，可以使用群体平衡模型\
  \ [116]。\n\n## 1.6 从预测到生物技术的行动\n\n代谢网络和基于约束的模型为模拟代谢提供了强大的工具，但其真正的价值在于实现工业生物技术中的应用。本节重点于将计算机预测转化为代谢工程、工艺设计和生物工艺控制的实际策略。为了进一步增强这些策略，混合方法正被采用。\n\
  \n基于网络的生物背景和结构与数据驱动方法的模式识别优势相结合，提供了更强的预测能力和可解释性。混合方法主要用于两种方式：使用数据驱动的预测来提供信息并约束网络模型，或者将网络模型的输出作为数据驱动算法的特征（总结见图\
  \ 1.6）。这两种策略为深化生物见解和提高模型在生物技术中的用途提供了互补途径。在接下来的部分中，我们将介绍几个展示其应用的关键案例。\n\n### 1.6.1\
  \ 代谢工程\n\nGEMs 将生物知识形式化，并能够在计算机上对代谢工程策略的设计和定量比较。它们在选择子集进行实验研究之前，是筛选此类策略的智能测试平台，因为它们捕捉了系统的复杂性以及作为候选对象的复杂化学反应网络。通过整合大型数据集并创建自定义\
  \ GEMs，人员随后可以使用各种新型优化算法进行靶点识别，如[表 1.3](#c01.xhtml#c01-tbl-0003）所示，从而减少实验方法的试错成本并加速改良菌株的开发。\n\
  \n\n\n\n![图 1.6 总结了如何将数据驱动和机制化方法相结合，以在生物技术中产生见解的示意图。混合可以先是机制化的，意味着可以将机制化预测（例如来自\
  \ `GEM` 的通量）输入数据驱动工具中。或者，可以使用数据驱动工具对复杂数据进行上下文化和解释，为机制化模型提供信息。两种方法在生物技术中都产生了可操作的见解。图表由\
  \ BioRender 创建。](img/c01f006.png)\n\n图 1.6 总结了如何将数据驱动和机制化方法相结合，以在生物技术中产生见解的示意图。混合可以先是机制化的，意味着可以将机制化预测（例如来自\
  \ `GEM` 的通量）输入数据驱动工具。或者，可以使用数据驱动工具对复杂数据进行上下文化和解释，为机制化模型提供信息。两种方法在生物技术中都产生了可操作的见解。\n\
  \n这些算法主要使用整数线性规划 (`MILP`) 来识别用于操作的反应（以及基因），例如敲除、下调或过表达。例如，`OptKnock` 117 使用双层优化框架来建议将目标产物的过表达（重组蛋白）与生长相结合的基因敲除。许多工具扩展了这一概念\
  \ 118，整合了反应数据库的外源功能 126。这些工作大部分是为微生物系统开发的并应用于计量网络的。转向植物或哺乳动物细胞系统，网络从 100 个扩展到 1000\
  \ 个，使得这些算法的计算需求更大 127。\n\n### 1.6.2 细胞系开发与代谢分析\n\n与算法并行，研究人员还利用 `GEM` 以数据驱动的方式引导细胞系开发。例如，使用\
  \ `pFBA` 的定制 `GEM` 来识别区分高低产率的关键反应。作者确定了葡萄糖 6-磷酸脱氢酶 (`G6PD`) 和 `PDH` 是生物标志物，并在丙酮酸脱氢酶\
  \ (`MDH`) 处存在瓶颈，这与之前的工作一致 128。同样，Huang 和 Yoon 130 使用 `GEM` 研究了在批次培养中决定重组蛋白产量的途径。分析确认了\
  \ `G6PD` 和 `PDH` 在高产细胞中的重要性，并揭示了三羧酸 (`TCA`) 循环中的琥珀酸合成酶瓶颈。Yusuf 等 131 通过 `GEM` 验证了代谢组数据，确定了与氧化磷酸化相关的代谢产物。在从\
  \ 1L 到 1000L 不同生物反应器规模的研究中，Vod 等 132 采用了 `GEM` 来分析在上游放大过程中发生的代谢差异。Kol 等 133 利用分泌途径来量化宿主蛋白\
  \ (`HCP`) 的成本。他们利用结果对 `HCP` 目标进行顺序敲除，使清液中的 `HCP` 减少了 40%-70%。这些改进为下游纯化步骤提供了原料。\n\
  \n表 1.3 株设计的关键优化算法\n\n*来源*: Antonakou 等 11 / 经许可。\n\n| 算法 | 描述 | 参考文献 |\n| --- |\
  \ --- | --- |\n| `OptKnock` | 基于双层优化框架建议基因敲除，将目标过表达（即生物制药）与生长相结合。 | Burgard 等 117\
  \ |\n| `OptReg` | `OptKnock` 的扩展，根据双层优化框架建议两个不同反应的调控（上调、下调等）。 | Pharkya 和 Maranas\
  \ 118 |\n| `OptForce` | `OptReg` 的扩展，对比了初始菌株与目标化学产量菌株的代谢通量模式。 | Ranganathan 等 119\
  \ |\n| `GDLS` | 使用逻辑搜索寻找改进代谢产物的多种路径。 | Lun 等 120 |\n| `OptORF` | 识别代谢和调控基因敲除/过表达的最佳数量，使生产相结合。\
  \ | Kim 和 Reed 121 |\n| `k-OptForce` | 通过在目标函数中考虑表达来识别转录因子和代谢基因。 | Chowdhury 等 122\
  \ |\n| `OptRam` | `OptForce` 的扩展，使用动力学方程更好地计算代谢网络的稳态通量。 | Shen 等 123 |\n| `gcOpt`\
  \ | 预测两个代谢反应的耦合强度。 | Alter 和 Ebert 124 |\n| `OptCouple` | 同时分析基因工程策略与工艺工程解决方案，以实现产物的过产生。\
  \ | Jensen 等 125 |\n| `OptStrain` | 评估来自反应数据库的非源功能的敲入。 | Pharkya 等 126 |\n\n###\
  \ 1.6.3 培养基与补料设计\n\n\n\n\n\n多组学数据集及其衍生的基因组规模模型（GEMs）也应用于细胞培养基和添加剂的设计中。GEMs 可用于阐明培养环境的变化对细胞内通量分布的影响，从而识别细胞生长或代谢产物/重组蛋白生产的瓶颈。这种理解可以用于提出改进的工艺策略，包括培养基和补料配方。此类应用的一个例子是\
  \ Huang 等人的工作，他们将 `GEM` 与转录组数据结合，识别了在高产 CHO 细胞克隆中上调的代谢通路 [134。他们的分析强调支链氨基酸是 `TCA`\
  \ 循环中间产物的关键来源，这导致设计了一种富含亮氨酸和亮酸的新型细胞培养补料。该补料经过实验测试，证明能显著提高重组蛋白的滴度。另一项研究使用 `CHO-DG44\
  \ GEM` 揭示了培养基中补充叶酸与乳酸分泌之间的联系。这种机制通过抑制 `TCA` 循环通量来平衡增加的乳酸产生，同时通过减少`谷氨酰胺/天冬酰胺`补料作用来降低乳酸产生\
  \ [135。GEMs 还被用于理解`天冬酰胺`和天冬氨酸的代谢，以优化补料比例 [136，设计潜在的补料添加剂以优化重组蛋白滴度 [137，以及通过改进补料配方减少`氨`等毒性代谢副产物的积累\
  \ [138。此外，GEMs 还被用于鉴定琥珀酸脱氢酶 (`SDH`）是早期细胞培养的瓶颈，导致培养基配方的调整，加入了辅酶 Q10（`泛醌`）以增强 `FAD+`\
  \ 的再生 [139。\n\n代谢模型产生的大型通量数据集分析可以通过统计学或 `ML` 方法促进新知识的产生。为此，Ramos 等人通过主成分分析 (`PCA`)\
  \ 分析了 `CHO-K1 GEM` 的结果，以设计出一种能最小化副产物积累的高效生长培养基 [140。此前，使用小规模代谢模型分析以推断关键代谢通路通量的同位素标记实验数据集已通过各种\
  \ `ML` 技术得到了进一步研究。例如，Wu 等人开发了一个平台，将支持向量机 (`SVMs`)、`k-最近邻`和决策树应用于对近 100 项关于异养细菌的\
  \ `¹³C-FMA` 研究的文献数据中 [141。该平台将通量预测为细菌物种、底物类型、生长速率、氧气条件和培养方法的函数。Nandi 等人 [142 扩展了该方法，包含了基因测序和表达、网络拓扑以及基于通量的特征。通过同时考虑环境因素，该模型能够捕捉在任何环境中至关重要的最小基因集。\n\
  \n`NEXT-FBA` [80 是另一个近期使用 `ML` 方法理解复杂生物数据的案例。`NEXT-FBA` 使用了在代谢组学和通量组学数据上训练的神经网络来理解细胞内部和外部动态之间的关系。这种理解被用于计算\
  \ `GEMs` 的约束条件，从而产生更精细、更准确的预测。`NEXT-FBA` 被用于识别 `CHO` 细胞过程中`氨`积累的原因，确定了补料和代谢工程工艺的改进方向。\n\
  \n### 1.6.4 基因必需性\n\n理解遗传扰动如何导致表型变化是代谢网络的一个关键应用。结合数据驱动和机制的方法被用于识别必需基因。例如，Plaimas\
  \ 等人在一个具有基因组和转录组数据的 `E. coli FBA` 网络上使用 `SVMs` 来识别必需酶 [143。Acencio 和 Lemke 扩展了这一点，将`决策树`\
  \ 应用于拓扑、区室和功能特征，改进了基因必需性的预测并揭示了表型决定因素 [144。\n\n基于图的学习是另一种新兴的数据驱动优先方法，其中从实证数据构建的代谢网络被视为图，并使用图神经网络\
  \ (`GNNs`) 进行分析。节点可以代表代谢产物或反应，边则捕捉功能或拓扑关系。通过在这些带有组学数据的图上训练 `GNNs`，研究人员可以预测反应性、通量控制或通路激活\
  \ [145。\n\n### 1.6.5 动力学参数估计\n\n开发大规模动力学或酶约束模型的主要障碍是缺乏高质量的动力学参数。作为早期解决方案，数据驱动方法被用于网络进行参数化。例如，使用统计回归方法来估计动力学参数\
  \ [146]。最近，`ML` 算法在包含酶生物化学、蛋白质结构和网络背景的数据集上进行了训练，以预测酶的周转数，用于蛋白质组约束模型 [147, 148。\n\
  \n### 1.6.6 工艺监控与预测\n\n生物医药行业的一个关键重点是从工艺开发和生产中的“测试质量”转向“设计质量” (`QbD`)（ICH 指南）。基于数学模型的工艺监控、预测和控制是\
  \ `QbD` 方法的重要部分。为细胞培养设计的模型必须足够复杂，以理解关键工艺参数 (`CPPs`) 与关键性能指标 (`KPIs`) 以及关键质量属性 (`CQAs`)\
  \ 之间的联系，但同时也简单以便控制器快速采取。用于哺乳细胞培养工艺控制的数学模型可以是数据驱动的、基于简单的机制关系，或者是更复杂的代谢模型 [11, 149。\n\
  \n`GEMs` 为工艺控制提供了独特的视角，因为它们通过建模细胞代谢将 `CPPs` 与 `KPIs/CQAs` 联系起来，而不是将细胞视为通过宏观反应将底物转化为产物的黑盒。`GEMs`\
  \ 可以提供宏观模型无法提供的见解，从而改进预测和控制。`CHO cell GEMs` 已被用于通过最小摄取速率目标结合预测活细胞密度来预测氨基酸浓度 [150。此外，Schinn\
  \ 等人将 `CHO cell GEM` 通量采样与统计模型结合，以描述氨基酸消耗的变化 [151，而 Antonakoudis 等人将 `GEM` 计算的核酸糖通量作为\
  \ `ML` 模型的输入，预测蛋白质产物的糖基化谱 [152。\n\n\n\n\n然而，若干局限性阻碍了网络模型在过程控制中的实际应用。它们的复杂性往往超过了可操作控制所需的程度，增加了计算需求，但未能带来比例的收益。这些模型的欠定性性质导致了宽泛的解空间，除非受到适当的约束，否则预测精度会降低。此外，对稳态假设的依赖限制了在较长培养周期内的预测准确性，因此有必要采用动态建模方法。最后，仅依靠\
  \ `GEMs` 无法捕捉温度、pH 和毒性代谢产物积累等关键工艺参数（`CPPs`）对代谢的影响。为了克服这些问题，简化策略、动态扩展以及与经验或数据驱动方法（如强化学习或混合\
  \ `MPC` 框架）的整合，对于有效实施至关重要。\n\n在此方向，来自小规模 CHO 细胞代谢模型的代谢预测已整合到生产用生物反应器的动态模型中 [109,\
  \ 112]。最后，Gopalakrishnan 等人 (2024) [110] 提出使用数据驱动分类器将细胞分类为“生长”或“生产”状态，每种状态具有不同的代谢目标。利用该术语，一个\
  \ `GEM` 被嵌入到 `ODEs` 系统中，以预测整个补料 CHO 细胞培养过程中的代谢物摄取和分泌，成功捕捉到了两种细胞状态的共存。\n\n# 参考文献\n\
