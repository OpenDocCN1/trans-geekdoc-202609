  \ NOVA de Lisboa, Caparica, 2829-516, 葡萄\n⁴INESCID and IST,里斯本大学,Av. Rovisco Pais,\
  \ 1, Lisbon 1049-001, 葡萄\n\n## 11.1 引言\n\n大数据的到来正在改变生物技术行业，这种变革源于前所未有的大规模分析和处理数据的能力，导致个体生物系统的可用信息呈爆炸式增长。生物技术大数据的代表性来源包括（生物工艺数据和各种组学数据（例如基因组学、转录组学、蛋白质组学、代谢组学），这些数据在多个公开数据库中系统地存储和管理，适用于广泛的医疗、农业、工业和环境终点\
  \ [1–4]。尽管最各类生物技术领域的数据产生量以快速速度增长，但仍需要计算技术来处理此类数据并随后挖掘其全部潜力。机器转化生物数据并从从中学习的能力正在重塑现状\
  \ [[5]](#c11.xhtml#c11-bib-0005) 。然而，生物工艺和组学数据的结构复杂性、异质性、高维度以及日益庞大的容量，结合活体系统的环境敏感性和随机性，对实现理想表型的能力构成了挑战。\n\
  \n作为补充，分子工程的最新进展彻底改变了菌株工程和通量设计，使得代谢通量能够向目标产物引导 [5, 6]。代谢工程领域依赖基因修饰（调控元件的激活、下调和调节）来重新编程天然途径。这一过程通过菌株工程的“设计-构建-测试-学习”（DBTL）框架得到了进一步简化\
  \ [7]。在这一流程中，“设计”（Design）部分概述了策略方法，而“构建”（Build）步骤涉及用于引入多样性的技术。“测试”（Test）阶段包括表型分析，而“学习”（Learn）组件涉及应用计算工具来分析测试期间收集的数据。“学习”阶段仍然是一个有很大改进空间的领域\
  \ [8]。\n\n多项实验数据与数据驱动分析方法（机器学习（ML））的结合，为应对 DBTL 循环提供了一种挑战性的解决方案。目前，许多生物制造公司正在投资生物技术系统和工艺的数字化，采用各种计算形式，包括基于机制的模型（CBM）、机器学习（ML）和混合建模。CBM\
  \ 方法基于基本原理，如质量和能量守恒、代谢网络计量学，并使用流行的通量平衡分析（FBA）方法 [9]，且需要的实验数据较少。另一方面，ML 探索了计算机在无需显式编程和无需整合背景知识的情况下执行任务的能力。为了执行这些任务，ML\
  \ 算法可以识别模式并通过适应机制不断提高性能 [10, 11]。此外，ML 中的适应机制允许计算机从数据集中学习。这些学习机制（包括不断深度学习（DL）突破）使计算机能够逐步提高多种生物技术的性能，例如酶优化、发现合成途径中的相关基因以及为下一个\
  \ DBTL 循环提出新设计 [12–14]。在这方面，共享来自生物反应器实验和监测生物的大规模、高质量数据对于学习至关重要。能够表示、整合和处理高维数据的 ML\
  \ 技术是任何未来生物技术领域深度理解生物系统的宝贵资产 [[15]](#c11.xhtml#c11-bib-0015) 。与纯 ML 模型兴起并行，将机制性\
  \ CBM 与 ML 结合的整合方法（例如混合 ML/FBA 模型）在计算菌株设计中日益受到关注 [16, 17]。\n\n\n\n\n本章结构如下。第一部分回顾了用于生物技术领域大数据描述性和预测性建模的关键机器学习（ML）方法。还概述了混合机器学习/基于模型（ML/CBM）的方法。章的第二部分介绍了代谢工程研究背景下的几个成功案例及相关方法论，以对所介绍的方法进行原理性说明。最后，概述了面临的挑战和未来展望。\n\
  \n## 11.2 生物技术中的大数据：基于机器学习方法的前提\n\n生物技术领域的实验设计应遵循基本原则，以实现后续学习任务的最优应用，包括：跨实验制定标准化方案以确保样本间的具有可比性和可重复性；记录所有可能影响研究的相关内源和外源特征（例如生物反应器培养条件、菌株背景）；确保对多种实验参数化进行良好覆盖（例如基因敲除的无偏采样技术、培养基组成、环境条件）以提高学习能力；在可行的情况下选择组；隔离噪声和伪影的来源；定期校准仪器并验证测量结果以确保数据质量和准确性；收集重复样本以评估/减少变异并提高可靠性；确保足够的样本量以实现稳健的统计分析和泛化能力；跨多个尺度（例如多个组学层）收集数据以进行整体学习；以及以精细且一致的采样率监测纵向实验。作为设计设计的补充，后续章节制定了后续的数据预处理原则，以处理生物工艺和组学数据的多模态、高维、纵性和噪声特性。\n\
  \n### 11.2.1 数据的多模态与异质性\n\n在代谢工程实验中，数据可以从多种生物和物理化学模态中收集。首先，在每个组学层可以识别多种模态，包括基因组学（基因型、甲基化）、转录组学（RNAseq、染色质可及性）、蛋白质组学（丰度、翻译后修饰）和代谢组学（参见第\
  \ 10 章）。此外，还可以对代谢物与其他分子（如蛋白）之间的分子相互作用（相互作用组学）进行谱分析。其次，代谢通量分析（通量组学）可以估计细胞内通量。第三，伴随的物理和化学测量通常与评估酶活性、动力学、结合亲和力和反应能量学有关。第四，用于结构和功能分析的成像数据（包括荧光、电子或共聚焦显微镜）以及细胞成像可能用于特定目的。第五，表型谱分析（表型组学）可以涵盖生长率测量（例如生物量积累）、代谢物产率和生产率（目标化合物的生产速率）、应激反应和形态分析（例如细胞大小、形状和结构的表征）。最后，也是最的，环境参数的生理测量、营养可用性（例如底物、辅助因子浓度）和副产物积累（例如毒性或抑制性化合物）通常是关重要的。\n\
  \n此外，数据异质性可能源于监测方案、仪器、环境设置（例如温度、pH、培养基组成、氧气可用性和其他条件）、菌株和生物的（表）基因和表型多样性、纵向研究中数据注释过程的采样率以及特征覆盖（例如特定的组学和通量仅在所有样本的一个集上进行分析，导致块状缺失数据）。这些异质性来源——无论是由采集方法、种群还是环境引起——都会引入多种类型的偏差，阻碍后续的学习目标，包括针对特定条件的采样偏差（导致泛化困难）、与系统性差异相关的测量偏差（这些差异可以归因于方案而非测量现象）、由于变量或时间模式之间的虚假关联引起的混杂偏差，以及捕捉系统性非生物形式变异的批次效应[\\\
  [18\\]](#c11.xhtml#c11-bib-0018)。记录特征范围的差异或去标准化的方案变化可能导致特征空间出现大块的缺失条目，通常需要专门的处理原则，范围从流形对齐和领域感知插补到多源集成学习（从没有块状缺失的子样本和子空间中学习到的模型）[\\\
  [19\\]](#c11.xhtml#c11-bib-0019)。\n\n为了保证从多模态和异质性数据源中学习的能力，应该考虑几项原则（例如，参见[\\[20\\\
  ]](#c11.xhtml#c11-bib-0020)），包括：使用映射表和本体进行交叉引用以整合来自不同模态的数据集的数据整合原则；或更先进的原则（例如基于核的融合、分层整合）；处理异质性的标准化原则，如缩放方法、批次效应校正（例如`ComBat`、`RUV`）和分位数标准化；将方案变化作为协变量以确保对特定方案偏差的敏感性；整合学习原则，如基于图的方法（例如异质网络）、矩阵分解技术（例如`NMF`）以寻找共同模式；质量评估原则，用于量化信噪比并应用过滤标准以保留高质量数据；采样原则，以保证训练、验证和测试观测对异质性来源的均匀渗透；以及协调原则，如使用典型相关分析（`CCA`）、Procrustes\
  \ 分析和嵌入技术进行跨数据集对齐；表示学习和多视图学习原则可用于从结合了或两种不同数据结构（例如时间序列数据、成像数据）的实验数据学习。\n\n### 11.2.2\
  \ 分层与数据转换\n\n此外，与层代表性相关的数据采样挑战，以及存在类别不平衡的分类目标和显示偏态分布的数值目标是常见的，且源于不同的底层原因，包括实验设置对某些结果的偏差（例如忽略某些条件或强调感兴趣的特定输出）、实验设计选择、注释不一致，以及使得特定结果通常稀缺的自然生物限制（例如，成功的菌株设计、高产生产），这是一种带有针对性修改的常见案例，与海量可能的扰动相比，成功的干预相对较少。\n\
  \n\n\n减轻这些挑战的策略包括：通过重采样来减少不平衡和偏斜；引入领域特定知识来转换和工程输入/或输出特征，使其具有更合理的统计分布；优化随后的学习方法（例如调整决策阈值、通过专用损失函数对少数类和数值范围的误预测进行惩罚），并选择在相关数据上进行预训练；以及从代表性不足的层获取新的实验数据。此外，可以应用基于变分自编码器、代谢模型、对现有数据样本的扰动或生成对抗网络的数据增强策略来生成合成数据，以处理与数据可用性、采样偏差和目标不平衡的问题。最后，可以使用对比损失函数下的成对学习原理\
  \ 21 来对抗泛化困难。\n\n鉴于（生物）工艺和组学数据的性质，进一步建议采用替代数据转换以辅助描述性和预测性学习任务，包括对分子变量进行归一化以避免不同尺度带来的偏差（例如，从绝对计数转换为每百万交易量以考虑采样差异；将特征缩放到共享分布中以适应依赖距离的机器学习方法）；进行对数转换以解决分布偏斜（例如，基因表达或浓度测量）；使用降维（DR）方法降低复杂性和噪声（例如，PCA、tSNE、UMAP、特征选择方法）；对类别变量进行编码（例如，实验条件的嵌入、序数变量的数值编码、名义变量的独热编码）；对特征（特别是目标）进行离散化，以简化复杂关系并增强可解释性；纠正批次效应\
  \ 18；以及时间序列或信号变换，用于频域表示（例如，电学测量的谱分析）和降噪（例如，分段聚合、移动平均、小波变换、滤波）。\n\n### 11.2.3 缺失值与异常值的处理\n\
  \n在代谢工程背景下，`missing values` 可能由多种原因引起，包括纵向采样未对、测量误差、异常情况、仪器灵敏度限制（例如，质谱或色谱可能无法覆盖样本中的所有代谢物，单细胞\
  \ RNA 测序的技术变异）。缺失数据可以保留到随后的学习步骤中处理，或使用领域特定知识、机理模型、中心性统计、时间序列中的插值或回归、预测方法（例如，最近邻）以及集成视图（例如，多次插补）22,\
  \ 23 进行填充。较少的情况下，根据数据大小和缺失率等标准，可以通过删除相应的记录或变量来移除缺失值。\n\n同样，`outliers`——即显著偏离预期数据模式（超出自然生物变异）的——可能由多种因素引起，包括与仪器相关的实验误差（灵敏度或信号波动）、操作（预期实验条件的波动）、采样偏差（例如，培养物部分出现异常生长或代谢活动）和污染（例如受物质或微生物污染）；菌株或基因型的变异；以及由于未考虑的情况和实验设计选择导致的意外代谢不稳定性（例如，应激测试，如氧化应激、营养限制、极端\
  \ pH 变化或其他扰动）。在可能，异常值的检测应由领域知识引导并遵循上下文立场，因为实验背景可能会产生有意义的偏差。可以通过统计方法来测量与模型预期的偏差（从单变量\
  \ z 分数/IQR 视图到多变量视图）以及非参数方法（如聚类方法 24）辅助检测。当异常观测具有意义或信息量时，可以保留它们以重塑描述符和预测器的学习。为了减少它们对学习阶段的影响，可以使用封帽法（Winsorization）和多变量修正对异常值进行进一步处理。\n\
  \n### 11.2.4 纵向研究\n\n代谢工程实验涉及动态系统的分析/或优化。时间维度通常存在，无论是监测菌株适应、分料发酵（例如，细胞生长、代谢产物产生、底物消耗）、调节响应、生物工艺、细胞适应和从应激中恢复、遗传或环境扰动后通路激活和代谢产物积累的变化等。这些实验在系统以大致规律的时间进行测量时，产生多变量时间序列数据形式的时间变化数据；当测量速度不规则或在特定现象或扰动后发生时，则产生时间标记的多变量事件数据。在这种情况下，应该考虑多种原理来辅助描述性和预测性任务（例如\
  \ 18, 25），包括将数据点对齐到共同的时间线；应用插值或重采样技术（例如，样条、高斯过程）来标准化时间间隔；对每个时间点或整个时间过程进行测量归一化，以防止代谢产物的累积视图产生偏差；在整个时间范围内沿滑动窗口提取统计特征，如趋势、峰值、光谱/频率特征、变化率和振荡；创建滞后变量以捕捉随时间变化的依赖；应用动态模式分解或循环自动编码器进行时间压缩；应用平滑滤波器以减少实验噪声并使用幂变换以稳定方差；选择专用的机器学习方法从多变量时间序列和事件数据中学习；将数据划分为训练集、验证集和测试集以确保时间一致性（例如，向前验证或滚动窗口方案）。\n\
  \n## 11.3 基于机器学习的微生物细胞工厂设计类型\n\n随着大数据以以前未有的速度生成，基于机器学习的方法正成为其整合分析和解释的流行选择。本节介绍了数据驱动的预测和描述性建模方法的应用和机制的基本背景，重点关注基于机器学习的技术，包括纯机器学习和能够整合基于约束方法的混合机器学习。图\
  \ 11.1 阐述了本节描述的主要基于机器学习的方法。\n\n### 11.3.1 机器学习 (ML) 模型\n\n\n\n\n机器学习（ML）为开发从实验数据中学习的计算算法提供了一个强大的框架。通过利用多种算法，ML\
  \ 能够自动构建用于描述、预测和规范目的的数据驱动模型。描述符（Descriptors）可用于理解生物工艺动力学以获取知识；预测器（Predictors）可以估计感兴趣的潜在特征，或迭代地建议实验室实验的步骤；而规范器（Prescriptors）可以利用纵向生物反应器研究来探索未见条件的适用性，从而最终增强各种工艺结果\
  \ [26, 27]。许多 ML 算法已经开发出来，并通过开源 Python 包轻松获取（例如 28）。通常，ML 模型可以分为两大类：监督学习方法和无监督学习方法（强化学习（RL）由于在工程微生物细胞工厂背景下的示例有限，此处将不涉及）。选择最合适的\
  \ ML 方法取决于所需的输出结果。在此，我们提供了工业生物技术领域常用 ML 方法的概述，并重点介绍了它们的应用。\n\n![](img/c11f001.png)\n\
  \n图 11.1 基于大生物数据进行细胞工厂设计和改进的 ML 流程。纯 ML 使用数据（特别是组学和外源特征）用于预测和知识获取目的（蓝色箭头）。在多组学数据分析中，ML\
  \ 通过结合特定条件的通量学结果实现了对代谢系统的深层理解（橙色箭头）。ML 还可以使用单/多组学数据作为输入来识别关键特征，将其与 CBM 结合以预测通量并改进代谢模型，辅助代谢通量的分析（紫色箭头）。\n\
  \n### 11.3.2 监督 ML\n\n监督学习方法 29，包括回归（用于连续结果）和分类（用于类别结果）、单输出和多输出预测器，旨在利用训练数据建立输入特征（记为\
  \ `x`）与对应结果（`y`）之间的关系，{(x`[1], `y`[1]), … , (`x`[*n*], `y`[*n*])。这种关系在数学上表示为：\n\n\
  ```\n(11.1)![ModifyingAbove bold y With‚ equals f left-parenthesis bold x vertical-bar\
  \ normal theta right-parenthesis](img/c11-math-0001.png)<math display=\"block\"\
  \ overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"> <mover accent=\"\
  true\"><mi mathvariant=\"bold\">y</mi> <mo stretchy=\"true\">&#770;</mo> </mover>\
  \ <mo>=</mo> <mi>f</mi> <mrow> <mo stretchy=\"false\">(</mo> <mrow> <mi mathvariant=\"\
  bold\">x</mi> <mo stretchy=\"false\">|</mo> <mi mathvariant=\"normal\">&#952;</mi>\
  \ </mrow> <mo stretchy=\"false\">)</mo> </mrow> <mo>,</mo> </math>\n```\n\n其中 `θ`\
  \ 代表模型参数。在参数化 ML 方法中，目标是通过最小化损失函数来优化 `θ`，该损失函数衡量模型预测值与真实值之间的误差![script upper L left-parenthesis\
  \ bold y, ModifyingAbove bold y With‚ right-parenthesis](img/c11-i0001.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  ><mi 虚=\"script\">L</mi><mrow><mo stretchy=\"false\">(</mo><mrow><mi 虚=\"bold\"\
  >y</mi><momo><mover accent=\"true\"><mi 虚=\"bold\">y</mi><mo stretchy=\"true\">&#770;</mo></mover></mrow><mo\
  \ stretchy=\"false\">)</mo></mrow></math>。损失函数可以在训练数据中评估，或者更严格地在留出的验证集中评估，以确保预测器能够泛化到未见的观测值。\n\
  \n在 11.2 的预处理步骤之后，典型监督学习工作流的关键阶段包括问题范围、特征工程以及模型选择、超参数化、训练和评估（详细讨论此主题并非本文范围；引导读者参考\
  \ [30] 获取更多细节）。\n\n简要介绍了应用于各种生物技术任务的选监督方法。某些目标任务包括优化途径、分类细胞表型、预测代谢产物、优化通量以及设计基因修饰。\n\
  \n### 11.3.2.1 神经网络\n\n受生物神经系统的启发，神经网络（NNs）由互连的处理单元（称为感知器或节点）组成，通常按层组织 31。每个节点接收来自连接节点（通常来自上一层）的输入，处理该输入并生成影响后续层节点的输出。网络\
  \ *f* 在输入层接收外部信号 `x`，并在每个隐藏层中对其进行迭代转换，`x`[*p*+1] = *ϕ*^*p*, 直在最终输出层返回系统的输出![ModifyingAbove\
  \ bold y With‚](img/c11-i0002.png)<math display=\"inline\" overflow=\"scroll\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\"><mover accent=\"true\"><mi 虚=\"bold\">y</mi><mo\
  \ stretchy=\"true\">&#770;</mo></mover></math>。针对不同的应用，人们提出了具有特定拓扑结构和节点激活函数的不同神经网络架构\
  \ 32。\n\n深度学习（DL）即具有大量参数（θ）的神经网络的学习的最新进展重新引发了对其在各个领域应用的兴趣，包括代谢工程背景下的酶和途径设计 33，以及途径优化\
  \ [34, 35]。深度学习也被证明在利用历史数据优化生物工艺生产率方面非常有用 36。从 ML 的角度来看，深度学习的进展主要由表达性分层（例如递归、卷积、对比、残差、基于注意力的）、替代学习方案（例如自监督、迁移学习）、新型架构（例如\
  \ Transformer、生成对抗网络）以及数据增强策略驱动 37。\n\n#### 11.3.2.2 决策树与集成方法\n\n\n\n\n\n决策树（Decision\
  \ trees, DTs）最初由 Quinlan [38] 描述为输入特征的简单非参数监督函数。该函数 `f(x)` 是根据从训练数据中学到的树形结构的规则组合，其中每个节点的规则根据其预测信息定义特征测试。每个数据观测根据路径上测试的特征（`x`）落在从根到叶的决策路径上，并根据在相应叶节点观察到的决策结果（例如连续和/或分类值）进行标注——![ModifyingAbove\
  \ bold y With‚](img/c11-i0003.png)<math display=\"inline\" overflow=\"scroll\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\"><mover accent=\"true\"><mi mathvariant=\"bold\"\
  >y</mi><mo stretchy=\"true\">&#770;</mo></mover></math>）。决策树的深度在训练过程中受到控制，以缓解与浅树和深树相关的欠拟合和过拟合风险。决策树因其简单、易于实现和高可解释性而被广泛使用。\n\
  \n在菌株工程和生物工艺工艺中，它们被用于预测哪些蛋白表达水平会导致高产量，或识别各种发酵运行中使生产效率最大化的输入工艺条件 [39]。\n\n随机森林（Random\
  \ Forest, RF）算法是基于两个主要程序的决策树集成算法：自助数据采样以及特征子空间选择，以学习相关性降低的多个独立树（即袋装法，bagging）。随后使用\
  \ `k ∈ ℕ^+` 棵树的集合 `{f1, …, , fk}` 来产生相应的输出估计，![StartSet ModifyingAbove bold y 1\
  \ With‚ comma ellipsis comma ModifyingAbove bold y Subscript k Baseline With‚ EndSet](img/c11-i0004.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  ><mrow><mo stretchy=\"false\">{</mo><mrow><mover accent=\"true\"><msub><mi mathvariant=\"\
  bold\">y</mi><mn>1</mn></msub><mo stretchy=\"true\">&#770;</mo></mover><mo>,</mo><mo>&#8230;</mo><mo>,</mo><mover\
  \ accent=\"true\"><msub><mi mathvariant=\"bold\">y</mi><mi>k</mi></msub><mo stretchy=\"\
  true\">&#770;</mo></mover></mrow><mo stretchy=\"false\">}</mo></mrow></math>，通过均匀加权方案产生最终估计\
  \ ![ModifyingAbove bold y With‚](img/c11-i0005.png)<math display=\"inline\" overflow=\"\
  scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover accent=\"true\"><mi\
  \ mathvariant=\"bold\">y</mi><mo stretchy=\"true\">&#770;</mo></mover></math>，从而防止欠拟合和过拟合风险\
  \ [40]。\n\n其他成功的树集成方法，例如极端梯度提升（XGBoost） [41]，能够顺序学习树，每棵树都会纠正前几棵树的错误，并为非均匀加权方案优化地分配效能分。\n\
  \n树集成是多功能的，能够处理任意高维、缺失数据、数值和/或分类结果以及特征重要性分析。这种灵活性使其适用于广泛的生物技术应用。例如，它们已用于途径优化 [42]、基于不同物理性状的差异代谢通量分析\
  \ [43]，以及预测重组蛋白浓度。\n\n\n\n\n第一个示例探索了使用机器学习模型预测代谢通量 47。虽然基于约束的模型（CBMs）对于代谢网络建模很有价值，但它们需要大量的先验知识、目标函数的调优，并高度依赖于预定义的假设，这限制了它们在多样化条件（例如研究较少的扰动、不常见的外源性条件）下的的适用性。Gonçalves\
  \ 等人 47 强调了机器学习方法日益增长的潜力，特别是利用大规模组学数据（如蛋白质组学和转录组学）进行代谢通量预测。作者以组学数据作为输入，将先进的机器学习模型（包括\
  \ `RFs`、`SVMs`、`DTs` 和 `NNs`）与简化版的 `FBA` (`pFBA`）49 进行，探索了结合机器学习和两次迭代 DBTL 循环来优化大肠杆菌（*Escherichia\
  \ coli*）中 1-十二醇的生产。这一系统性框架代表了代谢工程从传统试错方法的重大转变。该研究侧重于利用蛋白质组数据来指导菌株开发，最终提高了生产效率。在第一个\
  \ DBTL 循环中，作者检查了 36 基因化大肠杆菌菌株，系统地调节了单个操纵子内的核糖体结合位点（RBSs）和酰基-ACP/酰基-CoA 还原酶。测量变量包括十二醇浓度和途径蛋白水平。结果显示，`Maqu_2507`\
  \ 还原酶在十二醇生产方面持续优于其他还原酶，而 `Maqu_2220` 产生了最高的总脂肪醇。初始循环为训练机器学习模型（包括 `RFs` 和 `NNs`）生成了宝贵的数据，以预测进一步改进菌株的最优蛋白谱。第二个\
  \ DBTL 循环实施了第一个循环中机器学习模型生成的预测。设计了 14 个新菌株，由机器学习模型指导蛋白质表达水平的调整。结果显示十二醇浓度增加了 21%，达到\
  \ 0.83g/L，这显著高于此前报道的批次培养值。然而，某些挑战（例如预测的位点结合强度不准确以及意料之外的操纵子范围效应）限制了改进的程度。这项工作的意义在于展示了机器学习如何有效补充\
  \ DBTL 等系统性框架以推进代谢工程，同时强调了迭代循环随时间推移实现生产改进的潜力。该研究进一步强调了在 DBTL 框架内平衡探索（exploration）与利用（exploitation）的重要性。虽然初始循环应侧重于探索不同的设计空间，但随后的迭代应利用积累的知识进行更有针对性的优化。这种平衡方法对于最大化机器学习算法的功效和完善菌株工程流程至关重要。总之，这项研究提供了一个引人注目的示例，说明了将机器学习与高通量\
  \ DBTL 循环相结合如何推进代谢工程。尽管面临完善预测工具和解决数据局限性等挑战，但结果突出了通高效生产生物基产品的前景。\n\n### 11.3.3 无监督机器学习\n\
  \n无监督学习是机器学习获取生物系统行为知识的关键方面，特别是考虑到对其进行注释通常需要巨大的精力 50。其主要目标是通过对相似实例分组、学习表示、检索局部模式或建模动力学，识别复杂多变量输入数据中的模式。生物技术中常见的无监督机器学习技术包括聚类\
  \ 51、表示学习 52、双聚类 53、参数化建模 54 和降维（DR)55。\n\n### 11.3.3.1 聚类\n\n聚类旨在将数据观测值分类以发现相关的结构。常用方法包括：层次聚类（使用聚合（自下而上）或分裂（自上而）方法构建嵌套的聚类层次）；基于密度的聚类（根据密集区域对点进行分组）；以及基于模型的聚类（假设数据是由概率分布的混合生成的，如高斯混合模型\
  \ GMMs，以学习软结构，即观测值被分配到每个类的成员概率的结构）。基于划分的聚类（以 `K-means` 为范例）通过最小化类内方差将数据分配为可参数化的\
  \ K 个类，\n\n```\n(c_i = argmin_j d(x_i, c_bar_j))²)\n```\n\n<math display=\"block\"\
