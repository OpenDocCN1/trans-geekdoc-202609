  \n(FVA)问题的解并非唯一的，因为多个通量分布可以产生唯一的目标函数值。作为 FBA 的变体，FVA 捕捉了满足最优目标值的可行通量范围 [[45](https://c01.xhtml#c01-bib-0045),\
  \ [55](https://c01.xhtml#c01-bib-0055)] 。该方法通过线性规划计算每个反应允许的最小和最大通量：\n\n\n\n\n\n\
