  \ (2023). 用于植物表型分析的集成人工智能框架。*Biology (Basel)* 12 (10): 1298.\n\n# 用于合成生物学与生物工程知识挖掘的生成式\
  \ AI\n\n晓正阳，唐景杰\n圣路易斯大学，能源、环境与化学工程\n\n## 9.1 引言\n\n合成生物学（`SynBio`）和生物工程在历史上受到生物系统随机性\
  \ 1、2 以及海量跨学科数据 3、4 的限制。在过去的十年里，合成生物学已从概念阶段转向工业应用，生产天然产物 5、6、RNA 疫苗 7、抗体药物 8 等。然而，设计高效菌株和优化生物反应器条件仍然是一个迭代且耗力的过程。研究人员依赖分散在实验笔记本、专利数据库和期刊论文中的碎片化数据集，通常需要人工策划以形成可操作的见解。之前的章节通常强调了策展数据的重要性，但理解这一策划过程中的挑战和方法至关重要，这也是本章的重点。生成式人工智能（GenAI）和大语言模型（LLMs）通过理解相关知识来执行人类的规划和任务，变革了这一领域。大模型已从早期的指令微调模型`GPT-4`9、`Llama`10\
  \ 和`Qwen`11，变为最近的思维链推理模型，如`OpenAI o1`和`DeepSeek-R1`12。大模型支持诸如合成生物学问答机器人 13、14、DNA\
  \ 序列模型 15 以及自主蛋白工程 16 等应用。大模型还显示出将多模态数据（例如遗传学、通路和生物反应器操作）整合为可操作见解的潜力。\n\n\n\n生物工艺开发必须将传统生物技术与现代合成生物学（SynBio）进展——如基因电路、异源途径和基于\
  \ CRISPR 的菌株工程——相结合，以优化细胞性能。这些多方面的挑战凸显了生成式人工智能（GenAI）工具驱动下一代生物制造的需求。本章首先介绍了 `NEKO`\
  \ 和 `GraphRAG` 等知识挖掘工具，这些工具可以将碎片化和异构的文献转换为知识图谱。这些工具使研究人员能够提出合成生物学相关的问题，并获得由最新证据支持的答案和合成生物学信息。接下来，介绍了一种利用\
  \ `LLMs` 从科学出版物自动提取结构化生物工艺数据（如菌株工程参数和反应器条件）的方案。这种方法加速了机器学习应用的数据集构建，为未来的合成生物学实验和生物工艺开发提供了宝贵的见解（图\
  \ 9.1）。\n\n![图 9.1 整合实验数据与人工智能驱动的知识挖掘，形成多级生物工艺机器学习（ML）数据库。](img/c09f001.png)\n\n\
  图 9.1 整合实验数据与人工智能驱动的知识挖掘，形成多级生物工艺机器学习（ML）数据库。\n\n## 9.2 使用知识图谱工具进行文本挖掘\n\n`LLMs`\
  \ 擅长回答一般的科学问题，但受限于预训练截止日期且在没有 `RAG` 的情况下无法提供引用。此外，当前的 `LLMs` 面临规模法则的限制，计算资源和模型参数的指数级增长只能带来微小的、线性的性能提升。这反映了可用信息的海量与\
  \ `LLM` 参数有限容量之间的内在冲突。为了解决这些挑战，提出了用知识图谱增强 `LLMs` 的方案，以便从大量的文本源中进行更有效的知识提取。该方法通过使用\
  \ `Ollama`（一种一体化的本地 LLM 部署包）来运行 `Qwen2.5-instruct-14B`（中国阿里云）。硬件限制影响了部署选择：140 亿参数的模型大约需要\
  \ 12 GB 的 GPU/CPU 内存，对于计算资源有限的用户来说，云 API 是更可行的选择。若要在本地运行 LLM 软件包，用户可以从安装 `Ollama`\
  \ 和 `Python 3.11` 开始。本章使用的所有代码均可在 Github [`github.com/xiao-zhengyang/Advanced-Biotechnology-Series`](https://github.com/xiao-zhengyang/Advanced-Biotechnology-Series)\
  \ 获取。用户使用云计算提供的更大参数 LLM 可以获得更好的结果。GitHub 上还提供了一个使用 `OpenAI API` 的示例代码。\n\n### 9.2.1\
  \ NEKO：轻量级知识图谱工具\n\n`NEKO` 允许研究人员从 PubMed 摘要或全文文章中提取生物实体（基因、物种、生物反应器参数）之间的关系 [[18]](#c09.xhtml#c09-bib-0018)。该系统解决了两个挑战：手动关联数百篇论文发现所需的人力工作，以及通用\
  \ `LLMs` 无法提供带引用的回答的问题。在此，本节演示了 `NEKO` 如何根据用户定义的关键词（例如“产油解脂酵母”）生成交互式知识图谱，并映射出因果相互作用（例如，酶-底物关系）（图\
  \ 9.2）。实现代码可在 GitHub 获取，用户可以在一个 Jupyter notebook 中运行工作流（`github.com/xiao-zhengyang/Advanced-Biotechnology-Series/tree/main/NEKO）。\n\
  \n![图 9.2 NEKO 工作流的示意概览，用于搜索文献数据库、识别因果关系并在知识图谱中可视化和总结发现。`\n\n图 9.2 NEKO 工作流的示意概览，用于搜索文献数据库、识别因果关系并在知识图谱中可视化和总结发现。\n\
  \n*   **第 1 步：文献检索与文本收集** `NEKO` 通过 PubMed API 启动该过程。用户指定关键词，例如“Yarrowia lipolytica\
  \ carotene”。`search_pubmed` 函数检索匹配搜索的文章。`fetch_details` 函数提取标题、期刊名称和摘要，将其汇总到结构化的\
  \ Excel 文件。如示例所示，工作流通过 `retmax` 参数获取 500 篇摘要。这一步确保了输入文本包含了最新的出版物，克服了 `LLMs` 的预训练截止日期限制。\n\
  *   **第 2 步：使用 LLM 提取实体和关系** 摘要由本地部署的 LLM：`Qwen2.5-14B` 通过 `Ollama` 进行分析。`LLM` 具有针对合成生物学任务定制的提示词，使其以严格的（实体\
  \ A, 实体 B）格式输出实体对。在此，本节演示了从产β-胡萝卜素酵母研究中提取实体的示例。\n*   **第 3 步：合并含义相似的实体** 生物学术语在不同研究中存在差异。如“C:N\
  \ ratio”和“carbon-to-nitrogen ratio”等短语指的是同一个参数。`NEKO` 使用嵌入来消除这种歧义。实体对转换为向量表示，相似的术语（余弦相似度\
  \ >0.8）被映射到标准词汇。例如，“C/N ratio”和“C:N ratio”被统一为后者，以确保一致性。清洗后的数据集被保存用于构建图谱。\n*   **第\
  \ 4 步：知识图谱、RAG 与总结报告** 这一步使用 `Pyvis` 将实体和关系组装知识图谱。节点代表独特的生物实体（如基因、生物反应器参数），而边表示来源（期刊文章标题）。每个关系都可以追溯到\
  \ Excel 文件数据集中的来源文章。用户可以查询图谱以识别特定节点之间的连接，例如与产β-胡萝卜素解脂酵母相关的实体有哪些，并通过 RAG 和 LLM 对关联关系的解释生成总结（图\
  \ 9.3a）。在配合能力更强的 72B LLM 的最佳实践下，`NEKO` 工作流产生的总结报告比 GPT-4 零样本问答更具体、更可靠（图 9.3b）。\n\
  \n![图 9.3 (a) 来自 NEKO 工作流的知识图谱示例。节点是生物实体，边标记为引用。(b) 与 GPT-4 零样本问答相比，NEKO 能够在知识图谱中找到特定的β-胡萝卜素产量、产产基因、菌株工程方法和培养条件\
  \ [18] / Elsevier / CC BY 4.0.](images/c09f003.png)\n\n### 9.2.2 GraphRAG\n\n\n\n\
  \n\nGraphRAG 是一种先进但计算成本昂贵的框架，用于增强 LLM 生成领域特定输出的能力。与 NEKO 不同，GraphRAG 集成了三种不同的查询模式——全局（global）、局部（local）和\
  \ DRIFT 搜索，通过自然语言输入实现全面的问答。本节演示了使用 LLM 和 GraphRAG 研究*解脂酵母*（Yarrowia lipolytica）中\
  \ β-胡萝卜素生产的步骤（图 9.4）。代码位于 GitHub 仓库 [`github.com/xiao-zhengyang/Advanced-Biotechnology-Series/tree/main/GraphRAG`](https://github.com/xiao-zhengyang/Advanced-Biotechnology-Series/tree/main/GraphRAG)。\n\
  \n* **步骤 1：配置 Ollama LLM** Ollama 默认的 LLM 上下文长度（例如 2k tokens）会截断长文本。为了避免这种情况，需要具有更长上下文的自定义\
  \ LLM。在终端中运行此命令创建一个 8k 上下文长度的 `qwen2.5:14b` LLM。\n\n```\nollama show qwen2.5:14b\
  \ --modelfile > settings.txt\n```\n\n![Figure 9.4 A sample knowledge graph from\
  \ GraphRAG.](img/c09f004.png)\n\n图 9.4 来自 GraphRAG 的示例知识图谱。\n\n该命令在终端当前目录下生成一个 `settings.txt`\
  \ 文件。通过添加一行指定上下文长度的配置来修改模型的 `settings.txt` 文件。\n\n```\nPARAMETER num_ctx 8196\n\
  ```\n\n然后运行下面的命令创建自定义的 `qwen2.5:14b_8k model`。\n\n```bash\nollama create qwen2.5:14b_8k\
  \ -f settings.txt\n```\n\n* **步骤 2：初始化 GraphRAG 和提示调优（Prompt Tuning）** 本节使用的 GraphRAG\
  \ 版本为 1.2.0。用户可以通过 pip 安装。\n\n```bash\npip install graphrag==1.2.0\n```\n\n用户可以通过在终端中输入以下内容来初始化一个新的\
  \ GraphRAG 项目：\n\n```bash\ngraphrag init --root. /[Yarrowia_local]\n```\n\n为了方便用户，GitHub\
  \ 仓库中提供了一个预配置的 GraphRAG 项目，其中包含预加载的输入文本。对于没有 GPU 的系统，请在 `settings.yaml` 中将 `request_timeout`\
  \ 值增加到 `≥10 000` 秒以防止中断。提示工程非常重要，因为实体-关系的提取依赖于领域特定的指令。用户应使用 `autotune` 命令生成带有示例的上下文感知提示词。\n\
  \n```bash\npython -m graphrag prompt-tune --root. /[Yarrowia_local] --config. /\
  \ [Yarrowia_local]/settings_prompt_tune.yaml\n```\n\n注意，应使用大参数 LLM（>70B）进行提示生成，以尽可能减少人工校正，因为较小的\
  \ LLM 可能会产生次优的提示。在示例中，使用了 GPT-4o 进行提示调优。用户应在 `settings_prompt_tune.yaml` 文件中替换自己的\
  \ OpenAI API key。在自动提示调优后，将生成的提示移动到 prompt 文件夹中。\n\n* **步骤 3：索引输入文本** 执行 GraphRAG\
  \ 索引命令以从输入文本开始生成知识图谱。\n\n```bash\ngraphrag index --root. /[Yarrowia_local]\n```\n\
  \n处理时间随硬件而异。基于 CPU 的系统通常需要超过 10 小时，而利用 GPU 可缩短至 30 分钟以内。\n\n* **步骤 4：查询与可视化** GraphRAG\
  \ 的三种查询模式允许使用 LLM 对知识图谱进行针对性询问。全局搜索提供广泛主题的高级摘要。局部搜索检索细节。生成的知识图谱保存在输出文件夹中，并可以导出到\
  \ Gephi 或 Cytoscape 等可视化工具。\n\n## 9.3 用于机器学习的 LLM 自动化数据提取\n\n机器学习（ML）的效能高度依赖于结构化数据库。合成生物学的传统数据收集依赖于从期刊文章中手动提取实验结果。这一过程耗时、容易出错且容易产生不一致。生成式\
  \ AI 现在提供了大规模的自动数据提取。本节介绍了一种将非结构化文本转换为机器学习就数据集的可扩展方案（图 9.5）。GitHub 上提供了一个包含输入文本和输出的示例代码\
  \ [`github.com/xiao-zhengyang/Advanced-Biotechnology-Series/tree/main/Extract_data_by_LLM`](https://github.com/xiao-zhengyang/Advanced-Biotechnology-Series/tree/main/Extract_data_by_LLM)。\n\
  \n图 9.5 科学文章被 LLM 转换为结构化特征，然后用于机器学习预测产量。\n\n* **步骤 1：收集文本和预处理** 同行评审的文章以 PDF 格式下载并转换为\
  \ `individual.txt` 文件。一段 Python 代码读取文件并处理解析后的 PDF 中的编码错误（例如特殊字符或换行）。无效文件将被标记以防止下游问题。\n\
  \n* **步骤 2：通过 LLM 提取结构化数据** 经过后的文本文件将由 LLM 批量处理（使用 OpenAI API）。使用的提示词示例为：\n\n> \"\
  从给定文本中提取一个多列电子表格 | 文章 doi | 产品 | 产品浓度 | 碳源 | 碳源浓度 | 产量 | 培养基 | 时间 | 生物反应器运行模式 |\
  \ 菌株名称 | 母菌株 | 敲除基因 | 过表达内源基因 | 异源基因| 启动子 | 基因整合是/否 | 密码子优化 | 培养体积 | 培养容器：摇瓶、分料培养、补料、连续培养、微孔板\
  \ | 氮条件：充足、限制 | 氧气条件：充足、限制、厌氧 | pH | 温度 | 直接进化是/否 | 当输出代菌株时，你需要包含母菌株中的表达和敲除基因。如果没有提供数据，请始终提供完整表格，只留\
  \ NA。不要提供解释和注释。\"\n\n该提示词通过限制响应为表格格式并显式要求缺失数据留空值来减少幻觉。在这里，使用了 OpenAI o1-mini 以平衡性能和成本。\n\
  \n* **步骤 3：自动生成 CSV 和人工验证** 提取的表格将通过分隔符拆分为行并保存为 `individual.csv` 文件。领域专家用户可以审查输出以验证准确性。\n\
  \n\n\n\n尽管在知识图谱和 RAG 的赋能下，GenAI 和 LLMs 为合成生物学学学应用提供了巨大的潜力，但将其集成到真实工作流中仍面临若干挑战。*首先*，基础设施限制仍然存在。LLM\
  \ 的性能和准确性高度依赖于其参数规模，参数大于 700 亿的模型通常需要云端部署。这为专有研究或敏感数据引发了数据安全担忧，可能阻碍学术界和工业界的采用。将敏感信息传输到第三方云服务会引入风险，即使使用了加密技术也是如此。受严格法规监管的应用（例如医疗保健）面临着合规性挑战，而在敏感数据集上训练的模型可能会无意中记忆并暴露专有信息。确保\
  \ LLM 本地部署需要高端 GPU，这对于许多实验室来说成本高得令人负担。在硬件公司优先考虑本地 AI 工作流之前，平衡性能与隐私将继续是一个挑战。*其次*，知识图谱存在扩展性限制。当输入文本超过约\
  \ 5,000 篇文章时，信息检索和查询效率就会下降。此外，LLM 难以协调冲突信息或非主流观点，这可能会导致推理错误的传播。*第三*，LLM 驱动的数据提取受预定义特征的限制，产生了“特征偏置”，限制了机器学习解释的范围，仅限于那些预定义的输入。克服这些限制需要合成生物学和生物工艺工程社区的合作，建立标准化的数据报告规范，以增强机器学习的可解释性。\n\
  \n## 9.5 结论\n\n生成式 AI 集成到合成生物学和生物工艺工程中代表了向数据驱动的生物设计和制造的新方向。`NEKO` 和 `GraphRAG` 等工具证明了知识挖掘如何将碎片化的科学文献转化为可操作的见解，弥补了实验数据、菌株工程和生物反应器优化之间的差距。同时，LLM\
  \ 驱动的数据集生成协议解决了长期以来的人工数据整理瓶颈，使预测性机器学习研究、自动驾驶实验室和数字孪生成为可能。最终，生成式 AI 与合成生物学的协同作用为未来的生物制造基础模型奠定了基础。\n\
