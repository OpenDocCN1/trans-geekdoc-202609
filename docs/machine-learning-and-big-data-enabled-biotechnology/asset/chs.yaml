  \n# 13 在自动化生物工厂中简化“设计-构建-学习”流程\n\n¹Enrico Orsi, 丹麦技术大学，诺和制基可持续性中心，Sølfts Plads 1,\
  \ Kongens Lyngby\n²微生物培养工艺部门，诺和制基 A/S，Novo Alle 1, Bagsvård\n\n## 13.1 引言\n\n在合成生物学时代，设计-构建-测试-学习循环\
  \ (DBTLc) 已成为生物元件标准化优化的正式流程[1]-4]。循环中的每个模块都有特定功能并实现不同目标，面临各自的挑战。值得注意的是，DBTLc 中固标准化可以显著提高迭代次数，推动合成生物学更快、更高效的进展[3]。\n\
  \n随着我们见证大数据、人工智能 (AI) 和机器学习 (ML) 技术渗透所有生物学领域[5]-8]，DBTLc 需要高通量方法来生成和分析大量数据。原则上，工业生物技术的整个工作流——从\
  \ DNA 合成到工程菌株的生物工艺优化——现在可以在每一步生成（并分析）高通量数据[9]。\n\n在生物工厂内成功执行这些高通量迭代循环是本挑战之一。为了解决这个问题，全球生物工厂联盟已作为协作网络建立[10]。\n\
  \n\n\n\n随后，我们探讨了生物工厂（biofoundries）的全球发展情况，并对其特征以及对合成生物学的贡献提供了深入见解。接着，我们分析了阻碍生物工厂充分发挥其潜力的当前挑战。这些挑战包括技术瓶颈、集成问题，以及对进一步标准化和协作的需求。最后，我们通过可能简化自动化生物工厂工作流的未来展望和趋势对本章进行了总结。通过全面审查这些方面，本章旨在阐明如何优化生物工厂，以驱动合成生物学的创新，同时支持全球生物经济的可持续发展实践。\n\
  \n## 13.2 设计-构建-测试-学习循环 (DBTLc)\n\n用于合成生物学标准化和迭代的 `DBTLc` 范式（图 13.1）是一个根源于（电子）工程原理的概念\
  \ [\\[13\\]](#c13.xhtml#c13-bib-0013)]。在默认情况下，`DBTLc` 可应用于任何感兴趣的生物学部分的优化，例如 DNA\
  \ 组装 \\[14–18]、蛋白质工程 [\\[19\\]](#c13.xhtml#c13-bib-0019)]、代谢重构 \\[20–22]，甚至是一个整个生物工艺\
  \ [\\[23\\]](#c13.xhtml#c13-bib-0023)]。然而，如第 13 章 后续章节详细所述的，大量文献描述了将 `DBTLc` 用于微生物菌株工程\
  \ [\\[13\\]](#c13.xhtml#c13-bib-0013)]。在这种设置下，微生物被作为细胞工厂进行研究和改进，以执行具有工业意义的生物转化。为了简单起见，我们在下一节将遵循这一范围来描述\
  \ `DBTLc` 模块。\n\n### 13.2.1 DBTLc 组件\n\n在工程化微生物的背景下，`DBTLc` 阶段结构分为四个部分：\n\n**设计**。该阶段的范围是确定整个迭代的策略。它包括选择要实施的目标修改，以及设计用于合成并引入宿主以实现此类修改的生物学部分。它可能包括，例如选择表达的异源基因，或用于基因删除的质粒\
  \ `in silico` 设计（计算机设计）。在某些情况下，使用基因组规模代谢模型（如在第 1 章、第 2 章](#c02.xhtml)和第 9 章](#c09.xhtml)所示）可以通过识别要删除或过表达的靶基因来指导设计阶段\
  \ [\\[24\\]](#c13.xhtml#c13-bib-0024)]。一些公共数据库也可用于指导设计阶段。京都基因与基因组百科书（KEGG）是早先设计的数据库之一，用于系统地分析基因功能、细胞过程、化学化合物和酶\
  \ [\\[25\\]](#c13.xhtml#c13-bib-0025)]。同样，`BRENDA` 是酶-配体相互作用的综合资源 [\\[26\\]](#c13.xhtml#c13-bib-0026)]。MetaCyc\
  \ 提供了一个精选的代谢反应目录 [\\[27\\]](#c13.xhtml#c13-bib-0027)]。用于从这些数据库中提取数据并识别该领域可行工程策略的软件工具包括\
  \ `Optknock` [\\[28\\]](#c13.xhtml#c13-bib-0028)]、`Fastknock` [\\[29\\]](#c13.xhtml#c13-bib-0029)]、`Retropath2.0`\
  \ [\\[30\\]](#c13.xhtml#c13-bib-0030)]、`Selenzyme` [\\[31\\]](#c13.xhtml#c13-bib-0031)]\
  \ 和 `EnzymeMiner` [\\[32\\]](#c13.xhtml#c13-bib-0032)]。一旦选择了给定途径的组件，必须合成相应的 DNA\
  \ 序列。这一过程利用了既有框架，如 `BioBricks` [\\[33\\]](#c13.xhtml#c13-bib-0033)]、`SEVA` 质粒系统\
  \ \\[34–37] 以及计算工具（例如 `RBS Calculator v2.1` [\\[38\\]](#c13.xhtml#c13-bib-0038)]），这些工具能够对基因表达进行物理建模，该内容在第\
  \ 3 章中有所介绍。\n\n![设计-构建-测试-学习循环（DBTLc）的经典形式（内圈）和自动化设置。使用 BioRender 创建。](img/c13f001.png)\n\
  \n**构建**。这一的目的是创建迭代所需的生物部分。在菌株工程中，这涉及组装待测试的生物组件，例如用于异源基因表达的质粒或用于基因灭活的 DNA 盒。常规技术包括，例如\
  \ `Gibson assembly` [\\[40\\]](#c13.xhtml#c13-bib-0040)]（一种使用核酸外酶、聚合酶和连接酶连接重叠 DNA\
  \ 片段的一步等温反应）；`Golden Gate assembly` [\\[41\\]](#c13.xhtml#c13-bib-0041)]（一种基于限制酶的方法，利用\
  \ II 型限制酶进行无缝克隆）；`USER cloning` [\\[42\\]](#c13.xhtml#c13-bib-0042)]（使用含尿啶引物扩增 PCR\
  \ 产物，去除尿啶残基并通过互补悬垂组组装片段）；以及传统的连接连接。这一步还包括这些构建体转化到最终宿主中。基因编辑技术的最新进展，特别是 `CRISPR/Cas`\
  \ 工具包 [\\[43\\]](#c13.xhtml#c13-bib-0043)–45]，显著增强了这一过程，能够引入不同类型的突变，甚至在非模型微生物中 [\\\
  [46\\]](#c13.xhtml#c13-bib-0046)–48]。当 DBTLc 的目标是菌株表征时，原则上可以省略这一步。\n\n\n\n\n\n##\
  \ 测试 (Test)\n此阶段的范围是衡量之前阶段所实施修改的效果。它通常涉及培养实验，随后对表型（例如产物分子）进行定量分析，通常通过计算效度（g/L）、速率（g/L/h）和产率（g/g）来完成\
  \ [49]]。该阶段高度依赖分析技术，因此被认为是 DBTLc 循环的技术瓶颈。在进行多层次菌株表征时（例如通过组学分析 [50]]），这些技术的通吐量很高，会产生大量需要复杂解读的数据\
  \ [51]]。基因组学通过分析 DNA 序列来识别工程化构建体中的遗传变异和修饰，从而为生物体提供了基础蓝图。转录组学通过检查基因表达模式（例如通过 RNA\
  \ 测序 (RNA-seq)）来理解调节响应并优化修改 [52]。蛋白质组学研究蛋白质的表达、修饰和相互作用，为遗传和转录变化的功能结果提供见解。代谢组学通过分析细胞内和细胞外代谢物提供关于代谢状态的详细见解，能够对生化途径活动和细胞生理学产生全面的理解\
  \ [53–55](#c13.xhtml#c13-bib-0055)。\n\n## 学习 (Learn)\n最后，学习阶段评估迭代的成功与否并决定是否需要新的设计阶段。这一步通常结构化程度较低，依赖于**ad\
  \ hoc)*观察和文献数据 [56]。然而，随着每个实验产生的数据量增加，越来越需要对该阶段采用更结构化、数据驱动的方法。近年来，机器学习（ML）在生物技术流程中的应用显著扩大，这得益于下一代算法的出现（例如深度学习——一种采用分层架构的神经网络方法子集）以及易用开发框架的可用性\
  \ [57, 58]。正如下一节详细讨论的，这些方法能够在生物合成工厂高通量数据生成的范围内进行数据解读。\n\n### 13.2.2 DBTLc 在菌株工程中的应用\n\
  DBTLc 使用的一些示例已获得广泛认可，现在被认为是该领域的金标准。代谢工程早期的 DBTLc 迭代之一是耗时十年的努力，旨在改造*大肠杆菌*（*Escherichia\
  \ coli*）和*酿酒母*（*Saccharomyces cerevisiae*）生产抗疟药物蒿。从 2003 年开始在大肠杆菌中异源表达真核甲羟戊酸途径，产生了约\
  \ 25 μg/L 的齐形石二烯——这是蒿的第一种关键性前体 [59]。作者报告称效度从 25 g/L 提高到 25 g/L，这是一个惊人的百万倍增长，最终在\
  \ 2013 年实现了青蒿酸到蒿的一步化学转化 [60]。从大肠杆菌切换到酿酒母作为生产宿主的原理，以及这一成就的完整路线图，在一项总结整个科学之旅的研究中得到了广泛综述\
  \ [61]。\n\n另一个 2010 年代初著名的 DBTLc 成功案例是改造大肠杆菌以生产 1,4-丁二醇，这是一种用于塑料、聚酯和氨氨纶纤维的非天然化学构建块。这项工作在设计阶段受基因组规模建模的指导，以指导构建阶段进行理性的工程修改，实现了高达\
  \ 18 g/L 的效度 [62]。生物制造中其他 DBTLc 驱动的进展还包括菌株工程努力，这些努力已使多种大宗化学品的效度超过 100 g/L，例如琥酸 [63]、乳酸\
  \ [64]、L-氨基酸 [65] 和戊二酸 [66]。此外，DBTLc 方法在优化原核和真核菌株作为细胞工厂方面发挥了关键作用，扩大了用于生物制造的驯化菌株数量\
  \ [67–75](#c13.xhtml#c13-bib-0075)]。\n\nDBTLc 活动日益成功推动了专用基础设施的发展以支持这些工作流。正如我们在下一节将探索的那样，生物合成工厂代表了菌株工程标准化和自动化巨大飞跃。通过将计算驱动的设计与机器人辅助工作流相结合，生物合成工厂增强了通量并加速了菌株优化。\n\
  \n### 13.2.3 生物合成工厂及其运行部分的描述\n生物合成工厂是一种先进的实验室，利用自动化、机器人技术、人工智能和高通量技术来执行和优化 DBTL\
  \ 循环（图 13.1）。这些基础设施旨在标准化工作流，解决如耗时的人工操作、结果变异和生物系统日益复杂性等挑战。生物合成工厂的核心组件包括以下模块：\n\n\
  #### 设计 (Design)\n这些系统使用计算工具进行蓝图设计，设计 DNA 序列、代谢途径和合成电路 [76, 77]。基于机器学习算法的软件预测工程系统的性能，为生物工程提供了更具针对性的方法。如上所述，几个更新和精化的数据库提供了包含多种微生物基因功能、细胞过程、化学化合物和酶的广泛库，作为途径设计的初步步骤。这些数据库不断更新和精炼，使其成为代谢工程和途径设计中选择酶活性和途径的主要资源。各个组件被仔细选择并集成到计算机（*in\
  \ silico*）框架中，共同协调复杂的功能，最终形成在后续步骤中组装的蓝图原型。\n\n\n\n\n\n## 构建 (Build)\n\n在这一阶段，重点是通过先进的实验室自动化步骤对生物构建体进行物理组装和合成，包括用于\
  \ DNA 组装的机器人加液器、高通量克隆平台、自动挑菌器以及用于精确操控生物样本的微流控设备 [[78]](#c13.xhtml#c13-bib-0078)。近年来，开发了专门的工具箱，以将新功能整合到选定的微生物宿主。全基因组修改将快速的多部分\
  \ DNA 组装方法与先进的基因组工程技术相结合 [79–84]。如上所述，分子生物学的一项重大进展是发现了 CRISPR 及其相关的 Cas 蛋白，它们已应用于基因和基因组编辑领域\
  \ [85–87]。为了扩大这些技术的应用范围，人员开发了多点编辑策略，能够同时修改真核和原核基因组中的多个位点 [88]。当这些技术实现自动化时，可以提高实现突变的速度和程度。此外，在单碱基对水平上优化\
  \ DNA 序列时，使用多样化的文库扩大了潜在解决方案的范围，特别是在定向进化的背景下 [89–91]。在某些情况下，可以利用*体内*（in vivo）超频突变体来促进并完善这些进化过程\
  \ [92, 93]。\n\n## 测试 (Test)\n\n自动化高通量筛选 (HTS) 技术对于评估工程生物构建体的至关重要，能够对各种生物和生化性质进行快速高效的评估\
  \ [94–96]。自动化生物反应器对于工程生物构建体的 HTS 至关重要，它们为细胞培养提供了精确控制的环境，同时持续监测并调整 pH、氧水平、营养供应和生物量产量等关键参数\
  \ [97]。这些系统能够实现实时数据收集，提高生物工艺开发中的可重复性和扩展性 [98, 99]。与此同时，多组学技术在测试和表征工程构建体方面起着关键作用\
  \ [100]。自动化培养与基于组学的测试相结合，产生了全面的、高分辨率数据集，促进了合成生物学和生物技术中的高级计算分析、预测建模和迭代设计改进。\n\n##\
  \ 学习 (Learn)\n\n合成生物学 (SynBio) 同时依赖机理模型和机器学习模型从组学数据中提取见解，最终优化 DBTLc 循环中的菌株工程策略 [101–104]。先进机器学习算法与自动化的结合实现了大型数据集的高效利用，促进了工艺优化新型干预措施的预测\
  \ [105]。在实践中，机理模型代表系统中的分子组件及其相互作用，提供了增强的可解释性、透明度和说明性。这些模型帮助研究人员理解控制细胞行为的底层机制，并引导假设驱动的工程。相比之下，机器学习技术利用统计和计算方法，在识别高维组学数据集中复杂且显而易见的模式方面特别有效\
  \ [106–108]。通过区分区分菌株和实验条件的关键特征，机器学习模型可以通过突出缺失的组件和相互作用来完善机理模型。虽然机器学习模型可能缺乏可解释性，但它们在从大型数据集中提取有意义的信息方面起着关键作用\
  \ [109–111]。最后，生物工厂包括数据管理工具，这些工具依赖集中数据库来确保各种软件和自动化系统之间的互操作性 [110]。\n\n### 13.2.4\
  \ 生物工厂中具有自动化能力的实验室工作流\n\n如上所述，DBTLc 可应用于多个领域。生物工厂实现了广泛工作流的自动化，显著降低了成本和周期。具有自动化潜力的不同工作流的要概述见表\
  \ 13.1。在生物工厂中可以执行的 DBTLc 示例包括但不限于：\n\n#### DNA 合成与组装\n\n合成大量 DNA 和生成组合文库的能力是合成生物学的基础\
  \ [112, 113]。生物工厂中的自动化平台可以对 DNA 构建体进行无错误的合成和组装，创建具有数千种变体的文库 [114]。一旦合成，DNA 片段就可以组装成更大的构建体。目前开发了多种组装方法，包括\
  \ Gibson 组装 (Gibson Assembly) 和金大门组装 (Golden Gate Assembly)。这两种技术由于其高效性和无痕整合，在合成生物学中被广泛使用。例如，这些技术可以在加液机器人平台上实现自动化。人员通过优化不同液体粘度（例如酶、DNA、水和缓冲液）的移液参数，在加液机器人上实现了基于\
  \ Type-IIS 限制酶的模块化克隆（MoClo）技术的 DNA 组装方案 [115]。此外，他们开发了一个基于工具 (`mocloassembly.com`)，可以从\
  \ GenBank 文件自动生成脚本并构建文库。该工具包含了优化的液体类型、实验耗材设置和板框布局，DNA 部分可通过 Addgene 和波士顿大学的 BDC\
  \ ICE 注册获取。该工作流实现了高通量、低错误的 DNA 组装，测序数据显示准确率约为 95%，仅需 4% 的人工工作量 [115]。最后，MoClo 的改进版本（称为\
  \ RoboMoClo 框架）采用了一种整合了层次和迭代基因组装策略的混合方法，与传统的 MoClo 系统相比，使用了更少的载体 [116]。\n\n表 13.1\
  \ 生物工厂中可以自动化的生物工作流概述。\n\n| 工作流 || 自动化内容 || 如何实现 || 示例 || 参考文献 |\n\n| --- | --- |\
  \ --- | --- | --- |\n\n\n\n\n\n| 类别 | 关注领域 | 关键技术 | 应用场景 | 参考文献 |\n| :--- | :---\
  \ | :--- | :--- | :--- |\n| DNA 合成/库构建 | DNA 设计、合成、组装和纠错 | 机器人系统执行寡核苷酸合成、错误检查和组装\
  \ | CRISPR 库构建；代谢途径工程 | [114–116\\] |\n| 蛋白质工程 | 定向进化工作流、突变和筛选 | 自动化突变和高通量筛选 | 生物燃料的酶优化\
  \ | [92, 123\\] |\n| 细胞工厂 | 细胞生产系统的工程化与测试 | 高通量遗传转化和表型筛选 | 胰岛素、乙醇或生物塑料的生产 | [125–127\\\
  ] |\n| 原型制作 | 测试多个设计迭代版本 | 高通量平台在受控条件下评估原型 | 合成电路；生物传感器 | [126, 132\\] |\n| 工艺优化\
  \ | 规模生产工艺的放大与调优 | 自动化发酵系统和过程分析技术 | 工业级酶生产 | [128, 130, 131, 133\\] |\n\n## 库构建与克隆\n\
  \n组合 DNA 库对于探索遗传多样性和优化生物功能至关重要。库可以通过定点突变、基于重组的方法或随机突变生成。主要方法包括：(1) 基于寡核苷酸的突变，在基因内部的定义位置引入特定突变\
  \ [[117\\]](#c13.xhtml#c13-bib-0117)；(2) 易错 PCR，在 PCR 扩增过程中引入随机突变以产生遗传多样性 [[118\\\
  ]](#c13.xhtml#c13-bib-0118)；(3) `in vivo` 超突变体，增加生物系统中的突变累积速率 [[119\\]](#c13.xhtml#c13-bib-0119)；(4)\
  \ DNA 洗牌，涉及不同 DNA 片段的重组以产生新序列 [[120\\]](#c13.xhtml#c13-bib-0120)；以及 (5) 基于 CRISPR\
  \ 的库构建，依赖于 CRISPR-Cas9 生成全基因组敲除或激活库 [[121\\]](#c13.xhtml#c13-bib-0121)。这些库可以包含成千上万个变异体，能够针对优化酶、调节元件或代谢途径进行定向进化和功能筛选\
  \ [[122\\]](#c13.xhtml#c13-bib-0122)。\n\n## 蛋白质工程\n\n生物合成工厂还通过整合简化蛋白质工程工作流的自动化技术，促进了具有定制属性的新型蛋白质开发\
  \ [[92\\]](#c13.xhtml#c13-bib-0092)。自动化定向进化工作流（包括突变和高通量筛选 HTS）使研究人员能够识别出适用于工业、制药和农业应用的优化型蛋白质。定向进化是蛋白质工程中的一项强大技术，它通过模拟自然选择使蛋白质朝着预定义的功能目标演化。这一迭代过程涉及通过随机突变产生多样化的蛋白质变异体库，然后通过选择或筛选来识别出具有增强或新颖功能的变异体\
  \ [[123\\]](#c13.xhtml#c13-bib-0123)。生物合成工厂内部对这一工作流的自动化加速了进化过程，能够快速识别适用于各种应用的优化型蛋白质。HTS\
  \ 在评估大型蛋白质变异体库以识别具有理想特征的变异体方面起着关键作用 [[96\\]](#c13.xhtml#c13-bib-0096)。自动化 HTS 平台能够对数百万个变异体的活性、稳定性和特异性进行快速评估，与传统的\
  \ le 方法相比，显著减少了所需的时间人力。此外，HTS 与自动化定向进化的结合，配合机器学习算法，通过对有益突变进行预测建模，提高了蛋白质工程的效率。这些计算方法完善了突变库的设计，并有助于识别具有改进催化特性的酶变异体，从而提升了生物合成工厂在蛋白质优化方面的能力\
  \ [[124\\]](#c13.xhtml#c13-bib-0124)。\n\n## 制造菌株工程\n\n将微生物或哺乳动物细胞工程化为生产高价值化合物（如生物燃料、药物和特种化学品）的“工厂”，是生物合成工厂的重点。自动化实现了这些细胞系统的快速原型制作和迭代优化。高通量原型涉及评估多个设计迭代，以识别最有效的解决方案。生物合成工厂中的自动化工作流能够同时处理几十甚至数百个原型，显著提高了\
  \ `DBTLc` 的效率。这种方法对于优化遗传电路、代谢途径和酶功能具有特殊价值 [125–127]。例如，一个自动平台已用于在大肠杆菌中生物合成 `(2S)-pinocembrin`，证明了自动化\
  \ `DBTL` 循环的有效性。通过两次 `DBTL` 迭代，产量提高了 500 倍，实现了高达 88mg/L 的竞争性水平。此外，该方案在优化生物碱合成途径中的应用表明了其在加速微生物菌株工程和优化多种化合物生产方面的潜力。\n\
  \n## 工艺优化\n\n一旦设计通过验证，生物合成工厂在优化生产工艺方面发挥着关键作用。自动化系统可以微调发酵条件、培养基组成和下游处理步骤等参数，在保持产品质量的同时确保最大产量和成本效益\
  \ [128–131\\]。\n\n## 13.3 全球生物合成工厂分布\n\n在生物合成工厂中实施成功的工作流面临挑战。随着这种新型基础设施在全球范围内迅速普及，全球生物联盟（GBA）于\
  \ 2018 年成立，旨在通过协作和知识共享加速生物合成工厂的成功实施 [[10\\]](#c13.xhtml#c13-bib-0010)。GBA 联盟最初由来自四大洲的\
  \ 15 个非商业性生物合成工厂组成，截至 2025 年已有 35 个成员（`https://www.biofoundries.org/members`），证明了该倡议的成功。然而，涵盖的四大洲仍为北美、欧洲、亚洲和大洋洲。尽管这些生物合成工厂在设备和组织上具有内在相似性，但某些工厂专门从事特定目标，导致了某种范围上的分化（见表\
  \ 13.2）。\n\n\n\n\n构建生物工厂的高昂资本成本使得新兴经济体在开发此类基础设施方面面临挑战。建立生物工厂是一个复杂且昂贵的过程，需要特种设备和专家人员，其运营成本远高于标准实验室\
  \ [[11]](#c13.xhtml#c13-bib-0011)。然而，自动化可以显著提高速度、可重复性和可靠性，使生物工厂成为合成生物学计划的核心枢纽和经济发展的驱动力。此外，随着计算和机器人技术的不断进步，其成本预计将下降，使生物工厂随着时间的推移变得更加普及。因此，我们希望新兴经济体能将国家生物工厂作为其发展议程的一部分进行战略性投资，以应对未来技术壁垒的降低。最后，目前的重点是加强协作、优化工作流，并确保该领域成果的可重复性和重复利用。生物工厂已在支持初创公司和中小企业（SME）增长方面发挥着关键作用，同时促进了私公司、学术机构和政策制定者之间的合作。这种协作环境正在推动可靠、具有成本效益的合成生物学标准的建立，这些标准正获得用户的广泛认可。此外，地方政府和区域资助机构正积极支持生物工厂枢纽内的平台技术，帮助降低私人投资新创企业时相关风险，同时也培养一个推进合成生物学技术的繁荣生态系统\
  \ [[134]](#c13.xhtml#c13-bib-0134)。\n\n### 表 13.2 全球生物工厂联盟中非商业生物工厂示例，其专业范围超出了菌株工程的通用\
