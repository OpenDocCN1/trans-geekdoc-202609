  # 14 用于表型预测和生物反应器优化的机器学习增强建模\n\nOliver Pennington\n\n¹曼彻斯特大学，化学工程系，曼彻斯特路\n²福州大学，生物科学与工程学院，乌龙江北路\n\
  \n## 14.1 生物工艺建模与优化\n\n### 14.1.1 生物工艺建模的挑战\n\n第四次工业革命（通常被称为“工业 4.0”）要求将智能技术整合到制造和工业过程中，在提高生物工艺效率、可持续性和盈利能力方面发挥关键作用\
  \ [1, 2。由于进一步探索生物工艺自动化的愿望，数字化目前处于生物工艺开发的前沿 [3。数字化本身依赖于数字孪生的发展，这是 2002 年首次提出的概念，物理领域和数字领域之间会自动进行双向信息传递。有效的数字孪生有助于实时决策，以最大化生产率、效率和可持续性\
  \ [4。建模通过实时模拟物理领域以及可能用于软传感器预测不可观测状态，在数字孪生的开发中起着关键作用 [5, 7。开发数字孪生的主要挑战在于拥有准确且经过验证的模型\
  \ [6, 8。\n\n开发生物工艺模型极具吸引力，因为它们具有潜在的应用场景，如实验设计 (DoEs) 和设计质量 (QbD)。然而，构建此类模型具有巨大挑战，特别是当引入了额外的状态和控制变量时\
  \ [9。因此，像一级动力学这样的简单模型通常只适用于狭窄的操作空间。文献中找到生物工艺模型通常可以归类机器学习（“数据驱动”或“黑箱”）与机理（“动力学”或“白盒”）之间光谱上的某处\
  \ [10。由于上述构建详细机理模型相关的挑战，一种合理的方法是基于第一原理建立模型 [11, 12。此类模型包含具有物理可解释性的参数，提供了一些见解。然而，当在推导模型时做出假设时，模型本身仅在假设成立的操作空间内有效，这意味着它失去了泛化性。通过构建更详细的机理模型可以提高泛化性；但这将需要更多数据。\n\
  \n在光谱的另一端，机器学习模型没有先验假设，并且具有很强的泛化能力。例如，人工神经网络 (ANNs) 被认为能够近似任何函数 [14]。使用纯机器学习模型听起来很有吸引力；然而，需要大量的数据才能充分捕捉潜在的非线性关系，例如底物与细胞生长之间的关系。此外，实验成本高昂，且某些状态难以测量，导致生物工艺数据通常是多源、多尺度、噪声且异构的（混合了在线和离线、二值和连续数据）\
  \ [15]。因此，能够获得足够的数据来训练特别非线性的生物系统机器学习模型并避免过拟合，并不常见。\n\n\n\n\n无论构建何种模型，批次间的差异等挑战也会导致模型训练和验证出现问题。此外，模型在放大过程中可能会由于各种现象而表现不足，包括不同的流态状态以及更普遍的局部营养和细胞群的异质性。结果，放大过程往往会观察到不同的过程动力学，从而导致产量和生产率降低，甚至导致培养的完全失败。因此，开发具有最强外推能力和泛化能力的生物工艺模型至关重要，以最大限度地提高预测准确性和整合新信息的能力。因此，开发先进的生物工艺模型并非易事。\n\
  \n在本章中，我们将探索如何利用机器学习来增强对生物工艺的理解，用于发酵过程的建模和优化，同时充分利用有限的实验数据和基础工艺知识。\n\n## 14.1.2\
  \ 用于生物工艺建模的机器学习\n\n机器学习是解决工艺知识缺乏和系统高度复杂性的强大工具，这在评估生物系统时通常如此。处理复杂且难以理解的系统的能力，鼓励了使用各种技术将机器学习应用于许多生物工艺中。在本节中，我们将简要概述生物系统中不同的机器学习应用（包括近期和非期的）。\n\
  \n### 14.1.2.1 主成分分析与偏最小二法\n\n主成分分析（`PCA`）是一种线性降维技术，它生成称为主成分的潜变量，以尽可能解释原始变量中最大的方差\
  \ [\\[16\\]](#c14.xhtml#c14-bib-0016)。`PCA` 已应用于若干生物化学领域，包括识别沼气和生物燃料生产中运行因素之间的模式\
  \ \\[17, 18]、细胞表型判别 [\\[19\\]](#c14.xhtml#c14-bib-0019)、过程异常检测 [\\[20\\]](#c14.xhtml#c14-bib-0020)\
  \ 以及确定产物分布之间的统计相似性和差异 [\\[21\\]](#c14.xhtml#c14-bib-0021)。由于生物系统固有的复杂性，降维对于简化问题可能特别有用；一项将\
  \ `PCA` 与 `ANN` 结合用于巴西桉树林地生产能力的研究表明，使用潜变量提高了了 `ANN` 的预测能力 [\\[22\\]](#c14.xhtml#c14-bib-0022)。当然，将\
  \ `PCA` 应用于生物工艺建模的最大限制是，由于 `PCA` 的线性本质，无法捕捉在某些生物系统中观察到的非线性关系。\n\n偏最小二法（`PLS`）在许多方面与\
  \ `PCA` 相似；然而，它不仅使用潜变量，还以线性方式将输入与输出直接起来。对于多输入多输出（`MIMO`）模型，可以直接使用 `PLS`；但在某些情况下，多输入单输出（`MISO`）格式的每个单独输出并行使用多个模型\
  \ [\\[23\\]](#c14.xhtml#c14-bib-0023)。在生物系统应用方面，`PLS` 已有多次应用，包括酵母发酵生物反应器中运行条件的分类与鉴定\
  \ [\\[24\\]](#c14.xhtml#c14-bib-0024)、生物工艺监测 [\\[25\\]](#c14.xhtml#c14-bib-0025)、生物反应器状态估计与控制\
  \ \\[26, 27]、具有蛋白质功能的氨基酸序列映射 [\\[28\\]](#c14.xhtml#c14-bib-0028) 以及识别通量关系 [\\[29\\\
  ]](#c14.xhtml#c14-bib-0029)。与 `PCA` 类似，`PLS` 限于不需要完全捕捉非线性关系的应用。\n\n### 14.1.2.2\
  \ 人工神经网络\n\n`ANNs` 能够捕捉复杂的非线性关系，通常以 `MIMO` 或 `MISO` 模型的形式出现。`ANNs` 的灵感源于模拟人类大脑，神经元网络可以被“激活”以传递信息\
  \ [\\[14\\]](#c14.xhtml#c14-bib-0014)。由于 `ANN` 捕捉非线性关系的能力，`ANNs` 在生物系统中已有多种应用。例如，之前的研究已利用\
  \ `ANNs` 预测甲烷含量和生物气产量 [\\[30\\]](#c14.xhtml#c14-bib-0030)、在线预测发酵动力学 [\\[31\\]](#c14.xhtml#c14-bib-0031)、识别批次处理合适的动力学模型结构\
  \ [\\[32\\]](#c14.xhtml#c14-bib-0032)、优化藻类生物燃料生产 [\\[33\\]](#c14.xhtml#c14-bib-0033)、预测蛋白质结构\
  \ [\\[34\\]](#c14.xhtml#c14-bib-0034) 以及分类酶的三维（3D）结构 [\\[35\\]](#c14.xhtml#c14-bib-0035)。`ANNs`\
  \ 是一个强大的工具；然而，将 `ANNs` 应用于生物系统时最突出的局限性是捕捉复杂的非线性关系需要大量数据。这类量的数据充其其获取是耗时或昂贵的，最坏的情况下可能在实践中无法获取。\n\
  \n然而，在某些情况下，基础的 `ANN` 结构可以扩展以增强其捕捉不同关系的能力。例如，深度神经网络（`DNNs`）是 `ANNs` 的子类，具有多个隐藏层节点，允许近似更复杂的关系。文献中将\
  \ `DNNs` 成功引入生物系统的案例包括构建使用 `DNN` 进行工业级发酵的混合模型 [\\[36\\]](#c14.xhtml#c14-bib-0036)，以及对“最佳茶叶发酵”的检测，即茶叶发酵已达到理想质量，但尚未因过度发酵而降解\
  \ [\\[37\\]](#c14.xhtml#c14-bib-0037)。然而，由于 `DNNs` 具有多个层，它们的参数数量往往较多，这意味着它们比浅层 `ANN`\
  \ 需要更多的训练数据来避免过拟合。循环神经网络（`RNNs`）是另一种类型的 `ANN`，已应用于生物化学过程。与前馈神经网络相比，使其成为“循环”的是添加了内部循环；拥有这种内部记忆有助于学习序列数据，例如时间序列\
  \ [\\[38\\]](#c14.xhtml#c14-bib-0038)。`RNNs` 识别序列关系的能力已被用于多种生物系统，例如统计学总结氨基酸序列 [\\\
  [39\\]](#c14.xhtml#c14-bib-0039) 以及识别基因工程中的启动子序列 [\\[40\\]](#c14.xhtml#c14-bib-0040)。此外，在监测乙醇同步糖化发酵过程中，与前馈神经网络相比，`RNN`\
  \ 表现出更好的拟合和预测能力 [\\[41\\]](#c14.xhtml#c14-bib-0041)。与大多数 `ANNs` 一样，由于生物系统缺乏数据支持，`RNNs`\
  \ 并不总是适用。\n\n### 14.1.2.3 高斯过程\n\n\n\n\n\n高斯过程（GPs）对于给定的多变量输入的每个输出变量返回的是一个概率函数，而不是标量。如果不假设存在噪声，GP\
  \ 将精确地拟合数据集 [\\[42\\]](#c14.xhtml#c14-bib-0042)。GP 在不确定性分析中特别有用，因为与其它机器学习方法不同，它可以直接估计输出的均值和方差。文献中展示了\
  \ GP 在生物系统中的若干应用，包括不确定性下微藻叶黄素生产的动态建模与优化 [\\[43\\]](#c14.xhtml#c14-bib-0043)、确保生物反应器控制中概率性约束的满足\
  \ [\\[44\\]](#c14.xhtml#c14-bib-0044)，以及估计来自`苏云黑芽孢杆菌`的 `δ`-内毒素批次生产中的细胞密度分布 [\\[45\\\
  ]](#c14.xhtml#c14-bib-0045)。高斯过程的一个显著局限性是计算后验矩阵逆的计算开销很高，这在高维问题中扩展性较差 [\\[46\\]](#c14.xhtml#c14-bib-0046)。然而，目前正在进行关于降低计算成本下近似对称正定矩阵求逆的研究，这扩展了\
  \ GP 的适用性 [\\[47\\]](#c14.xhtml#c14-bib-0047)。\n\n### 14.1.2.4 集成学习\n\n集成学习（EL）通过结合多个归纳（将输入映射到输出的机器学习模型），根据每个单独归元的输出来生成单一输出。集成学习结构通常涉及串联结构，例如梯度提升（GB），其中第一个归纳提供初始预测，并由后续归纳进行纠正；或者是并行结构，例如随机森林（RF），其中并行的归纳预测通过平均或加权处理以给出单一输出\
  \ [\\[48\\]](#c14.xhtml#c14-bib-0048)。由于随机森林是生物系统建模应用更广泛的集成学习方法 [\\[23\\]](#c14.xhtml#c14-bib-0023)，其应用案例包括利福霉素\
  \ B 生产的发酵优化 [\\[49\\]](#c14.xhtml#c14-bib-0049)、工业规模补料分批发酵的软传感器 [\\[50\\]](#c14.xhtml#c14-bib-0055)，以及用于生物柴合成的脂肪酸甲酯（FAMEs）的烷值估计\
  \ [\\[51\\]](#c14.xhtml#c14-bib-0051)。尽管利用率较低，GB 仍已应用于如液-液生物分离 [\\[52\\]](#c14.xhtml#c14-bib-0052)\
  \ 和生物氢产量预测 [\\[53\\]](#c14.xhtml#c14-bib-0053)。尽管集成学习是一种强大的建模工具，但由于涉及参数过多，它可能会遭受过拟合，且如果系统包含过多的归元，运行开销可能非常大。\n\
  \n### 14.1.2.5 强化学习\n\n强化学习（RL）是一种通过提供奖励和惩罚来学习最优输入序列的试错法 [\\[54\\]](#c14.xhtml#c14-bib-0054)。强化学习已证明在游戏领域极其有效，例如免费获取的象棋引擎“Stockfish”在极短的思考时间内就超过了世界顶尖人类棋手\
  \ [\\[55\\]](#c14.xhtml#c14-bib-0055)。凭借识别最优输入序列的能力，强化学习在生物系统中存在广泛的潜在应用，之前的研究探索了诸如主题：识别补料分批生物医药工艺的最优控制策略\
  \ [\\[56\\]](#c14.xhtml#c14-bib-0056)、生物工艺动力学识别 \\[57, 58]，以及随机动态生物反应器系统中受机会约束限制的策略优化\
  \ [\\[59\\]](#c14.xhtml#c14-bib-0059)。尽管具有在无模型应用中使用的潜力 [\\[23\\]](#c14.xhtml#c14-bib-0023)，但强化学习也受限于海量数据需求；试错法可能需要大量的实验，而在某些情况下，这些实验的执行成本过于昂贵且耗时。\n\
  \n### 14.1.2.6 机器学习的未来前景\n\n随着数字化推动持续，机器学习的新应用正在不断被探索。例如，已经了关于通过符号回归进行自动模型生成的研究，这允许为化学和生物化学系统自动生成可解释的数学模型\
  \ \\[60–62]。自动模型生成具有通过加速迭代模型设计来节省大量潜力，特别是在结合实验设计（DoE）以获取最优知识时 [\\[62\\]](#c14.xhtml#c14-bib-0062)。\n\
  \n此外，混合建模的概念将在第 14.1.3 节中进行详细探讨，其应用近期见了激增 \\[63, 64]，尽管混合建模早在 1992 年就被提出 [\\[8\\\
  ]](#c14.xhtml#c14-bib-0008)。\n\n\n\n\n\n![图 14.2 序列系列结构的混合模型结构图示：序列结构 (a)，其中白盒和黑盒以任何顺序相继出现；并行结构\
  \ (b)，其中白盒和黑盒模型独立运行并组合产生单一解决方案；动态混合结构 (c)，其中黑盒模型作为状态变量的函数更新时变参数，用于动态力学白盒模型中。](img/c14f002.png)\n\
  \n图 14.2 序列系列结构的混合模型结构图示：序列结构 (a)，其中白盒和黑盒以任何顺序相继出现；并行结构 (b)，其中白盒和黑盒模型独立运行并组合产生单一解决方案；动态混合结构\
  \ (c)，其中黑盒模型作为状态变量的函数更新时变参数，用于动态力学白盒模型中。\n\n### 14.1.3.2 生物系统优化的混合建模\n\n如第 14.1.3\
  \ 节所示，使用混合建模提高预测预测对于优化应用特别有益。例如，机器学习组件可以在运行新实验后轻松重新训练。训练和验证混合模型的潜在方法是运行实验设计（DoE）的实验，无论是预测的最优值还是知识匮乏的区域，并使用新数据更新机器学习组件；迭代重复这一过程可以是识别合适“最优”解决方案的有效方法，同时生成一个训练良好的模型。\n\
  \n![表 14.1 文献中生物系统的混合建模。](img/c14-i0001.png)\n\n表 14.1 文献中生物系统的混合建模。\n\n表 14.2 文献中利用混合建模对生物系统进行优化。\n\
  \n| 目标 | 自由度 | 应用 | 来源 |\n| --- | --- | --- | --- |\n| 产率和效率的几何平均值 | `C`[`S`],0,\
  \ `C`[`X`],0, `T`, `t`[`f`], `N` | 来自酿酒酵母的乙醇生产 | 77 |\n| 最终产物浓度 | `T`(`t`), `pH`(`t`),\
  \ `F``t` | 来自毕赤酵母（Pichia pastoris）的单链抗体片段生产 | 78 |\n| 最大化分泌物 | `F``1` | 来自酿酒酵母的异源蛋白生产\
  \ | 79 |\n| 最大化产率 | `t`[`f`], `t`[`ind`], `C`[`ind`] at `t` | 来自大肠杆菌（E. coli）的β-糖苷酶生产\
  \ | 79 |\n| 最大化利润 | `F``1`, `F``2` | 含质粒的大肠杆菌生产β-糖苷酶 | 79 |\n| 最大化活性物质总量 | `F``1`,\
  \ `F``2` | 细胞培养表达 IgG 的人类融合糖蛋白 | 80 |\n\n注：`C`[`S`],0 = 初始底物浓度，`C`[`X`],0 = 初始细胞密度，`T`\
  \ = 温度，`T`(`t`) = 温度变化曲线，`t`[`f`] = 最终时间，`t`[`ind`] = 诱导时间，`N` = 搅拌速度，`pH`(`t`)\
  \ = pH 变化曲线，`F``i` = 进料曲线，`C`ind = 诱导浓度，`KM` = 动力学模型，`ANN` = 神经网络。\n\n使用混合建模进行生物系统优化的某些示例见表\
  \ 14.2。正如预期的，表 14.2](#c14.xhtml#c14-tbl-0002)显示优化目标通常基于最大化生长、产量、产率或利润。表 14.2 还显示混合建模适用于多种领域，无论是哺乳细胞系、微藻培养还是真菌。\n\
  \n总体而言，神经网络和混合建模分别于 1943 和 1992 年被提出 8。然而，尽管这种建模技术已有 30 年历史，混合建模仍证明是加速生物系统开发的有效方法。混合建模的适用性归功于多种因素，包括计算能力的提高，以及获取数据收集的新工具和技术，例如无线传感器、软传感器和化学计量学\
  \ 81。由于混合建模拥有机器学习组件，当过程知识有限时，不需要将新数据直接引入机械模型，从而使数据收集技术的进步保持相关性。\n\n## 14.2 混合建模方法\n\
  \n在本节中，我们探索了预测发酵过程的混合模型构建。我们首先开发初步机械模型，然后采用机器学习组件来提高模型准确性。此后引入了不确定性分析，并说明了补料发酵系统的工艺优化。\n\
  \n\n\n\n(14.1a) $\\frac{dC_X(t)}{dt} = \\mu \\cdot C_X(t)$\n(14.1b) $\\frac{dC_S(t)}{dt}\
  \ = -q_S \\cdot C_X(t)$\n(14.1c) $\\frac{dC_P(t)}{dt} = q_P \\cdot C_X(t)$\n\n其中\
  \ $C[X]$、$C[S]$ 和 $C[P]$ 分别代表细胞密度、底物浓度和产物浓度。\n\n在这种情况下，我们知道需要一个模型来描述特定的速率，因为否则模型结构将意味着细胞培养在底物耗尽后仍会无限增长并分泌产物，同时继续消耗底物，而我们知道这些现象是错误的。尽管对于数据较多的情况，这可能提供了足够的机理信息，但引入进一步的假设对于防止我们已知不符合实际的现象发生是有益的。由于引入进一步假设会引入归纳偏置，因此这些假设在本质上应该是简单的。例如，引入针对生长和底物的\
  \ Monod 动力学，可以确保底物浓度保持非负，同时允许其相对于底物浓度存在零阶和一阶的动力学关系。为了防止细胞的无限增长，我们还可以假设相对于细胞密度存在一阶衰减速率。所得机理模型描述在\
  \ `Eqs. 14.2a–14.2c` 中：\n\n(14.2a) $\\frac{dC_X(t)}{dt} = \\mu_{max} \\cdot \\frac{C_S(t)}{C_S(t)\
  \ + K_S} \\cdot C_X(t) - \\mu_{d} \\cdot C_X(t)$\n(14.2b) $\\frac{dC_S(t)}{dt} =\
  \ -v_{max,S} \\cdot \\frac{C_S(t)}{C_S(t) + K_S} \\cdot C_X(t)$\n(14.2c) $\\frac{dC_P(t)}{dt}\
  \ = q_P \\cdot C_X(t)$\n\n\n\n\n其中 `μ[max]` 是最大比生长速率，`μ[d]` 是比死亡速率，![v Subscript\
  \ max Underscript upper S Endscripts](img/c14-i0003.png)<math display=\"inline\"\
