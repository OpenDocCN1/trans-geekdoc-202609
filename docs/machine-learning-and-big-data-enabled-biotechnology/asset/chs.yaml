  italic\">meas</mtext></mtext></math>之间的差异。\n\n优化框架 14.3 可以使用多种工具进行。梯度下降算法（如内点优化，IPOPT）是合适的，并且可以使用\
  \ MATLAB 中的 `fmincon` 函数或 Python 中的 Pyomo 和 SciPy 程序包自由访问 [83–85]。在梯度下降算法因对初始值敏感而收敛到较差解的情况下，也可以使用粒子群优化（PSO）来生成良好的初始猜测值。然而，其无梯度的特性使得它在单独使用时无法保证收敛到局部最优解。\n\
  \n还应该对机理模型进行不确定性分析以评估其性能。这可以通过计算 14.3 中目标函数（此处简称为 `Z`）相对于估计参数 `β*` 的不确定性来实现。参数估计目标相对于估计参数\
  \ `H(Z, β*)` 的海森矩阵取逆，以生成模型的协方差矩阵 `Cov(Z, β*)`，如公式 14.4 所示：\n\n```\n(14.4)![bold-italic\
  \ upper C left-parenthesis Z comma bold-italic beta right-parenthesis equals bold-italic\
  \ upper H left-parenthesis Z comma bold-italic beta right-parenthesis Superscript\
  \ negative 1](img/mrow><mo stretchy=\"false\">)</mo></mrow><mo>=</mo><mi mathvariant=\"\
  bold-italic\">H</mi><msup><mrow><mo stretchy=\"false\">(</mo><mrow><mi>Z</mi><mo>,mo</mo><mi\
  \ mathvariant=\"bold-italic\">&#946;</mi><mo>&#42;</mo></mo></mrow><mo stretchy=\"\
  false\">)</mo></mrow><mn>1</mn></msup></math> 86。可以使用蒙特卡洛采样来生成参数置信区间（在本章中，我们建议使用\
  \ 95% 置信区间，这对应于均值的两个标准差）以及后续的模型轨迹置信区间。置信区间对于衡量模型的预测能力至关重要；模型在使用命名参数值可能很好地捕捉数据，但如果置信区间很大，它就不可能做出高精度的预测。需要注意的是，在此时，如果机理模型在目标运行范围内预测良好且置信区间大小足够，则模型可能不需要进一步添加机器学习组件。\n\
  ```\n\n\n\n\n\n机理建模并不总是能以足够低的确定性产生预期的预测能力，这使其在实际应用中显得力不从心。在无法可靠地对机理模型进行进一步修改的情况下，引入机器学习组件可能是有益的，因为它可以在保持良好泛化能力的同时提高模型的准确性。\n\
  \n由于我们已经有了一个机理骨架，可以假设模型性能不佳是因为模型结构缺失了信息，这意味着模型中的某些常数参数并非常数，而是状态变量和工况随时间变化的函数。从起，我们将嵌入参数中的此类隐藏函数称为\
  \ `time-varying parameters`（时变参数）。最适合作为时变参数的是不确定性最高的参数，这些参数是通过在 Eq. 14.4 中计算的协方差矩阵识别的；标准差与标称值之比最高的参数被视为“最不确定”。相对于参数标称值对标准差进行归一化，可以避免因描述参数所选单位而引入的潜在偏差。随后必须进行敏感性分析，以确保所选参数对机理模型轨迹具有适当的影响；否则，应完全删除该参数，因为它对模型准确性的影响微乎其微。\n\
  \n一旦识别了时变参数，最终目标是使用机器学习模型将它们模拟为状态变量和工况的函数。机器学习模型的训练分两个阶段进行：(1) 识别整个时间过程中合适的时变参数曲线；(2)\
  \ 训练机器学习模型，利用相应的状态变量曲线和工艺条件来估计时变参数曲线。假设在 Eqs. 14.2a–14.2c 中最不确定的参数确定为 `μ[d]`、`K[S]`\
  \ 和 `q[P]`，则通过简单调整 Eqs. 14.2a–14.2c 和参数估计框架 14.3，即可识别它们各自的时变曲线。所得参数估计框架如 Framework\
