  \ 批准肽药物的汇编，详细介绍了给药途径和临床特征。 | 105 |\n\n除了 AMPs 外，还建立了专注于具有特定生物医学应用的肽的专门数据库。例如，`AVPdb`\
  \ 目录了针对 HIV、RSV 和 SARS 等病原体的抗病毒肽 (AVPs) 45，而 `CancerPPD` 专注于抗癌肽 (ACPs) 44。其他专门的库包括\
  \ `Hemolytik`（溶血肽）46、`B3Pdb`（穿过血脑屏障的肽）52、`Quorumpeps`（群体感肽）53 以及 `AntiAngioPred`（抗血管肽）55。此外，`PEPlife`\
  \ 和 `PLifePred` 等数据库提供了肽半衰期和*in vivo*稳定性的数据，这对于药代动力学优化至关重要 49。\n\n## 7.6 基于机器学习的加速治疗性肽发现策略\n\
  \n基于机器学习的预测模型的设计已成为分类生物活性和估计肽药代动力学性质的基本策略。这些数据驱动的方法遵循系统的流程，包括肽数据集的收集和精选、肽序列的数值编码、使用机器学习算法进行训练以及将训练好的模型应用于新序列\
  \ 63。\n\n本节概述了开发基于序列的预测模型的方法，重点介绍数据预处理、特征表示策略和模型训练工作。此外，还强调了基于机器学习的策略在功能分类、风险预测和性质估计方面的应用。\n\
  \n### 7.6.1 数据驱动方法\n\n用于估计肽性质或生物活性的序列预测模型的数据驱动方法如图 7.2 所示。\n\n```\n（图占位符或描述）\n```\n\
  \n该过程通常涉及两个阶段阶段：数据准备以及预测模型的训练与评估。\n\n第一阶段从肽序列的收集和预处理开始，必须与模型的特定目标匹配——无论是分类 AMPs、预测半衰期值还是估计溶解度。这些序列通常从精选数据集和公共肽数据库获取，如第\
  \ 7.5 节所述。收集后，对数据集进行清理处理，去除冗余条目，纠正偏差，并过滤掉包含非标准氨基酸或注释完整的序列。这一步确保了用于训练的数据质量和可靠性。\n\
  \n精选后，必须将肽序列转换为数值表示，以便与机器学习算法兼容。为此可以使用多种编码策略，从经典方法（如独热编码和物理化学性质描述符）到基于频率的方法（如 *k*-mers\
  \ 和信号变换）。近年来，基于预训练蛋白质语言模型的更先进技术（如 `ESM`、`Mistral` 和 `ProT5`）变得流行，因为它们生成的嵌入以极高的精度捕捉肽序列的上下文和功能特征\
  \ 1。\n\n\n\n\n\n一旦数值表示准备就绪，数据集会被划分为训练集、验证集和测试集，通常采用 70:20:10 的比例。在数据集相对较小的情况下，倾向于在训练和测试之间进行\
  \ 80:20 划分，并辅以交叉验证技术以最大限度地减少过拟合并增强模型的泛化能力。\n\n数据划分完成后，进入训练阶段。在此阶段，使用训练子集构建 ML 模型。根据问题和数据的性质，可以应用多种算法，包括基于距离、基于规则、基于回归、基于内核和基于集成的方法。在某些情况下，特别是在处理大型数据集或具有丰富的序列嵌入时，可能会使用卷积神经网络或循环神经网络（`RNN`）等深度学习架构来捕捉数据中复杂的高维模式。\n\
  \n训练完成后，使用验证集和测试集对模型进行评估。分类任务通常使用准确率（accuracy）、精确率（precision）、召回率（recall）和 F1 分数等指标进行评估；而回归任务通过基于相关性的指标（如皮尔逊\
  \ Pearson 和斯皮尔曼 Spearman 相关系数）以及基于误差的指标（如平均绝对误差 `MAE` 和均方根误差 `RMSE`）进行评估。验证集对于调整超参数也至关重要，通常使用网格搜索、遗传算法或贝叶斯优化等优化策略，以确定模型最有效的配置。\n\
  \n![图 7.2 开发基于序列的预测模型流程概述](img/c07f002.png)\n\n图 7.2 开发基于序列的预测模型流程概述。\n\n最后，使用独立的测试集来评估模型的泛化能力并报告最终的性能指标。该数据集还作为与其他方法或之前发表的结果进行比较的基准。一旦通过验证，训练好的模型就可以导出，并准备部署到实际应用中，包括肽筛选、药物发现和治疗候选药物的合理设计。\n\
  \n该过程始于从公共数据库或存储库中收集肽或蛋白质序列以构建数据集。然后应用预处理步骤来消除冗余、纠正不一致性并确保数据质量。经过筛选的序列通过编码技术转换为数值表示，使其适用于\
  \ ML 算法。这些编码后的数据集用于通过监督学习来训练预测模型。最后，使用验证集和测试集评估模型性能，以确保其准确性、可靠性和泛化性。\n\n### 7.6.2\
  \ 肽生物活性分类的 ML 策略\n\n实验表征肽的数量不断增加，加速了计算生物学和数据驱动技术在序列分析、功能预测和设计优化方面的应用。特别是 ML 方法已成为开发预测模型的强大工具，能够分类和表征肽的生物活性，包括抗菌、抗真菌、抗病毒和抗癌等特性\
  \ 64。这些模型不仅有助于识别有前景的治疗候选药物，还通过在合成和验证之前进行计算机模拟（*in silico*）筛选，降低了实验成本和时间。\n\n在本节中，我们介绍了目前基于\
  \ ML 的治疗肽预测建模的现状。我们描述了建模流水线的主要部分，包括数据收集、序列编码策略、模型训练和性能评估，并讨论了利用深度学习和蛋白质语言模型的最新进展。特别关注了旨在支持发现和开发具有特定生物活性肽的工具和框架。\n\
  \n#### 7.6.2.1 抗菌肽的分类模型\n\n`AMP` 分类模型的最新进展源于前沿 ML 和深度学习技术的整合。这些模型变得越来越复杂，利用多样化的架构和学习策略来提高\
  \ `AMP` 预测和设计的准确性和泛化性。\n\n一个著名的例子是 `Diff-AMP`，这是一个生成框架，整合了注意力机制、扩散模型和强化学习，以实现 `AMP`\
  \ 生成、活性预测和序列优化的自动化。通过预训练和迁移学习，`Diff-AMP` 在不同的肽数据集上实现了更增强的性能和适应性 65。与此同时，肽序列的表示变得更加多样和细致。例如，`AMPActiPred`\
  \ 依赖于传统的特征工程方法，提取一套全面的组成和物理化学描述符来构建预测特征 66。\n\n其他模型采用了混合方法。`AntiBP3` 将末端残基的二值分布与分布式表示（`embeddings`）相结合，在预测革兰阴性菌抗菌肽方面表现卓越，`AUC`\
  \ 达到 0.98 67。同时，`Deep-ABPpred` 利用双向长短期记忆（`BiLSTM`）网络结合 `word2vec` 嵌入来捕捉肽序列中的序列和上下文信息，在独立测试集上的准确率超过\
  \ 94% 68。\n\n最近，大规模模型开始拥抱预训练蛋白质语言模型的力量。例如，`AMP-Detector` 将来自蛋白质语言模型的表示与 ML 分类器相结合，以筛选大型肽类库。该框架成功识别了超过\
  \ 190,000 个潜在的 `AMPs`，并促进了 500 多种具有预测抗菌活性的新型候选肽的设计 1。\n\n#### 7.6.2.2 抗病毒肽的分类模型\n\
  \n`AVP` 预测在过去十年发生了显著变化，从早期的 ML 分类器进展到更复杂的深度学习架构和特定的病毒框架。`AVPpred` 是第一个专门为 `AVPs`\
  \ 设计的预测模型。它采用支持向量机（`SVM`）分类器，实现了 86% 的准确率和 0.71 的马修斯系数（`MCC`），为该领域的后续计算方法奠定了基础 69。\n\
  \n后期模型了集成学习技术，如随机森林（`Random Forests`）和 `AdaBoost`，提高了预测性能，准确率高达 93.26% 70。基于集的元预测器\
  \ `Meta-iAVP` 和 `PePred-Suite` 通过整合多个分类器和特征类型进一步增强了分类性能，证明了结合多种模型输出进行稳健 `AVP` 预测的价值\
  \ 71, 72。\n\n随着深度学习的兴起，包含了双向 RNN（`BiRNNs`）和卷积神经网络（`CNNs`）的架构被开发用于自动提取高级序列模式，改进了\
  \ `AVP` 预测器的泛化能力和扩展性 73。一个创新的例子是 `AI4AVP`，它将 `CNNs` 与 `GANs` 结合以合成训练数据集，解决了标记 `AVP`\
  \ 序列有限的问题，并提高了模型的稳健性 74。\n\n\n\n\n\n最近的模型已将其范围从二分类分类扩展到对目标病毒家族的多标签预测，如 `FFM-AVP`\
  \ 所示 [75。与此同时，研究人员还开发了特定病毒的预测器，用于识别针对特定病原体的活性抗病毒肽（AVPs），包括冠状病毒 [76、登革病毒 [77、丙肝 C\
  \ 病毒 [78 以及 HIV [79。例如，`iDVIP` 专注于抑制 HIV 整合酶的肽，而 `DBAASP` 平台包含了用于阻病毒进入宿主细胞的线性肽预测工具\
  \ [80, 81]。\n\n#### 7.6.2.3 抗真菌肽的分类模型\n\n抗真菌肽（AFP）分类的计算模型发展迅速，整合了日益复杂的机器学习和深度学习技术，以增强预测性能和模型的可解释性。早期的模型如\
  \ `AntiFP` 使用基于简单氨基酸组成特征的支持向量机分类器，代表了*计算机外*（*in silico*）抗真菌肽预测的早期尝试之一 [82。\n\n随着该领域的发展，模型开始引入更具信息量的描述符。例如，`Deep-AntiFP`\
  \ 将物理化学特征和准序列特征与深度神经网络相结合，提升了 AFP 与非 AFP 之间的区分能力 [83。进一步的进展来自于 `Deep-AFPpred`，它引入了基于一维卷积神经网络（`1D-CNNs`）和\
  \ `BiLSTM` 网络的混合深度学习框架，并通过迁移学习进行了增强。该架构在独立测试数据集上表现出强大的泛化能力 [84。在这些架构的基础上，`DeepAFP`\
  \ 通过在 `CNN-BiLSTM` 混合模型中整合进化信息（如位置特异性评分矩阵 `PSSMs`）以及物理化学特征，实现了更高的预测准确率（93.29%），展示了结合序列保守性和结构属性的优势\
  \ [85。\n\n最近，前沿模型采用了基于 transformer 的编码和注意力机制。`iAFPs-Mv-BiTCN` 代表了一种先进模型，它融合了 skip-gram\
  \ 和基于 transformer 的序列嵌入、基于 `SHAP` 的特征选择以及双向时间卷积网络（`BiTCN`），提供了增强的序列建模能力和可解释性 [86。同样，`MLFP-XN`\
  \ 将八种不同的特征提取和选择策略结合 `XGBoost`，实现了 99.48% 的惊准确率。注意的是，它结合了 `SHAP`（Shapley 加性解释）来解释模型预测并识别驱动分类决策的关键特征\
  \ [87。\n\n这些进展反映了 AFP 预测框架日益增长的复杂性和精性。从传统的手工特征到基于嵌入和可解释的模型，该领域不断突破肽类抗真菌药物发现的边界。进化、结构和语境序列信息的持续整合，有望进一步提高这些工具在治疗设计中的可靠性和适用性。\n\
  \n### 7.6.2.4 治疗性肽的其他分类模型\n\n除了抗微生物、抗病毒和 AFP，研究人员还开发了多种基于机器学习的预测模型，用于分类具有重要临床意义的其他治疗性肽。这包括抗寄生虫、抗肿瘤、肿瘤靶、伤口愈合和抗衰老肽等。本节介绍了用于这些特殊肽的代表性计算方法，强调了该领域技术和应用的多样性。\n\
  \n对于抗寄生虫肽（APPs），`i2APP` 等模型采用了整合 `LightGBM` 和 `SVM` 分类器的两阶段方法，实现了 91.3% 的准确率和 0.935\
  \ 的 AUC，展示了混合集成策略的优势 [88。同样，`PredAPP` 结合特征选择技术和集成分类器来提高预测的稳健性和泛化性能 [89。\n\n在 ACP\
  \ 预测领域，最近的模型采用了深度学习和降维技术以增强性能。例如，`ACPPfel` 将多种特征选择和嵌入技术与深度学习模型相结合，达到了 98.53% 的惊人准确率和\
  \ 0.997 的 AUC [90。同样，`cACP-DeepGram` 将基于 `FastText` 的 skip-gram 嵌入与深度神经网络相结合，有效捕捉了与抗癌活性相关的局部序列模式\
  \ [91。`MLACP 2.0` 采用元学习方法，将 `CNNs` 与多种编码方案相结合以支持多视图学习并进一步提高 ACP 分类准确率 [92。\n\n对于肿瘤靶向肽（THPs），`THPep`\
  \ 使用基于组成和物理化学描述符的随机森林分类器来区分具有肿瘤靶向潜力的肽，为肽类研究提供了实用工具 [93。\n\n在其他治疗类别中，模型不断扩大发现范畴。`WHP-Pred`\
  \ 利用 `XGBoost` 根据序列和生物化学属性衍生的特征集预测伤口愈合肽（WHPs） [94。同时，`Antiaging-FL` 通过整合特征融合和机器学习分类器关注抗衰老肽，能够探索在年龄相关生物过程中具有再生或保护作用的肽\
  \ [95。\n\n### 7.6.3 构建毒性分类模型的策略\n\n机器学习技术极大促进了旨在早期检测治疗性肽副作用的预测模型开发。这些毒性反应会严重限制肽类药物的临床应用，通常包括细胞毒性、溶血性和过敏性。细胞毒性是指肽损害或破坏宿主细胞的潜力，导致组织损伤或器官功能障碍。溶血涉及红细胞膜的破裂，会导致血红蛋白释放到血液并引起贫血或肾衰等严重并发症。过敏性是指肽引发免疫超敏反应的能力，从轻微炎症反应到严重可能危生命的过敏反应不等。\n\
  \n考虑到这些毒性结果的复杂性和变异性，计算模型已成为肽开发早期系统性评估安全风险的有价值工具。特别是基于机器学习的方法可以从实验数据中学习复杂的序列-功能关系，从而以高准确率识别可能产生副作用的肽。\n\
  \n\n\n\n\n本节重点介绍了多种用于预测治疗性肽毒性的机器学习（ML）框架。这些框架包括基于物理化学描述符的传统分类模型，以及更先进的深度学习架构，后者利用序列嵌入和迁移学习来增强预测性能。通过将这些工具整合到多肽发现的流程中，研究人员可以在合成和生物学测试之前有效过滤掉不安全的候选药物，从而提高治疗性肽开发的安全性特征和效率。\n\
  \n### 7.6.3.1 毒性预测\n\n`ToxinPred` 是开发的用于预测肽毒性的开创性工具之一，它采用了在序列衍生特征上训练的 `SVMs`，以合理的准确率对毒性肽和非毒性肽进行分类\
  \ [96。从那以后，该领域经历了显著演变，引入了更强大的机器学习和深度学习技术，以捕捉毒性效应背后复杂的关系。\n\n近期的模型利用深度神经网络来提高泛化能力和预测准确性。例如，`ToxinPred`\
  \ 的扩展版本现在整合了深度学习框架，能够从肽序列中自动提取分层特征，提供更稳健的毒性评估 [97。其他方法如 `ToxDL` 利用 `CNNs` 对与毒性相关的局部残基水平模式进行建模，能够检测传统模型可能会忽略的细微序列基序\
  \ [98。\n\n混合架构在毒性预测任务中也表现出强大的性能。如 `ToxIBTL` 等模型将 `CNNs` 与 `BiLSTM` 网络结合，捕捉肽序列内部的空间和序列依赖关系\
  \ [99。此外，蛋白质语言模型（如 `CSM-Toxin`）的整合标志着重大进展，它通过大规模无监督预训练生成上下文嵌入，然后针对毒性预测进行微调 [100。\n\
  \n更晚期，将结构信息引入毒性模型中，为提高预测准确性开辟了新途径。`ToxGIN` 等工具利用图同构网络 (`GINs`) 同时整合了序列和结构数据，使模型能够捕捉分子水平复杂的拓扑和物理化学相互作用\
  \ [101。这种序列-结构的融合代表了开发更具生物学启发性和解释性的毒性预测器的一个很有前景的方向。\n\n### 7.6.3.2 免疫原性识别\n\n肽免疫原性的预测——治疗性肽设计中的关键步骤——随着机器学习和深度学习技术的整合取得了巨大进展。`POPI`\
  \ 是首个专门为预测免疫原性肽开发的计算模型。它利用在氨基酸物理化学性质上训练的 `SVMs` 来区分能够引发免疫反应的肽和不能引发的肽 [102。在此基础之上，`PAAQD`\
  \ 通过引入氨基酸成对接触参数和量子拓扑分子相似性描述符，引入了更精细的特征空间，使模型能够更好地捕捉与免疫原性相关的结构和空间特征 [103。\n\n随后的模型采用了集成学习和先进的神经网络架构来增强预测性能。例如，`INeo-Epp`\
  \ 采用了 `Random Forest` 分类器，并在预测 T 细胞表位免疫原性方面显示了准确率的提高，这得益于特征的多样性和集成稳健性 [104。同时，`DeepHLApan`\
  \ 等深度学习方法整合了 `RNNs` 对肽-MHC 结合亲和力和免疫原潜力进行建模，有效捕捉了氨基酸链中的序列依赖关系 [105。\n\n其他模型如 `DeepImmuno`\
  \ 利用 `CNNs` 学习与免疫原性相关的局部残基模式，为表位识别和新抗原预测提供了一种强大的方法 [106。最近，迁移学习策略的引入进一步推进了该领域的发展。例如，`TLImmuno2`\
  \ 将蛋白质语言模型的预训练嵌入与下游分类器相结合，以提高学习效率和预测性能，特别是在数据稀缺的的情况下 [107。\n\n### 7.6.3.3 溶血评估\n\
  \n溶血活性的预测——肽类药物中的一个关键安全问题——一直是多个旨在识别具有潜在溶血效应肽的计算模型的焦点。早期工具如 `HemoPI`、`HemoPred`\
  \ 和 `HemoNet` 为*计算机模拟 (in silico)* 溶血性评估奠定了基础。这些模型主要依赖序列衍生特征、物理化学描述符和结构属性，根据其引起红细胞裂解的可能性对肽进行分类\
  \ [108–110](#c07.xhtml#c07-bib-0110)]。此类工具在药物发现早期过滤溶血肽方面发挥了重要作用，在实验验证之前改进了安全性特征。\n\
  \n在这些基础之上，更近期的方法引入了先进的学习范式，以进一步提高预测准确性和模型可解释性。量子机器学习 (`QML`) 已成为识别非溶血肽的新颖策略，利用量子计算原理来捕捉传统模型可能会忽略的复杂序列关系\
  \ [111。此外，迁移学习已被用于增强 `AMPs` 背景下的溶血毒性预测。例如，`AMPDeep` 等模型使用预训练表示和领域特定微调来更准确地区分溶血和非溶血变体，即使在训练数据有限的情况下也是如此\
  \ [112。\n\n一个特别有前景的进展涉及 `QML` 与蛋白质语言模型的结合，能够同时预测二分类溶血活性和如 `HC50`（溶血效力的定量测量）等连续毒性指标。这些整合方法不仅提高了毒性评估的精度，还通过提供溶血风险评估的分类和回归输出，支持更安全的治疗性肽的设计\
  \ [113。\n\n### 7.6.3.4 其他毒性副作用预测\n\n……处理与治疗性肽相关的其他生物学相关副作用。这些包括神经毒性、过敏性和自身免疫反应，每一种在肽类药物开发中都面临独特的挑战。\n\
  \n深度学习技术近期被应用于预测神经毒相关的副作用，特别是在肽毒素（如芋毒）的背景下。这些神经毒肽通常源自海洋生物，会干扰神经信号和离子通道功能。在芋毒数据集上训练的新兴模型使用深度神经网络架构对神经毒肽进行分类并评估其潜在的神经风险，为针对神经系统的治疗性肽提供更安全的设计\
  \ [114。\n\n\n\n\n\n过敏性预测也引起了广泛关注，特别是其与多肽疫苗、食品源多肽和生物药物具有高度相关性。`AllerTOP v.2` 和 `AllerCatPro\
  \ 2.0` 等工具利用 `ML` 来分析氨基酸序列和物理化学性质，能够识别出具有高过敏潜力的多肽 [115, 116]。这些模型已通过筛选的过敏原数据库验证，并为多肽设计中的过敏原筛选提供了友好的平台。\n\
  \n此外，针对特定肽表位（如与麸质不耐受相关的表位）的自身免疫反应预测也促进了更专业模型的开发。在乳糜病背景下，`CDpred` 和 `CICERON` 等工具可以预测在遗传易感人群中触发免疫反应的\
  \ T 细胞表位。这些模型分析与 `HLA-DQ2/DQ8` 结合和免疫激活相关的序列基序，有助于在治疗或营养应用中识别并排除免疫病原性肽 [117, 118]。\n\
  \n### 7.6.4 数据驱动的药理特性建模策略\n\n多肽性质（如半衰期、稳定性和药理活性）的计算预测变得越来越重要，因为它直接影响治疗效果和安全性特征 [49]。准确的*in\
  \ silico*（计算机）模型允许研究人员在实验验证之前评估并优化候选肽，从而在药物开发过程中节省时间和资源。\n\n已开发了多种计算方法来估计多肽半衰期，每种方法利用了不同类型的输入数据和建模策略。例如，`ProtParam`\
  \ 根据`N 端规则`预测多肽半衰期，该规则将多肽的稳定性与其`N 端氨基酸残基`相关联 [119]。其他模型利用多元回归框架，将额外的序列特征和生物化学性质整合到半衰期预测算法中\
  \ [120]。\n\n某些工具是为特定的多肽类设计的。例如，`PyAMPA` 侧重于使用适用于其结构特征的定制描述符和建模策略来预测`AMPs`的半衰期 [121]。其他模型考虑了特定的生理条件；例如`HLP`使用`SVMs`预测消化道类环境中的多肽半衰期，反映了口服多肽递送的挑战\
  \ [122]。\n\n如 `PepMSND` 等高级模型整合了多种特征——包括分子描述符、物理化学性质、`SMILES strings` 和 3D 结构数据——以提高血液稳定性的预测\
  \ [123]。同样，`Plifepred` 结合了`SVMs`、`线性回归`和`高斯过程模型`，利用分子描述符和二值残基谱预测天然肽和化学修饰多肽的半衰期 [54]。更全面的工具如\
  \ `PepAnalyzer` 超越了半衰期估计，通过预测多种肽属性（包括*in vitro*（体外）稳定性、净电荷和等电点），为早期多肽表征提供了一个多功能平台\
  \ [124]。\n\n与此同时，药理特性的预测也取得了巨大进展，特别是关于多肽的效力和毒性。`AVP-IC50Pred` 估计`AVPs`的`IC[50]`值，相关系数高达\
  \ 0.74 [125]。`Nath's meta-classifier`采用基于堆叠的集成方法来预测`IC[50]`和`pIC[50]`值，提高了准确性 [126]。对于针对`Flaviviridae`家族的`AVPs`，蛋白质化学计量建模（`PCM`）方法在`pIC[50]`预测中实现了\
  \ 0.85 的相关系数，凸显了整合化学和生物描述符的效用 [127]。\n\n在抗菌领域，`CNNs`被用于同时分类和回归以估计最小抑制浓度（`MIC`），提供了对效力和活性谱的见解。最后，如`xDeep-AcPEP`等工具整合了结构和组成特征来预测`ACPs`的广泛药理终点——包括`EC[50]`、`LC[50]`、`IC[50]`和`LD[50]`——在单一框架内支持效力和毒性的双评估\
  \ [129]。\n\n### 7.6.5 治疗肽的*de novo*（从头）设计\n\n生成式模型是一类`ML`算法，它们通过学习建模数据的底层分布来生成具有相似特征的新型、未见过的样本。在治疗肽的背景下，生成式模型可以提出具有优化生物活性、降低毒性、增强稳定性或靶特异性的新型序列，从而加速理性多肽设计\
  \ [5]。\n\n多种类型的生成架构已应用于多肽发现，包括`VAEs`、`GANs`、`基于 transformer 语言模型`以及最近的`diffusion\
  \ 模型`。每种策略在捕捉多肽表示和引导生成过程方面具有独特优势。\n\n这些模型不仅在架构上不同，提供的控制类型也不同。例如，`VAEs`非常适用于遍历连续潜空间并实现条件生成，`GANs`擅长通过对抗学习产生真实的序列，`transformers`提供基于全局序列依赖的环境感知生成，而`diffusion\
  \ models`提供了一个在整合生物约束的同时生成肽的强大框架。\n\n在下一节中，我们将专门关注`ML`策略在治疗肽*de novo*设计中的应用，详细介绍支撑这些下一代生成框架的算法、架构和设计原则。\n\
  \n#### 7.6.5.1 基于变分自编码器的方法\n\n`VAEs`是概率生成模型，它们将输入数据编码到潜空间，然后进行解码以重构或生成新样本。它们在学习多肽序列的平滑连续表示方面特别有效，可以通过对这些表示进行操作来产生所需属性的新变体。\n\
  \n多肽发现已开发了多种基于`VAE`的策略。对于`AMPs`，如`PepVAE` [130]、`PepCVAE` [131]和`GM-Pep` [132]模型在生成活性肽序列方面显示出巨大潜力。133\
  \ 提出了一种用于氨设计的深度自编码器模型，在生成和实验验证 48 天内实现了 10%的命中率。\n\n该领域的显著进展是`HydrAMP`，这是一种条件变分自编码器（`cVAE`），它学习肽空间的连续潜表示，能够实现引导和可控的序列生成。这种方法导致了`Hydraganan-1`的产生，这是一种源自母肽`Pexiganan`的新型且高活性的`AMP`，已证实对大肠杆菌菌株具有性\
  \ [134]。\n\n\n\n\n\n除了 AMPs 之外，基于 VAE 的模型已用于生成特异性抑制剂 135、具有膜通透性和生物活性优化的肽 136、β-catenin\
  \ 抑制剂 137 以及具有高亲和力 MHC 结合潜能的肽 138。\n\n#### 7.6.5.2 生成对抗网络\n\nGANs 是另一种被广泛使用的生成式架构。它们由两个神经网络组成——生成器和判别器——并在竞争中进行训练。由于\
  \ GANs 能够对复杂的高维分布进行建模，在生成具有生物学意义的序列方面特别有用。\n\n基于 GAN 的最著名的肽设计工具之一是 `GANDALF`（生成对抗网络药物-靶点配体优化），这是一种深度卷积\
  \ GAN，它结合了药物-靶点相互作用数据、来自 `PDB` 的 3D 蛋白质结构以及来自 `CASTp` 的蛋白质口袋信息。`GANDALF` 并不依赖蛋白质-蛋白质相互作用数据集，而是基于\
  \ `THP` 数据库中 FDA 批准的肽进行训练，并已用于生成针对 `PD-1`、`PDL-1` 和 `CTLA-4` 等相关蛋白的肽 [50, 139](#c07.xhtml#c07-bib-0139)–141。\n\
  \n另一种基于 GAN 的方法 `PandoraGAN` 专注于生成生物活性 AVPs。它使用了 `LeakGAN`（一种最初为文本生成的改进型 GAN 架构）来产生序列，然后使用净电荷、不稳定指数和基序模式等物理化学过滤器对其进行验证\
  \ 142。\n\n其他显著的 GAN 实现包括 `AMPGAN v2` 143，它支持 AMP 序列的受控生成；用于 AVP 设计的 `AI4AVP` 74，以及专注于生成通常与膜活性相关的螺旋构象肽的\
  \ `HelixGAN` 144。\n\n## 7.6.5.3 基于 Transformer 的语言模型受自然语言处理（NLP）进展的启发，基于 Transformer\
  \ 的语言模型也被应用于肽生成。这些模型将肽视为标记（氨基酸）的序列，并学习保留结构和功能基序的上下文表示。\n\n`AMPTrans-LSTM` 是一种混合语言模型，它结合了长短期记忆采样器和基于\
  \ Transformer 的转换器来生成 AMPs。这种双重架构能够在增强生成创造力的同时保留关键的 AMP 特性。该模型报告生成活性肽的成功率在 30% 到\
  \ 50% 之间 145。\n\n#### 7.6.5.4 扩散模型\n\n扩散模型已成为传统架构的强大替代方案，特别是在分子设计方面。这些模型通过迭代对随机噪声进行去噪，以生成与训练分布相似的样本。\n\
  \n在肽设计中，基于扩散的方法（如 `AMP-Diffusion`将潜在扩散与语言嵌入相结合，允许高质量的生成 146。Watson 等人 147 证明了扩散框架可以促进结构预测。其他创新方法包括包含\
  \ 3D 约束的 `Geometric Latent Diffusion` 148，以及将生成与功能模态对齐的多模态对比扩散 149。\n\n## 7.7 通过多智能体系统进行新代肽设计\n\
  \n在过去几年中，在数据驱动方法和机器学习（ML）的推动下，肽设计经历了巨大的转型，这些方法已成为基础工具 150。该领域的里程碑成就是 `AlphaFold`，这是一个彻底改变蛋白质结构的深度学习模型\
  \ 151。\n\n尽管取得了这些进展，仍然面临许多挑战和开放的问题，特别是关于如何使用大语言模型（LLMs）开发智能体。一个很有前景的解决方案是实现由 LLMs\
  \ 驱动的多智能体系统 152。\n\n目前，还没有单一的、普遍接受的智能体（agent）定义。然而，一些作者将智能体描述为能够感知环境、做出决策并对外部刺激做出反应的系统\
  \ 153。其他人将其定义为持续环境输入并执行操作的自主系统 154。\n\n自主智能体模型是科学研究的一个新兴课题，并在多个领域都有了应用 155。最初，它们的开发集中在文献阅读和文章分析等方面。示例包括\
  \ `PaperQA`，一种从数据库中检索文章、分析内容并回答相关问题的智能体 156；以及 `WikiCrow`，它是 PaperQA 的扩展，还额外生成科学出版物的摘要\
  \ 157。\n\n与此同时，开发了新的智能体来帮助研究人员进行实验设计和数据分析。这些包括科学语言模型 (`CALMS`) 158、`BioPlanner`\
  \ 159、`CRISPR-GPT` 160、`LLM-RDF` 161，以及 `Organa`，它可以根据实验结果为研究人员提供反馈并生成综合报告 162。\n\
  \n从化学角度来看，开发了专门的模型如 `Chemist-X`、`ChemCrow`、`AtomAgents` 和 `LIDDIA`，作为虚拟助手协助完成有机合成、药物发现、材料设计和反应规划等各种任务\
  \ [163–166。\n\n虽然自主智能体在肽和蛋白质设计中的应用仍然较少，但 `ProtAgent` 的开发代表了巨大的进步。`ProtAgent` 是一个多智能体系统，能够处理广泛的蛋白质设计任务——从序列检索功能分析到从头开始生成蛋白质。其结构化工作流由多个专门智能体组成：`Planner`\
  \ 为每个任务制定策略；`Assistant` 使用各种计算工具执行这些计划；`Critic` 监控性能、提供反馈并优化输出；而 `Chat Manager`\
  \ 则协调整个系统的通信和任务同步 153。\n\n\n\n\n\n展望未来，如 `ProtAgent` 等多代理系统的实现具有潜力，通过减少人工干预并加速发现过程，为蛋白质设计带来革命性。这种方法可以显著促进具有用于生物医学、生物技术和药物学应用的定制属性肽和蛋白质的生成。\n\
  \n## 7.8 开发自主治疗性肽设计的 AI Agent\n\n治疗性肽的发现是一项多方面的挑战，需要整合生物、化学和计算知识。为了简化并加速这一复杂过程，我们提出了一种模块化且自适应的基于代理的方法，旨在管理整个肽设计流水线——从用户定义的提示词到*计算机模拟*验证和实验精炼（参见图\
  \ 7.3）。该系统利用基于 transformer 的深度学习模型进行序列生成和预测评估，同时利用强化学习作为一种机制，根据实验反馈优化整个设计过程。\n\n\
  工作流始于用户输入一个结构化或自然语言提示词，定义目标肽的预期特征。例如，提示词可能指定针对如 `GP41` 等蛋白靶点的抗病毒活性、半衰期在三到五小时之间，以及缺乏抗菌活性或已知的毒性影响（如免疫原性或溶血）。该提示词由解释代理处理，将其翻译一组正式的计算目标和约束。这一步确保了所有下游过程——生成、评估和验证——都由清晰、可量化的设计目标驱动。\n\
  \n接下来，生成代理调用一个在大规模肽或蛋白质数据集上预训练的基于 transformer 模型来产生新序列。根据可用的领域特定数据，该模型可能会经过微调或通过输入提示词进行条件处理以增加特异性。生成的肽旨在表现出高度的内部多样性，最大限度地减少冗余，并增加识别功能新候选的概率。\n\
  \n候选肽随后由一组预测代理进行评估，这些代理监督着两类关键模型：分类器和回归器。分类代理评估抗病毒、抗抗菌和抗真菌等离散属性，以及溶血性、过敏原性和免疫原性等安全相关的属性。这些模型主要基于\
  \ transformer，受益于在高质量、精选的数据集上的迁移学习和微调。同时，回归代理使用深度学习模型预测定量药代动力学参数，如半衰期、`IC[50]` 和\
  \ `pIC[50]`。这些预测代理共同对每个肽提供综合评估，结果根据对初始设计标准的整体符合程度汇总成排名列表。\n\n符合评估阈值的肽被传递给验证代理，该代理使用一系列生物信息学工具进行*计算机模拟*分析。这包括用于估计结合亲和力的分子对接、用于评估构象稳定性的结构建模，以及评估溶解度、电荷和其他基本特征的物理化学特性分析。这些验证的整合有助于确保只有生物学上可行且计算上有前景的候选者被选中用于实验测试。\n\
  \n![图 7.3 用于治疗性肽设计和发现的代理框架。系统接收用户定义的提示词，指定预期的生物和药理属性。由代理控制的生成模型产生多样化的肽序列，由分类模型对活性（例如抗病毒）、安全性（例如非溶血、非免疫原性）和特异性进行评估。额外的代理监督预测药代动力学属性（如半衰期和结合亲和力）的回归模型。候选序列使用生物信息学工具进行计算机模拟验证。在整个过程中，代理协调实现了任务分配和信息流。强化学习机制整合实验反馈，迭代改进系统性能，并引导未来代产生的候选者达到最优。](img/c07f003.png)\n\
  \n图 7.3 用于治疗性肽设计和发现的代理框架。系统接收用户定义的提示词，指定预期的生物和药理属性。由代理控制的生成模型产生多样化的肽序列，由分类模型对活性（例如抗病毒）、安全性（例如非溶血、非免疫原性）和特异性进行评估。额外的代理监督预测药代动力学属性（如半衰期和结合亲和力）的回归模型。候选序列使用生物信息学工具进行*计算机模拟*验证。在整个过程中，代理协调实现了任务分配和信息流。强化学习机制整合实验反馈，迭代改进系统性能，并引导未来代产生的候选者达到最优。\n\
  \n\n\n\n治疗性肽的研究与应用经历了快速发展，这得益于其生物化学的多功能性、高特异性以及广泛的治疗相关性。从在自然生物系统中的基础作用到针对生物医学用途的定制化合成，肽在从诊断、生物感应到抗菌和抗肿瘤治疗等多个领域展现了卓越的效用。然而，它们固有的局限性——如稳定性低、易酶降解和递送挑战——继续为临床转化带来重重障碍。为了解决这些局限性，最近的研究已转向计算方法，包括人工智能和`ML`的使用，这些方法为以更高的效率和精密度理性化地设计、优化和预测肽功能提供了极具前景的途径。\n\
  \n`ML`技术的整合标志着肽类科学的范式转移。通过利用策划的数据集、数值表示和先进的学习算法，研究人员现在可以构建高精度的分类和回归模型，以预测生物活性、毒性特征和药代动力学性质。预训练的蛋白质语言模型和深度学习架构在捕捉控制肽行为的微妙序列-功能关系方面被证明特别有效。此外，生成式学习的使用使得肽化学空间完全全新的区域成为可能，允许对具有理想且定制属性的序列进行`de\
  \ novo`（从头）设计。\n\n展望未来，基于智能体的系统的实施预计通过实现自主肽发现流水线进一步转型该领域。这些多智能体系统由负责生成、分类、验证和反馈整合的专用模块组成，允许灵活且可扩展的设计工作流。通过共享的通信协议和强化学习来协调预测模型和生成式模型，这些平台最大限度地减少了对人工干预的需求，同时从实验反馈中不断学习。此类框架特别适用于解决治疗性肽开发的复杂性，因为它们可以快速响应新的设计限制，并整合异构的生物学知识源。\n\
  \n治疗性肽研究正处于分子生物学、计算科学和人工智能的交叉点。在可获取的数据库和实验反馈循环的支持下，`ML`-驱动的方法论的整合不仅在加速发现，还在扩展肽的功能和治疗蓝图。正如本章概述的那样，数据驱动和自主系统的采用对于下一代肽工程具有极其广阔的前景。这些方法可能在个性化和精准治疗法的发展中发挥核心作用，最终改变基于肽的药物被发现、优化和进入临床的方式。\n\
