  \n\n\n\n其中 `λθ_k` 是正则化项的权重，用于惩罚随时间变化的参数 `k` 的剧烈偏离，而 `θ[k] (t[θ])` 是名参数 `k` 从时间 `t[θ]`\
  \ 到 `t[θ] + Δt[θ]` 随时间变化的参数。我们建议每个时变参数的离散化步长 `Δt[θ]` 不小于连续测量之间的时间差，以尽量减少过拟合。增加 `λθ_k`\
  \ 的值会增强对时变参数偏离的惩罚，从而减少对噪声数据的过拟合。然而，这将降低拟合准确性，因为 Eq. 14.5a 中数据拟合项的优先级会降低。\n\n一旦确定了时变参数曲线，状态变量的模拟准确性应该有所提高。因此，可以将时变参数曲线分配给相应的状态变量和必要的操作条件，用于机器学习组件的训练，这部分将在\
  \ Section 14.2.3 中讨论。\n\n### 14.2.3 机器学习模型构建\n\n无论选择哪种机器学习组件，总训练目标都是相同的：生成一个数据驱动模型，以状态变量和关键过程操作条件为输入，预测对应的时变参数值作为输出。对于简单的批处理示例，我们在求解框架\
  \ 5 时，在每个时间点 `t` 有多个输入 `CX`、`CS` 和 `C[P] (t)`，以及多个输出 `θμd`、`θ_KS(t)` 和 `θqP`。然后，这些输入和输出可以以不直接依赖于时间的\
  \ MIMO 机器学习模型的形式相关联。为了训练机器学习组件，需要一个损失函数，用于最小化数据驱动模型预测的时变参数与 Section 14.2.2 估计的时变参数之间的差异。损失函数的一般形式所示\
  \ Eq. 14.6：\n\n```\n(14.6) min_{w,b} (1/n) Σ_k Σ_t |θ_k(C(t_θ), u(t_θ), w, b) -\
  \ θ_k(t_θ)|\n```\n该表示表示平均绝对误差（MAE）函数（通常称为 L1），其中 `u(t)` 代表 `t` 处的调整，`w` 和 `b` 是权重，`C`\
  \ 是状态变量 `[X], [S], [P]` 的向量，`n` 是用于训练的数据点数量。另一种方法是使用均方误差（MSE）函数（通常称为 L2），如公式 14.7\
  \ 所示：\n\n```\n(14.7) min_{w,b} (1/n) Σ_k Σ_t [θ_k(C(t_θ), u(t_θ), w, b) - θ_k(t_θ)]²\n\
  ```\n\n一旦机器学习组件的训练完成，具有固定权重 `w` 和偏置 `b` 的最终混合模型形式所示 Eqs. 14.8a–14.8c。\n\n\n\n\n\
