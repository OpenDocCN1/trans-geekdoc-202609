  \n# 前言\n\n生物技术一直围绕着大型数据集的收集展开。“组组学”时代的进步无疑增加了这些数据的数量和质量。现在，即使是一次实验也可以产生海量数据。同时，机器学习中新兴的方法正帮助这些数据集提供上下文信息，并为使生物工程成为一门预测性的、数据驱动的科学提供了道路。本书重点介绍了机器学习在数据驱动的生物技术应用中的重大进展。本书大致按照以下主题组织：(1)\
  \ 直接从 DNA 序列水平理解功能；(2) 理解蛋白质功能、结构以及在代谢途径中的排列；(3) 理解全细胞性能和“组学”数据；以及(4) 理解生物工厂和生物反应器。这些章节代表了机器学习与大数据结合的当前最高水平。\n\
  \n# 1 从基因组到生物技术中的可操作见解\n\nJames Morrissey, Benjamin Strain 和 Cleo Kontoravdi\n伦敦帝国学院，化学工程系，London,\
  \ SW7 2AZ, UK\n\n## 1.1 引言\n\n系统生物学促进了对生物过程的`[1, 2]`。它为高通量数据的上下文化和理解提供了一个框架，允许获得结构化且有意义的见解。随着高通量组学数据的不断产生以及机器学习（ML）数据分析工具的使用，开发稳健的系统生物学工具变得越来越重要。\n\
  \n系统生物学家的工具中关键工具之一是网络。生物学中的网络代表了基因、蛋白质、反应和代谢物等成分之间的流动和相互作用，其中网络节点对应这些生物实体，边定义它们的相互作用，例如生化转换、调节和物理结合\
  \ [3]。网络改进了对复杂现象的解释和理解，但最重要的是，在大数据背景下，它们提供了结构。这种结构有助于将高度复杂的数据从“黑箱”转变为具有预测和可解释能力的多尺度模型。网络允许在大数据处理方法中理解底层的生物机制。这种结构框架在生物技术中尤为宝，因为那里基因组学、转录组学、蛋白质组学和代谢组学等数据集必须仔细整合和分析。即使它们在规模（包括网络大小和连接性）上比图像识别或自然语言处理等领域的要小，但其生物复杂性需要同样甚至更多的解释关注\
  \ [4, 5]。\n\n通过利用生物网络提供的结构，研究人员可以产生帮助解释细胞系统在各种条件下运行的预测。这些预测（如通量分布、调节响应或生长结果）为底层生物提供了机械见解\
  \ [6]。有了这种理解，就可以设计针对性的干预，例如修改基因表达、调整营养供给或工程代谢途径。关键在于，这些干预通常会导致良好的结果，包括提高生物技术应用中的生产力、稳健性效率。因此，网络不仅是解释工具，而且是实际的、数据支持的决策的平台。\n\
  \n\n\n\n\n应用最广泛的生物网络类型是代谢网络 [[7\\]](#c01.xhtml#c01-bib-0007)。这些网络描述了代谢物通过细胞系统内部生化反应的流动（或通量）。根据应用的不同，代谢网络的范围可以从较小的、特定途径的子系统到旨在代表整个生物代谢能力的基因组规模重构\
  \ [\\[8\\]](#c01.xhtml#c01-bib-0008)。这些大规模重建被称为基因组规模代谢模型（GEMs）。GEMs 提供了一个计算框架，通过预测定义条件下的胞内通量来探测代谢。通过将实验数据整合到代谢网络中，GEMs\
  \ 能够模拟细胞行为，指导生物技术中的假设生成、菌株工程和工艺优化 \\[9, 10\\]。GEMs 还充当整合其他生物网络的核心骨架，实现了多组学数据的整合，并支持全面的、数据驱动的方法\
  \ \\\\11, 12\\]。\n\n在本章中，我们探索了如何从基因组数据构建生物网络（特别是代谢网络）、对其验证和完善、将其转换为预测模型，并最终用于在生物技术产生可操作的见解。我们强调了高通量组学和机器学习工具如何用于增强解释性、约束解空间并提高预测能力以实现生物技术应用。\n\
  \n## 1.2 从基因组到网络\n\n基因组数据为所有细胞过程提供了基础蓝图。然而，为了提取可操作的见解，这些静态信息必须转化为生物功能的动态表示。网络提供了一种实现这一点的强大方法，将基因与其代谢、调节、信号和分子相互作用中的作用连接起来\
  \ [\\[7\\]](#c01.xhtml#c01-bib-0007)。\n\n从基因序列中可以重建多种生物网络，例如描述生化反应的代谢网络、捕捉转录控制的基因调节网络（GRNs）、映射细胞通信的信号网络，以及揭示蛋白组内物理相互作用的蛋白质-蛋白质相互作用（PPI）网络\
  \ [\\[3\\]](#c01.xhtml#c01-bib-0003)。这些网络中的每一个都提供了不同层次的，它们共同构成了细胞全面的系统级视图。\n\n本节概述了如何从基因组数据构建这些网络，重点关注代谢网络，既可以使用从基因注释和已知生物功能开始的“自下而上”方法，也可以使用整合组学数据以完善或使现有网络结构背景化的“自上而下”方法。这些重构是构建能够解释数据、生成预测和指导生物技术干预的模型的基础。第\
  \ 2 章 提供了关于如何使用计算算法和人工方法从基因组信息中构建网络模型的详细信息。\n\n### 1.2.1 代谢网络\n\n在从基因组数据中重建的各种生物网络中，代谢网络的应用最广泛。代谢网络代表了连接细胞系统中代谢物、基因、酶和反应的生化反应\
  \ [\\[13\\]](#c01.xhtml#c01-bib-0013)。由于 GEMs 的可用性，这可以是基因组规模的 [\\[14\\]](#c01.xhtml#c01-bib-0014)。\n\
  \n#### 1.2.1.1 自下而上的网络重建方法\n\n自下而上的方法是一种耗时且人工的方法。在本节中，我们总结了如`图 1.1`（c01.xhtml#fig001）所示的关键步骤。为了创建一个草图网络，可以使用基因本体（GO）\
  \ [\\[16\\]](#c01.xhtml#c01-bib-0016)、酶委员会（EC）编号 [\\[17\\]](#c01.xhtml#c01-bib-0017)\
  \ 以及生化数据库，如京都基因与基因组百科全（KEGG） [\\[18\\]](#c01.xhtml#c01-bib-0018) 和布伦斯威克酶数据库（BRENDA）\
  \ [\\[19\\]](#c01.xhtml#c01-bib-0019)。第 4 章 和 第 5 章 讨论了如何使用这些方法提取蛋白质功能。\n\n####\
  \ 1.2.1.2 自上而下的网络重建方法\n\n\n\n\n\n与从零开始构建草图网络相比，GEM 重建的自上向下方法依赖于现有网络、知识和组学数据来推断代谢网络。GEM\
  \ 重建的自上向下方法通常比自下而上的方法更快且更自动化，适用于生成草图模型，特别是在可用高通量数据的情况下。这些方法从现有的基因组注释开始，依赖于自动化流程，将注释的基因映射到经过策划的代谢数据库中的已知反应，如\
  \ `KEGG`、`MetaCyc` [21] 或 `ModelSEED` [22]。可以使用 `CarveMe` [23] 或 `Pathway Tools`\
  \ [24] 等工具快速生成自动化草图。\n\n自上向下方法还可以通过将组学数据整合到现有的通用 GEM 中来构建特定特异性模型 [25, 26]。诸如 `GIMME`\
  \ [27]、`iMAT` [28] 和 `CORDA` [29] 等算法根据表达阈值或活动概率过滤并调整反应内容，产生针对特定组织、条件或表型的定制模型。\n\
  \n### 1.2.2 代谢之外的网络\n\nGEM 重建侧重于代谢功能，但系统生物学涵盖了更广泛的网络重建，以捕捉细胞功能的其他方面。这些包括基因调节、信号传导、蛋白质相互作用以及转录-翻译网络，每种网络都为细胞行为提供互补的见解\
  \ [3]。\n\n这些网络类型可以整合到多层模型中，如第 1.5.4 节所示，以提高预测性并捕捉细胞复杂性。虽然 GEM 已经建立，但基因调节网络（GRNs）、信号传导和转录-翻译模型的持续开发对于构建更全面的全细胞模型至关重要。\n\
  \nGRNs 描述了转录因子 (TFs)、调节元件与其目标基因之间的相互作用 [30, 31]。它们通常从基因表达数据通过统计方法推断（例如互信息、贝叶斯推断），或从文献中整理。矩阵形式已用于描述此类系统的功能状态，为分析调节动力学提供了结构化的方法。一个关键例子是大肠杆菌（*Escherichia\
  \ coli*）转录调控系统的基因组规模重建，它能够模拟对环境变化的转录响应 [32]。\n\n信号网络绘制了细胞外信号如何通过分子相互作用级联导致细胞反应的图谱。这些可以从策划的通路数据库中构建，或从蛋白质组学数据衍生，但不如其他网络那样常见\
  \ [33]。PPI 网络代表细胞内蛋白质之间的物理相互作用 [34]。与代谢或调节网络不同，这些网络通常是无向的，不反映化学计量比或方向性，而是捕捉蛋白质组的结构和功能连接。PPI\
  \ 对于几乎所有的细胞过程都至关重要，包括酶复合物、信号级联、结构组装和运输机制。\n\n为了模拟基因表达除调节之外的影响，人员已经开发了转录和翻译机器的基因组规模重建。例如，代谢与表达的多尺度模型（ME\
  \ 模型）将代谢与大分子表达系统整合，考虑了 RNA 聚合酶、核糖体和酶的合成 [35, 36]。这些 ME 模型提供了一个模拟细胞资源如何在生长和基因表达之间分配的平台，并在第\
  \ 1.5.4 节 中进一步讨论。\n\n## 1.3 从草图到功能网络\n\n为了将草图网络转换为功能模型，必须进行若干项细化。这包括添加额外的反应，例如生物量和自发反应。此外，必须实施一些基础的网络验证检查以验证其完整性。这些将在下节中详细说明。\n\
  \n### 1.3.1 额外反应\n\n#### 1.3.1.1 交换反应\n\n交换反应代表细胞与其细胞环境之间代谢产物的转移。交换反应包括糖、氨基酸、水、氨以及许多潜在的被摄取或分泌化合物。\n\
  \n```\nEXC\n```\n\n交换反应的格式使得负通量代表从细胞外摄取，正通量代表分泌。仅分泌的代谢物被建模为不可逆反应以防止负通量。\n\n####\
  \ 1.3.1.2 需求反应\n\n需求反应是添加的额外汇，用于建模没有分泌的终点产物。这可以代表细胞正常功能所需的产物、目标产品（例如抗体）或用于替代未知特定生物合成途径的通用需求反应。细胞质中代谢产物\
  \ 的 的反应的形式如下：\n\n```\nMA = d\n```\n\n#### 1.3.1.3 运输反应\n\nGEM 还包含代谢产物的位置信息，允许包含区间的运输反应。例如，`A[c]`\
  \ 指细胞质（c）中的代谢产物 `A`，`A[e]` 指细胞外空间（e）中的代谢产物 `A`。其他建模的位置包括线粒体的 `[m]`、过氧化物体的 `[x]`、内质网的\
  \ `[r]` 和高尔基体的 `[g]`。因此，运输反应的形式如下：\n\n```\nA[e] <-> A[c]\n```\n\n#### 1.3.1.4 自发反应\n\
  \n\n\n\n\n自发反应是在无需酶催化的情况下发生的反应，因此它们与特定的基因没有关联；因此，在初始重建阶段，它们不会被添加到网络中。它们允许某些转化在没有已知酶负责的情况下进行，从而确保了网络的完整性。自发反应通常是不可逆的，并且当它们至少有一个代谢产物与重构的其他部分连接时，应当将其添加，以避免自发反应导致过多的末端代谢产物。例如，二羟丙酮磷酸（DHAP）和甘醛-3-磷酸（G3P）自发降解形成甲基丙醛\
  \ 37，以及金属催化的反应，如芬顿化学化学（`H[2]O[2]` 和 `Fe^(2+)` 反应产生羟基自由基）38。\n\n### 1.3.1.5 非生长相关\
  \ ATP 维持\n\n非生长相关 ATP 维持（NGAM）反应代表了细胞维持与生物量产生无关的基本功能所需的能量，例如离子转运、大分子的周转以及膜电位的维持。该反应的通量设置了一个固定的下限，以根据实验估计反映细胞存活所需的最小\
  \ ATP 需求，例如 `E. coli` 和中国卵巢（CHO）细胞的分别为 7.6 和 5.9 mmol g^(−1) hr^(−1) 39, 40。该反应通常建模如下：\n\
  \n```\nH2O + ATP -> ADP + P\n```\n\n注意，生长相关维持（GAM）考虑了复制细胞所需的能量，例如大分子的合成（如蛋白质和 RNA），它包含在生物量反应中。\n\
  \n### 1.3.1.6 生物量反应\n\n基因组尺度模型（GEMs）的一个基本组件是添加特定的生物量反应 41。通过测量细胞的组成（氨基酸、脂质、碳水化合物），并将其组成分以形式的形式作为该生物量反应的输入。通过该反应的通量被用作细胞生长速率的近似；因此，生物量输入的摩尔组成和为克干细胞重（gDCW）。该反应的最终单位为\
  \ h，允许与实验测量的生长速率进行比较。\n\n```\nsum(S_i * X_i) = 1\n```\n\n其中 `X[i]` 是生物量前驱体（例如氨基酸、脂质、碳水化合物），`S[i,biomass]`\
  \ 是前驱体 `i` 的化学计量系数。生物量反应还需要一定量的 ATP，并产生 ADP、氢离子和磷酸。\n\n### 1.3.2 网络验证\n\n模型结构的验证是确保\
  \ GEM 准确表征其旨在捕捉的生物系统的关键步骤。结构验证旨在检测错误，例如缺失的反应、错误的关联或化学计量不平衡，这些错误可能导致预测不准确。\n\n####\
  \ 1.3.2.1 人工筛选\n\n人工筛选涉及对模型中的每种反应进行细致的策划，以验证其准确性，确保反应的化学计量和 GPR 关联是正确的，并反映了生物已知的生物学特性。这一步尤为重要，因为用于构建\
  \ GEM 的计算算法可能会引入错误或做出假设，导致不准确或不完整的 GPR 关联。例如，对工业生物技术广泛使用的微生物——巨型芽孢杆（`Bacillus megaterium`）代谢网络的人工基因组规模重建就是一个典型案例，在自动化重建后应用的人工策划确保了对生物体代谢的准确反映和高水平预测准确性\
  \ 42。在此阶段修正错误可以防止不准确性在后续分析中传播，最终提高模型的预测能力和效用。\n\n#### 1.3.2.2 筛选末端反应和阻塞代谢产物\n\n\
  GEM 验证的一项关键步骤是识别和解决末端反应和阻塞代谢产物。末端反应是指那些缺乏底物或无法产生供后续反应利用的产物的反应。阻塞代谢产物是指网络中没有任何反应可以消耗或产生的化合物。这些问题通常由于模型构建不完整或不准确引起，并由于关键代谢途径无法运行而显著扭曲模型预测\
  \ 43。\n\n代谢网络中阻塞反应的集合是通过确定每个反应在给定条件下是否可以携带通量来识别的。这是通过在维持网络化学计量的同时最大化每个反应的通量来实现的。如果反应的最大通量为零，则被认为不可用或阻塞。尽管在网络的静态视图中看起来是正常的，但由于通路整合不完整或不一致，它们在实践中是不活跃的\
  \ 44。\n\n通量变异分析（FVA）是发现此类问题的强大技术。作为通量平衡分析（FBA）的扩展，FVA 检查在优化特定细胞目标时反应可以携带的通量范围 45。FVA\
  \ 对于识别那些由于通路连接中断或化学计量错误而在某些条件下阻塞不活跃的反应特别有用。\n\n另一种常用技术是 FastGapFill 46，它识别了必须添加的反应，以最小化对现有网络更改的方式恢复阻塞通路的功能。FastGapFill\
  \ 的运行假设是更改应尽可能少以保持模型的完整性，仅添加最可能在生物体中自然发生的反应。\n\n#### 1.3.2.3 无限循环\n\n\n\n\n无限循环是指可以无限承载通量而不会导致代谢产物净消耗或产的代谢循环（图\
  \ 1.2）。这些循环通常源于结构性错误，例如反应计量系数错误、缺失的热力学约束或反应连接不当。这些循环可能导致不合理的结果。例如，模型可能会预测出 ATP 产生途径中存在持续通量，而没有任何相应的底物消耗，这违反了基本的热力学定律\
  \ [\\[47\\]](#c01.xhtml#c01-bib-0047)。\n\n无限循环通常出现在基于线性规划的方法中，如 `FBA`，在其中反应针对特定目标（例如生物量产生或\
  \ ATP 产生）进行了优化。在缺乏适当约束的情况下，模型可能会无意中偏于这些循环。\n\n检测和消除无限循环对于确保模型的行为真实性至关重要。多种技术被用于识别和解决基因组模型中的无限循环。与死端反应类似，无限循环也可以通过分析不同环境下的通量变异性来检测。使用\
  \ `FVA`，可以识别出在不太可能或不现实的情景下带有通量的反应，这指向了无限循环的存在。在不同条件下通量范围异常宽泛的反应通常是这些错误循环的指示。\n\n\
  添加热力学约束是防止无限循环最有效的方法之一。热力学约束的 `FBA` (`tFBA`) [\\[48\\]](#c01.xhtml#c01-bib-0048)\
  \ 对不可逆反应施加了方向性约束，并确保吉布斯自由能不利的反应产生产生量。Loopless-COBRA（基于约束的重建与分析）是传统 `FBA` 的扩展，专门旨在消除通过徒劳循环或循环的通量\
  \ [\\[49\\]](#c01.xhtml#c01-bib-0049)。它引入了额外的约束，防止反应形成可以承载通量且不对目标函数（例如生物量产生）做出贡献的内部循环。最后，手动识别高活性反应和途径是检测可能存在的、无法消耗或产生净代谢产物的无限循环的另一种方法。此外，它可以帮助识别通常与无限循环相关的死端反应。\n\
  \n![图 1.2 无限循环的描绘。如果代谢产物 A 的摄取 v1 被限制在一个实验值，则代谢产物 C 的需求通量 v3 被限制在该摄取上，即 v1 =  v3。然而，通量\
  \ v2、v4 和 v5 可以取任何值并仍然产生可行解。当这些预测的通量作为代谢分析的重要部分时，就会变成一个问题，例如如果用户想要找到 A 到 B 转换值 v4。](img/c01f002.png)\n\
  \n图 1.2 无限循环的描绘。如果代谢产物 `A` 的摄取 `v`[*1*] 被限制在一个实验值，则代谢产物 `C` 的需求通量 `v`[*3*] 被限制在该摄取上，即\
  \ `v`[*1*] =  `v`[*3*]。然而，通量 `v`[*2*], `v`[*4*] 和 `v`[*5*] 可以取任何值并仍然产生可行解。当这些预测的通量作为代谢分析的重要部分时，就会变成一个问题，例如如果用户想要找到\
  \ A 到 B 转换值 v4。\n\n### 1.3.2 泄漏与虹吸\n\n泄漏和虹吸会导致无上限通量或代谢产物积累 \\[50\\]](#c01.xhtml#c01-bib-0050)。当模型预测到在没有适当调节的情况下能量载体流失时，就会发生泄漏，从而扭曲细胞预测。虹吸是指通量流向途径或反应组，但代谢产物（如\
  \ `ATP` 或烟酰胺腺嘌呤核苷酸氢 `NADH`）的消耗和产生是不平衡的，特别是在代谢背景下。\n\n识别泄漏的一种方法是进行所有反应的物料平衡。在平衡良好的模型中，代谢产物不应在没有输入的情况下产生。这种方法可以识别缺乏计量正确输入或输出的反应。\n\
  \n测试泄漏的一种简单但有效的方法是向模型添加合成交换反应。这些合成反应旨在从系统中“泄漏”特定的代谢产物或能量载体，模拟泄漏的影响。通过添加并限制这些反应，人员可以测试能量或代谢产物是否离开了系统。如果模型显示通过这些合成反应产生通量，则表明存在泄漏，需要对涉及的反应进行进一步调查。\n\
  \n`COBRA` 工具箱中的 `fast leak` 函数 [\\[51\\]](#c01.xhtml#c01-bib-0051) 系统地检查在所有交换反应关闭（即不允许摄取）的情况下代谢模型是否能产生产物。它通过最大化通过交换反应的通量来识别任何泄漏的代谢产物。如果检测到分泌通量，则信号存在泄漏。可选，该函数还可以测试需求反应的泄漏。它返回泄漏代谢产物的列表、关闭的模型以及交换反应的通量向量，有助于定位并解决问题反应。\n\
  \n\n\n一旦构建并验证了功能网络，就可以将其转换为能够模拟细胞行为的计算模型。这需要将网络建模为数学问题，通常使用基于约束的方法，如 `FBA`。这些方法能够在定义的条件和目标下预测代谢通量分布，为整合高通量数据集以理解细胞行为提供了强大的工具。\n\
  \n## 1.4.1 通量平衡分析\n\n`FBA` 是分析代谢网络最广泛的方法 [52, 53]。`FBA` 通过线性优化程序计算代谢产物通过系统的流动，从而使得预测代谢通量成为可能，包括生长速率、重蛋白生产、毒性代谢产物的积累、培养基摄取/分泌、基因工程的影响、酶对表型的影响等。`FBA`\
  \ 的原理是对基因组规模模型 (GEM) 内所有代谢产物的物料平衡。代谢产物 A 的（摩尔）物料平衡为：\n\n\n\n\n\n![StartFraction\
