  \ (2024) [\\[68\\]](#c04.xhtml#c04-bib-0068) | 包含突变效应数据集 || 139 K | 测试 |\n| `OpenProteinSet`\
  \ (2023) [\\[69\\]](#c04.xhtml#c04-bib-0069) | 聚合的蛋白质序列、结构和指标 || 470 M | |\n| `CAFA`\
  \ (2023) [\\[70\\]](#c04.xhtml#c04-bib-0070) | CAFA5 包含了 100+ 研究小组，300 K 蛋白质目标 |\
  \ 目标 |\n| `ProteinGLUE` (2022) [\\[71\\]](#c04.xhtml#c04-bib-0071) | 受 NLP 中 GLUE\
  \ 启发，包含蛋白质功能预测、PPI、蛋白质结构预测、蛋白质工程和蛋白质生成的任务 || 21 任务 | 开发 |\n| `DeepFRI-Dataset` (2021)\
  \ [\\[72\\]](#c04.xhtml#c04-bib-0072) | 结构化功能注释 || 29,513 | 测试 |\n| `TempSta-Major-30`\
  \ (2024) [\\[46\\]](#c04.xhtml#c04-bib-0046) | 带有生长温度的非真核序列 || 1.3 M | 是 |\n| `Meltome\
  \ Atlas` (2020) [\\[73\\]](#c04.xhtml#c04-bib-0073) | 基于质谱的热蛋白质组分析 || 48,000 | 否\
  \ |\n| `TargetTrack` (2017) [\\[74\\]](#c04.xhtml#c04-bib-0074) | 聚合的蛋白质溶解性数据 ||\
  \ 350,000 | 否 |\n\n\n\n\n\n# 前驱模型\n\n在现有数据库和数据集之外，不同类型的建模框架也作为序列到函数机器学习（ML）预测流水线的关键工具包。这些框架包括基于机器学习的方法（AlphaFold\
  \ [\\[59\\]](#c04.xhtml#c04-bib-0059)、Chai-1 [\\[9\\]](#c04.xhtml#c04-bib-0009)、ESM-2\
  \ [\\[51\\]](#c04.xhtml#c04-bib-0051)等），以及非基于机器学习的方法（分子动力学 (MD) 模拟、基于量子力的方法、计算生物学方法如\
  \ BLAST [\\[18\\]](#c04.xhtml#c04-bib-0018)等）。\n\n早期的蛋白质功能预测依赖于序列同性和结构域结构，没有结合任何传统的机器学习方法，正如我们在现状部分之前讨论的那样。BLAST\
  \ 仍然通过成对比齐识别同源序列的基础方法。隐马马尔可夫模型（`HMMs`）[\\[75\\]](#c04.xhtml#c04-bib-0075) 通过在 Pfam\
  \ [\\[63\\]](#c04.xhtml#c04-bib-0063) 和 InterProScan [\\[76\\]](#c04.xhtml#c04-bib-0076)\
  \ 等工具中进行概率谱匹配，推进了这一领域。这些方法建立了从已表征同源物中转移功能注释的范式，实现了中等准确率，但受限于进化分化。在这些基于序列相似性的方法之外，序列到函数的流水线还利用\
  \ MD 模拟来提供物理化学见解，这对于理解如变构调节等蛋白质功能 [\\[77\\]](#c04.xhtml#c04-bib-0077) 可能至关重要。此外，密度泛函理论和量子力学方法可以作为序列到函数流水中的前驱工具，因为它们解决了电子效应，而电子效应对于金属酶活性位至关重要\
  \ [\\[78\\]](#c04.xhtml#c04-bib-0078)。\n\n至于基于机器学习的方法，通常有三类模型在这些序列到函数的预测流水线中起到前驱作用。第一类机器学习模型专注于预测蛋白质结构，例如\
  \ AlphaFold [\\[59\\]](#c04.xhtml#c04-bib-0059) 和 Chai-1 [\\[79\\]](#c04.xhtml#c04-bib-0079)。该领域的研究人员在将其与基于结构的功能模型比较性能时，通常会忽略仅基于序列的功能预测模型，后者在单体、PPI（蛋白质相互相互作用）和抗体-抗原\
  \ CASP15 任务中表现出卓越性能 [\\[80\\]](#c04.xhtml#c04-bib-0080)。尽管如此，纯序列模型在计算负载较轻、实验数据可用性广泛以及建模内在无序区域的能力方面具有巨大优势。第二类机器学习模型是\
  \ pLMs（蛋白质语言模型），例如 ESM-2 [\\[51\\]](#c04.xhtml#c04-bib-0051)、ProtT5 [\\[81\\]](#c04.xhtml#c04-bib-0081)\
  \ 和 ProteinBERT [\\[50\\]](#c04.xhtml#c04-bib-0050)。第三类机器学习模型是自回归模型，如 ProtGPT [\\\
  [82\\]](#c04.xhtml#c04-bib-0082) 和 ProGEN [\\[83\\]](#c04.xhtml#c04-bib-0083)，它们通常作为预测的生成式代理。例如，CatPred\
  \ [\\[26\\]](#c04.xhtml#c04-bib-0026) 引入了 `p[1,mag]` 指标，该指标描述了动力学参数预测中数量级误差内的预测百分比。话如此，考虑从头模型也是重要的，例如\
  \ HyenaDNA [\\[85\\]](#c04.xhtml#c04-bib-0085)、Evo [\\[86\\]](#c04.xhtml#c04-bib-0086)\
  \ 和 gLM [\\[87\\]](#c04.xhtml#c04-bib-0087)。\n\n## 4.3 基准测试\n\n### 4.3.2 标准化基准的重要性\n\
  \n标准化的基准对于方法的比较至关重要。虽然在数据集开发方面取得了显著进展，但通常由于研究人员之间缺乏整合。在评估方面，该领域已集中在几个性能指标上。对于分类任务：F[max]（精确率和召回率的调和平均数）、AUPR（精确率-召回率曲线下的面积）以及\
  \ S[min]（预测完整性的语义距离指标）。对于回归任务：R² 决定系数（衡量数据集的相关程度）、皮尔逊 `r`（衡量线性相关性的相关系数）以及斯皮尔曼 `ρ`（衡量关联强度的相关系数）。话如此，考虑对生物学场景可能领域特定指标也是重要的。蛋白质数据集的一个反复问题是它们的偏差/不均匀分布，某些蛋白质类的注释非常稀疏。重要的是要在各种序列相似性划分上对任何序列到函数的模型进行基准测试，这通常通过\
  \ CDHIT [\\[88\\]](#c04.xhtml#c04-bib-0088) 或 MMSeqs2 [\\[89\\]](#c04.xhtml#c04-bib-0089)\
  \ 等工具实现（参见 4.2 中的预划分数据集）。\n\n## 4.4 新兴机器学习方法\n\n蛋白质序列到函数的机器学习方法发展迅速。人们采用了日益复杂的方法来克服序列到函数学习中的不同局限性。新兴策略利用了多样化的方法。下文总结了某些前景领域的关键最新进展。\n\
  \n### 4.4.1 对比学习\n\n对比学习利用自监督策略，通过对齐不同类型的数据（如序列嵌入和结构嵌入）生成稳健的蛋白质表示。这种方法显著增强了泛化能力，特别是在数据稀缺的情况下。对比学习有效的典范是\
  \ CLEAN 模型 [\\[90\\]](#c04.xhtml#c04-bib-0090)，它大幅改进了酶的功能预测。CLEAN 在注释未研究的酶以及准确识别具有多个\
  \ EC 编号的兼性酶方面表现出色。\n\n### 4.4.2 元学习\n\n\n\n\n元学习是机器学习（ML）的一个子类，旨在训练人工智能（AI）模型自主地理解并适应新任务。与传统的监督学习不同（后者是使用定义的训练数据集训练模型来解决特定任务），元学习涉及多个任务，且每个任务都有自己的数据集。通过元学习训练的模型可以在任务之间进行泛化。这使得模型能够以极少的数据快速适应新场景。元学习过程由两个主要阶段组成：(1)\
  \ 元训练，在该阶段模型接触各种任务以发现共同模式和可泛化的知识；(2) 元测试，在新的、未见的任务上对模型进行评估，以衡量其适应性能。该领域的一项近期进展是\
  \ `DeepPFP` [[92]](#c04.xhtml#c04-bib-0092)，这是一种专门为蛋白质功能预测设计的多任务感知模型。`DeepPFP` 将模型无关元学习(`MAML`\
  \ [[93]](#c04.xhtml#c04-bib-0093))与 `ESM-1b` 结合，以有效捕捉通用的序列-功能关系。`MAML` 通过优化模型的初始参数，使得模型在仅经过几次梯度更新步骤后就能快速适应新任务。另一方面，`ESM`\
  \ 利用嵌入在蛋白质序列中的进化信息，捕捉了对准确预测功能至关重要的深度上下文关系。通过将 `MAML` 等元学习策略与来自 `ESM` 的强大序列表示相结合，`DeepPFP`\
  \ 实现了在多种酶功能预测任务中增强的泛化能力。因此，`DeepPFP` 在少样本学习场景中表现出色，超越了传统的深度学习模型。在多个深度突变扫描（DMS）数据集上的评估凸显了其显著提高预测性能的能力，特别是当仅通过序列相似性无法准确预测蛋白质功能时。这种方法有效地解决了蛋白质功能预测中常见的长尾分布挑战，能够准确识别罕见的功能变异。\n\
  \n## 4.5 案例研究\n\n### 4.5.1 酶活性与底物特异性的预测\n\n酶活性的预测是一项长期的功能预测任务。尽管最近出现了许多旨在预测酶活性的模型，但该领域尚未实现满足关键基准的全面解决方案，包括对可用数据集之外的酶进行外推。考虑到大多数酶作为生物催化剂发挥作用，预测酶加速反应的速率认为是酶最重要的预测任务。活性预测可以通过几个功能参数来描述，但最常用的术语是酶的周转数（`k[cat]`）。这些值对于理解不同生物在基因组规模上代谢中的动力学行为至关重要，而且在进行酶工程时也经常作为可调参数。过去几年中，出现了几种用于预测\
  \ `k[cat]` 值的机器学习模型。尽管 `k[cat]` 值是酶实验中最重要且最常用的功能描述符之一，但过去五年出现的机器学习模型在准确预测这些值方面仍然面临困难。机器学习领域开创\
  \ `k[cat]` 预测任务的工作之一来自 `Heckmann et al.` [[94]](#c04.xhtml#c04-bib-0094)。`Heckmann\
  \ et al.` [[94]](#c04.xhtml#c04-bib-0094) 利用了多种传统的机器学习方法，从输入的通量学和蛋白质组学数据预测酶的周转数，包括弹性网络、随机森林以及以集成格式输出预测的\
  \ `FFNN`。在这项工作发表后，多个研究小组致力于开发用于预测 `k[cat]` 值的深度学习模型，正如之前第 4.2.4 节所述。尽管这些模型利用蛋白质-化合物输入来预测酶周转数，但它们是增强我们对蛋白质属性预测理解的绝示例。接下来，我们探索这些流程如何工作的示例。\n\
  \n#### 4.5.1.1 使用 CPI-Pred 预测 `k[cat]`\n\n`CPI-Pred`，即化合物-蛋白质相互预测器，是一种用于推断 `k[cat]`\
  \ 等动力学参数以及其他化合物-蛋白质相互功能描述符的深度学习框架。`CPI-Pred` 输入两个变量（蛋白质序列和化合物 SMILES）并预测一个值（`k[cat]`）。在本章节，我们可以专注于\
  \ `CPI-Pred` 的序列端。在计算生物学领域，蛋白质在进行任何下游处理之前通常遵循 IUPAC 命名。为了让计算机能够理解并处理这种蛋白质语言，它必须将氨基酸转换为数字。这是通过一个称为“标记化”（tokenization）的步骤完成的；蛋白质序列（例如“GCTVE”）通过为每个氨基酸分配一个标记\
  \ ID（即“2, 11, 7, 23, 25”）来转换为数字。在许多此类深度学习流程中，利用 `pLMs`（见第 1.3.1 节）从更大的蛋白质数据集中对感兴趣的蛋白质序列进行“特征化”（例如\
  \ `ESM-2` 是在 6.5 亿蛋白质序列上训练的）。标记化的蛋白质序列被传递给选定的 `pLM`，模型输出一个蛋白质嵌入。在 `CPI-Pred` 的情况下，`ESM-2`\
  \ 模型被确定为流程中性能最好的 `pLM`，尽管还测试了许多其他。从 `ESM-2` 输出的蛋白质嵌入维度为 `D[L] × D[E]`，其中 `D[L]`\
  \ 是蛋白质序列的长度（氨基酸残基数量），`D[E]` 是 pLM 的嵌入维度；对于 `ESM-2`，该维度从 320 到 5120 不等。通常，对于蛋白质功能预测任务，感兴趣的蛋白质在数据集中的中的长度并不一致，这意味着\
  \ `D[L] = max(D[l,i])`，即数据集（或批次）中所有蛋白质的最大长度。由于维度很大，处理这些 pLM 嵌入是一项繁琐且计算密集的任务。因此，不同的模型（包括\
  \ `CPI-Pred`）探索了高效池化信息的方法，尽可能保留学习残基特异信息。`CPI-Pred` 为此任务使用了三种不同的方法：1D 卷积池化、基于自注意力的池化和\
  \ LSTM 变分编码池化（图 4.2）。在这些蛋白质池化步骤之后，我们得到了固定维向量，它可以传递给多层感知器（`MLP`）进行进一步处理和预测。\n\n![图\
  \ 4.2 用于从蛋白质序列预测酶催化效率 (kcat) 的深度学习架构。模型从蛋白质序列输入开始，转换为 ESM-2 嵌入，表示为维度为 DE 和 DL 的高维空间。这些嵌入随后通过三种并行池化方法进行处理：1D\
  \ 卷积池化（在序列上滑动以提取特征）、自注意力池化（使用查询-键-值机制和缩放点积）以及 LSTM 变分编码池化（通过更新隐藏状态和细胞状态来产生潜在表示 (z)，其来自均值\
  \ (μ)、标准差 (σ) 和一些随机噪声 (ɛ)）。这三种池化方法的输出被馈到多层感知器，最终预测酶的 kcat。](img/c04f002.png)\n\n\
  \n\n\n图 4.2 一种用于蛋白质序列预测酶催化效率（`k[cat]`）的深度学习架构。该模型从蛋白质序列输入开始，将其转换为 `ESM-2` 嵌入，表示为维度为\
  \ `D`[*E*]和 `D`[*L*]的高维空间。这些嵌入通过三种并行池化方法进行处理：一维卷积池化（在序列上滑动以提取特征）、自注意力池化（使用查询-键-值机制和缩放点积）以及\
  \ LSTM 变分编码器池化（通过更新隐藏状态和细胞状态产生潜表示 (`z`)，均值 (`μ`)、标准差 (`σ`) 和一些随机噪声 (`ɛ`)）。这三种池化方法的输出被馈入多层感知机，最终预测酶的\
  \ `k[cat]`。\n\n## 4.6 序列到功能映射中的挑战\n\n机器学习方法通过高效探索巨大的序列空间在蛋白质工程中展现前景，但由于复杂性和功能序列稀疏性面临着挑战\
  \ [95, 96]。蛋白质设计在从特定实验转向生物应用时往往失败，这凸显了筛选方法与预期结果之间需要更好的对齐 [97–100]。因此，来自早期筛选的候选对象经常在严格的验证中失败\
  \ [101–104]，而某些蛋白质类完全缺乏合适的高通量实验 [6, 105–110]。\n\n### 4.6.1 稀疏实验数据\n\n**高维空间与有限标签**\
  \ 蛋白质工程面临着巨大的序列维度以及有限功能注释的挑战（图 4.3）。尽管具有高通量筛选能力，但获取高质量的标记数据集需要大量的资源 [61, 111–114]。近期的方法，如低\
  \ N 蛋白质工程 [83]，尝试通过使用 `eUniRep` 等机器学习模型从极少的实验数据中预测功能，实现对数百万个序列的干实验筛选。\n\n**不平衡数据集与稀有酶活性**\
  \ 类不平衡（特别是稀有酶功能的代表性不足）进一步限制了机器学习的性能。这种挑战在高维序列嵌入方法中加剧（图 4.3a）。无论是开发治疗用 [115, 116]、农业用\
  \ [117] 还是工业用 [118, 119] 蛋白质，研究人员都在详细评估和更广泛探索之间面临权衡。虽然存在大量的序列和结构数据库，但由于多样的催化特性和实验条件，功能注释仍然具有挑战性\
  \ [112]。大多数数据库并不是为机器学习应用设计的，导致了不一致、缺失值和冲突注释 [120, 121]。标准化格式并采用 FAIR 原则 [122] 和\
  \ STRENDA 指南 [123] 可以提高数据质量，而对稀有类进行过采样或优化损失函数有助于缓解对过度代表类别的偏差 [112]。\n\n![图 4.3 序列到功能数据集中的挑战。（(a)\
  \ 序列表示方法的复杂性，比较了简单的 one-hot 编码（维度为序列长度 (`DL`) 和可能的氨基酸数量 (`DAA` = 20)）与日益复杂的方法：捕捉局部基序的\
  \ k-mer n-gram 分析，以及诸如 `ESM-2` 等蛋白质语言模型 (pLMs)，它们能生成高维嵌入 (`DE` = 320–5120）。(b) 展示了稀疏注释问题，可视化了在\
  \ Swiss-Prot [66] 中随机采样的 10 万个蛋白质中，只有 7% 在嵌入空间中具有功能注释（红点），留下绝大多数（浅蓝色）未标记，尽管它们在 t-SNE\
  \ 投影中的接近性表明它们可能共享相似的结构或功能属性。](images/c04f003.png)\n- 序列表示方法的复杂性，比较了简单的 one-hot 编码（维度为序列长度\
  \ (`DL`) 和可能的氨基酸数量 (`DAA` = 20)）与日益复杂的复杂的方法：捕捉局部基序的 k-mer n-gram 分析，以及诸如 `ESM-2`\
  \ 等蛋白质语言模型 (pLMs)，它们能生成高维嵌入 (`DE` = 320–5120）。\n- (b) 展示了稀疏注释问题，可视化了在 Swiss-Prot\
  \ [66] 中随机采样的 10 万个蛋白质中，只有 7% 在嵌入空间中具有功能注释（红点），留下绝大多数（浅蓝色）未标记，尽管它们在 t-SNE 投影中的接近性表明它们可能共享相似的结构或功能属性。\n\
  \n### 4.6.2 可解释性\n\n序列到功能预测的用处取决于其生物学见解，但深度学习模型通常作为“黑箱”。尽管 pLM 在预测蛋白质结构和功能方面取得了成功，但它们缺乏可解释性限制了它们在药物发现等关键领域的应用，在这些领域，理解序列变化如何影响功能至关重要。虽然某些模型允许通过标记蛋白质特征来实现条件生成\
  \ [82, 124, 125]，但它们并没有说明哪些特征影响了特定的预测。概念瓶颈 LM (`CB-pLM`) 通过引入具有生物学意义的概念标签改进了可解释性\
  \ [84]。每个瓶颈神经元对应一个特定的属性，能够在生成符合所需属性的序列的同时，便于解释。其他方法还包括 AlphaFold 的结构预测 [59] 以及生成具有生物学意义嵌入的深度表示学习\
  \ [126]。\n\n## 4.7 结论与未来方向\n\n本章审查了蛋白质序列到功能预测中机器学习方法的演变格局，重点关注了从氨基酸序列直接预测功能注释（例如\
  \ GO Term、EC 编号、酶活性、稳定性、毒性和溶解性）的最新进展。关键模型展示了深度学习架构如何在 pLM 的帮助下利用海量序列数据集来填补注释空白。这些模型解决了关键挑战，例如对进化上较远的蛋白质进行泛化以及整合多态数据（例如结构、动力学和多组学见解），同时强调了稀疏实验数据、数据集偏差和计算成本等持续存在的限制。通过连接序列模式与功能结果，这些工具加速了疾病机制、药物靶标识别和酶工程领域的发现，尽管其可靠性仍受限于训练数据的质量和多样性。\n\
  \n\n\n\n\n机器学习驱动的函数预测的进展强调了其在推动基础研究和应用生物技术方面的重要性。然而，该领域必须优先考虑增强模型可解释性的策略、整合物理化学约束，并扩展同源性依赖预测的范围，以充分释放其潜力。虽然目前的模型在狭义任务中表现出色，但其更广泛的用途取决于将高维序列数据与代表不足的功能类别以及动态生物学背景相结合。这些局限性为新兴方法奠定了基础，例如元学习和物理启发架构，这些方法旨在将序列、结构和环境变量统一到预测框架中。\n\
