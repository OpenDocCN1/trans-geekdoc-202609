  图 14.3 标准化时变参数 ![theta Subscript mu Sub Subscript max](img/c14-i0020.png)<math display=\"\
  inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#952;</mi><mrow><msub><mi>&#956;</mi><mrow><mi\
