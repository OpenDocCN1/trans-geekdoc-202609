  \ 用于微生物全基因组关联的生物化学解释性机器学习分类器。*Nat. Commun.* 11 (1): 2580.\n\n# 7  \n\n机器学习加速治疗性肽的发现\n\
  \n## 7.1 引言\n\n\n\n\n\n在本章中，我们将全面概述当前基于机器学习（ML）的方法和策略，这些方法正在改变并加速治疗性肽的发现与设计。首先，我们介绍了与肽相关的关键生物学概念，包括它们的治疗相关性、作用机制以及它们优于传统小分子药物的优势——例如更高的特异性、更低的毒性以及针对挑战性生物界面的能力。我们还讨论了它们的局限性，包括稳定性、生物利用度和易受降解性。\n\
  \n接下来，我们描述了用于提取肽相关信息的主要数据源，涵盖了生物活性、分子功能、药动力学和潜在毒性效应等方面方面。随后，我们介绍了用于开发肽性质预测机器学习模型的传统数据驱动策略，重点关注整合了序列编码、模型训练和验证的监督学习流水线。\n\
  \n在此基础的基础上，我们探索了涵盖各种任务的经典和先进的机器学习方法，包括生物活性分类、毒性副作用预测（如细胞毒性、溶血性和免疫原性）以及关键药理性质的估计，如半衰期、`IC`[`50*]`或在生理环境中的稳定性。此外，我们研究了生成式建模和`de\
  \ novo`（从头）肽设计的最新进展，强调了变分自编码器（VAEs）、生成对抗网络（GANs）和扩散模型等方法如何实现具有优化性质的新型肽序列。\n\n最后，我们讨论了新兴的自主肽设计领域，该领域由能够进行迭代学习、优化和决策的基于机器学习的智能体驱动。我们评估了整合了强化学习、主动学习和闭环设计流水线的当前框架，并评估了它们实现治疗性肽发现的自我改进平台的潜力。本章最后对构建全自主系统的优势、局限性和面临的挑战进行了批判性分析，强调了机器学习（ML）如何驱动下一代智能的、数据引导的肽类药物。\n\
  \n## 7.2 肽：定义与主要特征\n\n与第 5 章和第 6 章中讨论的全长酶相比，肽是由肽键连接的短氨基酸链，长度通常为 2 到 100 个氨基酸残基，分子量在\
  \ 0.5 到 10 kDa 之间[\\[1\\]](#c07.xhtml#c07-bib-0001)。\n\n在结构上，肽可以采用多种二级构象，包括 α-螺旋、β-折叠和随机卷[\\\
  [2\\]](#c07.xhtml#c07-bib-0002)。然而，它们的稳定性可能会受到酶降解和构象柔顺性的影响，限制了它们的生物利用度和治疗效力[\\[3\\\
  ]](#c07.xhtml#c07-bib-0003)。\n\n肽参与了广泛的生物过程，包括激素调节、免疫反应、细胞信号和组织修复，使其成为科学和工业领域的关键分子工具[\\\
  [4\\]](#c07.xhtml#c07-bib-0004)。\n\n由于其结构和功能的多样性，肽在生物系统中发挥着至关重要的作用，并在生物技术、医学和各种工业应用中具有高价值[\\\
  [5\\]](#c07.xhtml#c07-bib-0005)。图 7.1 总结了肽最常见的应用。\n\n在食品工业中，肽作为生物活性化合物发挥作用，具有抗氧化[\\\
  [6\\]](#c07.xhtml#c07-bib-0006)和食品防腐剂属性[\\[7\\]](#c07.xhtml#c07-bib-0007)。\n\n在生物技术领域，肽被用于开发生物传感器，作为检测特定分子的识别元件[\\\
  [8\\]](#c07.xhtml#c07-bib-0008)。它们还被应用于植物保护中，作为生物农药或抗病增强剂[\\[9\\]](#c07.xhtml#c07-bib-0009)，用于免疫调节[\\\
  [10\\]](#c07.xhtml#c07-bib-0010)，以及通过亲和力标签技术应用于蛋白质纯化工作流[\\[11\\]](#c07.xhtml#c07-bib-0011)。\n\
  \n最后，在生物医学研究和治疗应用中，肽在药物设计和递中起着核心作用。它们的用途包括开发具有抗真、抗病毒和抗菌活性的抗菌肽（AMPs），以及肿瘤靶向剂和细胞信号通路中的组分[\\\
  [4\\]](#c07.xhtml#c07-bib-0004)。\n\n在工业背景下，肽在食品工业中起着重要作用，特别是作为天然抗氧化剂和食品防腐剂。除了在食品技术中的应用外，肽还广泛应用于生物技术。肽在植物保护中发挥重要功能，作为生物源杀虫剂和除草剂，以及生物传感器组件和通过基因工程开发抗病作物的成分。此外，肽在医药领域至关重要。它们作为具有抗菌、抗病毒和抗癌特性的治疗药物，由于其良好的生物相性、特异性和低毒性，应用于药物递送系统。其多样性和有效性使其成为多个工业领域不可或缺的工具。\n\
  \n![图 7.1 肽展现了多种应用，包括工业、生物技术和治疗。](img/c07f001.png)\n\n图 7.1 肽展现了多种应用，包括工业、生物技术和治疗。\n\
  \n## 7.3 治疗性肽的优势与局限性\n\n肽的治疗潜力源其能够以高亲和力和特异性与细胞表面受体结合，触发精确的细胞内通路[\\[12\\]](#c07.xhtml#c07-bib-0012)。这种选择性使其对多种病原体（包括病毒、细菌、真菌和寄生虫）特别有效[\\\
  [13\\]](#c07.xhtml#c07-bib-0013)。治疗性肽具有增强的组织渗透、提高的生物利用度和活性——使其成为减少脱靶效应和副作用治疗法的法的候选药物[\\\
  [14\\]](#c07.xhtml#c07-bib-0014)。\n\n与小分子药物相比，治疗性肽具有多种优势。它们的合成通常简单且更具效益，特别是通过固相肽合成或重组生产[\\\
  [15\\]](#c07.xhtml#c07-bib-0015)。高靶标特异性不仅提高了药效，还显著降低了副作用的可能性[\\[16\\]](#c07.xhtml#c07-bib-0016)。此外，肽通常具有较低的免疫原性，提高了其临床安全性。由于具有可降解性，它们不易在组织中蓄积，从而减少了系统性毒性，并很好地契合了精准医学原则[\\\
  [17\\]](#c07.xhtml#c07-bib-0017)。\n\n尽管具有上述优势，治疗性肽仍面临若干临床和药理学挑战。由于快速的酶降解和肾脏清除，其短半衰期限制了其治疗窗口[\\\
  [18\\]](#c07.xhtml#c07-bib-0018)。由于胃道稳定性差和渗透性低，口服给药通常无效，因此需要注射给药途径（例如静脉、皮下或肌内注射），这可能会降低患者的依从性并引入不适和感染等风险[\\\
  [19\\]](#c07.xhtml#c07-bib-0019)。此外，肽在极端 pH 条件下极易变性，且膜渗透性低，限制了其进入细胞内部的能力和生物效力[\\\
  [20\\]](#c07.xhtml#c07-bib-0020)。\n\n\n\n\n\n为了应对这些局限性，目前的研究侧重于提高多肽的稳定性、生物利用度和递送策略。研究人员正在探索诸如多肽环化、`PEGylation`、`lipidation`、`纳米颗粒封装`以及细胞穿透肽等技术，以增强药代动力学和治疗性能\
  \ [21]。\n\n与此同时，药物发现和药物重用策略正在加速治疗性肽的开发。药物发现旨在通过高通量筛选（`HTS`）、计算建模和多肽库来识别新型生物活性肽。相比之下，药物重用则是探索已批准多肽的新治疗适应症，显著缩短了开发时间和降低了成本\
  \ [22]。这些方法扩大了多肽药物的临床版图，为以往难以用传统小分子药物管理的疾病提供了新的治疗选择 [23]]。\n\n随着多肽工程、递送技术和计算生物学的不断演进，治疗性肽有望成为现代医学中更强大的工具——为各种疾病提供个性化、靶向且更安全的替代方案\
  \ [24]。\n\n## 7.4 治疗性肽的计算设计\n\n计算策略的整合彻底改变了治疗性肽的发现和设计，显著加速了具有高生物活性、特异性和稳定性候选药物的识别\
  \ [25]。`ML`、`peptide-protein docking`和`bioinformatics`等技术能够对海量多肽库进行快速筛选，并预测关键属性，包括结合亲力、溶解度、稳定性和毒性\
  \ [26]。通过利用大规模生物数据集和预测建模，这些工具减少了对耗时且昂贵的湿实验的依赖，从而简化并加快了药物开发流程 [27]。\n\n在各种计算方法中，深度学习模型和基于序列的算法被证明在预测多肽生物活性及其与生物靶点的相互作用方面特别有效\
  \ [28]。这些在全面数据集上训练的模型揭示了复杂的序列-功能关系，支持设计高效且高选择性的治疗性肽 [29]。此外，`molecular dynamics\
  \ simulations`为多肽的构象稳定性和靶点结合提供了原子级的见解，促进了物理化学和药学性质的优化 [30]。\n\n生成性模型（包括`transformers`、`GANs`和`VAEs`）的出现进一步推进了从头多肽设计。这些模型能够生成具有定制药代动力学和药效学特征的新型多肽序列，扩展了超越天然序列的化学和功能空间\
  \ [5]。\n\n此外，`structure-based drug design (SBDD)`和`computational docking`通过预测结合亲力、构象柔性和能量有利的位姿来精炼多肽与靶点的相互作用，从而支持先导药物的选择和优化\
  \ [31]。AI 驱动的筛选流程还整合了`bioinformatics`资源来识别具有治疗潜力的天然肽，分析蛋白质-多肽相互作用网络、序列基序和三维结构特征\
  \ [25]。\n\n为了确保治疗性肽候选的临床可行性，采用了多目标优化算法来平衡稳定性、效力、生物利用度和毒性等关键参数 [32]。这些策略的应用能够对候选药物进行临床前验证的合理优先级排序。\n\
  \n随着计算方法的不断演进，它们与实验验证的协同对于实现有效且可靠的多肽设计至关重要 [33]。混合方法——将*in silico*预测与`HTS`、`structural\
  \ biology`和`biophysical characterization`相结合——提高了发现过程的准确性和效率 [34]。此外，AI 驱动的多肽工程平台能够实现旨在提高酶稳定性、膜渗透性和系统生物利用度的合理修饰\
  \ [35]。\n\n通过将计算能力与实证验证相结合，现代策略正在重塑治疗性肽的格局，为复杂且此前无法治疗的疾病提供解决方案，并为精准医学开辟新途径 [26]。\n\
  \n## 7.5 多肽发现的数据来源\n\n在 AI 和生物数据可用性增加的推动下，药物设计的进步导致了专门数据库和计算方法的发展，这些方法已成为生物医学研究的基础\
  \ [5]。核心资源如`Protein Data Bank` [36]和`UniProt` [37]为蛋白质提供了全面的结构和序列数据，支持如`molecular\
  \ modeling`、`protein annotation`和`SBDD`等任务。与此同时，专门的多肽数据库——如`Peptipedia`或`DRAMP`——提供了多肽序列的专门信息。这些平台在治疗候选药物的识别和优化中起着至关重要的作用，集中大规模数据集并整合了加速多肽发现和设计的计算工具。\n\
  \n多肽相关数据库涵盖了广泛资源，从分类不同多肽类型的通用库到关注特定家族、生物功能或药理性质的专门数据库 [25, 49, 57]。这些存储库通过提供多肽序列、结构数据和功能注释，支持治疗和生物技术的应用\
  \ [58]。\n\n`StraPep`和`PepBank`等通用多肽数据库汇集了大量的数据集，以支持对结构-功能关系和生物活性的研究。`StraPep`专注于天然生物活性肽，记录其结构特征；而`PepBank`使用文本挖掘技术提取并整理与治疗和诊断开发相关的多肽数据\
  \ [40, 47]。\n\n在功能分类中，由于抗生素耐药性的日益严重，抗菌肽（AMPs）引起了极大关注 [59]。几个特定的 AMP 数据库——包括`Peptipedia\
  \ v2.0`、`dbAMP`、`DBAASP`、`LAMP`、`DRAMP`、`InverPep`和`CAMPR`——提供了关于天然、合成和专利多肽的策划信息，涵盖了它们的抗菌谱、结构特征以及用于治疗开发的优化工具\
  \ [4, 38, 39, 41–43, 51]。\n\n表 7.1 促进治疗性肽研究的最相关数据库摘要。\n\n| 数据库 || 说明 || 记录数 |\n\n\
