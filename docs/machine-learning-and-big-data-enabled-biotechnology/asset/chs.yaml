  \ 的浓度，\n- `I` = 变构抑制剂 `I` 的浓度，\n- `k[X]` = 代产物 `X` 的解离常数，其中 `X` 是底物或产物（F6P, ATP,\
  \ FBP, ADP），\n- `k[A]` = 激活剂解离常数，\n- `k[I]` = 抑制剂解离常数，\n- `Q` = 反应商，定义为产物浓度积除以底物浓度积，\n\
  - `K[eq]` = 反应平衡常数。\n\n在 PFK 反应中，`ATP` 是底物，但它同时也充抑制剂。因此，对酶动力学方程应应用以下因子：\n\n`f_regulation`\
  \ = 1 / (1 + ATP/kATP) [images/c12-math-0002.png]\n\n```\n<math display=\"block\"\
  \ overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>f</mi><mtext\
  \ mathvariant=\"italic\">regulation</mtext></msub><mo>=</mo><mfrac><mn>1</mn><mrow><mn>1</mn><mo+</mo><mfrac\
  \ bevelled=\"true\"><mrow><mo stretchy=\"false\">\\[</mo><mi mathvariant=\"italic\"\
  >ATP</mi><mo stretchy=\"false\">\\]</mo></mrow><msub><mi>k</mi><mi mathvariant=\"\
  italic\">ATP</mi></msub></mfrac></mrow></mfrac></math\n```\n\n确定反应速率需要底物、产物、效应因子和酶的浓度，以及动力学、热力学和调节信息。在实践中，由于计算通量所需的浓度测量和动力学参数众多，确定代谢网络中的通量具有挑战性。\n\
  \n描述反应动力学和热力学的代谢数学模型提供了关于随时间代谢活动的定量知识。然而，构成数学模型的动力学和热力学参数（米氏尔常数 `k[m]`、催化常数 `k[cat]`、平衡常数\
  \ `K[eq]` 等）在感兴趣的精确生理条件下（例如 pH、温度和离子强度）很少鲜为人知。数学优化、系综建模和深度学习的使用避免了测量全套模型参数的需求。在测量和预测参数的帮助下，酶和代谢产物的浓度决定了反应速率，反之通过质量平衡描述代谢产物水平随时间演变的常微分方程\
  \ (`ODEs`)。\n\n用于推断动力学参数的全局优化技术示例是遗传算法 (GA) 1。该方法为局部优化生成多个起始点，迭代地交叉、变异并选择改进的解决方案。遗传算法已用于根据“猜测”值以及代谢产物浓度的时间序列实验数据，确定大型动力学模型的参数。输入值用于动力学模型的参数化并模拟代谢产物的浓度，然后将其与实验测量进行比较。结果是一组最能代表观测的模型参数\
  \ (1, 2)。遗传算法方法已用于研究代谢循环中的酶变构调节，包括大肠菌的代谢循环、糖酵解和磷酸五糖途径 (PPP)，以及分批发酵过程，仅举几例 (3–5)。\n\
  \n系综建模是另一种方法，它回避了对代谢网络反应酶动力学完整信息的需求 6。在该方法中，创建一个动力学模型的“系综”，以在代谢浓度和通量分布方面达到相同的稳态。动力学模型被引导至稳态。稳态通量可以通过实验测量（通常是营养吸收和产物分泌速率），也可以从每个代谢产物的通量平衡获得。引入热力学约束对系综进行参数化，并包含所需的酶调节信息。系综动力学建模已用于多项研究，包括在大肠菌和蓝细菌的枢碳代谢，以及酿酵母中海藻糖途径的应用\
  \ (6–8)。\n\n\n\n\n\n# 神经网络\n\n神经网络是动力学建模中新兴的替代方案。RENAISSANCE（通过分层采样并使用 ANN 和演化策略概念重构动态模型）是一种机器学习框架，它可以在不需要训练数据的情况下，对具有生理意义的动力学模型进行参数化。RENAISSANCE\
  \ 通过前馈神经网络（FFNNs）捕捉参数化动力学模型的非线性行为，并通过自然演化策略（NES）对其进行优化。该机器学习框架已用于模拟*大肠杆菌*（Escherichia\
  \ coli）的代谢，其结果与实验观察到的稳态和动态响应一致[9]。另一个用于动态建模的机器学习框架示例是 REKINDLE（使用深度学习重构动力学模型）。REKINDLE\
  \ 是一种基于深度学习的无监督方法，利用了生成对抗网络（GANs）[10]。REKINDLE 使用现有动力学建模框架（如蒙特卡洛采样）生成的数据来训练 GAN。尽管动力学参数的可用性有限，但这些计算技术促进了动力学建模的发展（表\
  \ 12.1）。\n\n## 表 12.1 用于动态代谢定量分析的计算框架和资源概述。\n\n| 平台 | 应用 | 参考文献 |\n| --- | --- |\
  \ --- |\n| RENAISSANCE | 通过整合多种组学数据对大规模动力学模型进行高效参数化。 | [9 |\n| REKINDLE | 高效生成代谢的动力学模型。\
  \ | [10 |\n| ML-Flux | 通过对稳态同位素标记模式进行深度学习确定代谢通量。 | [11 |\n| COBRA Toolbox | 基于的建模，包括通量平衡分析（FBA）和通量变异分析（FVA）。\
  \ | [12 |\n| MetaboAnalyst | 代谢组学数据的解释以及通路水平的功能分析。 | [13 |\n| METRAN | 从稳态同位素标记模式确定代谢通量。\
  \ | [14 |\n| INCA | 从稳态和非稳态同位素标记模式确定稳态代谢通量。 | [15 |\n\n## 12.3 通量平衡分析与代谢通量分析\n\n\
  生化测量与计算工具的结合使得代谢的动力学建模成为可能。让我们考虑一种对酶调节了解不完全的情况。知识差距会导致缺失调节的反应步骤的动力学方程出现错误。基于错误方程构建的动力学模型能够准确描绘生化现实和生理情况吗？可能不能，但在某些限制的情况下可以。在不知道反应动力学和调节的全部细节的情况下，我们如何量化代谢活动并阐明任何情况下代谢的动态变化？\n\
  \n通量平衡分析（FBA）和代谢通量分析（MFA）通过提供系统级概述而提供了支持。在 FBA 中，稳态平衡被表示为线性方程组：`S = 0`，其中 `S` 是化学计量矩阵，`v`\
  \ 是通量向量。由于其计算效率高，FBA 被广泛应用于包含数百到数千个反应的基因组模型。\n\n虽然 MFA 的通量解也必须位于 `S` 的零空间内，但 MFA\
  \ 需要实验输入来区分与代谢产物实验同位素标记模式相对应的“最佳”通量[16]。同位素可以通过质谱法（MS）和核磁共振（NMR）光谱跨越反应网络进行追踪。MFA\
  \ 解决了拟合测量标记模式的非线性最小二乘问题。\n\n累积构体（cumomer）[17]和基础代谢单元（EMU）[18]通过减少需要求解的方程数量简化了质量平衡方程。\n\
  \n累积构体代表在化合物的一部分原子中具有相同同位素状态的累积同位异构体（图 12.3）。EMU 是化合物中的原子子集。这些框架允许在不使用完整同位异构体的情况下模拟代谢产物上的同位素标记模式。软件应用如\
  \ INCA、Metran、13CFLUX2、mfapy 和 freeflux 集成了来自 MS 和 NMR 的同位异构体测量用于 MFA（表 12.1）[14,\
  \ 15, 19]–21]。\n\n```\n![图 12.2 创建化学计量矩阵 S 的概述。(a) 一个包含上糖酵解和磷酸糖途径（PPP）并带有目标函数的网络。(b)\
  \ 稳态方程。(c) 与反应网络对应的化学计量矩阵。](img/c12f002.png)\n```\n\n\n\n\n\n碳-13 (¹³C) 是通量测最常用的同位素。碳构成了代谢物和生物量的骨架；因此，研究\
  \ ¹³C 标记模式可以揭示用于生成这些物质的不同代谢途径 22。代谢流分析（MFA）利用数学优化来获取通量，模拟出与实验测量的同位素标记模式最一致的标记模式\
  \ 23。通过单个代谢物质量同位素分布（MIDs）的方差加权（σ²）残差和 (`VarSSR`)，将模拟的同位素模式与测量的同位素模式进行比较 (图 12.4)。\n\
  \n![图 12.4 代谢通量分析概述。(a) 上游糖酵解和磷酸糖穿氢途径（PPP）作为代谢网络的示例。每个箭头代表一个反应，箭头的大小代表通过该反应的通量。(b)\
  \ 原子映射显示了碳原子在通过代谢反应进入代谢物时是如何发生重组的。(c) 代谢通量分析流程。](img/c12f004.png)\n\n图 12.4 代谢通量分析概述。(a)\
  \ 上游糖酵解和磷酸糖穿氢途径（PPP）作为代谢网络的示例。每个箭头代表一个反应，箭头的大小代表通过该反应的通量。(b) 原子映射显示了碳原子在通过代谢反应进入代谢物时是如何发生重组的。(c)\
  \ 代谢通量分析流程。\n\n(12.2)![斜体 VarSSR 等于 sigma-求和 StartFraction left-parenthesis italic\
