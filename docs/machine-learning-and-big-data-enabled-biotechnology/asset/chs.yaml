  \ v Sub Subscript max Underscript upper G Endscripts](img/c14-i0021.png)<math display=\"\
  inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#952;</mi><mrow><msub><mi>v</mi><mrow><msub><mi\
  \ mathvariant=\"normal\">max</mi><mrow><mspace width=\"-0.1em\"/><mi>G</mi></mrow></msub></mrow></msub></math>,\
  \ 以及 ![theta Subscript v Sub Subscript max Underscript upper N Endscripts](img/c14-i0022.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  ><msub><mi>&#952;</mi><mrow><msub><mi>v</mi><mrow><msub><mi mathvariant=\"normal\"\
  >max</mi><mrow><mspace width=\"-0.1em\"/><mi>N</mi></mrow></msub></mrow></msub></math>\
  \ 使用 100 个增强数据集训练 FFNN 得到的精度图。\n\n为了说明引入数据驱动组件带来的改进，我们必须对比基准动力模型与混合模型的拟合情况。图 14.4\
  \ 显示了初始动力模型和整体混合模型的拟合情况，这在两次批次实验中将平均 $R²$ 值从 0.219 提高到 0.974。第一次批次实验（如图图 14.4a 所示）的平均\
  \ $R²$ 值提升巨大，从 0.263 提高到 0.962。第二次批次实验（如图图 14.4b 所示）的平均 $R²$ 值提升略大，从 0.174 提高到 0.986。在模拟状态变量方面，细胞密度的\
  \ $R²$ 值改进最小，从 0.932 提高到 0.996，这意味着原始动力模型对喂入反应器的葡萄糖产率提供了良好的估计。由于发现黄青素浓度与细胞密度密切相关，其\
  \ $R²$ 值也发生了类似的变化，从 0.892 变为 0.965，这进一步支持了不为黄青素实施时变参数的决策。\n\n动态模型拟合的剧改进凸显了引入机器学习捕捉初步建模可能忽略的动态特性的潜力。由于模型足够准确，已准备集成到优化框架中，以设计旨在化黄青素产量的实验，其结果将在下一节讨论。\n\
