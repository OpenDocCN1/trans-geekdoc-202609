  \ Tokyo 184-8588\n\n⁵理化学研究所可持续资源科学中心, 1-7-22 Suehiro, Tsurumi, Yokohama, Kanagawa\
  \ 230-0045\n\n⁶神户大学工程学部化学科学, 1-1 Rokkodai, 657-8501\n\n## 10.1 引言\n\n代谢组学是一种强大的方法，通过全面分析生物系统中的小分子代谢产物来阐明细胞代谢状态。分析技术和大数据处理的进展使得大规模代谢组学数据集变得可用。然而，代谢组学涵盖了多种技术，根据特定研究目标选择合适的方法对于获得可靠数据至关重要。与其他组学方法（如转录组学和蛋白质组）相比，代谢组学处理的是物理性质复杂的化合物，且代谢物的周转率通常远高于蛋白质。因此，选择甚至开发针对目标代谢产物的合适样品制备和分析方法至关重要\
  \ [\\[1\\]](#c10.xhtml#c10-bib-0001)。第 10.2 节为根据研究目标选择合适的代谢组分析技术提供了指导。\n\n\n\n\n\
  代谢组学推动了广泛领域的技术创新，包括医学科学 [2–7]、环境分析 [8]、食品评价 [9]、微生物组研究 [10]以及合成生物学 [11, 12]。特别是合成生物学进展迅速，允许对细胞进行理性工程化以增强目标化合物的产量。这种进展促进了环境影响较的可持续生物制造工艺的发展。合成生物学中代谢组学数据的分析和应用将在第\
  \ 10.3 节中讨论。此外，人工智能（AI）驱动的代谢组学的使用将在第 10.4 节中描述，随后在第 10.5 节中讨论代谢组学应用的未来展望。这些测量代谢组的方法对于开发第\
  \ 11 章和第 12 章中描述的通分析模型至关重要。\n\n## 10.2 代谢组学方法\n\n代谢组学的利用大致可分为两种主要方法：获取定量信息和获取定性信息\
  \ [13]。前者涉及预先确定特定化合物进行定量，并测量其细胞内水平。在这种情况下，会先分析标准参考化合物以确认峰位并建立校准曲线。然后将样品分析结果与这些参考物进行比较以获得定量值。这种代谢组学分析被称为靶向代谢组学。另一方面，后者用于识别菌株之间的代谢差异或从样本中提取特征特征。在这种情况下，采用非靶向分析。该方法通过质谱法（MS）和数据库匹配识别化合物，不需要预先准备标准品\
  \ [14]。\n\n代谢组分析的样品制备和分析方法必须根据所分析化合物组进行仔细选择 [15]。例如，糖解和三羧酸循环（TCA 循环）等中心代谢途径中的代谢中间物周转迅速，使其极易受到细胞采样过程中环境变化引起的人为波动的影响。相反，周转较慢的代谢物（如脂质）受此类变化的影响较小。此外，样品制备方法取决于使用的分析仪器。例如，通过`GC-MS`测量亲水性化合物时，通常需要三甲基硅化（TMS）衍生化以将目标分析物转化为挥发性化合物\
  \ [16]。\n\n### 10.2.1 样本准备\n\n代谢组学样本通常通过多个步骤制备（图 10.1）。第一步是淬灭，迅速停止细胞的代谢状态，然后收集细胞。接着，破碎细胞以提取代谢物。随后可能是去除蛋白或通过干燥进行浓缩。冷甲醇法是最常用的淬灭方法\
  \ [1]。在该方法中，通过混合冷甲醇溶液快速冷却细胞停止代谢反应，然后通过低温离心收集细胞。但重要的是，甲醇会破坏细胞膜，导致代谢物泄漏。在莱藻藻（*Chlamydomonas\
  \ reinhardtii*）中，已有报道使用含有 70mM 2-(羟乙基)哌嗪基乙磺酸（HEPES）的冷甲醇溶液在 -40°C 下混合进行淬灭 [17]。对于蓝藻，使用\
  \ 30% 甲醇可以充分灭灭酶活性 [18]。此外，冷甘醇（GS）溶液已在多种微生物模型中包括荧光假单胞菌（*Pseudomonas fluorescens*）、链霉菌（*Streptomyces\
  \ coelicolor*）和酿酒酵母（*Saccharomyces cerevisiae*）中。结果表明，与冷甲醇溶液相比，使用 GS 溶液的细胞内水平更高\
  \ [19]。对于植物和光合微生物，采样期间的光照条件会显著改变代谢物浓度。在植物中，使用了原位采样设备来切换标记和未标记的 ¹³CO₂，以便测量代谢动力学并识别代谢途径中的限速步骤\
  \ [20]。在蓝藻中，采用了基于酚提取的快速淬灭和采样方法来保持体内状态的同时测量代谢状态，从而阐明 CO₂ 固定的激活动力学 [21]。\n\n![图 10.1\
  \ 代谢组学工作流程的示意图。流程从培养细胞开始，随后通过淬灭（例如冷甲醇或冷甘醇）停止代谢活动。收获通常通过离心或快速过滤进行，并使用热乙醇或甲醇-水氯的方法获取代谢物。根据化合物的物理化学性质，使用气相色谱（GC）、液相色谱（LC）或毛胶电泳（CE）进行分离。最后，使用各种质谱仪（例如四极极、飞行时间、飞行时间离子电旋回谱）进行检测和定量。](img/c10f001.png)\n\
  \n图 10.1 代谢组学工作流程的示意图。流程从培养细胞开始，随后通过淬灭（例如冷甲醇或冷甘醇）停止代谢活动。收获通常通过离心或快速过滤进行，并使用热乙醇或甲醇-水氯的方法获取代谢物。根据化合物的物理化学性质，使用气相色谱（GC）、液相色谱（LC）或毛胶电泳（CE）进行分离。最后，使用各种质谱仪（例如四极极、飞行时间、飞行时间离子电旋回谱）进行检测和定量。\n\
  \n\n\n在提取步骤，通过化学裂解和/或机械破坏细胞壁来回收细胞内代谢产物。在微生物代谢组学中，化学裂解是最常用的方法。对于提取水溶性化合物，经常使用如沸乙醇法和缓冲甲醇-水-氯仿法等方法。然而，有机溶剂、温度和\
  \ pH 的变化会影响测量结果，因此建议采用多种提取方法 1。对于大肠杆菌（`Escherichia coli`），酸性乙腈被认为是提取代谢产物最合适的溶剂 22。对于脂质提取，使用甲醇和氯仿的传统方法如\
  \ Bligh and Dyer 法和 Folch 法已广泛。然而，也开发了利用乙醇和异丙醇等绿色溶剂以及超临 CO[2] 提取的替代方法，以减少毒性担忧 23。\n\
  \n### 10.2.2 检测与定量\n\n色谱法结合质谱法（MS）广泛用于代谢组学中的代谢物分析 24。气相色谱（GC）和液相色谱（LC）根据目标化合物的选择。GC\
  \ 主要用于挥发性化合物和糖，而 LC 能够分析有机酸、氨基酸和脂肪酸。在 LC 中，通常使用利用疏水相互作用的 C18 层。然而，这些柱不适用于分离亲水性化合物，特别是含有磷酸基的糖磷酸和核苷酸。使用亲水相互作用色谱（HILC）柱或离子对试剂可以有助于亲水性化合物的分析\
  \ 25, 26。此外，还开发了一种名为统一亲水相互作用/离子交换 LC 的综合分析方法，用于同时分析具有多种物理化学性质的广泛化合物 27。此外，毛细电泳（CE）特别适用于分离离子和高极性化合物，例如磷酸化代谢物、氨基酸和有机酸。CE\
  \ 与 MS 的结合（CE-MS）作为 GC-MS 和 LC-MS 的补充技术 28。近期无衬 CE-MS 的进展和样品进样技术的改进提高了灵敏度和稳定性 29。这些发展强调了根据目标化合物的物理化学性质选择合适的分离技术的重要性。\n\
  \n连接到 GC、LC 或 CE 的 MS 探测器的选择还取决于分析目标。单级 MS 通常采用四极杆（Q）或飞行时间质谱（TOF-MS），通过通过测量分子离子强度来实现定量。然而，这些方法提供的结构信息有限，难以区分异构体或多种分子物种。为了改进结构表鉴定，经常使用串联质谱（MS/MS）技术，例如三重四极杆（QqQ）、四极杆-飞行时间（Q-TOF）和四极杆-傅叶变换质谱（Q-FTMS）。三重四极杆质谱（QqQ）灵敏度高，适用于靶向定量。相比之下，Q-TOF\
  \ 和 Q-FTMS 提供更高的质量分辨率和更优的化合物鉴定能力，使其成为非靶向分析的理想选择。因此，MS 技术的选择应符合代谢组学研究的目标。整合多种分析技术，包括核磁共振\
  \ (NMR)，可以实现更全面的代谢物谱分析并增强代谢组学分析的深度 30。\n\n## 10.3 生物技术中代谢组学数据的分析与应用\n\n利用大肠杆菌（`Escherichia\
  \ coli`）、酿酵母（`Saccharomyces cerevisiae`）、蓝藻和其他微生物生产价值化合物因其环保特性而受到关注，它们能够在环境压力下运行，并利用植物生物和\
  \ CO[2] 等碳源 31。目标产品从食品添加剂、药物和颜料到塑料和燃料等商品化学品。然而，实现高产量和高效生产需要微生物菌株的改造、筛选和培养条件的优化。这些过程通常通过设计-构建-测试-学习（DBTL）循环进行，这是合成生物学和代谢工程中一种工作流\
  \ 11。在设计阶段，使用基因组规模代谢模型和组学数据来设计代谢途径、启动子和酶。在构建阶段，采用合成生物学技术，包括 DNA 合成、基于 CRISPR 的基因组编辑和机器人技术来构建所需的微生物菌株。在测试阶段，在高通量条件下对工程菌株进行评估，不仅针对产量水平，还包括转录组、蛋白质组和代谢组图谱。最后，在学习阶段，分析获得的数据以指导下一次菌株设计循环\
  \ 12。DBTL 循环不仅适用于菌株工程，还适用于微生物组工程，其中组学技术（包括代谢组学）在阐明微生物组内部复杂的代谢网络中起着至关重要的作用 32。下一节将详细讨论代谢组学在菌株工程中的作用。\n\
  \n### 10.3.1 用于鉴定途径瓶颈的代谢组学\n\n\n\n\n\n在将葡萄糖或其他底物转化为目标化合物的代谢途径中，转化率低的酶会限制整体生产率。增强此类酶的表达或活性可以提高产率。这些瓶颈反应通常会导致底物中间产物的积累。代谢组学能够识别这些积累的代谢产物，为代谢工程提供了一种合理的方法[12,\
  \ 33, 34]。这种策略适用于多种微生物菌株，包括*大肠杆菌*(*Escherichia coli*）、*酿酒酵母*(*Saccharomyces cerevisiae*）、*谷氨酸菌*(*Corynebacterium\
  \ glutamicum*）、蓝细菌和*链菌*(*Streptomyces*）。它也适用于广泛的生产目标，如有机酸、萜、芳香族化合物和脂质，并证明了其有效性(表\
  \ 10.1)）。例如，在用于生产 1-丙醇的工程大肠杆菌菌株中，代谢组学分析揭示了关键前体 2-酮丁酸的积累（图 10.2）。这表明下游酶$\\alpha$-酮异戊酸脱羧酶(`KivD`)或醇类脱氢酶(`YqhD`)构成了途径瓶颈。增强`YqhD`的活性使\
  \ 1-丙醇的产量增加了 1.38 倍[[35]](#c10.xhtml#c10-bib-0035)。乙酰辅酶 A(`acetyl-CoA`)是多种高价值化合物的关键前体，但在蓝细菌中，其积累通常较低，限制了乙酰辅酶衍生生物化学品的生产率。在一种利用木糖的聚胶藻**Synechococcus\
  \ elongatus* UTEX2973 菌株中，代谢组学分析显示在存在木糖时糖酸盐高积累，表明流乙酰辅酶 A 的代谢通量不足。为了解决这个问题，引入了异源磷酸酮酮酶(`Pkt`)来将糖酸盐转化为乙酰磷酸（乙酰辅酶\
  \ A 的直接前体）。此外，为了增强 6-磷酸果糖(`F6P`)的供应，将磷酸激酶(`Pfk`)敲除与果糖 1,6-双磷酸酶(`Fbp`)过表达相结合。这些改进成功增加了乙酰辅酶\
  \ A 的积累，当引入 3-羟基丙酸(`3-HP`)生物合成途径时，3-HP 的产量与原始菌株相比增强了 4.1 倍[[36]](#c10.xhtml#c10-bib-0036)。\n\
  \n代谢组学不仅有助于直接识别途径瓶颈，还有助于发现副产物的形成以及有助于提高突变株生产的关键代谢途径。例如，在用于生产 3-氨基-4-羟基甲酸(3,4-AHBA)的谷氨酸菌工程菌株中，代谢组学揭示了乳酸的显著积累。为了抑制乳酸形成，执行了乳酸脱氢酶基因(`ldh`)敲除，导致\
  \ 3,4-AHBA 的产量增加了 1.33 倍[[37]](#c10.xhtml#c10-bib-0037)。同样，在一种用于生产琥酸的大肠杆菌工程菌株中，代谢组学鉴定出副产物甘醇醇的过度积累。删除甘醇醇脱氢酶基因(`mtlD`)成功减少了甘醇醇的合成，并使琥酸产量增加了\
  \ 1.2 倍[[38]](#c10.xhtml#c10-bib-0038)。代谢组学引导的工程对于次级代谢产物的生产也是有效的。阿片类苄离喹啉的代谢途径包含几个潜在的瓶颈。鉴定出一种在发育上不同的家蚕**Bombyx\
  \ mori*3,4-二羟基苯醛合成酶(`DHPAAS`)作为旁路酶，使 L-3,4-二羟基苯丙酸(`L-DOPA`)直接转化为 3,4-二羟基苯醛(`DHPAA`)，有效地跳过了酶促步骤[39。在这项研究中，代谢组学分析显示腺苷甲氨酸(`SAM`)的耗尽限制了下游\
  \ DHPAA 衍生物离喹啉碱产生菜醇。为了解决这个问题，开发了两步细胞生产，分离了依赖 SAM 的甲基化反应，增加了下游产物（包括菜醇）的水平。此外，在*Streptomyces\
  \ nodosus*生产抗真菌药物两霉素 B(`AmB`)时，通过紫外线照射和添加硝基胍获得了高产菌株(`ZJB201605`)。对该菌株进行代谢组学分析显示，与野生型相比，叶叶酸(`THF`)和其他单碳代谢是该突变株的关键代谢途径，过表达甲氨酸酶(`metH`)导致\
  \ AmB 产量增加了 2 倍[40。\n\n### 表 10.1 微生物的代谢组学引导工程\n\n| 宿主生物 | 目标 | 遗传修饰 | 增加倍数 | 参考文献\
