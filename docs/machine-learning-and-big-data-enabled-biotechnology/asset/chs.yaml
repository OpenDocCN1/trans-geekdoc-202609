  \ = −log(0.7) ≈ 0.36，表示预测很有信心。相反地，如果模型给所有核苷酸分配相等的概率（`[0.25,0.25,0.25,0.25]`），`Loss`\
  \ = −log(0.25) ≈ 1.39，则不确定性较高。\n[/content]\n\n*(注：由于提供的待翻译文本存在大量重复段落，根据“千万不要重复输出原文”的指令，我已对内容进行了去重并合并翻译。)*\n\
  \n[content]\n基于 Transformer 的模型的一个重要创新是注意力机制，如图图 3.4 左下角所示。注意力机制允许模型在预测核苷酸时，通过为每个位置分配重要性评分（或注意力权重），来选择性地关注输入序列的某些部分。重要的是，注意力权重是依赖于上下文的，这意味着分配给每个核苷酸的相关性会根据特定的周围序列而改变。例如，在对启动子区域进行建模时，模型可能会对已知的调控基序（如\
  \ TATA 盒，“TATAAA”）分配高注意力评分，以预测下游的转录起始位点 (TSS)。\n\n基于 Transformer 的 DNA 语言模型使用交叉熵损失作为目标函数进行训练。交叉熵将预测的核苷酸概率分布与实际的正确核苷酸进行比较。交叉熵值越低，意味着模型为正确答案分配的概率越高。对于\
  \ `MLM`，模型仅利用完整序列上下文预测被掩码的位置；对于 `AR` 建模，模型仅利用之前的位置从左到右预测每个核苷酸。在这两种情况下，交叉熵都会在每个相关位置计算以指导学习。每个设置的损失可以定义为：\n\
