  \ [37] | 2018 |\n\n\n\n\n\n#### CoReCo\n\n比较代谢重构（CoReCo）[[21]](#c02.xhtml#c02-bib-0021)\
  \ 是一种基于 Python 的软件，能够同时生成多个相关物种的基因组规模模型（GSM），已被证明在生成真菌 GSM 上特别有用。对于那些与广泛研究的模型物种在系统发育上较远、基因组序列覆盖率低或仅有不完整基因组参考的物种，这种比较方法是生成\
  \ GSM 的关键。\n\nCoReCo 创建 GSM 的第一阶段是量化物种中已知酶的证据。给定基因组序列输入，通过 `BLAST` 和 `Global Trace\
  \ Graph`（`GTG`，用于更远的同源物）寻找同源序列。`BLAST` 和 `GTG` 的定量结果被整合到贝叶斯网络模型中，得出每个现存物种和假设祖先物种中酶存在的概率。贝叶斯网络的拓扑结构基于系统发育树，条件概率分布描述了每个祖先物种中酶的概率。\n\
  \n在第二阶段，为现存物种和祖先物种构建代谢模型。使用第一阶段计算的酶概率，CoReCo 在 `KEGG` 命名空间中创建一个高概率反应网络。只有高概率的反应会被包含在内，除非包含某个高概率反应会导致模型出现空隙，在这种情况下，将用低概率反应代替它。CoReCo\
  \ 的结果是一个 `SBML` 格式的无空隙 GSM，其中包含酶概率的注释。\n\n#### metaGEM\n\nmetaGEM [[8]](#c02.xhtml#c02-bib-0008)\
  \ 直接从原始宏基因组序列重构 GSM。`metaGEM` 使用的流程能够直接从宏基因组序列对多物种群落进行建模，并实现所有步骤的自动化，从从宏基因组组装基因组（MAGs）中提取特定环境的原核细菌\
  \ GSM 到群落水平的通量平衡分析（`FBA`）模拟。`metaGEM` 流使用 `Snakemake`（一种开源生物信息学工作流引擎）设计并实现，用户可以在命令行界面中运行。\n\
  \n`metaGEM` 的输入是原始 `FASTQ` 文件，`metaGEM` 流程的第一步包括宏基因组重构。在组装 `MAGs` 之后，使用 `CarveME`（见\
  \ 3.2.2.1）构建适用于 FBA 的 GSM，然后使用 `MEMOTE` 进行质量检查。此外，物种代谢分析（`SMETANA`）框架被整合到 `metaGEM`\
  \ 流程中，用于样本特定的群落交互建模。该流程还可以对重构的 `MAGs` 和 GSM 进行分类分类自动分配、计算生成的 `MAGs` 的相对/绝对丰度、估计高覆盖率\
  \ `MAGs` 的生长速率并进行泛基因组分析。`metaGEM` 流程功能多变，将许多现有的高质量宏基因组和 GSM 工具整合到一个易于使用的流程中。\n\n\
  #### Merlin\n\n使用基因组规模信息的代谢模型重构（`Merlin`）[[22]](#c02.xhtml#c02-bib-0022）是一种用户友好基于\
  \ Java 的 GEM 创建工具，适用于任何已测序基因的生物。`Merlin` 可以对原核或真核基因组进行酶功能和运输功能的注释，并在极少的用户交互下构建分化的草图\
  \ GSM。\n\n`Merlin` 的输入是原始氨基酸或核苷酸 `FASTA` 文件。然后使用 `BLAST` 和 `HMMER` 为基因分配酶功能。随后为每个基因分配酶学（EC）编号和置信度水平。用户还可以定义\
  \ `EC` 阈值。基因组注释后，确定区室预测。接下来开始构建模型，加载内部数据库（包含来自 `KEGG` 的途径信息）。通过交叉引用化学数据库，为基因组中的所有基因定义\
  \ `GPR` 规则。最后，`Merlin` 中有一个模块识别模型中的空隙，但不采用空隙算法来填充这些空隙。最终创建的的 GSM 只包含与基因相关的反应。`SBML`\
  \ 注释可以导出并使用其他工具进行修改。\n\n#### MS2/OMEGGA on KBase\n\nKBase [[23]](#c02.xhtml#c02-bib-0023）是美国能源部的系统生物知识库，是一个开源、基于\
  \ Web 且用户友好的软件数据平台。`KBase` 拥有内部数据库，包含来自 `RefSeq` 的 90,000 多个微生物基因组、来自 `Protozyme`\
  \ 的 50 个植物基因组以及来自 `KEGG`、`BIGG` 和 `MetaCyc` 的超过 30,000 个反应和化合物。这些数据可以通过 Kbase 中超过\
  \ 160 多个应用程序进行整合和分析，这些应用为宏基因组组装、比较基因组学和 RNA-seq 处理等提供了多种科学功能。最重要的是，在本章背景下，`KBase`\
  \ 提供了一个名为 `MS2/OMEGGA` 的用户友好 Web 应用，用于从基因组序列生成 GSM，该应用基于 `ModelSEED` 重构流程（见 3.2.1.1）。\n\
  \n在 `MS2/OMEGGA` 流程中，首先使用 `RAST` 注释服务器注释基因组，然后确定 `GPR` 规则。将注释基因映射到 `ModelSEED` 数据库中的反应。随后，通过将所有基因相关的反应添加到\
  \ GSM 中创建草图模型。在 `KBase` 重构流程中有一个可选的空隙填充步骤，用于识别添加到草图模型中的最小反应集，以实现在特定培养基上的生物量合成模拟。模型创建后可以使用其他\
  \ `KBase` 工具进行分析，或下载后使用外部工具进行分析。\n\n### 2.3.2.2 从预注释序列\n\n`CarveME` [[7]](#c02.xhtml#c02-bib-0007)\
  \ 是一种基于 Python 的命令行工具，使用自上而下的方法生成 GSM。通常情况下，GSM 是使用自下而上的方法创建的，即通过向草图模型迭代添加反应来填充空隙，并实现不同培养基条件下的生长模拟。`CarveMe`\
  \ 使用的另一种自上而下方法从一个通用代谢模型开始，根据基因组序列对模型进行“雕刻”，以移除预测不会出现在给定生物体中的反应和代谢产物。\n\n\n\n\nCarveMe\
  \ 工作流始于创建一个通用草图模型，该模型是一个模拟就绪的模型，包含了 `BiGG` 数据库中所有的生物化学反应。用户输入是预注释的 DNA 或蛋白 FASTA\
  \ 文件；不支持原始基因组文件。使用 `DIAMOND` 将输入的基因组比对到 `BiGG` 数据库，以找到所有同源基因。识别出的同源基因通过 `GPR` 关联映射到反应上。根据反应涉及的酶是否有直接的遗传证据对反应进行评分。随后，通过求解混合整数线性规划\
  \ (`MILP`) 优化问题对通用模型进行切割，以创建物种特异模型，目标是最大化高分反应（具有遗传证据的反应）的存在，并最小化低分反应（无遗传证据的反应）的存在。结果是一个“切割”过的物种特异模型。在生成物种特异模型后，还有重构后的修改选项，包括基于无遗传证据反应的随机加权生成模型集、添加实验约束以及基于培养基的缺口填充。`CarveMe`\
  \ 的输出是 `SBML` 格式的模拟就绪 `GSM`，这是社区标准。\n\n### Reconstructor\n`Reconstructor` [24] 是一个基于\
  \ Python 的工具，用于从注释基因组序列构建 `GSM`，它生成的 `GSM` 直接兼容 `COBRApy`（不需要使用额外的兼容模块）。`Reconstructor`\
  \ 的 `GSM` 使用 `ModelSEED` 命名空间构建，允许它们与与其他工具创建的模型结合使用。\n\n`Reconstructor` 首先获取一个预注释的蛋白\
  \ FASTA 文件，并使用 `DIAMOND BLASTp` 将其比对到 `KEGG` 数据库以识别所有同源基因，然后这些基因映射到 `ModelSEED`\
  \ 命名空间中的反应。这些与基因相关的反应被添加到草图 `GSM` 中。随后，`Reconstructor` 使用简约 `FBA` 缺口填充方法识别一组能够最小化网络通量的非基因相关反应，从而产生最符合生物学简约的网络。在基于\
  \ `pFBA` 的缺口填充之后，可以执行后续的基于培养基的缺口填充步骤，为 `GSM` 添加额外的培养基特异性运输反应。`Reconstructor` 可以接受三类输入：(1)\
  \ 注释的氨基酸 FASTA 文件，(2) `DIAMOND BLASTp` 搜索输出，(3) 用于进一步进行培养基缺口填充的现有 `SBML` `GSM`，允许重建器以各种形式集成到计算流水线中。`reconstructor`\
  \ 的结果是一个模拟就绪的 `SBML` 文件。\n\n### pyFBA\n`pyFBA` [25] 是一个基于 Python 的开源软件包，可以使用功能注释来构建用于模拟的\
  \ `GSM`，这些模型由 `ModelSEED` 生物化学数据库支持。`pyFBA` 不需要特定的注释类型（`RAST`、`PROKKA`、`BG7`、`Blast2GO`、`BASys`\
  \ 注释均有效），但它需要连接基因、酶和反应的注释来定义 `GPR` 规则。\n\n`pyFBA` 算法首先利用生物化学数据库将基因组注释信息提供的功能转换为反应。如果使用\
  \ `RAST` 注释，`SEED` 数据库在一致的命名空间内提供了功能、酶复合物、反应和化合物之间的连接。`pyFBA` 识别 `ModelSEED` 反应和化合物。`pyFBA`\
  \ 算法识别 `ModelSEED` 反应和化合物。（等等，此处此处重复，我将保持核心内容）。\n\n*根据提供的文本流进行的修正/完善：*\n`pyFBA`\
  \ 是一个基于 Python 的开源软件包，可以使用功能注释来构建用于模拟的 `GSM`，这些模型由 `ModelSEED` 生物化学数据库支持。`pyFBA`\
  \ 不需要特定的注释类型（`RAST`、`PROKKA`、`BG7`、`Blast2GO`、`BASys` 注释均有效），但它需要连接基因、酶和反应的注释来定义\
  \ `GPR` 规则。\n\n`pyFBA` 算法首先利用生物化学数据库将基因组注释信息提供的功能转换为反应。如果使用 `RAST` 注释，`SEED` 数据库在一致的命名空间内提供了功能、酶复合物、反应和化合物之间的连接。`pyFBA`\
  \ 识别 `ModelSEED` 反应和化合物。`pyFBA` 算法识别 `ModelSEED` 反应和化合物。（注：提供的源文本此处有重复，我将处理逻辑流）。\n\
  \n`pyFBA` 算法首先利用生物化学数据库将基因组注释信息提供的功能转换为反应。如果使用 `RAST` 注释，`SEED` 数据库在一致的命名空间内提供了功能、酶复合物、反应和化合物之间的连接。`pyFBA`\
  \ 识别 `ModelSEED` 反应和化合物。（继续遵循提供的文本逻辑）。\n\n#### 2.3.2.3 来自反应数据库\n\n### Raven\n`Raven`\
  \ [26] 是一个用于 `GSM` 构建、策化和模拟的 MATLAB 工具箱。使用 `Raven` 可以创建包括细菌、古菌、真核微藻、寄生虫、真菌和人类组织在各种物种的\
  \ `GSM`。`Raven` 使用 `Metabyc` 或 `KEGG`。\n\n第一种方法需要一个与物种物发育相关的现有 `GSM`。`Raven` 使用\
  \ `BLASTp` 进行蛋白质同源性分析。或者，可以使用 `KEGG` 或 `Metabyc` 构建 `de novo`（从头开始）重构。基于 `KEGG`\
  \ 的重构使用 `BLASTp` 进行相似性比较。如果构建基于 `Metabyc` 的 `GSM`，则使用 `BLASTp` 查询蛋白序列。无论使用哪种方法，草图模型都会产生高质量的网络重构。\n\
  \n### AutoKEGGRec\n`AutoKEGGRec` [27] 是一个基于 MATLAB 的工具，用于从 `KEGG` 物种 ID 创建 `GSM`\
  \ 并与 `COBRA Toolbox` v3 无缝集成。`AutoKEGGRec` 创建的草图 `GSM` 并非旨在完全功能，而是手动策化和模拟的起点。\n\n\
  `AutoKEGGRec` 首先将 `KEGG` 物种 ID 作为输入，然后从 `KEGG` 查询 `EC` 号与对应基因之间的连接。然后，检索反应与 `EC`\
  \ 号之间的关联。`KEGG` 中所有与查询 `KEGG` 物种 ID 关联的反应被检索并与目标物种的对应基因相关。此时，每个反应及其注释以及相应的化合物注释将从\
  \ `KEGG` 下载，用于草图模型重构。\n\n`AutoKEGGRec` 的输出是一个包含 `KEGG` 反应、关联 `GPR` 规则和注释信息的 MATLAB\
  \ 结构变量。\n\n### rBioNet\n`rBioNet` [28] 是一个 MATLAB 软件包，实现了 `QA/QC` 措施以生成高质量的生物化学网络重构，这些重构可以快速转换为兼容\
  \ `COBRA Toolbox` 的 `GSM`。`rBioNet` 流水由三部分组成：(1) 代谢物创建器及其相应的数据库 (`MetDB`)，(2) 反应创建器及其相应的反应数据库\
  \ (`RxnDB`)，以及 (3) 重构器。\n\n\n\n代谢产物可以通过三种方式创建：(1) 手动添加代谢产物信息，(2) 加载包含所有信息的制表符文件，以及\
  \ (3) 从其他 GSM 重建中加载代谢产物信息。其次，反应也可以通过这三种方式添加。重要的是，反应只能包含 MetDB 中有的代谢产物。然后，用户可以根据\
  \ `RxnDB` 提供的反应信息创建一个重建，并在必要时向重建中导入元数据。在创建生物化网络重建后，用户可以通过 GPR 为每个反应分配基因关联。为了实现这一点，用户必须提供一个包含物种基因注释信息的制表符文件。在完成\
  \ GPR 关联后，可以对重建进行基准测试以寻找死端代谢产物，并最终以多种格式导出，包括 SBML、表格或与 `COBRA Toolbox` 兼容的数据结构。重要的是，`rBioNet`\
  \ 生成的是一个生物化网络重建，而不是模型。可以使用 `COBRA Toolbox` 对重建进行约束，以生成特定条件下的、准备好进行模拟的模型。\n\n###\
  \ FAME\n`FAME` 通量分析与建模环境（FAME）[[29]](#c02.xhtml#c02-bib-0029)是一个基于 Web 的一站式计量建模工具，它将创建、编辑、运行、分析/可视化整合到一个用户友好的界面中。虽然\
  \ `FAME` 不再作为一个功能工具进行维护，但该工具的某些方面仍然值得讨论，以启发具有相似特征的下一代现代功能性工具。\n\n在 `FAME` 工作流中，用户可以根据\
  \ KEGG 信息生成自己的模型，也可以上传现有模型。在生成新模型时，用户可以从 KEGG 中选择一个通路子集进行规避，包括现有 GEMS 中可能存在的必要反应。`FAME`\
  \ 还存储了 `KEGG ID` 信息，以便在生成过程中如有需要，可以从 `KEGG` 查找更多信息。在加载或生成模型后，`FAME` 整合了编辑通量边界、编辑反应、识别孤儿代谢产物以及将反应分配给细胞室的工具。模型完成整理后，`FAME`\
  \ 还具有内置的优化和分析工具，包括 `FBA` 和通量变异分析 (`FVA`)，这些工具由 `PySCeS-CBM` [[39]](#c02.xhtml#c02-bib-0039)\
  \ 支持。此外，基因关联工作站允许用户利用模型元数据中编码的基因关联信息模拟敲除突变体。最后，`FAME` 了一个通路可视化模块，以更深入地探索模型涉及的生物化学过程。`FAME`\
  \ 最吸引人的特征之一是基于 Web 的点击式界面，这使得 GSM 的创建和分析对具有计算和非计算科学背景的更广泛的用户更容易上手。\n\n### MicrobesFlux\n\
  `MicrobesFlux` [[30]](#c02.xhtml#c02-bib-0030)是一个基于 Web 的平台，用于为 `KEGG` 数据库中已注释的微生物半自动地生成\
  \ GSM。`MicrobesFlux` 可以从 `KEGG` 数据库下载与约 1,200 种独特物种相关的酶促反应、代谢产物和代谢网络，并将代谢网络信息转换为草图\
  \ GSM。草图模型可以转换为基于约束的通量模型，以预测微生物代谢中的碳通量，并最终导出为 `SBML` 格式。重要的是，`MicrobesFlux` 是一个无需安装的平台，使没有现有编程知识的生物学家能够访问代谢网络建模，为\
  \ `KEGG` 数据库中的物种开发模型。\n\n`MicrobesFlux` 流程依赖于 `KGML`（物种特有的代谢网络）和 `KEGG LIGAND`（酶促反应和代谢产物）数据库来生成模型。要生成功能性\
  \ GSM，首先从 `KEGG` 下载物种特有的代谢网络，然后可以将其公式化为 `FBA` 模型进行模拟。`MicrobesFlux` 还提供了一套用于模型制的工具；但重要的是，使用\
  \ `MicrobesFlux` 创建的 GSM 仍被视为草图模型。在 GSM 定制后，可以使用求解器进行基于约束的通量分析，并将通量分布和模型以 `SBML`\
  \ 格式提供给用户。总体而言，`MicrobesFlux` 可以执行三个主要任务：(1) 高通量代谢模型生成、(2) 定制化代谢模型草拟以及 (3) 稳态和动态状态下的基于约束的通量分析。\n\
  \n####2.3.2.4 基于现有 GSM\n\n### MetaDraft\n`MetaDraft` [[31]](#c02.xhtml#c02-bib-0031)是一种基于\
  \ Python 的下载软件，带有图形用户界面 (GUI)，可基于手动整理的模型创建 GSM。`MetaDraft` 拥有丰富的用户界面，通过可视化基因 `BLAST`\
  \ 评分、反应和代谢产物来进行模型整理，并可以从重建中进行删除。\n\n`MetaDraft` 接受 FASTA 或 GenBank 文件格式的蛋白质序列作为输入。`MetaDraft`\
  \ 的原理是将输入的蛋白质与来自 `BiGG` 数据库的模板模型列表进行比较。用户可以选择一组模板模型，这些模型将形成元蛋白质组的基础。然后，用户可以针对所选模板模型创建的元蛋白质组对其输入序列进行\
  \ BLAST。随后可以查看结果，根据评分从元蛋白质组中选择基因。选中的每个基因都有现有的 `GPR` 关联，用户可以查看并编辑基因关联反应以进一步整理模型。重建可以转换并导出为\
  \ `SBML` 格式，以便与其他工具进行进一步分析和模拟。\n\n### GEMSiRV\n`GEMSiRV` [[32]](#c02.xhtml#c02-bib-0032)是一个免费提供的、可下载的软件平台，用于基因组规模代谢模拟、重建和可视化。`GEMSiRV`\
  \ 自带一个现有代谢模型库、参考数据库、代谢图谱和分析工具箱，这些可以作为网络构建和模拟的起点。`GEMSiRV` 可以在本地计算机/服务器上运行，而不依赖 Web\
  \ 界面。重要的是，`GEMSiRV` 还可以导入现有模型进行进一步整理和填补，并可以整合实验数据进行背景化。\n\n`GEMSiRV` 由三个主要模块组成：(1)\
  \ 网络重建、(2) 模拟以及 (3) 可视化。可以使用近缘物种的现有 GSM 构建新的 GSM。给定用户定义的同源基因列表，`GEMSiRV` 将提取符合参考模型定义的基因-蛋白质反应关联的相应反应。基于现有模型构建\
  \ GSM 有助于减少手动构建模型的工作。构建草图 GSM 后，`GEMSiRV` 具有内置模拟模块，用户可以使用它们生成生物学假设，包括死端代谢产物识别、目标优化、`FVA`\
  \ [[40]](#c02.xhtml#c02-bib-0040)、稳健性分析、基因/反应必需性分析以及基因删除分析。最后，可视化模块允许基于 `KEGG` 通路对感兴趣的代谢网络进行编辑和可视化。\n\
  \n\n\n\n`SuBliMinaL` SuBliMinaL 工具箱通过提供独立模块来辅助 GSM 重构过程，支持常见的重构任务，如生成草图重构、质量/电荷平衡反应、添加转运反应、生物量函数以及转换为用于第三方工具分析的正确格式。`SuBliMinaL`\
  \ 中的模块可以串联以创建一个完整的重构流水线，或仅用于修改 `SBML` 格式的现有模型。\n\n特定物体的初始路径通过 `KEGG-extract` 和 `MetaCyc-extract`\
  \ 模块从 `KEGG` 和 `MetaCyc` 中提取。这些途径随后被转换为 `SBML` 草图模型，并进行进一步的修改和优化。或者，可以将现有模型加载到软件中并通过各种模块进行修改。针对物种特异性路径，`SuBLiMinaL`\
  \ 执行注释步骤，将模型组件与 `GO`、`ChEBI` 和 `UniProt` 等数据库进行交叉引用，从而更新模型以供下游处理。`SuBliMinaL` 还支持合并基于\
  \ `KEGG` 和 `MetaCyc` 的模型以创建一个整合模型。此外，还有一个 `protonate` 模块可以预测代谢产物的 `pKa` 和电荷状态，随后在模型中更新这些信息。`Balance`\
  \ 模块通过混合整数线性规划实现了反应质量和电荷平衡的自动化。由于 `SuBliMinaL` 生成的是非区室化重构，`compartmentalized` 模块根据\
  \ `UniProt` 的蛋白质定位信息预测代谢产物所在的区室。`transport reaction` 模块向模型中添加导入反应，以允许从生长培养基中吸收代谢产物。最后，`biomass`\
  \ 模块为重构模型分配生物量反应，并对模型进行格式重整，使其能够使用 `COBRA Toolbox` 进行 `FBA` 仿真。该流水线的结果是一个可用于仿真的\
  \ GSM，可用于生物学假设的生成。\n\n### 2.3.2.5 GSM 修改与可视化工具\n\n`PathwayTools` PathwayTools 是一种旨在管理、分析、模拟和可视化集成基因组、途径和调控数据集合的软件环境。`PathwayTools`\
  \ 支持物种特异性数据库的创建和优化，包括途径-基因组数据库 (`PGDBs`)，其中包含基因、蛋白质以及代谢和调控网络的信息。`PathwayTools` 包含一个\
  \ `MetaFlux` 模块，允许构建和执行稳态代谢流模型。`MetaFlux` 模拟基因和反应敲除，允许用户探索物种内部的代谢动力性和依赖关系。`PathwayTools`\
  \ 还配备了 `API` 工具，用于执行更复杂的查询和数据挖掘，允许用户执行更具自定义的分析。`PathwayTools` 程序最重要的方面之一是允许用户通过细胞概览图视化整个网络，它甚至允许将基因表达数据或其他实验数据映射到网络上。`PathwayTools`\
  \ 整合基因组、化学和调控信息的能力使其成为丰富代谢建模和可视化的强大工具。\n\n`AuReMe` `AuReMe (代谢模型自动重构)` 是一种流水线工具和工作流控制器，它通过整合一系列现有的学术级工具，支持对\
  \ `GSMs` 的灵活重构和定制。虽然 `AuReMe` 不生成模型，但它允许用户将工具编译为针对不同数据源和项目需求定制的自定义流水线。重要重要的是，`AuReMe`\
  \ 维护了所用方法的完整记录和元数据，以确保流水线的可重复性。该工具支持 GSM 创建的关键实践，如注释、空隙填充、手动优化以及各种模型分析和仿真方法，使 `AuReMe`\
  \ 适用于自动化和手动建模方法。`AuReMe` 与 `BiGG`、`ModelSEED` 和 `MetaCyc` 等主流代谢数据库配合，如果用户拥有可用许可，也可以访问\
  \ `KEGG`。此外，`AuReMe` 提供了广泛的输入灵活性，接受基因组 `GenBank` 文件、蛋白质序列 `FASTA` 文件、`SBML` 格式的代谢模型、途径/基因组数据库、基因表达数据、培养基组成、代谢靶点、生物量组件以及\
  \ `CSV` 格式的反应和代谢物数据库。其强大的整合功能和导出功能（包括以 `SBML` 格式导出模型以兼容 `cobra toolbox`）允许用户构建详细、透明且易于共享的代谢模型。\n\
  \n`MEMOSys` `MEMOSys (代谢模型研发系统)` 是一个基于 Web 的综合平台，便于 `GSMs` 的管理、存储和开发。`MEMOSys` 设计旨在增强模型修改工作流，而非从零开始生成模型，非常适合处理演化或衍生代谢模型的用户。它为\
  \ `GEMs` 提供了一个稳健的数据库，允许用户创建层次化的模型结构，更改可以在相关模型之间传播，从而实现跨代的高效更新和简化版本控制。`MEMOSys` 的主要功能之一是能够对模型组件（包括反应、代谢产物、基因和细胞区室）进行注释，遵循生物模型注释\
  \ (`MIRIAM`) 标准。这种整合包含了外部数据库的链接，允许研究人员利用外部化学、遗传和调控信息来增强模型的实用性。数据库还支持从 `SBML` 文件中提取元数据，便于整合和存储详细注释。\n\
  \n`MEMOSys` 目前托管了 20 个公开 `GSM`，这些模型可以以标准格式导出以便外部工具进行进一步分析。平台的最新更新扩展了兼容性，允许安装在 `Linux`、`Mac`\
  \ 和 `Windows` 操作系统上，并且以完全配置的虚拟机镜像形式提供，降低了用户的设置复杂度。这种虚拟机配置不仅简化了部署，还让 `MEMOSys` 更加易用，为研究人员提供了一个现成的环境，用于基于现有\
  \ `GSMs` 构建、修改和管理代谢模型。\n\n\n\n\n\n# MetExplore\n\nMetExplore 是一个协作性的 Web 应用程序，支持草拟代谢模型的策展、注释、可视化和共享。MetExplore\
  \ 旨在增强此前重构的模型，为用户提供高级工具，用于精炼和注释代谢网络，从而提高其在下游分析中的准确性和实用性。研究人员可以直接在平台内执行关键的分析功能，包括\
  \ `FBA`、`FVA` 以及基因和反应必需性评估，这些有助于对代谢依赖关系和瓶颈进行深层次的探索。MetExplore 还提供了一个全面的可视化系统，使用户能够创建所选子网络的图表表示，并可视化网络内部的\
  \ `GPR` 关系。这种视觉功能对于绘制特定感兴趣区域以及理解模型中基因和反应的功能角色特别有用。通过将策展、注释、分析和可视化能力整合到单一平台中，MetExplore\
  \ 支持协作性的代谢模型精炼，使其成为旨在共享、改进和探索草拟代谢模型的研究人员的极具价值的工具。\n\n表格列出了 20 种可用于自动化基因组规模代谢网络重建以及进一步分析、策展或通路可视化的工具。正文中概述了每个工具的优缺点。工具在表中的列表顺序按照它们在文中出现的顺序。\n\
  \n## 2.4 自动生成 GSM 集的应用\n\n自动化 GSM 工具通过大幅缩短重建所需的时间并消除对大量手动策展的需求，实现了便捷、易获取的代谢网络重建。除了易用性外，自动化\
  \ GSM 还使科学家能够提出高水平的问题，并针对大类生物（例如所有病原体、所有肠道微生物组的成员）产生生物学假设，这对于基于单个生物的手动策展 GSM 来说很难实现的。例如，自动化\
  \ GSM 方法可以实现大规模社区建模，允许对社区成员之间的相互作用进行预测。近期，创建了多个大型自动生成 GSM 集合，并一直被用于解决各种生物学问题以及提出生物学假设，而这些问题通过单个的手动策展\
  \ GSM 是无法解决的。\n\n### 2.4.1 AGORA – 773 个 GSM\n\nAGORA 集合由 773 个自动生成的人类肠道细菌 GSM 组成，代表\
  \ 205 个属和 605 个种。该 GSM 集的创建目的是推断整个人类肠道微生物组的代谢能力。这一自动生成的 GSM 集合是最早的集合之一，创建于 2016\
  \ 年。从那时起，AGORA 一直是代谢网络建模社区的基石资源。\n\nAGORA 资源已用于许多与微生物组和肠道健康相关的生物学研究。一个有趣的应用使用了 AGORA\
  \ 集合中的 GSM 来识别与过激性肠病（IBS）患者肿瘤坏死因子激动剂疗效相关的肠道微生物代谢功能。AGORA 数据库中的 773 个 GSM 用于预测炎症性肠病（IBD）和风湿性疾病患者与健康对照之间人类肠道微生物的代谢生化相互作用。通过使用\
  \ GSM，他们确定肠道微生物组中的拮抗相互作用在 IBD 治疗初期减少，并在治疗结束时趋于恢复。此外，在炎症状态下观察到物种间的竞争增加，表明肠道微生物组群在炎症状态下的稳定性较低。该研究的结果通过临床数据得到了部分验证，证明了利用\
  \ AGORA 资源进行具有生物学意义的计算预测。\n\n另一项研究使用 AGORA 集合识别了与帕金森病相关的肠道微生物组代谢功能。根据帕金森病患者和健康对照粪便样本中的物种存在情况，从\
  \ AGORA 数据库中选择了 243 个 GSM。使用这些 GSM 和社区建模技术，他们识别了帕金森病患者改变的代谢产物分泌潜力。具体而言，他们观察到帕金森病患者与\
  \ `Cysteine-Glycine` 生成之间存在年龄依赖性。尽管这种相关性并非特别强，但这项研究代表了向系统生物学方法的一步，用于识别肠道微生物组与神经系统疾病之间的相互作用。\n\
  \n### 2.4.2 EMBL GEMs – 5,587 个 GSM\n\nEMBL GEMs（基因组规模模型）集合由使用 `CarveMe` 工具创建的 5,587\
  \ 个细菌代谢模型组成。该集合中的 GSM 代表了菌株水平的细菌代谢多样性。在创建时（2017 年），它是最大的 GSM 集合。自 2017 年以来，EMBL\
  \ 集合已用于探索各种生物学课题，我们将在下讨论其中两个。\n\nCarveMe 生成的 EMBL GEMs 之前已用于社区建模应用。一项 2024 年发表的研究使用了\
  \ 331 个肠道细菌 EMBL GEMs 来识别肠道微生物群内部以及微生物与肠上皮细胞之间的竞争、中性和共生相互作用。通过使用多目标优化方法，他们证明了在营养共同限制的情况下，两种物种通过利用共生相互作用可以获得更好的适应度。此外，他们证明了饮食在调节这种共生相互作用中起着重要作用，强调了饮食组成对肠道微生物组功能的影响。\n\
  \nEMBL 集合还被另一项研究用于深入理解肠道微生物组成员的色氨酸代谢。在这项研究中，EMBL 集合中所有的 5,587 个 GSM 被用于开发一个致力于宿主背景下色氨酸代谢的数据库和分析平台，使用了\
  \ EMBL GSM 的代谢信息。色氨酸代谢数据库 `TrpNet` 包含了涉及 1,246 人类肠道细菌种和 88 小鼠肠道细菌种的 130 反应、108 代谢物和\
  \ 91 酶的数据。\n\n### 2.4.3 MetaGEM – 447 个 GSM\n\n在验证 `MetaGEM` 工具期间，作者生成了一个包含 447\
  \ 个基于宏基因组的 GSM 的集合，这些 GSM 可在公共 Zenodo 存储库中获取。这 477 个 GSM 是基于五项之前发表的独立宏基因组研究创建的。虽然\
  \ MetaGEM 工具在该领域已被许多人使用，但该 GSM 集合的利用率较低。尽管如此，MetaGEM 的创建者仍使用他们的 GSM 集合对人类肠道社区进行建模，以验证其流程。\n\
  \n\n\n\n在这项验证研究中，研究人员使用了 GSM（基因组规模）集合来研究健康个体和 2 糖尿病患者肠道微生物组中潜在的微生物代谢相互作用。他们发现了 22\
  \ 种在疾病组之间存在显著差异的化合物交换。此外，他们识别出了 27 种供体微生物和 27 种受体微生物，在糖尿病患者与健康对照组中，它们与其他社区成员相比具有显著不同的交叉培养相互作用（例如\
  \ `Bifidobacterium`、`Faecalibacterium`、`Roseburia` 和 `Ruminococcus` 属）。这些结果与之前的一些实验结果一致，表明该微生物集合能够区分糖尿病和健康对照微生物组的代谢差异。此外，通过直接对社区水平的微生物组进行建模，他们识别出了不依赖于丰度估算的\
  \ 2 型糖尿病微生物组中的潜在相互作用差异，强调了开发能够模拟微生物组功能模型的必要性 [8。\n\n### 2.4.4 AGORA2–7,302 GSMs\n\
  \nAGORA2 集合是 AGORA 资源的扩展版本，包含 7,302 个人类肠道微生物 GSM，涵盖 1,738 个物种和 25 个门。该 AGORA2 集合显著增加了原始\
  \ AGORA 集合中的模型数量。该细菌 GSM 集合已用于多种与肠道微生物组、肺微生物组、大西洋鲑肠道微生物组、肥胖、结直肠癌和食品微生物学等生物学问题。\n\
  \n例如，2023 年发表的一项研究使用了 AGORA2 数据库中的 `A. fumigatus` 菌株，以更好地理解它们在肺微生物组中的生长依赖。具体，他们使用\
  \ AGORA2 GSM 识别了 `A.fumigatus` 基因组的核心和独特反应，识别了环境与临床菌株特异性 GSM 之间代谢活性不同的反应，并证实了实验验证数据。通过这些\
  \ GSM，作者最终确定，在囊性纤维化的背景下，其他肺细菌提供的芳香氨基酸可能对 `A.fumigatus` 的生长产生有益影响。此外，他们确定有 53 种反应在囊性纤维化条件下具有显著的通量变化，其中若干反应与莽糖酸途径有关。这些结果共同表明，芳香氨基酸可能对真菌定植，并对囊性纤维化肺疾病的严重程度具有影响\
  \ [13。\n\n### 2.4.5 PATHGENN – 914 GSMs\n\nPATHGENN 集合包含 914 个具有高质量基因组序列的所有已知人类细菌病原体的\
  \ GSM，包括 345 个物种和 9 个门。该集合使用 `Reconstructor` 工具创建，是目前唯一公开的病原体 GSM 集合。PATHGENN 集合用于识别共享生理生态位的细菌物种中独特的靶点基因。除了这一应用外，PATHGENN\
  \ 集合未来有望成为一个宝贵的资源，用于抗生素鉴定、难以*体外*培养的病原体的计算模拟以及病原体泛基因组分析 [7。\n\n## 2.5 自动化 GSM 开发领域的未来方向\n\
  \n自动化 GSM 工具对于快速生成数千种细菌的 GSM 非常有价值，能够实现快速的生物学假设生成和代谢模拟。虽然 GSM 构建自 1999 年手动创建 `H.\
  \ influenzae` GSM 以来已经取得了巨大进步，但仍有改进空间。目前的自动化 GSM 方法能够快速创建 GSM，但并不总是能产生高质量、适用于模拟、兼容基于\
  \ COBRA 的分析工具或易于使用的 GSM。由于这些缺点，人们越来越兴趣通过将机器学习技术整合到模型生成中、纳入迭代策展过程，并改进工具维护、GSM 集合标准以及标准化，来让这些自动化工具生成更高质量的\
  \ GSM。\n\n通过将机器学习技术整合到模型生成中、纳入迭代策展过程并改进工具维护、GSM 集合标准化，人们的兴趣日益增加。\n\n机器学习技术整合到自动化\
  \ GSM 方法中可以实现更高质量的 GSM 重构。目前很少有研究将机器学习方法集成到 GSM 创建中进行表型预测。一项研究使用了 `PCA` 等无监督机器学习对代谢组数据进行处理，以识别可以作为\
  \ GSM 约束的关键代谢物 [49。未来，可能有机会利用深度学习方法自动将多组学数据整合到 GSM 中，以增加生物相关性和生成 GSM 的质量。然而，这一想法尚未被纳入任何现有的自动化\
  \ GSM 开发工具。\n\n另一种提高自动生成 GSM 质量的方法是通过实验验证进行迭代模型策展。使用 `Biolog` 板板进行碳源利用实验是验证计算模型预测的一种方法。虽然这种方法为模型策展提供了价值信息，但它并不是一个自动化过程。最近开发的方法使用\
  \ `AI` 系统执行自主实验，以更全面地绘制微生物代谢。这种方法通过 `AI` 驱动的实验实现了高通量的实验数据收集 [50。这种方法可用于开发实验驱动的方法自动生成高质量、经过实验验证且生理相关的\
  \ GSM。将实验模型策展整合到自动化 GSM 工具中可能是生成下一代高质量代谢模型的关键。\n\n## 2.6 结论\n\n第一个 GSM (`H. influenzae`)\
  \ 于 1999 年手动创建。从那时起，数千种细菌和真菌 GSM 通过手动和自动化 GSM 工具创建。自动化 GSM 创建工具对于快速生成大量高质量 GSM 集合非常有价值，这些集合随后可用于生物学假设生成或进一步的计算机分析。将机器学习方法整合到自动化\
  \ GSM 方法中、引入如 `AI` 驱动的自动化实验等迭代模型策展过程，以及工具维护和模型格式的社区标准，将使这些方法变得更加准确和强大。\n\n# 参考文献\n\
