  \n# 第 8 章\n\n## 数字取证与事件响应\n\n在本章中，你将：\n- 理解基础取证程序\n- 理解常见的事件响应程序\n\n`Computer forensics`\
  \ 无疑是计算机安全领域的一个流行术语。本章介绍了计算机取证的关键方面，为准备 `CompTIA Security+` 认证考试。它并不是关于在法庭上证据证据法律教程。这些原则在进行任何调查过程（包括内部或外部审计程序）时都具有价值，但处理法律案件的许多细节远超本文的范围。\n\
  \n`forensics` 一术语与将科学知识应用于法律问题有关。具体来说，计算机取证涉及对计算机数据的保护、识别、记录和解释。在今天的实践中，计算机取证可以出于三个目的进行：\n\
  - 对违反法律行为相关的计算机系统进行调查和分析\n- 对符合组织政策的计算机系统进行调查和分析\n- 对受远程攻击的计算机系统进行调查\n\n最后一点通常被称为\
  \ `incident response`，可以是前者的子集。\n\n### 取证程序\n\n以下四步流程与数字调查相关。这些步骤属于大类：\n\n1. **收集\
  \ (Collection)**：涉及搜索、识别和收集证据的步骤。\n2. **检查 (Examination)**：为了提高证据可见性而采取的步骤。这涉及揭示被隐藏的信息。\n\
  3. **分析 (Analysis)**：为了以结构化的方式组织证据以便后续诉讼中使用而采取的步骤。这包括对特定元素的来源、重要性和真实性的解释。\n4. **报告\
  \ (Reporting)**：为了创建包含检查细节的书面报告而采取的步骤。\n\n任何取证过程的一个重要元素是定义调查的 `scope`（范围）。无论是单台机器、一系列机器，还是跨越多台机器的特定活动，这些信息都至关重要，因为它定义了取证过程所有方面的边界。范围越大，调查所需的资源就越多。如果范围太大，相关材料可能会在所有被认为在范围内的材料中丢失。如果范围定义得太窄，相关数据可能无法被收集，从而无法进行调查。\n\
  \n### 收集 (Collection)\n\n证据由在法庭上可采纳的文件、口头陈述和实体组成。证据对于说服层、陪审团、法官或其他当局发生了某种违规行为至关重要。记录收集证据过程中采取的所有步骤至关重要，因为这些步骤在法庭上可能会受到质疑，而记录所示所遵循的流程将是证明流程真实性的唯一依据。\n\
  \n提交证据具有挑战性，但在使用计算机时甚至更具挑战性，因为涉及的人员可能没有受过技术教育，因此可能无法完全理解情况。在收集证据时，请记住这些点：\n- 谁收集了证据？\n\
  - 是如何收集的？\n- 在哪里收集的？\n- 谁拥有过证据？\n- 证据是如何被保护和存储的？\n- 证据何时从存储中取出？为什么？谁接管了证据？\n\n\n\
  \n\n\n计算机证据带来了更多挑战，因为数据本身无法通过物理感官进行感知——也就是说，你可以看到打印出来的字符，但无法看到存储这些数据的位（bits）。数据位仅仅是磁盘或其他存储技术上的磁性脉冲。因此，数据必须始终通过某种“过滤器”进行评估，而不是通过人类感官直接感知。这通常是审计人员关注的重点，因为良好的审计技术建议访问原始数据或尽可能接近原始数据的版本。\n\
  \n### 证据标准\n\n为了具有可信力，特别是当证据将用于法院诉讼程序或可能面临法律挑战的纪纪律措施时，证据必须符合三个标准：\n\n- **充分证据**：证据必须具有说服力或无庸置疑。\n\
  - **胜格证据**：证据必须符合法律规定且可靠。\n- **相关证据**：证据必须对案件至关重要，或对正在处理的问题有影响。\n\n### 证据类型\n\n\
  并非所有证据都是同等的。某些证据比其他较弱的证据更强、更好。以下几种证据可能是相关的：\n\n- **直接证据**：证明特定事实的口头证言（例如目击者的陈述）。事实的知识是通过证人的五感官获得的，不包含任何推理或假设。\n\
  - **物证**：也称为关联证据或物理证据，包括证明或反驳某项事实的实体。物证将嫌疑人与犯罪现场联系起来。\n- **书证**：以业务记录、打印输出、手册等形式呈现的证据。与计算机犯罪相关的大部分证据都是书证。\n\
  - **示证证据**：用于帮助陪审团，可以采取模型、实验、图表等形式提供，用于证明事件的发生。\n\n### 关于证据的三条规则\n\n物品在案件中被法官采用时即可成为证据。三条规则指导着证据的使用，特别是当其可能导致法院诉讼时：\n\
  \n- **最佳证据规则**：法院倾向于使用原始证据而非副本，以确保证据没有发生任何更改（无论是故意的还是无意的）。在某些情况下，可以接受证据副本，例如原始证据因自然灾害或正常业务过程中丢失或销毁时。当法院传唤权力之外的第三方拥有原始证据时，副本也是可以接受的。在许多情况下，只要提供了完整性证明，数字记录的副本可以在法院中使用。\n\
  \n![image](img/note.jpg)\n\n**注意** 证据规则存在于联邦和州级且各不相同。数字证据并不总是被视为“文字”，也不总是适用于最佳证据规则。\n\
  \n- **排除规则**：美国宪法修正修正案禁止了非法搜索和查封。因此，任何违反第四修正案收集的证据都不能作为证据采纳。此外，如果证据是在违反《电子通信隐私法》（`ECPA`）或其他美国法典的相关违规行为或法律的情况下收集的，则其可能无法被法院采纳。例如，如果公司没有关于电子监控网络流量或系统的意图政策，且员工没有通过签署协议确认该政策，嗅探网络流量可能构成对\
  \ `ECPA` 的违反。\n- **传言规则**：传言是间接证据——由证人提供的、并非基于证人个人知识，而是为了证明所断言事项真实性而提供的证据。通常，计算机生成的证据被视为传言证据，因为证据的制作者（计算机）无法接受质问。在法院接受\
  \ `logs` 和 `headers`（计算机生成的材料）等项目时，存在例外情况。\n\n![image](img/note.jpg)\n\n**注意** 这里提到的法律是美国法律。\n\
  \n### 处理证据\n\n当信息或物体提交给法院时，确保数据不被篡改至关重要。对于数字证据尤其是如此。证据必须经过适当的获取、保护、传输和存储。\n\n###\
  \ 捕捉系统镜像\n\n对计算机的物理内存进行镜像或转储（dumping）有助于识别硬盘上不可用的证据。一旦内存完成镜像，你可以使用十六进制编辑器分析镜像。（内存转储工具和十六进制编辑器可用）。注意，在追求法院诉讼的情况下，转储内存更适用。另一种系统镜是内部存储设备的镜像。对所有分区制作法证副本是保护证据的关键步骤。法证副本是位拷贝，并具有哈希形式的完整性检查。正确的做法是在制作驱动器的法证副本时使用写保护器。该设备允许读取磁盘，但防止对磁盘进行任何写入操作，保证复制操作不会更改原始数据。一旦创建了法证副本，就可以从主法证副本创建工作副本用于分析并与其他调查人员共享。使用哈希值提供了一种证明所有副本之间以及原始数据均一致的方法。\n\
  \n### 哈希值\n\n如果文件、`logs` 和其他信息将被捕获并用证据，你需要确保数据没有被修改。在大多数情况下，使用实现哈希算法以创建消息摘要的工具。\n\
  \n*哈希算法*执行的功能与熟悉的校验位、校验和或循环冗余校验（`CRC`）类似。它对数据流（或文件）应用数学运算，以计算出一个基于数据流（或文件）中所含信息的唯一数字。如果随后在相同数据流上创建的哈希产生了不同的哈希值，通常意味着数据流被更改了。\n\
  \n哈希算法背后的数学原理已经过广泛研究，尽管两个不同的数据流可能产生相同的摘要，但概率极低。这是一个经过严格审查的密码学领域，消息摘要 5（`MD5`）和安全哈希算法（`SHA`）背后的数学原理非常稳健。2005\
  \ 年，`MD5` 和 `SHA` 算法发现了缺陷，导致美国国家标准与技术研究院（`NIST`）宣布了一项寻找名为 `SHA-3` 的新加密哈希算法的竞赛。尽管\
  \ `MD5` 仍在在使用，最佳实践是使用 `SHA-2` 系列，并在 `SHA-3` 集成到工具后使用它。\n\n\n\n\n\n哈希工具应用于每个文件或日志，并将消息摘要值记录在调查文档中。将日志写入一次性写入介质（如\
  \ CD-ROM）是一项良好的做法。当案件实际进入审判时，调查人员可能需要再次对文件或日志运行该工具，以证明它们没有经过任何形式的修改。\n\n![image](img/note.jpg)\n\
  \n**注意** 现今硬盘上存储的文件数量可能非常大，多达几十万个。显然，对于调查人员来说，分析这些文件实在太多了。然而，通过将最流行软件产品安装的文件消息摘要与被分析驱动器上的文件的消息摘要进行比对，调查人员可以避免分析大约\
  \ 90% 的文件，因为他可以假设这些文件未被修改过。国家软件参考库（NSRL）从各种来源收集软件，并将文件特征整合到参考数据集（RDS）中，作为服务提供下载。参见\
  \ [www.nsrl.nist.gov](http://www.nsrl.nist.gov)。\n\n### 记录时间偏移\n\n计算机上记录的文件和事件具有基于机器本身时钟时间的时间戳标记。假设该时钟是准确的是一个错误。为了将计算机内部记录的时间戳数据与任何外部事件进行关联，必须知道机器时钟与实际时间之间的任何偏移。\n\
  \n### 网络流量与日志\n\n调查中的一个重要信息源可以是与设备相关的网络活动。与网络基础设施相关的网络日志中可能包含大量有用信息。这些信息的深度和广度取决于调查范围。虽然最好的数据来自现场网络取证采集过程，但在大多数情况下，这种类型的数据是不可用的。还有许多其他网络取证数据源，包括防火墙和\
  \ IDS 日志、网络流数据，以及关键服务器和服务的事件日志。\n\n### 视频拍摄\n\n在采集时捕捉重要信息的一种方便方法是视频拍摄。视频允许高带宽数据采集，可以显示什么连接到了什么上、物体是如何布局的、桌面情况等。一画胜过千言万言，因此请花时间用照片记录一切。序列号以及网络和\
  \ USB 连接的图片在随后的取证过程中可能是无价之宝。在每个取证过程中，完整的文档记录是必不可少的，照片可以极大地帮助捕捉那些需要花费很长时间且容易产生转录错误的细节。\n\
  \n![image](img/examtip.jpg)\n\n**考试提示** 数码相机非常适合记录场景和信息。也可以获取活动显示器图像的截图。照片可以详细说明如序列号牌、机器、驱动器、电缆连接等元素。照片确实胜过千言万语。\n\
  \n### 截图\n\n应特别注意证据采集时屏幕上的显示状态。一旦系统更改或断电，视频屏幕上的信息就会丢失。通过截图、使用数码相机或摄像机，可以提供采集时屏幕上内容的文档记录。由于你无法信任系统内部免受篡改，请勿使用内部截图捕捉方法。\n\
  \n### 证人\n\n记住，证人的信誉至关重要。可以想象，如果询问证人“你是否锁定了文件系统？”而他无法给出肯定回答，信誉会损害得有多快。或者，当询问“当你对此磁盘驱动器进行镜像时，使用的是新系统吗？”证人无法回答目标磁盘是新的，或者在数据拷贝之前已使用低级格式进行了完全格式化。\n\
  \n### 检查\n\n当事件发生时，你需要收集数据和信息以促进你的调查。如果有人正在实施犯罪或故意违反公司政策，那个人可能会试图掩盖踪迹。因此，你应该尽快收集尽可能的信息。在当今高度网络化的世界中，证据不仅可以在工作站或移动设备上找到，还可以在公司文件服务器、安全设备以及位于互联网服务提供商（ISP）处的服务器上。\n\
  \n当事件发生且要保护使用的计算机时，你必须考虑两个问题：它应该关闭吗？它应该断开网络吗？取证专业人士对于开启或关闭计算机的原因存在争议。有些人认为应该拔掉电源以冻结计算机的当前状态。然而，这将导致与正在进行的攻击相关的任何数据丢失。`RAM`\
  \ 中的任何数据也将丢失。此外，它可能会损坏计算机的文件系统，并可能让你发现的有效性受到怀疑。\n\n另一方面，计算机犯罪可能会留下留下你不知道的软件炸弹，你执行的任何命令（包括关闭或重启系统）都可能破坏或修改文件、信息或证据。犯罪分子可能预料到了此类调查并更改了系统的某些二进制文件。\n\
  \n此外，如果被分析的计算机是服务器，管理层不太可能将其离线并关闭进行调查。因此，从调查的角度来看，这两种方案都可能是正确的也可能是错误的，取决于事件发生周围的情况。最重要的是你在工作中要审慎，记录你的行动，并能够解释你为何采取这些行动。\n\
  \n在识别证据时，保持有条理是极其重要的。不要独自收集证据——让第二个人可以作为你行动的证人。在取证、分析和存储期间都要记录你的行动日志。这里显示了一个示例日志：\n\
  \n![image](img/t0137-01.jpg)\n\n### 易失性顺序\n\n计算机系统中有很多数据源，如果机器正在运行，这些源中的某些可能是易失的。像\
  \ CPU 状态及其寄存器等事物一直在变化，内存和存储也是如此。这些元素往往以不同的速率变化，你应该注意易失性顺序，以便将采集重点放在需要的地方。\n\n电子数据的采集是一项艰巨的任务。在某些情况下（例如易失数据），可能只有一次机会采集它，之后它将永久丢失。易失信息位置（如\
  \ `RAM`）不断变化，数据采集应按照易失性或数据的寿命进行。\n\n以下是数字信息的易失性顺序：\n\n1. `CPU`、缓存和寄存器内容（优先采集）\n\
  2. `路由表`、`ARP 缓存`、`进程表`、`内核统计`\n3. `实时网络连接和数据流`\n4. `内存 (RAM)`\n5. `临时文件系统/交换空间`\n\
  6. `硬盘上的数据`\n7. `远程日志数据`\n8. `存储在归档介质上的数据`（最后采集）\n\n\n\n\n\n在收集数字证据时，使用适当的技术和工具至关重要。关键要素包括：在制作取证副本时使用`write\
  \ blockers`（写保护器）、哈希并验证哈希匹配、记录处理和存储过程，以及保护媒介免受环境因素的影响。特别需要注意的是，系统中存在的数据取决于文件系统和所用硬件。物理硬盘驱动器的数据持久化时间比固态硬盘长。具有`journaling`（日志记录）和`shadow\
  \ copies`（影子拷贝）的新型文件系统比基于`File Allocation Table` (`FAT`) 的旧系统具有更长的信息持久性。由于文件系统管理数据的方式，在某些文件系统中，在数据被重写或删除很久后仍可以恢复出`Raw\
  \ disk blocks`（原始磁盘块）。\n\n* *\n\n![image](img/examtip.jpg)\n\n**考试提示** 取证过程中后期需要的一个常见数据元素是相对于准确的外部时间源的准确系统时间。通过使用外部时钟（如`Network\
  \ Time Protocol` (`NTP`) 服务器）测量系统时间可以计算出记录的时间偏移。如果系统关机，此信息可能会丢失，因此最好在系统仍在运行时进行收集。\n\
  \n### 分析\n\n取证意义上的分析过程是从分离的元素构建一幅图景。在许多情况下，收集到的信息碎片呈现的是部分画面。通过这些碎片，通常可以对材料进行分析，并就发生的情况确定各种可能性。然后，可以寻求额外信息来支持或排除从初始数据收集中提出的各种可能性。\n\
  \n当无法获得额外信息、信息不完整或无法缩小范围时，报告将需要反映无法支持单一结论。\n\n#### 大数据分析\n\n`Big data`（大数据）指的是在业务流程中使用极大量数据集的新兴现象。大数据可以以两种方式参与取证：首先，最重要的是，许多更大范围的调查会导致大数据集的产生，至少从以前计算机用户常见的规模来看是如此。`Terabyte\
  \ drives`（TB 级硬盘）可能包含数百万条记录，而发现、恢复、排序和分析数百万个项目的过程已超了人的直接能力。现代数字取证工具提供了答案，因为它们可以索引并处理海量数据。缺点是时间。对于\
  \ TB 级和大型记录集，搜索、索引和哈希等功能可能需要数天的专用计算机运行时间来处理。\n\n自动化取证工具还允许高级操作，例如时间线操作。系统上的每个文件都有一组被称为`MAC\
  \ data` 的元数据。这些数据记录了文件的修改、访问和创建时间。如果已知事件发生的时间，那么对该时间的所有文件活动进行搜索就可以提供有关系统正在发生情况的信息。由于文件结构具有文件夹和文件的层级结构，且\
  \ `MAC times` 不易于被 `OS` 操纵，加之可能涉及数千个目标，需要特定的工具来按时间查找和索引活动。\n\n另一个方面是响应数字取证请求的大数据分析。如果涉及具有\
  \ PB（拍字节）及以上数据数据的系统，那么对存储数据的数千个设备进行简单搜索将成为一项重大挑战。在这些情况下，取证人员需要数据所有者的配合，因为需要使用他们管理数据的工具来应对数据的复杂性和庞大规模。今天，这种问题仅存在于少数公司，大型电信运营商、互联网公司和某些机构。\n\
  \n### 报告\n\n报告是取证不可或缺的元素，因为它向需要的人传达结果。\n\n#### 跟踪工时和费用\n\n在取证过程中执行的努力和任务在法庭上可能会成为问题。对工时和费用进行可靠的核算可以提供必要的信息。\n\
  \n#### 监管链\n\n证据一旦收集，就必须妥善控制以防止篡改。监管链（Chain of Custody）记录了所有处理或接触过证据的人员。监管链显示了谁获取了证据、何时以及何地存储，以及自获取以来一直由谁持有。\n\
  \n以下显示了监管链的关键步骤：\n\n1. 记录收集的每件物品。\n2. 记录收集证据的人以及收集日期和时间。\n3. 在文档中编写证据的描述。\n4. 将证据放入容器中，并在容器上贴上案件号、收集人姓名以及收集或放入容器的日期和时间。\n\
  5. 在文档中记录所有消息摘要（`hash`）值。\n6. 将证据安全地运输到受保护的存储设施。\n7. 获取在该存储设施接收证据人员的签名。\n8. 提供控制措施，防止证据在存储期间被访问和遭到破坏。\n\
  9. 将证据安全地运输到法庭进行诉讼。\n\n\n\n\n\n`Incident response`（应急响应）是一个术语，用于描述组织在计算机系统运行被确定为异常的情况下时所采取的步骤。事件的原因有很多，从环境因素（风暴）到用户错误，再到未经授权用户的非授权行为等。尽管原因可能很多，但其结果可以归类为几类。低影响事件可能不会导致任何重大的风险暴露，因此除了修复损坏的系统外不需要采取其他行动。中等风险事件将需要更严格的审查和响应努力，而高水平风险暴露事件将需要最严格的审查。为了在事件发生时进行管理，需要创建一个应急响应团队指南表，以帮助确定响应级别。\n\
  \n两个主要要素在决定响应水平方面起着作用。信息的关键性是首要决定因素因素，这源于数据分类和涉及的数据量。丢失一个管理员密码比丢失所有密码要严重得多。第二个因素涉及关于该事件如何影响当前业务运营的业务决策。一系列违规行为（无论大小如何）都表明存在一种可能引发公共关系和监管问题的模式。\n\
  \n应急响应循环是快速记忆计算机取证关键步骤的快捷方法。图 8-1 形象地展示了应急响应循环。它包含五个关键步骤：\n\n1. **发现并报告**：组织应该实施一套事件报告流程，以确保潜在的安全违规以及常规应用程序问题都能尽快得到报告和解决。应该对员工进行如何报告系统问题的培训。\n\
  2. **确认**：专家或响应团队成员应审查事件报告，以确认是否发生了安全事件。应记录并保留详细笔记，因为它们对随后的调查可能具有至关重要的价值。\n3. **调查**：由网络、系统和应用程序专家组成的响应团队应该应对该事件进行详细调查，以确定事件的范围并制定恢复计划。\n\
  4. **恢复**：此时调查已完成并记录在案。采取措施将系统和应用程序恢复到运行状态。\n5. **教训总结**：应召开事后总结会议收集学到的教训，并分配行动项以纠正弱点并建议改进方法。\n\
  \n![image](img/f0142-01.jpg)\n\n**图 8-1** 应急响应循环\n\n应急响应活动有时与涉及  的其他 IT 活动密切相关。应急响应活动可能与灾难恢复和业务连续性操作相似。应急响应活动并非在真空环境中进行，而是与许多操作程序紧密相连，这种联系是整个系统效率的关键。\n\
  \n### 准备\n\n应急响应是安全人员在响应各种触发事件时执行的一系列行动。这些行动广泛且多样化，因为它们必须处理各种原因和后果。通过使用结构化框架并配合适当准备的流程，应急响应变成了一项可管理的任务。如果没有适当的准备，这项任务可能会变得无法完成或成本极其高昂。成功处理事件是恰当准备的直接结果。\n\
  \n#### 第一响应者\n\n第一响应者必须尽可能控制损害或证据丢失。显然，随着时间的推移，证据可能会被篡改或销毁。查看桌面、通讯录簿（Rolodex）、键盘下方、桌面存储区域以及隔间公告板，寻找任何可能相关的信息。妥善软盘、光盘、闪存卡、USB\
  \ 驱动器、磁带和其他可拆卸介质。尽快请求日志副本。大多数互联网服务提供商（ISP）都会保护可能被传唤的日志。拍摄照片（某些地区要求使用宝丽胶照片，因为这种照片在不留明显痕迹的情况下更难以修改）或录像带。包括运行计算机屏幕和硬件组件的多角度照片。确保在拆卸内部组件进行分析之前对其进行拍照。\n\
  \n#### 应急响应团队\n\n虽然对事件的初始响应可能由个人（如系统管理员）处理，但事件的完整处理通常需要整个团队。应急响应团队是一组准备并响应任何紧急事件（如自然灾害或业务中断）的人员。应急响应团队通常利用各种技能来完成工作。应急响应团队在企业和公共服务组织中都很。\n\
  \n应急响应团队成员理想情况下接受过培训，能够胜任特定情况所需的角色（例如在大规模事件中担任事件指挥）。应急响应团队的大小通常根据事件的规模和性质进行调整，随着事件规模扩大以及更多资源的投入，局势可能会经历几个阶段。\n\
  \n在小规模事件中，或者在小型公司的情况下，通常只有志愿者或临时团队存在并响应。当事件超出应急响应团队的控制范围时，存在行业团体和政府团体来协助处理。\n\n\
  为了及时高效地运作，理想情况下，团队已经定义了协议或行动方案，以减轻大多数常见事件形式的负面影响。\n\n### 事件识别\n\n`incident`（事件）被定义为偏离正常常规操作的情况。事件是否重要是应急响应流程中的第一个决策点。单次登录失败在技术上是一个事件，但如果随后是正确登录，那么它就没有后果。事实上，这甚至可以被认为是正常现象。但系统出现\
  \ 1 万次失败尝试，或者大量账户出现失败则明显不同，并值得进一步调查。\n\n关键的第一步是处理信息并确定是否启动应急响应流程。事件信息可以来自各种来源，包括日志、员工、帮助电话、系统监控、安全设备等。\n\
  \n### 升级与通知\n\n当操作人员获知信息阈值并决定升级局势时，应急响应流程进入通知和升级阶段。并非所有事件的风险特征都相同，应急响应工作应与事件相关的实际风险水平相匹配。\n\
  \n\n\n\n对与事件相关的风险进行评估是重要的第一步。如果事件的特征包括大量发往机器上不同服务的数据包（这种攻击通常被称为`port scan`扫描），那么所需的行动与响应大量发往单个机器服务的数据包所需的行动是不同的。端口扫描是常见的，且在某种程度上是相对无害的，而端口泛洪可能导致拒绝服务。在优先考虑响应措施时，确定具体的下游风险至关重要。\n\
  \n### 缓解步骤\n\n所有存储的数据都面临泄露或妥协的风险。在这一假设下，问题变成了：哪种最佳缓解策略可以降低与泄露或妥协相关的风险？数据在数据生命周期的三个状态中都需要保护：存储中、传输中和处理中。由于几个因素，每个状态的风险水平不同：\n\
  \n- **时间**：数据在存储状态中花费的时间较长，因此面临泄露或妥协的时间也更长。数据在传输和处理中的时间较短。\n- **数量**：存储中的数据被泄露或妥协的数量通常比传输中的数据更多，而处理中的数据甚至更少。如果记录在处理过程中被泄露，则只有正在处理的记录面临风险。\n\
  - **访问**：每个领域都存在不同的保护机制，这直接影响与泄露或妥协相关的风险。操作系统倾向于采取非常严格的控制，以防止跨进程的数据问题，如错误和污染。\n\n\
  处理风险的下一个方面是进程内访问，各种攻击技术专门针对这一通道。传输中的数据面临各种网络层攻击和漏洞导致的泄露或妥协风险。其中一些风险在企业的控制之下，另一些则不是。\n\
  \n首要的缓解步骤是数据最小化。数据最小化工作在运营效率和安全方面都起着关键作用。与数据相关的规则之是：不要保留你不需要的东西。一个简单的例子是垃圾邮件修复。如果垃圾邮件在进入邮箱之前就与电子邮件分离，就可以断定它不是邮件，且不受存储、备份或数据保留问题的影响。由于垃圾邮件可能占入入邮件的\
  \ 50%以上，这可以从速度和成本上极大提高运营效率。\n\n这一原则同样适用于其他形式的信息。在处理信用卡交易时，实际交易需要某些数据元素，但一旦交易获得批准，它们就不再具有进一步的业务价值。存储这些信息无法提供业务价值，但在数据泄露的情况下，它确实代表了风险。对于信用卡信息，与数据元素相关的规则法规受合同约束并由支付卡行业数据安全标准（`PCI\
  \ DSS`）管理。数据存储不应取决于你能存储什么，而应取决于业务需要存储什么。未存储的数据不会面临泄露风险，将存储最小化到仅支持业务需求的内容可以降低企业的风险和成本。\n\
  \n最小化工作在数据进入系统之前就开始了，更不用说泄露了。在系统设计期间，会确定并部署适当的安全控制，并进行定期审计以确保合规。这些控制措施基于所保护信息的敏感性。可以辅助选择控制措施的工具之一是数据分类方案。并非所有数据都同等重要，在丢失时的损害也并不相同。在为数据元素设计安全性时，开发和部署数据分类方案可以协助预防性规划工作。\n\
  \n***\n\n![image](img/examtip.jpg)\n\n**考试提示** 数据泄露可能无法完全避免，但可以通过最小化和加密工作来缓解。\n\n\
  ### 教训总结\n\n在报告过程中，会对哪些地方做得对、哪些地方错了、哪些可以改进以及哪些应该继续进行批判性评估，并作为经验教训的形式准备出来。这是自我提升的关键部分，其目的不是指责，而是为了协助未来的预防。在复杂环境中出现问题是正常运营的一部分；而发生可以避免的重复失败则不是。报告中“教训总结”部分的关键在于进行必要的更改，以防止事件再次发生。由于许多事件是攻击者使用已知方法的结果，一旦企业掌握了攻击模式并存在缓解这些模式的方法，那么整个企业的任务就是采取必要行动来缓解未来的事件。\n\
  \n### 报告\n\n系统恢复后，事件响应小组会创建一份事件报告。该报告详细阐述了发现了什么、是如何发现的、做了什么以及结果，它充当了企业的记忆，并可用于未来的事件。建立先验事件及所用行动的知识库是一项宝贵的资源，因为它是基于特定企业的背景。这些报告还提供了一种与管理层就事件进行闭环管理的机制，最重要的是，提供了一份未来用于防止相同或类似性质事件的行动路线图。\n\
  \n报告的一部分将是建议，在适当的情况下更改现有的策略和程序，包括灾难恢复和业务连续性。目标的相似性使得产生了自然的重叠，这些操作之间的交叉融合对于使所有流程尽可能高效至关重要。\n\
  \n### 恢复/重构程序\n\n从事件中恢复的工作涉及几个特定元素。首先，需要确定并解决事件产生的原因。这是通过事件响应机制完成的。在原因确定并纠正之前尝试恢复，通常会导致问题的持续。其次，如果数据是敏感的且易被误用，则需要根据数据丢失的背景、谁会有访问权限以及需要采取哪些业务措施来缓解泄露造成的特定业务损害来进行检查。这可能涉及业务计划的更改，如果泄露使计划变得可疑或受到不利影响。\n\
  \n### 事件隔离\n\n\n\n\n一旦发现并刻画了事件，事件响应过程中最重要的一步就是对问题进行隔离。如果不能被事件响应团队遏制，许多事件可能会扩散到其他机器并扩大损害范围。确定隔离特定机器和服务的步骤可能是一项复杂的工程，而且最好的方法是在事件发生前，通过准备阶段来完成。当特定的机器或服务被攻破时，团队可以调用预先计划的步骤将受感染的单元与其他单元隔离开。这可能会对性能产生影响，但仍比允许攻破扩散导致更多机器被攻破要好。\n\
  \n#### 隔离\n\n隔离机器的一种方法是通过隔离过程。可以允许该机器运行，但切断其与其他机器的连接。隔离可以通过各种机制来实现，包括在防火墙上限制通信。在适当配置的情况下，隔离可以允许机器运行，但为了防止感染扩散，这可能会影响机器的性能。\n\
  \n## 设备移除\n\n设备移除是设备响应的一种极端方式。当某个文件系统被攻破时，物理移除该设备。设备移除是一项耗时的操作。在确保数据没有被数据被封装或包装之前，设备移除。\n\
  \n## 数据泄露\n\n数据泄露是发生在数据访问的结果。在没有获得授权的情况下，数据泄露是文件系统中的。\n\n## 损害与控制\n\n为了防止数据损失，在某些情况下，对数据进行加密。在传输过程中，对数据进行加密。为了确保数据不被网络访问，在存储期间对数据进行加密。在网络中，数据加密是加密的。为了确保数据不被网络访问，数据加密是加密的。在本章中，我们了解了数据泄露。\n\
  \n## 章节回顾\n\n本章介绍了了事件响应的原则。本章还涵盖了数据收集，包括数字取证技术。本章还讨论了事件响应的步骤，包括准备、识别、缓解和教训。\n\n\
